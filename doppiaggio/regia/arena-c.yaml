# Regia del doppiaggio: L'Arena di Qir-Azel
regia:
  una-leggenda: |
    [crowd murmuring] Le luci dell'Arena si abbassano, e la folla smette di urlare e comincia a mormorare. [dramatic] “Un omaggio alla squadra di Liaren” dice Orazio, “la cui avventura termina qui.” Dagli spalti arrivano applausi e fischi insieme, [wry] e oltre la placca di metallo senti Ettore Castaldi che bestemmia.

    [ominous] “E ora l'ultima prova.” La luce del cristallo vira al rossastro, [distorted humming] e il cristallo comincia a vibrare con un suono storto che ti fa male ai denti. [shouting] “Non un mostro” grida Orazio. Sugli spalti cala il silenzio. [slowly] “Non un uomo. Una leggenda.”

    [awed] Dalla luce esce un cinghiale grande come un carro, con le setole grigio-azzurre sempre bagnate e lente vene d'argento che gli pulsano sotto la pelle. Dove posa gli zoccoli lascia sulla sabbia impronte larghe una spanna, e ai bordi la sua sagoma è un poco sfocata. [whispers] [uneasy] Un'eco non dovrebbe avere odore, e questa puzza di fango e di ferro. [crowd screaming] Sugli spalti qualcuno urla di paura, e stavolta fa sul serio.

    [tense] Besk fa un passo indietro e poi lo rifà avanti. Il cristallo alle sue spalle ha una crepa luminosa che prima non c'era. Corin si è fatto bianco, e Tenebra, per la prima volta da quando lo conosci, parla prima di te. [pause] [deadpan] “Dimmi tu.”
  una-leggenda__1-esito: |
    [thoughtful] È il cinghiale della Foresta Strisciante, quello del banchetto al Grifone. Lo riconosci dalla spalla dove l'hai colpito, che nell'eco ha ancora la ferita, e dal modo in cui gira la testa verso destra prima di caricare.

    Corin lo ha riconosciuto anche lui. [trembling] “Ma questo l'abbiamo mangiato” dice con un filo di voce, e poi, più piano, [quietly] “con il vino rosso e le erbe.” [wry] Tenebra lo guarda di sbieco e non fa domande.
  una-leggenda__2-vittoria: |
    [hooves pounding] La bestia carica e tu la aspetti, con Tenebra a un passo e Besk che le brucia gli occhi. [determined] La colpisci dietro la spalla dove il pelo è più rado, finché la bestia crolla e si sfa in una pioggia di schegge pallide. [sparks crackling] Le barriere fra i quadranti esplodono in scintille bianche.

    Nel quadrante accanto restano in piedi soltanto in due, e uno di loro ti fissa senza dire niente. La squadra di Galdrick invece è intatta, e lo sceriffo ti fa un cenno breve. [exhales] Poi i cristalli mandano un ultimo lampo che ti entra nella pelle, e ti senti come dopo una notte di sonno.
  una-leggenda__2-sconfitta: |
    [hooves pounding] La bestia ti travolge alla prima carica, [pained] e da terra vedi Corin mettersi in mezzo con la spada e volare contro la placca. Tenebra e Besk la reggono finché tu ti rialzi, e la finite insieme, in quattro, quando il cristallo ha già quasi smesso di brillare.

    [sparks crackling] Le barriere esplodono in scintille bianche. Nel quadrante accanto restano in piedi soltanto in due. La squadra di Galdrick invece è intatta, e lo sceriffo ti fa un cenno breve. [tired] L'ultimo lampo dei cristalli ti rimette in piedi, ma a Corin non chiude del tutto il taglio sulla fronte, e lui se lo tampona col fazzoletto ricamato.
  una-leggenda__3-successo: |
    [determined] Metti le mani sul cristallo accanto a quelle di Besk e spingete insieme. Tenebra e Corin intanto tengono la bestia lontana. [crystal cracking] La crepa corre dalla base alla punta, e il cinghiale si ferma a metà carica e si sfa in schegge pallide. Le barriere fra i quadranti esplodono in scintille bianche.

    Nel quadrante accanto restano in piedi soltanto in due, appoggiati alle armi. La squadra di Galdrick invece è intatta, e lo sceriffo ti fa un cenno breve. [warm] L'ultimo lampo dei cristalli vale una notte di sonno, e Besk lo prende a occhi chiusi, sorridendo al cristallo come a un compito venuto bene.
  una-leggenda__3-fallimento: |
    [explosion] Il cristallo ti restituisce il Mana tutto insieme e ti scaraventa sulla sabbia, e Besk cade accanto a te. [tense] La bestia la tengono Tenebra e Corin finché vi rialzate, e Corin ci rimette una spalla. Alla fine la crepa si allarga lo stesso e l'eco si sfa.

    [sparks crackling] Le barriere esplodono in scintille bianche. Nel quadrante accanto restano in piedi soltanto in due. La squadra di Galdrick invece è intatta, e lo sceriffo ti fa un cenno breve. [pained] L'ultimo lampo dei cristalli ti rimette in piedi, ma le mani che hai tenuto sul cristallo restano rosse e gonfie, e il ronzio nelle orecchie non se ne va.
  una-leggenda__4-successo: |
    [tense] Aspetti che giri la testa a destra come faceva nella radura, e gridi a Tenebra il lato giusto prima ancora che parta. [metal clanging] Fai battere a Corin la spada sulla placca, e a ogni colpo il cinghiale scarta dalla parte che ti aspettavi e ti offre il fianco. [satisfied] Al terzo scarto Tenebra lo apre, e la bestia si sfa in schegge pallide.

    [sparks crackling] Le barriere esplodono in scintille bianche. Nel quadrante accanto restano in piedi soltanto in due. La squadra di Galdrick invece è intatta, e lo sceriffo ti fa un cenno breve. [exhales] L'ultimo lampo dei cristalli vale una notte di sonno.
  una-leggenda__4-fallimento: |
    La bestia gira la testa a destra come ricordavi, e poi scarta a sinistra, [bitter] perché l'eco ha imparato qualcosa che il cinghiale vero non sapeva. [pained] La zanna ti apre la coscia. Tenebra e Besk la reggono mentre Corin ti trascina via per il colletto, e la finite in quattro, a fatica.

    [sparks crackling] Le barriere esplodono in scintille bianche. Nel quadrante accanto restano in piedi soltanto in due. La squadra di Galdrick invece è intatta, e lo sceriffo ti fa un cenno breve. [tired] L'ultimo lampo dei cristalli ti chiude la pelle della coscia, ma sotto la zanna è arrivata fino all'osso, e quando provi a camminare la gamba non ne vuole sapere.
  una-leggenda__5-successo: |
    [thoughtful] Guardi come muove la testa e capisci che le vene d'argento sono una maschera della Marea, cucita sopra una bestia nata con la paura del rumore. [metal clanging] Fai battere a Corin la spada sulla placca, e a ogni colpo il cinghiale scarta a destra e ti offre il fianco. [satisfied] Al terzo scarto Tenebra lo apre, e la bestia si sfa in schegge pallide.

    [sparks crackling] Le barriere esplodono in scintille bianche. Nel quadrante accanto restano in piedi soltanto in due. La squadra di Galdrick invece è intatta, e lo sceriffo ti fa un cenno breve. [exhales] L'ultimo lampo dei cristalli vale una notte di sonno.
  una-leggenda__5-fallimento: |
    [tense] Ti metti dove dovrebbe scartare, e la bestia scarta dall'altra parte. [pained] La zanna ti apre la coscia. Tenebra e Besk la reggono mentre Corin ti trascina via per il colletto, e la finite in quattro, a fatica.

    [sparks crackling] Le barriere esplodono in scintille bianche. Nel quadrante accanto restano in piedi soltanto in due. La squadra di Galdrick invece è intatta, e lo sceriffo ti fa un cenno breve. [tired] L'ultimo lampo dei cristalli ti chiude la pelle della coscia, ma sotto la zanna è arrivata fino all'osso, e quando provi a camminare la gamba non ne vuole sapere.
  una-leggenda__6-successo: |
    [calm] Dici a ognuno dove stare e perché, e loro restano fermi anche quando la bestia carica dritta su Corin, che tiene la spada alta con gli occhi chiusi. [quickly] All'ultimo Tenebra la devia con la spalla, Besk le brucia il muso, e tu sei già sul fianco. L'eco si sfa in schegge pallide.

    [sparks crackling] Le barriere esplodono in scintille bianche. Nel quadrante accanto restano in piedi soltanto in due. La squadra di Galdrick invece è intatta, e lo sceriffo ti fa un cenno breve. [amused] L'ultimo lampo dei cristalli vale una notte di sonno, e Corin non smette più di ridere.
  una-leggenda__6-fallimento: |
    [tense] Corin scappa un passo di lato quando la bestia carica, e il cinghiale passa dove non doveva. [pained] Ti prende in pieno. La finite in tre, con Corin seduto per terra, quando hai già il sangue in bocca.

    [sparks crackling] Le barriere esplodono in scintille bianche. Nel quadrante accanto restano in piedi soltanto in due. La squadra di Galdrick invece è intatta, e lo sceriffo ti fa un cenno breve. [wry] L'ultimo lampo dei cristalli ti rimette in piedi, ma due costole restano dove le ha lasciate la bestia, e Corin ti chiede scusa fino a sera.
  una-leggenda__7-successo: |
    [solemn] Dici le parole della Liturgia mentre la bestia ti carica, e a ogni parola le vene d'argento si spengono una alla volta. [slowly] Arriva a tre passi da te ridotta a una sagoma di luce grigia, e lì si sfa.

    [sparks crackling] Le barriere esplodono in scintille bianche. Nel quadrante accanto restano in piedi soltanto in due. La squadra di Galdrick invece è intatta, e lo sceriffo ti fa un cenno breve. [exhales] L'ultimo lampo dei cristalli vale una notte di sonno. [thoughtful] In tribuna qualche novizio del Velo si fa il segno, e Besk ti guarda in un modo nuovo.
  una-leggenda__7-fallimento: |
    [hesitant] Ti si inceppa la voce a metà della Liturgia, [eerie] e le parole che non hai finito ti tornano in testa storte, con il grugnito della bestia sotto. [tense] Poi la bestia ti è addosso. Tenebra ti tira via per la cintura, e la finite in quattro, alla vecchia maniera, con il sangue di tutti sulla sabbia.

    [sparks crackling] Le barriere esplodono in scintille bianche. Nel quadrante accanto restano in piedi soltanto in due. La squadra di Galdrick invece è intatta, e lo sceriffo ti fa un cenno breve. [pained] L'ultimo lampo dei cristalli ti rimette in piedi, e la spalla dove ti ha preso la zanna resta livida e dura.
  una-leggenda__8-successo: |
    [calm] Chiudi gli occhi per il tempo di un respiro, in mezzo al frastuono, e lo senti. [quietly] Ha il respiro spezzato del cinghiale della porta nord, quello che l'orco spronava sulle vene, e scuote la testa a destra ogni volta che il metallo gli brucia. [urgent] Gridi a Tenebra di stare a sinistra e fai battere a Corin la spada sulla placca. Il cinghiale scarta dalla parte del dolore e ti offre il fianco, e al terzo scarto Tenebra lo apre. La bestia si sfa in schegge pallide.

    [sparks crackling] Le barriere esplodono in scintille bianche. Nel quadrante accanto restano in piedi soltanto in due. La squadra di Galdrick invece è intatta, e lo sceriffo ti fa un cenno breve. [exhales] L'ultimo lampo dei cristalli vale una notte di sonno.
  una-leggenda__8-fallimento: |
    [crowd screaming] Chiudi gli occhi per ascoltarla, e sugli spalti cinquemila persone urlano tutte insieme. [tense] Il respiro della bestia ti si perde dentro quel rumore, [pained] e quando li riapri la zanna ti ha già aperto la coscia. Tenebra e Besk la reggono mentre Corin ti trascina via per il colletto, e la finite in quattro, a fatica.

    [sparks crackling] Le barriere esplodono in scintille bianche. Nel quadrante accanto restano in piedi soltanto in due. La squadra di Galdrick invece è intatta, e lo sceriffo ti fa un cenno breve. [tired] L'ultimo lampo dei cristalli ti chiude la pelle della coscia, ma sotto la zanna è arrivata fino all'osso.
  l-ora-dei-gladiatori: |
    [water sloshing] Nella camera dei combattenti l'acqua dei catini è diventata rosa, e un inserviente la cambia di continuo senza che nessuno glielo chieda. [crowd murmuring] Dalle grate arriva il rumore della folla che aspetta la finale. [wry] Orvald ha fatto sapere che si torna in campo fra un'ora, e ha mandato Pett a dirlo, perché lui ha da fare con i registri.

    [tired] La squadra di Liaren occupa le panche a sinistra. Liaren accorda il samisen con un labbro spaccato, ed Ettore Castaldi beve da una fiaschetta quando crede che nessuno lo veda. [uneasy] L'altra squadra si è presa l'angolo più buio, e lì si parla a voce bassa. Vicino alle armerie la squadra di Galdrick si prepara in silenzio.

    Besk ripassa le formule sul quaderno muovendo le labbra. [amused] Corin ha tirato fuori un pettine. [tense] Tenebra si è seduto contro il muro, con la lama sulle ginocchia, e guarda Dragna Gro-Malog dall'altra parte della sala.
  l-ora-dei-gladiatori__1-esito: |
    Liaren ti fa posto sulla panca. [mocking] “Un omaggio alla squadra di Liaren” dice, imitando Orazio con la voce un'ottava sopra. [wry] “Quell'uomo mi ha fatto il funerale davanti a tutta la città, e non vedeva l'ora.” [tired] Dolovan Stroud si sta fasciando una mano e dice che non combatteva da anni e che adesso si ricorda perché.

    [amused] Ettore Castaldi ti offre la fiaschetta e poi la ritira, perché si ricorda che devi combattere. Borso si sveglia di colpo sulla panca e ti dice che la prossima volta i crani da fracassare li sceglie lui.
  l-ora-dei-gladiatori__2-esito: |
    [uneasy] Durgan si fa ricucire il sopracciglio da Rozalia, che ci mette un impegno cattivo. [coughs] Nihali tossisce piegato in due e sputa nero sulla sabbia dei catini. [tense] Mauro non si alza. È seduto su due sgabelli e ti guarda come si guarda un debito, contando. [whispers] [bitter] Quello i conti li tiene a memoria. Poi apre le braccia come per abbracciarti, restando seduto.

    [slyly] “Bella leggenda, la tua” dice, con l'alito che arriva prima della voce. “La nostra era più grossa. Alla Pignatta si parla di tutto e si dice niente, lo sai. [menacing] Però di te, da stasera, se ne parlerà.” [ominous] Lo dice sorridendo, e intanto stringe il manico dell'ascia finché le nocche gli diventano bianche.
  l-ora-dei-gladiatori__3-esito: |
    Galdrick si sta facendo stringere le cinghie dell'armatura da Ottilia Sanvel, che non dice una parola e non sbaglia un buco. [warmly] “Nella Mischia ti ho battuto io” dice con i pollici nella cintura, “ma la folla gridava il tuo nome. [amused] Mi sono offeso un poco, poi ci ho pensato, e alla città serve proprio questo.”

    Ilvaena Sorathe controlla le frecce una per una. [mocking] Dragna ti guarda dagli stivali in su e chiede a Tenebra, a voce alta, se si è messo a fare il gladiatore per vederla perdere. Tenebra non risponde, [laughs softly] e lei ride con la voce roca.
  l-ora-dei-gladiatori__4-esito: |
    Galdrick si sta facendo stringere le cinghie dell'armatura da Ottilia Sanvel, che non dice una parola e non sbaglia un buco. [amused] “Borso e il nano insieme” dice con i pollici nella cintura. “Uno lo pago io e l'altro lo paga Vesh, e per una volta erano d'accordo.” [chuckles] Ride, poi ti guarda il fermaglio. [warmly] “Orvald quello non lo dà a nessuno. Tienilo da conto.”

    Ilvaena Sorathe controlla le frecce una per una. [mocking] Dragna ti guarda dagli stivali in su e chiede a Tenebra, a voce alta, se si è messo a fare il gladiatore per vederla perdere. Tenebra non risponde, [laughs softly] e lei ride con la voce roca.
  l-ora-dei-gladiatori__5-esito: |
    [raven cawing] Pett gracchia una volta sola, e Orvald alza la testa dal registro. Besk chiude il quaderno, Corin si rimette il pettine nel taschino, e Tenebra si alza dal muro senza appoggiarsi. [determined] Mentre percorri il corridoio scavato nella roccia l'aria si fa più calda, [crowd roaring] e il rumore della folla ti arriva nello sterno prima che nelle orecchie.
  l-ora-dei-gladiatori__6-esito: |
    Liaren ti fa posto sulla panca. [mocking] “Un omaggio alla squadra di Liaren” dice, imitando Orazio con la voce un'ottava sopra. [wry] “Quell'uomo mi ha fatto il funerale davanti a tutta la città, e non vedeva l'ora.” [tired] Dolovan Stroud si sta fasciando una mano e dice che non combatteva da anni e che adesso si ricorda perché.

    [amused] Ettore Castaldi ti offre la fiaschetta e poi la ritira, perché si ricorda che devi combattere. Bram Halgast si sveglia di colpo con il martello fra le ginocchia. [wry] La prossima volta l'avversario se lo sceglie lui, ti dice, con una parola che a Liaren non piace.
  l-ora-dei-gladiatori__7-esito: |
    [tired] Due dei mercenari di Ghoran si fasciano le braccia a vicenda, e il terzo dorme sulla panca con la bocca aperta. [uneasy] Durgan si ricuce il sopracciglio da solo, con l'ago in una mano e uno specchietto nell'altra, e non fa una smorfia.

    [gruff] “Bella leggenda, la tua” dice il più anziano dei mercenari, senza alzarsi. “La città ci paga per stare sulle mura, e qui ci siamo venuti per arrotondare. [menacing] La prossima volta arrotondiamo contro qualcun altro.” [tense] Durgan intanto non ti toglie gli occhi di dosso, e taglia il filo con i denti.
  l-ora-dei-gladiatori__8-esito: |
    Galdrick si sta facendo stringere le cinghie dell'armatura da Ottilia Sanvel, che non dice una parola e non sbaglia un buco. [amused] “Il fabbro e il nano insieme” dice con i pollici nella cintura. “Uno mi vende le spade e l'altro lo pagava Vesh fino alla Pignatta, e per una volta erano d'accordo.” [chuckles] Ride, poi ti guarda il fermaglio. [warmly] “Orvald quello non lo dà a nessuno. Tienilo da conto.”

