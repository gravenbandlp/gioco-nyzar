# Regia del doppiaggio: Capomozzo (prima parte)
regia:
  ombrafosca-in-gabbia: |
    In fondo al cortile ci sono due capanni di legno grezzo. Il primo è aperto ed è il capanno degli attrezzi, con le mensole cariche di reti e di guinzagli per i cinghiali e, nell'angolo, una gabbia a forma di elle piena di conigli che si ammucchiano tutti dalla parte più lontana. [uneasy] Il secondo ha la porta inchiodata, con altre assi inchiodate di traverso, e il legno della porta è crepato dall'interno in tre punti.

    [somber] Davanti alla porta inchiodata ci sono due orchi morti, con la testa schiacciata, e anche senza guardarli da vicino capisci che è stato qualcosa con gli zoccoli. [flies buzzing] Le mosche si alzano quando ti avvicini e si posano di nuovo subito.

    [awed] Attraverso le fessure vedi un cavallo nero come la pece, con il manto che manda riflessi verdi dove lo prende la luce. Ha gli occhi grigio argento, e dalle narici gli esce un fumo leggero, come d'inverno, anche se non fa freddo. Le corde che lo legavano alle pareti sono morse e strappate in più punti. [sad] È magro, con le costole che si contano, e [hoof stomping on wood] quando ti sente sbatte uno zoccolo così forte che la porta trema sui cardini. [whispers] [uneasy] Ha fame, e i conigli sono per lui. Ti accorgi di aver fatto un passo indietro senza volerlo.
  ombrafosca-in-gabbia__1-successo: |
    Schiodi le assi una alla volta e apri la porta di una spanna. [softly] Poi resti sulla soglia a parlargli a voce bassa, senza dire niente di preciso, per un tempo che ti fa formicolare le gambe. [tense] Il cavallo sbuffa fumo e scalcia due volte contro la parete. [tender] Alla fine allunga il collo e ti annusa la mano, e lascia che tu gli appoggi il palmo sul muso. Sotto il palmo il muso è caldo come una stufa.
  ombrafosca-in-gabbia__1-fallimento: |
    Schiodi le assi e apri la porta di una spanna, e il cavallo ci mette contro il petto prima che tu abbia finito di parlare. [wood splintering] La porta ti prende in pieno e ti butta per terra, e uno zoccolo ti passa a un dito dalla testa e ti pesta la mano. [breathing heavily] Riesci a richiudere e a puntellare la porta con la schiena, e resti seduto lì contro, con la mano gonfia, [resigned] mentre lui scalcia dall'altra parte.
  ombrafosca-in-gabbia__2-successo: |
    [wry] Prendi un coniglio per le orecchie e lo butti dentro dalla fessura più larga. Il cavallo lo prende al volo e lo mastica con un rumore che ti fa voltare la faccia. [calm] Al terzo coniglio smette di scalciare, al quinto si lascia toccare il collo attraverso la fessura, e intanto gli guardi i garretti, dove le ferite si sono già chiuse da sole. [satisfied] Quando schiodi la porta lui resta fermo ad aspettarti, con il muso sporco.
  ombrafosca-in-gabbia__2-fallimento: |
    Apri la gabbia per prendere un coniglio, e ne escono venti tutti insieme, in mezzo al cortile, fra i piedi dei cinghiali. [pigs squealing] I cinghiali impazziscono. [tense] Il cavallo sente l'odore del sangue e sfonda con lo zoccolo un'asse della porta, a un palmo dalla tua faccia, e una scheggia ti si pianta nella guancia. [bitter] Ti ritiri nel capanno degli attrezzi ad aspettare che il cortile si calmi.
  ombrafosca-in-gabbia__3-successo: |
    [softly] Appoggi la fronte alle assi e gli parli nella lingua del Circolo, con le parole che si usano per le bestie spaventate. Dall'altra parte il respiro del cavallo rallenta piano piano, finché il fumo dalle narici si fa sottile e il suo occhio d'argento si accosta alla fessura a guardarti. [tender] Quando schiodi la porta lui abbassa la testa sulla tua spalla e ce la lascia appoggiata, pesante.
  ombrafosca-in-gabbia__3-fallimento: |
    Gli parli nella lingua del Circolo, ma la parola per calma ti esce storta e diventa quella per fuga. [horse whinnying] Il cavallo scalcia le pareti fino a far saltare due chiodi della porta, [fearful] e a te torna indietro tutta la sua paura in una volta, così forte che ti si piegano le ginocchia. [wry] Resti seduto contro il capanno degli attrezzi, con i conigli che ti guardano dalla gabbia.
  ombrafosca-in-gabbia__4-esito: |
    [quickly] Togli l'ultima asse e ti butti di lato. [horse whinnying] La porta si spalanca e il cavallo esce al galoppo in mezzo ai cinghiali, che si sparpagliano strillando, e uno lo manda a gambe all'aria contro la staccionata. [amused] Poi prende la rincorsa verso la palizzata e la salta dove è più bassa, e dalla torre la vedetta lo guarda passare con la bocca aperta. [satisfied] Nel trambusto ti allontani dal cortile senza che nessuno ti veda, e ti resta nelle orecchie il rumore dei suoi zoccoli sugli scogli.
  ombrafosca-in-gabbia__5-esito: |
    [calm] Ti metti in ginocchio davanti alla fessura più bassa e gli guardi le zampe invece degli occhi. Sui garretti ha i segni già chiusi di una catena, e sul collo quelli delle corde tirate dall'alto. [thoughtful] Al Circolo dicevano che una bestia legata così ha paura delle mani che scendono. Allora apri la porta di una spanna, porgi il dorso della mano all'altezza del suo ginocchio e aspetti.

    Il cavallo sbuffa fumo e batte uno zoccolo, poi abbassa il muso fino alla tua mano e la annusa a lungo. [tender] Sotto le dita il muso è caldo come una stufa. Quando schiodi le ultime assi resta fermo ad aspettarti.
  ombrafosca-fuori-dalla-gabbia: |
    [awed] Il cavallo esce adagio dal capanno e si ferma in mezzo al cortile con la testa alta a guardare il cielo. Da vicino è più grande di quanto sembrava dalle fessure. [somber] Ha una cicatrice fresca sulla spalla, larga come una mano, e dove gli orchi l'hanno legato il pelo è venuto via e la pelle sotto è grigia come cenere. [wry] I cinghiali si sono ammucchiati nell'angolo più lontano e non fiatano, e dalla torre est una vedetta si sporge a guardare con le carte ancora in mano.

    Gira il collo verso di te e soffia, e il fumo ti arriva in faccia caldo, con un odore di brace. Non porta sella né briglie, e ha tutta l'aria di non averle mai portate. [amused] Ti guarda come se adesso toccasse a te dire la prossima cosa. [waves crashing on rocks] Dietro la palizzata il mare batte sugli scogli, e oltre il mare ci sono la costa e la strada per Qir-Azel.
  ombrafosca-fuori-dalla-gabbia__1-esito: |
    [warm] Gli passi una corda larga intorno al collo senza stringerla, e lui ti lascia fare. Lo porti fuori dalla palizzata e lo leghi fra gli scogli dove il ponte di corda tocca l'isola, [amused] con un mucchio di alghe davanti che annusa con disprezzo. [tender] Gli dai il nome che ti viene in mente guardando il fumo che gli esce dalle narici, Ombrafosca. Lui gira un orecchio verso di te quando lo dici, e lo tiene girato.
  ombrafosca-fuori-dalla-gabbia__2-esito: |
    [wry] Ti fai da parte e gli indichi la palizzata con il braccio, anche se ti senti un po' ridicolo a farlo. Il cavallo ti guarda ancora un momento, poi prende la rincorsa attraverso il cortile e salta la palizzata dove è più bassa, [hooves on wood] con un rumore di zoccoli sul legno che fa affacciare tutte e due le vedette. Lo senti scendere fra gli scogli verso la riva. [quietly] Quando le vedette smettono di guardare il punto dove è sparito, tu sei già lontano dal cortile.
  la-tesoreria-di-balthog: |
    La camera di Balthog sta dietro la sala riunioni, dove un tavolo rotondo e quattro sedie prendono polvere. Il pavimento è di terra battuta, coperto di tappeti di pelle di cinghiale e di cavallo. [wry] Sulla parete nord sono inchiodate, uno accanto all'altro, decine di ferri di cavallo, in file dritte come i libri di una biblioteca. Contro il muro est c'è una scrivania con le gambe intagliate, che un tempo doveva valere parecchio, e accanto una sedia imbottita di stracci.

    Nell'angolo c'è un letto a baldacchino con le tende di seta e la testata scolpita a ninfe e caprai che ballano in un bosco. [deadpan] Le lenzuola sono nere di terra. [uneasy] Qualcuno ha raschiato via col coltello la faccia di tutte le ninfe, mentre i caprai hanno ancora la loro.

    Una porticina accanto al letto dà sulla latrina, una stanzetta con un buco nel pavimento e il bordo incrostato. [disgusted] Dal buco sale una puzza che ti chiude la gola, e dalla parete di fondo arriva una corrente d'aria fredda che in una latrina non ci dovrebbe essere. [whispers] [curious] Qui dentro Balthog tiene qualcosa che non vuole far vedere. Ti copri la bocca con la manica e respiri dentro la stoffa.
  la-tesoreria-di-balthog__1-successo: |
    [quietly] Passi le dita sotto la seduta della sedia imbottita e trovi una chiave di ferro grossa come un dito, legata con lo spago. Nella latrina segui la corrente d'aria fino a un'asse che suona vuota, e dietro l'asse c'è uno stanzino con un forziere rinforzato chiuso da un lucchetto. [tense] Sul coperchio c'è una fessura sottile, troppo dritta per essere una crepa. Giri la chiave piano, e il coperchio si alza senza che dalla fessura esca niente.

    [satisfied] Dentro c'è il bottino di anni di razzie, buttato alla rinfusa. Ci sono monete di tutte le zecche a manciate, e un giaco di maglia fine piegato con cura sotto una tunica di seta blu orlata d'oro. In un sacchetto di cuoio trovi una collana d'oro e un simbolo sacro di platino del Grande Albero Rosso, pesante come un sasso. [wry] Sul fondo restano una scimitarra arrugginita e un paio di manette, e quelle le lasci dove sono.
  la-tesoreria-di-balthog__1-fallimento: |
    Trovi la porta segreta seguendo la corrente d'aria, ma della chiave nessuna traccia, e allora provi il lucchetto con la punta del coltello. [click] Al secondo giro qualcosa scatta nel coperchio. [pained] Una lama arrugginita esce da una fessura e ti apre l'avambraccio dal polso al gomito. [bitter] Il lucchetto tiene. [tense] Nella sala riunioni qualcuno trascina una sedia, e tu esci dalla latrina con il braccio stretto contro il petto e il sangue che gocciola sui tappeti.
  la-tesoreria-di-balthog__2-esito: |
    Trovi la porta seguendo la corrente d'aria, e con un'ascia presa in prestito dall'armeria sfondi le assi del coperchio. [wood splintering] Al terzo colpo una lama arrugginita scatta fuori dal legno e ti si pianta nella coscia. [pained] La tiri fuori stringendo i denti. Poi infili il braccio nel buco e tiri fuori una borsa pesante di monete di tutte le zecche e un giaco di maglia fine, piegato sotto una tunica di seta blu orlata d'oro. [satisfied] In fondo, in un sacchetto di cuoio, ci sono una collana d'oro e un simbolo sacro di platino del Grande Albero Rosso. [uneasy] La ferita sulla coscia brucia, e i bordi sono già rossi di ruggine.
