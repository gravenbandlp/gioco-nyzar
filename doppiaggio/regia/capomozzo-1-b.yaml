# Regia del doppiaggio: Capomozzo (prima parte)
regia:
  aurenne-sul-ponte: |
    [eerie] Le pareti della sala si curvano ad arco e finiscono su due cornicioni di marmo rosso. Nei quattro angoli bruciano quattro teschi infilati su spuntoni di ferro, e la loro fiamma non fa fumo. I cornicioni sono carichi di libri e di vasi con dentro creature deformi in salamoia, e fra un vaso e l'altro c'è un braccio imbalsamato con le unghie ancora dipinte. [water bubbling] Al centro ci sono tre sedie girate verso nord, dove una fontana piena d'acqua bluastra gorgoglia e fa schiuma.

    [awed] Accanto alla fontana c'è una donna. Ha i capelli lunghi e d'argento, che le scivolano sulle spalle come il mercurio quando lo versi, e la pelle bianca attraversata da vene che si accendono di viola a ogni battito. Porta un'armatura di metallo nero e di cuoio che sembra crescerle addosso, con una luce rossa che filtra dalle giunture. [uneasy] Il ventre è scoperto, e una cicatrice profonda lo attraversa da un fianco all'altro. La mano destra è un artiglio nero, con le dita lunghe il doppio di quelle di una mano. [whispers] [uneasy] È la donna dei ritratti di Isvaro. Nei ritratti, però, la cicatrice non c'era.

    [ominous] Al suo fianco sta una macchina a quattro zampe grande quanto un cavallo, magra fino alle ossa di metallo. Al posto della testa ha una maschera ovale senza occhi da cui esce una luce pallida.

    La donna ti guarda con due occhi color ametista e ti sorride a labbra strette. [slyly] “Sei arrivato fin qui da solo” dice. [seductive] “Avvicinati, mio dolce. Voglio che tu mi veda bene.”
  aurenne-sul-ponte__1-esito: |
    [tense] Resti dove sei, con la mano vicina alla cintura. Lei fa due passi verso di te, e la macchina la segue con le zampe che non fanno rumore sul marmo. Si ferma a metà sala, accanto alle sedie. [eerie] Da vicino ha un profumo di incenso e di metallo caldo, e la luce dei teschi le accende i capelli a ogni guizzo.
  aurenne-sul-ponte__2-vittoria: |
    [metal clanging] La macchina cade per prima, in un mucchio di piastre che ronzano ancora. Aurenne finisce in ginocchio accanto alla fontana con l'artiglio incrinato, e si mette a parlare come una bambina che ha perso al gioco. [childlike] “Questa volta non conta” dice, “ricominciamo da capo.” [softly] Tu la chiami per nome. Alza gli occhi, e per il tempo di un respiro sono gli occhi di una ragazza spaventata che non sa dove si trova. [pause] Poi si affloscia su un fianco, svenuta.
  aurenne-sul-ponte__2-sconfitta: |
    [pained] L'artiglio ti apre il fianco e la macchina ti schiaccia contro il cornicione, e un vaso ti si rompe addosso. Aurenne alza l'artiglio per finirti. [short pause] In quel momento le vene sotto la sua pelle si spengono tutte insieme. Resta con il braccio alzato e la bocca aperta. Poi crolla, e la macchina si accuccia accanto a lei e non si muove più. [exhausted] Ci metti un pezzo a rialzarti, con il sapore della salamoia in bocca.
  aurenne-la-mia-vera-madre: |
    [bitter] “Tu non puoi capirlo, e non te ne faccio una colpa” dice Aurenne, e si siede sul bracciolo di una sedia con l'artiglio posato in grembo. “Questa faccia che piace tanto a tutti è un errore degli dei, una malformazione sacra fatta con tutta la cura possibile. A Qir-Azel ogni occhiata che mi davano era una lama. [sorrowful] Li ho pregati di volermi bene come una mendicante sui gradini di un tempio chiuso, e nessuno ha mai voluto vedere chi ero davvero.”

    Si tocca la cicatrice sul ventre con la mano buona, senza guardarla. [awed] “Poi mi ha parlato lei. Nhar'Kael, la Regina delle Ali Spezzate, la mia vera madre.” La voce le si scalda sul nome, e le vene sotto la pelle si accendono tutte insieme. [menacing] “Mi ha spiegato che sono nata per fare paura. La mia carne è un seme, e quando avrà finito di germogliare sarò quello che dovevo essere fin dall'inizio, un mostro.”

    [laughs softly] Ride piano, con le dita sulla bocca. [mocking] “Gli orchi si inginocchiano quando passo. La tua pietà tienila, mio dolce. [menacing] Voglio i tuoi occhi addosso mentre salgo, e quando la Marea ti avrà preso voglio che tu pensi a me, a quello che divento e a quello che avrei potuto essere.”

    [tense] Si sfila dal collo un disco di metallo con una corona di cristalli e ci preme sopra il pollice. La macchina abbassa la maschera e piega le zampe per saltare, e Aurenne si alza con l'artiglio aperto.
  aurenne-la-mia-vera-madre__1-vittoria: |
    [metal clanging] La macchina cade per prima, in un mucchio di piastre che ronzano ancora. Aurenne finisce in ginocchio accanto alla fontana con l'artiglio incrinato, e si mette a parlare come una bambina che ha perso al gioco. [childlike] “Questa volta non conta” dice, “ricominciamo da capo.” [softly] Tu la chiami per nome. Alza gli occhi, e per il tempo di un respiro sono gli occhi di una ragazza spaventata che non sa dove si trova. [pause] Poi si affloscia su un fianco, svenuta.
  aurenne-la-mia-vera-madre__1-sconfitta: |
    [pained] L'artiglio ti apre il fianco e la macchina ti schiaccia contro il cornicione, e un vaso ti si rompe addosso. Aurenne alza l'artiglio per finirti. [short pause] In quel momento le vene sotto la sua pelle si spengono tutte insieme. Resta con il braccio alzato e la bocca aperta. Poi crolla, e la macchina si accuccia accanto a lei e non si muove più. [exhausted] Ci metti un pezzo a rialzarti, con il sapore della salamoia in bocca.
  aurenne-la-mia-vera-madre__2-successo: |
    [tender] Tiri fuori il quaderno di stoffa azzurra e le leggi la prima riga, Caro Albero, poi le parli dell'uccellino di legno senza un'ala che teneva sulla scrivania, girato verso il cuscino. Lei si ferma con l'artiglio a mezz'aria. [trembling] “Come fai a saperlo?” La voce le esce piccola. Il disco le si spegne in mano, e la macchina si blocca a metà del salto. [sad] Aurenne piange senza fare rumore, poi le gambe le cedono e la prendi prima che batta la testa sul marmo.
  aurenne-la-mia-vera-madre__2-fallimento: |
    [shouting] “Stai zitto!” grida, e la macchina ti salta addosso. [determined] Prendi i suoi artigli sull'avambraccio e continui a parlarle della ragazza che scriveva al Grande Albero e dell'uccellino senza un'ala, con il sangue che ti cola fino al gomito. Le parole arrivano tardi, ma arrivano. Aurenne barcolla con le mani sulle orecchie, e il disco le scivola dalle dita. La macchina si ferma sopra di te. [breathing heavily] Lei crolla accanto alla fontana con le mani ancora sulle orecchie.
  aurenne-la-mia-vera-madre__3-successo: |
    [solemn] Dici le parole della Liturgia guardandola negli occhi, e a ogni frase lei fa un passo indietro. [eerie] Senti qualcosa che si ritira dentro di lei con un rumore d'ali, giù, nel fondo, dove le tue parole non arrivano. Le vene viola si spengono una alla volta. [softly] Aurenne ti guarda come se ti vedesse per la prima volta e apre la bocca per dire qualcosa, poi cade in ginocchio e si accascia di lato.
  aurenne-la-mia-vera-madre__3-fallimento: |
    [ominous] A metà della Liturgia la cosa che le sta dentro ti risponde, e lo fa con la sua bocca, in una voce che non è la sua. [pained] Il Mana ti torna indietro dietro gli occhi e ti butta in ginocchio. Ma la lotta è costata anche a lei. [tense] Aurenne si porta le mani alle tempie, grida una parola sola, poi crolla sul marmo, e la macchina si spegne accanto a lei.
  aurenne-la-mia-vera-madre__4-successo: |
    [urgent] Ti butti sotto l'artiglio quando lo alza e afferri il cordino del disco con tutte e due le mani. Il cordino si spezza. [metal clanging] La macchina si ferma a metà del salto e ricade sul marmo come un mucchio di pentole. Aurenne graffia l'aria dove un momento prima c'eri tu, poi barcolla, come se il disco l'avesse tenuta in piedi fino a quel momento, e crolla fra le sedie.
  aurenne-la-mia-vera-madre__4-fallimento: |
    [pained] Il disco lo prendi, ma l'artiglio ti prende a sua volta, dalla spalla al fianco, e il dolore ti toglie la vista per un momento. [breathing heavily] Rotoli lontano con il disco stretto al petto. La macchina si ferma. Aurenne fa due passi verso di te con l'artiglio gocciolante, [slowly] poi si guarda la mano vuota e cade in ginocchio, e da lì a terra.
  aurenne-la-mia-vera-madre__5-esito: |
    [tense] Ti ripari dietro le sedie, poi dietro la fontana, e prendi i colpi che non riesci a schivare. Ogni volta che lei preme il disco la macchina si fa più veloce, e Aurenne più pallida. [exhausted] Dopo un tempo che non sai misurare hai le braccia aperte in tre punti e l'acqua della fontana ti brucia nelle ferite. Lei preme il disco un'ultima volta, e le cede il corpo prima della volontà. [exhales] Crolla, e la macchina si ferma.
  la-prigione-del-costruttore: |
    [tired] Aurenne pesa meno di quanto pensavi. Te la carichi sulle spalle, e l'artiglio ti batte contro la schiena a ogni passo. Al collo aveva un cordino con quattro cristalli che ronzano piano, e te lo sei legato al polso. Il disco con la corona di cristalli ce l'hai in tasca. Alla cintura lei portava una stella a sette punte d'oro e d'argento, piatta da una parte e con un'impugnatura sottile e ricurva dall'altra.

    [mysterious] In fondo al ponte c'è una porta di pietra senza maniglie. Al loro posto c'è un incavo a forma di stella, con fessure più piccole tutto intorno. La stella ci entra di misura, e la porta si apre verso l'interno senza un rumore.

    Dentro bruciano candele dorate su candelabri di legno scolpito, e la cera è fresca. [whispers] [uneasy] Qualcuno scendeva qui ogni giorno a cambiarle. [awed] Sulla parete sud è incisa una grande stella a sette punte, così precisa che nessuno scalpello può averla toccata. Al centro c'è una piattaforma rotonda di metallo liscio, con incisioni minuscole che si accendono e si spengono, e in mezzo una placca rialzata attraversata da linee di luce. Al Grifone ne hai sentito parlare dai Raschiatori più vecchi. [short pause] Quella piattaforma è uno degli ascensori dei Precursori.
  la-prigione-del-costruttore__1-esito: |
    [low hum] Appena tocchi la placca la sala manda un suono basso e profondo, e la placca si abbassa sotto il palmo. [awed] Sotto i piedi si accende una luce bianca e fredda che disegna linee sul metallo. Poi la piattaforma si muove senza uno scossone, e capisci che stai scendendo. [uneasy] Le pareti di pietra umida scorrono accanto a te per un minuto e poi per un altro, finché smetti di contare.
  la-rovina-sommersa: |
    [awed] Le pareti si aprono tutte insieme, e davanti a te c'è una distesa che non finisce. Ci sono torri spezzate e ponti sospesi che non portano più da nessuna parte, immersi in una Marea Grigia così densa che la luce fredda della rovina ci si impiglia dentro. [eerie] Da certe colonne colano fili di liquido luminoso che cadono senza rumore. Lungo i muri più vicini corrono linee di luce che disegnano figure, e ogni tanto un intero settore si accende e si spegne.

    [ominous] A quattrocento metri, forse meno, pulsa una luce rossa con un ritmo lento e regolare. Viene da dietro una fenditura alta decine di metri e larga quanto due uomini affiancati, aperta in una parete nera e lucida. È Magnistruttura, il metallo dei Precursori che niente riesce a scalfire.

    [metal clanging] Sei a metà del passaggio sospeso quando da ogni parte comincia un rumore di ferro. [tense] Dalle pareti e dai condotti escono macchine della Salvaguardia, alcune non più grandi di un pugno e altre alte quanto un cavallo, e ti chiudono in cerchio con i sensori rossi accesi. Nella Marea si muovono senza fatica. [mechanical whirring] Poi il ronzio cambia nota, le luci rosse tremano e si spengono, [eerie] e le macchine restano immobili con la testa girata verso di te, in attesa di un ordine che non arriva.
  la-rovina-sommersa__1-esito: |
    [tense] Tiri fuori il disco e premi il pollice dove lo premeva lei. I cristalli della corona si accendono uno dopo l'altro, e le macchine non girano nemmeno la testa. [wry] Provi ancora, e poi una terza volta. [softly] Sulla tua spalla Aurenne mormora qualcosa nel sonno. Rimetti il disco in tasca e passi in mezzo al cerchio, verso la luce rossa, con la Marea che ti si attacca ai vestiti.
  la-rovina-sommersa__2-esito: |
    [tense] Passi fra due macchine alte quanto te, così vicino che senti il freddo del loro metallo sulla guancia, e ti sforzi di tenere il passo regolare. Nessuna si muove, nemmeno quando Aurenne geme nel sonno. [eerie] Arrivi alla fenditura con la Marea attaccata ai vestiti, e la parete di Magnistruttura ti rimanda la tua faccia storta e allungata, e sulla spalla quella di Aurenne, bianca, senza tratti.
  la-rovina-sommersa__3-esito: |
    [quietly] Il corpo lo sa prima di te, come la sera del Festival davanti alla porta nord. Abbassi le spalle, tieni le mani aperte lontano dalla cintura e cammini a passi corti, sempre sul fianco di una macchina e mai fra due, perché i Raschiatori vecchi dicono che una Salvaguardia ferma si sveglia quando due sensori vedono la stessa cosa. [tense] Aurenne sulla spalla pesa, e tu respiri piano con la bocca.

    [relieved] Nessuna macchina si muove. Arrivi alla fenditura con la Marea attaccata ai vestiti, e la parete di Magnistruttura ti rimanda la tua faccia storta e allungata, con quella di Aurenne bianca accanto.
  la-rovina-sommersa__4-esito: |
    [curious] Il ronzio delle macchine ti arriva nei denti prima che nelle orecchie, ed è la stessa nota che al banco dell'Accademia, la sera della razzia, ha fatto rispondere insieme sei cristalli tagliati da mani diverse. Stavolta la conti fino in fondo. [slowly] Sono due impulsi brevi e uno lungo, e poi il segnale si interrompe, come una domanda lasciata a metà. [whispers] [thoughtful] Aspettano l'ordine che le ha chiamate in città, e chi lo dava ce l'ho sulla spalla. [under breath] Passi in mezzo al cerchio contando gli impulsi a mezza voce, e nessuna macchina si gira.

    [satisfied] Arrivi alla fenditura con la Marea attaccata ai vestiti e la sequenza ripetuta fra i denti, per scriverla a Temmerin appena sarai di sopra.
  il-costruttore-di-capomozzo: |
    [awed] La fenditura si apre su una cavità enorme. All'inizio vedi soltanto la luce rossa che pulsa piano, poi gli occhi si abituano e capisci da dove viene.

    [ominous] È una forma colossale, mezza sepolta fra detriti e rottami, e non riesci a dire dove finisca la macchina e dove cominci la pietra. Il torace è squarciato, e dentro batte un nucleo rosso. Mentre lo guardi la testa si muove, un cilindro senza faccia con due fessure verticali che si accendono e si girano verso di te. [uneasy] Senti quella luce passarti addosso e pesarti, come la mano di un mercante sulla bilancia.

    [metal groaning] Poi si alza. Le lastre e i cavi si tendono con un gemito di metallo, e dalle giunture piovono scintille. [awed] In piedi è alto quanto quattro case una sopra l'altra. Un braccio gli pende inerte, piegato su se stesso, e da certe fessure del corpo escono fili di vapore. [dramatic] È il Costruttore che Aurenne voleva liberare, come scriveva Isvaro nel suo diario, e adesso si è svegliato.

    Posi Aurenne dietro un blocco di pietra. Il colosso alza il braccio buono e la sua ombra copre te e lei insieme. [fearful] Ti accorgi che le ginocchia ti tremano, e che non riesci a fermarle.
  il-costruttore-di-capomozzo__1-vittoria: |
    [determined] Lo colpisci dove le lastre si aprono, alle giunture delle gambe, e scappi ogni volta che il braccio buono scende. [metal crashing] Al quinto colpo un ginocchio cede con uno schianto che ti arriva nello stomaco, e il colosso si piega su se stesso. La luce del nucleo trema e cambia colore. [stone cracking] Lui pianta la mano a terra per non cadere, e il pavimento si crepa tutto intorno alle sue dita.
  il-costruttore-di-capomozzo__1-sconfitta: |
    [pained] La mano del colosso scende piatta e ti prende in pieno. [coughs] Ti ritrovi nella polvere, con la bocca piena di sangue e una gamba che non ti risponde. [fearful] Lui alza di nuovo il braccio, lentamente, per finire il lavoro. [short pause] A metà del gesto il nucleo gli sfarfalla nel petto e lui vacilla, come se dentro qualcosa si fosse rotto per conto suo.
  il-costruttore-di-capomozzo__2-successo: |
    [urgent] Corri sotto il colosso con il disco alzato verso il nucleo, e i cristalli della corona si accendono tutti insieme, bianchi. Le fessure del suo volto lampeggiano. [tense] Il braccio buono si ferma a metà del colpo e resta lì, tremante, mentre dentro il petto il nucleo perde il ritmo. [satisfied] Il colosso fa un passo indietro e vacilla, e i cristalli ti scottano il palmo.
  il-costruttore-di-capomozzo__2-fallimento: |
    [tense] Il disco ti si scalda in mano finché non riesci più a tenerlo, e il colosso è rallentato appena. [stone cracking] Il braccio scende a un passo da te e spacca il pavimento, e una pioggia di schegge ti apre la fronte e le braccia, e una ti si pianta nella coscia. [pained] Però il nucleo ha perso il ritmo. Mentre raccogli il disco con la manica, il colosso barcolla.
  il-costruttore-di-capomozzo__3-successo: |
    [shouting] Pianti i piedi e gli gridi l'ordine nella lingua delle macchine, una parola sola che ti raschia la gola uscendo. [long pause] Il colosso si ferma. [awed] Le fessure del suo volto si abbassano su di te, e per un tempo lunghissimo lui guarda te e tu guardi lui. [tense] Poi il nucleo trema, e lui vacilla, con due ordini diversi nel petto e nessuno dei due più forte dell'altro.
  il-costruttore-di-capomozzo__3-fallimento: |
    [fearful] L'ordine gli arriva storto, e lui ti risponde. [deep mechanical drone] È un suono che ti arriva nei denti e nelle ossa del cranio prima che nelle orecchie, e ti butta a terra con il naso che sanguina. [heavy footsteps] Il colosso fa due passi verso di te, e il pavimento sobbalza a ogni passo. [tense] Al terzo il nucleo gli sfarfalla nel petto e lui vacilla, come se la parola sbagliata gli fosse rimasta dentro.
  il-costruttore-di-capomozzo__4-successo: |
    [urgent] Corri su per il mucchio di detriti mentre il braccio buono spazza l'aria sopra la tua testa, e dalla cima salti. Ti aggrappi al bordo del torace squarciato, con il metallo caldo che ti brucia le mani, e colpisci il nucleo una volta, con tutto quello che hai. Il colosso barcolla all'indietro. [breathing heavily] Tu cadi nella polvere da un'altezza che ti toglie il fiato, e ti rialzi con le mani piene di vesciche.
  il-costruttore-di-capomozzo__4-fallimento: |
    [urgent] Arrivi al nucleo e lo colpisci, ma il colosso si gira e ti scrolla via come una mosca dalla manica. [pained] Cadi da un'altezza che non vuoi sapere, e la schiena prende i detriti per prima. [gasps] Resti a terra senza fiato, con la bocca aperta e i polmoni che non vogliono saperne. [tense] Sopra di te il nucleo sfarfalla dove l'hai colpito, e il colosso vacilla.
  la-maschera-spaccata: |
    [tense] Il Costruttore vacilla. Le giunture incandescenti si piegano, e la luce del nucleo trema fra il rosso e il viola, sempre più in fretta. Eppure non cade. [pause] Si raddrizza un'altra volta, e in quel momento il tempo si ferma.

    [eerie] Le scintille restano sospese a mezz'aria e la polvere si ferma a metà della caduta. Non senti più il ronzio della rovina, e nemmeno il tuo respiro. [awed] Davanti a te, nel buio, sorge una figura altissima e incappucciata, con il corpo coperto di occhi. L'hai già vista una volta, la notte prima del Festival, in un sogno che al mattino avevi messo da parte. Ha le proporzioni del colosso che hai davanti, ed è com'era lui prima di diventare questa carcassa.

    [mysterious] Fra te e la figura galleggia una maschera spaccata in due, come nel sogno. Le due metà vibrano e si cercano finché si toccano e diventano un volto solo, che cambia forma ogni volta che sbatti le palpebre. Dentro di te parla una voce che è la tua, moltiplicata in un coro lontano. [solemn] “Ti abbiamo cercato in fondo a ogni tuo respiro, e adesso ti abbiamo trovato, Portatore dell'Alba.”

    [long pause] Il volto smette di cambiare. Ha preso la forma che hai deciso di vedere.
  la-maschera-spaccata__1-esito: |
    [ominous] La maschera è di ferro brunito, con un volto di donna inciso a linee sottili, e dalle fessure scende una nebbia rossa. Te la senti addosso senza averla toccata. [short pause] Il tempo riparte. [furious] Ti lanci in avanti prima ancora di deciderlo, e il colpo lascia nell'aria una scia scarlatta. Trapassi la corazza del colosso all'altezza del petto e arrivi al nucleo. [explosion] La luce rossa esplode e ti travolge, [long pause] e poi c'è silenzio.
  la-maschera-spaccata__2-esito: |
    [warm] La maschera è d'oro opaco e non ha bocca, e dagli occhi le scendono due rivoli di luce bianca. Ti vengono in mente i forni della Città Bassa all'alba, e le mani infarinate di chi impasta il pane. [short pause] Il tempo riparte. [determined] Avanzi contro il colosso con il braccio alzato a farti da scudo, e gli vai addosso con un urlo che si mescola al clangore del metallo. Il colpo arriva al nucleo. [explosion] La luce rossa esplode e ti travolge, [long pause] e poi c'è silenzio.
  la-maschera-spaccata__3-esito: |
    [eerie] La maschera è di vetro incrinato, e dietro si muovono ombre che sembrano mani giunte. In ogni scheggia c'è un pensiero, e non sai se è tuo. [short pause] Il tempo riparte. [awed] Allunghi la mano verso il colosso e dal palmo ti esce un raggio di luce dorata che incide la corazza come vetro fuso, dritto fino al nucleo. [explosion] La luce rossa esplode e ti travolge, [long pause] e poi c'è silenzio.
  la-maschera-spaccata__4-esito: |
    [calm] La maschera è di corteccia nera e muschio, attraversata da vene di metallo in cui scorre una linfa lucente. Ha un odore di bosco dopo la pioggia. [short pause] Il tempo riparte. [wood splintering] Alzi il braccio, e dal pavimento esplodono radici e tubi di metallo che si intrecciano intorno alle gambe del colosso e lo inchiodano a terra. Una radice gli sale nel petto e si chiude sul nucleo. [explosion] La luce rossa esplode e ti travolge, [long pause] e poi c'è silenzio.
  la-corsa-all-ascensore: |
    [awed] Il colosso è immobile, mezzo distrutto, con il nucleo spento. Davanti al tuo viso galleggia la maschera, grande tre volte la tua faccia. È trasparente, e ogni suo tratto è perfetto.

    [tense] Il primo tremore sembra l'eco del colpo. [rumbling] Il secondo ti butta in ginocchio. Dal soffitto piove polvere mescolata a schegge di metallo, e lungo le giunture del pavimento si accendono linee rosse che corrono in tutte le direzioni. [ice cracking] Le pareti di Magnistruttura si incrinano con il rumore del ghiaccio che si rompe sotto i piedi, [fearful] e lo stomaco ti si chiude, perché al Grifone dicono che quel metallo non si rompe.

    La maschera trema e svanisce. Il corpo del Costruttore si spezza in due e si porta dietro un pezzo di pavimento. [softly] Aurenne è dove l'hai lasciata, dietro il blocco di pietra, con la faccia bianca di polvere, e respira ancora. [urgent] Fino all'ascensore ci sono quattrocento metri di passaggio sospeso, e il passaggio si sta piegando.
  la-corsa-all-ascensore__1-esito: |
    [urgent] Te la prendi in braccio e corri. Il passaggio si apre in fenditure incandescenti, e pezzi di Magnistruttura si staccano dalle pareti e cadono nel buio. [breathing heavily] Salti sulla piattaforma con le ginocchia che cedono, e le incisioni si accendono, [short pause] poi non succede niente. Poi l'ascensore sale. [thunder rumbling] Sotto di te la rovina crolla con un tuono che non finisce più.

    [exhales] Quando la piattaforma si ferma sei di nuovo fra le candele dorate, e tutto tace. Ti lasci cadere sulla pietra accanto ad Aurenne e aspetti che le mani smettano di tremare. [tired] Sopra di te ci sono le rovine, i sotterranei degli orchi e la fortezza, e dopo ancora due giorni e mezzo di strada fino a Qir-Azel.
  la-corsa-all-ascensore__2-esito: |
    [urgent] Te la carichi in spalla e corri curvo, a testa bassa, come si fa sulle piattaforme quando un'impalcatura comincia a cedere. Tieni il lato del passaggio che tocca la parete, perché è l'ultimo a staccarsi, e salti le fenditure incandescenti senza guardarci dentro. Alle tue spalle pezzi di Magnistruttura cadono nel buio. [satisfied] Arrivi sulla piattaforma con il fiato ancora intero, e le incisioni si accendono sotto i tuoi stivali.

    [exhales] Quando l'ascensore si ferma sei di nuovo fra le candele dorate. Posi Aurenne sulla pietra e ti siedi accanto a lei. [wry] Sopra di te c'è tutta la fortezza degli orchi, e dopo ancora due giorni e mezzo di strada fino a Qir-Azel.
