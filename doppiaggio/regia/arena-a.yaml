# Regia del doppiaggio: L'Arena di Qir-Azel
regia:
  l-annuncio-dei-cristalli: |
    [low humming] Sei davanti a un forno quando i cristalli delle facciate e dei lampioni tremano tutti insieme, e un ronzio basso ti sale dalle suole fino ai denti. Il fornaio resta con la pala alzata a mezz'aria. [surprised] Poi dai cristalli esce la voce di Toren Galdrick, così netta che ti viene da voltarti per cercarlo.

    [solemn] “Abitanti di Qir-Azel. Vi parlo per conto del Consiglio e della Confraternita del Velo. La nostra città è stata messa alla prova, e abbiamo visto che cosa si muoveva ai margini del Bosco. Per questo l'Arena riapre le sue porte a chiunque abbia qualcosa da dimostrare, e a chi arriverà in fondo alle Tre Prove andrà il titolo di Campione di Qir-Azel. [dramatic] Io sono Toren Galdrick, e vi dico che non c'è momento migliore per far vedere che Qir-Azel non si piega né oggi né mai.”

    [crowd murmuring] Dopo un momento di silenzio la strada riparte più forte di prima, con gli apprendisti che contano le scommesse sulle dita. [wry] Qualcuno davanti al forno dice il tuo nome, e quando ti volti fa finta di guardare il pane.

    Il giorno dopo due miliziani dai mantelli scarlatti ti vengono incontro sul piazzale dell'Arena e ti portano dentro per un corridoio basso, fra bassorilievi di eroi che sventrano mostri, fino alla camera dei combattenti. Dietro un banco di legno rinforzato Orvald Temmerin sta congedando Dolovan Stroud, lo stalliere delle Scuderie della Zanna Rotta, che si allontana pensieroso. Il corvo Pett ti guarda dal bordo del banco con la testa inclinata, e Orvald alza appena gli occhi dal registro. [deadpan] “Ah. Sei tu. Bene” dice. “L'Arena ti aspetta. Che cosa posso fare per te?”
  l-annuncio-dei-cristalli__1-esito: |
    [deadpan] “Regolamento? Bene, meglio chiarire subito” dice Orvald, e fa scorrere un dito lungo l'elenco dei nomi. “La prima prova è la Grande Mischia. Dodici combattenti e un solo vincitore.” [amused] Alza l'indice, e Pett alza la testa insieme a lui.

    “Si combatte dentro un recinto ovale di contenimento magico. [sarcastic] L'ho voluto io, per quei furbi che scappano ai bordi e sperano che gli altri si ammazzino fra loro senza accorgersi di nulla.” [calm] Poi aggiunge, con calma, che al vincitore toccherà un oggetto scelto dalla sua collezione personale, [wings flapping] e il corvo sbatte le ali una volta sola, come se avesse sentito il prezzo.
  l-annuncio-dei-cristalli__2-esito: |
    Orvald cambia registro e lo apre su una pagina piena di cancellature. [deadpan] “Seconda fase, squadre da quattro. Le squadre fra loro non si toccano, e ognuna affronta quello che l'Arena decide di offrirle, tre volte di seguito. [ominous] L'ultima volta sarà una creatura sola, e sarà la peggiore.” Ti guarda da sopra il registro. [wry] Sa che una squadra non ce l'hai, e dice che ci penserà lui quando firmi.

    Poi fa un piccolo gesto circolare con la mano e ti spiega che nella finale le squadre migliori si affrontano fra loro, con i piloni accesi e il terreno che si muove sotto i piedi. “Di solito chi colpisce più forte arriva in fondo” dice, e Pett piega la testa da una parte. [slyly] “Chi capisce l'arena ci arriva meno stanco.”
  l-annuncio-dei-cristalli__3-esito: |
    [deadpan] “Qui dentro entrano maghi e guerrieri, e quasi tutto quello che riesce a firmare il modulo” dice Orvald, intingendo la penna. “Le pozioni restano fuori insieme agli oli, e così le pergamene e qualunque cosa si consumi. Si combatte con quello che sei e con quello che hai addosso.” [amused] Batte due dita sul banco, e Pett salta di lato per non farsi pestare la coda.

    [crowd murmuring] Poi indica le grate in alto, da dove arriva il rumore della folla, e aggiunge un'ultima cosa: “Attorno all'Arena corre una cintura di Cristalli Conduttori che protegge il pubblico, e anche voi. [ominous] Morire qui dentro è molto difficile, anche se si può. [coldly] Chi forza un colpo mortale fuori controllo viene squalificato, e nei casi gravi passa la notte nelle celle della Caserma.”
  l-annuncio-dei-cristalli__4-esito: |
    Orvald legge i nomi dal registro senza fretta. Toren Galdrick si è iscritto alla Mischia e alle squadre, e in città lo danno favorito in tutte e due. [wry] Liaren Tarvelin dice di partecipare per curiosità e per uscire un giorno dalla locanda. Ettore Castaldi l'ha iscritto sua cugina Julia, perché così almeno combina qualcosa. Borso ha chiesto alla Caserma la licenza per tutto il torneo, e vuole fracassare più crani che può.

    [uneasy] Nell'angolo vicino ai catini Mauro Scrocco parla a bassa voce con Rozalia Marga, che tiene due stiletti fra le dita come penne. Accanto a loro ci sono un nano pieno di cicatrici con una grande ascia e Nihali Cuzan, che tossisce nella pipa. [tense] Mauro ti vede, ti fa un cenno largo con la mano e sorride con tutti i denti.
  l-annuncio-dei-cristalli__5-esito: |
    Firmi, e Orvald soffia sull'inchiostro. “Per le squadre ti do la mia allieva” dice, e chiama Besk Dravec dalle nicchie. È una ragazza con gli occhiali e un vestito olvaro, e ti stringe la mano con cortesia. [deadpan] “Lancia meglio di come parla” dice Orvald, “e parla moltissimo.” [quickly] Besk risponde a voce rapida che lui lo dice perché lei gli corregge i conti.

    [amused] Un uomo in panciotto ricamato si avvicina scansando le panche con piccoli inchini. [nervously] “Domando scusa. Corin Ashdale, della Gilda dei Mercanti” dice. “Vorrei imparare come si fa a essere un eroe, e mi hanno detto che bisogna stare vicino a uno. Vi manca un uomo?” [wry] Orvald lo scrive sul registro prima che tu risponda.
  l-annuncio-dei-cristalli__6-esito: |
    Firmi, e Orvald soffia sull'inchiostro. “Per le squadre ti do la mia allieva” dice, e chiama Besk Dravec dalle nicchie. È una ragazza con gli occhiali e un vestito olvaro, e ti stringe la mano con cortesia. [deadpan] “Lancia meglio di come parla” dice Orvald, “e parla moltissimo.” [quickly] Besk risponde a voce rapida che lui lo dice perché lei gli corregge i conti.

    [clears throat] Alle tue spalle qualcuno si schiarisce la voce. [amused] È Corin Ashdale, con il fazzoletto al taschino e una spada nuova che non sa dove appendere. [warmly] “Eccellente, eccellente” dice. “Ti cercavo. Volevo imparare come si fa a essere un eroe, ricordi? Mi pare l'occasione.” [wry] Ride per primo, e Orvald lo scrive sul registro.
  l-annuncio-dei-cristalli__7-esito: |
    Firmi, e Orvald soffia sull'inchiostro. “Per le squadre ti do la mia allieva” dice, e chiama Besk Dravec dalle nicchie. È una ragazza con gli occhiali e un vestito olvaro, e ti stringe la mano con cortesia. [deadpan] “Lancia meglio di come parla” dice Orvald, “e parla moltissimo.” [quickly] Besk risponde a voce rapida che lui lo dice perché lei gli corregge i conti.

    [surprised] Sulla porta compare Corin Ashdale, che dovrebbe essere a Laresh, con gli stivali ancora bianchi di polvere. [warmly] “Ho sentito del torneo a metà strada” dice, “e la carovana l'ho lasciata ai carrettieri. Dovevo ancora imparare come si fa a essere un eroe, ricordi?” [wry] Ride per primo, e intanto Orvald lo ha già scritto sul registro.
  l-annuncio-dei-cristalli__8-esito: |
    Orvald legge i nomi dal registro senza fretta. Toren Galdrick si è iscritto alla Mischia e alle squadre, e in città lo danno favorito in tutte e due, anche se il fianco che gli ha aperto Vesh è guarito da poco. [wry] Liaren Tarvelin dice di partecipare per curiosità e per uscire un giorno dalla locanda. Ettore Castaldi l'ha iscritto sua cugina Julia, perché così almeno combina qualcosa. Bram Halgast, il fabbro della Fucina dei Due Mastini, vuole far vedere a tutta la città come tagliano le sue lame, e ha già chiesto dove si paga da bere.

    [dice rattling] Nell'angolo vicino ai catini tre mercenari di Ghoran, di quelli che Galdrick si è portato in città, giocano a dadi su una panca. Con loro c'è un nano pieno di cicatrici con una grande ascia. [quietly] Orvald abbassa la voce e ti dice che il nano, fino alla Pignatta, prendeva la paga da Vesh, e che adesso la prende da chi gliela offre. [tense] Uno dei mercenari ti riconosce da quella notte e ti fa un cenno con il mento.
  l-annuncio-dei-cristalli__9-esito: |
    Firmi, e Orvald soffia sull'inchiostro. “Per le squadre ti do la mia allieva” dice, e chiama Besk Dravec dalle nicchie. È una ragazza con gli occhiali e un vestito olvaro, e ti stringe la mano con cortesia. [deadpan] “Lancia meglio di come parla” dice Orvald, “e parla moltissimo.” [quickly] Besk risponde a voce rapida che lui lo dice perché lei gli corregge i conti.

    Un uomo in panciotto ricamato si avvicina scansando le panche, e a metà strada si ferma a guardarti in faccia. [warm] Poi ti afferra il polso con tutte e due le mani, come quel giorno sotto il bancone. [warmly] “Le castagne” dice. “Corin Ashdale, della Gilda, se non ti ricordi il nome. Vorrei imparare come si fa a essere un eroe, e mi pare di averne trovato uno. Vi manca un uomo?” [wry] Orvald lo scrive sul registro prima che tu risponda.
  la-grande-mischia: |
    [electric humming] I cristalli della cintura si accendono tutti insieme, e un'onda di vibrazione attraversa la sabbia e ti sale nelle caviglie. Su una sporgenza della tribuna Orazio Belcanto, con le piume sul cappello e una giacca che manda lampi, allarga le braccia inanellate. [shouting] “Popolo di Qir-Azel, cittadini della Città Alta e della Città Bassa! Oggi l'Arena non chiede spettatori. Vuole volontà e sangue, e vuole sapere un nome. [dramatic] Che abbiano inizio le Tre Prove!”

    [metal grinding] Le griglie ai bordi si sollevano dal suolo, e il recinto ovale si accende di un verde acido che ti fa lacrimare. Orazio scandisce le parole una alla volta. [slowly] “Dodici combattenti entrano. Uno solo resterà dentro il recinto quando la linea si spegne.”

    Galdrick saluta la tribuna con due dita, in armatura scura. [wry] Borso si batte la clava sul palmo e racconta a chiunque sia a portata d'orecchio che la licenza se l'è guadagnata. Dragna Gro-Malog ha l'ascia già in mano, e Mauro Scrocco suda nella sua camicia color zafferano prima ancora di cominciare. [tense] Il nano con le cicatrici si chiama Durgan e non ha detto una parola da stamattina. [softly] Fra gli altri c'è un mercenario di passaggio con lo scudo dipinto di fresco, che ogni tanto guarda la tribuna per vedere se sua madre è arrivata.

    [shouting] “Guerrieri della grande mischia!” grida Orazio. “Cominciate!”
  la-grande-mischia__1-vittoria: |
    [swords clashing] Dragna e Mauro si cercano subito, e finiscono fuori dal recinto avvinghiati. [tense] Galdrick ne butta giù tre prima che Borso e Durgan gli vengano addosso insieme e lo spingano oltre la linea verde, e lo sceriffo, cadendo, si porta dietro Borso per il bavero. Poi Durgan si volta verso di te, con il mercenario dallo scudo dipinto. Il mercenario va giù per primo. [breathing heavily] Il nano ti costa una spalla che non senti più e il fiato, finché non scivola sulla sabbia e la sua ascia ti passa a un dito dall'orecchio.

    [exhales] Orvald ti mette in mano un fermaglio d'argento intrecciato. [deadpan] “Questo non è roba da bancarella” dice, [crowd cheering] mentre la tribuna urla il tuo nome.
  la-grande-mischia__1-sconfitta: |
    [pained] Durgan ti prende di piatto con il manico dell'ascia, e ti ritrovi in ginocchio con la schiena a un palmo dalla linea verde. Il calore del recinto ti brucia la nuca. [electric crackling] Un calcio del mercenario ti fa fare l'ultimo palmo, e la scarica del recinto ti butta sulla sabbia di fuori.

    [breathing heavily] Vince Galdrick come dicevano tutti, e lo fa senza fretta. [surprised] Mentre Orazio lo proclama, dalla tribuna però arriva il tuo nome, prima da un angolo e poi da tutti. Orvald si china sul registro. [deadpan] “La folla ti vuole nella prova a squadre” dice, “e io non litigo con la folla.”
  la-grande-mischia__2-successo: |
    [tense] Ti tieni a un passo dalla linea verde, con la pelle che formicola sul fianco, e lasci che al centro si facciano a pezzi fra loro. Vedi Borso e Durgan spingere Galdrick fuori dal recinto insieme, e lo sceriffo che si porta dietro Borso per il bavero. Il nano e il mercenario si voltano verso di te nello stesso momento. [wry] Il mercenario ti carica e tu ti sposti, e il recinto fa il resto. Durgan è più furbo e ti costa un taglio sull'avambraccio, finché non perde l'equilibrio sul bordo e la linea verde lo prende alla schiena.

    [exhales] Orvald ti porge un fermaglio d'argento intrecciato. [deadpan] “Questo non è roba da bancarella” dice. “Il bordo l'avevo pensato per i codardi. Tu l'hai usato meglio di loro.”
  la-grande-mischia__2-fallimento: |
    [pained] Un gomito di Borso ti arriva nelle costole mentre guardi da un'altra parte, e fai un passo indietro di troppo. [electric crackling] Il recinto ti brucia la schiena con un calore che ti toglie il fiato e ti butta fuori sulla sabbia, con la camicia che fuma e ti resta attaccata alla pelle. [bitter] L'inserviente che te la stacca ha la mano leggera, e fa male lo stesso.

    [resigned] Vince Galdrick, il favorito. Dalla tribuna però chiamano il tuo nome, e Orvald, chino sul registro, dice che la folla ti vuole nella prova a squadre e che lui con la folla non litiga.
  la-grande-mischia__3-successo: |
    [crowd roaring] Alzi l'arma verso la tribuna dei Quartieri Alti e poi verso quella della Città Bassa, e la seconda ti risponde con un boato che fa tremare le griglie. [satisfied] Da lì in avanti chi ti si avvicina lo fa con un occhio agli spalti. Borso e Durgan scelgono Galdrick, e lo spingono oltre la linea verde insieme, e lui si porta dietro Borso per il bavero. [crowd chanting] Quando il nano e il mercenario si voltano verso di te la folla scandisce il tuo nome, e il mercenario esce dal recinto da solo, rosso in faccia. [tense] Durgan resta, e ti costa una spalla e un labbro spaccato prima di andare giù.

    [exhales] Orvald ti porge un fermaglio d'argento intrecciato. [deadpan] “Questo non è roba da bancarella” dice.
  la-grande-mischia__3-fallimento: |
    [wry] Alzi l'arma verso la tribuna, e dalla tribuna ti arriva un torsolo di mela. [pained] Mentre lo schivi Durgan ti prende alle gambe con il manico dell'ascia e poi alle costole. Finisci sulla linea verde con tutta la schiena.

    [resigned] Vince Galdrick, il favorito. [surprised] Dalla tribuna però, a sorpresa, cominciano a chiamare il tuo nome, forse per il torsolo, e Orvald dice che la folla ti vuole nella prova a squadre e che lui con la folla non litiga.
  la-grande-mischia__4-successo: |
    [low humming] Senti il Mana del recinto ronzarti nei denti, e trovi il punto dove è più sottile. [determined] Quando Borso e Durgan spingono Galdrick verso il bordo, tu tiri la linea verde di un passo verso di lui, e lo sceriffo esce trascinandosi dietro Borso per il bavero. Il nano e il mercenario si voltano verso di te. [wry] Il mercenario finisce sul verde senza capire come. [breathing heavily] Durgan ti costa un taglio sul fianco e tutto il fiato che hai, prima che il recinto lo prenda alle spalle.

    Orvald ti porge un fermaglio d'argento intrecciato e ti guarda a lungo. [deadpan] “Questo non è roba da bancarella” dice. [pause] [coldly] “Il recinto, però, è roba mia.”
  la-grande-mischia__4-fallimento: |
    [electric crackling] Il Mana del recinto ti torna indietro tutto insieme, e per un momento vedi la sabbia diventare verde. [pained] Quando ci vedi di nuovo sei fuori dalla linea, seduto, con il sapore del rame in bocca e un tremito alle mani che non vuole passare.

    [resigned] Vince Galdrick, il favorito. Dalla tribuna però chiamano il tuo nome, e Orvald dice che la folla ti vuole nella prova a squadre e che lui con la folla non litiga.
