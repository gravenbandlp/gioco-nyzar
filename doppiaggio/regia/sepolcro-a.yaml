# Regia del doppiaggio: Il Sepolcro violato
regia:
  sepolcro-avviso: |
    Sulla bacheca delle Richieste di Aiuto, fra un'offerta di pelli di ratto e un foglio che cerca il quinto uomo per una squadra di scavo, c'è un avviso nuovo. [curious] È fissato con un chiodo per angolo e scritto su carta buona, di quella che ai Ponti si vede solo sui contratti della Gilda. In fondo c'è il sigillo di cera della Caserma.

    [solemn] Lo sceriffo Toren Galdrick cerca persone fidate per far luce sulla profanazione avvenuta al Cimitero di Qir-Azel nella notte della razzia. Chi è disposto si presenti al cimitero della Città Bassa e chieda di lui. Sotto, in una grafia più minuta, ha firmato anche Padre Aurelio Vantes. [whispers] [sarcastic] Della paga non parla nessuno dei due. [wry] Ti accorgi di aver letto l'avviso due volte, la seconda muovendo le labbra.

    Brunella Fennick passa con un vassoio di scodelle vuote e si ferma accanto a te. [warmly] “L'ha appeso lui all'alba, con il batticarne della cucina, perché un martello non ce l'avevo” dice. [amused] “Poi mi ha chiesto scusa per i buchi nel legno, e intanto guardava il muro. Grosso com'è, per quattro chiodi non sapeva dove mettere le mani.” [dishes clinking] Riprende il vassoio e va verso la cucina, svelta, con le scodelle che tintinnano.
  sepolcro-avviso__1-esito: |
    [paper rustling] Stacchi l'avviso un chiodo alla volta e lo pieghi in quattro, attento a non strappare la carta buona. Dal bancone Liaren Tarvelin ti vede e alza il mento, come per dirti che ha capito dove stai andando.

    [calm] Mentre scendi verso il Ponte del Pesce senti il foglio frusciare nella tasca a ogni passo, e ogni tanto ci metti la mano sopra per controllare che ci sia ancora.
  sepolcro-avviso__2-esito: |
    Liaren Tarvelin asciuga un boccale e lo guarda controluce più a lungo del necessario. [quietly] “Gli orchi presi vivi l'hanno detto anche allo sceriffo, che dovevano andare al cimitero” dice. “Chiedi a quello col naso rotto, vicino al camino. Quella notte guidava un carro di rape lungo il muro.”

    [wry] Il carrettiere parla con il naso che fischia a ogni parola. [ominous] Mentre la piazza bruciava ha visto lanterne coperte muoversi fra le tombe, e davanti a tutte una figura più bassa delle altre, avvolta in qualcosa di scuro. Poi ha frustato il mulo e non si è più voltato. [short pause] Esci con l'avviso piegato in tasca.
  sepolcro-cimitero: |
    [somber] Il Cimitero di Qir-Azel sta dietro un muro di pietra blu, e si entra dal cancello a nord. Le cripte delle famiglie ricche sono addossate al muro, e nel mezzo, sparse fra gli alberi, ci sono decine di tombe con una lapide semplice. [softly] Sulle fosse comuni della razzia la terra è ancora scura, e su una qualcuno ha lasciato un fiore di carta dentro una tazza sbeccata.

    Lo sceriffo ti aspetta davanti a una costruzione quadrata di pietra coperta di simboli del Grande Albero Rosso. [tense] La lastra dell'ingresso è stata forzata con una leva, e sul bordo i graffi sono chiari nella pietra scura. Toren Galdrick è un uomo grosso dalla pelle scura, con la testa rasata e il cappuccio di maglia abbassato sulle spalle. [wry] Dal cancello due vedove lo stanno guardando, e lui parla alla lastra più che a te.

    [gruff] “Sei venuto. Bene” dice. “Detto questo, meglio essere chiari. Questa faccenda la sbrigo anche con due guardie, e mi serve vedere come lavori prima di darti cose più grosse.”

    Accanto a lui c'è un sacerdote magro, con i paramenti scuri e gli occhi grigi. [warm] Padre Aurelio Vantes ti prende il polso con due dita mentre ti ringrazia, e si scusa di averti fatto venire fin qui. La cripta l'ha trovata lui, il mattino dopo la razzia. [ominous] Quel mattino anche Gundo Marl, il becchino, non c'era più. Nella sua casetta accanto al cancello il letto è rifatto e il mantello è appeso al chiodo, [short pause] e nessuno l'ha visto uscire.
  sepolcro-cimitero__1-successo: |
    Ti inginocchi, e la terra umida ti passa subito attraverso i calzoni. [curious] Sotto le orme chiodate delle guardie ce ne sono altre più vecchie di piedi larghi e scalzi, con le dita divaricate, uguali a quelle che la sera del Festival hai visto nel fango. [tense] In mezzo corre una fila di orme più piccole, uno stivale stretto con il tacco basso, che va dritta alla lastra senza mai esitare.

    Galdrick si china accanto a te, e le ginocchia gli scricchiolano. [gruff] “Orchi, e uno che orco non è” dice, e si pulisce le dita sui calzoni. [satisfied] “Lo pensavo anch'io, e adesso lo pensiamo in due.”
  sepolcro-cimitero__1-fallimento: |
    Guardi a lungo, ma davanti alla cripta sono passate troppe guardie con gli stivali chiodati, e per te è tutto fango. [bitter] Quando ti rialzi hai le ginocchia bagnate e niente da dire.

    [calm] Galdrick aspetta a braccia conserte, senza fretta. Poi ti indica un tratto di terra vicino al muro, dove le guardie non sono passate, e si sposta di lato per lasciarti la luce.
  sepolcro-cimitero__2-successo: |
    Segui il muro dall'interno finché trovi il punto, dietro un cespuglio di bosso spezzato. Ti arrampichi, e sulle pietre in cima c'è fango secco e il segno di unghie lunghe. [tense] Dall'altra parte c'è un vicolo cieco. Dove sono atterrati conti le zolle schiacciate da cinque o sei corpi pesanti, e accanto la traccia leggera di uno che è sceso senza appoggiarsi.

    [wry] Quando ridiscendi Galdrick allunga la mano per aiutarti nell'ultimo salto, poi la ritira prima che tu la prenda, come se non fosse sicuro di doverla offrire.
  sepolcro-cimitero__2-fallimento: |
    La pietra del muro è umida, e a metà salita il piede ti scivola. [pained] Arrivi a terra sui palmi, che si sbucciano sulla ghiaia del vialetto, e le vedove al cancello trattengono il fiato insieme.

    Galdrick ti aiuta a rialzarti senza commentare. [deadpan] “Cinque o sei orchi, dal vicolo dietro il bosso” dice. “I miei li hanno contati il primo giorno.” [bitter] Ti succhi il sangue dal pollice e lo segui verso la cripta.
  sepolcro-cimitero__3-successo: |
    [wry] Nella casa che dà sul muro abita una donna anziana con in braccio un gatto senza coda, e per un po' parla solo del gatto. [ominous] Poi ti racconta che la notte della razzia le campane non la lasciavano dormire, e che dalla finestra ha visto lanterne coperte muoversi fra le tombe. Erano grossi e camminavano piegati, e davanti a tutti andava uno più piccolo, avvolto in qualcosa di scuro, senza lanterna, che sapeva dove andare.

    [quietly] Di Gundo dice che quella sera la sua candela si è spenta presto come tutte le sere, e che al mattino non ha sentito la pala.
  sepolcro-cimitero__3-fallimento: |
    [knocking on door] Bussi a tre porte. Alla prima ti chiedono se sei della Caserma, e quando dici di no ti chiudono lo stesso. [tense] Alle altre due non apre nessuno, anche se da dietro l'uscio senti qualcuno che trattiene il respiro.

    [wry] Un bambino seduto su un gradino ti guarda passare e ti mostra la lingua. [bitter] Torni da Galdrick con le mani vuote, e appena hai girato l'angolo senti alle tue spalle un'imposta che si riapre.
  sepolcro-cimitero__4-esito: |
    [wry] Il garzone ha le unghie nere di terra e un berretto troppo grande, che si toglie per prendere le monete e si rimette subito. Ti porta davanti alla cripta e con il manico della pala ti indica dove il fango ha tenuto le orme, larghe quelle degli orchi e una fila più piccola in mezzo, e il punto del muro da cui sono scesi.

    Su Gundo si stringe nelle spalle. [nervously] “Il vecchio mi pagava il venerdì, e questo venerdì non c'era” dice, e si calca il berretto fino alle orecchie.
  sepolcro-cimitero__5-esito: |
    [warm] Vantes ti posa la mano sul braccio, come in Cattedrale quando ti affida un ferito, e ti porta un passo lontano da Galdrick. [quietly] Quel mattino, ti racconta, la lastra era già spostata e davanti all'ingresso c'erano orme di piedi scalzi e larghi, con in mezzo una fila più piccola, uno stivale stretto che andava dritto alla cripta.

    [eerie] Poi abbassa la voce. Sui gradini ha sentito un freddo che con la stagione non c'entrava, e prima di scendere ha recitato la preghiera dei morti due volte, la seconda per sé. [sorrowful] “Padre Sollen era severo con gli accoliti” aggiunge, guardando la lastra. “Ma nessuno di noi gli avrebbe augurato di essere tirato fuori così.” [wry] Galdrick finge di non aver sentito.
  sepolcro-cripta: |
    [stone grinding] Due guardie fanno leva con un piede di porco, e la lastra si sposta di lato con un rumore lungo, da macina. [ominous] Dalle scale sale un freddo da cantina con un odore di terra chiusa, e la tua mano va da sola alla cintura. Galdrick accende una lanterna, ne dà un'altra a te e scende per primo, un gradino alla volta, con la spada ancora nel fodero.

    [eerie] Sui gradini la cera di molte candele è colata in strati, una messa sopra l'altra, e in un angolo c'è lo sgabello basso che Gundo usa per arrivare ai candelabri. Sotto, la stanza è più grande di quanto sembri da fuori. In mezzo c'è un sarcofago di pietra chiara, e lungo le pareti si aprono le nicchie dei sacerdoti più vecchi.

    [slowly] Quattro nicchie sono vuote, perché i loro morti stanno in piedi in mezzo alla stanza. Hanno la carne grigia e asciutta sulle ossa e una luce rossa in fondo alle orbite. [tense] Quando la lanterna li prende emettono un sibilo freddo e si voltano insieme, con un movimento troppo sciolto per dei cadaveri. [whispers] [uneasy] Questi si ricordano ancora come si cammina. [swallows] Senti il sudore raffreddarsi sulla nuca.

    [sword unsheathing] Galdrick sfila la spada. [gruff] “Due li tengo io” dice senza voltarsi. “Gli altri due sono tuoi. Detto questo, se vuoi tornare su, il momento è adesso.” [tense] In cima alle scale le guardie alzano gli scudi, e la porta resta aperta alle tue spalle.
  sepolcro-cripta__1-vittoria: |
    [tense] Il secondo morto ti viene addosso con le dita lunghe e grigie, e dove ti sfiora la pelle si raffredda e diventa insensibile. [breathing heavily] Lo colpisci finché la luce nelle orbite si spegne e le ossa si afflosciano sul pavimento con un rumore di fascina.

    [exhales] Dall'altra parte della stanza Galdrick ha già finito, e pulisce la lama sull'orlo del mantello. [satisfied] Ti guarda e annuisce una volta sola, poi prende la lanterna e va verso il sarcofago.
  sepolcro-cripta__1-sconfitta: |
    [gasps] Il morto ti prende alla gola e ti schiaccia contro la parete, e il freddo ti entra nelle ossa finché i denti battono da soli. [fearful] La lanterna cade, e per qualche respiro vedi solo la luce rossa.

    [exhausted] Ti risvegli in cima alle scale, con una guardia che ti tiene la testa. [bitter] Giù, Galdrick ha finito da solo. [tired] Prima di sera un'altra guardia ti porta un lasciapassare per i Quartieri Alti con la sua firma e un sacco di tela con dentro il nucleo di una delle macchine della razzia, che lo sceriffo ti chiede di portare alla Biblioteca appena ti reggi in piedi.
  sepolcro-cripta__2-successo: |
    [solemn] Alzi la mano aperta e dici le parole della Liturgia, quelle che si imparano per i funerali sperando di non doverle mai usare sul serio. [trembling] La voce ti trema sulla prima riga [determined] e poi si raddrizza. La luce nelle orbite dei due morti più vicini si fa piccola come la brace di una pipa e si spegne, e loro cadono dove sono.

    [relieved] Anche i due che Galdrick tiene a bada esitano, e lui ne approfitta. [wry] Quando è finita lo sceriffo si tocca la fronte con il segno dell'Albero, in fretta, quasi di nascosto.
  sepolcro-cripta__2-fallimento: |
    [pained] A metà della seconda riga la lingua ti si inceppa, e il Mana ti torna indietro come una frustata dietro gli occhi. [tense] Il morto più vicino ti è addosso prima che tu ricominci, e dove le sue dita ti stringono il collo la pelle diventa fredda e insensibile. [breathing heavily] Galdrick chiama giù le guardie, e quando la stanza torna ferma sei seduto sui gradini con il sangue al naso e una spalla che non si alza.

    [tired] Prima di sera una guardia ti porta un lasciapassare per i Quartieri Alti con la firma dello sceriffo e un sacco di tela con il nucleo di una delle macchine della razzia, da portare alla Biblioteca.
  sepolcro-cripta__3-successo: |
    [determined] Resti sui gradini con la lanterna sopra la testa, e Galdrick chiama giù le guardie. Per tutto lo scontro tieni il braccio teso, anche quando comincia a tremare e il sibilo dei morti ti entra nelle orecchie e ci resta. [tense] Uno dei quattro tenta le scale, e lo respingi con il tacco dello stivale senza abbassare la luce.

    [exhales] Quando l'ultimo cade il braccio non vuole più scendere, e devi abbassarlo aiutandoti con l'altra mano.
  sepolcro-cripta__3-fallimento: |
    [uneasy] Il sibilo dei morti ti entra nelle orecchie e ti scende nelle ginocchia, e a un certo punto la lanterna non è più nella tua mano. [metal clattering on stone] Rotola giù per i gradini e si spegne. [fearful] Nel buio senti Galdrick imprecare a denti stretti e le guardie scendere di corsa, e un morto risale i gradini fino a te prima di loro. [breathing heavily] Quando riaccendono la luce sei seduto sul primo gradino, con il collo freddo dove ti ha preso e un taglio sulla fronte che non ricordi di esserti fatto.

    [tired] Prima di sera una guardia ti porta un lasciapassare per i Quartieri Alti e un sacco di tela con il nucleo di una delle macchine della razzia, da portare alla Biblioteca.
  sepolcro-cripta__4-esito: |
    [tense] Risali i gradini all'indietro, senza staccare gli occhi dalla luce rossa, e ti fermi fuori fra le guardie. [swords clashing] Da sotto arrivano il sibilo dei morti e i colpi della spada di Galdrick. [uneasy] Ti accorgi di avere le unghie piantate nei palmi.

    Quando lo sceriffo risale ha il mantello strappato e il fiato corto, e non ti dice niente. [resigned] Prima di sera però ti manda una guardia con un lasciapassare per i Quartieri Alti e un sacco di tela con il nucleo di una delle macchine della razzia, da portare alla Biblioteca. [quietly] Il sibilo te lo senti nelle orecchie fino a notte.
  sepolcro-cripta__5-esito: |
    [determined] Ti pianti sul terzo gradino con la lanterna sopra la testa e il gomito bloccato contro il muro, come sulle piattaforme, dove il peso della luce deve scaricarsi sull'osso del braccio. Galdrick chiama giù le guardie. [calm] Per tutto lo scontro la luce non trema, e quando uno dei morti tenta le scale lo respingi con il tacco senza abbassarla.

    Il sibilo ti entra nelle orecchie, e tu lo conti come contavi i colpi di piccone che salivano dal pozzo. [satisfied] Quando l'ultimo morto cade, Galdrick alza gli occhi verso la lanterna e ti dice che i Raschiatori li riconosce da come tengono il gomito.
