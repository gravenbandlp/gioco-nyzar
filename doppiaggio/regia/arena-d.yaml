# Regia del doppiaggio: L'Arena di Qir-Azel
regia:
  lo-scontro-delle-ere: |
    [crowd roaring] Il corridoio si apre sull'Arena, e gli spalti sono pieni fino all'ultima fila. [awed] Il terreno è cambiato ancora. Ci sono camminamenti in muratura sopra pozze d'acqua scura, piloni di cristallo che mandano una luce innaturale e, al centro, un pilone più grosso degli altri. [ominous] Nelle pozze si muove qualcosa di lungo e color piombo, e un inserviente ci butta dentro le frattaglie del mercato con un secchio.

    [metal clanging] La piattaforma su cui ti hanno fatto salire si solleva con un clangore fino al camminamento centrale, e dall'altra parte sale quella di Galdrick. [tense] Lo sceriffo è in armatura scura e mantello nero, e Dragna gli sta accanto piantata come una torre di ferro. Ilvaena Sorathe guarda l'arena con calma, e Ottilia Sanvel tiene le mani rilassate lungo i fianchi.

    Orazio avanza sul palco degli spalti. [shouting] “Avete visto cadere bestie che avrebbero spezzato interi eserciti!” Si volta verso di te, legge il tuo nome da un cartoncino e lo grida, e la folla lo ripete. [dramatic] “Dall'altra parte, i migliori che questa città abbia mai forgiato, capeggiati dal nostro sceriffo e protettore Toren Galdrick!” Alza una mano, e cala il silenzio. [pause] “Che lo scontro delle ere abbia inizio!”

    [determined] Tenebra va dritto su Dragna. Besk e Corin si prendono Ilvaena e Ottilia, come possono. [calm] Sul camminamento centrale restate tu e Galdrick, che ti saluta alzando la lama.
  lo-scontro-delle-ere__1-vittoria: |
    [swords clashing] Galdrick para tutto quello che gli dai, finché non gli dai più niente da parare e aspetti tu. [tense] Quando finalmente attacca lo prendi sotto la guardia, e lo sceriffo si siede sul camminamento con la lama di traverso sulle ginocchia. [wry] Dall'altra parte Tenebra ha appena visto Ferro andare giù, e se lo gode in silenzio.

    [crowd cheering] Galdrick si rialza da solo e ti alza il braccio verso la tribuna prima che lo faccia Orazio. [exhales] Orvald ti allaccia in vita una cintura di cuoio rosso con la fibbia d'alloro, e ti mette in mano la borsa del campione. [solemn] Il giorno dopo uno scalpellino incide il tuo nome nella pietra, sotto quelli dei campioni di cent'anni fa.
  lo-scontro-delle-ere__1-sconfitta: |
    [tense] Galdrick aspetta che sbagli, e alla fine sbagli. [pained] Il piatto della sua lama ti prende al polso, e il resto lo fa il camminamento bagnato. Finisci in ginocchio sull'orlo della pozza, con quella cosa color piombo che ti passa sotto il naso. [bitter] Dall'altra parte la tua squadra cede un pezzo alla volta.

    [crowd chanting] La folla però è in piedi, e grida il tuo nome insieme al suo. Galdrick ti tende la mano per rialzarti e non te la lascia finché Orazio non ha finito di parlare. [warmly] “Ti ho battuto di un soffio” ti dice all'orecchio. “La prossima volta te lo ricordo io.” [resigned] Orvald ti conta il premio del secondo.
  lo-scontro-delle-ere__2-successo: |
    [thoughtful] Il pilone si accende quando qualcuno ci posa la mano piatta su una delle placche d'ottone, e lo capisci guardando Ottilia che ci prova. [urgent] Ci arrivi un passo prima di Galdrick. [electric humming] La luce ti entra nelle braccia, e per un po' la lama ti pesa la metà. Lo sceriffo para i primi colpi con il piatto, come sempre, ma sei più veloce di quanto eri un momento prima e lui sbaglia la misura di un dito. [satisfied] Il colpo dopo lo prende sotto la guardia, e lo sceriffo si siede sul camminamento con una risata corta.

    [warmly] “Vince chi capisce l'arena” dice, quando si rialza, ed è Orvald dal banco a ripeterlo forte. [exhales] Ti allacciano in vita la cintura con la fibbia d'alloro, e ti consegnano la borsa del vincitore. Il giorno dopo il tuo nome viene inciso nella pietra.
  lo-scontro-delle-ere__2-fallimento: |
    [electric crackling] Tocchi la placca sbagliata, e il pilone ti scarica nel braccio un colpo che te lo lascia appeso e insensibile fino alla spalla. [bitter] Galdrick invece tocca quella giusta e ci tiene sopra la mano. [pained] Il resto dura poco, e finisci sulla schiena con la sua lama piatta sullo sterno.

    [crowd chanting] La folla grida il tuo nome lo stesso. Galdrick ti rialza e ti tiene la mano finché Orazio non ha finito. [warmly] “Hai capito l'arena un momento dopo di me” ti dice all'orecchio mentre la folla applaude. “La prossima volta la placca giusta la tocchi tu.” [resigned] Orvald ti porge la borsa del secondo.
  lo-scontro-delle-ere__3-successo: |
    [determined] Ti butti sul perno con tutto il peso, [wood cracking] e la piattaforma si sgancia con un colpo secco. [tense] Galdrick fa due passi di corsa sul legno che si inclina e salta, ma atterra sull'orlo del camminamento, dove ci sei tu. [splash] Lo spingi con la spalla, e lo sceriffo finisce nell'acqua scura fino alla cintura. [amused] Ne esce a bracciate prima che arrivi la cosa color piombo, sputando acqua per il gran ridere.

    [exhales] Ti allacciano in vita la cintura con la fibbia d'alloro e ti contano il premio del torneo. [wry] Il giorno dopo Galdrick passa a vedere lo scalpellino che incide il tuo nome, e gli lascia una mancia.
  lo-scontro-delle-ere__3-fallimento: |
    [splash] Il perno cede, ma dalla parte sbagliata, e nell'acqua scura ci finisci tu. [fearful] Qualcosa di lungo ti sfiora la gamba e poi ti morde il polpaccio attraverso lo stivale, e ti tira giù finché un inserviente non lo colpisce con l'asta. [breathing heavily] Quando risali sul camminamento la tua squadra ha già perso, e Galdrick ti aspetta con la mano tesa.

    La folla grida il tuo nome lo stesso. [warmly] “Ce l'avevi quasi fatta” dice lo sceriffo, e lo dice sul serio. [wry] Orvald ti conta il premio del secondo, e ti presta un panno per asciugarti.
  lo-scontro-delle-ere__4-successo: |
    [determined] Lo fai correre per tutto il camminamento. [crowd roaring] Ogni volta che lui alza la lama tu indietreggi e chiami la tribuna, e la tribuna ti risponde. Dopo un po' Galdrick respira con la bocca aperta, e la guardia gli scende di un palmo. [breathing heavily] Ci entri con tutto il peso che ti resta. Lo sceriffo abbassa la lama da solo e ti tende la mano.

    [warmly] “Mi hai fatto vecchio davanti a tutta la città” ti dice, “e hai fatto bene.” Ti alza il braccio verso la tribuna. [exhales] Orvald ti allaccia in vita la cintura con la fibbia d'alloro e ti conta il premio, e il giorno dopo il tuo nome è inciso nella pietra.
  lo-scontro-delle-ere__4-fallimento: |
    [breathing heavily] Lo fai correre, ma il fiato finisce prima a te. [wry] Galdrick ha passato la vita a inseguire gente nei vicoli della Città Bassa, e quando ti fermi è ancora lì. [pained] Il piatto della sua lama ti cala sulla spalla e poi sul fianco, e ti mette in ginocchio senza più fiato per rialzarti da solo.

    [crowd chanting] La folla grida il tuo nome lo stesso. [amused] Galdrick ti alza il braccio insieme al suo, cosa che Orazio non aveva previsto. [resigned] Orvald ti consegna la borsa del secondo.
  la-rivincita: |
    [calm] Certi pomeriggi Galdrick viene all'Arena a tirare di scherma con le reclute della Guardia, in maniche di camicia, con il taccuino lasciato sul banco di Orvald perché nessuno ci metta le mani. Lo trovi sul camminamento centrale, sopra l'acqua scura, mentre corregge la guardia a un ragazzo che la tiene troppo alta.

    Quando ti vede manda via la recluta con una pacca e infila i pollici nella cintura. [wry] Sotto la camicia si vede la fibbia d'alloro della cintura del campione. [warmly] “Sapevo che saresti venuto” dice. “Qui alla rivincita si ha diritto, e a me un campione che si fa sfidare piace più di uno che si fa guardare. [shouting] Orvald!” [amused] Dal banco Orvald alza la mano senza voltarsi, e Pett apre un occhio.
  la-rivincita__1-vittoria: |
    [swords clashing] Per un pezzo è come in finale. Lui para con il piatto della lama e aspetta, e tu non gli dai niente. [tense] Poi stavolta sbaglia lui, di un mezzo passo, e tu sei pronto. Galdrick si trova la tua lama sotto il mento e la guarda con interesse. [chuckles] Poi ride, si slaccia la cintura del campione e te la mette in mano. [warmly] “Me la sono goduta abbastanza” dice. [exhales] Il giorno dopo uno scalpellino aggiunge il tuo nome nella pietra, sotto il suo.
  la-rivincita__1-sconfitta: |
    [tense] Galdrick ti aspetta per un pezzo senza attaccare mai, finché sei tu a stancarti di aspettare. [pained] Il piatto della sua lama ti prende alla spalla e ti mette in ginocchio sul camminamento, senza cattiveria. Lo sceriffo ti tende la mano e ti tira su con uno strattone. [warmly] “Il camminamento è sempre qui, e io ci vengo il martedì” dice, [wry] mentre dal banco Orvald scrive una riga sul registro.
  la-rivincita__2-successo: |
    [thoughtful] Lo lasci attaccare per un pezzo e ti limiti a guardarlo. Dopo ogni parata abbassa il gomito destro di un dito per riprendere fiato, ed è un'abitudine vecchia, da uomo che ha passato la vita a parare. [determined] Al terzo gomito ci entri. [amused] Galdrick si trova la tua lama sotto il mento e scuote la testa ridendo, poi si slaccia la cintura del campione e te la mette in mano. [exhales] Il giorno dopo il tuo nome viene inciso nella pietra.
  la-rivincita__2-fallimento: |
    [tense] Ti sembra di vedere il varco dopo una parata, e ci entri. [bitter] Il varco te l'ha aperto lui apposta, e il piatto della sua lama ti prende al polso. [splash] La tua arma finisce nell'acqua scura, e tocca a un inserviente ripescarla con un uncino mentre la cosa color piombo gli gira intorno. [pained] Il secondo colpo di piatto ti arriva sulle costole mentre guardi l'acqua, e ti piega in due. [warmly] Galdrick ti aspetta con la mano tesa e ti dice di tornare quando vuoi, che il martedì lui c'è sempre.
  la-rivincita__3-successo: |
    [calm] Per tutto il pomeriggio non attacchi quasi mai. Lo fai girare sul camminamento da una piattaforma all'altra, lungo le scale di pietra che salgono e scendono, finché il sole scende sotto gli spalti e le reclute si siedono a guardare. [satisfied] Alla fine Galdrick abbassa la lama da solo, con la camicia fradicia incollata alla schiena, e si slaccia la cintura del campione. [breathing heavily] “Prendila, prima che mi passi la voglia di dartela” dice, e te la porge con tutte e due le mani. [exhales] Il giorno dopo il tuo nome viene inciso nella pietra.
  la-rivincita__3-fallimento: |
    [breathing heavily] Lo fai girare sul camminamento finché le reclute si siedono a guardare, ma il fiato finisce prima a te. [wry] Galdrick ha passato trent'anni a inseguire ladri su per le scale della Città Bassa. [pained] Ti mette giù con un colpo di piatto quando le gambe ti hanno già tradito, e cadendo batti il ginocchio sullo spigolo di un gradino. [warm] Poi ti offre la sua fiaschetta d'acqua e ti dice che il martedì lui è sempre qui.
  la-rivincita__4-esito: |
    Galdrick si accorge di dove guardi e si tira su la camicia senza imbarazzo. [somber] La cicatrice è lunga una spanna e ancora lucida, e i segni dei punti si contano uno per uno. [deadpan] “Tira quando alzo la lama sopra la testa” dice, “e allora la tengo più bassa.” [wry] Si riabbassa la camicia e ti fa segno di salire sul camminamento.
