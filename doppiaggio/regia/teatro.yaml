# Regia del doppiaggio: La Promessa dell'Arpia
regia:
  teatro-di-belcanto: |
    [wry] Il Teatro delle Meraviglie occupa un intero lato della piazza, con le colonne di marmo bianco e una fila di attori di pietra in posa sul cornicione. A uno manca la mano che reggeva la maschera, e da come è annerito il moncherino manca da parecchi inverni. Sul portone è incollato il manifesto della Promessa dell'Arpia. [dryly] La data della prima, la sera dopo il Festival, è coperta da una striscia di carta messa di traverso, con la parola rinviata scritta a pennello e una goccia di vernice colata fino al bordo.

    Nel ridotto c'è odore di cera d'api e di vino rovesciato. [footsteps on wooden stairs] Orazio Belcanto ti vede dalla scala e scende trotterellando, in una giacca color prugna con gli alamari d'oro. [amused] Ha un anello a ogni dito e la voce un'ottava più in alto del necessario.

    [theatrical] “Anima cara, benvenuta nel tempio della scena!” Ti prende la mano fra le sue, e gli anelli sono freddi. [dramatic] “Gli orchi mi hanno rubato la prima, e io me la riprendo. La Promessa dell'Arpia è un'opera in cui recita la città intera, gente comune come te. Mi servono attori e mani da sarta, e braccia per le funi. [slyly] Per gli attori valgono i canoni estetici, s'intende. Quelli li stabilisce l'Arte in persona.” [wry] Lo dice abbassando gli occhi con modestia, e intanto ti sta misurando le spalle.
  teatro-di-belcanto__1-successo: |
    Orazio ti fa salire sul palco e ti gira intorno due volte. [amused] Ti alza il mento con un dito inanellato, ti misura il profilo con il pollice teso come fanno i pittori e decreta che il sinistro è accettabile e il destro andrà tenuto in ombra, per il bene di tutti. [confident] Poi ti chiede una battuta del secondo atto, e tu la dici guardando la galleria vuota come se fosse piena.

    [hands clapping] Batte le mani, e gli anelli tintinnano. [delighted] “Farai un avventuriero, anima mia. Il secondo, quello che entra dopo e che il pubblico si ricorda di più.”
  teatro-di-belcanto__1-fallimento: |
    [nervous] A metà della battuta ti si secca la bocca, e la seconda metà esce con una voce che non sapevi di avere. [wry] Orazio chiude gli occhi e resta così per un po', con le mani giunte sotto il mento.

    [solemn] “L'Arte ha parlato” dice alla fine. [cheerfully] “Però l'Arte ha bisogno anche delle comparse, e nel terzo atto mi mancano due orchi e un minatore svenuto. Ti piacciono le maschere?” [deadpan] Ti mette in mano una maschera di cartapesta che puzza ancora di colla.
  teatro-di-belcanto__2-successo: |
    Orazio ti porta in sartoria, dove su un manichino senza testa sono appese due ali di piume nere montate su stecche di canna. Si aprono tirando un cordino, e a metà corsa si bloccano ogni volta. [thoughtful] Ci passi le dita sotto e trovi una stecca incollata al rovescio, con le piume che sfregano sulla stoffa. [feathers rustling] La giri, e le ali si aprono fino in fondo con un fruscio lungo.

    [satisfied] Orazio emette un piccolo grido. [delighted] “Costumi e scenografie, anima mia! Da oggi questa stanza è tua, e anche la colla.”
  teatro-di-belcanto__2-fallimento: |
    [whoosh] Tiri il cordino con troppa decisione, e un'ala si apre di colpo e ti frusta la faccia. [wry] Ti ritrovi con una piuma nera in bocca e Orazio con le mani sul cuore, che controlla prima le ali e poi te.

    [relieved] “Le ali sono salve” dice, sollevato. [warmly] “La sartoria vuole la mano leggera, anima cara. Le funi del sipario invece non si offendono di niente.” Ti affida al vecchio macchinista, che ti porge un paio di guanti di cuoio più grandi delle tue mani.
  teatro-di-belcanto__3-esito: |
    [calm] Orazio ti affida al vecchio macchinista, un uomo curvo con le dita storte dalle corde, che ti porta dietro le quinte e ti mostra le botole e la ruota del sipario. Su ogni fune è legato un nastrino colorato, e accanto alla ruota c'è un foglio con la legenda dei colori scritta a mano, che lui non guarda mai.

    [gruff] “Il rosso è il sipario” dice. “Il nero non lo tocchi, perché tiene su il lampadario.” [wooden wheel creaking] Ti fa provare la ruota due volte, e alla seconda annuisce senza dire niente.
  teatro-di-belcanto__4-esito: |
    Gli dici il nome della tua famiglia, e Orazio porta tutte e due le mani al petto. [delighted] “Il palco in terza fila, quello con la tenda rammendata!” [warm] Ti racconta che da bambino ti portavano a teatro e che al secondo atto dormivi sempre, con la guancia sulla balaustra, e che lui lo prendeva come un giudizio sull'opera.

    [amused] Poi ti fa salire sul palco, ti alza il mento con un dito inanellato e decreta che il profilo sinistro è quello di tua nonna e il destro andrà tenuto in ombra, per rispetto a lei. [warmly] “Farai un avventuriero, anima mia. Il secondo, quello che entra dopo e che il pubblico si ricorda di più.” [wry] Ti chiede soltanto di restare sveglio fino al terzo atto.
  la-prima-della-promessa: |
    [crowd murmuring] Sulla striscia rinviata del manifesto è stata incollata una data nuova, e stasera la platea è piena fino al loggione. Lucia Malgrani è sola nel suo palco in seconda fila, dritta come una candela, e la Casa dei Nodi ha mandato mezza Gilda. [nervous] Dalle quinte senti l'odore delle lampade e del sudore della compagnia, e lo stomaco ti si chiude per conto suo.

    Orazio apre il primo atto. Il suo Asvorko conta le monete delle miniere di Valpeltro una per una, e quando la regina arpia entra nell'ufficio avvolta nel mantello di piume [hushed] la sala trattiene il fiato. Violante gli promette la lealtà degli operai in cambio di un nido nelle gallerie, e Asvorko accetta. [amused] Alla terza scena Grusk si presenta come “Grusk, signore”, e il loggione ride così forte che lui fa un inchino. [whistling from the crowd] Quando Rilla si siede sulla scrivania di Asvorko, dal loggione parte un fischio.

    Nel secondo atto Mauro Scrocco, nei panni di Sigor, assolda gli avventurieri alla taverna del Fiasco Asciutto e apre il tunnel di contrabbando sotto le botti. [tense] Poi viene il terzo atto, con gli orchi in maschera e il golem di cartapesta. [short pause] Nel nido aspettano le trappole, e il momento che hai provato tante volte è arrivato.
  la-prima-della-promessa__1-successo: |
    [determined] Pianti i piedi sulle assi e dici la battuta all'ultima fila, senza fretta. [dramatic] Orazio crolla in ginocchio e si pente con le lacrime vere e gli anelli che battono sul legno, la regina ride la sua ultima risata e le arpie cadono. Gli operai di Valpeltro tornano a casa, e Asvorko promette di cambiare.

    [audience applauding] La sala si alza in piedi. [wry] Da un palco anche Julia Castaldi applaude, con i guanti. [satisfied] Dopo lo spettacolo Orazio ti mette in mano un sacchetto di velluto con la tua parte dell'incasso.
  la-prima-della-promessa__1-fallimento: |
    [tense] Apri la bocca e la battuta non c'è più. Dalla quinta Mauro te ne sussurra una, ed è quella del tunnel di contrabbando. [mortified] Tu la ripeti ad alta voce, nel nido delle arpie, davanti a mille persone.

    [wry] Orazio non fa una piega. Si pente lo stesso, dicendo che perfino i tunnel gli hanno insegnato qualcosa, e la sala lo prende per satira e ride. [relieved] L'applauso alla fine è lungo, e la tua parte dell'incasso arriva comunque, un po' più leggera.
  la-prima-della-promessa__2-successo: |
    [cardboard cracking] Il golem avanza sulla carriola di Grusk e si spacca nel punto giusto, e la prima fila sobbalza. [awed] Quando la regina ride tiri i cordini, e le ali si aprono fino in fondo, nere sotto le lampade. In sala si sente un grido trattenuto.

    [satisfied] Dopo lo spettacolo un mercante della Gilda ti cerca dietro le quinte. Vuole sapere chi ha costruito quelle ali e ti lascia il suo nome per un lavoro, mentre Orazio ti conta in mano la tua parte dell'incasso.
  la-prima-della-promessa__2-fallimento: |
    [tense] A metà del combattimento la testa del golem si stacca, rotola giù dal palco e si ferma ai piedi di un mercante della Gilda in prima fila. [deadpan] Lui la guarda come si guarda un conto sbagliato.

    Orazio non perde il ritmo. [shouting] “Così finiscono i golem di chi tradisce i lavoratori!” grida, e la sala applaude. [relieved] La serata va avanti fino al pentimento di Asvorko, e la tua parte dell'incasso arriva lo stesso.
  la-prima-della-promessa__3-successo: |
    [focused] Apri la botola del pozzo nascosto sotto il primo orco, lasci cadere la trave di cartapesta un palmo davanti agli avventurieri e fai scattare l'arco con una freccia di piuma. [crowd cheering] A ogni trappola il loggione urla, e Asvorko arriva al pentimento con la sala già in piedi.

    [satisfied] Dopo lo spettacolo il vecchio macchinista ti fa un cenno con la testa. [warm] Orazio ti paga la tua parte dell'incasso e ti dice che un giorno racconterai di questa sera ai nipoti.
  la-prima-della-promessa__3-fallimento: |
    [tense] Sbagli fune, e la botola del pozzo si apre sotto Grusk invece che sotto l'orco. Grusk sparisce, e in sala cade un silenzio lungo.

    [long pause] Poi la sua testa riemerge dal pavimento. [cheerfully] “Grusk sta bene!” annuncia al pubblico, e [crowd laughing] la sala viene giù dalle risate. [wry] Orazio dirà poi che è stato il momento più alto della serata, e ti paga la tua parte con una smorfia.
  la-prima-della-promessa__4-successo: |
    [ominous] Violante apre le ali sopra Asvorko. [menacing] “Spezzatemi le ali quante volte volete, signor Asvorko. La regina torna sempre.” Ti torna in mente una voce rotta, sulla Roccia di Wren, e il sudore ti si raffredda sulla nuca. [whispers] [tense] È una battuta, e l'ha scritta Orazio. [exhales] Le tue mani cercano la cintura, e le rimetti dove devono stare.

    [calm] Fai la tua parte fino in fondo, e nessuno in sala si accorge di niente. Agli applausi Violante ti stringe la mano un momento più del necessario, poi Orazio ti paga la tua parte dell'incasso.
  la-prima-della-promessa__4-fallimento: |
    [ominous] Violante apre le ali sopra Asvorko. [menacing] “Spezzatemi le ali quante volte volete, signor Asvorko. La regina torna sempre.” [fearful] Ti si gela il sangue e resti fermo, con la bocca aperta e mille persone che aspettano.

    [tense] Violante se ne accorge. Ti gira intorno con le ali spalancate e inventa una battuta che ti rimette in scena. [bitter] Orazio, dopo, giura che la tua è stata la pausa più ispirata della serata, e ti paga senza sapere perché ti tremano ancora le dita.
