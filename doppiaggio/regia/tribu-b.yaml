# Regia del doppiaggio: Le cinque tribù
regia:
  cena-con-ilvaena: |
    [crowd murmuring] La sera il Grifone di Ferro è pieno di Raschiatori appena tornati dal turno, e il vapore della zuppa appanna le finestre ancora inchiodate. [warm] Ilvaena Sorathe ha preso il tavolo d'angolo e quasi non la riconosci. Si è lavata i capelli, che adesso sono di un rame acceso e le arrivano alle scapole, e a giudicare dagli occhi ha dormito. [wry] L'arco lungo è appoggiato al muro senza la corda, e la faretra occupa la sedia accanto, così nessuno ci si siede.

    [warmly] “Prima la tua razzia” dice, e ti spinge davanti un boccale. [scoffs] “A Fondobosco l'ho sentita raccontare dagli orchi, e raccontano male.”

    Le racconti la razzia da dove l'hai vista tu, e quello che in città si dice degli orchi che si sono gettati nella Cicatrice pur di non farsi prendere. Ilvaena ascolta con il mento sul pugno e ogni tanto ti ferma per chiederti da che parte soffiava il vento. [amused] Brunella Fennick vi mette davanti due scodelle di stufato e resta lì finché non hai preso la prima cucchiaiata. [tender] In fondo alla sala Liaren Tarvelin accorda il samisen e ogni tanto guarda verso il vostro tavolo, perché Ilvaena è la sua amica più vecchia.

    Quando hai finito, Ilvaena posa il boccale e si pulisce la schiuma dal labbro con il dorso della mano. [whispers] [amused] Adesso tocca a lei, e lo sa. [short pause] “Chiedi” dice.
  cena-con-ilvaena__1-esito: |
    Ilvaena le conta sulle dita, cominciando dal pollice. [wry] Gli Spiumatori stanno nelle grotte sul versante ovest del Gradone Rosso, e sono i meno aggressivi; mangiano uccelli crudi e assalgono solo chi viaggia da solo. [uneasy] Gli Spacca-ossa vivono a sud nella Palude Acquanera. Nuotano come lontre e ti aspettano sott'acqua invece di inseguirti. Nel Bosco della Forca ci sono i Nove Chiodi, che assaltano le carovane e con il ferro rubato si fanno armi e palizzate. [ominous] Più a est del Gradone c'è Fondobosco, la tribù più grande, che potrebbe schiacciare la città da sola se le famiglie non passassero l'anno a sgozzarsi fra loro.

    [somber] “L'ultima è Capomozzo, su un'isola al largo di Rovolungo” dice, e si guarda il mignolo. “Vista da nord pare una testa mozzata. [bitter] È il covo migliore della regione, e loro lo sanno.”
  cena-con-ilvaena__2-esito: |
    [thoughtful] “Gli orchi vivono poco e male” dice Ilvaena, “e quando uno si fa un nome se l'è guadagnato.” Adesso ne conta sei. Borgoth il Gigante è di Fondobosco, figlio di un orco e di una ogre, e gli interessa cacciare più che comandare. [wry] Uzgreth era il campione dei Nove Chiodi, con un pessimo carattere e una spada da ogre troppo grande anche per lui. [eerie] Mesi fa ha trovato un nascondiglio in una caverna ed è sparito, e i suoi lo credono un fantasma che sgozza chi va a cercarlo. Nella Palude c'è Bolgrum, il capotribù, così grasso che non si alza più dal trono, [ominous] e con lui Skarr, che mangia carne d'orco quando non trova di meglio.

    [tense] Poi c'è Balthog il Prescelto, a Capomozzo. “Dorbak, quello del cinghiale corazzato, era il suo braccio destro” dice, e alza il boccale verso di te. [quietly] Il sesto è il mezzogre Zagrath, e quando lo nomina Ilvaena abbassa la voce.
  cena-con-ilvaena__3-esito: |
    [quietly] Zagrath vive nel nord di Rovolungo e gira fra le cinque tribù con la merce rubata alle carovane, che rivende agli orchi in cambio di alcol e di notizie, a volte di frecce incantate. Lo accolgono dappertutto e non si fidano di lui da nessuna parte. [cold] Gli elfi li odia più di qualunque altra cosa. [somber] Ilvaena si tocca una cicatrice bianca sotto la clavicola, mezza nascosta dal colletto, e ti dice che si sono affrontati più volte senza che nessuno dei due l'abbia mai spuntata.

    [wry] “Ha un arco lungo quanto me” dice, “e la mira ce l'ha migliore della mia.” Beve un sorso. [determined] “Prima o poi uno dei due cade, e ho deciso da un pezzo che non sarò io.”
  cena-con-ilvaena__4-esito: |
    Le dici che i cavalli per la caccia di Corin te li ha dati Dolovan Stroud, e Ilvaena posa il cucchiaio nella scodella e lo riprende subito dopo. [warmly] “Ha ancora Squash, quel bestione?” chiede, e quando le dici di sì sorride al piatto. [tender] Sono stati insieme a lungo, racconta, poi lui l'ha voluta qui in città, e lei aveva già scelto i confini di Velthar.

    [wry] “Ci parliamo poco” dice. “Ci guardiamo parecchio, però.” [amused] In fondo alla sala Liaren ha smesso di accordare il samisen e fa finta di niente con una certa fatica.
  cena-con-ilvaena__5-esito: |
    [thoughtful] Ilvaena disegna la regione con la punta del dito nell'unto del tavolo, con Qir-Azel in mezzo e le tribù tutto intorno. Andare contro Capomozzo o Fondobosco adesso sarebbe un suicidio, perché sono troppi. Con la Palude Acquanera è diverso. Gli Spacca-ossa sono la tribù più piccola e la più isolata, e alla razzia hanno perso parecchi guerrieri. [tense] Restano Bolgrum e Skarr, che insieme fanno paura anche a lei, e una palude dove senza guida ci si perde in mezza giornata.

    [determined] “Se vuoi far capire alle bestiacce che allearsi costa caro, comincia da lì” dice. [amused] Poi cancella la mappa con il palmo, e Brunella arriva con lo straccio prima che abbia finito. [warm] Sul retro del conto, più tardi, te la ridisegna a carboncino, con i canali del fiume e una croce dove sta la torre.
  cena-con-ilvaena__6-esito: |
    Le chiedi da che parte rientra nel Bosco, e quando le racconti del Circolo e dei sentieri segnati con tre tacche sulla corteccia [warm] Ilvaena ride piano e ti dice il nome della radura dove dorme d'estate. [thoughtful] Poi disegna la regione nell'unto del tavolo. Capomozzo e Fondobosco sono troppi, dice. Gli Spacca-ossa della Palude Acquanera invece sono pochi e isolati, alla razzia hanno perso parecchi guerrieri, e gli restano Bolgrum e Skarr.

    Sul retro del conto ti ridisegna la palude a carboncino, con i canali del fiume e una croce dove sta la torre. Accanto ai canali aggiunge tre tacche nei punti dove l'acqua è bassa. [warmly] “Così la leggi come la leggerei io” dice.
  rapporto-in-municipio: |
    [tired] Torni in città con il fango della Palude ancora negli orli dei calzoni, e sui gradini del Municipio lasci delle impronte che un inserviente segue con lo straccio fino al piano di sopra, una alla volta, senza alzare la testa. [wry] Nell'ufficio di Julia Castaldi questa volta c'è una sedia anche per te. Galdrick resta in piedi lo stesso, con i pollici nella cintura. Ilvaena è seduta sul davanzale con un ginocchio al petto, e appena entri ti guarda prima gli stivali e poi la faccia.

    Sulla scrivania posi il fascio di pergamene che hai portato via dalla torre. [mysterious] Erano di un mago che abitava lassù prima degli orchi, chissà quanti anni fa, e sono coperte di simboli e di formule che a guardarle troppo a lungo ti fanno pulsare le tempie. Gli orchi non le avevano mai toccate, e sopra c'era un dito di polvere. [uneasy] Ti accorgi di avere ancora nelle narici l'odore di muffa della torre.

    Julia scosta la pratica che stava leggendo e intreccia le dita sul piano della scrivania. [coldly] “Dall'inizio” dice. [deadpan] “E senza abbellire, che le storie belle me le raccontano già in Consiglio.”
  rapporto-in-municipio__1-esito: |
    Racconti la palude e l'isola di fango con la torre in mezzo, fino al trono di teschi, e poi come sono morti Bolgrum e Skarr. [curious] Ilvaena ti fa ripetere due volte la parte di Skarr, poi scende dal davanzale. [warmly] “Gli davo la caccia da anni” dice, senza rancore. [amused] “Mi hai risparmiato parecchio fango.”

    [satisfied] Galdrick scrive i due nomi sul taccuino e ci tira sopra una riga ciascuno. Julia chiede quanti orchi restano nella palude e chi li comanderà adesso. Ilvaena risponde che ne restano una decina senza un capo, e che per un po' si azzanneranno fra loro.
  rapporto-in-municipio__2-esito: |
    Racconti la palude e l'isola di fango con la torre in mezzo, fino al trono di teschi. [bitter] Poi racconti come Bolgrum e Skarr sono spariti fra i canali con l'acqua alla cintola. [wry] Ilvaena dice che Bolgrum non l'aveva mai visto camminare, e che doveva essere uno spettacolo. [thoughtful] “Senza torre e senza trono per gli Spacca-ossa è un capo a metà” dice. [tense] “Skarr invece, da solo, è peggio di prima. Terrò d'occhio i villaggi del sud.”

    Galdrick scrive i due nomi sul taccuino e ci mette accanto un punto di domanda. [resigned] Quando Julia chiede se torneranno presto, Ilvaena alza le spalle e dice che prima dovranno leccarsi le ferite, e che nella palude ci vuole tempo anche per quello.
  rapporto-in-municipio-congedo: |
    Julia sfoglia le pergamene una alla volta senza leggerle, e le impila con gli angoli pari. Le manderà in Biblioteca, dice, dove qualcuno saprà dire di chi erano. Poi apre il registro del Consiglio.

    [somber] Galdrick parla poco, come sempre. [wry] Secondo lui una tribù su cinque ha avuto quello che si meritava, e le altre quattro nemmeno se ne sono accorte. [tense] Il fronte resta largo, dal Bosco della Forca fino al mare di Rovolungo, e la Caserma non ha gli uomini per tenerlo. Domattina parte per Ghoran a prendere uomini e certi documenti che gli servono, e starà via finché a Ghoran non avrà finito, qualche settimana se gli va bene. [gruff] “Mentre sono via tieni d'occhio la città” dice. “Se succede qualcosa lo scrivi e lo lasci al sergente di turno.”

    Ilvaena tornerà al confine domani all'alba, a guardare che cosa fanno le altre tribù adesso che una ha perso la testa. [slyly] Mentre si allaccia il mantello chiede a Galdrick se ha già salutato chi doveva salutare, in Via dei Rasoi, [amused] e lo sceriffo si sistema la cintura senza rispondere. Julia intanto scrive una cifra sul registro, la ricompensa del Consiglio, e la sottolinea.
  rapporto-in-municipio-congedo__1-esito: |
    [coins clinking] Firmi la ricevuta sotto la cifra, e Julia ti conta le monete da una cassetta di ferro che tiene nel cassetto, a pile ordinate. [warmly] “La chiarezza fa risparmiare tempo a tutti” dice, e ti guarda per la prima volta senza una pratica davanti. Galdrick ti stringe la mano. Ilvaena ti batte due dita sulla spalla ed esce per prima, con l'arco a tracolla e il mantello ancora da allacciare.

    [satisfied] Scendi la scalinata con la borsa più pesante, e in fondo all'atrio la targa della banca provvisoria luccica come la prima volta.
  rapporto-in-municipio-congedo__2-successo: |
    [slyly] Le fai notare che le carte di un mago, in Biblioteca, varrebbero da sole più della cifra sul registro, e che il Consiglio le riceve gratis. Julia ci pensa il tempo di intingere la penna. Poi corregge la cifra al rialzo e ci scrive accanto una nota piccola, a margine. [deadpan] “Hai ragione, e mi secca” dice. “I conti si fanno giusti anche quando li fa qualcun altro.”

    [satisfied] Galdrick, alla finestra, si passa una mano sulla testa rasata. Ilvaena ti strizza l'occhio dal davanzale ed esce per prima.
  rapporto-in-municipio-congedo__2-fallimento: |
    [calm] Julia ti lascia finire, poi posa la penna. Ti spiega che le cifre del Consiglio si decidono in Consiglio, e che ne ha appena tolto un pezzo per il tempo che le hai fatto perdere. [bitter] Lo dice senza cattiveria, con il tono che userebbe per la data di una seduta, e ti conta una somma ridotta sul piano della scrivania.

    [wry] Ilvaena tossisce per non ridere, e Galdrick guarda fuori dalla finestra finché non hai firmato la ricevuta.
  rapporto-in-municipio-congedo__3-successo: |
    [curious] In fondo a ogni foglio, ripetuto come una firma, riconosci un sigillo che hai già visto inciso sui portali dell'Accademia di Torvessa. Il mago della torre aveva studiato lì. Julia annota il nome sul registro e decide che le pergamene andranno prima a Orvald Temmerin all'Accademia e solo dopo in Biblioteca.

    [satisfied] Ti conta la ricompensa e ci aggiunge qualche moneta di tasca sua, e ci tiene a dirti che sono sue. Galdrick ti stringe la mano, e Ilvaena esce per prima con l'arco a tracolla.
  rapporto-in-municipio-congedo__3-fallimento: |
    [uneasy] Dopo un po' che guardi le formule ti sembra che le righe si spostino di mezzo dito ogni volta che sbatti le palpebre. Julia ti toglie il foglio di mano e lo rimette in cima alla pila, poi ti conta la ricompensa del Consiglio e ti consiglia con garbo di andare a dormire.

    [tired] Il mal di testa ti accompagna giù per la scalinata e per tutta Via del Velo, [distant bell tolling] e ogni campana delle ore sacre ti batte dietro gli occhi.
  rapporto-in-municipio-congedo__4-esito: |
    [awed] Il sigillo in fondo ai fogli è il cerchio incompleto dell'Accademia di Torvessa, lo stesso della tenda grigia al Festival, e sotto c'è il segno di un corso di formule che Temmerin tiene ancora, al secondo anno. [whispers] [uneasy] Il mago della torre si sedeva nei banchi dove mi siedo io. Lo dici a Julia, e lei annota il nome dell'Accademia sul registro. Le pergamene andranno prima a Orvald Temmerin e solo dopo in Biblioteca.

    [satisfied] Ti conta la ricompensa e ci aggiunge qualche moneta di tasca sua, e ci tiene a dirti che sono sue. Galdrick ti stringe la mano, e Ilvaena esce per prima con l'arco a tracolla.
