# Regia del doppiaggio: Il registro del custode
regia:
  il-ponte-dei-morti-di-notte: |
    [eerie] Dopo la seconda campana sui Ponti Sospesi restano accese soltanto le lanterne di Mana. Fra una lanterna e la successiva la nebbia sale dalla Cicatrice e si posa sulle assi all'altezza delle ginocchia. Arrivi al Ponte dei Morti con la giubba umida sulle spalle. Il parapetto di metallo annerito è freddo e bagnato, e sopra il vuoto dondolano a centinaia le lanterne dei Raschiatori, ognuna con il suo piccolo cristallo acceso per un compagno rimasto nel Labirinto. [somber] Su una qualcuno ha inciso con la punta di un coltello paga il debito, e sotto, più piccolo, quando torni.

    [quietly] Di notte il ponte ha un'altra vita. Passano carri con le ruote fasciate di stracci, tirati da muli con gli zoccoli avvolti nella tela perché sulle lastre non facciano rumore. All'imbocco un facchino con la gerla vuota aspetta che qualcuno lo paghi per portare qualcosa. Su una cassa rovesciata siedono due Raschiatori della veglia, vecchi, con i capelli bianchi bagnati dalla nebbia, e si passano una borraccia senza parlare.

    In fondo al ponte c'è un gabbiotto dei Custodi di Passaggio con la finestra socchiusa e una lampada accesa dentro. Fuori, appesa a un chiodo, c'è la tavoletta dei turni. Ti infili le mani sotto le ascelle per scaldarle. [whispers] [uneasy] Il tizio dei ponti, quello di notte, sta da qualche parte in questa nebbia. [softly] Un carro ti passa accanto così piano che senti soltanto il respiro del mulo.
  il-ponte-dei-morti-di-notte__1-successo: |
    [quietly] Ti accucci dietro una trave, fra due lanterne spente da anni, e aspetti. Fino all'alba passano sette carri. Nessuno si ferma a pagare al gabbiotto. [tense] Da ognuno scende il carrettiere e mette qualcosa in mano a un uomo pallido avvolto in un mantello cerato, che lo annota in un libretto di pelle e mai nel registro della Gilda incatenato al banco. Sei uomini con le balestre a tracolla tengono i due capi del ponte.

    Due carri portano sacchi di grano con lo stemma dei Malgrani, l'albero trafitto da una lama, dipinto sulla tela. [satisfied] Quando la nebbia si ritira leggi la tavoletta appesa al chiodo, dove in gesso, sotto la parola notte, c'è scritto [short pause] Maedric Holl.
  il-ponte-dei-morti-di-notte__1-fallimento: |
    Ti accucci dietro una trave e conti i carri. [tense] Al quinto un balestriere dell'imbocco alza la testa e guarda dritto verso la tua trave, e dietro di lui un uomo pallido avvolto in un mantello cerato smette di scrivere nel suo libretto e guarda dalla stessa parte. [whispers] Restano così finché la nebbia sale di nuovo a coprirli.

    [breathing heavily] Te ne vai lungo il parapetto con il cuore che ti batte nei denti. Passando davanti al gabbiotto leggi la tavoletta dei turni, dove in gesso, sotto la parola notte, c'è scritto Maedric Holl. [bitter] Adesso Maedric Holl conosce la tua sagoma.
  il-ponte-dei-morti-di-notte__2-successo: |
    [calm] Ti siedi sulla cassa accanto a loro, e dopo un po' la donna ti passa la borraccia. Dentro c'è liquore di radice allungato con l'acqua. [somber] Le chiedi per chi vegliano, e lei ti dice tre nomi, ciascuno con il suo anno.

    Quando le chiedi dei carri indica il gabbiotto con il mento. [hoarse] “Il custode di notte è Maedric Holl” dice. “Alle nostre lanterne non mette mai le mani, e per questo lo lasciamo stare. Quello che passa qui sopra la Gilda non lo vede.” L'uomo aggiunge che i carri con il grano dei Malgrani passano da anni, sempre dopo la seconda campana. [tense] Quando Maedric esce dal gabbiotto, pallido nel suo mantello cerato, la donna smette di parlare e si riprende la borraccia.
  il-ponte-dei-morti-di-notte__2-fallimento: |
    I due ti lasciano sedere, ma alla terza domanda l'uomo si alza e ti chiede se sei venuto a vegliare o a contare. [bitter] Gli rispondi male. La donna ti dice soltanto che il custode di notte si chiama Maedric Holl e che alle lanterne non mette le mani, poi ti indica una trave più in là.

    [somber] Resti lì fino all'alba, fra le lanterne di gente che non hai mai conosciuto. Vedi Maedric uscire dal gabbiotto nel suo mantello cerato e i carri passare senza pagare. [wind howling] A ogni raffica le lanterne sbattono contro il metallo, e [eerie] ti sembra di sentire chiamare dei nomi.
  il-ponte-dei-morti-di-notte__3-esito: |
    [wry] Il facchino morde una delle monete, più per abitudine che per sospetto, e se le infila tutte nella fascia che porta in vita. Poi si appoggia alla gerla e ti racconta tre mesi di notti.

    [quietly] Il custode di notte è Maedric Holl, quello pallido con il mantello cerato che sta uscendo adesso dal gabbiotto. Davanti a lui i carri con le ruote fasciate non pagano la gabella della Gilda. Pagano lui, e lui li segna in un libretto suo. Più di una volta il facchino ha scaricato in fondo al ponte sacchi di grano con lo stemma dei Malgrani, e li ha portati giù fino ai magazzini della Città Bassa. [gruff] “Mai visto un timbro della Gilda” dice. “In tre mesi, mai.”
  il-ponte-dei-morti-di-notte__4-esito: |
    [solemn] Ti siedi sulla cassa senza chiedere permesso, come si fa alla veglia, e prima di ogni altra cosa dici il nome di un compagno che dalla piattaforma è sceso una volta di troppo. La donna annuisce e ti passa la borraccia. [warm] Il liquore di radice è allungato con l'acqua, come piace ai vecchi.

    Quando le chiedi dei carri ti indica il gabbiotto con il mento. [hoarse] “Maedric Holl, il custode di notte. Lo lasciamo stare perché alle nostre lanterne non mette le mani.” L'uomo aggiunge che il grano dei Malgrani passa da anni, sempre dopo la seconda campana, e che [softly] a te lo dice perché i calli che hai sui palmi li fa soltanto la corda della Cicatrice.
  maedric-holl: |
    [ominous] Torni la notte dopo, alla stessa campana. Maedric Holl è appoggiato al parapetto di un tratto laterale, accanto a una lanterna che illumina soltanto il suo mantello cerato, lucido di nebbia. Ai due capi del ponte stanno sei uomini della Gilda, con le balestre a tracolla e le lame corte alla cintura. [quietly] Uno porta il mantello dei Custodi rovesciato, per non farsi riconoscere, e sulla fodera si vede una toppa cucita a punti piccoli e regolari, da qualcuno che gli vuole bene.

    Maedric si volta solo dopo un po'. Ha il viso pallido e gli occhi acquosi. Le labbra sottili non sorridono mai del tutto, e la voce non va più in là di due passi.

    [softly] [menacing] “I ponti di notte non sono i ponti di giorno” dice. “Chi non lo sa paga il prezzo del giorno, e si sorprende.” Ti guarda la faccia con calma, come si guarda una merce sul banco. [slyly] “Ti ho già visto, la sera del Festival. Eri fra quelli che tenevano testa agli orchi. Tu che prezzo paghi?”

    [wood creaking] Sotto i tuoi piedi un'asse si muove, e lo stomaco ti scende di un gradino verso la Cicatrice. [whispers] [uneasy] Su un ponte così stretto sei balestre bastano e avanzano. [tense] Il balestriere con la toppa sposta il peso da un piede all'altro, e la sua balestra gli scivola di un palmo lungo la spalla.
  maedric-holl__1-successo: |
    Gli parli di tre casse di cristalli non registrati e di una notte senza luna. Lui ti ascolta con la testa inclinata. [softly] “Tutto passa, se il peso è giusto” dice. “Dimmi cosa e quando. Il resto è discrezione.”

    Ti porta nel gabbiotto per fissare la tariffa e tira fuori da sotto il mantello un registro rilegato in pelle e scritto a numeri e piccoli disegni. [tense] Poi un carro si ferma storto all'imbocco, e lui esce a sistemare la faccenda lasciando il registro sul banco per il tempo di tre frasi a voce bassa. [quickly] Te lo infili sotto la giubba alla seconda.

    [satisfied] La notte dopo il gabbiotto è chiuso, e sulla tavoletta dei turni il nome di Maedric è stato cancellato con una manica.
  maedric-holl__1-fallimento: |
    Gli parli di tre casse di cristalli e di una notte senza luna. [calm] Maedric ascolta e ti chiede da quale imbocco arriveranno le casse, e dopo un po' chi te le ha vendute. Lo chiede senza fretta, una domanda alla volta. Alla terza rispondi [nervously] “un amico”, e ti accorgi tardi che l'avevi già detto.

    [softly] [mocking] “Un amico” ripete lui, e il mezzo sorriso resta dov'è. [ominous] Gli occhi acquosi si spostano sul balestriere più vicino mentre ti propone di lasciare stare le casse e di parlare di quello che sai davvero.
  maedric-holl__2-esito: |
    [quietly] Glielo dici a voce bassa, come parla lui. Gli racconti dei custodi che si comprano con una mancia e dei carri dei Malgrani che passano senza timbro, e gli dici che hai visto dove li annota. [tense] Il mezzo sorriso resta fermo dov'è.

    Gli occhi invece si spostano sul balestriere più vicino, che a un cenno della mano si allontana di tre passi e resta a guardare la nebbia. Maedric si stringe nel mantello cerato fino a farlo scricchiolare, poi [short pause] per la prima volta ti guarda dritto in faccia.
  maedric-holl__3-vittoria: |
    [urgent] La nebbia si infittisce di colpo, e i balestrieri tagliano le corde delle lanterne più vicine per toglierti la luce. Le assi sono viscide e tu ti tieni lontano dal parapetto. [groans] Metti a terra il balestriere con la toppa sulla fodera, poi ti giri verso le sagome all'imbocco.

    [footsteps receding] Quando vedono il compagno a terra gli altri arretrano nella nebbia, e i loro passi si allontanano sulle lastre. [exhales] Maedric resta solo, con la schiena contro il parapetto e le mani alzate all'altezza del petto. Per la prima volta da quando lo conosci respira forte.
  maedric-holl__3-sconfitta: |
    [tense] I balestrieri tagliano le corde delle lanterne una dopo l'altra, e il buio ti arriva addosso insieme alla nebbia. [bowstring snaps] Un dardo ti apre la manica. [gasps] Un colpo alle gambe ti manda sulle assi viscide, con le dita aggrappate al bordo e la luce della Cicatrice a un palmo dalla faccia.

    [breathing heavily] Quando riesci a rialzarti il ponte è vuoto. [rope creaking] Da sotto le assi arriva il cigolio di una corda tesa, poi più niente. Accanto al parapetto trovi la borsa di cuoio che Maedric ha perso scendendo. Dentro c'è un registro rilegato in pelle e scritto a numeri e piccoli disegni. [resigned] Entro sera alla Pignatta sapranno che ce l'hai tu.
  maedric-holl__4-successo: |
    Gli mostri il sigillo della tua licenza e gli chiedi quanto costa far passare di notte un carico che la Casa dei Nodi non deve vedere. Maedric ti ascolta con la testa inclinata, e il mezzo sorriso, per una volta, sembra sincero. [amused] “Uno della Gilda che paga me invece della Gilda” dice. “Mi piace.”

    Ti porta nel gabbiotto per fissare la tariffa e tira fuori da sotto il mantello il registro di pelle. [tense] Quando un carro si ferma storto all'imbocco ed esce a sistemarlo, il registro resta sul banco, e [wry] tu lo fai sparire sotto la giubba con il gesto con cui al banco fai sparire una moneta tosata. [satisfied] La notte dopo, sulla tavoletta dei turni, il suo nome è cancellato con una manica.
  maedric-holl__4-fallimento: |
    Gli mostri il sigillo della licenza, e Maedric lo guarda più a lungo di te. [softly] [slyly] “Uno della Gilda che viene a comprare il silenzio da me” dice piano. [coldly] “Oppure viene a vedere chi lo vende.” Gli occhi acquosi passano sul balestriere più vicino, e il sigillo ti diventa pesante in mano. Ti propone di lasciar perdere le casse e di parlare di quello che sai davvero.
  maedric-holl-il-prezzo: |
    [softly] “Qualcuno ti ha parlato di me” dice Maedric. “Uno che ha paura, o uno che ha smesso di averne. Prima o poi in questa città parlano tutti.” Si sistema il mantello sulle spalle, e la cera scricchiola. [ominous] All'imbocco uno dei balestrieri si toglie la balestra dalla spalla e se la tiene in grembo, come si tiene un gatto.

    [calm] “Senti. Io lavoro a tariffa, con tutti. Dimmi che cosa vuoi che dimentichi, e ti dico quanto costa dimenticarlo. Posso pagarti in monete, oppure con un nome che ti serve più del mio.” Lo dice piano, con le mani tranquille sul parapetto, e ti accorgi di esserti avvicinato per sentirlo.

    [whispers] [uneasy] Mi sta facendo abbassare la voce anche adesso. Il sudore sulla nuca ti si è fatto freddo. [wind howling] Il ponte ondeggia appena a ogni raffica, e le lanterne dei Raschiatori battono piano contro il metallo del parapetto.

    [menacing] “Se invece vuoi portarmi da Cordani, dimmi con che cosa” aggiunge. “Con una voce raccolta chissà dove e la tua faccia? Siamo su un ponte di notte, e la nebbia non testimonia. Pensaci un momento, prima di rendere questa cosa definitiva.” [tense] Gli uomini agli imbocchi si irrigidiscono senza che lui alzi un dito.
  maedric-holl-il-prezzo__1-esito: |
    [resigned] Maedric ti conta in mano le monete, fredde di nebbia, una alla volta. Poi ti dà il nome. Ilario Benn, riscossore del turno di giorno alle Mille Corde, arrotonda i pedaggi dei carri di sale e si tiene la differenza. [softly] “È un nome vero” dice. “Lo puoi portare a chi vuoi, e nessuno ti chiederà dove l'hai preso.”

    Torna verso il gabbiotto, e dalla finestra lo vedi chinarsi dietro il banco. [bitter] Quando si rialza il libretto di pelle non ce l'ha più in mano, e alla cassetta di ferro sul pavimento è appeso un lucchetto nuovo. Gli uomini riprendono i loro posti fino all'alba.
  maedric-holl-il-prezzo__2-successo: |
    [calm] Gli dici che lo sceriffo sa dove sei stanotte, e che domattina lo saprà anche il Sovrintendente Cordani. Lo dici con calma, guardando la lanterna invece di lui. [tense] Maedric fa i conti a voce alta, quasi gentile. Un forestiero caduto dal ponte si spiega facilmente, dice lui, mentre uno di quelli che la sera del Festival hanno tenuto testa agli orchi si spiega molto meno.

    Poi fa un passo indietro nella nebbia e sparisce. [rope creaking] Senti una corda tendersi sotto le assi, e i suoi uomini se ne vanno senza correre. [relieved] La porta del gabbiotto è rimasta aperta, e appesa al chiodo dietro il banco c'è la sua borsa di cuoio con dentro il registro di pelle. Te la metti a tracolla e torni verso l'imbocco camminando al centro delle assi.
  maedric-holl-il-prezzo__2-fallimento: |
    Gli parli di Cordani e dello sceriffo, ma a metà frase la voce ti sale di un tono, e Maedric lo sente. [tense] Fa un cenno piccolo con due dita. [bowstring snaps] Il primo dardo si pianta nel parapetto accanto alla tua mano, il secondo ti entra nel fianco mentre ti butti sulle assi, e [pained] te lo strappi da solo con le dita che non vogliono chiudersi.

    [breathing heavily] Quando rialzi la testa Maedric è sparito, e i suoi uomini con lui. Nel gabbiotto hanno rovesciato tutto in fretta. [wry] La borsa di cuoio è caduta dietro la stufa, con dentro il registro di pelle, e nella fretta nessuno l'ha trovata. [tired] Fino all'imbocco cammini con una mano premuta sul fianco.
  maedric-holl-il-prezzo__3-vittoria: |
    [urgent] Gli sei addosso prima che finisca di alzare la mano. I balestrieri tagliano le corde delle lanterne per accecarti, e la nebbia si chiude sul ponte. Scivoli sulle assi e ti rialzi. Uno degli uomini ti arriva alle spalle, e lo mandi contro il parapetto, [man screaming] dove resta aggrappato a gridare.

    Gli altri sentono il grido e si ritirano verso gli imbocchi. [exhales] Quando la nebbia si apre Maedric è rimasto solo, con le spalle al metallo e le mani aperte davanti al petto, e respira dalla bocca.
  maedric-holl-il-prezzo__3-sconfitta: |
    [tense] Gli sei addosso, ma Maedric arretra di un passo e i dardi arrivano dalla nebbia prima di lui. I balestrieri tagliano le lanterne e il buio ti prende alle spalle. [gasps] Finisci sulle assi viscide con una gamba oltre il bordo, e la luce della Cicatrice ti illumina la suola.

    [breathing heavily] Ti tiri su con le braccia. [rope creaking] Sotto il ponte cigola una corda tesa, poi smette. Quando la nebbia si dirada restano le lanterne spente e, vicino al parapetto, una borsa di cuoio rovesciata con dentro un registro di pelle. [resigned] Maedric l'ha persa scendendo, e stanotte stessa qualcuno andrà a dire agli Scuri chi l'ha raccolta.
  maedric-holl-il-gabbiotto: |
    [calm] All'alba la nebbia ricade nella Cicatrice e il Ponte dei Morti torna un ponte qualsiasi, con le lanterne pallide nella luce grigia e i primi carretti del mercato che passano facendo rumore. Maedric chiude il gabbiotto con due giri di chiave e se ne va verso i Quartieri Alti con il mantello cerato sul braccio. I suoi uomini si sparpagliano fra la gente.

    Il gabbiotto è una scatola di assi e lamiera agganciata al fianco del ponte, con la porta sul tavolato e una finestrella che dà sul vuoto. Il custode del turno di giorno arriva tardi tutte le mattine, e prima di lui passa un facchino con un sacco di carbone per la stufa. [wry] Il facchino porta la chiave appesa al collo con un laccio da scarpe, e ha l'aria di uno che l'avrebbe data a chiunque, se solo qualcuno gliel'avesse chiesta.

    Ti siedi sul parapetto. Nella tasca della giubba hai le monete di Maedric, e sono ancora fredde. [whispers] [determined] Il registro sta in quella cassetta, a dieci passi da me. [wooden cart wheels creaking] Dalla finestrella sul vuoto esce l'ultimo filo di fumo della stufa, e le corde del ponte cigolano sotto i primi carri.
  maedric-holl-il-gabbiotto__1-successo: |
    [tense] Quando il ponte resta vuoto scavalchi il parapetto. Allunghi una gamba fino al davanzale, e per un momento sotto di te c'è soltanto la luce della Cicatrice. [exhales] Poi sei dentro, accucciato fra la stufa e il banco. [metal clanging] Il lucchetto della cassetta cede alla seconda spinta, perché è nuovo ma l'anello a cui è appeso è vecchio.

    [satisfied] Esci dalla stessa parte con il registro sotto la giubba. Due notti dopo nel gabbiotto c'è un custode nuovo, giovane, che non sa niente, e Maedric Holl sui ponti non si è più visto.
  maedric-holl-il-gabbiotto__1-fallimento: |
    [tense] Scavalchi il parapetto e allunghi una gamba fino al davanzale, ma la lamiera è bagnata e il piede scivola. [gasps] Resti appeso per le mani per il tempo di un respiro lunghissimo, con le ginocchia che sbattono contro le assi. Alla fine entri, e la cassetta cede alla seconda spinta.

    Quando esci il custode del turno di giorno è fermo sul tavolato con il suo pane in mano, e ti guarda risalire sul parapetto. [man shouting] Si mette a gridare, e un paio di carrettieri si voltano. [bitter] Entro sera Maedric sa chi gli ha aperto la cassetta, e da quella notte sui ponti non lo vede più nessuno.
  maedric-holl-il-gabbiotto__2-esito: |
    [wry] Il facchino guarda le monete a lungo, come se dovesse portarle su per una scala. Apre il gabbiotto e scarica il carbone accanto alla stufa. [whistling] Poi si mette a fischiare verso il vuoto, mentre tu ti inginocchi davanti alla cassetta. Il lucchetto è nuovo, ma la chiave piccola sta appesa allo stesso laccio della grande.

    [satisfied] Il facchino richiude la porta dietro di te. Due notti dopo nel gabbiotto c'è un custode nuovo, e di Maedric Holl sui ponti si dice soltanto che è sparito.
  maedric-in-ginocchio: |
    [somber] Le lanterne tagliate penzolano dalle corde e fanno una luce bassa, di traverso, che illumina le assi e lascia al buio le facce. Maedric ha la schiena contro il parapetto. Si è inginocchiato da solo, senza che tu glielo chiedessi, e tiene le mani aperte davanti al petto.

    [softly] “Il registro è qui, sotto il mantello” dice. La voce è bassa come prima, ma adesso gli trema sull'ultima sillaba. [trembling] “È tuo. Io vorrei restare mio, se si può. Un uomo dei ponti ha sempre un modo per scendere, e il mio è legato al parapetto, a un passo dalla mia mano sinistra.” Te lo dice perché tu lo veda. Una corda annodata a intervalli regolari pende oltre il bordo, dentro la nebbia.

    [tired] Solo adesso ti accorgi che ti fanno male le nocche. Dagli imbocchi non arriva più nessun passo. [whispers] [bitter] Se lo lascio scendere, prima dell'alba gli Scuri sapranno il mio nome. Maedric tira fuori il registro con due dita e lo posa sulle assi fra voi. La copertina di pelle è gonfia d'umidità. [tense] Poi aspetta con gli occhi fissi sulle tue mani, mentre il mantello cerato gli gocciola sulle ginocchia.
  maedric-in-ginocchio__1-esito: |
    [calm] Gli leghi i polsi con la corda che doveva servirgli per sparire, e il registro te lo metti sotto la giubba. Lui non oppone resistenza. Per tutta la salita verso i Quartieri Alti cammina un passo davanti a te senza dire niente, e soltanto alla porta della Caserma ti chiede di dire allo sceriffo che si è arreso da solo.

    [wry] Le due guardie in giaco di maglia lo prendono in consegna. Il sergente di turno scrive il suo nome sul registro delle celle, in fondo alla pagina, sotto quello di un ubriaco di Via del Salmone.
  maedric-in-ginocchio__2-esito: |
    [quietly] Raccogli il registro e fai un passo indietro. Maedric ti guarda un momento, come per esserne sicuro, poi scavalca il parapetto e scende lungo la corda, un nodo alla volta, finché la nebbia gli copre la testa. [rope creaking] La corda resta tesa ancora un po' e poi si allenta.

    [resigned] Sui ponti non lo vedrai più. Prima dell'alba, però, alla Pignatta Grassa sapranno che il registro del custode notturno adesso ce l'hai tu, e [short pause] chi te l'ha lasciato prendere.
  maedric-in-ginocchio__3-esito: |
    [tense] La mano sinistra di Maedric si muove verso il parapetto, e tu colpisci prima di capire se cercava la corda. Lui cade di lato sulle assi e non si rialza. [somber] Il mantello cerato si apre, e sotto c'è soltanto una camicia rammendata.

    [breathing heavily] Il registro è dove l'aveva posato. Lo raccogli con le mani che tremano e resti accanto al corpo finché la nebbia comincia a calare. [bitter] Domattina sul Ponte dei Morti troveranno un custode della Gilda con la testa spaccata, e qualcuno dirà di aver visto la tua sagoma nella nebbia. [long pause] Prima di andartene raddrizzi una lanterna che nella lotta si è storta sul gancio.
