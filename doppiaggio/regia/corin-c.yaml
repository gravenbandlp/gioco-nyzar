# Regia del doppiaggio: La caccia di Corin
regia:
  il-banchetto-del-cinghiale: |
    La carcassa è arrivata al Grifone su un carro della Città Bassa, [wry] e per scaricarla ci sono voluti quattro Raschiatori e una corda del ponte. Brunella l'ha guardata a lungo con le mani sui fianchi. Poi ha tagliato via le parti dove il sangue era grigio e le ha bruciate nel cortile sul retro. Il resto l'ha messo a marinare nel vino rosso con le erbe, e Liaren si è legata i capelli per darle una mano.

    [crowd murmuring] Stasera la sala è piena fino alle scale. La carne è scura e un po' dolce, con un retrogusto di ferro che un Raschiatore fa notare ad alta voce, [amused] prendendosi un calcio sotto il tavolo. Corin siede a capotavola con il fazzoletto infilato nel colletto, e a metà cena ti fa scivolare accanto al piatto un borsello e le redini del baio, legate con un nastro. [warmly] “Il cavallo è tuo” dice. “Stroud me l'ha venduto, e io non ho voluto sapere quanto.”

    Al terzo bicchiere parla della Gilda. [thoughtful] “È corrotta, certo. Però senza la Gilda Qir-Azel si ferma. Spariscono i ponti, e il pane subito dopo. Finché ci sono Cordani e Irsa Valbrun a crederci, un po' di decenza resta.” Abbassa la voce. [quietly] “Ottone Malgrani invece è un fabbricante di catene con i baffi pettinati. Mi odia, e io gli rendo il favore.” Ride per primo e alza il bicchiere verso i Raschiatori, [wry] che alzano i loro senza sapere perché.

    [ominous] Sul bancone, avvolti nella tela cerata e nel sale, aspettano gli organi della bestia. Dove la tela si è aperta si vede luccicare una vena d'argento, e Brunella li ha messi da parte perché decida tu.
  il-banchetto-del-cinghiale__1-esito: |
    Prendi l'involto dal bancone, ed è più pesante di quanto pensavi, [uneasy] freddo anche attraverso il sale. Brunella ci gira intorno un altro giro di spago [wry] e ti dice di tenerlo lontano dalla sua cucina. Corin approva con la bocca piena. [eagerly] “Ulric Stanne, in Biblioteca” dice appena riesce a parlare. “Ha un amico all'Accademia che apre le cose per vedere come sono fatte dentro.”

    [quietly] Per tutta la cena tieni l'involto sotto la sedia, con il piede appoggiato sopra.
  il-banchetto-del-cinghiale__2-esito: |
    Il mercante di pelli viene da Pannion e ha le unghie nere di concia. Solleva un angolo della tela, guarda dentro più a lungo del necessario e ti offre un buon prezzo senza contrattare, [wry] cosa che a Qir-Azel succede di rado. Corin gli chiede che cosa ci farà, [slyly] e lui risponde che a Pannion le cose strane si vendono sempre. Si mette l'involto sotto il braccio e se ne va prima del dolce.
  il-banchetto-del-cinghiale__3-esito: |
    [quietly] Fai un cenno a Brunella, e lei porta l'involto nel cortile sul retro senza dire niente. Dalla finestra la vedi rovesciarlo sulle braci del pomeriggio e rimestare con il forcone finché la tela smette di sfrigolare. [uneasy] Il fumo che sale è chiaro e puzza di ferro bagnato. Quando rientra si lava le mani due volte. [pause] Poi, sul registro della locanda, accanto al tuo nome segna una notte, senza spiegarti perché.
