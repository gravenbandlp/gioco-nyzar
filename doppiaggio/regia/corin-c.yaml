  il-banchetto-del-cinghiale-dopo-i-malgrani__3-esito: |
    [quietly] Fai un cenno a Brunella, e lei porta l'involto nel cortile sul retro senza dire niente. Dalla finestra la vedi rovesciarlo sulle braci del pomeriggio e rimestare con il forcone finché la tela smette di sfrigolare. [uneasy] Il fumo che sale è chiaro e puzza di ferro bagnato. Quando rientra si lava le mani due volte. [pause] Poi, sul registro della locanda, accanto al tuo nome segna una notte, senza spiegarti perché.
  gli-organi-del-cinghiale: |
    Due giorni fa hai lasciato l'involto a Ulric Stanne, e Ulric l'ha mandato all'Accademia con un ragazzo e un biglietto. Quando torni in Biblioteca gli organi sono di nuovo qui, sul tavolo lungo sotto il lampadario, aperti su un telo di lino e fissati con gli spilli. Accanto ci sono una fila di coltelli sottili e tre barattoli di liquido torbido, e c'è Orvald Temmerin, il preside dell'Accademia, che Ulric ti presenta con un cenno del mento.

    È alto e magro, con la barba grigia tagliata corta e una tunica grigia senza gioielli. [wry] Sulla spalla porta un corvo che guarda gli organi con più appetito di quanto sia educato. [deadpan] “Pett” dice Orvald, senza presentarsi lui. “È venuto per curiosità. Io sono venuto perché me l'ha chiesto Ulric, e perché in trent'anni di scavi una cosa così non l'avevo ancora vista.”

    Con la punta di un coltello ti indica il cuore, grande come una pagnotta e diviso in camere che non comunicano fra loro. [thoughtful] “Ho fatto le sezioni e i bagni, e l'ho confrontato con tutte le tavole anatomiche che Ulric mi ha fatto trovare” dice. “Questa roba non ha architettura vitale. Sembra un esperimento venuto male.” Pulisce la lama su uno straccio. [grim] “Eppure la bestia funzionava, e correva più forte di un cavallo. È questo che non mi piace.”

    Ulric si è tolto il monocolo e lo pulisce sul panciotto rosso. [distant bell tolling] Dalla finestra arrivano le campane della Cattedrale. [whispers] [uneasy] Un cerusico direbbe che era morta prima di nascere. [raven croaking] Pett gracchia piano una volta, e Orvald gli dà un colpetto sul becco con il dorso dell'unghia.
  gli-organi-del-cinghiale__1-esito: |
    Orvald ti fa avvicinare e ti mostra i polmoni, che non hanno un'entrata per l'aria, poi il fegato attraversato da un filo d'argento che lui ha seguito per un giorno intero senza trovarne la fine. [eerie] Il sangue nel barattolo è grigio e granuloso come cenere bagnata. [deadpan] “Le bestie malate le conosco, ne tengo una ventina sotto spirito nel seminterrato” dice. “Questa sembra un esperimento venuto male. [grim] Il guaio è che è venuto bene lo stesso, visto che correva.”

    Poi ti chiede se può tenere quello che resta per la sua collezione all'Accademia, e tu gli dici di sì.
  gli-organi-del-cinghiale__2-esito: |
    Ulric rimette il monocolo e ti porta davanti a uno scaffale di bestiari, [wry] tutti consumati nello stesso punto del dorso. Ha trovato cervi con le corna di cristallo, e un lupo di Tuarmir con il pelo che tagliava le mani. [thoughtful] “Sono bestie che la Marea Grigia ha toccato, e le ha toccate facendole ammalare” dice. “Zoppicano e muoiono in un inverno. Il tuo cinghiale invece stava benissimo, e secondo Orvald non avrebbe dovuto reggersi in piedi.” Chiude il libro con tutte e due le mani. [uneasy] “Quando una cosa contraddice tutti i miei libri, di solito sbaglia la cosa. [short pause] Questa volta non ci scommetterei.”

    Orvald intanto chiede di tenere gli organi per il seminterrato dell'Accademia, [amused] e Ulric glieli incarta come un pezzo di formaggio.
  gli-organi-del-cinghiale__3-successo: |
    [curious] Segui una delle vene d'argento con la punta del coltello, piano, finché ti accorgi che gira ad anello e torna su sé stessa senza portare da nessuna parte. Quando glielo dici, Orvald ti guarda per la prima volta con attenzione, e Pett salta dalla sua spalla al tavolo. [impressed] “Io ci ho messo un giorno a vederlo” dice Orvald, e ti riprende il coltello dalle dita. “All'Accademia serve gente che guarda, [deadpan] se un giorno ti stanchi di farti caricare dai cinghiali.” Poi ti chiede se può tenere gli organi per il seminterrato, e tu glieli lasci.
  gli-organi-del-cinghiale__3-fallimento: |
    Ti chini sul telo con il coltello, e l'odore ti arriva tutto insieme, ferro bagnato con sotto un fondo dolciastro. [swallows] Lo stomaco si chiude e devi appoggiarti al tavolo. Orvald ti toglie il coltello di mano senza commenti e ti spiega lui quello che avresti dovuto vedere, una vena d'argento che gira ad anello e non porta da nessuna parte. [warm] Ulric ti versa un dito di vino buono e ti dice di berlo seduto. Gli organi, alla fine, se li porta via Orvald.
  gli-organi-del-cinghiale__4-esito: |
    Orvald ti porge il coltello come se fossi lì da un'ora, [warm] e Pett scende dalla sua spalla per tirarti una manica, come fa con gli allievi che conosce. [calm] Lo prendi come lui vi fa prendere i cristalli in laboratorio, tenendolo fra due dita e lasciando morbido il polso, e segui una vena d'argento finché non gira ad anello e torna su sé stessa senza portare da nessuna parte.

    Lo dici ad alta voce. Orvald annuisce una volta. [deadpan] “Al primo anno ci avrebbe messo una settimana” dice a Ulric, [wry] e Ulric non capisce se è un complimento. Poi il preside ti chiede di aiutarlo a incartare gli organi per il seminterrato dell'Accademia, e mentre stringi lo spago ti ricorda che domani c'è lezione.
  ampolle-e-rimedi: |
    [wry] La bottega di Ezio Tarlo sta fra un ciabattino e un muro cieco, e la riconosci dall'odore prima che dall'insegna. Sulla vetrina qualcuno ha scritto a mano Le pozioni si pagano prima di guardarle, e sotto, con un altro inchiostro, [deadpan] e anche dopo. Dentro le mensole sono piene di bottiglie con l'etichetta scritta di fretta, e su alcune al posto del nome c'è soltanto un punto di domanda.

    Ezio è un mezzelfo con i capelli color rame e una cicatrice che gli scende dal naso fino al mento. Porta un grembiule coperto di macchie, e le sue dita si muovono anche quando lui sta fermo. Mentre ti parla tappano e stappano una boccetta vuota. [slyly] “Si fida della mia faccia o della mia bottiglia?” chiede prima ancora del buongiorno. “Ne scelga una, e poi paghi.”

    Gli dici che vieni dalla caccia di Corin Ashdale, e Ezio si illumina. Da anni i cacciatori della Città Bassa gli portano le ghiandole che il macellaio butta via, e da qualche stagione anche le bestie mutate, che lui paga meglio. [sneering] “Quelli dell'Accademia agitano le dita e chiamano tutto magia” dice, e si tocca la cicatrice come per controllare che ci sia ancora. [proudly] “Io apro e annuso. Carne è carne, e fra noi ci si capisce.”
  ampolle-e-rimedi__1-esito: |
    Ezio apre la tela sul banco e annusa, poi fa una smorfia contenta. Taglia una fetta di cuore con un coltello da pane e la guarda controluce, poi tira con due dita una vena d'argento che viene via intera come uno spago. [amused] “Questa bestia è montata a casaccio, come un carro rifatto con i pezzi di tre carri diversi” dice. “Il cuore pompa dove gli pare e i polmoni l'aria non la portano. Doveva cascare morta il primo giorno, e invece correva. [mocking] Gli stregoni ci scriverebbero un libro, io ci faccio un unguento.” Conta le monete sul banco, [wry] poi ne riprende una perché dice che era sua.
  ampolle-e-rimedi__2-successo: |
    Gli dici che in Biblioteca c'è chi pagherebbe il doppio solo per guardarli, e che all'Accademia lo sanno. [amused] Ezio diventa rosso fino alla cicatrice. [sneering] “Quelli dell'Accademia” dice, e sputa nel secchio della cenere. Poi conta le monete, una alla volta, guardandoti in faccia dopo ognuna. Mentre incarta gli organi ti spiega che dentro sono montati a casaccio, con il cuore che pompa dove gli pare. [muttering] “Doveva cascare morta il primo giorno. Invece correva, [deadpan] e io questa la chiamo maleducazione.”
  ampolle-e-rimedi__2-fallimento: |
    Ezio ti lascia parlare fino in fondo, [slyly] poi si gratta la cicatrice e ti ricorda che a Qir-Azel i cuori di cinghiale li compra soltanto lui. [bitter] Ti offre meno del dovuto e te le conta in mano prima che tu abbia detto di sì. Mentre incarta gli organi borbotta che dentro sono montati a casaccio e che una bestia così doveva cascare morta il primo giorno. [wry] Poi aggiunge che ci farà un unguento per i calli.
  ampolle-e-rimedi__3-esito: |
    Ezio ti porta nel retro, [eerie] dove su una mensola tiene sotto spirito una lepre con due zampe di troppo e un cuore di capriolo grosso come un pugno. [thoughtful] “Da qualche stagione i cacciatori mi portano roba così” dice, [tapping on glass] e batte l'unghia sul barattolo della lepre. “Fuori sembrano bestie, e dentro sono montate a casaccio, come un carro rifatto con i pezzi di tre carri. Il cuore pompa dove gli pare, eppure correvano. [sneering] Quelli dell'Accademia dicono che è la Marea, e intanto una non l'hanno mai aperta. Io dico che ci capisco poco, e almeno lo ammetto.”
  ampolle-e-rimedi__4-esito: |
    Paghi una boccetta verde che secondo l'etichetta rimette in sesto, [wry] e Ezio diventa di colpo più loquace. Ti racconta del cuore di capriolo che tiene nel retro, diviso in camere che non comunicano, e della lepre che correva con due zampe in più. [amused] “Montate a casaccio come un carro rifatto con i pezzi di tre carri, eppure andavano” dice. Mentre ti dà il resto ti consiglia di non bere il tonico a stomaco vuoto, [deadpan] e sul perché resta vago.
  ampolle-e-rimedi__5-esito: |
    Gli dici quanto paga al Mercato dei Nodi un erborista di Laresh per una ghiandola di bestia mutata, e quanto ci ricarica sopra quando la rivende. [short pause] Ezio smette di stappare la boccetta. [grudgingly] “Un mercante dei Ponti” dice, e si tocca la cicatrice. “L'avevo capito dalle scarpe.”

    [satisfied] Conta le monete una alla volta senza discutere, e intanto ti spiega che dentro la bestia è montata a casaccio, come un carro rifatto con i pezzi di tre carri diversi. Il cuore pompa dove gli pare e i polmoni l'aria non la portano. “Doveva cascare morta il primo giorno, e invece correva” dice, incartando gli organi. [slyly] “Questo sul tuo registro non scriverlo.”
  corin-parte-per-laresh: |
    Corin ti trova al Grifone mentre Brunella spegne le lanterne della sala, [wry] e si siede sul bordo della sedia come se avesse fretta, anche se di fretta non ne ha. La carovana per Laresh parte all'alba, dice, con sei carri di sale e due guardie che costano più del carico. Lui viaggerà sul primo carro, seduto su un cuscino ricamato che si è fatto portare da casa.

    Ti porge una lettera sigillata con la cera verde della Gilda. [earnestly] “È una presentazione per la Casa dei Nodi” dice. “Ho scritto che sei una persona di cui ci si può fidare, e che chi fa uno sgarbo a te lo fa a me. [sheepishly] Il secondo pezzo vale quello che vale, e io in Gilda conto ancora qualcosa. Con la firma di un membro eletto i Custodi di Passaggio ti scrivono nel registro della Gilda senza chiederti la commissione.” [tender] Sul retro c'è il tuo nome, sbagliato alla prima lettera e corretto sopra con cura in un inchiostro più scuro.

    [clears throat] Poi si schiarisce la voce e ti promette che tornerà prima dell'inverno o subito dopo, con il vino buono di Laresh e una storia sua da raccontare a Liaren, per una volta. [softly] Ride per primo, e poi aspetta di vedere se ridi anche tu.
  corin-parte-per-laresh__1-esito: |
    All'alba il Ponte delle Mille Corde è bagnato di brina [cart wheels rumbling] e vibra sotto le ruote. Cammini accanto al primo carro fino all'imbocco, [amused] e Corin per tutto il tragitto ti indica le botteghe e ti racconta chi deve soldi a chi, come se partisse per un anno. Al gabbiotto dei Custodi di Passaggio paga la gabella per tutta la carovana e fa vedere la tua lettera all'ispettore dei dazi, che scrive il tuo nome nel registro della Gilda senza alzare gli occhi. Poi Corin si sporge dal carro e ti stringe la mano fra le sue. [wistful] Lo guardi finché la carovana piega verso il Ponte del Conciatore, con il suo fazzoletto bianco che sventola dal cassone.
  corin-parte-per-laresh__2-esito: |
    [quietly] Ti svegli prima dell'alba senza averlo deciso e vai alla finestra in cima alle scale. Sotto, sul Ponte delle Mille Corde, [cart wheels rumbling] passano i carri uno dopo l'altro con le lanterne ancora accese. Corin è sul primo, seduto sul suo cuscino, e cerca con gli occhi le finestre del Grifone finché trova la tua. Si toglie il fazzoletto dal taschino e lo sventola, [amused] e per farlo quasi perde l'equilibrio. [wistful] Lo saluti con la mano finché la carovana sparisce oltre l'imbocco, poi torni a letto con la lettera sul cuscino.
  corin-parte-per-laresh__3-esito: |
    Gli chiedi di lasciarti una cosa che in città non sappiano tutti. Corin si illumina, si guarda intorno nella sala ormai vuota e si china verso di te. Ti racconta che Orazio Belcanto cerca gente per la Promessa dell'Arpia, anche gente che non ha mai recitato, [wry] a patto che sul palco riesca a restare seria. [quietly] Poi aggiunge, più piano, che della rivalità fra Orazio e Liaren nessuno dei due ricorda più l'inizio, e che secondo lui è cominciata con un duetto andato storto. [wistful] All'alba, quando la carovana passa sotto il Grifone, ti saluta con il fazzoletto.
  corin-parte-per-laresh__4-esito: |
    Gli chiedi di lasciarti una cosa che in città non sappiano tutti. Corin si illumina, si guarda intorno nella sala ormai vuota e si china verso di te. Ti racconta che Orazio Belcanto, da quando ti ha preso nella compagnia, parla di te in tutte le taverne dei Quartieri Alti, [wry] e che ogni volta ti descrive un po' più alto. [quietly] Poi aggiunge, più piano, che della rivalità fra Orazio e Liaren nessuno dei due ricorda più l'inizio, e che secondo lui è cominciata con un duetto andato storto. [wistful] All'alba, quando la carovana passa sotto il Grifone, ti saluta con il fazzoletto.
