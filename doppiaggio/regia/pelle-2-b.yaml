# Regia del doppiaggio: Sotto la pelle di Qir-Azel (seconda parte)
regia:
  la-fuga-di-borso: |
    [tense] Borso attraversa il cortile della Caserma con l'anello delle chiavi delle celle infilato al braccio, dove di solito porta il secchio del rancio. Cammina senza correre. Le due guardie del portone lo vedono arrivare e si guardano fra loro, e una delle due solleva la sbarra prima che lui gliel'abbia chiesto. Sugli spalti altre tre guardie restano ferme con le balestre abbassate.

    [somber] Galdrick è sulla scala dell'ufficio con la spada nel fodero e i pollici nella cintura. Guarda Borso attraversare il cortile senza dire una parola, e ha la faccia di un uomo davanti a un cane rabbioso che ha addestrato con le sue mani. Quando fai un passo verso il portone ti posa una mano sul braccio.

    [quietly] “Lascialo andare” dice piano. “Se lo fermiamo qui, stanotte nel cortile ci tiriamo addosso le balestre.” Sulla soglia Borso si gira una volta sola, verso le celle, poi prende la discesa della Città Bassa. [whispers] [uneasy] Va alla Pignatta, e ci va con le chiavi di tutta la Caserma. [heavy wooden bar thudding] La sbarra del portone ricade dietro di lui con un colpo sordo, e la guardia che l'ha alzata si pulisce le mani sulla giubba.
  la-fuga-di-borso__1-esito: |
    Passandoti accanto Borso si è chinato appena, così vicino che hai sentito l'odore di cuoio del grembiule. [hoarse] “All'Arena ti ho visto nel recinto” ha detto con la voce bassa di sempre. [menacing] “Ti ha visto anche Mauro, e Mauro i conti li tiene a memoria.”

    [uneasy] Galdrick ha sentito. Tira fuori il taccuino e ci scrive una riga corta con la sua matita.
  la-fuga-di-borso__2-esito: |
    [somber] Le celle degli Scuri presi nelle ultime settimane sono aperte e vuote. È vuota anche quella in fondo, dove dormiva Maedric Holl. Sulla paglia è rimasto il suo mantello cerato, piegato in quattro. [wry] Nella cella accanto l'ubriaco di Via del Salmone, quello che sul registro stava una riga sopra Maedric, dorme ancora con la porta spalancata.

    Galdrick scrive due righe nel taccuino. [tense] “Fra qualche giorno Vesh saprà tutto quello che sapeva Maedric” dice, “e noi di giorni non ne abbiamo più.” Chiude il taccuino e sale a scrivere a Julia.
  la-fuga-di-borso__3-esito: |
    [somber] Le celle degli Scuri presi nelle ultime settimane sono aperte e vuote. [wry] In quella in fondo un ubriaco di Via del Salmone dorme ancora con la porta spalancata, e nessuno si è preso la briga di svegliarlo.

    Galdrick scrive due righe nel taccuino. [bitter] “Adesso Vesh sa tutto quello che sapeva Borso” dice, “cioè quasi tutto quello che so io.” Chiude il taccuino e sale a scrivere a Julia.
  il-municipio-all-alba: |
    [somber] L'alba porta soltanto nebbia, e dalle finestre alte della sala consiliare i tetti della Città Bassa compaiono a pezzi, uno alla volta, quando la nebbia si apre. La sala è quasi vuota. Julia Castaldi è vestita di scuro, senza nemmeno la spilla del Consiglio. [armor plates clinking] Toren Galdrick porta l'armatura completa con l'elmo in testa, e a ogni passo le piastre tintinnano come le pentole appese in una cucina. Alla porta due miliziani tengono gli occhi bassi.

    Sul tavolo di legno massiccio le prove sono in pile ordinate dal furiere. Ci sono le lettere con l'alloro e le carte del caveau, e accanto le ricevute delle casse degli Scuri, tutte con la tua firma. [wry] Qualcuno ha posato una tazza di caffè su un angolo delle lettere, e l'alone ha macchiato il sigillo dei Malgrani.

    [hoarse] “Ottone Malgrani è finito” dice Julia con la voce roca. “Con queste carte va in tribunale per estorsione e per collusione con i criminali, e qui dentro non c'è niente che un avvocato della Gilda possa spiegare.” Si lascia cadere su una sedia, gli occhi sui documenti. [tired] “Ogni passo che facciamo per la giustizia ci allontana dalla città che volevamo proteggere. [determined] Eppure indietro non si torna.”

    Galdrick incrocia le braccia, e le piastre dei gomiti stridono. [whispers] [tender] Julia ha dormito ancora meno di me. [tired] La notte in bianco ti pesa sulle palpebre, e la nebbia ti è entrata nella giubba.
  il-municipio-all-alba__1-esito: |
    [gruff] Galdrick parla del grano e del legname. Se trascinano Ottone in tribunale gli Scuri si muovono e saltano gli accordi della Gilda, e le prime settimane la gente comune le pagherà in pane. Julia lo ascolta con gli occhi sulle carte, poi dice piano che in questi anni Mirko Vesh ha costruito una rete. [quietly] “Se i Malgrani erano il tronco, lui è la linfa” aggiunge, e posa la mano sulle lettere con l'alloro.

    [coldly] “Ed è dappertutto” dice Galdrick, senza sciogliere le braccia. “Ho passato dieci anni a contenerlo come un'infezione di quartiere. Ho fermato bande e rivolte, e il Cucitore l'ho inseguito per i vicoli. [determined] Questa è una guerra, e in guerra chi non colpisce per primo muore.”
  il-municipio-all-alba__2-esito: |
    [tense] Julia indica la finestra e la nebbia che sale dalla Città Bassa. [solemn] “Laggiù è pieno di disperati, gente che negli Scuri vede un lavoro e una protezione. Se saltiamo addosso a Mirko con gli stendardi della città, difenderanno lui” dice, e lo dice come una sentenza.

    [coldly] “Mirko è già in guerra, e aspetta soltanto che lo accettiamo anche noi” risponde Galdrick con una voce fredda che non gli conoscevi. Gli Scuri, dice, hanno fatto della Città Bassa un braciere che prima o poi si accende, e a loro resta soltanto da scegliere quando. [gruff] “E tu sottovaluti chi sta laggiù, perché molti non vedono l'ora che Vesh sparisca” aggiunge, facendo un passo verso di lei.
  il-municipio-all-alba__3-esito: |
    [softly] Racconti di Lucia Malgrani, di quello che ti ha detto quella notte e di come ti ha aiutato. Julia ti ascolta con la penna ferma a mezz'aria. [warmly] “Se collabora, la prendiamo come testimone e senza catene” dice alla fine, e scrive una riga a margine del mandato. I bambini, aggiunge, sono a Ghoran con Urtilia e restano fuori da tutto.

    Galdrick annuisce una volta sola, con il mento. [gruff] “Urtilia Mendion non interverrà, ha chiesto soltanto questo” dice, e torna a guardare la nebbia.
  il-municipio-all-alba__4-esito: |
    [determined] Gli dici che verrai con lui. Galdrick si toglie l'elmo e lo tiene sotto il braccio. [gruff] “Il mandato per il Maniero parte stanotte, e noi intanto scendiamo alla Pignatta” dice, battendo il guanto di ferro sulle carte. [menacing] “Siamo già dentro la bocca del lupo” aggiunge guardando Julia, “e adesso possiamo soltanto affondare il coltello.”

    [urgent] “Toren, se sbagliamo una mossa questa città esplode” dice Julia, rialzando di colpo il capo. [ominous] Lui le sorride, per la prima volta da quando sei entrato, e le dice che forse è quello che serve. [long pause] [resigned] “Che la luce del Velo ci assista. D'accordo, lo faremo” dice lei dopo un lungo silenzio.

    [gruff] “Preparati, perché fra un'ora la Città Bassa sarà nel caos” ti dice Galdrick sulla porta, con l'elmo sotto il braccio.
  il-municipio-all-alba__5-esito: |
    [calm] Dici a Julia che ha ragione a temere la folla, e che verrai lo stesso, perché laggiù qualcuno dovrà guardare in faccia la gente prima di colpirla. Julia ti guarda a lungo, con le mani giunte sul tavolo. [quietly] “Allora tienila d'occhio tu, la gente, perché Toren guarderà soltanto Vesh” dice alla fine, senza alzare la voce.

    [gruff] “Siamo già dentro la bocca del lupo, Julia” dice Galdrick togliendosi l'elmo. [pen scratching on paper] Lei firma il mandato per il Maniero sotto la firma dello sceriffo, con la penna che gratta la carta. [solemn] “Che la luce del Velo ci assista” dice mentre soffia sull'inchiostro. [ominous] “Fra un'ora la Città Bassa sarà nel caos” risponde Galdrick, che è già sulla porta.
  l-assalto-alla-pignatta: |
    [ominous] Di notte la Città Bassa è sempre rumorosa. Stasera invece le finestre sono chiuse, e le torce agli angoli fumano senza fare luce. Galdrick cammina in testa con il mantello che striscia nel fango, i miliziani scelti intorno e i mercenari di Ghoran in coda, e tu due passi dietro di lui, finché non girate l'ultimo angolo.

    [tense] Lo spiazzo della Pignatta è illuminato da decine di lanterne appese ai fili, e le porte della taverna sono spalancate. Davanti, appoggiato a un bastone da passeggio, c'è Mirko Vesh, magro ed elegante, con un anello a ogni dito. Ai lati ha i suoi quattro tenenti. Mauro Scrocco si è tolto la camicia sgargiante, e sotto il grasso si vedono i muscoli di un uomo che spacca la legna da sempre. In mano ha un'ascia da boscaiolo. Rozalia Marga si rigira fra le dita due stiletti sottili come fossero penne. [eerie] Nestor Gramm scuote una boccetta verde e ha gli occhi febbrili. Borso, con l'anello delle chiavi della Caserma alla cintura, guarda soltanto Galdrick. Di Nihali Cuzan, il baro della bisca all'Orlo, stanotte non c'è traccia.

    Mirko alza una mano, e dai vicoli escono le sagome. Sono centinaia, con in mano randelli e bottiglie rotte. [sad] Molti sono ragazzi che hanno paura, e guardano te.

    [whispers] “È una trappola” sussurra Galdrick. “E sapevo che l'avrebbe preparata così.” Poi alza la voce. [shouting] “Vesh! Questa è la tua ultima notte!”

    [chuckles] Mirko ride, calmo. [slyly] “Vecchio amico… no. È la tua.”

    [swords drawn] Le due lame escono insieme dai foderi, e i due uomini spariscono dentro la Pignatta. [door slams] Le porte sbattono alle loro spalle, e qua fuori adesso tocca a te.
  l-assalto-alla-pignatta__1-vittoria: |
    [determined] Ti fai strada a colpi di piatto e d'elsa, e chi cade si rialza e scappa. Dopo un po' qualcuno grida [shouting] “Non vogliono ucciderci!”, e il grido passa di bocca in bocca fino ai vicoli. Mezza folla si sparpaglia. [tense] Mauro ti viene incontro con l'ascia alta e uno dei suoi ragazzi al fianco, e quando finalmente va giù fa tremare le lanterne.

    [exhales] Nestor Gramm posa la boccetta per terra e alza le mani. Rozalia rompe un fumogeno ai suoi piedi, e quando il fumo si dirada è sparita. [somber] Borso lo tengono in quattro, i mercenari di Ghoran, e lui continua a guardare le porte chiuse della Pignatta.
  l-assalto-alla-pignatta__1-sconfitta: |
    [tense] Ti fai strada a colpi di piatto, ma la folla si chiude e Mauro ti arriva addosso dalla parte sbagliata. [pained] L'ascia ti prende di striscio sulla spalla, e [glass shattering] un ragazzo ti spacca una bottiglia sulla nuca. [breathing heavily] Finisci in ginocchio nel fango, sotto le lanterne.

    Ti rimettono in piedi i miliziani di Galdrick, arrivati di corsa con gli scudi alzati. Mauro e il suo ragazzo li prendono in sei. [tired] Nestor si è arreso da solo, di Rozalia resta il fumo di un fumogeno, e Borso lo tengono a terra in quattro. [softly] Fra la folla qualcuno ha visto che colpivi di piatto, e lo racconta.
  l-assalto-alla-pignatta__2-successo: |
    [determined] Sali su un carro rovesciato all'angolo dello spiazzo e parli forte, senza la spada in mano. Dici che la Caserma è venuta per Vesh e per i suoi tenenti, e che a chi torna a casa stanotte nessuno chiederà il nome. [wry] E aggiungi che Vesh li paga a settimana, e che questa settimana non la pagherà.

    [relieved] Per prima se ne va una donna con un randello. Dietro di lei partono due ragazzi, e dopo un po' i vicoli si svuotano a gruppi. Mauro guarda la sua folla che se ne va e abbassa l'ascia, e i mercenari di Ghoran gli sono addosso prima che la rialzi. Nestor Gramm posa la boccetta per terra. [satisfied] Di Rozalia resta il fumo di un fumogeno, e Borso lo legano in quattro.
  l-assalto-alla-pignatta__2-fallimento: |
    Sali su un carro rovesciato all'angolo dello spiazzo e cominci a parlare, [glass shattering] ma prima della terza frase una bottiglia ti prende sulla fronte. [pained] Qualcuno ascolta lo stesso. Mentre scendi dal carro con il sangue negli occhi vedi un gruppo di ragazzi lasciare i randelli contro un muro e sparire in un vicolo.

    [tense] Gli altri ti vengono addosso, e prima che la milizia di Galdrick faccia quadrato intorno a te i randelli ti arrivano sulla schiena e sulle gambe. [breathing heavily] Quando la folla si sparpaglia i tenenti di Vesh sono a terra o in catene, tutti tranne Rozalia, che ha lasciato soltanto il fumo di un fumogeno.
  l-assalto-alla-pignatta__3-successo: |
    [mocking] Gli gridi dall'altra parte dello spiazzo che stanotte non c'è nessun cristallo a rimetterlo in piedi. [crowd laughing] Un ragazzo della folla ride, e poi ridono altri, quelli che erano sulle gradinate dell'Arena. [amused] Mauro diventa viola. Ti carica da solo con l'ascia alta, senza guardare dove mette i piedi, e inciampa nella corda di una lanterna caduta.

    Gli sono addosso in sei, i mercenari di Ghoran, prima che si rialzi. [satisfied] Con Mauro a terra mezza folla perde la voglia e torna nei vicoli. Nestor alza le mani. Rozalia sparisce in una nuvola di fumogeno, [somber] e Borso si lascia legare senza smettere di guardare le porte della Pignatta.
  l-assalto-alla-pignatta__3-fallimento: |
    Gli gridi dell'Arena dall'altra parte dello spiazzo, [uneasy] e Mauro non risponde e non diventa nemmeno rosso. [ominous] Ti viene incontro piano con l'ascia bassa, e la folla si apre davanti a lui. [pained] Il primo colpo ti arriva prima che tu abbia finito di capire quanto è veloce un uomo così grosso, e il manico dell'ascia ti spacca il labbro e ti manda nel fango.

    Ti tirano via i miliziani di Galdrick, che lo prendono in sei con le corde. [bitter] Nella confusione Nestor si arrende, e di Rozalia resta soltanto il fumo di un fumogeno. Borso lo legano contro il muro della Pignatta.
  l-assalto-alla-pignatta__4-vittoria: |
    [cold] Passi in mezzo alla folla senza guardarla, e lasci ai miliziani quelli che ti vengono addosso. Mauro ti aspetta davanti alle porte chiuse con l'ascia a due mani. [tense] È più veloce di quanto sembri e più forte di quanto speravi, e alla fine l'ascia finisce nel fango e lui ci cade sopra.

    [exhales] Senza Mauro i tenenti si sfaldano. Nestor posa la boccetta e si siede per terra, Rozalia sparisce nel fumo di un fumogeno, e Borso lo prendono i mercenari di Ghoran. [crowd shouting] [somber] Fra i vicoli la milizia mena ancora randellate, e la folla grida.
  l-assalto-alla-pignatta__4-sconfitta: |
    [tense] Mauro ti aspetta davanti alle porte chiuse con l'ascia a due mani, e quando arrivi è lui a colpire per primo. [pained] Ti ritrovi con la schiena contro il legno della Pignatta e le sue mani intorno al collo, finché [wood splintering] un mercenario di Ghoran non gli spacca un'asta sulla testa.

    [breathing heavily] Lo legano in quattro. Intorno la milizia ha fatto il suo lavoro a randellate, e la folla si è dispersa gridando. Nestor si è arreso da solo e Borso è in catene, mentre di Rozalia resta il fumo di un fumogeno. [bitter] Nella Città Bassa, domani, ricorderanno soprattutto le randellate della milizia.
  l-assalto-alla-pignatta__5-successo: |
    [cold] Il primo ragazzo che ti si para davanti con una bottiglia rotta va giù e resta giù, e il secondo fa la stessa fine. [crowd screaming] Dopo il terzo la folla si apre davanti a te urlando, e in mezzo alle urla qualcuno grida [shouting] “Gli assassini del governo!”, e il grido corre per i vicoli.

    Arrivi da Mauro con la lama già sporca, e lui cade davanti alle porte chiuse della Pignatta e non si muove più. Nestor alza le mani tremando e Borso si lascia legare. Di Rozalia resta soltanto il fumo di un fumogeno. [long pause] [somber] Sotto le lanterne dello spiazzo restano otto corpi, e soltanto uno era un tenente di Vesh.
  l-assalto-alla-pignatta__5-fallimento: |
    [tense] Ti butti nella folla, ma la folla è più grande di quanto pensavi e non scappa. Ti si chiude intorno, e per ogni ragazzo che va giù ne arriva un altro con un randello. [breathing heavily] Ti trascinano fuori i mercenari di Ghoran, con un taglio sul fianco e le nocche spaccate.

    I tenenti li prendono loro, tranne Rozalia, sparita nel fumo di un fumogeno. [somber] Sullo spiazzo restano i corpi dei ragazzi, [pause] e dietro le imposte chiuse la Città Bassa ha visto chi li ha messi lì.
  l-assalto-alla-pignatta__6-successo: |
    [quietly] Le arrivi accanto mentre la folla avanza e le dici a bassa voce che stanotte la Pignatta cade comunque, e che una falsaria senza padrone trova lavoro in qualunque città. [metal clinking] Rozalia batte due volte uno stiletto contro l'altro, come una penna sull'orlo del calamaio.

    [slyly] “Per la precisione, tesoro, Mirko i ragazzi li paga fino a stasera” dice. [shouting] Poi grida verso i vicoli, con una voce da pescivendola, che la paga è finita. Mezza folla si ferma a guardarla. [wry] Quando ti volti di nuovo lei è sparita, e al suo posto resta un filo di fumo grigio. [satisfied] Senza i ragazzi i tenenti restano in pochi, e la milizia li prende uno alla volta.
  l-assalto-alla-pignatta__6-fallimento: |
    Le arrivi accanto e cominci a parlare, [wry] ma Rozalia ha già fatto i suoi conti senza di te. [tense] Ti sorride, e lo stiletto che aveva fra le dita ti apre la manica e il braccio dal polso al gomito. [glass shattering] Poi rompe un fumogeno ai tuoi piedi.

    [coughs] Quando smetti di tossire sullo spiazzo la milizia mena già randellate, e la folla grida. [bitter] I tenenti li prendono i mercenari di Ghoran, uno alla volta, mentre tu ti stringi il braccio nel fazzoletto.
  l-assalto-alla-pignatta__7-successo: |
    [solemn] Ti inginocchi accanto al ragazzo in mezzo allo spiazzo, e la folla si ferma con i randelli alzati. Gli posi le mani sulla testa e preghi l'Albero ad alta voce. [awed] Sotto le tue dita la ferita si chiude, e il ragazzo apre gli occhi e chiama sua madre.

    [tender] Una donna esce dalla folla e se lo prende in braccio. Dietro di lei se ne vanno in tanti, a gruppi, lasciando i randelli per terra. Sullo spiazzo i tenenti di Vesh restano con pochi dei loro, e la milizia li prende uno alla volta. [wry] Soltanto Rozalia sparisce, nel fumo di un fumogeno.
  l-assalto-alla-pignatta__7-fallimento: |
    [solemn] Ti inginocchi accanto al ragazzo e preghi l'Albero ad alta voce, [pained] ma la ferita sotto le tue dita sanguina ancora quando una bottiglia ti prende alla schiena, e un randello alla nuca. Il ragazzo lo portano via due donne, svenuto. [softly] La folla ha visto lo stesso che cosa cercavi di fare, e una parte se ne torna nei vicoli.

    Gli altri li tiene la milizia. Quando ti rialzi i tenenti di Vesh sono in catene, tranne Rozalia che è sparita nel fumo. [bitter] In bocca hai la nausea che ti lascia sempre una preghiera finita male.
  l-assalto-alla-pignatta__8-successo: |
    [determined] Sali su un carro rovesciato all'angolo dello spiazzo e cominci a chiamare i nomi. [warm] Chiami il figlio del bottaio, quello con l'orecchio storto, e le due sorelle della strada delle fucine, e a ogni nome aggiungi quello della madre, che a quest'ora li aspetta sveglia. [glass shattering] Al terzo nome un ragazzo lascia cadere la bottiglia. [relieved] Al quinto se ne vanno a gruppi, e i vicoli si svuotano dietro di loro.

    Mauro guarda la sua folla che se ne va e abbassa l'ascia, e i mercenari di Ghoran gli sono addosso prima che la rialzi. Nestor Gramm posa la boccetta per terra. [satisfied] Di Rozalia resta il fumo di un fumogeno, e Borso lo legano in quattro.
