# Regia del doppiaggio: Le cinque tribù
regia:
  verso-la-palude-acquanera: |
    [calm] All'uscita sud della Città Bassa le case di pietra grezza finiscono di colpo, e comincia una pianura d'erba gialla e rasa che il vento pettina tutta dalla stessa parte. Sull'ultimo muro qualcuno ha scritto con la calce Acqua buona a destra. [wry] A destra c'è un pozzo, chiuso da una tavola inchiodata di traverso.

    Hai in tasca la mappa che Ilvaena ti ha disegnato a cena al Grifone, a carboncino, sul retro del conto. Da una parte c'è il fiume senza nome con i suoi canali, e una croce al centro della palude dove sta la torre. [amused] Dall'altra c'è la cena, con il secondo giro di birra sottolineato due volte dalla mano di Liaren. Ogni cento passi le dita ti vanno alla tasca per controllare che il foglio ci sia ancora.

    [warmly] “Segui il fiume finché diventa fango” ha detto Ilvaena, piegando il foglio in quattro con le unghie. “Poi cerca la torre, che è l'unica cosa dritta in tutta la palude. E ricordati che gli Spacca-ossa aspettano invece di inseguire. Nella palude gli conviene, e a te no.” Poi ti ha versato da bere, e ha cambiato discorso prima che potessi farle altre domande.

    [ominous] Verso sud, in fondo alla pianura, c'è una riga scura di pini, e sopra i pini il cielo è più bianco che altrove.
  verso-la-palude-acquanera__1-esito: |
    Cammini tutta la mattina fra campi che nessuno ara da anni, dove i solchi si vedono ancora sotto l'erba. [somber] A metà strada passi accanto a una casa di coloni senza tetto, con una scarpa da bambino appesa a un chiodo della porta, e non ti fermi. [uneasy] Dopo i pini il terreno comincia a cedere sotto gli stivali. [eerie] Davanti a te la nebbia sta bassa sull'acqua, e il fiume senza nome ci entra dentro e non ne esce.
  verso-la-palude-acquanera__2-esito: |
    [horse trotting] Il baio attraversa la pianura al trotto, contento di avere spazio, e a metà mattina sei già sotto i pini. [uneasy] Dove il terreno comincia a cedere pianta gli zoccoli e non va avanti, con le orecchie dritte verso la nebbia. [wry] Non hai voglia di discutere con lui. Lo leghi a un pino con la corda lunga e gli lasci il fieno della bisaccia, e lui ti guarda andare senza smettere di masticare.
  verso-la-palude-acquanera__3-esito: |
    [calm] A metà mattina passa sopra la pianura una fila di aironi diretti a sud, bassi, con il collo piegato all'indietro. Al Circolo ti hanno insegnato a guardare dove scendono, perché un airone non spreca una battuta d'ala. [satisfied] Lasci la riva del fiume e tagli dritto per i campi incolti dietro di loro, e arrivi sotto i pini molto prima di quanto dicesse la mappa di Ilvaena. [whispers] [amused] Lei avrebbe fatto lo stesso, e sul conto non l'ha scritto. [eerie] Dove il terreno comincia a cedere, gli aironi sono già fermi nella nebbia, su una zampa sola.
  la-torre-di-bolgrum: |
    [tense] Arrivi sull'isolotto al tramonto, fradicio di acqua nera, e ti acquatti fra le radici di un tasso a venti passi dalla torre. La porta in cima alla scala di legno è aperta. [eerie] Il piano terra è illuminato da una torcia e da una fila di candele votive accese davanti a una statua di pietra grezza che raffigura un essere con due braccia e una testa, lasciato a metà dallo scalpello. Tre orchi siedono a un tavolo di pietra, davanti a una coppa di metallo piena di monete, a una coppa di vino e a un piatto di carne cruda. Alle pareti ci sono rastrelliere piene di lance e di asce appese ai ganci.

    Dalla finestra con le sbarre si vede il piano di sopra. [ominous] Su un trono di teschi legati con cinghie di cuoio siede Bolgrum, così grasso che il trono gli scompare sotto. Ha una pelliccia d'orso sulle spalle e una corona d'ossa in testa, e tiene fra le ginocchia un bastone da sciamano con le piume. Respira con fatica e fa schioccare la lingua fra una frase e l'altra. [menacing] In piedi accanto al trono c'è Skarr. È magro, arriva con la testa quasi alle travi e tiene un'ascia bipenne appoggiata alla spalla. [somber] Sul tavolo dietro di loro sono ammucchiati libri e pergamene coperti di ragnatele, quello che resta del mago che abitava la torre.

    [hoarse] “Skarr” dice Bolgrum con una voce acuta e roca. “Che fine ha fatto il cartello che dice di non entrare?”

    [tense] Skarr fa spallucce, e intanto guarda verso i tassi. [whispers] [nervous] Non può vedermi da lassù. [swallows] Il sudore ti si raffredda sulla nuca lo stesso.
  la-torre-di-bolgrum__1-vittoria: |
    [tense] I tre orchi del piano terra ti vedono sulla porta e si buttano in acqua dalla scala, perché gli Spacca-ossa aspettano invece di inseguire. Di sopra Bolgrum ti guarda storto. [sneering] “E questa che bestia è? Una capra senza corna?” [metal clanging] Skarr ti viene addosso con l'ascia, e quando cade il pavimento trema. [cold] Bolgrum muore seduto, con il bastone ancora fra le ginocchia, senza essersi alzato.

    [exhales] Ti metti sotto la giacca le pergamene del mago e svuoti la coppa nella bisaccia. [wry] Rientri in Città Bassa a notte fonda, con le braccia che tremano e la storia già pronta per chi vorrà sentirla.
  la-torre-di-bolgrum__1-sconfitta: |
    [pained] L'ascia di Skarr ti prende di piatto e ti manda contro la parete, e Bolgrum ride con la sua voce acuta, battendo il bastone sul pavimento. [breathing heavily] Esci dalla torre non sai come e ti butti in acqua. Bolgrum deve aver pesato che una torre trovata una volta si trova anche la seconda, perché più tardi, dai giunchi, lo vedi scendere la scala di legno sulle sue gambe, appoggiato a Skarr. [ominous] Entrano nel canale con l'acqua alla cintola, la tribù gli va dietro, e in pochi minuti spariscono nella nebbia.

    [tired] Quando la torre è vuota risali piano la scala di legno, e sul tavolo di sopra trovi il fascio di pergamene del mago sotto un dito di polvere, dove nessuno l'ha toccato. [exhausted] Torni in città all'alba zoppicando su una gamba, con le pergamene dentro la camicia.
  la-torre-di-bolgrum__2-successo: |
    [tense] Quando Skarr scende per la carne ti arrampichi sulla pietra sbrecciata e tiri la sbarra più rossa di ruggine, che viene via con un pezzo di malta. Bolgrum ti vede entrare. [hoarse] “Skarr” chiama, “c'è una lucertola alla finestra.” Non fa in tempo a dire altro. [footsteps on stone] Skarr risale la scala a chiocciola di corsa, ma nella spirale stretta la bipenne sbatte contro i muri, e tu lo aspetti in cima con tutto il tempo che ti serve. [cold] Cade all'indietro fino al piano terra, sopra il tavolo di pietra, e non si rialza più.

    [satisfied] I tre orchi scappano in acqua. Prendi le pergamene e la coppa, e torni in Città Bassa con le mani graffiate e la storia da raccontare.
  la-torre-di-bolgrum__2-fallimento: |
    [tense] A metà del muro una pietra ti resta in mano e cadi di schiena nel fango, con un tonfo che si sente fino alla torre. Skarr esce dalla porta con l'ascia prima che tu riesca a rialzarti, [pained] e la lama ti apre il fianco mentre ti butti in acqua. [bitter] Dai giunchi vedi Bolgrum alzarsi dal trono, forse per la prima volta in anni, e scendere la scala un gradino alla volta con Skarr davanti. Entrano nel canale fino alla cintola e spariscono fra le canne.

    [tired] Aspetti che la torre resti vuota prima di salire. Le pergamene del mago sono ancora sul tavolo sotto la polvere e le ragnatele, e te le infili sotto il braccio. [breathing heavily] Torni in città tenendoti il fianco con l'altra mano.
  la-torre-di-bolgrum__3-esito: |
    [fire crackling] Il legno è umido e ci mette un pezzo a prendere, poi il fuoco sale lungo la scala e il fumo entra nella torre. Gli orchi escono dalle brecce delle mura e si buttano in acqua. [tense] Poi dalla breccia più larga esce Bolgrum sulle sue gambe, appoggiato a Skarr. Scende nel canale tossendo e ci entra fino alla cintola. Skarr ti vede sulla riva e ti viene addosso con l'ascia. [pained] Ti prende alla spalla, poi torna da Bolgrum senza fretta, e quando il fumo si dirada sono spariti tutti fra i canali.

    [resigned] Sali dalla breccia e dal tavolo di sopra salvi le pergamene del mago, annerite agli angoli. Torni in città con la spalla fasciata e i capelli che sanno di fumo.
  la-torre-di-bolgrum__4-successo: |
    [tense] Gli orchi ti portano di sopra per le braccia. Bolgrum ti guarda a lungo, schioccando la lingua. [mocking] “Che bestia è? Ha le orecchie piccole.” [slyly] Gli dici che il suo cartello galleggia nei giunchi, e gli chiedi chi doveva tenerlo dritto. Bolgrum ti pesa con gli occhi, poi pesa Skarr allo stesso modo e alla fine lo manda fuori a cercarlo. [quickly] Quando allunga la mano verso il bastone sei già addosso a lui, e muore sul trono senza essersi alzato.

    [tense] Skarr torna su per la scala di legno con il cartello sotto un braccio e l'ascia sull'altra spalla, e tu lo aspetti dietro la porta. Quando ha la testa all'altezza della soglia gli pianti il piede in pieno petto, e lui non ha una mano libera per tenersi alla scala. [water splashing] Cade nel canale stringendo l'ascia, e l'ascia lo porta a fondo. [exhales] Esci con le pergamene e con la coppa, mentre i tre orchi di sotto si tuffano in acqua. [wry] In città arrivi a notte, con la storia di un capotribù morto per un cartello.
  la-torre-di-bolgrum__4-fallimento: |
    [tense] Bolgrum ti ascolta schioccando la lingua, e alla fine allarga le mani grasse. [coldly] “Leggero” dice. “Skarr.” [pained] L'ascia ti arriva addosso mentre sei già alla finestra, e ti prende la schiena prima che tu finisca in acqua. [bitter] All'alba, dai giunchi, vedi Bolgrum lasciare la torre a piedi, con Skarr davanti. Entra nei canali con l'acqua alla cintola, e la tribù gli va dietro. [somber] Il trono di teschi resta di sopra, vuoto.

    [tired] Sali nella torre deserta e prendi dal tavolo il fascio di pergamene impolverate, che gli orchi non hanno degnato di uno sguardo nemmeno per portarsele via. [breathing heavily] Torni in città piegato in avanti per il dolore alla schiena, con il fascio stretto contro il petto.
  brutte-notizie-in-municipio: |
    [tense] Il biglietto dello sceriffo dice soltanto Municipio, subito. Il Municipio sta all'incrocio fra Via del Velo e la Cattedrale, due piani di pietra chiara con le sentinelle in cima alla scalinata. [wry] Nell'atrio una targa d'ottone indica la scala per la banca cittadina, nel seminterrato, con la parola provvisoria e una data di quarant'anni fa.

    Al piano di sopra la porta dell'ufficio della Rappresentante è aperta. Julia Castaldi siede dietro la scrivania con le braccia conserte, e davanti a lei Toren Galdrick ascolta un'elfa dai capelli ramati, infangata fino alle ginocchia. [hoarse] “Entra pure” dice lei con la voce roca. “Ormai queste faccende riguardano anche te.” Galdrick te la presenta come Ilvaena Sorathe della guardia cittadina, poi aggiunge [deadpan] “non ufficiale”, [amused] e lei ride scuotendo la testa.

    [somber] Ilvaena racconta che alla razzia c'erano tutte e cinque le tribù del circondario, e a memoria d'elfo non si erano mai mosse insieme. Ieri a Fondobosco ha sentito dei reduci malconci farfugliare degli eretici che in città gli avevano ammazzato tanti guerrieri. “Parlavano di voi difensori” dice. [wry] “Le bestiacce litigano sempre fra loro, a meno di avere in testa una cosa grossa, e per le cose grosse serve un capo grosso.”

    [ominous] Galdrick tiene i pollici nella cintura e dice un nome solo, Balthog, a voce bassa. [swallows] Ti si secca la bocca. [whispers] [uneasy] È lo stesso nome che stava nel nucleo della macchina. Julia annota il nome senza commentare, e lo sceriffo si volta verso di te. [gruff] “Nei prossimi giorni fatti vedere in città” dice. “Se la gente ti incontra per strada si preoccupa meno.”
  brutte-notizie-in-municipio__1-esito: |
    Gli dici di sì, senza giri di parole. Galdrick annuisce una volta e tira fuori il taccuino dalla giubba, e ti pare di vederci il tuo nome accanto a un turno di ronda. [gruff] “Il mercato la mattina e i ponti la sera” dice. “Basta che ti vedano.”

    [warm] Ilvaena si stira la schiena e ti invita a cena stasera al Grifone di Ferro. Vuole sentire la razzia da chi c'era, e in cambio ti racconterà le tribù una per una. Adesso va a lavarsi e a dormire un giorno intero. [wry] Julia scioglie le braccia giusto il tempo di dirti che la porta del suo ufficio, per te, resta aperta.
  brutte-notizie-in-municipio__2-esito: |
    [thoughtful] Ilvaena ci pensa mentre si gratta via una crosta di fango dal polsino. Gli orchi di Fondobosco quella parola la dicevano a bassa voce, racconta, nello stesso modo in cui si nomina una malattia. [hoarse] “Su che cosa credano le bestiacce ne so meno di quanto vorrei” dice. [wry] “So che di voi hanno paura, e un orco la paura la ammette malvolentieri.”

    [warm] Poi ti invita a cena al Grifone di Ferro, stasera. Vuole sentire la razzia da chi c'era, e in cambio ti racconterà le tribù. Allo sceriffo dici di sì, e Julia Castaldi aggiunge che per qualunque cosa il suo ufficio è qui. Ilvaena, uscendo, ti batte due dita sulla spalla.
  brutte-notizie-in-municipio__3-esito: |
    Julia ti ascolta con la mano posata su una pratica chiusa, e risponde prima che tu abbia finito la frase. [determined] “I cittadini mi hanno scelta quando nessuno aveva paura di niente” dice. “Adesso che hanno paura non intendo deluderli. [deadpan] Se ti serve qualcosa sali qui e chiedilo chiaro, che di giri di parole in questo ufficio ne sento già abbastanza.”

    Allo sceriffo dici di sì, e lui annuisce una volta. [amused] Ilvaena ti invita a cena stasera al Grifone di Ferro, la tua razzia in cambio delle sue tribù, poi esce sbadigliando nella manica.
  brutte-notizie-in-municipio__4-esito: |
    [quietly] Resti accanto alla porta e lasci parlare loro. Ilvaena dice le cose come le ha viste, con le date giuste. Lo sceriffo ripete i nomi a mezza voce per fissarli. Julia scrive poco, e quando Ilvaena nomina Fondobosco sottolinea una riga due volte. [wry] Alla fine si accorge che non hai aperto bocca, e ti ringrazia proprio per questo, perché da una settimana in quell'ufficio parlano tutti.

    Allo sceriffo rispondi con un cenno, che gli basta. Ilvaena ti invita a cena stasera al Grifone di Ferro e se ne va a dormire.
  brutte-notizie-in-municipio__5-esito: |
    Fai il mezzo inchino che si usa in Municipio nei giorni di seduta, con la mano sul petto e gli occhi sulla scrivania, e Julia scioglie le braccia. [wry] “Al Festival sedevi due sedie più in là” dice. “A tavola, da voi, si parla di dazi anche con il salmone nel piatto.” [softly] Poi, più piano, ti chiede se a casa tua si dorme, in questi giorni. [tired] Le dici di no, e lei annuisce come se le avessi confermato una cifra già scritta.

    [warm] Allo sceriffo rispondi di sì. Ilvaena ti invita a cena stasera al Grifone di Ferro, la tua razzia in cambio delle sue tribù, e Julia ti accompagna alla porta di persona, cosa che in quell'ufficio non fa per nessuno.
