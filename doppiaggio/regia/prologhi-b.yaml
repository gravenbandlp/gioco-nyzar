# Regia del doppiaggio: I prologhi
regia:
  tre-giorni-dopo: |
    [somber] Sono passati tre giorni dalla razzia e Qir-Azel ha finito di seppellire i suoi morti. Il Velo ha benedetto le fosse comuni e dice che sono una cinquantina fra guardie e civili. [wry] Nelle osterie della Città Bassa li contano ancora, e ogni sera il conto cambia di qualche nome a seconda di chi offre da bere. Il Festival è sospeso, e sulla piazza della cattedrale nuova i tavoli del pranzo sono rimasti rovesciati dove sono caduti, anche se le tovaglie buone qualcuno è già passato a prenderle.

    Lo sceriffo Toren Galdrick ha passato due notti nelle celle della Caserma con gli orchi presi vivi. Molti altri si sono gettati dal crinale nella Cicatrice pur di non farsi prendere. [mysterious] I prigionieri ripetono la litania e poco altro, ma si dice che un paio abbiano parlato, e che il loro capo non fosse un orco. [wry] Alla Pignatta Grassa aggiungono che dovevano andare al cimitero, e scommettono su cosa ci cercassero. [eerie] Le tre macchine dei Precursori scese dai tetti le hanno trovate spente il mattino dopo sulle grondaie, con le braccia ripiegate, e la Caserma le ha fatte calare con le funi.

    Anche la Locanda del Grifone di Ferro, sui Ponti Sospesi, ha avuto la sua parte. Gli orchi in fuga le hanno sfondato le finestre e dato fuoco alla tettoia sul retro. [warm] Liaren Tarvelin, la proprietaria, ha fatto sapere in giro che chi ha difeso la città ha una settimana di alloggio pagata, e che per il resto basta raccontarle com'è andata.

    [tired] Tre giorni fa c'eri anche tu, e da allora ti svegli ogni notte alla stessa ora con il canto degli orchi ancora nelle orecchie e la mascella indolenzita a forza di stringere i denti. [short pause] Adesso devi decidere da dove ricominciare.
  tre-giorni-dopo__1-esito: |
    Le fucine hanno ripreso a battere il giorno dopo la razzia, e i fabbri pagano a giornata come prima. Nei vicoli qualcuno ti riconosce e ti offre da bere, e qualcun altro ti chiede se è vero quello che si racconta. [wry] Da come lo chiede capisci che in tre giorni la storia è cresciuta parecchio.

    Al Grifone di Ferro, sui Ponti, ti aspetta una branda pagata per sette notti. [warm] Di giorno però torni nei vicoli dove sei cresciuto.
  tre-giorni-dopo__2-esito: |
    I Raschiatori hanno contato i loro morti prima degli altri e sono già tornati al lavoro. Al Grifone di Ferro Liaren ha fatto rattoppare le finestre con assi di scarto, e nella camerata c'è una branda con il tuo nome scritto col gesso, [wry] sbagliato di una lettera, pagata per una settimana.

    [short pause] Dicono che Dragna Gro-Malog voglia sapere da tutti cosa hanno visto alla porta nord.
  tre-giorni-dopo__3-esito: |
    Ottilia Sanvel, che ha la responsabilità dei monaci, ti manda nella Città Bassa con una borsa di bende e l'ordine di tornare quando le avrai finite. [somber] Laggiù molti feriti della razzia non hanno ancora visto un guaritore. Mentre scendi, le mani contano i rotoli nella borsa al tatto, come monete.

    [warm] Per la notte non devi risalire in Cattedrale. Liaren Tarvelin ha fatto sapere al Velo che al Grifone di Ferro c'è una branda pagata anche per te.
  tre-giorni-dopo__4-esito: |
    [wry] Nei Quartieri Alti i salotti hanno riaperto prima delle botteghe, e ogni sera si discute di chi ha fatto cosa durante la razzia. Il tuo nome gira, e due famiglie ti hanno già mandato un invito a cena.

    In famiglia storcono la bocca quando sentono della branda che Liaren Tarvelin ti ha offerto al Grifone di Ferro sui Ponti, e ne parlano a bassa voce come di una parente caduta in disgrazia. [deadpan] Tu l'hai accettata lo stesso.
  tre-giorni-dopo__5-esito: |
    Al Mercato dei Nodi i prezzi sono saliti il giorno stesso della razzia, e la Gilda ha già mandato i suoi esattori a contare le perdite di ciascuno. [wry] Il tuo banco sui Ponti è rimasto chiuso per tutto il Festival e non ha un graffio, e l'esattore che passa a controllarlo sembra quasi deluso di non trovarci niente da scrivere.

    [satisfied] Liaren Tarvelin ti ha fatto dire che al Grifone di Ferro c'è una branda pagata per una settimana, e la sera stessa ci hai portato le tue cose.
  tre-giorni-dopo__6-esito: |
    [calm] Sui Ponti Sospesi il vento porta via l'odore di bruciato che ristagna ancora sulla piazza. Dalle corde pendono le ghirlande di foglie rosse del Festival, che nessuno ha pensato a togliere.

    Al Grifone di Ferro Liaren ti ha lasciato una branda vicino alla finestra, pagata per sette notti. [wind blowing] Da lì senti il vento che sale dalla Cicatrice.
  tre-giorni-dopo__7-esito: |
    Nella Città Bassa nessuno ti chiede da dove vieni, e dopo la razzia la gente ha altro a cui pensare. [wry] Da Grusk cercano braccia per sgomberare le macerie, e alla Pignatta Grassa si scommette anche sui forestieri.

    [quietly] Per la prima volta da quando sei scappato da Ghoran qualcuno ti ha pagato un letto. È una branda al Grifone di Ferro sui Ponti Sospesi, e ti aspetta per sette notti. [slowly] La prima sera la tasti con il palmo, piano, prima di fidarti a stenderti.
  tre-giorni-dopo__8-esito: |
    All'Accademia le lezioni sono riprese a metà, perché molti allievi sono ancora a casa dalle famiglie. [wry] Orvald Temmerin non parla della razzia a lezione, e se qualcuno ci prova volta pagina con un rumore secco.

    Liaren Tarvelin ti ha fatto sapere che al Grifone di Ferro, sui Ponti, c'è una branda pagata per te per una settimana. [warm] In cambio chiede solo che una sera tu le racconti com'è andata al Festival.
  prologo-mercante-dei-ponti: |
    È il primo giorno d'autunno, e il Festival delle Foglie Alate è cominciato stamattina. Hai piazzato il banco in fondo al mercato, dove la strada piega verso la porta nord e la locanda del Daino Zoppo, perché chi entra in città passa di qui prima di arrivare in piazza. Vendi castagne secche in sacchi di tela. [wry] A mezzogiorno, mentre Padre Vantes liberava le farfalle foglia-rossa, ne hai vendute metà, perché la gente con il naso all'aria paga senza contrattare.

    [crowd screaming] Al tramonto dalla piazza arrivano le prime grida. [tense] Poco dopo dal fondo della strada sbuca un cinghiale alto al garrese quanto un uomo, con la pelle nera e lucida. Sotto la cotenna gli pulsano vene color acciaio, e [steam hissing] dal muso esce un sibilo di vapore. In sella c'è un orco più grosso di tutti quelli che hai mai visto, e dietro di lui vengono tre gregari a piedi che cantano.

    Davanti al cinghiale corre un uomo ben vestito, con un mantello di velluto e un cane da caccia alle calcagna. [somber] Il cane si volta e affronta la bestia, ma resiste poco. I gregari gridano di gioia quando smette di muoversi, e l'uomo inciampa a due passi dal tuo banco. [wry] L'occhio ti va per abitudine alla fibbia d'argento del suo mantello prima che alla faccia, e subito dopo ti si chiude lo stomaco. [whispers] [thoughtful] Uno così, se lo salvi, se lo ricorda. Sotto il bancone tieni la cassa con l'incasso della giornata.
  prologo-mercante-dei-ponti__1-successo: |
    [tense] Aspetti che il cinghiale abbassi il muso sul cane, poi afferri l'uomo per il bavero e lo trascini sotto il bancone, fra i sacchi. La bestia passa così vicino che il vapore ti bagna la nuca, e lo senti raffreddarsi sulla pelle mentre i gregari frugano la strada. Continuano finché le guardie della porta arrivano di corsa e l'orco li richiama con un grido.

    [exhales] L'uomo ti stringe il polso con tutte e due le mani. [trembling] “Corin Ashdale, della Gilda” dice. “Alloggio al Grifone di Ferro finché non riparto per Laresh.” Poi ti guarda a lungo in faccia prima di lasciarti il polso.
  prologo-mercante-dei-ponti__1-fallimento: |
    [wry] Esci da dietro il banco nel momento sbagliato. [pained] Il cinghiale scarta di lato e ti prende di striscio con il fianco corazzato, e finisci contro il palo della tenda.

    [groans] Quando riesci a rialzarti le guardie della porta sono già addosso ai gregari. [bitter] L'uomo ben vestito si è trascinato da solo dietro un barile di scolo senza vederti, e il livido sul fianco ti dura una settimana.
  prologo-mercante-dei-ponti__2-successo: |
    [quickly] Squarci due sacchi con il pugnale e li rovesci davanti al banco. Il cinghiale frena sugli zoccoli e affonda il muso nelle castagne, [amused] e per quanto l'orco lo prenda a calci nei fianchi non vuole più saperne di andare avanti.

    L'uomo ben vestito ne approfitta per strisciare dietro un barile di scolo, senza vedere chi l'ha aiutato. L'orco bestemmia nella sua lingua, e la bestia continua a mangiare finché dei due sacchi non resta niente. [wry] Da dietro il banco ti sorprendi a calcolare a prezzo di festa quanto ti costa ogni boccone.
  prologo-mercante-dei-ponti__2-fallimento: |
    [tense] Fai in tempo a squarciare un sacco solo. Il cinghiale fiuta le castagne ancora dentro il banco e ci si butta con tutto il peso. [wood crashing] Il bancone si rovescia e la tenda ti crolla addosso, con il palo in testa.

    [groans] Quando esci dalla tela le guardie della porta hanno già circondato i gregari, e l'uomo ben vestito è sparito. [bitter] Del banco restano due assi e un sacco calpestato.
  prologo-mercante-dei-ponti__3-esito: |
    [tense] Ti butti a terra con la cassa stretta al petto e resti lì, fra i sacchi, mentre il cinghiale ti passa accanto. Da sotto il bancone vedi i gregari che circondano l'uomo ben vestito, e poi le guardie della porta che arrivano di corsa con le lance basse.

    [eerie] Per ultime vedi tre figure di metallo che calano dai tetti vicini, lente come ragni. Stringi la cassa finché gli spigoli non ti entrano nelle costole, e aspetti che tutto finisca. [quietly] Dentro c'è l'incasso intero, e nessuno ti ha visto.
  prologo-figlio-del-circolo: |
    [warm] Sei sceso in città per il Festival delle Foglie Alate, perché volevi vedere le farfalle foglia-rossa che nel Bosco di Velthar si raccontano ai bambini. A mezzogiorno Padre Vantes le ha liberate davanti alla cattedrale nuova, e per un'ora ti sei dimenticato di essere lontano dal bosco. Al tramonto sei vicino alla porta nord, dove i carrettieri legano i cavalli per la notte, quando [crowd screaming] dalla piazza arrivano le urla.

    [ominous] Il cinghiale entra dalla strada del Daino Zoppo con un orco in sella. È alto al garrese quanto un uomo e ha la pelle nera e lucida. Sotto la cotenna gli pulsano vene color acciaio, e dal muso esce un sibilo di vapore. [somber] Hai già visto animali toccati dalla Marea Grigia, ma mai così da vicino, e l'odore di ferro caldo e pelo bruciato ti arriva prima del resto, lo stesso della volpe che da bambino hai visto abbattere nel Bosco di Velthar.

    [calm] Al Circolo ti hanno insegnato ad ascoltare una bestia prima di guardarla. Questa ha il respiro spezzato, e a ogni passo scuote la testa come se il metallo nelle vene la bruciasse. [whispers] [tender] Non vuole essere qui più di te. L'orco la sprona con i talloni proprio dove le vene affiorano, e a ogni colpo ti mordi l'interno della guancia. [tense] Dietro di lui un gregario ti ha già visto e ti viene incontro con l'ascia alzata. [horse whinnying] Alle tue spalle i cavalli dei carrettieri tirano le corde e nitriscono, e la folla che fugge dalla piazza passa proprio in mezzo a loro.
  prologo-figlio-del-circolo__1-vittoria: |
    [exhales] Il gregario cade sul selciato e continua a cantare finché ha fiato. Quando ti volti il cinghiale è già in fondo alla strada, e carica verso la porta. Le guardie che sono rimaste indietro ti squadrano a lungo prima di abbassare le lance.

    Uno di loro ti batte una mano sulla spalla e ti chiede come ti chiami. [amused] Glielo dici, e lui lo ripete due volte storpiandolo, poi una terza giusta, e ribatte sulla spalla per fissarlo lì.
  prologo-figlio-del-circolo__1-sconfitta: |
    [pained] Il gregario ti prende con il piatto dell'ascia e ti manda a terra fra le zampe dei cavalli. [exhausted] Resti lì a lungo, con il sapore del sangue in bocca, finché le guardie della porta non lo abbattono con le lance.

    L'ultima cosa che ricordi di quella sera è il sibilo del cinghiale che si allontana verso la porta, con il respiro spezzato, e [softly] il pensiero ostinato che fra voi due quello messo peggio sia lui.
  prologo-figlio-del-circolo__2-successo: |
    [softly] Ti metti fra i cavalli e parli piano, con la voce che al Circolo si usa per i puledri. Uno alla volta smettono di tirare le corde, e la gente in fuga passa senza finire sotto gli zoccoli.

    [thoughtful] Poi guardi il cinghiale, e ti è chiaro che la bestia è sana di mente e soffre. Ogni volta che i talloni dell'orco premono sulle vene di metallo, lei carica. [ominous] Chi l'ha mutata ha trovato il modo di guidarla con il dolore, e tu non l'hai mai visto fare a nessuno.
  prologo-figlio-del-circolo__2-fallimento: |
    [tense] I cavalli sentono l'odore del cinghiale più forte della tua voce. [horse whinnying] Un baio spezza la corda e si impenna, e [pained] il suo zoccolo ti prende alla spalla.

    Quando ti rialzi il cinghiale è già lontano, verso le lance della porta, e la strada è piena di gente che zoppica. Il baio si è fermato contro il muro della porta e trema, con la corda spezzata che gli pende dal collo. [softly] Ti avvicini piano parlandogli a bassa voce, e questa volta si lascia toccare.
  prologo-figlio-del-circolo__3-successo: |
    [tense] Ti butti dietro il carro e incocchi, con le dita che tremano solo finché la corda non è tesa. [arrow whooshing] La prima freccia prende il gregario alla spalla, e la seconda lo raggiunge mentre cerca di strapparsi la prima. Si ferma a metà strada, e le guardie della porta fanno il resto.

    Provi un tiro anche sull'orco in sella, e [metal clanging] la freccia rimbalza sulla corazza del cinghiale. [satisfied] Le guardie ti hanno visto tirare, e dopo la battaglia una di loro viene a chiederti dove hai imparato.
  prologo-figlio-del-circolo__3-fallimento: |
    [tense] Le frecce vanno larghe, perché la gente in fuga ti passa davanti a ogni tiro. Il gregario ti raggiunge dietro il carro e fai appena in tempo a parare con l'arco. [bowstring snaps] La corda si spezza, e [pained] l'ascia ti apre il braccio.

    [breathing heavily] Ti salva una guardia della porta, che lo trafigge con la lancia e prosegue verso la strada senza fermarsi.
  prologo-fuggiasco-di-ghoran: |
    Sei in piazza davanti alla cattedrale nuova del Velo, in mezzo alla gente che aspetta la preghiera del tramonto. [wry] Il pranzo l'hanno offerto le taverne, e tu hai mangiato due volte cambiando fila. Un pezzo di pane te lo sei messo in tasca per dopo. Quando Padre Vantes sale sul palco la folla si zittisce. [woman screaming] Poi una donna grida, e da sud si alza il fumo del carro del combustibile per il falò, che qualcuno ha dato alle fiamme.

    [ominous] Gli orchi entrano in piazza correndo, e dietro di loro arriva quello col tamburo. [war drum beating] Ha una pelle di bestia tesa sul petto e batte il tempo con il pomo della mazza, mentre gli altri cantano. [somber] A Ghoran gli orchi dei recinti cantavano così prima delle punizioni, con un verso lungo e uno corto, e tu avevi imparato presto a riconoscere quel ritmo. La schiena ci arriva prima di te, e ti ritrovi con le spalle curve e gli occhi bassi come quando passavano i sorveglianti. [whispers] [trembling] Sei a Qir-Azel, adesso. [slowly] Tiri su la testa a fatica, e guardi il tamburo.

    Della litania capisci poco. [uneasy] Una parola però la conosci, perché a Ghoran i sorveglianti la usavano per la Marea Grigia, e questi orchi la gridano come un invito.

    [tense] Intorno a te la gente scappa verso i vicoli. Padre Vantes è sceso dal palco e si china su un ferito senza badare agli orchi. Tre dei più giovani, poco più che ragazzi, girano attorno al tamburo in attesa di un ordine.
  prologo-fuggiasco-di-ghoran__1-vittoria: |
    [wood splintering] L'orco cade in ginocchio sopra il suo tamburo e lo sfonda con il proprio peso. [eerie] Finché ha fiato continua a cantare, e da vicino senti la litania intera, con la parola della Marea che torna a ogni verso.

    [exhales] Intorno a te gli orchi più giovani perdono il ritmo e si sbandano. Un sergente della guardia ti guarda le mani sporche e non ti chiede da dove vieni.
  prologo-fuggiasco-di-ghoran__1-sconfitta: |
    [pained] Il pomo della mazza ti prende alla tempia e ti ritrovi a terra, con la guancia sulle pietre della piazza. L'orco ti scavalca senza guardarti e [drum beating] riprende a battere.

    [tired] Resti giù ad ascoltare, perché non riesci a fare altro, e la litania ti entra in testa verso dopo verso. [ominous] Quando le guardie lo abbattono la sai quasi a memoria, e sai anche che a Ghoran quel ritmo non l'hai mai sentito cantare in piazza.
  prologo-fuggiasco-di-ghoran__2-successo: |
    [determined] Ti pianti davanti al prete a gambe larghe. Il primo orco ti arriva addosso con la spalla e rimbalza. Il secondo ti apre un taglio sull'avambraccio, e tu resti dove sei finché le guardie non li prendono alle spalle.

    Padre Vantes non ha smesso un momento di curare il suo ferito. [wry] Quando alza gli occhi ti ringrazia con il tuo nome, che gli hai detto tu a metà battaglia senza accorgertene. [uneasy] Intanto la litania ti è rimasta nelle orecchie.
  prologo-fuggiasco-di-ghoran__2-fallimento: |
    [pained] Il primo orco ti travolge e ti ritrovi a terra accanto al ferito del prete. Padre Vantes ti afferra sotto le ascelle e ti trascina dietro il palco.

    [breathing heavily] Resti lì fino alla fine, con la testa che gira e l'odore di resina delle assi nel naso, [ominous] mentre dall'altra parte delle assi la litania continua a tornare sulla parola della Marea.
  prologo-fuggiasco-di-ghoran__3-successo: |
    [inhales deeply] Riempi il petto e gridi le poche parole che ricordi dai recinti di Ghoran, quelle che i sorveglianti usavano per mandare via i cani. [relieved] I tre ragazzi si voltano verso di te, poi verso il tamburo, e alla fine scappano verso il crinale.

    [somber] Più tardi senti dire che alcuni orchi, braccati sull'orlo, si sono buttati dalla rupe. Ti chiedi se fossero loro, e la domanda ti tiene sveglio più della litania, che intanto ti ricordi quasi tutta.
  prologo-fuggiasco-di-ghoran__3-fallimento: |
    La voce ti si rompe sulla seconda parola. [bitter] I ragazzi ti riconoscono per quello che sei, uno scappato dai recinti, e ridono. [pained] Il più grosso ti colpisce al fianco con il manico dell'ascia e torna a cantare con gli altri.

    [breathing heavily] Dal selciato ascolti la litania fino alla fine, con il fianco che ti manda una fitta a ogni respiro, e la parola della Marea ti resta addosso per tutta la notte.
  prologo-allievo-di-torvessa: |
    L'Accademia ha montato il suo banco sul lato della piazza che guarda la cattedrale nuova, sotto una tenda grigia con il sigillo del cerchio incompleto. Sul panno sono allineati sei cristalli conduttori, ognuno sul suo supporto di ottone, e tu hai passato la giornata a spiegare ai curiosi come si accendono. [wry] Orvald Temmerin siede su uno sgabello a leggere, e gira le pagine con la punta di un coltello da frutta che nessuno gli ha mai visto usare per la frutta. Sul palo della tenda il suo corvo, Pett, si liscia le penne senza badare ai curiosi.

    [crowd screaming] Al tramonto dalla piazza arrivano le urla, e gli orchi entrano correndo da sud. [calm] Temmerin chiude il libro con il coltello dentro, per non perdere il segno, e ti dice di restare dietro il banco nel tono che usa in aula per chiedere silenzio. Due studenti del primo anno, che ti hanno aiutato a portare le casse, si sono infilati sotto il tavolo.

    [crystal humming] Poi i cristalli vibrano tutti insieme. [eerie] Li senti nei denti prima che nelle orecchie, una nota breve che si ripete. Sono stati tagliati in anni diversi da mani diverse, e niente dovrebbe farli rispondere nello stesso momento. [whispers] [uneasy] Qualcuno li sta chiamando tutti e sei insieme. Temmerin li fissa con la fronte aggrottata.

    [ominous] Un attimo dopo, verso nord, sopra i tetti che scendono alla porta, si muove qualcosa di metallo. Sono tre sagome che calano dalle grondaie lente come ragni, troppo lontane per distinguerle bene, e spariscono dietro i comignoli tutte e tre nello stesso momento. [tense] Intanto un orco col viso dipinto sta già correndo verso il vostro banco.
  prologo-allievo-di-torvessa__1-vittoria: |
    [exhales] L'orco crolla davanti al banco, e il panno si sporca di sangue proprio sotto i cristalli. Pett scende dal palo, gli gira intorno due volte e torna su.

    Temmerin ti guarda le mani, che ancora formicolano per il Dardo. [deadpan] “Il secondo era più preciso del primo” dice, e si volta verso i tetti della porta nord, dove sono sparite le macchine.
  prologo-allievo-di-torvessa__1-sconfitta: |
    [tense] Il Dardo lo prende di striscio e l'orco ti arriva addosso ridendo. [pained] Finisci a terra con il banco rovesciato sopra le gambe, fra i cristalli sparsi sul selciato.

    [groans] Quando riapri gli occhi l'orco è morto e Temmerin sta raccogliendo i cristalli uno per uno, contandoli ad alta voce, e quando arriva a quattro ricomincia da capo, come se il numero potesse cambiare. [short pause] Ne mancano due. [bitter] Li cerchi fra le gambe della gente in fuga, con Pett che saltella sul selciato accanto a te, e non li ritrovate.
  prologo-allievo-di-torvessa__2-successo: |
    [curious] Metti due dita sul cristallo più vicino e conti. [slowly] Sono due impulsi brevi e uno lungo, ripetuti tre volte, sempre uguali. È un segnale mandato da un cristallo agli altri, come quelli con cui i Raschiatori si chiamano da una piattaforma all'altra, soltanto molto più forte. I cristalli del banco l'hanno raccolto per caso.

    Lo dici a Temmerin, e lui scrive la sequenza sul retro di un listino, [wry] proprio dietro la riga “cristallo piccolo, dimostrazione gratuita”. [quietly] “Per adesso tienilo per te” dice. [ominous] Verso nord, oltre i tetti, le macchine si sono già messe in cammino.
  prologo-allievo-di-torvessa__2-fallimento: |
    Stringi il cristallo più vicino per sentire meglio la vibrazione, e [glass cracking] quello si incrina fra le tue dita. [pained] La scheggia ti apre il palmo.

    [quietly] Temmerin ti fascia la mano con il fazzoletto senza dire niente. [resigned] Il segnale è già finito, e le macchine sono sparite verso la porta nord. Del cristallo incrinato resta un moncone opaco sul supporto di ottone, che il preside mette in tasca prima di guardare i tetti.
  prologo-allievo-di-torvessa__3-esito: |
    [urgent] Avvolgi i cristalli nel panno e li chiudi nella cassa, poi tiri fuori i due ragazzi da sotto il tavolo e li porti di corsa sotto il portico della cattedrale, dove un diacono tiene aperta una porta laterale.

    [calm] Da lì guardi la piazza. Temmerin è rimasto al banco con Pett sulla spalla, e quando un orco si avvicina alza appena una mano, con lo stesso gesto con cui a lezione ti fa segno di sederti. [short pause] L'orco cade, e il preside torna a guardare i tetti.
