# Regia del doppiaggio: La Dama d'Argento
regia:
  sorriso-di-marko: |
    [tense] Adesso sai che Rennick non è partito per Laresh, e che Marko ti ha mentito sapendolo.

    [low mechanical humming] Al calar della sera la Segheria rallenta ma non si ferma. Il cristallo ronza anche quando le lame sono ferme, e i vicini se ne lamentano ogni sera dietro le persiane chiuse. Poco dopo il cambio degli uomini al cancello, Marko Thessel esce dall'ingresso laterale. [wry] Si è cambiato la camicia, come fa sempre a fine turno, e si è pettinato. Saluta con due dita gli uomini in livrea senza guardarli e si incammina.

    Non va verso casa, e nemmeno verso la Pignatta, dove un uomo come lui andrebbe a farsi vedere. [mysterious] Scende invece verso il margine dell'Orlo, dove i lastroni di pietra blu sono scheggiati e le lanterne illuminano la strada a chiazze. [quietly] Cammina svelto, da uomo che conosce la strada e preferisce non farsi notare, e i tuoi piedi hanno già preso il suo passo.

    [thoughtful] Puoi seguirlo, oppure tornare al cancello della Segheria. La donna che spazza la segatura a fine giornata sa di tutti più di quanto dica, e un creditore arrabbiato non sarebbe il primo che vede questa settimana.
  sorriso-di-marko__1-successo: |
    [tense] Lo segui per venti minuti oltre il margine dell'Orlo e poi su per Via dei Rasoi, una strada che non va mai dritta. A un certo punto fa un gomito ad angolo retto attorno a un vecchio cristallo conduttore spento, una scheggia opaca alta come due uomini.

    Tre porte dopo il cristallo, all'angolo con Via del Salmone, Marko si ferma davanti a una casa di legno di tre piani con le tende chiuse e nessuna insegna. [mysterious] Sulla porta scura è incisa una luna crescente, e accanto pende una catena di bronzo. [distant bell ringing] Marko la tira. La porta si apre di una spanna e sulla soglia compare una halfling con i capelli raccolti. [quietly] Si parlano poco. Lui indica il primo piano con il mento, lei scuote la testa una volta sola, e Marko se ne va senza entrare, più in fretta di come è venuto.

    Alzi gli occhi verso il primo piano e vedi una tenda che si richiude. [pause] [satisfied] Rennick Dole è lì dentro.
  sorriso-di-marko__1-fallimento: |
    [tense] Al terzo angolo Marko si ferma davanti a una vetrina vuota, e nel vetro scuro incontra i tuoi occhi, e il sudore ti si raffredda di colpo sulla nuca. Si volta e ti sorride, con lo stesso sorriso che riserva ai mercanti di Laresh quando il prezzo non gli piace.

    Poi riprende a camminare verso la Pignatta, senza fretta. [bitter] Domani mezza Segheria saprà che lo stavi seguendo, e l'altra metà lo saprà dopodomani.
  sorriso-di-marko__2-successo: |
    [wry] La portinaia è una donna larga e stanca, con una scopa di saggina e un'opinione su tutto. Le racconti di un debito con tanto di spiccioli, una cifra che nessuno si inventerebbe, e lei sbuffa prima ancora che tu abbia finito.

    [laughs bitterly] Poi ride senza allegria e scuote la testa: [scoffs] “Rennick? Debiti? Quello conta i chiodi. Non ha mai offerto un bicchiere in vita sua.” Abbassa la voce e si guarda intorno prima di continuare: [under breath] “Se ti deve dei soldi, chiedili alla Maison des Lunes, in Via dei Rasoi. È l'unico posto dove li spende. E ci va più spesso di quanto dovrebbe uno che si deve sposare.”

    [amused] Subito dopo si morde la lingua, e la vedi farlo davvero. Riprende a spazzare con forza, come se la segatura le avesse fatto un torto. Tu ringrazi e ti allontani prima che si penta del tutto.
  sorriso-di-marko__2-fallimento: |
    La storia non la convince. Ti ascolta con la scopa ferma e alla fine dice soltanto: [deadpan] “Rennick non deve soldi a nessuno. È l'unico suo difetto che non sia un vizio.”

    [tense] Poi chiama per nome uno degli uomini al cancello. Te ne vai prima che arrivi, ma prima di sera la tua faccia e la storia che ci hai messo sopra hanno fatto il giro della Segheria, [bitter] e prima di notte quello della Pignatta.
  sorriso-di-marko__3-successo: |
    [metal clanging] Uno degli spazzini autorizzati sta legando un fascio di tubi con il fil di ferro. Gli dai una mano a stringere il nodo e lui continua a lavorare mentre parla. [curious] Secondo lui l'uomo pettinato della Segheria passa di qui quasi ogni sera e sale per Via dei Rasoi fino al cristallo spento, poi gira l'angolo verso la casa con la luna sulla porta. Stasera l'ha visto tornare indietro dopo pochi minuti, senza essere entrato.

    Lo spazzino sputa nella polvere e indica con il mento la salita di Via dei Rasoi. [gruff] “Per di là, sempre per di là” dice, e torna al suo fil di ferro.
  sorriso-di-marko__3-fallimento: |
    [uneasy] Gli spazzini ti guardano come guardano la merce che arriva dai Raschiatori, per capire quanto pesa. [coldly] Uno ti chiede chi ti manda, e quando non gli rispondi torna a separare il ferro dal rame. [tense] Il capo della squadra ti segue con lo sguardo finché non esci dall'Orlo.
  sorriso-di-marko__4-esito: |
    [amused] Il ragazzino ha le ginocchia sbucciate e un berretto troppo grande. Conta le monete due volte, le infila nel berretto e sparisce dietro Marko prima che tu abbia finito di spiegargli cosa vuoi.

    [quickly] Torna quando le lanterne sono già accese e ti racconta tutto d'un fiato. Marko è salito per Via dei Rasoi, ha tirato la catena di una casa con la luna incisa sulla porta e ha parlato con la portinaia senza entrare. [mysterious] Mentre scendeva, al primo piano si è mossa una tenda.
  sorriso-di-marko__5-successo: |
    [tense] Lo segui per venti minuti oltre il margine dell'Orlo e poi su per Via dei Rasoi, e a metà salita i tuoi piedi hanno capito dove state andando prima di te. Marko gira attorno al cristallo spento e conta tre porte, fino alla Maison des Lunes. [distant bell ringing] Tira la catena di bronzo della porta sulla strada, quella dei clienti. [wry] Tu entri sempre dal cortile di Via del Salmone, e quel campanello l'hai sentito suonare soltanto dalla cucina.

    La porta si apre di una spanna e sulla soglia compare Sara Beck, con il fermaglio d'argento nei capelli. [quietly] Si parlano poco. Lui indica il primo piano con il mento, lei scuote la testa una volta sola, e Marko se ne va senza entrare, più in fretta di come è venuto. [uneasy] Prima di richiudere Sara guarda verso l'angolo dove ti sei fermato, e se ti ha riconosciuto non lo dà a vedere.

    Alzi gli occhi verso il primo piano e vedi una tenda che si richiude. [pause] Rennick Dole è lì dentro, qualche metro sopra la cucina dove Gretchen fa i conti la sera.
  sorriso-di-marko__5-fallimento: |
    [tense] Al terzo angolo Marko si ferma davanti a una vetrina vuota, e nel vetro scuro incontra i tuoi occhi, e il sudore ti si raffredda di colpo sulla nuca. Si volta e ti sorride, con lo stesso sorriso che riserva ai mercanti di Laresh quando il prezzo non gli piace.

    Poi riprende a camminare verso la Pignatta, senza fretta. [bitter] Domani mezza Segheria saprà che lo stavi seguendo, e l'altra metà lo saprà dopodomani.
  luna-crescente: |
    [mysterious] Via dei Rasoi non va mai dritta. Fa un gomito ad angolo retto attorno a un vecchio cristallo conduttore esaurito, e in Città Bassa lo usano per orientarsi. Quando qualcuno dice “tre porte dopo il cristallo spento”, tutti sanno di quale porta si parla.

    Tre porte dopo il cristallo, all'angolo con Via del Salmone, c'è una casa di legno di tre piani con le tende chiuse e nessuna insegna. [softly] Al centro della porta scura è incisa una luna crescente, così sottile che si vede solo quando la luce la prende di taglio. Accanto pende una catena di bronzo con due parole incise, Ospiti Benvenuti.

    Sopra la porta c'è una lanterna a olio, e stasera è accesa. [wry] In Città Bassa tutti conoscono la regola, anche quelli che giurano di non esserci mai stati. [ominous] Quando la lanterna è accesa le ragazze ricevono, mentre una lanterna spenta vuol dire che dentro è successo un guaio.

    [woman laughing softly] Da dietro le tende arrivano una conversazione a bassa voce e una risata di donna, ma nessuna musica. Alla Maison des Lunes non si suona mai. [eerie] Pare che la padrona lo voglia così, perché la musica copre cose che è meglio sentire.

    [quietly] Se quello che hai scoperto è vero, Rennick Dole è lì dentro, e ti viene da abbassare la voce anche se non stai parlando con nessuno.
  luna-crescente__1-esito: |
    [distant bell ringing] Il campanello suona lontano oltre le tende. Dopo due secondi esatti la porta si apre.

    Sulla soglia c'è una halfling piccola, con gli occhi attenti e i capelli raccolti da un fermaglio d'argento. [wry] Ti squadra dalla testa ai piedi con una cortesia rapida, e la tua schiena si raddrizza da sola. Hai l'impressione che non dimenticherà la tua faccia. [ominous] Alle sue spalle, dietro una tenda di velluto, si sposta di un dito un'ombra alta e larga il doppio di una persona.

    [coldly] “Buonasera, sono Sara Beck. La Maison non riceve chi non ha appuntamento.” Poi ti guarda meglio, soffermandosi sugli stivali, che stasera hanno fatto parecchia strada, e aggiunge: [curious] “Però. Forse sei tu l'appuntamento che qualcuno aspetta.”

    Si fa da parte e ti lascia entrare. Dietro di lei ci sono un bancone curvo e un armadio chiuso a chiave, e lei lo indica con un sorriso vero quanto basta: [slyly] “Le armi qui dentro. Il sorriso lo porti dove ti pare.”
  luna-crescente__2-esito: |
    [distant bell ringing] Il campanello suona lontano oltre le tende. Dopo due secondi esatti la porta si apre, e Sara Beck ti guarda dal basso, con il fermaglio d'argento nei capelli e la testa un po' inclinata, [wry] come davanti a un nome scritto nella colonna sbagliata della lavagnetta.

    [deadpan] “Dalla porta davanti, e senza avvisare” dice. Poi guarda meglio gli stivali, che stasera hanno fatto parecchia strada, e smette di sorridere. [quietly] “Però. Forse sei tu l'appuntamento che qualcuno aspetta.”

    [ominous] Dietro la tenda di velluto alle sue spalle si sposta di un dito un'ombra grande il doppio di una persona, poi torna ferma. Sara si fa da parte e ti lascia entrare. Indica l'armadio chiuso a chiave dietro il bancone curvo, quello dove la sera appende il grembiule. [coldly] “Le armi qui dentro, anche le tue. Stasera sei un cliente.”
