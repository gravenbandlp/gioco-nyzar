# Regia del doppiaggio: Acciaio e Ira
regia:
  liaren-nella-cella: |
    [ominous] La scala della sala di carico scende in un magazzino basso, dove un tempo tenevano la sabbia. Due carriole sono appoggiate al muro. Accanto alle scale un muro di mattoni è stato abbattuto a colpi di mazza, e dal buco esce un'aria fredda che sa di terra.

    In fondo al magazzino c'è una porta chiusa a chiave. La chiave è appesa a un chiodo lì accanto, dove la terrebbe un magazziniere, sotto una lavagnetta con l'inventario scritto col gesso. [uneasy] Ci si legge ancora sbarre, quaranta, e il resto l'ha cancellato una manica.

    [somber] Dentro, la stanza è stata svuotata e trasformata in una cella. Liaren è stesa sul pavimento su un fianco. Le hanno legato con la corda i polsi e le caviglie, e i tatuaggi delle braccia sono grigi di polvere. Ha gli occhi bendati e la bocca chiusa da una cinghia di cuoio. Ha un taglio sopra l'occhio e il labbro gonfio, e la camicia è rigida di sangue sul fianco sinistro.

    [urgent] Ti inginocchi accanto a lei e tagli le corde, e le dita sbagliano il nodo due volte. Le togli la benda e la cinghia. [whispers] [fearful] Respira, almeno respira. [relieved] Il polso sotto le tue dita è debole ma regolare, e la pelle è fredda.
  liaren-nella-cella__1-successo: |
    [calm] Le pulisci il taglio con l'acqua della borraccia e lo chiudi con una striscia della tua camicia, stretta, mentre lei geme senza svegliarsi. Poi le sollevi la testa e le bagni le labbra. [gasps] Liaren apre gli occhi di colpo, e con l'energia che le hai visto al Grifone si tira su a sedere da sola. Si tiene il fianco e si guarda intorno, e alla fine guarda te.

    [hoarse] “Portami fuori da qui” dice, e ti stringe il braccio con tutte e due le mani.
  liaren-nella-cella__1-fallimento: |
    [tense] Il taglio è più profondo di quanto credevi, e quando stringi la fascia il sangue ricomincia a uscire. Ci metti troppo a fermarlo, con le mani che scivolano. [groans] Liaren si sveglia a metà con un gemito e ti afferra il polso con una forza che non ti aspettavi.

    [through gritted teeth] “Lascia stare. Portami fuori, e il resto me lo ricuce Brunella” dice fra i denti, senza mollarti il polso.
  liaren-nella-cella__2-successo: |
    [solemn] Appoggi le mani sul fianco di Liaren e dici le parole della Liturgia, e senti la ferita stringersi sotto i palmi. [relieved] Il colore le torna in faccia un poco alla volta. Apre gli occhi e si tira su a sedere, con una mano sul fianco dove la pelle è nuova e tirata.

    [wry] “Questa me la segni sul conto” dice, aggrappandosi alla tua spalla per alzarsi, “e adesso portami fuori.”
  liaren-nella-cella__2-fallimento: |
    [tense] A metà della formula la voce ti si incrina, e la ferita si chiude solo in superficie, storta, lasciandoti nelle mani un freddo che sale fino ai gomiti. [gasps] Liaren si sveglia con un sussulto e si piega in avanti.

    [fearful] “Che cosa mi hai fatto?” chiede, ma prima che tu risponda scuote la testa e ti tende la mano perché la tiri su.
  liaren-nella-cella__3-esito: |
    Le giri le bende intorno al fianco per due volte, poi per una terza, finché il sangue smette di passare. Le bagni le labbra con la borraccia. [tender] Liaren apre gli occhi e li richiude subito. Quando li riapre ti guarda come se dovesse metterti a fuoco da lontano.

    [weakly] “Sei tu. Allora sono ancora viva. Tirami su, che qui dentro puzza” dice con un filo di voce, cercando il tuo braccio con la mano.
  liaren-nella-cella__4-esito: |
    Le sollevi la testa e le versi il tonico fra le labbra, poco alla volta, perché non le vada di traverso. [coughs] Al terzo sorso tossisce e apre gli occhi. [relieved] Il colore le torna in faccia, e la mano le va da sola al fianco.

    [hoarse] “Sa di piedi. Grazie lo stesso, e adesso portami fuori da questa stanza” dice con la voce arrochita, pulendosi la bocca con il polso.
  liaren-nella-cella__5-esito: |
    [breathing heavily] Te la carichi sulle spalle come un sacco di grano e sali la scala un gradino alla volta, con le cosce che bruciano. Attraversi la sala di carico e i corridoi, e lei non si sveglia nemmeno quando le sbatti la testa contro uno stipite. [wry] Fuori la metti a sedere sul gradino della porta delle consegne. L'aria della strada la sveglia, e la prima cosa che fa è vomitarti sugli stivali.
  liaren-nella-cella__6-esito: |
    [calm] Le mani lavorano prima che tu ci pensi, come nella tenda sotto il palco la sera della razzia. Lavi il taglio con l'acqua della borraccia, stringi una striscia di stoffa sopra il fianco e premi finché il sangue non rallenta, contando i respiri di Liaren invece dei tuoi. [softly] Vantes dice che ai feriti bisogna parlare anche quando dormono, e allora le parli piano. Le dici dov'è, e chi sei.

    [relieved] Liaren apre gli occhi alla terza volta che dici il suo nome, e si tira su a sedere da sola tenendosi il fianco. [hoarse] “Portami fuori da qui” dice, e ti stringe il braccio con tutte e due le mani.
  liaren-sul-gradino: |
    [tired] Liaren si siede sul gradino della porta delle consegne, con la schiena contro lo stipite e una mano premuta sul fianco sinistro, e per un po' si limita a respirare. [cart wheels on cobblestones] In strada passa un carretto di cavoli. Il carrettiere alza gli occhi alla ciminiera che fuma, poi guarda voi due e tira dritto. Mandi di corsa alla Caserma un ragazzino che gioca con un cerchio, e gli prometti uno spicciolo per quando torna.

    [bitter] “Mi ha raccontato tutto lui, di nostro padre” dice Liaren. “Con tutti i particolari, come se mi leggesse una lettera. L'ultima cosa che quel vecchio mi ha detto è che per lui ero morta.” Si passa il dorso della mano sulla bocca. “Isvaro dice che lui e gli altri li guida Aurenne, la sua amata, che ha grandi progetti per Qir-Azel. Mi ha detto di non farmi trovare in città quando cominciano. [angry] Poi quel coglione ha avuto la faccia di chiedermi se volevo unirmi a quelli di Capomozzo.”

    Resta zitta a guardare la strada, con la mascella stretta.

    “Gli ho tirato un pugno nello stomaco. Non credevo che arrivasse così in basso, e lui ha chiamato i suoi orchi. Il resto lo hai visto.” Poi alza gli occhi su di te, e la voce le si fa piatta. [pause] [deadpan] “L'hai ucciso?”
  liaren-sul-gradino__1-esito: |
    Le dici che è scappato con i suoi orchi, dal muro abbattuto accanto alla scala. [resigned] Liaren annuisce piano, come se se lo aspettasse.

    [wry] “Da ragazzo scappava anche dalle lezioni di scherma” dice. “Poi la sera tornava e diceva che il maestro era un bifolco.” [laughs softly] Ride, e la risata le fa male al fianco.

    Vuole tornare al Grifone a piedi, e non c'è verso di farle cambiare idea. All'imbocco del Ponte del Pesce ti toglie il braccio dalle spalle. [determined] “Da qui ci arrivo da sola. Brunella mi deve veder entrare sulle mie gambe.” [tender] La guardi salire verso i Ponti fermandosi a ogni lanterna, finché la strada gira.
  liaren-sul-gradino__2-esito: |
    Le dici che Isvaro è di sopra, legato a un'incudine con le cinghie di un mantice. [thoughtful] Liaren guarda la porta per un pezzo, e vedi che sta pesando se ha le forze per le scale.

    [coldly] “Il secondo pugno glielo do quando sto in piedi” dice alla fine. “Dallo alla Caserma, e che lo chiudano dove non può scrivere lettere.”

    La ronda arriva poco dopo. [wry] Sono due guardie e un sergente con il fiatone, e quando vede la sala della fornace il sergente si siede su una cassa. [somber] Isvaro lo segue in silenzio, a testa alta. Liaren vuole tornare al Grifone a piedi, e all'imbocco del Ponte del Pesce ti toglie il braccio dalle spalle e sale da sola, fermandosi a ogni lanterna.
  liaren-sul-gradino__3-esito: |
    [somber] Le dici che è caduto dalla scala dei magazzini mentre scappava, e che sotto il telo in fondo alla scala c'era lui. Liaren guarda la strada, poi si guarda le mani e le gira piano, come se dovesse riconoscerle.

    [sorrowful] “Gli portavo le pesche all'Accademia. Le sbucciava con il coltello, tutte in un pezzo solo, e la buccia la lasciava a me” dice, senza smettere di guardarsi le mani.

    Vuole tornare al Grifone a piedi, e all'imbocco del Ponte del Pesce ti toglie il braccio dalle spalle. [quietly] “Da qui ci arrivo da sola” dice, e la guardi salire verso i Ponti con la mano sul fianco, fermandosi a ogni lanterna, finché la strada gira.
  la-vasca-asciutta: |
    [eerie] Il fondo della vasca triangolare è una crosta arancione che si sbriciola sotto le dita, tiepida come la cenere del giorno prima, e del sangue che ci è colato dentro in tutti questi giorni, e di qualunque cosa ci sia caduta, non resta traccia. La luce sul soffitto si è spenta, e senza quella l'Aula dell'Ira torna a essere una cantina enorme e fredda, con una fila di teschi in bilico che nessuno guarda più.

    [thoughtful] Il pozzo è vuoto ma intero. Sul bordo, sotto la crosta, le incisioni a sette punte sono ancora nette, e quando ci passi sopra il pollice senti un formicolio leggero, quello di una gamba addormentata. [resigned] Per chiuderlo davvero servono l'acqua benedetta e qualcuno del Velo che sappia cosa farne.
  la-vasca-asciutta__1-esito: |
    [tired] Risali la galleria senza fretta, con la lanterna che sbatte contro il fianco. [relieved] Quando esci dalla porta delle consegne dell'Acciaieria in Città Bassa è sera, e l'aria della strada sa di cavolo bollito e di pioggia, e ti fermi un momento sul gradino a respirarla.
  il-pozzo-prosciugato: |
    [calm] Padre Aurelio Vantes ti riceve in sagrestia fra due armadi di paramenti, con un accolito che finge di contare le candele in un angolo. Ti ascolta senza interromperti. Gli racconti dell'Aula dell'Ira e della vasca triangolare, e a metà racconto ti posa due dita sul polso e le lascia lì fino alla fine, leggere. [softly] Ti accorgi di parlare più piano.

    [long pause] Quando hai finito resta zitto a lungo. Poi si alza, ti chiede di aspettare e scende nella Cripta. Torna dopo il tempo di un vespro con un foglio piegato in quattro, scritto in una grafia sottile che non è la sua. [mysterious] In cima al foglio c'è scritto Pozzo dei Sigilli.

    [solemn] “La Madre dice che quando è vuota una vasca così si rompe con l'acqua benedetta” spiega. “Va riempita fino all'orlo e fatta bollire per un giorno intero, senza che il fuoco cali mai. La pietra a un certo punto cede.” Rilegge il foglio, come per assicurarsi di averlo capito bene. [somber] “Un demone sotto la Città Bassa, da prima che ci fosse la città. Quando dubiti, tocca, dico ai novizi. [sighs] Stavolta preferirei aver dubitato un po' di più.”

    [whispers] [uneasy] Un giorno intero accanto a quella vasca, al freddo. Ti tornano in mente le mani piccole della Colata, e ti strofini il polso dove Vantes ti ha posato le dita.
  il-pozzo-prosciugato__1-successo: |
    [determined] Il giorno dopo Vantes scende con te insieme a quattro accoliti, e dietro di voi i carretti portano sei barili d'acqua benedetta. Nel tunnel si sporca l'orlo della veste e non ci fa caso. Riempite la vasca a secchi e accendete il carbone tutto intorno, [fire crackling] e per un giorno intero vi date il cambio a tenere alto il fuoco mentre lui prega a voce bassa, senza mai sedersi.

    [stone cracking] All'alba del giorno dopo la vasca si spacca da un angolo all'altro con un rumore di ghiaccio che cede sul fiume. L'acqua scende nella crepa e sparisce. [relieved] Nell'Aula il gelo se ne va, e Vantes ti stringe il polso più forte del solito.
  il-pozzo-prosciugato__1-fallimento: |
    Vantes ti ascolta, poi scuote la testa con dolcezza. [softly] Dice che la Cattedrale ha bisogno di lui, e che di questi tempi in sagrestia non lo può sostituire nessuno. [wry] Ti manda sei barili d'acqua benedetta e due novizi magri che tremano dal primo passo nel tunnel. [tired] Il fuoco intorno alla vasca lo tieni alto tu, per un giorno intero, mentre loro due pregano accucciati sulla scalinata.

    [stone cracking] All'alba del giorno dopo la vasca si spacca da un angolo all'altro con un rumore di ghiaccio sul fiume, e l'acqua sparisce nella crepa. [exhausted] Risali con le mani nere di carbone e la schiena a pezzi, e sulle scale uno dei novizi ti chiede come ti chiami, per ricordarti nelle preghiere.
  il-pozzo-prosciugato__2-esito: |
    [warm] Non fai in tempo a finire la frase che Vantes ha già chiamato l'accolito dall'angolo per far preparare i carretti. Il giorno dopo scende nel tunnel insieme a te e a quattro accoliti, che spingono i carretti con sei barili d'acqua benedetta. [solemn] Per un giorno intero il fuoco intorno alla vasca non cala mai, e lui prega in piedi senza sedersi.

    [stone cracking] All'alba del giorno dopo la vasca si spacca da un angolo all'altro con un rumore di ghiaccio sul fiume. L'acqua scende nella crepa, e dall'Aula il gelo se ne va. [relieved] Risalendo Vantes ti tiene una mano sulla spalla per tutto il tunnel.
  il-pozzo-prosciugato__3-esito: |
    Vantes accetta l'offerta e ti benedice i barili uno per uno sul sagrato. [wry] I due facchini ti lasciano all'imbocco del tunnel e non vogliono sapere dove porta. [determined] Riempi la vasca a secchi da solo, e per un giorno intero tieni il fuoco alto, mangiando il pane seduto sul carbone per non perdere tempo.

    [stone cracking] All'alba del giorno dopo la vasca si spacca da un angolo all'altro con un rumore di ghiaccio sul fiume, e l'acqua sparisce nella crepa. [exhausted] Risali con le ciglia bruciacchiate e le gambe che non reggono, e ti fermi a dormire contro il muro del magazzino.
  il-pozzo-prosciugato__4-esito: |
    [calm] “Quando dubiti, tocca” gli dici. [tender] È la prima cosa che ti ha insegnato, il giorno che sei entrato in Cattedrale con le scarpe nuove che ti stringevano. Vantes ti guarda a lungo, poi sorride con un angolo della bocca e chiama l'accolito dall'angolo. Prima di sera Ottilia Sanvel ha già fatto preparare i carretti.

    [solemn] Il giorno dopo scendete nel tunnel in sei, con sei barili d'acqua benedetta. Per un giorno intero tu e gli altri accoliti vi date il cambio al fuoco, e Vantes prega in piedi accanto a voi senza mai sedersi. [stone cracking] All'alba la vasca si spacca da un angolo all'altro con un rumore di ghiaccio che cede sul fiume, [relieved] e l'acqua sparisce nella crepa.
  il-diario-di-isvaro: |
    [somber] Liaren passa i giorni dopo l'Acciaieria a letto, nella stanza in fondo al corridoio del Grifone, con il fianco sinistro fasciato stretto e due cuscini dietro la schiena. Si è fatta portare il samisen e non lo suona. Lo tiene sulle ginocchia e gira un pirolo avanti e indietro, senza accordare niente. Brunella ha chiuso la porta a chiave e si è seduta sulla cassapanca con il mestolo in grembo, anche se di zuppa non ce n'è. [muffled laughter from below] Dalle assi del pavimento sale il rumore della sala, con qualcuno che ride troppo forte.

    Sul comodino c'è il diario di Isvaro, rilegato in pelle, due dozzine di pagine piene per metà di mappe di Qir-Azel e per l'altra metà di ritratti di una donna. Le righe scritte sono in elfico, in una calligrafia minuta che pende tutta a destra. [wry] Accanto c'è il mazzo di chiavi di Ondrel, che stamattina la Caserma ha riportato in un sacchetto di tela con sopra scritto a gesso Tarvellin, con due elle. Liaren te le ha messe in mano appena sei entrato, senza guardarle.

    [determined] “L'elfico l'ho imparato a undici anni, per scrivergli all'Accademia” dice Liaren, e allunga la mano verso il diario. “Leggo io, e poi te lo scrivo su un foglio, così non me lo chiedi due volte. Tu tienimi la lampada vicino, e tu, Brunella, non dici niente finché non ho finito.”

    Brunella annuisce e stringe il mestolo con tutte e due le mani. [whispers] [tender] Undici anni, e già scriveva a un fratello che in casa non si poteva nominare. Ti siedi sul bordo del letto con la lampada fra le ginocchia, e il vetro caldo ti scalda le dita.
  il-diario-di-isvaro__1-esito: |
    [thoughtful] Le mappe sono fatte bene, con i ponti contati a uno a uno e la Città Bassa disegnata casa per casa. [ominous] La prima serie mostra piani d'attacco per una banda di quaranta orchi, e una delle pagine è cerchiata due volte. Liaren ci passa sopra il dito. Le frecce partono dall'Acciaieria e salgono fino alla piazza del Festival, vicolo per vicolo, senza passare mai da una strada larga.

    [pause] Le pagine dopo sono per quattrocento orchi. [tense] Nessuna è cerchiata, e molte sono coperte di croci tracciate così forte che il pennino ha bucato la carta. Brunella guarda le croci a lungo, con il mestolo premuto contro le labbra.
  il-diario-di-isvaro__2-esito: |
    [coldly] “La razzia è andata come doveva” legge Liaren. “Abbiamo perso pochi orchi di Capomozzo, e la bara di Sollen l'abbiamo presa senza fatica, mentre i bifolchi guardavano da un'altra parte. Non vedo l'ora del vero assalto. [menacing] Questa città merita di bruciare. Quel bastardo di mio padre l'ho costretto a tacere sull'Acciaieria, che ci serviva come base, altrimenti avrei raccontato a tutti come ha tolto di mezzo la mamma con l'aiuto di Vesh e dei suoi tagliagole. Gli ho fatto sparire anche ogni carta che in città nomini Capomozzo, così abbiamo più tempo.”

    [sorrowful] Arrivata alla mamma la voce le si incrina, e Liaren ricomincia la frase da capo, più piano, come se la prima volta avesse letto male. Brunella si alza dalla cassapanca, va fino alla finestra e torna a sedersi.
  il-diario-di-isvaro__3-esito: |
    [deadpan] “Balthog vuole un assalto in massa, via terra” legge Liaren. “Per me è un errore. Dovremmo farci aiutare dal demone delle Segrete e mandare su i suoi mostri da sotto, per il tunnel dei contrabbandieri che sbuca nell'Acciaieria di mio padre, e poi entrare dal fiume con assalti piccoli e mirati. [sarcastic] Gli altri sono tutti d'accordo tranne Zagrath. Il mezzogre dice di no solo per farmi arrabbiare. La mia adorata Aurenne è troppo presa dai livelli inferiori per decidere. [ominous] Dice che quando avrà liberato il Costruttore lo metterà ai suoi ordini, e allora la prudenza non ci servirà più. Spero che abbia ragione. [mocking] Quell'idiota di Garin crede ancora che serviamo il Culto dell'Anonimo, e Kessa comincia a sospettare qualcosa.”

    [bitter] Liaren alza gli occhi dalla pagina. “Da bambina mio padre mi diceva che sotto l'Acciaieria ci sono soltanto topi” dice.
  il-diario-di-isvaro__4-esito: |
    [quietly] “La mia amata vuole andare fino in fondo” legge Liaren, con la voce che si è fatta più bassa. “Qualunque cosa le dica, resta convinta di essere brutta. Vuole togliersi di dosso quella che chiama la sua corruzione celestiale e metterci la grazia della sua nuova madre, la Regina delle Ali Spezzate. [ominous] Quando ha bruciato i resti di suo padre al santuario di Capomozzo è cominciata la trasformazione, e la sua mano nuova a me piace poco. [disgusted] Spero che quando offrirà Qir-Azel alle fiamme di Nhar'Kael sia meno orrenda. Anche le succubi sono demoni, no?”

    [eerie] Liaren gira pagina e avvicina il diario alla lampada. La donna è disegnata a carboncino come nelle altre, con i capelli lunghi e chiari, ma qui ha due ali da pipistrello che le escono dalle scapole e una mano nera e artigliata posata sul ventre. [pause] In questo ritratto come in tutti gli altri, Isvaro le ha ripassato gli occhi con un inchiostro viola.
  il-diario-di-isvaro__5-esito: |
    Le racconti com'è scappato dalla fornace, e Liaren ti ascolta senza staccare gli occhi dal samisen. [wry] “All'Accademia scappava dalla finestra del dormitorio tutte le settimane” dice dopo un po'. “La sera era sempre di ritorno per cena, perché i ragazzi tornano quando hanno fame. [bitter] Adesso c'è qualcun altro che gli dà da mangiare.” [string creaking] Gira il pirolo finché la corda geme, [tender] e Brunella allunga una mano a fermarle il polso.
  il-diario-di-isvaro__6-esito: |
    Le racconti che Isvaro è ancora chiuso in una cella della Caserma, con le mani legate dietro la schiena, e Liaren annuisce piano a ogni parola. [coldly] “Quando torna, Galdrick proverà a farlo parlare” dice, e si sistema il cuscino dietro la schiena. “Io a trovarlo non ci vado. [bitter] Una volta ci andavo ogni settimana, con il pane dolce di Brunella nel cestino, e lui lo mangiava tutto senza dire grazie.” [somber] Sulla cassapanca, Brunella si guarda le mani.
  il-diario-di-isvaro__7-esito: |
    [somber] Liaren ti chiede se ha detto qualcosa prima di morire, e tu le racconti che si è girato per parlarti, in cima alla scala, e non ha fatto in tempo. Ascolta con gli occhi sul samisen. [sorrowful] “Da piccolo aveva paura del buio” dice alla fine. “All'Accademia i maestri gli spegnevano la candela tutte le sere, e io gli portavo i mozziconi di nascosto.” [string snapping] Poi stringe il pirolo finché la corda si spezza con un suono acuto.
  il-diario-di-isvaro__8-esito: |
    Sali ai Quartieri Alti con il diario sotto la giubba. Padre Vantes ti riceve in sacrestia e legge muovendo le labbra la traduzione che Liaren ti ha scritto su un foglio a parte. [somber] Quando arriva alla Regina delle Ali Spezzate la voce gli si abbassa. Chiama due novizi e gli fa copiare le mappe per tutta la notte, e la mattina dopo ti restituisce il diario legato con un nastro bianco.

    [solemn] “Il Velo pregherà” dice, con la mano sul tuo braccio. “Lei intanto guardi in quel tunnel prima che ci guardi qualcun altro.” [ominous] Le chiavi di Ondrel ce le hai ancora in tasca.
  il-diario-di-isvaro__9-esito: |
    Scendi alla Caserma e chiedi carta e penna al sergente di guardia, che te le dà dopo averti guardato due volte. Scrivi tutto quello che sai, dalle mappe ai nomi, e ti ci vuole un'ora buona. [wry] Il sergente piega il foglio in quattro e lo infila nel cassetto con l'etichetta Galdrick, accanto a una crosta di pane che è lì da prima della razzia.

    [ominous] Il diario lo tieni tu finché lo sceriffo non torna. Le chiavi di Ondrel le hai ancora in tasca, e il tunnel è sempre lì, sotto l'Acciaieria.
  il-diario-di-isvaro__10-esito: |
    [bitter] “Mio padre è morto” dice Liaren. “Se in città si sa di mia madre e di Vesh, domani il Grifone si riempie di gente venuta a guardarmi in faccia.” Chiude il diario e te lo mette in mano. [tired] “Tienilo tu. Io adesso non lo voglio vicino.”

    [clears throat] Brunella si schiarisce la voce dalla cassapanca. [wry] “Adesso posso parlare?” chiede, e senza aspettare risposta scende a prendere la zuppa per tutti e due. [ominous] Le chiavi di Ondrel ce le hai in tasca, e il tunnel dei contrabbandieri è ancora là sotto, oltre il muro abbattuto dei magazzini.
