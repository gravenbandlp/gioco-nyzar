# Regia del doppiaggio: Acciaio e Ira
regia:
  ondrel-al-grifone: |
    [warm] A metà sera il Grifone è pieno fino alle scale. I Raschiatori del turno lungo giocano a dadi su una coperta stesa fra due tavoli, mentre Brunella gira fra le sedie con la pentola della zuppa. [amused] Sopra il bancone, appeso a due chiodi, c'è il mestolo ammaccato che, a sentire i Raschiatori, la mattina del Festival è arrivato sulla testa del padre di Liaren subito dopo un pentolone di stufato, e sul cartellino che ci ha legato Liaren qualcuno ha scritto a carbone non in vendita.

    [door slams] La porta sbatte contro il muro e la sala si zittisce un tavolo alla volta. [tense] Sulla soglia c'è Ondrel Tarvelin, pallido, nelle vesti scure di buon taglio che porta sempre uguali, con un bastone di legno nero dal puntale d'acciaio. Batte il puntale sulle assi prima di parlare. [coldly] “Liaren Tarvelin” dice, come se leggesse il nome da un registro. “Domattina all'alba parte una carrozza per Laresh, e c'è un posto pagato a tuo nome. [short pause] È l'ultima volta che te lo offro.”

    Liaren posa il boccale che stava asciugando. [sarcastic] “Non potevi aspettare domani, vero? Tu non puoi mai aspettare domani” dice, e dal tavolo dei dadi parte una risatina che si spegne subito.

    Ondrel però ha visto te. Viene al tuo tavolo, e da vicino gli senti addosso un odore di carbone, mentre sul polsino destro ha un velo di fuliggine che arriva fino all'anello con il sigillo dei Tarvelin. [sneering] “Tu eri con quella masnada di spacconi che al Festival ha voluto fare bella mostra di sé contro gli orchi” dice. “Potevate far bruciare mezza città, e adesso la città vi offre da bere. Una banda di combinaguai attira soltanto altre disgrazie.” [tense] Le mani ti si chiudono sul bordo del tavolo per conto loro. [whispers] [uneasy] Ha fretta di farla partire. Il pomo del bastone, sotto le sue dita, trema appena.
  ondrel-al-grifone__1-successo: |
    [calm] Gli ricordi che la sera della razzia le guardie erano poche e gli orchi tanti, e che chi c'era non aveva il tempo di aspettare il permesso della Caserma. Lo dici senza alzare la voce. [satisfied] Quando hai finito un Raschiatore batte il boccale sul tavolo, e dopo di lui lo fanno tutti gli altri.

    Ondrel aspetta che il rumore si spenga. Poi si gira verso Liaren e le parla piano in elfico, e lei gli risponde nella stessa lingua con una sfilza di parole che fa arrossire l'unico elfo seduto al bancone.

    [coldly] “Per me, da oggi, sei morta” dice Ondrel. [short pause] “Proprio come tua madre.”

    [somber] Esce lasciando la porta aperta alle sue spalle. Liaren va a chiuderla e ci resta appoggiata con la fronte, mentre le spalle le tremano.
  ondrel-al-grifone__1-fallimento: |
    Cominci bene, poi ti scappa una parola grossa e Ondrel la raccoglie al volo. [mocking] “Ecco come parlano gli eroi del Festival” dice alla sala battendo il puntale, e al tavolo dei dadi qualcuno abbassa gli occhi. [bitter] Senti il collo che ti si scalda fino alle orecchie.

    Il vecchio torna dalla figlia e le parla in elfico, a voce bassa. Lei gli risponde forte nella stessa lingua, e dal tono capisci anche le parole che non conosci.

    [coldly] “Per me, da oggi, sei morta” dice Ondrel. [short pause] “Proprio come tua madre.”

    [somber] Esce senza chiudere la porta. Liaren va a chiuderla lei, e ci resta appoggiata con la fronte finché Brunella non le mette una mano sulla schiena.
  ondrel-al-grifone__2-esito: |
    [tense] Quando Ondrel alza il bastone verso la figlia ti alzi anche tu, e gli prendi il polso a mezz'aria. È sottile e leggero, un fascio di ossa dentro una manica di buon panno, e per un momento hai paura di fargli male. [cold] Lui ti guarda la mano come guarderebbe una macchia sul vestito.

    Poi parla a Liaren in elfico sopra la tua spalla, e lei gli risponde nella stessa lingua senza abbassare la voce. Ondrel libera il polso con uno strattone e si tira giù la manica.

    [coldly] “Per me, da oggi, sei morta” dice Ondrel alla figlia, senza più guardarti. [short pause] “Proprio come tua madre.”

    [somber] Esce lasciando la porta aperta alle sue spalle. Liaren va a chiuderla e ci resta appoggiata con la fronte, e per un pezzo in sala nessuno ha il coraggio di ricominciare a parlare.
  ondrel-al-grifone__3-esito: |
    Resti seduto, e Liaren esce da dietro il bancone e si pianta davanti al padre a braccia incrociate. [coldly] “Questa è la mia locanda, e qui tu non sei il benvenuto” dice. [mocking] “Il mestolo è ancora appeso lassù, se ti serve.” [crowd laughing] Dalla sala parte una risata, e Ondrel diventa ancora più pallido.

    Ondrel le parla a voce bassa in elfico. Lei gli risponde nella stessa lingua, abbastanza forte perché l'unico elfo seduto al bancone arrossisca e si metta a fissare il fondo del boccale.

    [coldly] “Per me, da oggi, sei morta” dice Ondrel, battendo il puntale sulle assi una volta sola. [short pause] “Proprio come tua madre.”

    [door slams] Liaren chiude la porta dietro di lui con un colpo che fa tremare le lanterne, [sad] e ci resta appoggiata con la fronte finché non smette di piangere.
  ondrel-al-grifone__4-successo: |
    [thoughtful] Lo lasci parlare e intanto lo guardi. Ha le occhiaie scure di tre notti senza sonno, e le dita gli tremano sul pomo del bastone. La fuliggine del polsino è fresca, e quando si appoggia al tuo tavolo lascia sul legno un segno grigio. [curious] Mentre parla con la figlia gira due volte gli occhi verso la porta.

    Poi le dice qualcosa in elfico, e lei gli risponde nella stessa lingua.

    [coldly] “Per me, da oggi, sei morta” dice Ondrel. [short pause] “Proprio come tua madre.”

    [somber] Esce in fretta, e Liaren va a chiudere la porta e ci resta appoggiata con la fronte. Tu resti a guardare il segno grigio sul tavolo finché Brunella non passa a pulirlo con lo straccio.
  ondrel-al-grifone__4-fallimento: |
    Lo guardi troppo, e Ondrel se ne accorge a metà frase. [sneering] “Hai finito di contarmi i bottoni?” chiede, e al tavolo dei dadi qualcuno ride di te. [nervous] Senti la bocca che ti si secca mentre cerchi qualcosa da rispondere.

    Il vecchio torna dalla figlia e le parla in elfico, e lei gli risponde a tono nella stessa lingua.

    [coldly] “Per me, da oggi, sei morta” dice Ondrel. [short pause] “Proprio come tua madre.”

    [somber] Esce lasciando la porta aperta, e Liaren va a chiuderla con le spalle che le tremano. Per il resto della sera i Raschiatori giocano a dadi senza contare i punti ad alta voce.
  ondrel-al-grifone__5-esito: |
    Ti alzi e lo saluti con il titolo che gli spetta alla Casa dei Nodi, e Ondrel guarda la licenza della Gilda che porti alla cintura prima di guardarti in faccia. [wry] Per un momento non sa che cosa risponderti. [thoughtful] Lassù l'hai visto firmare i contratti del lyssan con i polsini bianchi, e il carbone lo lasciava ai capisquadra. Stasera la fuliggine gli arriva all'anello, ed è fresca.

    Si volta verso la figlia e le parla in elfico, e lei gli risponde nella stessa lingua.

    [coldly] “Per me, da oggi, sei morta” dice Ondrel. [short pause] “Proprio come tua madre.”

    [somber] Esce lasciando la porta aperta. Liaren va a chiuderla e ci resta appoggiata con la fronte, mentre le spalle le tremano.
  la-taverniera-scomparsa: |
    [uneasy] La mattina dopo scendi le scale e ti accorgi subito che manca qualcosa. Il camino è acceso e i tavoli sono apparecchiati, ma dalla cucina non arriva nessun odore, e i Raschiatori seduti ad aspettare fissano la porta della cucina come si fissa un pozzo.

    Brunella ti viene incontro prima che tu arrivi in fondo alle scale. Si asciuga le mani sul grembiule pulito e continua ad asciugarle anche quando sono già asciutte. [nervously] “Vieni di là” dice. “Un momento solo.”

    Il retrobottega è una stanza lunga piena di botti e di sacchi di farina, con una branda pieghevole contro il muro e il samisen di riserva appeso a un chiodo. Brunella chiude la porta e ci si appoggia con la schiena.

    [trembling] “Liaren non ha fatto la colazione” dice. “In tutti questi anni non è mai successo, nemmeno il giorno dopo il Festival. Ho bussato alla sua stanza, e quando non ha risposto sono entrata. [short pause] Il letto è fatto, e stanotte non ci ha dormito nessuno.” Fruga nella tasca del grembiule e tira fuori un foglio di pergamena accartocciato e poi lisciato con il palmo. “Era per terra accanto al letto. È di suo fratello Isvaro, ed è scritto in elfico.”

    Il foglio ti passa fra le dita ancora tiepido della sua tasca. La grafia è stretta e inclinata, tirata in fretta. In fondo c'è un nome solo. [whispers] [uneasy] Ieri sera il padre, stanotte il fratello. [tense] La pergamena ha l'odore della cera di candela, e su un angolo c'è l'impronta di un pollice sporco di nero.
  la-taverniera-scomparsa__1-successo: |
    [wry] Isvaro apre la lettera con un salve, sorella pieno di riccioli e poi va al punto. [tense] Scrive che il loro padre potrebbe avere a che fare con i guai che Qir-Azel ha avuto con gli orchi, e che non vuole andare dalle autorità, perché Ondrel ne uscirebbe pulito con qualche mazzetta sottobanco. Le dà appuntamento all'Acciaieria a mezzanotte, alla porta delle consegne, dove bisogna bussare due volte e poi tre, e dopo una pausa ancora una volta.

    Le raccomanda di non dirlo a nessuno, perché i bifolchi di quaggiù penserebbero subito che sono coinvolti anche loro, e accenna ad altre complicazioni di cui vuole parlarle di persona. [ominous] Sopra la firma ha scritto non tardare, e l'ha sottolineato due volte.
  la-taverniera-scomparsa__1-fallimento: |
    [wry] Alla seconda riga ti perdi fra lettere che si somigliano tutte. Brunella ti riprende il foglio e lo legge lei, piano, muovendo le labbra. [tender] L'elfico gliel'ha insegnato Liaren da ragazzina, dice, quando le lettere per suo fratello all'Accademia gliele portava lei nel cesto del pane.

    [tense] Isvaro scrive che il loro padre potrebbe avere a che fare con gli orchi, e che non vuole andare dalle autorità, perché Ondrel se la caverebbe con qualche mazzetta. Dà appuntamento alla sorella all'Acciaieria, a mezzanotte, alla porta delle consegne, dove bisogna bussare due volte e poi tre, e dopo una pausa ancora una volta. Le chiede di non parlarne con nessuno e di non tardare.
  la-taverniera-scomparsa__2-esito: |
    Brunella tira fuori dal grembiule un paio di occhiali con una stanghetta legata con lo spago. [tender] L'elfico gliel'ha insegnato Liaren da ragazzina, dice, quando le lettere per suo fratello all'Accademia gliele portava lei nel cesto del pane. [quietly] Poi legge a voce bassa, una riga alla volta, traducendo.

    [tense] Isvaro scrive che il loro padre potrebbe avere a che fare con gli orchi della razzia, e che non vuole andare dalle autorità, perché Ondrel se la caverebbe con qualche mazzetta. Dà appuntamento alla sorella all'Acciaieria, a mezzanotte, alla porta delle consegne, dove bisogna bussare due volte e poi tre, e dopo una pausa ancora una volta. Le chiede di non parlarne con nessuno e di non tardare. [somber] Brunella si toglie gli occhiali e li tiene in mano.
  la-taverniera-scomparsa__3-esito: |
    [thoughtful] Il nome in fondo lo conosci prima di leggere la lettera. Isvaro è inciso con la punta di un coltello su un banco della terza aula, all'Accademia, accanto a un arco disegnato bene. Traduci a voce alta come fai davanti a Temmerin. [tense] Isvaro scrive che il padre potrebbe avere a che fare con gli orchi della razzia, e che dalle autorità non vuole andare, perché Ondrel ne uscirebbe pulito con qualche mazzetta. Dà appuntamento alla sorella all'Acciaieria, a mezzanotte, alla porta delle consegne. Bisogna bussare due volte e poi tre, e dopo una pausa ancora una volta.

    [ominous] Sopra la firma Isvaro ha sottolineato due volte non tardare. [wry] Brunella ti guarda come si guarda un dottore che ha appena letto una ricetta.
  la-storia-dei-tarvelin: |
    [somber] Brunella si siede su un sacco di farina, e per la prima volta da quando la conosci la vedi senza niente da fare con le mani. [quietly] “Ti racconto dei Tarvelin” dice. “Così almeno sai in mezzo a chi ti metti.”

    Isvaro è nato un anno prima di Liaren, mezzelfo, in una casa dove né il padre né la madre avevano una goccia di sangue elfico. Per mesi a Qir-Azel non si parlò d'altro, e al Maniero Ondrel gridava tanto che dalle cucine si sentiva ogni parola. La signora Maerith non disse mai chi fosse il padre, e Ondrel se la tenne in casa lo stesso, per testardaggine. [bitter] Il bambino lo mandarono a crescere lontano dalla famiglia, all'Accademia di Torvessa. Alla madre vietarono di andarlo a trovare.

    [tender] “Liaren l'ha scoperto a dieci anni, o forse a dodici. Andava a trovarlo di nascosto con il pane e le castagne.” [somber] Da grandi litigarono, e Isvaro la colpì in faccia. Il motivo Brunella non l'ha mai saputo, e Liaren non ne ha mai voluto parlare.

    [ominous] Dieci anni fa morì Maerith, e in città dissero una febbre. Al funerale Isvaro gridò davanti a tutti che suo padre l'aveva spinta giù dalla scogliera, e Ondrel per poco non gli spaccò la mascella con il bastone. [sad] Isvaro lo maledisse e sparì, e da allora Liaren non è mai riuscita a ritrovarlo.

    [sighs] “Mi dispiace per quello che ha passato quel ragazzo” dice Brunella. “Però ha l'animo storto, e se torna adesso non porta niente di buono. Galdrick è partito per Ghoran, e al sergente di turno questa lettera non la faccio leggere. [hesitant] Non so a chi altro chiedere.”
  la-storia-dei-tarvelin__1-esito: |
    [wry] Glielo prometti, e Brunella annuisce come se le avessi detto il prezzo delle uova. Ti spiega la strada. L'Acciaieria sta in Città Bassa, è un edificio grande di pietra con la ciminiera più alta di tutta la città, e non puoi sbagliarti.

    [warm] Poi esce dal retrobottega, apre il registro sul bancone e segna due notti accanto al tuo nome con la sua grafia tonda. Quando torni in sala i Raschiatori hanno davanti la colazione, e Brunella è già ai fornelli.
  la-storia-dei-tarvelin__2-esito: |
    Le monete sono in pile ordinate come le scodelle sullo scaffale. Brunella te le spinge verso la mano con il dorso delle dita, e quando le prendi sembra sollevata.

    [warmly] “Sono della cassa” dice. “Liaren te le avrebbe date lo stesso, e più in fretta di me.” Ti spiega la strada per l'Acciaieria, in Città Bassa, sotto la ciminiera più alta della città. [warm] Poi torna in cucina, e dopo poco dalla porta socchiusa arriva l'odore del pane.
  la-storia-dei-tarvelin__3-esito: |
    [thoughtful] Brunella ci pensa un po' prima di rispondere. Era un ragazzo alto e magro, dice, con le orecchie a punta che da piccolo nascondeva sotto i capelli. [tender] Parlava poco e ascoltava tutto, e quando Liaren gli portava il pane lo divideva in due parti uguali con il coltello.

    All'Accademia vinceva tutte le gare d'arco, e i maestri dicevano che non sbagliava mai un colpo. [ominous] “Se ha un arco in mano, non stargli davanti” dice, e ti spiega la strada per l'Acciaieria, sotto la ciminiera più alta della Città Bassa.
  davanti-all-acciaieria: |
    [ominous] L'Acciaieria dei Tarvelin occupa un isolato intero ai piedi della sua ciminiera, e da qualunque vicolo tu arrivi te la trovi davanti. Sulla facciata le vetrine della sala dei clienti sono coperte da persiane di legno sprangate dall'interno, come tutte le finestre dei due piani, e il cancello del cortile è chiuso con una catena. Dalla ciminiera sale un fumo denso. [eerie] Sotto il fumo non si sente un martello, e nemmeno la voce di un caposquadra.

    Una donna stende il bucato su una corda tesa fra due finestre di fronte, e quando vede che guardi l'Acciaieria ti parla dall'alto con una molletta fra i denti. Da due settimane là dentro non entra e non esce nessuno, a parte il vecchio la sera tardi, dice, eppure il forno va giorno e notte. [deadpan] “Il vecchio starà facendo qualcosa di grosso per la Gilda. Quando lavora alle cose grosse non vuole gente intorno.”

    Giri intorno al muro di cinta fino alla parte del forno. [furnace roaring] Il rombo della fornace passa attraverso la pietra, e in mezzo al rombo ogni tanto senti delle voci gutturali che ridono in una lingua sentita la notte della razzia. [tense] Le spalle ti si irrigidiscono prima che tu abbia finito di riconoscerla. [whispers] [uneasy] Orchi, a due vicoli dal mercato. Sul retro, in un vicolo stretto, c'è una porta di ferro bassa con la scritta consegne dipinta a mano e la n rovesciata. Accanto al cancello c'è la porticina degli operai, con una serratura vecchia, e sul tetto della sala dei clienti c'è un lucernaio che nessuno si è preso la briga di coprire.
  davanti-all-acciaieria__1-esito: |
    [tense] Nel vicolo dietro la fornace non passa nessuno. [knocking on iron door] Bussi alla porta di ferro due volte e poi tre, e dopo un respiro bussi ancora una volta. [long pause] Per un po' non succede niente. [heavy door creaking] Poi dall'altra parte una spranga scorre nei ganci, e la porta si apre di un palmo con un cigolio lungo.

    [eerie] Dietro non c'è nessuno. C'è un corridoio buio che puzza di cenere bagnata, e in fondo dei passi pesanti si allontanano verso il rombo del forno. Chi ha aperto aspettava qualcun altro, oppure non gli importa chi entra. [quietly] Ti infili dentro e accosti la porta alle tue spalle.
  davanti-all-acciaieria__2-successo: |
    Sali dalla grondaia della casa accanto, con le tegole che scricchiolano sotto le suole, e salti sul tetto della sala dei clienti. Il telaio del lucernaio è vecchio, e una lastra si solleva con la punta del coltello. [quietly] Sotto c'è la sala al buio, con le spade appese alle pareti e le vetrine coperte da teli. [satisfied] Ti cali appeso al telaio e atterri su un tappeto piegando le ginocchia.

    [tense] Resti accucciato ad ascoltare. Dal fondo dell'edificio arrivano il rombo del forno e, di tanto in tanto, una risata.
  davanti-all-acciaieria__2-fallimento: |
    [tense] A metà salita la grondaia si stacca da un gancio e ti lascia appeso per le mani, con il gomito che sbatte contro il muro. [groans] Arrivi sul tetto con la manica strappata e il braccio che pulsa, [glass shattering] e la lastra del lucernaio ti scivola dalle dita e si rompe sul pavimento di sotto.

    [quietly] Resti fermo a lungo, senza respirare, ma nessuno viene a guardare, perché il rombo del forno copre tutto. [exhales] Alla fine ti cali fra i vetri rotti e atterri male su una caviglia, in una sala piena di spade appese.
  davanti-all-acciaieria__3-successo: |
    [wood splintering] Al secondo colpo di spalla la serratura salta, e in un momento hai intorno un capannello di vicini con la donna del bucato in prima fila. [wry] Racconti che la famiglia ti paga a giornata per dare un'occhiata, perché il vecchio Tarvelin non risponde alla porta e potrebbe essersi sentito male. Lo dici sbadigliando e grattandoti la nuca, e i vicini tornano alle loro porte uno alla volta.

    La donna del bucato è l'ultima ad andarsene. [amused] Prima di rientrare ti raccomanda di dire al vecchio che il suo fumo le annerisce le lenzuola.
  davanti-all-acciaieria__3-fallimento: |
    La serratura cede, ma il capannello che ti si forma intorno non ha nessuna voglia di andarsene. [crowd murmuring] Un ragazzo con il grembiule da garzone giura di averti visto combattere al Festival, e una vecchia vuole sapere chi ti paga. [irritated] Le rispondi male e ti infili dentro.

    [bitter] Mentre accosti la porta senti il ragazzo che corre verso il mercato a raccontarlo, e la vecchia che ripete a chi arriva la tua descrizione, aggiungendo ogni volta qualcosa.
  davanti-all-acciaieria__4-esito: |
    Sul fianco dell'Acciaieria, a filo del selciato, c'è ancora lo sportello di ferro dove scaricano il carbone. [wry] Da bambino ci venivi d'inverno con un sacco e altri due della tua strada, e lo sportello si apriva con un colpo secco nell'angolo in basso, dove il cardine è storto. [metal clanging] Si apre ancora nello stesso modo, al primo colpo. Ti cali sulla schiena giù per lo scivolo, con la polvere nera che ti entra nel colletto, e finisci su un mucchio di carbone in un ripostiglio buio accanto alla sala dei clienti.

    [tense] Resti fermo nel buio ad ascoltare. Dal fondo dell'edificio arrivano il rombo del forno e, ogni tanto, una risata.
  la-fornace: |
    [furnace roaring] La sala della fornace occupa tutto il fondo dell'Acciaieria, e il caldo ti prende in faccia appena apri la porta. [awed] La fornace principale è una camera di pietra alta due piani che manda una luce azzurra, e nelle fondamenta i cristalli conduttori pulsano a intervalli regolari e tengono in moto i mantici. Al centro, su una fila di incudini, sono rimasti i martelli degli operai.

    [somber] Per terra ci sono gli operai, otto, alcuni ancora con il grembiule da forno addosso. Gli orchi hanno dato alla fornace quello che si poteva staccare, e sul resto hanno colato l'acciaio fuso. [swallows] Lo stomaco ti sale in gola e tu lo rimandi giù.

    [ominous] Nell'alcova di mezzo, su una sedia dallo schienale alto, siede un uomo coperto da strati di acciaio colato e indurito, lucido come una statua da fontana. Contro il bracciolo è appoggiato un bastone di legno nero con il puntale d'acciaio, lo stesso che al Grifone batteva sulle assi. L'acciaio non ha coperto la mano destra, e al dito c'è l'anello con il sigillo dei Tarvelin. [whispers] [horrified] È Ondrel, e l'hanno messo in posa. Ti accorgi che stai stringendo lo stipite della porta.

    [tense] Accanto alla sedia, in piedi, un mezzelfo ben vestito scrive su un libretto rilegato in pelle appoggiato a un'incudine. Ha un arco di legno chiaro sulla schiena e gli stivali da combattimento, e vicino al gomito tiene una bottiglia mezza vuota. [short pause] Quando alza la testa verso il fuoco vedi che ha gli occhi di Liaren. Tre orchi caricano la fornace con le pale e ridono nella loro lingua, e nessuno si è ancora girato verso la porta.
  la-fornace__1-vittoria: |
    [urgent] Un orco cade contro la bocca della fornace, e gli altri due lasciano le pale e scappano verso la sala di carico. Isvaro tira due frecce, e la seconda ti passa sopra la spalla. Poi corre dietro agli orchi tenendosi il fianco dove l'hai preso. Lo raggiungi in cima alla scala dei magazzini. Si gira per dirti qualcosa, mette il piede nel vuoto e rotola fino in fondo, [somber] e quando arrivi giù ha il collo storto contro l'ultimo gradino e non respira più.

    [exhales] Nella tasca della sua cintura c'è il libretto rilegato in pelle, e l'arco è intatto. Lo copri con un telo da sabbia preso da una carriola. Gli orchi sono spariti oltre un muro abbattuto accanto alla scala, e da lì arriva il rumore dei loro passi che si allontanano.
  la-fornace__1-sconfitta: |
    [breathing heavily] Una pala ti prende alle gambe e finisci a terra, e due orchi ti trascinano per le caviglie verso la bocca della fornace mentre il calore ti brucia la nuca. Ti liberi a calci. [pained] Quando ti rimetti in piedi, con le mani scottate e il fiato corto, la sala è vuota. Isvaro e gli orchi sono scappati per la sala di carico, e dal fondo della scala arriva il rumore dei loro passi.

    [exhausted] Sull'incudine accanto alla sedia, dove Isvaro l'ha lasciato per prendere l'arco, c'è il libretto rilegato in pelle.
  la-fornace__2-successo: |
    [quietly] Giri intorno alle incudini nell'ombra dei mantici, con il rombo della fornace che copre ogni passo, e gli arrivi alle spalle mentre scrive. [tense] Gli passi il braccio intorno al collo e gli metti la lama sotto il mento. Isvaro si irrigidisce, poi ride piano senza muovere la testa.

    [amused] “Poco ma sicuro, tu non sei mia sorella” dice. “Lei a quest'ora mi avrebbe già rotto il naso.”

    Gli orchi lasciano cadere le pale e scappano verso la sala di carico. [satisfied] Leghi Isvaro a un'incudine con le cinghie di un mantice e gli togli l'arco dalla schiena. Il libretto rilegato in pelle è rimasto aperto sul ferro, con la penna in mezzo.
  la-fornace__2-fallimento: |
    [metal clanging] A metà strada urti una tenaglia appoggiata a un'incudine, e la tenaglia cade sulla pietra con un suono che passa sopra il rombo della fornace. [tense] Isvaro si gira con l'arco già in mano. [pained] La freccia ti prende alla spalla e ti butta contro il montante di un mantice, e mentre cerchi di strappartela un orco ti pesta la mano con il manico della pala. Quando riesci a rimetterti in piedi lui e gli orchi sono già spariti verso la sala di carico.

    [bitter] Il libretto rilegato in pelle è caduto dietro l'incudine, dove Isvaro l'ha lasciato per prendere l'arco.
  la-fornace__3-successo: |
    [calm] Avanzi a mani aperte e lo chiami per nome. Isvaro alza gli occhi dal libretto e fa segno agli orchi di stare fermi. Parla volentieri, e mentre parla beve. [wry] Suo padre lo chiama sempre “quell'uomo”, e su di sé resta sul vago.

    [slyly] “Mia sorella è di sotto a riflettere sulle sue scelte” dice. “Poco ma sicuro, le farà bene.”

    Lo lasci parlare e gli versi tu l'ultimo dito dalla bottiglia. Quando si siede sull'incudine per finirlo gli togli l'arco dalla schiena, e lui ti guarda fare con un mezzo sorriso. [satisfied] Appena vedono l'arco nelle tue mani gli orchi scappano verso la sala di carico senza aspettare un suo ordine. Leghi Isvaro con le cinghie di un mantice e prendi il libretto rilegato in pelle.
  la-fornace__3-fallimento: |
    Lo chiami per nome e lui alza gli occhi dal libretto, ti guarda dalla testa ai piedi e sospira.

    [sneering] “Un altro bifolco con le buone intenzioni” dice. “Poco ma sicuro, questa città ne produce più che acciaio.”

    [tense] Fa un cenno con il mento. Un orco ti arriva addosso di fianco con le pinze del forno ancora rosse, e mentre ti difendi Isvaro prende l'arco e va verso la sala di carico senza correre. [pained] Le pinze ti si chiudono sull'avambraccio, e l'odore della tua pelle bruciata ti arriva prima del dolore. [whistling] Quando Isvaro fischia dalla scala l'orco ti lascia e gli corre dietro. [bitter] Il libretto rilegato in pelle è rimasto sull'incudine, con l'inchiostro dell'ultima riga ancora bagnato.
  la-fornace__4-esito: |
    [calm] Dalla soglia gli dici che sei venuto per Liaren e per nient'altro. Isvaro ti guarda a lungo con la penna sospesa sulla pagina, poi ride.

    [mocking] “La trovi di sotto, nel magazzino in fondo” dice. “Viva, poco ma sicuro. Salutamela, e dille che l'offerta resta valida.”

    [whistling] Fischia agli orchi, e se ne vanno tutti verso la sala di carico senza fretta, passandoti a due braccia di distanza. [tense] Tu resti fermo con le mani lontane dalla cintura e le guardi tremare. [exhales] Solo quando i passi si spengono in fondo alla scala vedi che il libretto rilegato in pelle è rimasto sull'incudine, accanto alla bottiglia vuota.
