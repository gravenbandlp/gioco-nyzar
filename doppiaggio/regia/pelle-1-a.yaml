# Regia del doppiaggio: Sotto la pelle di Qir-Azel (prima parte)
regia:
  galdrick-e-la-mappa-rossa: |
    [wry] Il ragazzo che Galdrick ha mandato a cercarti porta una divisa della Guardia di due taglie più grande, con le maniche arrotolate, e ti trova al terzo tentativo. In Caserma ti accompagna fino all'ufficio dello sceriffo. Il calendario è ancora appeso alla toppa d'intonaco, e da allora qualcuno ci ha cerchiato a matita una settimana intera.

    [somber] Galdrick ha la faccia tirata e in mano una tazza di caffè nero che si è raffreddato da un pezzo. Accanto ha una pila di documenti alta un palmo, e sul tavolo c'è una mappa di Qir-Azel piena di segnalini rossi, fitti in Città Bassa e più radi salendo verso i Quartieri Alti, con uno piantato perfino sul Municipio. [uneasy] Ti sorprendi a cercare con gli occhi la strada dove dormi.

    [gruff] “Mirko Vesh ha tanti uomini quanti il mio intero corpo di guardia” dice, [bitter] “e un quarto dei miei prende anche la sua paga.” Si alza e va alla finestra con i pollici nella cintura, e indica la città con il mento. [determined] “Io non posso colpirlo apertamente. Ma tu sì. Se vogliamo tagliare la testa a questa bestia, dobbiamo cominciare dal basso.”

    Torna al tavolo e spinge un segnalino rosso verso il bordo nord della mappa, dove le strade finiscono e resta soltanto un quadrato a inchiostro con un piccolo alloro disegnato dentro. [paper rustling] Accanto srotola un foglio. È la pianta del Maniero tirata col righello, con le stanze numerate in una grafia minuta. [quietly] “Me l'ha data a Ghoran Urtilia Mendion, la zia di Ottone, che tiene con sé i tre bambini dei Malgrani” dice. Poi arrotola la pianta e te la mette in mano.
  galdrick-e-la-mappa-rossa__1-esito: |
    [gruff] “Maedric sta in cella qui sotto, e giura a chiunque passi che i suoi sacchi disegnati sono farina per i poveri” dice Galdrick. [sarcastic] “Un avvocato della Gilda spiega ogni riga di quel registro in un pomeriggio. Il grano è dei Malgrani, d'accordo, ma chi dice che l'abbia pagato Ottone? Il suo nome là dentro non c'è.”

    [pencil tapping on paper] Batte la matita corta sul quadrato con l'alloro. [determined] “Ottone però conta i chicchi dei suoi debitori uno per uno. Uno così non paga gli Scuri senza segnarselo, e infatti tiene un registro suo, con la sua grafia. Quello è la controprova.”
  galdrick-e-la-mappa-rossa__2-esito: |
    [bitter] “Maedric non è qui a dire di chi era il grano, e un registro senza il suo custode è un libretto di disegnini” dice Galdrick. [sarcastic] “Un avvocato della Gilda spiega ogni riga in un pomeriggio. Il grano è dei Malgrani, d'accordo, ma chi dice che l'abbia pagato Ottone? Il suo nome là dentro non c'è.”

    [pencil tapping on paper] Batte la matita corta sul quadrato con l'alloro. [determined] “Ottone però conta i chicchi dei suoi debitori uno per uno. Uno così non paga gli Scuri senza segnarselo, e infatti tiene un registro suo, con la sua grafia. Quello è la controprova.”
  galdrick-e-la-mappa-rossa__3-esito: |
    [thoughtful] “A Ghoran non sono andato soltanto per i mercenari” dice. “Urtilia Mendion è la sorella del vecchio Brandano, e la casata tiene il suo busto nell'atrio insieme a quelli dei fondatori. [wry] Di formule e cristalli ne sa più di mezza Accademia, e del registro di Ottone sapeva prima di me.” Batte la matita corta sulla pianta che tieni in mano.

    “In cambio della pianta vuole che i bambini restino fuori da tutto quello che succederà. [slowly] Urtilia Mendion non interverrà. Me l'ha detto proprio con queste parole, e poi ha voluto stringermi la mano.” [uneasy] Che cosa ci guadagni lei non gliel'ha chiesto, e dal tono si capisce che ci ha pensato tutto il viaggio di ritorno.
  galdrick-e-la-mappa-rossa__4-esito: |
    [bitter] “Un quarto dei miei è di Vesh, e non so quale quarto” dice. “Se mando dieci uomini al Maniero, prima che arrivino al cancello Ottone ha già bruciato il registro nel camino. [wry] E i mercenari di Ghoran sono buoni sulle mura, ma in una casa piena d'argento non li manderei nemmeno a prendere l'acqua.”

    Ti guarda da sotto in su. [serious] “Ci serve una persona sola che ci vada di notte senza divisa. Se ti prendono io non ti ho mai visto, e lo dico adesso perché dopo non potrò dirlo.” [uneasy] Poi si scrive qualcosa sul taccuino, e lo rimette in tasca prima che tu possa leggerlo.
  galdrick-e-la-mappa-rossa__5-successo: |
    [rain on rooftops] La sera dopo ti presenti al cancello con il mantello buono e la pioggia che ti gocciola dal cappuccio, e dici alla guardia che il padrone ti aspetta da un'ora. [wry] Lui guarda la livrea verde del collega come se lì sopra ci fosse la risposta, poi apre. [gruff] “Il signore riceve in salotto” dice. [satisfied] Nell'atrio ti lasciano solo per andare a chiamare qualcuno, e tu prendi la porticina di servizio verso le cucine.
  galdrick-e-la-mappa-rossa__5-fallimento: |
    [rain on rooftops] La sera dopo dici alla guardia del cancello che il padrone ti aspetta, e lui ti chiede il nome per la lista. [tense] Ne inventi uno, e lo vedi scorrere il foglio con il dito umido di pioggia. Ti fa entrare lo stesso, ma ti accompagna fino all'atrio e poi torna indietro voltandosi due volte. [uneasy] Quando sparisci dietro una porta laterale lo senti chiamare il collega.
  galdrick-e-la-mappa-rossa__6-esito: |
    Il carrettiere conta le monete sotto la tettoia di un fienile e ti fa sedere dietro, fra le casse, con un telo cerato sopra la testa. [wry] Puzza di mosto e di mulo. [tense] Alla porta di servizio nessuno guarda dentro il carro, e quando i due garzoni cominciano a scaricare tu sei già nel corridoio della cucina, con le ginocchia rigide e un graffio di chiodo sul polso.
  galdrick-e-la-mappa-rossa__7-successo: |
    [quietly] La notte dopo trovi il muro dove dice la pianta, coperto di edera fradicia. Lo scavalchi in due movimenti e scendi dall'altra parte fra i peri. Nella cuccia in fondo al frutteto tre cani da caccia dormono uno sull'altro e non alzano la testa. [relieved] Arrivi alla casa camminando sull'erba, dove i passi non fanno rumore, e ti infili da una finestra della lavanderia rimasta socchiusa per il vapore.
  galdrick-e-la-mappa-rossa__7-fallimento: |
    [tense] L'edera ti resta in mano a metà salita, e cadi dall'altra parte su un ramo di pero che ti apre la coscia. [dog barking] In fondo al frutteto uno dei cani da caccia comincia ad abbaiare, poi gli altri due. [urgent] Corri curvo fino al muro della casa e ti infili da una finestra socchiusa, mentre fuori una voce zittisce i cani e una lanterna gira per il frutteto.
  galdrick-e-la-mappa-rossa__8-esito: |
    [calm] La notte dopo esci dalla città dal lato nord e giri largo, al passo, finché la strada diventa un sentiero fra i pini. Leghi il cavallo a un tronco storto, con il muso nel vento, e scendi a piedi verso le luci del Maniero. Da questa parte il muro di cinta è basso e mezzo franato. [satisfied] Lo passi senza fatica e arrivi alla casa con gli aghi di pino attaccati agli stivali.
  galdrick-e-la-mappa-rossa__9-esito: |
    [wry] La sera dopo ti presenti al cancello con il mantello buono e dici il tuo nome, quello vero, con l'aria annoiata di una cena a cui sei arrivato tardi. La guardia lo trova sulla lista al primo colpo, sotto quello dei tuoi, e si scusa per la pioggia come se l'avesse ordinata lui. Nell'atrio ti lasciano solo il tempo di andare a chiamare qualcuno, ed è il tempo che ti serve per prendere la porticina di servizio verso le cucine.

    [whispers] [uneasy] Domani qualcuno si ricorderà che c'ero. [nervous] Le mani, intanto, ti sudano dentro i guanti.
  galdrick-e-la-mappa-rossa__10-esito: |
    Il carrettiere lo trovi sotto la tettoia del fienile, e prima ancora di alzare gli occhi ti chiama [warmly] “ragazzo mio”. [warm] È il vecchio del carro del falò, con le mani ancora nere di resina, e da quella sera ti deve un boccale. [somber] Quando gli dici dove devi andare smette di sorridere. Ti fa salire dietro lo stesso, fra le casse, con il telo cerato sopra la testa, e le monete che gli tendi te le rimette in tasca senza contarle.

    [tense] Alla porta di servizio nessuno guarda dentro il carro. Quando i garzoni cominciano a scaricare tu sei già nel corridoio della cucina, con l'odore del mosto nei vestiti.
  lo-studio-di-ottone: |
    [tense] In fondo al corridoio del piano di sopra la porta dello studio è socchiusa, e dalla fessura esce la luce che si vede dal cancello. [wry] Dentro tutto è in ordine fino all'ossessione, con i tappeti rossi e le librerie simmetriche, e perfino le penne sul tavolo sono allineate per lunghezza. [quill scratching on paper] Ottone Malgrani scrive alla scrivania con una penna di rapace. Ha i capelli biondi pettinati all'indietro e i baffi curati, e la faccia stanca e dura. Accanto al calamaio d'oro c'è una tazza di tisana che nessuno ha toccato.

    [heavy footsteps on stairs] Passi pesanti salgono dalla scala. [tense] Ti appiattisci in un vano della parete, e un uomo con la barba tagliata a filo e un fischietto d'osso al collo bussa allo stipite. [gruff] “Il giro è fatto, signore. Tutto in ordine.”

    Ottone non alza la testa. [coldly] “Tutti hanno bisogno di un muro che li protegga, Roldan” dice. “Io sono quel muro. [menacing] E i muri, a volte, si tirano su con il sangue.” Il caposquadra aspetta un momento, poi riscende.

    [ominous] Ottone posa la penna e si alza, e fa il giro della stanza con le mani dietro la schiena. Poi esce nel corridoio e ci cammina avanti e indietro prima di rientrare. [whispers] [uneasy] Quest'uomo fa la ronda in casa sua. [breathing heavily] Senti il cuore battere contro il muro del vano.
  lo-studio-di-ottone__1-successo: |
    [footsteps descending stairs] Al terzo giro Ottone scende le scale, e conti i suoi passi fino in fondo. [quickly] Nel primo cassetto c'è un biglietto con cinque note scritte a penna, Fa due, Re quattro, Mi bemolle due, Fa tre, Do quattro. Il secondo contiene un registro rilegato in pelle con l'alloro impresso, e sotto un sacchetto di velluto con delle monete di platino. Prendi tutto e richiudi i cassetti nello stesso ordine. [exhales] Sei di nuovo nel vano quando lui risale.
  lo-studio-di-ottone__1-fallimento: |
    [wooden stair creaking] Sei con le mani nel primo cassetto quando senti scricchiolare il gradino in cima alla scala. [tense] Ottone torna molto prima del previsto. Fai in tempo a richiudere e a uscire, ma lui si ferma sulla soglia e annusa l'aria della stanza. [ominous] Poi chiama Roldan con una voce calma, senza alzarla.
  lo-studio-di-ottone__2-successo: |
    Dalla curva del corridoio dici, [hoarse] con la voce rauca di una guardia svegliata male, che i cani sono scappati dalla cuccia e il caposquadra chiede del padrone. [wry] Ottone impreca a mezza voce e scende, perché i cani sono suoi. [quickly] Nei cassetti trovi un biglietto con cinque note, Fa due, Re quattro, Mi bemolle due, Fa tre, Do quattro, un registro rilegato in pelle con l'alloro e un sacchetto di monete di platino, e ti porti via tutto prima che lui risalga dal giardino.
  lo-studio-di-ottone__2-fallimento: |
    Dici dal corridoio che i cani sono scappati. [tense] Ottone si alza e viene alla porta, e guarda il corridoio vuoto per un lungo momento. [coldly] “I miei uomini mi chiamano per nome” dice al buio. [urgent] Poi prende un candeliere e comincia a cercare, stanza per stanza, mentre tu scendi dalla scala di servizio. [uneasy] Ti ha sentito, e forse ti ha anche visto.
  lo-studio-di-ottone__3-esito: |
    Dalla camera in fondo al corridoio Lucia chiama il marito. Dice che è arrivata una lettera dei figli da Ghoran, e Ottone esce dallo studio a passi lunghi. [quickly] Nei cassetti trovi un biglietto con cinque note, Fa due, Re quattro, Mi bemolle due, Fa tre, Do quattro, un registro rilegato in pelle con l'alloro impresso, e qualche moneta di platino. [satisfied] Quando lui torna la stanza è come l'ha lasciata.
  lo-studio-di-ottone__4-esito: |
    [tired] Passi la notte nel vano della parete con le ginocchia contro il mento. [muttering] Ottone intanto scrive e cammina borbottando cifre a mezza voce. [quietly] Quando la finestra diventa grigia scende in giardino a fischiare ai cani. Nei cassetti trovi un biglietto con cinque note, Fa due, Re quattro, Mi bemolle due, Fa tre, Do quattro, un registro rilegato in pelle con l'alloro e un pugno di monete di platino. [exhausted] Le sue cifre ti girano ancora in testa.
  lucia-malgrani: |
    [eerie] La camera dei padroni è lussuosa e fredda, con un letto a baldacchino che nessuno ha disfatto, un grande specchio dorato e le tende color cremisi tirate. Sul comodino ci sono due bicchieri di cristallo. In uno resta un fondo ambrato e appiccicoso, nell'altro una goccia di vino.

    Davanti allo specchio, seduta su uno sgabello, c'è una donna in abito scuro con i ricami minuti sui polsi e i capelli ancora appuntati, come se la sera non fosse mai finita. [tense] Ti guarda nello specchio, e non si volta. Ha la mano posata accanto a un campanello d'argento.

    [deadpan] “Mio marito riceve di giorno” dice Lucia Malgrani. “Di notte, a quanto pare, ricevo io. Le due cose, sommate, fanno una casa molto frequentata.” [quietly] Ha la voce bassa e piana e gli occhi cerchiati, e con il pollice fa girare piano la fede intorno all'anulare. [tense] Ti accorgi di misurare la distanza fra te e il campanello, e che anche lei la sta misurando.
  lucia-malgrani__1-esito: |
    [curious] Il fondo del bicchiere ha l'odore della valeriana, e sotto c'è qualcosa di amaro e più forte. [wry] È un sonnifero da cavallo, roba che si compra dal retro delle botteghe del Mercato dei Nodi.

    [tired] “Mi aiuta a non sentirlo camminare” dice Lucia allo specchio. “Avanti e indietro, tutta la notte, davanti alla mia porta. [bitter] Dopo un po' una impara a contare i passi, ed è peggio.”
  lucia-malgrani__2-successo: |
    Le dici chi ti manda e che cosa cerchi, e le giuri che i suoi figli resteranno fuori da tutto. Lei ascolta senza voltarsi, con le mani in grembo. [quietly] “Non dorme mai, ultimamente” dice alla fine, a voce bassa. [bitter] “Forse la coscienza ha cominciato a pesargli dopo tanti anni, oppure è stanco anche lui di questa vita che si vede tanto da fuori ed è vuota da dentro” aggiunge, guardando il bicchiere.

    [softly] Poi si volta verso di te per la prima volta. “Ogni notte suona il pianoforte di sotto, sempre le stesse cinque note, Fa, Re, Mi bemolle, Fa, Do” dice, e si toglie una forcina dai capelli per posarla accanto al campanello. [determined] “Se ha bisogno di tenerlo lontano dallo studio, mi chiami” conclude, e torna a guardarsi nello specchio.
  lucia-malgrani__2-fallimento: |
    Le parli dei figli e di Ghoran, e lei ti lascia finire. Poi si sfila un orecchino e lo posa sul tavolo, e poi l'altro. [coldly] “Esca da dove è entrato” dice senza guardarti. “Io stanotte non ho visto nessuno e lei non ha visto me.” [somber] Quando sei sulla porta la senti versare qualcosa nel bicchiere del sonnifero.
  lucia-malgrani__3-successo: |
    [tense] Ti avvicini piano, e lei ritira la mano dal campanello prima che tu arrivi a metà della stanza. Ti guarda nello specchio con gli occhi asciutti e la mascella dura. [bitter] “In questa casa sono abituata a stare zitta” dice. “Una notte in più non cambia il conto.” [relieved] Esci, e il campanello resta muto.
  lucia-malgrani__3-fallimento: |
    Fai un passo verso di lei, e Lucia afferra il campanello [bell ringing frantically] e lo scuote con tutta la forza che ha, [shouting] poi grida il nome di Roldan, con una voce che non ti aspettavi da una donna così composta. [urgent] Sei in corridoio prima che arrivi la prima guardia, e il campanello continua a suonare dietro di te.
  lucia-malgrani__4-esito: |
    [quietly] Indietreggi fino alla porta senza voltarle le spalle, e la richiudi piano. Lucia ti segue nello specchio finché la porta non si chiude, con la mano ferma accanto al campanello e la schiena dritta. [tense] In corridoio aspetti con il fiato sospeso di sentirlo suonare. [pause] Il campanello resta muto, e dopo un po' da sotto la porta senti [glass set down on wood] il rumore di un bicchiere posato sul comodino.
  lucia-malgrani__5-successo: |
    Le dici il tuo nome e il numero del palco della tua famiglia al Teatro delle Meraviglie, e lei si volta dallo specchio. [wry] “Il palco dove si dormiva al secondo atto” dice. Le giuri che i suoi figli resteranno fuori da tutto, e lei ti ascolta con le mani in grembo.

    [softly] “Ogni notte suona il pianoforte di sotto, sempre le stesse cinque note, Fa, Re, Mi bemolle, Fa, Do” dice alla fine, e si toglie una forcina dai capelli per posarla accanto al campanello. “Se ha bisogno di tenerlo lontano dallo studio, mi chiami.” [tender] Poi torna a guardarsi nello specchio, e per un momento le vedi in faccia la ragazza che rideva forte.
  lucia-malgrani__5-fallimento: |
    Le ricordi il Teatro e il palco della tua famiglia, e lei ti lascia finire. Poi si sfila un orecchino e lo posa sul tavolo. [coldly] “Allora lei sa bene che in questa casa le visite si annunciano” dice senza voltarsi. “Esca da dove è entrato. Io stanotte non ho visto nessuno.” [somber] Quando sei sulla porta la senti versare qualcosa nel bicchiere del sonnifero.
  roldan-kael: |
    [whistle blowing] Il fischietto d'osso suona una volta lunga e due corte, e in tutta la casa si accendono le lampade. [tense] Da sotto arrivano passi di corsa e porte che sbattono, e qualcuno fa uscire i cani dalla cuccia. Le stanze dove sei passato stanotte adesso hanno ognuna una guardia sulla porta.

    [ominous] In fondo al corridoio compare una lanterna, e dietro la lanterna c'è un uomo con la barba tagliata a filo e il passo di un veterano. Roldan Kael ha la spada sguainata e il fischietto stretto fra i denti, e una guardia gli copre le spalle. Cammina piano e apre le porte una per una, e guarda anche sotto le cassapanche. Poi si toglie il fischietto di bocca.

    [menacing] “So che sei qui, ospite” dice, senza alzare la voce. “In questa casa ci sono trentadue porte, e le conosco tutte. Fammi risparmiare tempo.” [swallows] Hai la bocca secca, e soltanto quando abbassi gli occhi ti accorgi di stringere il manico del coltello.
  roldan-kael__1-vittoria: |
    [tense] Roldan combatte bene e senza fretta, e ti fa pagare ogni passo del corridoio. [breathing heavily] Alla fine lo metti giù contro un cassettone, e il fischietto d'osso gli si spezza sotto il gomito. La guardia scappa a chiamare aiuto e non trova nessuno a cui dare ordini. [exhales] Dopo un po' nella casa le lampade si spengono una alla volta, perché senza il fischio nessuno sa più che cosa cercare.
  roldan-kael__1-sconfitta: |
    [tense] Roldan ti lascia attaccare per primo e schiva, poi ti colpisce di piatto alla tempia con la lama. [pained] Quando riapri gli occhi ti stanno trascinando per le braccia attraverso il cortile, sotto la pioggia, fra le statue degli antenati. Ti buttano oltre il cancello nel fango. [coldly] “La prossima volta ti consegno alla Caserma, ospite” dice Roldan, [padlock clicking shut] e richiude il lucchetto.
  roldan-kael__2-successo: |
    [quickly] Ti infili nel camino spento di una stanza degli ospiti e sali con la schiena e i piedi contro i mattoni, nella fuliggine. [tense] Roldan entra, guarda sotto il letto e dietro le tende, poi esce. [wry] Lo senti dire alla guardia che era il gatto della cuoca. [relieved] Quando scendi sei nero fino ai gomiti, e la casa ha ricominciato a dormire.
  roldan-kael__2-fallimento: |
    [tense] Ti butti sotto una cassapanca, e Roldan ci si siede sopra. [deadpan] “Esci” dice, e quando esci lui e la guardia ti accompagnano al cancello tenendoti per le braccia, [bitter] con una gentilezza che fa più male delle botte. Sulla soglia il calcio del pugnale arriva lo stesso nelle costole, e la guardia aggiunge di suo uno stivale quando sei già giù. [pained] Ti ritrovi nel fango della strada sotto la pioggia, e respirare fa male.
  roldan-kael__3-successo: |
    [calm] Esci con le mani in vista e gli dici che ti manda Mauro per la consegna del mese. Roldan sputa per terra, poco lontano dai tuoi stivali. [gruff] “Quelli della Pignatta entrano dal frutteto e aspettano in cucina, e per i corridoi non ci girano” dice, con il fischietto che gli dondola sul petto. “Glielo dirai tu, a Mauro.” [relieved] Ti spinge verso la scala di servizio e torna a fischiare una volta sola, per dire che è finita.
  roldan-kael__3-fallimento: |
    Gli dici che ti manda Mauro. [tense] Roldan ti guarda dalla testa ai piedi. [mocking] “Quelli della Pignatta li conosco tutti per nome” dice, “e tu non sei nessuno di loro.” [pained] La guardia ti torce un braccio dietro la schiena finché la spalla schiocca, e Roldan ti accompagna al cancello e ti butta nel fango della strada con un calcio nei reni.
  roldan-kael__4-esito: |
    [window creaking open] Apri la finestra più vicina e salti nel giardino, sulle siepi potate a squadra, che ti graffiano dappertutto. [urgent] I cani ti arrivano alle calcagna quando sei già sul muro del frutteto. [dog barking] Dall'altra parte cadi nel fango, e da sopra il muro un cane ti abbaia dietro finché non giri l'angolo. [breathing heavily] Ti fermi a respirare soltanto in fondo alla discesa, con le mani sulle ginocchia.
  il-caveau: |
    [eerie] Dalla scala di servizio scendi di nuovo al piano terra, fino alla sala da pranzo, che è la stanza più grande della casa. Un tavolo di legno scuro lungo quanto la parete è coperto da un drappo purpureo, con il servizio d'argento già apparecchiato per una cena che non si farà. [fire crackling] Il camino è acceso e scalda poco, e le poltrone di velluto sono girate verso il fuoco come se qualcuno se ne fosse appena andato.

    Sopra il camino c'è il ritratto di Ottone e di sua moglie, in piedi, rigidi, a un palmo l'uno dall'altra. [wry] Il pittore ha dato alla signora un sorriso largo e sereno che non c'entra niente con il resto della tela, e a Ottone i baffi di qualche anno fa.

    [mysterious] Nell'angolo c'è un pianoforte a coda nero, con il coperchio chiuso e i tasti ingialliti. Sulla pianta di Urtilia, proprio in quel punto, c'è una crocetta a matita e niente altro. [thoughtful] Sotto il pianoforte il tappeto ha un bordo più consumato degli altri, e ti viene in mente che i tappeti si consumano dove si cammina. Le dita ti si muovono da sole, sopra la coscia, come su una tastiera.
  il-caveau__1-esito: |
    [quietly] Alzi il coperchio e suoni le cinque note, piano, una alla volta. [dissonant piano chord] Il suono che ne esce è un accordo stonato e ti allega i denti. [low rumble] Il pavimento vibra sotto il tappeto, e un riquadro di assi si abbassa e scorre di lato. [awed] Più giù c'è una botola di ferro decorata con incisioni geometriche, e la botola è aperta.
  il-caveau__2-successo: |
    [quietly] Premi i tasti uno alla volta con il dito sul feltro per smorzare il suono, finché ne trovi cinque che fanno vibrare il pavimento sotto i piedi. [dissonant piano chord] Li suoni in fila, e l'accordo stonato ti allega i denti. [satisfied] Sotto il tappeto un riquadro di assi scorre di lato e scopre una botola di ferro con incisioni geometriche, aperta.
  il-caveau__2-fallimento: |
    [tense] Provi le note una alla volta, ma il feltro non basta, e alla decima il suono riempie la sala ed esce nel corridoio. [pause] Sopra la tua testa i passi dello studio si fermano. [urgent] Chiudi il coperchio e ti nascondi dietro le poltrone, e qualcuno scende fino a metà scala e poi torna su.
  il-caveau__3-successo: |
    Arrotoli il tappeto e infili l'attizzatoio nella fessura delle assi. [wood splintering] Al terzo strattone il riquadro salta con uno schiocco secco che rimbomba per tutta la casa. [tense] Sotto c'è una botola di ferro con incisioni geometriche. La apri con le mani che tremano, [door slams] mentre al piano di sopra una porta sbatte e qualcuno chiama Roldan.
  il-caveau__3-fallimento: |
    [metal clanging] L'attizzatoio scivola dalla fessura e ti finisce sulle dita, e le assi non si muovono. [dog barking] Il rumore del ferro sul legno fa abbaiare i cani in giardino. [pained] Rimetti a posto il tappeto con le dita che pulsano, e ti nascondi dietro le poltrone mentre la casa si sveglia. [wry] Ti succhi le nocche per non fare rumore.
  il-caveau__4-successo: |
    [mysterious] Appoggi il palmo sul legno del pianoforte e senti il Mana scendere dalle corde fino al pavimento, avvolto intorno a una serratura che si apre con cinque note. Gliele dai senza suonarle, e le dita ti formicolano fino al gomito. [satisfied] Sotto il tappeto un riquadro di assi scorre di lato, e sotto c'è una botola di ferro con incisioni geometriche, aperta.
  il-caveau__4-fallimento: |
    [piano strings groaning] Il Sigillo prende la serratura dal verso sbagliato, e dentro il pianoforte tutte le corde vibrano insieme con un lamento lungo. [pained] Senti un ago di dolore dietro gli occhi. [tense] Al piano di sopra i passi dello studio si fermano, e poi cominciano a scendere. Ti butti dietro le poltrone con le mani sulle tempie e aspetti che qualcuno si stanchi di cercare.
  la-sala-ottagonale: |
    [ominous] Una scala a chiocciola di ferro scende per dieci metri nel buio, e a ogni giro l'aria si fa più fredda e prende un sapore di metallo. In fondo c'è una porta di pietra scolpita a radici intrecciate, con incisioni d'oro nei solchi, [stone door grinding] e la porta cede a una spinta.

    [awed] La sala è ottagonale e grande, illuminata da una lanterna con dentro un Cristallo Conduttore che fa una luce verde e azzurra, da acquario. Gli scaffali lungo le otto pareti sono pieni di registri e di pergamene. [eerie] Sul pavimento sono incisi dei cerchi uno dentro l'altro, con segni che non sono lettere. In mezzo, su un piedistallo di pietra, un cristallo grande come un uovo pulsa lentamente di luce blu.

    Sul primo scaffale ci sono le carte. Lettere chiuse con la ceralacca verde e l'alloro, firmate da Ottone Malgrani, con il nome di Mirko Vesh scritto a margine. Elenchi di funzionari della Casa dei Nodi, ognuno con la sua cifra, e le date dei pagamenti, una colonna lunga anni. [solemn] Capisci subito che sono prove più pesanti di qualsiasi cosa ci fosse nello studio, e che con queste carte cade Ottone e cade mezza Gilda. [wry] Il resto della sala è pieno di monete e di gemme, più di quanto si possa portare su per una scala a chiocciola senza svegliare la casa. Ti riempi le tasche di quello che ci sta.
  la-sala-ottagonale__1-esito: |
    [calm] Infili le lettere e gli elenchi nella giubba, contro la pelle, dove la carta si scalda. Al cristallo non ti avvicini. Risali la scala a chiocciola e richiudi la botola, poi rimetti il tappeto al suo posto. [relieved] Esci dal frutteto quando sopra i pini il cielo comincia a schiarire, e scendi verso la Caserma [coins jingling] con le tasche che tintinnano a ogni passo.
  la-sala-ottagonale__2-vittoria: |
    [eerie] Quando sollevi il cristallo i cerchi sul pavimento si accendono, e dal centro sale una figura di metallo e di resina con le giunture fatte di radici. Dalla bocca le cola una linfa verde che si indurisce sul pavimento. [breathing heavily] Ci vuole molto a buttarla giù, [wood splintering] e quando cade si spezza come un ramo secco. [exhales] Risali con le carte nella giubba e il cristallo in tasca, che ti scalda la coscia attraverso la stoffa.
  la-sala-ottagonale__2-sconfitta: |
    [eerie] Dai cerchi accesi sale una figura di metallo e di resina con le giunture di radici. Ti strappa il cristallo dalla mano e lo rimette sul piedistallo, [fearful] poi si gira verso di te. Riesci a raggiungere la scala con le carte strette al petto e la linfa verde che ti si indurisce sulla camicia. [breathing heavily] In cima ti fermi a respirare, e sotto di te il Guardiano rientra nei suoi cerchi.
  la-sala-ottagonale__3-successo: |
    [urgent] Prendi il cristallo e corri prima che i cerchi finiscano di accendersi. Alle tue spalle una figura di metallo e resina si alza dal pavimento e ti segue su per la scala, [fearful] e una mano di radici ti prende la caviglia all'ultimo giro. Tiri via il piede e chiudi la botola. [metal clanging] Sotto, il ferro rimbomba due volte, [pause] e poi più niente.
  la-sala-ottagonale__3-fallimento: |
    [urgent] Prendi il cristallo e corri, ma i cerchi si accendono prima che tu arrivi alla scala. [pained] Una mano di radici ti afferra la caviglia e ti sbatte contro il muro, e il cristallo ti vola via dalle dita. [breathing heavily] Sali gli ultimi giri carponi, con le carte nella giubba e la caviglia che non regge, [metal door slams] e chiudi la botola con tutto il peso del corpo.
  la-sala-ottagonale__4-successo: |
    [mysterious] Ti inginocchi sul cerchio più esterno e cerchi il punto dove il Mana gira. Lo trovi freddo e lento sotto le dita, e lo chiudi su se stesso. Quando sollevi il cristallo i segni sul pavimento si accendono e si spengono subito. [eerie] Sotto la pietra qualcosa si muove una volta sola e resta dov'è. [satisfied] Risali con le carte e il cristallo, e sulle ginocchia hai il segno dei cerchi.
  la-sala-ottagonale__4-fallimento: |
    [tense] Il Sigillo prende il cerchio dal verso sbagliato e lo apre. [eerie] Dal pavimento sale una figura di metallo e di resina, con le giunture di radici e la bocca che cola linfa verde. [urgent] Lasci cadere il cristallo e scappi su per la scala con le carte, [gasps] e il colpo che ti prende alla schiena sull'ultimo gradino ti toglie il fiato. [somber] Per giorni, quando chiudi gli occhi, vedi i cerchi girare.
