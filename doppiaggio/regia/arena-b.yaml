# Regia del doppiaggio: L'Arena di Qir-Azel
regia:
  la-grande-mischia-dopo-vesh: |
    [electric humming] I cristalli della cintura si accendono tutti insieme, e un'onda di vibrazione attraversa la sabbia e ti sale nelle caviglie. Su una sporgenza della tribuna Orazio Belcanto, con le piume sul cappello e una giacca che manda lampi, allarga le braccia inanellate. [shouting] “Popolo di Qir-Azel, cittadini della Città Alta e della Città Bassa! Oggi l'Arena non chiede spettatori. Vuole volontà e sangue, e vuole sapere un nome. [dramatic] Che abbiano inizio le Tre Prove!”

    [metal grinding] Le griglie ai bordi si sollevano dal suolo, e il recinto ovale si accende di un verde acido che ti fa lacrimare. Orazio scandisce le parole una alla volta. [slowly] “Dodici combattenti entrano. Uno solo resterà dentro il recinto quando la linea si spegne.”

    Galdrick saluta la tribuna con due dita, in armatura scura. [somber] Ogni tanto si tocca il fianco dove la sciabola di Vesh l'ha aperto. [wry] Bram Halgast, a torso nudo come se fosse alla forgia, si batte sul palmo un martello da fabbro e racconta a chiunque sia a portata d'orecchio quanto costano le sue spade. Dragna Gro-Malog ha l'ascia già in mano, e il più grosso dei mercenari di Ghoran suda nella cotta di maglia prima ancora di cominciare. [tense] Il nano con le cicatrici si chiama Durgan e non ha detto una parola da stamattina. [softly] Fra gli altri c'è un mercenario di passaggio con lo scudo dipinto di fresco, che ogni tanto guarda la tribuna per vedere se sua madre è arrivata.

    [shouting] “Guerrieri della grande mischia!” grida Orazio. “Cominciate!”
  la-grande-mischia-dopo-vesh__1-vittoria: |
    [swords clashing] Dragna e il mercenario di Ghoran si cercano subito, e finiscono fuori dal recinto avvinghiati. [tense] Galdrick ne butta giù tre prima che Bram e Durgan gli vengano addosso insieme e lo spingano oltre la linea verde, e lo sceriffo, cadendo, si porta dietro il fabbro per la cintura. Poi Durgan si volta verso di te, con il mercenario dallo scudo dipinto. Il mercenario va giù per primo. [breathing heavily] Il nano ti costa una spalla che non senti più e il fiato, finché non scivola sulla sabbia e la sua ascia ti passa a un dito dall'orecchio.

    [exhales] Orvald ti mette in mano un fermaglio d'argento intrecciato. [deadpan] “Questo non è roba da bancarella” dice, [crowd cheering] mentre la tribuna urla il tuo nome.
  la-grande-mischia-dopo-vesh__1-sconfitta: |
    [pained] Durgan ti prende di piatto con il manico dell'ascia, e ti ritrovi in ginocchio con la schiena a un palmo dalla linea verde. Il calore del recinto ti brucia la nuca. [electric crackling] Un calcio del mercenario ti fa fare l'ultimo palmo, e la scarica del recinto ti butta sulla sabbia di fuori.

    [breathing heavily] Vince Galdrick come dicevano tutti, e lo fa senza fretta. [surprised] Mentre Orazio lo proclama, dalla tribuna però arriva il tuo nome, prima da un angolo e poi da tutti. Orvald si china sul registro. [deadpan] “La folla ti vuole nella prova a squadre” dice, “e io non litigo con la folla.”
  la-grande-mischia-dopo-vesh__2-successo: |
    [tense] Ti tieni a un passo dalla linea verde, con la pelle che formicola sul fianco, e lasci che al centro si facciano a pezzi fra loro. Vedi Bram e Durgan spingere Galdrick fuori dal recinto insieme, e lo sceriffo che si porta dietro il fabbro per la cintura. Il nano e il mercenario si voltano verso di te nello stesso momento. [wry] Il mercenario ti carica e tu ti sposti, e il recinto fa il resto. Durgan è più furbo e ti costa un taglio sull'avambraccio, finché non perde l'equilibrio sul bordo e la linea verde lo prende alla schiena.

    [exhales] Orvald ti porge un fermaglio d'argento intrecciato. [deadpan] “Questo non è roba da bancarella” dice. “Il bordo l'avevo pensato per i codardi. Tu l'hai usato meglio di loro.”
  la-grande-mischia-dopo-vesh__2-fallimento: |
    [pained] Un gomito di Bram ti arriva nelle costole mentre guardi da un'altra parte, e fai un passo indietro di troppo. [electric crackling] Il recinto ti brucia la schiena con un calore che ti toglie il fiato e ti butta fuori sulla sabbia, con la camicia che fuma e ti resta attaccata alla pelle. [bitter] L'inserviente che te la stacca ha la mano leggera, e fa male lo stesso.

    [resigned] Vince Galdrick, il favorito. Dalla tribuna però chiamano il tuo nome, e Orvald, chino sul registro, dice che la folla ti vuole nella prova a squadre e che lui con la folla non litiga.
  la-grande-mischia-dopo-vesh__3-successo: |
    [crowd roaring] Alzi l'arma verso la tribuna dei Quartieri Alti e poi verso quella della Città Bassa, e la seconda ti risponde con un boato che fa tremare le griglie. [satisfied] Da lì in avanti chi ti si avvicina lo fa con un occhio agli spalti. Bram e Durgan scelgono Galdrick, e lo spingono oltre la linea verde insieme, e lui si porta dietro il fabbro per la cintura. [crowd chanting] Quando il nano e il mercenario si voltano verso di te la folla scandisce il tuo nome, e il mercenario esce dal recinto da solo, rosso in faccia. [tense] Durgan resta, e ti costa una spalla e un labbro spaccato prima di andare giù.

    [exhales] Orvald ti porge un fermaglio d'argento intrecciato. [deadpan] “Questo non è roba da bancarella” dice.
  la-grande-mischia-dopo-vesh__3-fallimento: |
    [wry] Alzi l'arma verso la tribuna, e dalla tribuna ti arriva un torsolo di mela. [pained] Mentre lo schivi Durgan ti prende alle gambe con il manico dell'ascia e poi alle costole. Finisci sulla linea verde con tutta la schiena.

    [resigned] Vince Galdrick, il favorito. [surprised] Dalla tribuna però, a sorpresa, cominciano a chiamare il tuo nome, forse per il torsolo, e Orvald dice che la folla ti vuole nella prova a squadre e che lui con la folla non litiga.
  la-grande-mischia-dopo-vesh__4-successo: |
    [low humming] Senti il Mana del recinto ronzarti nei denti, e trovi il punto dove è più sottile. [determined] Quando Bram e Durgan spingono Galdrick verso il bordo, tu tiri la linea verde di un passo verso di lui, e lo sceriffo esce trascinandosi dietro il fabbro per la cintura. Il nano e il mercenario si voltano verso di te. [wry] Il mercenario finisce sul verde senza capire come. [breathing heavily] Durgan ti costa un taglio sul fianco e tutto il fiato che hai, prima che il recinto lo prenda alle spalle.

    Orvald ti porge un fermaglio d'argento intrecciato e ti guarda a lungo. [deadpan] “Questo non è roba da bancarella” dice. [pause] [coldly] “Il recinto, però, è roba mia.”
  la-grande-mischia-dopo-vesh__4-fallimento: |
    [electric crackling] Il Mana del recinto ti torna indietro tutto insieme, e per un momento vedi la sabbia diventare verde. [pained] Quando ci vedi di nuovo sei fuori dalla linea, seduto, con il sapore del rame in bocca e un tremito alle mani che non vuole passare.

    [resigned] Vince Galdrick, il favorito. Dalla tribuna però chiamano il tuo nome, e Orvald dice che la folla ti vuole nella prova a squadre e che lui con la folla non litiga.
  la-prova-a-squadre: |
    Il quarto della squadra si è presentato ieri sera al banco di Orvald. Tenebra ha firmato il modulo senza leggerlo e, quando Corin gli ha chiesto perché un capo dei Raschiatori si mettesse a fare il gladiatore, ha risposto senza alzare gli occhi. [coldly] “Voglio vedere Ferro perdere. Una volta.”

    [tense] Le quattro squadre avanzano in fila verso la sabbia. Dietro la tua vengono le altre due, e per ultima la squadra di Galdrick. [stone grinding] A metà strada il terreno si apre, e dal suolo salgono placche di metallo e pietra che dividono l'Arena in quadranti. [awed] Al centro del tuo emerge un cristallo conduttore alto due volte un uomo. Besk ci avvicina la mano senza toccarlo e la ritira subito, poi si sistema gli occhiali. [nervously] “Questa carica l'ho vista una volta sola, sull'altare della Cattedrale” dice piano. “Questi cristalli li ha caricati la Madre del Velo in persona. Quello che ne esce sarà un'eco.”

    [shouting] “Seconda fase!” La voce di Orazio scende dalle grate. “Contro di voi, Le bestie dell'Arena!”

    [electric crackling] Il cristallo si riempie di luce azzurra e scarica fulmini sulla sabbia, e dove cadono prendono forma i vermi carogna della Foresta Strisciante. [eerie] Sono pallidi come cera e un po' trasparenti ai bordi. Corin stringe la spada con tutte e due le mani. [tense] Tenebra ti guarda e aspetta che sia tu a dire come si fa.
  la-prova-a-squadre__1-successo: |
    [determined] Tenebra si mette alla tua sinistra senza che glielo chiedi, e per due giri nessuna bestia passa fra voi. I vermi carogna si sfasciano in schegge di luce. Il cristallo vi bagna di un calore che chiude i tagli, poi Orazio annuncia le peggiori tra le belve, [metal screeching] e dal cristallo escono due Camminatori della Salvaguardia, le macchine dei Precursori, con le giunture che stridono come quelle vere.

    Tenebra ne ferma uno con la lama di traverso. Tu e Besk fate cadere l'altro, [wry] e Corin gli siede sopra finché non smette di muoversi. [exhales] Nel silenzio che segue Tenebra si pulisce la lama sulla manica e ti fa un cenno solo.
  la-prova-a-squadre__1-fallimento: |
    [tense] Tieni la prima fila, ma i vermi carogna sono troppi e uno ti si avvolge al polpaccio prima che Tenebra lo tagli. Il cristallo vi chiude le ferite, e poi arrivano i Camminatori della Salvaguardia, le macchine dei Precursori. [pained] Uno ti schiaccia contro la placca di pietra con il suo braccio piatto.

    [breathing heavily] Ne venite fuori, ma ti resta addosso il suo stampo. Corin ti aiuta a rialzarti e ti chiede se essere un eroe fa sempre così male. [deadpan] Tenebra risponde di sì al posto tuo.
  la-prova-a-squadre__2-successo: |
    [quietly] Besk ti sussurra quello che sente nel cristallo, [thoughtful] e tu lo guardi finché capisci che prima di ogni lampo la luce si addensa da un lato. [satisfied] Da lì in avanti ogni verme carogna nasce con te già sopra. Il cristallo vi cura, e quando escono i Camminatori della Salvaguardia sapete da che parte arriveranno, e Tenebra li aspetta lì con la lama.

    [amused] Besk scrive qualcosa su un quaderno che tiene nella manica. Corin vuole sapere che cosa, e lei gli risponde che è un appunto per Orvald e che non lo riguarda.
  la-prova-a-squadre__2-fallimento: |
    [pained] Guardi il cristallo così fisso che non vedi il verme carogna alle tue spalle, e Besk lo brucia quando ti ha già morso il braccio. Il cristallo vi cura, e i Camminatori della Salvaguardia escono dal lato che non guardavi. [tense] Tenebra ne prende uno da solo, e tu ti fai schiacciare un piede dall'altro prima di buttarlo giù.

    [wry] Besk si scusa due volte a voce rapida, e Corin si scusa con lei perché si sta scusando. Tenebra intanto si pulisce la lama sulla manica e aspetta il giro dopo.
  la-prova-a-squadre__3-successo: |
    [determined] Dai ordini corti a voce alta, e dopo il primo verme carogna anche Tenebra li segue. [amused] Corin smette di tremare quando gli dai un compito solo, coprire Besk, che lui esegue con un impegno commovente. Il cristallo vi cura, e quando escono i Camminatori della Salvaguardia la squadra si apre e si chiude intorno a loro al tuo grido.

    [crowd chanting] Dalla tribuna qualcuno ripete i tuoi ordini per gioco, e alla fine li ripete mezzo settore.
  la-prova-a-squadre__3-fallimento: |
    [crowd roaring] Nel frastuono Corin non ti sente. [tense] Besk ti sente benissimo e discute ogni ordine, mentre Tenebra fa come gli pare. I vermi carogna vi passano fra le gambe. Il cristallo vi cura, poi i Camminatori della Salvaguardia vi dividono in due, [pained] e tu prendi i colpi destinati a Corin.

    [hoarse] Alla fine ne uscite in piedi tutti e quattro, ma tu hai la voce andata e una costola che scricchiola.
  la-prova-a-squadre__4-esito: |
    [tense] Tenebra comanda come nei tunnel, quasi senza parlare. Tutti e tre gli obbedite. [wry] Funziona, ma lui vi tratta come Raschiatori, e ai Raschiatori tocca il lavoro peggiore. I vermi carogna li tieni lontani tu a pedate per un tratto, e il primo Camminatore della Salvaguardia lo fermi con la spalla.

    [exhales] Quando il cristallo vi cura l'ultima volta, Tenebra ti batte una mano sulla schiena, come si fa con le reclute.
