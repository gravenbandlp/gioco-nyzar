# Regia del doppiaggio: Capomozzo (prima parte)
regia:
  la-strada-per-capomozzo: |
    [wry] Galdrick è tornato da Ghoran da pochi giorni, e gli si legge ancora addosso. Ha gli stivali grigi del fango dei clan e la barba di una settimana, e nel cortile, sotto la finestra, una trentina di mercenari con la faccia cotta dal sole litiga ancora con il furiere per le brande. Sul muro dell'ufficio il calendario è fermo al giorno della sua partenza, perché in sua assenza nessuno si è preso la responsabilità di girare la pagina, e lui da quando è tornato non ci ha ancora messo mano.

    Il tavolo è coperto dal rapporto sulla cripta di Sollen e dal diario di Isvaro, che si è fatto prestare appena sei entrato e che tiene aperto sulle mappe. Galdrick li rilegge davanti a te, muovendo le labbra.

    [gruff] “Ho messo in fila quello che mi hai portato” dice, con i pollici nella cintura. “Dalla Biblioteca è sparita ogni riga su Capomozzo, e il mezzelfo se ne vanta nel suo diario. [serious] La sua donna, Aurenne, tiene in pugno gli orchi e cerca un Costruttore sotto la fortezza. Nelle mappe gli orchi sono quattrocento.”

    Batte un dito sulla carta della costa nord, dove il Rovolungo è un tratteggio di spine e Capomozzo una macchia d'inchiostro nel mare. [gruff] “Da Ghoran ho portato trenta lance, e mi servono tutte sulle mura. Una squadra sulla costa la vedono arrivare da un giorno di distanza, una persona sola forse no. Sono due giorni e mezzo di cammino. [short pause] Voglio sapere che cosa c'è su quell'isola prima che quelli dell'isola vengano da noi.”

    [whispers] [uneasy] Ti sta chiedendo di andarci da solo, e lo sa benissimo. Lo stomaco ti si stringe, e intanto le dita hanno già cominciato a contare le fibbie dello zaino.
  la-strada-per-capomozzo__1-esito: |
    [wry] Il furiere ti riempie lo zaino di gallette e di carne secca, e ti fa firmare la ricevuta per ogni galletta. Esci dalla porta nord all'alba. Il primo giorno cammini fra i campi, il secondo fra colline sempre più spoglie, e la notte dormi con la schiena contro una roccia e il mantello tirato fin sopra le orecchie. La mattina del terzo giorno il vento comincia a sapere di sale. [tired] A mezzogiorno hai le vesciche ai talloni, e davanti a te, alto come una casa, c'è il muro di spine del Rovolungo.
  la-strada-per-capomozzo__2-esito: |
    Il cavallo prende la strada del nord prima al passo e poi al trotto, e le colline ti scorrono accanto senza che le gambe se ne accorgano. [amused] Dormi una notte sola all'aperto, con le redini legate al polso, e il cavallo ti sbuffa nell'orecchio ogni volta che un gufo si fa sentire. A metà del secondo giorno l'aria diventa salmastra e gli alberi cominciano a piegarsi verso l'interno. [wry] Leghi il cavallo a un pino storto lontano dai rovi, e mentre ti allontani lui ti guarda masticando.
  la-strada-per-capomozzo__3-esito: |
    [wry] Si chiama Hagra, ha la faccia segnata da tre righe di argilla secca e mastica resina dalla mattina alla sera. Conta le monete due volte e le fa sparire nello stivale. Ti porta per sentieri da capre che sulla carta di Galdrick non ci sono, e la notte ti fa dormire in una grotta asciutta, dove i cacciatori lasciano la legna pronta per chi viene dopo.

    [gruff] “Ai rovi ti lascio, eh” dice il terzo giorno, sputando la resina. “Le foche le cacciavo io. [deadpan] Gli orchi li lascio a te, eh.”

    [satisfied] Arrivi al muro di spine con le gambe riposate, e quando ti volti lei è già un puntino sulla collina.
  la-strada-per-capomozzo__4-esito: |
    Si chiama Hagra, ha la faccia segnata da tre righe di argilla secca e mastica resina. [quietly] Quando le chiedi la strada nella lingua dei clan smette di masticare e ti guarda i polsi, dove i ferri dei recinti lasciano un segno che non va più via. [determined] Le dici da dove vieni senza abbassare gli occhi.

    [gruff] “Da uno scappato dalla bilancia la paga non si prende, eh” dice, e sputa la resina. Ti porta per sentieri da capre che sulla carta di Galdrick non ci sono, e la notte ti fa dormire in una grotta asciutta con la legna già pronta. [warm] Al muro di spine ti lascia con una pacca sulla spalla, e quando ti volti è già un puntino sulla collina.
  la-grotta-del-ghermitore: |
    [tense] Leghi la corda al paletto del gabbiano e ti cali nel Buco Ululante, con il vento che ti sale addosso a ogni onda. Il pozzo è lungo una ventina di metri e si apre nella volta di una grotta, tre metri sopra l'acqua. Ti lasci scivolare fino a una sporgenza di roccia larga un passo e lunga quattro, che sul lato sud è l'unico punto asciutto.

    [awed] La grotta scintilla. Le pareti bagnate sono coperte di ricci di mare e di anemoni. L'acqua sale e scende fra gli scogli senza mai fermarsi. [eerie] Sulla sporgenza ci sono ossa di foca e lo scheletro di un uomo, con la cintura degli attrezzi da Raschiatore ancora allacciata in vita. Accanto al teschio c'è una maschera di metallo grigio, liscia, che la salsedine non ha nemmeno sfiorato.

    [water bubbling] Poi l'acqua gorgoglia. [fearful] Si apre una schiuma scura, e dalla schiuma esce una testa lucida fatta per metà di carne e per metà di metallo, con le scaglie d'acciaio corroso e due occhi dorati senza pupilla che si accendono nella penombra. [steam hissing] La bocca si apre a scatti su due file di denti d'acciaio ricurvi, e dalle giunture escono sbuffi di vapore che sanno di olio bruciato. [swallows] Senti la corda che ti scivola fra le dita sudate.
  la-grotta-del-ghermitore__1-vittoria: |
    [tense] Il Ghermitore si getta sulla sporgenza tre volte, e alla terza la tua lama trova la carne fra due scaglie. Si ritira sott'acqua lasciando una scia scura e oleosa, e non torna più a galla. [exhales] Fra i denti d'acciaio che ha perso sulla roccia c'è un cristallo grezzo che pulsa ancora. Lo prendi, poi prendi la maschera grigia accanto al teschio del Raschiatore, e risali la corda con le braccia che tremano.
  la-grotta-del-ghermitore__1-sconfitta: |
    [urgent] Il Ghermitore ti prende per una caviglia e ti tira giù, e per un tempo lungo quanto il fiato che hai vedi soltanto bolle e una luce dorata. [gasps] Riesci a liberarti con un calcio e riemergi sotto la volta, e con le ultime forze ti aggrappi alla corda. [exhausted] Risali a mani vuote, e in cima ti stendi accanto al cerchio di sassi a vomitare acqua di mare.
  la-grotta-del-ghermitore__2-successo: |
    [tense] Aspetti che l'onda si ritiri e lanci il gabbiano che hai staccato dal paletto contro la parete opposta, dove l'acqua è più bassa. [metal clanging] Il Ghermitore ci si gira contro con uno scatto di metallo, e mentre lo sbrana ti chini sullo scheletro e prendi la maschera grigia. È fredda e più leggera di quanto sembrava. [satisfied] Quando torna a guardare la sporgenza sei già a metà della corda.
  la-grotta-del-ghermitore__2-fallimento: |
    Lanci il gabbiano verso la parete opposta, e l'onda lo riporta indietro fino ai piedi della sporgenza. [tense] Il Ghermitore lo prende, e con lo stesso slancio prende anche il tuo stivale. Ti trascina nell'acqua fino alle ginocchia prima che tu riesca ad aggrapparti alla corda, e risali con il polpaccio aperto fino all'osso e senza la maschera. [pained] In cima ti fasci la gamba con la camicia, seduto accanto al cerchio di sassi, e la camicia diventa rossa prima che tu abbia finito il nodo.
  la-grotta-del-ghermitore__3-successo: |
    [calm] Dici l'ordine nella lingua delle macchine, e gli occhi dorati del Ghermitore si spengono uno dopo l'altro. Resta a galla immobile, con il vapore che gli esce piano dalle giunture, finché la corrente lo porta sott'acqua. [relieved] Prendi la maschera grigia accanto al teschio e un cristallo che pulsa fra le ossa di foca, e risali con un gusto di ferro sulla lingua.
  la-grotta-del-ghermitore__3-fallimento: |
    Dici l'ordine e il Ghermitore si ferma. [eerie] Inclina la testa da un lato e ripete il suono più forte e più storto con la sua bocca di metallo, e il suono ti rimbomba dentro il cranio finché non vedi più niente. [pained] Quando ti si schiarisce la vista sei già sulla corda, a metà strada, con il naso che sanguina e una mano aperta dai denti d'acciaio. [uneasy] Il suono storto ti resta nel cranio fino a sera, e ogni tanto ti sembra di sentirlo anche nel rumore delle onde.
  la-grotta-del-ghermitore__4-successo: |
    [quietly] Aspetti che il Ghermitore si immerga e strisci sulla sporgenza a pancia in giù, con l'acqua che ti bagna i gomiti. Sfili la maschera da sotto il teschio piano, perché le ossa non facciano rumore, e torni indietro allo stesso modo. [tense] Sei già sulla corda quando l'acqua si apre alle tue spalle e i denti d'acciaio si chiudono sul vuoto.
  la-grotta-del-ghermitore__4-fallimento: |
    [tense] A metà della sporgenza il ginocchio fa rotolare un osso di foca nell'acqua, e l'acqua si apre subito. I denti d'acciaio ti si chiudono sull'avambraccio e ti tirano verso il bordo, e ti liberi soltanto lasciandoci la manica e un pezzo di pelle. [breathing heavily] Torni alla corda strisciando all'indietro e risali a forza di gomiti, lasciando sulla roccia una scia di sangue. [bitter] Sotto di te il Ghermitore gira in tondo ancora per un pezzo, poi si immerge.
  borgoth-e-cenerascura: |
    [ominous] A cento passi dai pali del ponte, dove i rovi tornano a chiudersi sul bordo della scogliera, c'è un'ultima camera doppia. [bones rattling softly] Dal soffitto di spine scende un groviglio di rampicanti, e ai viticci sono appesi scheletri di uccelli e mascelle di volpe che tintinnano quando passa l'aria. [wry] A sud c'è un grosso nido di ortiche, e dai topi mezzi mangiati che lo circondano si capisce che chi ci dorme ha l'abitudine di mangiare a letto.

    [tense] L'inquilino del nido è sveglio, e ti guarda. È un orco più alto di qualunque orco tu abbia mai visto, e a Fondobosco raccontano che sua madre fosse un'ogre. Ha la pelle spessa e venata di muschio, e fra le cicatrici gli crescono fili d'erba. Al collo porta denti e ossa infilati in uno spago. [uneasy] Accanto a lui, sdraiato, c'è un puma dal pelo color brace, che apre la bocca e lascia uscire un filo di vapore caldo.

    [gruff] “Borgoth sa perché sei qui” dice l'orco, e si alza. “L'odore di Qir-Azel, Borgoth lo sente da tre stanze, e anche Cenerascura.”

    [dramatic] Alza le braccia e grida parole in una lingua che non è l'orchesco. [fire crackling] Dalle cicatrici gli filtrano fiammelle dorate, e dalle spalle gli spuntano rami carbonizzati che si piegano all'indietro. Quando ha finito è alto quasi tre metri, con la pelle diventata corteccia nera, e il corpo per metà è fuoco e per metà sottobosco. [fearful] Il caldo ti arriva in faccia, e le gambe vorrebbero tornare da sole nel tunnel.
  borgoth-e-cenerascura__1-vittoria: |
    [tense] Il puma ti arriva addosso per primo, e quando lo ricacci indietro con un taglio sul muso si ritira in un angolo della camera, soffiando. Borgoth è più lento. Il fuoco gli si spegne addosso un colpo alla volta, e quando cade in ginocchio fra le ortiche è di nuovo un orco grande e ansante, con il fumo che gli sale dalle spalle. [exhales] Gli metti la lama alla gola, e lui ride piano.
  borgoth-e-cenerascura__1-sconfitta: |
    [pained] L'ultima cosa che vedi è il braccio di corteccia che cala, e poi le ortiche contro la faccia. [long pause] Quando riapri gli occhi la camera è vuota e fredda, e del fuoco restano soltanto i segni neri sui rampicanti. [bitter] Borgoth e il puma ti hanno lasciato vivo in mezzo alle ortiche, e le loro impronte vanno verso est, dalla parte di Fondobosco. [breathing heavily] Ti trascini fino al ponte con le costole che scricchiolano a ogni respiro.
  borgoth-e-cenerascura__2-successo: |
    [softly] Ti abbassi sui talloni e porgi al puma il dorso della mano, parlando piano, mentre il calore ti arriccia le sopracciglia. Il puma ti annusa a lungo e poi si stende fra te e il suo padrone, con il mento sulle zampe. [relieved] Borgoth abbassa le braccia. Il fuoco gli si ritira sotto la pelle con un sibilo, e resta un orco grande, [amused] che guarda il suo puma come se lo avesse tradito.
  borgoth-e-cenerascura__2-fallimento: |
    [tense] Il puma ti annusa la mano e poi la prende fra i denti, e mentre cerchi di liberarti ti apre la spalla con una zampata. [whistle] Borgoth fischia una volta. Il puma ti lascia e corre da lui, e il gigante di fuoco ti guarda a lungo dall'alto. Poi si gira e sparisce nei tunnel verso est. [bitter] Resti fra le ortiche a tamponarti la spalla con la manica, e quando la manica è zuppa ti alzi e vai verso il ponte.
  borgoth-e-cenerascura__3-successo: |
    [calm] Dici la parola del Richiamo, e il puma si ferma a metà del salto e atterra di fianco, scrollando la testa. Lo chiami ancora, e lui viene a strusciarsi contro le tue gambe con un rumore di brace che si spegne. Borgoth guarda prima il suo puma e poi te, e abbassa le braccia. [wry] Il fuoco gli si ritira sotto la pelle, e resta un orco grande e offeso, con il fumo che gli esce dalle spalle.
  borgoth-e-cenerascura__3-fallimento: |
    [tense] La parola ti esce storta, e il puma la prende per una sfida. Ti salta addosso e ti butta a terra, e senti il suo fiato caldo sulla faccia prima che Borgoth lo richiami con un fischio. [bitter] Il gigante ti scavalca senza degnarti di uno sguardo e se ne va nei tunnel verso est, con il puma alle calcagna. [pained] Ti rialzi con il petto rigato di graffi fino alla cintura, e cominci a camminare verso il ponte tenendoti la camicia premuta addosso.
  borgoth-e-cenerascura__4-successo: |
    [calm] Gli dici che sei venuto per Balthog e per chi gli dà gli ordini, e che con Fondobosco non hai niente da spartire. [tense] Borgoth resta fermo, con le fiamme che gli corrono sulle braccia. [short pause] Poi sputa per terra, e lo sputo sfrigola. [relieved] Il fuoco gli si ritira sotto la pelle un poco alla volta, e resta un orco grande che si siede su una radice e fa cenno al puma di stare giù.
  borgoth-e-cenerascura__4-fallimento: |
    Gli dici che sei venuto per Balthog, e Borgoth ride. Poi ti colpisce con il dorso della mano, senza nemmeno chiudere il pugno, e ti manda a sbattere contro il muro di spine.

    [coldly] “Borgoth non parla con chi viene da Qir-Azel” dice, e se ne va nei tunnel verso est con il puma.

    [resigned] Hai la guancia gonfia e un dente che si muove, e ci metti un pezzo a staccarti le spine dalla schiena. Poi prendi la strada del ponte.
  borgoth-e-cenerascura__5-esito: |
    [quietly] Ti sposti contro la parete con le mani lontane dalla cintura e lasci libero il passaggio. [tense] Borgoth ti guarda a lungo, con il fuoco che gli scorre sulle braccia. Poi grugnisce, abbassa la testa sotto i rampicanti e se ne va nel tunnel verso est, e il puma gli trotta dietro voltandosi due volte. Lo senti allontanarsi fra i rovi per un pezzo. [exhales] Quando non senti più niente prendi la strada del ponte.
  borgoth-parla: |
    [calm] Borgoth siede fra le ortiche con le mani aperte sulle ginocchia, e dalle spalle gli sale ancora un filo di fumo. Da vicino ha un odore di terra bagnata e di resina, e sotto c'è il pelo bruciato. Il puma è accucciato a qualche passo, con le orecchie basse, e non ti stacca gli occhi di dosso.

    [gruff] “Borgoth sa perché sei qui. Per quello che gli orchi hanno fatto a Qir-Azel” dice, e sputa per terra. [bitter] “È colpa della Mawrak'Thur e delle sue macchine che camminano.”

    Si gratta il muschio sul petto. [gruff] “Il Capotribù Balthog adesso ascolta lei. È una donna molto arrabbiata, con i capelli d'argento e gli occhi strani, e una cicatrice che le taglia la pancia. [mocking] Borgoth pensa che il Capotribù Balthog se ne sia innamorato, perché fa tutto quello che lei dice. È stata lei a volere l'attacco a Qir-Azel.” Batte il pugno sul terreno. [angry] “Allora Borgoth si è tenuto lontano dal Capotribù Balthog e dai suoi amici nuovi, perché quella donna porta guai a tutta la stirpe degli orchi.”

    [whispers] [uneasy] I ritratti di Isvaro avevano i capelli chiari e una mano posata sul ventre. Borgoth ti guarda di sotto in su, e aspetta la domanda successiva.
  borgoth-parla__1-esito: |
    [wry] Borgoth mostra i denti in un ghigno storto perché la domanda gli piace, e alza la mano con le dita chiuse. Sulle nocche ha ancora qualche scaglia di corteccia nera, che gli cade sulle ginocchia mentre apre il primo dito. Il puma alza la testa al rumore e la riabbassa. [amused] Ti accorgi che anche tu stai contando, piegando le dita contro la coscia senza volerlo.
  borgoth-parla__2-esito: |
    [gruff] “Il Capotribù Balthog non ha mai perso” dice Borgoth. “Combatte con le mani, e non ha una cicatrice. Prima ascoltava gli sciamani di Capomozzo. [scoffs] Adesso ascolta la donna, e gli sciamani li ha mandati a pescare.”

    Ci pensa sopra grattandosi il mento, dove il muschio è più fitto, e poi alza la mano con le dita chiuse. [slyly] “Però la donna non è sola.”
  borgoth-e-gli-alleati: |
    [slyly] “Non è finita” dice Borgoth, e apre un dito alla volta. “Con la donna ci sono altri quattro. Zagrath il predone, che ha la madre ogre come Borgoth e nient'altro come Borgoth. Un uomo che non parla mai e gira chiuso in un'armatura pesante. Una donna con la pelle ambrata, che ha bruciato con il fuoco gli orchi che le andavano troppo vicino. Poi un mezzelfo che ride sempre e tira con l'arco meglio di un orco.” Abbassa la mano e se la pulisce sul ginocchio, come dopo aver mangiato. [gruff] “E una trentina di fedeli suoi, che dicono di essere del Culto dell'Anonimo e che lei è la loro capa.”

    [whispers] [bitter] Il mezzelfo che ride l'hai visto alla fornace, con una bottiglia accanto al gomito. Borgoth intanto ha ricominciato a ghignare, e si passa la lingua sulle zanne prima di continuare.

    [mocking] “Il mezzelfo e la donna, Borgoth li ha visti nel bosco fare come i ratti. [bitter] Quando lo ha detto al Capotribù Balthog, per tornare nelle sue grazie, il Capotribù Balthog ha cacciato via Borgoth.” Sputa ancora per terra, e poi ti guarda dritto con gli occhi gialli come l'ambra.

    [solemn] “Borgoth è pronto, ed è fiero guerriero della tribù di Fondobosco. Tornerà alla terra, a cui tutto appartiene” dice, e resta ad aspettare con le mani aperte sulle ginocchia.
  borgoth-e-gli-alleati__1-esito: |
    Gli leghi i polsi dietro la schiena con i rampicanti più grossi, e poi le caviglie, e Borgoth ti lascia fare guardando il soffitto. [chuckles] Quando stringi l'ultimo nodo ride piano.

    [slyly] “Le radici si slegano” dice. “Ma Borgoth aspetta.”

    Il puma ti segue con gli occhi fino all'uscita, accucciato accanto al suo padrone. [relieved] Fuori il vento del mare ti asciuga il sudore sulla fronte, e il ponte è a cento passi.
  borgoth-e-gli-alleati__2-esito: |
    [somber] Borgoth chiude gli occhi prima che tu ti muova, e non li riapre più. [sorrowful] Quando è finita il puma esce dall'angolo e gli si stende accanto, con il muso sul suo petto, e non si sposta nemmeno quando gli passi vicino. Ti pulisci la lama su un ciuffo d'erba e resti un momento a guardarli. [bones rattling softly] Poi vai verso il ponte, e il tintinnio delle ossa d'uccello lo senti fino all'uscita.
  borgoth-e-gli-alleati__3-esito: |
    Gli dici di andarsene, e Borgoth ti guarda come se non avesse capito. Poi si alza piano e fischia al puma. [short pause] Sulla soglia del tunnel si ferma.

    [gruff] “Il ponte cade sotto chi corre” dice senza voltarsi. [amused] “Borgoth lo ha visto cadere sotto due orchi di Capomozzo, e ha riso.”

    [calm] Lo senti allontanarsi fra i rovi verso est, con il puma che gli trotta dietro, finché il vento del mare copre il rumore dei passi.
