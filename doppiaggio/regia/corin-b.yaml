    È mattina presto, e dalle finestre inchiodate del Grifone entra una luce a strisce che taglia i tavoli in due. Stai finendo il pane quando Corin Ashdale si alza dal tavolo accanto al camino e viene verso di te, [amused] scansando le sedie con piccoli inchini anche quando sono vuote. Dai giorni dell'Arena porta ancora il pettine nel taschino, accanto al fazzoletto di seta piegato a punta.

    [excited] “Eccellente, eccellente, vi ho trovato” dice, e si inchina anche a te. “Alloggio qui finché non riparto per Laresh, e Liaren mi ha detto a che ora scendete a fare colazione.” Ride piano prima che tu abbia detto niente, poi posa sul tavolo un borsello di cuoio. [shyly] “Un ringraziamento per l'Arena, e per avermi tenuto in squadra. Lo so che è poco, mi vergogno quasi a darvelo.”

