# Regia del doppiaggio: La caccia di Corin
regia:
  corin-al-grifone: |
    È mattina presto, e dalle finestre inchiodate del Grifone entra una luce a strisce che taglia i tavoli in due. Stai finendo il pane quando un uomo si alza dal tavolo accanto al camino e viene verso di te, [amused] scansando le sedie con piccoli inchini anche quando sono vuote. Avrà poco più di trent'anni. È bello e un po' pallido, con un panciotto ricamato a foglie d'acero e un fazzoletto di seta al taschino piegato a punta.

    [politely] “Domando scusa per il disturbo” dice, e si inchina anche a te. “Corin Ashdale, membro eletto della Gilda dei Mercanti. Alloggio qui finché non riparto per Laresh, e Liaren dice che eravate fra quelli che hanno tenuto testa agli orchi.” Ride piano prima che tu abbia detto niente, poi posa sul tavolo un borsello di cuoio. [shyly] “Un ringraziamento per chi ha difeso la città. Lo so che è poco, mi vergogno quasi a darvelo.”

    Si siede senza aspettare l'invito e racconta che nella Foresta Strisciante i cacciatori hanno visto un cinghiale grande come un carro. Lui vorrebbe andarci, solo che gli hanno consigliato di non andarci da solo. [eagerly] “A cosa fatta vi pago molto più di questo borsello. Poi un banchetto, qui. [earnestly] Vorrei imparare come si fa, sapete, a essere un eroe. Voi lo fate tutti i giorni.”

    [somber] Sotto il tavolo la sua mano scende a cercare la testa di un cane che non c'è più, e risale a sistemare il fazzoletto. [whispers] [sad] Questo qui paga da bere a tutta la sala, e non ha nessuno con cui farlo. Dal bancone Liaren vi guarda e intanto continua ad asciugare lo stesso boccale.
  corin-al-grifone__1-esito: |
    [amused] Corin batte le mani una volta sola e si guarda intorno per vedere se qualcuno se n'è accorto. [excited] “Eccellente, eccellente” dice. “Allora ci vediamo alle Scuderie della Zanna Rotta, in Città Bassa. I cavalli li pago io, naturalmente. È stato il signor Stroud a consigliarmi la Foresta, e lui è un cacciatore vero.”

    Prima di uscire si ferma al bancone a saldare il conto della giornata con Brunella, che conta le monete sul palmo. Dalla porta ti fa ancora un cenno con la mano, [wry] e per farlo urta lo stipite con la spalla.
  corin-al-grifone__2-successo: |
    Gli spieghi il conto delle frecce e degli stivali, [wry] e Corin ti ascolta annuendo come se gli stessi insegnando un mestiere. Poi sfila dal panciotto un'altra manciata di monete e te le mette in mano senza contarle. [cheerfully] “Naturale, naturale. Anche gli eroi mangiano” dice, e lo annota su un taccuino con la copertina di pelle. Quando se ne va sbirci la pagina rimasta aperta sul tavolo. [pause] C'è il tuo nome scritto con cura, e accanto non c'è nessuna cifra.
  corin-al-grifone__2-fallimento: |
    [hesitant] Ti impappini sui numeri, e Corin ti guarda con una gentilezza che ti scalda le orecchie. Ti spiega che alla Gilda prima si fa il lavoro e poi si prende la paga, e che la regola non l'ha inventata lui. Poi ride per primo, come per scusarsi della regola. [wry] Al tavolo accanto due Raschiatori hanno sentito tutto, e quando Corin se ne va uno dei due ti fa l'occhiolino da sopra il boccale.
  corin-al-grifone__3-esito: |
    Ti alzi per un'altra pinta, e al bancone Liaren ti parla senza smettere di asciugare. [deadpan] “Corin? Paga ottimi giri, e ai bottegai della Città Bassa presta soldi che poi non chiede indietro” dice. “Organizza cene, e alle sue cene non viene mai nessuno. Io lo tollero, che è più di quanto faccio con il resto della Gilda.” Gira il boccale controluce. “Se ti offre una caccia, la caccia è vera e la paga pure. [quietly] Gli amici invece se li deve trovare da solo.”

    [warm] Torni al tavolo e accetti, e Corin si illumina tanto che il Raschiatore seduto accanto si volta a vedere che cosa è successo.
  corin-al-grifone__4-esito: |
    Gli parli del banco vicino alla porta nord, e Corin smette di sorridere per la prima volta da quando si è seduto. [softly] Ti guarda in faccia a lungo, come quel giorno sotto il bancone, poi ti afferra il polso con tutte e due le mani. [emotional] “Le castagne” dice. “Me le sono sognate per tre notti di fila.”

    Aggiunge al borsello qualche altra moneta. [wry] Poi ci ripensa e ne aggiunge ancora, e ti promette che alla Casa dei Nodi il tuo nome lo sentiranno da lui. Quando ti lascia andare hai sul polso i segni delle sue dita, e accetti la caccia prima che te lo chieda una seconda volta.
  corin-al-grifone__5-esito: |
    Ti alzi e gli rendi l'inchino, quello giusto, con la mano sul petto e la testa piegata di un dito, come nei salotti si saluta un ospite di riguardo. [short pause] Corin resta un momento senza parole. [amused] Poi diventa rosso fino al fazzoletto e si inchina di nuovo, più profondo, urtando il tavolo con il ginocchio.

    Gli dici che accetti la caccia e che al suo banchetto ti siederai volentieri. [emotional] “Eccellente, eccellente” dice, e la voce gli si incrina sulla seconda parola. Prima di uscire paga da bere a tutta la sala come fa sempre. [warm] Stavolta però dal tavolo dei Raschiatori qualcuno alza il boccale verso di lui.
