    [somber] Sotto il tavolo la sua mano scende a cercare la testa di un cane che non c'è più, e risale a sistemare il fazzoletto. [whispers] [tender] All'Arena aveva paura, e ci è venuto lo stesso. Dal bancone Liaren vi guarda e intanto continua ad asciugare lo stesso boccale.
