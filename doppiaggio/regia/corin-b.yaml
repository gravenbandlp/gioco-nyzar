  scuderie-della-zanna-rotta: |
    Le Scuderie della Zanna Rotta stanno in fondo alla Città Bassa, dove le case finiscono e comincia l'odore di fieno. Sopra il portone c'è un'insegna dipinta con un cavallo da guerra impennato su un orco tagliato in due. [wry] Il rosso del sangue è stato ripassato di recente, ed è più vivo di tutto il resto dell'insegna.

    Corin ti aspetta nel cortile in abiti da caccia così nuovi che gli stivali scricchiolano a ogni passo. Al collo gli pende un corno d'ottone comprato ieri, [amused] e a giudicare dalla faccia dei vicini l'ha già provato. [excited] “I cavalli li pago io, ho insistito” dice. “Il signor Stroud dice che sono i migliori della città, e lui di cacce se ne intende.”

    Dolovan Stroud esce dalla stalla pulendosi le mani sui calzoni di cuoio. Ha i capelli scuri striati di grigio e una faccia più giovane dei suoi anni, con gli occhi che ti misurano dagli stivali in su. Dietro di lui un cavallo grigio enorme gli tiene il muso appoggiato sulla spalla, e lui gli gratta il collo senza voltarsi. [deadpan] “Squash” dice, quando vede che lo guardi. “Significa schiacciare. Avevo in mente nomi meno gentili.”

    Davanti alla stalla aspettano quattro cavalli con la sella militare e le sacche già allacciate. [whispers] [sarcastic] Corin il prezzo non l'ha chiesto, e a Stroud la cosa non è sfuggita. L'ultimo della fila è un baio con una cicatrice sulla spalla, e gira la testa per guardarti con un occhio solo.
  scuderie-della-zanna-rotta__1-successo: |
    Stroud ti porta nella selleria e con un pezzo di gesso disegna sulla porta un'impronta lunga quanto la tua mano aperta. [gruff] “L'ha misurata un mio vecchio socio. Un cinghiale normale ne fa la metà” dice, e batte il gesso sul legno. [ominous] “Sotto il Gradone Rosso ha trovato caprioli squartati e lasciati lì senza un morso, e una bestia che ammazza senza mangiare ha qualcosa di guasto nel sangue.”

    Ti dice di seguire le tracce verso la scarpata e di guardare dove metti i piedi, perché nella Foresta i cacciatori scavano fosse. [quietly] Poi aggiunge, più piano, che sotto il Gradone girano gli Spiumatori, [wry] e che per ogni orco che ti trovi davanti ti offre lui la birra.
  scuderie-della-zanna-rotta__1-fallimento: |
    Stroud ascolta le tue domande guardando Squash, che gli mastica piano il bavero. [gruff] “È grosso e ha brutte abitudini” dice. “Il resto lo vedrete da voi.” Poi torna nella stalla a controllare un ferro. [wry] Corin ti batte una mano sulla spalla per consolarti, con un entusiasmo che non avevi chiesto, e ti assicura che il signor Stroud fa così con tutti.
  scuderie-della-zanna-rotta__2-successo: |
    [calm] Passi lungo la fila con la mano aperta e ti fermi davanti al baio in fondo. Ti annusa le dita e poi la manica, e quando gli monti in sella non si sposta di un passo. Stroud incrocia le braccia e ti guarda montare. [gruff] “La cicatrice ce l'aveva già quando l'ho comprato” dice, senza staccarti gli occhi di dosso. “Lui non se la ricorda, [deadpan] e per questo ha un carattere migliore del mio.” [satisfied] Fai un giro del cortile al passo e uno al trotto, e Corin ti applaude dalla staccionata.
  scuderie-della-zanna-rotta__2-fallimento: |
    Scegli il sauro più alto della fila. Appena metti il piede nella staffa il cavallo gira su sé stesso [pained] e ti appoggia uno zoccolo sul piede. Stroud lo sposta con una parola, senza alzare la voce, e ti indica il baio in fondo, quello con la cicatrice sulla spalla. [deadpan] “Questo” dice. “Il sauro morde i mercanti, e oggi lo hai salvato da Corin.” [wry] Zoppichi fino alla staffa giusta, e lo zoccolo te lo senti fino a sera.
  scuderie-della-zanna-rotta__3-esito: |
    Corin passa davanti ai cavalli con le mani dietro la schiena e ogni tanto si ferma a guardarne uno negli occhi. [wry] Per fare conversazione chiede a Stroud se gli è mai capitato di parlare con un orco, così, per capire come ragionano. Stroud si gira lentamente verso di lui, [tense] e nel cortile si sente soltanto Squash che mastica.

    [coldly] “Una volta” dice Stroud, e torna a stringere una cinghia. [short pause] “Ha smesso presto.”

    [uneasy] Corin ride per primo, e poi da solo. Alla fine sceglie per te il baio in fondo alla fila, quello con la cicatrice sulla spalla, perché secondo lui ha lo sguardo intelligente. Stroud annuisce, e per il resto della mattina a Corin non rivolge più la parola.
  scuderie-della-zanna-rotta__4-esito: |
    [bitter] Gli dici che a Ghoran i sorveglianti dei recinti erano orchi, e che hai imparato presto a guardarli alle mani invece che in faccia. Stroud smette di grattare il collo di Squash e ti porta nella selleria. Con un pezzo di gesso disegna sulla porta un'impronta di zoccolo lunga quanto la tua mano aperta. [gruff] “Un cinghiale normale ne fa la metà” dice. [ominous] Sotto il Gradone Rosso ha trovato caprioli squartati e lasciati lì senza un morso.

    Poi batte il gesso sul legno. [coldly] “Laggiù girano anche gli Spiumatori, che un padrone non l'hanno mai avuto e mordono lo stesso.” Ti dice di seguire le tracce verso la scarpata e di guardare dove metti i piedi, [wry] e che per ogni orco che ti trovi davanti la birra la offre lui.
  scuderie-della-zanna-rotta__5-esito: |
    [calm] Passi lungo la fila senza toccare nessuno e ascolti i respiri. Il sauro soffia corto e tiene le orecchie indietro, gli altri due masticano il morso pensando al fieno. Il baio in fondo respira piano, e quando arrivi davanti a lui allunga il muso verso la tua manica. [tender] Gli appoggi il palmo sulla cicatrice, e lui non si sposta.

    Stroud ti guarda montare con le braccia incrociate. [thoughtful] “Il Circolo” dice, guardandoti le mani. “Lassù i cavalli li ascoltate prima di sellarli. [deadpan] In città si fa al contrario, e si vede.” [satisfied] Fai un giro del cortile al passo e uno al trotto, e Corin ti applaude dalla staccionata.
