# Regia del doppiaggio: Sotto la pelle di Qir-Azel (seconda parte)
regia:
  la-cassa-nel-pilone: |
    I conti di Ottone non dicono dove sia la cassa degli Scuri. Dicono soltanto che due volte all'anno un uomo dei Malgrani porta una borsa al quarto pilone, e Galdrick ha contato i piloni del Ponte delle Mille Corde dal lato della Città Bassa. [ominous] Il quarto è un tronco di ferro precuriano largo quanto una torre, piantato nella roccia della Cicatrice, e a metà altezza ha uno sportello tondo che da sopra non si vede.

    Ci arrivi dalla piattaforma di servizio sotto le assi, dove di giorno i Custodi di Passaggio si allenano al tiro. [eerie] Di notte i sacchi di paglia restano appesi alle rastrelliere con le loro facce disegnate a carbone, e uno ha una freccia piantata nell'occhio da settimane. Dalla piattaforma al pilone corre una passerella di corde, e sulla cengia davanti allo sportello [dice rattling] tre uomini degli Scuri giocano a dadi su una cassa rovesciata.

    [cart wheels rumbling overhead] Sopra la tua testa passano i carri della notte, e la polvere delle assi ti cade nel colletto. [tense] Uno dei tre si alza e tende l'orecchio verso il ponte. Più in alto, sulla campata, un ragazzo corre verso la Città Bassa senza lanterna. [whispers] [uneasy] Sanno che arriva qualcuno, anche se non sanno chi. [inhales deeply] Ti asciughi le mani sui calzoni, una alla volta, prima di toccare le corde.
  la-cassa-nel-pilone__1-successo: |
    [tense] Scavalchi il parapetto e scendi lungo le catene di sostegno, una maglia alla volta, con la luce della Cicatrice che ti sale fra le gambe. Arrivi sopra lo sportello mentre i tre litigano su un tiro di dadi, ti lasci cadere dentro e sprangi lo sportello dall'interno.

    La cassa è di ferro, inchiodata al pavimento del pilone, e qualcuno l'ha già svuotata a metà. Il resto lo cali in un sacco con la corda di servizio fino alla piattaforma, dove ti aspettano due mercenari di Galdrick. [satisfied] Poi risali per le catene, e quando i tre si accorgono che lo sportello è chiuso da dentro tu sei già sulla passerella.
  la-cassa-nel-pilone__1-fallimento: |
    [tense] A metà discesa una maglia ti si apre sotto il piede, e resti appeso per le mani sopra la luce della Cicatrice. [chains rattling] Il rumore della catena arriva fino allo sportello. Quando ci arrivi i tre ti aspettano con i coltelli fuori, e devi passare in mezzo a loro con le braccia ancora intorpidite.

    [bitter] Ne esci con un taglio lungo il braccio e con la cassa mezza vuota, perché il grosso era partito prima di te. I mercenari di Galdrick tirano su il sacco con la corda di servizio. [uneasy] Uno dei tre Scuri, scappando lungo la passerella, grida il tuo nome verso la Città Bassa.
  la-cassa-nel-pilone__2-vittoria: |
    [quickly] Attraversi la passerella di corsa, con le corde che ti ondeggiano sotto i piedi. Il primo dei tre ti viene incontro e lo rimandi indietro addosso agli altri. Uno si aggrappa alle corde e scappa su verso il ponte, e gli altri due li lasci legati alla rastrelliera dei bersagli, accanto ai sacchi con la faccia a carbone.

    [exhales] La cassa di ferro è inchiodata al pavimento del pilone, e qualcuno l'ha già svuotata a metà. Il resto lo cali in un sacco fino alla piattaforma, dove i mercenari di Galdrick lo contano due volte [wry] e te lo firmano su una ricevuta.
  la-cassa-nel-pilone__2-sconfitta: |
    [tense] Ti prendono a metà della passerella, nel punto in cui oscilla di più. Un colpo ti manda contro le corde e per un momento sei fuori, con la luce della Cicatrice sotto la schiena e una mano sola stretta alla fune. [breathing heavily] Ti tirano su i mercenari di Galdrick, che hanno sentito il rumore dalla piattaforma.

    [bitter] I tre Scuri sono scappati verso il ponte con quello che sono riusciti a portare via. Nella cassa del pilone resta un fondo di monete, che i mercenari contano due volte mentre tu, seduto sulle assi, [exhausted] non riesci a smettere di tremare.
  la-cassa-nel-pilone__3-successo: |
    [slyly] Svegli il caposquadra dei Custodi alzando la voce quanto basta, e gli parli di crepe nel quarto pilone e di un rapporto da consegnare alla Casa dei Nodi entro l'alba. [wry] Un ispettore di notte lui non l'ha mai visto, e proprio per questo ti crede. Manda sei uomini con le lanterne sulla passerella.

    I tre Scuri non possono fare a botte con mezza squadra dei Custodi sotto gli occhi del ponte intero, e se ne vanno brontolando. Il caposquadra apre lo sportello per te e guarda la cassa di ferro mezza vuota senza fare domande. [satisfied] Quando arrivano i mercenari di Galdrick gli lasci una ricevuta firmata con un nome inventato.
  la-cassa-nel-pilone__3-fallimento: |
    Il caposquadra dei Custodi ti ascolta in camicia da notte, poi ti chiede il sigillo della Casa dei Nodi, [wry] e tu il sigillo non ce l'hai. Manda lo stesso i suoi uomini sul pilone, più per curiosità che per altro, e i tre Scuri se ne vanno senza fretta, con una sacca a testa sulle spalle.

    [bitter] Nella cassa resta il fondo, che i mercenari di Galdrick contano all'alba. Il caposquadra intanto ha descritto la tua faccia nel registro dei Custodi alla voce falso ispettore, [uneasy] e prima di sera qualcuno alla Casa dei Nodi la legge.
  la-cassa-nel-pilone__4-successo: |
    [tired] Resti accucciato fra i bersagli per tre ore, con le gambe che ti si addormentano e la polvere delle assi che ti cola nel colletto. Due volte i tre si caricano una sacca a testa e salgono verso il ponte, e due volte tornano. [quietly] La terza volta ne resta uno solo, che si addormenta sulla cassa rovesciata.

    [creaking hinge] Lo sportello cigola appena. Dentro, la cassa di ferro è svuotata a metà, e la metà che resta pesa ancora parecchio. [amused] La cali fino alla piattaforma con la corda di servizio, e l'uomo sulla cassa rovesciata dorme a bocca aperta finché non lo svegliano i mercenari di Galdrick.
  la-cassa-nel-pilone__4-fallimento: |
    [tired] Resti accucciato fra i bersagli per tre ore, e alla terza ti scivola un piede contro una rastrelliera. [wood clattering] I tre Scuri sentono il rumore e smettono di perdere tempo. [tense] Si caricano tutto quello che possono e salgono verso il ponte in fila, lasciando lo sportello aperto.

    [bitter] Nella cassa di ferro trovi soltanto il fondo, qualche borsa che nessuno è riuscito a portare. I mercenari di Galdrick la contano all'alba, sbadigliando. [resigned] Tu hai le gambe che non ti reggono e il colletto pieno di polvere, e per tutto il giorno ti sembra di sentire i carri passarti sopra la testa.
  la-cassa-nel-pilone__5-esito: |
    [calm] Scavalchi il parapetto e scendi dal lato del vuoto con i piedi incrociati sulla catena e le mani sempre su due maglie, come sulle piattaforme dei turni. La luce della Cicatrice ti sale fra le gambe e tu non la guardi. Arrivi sopra lo sportello mentre i tre litigano su un tiro di dadi, ti lasci cadere dentro e sprangi dall'interno.

    La cassa di ferro è inchiodata al pavimento del pilone, già mezza vuota. Il resto lo cali in un sacco con la corda di servizio fino alla piattaforma, dove ti aspettano i mercenari di Galdrick, e risali per le catene senza fretta. [satisfied] Quando i tre si accorgono dello sportello chiuso sei già sulla passerella.
  la-cassa-nel-pilone__6-esito: |
    [knocking on wood] Bussi alla baracca dei Custodi e metti la licenza della Gilda sotto il naso del caposquadra, ancora in camicia da notte. Lui passa il pollice sul sigillo in rilievo, come fanno tutti i Custodi, e si sveglia del tutto. [coldly] Gli parli di una crepa nel quarto pilone che il tuo banco ha segnalato alla Casa dei Nodi, e gli chiedi perché nessuno l'abbia controllata. Poco dopo sulla passerella ci sono sei uomini con le lanterne.

    I tre Scuri non possono fare a botte con mezza squadra dei Custodi sotto gli occhi del ponte, e se ne vanno brontolando. Il caposquadra apre lo sportello per te. [satisfied] Sulla ricevuta dei mercenari di Galdrick, stavolta, ci metti il tuo nome vero.
  il-carceriere: |
    [somber] Galdrick ha ricopiato su un foglio la sigla dei conti di Ottone, e il foglio è in mezzo al tavolo. Sono due lettere storte, Ca, e accanto c'è una chiave disegnata con cura fino all'ultimo dente. Sotto il calendario la cassa di ferro che si apre con due chiavi è aperta, e dentro ci sono gli ordini di servizio per i mercenari di Ghoran, uno per ogni tuo colpo.

    [gruff] “Ogni volta sono arrivati prima di te” dice senza alzare gli occhi dal foglio. “Una volta la porta era già sbarrata, un'altra volta un ragazzo correva via davanti a te. Dei posti sapevamo io e il furiere, e lo sapeva questa cassa. Le carte di Ottone le tengo a casa mia, ma gli ordini con il giorno e l'ora li scrive il furiere, e la sera li chiude qui dentro.” Batte un dito sulla chiave disegnata. [quietly] “La seconda chiave ce l'ha il furiere, che dorme a casa sua. Le copie di tutte le chiavi della Caserma, di notte, stanno appese a un anello solo giù nelle celle.”

    [pause] Il nome non lo dice. [bucket set down on stone] Dal corridoio arriva il rumore di un secchio posato sulla pietra, [heavy footsteps on stone] poi un passo pesante che scende verso le celle. Galdrick infila i pollici nella cintura e guarda la porta. [whispers] [bitter] Lo sa da giorni, e non voleva saperlo. Ti accorgi di aver abbassato la voce anche tu, con la porta chiusa.

    [hoarse] “Un quarto dei miei è pagato da Vesh” dice alla fine, a voce più bassa. “Se lo accuso io, domattina la Caserma si spacca in due. [determined] Mi serve che qualcuno di fuori lo veda con le mani nella cassa.”
  il-carceriere__1-esito: |
    [gruff] “L'ho preso io, otto anni fa” dice Galdrick. “Era arrivato da Ghoran con il naso rotto e nient'altro, e in cella non si è mai fatto comprare da un detenuto, nemmeno per un tozzo di tabacco. [sad] Mette da parte ogni moneta in una scatola di latta, per riscattare i figli dai mercati di Ghoran.”

    [sighs] Si guarda le mani. [bitter] “Vesh paga meglio della Caserma, e paga prima. Ci voleva poco a capirlo, e io in otto anni non l'ho capito.”
  il-carceriere__2-esito: |
    [gruff] “Per il torneo gli ho dato la licenza” dice Galdrick, “e nella Mischia lui, insieme a Durgan, mi ha spinto fuori dal recinto a due mani. [laughs bitterly] Ho riso, mi sembrava una cosa da caserma.” Scuote la testa.

    [somber] “L'ho preso io otto anni fa, quando è arrivato da Ghoran con il naso rotto. Mette da parte ogni moneta in una scatola di latta per riscattare i figli dai mercati di Ghoran, e Vesh paga prima della Caserma. [bitter] In otto anni non l'ho capito.”
  il-carceriere__3-esito: |
    [gruff] “Per il torneo gli ho dato la licenza” dice Galdrick. “Voleva fracassare qualche cranio, e l'ho lasciato fare, perché mi sembrava una cosa da caserma.” Scuote la testa.

    [somber] “L'ho preso io otto anni fa, quando è arrivato da Ghoran con il naso rotto. Mette da parte ogni moneta in una scatola di latta per riscattare i figli dai mercati di Ghoran, e Vesh paga prima della Caserma. [bitter] In otto anni non l'ho capito.”
  il-carceriere__4-successo: |
    [tense] Ti nascondi dietro l'armadio delle pratiche e aspetti. [distant bell tolling] Dopo la terza campana la porta si apre senza rumore. [quietly] Borso entra in calze, con l'anello delle chiavi stretto nel pugno perché non tintinni, e apre la cassa di ferro con due chiavi che non dovrebbe avere. Copia l'ordine di servizio su un foglietto con la sua matita minuscola, muovendo le labbra sulle parole.

    Quando esci dall'ombra non scappa subito. Prima guarda te, poi il foglietto che ha in mano. [slowly] Lo piega in quattro con cura e se lo mette in bocca.
  il-carceriere__4-fallimento: |
    [tense] Ti nascondi dietro l'armadio delle pratiche, ma dopo la seconda campana ti si addormenta una gamba e la sposti. [floorboard creaking] L'asse sotto il tuo piede scricchiola. La porta si stava aprendo, e adesso si richiude piano. [heavy footsteps on stone] Nel corridoio senti un passo pesante che torna verso le celle senza fretta.

    [bitter] All'alba la cassa di ferro è chiusa e l'anello delle chiavi pende dal suo chiodo, come tutte le mattine. [uneasy] Adesso però Borso sa che lo aspettavate.
  il-carceriere__5-successo: |
    [slyly] Scendi alle celle all'ora del rancio e, passando davanti al tavolo in fondo al corridoio, chiedi a Galdrick quanti uomini servono per il quinto pilone. [coins clinking] Borso conta le sue monete senza alzare la testa. [quietly] Il quinto pilone è vuoto, e a saperlo siete soltanto tu e lo sceriffo.

    All'alba sulla piattaforma di servizio arrivano quattro Scuri con i piedi di porco, e dietro i sacchi di paglia li aspettano i mercenari di Galdrick. [satisfied] Uno dei quattro, prima ancora che lo leghino, giura che la soffiata viene dalle celle della Caserma.
  il-carceriere__5-fallimento: |
    Scendi alle celle all'ora del rancio e chiedi a Galdrick del quinto pilone, [wry] ma lo chiedi troppo forte e guardando Borso. [coins clinking] Lui smette di contare e rimette le monete nella scatola di latta. [uneasy] Poi ti guarda a lungo da sotto le sopracciglia, e capisce.

    [somber] Quella notte nessuno va al quinto pilone. Galdrick passa la sera alla finestra dell'ufficio a guardare il cortile, con i pollici nella cintura.
  il-carceriere__6-vittoria: |
    [keys jangling] Borso picchia con il pugno chiuso sull'anello delle chiavi, e ogni colpo ti lascia addosso l'impronta di una serratura. [breathing heavily] Alla fine lo metti in ginocchio sulla paglia di una cella vuota. [somber] Nella tasca del grembiule ha un foglietto con l'ordine di servizio copiato a matita, e le parole che non sapeva scrivere le ha disegnate.

    [footsteps on stone] Galdrick scende le scale di corsa e si ferma sull'ultimo gradino. [sad] Guarda prima il foglietto e poi Borso, a lungo, senza dire niente.
  il-carceriere__6-sconfitta: |
    [pained] Borso ti prende per il collo della giubba e ti sbatte contro le sbarre finché le sbarre non smettono di girare. [cold] Ti lascia sulla paglia di una cella vuota e chiude la porta a chiave con calma, come tutte le sere, e poi sale le scale.

    Galdrick ti apre poco dopo con la seconda copia della chiave. [tense] Nel corridoio la scatola di latta non c'è più, e dal chiodo dove stava appeso l'anello delle chiavi pende soltanto un pezzo di spago. [urgent] Salite di corsa verso il cortile.
  il-carceriere__7-successo: |
    [coldly] Ti siedi al suo tavolo mentre conta e gli posi una mano sopra la pila delle monete. Gli parli della corda che aspetta un carceriere venduto, e di chi resta senza le monete della scatola di latta quando il carceriere non le manda più. [pause] Borso guarda la tua mano a lungo.

    [hoarse] “Vesh paga prima” dice alla fine, con la voce bassa di sempre. “La Caserma paga a fine mese, e a Ghoran i mercanti di bambini non aspettano.” [somber] Tira fuori dal grembiule un foglietto con l'ordine di servizio copiato a matita e lo posa sul tavolo, accanto alla latta.
  il-carceriere__7-fallimento: |
    Gli posi una mano sopra la pila delle monete e cominci a parlare della scatola di latta e di chi aspetta quelle monete. Borso ti lascia finire senza interromperti. [tense] Poi si alza, e la clava corta che porta alla cintura gli è già passata in mano senza che tu la veda muoversi. [pained] Il primo colpo ti prende sotto le costole e ti piega, il secondo sulla spalla, e poi ti spinge indietro fino alla scala con la punta, un passo alla volta, senza alzare la voce.

    [menacing] “Dei miei figli tu non parli” dice, con la clava ferma a un palmo dal tuo petto. [bitter] Quando Galdrick scende a vedere, Borso ha già staccato l'anello delle chiavi dal chiodo e sta salendo verso il cortile.
  il-carceriere__8-successo: |
    [somber] Ti siedi al suo tavolo mentre conta e gli racconti della bilancia del mercato di Ghoran, dei bambini che ci fanno salire per primi perché pesano poco e si vendono bene. [softly] Lo dici piano, con le mani ferme sul legno, come ti hanno insegnato i recinti. Borso smette di contare e tiene una moneta a mezz'aria. Gli dici che quando un carceriere venduto finisce sulla corda le monete smettono di partire, e che i mercanti lo sanno prima della famiglia.

    [long pause] Borso guarda a lungo la scatola di latta. [hoarse] “Vesh paga prima” dice alla fine. Tira fuori dal grembiule un foglietto con l'ordine di servizio copiato a matita e lo posa sul tavolo, accanto alla latta.
  il-carceriere__8-fallimento: |
    Cominci a parlargli della bilancia di Ghoran, e a metà Borso alza gli occhi dalle monete. [uneasy] Capisce da dove vieni prima che tu finisca la frase. [tense] La clava corta gli passa in mano senza che tu la veda muoversi, e il primo colpo ti prende sotto le costole. Il secondo ti spinge indietro fino alla scala.

    [menacing] “Proprio tu vieni a dirmi di Ghoran” dice, con la clava ferma a un palmo dal tuo petto. [bitter] Quando Galdrick scende a vedere, Borso ha già staccato l'anello delle chiavi dal chiodo e sta salendo verso il cortile.
