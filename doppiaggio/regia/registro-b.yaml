# Regia del doppiaggio: Il registro del custode
regia:
  il-registro-cifrato: |
    [calm] Il primo piano della Biblioteca è un corridoio di stanzette piene di carte. Quella di Mattias Crenn è l'ultima, con la porta che non si chiude per via di una pila di monografie appoggiata contro lo stipite. [wry] Sulla costola della prima c'è il timbro rosso della Confraternita, respinta, e lui accanto ci ha disegnato a matita un piccolo teschio.

    Posi il registro sul tavolo. [tired] Ti accorgi di averlo tenuto stretto contro il petto per tutta la salita, e la giubba ha preso l'odore della pelle umida. Mattias si pulisce le lenti sulla manica e apre il libro a metà. [pause] Per un po' resta zitto. Poi gira svelto tre pagine di fila e comincia a parlare a raffica.

    [quickly] “Le date sono numeri, e anche le somme. I disegnini sono le merci e le persone. Questa ruota è un carro, questo sacco è grano. È il cifrario di un custode, fatto da uno che un testo precuriano non l'ha mai visto in vita sua.” Batte l'indice su una pagina. [muttering] “La chiave però cambia ogni mese. Si fa, si fa. Ci vuole una notte, oppure qualcuno che sappia contare quasi quanto me.”

    Si toglie gli occhiali e ti guarda per la prima volta. [bitter] “Trent'anni di Precursori, e questa città mi porta il libro mastro di un contrabbandiere. Una città intera mi deve un riconoscimento.” Poi si rimette gli occhiali e intinge la penna.
  il-registro-cifrato__1-successo: |
    Tu leggi i numeri e lui li scrive su un foglio, in colonna. [satisfied] Verso mezzanotte trovi la regola per primo. Il primo numero di ogni mese è la chiave, e tutto il resto va spostato di tanto. [amused] Mattias ti guarda da sopra le lenti e dice “bene” a denti stretti, e per un po' si pulisce gli occhiali più del necessario.

    [tired] All'alba il registro è aperto sul tavolo accanto a quaranta fogli di trascrizione, e Mattias dorme con la guancia su una monografia respinta. Tu hai la nuca rigida e gli occhi che bruciano, e cominci a leggere.
  il-registro-cifrato__1-fallimento: |
    Leggi i numeri ad alta voce, ma per due volte salti una riga, e la seconda volta Mattias se ne accorge dopo un'ora di conti. [sighs] Si toglie gli occhiali e si stropiccia gli occhi, e da lì in avanti non ti lascia più leggere. [wry] Ti manda giù a prendere l'olio per la lampada e poi il pane, e quando torni ha già ricominciato da capo.

    [tired] All'alba la trascrizione è finita, tutta con la sua grafia. Tu hai passato la notte seduto sulle scale, e lui ti consegna i fogli senza guardarti, borbottando [muttering] che in fondo era un cifrario da bambini.
  il-registro-cifrato__2-esito: |
    Gli metti le monete sul tavolo e gli dici che sono per il vino di stasera. [amused] Mattias le guarda come se fossero un'offesa. Poi le conta e se le infila nella manica. [deadpan] “Ulric beve soltanto quello delle colline di Laresh” dice, e ti accompagna alla porta lasciando il registro aperto sul tavolo.

    Quando torni, il giorno dopo, il registro è accanto a una bottiglia vuota e a una pila di fogli scritti fitti, e Mattias ha gli occhi rossi. [hoarse] “Ulric dice che sono un genio” racconta mentre ti porge i fogli, “e al terzo bicchiere lo dice sempre, ma stavolta aveva ragione.”
  il-registro-cifrato__3-esito: |
    Gli racconti che Temmerin, al primo anno, vi mette davanti i libri dei contrabbandieri sequestrati, e che la prima regola è cercare la riga che torna uguale all'inizio di ogni mese. [wry] Mattias storce la bocca al nome del preside, però ti lascia fare.

    [satisfied] Trovi la riga a metà della terza pagina. Il primo numero di ogni mese è la chiave, e tutto il resto va spostato di tanto. [amused] Mattias rifà il conto due volte e dice “bene” fra i denti, come se gli costasse una moneta. [tired] All'alba la trascrizione è finita, e lui dorme con la guancia su una monografia respinta, mentre tu rileggi i fogli con gli occhi che bruciano.
  l-archivio-dei-dazi: |
    [calm] L'archivio dei dazi occupa una sala lunga al secondo piano della Casa dei Nodi, con le finestre sulle catene dei ponti e il vento che fa tintinnare i vetri. Gli scaffali sono pieni di registri tutti uguali, e su ogni costola è inchiodato un tassello di legno inciso con un segno. Lira Demos lavora a un tavolo vicino alla finestra. È una mezzelfa con i capelli castani intrecciati di fili di rame sottili, e accanto al calamaio tiene una scatola di tasselli che ordina per forma mentre ascolta.

    Ti ascolta senza interromperti, e intanto le dita continuano a ordinare i tasselli. [short pause] Quando posi sul tavolo il registro di Maedric si fermano. [thoughtful] Lo apre con la punta di due dita, e ti fa venire in mente un medico che finalmente vede la ferita che aveva indovinato da lontano.

    [softly] “Sono sei anni che gli scrivo dietro tutto quello che vedo, e non avevo niente in mano” dice piano, e gira una pagina. Ti spiega che i numeri sono i turni di Maedric e che i disegni sono i segni dei tasselli dell'archivio, quelli del vecchio cifrario dei custodi, copiati male. [wry] Per Lira i conti dei ponti sono pratica notarile, e vedere i segni del suo archivio in mano a un contrabbandiere le dà quasi più fastidio delle somme.

    Un garzone passa con una pila di registri, e lei chiude il libro di pelle con il palmo, senza fretta. Poi ti fa cenno di sederti e avvicina la lampada.
  l-archivio-dei-dazi__1-successo: |
    Lira tira giù dagli scaffali sei anni di pedaggi notturni, e tu li leggi accanto ai turni di Maedric, una notte alla volta. Ogni volta che nel registro di pelle c'è un disegno e nei libri della Gilda non c'è niente, lei posa un tassello sul tavolo. [satisfied] A metà pomeriggio il tavolo è coperto di tasselli, e la chiave del cifrario si legge da sola nell'ordine in cui li ha messi.

    [warmly] “Bel lavoro” dice Lira, e ti lascia tenere il tassello a forma di sacco, il primo che hai trovato tu.
  l-archivio-dei-dazi__1-fallimento: |
    Leggi i turni di Maedric accanto ai pedaggi notturni, ma confondi due anni, e per un'ora Lira posa tasselli sulle notti sbagliate. [quietly] Quando se ne accorge non alza la voce. Raccoglie i tasselli uno per uno e li rimette nella scatola in ordine di forma, poi ricomincia da sola dalla prima pagina.

    [tired] Finisce che è buio. Tu hai passato il pomeriggio a portarle registri su e giù per la scala, e il garzone ti ha visto ogni volta con il libro di pelle sotto il braccio. [wry] Lira ti consegna la trascrizione in una grafia minuta e diritta, e ti ringrazia lo stesso.
  l-archivio-dei-dazi__2-esito: |
    [wry] Lira ti scrive una ricevuta per il registro e subito dopo la strappa, perché per iscritto non promette niente a nessuno. “Torna con la luce” dice, e chiude il registro nel cassetto del tavolo.

    Il giorno dopo la trovi allo stesso tavolo, con la camicia di ieri e un filo di rame che le è scappato dalla treccia. Ha trascritto tutto in una grafia minuta e diritta, e nei margini ha fissato un tassello accanto a ogni notte che anche lei aveva annotato per conto suo, e sono parecchie. [warm] Ti porge i fogli tenendoli con due mani.
  l-archivio-dei-dazi__3-esito: |
    Lira ti riconosce dal sigillo della licenza, perché la tua gabella passa dal suo tavolo. Le chiedi di tirare giù i pedaggi notturni, e mentre lei apre i registri tu ti segni le settimane in cui al Mercato dei Nodi il grano è calato di prezzo senza un motivo che un mercante sappia spiegare. [satisfied] Sono le stesse in cui nel libro di Maedric compare il sacco.

    Lira posa un tassello su ognuna, e prima di sera la chiave del cifrario si legge nell'ordine dei tasselli. [deadpan] “Sui Ponti vi insegnano a contare meglio che qui dentro” dice, e lo dice guardando gli scaffali, come un rimprovero alla Casa dei Nodi.
  il-registro-alla-pignatta: |
    [wry] All'ora del mercato la Pignatta Grassa è mezza vuota, e Mauro Scrocco ti indica il retrobottega con il mento prima ancora che tu apra bocca. Sugli scaffali di legno chiaro le cartelle portano ciascuna il nome di una famiglia e di un mestiere, scritti a mano. Su una qualcuno ha scritto a matita sigilli della Gilda, buoni, poi ha cancellato buoni e sopra ha scritto ottimi.

    Rozalia Marga siede al banco con la piuma d'oca dietro l'orecchio. Le metti davanti il registro di Maedric, e lei batte due volte la penna sul calamaio prima di toccarlo. [slowly] Lo sfoglia con l'unghia del mignolo, una pagina ogni due respiri, e a metà le si piega appena un angolo della bocca.

    [slyly] “Il cifrario dei custodi, quello vecchio con i disegnini” dice. “Alla Casa dei Nodi lo usano da quando ero ragazza, e io ci ho imparato a leggere, per la precisione. Maedric ci ha messo una chiave che cambia ogni mese e si crede furbo.” Chiude il registro con il palmo. [coldly] “Lo leggo in un pomeriggio. Ti avverto però che quello che passa per le mie mani finisce nelle mie cartelle” aggiunge, e indica gli scaffali con la penna.

    La sedia davanti al banco è più bassa di una spanna, e per guardarla devi alzare il mento. [whispers] [uneasy] Questa donna sa già quanto vale ogni riga di quel libro. [man laughing loudly] Dalla sala arriva la risata di Mauro, troppo forte per una battuta sola.
  il-registro-alla-pignatta__1-esito: |
    Rozalia conta le monete senza toccarle, spostandole una alla volta con la punta della penna, e ti dice di tornare al tramonto. Al tramonto la trascrizione è pronta, in una grafia piccola e diritta, legata con un nastro da pacchi.

    [uneasy] Sullo scaffale alle sue spalle c'è una cartella nuova, senza etichetta, dello stesso spessore. [slyly] “I conti li chiudo sempre in pari” dice, e batte due volte la penna sul calamaio. “Tu hai la tua copia, io la mia.”
  il-registro-alla-pignatta__2-esito: |
    Rozalia ti ascolta senza alzare gli occhi dal foglio. [coldly] “Squiggor mi doveva qualche moneta” dice. “Adesso non me le darà più, e le metto sul tuo conto con gli interessi.” Il prezzo è salito di conseguenza. Conta le monete con la punta della penna e ti dice di tornare al tramonto, senza chiamarti tesoro.

    [somber] Al tramonto la trascrizione ti aspetta su un angolo del banco, e la copia è già in una cartella sullo scaffale. Uscendo passi davanti a Mauro, che stavolta continua ad asciugare i bicchieri e non grida il tuo nome.
  il-registro-alla-pignatta__3-successo: |
    Le fai notare che nel registro ci sono pagamenti alla Pignatta, e che una copia sui suoi scaffali è proprio la carta che lo sceriffo verrebbe a cercare. [thoughtful] Rozalia ci pensa battendo la penna sul calamaio tre volte invece di due, fuori dal solito.

    [sighs] “Hai ragione, e mi secca” dice alla fine. Ti spinge indietro le monete con la penna e decifra il registro davanti a te, senza tenere niente. [satisfied] Al tramonto ti porge la trascrizione e brucia i fogli di prova nella stufa, uno per uno, mentre la guardi.
  il-registro-alla-pignatta__3-fallimento: |
    Le spieghi perché una copia sui suoi scaffali sarebbe un rischio anche per lei, e Rozalia ti ascolta con la testa piegata di lato. [amused] “Tesoro, i rischi li tengo in ordine alfabetico” dice. “Si paga lo stesso, e la copia resta a me.”

    [bitter] Al tramonto la trascrizione è pronta, legata con un nastro da pacchi. Sullo scaffale alle sue spalle c'è una cartella nuova dello stesso spessore, e lei non fa niente per nasconderla.
  il-registro-alla-pignatta__4-successo: |
    Le fai notare che nel registro ci sono pagamenti alla Pignatta, e che una copia sui suoi scaffali è proprio la carta che lo sceriffo verrebbe a cercare. [tense] Rozalia ti guarda a lungo, fredda, poi spinge indietro le monete con la penna.

    [coldly] “Lo faccio perché mi conviene, e per nessun altro motivo” dice. “Il conto di Squiggor resta aperto.” [relieved] Decifra il registro davanti a te senza tenerne copia, e al tramonto brucia nella stufa anche i fogli di prova, senza guardarti mentre lo fa.
  il-registro-alla-pignatta__4-fallimento: |
    Rozalia ti lascia parlare fino in fondo, poi ti dice che Squiggor le doveva qualche moneta e che le mette sul tuo conto con gli interessi. [coldly] “Il prezzo l'hai sentito, e la copia resta a me” dice. “Le ragioni buone portale a qualcuno che non ha appena perso un amico.”

    [somber] Al tramonto la trascrizione ti aspetta su un angolo del banco, e la copia è già in una cartella sullo scaffale. Mauro, quando esci, non alza la testa dai bicchieri.
  il-registro-decifrato: |
    [thoughtful] Il registro copre sei anni di notti. Ogni riga è un passaggio sul Ponte dei Morti che nei libri della Gilda non esiste. Accanto alla data ci sono la merce e la somma, e in fondo a ogni pagina c'è la parte di Maedric, sottolineata due volte.

    Le righe con il sacco sono quasi tutte per i Malgrani. È grano dei villaggi di pianura che passava di notte e finiva nei magazzini della Città Bassa senza timbro e senza gabella, all'inizio una volta al mese e negli ultimi cinque anni quasi ogni settimana. [somber] In fondo al registro ci sono i nomi, una ventina. Sono quasi tutti riscossori e custodi dei ponti, più tre funzionari della Casa dei Nodi, ognuno con la sua cifra mensile accanto. Ogni mese poi una somma va a un piccolo cappuccio disegnato, e accanto al primo cappuccio Maedric ha scritto in chiaro Pignatta. [short pause] Sono i pagamenti agli Scuri, uno per ogni mese di sei anni.

    [bitter] Di orchi o di una Dama d'Argento non c'è una riga. Ti accorgi di aver cercato quel nome con il dito su tutte le pagine, e la delusione ti lascia in bocca un sapore acido.

    [mysterious] Il nome di Tarquin Cordani compare una volta sola, in un margine, con il disegno di un occhio aperto e una nota cifrata che vuol dire non avvicinare. [pause] Fra tutti quelli della Gilda, nel registro di Maedric il Sovrintendente è l'unico che sembra pulito.
  il-registro-decifrato__1-esito: |
    Rifai il conto dei sacchi due volte, con un dito sulle righe e l'altro sulle somme. [somber] In sei anni sul Ponte dei Morti è passato di notte abbastanza grano da sfamare la Città Bassa per un inverno, e la Gilda non ne ha registrato un chicco.

    [determined] Per arrivare a Ottone Malgrani però non basta un sacco disegnato nel libretto di un contrabbandiere. Sul retro di un foglio ti segni di andare a vedere il Mulino Malgrani, l'unico rimasto in piedi in tutta la regione.
  il-registro-decifrato__2-esito: |
    Rileggi i nomi uno per uno. [wry] Due li conosci di vista, perché ti hanno fatto pagare la gabella all'imbocco con il sorriso. Accanto a ogni nome c'è la cifra del mese, e certe cifre sono più alte di quello che un riscossore guadagna in un anno.

    [ominous] Con questo registro in mano metà dei ponti di Qir-Azel ti deve qualcosa, e l'altra metà vorrebbe vederti cadere da uno di quelli. Chiudi il libro e lo leghi stretto con lo spago, facendo un nodo doppio.
  i-mulini-bruciati: |
    [water wheel turning] Il Mulino Malgrani sta dove la Città Bassa scende verso il Torvessa, un edificio di pietra blu con la ruota che gira giorno e notte e una nuvola di farina sempre sospesa davanti alla porta. In coda ci sono soprattutto donne con i sacchetti di tela, e qualche bambino mandato da solo che tiene le monete strette nel pugno. [wry] Sulla lavagna accanto alla porta il prezzo del sacco è stato cancellato due volte, e ogni volta riscritto più basso.

    In città lo sanno tutti. [somber] Negli ultimi cinque anni sono bruciati gli altri tre mulini della regione, e questo è l'unico che macina ancora. Alla Pignatta li mettono tutti nel conto della razzia, perché la razzia è l'ultima disgrazia che si ricordano, ma [short pause] l'ultimo incendio, a Rivopuma, è di due anni fa.

    [amused] Anselmo Brey, il responsabile, esce dalla porta infarinato fino ai gomiti e starnutisce tre volte prima di salutarti. Ha un tic al sopracciglio destro, e quando gli dici chi sei il tic accelera. La farina ti si posa sulle ciglia. [whispers] [curious] Quest'uomo ha paura di qualcosa che non sono io. Dietro il mulino un sentiero risale il torrente fuori dalla città, verso quello che resta del mulino di Rivopuma.
  i-mulini-bruciati__1-successo: |
    Gli chiedi chi gli porta il grano di notte, e Brey risponde troppo. [nervous] Racconta che dopo ogni incendio arrivavano carri dai villaggi che prima macinavano altrove, sempre dopo la seconda campana, e che lui firmava le bolle senza il timbro della Gilda perché così voleva il padrone. Ti dice anche che ha abbassato il prezzo della farina, e la sua provvigione insieme, perché la gente in coda la conosce per nome.

    Poi si ferma, con il sopracciglio che salta, e dice che loro hanno parlato di incendio doloso e lui ha abbassato i prezzi, perché è quello che può fare. [nervously] “Lo so che con gli incendi tutta la città ha cominciato a pensare ai Malgrani” aggiunge piano, guardando la coda davanti alla porta. [softly] “Ci penso anch'io, di notte.”
  i-mulini-bruciati__1-fallimento: |
    [wry] Gli chiedi degli incendi in generale, e Brey per mezz'ora ti parla della ruota che va ingrassata e del raffreddore che gli viene dalla farina. Quando torni sugli incendi starnutisce e dice soltanto [nervously] “Loro hanno detto incendio doloso. Io ho abbassato i prezzi.”

    [tense] Mentre esci un garzone del mulino ti passa accanto di corsa e prende la strada dei Quartieri Alti. Entro sera in casa Malgrani sapranno che qualcuno è venuto a fare domande, e da dietro la porta Brey ti guarda andare via con il sopracciglio che non smette di saltare.
  i-mulini-bruciati__2-successo: |
    [somber] Del mulino di Rivopuma restano i muri senza tetto e la ruota bruciata a metà, piegata nell'acqua. Fra le erbacce trovi i cocci di tre giare da olio, di quelle grosse da magazzino, ciascuna in un angolo diverso. [cold] Il fuoco è partito da tre punti insieme. La macina è spaccata da un cuneo di ferro ancora piantato nella fessura, e un mulino con la macina spaccata non lo ricostruisce nessuno.

    [satisfied] Torni in città con le mani nere di fuliggine e un coccio avvolto nel fazzoletto.
  i-mulini-bruciati__2-fallimento: |
    [somber] Del mulino di Rivopuma restano i muri senza tetto e la ruota bruciata nell'acqua. Giri fra le pietre per un'ora e trovi soltanto fuliggine e un nido di gazza nel camino, e [pained] uscendo ti tagli la mano su un chiodo arrugginito della ruota.

    Sulla strada del ritorno un vecchio che spacca la legna ti racconta di aver visto l'incendio da casa sua, con il fumo che saliva da tre angoli. [deadpan] Lo dice come si parla del tempo, e torna alla sua legna.
  i-mulini-bruciati__3-successo: |
    Brey ti lascia sedere al suo banco fra i sacchi e ti presta i libri del mulino, senza capire bene perché. Metti le date degli incendi accanto alle righe del registro di Maedric. [tense] Dopo ogni incendio, entro un mese, sul Ponte dei Morti cominciano a passare di notte carri di grano per i Malgrani, dagli stessi villaggi che macinavano al mulino bruciato. [cold] È successo tutte e tre le volte, e nei libri del mulino quel grano risulta comprato al mercato.

    Ricopi le date su un foglio a parte, in colonna. [wry] Brey ti guarda da dietro i sacchi e si dimentica di starnutire.
  i-mulini-bruciati__3-fallimento: |
    Metti le date degli incendi accanto alle righe del registro, ma i libri del mulino contano gli anni a modo loro, dalla fondazione della casata, e il registro di Maedric li conta come la Gilda. [tired] Ti perdi nei conti fino a sera.

    Alla fine l'unica cosa certa è che dopo l'incendio di Rivopuma sul Ponte dei Morti hanno cominciato a passare di notte i carri dei villaggi che macinavano lì. [resigned] Per gli altri due incendi le date ti ballano davanti agli occhi, e Brey ti accompagna alla porta con una lanterna.
  i-mulini-bruciati__4-esito: |
    [warm] Ti metti in coda dietro una lavandaia che ti tirava le orecchie quando rubavi le mele dal suo cesto, e lei ti chiede subito come stai e poi quanto costa il pane ai Ponti. In mezz'ora la coda ti racconta quello che Brey non dice. [quietly] I carri arrivano di notte, dopo la seconda campana, dai villaggi che macinavano a Rivopuma, e il garzone che li scarica beve alla Pignatta e parla troppo.

    Una vecchia con il sacchetto di tela aggiunge che il prezzo è sceso dopo ogni incendio, e che lei se l'è segnato col carbone sul muro di casa, una riga sotto l'altra. [wry] Quando arrivi alla porta Brey ti vede in mezzo alle donne, e il sopracciglio gli salta due volte.
  i-mulini-bruciati__5-esito: |
    [somber] Invece di fargli domande gli racconti che a Ghoran i sorveglianti dei recinti avevano lo stesso tic, l'ultima settimana prima che il padrone li vendesse insieme agli schiavi. Brey smette di starnutire all'improvviso. [quietly] Ti porta dietro i sacchi e parla a voce bassa, con gli occhi sulla porta.

    Dopo ogni incendio arrivavano di notte i carri dei villaggi che prima macinavano altrove, e lui firmava le bolle senza il timbro della Gilda perché così voleva il padrone. [bitter] “Ho abbassato il prezzo della farina” dice alla fine, “perché è l'unica cosa che qua dentro decido io.” [softly] Mentre lo dice il sopracciglio gli sta fermo, per la prima volta da quando sei arrivato.
  galdrick-e-il-registro: |
    Sul muro maestro dell'ufficio la crepa lasciata dalla razzia è coperta da una toppa d'intonaco fresco, più chiara del resto, dove qualcuno ha già appeso un calendario. Galdrick legge il registro di Maedric seduto, con la trascrizione accanto, e muove le labbra sui nomi mentre tu resti in piedi davanti al tavolo. [wry] Dopo un'ora ti accorgi di aver contato le pietre del pavimento, e sono trentasei.

    [gruff] “Maedric Holl lo conosco di fama da anni” dice alla fine, chiudendo il registro. “In tutto questo tempo nessuno era riuscito a mettergli addosso una carta. Gli Scuri vendono quello che passa sui ponti, e gli orchi sui ponti non ci passano. Con la razzia gli Scuri non c'entrano. [satisfied] Lo sospettavo, e adesso posso metterlo agli atti” aggiunge, e batte un dito sui cappucci disegnati.

    Si alza e infila i pollici nella cintura. [tired] “La Gilda si regola da sola, e Cordani è l'unico manico pulito che le resta. Ottone Malgrani invece siede in Consiglio, e Julia Castaldi gli deve il grano di mezza città. Per portarlo davanti al Consiglio servono prove che non si possano spiegare in nessun altro modo” dice, guardando la toppa sul muro.

    [quietly] “Contro gli Scuri mi muoverò quando avrò gli uomini” dice poi a voce più bassa, anche se la porta è chiusa. “Le carte adesso ci sono. Mi servono persone che non stiano né con la Gilda né con loro, e in città ne conto poche. Ti farò cercare” conclude, e torna a sedersi davanti al registro.
  galdrick-e-il-registro__1-esito: |
    Gli lasci il registro e la trascrizione, e gli racconti quello che hai visto ai mulini. Galdrick chiama il furiere e gli fa chiudere tutto nella cassa di ferro sotto il calendario, che si apre con due chiavi.

    [determined] “Con questo Cordani può ripulire la Casa dei Nodi se vuole, e io posso aspettare gli Scuri dove passano” dice. [warm] Ti stringe la mano forte, poi rimette i pollici nella cintura e torna a guardare il calendario come se ci avesse segnato sopra il giorno.
  galdrick-e-il-registro__2-esito: |
    Gli lasci il registro e la trascrizione, e gli racconti quello che hai visto ai mulini. Galdrick fa chiudere tutto nella cassa di ferro sotto il calendario, che si apre con due chiavi. Poi ti accompagna alla porta, e lì si ferma con la mano sulla maniglia.

    [hesitant] “E Nerissa…” comincia, e si corregge subito. [clears throat] “La casa di Via dei Rasoi, dopo la faccenda della ragazza rossa. È tranquilla, adesso?” [tender] Gli rispondi quello che sai, e lui annuisce piano, due volte. Quando apre la porta e ti saluta ha di nuovo la voce dello sceriffo.
  galdrick-e-il-registro__3-successo: |
    [quietly] Gli consegni il registro e la trascrizione, tranne quattro fogli che restano piegati nella fodera della tua giubba. Sono le pagine dei carri di grano per i Malgrani, ricopiate con la tua grafia. [tense] Galdrick conta i fogli muovendo le labbra. [relieved] Il numero gli torna, perché la trascrizione l'hai rinumerata tu, e li chiude nella cassa di ferro.

    [paper rustling] Uscendo dalla Caserma senti la carta frusciare a ogni passo, e tieni il braccio stretto contro il fianco fino in fondo alla discesa.
  galdrick-e-il-registro__3-fallimento: |
    Galdrick conta i fogli della trascrizione e alla fine alza gli occhi. [deadpan] “Ne mancano quattro” dice, e tende la mano aperta sopra il tavolo. [swallows] Li tiri fuori dalla fodera della giubba, e lui li mette nella cassa insieme agli altri. Poi prende il taccuino dalla tasca della divisa e ci scrive una riga con la sua matita corta.

    [calm] “Capisco perché l'hai fatto” dice senza cattiveria, mentre rimette il taccuino in tasca. [somber] “Però in questa città chi si tiene le carte per sé finisce per somigliare a Maedric” aggiunge, e ti accompagna alla porta.
  galdrick-e-il-registro__4-successo: |
    Gli ricordi le balestre nella nebbia del Ponte dei Morti, e gli fai notare che per un lavoro così la Caserma avrebbe mandato un sergente e sei uomini. [thoughtful] Galdrick ci pensa, poi apre la cassa delle spese di servizio e conta la somma sul tavolo di persona, senza chiamare il furiere.

    [gruff] “Firma qui” dice, e ti porge la ricevuta. [wry] “La prossima volta che sali su un ponte di notte, però, dimmelo prima.”
  galdrick-e-il-registro__4-fallimento: |
    Galdrick ti ascolta fino in fondo con i pollici nella cintura. [deadpan] Poi ti spiega che per i rapporti la Caserma ha un tariffario, e che alla voce registri sequestrati c'è scritta una cifra da niente. [bitter] Il furiere te la conta contro ricevuta.

    Lo sceriffo intanto guarda il calendario appeso sulla toppa d'intonaco, e quando ti saluta lo fa con un cenno del capo, senza togliere le mani dalla cintura.
  il-registro-alla-caserma: |
    Le due guardie al portone ti riconoscono e ti fanno passare con il registro sotto il braccio. [wry] Nel cortile il manichino con l'elmo ammaccato è ancora al suo posto, e adesso qualcuno gli ha dipinto sotto la visiera due baffi di vernice nera.

    Il furiere tiene il banco delle consegne in fondo al corridoio del mastio, sotto la teca con la spada di Ivo Carstan. [keys jingling] È un uomo piccolo, con le dita macchiate di ceralacca e un mazzo di chiavi alla cintura che tintinna ogni volta che si sporge. Posi sul banco il registro di pelle e la trascrizione, e lui smette di scrivere e ti guarda da sopra gli occhiali.

    Apre la prima pagina con la punta della penna e legge una riga. [tense] Poi la richiude subito, come se avesse toccato una pentola calda. [whispers] [tired] Quel libro mi è costato più notti di quante ne voglia contare. Ti accorgi di tenere ancora una mano sulla copertina.

    [nervously] “Roba per lo sceriffo” dice il furiere. “Queste carte le apre lui e nessun altro, e la cassa dove vanno si apre con due chiavi. Una ce l'ho io.”
  il-registro-alla-caserma__1-esito: |
    Galdrick arriva dal cortile dopo un'ora, con la polvere delle reclute sugli stivali. Legge il registro in piedi al banco del furiere, con la trascrizione accanto, e muove le labbra sui nomi.

    Quando arriva ai cappucci disegnati batte un dito sulla pagina e dice che gli Scuri vendono quello che passa sui ponti, e che gli orchi sui ponti non ci passano, quindi con la razzia non c'entrano. [satisfied] Lo sospettava da tempo, e adesso può metterlo agli atti. Gli racconti dei mulini, e lui ascolta con i pollici nella cintura. Poi fa chiudere tutto nella cassa di ferro e ti stringe la mano forte. [gruff] “Le carte che mi mancavano adesso ci sono. Contro gli Scuri mi muoverò quando avrò gli uomini giusti, e allora ti farò cercare.”
  il-registro-alla-caserma__2-esito: |
    Il furiere ti dice che lo sceriffo è ancora a Ghoran e che per il ritorno nessuno gli ha dato una data. Poi apre la cassa di ferro nell'ufficio con la sua chiave e con la copia dell'altra, che il carceriere gli porta su dalle celle, e ci chiude dentro il registro e la trascrizione.

    [wry] Gli racconti dei mulini, e lui scrive tutto su un foglio a parte con una grafia piccola e storta, da uomo che scrive sempre in piedi. Lo piega e lo infila nella cassa insieme al resto. Poi ti fa firmare una ricevuta e te ne dà la copia, con il sigillo della Caserma ancora tiepido. [warmly] “Quando torna lo legge prima di togliersi gli stivali” dice, “e poi ti farà cercare, perché con chi gli porta carte buone fa sempre così.”
