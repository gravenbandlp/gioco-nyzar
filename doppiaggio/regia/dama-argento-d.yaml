# Regia del doppiaggio: La Dama d'Argento
regia:
  scuri-via-dei-rasoi: |
    [tense] A quest'ora Via dei Rasoi è quasi vuota, e i pochi rumori scendono dalle finestre socchiuse, [pot clanging] una pentola che sbatte e un bambino che non ne vuole sapere di dormire. Al gomito della strada, con la schiena appoggiata al cristallo spento, c'è una donna snella con i capelli raccolti sulla nuca e una piuma da scrivere dietro l'orecchio. [ominous] Si pulisce le unghie con un coltellino da ufficio, senza fretta, un'unghia alla volta. L'inchiostro le arriva fino alla seconda falange.

    [whispers] [sarcastic] Una falsaria. O una che scrive molte lettere d'amore. [tense] Le tue mani, per conto loro, tornano vicino alla cintura.

    Tre passi dietro di lei c'è un uomo enorme, con una benda nera sull'occhio sinistro e le mani in tasca. Porta una giacca pesante anche se non fa freddo, e guarda un punto della strada a metà fra te e la donna. [ominous] Sui tetti delle case basse, ai lati opposti della via, stanno due sagome con le balestre, al riparo dietro i comignoli.

    La donna chiude il coltellino e lo fa sparire sotto la mantellina.

    [slyly] “Buonasera. Spero che la signora Dalvane ti abbia trattato come si deve. Mi chiamo Rozalia Marga, e lui è Squiggor. Su, saluta.” L'uomo non si muove. [mocking] “Gli è venuta la timidezza. Cerchiamo Rennick Dole, che sta tre passi dietro di te e spera che non ce ne accorgiamo. Tu ce lo consegni e noi torniamo a casa. Non serve firmare niente, anche se firmare è la mia specialità.”

    [tense] Quando i toni si alzano, Squiggor sposta il peso da un piede all'altro. In Città Bassa chi conosce gli Scuri sa che da quel momento restano pochi secondi per parlare.
  scuri-via-dei-rasoi__1-esito: |
    Le racconti quello che Rennick ti ha tradotto. [tense] Quando arrivi a Mawrak'Thur, Rozalia smette di sorridere. [urgent] “Aspetta. Ripeti la parola orchesca.” La ripeti. [thoughtful] “E Rennick la sa tradurre” dice, e si tocca la piuma dietro l'orecchio.

    Guarda Squiggor, poi di nuovo te. [slyly] “Facciamo così. Rennick te lo lascio per stanotte. Domani all'ora del mercato vieni alla Pignatta da solo e mi racconti tutto quello che sai. Se me lo racconti per intero, Mirko riceve un rapporto che lo soddisfa e nessuno torna a cercare nessuno. [menacing] Se domani ti aspetto per niente, vengo a cercarti io.”

    [relieved] Si stacca dal cristallo e si avvia verso Via del Salmone, con Squiggor tre passi dietro. Sui tetti le balestre spariscono dietro i comignoli.
  scuri-via-dei-rasoi__2-successo: |
    [determined] Glielo dici guardandola negli occhi, senza alzare la voce, e intanto le due balestre sui tetti ti prudono fra le scapole. Rennick resta dov'è, e chi lo vuole deve passare da te. [tense] Rozalia ti studia a lungo. Squiggor sposta il peso da un piede all'altro, e lei alza una mano senza voltarsi.

    [coldly] “Bene. Buonanotte, allora.” Si stringe la mantellina sulle spalle. [menacing] “Però il conto resta aperto. Mirko saprà entro un'ora che hai difeso Rennick Dole davanti a tutta Via dei Rasoi, e Squiggor le offese se le tiene a mente.”

    [exhales] Si allontanano verso Via del Salmone senza fretta. Quando alzi gli occhi, sui tetti è rimasto solo il fumo dei comignoli.
  scuri-via-dei-rasoi__2-fallimento: |
    Rozalia ti ascolta fino in fondo, poi sospira. [deadpan] “Mi spiace” dice, e fa un passo di lato per non stare fra te e Squiggor.

    [tense] Squiggor tira fuori le mani dalle tasche. Ha le nocche fasciate e grosse come noci. [pained] Il primo colpo ti prende sotto le costole e il secondo ti manda contro il cristallo spento. [breathing heavily] Con la guancia sul selciato vedi due uomini scesi dai tetti che portano via Rennick Dole verso Via del Salmone, tenendolo per le braccia. [bitter] Rennick non grida, e ti guarda una volta sola prima che girino l'angolo.
  scuri-via-dei-rasoi__3-vittoria: |
    [breathing heavily] Squiggor va giù per ultimo e non si rialza più. Resta sul selciato ai piedi del cristallo spento, con la benda storta e la faccia rivolta al cielo. Rozalia si inginocchia accanto a lui un momento, [glass shattering] poi rompe una fiala contro la pietra. Un fumo grigio che brucia gli occhi e raschia in gola riempie il gomito della strada, e quando si dirada, [coughs] fra un colpo di tosse e l'altro, lei non c'è più. Anche i balestrieri sono spariti dai tetti.

    [somber] Nerissa Dalvane guarda il corpo dalla soglia della Maison e richiude la porta senza dire niente. [pause] Sulla pietra opaca del cristallo resta una macchia scura.
  scuri-via-dei-rasoi__3-sconfitta: |
    [pained] Squiggor ride quando lo colpisci, e alla fine sei tu a finire contro il cristallo spento, con il sapore del sangue in bocca. [breathing heavily] Mentre provi a rialzarti, due uomini scesi dai tetti trascinano Rennick Dole verso Via del Salmone.

    Rozalia si china su di te e ti sistema il colletto con due dita macchiate d'inchiostro. [mocking] “Era un'offerta semplice” dice. [bitter] Poi raggiunge gli altri senza voltarsi, con la piuma ancora dietro l'orecchio.
  scuri-via-dei-rasoi__4-esito: |
    [somber] Quando lo chiami, Rennick viene. Ti segue fino al cristallo spento e capisce soltanto lì, quando Squiggor gli posa una mano sulla spalla, e non prova a scappare.

    [coins clinking] Rozalia conta le monete e te le mette nel palmo una alla volta. Sono tiepide, come se le tenesse in mano da un pezzo. [slyly] “Mirko sarà contento” dice, e ti chiude le dita sopra. “E quando è contento, se ne ricorda.”

    [bitter] Squiggor e Rennick si avviano verso Via del Salmone uno accanto all'altro, e sui tetti le balestre si abbassano. Rozalia si rimette la piuma dietro l'orecchio e li segue.
  scuri-via-dei-rasoi__5-successo: |
    [calm] Ti fermi davanti a Squiggor invece che davanti a Rozalia e gli fai il cenno col mento che vi scambiate alla Pignatta. Lui ti guarda per la prima volta. [wry] Sull'Orlo dei Rottami vi eravate picchiati per venti minuti a causa di un carico di cristalli che secondo lui avevi alleggerito, e alla fine vi eravate seduti sul bordo della Cicatrice a riprendere fiato. La mano destra, a ripensarci, ti fa ancora male quando piove.

    “Chiudo un occhio” aveva detto allora. [gruff] Adesso lo ripete a voce bassa, e Rozalia sospira. [resigned] “Va bene. Per stanotte Rennick è tuo.”

    [relieved] Si allontanano verso Via del Salmone, e sui tetti le balestre spariscono dietro i comignoli.
  scuri-via-dei-rasoi__5-fallimento: |
    Gli fai il cenno col mento che vi scambiate alla Pignatta, e Squiggor non lo restituisce. [tense] Sposta il peso da un piede all'altro e tira fuori le mani dalle tasche.

    [pained] Il primo colpo ti piega in due, il secondo ti manda contro il cristallo spento. Rozalia ti guarda dall'alto con un'aria quasi dispiaciuta. [breathing heavily] Con la guancia sul selciato vedi due uomini scesi dai tetti che portano via Rennick Dole tenendolo per le braccia, [bitter] e lui ti cerca con gli occhi finché non girano l'angolo di Via del Salmone.
  scuri-via-dei-rasoi__6-successo: |
    [determined] Ti sfili la giacca e la butti sul selciato, e Squiggor capisce prima di Rozalia. [wry] Sull'Orlo dei Rottami vi siete picchiati per venti minuti a un passo dal bordo senza che nessuno dei due cadesse, e alla fine vi siete seduti sull'orlo della Cicatrice, con le gambe sul vuoto, a riprendere fiato.

    Squiggor si tocca la benda. [gruff] “Pari” dice. Rozalia alza gli occhi al cielo. [sarcastic] “Rennick resta tuo per stanotte. Squiggor, andiamo.”

    [relieved] Si allontanano verso Via del Salmone, e sui tetti le balestre spariscono dietro i comignoli.
  scuri-via-dei-rasoi__6-fallimento: |
    [tense] Ti sfili la giacca, e Squiggor sorride per la prima volta. Stavolta non siete sull'Orlo dei Rottami, e lui non ha nessuna voglia di sedersi a riprendere fiato.

    [pained] Il primo colpo ti prende sotto le costole e il secondo ti manda contro il cristallo spento. [breathing heavily] Con la guancia sul selciato vedi due uomini scesi dai tetti che portano via Rennick Dole verso Via del Salmone. [bitter] Rozalia li segue raccogliendo la tua giacca da terra, e te la getta addosso passando.
  ponte-del-pesce: |
    [tired] Lasci Via dei Rasoi che è già sera. In Via del Salmone metà delle lanterne è spenta, con lo stoppino bruciato da mesi, [wry] e sotto una di quelle accese c'è un cartello scritto a mano per un gatto grigio smarrito, “risponde a Fagiolo”. Le poche persone in giro ti guardano un momento e poi abbassano gli occhi.

    [calm] In fondo alla via comincia il Ponte del Pesce, un arco di pietra rossa consumato al centro dalle ruote dei carretti, che porta dalla Città Bassa ai Ponti Sospesi. Il parapetto è basso e conserva ancora un po' del calore del giorno. A metà ti fermi senza averlo deciso e ci appoggi i gomiti, e senti le gambe che tirano. [water flowing far below] Sotto, lontano, si sente scorrere dell'acqua.

    Davanti a te la strada sale verso i Ponti. [awed] Più in alto, oltre le corde dei Ponti, la Cattedrale del Velo accende le sue luci una dopo l'altra, dal campanile in giù, nello stesso ordine di ogni sera.

    [wind blowing] Il cielo ha il colore che a Qir-Azel prende nelle sere in cui sta per cambiare il vento, e le stelle escono una alla volta. [eerie] La prima, bassa sull'orizzonte a sud, è di un viola molto chiaro, color lavanda. [whispers] [sarcastic] Qualcuno in Città Bassa ci avrà già costruito sopra una profezia. La guardi finché il vento ti fa lacrimare.

    [exhales] Da quando hai tirato la catena della Maison è la prima volta che hai il tempo di pensare.
  ponte-del-pesce__1-esito: |
    [thoughtful] Pensi a Rennick seduto sul bordo del letto, con le mani che tremavano e la bottiglia di liquore di radice sul comodino, con il tappo di sughero rosicchiato tutto intorno. Fino a pochi giorni fa era un nome sentito alla Pignatta, un tirchio che parlava la lingua degli orchi. [somber] Adesso è un uomo che beve per non pensare alla bambina della processione, e che si è affidato a te perché in città chi sa quello che sa lui dura poco.

    [quietly] Ti chiedi quante notti la tua parola riuscirà a tenerlo in vita, e che cosa ti costerà mantenerla. Ci pensi finché la pietra rossa finisce sotto i tuoi piedi e comincia il legno delle passerelle.
  ponte-del-pesce__2-esito: |
    [bitter] Pensi a Rennick in Via dei Rasoi, in mezzo agli uomini degli Scuri, e al modo in cui ti ha guardato l'ultima volta. Ti aveva chiesto soltanto di portarlo fuori città, e adesso è nelle mani di Mirko Vesh.

    [resigned] Gli Scuri lo terranno in vita finché avrà qualcosa da dire, e Rennick ha parecchio da dire. [quietly] Te lo ripeti a voce bassa e resti al parapetto finché la stella color lavanda si è alzata di un dito sopra i tetti, poi riprendi a camminare verso i Ponti.
  ponte-del-pesce__3-esito: |
    [somber] Ripensi alla piazza del Festival, alle fosse comuni benedette in fretta e agli orchi che, braccati sull'orlo, hanno preferito saltare nella Cicatrice. Le cinque tribù del circondario non si erano mai mosse insieme. [ominous] Quella sera qualcuno le teneva in fila, e gli orchi la chiamavano Dama d'Argento.

    [wry] In Città Bassa la parola adesso la ripetono tutti, dalle lavandaie ai facchini, e all'imbocco del ponte un venditore di castagne l'ha scritta col gesso sul carretto, sbagliando l'apostrofo, per attirare gente. Nessuno fa domande. [quietly] Tu l'hai sentita tradurre da Rennick, e te la ripeti mentre attraversi l'ultimo tratto del ponte.
  ponte-del-pesce__4-esito: |
    [somber] Pensi a Squiggor Ironfist steso sul selciato di Via dei Rasoi, con la benda nera storta sull'occhio che non aveva. Aveva le nocche grosse come noci, e fino all'ultimo non ha detto quasi niente.

    [uneasy] Sulle mani ti è rimasto un odore di metallo bagnato, lo stesso che c'era in strada quando Squiggor è caduto. Lo senti ancora quando stringi il parapetto, e lo stringi finché le mani smettono di tremare e lo stomaco torna al suo posto. [exhales] Poi le guardi, le pulisci sui calzoni e riprendi a camminare.
  ponte-del-pesce__5-esito: |
    [thoughtful] Ripensi a com'eri il giorno in cui hai cominciato a chiedere in giro che cosa volesse dire Mawrak'Thur. Da allora sei entrato in una casa dove non si entra senza appuntamento, e in Via dei Rasoi hai guardato in faccia gli Scuri. [wry] A quest'ora il tuo nome è arrivato anche alla Pignatta.

    [calm] Appoggi il palmo sul parapetto. Il calore del giorno se n'è andato e la pietra è fredda, e sotto, lontano, l'acqua continua a scorrere. [exhales] Ti accorgi che il respiro ti si è fatto più lento, e resti lì finché la Cattedrale non ha acceso l'ultima luce.
