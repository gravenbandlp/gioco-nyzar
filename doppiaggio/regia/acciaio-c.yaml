# Regia del doppiaggio: Acciaio e Ira
regia:
  il-tunnel-dei-contrabbandieri: |
    [heavy door creaking] La porta delle consegne si apre con la chiave più grossa del mazzo di Ondrel. [eerie] Dentro fa freddo per la prima volta da quando l'Acciaieria esiste, perché la fornace è spenta, e l'odore di metallo bruciato è rimasto attaccato ai muri. Dalla sala di carico una scala di pietra scende al magazzino sotterraneo dove si teneva la sabbia. Contro il muro ci sono due carriole, e accanto alla scala c'è il muro di mattoni abbattuto a colpi di mazza. [uneasy] Qualcuno, dopo, ha raccolto i mattoni e li ha impilati in ordine contro le carriole, come si fa con la merce. Dietro il buco un passaggio vecchio scende verso sud.

    In fondo al passaggio c'è la stanza dove i contrabbandieri facevano i loro conti, e dove Isvaro ha passato le ultime notti. Ci sono una branda con la coperta per terra e un tavolo con le gambe incise di tacche. [somber] Sulla mensola le bottiglie vuote sono allineate per altezza, tutte con l'etichetta in fuori. [whispers] [bitter] Anche ubriaco, le bottiglie le ha messe in fila. La mano ti va da sola al diario che hai in tasca.

    [tense] Oltre la stanza comincia il tunnel, scavato nella roccia delle fondamenta. Lo segui con la lampada per quasi un chilometro verso nord-est, con il soffitto che ti sfiora i capelli e l'aria che si fa più fredda a ogni curva. Alla fine c'è un muro di roccia liscia e il tunnel si ferma lì. [ominous] Sul pavimento, davanti al muro, la polvere è battuta da molti piedi larghi.
  il-tunnel-dei-contrabbandieri__1-successo: |
    [curious] Passi la lampada sulla roccia palmo per palmo, e in basso a sinistra la luce non fa ombra dove dovrebbe farla. Ci appoggi la mano e la mano entra nella pietra, fredda come l'acqua di un pozzo. Il masso è un'illusione. [tense] Dall'altra parte c'è una caverna con un mucchio di giacigli d'orco e gli avanzi dei loro pasti, e a destra una porta di legno rinforzato, chiusa. A sinistra si aprono due gallerie. Quella a est finisce in un crollo dopo centoventi metri, e quella a ovest passa per un muro abbattuto da poco.
  il-tunnel-dei-contrabbandieri__1-fallimento: |
    [tired] Per un'ora tasti la roccia in ginocchio e poi in punta di piedi, finché le dita non sentono più niente e l'olio della lampada si abbassa di un dito. [resigned] La pietra è liscia e fredda dappertutto. Torni indietro per il tunnel con la lampada che sfrigola, e nella stanza dei contrabbandieri ti siedi sulla branda di Isvaro a riprendere fiato prima di risalire, [somber] davanti alle sue bottiglie in fila sulla mensola.
  il-tunnel-dei-contrabbandieri__2-successo: |
    [calm] Appoggi le dita alla roccia e lasci andare il Mana, e in basso a sinistra senti un formicolio fitto, come di un arto che si risveglia. [satisfied] Il masso è un incantesimo, e ci passi attraverso con gli occhi chiusi. [tense] Dall'altra parte c'è una caverna con i giacigli degli orchi e gli avanzi dei loro pasti, e a destra una porta di legno rinforzato, chiusa. A sinistra la galleria a est finisce in un crollo, mentre quella a ovest passa per un muro abbattuto da poco.
  il-tunnel-dei-contrabbandieri__2-fallimento: |
    [low humming] Il Mana ti torna indietro tutto insieme, e per un momento senti la roccia ronzare dentro i denti. [groans] Ti ritrovi seduto per terra, con la lampada rovesciata e un sapore di rame in bocca. [uneasy] Il muro liscio è sempre lì, e ti ci vuole un pezzo prima di avere voglia di toccarlo di nuovo. Risali il tunnel con il ronzio ancora nelle gengive, e in cima alla scala ti accorgi che stai stringendo le chiavi di Ondrel fino a farti male.
  il-tunnel-dei-contrabbandieri__3-esito: |
    [tired] Ti appoggi al muro con la spalla per riprendere fiato, e la spalla ci affonda dentro. [gasps] Cadi in avanti attraverso la pietra, e per un momento lungo non hai più né sopra né sotto. [tense] Atterri sui gomiti in una caverna che puzza d'orco, in mezzo ai giacigli di paglia e agli ossi spolpati. Delle due gallerie che partono dalla caverna, quella a est finisce in un crollo, e quella a ovest passa per un muro abbattuto da poco.
  il-tunnel-dei-contrabbandieri__4-esito: |
    [thoughtful] Ti accucci con la lampada e guardi la polvere come guardavi quella dei vicoli dietro la Pignatta, quando dovevi sapere se qualcuno ti aspettava dietro l'angolo. Le impronte arrivano al muro e non tornano indietro. [curious] Le ultime però sono soltanto punte, con il tallone sollevato, quelle di chi si abbassa per passare sotto una trave, e sono tutte in basso a sinistra.

    [satisfied] Allunghi la mano in quel punto e la mano entra nella pietra, fredda come l'acqua di un pozzo. [tense] Dall'altra parte c'è una caverna che puzza d'orco. Sulla destra c'è una porta di legno rinforzato che resta chiusa, mentre a sinistra partono due gallerie, una che finisce in un crollo e una che passa per un muro abbattuto da poco.
  di-nuovo-nel-tunnel: |
    [somber] L'Acciaieria è chiusa e fredda come l'hai lasciata. Nella stanza dei contrabbandieri le bottiglie di Isvaro sono ancora in fila sulla mensola, e una si è rovesciata, forse per un topo. [wry] La rimetti dritta senza pensarci, prima di accorgerti di averlo fatto. [tense] Poi c'è il tunnel, lungo quasi un chilometro, e in fondo il masso che non c'è.

    [inhales deeply] Ci passi attraverso con il fiato trattenuto, come l'ultima volta. [ominous] Nella caverna i giacigli degli orchi sono come li hai lasciati, e oltre il muro abbattuto a ovest c'è sempre il mattone scritto a pece.
  di-nuovo-nel-tunnel__1-esito: |
    [eerie] Sali per la galleria dritta fino alla sala della statua e passi davanti alla donna di marmo rosso, con la faccia storta dalla rabbia e il libro della stella stretto nella sinistra. Il freddo ti entra sotto i vestiti come l'altra volta, a cominciare dai polsi. [determined] Controlli che la lampada abbia olio, ti allacci la giubba fino al collo e ti incammini verso le gallerie basse.
  uzgreth-alle-fosse: |
    [ominous] La camera è più fredda delle altre, con il soffitto ad arco che sale a sei metri. Sul pavimento ci sono undici portelli di legno sparsi senza ordine, ognuno sopra una fossa larga un metro e mezzo, e dal buio sotto i portelli salgono rumori soffocati. [muffled moaning] Ogni tanto si sente un gemito sordo, e poi niente.

    [tense] In mezzo ai portelli c'è un orco più tozzo e più largo di qualunque orco tu abbia visto, con la pelle di un colore malato e gli occhi rossi di sangue. Regge con tutte e due le mani uno spadone enorme di ottima fattura, appoggiato alla spalla. [whispers] [uneasy] La spada da ogre dei Nove Chiodi, quella che secondo Ilvaena era troppo grande anche per lui. Adesso gli sta in mano come se l'avessero forgiata su misura.

    [eerie] Quando parla, la sua voce è più bassa di quella di qualunque orco, e sembra salire dal fondo delle fosse insieme ai gemiti.

    [menacing] “Il Demone ha chiesto a Uzgreth di guardare il suo gregge” dice. “Uzgreth fa quello che dice il Demone, e il Demone dice di squartare gli intrusi insolenti.” [wood creaking] Sposta il peso da un piede all'altro, e un portello sotto di lui scricchiola.
  uzgreth-alle-fosse__1-vittoria: |
    [wood splintering] Uzgreth mena colpi che spaccano i portelli e fanno volare le schegge, e dalle fosse aperte si alzano mani grigie. Tu resti sempre dove lui non arriva. [exhales] Quando finalmente cade lungo disteso, lo spadone gli scivola dalle dita. Lo raccogli con tutte e due le mani, e pesa quanto un bambino. [eerie] Sotto i portelli rotti i morti delle fosse si agitano, ma non salgono.
  uzgreth-alle-fosse__1-sconfitta: |
    [pained] Lo spadone ti prende di piatto e ti manda a sbattere contro un portello, che si apre sotto di te. Per un attimo hai le gambe nel buio della fossa e qualcosa di freddo ti stringe la caviglia. [breathing heavily] Ti tiri fuori a forza di braccia e scappi dalla camera, e Uzgreth non ti insegue. [ominous] Lo senti ripetere che il Demone sarà contento.
  uzgreth-alle-fosse__2-successo: |
    [thoughtful] Guardi i portelli uno per uno finché trovi quello con i cardini mangiati dalla ruggine, e ti metti dall'altra parte, a provocarlo. Uzgreth ti viene incontro dritto, perché è così che fa tutto. [wood splintering] Il portello scatta sotto il suo piede e lui va giù nella fossa fino alle spalle, e lo spadone, troppo largo, resta di traverso sul bordo. [eerie] Dal fondo i morti lo tirano per le gambe. Prendi lo spadone e te ne vai prima di sentire come finisce.
  uzgreth-alle-fosse__2-fallimento: |
    [tense] Il portello che hai scelto regge, e Uzgreth ti arriva addosso con lo spadone alto. [pained] La lama ti apre la coscia mentre ti butti di lato, e scappi dalla camera trascinando la gamba. Da dietro arriva la sua voce profonda, che conta i portelli uno per uno mentre tu li scavalchi. [breathing heavily] Ti fermi a stringere la coscia con la cintura soltanto quando la voce è lontana, e il sangue continua a passare sotto il cuoio.
  uzgreth-alle-fosse__3-successo: |
    [calm] Gli dici che il Demone ti ha chiamato giù, e che è arrabbiato perché lo fanno aspettare. Uzgreth ti guarda a lungo con i suoi occhi rossi, poi abbassa lo spadone. [deadpan] “Il Demone è sempre arrabbiato” dice, e si sposta di lato, attento a dove mette i piedi. [tense] Passi fra i portelli senza correre, e senti il suo sguardo sulla nuca fino alla porta.
  uzgreth-alle-fosse__3-fallimento: |
    Uzgreth ti ascolta fino alla fine. [menacing] “Il Demone non manda nessuno” dice, scandendo le parole come un maestro con un allievo lento. “Il Demone chiama Uzgreth.” [pained] Lo spadone arriva dal basso, e ti prende al fianco mentre già corri verso la porta. [breathing heavily] Ti fermi due gallerie più in là a tamponarti la ferita con la camicia, che si inzuppa subito, e senti ancora la sua voce che ripete la lezione alle fosse.
  uzgreth-alle-fosse__4-successo: |
    Uzgreth ricomincia a parlare del Demone e del suo gregge, con gli occhi rossi rivolti all'arco del soffitto. Ti muovi lungo il muro mettendo i piedi solo sulla pietra lontano dai portelli. [muffled moaning] Quando da una fossa sale un gemito più forte degli altri trattieni il fiato. [relieved] Arrivato alla porta ti volti, e lui sta ancora parlando, con la testa all'indietro e lo spadone appoggiato alla spalla.
  uzgreth-alle-fosse__4-fallimento: |
    [wood creaking] Metti il piede su un portello che sembrava pietra, e il legno scricchiola. [tense] Uzgreth abbassa gli occhi su di te, lentamente, come se la cosa lo annoiasse. Ti butti verso la porta, e lo spadone ti passa così vicino che senti il vento sul collo, [pained] poi la punta ti prende la spalla e ci entra fino all'osso. Esci dalla camera con il braccio che pende e la sua voce che ti chiama insolente.
  l-aula-dell-ira: |
    [awed] La galleria sbuca in una sala così alta che la lampada non arriva al soffitto, grande come la navata di una cattedrale. Le pareti sono coperte di rune incise a punta, e al centro c'è una vasca larga, circondata da un cerchio di teschi levigati in equilibrio su spuntoni di pietra. [eerie] In fondo due scalinate salgono a un pulpito, e sul pulpito c'è una seconda vasca, triangolare, piena di un liquido arancione e trasparente che gorgoglia. Ne sale vapore, eppure nella sala fa un freddo che ti morde le dita.

    [ominous] Accanto al pulpito sta il demone. È alto più di tre metri e ha la pelle coriacea color ruggine, con quattro braccia. Le due di sopra finiscono in chele grandi abbastanza da stritolare un cavallo, quelle di sotto sono sottili come mani d'uomo e si muovono di continuo. [fearful] Ha la testa di un coccodrillo, e gli occhi sono intelligenti e completamente pazzi.

    [shouting] “Maledetti! Avete osato violare il santuario della Covatrice di Orrori!” urla, con una voce che ti vibra nello sterno. [tense] Con una mano piccola si taglia il polso e lo tiene sopra la vasca triangolare. La luce sul soffitto si mette a tremare, e accanto a lui l'aria si crepa come uno specchio. [eerie] Ne esce una figura glabra sulle gambe piegate al contrario, e la crepa si richiude.

    [dramatic] “Dona la tua anima colma di rancore al possente Yoggoth, e anche tu sarai una Colata dell'Ira al servizio della sacra Regina!” [wry] Intanto la vasca si è abbassata di un dito, e per un momento la faccia da coccodrillo si fa preoccupata.
  l-aula-dell-ira__1-vittoria: |
    [tense] La Colata ti viene addosso per prima e cola sul pavimento in una pozza grigia, poi c'è soltanto Yoggoth, con le chele che spaccano i teschi del cerchio. [exhales] Quando finalmente cade sui gradini del pulpito non si rialza più, e la luce della vasca triangolare si abbassa e poi torna piano quella di prima. Alla sua cintura c'è un cilindro di lyssan inciso con grande cura e pieno di ammaccature, con dentro un rotolo di pergamena coperto di simboli senza senso. Nella cintura ha altri rotoli, ma l'inchiostro è sbiadito.

    [uneasy] Prima di andartene ti volti verso il pulpito, e la vasca è ancora piena fino all'orlo. [tired] Risali per le Segrete e per il tunnel con il cilindro nella camicia, e in Città Bassa è notte fonda.
  l-aula-dell-ira__1-sconfitta: |
    [pained] La Colata la abbatti, ma Yoggoth ti prende con una chela e ti scaraventa contro il cerchio di teschi. [tense] Mentre ti rialzi lui si taglia di nuovo il polso sopra la vasca, e poi ancora, per chiamare un'altra Colata che ti finisca. [eerie] Al quarto taglio la vasca non gli risponde più. Yoggoth la guarda con le mani piccole che tremano, e taglia ancora, finché si accascia sui gradini del pulpito in una pozza del suo sangue e non si muove più.

    [exhausted] Dalla sua cintura prendi un cilindro di lyssan ammaccato. [liquid bubbling] Mentre ti trascini verso l'uscita la vasca riprende a gorgogliare, e torni in Città Bassa all'alba, piegato in due.
  l-aula-dell-ira__2-successo: |
    [mocking] Gli ridi in faccia e gli dai del lucertolone. [roaring] Yoggoth ruggisce e si taglia il polso, e tu corri intorno al cerchio di teschi con la Colata dietro. Ogni insulto gli costa un taglio, e ogni taglio abbassa la vasca. Le ultime Colate escono a metà e si sfanno dopo tre passi. [satisfied] Alla fine Yoggoth cade sui gradini, morto, svuotato del suo sangue, e la luce della vasca torna piano quella di prima.

    Dalla sua cintura prendi un cilindro di lyssan ammaccato, con un rotolo di pergamena dentro. [hoarse] In Città Bassa arrivi a notte fonda, senza voce.
  l-aula-dell-ira__2-fallimento: |
    Lo provochi, e lui ti prende in parola. [urgent] Le Colate escono una dopo l'altra e tu corri intorno al cerchio di teschi finché una ti prende alla schiena e un'altra alla gamba. [eerie] Yoggoth continua a tagliarsi anche quando la vasca non gli risponde più, e alla fine si accascia sui gradini del pulpito con le mani piccole aperte e non respira più.

    [exhausted] Gli sfili dalla cintura un cilindro di lyssan ammaccato. [liquid bubbling] Mentre risali le Segrete trascinandoti, alle tue spalle la vasca riprende a gorgogliare. Arrivi in Città Bassa che è giorno.
  l-aula-dell-ira__3-successo: |
    [solemn] Dici le parole della Liturgia a voce alta, e la voce ti esce più ferma delle gambe. [awed] A ogni frase Yoggoth si fa più piccolo dentro la sua pelle color ruggine, come un vestito che resta vuoto, e la Colata accanto a lui si scioglie sul pavimento. All'ultima parola il demone si accascia sui gradini del pulpito e non si muove più. [exhales] Fra le pieghe della pelle vuota trovi un cilindro di lyssan ammaccato, con un rotolo di pergamena dentro.

    [tired] Torni in Città Bassa a notte fonda, con la gola secca. [uneasy] La vasca, dietro di te, gorgoglia ancora.
  l-aula-dell-ira__3-fallimento: |
    [pained] A metà formula sbagli una parola, e il Mana ti torna indietro come una frustata dietro gli occhi. [tense] Yoggoth barcolla lo stesso, ferito da quello che è arrivato, e per la rabbia si apre il polso sopra la vasca, e poi di nuovo, e di nuovo, finché la vasca non gli dà più niente e lui crolla sui gradini svuotato, senza più rialzarsi. [bitter] La sua Colata ti ha lasciato il segno delle sue piccole mani su tutto il braccio.

    Dalla sua cintura prendi un cilindro di lyssan ammaccato. [liquid bubbling] Sulla soglia ti volti, e la vasca si è già rimessa a gorgogliare. [exhausted] Torni in Città Bassa con il sangue al naso.
  l-aula-dell-ira__4-esito: |
    [solemn] Ti inginocchi davanti al pulpito, e Yoggoth scende i gradini con gli occhi accesi. Le mani piccole ti afferrano le tempie e le unghie ti entrano nella pelle, e senti la rabbia che ti esce dalla testa, tutta quella che hai raccolto dalla sera della razzia. Lui la lascia cadere nella vasca triangolare. [eerie] L'aria si crepa, e la Colata che ne esce è fatta della tua rabbia, che in questo momento ce l'ha con chi ti sta frugando nella testa. [furious] Gli salta alla gola con tutte le mani della bocca, l'altra Colata le va dietro, e Yoggoth cade all'indietro nella vasca triangolare con tutte e due addosso. [splash] Il liquido si richiude sopra le chele, e nessuno dei tre riemerge.

    [long pause] Sui gradini, caduto dalla sua cintura, trovi un cilindro di lyssan ammaccato. [calm] Torni in Città Bassa leggero e vuoto, e per giorni, quando qualcuno ti spinge al mercato, non ti viene nemmeno voglia di spingere indietro.
