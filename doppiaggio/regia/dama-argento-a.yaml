# Regia del doppiaggio: La Dama d'Argento
regia:
  parola-orchesca: |
    [somber] Dopo la razzia delle Foglie Alate, in Città Bassa il martello ha ripreso a battere, ma più piano. I morti si seppelliscono in fosse comuni benedette in fretta, e le tende strappate si rattoppano con la stoffa delle bandiere del Festival, che è quella che avanza. Si contano anche gli orchi uccisi, e quelli che, braccati sull'orlo, hanno preferito saltare nella Cicatrice piuttosto che farsi prendere. [quietly] Perché un orco si butti nel vuoto nessuno lo sa spiegare, e ai bambini non lo si racconta.

    [mysterious] Poi c'è la parola, Mawrak'Thur, che si sente nelle code alla fontana e sulla soglia delle botteghe. È dura da pronunciare, e nessuno la dice bene. [softly] Quando ci provi anche tu, a mezza voce, la lingua ti si impiglia sull'apostrofo. [ominous] Gli orchi la gridavano mentre caricavano e mentre morivano, e alcuni anche mentre saltavano.

    La gente la pronuncia a voce bassa e finge di non sentirla quando la dicono gli altri. Una lavandaia giura che il capoguerra sul cinghiale corazzato la cantava come una preghiera, mentre per un facchino era una bestemmia. [wry] Tutti e due ignorano che cosa significhi, e preferiscono non saperlo.

    [determined] Tu invece vuoi saperlo, e in Città Bassa le informazioni si pagano con altre informazioni.
  parola-orchesca__1-esito: |
    [fire crackling] La trovi all'angolo del lavatoio, dietro un braciere che fa più fumo che calore. È una vecchia che vende castagne e conosce tutto quello che si è detto in quella strada negli ultimi quarant'anni. [wry] Le racconti le tue due storie, e lei le ascolta e le trova di suo gusto. Poi si china verso di te, con un odore di castagne bruciate che ti fa venire fame nonostante tutto.

    [slyly] “Dama d'Argento, bello mio” dice. “Nella lingua degli orchi vuol dire così.”

    Gliel'ha detto un uomo giovane, una sera, con troppo liquore in corpo e le mani che non stavano ferme. [uneasy] La faccia l'ha dimenticata, ma si ricorda che aveva paura.

    [quietly] “Degli orchi non aveva paura” precisa, e ti porge un cartoccio di castagne che non hai chiesto. [pause] “Aveva paura di quella parola.”
  parola-orchesca__2-successo: |
    Te la traduce un carovaniere al ponte, poi una tintora con le mani blu fino ai gomiti, e infine un ragazzino che si fa pagare in anticipo. [uneasy] Nessuno dei tre conosce gli altri, eppure dicono tutti la stessa cosa a bassa voce, con lo stesso piccolo scatto delle spalle che si fa passando accanto a un cane che dorme.

    [pause] [quietly] Mawrak'Thur vuol dire Dama d'Argento.

    Chi sia la Dama, e chi abbia tradotto la parola per primo, non lo sa nessuno dei tre. [ominous] Sono sicuri soltanto che chi l'ha detta la prima volta non stava ridendo.
  parola-orchesca__2-fallimento: |
    [tense] Fai una domanda di troppo sulla stessa parola e la gente si chiude. La tintora smette di sorriderti, e il carovaniere si ricorda all'improvviso di avere fretta.

    [uneasy] Quando giri l'angolo senti che qualcuno ti guarda andare via, un po' troppo a lungo. [bitter] Da queste parti è poco più di una nota a margine, ma a Qir-Azel le note a margine finiscono spesso nei registri sbagliati.
  lingua-dei-chiodi: |
    Adesso sai che Mawrak'Thur vuol dire Dama d'Argento, e da quando lo sai la parola ti torna in mente nei momenti meno adatti, perfino mentre ti allacci gli stivali. Resta da capire chi sia questa dama, e perché la chiamino d'argento. [ominous] Quella sera gli orchi cantavano tutti la stessa litania, come se qualcuno li tenesse in fila. In città c'è chi ha capito abbastanza di quello che gridavano da averne paura.

    [thoughtful] L'orchesco non si impara al mercato. Lo parlano gli orchi e qualche ranger che li caccia. In città lo sanno anche i pochi mercanti che hanno trafficato col Bosco della Forca abbastanza a lungo da imparare a contare i prezzi nella testa dei Nove Chiodi. [wry] Chi lo parla tende a non vantarsene, perché in Città Bassa la cosa fa nascere sospetti.

    [crowd murmuring] Alla Pignatta Grassa il fumo è basso. Al tavolo dei carovanieri si beve per dimenticare la strada per Laresh. [wry] Dietro il bancone Mauro Scrocco lucida un bicchiere pulito da un'ora e aspetta che tu gli chieda quello per cui sei venuto.
  lingua-dei-chiodi__1-successo: |
    [wry] Ci vogliono tre giri e una storia vera sulla razzia raccontata bene, e quando hai finito di raccontarla hai la gola più secca di prima. Un carovaniere con la barba bruciata da un lato si pulisce la bocca col dorso della mano.

    [gruff] “Dole”, dice, “Rennick Dole. Quello della Segheria, il responsabile. Suo padre commerciava pelli col Bosco della Forca e se lo portava dietro da ragazzino. Il vecchio voleva che il figlio imparasse a contare i prezzi nella testa degli orchi. Ha imparato anche il resto.”

    Un altro annuisce e aggiunge che Rennick parla l'orchesco meglio di chiunque in città. [amused] Dicono che sia tirchio e arrogante, uno che non offrirebbe da bere nemmeno al proprio funerale. [uneasy] Dalla sera del Festival, però, non si fa più vedere in giro. Alla Segheria dicono che è partito, ma nessuno sa dire quando.
  lingua-dei-chiodi__1-fallimento: |
    [wry] I carovanieri parlano volentieri dei dazi dei Custodi e di un cavallo zoppo che è costato quanto un matrimonio. Degli orchi, invece, non vogliono parlare.

    [tense] Quando insisti, uno di loro posa il boccale con un colpo secco e cambia tavolo. Gli altri lo seguono con lo sguardo e poi guardano te, e la conversazione finisce lì.
  lingua-dei-chiodi__2-esito: |
    [wry] Mauro fa il giro del bancone per abbracciarti, e il suo alito ti arriva un momento prima delle braccia. Poi conta due volte le tue monete e le fa sparire in una tasca color zafferano.

    [slyly] “Rennick Dole”, dice, a voce abbastanza alta perché lo senta mezza sala e abbastanza distratta perché nessuno ci faccia caso, “il responsabile della Segheria. Parla la lingua di quelle bestie meglio di loro. Veniva qui a guardare gli altri perdere a carte, ma lui non giocava mai perché giocare costa.”

    Ti batte due colpi sul petto, come per chiudere una porta. [warmly] “Dopo il Festival non è più venuto, e ha smesso di andare in un sacco di altri posti. Uno che ha paura, amico mio, si riconosce da dove non va.”

    Poi ti riaccompagna al tavolo tenendoti per il braccio. [ominous] A un tavolo d'angolo, nel fumo, qualcuno si segna il tuo nome.
  segheria-malgrani: |
    [low mechanical humming] Senti la Segheria prima di vederla. A cinquanta passi comincia un ronzio basso e regolare che ti entra nei denti. Il canale che la muove è artificiale, alimentato da un grosso cristallo conduttore romboidale che mette in moto l'acqua. Le pale girano e le lame tagliano. [wry] L'aria sa di resina, e i trucioli coprono il cortile come una neve gialla che a nessuno viene in mente di spalare.

    Il nome ufficiale è Segheria di Qir-Azel, ma tutti la chiamano Segheria Malgrani, perché la concessione è della famiglia e i Malgrani lo ricordano a tutti. [tense] Davanti al cancello stanno quattro uomini armati di mazze ferrate. Invece della divisa della guardia portano giacche di cuoio borchiato, con lo stemma di casa Malgrani sulla spalla sinistra, un albero trafitto da una lama. [uneasy] Oltre il cancello gli operai lavorano a testa bassa e in silenzio, e almeno due di loro hanno mani che non hanno mai tenuto una sega.

    Sotto il porticato Marko Thessel scende tre gradini senza fretta. [wry] È giovane e bello, e lo sa. [whispers] [sarcastic] Scommetto che si specchia in ogni vetrina. Porta una camicia di lino chiara e una matita da carpentiere dietro l'orecchio, e ti sorride con la cortesia di un commerciante.

    [slyly] “A quest'ora la Segheria non riceve visite. Abbiamo commesse pressanti.”
  segheria-malgrani__1-successo: |
    Marko allarga le braccia con aria dispiaciuta.

    [slyly] “Rennick? È andato a Laresh per trattare con un grossista di legname, e torna fra qualche giorno. Se è una questione di forniture posso aiutarti io.” Dopo una pausa aggiunge: [coldly] “Oppure no?”

    [wry] Lo dice troppo bene, con le parole in fila come assi appena piallate. [tense] Mentre parla, la sua mano destra scivola verso la cintura, nel punto dove si porta un'arma, anche se adesso non ne ha. Alle sue spalle uno degli uomini appoggiati al muro sbuffa dal naso, e quello sbuffo ti conferma quello che hai già capito.

    [bitter] Marko Thessel mente e non si preoccupa che tu te ne accorga, perché è convinto che tu non possa farci niente. Ringrazi e te ne vai con passo tranquillo. [thoughtful] Il ronzio del cristallo ti segue fino al ponte, e intanto ti chiedi per conto di chi stia mentendo.
  segheria-malgrani__1-fallimento: |
    [warmly] “A Laresh”, dice Marko, “per una trattativa sul legname. Tornerà fra qualche giorno.” Ha una voce piacevole, abituata ai mercanti che salgono in città due volte l'anno, e un modo di guardarti che ti fa sentire ben vestito anche se non lo sei.

    Per ora gli credi. [uneasy] Solo quando sei di nuovo in strada ti accorgi che i quattro uomini al cancello non ti hanno mai tolto gli occhi di dosso, e che uno di loro adesso sa come ti chiami.
  segheria-malgrani__2-vittoria: |
    [breathing heavily] Finisce con Marko Thessel in ginocchio nella segatura, la camicia chiara sporca di resina e di sangue. Lo sgherro in livrea è a terra poco più in là e non ha fretta di rialzarsi. Gli operai non si sono mossi e tengono gli occhi sui tronchi, mentre in fondo al capannone una sega a nastro gira a vuoto.

    [pause] Marko sputa sangue, e poi ride.

    [hoarse] “Maison des Lunes”, dice, “in Via dei Rasoi. È lì dall'alba e non vuole farsi trovare da nessuno, te compreso.” Si pulisce la bocca col polso e ritrova il suo sorriso, un po' storto. [mocking] “Ma fai pure. Vediamo chi arriva prima.”

    [exhales] Te ne vai lasciandoti dietro un cortile silenzioso e un nemico con un cognome importante alle spalle. [ominous] I Malgrani si segnano i nomi di chi fa sanguinare i loro soci, e non li dimenticano.
  segheria-malgrani__2-sconfitta: |
    [pained] Sono più di quanti ne avessi contati, e il cortile è loro. Ti ritrovi fuori dal cancello con la faccia nella segatura e uno stivale piantato fra le scapole. [bitter] Lo stemma dei Malgrani, l'albero trafitto dalla lama, ti sta a un palmo dagli occhi, e con la segatura in bocca hai tutto il tempo di studiarlo.

    Marko non si è nemmeno sporcato la camicia. [mocking] “Salutami Laresh” dice qualcuno, e ridono tutti tranne gli operai.
  segheria-malgrani__3-esito: |
    [resigned] Ti volti e te ne vai. Marko non ti saluta e ha già ripreso a parlare con uno dei suoi, a voce abbastanza alta perché tu senta la parola “curiosi”.

    [saws buzzing] Il rumore delle seghe ti accompagna fino al ponte, poi si mescola a quello della Città Bassa e non distingui più il legno dal ferro.
