# Regia del doppiaggio: Sotto la pelle di Qir-Azel (prima parte)
regia:
  una-radice: |
    [paper rustling] Posi le carte sul tavolo dello sceriffo, sopra la mappa coi segnalini rossi. Ci sono sigilli e colonne di cifre, e lettere chiuse con la ceralacca verde e l'alloro, firmate da Ottone Malgrani, con il nome di Mirko Vesh scritto a margine dalla stessa penna. [solemn] Galdrick allunga la mano e tocca la carta con la punta delle dita, piano, come se potesse strapparsi. [inhales deeply] Poi tira il fiato e parla con la voce roca.

    [hoarse] “Per anni ho creduto che la corruzione fosse una ragnatela. [slowly] Ma questa… questa è una radice. Parte da sotto la città e arriva fino alle sale del Consiglio.” Si siede con i gomiti sul tavolo, e le dita gli tamburellano sul legno. [bitter] “Julia lo sa da sempre, e senza prove non poteva muovere un dito. [determined] Adesso le prove ci sono.”

    [tense] Poi scuote la testa. “Se domani arresto Ottone, stanotte Vesh lo sa da uno dei miei. Con il denaro che ha da parte si compra la Città Bassa in una settimana, e ce la ritroviamo tutta contro. Prima gli togliamo il denaro.” [thoughtful] Dai conti di Ottone ricava tre casse e le segna sulla mappa con tre segnalini nuovi. Una è nella bisca di Nihali, all'Orlo dei Rottami. Una è nel retrobottega della Dispensa di Gramm, al Mercato dei Nodi, e l'ultima dentro il pilone cavo del Ponte delle Mille Corde.

    [mysterious] In una pagina c'è una sigla, Ca, con una piccola chiave disegnata accanto. [pause] Galdrick la guarda a lungo e volta il foglio senza dire una parola.
  una-radice__1-esito: |
    Gli racconti di Lucia e delle cinque note che ti ha dato. Galdrick scrive una riga sul taccuino con la matita corta, poi lo richiude. [thoughtful] “Una moglie che tiene il marito lontano dallo studio per uno sconosciuto ha deciso da tempo” dice senza alzare gli occhi. [quietly] “Lo dirò a Julia, e me lo ricorderò quando verrà il momento del mandato” aggiunge, e rimette il taccuino in tasca.
  una-radice__2-esito: |
    Gli racconti della donna davanti allo specchio, che ti ha visto e non ha suonato il campanello. Galdrick ci pensa su con i pollici nella cintura. [thoughtful] “Allora sta aspettando anche lei di vedere come va a finire” dice dopo un po', guardando la mappa. [wry] “In quella casa sono tutti bravi ad aspettare” aggiunge, e sposta di un dito il segnalino con l'alloro.
  una-radice__3-esito: |
    Gli racconti del campanello e del grido. [sighs] Galdrick si passa una mano sulla faccia, dalla fronte fino al mento. [quietly] “Allora Ottone sa che qualcuno è entrato in casa sua” dice piano, quasi fra sé. [tense] “Chi fosse e che cosa manchi lo scoprirà la prima volta che aprirà il caveau a contare. Abbiamo meno tempo di quanto pensassi” aggiunge, e cerchia un giorno sul calendario.
  una-radice__4-esito: |
    Galdrick rigira l'anello alla luce della finestra e gratta con l'unghia la ceralacca verde rimasta fra le lettere. [thoughtful] “Con questo Ottone chiude i contratti alla Casa dei Nodi” dice, tenendolo fra due dita. [satisfied] “Se il sigillo sulle lettere del caveau è lo stesso, nessun avvocato gli trova una scusa” aggiunge, e lo infila in una busta su cui scrive la data.
  una-radice__5-esito: |
    Galdrick soppesa il lingotto e passa più volte il pollice sul segno raschiato. [under breath] “Argento dei magazzini della Gilda, che nei loro libri non risulta mai uscito” dice a mezza voce. [wry] “Cordani vorrà vederlo prima di chiunque altro” aggiunge, e lo avvolge di nuovo nel fazzoletto per chiuderlo nel cassetto della scrivania, invece che nella cassa di ferro.
  una-radice__6-esito: |
    [uneasy] Galdrick non lo tocca, e tiene le mani nella cintura per tutto il tempo. [quietly] “Urtilia mi aveva detto del Guardiano sotto la casa. L'ha messo lì lei, anni fa, quando il cristallo era ancora suo” dice, guardandolo da lontano. [ominous] “Mi ha detto anche che chi lo tiene troppo vicino non dorme più bene.” [wry] Ti guarda le occhiaie e annuisce piano, come se gli avessi dato ragione, poi ti dice di tenerlo lontano dal letto.
  una-radice__7-esito: |
    [muttering] Galdrick ricopia sul taccuino le pagine delle tre casse, riga per riga, muovendo le labbra sulle cifre. Poi ti restituisce il registro e lo spinge verso di te sul tavolo. [quietly] “Tienilo tu, perché in questa Caserma non lo lascerei nemmeno nella cassa di ferro” dice sottovoce. [somber] “Se a me succede qualcosa, qualcuno deve averne una parte” aggiunge, e chiude il taccuino.
  una-radice__8-esito: |
    [determined] “Stanotte queste carte dormono a casa mia, e non qui” dice Galdrick, e le infila in una cartella di cuoio che si lega alla cintura. Poi si alza e ti stringe la mano più forte del solito. [warmly] “Hai fatto una cosa che in questa città non aveva osato fare nessuno. [gruff] Le tre casse sono tue quando vuoi, e per ognuna voglio sapere chi c'era dentro e chi è scappato.” [thoughtful] Resta in piedi a guardare i tre segnalini nuovi sulla mappa.
  una-radice__9-esito: |
    Galdrick mette in fila sul tavolo le carte del caveau accanto all'anello e all'argento della cucina, [warm] e per la prima volta da quando lo conosci sorride. [satisfied] “Con questo Julia porta in Consiglio Ottone e anche i tre della Casa dei Nodi che prendevano la sua paga” dice, e infila tutto in una cartella di cuoio. “Stanotte dorme a casa mia, e non qui.” [serious] Poi torna serio e batte il dito sui tre segnalini nuovi. [gruff] “Le casse sono tue quando vuoi. Per ognuna voglio sapere chi c'era dentro e chi è scappato.”
  la-bisca-di-nihali: |
    [ominous] In fondo alla discesa dell'Orlo dei Rottami, dove le lamiere finiscono e comincia il vuoto, c'è una cisterna dei Precursori rovesciata sul fianco, grande quanto una casa. Qualcuno ci ha tagliato una porta con la fiamma, e di notte da quella porta escono luce gialla e fumo di pipa. [wry] Nei conti di Ottone la cisterna compare ogni settimana alla voce perdite al gioco, sempre per la stessa cifra e sempre contro le stesse iniziali, che all'Orlo tutti sanno leggere come Nihali Cuzan.

    [quietly] Ti fermi dietro un mucchio di ruote spaccate. [crowd murmuring] Dentro ci sono quattro tavoli e una dozzina di giocatori, e in fondo, su una cassa di ferro inchiodata al pavimento, siede Nihali con i suoi vestiti di seconda mano stirati a puntino. È alto e magro, con la faccia gialla di un uomo malato di stomaco. [wet cough] Tossisce nel fazzoletto ricamato, guarda quello che ha sputato e lo ripiega dal lato pulito. [wry] Ha le mani più curate di tutta la Città Bassa.

    [tense] Un ragazzino scalzo ti passa accanto correndo su per la discesa, verso le luci della Pignatta, e non si volta. [whispers] [uneasy] Questo l'ho visto un'ora fa alla baracca di Grusk, a fingere di frugare. [ominous] Sulla porta della cisterna l'uomo di guardia spegne la lanterna con due dita e rientra.
  la-bisca-di-nihali__1-successo: |
    [calm] Ti siedi davanti a lui e perdi tre mani di fila, piano, finché non vedi il trucco. Nihali tiene appena piegato un angolo delle carte buone e lo raddrizza con il pollice mentre distribuisce. [slyly] Alla quarta mano la carta la raddrizzi tu prima di lui, e glielo lasci vedere.

    Nihali si toglie la pipa di bocca. [hoarse] “Vincere mi annoia” dice con la voce impastata di catarro. [coldly] “Far credere di aver perso è più divertente, però stanotte non mi diverto per niente.” Ti spinge davanti la posta e se ne va dalla porta sul retro, su per le lamiere verso la Pignatta. La cassa di ferro è aperta e mezza vuota. [wry] Il resto lo porti alla Caserma, tutto tranne la posta della quarta mano.
  la-bisca-di-nihali__1-fallimento: |
    [tense] Perdi tre mani di fila senza vedere il trucco, e alla quarta provi a barare tu. [coughs] Nihali ti guarda le mani e tossisce nel fazzoletto, poi fa un cenno all'uomo della porta. Se ne va dal retro con la pipa in bocca, verso le luci della Pignatta.

    [crowd shouting] Nella cisterna scoppia una rissa per la posta. [pained] Quando l'uomo della porta smette di colpirti la cassa di ferro è aperta, e dentro restano soltanto le monete che i giocatori non hanno fatto in tempo ad arraffare. [bitter] Le porti su alla Caserma con un occhio che si gonfia, e mezzo Orlo ti vede passare.
  la-bisca-di-nihali__2-successo: |
    [wind howling] Ti cali lungo le lamiere fino al ventre della cisterna, con il vento della Cicatrice che ti gonfia la giubba, e ti infili nella fessura con la pancia contro il ferro. [quietly] Sbuchi al buio dietro la cassa di Nihali. [satisfied] Il lucchetto è aperto e la cassa è già mezza vuota, ma quello che resta entra in due sacche.

    [urgent] Quando la sala si accorge della cassa sei già sulla discesa. Senti Nihali tossire e imprecare dietro di te, [amused] poi lo vedi correre su per le lamiere verso la Pignatta, con le mani curate tenute in alto per non sporcarle.
  la-bisca-di-nihali__2-fallimento: |
    [tense] La fessura è più stretta di quanto sembrava, e ci resti incastrato con le gambe nel vuoto per il tempo di dieci respiri. [pained] Quando finalmente entri ti sei scorticato un fianco, e hai fatto abbastanza rumore da svegliare tutto l'Orlo. [urgent] Arraffi dalla cassa quello che puoi mentre l'uomo della porta ti cerca con la lanterna.

    [bitter] Esci dalla porta principale, perché un'altra strada non c'è, e la sala intera ti guarda passare. Nihali è già sparito su per la discesa verso la Pignatta. [resigned] Le sacche sono leggere, e la cisterna dei Precursori da stanotte resta al buio.
  la-bisca-di-nihali__3-vittoria: |
    [table crashing] L'uomo della porta finisce contro un tavolo, e i giocatori si appiattiscono contro le pareti della cisterna con le carte ancora in mano. Nihali ti sfila qualcosa dalla tasca mentre lo spingi via, e quando te ne accorgi è già fuori dal retro, piegato in due dalla tosse, a correre su per le lamiere verso la Pignatta.

    [exhales] La cassa è aperta e mezza vuota. Il resto lo porti alla Caserma, [wry] e solo per strada ti accorgi che ti ha preso il fazzoletto. Nella tasca, al posto del tuo, c'è il suo fazzoletto ricamato, ripiegato dal lato pulito.
  la-bisca-di-nihali__3-sconfitta: |
    [groans] Ti ritrovi sul pavimento di ferro della cisterna con le carte sparse intorno alla faccia. [pained] L'uomo della porta ti tiene giù con un ginocchio finché Nihali non è uscito dal retro verso la Pignatta, poi ti lascia andare e scappa anche lui. Fra i giocatori qualcuno ha già allungato le mani sulla cassa.

    [exhausted] Ne salvi quello che puoi, contando le monete con le dita che non ti obbediscono, e la mattina dopo la Caserma inchioda un'asse sulla porta della cisterna. [wry] Per una settimana, all'Orlo, chi ti incontra ti guarda l'occhio nero e poi la porta inchiodata.
  la-bisca-di-nihali__4-successo: |
    [quietly] L'uomo dei Malgrani arriva dopo la mezzanotte, con il mantello girato al rovescio per nascondere l'alloro ricamato sul petto. Si siede al tavolo di Nihali e perde una borsa intera in sei mani, senza guardare le carte. [slyly] Quando esce lo aspetti in cima alla discesa e gli dici la cifra prima che la dica lui. [amused] Diventa bianco, e ti consegna la borsa senza discutere.

    [wood splintering] All'alba i mercenari di Ghoran che Galdrick si è portato in città sfondano la porta della cisterna. [satisfied] La cassa è mezza vuota e Nihali è già alla Pignatta, però la borsa dei Malgrani ce l'hai tu, con il sigillo ancora intatto.
  la-bisca-di-nihali__4-fallimento: |
    [quietly] L'uomo dei Malgrani arriva dopo la mezzanotte con il mantello girato al rovescio. [tense] Ti vede prima che tu veda lui, e torna indietro a passo svelto. Dieci minuti dopo la luce della cisterna si spegne. [wood splintering] All'alba i mercenari di Ghoran che Galdrick si è portato in città sfondano la porta e trovano i tavoli e la cassa di ferro, con dentro il fondo di una settimana.

    [bitter] Nihali è sparito verso la Pignatta. [tired] Tu hai passato la notte accucciato fra le ruote spaccate, e fino a sera ti porti dietro le ginocchia rigide.
  il-retrobottega-di-gramm: |
    [wry] Nei conti di Ottone la Dispensa di Gramm compare ogni mese alla voce infusi per la signora, con cifre che un erborista onesto non incassa in un anno. Galdrick l'ha ricopiata sul taccuino e l'ha sottolineata due volte. [gruff] “Gramm prepara i veleni per gli Scuri da prima che io fossi sceriffo” ha detto. [bitter] “Le gocce per dormire della signora Malgrani sono l'unica cosa pulita che gli abbiano mai pagato.”

    [eerie] Il vicolo dietro la Dispensa è una passerella di tavole fra due piattaforme del Mercato dei Nodi, così stretta che i panni stesi ti strusciano sulla faccia. La porta sul retro è bassa, con una campanella che suona soltanto per chi sa dove tirare la corda. [tense] Stanotte la corda è stata tagliata, e dalle fessure della porta esce odore di carta bruciata insieme a un odore dolce che ti fa lacrimare gli occhi.

    [glass clinking] Dentro qualcuno si muove piano e posa vetri sul legno, uno alla volta. [whispers] [sarcastic] Sta facendo i bagagli, e scommetto che li fa in ordine alfabetico. [wooden bridge creaking] Sotto i tuoi piedi il Ponte delle Mille Corde vibra al passaggio di un carro, e di là dalla porta le boccette tintinnano tutte insieme.
  il-retrobottega-di-gramm__1-successo: |
    [knocking on door] Bussi tre volte piano e chiedi attraverso la porta qualcosa per un cane che abbaia troppo. Nestor apre di una spanna. [wry] È basso e tozzo, con il grembiule grigio bruciato sul davanti e uno straccio nella tasca destra, e ha gli occhi sfocati perché da mesi beve le sue stesse pozioni. [slyly] “Te lo dico io quando la tua domanda è una richiesta” dice, e ti fa entrare.

    Nel retro le casse sono chiuse e la stufa è piena di carta nera. [tense] Mentre conta le gocce in una fiala gli posi una mano sul polso. Nestor guarda prima la mano e poi la tua faccia, [glass shattering] e lascia cadere la fiala. [satisfied] Scappa dal vicolo con un passo corto e storto, giù verso la Pignatta, e sotto il banco resta la cassetta con le monete di un mese.
  il-retrobottega-di-gramm__1-fallimento: |
    [wry] Chiedi qualcosa per un cane che abbaia troppo, ma lo chiedi con la voce di uno che il cane non ce l'ha. [tense] Dall'altra parte Nestor resta zitto a lungo. [bolt sliding] Poi senti il chiavistello di una seconda porta, quella che dà sul ponte.

    [wood splintering] Quando sfondi la porta del vicolo il retro è vuoto e la stufa fuma. Fra i vetri rovesciati una boccetta si è rotta, e il vapore dolce ti prende alla gola. [coughs] Esci tossendo con la cassetta delle monete sotto il braccio, [bitter] mentre in fondo al ponte una sagoma bassa e tozza scende verso la Pignatta.
  il-retrobottega-di-gramm__2-successo: |
    [curious] Dalla finestrella vedi gli scaffali svuotati a metà. Riconosci la radice nera che ferma il cuore nel sonno, e accanto le gocce per dormire dei Malgrani, in una bottiglia con l'alloro dipinto a mano. [coldly] Chiami Nestor per nome e gli elenchi attraverso la porta quello che ha nella cassa, con gli anni di cella che vale ogni boccetta.

    [pause] Di là il rumore dei vetri si ferma. [door creaking] Poi si apre una seconda porta sul ponte, e un passo corto e storto si allontana verso la Pignatta. [satisfied] Nel retro trovi la cassetta con le monete di un mese e il quaderno dei clienti del vicolo, scritto in una grafia minuta e pignola.
  il-retrobottega-di-gramm__2-fallimento: |
    [curious] Dalla finestrella vedi gli scaffali, ma le etichette sono scritte in un codice da speziale che non conosci. [tense] Mentre cerchi di leggerle Nestor alza gli occhi e ti vede. [liquid hissing on hot metal] Rovescia una boccetta sulla stufa, e dalla finestrella esce un vapore dolce che ti chiude la gola.

    [coughs] Quando smetti di tossire sfondi la porta. [bitter] Il retro è vuoto, e la seconda porta, quella sul ponte, sbatte ancora contro lo stipite dalla parte della Pignatta. Sotto il banco c'è la cassetta con le monete di un mese. [tired] La porti alla Caserma con le lacrime agli occhi, e la gola ti brucia fino a sera.
  il-retrobottega-di-gramm__3-vittoria: |
    [wood splintering] La porta cede alla seconda spallata. [tense] Il ragazzo degli Scuri ti viene addosso con un coltello da macellaio, [glass shattering] e lo mandi contro gli scaffali in una pioggia di vetri. Nestor ti lancia la boccetta verde e sbaglia di un palmo. [uneasy] Il muro dietro di te comincia a fumare.

    [exhales] Quando il fumo si dirada sono spariti tutti e due dalla porta sul ponte, giù verso la Pignatta. Nel retro restano la stufa piena di carta bruciata e la cassetta con le monete di un mese. [eerie] Dal muro, nel punto dove ha colpito la boccetta, cola un intonaco verde che non smette di sfrigolare.
  il-retrobottega-di-gramm__3-sconfitta: |
    [glass shattering] La boccetta verde ti si rompe sul petto. [pained] Il vapore ti piega in due, e il ragazzo degli Scuri ti finisce con l'impugnatura del coltello. [groans] Ti risvegli sul pavimento del retro con la faccia in una pozza di tintura di malva, accanto alla stufa ormai fredda.

    [bitter] Nestor è scappato verso la Pignatta con il ragazzo e con i quaderni. [wry] Nella fretta però ha dimenticato la cassetta delle monete, che teneva sotto un'asse del pavimento, e l'asse adesso è sollevata a un palmo dalla tua mano. [exhausted] La porti alla Caserma con il passo incerto, e per due giorni tutto quello che mangi ha il sapore del ferro.
  il-retrobottega-di-gramm__4-esito: |
    [wry] Al Mercato dei Nodi ogni bottega del vicolo ha una seconda porta sul ponte, e da lì escono le casse che non devono passare davanti ai Custodi di Passaggio. Lo sai perché da lì, una volta, ne hai fatte uscire anche tu. [calm] Lasci stare la porta con la corda tagliata e ti siedi sul parapetto dall'altra parte, al buio, con le gambe sopra la Cicatrice.

    [door creaking] Dopo un'ora la porta del ponte si apre ed esce Nestor, [glass clinking] con due sacche di vetri che tintinnano a ogni passo. [amused] Quando ti vede le posa per terra una alla volta, con molta cura, poi scappa giù verso la Pignatta a passo corto. [satisfied] Nel retro trovi la cassetta con le monete di un mese.
