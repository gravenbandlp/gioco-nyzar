# Regia del doppiaggio: Il Sepolcro violato
regia:
  sepolcro-sarcofago: |
    [somber] Galdrick appoggia la lanterna sul bordo del sarcofago e alza lo stoppino. Il coperchio di pietra è stato spostato di traverso, e sopra c'è inciso il nome di Padre Idrian Sollen, cappellano di Qir-Azel, con una foglia dell'Albero sotto le date. [slowly] Dentro non c'è niente, a parte qualche filo del sudario impigliato a una scheggia e l'ombra scura che il corpo ha lasciato sul fondo in cinque anni.

    Dietro la nicchia più vecchia una guardia trova una tunica nera da cerimonia, buttata in un angolo. [uneasy] È di stoffa fine, con le maniche strette, e quando la guardia la alza contro la luce ti accorgi che a un orco non arriverebbe alla vita. [solemn] Galdrick la piega con cura, come si piega una bandiera.

    Fuori, al sole, lo sceriffo si rimette il cappuccio di maglia e ti parla guardando il muro. [gruff] “Ti faccio avere un lasciapassare per i Quartieri Alti e per la Caserma” dice. “Detto questo, mi serve un favore. Le tre macchine della razzia le abbiamo trovate il mattino dopo sulle grondaie, spente, con le braccia ripiegate. In Caserma abbiamo il nucleo di una, e alla Biblioteca gli studiosi stanno esaminando le altre due. Portaglielo tu.” [wry] Poi aggiunge che hai lavorato bene, così in fretta che quasi non lo senti.
  sepolcro-sarcofago__1-esito: |
    Il nucleo te lo consegnano in Caserma la mattina dopo, avvolto in una coperta da cavallo dentro un sacco di tela. [curious] È una sfera di metallo grande come un cavolo, più pesante di quanto sembri, con incisioni fitte che si vedono solo controluce. Te lo carichi in spalla e senti il freddo del metallo attraverso la tela.

    [satisfied] Alla porta dei Quartieri Alti le guardie leggono il lasciapassare e ti fanno passare con il sacco, e una delle due ti chiama per nome.
  biblioteca-il-nucleo: |
    [calm] La Biblioteca di Qir-Azel è immersa in una luce color ambra, filtrata dalle grandi vetrate opache. Dai lampadari pendono cristalli luminescenti che ogni tanto sfarfallano tutti insieme, e allora i lettori alzano la testa e aspettano. Gli scaffali salgono fino alle travi, e dalla tromba della scala si vedono quelli del secondo piano, con le ante sigillate dalla cera nera della Confraternita. [wry] Su quelli bassi un cartellino scritto a mano prega di non appoggiare il cappello.

    Dietro un bancone di legno scuro, chino su una pila di libri, c'è un vecchio con la barba bianca lunga e un panciotto rosso passato di moda da decenni. [amused] Quando ti vede sobbalza, si sistema il monocolo e ti fa cenno di avvicinarti, svelto per la sua età. [warmly] “Ah, eccoti, giusto in tempo” dice Ulric Stanne. “Non vedevo effettivamente l'ora.”

    Posi il sacco sul tavolo, accanto alla testa di metallo di un'altra macchina e a un cristallo conduttore che getta sul legno un bagliore blu. Dal primo piano scende Mattias Crenn, uno studioso stempiato con gli occhiali spessi e le vesti piene di polvere. Prima di guardarti si pulisce le lenti sulla manica.

    [mysterious] In fondo alla sala, a un tavolo da solo, siede un monaco enorme con il saio chiuso fino al collo. Padre Walter, della Confraternita del Velo, tiene le mani appoggiate su un libro chiuso e ti saluta con un cenno lento della testa.
  biblioteca-il-nucleo__1-esito: |
    [thoughtful] “Mattias e io ci abbiamo passato tre giorni, con Orvald Temmerin dell'Accademia” dice Ulric, e tamburella due dita sulla testa di metallo. “Le memorie erano quasi tutte cancellate. L'ultima istruzione però è rimasta effettivamente intera, e dice [ominous] “Ascoltate gli ordini di Balthog il Prescelto, qualunque essi siano”. Gliel'hanno mandata da fuori, con un dispositivo che imita i Precursori, e chi l'ha mandata non siamo riusciti a rintracciarlo.”

    [quickly] Mattias si rimette gli occhiali e parla a raffica, come gli capita quando l'argomento gli interessa. Per dare ordini a tre macchine così, e da lontano, ci vuole una volontà enorme. [nervously] “Se dietro c'è Balthog” dice, “allora Balthog è tutt'altro che il bruto di cui ridono alla Pignatta.”
  biblioteca-il-nucleo__2-esito: |
    [somber] Padre Walter parla piano, e ogni tanto si ferma a scegliere la parola. Nel centoquarantacinque, per un mese, un assassino che chiamavano il Cucitore uccise venticinque persone e le ricompose come offerte. [ominous] L'ultima notte prese lo sceriffo Ivo Carstan in un vicolo, e le guardie seguirono il sangue fino alle scale della Roccia di Wren, un isolotto di roccia nera all'estremità nord-est del Torvessa.

    Lassù abitava Osric Wren, un intagliatore di uccelli, e le guardie salirono temendo di trovarlo fra le vittime. [long pause] Wren era il Cucitore. [eerie] Sotto la capanna c'era un altare dedicato a un Demone Uccello, e ai suoi piedi c'era Wren, morto, dopo essersi cavato gli occhi e tagliato la lingua come ultima offerta. [solemn] Bruciarono la casa e distrussero le scale, e il corpo lo bruciarono sulla riva.

    [quietly] Walter tiene gli occhi sul libro chiuso. Ti accorgi di avere le mani strette fra le ginocchia.
  biblioteca-il-nucleo__3-esito: |
    Walter apre le mani sul libro. [quietly] Il mattino dopo la razzia Padre Vantes è sceso nella cripta e ha sentito un freddo che con la stagione non aveva niente a che fare, e ha mandato a chiamare lui. Nel centoquarantacinque era stato Walter a esaminare l'altare della Roccia prima che lo distruggessero, e quell'aria se la ricorda ancora.

    [eerie] “Fredda e paziente” dice, e posa di nuovo le mani sul libro. [solemn] “Sopra il sarcofago di Padre Sollen ho sentito qualcosa di molto simile, e io non sono uno che esagera.”

    [pause] [wry] Ulric si toglie il monocolo e lo pulisce sul panciotto per un tempo lunghissimo.
  biblioteca-il-nucleo__4-esito: |
    Walter apre le mani sul libro. [quietly] Il mattino dopo la razzia Padre Vantes è sceso nella cripta e ha sentito un freddo che con la stagione non aveva niente a che fare, e ha mandato a chiamare lui. Nel centoquarantacinque era stato Walter a esaminare l'altare della Roccia, e quell'aria se la ricorda ancora. [eerie] “Fredda e paziente” dice, e posa di nuovo le mani sul libro. “Sopra il sarcofago di Padre Sollen ho sentito qualcosa di molto simile.”

    Quando racconti della tunica nera, Ulric ti fa ripetere com'erano le maniche e misura nell'aria una spalla con le mani. [thoughtful] “Spalle così strette” dice. “Un elfo, o un mezzelfo. Un orco ci infilerebbe a stento un braccio.” [somber] Walter annuisce piano e torna a guardare il libro chiuso.
  biblioteca-il-nucleo__5-esito: |
    [determined] Lo dici ad alta voce prima di averlo deciso del tutto, e Ulric ti guarda da sopra il monocolo. Walter non prova a fermarti. [somber] Ti spiega che nel centoquarantacinque le scale le hanno distrutte, e che i pescatori del Torvessa girano alla larga dalla Roccia anche di giorno.

    [wry] Mattias ti scrive su un foglietto la strada lungo il fiume, con una grafia così piccola che per leggerla devi avvicinarla alla lampada. Ulric ti stringe la mano e la tiene un po' più del necessario. [warmly] “Torna a raccontarmelo, che ci tengo effettivamente molto” dice.
  biblioteca-il-nucleo__6-esito: |
    Racconti del banco dell'Accademia e dei sei cristalli che hanno vibrato insieme poco prima che le macchine calassero dalle grondaie. [curious] Mattias ti fa ripetere tutto due volte. [thoughtful] “Orvald ce l'aveva accennato, effettivamente, a modo suo” dice Ulric, e tamburella due dita sulla testa di metallo. [ominous] Nelle memorie dei nuclei è rimasta intera soltanto l'ultima istruzione, “Ascoltate gli ordini di Balthog il Prescelto, qualunque essi siano”, mandata da fuori con un dispositivo che imita i Precursori. I tuoi cristalli l'hanno raccolta per caso.

    [uneasy] Mattias si toglie gli occhiali e dice che per tenere in fila tre macchine da lontano ci vuole una volontà enorme, e che il Balthog di cui ridono alla Pignatta una volontà così non ce l'avrebbe.
  biblioteca-il-nucleo__7-esito: |
    [warm] Walter ti riconosce dal modo in cui fai il segno dell'Albero, svelto, come lo insegna Ottilia ai novizi nel corridoio all'alba, e ti fa sedere accanto a sé invece che di fronte. [somber] Nel centoquarantacinque, ti racconta, il Cucitore uccise venticinque persone e le ricompose come offerte, e l'ultima notte prese lo sceriffo Ivo Carstan. Le guardie seguirono il sangue fino alla Roccia di Wren, dove Osric Wren intagliava uccelli. [eerie] Sotto la capanna c'era un altare a un Demone Uccello, e Wren ci era morto davanti, con gli occhi cavati e la lingua tagliata.

    [quietly] “L'altare l'ho esaminato io” dice, e posa le mani sul libro chiuso. “In Cattedrale ce lo raccontiamo soltanto fra noi vecchi, e adesso lo sai anche tu.”
  biblioteca-gli-archivi: |
    Ulric Stanne ti ascolta senza interromperti, con il monocolo in mano, e quando arrivi alle parole dello spettro se lo rimette sull'occhio. Mattias Crenn è sceso dal primo piano con le lenti appannate e una macchia d'inchiostro sul mento. Padre Walter occupa l'unica sedia che regge la sua mole, con il saio chiuso fino al collo nonostante il caldo dei lampadari. [wry] Sopra il bancone un cartello chiede di non bagnarsi le dita per voltare le pagine, e sotto qualcuno ha aggiunto a matita “nemmeno con la lingua”. [uneasy] Nei vestiti hai ancora l'odore del legno intagliato della Roccia.

    [thoughtful] “La Regina delle Ali Spezzate” ripete Ulric. “In quarant'anni qui dentro ho letto parecchio, e questo nome scritto non l'ho mai trovato.” Mattias dice che nei frammenti precuriani non compare nessuna regina e si pulisce le lenti sulla manica. [hesitant] Sulla ragazza d'argento nessuno azzarda niente, e Ulric osserva che una parola detta da uno spettro non basta a fare una persona.

    [solemn] Walter parla per ultimo. “Le ali dell'altare erano per metà di metallo, e nelle venature del legno correvano fili di rame. Le macchine dei Precursori scese dai tetti la sera del Festival avevano lo stesso rame. Questo l'ho visto, il resto lo lascio a chi legge.” Si tocca il colletto del saio, dove la stoffa è lisa.

    [whispers] [uneasy] Se Ulric non l'ha mai letta, forse non l'ha mai scritta nessuno. [quickly] Mattias si alza di scatto e dice di cominciare dagli orchi di Capomozzo, la tribù di Balthog il Prescelto. Ulric indica il catalogo con il mento.
  biblioteca-gli-archivi__1-successo: |
    Parti dagli indici delle cronache della costa nord, che rimandano quasi tutti a qualche volume su Capomozzo o sul Rovolungo. [curious] Nel cassetto del catalogo cerchi le schede di quei volumi, e la numerazione salta dalla trecentododici alla trecentoquarantatré. In quel punto il fondo del cassetto è più chiaro, perché per anni le schede l'hanno tenuto al riparo dalla luce.

    Ulric si china sul cassetto e conta le schede due volte con il dito, [quietly] poi dice piano che sono spariti, le schede insieme ai libri. [cold] “Chi li ha presi sapeva dove guardare” aggiunge, e richiude il cassetto con due dita.
  biblioteca-gli-archivi__1-fallimento: |
    [tired] Passi il pomeriggio sugli indici e ti perdi fra tre cataloghi diversi, uno dei quali, lo scopri alla fine, ordina i libri secondo il colore della rilegatura. [bitter] Quando il custode comincia a spegnere i lampadari hai gli occhi che bruciano e in mano nessun titolo utile.

    [warmly] Ulric ti accompagna alla porta e ti dice di tornare domattina, prima dell'apertura, perché stanotte agli scaffali ci sale lui con la lanterna.
  biblioteca-gli-archivi__2-successo: |
    Sali in galleria con una lanterna e guardi i ripiani invece dei dorsi. [curious] Sulla parete nord la polvere è alta un dito dappertutto, tranne che su due ripiani, dove restano i rettangoli puliti lasciati dai libri. Ne conti una trentina in fila, e sulla targhetta di ottone del ripiano c'è scritto Costa nord.

    Quando chiami Ulric, lui sale tenendosi al corrimano e guarda i rettangoli senza toccarli. [quietly] “Capomozzo e il Rovolungo, fino all'ultimo atlante” dice a bassa voce, e si toglie il monocolo per pulirlo sul panciotto. [ominous] Secondo lui li hanno tolti da poco, e con molta calma.
  biblioteca-gli-archivi__2-fallimento: |
    [tired] Resti in galleria finché accendono i lampadari della sera, e non trovi altro che polvere. [wood scraping] A un certo punto una scala a pioli scorre sul binario dietro di te, e il raschio del legno ti riporta alla capanna sulla Roccia, al coltello che incideva da solo. [gasps] Ti volti con il fiato corto. [relieved] In fondo alla galleria un garzone sta spingendo la scala verso gli scaffali alti.

    Ulric ti trova sull'ultimo gradino della galleria e ti porta di sotto. Mentre scendete ti dice che cosa ha trovato lui nel catalogo. [somber] I libri su Capomozzo e sul Rovolungo non ci sono più, e qualcuno ha tolto anche le schede.
  biblioteca-gli-archivi__3-successo: |
    [wry] Il copista ha le maniche di lustrino e ti ascolta con le labbra strette. Gli parli con tutto il garbo che hai, e alla fine gli citi l'articolo del regolamento cittadino che apre il registro a chi ha servito la città. [sighs] Lui sospira e gira il librone verso di te. [curious] Negli ultimi dieci anni nessun volume della costa nord è uscito in prestito, e le pagine di quegli anni sono ordinate e complete.

    Ulric legge da sopra la tua spalla, e il monocolo gli cade sul panciotto. [quietly] “Allora sono spariti”, dice, “e chi li ha presi da questo registro non è passato.”
  biblioteca-gli-archivi__3-fallimento: |
    [uneasy] Il copista ti ascolta fino in fondo, poi ti chiede il nome e lo scrive su un foglio a parte insieme alla data e all'ora. Il registro resta chiuso sotto il suo gomito.

    Lo apre un'ora dopo Ulric, che il copista lo conosce da trent'anni, e ti chiama a vedere. [somber] Dei libri su Capomozzo e sul Rovolungo non è mai uscito niente, eppure dagli scaffali sono spariti. [bitter] Il foglio con il tuo nome intanto è finito in un cassetto, e a fine settimana salirà in Municipio con gli altri.
  biblioteca-gli-archivi__4-esito: |
    [tired] Porti le lanterne su e giù per la galleria mentre Ulric cerca, e dopo un po' smetti di contare i gradini. [amused] Lui recita i titoli a memoria prima di trovarli, e li trova quasi tutti. [somber] Su Capomozzo e sul Rovolungo non trova nemmeno una scheda.

    Quando il custode spegne l'ultimo lampadario Ulric si siede sui gradini della galleria, con il panciotto sbottonato. [sad] “Spariti” dice. “Io sono qui da quarant'anni, e la memoria perfetta non ce l'ho. Ma una cosa così non l'avevo mai vista.” [tender] Rimane seduto con la lanterna sulle ginocchia finché non gli porgi la mano.
  biblioteca-gli-archivi__5-esito: |
    Il copista ha le maniche di lustrino e le labbra strette, finché non ti riconosce. [amused] Allora si alza a metà dalla sedia, ti chiede dei tuoi e poi di una zia che a sentir lui scriveva le lettere più lunghe della città, con le code delle esse che non finivano mai. [wry] Gli chiedi il registro dei prestiti come si chiede un favore a cena, e lui lo gira verso di te senza citare nessun articolo del regolamento.

    [curious] Negli ultimi dieci anni nessun volume della costa nord è uscito in prestito. Ulric legge da sopra la tua spalla, e il monocolo gli cade sul panciotto. [quietly] “Allora sono spariti” dice, “e chi li ha presi da questo registro non è passato.”
  biblioteca-gli-archivi-mattina: |
    La mattina dopo Ulric Stanne ti aspetta sulla porta della Biblioteca, prima che apra. [wry] Ha il panciotto rosso abbottonato storto e le borse sotto gli occhi gonfie, perché ha passato la notte agli scaffali. Dietro di lui il liuto è appoggiato alla scrivania con una corda rotta, la stessa da quando lo conosci.

    [urgent] “Capomozzo e Rovolungo” dice senza salutarti. “Gli atlanti e le cronache marittime, fino all'ultima nota di un cacciatore di foche. Li ho cercati nel catalogo vecchio e in quello nuovo. Le schede le hanno tolte e gli scaffali li hanno svuotati, con ordine. [short pause] Sono spariti.”

    Si toglie il monocolo e lo pulisce sul panciotto, più a lungo del necessario. [thoughtful] “Qir-Azel vede passare più libri di quanti tramonti veda un uomo, e io non posso giurare di averli visti tutti. Però una cosa del genere, in quarant'anni, non mi era mai capitata. [uneasy] È molto strano.”

    Ti porge un foglio piegato in quattro. Sopra, con la sua grafia piccola e diritta, ci sono le segnature dei volumi mancanti, una sotto l'altra.
  biblioteca-gli-archivi-mattina__1-esito: |
    Ti infili il foglio nella giubba. [quietly] Ulric resta sulla soglia a guardare la strada, dove un garzone porta il pane ai manieri, e ti chiede di non parlarne in giro finché non ha capito chi entra in galleria quando lui non c'è.

    [uneasy] Scendendo verso la piazza tocchi il foglio due volte attraverso la stoffa, per sentire che c'è ancora.
  galdrick-il-rapporto: |
    Le due guardie in giaco di maglia davanti al portone ti riconoscono e ti fanno passare. [wooden thuds] Nel cortile, dove si addestrano a turno le quasi cinquecento guardie della città, un sergente fa colpire i manichini di paglia a tempo, [wry] e uno dei manichini porta un elmo vero, ammaccato, che qualcuno gli ha messo per scherzo e che da allora nessuno toglie.

    L'ufficio dello sceriffo è pieno di muratori, perché dopo la razzia hanno trovato una crepa nel muro maestro. Galdrick ti riceve nel corridoio del mastio, sotto la teca con la spada ammaccata di Ivo Carstan, [amused] e qui fuori sembra non sapere dove mettere le mani. Prima le incrocia dietro la schiena, poi infila i pollici nella cintura.

    Gli racconti della cripta e della Roccia di Wren. [somber] Quando nomini il Cucitore alza gli occhi sulla spada nella teca e resta zitto finché non hai finito.

    [gruff] “Gli orchi presi vivi dopo la razzia li ho interrogati io, con il carceriere presente” dice. “Nella cantilena c'erano due informazioni utili. Il loro capo non era un orco, e doveva fare qualcosa al cimitero. La tunica che abbiamo trovato nella cripta è di taglia piccola. La metto agli atti insieme alle orme del cimitero.”

    [uneasy] In fondo al corridoio passa Borso, con il grembiule di cuoio e un secchio di zuppa per le celle del sotterraneo. Ha la faccia piena di cicatrici e il naso storto in più punti. Saluta lo sceriffo con un cenno e scende le scale senza guardarti.
  galdrick-il-rapporto__1-esito: |
    Gli riferisci le parole dello spettro sulla Regina e sulla ragazza d'argento, poi gli parli degli scaffali vuoti della costa nord. [thoughtful] Galdrick ascolta con i pollici nella cintura e ripete a mezza voce Capomozzo e Rovolungo, per fissarli.

    [gruff] “Capomozzo è la tribù di Balthog” dice. “Prima del Festival le tribù del circondario non si erano mai mosse insieme. Metto tutto agli atti e lo porto al Consiglio, in Municipio, alla prossima seduta. [deadpan] Che cosa deciderà il Consiglio non lo so ancora, e se lo sapessi non te lo direi in un corridoio.” [satisfied] Ti stringe la mano con forza e torna verso i muratori.
  galdrick-il-rapporto__2-successo: |
    [calm] Gli racconti dello spettro e degli scaffali vuoti, e quando arrivi alla ragazza d'argento passi oltre senza cambiare voce. Galdrick annuisce ogni tanto con il mento e muove appena le labbra, per tenere a mente i nomi.

    [gruff] “Capomozzo è la tribù di Balthog” dice alla fine. “Prima del Festival le tribù del circondario non si erano mai mosse insieme. Metto agli atti e porto la cosa al Consiglio, in Municipio.”

    [slyly] Uscendo dal portone ti ripeti a mente le parole che hai taciuto, e le tieni in testa per tutta la discesa verso la Città Bassa, dove qualcuno saprà quanto valgono.
  galdrick-il-rapporto__2-fallimento: |
    [nervous] Quando arrivi alle ultime parole dello spettro salti mezza frase, e Galdrick se ne accorge. Ti guarda più a lungo, poi tira fuori dalla giubba un taccuino e ci scrive una riga, con una matita corta. [coldly] “Continua” dice, e tu gli racconti anche la parte che volevi tenerti.

    Alla fine ti dice che metterà tutto agli atti e porterà la cosa al Consiglio, in Municipio, insieme alla questione delle tribù. [bitter] Il taccuino torna nella giubba con la riga che riguarda te.
  galdrick-il-rapporto__3-successo: |
    [slyly] Gli fai notare che per scendere in quella cripta la Caserma avrebbe mandato quattro guardie e un sergente, e che le guardie si pagano. Galdrick ci pensa, poi chiama un furiere dalle scale e gli fa contare la somma dalla cassa delle spese di servizio.

    [gruff] “Firma la ricevuta” dice. “Il rapporto lo metto agli atti. Capomozzo e le tribù li porto al Consiglio, in Municipio, alla prossima seduta.” [satisfied] Ti guarda firmare, e soltanto allora toglie i pollici dalla cintura.
  galdrick-il-rapporto__3-fallimento: |
    Galdrick ti ascolta fino in fondo, poi dice che la Caserma paga una tariffa e che la tariffa è scritta. [bitter] Il furiere ti conta il poco che la tariffa prevede contro ricevuta e lo sceriffo intanto guarda la spada nella teca.

    Ti dice che il rapporto andrà agli atti, e che la questione delle tribù la porterà al Consiglio, in Municipio. [resigned] Quando ti saluta lo fa con un cenno del capo, e la mano resta nella cintura.
