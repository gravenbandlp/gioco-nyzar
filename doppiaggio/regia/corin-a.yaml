# Regia del doppiaggio: La caccia di Corin
regia:
  verso-la-foresta-strisciante: |
    Davanti alle Scuderie della Zanna Rotta c'è odore di fieno bagnato e di cuoio ingrassato. Sopra la porta l'insegna mostra un cavallo da guerra che pianta gli zoccoli sulla schiena di un orco, [wry] dipinto con una cura per i dettagli che fa pensare a una faccenda personale. Dolovan Stroud è sulla soglia con un secchio in mano. Ti guarda passare senza salutare, poi dice qualcosa al cavallo più vicino a voce bassa e gentile, [horse snorting] e il cavallo gli risponde soffiando.

    Corin Ashdale ti aspetta in mezzo al cortile, [wry] vestito per la caccia come se l'avesse imparato su un libro, con gli stivali nuovi che ancora scricchiolano e una balestra a tracolla dal calcio intarsiato di madreperla. [whispers] [sarcastic] Quella balestra non ha mai tirato a niente che respiri. [somber] Ha le occhiaie scure. Al Grifone dicono che dorme male dalla notte della razzia, da quando gli orchi gli hanno ammazzato il cane.

    [warmly] “Eccoti! Temevo che ci avessi ripensato.” Ride per primo, come fa sempre quando è imbarazzato. [nervously] “Il signor Stroud dice che il cinghiale grosso sta nella Foresta Strisciante, vicino al fiume. Due chilometri appena. [hesitant] Beh, insomma, qualcosa di più.”

    La strada va a ovest, oltre il Ponte del Conciatore. Il nome gli viene dagli scarti delle concerie che ci buttavano sotto fino a sessant'anni fa, [wry] e le assi hanno ancora un odore che ti fa respirare con la bocca. Sul ponte c'è una ronda della Guardia, e il sergente guarda prima la balestra di Corin e poi te, e si gratta la barba senza dire niente.
  verso-la-foresta-strisciante__1-esito: |
    Il baio con la cicatrice sulla spalla si lascia montare senza storie, [wry] poi decide da solo che si va al passo e non c'è verso di fargli cambiare idea. Corin ogni tanto si volta ad aspettarti, e ogni volta te ne chiede scusa, come se la lentezza fosse colpa sua. [calm] Seguite la riva sud del Torvessa per mezz'ora, con la scarpata rossa del Gradone sulla sinistra, finché le collinette non si aprono e davanti a voi compare il bosco, scuro di abeti.
  verso-la-foresta-strisciante__2-esito: |
    [warm] Il tuo cavallo ti riconosce dall'odore e ti spinge la spalla con il muso prima ancora che tu monti. Corin lo guarda con un'invidia da bambino e chiede a Stroud se ne ha uno uguale da vendere, e Stroud risponde di no senza staccargli gli occhi di dosso. [excited] “Lo sapevo che eravate gente seria” dice Corin, [wry] e sprona il suo con un entusiasmo che il suo cavallo non condivide. Seguite la riva sud del Torvessa al trotto, sotto la scarpata del Gradone Rosso, e arrivate al limitare del bosco con le gambe ancora fresche e Corin senza fiato.
  foresta-la-fossa-caduta: |
    [gasps] Cadi. [tense] La fossa è profonda due volte la tua altezza, e in fondo ci sono i pali appuntiti piantati anni fa da un cacciatore, neri di muffa ma ancora dritti. Sulla parete di terra si vedono i segni degli zoccoli di un capriolo che ha provato a risalire. A un braccio dalla tua mano sporge dalla parete di terra una radice d'abete grossa come un polso. Da sopra arriva la voce di Corin, che grida il tuo nome e poi, [wry] a corto di idee, anche il suo.
  foresta-la-fossa-caduta__1-successo: |
    [strained] Le dita si chiudono sulla radice e la spalla ti dà uno strappo che senti fino ai denti, ma tieni. Resti appeso sopra i pali, con la terra che ti piove negli occhi, finché Corin non si sdraia sull'orlo e ti allunga la cinghia della balestra. [wry] Ti tira su con più coraggio che braccia. [exhales] Restate seduti per terra tutti e due a respirare, e intanto la pista si è raffreddata.
  foresta-la-fossa-caduta__1-fallimento: |
    [pained] La radice ti scivola fra le dita e finisci in fondo alla fossa, fra i pali. Uno ti apre la coscia di striscio, un altro si spezza sotto il tuo peso, marcio, [wry] ed è per questo che sei ancora intero. Corin ti cala il mantello di velluto annodato alla cinghia della balestra, e ci metti un bel pezzo a risalire. [quietly] Fuori ti fasci la gamba con una striscia di seta ricamata che lui ti porge senza dire niente.
  foresta-la-fossa-caduta__2-esito: |
    [tense] Ti giri verso la parete e ti lasci scivolare a pancia in giù con le mani e le ginocchia piantate nella terra. Arrivi in fondo con i palmi scorticati e i piedi fra due pali, [exhales] a un dito dalle punte. Corin ti cala il mantello annodato alla cinghia della balestra, e risalire ti prende quasi un'ora, [wry] durante la quale lui ti chiede scusa di continuo per una fossa che ha scavato qualcun altro.
  il-cinghiale-mutato: |
    [ominous] Le tracce ti portano in una radura dove le sequoie si allargano e la luce scende dritta. L'erba è schiacciata in larghi cerchi, e dappertutto ci sono carcasse, cervi ridotti a strisce di pelle e un branco di caprioli fatto a pezzi e lasciato lì senza un morso. Su un fianco, vicino a un tronco caduto, c'è un puma dal manto color brace con le fauci aperte, e la pelliccia gli fuma ancora sulle punte. [quietly] Corin, accanto a te, smette di parlare per la prima volta da stamattina.

    [tense] Il cinghiale è al centro della radura. L'aria intorno a lui si fa densa e ti preme sul petto, [mud bubbling] e il fango sotto i suoi zoccoli bolle piano. I cacciatori non avevano esagerato. È grande come un carro, una montagna di setole grigie fradice e di protuberanze d'osso. [eerie] Sotto la pelle gli pulsano lente vene d'argento, e dove il puma l'ha ferito il sangue cola grigio e denso, come cenere bagnata. [whispers] [uneasy] Questa è opera della Marea Grigia, e ce l'hai a trenta passi. [short pause] Gli occhi piccoli e rossi si girano verso di voi.

    Corin non prende la balestra. Slega dalla sella un fagotto di velluto e ne tira fuori un tubo di metallo scuro lungo quanto un braccio, con una camera di cristallo in mezzo e un'impugnatura storta che non è fatta per mani umane. [hushed] “Un'arma dei Precursori. L'ho pagata quanto una casa a un Raschiatore che non voleva dirmi dove l'aveva presa” sussurra. “Quando prende, non resta niente. [nervously] Il guaio è che ci mette tanto a caricarsi, e io non prendo mai.” [low electric hum] Il cristallo comincia a ronzare piano.
  il-cinghiale-mutato__1-vittoria: |
    [wood splintering] Il cinghiale carica spezzando un abete giovane come un fuscello, e tu ti butti di lato all'ultimo. Lo colpisci due volte dietro la spalla, dove il pelo è più rado, finché le gambe non gli cedono e va giù di fianco [heavy thud] con un tonfo che ti arriva nei denti. [exhales] Il sangue grigio fuma sull'erba. [wry] Il cristallo dell'arma di Corin finisce di caricarsi proprio adesso, e lui la abbassa con cura. Poi si avvicina a piccoli passi e tocca la zanna con la punta dello stivale, [uneasy] e ride forte, troppo a lungo, con le mani che tremano.
  il-cinghiale-mutato__1-sconfitta: |
    [pained] La carica ti prende di striscio e ti manda a sbattere contro una sequoia, e il mondo per un po' è fatto solo di corteccia. Quando riapri gli occhi il cinghiale è sopra di te con le zanne basse, e la bava grigia ti cola sulla giacca. [short pause] Poi la radura diventa bianca. [fabric tearing] Un filo di luce passa sopra la tua testa con un rumore di tela strappata e apre alla bestia un buco nel fianco grande come un pugno. Il cinghiale fa tre passi e cade. A dieci passi Corin è seduto per terra, sbalzato dal colpo, con il tubo che fuma fra le gambe. [breathing heavily] Hai le costole che scricchiolano a ogni respiro.
  il-cinghiale-mutato__2-successo: |
    [determined] La trovi a cento passi, fra due abeti, sotto un mucchio di rami troppo in ordine. Ti fai vedere e poi scappi da quella parte, tenendo la fossa fra te e lui e girando largo intorno ai rami per non lasciargli la tua traccia sopra. [wood splintering] Il cinghiale carica dritto, e i rami cedono sotto il suo peso con uno schianto. I pali gli entrano nei fianchi e non bastano. [tense] Laggiù la bestia si dibatte e la terra delle pareti frana a ogni colpo di zanna. Corin si affaccia sull'orlo, punta il tubo verso il basso con tutte e due le mani e aspetta che il cristallo smetta di ronzare. Il lampo illumina la fossa fino al fondo, [pause] e poi c'è solo silenzio.
  il-cinghiale-mutato__2-fallimento: |
    [pained] Il cinghiale ti taglia la strada fra gli abeti e ti prende con il fianco, e voli fra le felci con la coscia aperta da una zanna. Mentre cerchi di rialzarti la bestia si gira per finirti, e una zampa posteriore le scivola sui rami della fossa. Ci cade dentro per metà. [urgent] Corin le correva dietro urlando, e tira dall'orlo a tre passi di distanza. [crackling blast] Il colpo lo sbatte contro un abete. [tired] La bestia non esce più dalla fossa, e tu ci metti molto a rialzarti.
  il-cinghiale-mutato__3-successo: |
    [tense] Ti metti con la schiena contro la sequoia più grossa e aspetti, con il cuore in gola, mentre la bestia raspa la terra. Quando carica ti butti di lato all'ultimo momento, [wood splintering] e le zanne entrano nel legno fino alla radice con uno schianto che fa piovere aghi su tutta la radura. Resta lì incastrato a scuotere la testa, e il tronco geme a ogni strattone. [soothingly] “Fermo, fermo” dice Corin alla bestia, come a un cavallo, e le arriva a cinque passi con il tubo alzato. Il lampo la prende alla base del collo. [wry] Corin si ritrova seduto nell'erba, e per un po' sente solo un fischio.
  il-cinghiale-mutato__3-fallimento: |
    Ti butti di lato troppo presto, e il cinghiale corregge la carica come se l'avesse previsto. [pained] La zanna ti prende al fianco e ti solleva da terra, e la sequoia la incontri tu, con la schiena. Mentre sei a terra senza fiato la bestia si gira per finirti e incastra una zanna in una radice. [urgent] Corin le arriva da dietro a occhi chiusi e tira a bruciapelo, e il lampo passa così vicino a te che ti brucia la manica. [short pause] La bestia non si rialza. [wry] Tu, per un bel pezzo, nemmeno.
  il-cinghiale-mutato__4-successo: |
    Corin ti passa il tubo senza discutere, [wry] sollevato. L'impugnatura è troppo larga per le tue dita, e la incastri sotto l'ascella come un remo. [rising electric hum] Il cristallo ronza sempre più acuto mentre il cinghiale raspa e abbassa la testa, e capisci che il colpo parte quando il ronzio si ferma. [tense] La bestia carica. Il ronzio si ferma a venti passi, [short pause] e il filo di luce le entra nel petto. [exhales] La carica finisce da sola ai tuoi piedi, e il contraccolpo ti ha messo a sedere nel fango.
  il-cinghiale-mutato__4-fallimento: |
    [tense] Tieni il tubo come una balestra e aspetti il colpo che non parte, mentre la bestia ti viene addosso. Il ronzio si ferma quando hai già le zanne sotto il braccio. [crackling blast] Il lampo parte verso il cielo, ti brucia le sopracciglia e spacca il ramo più alto di una sequoia. Il ramo cade sulla schiena del cinghiale e lo inchioda a terra quel tanto che basta a Corin per riprendersi il tubo e aspettare la seconda carica con le mani che tremano. [slowly] Fra la prima e la seconda passa un tempo lunghissimo.
  il-cinghiale-mutato__5-esito: |
    [fire crackling] Accendi un ramo di resina e ti metti fra la bestia e Corin, gridando. Il fuoco la ferma una volta. [pained] La seconda volta il cinghiale ti passa sopra, e senti qualcosa nel petto che si sposta. La terza volta ti prende con il muso e ti lancia contro un tronco, e mentre ti rialzi il cristallo smette di ronzare. Il lampo apre il fianco alla bestia, e lei crolla a quattro passi da te. [exhausted] Corin arriva di corsa con la faccia rossa, ti tira su per la giacca e non riesce a dire niente per un pezzo.
  il-cinghiale-mutato__6-successo: |
    [calm] Ti fai dare il tubo e lo giri verso la luce. Sul bordo della camera di cristallo c'è una tacca d'ottone, e sulle piattaforme hai visto un vecchio Raschiatore spiegare a una recluta che il colpo parte un attimo dopo che la tacca smette di vibrare. [tense] Pianti il calcio contro una radice per reggere il contraccolpo e aspetti, con il pollice sulla tacca, mentre il cinghiale raspa.

    Quando carica, [short pause] la tacca si ferma. Il filo di luce gli entra nel petto a venti passi, e la bestia finisce la corsa da sola, nel fango, a un braccio dai tuoi stivali. [wry] Corin ti guarda a bocca aperta, e poi guarda il tubo come se lo vedesse per la prima volta.
  il-cinghiale-mutato__6-fallimento: |
    [tense] La tacca vibra ancora quando il cinghiale è già a dieci passi, e tu aspetti un momento di troppo. Il lampo parte mentre ti butti di lato e gli apre una spalla senza fermarlo. [pained] La zanna ti prende alla coscia e ti fa rotolare fra le felci.

    Corin raccoglie il tubo dove l'hai lasciato cadere e aspetta la seconda carica con le mani che tremano, [wry] e questa volta la tacca la guarda anche lui. La bestia cade a quattro passi da voi. [tired] Ti ci vuole un pezzo per rialzarti, e la coscia ti pulsa fino al fiume.
  foresta-il-puma-nero: |
    [exhales] Il cinghiale è a terra, e nella radura c'è silenzio abbastanza a lungo perché ti torni il fiato. [short pause] Poi dal margine degli alberi esce un puma.

    [awed] È più grande di quello morto e ha il manto nero, attraversato da vene color brace che si accendono e si spengono piano. A ogni passo, sotto le zampe, si alzano piccole scintille arancioni. Il puma attraversa la radura senza guardare il cinghiale e va dritto al compagno caduto, [softly] gli abbassa il muso sul collo e resta lì a respirare. Non ringhia e non abbassa le orecchie. [pause] Quando alza gli occhi vedi che sono color ambra, e che sono girati verso di te.

    Corin tiene la balestra scarica contro il petto e muove le labbra senza voce. [whispers] [tender] Quello morto era il suo compagno, e lui è venuto a salutarlo. [tense] Il puma fa un passo nella tua direzione.
  foresta-il-puma-nero__1-esito: |
    [softly] Ti avvicini di lato a passi corti, con gli occhi sull'erba e le mani lontane dalle armi. Il puma ti lascia arrivare a un braccio di distanza, poi allunga il muso verso le tue dita, e senti sulla pelle un caldo da focolare. [awed] Per il tempo di un respiro vedi il sottobosco dall'altezza di un ginocchio, e il puma color brace che corre davanti a te e poi smette di correre. Quando torna fra gli alberi ti resta in testa il nome Braska, e non sapresti dire chi te l'ha detto.

    [mysterious] Sulla strada del ritorno, due volte, vedi delle scintille arancioni fra gli abeti, sempre alla stessa distanza da te. [warm] Al Ponte del Conciatore Corin fa venire un carro per il cinghiale, e prima di salutarti ti fa promettere che domani sera sarai al Grifone.
  foresta-il-puma-nero__2-esito: |
    [softly] Ti abbassi su un ginocchio e tendi la mano aperta, il palmo in giù, come si fa con i cavalli nuovi. Il puma la guarda a lungo. [tender] Poi attraversa lo spazio che vi divide in tre passi lenti e ti passa sotto la mano la testa intera, dalla fronte alle orecchie, calda come una pietra lasciata al sole. Senti le braci muoversi sotto il pelo. Se ne va com'è venuto, [quietly] e ti lascia addosso un nome che nessuno ha pronunciato, Braska.

    [mysterious] Sulla strada del ritorno, due volte, vedi delle scintille arancioni fra gli abeti, sempre alla stessa distanza da te. [warm] Al Ponte del Conciatore Corin fa venire un carro per il cinghiale, e prima di salutarti ti fa promettere che domani sera sarai al Grifone.
  foresta-il-puma-nero__3-esito: |
    [tense] Resti fermo con le mani lungo i fianchi, e il puma ti guarda per un tempo che ti sembra lunghissimo. Gli occhi d'ambra passano da te a Corin, e poi al cinghiale a terra. [softly] Poi si gira e torna fra gli alberi senza fretta, e le scintille sotto le sue zampe si spengono una dopo l'altra nel sottobosco. [wry] Corin ricomincia a respirare con un rumore da mantice.

    Al Ponte del Conciatore Corin fa venire un carro per il cinghiale, e prima di salutarti ti fa promettere che domani sera sarai al Grifone. [amused] Ha ancora gli aghi di abete fra i capelli, e non se n'è accorto.
  foresta-il-puma-nero__4-esito: |
    [solemn] Ti inginocchi nell'erba e abbassi la testa finché vedi soltanto le tue mani, come al Circolo si fa davanti a una bestia che veglia un compagno. Senti i passi del puma venire avanti e il caldo del suo fiato sulla nuca, un caldo da focolare. Resta lì il tempo di un respiro lungo. [softly] Quando rialzi gli occhi sta tornando fra gli alberi, e ti resta in testa un nome che nessuno ha detto, Braska.

    [mysterious] Sulla strada del ritorno vedi due volte delle scintille arancioni fra gli abeti, sempre alla stessa distanza da te. [warm] Al Ponte del Conciatore Corin fa venire un carro per il cinghiale, e prima di salutarti ti fa promettere che domani sera sarai al Grifone.
