# Regia del doppiaggio: Il Sepolcro violato
regia:
  la-strada-per-la-roccia: |
    [calm] Esci dalla Città Bassa all'alba verso nord-est, dove le ultime case di pietra grezza lasciano il posto agli orti e ai recinti delle capre. [rug beating] Sulla porta dell'ultima casa una donna sbatte un tappeto contro lo stipite, e quando le chiedi la strada per il fiume smette di sbatterlo.

    [coldly] “Per il fiume va bene” dice. “Allo Scoglio invece non ci va nessuno, e tu hai la faccia di uno che ci va. [bitter] Mio figlio aveva sei anni quando c'era il Cucitore. Adesso ne ha undici, e prima di dormire guarda ancora sotto il letto, e poi ci riguarda.” Ti indica un sentiero fra i rovi e torna al tappeto, battendolo più forte di prima.

    Il sentiero costeggia il Torvessa verso nord-est, stretto fra i rovi e le pietre che affiorano, e dopo mezz'ora il rumore della città alle tue spalle si è sciolto nel ronzio dei moscerini. Alla foce di un fosso, sotto un salice, c'è una barca da pesca tirata in secca. [uneasy] Seduto sulla prua un vecchio ripara una rete con le dita gonfie, e ti guarda gli stivali prima della faccia. [whispers] [wry] Anche lui ha capito dove stai andando. [ominous] Più avanti, sopra l'acqua, la foschia comincia a salire.
  la-strada-per-la-roccia__1-esito: |
    [tired] Cammini per tutta la mattina con il fiume sulla destra. I rovi ti tirano i calzoni a ogni passo, e due volte devi tornare indietro perché il sentiero finisce in una pozza. [ominous] Verso mezzogiorno la vegetazione si apre all'improvviso, e in mezzo all'acqua melmosa vedi la Roccia di Wren che esce dritta dall'acqua, con la capanna in cima.

    Ti siedi su un sasso a vuotare uno stivale, e intanto la guardi. [eerie] Le imposte della capanna sono chiuse, e dal camino non esce fumo.
  la-strada-per-la-roccia__2-esito: |
    [hooves squelching in mud] Il cavallo procede con il muso basso e gli zoccoli che risucchiano il fango a ogni passo, e dove la riva si stringe fra i rovi si apre la strada con il petto. [ominous] A metà mattina sei già in vista della Roccia di Wren, nera in mezzo all'acqua melmosa, con la capanna in cima e le imposte chiuse. [wry] Leghi il cavallo a un salice storto, che comincia subito a strappare l'erba come se non ci fosse nient'altro al mondo.
  la-strada-per-la-roccia__3-esito: |
    [wry] Il vecchio morde le monete una alla volta per sentire se sono buone e poi le fa sparire nella camicia. [oars splashing] Rema seduto di traverso, con la schiena al fiume, e parla per tutto il tragitto. [gruff] “Dico io, allo Scoglio non ci attracco. Ti lascio ai giunchi e da lì ci arrivi coi piedi tuoi. [ominous] Mio cognato ci ha attraccato l'anno dopo l'incendio. Adesso vende castagne in Città Bassa, e da allora, dico io, l'acqua non la guarda più.”

    Ti lascia dove i giunchi si fanno fitti, a un tiro di sasso dalla Roccia. [wry] Le gambe ti ringraziano, e lui spinge la barca indietro prima che tu abbia finito di scendere.
  la-strada-per-la-roccia__4-esito: |
    [warm] Gli dici che ha la stessa mascella del castagnaro che sta all'imbocco del Ponte del Pesce, quello che d'inverno ti regalava le castagne bruciate quando eri bambino. [short pause] Il vecchio smette di cucire la rete. [gruff] “Mio cognato” dice. [chuckles] “Le bruciate le regalava perché nessuno le comprava, dico io.”

    Ti fa salire senza parlare di monete e rema seduto di traverso, con la schiena al fiume, [somber] raccontandoti di come il cognato ha smesso di guardare l'acqua dopo aver attraccato allo Scoglio. Ti lascia dove i giunchi si fanno fitti, a un tiro di sasso dalla Roccia, e spinge indietro la barca prima che tu abbia finito di scendere.
  la-strada-per-la-roccia__5-esito: |
    Lasci il sentiero dei rovi e scendi sulla striscia di fango dove l'acqua si è ritirata. [calm] Le volpi e i tassi vanno al fiume dritti, e qui le loro piste corrono fra le canne, battute da anni di zampe. [tender] Le segui a passo svelto, chinandoti ogni tanto a toccare un'orma per sentire se è fresca, come facevi da bambino nel Bosco di Velthar.

    A metà mattina il fango si apre su una spiaggetta di ghiaia, e davanti a te c'è la Roccia di Wren, nera nell'acqua melmosa, con la capanna in cima. [eerie] Sulla riva che le sta di fronte le piste si interrompono tutte nello stesso punto, [slowly] come se le bestie avessero deciso insieme di tornare indietro.
  l-altare-del-cucitore: |
    [eerie] Al piano di sopra l'aria è più fredda di quella del fiume, e il fiato ti esce bianco. La stanza occupa tutto il piano. [ominous] Contro la parete di fondo, sotto la finestra con le imposte chiuse, c'è l'altare del Demone Uccello, un corpo d'uomo scolpito nel legno nero con il volto allungato e il cranio coperto di piume dure e taglienti. Il legno è bruciato dentro, e dalle crepe si vede il carbone. Dalle spalle si aprono due ali storte, per metà di piume intagliate e per metà di lamine di metallo, e nelle vene scolpite delle braccia corrono filamenti di rame sottilissimi. [softly] Davanti all'altare c'è un cuscino da inginocchiatoio ricamato a fiori, consumato al centro.

    [wood carving] In fondo alla stanza un rumore leggero di attrezzo sul legno smette di colpo. [fearful] Senti un fruscio di piume sul pavimento e il suono di una lama che incide il legno, e dietro l'altare si forma una figura. [slowly] Prima compare un profilo, poi metà del corpo di un uomo sospeso a mezz'aria.

    [eerie] Osric Wren ha la pelle bianca e trasparente, attraversata da filamenti di luce. Gli occhi sono cuciti con un filo scuro a punti regolari, e sul collo ha due tagli incrociati. Porta ancora il grembiule da intagliatore, ridotto a strisce. [whispers] [uneasy] Ha ancora la tasca per la matita. [tense] In mano tiene un coltello da intaglio fatto di luce, con la lama sottile come un raggio di luna, e gira la testa verso di te.
  l-altare-del-cucitore__1-vittoria: |
    [tense] Il coltello di luce ti passa vicino alla faccia e lascia nell'aria un odore di legno appena tagliato. Il tuo colpo invece arriva, e Osric Wren si apre come una cucitura che cede, dal petto alle spalle, in fili di luce che si spengono uno dopo l'altro. [eerie] Prima di sparire gira verso di te gli occhi cuciti, e dai tagli del collo esce una voce rotta.

    [hoarse] “La Regina delle Ali Spezzate… ha scelto la ragazza d'argento… La Regina tornerà.”

    [wood splintering] Le travi annerite si piegano verso il centro della stanza e il pavimento si spacca con un colpo secco. [urgent] Ti butti giù per le scale e dalla cengia in acqua, mentre alle tue spalle la capanna crolla su se stessa. [exhales] Rientri in Città Bassa al tramonto, bagnato fino al collo, con quelle parole che ti girano in testa.
  l-altare-del-cucitore__1-sconfitta: |
    [pained] Il coltello di luce ti entra nella spalla senza tagliare la stoffa, e il freddo ti arriva fino ai denti. Cadi in ginocchio davanti all'altare. [fearful] Osric Wren si china su di te, così vicino che vedi i punti del filo sulle palpebre, e dai tagli del collo esce una voce rotta.

    [hoarse] “La Regina delle Ali Spezzate… ha scelto la ragazza d'argento… La Regina tornerà.”

    [wood splintering] Poi si disfa nell'aria, e la capanna comincia a crollare. [breathing heavily] Di come arrivi alle scale ricordi poco. Ricordi l'acqua nera del Torvessa e le mani che cercano i giunchi. [exhausted] Torni in Città Bassa di notte zoppicando. [somber] Dietro di te, sulla Roccia, non resta più niente in piedi.
  l-altare-del-cucitore__2-successo: |
    [determined] Dici le parole dell'Esorcismo a voce alta, e la voce ti esce più ferma di quanto ti senti. A ogni frase la luce che attraversa Osric Wren si fa più debole, e il coltello gli trema in mano. [eerie] Resta dietro l'altare e si sfilaccia dai bordi, e prima di sparire gira verso di te gli occhi cuciti. Dai tagli del collo esce una voce rotta.

    [hoarse] “La Regina delle Ali Spezzate… ha scelto la ragazza d'argento… La Regina tornerà.”

    [wood splintering] Quando l'ultima parola si spegne, le travi annerite si piegano verso il centro della stanza. [urgent] Corri giù per le scale e salti dalla cengia nell'acqua bassa, e alle tue spalle la capanna crolla su se stessa. [relieved] Torni in Città Bassa al tramonto, con la gola secca e quelle parole in testa.
  l-altare-del-cucitore__2-fallimento: |
    [nervous] A metà della formula sbagli una parola, e lo senti subito, come un gradino che manca sotto il piede. [fearful] Osric Wren passa attraverso l'altare e ti viene addosso, e il coltello di luce ti attraversa il petto senza toccare la pelle. Ti lascia dentro un freddo che dura. [gasps] Mentre cadi in ginocchio lo senti parlare dai tagli del collo.

    [hoarse] “La Regina delle Ali Spezzate… ha scelto la ragazza d'argento… La Regina tornerà.”

    Poi svanisce, e la capanna comincia a crollare. [breathing heavily] Scendi le scale a quattro zampe e ti butti in acqua. [bitter] Torni in Città Bassa a notte fonda, e per tutta la strada ripeti fra te la formula, quella giusta.
  l-altare-del-cucitore__3-successo: |
    [calm] Ti siedi sul pavimento con la schiena contro il muro e le mani sulle ginocchia, e lo lasci parlare. [eerie] Osric Wren parla per tutta la notte, con la voce che esce dai tagli del collo. Parla di venature e di come si sceglie il legno per un'ala, e tu lo ascolti senza rispondere. [tense] Alla prima luce si ferma e gira verso di te gli occhi cuciti.

    [hoarse] “La Regina delle Ali Spezzate… ha scelto la ragazza d'argento… La Regina tornerà.”

    [awed] La luce del giorno entra dalle fessure delle imposte e lui ci si scioglie dentro. [wood creaking] Quando le travi cominciano a piegarsi verso il centro della stanza tu sei già sulle scale. [exhales] Dalla riva guardi la capanna crollare su se stessa, e rientri in Città Bassa a metà mattina con le gambe intorpidite.
  l-altare-del-cucitore__3-fallimento: |
    [tired] Resisti per qualche ora. [uneasy] Poi la voce di Osric Wren comincia a sembrarti la tua, e ti sorprendi ad annuire mentre ti spiega come si piega una piuma di rame. [tense] All'alba gira verso di te gli occhi cuciti.

    [hoarse] “La Regina delle Ali Spezzate… ha scelto la ragazza d'argento… La Regina tornerà.”

    [hesitant] Di come svanisce e di come crolla la capanna ricordi soltanto dei pezzi, in disordine. [trembling] Ti ritrovi sulla riva dei giunchi sporco di cenere, con le mani che tremano e il ritmo di quella voce ancora nelle orecchie. [exhausted] In Città Bassa arrivi a mezzogiorno senza sapere che strada hai fatto.
  l-altare-del-cucitore__4-successo: |
    [curious] Gli chiedi del legno e delle piume, e lui risponde con la voce che esce dai tagli del collo, contento di avere un pubblico. Parlate delle venature del noce e della colla di pesce fino a tardi, [uneasy] e a ogni risposta ti accorgi di parlare un po' più come lui. [tense] All'alba Osric Wren tace e gira verso di te gli occhi cuciti.

    [hoarse] “La Regina delle Ali Spezzate… ha scelto la ragazza d'argento… La Regina tornerà.”

    [wood creaking] La luce del giorno lo scioglie, e la capanna comincia a cedere. [calm] Scendi senza correre e dalla riva la guardi crollare su se stessa. [wry] Rientri in Città Bassa con quella conversazione addosso, e per giorni ti capita di rispondere a domande che non ti ha fatto nessuno.
  l-altare-del-cucitore__4-fallimento: |
    [uneasy] Dopo un po' è lui a fare le domande. [eerie] Ti chiede la larghezza delle tue spalle e quanto pesi, e tu rispondi prima di poterti fermare. [tense] All'alba tace e gira verso di te gli occhi cuciti.

    [hoarse] “La Regina delle Ali Spezzate… ha scelto la ragazza d'argento… La Regina tornerà.”

    [wood splintering] Quando la luce lo scioglie e la capanna comincia a cedere sei ancora seduto sul pavimento. Esci da una parete che si è aperta nel crollo e cadi fra i giunchi. [muttering] Torni in Città Bassa a sera, e per tutto il tragitto ti ripeti le tue misure a mezza voce.
  l-altare-del-cucitore__5-esito: |
    [fire crackling] Batti l'acciarino sui trucioli che coprono il pavimento, e il fuoco prende subito e corre basso verso l'altare. [eerie] Osric Wren resta fermo. [urgent] Mentre ti butti giù per le scale, con il fumo che ti brucia la gola e le mani scottate dalla ringhiera, la sua voce ti viene dietro dai tagli del collo.

    [hoarse] “La Regina delle Ali Spezzate… ha scelto la ragazza d'argento… La Regina tornerà.”

    [somber] Dalla riva guardi la capanna bruciare e poi crollare su se stessa, con le travi che cadono verso il centro. [eerie] Il fumo sale dritto, e dai giunchi non si alza nessun uccello. [tired] Rientri in Città Bassa a sera con le mani fasciate in una striscia di camicia, e l'odore del fumo ti resta nei capelli per giorni.
