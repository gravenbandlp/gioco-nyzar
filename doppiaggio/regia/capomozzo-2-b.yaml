# Regia del doppiaggio: Capomozzo (seconda parte)
regia:
  i-raschiatori: |
    [warm] Il Grifone di Ferro è pieno a metà. [fire crackling] Il camino tira male come sempre e sputa faville sul pavimento, e alle pareti pendono corde e carrucole recuperate dai cantieri sotterranei, che Liaren chiama la sua collezione d'arte. Brunella ti mette davanti una scodella di zuppa prima che tu la chieda. Al tavolo vicino alla finestra siedono Tenebra e Ferro.

    Tenebra sta seduto di taglio, e la bruciatura sulla guancia è una filigrana di vetro sotto la pelle. Davanti ha un boccale che non tocca. Ferro, cioè Dragna Gro-Malog, stringe il suo come se fosse un elmo, con le nocche bianche e le due dita che le mancano alla mano sinistra, e i lati rasati della testa le luccicano di sudore. Quando ti siedi, gli occhi gialli ti squadrano dagli stivali in su.

    Chiedi a Ferro di portarti giù, fino al Labirinto di Darn-Morakh.

    [deadpan] “No” dice lei. Poi, visto che non ti alzi, si appoggia allo schienale. [gruff] “Hai chiesto e ti ho risposto. La Salvaguardia si chiude sugli intrusi ogni volta più in fretta, e il primo strato l'abbiamo raschiato fino all'osso. Ci sono rimasti corridoi vuoti e nidi di macchine sveglie. In fondo non si va. Punto.”

    Tenebra non ha ancora aperto bocca. Ti guarda prima le mani e poi gli occhi, con il modo dei maestri d'armi, che pesano l'acciaio prima dell'uomo. [quietly] “Hai qualcosa che noi non sappiamo?” chiede.
  i-raschiatori__1-esito: |
    Posi il congegno sul tavolo, fra il boccale di Tenebra e la tua zuppa, e racconti delle macchine di Capomozzo che si fermavano a metà passo. Ferro si piega in avanti a cercarti una bugia negli occhi, e quando non la trova sbuffa lo stesso. [gruff] “Diglielo tu” dice a Tenebra, senza staccarti gli occhi di dosso. “Digli che non abbiamo uomini. Sono morti o feriti, e quelli rimasti sono già giù nelle rovine qui intorno. Quel poco che resta lo tengo per la città.”

    Le rispondi che ti basta qualcuno che sappia dov'è l'argano e come si libera il freno, e che al resto pensi tu. Ferro ti fissa a lungo. [wry] “Odio quelli che parlano come me” dice alla fine, e allenta la presa sul boccale.

    Tenebra alza il boccale e ci bagna appena le labbra, poi lo posa.
  i-raschiatori__2-esito: |
    Le ripeti la frase che fa imparare alle reclute, quella incisa sugli obelischi della Strada Antica, che discendere è fatale e che non discendere è morire incompleti. Ferro grugnisce e si passa la mano sui lati rasati della testa. [gruff] “I miei non li mando a morire” dice, e guarda Tenebra. “Diglielo tu che non abbiamo uomini.”

    Tenebra la guarda a sua volta senza dire niente, [mug slams on table] finché Ferro non batte il boccale sul tavolo. [wry] “Odio quelli che parlano come me” dice, e scuote la testa. Tenebra alza il suo boccale e ci bagna appena le labbra, poi lo posa.
  i-raschiatori__3-successo: |
    [determined] Le dici che sotto Capomozzo sei sceso da solo e che hai lasciato un Costruttore sotto le macerie. Nel Labirinto ci scenderai comunque, magari da un pozzo cieco dei contrabbandieri se l'argano lei non te lo dà. Ferro ti ascolta senza mollare il boccale. [gruff] “Diglielo tu” dice a Tenebra, senza voltarsi. “Digli che non abbiamo uomini.” Tenebra resta zitto e continua a guardarti le mani.

    Alla fine a Ferro scappa una specie di risata dal naso. [wry] “Odio quelli che parlano come me” dice, e scuote la testa. Tenebra alza il boccale e ci bagna appena le labbra.
  i-raschiatori__3-fallimento: |
    Ferro ti lascia parlare fino in fondo, [mug slams on table] poi batte il boccale sul tavolo una volta sola, e mezza sala si gira. [coldly] “Ho detto no” dice. “Torna quando hai qualcosa da mostrarmi oltre alla faccia tosta.” Tenebra ha smesso di guardarti, e capisci che per stasera è finita. [bitter] Ti alzi con le orecchie che scottano e la zuppa ancora a metà.
  i-raschiatori__4-esito: |
    Posi la licenza della Gilda sul tavolo, accanto al boccale di Tenebra, e le parli della cartografia del sottosuolo, di quando la Gilda pagava i Raschiatori a metro di mappa. Le dici che ti bastano l'argano e qualcuno che sappia liberare il freno, e che i turni persi li segni tu sul registro della Casa dei Nodi, a metro, come allora.

    Ferro conta qualcosa sulle tre dita della mano sinistra, a labbra strette. [gruff] “Diglielo tu che i miei non li vendo a metro” dice a Tenebra. Tenebra resta zitto e ti guarda le mani. Alla fine le scappa una specie di risata dal naso. [wry] “Odio quelli che contano come me” dice, e allenta la presa sul boccale.
  l-orlo-della-cicatrice: |
    [somber] Fuori la sera ha l'odore della pioggia sul ferro. [wind whistling] Tenebra e Ferro ti guidano per i vicoli dei Ponti, oltre i magazzini della Gilda dei Mercanti con le saracinesche già abbassate, e giù fino ai piloni, dove il vento sale dalla Cicatrice e fischia fra le funi. Un custode del Velo vi guarda passare dalla sua garitta e, quando riconosce Tenebra, torna a scaldarsi le mani sul braciere. Il ponte sospeso che porta all'argano pende sopra un vuoto color piombo, e il legno scricchiola a ogni passo.

    La piattaforma è una ruota di acciaio annerito larga quanto una stanza, percorsa da incisioni dei Precursori che sembrano vene spente. Ferro le gira intorno e controlla le catene una per una, contando a mezza voce, e quando arriva alla leva del freno si sputa sulle mani. [gruff] “La sera prima si prova sempre” dice. “Chi non prova l'argano lo prova il giorno dopo, quando ormai è tardi.”

    [tense] Libera il freno. [metal groaning] L'argano geme e la piattaforma scende di un palmo sotto i tuoi stivali, e laggiù, lungo la parete della voragine, la Strada Antica si accende per un attimo in una linea di luce fredda che corre verso il basso e si spegne. Ti si chiude lo stomaco. [awed] All'orizzonte di pietra, nel mezzo della Cicatrice, si vedono le sagome sospese del Labirinto di Darn-Morakh.

    Ferro tira la leva, e la piattaforma si ferma con uno scossone.
  l-orlo-della-cicatrice__1-esito: |
    Resti sulla piattaforma finché il vento non ti fa lacrimare. Ferro ripassa le catene con il palmo, poi si pulisce la mano sui calzoni. [gruff] “L'argano è qui” dice. “Vieni al Grifone quando sei pronto e me lo dici, e io libero il freno per davvero.”

    Tenebra ti aspetta in cima al ponte sospeso, con la bruciatura che luccica appena nel buio. [warm] Quando gli passi accanto ti tocca la spalla una volta sola, come si fa con le reclute, e ti augura “Buona caccia” a voce bassa, senza fermarsi.

    [slowly] Dal ponte ti volti indietro. La piattaforma dondola piano sulle catene, vuota, sopra il buio della Cicatrice.

    [long pause] Fine del Capitolo I
  le-gabbie-dei-cuccioli: |
    La stanza è più calda delle altre e puzza di paglia marcia e di piscio. Lungo le pareti ci sono una dozzina di gabbie basse, fatte di assi grezze inchiodate con chiodi di nave, e quasi tutte sono vuote. [tense] In tre c'è qualcosa che si muove. Sono cuccioli d'orco alti mezzo metro, con la pelle verde smorta e gli occhi gialli iniettati di sangue, e il più grande ha un orecchio mangiato a metà, da un fratello, a giudicare dai segni dei denti.

    [snarling] Appena ti vedono si buttano contro le sbarre e ringhiano, con una voce a metà fra quella di un bambino e quella di un cane. Sul pavimento fra le gabbie ci sono ossa spolpate e una ciotola sola, rovesciata. [bitter] Li tengono affamati e insieme perché imparino a strapparsi il cibo di mano, e quelli che crescono diventano guerrieri.

    [softly] Il più piccolo smette di ringhiare per primo. Ti guarda con la testa piegata e allunga una mano fra le sbarre, aperta, con il palmo in su. [whispers] [uneasy] Vuole da mangiare, o vuole vedere se mordi. Le dita ti vanno da sole alla tasca dove tieni la carne secca. Accanto alla porta, appesa a un chiodo con un pezzo di spago, c'è la chiave delle gabbie.
  le-gabbie-dei-cuccioli__1-successo: |
    Spezzi la carne secca in tre parti uguali, perché hai visto la ciotola sola, e apri le gabbie una alla volta cominciando dal più piccolo. [softly] Ognuno prende il suo pezzo e corre in un angolo a mangiarlo con la faccia verso il muro. Poi escono dalla porta in fila, il più grande per ultimo, e li senti correre verso il rumore del mare. [tender] Il più piccolo si ferma sulla soglia e ti guarda ancora un momento con la testa piegata.
  le-gabbie-dei-cuccioli__1-fallimento: |
    Apri la prima gabbia e il più grande ti salta sul braccio prima che tu abbia tirato fuori la carne. [pained] Ha già i denti di un adulto. Te lo stacchi di dosso e lui scappa dalla porta, e gli altri due lo seguono appena apri le loro gabbie, senza toccare la carne che gli hai buttato dentro. [bitter] Ti fasci il braccio con un lembo di camicia, e la ciotola resta rovesciata dov'era.
  le-gabbie-dei-cuccioli__2-esito: |
    In un angolo trovi una lancia rotta, ci leghi la chiave in cima con lo spago e apri le gabbie una per una, tenendoti a un braccio e mezzo dalle sbarre. [tense] I cuccioli escono ringhiando, ti girano intorno due volte annusandoti gli stivali e poi spariscono dalla porta, verso il rumore del mare. [wry] Rimetti la chiave al suo chiodo con lo spago, come l'hai trovata.
  le-gabbie-dei-cuccioli__3-esito: |
    Raddrizzi la ciotola rovesciata e ci metti dentro tutta la carne secca che hai in tasca. [door closing] Poi esci e richiudi la porta. [muffled snarling] Da dietro il legno senti i ringhi che ricominciano, tre voci che si azzuffano intorno a una ciotola sola. [somber] Resti fermo nel corridoio ad ascoltarli finché smettono. Quando riparti ti accorgi di avere ancora in mano lo spago della chiave, e lo lasci cadere per terra.
  le-gabbie-dei-cuccioli__4-esito: |
    [bitter] La ciotola sola la conosci. Nei recinti di Ghoran ai ragazzi ne davano una ogni cinque, perché imparassero chi era il più forte prima ancora di essere venduti, e tu avevi imparato a mangiare di spalle e in fretta. Dividi la carne secca in tre mucchi uguali sulle assi e ne spingi uno dentro ogni gabbia con la punta dello stivale, lontano dalle sbarre degli altri.

    [softly] I cuccioli mangiano ognuno nel suo angolo, con la faccia verso il muro. Quando apri le gabbie escono in fila, il più grande per ultimo, e corrono verso il rumore del mare. [tender] Il più piccolo si ferma sulla soglia e ti guarda ancora con la testa piegata.
  la-tana-del-pungitore: |
    [eerie] Oltre il terreno di caccia, dove la caverna fa una curva verso il mare, c'è la tana. Il pavimento è coperto da centinaia di carcasse di gabbiani e di falchi pescatori, e fra gli uccelli ci sono una decina di orchi. [pause] Sono tutti vuoti. La pelle si è seccata intorno alle ossa, e dentro non è rimasto niente, come in un uovo bevuto da un buco.

    Uno degli orchi è più grosso degli altri. Ha ancora addosso un'armatura di pelle di cinghiale cucita a strati, con le borchie fatte di chiodi di nave, e la mano stretta sull'elsa di una spada larga e ricurva. Sulla lama qualcuno ha inciso Druzk a punta di coltello, in lettere comuni tutte storte. Al collo porta un anello di ferro con una dozzina di chiavi da carceriere.

    [uneasy] Lo stomaco ti si chiude, e cominci a respirare dalla bocca. [vines rustling] Dall'apertura sul mare arriva il fruscio delle liane, e a ogni fruscio ti giri a guardare l'apertura.
  la-tana-del-pungitore__1-successo: |
    Punti un piede sul petto del morto e tiri, [leather tearing] e l'armatura viene via con un rumore di carta strappata. La spada invece non la vuole lasciare. [slowly] Gli apri le dita una per una, e sono leggere come rametti secchi. [quickly] Prendi anche le chiavi, ed esci dalla tana con l'armatura sotto il braccio prima che le liane si muovano di nuovo.
  la-tana-del-pungitore__1-fallimento: |
    Tiri troppo forte, l'armatura si strappa via di colpo e tu cadi all'indietro fra i gabbiani secchi con un rumore di paglia. [fearful] Dall'apertura sul mare entra il Pungitore. Afferri la spada e le chiavi e corri, [gasps] e il pungiglione ti prende alla coscia proprio sulla soglia. [breathing heavily] L'armatura te la trascini dietro per una cinghia fino al corridoio, zoppicando.
  la-tana-del-pungitore__2-successo: |
    [calm] Hai visto abbastanza morti per sapere dove la pelle si stacca da sola. Tagli le cinghie sotto le ascelle e lungo i fianchi, e l'armatura si apre come un guscio. La spada gliela sfili dalla mano girandogli il polso piano, [wry] anche se a lui ormai non importa, e le chiavi gliele togli per ultime, dalla testa, come una collana.
  la-tana-del-pungitore__2-fallimento: |
    Tagli una cinghia di troppo, e il torace del morto si apre insieme all'armatura. [eerie] Dentro è vuoto e pulito, liscio come l'interno di una conchiglia. [quickly] Prendi tutto quello che c'è da prendere senza guardare più giù, e ti accorgi che stai trattenendo il fiato soltanto quando sei di nuovo nel corridoio. [breathing heavily] Respiri a bocca aperta contro il muro, con l'armatura fra i piedi, finché le mani smettono di tremare.
  la-tana-del-pungitore__3-esito: |
    Ti inginocchi fra i gabbiani e lavori a mani nude, slacciando quello che si slaccia e strappando il resto, e ogni pochi respiri il fruscio delle liane ti fa voltare. [tired] Ci metti un'ora. Esci con l'armatura fra le braccia, la spada infilata nella cintura e le chiavi al collo, [wry] e con un odore addosso che ti resta per due giorni.
  zagrath-nell-harem: |
    La stanza puzza di aceto e di fiori marci, così forte che ti lacrimano gli occhi, e ci metti un momento a capire che quell'odore è un profumo. Lo portano quattro orchesse grosse e sgraziate, con collane di denti e le guance dipinte di rosso, sedute in cerchio fra decine di cuscini bitorzoluti e di pellicce di cavallo. [wry] Erano le mogli di Dorbak, il capoguerra che cavalcava il cinghiale corazzato alla razzia del Festival, e da quando è morto a Qir-Azel nessuno viene più a trovarle.

    Al centro del cerchio siede un uomo enorme che è mezzo orco e mezzo ogre, con la pelle grigia e spessa e il naso rotto tante volte che non ha più una direzione. Porta soltanto un paio di brache di cuoio sfilacciate e un amuleto d'ossa. [amused] Una delle orchesse gli pettina i capelli con un pettine d'osso, un'altra lo imbocca con dei datteri. Contro i cuscini c'è un arco lungo più alto di te, con una faretra di frecce nere.

    [whispers] [uneasy] Zagrath, con l'arco lungo quanto Ilvaena. Lui ti fissa con gli occhi piccoli, più offeso che sorpreso, e si toglie un dattero di bocca.

    [menacing] “Hai scelto il momento sbagliato per morire” dice con la voce impastata, e allunga la mano verso l'arco. [tense] Le quattro orchesse si girano verso di te tutte insieme, e quella col pettine lo stringe come un coltello.
  zagrath-nell-harem__1-vittoria: |
    [arrows whizzing] Tira due frecce prima che tu arrivi ai cuscini, e la seconda ti passa così vicino che senti le piume. [tense] Da vicino l'arco non gli serve più, e la vedova con la mazza finisce lunga sulle pellicce. Quando Zagrath cade in ginocchio sanguina dal naso per l'ennesima volta, e ride.

    [hoarse] “Dillo all'elfa” dice, e sputa un dente. “Dille che questa per noi due conta zero. Lei qui non c'era.” Le orchesse gli si buttano addosso a strillare, e lui ne approfitta per strisciare fuori dalla porta sul retro con l'arco in mano. [exhales] Lo lasci andare. Sul pavimento, delle sue frecce nere ne restano tre.
  zagrath-nell-harem__1-sconfitta: |
    [pained] La prima freccia ti prende alla spalla prima che tu abbia fatto tre passi, e la seconda ti inchioda il mantello allo stipite. Lo strappi e scappi nel corridoio, con le orchesse che ti tirano dietro i cuscini e Zagrath che ride sdraiato, senza nemmeno alzarsi. [bitter] Quando ti volti, la porta è chiusa con il chiavistello.
  zagrath-nell-harem__2-successo: |
    Alzi le mani vuote e cominci a raccontare il giorno del Festival e il cinghiale corazzato di Dorbak, e di come è caduto alla porta nord senza fare un passo indietro. [wry] Ci metti un po' di quello che si racconta in città e parecchio di quello che vogliono sentire. [women wailing] La più vecchia comincia a piangere a voce altissima, le altre le vanno dietro, e in mezzo al lamento si ricordano che sui cuscini del marito c'è un estraneo. [amused] Zagrath a una cosa del genere non era preparato. Raccoglie l'arco e se ne va borbottando, e nessuno bada a te quando passi oltre.
  zagrath-nell-harem__2-fallimento: |
    Cominci a parlare di Dorbak, e la più giovane delle vedove ti tira il pettine in faccia prima che tu arrivi al cinghiale. Come è morto non lo vogliono sentire da uno che stava dall'altra parte. [pained] Zagrath tende l'arco ridendo, e la freccia ti apre il fianco mentre ti butti fuori dalla porta. [breathing heavily] Nel corridoio ti premi la mano sulla ferita, e il sangue ti passa fra le dita mentre da dentro senti le vedove che ricominciano a pettinarlo.
  zagrath-nell-harem__3-successo: |
    [quietly] Gli dici che a Ghoran sei salito sulla bilancia anche tu, e che dalla bilancia sei sceso da solo, senza chiedere il permesso a nessuno. Lo dici piano guardandogli le mani invece della faccia, come guardavi i sorveglianti dei recinti. [pause] Zagrath smette di masticare. Poi si sdraia di nuovo sui cuscini con la faccia verso il muro, e una delle orchesse ti indica la porta con il pettine.
  zagrath-nell-harem__3-fallimento: |
    Zagrath ti ascolta e si mette a ridere piano, poi sempre più forte. [mocking] “Uno scappato da Ghoran” dice, “vale il doppio a riportarcelo.” Le orchesse ti vengono addosso tutte insieme, e la vedova con la mazza ti prende alle costole mentre le altre ti tirano per i vestiti. [breathing heavily] Ti liberi soltanto lasciando nelle loro mani mezza camicia e un po' di pelle del collo, e arrivi alla porta piegato in due. [bitter] Da dietro la porta Zagrath ti grida quanto varresti a Ghoran, e le orchesse ridono a ogni cifra.
  zagrath-nell-harem__4-esito: |
    [wry] Chiedi scusa a voce alta, come in una locanda, e richiudi la porta. [muffled laughter] Da dentro arriva una risata grassa di Zagrath, poi quelle delle orchesse, e nessuno si alza. Prima di andartene incidi una croce sul legno con la punta del coltello, per ricordarti di non riaprirla, e l'odore di aceto ti resta nei vestiti per tutto il corridoio.
  la-guerra-privata: |
    [warm] Ilvaena Sorathe ha preso il tavolo d'angolo, come la sera della cena, con l'arco senza corda appoggiato al muro e la faretra sulla sedia accanto. Ha di nuovo il fango sugli stivali fino al ginocchio, e mangia lo stufato di Brunella con l'attenzione che si dà ai lavori difficili. Quando ti vede sposta la faretra con un piede, e la sedia è tua. Sul tavolo, accanto alla scodella, c'è una corda d'arco nuova arrotolata, che lei tocca ogni tanto con il pollice.

    [deadpan] “Mi dicono che sei stato a Capomozzo” dice senza alzare gli occhi dalla scodella. “Mi dicono anche che sei tornato. Questa è la parte interessante.”

    Brunella ti mette davanti un boccale senza chiederti cosa vuoi e resta lì con lo strofinaccio in mano, perché le storie le piacciono quanto a Liaren. Ilvaena posa il cucchiaio. [whispers] [wry] Il mezzo ogre glielo devo raccontare bene, o non me lo perdona. Ti guarda e aspetta, con il mento appoggiato sul pugno.
  la-guerra-privata__1-esito: |
    Le racconti dell'harem e dei datteri, [amused] e Ilvaena ride così forte che al bancone due Raschiatori si girano. [somber] Poi le racconti lo scontro, e smette di ridere. Quando arrivi alle parole di Zagrath in ginocchio si tocca la cicatrice sotto la clavicola, senza accorgersene.

    [quietly] “Ha ragione lui” dice alla fine, girando il cucchiaio nella scodella. “Conta zero.” Beve un sorso lungo e posa il boccale con cura, al centro esatto del cerchio umido che aveva lasciato sul legno. [wry] “Però adesso so che sanguina dal naso come tutti gli altri” dice, e alza il boccale verso di te. “Grazie. Glielo ricorderò, la prossima volta.”
  isvaro-negli-alloggi: |
    In fondo a un corridoio laterale c'è un ripostiglio con la porta accostata, e dentro c'è odore di vino. Su una cassa ci sono quattro bottiglie vuote in fila per altezza, con l'etichetta in fuori. Isvaro Tarvelin dorme su un pagliericcio steso fra i sacchi di farina, con gli stivali ancora ai piedi.

    È più magro di quando è scappato dalla fornace dell'Acciaieria, e la barba gli è cresciuta a chiazze. [tense] Dorme con un coltello in mano, e quando la tua ombra gli passa sulla faccia apre gli occhi di colpo e lo alza. Ti riconosce. Il coltello resta a mezz'aria un momento, e poi torna giù piano sul pagliericcio.

    “Tu” dice, con la voce impastata e un sorriso che gli viene storto. [pleading] “Ti prego, non dirlo a Kessa. Se sa che sono tornato mi riporta giù da lei.” [bottles clinking] Si mette a sedere, e le bottiglie tintinnano. “Io giù non ci voglio tornare.”
  isvaro-negli-alloggi__1-esito: |
    [nervously] “Sta sul ponte, al livello di sotto, dove le macchine dei Precursori guardano nel buio” dice Isvaro, e si stringe le ginocchia al petto. “Sale soltanto per parlare con la statua della cappella, e poi torna giù senza guardare nessuno.” Si guarda la mano sinistra e la apre e la chiude. [trembling] “L'ultima volta che mi ha toccato aveva già quella mano nuova. Era fredda come una pietra di fiume.”

    Quando esci si è già girato verso il muro. [whispers] [sad] Gli ho lasciato il coltello, e lui non se n'è nemmeno accorto. [softly] Richiudi la porta piano, come si fa nelle stanze dei malati.
  isvaro-negli-alloggi__2-esito: |
    Gli lasci il coltello e le bottiglie e richiudi la porta come l'hai trovata, accostata. [sad] Da dentro lo senti ridere piano e poi tirare su col naso, e poi più niente. Nel corridoio la lanterna in fondo fa fumo, e lo stoppino andrebbe tagliato. Resti un momento con la mano sulla maniglia, poi te ne vai prima che lui dica qualcos'altro.
  gli-alloggi-di-aurenne: |
    È l'unica porta di tutto il livello con i cardini oliati, e si apre senza un rumore. [uneasy] Dentro c'è una stanza grande e pulita, e dopo le tane degli orchi il pulito ti mette a disagio. A nord c'è un letto di buona fattura con le lenzuola di seta color crema, rimboccate strette. A sud una scrivania e una sedia stanno sotto una lanterna appesa che non fa fumo, perché qualcuno ne ha pareggiato lo stoppino con le forbici.

    Sulla parete accanto al letto c'è uno specchio alto, girato contro il muro. [eerie] Sul pavimento, sotto lo specchio, ci sono dei capelli lunghi e sottili, e alla luce della lanterna hanno il colore dell'argento. Ti si gela la nuca, e ti torna in mente Mawrak'Thur, la parola che la Città Bassa ripete sottovoce dalla sera del Festival.

    Sulla scrivania non c'è niente fuori posto. [softly] In un angolo, girato verso il letto, c'è un uccellino di legno intagliato a mano, grande quanto un pollice, a cui manca un'ala. La punta del becco è consumata a forza di toccarla. Tutto il resto deve stare nei cassetti.
  gli-alloggi-di-aurenne__1-successo: |
    Nel cassetto di mezzo, sotto una pila di fazzoletti piegati in quattro, c'è un quaderno dalla copertina di stoffa azzurra, consumata agli angoli. [softly] La prima pagina è scritta in una calligrafia tonda da ragazzina, con un cerchietto al posto del puntino sulle i, e comincia con Caro Albero. [uneasy] Le ultime sono in una grafia dritta e appuntita che sembra di un'altra persona. Te lo infili sotto la giubba e richiudi il cassetto com'era.
  gli-alloggi-di-aurenne__1-fallimento: |
    Il quaderno lo trovi nel cassetto di mezzo, sotto i fazzoletti, [footsteps approaching] ma mentre lo sfogli arrivano dei passi nel corridoio. [tense] Ti butti dietro il letto e resti lì con la guancia sulla seta, mentre qualcuno si ferma sulla soglia a guardare dentro e poi se ne va senza entrare. [exhales] Ti rialzi con il quaderno stretto al petto e le ginocchia che tremano.
  gli-alloggi-di-aurenne__2-successo: |
    Ti siedi sul bordo del letto, e la seta è fredda sotto le mani. [somber] Da qui l'uccellino di legno è l'ultima cosa che si vede prima di spegnere la lanterna, e lo specchio girato è l'unica che non si vede mai. Infili la mano sotto il cuscino senza pensarci. [softly] C'è un quaderno dalla copertina di stoffa azzurra, consumata agli angoli, con la prima pagina scritta in una calligrafia tonda da ragazzina.
  gli-alloggi-di-aurenne__2-fallimento: |
    Ti siedi sul letto e la seta scivola, e per non cadere ti aggrappi al lenzuolo e lo tiri via per metà. Sotto il cuscino, scoperto, c'è un quaderno dalla copertina di stoffa azzurra. [nervous] Lo prendi, poi passi un tempo lunghissimo a rifare il letto con gli angoli tirati come li avevi trovati. [sighs] Non ci riesci, e alla fine lo lasci com'è con lo stomaco stretto.
  gli-alloggi-di-aurenne__3-esito: |
    [thoughtful] La stanza ti ricorda il dormitorio delle novizie, con le lenzuola tirate e niente fuori posto, e lì le cose che contano si tengono sotto il materasso, dalla parte della testa. Sollevi l'angolo del letto. C'è un quaderno dalla copertina di stoffa azzurra, consumata agli angoli. [softly] La prima pagina è scritta in una calligrafia tonda da ragazzina e comincia con Caro Albero, come le preghiere scritte che le novizie lasciano nella cassetta della Cripta. [uneasy] Le ultime pagine hanno una grafia dritta e appuntita, di un'altra persona.

    Rimetti a posto l'angolo del lenzuolo e ti infili il quaderno sotto la giubba.
  garin-e-kessa: |
    [tense] Dalla sala della guerra, con la spalla contro lo stipite, senti le voci chiare attraverso il legno della porta.

    [gruff] “Cercare Isvaro, adesso” dice l'uomo con una voce bassa da caserma, [chair scraping] e una sedia stride sotto di lui. “Senti, Kessa, quel mezzelfo non vale la pelle che ci lasciamo. Io sono qui per la paga, e la paga non basta più.”

    [calm] “Isvaro ha pensato la razzia dalla prima freccia all'ultima” risponde la donna, piano, pesando ogni parola prima di lasciarla andare. “Aurenne ci ha dato un compito, Garin.”

    [sneering] “Aurenne è pazza” dice lui. “Hai visto cos'ha fatto a quelli con le maschere, e cosa fa con quell'aggeggio. Senti, mettiamola così. Il tuo mezzelfo è in una fossa di Qir-Azel, e i vermi gli stanno già facendo festa.”

    [menacing] “Ripetilo e ti brucio la lingua” dice lei, e di là cala un silenzio breve e sgradevole.

    [door creaking] Spingi la porta. La sala è piena di tavolette di pietra coperte di rune aguzze e di pezzi di bassorilievo staccati a scalpello, e sulle mensole ci sono picconi e spazzole da scavo. Garin è un uomo massiccio con l'elmo ammaccato e una tunica verde lisa sopra la maglia, e imbraccia uno scudo di ferro dipinto con una faccia che urla. Davanti a lui Kessa, con la pelle ambrata e un mantello chiaro, stringe un bastone che manda bagliori viola, e ai suoi piedi un gatto bianco ti guarda senza scomporsi.

    [tense] Si girano insieme verso di te. Garin alza lo scudo e guarda prima Kessa e poi te, facendo i conti.
  garin-e-kessa__1-vittoria: |
    [fire whooshing] Kessa apre il fuoco per prima, e la fiammata viola ti brucia le sopracciglia e incendia una mensola di pergamene. [tense] Garin ti viene addosso dietro lo scudo con passo pesante e metodico, e ci vuole tempo prima che lo scudo si abbassi di un palmo. Quando finalmente cade, finisce lungo disteso sopra la faccia dipinta. Kessa brucia fino all'ultimo, finché il bastone le scivola di mano e si spegne.

    [exhales] Il gatto bianco esce dalla porta senza correre. Sul tavolo, fra le tavolette annerite, c'è un foglio di Kessa con il disegno preciso di un disco rotondo coronato di cristalli, e sotto, nella sua calligrafia, risponde soltanto a lei. [ominous] Dietro le mensole una scala scende nel buio, e dal basso sale un'aria fredda che sa di ferro bruciato.
  garin-e-kessa__1-sconfitta: |
    [pained] Il fuoco di Kessa ti prende al petto e ti butta contro le mensole, che ti rovesciano addosso picconi e tavolette. Garin non ti finisce. Abbassa lo scudo, prende Kessa per un braccio e la trascina fuori verso la scala che risale alla fortezza, e lei si lascia trascinare con il gatto in braccio, guardando indietro verso di te finché non sparisce.

    [groans] Ti rialzi dopo un tempo che non sai misurare, con l'odore dei capelli bruciati nel naso e una mano che non si chiude bene. [ominous] Dietro le mensole rovesciate c'è una scala che scende nel buio, e dal basso sale un'aria fredda che sa di ferro bruciato.
  garin-e-kessa__2-successo: |
    [slyly] Parli a Garin e non a lei. Gli dici che di sopra la strada è libera e che a Qir-Azel nessuno corre dietro a un mercenario che si arrende. Garin ti ascolta con lo scudo alzato. Poi lo abbassa e si sposta di fianco a te, davanti a Kessa. [gruff] “Senti, Kessa” dice. “Adesso siamo in due.” Lei guarda a lungo Garin e poi il gatto, e alla fine posa il bastone sul tavolo.

    Li chiudi in due celle della prigione e spranghi le porte da fuori. Mentre lo fai Garin ti parla del disco rotondo e antico con cui Aurenne comanda le macchine del livello di sotto. [deadpan] “Quando la Guardia viene a prenderci” dice dalla cella, “dille di portare il pane.” Torni nella sala della ricerca, dove dietro le mensole una scala scende nel buio.
  garin-e-kessa__2-fallimento: |
    Parli a Garin, ma Kessa capisce prima di lui dove vuoi arrivare. [coldly] “Vuole dividerci, Garin” dice, e il bastone le si accende in mano. Garin esita un momento di troppo e poi alza lo scudo dalla sua parte. Il fuoco ti arriva addosso di lato, e mentre rotoli dietro il tavolo li senti uscire di corsa verso la scala che risale alla fortezza. [pained] Ti rialzi con la manica bruciata e il braccio sotto pieno di vesciche fino al gomito, e il fuoco viola ci mette troppo a spegnersi. [ominous] Dietro le mensole c'è un'altra scala, che scende nel buio.
  garin-e-kessa__3-successo: |
    [calm] Per un po' non dici niente. Prendi uno sgabello, ti siedi davanti alla porta da cui dovrebbero uscire e appoggi le mani sul tavolo, bene in vista. Poi gli racconti con calma la strada che hai fatto, dal ponte di corda sopra le onde fino alla fortezza di Balthog, e quante porte hai aperto per arrivare qui. [relieved] Garin posa lo scudo per primo, piano, con la faccia dipinta verso il pavimento. Kessa resiste un momento in più, finché il gatto le si struscia contro la caviglia e lei abbassa il bastone.

    Li chiudi in due celle della prigione e spranghi le porte. Garin, da dietro le sbarre, ti racconta del disco rotondo e antico con cui Aurenne comanda le macchine del livello di sotto. [ominous] Dietro le mensole della sala della ricerca una scala scende nel buio.
  garin-e-kessa__3-fallimento: |
    Garin ti ascolta e per un momento abbassa lo scudo, [tense] ma Kessa ha già acceso il bastone. [fire whooshing] La fiammata viola esplode sul tavolo davanti a te, e mentre ti ripari dietro il piano rovesciato Garin la afferra per il mantello e la trascina fuori. Li senti correre su per i corridoi, sempre più lontano, mentre ti batti le mani sui vestiti che non smettono di fumare. [bitter] Ti rialzi con le mani piene di vesciche e la faccia che tira, e dietro le mensole trovi una scala che scende.
  garin-e-kessa__4-esito: |
    [deadpan] “Isvaro è nel ripostiglio in fondo al corridoio” dici dalla porta, “su un pagliericcio, con gli stivali addosso.” Kessa ti guarda come si guarda un cane che parla, poi prende in braccio il gatto e ti passa accanto di corsa senza bruciare nessuno. Garin resta solo con lo scudo alzato, e lo abbassa piano.

    [gruff] “Senti, io me ne vado di sopra” dice, e si sistema l'elmo con due dita. “Tu però stai attento al disco rotondo che lei porta al collo. Con quello le macchine di sotto fanno quello che vuole lei.” Ti passa accanto rasente il muro, [ominous] e dietro le mensole resta la scala che scende nel buio.
  garin-e-kessa__5-esito: |
    [calm] Ti sposti di lato e tieni le mani bene in vista. Garin capisce per primo, prende Kessa per il gomito e la tira verso l'uscita, e lei si lascia portare, con il gatto che le trotterella dietro e gli occhi fissi su di te finché non è fuori. Sulla soglia Garin si ferma e si volta a mezzo. [gruff] “Senti” dice, “se scendi, guarda il disco rotondo che lei porta al collo. Con quello comanda le macchine.” Poi spariscono tutti e due verso la scala che risale alla fortezza, [ominous] e dietro le mensole resta l'altra scala, quella che scende nel buio.
