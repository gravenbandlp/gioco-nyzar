# Regia del doppiaggio: La Dama d'Argento
regia:
  i-morti-parlano: |
    [somber] Il corpo di Squiggor Ironfist è arrivato al Cimitero di Qir-Azel su un carro della Caserma, avvolto in un telo da vela, e da due giorni aspetta in una cella di pietra che qualcuno lo reclami. Gli Scuri non si sono fatti vivi. [wry] Il garzone delle fosse, che tiene il cimitero da quando il becchino Gundo Marl è sparito, l'ha registrato con una grafia grossa alla voce “ignoti, morte violenta”, sottolineando due volte la seconda parola, e gli ha messo sulla palpebra che gli restava una moneta di rame, delle più piccole.

    [calm] Al tramonto arriva un monaco della Confraternita del Velo. Porta la tunica nera e una borsa di tela con dentro candele di sego e un libretto legato con lo spago. Ha le mani grandi e callose, e prima di prendere i voti deve aver lavorato la terra. Lo manda Ottilia Sanvel, dice. [mysterious] La Monaca Responsabile ha sentito che cosa si ripete in Città Bassa, e anche lei vuole sapere che cosa sapeva quest'uomo.

    [solemn] “Quattro domande, cinque al massimo” dice il monaco. “Poi la porta si richiude da sola, e chi la tiene aperta paga per tutto il tempo che resta aperta. Io dico le parole e tu reggi la candela.”

    [eerie] Il garzone si allontana senza voltarsi. Nella cella fa freddo, e l'odore del telo da vela bagnato ti si attacca in fondo alla gola. [wry] Il monaco ti guarda e aggiunge che la Confraternita queste cose non le fa per niente, e che il rito ha un prezzo che qualcuno deve coprire.
  i-morti-parlano__1-esito: |
    [coins clinking] Il monaco conta le monete due volte e le fa sparire nella borsa. [solemn] Poi traccia sul pavimento un cerchio di sale attorno al tavolo di pietra e accende tre candele. La più grossa la mette in mano a te.

    Ti fa inginocchiare dentro il cerchio, accanto alla testa del morto, e la pietra ti morde le ginocchia attraverso i calzoni. Lui resta fuori dal sale, seduto con il libretto aperto sulle ginocchia. [low chanting] Comincia a leggere a voce bassa, [eerie] e la fiamma della tua candela si piega verso il cadavere.
  i-morti-parlano__2-esito: |
    [calm] Il monaco ti guarda un momento più a lungo, poi annuisce. Ha sentito il tuo nome in Cattedrale, e da come lo ripete è stato detto con rispetto.

    [solemn] Traccia un cerchio di sale attorno al tavolo di pietra e ci entra lui, con il libretto aperto. A te lascia la candela e un posto fuori, a un passo dal sale. [quietly] “Se la fiamma si piega verso di lui, fai un passo indietro” dice. [low chanting] Poi comincia a leggere, [eerie] e dopo poche righe la fiamma si piega verso il cadavere.
  i-morti-parlano__3-successo: |
    [determined] Gli parli della razzia e di Rennick Dole, e di quello che gli Scuri potrebbero sapere sulla Dama d'Argento. Il monaco ti ascolta con le mani incrociate sulla borsa, [calm] e alla fine dice che Ottilia gli ha chiesto di tornare con delle risposte, e che per averle gli serve qualcuno che regga la candela.

    [solemn] Traccia il cerchio di sale e ti fa inginocchiare dentro, accanto al morto. [low chanting] Poi apre il libretto e comincia a leggere.
  i-morti-parlano__3-fallimento: |
    Il monaco ti ascolta senza cambiare espressione. [sighs] Alla fine sospira, dice che Ottilia verrà a sapere quanto hai insistito, e apre il libretto di malavoglia.

    [tense] Traccia il cerchio di sale in fretta, storto da un lato, e ti mette dentro con la candela senza spiegarti niente. [wry] Tiene la bocca stretta, e ti viene il sospetto che stasera fosse atteso a cena. [quickly] Legge più veloce di quanto dovrebbe, [eerie] e la fiamma della tua candela si piega verso il cadavere prima ancora che abbia finito la prima riga.
  i-morti-parlano__4-esito: |
    [calm] Il monaco ti guarda le mani mentre accendi le candele, e capisce prima che tu parli. Traccia il cerchio di sale attorno al tavolo di pietra ed entrate tutti e due, lui con il libretto e tu con la candela grossa. [low chanting] Leggete insieme, la sua voce bassa e la tua mezza riga dietro, come in Cattedrale si fa leggere ai novizi.

    [eerie] Dopo poche righe la fiamma si piega verso il cadavere, e la porta comincia a pesare sulle spalle di tutti e due. [under breath] Fra un versetto e l'altro il monaco ti dice a mezza bocca che Ottilia saprà chi gli ha tenuto la candela stasera.
  i-morti-parlano-rito: |
    [eerie] Il cadavere non risponde subito. Prima la mascella si muove a vuoto e fuori tempo, poi un filo di liquido grigio cola dall'angolo della bocca. [ominous] Poi arriva la voce, da sotto lo sterno, come se qualcuno parlasse dentro un otre di pelle, [swallows] e ti accorgi di aver smesso di respirare con il naso.

    [mocking] “Non nell'aldilà” dice, e ride in un modo raschiato e allegro. “In una cella, con le facce sbagliate. Tu con la candela, senti questa, ci conosciamo? Mi ricordi qualcuno.” [uneasy] L'orbita vuota è rivolta verso di te, e senti che ti guarda proprio da lì. [whispers] [sarcastic] Da vivo diceva una parola ogni tanto, e adesso non smette più. Il monaco gira pagina con due dita.

    Chiede dei mulini bruciati negli ultimi anni. [hoarse] “Bruciati perché Malgrani avesse il pane tutto per sé” risponde Squiggor, e la mascella schiocca sulla parola pane. [mocking] “Domani, pretino, mangerai anche tu la sua farina e non farai niente. È questo il bello.”

    Chiede dei ponti e della Gilda. [hoarse] “Ponti marci. Custodi che guardano dall'altra parte per pochi spiccioli, e nella Gilda gente comprata come pane vecchio. Dove? Che ne so. I loro fogli non li ho mai visti.” [tense] Il monaco insiste e la candela ti scotta le dita. “Il tizio dei ponti, quello di notte. Lui sa dove passano le cose.”

    Chiedi della Dama d'Argento, e il morto sbuffa grigio. [deadpan] “La cerchiamo anche noi, e non la trova nessuno.” Poi la testa si inclina di lato, come se avesse sentito un nome che gli piace. [slyly] “Senti questa. E della piccola non chiedete? Della piccola Acari?”

    [strained] La porta pesa sempre di più, e te lo senti nelle spalle. Ti restano una o due domande.
  i-morti-parlano-rito__1-esito: |
    [menacing] Squiggor parla della piccola con la gola che gli bolle di piacere. “Occhi svegli, lingua troppo lunga. Canta per lo sceriffo, e Mirko lo sa e le dà da portare bugie. Prima della prossima luna è morta, e io me la perdo, che peccato.” [deadpan] Poi, quasi annoiato, aggiunge che secondo Mirko lo sceriffo corre per i villaggi con la scusa degli orchi per venire a prendere gli Scuri, e che nemmeno lui sa se sia vero.

    Quando chiedi di Rennick il morto ride di nuovo. [mocking] “Senti questa. Il ragazzo ha cantato alla sua rossa della Maison, Jass, che è dei nostri. Lei l'ha detto a Mauro, e Mauro a Mirko.”

    [eerie] Poi la mascella ricade e il liquido smette di colare. Mentre la porta si chiude senti anche tu il gusto che il morto provava nel dolore degli altri, dolciastro in fondo alla lingua, e ti costa fatica non lasciarlo entrare. [exhales] Il monaco spegne le candele una per una, la tua per ultima.
  resoconto-alla-pignatta: |
    [calm] All'ora del mercato la Pignatta Grassa è quasi vuota. Due carovanieri fanno colazione con il sidro, e al tavolo delle carte Nihali Cuzan mescola un mazzo per nessuno. [wry] Mauro Scrocco allarga le braccia quando ti vede entrare e grida il tuo nome come se fossi un parente tornato dalla guerra. Poi indica con il mento la porta del retrobottega, senza abbracciarti.

    Il retrobottega è più ordinato della sala. Ci sono scaffali di legno chiaro pieni di cartelle, ognuna con un'etichetta scritta a mano che dice la famiglia e il mestiere di chi ha firmato. [ominous] Su una il mestiere è cancellato con una riga, e sopra c'è scritto defunto. Su un leggio è aperto un registro di firme. Rozalia Marga siede al banco con la piuma d'oca dietro l'orecchio e le dita macchiate d'inchiostro.

    [slyly] “Puntuale” dice senza alzare gli occhi dal foglio, e batte due volte la penna sul calamaio. “La gente puntuale mi piace, perché si fa meno fatica a trovarla. Siediti, che il tempo lo segno anche a te.”

    [uneasy] Intinge la penna e aspetta. La sedia davanti al banco è già girata verso di lei, e sedendoti scopri che è più bassa di una spanna, così per guardarla alzi il mento.
  resoconto-alla-pignatta__1-esito: |
    Le racconti della parola orchesca e di Rennick Dole, di come parlava la lingua dei Nove Chiodi e di che cosa gli hai sentito dire nella sua stanza al primo piano della Maison. [quill scratching] Rozalia scrive in fretta, con una grafia piccola e diritta, e ti interrompe solo per farti ripetere i nomi.

    [resigned] Quando hai finito soffia sul foglio per asciugare l'inchiostro e dice che Mirko sarà contento. [slyly] “Adesso però ti pago io” aggiunge mentre batte due volte la penna sul calamaio, “perché i conti li chiudo sempre in pari, al quattrino, per la precisione.”
  resoconto-alla-pignatta__2-successo: |
    [tense] Le racconti della parola orchesca e della paura di Rennick, e lasci fuori i dettagli che ti sembrano valere di più. Rozalia scrive e ti fa ripetere due nomi, e tu tieni le mani ferme sulle ginocchia, perché ti sembra che guardi più quelle della tua faccia.

    Quando hai finito soffia sul foglio per asciugare l'inchiostro e dice che Mirko sarà contento. [slyly] “Adesso però ti pago io” aggiunge mentre rimette la penna nel calamaio, “perché i conti li chiudo sempre in pari.” [satisfied] I dettagli che hai tenuto per te restano fuori dal suo registro.
  resoconto-alla-pignatta__2-fallimento: |
    A metà del racconto Rozalia smette di scrivere e posa la penna. [coldly] “Hai saltato un pezzo” dice senza alzare la voce. [slyly] “Si sente, tesoro. Prima di arrivarci hai ripreso fiato, e chi riprende fiato sta per scavalcare qualcosa.”

    [uneasy] Aspetta che tu racconti anche il resto, e lo scrive, mentre tu senti le orecchie diventare calde. [bitter] Poi ti guarda più a lungo e ti dice che ti pagherà lo stesso, perché i conti li chiude in pari, ma che nel registro, accanto al tuo nome, adesso c'è un segno.
  i-conti-di-rozalia: |
    Rozalia gira il registro verso di sé e intinge di nuovo la penna, come se dovesse dettare a sé stessa. [wry] Prima batte due volte la punta sull'orlo del calamaio, e ormai hai capito che lo fa ogni volta che apre un conto.

    [deadpan] “I mulini che sono bruciati in questi anni” dice mentre scrive, “sono bruciati perché i Malgrani avessero in mano tutta la farina della città. Chi abbia portato la torcia lo lascio decidere a te, io scrivo solo quello che mi hanno pagato per sapere. [slyly] Poi ci sono i ponti. I custodi si comprano con una mancia, e nella Gilda c'è gente che costa poco di più, lo so perché le carte gliele faccio io, per la precisione. Il tizio dei ponti, quello del turno di notte, sa dove passano le merci che la Gilda non registra.”

    Quando le chiedi della Dama d'Argento scuote la testa e ti dice che gli Scuri la cercano a tentoni come tutti gli altri, e che per questo Rennick gli interessava tanto.

    [quietly] Poi abbassa la voce e si china sul banco, e da sotto ti tocca alzare il mento ancora di più. [slyly] “Ti do anche un consiglio, e nemmeno quello è gratis, lo segno a parte. [coldly] La piccola Acari, quella col cappuccio blu che corre fra i tavoli, porta notizie allo sceriffo. Mirko lo sa da settimane e le dà da portare roba falsa, e prima della prossima luna non correrà più. Te lo dico perché tu veda come finisce chi porta notizie a due padroni” conclude, e si pulisce la punta della penna su uno straccio.
  i-conti-di-rozalia__1-esito: |
    [wry] Rozalia sorride appena, come se le avessi chiesto il prezzo di una cosa che ha già venduto, e ti dice che l'hanno saputo da una rossa della Maison, Jass, che ascolta quello che gli uomini dicono dopo il secondo bicchiere. [deadpan] “Rennick le ha parlato all'alba, lei l'ha detto a Mauro e Mauro a Mirko” aggiunge alzando le spalle, “ma quella linea ormai è bruciata. Nerissa le sta addosso da settimane, e a me le cose bruciate non servono.”

    [thoughtful] Poi, quasi distratta, racconta che Mirko è convinto che lo sceriffo usi la crisi degli orchi come scusa per venire a prendere gli Scuri. Chiude il registro e ti accompagna alla porta del retrobottega, [amused] e dal bancone Mauro ti saluta con un grido affettuoso, così forte che i due carovanieri si voltano a cercare il parente tornato.
  il-tagliagole-catturato: |
    [wry] Il posto di guardia della Caserma in Città Bassa è una casa di pietra blu con le inferriate alle finestre, stretta fra una conceria e un forno, e dentro, a seconda del vento, si sente il pane oppure si sentono le pelli. [snoring] Dopo la razzia ci hanno messo il doppio degli uomini, e il sergente di turno dorme su una branda dietro il bancone, col berretto sulla faccia.

    [somber] Nei giorni del Festival le guardie hanno preso tre Scuri che svuotavano un magazzino della Gilda mentre la piazza bruciava. Due li hanno mandati su alla Caserma. Il terzo è ancora qui, nella cella in fondo, perché su non c'era più posto. [tense] È un uomo magro con una cicatrice che gli taglia il sopracciglio, e da una settimana mangia pane e acqua e guarda la porta.

    Il sergente ti riconosce. La sera del Festival eri tra quelli che hanno tenuto testa agli orchi, e le guardie del posto se lo ricordano. [gruff] “Vuoi parlarci? Fai pure” dice, e ti apre la porta del corridoio. “A noi non ha detto niente. Ha più paura di Mirko Vesh che della forca.”

    [uneasy] Il tagliagole alza gli occhi quando entri. Ha visto che le guardie ti lasciano passare, e si tira indietro sulla paglia fino al muro. [nervously] “Io non ho detto niente a nessuno, capito?” dice prima che tu apra bocca. [wry] Nella cella c'è odore di secchio, e cominci a respirare dalla bocca.
  il-tagliagole-catturato__1-successo: |
    [calm] Gli spieghi con calma quello che sa già. Mirko non manda nessuno a tirarlo fuori, e quando uscirà gli Scuri daranno per scontato che abbia parlato. Tanto vale che parli davvero, a qualcuno che può ricordarsi di lui.

    [tense] Il tagliagole si guarda le mani per un pezzo e si stacca con i denti una pellicina dal pollice. Sulla soglia il sergente si appoggia allo stipite e tira fuori un mozzicone di matita. [satisfied] Il prigioniero si passa la lingua sulle labbra spaccate e comincia.
  il-tagliagole-catturato__1-fallimento: |
    [tense] Il tagliagole parla poco e male, guardando la porta. Ti dice che il tizio dei ponti, quello di notte, sa dove passano le merci. Poi, per farti andare via, ti dice che alla Maison c'è una rossa, Jass, che passa a Mauro quello che i clienti dicono a letto, e che “quello di sopra”, come chiama Mirko per non dirne il nome, sa che la piccola Acari fa la spia per lo sceriffo. [nervously] “Prima della prossima luna, capito?” dice, e non aggiunge altro.

    [bitter] Il sergente ha sentito la tua voce alzarsi. Mentre esci scrive il tuo nome sul registro, sotto quello del prigioniero.
  il-tagliagole-catturato__2-esito: |
    [quietly] Ti siedi sulla paglia accanto a lui con la schiena contro il muro, e per un po' stai zitto anche tu. [somber] Poi gli racconti dei recinti di Ghoran dove ti davano pane e acqua, e di come si guarda una porta per giorni aspettando che chi sta di sopra decida quanto vali. Il tagliagole ti ascolta con le ginocchia al petto. [hesitant] “E tu come ne sei uscito, capito?” chiede, e la domanda gli esce storta.

    Glielo dici. Lui si stacca con i denti una pellicina dal pollice e ci pensa a lungo, mentre sulla soglia il sergente tira fuori un mozzicone di matita. [calm] Poi si passa la lingua sulle labbra spaccate e comincia a parlare.
  il-tagliagole-parla: |
    [nervously] “I mulini” dice il tagliagole. “Quelli che sono bruciati uno dopo l'altro, capito? Li hanno bruciati perché i Malgrani avessero in mano tutta la farina. [wry] Lo sapevano in dieci alla Pignatta, e adesso lo sai tu, e siamo in undici.”

    [coughs] Tossisce e sputa nella paglia. [hoarse] “Sui ponti i custodi guardano dall'altra parte per un'inezia, e nella Gilda c'è gente comprata. Nomi non ne ho, e se li avessi li avrei già venduti. Però c'è il tizio dei ponti, quello di notte. Lui sa dove passano le cose, tutte, anche quelle che la Gilda non vede.”

    Della Dama d'Argento ti dice subito che non sa niente. Gli Scuri la cercano come tutti. [fearful] “Quello di sopra vuole sapere chi è” dice, e alza gli occhi al soffitto come se Mirko Vesh abitasse al piano di sopra, “e chi gli porta una briciola viene pagato bene.”

    [quietly] Poi abbassa la voce, anche se nel corridoio c'è solo il sergente. [nervously] “La piccola Acari, quella col cappuccio blu, canta per lo sceriffo. Lui lo sa da prima della razzia, capito? Le dà da portare notizie false, e l'ha già condannata. [pause] Prima della prossima luna, ha detto.”

    [whispers] [uneasy] Quel nome se lo tiene in bocca da una settimana. Si stringe le ginocchia al petto e aspetta, con gli occhi sulla porta del corridoio.
  il-tagliagole-parla__1-esito: |
    [nervously] “Alla Maison abbiamo una rossa, Jass” dice il tagliagole. “Passa a Mauro quello che i clienti le dicono a letto, e Mauro lo porta di sopra, capito? Se il ragazzo della Segheria ha parlato là dentro, lui lo ha saputo la sera stessa.” [uneasy] Mentre lo dice guarda di nuovo il soffitto.

    Sullo sceriffo sa solo quello che diceva Mirko prima della razzia. Secondo lui Galdrick usa gli orchi come scusa per preparare qualcosa contro gli Scuri. [wry] Il sergente, sulla soglia, fa finta di non aver sentito e si gratta la barba. [warm] Quando esci ti accompagna fino alla porta di pietra blu e ti stringe la mano.
  jass-doppio-filo: |
    Sopra la porta della Maison des Lunes la lanterna è accesa. [warm] Sara Beck ti prende le armi e le chiude nell'armadio, e questa volta ti chiama per nome.

    Nel salone Jass gira fra le poltrone a seno nudo, con i capelli rossi sciolti sulle spalle e le lentiggini sul naso. [laughs softly] Passa le dita fra i capelli di un cliente e ride a una sua battuta, [bitter] e guardarla ti lascia in bocca un sapore storto, perché adesso sai che cosa fa di quello che sente. Le parole di Rennick le ha passate a Mauro Scrocco, e sopra Mauro c'è Mirko Vesh. Gli Scuri cercano qualunque cosa sulla Dama d'Argento, ma chi sia non lo sanno.

    [tense] Dalla scala Nerissa Dalvane segue Jass con gli occhi, e ti accorgi che lo fa da prima che tu entrassi. Vicino alla tenda Tachek tiene due dita appoggiate sulla cintura, che fra le ragazze vuol dire già allertato. Kanat occupa la porta del corridoio, e Churl quella d'ingresso.

    Jass ti vede e ti porta di sopra come un ospite qualsiasi. [curious] Quando le dici quello che sai non arrossisce e non nega, e si siede accavallando le gambe.

    [slyly] “Il ragazzo della Segheria beve troppo e parla peggio” dice. “Se le orecchie funzionano non è colpa mia. Allora, sei qui per farmi del male o per farmi un'offerta?”
  jass-doppio-filo__1-successo: |
    [coins clinking] Le posi sul letto un bel gruzzolo e le spieghi il resto. [quietly] Se gli Scuri la credessero compromessa la ammazzerebbero, e tu puoi fare in modo che non lo credano mai. Jass conta le monete senza toccarle. Poi ti conferma che le parole di Rennick le ha passate a Mauro, e che Mauro le ha portate a Mirko.

    [slyly] “D'accordo” dice. “Da stasera le mie orecchie lavorano anche per te. [nervously] Ma se Nerissa lo viene a sapere da te, sono morta prima di domattina.”

    [satisfied] Scendi le scale da solo. Fuori, verso i Ponti, le lanterne dei custodi del turno di notte si accendono una dopo l'altra.
  jass-doppio-filo__1-fallimento: |
    Jass ascolta l'offerta fino in fondo, poi spinge indietro le monete con due dita. [mocking] “Mi proteggeresti tu da Mirko?” dice, e ride piano. [wry] Poi ti accompagna alla porta con un bacio sulla guancia che sa di acqua di rose, e ti resta addosso per tutta la scala.

    [tense] All'alba Sara Beck ti manda a dire che Jass se n'è andata con una borsa, verso la Pignatta. Gli Scuri adesso sanno che qualcuno li sta cercando dentro la Maison. [bitter] Dal Ponte del Pesce guardi le lanterne dei custodi di notte spegnersi una alla volta, mentre sui Quartieri Alti la Caserma apre le finestre.
  jass-doppio-filo__2-esito: |
    Lasci Jass nella stanza e scendi. Nerissa ti ascolta in piedi, con una mano sul corrimano, e non ti interrompe mai. [coldly] “Lo sapevo da settimane” dice alla fine. [pause] “Mi mancava la prova.”

    [somber] Fa un segno a Churl. Jass esce dalla porta sul retro con una borsa e il mantello, e Churl la accompagna fino in fondo a Via del Salmone. [warm] Nerissa ti versa il tè buono, quello della scatola di latta che tiene chiusa a chiave, e dice che lo sceriffo verrà a saperlo stanotte. Da domani la Maison ti deve un favore, e anche lui.

    [uneasy] Gli Scuri se ne accorgeranno entro sera. Tornando verso i Ponti guardi le luci della Caserma, alte sui Quartieri Alti.
  jass-doppio-filo__3-successo: |
    [menacing] Le stringi il polso e lei non si scompone. [sneering] “Uccidermi qui? Nella casa di Nerissa? Auguri.” [tense] Però ha visto la tua faccia, e prima che la porta si apra ti soffia i nomi di Mauro e di Mirko.

    Tachek entra con il pugno chiuso lungo la coscia, e tu esci prima che debba usarlo. [resigned] All'alba Jass non c'è più. È scappata alla Pignatta, e gli Scuri adesso sanno che qualcuno li cerca. Tornando verso i Ponti guardi le lanterne dei custodi di notte, una per ogni campata.
  jass-doppio-filo__3-fallimento: |
    [tense] Jass fa un gesto piccolo con la mano libera, e dopo due respiri Kanat è nella stanza. Ti solleva per la collottola e ti porta giù per le scale davanti a tutto il salone. [gruff] Churl apre la porta e dice una parola sola.

    [wry] In strada ti raccogli da terra sotto la lanterna accesa e ti togli un sassolino dal palmo, con calma, visto che ormai hanno guardato tutti. [bitter] All'alba Jass è già scappata alla Pignatta, e mezza Via dei Rasoi sa come sei uscito dalla Maison. [resigned] Verso i Ponti, le lanterne dei custodi di notte si stanno spegnendo.
