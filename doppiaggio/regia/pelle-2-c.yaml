# Regia del doppiaggio: Sotto la pelle di Qir-Azel (seconda parte)
regia:
  l-assalto-alla-pignatta__8-fallimento: |
    Sali su un carro rovesciato e cominci a chiamare i nomi, [glass shattering] e il primo che chiami ti tira una bottiglia sulla fronte. [pained] Qualcuno ascolta lo stesso. [sad] Mentre scendi dal carro con il sangue negli occhi vedi due sorelle della strada delle fucine lasciare i randelli contro un muro e sparire in un vicolo.

    [tense] Gli altri ti vengono addosso, e prima che la milizia di Galdrick faccia quadrato intorno a te i randelli ti arrivano sulla schiena. [breathing heavily] Quando la folla si sparpaglia i tenenti di Vesh sono a terra o in catene, tutti tranne Rozalia, che ha lasciato soltanto il fumo di un fumogeno.
  galdrick-e-vesh: |
    [fire crackling] [ominous] La Pignatta Grassa brucia, e le travi del tetto crollano una dopo l'altra mentre il fumo sputa scintille nella notte. In fondo ai vicoli la milizia spegne le ultime sacche di resistenza. [door crashing open] Quando sfondi la porta del cortile delle risse li trovi lì, in un quadrato di pietra e di cenere.

    Mirko Vesh ha la camicia strappata e la barba sporca di sangue, e la sua sciabola sottile riflette il rosso delle fiamme. [mocking] “Dieci anni, Galdrick, dieci anni che provi a prendermi” dice con un sorriso storto. [solemn] Galdrick si toglie il mantello e lo lascia cadere nella polvere. Ha in mano una lama spessa, senza ornamenti, con il filo mangiato dagli anni. [quietly] “Sono qui” dice piano, “e tu questa città non la controlli più.”

    [shouting] “È la città che ha scelto Me!” grida Mirko con la sciabola alta. [coldly] “No. È la paura che ha scelto te” risponde Galdrick senza muoversi.

    [tense] Mirko scatta per primo, e la sciabola apre il fianco di Galdrick. Lo sceriffo barcolla all'indietro di un passo. [quickly] Poi abbassa la guardia e avanza dentro il colpo successivo, gli afferra il braccio con la mano libera e lo tira a sé, e gli spinge la lama sotto la cassa toracica, verso l'alto.

    [hoarse] “Dieci anni…” mormora Mirko, sputando sangue. “Per questo?” [pause] [somber] Muore in ginocchio con gli occhi aperti, sorretto dall'uomo che lo ha ucciso.

    [exhausted] Galdrick si siede su un gradino del cortile, con la spada piantata nella terra accanto a sé. [sighs] “È finita… per me, e per lui” dice senza alzare la testa.
  galdrick-e-vesh__1-esito: |
    [tired] “Dovrei dirti che è stato giusto. L'ho fatto per la città, perché la legge doveva vincere, ed è vero” dice Galdrick senza guardarti, con gli occhi sul punto dove Mirko è caduto. [long pause] Dopo una pausa lunga si volta verso di te, e per la prima volta da quando lo conosci la faccia dello sceriffo si incrina.

    [sorrowful] “Ma non era solo per la città. Gli davo la caccia da una vita, e lui dava un senso alla mia.” Si passa una mano sulla testa rasata, sporca di cenere. [quietly] “Mi faceva sentire vivo, e non l'avrei mai ammesso” aggiunge dopo un po', più piano.
  galdrick-e-vesh__2-esito: |
    [tired] Galdrick lascia cadere la testa all'indietro e guarda il fumo. “Tutte le volte che mi sfuggiva, o che gli scoprivo un piano, mi pareva che la città stesse appesa a un filo e che a tenerlo fossi soltanto io.” Si batte il petto con il pugno, piano, due volte. [laughs bitterly] “Orgoglio. Mi ha tenuto in piedi tante notti quanto la giustizia” ammette, guardando ancora il fumo.

    [softly] Più piano ancora dice che adesso non sa se si sente più leggero o più vuoto. [wry] “Non ero pronto a dire addio a questo bastardo, e forse Vesh lo sapeva” aggiunge con un sorriso stanco.
  galdrick-e-vesh__3-esito: |
    [somber] Mirko è disteso dove è caduto, con gli occhi ancora aperti verso le travi che bruciano. Ha un anello a ogni dito, e in Città Bassa tutti sanno che soltanto uno è suo, quello liscio d'argento sul mignolo sinistro. [bitter] Gli altri li ha tolti ai debitori, uno per ogni conto chiuso.

    [gruff] “Lasciali dove sono, domani li riportiamo ai loro padroni” dice Galdrick quando ti vede guardarli, [quietly] “a quelli che sono ancora vivi.”
  galdrick-e-vesh__4-esito: |
    Gli tendi la mano, e Galdrick ci si appoggia in equilibrio incerto, con l'altra mano premuta sul fianco. [hoarse] “Non fare come me” dice mentre si raddrizza, “e non legare la tua vita a un nemico, perché quando il duello finisce ti resta soltanto il silenzio.” [sword sliding into scabbard] Rimette la spada nel fodero, e la lama entra con un colpo secco.

    [tired] “Andiamo. Questa città aspetta qualcuno migliore di me per guidarla. Il resto spetta a Julia.” [somber] Volta le spalle al corpo di Mirko e alla Pignatta che fuma, e comincia a salire verso i Quartieri Alti un passo alla volta, senza chiederti di sorreggerlo.
  galdrick-e-vesh__5-successo: |
    [calm] Gli apri la giubba sul fianco senza chiedere il permesso. Il taglio è lungo ma pulito, e lo chiudi con l'ago e il filo della bisaccia mentre lui guarda il fuoco e stringe i denti. Alla fine si guarda la cucitura e annuisce. [hoarse] “Non fare come me” dice mentre si abbottona la giubba, “e non legare la tua vita a un nemico, perché quando il duello finisce ti resta soltanto il silenzio.”

    [sword sliding into scabbard] Si alza da solo e rimette la spada nel fodero con un colpo secco. [tired] “Andiamo. Il resto spetta a Julia.” [relieved] Volta le spalle al corpo di Mirko e alla Pignatta che fuma, e sale verso i Quartieri Alti senza zoppicare.
  galdrick-e-vesh__5-fallimento: |
    [tense] Gli apri la giubba sul fianco e provi a chiudere il taglio con l'ago della bisaccia, ma le mani ti tremano e il filo si strappa due volte. [tender] Galdrick ti toglie l'ago di mano con delicatezza e si preme il fazzoletto sulla ferita. [wry] “Lascia, ci pensa Vantes” dice con un mezzo sorriso. [hoarse] “Non fare come me” aggiunge mentre si raddrizza, “e non legare la tua vita a un nemico, perché quando il duello finisce ti resta soltanto il silenzio.”

    Si alza appoggiandosi alla spada. [tired] “Andiamo. Il resto spetta a Julia.” [somber] Sale verso i Quartieri Alti con la mano sul fianco, e tu gli vai dietro con le dita sporche del suo sangue.
  la-citta-dopo-vesh: |
    [calm] Tre settimane dopo la notte della Pignatta il Municipio ha le finestre aperte, e sulla panca dell'anticamera c'è la coda. Sono soprattutto mugnai e taglialegna con il cappello in mano, venuti per le licenze nuove. [warm] Sul davanzale dell'anticamera qualcuno ha messo un mazzo di fiori di campo in un barattolo da conserva, con l'etichetta ancora attaccata.

    Julia Castaldi ti riceve nel suo ufficio, fra pile di pratiche più alte del tavolo, e ti racconta la città come si legge un bilancio. Gli Scuri come rete non esistono più. Nei villaggi del circondario restano cellule piccole che vivono di furti e di traffici minuti, e in Municipio nessuno le copre più. [somber] Ottone Malgrani è stato condannato a morte dopo un processo breve. [wry] Senza i Malgrani e senza i Tarvelin, in Consiglio le liti restano, però la corruzione ha smesso di comandare.

    [tired] “Ho fatto le licenze per chi macina e commercia grano, con controlli periodici sulle quantità e una tassa sulla produzione” dice, sfogliando una pratica che conosce a memoria. “Il Comune ha pagato le cooperative che hanno rilevato i mulini e le segherie dei Malgrani, e i prezzi restano bassi.” Si gira verso la finestra. [sighs] “Le casse invece sono vuote, e ricostruire la Città Bassa ci costerà mesi” aggiunge senza voltarsi.
  la-citta-dopo-vesh__1-esito: |
    [warmly] “Lucia ha collaborato fino all'ultima carta” dice Julia. “Ha venduto il Maniero alla città, e il Consiglio vuole farne un istituto di studi, con le menti migliori della regione dentro [wry] e le statue degli antenati fuori in cortile, sotto la pioggia come sempre.”

    [amused] Si concede un mezzo sorriso. “È andata a Ghoran a stare con i figli, a casa di Urtilia. [softly] Prima di partire ha chiesto di salutarti, e tu non c'eri.”
  la-citta-dopo-vesh__2-esito: |
    [somber] “Lucia Malgrani l'abbiamo processata insieme al marito” dice Julia. “Dei conti del marito sapeva poco, però abbastanza da tacere per anni. Il tribunale l'ha esiliata a Ghoran, dove ci sono la zia e i bambini.”

    Sfoglia una pratica senza leggerla. “Il Maniero l'ha comprato la città all'asta, e il Consiglio vuole farne un istituto di studi. [wry] Le statue degli antenati restano in cortile, sotto la pioggia.”
  la-citta-dopo-vesh__3-esito: |
    [warmly] “In Città Bassa il tuo nome lo dicono volentieri” dice Julia. “Raccontano che quella notte hai rimandato a casa i loro figli, e lo raccontano in tanti. Per la prima volta da anni la gente sale in Municipio a chiedere, invece di andare alla Pignatta.”

    [calm] Della Pignatta, aggiunge, restano i muri anneriti, e davanti alla porta qualcuno ha già vangato un orto.
  la-citta-dopo-vesh__4-esito: |
    [deadpan] “Laggiù di te parlano poco” dice Julia, stringendosi nelle spalle. “Si ricordano la milizia e le randellate più delle facce, e quando salgono per le licenze chiedono ancora chi pagherà i vetri delle finestre. Forse per te è meglio così.”

    Della Pignatta, aggiunge, restano i muri anneriti, e davanti alla porta qualcuno ha già vangato un orto. [wry] Le prime cipolle sono spuntate storte, tutte piegate dalla stessa parte.
  la-citta-dopo-vesh__5-esito: |
    [hesitant] Julia ci mette un po' a rispondere. [somber] “Sui muri della Città Bassa c'è scritto assassini del governo, con il carbone, e sotto qualche volta c'è il tuo nome” dice. [tired] “Le scritte le facciamo lavare, e la notte dopo tornano. Ci vorranno anni.”

    [sorrowful] Della Pignatta restano i muri anneriti. [pause] Davanti alla porta qualcuno ha piantato una croce di legno per ogni ragazzo morto sullo spiazzo.
  la-citta-dopo-vesh__6-esito: |
    Julia apre un cassetto e posa sul tavolo una borsa di cuoio con il sigillo del Consiglio, e accanto una lettera firmata da lei e da Galdrick. [wry] “Le casse sono vuote” dice. “Questa è l'ultima borsa che avevamo per una cosa giusta.” La lettera dice che la città ti deve un favore, e chiunque la può leggere.

    [warm] Galdrick lo incontri sulle scale senza armatura, con il fianco ancora fasciato sotto la giubba. Ti stringe la mano e torna giù verso la Caserma, con i pollici nella cintura.
  la-citta-dopo-vesh__7-esito: |
    Guardi la borsa sul tavolo e chiedi a Julia di spenderla in Città Bassa, per le case bruciate intorno alla Pignatta. Lei ti guarda a lungo. Poi rimette la borsa nel cassetto e ci lega sopra un cartellino con scritto Città Bassa, tetti. [warmly] “Basta per i tetti di una strada” dice, e ti consegna lo stesso la lettera firmata da lei e da Galdrick, dove c'è scritto che la città ti deve un favore.

    [tender] Uscendo passi davanti alla coda dei mugnai, e uno ti riconosce e si toglie il cappello.
  la-citta-dopo-vesh__8-esito: |
    [thoughtful] “La Gilda è in bilico, perché l'Acciaieria dei Tarvelin è ferma e Liaren non la vuole” dice Julia. “Alla Casa dei Nodi vorrebbero riaccenderla con un amministratore loro, e intanto il turno di giorno aspetta sul muretto davanti al cancello, tutte le mattine.”

    [somber] Dalla finestra la ciminiera si vede appena, sopra i tetti della Città Bassa, e non fuma.
  la-citta-dopo-vesh__9-esito: |
    [wry] “L'Acciaieria l'ha riaccesa la Gilda, con un amministratore suo” dice Julia. “Alla Casa dei Nodi hanno ripreso a respirare, e la tassa sulla colata la pagano prima della scadenza, cosa che i Tarvelin non hanno mai fatto. [somber] Liaren dal cancello non ci è più passata.”
  la-citta-dopo-vesh__10-esito: |
    [warmly] “All'Acciaieria lavorano in società quelli del turno di giorno, con la concessione firmata da Liaren” dice Julia. [amused] “È la prima fornace della città che va avanti senza un padrone, e alla Gilda non hanno ancora deciso se esserne contenti. Il lyssan intanto lo compra Irsa Valbrun, fino all'ultima colata.”
  la-citta-dopo-vesh__11-esito: |
    [calm] “L'Acciaieria la manda avanti Irsa Valbrun d'accordo con Liaren, e alla fornace c'è Abele Torsi” dice Julia. [wry] “Alla Gilda brontolano per l'amministratore che non hanno potuto metterci, e intanto il lyssan esce e le famiglie degli otto prendono la loro parte.”
