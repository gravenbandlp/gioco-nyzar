  rennick-dole: |
    [wood creaking] La scala è stretta e di legno scuro, e il terzo gradino scricchiola sotto il tuo peso ma non sotto quello di Tachek. [eerie] Al primo piano le pareti sono tappezzate di carta color vino, e lungo il corridoio è appesa una fila di piccoli specchi a mezzaluna, uno girato verso il muro. Sulla prima porta a destra è incisa una luna crescente. Tachek si ferma un passo dietro di te.

    Prima che tu bussi, la porta si apre ed esce una ragazza dai capelli rossi. [slyly] Ti sorride di sbieco e scende la scala senza fretta.

    [somber] Rennick Dole è seduto sul bordo del letto, vestito ma scalzo. Sul comodino c'è una bottiglia di liquore di radice quasi vuota, e l'odore dolciastro ti prende alla gola. Ha gli occhi arrossati, e le mani gli tremano. Le tiene strette sulle ginocchia per non farlo vedere. [whispers] [uneasy] Se stringe ancora un po' si rompe le ginocchia da solo. Guarda la porta che si è appena chiusa.

    [hoarse] “Jass” dice. “Stamattina mi ha ascoltato per due ore, e stasera è tornata su. È la spesa migliore che abbia mai fatto, e ne ho fatte di spese.” Poi guarda te, e non sembra sorpreso. [tired] “Ti aspettavo prima. Marko sa che sono qui e parlerà, quindi è meglio che parli io per primo. Siediti.”

    [tense] Ci sono tre cose che vuoi sapere da lui, e Rennick regge una domanda alla volta. Tra una risposta e la successiva guarda la bottiglia.
  rennick-dole__1-esito: |
    [glass clinking] Rennick prende la bottiglia e la rimette giù senza bere.

    [bitter] “Mio padre commerciava pelli con i Nove Chiodi, e io lo seguivo fino al Bosco della Forca. Voleva che imparassi a contare i prezzi nella loro testa, e ho imparato anche il resto.” [tense] Durante la razzia era nascosto sotto una bancarella rovesciata, e il capo sul cinghiale corazzato gli è passato a tre passi. [trembling] “Diceva agli altri che la Dama d'Argento li aveva mandati. Mawrak'Thur vuol dire questo. Sono cinque tribù, e stanno tutte sotto una sacerdotessa.”

    [angry] “Al Velo devono saperlo. Se non lo sanno, qualcuno lassù lo tiene nascosto” dice, e stringe il collo della bottiglia finché le nocche diventano bianche.
  rennick-dole__2-esito: |
    [quietly] Rennick abbassa la voce, e quando ti sporgi verso di lui la abbassa ancora.

    [trembling] “Avevo otto anni, e lei nove. Alla processione del Solstizio Padre Sollen se la portava dietro legata al polso con un nastro argentato. Diceva che l'angelo si distraeva, se non sentiva il nastro.” [eerie] A metà processione un cane è scattato da un vicolo verso la fiamma del sacerdote. La bambina si è voltata senza alzare le mani, e il cane si è piegato a mezz'aria, come se gli avessero spinto giù la schiena. [pause] Il cane è caduto senza un guaito. Mentre lo racconta ti accorgi che anche le tue spalle si sono irrigidite.

    [hoarse] “Aveva i capelli d'argento e gli occhi viola. In quel momento erano diventati color lavanda, e lei sorrideva.” Poi continua: [bitter] “La sera le ho tirato il fango addosso e le ho dato della strega davanti a tutti. Volevo che la credessero pazza, così avrebbero smesso di portarla in processione e io avrei smesso di vederla.”
  rennick-dole__3-esito: |
    [tense] Rennick finisce la bottiglia in un sorso e posa il vetro sul comodino piano, come se avesse paura di romperlo.

    [bitter] “Laresh era una copertura. Marko doveva raccontarla a chiunque chiedesse di me, e intanto io venivo qui.” Si guarda le mani. [fearful] “Un paio di giorni fa qualcuno è andato a chiedere di me a Ottone Malgrani, e Ottone ha esitato sul nome. Lui esita solo quando ha paura.”

    Si alza, fa due passi verso la finestra e torna a sedersi. [urgent] “Voglio lasciare Qir-Azel stanotte. La Maison è l'unico posto dove nessuno può prendermi senza che qualcuno se ne accorga. [tired] Però qui dentro non ci posso restare per sempre.”
  rennick-dole__4-esito: |
    Rennick si infila gli stivali e non li allaccia. [wry] Prima di uscire lascia sul comodino qualche moneta per Jass, dopo averle contate due volte.

    [quietly] Tachek vi accompagna giù per la scala. Nel salone Nerissa è in piedi accanto al camino e vi guarda passare senza dire niente, mentre l'uomo in giubba verde tiene la testa bassa sul bicchiere. Sara Beck ti rende le armi e apre la porta. [coldly] “Buona fortuna” dice, e la richiude subito dietro di voi.

    [calm] Fuori la lanterna è accesa e le finestre della via sono buie, e dopo il caldo del salone l'aria ti entra fredda nel colletto. Su un davanzale qualcuno ha lasciato ad asciugare un paio di calze spaiate. Rennick ti cammina accanto con le mani in tasca. [tense] Più avanti, dove la strada fa il gomito, si ferma di colpo e ti prende per la manica.
  rennick-dole__5-esito: |
    Gli dici di restare chiuso in questa stanza fino a domani, perché Nerissa lo protegge meglio di quanto possa fare la strada. [thoughtful] Rennick ci pensa a lungo. Poi conta le monete per un'altra notte e le mette in fila sul comodino. [tired] “Ti aspetto fino a domani sera, poi esco da solo” dice senza alzare gli occhi.

    [wry] Mentre scendi la scala lo senti chiedere a Tachek di mandargli su Jass. Nel salone Nerissa ascolta quello che le dici e annuisce una volta sola, e Sara Beck ti rende le armi sulla soglia.

    [calm] La sera dopo torni a prenderlo. Quando Sara ti apre, Rennick è già in fondo alla scala con gli stivali allacciati, e prima di uscire lascia sul bancone qualche moneta per Jass, dopo averle contate due volte. In strada la lanterna è accesa e le finestre sono buie. [tense] Più avanti, dove la via fa il gomito, Rennick si ferma di colpo e ti prende per la manica.
  rennick-dole__6-esito: |
    Gli dici che vieni dalla Cattedrale e che dopo la razzia hai portato le bende in Città Bassa. Rennick ti guarda le mani, poi ride piano. [wry] “Allora te lo dico come si dice a un prete” fa, e abbassa la voce.

    [quietly] A otto anni era alla processione del Solstizio, quando Padre Sollen si portava dietro una bambina di nove anni legata al polso con un nastro argentato. [eerie] Un cane è scattato da un vicolo verso la fiamma del sacerdote, e lei si è voltata senza alzare le mani. Il cane si è piegato a mezz'aria ed è caduto senza un guaito. [trembling] “Aveva gli occhi viola, e in quel momento erano color lavanda. Sorrideva.” [somber] La sera Rennick le ha tirato il fango addosso e le ha dato della strega davanti a tutti. Ti accorgi di aver fatto il segno dell'Albero senza volerlo, e lui se ne accorge con te.
