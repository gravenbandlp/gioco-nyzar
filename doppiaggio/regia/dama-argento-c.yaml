# Regia del doppiaggio: La Dama d'Argento
regia:
  nerissa-dalvane: |
    [calm] Sara Beck chiude a chiave l'armadio delle armi e ti affida a Gretchen, la più anziana delle ragazze, che ti accompagna oltre la tenda senza chiederti il nome.

    Il salone è più piccolo di quanto credevi. [softly] Ci sono quattro poltrone di cuoio scuro e tappeti spessi che assorbono i passi, e le lampade hanno schermi di vetro fumé che danno alla stanza una luce color miele. [wry] Uno schermo ha una crepa coperta con carta dipinta dello stesso colore, un lavoro di molta pazienza e poco successo. [fire crackling] Vicino al camino due ragazze parlano con un uomo di mezza età in giubba verde, che non alza la testa quando entri.

    Gretchen sale la scala curva e torna giù poco dopo, un passo dietro a un'altra donna. È alta, ha i capelli scuri raccolti e un vestito pratico di buon taglio, con un bracciale d'argento al polso sinistro. [whispers] [sarcastic] Questa ha già deciso quanto vali, e ha arrotondato per difetto. Nerissa Dalvane ti indica una poltrona e si siede di fronte a te, e la tua schiena si raddrizza da sola.

    Quando le dici il nome di Rennick Dole, lei non batte ciglio. [coldly] “È arrivato all'alba, ubriaco a metà. Ha chiesto di Jass e le ha tenuto la mano per due ore. Poi è salito al primo piano e non è più sceso. Di solito ride forte e paga con monete sporche, ma stamattina sembrava uno che aspetta qualcuno.” Beve un sorso di tè. [calm] “Chi sta sotto il mio tetto io lo proteggo, vedi. È una questione di economia, perché il giorno in cui un cliente esce da qui portato via a forza la Maison chiude entro un mese. [pause] Quindi dimmi perché lo cerchi.”
  nerissa-dalvane__1-successo: |
    Le racconti della razzia e di Mawrak'Thur, e della strada che hai fatto per arrivare fino a Via dei Rasoi. Nerissa ascolta senza interromperti, [tense] e quando dici “Dama d'Argento” posa la tazza sul piattino.

    [quietly] “Due settimane fa uno Scuro ha bevuto troppo in questo salone” dice Nerissa, e intanto rigira la tazza fra le dita. [thoughtful] “Parlava di una donna dai capelli d'argento, e io l'ho messo sul conto del vino.”

    Poi fa un cenno verso il fondo del salone e ti spiega come andrà: [calm] “Tachek sale insieme a te e aspetta in corridoio, con la porta socchiusa. È la prima stanza in cima alla scala, la Luna Crescente. Se dorme non svegliarlo di colpo, [under breath] e se ti dice quello che credo, non ripeterlo ad alta voce finché sei sotto il mio tetto.”
  nerissa-dalvane__1-fallimento: |
    [wry] Racconti tutto, ma lo racconti male, e a metà ti accorgi che le mani ti stanno mimando il cinghiale. Da come ti guarda capisci che per lei un orco su un cinghiale e un uomo che trema in una stanza al primo piano restano due storie separate.

    [sighs] Alla fine Nerissa sospira e scuote la testa. [deadpan] “Ti credo a metà” dice, “e per farti salire mi basta. Però Tachek viene con te e resta nella stanza per tutto il tempo.”

    [tense] Dal fondo del salone si alza un uomo asciutto, vestito di scuro, con una mazza imbottita alla cintura. Ti aspetta ai piedi della scala con due dita appoggiate sulla fibbia.
  nerissa-dalvane__2-esito: |
    [coins clinking] Posi una manciata di monete sul tavolino, accanto alla teiera. Nerissa le guarda senza toccarle. [wry] Gretchen le raccoglie dal tavolino e le conta nel palmo muovendo appena le labbra, e verso la fine alza gli occhi su di te, prima di contare l'ultima.

    [coldly] “Il disturbo si paga” dice Nerissa, “ma da solo con lui non ti ci lascio.” Chiama dal fondo del salone un uomo asciutto, vestito di scuro, con una mazza imbottita alla cintura. [calm] “Tachek sale con te e resta nella stanza. La Luna Crescente è la prima porta in cima alla scala.”

    Tachek ti precede sui gradini senza voltarsi.
  nerissa-dalvane__3-successo: |
    Le dici che Marko Thessel sa dov'è Rennick, e che alla Segheria raccontano a tutti la storia di Laresh. [tense] Nerissa si scambia un'occhiata con Gretchen.

    [coldly] “Marko è venuto a tirare la catena stasera, e Sara l'ha rimandato indietro” dice Nerissa, voltandosi di nuovo verso di te. [ominous] “Se lo conosci come lo conosco io, sai che la prossima volta non verrà da solo.”

    Poi chiama con un cenno un uomo asciutto con una mazza imbottita alla cintura, e gli dice di salire con te e di restare nella stanza. La Luna Crescente è la prima porta in cima alla scala.
  nerissa-dalvane__3-fallimento: |
    Nerissa ascolta il nome di Marko Thessel e non cambia espressione. [coldly] “Marko lo conosco da anni, e so già dov'è stato stasera” dice. “Del motivo per cui cerchi Rennick non mi hai detto niente.”

    [resigned] Si alza e lascia la tazza a metà. Gretchen ti riaccompagna nella sala d'accoglienza con la stessa cortesia con cui ti ha fatto entrare. [bitter] Sara Beck ti rende le armi e ti dice che la signora, se vorrai, ti riceverà un'altra volta.
  nerissa-dalvane__4-esito: |
    [menacing] Abbassi la voce e le spieghi cosa potrebbe succedere alla Maison se Rennick non scende. Nerissa ti lascia finire, poi si appoggia allo schienale e il suo tono si fa più freddo.

    [coldly] “Rennick è sotto il mio tetto” dice, e alza due dita verso il fondo del salone.

    [tense] Prima che tu possa rispondere, una mano larga come una pala ti prende per il colletto e ti solleva dalla poltrona. Churl Bra'aak ti porta attraverso il salone e [wood thudding] ti fa sbattere la spalla contro lo stipite. [gruff] “Fuori” dice. [bitter] Gretchen ti apre la porta, e Sara Beck ti mette in mano le armi una alla volta, senza fretta, davanti a chi passa per Via dei Rasoi. Un vecchio con un cesto di cipolle si ferma a guardare, e quando capisce che non succede altro riprende la sua strada. [pained] La spalla ti pulsa. [door closing] Poi la porta si richiude, e sopra di te la lanterna resta accesa.
  nerissa-dalvane__5-esito: |
    [calm] Le parli come si parla a una padrona di casa in un salotto dei Quartieri Alti, con la tazza in mano e le cose importanti dette di sbieco. Di Rennick dici soltanto che qualcuno lo cerca per farlo parlare e che tu preferiresti arrivare prima, e non fai nessun nome dei clienti, nemmeno quelli della tua famiglia che sai passati da questo salone.

    Nerissa posa la tazza e ti guarda più a lungo. [wry] “Discrezione. Nei Quartieri Alti la insegnano ancora, a quanto pare” dice, e chiama con un cenno un uomo asciutto con una mazza imbottita alla cintura. [calm] “Tachek, porta su l'ospite. Poi resta in corridoio” gli dice, e a te spiega che la Luna Crescente è la prima porta in cima alla scala.
  nerissa-dalvane-di-casa: |
    [calm] Sara Beck chiude a chiave l'armadio delle armi e ti affida a Gretchen, che ti chiama per nome e ti accompagna oltre la tenda con il libro dei conti sotto il braccio, perché stasera non ha fatto in tempo a chiuderlo.

    [wry] Il salone lo conosci dalla porta della cucina, e da questa parte sembra più piccolo. [softly] Ci sono quattro poltrone di cuoio scuro e tappeti spessi che assorbono i passi, e le lampade hanno schermi di vetro fumé che danno alla stanza una luce color miele. Lo schermo con la crepa coperta di carta dipinta è sempre lo stesso, e da vicino la pezza si vede ancora di più. [fire crackling] Vicino al camino due ragazze parlano con un uomo di mezza età in giubba verde, che non alza la testa quando entri.

    Gretchen sale la scala curva e torna giù poco dopo, un passo dietro a Nerissa Dalvane, con il vestito pratico di buon taglio e il bracciale d'argento al polso sinistro. [whispers] [uneasy] Mi ha visto portare fuori i secchi della cenere, e adesso mi vede in salone. Nerissa ti indica una poltrona e si siede di fronte a te, e la tua schiena si raddrizza da sola.

