# Regia del doppiaggio: Capomozzo (seconda parte)
regia:
  balthog-il-prescelto: |
    [ominous] La sala del trono è la stanza più grande della fortezza, e l'aria è ferma e sa di ferro. Le pareti sono coperte di pellicce striate di rosso e di nero, e quattro pilastri irti di spuntoni reggono il soffitto annerito dalle torce. Ai piedi dei pilastri ci sono le mani mozzate, infilzate sugli spuntoni bassi, alcune secche come foglie e altre no. In fondo, su una pedana di legno, c'è un trono coperto di pelli di cinghiale con un teschio di cavallo sopra lo schienale.

    Balthog il Prescelto ci siede sopra, con quattro orchi armati ai lati. Ha i lineamenti regolari, quasi belli per un orco, e in tutto il corpo non ha una cicatrice. [slowly] Le mani appoggiate sulle ginocchia sono vuote.

    [quietly] “Fermo lì. Non ti sei ancora guadagnato il diritto di avvicinarti” dice a voce bassa, e si sporge in avanti con i gomiti sulle ginocchia. “So chi sei, macellaio di Qir-Azel. Hai ammazzato la mia gente in città e sotto la città, eppure non sei venuto fin qui per me.” Alza piano le mani aperte. [slyly] “C'è una donna che vive sotto questa fortezza, o qualcosa che ha preso la forma di una donna. Ha i capelli come il mercurio. Lei e i suoi incappucciati hanno provato a piegarmi. Potremmo avere un nemico in comune, macellaio. Io posso darti rifugio e i tesori di anni di razzie, e tu mi dici che cosa vuoi.”

    Sorride, e gli occhi restano fermi su di te. [pause] I tuoi piedi, intanto, sono rimasti sulla soglia.
  balthog-il-prescelto__1-vittoria: |
    [tense] Balthog scende i tre gradini della pedana senza fretta e si mette in guardia con le mani aperte all'altezza del petto. Combatte meglio di chiunque tu abbia mai visto, e per un pezzo ogni tuo colpo trova soltanto aria. Poi sbaglia di poco l'appoggio di un piede sulla pelle di cavallo stesa davanti al trono, e tu ci entri dentro. Quando cade contro un pilastro gli spuntoni fanno il resto. [exhales] I quattro orchi guardano il loro Prescelto per terra, poi si guardano fra loro, e scappano dalla porta grande senza una parola. Dietro il trono una tenda di pelle copre una scala che scende nella roccia.
  balthog-il-prescelto__1-sconfitta: |
    [pained] Balthog non spreca un movimento. Ti prende il polso e ti fa girare su te stesso, e ti manda a sbattere contro un pilastro a un palmo dagli spuntoni. Quando provi a rialzarti ti rimette giù con un colpo solo sotto lo sterno. [breathing heavily] Ti trascina per il collo della camicia fino alla tenda dietro il trono, dove una scala scende nel buio.

    [coldly] “Scendi da lei, macellaio” dice senza alzare la voce. “Se torni su ti finisco io. Se resti giù ti finisce lei, e a me va bene uguale.” Ti spinge, e rotoli per una rampa intera prima di fermarti contro il muro.
  balthog-il-prescelto__2-successo: |
    Gli rispondi che vuoi la donna di sotto e che il resto si può discutere. Balthog annuisce piano, come se avessi detto la cosa giusta, e scende dalla pedana per venirti incontro, [tense] e tu vedi il momento in cui il peso gli passa sulla gamba davanti. Lo colpisci lì, al ginocchio, con il tacco dello stivale e tutto il tuo peso, e la gamba gli si piega dalla parte sbagliata. Cade di fianco con un verso di sorpresa e batte la testa contro la base di un pilastro, fra gli spuntoni bassi e le mani secche, e resta intontito quanto basta perché il secondo colpo lo prenda alla tempia. I quattro orchi vedono il loro Prescelto a terra e scappano. [satisfied] Lo lasci lì davanti al trono senza finirlo, vivo, con un rivolo di sangue nell'orecchio. Dietro il trono una tenda di pelle copre una scala che scende.
  balthog-il-prescelto__2-fallimento: |
    Gli rispondi con le parole giuste, ma gli guardi le ginocchia troppo presto, e Balthog se ne accorge. [coldly] “Ti avevo avvertito. Non sei pronto a stare davanti a me” dice, e in un attimo è giù dalla pedana. Il primo colpo non lo vedi nemmeno. [pained] Ti ritrovi contro un pilastro, con uno spuntone che ti ha aperto la spalla, e scappi dalla porta laterale verso la chiesa in cima all'isola con i passi degli orchi dietro. Dietro l'altare la porta bassa è aperta. [breathing heavily] Ti butti giù per la scala nella roccia, e nessuno ti segue oltre le lanterne.
  balthog-il-prescelto__3-successo: |
    Gli racconti del diario di Isvaro, dove il mezzelfo chiama Aurenne la sua amata e scrive che gli orchi di Capomozzo li comanda lei. Poi gli chiedi se le macchine della sala dei trofei si girano verso di lui, quando entra. [slowly] Balthog guarda a lungo le sue mani vuote, e alla fine manda via i quattro orchi con un cenno.

    [bitter] “Borgoth me l'aveva detto del mezzelfo, e io l'ho cacciato per questo” dice. “Quando entra lei le macchine si girano. Verso di me non si sono girate mai.” Si alza e si butta sulle spalle una pelliccia presa dallo schienale. [resigned] “Capomozzo adesso è roba tua e sua, macellaio. Io porto via la mia gente prima che lei finisca di consumarla.” Esce dalla porta grande senza voltarsi, e dietro il trono resta una tenda di pelle sopra una scala che scende.
  balthog-il-prescelto__3-fallimento: |
    Gli racconti del diario di Isvaro e di quello che il mezzelfo scriveva di lei, e Balthog ti lascia arrivare fino in fondo. Poi ride piano. [mocking] “Anche Borgoth parlava così, e adesso Borgoth dorme nei rovi” dice, e scende dalla pedana. Ti colpisce una volta sola, al fianco, con la mano aperta, e ti sembra di aver preso un tronco. [gasps] Quando riesci a respirare sei carponi sulla roccia fuori dalla porta laterale. Gli orchi restano dentro, perché lui li ha fermati con una parola che somiglia a una risata. [exhausted] Ti trascini fino alla chiesa in cima all'isola, e poi giù per la scala dietro l'altare, sputando sangue a ogni giro.
  balthog-il-prescelto__4-successo: |
    Gli ripeti quello che ti ha detto Borgoth fra i rovi, che è stata lei a volere l'attacco a Qir-Azel e che lui, Balthog, fa tutto quello che lei dice. Balthog ascolta con la testa piegata. [tense] Quando arrivi al mezzelfo stringe i braccioli del trono fino a farli scricchiolare, e poi li lascia andare.

    [wry] “Borgoth parla troppo, e quasi sempre ha ragione” dice. Fa un cenno, e i quattro orchi escono. Raccoglie una pelliccia dallo schienale e se la butta sulle spalle. [calm] “Tienila tu, la fortezza. Io porto via chi mi vuole seguire.” Se ne va senza voltarsi, e dietro il trono resta una tenda di pelle sopra una scala che scende.
  balthog-il-prescelto__4-fallimento: |
    Fai il nome di Borgoth, e la faccia di Balthog si chiude. [coldly] “Borgoth racconta storie a chiunque lo stia a sentire” dice. “Adesso ne ha trovato uno che gli crede.” Scende dalla pedana in due passi e ti colpisce al petto con il palmo aperto, e ti ritrovi sulla schiena con la bocca piena del sapore del sangue. [bitter] Ti rialzi soltanto perché lui te lo lascia fare. Con il mento ti indica la porta laterale, quella che porta alla chiesa e alla scala nella roccia, e ci vai tenendoti le costole mentre lui ti guarda uscire senza muoversi.
  balthog-il-prescelto__5-esito: |
    Fai un passo indietro e poi un altro, e Balthog ti guarda andare senza alzarsi. [mocking] “Va' pure da lei, macellaio” dice alle tue spalle. “Ci arrivi lo stesso.” [tense] Fuori ti metti a correre, e ti fermi soltanto in cima all'isola, nella chiesa senza tetto, a scostare la pelle di cinghiale dalla porta bassa dietro l'altare. Scendi la scala nella roccia giro dopo giro, oltre le lanterne accese e poi nel buio, con la sua voce ancora in testa, [uneasy] e a ogni giro alzi gli occhi a guardare la scala vuota sopra di te.
  il-ritorno-a-qir-azel: |
    [tired] Per due giorni e mezzo di strada Aurenne non apre gli occhi. Viaggia stesa su una lettiga di rami legata con la cinghia della bisaccia, che salta su ogni sasso, [softly] e la notte, accanto al fuoco, il suo respiro è così lento che ti chini più volte ad ascoltarlo. [uneasy] Sotto la pelle le pulsano chiazze scarlatte simili a braci coperte di cenere, e ogni volta che la tocchi ti strofini le mani sui calzoni senza volerlo.

    [heavy door thudding] Le porte della Cattedrale del Velo si aprono con un colpo sordo. Dentro c'è odore d'incenso e di cera, e sotto c'è quello di ferro bruciato che ti porti addosso dalle rovine. In fondo alla navata Padre Vantes e Julia Castaldi parlano a bassa voce con Toren Galdrick, che è salito dalla Caserma con gli stivali ancora sporchi della ronda, e al rumore delle porte si voltano tutti insieme.

    [warm] Julia ti viene incontro per prima, con le mani strette al petto, e la voce roca le si rompe a metà di un ringraziamento al Grande Albero. Galdrick guarda la donna che hai steso su una panca e ti chiede soltanto se è viva. Vantes le si inginocchia accanto, le posa due dita sulla fronte e le tiene lì a lungo.

    [quietly] “È contaminata” dice piano. “C'è una presenza dentro di lei, e la sento sotto le dita.” Ritira la mano e si pulisce le dita sulla tonaca, senza accorgersene. [whispers] [uneasy] Allora non succede solo a me. Le tue mani, intanto, hanno già trovato la stoffa dei calzoni.
  il-ritorno-a-qir-azel__1-esito: |
    Gli dici che Balthog il Prescelto è morto nella sua sala del trono, sotto il teschio di cavallo dello schienale. [relieved] Julia respira piano, come se se lo concedesse solo adesso. “Allora è finita” dice, “o quasi.”

    Galdrick non sorride. Tiene i pollici nella cintura e scuote la testa una volta sola. [gruff] “Ci sono ancora bande sparse per le campagne, e a Fondobosco sono più di quanti ne potremmo contare” dice. “Senza un capo, però, non ci verranno più addosso tutti insieme. Il fronte si spezza lì.” Tira fuori il taccuino dalla giubba e ci scrive una riga corta.
  il-ritorno-a-qir-azel__2-esito: |
    Gli dici che hai battuto Balthog davanti ai suoi orchi e che l'hai lasciato a terra davanti al trono, vivo. Galdrick ti guarda a lungo con i pollici nella cintura, e alla fine annuisce. [gruff] “Un orco battuto davanti alla sua tribù non comanda più nessuno” dice. “Forse è meglio di un morto da vendicare.”

    [relieved] Julia respira piano, come se se lo concedesse solo adesso, e dice che allora è finita, o quasi. Lo sceriffo la corregge senza alzare la voce. Restano bande sparse per le campagne, e a Fondobosco gli orchi sono tanti, ma senza un capo non verranno più tutti insieme. Tira fuori il taccuino dalla giubba e ci scrive una riga corta.
  il-ritorno-a-qir-azel__3-esito: |
    Gli dici che Balthog è ancora vivo, e che sotto la fortezza ci sei sceso lo stesso. [thoughtful] Galdrick aggrotta la fronte e ci pensa su con i pollici nella cintura. [gruff] “Un capotribù a cui hanno tolto chi gli dava gli ordini” dice alla fine. “Torna a essere un orco come gli altri, solo più grosso.”

    [relieved] Julia respira piano, come se se lo concedesse solo adesso, e dice che allora è finita, o quasi. Lo sceriffo la corregge senza alzare la voce. Restano bande sparse per le campagne, e a Fondobosco gli orchi sono tanti, ma senza la donna che li teneva in fila non verranno più tutti insieme. Tira fuori il taccuino dalla giubba e ci scrive una riga corta.
  il-ritorno-a-qir-azel__4-esito: |
    Racconti quello che Isvaro scriveva nel diario, della nuova madre di Aurenne e dei resti di Sollen bruciati al santuario di Capomozzo, e di Garin che sotto la fortezza la chiamava pazza per quello che aveva fatto ai mascherati del Culto dell'Anonimo. [candles sizzling] Quando dici il nome di Nhar'Kael nella navata si sentono sfrigolare le candele. Julia sbianca, e Galdrick stringe il pugno sulla cintura.

    Vantes si fa il segno del velo. [quietly] “Nhar'Kael” ripete piano, e ti posa due dita sul polso, come per sentire se il nome ha lasciato un segno anche su di te. [ominous] “Allora tutto questo viene da più in basso di una setta” dice, “e da molto più lontano di quanto pensassimo.”
  il-ritorno-a-qir-azel__5-esito: |
    Racconti del Costruttore e della maschera spaccata che si è ricomposta davanti a te, e del coro che ti ha chiamato Portatore dell'Alba con la tua stessa voce. [uneasy] Mentre parli ti accorgi di toccarti il viso, nel punto dove la maschera si è posata.

    Julia si porta una mano alla bocca. Galdrick chiude gli occhi e mormora soltanto [awed] “Allora le storie erano vere…” Quando li riapre ti parla come parla alle guardie in Caserma, con il taccuino già in mano. [gruff] “Domani sera la Madre del Velo vorrà vederti nella Cripta.”

    Julia indica il congegno che ti spunta dalla tasca. [hoarse] “Quello non toccarlo e non usarlo” dice con la voce roca. “Aspetta che lei si svegli, è l'unica che sa come funziona.”
  il-ritorno-a-qir-azel__6-esito: |
    Posi il congegno sul tavolo accanto alla panca e spieghi che Aurenne lo usava per comandare le macchine della Salvaguardia. Galdrick sposta due libri per guardarlo meglio e scuote la testa. [deadpan] “Un disco che comanda quelle cose” dice. “Sembra una follia.”

    [hoarse] “Forse, ma è l'unica pista che abbiamo” dice Julia con la voce roca. “Non toccarlo e non usarlo. Aspetta che si svegli, lei sa come funziona.”

    Vantes annuisce senza staccare le dita dalla fronte di Aurenne. [softly] “La terrò in vita, ma servirà tempo.” Quando sei già sulla porta ti richiama, e ti dice che la Madre del Velo ti aspetta domani sera nella Cripta, e lo dice come una cosa decisa da giorni.
  la-madre-del-velo: |
    La sera dopo Padre Vantes ti accompagna fino alla scala della Cripta e si ferma sul primo gradino. [quietly] “Io resto qui” dice, e ti posa due dita sul polso più a lungo del solito. Scendi gli ultimi gradini da solo. [eerie] La Cripta è una sala bassa sotto l'altare dove l'aria è ferma e densa d'incenso, e il velo che copre l'altare si muove appena anche se non c'è vento.

    [slowly] Le torce si spengono una alla volta, da quella più vicina alla scala fino all'ultima. Nella penombra resta un chiarore d'oro e d'argento, e al centro della sala c'è una figura avvolta in veli che alla luce delle torce sarebbero di seta nera e grigia, e che adesso sembrano fatti di quel chiarore. Il volto resta nascosto, e le mani che sporgono dai veli hanno le unghie tinte di cenere.

    La voce non ha inflessioni e ti arriva dentro le orecchie senza passare dall'aria. Dietro ce n'è un'altra più bassa, che dice le stesse parole con un attimo di ritardo, [uneasy] e ti si drizzano i peli sulle braccia.

    [solemn] “Portatore dell'Alba” dice la Madre del Velo. “I tuoi passi hanno rotto il silenzio di secoli. La Magnistruttura ha tremato, e le rovine si sono ricordate i loro nomi. Il Costruttore è caduto, e il tuo cammino comincia da lì.” [pause] I veli smettono di muoversi, e la seconda voce finisce la frase un attimo dopo la prima.
  la-madre-del-velo__1-esito: |
    [solemn] “I Costruttori erano le mani dei Precursori” dice la Madre. “Edificavano e custodivano. Quando i loro signori scomparvero rimasero prigionieri del loro lavoro e continuarono a costruire e a difendere senza più sapere per chi. [somber] Adesso sono semidivinità spezzate. Alcuni fanno la guardia, altri distruggono quello che giudicano imperfetto. Ne restano nove, forse dieci.”

    [eerie] La seconda voce, dietro la sua, si fa più vicina. “Uno di loro ti aspetta nel Labirinto di Darn-Morakh. È un Costruttore Redento, l'unico che ricorda ancora che cosa fosse la Luce. [softly] Se puoi, non distruggerlo. Attraverso di lui la tua maschera potrà crescere ancora.”
  la-madre-del-velo__2-esito: |
    [ominous] “Il Labirinto di Darn-Morakh era un cantiere divino” dice la Madre, “dove i Precursori forgiavano mondi. Adesso è una prigione viva di pietra e metallo che pensano, con corridoi che cambiano direzione. Ci si muovono cose che non dovrebbero esistere. La più pericolosa è quella che vi si nasconde.” La seconda voce dice il nome un attimo dopo la prima. [slowly] “Nhar'Kael. La chiamano la Regina delle Ali Spezzate, o la Covatrice di Orrori. Ogni culto che la serve cerca di somigliarle, e fonde la carne con la macchina finché la differenza si perde.”

    Fa una pausa. [solemn] “La donna che hai riportato dalle rovine, quella che gli orchi chiamavano la Dama d'Argento, era solo un preludio.”
  la-madre-del-velo__3-esito: |
    Le dici che scenderai nel Labirinto, quando sarai pronto. La Madre resta immobile così a lungo che ti chiedi se ti abbia sentito. [long pause] Poi le torce si riaccendono partendo dall'ultima, e quando la luce arriva alla scala la figura in mezzo alla sala è soltanto una donna velata di nero e di grigio, più piccola di come ti era sembrata.

    [solemn] “Il tuo cammino è tracciato, Portatore” dice la Madre quando sei già sul primo gradino. “Va', adesso.” In cima alla scala Vantes ti aspetta con le mani infilate nelle maniche, e ti dice che per Aurenne ci vorrà ancora una settimana. Le ferite del corpo si sono già chiuse, e per il resto lui può soltanto pregare. [softly] Ti accompagna fino al portale con una candela in mano, senza chiederti niente.
  la-madre-del-velo__4-esito: |
    Le dici che non scenderai, perché per la Confraternita hai già fatto abbastanza. [pause] Per un po' non succede niente. Poi la voce torna più bassa di prima, e per la prima volta ti sembra quasi umana.

    [quietly] “Da quello che hai dentro non si scappa” dice. “Nhar'Kael è nell'aria che respiri, e nella memoria di chiunque sia nato dopo la Caduta. [pleading] Ti chiedo di servire la vita che resta.”

    Le torce si riaccendono una alla volta. In cima alla scala Vantes ti dice che per Aurenne ci vorrà ancora una settimana, e non ti chiede che cosa hai risposto alla Madre.
  aurenne-si-risveglia: |
    Una settimana dopo un novizio ti ferma per strada e ti dice, con il fiato corto per la corsa, che Padre Vantes ti manda a chiamare. [calm] In Cattedrale la luce entra a fasci dalle vetrate e colora di rosso e d'oro la pietra. Vantes ti accompagna lungo la navata senza parlare e ti lascia davanti alla porta della sala di preghiera più interna.

    Aurenne è in ginocchio davanti all'altare. Al posto dell'armatura nera che portava sul ponte ha una semplice corazza a scaglie color ferro, con le braccia scoperte, e i capelli d'argento legati in una coda alta. La mano destra è ancora l'artiglio, con le dita lunghe e nere, e la tiene aperta sulla coscia come una cosa che non le appartiene. [uneasy] I tuoi piedi si fermano sulla soglia prima che tu lo decida.

    [softly] “Nessun ramo dell'Albero rimane secco per sempre” dice senza voltarsi. “Anche il più annerito, se nessuno lo spezza, può fiorire ancora.” Si alza piano e si gira. [somber] Ha gli occhi viola e stanchi, e la luce che avevano sul ponte se n'è andata.

    [tired] “È un passo delle Scritture, parla di perdono. Padre Vantes mi ha accolta, e dice che per tornare indietro non è mai troppo tardi. Io questo non lo so. Non cercherò di giustificarmi con quello che ho subito, né con le voci che mi hanno guidata. Voglio soltanto espiare.” Ti guarda quasi supplicando. [pleading] “Per questo ti risponderò, Portatore. Chiedimi quello che vuoi.”
  aurenne-si-risveglia__1-esito: |
    [quietly] “Mi ha parlato fin da quando ero bambina” dice Aurenne, con gli occhi sulla luce delle vetrate. “Mi chiamava figlia imperfetta, e mi diceva che potevo essere la prima di una stirpe nuova, che potevo riaprire il nido. [bitter] Credevo che fosse un dono.” Si passa la mano buona fra i capelli. “La Marea Grigia è lei. La genera un po' per caso e un po' per difendersi, e così nasconde i segreti dei Precursori. Ogni ondata cancella un pezzo della memoria del mondo.”

    [somber] Poi abbassa gli occhi sull'artiglio. Con tutto quello che ha fatto per Nhar'Kael, dice, adesso alla Regina riesce più facile generare i suoi figli, le bestie mutate che i Raschiatori trovano nelle rovine, e la voce le si fa piatta mentre lo ammette.
  aurenne-si-risveglia__2-esito: |
    [quietly] “L'ho fondato io, per servirla” dice. “Nhar'Kael mi aveva mostrato il tuo volto prima che ti incontrassi, e mi aveva detto che avresti portato la rovina travestita da redenzione. Io l'ho ripetuto agli altri, e loro mi hanno creduto. Portavamo maschere bianche senza tratti, perché la salvezza stava nel non essere più nessuno.”

    La voce le si incrina appena. [trembling] “Uccidevamo chi si opponeva, e quando abbiamo finito ho sacrificato loro, uno dopo l'altro, sull'altare della Regina delle Ali Spezzate. Credevo che mi avrebbe trasformata in qualcosa di potente. [short pause] Il Culto dell'Anonimo è finito con loro, e io sono l'ultima che può raccontarlo.”
  aurenne-si-risveglia__3-esito: |
    “È un relitto dei Precursori” dice Aurenne, e guarda il disco senza toccarlo. “Manda un segnale che confonde le loro macchine. Per qualche minuto non sanno più chi sono, e quindi nemmeno chi è il nemico. Poi si scarica, e si ricarica con i cristalli conduttori oppure da solo, col tempo.”

    [tense] Stringe l'artiglio fino a farsi scricchiolare le nocche. “Può anche comandarle, se gli dai abbastanza volontà. Io ne ho comandate a decine, e a ogni ordine dentro di me si spegneva un ricordo, oppure un respiro. [sad] Un giorno mi sono accorta che non provavo più niente, e ancora adesso non so se quella parte di me tornerà.”
  aurenne-si-risveglia__4-esito: |
    Le porgi il diario aperto sulla prima pagina. Aurenne lo riconosce dalla copertina e non lo prende. Lo guarda nelle tue mani, e le labbra le si muovono appena, come se rileggesse a memoria una riga.

    [quietly] “Quella ragazza scriveva a qualcuno che non la ascoltava” dice dopo un po'. “Al Grande Albero, credeva lei.” [sad] Poi scuote la testa piano e ti chiede di tenerlo tu, perché se lo tenesse lei finirebbe per rileggerlo, e per darle ragione.
  aurenne-si-risveglia__5-esito: |
    Dopo un lungo silenzio Aurenne torna a inginocchiarsi davanti all'altare. La luce delle vetrate le scivola sulla corazza e disegna sul pavimento una macchia rossa, che le arriva fino alle ginocchia.

    [tired] “Lasciami alle mie preghiere” dice. “Non tornerò a combattere, e non voglio più essere la guida di nessuno, né un simbolo. Sono solo una donna che ha perso se stessa nel tentativo di diventare un dio.” Abbassa la testa sull'artiglio. [softly] “Ti auguro ogni fortuna, Portatore. Spero di rivederti.”

    Quando esci Vantes è seduto sull'ultima panca della navata, con il breviario chiuso sulle ginocchia, e ti saluta con un cenno senza alzarsi.
  aurenne-si-risveglia__6-esito: |
    [softly] “E chi lo vede secco non lo tagli, perché la linfa scende prima di risalire” dici, con la cadenza che Ottilia Sanvel fa usare ai novizi all'alba, nel corridoio. [surprised] Aurenne si volta di scatto. Ti guarda come si guarda qualcuno di casa, poi abbassa gli occhi sull'artiglio.

    [tender] “Da bambina lo dicevo anch'io, e non sapevo che cosa volesse dire” dice. “Lasciami alle mie preghiere. Non tornerò a combattere, e non voglio più essere la guida di nessuno.” Torna a inginocchiarsi davanti all'altare. [softly] “Ti auguro ogni fortuna, Portatore. Spero di rivederti.”

    Quando esci Vantes è seduto sull'ultima panca della navata, con il breviario chiuso sulle ginocchia, e ti saluta con un cenno senza alzarsi.
