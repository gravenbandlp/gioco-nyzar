# La quest della Maison des Lunes, passi 7-12.
# - Passo 7, la lampada della Luna Calante: il cristallo accoppiato nella lampada (maison.cristallo 1 tolto, e chi
#   ascolta si mette in allarme; 2 recita di Laure e Kasja, Facile con maison.pace; 3 il filo del Mana, o Ambrin).
# - Passo 8, la legnaia: si scende nella spedizione `maison-sotto-il-cristallo-spento` (spedizione-cristallo.yaml).
#   Il cuore porta maison.scrivano a 5 (preso) o a 3 (scappato); `maison-lo-scrivano-legato` decide dove va Bastiano Rell
#   (1 Nerissa, 2 la Caserma, 3 lasciato andare, 4 lavora per te). Il passo 9 aspetta quella scelta.
# - Passo 9, il quaderno dello scrivano (terzo grado, Di cucina): Nerissa accende la lampada con due dita e si
#   rivela stregona. maison.lista 1 bruciato, 2 a Nerissa, 3 con una pagina strappata (maison.pagina), 4 venduto al
#   Mercato delle Ombre: allora la porta si chiude (maison.chiusa) e il cristallo non arriva; `maison-l-ammenda`
#   riapre la porta con la chiave della porta di servizio. Seguito: la luce color miele.
# - Passo 10, la proposta, in due varianti: A con pista.pelle < 5 (Ottone Malgrani e Annibaldi chiedono il registro
#   per decoro; rep.malgrani −1) e B con pista.pelle >= 7 (Annibaldi propone una tassa sulle visite, letta da Varn
#   Kett; rep.gilda −½). Dà maison.voti 1 o 2 e, parlando con Varn, maison.varn.
# - Passo 11, la cena di Marella: l'ingresso porta nella spedizione sociale `maison-cena-al-maniero-castaldi`
#   (spedizione-cena.yaml). Con pista.pelle 5 o 6 i passi 10-12 restano chiusi.
# - Passo 12, il voto (quarto grado, Voce del salotto): la sera prima del Consiglio, in salone. Con maison.voti >= 4 la
#   proposta cade da sola; con 3 lo sceriffo vota, o si spende un segreto; con 2 o meno passa e Nerissa riempie il
#   registro di nomi inventati (prima ispezione Ingannare Difficile, facile con Varn alleato). maison.annibaldi 1: la
#   proposta è già ritirata. maison.registro 1 respinto, 2 respinto con il voto dello sceriffo, 3 passato e beffato.
storylet:
  # ------------------------------------------------------------ passo 7 · la lampada della Luna Calante
  - id: maison-la-lampada-della-luna-calante
    presso: via-dei-rasoi
    immagine: ambientazione/maison-des-lunes
    titolo: La lampada della Luna Calante
    sommario: "A casa chiusa Nerissa ti aspetta in fondo al primo piano, davanti allo specchio girato verso il muro."
    luogo: Maison des Lunes, il primo piano, di notte
    area: citta-bassa
    requisiti: [fazione.maison == 6]
    testo: |
      La Maison chiusa, di notte, sa di cera spenta, e i passi sulla scala curva
      fanno il doppio del rumore. In fondo al corridoio ti aspettano Nerissa con
      una candela, Laure con un libro e Kasja con la medaglia d'oro sopra la
      camicia da notte, mentre Irmelin sta davanti allo specchio girato verso il
      muro.

      «L'ho girato io» dice Irmelin, senza che nessuno glielo chieda. «La lampada
      della Luna Calante ci si rifletteva dentro, e mi guardava.»

      Nerissa ti porge la candela. «Quella del salone l'abbiamo già staccata.
      Questa è la sorella, e da qualche parte ce n'è una terza che ascolta tutte e
      due.»

      Nella lampada a muro della Luna Calante è incastrata una scheggia di
      cristallo grande come un pollice.

      {magia Media} Il Mana della casa è caldo e color miele, e lì dentro si piega
      e corre via, come l'acqua quando trova una crepa.
    opzioni:
      - testo: "Toglierlo"
        descrizione: "Chiuso in un fazzoletto, e chi ascolta sentirà soltanto il silenzio, e capirà."
        esito:
          titolo: Il fazzoletto
          testo: |
            Stacchi la scheggia con due dita e la avvolgi nel fazzoletto, e la
            senti vibrare contro il palmo come una mosca chiusa in un pugno.
            «Adesso chi ascoltava sa che ce ne siamo accorti» dice Nerissa, «e
            domani avrà più uomini sulla porta.» Più tardi Irmelin ti dice dove
            porta il filo, perché l'ha sentito andar via mentre la toglievi.
          pe: { tecnologia: 5 }
          imposta: { maison.cristallo: 1 }
          effetti: { rep.maison: 1, fazione.maison: 1 }

      - testo: "Dargli da mangiare una conversazione falsa"
        descrizione: "Laure e Kasja possono recitare davanti alla lampada una sera piena di clienti che non esistono."
        quando: [maison.pace == 0]
        prova: { attributo: sociale, abilita: [espressivita, ingannare], difficolta: Media }
        successo:
          titolo: La sera che non c'è stata
          testo: |
            Scrivete la sera in cucina su un foglio che poi finisce nella stufa. Davanti
            alla lampada Laure e Kasja recitano con le voci basse del lavoro un mercante
            di cordame che si lamenta della moglie e un ragazzo alla prima visita che
            chiede dove si mettono gli stivali. In fondo alla condotta qualcuno sta
            scrivendo tutto con cura.
          pe: { espressivita: 5 }
          imposta: { maison.cristallo: 2 }
          effetti: { rep.maison: 1, fazione.maison: 1 }
        fallimento:
          titolo: La risata sbagliata
          testo: |
            Laure dimentica il nome del cliente inventato, Kasja copre con una
            risata troppo alta e dalla lampada arriva un ronzio che prima non
            c'era. Nerissa spegne la candela con le dita. Chi ascoltava adesso sa,
            e domani avrà più uomini sulla porta.
          imposta: { maison.cristallo: 1 }
          effetti: { rep.maison: 0.5, fazione.maison: 1, scandalo: 0.5 }

      - testo: "Far tornare a trovarle il signor Pace"
        descrizione: "Il mercante di bottoni inventato in salone, che ormai sanno recitare tutte."
        quando: [maison.pace == 1]
        prova: { attributo: sociale, abilita: [espressivita, ingannare], difficolta: Facile }
        successo:
          titolo: Il signor Pace torna
          testo: |
            Kasja dà al signor Pace una voce nasale con la erre arrotata, e per
            mezz'ora davanti alla lampada perde petali di garofano sul tappeto,
            finché Nerissa deve coprirsi la bocca per non ridere. In fondo alla
            condotta qualcuno scrive con cura il nome di Bertoldo Pace.
          pe: { espressivita: 5 }
          imposta: { maison.cristallo: 2 }
          effetti: { rep.maison: 1, fazione.maison: 1 }
        fallimento:
          titolo: La risata sbagliata
          testo: |
            A metà Kasja ride davvero e non riesce più a smettere, con la faccia
            nel cuscino, e dalla lampada arriva un ronzio nuovo. Nerissa spegne la
            candela con le dita. «Ha capito» dice piano, ma sorride anche lei.
            «Domani avrà più uomini sulla porta.»
          imposta: { maison.cristallo: 1 }
          effetti: { rep.maison: 0.5, fazione.maison: 1, scandalo: 0.5 }

      - testo: "Seguire il filo del Mana"
        descrizione: "Il Mana esce dalla lampada sottile come una lenza, e seguirlo attraverso i muri è un lavoro da maghi veri."
        prova: { attributo: mentale, abilita: magia, difficolta: Difficile }
        successo:
          titolo: La lenza
          testo: |
            Con due dita sullo schermo senti il filo freddo tirarti sotto il
            pavimento, lungo il muro della legnaia e sotto Via dei Rasoi, fino a
            una stanza di pietra ai piedi del cristallo spento, dove si annoda a
            un altro cristallo e al respiro lento di uno che scrive. Quando riapri
            gli occhi Nerissa ti guarda come si guarda un collega.
          pe: { magia: 5 }
          imposta: { maison.cristallo: 3 }
          effetti: { rep.maison: 1, fazione.maison: 1 }
        fallimento:
          titolo: Il filo che si spezza
          testo: |
            Il filo ti sfugge e il contraccolpo ti arriva dietro gli occhi. Ti
            ritrovi sul tappeto con il naso che sanguina, e Nerissa toglie lei la
            scheggia. Domani, dice, chi ascoltava avrà più uomini sulla porta.
          imposta: { maison.cristallo: 1 }
          effetti: { tormento: 1, rep.maison: 0.5, fazione.maison: 1 }

      - testo: "Portare la scheggia ad Ambrin Qell"
        descrizione: "Al Nodo d'Ossidiana Ambrin legge un cristallo come un notaio un contratto, ma solo per chi conosce bene."
        requisiti: [rep.nodo >= 3]
        esito:
          titolo: Il notaio dei cristalli
          testo: |
            Ambrin rigira la scheggia con una pinzetta d'avorio, sotto gli occhi
            del corvo. «Taglio di Torvessa, accordata a mano da uno che sa il
            mestiere e ha bisogno di soldi» dice. «La sorella sta sotto la tua
            strada, dove passa l'acqua vecchia.» Non ti chiede niente, che con
            Ambrin vuol dire che il conto arriverà più avanti.
          pe: { magia: 5 }
          imposta: { maison.cristallo: 3 }
          effetti: { rep.maison: 1, fazione.maison: 1 }

  # ------------------------------------------------------------ passo 8 · la legnaia (ingresso della spedizione)
  - id: maison-la-legnaia
    presso: via-dei-rasoi
    immagine: ambientazione/maison-des-lunes
    titolo: La legnaia
    sommario: "Sotto la legnaia della Maison c'è una botola che nessuno apre da anni, e il filo del cristallo scende di lì."
    luogo: Maison des Lunes, la legnaia
    area: citta-bassa
    requisiti: [fazione.maison == 7]
    testo: |
      La legnaia è uno stanzino dietro la cucina, con la legna impilata fino
      al soffitto e un'accetta dal manico rifatto più volte piantata nel
      ceppo. Kanat ha spostato mezza catasta, e sotto c'è una botola di
      quercia con l'anello di ferro arrugginito. Dalla cantina del vecchio
      vinaio, dice Gretchen, si scende alla condotta dell'acqua vecchia, che
      non usa più nessuno.

      {furtivita Media} Qualcuno ha unto i cardini da poco, per passare
      senza farsi sentire.

      Gretchen ti dà una lanterna cieca e un pezzo di pane avvolto in un
      tovagliolo, come a un figlio che parte per la scuola. Nerissa, sulla
      porta della cucina, ha le braccia conserte. «Lo voglio vivo, e voglio
      il quaderno su cui scrive» dice.

      {origine figlio-della-citta-bassa} Da bambino ti raccontavano che
      nelle condotte vecchie passavano i contrabbandieri prima degli Scuri,
      e chi ci si perdeva lo ritrovavano al Torvessa, se lo ritrovavano.
    opzioni:
      - testo: "Scendere nella cantina"
        descrizione: "La lanterna cieca, il pane di Gretchen e una scala di legno nel buio."
        esito:
          titolo: La botola
          testo: |
            I cardini unti non fanno il minimo rumore. Kanat ti passa la lanterna
            quando hai i piedi sul primo piolo, e sopra di te la luce della cucina
            si restringe a una riga. Gretchen lascia la botola socchiusa, perché
            tu sappia da che parte tornare.
          vai: maison-sotto-il-cristallo-spento
      - testo: "Aspettare un'altra notte"
        descrizione: "Quello che c'è là sotto aspetta, e la scala resta dov'è."
        costo: 0
        esito:
          titolo: La catasta
          testo: |
            Aiuti Kanat a rimettere la legna sulla botola, e lui non ti chiede
            perché. Gretchen ti mette in tasca il pane lo stesso.

  # ------------------------------------------------------------ passo 8 · dove va lo scrivano
  - id: maison-lo-scrivano-legato
    presso: via-dei-rasoi
    immagine: ambientazione/cristalli-conduttori
    titolo: Lo scrivano
    sommario: "Bastiano Rell è legato sul ceppo della legnaia, e qualcuno deve decidere dove andrà stanotte."
    luogo: Maison des Lunes, la legnaia
    area: citta-bassa
    requisiti: [fazione.maison == 8, maison.scrivano == 5]
    testo: |
      Bastiano Rell sta seduto sul ceppo della legnaia con i polsi legati e
      gli occhiali storti, che non può raddrizzarsi da solo. Ha le dita grigie
      di polvere di cristallo e guarda con molta attenzione l'accetta piantata
      accanto a lui. Il quaderno dell'ascolto lo tieni sotto il braccio.

      «Mi pagavano a settimana» dice. «I nomi li volevano loro, io volevo
      soltanto che i creditori smettessero di bussare.» Si tira su gli
      occhiali con la spalla, e gli ricadono subito. «Sono il miglior
      accordatore della Città Bassa, ed è una cosa vera.»

      {empatia Media} La paura gli fa dire la verità a pezzi, prima quella che
      gli conviene.
    opzioni:
      - testo: "Consegnarlo a Nerissa"
        descrizione: "È casa sua, e tocca a lei decidere."
        costo: 0
        esito:
          titolo: La signora
          testo: |
            Nerissa scende con la candela, si siede di fronte a Bastiano su una
            cassetta di mele e ti chiede di uscire. Quando ti richiama lui ha i
            polsi liberi e beve un tè, e trema meno. Di quello che si sono detti
            non saprai niente, e la mattina è sparito per una strada che nessuno
            ti spiega.
          imposta: { maison.scrivano: 1 }
          effetti: { rep.maison: 0.5 }
      - testo: "Consegnarlo alla Caserma"
        descrizione: "Ha ascoltato per anni una casa per conto di chi la ricattava, ed è roba da sceriffo."
        quando: [galdrick.via == 0]
        costo: 0
        esito:
          titolo: Per servizio
          testo: |
            Lo porti alla Caserma all'alba con le mani legate sotto il mantello.
            Lo sceriffo lo riceve di persona e non ti chiede dove l'hai trovato, e
            quando esci ha già una matita fra i denti.
          imposta: { maison.scrivano: 2 }
          effetti: { rep.caserma: 0.5 }
      - testo: "Consegnarlo alla Caserma"
        descrizione: "Lo sceriffo è a Ghoran, ma il sergente della ronda di notte sa che cosa farne."
        quando: [galdrick.via == 1]
        costo: 0
        esito:
          titolo: Il sergente
          testo: |
            All'alba, alla Caserma, il sergente Livio Mastrel ti offre un pezzo di
            liquirizia e scrive il nome di Bastiano sul registro con una
            calligrafia lenta. Lo sceriffo, al ritorno, vorrà sapere chi l'ha
            portato.
          imposta: { maison.scrivano: 2 }
          effetti: { rep.caserma: 0.5 }
      - testo: "Lasciarlo andare"
        descrizione: "Senza il gemello e senza il quaderno non vale più niente per nessuno."
        costo: 0
        esito:
          titolo: La porta sul cortile
          testo: |
            Gli tagli la corda con l'accetta, e lui si massaggia i polsi a lungo
            senza alzarsi. Poi sparisce dalla porta sul cortile, e Kanat ti guarda
            senza sapere bene da che parte stare.
          imposta: { maison.scrivano: 3 }
      - testo: "Fargli lavorare per te"
        descrizione: "Ha bisogno di soldi e di protezione, e tu di uno che sappia leggere un cristallo."
        prova: { attributo: sociale, abilita: [persuasione, conoscenze-della-strada], difficolta: Media }
        successo:
          titolo: Un accordatore in tasca
          testo: |
            Gli raddrizzi gli occhiali e gli spieghi che cosa vuoi. Lui ti chiede
            se pagherai a settimana, e quando dici di sì scrive il tuo nome sul
            suo quaderno di conti, con una grafia minuta. Nerissa ha sentito tutto
            dalla porta della cucina, e tace.
          imposta: { maison.scrivano: 4 }
          effetti: { monete: -5, rep.maison: -0.5 }
        fallimento:
          titolo: Uno che non si fida
          testo: |
            Bastiano ride piano, come uno che proposte così le ha già sentite dai
            creditori, e rifiuta. Kanat lo prende per il colletto e lo porta da
            Nerissa.
          imposta: { maison.scrivano: 1 }
          effetti: { scandalo: 0.5 }

  # ------------------------------------------------------------ passo 9 · il quaderno dello scrivano (terzo grado)
  - id: maison-il-quaderno-dello-scrivano
    presso: via-dei-rasoi
    immagine: personaggi/nerissa-dalvane
    titolo: Il quaderno dello scrivano
    sommario: "Per la prima volta da quando esiste la Maison c'è una lista scritta di chi la frequenta."
    luogo: Maison des Lunes, la cucina
    area: citta-bassa
    requisiti: [fazione.maison == 8, maison.scrivano != 5]
    testo: |
      In cucina la stufa è accesa, e il quaderno di Bastiano sta in mezzo al
      tavolo accanto alla tazza col manico incollato di Gretchen. È un
      quaderno di scuola con la copertina blu, pieno fino all'ultima pagina
      di nomi e date, fra cui il cugino della Rappresentante, un uomo della
      Gilda con il panciotto e un chierico del Velo. Sara, sullo sgabello, lo
      guarda come un'arma lasciata sul bancone.

      Nerissa entra per ultima e chiude la porta. Alza due dita verso la
      lampada sopra il tavolo senza toccarla, e la lampada si accende da
      sola, della luce color miele che c'è in tutte le stanze della Maison da
      quando ci hai messo piede.

      {magia Facile} Le lampade della Maison non le ha mai accese uno
      stoppino. Tutto il Mana caldo di questa casa viene da lei, che lo tiene
      acceso da anni con una pazienza che a Torvessa non insegnano.

      {origine allievo-di-torvessa} All'Accademia ti hanno insegnato che chi
      accende una lampada senza formula è uno stregone, e che di stregoni in
      città ce ne sono pochi e si fanno vedere ancora meno.

      «Per la prima volta in questa casa esiste una lista scritta» dice
      Nerissa. «Io non la apro. Tu l'hai trovata, e tu mi dici che cosa ne
      facciamo.»
    opzioni:
      - testo: "Bruciarlo pagina per pagina, come Sara"
        descrizione: "Una pagina alla volta nella stufa, finché di quei nomi resta la cenere."
        esito:
          titolo: La stufa
          testo: |
            Bruci il quaderno pagina per pagina senza leggerlo, con Sara accanto.
            Poi Nerissa prende dalla scatola del tè buono un cristallo spezzato in
            due, ogni metà in una gabbietta d'ottone, e te ne posa una nel palmo.
            Una casa come la sua la gente la ascolta comunque, e tanto vale che
            sia qualcuno che lei conosce. Ti dà anche la chiave della porta di
            servizio, per entrare quando vuoi.
          pe: { magia: 5 }
          imposta: { maison.lista: 1, maison.cariche: 3 }
          effetti: { rep.maison: 1, oggetto.maison-cristallo-accoppiato: 1, oggetto.maison-chiave-della-porta-di-servizio: 1, fazione.maison: 1 }
          almeno: { rep.maison: 6 }
          segue: maison-la-luce-color-miele

      - testo: "Darlo a Nerissa"
        descrizione: "È casa sua, e la scatola del tè buono ha già tenuto un quaderno senza aprirlo."
        esito:
          titolo: La scatola di latta
          testo: |
            Nerissa chiude il quaderno senza aprirlo nella scatola del tè buono e
            ne tira fuori un cristallo spezzato in due, ogni metà in una gabbietta
            d'ottone. Te ne posa una nel palmo. Una casa come la sua la gente la
            ascolta comunque, e tanto vale che sia qualcuno che lei conosce. Ti dà
            anche la chiave della porta di servizio, per entrare quando vuoi.
          pe: { magia: 5 }
          imposta: { maison.lista: 2, maison.cariche: 3 }
          effetti: { oggetto.maison-cristallo-accoppiato: 1, oggetto.maison-chiave-della-porta-di-servizio: 1, fazione.maison: 1 }
          almeno: { rep.maison: 6 }
          segue: maison-la-luce-color-miele

      - testo: "Strapparne prima una pagina"
        descrizione: "La pagina con il nome che pesa di più, piegata in tasca prima di consegnare il resto."
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Media }
        successo:
          titolo: Una pagina in tasca
          testo: |
            Sfili lungo la cucitura la pagina dell'uomo della Gilda con il
            panciotto, tre date accanto a un nome che conosci. Nerissa chiude il
            quaderno nella scatola senza aprirlo e ti dà metà di un cristallo
            spezzato, in una gabbietta d'ottone, e la chiave della porta di
            servizio. Quando la prendi le sue dita si fermano un momento sulle
            tue, e capisci che lo sa.
          pe: { furtivita: 5 }
          imposta: { maison.lista: 3, maison.pagina: 1, maison.cariche: 3 }
          effetti: { rep.maison: -1, oggetto.maison-cristallo-accoppiato: 1, oggetto.maison-chiave-della-porta-di-servizio: 1, fazione.maison: 1 }
          almeno: { rep.maison: 6 }
          segue: maison-la-luce-color-miele
        fallimento:
          titolo: La cucitura
          testo: |
            La pagina si strappa con un rumore secco che nella cucina silenziosa
            suona come uno sparo, e Sara si volta. La lasci andare. Nerissa chiude
            il quaderno nella scatola di latta e ti dà lo stesso una metà di un
            cristallo spezzato e una chiave di ferro appesa a un nastro verde,
            senza guardarti in faccia.
          pe: { furtivita: 5 }
          imposta: { maison.lista: 2, maison.cariche: 3 }
          effetti: { rep.maison: -1, oggetto.maison-cristallo-accoppiato: 1, oggetto.maison-chiave-della-porta-di-servizio: 1, fazione.maison: 1, sospetto: 0.5 }
          almeno: { rep.maison: 6 }
          segue: maison-la-luce-color-miele

      - testo: "Venderlo al Mercato delle Ombre"
        descrizione: "Un quaderno così si paga quanto un anno di lavoro, ma alla Maison non si torna senza ammenda."
        requisiti: [contatto-ombra >= 1]
        esito:
          titolo: Il prezzo
          testo: |
            Prendi il quaderno sotto il braccio, e nessuno ti ferma; Gretchen
            chiude gli occhi. Al Mercato delle Ombre un uomo con i guanti di
            capretto lo sfoglia sotto la luce verdognola e ti conta sul banco una
            borsa che non ti basta una mano a tenere. In Via dei Rasoi Churl,
            sulla soglia, ti dice una parola sola, e Sara non ti guarda.
          imposta: { maison.lista: 4, maison.chiusa: 1 }
          effetti: { monete: 150, sospetto: 1.5, rep.maison: -3, fazione.maison: 1 }

  - id: maison-la-luce-color-miele
    immagine: personaggi/nerissa-dalvane
    titolo: La luce color miele
    tipo: seguito
    luogo: Maison des Lunes, la cucina
    area: citta-bassa
    requisiti: [fazione.maison == 9]
    testo: |
      Gretchen e Sara vanno a letto, e in cucina restate tu e Nerissa con la
      stufa che si spegne piano. Lei gira la tazza sul piattino di un quarto
      di giro e guarda la lampada, che da vicino trema appena.

      «Mia madre diceva che il Mana si sente come si sente il tempo che
      cambia» dice. «Io non l'ho mai studiato. L'ho tenuto acceso, come si
      tiene acceso un fuoco.» Poi ti offre di insegnarti qualcosa, un sussurro
      che fa paura e una voce che fa fare alle persone quello che volevano già
      fare. Le lezioni si pagano con quello che hai sentito in giro, mai con
      le monete.
    opzioni:
      - testo: "Chiederle perché non l'ha mai detto a nessuno"
        descrizione: "Una stregona in città si fa notare, a meno che non decida altrimenti."
        costo: 0
        esito:
          titolo: La luce delle lampade
          testo: |
            «Nessuno chiede chi accende le lampade» dice Nerissa, e sorride
            appena. «Una casa come la mia è già abbastanza strana. La gente si
            sente al sicuro quando non si chiede da dove viene la luce.»
          pe: { magia: 3 }
      - testo: "Ringraziarla e andare a dormire"
        descrizione: "Le lezioni possono aspettare, e il tavolino della signora resta lì."
        costo: 0
        esito:
          titolo: La porta di servizio
          testo: |
            Esci dalla porta di servizio e la richiudi con la tua chiave, per la
            prima volta. Alla finestra della cucina la luce color miele si abbassa
            piano, e poi si spegne.
          pe: { empatia: 3 }

  # ------------------------------------------------------------ passo 9 · l'ammenda (per chi ha venduto il quaderno)
  - id: maison-l-ammenda
    presso: via-dei-rasoi
    immagine: personaggi/sara-beck
    titolo: L'ammenda
    sommario: "In Via dei Rasoi la porta grande per te è chiusa, ma forse non quella di servizio."
    luogo: Maison des Lunes, la porta di servizio
    area: citta-bassa
    requisiti: [fazione.maison == 9, maison.chiusa == 1]
    testo: |
      Alla porta di servizio la lavagnetta di Sara ha i lavori della sera
      scritti a gesso, e il tuo nome non c'è più. Ti apre Gretchen in
      grembiule, con le mani bianche di farina, e resta sulla soglia.

      «La signora non ti vuole vedere» dice. «Io sì, ma io non conto. Hai
      venduto dei nomi che erano di questa casa. Se vuoi tornare, porti
      qualcosa che valga quanto un nome, e lavori sette sere senza paga,
      dalla porta di servizio, come il primo giorno.»

      {empatia Media} Le costa dirtelo, ed è l'unico modo che ha per
      lasciarti una porta aperta. Gretchen non ripete mai due volte
      un'offerta.
    opzioni:
      - testo: "Portare un segreto e lavorare sette sere"
        descrizione: "Un segreto che valga quanto un nome, e sette sere senza paga."
        requisiti: [informazioni.segreto >= 1]
        costo: 3
        esito:
          titolo: Sette sere
          testo: |
            Gretchen porta di sopra il segreto senza dirti niente, e per sette
            sere lavori gratis fra la porta e la cucina, senza che nessuno ti
            chiami per nome. L'ottava sera Sara ti mette in mano una chiave di
            ferro appesa a un nastro verde, quella della porta di servizio. La
            metà del cristallo, ti dice, resta alla signora.
          imposta: { maison.chiusa: 0 }
          effetti: { informazioni.segreto: -1, rep.maison: 1, oggetto.maison-chiave-della-porta-di-servizio: 1 }
      - testo: "Lavorare quattordici sere"
        descrizione: "Senza niente da portare, Gretchen ti offre il doppio delle sere e i lavori più pesanti."
        costo: 3
        esito:
          titolo: Quattordici sere
          testo: |
            Per quattordici sere spacchi legna e tieni la porta con Kanat sotto la
            pioggia, senza che nessuno ti paghi o ti chiami per nome. La
            quindicesima Sara ti mette in mano una chiave di ferro appesa a un
            nastro verde, quella della porta di servizio. La metà del cristallo,
            ti dice, resta alla signora.
          imposta: { maison.chiusa: 0 }
          effetti: { ferite: 1, rep.maison: 0.5, oggetto.maison-chiave-della-porta-di-servizio: 1 }

  # ------------------------------------------------------------ passo 10 · la proposta, variante A (prima di Pelle 5)
  - id: maison-la-proposta-del-decoro
    presso: via-dei-rasoi
    immagine: personaggi/ottone-malgrani
    titolo: La proposta
    sommario: "Un cliente ha dimenticato in salone la bozza di una proposta per il Consiglio che parla di Via dei Rasoi."
    luogo: Maison des Lunes, il salone
    area: citta-bassa
    requisiti: [fazione.maison == 9, maison.chiusa == 0, pista.pelle < 5]
    testo: |
      Nerissa ti aspetta in salone con un foglio accanto alla teiera, lasciato
      sotto un cuscino da un segretario del Municipio. È una proposta per il
      Consiglio che obbliga le case di Via dei Rasoi a tenere un registro con il
      nome e la data dei frequentatori, da mostrare a richiesta della Guardia, per
      il decoro della città.

      La firmano Ottone Malgrani e Ruggero Annibaldi, del consiglio interno della
      Gilda. «Per vent'anni non ho mai scritto un nome» dice Nerissa senza toccare
      il foglio. «Adesso vogliono che li scriva io, per chiunque abbia una divisa.
      Il Consiglio vota fra poco più di un mese, e voglio sapere chi è con loro.»

      {politica-ed-economia Media} Ottone vuole chiudere la Maison da anni, e ci
      prova con la legge perché i suoi amici ci vengono. Un registro da mostrare
      alla Guardia è un registro da mostrare a chi paga la Guardia.
    opzioni:
      - testo: "Contare i voti nell'anticamera del Municipio"
        descrizione: "Nelle udienze del mattino i consiglieri si fermano a parlare, e chi ascolta le panche conta i voti."
        prova: { attributo: mentale, abilita: [politica-ed-economia, percezione], difficolta: Media }
        successo:
          titolo: Le panche
          testo: |
            Passi tre mattine sulle panche dell'anticamera con una supplica falsa
            in mano, contando i consiglieri che si fermano a parlare sulle scale.
            Con Ottone ci sono i suoi, e due sono incerti, perché la Maison serve
            anche a loro.
          pe: { politica-ed-economia: 5 }
          imposta: { maison.voti: 2 }
          effetti: { rep.maison: 1, informazioni.pettegolezzo: 1, rep.malgrani: -1, fazione.maison: 1 }
        fallimento:
          titolo: La supplica falsa
          testo: |
            Il tuo vicino di panca è un impiegato di Ottone, che ti chiede della
            tua supplica, e glielo spieghi male. Per tre mattine i consiglieri ti
            passano davanti senza fermarsi.
          imposta: { maison.voti: 1 }
          effetti: { rep.maison: 0.5, rep.malgrani: -1, fazione.maison: 1, scandalo: 0.5 }

      - testo: "Farti mostrare la bozza originale da Tullio Merga"
        descrizione: "Il primo impiegato del Municipio ha l'originale con le firme e le correzioni, e va chiesto con garbo."
        prova: { attributo: sociale, abilita: [galateo, persuasione], difficolta: Media }
        successo:
          titolo: Il cassetto di Merga
          testo: |
            Tullio Merga ti riceve con il tovagliolo infilato nel colletto, e dopo
            un quarto d'ora di cortesie apre il cassetto. A margine dell'originale
            c'è scritto che il registro andrà consegnato ogni mese al Municipio.
          pe: { galateo: 5 }
          imposta: { maison.voti: 2 }
          effetti: { rep.maison: 1, informazioni.pettegolezzo: 1, rep.malgrani: -1, fazione.maison: 1 }
        fallimento:
          titolo: Il tovagliolo
          testo: |
            Tullio Merga ti spiega con grande gentilezza che le bozze del
            Consiglio non si mostrano ai privati, e mentre esci apre il registro
            delle visite e ci scrive qualcosa.
          imposta: { maison.voti: 1 }
          effetti: { rep.maison: 0.5, rep.malgrani: -1, fazione.maison: 1, sospetto: 0.5 }

      - testo: "Parlare con Varn Kett alla Casa dei Nodi"
        descrizione: "L'ispettore dei dazi della Gilda non dimentica una riga, e quei nomi non vuole leggerli."
        prova: { attributo: sociale, abilita: [empatia, persuasione], difficolta: Media }
        successo:
          titolo: La pergamena invisibile
          testo: |
            Sotto i portici della Casa dei Nodi Varn Kett ti ascolta muovendo le
            dita su una pergamena invisibile. «Un registro di nomi fa più danni di
            un incendio» dice. «Annibaldi questo non lo sa, perché non ha mai
            visto bruciare niente di suo.» In Gilda dirà la sua.
          pe: { empatia: 5 }
          imposta: { maison.voti: 2, maison.varn: 1 }
          effetti: { rep.maison: 1, informazioni.pettegolezzo: 1, rep.malgrani: -1, fazione.maison: 1 }
        fallimento:
          titolo: Gli stivali da pioggia
          testo: |
            Varn Kett ti ascolta con le dita ferme e ti dice che la Gilda ha già
            tanti problemi suoi, e che un registro in più lui lo legge senza
            fatica.
          imposta: { maison.voti: 1 }
          effetti: { rep.maison: 0.5, rep.malgrani: -1, fazione.maison: 1, scandalo: 0.5 }

      - testo: "Leggere la bozza come un contratto"
        descrizione: "Ai banchi dei Ponti conta la clausola che nessuno legge, e questa ce l'ha in fondo."
        quando: [origine.mercante-dei-ponti >= 1]
        esito:
          titolo: La clausola piccola
          testo: |
            Leggi la bozza dal fondo, come i contratti dei fornitori, e trovi la
            clausola che cercavi, secondo cui il registro andrà consegnato ogni
            mese al Municipio, cioè a chiunque in Municipio voglia leggerlo. Fai
            il giro di tre consiglieri che conosci dai banchi, e due ti dicono che
            una cosa così non la voteranno.
          pe: { politica-ed-economia: 5 }
          imposta: { maison.voti: 2 }
          effetti: { rep.maison: 1, informazioni.pettegolezzo: 1, rep.malgrani: -1, fazione.maison: 1 }

