          titolo: Il tovagliolo
          testo: |
            Tullio Merga ti ascolta con il tovagliolo infilato nel colletto e
            ti spiega con grande gentilezza che le bozze del Consiglio non si
            mostrano ai privati. Esci dal Municipio con niente in mano, e alle
            tue spalle Merga apre il registro delle visite e ci scrive qualcosa.
          imposta: { maison.voti: 1 }
          effetti: { rep.maison: 0.5, rep.gilda: -0.5, fazione.maison: 1, sospetto: 0.5 }

      - testo: "Parlare con Varn Kett alla Casa dei Nodi"
        descrizione: "Quei nomi dovrebbe leggerli lui. L'ispettore dei dazi ascolta tutti, e non ha nessuna voglia di quel registro."
        prova: { attributo: sociale, abilita: [empatia, persuasione], difficolta: Media }
        successo:
          titolo: La pergamena invisibile
          testo: |
            Trovi Varn Kett sotto i portici della Casa dei Nodi, con il
            cappotto color tabacco e gli stivali da pioggia. Gli racconti della
            proposta, e lui muove le dita su una pergamena invisibile mentre
            ascolti. «Vent'anni in milizia mi hanno insegnato che un registro di
            nomi fa più danni di un incendio» dice. «Io quei nomi non li voglio
            leggere, e se me li danno li leggerò male.» Ti promette che in
            Gilda dirà la sua.
          pe: { empatia: 5 }
          imposta: { maison.voti: 2, maison.varn: 1 }
          effetti: { rep.maison: 1, informazioni.pettegolezzo: 1, rep.gilda: -0.5, fazione.maison: 1 }
        fallimento:
          titolo: Gli stivali da pioggia
          testo: |
            Varn Kett ti ascolta sotto i portici con le dita ferme. Poi ti dice
            che con le casse vuote qualcuno deve pur riempirle, e che lui
            fa l'ispettore e legge quello che gli danno da leggere. Lo guardi
            allontanarsi con gli stivali che scricchiolano sul selciato.
          imposta: { maison.voti: 1 }
          effetti: { rep.maison: 0.5, rep.gilda: -0.5, fazione.maison: 1, scandalo: 0.5 }

      - testo: "Leggere la bozza come un contratto"
        descrizione: "Ai banchi dei Ponti ti hanno insegnato che in un contratto conta la clausola che nessuno legge. Questa ce l'ha in fondo, scritta piccola."
        quando: [origine.mercante-dei-ponti >= 1]
        esito:
          titolo: La clausola piccola
          testo: |
            Leggi la bozza dal fondo, come fai con i contratti dei fornitori, e
            la clausola che cercavi c'è. Il registro resterà alla Casa dei Nodi
            per dieci anni, cioè a disposizione della Gilda molto dopo che le
            casse saranno piene. Con quella riga in testa fai il giro di tre
            consiglieri che conosci dai banchi, e due ti dicono che una cosa
            così non la voteranno.
          pe: { politica-ed-economia: 5 }
          imposta: { maison.voti: 2 }
          effetti: { rep.maison: 1, informazioni.pettegolezzo: 1, rep.gilda: -0.5, fazione.maison: 1 }

  # ------------------------------------------------------------ passo 11 · l'invito a cena (ingresso della spedizione)
  - id: maison-l-invito-a-cena
    presso: via-dei-rasoi
    immagine: personaggi/marella-castaldi
    titolo: Un posto a tavola
    sommario: "Nei giorni di consiglio Marella Castaldi decide chi siede dove. Nerissa vuole che a quella tavola ci sia anche tu."
    luogo: Maison des Lunes, il salone
    area: citta-bassa
    requisiti: [fazione.maison == 10, pista.pelle != 5, pista.pelle != 6]
    testo: |
      Nerissa ha la teiera da una parte e un foglio dall'altra, e sul foglio
      ha disegnato a matita una tavola ovale con i posti segnati da un punto.
      Di nomi sul foglio non ce n'è nessuno. Ti spiega i punti uno per uno
      con la punta della matita, e i nomi li dice a voce, piano.

      «Marella Castaldi dà una cena la sera prima di ogni seduta» dice. «A
      quella tavola si parla di Stato e mai dei Castaldi, e tutti escono
      sapendo come voteranno gli altri. Ci saranno la Rappresentante e suo
      cugino, Annibaldi, il comandante della guardia e qualche consigliere.»
      Fa una pausa con la matita sospesa, poi ti dice che ci andrai come sua
      voce, perché lei a quella tavola non può sedersi.

      {galateo Media} Una cena di consiglio non è una cena. Ogni portata è un
      giro di voti, e ogni ospite è stato messo accanto a qualcuno per una
      ragione.

      {origine rampollo-dei-quartieri-alti} Le cene di Marella le conosci.
      Da ragazzo ti mettevano in fondo vicino ai cugini, e da lì hai
      imparato che chi siede in fondo sente tutto quello che dicono in testa.

      Senza invito, aggiunge, puoi entrare come accompagnatore di un suo
      cliente, che ci guadagna una sera di riguardo mentre tu ci perdi un
      po' di dignità.
    opzioni:
      - testo: "Andare con il tuo invito"
        descrizione: "Il biglietto con il sigillo dei Castaldi e una carrozza che ti lascia davanti al Maniero."
        requisiti: [invito >= 1]
        esito:
          titolo: La carrozza
          testo: |
            La carrozza ti lascia davanti al Maniero Castaldi, tre piani di
            pietra chiara senza un fregio di troppo, con le finestre del
            pianterreno tutte accese. Un valletto ti prende il mantello e
            l'invito con la stessa mano. Dalla porta della sala arriva il
            rumore delle posate disposte per la cena.
          imposta: { maison.imbarazzo: 0 }
          vai: maison-cena-al-maniero-castaldi
      - testo: "Andare come accompagnatore"
        descrizione: "Un cliente della Maison con un invito e nessuna compagnia. Tu sorridi e lui fa bella figura, mentre fingete di conoscervi da anni."
        esito:
          titolo: L'accompagnatore
          testo: |
            Il cliente è un vedovo del consiglio interno della Gilda con il
            panciotto stretto e un gran desiderio di non arrivare da solo. In
            carrozza ti racconta come vi siete conosciuti, perché tu lo sappia,
            e la storia cambia due volte prima del Maniero. Un valletto vi
            prende i mantelli, e a te guarda le scarpe.
          imposta: { maison.imbarazzo: 0 }
          effetti: { rep.maison: -0.5 }
          vai: maison-cena-al-maniero-castaldi
      - testo: "Aspettare la prossima seduta"
        descrizione: "Marella dà una cena prima di ogni seduta. Questa può aspettare."
        costo: 0
        esito:
          titolo: La matita
          testo: |
            Nerissa ripiega il foglio in quattro e lo infila nella teiera vuota,
            dove nessuno va a cercare. «Il voto non aspetta» dice, «ma le cene
            di Marella sì.»

  # ------------------------------------------------------------ passo 12 · il voto (quarto grado)
  - id: maison-il-voto
    presso: via-dei-rasoi
    immagine: personaggi/nerissa-dalvane
    titolo: La sera prima del voto
    sommario: "Domattina il Consiglio vota sul registro. Stasera in salone ci sono due tazze, una lista di voti che nessuno ha scritto e una matita corta."
    luogo: Maison des Lunes, il salone
    area: citta-bassa
    requisiti: [fazione.maison == 11, pista.pelle != 5, pista.pelle != 6]
    testo: |
      Il salone è chiuso, e le lampade sono abbassate al minimo. Nerissa
      siede nella poltrona di cuoio con la teiera sul tavolino e due tazze,
      e una delle due è ancora tiepida. Sul piattino c'è la matita corta con
      i segni dei denti. Avete contato i voti a voce, senza scriverli, sulle
      dita, come fanno le ragazze con i conti delle mance.

      {percezione Facile} La matita è stata posata da poco. Chi l'ha lasciata
      ci ha pensato su a lungo, a giudicare dai segni nuovi vicino alla punta.

      «Domattina si vota» dice Nerissa. «Lo sceriffo ha un voto in Consiglio,
      e stasera è passato per servizio.» Gira la tazza sul piattino di un
      quarto di giro. «Io non voglio che debba scegliere fra il suo lavoro e
      questa casa. Lui invece ha già scelto, e non mi ha chiesto niente.»

      {empatia Media} Ha paura per lui, non per sé. Un voto dello sceriffo
      contro il registro, in un Consiglio dove tutti sanno contare, è una
      cosa che la gente ricorderà, e qualcuno si chiederà perché.

      {origine accolito-del-velo} La Madre diceva che un segreto tenuto in
      due è una preghiera, e tenuto in tre è un pettegolezzo. In questo
      salone, stasera, siete in tre a saperlo.

      Nerissa ti guarda. «Dimmi quanti ne abbiamo.»
    opzioni:
      - testo: "La proposta l'ha ritirata Annibaldi"
        descrizione: "Alla cena di Marella gli hai mostrato una pagina con il suo nome. Domattina la proposta non arriverà nemmeno in aula."
        quando: [maison.annibaldi == 1]
        esito:
          titolo: Ritirata
          testo: |
            La mattina dopo, in Consiglio, Ruggero Annibaldi si alza per primo
            e ritira la proposta per ragioni di opportunità, con la voce di uno
            che legge un necrologio. Nessuno chiede quali. Lo sceriffo non deve
            aprire bocca. La sera, in salone, Nerissa ti appunta sul bavero una
            mezzaluna d'argento, dalla parte del cuore, e ti dice che da oggi
            nei salotti parli a nome suo.

            {resilienza Media} La pagina ce l'hai ancora in tasca. Pesa poco, ed
            è la cosa più pesante che hai addosso.
          pe: { persuasione: 10 }
          imposta: { maison.registro: 1, maison.favori: 3 }
          effetti: { rep.maison: 1, monete: 100, oggetto.maison-spilla-della-mezzaluna: 1, fazione.maison: 1 }
          almeno: { rep.maison: 8 }
          segue: maison-voce-del-salotto

      - testo: "Ne abbiamo abbastanza"
        descrizione: "Quattro voti contro, forse cinque. La proposta cade senza che lo sceriffo debba aprire bocca."
        quando: [maison.annibaldi == 0, maison.voti >= 4]
        esito:
          titolo: Cade da sola
          testo: |
            La mattina dopo la proposta arriva in aula, la leggono ad alta voce e
            cade alla prima conta. Lo sceriffo resta seduto con le braccia conserte e non
            alza la mano né in un senso né nell'altro, perché non serve. Gretchen
            lo dice a tutta la cucina, e la cucina applaude. La sera, in salone,
            Nerissa ti appunta sul bavero una mezzaluna d'argento, dalla parte
            del cuore, e ti dice che da oggi nei salotti parli a nome suo.
          pe: { persuasione: 10 }
          imposta: { maison.registro: 1, maison.favori: 3 }
          effetti: { rep.maison: 1, monete: 100, oggetto.maison-spilla-della-mezzaluna: 1, fazione.maison: 1 }
          almeno: { rep.maison: 8 }
          segue: maison-voce-del-salotto

      - testo: "Lasciare che lo sceriffo voti"
        descrizione: "Ne manca uno. Il voto di Galdrick c'è già, e lui l'ha deciso da solo."
        quando: [maison.annibaldi == 0, maison.voti == 3, galdrick.via == 0]
        esito:
          titolo: Il voto dello sceriffo
          testo: |
            La mattina dopo la proposta arriva in aula e la conta si ferma a un
            voto dalla fine. Galdrick alza la mano contro, l'ultimo, con la
            faccia di uno che vota sulla manutenzione delle grondaie, e dice a
            verbale che un registro di nomi in mano alla Guardia è un registro
            in mano a chi corrompe la Guardia. In aula nessuno lo trova strano.
            La sera, in salone, Nerissa ti appunta sul bavero una mezzaluna
            d'argento e ti dice che da oggi nei salotti parli a nome suo. La
            seconda tazza, stasera, resta vuota.
          pe: { persuasione: 10 }
          imposta: { maison.registro: 2, maison.favori: 3 }
          effetti: { rep.maison: 1, rep.caserma: 1, monete: 100, oggetto.maison-spilla-della-mezzaluna: 1, fazione.maison: 1 }
          almeno: { rep.maison: 8 }
          segue: maison-voce-del-salotto

      - testo: "Comprare l'ultimo voto con un segreto"
        descrizione: "Un consigliere incerto, una cosa che sai di lui e una visita prima dell'alba. Lo sceriffo così non dovrà alzare la mano."
        quando: [maison.annibaldi == 0, maison.voti == 3]
        requisiti: [informazioni.segreto >= 1]
        esito:
          titolo: Prima dell'alba
          testo: |
            Bussi alla porta di un consigliere prima dell'alba e gli dici, con
            molto garbo, una cosa che sai di lui. Lui ti offre un caffè che non
            bevete. La mattina dopo vota contro, e la proposta cade per un voto.
            Galdrick non deve alzare la mano. La sera, in salone, Nerissa ti
            appunta sul bavero una mezzaluna d'argento, dalla parte del cuore, e
            ti dice che da oggi nei salotti parli a nome suo.

            {empatia Media} Le dita le restano un momento sul bavero, più del
            necessario. Ti sta ringraziando per una cosa che non si può dire.
          pe: { persuasione: 10 }
          imposta: { maison.registro: 1, maison.favori: 3 }
          effetti: { informazioni.segreto: -1, rep.maison: 1, monete: 100, oggetto.maison-spilla-della-mezzaluna: 1, fazione.maison: 1 }
          almeno: { rep.maison: 8 }
          segue: maison-voce-del-salotto

      - testo: "Riempire il registro di nomi inventati"
        descrizione: "Se la proposta passa, un registro si può sempre riempire di gente che non esiste. Basta farlo bene alla prima ispezione."
        quando: [maison.annibaldi == 0, maison.voti <= 3, maison.varn == 0]
        prova: { attributo: sociale, abilita: [ingannare, espressivita], difficolta: Difficile }
        successo:
          titolo: Il signor Pace, tre volte a settimana
          testo: |
            La proposta passa, e Nerissa compra un registro rilegato in tela.
            Lo riempite insieme in una notte, con le grafie di tutte le ragazze,
            di gente che non esiste. Il signor Bertoldo Pace ci viene tre volte a
            settimana. Alla prima ispezione l'uomo della Gilda sfoglia il
            registro per un'ora e alla fine mette la sua firma in fondo alla
            pagina. La sera, in salone, Nerissa ti
            appunta sul bavero una mezzaluna d'argento e ti dice che da oggi nei
            salotti parli a nome suo.
          pe: { ingannare: 10 }
          imposta: { maison.registro: 3, maison.favori: 3 }
          effetti: { rep.maison: 1, monete: 100, oggetto.maison-spilla-della-mezzaluna: 1, fazione.maison: 1 }
          almeno: { rep.maison: 8 }
          segue: maison-voce-del-salotto
        fallimento:
          titolo: La stessa grafia
          testo: |
            La proposta passa, e il registro lo riempite in una notte di nomi
            inventati. Alla prima ispezione l'uomo della Gilda si accorge che
            dieci clienti diversi fanno la erre allo stesso modo, e lo annota a
            margine. Nerissa paga l'ammenda e cambia la carta, e per un mese in
            salone si parla soltanto del tempo. Ti appunta lo stesso sul bavero
            una mezzaluna d'argento, e ti dice che da oggi nei salotti parli a
            nome suo, a voce più bassa.
          pe: { ingannare: 10 }
          imposta: { maison.registro: 3, maison.favori: 2 }
          effetti: { scandalo: 1.5, rep.maison: -1, monete: 50, oggetto.maison-spilla-della-mezzaluna: 1, fazione.maison: 1 }
          almeno: { rep.maison: 8 }
          segue: maison-voce-del-salotto

      - testo: "Riempire il registro e farlo leggere a Varn"
        descrizione: "Se la proposta passa, l'ispettore è dalla tua parte. Leggerà quello che gli date da leggere, e lo leggerà male."
        quando: [maison.annibaldi == 0, maison.voti <= 3, maison.varn == 1]
        esito:
          titolo: Letto male
          testo: |
            La proposta passa, e Nerissa compra un registro rilegato in tela.
            Lo riempite in una notte di gente che non esiste, e il signor
            Bertoldo Pace ci viene tre volte a settimana. Alla prima ispezione
            Varn Kett sfoglia il registro sotto i portici, muove le dita su una
            pergamena invisibile e lo dichiara in ordine. La sera, in salone,
            Nerissa ti appunta sul bavero una mezzaluna d'argento e ti dice che
            da oggi nei salotti parli a nome suo.
          pe: { ingannare: 10 }
          imposta: { maison.registro: 3, maison.favori: 3 }
          effetti: { rep.maison: 1, monete: 100, oggetto.maison-spilla-della-mezzaluna: 1, fazione.maison: 1 }
          almeno: { rep.maison: 8 }
          segue: maison-voce-del-salotto

  - id: maison-voce-del-salotto
    immagine: personaggi/nerissa-dalvane
    titolo: Voce del salotto
    tipo: seguito
    luogo: Maison des Lunes, il salone
    area: citta-bassa
    requisiti: [fazione.maison == 12]
    testo: |
      Più tardi, a casa chiusa, Nerissa ti fa sedere nella poltrona di fronte
      alla sua e ti versa il tè della scatola di latta. La mezzaluna d'argento
      ti pesa sul bavero come una medaglia. Dal fondo del salone Churl
      tossisce una volta sola, e Sara, sulla soglia, ti chiama per nome con
      il tono che usa per i clienti di vent'anni.

      «Tre volte puoi chiedermi una cosa che non si compra» dice Nerissa, e
      ti spiega che può essere una porta dei Quartieri Alti o un nome che
      smette di girare per la città. Basta chiederlo al suo tavolino. Beve
      un sorso, e aggiunge che da stasera la Luna Nuova non la paghi più.

      {galateo Media} Un favore della signora vale più di una borsa, perché
      chi lo riceve non sa nemmeno che c'è stato. Nei Quartieri Alti si fa
      così, ma qui lo fanno meglio.
    opzioni:
      - testo: "Bere il tè"
        descrizione: "Stasera non c'è niente da decidere."
        costo: 0
        esito:
          titolo: Il tè della scatola di latta
          testo: |
            Bevete il tè in silenzio, finché la teiera è vuota, e per la prima
            volta da quando vieni in questa casa il silenzio non ti sembra un
            esame. Quando esci la lanterna sopra la porta è accesa, e la catena
            di bronzo oscilla appena nel vento di Via dei Rasoi.
          pe: { galateo: 3 }
