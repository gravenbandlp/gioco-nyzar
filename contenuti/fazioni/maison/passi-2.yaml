# La quest della Maison des Lunes, passi 7-12.
# - Passo 7, la lampada della Luna Calante: il cristallo accoppiato nella lampada (maison.cristallo 1 tolto, e chi
#   ascolta si mette in allarme; 2 recita di Laure e Kasja, Facile con maison.pace; 3 il filo del Mana, o Ambrin).
# - Passo 8, la legnaia: si scende nella spedizione `maison-sotto-il-cristallo-spento` (spedizione-cristallo.yaml).
#   Il cuore porta maison.scrivano a 5 (preso) o a 3 (scappato); `maison-lo-scrivano-legato` decide dove va Bastiano Rell
#   (1 Nerissa, 2 la Caserma, 3 lasciato andare, 4 lavora per te). Il passo 9 aspetta quella scelta.
# - Passo 9, il quaderno dello scrivano (terzo grado, Di cucina): Nerissa accende la lampada con due dita e si
#   rivela stregona. maison.lista 1 bruciato, 2 a Nerissa, 3 con una pagina strappata (maison.pagina), 4 venduto al
#   Mercato delle Ombre: allora la porta si chiude (maison.chiusa) e il cristallo non arriva; `maison-l-ammenda`
#   riapre la porta con la chiave della porta di servizio. Seguito: la luce color miele.
# - Passo 10, la proposta, in due varianti: A con pista.pelle < 5 (Ottone Malgrani e Annibaldi chiedono il registro
#   per decoro; rep.malgrani −1) e B con pista.pelle >= 7 (Annibaldi propone una tassa sulle visite, letta da Varn
#   Kett; rep.gilda −½). Dà maison.voti 1 o 2 e, parlando con Varn, maison.varn.
# - Passo 11, la cena di Marella: l'ingresso porta nella spedizione sociale `maison-cena-al-maniero-castaldi`
#   (spedizione-cena.yaml). Con pista.pelle 5 o 6 i passi 10-12 restano chiusi.
# - Passo 12, il voto (quarto grado, Voce del salotto): la sera prima del Consiglio, in salone. Con maison.voti >= 4 la
#   proposta cade da sola; con 3 lo sceriffo vota, o si spende un segreto; con 2 o meno passa e Nerissa riempie il
#   registro di nomi inventati (prima ispezione Ingannare Difficile, facile con Varn alleato). maison.annibaldi 1: la
#   proposta è già ritirata. maison.registro 1 respinto, 2 respinto con il voto dello sceriffo, 3 passato e beffato.
storylet:
  # ------------------------------------------------------------ passo 7 · la lampada della Luna Calante
  - id: maison-la-lampada-della-luna-calante
    presso: via-dei-rasoi
    immagine: ambientazione/maison-des-lunes
    titolo: La lampada della Luna Calante
    sommario: "A casa chiusa, a notte fonda, Nerissa ti aspetta in fondo al corridoio del primo piano, davanti allo specchio girato verso il muro."
    luogo: Maison des Lunes, il primo piano, di notte
    area: citta-bassa
    requisiti: [fazione.maison == 6]
    testo: |
      La Maison chiusa, di notte, ha l'odore della cera spenta e dei
      tappeti battuti in cortile, e i passi sulla scala curva fanno il doppio del
      rumore. In fondo al corridoio del primo piano ti aspettano in quattro.
      Nerissa ha uno scialle grigio sulle spalle e una candela in mano, e la
      tiene bassa per non svegliare chi dorme. Accanto a lei ci sono Laure,
      con un libro chiuso contro il petto, e Kasja con la medaglia d'oro sopra
      la camicia da notte. Irmelin sta davanti allo specchio a mezzaluna
      girato verso il muro, quello che nessuno ha mai raddrizzato.

      «L'ho girato io» dice Irmelin, senza che nessuno glielo chieda. «La
      lampada della Luna Calante ci si rifletteva dentro, e mi guardava.»

      {magia Media} Accanto alla porta della Luna Calante c'è una lampada a
      muro con lo schermo di vetro fumé. Il Mana della casa è caldo e color
      miele dappertutto, e lì dentro si piega e corre via sottile, come
      l'acqua quando trova una crepa.

      Nerissa ti porge la candela. «Quella del salone l'abbiamo già staccata» dice.
      «Questa è la sorella, e da qualche parte ce n'è una terza che ascolta
      tutte e due. Voglio sapere dove.»

      {resistenza Facile fallita} Sono le tre passate, e il corpo te lo fa
      sapere con uno sbadiglio che ti scricchiola nella mascella proprio
      mentre la signora ti guarda.

      Dentro lo schermo c'è una scheggia di cristallo grande come un pollice,
      incastrata fra lo stoppino e il riflettore, più chiara di quella del
      salone.
      *Tutto quello che si è detto in questa stanza è passato da lì.* Laure si
      stringe il libro al petto un poco di più.
    opzioni:
      - testo: "Toglierlo"
        descrizione: "Lo stacchi e lo chiudi in un fazzoletto. Chi ascolta dall'altra parte sentirà soltanto il silenzio, e capirà."
        esito:
          titolo: Il fazzoletto
          testo: |
            Stacchi la scheggia dal riflettore con due dita e la avvolgi nel
            fazzoletto, e per un momento ti pare di sentirla vibrare contro il
            palmo, come una mosca chiusa in un pugno. Nerissa annuisce. «Adesso
            chi ascoltava sa che ce ne siamo accorti» dice, «e domani avrà più
            uomini sulla porta.» Kasja si offre di tenere il fazzoletto in
            cucina, sotto il mestolo di ferro. Più tardi, rimettendo a posto lo
            specchio, Irmelin ti dice dove porta il filo, perché lo ha sentito
            andar via dalla lampada mentre la toglievi.

            {tecnologia Media} Il cristallo è tagliato a scalpello lungo il
            piano di sfaldatura, con una cura da laboratorio. Chi l'ha messo lì
            ha studiato, e da qualche parte c'è la sua metà gemella.
          pe: { tecnologia: 5 }
          imposta: { maison.cristallo: 1 }
          effetti: { rep.maison: 1, fazione.maison: 1 }

      - testo: "Dargli da mangiare una conversazione falsa"
        descrizione: "Laure e Kasja possono recitare davanti alla lampada una sera qualunque, piena di clienti che non esistono. Chi ascolta crederà di sentire la casa."
        quando: [maison.pace == 0]
        prova: { attributo: sociale, abilita: [espressivita, ingannare], difficolta: Media }
        successo:
          titolo: La sera che non c'è stata
          testo: |
            Scrivete la sera insieme in cucina su un foglio che poi bruciate
            nella stufa, e la recitano Laure e Kasja davanti alla lampada, con le
            voci basse del lavoro. Un mercante di cordame che si lamenta della moglie, un
            ragazzo alla prima visita che chiede dove si mettono gli stivali.
            Kasja improvvisa una risata così vera che Nerissa si volta a
            guardarla. Dietro la parete della Luna Calante, in fondo alla
            condotta, qualcuno sta scrivendo tutto con cura.
          pe: { espressivita: 5 }
          imposta: { maison.cristallo: 2 }
          effetti: { rep.maison: 1, fazione.maison: 1 }
        fallimento:
          titolo: La risata sbagliata
          testo: |
            La recita parte bene, poi Laure dimentica il nome del cliente che
            avevate inventato e ne dice un altro. Kasja copre l'errore con una
            risata troppo alta, e dalla lampada, per un momento, arriva un
            ronzio che prima non c'era. Nerissa spegne la candela con le dita e
            dice piano che chi ascoltava ha capito, e che domani avrà più uomini
            sulla porta.
          imposta: { maison.cristallo: 1 }
          effetti: { rep.maison: 0.5, fazione.maison: 1, scandalo: 0.5 }

      - testo: "Far tornare a trovarle il signor Pace"
        descrizione: "Il mercante di bottoni con il garofano, inventato in salone davanti alla signora. Una sera con lui la sanno già recitare tutte."
        quando: [maison.pace == 1]
        prova: { attributo: sociale, abilita: [espressivita, ingannare], difficolta: Facile }
        successo:
          titolo: Il signor Pace torna
          testo: |
            Laure e Kasja si ricordano del signor Pace meglio di te, e Kasja gli
            ha già dato una voce, nasale, con la erre arrotata. Lo recitano
            davanti alla lampada per mezz'ora, i bottoni di corno e il garofano
            che perde petali sul tappeto, finché Nerissa deve mettersi una mano
            sulla bocca per non ridere. Dietro la parete, in fondo alla
            condotta, qualcuno scrive il nome di Bertoldo Pace in un quaderno,
            con cura.
          pe: { espressivita: 5 }
          imposta: { maison.cristallo: 2 }
          effetti: { rep.maison: 1, fazione.maison: 1 }
        fallimento:
          titolo: La risata sbagliata
          testo: |
            A metà della recita Kasja ride davvero, e non riesce più a
            smettere, con la faccia nel cuscino del divanetto. Dalla lampada
            arriva per un momento un ronzio che prima non c'era. Nerissa spegne
            la candela con le dita. «Ha capito» dice piano, ma sorride anche
            lei. «Domani avrà più uomini sulla porta.»
          imposta: { maison.cristallo: 1 }
          effetti: { rep.maison: 0.5, fazione.maison: 1, scandalo: 0.5 }

      - testo: "Seguire il filo del Mana"
        descrizione: "Il Mana esce dalla lampada sottile come una lenza. Tenerci dietro con la testa, attraverso i muri, è un lavoro da maghi veri."
        prova: { attributo: mentale, abilita: magia, difficolta: Difficile }
        successo:
          titolo: La lenza
          testo: |
            Chiudi gli occhi e appoggi due dita sullo schermo di vetro, e il filo
            freddo ti tira come una lenza. Passa sotto il pavimento e scende
            lungo il muro della legnaia, poi corre sotto Via dei Rasoi, sempre
            più giù, finché lo senti arrivare in una stanza di pietra ai piedi
            del cristallo spento. Lì il filo si annoda a un altro cristallo e a
            un respiro umano, lento, di uno che scrive. Quando riapri gli occhi
            Nerissa ti sta guardando come si guarda un collega.
          pe: { magia: 5 }
          imposta: { maison.cristallo: 3 }
          effetti: { rep.maison: 1, fazione.maison: 1 }
        fallimento:
          titolo: Il filo che si spezza
          testo: |
            Il filo ti tira giù per un tratto, poi ti sfugge come una lenza
            tagliata, e il contraccolpo ti arriva dietro gli occhi. Ti ritrovi
            seduto sul tappeto del corridoio con il naso che sanguina e Laure
            che ti tiene un fazzoletto sotto il mento. Nerissa toglie lei la
            scheggia dalla lampada e la avvolge nello scialle. Dice che adesso chi
            ascoltava lo sa, e che domani avrà più uomini sulla porta.
          imposta: { maison.cristallo: 1 }
          effetti: { tormento: 1, rep.maison: 0.5, fazione.maison: 1 }

      - testo: "Portare la scheggia ad Ambrin Qell"
        descrizione: "Al Nodo d'Ossidiana Ambrin legge un cristallo come un notaio legge un contratto. Ma lo fa soltanto per chi conosce bene."
        requisiti: [rep.nodo >= 3]
        esito:
          titolo: Il notaio dei cristalli
          testo: |
            La mattina dopo posi la scheggia sul banco del Nodo d'Ossidiana,
            avvolta nel fazzoletto. Ambrin la guarda con una lente, poi la
            rigira con una pinzetta d'avorio. Il corvo sul bancone si sporge a
            guardare anche lui. «Taglio di Torvessa, accordata a mano da uno che
            sa il mestiere e ha bisogno di soldi» dice. «La sorella sta in basso,
            sotto la tua strada, dove passa l'acqua vecchia.» Te la restituisce e
            non ti chiede niente in cambio, che con Ambrin vuol dire che il conto
            arriverà più avanti.
          pe: { magia: 5 }
          imposta: { maison.cristallo: 3 }
          effetti: { rep.maison: 1, fazione.maison: 1 }

  # ------------------------------------------------------------ passo 8 · la legnaia (ingresso della spedizione)
  - id: maison-la-legnaia
    presso: via-dei-rasoi
    immagine: ambientazione/maison-des-lunes
    titolo: La legnaia
    sommario: "Dietro la cucina della Maison c'è una legnaia, e sotto la legnaia una botola che nessuno apre da anni. Il filo del cristallo scende di lì."
    luogo: Maison des Lunes, la legnaia
    area: citta-bassa
    requisiti: [fazione.maison == 7]
    testo: |
      La legnaia è uno stanzino dietro la cucina, con la legna da ardere
      impilata fino al soffitto e un ceppo per spaccarla, e sul ceppo
      un'accetta con il manico rifatto più volte. Kanat ha spostato mezza
      catasta per liberare il pavimento, e sotto c'è una botola di quercia
      con l'anello di ferro rosso di ruggine. Gretchen dice che dava sulla
      cantina dei vini, quando la casa era di un vinaio, e che dalla cantina
      si scende alla condotta dell'acqua vecchia, che sotto la Città Bassa
      non usa più nessuno.

      {conoscenze-della-strada Media} Una condotta che nessuno usa è una
      strada per chi non vuole farsi vedere. Se i ragazzi di Mauro salgono
      dalla Pignatta per un'altra via, è facile che sia questa.

      Gretchen ti dà una lanterna cieca e un pezzo di pane avvolto in un
      tovagliolo, come a un figlio che parte per la scuola. Nerissa è sulla
      porta della cucina con le braccia conserte. «Lo voglio vivo» dice, «e
      voglio il quaderno su cui scrive.»

      {origine figlio-della-citta-bassa} Delle condotte vecchie ti
      raccontavano da bambino, nei vicoli. Ci passavano i contrabbandieri
      prima degli Scuri, e chi ci si perdeva lo ritrovavano al Torvessa, se lo
      ritrovavano.

      {furtivita Media} Sotto la botola sale un'aria fresca che puzza
      di acqua ferma. Qualcuno ha unto i cardini da poco, e chi unge i cardini
      vuole passare senza farsi sentire.
    opzioni:
      - testo: "Scendere nella cantina"
        descrizione: "La lanterna cieca, il pane di Gretchen e una scala di legno che scende nel buio."
        esito:
          titolo: La botola
          testo: |
            Sollevi la botola con tutte e due le mani, e i cardini unti non
            fanno il minimo rumore. Kanat ti tiene la lanterna finché non hai
            messo i piedi sul primo piolo, poi te la passa. Sopra la tua testa
            la luce della cucina si restringe a un quadrato, e il quadrato a una
            riga. Gretchen la lascia socchiusa, perché tu sappia da che parte
            tornare.
          vai: maison-sotto-il-cristallo-spento
      - testo: "Aspettare un'altra notte"
        descrizione: "Quello che c'è là sotto aspetta, e la scala resta dov'è."
        costo: 0
        esito:
          titolo: La catasta
          testo: |
            Aiuti Kanat a rimettere la legna sopra la botola, un ceppo alla
            volta, e lui non ti chiede perché. Gretchen ti avvolge di nuovo il
            pane nel tovagliolo e te lo mette in tasca lo stesso.

  # ------------------------------------------------------------ passo 8 · dove va lo scrivano
  - id: maison-lo-scrivano-legato
    presso: via-dei-rasoi
    immagine: ambientazione/cristalli-conduttori
    titolo: Lo scrivano
    sommario: "Bastiano Rell è seduto sul ceppo della legnaia, con le mani legate e gli occhiali storti. Qualcuno deve decidere dove andrà stanotte."
    luogo: Maison des Lunes, la legnaia
    area: citta-bassa
    requisiti: [fazione.maison == 8, maison.scrivano == 5]
    testo: |
      Bastiano Rell sta seduto sul ceppo della legnaia con i polsi legati
      davanti e gli occhiali storti sul naso, che non può raddrizzarsi da
      solo. Ha le dita grigie di polvere di cristallo fino alle nocche e una
      macchia d'inchiostro sul polsino, e guarda l'accetta piantata accanto a
      lui con molta attenzione. Kanat è appoggiato allo stipite. Il quaderno
      dell'ascolto lo tieni sotto il braccio, e pesa più di quanto
      dovrebbe pesare un quaderno.

      «Mi pagavano a settimana» dice Bastiano. «I nomi li volevano loro, io
      volevo soltanto che i creditori smettessero di bussare.» Si tira su gli
      occhiali con la spalla, e gli ricadono subito. «Sono il miglior
      accordatore della Città Bassa. Non è una cosa che si dice di me, è una
      cosa vera.»

      {empatia Media} Ha paura, e la paura gli fa dire la verità a pezzi,
      quella che gli conviene per prima. Il resto arriverà se qualcuno gli dà
      il tempo.

      {politica-ed-economia Facile} Un uomo che sa accordare un cristallo
      gemello vale molto, a saperlo usare. Ed è pieno di debiti, che è il modo
      più sicuro per tenerlo.
    opzioni:
      - testo: "Consegnarlo a Nerissa"
        descrizione: "È casa sua. È lei che deve decidere che cosa farne."
        costo: 0
        esito:
          titolo: La signora
          testo: |
            Nerissa scende in legnaia con la candela e si siede di fronte a
            Bastiano su una cassetta di mele, con le mani in grembo. Ti chiede
            di uscire. Quando ti richiama, mezz'ora dopo, Bastiano ha i polsi
            liberi e beve un tè, e trema meno. Di quello che si sono detti non
            saprai mai niente, e la mattina lui è sparito per una strada che
            nessuno ti spiega.
          imposta: { maison.scrivano: 1 }
          effetti: { rep.maison: 0.5 }
      - testo: "Consegnarlo alla Caserma"
        descrizione: "Ha ascoltato per anni una casa della città per conto di chi la ricattava. È roba da sceriffo."
        quando: [galdrick.via == 0]
        costo: 0
        esito:
          titolo: Per servizio
          testo: |
            Lo porti alla Caserma all'alba, con le mani legate sotto il
            mantello perché in strada non si veda. Lo sceriffo lo riceve di
            persona, nell'ufficio con la mappa dei segnalini, e ti ringrazia
            con un cenno senza farti domande su dove l'hai trovato. Quando esci
            Galdrick ha già una matita in mano, e la morde.
          imposta: { maison.scrivano: 2 }
          effetti: { rep.caserma: 0.5 }
      - testo: "Consegnarlo alla Caserma"
        descrizione: "Lo sceriffo è a Ghoran, ma la Caserma lavora anche senza di lui. Il sergente della ronda di notte sa che cosa farne."
        quando: [galdrick.via == 1]
        costo: 0
        esito:
          titolo: Il sergente
          testo: |
            Lo porti alla Caserma all'alba, con le mani legate sotto il
            mantello. Lo prende in consegna il sergente Livio Mastrel, che ti
            offre un pezzo di liquirizia e scrive il nome di Bastiano su un
            registro con una calligrafia lenta e precisa. Ti dice che lo
            sceriffo, al ritorno, vorrà sapere chi l'ha portato.
          imposta: { maison.scrivano: 2 }
          effetti: { rep.caserma: 0.5 }
      - testo: "Lasciarlo andare"
        descrizione: "Senza il gemello e senza il quaderno non vale più niente per nessuno. Forse nemmeno per i suoi creditori."
        costo: 0
        esito:
          titolo: La porta sul cortile
          testo: |
            Gli tagli la corda con l'accetta, e lui si massaggia i polsi a
            lungo senza alzarsi, come se non sapesse che cosa farsene. Poi
            esce dalla porta sul cortile e sparisce verso Via del Salmone, e
            Kanat ti guarda con una faccia che non sa bene da che parte stare.
          imposta: { maison.scrivano: 3 }
      - testo: "Fargli lavorare per te"
        descrizione: "Ha bisogno di soldi e di qualcuno che lo protegga dai creditori. Tu hai bisogno di uno che sappia leggere un cristallo."
        prova: { attributo: sociale, abilita: [persuasione, conoscenze-della-strada], difficolta: Media }
        successo:
          titolo: Un accordatore in tasca
          testo: |
            Gli raddrizzi gli occhiali e gli spieghi che cosa vuoi. Lui ci pensa
            guardando l'accetta, poi ti chiede se pagherai a settimana. Gli
            rispondi di sì, e Bastiano scrive il tuo nome sul suo quaderno di
            conti, con una grafia minuta. Nerissa ha sentito tutto dalla porta
            della cucina, e tace.
          imposta: { maison.scrivano: 4 }
          effetti: { monete: -5, rep.maison: -0.5 }
        fallimento:
          titolo: Uno che non si fida
          testo: |
            Gli dici che cosa vuoi, e lui si mette a ridere, piano, con la
            risata di uno che i creditori li ha già sentiti fare proposte così.
            Rifiuta. Kanat lo prende per il colletto e lo porta da Nerissa, che
            lo aspetta in cucina con la candela.
          imposta: { maison.scrivano: 1 }
          effetti: { scandalo: 0.5 }

  # ------------------------------------------------------------ passo 9 · il quaderno dello scrivano (terzo grado)
  - id: maison-il-quaderno-dello-scrivano
    presso: via-dei-rasoi
    immagine: personaggi/nerissa-dalvane
    titolo: Il quaderno dello scrivano
    sommario: "Per la prima volta da quando esiste la Maison c'è una lista scritta di chi la frequenta. Nerissa non la apre."
    luogo: Maison des Lunes, la cucina
    area: citta-bassa
    requisiti: [fazione.maison == 8, maison.scrivano != 5]
    testo: |
      In cucina la stufa è accesa e il bollitore borbotta, e il quaderno di
      Bastiano sta in mezzo al tavolo, accanto alla tazza col manico
      incollato di Gretchen. È un quaderno di scuola con la copertina blu,
      pieno fino all'ultima pagina di una grafia minuta e ordinata. Dentro ci
      sono nomi e date. Il cugino della Rappresentante, un mugnaio che viene
      il giovedì, un uomo della Gilda con il panciotto, un chierico del Velo.
      Gretchen non lo guarda. Sara, sullo sgabello, lo guarda come si guarda
      un'arma lasciata sul bancone.

      {percezione Media} Le pagine sono pulite fino all'ultima riga. Bastiano
      scriveva con calma, e le date tornano tutte con le sere in cui la
      lampada della Luna Calante era accesa.

      Nerissa entra per ultima e chiude la porta. Fuori è buio, e la cucina
      ha soltanto la luce della stufa. Lei alza due dita verso la lampada
      sopra il tavolo senza toccarla, e la lampada si accende da sola, di
      quella luce color miele che c'è in tutte le stanze della Maison da
      quando ci hai messo piede. Si siede, senza commentare.

      {magia Facile} Le lampade della Maison non le ha mai accese uno
      stoppino. Tutto il Mana caldo che senti in questa casa viene da lei, e
      lo tiene acceso da anni con una pazienza che a Torvessa non insegnano.

      {origine allievo-di-torvessa} All'Accademia ti hanno insegnato che chi
      accende una lampada senza formula è uno stregone, e che di stregoni in
      città ce ne sono pochi e si fanno vedere ancora meno.

      «Per la prima volta in questa casa esiste una lista scritta» dice
      Nerissa. «Io non la apro. Tu l'hai trovata, e tu mi dici che cosa ne
      facciamo.»
    opzioni:
      - testo: "Bruciarlo pagina per pagina, come Sara"
        descrizione: "Una pagina alla volta nella stufa, finché di quei nomi resta soltanto la cenere."
        esito:
          titolo: La stufa
          testo: |
            Apri lo sportello della stufa e bruci il quaderno una pagina alla
            volta senza leggerle, e Sara viene a sedersi accanto a te a
            guardare il fuoco. Quando resta soltanto la copertina blu Nerissa
            si alza per aprire la scatola di latta del tè buono. Dentro, sopra le
            foglie, c'è un cristallo spezzato in due metà, chiuse ciascuna in una
            gabbietta d'ottone. Una la rimette nella scatola, l'altra la posa
            nel tuo palmo, insieme a una chiave di ferro appesa a un nastro
            verde. Ti dice che la gente ascolta comunque una casa come la sua, e
            tanto vale che lo faccia qualcuno che lei conosce. La chiave è
            quella della porta di servizio, e da stasera puoi entrare a
            qualunque ora.
          pe: { magia: 5 }
          imposta: { maison.lista: 1, maison.cariche: 3 }
          effetti: { rep.maison: 1, oggetto.maison-cristallo-accoppiato: 1, oggetto.maison-chiave-della-porta-di-servizio: 1, fazione.maison: 1 }
          almeno: { rep.maison: 6 }
          segue: maison-la-luce-color-miele

      - testo: "Darlo a Nerissa"
        descrizione: "È casa sua, e la scatola di latta del tè buono ha già tenuto un quaderno senza aprirlo."
        esito:
          titolo: La scatola di latta
          testo: |
            Spingi il quaderno verso di lei sul tavolo. Nerissa lo prende senza
            aprirlo, apre la scatola di latta del tè buono e ce lo chiude dentro,
            sopra le foglie. Poi tira fuori un cristallo spezzato in due metà,
            chiuse ciascuna in una gabbietta d'ottone. Una la rimette nella
            scatola, l'altra la posa nel tuo palmo, insieme a una chiave di ferro
            appesa a un nastro verde. Ti dice che la gente ascolta comunque una
            casa come la sua, e tanto vale che lo faccia qualcuno che lei
            conosce. La chiave è quella della porta di servizio, e da stasera
            puoi entrare a qualunque ora.
          pe: { magia: 5 }
          imposta: { maison.lista: 2, maison.cariche: 3 }
          effetti: { oggetto.maison-cristallo-accoppiato: 1, oggetto.maison-chiave-della-porta-di-servizio: 1, fazione.maison: 1 }
          almeno: { rep.maison: 6 }
          segue: maison-la-luce-color-miele

      - testo: "Strapparne prima una pagina"
        descrizione: "Una pagina sola, quella con il nome che pesa di più, piegata in tasca prima di consegnare il resto. Con le mani svelte non se ne accorge nessuno."
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Media }
        successo:
          titolo: Una pagina in tasca
          testo: |
            Mentre Gretchen versa il tè sfili piano una pagina lungo la
            cucitura e la pieghi nel palmo. È quella dell'uomo della Gilda con
            il panciotto, tre date accanto a un nome che conosci. Poi spingi il
            quaderno verso Nerissa, che lo chiude nella scatola di latta senza
            aprirlo. Ti dà una metà di un cristallo spezzato, chiusa in una
            gabbietta d'ottone, e una chiave di ferro appesa a un nastro verde.
            Quando la prendi le dita di Nerissa si fermano un momento sulle tue.

            {empatia Media} Lo sa. Lo sa e te la lascia, per vedere che cosa ne
            farai, e questa è la cosa più spaventosa che ti sia capitata in
            questa cucina.
          pe: { furtivita: 5 }
          imposta: { maison.lista: 3, maison.pagina: 1, maison.cariche: 3 }
          effetti: { rep.maison: -1, oggetto.maison-cristallo-accoppiato: 1, oggetto.maison-chiave-della-porta-di-servizio: 1, fazione.maison: 1 }
          almeno: { rep.maison: 6 }
          segue: maison-la-luce-color-miele
        fallimento:
          titolo: La cucitura
          testo: |
            La pagina oppone resistenza lungo la cucitura e fa un rumore secco,
            come una foglia secca, che nella cucina silenziosa suona come uno
            sparo. Sara si volta. Lasci andare la pagina e spingi il quaderno
            verso Nerissa, che lo chiude nella scatola di latta senza dire una
            parola. Ti dà lo stesso una metà di un cristallo spezzato e una
            chiave di ferro appesa a un nastro verde, e non ti guarda in faccia.
          pe: { furtivita: 5 }
          imposta: { maison.lista: 2, maison.cariche: 3 }
          effetti: { rep.maison: -1, oggetto.maison-cristallo-accoppiato: 1, oggetto.maison-chiave-della-porta-di-servizio: 1, fazione.maison: 1, sospetto: 0.5 }
          almeno: { rep.maison: 6 }
          segue: maison-la-luce-color-miele

      - testo: "Venderlo al Mercato delle Ombre"
        descrizione: "Al Mercato delle Ombre un quaderno così si paga quanto un anno di lavoro. Ma alla Maison non si torna, finché non hai fatto ammenda."
        requisiti: [contatto-ombra >= 1]
        esito:
          titolo: Il prezzo
          testo: |
            Prendi il quaderno dal tavolo e te lo metti sotto il braccio, e
            nessuno ti ferma. Gretchen chiude gli occhi. Al Mercato delle Ombre
            un uomo con i guanti di capretto lo sfoglia sotto la luce verdognola
            e ti conta sul banco una borsa che non ti basta una mano per tenere.
            Quando torni in Via dei Rasoi la lanterna è accesa, e Churl, sulla
            soglia, ti dice una parola sola. Sara, dietro di lui, non ti guarda.
          imposta: { maison.lista: 4, maison.chiusa: 1 }
          effetti: { monete: 150, sospetto: 1.5, rep.maison: -3, fazione.maison: 1 }

  - id: maison-la-luce-color-miele
    immagine: personaggi/nerissa-dalvane
    titolo: La luce color miele
    tipo: seguito
    luogo: Maison des Lunes, la cucina
    area: citta-bassa
    requisiti: [fazione.maison == 9]
    testo: |
      Gretchen e Sara se ne vanno a letto, e in cucina restate tu e Nerissa
      con la stufa che si spegne piano. Lei gira la tazza sul piattino di un
      quarto di giro come fa sempre, poi guarda la lampada che ha acceso senza
      toccarla. Da vicino si vede che la luce trema appena.

      «Mia madre diceva che il Mana si sente come si sente il tempo che
      cambia» dice, con gli occhi sulla lampada. «Io non l'ho mai studiato.
      L'ho tenuto acceso, come si tiene acceso un fuoco.» Poi si volta verso
      di te e ti offre di insegnarti qualcosa, se vuoi, un sussurro che fa
      paura e una voce che fa fare alle persone quello che volevano già
      fare. Le lezioni, aggiunge, si pagano con quello che hai sentito in
      giro, mai con le monete.

      {resilienza Media} Ti stai chiedendo da quanti anni in questa casa
      tutti parlano sotto la luce di una donna che sa farsi ascoltare dal
      Mana. Poi ti accorgi che anche tu, adesso, stai parlando sotto quella
      luce.
    opzioni:
      - testo: "Chiederle perché non l'ha mai detto a nessuno"
        descrizione: "Una stregona in città si fa notare. A meno che non decida di non farsi notare."
        costo: 0
        esito:
          titolo: La luce delle lampade
          testo: |
            «Nessuno chiede chi accende le lampade» dice Nerissa, e sorride
            appena. «Una casa come la mia è già abbastanza strana senza che la
            padrona faccia giochi di luce in salone. La luce serve a far sentire
            la gente al sicuro, e la gente si sente al sicuro quando non si
            chiede da dove viene.»
          pe: { magia: 3 }
      - testo: "Ringraziarla e andare a dormire"
        descrizione: "Le lezioni possono aspettare. Il tavolino della signora resta lì."
        costo: 0
        esito:
          titolo: La porta di servizio
          testo: |
            Esci dalla porta di servizio e la richiudi con la tua chiave, per
            la prima volta. Il nastro verde ti resta fra le dita fino al
            cortile. Dietro di te, alla finestra della cucina, la luce color
            miele si abbassa piano, e poi si spegne.
          pe: { empatia: 3 }

  # ------------------------------------------------------------ passo 9 · l'ammenda (per chi ha venduto il quaderno)
  - id: maison-l-ammenda
    presso: via-dei-rasoi
    immagine: personaggi/sara-beck
    titolo: L'ammenda
    sommario: "In Via dei Rasoi la porta grande per te è chiusa. Quella di servizio, forse, no."
    luogo: Maison des Lunes, la porta di servizio
    area: citta-bassa
    requisiti: [fazione.maison == 9, maison.chiusa == 1]
    testo: |
      Alla porta di servizio la lavagnetta di Sara è al suo posto, con i
      lavori della sera scritti a gesso, e il tuo nome non c'è più. In
      cortile i vasi di basilico sono stati annaffiati da poco. Bussi, e ti
      apre Gretchen in grembiule, con le mani bianche di farina, e resta
      sulla soglia senza farti entrare.

      «La signora non ti vuole vedere» dice. «Io sì, ma io non conto.» Si
      pulisce le mani nel grembiule. «Hai venduto dei nomi che erano di
      questa casa. Se vuoi tornare, porti qualcosa che valga quanto un nome,
      e lavori sette sere senza paga, dalla porta di servizio, come il primo
      giorno.»

      {empatia Media} Le costa dirtelo, e lo dice lo stesso, perché è
      l'unico modo che ha per lasciarti una porta aperta. Gretchen non
      ripete mai due volte un'offerta.
    opzioni:
      - testo: "Portare un segreto e lavorare sette sere"
        descrizione: "Un segreto che valga quanto un nome, e sette sere senza paga."
        requisiti: [informazioni.segreto >= 1]
        costo: 3
        esito:
          titolo: Sette sere
          testo: |
            Dai a Gretchen il segreto a voce bassa, e lei lo porta di sopra
            senza dirti niente. Poi lavori sette sere senza paga fra la porta e
            la cucina, e nessuno ti chiama per nome. L'ottava sera
            Sara ti mette in mano una chiave di ferro appesa a un nastro verde,
            quella della porta di servizio. La metà del cristallo, ti dice,
            resta alla signora.
          imposta: { maison.chiusa: 0 }
          effetti: { informazioni.segreto: -1, rep.maison: 1, oggetto.maison-chiave-della-porta-di-servizio: 1 }
      - testo: "Lavorare quattordici sere"
        descrizione: "Senza niente da portare, Gretchen ti offre il doppio delle sere e i lavori più pesanti."
        costo: 3
        esito:
          titolo: Quattordici sere
          testo: |
            Lavori quattordici sere senza paga, a spaccare legna, a lavare i
            piatti e a tenere la porta con Kanat sotto la pioggia. Ti fanno
            male la schiena e le mani, e nessuno ti chiama per nome. La
            quindicesima sera Sara ti mette in mano una chiave di ferro appesa a
            un nastro verde, quella della porta di servizio. La metà del
            cristallo, ti dice, resta alla signora.
          imposta: { maison.chiusa: 0 }
          effetti: { ferite: 1, rep.maison: 0.5, oggetto.maison-chiave-della-porta-di-servizio: 1 }

  # ------------------------------------------------------------ passo 10 · la proposta, variante A (prima di Pelle 5)
  - id: maison-la-proposta-del-decoro
    presso: via-dei-rasoi
    immagine: personaggi/ottone-malgrani
    titolo: La proposta
    sommario: "Un cliente ha lasciato in salone, dimenticata sotto un cuscino, la bozza di una proposta per il Consiglio. Parla di Via dei Rasoi."
    luogo: Maison des Lunes, il salone
    area: citta-bassa
    requisiti: [fazione.maison == 9, maison.chiusa == 0, pista.pelle < 5]
    testo: |
      Nerissa ti aspetta in salone con un foglio piegato in tre sul tavolino,
      accanto alla teiera. L'ha trovato Kasja sotto un cuscino, dove l'ha
      dimenticato un segretario del Municipio che ha bevuto un bicchiere di
      troppo. È la bozza di una proposta per il Consiglio, scritta in bella
      copia, con il sigillo di cera ancora da mettere. Le case di Via dei
      Rasoi dovranno tenere un registro scritto dei frequentatori con il nome e la
      data, da mostrare a richiesta della Guardia. Per il decoro della città,
      dice il preambolo.

      {galateo Media} Il preambolo usa tre volte la parola decoro, e ogni
      volta con l'iniziale maiuscola. Chi l'ha scritto ha imparato a scrivere
      sui biglietti d'invito.

      La proposta la firmano Ottone Malgrani e Ruggero Annibaldi, che siede
      nel consiglio interno della Gilda e ha i magazzini più ordinati del
      Mercato dei Nodi. Nerissa non tocca il foglio. «Per vent'anni non ho
      mai scritto un nome» dice. «Adesso vogliono che li scriva io, e che li
      tenga in un cassetto per chiunque abbia una divisa.»

      {politica-ed-economia Media} Ottone vuole chiudere la Maison da anni,
      e ci prova con la legge perché i suoi amici in salone ci vengono. Un
      registro da mostrare alla Guardia è un registro da mostrare a chi paga
      la Guardia.

      «Il Consiglio vota fra poco più di un mese» dice Nerissa. «Voglio sapere
      chi è con loro.»
    opzioni:
      - testo: "Contare i voti nell'anticamera del Municipio"
        descrizione: "Le udienze del mattino sono il posto dove i consiglieri si fermano a parlare. Chi sa ascoltare le panche conta i voti prima dei consiglieri."
        prova: { attributo: mentale, abilita: [politica-ed-economia, percezione], difficolta: Media }
        successo:
          titolo: Le panche
          testo: |
            Passi tre mattine sulle panche dell'anticamera del Municipio, con
            una supplica falsa in mano e l'orecchio teso. I consiglieri si
            fermano a parlare sulle scale, e uno alla volta li metti in
            colonna. Con Ottone ci sono i suoi, e due sono incerti, perché la
            Maison serve anche a loro. Torni da Nerissa con i nomi in testa e
            nessun foglio.
          pe: { politica-ed-economia: 5 }
          imposta: { maison.voti: 2 }
          effetti: { rep.maison: 1, informazioni.pettegolezzo: 1, rep.malgrani: -1, fazione.maison: 1 }
        fallimento:
          titolo: La supplica falsa
          testo: |
            Sulle panche dell'anticamera ti accorgi troppo tardi che il tuo
            vicino è un impiegato di Ottone, che ti chiede di che cosa tratta
            la tua supplica. Glielo spieghi male. Per tre mattine i consiglieri
            ti passano davanti senza fermarsi, e torni da Nerissa con poco più
            di una sensazione.
          imposta: { maison.voti: 1 }
          effetti: { rep.maison: 0.5, rep.malgrani: -1, fazione.maison: 1, scandalo: 0.5 }

      - testo: "Farti mostrare la bozza originale da Tullio Merga"
        descrizione: "Il primo impiegato del Municipio ha in un cassetto la versione con le firme e le correzioni a margine. Bisogna chiedergliela con le buone maniere giuste."
        prova: { attributo: sociale, abilita: [galateo, persuasione], difficolta: Media }
        successo:
          titolo: Il cassetto di Merga
          testo: |
            Tullio Merga ti riceve all'ora di pranzo, con il tovagliolo ancora
            infilato nel colletto, e dopo un quarto d'ora di cortesie apre il
            cassetto. L'originale ha le firme di Ottone e di Annibaldi e un
            margine pieno di correzioni, e una dice che il registro andrà
            consegnato ogni mese al Municipio. Merga lo rimette via e ti
            chiede di non dire a nessuno che sei passato.
          pe: { galateo: 5 }
          imposta: { maison.voti: 2 }
          effetti: { rep.maison: 1, informazioni.pettegolezzo: 1, rep.malgrani: -1, fazione.maison: 1 }
        fallimento:
          titolo: Il tovagliolo
          testo: |
            Tullio Merga ti ascolta con il tovagliolo infilato nel colletto e
            ti spiega con grande gentilezza che le bozze del Consiglio non si
            mostrano ai privati. Esci dal Municipio con niente in mano, e alle
            tue spalle Merga apre il registro delle visite e ci scrive qualcosa.
          imposta: { maison.voti: 1 }
          effetti: { rep.maison: 0.5, rep.malgrani: -1, fazione.maison: 1, sospetto: 0.5 }

      - testo: "Parlare con Varn Kett alla Casa dei Nodi"
        descrizione: "L'ispettore dei dazi della Gilda ascolta tutti e non dimentica una riga. Quei nomi non ha nessuna voglia di leggerli."
        prova: { attributo: sociale, abilita: [empatia, persuasione], difficolta: Media }
        successo:
          titolo: La pergamena invisibile
          testo: |
            Trovi Varn Kett sotto i portici della Casa dei Nodi, con il
            cappotto color tabacco e gli stivali da pioggia. Gli racconti della
            proposta, e lui muove le dita su una pergamena invisibile mentre
            ascolti. «Un registro di nomi fa più danni di un incendio» dice
            alla fine. «Annibaldi questo non lo sa, perché non ha mai visto
            bruciare niente di suo.» Ti promette che in Gilda dirà la sua.
          pe: { empatia: 5 }
          imposta: { maison.voti: 2, maison.varn: 1 }
          effetti: { rep.maison: 1, informazioni.pettegolezzo: 1, rep.malgrani: -1, fazione.maison: 1 }
        fallimento:
          titolo: Gli stivali da pioggia
          testo: |
            Varn Kett ti ascolta sotto i portici con le dita ferme e la faccia
            di un uomo che conta le gocce di pioggia. Poi ti dice che la Gilda
            ha già tanti problemi suoi, e che lui un registro in più lo legge
            senza fatica. Lo guardi allontanarsi con gli stivali che scricchiolano
            sul selciato.
          imposta: { maison.voti: 1 }
          effetti: { rep.maison: 0.5, rep.malgrani: -1, fazione.maison: 1, scandalo: 0.5 }

      - testo: "Leggere la bozza come un contratto"
        descrizione: "Ai banchi dei Ponti ti hanno insegnato che in un contratto conta la clausola che nessuno legge. Questa ce l'ha in fondo, scritta piccola."
        quando: [origine.mercante-dei-ponti >= 1]
        esito:
          titolo: La clausola piccola
          testo: |
            Leggi la bozza dal fondo, come fai con i contratti dei fornitori, e
            la clausola che cercavi c'è. Il registro andrà consegnato ogni mese
            al Municipio, cioè a chiunque in Municipio voglia leggerlo. Con
            quella riga in testa fai il giro di tre consiglieri che conosci dai
            banchi, e due ti dicono che una cosa così non la voteranno.
          pe: { politica-ed-economia: 5 }
          imposta: { maison.voti: 2 }
          effetti: { rep.maison: 1, informazioni.pettegolezzo: 1, rep.malgrani: -1, fazione.maison: 1 }

  # ------------------------------------------------------------ passo 10 · la proposta, variante B (dopo la Pignatta)
