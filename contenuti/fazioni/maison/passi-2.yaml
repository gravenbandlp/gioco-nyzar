  # ------------------------------------------------------------ passo 11 · l'invito a cena (ingresso della spedizione)
  - id: maison-l-invito-a-cena
    presso: via-dei-rasoi
    immagine: personaggi/marella-castaldi
    titolo: Un posto a tavola
    sommario: "Nei giorni di consiglio Marella Castaldi decide chi siede dove, e Nerissa vuole che a quella tavola ci sia anche tu."
    luogo: Maison des Lunes, il salone
    area: citta-bassa
    requisiti: [fazione.maison == 10, pista.pelle != 5, pista.pelle != 6]
    testo: |
      Nerissa ha disegnato a matita una tavola ovale con i posti segnati da
      un punto, senza un nome. Te li spiega uno per uno con la punta della
      matita, e i nomi li dice a voce, piano.

      «Marella Castaldi dà una cena la sera prima di ogni seduta» dice. «Si
      parla di Stato e mai dei Castaldi, e tutti escono sapendo come
      voteranno gli altri. Ci saranno la Rappresentante e suo cugino,
      Annibaldi, il comandante della guardia e qualche consigliere.» Lei a
      quella tavola non può sedersi, e ci andrai tu, come sua voce. Senza
      invito, puoi entrare come accompagnatore di un suo cliente.

      {origine rampollo-dei-quartieri-alti} Le cene di Marella le conosci. Da
      ragazzo ti mettevano in fondo vicino ai cugini, e da lì hai imparato
      che chi siede in fondo sente tutto quello che dicono in testa.
    opzioni:
      - testo: "Andare con il tuo invito"
        descrizione: "Il biglietto con il sigillo dei Castaldi, e una carrozza fino al Maniero."
        requisiti: [invito >= 1]
        esito:
          titolo: La carrozza
          testo: |
            La carrozza ti lascia davanti al Maniero Castaldi, tre piani di pietra
            chiara senza un fregio di troppo, con il pianterreno tutto acceso. Un
            valletto ti prende il mantello e l'invito con la stessa mano.
          imposta: { maison.imbarazzo: 0 }
          vai: maison-cena-al-maniero-castaldi
      - testo: "Andare come accompagnatore"
        descrizione: "Un cliente della Maison con un invito e nessuna compagnia, e voi due che fingete di conoscervi da anni."
        esito:
          titolo: L'accompagnatore
          testo: |
            Il cliente è un vedovo del consiglio interno della Gilda con il
            panciotto stretto, che non vuole arrivare da solo. In carrozza ti
            racconta come vi siete conosciuti, e la storia cambia due volte prima
            del Maniero.
          imposta: { maison.imbarazzo: 0 }
          effetti: { rep.maison: -0.5 }
          vai: maison-cena-al-maniero-castaldi
      - testo: "Aspettare la prossima seduta"
        descrizione: "Marella dà una cena prima di ogni seduta, e questa può aspettare."
        costo: 0
        esito:
          titolo: La matita
          testo: |
            Nerissa infila il foglio piegato nella teiera vuota, dove nessuno va a
            cercare. «Il voto non aspetta» dice, «ma le cene di Marella sì.»

  # ------------------------------------------------------------ passo 12 · il voto (quarto grado)
  - id: maison-il-voto
    presso: via-dei-rasoi
    immagine: personaggi/nerissa-dalvane
    titolo: La sera prima del voto
    sommario: "Domattina il Consiglio vota sul registro, e stasera in salone si contano i voti."
    luogo: Maison des Lunes, il salone
    area: citta-bassa
    requisiti: [fazione.maison == 11, pista.pelle != 5, pista.pelle != 6]
    testo: |
      Il salone è chiuso e le lampade sono abbassate al minimo. Nerissa siede
      nella poltrona di cuoio con la teiera e due tazze, e una delle due è
      ancora tiepida. Sul piattino c'è la matita corta, con i segni dei denti
      nuovi vicino alla punta. Avete contato i voti sulle dita, senza
      scriverli, come le ragazze con i conti delle mance.

      «Domattina si vota» dice Nerissa. «Lo sceriffo ha un voto in Consiglio,
      e stasera è passato per servizio.» Gira la tazza sul piattino di un
      quarto di giro. «Io non voglio che debba scegliere fra il suo lavoro e
      questa casa. Lui invece ha già scelto, e non mi ha chiesto niente.»

      {empatia Media} Ha paura per lui, non per sé. Un voto dello sceriffo
      contro il registro, in un Consiglio dove tutti sanno contare, la gente
      lo ricorderà, e qualcuno si chiederà perché.

      {origine accolito-del-velo} La Madre diceva che un segreto tenuto in due
      è una preghiera, e tenuto in tre è un pettegolezzo. In questo salone,
      stasera, siete in tre a saperlo.

      Nerissa ti guarda. «Dimmi quanti ne abbiamo.»
    opzioni:
      - testo: "La proposta l'ha ritirata Annibaldi"
        descrizione: "Alla cena di Marella gli hai mostrato una pagina con il suo nome, e la proposta non arriverà in aula."
        quando: [maison.annibaldi == 1]
        esito:
          titolo: Ritirata
          testo: |
            Ruggero Annibaldi si alza per primo e ritira la proposta per ragioni
            di opportunità, con la voce di uno che legge un necrologio. La sera
            Nerissa ti appunta sul bavero una mezzaluna d'argento, dalla parte del
            cuore, e da oggi nei salotti parli a nome suo.

            {resilienza Media} La pagina ce l'hai ancora in tasca. Pesa poco, ed è
            la cosa più pesante che hai addosso.
          pe: { persuasione: 10 }
          imposta: { maison.registro: 1, maison.favori: 3 }
          effetti: { rep.maison: 1, monete: 100, oggetto.maison-spilla-della-mezzaluna: 1, fazione.maison: 1 }
          almeno: { rep.maison: 8 }
          segue: maison-voce-del-salotto

      - testo: "Ne abbiamo abbastanza"
        descrizione: "Bastano quattro voti contro, forse cinque, perché lo sceriffo non debba aprire bocca."
        quando: [maison.annibaldi == 0, maison.voti >= 4]
        esito:
          titolo: Cade da sola
          testo: |
            La proposta cade alla prima conta, con lo sceriffo seduto a braccia conserte,
            e in cucina Gretchen lo racconta fra gli applausi. La sera Nerissa ti appunta
            sul bavero una mezzaluna d'argento, dalla parte del cuore, e da oggi nei
            salotti parli a nome suo.
          pe: { persuasione: 10 }
          imposta: { maison.registro: 1, maison.favori: 3 }
          effetti: { rep.maison: 1, monete: 100, oggetto.maison-spilla-della-mezzaluna: 1, fazione.maison: 1 }
          almeno: { rep.maison: 8 }
          segue: maison-voce-del-salotto

      - testo: "Lasciare che lo sceriffo voti"
        descrizione: "Ne manca uno, e il voto di Galdrick c'è già."
        quando: [maison.annibaldi == 0, maison.voti == 3, galdrick.via == 0]
        esito:
          titolo: Il voto dello sceriffo
          testo: |
            La conta si ferma a un voto dalla fine, e Galdrick alza la mano
            contro, l'ultimo, con la faccia di uno che vota sulle grondaie. A
            verbale dice che un registro in mano alla Guardia è in mano a chi
            corrompe la Guardia. La sera Nerissa ti appunta sul bavero una
            mezzaluna d'argento, e la seconda tazza resta vuota.
          pe: { persuasione: 10 }
          imposta: { maison.registro: 2, maison.favori: 3 }
          effetti: { rep.maison: 1, rep.caserma: 1, monete: 100, oggetto.maison-spilla-della-mezzaluna: 1, fazione.maison: 1 }
          almeno: { rep.maison: 8 }
          segue: maison-voce-del-salotto

      - testo: "Comprare l'ultimo voto con un segreto"
        descrizione: "Un consigliere incerto, una cosa che sai di lui e una visita prima dell'alba."
        quando: [maison.annibaldi == 0, maison.voti == 3]
        requisiti: [informazioni.segreto >= 1]
        esito:
          titolo: Prima dell'alba
          testo: |
            Prima dell'alba dici a un consigliere, con molto garbo, una cosa che
            sai di lui. La proposta cade per un voto, e Galdrick non deve alzare
            la mano. La sera Nerissa ti appunta sul bavero una mezzaluna
            d'argento, dalla parte del cuore, e da oggi nei salotti parli a nome
            suo. Le sue dita restano sul bavero più del necessario.
          pe: { persuasione: 10 }
          imposta: { maison.registro: 1, maison.favori: 3 }
          effetti: { informazioni.segreto: -1, rep.maison: 1, monete: 100, oggetto.maison-spilla-della-mezzaluna: 1, fazione.maison: 1 }
          almeno: { rep.maison: 8 }
          segue: maison-voce-del-salotto

      - testo: "Riempire il registro di nomi inventati"
        descrizione: "Se la proposta passa, il registro si può riempire di gente che non esiste, purché regga alla prima ispezione."
        quando: [maison.annibaldi == 0, maison.voti <= 3, maison.varn == 0]
        prova: { attributo: sociale, abilita: [ingannare, espressivita], difficolta: Difficile }
        successo:
          titolo: Il signor Pace, tre volte a settimana
          testo: |
            La proposta passa, e in una notte riempite un registro con le grafie
            di tutte le ragazze, e il signor Bertoldo Pace ci viene tre volte a
            settimana. L'uomo della Gilda lo sfoglia per un'ora e firma. La sera
            Nerissa ti appunta sul bavero una mezzaluna d'argento, e da oggi nei
            salotti parli a nome suo.
          pe: { ingannare: 10 }
          imposta: { maison.registro: 3, maison.favori: 3 }
          effetti: { rep.maison: 1, monete: 100, oggetto.maison-spilla-della-mezzaluna: 1, fazione.maison: 1 }
          almeno: { rep.maison: 8 }
          segue: maison-voce-del-salotto
        fallimento:
          titolo: La stessa grafia
          testo: |
            La proposta passa, e alla prima ispezione l'uomo della Gilda nota che
            dieci clienti diversi fanno la erre allo stesso modo. Nerissa paga
            l'ammenda, e per un mese in salone si parla soltanto del tempo. Ti
            appunta lo stesso sul bavero una mezzaluna d'argento, e nei salotti
            parlerai a nome suo, a voce più bassa.
          pe: { ingannare: 10 }
          imposta: { maison.registro: 3, maison.favori: 2 }
          effetti: { scandalo: 1.5, rep.maison: -1, monete: 50, oggetto.maison-spilla-della-mezzaluna: 1, fazione.maison: 1 }
          almeno: { rep.maison: 8 }
          segue: maison-voce-del-salotto

      - testo: "Riempire il registro e farlo leggere a Varn"
        descrizione: "Se la proposta passa, l'ispettore leggerà male quello che gli date da leggere."
        quando: [maison.annibaldi == 0, maison.voti <= 3, maison.varn == 1]
        esito:
          titolo: Letto male
          testo: |
            La proposta passa, e in una notte riempite un registro di gente che
            non esiste, con il signor Bertoldo Pace tre volte a settimana. Varn
            Kett lo sfoglia sotto i portici e lo dichiara in ordine. La sera
            Nerissa ti appunta sul bavero una mezzaluna d'argento, e da oggi nei
            salotti parli a nome suo.
          pe: { ingannare: 10 }
          imposta: { maison.registro: 3, maison.favori: 3 }
          effetti: { rep.maison: 1, monete: 100, oggetto.maison-spilla-della-mezzaluna: 1, fazione.maison: 1 }
          almeno: { rep.maison: 8 }
          segue: maison-voce-del-salotto

  - id: maison-voce-del-salotto
    immagine: personaggi/nerissa-dalvane
    titolo: Voce del salotto
    tipo: seguito
    luogo: Maison des Lunes, il salone
    area: citta-bassa
    requisiti: [fazione.maison == 12]
    testo: |
      A casa chiusa Nerissa ti fa sedere nella poltrona di fronte alla sua e
      ti versa il tè della scatola di latta. Dal fondo del salone Churl
      tossisce una volta sola, e Sara, sulla soglia, ti chiama per nome con il
      tono che usa per i clienti di vent'anni.

      «Tre volte puoi chiedermi una cosa che non si compra» dice Nerissa. Può
      essere una porta dei Quartieri Alti o un nome che smette di girare per
      la città, e basta chiederlo al suo tavolino. Da stasera, aggiunge, la
      Luna Nuova non la paghi più.

      {galateo Media} Un favore della signora vale più di una borsa, perché
      chi lo riceve non sa nemmeno che c'è stato.
    opzioni:
      - testo: "Bere il tè"
        descrizione: "Stasera non c'è niente da decidere."
        costo: 0
        esito:
          titolo: Il tè della scatola di latta
          testo: |
            Bevete il tè in silenzio finché la teiera è vuota, e per la prima
            volta in questa casa il silenzio non ti sembra un esame. Fuori la
            catena di bronzo della lanterna oscilla appena nel vento di Via dei
            Rasoi.
          pe: { galateo: 3 }
