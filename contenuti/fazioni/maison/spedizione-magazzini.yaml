# La quest della Maison des Lunes, passo 14: la spedizione «I magazzini del Ponte del Pesce»
# (`maison-magazzini-del-ponte-del-pesce`, ritorno citta-bassa, soglia 4). Ci si entra da `maison-la-terza-arcata`
# (passi-3.yaml). Tutte le stanze chiedono fazione.maison == 13. Le fasce di profondità:
# 0 la riva e le chiatte (Atletica, o un barcaiolo da pagare) e la porta del sale (Furtività); 1 il bravo che dorme
# (Furtività o uno scontro); 1-2 la stanza dei conti (Politica ed economia; chi ha il cristallo accoppiato con una
# carica lo lascia lì e sente dove sono i fratelli, una stanza in meno, ½ Sospetto) e le botti del pesce salato;
# 2 la ghiacciaia (Resistenza); 2-3 le arcate sul vuoto (Acrobazia); 3 la stanza delle copie e la scala dei pescatori.
# In ogni stanza c'è la via senza prova: due rintocchi e mezza Ferita.
# Il cuore a 4 è lo scrittoio dei Ferrante, boss Difficile: lo scontro con Lazzaro e due bravi, Persuasione su Dario
# (Media spendendo un favore della signora), Furtività per prendere il libro mentre Dario dorme, Voce di seta. Chi
# riesce porta maison.ferrante a 4 e il passo a 14; chi fallisce prende Ferite o Sospetto, una pagina esce
# (rep.maison −½), i fratelli scappano con le copie (maison.ferrante 2) e il libro resta a te: il passo va avanti.
# In fondo al file, la musica e l'ambiente dell'area (colonna sonora).
aree:
  - id: maison-magazzini-del-ponte-del-pesce
    immagine: ambientazione/ponti-sospesi
    nome: I magazzini del Ponte del Pesce
    sommario: "I vecchi magazzini del pesce salato sotto l'arco di pietra rossa, dove si trova il libro di Vesh."
    spedizione: { ritorno: citta-bassa, soglia: 4, stanze: 3 }
    testo: |
      Sotto l'arco di pietra rossa del Ponte del Pesce i magazzini del pesce
      salato salgono sulla roccia per tre piani, con le stanze basse scavate
      nella pietra e quelle alte di legno a sbalzo sul vuoto. Più giù scorre
      lento il canale nero, e oltre il canale c'è il buio della Cicatrice.

      Il sale è entrato nei muri e ti brucia le labbra appena lo respiri.

storylet:
  # ------------------------------------------------------------ 0 · la riva e le chiatte
  - id: maison-magazzini-la-riva
    immagine: ambientazione/ponti-sospesi
    titolo: La riva e le chiatte
    sommario: "Due chiatte legate alla stessa bitta, e dalla seconda una scala a pioli che sale ai magazzini."
    luogo: I magazzini del Ponte del Pesce, la riva
    area: maison-magazzini-del-ponte-del-pesce
    ripetibile: true
    requisiti: [fazione.maison == 13, profondita.maison-magazzini-del-ponte-del-pesce == 0]
    testo: |
      Due chiatte sono legate alla stessa bitta, e la seconda tocca con la
      prua la parete dei magazzini, dove una scala a pioli inchiodata alla
      roccia sale a una porta di carico. Sulla prima dorme un barcaiolo con
      un piede fuori dalla coperta.

      {conoscenze-della-strada Facile} Un barcaiolo che dorme sulla chiatta
      di qualcun altro è pagato per dormire lì, e per il doppio si sveglia.
    opzioni:
      - testo: "Saltare da una chiatta all'altra"
        descrizione: "Un passo e mezzo d'acqua nera, da saltare quando la seconda chiatta viene verso di te."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Media }
        successo:
          titolo: Il salto
          testo: |
            Salti quando la seconda chiatta oscilla verso di te e atterri sul
            ponte bagnato senza un rumore. Il barcaiolo si gira sotto la coperta e
            continua a dormire.
          effetti: { profondita.maison-magazzini-del-ponte-del-pesce: 1 }
        fallimento:
          titolo: L'acqua nera
          testo: |
            Salti quando la chiatta si allontana e finisci nel canale fino al
            petto, e il barcaiolo ti ripesca con la gaffa ridendo.
          effetti: { ferite: 0.5 }
      - testo: "Pagare il barcaiolo perché ti porti alla scala"
        descrizione: "Con una moneta in più si dimentica anche di averti visto."
        requisiti: [monete >= 6]
        esito:
          titolo: La gaffa
          testo: |
            Il barcaiolo conta le monete senza alzarsi, porta la chiatta fino alla
            scala con la gaffa e torna a dormire prima che tu sia in cima.
          effetti: { monete: -6, profondita.maison-magazzini-del-ponte-del-pesce: 1 }
      - testo: "Fare il giro dalla riva, fra gli scogli"
        descrizione: "Una striscia di scogli bagnati arriva fin sotto la scala."
        costo: 2
        esito:
          titolo: Gli scogli
          testo: |
            Fai il giro dagli scogli e arrivi sotto la scala con un ginocchio
            sbucciato e i calzoni fradici.
          effetti: { profondita.maison-magazzini-del-ponte-del-pesce: 1, ferite: 0.5 }

  # ------------------------------------------------------------ 0 · la porta del sale
  - id: maison-magazzini-la-porta-del-sale
    immagine: ambientazione/ponti-sospesi
    titolo: La porta del sale
    sommario: "La porta da cui entravano i sacchi di sale ha un catenaccio vecchio e un campanello nuovo."
    luogo: I magazzini del Ponte del Pesce, la porta del sale
    area: maison-magazzini-del-ponte-del-pesce
    ripetibile: true
    requisiti: [fazione.maison == 13, profondita.maison-magazzini-del-ponte-del-pesce == 0]
    testo: |
      La porta del sale è una porta doppia di legno di nave, con un catenaccio
      arrugginito che nessuno chiude più. Sopra lo stipite qualcuno ha appeso
      un campanello d'ottone legato a un filo teso lungo il battente.

      {furtivita Media} Il filo è sottile, e con una lama si taglia, purché tu
      tenga fermo il campanello con l'altra mano.
    opzioni:
      - testo: "Tagliare il filo tenendo fermo il campanello"
        descrizione: "Una mano sul campanello, l'altra con la lama."
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Media }
        successo:
          titolo: Il campanello muto
          testo: |
            Tieni il campanello fra le dita come un uccellino e tagli il filo un
            filamento alla volta. Lo appoggi per terra, muto, ed entri.
          effetti: { profondita.maison-magazzini-del-ponte-del-pesce: 1 }
        fallimento:
          titolo: Il din
          testo: |
            Il filo cede tutto insieme e il campanello ti sfugge, con un din che
            rimbomba nei magazzini come in una chiesa. Aspetti a lungo contro il
            muro, ma nessuno viene.
          effetti: { sospetto: 1 }
      - testo: "Smontare il campanello dallo stipite"
        descrizione: "Un chiodo e un gancio, montati in fretta."
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Media }
        successo:
          titolo: Il gancio
          testo: |
            Il gancio è infilato in un chiodo storto, e basta sollevarlo di un
            dito. Appoggi il campanello per terra e apri la porta senza un rumore.
          effetti: { profondita.maison-magazzini-del-ponte-del-pesce: 1 }
        fallimento:
          titolo: Il chiodo
          testo: |
            Tirando il gancio viene via mezza cornice di legno marcio, e ti pianti
            una scheggia sotto l'unghia, mentre il campanello per fortuna resta
            muto.
          effetti: { ferite: 0.5 }
      - testo: "Cercare un'altra porta, sul retro"
        descrizione: "Qualche porta dei magazzini non avrà il campanello."
        costo: 2
        esito:
          titolo: La finestra bassa
          testo: |
            Dietro i magazzini, fra le nasse marce, trovi una finestra bassa senza
            vetro, e passandoci il davanzale ti graffia la schiena.
          effetti: { profondita.maison-magazzini-del-ponte-del-pesce: 1, ferite: 0.5 }

  # ------------------------------------------------------------ 1 · il bravo che dorme
  - id: maison-magazzini-il-bravo-che-dorme
    immagine: ambientazione/ponti-sospesi
    titolo: Il bravo che dorme
    sommario: "Fra le vasche vuote del sale dorme un uomo grosso, con un randello sulle ginocchia."
    luogo: I magazzini del Ponte del Pesce, le vasche del sale
    area: maison-magazzini-del-ponte-del-pesce
    ripetibile: true
    requisiti: [fazione.maison == 13, profondita.maison-magazzini-del-ponte-del-pesce == 1]
    testo: |
      Nella stanza delle vasche le vasche di pietra sono vuote e bianche di
      sale secco. In mezzo, su una sedia appoggiata a una colonna, dorme un
      uomo grosso con un randello di legno di nave sulle ginocchia, proprio
      davanti alla porta dall'altra parte.

      {furtivita Media} Il sale secco sul pavimento scricchiola sotto le
      suole come neve gelata.
    opzioni:
      - testo: "Passargli accanto senza svegliarlo"
        descrizione: "Bisogna camminare sul bordo delle vasche, dove non c'è sale."
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Media }
        successo:
          titolo: Il bordo delle vasche
          testo: |
            Cammini sul bordo di pietra delle vasche con le braccia larghe come un
            equilibrista, e passi a un palmo dal bravo, che nel sonno si gratta il
            naso.
          effetti: { profondita.maison-magazzini-del-ponte-del-pesce: 1 }
        fallimento:
          titolo: Lo scricchiolio
          testo: |
            Lo scricchiolio del sale sveglia il bravo, e ti insegue con il
            randello fino alla porta, dove ti arriva un colpo sulla spalla.
          effetti: { ferite: 0.5 }
      - testo: "Stenderlo prima che si svegli"
        descrizione: "Un bravo dei Ferrante mezzo addormentato, con un randello che sa usare."
        combattimento: maison-il-bravo-che-dorme
        vittoria:
          titolo: Il randello
          testo: |
            Il bravo si sveglia con te già addosso e ci mette troppo a capire.
            Finisce disteso in una vasca vuota, in una nuvola di sale, con i polsi
            legati dalla sua cintura.
          effetti: { profondita.maison-magazzini-del-ponte-del-pesce: 1 }
        sconfitta:
          titolo: Il risveglio
          testo: |
            Il bravo si sveglia prima del previsto, e ti ritrovi fuori dalla
            stanza delle vasche con il sale negli occhi e un bernoccolo che pulsa.
          effetti: { ferite: 1 }
      - testo: "Aspettare che si sposti"
        descrizione: "Prima o poi avrà sete."
        costo: 2
        esito:
          titolo: La sete
          testo: |
            Aspetti dietro una vasca finché il bravo va a bere a un barile in
            fondo alla stanza, e passi mentre beve.
          effetti: { profondita.maison-magazzini-del-ponte-del-pesce: 1, ferite: 0.5 }

  # ------------------------------------------------------------ 1-2 · la stanza dei conti
  - id: maison-magazzini-la-stanza-dei-conti
    immagine: fazioni/gilda-dei-mercanti
    titolo: La stanza dei conti
    sommario: "Un quaderno aperto su un tavolo, e una fila di borse vuote con un nome scritto sopra."
    luogo: I magazzini del Ponte del Pesce, la stanza dei conti
    area: maison-magazzini-del-ponte-del-pesce
    ripetibile: true
    requisiti: [fazione.maison == 13, profondita.maison-magazzini-del-ponte-del-pesce >= 1, profondita.maison-magazzini-del-ponte-del-pesce <= 2]
    testo: |
      In una stanzetta sul canale c'è un tavolo con un quaderno aperto, e accanto una fila
      di borse di tela vuote, ognuna con un nome scritto a carbone. La candela sul tavolo è
      ancora calda.

      {politica-ed-economia Media} Le borse vuote sono quelle già pagate, e chi tiene
      questi conti sa quanto vale ogni nome.
    opzioni:
      - testo: "Leggere i conti e capire chi ha già pagato"
        descrizione: "Chi ha pagato e chi aspetta la pagina, per chi sa dove guardare."
        prova: { attributo: mentale, abilita: [politica-ed-economia, percezione], difficolta: Media }
        successo:
          titolo: Chi ha pagato
          testo: |
            Undici persone hanno già pagato, il mugnaio del giovedì due volte. Tre
            nomi hanno accanto una croce, quelli che non hanno pagato e hanno già
            ricevuto una seconda pagina, e te li stampi in testa.
          effetti: { profondita.maison-magazzini-del-ponte-del-pesce: 1, informazioni.pettegolezzo: 1 }
        fallimento:
          titolo: Il calamaio
          testo: |
            La manica ti urta il calamaio e l'inchiostro si allarga sulla pagina.
            Lo tamponi alla meglio e te ne vai prima che qualcuno se ne accorga.
          effetti: { sospetto: 1 }
      - testo: "Lasciare in ascolto il cristallo accoppiato"
        descrizione: "Dalla metà nascosta fra le borse, l'altra metà in tasca ti dice dove parlano i fratelli."
        requisiti: [chiave.orecchio >= 1, maison.cariche >= 1]
        prova: { attributo: mentale, abilita: [magia, percezione], difficolta: Facile }
        successo:
          titolo: Le voci dei fratelli
          testo: |
            Dalla gabbietta in tasca arrivano le voci dei due fratelli che
            litigano su una pagina, con il cigolio di una passerella, e adesso sai
            dove andare.
          effetti: { profondita.maison-magazzini-del-ponte-del-pesce: 2, maison.cariche: -1, sospetto: 1 }
        fallimento:
          titolo: Il silenzio
          testo: |
            Dalla gabbietta arriva soltanto il rumore del canale, e quando torni a
            riprendere l'altra metà la carica è consumata.
          effetti: { maison.cariche: -1, sospetto: 1 }
      - testo: "Proseguire senza toccare niente"
        descrizione: "Il quaderno resta dov'è."
        costo: 2
        esito:
          titolo: La porta
          testo: |
            Prendi una passerella esterna sopra il canale, e un'asse marcia ti si
            spacca sotto il tallone. Ti tieni alla corda e passi con la caviglia
            storta.
          effetti: { profondita.maison-magazzini-del-ponte-del-pesce: 1, ferite: 0.5 }

  # ------------------------------------------------------------ 1-2 · le botti del pesce salato
  - id: maison-magazzini-le-botti
    immagine: ambientazione/ponti-sospesi
    titolo: Le botti del pesce salato
    sommario: "Botti accatastate fino al soffitto, e una che non puzza di pesce."
    luogo: I magazzini del Ponte del Pesce, la stanza delle botti
    area: maison-magazzini-del-ponte-del-pesce
    ripetibile: true
    requisiti: [fazione.maison == 13, profondita.maison-magazzini-del-ponte-del-pesce >= 1, profondita.maison-magazzini-del-ponte-del-pesce <= 2]
    testo: |
      Le botti del pesce salato sono accatastate fino al soffitto in file
      storte, con corridoi così stretti che si passa di fianco, e l'odore ti
      lascia un bruciore in fondo al naso. In fondo a una fila c'è una botte
      con i cerchi lucidi e il coperchio pulito.
    opzioni:
      - testo: "Aprire la botte con i cerchi lucidi"
        descrizione: "Una botte che si apre spesso contiene qualcosa che serve spesso."
        prova: { attributo: mentale, abilita: [percezione, tecnologia], difficolta: Media }
        successo:
          titolo: La botte pulita
          testo: |
            Dentro ci sono decine di fogli di carta da copia ancora bianchi, le
            pagine che i fratelli devono riempire, e su uno qualcuno ha disegnato
            la pianta dei magazzini.
          effetti: { profondita.maison-magazzini-del-ponte-del-pesce: 1 }
        fallimento:
          titolo: La salamoia
          testo: |
            Sbagli botte, e la salamoia ti arriva sulle mani e sulla camicia con
            un odore che durerà giorni.
          effetti: { ferite: 0.5 }
      - testo: "Passare fra le botti seguendo le impronte"
        descrizione: "Sul sale ci sono impronte fresche, tutte nella stessa direzione."
        prova: { attributo: mentale, abilita: [percezione, natura], difficolta: Media }
        successo:
          titolo: Le impronte
          testo: |
            Sono due persone, una con le scarpe grandi e una con gli stivali
            stretti, e le segui fino a una scala di legno in fondo alla stanza.
          effetti: { profondita.maison-magazzini-del-ponte-del-pesce: 1 }
        fallimento:
          titolo: Il corridoio cieco
          testo: |
            Le impronte si confondono con le tue, e finisci in un corridoio di
            botti chiuso contro il muro.
          effetti: { tormento: 1 }
      - testo: "Spostare le botti per fare strada"
        descrizione: "Pesano e fanno rumore, ma la strada la fai tu."
        costo: 2
        esito:
          titolo: Le doghe
          testo: |
            Rotoli via tre botti, e la terza ti scivola sul piede. Passi
            zoppicando, con l'odore del pesce salato dentro la camicia.
          effetti: { profondita.maison-magazzini-del-ponte-del-pesce: 1, ferite: 0.5 }

  # ------------------------------------------------------------ 2 · la ghiacciaia
  - id: maison-magazzini-la-ghiacciaia
    immagine: ambientazione/ponti-sospesi
    titolo: La ghiacciaia
    sommario: "Una grotta con il ghiaccio della montagna ancora dentro, da attraversare."
    luogo: I magazzini del Ponte del Pesce, la ghiacciaia
    area: maison-magazzini-del-ponte-del-pesce
    ripetibile: true
    requisiti: [fazione.maison == 13, profondita.maison-magazzini-del-ponte-del-pesce == 2]
    testo: |
      La ghiacciaia è una grotta scavata nella roccia, con il ghiaccio della
      montagna ancora lì in blocchi coperti di paglia marcia. Il freddo ti
      afferra appena passi la porta. Dall'altra parte, in alto, c'è una
      porticina di legno con la luce sotto.

      {resistenza Media} Venti passi in questo freddo si fanno, purché
      nessuno ti chieda di fermarti a metà.
    opzioni:
      - testo: "Attraversarla senza fermarti"
        descrizione: "Venti passi sul ghiaccio, con il mento nel colletto."
        prova: { attributo: fisico, abilita: [resistenza, atletica], difficolta: Media }
        successo:
          titolo: Venti passi
          testo: |
            Attraversi a passo svelto con le mani sotto le ascelle, e al ventesimo
            passo scaldi le dita sul legno della porticina.
          effetti: { profondita.maison-magazzini-del-ponte-del-pesce: 1 }
        fallimento:
          titolo: Il blocco di ghiaccio
          testo: |
            Scivoli su un blocco nascosto dalla paglia e cadi sulla brina, e torni
            indietro gattonando con i denti che battono.
          effetti: { ferite: 0.5 }
      - testo: "Camminare sulla paglia, lungo la parete"
        descrizione: "Sulla paglia si scivola meno che sul ghiaccio."
        prova: { attributo: mentale, abilita: [natura, percezione], difficolta: Media }
        successo:
          titolo: La paglia
          testo: |
            Cammini sulla paglia lungo la parete, dove i blocchi sono più bassi, e
            arrivi alla porticina con i piedi gelati ma interi.
          effetti: { profondita.maison-magazzini-del-ponte-del-pesce: 1 }
        fallimento:
          titolo: Sotto la paglia
          testo: |
            Sotto la paglia c'è un buco d'acqua gelata, e ci metti il piede fino
            alla caviglia. Torni indietro a vuotare lo stivale, con un piede che
            non senti più.
          effetti: { ferite: 0.5 }
      - testo: "Bruciare la paglia per scaldarti la strada"
        descrizione: "Un po' di fuoco e di fumo, e dall'altra parte qualcuno se ne accorge."
        costo: 2
        esito:
          titolo: Il fumo
          testo: |
            La paglia accesa riempie la ghiacciaia di un fumo acre, e attraversi
            in fretta con gli occhi che lacrimano mentre il ghiaccio comincia a
            gocciolare.
          effetti: { profondita.maison-magazzini-del-ponte-del-pesce: 1, ferite: 0.5 }

  # ------------------------------------------------------------ 2-3 · le arcate sul vuoto
  - id: maison-magazzini-le-arcate
    immagine: ambientazione/ponti-sospesi
    titolo: Le arcate sul vuoto
    sommario: "Al piano alto si arriva su una trave sola sospesa sopra il canale."
    luogo: I magazzini del Ponte del Pesce, sotto le arcate
    area: maison-magazzini-del-ponte-del-pesce
    ripetibile: true
    requisiti: [fazione.maison == 13, profondita.maison-magazzini-del-ponte-del-pesce >= 2, profondita.maison-magazzini-del-ponte-del-pesce <= 3]
    testo: |
      Il piano alto è costruito a sbalzo sotto le arcate, e per arrivarci
      c'è una sola trave larga quanto due piedi. Sotto c'è il canale, e più
      sotto la nebbia della Cicatrice.

      {acrobazia Media} La trave è solida nel mezzo e marcia alle estremità,
      quindi si passa veloci sui bordi e piano al centro, al contrario di
      quello che dicono le gambe.
    opzioni:
      - testo: "Passare sulla trave"
        descrizione: "Due piedi di legno sopra il vuoto, con il vento di lato."
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Media }
        successo:
          titolo: La trave
          testo: |
            Passi veloce sul bordo marcio e rallenti al centro con le braccia
            larghe, e dall'altra parte ti accorgi di avere tenuto i pugni chiusi
            per tutta la traversata.
          effetti: { profondita.maison-magazzini-del-ponte-del-pesce: 1 }
        fallimento:
          titolo: Il bordo marcio
          testo: |
            Il bordo della trave si sbriciola e resti appeso con le mani sopra il
            canale. Torni indietro a forza di braccia, con un taglio sul palmo.
          effetti: { ferite: 0.5 }
      - testo: "Legarti alla corda del montacarichi"
        descrizione: "La corda del vecchio montacarichi, legata in vita, ti tiene se cadi."
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Media }
        successo:
          titolo: La corda
          testo: |
            Ti leghi la corda in vita con un nodo da barcaiolo, e quando a metà
            scivoli la corda ti tiene. Arrivi dall'altra parte appeso come un
            sacco, ma intero.
          effetti: { profondita.maison-magazzini-del-ponte-del-pesce: 1 }
        fallimento:
          titolo: Il nodo
          testo: |
            Il nodo si scioglie al primo strattone, e quando ci riprovi scopri che
            la corda è marcia. Lasci perdere con le mani che tremano.
          effetti: { tormento: 1 }
      - testo: "Strisciare sulla trave a cavalcioni"
        descrizione: "Il vuoto non guarda la dignità."
        costo: 2
        esito:
          titolo: A cavalcioni
          testo: |
            Passi la trave a cavalcioni, un palmo alla volta, e arrivi con le
            cosce scorticate.
          effetti: { profondita.maison-magazzini-del-ponte-del-pesce: 1, ferite: 0.5 }

  # ------------------------------------------------------------ 3 · la stanza delle copie
  - id: maison-magazzini-la-stanza-delle-copie
    immagine: ambientazione/ponti-sospesi
    titolo: La stanza delle copie
    sommario: "Decine di pagine stese ad asciugare su uno spago, dove qualcuno ricopia un libro."
    luogo: I magazzini del Ponte del Pesce, il piano alto
    area: maison-magazzini-del-ponte-del-pesce
    ripetibile: true
    requisiti: [fazione.maison == 13, profondita.maison-magazzini-del-ponte-del-pesce == 3]
    testo: |
      In una stanza di legno sul canale c'è un leggio con un lume a olio, e da
      una parete all'altra corre uno spago con decine di pagine appese con le
      mollette da bucato, ognuna con un nome in cima e le date sotto. Dalla
      stanza accanto arriva una voce bassa che conta.

      {accademiche Media} La calligrafia imita una mano più esperta, e chi
      copia non sa ancora fare le maiuscole come lei.
    opzioni:
      - testo: "Staccare le pagine e metterle via"
        descrizione: "Se le porti via, almeno queste pagine non arriveranno sotto nessuna porta."
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Media }
        successo:
          titolo: Le mollette
          testo: |
            Stacchi le pagine una per una e le infili nella camicia senza
            leggerle, mentre la voce di là continua a contare.
          effetti: { profondita.maison-magazzini-del-ponte-del-pesce: 1 }
        fallimento:
          titolo: Lo spago
          testo: |
            Lo spago viene giù tutto insieme e la voce di là smette di contare.
            Aspetti dietro la porta che riprenda, con le pagine sparse sul
            pavimento.
          effetti: { sospetto: 1 }
      - testo: "Leggere le copie per capire chi le fa"
        descrizione: "Una calligrafia imparata da un'altra, e si capisce da chi."
        prova: { attributo: mentale, abilita: [accademiche, percezione], difficolta: Media }
        successo:
          titolo: Le maiuscole
          testo: |
            Le maiuscole sono quelle di Rozalia Marga, imitate male. Chi copia ha
            davanti il libro di Vesh, e lo ricopia una pagina alla volta perché il
            libro non esca mai da qui.
          effetti: { profondita.maison-magazzini-del-ponte-del-pesce: 1 }
        fallimento:
          titolo: Il lume
          testo: |
            Ti avvicini troppo al lume e una pagina prende fuoco da un angolo. La
            spegni con le dita, bruciandoti i polpastrelli.
          effetti: { ferite: 0.5 }
      - testo: "Passare oltre senza guardare"
        descrizione: "Tu vai dove c'è il libro."
        costo: 2
        esito:
          titolo: Senza guardare
          testo: |
            Passi sotto lo spago a testa bassa, e una molletta ti strappa una
            ciocca. Davanti a te c'è una porta con la luce sotto.
          effetti: { profondita.maison-magazzini-del-ponte-del-pesce: 1, ferite: 0.5 }

  # ------------------------------------------------------------ 3 · la scala dei pescatori
  - id: maison-magazzini-la-scala-dei-pescatori
    immagine: ambientazione/ponti-sospesi
    titolo: La scala dei pescatori
    sommario: "Una scala di corda pende dal piano alto verso il canale, quella dei pescatori."
    luogo: I magazzini del Ponte del Pesce, il lato del canale
    area: maison-magazzini-del-ponte-del-pesce
    ripetibile: true
    requisiti: [fazione.maison == 13, profondita.maison-magazzini-del-ponte-del-pesce == 3]
    testo: |
      Una scala di corda pende dalla finestra del piano più alto fino al
      balconcino di legno dove sei tu. La usavano i pescatori per salire con
      le reti, e la corda ha nodi nuovi accanto ai vecchi.

      {armi-da-distanza Facile} Chi stesse alla finestra in alto ti vedrebbe
      salire come un bersaglio da fiera.
    opzioni:
      - testo: "Salire la scala di corda"
        descrizione: "Mani, piedi, ritmo, senza guardare il canale."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Media }
        successo:
          titolo: I venti pioli
          testo: |
            Sali i venti pioli col ritmo di un pescatore, e alla finestra senti
            qualcuno che detta piano dei nomi.
          effetti: { profondita.maison-magazzini-del-ponte-del-pesce: 1 }
        fallimento:
          titolo: Il nodo vecchio
          testo: |
            Al dodicesimo piolo un nodo vecchio cede, e torni giù sul balconcino
            con le palme in fiamme.
          effetti: { ferite: 0.5 }
      - testo: "Aspettare che il vento cali"
        descrizione: "Il vento sul canale non si ferma mai del tutto."
        prova: { attributo: mentale, abilita: [natura, resilienza], difficolta: Media }
        successo:
          titolo: La calma
          testo: |
            Aspetti finché il vento cala, come a ogni cambio di marea, e sali nei
            pochi minuti di calma.
          effetti: { profondita.maison-magazzini-del-ponte-del-pesce: 1 }
        fallimento:
          titolo: Il vento
          testo: |
            La calma non arriva, e quando ti decidi a salire hai le mani rigide di
            freddo.
          effetti: { tormento: 1 }
      - testo: "Salire con lentezza, un piolo per volta"
        descrizione: "Ci metti il triplo, ma arrivi."
        costo: 2
        esito:
          titolo: Il triplo
          testo: |
            Sali fermandoti a ogni raffica con la guancia contro la parete, e
            arrivi in cima con i polpacci che tremano.
          effetti: { profondita.maison-magazzini-del-ponte-del-pesce: 1, ferite: 0.5 }

  # ------------------------------------------------------------ il cuore · lo scrittoio dei Ferrante
  - id: maison-magazzini-lo-scrittoio
    immagine: ambientazione/ponti-sospesi
    titolo: Lo scrittoio dei Ferrante
    sommario: "In una stanza sospesa sul canale i fratelli Ferrante hanno uno scrittoio, e sopra il libro di Vesh."
    luogo: I magazzini del Ponte del Pesce, lo scrittoio
    area: maison-magazzini-del-ponte-del-pesce
    requisiti: [fazione.maison == 13, profondita.maison-magazzini-del-ponte-del-pesce >= 4]
    testo: |
      L'ultima stanza dei magazzini è sospesa sul canale, e fra le tavole del
      pavimento si vede l'acqua. In mezzo c'è uno scrittoio da notaio, troppo
      bello per questo posto, e sopra, aperto, un libro rilegato in pelle
      nera con gli angoli d'ottone. È il libro di Mirko Vesh.

      Dario Ferrante, le dita macchiate d'inchiostro e il quaderno dei conti
      accanto, copia una pagina con la lingua fra i denti. Suo fratello
      Lazzaro è appoggiato alla porta con un gancio da stiva legato al polso,
      e due bravi con i randelli siedono su una cassa.

      {intimidire Media} Dario ha paura dello sceriffo da quando, la notte
      della Pignatta, ha visto Galdrick sfondare la porta della taverna.

      {rissa Media} Il gancio da stiva è fatto per le casse, e con le persone
      è lento, mentre i due bravi sono svegli.

      Dario alza la testa. «È roba trovata nella cenere» dice, con molta
      calma. «Chi trova una cosa e la vende fa commercio.»
    opzioni:
      - testo: "Affrontarli"
        descrizione: "Lazzaro con il gancio e due bravi, in una stanza di tavole sospesa sul canale."
        combattimento: maison-lo-scrittoio-dei-ferrante
        vittoria:
          titolo: Il gancio da stiva
          testo: |
            Lazzaro va giù per ultimo, con il gancio piantato nel pavimento e una
            gamba in una fessura fra le tavole, mentre i bravi sono già scappati
            per la scala dei pescatori. Dario non ti ferma quando prendi il libro,
            e chiude il calamaio con cura, come uno che ha finito la giornata.
          pe: { armi-da-mischia: 10 }
          imposta: { maison.ferrante: 4 }
          effetti: { rep.maison: 1, monete: 100, informazioni.pettegolezzo: 2, fazione.maison: 1 }
          vai: citta-bassa
        sconfitta:
          titolo: La pagina che esce
          testo: |
            Il gancio di Lazzaro ti sbatte contro la parete, e i bravi fanno il
            resto. I fratelli scappano per la scala dei pescatori con il quaderno
            e le copie fresche, lasciando il libro sullo scrittoio, e nei giorni
            dopo qualche pagina arriva ancora sotto le porte dei Quartieri Alti.
          imposta: { maison.ferrante: 2 }
          effetti: { ferite: 1.5, rep.maison: -0.5, fazione.maison: 1 }
          vai: citta-bassa
      - testo: "Parlare a Dario dello sceriffo"
        descrizione: "La paura che Dario ha di Galdrick può fargli chiudere il libro da solo."
        prova: { attributo: sociale, abilita: [persuasione, intimidire], difficolta: Difficile }
        successo:
          titolo: La porta della taverna
          testo: |
            Gli parli dell'uomo che ha sfondato la porta della Pignatta, e gli dici che
            domani quell'uomo saprà da te dove trovare lo scrittoio. Dario guarda il
            fratello e te lo porge chiuso con due mani, mentre Lazzaro non si muove dalla
            porta.
          pe: { persuasione: 10 }
          imposta: { maison.ferrante: 4 }
          effetti: { rep.maison: 1, monete: 100, informazioni.pettegolezzo: 2, fazione.maison: 1 }
          vai: citta-bassa
        fallimento:
          titolo: Commercio
          testo: |
            Dario sorride e ti dice che lo sceriffo è un uomo molto occupato.
            Lazzaro ti sbatte contro la parete, e mentre ti rialzi i fratelli
            scappano dalla finestra con le copie e il quaderno. Il libro resta
            sullo scrittoio, ma qualche pagina arriverà lo stesso sotto una porta.
          imposta: { maison.ferrante: 2 }
          effetti: { ferite: 1, sospetto: 1, rep.maison: -0.5, fazione.maison: 1 }
          vai: citta-bassa
      - testo: "Spendere un favore della signora"
        descrizione: "Il nome di Nerissa Dalvane apre anche le porte del Ponte del Pesce."
        requisiti: [maison.favori >= 1]
        prova: { attributo: sociale, abilita: [persuasione, intimidire], difficolta: Media }
        successo:
          titolo: A nome della signora
          testo: |
            Gli dici che la signora ha un debito da riscuotere con chiunque venda
            i nomi della sua casa, e Dario impallidisce, perché in Città Bassa
            tutti sanno che cosa vuol dire. Ti porge il libro, e alla porta
            Lazzaro si toglie il gancio dal polso.
          pe: { persuasione: 10 }
          imposta: { maison.ferrante: 4 }
          effetti: { maison.favori: -1, rep.maison: 1, monete: 100, informazioni.pettegolezzo: 2, fazione.maison: 1 }
          vai: citta-bassa
        fallimento:
          titolo: Il nome speso male
          testo: |
            Dario ti chiede con garbo che cosa pensa la signora dei ricatti, visto
            che li fa anche lei, e tu esiti. Lazzaro ti spinge giù per la scala
            dei pescatori, e quando risali i fratelli sono spariti con le copie e
            il quaderno, lasciando il libro sullo scrittoio.
          imposta: { maison.ferrante: 2 }
          effetti: { maison.favori: -1, ferite: 1, rep.maison: -0.5, fazione.maison: 1 }
          vai: citta-bassa
      - testo: "Aspettare che Dario si addormenti e prendere il libro"
        descrizione: "Dario copia fino all'alba e a una certa ora crolla sullo scrittoio."
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Difficile }
        successo:
          titolo: La testa sul libro
          testo: |
            Aspetti appeso alla scala dei pescatori finché Dario si addormenta con
            la guancia sulla pagina. Gli sfili il libro da sotto la guancia e gli
            lasci il quaderno dei conti, e all'alba sei già sul Ponte del Pesce.
          pe: { furtivita: 10 }
          imposta: { maison.ferrante: 4 }
          effetti: { rep.maison: 1, monete: 100, informazioni.pettegolezzo: 2, fazione.maison: 1 }
          vai: citta-bassa
        fallimento:
          titolo: La tavola che scricchiola
          testo: |
            La terza tavola scricchiola e Dario si sveglia gridando. Afferri il
            libro e ti butti fuori dalla finestra, mentre i fratelli scappano
            dall'altra parte con le copie, e qualche pagina uscirà lo stesso.
          imposta: { maison.ferrante: 2 }
          effetti: { sospetto: 1.5, rep.maison: -0.5, fazione.maison: 1 }
          vai: citta-bassa
      - testo: "Parlargli con la Voce di seta"
        descrizione: "Dario è stanco e vorrebbe smettere, e con il Mana sotto le parole l'idea sembrerà sua."
        incantesimo: maison-voce-di-seta
        prova: { attributo: mentale, abilita: magia, difficolta: Difficile }
        successo:
          titolo: Un'idea sua
          testo: |
            Gli dici piano che è stanco di copiare e che il libro porta guai.
            Dario posa la penna e ti porge il libro chiuso, stropicciandosi gli
            occhi come uno che si sveglia, mentre Lazzaro guarda il fratello senza
            capire.
          pe: { magia: 10 }
          imposta: { maison.ferrante: 4 }
          effetti: { rep.maison: 1, monete: 100, informazioni.pettegolezzo: 2, fazione.maison: 1 }
          vai: citta-bassa
        fallimento:
          titolo: La penna
          testo: |
            Il Mana ti sfugge, e Dario sente soltanto una voce strana che gli dice
            di smettere. Nel parapiglia i fratelli scappano per la scala dei
            pescatori con le copie e il quaderno, e il libro resta sullo scrittoio,
            ma qualche pagina uscirà lo stesso.
          imposta: { maison.ferrante: 2 }
          effetti: { ferite: 1, tormento: 1, rep.maison: -0.5, fazione.maison: 1 }
          vai: citta-bassa

colonna:
  - { contesto: area, id: maison-magazzini-del-ponte-del-pesce, musica: our-wounds-our-crown, ambiente: rain-in-town }
