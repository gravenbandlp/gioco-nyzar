# La quest della Maison des Lunes, passo 14: la spedizione «I magazzini del Ponte del Pesce»
# (`maison-magazzini-del-ponte-del-pesce`, ritorno citta-bassa, soglia 4). Ci si entra da `maison-la-terza-arcata`
# (passi-3.yaml). Tutte le stanze chiedono fazione.maison == 13. Le fasce di profondità:
# 0 la riva e le chiatte (Atletica, o un barcaiolo da pagare) e la porta del sale (Furtività); 1 il bravo che dorme
# (Furtività o uno scontro); 1-2 la stanza dei conti (Politica ed economia; chi ha il cristallo accoppiato con una
# carica lo lascia lì e sente dove sono i fratelli, una stanza in meno, ½ Sospetto) e le botti del pesce salato;
# 2 la ghiacciaia (Resistenza); 2-3 le arcate sul vuoto (Acrobazia); 3 la stanza delle copie e la scala dei pescatori.
# In ogni stanza c'è la via senza prova: due rintocchi e mezza Ferita.
# Il cuore a 4 è lo scrittoio dei Ferrante, boss Difficile: lo scontro con Lazzaro e due bravi, Persuasione su Dario
# (Media spendendo un favore della signora), Furtività per prendere il libro mentre Dario dorme, Voce di seta. Chi
# riesce porta maison.ferrante a 4 e il passo a 14; chi fallisce prende Ferite o Sospetto, una pagina esce
# (rep.maison −½), i fratelli scappano con le copie (maison.ferrante 2) e il libro resta a te: il passo va avanti.
# In fondo al file, la musica e l'ambiente dell'area (colonna sonora).
aree:
  - id: maison-magazzini-del-ponte-del-pesce
    immagine: ambientazione/ponti-sospesi
    nome: I magazzini del Ponte del Pesce
    sommario: "I vecchi magazzini del pesce salato, metà dentro la roccia sotto l'arco di pietra rossa e metà sospesi sul vuoto."
    spedizione: { ritorno: citta-bassa, soglia: 4, stanze: 3 }
    testo: |
      Sotto l'arco di pietra rossa del Ponte del Pesce i magazzini del pesce salato si arrampicano sulla
      roccia per tre piani. Le stanze basse sono scavate nella pietra e quelle alte sono di legno, a sbalzo
      sul vuoto su travi di nave infilate nella roccia. Fra una stanza e l'altra corrono passerelle e scale a
      pioli. Sotto scorre il canale nero, e più giù ancora c'è il buio della Cicatrice.

      Il sale è entrato nei muri. Ti brucia sulle labbra e lascia su ogni cosa una patina bianca, anche sul
      legno chiaro dei gradini rifatti da poco.

storylet:
  # ------------------------------------------------------------ 0 · la riva e le chiatte
  - id: maison-magazzini-la-riva
    immagine: ambientazione/ponti-sospesi
    titolo: La riva e le chiatte
    sommario: "Due chiatte legate alla stessa bitta, e dalla seconda una scala a pioli che sale fino ai magazzini."
    luogo: I magazzini del Ponte del Pesce, la riva
    area: maison-magazzini-del-ponte-del-pesce
    ripetibile: true
    requisiti: [fazione.maison == 13, profondita.maison-magazzini-del-ponte-del-pesce == 0]
    testo: |
      Sulla riva del canale due chiatte sono legate alla stessa bitta di pietra, e la seconda tocca con la
      prua la parete dei magazzini. Ogni volta che l'acqua la spinge il legno della prua sfrega contro la
      roccia, nel punto dove la pietra è diventata liscia e più chiara del resto. Da lì una scala a pioli
      inchiodata alla roccia sale a una porta di carico. I montanti sono neri di sale e i pioli sono di legno
      nuovo, con i chiodi ancora lucidi.

      Sulla prima chiatta dorme un barcaiolo sotto una coperta, con un piede fuori. La chiatta è vuota e non
      ha nemmeno una rete.

      {conoscenze-della-strada Facile} Un barcaiolo che dorme sulla chiatta di qualcun altro è pagato per
      dormire lì, e per il doppio si sveglia.
    opzioni:
      - testo: "Saltare da una chiatta all'altra"
        descrizione: "Un passo e mezzo d'acqua nera. Bisogna saltare quando la seconda chiatta viene verso di te, non quando si allontana."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Media }
        successo:
          titolo: Il salto
          testo: |
            Aspetti che la seconda chiatta oscilli verso di te e salti, e atterri sul ponte bagnato con le
            ginocchia piegate, senza un rumore. Il barcaiolo si gira sotto la coperta e continua a dormire.
            Sali la scala a pioli fino alla porta di carico, e i pioli nuovi reggono il tuo peso senza
            flettersi.
          effetti: { profondita.maison-magazzini-del-ponte-del-pesce: 1 }
        fallimento:
          titolo: L'acqua nera
          testo: |
            Salti quando la chiatta si allontana, e finisci nel canale fino al petto. L'acqua è così fredda
            che ti toglie il fiato, e sotto i piedi trovi soltanto un fango molle che cede. Il barcaiolo si
            sveglia e ti tira su con la gaffa ridendo, poi ti rimanda a riva bagnat{o|a} e con le labbra
            viola.
          effetti: { ferite: 0.5 }
      - testo: "Pagare il barcaiolo perché ti porti alla scala"
        descrizione: "Si sveglia per il doppio. Con una moneta in più si dimentica anche di averti visto."
        requisiti: [monete >= 6]
        esito:
          titolo: La gaffa
          testo: |
            Gli tocchi il piede con la punta dello stivale e gli fai vedere le monete. Il barcaiolo le conta
            senza alzarsi e le fa scorrere sul palmo con il pollice. Poi sposta la chiatta con la gaffa fino
            alla scala a pioli, e torna a dormire prima che tu sia arrivat{o|a} in cima.
          effetti: { monete: -6, profondita.maison-magazzini-del-ponte-del-pesce: 1 }
      - testo: "Fare il giro dalla riva, fra gli scogli"
        descrizione: "Lungo il canale c'è una striscia di scogli bagnati che arriva sotto la scala. Lunga e scivolosa."
        costo: 2
        esito:
          titolo: Gli scogli
          testo: |
            Fai il giro dagli scogli, con l'acqua che ti bagna le caviglie e il sale che ti brucia i tagli
            sulle mani. Sotto la patina bianca la roccia ha spigoli vivi che ti aprono la pelle a ogni presa.
            Arrivi sotto la scala a pioli con un ginocchio sbucciato e i calzoni fradici.
          effetti: { profondita.maison-magazzini-del-ponte-del-pesce: 1, ferite: 0.5 }

  # ------------------------------------------------------------ 0 · la porta del sale
  - id: maison-magazzini-la-porta-del-sale
    immagine: ambientazione/ponti-sospesi
    titolo: La porta del sale
    sommario: "La porta da cui entravano i sacchi di sale ha un catenaccio vecchio e un campanello nuovo."
    luogo: I magazzini del Ponte del Pesce, la porta del sale
    area: maison-magazzini-del-ponte-del-pesce
    ripetibile: true
    requisiti: [fazione.maison == 13, profondita.maison-magazzini-del-ponte-del-pesce == 0]
    testo: |
      La porta del sale è una porta doppia di legno di nave, con un catenaccio arrugginito che nessuno chiude
      più da anni. Le assi hanno ancora la curva del fasciame. Fra un'asse e l'altra c'è una stoppa nera di
      pece. Sopra lo stipite qualcuno ha appeso un campanello d'ottone legato a un filo che corre lungo il
      battente. L'ottone è lucido e senza una macchia di verde, ed è l'unica cosa pulita su tutta la porta.
      Chi apre la porta lo fa suonare, e chi è dentro lo sente.

      {furtivita Media} Il filo è teso ma sottile, ritorto di più capi. Con una lama e molta pazienza si
      taglia un capo alla volta, purché tu tenga il campanello con l'altra mano.
    opzioni:
      - testo: "Tagliare il filo tenendo fermo il campanello"
        descrizione: "Una mano sul campanello, l'altra con la lama. Lentamente."
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Media }
        successo:
          titolo: Il campanello muto
          testo: |
            Tieni il campanello fra le dita come un uccellino e tagli il filo con la punta della lama, un
            filamento alla volta. Il campanello ti resta in mano muto, con il batacchio stretto contro il
            palmo. Lo appoggi per terra con delicatezza ed entri dalla porta del sale, dove l'aria sa di
            salamoia vecchia e di legno bagnato.
          effetti: { profondita.maison-magazzini-del-ponte-del-pesce: 1 }
        fallimento:
          titolo: Il din
          testo: |
            Il filo cede tutto insieme e il campanello ti sfugge dalle dita, con un din che rimbomba nei
            magazzini come in una chiesa. Il suono ti torna indietro due volte dalle stanze scavate nella
            roccia, sempre più debole. Ti appiatti contro il muro e aspetti a lungo, e nessuno viene. Quando
            ci riprovi hai le mani sudate e il campanello è finito nel canale.
          effetti: { sospetto: 1 }
      - testo: "Smontare il campanello dallo stipite"
        descrizione: "Un chiodo e un gancio. Chi l'ha montato aveva fretta."
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Media }
        successo:
          titolo: Il gancio
          testo: |
            Il gancio del campanello è infilato in un chiodo storto, e basta sollevarlo di un dito per
            liberarlo. Il chiodo è nuovo e piantato di sbieco, con due colpi di martello mancati accanto alla
            testa. Lo appoggi per terra con il filo ancora attaccato e apri la porta del sale senza un rumore.
          effetti: { profondita.maison-magazzini-del-ponte-del-pesce: 1 }
        fallimento:
          titolo: Il chiodo
          testo: |
            Il chiodo è più storto di come sembrava, e quando tiri il gancio viene via mezza cornice di legno
            marcio. Dentro il legno è grigio e spugnoso, e ti resta fra le dita in briciole umide. Il
            campanello resta appeso, per fortuna muto. Ti sei piantat{o|a} una scheggia sotto l'unghia.
          effetti: { ferite: 0.5 }
      - testo: "Cercare un'altra porta, sul retro"
        descrizione: "I magazzini hanno molte porte. Qualcuna non avrà il campanello."
        costo: 2
        esito:
          titolo: La finestra bassa
          testo: |
            Giri intorno ai magazzini fra cumuli di nasse marce, con il vimini nero e sfondato che scricchiola
            quando lo scavalchi. Dietro trovi una finestra bassa senza vetro. Ci passi strisciando, e il
            davanzale ti graffia la schiena attraverso la camicia.
          effetti: { profondita.maison-magazzini-del-ponte-del-pesce: 1, ferite: 0.5 }

  # ------------------------------------------------------------ 1 · il bravo che dorme
  - id: maison-magazzini-il-bravo-che-dorme
    immagine: ambientazione/ponti-sospesi
    titolo: Il bravo che dorme
    sommario: "In mezzo alle vasche vuote del sale un uomo grosso dorme su una sedia, con un randello sulle ginocchia."
    luogo: I magazzini del Ponte del Pesce, le vasche del sale
    area: maison-magazzini-del-ponte-del-pesce
    ripetibile: true
    requisiti: [fazione.maison == 13, profondita.maison-magazzini-del-ponte-del-pesce == 1]
    testo: |
      Nella stanza dove una volta si salava il pesce le vasche di pietra sono vuote e bianche di sale secco.
      Sul fondo il sale ha fatto una crosta spessa un dito, segnata da righe orizzontali dove l'acqua è calata
      piano prima di sparire. In mezzo dorme un uomo grosso su una sedia inclinata contro una colonna, e russa
      con un fischio a ogni respiro. Sulle ginocchia ha un randello di legno di nave che è un pezzo di
      ordinata, con i buchi dei chiodi ancora dentro e l'impugnatura nera di mani. La porta dall'altra parte è
      proprio dietro la sua sedia.

      {rissa Media} Tutto il suo peso sta sullo schienale, e per alzarsi deve prima riportare a terra le gambe
      della sedia. Uno così ci mette un momento a capire dov'è quando si sveglia di colpo, ed è l'unico
      momento che hai per stenderlo.
    opzioni:
      - testo: "Passargli accanto senza svegliarlo"
        descrizione: "Sul sale secco ogni passo scricchiola. Bisogna camminare sul bordo delle vasche."
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Media }
        successo:
          titolo: Il bordo delle vasche
          testo: |
            Cammini sul bordo di pietra delle vasche, dove il sale non c'è, con le braccia larghe come un
            equilibrista. Il bordo è largo quanto il tuo piede e consumato al centro da chi ci girava intorno
            con i secchi. Passi a un palmo dalla sedia del bravo, che nel sonno si gratta il naso. La porta
            dietro di lui si apre senza un cigolio.
          effetti: { profondita.maison-magazzini-del-ponte-del-pesce: 1 }
        fallimento:
          titolo: Lo scricchiolio
          testo: |
            Metti un piede sul sale secco, e la crosta si rompe sotto il tallone con uno schiocco che rimbalza
            sulle vasche vuote. Il bravo si sveglia a metà di un russare. Si alza con il randello in mano e ti
            insegue fino alla porta da cui sei entrat{o|a}, dove ti arriva un colpo sulla spalla prima che tu
            riesca a chiuderla.
          effetti: { ferite: 0.5 }
      - testo: "Stenderlo prima che si svegli"
        descrizione: "Un bravo dei Ferrante mezzo addormentato. Ha un randello, e lo sa usare."
        combattimento: maison-il-bravo-che-dorme
        vittoria:
          titolo: Il randello
          testo: |
            Il bravo si sveglia con te già addosso e ci mette troppo a capire che cosa succede. Finisce lungo
            disteso in una vasca vuota, in una nuvola di sale, e tossisce con il sale bianco sulle ciglia. Gli
            leghi i polsi dietro la schiena con la sua cintura e prosegui.
          effetti: { profondita.maison-magazzini-del-ponte-del-pesce: 1 }
        sconfitta:
          titolo: Il risveglio
          testo: |
            Il bravo si sveglia prima del previsto, e il randello di legno di nave fa il resto. Il primo colpo
            ti prende sul braccio alzato, e il secondo non lo vedi. Ti ritrovi fuori dalla stanza delle
            vasche, con il sale negli occhi e un bernoccolo che pulsa.
          effetti: { ferite: 1 }
      - testo: "Aspettare che si sposti"
        descrizione: "Prima o poi avrà sete o dovrà andare a fare un giro, e le tue gambe aspetteranno con te."
        costo: 2
        esito:
          titolo: La sete
          testo: |
            Aspetti dietro una vasca per un tempo lunghissimo, con le gambe rattrappite e il sale che ti
            brucia le labbra. Alla fine il bravo si alza per andare a bere a un barile in fondo alla stanza.
            Beve con il mestolo e fa un gran rumore, che copre i tuoi passi sul sale. Passi mentre beve, con
            le gambe che a ogni passo ti reggono a fatica.
          effetti: { profondita.maison-magazzini-del-ponte-del-pesce: 1, ferite: 0.5 }

  # ------------------------------------------------------------ 1-2 · la stanza dei conti
  - id: maison-magazzini-la-stanza-dei-conti
    immagine: fazioni/gilda-dei-mercanti
    titolo: La stanza dei conti
    sommario: "Su un tavolo di legno c'è un quaderno aperto, e accanto una fila di borse vuote con un nome scritto sopra."
    luogo: I magazzini del Ponte del Pesce, la stanza dei conti
    area: maison-magazzini-del-ponte-del-pesce
    ripetibile: true
    requisiti: [fazione.maison == 13, profondita.maison-magazzini-del-ponte-del-pesce >= 1, profondita.maison-magazzini-del-ponte-del-pesce <= 2]
    testo: |
      In una stanzetta sul canale c'è un tavolo di legno con un quaderno aperto e un calamaio. Il tavolo è un
      portello di stiva appoggiato su due botti, e dalle fessure del muro di tavole entra la luce grigia del
      canale. Accanto c'è una fila di borse di tela vuote con un nome scritto a carbone, e alla parete sono
      inchiodati dei fogli con le date di consegna. La candela sul tavolo è spenta, e la cera intorno allo
      stoppino è ancora morbida sotto il dito.

      {politica-ed-economia Media} Le borse vuote sono quelle già pagate e i fogli inchiodati sono le pagine
      ancora da vendere. I nomi sono scritti in colonna con lo stesso spazio fra l'uno e l'altro, come nel
      registro di una bottega. Chi tiene questi conti sa quanto vale ogni nome.
    opzioni:
      - testo: "Leggere i conti e capire chi ha già pagato"
        descrizione: "I nomi di chi ha pagato, e di chi aspetta la pagina. Si leggono in fretta, se si sa dove guardare."
        prova: { attributo: mentale, abilita: [politica-ed-economia, percezione], difficolta: Media }
        successo:
          titolo: Chi ha pagato
          testo: |
            Scorri il quaderno con un dito, colonna per colonna. Undici persone hanno già pagato, e il mugnaio
            del giovedì due volte. Tre nomi hanno accanto una croce, e sono quelli che non hanno pagato e a
            cui hanno già mandato una seconda pagina. Le croci sono tracciate con un'altra penna e calcate
            così forte che la carta è bucata. Ti stampi i tre nomi in testa e lasci il quaderno aperto
            com'era.
          effetti: { profondita.maison-magazzini-del-ponte-del-pesce: 1, informazioni.pettegolezzo: 1 }
        fallimento:
          titolo: Il calamaio
          testo: |
            Sfogli il quaderno in fretta, e la manica ti urta il calamaio. L'inchiostro si allarga sulla
            pagina come una macchia di vino e ti resta nero sotto le unghie. Lo tamponi con un foglio, poi con
            la manica, e alla fine lasci perdere e torni indietro prima che qualcuno se ne accorga.
          effetti: { sospetto: 1 }
      - testo: "Lasciare in ascolto il cristallo accoppiato"
        descrizione: "La metà del cristallo nascosta fra le borse, e dall'altra metà, in tasca, senti dove parlano i fratelli."
        requisiti: [chiave.orecchio >= 1, maison.cariche >= 1]
        prova: { attributo: mentale, abilita: [magia, percezione], difficolta: Facile }
        successo:
          titolo: Le voci dei fratelli
          testo: |
            Nascondi la metà del cristallo fra le borse vuote, con la sua luce color miele coperta dalla tela,
            e ti allontani di qualche stanza. Dalla gabbietta in tasca arrivano le voci dei due fratelli che
            litigano su una pagina. Sotto le voci si sente il cigolio di una passerella e l'acqua che batte
            contro le tavole. Adesso sai da che parte stanno, e ci vai dritto, senza passare per le stanze in
            mezzo.
          effetti: { profondita.maison-magazzini-del-ponte-del-pesce: 2, maison.cariche: -1, sospetto: 1 }
        fallimento:
          titolo: Il silenzio
          testo: |
            Nascondi la metà del cristallo fra le borse, e dalla gabbietta in tasca arriva soltanto lo
            sciacquio sempre uguale del canale contro i pali. Quando torni a riprenderla la carica è
            consumata, e tu non sei più vicin{o|a} di prima.
          effetti: { maison.cariche: -1, sospetto: 1 }
      - testo: "Proseguire senza toccare niente"
        descrizione: "Il quaderno resta dov'è. Meglio la porta."
        costo: 2
        esito:
          titolo: La porta
          testo: |
            Esci dalla stanza dei conti senza toccare niente e prendi una passerella che corre lungo la parete
            esterna, sopra il canale. Le assi sono grigie e molli di umido, e i chiodi che le tengono il sale
            li ha ridotti a metà. Una ti si spacca sotto il tallone. Ti tieni alla corda e passi, con la
            caviglia storta.
          effetti: { profondita.maison-magazzini-del-ponte-del-pesce: 1, ferite: 0.5 }

  # ------------------------------------------------------------ 1-2 · le botti del pesce salato
  - id: maison-magazzini-le-botti
    immagine: ambientazione/ponti-sospesi
    titolo: Le botti del pesce salato
    sommario: "Una stanza piena di botti accatastate fino al soffitto. Una non puzza di pesce."
    luogo: I magazzini del Ponte del Pesce, la stanza delle botti
    area: maison-magazzini-del-ponte-del-pesce
    ripetibile: true
    requisiti: [fazione.maison == 13, profondita.maison-magazzini-del-ponte-del-pesce >= 1, profondita.maison-magazzini-del-ponte-del-pesce <= 2]
    testo: |
      Le botti del pesce salato sono accatastate fino al soffitto in file storte, con i cerchi di ferro
      arrugginiti e le doghe gonfie d'umido. Dalle commessure trasuda una salamoia scura che ha lasciato
      colature bianche fino al pavimento. Fra le file corrono corridoi stretti dove si passa di fianco.
      L'odore è così forte che dopo un po' smetti di sentirlo, e ti resta soltanto un bruciore in fondo al
      naso.

      {percezione Media} Una botte, in fondo a una fila, ha i cerchi lucidi e il coperchio pulito. Intorno al
      coperchio il legno ha una fila di tacche nello stesso punto, dove una lama fa leva sempre allo stesso
      modo. È l'unica che qualcuno apre spesso.
    opzioni:
      - testo: "Aprire la botte con i cerchi lucidi"
        descrizione: "Una botte che si apre spesso contiene qualcosa che serve spesso."
        prova: { attributo: mentale, abilita: [percezione, tecnologia], difficolta: Media }
        successo:
          titolo: La botte pulita
          testo: |
            Sollevi il coperchio con la punta della lama. Viene su senza fatica perché qualcuno ne ha unto il
            bordo di sego. Dentro, al posto del pesce, ci sono fogli di carta da copia arrotolati e legati con
            lo spago, decine, tutti bianchi. Sono le pagine che i fratelli devono ancora riempire. Ne prendi
            uno e lo usi per orientarti, perché sul retro qualcuno ha disegnato la pianta dei magazzini.
          effetti: { profondita.maison-magazzini-del-ponte-del-pesce: 1 }
        fallimento:
          titolo: La salamoia
          testo: |
            Sollevi il coperchio con la punta della lama, ma ti sbagli di botte, e la salamoia ti arriva sulle
            mani e sulla camicia. Dentro galleggiano pesci grigi e molli, con gli occhi diventati bianchi nel
            sale. L'odore non se ne andrà per giorni. Torni indietro fra le file storte con gli occhi che
            lacrimano.
          effetti: { ferite: 0.5 }
      - testo: "Passare fra le botti seguendo le impronte"
        descrizione: "Sul sale per terra ci sono impronte fresche. Vanno tutte nella stessa direzione."
        prova: { attributo: mentale, abilita: [percezione, natura], difficolta: Media }
        successo:
          titolo: Le impronte
          testo: |
            Le impronte sono di due persone, una con le scarpe grandi e una con gli stivali stretti, e vanno
            sempre nella stessa direzione. Sul sale i loro bordi sono ancora netti. Portano a una scala di
            legno in fondo alla stanza, e le segui fino ai gradini.
          effetti: { profondita.maison-magazzini-del-ponte-del-pesce: 1 }
        fallimento:
          titolo: Il corridoio cieco
          testo: |
            Segui le impronte, ma a un certo punto si confondono con le tue, e ti ritrovi in un corridoio di
            botti che finisce contro il muro. Torni indietro di fianco, e dove il legno gonfio si è aperto le
            doghe hanno schegge rialzate che ti graffiano le spalle.
          effetti: { tormento: 1 }
      - testo: "Spostare le botti per fare strada"
        descrizione: "Pesano, e fanno rumore. Ma la strada la fai tu."
        costo: 2
        esito:
          titolo: Le doghe
          testo: |
            Sposti tre botti rotolandole sul bordo una dopo l'altra. Ognuna pesa quanto un uomo, e dentro la
            salamoia sciaborda a ogni giro. La terza ti scivola e ti schiaccia il piede. Passi zoppicando, con
            l'odore del pesce salato ormai dentro la camicia.
          effetti: { profondita.maison-magazzini-del-ponte-del-pesce: 1, ferite: 0.5 }

  # ------------------------------------------------------------ 2 · la ghiacciaia
  - id: maison-magazzini-la-ghiacciaia
    immagine: ambientazione/ponti-sospesi
    titolo: La ghiacciaia
    sommario: "Una grotta scavata nella roccia, con il ghiaccio della montagna ancora dentro. Bisogna attraversarla."
    luogo: I magazzini del Ponte del Pesce, la ghiacciaia
    area: maison-magazzini-del-ponte-del-pesce
    ripetibile: true
    requisiti: [fazione.maison == 13, profondita.maison-magazzini-del-ponte-del-pesce == 2]
    testo: |
      La ghiacciaia è una grotta scavata nella roccia sotto l'arco, dove una volta si teneva il pesce fresco.
      Sulle pareti si vedono ancora i colpi fitti del piccone, e la brina ci si è posata dentro in righe
      bianche. Il ghiaccio è ancora lì in blocchi coperti di paglia marcia, e appena passi la porta senti il
      freddo. Nessuno porta ghiaccio quaggiù da anni, eppure i blocchi hanno ancora gli spigoli dritti. Ti
      dici che la roccia tiene il freddo come la cantina più profonda. Dall'altra parte, in alto, c'è una
      porticina di legno con la luce sotto.

      {resistenza Media} Il fiato ti esce in nuvole bianche già sulla soglia. È un freddo che entra prima
      nelle dita e poi nella testa. Venti passi si fanno, purché nessuno ti chieda di fermarti a metà.
    opzioni:
      - testo: "Attraversarla senza fermarti"
        descrizione: "Venti passi sul ghiaccio, con il mento nel colletto e le mani in tasca."
        prova: { attributo: fisico, abilita: [resistenza, atletica], difficolta: Media }
        successo:
          titolo: Venti passi
          testo: |
            Attraversi la ghiacciaia a passo svelto, con le mani sotto le ascelle e il mento nel colletto,
            contando i passi. Sotto le suole la brina cede con il rumore dello zucchero pestato. Al ventesimo
            sei alla porticina, con le dita che non senti più e la faccia che pizzica. Le scaldi sul legno
            della porta, che è più tiepido dell'aria.
          effetti: { profondita.maison-magazzini-del-ponte-del-pesce: 1 }
        fallimento:
          titolo: Il blocco di ghiaccio
          testo: |
            A metà strada scivoli su un blocco di ghiaccio sotto la paglia, e cadi di fianco sulla brina. Il
            freddo ti entra nella camicia tutto insieme, e la paglia gelata ti resta attaccata alla guancia.
            Torni indietro gattonando, con i denti che battono così forte da farti paura che ti sentano.
          effetti: { ferite: 0.5 }
      - testo: "Camminare sulla paglia, lungo la parete"
        descrizione: "La paglia marcia tiene meno freddo del ghiaccio. Dove c'è paglia, si scivola meno."
        prova: { attributo: mentale, abilita: [natura, percezione], difficolta: Media }
        successo:
          titolo: La paglia
          testo: |
            Cammini sulla paglia lungo la parete, dove i blocchi sono più bassi, e la paglia ti scricchiola
            sotto le suole come un letto vecchio. Sotto lo strato marcio è ancora gialla e asciutta, e il
            piede ci affonda senza scivolare. Arrivi alla porticina con i piedi gelati ma interi.
          effetti: { profondita.maison-magazzini-del-ponte-del-pesce: 1 }
        fallimento:
          titolo: Sotto la paglia
          testo: |
            Sotto la paglia c'è un buco d'acqua gelata, e ci metti il piede fino alla caviglia. L'acqua è nera
            e ferma, e il freddo ti arriva all'osso prima ancora del bagnato. Lo tiri fuori subito, ma lo
            stivale ormai è pieno. Torni indietro a vuotarlo, e il piede non lo senti più.
          effetti: { ferite: 0.5 }
      - testo: "Bruciare la paglia per scaldarti la strada"
        descrizione: "Un po' di fuoco, un po' di fumo, e dall'altra parte qualcuno se ne accorge."
        costo: 2
        esito:
          titolo: Il fumo
          testo: |
            Accendi un mucchio di paglia con la lanterna, e la ghiacciaia si riempie di un fumo acre che ti fa
            tossire. La paglia umida brucia con una fiamma bassa e gialla, e il fumo si stende sotto la volta.
            Attraversi in fretta con la manica sulla bocca. Dietro di te il ghiaccio comincia a gocciolare.
          effetti: { profondita.maison-magazzini-del-ponte-del-pesce: 1, ferite: 0.5 }

  # ------------------------------------------------------------ 2-3 · le arcate sul vuoto
  - id: maison-magazzini-le-arcate
    immagine: ambientazione/ponti-sospesi
    titolo: Le arcate sul vuoto
    sommario: "Per passare al piano alto dei magazzini c'è una trave sola appoggiata fra due arcate, sospesa sopra il canale e il buio."
    luogo: I magazzini del Ponte del Pesce, sotto le arcate
    area: maison-magazzini-del-ponte-del-pesce
    ripetibile: true
    requisiti: [fazione.maison == 13, profondita.maison-magazzini-del-ponte-del-pesce >= 2, profondita.maison-magazzini-del-ponte-del-pesce <= 3]
    testo: |
      Il piano alto dei magazzini sta a sbalzo sotto le arcate del Ponte del Pesce, appeso alla pietra rossa
      con staffe di ferro grosse come un braccio. Per arrivarci c'è soltanto una trave larga due piedi
      appoggiata da un'arcata all'altra. È una trave di nave squadrata a mano, con i fori dei perni vuoti a
      intervalli regolari. Sulle staffe dormono i colombi in fila, e tutti hanno la testa girata verso il
      ponte. Sotto c'è il canale, e più sotto ancora sale piano la nebbia della Cicatrice.

      {acrobazia Media} La trave è solida nel mezzo e marcia alle estremità, dove ha preso l'acqua che cola
      dalle arcate e il legno è scuro e spugnoso. Bisogna passare veloci sui bordi e piano al centro, al
      contrario di quello che ti dicono le gambe.
    opzioni:
      - testo: "Passare sulla trave"
        descrizione: "Due piedi di legno sopra il vuoto, il vento di lato. Veloci sui bordi, piano al centro."
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Media }
        successo:
          titolo: La trave
          testo: |
            Passi veloce sul bordo marcio e rallenti al centro, con le braccia larghe e gli occhi sul fondo
            della trave. Sotto il tuo peso il legno del bordo cede di un dito e poi tiene. Il vento ti tira la
            giacca. Quando metti il piede sull'altra arcata ti accorgi di avere tenuto i pugni chiusi per
            tutta la traversata.
          effetti: { profondita.maison-magazzini-del-ponte-del-pesce: 1 }
        fallimento:
          titolo: Il bordo marcio
          testo: |
            Il bordo della trave ti si sbriciola sotto il piede, e resti aggrappat{o|a} con le mani mentre le
            gambe penzolano sul canale. Il legno marcio cade giù a pezzi, e il tonfo nell'acqua non lo senti.
            Torni indietro a forza di braccia, con le spalle che bruciano e un taglio sul palmo.
          effetti: { ferite: 0.5 }
      - testo: "Legarti alla corda del montacarichi"
        descrizione: "Dal soffitto pende una corda del vecchio montacarichi. Legata in vita, ti tiene se cadi."
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Media }
        successo:
          titolo: La corda
          testo: |
            Ti leghi in vita la corda del montacarichi con un nodo da barcaiolo. È canapa grigia, e in alto i
            giri hanno lucidato il legno della carrucola. Passi sulla trave con meno paura, e quando a metà
            scivoli comunque la corda ti tiene. Ti tiri su e arrivi dall'altra parte appes{o|a} come un sacco,
            ma inter{o|a}.
          effetti: { profondita.maison-magazzini-del-ponte-del-pesce: 1 }
        fallimento:
          titolo: Il nodo
          testo: |
            Il nodo che fai si scioglie al primo strattone, e per fortuna te ne accorgi prima di salire sulla
            trave. Ci riprovi, e la corda è marcia in un punto. Lì la canapa è nera e si apre fra le dita in
            fili molli. Lasci perdere con le mani che tremano.
          effetti: { tormento: 1 }
      - testo: "Strisciare sulla trave a cavalcioni"
        descrizione: "Non è dignitoso. Ma il vuoto non guarda la dignità."
        costo: 2
        esito:
          titolo: A cavalcioni
          testo: |
            Passi la trave a cavalcioni, un palmo alla volta, con le schegge che ti entrano nei calzoni. Ci
            metti una vita. A metà guardi giù fra le ginocchia e vedi la nebbia della Cicatrice che sale lungo
            la roccia fino ai piloni. Dall'altra parte hai le cosce scorticate e una voglia fortissima di non
            tornare per la stessa strada.
          effetti: { profondita.maison-magazzini-del-ponte-del-pesce: 1, ferite: 0.5 }

  # ------------------------------------------------------------ 3 · la stanza delle copie
  - id: maison-magazzini-la-stanza-delle-copie
    immagine: ambientazione/ponti-sospesi
    titolo: La stanza delle copie
    sommario: "Un leggio, un lume a olio e decine di pagine stese ad asciugare su uno spago. Qualcuno ricopia un libro, una pagina alla volta."
    luogo: I magazzini del Ponte del Pesce, il piano alto
    area: maison-magazzini-del-ponte-del-pesce
    ripetibile: true
    requisiti: [fazione.maison == 13, profondita.maison-magazzini-del-ponte-del-pesce == 3]
    testo: |
      Al piano alto, in una stanza di legno sul canale, c'è un leggio con un lume a olio. Il leggio è girato
      verso la finestra e il suo piano è nero di gocce d'inchiostro cadute una sull'altra. Da una parete
      all'altra corre uno spago con decine di pagine appese ad asciugare con le mollette, ognuna con un nome
      in cima e sotto le date. Sulle ultime l'inchiostro è ancora lucido. Dalla stanza accanto arriva una voce
      bassa che conta.

      {accademiche Media} La calligrafia delle copie imita una mano più esperta. Gli svolazzi delle maiuscole
      sono fatti in due tratti, con la giuntura che si vede a metà, dove una mano sicura li chiuderebbe in uno
      solo. Chi le fa ha imparato copiando le pagine di qualcun altro e non sa ancora fare le maiuscole come
      lei.
    opzioni:
      - testo: "Staccare le pagine e metterle via"
        descrizione: "Pagine ancora da vendere. Se le porti via, almeno queste non arriveranno sotto nessuna porta."
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Media }
        successo:
          titolo: Le mollette
          testo: |
            Stacchi piano le pagine dallo spago una per una e le infili nella camicia senza leggerle. La carta
            è ancora umida e ti si attacca fredda alla pelle. Le mollette le lasci appese, in fila. Quando hai
            finito lo spago è vuoto, e la voce di là continua a contare.
          effetti: { profondita.maison-magazzini-del-ponte-del-pesce: 1 }
        fallimento:
          titolo: Lo spago
          testo: |
            Tiri una pagina, e lo spago viene giù tutto insieme, con le mollette che ti piovono sulla testa e
            rotolano fra le fessure del pavimento. La voce di là smette di contare a metà di un numero. Ti
            butti dietro la porta e aspetti che riprenda, con il cuore in gola e le pagine sparse sul
            pavimento.
          effetti: { sospetto: 1 }
      - testo: "Leggere le copie per capire chi le fa"
        descrizione: "Una calligrafia imparata da un'altra. Si capisce da chi, se la si guarda bene."
        prova: { attributo: mentale, abilita: [accademiche, percezione], difficolta: Media }
        successo:
          titolo: Le maiuscole
          testo: |
            Le maiuscole sono quelle di Rozalia Marga, imitate male. Chi copia le pagine ha davanti il libro
            di Vesh, e lo ricopia una pagina alla volta, così il libro non esce mai da qui. Su ogni copia le
            righe hanno la stessa lunghezza dell'originale e vanno a capo nello stesso punto. La voce di là,
            quella che conta, è nella stanza dello scrittoio.
          effetti: { profondita.maison-magazzini-del-ponte-del-pesce: 1 }
        fallimento:
          titolo: Il lume
          testo: |
            Ti avvicini troppo al lume a olio per leggere, e una pagina appesa prende fuoco da un angolo.
            L'angolo si arriccia nero e la fiamma sale verso il nome scritto in cima. La spegni con le dita
            bruciandoti i polpastrelli, e il fumo della carta ti resta nel naso.
          effetti: { ferite: 0.5 }
      - testo: "Passare oltre senza guardare"
        descrizione: "Le pagine restano appese. Tu vai dove c'è il libro."
        costo: 2
        esito:
          titolo: Senza guardare
          testo: |
            Passi sotto lo spago a testa bassa, e le pagine ti sfiorano la nuca umide e fredde. Una molletta
            ti si impiglia nei capelli. La togli con uno strattone e ti porti via una ciocca. Davanti a te c'è
            una porta con la luce sotto.
          effetti: { profondita.maison-magazzini-del-ponte-del-pesce: 1, ferite: 0.5 }

  # ------------------------------------------------------------ 3 · la scala dei pescatori
  - id: maison-magazzini-la-scala-dei-pescatori
    immagine: ambientazione/ponti-sospesi
    titolo: La scala dei pescatori
    sommario: "Una scala di corda pende dal piano alto verso il canale. I pescatori la usavano per salire con le reti."
    luogo: I magazzini del Ponte del Pesce, il lato del canale
    area: maison-magazzini-del-ponte-del-pesce
    ripetibile: true
    requisiti: [fazione.maison == 13, profondita.maison-magazzini-del-ponte-del-pesce == 3]
    testo: |
      Sul lato del canale una scala di corda scende dalla finestra del piano più alto fino al balconcino dove
      sei tu. Il balconcino è una grata di legno inchiodata a sbalzo, e fra le assi vedi il canale molto più
      in basso. I pescatori usavano la scala per salire con le reti senza passare dai magazzini. I nodi vecchi
      della corda sono duri di sale, e accanto ce ne sono di nuovi in canapa chiara. A ogni raffica il vento
      sbatte la scala contro il muro con un colpo sordo.

      {armi-da-distanza Facile} Dalla finestra in alto si vede tutto il canale, e fra la finestra e il
      balconcino ci sono venti pioli di muro liscio senza un riparo. Chi guardasse fuori ti vedrebbe salire
      come un bersaglio da fiera.
    opzioni:
      - testo: "Salire la scala di corda"
        descrizione: "Mani, piedi, ritmo. Senza guardare il canale."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Media }
        successo:
          titolo: I venti pioli
          testo: |
            Sali i venti pioli con il ritmo di un pescatore, tirando con le braccia quando il vento ti spinge
            contro la parete. La scala ondeggia a ogni passo e tu ondeggi con lei senza contrastarla. Arrivi
            alla finestra con le mani rosse di corda, e dall'altra parte senti qualcuno che detta, piano, dei
            nomi.
          effetti: { profondita.maison-magazzini-del-ponte-del-pesce: 1 }
        fallimento:
          titolo: Il nodo vecchio
          testo: |
            Al dodicesimo piolo un nodo vecchio cede con uno schiocco, e il sale che lo teneva duro ti cade in
            faccia in una polvere bianca. Scendi di tre pioli in un colpo, con le mani che scorticano la
            corda. Torni giù sul balconcino con le palme in fiamme.
          effetti: { ferite: 0.5 }
      - testo: "Aspettare che il vento cali"
        descrizione: "Con il vento fermo si sale meglio. Ma il vento sul canale non si ferma mai del tutto."
        prova: { attributo: mentale, abilita: [natura, resilienza], difficolta: Media }
        successo:
          titolo: La calma
          testo: |
            Aspetti con la schiena alla parete finché il vento non cala, come fa a ogni cambio di marea. Te ne
            accorgi dall'acqua del canale, che smette di incresparsi e diventa liscia. Sali nei pochi minuti
            di calma e arrivi in cima prima che riprenda.
          effetti: { profondita.maison-magazzini-del-ponte-del-pesce: 1 }
        fallimento:
          titolo: Il vento
          testo: |
            Aspetti la calma, e la calma non arriva. Il balconcino vibra sotto i piedi a ogni raffica e le
            assi cigolano sui chiodi. Il vento ti entra nelle ossa, e quando ti decidi a salire hai le mani
            rigide e la testa piena del rumore della corda contro il muro.
          effetti: { tormento: 1 }
      - testo: "Salire con lentezza, un piolo per volta"
        descrizione: "Ci metti il triplo. Arrivi."
        costo: 2
        esito:
          titolo: Il triplo
          testo: |
            Sali un piolo alla volta, fermandoti a ogni raffica con la guancia contro la parete. La pietra è
            fredda e bagnata di nebbia, e sa di sale. Ci metti il triplo del tempo e arrivi in cima con i
            polpacci che tremano.
          effetti: { profondita.maison-magazzini-del-ponte-del-pesce: 1, ferite: 0.5 }

  # ------------------------------------------------------------ il cuore · lo scrittoio dei Ferrante
  - id: maison-magazzini-lo-scrittoio
    immagine: ambientazione/ponti-sospesi
    titolo: Lo scrittoio dei Ferrante
    sommario: "In cima ai magazzini, in una stanza sospesa sul canale, i fratelli Ferrante hanno messo uno scrittoio. Il libro di Vesh è aperto sopra."
    luogo: I magazzini del Ponte del Pesce, lo scrittoio
    area: maison-magazzini-del-ponte-del-pesce
    requisiti: [fazione.maison == 13, profondita.maison-magazzini-del-ponte-del-pesce >= 4]
    testo: |
      L'ultima stanza dei magazzini è sospesa sul canale, e fra le tavole del pavimento si vede l'acqua. In
      mezzo c'è uno scrittoio da notaio troppo bello per questo posto, con il piano foderato di cuoio. Sopra è
      aperto un libro rilegato in pelle nera con gli angoli d'ottone consumati, spesso come un mattone e con
      una macchia di fuliggine sul dorso. È il libro di Mirko Vesh.

      Dario Ferrante siede allo scrittoio con le dita macchiate d'inchiostro e il quaderno dei conti accanto,
      e copia una pagina in bella calligrafia. La penna gratta sulla carta con un ritmo regolare e non si
      ferma quando entri. Suo fratello Lazzaro è appoggiato alla porta con un gancio da stiva legato al polso,
      e ha le spalle larghe da scaricatore. Due bravi con i randelli siedono su una cassa.

      {intimidire Media} Dario ha paura dello sceriffo dalla notte della Pignatta. Quando sul ponte passa un
      passo pesante gli occhi gli vanno alla finestra.

      {rissa Media} Lazzaro combatte senza parlare, e il suo gancio da stiva con le persone è lento. È fatto
      per agganciare casse e balle, e per tirarlo indietro dopo un colpo gli serve tutto il braccio.

      Dario alza la testa. «Senti, è roba trovata nella cenere» dice con molta calma. «L'abbiamo trovata e la
      vendiamo. Per me si chiama commercio.»
    opzioni:
      - testo: "Affrontarli"
        descrizione: "Lazzaro con il gancio e due bravi con i randelli, in una stanza di tavole sospesa sul canale."
        combattimento: maison-lo-scrittoio-dei-ferrante
        vittoria:
          titolo: Il gancio da stiva
          testo: |
            Lazzaro va giù per ultimo, con il gancio piantato nel pavimento e una gamba in una fessura fra le
            tavole. Dalla fessura si vede l'acqua nera del canale che scorre un piano più sotto. I bravi sono
            già scappati per la scala dei pescatori. Dario non si è mosso dallo scrittoio, e quando prendi il
            libro non ti ferma. Chiude il calamaio con cura, come uno che ha finito una giornata di lavoro.
          pe: { armi-da-mischia: 10 }
          imposta: { maison.ferrante: 4 }
          effetti: { rep.maison: 1, monete: 100, informazioni.pettegolezzo: 2, fazione.maison: 1 }
          vai: citta-bassa
        sconfitta:
          titolo: La pagina che esce
          testo: |
            Il gancio di Lazzaro ti prende la giacca e ti sbatte contro la parete, e i bravi fanno il resto.
            Sotto il colpo le tavole della parete cedono di un dito, e dietro senti il vuoto. Quando ti rialzi
            i fratelli sono scappati per la scala dei pescatori con il quaderno dei conti e le copie ancora
            fresche. Il libro, troppo pesante da portare in fretta, è rimasto sullo scrittoio. Nei giorni
            dopo, sotto qualche porta dei Quartieri Alti, arriva ancora una pagina.
          imposta: { maison.ferrante: 2 }
          effetti: { ferite: 1.5, rep.maison: -0.5, fazione.maison: 1 }
          vai: citta-bassa
      - testo: "Parlare a Dario dello sceriffo"
        descrizione: "Dario ha paura di Galdrick dalla notte della Pignatta. Con le parole giuste, quella paura gli fa chiudere il libro da solo."
        prova: { attributo: sociale, abilita: [persuasione, intimidire], difficolta: Difficile }
        successo:
          titolo: La porta della taverna
          testo: |
            Gli parli della notte della Pignatta e dell'uomo che ha sfondato la porta della taverna, e gli
            dici che quell'uomo, domani, saprà da te dove trovare lo scrittoio. Dario posa la penna e guarda
            il fratello, e dopo il fratello il libro. Dalla punta della penna una goccia d'inchiostro cade
            sulla pagina e si allarga, e lui non l'asciuga. Chiude il libro con due mani e te lo porge, e
            Lazzaro non si muove dalla porta.
          pe: { persuasione: 10 }
          imposta: { maison.ferrante: 4 }
          effetti: { rep.maison: 1, monete: 100, informazioni.pettegolezzo: 2, fazione.maison: 1 }
          vai: citta-bassa
        fallimento:
          titolo: Commercio
          testo: |
            Gli parli dello sceriffo, e Dario ti risponde con un sorriso che lo sceriffo è un uomo molto
            occupato. Lazzaro si stacca dalla porta e ti spinge contro la parete, e la spalla ti esce dal suo
            posto con uno schiocco sordo. Il braccio ti pende lungo il fianco e non risponde. Mentre ti rialzi
            i fratelli scappano dalla finestra con le copie e il quaderno, e il libro resta sullo scrittoio.
            Qualche pagina, nei giorni dopo, arriverà lo stesso sotto una porta.
          imposta: { maison.ferrante: 2 }
          effetti: { ferite: 1, sospetto: 1, rep.maison: -0.5, fazione.maison: 1 }
          vai: citta-bassa
      - testo: "Spendere un favore della signora"
        descrizione: "Un nome detto a nome di Nerissa Dalvane apre anche le porte del Ponte del Pesce."
        requisiti: [maison.favori >= 1]
        prova: { attributo: sociale, abilita: [persuasione, intimidire], difficolta: Media }
        successo:
          titolo: A nome della signora
          testo: |
            Gli dici che vieni a nome di Nerissa Dalvane, e che la signora ha un debito da riscuotere con
            chiunque venda i nomi della sua casa. Dario impallidisce, e le dita macchiate d'inchiostro gli si
            fermano sulla penna. Sa che cosa vuol dire, perché in Città Bassa lo sanno tutti. Chiude il libro
            e te lo porge. Lazzaro, alla porta, si toglie il gancio dal polso e lo posa sulle tavole.
          pe: { persuasione: 10 }
          imposta: { maison.ferrante: 4 }
          effetti: { maison.favori: -1, rep.maison: 1, monete: 100, informazioni.pettegolezzo: 2, fazione.maison: 1 }
          vai: citta-bassa
        fallimento:
          titolo: Il nome speso male
          testo: |
            Gli dici che vieni a nome della signora, e Dario ti chiede con molto garbo che cosa ne pensa la
            signora dei ricatti, visto che li fa anche lei. Esiti. Lazzaro si stacca dalla porta e ti spinge
            giù per la scala dei pescatori, e la corda ti brucia le mani mentre scivoli fino al balconcino.
            Quando risali i fratelli sono spariti con le copie e con il quaderno. Il libro è rimasto sullo
            scrittoio, e il favore della signora l'hai sprecato.
          imposta: { maison.ferrante: 2 }
          effetti: { maison.favori: -1, ferite: 1, rep.maison: -0.5, fazione.maison: 1 }
          vai: citta-bassa
      - testo: "Aspettare che Dario si addormenti e prendere il libro"
        descrizione: "Copia fino all'alba, e a una certa ora crolla sullo scrittoio. I bravi giocano a dadi, e Lazzaro si siede."
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Difficile }
        successo:
          titolo: La testa sul libro
          testo: |
            Aspetti fuori dalla finestra, appes{o|a} alla scala dei pescatori, fino a quando Dario si
            addormenta con la guancia sulla pagina che stava copiando. Dentro i bravi giocano a dadi sulla
            cassa, e i dadi smettono di battere molto prima che Lazzaro chiuda gli occhi. Entri mettendo i
            piedi soltanto sulle tavole con i chiodi nuovi, che tengono senza un suono. Gli sfili il libro da
            sotto la guancia con calma e gli lasci al suo posto il quaderno dei conti. Quando si sveglia,
            all'alba, sei già sul Ponte del Pesce.
          pe: { furtivita: 10 }
          imposta: { maison.ferrante: 4 }
          effetti: { rep.maison: 1, monete: 100, informazioni.pettegolezzo: 2, fazione.maison: 1 }
          vai: citta-bassa
        fallimento:
          titolo: La tavola che scricchiola
          testo: |
            Entri dalla finestra, e la terza tavola scricchiola come una porta vecchia. Dario si sveglia
            gridando, e mentre i bravi saltano su dalla cassa tu afferri il libro e ti butti fuori dalla
            finestra, con un randello che ti sfiora la nuca. Mentre scendi gli angoli d'ottone del libro ti
            segnano il petto attraverso la camicia. I fratelli scappano dall'altra parte con le copie, e
            qualche pagina uscirà lo stesso.
          imposta: { maison.ferrante: 2 }
          effetti: { sospetto: 1.5, rep.maison: -0.5, fazione.maison: 1 }
          vai: citta-bassa
      - testo: "Parlargli con la Voce di seta"
        descrizione: "Dario è stanco e vorrebbe smettere. Una frase detta con il Mana sotto può fargli credere che l'idea sia sua."
        incantesimo: maison-voce-di-seta
        prova: { attributo: mentale, abilita: magia, difficolta: Difficile }
        successo:
          titolo: Un'idea sua
          testo: |
            Gli dici piano che è stanco di copiare e il libro porta guai. Sarebbe bello dormire una notte
            intera. Il Mana ti scivola sotto le parole. La tua voce ti suona più bassa e più calda di come la
            conosci. Dario posa la penna e ti porge il libro chiuso, poi si stropiccia gli occhi come uno che
            si sveglia. Lazzaro, alla porta, guarda il fratello senza capire.
          pe: { magia: 10 }
          imposta: { maison.ferrante: 4 }
          effetti: { rep.maison: 1, monete: 100, informazioni.pettegolezzo: 2, fazione.maison: 1 }
          vai: citta-bassa
        fallimento:
          titolo: La penna
          testo: |
            Cominci la frase, ma il Mana ti sfugge a metà e la voce ti esce stonata. Dario sente soltanto una
            voce strana che gli dice di smettere. Chiama il fratello, e nel parapiglia scappano tutti e due
            per la scala dei pescatori con le copie e il quaderno. Il libro resta sullo scrittoio, e qualche
            pagina, nei giorni dopo, uscirà lo stesso.
          imposta: { maison.ferrante: 2 }
          effetti: { ferite: 1, tormento: 1, rep.maison: -0.5, fazione.maison: 1 }
          vai: citta-bassa

