# La quest di fazione della Maison des Lunes (ottobre 2026): la pista fazione.maison (0 → 15), i cinque gradi e
# gli stati che le scene si passano. Il conflitto di tutta la quest è qualcuno che vuole scrivere i nomi: l'orecchio
# nella lampada (passi 5-9), il registro dei frequentatori in Consiglio (10-12), il libro dei clienti di Vesh (13-15).
# Dove stanno i passi:
# - 1, 2 e 6 sono le storie della catena breve, rimaste in contenuti/citta/maison.yaml con i requisiti cambiati
#   (il quaderno di Sara, la lanterna spenta con il seguito alla porta della Luna Calante, ospite della Maison).
# - 3-5 in passi-1.yaml; 7-12 in passi-2.yaml; 13-15 in passi-3.yaml.
# - Le spedizioni: spedizione-cristallo.yaml (passo 8), spedizione-cena.yaml (11), spedizione-magazzini.yaml (14).
# - I ripetibili e i servizi dei gradi in servizi.yaml; oggetti e incantesimi in oggetti.yaml; nemici in nemici.yaml;
#   i personaggi nuovi in glossario.yaml.
# Trama: il passo 4 chiede pista.dama-argento >= 6, il 5 >= 11 (Jass risolta), il 6 galdrick.via == 0. I passi
# 10-12 hanno due varianti, A con pista.pelle < 5 (Ottone Malgrani in Consiglio) e B con pista.pelle >= 7 (le casse
# vuote dopo la Pignatta); con pista.pelle 5 o 6 restano chiusi. I passi 13-15 chiedono pista.pelle >= 7.
# Reputazione: i passi di grado la portano almeno a 2, 4, 6, 8, 10; gli altri danno +½ o +1.
quality:
  - { id: fazione.maison, immagine: fazioni/maison-des-lunes, nome: "La scatola di latta", categoria: pista, descrizione: "Nerissa Dalvane non ha mai scritto il nome di un cliente. In città c'è chi vorrebbe scriverli al posto suo." }
  - { id: maison.quaderno, nome: Il quaderno di Sara, categoria: stato, nascosta: true, descrizione: "1 bruciato, 2 resta a Sara e a Gretchen, 3 nella scatola di latta, 4 letto di nascosto, 5 letto e scoperto." }
  - { id: maison.mare, nome: Un mare per Laure, categoria: stato, nascosta: true, descrizione: "1 se a Laure hai lasciato la voglia di vedere il mare." }
  - { id: maison.pace, nome: Il signor Pace, categoria: stato, nascosta: true, descrizione: "1 se hai inventato per Nerissa il signor Bertoldo Pace, mercante di bottoni." }
  - { id: maison.leva-ettore, nome: Il nome di Ettore, categoria: stato, nascosta: true, descrizione: "1 se ti sei tenuto il nome di Ettore Castaldi per usarlo." }
  - { id: maison.irmelin, nome: Il segnale di Irmelin, categoria: stato, nascosta: true }
  - { id: maison.cristallo, nome: La lampada della Luna Calante, categoria: stato, nascosta: true, descrizione: "1 hai tolto il cristallo, 2 gli hai dato da mangiare una recita, 3 hai seguito il filo del Mana." }
  - { id: maison.dimenticato, nome: Il cristallo dimenticato, categoria: stato, nascosta: true, descrizione: "1 se hai preso il cristallo carico nella stanza dismessa sotto la Città Bassa." }
  - { id: maison.laure, nome: Laure sulla soglia, categoria: stato, nascosta: true }
  - { id: maison.scrivano, nome: Bastiano Rell, categoria: stato, nascosta: true, descrizione: "1 consegnato a Nerissa, 2 alla Caserma, 3 fuggito, 4 lavora per te." }
  - { id: maison.lista, nome: Il quaderno dello scrivano, categoria: stato, nascosta: true, descrizione: "1 bruciato, 2 dato a Nerissa, 3 dato a Nerissa con una pagina in meno, 4 venduto al Mercato delle Ombre." }
  - { id: maison.pagina, nome: La pagina strappata, categoria: stato, nascosta: true, descrizione: "1 se hai tenuto una pagina del quaderno dello scrivano." }
