  - { id: maison.voti, immagine: icone/scales, nome: Voti contro il registro, categoria: stato, descrizione: "Quanti consiglieri voteranno contro il registro dei frequentatori. Ne servono quattro perché la proposta cada senza che lo sceriffo apra bocca." }
  - { id: maison.varn, nome: Varn Kett, categoria: stato, nascosta: true, descrizione: "1 se Varn Kett sta dalla tua parte sul registro." }
  - { id: maison.julia, nome: Il voto di Julia, categoria: stato, nascosta: true, descrizione: "1 convinta sul merito, 2 per Ettore, 3 minacciata, 4 non convinta." }
  - { id: maison.annibaldi, nome: Annibaldi e la pagina, categoria: stato, nascosta: true, descrizione: "1 se Annibaldi ha ritirato la proposta per la pagina con il suo nome." }
  - { id: maison.imbarazzo, immagine: icone/wine-glass, nome: Imbarazzo a cena, categoria: stato, descrizione: "Quante gaffe ha notato la tavola di Marella Castaldi. A tre, Quintus Vael ti accompagna alla carrozza." }
  - { id: maison.registro, nome: Il registro dei frequentatori, categoria: stato, nascosta: true, descrizione: "1 respinto, 2 respinto con il voto dello sceriffo, 3 passato e beffato." }
  - { id: maison.ferrante, nome: I fratelli Ferrante, categoria: stato, nascosta: true, descrizione: "1 in Caserma, 2 fuggiti, 3 a debito con te." }
  - { id: maison.libro, nome: Il libro dei clienti di Vesh, categoria: stato, nascosta: true, descrizione: "1 bruciato, 2 nella scatola di latta, 3 dato allo sceriffo, 4 dato a Julia Castaldi, 5 tenuto." }
  - { id: maison.pagine, immagine: icone/secret-book, nome: Pagine del libro di Vesh, categoria: stato, descrizione: "Le pagine del libro dei clienti di Vesh che non hai ancora letto. Ognuna è un nome dei Quartieri Alti, con le sue date." }
  - { id: maison.favori, immagine: icone/moon, nome: Favori della signora, categoria: stato, descrizione: "Nerissa Dalvane ti deve un favore per ognuno. Si chiedono al suo tavolino, in salone." }
  - { id: maison.cariche, immagine: icone/crystal-eye, nome: Cariche del cristallo accoppiato, categoria: stato, descrizione: "Quante volte puoi ancora lasciare in ascolto la metà del cristallo. Lo ricarica Nerissa." }
  - { id: maison.custode, immagine: icone/moon, nome: Custode dei nomi, categoria: stato, descrizione: "Quello che si dice alla Maison des Lunes sparisce, e da oggi lo sanno in due a tenerlo. Nerissa ti risponde quando le chiedi un nome." }
  - { id: maison.chi-tiene-il-libro, immagine: icone/secret-book, nome: Chi tiene il libro, categoria: stato, descrizione: "Hai tenuto il libro dei clienti di Vesh. In Via dei Rasoi la porta grande per te resta chiusa, e nei Quartieri Alti molti non sanno ancora di doverti temere." }

fazioni:
  - id: maison
    nome: Maison des Lunes
    immagine: fazioni/maison-des-lunes
    reputazione: rep.maison
    pista: fazione.maison
    gradi:
      - { passo: 3, nome: Chiamato per nome, ricompensa: "Il ventaglio dei segnali, un posto alla sala interna dove si gioca a Zekar e una mancia di benvenuto." }
      - { passo: 6, nome: Ospite della Maison, ricompensa: "Il bastone animato dell'armadio di Sara e la Stanza della Luna Nuova, dove si dorme e ci si rimette in sesto." }
      - { passo: 9, nome: Di cucina, ricompensa: "Il cristallo accoppiato, la chiave della porta di servizio, le commissioni della signora e le sue lezioni dell'Arte dei cristalli." }
      - { passo: 12, nome: Voce del salotto, ricompensa: "La spilla della mezzaluna, tre favori della signora, la Luna Nuova senza pagare e una borsa di monete." }
      - { passo: 15, nome: Custode dei nomi, ricompensa: "Il soprabito della sarta, e secondo come finisce il libro la catena di bronzo, l'Oblio, i nomi chiesti a Nerissa e una borsa pesante." }
