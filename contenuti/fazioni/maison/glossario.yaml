# Glossario: i personaggi nuovi della quest della Maison des Lunes (contenuti/fazioni/maison/). Presentazioni
# senza segreti, nel formato di contenuti/glossario/personaggi.yaml. Irmelin viene dal Codex; Bastiano Rell, Ruggero
# Annibaldi e i fratelli Ferrante sono nuovi. Bastiano ha per forma breve solo il cognome, perché sui Ponti c'è già
# un Bastiano cantastorie.
glossario:
  - id: irmelin
    nome: Irmelin
    tipo: personaggio
    sottotitolo: "Una delle ragazze della Maison des Lunes"
    testo: "Mezzelfa, l'unica non umana fra le ragazze della Maison des Lunes, con la pelle chiarissima e gli occhi scuri punteggiati d'argento. È arrivata a Qir-Azel da sola, dopo che gli orchi del circondario le avevano ucciso la madre. Ha un'aria di quiete svagata, che molti clienti scambiano per disponibilità."
    requisiti: []

  - id: bastiano-rell
    nome: Bastiano Rell
    alias: [Rell]
    tipo: personaggio
    sottotitolo: "Accordatore di cristalli"
    testo: "Accordatore di cristalli conduttori, magro, con gli occhiali legati allo spago e le dita grigie di polvere di cristallo. Ha studiato all'Accademia di Torvessa finché i debiti non sono arrivati prima della fine dei corsi. Accorda per chi paga, e di solito paga chi non vuole ricevute."
    requisiti: []

  - id: ruggero-annibaldi
    nome: Ruggero Annibaldi
    alias: [Annibaldi]
    tipo: personaggio
    sottotitolo: "Del consiglio interno della Gilda dei Mercanti"
    testo: "Mercante di tessuti e membro del consiglio interno della Gilda dei Mercanti, con la barba grigia tagliata a punta e un anello con lo stemma della Gilda che gira sempre verso il palmo. Parla spesso del decoro della città, e i suoi magazzini al Mercato dei Nodi hanno fama di essere i più ordinati di Qir-Azel."
    requisiti: []

  - id: dario-ferrante
    nome: Dario Ferrante
    alias: [Dario]
    tipo: personaggio
    sottotitolo: "Del Ponte del Pesce"
    testo: "Il più giovane dei due fratelli Ferrante del Ponte del Pesce, con le dita macchiate d'inchiostro e un quaderno sempre sotto il braccio. Dopo la notte della Pignatta gira le botteghe della Città Bassa con il fratello Lazzaro e fa i conti per tutti e due. Scrive una bella calligrafia da notaio."
    requisiti: []

  - id: lazzaro-ferrante
    nome: Lazzaro Ferrante
    alias: [Lazzaro]
    tipo: personaggio
    sottotitolo: "Del Ponte del Pesce"
    testo: "Il maggiore dei due fratelli Ferrante del Ponte del Pesce, scaricatore di chiatte per vent'anni, con le spalle larghe e un gancio da stiva che porta sempre legato al polso. Del fratello Dario dice che è quello con la testa. Lui sta sulla porta e parla poco."
    requisiti: []
