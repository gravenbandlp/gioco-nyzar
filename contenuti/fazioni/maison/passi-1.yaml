# La quest della Maison des Lunes, passi 3-5 (i passi 1 e 2 stanno in contenuti/citta/maison.yaml).
# - Passo 3, la sala interna (primo grado, Chiamato per nome): una partita di Zekar con il mercante dell'argento,
#   che sta per puntare il nome di un altro cliente. Ogni ramo dà il ventaglio dei segnali e porta rep.maison almeno a
#   2; chi al passo 1 è stato scoperto a leggere il quaderno (maison.quaderno 5) trova Difficile la via del Galateo.
#   Seguito: i segnali di Tachek (solo PE e colore).
# - Passo 4, il cugino della Rappresentante (pista.dama-argento >= 6): Ettore Castaldi ubriaco sul gradino e il
#   ragazzino con la lavagnetta, che prima della Pignatta segna per Mauro e dopo per i fratelli del Ponte del Pesce.
#   Ogni ramo dà segreto.ettore. Seguito: il fiasco senza biglietto, dove si decide maison.leva-ettore.
# - Passo 5, le domande gentili (pista.dama-argento >= 11): Irmelin, il cliente troppo gentile e la lampada.
#   Dà maison.irmelin; con jass 1, prima della Pignatta, Jass dice dell'orecchio.
zekar:
  - id: maison-mercante-dell-argento
    nome: Il mercante dell'argento
    immagine: fazioni/gilda-dei-mercanti
    descrizione: "Paga in argento nuovo e punta forte, perché pensa di avere già perso. Si ferma tardi e cala le laterali alte senza pensarci."
    laterali: [-2, 1, 3, 4]
    soglia: 18
    mira: 20

storylet:
  # ------------------------------------------------------------ passo 3 · la sala interna (primo grado)
  - id: maison-la-sala-interna-passo
    presso: via-dei-rasoi
    immagine: ambientazione/maison-des-lunes
    titolo: La sala interna
    sommario: "Gretchen ti ha visto sulla scala, la notte della lanterna spenta, e stasera ti porta nella stanza dove si gioca a Zekar."
    luogo: Maison des Lunes, la sala interna
    area: citta-bassa
    requisiti: [fazione.maison == 2]
    testo: |
      Dietro il salone, oltre una tenda di velluto spelata dove la scostano le
      mani, c'è una stanza senza finestre con un tavolo rotondo e una lampada
      bassa che illumina soltanto il panno verde. Gretchen ti ci accompagna
      tenendoti per il polso e tiene i conti in un angolo su una lavagnetta da
      scuola. Chiara dà le carte con il portasigarette d'osso fra due dita.

      {galateo Facile} Qui nessuno lascia monete sul tavolo. Davanti ai giocatori
      ci sono biglietti piegati in quattro, e ognuno vale quello che c'è scritto
      dentro.

      Il mercante seduto di fronte a Chiara lo riconosci dal panciotto, perché in
      salone paga sempre in argento nuovo. Ha perso tutti i biglietti e ne sta
      scrivendo un altro, curvo sul tavolo. «Sta per puntare il nome di un altro
      cliente» ti dice Gretchen all'orecchio. «È l'unica posta che qui non si
      accetta, e se la mette sul panno la sala è finita.» Poi ti lascia la sua
      sedia.

      {origine mercante-dei-ponti} Quell'argento esce dalla Casa dei Nodi nei
      sacchetti che la Gilda usa per i pagamenti di riguardo, e chi lo riceve non
      dovrebbe avere bisogno di vendere un nome.

      *Se quel biglietto arriva sul panno, qualcuno domani perde molto più di una
      partita.* La sedia di Gretchen è ancora tiepida.
    opzioni:
      - testo: "Sederti e giocare contro di lui"
        descrizione: "Se vinci a Zekar il nome resta nella sua tasca, e se perdi il debito lo paga la signora."
        zekar: maison-mercante-dell-argento
        vittoria:
          titolo: Il biglietto nella tasca
          testo: |
            Il mercante si ferma a diciotto e tu arrivi a venti con l'ultima
            laterale. Senza aprirlo infila nel taschino il biglietto con il nome,
            e firma due favori piccoli. Gretchen cancella la lavagnetta con il
            palmo e ti chiama per nome davanti a tutti, che in questa stanza vale
            più di una vincita.

            All'uscita Tachek ti dà un ventaglio di carta dipinta, e domani ti
            insegnerà a usarlo.
          pe: { empatia: 10 }
          effetti: { informazioni.pettegolezzo: 1, monete: 30, oggetto.maison-ventaglio-dei-segnali: 1, rep.maison: 1, fazione.maison: 1 }
          almeno: { rep.maison: 2 }
          segue: maison-i-segnali-di-tachek
        sconfitta:
          titolo: Il debito della signora
          testo: |
            Perdi l'ultima mano per un punto, e il mercante, sollevato, strappa il
            biglietto sul panno. Il tuo debito lo salda Nerissa di tasca sua senza
            dirtelo. Lo capisci quando Sara ti chiama per nome e ti trattiene la
            paga della settimana, sorridendo.

            All'uscita Tachek ti mette in mano un ventaglio di carta dipinta, e
            domani ti insegnerà a usarlo.
          pe: { empatia: 10 }
          effetti: { monete: 10, oggetto.maison-ventaglio-dei-segnali: 1, fazione.maison: 1 }
          almeno: { rep.maison: 2 }
          segue: maison-i-segnali-di-tachek

      - testo: "Farlo alzare con un pretesto"
        descrizione: "Una moglie in pensiero o una carrozza in cortile, detta bene, lo porta fuori prima che posi il biglietto."
        quando: [maison.quaderno != 5]
        prova: { attributo: sociale, abilita: [galateo, ingannare], difficolta: Media }
        successo:
          titolo: La carrozza
          testo: |
            Gli dici sottovoce che fuori c'è un ragazzo della Casa dei Nodi con
            una lettera sigillata per lui. Il mercante si alza così in fretta che
            rovescia la sedia, con il biglietto mezzo scritto in mano, e Gretchen
            lo accompagna in cortile; quando torna ti chiama per nome.

            All'uscita Tachek ti dà un ventaglio di carta dipinta, e domani ti
            insegnerà a usarlo.
          pe: { empatia: 10 }
          effetti: { monete: 30, oggetto.maison-ventaglio-dei-segnali: 1, rep.maison: 1, fazione.maison: 1 }
          almeno: { rep.maison: 2 }
          segue: maison-i-segnali-di-tachek
        fallimento:
          titolo: La lettera che non c'è
          testo: |
            Il mercante ti chiede chi ha portato la lettera, e tu esiti un attimo di
            troppo. Il biglietto finisce sul panno, Chiara lo respinge con la punta
            del portasigarette senza aprirlo e chiude la partita. Domani in salone
            qualcuno racconterà che alla Maison hanno trattato male un uomo della
            Gilda.

            All'uscita Tachek ti mette in mano un ventaglio di carta dipinta, e
            domani ti insegnerà a usarlo.
          pe: { empatia: 10 }
          effetti: { scandalo: 1, monete: 10, oggetto.maison-ventaglio-dei-segnali: 1, fazione.maison: 1 }
          almeno: { rep.maison: 2 }
          segue: maison-i-segnali-di-tachek

      - testo: "Farlo alzare con un pretesto"
        descrizione: "Sara ti ha visto con il dito sul suo quaderno, e stasera le tue bugie le guardano con attenzione."
        quando: [maison.quaderno == 5]
        prova: { attributo: sociale, abilita: [galateo, ingannare], difficolta: Difficile }
        successo:
          titolo: La carrozza
          testo: |
            Gli parli del ragazzo della Casa dei Nodi con tanta noia che sembra
            vero, e il mercante si alza rovesciando la sedia, con il biglietto
            mezzo scritto in mano. Quando torna dal cortile Gretchen ti guarda a
            lungo, poi ti chiama per nome, una volta sola, come una cosa da tenere
            a mente.

            All'uscita Tachek ti mette in mano un ventaglio di carta dipinta, e
            domani ti insegnerà a usarlo.
          pe: { empatia: 10 }
          effetti: { monete: 30, oggetto.maison-ventaglio-dei-segnali: 1, rep.maison: 1, fazione.maison: 1 }
          almeno: { rep.maison: 2 }
          segue: maison-i-segnali-di-tachek
        fallimento:
          titolo: La lettera che non c'è
          testo: |
            Chiara alza gli occhi dalle carte prima del mercante, e quando lui ti
            chiede chi ha portato la lettera tu esiti. Il biglietto finisce sul
            panno e Chiara chiude la partita. Domani in salone qualcuno racconterà
            che alla Maison hanno trattato male un uomo della Gilda.

            All'uscita Tachek ti mette in mano un ventaglio di carta dipinta, e
            domani ti insegnerà a usarlo.
          pe: { empatia: 10 }
          effetti: { scandalo: 1, monete: 10, oggetto.maison-ventaglio-dei-segnali: 1, fazione.maison: 1 }
          almeno: { rep.maison: 2 }
          segue: maison-i-segnali-di-tachek

      - testo: "Lasciarlo a Chiara"
        descrizione: "Chiara sa far tacere un uomo meglio di te, se le passi la mano al momento giusto."
        prova: { attributo: sociale, abilita: [empatia, percezione], difficolta: Media }
        successo:
          titolo: Il portasigarette
          testo: |
            Quando il mercante alza la penna sposti la sedia di un palmo verso
            Chiara, e lei capisce. Gli posa il portasigarette sul foglio e gli
            dice qualcosa a voce bassissima, e lui strappa il biglietto e chiede
            scusa al tavolo. Gretchen ti chiama per nome, e Chiara ti concede un
            mezzo sguardo.

            All'uscita Tachek ti dà un ventaglio di carta dipinta, e domani ti
            insegnerà a usarlo.
          pe: { empatia: 10 }
          effetti: { monete: 30, oggetto.maison-ventaglio-dei-segnali: 1, rep.maison: 1, fazione.maison: 1 }
          almeno: { rep.maison: 2 }
          segue: maison-i-segnali-di-tachek
        fallimento:
          titolo: Troppo presto
          testo: |
            Le passi la mano troppo presto, quando il mercante è ancora arrabbiato
            con le carte, e lui le risponde male. Ci vuole Tachek, con una mano
            sulla spalla, per portarlo in cortile con il biglietto in tasca. La
            sala si svuota presto, ma a fine sera Gretchen ti chiama comunque per
            nome.

            All'uscita Tachek ti mette in mano un ventaglio di carta dipinta, e
            domani ti insegnerà a usarlo.
          pe: { empatia: 10 }
          effetti: { monete: 10, oggetto.maison-ventaglio-dei-segnali: 1, fazione.maison: 1, scandalo: 0.5 }
          almeno: { rep.maison: 2 }
          segue: maison-i-segnali-di-tachek

      - testo: "Lasciarlo puntare e sentire il nome"
        descrizione: "Un nome detto in questa stanza, fuori, vale molto."
        esito:
          titolo: Il nome sul panno
          testo: |
            Non fai niente, e il mercante apre il biglietto sul panno. È il nome
            di un uomo che viene il giovedì e in città ha una moglie e una
            bottega. Chiara si alza senza una parola, e Gretchen ti chiama per
            nome lo stesso, perché ti sei seduto, senza guardarti.

            All'uscita Tachek ti dà un ventaglio di carta dipinta, e domani ti
            insegnerà a usarlo.
          pe: { empatia: 10 }
          effetti: { informazioni.segreto: 1, rep.maison: -1, monete: 30, oggetto.maison-ventaglio-dei-segnali: 1, fazione.maison: 1 }
          almeno: { rep.maison: 2 }
          segue: maison-i-segnali-di-tachek

      - testo: "Parlargli dell'argento della Casa dei Nodi"
        descrizione: "Le sue monete escono dai sacchetti di riguardo della Gilda, e fra mercanti basta accennarlo."
        quando: [origine.mercante-dei-ponti >= 1]
        esito:
          titolo: Fra mercanti
          testo: |
            Gli chiedi, da collega, se l'argento di riguardo della Casa dei Nodi
            si conia ancora con il bordo zigrinato. Il mercante si ferma con la
            penna a mezz'aria, perché un nome sul panno farebbe venire in mente
            anche il suo. Strappa il biglietto e chiede scusa al tavolo, e
            Gretchen ti chiama per nome.

            All'uscita Tachek ti dà un ventaglio di carta dipinta, e domani ti
            insegnerà a usarlo.
          pe: { empatia: 10 }
          effetti: { monete: 30, oggetto.maison-ventaglio-dei-segnali: 1, rep.maison: 1, fazione.maison: 1 }
          almeno: { rep.maison: 2 }
          segue: maison-i-segnali-di-tachek

  - id: maison-i-segnali-di-tachek
    immagine: personaggi/tachek
    titolo: I segnali di Tachek
    tipo: seguito
    luogo: Maison des Lunes, il salone vuoto
    area: citta-bassa
    requisiti: [fazione.maison == 3]
    testo: |
      Il giorno dopo, nell'ora morta, Tachek ti aspetta nel salone con le
      poltrone coperte dai teli delle pulizie, un ventaglio uguale al tuo
      aperto sul ginocchio. Ti fa sedere a tre passi, la distanza di una
      poltrona dall'altra.

      «Le ragazze parlano con le mani, noi con questo» dice, e chiude il
      ventaglio di scatto. «Chiuso vuol dire vieni. Battuto sul palmo vuol
      dire aspetta. Aperto a metà vuol dire che il cliente ha bevuto.» Lo apre
      del tutto e ci si fa aria. «E così vuol dire che fa caldo. È il segnale
      più difficile da imparare.»
    opzioni:
      - testo: "Ripetere i segnali finché non vengono da soli"
        descrizione: "Un'ora di ventaglio aperto e chiuso, con Tachek che ti corregge il polso."
        costo: 0
        esito:
          titolo: Il polso
          testo: |
            Apri e chiudi il ventaglio finché il polso ti fa male, e Tachek ti
            corregge sempre lo stesso pollice che stringe troppo. I segnali veri,
            dice alla fine, li imparerai in salone sbagliando davanti a tutti,
            come lui.
          pe: { percezione: 3 }
      - testo: "Chiedergli come ha imparato lui"
        descrizione: "Di sé Tachek non racconta mai niente, però a casa chiusa forse fa un'eccezione."
        costo: 0
        esito:
          titolo: La prima sera
          testo: |
            La prima sera, ti racconta Tachek, ha scambiato un ventaglio aperto
            per uno chiuso e ha portato fuori di peso il fratello della signora,
            venuto per gli auguri. «Lei ha riso per una settimana» dice, e
            richiude il ventaglio con un colpo secco. «Io non ho più sbagliato.»
          pe: { empatia: 3 }

  # ------------------------------------------------------------ passo 4 · il cugino della Rappresentante
  - id: maison-il-cugino-della-rappresentante
    presso: via-dei-rasoi
    immagine: personaggi/ettore-castaldi
    titolo: Il cugino della Rappresentante
    sommario: "Sul gradino della Maison è seduto un uomo grosso con il mantello buono, e Churl gli ha appena detto di no."
    luogo: Via dei Rasoi, davanti alla Maison
    area: citta-bassa
    requisiti: [fazione.maison == 3, pista.dama-argento >= 6]
    testo: |
      A lanterna appena accesa, sul gradino della Maison in Via dei Rasoi c'è
      un uomo grosso con il mantello buono buttato su una spalla. Churl è
      sulla soglia con le braccia incrociate, perché alla Maison si entra
      sobri e lui sobrio non è.

      È Ettore Castaldi, il cugino della Rappresentante, quello della Birreria
      del Paladino Stanco. Canticchia un inno con le parole sbagliate e saluta
      per nome chi passa.

      Su un paracarro di fronte un ragazzino con una lavagnetta segna col
      gesso ogni volta che la porta si apre.

      {conoscenze-della-strada Media} Chi segna gli ingressi di Via dei Rasoi
      lavora per qualcuno che paga a nome, e il nome di stasera vale una
      settimana di paga.

      {origine rampollo-dei-quartieri-alti} A una cena di consiglio Ettore ti
      ha versato da bere due volte, e la seconda ha chiesto scusa al vino.

      Sara si affaccia dietro Churl e ti guarda.
    opzioni:
      - testo: "Riportarlo a casa per il giro lungo"
        descrizione: "La Birreria è a un quarto d'ora, e la strada dritta passa sotto troppe finestre."
        prova: { attributo: sociale, abilita: [conoscenze-della-strada, persuasione], difficolta: Media }
        successo:
          titolo: Il giro lungo
          testo: |
            Lo prendi sottobraccio e lo porti per i vicoli dei cardatori, dove a
            quest'ora nessuno sa chi è. Ettore ti racconta di un cavallo bianco
            che aveva da ragazzo e a metà strada piange senza smettere di
            camminare. Alla Birreria la garzona lo prende in consegna senza
            domande, e la lavagnetta resta con un segno solo.
          pe: { conoscenze-della-strada: 5 }
          imposta: { segreto.ettore: 1 }
          effetti: { rep.maison: 1, informazioni.pettegolezzo: 1, fazione.maison: 1 }
          segue: maison-il-fiasco-senza-biglietto
        fallimento:
          titolo: La strada dritta
          testo: |
            Ettore si pianta in mezzo a Via del Salmone e dichiara a voce alta che
            un Castaldi cammina per la strada dritta. Lo porti alla Birreria sotto
            tutte le finestre del quartiere, e ti resta addosso l'impressione che
            mezza Città Bassa ti abbia visto con lui.
          imposta: { segreto.ettore: 1 }
          effetti: { scandalo: 1, rep.maison: 0.5, fazione.maison: 1 }
          segue: maison-il-fiasco-senza-biglietto

      - testo: "Comprare la lavagnetta al ragazzino"
        descrizione: "Chi lo paga, lo paga a nome, e tu puoi pagarlo di più."
        quando: [pista.pelle < 6]
        prova: { attributo: sociale, abilita: [persuasione, conoscenze-della-strada], difficolta: Media }
        successo:
          titolo: Il gesso
          testo: |
            Ti siedi sul paracarro accanto al ragazzino. Segna per Mauro, ti dice, che
            paga solo i nomi buoni. Gli fai notare che una lavagnetta pulita si vende
            comunque, e te la cede per qualche moneta e una caramella. Intanto Churl
            fa alzare Ettore e lo affida a Kanat, che lo riporta a casa in braccio.
          pe: { persuasione: 5 }
          imposta: { segreto.ettore: 1 }
          effetti: { monete: -2, rep.maison: 1, informazioni.pettegolezzo: 1, rep.scuri: -0.5, fazione.maison: 1 }
          segue: maison-il-fiasco-senza-biglietto
        fallimento:
          titolo: Il nome buono
          testo: |
            Il ragazzino si stringe la lavagnetta al petto, ti dice che Mauro paga
            di più e sparisce. Domani alla Pignatta sapranno chi era seduto sul
            gradino della Maison. Kanat riporta a casa Ettore, e Sara ti guarda
            dalla soglia con la bocca stretta.
          imposta: { segreto.ettore: 1 }
          effetti: { monete: -2, rep.maison: 0.5, fazione.maison: 1, scandalo: 0.5 }
          segue: maison-il-fiasco-senza-biglietto

      - testo: "Comprare la lavagnetta al ragazzino"
        descrizione: "Dopo la notte della Pignatta i nomi li compra qualcun altro, e tu puoi pagarlo di più."
        quando: [pista.pelle >= 6]
        prova: { attributo: sociale, abilita: [persuasione, conoscenze-della-strada], difficolta: Media }
        successo:
          titolo: Il gesso
          testo: |
            Ti siedi sul paracarro accanto al ragazzino. Segna per due fratelli del
            Ponte del Pesce, ti dice, il grande con le spalle da scaricatore e il
            piccolo con il quaderno, che pagano solo i nomi buoni. Una lavagnetta
            pulita si vende comunque, e te la cede per qualche moneta e una
            caramella, mentre Kanat riporta a casa Ettore in braccio.
          pe: { persuasione: 5 }
          imposta: { segreto.ettore: 1 }
          effetti: { monete: -2, rep.maison: 1, informazioni.pettegolezzo: 1, fazione.maison: 1 }
          segue: maison-il-fiasco-senza-biglietto
        fallimento:
          titolo: Il nome buono
          testo: |
            Il ragazzino si stringe la lavagnetta al petto, ti dice che i fratelli
            del Ponte del Pesce pagano di più e sparisce. Kanat riporta a casa
            Ettore, e Sara ti guarda dalla soglia con la bocca stretta.
          imposta: { segreto.ettore: 1 }
          effetti: { monete: -2, rep.maison: 0.5, fazione.maison: 1, scandalo: 0.5 }
          segue: maison-il-fiasco-senza-biglietto

      - testo: "Fargli cadere la lavagnetta nel rigagnolo"
        descrizione: "Una spinta col gomito, e il gesso si scioglie nell'acqua sporca, purché sembri un caso."
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Media }
        successo:
          titolo: L'acqua sporca
          testo: |
            Attraversi guardando la lanterna e inciampi nel paracarro con tutto il
            peso del caso. La lavagnetta finisce di piatto nel rigagnolo, che si
            porta via il gesso, e tu chiedi scusa due volte. Intanto Kanat riporta
            a casa Ettore in braccio, come un bambino addormentato a una festa.
          pe: { furtivita: 5 }
          imposta: { segreto.ettore: 1 }
          effetti: { rep.maison: 1, informazioni.pettegolezzo: 1, rep.scuri: -0.5, fazione.maison: 1 }
          segue: maison-il-fiasco-senza-biglietto
        fallimento:
          titolo: Il ragazzino svelto
          testo: |
            Il ragazzino si tira indietro con la lavagnetta stretta al petto e tu
            finisci con un ginocchio nel rigagnolo. Lui ride e sparisce. Kanat
            riporta a casa Ettore, e tu torni alla Maison con i calzoni bagnati.
          imposta: { segreto.ettore: 1 }
          effetti: { ferite: 0.5, rep.maison: 0.5, fazione.maison: 1 }
          segue: maison-il-fiasco-senza-biglietto

      - testo: "Mandare a chiamare Quintus Vael"
        descrizione: "Il comandante della guardia dei Castaldi lo riporta a casa con discrezione, e Marella lo saprà."
        esito:
          titolo: La carrozza dei Castaldi
          testo: |
            Mandi un ragazzo ai Quartieri Alti con un biglietto per Quintus Vael,
            e dopo un'ora arriva una carrozza senza stemma. Quintus guarda Ettore,
            la porta della Maison e te, poi carica il cugino della Rappresentante
            come un sacco di grano e ti ringrazia con un cenno secco. Domani al
            Maniero Marella saprà dove l'hanno trovato e da chi, e intanto la
            lavagnetta si è riempita.
          imposta: { segreto.ettore: 1 }
          effetti: { rep.castaldi: 0.5, rep.maison: 0.5, fazione.maison: 1 }
          segue: maison-il-fiasco-senza-biglietto

      - testo: "Farlo passare dalla cucina come un parente"
        descrizione: "Un cugino di buona famiglia si porta in cucina per un caffè, e poi fuori dalla porta sul cortile."
        quando: [origine.rampollo-dei-quartieri-alti >= 1]
        prova: { attributo: sociale, abilita: galateo, difficolta: Facile }
        successo:
          titolo: Il cugino Ettore
          testo: |
            Lo chiami cugino ad alta voce, che nei Quartieri Alti lo siete un po'
            tutti, e lo porti via per il gomito come ai ricevimenti. In cucina
            Gretchen gli mette davanti un caffè nero e una fetta di pane, e poi lo
            riaccompagni a casa dalla porta sul cortile. La lavagnetta resta con
            un segno solo.
          pe: { galateo: 5 }
          imposta: { segreto.ettore: 1 }
          effetti: { rep.maison: 1, informazioni.pettegolezzo: 1, fazione.maison: 1 }
          segue: maison-il-fiasco-senza-biglietto
        fallimento:
          titolo: La strada dritta
          testo: |
            Ettore si offende, perché non ti riconosce e un Castaldi i cugini se
            li ricorda. Lo riporti alla Birreria per la strada dritta, sotto tutte
            le finestre del quartiere, e mezza Città Bassa ti vede in sua
            compagnia.
          imposta: { segreto.ettore: 1 }
          effetti: { scandalo: 1, rep.maison: 0.5, fazione.maison: 1 }
          segue: maison-il-fiasco-senza-biglietto

  - id: maison-il-fiasco-senza-biglietto
    immagine: personaggi/ettore-castaldi
    titolo: Il fiasco senza biglietto
    tipo: seguito
    luogo: Maison des Lunes, la cucina
    area: citta-bassa
    requisiti: [fazione.maison == 4]
    testo: |
      La mattina dopo un garzone della Birreria lascia per te, alla porta di
      servizio, un fiasco d'idromele sigillato a cera, senza biglietto.
      Gretchen lo posa sul tavolo della cucina e ci gira intorno come intorno
      a un gatto che non è suo.

      «Ettore Castaldi non scrive mai biglietti, è un uomo educato» dice.
      «Adesso sai dove passa le sue sere quando la famiglia lo crede alla
      Birreria, e qui dentro lo sappiamo in quattro.» Ti versa un dito
      d'idromele in una tazza da latte. «Che cosa te ne fai lo decidi tu. Un
      nome come quello, in questa città, vale una porta del Municipio.»

      {politica-ed-economia Media} La Rappresentante ha costruito la carriera
      sulla sobrietà dei Castaldi. Un cugino ubriaco sul gradino di Via dei
      Rasoi è una leva lunga.
    opzioni:
      - testo: "Dimenticarlo, come si fa in questa casa"
        descrizione: "I nomi che senti alla Maison restano alla Maison."
        costo: 0
        esito:
          titolo: L'idromele
          testo: |
            L'idromele sa di miele di castagno, e dici a Gretchen che di quella
            sera ricordi soltanto un uomo grosso che cantava male. Lei ride con la
            sua risata profonda e ti riempie la tazza.
          pe: { empatia: 3 }
      - testo: "Tenerti il nome per quando servirà"
        descrizione: "Nessuno lo saprà, e una leva in un cassetto non fa male a nessuno finché resta lì."
        costo: 0
        esito:
          titolo: Il cassetto
          testo: |
            Bevi in silenzio, e Gretchen lascia cadere il discorso. Il nome di
            Ettore lo metti da parte, con la strada che fa la sera e l'ora del
            gradino. Quando esci Gretchen resta sulla soglia a guardarti
            attraversare il cortile.
          imposta: { maison.leva-ettore: 1 }

  # ------------------------------------------------------------ passo 5 · le domande gentili
  - id: maison-le-domande-gentili
    presso: via-dei-rasoi
    immagine: ambientazione/maison-des-lunes
    titolo: Le domande gentili
    sommario: "In salone una ragazza batte con le dita un segnale che nessuna usa mai, e Tachek non sa che cosa farne."
    luogo: Maison des Lunes, il salone
    area: citta-bassa
    requisiti: [fazione.maison == 4, pista.dama-argento >= 11]
    testo: |
      Le lampade con gli schermi di vetro fumé fanno sembrare tutti più giovani.
      Sul divano Irmelin, una mezzelfa con gli occhi scuri punteggiati d'argento,
      ascolta il suo cliente con la faccia che si fa guardando piovere.

      Mentre il cliente parla, Irmelin batte due volte l'indice sul bracciolo e poi
      lo stende piatto. «Troppo gentile» dice Tachek, irrigidendosi. «Quel segnale
      non lo usa nessuna.»

      Il cliente ha la barba curata e tiene le mani in grembo. Le chiede con garbo
      chi viene il giovedì e chi sale nella Luna Calante, e ogni tanto alza gli
      occhi verso la lampada sopra il divano, come si controlla l'ora. Tachek non
      può buttare fuori un uomo educato.

      {percezione Facile} La lampada fa una luce appena più fredda delle altre.

      *Uno che paga per non toccare niente sta comprando qualcos'altro.* Lui lascia
      le monete sul tavolino e va a ritirare l'arma all'armadio di Sara.
    opzioni:
      - testo: "Seguirlo quando esce"
        descrizione: "Ha ritirato l'arma e si è infilato il cappuccio, e va a piedi senza fretta."
        prova: { attributo: fisico, abilita: [furtivita, atletica], difficolta: Media }
        successo:
          titolo: La manica
          testo: |
            Lo segui a trenta passi fino al gomito di Via dei Rasoi. Al cristallo
            spento posa la mano nuda sulla pietra e parla dentro la manica del
            mantello per il tempo di un padrenostro, poi prosegue verso il Ponte
            del Pesce. Torni indietro pensando che il cristallo spento, stanotte,
            non sia poi così spento.
          pe: { furtivita: 5 }
          imposta: { maison.irmelin: 1 }
          effetti: { rep.maison: 1, fazione.maison: 1 }
        fallimento:
          titolo: Il cappuccio che si volta
          testo: |
            Al gomito della strada l'uomo si volta e ti augura la buona notte con
            molta educazione, poi tira dritto senza fermarsi al cristallo spento.
            Adesso conosce la tua faccia. Più tardi Irmelin ti dice soltanto che
            guardava sempre la lampada.
          imposta: { maison.irmelin: 1 }
          effetti: { sospetto: 1, rep.maison: 0.5, fazione.maison: 1 }

      - testo: "Parlare con Irmelin quando lui se ne va"
        descrizione: "Ha battuto il segnale perché qualcuno l'ascoltasse."
        prova: { attributo: sociale, abilita: [empatia, persuasione], difficolta: Media }
        successo:
          titolo: La lampada
          testo: |
            Ti siedi accanto a lei a una distanza educata e le chiedi soltanto se
            vuole un tè. Mentre lo beve ti racconta che il cliente viene da un
            mese e chiede sempre le stesse cose con parole diverse, e quando lei
            risponde guarda la lampada. «Come se parlasse con qualcun altro» dice,
            «e io fossi la strada per arrivarci.»
          pe: { empatia: 5 }
          imposta: { maison.irmelin: 1 }
          effetti: { rep.maison: 1, fazione.maison: 1 }
        fallimento:
          titolo: Il segnale sprecato
          testo: |
            Le chiedi subito chi era e che cosa voleva, con la voce di uno che
            compila un rapporto. Irmelin risponde a monosillabi, ti dice soltanto
            che lui guardava sempre la lampada e torna al lavoro.
          imposta: { maison.irmelin: 1 }
          effetti: { rep.maison: 0.5, fazione.maison: 1, scandalo: 0.5 }

      - testo: "Esaminare la lampada sopra il divano"
        descrizione: "Le lampade della Maison le accende Nerissa, e nessuno ci mette le mani."
        prova: { attributo: mentale, abilita: [tecnologia, magia], difficolta: Media }
        successo:
          titolo: Il vetro freddo
          testo: |
            Sali sul divano e stacchi lo schermo di vetro fumé. Fra lo stoppino e
            il riflettore d'ottone qualcuno ha incastrato una scheggia di
            cristallo conduttore grande come un'unghia, che vibra appena a tempo
            con le voci del salone. Rimetti lo schermo senza toccarla, e Tachek
            dal fondo si porta due dita alla cintura.
          pe: { tecnologia: 5 }
          imposta: { maison.irmelin: 1 }
          effetti: { rep.maison: 1, fazione.maison: 1 }
        fallimento:
          titolo: La lampada si spegne
          testo: |
            Stacchi lo schermo troppo in fretta e la fiamma si spegne. Nel buio,
            per un attimo, brilla qualcosa fra lo stoppino e il riflettore.
            Gretchen riaccende la lampada con un fiammifero e ti guarda in
            silenzio.
          imposta: { maison.irmelin: 1 }
          effetti: { scandalo: 1, rep.maison: 0.5, fazione.maison: 1 }

      - testo: "Leggere il Mana intorno alla lampada"
        descrizione: "Una formula breve, e la lampada ti dice da dove viene il suo freddo."
        incantesimo: leggere-il-mana
        prova: { attributo: mentale, abilita: magia, difficolta: Facile }
        successo:
          titolo: Il filo
          testo: |
            Il Mana del salone ti si mostra come una stoffa calda color miele
            stesa su tutte le lampade. Da quella sopra il divano esce un filo
            freddo, teso come una lenza, che passa sotto la finestra e va verso il
            gomito di Via dei Rasoi, dove sta il cristallo spento.
          pe: { magia: 5 }
          imposta: { maison.irmelin: 1 }
          effetti: { rep.maison: 1, fazione.maison: 1 }
        fallimento:
          titolo: Troppa luce
          testo: |
            Il Mana del salone ti arriva addosso tutto insieme e devi chiudere gli
            occhi. Una delle lampade aveva un freddo diverso, ma quale fosse non
            lo ricordi più.
          imposta: { maison.irmelin: 1 }
          effetti: { tormento: 1, rep.maison: 0.5, fazione.maison: 1 }

      - testo: "Chiedere a Jass"
        descrizione: "Jass ha lavorato per gli Scuri, e sa che forma avrebbe un loro orecchio in questa casa."
        immagine: personaggi/jass
        quando: [jass == 1, pista.pelle < 6]
        esito:
          titolo: Dopo di me
          testo: |
            Jass ti tira dietro la tenda in fondo al corridoio e ti parla con la bocca sul tuo orecchio. «Quando con me non
            ha funzionato più, gli Scuri hanno cercato un orecchio che non dorme e non si innamora» dice. «L'ho sentito dire
            a Mauro, e ho riso.» Poi guarda la lampada sopra il divano, tormentandosi una ciocca rossa.
          pe: { empatia: 5 }
          imposta: { maison.irmelin: 1 }
          effetti: { rep.maison: 1, fazione.maison: 1 }

      - testo: "Sentire la luce come si sente il Bosco"
        descrizione: "Al Circolo hai imparato a sentire l'odore del Mana guasto, simile all'acqua ferma."
        quando: [origine.figlio-del-circolo >= 1]
        prova: { attributo: mentale, abilita: [natura, percezione], difficolta: Media }
        successo:
          titolo: Il ferro bagnato
          testo: |
            Annusi l'aria come nel Bosco quando cerchi una sorgente. Fra la cera e
            il tabacco c'è un filo di ferro bagnato, l'odore del Mana guasto delle
            radici malate. Viene dalla lampada sopra il divano, ed è lo stesso che
            senti passando al cristallo spento in fondo alla via.
          pe: { natura: 5 }
          imposta: { maison.irmelin: 1 }
          effetti: { rep.maison: 1, fazione.maison: 1 }
        fallimento:
          titolo: Troppa luce
          testo: |
            Il salone sa di troppe cose insieme, e il filo che cercavi si perde
            fra la cera e l'acqua di rose. Una delle lampade aveva un freddo
            diverso, ma quale fosse il naso non te lo dice.
          imposta: { maison.irmelin: 1 }
          effetti: { tormento: 1, rep.maison: 0.5, fazione.maison: 1 }
