# La quest della Maison des Lunes, passi 3-5 (i passi 1 e 2 stanno in contenuti/citta/maison.yaml).
# - Passo 3, la sala interna (primo grado, Chiamato per nome): una partita di Zekar con il mercante dell'argento,
#   che sta per puntare il nome di un altro cliente. Ogni ramo dà il ventaglio dei segnali e porta rep.maison almeno a
#   2; chi al passo 1 è stato scoperto a leggere il quaderno (maison.quaderno 5) trova Difficile la via del Galateo.
#   Seguito: i segnali di Tachek (solo PE e colore).
# - Passo 4, il cugino della Rappresentante (pista.dama-argento >= 6): Ettore Castaldi ubriaco sul gradino e il
#   ragazzino con la lavagnetta, che prima della Pignatta segna per Mauro e dopo per i fratelli del Ponte del Pesce.
#   Ogni ramo dà segreto.ettore. Seguito: il fiasco senza biglietto, dove si decide maison.leva-ettore.
# - Passo 5, le domande gentili (pista.dama-argento >= 11): Irmelin, il cliente troppo gentile e la lampada.
#   Dà maison.irmelin; con jass 1, prima della Pignatta, Jass dice dell'orecchio.
zekar:
  - id: maison-mercante-dell-argento
    nome: Il mercante dell'argento
    immagine: fazioni/gilda-dei-mercanti
    descrizione: "Paga in argento nuovo e punta forte, perché pensa di avere già perso. Si ferma tardi e cala le laterali alte senza pensarci."
    laterali: [-2, 1, 3, 4]
    soglia: 18
    mira: 20

storylet:
  # ------------------------------------------------------------ passo 3 · la sala interna (primo grado)
  - id: maison-la-sala-interna-passo
    presso: via-dei-rasoi
    immagine: ambientazione/maison-des-lunes
    titolo: La sala interna
    sommario: "Gretchen ti ha visto sulla scala, la notte della lanterna spenta. Stasera ti fa entrare nella stanza dietro il salone, dove si gioca a Zekar."
    luogo: Maison des Lunes, la sala interna
    area: citta-bassa
    requisiti: [fazione.maison == 2]
    testo: |
      Chiara dà le carte con il portasigarette d'osso fra due dita, e la cenere non cade mai. Le carte sono
      vecchie e morbide agli angoli, e scivolano sul panno senza fare rumore. In un angolo Gretchen tiene i
      conti a gesso su una lavagnetta.

      {galateo Facile} Sul tavolo, al posto delle monete, ci sono biglietti piegati in quattro che valgono
      quello che c'è scritto dentro.

      Il mercante di fronte a Chiara lo riconosci dal panciotto, perché in salone paga sempre in argento
      nuovo. Stasera ha perso tutto e sta scrivendo un altro biglietto. Gretchen ti si china all'orecchio.
      «Sta per giocarsi il nome di un altro cliente, l'unica posta che qui non si accetta» dice. «Se la mette
      sul panno chiudiamo la sala.» Poi ti lascia la sua sedia.

      {origine mercante-dei-ponti} Il suo argento esce dalla Casa dei Nodi nei sacchetti che la Gilda usa per
      i pagamenti di riguardo, e chi lo riceve non dovrebbe avere bisogno di vendere un nome.

      *Se quel biglietto arriva sul panno, qualcuno domani perde molto più di una partita.* Il mercante
      intinge di nuovo la penna e tiene il foglio sul ginocchio, lontano dagli occhi del tavolo.
    opzioni:
      - testo: "Sederti e giocare contro di lui"
        descrizione: "Se vinci, il mercante paga in favori e il nome resta nella sua tasca."
        zekar: maison-mercante-dell-argento
        vittoria:
          titolo: Il biglietto nella tasca
          testo: |
            Il mercante si ferma a diciotto e tu arrivi a venti con l'ultima laterale, e lui guarda le carte a
            lungo prima di capire che è finita. Gretchen cancella la lavagnetta con il palmo, e il gesso le
            resta bianco sulla mano. Poi ti chiama per nome davanti a tutti, che in questa stanza vuol dire
            più di una vincita.

            Prima che tu esca Tachek ti fa scivolare in mano un ventaglio di carta dipinta. Domani, dice, ti
            insegnerà a usarlo come si deve.
          pe: { empatia: 10 }
          effetti: { informazioni.pettegolezzo: 1, monete: 30, oggetto.maison-ventaglio-dei-segnali: 1, rep.maison: 1, fazione.maison: 1 }
          almeno: { rep.maison: 2 }
          segue: maison-i-segnali-di-tachek
        sconfitta:
          titolo: Il debito della signora
          testo: |
            Perdi l'ultima mano per un punto, e il mercante sollevato non ha più bisogno del biglietto. Lo
            rimette nel taschino del panciotto ancora piegato in quattro. Il tuo debito lo segna Gretchen
            sulla lavagnetta, e il giorno dopo Nerissa lo salda di tasca sua senza dirti niente. Lo sai perché
            a fine serata Sara ti chiama per nome e ti trattiene la paga della settimana, sorridendo.

            Prima che tu esca Tachek ti fa scivolare in mano un ventaglio di carta dipinta. Domani, dice, ti
            insegnerà a usarlo come si deve.
          pe: { empatia: 10 }
          effetti: { monete: 10, oggetto.maison-ventaglio-dei-segnali: 1, fazione.maison: 1 }
          almeno: { rep.maison: 2 }
          segue: maison-i-segnali-di-tachek

      - testo: "Farlo alzare con un pretesto"
        descrizione: "Una moglie in pensiero o una carrozza davanti al cortile. Detta bene, una bugia educata lo porta fuori dalla sala prima che posi il biglietto."
        quando: [maison.quaderno != 5]
        prova: { attributo: sociale, abilita: [galateo, ingannare], difficolta: Media }
        successo:
          titolo: La carrozza
          testo: |
            Il mercante si alza così in fretta che rovescia la sedia, e il biglietto gli resta in mano mezzo
            scritto, con l'inchiostro ancora bagnato. Gretchen lo accompagna in cortile per una strada che non
            passa dal salone. Quando torna ti chiama per nome e si siede accanto a te a contare i favori della
            serata.

            Prima che tu esca Tachek ti fa scivolare in mano un ventaglio di carta dipinta. Domani, dice, ti
            insegnerà a usarlo come si deve.
          pe: { empatia: 10 }
          effetti: { monete: 30, oggetto.maison-ventaglio-dei-segnali: 1, rep.maison: 1, fazione.maison: 1 }
          almeno: { rep.maison: 2 }
          segue: maison-i-segnali-di-tachek
        fallimento:
          titolo: La lettera che non c'è
          testo: |
            Il biglietto finisce sul panno, e Chiara lo spinge indietro con la punta del portasigarette senza
            aprirlo. Poi chiude la partita alzandosi per prima, e la cenere le resta attaccata alla sigaretta.
            Il mercante esce rosso in faccia, e domani in salone qualcuno racconterà che alla Maison hanno
            trattato male un uomo della Gilda.

            Prima che tu esca Tachek ti fa scivolare in mano un ventaglio di carta dipinta. Domani, dice, ti
            insegnerà a usarlo come si deve.
          pe: { empatia: 10 }
          effetti: { scandalo: 1, monete: 10, oggetto.maison-ventaglio-dei-segnali: 1, fazione.maison: 1 }
          almeno: { rep.maison: 2 }
          segue: maison-i-segnali-di-tachek

      - testo: "Farlo alzare con un pretesto"
        descrizione: "Sara ti ha visto con il dito sul suo quaderno, e in questa casa lo sanno tutti."
        quando: [maison.quaderno == 5]
        prova: { attributo: sociale, abilita: [galateo, ingannare], difficolta: Difficile }
        successo:
          titolo: La carrozza
          testo: |
            Gli dici sottovoce che fuori c'è un ragazzo della Casa dei Nodi che chiede di lui, e lo dici con
            tanta noia che sembra vero. Lui posa la penna di traverso sul foglio e si alza. Gretchen lo
            accompagna in cortile. Quando torna ti guarda a lungo, poi ti chiama per nome, una volta sola,
            come una cosa da tenere a mente.

            Prima che tu esca Tachek ti fa scivolare in mano un ventaglio di carta dipinta. Domani, dice, ti
            insegnerà a usarlo come si deve.
          pe: { empatia: 10 }
          effetti: { monete: 30, oggetto.maison-ventaglio-dei-segnali: 1, rep.maison: 1, fazione.maison: 1 }
          almeno: { rep.maison: 2 }
          segue: maison-i-segnali-di-tachek
        fallimento:
          titolo: La lettera che non c'è
          testo: |
            Gli dici della lettera sigillata, e Chiara alza gli occhi dalle carte prima di lui. Il biglietto
            finisce sul panno, e Chiara lo spinge indietro con la punta del portasigarette senza aprirlo. Poi
            chiude la partita. Il mercante esce rosso in faccia, e domani in salone qualcuno racconterà che
            alla Maison hanno trattato male un uomo della Gilda.

            Prima che tu esca Tachek ti fa scivolare in mano un ventaglio di carta dipinta. Domani, dice, ti
            insegnerà a usarlo come si deve.
          pe: { empatia: 10 }
          effetti: { scandalo: 1, monete: 10, oggetto.maison-ventaglio-dei-segnali: 1, fazione.maison: 1 }
          almeno: { rep.maison: 2 }
          segue: maison-i-segnali-di-tachek

      - testo: "Lasciarlo a Chiara"
        descrizione: "Tocca a te accorgerti del momento giusto e passarle la mano."
        prova: { attributo: sociale, abilita: [empatia, percezione], difficolta: Media }
        successo:
          titolo: Il portasigarette
          testo: |
            Aspetti che il mercante alzi la penna per cercare le parole, e in quel momento sposti la tua sedia
            di un palmo verso Chiara. Lei si sporge, gli posa il portasigarette d'osso sul foglio e gli dice
            qualcosa a voce così bassa che non lo senti nemmeno tu. Il mercante strappa il biglietto in
            quattro e chiede scusa al tavolo con la testa bassa. Gretchen ti chiama per nome, e Chiara ti
            concede un mezzo sguardo, che per lei è parecchio.

            Prima che tu esca Tachek ti fa scivolare in mano un ventaglio di carta dipinta. Domani, dice, ti
            insegnerà a usarlo come si deve.
          pe: { empatia: 10 }
          effetti: { monete: 30, oggetto.maison-ventaglio-dei-segnali: 1, rep.maison: 1, fazione.maison: 1 }
          almeno: { rep.maison: 2 }
          segue: maison-i-segnali-di-tachek
        fallimento:
          titolo: Troppo presto
          testo: |
            Alla fine ci vuole Tachek, con una mano sulla spalla e la voce gentile, per portarlo in cortile
            con il biglietto in tasca. La sala si svuota presto. Gretchen conta in silenzio i favori persi
            della serata e passa il gesso sulla lavagnetta riga per riga, ma a fine sera ti chiama comunque
            per nome.

            Prima che tu esca Tachek ti fa scivolare in mano un ventaglio di carta dipinta. Domani, dice, ti
            insegnerà a usarlo come si deve.
          pe: { empatia: 10 }
          effetti: { monete: 10, oggetto.maison-ventaglio-dei-segnali: 1, fazione.maison: 1, scandalo: 0.5 }
          almeno: { rep.maison: 2 }
          segue: maison-i-segnali-di-tachek

      - testo: "Lasciarlo puntare e sentire il nome"
        descrizione: "Un nome detto in questa stanza vale molto, fuori. Basta non fermarlo."
        esito:
          titolo: Il nome sul panno
          testo: |
            Il mercante posa il biglietto sul panno e lo apre lui stesso, per far vedere che è una posta
            seria. Il nome è scritto in lettere grandi e attente, e lo leggi anche tu. È di un uomo che in
            salone viene il giovedì e che in città ha una moglie e una bottega. Gretchen ti chiama per nome lo
            stesso, perché sei stat{o|a} tu a sederti, e intanto non ti guarda.

            Prima che tu esca Tachek ti fa scivolare in mano un ventaglio di carta dipinta. Domani, dice, ti
            insegnerà a usarlo come si deve.
          pe: { empatia: 10 }
          effetti: { informazioni.segreto: 1, rep.maison: -1, monete: 30, oggetto.maison-ventaglio-dei-segnali: 1, fazione.maison: 1 }
          almeno: { rep.maison: 2 }
          segue: maison-i-segnali-di-tachek

      - testo: "Parlargli dell'argento della Casa dei Nodi"
        descrizione: "Le sue monete escono dai sacchetti di riguardo della Gilda. Al banco, fra mercanti, una cosa così si dice sottovoce e chiude qualunque discorso."
        quando: [origine.mercante-dei-ponti >= 1]
        esito:
          titolo: Fra mercanti
          testo: |
            Ti chini verso di lui e gli chiedi, da collega, se l'argento di riguardo della Casa dei Nodi si
            conia ancora con il bordo zigrinato o se hanno cambiato stampo. Lui ti guarda le mani prima della
            faccia. Poi strappa il biglietto e chiede scusa al tavolo, e Gretchen ti chiama per nome dal suo
            angolo senza alzare gli occhi dalla lavagnetta.

            Prima che tu esca Tachek ti fa scivolare in mano un ventaglio di carta dipinta. Domani, dice, ti
            insegnerà a usarlo come si deve.
          pe: { empatia: 10 }
          effetti: { monete: 30, oggetto.maison-ventaglio-dei-segnali: 1, rep.maison: 1, fazione.maison: 1 }
          almeno: { rep.maison: 2 }
          segue: maison-i-segnali-di-tachek

  - id: maison-i-segnali-di-tachek
    immagine: personaggi/tachek
    titolo: I segnali di Tachek
    tipo: seguito
    luogo: Maison des Lunes, il salone vuoto
    area: citta-bassa
    requisiti: [fazione.maison == 3]
    testo: |
      Il giorno dopo, nell'ora morta, il salone ha le sedie capovolte sui tavoli e sa ancora del fumo della
      sera. Tachek ti aspetta con un ventaglio uguale al tuo e ti fa sedere di fronte a lui.

      «Le ragazze si fanno i segnali con le mani, noi usiamo questo» dice, e chiude il ventaglio di scatto.
      «Chiuso vuol dire vieni. Battuto sul palmo vuol dire aspetta. Aperto a metà vuol dire che il cliente ha
      bevuto.» Lo apre del tutto e ci si fa aria. «Così vuol dire che ho caldo, ma all'inizio lo scambiano
      tutti per un segnale.»

      {percezione Media} Intanto batte due dita sulla cintura senza guardare, per rispondere a Kasja che si è
      affacciata alla porta a chiedere se c'è caffè.
    opzioni:
      - testo: "Ripetere i segnali finché non vengono da soli"
        descrizione: "Un'ora di ventaglio aperto e chiuso, con Tachek che ti corregge il polso."
        costo: 0
        esito:
          titolo: Il polso
          testo: |
            Apri e chiudi il ventaglio finché il polso ti fa male e il gesto smette di sembrare un gesto.
            Tachek ti corregge sempre nello stesso punto, il pollice che stringe troppo. Verso la fine il tuo
            ventaglio si chiude con lo stesso colpo secco del suo. Allora ti dice che per stasera basta, e che
            i segnali veri li imparerai in salone, sbagliando davanti a tutti come ha fatto lui.
          pe: { percezione: 3 }
      - testo: "Chiedergli come ha imparato lui"
        descrizione: "Tachek non racconta mai niente di sé. Forse oggi sì, a casa chiusa."
        costo: 0
        esito:
          titolo: La prima sera
          testo: |
            Tachek ci pensa un poco, con il ventaglio chiuso fermo sul ginocchio. Poi ti dice che la prima
            sera ha scambiato un ventaglio aperto per un ventaglio chiuso e ha portato fuori di peso il
            fratello della signora, venuto per gli auguri. «Lei ha riso per una settimana» dice, e richiude il
            ventaglio con un colpo secco. «Da quella sera non ho più sbagliato un segnale.»
          pe: { empatia: 3 }

  # ------------------------------------------------------------ passo 4 · il cugino della Rappresentante
  - id: maison-il-cugino-della-rappresentante
    presso: via-dei-rasoi
    immagine: personaggi/ettore-castaldi
    titolo: Il cugino della Rappresentante
    sommario: "Sul gradino della Maison è seduto un uomo grande e grosso con il mantello buono, e Churl gli ha appena detto di no."
    luogo: Via dei Rasoi, davanti alla Maison
    area: citta-bassa
    requisiti: [fazione.maison == 3, pista.dama-argento >= 6]
    testo: |
      In Via dei Rasoi la lanterna si è appena accesa, e lo stoppino sfrigola ancora dietro il vetro. Sul
      gradino della Maison è seduto un uomo grande e grosso con il mantello buono buttato su una spalla, e
      l'orlo di lana fitta pende nel fango del rigagnolo. Churl lo guarda dalla soglia con le braccia
      incrociate, perché alla Maison si entra sobri e quest'uomo sobrio non è.

      Quando alza la testa riconosci Ettore Castaldi, il cugino della Rappresentante, quello della Birreria
      del Paladino Stanco.

      Dall'altra parte della strada un ragazzino seduto su un paracarro segna col gesso su una lavagnetta ogni
      volta che la porta si apre. Ha le dita bianche di gesso fino alle nocche.

      {conoscenze-della-strada Media} Chi segna gli ingressi di Via dei Rasoi lo fa per qualcuno che paga a
      nome, e stasera sulla lavagnetta c'è un nome che vale una settimana di paga.

      {origine rampollo-dei-quartieri-alti} A una cena di consiglio Ettore ti ha versato da bere due volte, e
      la seconda ha chiesto scusa al vino. Nei Quartieri Alti lo trattano con un affetto che somiglia molto al
      tenerlo d'occhio.

      Sara si affaccia dietro Churl e ti cerca con lo sguardo.
    opzioni:
      - testo: "Riportarlo a casa per il giro lungo"
        descrizione: "La Birreria del Paladino Stanco è a un quarto d'ora, e la strada dritta passa sotto troppe finestre. Ci vuole qualcuno che conosca i vicoli."
        prova: { attributo: sociale, abilita: [conoscenze-della-strada, persuasione], difficolta: Media }
        successo:
          titolo: Il giro lungo
          testo: |
            Lo prendi sottobraccio e lo porti via per Via del Salmone e poi per i vicoli dei cardatori, dove a
            quest'ora non c'è nessuno che sappia chi è. Sui selciati dei cardatori ci sono ancora i fiocchi di
            lana della giornata, e i vostri passi non fanno rumore. Ettore ti racconta dell'incendio del
            Santuario e di un cavallo bianco che aveva da ragazzo, e a metà strada si mette a piangere senza
            smettere di camminare. Alla Birreria la garzona lo prende in consegna senza fare domande. La
            lavagnetta, dall'altra parte della strada, resta con un segno solo, quello di un uomo seduto.
          pe: { conoscenze-della-strada: 5 }
          imposta: { segreto.ettore: 1 }
          effetti: { rep.maison: 1, informazioni.pettegolezzo: 1, fazione.maison: 1 }
          segue: maison-il-fiasco-senza-biglietto
        fallimento:
          titolo: La strada dritta
          testo: |
            Ettore non vuole fare il giro lungo. Si pianta in mezzo a Via del Salmone e dichiara a voce alta
            che un Castaldi cammina per la strada dritta, e da tre finestre si affacciano a guardare chi è il
            Castaldi. Lo porti alla Birreria per la strada dritta, sotto tutte le finestre del quartiere, e a
            ogni lanterna lui si ferma a salutare qualcuno che non c'è. La garzona lo prende in consegna, e a
            te resta addosso l'impressione di essere stat{o|a} vist{o|a} in sua compagnia da mezza Città
            Bassa.
          imposta: { segreto.ettore: 1 }
          effetti: { scandalo: 1, rep.maison: 0.5, fazione.maison: 1 }
          segue: maison-il-fiasco-senza-biglietto

      - testo: "Comprare la lavagnetta al ragazzino"
        descrizione: "Chi lo paga, lo paga a nome. Tu puoi pagarlo di più perché quella di stasera la cancelli."
        quando: [pista.pelle < 6]
        prova: { attributo: sociale, abilita: [persuasione, conoscenze-della-strada], difficolta: Media }
        successo:
          titolo: Il gesso
          testo: |
            Ti siedi sul paracarro accanto al ragazzino e gli chiedi per chi segna. Ti dice che lavora per
            Mauro, il quale paga a nome e solo i nomi buoni. Gli fai notare che stasera di nomi buoni non ne
            passano, e che una lavagnetta pulita si vende comunque. Te la cede per qualche moneta e una
            caramella. Mentre la pulisci con la manica il gesso viene via in una polvere bianca che ti resta
            sulla giubba, e intanto Churl fa alzare Ettore e lo affida a Kanat, che lo riporta a casa in
            braccio.
          pe: { persuasione: 5 }
          imposta: { segreto.ettore: 1 }
          effetti: { monete: -2, rep.maison: 1, informazioni.pettegolezzo: 1, rep.scuri: -0.5, fazione.maison: 1 }
          segue: maison-il-fiasco-senza-biglietto
        fallimento:
          titolo: Il nome buono
          testo: |
            Il ragazzino ti ascolta, poi si stringe la lavagnetta al petto e ti dice che Mauro paga di più.
            Sparisce verso il cristallo spento prima che tu possa alzarti, e senti i suoi passi sul selciato
            finché la via non piega. Domani alla Pignatta sapranno chi era seduto sul gradino della Maison.
            Churl fa alzare Ettore e lo affida a Kanat, e Sara ti guarda dalla soglia con la bocca stretta.
          imposta: { segreto.ettore: 1 }
          effetti: { monete: -2, rep.maison: 0.5, fazione.maison: 1, scandalo: 0.5 }
          segue: maison-il-fiasco-senza-biglietto

      - testo: "Comprare la lavagnetta al ragazzino"
        descrizione: "Dopo la notte della Pignatta i nomi li compra qualcun altro. Chi lo paga, lo paga a nome, e tu puoi pagarlo di più."
        quando: [pista.pelle >= 6]
        prova: { attributo: sociale, abilita: [persuasione, conoscenze-della-strada], difficolta: Media }
        successo:
          titolo: Il gesso
          testo: |
            Ti dice che lavora per due fratelli del Ponte del Pesce, il grande con le spalle da scaricatore e
            il piccolo con il quaderno. Gli fai notare che una lavagnetta pulita si vende comunque. Te la cede
            per qualche moneta e una caramella. Mentre la pulisci con la manica il gesso viene via in una
            polvere bianca che ti resta sulla giubba, e intanto Churl fa alzare Ettore e lo affida a Kanat,
            che lo riporta a casa in braccio.
          pe: { persuasione: 5 }
          imposta: { segreto.ettore: 1 }
          effetti: { monete: -2, rep.maison: 1, informazioni.pettegolezzo: 1, fazione.maison: 1 }
          segue: maison-il-fiasco-senza-biglietto
        fallimento:
          titolo: Il nome buono
          testo: |
            Il ragazzino ti ascolta, poi si stringe la lavagnetta al petto e ti dice che i fratelli del Ponte
            del Pesce pagano di più. Sparisce verso il cristallo spento prima che tu possa alzarti, e senti i
            suoi passi sul selciato finché la via non piega. Churl fa alzare Ettore e lo affida a Kanat, e
            Sara ti guarda dalla soglia con la bocca stretta.
          imposta: { segreto.ettore: 1 }
          effetti: { monete: -2, rep.maison: 0.5, fazione.maison: 1, scandalo: 0.5 }
          segue: maison-il-fiasco-senza-biglietto

      - testo: "Fargli cadere la lavagnetta nel rigagnolo"
        descrizione: "Un passo distratto, una spinta col gomito, e il gesso si scioglie nell'acqua sporca. Bisogna che sembri un caso."
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Media }
        successo:
          titolo: L'acqua sporca
          testo: |
            Attraversi la strada guardando la lanterna e inciampi nel paracarro con tutto il peso del caso. La
            lavagnetta vola dalle ginocchia del ragazzino e finisce di piatto nel rigagnolo, dove l'acqua dei
            piatti di mezza via si porta via il gesso in una scia bianca. Chiedi scusa due volte. Intanto
            Churl fa alzare Ettore e lo affida a Kanat, che lo riporta a casa in braccio come un bambino
            addormentato a una festa.
          pe: { furtivita: 5 }
          imposta: { segreto.ettore: 1 }
          effetti: { rep.maison: 1, informazioni.pettegolezzo: 1, rep.scuri: -0.5, fazione.maison: 1 }
          segue: maison-il-fiasco-senza-biglietto
        fallimento:
          titolo: Il ragazzino svelto
          testo: |
            Inciampi nel paracarro con tutto il peso del caso, ma il ragazzino è più svelto di te. Si tira
            indietro con la lavagnetta stretta al petto e tu finisci con un ginocchio nel rigagnolo, dove
            l'acqua dei piatti è ancora tiepida. Lui ride e sparisce verso il cristallo spento. Churl fa
            alzare Ettore e lo affida a Kanat, e tu torni alla Maison con i calzoni bagnati e un livido che
            domani avrà un bel colore.
          imposta: { segreto.ettore: 1 }
          effetti: { ferite: 0.5, rep.maison: 0.5, fazione.maison: 1 }
          segue: maison-il-fiasco-senza-biglietto

      - testo: "Mandare a chiamare Quintus Vael"
        descrizione: "Il comandante della guardia dei Castaldi lo porta a casa con discrezione."
        esito:
          titolo: La carrozza dei Castaldi
          testo: |
            Mandi un ragazzo di corsa ai Quartieri Alti con un biglietto per Quintus Vael, e dopo un'ora
            arriva una carrozza senza stemma. I cavalli hanno gli zoccoli fasciati di pezza, e sul selciato
            non fanno quasi rumore. Quintus scende con l'armatura di cuoio sotto il mantello e passa con lo
            sguardo da Ettore alla porta della Maison, e da lì a te. Carica il cugino della Rappresentante
            come un sacco di grano e ti ringrazia con un cenno secco. Domani al Maniero Marella saprà dove
            l'hanno trovato, e da chi. La lavagnetta, dall'altra parte della strada, intanto si è riempita.
          imposta: { segreto.ettore: 1 }
          effetti: { rep.castaldi: 0.5, rep.maison: 0.5, fazione.maison: 1 }
          segue: maison-il-fiasco-senza-biglietto

      - testo: "Farlo passare dalla cucina come un parente"
        descrizione: "Un cugino di buona famiglia che ha bevuto un bicchiere al matrimonio sbagliato si porta in cucina, gli si dà un caffè e lo si rimanda a casa dalla porta sul cortile."
        quando: [origine.rampollo-dei-quartieri-alti >= 1]
        prova: { attributo: sociale, abilita: galateo, difficolta: Facile }
        successo:
          titolo: Il cugino Ettore
          testo: |
            Lo chiami cugino ad alta voce, che in fondo nei Quartieri Alti lo siete un po' tutti, e lo porti
            via dal gradino tenendolo per il gomito come si fa ai ricevimenti. In cucina Gretchen gli mette
            davanti un caffè nero e una fetta di pane, e lui li mangia con le maniere che sua madre gli ha
            insegnato, il tovagliolo sulle ginocchia e il mignolo staccato dalla tazza. Lo riaccompagni a casa
            dalla porta sul cortile. La lavagnetta, dall'altra parte della strada, resta con un segno solo.
          pe: { galateo: 5 }
          imposta: { segreto.ettore: 1 }
          effetti: { rep.maison: 1, informazioni.pettegolezzo: 1, fazione.maison: 1 }
          segue: maison-il-fiasco-senza-biglietto
        fallimento:
          titolo: La strada dritta
          testo: |
            Lo chiami cugino ad alta voce, e lui si offende, perché non ti riconosce e un Castaldi i cugini se
            li ricorda. Si pianta in mezzo a Via del Salmone, e lo riporti alla Birreria per la strada dritta,
            sotto tutte le finestre del quartiere. La garzona lo prende in consegna, e a te resta addosso
            l'impressione di essere stat{o|a} vist{o|a} in sua compagnia da mezza Città Bassa.
          imposta: { segreto.ettore: 1 }
          effetti: { scandalo: 1, rep.maison: 0.5, fazione.maison: 1 }
          segue: maison-il-fiasco-senza-biglietto

  - id: maison-il-fiasco-senza-biglietto
    immagine: personaggi/ettore-castaldi
    titolo: Il fiasco senza biglietto
    tipo: seguito
    luogo: Maison des Lunes, la cucina
    area: citta-bassa
    requisiti: [fazione.maison == 4]
    testo: |
      La mattina dopo un garzone della Birreria lascia per te alla porta di servizio un fiasco d'idromele,
      senza biglietto. Il fiasco è impagliato fino al collo e chiuso con un tappo di sughero legato con lo
      spago. Gretchen lo posa sul tavolo della cucina e ci gira intorno come intorno a un gatto che non è suo.

      «Ettore i biglietti se li risparmia e manda da bere» dice. «Adesso sai dove passa le sere quando in
      famiglia lo credono alla Birreria, e da stanotte qui dentro lo sappiamo in quattro.» Taglia lo spago con
      il coltello del pane e ti versa un dito d'idromele in una tazza da latte. «Che cosa farne lo decidi tu,
      ma con un nome così al Municipio si aprono parecchie porte.»

      {politica-ed-economia Media} La Rappresentante ha costruito la sua carriera sulla sobrietà dei Castaldi,
      e un cugino che beve sul gradino di una casa di Via dei Rasoi è una leva lunga.
    opzioni:
      - testo: "Dimenticarlo, come si fa in questa casa"
        descrizione: "I nomi che senti alla Maison restano alla Maison."
        costo: 0
        esito:
          titolo: L'idromele
          testo: |
            Bevi l'idromele, che sa di miele di castagno e di cantina e lascia la lingua un po' amara. Poi
            dici a Gretchen che di quella sera ricordi soltanto un uomo grosso che cantava male. Lei ride con
            la sua risata profonda e ti riempie la tazza fino all'orlo.
          pe: { empatia: 3 }
      - testo: "Tenerti il nome per quando servirà"
        descrizione: "Nessuno te l'ha chiesto, e nessuno lo saprà. Una leva lunga, in un cassetto, non fa male a nessuno finché resta lì."
        costo: 0
        esito:
          titolo: Il cassetto
          testo: |
            Bevi l'idromele in silenzio, e Gretchen lascia cadere il discorso e rimette il tappo al fiasco. Il
            nome di Ettore lo metti da parte, insieme alla strada che fa la sera e all'ora a cui si siede sul
            gradino. Quando esci dalla porta di servizio Gretchen ti saluta con la mano come sempre, poi resta
            sulla soglia a guardarti attraversare il cortile.
          imposta: { maison.leva-ettore: 1 }

  # ------------------------------------------------------------ passo 5 · le domande gentili
  - id: maison-le-domande-gentili
    presso: via-dei-rasoi
    immagine: ambientazione/maison-des-lunes
    titolo: Le domande gentili
    sommario: "In salone una ragazza batte con le dita un segnale che nessuna usa mai. Tachek lo vede, e non sa che cosa farne."
    luogo: Maison des Lunes, il salone
    area: citta-bassa
    requisiti: [fazione.maison == 4, pista.dama-argento >= 11]
    testo: |
      Sul divano accanto alla finestra una mezzelfa dalla pelle chiarissima e dagli occhi scuri punteggiati
      d'argento ascolta il suo cliente come si guarda la pioggia. È Irmelin, ti dice Tachek senza voltarsi.

      A un tratto Irmelin batte due volte l'indice sul bracciolo e poi lo stende piatto, e Tachek si
      irrigidisce. «Vuol dire cliente troppo gentile» dice a mezza voce. «Non l'ho mai visto usare da
      nessuna.»

      Il cliente è un uomo sui quarant'anni con la barba curata. Paga bene e tiene le mani in grembo, e il
      bicchiere davanti a lui è pieno come gliel'hanno portato. Con garbo chiede chi viene il giovedì e chi
      sale nella Luna Calante, e ogni tanto alza gli occhi verso la lampada sopra il divano.

      {percezione Facile} Quella lampada fa una luce appena più fredda delle altre, come un bicchiere d'acqua
      accanto a uno di vino. Una falena che gira per il salone ci arriva vicino e poi torna verso le candele.

      *Uno che paga per non toccare niente sta comprando qualcos'altro.* Lui si alza, lascia le monete sul
      tavolino e si avvia verso l'armadio di Sara.
    opzioni:
      - testo: "Seguirlo quando esce"
        descrizione: "Ha ritirato l'arma e si è infilato il cappuccio. Se va dove pensi, ci va a piedi e senza fretta."
        prova: { attributo: fisico, abilita: [furtivita, atletica], difficolta: Media }
        successo:
          titolo: La manica
          testo: |
            Lo segui a trenta passi fino al gomito di Via dei Rasoi. Al cristallo spento si ferma, posa la
            mano nuda sulla pietra come per riposarsi e china la testa verso la manica del mantello. Un cane
            che dormiva ai piedi del cristallo si alza e va a sdraiarsi sotto il portone accanto. L'uomo parla
            dentro la manica per il tempo di un padrenostro. Poi si stacca e prosegue verso il Ponte del
            Pesce, e tu torni indietro con la sensazione che il cristallo spento, stanotte, non sia poi così
            spento.
          pe: { furtivita: 5 }
          imposta: { maison.irmelin: 1 }
          effetti: { rep.maison: 1, fazione.maison: 1 }
        fallimento:
          titolo: Il cappuccio che si volta
          testo: |
            Lo segui troppo vicino, e i tuoi passi sul selciato bagnato sono gli unici della via oltre ai
            suoi. Al gomito della strada l'uomo si volta, ti guarda con molta educazione e ti augura la buona
            notte. Poi tira dritto verso il Ponte del Pesce, e al cristallo spento non si ferma. Lo hai perso,
            e lui adesso conosce la tua faccia. In salone, più tardi, Irmelin ti dice soltanto che guardava
            sempre la lampada.
          imposta: { maison.irmelin: 1 }
          effetti: { sospetto: 1, rep.maison: 0.5, fazione.maison: 1 }

      - testo: "Parlare con Irmelin quando lui se ne va"
        descrizione: "Ha battuto il segnale perché qualcuno l'ascoltasse. Tocca a te farlo."
        prova: { attributo: sociale, abilita: [empatia, persuasione], difficolta: Media }
        successo:
          titolo: La lampada
          testo: |
            Ti siedi accanto a lei sul divano, a una distanza educata, e le chiedi soltanto se vuole un tè.
            Irmelin ci pensa, poi dice di sì, e tiene la tazza con tutte e due le mani. Mentre lo beve ti
            racconta che il cliente viene da un mese e chiede sempre le stesse cose con parole diverse, e che
            quando lei risponde lui guarda la lampada, mai lei. «Come se parlasse con qualcun altro» dice, «e
            io servissi solo a passargli le risposte.» Posa la tazza e ti ringrazia, con un'aria finalmente
            sveglia.
          pe: { empatia: 5 }
          imposta: { maison.irmelin: 1 }
          effetti: { rep.maison: 1, fazione.maison: 1 }
        fallimento:
          titolo: Il segnale sprecato
          testo: |
            Le chiedi subito chi era quell'uomo e che cosa voleva, con la voce di uno che compila un rapporto.
            Irmelin ti guarda come si guarda la pioggia e risponde a monosillabi, con le mani ferme sulle
            ginocchia. Alla fine ti dice soltanto che lui guardava sempre la lampada, e si alza per tornare al
            lavoro. Per stasera, con te, ha finito di parlare.
          imposta: { maison.irmelin: 1 }
          effetti: { rep.maison: 0.5, fazione.maison: 1, scandalo: 0.5 }

      - testo: "Esaminare la lampada sopra il divano"
        descrizione: "Una luce più fredda delle altre. Le lampade della Maison le ha sempre accese Nerissa, e nessuno ci mette le mani."
        prova: { attributo: mentale, abilita: [tecnologia, magia], difficolta: Media }
        successo:
          titolo: Il vetro freddo
          testo: |
            Sali sul divano con le scarpe in mano e stacchi lo schermo di vetro fumé. Fra lo stoppino e il
            riflettore d'ottone qualcuno ha incastrato una scheggia di cristallo conduttore grande come
            un'unghia. La fiamma è a due dita, eppure la scheggia è fredda, e il freddo lo senti sulla pelle
            prima ancora di avvicinare la mano. Le dita restano a mezz'aria, senza toccarla. La guardi
            abbastanza a lungo per capire che vibra appena, a tempo con le voci del salone, e rimetti lo
            schermo com'era. Tachek ti guarda dal fondo e si porta due dita alla cintura.
          pe: { tecnologia: 5 }
          imposta: { maison.irmelin: 1 }
          effetti: { rep.maison: 1, fazione.maison: 1 }
        fallimento:
          titolo: La lampada si spegne
          testo: |
            Stacchi lo schermo di vetro con troppa fretta, e la fiamma si spegne con un soffio. Il salone
            resta un momento al buio da quella parte, e due clienti si voltano. Nel buio vedi brillare
            qualcosa fra lo stoppino e il riflettore, poi più niente. Gretchen riaccende la lampada con un
            fiammifero e ti guarda in silenzio, e l'odore dello stoppino bruciato resta sul divano.
          imposta: { maison.irmelin: 1 }
          effetti: { scandalo: 1, rep.maison: 0.5, fazione.maison: 1 }

      - testo: "Leggere il Mana intorno alla lampada"
        descrizione: "Una formula breve, e la luce della lampada ti dice da dove viene il suo freddo."
        incantesimo: leggere-il-mana
        prova: { attributo: mentale, abilita: magia, difficolta: Facile }
        successo:
          titolo: Il filo
          testo: |
            Dici la formula a bocca chiusa, e il Mana del salone ti si mostra color miele, steso su tutte le
            lampade come una stoffa calda. Da quella sopra il divano esce un filo freddo che passa sotto la
            finestra e va dritto verso la strada. Lo segui con lo sguardo finché non ti fanno male gli occhi.
            Va verso il gomito di Via dei Rasoi, dove sta il cristallo spento.
          pe: { magia: 5 }
          imposta: { maison.irmelin: 1 }
          effetti: { rep.maison: 1, fazione.maison: 1 }
        fallimento:
          titolo: Troppa luce
          testo: |
            Dici la formula, e il Mana del salone ti arriva addosso tutto insieme, color miele, così forte che
            devi chiudere gli occhi. Quando li riapri hai la testa che ronza e un sapore di ferro in bocca.
            Sei sicur{o|a} che una delle lampade avesse un freddo che le altre non hanno, e su quale fosse la
            memoria ti lascia a mani vuote.
          imposta: { maison.irmelin: 1 }
          effetti: { tormento: 1, rep.maison: 0.5, fazione.maison: 1 }

      - testo: "Chiedere a Jass"
        descrizione: "Jass ha lavorato per gli Scuri prima di lavorare per te. Se gli Scuri hanno un orecchio in questa casa, lei sa che forma ha."
        immagine: personaggi/jass
        quando: [jass == 1, pista.pelle < 6]
        esito:
          titolo: Dopo di me
          testo: |
            Jass ti tira dietro la tenda in fondo al corridoio e ti parla con la bocca sul tuo orecchio, per
            non farsi sentire da nessuno. «Quando con me non ha più funzionato, Mauro ha detto che gli serviva
            un orecchio che non dorme e non si innamora» dice. «L'ho sentito io, e ci ho riso sopra. Pensavo
            parlasse di una ragazza.» Si stacca e guarda la lampada sopra il divano, e intanto si tormenta una
            ciocca rossa fra le dita.
          pe: { empatia: 5 }
          imposta: { maison.irmelin: 1 }
          effetti: { rep.maison: 1, fazione.maison: 1 }

      - testo: "Sentire la luce come si sente il Bosco"
        descrizione: "Al Circolo ti hanno insegnato che il Mana guasto ha un odore, come l'acqua ferma. Quella lampada ce l'ha."
        quando: [origine.figlio-del-circolo >= 1]
        prova: { attributo: mentale, abilita: [natura, percezione], difficolta: Media }
        successo:
          titolo: Il ferro bagnato
          testo: |
            Chiudi gli occhi e annusi l'aria, come nel Bosco quando cerchi una sorgente. Fra il profumo di
            cera e il tabacco del salone c'è un filo di ferro bagnato, l'odore del Mana guasto che al Circolo
            ti hanno insegnato a riconoscere nelle radici malate. Viene dalla lampada sopra il divano, ed è lo
            stesso che senti, passando, al cristallo spento in fondo alla via.
          pe: { natura: 5 }
          imposta: { maison.irmelin: 1 }
          effetti: { rep.maison: 1, fazione.maison: 1 }
        fallimento:
          titolo: Troppa luce
          testo: |
            Chiudi gli occhi e cerchi l'odore, ma il salone sa di troppe cose insieme, la cera delle candele
            con l'acqua di rose delle ragazze, e il filo che cercavi si perde. Riapri gli occhi con la testa
            che ronza. Sei sicur{o|a} che una delle lampade avesse un freddo che le altre non hanno, e su
            quale fosse il naso ti lascia a mani vuote.
          imposta: { maison.irmelin: 1 }
          effetti: { tormento: 1, rep.maison: 0.5, fazione.maison: 1 }
