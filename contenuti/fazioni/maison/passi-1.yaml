# La quest della Maison des Lunes, passi 3-5 (i passi 1 e 2 stanno in contenuti/citta/maison.yaml).
# - Passo 3, la sala interna (primo grado, Chiamato per nome): una partita di Zekar con il mercante dell'argento,
#   che sta per puntare il nome di un altro cliente. Ogni ramo dà il ventaglio dei segnali e porta rep.maison almeno a
#   2; chi al passo 1 è stato scoperto a leggere il quaderno (maison.quaderno 5) trova Difficile la via del Galateo.
#   Seguito: i segnali di Tachek (solo PE e colore).
# - Passo 4, il cugino della Rappresentante (pista.dama-argento >= 6): Ettore Castaldi ubriaco sul gradino e il
#   ragazzino con la lavagnetta, che prima della Pignatta segna per Mauro e dopo per i fratelli del Ponte del Pesce.
#   Ogni ramo dà segreto.ettore. Seguito: il fiasco senza biglietto, dove si decide maison.leva-ettore.
# - Passo 5, le domande gentili (pista.dama-argento >= 11): Irmelin, il cliente troppo gentile e la lampada.
#   Dà maison.irmelin; con jass 1, prima della Pignatta, Jass dice dell'orecchio.
zekar:
  - id: maison-mercante-dell-argento
    nome: Il mercante dell'argento
    immagine: fazioni/gilda-dei-mercanti
    descrizione: "Paga in argento nuovo e punta forte, perché pensa di avere già perso. Si ferma tardi e cala le laterali alte senza pensarci."
    laterali: [-2, 1, 3, 4]
    soglia: 18
    mira: 20

storylet:
  # ------------------------------------------------------------ passo 3 · la sala interna (primo grado)
  - id: maison-la-sala-interna-passo
    presso: via-dei-rasoi
    immagine: ambientazione/maison-des-lunes
    titolo: La sala interna
    sommario: "Gretchen ti ha visto sulla scala, la notte della lanterna spenta. Stasera ti fa entrare nella stanza dietro il salone, dove si gioca a Zekar."
    luogo: Maison des Lunes, la sala interna
    area: citta-bassa
    requisiti: [fazione.maison == 2]
    testo: |
      Dietro il salone, oltre una tenda di velluto che ha perso il pelo dove
      la scostano le mani, c'è una stanza senza finestre con un tavolo rotondo
      e sei sedie, e una lampada bassa che illumina soltanto il panno verde.
      Gretchen ti ci accompagna tenendoti per il polso, come si porta un
      nipote a una cena di grandi. Chiara dà le carte con il portasigarette
      d'osso fra due dita, e la cenere non cade mai. In un angolo Gretchen
      tiene i conti su una lavagnetta da scuola, a gesso.

      {galateo Facile} Qui nessuno ha lasciato le monete sul tavolo. Davanti
      ai giocatori ci sono biglietti piegati in quattro, e ognuno vale
      quello che c'è scritto dentro.

      Il mercante seduto di fronte a Chiara lo riconosci dal panciotto, perché
      in salone paga sempre in argento nuovo. Stasera ha perso tutti i
      biglietti che aveva e ne sta scrivendo un altro, curvo sul tavolo, con
      la penna che gratta. Gretchen ti si china all'orecchio. «Sta per
      puntare il nome di un altro cliente» dice. «È l'unica posta che qui non
      si accetta, e se la mette sul panno la sala è finita.» Poi si alza e ti
      lascia la sua sedia.

      {empatia Media} Il mercante scrive in fretta per non avere il tempo di
      ripensarci. Ha la nuca bagnata, e la mano sinistra tiene fermo il
      foglio come se potesse scappare.

      {origine mercante-dei-ponti} Le monete che lascia in salone le hai viste
      uscire dalla Casa dei Nodi, ancora calde di conio, nei sacchetti che la
      Gilda usa per i pagamenti di riguardo. Uno che riceve quell'argento non
      dovrebbe avere bisogno di vendere un nome.

      *Se quel biglietto arriva sul panno, qualcuno domani perde molto più di una
      partita.* La sedia di Gretchen è ancora tiepida.
    opzioni:
      - testo: "Sederti e giocare contro di lui"
        descrizione: "Una mano di Zekar a poste di biglietti. Se vinci, il mercante paga in favori e il nome resta nella sua tasca. Se perdi, il debito lo riscuote la signora."
        zekar: maison-mercante-dell-argento
        vittoria:
          titolo: Il biglietto nella tasca
          testo: |
            Il mercante si ferma a diciotto e tu arrivi a venti con l'ultima
            laterale, e lui guarda le carte a lungo prima di capire che è
            finita. Il biglietto con il nome lo infila nel taschino del
            panciotto senza averlo aperto, e al suo posto scrive due favori
            piccoli, firmati con una grafia che trema appena. Chiara spegne la
            sigaretta nel piattino di peltro. Gretchen cancella la lavagnetta con
            il palmo e ti chiama per nome davanti a tutti, che in questa stanza
            vuol dire più di una vincita.

            Prima che tu esca Tachek ti fa scivolare in mano un ventaglio di
            carta dipinta. Domani, dice, ti insegnerà a usarlo come si deve.
          pe: { empatia: 10 }
          effetti: { informazioni.pettegolezzo: 1, monete: 30, oggetto.maison-ventaglio-dei-segnali: 1, rep.maison: 1, fazione.maison: 1 }
          almeno: { rep.maison: 2 }
          segue: maison-i-segnali-di-tachek
        sconfitta:
          titolo: Il debito della signora
          testo: |
            Perdi l'ultima mano per un punto, e il mercante, sollevato, non ha
            più bisogno del biglietto. Lo strappa in quattro sul panno. Il tuo
            debito lo segna Gretchen sulla lavagnetta, e il giorno dopo Nerissa
            lo salda di tasca sua senza dirti niente. Lo sai perché a fine
            serata Sara ti chiama per nome e ti trattiene la paga della
            settimana, sorridendo.

            Prima che tu esca Tachek ti fa scivolare in mano un ventaglio di
            carta dipinta. Domani, dice, ti insegnerà a usarlo come si deve.
          pe: { empatia: 10 }
          effetti: { monete: 10, oggetto.maison-ventaglio-dei-segnali: 1, fazione.maison: 1 }
          almeno: { rep.maison: 2 }
          segue: maison-i-segnali-di-tachek

      - testo: "Farlo alzare con un pretesto"
        descrizione: "Una moglie in pensiero o una carrozza davanti al cortile. Detta bene, una bugia educata lo porta fuori dalla sala prima che posi il biglietto."
        quando: [maison.quaderno != 5]
        prova: { attributo: sociale, abilita: [galateo, ingannare], difficolta: Media }
        successo:
          titolo: La carrozza
          testo: |
            Gli dici sottovoce che fuori c'è un ragazzo della Casa dei Nodi che
            chiede di lui, con una lettera sigillata. Il mercante si alza così
            in fretta che rovescia la sedia, e il biglietto gli resta in mano
            mezzo scritto. Gretchen lo accompagna in cortile per una strada che
            non passa dal salone. Quando torna ti chiama per nome e si siede
            accanto a te a contare i favori della serata.

            Prima che tu esca Tachek ti fa scivolare in mano un ventaglio di
            carta dipinta. Domani, dice, ti insegnerà a usarlo come si deve.
          pe: { empatia: 10 }
          effetti: { monete: 30, oggetto.maison-ventaglio-dei-segnali: 1, rep.maison: 1, fazione.maison: 1 }
          almeno: { rep.maison: 2 }
          segue: maison-i-segnali-di-tachek
        fallimento:
          titolo: La lettera che non c'è
          testo: |
            Gli dici della lettera sigillata, e lui ti guarda da sopra gli
            occhiali e chiede chi l'ha portata. Esiti un attimo di troppo. Il
            biglietto finisce sul panno, e Chiara lo spinge indietro con la punta
            del portasigarette senza aprirlo, poi chiude la partita alzandosi
            per prima. Il mercante esce rosso in faccia, e domani in salone qualcuno
            racconterà che alla Maison hanno trattato male un uomo della Gilda.

            Prima che tu esca Tachek ti fa scivolare in mano un ventaglio di
            carta dipinta. Domani, dice, ti insegnerà a usarlo come si deve.
          pe: { empatia: 10 }
          effetti: { scandalo: 0.5, monete: 10, oggetto.maison-ventaglio-dei-segnali: 1, fazione.maison: 1 }
          almeno: { rep.maison: 2 }
          segue: maison-i-segnali-di-tachek

      - testo: "Farlo alzare con un pretesto"
        descrizione: "Sara ti ha visto con il dito sul suo quaderno, e in questa casa lo sanno tutti. Le tue bugie educate, stasera, le guardano con attenzione."
        quando: [maison.quaderno == 5]
        prova: { attributo: sociale, abilita: [galateo, ingannare], difficolta: Difficile }
        successo:
          titolo: La carrozza
          testo: |
            Gli dici sottovoce che fuori c'è un ragazzo della Casa dei Nodi che
            chiede di lui, e lo dici con tanta noia che sembra vero. Il mercante
            si alza e rovescia la sedia, con il biglietto mezzo scritto in mano.
            Gretchen lo accompagna in cortile. Quando torna ti guarda a lungo,
            poi ti chiama per nome, una volta sola, come una cosa da tenere a
            mente.

            Prima che tu esca Tachek ti fa scivolare in mano un ventaglio di
            carta dipinta. Domani, dice, ti insegnerà a usarlo come si deve.
          pe: { empatia: 10 }
          effetti: { monete: 30, oggetto.maison-ventaglio-dei-segnali: 1, rep.maison: 1, fazione.maison: 1 }
          almeno: { rep.maison: 2 }
          segue: maison-i-segnali-di-tachek
        fallimento:
          titolo: La lettera che non c'è
          testo: |
            Gli dici della lettera sigillata, e Chiara alza gli occhi dalle
            carte prima di lui. Il mercante ti chiede chi l'ha portata, e tu
            esiti. Il biglietto finisce sul panno, e Chiara lo spinge indietro
            con la punta del portasigarette senza aprirlo, poi chiude la
            partita. Il mercante esce rosso in faccia, e domani in salone
            qualcuno racconterà che alla Maison hanno trattato male un uomo
            della Gilda.

            Prima che tu esca Tachek ti fa scivolare in mano un ventaglio di
            carta dipinta. Domani, dice, ti insegnerà a usarlo come si deve.
          pe: { empatia: 10 }
          effetti: { scandalo: 0.5, monete: 10, oggetto.maison-ventaglio-dei-segnali: 1, fazione.maison: 1 }
          almeno: { rep.maison: 2 }
          segue: maison-i-segnali-di-tachek

      - testo: "Lasciarlo a Chiara"
        descrizione: "Chiara gioca da anni a questo tavolo, e sa far tacere un uomo meglio di te. Tocca a te accorgerti del momento giusto e passarle la mano."
        prova: { attributo: sociale, abilita: [empatia, percezione], difficolta: Media }
        successo:
          titolo: Il portasigarette
          testo: |
            Aspetti che il mercante alzi la penna per cercare le parole, e in
            quel momento sposti la tua sedia di un palmo verso Chiara. Lei
            capisce. Si sporge, gli posa il portasigarette d'osso sul foglio e
            gli dice qualcosa a voce così bassa che non lo senti nemmeno tu.
            Il mercante strappa il biglietto in quattro e chiede scusa al
            tavolo con la testa bassa. Gretchen ti chiama per nome, e Chiara ti
            concede un mezzo sguardo, che per lei è parecchio.

            Prima che tu esca Tachek ti fa scivolare in mano un ventaglio di
            carta dipinta. Domani, dice, ti insegnerà a usarlo come si deve.
          pe: { empatia: 10 }
          effetti: { monete: 30, oggetto.maison-ventaglio-dei-segnali: 1, rep.maison: 1, fazione.maison: 1 }
          almeno: { rep.maison: 2 }
          segue: maison-i-segnali-di-tachek
        fallimento:
          titolo: Troppo presto
          testo: |
            Le passi la mano troppo presto, quando il mercante è ancora
            arrabbiato con le carte e non con se stesso. Chiara ci prova lo
            stesso, e lui le risponde male. Ci vuole Tachek, alla fine, con una
            mano sulla spalla e la voce gentile, per portarlo in cortile con il
            biglietto in tasca. La sala si svuota presto, e Gretchen conta i
            favori persi della serata in silenzio, ma a fine sera ti chiama
            comunque per nome.

            Prima che tu esca Tachek ti fa scivolare in mano un ventaglio di
            carta dipinta. Domani, dice, ti insegnerà a usarlo come si deve.
          pe: { empatia: 10 }
          effetti: { monete: 10, oggetto.maison-ventaglio-dei-segnali: 1, fazione.maison: 1 }
          almeno: { rep.maison: 2 }
          segue: maison-i-segnali-di-tachek

      - testo: "Lasciarlo puntare e sentire il nome"
        descrizione: "Un nome detto in questa stanza vale molto, fuori. Basta non fermarlo."
        esito:
          titolo: Il nome sul panno
          testo: |
            Non fai niente. Il mercante posa il biglietto sul panno e lo apre
            lui stesso, per far vedere che è una posta seria, e il nome che ci
            è scritto lo leggi anche tu. È di un uomo che in salone viene il
            giovedì e che in città ha una moglie e una bottega. Chiara si alza
            senza una parola e la partita finisce lì. Gretchen ti chiama per
            nome lo stesso, perché sei stato tu a sederti, e intanto non ti
            guarda.

            {resilienza Media} Il nome ce l'hai in testa adesso, e non se ne
            va. Ti accorgi di averlo già ripetuto due volte, per non perderlo.

            Prima che tu esca Tachek ti fa scivolare in mano un ventaglio di
            carta dipinta. Domani, dice, ti insegnerà a usarlo come si deve.
          pe: { empatia: 10 }
          effetti: { informazioni.segreto: 1, rep.maison: -1, monete: 30, oggetto.maison-ventaglio-dei-segnali: 1, fazione.maison: 1 }
          almeno: { rep.maison: 2 }
          segue: maison-i-segnali-di-tachek

      - testo: "Parlargli dell'argento della Casa dei Nodi"
        descrizione: "Le sue monete escono dai sacchetti di riguardo della Gilda. Al banco, fra mercanti, una cosa così si dice sottovoce e chiude qualunque discorso."
        quando: [origine.mercante-dei-ponti >= 1]
        esito:
          titolo: Fra mercanti
          testo: |
            Ti chini verso di lui e gli chiedi, da collega, se l'argento di
            riguardo della Casa dei Nodi si conia ancora con il bordo zigrinato
            o se hanno cambiato stampo. Il mercante si ferma con la penna a
            mezz'aria. Ha capito che sai da dove vengono le sue monete, e che
            un nome sul panno farebbe venire in mente anche il suo. Strappa il
            biglietto e chiede scusa al tavolo, e Gretchen ti chiama per nome
            dal suo angolo, senza alzare gli occhi dalla lavagnetta.

            Prima che tu esca Tachek ti fa scivolare in mano un ventaglio di
            carta dipinta. Domani, dice, ti insegnerà a usarlo come si deve.
          pe: { empatia: 10 }
          effetti: { monete: 30, oggetto.maison-ventaglio-dei-segnali: 1, rep.maison: 1, fazione.maison: 1 }
          almeno: { rep.maison: 2 }
          segue: maison-i-segnali-di-tachek

  - id: maison-i-segnali-di-tachek
    immagine: personaggi/tachek
    titolo: I segnali di Tachek
    tipo: seguito
    luogo: Maison des Lunes, il salone vuoto
    area: citta-bassa
    requisiti: [fazione.maison == 3]
    testo: |
      Il giorno dopo, nell'ora morta, Tachek ti aspetta in salone con il suo
      abito scuro e un ventaglio uguale al tuo, aperto sul ginocchio. Le
      poltrone sono coperte con i teli bianchi delle pulizie, e da una
      finestra socchiusa entra l'odore della pentola del pranzo. Ti fa sedere
      di fronte a lui, a tre passi, la distanza di una poltrona dall'altra.

      «Le ragazze parlano con le mani, noi con questo» dice, e chiude il
      ventaglio di scatto. «Chiuso vuol dire vieni. Battuto sul palmo vuol
      dire aspetta. Aperto a metà vuol dire che il cliente ha bevuto.» Lo apre
      del tutto e ci si fa aria. «E così vuol dire che fa caldo. È il segnale
      più difficile da imparare.»

      {percezione Media} Mentre parla, con la mano libera batte due dita sulla
      cintura per rispondere a Kasja, che si è affacciata sulla porta a
      chiedere se c'è caffè.
    opzioni:
      - testo: "Ripetere i segnali finché non vengono da soli"
        descrizione: "Un'ora di ventaglio aperto e chiuso, con Tachek che ti corregge il polso."
        costo: 0
        esito:
          titolo: Il polso
          testo: |
            Apri e chiudi il ventaglio finché il polso ti fa male e il gesto
            smette di sembrare un gesto. Tachek ti corregge sempre nello
            stesso punto, il pollice che stringe troppo. Alla fine ti dice che
            per stasera basta, e che i segnali veri li imparerai in salone,
            sbagliando davanti a tutti come ha fatto lui.
          pe: { percezione: 3 }
      - testo: "Chiedergli come ha imparato lui"
        descrizione: "Tachek non racconta mai niente di sé. Forse oggi sì, a casa chiusa."
        costo: 0
        esito:
          titolo: La prima sera
          testo: |
            Tachek ci pensa un poco. Poi ti dice che la prima sera ha scambiato
            un ventaglio aperto per un ventaglio chiuso e ha portato fuori di
            peso il fratello della signora, venuto per gli auguri. «Lei ha riso
            per una settimana» dice, e richiude il ventaglio con un colpo secco.
            «Io non ho più sbagliato.»
          pe: { empatia: 3 }

  # ------------------------------------------------------------ passo 4 · il cugino della Rappresentante
  - id: maison-il-cugino-della-rappresentante
    presso: via-dei-rasoi
    immagine: personaggi/ettore-castaldi
    titolo: Il cugino della Rappresentante
    sommario: "Sul gradino della Maison è seduto un uomo grande e grosso con il mantello buono, e Churl gli ha appena detto di no."
    luogo: Via dei Rasoi, davanti alla Maison
    area: citta-bassa
    requisiti: [fazione.maison == 3, pista.dama-argento >= 6]
    testo: |
      Arrivi in Via dei Rasoi poco dopo che la lanterna si è accesa, e sul
      gradino della Maison c'è seduto un uomo grande e grosso con il
      mantello buono buttato su una spalla e le ginocchia larghe, come uno
      che si è seduto per un minuto e se n'è dimenticato. Churl è sulla
      soglia con le braccia incrociate. «No» ha detto, e non ha nient'altro da
      aggiungere. Alla Maison si entra sobri, e quest'uomo sobrio non è.

      {galateo Facile} Il mantello è di lana di Laresh con la fodera di seta,
      e la fibbia porta un ramo dell'Albero Rosso inciso piccolo. È un uomo
      di famiglia buona, e la famiglia gli ha insegnato a portare il
      mantello anche da ubriaco.

      Lo riconosci quando alza la testa. È Ettore Castaldi, il cugino della
      Rappresentante, quello della Birreria del Paladino Stanco. Canticchia
      qualcosa di sacro con le parole sbagliate, e saluta per nome chi passa,
      e chi passa affretta il passo.

      {rissa Media} Ha le spalle di uno che ha portato l'armatura per dieci
      anni, e da seduto pesa il doppio. Se decide di non alzarsi, in tutta
      Via dei Rasoi lo smuove soltanto Kanat.

      Dall'altra parte della strada, seduto su
      un paracarro, un ragazzino con una lavagnetta sulle ginocchia segna
      qualcosa col gesso ogni volta che la porta si apre.

      {conoscenze-della-strada Media} Un ragazzino che segna chi entra in una
      casa di Via dei Rasoi lo fa per conto di qualcuno, e quel qualcuno paga
      a nome. Stasera sulla lavagnetta c'è un nome che vale una settimana di
      paga.

      {origine rampollo-dei-quartieri-alti} A una cena di consiglio Ettore ti
      ha versato da bere due volte, e la seconda ha chiesto scusa al vino.
      Nei Quartieri Alti lo trattano con un affetto che somiglia molto al
      tenerlo d'occhio.

      Sara si affaccia dietro Churl e ti cerca con lo sguardo, senza chiederti
      niente. Le basta che tu l'abbia visto.
    opzioni:
      - testo: "Riportarlo a casa per il giro lungo"
        descrizione: "La Birreria del Paladino Stanco è a un quarto d'ora, e la strada dritta passa sotto troppe finestre. Ci vuole qualcuno che conosca i vicoli."
        prova: { attributo: sociale, abilita: [conoscenze-della-strada, persuasione], difficolta: Media }
        successo:
          titolo: Il giro lungo
          testo: |
            Lo prendi sottobraccio e lo porti via per Via del Salmone e poi per
            i vicoli dei cardatori, dove a quest'ora non c'è nessuno che sappia
            chi è. Ettore ti racconta dell'incendio del Santuario e di un cavallo
            bianco che aveva da ragazzo, e a metà strada si mette a piangere
            senza smettere di camminare. Alla Birreria la garzona lo prende in
            consegna senza fare domande. La lavagnetta, dall'altra parte della
            strada, resta con un segno solo, quello di un uomo seduto.
          pe: { conoscenze-della-strada: 5 }
          imposta: { segreto.ettore: 1 }
          effetti: { rep.maison: 1, informazioni.pettegolezzo: 1, fazione.maison: 1 }
          segue: maison-il-fiasco-senza-biglietto
        fallimento:
          titolo: La strada dritta
          testo: |
            Ettore non vuole fare il giro lungo. Si pianta in mezzo a Via del
            Salmone e dichiara a voce alta che un Castaldi cammina per la strada
            dritta, e da tre finestre si affacciano a guardare chi è il Castaldi.
            Lo porti alla Birreria per la strada dritta, sotto tutte le finestre
            del quartiere. La garzona lo prende in consegna, e a te resta
            addosso l'impressione di essere stato visto in sua compagnia da
            mezza Città Bassa.
          imposta: { segreto.ettore: 1 }
          effetti: { scandalo: 0.5, rep.maison: 0.5, fazione.maison: 1 }
          segue: maison-il-fiasco-senza-biglietto

      - testo: "Comprare la lavagnetta al ragazzino"
        descrizione: "Chi lo paga, lo paga a nome. Tu puoi pagarlo di più perché quella di stasera la cancelli."
        quando: [pista.pelle < 6]
        prova: { attributo: sociale, abilita: [persuasione, conoscenze-della-strada], difficolta: Media }
        successo:
          titolo: Il gesso
          testo: |
            Ti siedi sul paracarro accanto al ragazzino e gli chiedi per chi
            segna. Ti dice che lavora per Mauro, il quale paga a nome e solo i
            nomi buoni. Gli fai notare che stasera di nomi buoni non ne passano, e che
            una lavagnetta pulita si vende comunque. Te la cede per qualche
            moneta e una caramella, e mentre la pulisci con la manica Churl fa
            alzare Ettore e lo affida a Kanat, che lo riporta a casa in braccio.
          pe: { persuasione: 5 }
          imposta: { segreto.ettore: 1 }
          effetti: { monete: -2, rep.maison: 1, informazioni.pettegolezzo: 1, rep.scuri: -0.5, fazione.maison: 1 }
          segue: maison-il-fiasco-senza-biglietto
        fallimento:
          titolo: Il nome buono
          testo: |
            Il ragazzino ti ascolta, poi si stringe la lavagnetta al petto e
            ti dice che Mauro paga di più, e sparisce verso il cristallo spento
            prima che tu possa alzarti. Domani alla Pignatta sapranno chi era
            seduto sul gradino della Maison. Churl fa alzare Ettore e lo affida
            a Kanat, e Sara ti guarda dalla soglia con la bocca stretta.
          imposta: { segreto.ettore: 1 }
          effetti: { monete: -2, rep.maison: 0.5, fazione.maison: 1 }
          segue: maison-il-fiasco-senza-biglietto

      - testo: "Comprare la lavagnetta al ragazzino"
        descrizione: "Dopo la notte della Pignatta i nomi li compra qualcun altro. Chi lo paga, lo paga a nome, e tu puoi pagarlo di più."
        quando: [pista.pelle >= 6]
        prova: { attributo: sociale, abilita: [persuasione, conoscenze-della-strada], difficolta: Media }
        successo:
          titolo: Il gesso
          testo: |
            Ti siedi sul paracarro accanto al ragazzino e gli chiedi per chi
            segna. Ti dice che lavora per due fratelli del Ponte del Pesce, il
            grande con le spalle da scaricatore e il piccolo con il quaderno. Pagano
            a nome, e solo i nomi buoni.
            Gli fai notare che una lavagnetta pulita si vende comunque. Te la
            cede per qualche moneta e una caramella, e mentre la pulisci con la
            manica Churl fa alzare Ettore e lo affida a Kanat, che lo riporta a
            casa in braccio.

            {politica-ed-economia Media} Due fratelli con un quaderno che
            comprano nomi un tanto l'uno. Da quando la Pignatta è bruciata
            qualcuno ha capito che i nomi sono una merce, e ha aperto bottega.
          pe: { persuasione: 5 }
          imposta: { segreto.ettore: 1 }
          effetti: { monete: -2, rep.maison: 1, informazioni.pettegolezzo: 1, fazione.maison: 1 }
          segue: maison-il-fiasco-senza-biglietto
        fallimento:
          titolo: Il nome buono
          testo: |
            Il ragazzino ti ascolta, poi si stringe la lavagnetta al petto e ti
            dice che i fratelli del Ponte del Pesce pagano di più, e sparisce
            verso il cristallo spento prima che tu possa alzarti. Churl fa
            alzare Ettore e lo affida a Kanat, e Sara ti guarda dalla soglia
            con la bocca stretta.
          imposta: { segreto.ettore: 1 }
          effetti: { monete: -2, rep.maison: 0.5, fazione.maison: 1 }
          segue: maison-il-fiasco-senza-biglietto

      - testo: "Fargli cadere la lavagnetta nel rigagnolo"
        descrizione: "Un passo distratto, una spinta col gomito, e il gesso si scioglie nell'acqua sporca. Bisogna che sembri un caso."
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Media }
        successo:
          titolo: L'acqua sporca
          testo: |
            Attraversi la strada guardando la lanterna e inciampi nel paracarro
            con tutto il peso del caso. La lavagnetta vola dalle ginocchia del
            ragazzino e finisce di piatto nel rigagnolo, dove l'acqua dei piatti
            di mezza via si porta via il gesso. Chiedi scusa due volte. Intanto
            Churl fa alzare Ettore e lo affida a Kanat, che lo riporta a casa in
            braccio come un bambino addormentato a una festa.
          pe: { furtivita: 5 }
          imposta: { segreto.ettore: 1 }
          effetti: { rep.maison: 1, informazioni.pettegolezzo: 1, rep.scuri: -0.5, fazione.maison: 1 }
          segue: maison-il-fiasco-senza-biglietto
        fallimento:
          titolo: Il ragazzino svelto
          testo: |
            Inciampi nel paracarro con tutto il peso del caso, ma il ragazzino
            è più svelto di te. Si tira indietro con la lavagnetta stretta al
            petto e tu finisci con un ginocchio nel rigagnolo. Lui ride e
            sparisce verso il cristallo spento. Churl fa alzare Ettore e lo
            affida a Kanat, e tu torni alla Maison con i calzoni bagnati e un
            livido che domani avrà un bel colore.
          imposta: { segreto.ettore: 1 }
          effetti: { ferite: 0.5, rep.maison: 0.5, fazione.maison: 1 }
          segue: maison-il-fiasco-senza-biglietto

      - testo: "Mandare a chiamare Quintus Vael"
        descrizione: "Il comandante della guardia dei Castaldi lo porta a casa con discrezione. La Maison non c'entra più niente, e la padrona di casa al Maniero lo saprà."
        esito:
          titolo: La carrozza dei Castaldi
          testo: |
            Mandi un ragazzo di corsa ai Quartieri Alti con un biglietto per
            Quintus Vael, e dopo un'ora arriva una carrozza senza stemma.
            Quintus scende con l'armatura di cuoio sotto il mantello e passa con
            lo sguardo da Ettore alla porta della Maison, e da lì a te. Carica il
            cugino della Rappresentante come un sacco di grano e ti ringrazia
            con un cenno secco. Domani al Maniero Marella saprà dove l'hanno
            trovato, e da chi. La lavagnetta, dall'altra parte della strada,
            intanto si è riempita.
          imposta: { segreto.ettore: 1 }
          effetti: { rep.castaldi: 0.5, rep.maison: 0.5, fazione.maison: 1 }
          segue: maison-il-fiasco-senza-biglietto

      - testo: "Farlo passare dalla cucina come un parente"
        descrizione: "Un cugino di buona famiglia che ha bevuto un bicchiere al matrimonio sbagliato si porta in cucina, gli si dà un caffè e lo si rimanda a casa dalla porta sul cortile."
        quando: [origine.rampollo-dei-quartieri-alti >= 1]
        prova: { attributo: sociale, abilita: galateo, difficolta: Facile }
        successo:
          titolo: Il cugino Ettore
          testo: |
            Lo chiami cugino ad alta voce, che in fondo nei Quartieri Alti lo
            siete un po' tutti, e lo porti via dal gradino tenendolo per il
            gomito come si fa ai ricevimenti. In cucina Gretchen gli mette
            davanti un caffè nero e una fetta di pane, e lui li mangia con le
            maniere che sua madre gli ha insegnato. Lo riaccompagni a casa dalla
            porta sul cortile. La lavagnetta, dall'altra parte della strada,
            resta con un segno solo.
          pe: { galateo: 5 }
          imposta: { segreto.ettore: 1 }
          effetti: { rep.maison: 1, informazioni.pettegolezzo: 1, fazione.maison: 1 }
          segue: maison-il-fiasco-senza-biglietto
        fallimento:
          titolo: La strada dritta
          testo: |
            Lo chiami cugino ad alta voce, e lui si offende, perché non ti
            riconosce e un Castaldi i cugini se li ricorda. Si pianta in mezzo a
            Via del Salmone, e lo riporti alla Birreria per la strada dritta,
            sotto tutte le finestre del quartiere. La garzona lo prende in
            consegna, e a te resta addosso l'impressione di essere stato visto
            in sua compagnia da mezza Città Bassa.
          imposta: { segreto.ettore: 1 }
          effetti: { scandalo: 0.5, rep.maison: 0.5, fazione.maison: 1 }
          segue: maison-il-fiasco-senza-biglietto

  - id: maison-il-fiasco-senza-biglietto
    immagine: personaggi/ettore-castaldi
    titolo: Il fiasco senza biglietto
    tipo: seguito
    luogo: Maison des Lunes, la cucina
    area: citta-bassa
    requisiti: [fazione.maison == 4]
    testo: |
      La mattina dopo, alla porta di servizio, un garzone della Birreria
      lascia per te un fiasco d'idromele impagliato, con il tappo sigillato
      a cera e nessun biglietto. Gretchen lo posa sul tavolo della cucina e
      ci gira intorno come intorno a un gatto che non è suo.

      «Ettore Castaldi non scrive mai biglietti, è un uomo educato» dice. «Lo
      sai chi è, adesso. Sai anche dove passa le sue sere quando la famiglia
      lo crede alla Birreria. Qui dentro è una cosa che sanno in tre, e da
      stanotte in quattro.» Ti versa un dito d'idromele in una tazza da latte.
      «Che cosa te ne fai, lo decidi tu. Io ti dico soltanto che un nome come
      quello, in questa città, vale una porta del Municipio.»

      {politica-ed-economia Media} La Rappresentante ha costruito la sua
      carriera sulla sobrietà dei Castaldi. Un cugino che beve sul gradino di
      una casa di Via dei Rasoi è una leva lunga, e chi la tiene in mano può
      spostare cose grandi.
    opzioni:
      - testo: "Dimenticarlo, come si fa in questa casa"
        descrizione: "I nomi che senti alla Maison restano alla Maison."
        costo: 0
        esito:
          titolo: L'idromele
          testo: |
            Bevi l'idromele, che sa di miele di castagno e di cantina, e dici a
            Gretchen che di quella sera ricordi soltanto un uomo grosso che
            cantava male. Lei ride con la sua risata profonda e ti riempie la
            tazza fino all'orlo.
          pe: { empatia: 3 }
      - testo: "Tenerti il nome per quando servirà"
        descrizione: "Nessuno te l'ha chiesto, e nessuno lo saprà. Una leva lunga, in un cassetto, non fa male a nessuno finché resta lì."
        costo: 0
        esito:
          titolo: Il cassetto
          testo: |
            Bevi l'idromele in silenzio, e Gretchen lascia cadere il discorso.
            Il nome di Ettore lo metti da parte, insieme alla strada che fa la
            sera e all'ora a cui si siede sul gradino. Quando esci dalla porta di
            servizio Gretchen ti saluta con la mano come sempre, poi resta sulla
            soglia a guardarti attraversare il cortile.
          imposta: { maison.leva-ettore: 1 }

  # ------------------------------------------------------------ passo 5 · le domande gentili
  - id: maison-le-domande-gentili
    presso: via-dei-rasoi
    immagine: ambientazione/maison-des-lunes
    titolo: Le domande gentili
    sommario: "In salone una ragazza batte con le dita un segnale che nessuna usa mai. Tachek lo vede, e non sa che cosa farne."
    luogo: Maison des Lunes, il salone
    area: citta-bassa
    requisiti: [fazione.maison == 4, pista.dama-argento >= 11]
    testo: |
      È una sera tranquilla, e dal tuo angolo del salone guardi le lampade
      con gli schermi di vetro fumé che fanno sembrare tutti un po' più
      giovani. Sul divano accanto alla finestra siede una ragazza che non
      avevi mai notato, una mezzelfa con la pelle chiarissima e gli occhi
      scuri punteggiati d'argento, che ascolta il suo cliente con la faccia
      che si fa guardando piovere. È Irmelin, ti dice Tachek senza voltarsi.

      Mentre il cliente parla, Irmelin batte due volte l'indice sul
      bracciolo e poi lo stende piatto. Tachek si irrigidisce. «Troppo
      gentile» dice a mezza voce. «Quel segnale non lo usa nessuna.»

      {empatia Media} Lei non ha paura. Ha la pazienza di una che ha deciso
      di farsi aiutare e aspetta che qualcuno se ne accorga.

      Il cliente è un uomo sui quarant'anni con la barba curata e le mani
      pulite. Paga bene e tiene le mani in grembo, lontane da Irmelin. Le fa domande
      con molto garbo su chi viene il giovedì e su chi sale nella Luna
      Calante, e ogni tanto alza gli occhi verso la lampada sopra il divano,
      come si controlla l'ora. Tachek non può buttare fuori un uomo educato,
      e lo sa.

      {percezione Facile} La lampada sopra il divano fa una luce più fredda
      delle altre, appena appena, come un bicchiere d'acqua accanto a uno di
      vino.

      *Uno che paga per non toccare niente sta comprando qualcos'altro.* Lui si
      alza, lascia le monete sul tavolino e si avvia verso l'armadio di Sara.
    opzioni:
      - testo: "Seguirlo quando esce"
        descrizione: "Ha ritirato l'arma e si è infilato il cappuccio. Se va dove pensi, ci va a piedi e senza fretta."
        prova: { attributo: fisico, abilita: [furtivita, atletica], difficolta: Media }
        successo:
          titolo: La manica
          testo: |
            Lo segui a trenta passi fino al gomito di Via dei Rasoi. Al
            cristallo spento si ferma, posa la mano nuda sulla pietra come per
            riposarsi, e china la testa verso la manica del mantello. Parla
            dentro la manica per il tempo di un padrenostro. Poi si stacca e
            prosegue verso il Ponte del Pesce, e tu torni indietro con la
            sensazione che il cristallo spento, stanotte, non sia poi così
            spento.
          pe: { furtivita: 5 }
          imposta: { maison.irmelin: 1 }
          effetti: { rep.maison: 1, fazione.maison: 1 }
        fallimento:
          titolo: Il cappuccio che si volta
          testo: |
            Lo segui troppo vicino. Al gomito della strada l'uomo si volta, ti
            guarda con molta educazione e ti augura la buona notte. Poi tira
            dritto verso il Ponte del Pesce, e al cristallo spento non si
            ferma. Lo hai perso, e lui adesso conosce la tua faccia. In salone,
            più tardi, Irmelin ti dice soltanto che guardava sempre la lampada.
          imposta: { maison.irmelin: 1 }
          effetti: { sospetto: 0.5, rep.maison: 0.5, fazione.maison: 1 }

      - testo: "Parlare con Irmelin quando lui se ne va"
        descrizione: "Ha battuto il segnale perché qualcuno l'ascoltasse. Tocca a te farlo."
        prova: { attributo: sociale, abilita: [empatia, persuasione], difficolta: Media }
        successo:
          titolo: La lampada
          testo: |
            Ti siedi accanto a lei sul divano, a una distanza educata, e le
            chiedi soltanto se vuole un tè. Irmelin ci pensa, poi dice di sì.
            Mentre lo beve ti racconta che il cliente viene da un mese e
            chiede sempre le stesse cose con parole diverse, e che quando lei
            risponde lui guarda la lampada, mai lei. «Come se parlasse con
            qualcun altro» dice, «e io fossi la strada per arrivarci.» Posa la
            tazza e ti ringrazia, con un'aria finalmente sveglia.
          pe: { empatia: 5 }
          imposta: { maison.irmelin: 1 }
          effetti: { rep.maison: 1, fazione.maison: 1 }
        fallimento:
          titolo: Il segnale sprecato
          testo: |
            Le chiedi subito chi era quell'uomo e che cosa voleva, con la voce
            di uno che compila un rapporto. Irmelin ti guarda come si guarda la
            pioggia e risponde a monosillabi. Ti dice soltanto, alla fine, che
            lui guardava sempre la lampada, e si alza per tornare al lavoro. Per
            stasera, con te, ha finito di parlare.
          imposta: { maison.irmelin: 1 }
          effetti: { rep.maison: 0.5, fazione.maison: 1 }

      - testo: "Esaminare la lampada sopra il divano"
        descrizione: "Una luce più fredda delle altre. Le lampade della Maison le ha sempre accese Nerissa, e nessuno ci mette le mani."
        prova: { attributo: mentale, abilita: [tecnologia, magia], difficolta: Media }
        successo:
          titolo: Il vetro freddo
          testo: |
            Sali sul divano con le scarpe in mano e stacchi lo schermo di vetro
            fumé. Fra lo stoppino e il riflettore d'ottone qualcuno ha
            incastrato una scheggia di cristallo conduttore grande come un'unghia,
            fredda al tatto. Le dita restano a mezz'aria, senza toccarla. La
            guardi abbastanza a lungo per
            capire che vibra appena, a tempo con le voci del salone, e rimetti
            lo schermo com'era. Tachek ti guarda dal fondo e si porta due dita
            alla cintura.
          pe: { tecnologia: 5 }
          imposta: { maison.irmelin: 1 }
          effetti: { rep.maison: 1, fazione.maison: 1 }
        fallimento:
          titolo: La lampada si spegne
          testo: |
            Stacchi lo schermo di vetro con troppa fretta, e la fiamma si
            spegne con un soffio. Il salone resta un momento al buio da quella
            parte, e due clienti si voltano. Nel buio, per un attimo, vedi
            brillare qualcosa fra lo stoppino e il riflettore, poi più niente.
            Gretchen riaccende la lampada con un fiammifero e ti guarda in
            silenzio.
          imposta: { maison.irmelin: 1 }
          effetti: { scandalo: 0.5, rep.maison: 0.5, fazione.maison: 1 }

      - testo: "Leggere il Mana intorno alla lampada"
        descrizione: "Una formula breve, e la luce della lampada ti dice da dove viene il suo freddo."
        incantesimo: leggere-il-mana
        prova: { attributo: mentale, abilita: magia, difficolta: Facile }
        successo:
          titolo: Il filo
          testo: |
            Dici la formula a bocca chiusa, e il Mana del salone ti si mostra
            come una stoffa calda, color miele, stesa su tutte le lampade. Su
            quella sopra il divano c'è un filo freddo che esce dalla stoffa,
            passa sotto la finestra e va verso la strada, teso come una lenza.
            Lo segui con lo sguardo finché non ti fanno male gli occhi. Va
            verso il gomito di Via dei Rasoi, dove sta il cristallo spento.
          pe: { magia: 5 }
          imposta: { maison.irmelin: 1 }
          effetti: { rep.maison: 1, fazione.maison: 1 }
        fallimento:
          titolo: Troppa luce
          testo: |
            Dici la formula, e il Mana del salone ti arriva addosso tutto
            insieme, color miele, così forte che devi chiudere gli occhi. Quando
            li riapri hai la testa che ronza. Sei sicuro che una delle lampade
            avesse un freddo che le altre non hanno, e su quale fosse la memoria
            ti lascia a mani vuote.
          imposta: { maison.irmelin: 1 }
          effetti: { tormento: 0.5, rep.maison: 0.5, fazione.maison: 1 }

      - testo: "Chiedere a Jass"
        descrizione: "Jass ha lavorato per gli Scuri prima di lavorare per te. Se gli Scuri hanno un orecchio in questa casa, lei sa che forma ha."
        immagine: personaggi/jass
        quando: [jass == 1, pista.pelle < 6]
        esito:
          titolo: Dopo di me
          testo: |
            Jass ti tira dietro la tenda in fondo al corridoio e ti parla con la
            bocca sul tuo orecchio, per non farsi sentire da nessuno. «Quando hanno capito che con me non funzionava più, gli
            Scuri hanno cercato un orecchio che non dorme e non si innamora» dice.
            «Io ho sentito Mauro dirlo, e ho riso.» Si stacca e guarda la lampada
            sopra il divano, e intanto si tormenta una ciocca rossa fra le dita.
          pe: { empatia: 5 }
          imposta: { maison.irmelin: 1 }
          effetti: { rep.maison: 1, fazione.maison: 1 }

      - testo: "Sentire la luce come si sente il Bosco"
        descrizione: "Al Circolo ti hanno insegnato che il Mana guasto ha un odore, come l'acqua ferma. Quella lampada ce l'ha."
        quando: [origine.figlio-del-circolo >= 1]
        prova: { attributo: mentale, abilita: [natura, percezione], difficolta: Media }
        successo:
          titolo: Il ferro bagnato
          testo: |
            Chiudi gli occhi e annusi l'aria, come nel Bosco quando cerchi una
            sorgente. Fra il profumo di cera e il tabacco del salone c'è un filo
            di ferro bagnato, l'odore del Mana guasto che al Circolo ti hanno
            insegnato a riconoscere nelle radici malate. Viene dalla lampada
            sopra il divano, ed è lo stesso che senti, passando, al cristallo
            spento in fondo alla via.
          pe: { natura: 5 }
          imposta: { maison.irmelin: 1 }
          effetti: { rep.maison: 1, fazione.maison: 1 }
        fallimento:
          titolo: Troppa luce
          testo: |
            Chiudi gli occhi e cerchi l'odore, ma il salone sa di troppe cose
            insieme, la cera delle candele con l'acqua di rose delle ragazze, e
            il filo che cercavi si perde. Riapri gli occhi con la testa che
            ronza. Sei sicuro che una delle lampade avesse un freddo che le altre
            non hanno, e su quale fosse il naso ti lascia a mani vuote.
          imposta: { maison.irmelin: 1 }
          effetti: { tormento: 0.5, rep.maison: 0.5, fazione.maison: 1 }
