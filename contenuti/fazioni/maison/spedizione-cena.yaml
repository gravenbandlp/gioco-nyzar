# La quest della Maison des Lunes, passo 11: la cena di Marella, una spedizione sociale senza nemici
# (`maison-cena-al-maniero-castaldi`, ritorno citta-bassa, soglia 4). Ci si entra da `maison-l-invito-a-cena`
# (passi-2.yaml), con l'invito o come accompagnatore. Tutte le stanze chiedono fazione.maison == 10 e
# maison.imbarazzo < 3: le gaffe fanno salire l'imbarazzo, e a tre Quintus Vael ti accompagna alla carrozza
# (`maison-cena-quintus-alla-carrozza`: Scandalo +½, l'imbarazzo torna a zero, si rientra dall'invito).
# Le fasce: 0 l'anticamera dei mantelli (i segnali della Maison aiutano) e le cucine; 1 la sala da pranzo; 1-2 la
# biblioteca con il rappresentante del Velo ed Ettore alla credenza; 2 lo studio con Annibaldi e la terrazza con lo
# sceriffo (solo se è in città); 3 il salotto del caffè con Marella e la galleria dei ritratti. Sala da pranzo,
# biblioteca e studio possono valere un voto contro il registro (maison.voti). Ogni gaffe vale mezzo punto
# d'imbarazzo; la via senza prova costa due rintocchi.
# Il cuore a 4 è Julia sulla terrazza, Difficile: sul merito (maison.julia 1, rep.castaldi +1), con la verità su
# Ettore (2, rep.castaldi −1), con la minaccia del segreto di Ettore (3, sempre riesce, rep.castaldi −2 e
# rep.maison −1), con la pagina strappata contro Annibaldi (maison.annibaldi 1). Chi fallisce non la convince
# (maison.julia 4) e paga in Scandalo, ma il passo va avanti.
# In fondo al file, la musica e l'ambiente dell'area (colonna sonora).
aree:
  - id: maison-cena-al-maniero-castaldi
    immagine: fazioni/famiglia-castaldi
    nome: La cena di Marella
    sommario: "La sera prima della seduta, al Maniero Castaldi ogni portata è un giro di voti."
    spedizione: { ritorno: citta-bassa, soglia: 4, stanze: 3 }
    testo: |
      Il Maniero Castaldi è fra le case più sobrie dei Quartieri Alti, tre
      piani di pietra chiara senza una statua in giardino. Stasera le stanze
      del pianterreno si aprono l'una nell'altra, e Marella Castaldi passa
      dall'una all'altra in grigio perla, cambiando l'argomento delle
      conversazioni dove passa.

storylet:
  # ------------------------------------------------------------ 0 · l'anticamera dei mantelli
  - id: maison-cena-l-anticamera
    immagine: fazioni/famiglia-castaldi
    titolo: L'anticamera dei mantelli
    sommario: "Una dama anziana vuole sapere chi sei."
    luogo: Maniero Castaldi, l'anticamera
    area: maison-cena-al-maniero-castaldi
    ripetibile: true
    requisiti: [fazione.maison == 10, maison.imbarazzo < 3, profondita.maison-cena-al-maniero-castaldi == 0]
    testo: |
      Nell'anticamera i mantelli degli ospiti pendono in fila dai ganci
      d'ottone. Accanto alla porta della sala siede una dama anziana con un
      ventaglio chiuso in grembo, la zia di qualcuno, e ti chiede da quale
      ramo della famiglia vieni.

      {galateo Media} Se non le rispondi con il nome giusto, entro il secondo
      piatto tutti sapranno che sei arrivato senza averne uno.
    opzioni:
      - testo: "Risponderle come si risponde nei Quartieri Alti"
        descrizione: "Un nome detto con il tono giusto e un complimento al ventaglio."
        prova: { attributo: sociale, abilita: [galateo, persuasione], difficolta: Media }
        successo:
          titolo: La dogana
          testo: |
            Le dici un nome abbastanza vecchio e lodi il ventaglio di madreperla,
            e la dama te lo batte sul polso due volte, che fra le dame della sua
            età vuol dire passa pure.
          effetti: { profondita.maison-cena-al-maniero-castaldi: 1 }
        fallimento:
          titolo: Il ramo sbagliato
          testo: |
            La dama ti fa notare con molta gentilezza, e abbastanza forte da farsi
            sentire in sala, che quel ramo si è estinto quarant'anni fa.
          effetti: { maison.imbarazzo: 0.5 }
      - testo: "Rispondere con il ventaglio, come in salone"
        descrizione: "I segnali del ventaglio della Maison qualcuno li ha imparati anche nei Quartieri Alti."
        requisiti: [chiave.segnali >= 1]
        prova: { attributo: sociale, abilita: [galateo, empatia], difficolta: Facile }
        successo:
          titolo: Il ventaglio
          testo: |
            Apri il ventaglio a metà e lo richiudi con un colpo secco, come ti ha
            insegnato Tachek. La dama ride come una ragazza e ti dice sottovoce
            che quel segnale non lo vedeva da cinquant'anni.
          effetti: { profondita.maison-cena-al-maniero-castaldi: 1 }
        fallimento:
          titolo: Il ventaglio aperto
          testo: |
            Apri il ventaglio del tutto, e la dama ti crede accaldato e ti tiene a
            parlare del tempo mentre la cena comincia senza di te.
          effetti: { maison.imbarazzo: 0.5 }
      - testo: "Aspettare che si addormenti"
        descrizione: "Prima o poi le zie che fanno la dogana si appisolano."
        costo: 2
        esito:
          titolo: La pazienza
          testo: |
            Fingi di cercare il tuo mantello finché la dama comincia a russare, ed
            entri in sala sotto lo sguardo di un valletto che ti prende per un
            ladro di cappelli.
          effetti: { profondita.maison-cena-al-maniero-castaldi: 1 }

  # ------------------------------------------------------------ 0 · le cucine
  - id: maison-cena-le-cucine
    immagine: fazioni/famiglia-castaldi
    titolo: Le cucine
    sommario: "Le serve delle cucine sanno chi ha bevuto, e quanto."
    luogo: Maniero Castaldi, le cucine
    area: maison-cena-al-maniero-castaldi
    ripetibile: true
    requisiti: [fazione.maison == 10, maison.imbarazzo < 3, profondita.maison-cena-al-maniero-castaldi == 0]
    testo: |
      Una porta di servizio ti porta per sbaglio nelle cucine, calde come una
      fucina. Le serve entrano ed escono con i vassoi e si dicono a mezza voce
      chi ha già chiesto il secondo bicchiere.

      {resistenza Facile fallita} L'odore dell'arrosto ti ricorda che da
      stamattina non hai mangiato niente per paura di macchiare l'abito.
    opzioni:
      - testo: "Chiedere alle serve chi ha già bevuto"
        descrizione: "Un aiuto con un vassoio, a chi non ascolta mai nessuno."
        prova: { attributo: sociale, abilita: [empatia, conoscenze-della-strada], difficolta: Media }
        successo:
          titolo: Le brocche col nome
          testo: |
            Porti un vassoio fino alla sala per una ragazza con le braccia che
            tremano, e lei ti dice chi beve stasera. Il cugino della
            Rappresentante è alla seconda brocca e un consigliere della Gilda alla
            terza.
          effetti: { profondita.maison-cena-al-maniero-castaldi: 1, informazioni.voce: 1 }
        fallimento:
          titolo: La cuoca
          testo: |
            Fai una domanda di troppo, e la cuoca più anziana ti mette in mano un
            mestolo. Torni in sala con una macchia di sugo sulla manica.
          effetti: { maison.imbarazzo: 0.5 }
      - testo: "Rubare un boccone e tornare in sala"
        descrizione: "A una cena di consiglio lo stomaco vuoto si sente nella voce."
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Media }
        successo:
          titolo: Il pasticcino
          testo: |
            Mangi un pasticcino in due morsi dietro una colonna e rientri con la
            voce più ferma, visto soltanto da una serva che ti fa l'occhiolino.
          effetti: { profondita.maison-cena-al-maniero-castaldi: 1 }
        fallimento:
          titolo: Lo zucchero a velo
          testo: |
            Lo zucchero a velo ti cade sul davanti dell'abito, e Marella ti guarda
            il petto con un sopracciglio alzato.
          effetti: { maison.imbarazzo: 0.5 }
      - testo: "Tornare in sala per la porta lunga"
        descrizione: "Il corridoio e la scala di servizio, e si arriva in ritardo."
        costo: 2
        esito:
          titolo: In ritardo
          testo: |
            Arrivi quando gli ospiti sono già seduti, e raggiungi il tuo posto
            vuoto sotto lo sguardo di tutta la tavola.
          effetti: { profondita.maison-cena-al-maniero-castaldi: 1 }

  # ------------------------------------------------------------ 1 · la sala da pranzo
  - id: maison-cena-la-sala-da-pranzo
    immagine: fazioni/famiglia-castaldi
    titolo: La sala da pranzo
    sommario: "Marella ti ha messo accanto a un consigliere indeciso, e non per caso."
    luogo: Maniero Castaldi, la sala da pranzo
    area: maison-cena-al-maniero-castaldi
    ripetibile: true
    requisiti: [fazione.maison == 10, maison.imbarazzo < 3, profondita.maison-cena-al-maniero-castaldi == 1]
    testo: |
      La tavola è ovale come quella che Nerissa ha disegnato a matita. Il tuo
      vicino è un consigliere anziano con la barba bianca che tiene la
      forchetta da pesce come uno scalpello, e dall'altra parte Ruggero
      Annibaldi parla di decoro girandosi sul dito l'anello della Gilda.

      {politica-ed-economia Media} Il tuo vicino vota con la Gilda da
      trent'anni, e quest'anno non ha ancora deciso.
    opzioni:
      - testo: "Parlare al tuo vicino del registro"
        descrizione: "Più del registro lo interessano i nomi che ci finirebbero."
        prova: { attributo: sociale, abilita: [persuasione, galateo], difficolta: Media }
        successo:
          titolo: La forchetta da pesce
          testo: |
            Gli parli dei suoi nipoti e della sua passeggiata serale lungo Via del
            Salmone, e del registro soltanto alla fine. Al dolce ti dice, senza
            guardarti, che una legge che scrive i nomi delle passeggiate lui non
            la vota.
          effetti: { profondita.maison-cena-al-maniero-castaldi: 1, maison.voti: 1 }
        fallimento:
          titolo: La moglie
          testo: |
            Gli parli della sua passeggiata serale lungo Via del Salmone, e lui ti
            chiede ad alta voce che cosa intendi. Mezza tavola si volta verso di
            te.
          effetti: { maison.imbarazzo: 0.5 }
      - testo: "Ascoltare Annibaldi e prendere nota a memoria"
        descrizione: "Chi ascolta bene sente anche quello che non dice."
        prova: { attributo: mentale, abilita: [percezione, politica-ed-economia], difficolta: Media }
        successo:
          titolo: Il decoro
          testo: |
            Annibaldi dice decoro sette volte, guardando ogni volta uno dei
            consiglieri che conta di avere. Fra loro manca il tuo vicino, e adesso
            sai a chi conviene parlare prima del voto.
          effetti: { profondita.maison-cena-al-maniero-castaldi: 1, informazioni.pettegolezzo: 1 }
        fallimento:
          titolo: La minestra
          testo: |
            Il cucchiaio ti scivola nel piatto e interrompe il discorso, e
            Annibaldi si ferma a sorriderti, molto educato.
          effetti: { maison.imbarazzo: 0.5 }
      - testo: "Mangiare in silenzio e passare oltre"
        descrizione: "Sei portate di silenzio, che è un galateo anche questo."
        costo: 2
        esito:
          titolo: Sei portate
          testo: |
            Mangi sei portate in silenzio, sorridendo al vicino quando ti passa il
            sale, e ti alzi con la sensazione di essere stato un mobile.
          effetti: { profondita.maison-cena-al-maniero-castaldi: 1 }

  # ------------------------------------------------------------ 1-2 · la biblioteca
  - id: maison-cena-la-biblioteca
    immagine: ambientazione/cattedrale-del-velo
    titolo: La biblioteca
    sommario: "Il rappresentante del Velo in Consiglio si è rifugiato fra i libri, e ha una domanda per te."
    luogo: Maniero Castaldi, la biblioteca
    area: maison-cena-al-maniero-castaldi
    ripetibile: true
    requisiti: [fazione.maison == 10, maison.imbarazzo < 3, profondita.maison-cena-al-maniero-castaldi >= 1, profondita.maison-cena-al-maniero-castaldi <= 2]
    testo: |
      Davanti al camino della biblioteca, con un libro aperto sulle
      ginocchia e un bicchiere d'acqua sul bracciolo, siede il chierico che
      rappresenta il Velo in Consiglio, un uomo minuto con la tonsura che
      ricresce. Senza alzare gli occhi ti chiede se è vero che la casa di
      Via dei Rasoi non scrive mai un nome.

      {accademiche Media} Il libro è un trattato dei primi Padri del Velo
      sulla confessione, e il segnalibro sta al capitolo sul segreto.

      {origine accolito-del-velo} Al Velo chi ascolta le confessioni giura
      di non scriverle mai, ed è una delle prime cose che ti hanno
      insegnato.
    opzioni:
      - testo: "Parlargli del segreto della confessione"
        descrizione: "Il Velo rifiuterebbe per sé il registro che vogliono imporre alla Maison."
        prova: { attributo: mentale, abilita: [accademiche, persuasione], difficolta: Media }
        successo:
          titolo: Il capitolo sul segreto
          testo: |
            Gli citi il capitolo sul segreto e gli chiedi se il Velo terrebbe un
            registro di chi va a confessarsi. Il chierico chiude il libro e ti
            dice che ci penserà, il che per un uomo di chiesa vuol dire di sì.
          effetti: { profondita.maison-cena-al-maniero-castaldi: 1, maison.voti: 1 }
        fallimento:
          titolo: Il capitolo sbagliato
          testo: |
            Il capitolo che citi parla della penitenza, e il chierico te lo fa
            notare con gentilezza prima di tornare al suo libro.
          effetti: { maison.imbarazzo: 0.5 }
      - testo: "Rispondergli con le parole del Velo"
        descrizione: "Le preghiere di quando era novizio le hai dette anche tu."
        quando: [origine.accolito-del-velo >= 1]
        prova: { attributo: sociale, abilita: [empatia, accademiche], difficolta: Facile }
        successo:
          titolo: Il capitolo sul segreto
          testo: |
            Gli rispondi a voce bassa con la formula del giuramento dei confessori.
            Il chierico chiude il libro e ti promette che voterà contro, perché il
            Velo ha sempre rispettato chi tace.
          effetti: { profondita.maison-cena-al-maniero-castaldi: 1, maison.voti: 1 }
        fallimento:
          titolo: Il capitolo sbagliato
          testo: |
            Confondi la formula con quella del vespro, e il chierico ti corregge
            con un sorriso da maestro di novizi.
          effetti: { maison.imbarazzo: 0.5 }
      - testo: "Lasciarlo leggere e passare oltre"
        descrizione: "A una cena, chi si rifugia in biblioteca non vuole compagnia."
        costo: 2
        esito:
          titolo: Il camino
          testo: |
            Attraversi la biblioteca fino allo studio con un mezzo inchino, e un
            valletto ti chiede se ti sei perso.
          effetti: { profondita.maison-cena-al-maniero-castaldi: 1 }

  # ------------------------------------------------------------ 1-2 · Ettore alla credenza
  - id: maison-cena-ettore-alla-credenza
    immagine: personaggi/ettore-castaldi
    titolo: Ettore alla credenza
    sommario: "Il cugino della Rappresentante, appoggiato alla credenza, ha voglia di raccontare dove passa il giovedì."
    luogo: Maniero Castaldi, la sala da pranzo
    area: maison-cena-al-maniero-castaldi
    ripetibile: true
    requisiti: [fazione.maison == 10, maison.imbarazzo < 3, profondita.maison-cena-al-maniero-castaldi >= 1, profondita.maison-cena-al-maniero-castaldi <= 2]
    testo: |
      Ettore Castaldi, appoggiato alla credenza con un bicchiere d'idromele e
      la faccia accaldata, racconta a due giovani della Gilda di un posto in
      Città Bassa dove il tè è buono e nessuno ti chiede niente. Sta per dire
      dove, e dall'altra parte della sala Marella ha smesso di parlare per
      guardarlo.

      {galateo Media} Fra due frasi il nome della Maison sarà sulla bocca di
      tutta la tavola insieme a quello dei Castaldi, e Marella lo farebbe
      pagare a te per primo.
    opzioni:
      - testo: "Interromperlo con un pretesto"
        descrizione: "Un brindisi o un bicchiere rovesciato, purché arrivi prima del nome."
        prova: { attributo: sociale, abilita: [ingannare, galateo], difficolta: Media }
        successo:
          titolo: Il brindisi
          testo: |
            Proponi ad alta voce un brindisi ai paladini del Grande Albero, ed
            Ettore brinda commosso con tutta la tavola e dimentica quello che
            stava dicendo.
          effetti: { profondita.maison-cena-al-maniero-castaldi: 1 }
        fallimento:
          titolo: Il nome
          testo: |
            Ettore brinda e poi riprende il discorso, e nel silenzio tutti sentono
            il nome di Via dei Rasoi. Marella lo porta in giardino, e più di uno
            si volta a guardare te.
          effetti: { maison.imbarazzo: 0.5, scandalo: 1 }
      - testo: "Prenderlo sottobraccio e portarlo in giardino"
        descrizione: "Un amico che ha bisogno d'aria, da prendere con la presa giusta sul gomito."
        prova: { attributo: fisico, abilita: [atletica, rissa], difficolta: Media }
        successo:
          titolo: L'aria
          testo: |
            Lo prendi sottobraccio come quella sera in Via dei Rasoi, e lui ti
            riconosce e ride. Lo lasci sul bordo di una fontana con un bicchiere
            d'acqua, e alla credenza si parla già del prezzo del grano.
          effetti: { profondita.maison-cena-al-maniero-castaldi: 1 }
        fallimento:
          titolo: Il gomito
          testo: |
            Ettore ti scrolla via ridendo, e l'idromele finisce sul tuo abito
            sotto gli occhi di tutta la sala.
          effetti: { maison.imbarazzo: 0.5 }
      - testo: "Allontanarti e lasciare che se ne occupi Marella"
        descrizione: "È suo cugino e casa sua, ma passargli accanto senza fermarsi si nota."
        costo: 2
        esito:
          titolo: Marella
          testo: |
            Marella arriva prima del nome e porta via il cugino sorridendo, con
            un'occhiata che vuol dire che ha visto anche te.
          effetti: { profondita.maison-cena-al-maniero-castaldi: 1 }

  # ------------------------------------------------------------ 2 · lo studio con Annibaldi
  - id: maison-cena-lo-studio
    immagine: fazioni/gilda-dei-mercanti
    titolo: Lo studio
    sommario: "Nello studio Ruggero Annibaldi fuma un sigaro con due consiglieri della Gilda. Sta promettendo qualcosa."
    luogo: Maniero Castaldi, lo studio
    area: maison-cena-al-maniero-castaldi
    ripetibile: true
    requisiti: [fazione.maison == 10, maison.imbarazzo < 3, profondita.maison-cena-al-maniero-castaldi == 2]
    testo: |
      Lo studio è pieno di fumo di sigaro e di mappe della regione, con i
      confini delle concessioni in rosso. Ruggero Annibaldi, la barba grigia
      tagliata a punta, promette davanti al camino un appalto a due
      consiglieri della Gilda in cambio di un voto.

      {politica-ed-economia Media} È una promessa che si mantiene dopo il
      voto, e se vale meno di quello che i due rischiano si comprano anche al
      contrario.
    opzioni:
      - testo: "Fare i conti della promessa ai due consiglieri"
        descrizione: "Un appalto fra un anno contro un nome che resta sul registro per dieci."
        prova: { attributo: mentale, abilita: [politica-ed-economia, persuasione], difficolta: Media }
        successo:
          titolo: Le due cifre
          testo: |
            Quando Annibaldi esce a prendere un sigaro, fai ai due consiglieri i
            conti della promessa contro il registro. Al suo ritorno uno dei due
            gli dice che ci deve ancora pensare.
          effetti: { profondita.maison-cena-al-maniero-castaldi: 1, maison.voti: 1 }
        fallimento:
          titolo: Il sigaro
          testo: |
            Annibaldi rientra a metà dei conti e dice ai due che la Maison ha
            mandato una persona molto preparata. Uscendo li senti ridere tutti e
            tre.
          effetti: { maison.imbarazzo: 0.5 }
      - testo: "Leggere le mappe delle concessioni"
        descrizione: "Le mappe sul muro dicono dove vanno le promesse di Annibaldi."
        prova: { attributo: mentale, abilita: [percezione, accademiche], difficolta: Media }
        successo:
          titolo: Il confine rosso
          testo: |
            Sulla mappa una concessione nuova è tracciata a matita sopra il
            confine rosso, accanto ai magazzini della Gilda sul Torvessa, ed è la
            promessa di Annibaldi.
          effetti: { profondita.maison-cena-al-maniero-castaldi: 1, informazioni.pettegolezzo: 1 }
        fallimento:
          titolo: La mappa storta
          testo: |
            La cornice si sposta sul chiodo, e Annibaldi ti parla di cartografia
            per un quarto d'ora.
          effetti: { maison.imbarazzo: 0.5 }
      - testo: "Passare dallo studio senza fermarti"
        descrizione: "Il fumo, le mappe, un sorriso ai presenti, e l'altra porta."
        costo: 2
        esito:
          titolo: Il fumo
          testo: |
            Attraversi lo studio con un sorriso per tutti, e Annibaldi ti guarda
            passare girandosi l'anello sul dito.
          effetti: { profondita.maison-cena-al-maniero-castaldi: 1 }

  # ------------------------------------------------------------ 2 · la terrazza con lo sceriffo
  - id: maison-cena-la-terrazza
    immagine: personaggi/toren-galdrick
    titolo: La terrazza
    sommario: "Lo sceriffo guarda la città da solo, e domani voterà a viso aperto."
    luogo: Maniero Castaldi, la terrazza
    area: maison-cena-al-maniero-castaldi
    ripetibile: true
    requisiti: [fazione.maison == 10, maison.imbarazzo < 3, galdrick.via == 0, profondita.maison-cena-al-maniero-castaldi == 2]
    testo: |
      Sulla terrazza sale un vento fresco dalla Città Bassa, che di sotto è
      un tappeto di lanterne. Toren Galdrick è appoggiato alla balaustra con
      un bicchiere vuoto e la divisa abbottonata fino al collo, e ti fa
      posto senza dire niente.

      «Domani voto contro» dice dopo un po'. «E lo dico in aula, perché un
      registro di nomi in mano alla Guardia è un registro in mano a chi
      compra la Guardia.»

      {empatia Media} Lo farebbe davvero, ma in aula qualcuno si chiederà
      perché lo sceriffo tiene tanto a una casa di Via dei Rasoi.
    opzioni:
      - testo: "Chiedergli di aspettare"
        descrizione: "Se i voti bastano senza di lui, non deve dire niente in aula."
        prova: { attributo: sociale, abilita: [empatia, persuasione], difficolta: Media }
        successo:
          titolo: La promessa
          testo: |
            Gli dici che i voti forse bastano, e che la Maison preferisce uno
            sceriffo che non debba spiegare niente. Lui gira a lungo il bicchiere
            vuoto, poi ti promette che alzerà la mano soltanto se servirà.
          effetti: { profondita.maison-cena-al-maniero-castaldi: 1, rep.caserma: 0.5 }
        fallimento:
          titolo: Il bicchiere vuoto
          testo: |
            Lo sceriffo ti risponde che il suo voto è suo e torna a guardare le
            lanterne.
          effetti: { maison.imbarazzo: 0.5 }
      - testo: "Restare in silenzio a guardare la città"
        descrizione: "È venuto qui per non parlare con nessuno."
        costo: 2
        esito:
          titolo: Le lanterne
          testo: |
            Resti accanto a lui in silenzio finché il vento non ti entra nella
            giacca, e quando rientri lui alza appena il bicchiere vuoto.
          effetti: { profondita.maison-cena-al-maniero-castaldi: 1 }

  # ------------------------------------------------------------ 3 · il salotto del caffè
  - id: maison-cena-il-salotto-del-caffe
    immagine: personaggi/marella-castaldi
    titolo: Il salotto del caffè
    sommario: "Marella Castaldi serve il caffè di persona, e a ogni tazza decide chi ti siederà vicino."
    luogo: Maniero Castaldi, il salotto del caffè
    area: maison-cena-al-maniero-castaldi
    ripetibile: true
    requisiti: [fazione.maison == 10, maison.imbarazzo < 3, profondita.maison-cena-al-maniero-castaldi == 3]
    testo: |
      Nel salotto di seta grigia Marella Castaldi versa il caffè di persona,
      e a ogni tazza dice all'ospite dove sedersi. Quando arriva il tuo
      turno ti guarda sopra la caffettiera.

      {galateo Difficile} Sta decidendo se metterti vicino alla porta della
      terrazza o a quella d'uscita, e dipende da come prendi la tazza.
    opzioni:
      - testo: "Prendere la tazza come si deve"
        descrizione: "Pollice e due dita, e un complimento che non sembri tale."
        prova: { attributo: sociale, abilita: [galateo, espressivita], difficolta: Media }
        successo:
          titolo: La porta della terrazza
          testo: |
            Prendi la tazza come si prendono le cose fragili e dici che il caffè è
            amaro al punto giusto. Marella ti indica il divano vicino alla porta
            della terrazza, dove fra poco uscirà la Rappresentante.
          effetti: { profondita.maison-cena-al-maniero-castaldi: 1, maison.imbarazzo: -1 }
        fallimento:
          titolo: Il piattino
          testo: |
            La tazza tintinna sul piattino, e Marella ti porge un tovagliolo e ti
            indica il divano vicino alla porta d'uscita.
          effetti: { maison.imbarazzo: 0.5 }
      - testo: "Parlare a Marella di Nerissa, con garbo"
        descrizione: "Della Maison si può forse parlare, se lo si fa da padrona di casa a padrona di casa."
        prova: { attributo: sociale, abilita: [empatia, galateo], difficolta: Media }
        successo:
          titolo: Fra padrone di casa
          testo: |
            Le porti gli omaggi della padrona di una casa di Via dei Rasoi, che
            anche lei decide chi siede dove. Marella ti dice che le case si
            somigliano più di quanto si creda e ti indica la porta della terrazza.
          effetti: { profondita.maison-cena-al-maniero-castaldi: 1, maison.imbarazzo: -1 }
        fallimento:
          titolo: L'argomento
          testo: |
            Marella posa la caffettiera con un rumore appena più forte del
            necessario e ti ricorda che a questa tavola si parla di Stato.
          effetti: { maison.imbarazzo: 0.5 }
      - testo: "Prendere il caffè in piedi, vicino alla finestra"
        descrizione: "Nessuno ti siede vicino, e nessuno ti nota."
        costo: 2
        esito:
          titolo: La finestra
          testo: |
            Bevi il caffè guardando il giardino, e quando qualcuno esce sulla
            terrazza lo segui con la tazza in mano.
          effetti: { profondita.maison-cena-al-maniero-castaldi: 1 }

  # ------------------------------------------------------------ 3 · la galleria dei ritratti
  - id: maison-cena-la-galleria
    immagine: fazioni/famiglia-castaldi
    titolo: La galleria dei ritratti
    sommario: "Un corridoio di ritratti dei Castaldi vestiti di scuro. Uno è girato verso il muro."
    luogo: Maniero Castaldi, la galleria
    area: maison-cena-al-maniero-castaldi
    ripetibile: true
    requisiti: [fazione.maison == 10, maison.imbarazzo < 3, profondita.maison-cena-al-maniero-castaldi == 3]
    testo: |
      Nella galleria verso la terrazza i Castaldi dei ritratti, vestiti di
      scuro, guardano il pittore come un creditore. Uno solo, verso la fine,
      è girato verso il muro, con il cartellino del nome coperto da un
      nastro.

      {origine rampollo-dei-quartieri-alti} In ogni casa dei Quartieri Alti
      c'è un ritratto girato, e da ragazzo ti hanno insegnato a non chiedere
      mai di chi è.
    opzioni:
      - testo: "Lasciare il ritratto com'è e proseguire"
        descrizione: "In una casa come questa i ritratti girati restano girati."
        prova: { attributo: sociale, abilita: [galateo, resilienza], difficolta: Media }
        successo:
          titolo: Il nastro
          testo: |
            Passi davanti al ritratto senza rallentare, e in fondo un valletto ti
            apre la porta della terrazza con un inchino di approvazione.
          effetti: { profondita.maison-cena-al-maniero-castaldi: 1 }
        fallimento:
          titolo: La curiosità
          testo: |
            Rallenti davanti al ritratto, e un valletto ti chiede con molta
            cortesia se desideri qualcosa.
          effetti: { maison.imbarazzo: 0.5 }
      - testo: "Voltare il ritratto e guardare"
        descrizione: "Durante il caffè qui non passa nessuno, e lo rimetti subito com'era."
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Media }
        successo:
          titolo: Il ritratto girato
          testo: |
            È un giovane con l'armatura del Grande Albero e una faccia aperta, che
            somiglia molto a Ettore prima del Santuario. Lo rimetti com'era e
            prosegui verso la terrazza con un nodo in gola.
          effetti: { profondita.maison-cena-al-maniero-castaldi: 1, informazioni.voce: 1 }
        fallimento:
          titolo: Il chiodo
          testo: |
            Il ritratto ti scivola dal chiodo e cade con un colpo che si sente
            fino al salotto, e una volta rimesso a posto pende di lato.
          effetti: { maison.imbarazzo: 0.5, scandalo: 1 }
      - testo: "Passare dalla finestra e fare il giro dal giardino"
        descrizione: "I ritratti sorvegliano la galleria, e le zanzare il giardino."
        costo: 2
        esito:
          titolo: Il giardino
          testo: |
            Esci da una finestra bassa e rientri dalla terrazza con le scarpe
            bagnate di rugiada.
          effetti: { profondita.maison-cena-al-maniero-castaldi: 1 }

  # ------------------------------------------------------------ l'imbarazzo · Quintus alla carrozza
  - id: maison-cena-quintus-alla-carrozza
    immagine: personaggi/quintus-vael
    titolo: Quintus alla carrozza
    sommario: "Il comandante della guardia dei Castaldi ti si avvicina con il tuo mantello sul braccio."
    luogo: Maniero Castaldi, il vestibolo
    area: maison-cena-al-maniero-castaldi
    requisiti: [fazione.maison == 10, maison.imbarazzo >= 3]
    testo: |
      Quintus Vael ti si avvicina con il tuo mantello piegato sul braccio e la
      cicatrice sotto il mento appena più pallida del solito. Ti dice che la carrozza
      è pronta e che la padrona di casa ti ringrazia della visita.

      {galateo Facile} Ti accompagnano alla porta con tutti i riguardi e davanti a
      tutti, che è peggio di una cacciata.
    opzioni:
      - testo: "Prendere il mantello e salire in carrozza"
        descrizione: "Si esce con un sorriso, e si aspetta che Nerissa trovi un'altra cena."
        costo: 0
        esito:
          titolo: La pioggia
          testo: |
            Quintus ti accompagna alla carrozza tenendoti l'ombrello sopra la
            testa. Domani nei salotti diranno che la persona della Maison non ha
            retto il vino, e Nerissa ti farà sapere quando c'è un'altra cena.
          imposta: { maison.imbarazzo: 0 }
          effetti: { scandalo: 1 }
          vai: citta-bassa

  # ------------------------------------------------------------ il cuore · Julia sulla terrazza
  - id: maison-cena-julia-sulla-terrazza
    immagine: personaggi/julia-castaldi
    titolo: Julia sulla terrazza
    sommario: "La Rappresentante è uscita a prendere aria. Ha cinque minuti, e li concede a te."
    luogo: Maniero Castaldi, la terrazza
    area: maison-cena-al-maniero-castaldi
    requisiti: [fazione.maison == 10, maison.imbarazzo < 3, profondita.maison-cena-al-maniero-castaldi >= 4]
    testo: |
      Julia Castaldi è appoggiata alla balaustra con le braccia incrociate e
      una cartella di pelle sotto il gomito, perché alle cene di sua cognata
      porta sempre il lavoro. Ti guarda arrivare senza sorpresa, e sa chi sei
      e per chi sei venuto.

      «Ha cinque minuti» dice. «Domani il registro passa o cade per un voto,
      e io ho letto la bozza tre volte. Mi dica perché dovrei votare contro
      una legge che tiene in ordine una strada che tutti vorrebbero più
      ordinata.»

      {politica-ed-economia Media} Julia ha costruito la carriera sulle carte
      in regola, e un argomento sul merito la convince se regge come una
      pratica.

      {empatia Difficile} Sotto la cartella si stringe il gomito con la mano.
      Suo cugino è dentro alla terza brocca, e stasera lei teme lui più del
      voto.
    opzioni:
      - testo: "Convincerla sul merito"
        descrizione: "Il registro finirebbe in mano a chi compra la Guardia, e lei vuole sentirlo in cifre."
        prova: { attributo: mentale, abilita: [politica-ed-economia, persuasione], difficolta: Difficile }
        successo:
          titolo: La pratica
          testo: |
            Le parli come a un ufficio, contando quanti uomini della Guardia hanno
            preso la paga degli Scuri e quanti nomi entrerebbero nel registro in
            un anno. Julia scrive qualcosa a matita a margine della bozza e ti
            dice che domani voterà contro.
          pe: { politica-ed-economia: 10 }
          imposta: { maison.julia: 1, maison.imbarazzo: 0 }
          effetti: { maison.voti: 1, rep.castaldi: 1, rep.maison: 1, informazioni.segreto: 1, fazione.maison: 1 }
          vai: citta-bassa
        fallimento:
          titolo: Le cifre sbagliate
          testo: |
            Julia ti corregge la seconda cifra prima che tu arrivi alla terza. Ti
            ringrazia per i cinque minuti e rientra, e dalla porta Marella ti
            guarda come un ospite che non sarà più invitato.
          pe: { politica-ed-economia: 10 }
          imposta: { maison.julia: 4, maison.imbarazzo: 0 }
          effetti: { scandalo: 1.5, rep.castaldi: -0.5, informazioni.segreto: 1, fazione.maison: 1 }
          vai: citta-bassa
      - testo: "Dirle di Ettore, perché il registro scriverebbe anche il suo nome"
        descrizione: "Lei lo teme già, e sarebbe una ragione da non confessare a nessuno."
        quando: [segreto.ettore >= 1]
        prova: { attributo: sociale, abilita: [empatia, galateo], difficolta: Difficile }
        successo:
          titolo: Il nome di suo cugino
          testo: |
            Le dici piano che nel registro ci sarebbe anche il nome di un uomo a
            cui vuole bene. Julia guarda verso la sala, dove Ettore ride troppo
            forte, e dopo un lungo silenzio ti dice che voterà contro e che alle
            cene di sua cognata non vuole più vederti. Da domani Ettore smetterà
            di salutarti per strada, senza sapere perché.
          pe: { empatia: 10 }
          imposta: { maison.julia: 2, maison.imbarazzo: 0 }
          effetti: { maison.voti: 1, rep.castaldi: -1, rep.maison: 1, informazioni.segreto: 1, fazione.maison: 1 }
          vai: citta-bassa
        fallimento:
          titolo: Il nome sbagliato al momento sbagliato
          testo: |
            Julia si irrigidisce e ti dice che la famiglia Castaldi non si discute
            sulla terrazza della famiglia Castaldi. Rientra, e Marella, dalla
            porta, ha sentito abbastanza.
          pe: { empatia: 10 }
          imposta: { maison.julia: 4, maison.imbarazzo: 0 }
          effetti: { scandalo: 1.5, rep.castaldi: -1, informazioni.segreto: 1, fazione.maison: 1 }
          vai: citta-bassa
      - testo: "Minacciarla con quello che sai di Ettore"
        descrizione: "Una leva tenuta in un cassetto per un giorno come questo."
        quando: [maison.leva-ettore >= 1]
        esito:
          titolo: La leva
          testo: |
            Le dici dove passa le sere suo cugino, e che domani potrebbero saperlo tutti. Julia ti dice che voterà contro con la
            voce di una che firma una resa, e rientra senza salutare. Quando Nerissa lo saprà, non ti verserà il tè per un
            pezzo.

            {resilienza Media} Hai le mani fredde, e non ricordi il momento in cui hai deciso di farlo.
          imposta: { maison.julia: 3, maison.imbarazzo: 0 }
          effetti: { maison.voti: 1, rep.castaldi: -2, rep.maison: -1, informazioni.segreto: 1, fazione.maison: 1 }
          vai: citta-bassa
      - testo: "Mostrare ad Annibaldi la pagina con il suo nome"
        descrizione: "La pagina strappata dal quaderno dello scrivano porta il nome di Annibaldi, che è sulla porta."
        quando: [maison.pagina == 1]
        prova: { attributo: sociale, abilita: [ingannare, intimidire], difficolta: Difficile }
        successo:
          titolo: Tre date
          testo: |
            Mostri ad Annibaldi la pagina tenendola fra due dita, il tempo di
            leggere tre date e un nome, e gli dici che la copia è in un posto
            sicuro. Lui impallidisce sopra la barba a punta e ti dice che domani
            la proposta sarà ritirata per ragioni di opportunità.
          pe: { ingannare: 10 }
          imposta: { maison.annibaldi: 1, maison.julia: 4, maison.imbarazzo: 0 }
          effetti: { rep.maison: 1, informazioni.segreto: 1, fazione.maison: 1 }
          vai: citta-bassa
        fallimento:
          titolo: La copia
          testo: |
            Annibaldi ti chiede con un sorriso dove sia la copia, e tu esiti. Ti
            sfila la pagina di mano e torna dentro a dire a mezza sala che la
            Maison manda ricattatori alle cene.
          pe: { ingannare: 10 }
          imposta: { maison.pagina: 0, maison.julia: 4, maison.imbarazzo: 0 }
          effetti: { scandalo: 1.5, informazioni.segreto: 1, fazione.maison: 1 }
          vai: citta-bassa

