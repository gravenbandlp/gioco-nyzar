# La quest della Maison des Lunes, passo 8: la spedizione «Sotto il cristallo spento» (ritorno citta-bassa,
# soglia 4). Ci si entra dalla legnaia della Maison (`maison-la-legnaia`, passi-2.yaml). Tutte le stanze chiedono
# fazione.maison == 7. Le fasce di profondità:
# 0 la scala marcia e la cantina dei vini di Gretchen; 1 l'acqua alla cintura; 1-2 il bivio col gesso degli Scuri e
# la stanza dismessa del Mercato delle Ombre (il cristallo carico si prende una volta sola, maison.dimenticato);
# 2 il tombino sotto la lanterna; 2-3 le due guardie (Scuri prima della Pignatta, ladri di ferro dopo; la via
# sociale è Difficile se al passo 7 hai tolto il cristallo, maison.cristallo 1); 3 la grata della Pignatta e le voci
# nel muro. In ogni stanza c'è la via senza prova: due rintocchi e mezza Ferita.
# Il cuore a 4 è la camera d'ascolto: Bastiano Rell, boss Difficile (scontro con due sgherri, Persuasione sui debiti,
# Intimidire con Kanat, la recita del passo 7, Voce di seta; l'Allievo di Torvessa e il Figlio della Città Bassa
# hanno una via loro). Chi riesce porta maison.scrivano a 5 e il passo a 8; chi fallisce prende Ferite, Bastiano
# scappa con il gemello (maison.scrivano 3); il quaderno resta a te e il passo va avanti comunque.
# In fondo al file, la musica e l'ambiente dell'area (colonna sonora).
aree:
  - id: maison-sotto-il-cristallo-spento
    immagine: ambientazione/citta-bassa
    nome: Sotto il cristallo spento
    sommario: "Sotto la Maison e sotto Via dei Rasoi corre la condotta dell'acqua vecchia, che non usa più quasi nessuno."
    spedizione: { ritorno: citta-bassa, soglia: 4, stanze: 3 }
    testo: |
      La condotta dell'acqua vecchia è un tunnel di mattoni alto quanto un
      uomo, con la volta annerita dalle lanterne e un rigagnolo sul fondo.
      Ogni tanto da una grata scende una lama di luce da Via dei Rasoi.

      L'aria sa di muffa, e sotto la muffa c'è un odore di cera, di qualcuno
      passato con una candela non molto tempo fa.

storylet:
  # ------------------------------------------------------------ 0 · la scala marcia
  - id: maison-cristallo-la-scala-marcia
    immagine: ambientazione/maison-des-lunes
    titolo: La scala marcia
    sommario: "Dalla cantina alla condotta si scende per una vecchia scala di legno marcia d'acqua."
    luogo: Sotto la Maison, il pozzo della cantina
    area: maison-sotto-il-cristallo-spento
    ripetibile: true
    requisiti: [fazione.maison == 7, profondita.maison-sotto-il-cristallo-spento == 0]
    testo: |
      In fondo alla cantina dei vini un pozzo quadrato scende nel buio per
      tre volte la tua altezza. I pioli della scala sono neri di umidità, e
      al posto del quarto dall'alto qualcuno ha annodato un pezzo di corda
      che penzola molle.

      {atletica Media} Con le mani sui montanti e i piedi vicino ai chiodi la
      scala regge, mentre il legno al centro dei pioli è spugna.
    opzioni:
      - testo: "Scendere tenendoti ai montanti"
        descrizione: "Piedi vicino ai chiodi, mani sul legno buono, e niente fretta."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Media }
        successo:
          titolo: I chiodi
          testo: |
            Scendi stretto ai montanti e salti il piolo che manca senza guardare
            la corda. In fondo l'acqua gelata ti arriva alla caviglia, e ti scappa
            un'imprecazione a mezza voce.
          effetti: { profondita.maison-sotto-il-cristallo-spento: 1 }
        fallimento:
          titolo: Il piolo di spugna
          testo: |
            Al sesto piolo il legno ti si sbriciola sotto lo stivale e finisci
            seduto nell'acqua gelata, con un fianco che pulsa.
          effetti: { profondita.maison-sotto-il-cristallo-spento: 1, ferite: 0.5 }
      - testo: "Calarti con la corda della legnaia"
        descrizione: "Kanat ti ha lasciato una corda in cima al pozzo, da legare alla botte giusta."
        prova: { attributo: mentale, abilita: [percezione, tecnologia], difficolta: Facile }
        successo:
          titolo: La botte giusta
          testo: |
            Leghi la corda alla botte di quercia più piena della cantina e ti cali
            con le gambe contro la parete. In fondo lasci la corda appesa, per il
            ritorno.
          effetti: { profondita.maison-sotto-il-cristallo-spento: 1 }
        fallimento:
          titolo: La botte vuota
          testo: |
            La botte a cui hai legato la corda è vuota, e a metà discesa la senti
            strisciare sopra di te. Ti aggrappi alla scala in tempo e scendi il
            resto a pioli, con una scheggia nel palmo.
          effetti: { ferite: 0.5 }
      - testo: "Scendere piano, piolo per piolo, provando ognuno"
        descrizione: "Ci vuole tempo, e un piolo marcio te lo trovi comunque sotto il piede."
        costo: 2
        esito:
          titolo: Un piolo alla volta
          testo: |
            Provi ogni piolo con il tallone, e quando uno cede hai già le mani al
            montante. Arrivi in fondo con il triplo del tempo e le dita
            scorticate.
          effetti: { profondita.maison-sotto-il-cristallo-spento: 1, ferite: 0.5 }

  # ------------------------------------------------------------ 0 · la cantina dei vini di Gretchen
  - id: maison-cristallo-la-cantina-di-gretchen
    immagine: ambientazione/maison-des-lunes
    titolo: La cantina dei vini
    sommario: "In fondo alla cantina una porticina di ferro dà sulla condotta, con un lucchetto che non è della casa."
    luogo: Sotto la Maison, la cantina dei vini
    area: maison-sotto-il-cristallo-spento
    ripetibile: true
    requisiti: [fazione.maison == 7, profondita.maison-sotto-il-cristallo-spento == 0]
    testo: |
      Nella cantina bassa le bottiglie riposano nella sabbia, ciascuna col
      cartellino nella grafia rotonda di Gretchen. Dietro l'ultima botte una
      porticina di ferro dà sulla condotta, con un lucchetto nuovo, e accanto
      c'è un mozzicone di candela con un pezzo di pane secco morsicato.

      {percezione Media} Le impronte nella polvere vanno dalla porticina alla
      scala e tornano, sempre le stesse scarpe a punta stretta.
    opzioni:
      - testo: "Forzare il lucchetto"
        descrizione: "Un lucchetto nuovo e lucido si apre con un ferro sottile e un po' di pazienza."
        prova: { attributo: fisico, abilita: [furtivita, tecnologia], difficolta: Media }
        successo:
          titolo: Il lucchetto lucido
          testo: |
            Con un ferro da calza prestato da Gretchen il lucchetto si apre in
            pochi minuti, e la porticina gira senza un suono sui cardini unti.
          effetti: { profondita.maison-sotto-il-cristallo-spento: 1 }
        fallimento:
          titolo: Il ferro da calza
          testo: |
            Il ferro da calza si piega dentro il lucchetto e non ne esce più. Ci
            perdi mezz'ora e un'unghia, e dovrai passare dalla scala del pozzo.
          effetti: { ferite: 0.5 }
      - testo: "Tornare su a chiedere a Gretchen la mazza di Kanat"
        descrizione: "Fa rumore, e chi sta sotto lo sentirà."
        costo: 2
        esito:
          titolo: La mazza
          testo: |
            Kanat apre il lucchetto con un colpo solo di mazza, e il rimbombo
            corre lungo tutta la condotta. Ti guarda come per chiederti scusa.
          effetti: { profondita.maison-sotto-il-cristallo-spento: 1, ferite: 0.5 }
      - testo: "Aspettare che torni chi ha lasciato il pane"
        descrizione: "Chi ha mangiato qui tornerà, e da dietro una botte potresti vedere da dove arriva."
        prova: { attributo: fisico, abilita: [furtivita, resistenza], difficolta: Media }
        successo:
          titolo: Le scarpe a punta
          testo: |
            Dopo un'ora entra un ragazzo con un sacchetto di pane, guarda a lungo la scala
            e se ne torna indietro lasciando il lucchetto aperto. Lo segui a dieci passi,
            nel buio.
          effetti: { profondita.maison-sotto-il-cristallo-spento: 1 }
        fallimento:
          titolo: Il gatto
          testo: |
            Aspetti finché le gambe ti si addormentano, e viene soltanto il gatto
            della cucina a sedersi sui tuoi piedi. Il lucchetto resta chiuso.
          effetti: { ferite: 0.5 }

  # ------------------------------------------------------------ 1 · l'acqua alla cintura
  - id: maison-cristallo-l-acqua-alla-cintura
    immagine: ambientazione/citta-bassa
    titolo: L'acqua alla cintura
    sommario: "Dove la condotta scende l'acqua sale, e dall'altra parte qualcosa raspa sui mattoni."
    luogo: La condotta, il tratto basso
    area: maison-sotto-il-cristallo-spento
    ripetibile: true
    requisiti: [fazione.maison == 7, profondita.maison-sotto-il-cristallo-spento == 1]
    testo: |
      La condotta scende, e il rigagnolo diventa una pozza nera lunga venti
      passi che ti arriva alla cintura. Dall'altra parte, dove il fondo
      risale, qualcosa si muove sui mattoni con un rumore di unghie.

      {natura Media} Sono topi grossi, di quelli dei mercati, e non
      attaccano chi cammina ma uno che nuota sì.
    opzioni:
      - testo: "Attraversare a passo svelto"
        descrizione: "Venti passi nell'acqua gelata, con la lanterna alta."
        prova: { attributo: fisico, abilita: [resistenza, atletica], difficolta: Media }
        successo:
          titolo: Venti passi
          testo: |
            Attraversi senza fermarti con la lanterna sopra la testa, e i topi si
            scostano offesi. Dall'altra parte strofini le gambe finché non tornano
            tue.
          effetti: { profondita.maison-sotto-il-cristallo-spento: 1 }
        fallimento:
          titolo: Il fondo che scivola
          testo: |
            A metà pozza il fondo ti scivola sotto i piedi e vai giù fino al
            collo. Torni indietro sputando acqua nera, con i topi che ti guardano
            come un vicino rumoroso.
          effetti: { ferite: 0.5 }
      - testo: "Spaventare i topi e passare lungo il bordo"
        descrizione: "Lungo la parete corre una cornice di mattoni larga una spanna."
        prova: { attributo: sociale, abilita: [addestrare-animali, intimidire], difficolta: Media }
        successo:
          titolo: La cornice
          testo: |
            Batti la lanterna contro i mattoni e lanci un sasso, e i topi
            spariscono in una fessura. Passi lungo la cornice con la schiena alla
            parete, bagnandoti appena gli stivali.
          effetti: { profondita.maison-sotto-il-cristallo-spento: 1 }
        fallimento:
          titolo: Il topo coraggioso
          testo: |
            Un topo grosso come un gatto resta sulla cornice e ti morde la
            caviglia attraverso lo stivale, e per non schiacciarlo finisci
            nell'acqua fino alla cintura.
          effetti: { ferite: 0.5 }
      - testo: "Aspettare che i topi se ne vadano, poi passare con calma"
        descrizione: "Prima o poi i topi hanno fame altrove, e l'acqua resta fredda."
        costo: 2
        esito:
          titolo: La pazienza
          testo: |
            Aspetti finché il rumore di unghie si allontana e attraversi piano, e
            dall'altra parte i piedi formicolano a lungo prima di tornare tuoi.
          effetti: { profondita.maison-sotto-il-cristallo-spento: 1, ferite: 0.5 }

  # ------------------------------------------------------------ 1-2 · il bivio col gesso
  - id: maison-cristallo-il-bivio-col-gesso
    immagine: fazioni/scuri
    titolo: Il bivio col gesso
    sommario: "La condotta si divide in tre, e su ogni imbocco c'è un segno col gesso."
    luogo: La condotta, il bivio
    area: maison-sotto-il-cristallo-spento
    ripetibile: true
    requisiti: [fazione.maison == 7, profondita.maison-sotto-il-cristallo-spento >= 1, profondita.maison-sotto-il-cristallo-spento <= 2]
    testo: |
      In una camera rotonda la condotta si divide in tre gallerie, e sopra ogni arco c'è un segno di gesso. A
      sinistra c'è una mano aperta, al centro una spirale e a destra un triangolo con un punto nel mezzo, e per
      terra un mozzicone di sigaro ancora umido.

      {conoscenze-della-strada Media} Sono i segni degli Scuri, con cui i ragazzi di Mauro si dicono dove si
      passa, e la mano aperta è una strada sicura.

      {origine figlio-della-citta-bassa} Il triangolo con il punto lo disegnavano anche sui muri del tuo
      vicolo, e la sera tua madre ti faceva passare dall'altra parte.
    opzioni:
      - testo: "Leggere i segni"
        descrizione: "Segni tracciati da chi usa la strada, per chi li sa leggere."
        prova: { attributo: sociale, abilita: [conoscenze-della-strada, percezione], difficolta: Media }
        successo:
          titolo: La mano aperta
          testo: |
            La galleria della mano aperta ha lo stesso segno ogni cinquanta passi,
            come i paletti di una strada di campagna. Più avanti scopri che il
            triangolo segnava una botola sfondata sul vuoto.
          effetti: { profondita.maison-sotto-il-cristallo-spento: 1 }
        fallimento:
          titolo: La spirale
          testo: |
            Prendi la spirale, che ti sembrava la più asciutta, e dopo cento passi
            finisci contro un muro di mattoni nuovi.
          effetti: { tormento: 1 }
      - testo: "Seguire l'odore del sigaro"
        descrizione: "Il mozzicone è ancora umido, e il fumo resta nelle gallerie."
        prova: { attributo: mentale, abilita: [percezione, natura], difficolta: Media }
        successo:
          titolo: Il fumo
          testo: |
            Dall'imbocco con la mano aperta arriva un filo di tabacco dolce, e lo
            segui finché il fumo si confonde con l'umidità e la galleria è rimasta
            una sola.
          effetti: { profondita.maison-sotto-il-cristallo-spento: 1 }
        fallimento:
          titolo: Il naso che si arrende
          testo: |
            Il naso, pieno di muffa, ti dice che le tre gallerie sanno tutte
            uguali. Prendi quella di sinistra e torni dopo un'ora con gli stivali
            pieni d'acqua.
          effetti: { ferite: 0.5 }
      - testo: "Provarle tutte e tre"
        descrizione: "Una alla volta, fino in fondo."
        costo: 2
        esito:
          titolo: Tutte e tre
          testo: |
            La spirale finisce contro un muro, e il triangolo porta a una botola
            sfondata che la lanterna ti mostra quando ci hai già un piede dentro.
            La mano aperta è l'ultima, ed è quella buona.
          effetti: { profondita.maison-sotto-il-cristallo-spento: 1, ferite: 0.5 }

  # ------------------------------------------------------------ 1-2 · la stanza dismessa
  - id: maison-cristallo-la-stanza-dismessa
    immagine: ambientazione/mercato-delle-ombre
    titolo: La stanza dismessa
    sommario: "Una stanza scavata accanto alla condotta, con i banchi vuoti e una luce verdognola in un angolo."
    luogo: La condotta, una stanza laterale
    area: maison-sotto-il-cristallo-spento
    ripetibile: true
    requisiti: [fazione.maison == 7, profondita.maison-sotto-il-cristallo-spento >= 1, profondita.maison-sotto-il-cristallo-spento <= 2]
    testo: |
      In una stanza scavata nella roccia accanto alla condotta restano i banchi
      di legno vuoti del Mercato delle Ombre, che anni fa ci ha passato qualche
      mese. In un angolo, incastrato fra due pietre, un cristallo conduttore
      grande come un uovo manda una luce verdognola.
    opzioni:
      - testo: "Prendere il cristallo dimenticato"
        descrizione: "Un cristallo carico senza timbro della Gilda, che nessuno verrà più a cercare."
        quando: [maison.dimenticato == 0]
        prova: { attributo: mentale, abilita: [tecnologia, magia], difficolta: Media }
        successo:
          titolo: La luce verde
          testo: |
            Lo sfili dalle pietre girandolo piano, come si toglie un dente. È
            carico e caldo come un sasso al sole, e lo avvolgi nel fazzoletto in
            fondo alla bisaccia.
          imposta: { maison.dimenticato: 1 }
          effetti: { profondita.maison-sotto-il-cristallo-spento: 1, cristalli.cristallo-carico: 1 }
        fallimento:
          titolo: La scossa
          testo: |
            Lo tocchi con le dita nude e il cristallo ti restituisce il favore con
            una scossa che arriva al gomito, restando incastrato fra le pietre.
          effetti: { tormento: 1 }
      - testo: "Attraversare la stanza e cercare l'altra uscita"
        descrizione: "Un mercato ha sempre due uscite, e la seconda di solito è quella buona."
        prova: { attributo: mentale, abilita: [percezione, conoscenze-della-strada], difficolta: Media }
        successo:
          titolo: La seconda uscita
          testo: |
            Dietro una tenda marcita in fondo alla stanza, un passaggio stretto
            rientra nella condotta più avanti, oltre un tratto crollato.
          effetti: { profondita.maison-sotto-il-cristallo-spento: 1 }
        fallimento:
          titolo: La tenda
          testo: |
            Dietro la tenda marcita c'è un muro, e scostandola ti piove addosso la
            polvere di anni. Esci tossendo da dove sei entrato.
          effetti: { ferite: 0.5 }
      - testo: "Tornare nella condotta e girarle intorno"
        descrizione: "La condotta prosegue anche senza la stanza."
        costo: 2
        esito:
          titolo: Il giro
          testo: |
            Oltre la stanza la condotta è crollata, e scavalchi i mattoni bagnati
            a quattro zampe, scorticandoti i gomiti.
          effetti: { profondita.maison-sotto-il-cristallo-spento: 1, ferite: 0.5 }

  # ------------------------------------------------------------ 2 · il tombino sotto la lanterna
  - id: maison-cristallo-il-tombino
    immagine: ambientazione/maison-des-lunes
    titolo: Il tombino
    sommario: "Da un tombino nella volta scende la luce color miele della lanterna della Maison."
    luogo: La condotta, sotto Via dei Rasoi
    area: maison-sotto-il-cristallo-spento
    ripetibile: true
    requisiti: [fazione.maison == 7, profondita.maison-sotto-il-cristallo-spento == 2]
    testo: |
      Dalle feritoie di un tombino di ghisa nella volta scende la luce color
      miele della lanterna della Maison, e da Via dei Rasoi arriva la voce di
      Churl che dice di no a qualcuno. Sulla parete sotto il tombino ci sono
      segni di gesso contati a gruppi di cinque, come i giorni in una cella.

      {furtivita Media} Da qui si guarda la porta della Maison senza essere
      visti, perché nessuno guarda mai per terra.
    opzioni:
      - testo: "Orientarti dalla luce della lanterna"
        descrizione: "La strada sotto la strada è la stessa che conosci di sopra."
        prova: { attributo: mentale, abilita: [percezione, conoscenze-della-strada], difficolta: Media }
        successo:
          titolo: Il gomito della strada
          testo: |
            Conti i passi dalla porta della Maison al gomito di Via dei Rasoi come li
            conti di sopra, quaranta passi lunghi. Dalle feritoie di un altro tombino
            vedi la base del cristallo spento, nera contro il cielo.
          effetti: { profondita.maison-sotto-il-cristallo-spento: 1 }
        fallimento:
          titolo: Il passo corto
          testo: |
            Qui sotto il tuo passo è più corto, e dal tombino successivo vedi la
            vetrina del fornaio invece del cristallo spento.
          effetti: { tormento: 1 }
      - testo: "Contare i segni di gesso"
        descrizione: "Chi ha passato qui le sue sere ha lasciato il conto, e il conto dice qualcosa di lui."
        prova: { attributo: mentale, abilita: [politica-ed-economia, percezione], difficolta: Media }
        successo:
          titolo: Il conto delle sere
          testo: |
            Sono più di trecento sere, con una piccola croce ogni giovedì. Accanto
            all'ultimo gruppo una freccia di gesso indica la galleria verso il
            cristallo spento, dove chi contava è andato a sedersi più in là.
          effetti: { profondita.maison-sotto-il-cristallo-spento: 1 }
        fallimento:
          titolo: Troppi segni
          testo: |
            A metà conto salti una fila e ricominci, finché la lanterna comincia a
            tremare e senti che qualcuno, di sopra, ha guardato nel tombino.
          effetti: { sospetto: 1 }
      - testo: "Andare avanti a tentoni, verso il gomito della strada"
        descrizione: "Prima o poi la condotta arriva sotto il cristallo spento."
        costo: 2
        esito:
          titolo: A tentoni
          testo: |
            Vai avanti con la mano sulla parete sotto i tombini di Via dei Rasoi,
            e sbatti la fronte contro un tubo di piombo che sporge dalla volta.
          effetti: { profondita.maison-sotto-il-cristallo-spento: 1, ferite: 0.5 }

  # ------------------------------------------------------------ 2-3 · le guardie
  - id: maison-cristallo-le-guardie
    immagine: fazioni/scuri
    titolo: Le guardie
    sommario: "Dove la condotta si stringe, due uomini giocano a dadi su una cassa rovesciata."
    luogo: La condotta, la strettoia
    area: maison-sotto-il-cristallo-spento
    ripetibile: true
    requisiti: [fazione.maison == 7, profondita.maison-sotto-il-cristallo-spento >= 2, profondita.maison-sotto-il-cristallo-spento <= 3]
    testo: |
      Nella strettoia due uomini giocano a dadi su una cassa rovesciata, con una
      candela in mezzo, uno con un coltello sul ginocchio e l'altro con un piede
      di porco contro la parete. Dietro di loro la galleria prosegue verso una
      porta di legno.

      {rissa Media} Quello col coltello ha il peso sulla gamba sbagliata, mentre
      l'altro ha già guardato due volte nella tua direzione.
    opzioni:
      - testo: "Affrontarli"
        descrizione: "Due ragazzi di Mauro, in una strettoia dove ne passa uno alla volta."
        quando: [pista.pelle < 6]
        combattimento: maison-la-condotta-prima
        vittoria:
          titolo: La strettoia
          testo: |
            Nella strettoia possono venirti addosso uno alla volta, e uno alla
            volta li metti giù. Il primo scappa verso la Pignatta e il secondo
            resta contro il muro a tenersi il braccio.
          effetti: { profondita.maison-sotto-il-cristallo-spento: 1, rep.scuri: -0.5 }
        sconfitta:
          titolo: Il piede di porco
          testo: |
            Il piede di porco ti arriva sul fianco mentre guardi il coltello. Ti
            trascini indietro nell'acqua, e loro non ti inseguono.
          effetti: { ferite: 1 }
      - testo: "Affrontarli"
        descrizione: "Due ladri di ferro, in una strettoia dove ne passa uno alla volta."
        quando: [pista.pelle >= 6]
        combattimento: maison-la-condotta-dopo
        vittoria:
          titolo: La strettoia
          testo: |
            Nella strettoia possono venirti addosso uno alla volta, e uno alla
            volta li metti giù. Il secondo, contro il muro, ti giura che la grata
            del Ponte del Pesce non l'ha presa lui.
          effetti: { profondita.maison-sotto-il-cristallo-spento: 1 }
        sconfitta:
          titolo: Il piede di porco
          testo: |
            Il piede di porco ti arriva sul fianco mentre guardi il coltello. Ti
            trascini indietro nell'acqua, e loro non ti inseguono.
          effetti: { ferite: 1 }
      - testo: "Convincerli che stanotte non conviene"
        descrizione: "Pagati poco e al freddo, con le parole giuste se ne vanno a casa."
        quando: [maison.cristallo != 1]
        prova: { attributo: sociale, abilita: [persuasione, intimidire], difficolta: Media }
        successo:
          titolo: La cena calda
          testo: |
            Gli chiedi se li pagano abbastanza per una coltellata, poi gli compri
            i dadi per qualche moneta, e vanno a mangiare una cosa calda
            dall'altra parte della città.
          effetti: { profondita.maison-sotto-il-cristallo-spento: 1, monete: -2 }
        fallimento:
          titolo: I dadi
          testo: |
            Quello col piede di porco ti dice che li pagano proprio per non
            sentire domande, e ti spinge fuori dalla luce con la punta del ferro
            sul petto.
          effetti: { ferite: 0.5 }
      - testo: "Convincerli che stanotte non conviene"
        descrizione: "Chi ascoltava dalla lampada sa che la Maison se n'è accorta, e i due hanno l'ordine di non muoversi."
        quando: [maison.cristallo == 1]
        prova: { attributo: sociale, abilita: [persuasione, intimidire], difficolta: Difficile }
        successo:
          titolo: La cena calda
          testo: |
            Gli dici che se arriva Kanat li paga lui, con la mazza. Gli compri i
            dadi per qualche moneta, e vanno a mangiare una cosa calda dall'altra
            parte della città.
          effetti: { profondita.maison-sotto-il-cristallo-spento: 1, monete: -2 }
        fallimento:
          titolo: L'ordine
          testo: |
            Stanotte hanno l'ordine di tenere chiusa la strettoia, perché la
            Maison sa. Ti spingono indietro, e inciampando batti il gomito sulla
            parete.
          effetti: { ferite: 0.5 }
      - testo: "Aspettare che finiscano il turno"
        descrizione: "Prima o poi la candela finisce."
        costo: 2
        esito:
          titolo: La candela finita
          testo: |
            Aspetti nel buio, con l'acqua alle caviglie, finché la candela si
            consuma e i due vanno a cercarne un'altra. Passi la strettoia con le
            gambe che non senti più.
          effetti: { profondita.maison-sotto-il-cristallo-spento: 1, ferite: 0.5 }

  # ------------------------------------------------------------ 3 · la grata della Pignatta
  - id: maison-cristallo-la-grata-della-pignatta
    immagine: ambientazione/pignatta-grassa
    titolo: La grata della Pignatta
    sommario: "Una galleria laterale sale verso una grata, e dalla grata arriva un odore che conosci."
    luogo: La condotta, la galleria della Pignatta
    area: maison-sotto-il-cristallo-spento
    ripetibile: true
    requisiti: [fazione.maison == 7, profondita.maison-sotto-il-cristallo-spento == 3]
    testo: |
      Una galleria laterale sale per gradini consumati fino a una grata di
      ferro sul fondo di una cantina, da cui arriva l'odore della cenere
      bagnata che resta di una taverna bruciata. È la Pignatta, mentre la
      condotta principale prosegue dritta verso il cristallo spento.

      {conoscenze-della-strada Facile} Ecco come salivano i ragazzi di Mauro
      fino in Via dei Rasoi senza farsi vedere, per la stessa strada
      dell'orecchio.
    opzioni:
      - testo: "Tirare dritto senza salire"
        descrizione: "Il cristallo spento è più avanti."
        prova: { attributo: mentale, abilita: [resilienza, percezione], difficolta: Media }
        successo:
          titolo: Dritto
          testo: |
            Tiri dritto senza guardare la grata, e dopo trenta passi l'odore della
            Pignatta si perde nell'umido. In fondo alla galleria c'è una porta di
            legno con uno spiraglio di luce sotto, e una voce bassa che detta a se
            stessa.
          effetti: { profondita.maison-sotto-il-cristallo-spento: 1 }
        fallimento:
          titolo: La grata
          testo: |
            Sali fino alla grata senza volerlo davvero e resti a guardare la
            cantina, e torni con le dita rosse di ruggine.
          effetti: { tormento: 1 }
      - testo: "Bloccare la grata perché nessuno scenda alle tue spalle"
        descrizione: "Una trave e due mattoni, e chi scende dalla Pignatta dovrà fare rumore."
        prova: { attributo: fisico, abilita: [atletica, tecnologia], difficolta: Media }
        successo:
          titolo: La trave
          testo: |
            Incastri una trave marcia fra la grata e il gradino e la fermi con due
            mattoni. Adesso la grata non si apre senza fracasso, e torni nella
            condotta più tranquillo.
          effetti: { profondita.maison-sotto-il-cristallo-spento: 1 }
        fallimento:
          titolo: La trave marcia
          testo: |
            La trave ti si spezza fra le mani e i due mattoni ti cadono sul piede,
            così torni indietro zoppicando.
          effetti: { ferite: 0.5 }
      - testo: "Passare oltre di corsa, a testa bassa"
        descrizione: "Più svelto passi, meno ricordi da portarti a casa."
        costo: 2
        esito:
          titolo: A testa bassa
          testo: |
            Corri oltre la galleria della Pignatta a testa bassa, scivolando due
            volte, fino alla porta di legno con lo spiraglio di luce.
          effetti: { profondita.maison-sotto-il-cristallo-spento: 1, ferite: 0.5 }

  # ------------------------------------------------------------ 3 · le voci nel muro
  - id: maison-cristallo-le-voci-nel-muro
    immagine: ambientazione/cristalli-conduttori
    titolo: Le voci nel muro
    sommario: "In un tratto della condotta i mattoni parlano con le voci del salone."
    luogo: La condotta, sotto il cristallo spento
    area: maison-sotto-il-cristallo-spento
    ripetibile: true
    requisiti: [fazione.maison == 7, profondita.maison-sotto-il-cristallo-spento == 3]
    testo: |
      Dove la volta si abbassa i mattoni parlano a voce bassa, e riconosci
      la risata di Kasja e un cliente che chiede dove si mettono gli
      stivali. Lungo la parete corre un filo di rame fissato con chiodini,
      che sparisce in un foro verso il basso.

      {tecnologia Media} I chiodini sono di ottone, quelli degli accordatori
      di cristalli, e in città li vendono soltanto due botteghe.
    opzioni:
      - testo: "Seguire il filo di rame"
        descrizione: "Un filo che va in un posto preciso."
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Media }
        successo:
          titolo: Il filo
          testo: |
            Segui il filo chiodino dopo chiodino, finché entra sotto una porta di
            legno da cui escono una luce di candela e la voce di un uomo che detta
            piano a se stesso i nomi che arrivano dal muro.
          effetti: { profondita.maison-sotto-il-cristallo-spento: 1 }
        fallimento:
          titolo: Il chiodino
          testo: |
            Il filo si sdoppia, e segui il ramo sbagliato fino a una crepa dove il
            rame è stato rubato. Tornando ti ferisci il pollice su un chiodino.
          effetti: { ferite: 0.5 }
      - testo: "Ascoltare le voci per capire da dove vengono"
        descrizione: "Un orecchio buono sente anche da dove vengono le voci, e dove vanno."
        prova: { attributo: mentale, abilita: [magia, resilienza], difficolta: Media }
        successo:
          titolo: La direzione
          testo: |
            Con l'orecchio ai mattoni senti le voci del salone scendere sempre
            nella stessa direzione, come acqua in un canale, e raccogliersi dietro
            una porta di legno dove qualcuno le sta scrivendo.
          effetti: { profondita.maison-sotto-il-cristallo-spento: 1 }
        fallimento:
          titolo: Le voci di troppo
          testo: |
            Ascolti troppo a lungo, e fra le voci del salone ti sembra di sentire
            anche la tua. Ti stacchi dal muro con un brivido e prendi la direzione
            sbagliata.
          effetti: { tormento: 1 }
      - testo: "Tirare dritto con le mani sulle orecchie"
        descrizione: "Ti serve la porta in fondo, non le voci."
        costo: 2
        esito:
          titolo: Le orecchie tappate
          testo: |
            Con le mani sulle orecchie non vedi il gradino, e arrivi alla porta di
            legno con un ginocchio sbucciato e la risata di Kasja ancora in testa.
          effetti: { profondita.maison-sotto-il-cristallo-spento: 1, ferite: 0.5 }

  # ------------------------------------------------------------ il cuore · la camera d'ascolto
  - id: maison-cristallo-la-camera-d-ascolto
    immagine: ambientazione/cristalli-conduttori
    titolo: La camera d'ascolto
    sommario: "Ai piedi del cristallo spento un uomo scrive, accanto a un leggio d'ottone, quello che sente."
    luogo: Sotto il cristallo spento, la camera d'ascolto
    area: maison-sotto-il-cristallo-spento
    requisiti: [fazione.maison == 7, profondita.maison-sotto-il-cristallo-spento >= 4]
    testo: |
      Dietro la porta c'è una stanza di pietra proprio sotto il cristallo
      spento, le cui radici scendono dalla volta in una colonna nera. Attorno
      alla colonna è montato un leggio d'ottone con un cristallo gemello di
      quelli della Maison, legato al filo di rame, e accanto un quaderno blu
      aperto. Due sgherri dormono contro il muro con le armi sulle ginocchia.

      L'uomo al leggio è magro, con gli occhiali legati allo spago e le dita
      grigie di polvere di cristallo. Quando la porta cigola alza la penna ma
      non la posa.

      {magia Media} Il cristallo è accordato a mano, con una cura da
      orologiaio, da uno che conosce il Mana come pochi e non lo usa per
      difendersi.

      {origine allievo-di-torvessa} All'Accademia si racconta ancora di un
      certo Rell con gli occhiali legati allo spago, che accordava i
      cristalli meglio dei maestri e non si presentò agli esami perché i
      creditori lo aspettavano sulla porta.

      «Sono il miglior accordatore della Città Bassa» dice. «Mi pagano a
      settimana. Se mi porti via il quaderno, la settimana prossima mi pagano
      per un altro.» Gli sgherri si svegliano.
    opzioni:
      - testo: "Affrontarli"
        descrizione: "Bastiano con il Mana e due ragazzi di Mauro, prima che scappi con il gemello."
        quando: [pista.pelle < 6]
        combattimento: maison-la-camera-d-ascolto-prima
        vittoria:
          titolo: Il leggio rovesciato
          testo: |
            Gli sgherri scappano verso la Pignatta, e Bastiano prova a seguirli
            con il gemello stretto al petto, ma lo prendi per il colletto sulla
            porta. Raccogli il quaderno blu senza leggerlo e lo riporti su legato
            con la sua stessa cintura.
          pe: { armi-da-mischia: 10 }
          imposta: { maison.scrivano: 5 }
          effetti: { rep.maison: 1, rep.scuri: -1, monete: 30, fazione.maison: 1 }
          vai: citta-bassa
        sconfitta:
          titolo: Il gemello
          testo: |
            Il Mana di Bastiano ti arriva in faccia come sabbia gelata, e quando ti rialzi lui è sparito per
            una galleria con il gemello. Il quaderno blu è rimasto sul pavimento, e torni su con le costole che
            fanno male.
          imposta: { maison.scrivano: 3 }
          effetti: { ferite: 1.5, fazione.maison: 1 }
          vai: citta-bassa
      - testo: "Affrontarli"
        descrizione: "Bastiano con il Mana e due ladri di ferro, prima che scappi con il gemello."
        quando: [pista.pelle >= 6]
        combattimento: maison-la-camera-d-ascolto-dopo
        vittoria:
          titolo: Il leggio rovesciato
          testo: |
            I ladri di ferro scappano per la galleria della Pignatta, e Bastiano
            prova a seguirli con il gemello stretto al petto, ma lo prendi per il
            colletto sulla porta. Raccogli il quaderno blu senza leggerlo e lo
            riporti su legato con la sua stessa cintura.
          pe: { armi-da-mischia: 10 }
          imposta: { maison.scrivano: 5 }
          effetti: { rep.maison: 1, monete: 30, fazione.maison: 1 }
          vai: citta-bassa
        sconfitta:
          titolo: Il gemello
          testo: |
            Il Mana di Bastiano ti arriva in faccia come sabbia gelata, e quando ti rialzi lui è sparito per una
            galleria con il gemello. Il quaderno blu è rimasto sul pavimento, e torni su con le costole che
            fanno male.
          imposta: { maison.scrivano: 3 }
          effetti: { ferite: 1.5, fazione.maison: 1 }
          vai: citta-bassa
      - testo: "Parlargli dei suoi debiti"
        descrizione: "Un uomo pagato a settimana ha più paura dei creditori che di te."
        prova: { attributo: sociale, abilita: [persuasione, empatia], difficolta: Difficile }
        successo:
          titolo: La via d'uscita
          testo: |
            Gli dici che chi lo paga a settimana lo lascerà ai creditori il giorno
            che non servirà più, mentre la signora della Maison i debiti li paga
            di persona. Bastiano ti porge il quaderno, gli sgherri se ne vanno, e
            lui ti segue su per la condotta con il gemello in tasca.
          pe: { persuasione: 10 }
          imposta: { maison.scrivano: 5 }
          effetti: { rep.maison: 1, monete: 30, fazione.maison: 1 }
          vai: citta-bassa
        fallimento:
          titolo: Il creditore peggiore
          testo: |
            Bastiano ride piano e ti dice che il creditore peggiore è quello che
            lo paga adesso. Il suo Mana ti arriva addosso come una folata gelata,
            e quando la stanza smette di girare lui è sparito con il gemello,
            lasciando cadere il quaderno blu.
          imposta: { maison.scrivano: 3 }
          effetti: { ferite: 1.5, fazione.maison: 1 }
          vai: citta-bassa
      - testo: "Chiamare Kanat giù dalla legnaia"
        descrizione: "Un fischio nella condotta, e Kanat scende, ma Kanat rompe facilmente le cose."
        prova: { attributo: sociale, abilita: [intimidire, persuasione], difficolta: Difficile }
        successo:
          titolo: Kanat sulla porta
          testo: |
            Kanat riempie la porta a torso nudo, con la mazza in mano, e gli
            sgherri posano le armi senza che nessuno glielo chieda. Bastiano ti
            porge il quaderno con tutte e due le mani, e uscendo Kanat urta il
            leggio d'ottone con la spalla e lo piega in due.
          pe: { intimidire: 10 }
          imposta: { maison.scrivano: 5 }
          effetti: { rep.maison: 0.5, monete: 30, fazione.maison: 1 }
          vai: citta-bassa
        fallimento:
          titolo: Il fischio a vuoto
          testo: |
            Kanat arriva tardi dalla galleria sbagliata, e quando mette in fuga
            gli sgherri Bastiano è già sparito con il gemello. Restano il quaderno
            blu per terra e il leggio piegato sotto il tuo gomito.
          imposta: { maison.scrivano: 3 }
          effetti: { ferite: 1.5, rep.maison: -0.5, fazione.maison: 1 }
          vai: citta-bassa
      - testo: "Fargli sentire la sera del signor Pace"
        descrizione: "Il cristallo gli porta ancora le voci della recita, e crede la Maison all'oscuro di tutto."
        quando: [maison.cristallo == 2]
        prova: { attributo: sociale, abilita: [ingannare, espressivita], difficolta: Difficile }
        successo:
          titolo: La sera che non c'è stata
          testo: |
            Gli dici che ti manda chi lo paga, a ritirare il quaderno della
            settimana, mentre dal cristallo arriva la risata di Kasja. Bastiano ti
            porge il quaderno lamentandosi della paga, e quando capisce gli
            sgherri sono già a terra e lui ha i polsi legati con lo spago dei suoi
            occhiali.
          pe: { ingannare: 10 }
          imposta: { maison.scrivano: 5 }
          effetti: { rep.maison: 1, monete: 30, fazione.maison: 1 }
          vai: citta-bassa
        fallimento:
          titolo: La risata sbagliata
          testo: |
            Bastiano ti chiede come si chiama il suo padrone, e tu esiti. Il suo
            Mana ti arriva in faccia come una folata gelata, e quando la stanza
            smette di girare lui è sparito con il gemello e con il quaderno.
          imposta: { maison.scrivano: 3 }
          effetti: { ferite: 1.5, fazione.maison: 1 }
          vai: citta-bassa
      - testo: "Parlargli con la Voce di seta"
        descrizione: "Il Mana sotto le parole, a uno che il Mana lo sente e forse per questo ascolterà."
        incantesimo: maison-voce-di-seta
        prova: { attributo: mentale, abilita: magia, difficolta: Difficile }
        successo:
          titolo: La voce
          testo: |
            Gli dici piano che i creditori gli hanno rubato gli anni migliori e
            che vorrebbe tanto dormire. Bastiano posa la penna e ti porge il
            quaderno come se fosse un'idea sua, e gli sgherri, vedendolo
            arrendersi, se ne vanno.
          pe: { magia: 10 }
          imposta: { maison.scrivano: 5 }
          effetti: { rep.maison: 1, monete: 30, fazione.maison: 1 }
          vai: citta-bassa
        fallimento:
          titolo: Un accordatore
          testo: |
            Bastiano sente il tuo Mana stonato prima che tu finisca la frase e ti
            risponde con il suo. Quando la stanza smette di girare è sparito con
            il gemello, lasciando cadere il quaderno blu.
          imposta: { maison.scrivano: 3 }
          effetti: { ferite: 1.5, fazione.maison: 1 }
          vai: citta-bassa
      - testo: "Chiamarlo per cognome, come all'Accademia"
        descrizione: "All'Accademia si parla ancora di Rell, e chi viene da Torvessa può dirgli quello che nessun altro può."
        quando: [origine.allievo-di-torvessa >= 1]
        prova: { attributo: sociale, abilita: [persuasione, accademiche], difficolta: Difficile }
        successo:
          titolo: Il laboratorio
          testo: |
            Lo chiami Rell come facevano i maestri e gli ricordi il cristallo
            accordato per l'esame che non ha mai dato. Lui si pulisce a lungo gli
            occhiali sulla camicia e ti porge il quaderno, e gli sgherri se ne
            vanno mentre lui ti segue su per la condotta con il gemello in tasca.
          pe: { persuasione: 10 }
          imposta: { maison.scrivano: 5 }
          effetti: { rep.maison: 1, monete: 30, fazione.maison: 1 }
          vai: citta-bassa
        fallimento:
          titolo: Il creditore peggiore
          testo: |
            Lo chiami Rell, e lui diventa rosso fino alle orecchie perché
            all'Accademia nessuno gli ha mai prestato una moneta. Il suo Mana ti
            arriva addosso come una folata gelata, e quando la stanza smette di
            girare è sparito con il gemello, lasciando cadere il quaderno blu.
          imposta: { maison.scrivano: 3 }
          effetti: { ferite: 1.5, fazione.maison: 1 }
          vai: citta-bassa
      - testo: "Dirgli il nome del suo creditore"
        descrizione: "In Città Bassa prestano soldi in pochi, e tu sai chi."
        quando: [origine.figlio-della-citta-bassa >= 1]
        prova: { attributo: sociale, abilita: [conoscenze-della-strada, persuasione], difficolta: Difficile }
        successo:
          titolo: Il nome giusto
          testo: |
            Gli dici il nome dell'usuraio di Via del Salmone, quello che presta ai
            cartolai e agli studenti, e Bastiano sbianca. Con quell'uomo un debito
            si chiude in un modo solo, e la signora della Maison sa chiuderlo in
            un altro. Ti porge il quaderno, e gli sgherri se ne vanno.
          pe: { persuasione: 10 }
          imposta: { maison.scrivano: 5 }
          effetti: { rep.maison: 1, monete: 30, fazione.maison: 1 }
          vai: citta-bassa
        fallimento:
          titolo: Il creditore peggiore
          testo: |
            Bastiano ride piano e ti dice che quello è il creditore meno peggio
            che ha. Il suo Mana ti arriva addosso come una folata gelata, e quando
            la stanza smette di girare è sparito con il gemello, lasciando cadere
            il quaderno blu.
          imposta: { maison.scrivano: 3 }
          effetti: { ferite: 1.5, fazione.maison: 1 }
          vai: citta-bassa

colonna:
  - { contesto: area, id: maison-sotto-il-cristallo-spento, musica: the-light-that-failed, ambiente: dungeon }
