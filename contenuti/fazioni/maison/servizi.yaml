# La quest della Maison des Lunes: i servizi e i lavori che si aprono con i gradi (quest.yaml).
# - Grado 1 (passo 3): la sala interna, ripetibile. Zekar con il mercante dell'argento (poste piccole, rep.maison
#   fino a 8) e con Chiara (poste alte); i conti di Gretchen sulla lavagnetta (rep.maison fino a 8).
# - Grado 2 (passo 6): la Stanza della Luna Nuova, l'alloggio della Maison (Ferite −1, Tormento −1). Si paga fino al
#   grado 4, poi è gratis.
# - Grado 3 (passo 9): le commissioni della signora (tre lavori a caso fra sei, rep.maison fino a 10) e il tavolino
#   della signora: le lezioni dell'Arte dei cristalli (Sussurro di paura, Voce di seta e, al grado 5 per chi ha
#   bruciato il libro o l'ha chiuso nella scatola, Oblio), pagate in informazioni; la ricarica del cristallo
#   accoppiato. Dal grado 4 i favori della signora (maison.favori: Scandalo −2, Sospetto −2, oppure un invito ai
#   Quartieri Alti). Al grado 5, a chi è Custode dei nomi, un segreto chiesto a Nerissa. Con rep.maison >= 9 il
#   tavolino compra segreti e pettegolezzi al prezzo migliore della città.
# - Dagli Averi: il cristallo accoppiato (si lascia in ascolto nei Quartieri Alti, in Municipio o alla Casa dei Nodi:
#   un segreto e ½ Sospetto per carica), la chiave della porta di servizio (ci si nasconde alla Maison: Sospetto −1;
#   con Oblio si fa dimenticare chi ti ha visto) e, per chi l'ha tenuto, il libro dei clienti di Vesh (una pagina
#   alla volta: un segreto e ½ Sospetto).
# Chi ha venduto il quaderno dello scrivano (maison.chiusa 1) o tenuto il libro (maison.libro 5) trova chiusi i
# servizi della casa.
zekar:
  - id: maison-chiara
    nome: Chiara
    immagine: ambientazione/maison-des-lunes
    descrizione: "Gioca con il portasigarette d'osso fra le dita e non guarda mai le tue carte. Si ferma presto e usa le negative per farti sbagliare il conto."
    laterali: [-4, -2, 1, 3]
    soglia: 17
    mira: 19

storylet:
  # ------------------------------------------------------------ grado 1 · la sala interna
  - id: maison-la-sala-interna
    presso: via-dei-rasoi
    immagine: ambientazione/maison-des-lunes
    titolo: La sala interna
    sommario: "Dietro la tenda del salone si gioca a Zekar, con i biglietti piegati o con le monete."
    luogo: Maison des Lunes, la sala interna
    area: citta-bassa
    ripetibile: true
    requisiti: [fazione.maison >= 3, maison.chiusa == 0, maison.libro != 5]
    testo: |
      Nella sala interna la lampada bassa illumina soltanto il panno verde,
      e le facce restano in ombra. Chiara dà le carte con il portasigarette
      d'osso fra le dita, e stasera al tavolo c'è anche il mercante
      dell'argento, che ha già perso tutto una volta e ci riprova con poste
      più piccole.

      {conoscenze-della-strada Media} Le poste piccole si giocano con le
      monete, quelle grandi con i biglietti piegati, che chi vince brucia
      senza aprirli.
    opzioni:
      - testo: "Una mano con il mercante dell'argento"
        descrizione: "Poste piccole, e il mercante che si ferma sempre tardi."
        requisiti: [monete >= 10]
        zekar: maison-mercante-dell-argento
        vittoria:
          titolo: L'argento nuovo
          testo: |
            Il mercante sbuffa e ti conta le monete sul panno, e Gretchen segna un
            punto sulla lavagnetta.
          effetti: { monete: 10, rep.maison: 0.5 }
        sconfitta:
          titolo: Il conto
          testo: |
            Il mercante raccoglie le tue monete una per una, rifacendosi un poco alla volta di
            quello che qui ha perso.
          effetti: { monete: -10 }
      - testo: "Una mano alta con Chiara"
        descrizione: "Chiara gioca di rado, e soltanto per poste che valgano la sua sera."
        requisiti: [monete >= 25]
        zekar: maison-chiara
        vittoria:
          titolo: Il portasigarette
          testo: |
            Chiara ti spinge la posta con la punta del portasigarette e ti guarda,
            per la prima volta stasera, come un avversario.
          effetti: { monete: 25 }
        sconfitta:
          titolo: La cenere
          testo: |
            Chiara raccoglie la posta e ti dice che hai giocato bene, il
            complimento più crudele che sappia fare.
          effetti: { monete: -25 }
      - testo: "Tenere la lavagnetta dei conti al posto di Gretchen"
        descrizione: "I debiti della sera scritti col gesso, che Gretchen cancella prima di dormire."
        requisiti: [rep.maison < 8]
        prova: { attributo: mentale, abilita: [politica-ed-economia, percezione], difficolta: Media }
        successo:
          titolo: Il gesso
          testo: |
            A fine partita i conti tornano al primo colpo, e Gretchen li cancella
            con il palmo e ti paga dalla cassetta della cucina.
          effetti: { monete: 4, rep.maison: 0.5 }
        fallimento:
          titolo: Il favore in più
          testo: |
            Segni un favore due volte e se ne accorge il mercante prima di te.
            Gretchen sistema il conto con una battuta, e a te paga soltanto il
            gesso.
          effetti: { monete: 1 }

  # ------------------------------------------------------------ grado 2 · la Stanza della Luna Nuova
  - id: maison-la-stanza-della-luna-nuova
    presso: via-dei-rasoi
    immagine: ambientazione/maison-des-lunes
    titolo: La Stanza della Luna Nuova
    sommario: "Una stanza del secondo piano per gli ospiti della casa che hanno bisogno di dormire."
    luogo: Maison des Lunes, il secondo piano
    area: citta-bassa
    ripetibile: true
    requisiti: [fazione.maison >= 6, maison.chiusa == 0, maison.libro != 5]
    testo: |
      La Luna Nuova è l'unica stanza della Maison senza specchio, con un
      letto alto che sa di lavanda e una finestra sui tetti. Gretchen ci
      porta l'acqua calda e lascia sempre una mela sul comodino.

      {resistenza Facile} Il corpo riconosce il letto prima di te, e le
      spalle ti scendono di due dita appena chiudi la porta.
    opzioni:
      - testo: "Dormire nella Luna Nuova"
        descrizione: "Una notte intera, segnata a matita sul libro dei conti di Gretchen."
        quando: [fazione.maison < 12]
        requisiti: [monete >= 8]
        esito:
          titolo: La mela
          testo: |
            Dormi fino a tardi senza sogni e mangi la mela seduto sul letto.
            Scendendo le scale le ferite tirano meno e la testa è più sgombra.
          effetti: { monete: -8, ferite: -1, tormento: -1 }
      - testo: "Dormire nella Luna Nuova"
        descrizione: "Da quando parli a nome della signora, Gretchen non apre nemmeno il libro dei conti."
        quando: [fazione.maison >= 12]
        esito:
          titolo: La mela
          testo: |
            Dormi fino a tardi, e qualcuno ti ha appeso il soprabito alla sedia.
            Scendendo le scale le ferite tirano meno e la testa è più sgombra.
          effetti: { ferite: -1, tormento: -1 }

  # ------------------------------------------------------------ grado 3 · le commissioni della signora
  - id: maison-le-commissioni-della-signora
    presso: via-dei-rasoi
    immagine: personaggi/nerissa-dalvane
    titolo: Le commissioni della signora
    sommario: "Ogni mattina Nerissa lascia in cucina il foglio delle commissioni, senza mai scriverci un nome."
    luogo: Maison des Lunes, la cucina
    area: citta-bassa
    ripetibile: true
    requisiti: [fazione.maison >= 9, maison.chiusa == 0, maison.libro != 5]
    mostra: 3
    testo: |
      Sotto la tazza col manico incollato di Gretchen c'è il foglio della
      signora, che al posto dei nomi scrive le cose, come *il signore del
      garofano* o *la casa con le persiane verdi*.

      {galateo Media} Queste piccole cortesie tengono in piedi la casa più
      dei buttafuori, purché si facciano prima che servano.
    opzioni:
      - testo: "Portare un messaggio a voce nei Quartieri Alti"
        descrizione: "La casa con le persiane verdi aspetta una risposta che non si scrive."
        prova: { attributo: sociale, abilita: [galateo, persuasione], difficolta: Media }
        successo:
          titolo: Le persiane verdi
          testo: |
            Una signora anziana ascolta il messaggio con gli occhi chiusi e ti dà
            una busta sigillata per Nerissa e una moneta per te.
          effetti: { monete: 8, rep.maison: 0.5 }
        fallimento:
          titolo: La porta sbagliata
          testo: |
            Bussi alla porta principale invece che a quella di servizio. Il
            messaggio arriva lo stesso, ma la signora anziana lo fa sapere a
            Nerissa, e Nerissa a te.
          effetti: { monete: 3 }
      - testo: "Riaccompagnare a casa il signore del garofano"
        descrizione: "Non deve essere visto rientrare nel suo quartiere a quell'ora."
        prova: { attributo: fisico, abilita: [furtivita, atletica], difficolta: Media }
        successo:
          titolo: Il garofano
          testo: |
            Lo porti a casa per i vicoli dietro Via del Salmone, tenendolo lontano
            dalle lanterne, e lui sparisce da una porta laterale con il garofano
            in tasca.
          effetti: { monete: 8, rep.maison: 0.5 }
        fallimento:
          titolo: La ronda
          testo: |
            All'angolo della sua strada incontrate una ronda, e lui si nasconde
            dietro di te. Arriva a casa, e il tuo nome finisce su un registro
            della Guardia.
          effetti: { monete: 3, sospetto: 1 }
      - testo: "Controllare i conti del fornitore del tè"
        descrizione: "Il tè della scatola di latta costa un poco di più ogni mese, e la signora vuole sapere perché."
        prova: { attributo: mentale, abilita: [politica-ed-economia, percezione], difficolta: Media }
        successo:
          titolo: Il tè buono
          testo: |
            Nel registro delle consegne trovi il pedaggio che la chiatta da Laresh
            paga in più a ogni ponte, e il fornitore ti dà un pacchetto per la
            signora a mo' di scusa.
          effetti: { monete: 8, rep.maison: 0.5 }
        fallimento:
          titolo: I sacchi
          testo: |
            Il fornitore ti segue ovunque e ti fa assaggiare tutto, ed esci con la
            lingua che sa di fumo e nessuna risposta.
          effetti: { monete: 3 }
      - testo: "Parlare a un cliente che ha alzato le mani"
        descrizione: "Ha fatto male a una ragazza, e va convinto che è finita senza rompergli niente."
        prova: { attributo: sociale, abilita: [intimidire, persuasione], difficolta: Media }
        successo:
          titolo: La spiegazione
          testo: |
            Lo trovi in un'osteria del Mercato dei Nodi e gli parli a bassa voce,
            con la mano sul suo bicchiere. Alla Maison non torna, e Sara si
            ricorda la sua spada. Lui guarda la tua mano e annuisce piano.
          effetti: { monete: 8, rep.maison: 0.5 }
        fallimento:
          titolo: Il bicchiere
          testo: |
            Lui ti tira il bicchiere in faccia e ci vogliono due avventori per
            separarvi. Il messaggio arriva lo stesso, ma il tuo zigomo se ne
            ricorderà per qualche giorno.
          effetti: { monete: 3, ferite: 0.5 }
      - testo: "Accompagnare Irmelin al mercato"
        descrizione: "Da qualche settimana, il martedì al mercato, qualcuno segue Irmelin."
        prova: { attributo: mentale, abilita: [percezione, furtivita], difficolta: Media }
        successo:
          titolo: Il martedì
          testo: |
            Dopo un'ora fra i banchi vedi chi segue Irmelin, un ragazzo con un
            mazzo di violette che non ha il coraggio di darle. Irmelin lo guarda a
            lungo con i suoi occhi d'argento, poi va a prendersele.
          effetti: { monete: 8, rep.maison: 0.5 }
        fallimento:
          titolo: I banchi
          testo: |
            Perdi Irmelin fra i banchi del pesce, e lei ti dice che oggi nessuno
            l'ha seguita, a parte te.
          effetti: { monete: 3 }
      - testo: "Convincere un creditore della casa con la Voce di seta"
        descrizione: "Un vinaio vuole essere pagato prima del tempo, finché l'idea di aspettare non gli sembra sua."
        incantesimo: maison-voce-di-seta
        prova: { attributo: mentale, abilita: magia, difficolta: Media }
        successo:
          titolo: La pazienza del vinaio
          testo: |
            Con il Mana sotto le parole gli parli della pazienza dei vinai di una
            volta, e lui decide che il conto può aspettare la vendemmia.
          effetti: { monete: 10, rep.maison: 0.5 }
        fallimento:
          titolo: La voce stonata
          testo: |
            Il Mana ti sfugge a metà della frase, e il vinaio vuole essere pagato
            entro la settimana.
          effetti: { tormento: 1 }

  # ------------------------------------------------------------ grado 3 e oltre · il tavolino della signora
  - id: maison-il-tavolino-della-signora
    presso: via-dei-rasoi
    immagine: personaggi/nerissa-dalvane
    titolo: Il tavolino della signora
    sommario: "Nerissa riceve chi è di casa nel salotto del primo piano, con la teiera sul tavolino."
    luogo: Maison des Lunes, il salotto del primo piano
    area: citta-bassa
    ripetibile: true
    requisiti: [fazione.maison >= 9, maison.chiusa == 0, maison.libro != 5]
    testo: |
      Nel salotto dalle tende accostate Nerissa ti versa il tè buono e
      accende la lampada con due dita, senza più nasconderlo. Quando ha
      finito di ascoltarti gira la tazza sul piattino di un quarto di giro.

      {magia Media} Qui il Mana della casa è più fitto che altrove, come il
      calore vicino a una stufa, e insegnare le viene facile.
    opzioni:
      - testo: "Imparare il Sussurro di paura"
        descrizione: "Una formula a bocca chiusa, in cambio di un pettegolezzo verificato."
        requisiti: [magia >= 1, incantesimo.sussurro-di-paura == 0, informazioni.pettegolezzo >= 1]
        costo: 2
        prova: { attributo: mentale, abilita: magia, difficolta: Facile }
        successo:
          titolo: La bocca chiusa
          testo: |
            La candela sul davanzale trema senza vento, e Nerissa ascolta il tuo
            pettegolezzo con la tazza ferma a mezz'aria.
          effetti: { informazioni.pettegolezzo: -1, incantesimo.sussurro-di-paura: 1 }
        fallimento:
          titolo: La candela ferma
          testo: |
            La candela resta ferma, e Nerissa ti dice che una lezione non riuscita
            non si paga.
      - testo: "Imparare la Voce di seta"
        descrizione: "La voce che fa fare alle persone quello che volevano già fare, in cambio di un segreto."
        requisiti: [magia >= 2, incantesimo.maison-voce-di-seta == 0, informazioni.segreto >= 1]
        costo: 2
        prova: { attributo: mentale, abilita: magia, difficolta: Media }
        successo:
          titolo: Il tappeto
          testo: |
            Stendi il Mana sotto le parole come un tappeto davanti a un ospite, e
            Nerissa si alza a versarti il tè prima di accorgersi di averlo deciso.
            Ride con la mano davanti alla bocca e ti chiede il segreto.
          effetti: { informazioni.segreto: -1, incantesimo.maison-voce-di-seta: 1 }
        fallimento:
          titolo: Il tappeto storto
          testo: |
            Nerissa resta seduta con un sopracciglio alzato. La voce c'era e il
            tappeto no, e il segreto lo tieni per un'altra sera.
      - testo: "Imparare l'Oblio"
        descrizione: "Una parola che non si ricorda, solo per chi tiene la scatola di latta con lei, per due segreti."
        quando: [maison.libro >= 1, maison.libro <= 2]
        requisiti: [magia >= 3, incantesimo.maison-oblio == 0, informazioni.segreto >= 2]
        costo: 2
        prova: { attributo: mentale, abilita: magia, difficolta: Difficile }
        successo:
          titolo: La parola
          testo: |
            Nerissa ti dice la parola con due dita sulla tempia, e anche se la
            dimentichi subito le dita sanno dove andare. Gretchen entra col latte
            ed esce chiedendosi perché è salita, e tu paghi i due segreti.
          effetti: { informazioni.segreto: -2, incantesimo.maison-oblio: 1 }
        fallimento:
          titolo: La parola persa
          testo: |
            Dimentichi la parola prima di usarla, e ti ritrovi sulla scala con un
            leggero mal di testa.
          effetti: { tormento: 1 }
      - testo: "Far ricaricare il cristallo accoppiato"
        descrizione: "Il Mana torna nelle due metà, in cambio di quello che hai sentito."
        requisiti: [oggetto.maison-cristallo-accoppiato >= 1, maison.cariche < 3, informazioni.pettegolezzo >= 1]
        esito:
          titolo: Le due metà
          testo: |
            Nerissa tiene le gabbiette nei palmi mentre ascolta il tuo
            pettegolezzo, e te le restituisce tiepide come sassi al sole.
          imposta: { maison.cariche: 3 }
          effetti: { informazioni.pettegolezzo: -1 }
      - testo: "Chiederle di far dimenticare uno scandalo"
        descrizione: "Un favore della signora, e la storia su di te smette di girare."
        requisiti: [maison.favori >= 1, scandalo >= 1]
        esito:
          titolo: Due parole
          testo: |
            Nerissa ascolta e ruota la tazza di un quarto di giro. Nelle settimane
            dopo la storia si accorcia di salotto in salotto, finché smette di
            girare.
          effetti: { maison.favori: -1, scandalo: -2 }
      - testo: "Chiederle di far dimenticare un sospetto"
        descrizione: "Un favore della signora, e certi registri della Guardia perdono una pagina."
        requisiti: [maison.favori >= 1, sospetto >= 1]
        esito:
          titolo: Per servizio
          testo: |
            Nerissa non ti chiede niente, e la settimana dopo le guardie del Ponte
            del Pesce smettono di guardarti passare.
          effetti: { maison.favori: -1, sospetto: -2 }
      - testo: "Chiederle una porta dei Quartieri Alti"
        descrizione: "Un favore della signora, e il sigillo di una famiglia buona che apre i cancelli."
        quando: [invito == 0]
        requisiti: [maison.favori >= 1]
        esito:
          titolo: Il biglietto
          testo: |
            Un ragazzo in livrea ti porta un biglietto con il sigillo di una
            famiglia dei Quartieri Alti, e da allora i portieri ti salutano.
          effetti: { maison.favori: -1, invito: 1 }
      - testo: "Chiederle un nome"
        descrizione: "Da Custode dei nomi puoi chiederle quello che sa, pagando con quello che sai tu."
        requisiti: [maison.custode >= 1, informazioni.pettegolezzo >= 2]
        costo: 2
        esito:
          titolo: La scatola di latta
          testo: |
            Nerissa ascolta i tuoi due pettegolezzi con gli occhi chiusi e apre la
            scatola di latta senza toccare niente. Ti dice un nome e una cosa sola
            su quel nome, a voce così bassa che devi sporgerti.
          effetti: { informazioni.pettegolezzo: -2, informazioni.segreto: 1 }
      - testo: "Raccontarle un segreto"
        descrizione: "A chi è di casa da tanto, Nerissa paga quello che sa meglio di chiunque in città."
        requisiti: [rep.maison >= 9, informazioni.segreto >= 1]
        costo: 0
        esito:
          titolo: Il prezzo migliore
          testo: |
            Nerissa ascolta il segreto senza muovere la tazza, poi ti conta le
            monete sul tavolino come fa Sara al bancone.
          effetti: { informazioni.segreto: -1, monete: 40 }
      - testo: "Raccontarle un pettegolezzo"
        descrizione: "Una voce verificata vale più qui che al mercato."
        requisiti: [rep.maison >= 9, informazioni.pettegolezzo >= 1]
        costo: 0
        esito:
          titolo: Il pettegolezzo
          testo: |
            Nerissa sorride a metà e ti conta le monete, con un'altra tazza perché
            la storia le è piaciuta.
          effetti: { informazioni.pettegolezzo: -1, monete: 8 }

  # ------------------------------------------------------------ dagli Averi · il cristallo accoppiato
  - id: maison-il-cristallo-in-ascolto
    titolo: Il cristallo accoppiato
    tipo: oggetto
    area: citta-bassa
    immagine: ambientazione/cristalli-conduttori
    requisiti: [oggetto.maison-cristallo-accoppiato >= 1]
    sommario: "Mezzo cristallo conduttore in una gabbietta d'ottone, che ascolta la stanza dove lo lasci."
    testo: |
      Nella gabbietta d'ottone, grande come una noce, il mezzo cristallo ha
      una luce color miele. Quello che si dice nella stanza dove la lasci
      arriva all'altra metà, nella cucina della Maison, e la carica che si
      consuma la rimette soltanto Nerissa.

      {magia Media} Nelle notti silenziose, all'orecchio, il cristallo porta
      un rumore regolare e lento che viene da molto più in basso di qualunque
      stanza.
    opzioni:
      - testo: "Lasciarlo in un salotto dei Quartieri Alti"
        descrizione: "Dietro un vaso o sotto una poltrona, per il tempo di un ricevimento."
        requisiti: [maison.cariche >= 1, invito >= 1]
        prova: { attributo: sociale, abilita: [galateo, furtivita], difficolta: Media }
        successo:
          titolo: Dietro il vaso
          testo: |
            Durante un ricevimento il cristallo ascolta mezz'ora di conversazione
            fra due consiglieri convinti di essere soli.
          effetti: { maison.cariche: -1, informazioni.segreto: 1, sospetto: 1 }
        fallimento:
          titolo: Il vaso spostato
          testo: |
            Un valletto trova la gabbietta prima di te e te la restituisce senza
            capire che cos'è, guardandoti uscire.
          effetti: { maison.cariche: -1, sospetto: 1.5 }
      - testo: "Lasciarlo nell'anticamera del Municipio"
        descrizione: "La panca delle udienze, dove i consiglieri si fermano a parlare."
        requisiti: [maison.cariche >= 1]
        prova: { attributo: sociale, abilita: [ingannare, furtivita], difficolta: Media }
        successo:
          titolo: La panca
          testo: |
            Lo riprendi a mezzogiorno con i discorsi di una mattina, e in mezzo
            una frase detta a mezza voce sulla scala che vale molto.
          effetti: { maison.cariche: -1, informazioni.segreto: 1, sospetto: 1 }
        fallimento:
          titolo: Tullio Merga
          testo: |
            Tullio Merga spazza sotto la panca con una scopa non sua, e ti porge
            la gabbietta chiedendoti se l'hai persa.
          effetti: { maison.cariche: -1, sospetto: 1.5 }
      - testo: "Lasciarlo sotto i portici della Casa dei Nodi"
        descrizione: "Dove i mercanti della Gilda fanno i conti a voce alta."
        requisiti: [maison.cariche >= 1]
        prova: { attributo: fisico, abilita: [furtivita, percezione], difficolta: Media }
        successo:
          titolo: I portici
          testo: |
            Il cristallo ti porta i conti di tre mercanti, e uno parla di una
            partita che la Gilda non registra.
          effetti: { maison.cariche: -1, informazioni.segreto: 1, sospetto: 1 }
        fallimento:
          titolo: La crepa
          testo: |
            La gabbietta la ritrovi in mano a un ragazzino, e gliela ricompri
            sotto gli occhi di una guardia della Gilda.
          effetti: { maison.cariche: -1, sospetto: 1.5, monete: -2 }
      - testo: "Tenerlo all'orecchio, di notte"
        descrizione: "Soltanto per sentire, senza lasciarlo da nessuna parte."
        costo: 0
        esito:
          titolo: Il respiro
          testo: |
            Sotto il silenzio della Maison senti un rumore regolare e lento che
            sale da molto più in basso della condotta, e la mattina non sai se
            l'hai sognato.

  # ------------------------------------------------------------ dagli Averi · la chiave della porta di servizio
  - id: maison-la-porta-di-servizio
    titolo: La porta di servizio
    tipo: oggetto
    area: citta-bassa
    immagine: ambientazione/maison-des-lunes
    requisiti: [oggetto.maison-chiave-della-porta-di-servizio >= 1]
    sommario: "La chiave di ferro col nastro verde apre la cucina della Maison a qualunque ora."
    testo: |
      Il nastro verde della chiave è lo stesso del quaderno di Sara. Sopra
      la stufa della cucina c'è la soffitta dove Gretchen tiene le mele
      d'inverno, e dove un ospite della casa può restare qualche giorno
      senza che la strada lo veda.

      {furtivita Media} Chi ti cerca guarda la porta grande, e quella di
      servizio, che dà sul cortile e su Via del Salmone, non la conosce
      nessuno.
    opzioni:
      - testo: "Nasconderti qualche giorno nella soffitta delle mele"
        descrizione: "Qualche giorno fuori dalla strada, finché chi ti cercava si stanca."
        quando: [maison.libro != 5]
        requisiti: [sospetto >= 1]
        costo: 2
        esito:
          titolo: Le mele d'inverno
          testo: |
            Tre giorni su un materasso di paglia, con Gretchen che ti porta da
            mangiare senza domande. Quando esci, la ronda di Via dei Rasoi ha
            cambiato turno e strada.
          effetti: { sospetto: -1 }
      - testo: "Far dimenticare chi ti ha visto"
        descrizione: "Due dita sulla tempia e una parola, e chi ti ha visto perde un'ora."
        incantesimo: maison-oblio
        requisiti: [sospetto >= 0.5]
        prova: { attributo: mentale, abilita: magia, difficolta: Media }
        successo:
          titolo: Un'ora in meno
          testo: |
            Chiedi l'ora alla guardia con due dita sulla sua tempia, come per
            scostarle un capello, e lei resta a guardare la strada cercando di
            ricordare che cosa stava facendo.
          effetti: { sospetto: -0.5, scandalo: -0.5 }
        fallimento:
          titolo: La parola sbagliata
          testo: |
            La parola ti si confonde in bocca, e la guardia ricorda benissimo te e
            la tua mano sulla sua tempia.
          effetti: { tormento: 1, sospetto: 1 }

  # ------------------------------------------------------------ dagli Averi · il libro dei clienti di Vesh (per chi l'ha tenuto)
  - id: maison-il-libro-di-vesh
    titolo: Il libro dei clienti di Vesh
    tipo: oggetto
    area: citta-bassa
    immagine: ambientazione/pignatta-grassa
    requisiti: [oggetto.maison-libro-dei-clienti >= 1]
    sommario: "Pelle nera e anni di nomi, e ogni pagina vale qualcosa a qualcuno."
    testo: |
      Il libro dei clienti di Vesh è rilegato in pelle nera, con una macchia di
      fuliggine sul dorso che è l'unico segno della notte della Pignatta. Lo
      tieni avvolto in una tela cerata in fondo alla bisaccia.

      {politica-ed-economia Media} Ogni pagina ha un nome dei Quartieri Alti che
      pagherebbe per non esserci, e ogni pagina che usi è un nemico che ancora
      non sa di esserlo.
    opzioni:
      - testo: "Leggere una pagina"
        descrizione: "Un nome con le sue date, e quello che decidi di farne."
        requisiti: [maison.pagine >= 1]
        esito:
          titolo: Una pagina
          testo: |
            Apri il libro su un nome che conosci e strappi la pagina lungo la
            cucitura, come faceva Ottone con i suoi conti sbagliati.
          effetti: { maison.pagine: -1, informazioni.segreto: 1, sospetto: 1 }
