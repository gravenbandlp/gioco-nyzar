# I nemici della quest della Maison des Lunes, tarati su quelli della stessa fase (contenuti/nemici/pelle.yaml e
# arena.yaml). La quest combatte poco: di solito ci sono vie sociali.
# - Passo 8, sotto il cristallo spento: lo scuro della condotta (prima della Pignatta) e il ladro di ferro (dopo),
#   come lo scagnozzo degli Scuri; Bastiano Rell, l'accordatore, con due sgherri al cuore (boss Difficile).
# - Passo 14, i magazzini del Ponte del Pesce: i bravi dei Ferrante come le guardie dei Malgrani, e Lazzaro Ferrante
#   tarato come Durgan, con due bravi al cuore (boss Difficile).
nemici:
  - id: maison-scuro-della-condotta
    immagine: fazioni/scuri
    nome: Scuro della condotta
    descrizione: "Uno dei ragazzi di Mauro che salgono dalla Pignatta per la condotta vecchia, con il cappuccio bagnato fino alle spalle e un coltello da pesce."
    attacco: 3
    difesa: 2
    difesaMentale: 2
    pf: 9
    danno: 2
    iniziativa: 2
    puoFuggire: true

  - id: maison-ladro-di-ferro
    immagine: ambientazione/citta-bassa
    nome: Ladro di ferro
    descrizione: "Dopo la notte della Pignatta la condotta è passata a chi stacca le grate e le rivende a peso. Ha un piede di porco e poca voglia di farsi riconoscere."
    attacco: 3
    difesa: 2
    difesaMentale: 2
    pf: 9
    danno: 2
    iniziativa: 2
    puoFuggire: true

  - id: maison-bastiano-rell
    immagine: ambientazione/cristalli-conduttori
    nome: Bastiano Rell
    descrizione: "Un uomo magro con le dita macchiate di polvere di cristallo e gli occhiali legati con lo spago. Non sa tenere un coltello, e il Mana lo tiene benissimo."
    attacco: 2
    difesa: 3
    difesaMentale: 4
    pf: 14
    danno: 1
    iniziativa: 3
    magia: 5
    energia: 4
    incantesimi: [dardo, sussurro-di-paura]
    puoFuggire: true

  - id: maison-bravo-dei-ferrante
    immagine: ambientazione/ponti-sospesi
    nome: Bravo dei Ferrante
    descrizione: "Un facchino del Ponte del Pesce pagato a giornata per tenere la porta, con un randello di legno di nave e le maniche arrotolate."
    attacco: 3
    difesa: 3
    difesaMentale: 2
    pf: 10
    danno: 3
    riduzione: 3
    iniziativa: 2

  - id: maison-lazzaro-ferrante
    immagine: ambientazione/ponti-sospesi
    nome: Lazzaro Ferrante
    descrizione: "Il fratello grande, quello che tiene la porta. Ha le spalle di uno scaricatore e un gancio da stiva legato al polso, e combatte senza dire una parola."
    attacco: 4
    difesa: 3
    difesaMentale: 2
    pf: 18
    danno: 2
    riduzione: 2
    iniziativa: 1

scontri:
  - { id: maison-la-condotta-prima, nome: "Gli Scuri nella condotta", nemici: [maison-scuro-della-condotta, maison-scuro-della-condotta], feriteSconfitta: 2 }
  - { id: maison-la-condotta-dopo, nome: "I ladri di ferro nella condotta", nemici: [maison-ladro-di-ferro, maison-ladro-di-ferro], feriteSconfitta: 2 }
  - { id: maison-la-camera-d-ascolto-prima, nome: "La camera d'ascolto", nemici: [maison-bastiano-rell, maison-scuro-della-condotta, maison-scuro-della-condotta], feriteSconfitta: 3 }
  - { id: maison-la-camera-d-ascolto-dopo, nome: "La camera d'ascolto", nemici: [maison-bastiano-rell, maison-ladro-di-ferro, maison-ladro-di-ferro], feriteSconfitta: 3 }
  - { id: maison-il-bravo-che-dorme, nome: "Il bravo che dorme", nemici: [maison-bravo-dei-ferrante], feriteSconfitta: 2 }
  - { id: maison-lo-scrittoio-dei-ferrante, nome: "Lo scrittoio dei Ferrante", nemici: [maison-lazzaro-ferrante, maison-bravo-dei-ferrante, maison-bravo-dei-ferrante], feriteSconfitta: 4 }
