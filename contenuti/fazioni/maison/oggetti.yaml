# Gli oggetti e gli incantesimi della quest della Maison des Lunes, uno per grado (quest.yaml):
# - grado 1 (passo 3): il ventaglio dei segnali (accessorio di grado 1, Empatia +1, chiave.segnali);
# - grado 2 (passo 6): il bastone animato dell'armadio (arma di grado 2 su base spada corta);
# - grado 3 (passo 9): il cristallo accoppiato (accessorio di grado 2; dagli Averi lo lasci in ascolto, con le
#   cariche in maison.cariche e ½ Sospetto a ogni uso) e la chiave della porta di servizio (chiave.porta-di-servizio:
#   ci si nasconde alla Maison quando il Sospetto sale);
# - grado 4 (passo 12): la spilla della mezzaluna (accessorio di grado 3, chiave.salotti);
# - grado 5 (passo 15): il soprabito della sarta (armatura di grado 4, l'oggetto unico della fazione) e, se il libro
#   finisce bruciato o nella scatola di latta oppure consegnato, la catena di bronzo (accessorio di grado 3, Legata).
# Incantesimi nuovi dell'Arte dei cristalli, insegnati da Nerissa al suo tavolino (servizi.yaml): Voce di seta
# (livello 2, dal grado 3) e Oblio (livello 3, al grado 5, a chi ha bruciato il libro o l'ha chiuso nella scatola).
oggetti:
  - id: maison-ventaglio-dei-segnali
    nome: Ventaglio dei segnali
    immagine: icone/handheld-fan
    descrizione: "Un ventaglio di carta dipinta con le stecche d'osso, uguale a quelli delle ragazze della Maison. Aperto a metà o chiuso di scatto dice cose che in salone sanno leggere in pochi."
    slot: accessorio
    grado: 1
    proprieta: { talento: { empatia: 1 }, chiave: [segnali] }

  - id: maison-bastone-animato
    nome: Bastone animato dell'armadio
    immagine: icone/piercing-sword
    descrizione: "Un bastone da passeggio di ebano con il pomo d'argento, e dentro una lama stretta. Il proprietario giurava di non sapere che si aprisse, e non è mai tornato a riprenderlo dall'armadio di Sara."
    slot: arma
    base: spada-corta
    grado: 2
    dadi: 1
    proprieta: { affilata: 1 }

  - id: maison-cristallo-accoppiato
    nome: Cristallo accoppiato
    immagine: icone/crystal-eye
    descrizione: "La metà di un cristallo conduttore spezzato da Nerissa, chiusa in una gabbietta d'ottone. Lasciata in una stanza, porta quello che vi si dice all'altra metà, rimasta nella cucina della Maison."
    slot: accessorio
    grado: 2
    proprieta: { talento: { percezione: 1, furtivita: 1 }, chiave: [orecchio] }
    usa: maison-il-cristallo-in-ascolto

  - id: maison-chiave-della-porta-di-servizio
    nome: Chiave della porta di servizio
    immagine: icone/key
    descrizione: "Una chiave di ferro con l'anello consumato, appesa a un nastro verde. Apre la porta della cucina della Maison des Lunes, quella sul cortile di Via del Salmone, a qualunque ora."
    slot: nessuno
    proprieta: { chiave: [porta-di-servizio] }
    usa: maison-la-porta-di-servizio

  - id: maison-spilla-della-mezzaluna
    nome: Spilla della mezzaluna
    immagine: icone/moon-orbit
    descrizione: "Una mezzaluna d'argento opaco, appuntata al bavero dalla parte del cuore. Nei salotti dei Quartieri Alti chi la riconosce sa che stai parlando a nome di Nerissa Dalvane, e abbassa la voce."
    slot: accessorio
    grado: 3
    proprieta: { talento: { galateo: 2, persuasione: 1 }, chiave: [salotti] }

  - id: maison-soprabito-della-sarta
    nome: Soprabito della sarta
    immagine: icone/cape-armor
    descrizione: "Lana nera di taglio sobrio, con la fodera di seta cucita a punti fitti in sette strati, che una lama non passa. La sarta della Maison lo ha tagliato sulle tue spalle senza prendere le misure. In Via dei Rasoi lo riconoscono da lontano."
    slot: armatura
    base: giaco-imbottito
    grado: 4
    dadi: 2
    proprieta: { lucida: true, silenziosa: true }
    difetti: [riconoscibile]

  - id: maison-catena-di-bronzo
    nome: Catena di bronzo
    immagine: icone/gem-chain
    descrizione: "Un tratto della catena che pende accanto alla porta della Maison, con un anello inciso a mezzaluna. Nerissa te l'ha chiusa al polso lei, e la chiusura non ha un fermaglio."
    slot: accessorio
    grado: 3
    proprieta: { talento: { galateo: 2, persuasione: 1, empatia: 1 } }
    difetti: [legata]

  - id: maison-libro-dei-clienti
    nome: Il libro dei clienti di Vesh
    immagine: icone/secret-book
    descrizione: "Pelle nera e angoli d'ottone, con una macchia di fuliggine sul dorso. Dentro ci sono anni di nomi dei Quartieri Alti, ciascuno con le sue date. Adesso lo porti tu, in fondo alla bisaccia."
    slot: nessuno
    usa: maison-il-libro-di-vesh

incantesimi:
  - id: maison-voce-di-seta
    nome: Voce di seta
    tradizione: cristalli
    livello: 2
    uso: [combattimento, storie]
    descrizione: "Una frase detta piano, con il Mana steso sotto le parole come un tappeto. Il bersaglio perde il turno successivo, se non resiste con Resilienza. Fuori dal combattimento convince chi ascolta che l'idea è stata sua."
    tipo: indebolimento
    difesa: resilienza
    modifica: { tipo: salta, valore: 0, round: 1 }

  - id: maison-oblio
    nome: Oblio
    tradizione: cristalli
    livello: 3
    uso: [storie]
    descrizione: "Due dita sulla tempia e una parola che non si ricorda. Chi la sente perde l'ultima ora, e di solito non se ne accorge. Toglie un poco di Sospetto o di Scandalo a chi lo sa usare con garbo."
