# La quest della Maison des Lunes, passi 13-15. Tutti chiedono pista.pelle >= 7: il libro dei clienti di Vesh esce
# dalle macerie della Pignatta.
# - Passo 13, le pagine nella cenere: un mugnaio del giovedì riceve sotto la porta una pagina con le sue visite e una
#   richiesta di denaro. Tibo alle macerie, Rozalia secondo macerie.rozalia (3 lavora per te, 2 in cella), il cliente
#   seguito fino alla terza arcata del Ponte del Pesce, Bastiano se lavora per te (maison.scrivano 4).
# - Passo 14, la terza arcata: si entra nella spedizione `maison-magazzini-del-ponte-del-pesce`
#   (spedizione-magazzini.yaml). Il cuore porta maison.ferrante a 4 (presi) o a 2 (scappati); `maison-i-fratelli-ferrante` decide che
#   cosa ne è dei fratelli (1 in Caserma, 2 fuggiti, 3 a debito con te). Il passo 15 aspetta quella scelta.
# - Passo 15, la scatola di latta (quinto grado, Custode dei nomi): nessuna prova, ogni scelta costa. maison.libro
#   1 bruciato, 2 nella scatola di latta: tutto il grado (soprabito, catena di bronzo, Oblio, i nomi chiesti a
#   Nerissa, la borsa). 3 allo sceriffo, 4 a Julia: soprabito, catena e borsa, senza Oblio e senza i nomi, con la
#   reputazione che scende; chi tiene fuori la pagina del chierico la porta a Padre Vantes (rep.velo +1). 5 tenuto:
#   soprabito, tre segreti, le pagine del libro e il titolo Chi tiene il libro, Sospetto +2 e rep.maison −4.
# - Dopo il passo 15, con maison.mare 1, Laure sulla soglia: partirà per Laresh con la prima carovana.
storylet:
  # ------------------------------------------------------------ passo 13 · le pagine nella cenere
  - id: maison-le-pagine-nella-cenere
    presso: via-dei-rasoi
    immagine: ambientazione/pignatta-grassa
    titolo: Le pagine nella cenere
    sommario: "Un cliente del giovedì bussa alla porta di servizio con un foglio e la faccia di chi non dorme."
    luogo: Maison des Lunes, la cucina
    area: citta-bassa
    requisiti: [fazione.maison == 12, pista.pelle >= 7]
    testo: |
      Il mugnaio del giovedì non era mai entrato dalla porta di servizio, e
      stamattina Gretchen lo fa sedere in cucina. Sotto la porta di casa ha
      trovato una pagina in bella calligrafia con il suo nome e, una per riga,
      le sere passate alla Maison negli ultimi tre anni. In fondo un'altra
      grafia, frettolosa, chiede una borsa sotto la terza arcata del Ponte del
      Pesce entro domenica.

      {percezione Media} Il margine è bruciacchiato da settimane, e la
      calligrafia è fresca, ricopiata da una pagina più vecchia.

      «Mirko Vesh voleva le cose che si dicono qui dentro, mai i nostri soldi»
      dice piano Nerissa dal corridoio. «Per anni se le è fatte portare da Jass
      e dallo scrivano, e il libro dove le teneva non è bruciato con la
      Pignatta.»

      {origine figlio-della-citta-bassa} Delle carte di Vesh, nei vicoli, si
      parlava come dei tesori dei pirati.
    opzioni:
      - testo: "Chiedere a Tibo alle macerie"
        descrizione: "Il bambino che dorme sotto il bancone della Pignatta era lì la notte dell'incendio."
        prova: { attributo: sociale, abilita: [empatia, conoscenze-della-strada], difficolta: Facile }
        successo:
          titolo: La cassetta
          testo: |
            Tibo raddrizza chiodi sul bancone di quercia, e divide a metà la tua
            pagnotta prima di parlare. Mentre il tetto veniva giù, racconta, due
            uomini sono usciti dalla cantina con una cassetta di ferro, il grande
            in spalla e il piccolo dietro con un quaderno. Sono andati verso il
            Ponte del Pesce, senza correre.
          pe: { empatia: 5 }
          effetti: { rep.maison: 1, nomea.citta-bassa: 0.5, fazione.maison: 1 }
        fallimento:
          titolo: Tibo diffidente
          testo: |
            Ci vuole tutta la pagnotta per far uscire Tibo da sotto il bancone, e
            ti dice soltanto che quella notte due uomini sono andati verso il
            Ponte del Pesce con una cassetta.
          effetti: { rep.maison: 0.5, nomea.citta-bassa: 0.5, fazione.maison: 1 }

      - testo: "Seguire il mugnaio quando va a pagare"
        descrizione: "Domenica lascerà la borsa sotto la terza arcata, e qualcuno verrà a prenderla."
        prova: { attributo: fisico, abilita: [furtivita, percezione], difficolta: Media }
        successo:
          titolo: La terza arcata
          testo: |
            Il mugnaio lascia la borsa nella nicchia sotto la terza arcata, e tu
            aspetti dietro una pila di nasse. Dopo un'ora un uomo giovane con le
            dita macchiate d'inchiostro e un quaderno sotto il braccio prende la
            borsa e sparisce in una porta dei vecchi magazzini del pesce salato.
          pe: { furtivita: 5 }
          effetti: { rep.maison: 1, nomea.citta-bassa: 0.5, fazione.maison: 1 }
        fallimento:
          titolo: Le nasse
          testo: |
            La pila di nasse ti crolla addosso, e nessuno viene. La mattina la
            borsa non c'è più, e un pescatore ti dice che di notte, sotto l'arco,
            ci passano i fratelli Ferrante, quelli del quaderno.
          effetti: { ferite: 0.5, rep.maison: 0.5, nomea.citta-bassa: 0.5, fazione.maison: 1 }

      - testo: "Chiedere a Rozalia chi faceva le belle copie"
        descrizione: "Rozalia Marga lavora per te dalla notte della Pignatta, e prima faceva le copie di Vesh."
        immagine: personaggi/rozalia-marga
        quando: [macerie.rozalia == 3]
        esito:
          titolo: La calligrafia
          testo: |
            Rozalia riconosce la sua grafia sotto quella ricopiata. Le belle copie
            del libro di Vesh le faceva lei una volta all'anno. La notte
            dell'incendio ha visto la cassetta di ferro uscire sulle spalle di
            Lazzaro Ferrante, con il fratello Dario dietro a tenere il quaderno.
          pe: { empatia: 5 }
          effetti: { rep.maison: 1, nomea.citta-bassa: 0.5, fazione.maison: 1 }

      - testo: "Andare a trovare Rozalia in cella"
        descrizione: "Rozalia Marga è in cella per causa tua, sa chi faceva le copie e vorrà qualcosa in cambio."
        immagine: personaggi/rozalia-marga
        quando: [macerie.rozalia == 2]
        esito:
          titolo: Una parola per il processo
          testo: |
            Rozalia ha le dita macchiate d'inchiostro anche in cella, perché le
            fanno copiare i registri della Caserma. Ti conferma che le copie le
            faceva lei, e che la cassetta l'hanno portata via i Ferrante del Ponte
            del Pesce. In cambio vuole una parola per il processo, e quando gliela
            prometti ti crede, perché non ha altro da credere.
          pe: { empatia: 5 }
          effetti: { rep.maison: 1, nomea.citta-bassa: 0.5, fazione.maison: 1 }

      - testo: "Chiedere a Bastiano a chi vendeva"
        descrizione: "Bastiano lavora per te, ma prima prendeva lo stipendio di qualcun altro."
        quando: [maison.scrivano == 4]
        esito:
          titolo: Chi pagava
          testo: |
            Bastiano pulisce gli occhiali sulla camicia per prendere tempo. Dopo
            la Pignatta il suo quaderno lo comprava un ragazzo del Ponte del Pesce
            con le dita macchiate d'inchiostro, uno dei Ferrante, che voleva
            soltanto i nomi del giovedì.
          pe: { tecnologia: 5 }
          effetti: { rep.maison: 1, nomea.citta-bassa: 0.5, fazione.maison: 1 }

  # ------------------------------------------------------------ passo 14 · la terza arcata (ingresso della spedizione)
  - id: maison-la-terza-arcata
    immagine: ambientazione/ponti-sospesi
    titolo: La terza arcata
    sommario: "Sotto l'arco del Ponte del Pesce, nei vecchi magazzini del pesce salato, di notte c'è una luce accesa."
    luogo: Il Ponte del Pesce, sotto l'arco
    area: citta-bassa
    requisiti: [fazione.maison == 13, pista.pelle >= 7]
    testo: |
      Sotto l'arco di pietra rossa del Ponte del Pesce, dove cominciano le corde dei Ponti
      Sospesi, i vecchi magazzini del pesce salato stanno mezzi scavati nella roccia e mezzi a
      sbalzo sul vuoto, con l'odore ancora nei muri. Stanotte da una finestrella alta esce una
      luce di candela, e sulla riva due chiatte sono legate alla stessa bitta.

      {politica-ed-economia Media} Due fratelli che vendono pagine una alla volta tengono il
      libro dove possono vederlo e nessuno pensa di cercare.

      Kanat si ferma all'imbocco dell'arco con le braccia incrociate. Se entra rompe qualcosa,
      e stanotte la signora non vuole niente di rotto tranne il libro.
    opzioni:
      - testo: "Scendere ai magazzini"
        descrizione: "Il libro è là sotto, da qualche parte dietro la porta del sale."
        esito:
          titolo: L'odore del sale
          testo: |
            Scendi la scala di pietra verso la riva, con l'odore del pesce salato
            che ti viene incontro a ogni gradino, e ti fermi all'ombra dell'arco.
            Kanat ti fa un cenno dall'alto e sparisce nel buio.
          vai: maison-magazzini-del-ponte-del-pesce
      - testo: "Aspettare un'altra notte"
        descrizione: "Le pagine escono una alla volta, e il libro resta dov'è."
        costo: 0
        esito:
          titolo: Un'altra notte
          testo: |
            Torni indietro con Kanat, che ti offre un pezzo di pane secco dalla
            tasca. Sotto l'arco la candela resta accesa fino all'alba.

  # ------------------------------------------------------------ passo 14 · i fratelli Ferrante
  - id: maison-i-fratelli-ferrante
    presso: via-dei-rasoi
    immagine: ambientazione/ponti-sospesi
    titolo: I fratelli Ferrante
    sommario: "Il libro ce l'hai tu, e i fratelli Ferrante aspettano nella legnaia della Maison."
    luogo: Maison des Lunes, la legnaia
    area: citta-bassa
    requisiti: [fazione.maison == 14, maison.ferrante == 4]
    testo: |
      Nella legnaia dove avete tenuto Bastiano adesso ci sono i fratelli
      Ferrante. Lazzaro siede sul ceppo con il gancio da stiva slegato e
      appoggiato ai piedi, come un cagnolino. Dario sta in piedi contro la
      catasta, stretto al quaderno dei conti, l'unica cosa che non gli avete
      tolto.

      «Abbiamo trovato una cassetta in mezzo alla cenere» dice Dario. «Nessuno
      la reclamava. Chi trova una cosa e la vende fa commercio, non è un
      furto.» Lazzaro guarda il fratello e tace.

      {politica-ed-economia Media} Nel quaderno di Dario ci sono i nomi di chi
      ha già pagato. Chi ha pagato una volta pagherà ancora, a chiunque gli
      mandi una pagina.
    opzioni:
      - testo: "Consegnarli alla Caserma"
        descrizione: "Lo sceriffo sa che cosa farne, e la Città Bassa vedrà che la Maison non si vendica da sola."
        costo: 0
        esito:
          titolo: La Caserma
          testo: |
            Li porti alla Caserma all'alba, e il sergente di turno li prende in
            consegna, contento di un caso facile. Il quaderno di Dario finisce in
            una cassa di ferro come prova, e lui ti guarda andare via senza
            rancore, come si guarda un concorrente che ha vinto un appalto.
          imposta: { maison.ferrante: 1 }
          effetti: { rep.caserma: 0.5 }
      - testo: "Lasciarli andare, senza il quaderno"
        descrizione: "Senza libro e senza quaderno sono due facchini, e tanto vale che lo siano lontano da qui."
        costo: 0
        esito:
          titolo: La strada per Pannion
          testo: |
            Bruci il quaderno di Dario nella stufa, davanti a lui, pagina per
            pagina. Kanat li accompagna al Ponte del Pesce, e la mattina dopo una
            chiatta parte verso valle con due passeggeri in più. Lazzaro, prima di
            andarsene, ti ringrazia.
          imposta: { maison.ferrante: 2 }
          effetti: { informazioni.pettegolezzo: 1 }
      - testo: "Tenerli in debito con te"
        descrizione: "Liberi e con un debito verso di te, servono più che in cella."
        prova: { attributo: sociale, abilita: [intimidire, persuasione], difficolta: Media }
        successo:
          titolo: Il debito
          testo: |
            Spieghi a Dario che da stanotte i suoi conti li tiene anche qualcun
            altro, e che il primo nome venduto senza il tuo permesso sarà
            l'ultimo. Lui ti tende la mano, da mercante. Lazzaro si rilega il
            gancio al polso e ti chiede se adesso lavora per te, e quando dici di
            sì sembra sollevato.
          imposta: { maison.ferrante: 3 }
          effetti: { informazioni.pettegolezzo: 1, rep.maison: -0.5 }
        fallimento:
          titolo: La mano tesa
          testo: |
            Dario ride, perché ha capito che non hai nessuna voglia di farli
            sparire. Kanat lo prende per il colletto e lo porta alla Caserma con
            il fratello, e tu li segui per firmare la consegna.
          imposta: { maison.ferrante: 1 }
          effetti: { rep.caserma: 0.5, sospetto: 0.5 }

  # ------------------------------------------------------------ passo 15 · la scatola di latta (quinto grado)
  - id: maison-la-scatola-di-latta
    presso: via-dei-rasoi
    immagine: personaggi/nerissa-dalvane
    titolo: La scatola di latta
    sommario: "All'alba, a casa chiusa, sul tavolino del salone c'è la teiera, e accanto c'è il libro di Vesh."
    luogo: Maison des Lunes, il salone all'alba
    area: citta-bassa
    requisiti: [fazione.maison == 14, pista.pelle >= 7, maison.ferrante != 4]
    testo: |
      Il salone all'alba ha una luce grigia che fa sembrare le poltrone più
      vecchie. Sul tavolino c'è la teiera del tè buono, e sul piattino la
      seconda tazza, ancora tiepida, con la matita corta accanto. Sara è
      seduta sullo sgabello del bancone, Gretchen in piedi dietro la poltrona
      di Nerissa.

      Accanto alla teiera c'è il libro di Vesh, più spesso di quanto credevi,
      rilegato in pelle nera con gli angoli d'ottone. Dentro ci sono anni di
      nomi ricopiati in bella da Rozalia. Nerissa non lo guarda nemmeno.

      {resilienza Media} Ti accorgi che stai pensando ai nomi che ci sono
      dentro, e a quanti ne conosci. È la stessa cosa che pensava Vesh.

      «La mia casa regge finché la gente crede che quello che dice qui dentro
      sparisca» dice Nerissa, piano. «Da oggi ci crederanno grazie a te,
      oppure no. Il libro l'hai trovato tu, e io non lo apro. Decidi tu che
      cosa ne facciamo.»

      {origine accolito-del-velo} In Cattedrale ti hanno insegnato che i
      peccati confessati si bruciano con la carta su cui li scrivi. Non te
      l'hanno mai insegnato per i peccati degli altri.
    opzioni:
      - testo: "Bruciarlo nella stufa"
        descrizione: "Pagina per pagina, come il quaderno di Sara, con lei accanto."
        esito:
          titolo: Le armi senza nome
          testo: |
            Sara si siede accanto a te davanti alla stufa, e a ogni pagina che
            bruci senza leggerla dice a voce bassa il nome di un'arma, un'elsa a
            canestro, il bastone animato con il pomo d'argento. Le riconosce
            tutte. Quando resta soltanto la copertina, Nerissa ti chiude al polso
            un anello della catena di bronzo della porta e ti dice che la scatola
            di latta, da oggi, è anche tua.
          pe: { empatia: 20 }
          imposta: { maison.libro: 1, maison.custode: 1 }
          effetti: { monete: 350, oggetto.maison-soprabito-della-sarta: 1, oggetto.maison-catena-di-bronzo: 1, rep.maison: 1, fazione.maison: 1 }
          almeno: { rep.maison: 10 }
          segue: maison-il-soprabito-della-sarta

      - testo: "Chiuderlo nella scatola di latta senza aprirlo"
        descrizione: "Nella scatola dove stanno il quaderno di Sara e quello dello scrivano, in due a sapere dov'è."
        esito:
          titolo: Il tè buono
          testo: |
            Il libro entra a fatica nella scatola di latta del tè buono, sopra il
            quaderno di Sara e la metà del cristallo. Nerissa chiude il coperchio,
            ti dà la chiave e ti chiude al polso un anello della catena di bronzo
            della porta, perché da oggi i nomi di questa casa li tenete in due.
            Gretchen finalmente si siede, e Sara ti chiama per nome.
          pe: { empatia: 20 }
          imposta: { maison.libro: 2, maison.custode: 1 }
          effetti: { monete: 350, oggetto.maison-soprabito-della-sarta: 1, oggetto.maison-catena-di-bronzo: 1, rep.maison: 1, fazione.maison: 1 }
          almeno: { rep.maison: 10 }
          segue: maison-il-soprabito-della-sarta

      - testo: "Darlo allo sceriffo per il processo"
        descrizione: "Nel libro ci sono le ultime cellule degli Scuri, e Galdrick ne farebbe dei processi."
        esito:
          titolo: La tazza vuota
          testo: |
            Nerissa non ti ferma. In Caserma Galdrick sfoglia il libro in piedi,
            con la matita fra i denti, e alla decima pagina chiude la porta
            dell'ufficio. Ci saranno processi, e nessuno saprà da dove viene il
            libro. Alla Maison la seconda tazza resta vuota per un mese. Nerissa
            ti chiude lo stesso al polso un anello della catena di bronzo, e Sara
            ti chiama per nome a voce più bassa.
          pe: { empatia: 20 }
          imposta: { maison.libro: 3 }
          effetti: { monete: 300, oggetto.maison-soprabito-della-sarta: 1, oggetto.maison-catena-di-bronzo: 1, rep.caserma: 2, rep.maison: -2, fazione.maison: 1 }
          almeno: { rep.maison: 8 }
          segue: maison-il-soprabito-della-sarta

      - testo: "Darlo allo sceriffo, ma tenere fuori la pagina del chierico"
        descrizione: "Padre Vantes saprebbe che cosa fare del chierico del Velo senza un processo."
        esito:
          titolo: La pagina del chierico
          testo: |
            Sfili la pagina del chierico e porti il resto in Caserma, dove
            Galdrick, alla decima pagina, chiude la porta dell'ufficio. Padre
            Vantes legge la pagina una volta sola e la brucia in un braciere della
            sagrestia, ringraziandoti con un cenno. Alla Maison la seconda tazza
            resta vuota per un mese, e Nerissa ti chiude lo stesso al polso un
            anello della catena di bronzo, senza dire niente.
          pe: { empatia: 20 }
          imposta: { maison.libro: 3 }
          effetti: { monete: 300, oggetto.maison-soprabito-della-sarta: 1, oggetto.maison-catena-di-bronzo: 1, rep.caserma: 2, rep.velo: 1, rep.maison: -2, fazione.maison: 1 }
          almeno: { rep.maison: 8 }
          segue: maison-il-soprabito-della-sarta

      - testo: "Darlo a Julia Castaldi"
        descrizione: "La Rappresentante saprebbe chi in Consiglio deve qualcosa a chi, e cambierebbe le sedute."
        esito:
          titolo: La cartella di pelle
          testo: |
            Julia Castaldi chiude il libro nella sua cartella di pelle senza
            sfogliarlo davanti a te, e nelle settimane dopo tre consiglieri
            cambiano idea su tre pratiche diverse. Nerissa ti chiude lo stesso al
            polso un anello della catena di bronzo. Per un pezzo il tè te lo versa
            Gretchen.
          pe: { empatia: 20 }
          imposta: { maison.libro: 4 }
          effetti: { monete: 300, oggetto.maison-soprabito-della-sarta: 1, oggetto.maison-catena-di-bronzo: 1, rep.castaldi: 2, rep.maison: -2, fazione.maison: 1 }
          almeno: { rep.maison: 8 }
          segue: maison-il-soprabito-della-sarta

      - testo: "Darlo a Julia, ma tenere fuori la pagina del chierico"
        descrizione: "Padre Vantes saprebbe che cosa fare del chierico del Velo fuori dalla politica."
        esito:
          titolo: La pagina del chierico
          testo: |
            Sfili la pagina del chierico e porti il resto a Julia Castaldi, che lo
            chiude nella sua cartella senza sfogliarlo. Padre Vantes legge la
            pagina una volta sola e la brucia nella sagrestia. Nerissa ti chiude
            lo stesso al polso un anello della catena di bronzo. Per un pezzo il
            tè te lo versa Gretchen.
          pe: { empatia: 20 }
          imposta: { maison.libro: 4 }
          effetti: { monete: 300, oggetto.maison-soprabito-della-sarta: 1, oggetto.maison-catena-di-bronzo: 1, rep.castaldi: 2, rep.velo: 1, rep.maison: -2, fazione.maison: 1 }
          almeno: { rep.maison: 8 }
          segue: maison-il-soprabito-della-sarta

      - testo: "Tenerlo"
        descrizione: "Chi ha anni di nomi con le date non ha più bisogno di chiedere niente a nessuno."
        esito:
          titolo: Chi tiene il libro
          testo: |
            Ti metti il libro sotto il braccio, e nessuno ti ferma. Gretchen si
            gira verso la finestra, Nerissa beve il suo tè e poi ti apre lei la
            porta grande. Sulla soglia Sara ti guarda le mani, e il tuo nome non
            lo dice.

            {resilienza Difficile} Il libro sotto il braccio è caldo come una cosa
            viva, e stai già pensando a quale pagina aprire per prima.
          pe: { empatia: 20 }
          imposta: { maison.libro: 5, maison.chi-tiene-il-libro: 1, maison.pagine: 6 }
          effetti: { oggetto.maison-soprabito-della-sarta: 1, oggetto.maison-libro-dei-clienti: 1, informazioni.segreto: 3, sospetto: 2, rep.maison: -4, fazione.maison: 1 }
          segue: maison-il-soprabito-della-sarta

  - id: maison-il-soprabito-della-sarta
    immagine: ambientazione/maison-des-lunes
    titolo: Il soprabito della sarta
    tipo: seguito
    luogo: Maison des Lunes, la stanza della sarta
    area: citta-bassa
    requisiti: [fazione.maison >= 15]
    testo: |
      Qualche giorno dopo ti chiamano nella soffitta della sarta, una donna
      anziana con gli spilli in bocca. Sul manichino senza testa c'è un
      soprabito di lana nera di taglio sobrio, con la fodera di seta cucita in
      sette strati, dura come una corazza leggera.

      {armi-da-mischia Media} Una lama di taglio scivola su quella seta come
      sul cuoio bagnato. Ci vorrebbe una punta molto decisa per passarla.

      Le misure, ti dice, non le ha prese perché ti ha visto passare in
      corridoio abbastanza volte. Ti aiuta a infilarlo, e ti sta come se
      l'avessi sempre portato.
    opzioni:
      - testo: "Ringraziarla"
        descrizione: "Lo indossi, e lei ti gira intorno con gli occhi socchiusi."
        costo: 0
        esito:
          titolo: Gli spilli
          testo: |
            La sarta si toglie gli spilli di bocca per la prima volta. In Via dei
            Rasoi, ti dice, chi lo vede saprà da dove viene, ed è per questo che
            l'ha cucito nero. Poi ti spinge fuori, perché ha un orlo da finire.
          pe: { galateo: 3 }

  # ------------------------------------------------------------ dopo il passo 15 · Laure sulla soglia
  - id: maison-laure-sulla-soglia
    presso: via-dei-rasoi
    immagine: ambientazione/laresh
    titolo: Laure sulla soglia
    sommario: "Laure ti aspetta sulla porta della Maison con una borsa da viaggio ai piedi e un libro chiuso in mano."
    luogo: Via dei Rasoi, all'alba
    area: citta-bassa
    requisiti: [fazione.maison >= 15, maison.mare == 1, maison.laure == 0]
    testo: |
      All'alba Laure ti aspetta sulla soglia della Maison con una borsa di
      tela ai piedi e il solito libro contro il petto, e le scarpe da strada
      che non le avevi mai visto. Verso il Ponte del Pesce si sentono già i
      carri della prima carovana per Laresh.

      «Me l'hai fatto venire in mente tu, quella notte, con il tuo mare»
      dice. «Ho messo da parte abbastanza per arrivare a Laresh, e da lì una
      chiatta scende fino alla costa. Ogni volta che stavo per spendere i
      risparmi per qualcun altro mi ricordavo di quella notte, e me li
      tenevo.»

      {empatia Facile} Ha la paura di chi sta per andare, che è l'unica
      buona.
    opzioni:
      - testo: "Darle qualche moneta per il viaggio"
        descrizione: "Una chiatta costa più di quanto pensi, e i mari sono lontani."
        requisiti: [monete >= 20]
        costo: 0
        esito:
          titolo: La borsa
          testo: |
            Lei ti rende la borsa di monete due volte, e alla terza la prende,
            arrossendo. Ti abbraccia in fretta, con il libro schiacciato fra voi,
            e se ne va verso il Ponte del Pesce senza voltarsi. Sulla porta Sara
            ti chiama per nome, con la voce un po' rotta.
          imposta: { maison.laure: 1 }
          effetti: { monete: -20, rep.maison: 0.5 }
      - testo: "Raccontarle un altro mare"
        descrizione: "Uno solo, ancora, per la strada."
        costo: 0
        esito:
          titolo: Un altro mare
          testo: |
            Le racconti di un mare così chiaro che si vedono i pesci a dieci braccia, e forse te
            lo stai inventando, e lei questo non te lo chiede. Ti dà un bacio sulla guancia e se
            ne va verso il Ponte del Pesce con la borsa in spalla. In fondo alla strada si volta
            una volta sola e alza il libro per salutarti.
          pe: { espressivita: 5 }
          imposta: { maison.laure: 1 }
