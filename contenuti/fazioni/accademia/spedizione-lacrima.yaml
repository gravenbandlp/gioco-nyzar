# La Lacrima pietrificata, spedizione del passo 12 della quest dell'Accademia (fazione.accademia == 11).
# Ci si entra dalla Superficie Fratturata con «Le torbiere a nord del Torvessa». Le stanze vanno in fasce di
# profondità, e una stanza superata non ricompare nella stessa visita:
# 0 le torbiere (i cercatori di torba; i solchi dei carri della Gilda),
# 1 la collina (le falene, che valgono anche a 2; il campo dei tagliatori della Gilda; il novizio del Velo, che
#   imposta accademia.custode),
# 2 la collina scavata (i cunicoli nella torba; il gelo),
# 3 sotto la Lacrima (le falene morte; il fumo vecchio).
# Il cuore a 4 è la goccia che non cade: si misura la Lacrima (accademia.lacrima 1), la si segna per la Gilda (2) o
# la si sigilla per il Velo (3). Il passo si chiude in città con «Il consiglio ristretto» (passi-3.yaml).
aree:
  - id: accademia-lacrima-pietrificata
    immagine: ambientazione/mito-occhio-nel-cristallo
    nome: La Lacrima pietrificata
    sommario: "Una collina di torba oltre le torbiere a nord del Torvessa, con dentro un cristallo gelato lungo quanto un cavallo e le falene morte alla base."
    spedizione: { ritorno: superficie-fratturata, soglia: 4, stanze: 3 }
    testo: |
      Oltre le torbiere a nord del Torvessa la terra si alza in una collina
      bassa e scura, tutta di torba, con l'erba rada che cresce a ciuffi. Sul
      fianco della collina spunta di traverso un cristallo lungo quanto un
      cavallo, conficcato nella torba come una goccia caduta da molto in
      alto e rimasta lì. Intorno al cristallo l'aria è fredda anche a
      mezzogiorno, e la torba è coperta di brina. Alla base ci sono strati di falene morte, e ogni notte ne arrivano altre.

storylet:
  # ------------------------------------------------------------ l'ingresso, nella Superficie
  - id: accademia-le-torbiere-a-nord
    immagine: ambientazione/mito-occhio-nel-cristallo
    titolo: Le torbiere a nord del Torvessa
    sommario: "Il Consiglio ha autorizzato il sopralluogo. La Lacrima pietrificata è oltre le torbiere, e una squadra della Gilda ci è già arrivata."
    luogo: Superficie Fratturata, la strada delle torbiere
    area: superficie-fratturata
    requisiti: [fazione.accademia == 11, accademia.lacrima == 0]
    testo: |
      La strada delle torbiere lascia il Torvessa dove il fiume piega a
      est e prosegue dritta fra i canali scuri, su un argine di terra battuta
      appena più alto dell'acqua. Ai lati i cercatori di torba tagliano
      mattoni neri con le vanghe piatte e li mettono a seccare in file,
      come pane sul davanzale. In fondo, contro il cielo grigio, si vede la
      collina, e sul fianco della collina un luccichio.

      Tobol cammina accanto a te con la mappa arrotolata sotto il braccio e
      Whisp infilato nel colletto per il freddo. «Il cristallo più grande
      della regione» dice. «L'ho segnato sulla carta quarant'anni fa, con
      un punto interrogativo, e nessuno mi ha mai chiesto perché.»

      {natura Media} Sulla strada ci sono i solchi freschi di un carro
      pesante, e le orme di sei o sette uomini con gli stivali chiodati.
      Qualcuno è passato di qui da pochi giorni.

      {origine figlio-del-circolo} Al Circolo le torbiere le chiamano la
      terra che ricorda, perché ci si trovano dentro le cose intere, anche
      dopo cent'anni. Ti viene da camminarci sopra più piano.
    opzioni:
      - testo: "Andare verso la collina"
        descrizione: "Mezza giornata di argini, e poi la torba."
        costo: 1
        esito:
          titolo: L'argine
          testo: |
            Seguite l'argine fino a dove la torba comincia a salire. L'aria si
            fa fredda di colpo, come quando si apre la porta di una cantina, e
            sul fianco della collina il luccichio diventa una forma lunga e
            azzurra.
          vai: accademia-lacrima-pietrificata
      - testo: "Tornare indietro"
        descrizione: "La Lacrima è lì da secoli. Il sopralluogo si può rimandare."
        costo: 0
        esito:
          titolo: Un altro giorno
          testo: |
            Dici a Tobol che si torna un altro giorno, e lui arrotola la mappa
            senza protestare. Whisp, dal colletto, ti guarda con un occhio
            solo per tutta la strada.

  # ------------------------------------------------------------ 0 · le torbiere
  - id: accademia-lacrima-i-cercatori-di-torba
    immagine: ambientazione/palude-acquanera
    titolo: I cercatori di torba
    sommario: "Una famiglia di cercatori di torba lavora sull'ultimo canale prima della collina. Ti indicano la strada, e ti dicono di non andarci."
    luogo: La Lacrima pietrificata, l'ultimo canale
    area: accademia-lacrima-pietrificata
    ripetibile: true
    requisiti: [fazione.accademia == 11, accademia.lacrima == 0, profondita.accademia-lacrima-pietrificata == 0]
    testo: |
      Sull'ultimo canale prima della collina una famiglia di cercatori di
      torba taglia mattoni neri, il padre con la vanga e due ragazzi a
      impilarli. La madre li conta ad alta voce. Quando vi vedono smettono
      tutti insieme, e il padre si appoggia alla vanga.

      «Alla collina?» chiede, e guarda la mappa di Tobol. «Di notte la pietra
      chiama le falene, e di giorno chiama la gente. Quelli della Gilda ci
      sono andati sei giorni fa e uno è tornato indietro senza voce.»

      {conoscenze-della-strada Media} Ha detto sei giorni, e i solchi del
      carro sono di due. La Gilda è andata e tornata, e adesso è di nuovo
      lassù.

      {empatia Facile} Il ragazzo più piccolo guarda la collina come si
      guarda una cosa proibita e bellissima, e la madre lo tiene per la
      spalla.
    opzioni:
      - testo: "Chiedere da che parte si sale"
        descrizione: "I cercatori conoscono la torba meglio di qualunque mappa. Bisogna farseli amici."
        prova: { attributo: sociale, abilita: conoscenze-della-strada, difficolta: Media }
        successo:
          titolo: La strada dei mattoni
          testo: |
            Il padre ti mostra un sentiero di mattoni di torba posati sulla
            fanghiglia, che i ragazzi rifanno ogni primavera, e ti avverte di
            non fermarti sulla brina. Il sentiero porta dritto al fianco della
            collina, dove la torba diventa dura.
          pe: { conoscenze-della-strada: 4 }
          effetti: { profondita.accademia-lacrima-pietrificata: 1 }
        fallimento:
          titolo: La vanga
          testo: |
            Il padre ti risponde che la strada la sa chi ci lavora, e torna a
            tagliare la torba. La madre vi segue con gli occhi finché non
            tornate sull'argine.
          effetti: { tormento: 0.5 }

      - testo: "Leggere la torba da soli"
        descrizione: "Nella torba scura e lucida si affonda, mentre quella grigia regge il peso."
        prova: { attributo: mentale, abilita: natura, difficolta: Media }
        successo:
          titolo: La torba grigia
          testo: |
            Cammini sulla torba grigia e secca, saltando le pozze lucide, con
            Tobol che mette i piedi nelle tue orme. In un'ora siete ai piedi
            della collina, con gli stivali sporchi solo fino alla caviglia.
          pe: { natura: 5 }
          effetti: { profondita.accademia-lacrima-pietrificata: 1 }
        fallimento:
          titolo: Fino al ginocchio
          testo: |
            Una pozza che sembrava grigia ti inghiotte fino al ginocchio, e il
            ragazzo più piccolo dei cercatori viene a tirarti fuori ridendo.
          effetti: { ferite: 0.5 }

  - id: accademia-lacrima-i-solchi-dei-carri
    immagine: ambientazione/palude-acquanera
    titolo: I solchi dei carri
    sommario: "I solchi del carro della Gilda vanno dritti verso la collina. Chi li ha lasciati non aveva paura di farsi seguire."
    luogo: La Lacrima pietrificata, l'argine
    area: accademia-lacrima-pietrificata
    ripetibile: true
    requisiti: [fazione.accademia == 11, accademia.lacrima == 0, profondita.accademia-lacrima-pietrificata == 0]
    testo: |
      Dove finisce l'argine i solchi del carro della Gilda girano a destra,
      su una massicciata di pietre buttate nella torba per farci passare le
      ruote. Ai lati ci sono i segni delle vanghe e i resti di un fuoco, e un
      paio di guanti grigi dimenticati su una pietra.

      {percezione Media} I guanti sono di pelle fine, cuciti a mano, troppo
      belli per un tagliatore. Li ha persi qualcuno che non lavora con le
      mani.

      {resistenza Facile} Il freddo della collina arriva fin qui e ti entra
      nelle dita. Ti viene voglia di quei guanti, e te ne vergogni appena.
    opzioni:
      - testo: "Seguire la massicciata"
        descrizione: "Le pietre della Gilda reggono un carro. Reggono anche te."
        prova: { attributo: mentale, abilita: percezione, difficolta: Facile }
        successo:
          titolo: La massicciata
          testo: |
            Segui la massicciata pietra per pietra, attento a quelle che
            ballano, e arrivi ai piedi della collina prima di Tobol, che si
            ferma a misurare tutto. In cima alla massicciata c'è una tenda, e
            del fumo.
          pe: { percezione: 4 }
          effetti: { profondita.accademia-lacrima-pietrificata: 1 }
        fallimento:
          titolo: La pietra che balla
          testo: |
            Una pietra si gira sotto il piede, e tu finisci con una gamba nella
            torba fino all'anca. Tobol ti tira fuori con il manico della mappa.
          effetti: { ferite: 0.5 }

      - testo: "Prendere i guanti e tenerli"
        descrizione: "Guanti grigi di pelle fine. A qualcuno mancheranno, e forse vorrà sapere chi li ha."
        esito:
          titolo: I guanti grigi
          testo: |
            Ti metti in tasca i guanti grigi, che odorano di un profumo da
            Quartieri Alti, e segui i solchi fino ai piedi della collina. Tobol ti guarda le tasche e alza le sopracciglia fin sopra gli occhiali.
          effetti: { profondita.accademia-lacrima-pietrificata: 1, informazioni.voce: 1 }

  # ------------------------------------------------------------ 1 · la collina
  - id: accademia-lacrima-le-falene
    immagine: icone/butterfly
    titolo: Le falene
    sommario: "Uno sciame di falene grigie si alza dalla torba e va dritto verso qualunque luce, comprese le tue."
    luogo: La Lacrima pietrificata, il fianco della collina
    area: accademia-lacrima-pietrificata
    ripetibile: true
    requisiti: [fazione.accademia == 11, accademia.lacrima == 0, profondita.accademia-lacrima-pietrificata >= 1, profondita.accademia-lacrima-pietrificata <= 2]
    testo: |
      Sul fianco della collina la torba è piena di buchi piccoli, e quando
      ci passi vicino ne esce un fruscio. Poi lo sciame si alza tutto
      insieme, migliaia di falene grigie con le ali polverose, e ti viene
      addosso. Ti si posano sulla faccia e sulle mani, ti entrano nel
      colletto e vanno a sbattere contro la lampada di Tobol fino a
      spegnerla.

      {natura Media} Vanno verso la luce, e la luce più forte della collina
      è la Lacrima. Tu sei soltanto sulla strada.

      {resistenza Media fallita} Ti viene da tossire, e ogni respiro ti
      riempie la bocca di polvere d'ala.
    opzioni:
      - testo: "Portarle via con la Luce fredda"
        descrizione: "Una luce fredda lanciata lontano lungo il pendio. Le falene la seguiranno."
        incantesimo: luce-fredda
        prova: { attributo: mentale, abilita: magia, difficolta: Facile }
        successo:
          titolo: La luce lontana
          testo: |
            Accendi la Luce fredda sul palmo e la lanci giù per il pendio, verso
            i canali. Lo sciame si gira in un fruscio solo e la insegue,
            lasciandovi la collina libera e una polvere grigia sulle maniche.
          pe: { magia: 4 }
          effetti: { profondita.accademia-lacrima-pietrificata: 1 }
        fallimento:
          titolo: La luce sulla mano
          testo: |
            La luce ti resta attaccata al palmo invece di partire, e lo sciame
            ti si posa tutto sul braccio. Scappi giù per il pendio sventolando
            la mano come una bandiera.
          effetti: { tormento: 0.5 }

      - testo: "Tenere la testa bassa e salire lo stesso"
        descrizione: "Sono falene, e una per una non pesano niente. Bisogna sopportarle fino in cima."
        prova: { attributo: fisico, abilita: resistenza, difficolta: Media }
        successo:
          titolo: La polvere d'ala
          testo: |
            Sali con la sciarpa sulla bocca e gli occhi socchiusi, lasciandoti
            le falene addosso. Arrivato più in alto lo sciame ti lascia per
            tornare alla Lacrima, e tu sputi polvere grigia per un pezzo.
          pe: { resistenza: 4 }
          effetti: { profondita.accademia-lacrima-pietrificata: 1 }
        fallimento:
          titolo: La tosse
          testo: |
            La polvere ti entra in gola e la tosse ti piega in due. Torni giù
            al canale a sciacquarti la bocca, con Tobol che ti batte la schiena.
          effetti: { ferite: 0.5 }

      - testo: "Scacciarle a colpi di mantello"
        descrizione: "Sono tante, e deboli. Se le spingi abbastanza, se ne vanno da un'altra parte."
        combattimento: accademia-le-falene
        vittoria:
          titolo: Il mantello
          testo: |
            Mulini il mantello finché lo sciame non si disfa e si sparpaglia
            sulla torba. Hai le braccia stanche e il mantello grigio di polvere,
            e la collina davanti è libera.
          effetti: { profondita.accademia-lacrima-pietrificata: 1 }
        sconfitta:
          titolo: Dentro lo sciame
          testo: |
            Lo sciame ti avvolge, e per un tempo che sembra lunghissimo vedi
            soltanto ali grigie. Ti ritrovi al canale, senza ricordare di averlo
            raggiunto.
          effetti: { tormento: 0.5, ferite: 0.5 }

  - id: accademia-lacrima-il-campo-dei-tagliatori
    immagine: fazioni/gilda-dei-mercanti
    titolo: Il campo dei tagliatori
    sommario: "Una tenda della Gilda, un carro con i paranchi e due balestrieri che guardano chi sale. La Gilda è arrivata prima."
    luogo: La Lacrima pietrificata, il campo della Gilda
    area: accademia-lacrima-pietrificata
    ripetibile: true
    requisiti: [fazione.accademia == 11, accademia.lacrima == 0, profondita.accademia-lacrima-pietrificata == 1]
    testo: |
      A mezza costa la Gilda ha piantato una tenda grande e un carro con i
      paranchi, e sulla torba ci sono picchetti con nastri gialli che
      segnano una strada fino alla Lacrima. Tre tagliatori affilano scalpelli
      intorno al fuoco. Due balestrieri con i mantelli dei Custodi stanno in
      piedi sul limite del campo, e quando ti vedono uno dei due carica la
      balestra senza fretta.

      {armi-da-distanza Media} Una balestra caricata davanti a te è un
      avviso. Se te la puntasse addosso, il balestriere starebbe tenendo il
      calcio più in alto.

      «Il sopralluogo lo fa la Gilda» dice il capo dei tagliatori, un uomo
      basso con i baffi gialli di tabacco. «Ordine della Casa dei Nodi. Voi
      potete guardare da qui.»

      {origine mercante-dei-ponti} Il capo dei tagliatori lo conosci di vista
      dai Ponti, dove vende scalpelli usati come se fossero nuovi, e anche lui si ricorda di te.
    opzioni:
      - testo: "Convincerli che il Consiglio ha autorizzato anche voi"
        descrizione: "Il sopralluogo l'ha autorizzato il Consiglio, non la Casa dei Nodi. Bisogna spiegarlo senza alzare la voce."
        prova: { attributo: sociale, abilita: persuasione, difficolta: Media }
        successo:
          titolo: Il sigillo del Municipio
          testo: |
            Mostri al capo dei tagliatori la carta con il sigillo del Municipio
            e gli spieghi chi l'ha firmata. Lui la legge due volte e sputa nel fuoco. Poi fa abbassare le balestre. «Guardate quello che volete. Tanto
            la pietra se la portiamo a casa noi» dice.
          pe: { persuasione: 5 }
          effetti: { profondita.accademia-lacrima-pietrificata: 1 }
        fallimento:
          titolo: La balestra
          testo: |
            Il capo dei tagliatori ti ascolta fino in fondo, poi fa un cenno al
            balestriere, che ti tira una quadrella ai piedi. Tornate giù per il
            pendio, e dietro di voi i tagliatori ridono.
          effetti: { ferite: 0.5 }

      - testo: "Mostrare la licenza della Gilda"
        descrizione: "Chi ha la licenza della Gilda è un socio, e un socio sale dove vuole."
        requisiti: [licenza-gilda >= 1]
        esito:
          titolo: Fra soci
          testo: |
            Mostri la licenza, e il capo dei tagliatori si toglie il cappello.
            Ti offre anche il tè, nero come la torba. Poi fa togliere un
            picchetto per lasciarti passare.
          effetti: { profondita.accademia-lacrima-pietrificata: 1 }

      - testo: "Passare da amico della Gilda"
        descrizione: "Alla Casa dei Nodi il tuo nome lo conoscono, e lo conoscono bene."
        requisiti: [rep.gilda >= 3]
        esito:
          titolo: Il nome giusto
          testo: |
            Dici il tuo nome, e il capo dei tagliatori lo ripete a voce bassa,
            poi fa abbassare le balestre. Ti accompagna lui fino all'ultimo
            picchetto, parlando del tempo.
          effetti: { profondita.accademia-lacrima-pietrificata: 1 }

      - testo: "Forzare il passaggio"
        descrizione: "Sono due balestrieri. Se la Gilda vuole la Lacrima, che venga a prendersela dopo."
        combattimento: accademia-i-balestrieri-della-gilda
        vittoria:
          titolo: Le balestre nella torba
          testo: |
            I due balestrieri finiscono nella torba, uno con la balestra
            spezzata, e i tagliatori alzano le mani prima che tu glielo chieda.
            Passi oltre i picchetti, e alla Casa dei Nodi stasera qualcuno
            scriverà il tuo nome.
          effetti: { profondita.accademia-lacrima-pietrificata: 1, rep.gilda: -1 }
        sconfitta:
          titolo: Le quadrelle
          testo: |
            Una quadrella ti prende alla coscia, e devi tornare giù fino al
            canale con Tobol che ti regge. I balestrieri non vi inseguono.
          effetti: { ferite: 1 }

      - testo: "Aggirare il campo dal lato in ombra"
        descrizione: "Sul lato nord della collina la brina scivola, e per questo lassù non ci va nessuno. Ci vuole tempo."
        costo: 2
        esito:
          titolo: Il lato in ombra
          testo: |
            Giri la collina dal lato nord, dove la torba è coperta di brina e
            scivola come vetro. Ci metti il pomeriggio intero. Quando sbuchi
            sopra il campo della Gilda i tagliatori sono di spalle, e tu sei
            già oltre.
          pe: { furtivita: 2 }
          effetti: { profondita.accademia-lacrima-pietrificata: 1 }

  - id: accademia-lacrima-il-novizio-del-velo
    immagine: ambientazione/cattedrale-del-velo
    titolo: Il novizio del Velo
    sommario: "Su un sasso, avvolto in un mantello nero, un novizio del Velo guarda la Lacrima e prende appunti."
    luogo: La Lacrima pietrificata, un sasso sul fianco della collina
    area: accademia-lacrima-pietrificata
    ripetibile: true
    requisiti: [fazione.accademia == 11, accademia.lacrima == 0, profondita.accademia-lacrima-pietrificata == 1]
    testo: |
      Su un sasso piatto, poco sotto la brina, siede un ragazzo con il
      mantello nero dei novizi del Velo e una tavoletta di cera sulle
      ginocchia. Ha il naso rosso di freddo e le dita viola. Guarda la
      Lacrima e ogni tanto incide un segno sulla cera, e quando ti vede
      arrivare nasconde la tavoletta sotto il mantello.

      «Mi ha mandato Ottilia Sanvel» dice, prima che tu glielo chieda. «Devo
      guardare e basta. Contare le falene, e chi sale.»

      {empatia Media} È qui da giorni, e ha paura della collina più di quanto
      abbia paura di te. Gli manca la voce di qualcuno.

      {origine accolito-del-velo} Lo conosci. Era nella fila dietro la tua
      agli esercizi dell'alba, e cantava sempre mezzo tono sotto.
    opzioni:
      - testo: "Sedersi con lui e farlo parlare"
        descrizione: "Un ragazzo solo con il freddo addosso. Basta un po' di pane e qualche domanda."
        prova: { attributo: sociale, abilita: empatia, difficolta: Media }
        successo:
          titolo: Le falene contate
          testo: |
            Dividi il pane con lui, e lui ti mostra la tavoletta. Conta le
            falene morte ogni mattina, e sono sempre di più. Ottilia vuole sapere
            se la Lacrima va sigillata, e lui crede di sì. Ti insegna il sentiero
            che sale senza passare dalla brina, e ti dice che se la vuoi
            chiudere, lui conosce le parole.
          pe: { empatia: 5 }
          imposta: { accademia.custode: 1 }
          effetti: { profondita.accademia-lacrima-pietrificata: 1 }
        fallimento:
          titolo: La tavoletta
          testo: |
            Gli fai una domanda di troppo, e lui si chiude nel mantello. Ti dice
            che deve parlare solo con Ottilia, e torna a guardare la Lacrima.

      - testo: "Salutarlo come in Cattedrale"
        descrizione: "La formula del chiostro, quella che si scambiano i novizi all'alba. Lui la riconoscerà."
        quando: [origine.accolito-del-velo >= 1]
        esito:
          titolo: Mezzo tono sotto
          testo: |
            Gli dici la formula dell'alba, e lui risponde mezzo tono sotto, come
            sempre. Poi ride, e per un momento non ha più freddo. Ti insegna il
            sentiero che sale senza passare dalla brina, e ti dice che se la vuoi
            chiudere, la Lacrima, lui conosce le parole.
          pe: { empatia: 5 }
          imposta: { accademia.custode: 1 }
          effetti: { profondita.accademia-lacrima-pietrificata: 1 }

      - testo: "Lasciarlo ai suoi conti e salire"
        descrizione: "È un novizio con una tavoletta, e fermarti non è affar suo."
        esito:
          titolo: Il segno sulla cera
          testo: |
            Gli passi accanto senza fermarti, e lo senti incidere un segno sulla
            cera mentre sali. Ottilia saprà che sei passato prima di sera.
          effetti: { profondita.accademia-lacrima-pietrificata: 1 }

  # ------------------------------------------------------------ 2 · la collina scavata
  - id: accademia-lacrima-i-cunicoli
    immagine: ambientazione/palude-acquanera
    titolo: I cunicoli nella torba
    sommario: "La collina è scavata da cunicoli stretti, vecchi, che salgono verso la Lacrima da sotto."
    luogo: La Lacrima pietrificata, dentro la collina
    area: accademia-lacrima-pietrificata
    ripetibile: true
    requisiti: [fazione.accademia == 11, accademia.lacrima == 0, profondita.accademia-lacrima-pietrificata == 2]
    testo: |
      Sotto la brina la collina è bucata da cunicoli stretti, scavati nella
      torba da qualcuno molto tempo fa, con le pareti che conservano i segni
      delle vanghe. Salgono verso la Lacrima da sotto, e dentro fa meno
      freddo che fuori. In un cunicolo c'è ancora una vanga di legno annerita, intera come se l'avessero posata ieri.

      {natura Facile} La torba conserva tutto. Quella vanga può avere cento
      anni, e il legno non lo sa.

      {atletica Media} I cunicoli salgono ripidi e sono stretti di spalle. Si
      sale con i gomiti e con le ginocchia, e si scende di schiena.
    opzioni:
      - testo: "Salire dentro i cunicoli"
        descrizione: "Gomiti e ginocchia, e la torba che si sbriciola in faccia. Sotto la Lacrima, però, si arriva."
        prova: { attributo: fisico, abilita: atletica, difficolta: Media }
        successo:
          titolo: Sotto la Lacrima
          testo: |
            Sali a forza di gomiti per un cunicolo che si stringe e poi si
            allarga di colpo, e sbuchi in una cavità della torba proprio sotto la
            Lacrima. Sopra la tua testa c'è il cristallo azzurro che gocciola brina.
          pe: { atletica: 5 }
          effetti: { profondita.accademia-lacrima-pietrificata: 1 }
        fallimento:
          titolo: Di schiena
          testo: |
            A metà cunicolo la torba ti cede sotto il gomito, e scivoli giù di
            schiena fino all'imbocco, con la bocca piena di terra nera.
          effetti: { ferite: 0.5 }

      - testo: "Seguire la vanga vecchia"
        descrizione: "Chi ha lasciato la vanga sapeva dove andava. Il suo cunicolo sarà quello giusto."
        prova: { attributo: mentale, abilita: percezione, difficolta: Media }
        successo:
          titolo: Il cunicolo della vanga
          testo: |
            Il cunicolo della vanga è il più largo e il meno ripido, con i
            gradini scavati nella torba. Lo sali in piedi, con la testa appena chinata, e arrivi sotto la Lacrima con le gambe ancora buone.
          pe: { percezione: 5 }
          effetti: { profondita.accademia-lacrima-pietrificata: 1 }
        fallimento:
          titolo: Il cunicolo cieco
          testo: |
            Il cunicolo della vanga finisce contro un muro di torba dura, e devi
            tornare indietro carponi per un tratto lungo.
          effetti: { tormento: 0.5 }

  - id: accademia-lacrima-il-gelo
    immagine: ambientazione/mito-occhio-nel-cristallo
    titolo: Il gelo
    sommario: "Vicino alla Lacrima la torba è gelata, e chi tocca la pietra ci resta attaccato."
    luogo: La Lacrima pietrificata, la brina
    area: accademia-lacrima-pietrificata
    ripetibile: true
    requisiti: [fazione.accademia == 11, accademia.lacrima == 0, profondita.accademia-lacrima-pietrificata == 2]
    testo: |
      Sopra la brina la torba è dura come pietra, e il freddo ti morde le
      orecchie. Per salire devi appoggiare le mani sulle rocce di cristallo
      che spuntano dal suolo, schegge della Lacrima grandi come pugni, e
      ogni scheggia è gelata.

      {resistenza Media} Il freddo così forte fa male soltanto all'inizio.
      Poi le dita diventano di legno, ed è peggio.

      {origine fuggiasco-di-ghoran} Nelle notti d'inverno sulla strada da Ghoran hai imparato a tenere le mani sotto le ascelle fino all'ultimo momento, e lo fai anche adesso senza pensarci.

      Tobol si avvolge la cravatta intorno alle dita e la usa come guanto.
    opzioni:
      - testo: "Salire con le mani nude"
        descrizione: "Un appoggio alla volta, e mai fermi. Il freddo vince chi si ferma."
        prova: { attributo: fisico, abilita: resistenza, difficolta: Media }
        successo:
          titolo: Le dita di legno
          testo: |
            Sali senza fermarti, un appoggio dopo l'altro, e il freddo non fa in
            tempo a prenderti le mani. In cima ti infili le dita in bocca, e ci
            mettono un pezzo a ricordarsi di essere tue.
          pe: { resistenza: 5 }
          effetti: { profondita.accademia-lacrima-pietrificata: 1 }
        fallimento:
          titolo: La mano attaccata
          testo: |
            Ti fermi un momento di troppo, e la mano ti resta attaccata al
            cristallo. Te la stacchi lasciandoci sopra un pezzo di pelle, e
            torni giù con il palmo che sanguina.
          effetti: { ferite: 0.5 }

      - testo: "Fasciarsi le mani e salire piano"
        descrizione: "Stracci, cuoio, la cravatta di Tobol se serve. Si sale più lenti, ma con le dita intere."
        costo: 2
        esito:
          titolo: Le fasce
          testo: |
            Ti fasci le mani con le maniche della camicia e una striscia di
            cuoio della borsa, e sali un passo alla volta. Ci metti il doppio
            del tempo. In cima Tobol ti restituisce un pezzo di cravatta che non
            gli serve più.
          pe: { resistenza: 2 }
          effetti: { profondita.accademia-lacrima-pietrificata: 1 }

  # ------------------------------------------------------------ 3 · sotto la Lacrima
  - id: accademia-lacrima-le-falene-morte
    immagine: icone/butterfly
    titolo: Le falene morte
    sommario: "Alla base della Lacrima le falene morte fanno uno strato spesso come un tappeto, e hanno tutte la bocca aperta."
    luogo: La Lacrima pietrificata, alla base del cristallo
    area: accademia-lacrima-pietrificata
    ripetibile: true
    requisiti: [fazione.accademia == 11, accademia.lacrima == 0, profondita.accademia-lacrima-pietrificata == 3]
    testo: |
      Alla base della Lacrima le falene morte fanno uno strato spesso un
      palmo, grigio, che scricchiola sotto gli stivali. Sono morte tutte
      nella stessa posizione, con le ali aperte verso il cristallo. Nell'aria
      c'è un odore dolce che non riconosci, metallico, che ti si posa sulla
      lingua.

      {medicina Media} Hanno la bocca aperta, e dentro c'è una polvere bianca.
      È la stessa polvere che lascia il fumo di un cristallo imploso, e il
      sapore di metallo dolce viene da lì.

      Tobol si copre il naso con la mano e dice che quarant'anni fa le falene
      non c'erano.
    opzioni:
      - testo: "Esaminare le falene"
        descrizione: "La polvere bianca nella bocca delle falene viene da qualche parte. Saperlo può servire."
        prova: { attributo: mentale, abilita: medicina, difficolta: Media }
        successo:
          titolo: La polvere bianca
          testo: |
            Apri la bocca di una falena con la punta di un coltello e annusi la
            polvere. È fumo di cristallo, recente. Pochi giorni fa qualcuno ha provato a staccare un pezzo della Lacrima, e il pezzo è imploso. Lo dici a Tobol, che guarda verso il campo della Gilda.
          pe: { medicina: 5 }
          effetti: { profondita.accademia-lacrima-pietrificata: 1, informazioni.pettegolezzo: 1 }
        fallimento:
          titolo: Il sapore
          testo: |
            Ti avvicini troppo, e la polvere ti va in gola. Per qualche ora le
            parole ti escono storte, come se avessi la lingua di un altro.
          effetti: { tormento: 0.5 }

      - testo: "Camminare sopra le falene fino al cristallo"
        descrizione: "Sono morte. Basta non pensarci."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Facile }
        successo:
          titolo: Lo scricchiolio
          testo: |
            Cammini sopra lo strato di falene fino alla Lacrima, e a ogni passo
            lo scricchiolio ti sale lungo le gambe. Non ti fermi finché non hai
            il cristallo a un braccio dalla faccia.
          pe: { resilienza: 4 }
          effetti: { profondita.accademia-lacrima-pietrificata: 1 }
        fallimento:
          titolo: Un passo indietro
          testo: |
            Al terzo passo lo scricchiolio ti fa venire la nausea, e torni
            indietro fino alla torba nuda.
          effetti: { tormento: 0.5 }

  - id: accademia-lacrima-il-fumo-vecchio
    immagine: ambientazione/mito-occhio-nel-cristallo
    titolo: Il fumo vecchio
    sommario: "Su un lato della Lacrima c'è una ferita fresca, e da lì esce un fumo lattiginoso che non si disperde."
    luogo: La Lacrima pietrificata, il lato della ferita
    area: accademia-lacrima-pietrificata
    ripetibile: true
    requisiti: [fazione.accademia == 11, accademia.lacrima == 0, profondita.accademia-lacrima-pietrificata == 3]
    testo: |
      Sul lato della Lacrima che guarda il campo della Gilda c'è una ferita,
      un incavo grande come una testa dove qualcuno ha provato a staccare una
      scheggia. Dall'incavo esce un fumo lattiginoso, lento, che invece di
      disperdersi resta sospeso a mezz'aria, in una nuvola bassa.

      {magia Media} Il fumo è Mana spezzato. Chi lo respira perde le parole
      per un po', e qualcuno per sempre.

      {acrobazia Facile} Per arrivare al cristallo da questo lato bisogna
      passare sotto la nuvola, quasi strisciando, senza toccarla con la
      schiena.
    opzioni:
      - testo: "Passare sotto il fumo trattenendo il fiato"
        descrizione: "Una nuvola bassa e lenta, che fa male soltanto a chi la respira."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Media }
        successo:
          titolo: Il fiato trattenuto
          testo: |
            Trattieni il fiato e passi sotto la nuvola a quattro zampe, con il
            sapore di metallo dolce che ti arriva lo stesso sulla lingua. Di là
            respiri a fondo, e il cristallo è a un passo.
          pe: { resilienza: 5 }
          effetti: { profondita.accademia-lacrima-pietrificata: 1 }
        fallimento:
          titolo: Senza parole
          testo: |
            Respiri a metà strada, e il fumo ti entra in gola. Per mezza giornata
            non riesci a dire una parola intera, e Tobol parla per tutti e due.
          effetti: { tormento: 1 }

      - testo: "Strisciare sotto la nuvola"
        descrizione: "Pancia a terra, e la schiena lontana dal fumo."
        prova: { attributo: fisico, abilita: acrobazia, difficolta: Media }
        successo:
          titolo: Pancia a terra
          testo: |
            Strisci sulla brina con la pancia a terra, e il fumo ti passa sopra
            la schiena a un palmo di distanza. Di là ti rialzi con la giubba
            bagnata e il cristallo davanti.
          pe: { acrobazia: 5 }
          effetti: { profondita.accademia-lacrima-pietrificata: 1 }
        fallimento:
          titolo: La schiena
          testo: |
            Alzi la schiena di un niente, e il fumo ti si posa addosso come
            una coperta. Torni indietro tossendo.
          effetti: { tormento: 0.5, ferite: 0.5 }

  # ------------------------------------------------------------ 4 · il cuore: la goccia che non cade
  - id: accademia-lacrima-la-goccia-che-non-cade
    immagine: ambientazione/mito-occhio-nel-cristallo
    titolo: La goccia che non cade
    sommario: "Davanti alla Lacrima pietrificata, nel freddo. Dentro il cristallo qualcosa si muove quando ti muovi tu."
    luogo: La Lacrima pietrificata, davanti al cristallo
    area: accademia-lacrima-pietrificata
    requisiti: [fazione.accademia == 11, accademia.lacrima == 0, profondita.accademia-lacrima-pietrificata >= 4]
    testo: |
      Da vicino la Lacrima è più grande di come sembrava dall'argine, lunga
      quanto un cavallo e larga quanto una botte, conficcata di traverso
      nella torba con la punta verso il cielo. Il cristallo è di un azzurro così chiaro che sembra bianco, e gocciola brina da tutti i lati senza consumarsi mai. Intorno c'è silenzio, e il silenzio ronza.

      Tobol si toglie gli occhiali e li pulisce sulla cravatta, poi se li
      rimette e li ripulisce.

      {magia Difficile} La Lacrima è piena come la Vecchia non è mai stata.
      Basterebbe alla condotta per una vita intera, e il Mana dentro gira in
      tondo, lento, intorno a un punto.

      Se ti sposti verso destra, al centro del cristallo un punto più scuro
      si sposta con te. Se torni indietro, torna anche lui. Ha la forma di un
      occhio, e ti segue.

      {resilienza Difficile fallita} Lo guardi troppo a lungo, e ti sembra
      che sia lui a guardare te da molto più lontano di qui, da sotto la
      collina, da sotto la città.

      {accademiche Media} L'Occhio nel Cristallo è una storia che le balie
      raccontano ai bambini. Si dice che chi prova a estrarlo fa implodere il
      cristallo.
    opzioni:
      - testo: "Misurare la Lacrima con Leggere il Mana"
        descrizione: "Quanta carica ha, e se reggerebbe la condotta. È quello che il Consiglio vuole sapere, e niente di più."
        incantesimo: leggere-il-mana
        prova: { attributo: mentale, abilita: magia, difficolta: Media }
        successo:
          titolo: Una vita intera
          testo: |
            Appoggi due dita sulla brina e lasci che il Mana della Lacrima ti
            racconti quanto è grande. È enorme e regolare, e reggerebbe la condotta di Qir-Azel per una vita. Scrivi le misure sul quaderno di
            Tobol, con le dita che tremano, e scendete dalla collina senza
            voltarvi verso l'occhio.
          pe: { magia: 6 }
          imposta: { accademia.lacrima: 1 }
          vai: superficie-fratturata
        fallimento:
          titolo: L'occhio
          testo: |
            Il Mana della Lacrima ti viene incontro troppo in fretta, e per un
            momento l'occhio al centro si avvicina. Ti stacchi di colpo, con il
            cuore in gola.
          effetti: { tormento: 1 }

      - testo: "Misurarla con gli strumenti di Tobol"
        descrizione: "Una corda graduata, un pendolo di ottone e la pazienza di un cartografo. Il Mana si misura anche dal freddo."
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Media }
        successo:
          titolo: Le misure
          testo: |
            Con la corda di Tobol misuri la Lacrima da un capo all'altro, e con
            il pendolo il freddo che le gira intorno. Tobol fa i conti sulla
            mappa e poi li rifà, perché il risultato gli sembra troppo grande. È
            giusto. La Lacrima reggerebbe la condotta per una vita. Scendete con
            le misure in tasca e l'occhio che vi guarda andare.
          pe: { tecnologia: 6 }
          imposta: { accademia.lacrima: 1 }
          vai: superficie-fratturata
        fallimento:
          titolo: Il pendolo fermo
          testo: |
            Il pendolo vicino al cristallo si ferma di traverso e non riparte.
            Tobol lo guarda a lungo e poi lo mette via, e ti dice di riprovare
            quando le mani non vi tremano.
          effetti: { tormento: 0.5 }

      - testo: "Staccare una scheggia per Orvald"
        descrizione: "Orvald vorrebbe un pezzo da studiare. La storia dell'occhio dice di non farlo, e la ferita sul fianco dice che qualcuno l'ha già fatto."
        prova: { attributo: fisico, abilita: acrobazia, difficolta: Difficile }
        successo:
          titolo: La scheggia
          testo: |
            Scegli una scheggia sul bordo lontano dall'occhio e la stacchi con un colpo secco di piccozza, tenendo il fiato. La scheggia resta
            intera e fredda nel palmo, senza fumo. La avvolgi nella cravatta di Tobol, che si lamenta a lungo. Poi scendete con le misure e il pezzo per Orvald.
          pe: { acrobazia: 6 }
          imposta: { accademia.lacrima: 1 }
          effetti: { reperto.sigillato: 1 }
          vai: superficie-fratturata
        fallimento:
          titolo: Il fumo lattiginoso
          testo: |
            La scheggia ti implode fra le dita con un rumore di vetro soffiato,
            e un fumo lattiginoso ti esce dalle mani e ti entra in bocca. Per
            giorni le parole ti escono a metà, e hai in bocca il sapore di
            metallo dolce. Tobol ti riporta giù per la collina tenendoti per il
            gomito, con le misure che ha preso lui mentre tu non c'eri.
          imposta: { accademia.lacrima: 1 }
          effetti: { tormento: 1, ferite: 0.5 }
          vai: superficie-fratturata

      - testo: "Segnarla per l'estrazione della Gilda"
        descrizione: "La squadra della Gilda ha i paranchi e il carro. Se la segni per loro, la Lacrima arriva in città, e la Gilda ne reclama la proprietà."
        esito:
          titolo: I nastri gialli
          testo: |
            Scendi al campo dei tagliatori e dici al capo che la Lacrima regge
            la condotta, e che il Consiglio ne avrà bisogno. Lui fa piantare i picchetti con il nastro giallo tutto intorno al cristallo, finché la Lacrima non è chiusa in un recinto della Gilda. Tobol ti guarda e arrotola la mappa. «La Casa dei Nodi ti scriverà una lettera di ringraziamento, e io al tuo posto la incornicerei» dice, senza sorridere.
          imposta: { accademia.lacrima: 2 }
          effetti: { rep.gilda: 1 }
          vai: superficie-fratturata

      - testo: "Sigillarla per il Velo"
        descrizione: "Il Sigillo chiude il Mana dentro la pietra. La Lacrima non guarderebbe più nessuno, e non servirebbe più a nessuno."
        incantesimo: sigillo
        prova: { attributo: mentale, abilita: magia, difficolta: Media }
        successo:
          titolo: L'occhio chiuso
          testo: |
            Appoggi il palmo sulla brina e chiudi il Mana della Lacrima dentro
            la pietra, giro dopo giro, finché l'occhio al centro smette di
            seguirti e si ferma. Il cristallo diventa opaco come un vetro
            appannato, e le falene smettono di posarsi. Ottilia lo saprà prima
            di sera, e la condotta dovrà trovare un'altra strada.
          pe: { magia: 6 }
          imposta: { accademia.lacrima: 3 }
          effetti: { rep.velo: 1 }
          vai: superficie-fratturata
        fallimento:
          titolo: Il Mana che torna
          testo: |
            Il Mana della Lacrima ti torna indietro tutto in una volta, e ti
            ritrovi seduto sulle falene morte con le orecchie che fischiano.
          effetti: { tormento: 1 }

      - testo: "Chiedere al novizio le parole del Velo"
        descrizione: "Il ragazzo di Ottilia conosce le parole per chiudere la pietra. Basta portarlo fin qui e lasciargliele dire."
        quando: [accademia.custode >= 1]
        esito:
          titolo: Le parole del novizio
          testo: |
            Il novizio sale fino alla Lacrima con le gambe che tremano e dice le
            parole a mezza voce, mezzo tono sotto, con la mano sulla brina. Il
            cristallo diventa opaco come un vetro appannato e l'occhio al centro
            si ferma. Il ragazzo piange e dice che è il freddo, e tu fai finta di crederci. Ottilia lo saprà prima di sera.
          imposta: { accademia.lacrima: 3 }
          effetti: { rep.velo: 1 }
          vai: superficie-fratturata

      - testo: "Misurarla a occhio e con la corda"
        descrizione: "Bastano una corda graduata e il conto dei passi, senza magia. Per farlo bene ci vuole il giorno intero."
        costo: 2
        esito:
          titolo: Il giorno intero
          testo: |
            Misuri la Lacrima con la corda e con i passi, e conti quanto ci
            mette una goccia di brina a cristallizzarsi sul guanto. Tobol scrive
            tutto. A sera i numeri dicono che la Lacrima reggerebbe la condotta
            a lungo, molto più della Vecchia. Scendete al buio, e l'occhio vi
            guarda andare fino all'argine.
          pe: { percezione: 3 }
          imposta: { accademia.lacrima: 1 }
          vai: superficie-fratturata
