# La Lacrima pietrificata, spedizione del passo 12 della quest dell'Accademia (fazione.accademia == 11).
# Ci si entra dalla Superficie Fratturata con «Le torbiere a nord del Torvessa». Le stanze vanno in fasce di
# profondità, e una stanza superata non ricompare nella stessa visita:
# 0 le torbiere (i cercatori di torba; i solchi dei carri della Gilda),
# 1 la collina (le falene, che valgono anche a 2; il campo dei tagliatori della Gilda; il novizio del Velo, che
#   imposta accademia.custode),
# 2 la collina scavata (i cunicoli nella torba; il gelo),
# 3 sotto la Lacrima (le falene morte; il fumo vecchio).
# Il cuore a 4 è la goccia che non cade: si misura la Lacrima (accademia.lacrima 1), la si segna per la Gilda (2) o
# la si sigilla per il Velo (3). Il passo si chiude in città con «Il consiglio ristretto» (passi-3.yaml).
aree:
  - id: accademia-lacrima-pietrificata
    immagine: ambientazione/mito-occhio-nel-cristallo
    nome: La Lacrima pietrificata
    sommario: "Una collina di torba a nord del Torvessa, con un cristallo gelato lungo quanto un cavallo."
    spedizione: { ritorno: superficie-fratturata, soglia: 4, stanze: 3 }
    testo: |
      Oltre le torbiere a nord del Torvessa si alza una collina bassa di torba scura, e dal suo fianco spunta di traverso
      un cristallo lungo quanto un cavallo, conficcato come una goccia caduta da molto in alto. Intorno l'aria è fredda
      anche a mezzogiorno e la torba è coperta di brina, e alla base si ammucchiano le falene morte, ogni notte un po' di
      più.

storylet:
  # ------------------------------------------------------------ l'ingresso, nella Superficie
  - id: accademia-le-torbiere-a-nord
    immagine: ambientazione/mito-occhio-nel-cristallo
    titolo: Le torbiere a nord del Torvessa
    sommario: "Il Consiglio ha autorizzato il sopralluogo alla Lacrima, ma una squadra della Gilda ci è già arrivata."
    luogo: Superficie Fratturata, la strada delle torbiere
    area: superficie-fratturata
    requisiti: [fazione.accademia == 11, accademia.lacrima == 0]
    testo: |
      La strada delle torbiere corre su un argine fra i canali scuri e i
      mattoni di torba messi a seccare, verso un luccichio sul fianco di una
      collina.

      Tobol cammina accanto a te. «Il cristallo più grande della regione l'ho
      segnato quarant'anni fa con un punto interrogativo, e nessuno mi ha mai
      chiesto perché» dice.

      {natura Media} Sulla strada ci sono i solchi freschi di un carro
      pesante e le orme di parecchi stivali chiodati.

      {origine figlio-del-circolo} Al Circolo le torbiere le chiamano la
      terra che ricorda, perché dentro le cose restano intere per cent'anni.
    opzioni:
      - testo: "Andare verso la collina"
        descrizione: "Mezza giornata di argini, e poi la torba."
        costo: 1
        esito:
          titolo: L'argine
          testo: |
            Seguite l'argine fino a dove la torba comincia a salire, e l'aria si
            fa fredda come in una cantina mentre il luccichio diventa una forma
            lunga e azzurra.
          vai: accademia-lacrima-pietrificata
      - testo: "Tornare indietro"
        descrizione: "La Lacrima è lì da secoli, e il sopralluogo si può rimandare."
        costo: 0
        esito:
          titolo: Un altro giorno
          testo: |
            Tobol arrotola la mappa senza protestare, e Whisp ti guarda dal
            colletto con un occhio solo per tutta la strada.

  # ------------------------------------------------------------ 0 · le torbiere
  - id: accademia-lacrima-i-cercatori-di-torba
    immagine: ambientazione/palude-acquanera
    titolo: I cercatori di torba
    sommario: "Una famiglia di cercatori di torba ti indica la strada per la collina, e ti dice di non andarci."
    luogo: La Lacrima pietrificata, l'ultimo canale
    area: accademia-lacrima-pietrificata
    ripetibile: true
    requisiti: [fazione.accademia == 11, accademia.lacrima == 0, profondita.accademia-lacrima-pietrificata == 0]
    testo: |
      Sull'ultimo canale prima della collina una famiglia di cercatori taglia
      mattoni di torba, e la madre li conta ad alta voce mentre i ragazzi li
      impilano. Il padre si appoggia alla vanga per guardarvi.

      «Alla collina?» chiede. «Di notte la pietra chiama le falene, e di
      giorno chiama la gente. Quelli della Gilda ci sono andati sei giorni
      fa, e uno è tornato senza voce.»

      {conoscenze-della-strada Media} Ha detto sei giorni, e i solchi del
      carro sono di due. La Gilda è andata e tornata, e adesso è di nuovo
      lassù.
    opzioni:
      - testo: "Chiedere da che parte si sale"
        descrizione: "I cercatori conoscono la torba meglio di qualunque mappa."
        prova: { attributo: sociale, abilita: conoscenze-della-strada, difficolta: Media }
        successo:
          titolo: La strada dei mattoni
          testo: |
            Il padre ti mostra un sentiero di mattoni di torba posati sulla
            fanghiglia, che porta dritto al fianco della collina, e ti avverte di
            non fermarti sulla brina.
          pe: { conoscenze-della-strada: 4 }
          effetti: { profondita.accademia-lacrima-pietrificata: 1 }
        fallimento:
          titolo: La vanga
          testo: |
            Il padre risponde che la strada la sa chi ci lavora, e torna a
            tagliare la torba.
          effetti: { tormento: 1 }

      - testo: "Leggere la torba da soli"
        descrizione: "La torba scura e lucida inghiotte, quella grigia regge."
        prova: { attributo: mentale, abilita: natura, difficolta: Media }
        successo:
          titolo: La torba grigia
          testo: |
            Cammini sulla torba grigia saltando le pozze lucide, con Tobol nelle
            tue orme, e in un'ora siete ai piedi della collina.
          pe: { natura: 5 }
          effetti: { profondita.accademia-lacrima-pietrificata: 1 }
        fallimento:
          titolo: Fino al ginocchio
          testo: |
            Una pozza che sembrava grigia ti inghiotte fino al ginocchio, e il
            ragazzo più piccolo dei cercatori viene a tirarti fuori ridendo.
          effetti: { ferite: 0.5 }

  - id: accademia-lacrima-i-solchi-dei-carri
    immagine: ambientazione/palude-acquanera
    titolo: I solchi dei carri
    sommario: "I solchi del carro della Gilda vanno dritti alla collina, senza paura di farsi seguire."
    luogo: La Lacrima pietrificata, l'argine
    area: accademia-lacrima-pietrificata
    ripetibile: true
    requisiti: [fazione.accademia == 11, accademia.lacrima == 0, profondita.accademia-lacrima-pietrificata == 0]
    testo: |
      Dove finisce l'argine i solchi del carro girano su una massicciata di
      pietre buttate nella torba per farci passare le ruote. Accanto ai resti
      di un fuoco, su una pietra, qualcuno ha dimenticato un paio di guanti
      grigi.

      {percezione Media} I guanti sono di pelle fine cucita a mano, troppo
      belli per uno che taglia torba. Li ha persi qualcuno che non lavora con
      le mani.
    opzioni:
      - testo: "Seguire la massicciata"
        descrizione: "Le pietre della Gilda reggono un carro, e reggono anche te."
        prova: { attributo: mentale, abilita: percezione, difficolta: Facile }
        successo:
          titolo: La massicciata
          testo: |
            Segui la massicciata attento alle pietre che ballano, e in cima vedi
            una tenda e del fumo.
          pe: { percezione: 4 }
          effetti: { profondita.accademia-lacrima-pietrificata: 1 }
        fallimento:
          titolo: La pietra che balla
          testo: |
            Una pietra si gira sotto il piede e finisci nella torba fino all'anca,
            finché Tobol ti tira fuori con il manico della mappa.
          effetti: { ferite: 0.5 }

      - testo: "Prendere i guanti e tenerli"
        descrizione: "Guanti di pelle fine, che a qualcuno mancheranno."
        esito:
          titolo: I guanti grigi
          testo: |
            Ti metti in tasca i guanti, che sanno di un profumo da Quartieri Alti, e Tobol alza le sopracciglia fin sopra gli occhiali.
          effetti: { profondita.accademia-lacrima-pietrificata: 1, informazioni.voce: 1 }

  # ------------------------------------------------------------ 1 · la collina
  - id: accademia-lacrima-le-falene
    immagine: icone/butterfly
    titolo: Le falene
    sommario: "Uno sciame di falene grigie si alza dalla torba e va verso qualunque luce, comprese le tue."
    luogo: La Lacrima pietrificata, il fianco della collina
    area: accademia-lacrima-pietrificata
    ripetibile: true
    requisiti: [fazione.accademia == 11, accademia.lacrima == 0, profondita.accademia-lacrima-pietrificata >= 1, profondita.accademia-lacrima-pietrificata <= 2]
    testo: |
      Sul fianco della collina la torba è piena di buchi, e quando ci passi
      vicino lo sciame si alza tutto insieme, migliaia di falene grigie
      dalle ali polverose. Ti si posano sulla faccia e vanno a sbattere
      contro la lampada di Tobol fino a spegnerla.

      {natura Media} Vanno verso la luce, e la luce più forte della collina
      è la Lacrima, mentre tu sei soltanto sulla strada.
    opzioni:
      - testo: "Portarle via con la Luce fredda"
        descrizione: "Una luce fredda lanciata giù per il pendio, e le falene la seguiranno."
        incantesimo: luce-fredda
        prova: { attributo: mentale, abilita: magia, difficolta: Facile }
        successo:
          titolo: La luce lontana
          testo: |
            Lanci la Luce fredda giù per il pendio e lo sciame la insegue in un
            fruscio solo, lasciandovi la collina libera.
          pe: { magia: 4 }
          effetti: { profondita.accademia-lacrima-pietrificata: 1 }
        fallimento:
          titolo: La luce sulla mano
          testo: |
            La luce ti resta attaccata al palmo e lo sciame ti si posa sul
            braccio, e scappi giù sventolando la mano.
          effetti: { tormento: 1 }

      - testo: "Tenere la testa bassa e salire lo stesso"
        descrizione: "Una per una le falene non pesano niente."
        prova: { attributo: fisico, abilita: resistenza, difficolta: Media }
        successo:
          titolo: La polvere d'ala
          testo: |
            Sali con la sciarpa sulla bocca e gli occhi socchiusi finché lo sciame
            ti lascia per tornare alla Lacrima.
          pe: { resistenza: 4 }
          effetti: { profondita.accademia-lacrima-pietrificata: 1 }
        fallimento:
          titolo: La tosse
          testo: |
            La polvere d'ala ti entra in gola, e torni giù al canale piegato dalla
            tosse, con Tobol che ti batte la schiena.
          effetti: { ferite: 0.5 }

      - testo: "Scacciarle a colpi di mantello"
        descrizione: "Sono tante e deboli, e se le spingi vanno altrove."
        combattimento: accademia-le-falene
        vittoria:
          titolo: Il mantello
          testo: |
            Mulini il mantello finché lo sciame si sparpaglia sulla torba, e la
            collina davanti è libera.
          effetti: { profondita.accademia-lacrima-pietrificata: 1 }
        sconfitta:
          titolo: Dentro lo sciame
          testo: |
            Lo sciame ti avvolge e per un tempo lunghissimo vedi solo ali grigie,
            poi ti ritrovi al canale senza sapere come.
          effetti: { tormento: 1, ferite: 0.5 }

  - id: accademia-lacrima-il-campo-dei-tagliatori
    immagine: fazioni/gilda-dei-mercanti
    titolo: Il campo dei tagliatori
    sommario: "Al campo della Gilda due balestrieri guardano chi sale."
    luogo: La Lacrima pietrificata, il campo della Gilda
    area: accademia-lacrima-pietrificata
    ripetibile: true
    requisiti: [fazione.accademia == 11, accademia.lacrima == 0, profondita.accademia-lacrima-pietrificata == 1]
    testo: |
      A mezza costa la Gilda ha piantato una tenda accanto a un carro con i paranchi, e una
      fila di picchetti con nastri gialli segna la strada fino alla Lacrima. Sul limite del
      campo ci sono due balestrieri con i mantelli dei Custodi, e uno carica la balestra senza
      fretta.

      «Il sopralluogo lo fa la Gilda, per ordine della Casa dei Nodi» dice il capo dei
      tagliatori, un uomo basso con i baffi gialli di tabacco. «Voi guardate da qui.»

      {origine mercante-dei-ponti} Lo conosci dai Ponti, dove vende scalpelli usati per nuovi,
      e anche lui si ricorda di te.
    opzioni:
      - testo: "Convincerli che il Consiglio ha autorizzato anche voi"
        descrizione: "Il sopralluogo l'ha autorizzato il Consiglio, e bisogna spiegarlo senza alzare la voce."
        prova: { attributo: sociale, abilita: persuasione, difficolta: Media }
        successo:
          titolo: Il sigillo del Municipio
          testo: |
            Il capo dei tagliatori legge due volte la carta con il sigillo del Municipio e fa abbassare le balestre. «Guardate quello che volete»
            dice. «Tanto la pietra ce la portiamo a casa noi.»
          pe: { persuasione: 5 }
          effetti: { profondita.accademia-lacrima-pietrificata: 1 }
        fallimento:
          titolo: La balestra
          testo: |
            Il capo ti ascolta fino in fondo, poi il balestriere ti tira una
            quadrella ai piedi, e tornate giù fra le risate dei tagliatori.
          effetti: { ferite: 0.5 }

      - testo: "Mostrare la licenza della Gilda"
        descrizione: "Un socio della Gilda sale dove vuole."
        requisiti: [licenza-gilda >= 1]
        esito:
          titolo: Fra soci
          testo: |
            Il capo dei tagliatori si toglie il cappello e fa togliere un
            picchetto per lasciarti passare.
          effetti: { profondita.accademia-lacrima-pietrificata: 1 }

      - testo: "Passare da amico della Gilda"
        descrizione: "Alla Casa dei Nodi il tuo nome lo conoscono bene."
        requisiti: [rep.gilda >= 3]
        esito:
          titolo: Il nome giusto
          testo: |
            Il capo dei tagliatori ripete il tuo nome a voce bassa e fa abbassare
            le balestre, poi ti accompagna all'ultimo picchetto parlando del
            tempo.
          effetti: { profondita.accademia-lacrima-pietrificata: 1 }

      - testo: "Forzare il passaggio"
        descrizione: "Sono due balestrieri, e se la Gilda vuole la Lacrima venga a prendersela."
        combattimento: accademia-i-balestrieri-della-gilda
        vittoria:
          titolo: Le balestre nella torba
          testo: |
            I due balestrieri finiscono nella torba e i tagliatori alzano le mani
            prima che tu lo chieda. Stasera alla Casa dei Nodi qualcuno scriverà
            il tuo nome.
          effetti: { profondita.accademia-lacrima-pietrificata: 1, rep.gilda: -1 }
        sconfitta:
          titolo: Le quadrelle
          testo: |
            Una quadrella ti prende alla coscia, e Tobol ti regge fino al canale.
          effetti: { ferite: 1 }

      - testo: "Aggirare il campo dal lato in ombra"
        descrizione: "Il lato nord, dove la brina scivola, è un giro lungo che nessuno fa."
        costo: 2
        esito:
          titolo: Il lato in ombra
          testo: |
            Giri la collina dal lato nord, sulla brina che scivola come vetro, e
            ci metti il pomeriggio intero. Quando sbuchi sopra il campo della
            Gilda i tagliatori sono di spalle.
          pe: { furtivita: 2 }
          effetti: { profondita.accademia-lacrima-pietrificata: 1 }

  - id: accademia-lacrima-il-novizio-del-velo
    immagine: ambientazione/cattedrale-del-velo
    titolo: Il novizio del Velo
    sommario: "Su un sasso un novizio del Velo guarda la Lacrima e prende appunti."
    luogo: La Lacrima pietrificata, un sasso sul fianco della collina
    area: accademia-lacrima-pietrificata
    ripetibile: true
    requisiti: [fazione.accademia == 11, accademia.lacrima == 0, profondita.accademia-lacrima-pietrificata == 1]
    testo: |
      Su un sasso piatto sotto la brina siede un ragazzo con il mantello nero
      dei novizi del Velo e una tavoletta di cera sulle ginocchia. Ha il naso
      rosso di freddo, e quando ti vede nasconde la tavoletta sotto il
      mantello.

      «Mi ha mandato Ottilia Sanvel» dice, prima che tu glielo chieda. «Devo
      soltanto contare le falene e chi sale.»

      {empatia Media} È qui da giorni, e ha paura della collina più che di
      te. Gli manca la voce di qualcuno.

      {origine accolito-del-velo} Era nella fila dietro la tua agli esercizi
      dell'alba, e cantava sempre mezzo tono sotto.
    opzioni:
      - testo: "Sedersi con lui e farlo parlare"
        descrizione: "Un ragazzo solo nel freddo, un po' di pane e qualche domanda."
        prova: { attributo: sociale, abilita: empatia, difficolta: Media }
        successo:
          titolo: Le falene contate
          testo: |
            Dividi il pane con lui e lui ti mostra la tavoletta, con le falene
            morte contate ogni mattina, sempre di più. Ti insegna il sentiero che
            evita la brina, e se vuoi chiudere la Lacrima lui conosce le parole.
          pe: { empatia: 5 }
          imposta: { accademia.custode: 1 }
          effetti: { profondita.accademia-lacrima-pietrificata: 1 }
        fallimento:
          titolo: La tavoletta
          testo: |
            Fai una domanda di troppo e lui si chiude nel mantello, perché deve
            parlare solo con Ottilia.

      - testo: "Salutarlo come in Cattedrale"
        descrizione: "La formula del chiostro che si scambiano i novizi all'alba."
        quando: [origine.accolito-del-velo >= 1]
        esito:
          titolo: Mezzo tono sotto
          testo: |
            Gli dici la formula dell'alba e lui risponde ridendo, mezzo tono sotto
            come sempre. Ti insegna il sentiero che evita la brina, e se vuoi
            chiudere la Lacrima lui conosce le parole.
          pe: { empatia: 5 }
          imposta: { accademia.custode: 1 }
          effetti: { profondita.accademia-lacrima-pietrificata: 1 }

      - testo: "Lasciarlo ai suoi conti e salire"
        descrizione: "È un novizio con una tavoletta, e fermarti non è affar suo."
        esito:
          titolo: Il segno sulla cera
          testo: |
            Mentre sali lo senti incidere un segno sulla cera, e Ottilia saprà
            prima di sera che sei passato.
          effetti: { profondita.accademia-lacrima-pietrificata: 1 }

  # ------------------------------------------------------------ 2 · la collina scavata
  - id: accademia-lacrima-i-cunicoli
    immagine: ambientazione/palude-acquanera
    titolo: I cunicoli nella torba
    sommario: "Cunicoli vecchi e stretti salgono nella torba verso la Lacrima, da sotto."
    luogo: La Lacrima pietrificata, dentro la collina
    area: accademia-lacrima-pietrificata
    ripetibile: true
    requisiti: [fazione.accademia == 11, accademia.lacrima == 0, profondita.accademia-lacrima-pietrificata == 2]
    testo: |
      Sotto la brina la collina è bucata da cunicoli stretti, scavati a vanga molto tempo fa, che salgono verso la
      Lacrima da sotto. In uno c'è ancora una vanga di legno annerita, intera come se l'avessero posata ieri.

      {natura Facile} La torba conserva tutto. Quella vanga può avere cento anni, e il legno non lo sa.
    opzioni:
      - testo: "Salire dentro i cunicoli"
        descrizione: "A gomiti e ginocchia, ma sotto la Lacrima si arriva."
        prova: { attributo: fisico, abilita: atletica, difficolta: Media }
        successo:
          titolo: Sotto la Lacrima
          testo: |
            Sali a forza di gomiti per un cunicolo che si stringe e poi si allarga,
            e sbuchi sotto la Lacrima, con il cristallo azzurro che gocciola brina
            sopra la testa.
          pe: { atletica: 5 }
          effetti: { profondita.accademia-lacrima-pietrificata: 1 }
        fallimento:
          titolo: Di schiena
          testo: |
            A metà la torba ti cede sotto il gomito, e scivoli giù fino
            all'imbocco con la bocca piena di terra.
          effetti: { ferite: 0.5 }

      - testo: "Seguire la vanga vecchia"
        descrizione: "Chi ha lasciato la vanga sapeva dove andava."
        prova: { attributo: mentale, abilita: percezione, difficolta: Media }
        successo:
          titolo: Il cunicolo della vanga
          testo: |
            Il cunicolo della vanga è il più largo, con i gradini scavati nella torba, e arrivi sotto la Lacrima con le gambe ancora buone.
          pe: { percezione: 5 }
          effetti: { profondita.accademia-lacrima-pietrificata: 1 }
        fallimento:
          titolo: Il cunicolo cieco
          testo: |
            Il cunicolo della vanga finisce contro un muro di torba dura, e devi
            tornare indietro carponi per un tratto lungo.
          effetti: { tormento: 1 }

  - id: accademia-lacrima-il-gelo
    immagine: ambientazione/mito-occhio-nel-cristallo
    titolo: Il gelo
    sommario: "Vicino alla Lacrima la torba è gelata, e chi tocca la pietra ci resta attaccato."
    luogo: La Lacrima pietrificata, la brina
    area: accademia-lacrima-pietrificata
    ripetibile: true
    requisiti: [fazione.accademia == 11, accademia.lacrima == 0, profondita.accademia-lacrima-pietrificata == 2]
    testo: |
      Sopra la brina la torba è dura come pietra e il freddo morde le orecchie. Per salire devi appoggiare le mani sulle schegge gelate della Lacrima che spuntano dal suolo.

      {resistenza Media} Il freddo così forte fa male soltanto all'inizio, poi le dita diventano di legno ed è peggio.

      {origine fuggiasco-di-ghoran} Sulla strada da Ghoran hai imparato a tenere le mani sotto le ascelle fino all'ultimo momento, e lo fai anche adesso.
    opzioni:
      - testo: "Salire con le mani nude"
        descrizione: "Un appoggio alla volta e mai fermi, perché il freddo vince chi si ferma."
        prova: { attributo: fisico, abilita: resistenza, difficolta: Media }
        successo:
          titolo: Le dita di legno
          testo: |
            Sali senza fermarti e il freddo non fa in tempo a prenderti le mani.
            In cima ci metti un pezzo a sentirle di nuovo tue.
          pe: { resistenza: 5 }
          effetti: { profondita.accademia-lacrima-pietrificata: 1 }
        fallimento:
          titolo: La mano attaccata
          testo: |
            Ti fermi un momento di troppo e la mano resta attaccata al cristallo,
            e torni giù con il palmo che sanguina.
          effetti: { ferite: 0.5 }

      - testo: "Fasciarsi le mani e salire piano"
        descrizione: "Con stracci e cuoio si sale più lenti, ma con le dita intere."
        costo: 2
        esito:
          titolo: Le fasce
          testo: |
            Ti fasci le mani con le maniche della camicia e una striscia di cuoio,
            e sali un passo alla volta. Ci metti il doppio del tempo.
          pe: { resistenza: 2 }
          effetti: { profondita.accademia-lacrima-pietrificata: 1 }

  # ------------------------------------------------------------ 3 · sotto la Lacrima
  - id: accademia-lacrima-le-falene-morte
    immagine: icone/butterfly
    titolo: Le falene morte
    sommario: "Alla base della Lacrima le falene morte fanno uno strato spesso come un tappeto."
    luogo: La Lacrima pietrificata, alla base del cristallo
    area: accademia-lacrima-pietrificata
    ripetibile: true
    requisiti: [fazione.accademia == 11, accademia.lacrima == 0, profondita.accademia-lacrima-pietrificata == 3]
    testo: |
      Alla base della Lacrima le falene morte fanno uno strato grigio spesso
      un palmo, che scricchiola sotto gli stivali. Sono morte con le ali
      aperte verso il cristallo, e nell'aria c'è un odore dolce e metallico
      che ti si posa sulla lingua.

      {medicina Media} Hanno la bocca piena di una polvere bianca, la stessa
      che lascia il fumo di un cristallo imploso.
    opzioni:
      - testo: "Esaminare le falene"
        descrizione: "La polvere bianca nella bocca delle falene viene da qualche parte."
        prova: { attributo: mentale, abilita: medicina, difficolta: Media }
        successo:
          titolo: La polvere bianca
          testo: |
            Nella bocca di una falena trovi fumo di cristallo recente, perché pochi giorni fa qualcuno ha provato a staccare un pezzo della Lacrima e il pezzo è imploso. Tobol guarda verso il campo
            della Gilda.
          pe: { medicina: 5 }
          effetti: { profondita.accademia-lacrima-pietrificata: 1, informazioni.pettegolezzo: 1 }
        fallimento:
          titolo: Il sapore
          testo: |
            La polvere ti va in gola, e per qualche ora le parole ti escono
            storte.
          effetti: { tormento: 1 }

      - testo: "Camminare sopra le falene fino al cristallo"
        descrizione: "Sono morte. Basta non pensarci."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Facile }
        successo:
          titolo: Lo scricchiolio
          testo: |
            Cammini sullo strato di falene, con lo scricchiolio che ti sale lungo
            le gambe, finché hai il cristallo a un braccio dalla faccia.
          pe: { resilienza: 4 }
          effetti: { profondita.accademia-lacrima-pietrificata: 1 }
        fallimento:
          titolo: Un passo indietro
          testo: |
            Al terzo passo lo scricchiolio ti fa venire la nausea, e torni
            indietro fino alla torba nuda.
          effetti: { tormento: 1 }

  - id: accademia-lacrima-il-fumo-vecchio
    immagine: ambientazione/mito-occhio-nel-cristallo
    titolo: Il fumo vecchio
    sommario: "Su un lato della Lacrima c'è una ferita fresca, e da lì esce un fumo lattiginoso che non si disperde."
    luogo: La Lacrima pietrificata, il lato della ferita
    area: accademia-lacrima-pietrificata
    ripetibile: true
    requisiti: [fazione.accademia == 11, accademia.lacrima == 0, profondita.accademia-lacrima-pietrificata == 3]
    testo: |
      Sul lato che guarda il campo della Gilda la Lacrima ha una ferita, un
      incavo grande come una testa dove qualcuno ha provato a staccare una
      scheggia. Ne esce un fumo lattiginoso che resta sospeso a mezz'aria in
      una nuvola bassa.

      {magia Media} Il fumo è Mana spezzato. Chi lo respira perde le parole
      per un po', e qualcuno per sempre.
    opzioni:
      - testo: "Passare sotto il fumo a bocca chiusa"
        descrizione: "Una nuvola bassa che fa male solo a chi la respira."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Media }
        successo:
          titolo: Sotto la nuvola
          testo: |
            Ti tappi il naso e passi sotto la nuvola a quattro zampe, con il sapore di metallo
            dolce sulla lingua, e di là il cristallo è a un passo.
          pe: { resilienza: 5 }
          effetti: { profondita.accademia-lacrima-pietrificata: 1 }
        fallimento:
          titolo: Senza parole
          testo: |
            Respiri a metà strada, e per mezza giornata non riesci a dire una
            parola intera.
          effetti: { tormento: 1.5 }

      - testo: "Strisciare sotto la nuvola"
        descrizione: "Pancia a terra, e la schiena lontana dal fumo."
        prova: { attributo: fisico, abilita: acrobazia, difficolta: Media }
        successo:
          titolo: Pancia a terra
          testo: |
            Strisci sulla brina con il fumo a un palmo dalla schiena, e ti rialzi
            di là con la giubba bagnata e il cristallo davanti.
          pe: { acrobazia: 5 }
          effetti: { profondita.accademia-lacrima-pietrificata: 1 }
        fallimento:
          titolo: La schiena
          testo: |
            Alzi la schiena di un niente e il fumo ti si posa addosso, e torni
            indietro tossendo.
          effetti: { tormento: 1, ferite: 0.5 }

  # ------------------------------------------------------------ 4 · il cuore: la goccia che non cade
  - id: accademia-lacrima-la-goccia-che-non-cade
    immagine: ambientazione/mito-occhio-nel-cristallo
    titolo: La goccia che non cade
    sommario: "Davanti alla Lacrima pietrificata, nel freddo. Dentro il cristallo qualcosa si muove quando ti muovi tu."
    luogo: La Lacrima pietrificata, davanti al cristallo
    area: accademia-lacrima-pietrificata
    requisiti: [fazione.accademia == 11, accademia.lacrima == 0, profondita.accademia-lacrima-pietrificata >= 4]
    testo: |
      Da vicino la Lacrima è lunga quanto un cavallo e larga quanto una botte, conficcata di traverso nella torba con la punta verso il cielo. È di un azzurro così chiaro che sembra bianco, e gocciola
      brina da tutti i lati senza consumarsi mai.

      {magia Difficile} La Lacrima è piena come la Vecchia non è mai stata. Basterebbe alla condotta per una vita intera, e il Mana dentro gira lento intorno a un punto.

      Se ti sposti verso destra, al centro del cristallo un punto più scuro della forma di un occhio si sposta con te, e se torni indietro torna anche lui.

      {resilienza Difficile fallita} Lo guardi troppo a lungo, e ti sembra che sia lui a guardare te da molto più lontano, da sotto la collina e da sotto la città.

      Tobol si pulisce gli occhiali sulla cravatta. «L'Occhio nel Cristallo» dice. «Le balie raccontano che chi prova a estrarlo fa implodere il cristallo.»
    opzioni:
      - testo: "Misurare la Lacrima con Leggere il Mana"
        descrizione: "Quanta carica ha e se reggerebbe la condotta, come vuole sapere il Consiglio."
        incantesimo: leggere-il-mana
        prova: { attributo: mentale, abilita: magia, difficolta: Media }
        successo:
          titolo: Una vita intera
          testo: |
            Appoggi due dita sulla brina e lasci che il Mana della Lacrima ti racconti quanto è grande. È enorme e regolare, e reggerebbe la
            condotta di Qir-Azel per una vita. Scrivi le misure sul quaderno di Tobol con le dita che tremano.
          pe: { magia: 6 }
          imposta: { accademia.lacrima: 1 }
          vai: superficie-fratturata
        fallimento:
          titolo: L'occhio
          testo: |
            Il Mana ti viene incontro troppo in fretta, e l'occhio al centro si
            avvicina finché ti stacchi di colpo.
          effetti: { tormento: 1.5 }

      - testo: "Misurarla con gli strumenti di Tobol"
        descrizione: "Con una corda graduata e un pendolo d'ottone il Mana si misura anche dal freddo."
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Media }
        successo:
          titolo: Le misure
          testo: |
            Con la corda di Tobol misuri la Lacrima da un capo all'altro, e con il
            pendolo il freddo che le gira intorno. Tobol rifà due volte i conti,
            che gli sembrano troppo grandi, e la Lacrima reggerebbe davvero la
            condotta per una vita.
          pe: { tecnologia: 6 }
          imposta: { accademia.lacrima: 1 }
          vai: superficie-fratturata
        fallimento:
          titolo: Il pendolo fermo
          testo: |
            Vicino al cristallo il pendolo si ferma di traverso e non riparte, e
            Tobol lo mette via finché non vi tremeranno meno le mani.
          effetti: { tormento: 1 }

      - testo: "Staccare una scheggia per Orvald"
        descrizione: "Orvald vorrebbe un pezzo da studiare, ma la storia dell'occhio dice di non farlo."
        prova: { attributo: fisico, abilita: acrobazia, difficolta: Difficile }
        successo:
          titolo: La scheggia
          testo: |
            Scegli una scheggia sul bordo lontano dall'occhio e la stacchi con un colpo secco di piccozza, girando la faccia. Resta intera nel palmo senza
            fare fumo, e Tobol si lamenta a lungo quando la avvolgi nella sua cravatta.
          pe: { acrobazia: 6 }
          imposta: { accademia.lacrima: 1 }
          effetti: { reperto.sigillato: 1 }
          vai: superficie-fratturata
        fallimento:
          titolo: Il fumo lattiginoso
          testo: |
            La scheggia ti implode fra le dita con un rumore di vetro soffiato, e
            il fumo lattiginoso ti entra in bocca. Per giorni le parole ti escono
            a metà, e Tobol ti riporta giù tenendoti per il gomito, con le misure
            prese da lui.
          imposta: { accademia.lacrima: 1 }
          effetti: { tormento: 1.5, ferite: 0.5 }
          vai: superficie-fratturata

      - testo: "Segnarla per l'estrazione della Gilda"
        descrizione: "Con i paranchi della Gilda la Lacrima arriva in città, ma la Gilda ne reclama la proprietà."
        esito:
          titolo: I nastri gialli
          testo: |
            Scendi al campo e dici al capo dei tagliatori che la Lacrima regge la condotta, e lui fa piantare i picchetti con il nastro giallo tutto intorno al cristallo. Mentre la Gilda chiude la Lacrima nel suo recinto, Tobol arrotola la mappa senza sorridere. «La Casa dei Nodi ti scriverà una lettera di ringraziamento, e io al tuo posto la
            incornicerei.»
          imposta: { accademia.lacrima: 2 }
          effetti: { rep.gilda: 1 }
          vai: superficie-fratturata

      - testo: "Sigillarla per il Velo"
        descrizione: "Il Sigillo chiude il Mana nella pietra, e la Lacrima non guarderebbe né servirebbe più a nessuno."
        incantesimo: sigillo
        prova: { attributo: mentale, abilita: magia, difficolta: Media }
        successo:
          titolo: L'occhio chiuso
          testo: |
            Appoggi il palmo sulla brina e chiudi il Mana della Lacrima dentro la
            pietra, giro dopo giro, finché l'occhio al centro smette di seguirti.
            Il cristallo diventa opaco come un vetro appannato e le falene
            smettono di posarsi. Ottilia lo saprà prima di sera, e la condotta
            dovrà trovare un'altra strada.
          pe: { magia: 6 }
          imposta: { accademia.lacrima: 3 }
          effetti: { rep.velo: 1 }
          vai: superficie-fratturata
        fallimento:
          titolo: Il Mana che torna
          testo: |
            Il Mana della Lacrima ti torna indietro tutto in una volta, e ti
            ritrovi seduto sulle falene morte con le orecchie che fischiano.
          effetti: { tormento: 1.5 }

      - testo: "Chiedere al novizio le parole del Velo"
        descrizione: "Il ragazzo di Ottilia conosce le parole per chiudere la pietra, se lo porti fin qui."
        quando: [accademia.custode >= 1]
        esito:
          titolo: Le parole del novizio
          testo: |
            Il novizio sale fino alla Lacrima con le gambe che tremano e dice le parole mezzo tono sotto, con la mano sulla
            brina. Il cristallo diventa opaco come un vetro appannato e l'occhio si ferma. Il ragazzo piange e dice che è
            il freddo, e tu fai finta di crederci.
          imposta: { accademia.lacrima: 3 }
          effetti: { rep.velo: 1 }
          vai: superficie-fratturata

      - testo: "Misurarla a occhio e con la corda"
        descrizione: "Una corda graduata e il conto dei passi, senza magia, per un giorno intero."
        costo: 2
        esito:
          titolo: Il giorno intero
          testo: |
            Misuri la Lacrima con la corda e con i passi mentre Tobol scrive
            tutto. A sera i numeri dicono che reggerebbe la condotta a lungo,
            molto più della Vecchia, e scendete al buio con l'occhio che vi guarda
            andare fino all'argine.
          pe: { percezione: 3 }
          imposta: { accademia.lacrima: 1 }
          vai: superficie-fratturata
