# La Lacrima pietrificata, spedizione del passo 12 della quest dell'Accademia (fazione.accademia == 11).
# Ci si entra dalla Superficie Fratturata con «Le torbiere a nord del Torvessa». Le stanze vanno in fasce di
# profondità, e una stanza superata non ricompare nella stessa visita:
# 0 le torbiere (i cercatori di torba; i solchi dei carri della Gilda),
# 1 la collina (le falene, che valgono anche a 2; il campo dei tagliatori della Gilda; il novizio del Velo, che
#   imposta accademia.custode),
# 2 la collina scavata (i cunicoli nella torba; il gelo),
# 3 sotto la Lacrima (le falene morte; il fumo vecchio).
# Il cuore a 4 è la goccia che non cade: si misura la Lacrima (accademia.lacrima 1), la si segna per la Gilda (2) o
# la si sigilla per il Velo (3). Il passo si chiude in città con «Il consiglio ristretto» (passi-3.yaml).
aree:
  - id: accademia-lacrima-pietrificata
    immagine: ambientazione/mito-occhio-nel-cristallo
    nome: La Lacrima pietrificata
    sommario: "Una collina di torba oltre le torbiere a nord del Torvessa, con dentro un cristallo gelato lungo quanto un cavallo e le falene morte alla base."
    spedizione: { ritorno: superficie-fratturata, soglia: 4, stanze: 3 }
    testo: |
      Oltre le torbiere a nord del Torvessa si alza una collina bassa di torba, con l'erba rada a ciuffi. Sul
      fianco spunta di traverso un cristallo lungo quanto un cavallo, come una goccia caduta da molto in alto.
      Intorno al cristallo la torba non ha il cratere che lascerebbe una cosa caduta, e gli strati scuri gli
      passano sotto senza piegarsi. Ti dici che la torba ci ha messo secoli a crescergli intorno.

      Lì intorno l'aria è fredda anche a mezzogiorno e la torba è coperta di brina. La brina finisce in un
      bordo netto a una ventina di passi dal cristallo, e oltre il bordo l'erba è bagnata e verde come nel
      resto della torbiera. Alla base si ammucchiano falene morte, e ogni notte ne arrivano altre.

storylet:
  # ------------------------------------------------------------ l'ingresso, nella Superficie
  - id: accademia-le-torbiere-a-nord
    immagine: ambientazione/mito-occhio-nel-cristallo
    titolo: Le torbiere a nord del Torvessa
    sommario: "Il Consiglio ha autorizzato il sopralluogo. La Lacrima pietrificata è oltre le torbiere, e una squadra della Gilda ci è già arrivata."
    luogo: Superficie Fratturata, la strada delle torbiere
    area: superficie-fratturata
    requisiti: [fazione.accademia == 11, accademia.lacrima == 0]
    testo: |
      Lasciato il Torvessa dove piega a est, la strada delle torbiere corre dritta su un argine fra i canali
      scuri. L'acqua dei canali è ferma e nera di torba, e sul pelo galleggiano ali grigie di falena, tutte
      girate dalla stessa parte. In fondo, sul fianco di una collina, c'è un luccichio.

      Tobol cammina accanto a te con la mappa sotto il braccio e Whisp infilato nel colletto per il freddo.
      «Il cristallo più grande della regione» dice. «L'ho segnato sulla carta quarant'anni fa con un punto
      interrogativo, e nessuno mi ha mai chiesto perché.»

      {natura Media} Sulla strada ci sono i solchi freschi di un carro pesante e le orme di parecchi uomini
      con gli stivali chiodati. I bordi dei solchi non si sono ancora sbriciolati, e in una torba così umida
      vuol dire pochi giorni.

      {origine figlio-del-circolo} Al Circolo le torbiere le chiamano la terra che ricorda, perché ci si
      trovano le cose intere anche dopo cent'anni, e ti viene da camminare più piano.
    opzioni:
      - testo: "Andare verso la collina"
        descrizione: "Mezza giornata di argini, e poi la torba."
        costo: 1
        esito:
          titolo: L'argine
          testo: |
            Seguite l'argine fino a dove la torba comincia a salire. L'aria si fa fredda di colpo, come quando
            si apre la porta di una cantina, e Whisp si infila del tutto dentro il colletto di Tobol. Sul
            fianco della collina il luccichio diventa una forma lunga e azzurra.
          vai: accademia-lacrima-pietrificata
      - testo: "Tornare indietro"
        descrizione: "La Lacrima è lì da secoli. Il sopralluogo si può rimandare."
        costo: 0
        esito:
          titolo: Un altro giorno
          testo: |
            Dici a Tobol che si torna un altro giorno, e lui arrotola la mappa senza protestare e la lega con
            lo spago. Whisp ti guarda dal colletto con un occhio solo per tutta la strada, e l'altro lo tiene
            chiuso contro il vento.

  # ------------------------------------------------------------ 0 · le torbiere
  - id: accademia-lacrima-i-cercatori-di-torba
    immagine: ambientazione/palude-acquanera
    titolo: I cercatori di torba
    sommario: "Una famiglia di cercatori di torba lavora sull'ultimo canale prima della collina. Ti indicano la strada, e ti dicono di non andarci."
    luogo: La Lacrima pietrificata, l'ultimo canale
    area: accademia-lacrima-pietrificata
    ripetibile: true
    requisiti: [fazione.accademia == 11, accademia.lacrima == 0, profondita.accademia-lacrima-pietrificata == 0]
    testo: |
      Sull'ultimo canale prima della collina una famiglia di cercatori taglia la torba. Il padre lavora di
      vanga e stacca mattoni tutti uguali, lunghi un avambraccio, con un colpo per lato. I due ragazzi li
      impilano a croce perché l'aria ci passi in mezzo, e la madre li conta ad alta voce. Quando vi vedono
      smettono di lavorare.

      «Alla collina?» chiede il padre guardando la mappa di Tobol. «Be', io non ci andrei. Lassù le falene ci
      vanno a morire. Quelli della Gilda ci sono andati sei giorni fa, e uno è tornato senza voce.»

      {conoscenze-della-strada Media} Ha detto sei giorni, ma i solchi del carro sono di due. La Gilda è
      tornata lassù una seconda volta.
    opzioni:
      - testo: "Chiedere da che parte si sale"
        descrizione: "I cercatori conoscono la torba meglio di qualunque mappa. Bisogna farseli amici."
        prova: { attributo: sociale, abilita: conoscenze-della-strada, difficolta: Media }
        successo:
          titolo: La strada dei mattoni
          testo: |
            Il padre ti mostra un sentiero di mattoni di torba posati sulla fanghiglia, che i ragazzi rifanno
            ogni primavera, e ti avverte di non fermarti sulla brina. I mattoni cedono di un dito sotto il
            peso e tornano su quando alzi il piede. Il sentiero porta dritto al fianco della collina, dove la
            torba diventa dura.
          pe: { conoscenze-della-strada: 4 }
          effetti: { profondita.accademia-lacrima-pietrificata: 1 }
        fallimento:
          titolo: La vanga
          testo: |
            Il padre ti risponde che la strada la sa chi ci lavora, e torna a tagliare la torba con un colpo
            di vanga più forte del solito. La madre vi segue con gli occhi finché non tornate sull'argine, e
            intanto non smette di contare.
          effetti: { tormento: 1 }

      - testo: "Leggere la torba da soli"
        descrizione: "Nella torba scura e lucida si affonda, mentre quella grigia regge il peso."
        prova: { attributo: mentale, abilita: natura, difficolta: Media }
        successo:
          titolo: La torba grigia
          testo: |
            Cammini sulla torba grigia e secca, saltando le pozze lucide, con Tobol che mette i piedi nelle
            tue orme. La torba grigia suona sorda sotto gli stivali, e quella lucida non fa nessun rumore. In
            un'ora siete ai piedi della collina, con gli stivali sporchi solo fino alla caviglia.
          pe: { natura: 5 }
          effetti: { profondita.accademia-lacrima-pietrificata: 1 }
        fallimento:
          titolo: Fino al ginocchio
          testo: |
            Una pozza che sembrava grigia ti inghiotte fino al ginocchio, e il
            ragazzo più piccolo dei cercatori viene a tirarti fuori ridendo.
          effetti: { ferite: 0.5 }

  - id: accademia-lacrima-i-solchi-dei-carri
    immagine: ambientazione/palude-acquanera
    titolo: I solchi dei carri
    sommario: "I solchi del carro della Gilda vanno dritti verso la collina. Chi li ha lasciati non aveva paura di farsi seguire."
    luogo: La Lacrima pietrificata, l'argine
    area: accademia-lacrima-pietrificata
    ripetibile: true
    requisiti: [fazione.accademia == 11, accademia.lacrima == 0, profondita.accademia-lacrima-pietrificata == 0]
    testo: |
      Dove finisce l'argine i solchi del carro della Gilda girano a destra, su una massicciata di pietre
      buttate nella torba per farci passare le ruote. Sono pietre di cava squadrate e tutte della stessa
      misura, e la torba le ha già inghiottite fino a metà. Ai lati ci sono i segni delle vanghe e i resti di
      un fuoco, e un paio di guanti grigi dimenticati su una pietra.

      {percezione Media} I guanti sono di pelle fine e cuciti a mano, con il palmo liscio e le dita senza un
      graffio. Li ha persi qualcuno che non lavora con le mani.
    opzioni:
      - testo: "Seguire la massicciata"
        descrizione: "Le pietre della Gilda reggono un carro. Reggono anche te."
        prova: { attributo: mentale, abilita: percezione, difficolta: Facile }
        successo:
          titolo: La massicciata
          testo: |
            Segui la massicciata pietra per pietra, attento a quelle che ballano, e arrivi ai piedi della
            collina prima di Tobol, che si ferma a misurare tutto. Sotto le pietre che ballano c'è un vuoto
            d'acqua nera, e quando ci metti il peso la torba intorno fa un risucchio. In cima alla massicciata
            c'è una tenda, e del fumo.
          pe: { percezione: 4 }
          effetti: { profondita.accademia-lacrima-pietrificata: 1 }
        fallimento:
          titolo: La pietra che balla
          testo: |
            Una pietra si gira sotto il piede, e tu finisci con una gamba nella torba fino all'anca. La torba
            è fredda e ti risucchia piano verso il basso. Tobol ti tira fuori con il manico della mappa.
          effetti: { ferite: 0.5 }

      - testo: "Prendere i guanti e tenerli"
        descrizione: "Guanti grigi di pelle fine. A qualcuno mancheranno, e forse vorrà sapere chi li ha."
        esito:
          titolo: I guanti grigi
          testo: |
            Ti metti in tasca i guanti grigi, che odorano di un profumo da Quartieri Alti, e segui i solchi
            fino ai piedi della collina. Dentro la pelle è ancora morbida e non ha preso l'umido della torba.
            Tobol ti guarda le tasche e alza le sopracciglia fin sopra gli occhiali.
          effetti: { profondita.accademia-lacrima-pietrificata: 1, informazioni.voce: 1 }

  # ------------------------------------------------------------ 1 · la collina
  - id: accademia-lacrima-le-falene
    immagine: icone/butterfly
    titolo: Le falene
    sommario: "Uno sciame di falene grigie si alza dalla torba e va dritto verso qualunque luce, comprese le tue."
    luogo: La Lacrima pietrificata, il fianco della collina
    area: accademia-lacrima-pietrificata
    ripetibile: true
    requisiti: [fazione.accademia == 11, accademia.lacrima == 0, profondita.accademia-lacrima-pietrificata >= 1, profondita.accademia-lacrima-pietrificata <= 2]
    testo: |
      Sul fianco della collina la torba è piena di buchi larghi un dito, e quando ci passi vicino lo sciame si
      alza tutto insieme. Migliaia di falene grigie ti si posano sulla faccia e sulle mani e sbattono contro
      la lampada di Tobol fino a spegnerla. Il fruscio di tante ali insieme copre la voce di Tobol, che ti
      grida qualcosa da due passi.

      {natura Media} Vanno verso la luce, e la luce più forte della collina è la Lacrima. Tu sei soltanto
      sulla strada.

      {resistenza Media fallita} Ogni respiro ti riempie la bocca di polvere d'ala.
    opzioni:
      - testo: "Portarle via con la Luce fredda"
        descrizione: "Una luce fredda lanciata lontano lungo il pendio. Le falene la seguiranno."
        incantesimo: luce-fredda
        prova: { attributo: mentale, abilita: magia, difficolta: Facile }
        successo:
          titolo: La luce lontana
          testo: |
            Accendi la Luce fredda sul palmo e la lanci giù per il pendio, verso i canali. Lo sciame si gira
            in un fruscio solo e la insegue, lasciandovi la collina libera e una polvere grigia sulle maniche.
            Dai canali il fruscio sale ancora a lungo dopo che la luce si è spenta.
          pe: { magia: 4 }
          effetti: { profondita.accademia-lacrima-pietrificata: 1 }
        fallimento:
          titolo: La luce sulla mano
          testo: |
            La luce ti resta attaccata al palmo invece di partire, e lo sciame ti si posa tutto sul braccio.
            Sotto tante falene insieme il gomito ti si abbassa. Scappi giù per il pendio sventolando la mano
            come una bandiera.
          effetti: { tormento: 1 }

      - testo: "Tenere la testa bassa e salire lo stesso"
        descrizione: "Sono falene, e una per una non pesano niente. Bisogna sopportarle fino in cima."
        prova: { attributo: fisico, abilita: resistenza, difficolta: Media }
        successo:
          titolo: La polvere d'ala
          testo: |
            Sali con la sciarpa sulla bocca e gli occhi socchiusi, lasciandoti le falene addosso. Le senti
            camminare sulle palpebre chiuse. Quando sei più in alto lo sciame ti lascia per tornare alla
            Lacrima, e tu sputi polvere grigia per un pezzo.
          pe: { resistenza: 4 }
          effetti: { profondita.accademia-lacrima-pietrificata: 1 }
        fallimento:
          titolo: La tosse
          testo: |
            La polvere ti entra in gola e la tosse ti piega in due. Torni giù al canale a sciacquarti la
            bocca, con Tobol che ti batte la schiena. L'acqua sa di torba, e la polvere ti resta lo stesso fra
            i denti.
          effetti: { ferite: 0.5 }

      - testo: "Scacciarle a colpi di mantello"
        descrizione: "Sono tante, e deboli. Se le spingi abbastanza, se ne vanno da un'altra parte."
        combattimento: accademia-le-falene
        vittoria:
          titolo: Il mantello
          testo: |
            Mulini il mantello finché lo sciame non si disfa e si sparpaglia sulla torba. Hai le braccia
            stanche e il mantello grigio di polvere. Fra i ciuffi d'erba le falene camminano tutte verso la
            Lacrima senza alzarsi più in volo, e la collina davanti è libera.
          effetti: { profondita.accademia-lacrima-pietrificata: 1 }
        sconfitta:
          titolo: Dentro lo sciame
          testo: |
            Lo sciame ti avvolge, e per un tempo che sembra lunghissimo vedi
            soltanto ali grigie. Ti ritrovi al canale, senza ricordare di averlo
            raggiunto.
          effetti: { tormento: 1, ferite: 0.5 }

  - id: accademia-lacrima-il-campo-dei-tagliatori
    immagine: fazioni/gilda-dei-mercanti
    titolo: Il campo dei tagliatori
    sommario: "Una tenda della Gilda, un carro con i paranchi e due balestrieri che guardano chi sale. La Gilda è arrivata prima."
    luogo: La Lacrima pietrificata, il campo della Gilda
    area: accademia-lacrima-pietrificata
    ripetibile: true
    requisiti: [fazione.accademia == 11, accademia.lacrima == 0, profondita.accademia-lacrima-pietrificata == 1]
    testo: |
      A mezza costa la Gilda ha piantato una tenda e un carro con i paranchi, e una fila di picchetti con
      nastri gialli segna la strada fino alla Lacrima. I paranchi hanno le funi nuove e le carrucole d'ottone,
      e sul pianale del carro aspettano casse vuote foderate di paglia. Tre tagliatori affilano scalpelli
      intorno al fuoco. Sul limite del campo uno dei due balestrieri dei Custodi carica la balestra senza
      fretta.

      «Il sopralluogo lo fa la Gilda, per ordine della Casa dei Nodi» dice il capo dei tagliatori, un uomo
      basso con i baffi gialli di tabacco. «Voi guardate da qui.»

      {origine mercante-dei-ponti} Lo conosci dai Ponti, dove vende scalpelli usati per nuovi, e anche lui si
      ricorda di te.
    opzioni:
      - testo: "Convincerli che il Consiglio ha autorizzato anche voi"
        descrizione: "Il sopralluogo l'ha autorizzato il Consiglio, non la Casa dei Nodi. Bisogna spiegarlo senza alzare la voce."
        prova: { attributo: sociale, abilita: persuasione, difficolta: Media }
        successo:
          titolo: Il sigillo del Municipio
          testo: |
            Mostri al capo dei tagliatori la carta con il sigillo del Municipio e gli spieghi chi l'ha
            firmata. Lui la legge due volte muovendo le labbra sulla firma, e sputa nel fuoco. Poi fa
            abbassare le balestre. «Guardate quello che volete. Tanto la pietra se la portiamo a casa noi»
            dice.
          pe: { persuasione: 5 }
          effetti: { profondita.accademia-lacrima-pietrificata: 1 }
        fallimento:
          titolo: La balestra
          testo: |
            Il capo dei tagliatori ti ascolta fino in fondo, poi fa un cenno al balestriere, che ti tira una
            quadrella ai piedi. La quadrella si pianta nella torba fino alle penne, a un palmo dal tuo
            stivale. Tornate giù per il pendio, e dietro di voi i tagliatori ridono.
          effetti: { ferite: 0.5 }

      - testo: "Mostrare la licenza della Gilda"
        descrizione: "Chi ha la licenza della Gilda è un socio, e un socio sale dove vuole."
        requisiti: [licenza-gilda >= 1]
        esito:
          titolo: Fra soci
          testo: |
            Mostri la licenza, e il capo dei tagliatori si toglie il cappello. Ti offre anche il tè, nero come
            la torba e così amaro che ti allappa la lingua. Poi fa togliere un picchetto per lasciarti
            passare.
          effetti: { profondita.accademia-lacrima-pietrificata: 1 }

      - testo: "Passare da amico della Gilda"
        descrizione: "Alla Casa dei Nodi il tuo nome lo conoscono, e lo conoscono bene."
        requisiti: [rep.gilda >= 3]
        esito:
          titolo: Il nome giusto
          testo: |
            Dici il tuo nome, e il capo dei tagliatori lo ripete a voce bassa, poi fa abbassare le balestre.
            Ti accompagna lui fino all'ultimo picchetto. Per tutta la strada parla del tempo e non guarda mai
            verso la Lacrima.
          effetti: { profondita.accademia-lacrima-pietrificata: 1 }

      - testo: "Forzare il passaggio"
        descrizione: "Sono due balestrieri. Se la Gilda vuole la Lacrima, che venga a prendersela dopo."
        combattimento: accademia-i-balestrieri-della-gilda
        vittoria:
          titolo: Le balestre nella torba
          testo: |
            I due balestrieri finiscono nella torba, uno con la balestra spezzata, e i tagliatori alzano le
            mani prima che tu glielo chieda. Passi oltre i picchetti con un nastro giallo impigliato nello
            stivale, e alla Casa dei Nodi stasera qualcuno scriverà il tuo nome.
          effetti: { profondita.accademia-lacrima-pietrificata: 1, rep.gilda: -1 }
        sconfitta:
          titolo: Le quadrelle
          testo: |
            Una quadrella ti prende alla coscia, e devi tornare giù fino al
            canale con Tobol che ti regge. I balestrieri non vi inseguono.
          effetti: { ferite: 1 }

      - testo: "Aggirare il campo dal lato in ombra"
        descrizione: "Sul lato nord della collina la brina scivola, e per questo lassù non ci va nessuno. Ci vuole tempo."
        costo: 2
        esito:
          titolo: Il lato in ombra
          testo: |
            Giri la collina dal lato nord, dove la torba è coperta di brina e scivola come vetro. Lì l'erba è
            dura di gelo e si spezza fra le dita quando ci cerchi un appiglio. Ci metti il pomeriggio intero.
            Quando sbuchi sopra il campo della Gilda i tagliatori sono di spalle, e tu sei già oltre.
          pe: { furtivita: 2 }
          effetti: { profondita.accademia-lacrima-pietrificata: 1 }

  - id: accademia-lacrima-il-novizio-del-velo
    immagine: ambientazione/cattedrale-del-velo
    titolo: Il novizio del Velo
    sommario: "Su un sasso, avvolto in un mantello nero, un novizio del Velo guarda la Lacrima e prende appunti."
    luogo: La Lacrima pietrificata, un sasso sul fianco della collina
    area: accademia-lacrima-pietrificata
    ripetibile: true
    requisiti: [fazione.accademia == 11, accademia.lacrima == 0, profondita.accademia-lacrima-pietrificata == 1]
    testo: |
      Su un sasso sotto la brina siede un ragazzo con il mantello nero dei novizi del Velo e una tavoletta di
      cera sulle ginocchia. Intorno al sasso la torba è pestata in un cerchio di pochi passi, e fuori dal
      cerchio non c'è un'orma. Ogni tanto incide un segno guardando la Lacrima, e quando ti vede nasconde la
      tavoletta.

      «Mi ha mandato Ottilia Sanvel» dice. «Devo solo guardare, e contare le falene e chi sale.»

      {empatia Media} È qui da giorni e ha più paura della collina che di te, e gli manca la voce di qualcuno.

      {origine accolito-del-velo} Agli esercizi dell'alba stava nella fila dietro la tua e cantava sempre
      mezzo tono sotto.
    opzioni:
      - testo: "Sedersi con lui e farlo parlare"
        descrizione: "Un ragazzo solo con il freddo addosso. Basta un po' di pane e qualche domanda."
        prova: { attributo: sociale, abilita: empatia, difficolta: Media }
        successo:
          titolo: Le falene contate
          testo: |
            Dividi il pane con lui, e lui ti mostra la tavoletta. Conta le falene morte ogni mattina con una
            tacca per ciascuna, e ogni riga di tacche è più lunga di quella del giorno prima. Ottilia vuole
            sapere se la Lacrima va sigillata, e lui crede di sì. Ti insegna il sentiero che sale senza
            passare dalla brina, e ti dice che se la vuoi chiudere, lui conosce le parole.
          pe: { empatia: 5 }
          imposta: { accademia.custode: 1 }
          effetti: { profondita.accademia-lacrima-pietrificata: 1 }
        fallimento:
          titolo: La tavoletta
          testo: |
            Gli fai una domanda di troppo, e lui si chiude nel mantello fino al naso. Ti dice che deve parlare
            solo con Ottilia, e torna a guardare la Lacrima. Prima che tu te ne vada ha già ripreso a
            incidere, con la tavoletta girata dall'altra parte.

      - testo: "Salutarlo come in Cattedrale"
        descrizione: "La formula del chiostro, quella che si scambiano i novizi all'alba. Lui la riconoscerà."
        quando: [origine.accolito-del-velo >= 1]
        esito:
          titolo: Mezzo tono sotto
          testo: |
            Gli dici la formula dell'alba, e lui risponde mezzo tono sotto, come sempre. Poi ride, e il fiato
            gli esce in una nuvola bianca che resta ferma davanti alla faccia. Per un momento non ha più
            freddo. Ti insegna il sentiero che sale senza passare dalla brina, e ti dice che se la vuoi
            chiudere, la Lacrima, lui conosce le parole.
          pe: { empatia: 5 }
          imposta: { accademia.custode: 1 }
          effetti: { profondita.accademia-lacrima-pietrificata: 1 }

      - testo: "Lasciarlo ai suoi conti e salire"
        descrizione: "È un novizio con una tavoletta, e fermarti non è affar suo."
        esito:
          titolo: Il segno sulla cera
          testo: |
            Gli passi accanto senza fermarti, e lo senti incidere un segno sulla
            cera mentre sali. Ottilia saprà che sei passat{o|a} prima di sera.
          effetti: { profondita.accademia-lacrima-pietrificata: 1 }

  # ------------------------------------------------------------ 2 · la collina scavata
  - id: accademia-lacrima-i-cunicoli
    immagine: ambientazione/palude-acquanera
    titolo: I cunicoli nella torba
    sommario: "La collina è scavata da cunicoli stretti, vecchi, che salgono verso la Lacrima da sotto."
    luogo: La Lacrima pietrificata, dentro la collina
    area: accademia-lacrima-pietrificata
    ripetibile: true
    requisiti: [fazione.accademia == 11, accademia.lacrima == 0, profondita.accademia-lacrima-pietrificata == 2]
    testo: |
      Sotto la brina la collina è bucata da cunicoli stretti, scavati nella torba molto tempo fa, che
      conservano i segni delle vanghe. Le tacche a mezzaluna di ogni colpo sono ancora nette, e la torba non
      si è richiusa su nessuna. Salgono verso la Lacrima da sotto, e dentro fa meno freddo che fuori. In un
      cunicolo c'è ancora una vanga di legno annerita, intera come se l'avessero posata ieri. Il manico è
      lucido nei due punti dove lo stringevano le mani.

      {atletica Media} I cunicoli sono ripidi e stretti di spalle, e si sale con i gomiti e le ginocchia. La
      torba umida cede di un dito a ogni spinta.
    opzioni:
      - testo: "Salire dentro i cunicoli"
        descrizione: "Gomiti e ginocchia, e la torba che si sbriciola in faccia. Sotto la Lacrima, però, si arriva."
        prova: { attributo: fisico, abilita: atletica, difficolta: Media }
        successo:
          titolo: Sotto la Lacrima
          testo: |
            Sali a forza di gomiti per un cunicolo che si stringe e poi si allarga di colpo, e sbuchi in una
            cavità della torba proprio sotto la Lacrima. Le pareti della cavità sono lisce e velate di
            ghiaccio, e qui dentro fa più freddo che nel cunicolo. Sopra la tua testa c'è il cristallo azzurro
            che gocciola brina.
          pe: { atletica: 5 }
          effetti: { profondita.accademia-lacrima-pietrificata: 1 }
        fallimento:
          titolo: Di schiena
          testo: |
            A metà cunicolo la torba ti cede sotto il gomito, e scivoli giù di
            schiena fino all'imbocco, con la bocca piena di terra nera.
          effetti: { ferite: 0.5 }

      - testo: "Seguire la vanga vecchia"
        descrizione: "Chi ha lasciato la vanga sapeva dove andava. Il suo cunicolo sarà quello giusto."
        prova: { attributo: mentale, abilita: percezione, difficolta: Media }
        successo:
          titolo: Il cunicolo della vanga
          testo: |
            Il cunicolo della vanga è il più largo e il meno ripido, con i gradini scavati nella torba. Ogni
            gradino è alto una spanna e ha il bordo consumato al centro, dove ci hanno messo il piede per
            anni. Lo sali in piedi, con la testa appena chinata, e arrivi sotto la Lacrima con le gambe ancora
            buone.
          pe: { percezione: 5 }
          effetti: { profondita.accademia-lacrima-pietrificata: 1 }
        fallimento:
          titolo: Il cunicolo cieco
          testo: |
            Il cunicolo della vanga finisce contro un muro di torba dura, e devi
            tornare indietro carponi per un tratto lungo.
          effetti: { tormento: 1 }

  - id: accademia-lacrima-il-gelo
    immagine: ambientazione/mito-occhio-nel-cristallo
    titolo: Il gelo
    sommario: "Vicino alla Lacrima la torba è gelata, e chi tocca la pietra ci resta attaccato."
    luogo: La Lacrima pietrificata, la brina
    area: accademia-lacrima-pietrificata
    ripetibile: true
    requisiti: [fazione.accademia == 11, accademia.lacrima == 0, profondita.accademia-lacrima-pietrificata == 2]
    testo: |
      Sopra la brina la torba è dura come pietra e il freddo ti morde le orecchie. Per salire devi appoggiare
      le mani sulle schegge gelate della Lacrima che spuntano dal suolo. Le schegge sono trasparenti e hanno
      gli spigoli vivi, e la brina sotto il tuo palmo non si scioglie.

      {resistenza Media} Il freddo così forte fa male solo all'inizio, poi le dita diventano di legno ed è
      peggio.

      {origine fuggiasco-di-ghoran} Sulla strada da Ghoran hai imparato a tenere le mani sotto le ascelle fino
      all'ultimo, e lo fai anche adesso.

      Tobol si avvolge la cravatta intorno alle dita come un guanto.
    opzioni:
      - testo: "Salire con le mani nude"
        descrizione: "Un appoggio alla volta, e mai fermi. Il freddo vince chi si ferma."
        prova: { attributo: fisico, abilita: resistenza, difficolta: Media }
        successo:
          titolo: Le dita di legno
          testo: |
            Sali senza fermarti, un appoggio dopo l'altro, e il freddo non fa in tempo a prenderti le mani.
            Ogni scheggia ti lascia sul palmo un segno bianco che sparisce dopo qualche passo. In cima ti
            infili le dita in bocca, e ci mettono un pezzo a ricordarsi di essere tue.
          pe: { resistenza: 5 }
          effetti: { profondita.accademia-lacrima-pietrificata: 1 }
        fallimento:
          titolo: La mano attaccata
          testo: |
            Ti fermi un momento di troppo, e la mano ti resta attaccata al cristallo. Te la stacchi
            lasciandoci sopra un pezzo di pelle, e torni giù con il palmo che sanguina. Il sangue sulla
            scheggia gela subito in una macchia scura che non cola.
          effetti: { ferite: 0.5 }

      - testo: "Fasciarsi le mani e salire piano"
        descrizione: "Stracci, cuoio, la cravatta di Tobol se serve. Si sale più lenti, ma con le dita intere."
        costo: 2
        esito:
          titolo: Le fasce
          testo: |
            Ti fasci le mani con le maniche della camicia e una striscia di cuoio della borsa, e sali un passo
            alla volta. Il freddo arriva lo stesso attraverso la stoffa. Arriva più piano, e le dita restano
            tue. Ci metti il doppio del tempo. In cima Tobol ti offre un pezzo della sua cravatta, che ormai non gli serve più.
          pe: { resistenza: 2 }
          effetti: { profondita.accademia-lacrima-pietrificata: 1 }

  # ------------------------------------------------------------ 3 · sotto la Lacrima
  - id: accademia-lacrima-le-falene-morte
    immagine: icone/butterfly
    titolo: Le falene morte
    sommario: "Alla base della Lacrima le falene morte fanno uno strato spesso come un tappeto, e hanno tutte la bocca aperta."
    luogo: La Lacrima pietrificata, alla base del cristallo
    area: accademia-lacrima-pietrificata
    ripetibile: true
    requisiti: [fazione.accademia == 11, accademia.lacrima == 0, profondita.accademia-lacrima-pietrificata == 3]
    testo: |
      Alla base della Lacrima le falene morte fanno uno strato grigio che scricchiola sotto gli stivali, tutte
      con le ali aperte verso il cristallo. Lo strato è alto una spanna, e sotto le ali grigie di sopra ci
      sono quelle più vecchie, che il peso ha ridotto a una polvere scura. Nell'aria c'è un odore dolce e
      metallico che ti si posa sulla lingua.

      {medicina Media} Dentro la bocca aperta hanno una polvere bianca, la stessa che lascia il fumo di un
      cristallo imploso, e il sapore di metallo viene da lì.

      Tobol si copre il naso e dice che quarant'anni fa le falene non c'erano.
    opzioni:
      - testo: "Esaminare le falene"
        descrizione: "La polvere bianca nella bocca delle falene viene da qualche parte. Saperlo può servire."
        prova: { attributo: mentale, abilita: medicina, difficolta: Media }
        successo:
          titolo: La polvere bianca
          testo: |
            Apri la bocca di una falena con la punta di un coltello e annusi la polvere. È fumo di cristallo,
            recente. Ce l'hanno solo le falene in cima allo strato, e in quelle di sotto non ne trovi. Pochi
            giorni fa qualcuno ha provato a staccare un pezzo della Lacrima, e il pezzo è imploso. Lo dici a
            Tobol, che guarda verso il campo della Gilda.
          pe: { medicina: 5 }
          effetti: { profondita.accademia-lacrima-pietrificata: 1, informazioni.pettegolezzo: 1 }
        fallimento:
          titolo: Il sapore
          testo: |
            Ti avvicini troppo, e la polvere ti va in gola. Per qualche ora le parole ti escono storte, come
            se avessi la lingua di un altro. Il sapore di metallo dolce ti resta in bocca fino a sera, e
            l'acqua della borraccia non lo porta via.
          effetti: { tormento: 1 }

      - testo: "Camminare sopra le falene fino al cristallo"
        descrizione: "Sono morte. Basta non pensarci."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Facile }
        successo:
          titolo: Lo scricchiolio
          testo: |
            Cammini sopra lo strato di falene fino alla Lacrima, e a ogni passo lo scricchiolio ti sale lungo
            le gambe. Più vicino al cristallo lo strato si alza, e gli stivali ci affondano fino alla
            caviglia. Non ti fermi finché non hai il cristallo a un braccio dalla faccia.
          pe: { resilienza: 4 }
          effetti: { profondita.accademia-lacrima-pietrificata: 1 }
        fallimento:
          titolo: Un passo indietro
          testo: |
            Al terzo passo lo scricchiolio ti fa venire la nausea, e torni
            indietro fino alla torba nuda.
          effetti: { tormento: 1 }

  - id: accademia-lacrima-il-fumo-vecchio
    immagine: ambientazione/mito-occhio-nel-cristallo
    titolo: Il fumo vecchio
    sommario: "Su un lato della Lacrima c'è una ferita fresca, e da lì esce un fumo lattiginoso che non si disperde."
    luogo: La Lacrima pietrificata, il lato della ferita
    area: accademia-lacrima-pietrificata
    ripetibile: true
    requisiti: [fazione.accademia == 11, accademia.lacrima == 0, profondita.accademia-lacrima-pietrificata == 3]
    testo: |
      Sul lato della Lacrima verso il campo della Gilda c'è una ferita, dove qualcuno ha provato a staccare
      una scheggia. I bordi sono netti come quelli di un vetro spaccato e conservano i segni dello scalpello.
      Ne esce un fumo lattiginoso che non si disperde e resta sospeso in una nuvola bassa all'altezza del
      petto. Il vento delle torbiere piega l'erba su tutto il fianco della collina, e la nuvola resta dov'è.
      Ti dici che il freddo della Lacrima la tiene schiacciata a terra come la nebbia sui canali.

      {magia Media} Il fumo è Mana spezzato, e sulla pelle lo senti arrivare a strappi senza la corrente del
      cristallo. Chi lo respira perde le parole per un po', e qualcuno per sempre.

      {acrobazia Facile} Per arrivare al cristallo da questo lato bisogna strisciare sotto la nuvola senza
      toccarla con la schiena. Fra il fumo e la brina resta lo spazio di un corpo disteso.
    opzioni:
      - testo: "Passare sotto il fumo a bocca chiusa"
        descrizione: "Una nuvola bassa e lenta, che fa male soltanto a chi la respira."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Media }
        successo:
          titolo: Sotto la nuvola
          testo: |
            Stringi le labbra e ti tappi il naso, e passi sotto la nuvola a quattro zampe. Il sapore di
            metallo dolce ti arriva lo stesso sulla lingua. Di là tossisci una volta nel gomito, e il
            cristallo è a un passo. Sulla manica, dove hai tossito, resta un velo di polvere bianca.
          pe: { resilienza: 5 }
          effetti: { profondita.accademia-lacrima-pietrificata: 1 }
        fallimento:
          titolo: Senza parole
          testo: |
            Respiri a metà strada, e il fumo ti entra in gola con il suo sapore di metallo dolce. Per mezza
            giornata non riesci a dire una parola intera, e Tobol parla per tutti e due. In testa le parole le
            hai intere, e si rompono appena arrivano alla lingua.
          effetti: { tormento: 1.5 }

      - testo: "Strisciare sotto la nuvola"
        descrizione: "Pancia a terra, e la schiena lontana dal fumo."
        prova: { attributo: fisico, abilita: acrobazia, difficolta: Media }
        successo:
          titolo: Pancia a terra
          testo: |
            Strisci sulla brina con la pancia a terra, e il fumo ti passa sopra la schiena a un palmo di
            distanza. La brina ti si scioglie sotto il petto e ti passa la giubba fino alla pelle. Di là ti
            rialzi con la giubba bagnata e il cristallo davanti, e sotto la nuvola resta il solco del tuo
            corpo nella brina.
          pe: { acrobazia: 5 }
          effetti: { profondita.accademia-lacrima-pietrificata: 1 }
        fallimento:
          titolo: La schiena
          testo: |
            Alzi la schiena di un niente, e il fumo ti si posa addosso come
            una coperta. Torni indietro tossendo.
          effetti: { tormento: 1, ferite: 0.5 }

  # ------------------------------------------------------------ 4 · il cuore: la goccia che non cade
  - id: accademia-lacrima-la-goccia-che-non-cade
    immagine: ambientazione/mito-occhio-nel-cristallo
    titolo: La goccia che non cade
    sommario: "Davanti alla Lacrima pietrificata, nel freddo. Dentro il cristallo qualcosa si muove quando ti muovi tu."
    luogo: La Lacrima pietrificata, davanti al cristallo
    area: accademia-lacrima-pietrificata
    requisiti: [fazione.accademia == 11, accademia.lacrima == 0, profondita.accademia-lacrima-pietrificata >= 4]
    testo: |
      Da vicino la Lacrima è più grande di come sembrava dall'argine, conficcata di traverso nella torba con
      la punta verso il cielo. Il cristallo è di un azzurro quasi bianco e gocciola brina senza consumarsi
      mai. Tobol si ferma un passo dietro di te, e Whisp gli scende dentro il colletto fino a nascondere la
      coda.

      Al centro del cristallo c'è un punto più scuro che si sposta quando ti sposti tu. Ti dici che è la luce
      che piega nello spessore, come nel fondo di una bottiglia. Fai due passi a sinistra e torni indietro, e
      il punto viene con te tutte e due le volte. Ha la forma di un occhio, e ti segue.

      {accademiche Media} L'Occhio nel Cristallo è una storia da balie, e nei trattati non ha una nota. Si
      dice che chi prova a estrarlo fa implodere il cristallo.
    opzioni:
      - testo: "Misurare la Lacrima con Leggere il Mana"
        descrizione: "Quanta carica ha, e se reggerebbe la condotta. È quello che il Consiglio vuole sapere, e niente di più."
        incantesimo: leggere-il-mana
        prova: { attributo: mentale, abilita: magia, difficolta: Media }
        successo:
          titolo: Una vita intera
          testo: |
            Appoggi due dita sulla brina e lasci che il Mana della Lacrima ti racconti quanto è grande. È
            enorme e regolare, con una corrente che non cambia mai di forza, e reggerebbe la condotta di
            Qir-Azel per una vita. Scrivi le misure sul quaderno di Tobol con le dita che tremano, e scendete
            dalla collina senza voltarvi verso l'occhio. Le due dita restano bianche di freddo fino ai piedi
            della collina.
          pe: { magia: 6 }
          imposta: { accademia.lacrima: 1 }
          vai: superficie-fratturata
        fallimento:
          titolo: L'occhio
          testo: |
            Il Mana della Lacrima ti viene incontro troppo in fretta, e l'occhio al centro sale verso la
            superficie fino a un dito dalla tua mano. Ti stacchi di colpo, con il cuore in gola. Quando guardi
            di nuovo il punto scuro è tornato al centro del cristallo.
          effetti: { tormento: 1.5 }

      - testo: "Misurarla con gli strumenti di Tobol"
        descrizione: "Una corda graduata, un pendolo di ottone e la pazienza di un cartografo. Il Mana si misura anche dal freddo."
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Media }
        successo:
          titolo: Le misure
          testo: |
            Con la corda di Tobol misuri la Lacrima da un capo all'altro, e con il pendolo il freddo che le
            gira intorno. Più ti avvicini al cristallo e più il pendolo oscilla corto, finché a un palmo dalla
            brina si muove appena. Tobol fa i conti sulla mappa e poi li rifà, perché il risultato gli sembra
            troppo grande. La Lacrima reggerebbe la condotta per una vita. Scendete con le misure in tasca e
            l'occhio che vi guarda andare.
          pe: { tecnologia: 6 }
          imposta: { accademia.lacrima: 1 }
          vai: superficie-fratturata
        fallimento:
          titolo: Il pendolo fermo
          testo: |
            Il pendolo vicino al cristallo si ferma di traverso e non riparte, sospeso dalla parte della
            Lacrima con il filo teso. Tobol lo guarda a lungo e poi lo mette via, e ti dice di riprovare
            quando le mani non vi tremano.
          effetti: { tormento: 1 }

      - testo: "Staccare una scheggia per Orvald"
        descrizione: "Orvald vorrebbe un pezzo da studiare. La storia dell'occhio dice di non farlo, e la ferita sul fianco dice che qualcuno l'ha già fatto."
        prova: { attributo: fisico, abilita: acrobazia, difficolta: Difficile }
        successo:
          titolo: La scheggia
          testo: |
            Scegli una scheggia sul bordo lontano dall'occhio e la stacchi con un colpo secco di piccozza,
            girando la faccia dall'altra parte. La scheggia resta intera e fredda nel palmo, senza fumo. In
            mano non si scalda, e la brina le si riforma sopra appena smetti di soffiarci. La avvolgi nella
            cravatta di Tobol, che si lamenta a lungo. Poi scendete con le misure e il pezzo per Orvald.
          pe: { acrobazia: 6 }
          imposta: { accademia.lacrima: 1 }
          effetti: { reperto.sigillato: 1 }
          vai: superficie-fratturata
        fallimento:
          titolo: Il fumo lattiginoso
          testo: |
            La scheggia ti implode fra le dita con un rumore di vetro soffiato, e un fumo lattiginoso ti esce
            dalle mani e ti entra in bocca. Sulle dita ti resta una polvere bianca fine come farina. Per
            giorni le parole ti escono a metà, e hai in bocca il sapore di metallo dolce. Tobol ti riporta giù
            per la collina tenendoti per il gomito, con le misure che ha preso lui mentre tu non c'eri.
          imposta: { accademia.lacrima: 1 }
          effetti: { tormento: 1.5, ferite: 0.5 }
          vai: superficie-fratturata

      - testo: "Segnarla per l'estrazione della Gilda"
        descrizione: "Se la segni per loro, la Lacrima arriva in città, e la Gilda ne reclama la proprietà."
        esito:
          titolo: I nastri gialli
          testo: |
            Scendi al campo dei tagliatori e dici al capo che la Lacrima regge la condotta, e che il Consiglio
            ne avrà bisogno. Lui fa piantare i picchetti con il nastro giallo tutto intorno al cristallo,
            finché la Lacrima non è chiusa in un recinto della Gilda. I tagliatori battono i picchetti nella
            torba gelata a colpi di mazza, e nessuno alza gli occhi verso il centro del cristallo. Tobol ti
            guarda e arrotola la mappa. «La Casa dei Nodi ti ringrazierà per iscritto. Io avrei preferito che
            le misure le vedesse prima il Consiglio» dice, senza sorridere.
          imposta: { accademia.lacrima: 2 }
          effetti: { rep.gilda: 1 }
          vai: superficie-fratturata

      - testo: "Sigillarla per il Velo"
        descrizione: "Il Sigillo chiude il Mana dentro la pietra. La Lacrima non guarderebbe più nessuno, e non servirebbe più a nessuno."
        incantesimo: sigillo
        prova: { attributo: mentale, abilita: magia, difficolta: Media }
        successo:
          titolo: L'occhio chiuso
          testo: |
            Appoggi il palmo sulla brina e chiudi il Mana della Lacrima dentro la pietra, giro dopo giro,
            finché l'occhio al centro smette di seguirti e si ferma. A ogni giro il freddo sotto il palmo
            cala, e alla fine la brina ti si scioglie fra le dita. Il cristallo diventa opaco come un vetro
            appannato, e le falene smettono di posarsi. Ottilia lo saprà prima di sera, e la condotta dovrà
            trovare un'altra strada.
          pe: { magia: 6 }
          imposta: { accademia.lacrima: 3 }
          effetti: { rep.velo: 1 }
          vai: superficie-fratturata
        fallimento:
          titolo: Il Mana che torna
          testo: |
            Il Mana della Lacrima ti torna indietro tutto in una volta, e ti
            ritrovi sedut{o|a} sulle falene morte con le orecchie che fischiano.
          effetti: { tormento: 1.5 }

      - testo: "Chiedere al novizio le parole del Velo"
        descrizione: "Il ragazzo di Ottilia conosce le parole per chiudere la pietra. Basta portarlo fin qui e lasciargliele dire."
        quando: [accademia.custode >= 1]
        esito:
          titolo: Le parole del novizio
          testo: |
            Il novizio sale fino alla Lacrima con le gambe che tremano e dice le parole a mezza voce, mezzo
            tono sotto, con la mano sulla brina. A ogni frase la brina intorno alla sua mano si ritira di un
            dito, e alla fine lui ha il palmo sulla pietra nuda. Il cristallo diventa opaco come un vetro
            appannato e l'occhio al centro si ferma. Il ragazzo piange e dice che è il freddo, e tu fai finta
            di crederci. Ottilia lo saprà prima di sera.
          imposta: { accademia.lacrima: 3 }
          effetti: { rep.velo: 1 }
          vai: superficie-fratturata

      - testo: "Misurarla a occhio e con la corda"
        descrizione: "Bastano una corda graduata e il conto dei passi, senza magia. Per farlo bene ci vuole il giorno intero."
        costo: 2
        esito:
          titolo: Il giorno intero
          testo: |
            Misuri la Lacrima con la corda e con i passi, e conti quanto ci mette una goccia di brina a
            cristallizzarsi sul guanto. Tobol scrive tutto. A sera i numeri dicono che la Lacrima reggerebbe
            la condotta a lungo, molto più della Vecchia. Al tramonto le prime falene arrivano dai canali una
