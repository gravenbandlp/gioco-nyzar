# Glossario della quest dell'Accademia: i personaggi nuovi (Agnese Lunardi, Severo Dalmas, Ermanno Querci,
# Lucio Ruspi) e Tobol Aspern, che c'era già senza voce. Presentazioni stabili, senza i segreti della quest.
glossario:
  - id: agnese-lunardi
    nome: Agnese Lunardi
    alias: [Agnese]
    tipo: personaggio
    sottotitolo: "Maestra di laboratorio all'Accademia di Torvessa"
    testo: "Maestra di laboratorio sui sessant'anni, con i capelli grigi raccolti in una crocchia e i guanti di pelle anche d'estate. Conta sottovoce mentre parla, e agli allievi insegna a caricare i cristalli senza farsi tornare indietro il Mana. Gli allievi del terzo anno la temono e le portano i biscotti."
    requisiti: []

  - id: severo-dalmas
    nome: Severo Dalmas
    alias: [Dalmas]
    tipo: personaggio
    sottotitolo: "Mago, compagno di scavo di Orvald Temmerin"
    testo: "Mago dell'Accademia di Torvessa e compagno di scavo di Orvald Temmerin al Gradone Rosso, nel centoventi. Aveva sempre le dita nere d'inchiostro e scriveva a gesso su qualunque superficie. Lasciò l'Accademia anni fa, e la sua stanza nella torretta è rimasta chiusa da allora."
    requisiti: []

  - id: ermanno-querci
    nome: Ermanno Querci
    alias: [Querci]
    tipo: personaggio
    sottotitolo: "Tesoriere dell'Accademia di Torvessa"
    testo: "Il tesoriere dell'Accademia, magro, con le maniche protette da due manicotti di tela nera. Sospira a ogni moneta che esce dalla cassa e conta due volte quelle che entrano. Nel consiglio dei maestri vota quasi sempre per spendere meno, e quasi sempre vince."
    requisiti: []

  - id: lucio-ruspi
    nome: Lucio Ruspi
    alias: [Lucio]
    tipo: personaggio
    sottotitolo: "Allievo del primo anno, di Via del Salmone"
    testo: "Un ragazzino magro del primo anno dell'Accademia, cresciuto in Via del Salmone. È all'Accademia grazie a una borsa di studio, giura sempre con tutte e due le mani in vista e porta le scarpe di un fratello più grande."
    requisiti: []

  - id: tobol-aspern
    nome: Tobol Aspern
    alias: [Tobol]
    tipo: personaggio
    sottotitolo: "Cartografo, vecchio amico di Orvald Temmerin"
    testo: "Gnomo anziano con i capelli rossi sbiaditi e gli occhiali tondi, che porta gilet ricamati a fiori. Disegna le mappe della regione e paga bene chi gli porta notizie esatte. Sulla spalla tiene Whisp, un geco verde brillante. Litiga con Orvald Temmerin da una vita, e la cravatta del giorno dopo dice com'è andata."
    requisiti: []
