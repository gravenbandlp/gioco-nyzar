# Gli oggetti della quest dell'Accademia di Torvessa, uno o due per grado (docs/regolamento-oggetti.md: punti =
# grado + difetti). Grado 1: cristallo d'aula o lente da tasca. Grado 2: la piccozza del centoventi. Grado 3: l'anello
# d'ottone di Orvald, per chi non prende Sigillo o Lancia di luce. Grado 4: il bastone del Regolatore. Grado 5: il
# mantello del cerchio aperto (grado 4, Legato) e, per chi non ha Magia 4, il sigillo del cerchio aperto.
oggetti:
  - id: accademia-cristallo-d-aula
    nome: Cristallo d'aula
    immagine: icone/crystal-growth
    descrizione: "Un cristallo conduttore piccolo come un pollice, montato su un anello d'ottone da cattedra. Gli allievi del primo anno ci imparano ad ascoltare il Mana, e questo ha il bordo consumato da molte dita."
    slot: accessorio
    grado: 1
    proprieta: { talento: { magia: 1 } }

  - id: accademia-lente-da-tasca
    nome: Lente da tasca di Tobol
    immagine: icone/magnifying-glass
    descrizione: "Una lente di cristallo molato in una montatura d'ottone che si chiude come un orologio. Tobol Aspern ne ha sei, e questa dice che era quella di riserva."
    slot: accessorio
    grado: 1
    proprieta: { talento: { percezione: 1 } }

  - id: accademia-piccozza-del-centoventi
    nome: Piccozza del centoventi
    immagine: icone/war-pick
    descrizione: "La piccozza di scavo di Orvald Temmerin, con il manico rifatto due volte e la punta temprata in una fucina della Città Bassa. Ha aperto la strada nel Gradone Rosso trent'anni fa."
    slot: arma
    base: ascia-da-battaglia
    grado: 2
    dadi: 1
    proprieta: { talento: { atletica: 1 } }

  - id: accademia-anello-d-ottone
    nome: Anello d'ottone dei Precursori
    immagine: icone/ring
    descrizione: "Il primo pezzo che Orvald ha trovato in vita sua, un anello d'ottone dei Precursori che Pett nasconde appena può. Chi lo porta, quando cade, si rialza una volta di più."
    slot: accessorio
    grado: 2
    proprieta: { ultimoRespiro: true }

  - id: accademia-bastone-del-regolatore
    nome: Bastone del Regolatore
    immagine: icone/wizard-staff
    descrizione: "Un bastone di frassino ferrato con una ghiera di lyssan e un cristallo spento in cima, che si accende quando passa vicino alla condotta. In città lo riconoscono i maghi anziani e le guardie della Casa dei Nodi."
    slot: arma
    base: mazza
    grado: 3
    dadi: 2
    proprieta: { riserva: 1, talento: { magia: 1 } }
    difetti: [riconoscibile]

  - id: accademia-mantello-del-cerchio-aperto
    nome: Mantello del cerchio aperto
    immagine: icone/cape
    descrizione: "Lana grigia con il cerchio incompleto dell'Accademia ricamato in filo di lyssan sulla spalla. Il ricamo si scalda vicino ai cristalli, e chi l'ha indossato non riesce più a toglierselo per più di una notte."
    slot: armatura
    base: giaco-imbottito
    grado: 4
    dadi: 1
    proprieta: { lucida: true, talento: { magia: 1, accademiche: 1 } }
    difetti: [legata]

  - id: accademia-sigillo-del-cerchio-aperto
    nome: Sigillo del cerchio aperto
    immagine: icone/diamond-ring
    descrizione: "Un anello con il sigillo dell'Accademia, il cerchio lasciato aperto in alto. Ne esistono sette, e i maestri lo girano sul dito quando una cosa va rifatta."
    slot: accessorio
    grado: 3
    proprieta: { secondaScelta: true }
