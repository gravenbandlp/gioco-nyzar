      La Vecchia è sveglia. Le venature sono accese da cima a fondo e non si spengono più, e il registro dei Regolatori è rimasto aperto alla
      pagina di ieri, perché non c'è più niente da contare. Il cristallo è più pieno di quanto sia mai stato e batte la sua sequenza con la
      regolarità di un orologio, rispondendo a qualcosa che sta molto più in basso della città.

      {magia Difficile} Lo senti anche nello studio di Orvald. Sotto il battito c'è la chiamata, e la Vecchia la conosce per nome.

      Il consiglio dei maestri è sceso al completo, sette sedie intorno al tavolo dei Regolatori, e nessuno guarda il cristallo. Querci ha portato
