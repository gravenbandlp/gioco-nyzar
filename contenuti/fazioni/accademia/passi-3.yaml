    luogo: Accademia di Torvessa, la Camera della Condotta
    area: quartieri-alti
    requisiti: [fazione.accademia == 14, accademia.eco >= 1, accademia.esito == 2]
    testo: |
      La Lacrima è arrivata in città su un carro con sei muli, sotto un telo cerato, e ci sono voluti tre giorni per calarla nella Camera con
      i paranchi. Adesso sta sul supporto di lyssan al posto della Vecchia, di traverso come stava nella torba, e l'acqua dei canali corre
      forte come non correva da anni. In Via del Salmone la fontana getta anche il pomeriggio. La Vecchia, spenta, è partita per le vetrine
      della Biblioteca, dove Mattias Crenn le ha preparato un posto accanto ai cristalli dell'Eclisse.

      {magia Media} La Lacrima non batte. Il suo Mana gira piano intorno all'occhio, e l'occhio ti segue da una parete all'altra della Camera.

      Il consiglio dei maestri è sceso al completo, sette sedie intorno al tavolo dei Regolatori. Querci ha portato una borsa e un fagotto di
      lana grigia, e Julia Castaldi è in piedi in fondo con un foglio del Municipio, senza guardare il cristallo.

      «La Lacrima dura una vita, e la città lo sa» dice Orvald, accanto agli ultimi gessi di Severo ricopiati in fondo alle gallerie, che
      indicano tutti la Cicatrice. «Quello che guarda, però, guarda da laggiù. Quando scenderai, le mappe le voglio io.»
