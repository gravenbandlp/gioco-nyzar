            Orvald ti insegna la formula del coro, e tutti i cristalli della Camera cantano la stessa
            nota, mentre la Lacrima resta muta e l'occhio ti guarda cantare. Da oggi, dice il foglio del
            Municipio, quando si parla di acqua e di cristalli l'Accademia ha in Consiglio una voce senza
            voto, e quella voce sei tu.
          pe: { magia: 10 }
          almeno: { rep.accademia: 10 }
          imposta: { accademia.voce: 1 }
          effetti: { fazione.accademia: 1, oggetto.accademia-mantello-del-cerchio-aperto: 1, incantesimo.accademia-coro-dei-cristalli: 1, monete: 350 }

      - testo: "Accettare il cerchio e il sigillo"
        descrizione: "Il mantello dei maestri, la borsa del consiglio e uno dei sette anelli con il cerchio aperto."
        esito:
          titolo: Il settimo anello
          testo: |
            Querci ti mette sulle spalle il mantello del cerchio aperto e conta la borsa sospirando.
            Orvald ti infila al dito uno dei sette anelli dei maestri. «Era di Severo. Lo ha lasciato sul
            mio tavolo quando è partito.» Da oggi, dice il foglio del Municipio, quando si parla di acqua
