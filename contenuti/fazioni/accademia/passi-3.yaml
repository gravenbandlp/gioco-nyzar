      - testo: "Accettare il cerchio e il sigillo"
        descrizione: "Il mantello dei maestri, la borsa del consiglio e uno dei sette anelli con il cerchio aperto."
        esito:
          titolo: Il settimo anello
          testo: |
            Querci ti mette sulle spalle il mantello del cerchio aperto e conta la borsa sospirando a ogni
            moneta. Orvald si sfila dal dito uno dei sette anelli dei maestri e te lo infila al tuo. Sul
            castone il cerchio è inciso aperto in alto, e il bordo è consumato da un lato come quello di un
            anello girato sul dito per anni. «Era di Severo. Lo ha lasciato sul mio tavolo quando è partito»
            dice. Da oggi l'Accademia ha una voce in Consiglio quando si parla di acqua e di cristalli, una
            voce che parla senza votare, e quella voce sei tu. La lettera del Velo la apri dopo, da sol{o|a}.
