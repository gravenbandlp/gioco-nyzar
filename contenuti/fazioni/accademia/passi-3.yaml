# «Il cerchio aperto», passi 12-15 (fazione.accademia da 11 a 15). La spedizione della Lacrima (passo 12) e le
# gallerie della condotta (passo 15) stanno nei loro file.
# 12 Il consiglio ristretto: al ritorno dalla Lacrima Orvald e Agnese ti fanno Regolatore (grado 4).
# 13 La notte del battito (pista.capomozzo >= 7): la Vecchia batte la chiamata senza fermarsi, Agnese dice la formula
#   da sola (accademia.notte 1, 2 se la togli dal cristallo a forza), poi gli echi della Vecchia.
# 14 La scelta della condotta: il giunto, la Lacrima o la formula (accademia.esito 1, 2, 3). Chi riferisce alla Casa
#   dei Nodi (accademia.spia == 1) passa prima dalla sera prima del consiglio.
# 15 Dopo le gallerie (accademia.eco 1 vinta, 2 persa), il finale secondo accademia.esito, con il grado 5.
storylet:
  # ------------------------------------------------------------ passo 12 · il consiglio ristretto (grado 4)
  - id: accademia-il-consiglio-ristretto
    presso: accademia-di-torvessa
    immagine: ambientazione/cristalli-conduttori
    titolo: Il consiglio ristretto
    sommario: "Sei tornato dalla Lacrima pietrificata. Nella Camera della Condotta ti aspetta il consiglio ristretto, con un bastone appoggiato al tavolo dei Regolatori."
    luogo: Accademia di Torvessa, la Camera della Condotta
    area: quartieri-alti
    requisiti: [fazione.accademia == 11, accademia.lacrima >= 1]
    testo: |
      Il consiglio ristretto della condotta si riunisce nella Camera, intorno
      al tavolo dei Regolatori, perché Orvald dice che le cose sulla Vecchia
      si decidono davanti a lei. Agnese ha i guanti nuovi. Querci ha portato
      il suo registro e una sedia sua, imbottita. La Vecchia batte piano,
      con il giunto di rame appoggiato alla base, e il battito è più lungo di
      un mese fa.

      Racconti della Lacrima e delle misure che avete preso. Quando arrivi all'occhio Agnese smette di contare, e Querci smette di scrivere.

      {politica-ed-economia Media} Querci ha già fatto il conto di quanto
      costerebbe portare in città un cristallo lungo quanto un cavallo. Si
      vede dalle labbra, che si muovono.

      {empatia Media} Agnese guarda la Vecchia come si guarda un parente
      malato quando qualcuno nomina il testamento.

      Appoggiato al tavolo c'è un bastone di frassino ferrato, con una ghiera
      di lyssan e un cristallo spento in cima. Orvald lo prende e te lo tende.
      «Adesso della condotta sai più di chiunque, me compreso» dice. «Chi sa
      queste cose fa i turni. Il primo lo fai stanotte, e se lo reggi sei
      Regolatore.» Querci aggiunge con un sospiro che Julia Castaldi ha già firmato la paga del turno.

      {resistenza Media} Il bastone pesa più di quanto sembri. Le spalle se ne accorgono subito, e ti ricordano che stanotte non si dorme.

      {origine allievo-di-torvessa} Un bastone così l'hai visto appeso nello
      studio di Agnese, e al primo anno credevi che fosse un attrezzo per
      chiudere le finestre alte.
    opzioni:
      - testo: "Fare il primo turno da solo"
        descrizione: "Una notte intera accanto alla Vecchia a contare con la clessidra. Agnese dorme di sopra, se riesce."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Media }
        successo:
          titolo: Il primo turno
          testo: |
            Conti tutta la notte, con il bastone appoggiato alla spalla, e verso
            le tre il cristallo in cima si accende da solo, d'azzurro, ogni volta
            che la Vecchia batte. Lo prendi come un saluto. All'alba scrivi la
            tua prima riga nel registro dei Regolatori, sotto quella di Agnese.
            Orvald la legge e ci mette accanto una sigla. Da oggi la Camera è
            anche tua, e il turno ti viene pagato dal Municipio.
          pe: { resilienza: 6 }
          almeno: { rep.accademia: 8 }
          effetti: { fazione.accademia: 1, oggetto.accademia-bastone-del-regolatore: 1, rep.castaldi: 1, monete: 30 }
        fallimento:
          titolo: Il turno lungo
          testo: |
            Verso le tre il battito ti entra nella testa e non se ne va più, e
            ti ritrovi a contare ad alta voce senza riuscire a smettere. Agnese
            scende e finisce il turno con te, senza dire niente. All'alba Orvald
            ti mette lo stesso il bastone in mano, perché il primo turno, dice, l'ha sbagliato anche lui.
          almeno: { rep.accademia: 8 }
          effetti: { fazione.accademia: 1, oggetto.accademia-bastone-del-regolatore: 1, rep.castaldi: 1, monete: 30, tormento: 1 }

      - testo: "Regolare il battito con il Mana"
        descrizione: "Il cristallo in cima al bastone risponde alla Vecchia. Con le mani giuste, il battito si può allungare."
        requisiti: [magia >= 1]
        prova: { attributo: mentale, abilita: magia, difficolta: Media }
        successo:
          titolo: Il battito lungo
          testo: |
            Appoggi la punta del bastone alla base della Vecchia, e il Mana ti
            sale lungo il frassino fino alle mani. Lo lasci passare senza
            trattenerlo, e il battito si allunga di un respiro, poi di due.
            All'alba scende Agnese, che non ha dormito, e trova il registro pieno di numeri più bassi del solito. Ti stringe la mano attraverso il
            guanto. Da oggi la Camera è anche tua, e il turno te lo paga il
            Municipio.
          pe: { magia: 6 }
          almeno: { rep.accademia: 8 }
          effetti: { fazione.accademia: 1, oggetto.accademia-bastone-del-regolatore: 1, rep.castaldi: 1, monete: 30 }
        fallimento:
          titolo: Il colpo nelle mani
          testo: |
            Il Mana ti torna indietro dal bastone e ti fa cadere di mano il frassino. Agnese era sveglia di sopra, e scende a raccoglierlo per finire il turno con te. All'alba Orvald te lo rimette in mano. «Il bastone
            l'hai fatto cadere, la Vecchia no» dice, e tanto basta.
          almeno: { rep.accademia: 8 }
          effetti: { fazione.accademia: 1, oggetto.accademia-bastone-del-regolatore: 1, rep.castaldi: 1, monete: 30, tormento: 1 }

      - testo: "Tenere il registro come Agnese"
        descrizione: "Il registro dei Regolatori ha le sue abbreviazioni e i suoi conti. Chi lo tiene bene, regge il turno."
        prova: { attributo: mentale, abilita: accademiche, difficolta: Facile }
        successo:
          titolo: Le abbreviazioni
          testo: |
            Tieni il registro tutta la notte con le abbreviazioni di Agnese,
            una riga ogni cento battiti, e alle tre i tuoi numeri dicono quello
            che dicevano i suoi un anno fa. All'alba Agnese controlla tutto e
            corregge una sola virgola. Orvald firma accanto alla tua riga. Da
            oggi la Camera è anche tua, e il turno te lo paga il Municipio.
          pe: { accademiche: 6 }
          almeno: { rep.accademia: 8 }
          effetti: { fazione.accademia: 1, oggetto.accademia-bastone-del-regolatore: 1, rep.castaldi: 1, monete: 30 }
        fallimento:
          titolo: La virgola
          testo: |
            A metà notte perdi una riga, e da lì in poi i conti non tornano.
            All'alba Agnese rifà il registro da capo, con la pazienza che usa per
            i quaderni del primo anno, e Orvald ti mette lo stesso il bastone in
            mano.
          almeno: { rep.accademia: 8 }
          effetti: { fazione.accademia: 1, oggetto.accademia-bastone-del-regolatore: 1, rep.castaldi: 1, monete: 30, tormento: 0.5 }

  # ------------------------------------------------------------ passo 13 · la notte del battito
  - id: accademia-la-notte-del-battito
    presso: accademia-camera-della-condotta
    immagine: ambientazione/cristalli-conduttori
    titolo: La notte del battito
    sommario: "Stasera tutte le fontane della città si sono fermate insieme. Sotto l'Accademia la Vecchia batte la chiamata del Festival, senza pause."
    luogo: Accademia di Torvessa, la Camera della Condotta, di notte
    area: quartieri-alti
    requisiti: [fazione.accademia == 12, pista.capomozzo >= 7, accademia.notte == 0]
    testo: |
      La sera in cui succede sei alla fontana del pesce dei Quartieri Alti, e senti il getto fermarsi. Due volte poco e una lunga, e poi di nuovo,
      e poi di nuovo, senza ripartire. Dalle finestre intorno escono voci,
      perché anche nelle cucine i rubinetti tacciono. Un incantatore della
      Gilda, sul portone della Casa dei Nodi, si guarda le mani e dice ad
      alta voce che ha perso il filo, come nell'Eclisse.

      {magia Media} Anche il tuo Mana è fermo. Lo cerchi come si cerca uno
      scalino al buio, e il piede trova il vuoto.

      Scendi i gradini del seminterrato due alla volta. Nella Camera la
      Vecchia è accesa tutta, da cima a fondo, e batte la sequenza del
      Festival senza fermarsi, così forte che l'acqua dei canali salta. Il
      giunto di rame è rovente. Davanti al cristallo c'è Agnese, senza
      guanti, con le mani appoggiate sul lyssan e il naso che sanguina, e
      dice la riga di Severo a voce alta, una volta dopo l'altra.

      {medicina Media} Il sangue dal naso è della Dissonanza, e ce n'è troppo.
      Se continua così, all'alba avrà perso la voce, se le va bene.

      {origine allievo-di-torvessa} Agnese è stata la tua maestra di
      laboratorio per tre anni. Ti insegnava a staccare le mani dal banco
      quando il Mana tornava indietro, e adesso le sue mani non si staccano.
    opzioni:
      - testo: "Fermarla con le parole"
        descrizione: "Agnese ascolta il cristallo da otto anni. Forse, per una volta, ascolta una persona."
        quando: [accademia.agnese != 2]
        prova: { attributo: sociale, abilita: empatia, difficolta: Media }
        successo:
          titolo: Le mani
          testo: |
            Ti metti accanto a lei e le parli piano dei biscotti che gli allievi del terzo anno le lasciano sul banco, e a poco a poco la riga di Severo le si fa più bassa in bocca. Quando
            smette, le stacchi le mani dal lyssan una alla volta. Sono gelate e
            tremano. Lei si siede per terra con la schiena contro il tavolo e ti guarda come se ti vedesse per la prima volta stasera.
          pe: { empatia: 6 }
          imposta: { accademia.notte: 1 }
        fallimento:
          titolo: La riga
          testo: |
            Agnese non ti sente. Continua a dire la riga, e la Vecchia continua a
            battere, e il sangue le arriva al mento. Il battito ti respinge
            indietro verso la scala.
          effetti: { tormento: 1 }

      - testo: "Fermarla con le parole"
        descrizione: "Le hai tenuto la clessidra per mesi. Si fida di te più che di chiunque altro."
        quando: [accademia.agnese == 2]
        prova: { attributo: sociale, abilita: empatia, difficolta: Facile }
        successo:
          titolo: La clessidra
          testo: |
            Le metti in mano la clessidra, come fa lei con te ogni notte, e le
            dici che il giro adesso lo conti tu. Agnese abbassa gli occhi sulla
            sabbia, e la riga di Severo le si spegne in bocca a metà. Le stacchi
            le mani dal lyssan una alla volta. Lei si siede per terra, contro il
            tavolo, con la clessidra stretta al petto.
          pe: { empatia: 6 }
          imposta: { accademia.notte: 1 }
        fallimento:
          titolo: La sabbia ferma
          testo: |
            Le metti in mano la clessidra, e lei la lascia cadere. La sabbia si
            sparge sul pavimento bagnato. Il battito ti respinge indietro verso
            la scala.
          effetti: { tormento: 1 }

      - testo: "Toglierla dal cristallo a forza"
        descrizione: "Prenderla per le spalle e tirarla via, subito, prima che la Vecchia la svuoti del tutto."
        prova: { attributo: fisico, abilita: rissa, difficolta: Media }
        successo:
          titolo: Strappata via
          testo: |
            La prendi per le spalle e la strappi via dal lyssan. Le mani le
            restano attaccate un momento, poi cedono con un rumore di ghiaccio
            che si spezza. Cadete tutti e due sul pavimento bagnato. Agnese ti
            guarda con una rabbia che non le hai mai visto, e poi si gira verso
            il muro.
          pe: { rissa: 5 }
          imposta: { accademia.notte: 2 }
        fallimento:
          titolo: Il gomito
          testo: |
            Agnese si divincola con una forza che non le conoscevi, e il suo
            gomito ti prende sotto l'occhio. Ti ritrovi seduto sul gradino della
            scala, con la Vecchia che batte e lei che continua.
          effetti: { ferite: 1 }

      - testo: "Staccare il giunto dalla Vecchia"
        descrizione: "Il giunto di rame è rovente. Forse è lui che spinge la chiamata così forte, e senza giunto la Vecchia si calma."
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Media }
        successo:
          titolo: Il rame
          testo: |
            Afferri il braccio del giunto con il bastone del Regolatore e lo fai
            leva finché non si stacca dalla base. Il rame cade nel canale con un
            sibilo di vapore. La Vecchia rallenta a poco a poco, finché il battito non torna lungo e stanco. Agnese si stacca dal cristallo da sola
            e si siede per terra, contro il tavolo.
          pe: { tecnologia: 6 }
          imposta: { accademia.notte: 1 }
        fallimento:
          titolo: Il vapore
          testo: |
            Il braccio del giunto non si stacca, e il vapore del canale ti
            bruciacchia le mani. La Vecchia continua a battere.
          effetti: { ferite: 1 }

      - testo: "Stare accanto ad Agnese fino all'alba"
        descrizione: "Non sai come fermarla. Puoi restarle accanto a tenerle la testa finché la Vecchia non si stanca."
        costo: 2
        esito:
          titolo: Fino all'alba
          testo: |
            Le resti accanto tutta la notte, con una mano sulla sua spalla, e la
            senti dire la riga di Severo mille volte. Verso l'alba la Vecchia
            rallenta da sola, come una bestia che si è sfogata. Agnese smette a
            metà parola e cade all'indietro, e tu la prendi. Hai la testa piena
            del battito, e ce l'avrai per giorni.
          imposta: { accademia.notte: 1 }
          effetti: { tormento: 1.5 }

      - testo: "Chiamarla con la voce del laboratorio"
        descrizione: "Per tre anni ti ha detto di staccare le mani dal banco. Stasera puoi dirglielo tu, con la sua stessa voce."
        quando: [origine.allievo-di-torvessa >= 1]
        esito:
          titolo: Chi trema esce
          testo: |
            Le dici quello che c'era scritto sulla porta del laboratorio, *chi
            trema esce*, con la voce che usava lei per gli allievi del primo
            anno. Agnese si ferma a metà della riga di Severo. Poi stacca le mani
            dal lyssan da sola, come ti ha insegnato, e si siede per terra contro il tavolo. Ride e piange insieme, con le mani in grembo.
          pe: { empatia: 6 }
          imposta: { accademia.notte: 1 }

  - id: accademia-gli-echi-della-vecchia
    presso: accademia-camera-della-condotta
    immagine: ambientazione/cristalli-conduttori
    titolo: Gli echi della Vecchia
    sommario: "Agnese si è staccata dal cristallo. Dalla Vecchia, adesso, si staccano due figure d'acqua e di luce."
    luogo: Accademia di Torvessa, la Camera della Condotta, di notte
    area: quartieri-alti
    requisiti: [fazione.accademia == 12, accademia.notte >= 1]
    testo: |
      Quando le mani di Agnese lasciano il lyssan, la Vecchia butta fuori
      il battito tutto insieme, come un respiro trattenuto troppo a lungo.
      Dall'acqua dei canali si alzano due figure alte quanto un uomo, fatte della stessa acqua attraversata dalla luce, e hanno facce che cambiano a ogni passo.
      Una è quella di Agnese giovane, un'altra quella di Orvald. Per un
      momento una ha la tua.

      {resilienza Media} Hai già visto echi così, al Gradone. Questi sono
      più forti, e la Camera è piccola.

      {armi-da-mischia Media} Si muovono sull'acqua senza toccarla. Quando
      escono dal canale, per un attimo, hanno i piedi sulla pietra, e lì si
      possono colpire.

      Dalla scala arriva il rumore di passi in fretta. È Besk, con i
      quaderni in mano e i capelli spettinati dal sonno.
    opzioni:
      - testo: "Affrontare gli echi"
        descrizione: "Due echi della Vecchia in una cisterna stretta. Si colpiscono quando escono dall'acqua."
        combattimento: accademia-gli-echi-della-notte
        vittoria:
          titolo: Il canale tranquillo
          testo: |
            L'ultimo eco si scioglie nell'acqua del canale con un fruscio, e la
            Vecchia torna al suo battito lungo. Agnese, seduta contro il tavolo,
            ti racconta quello che sente da due anni. La Vecchia non sta morendo di fame. Ascolta qualcosa, e si consuma per rispondergli. Da quando la
            Magnistruttura ha tremato la chiamata è più forte, e i cristalli
            grandi della città battono insieme. La condotta va sistemata prima
            della prossima notte così.
          pe: { armi-da-mischia: 5 }
          effetti: { fazione.accademia: 1, rep.accademia: 1 }
        sconfitta:
          titolo: L'acqua alla gola
          testo: |
            Gli echi ti spingono nel canale e ti tengono sotto finché Besk non
            li disperde con un cristallo lanciato contro la Vecchia. Ti tira
            fuori per il colletto. Agnese, contro il tavolo, ti racconta quello
            che sente da due anni mentre sputi acqua. La Vecchia ascolta, e si
            consuma per rispondere. Da quando la Magnistruttura ha tremato la
            chiamata è più forte.
          effetti: { fazione.accademia: 1, ferite: 1.5, tormento: 0.5 }

      - testo: "Lasciare che Besk li congedi"
        descrizione: "In Arena Besk congedava gli echi dei cristalli a fine giornata. Conosce le parole, e le dice in fretta."
        quando: [pista.arena >= 2]
        esito:
          titolo: Il congedo dell'Arena
          testo: |
            Besk si mette fra te e gli echi con il quaderno aperto e dice le
            parole del congedo, quelle che diceva in Arena a fine giornata,
            con la voce rapida e un po' stonata. Gli echi si fermano e si inchinano, poi rientrano nell'acqua. Agnese, contro il tavolo, ti
            racconta quello che sente da due anni. La Vecchia ascolta, e si
            consuma per rispondere. Da quando la Magnistruttura ha tremato la
            chiamata è più forte, e la condotta va sistemata subito.
          pe: { magia: 4 }
          effetti: { fazione.accademia: 1, rep.accademia: 1 }

      - testo: "Rimandarli indietro con l'Esorcismo"
        descrizione: "La Liturgia dell'Albero rimanda gli echi dove devono stare. In una Camera così, serve una voce ferma."
        incantesimo: esorcismo
        prova: { attributo: mentale, abilita: magia, difficolta: Media }
        successo:
          titolo: Dove devono stare
          testo: |
            Dici le parole del Velo con il palmo aperto, e gli echi si
            sciolgono nell'acqua come zucchero. Agnese, contro il tavolo, ti
            racconta quello che sente da due anni. La Vecchia ascolta, e si
            consuma per rispondere. Da quando la Magnistruttura ha tremato la
            chiamata è più forte, e la condotta va sistemata prima della
            prossima notte così.
          pe: { magia: 6 }
          effetti: { fazione.accademia: 1, rep.accademia: 1 }
        fallimento:
          titolo: La voce che trema
          testo: |
            La voce ti trema sulla terza parola, e gli echi ti vengono addosso
            insieme. Besk ti tira indietro verso la scala.
          effetti: { ferite: 1, tormento: 0.5 }

      - testo: "Portare Agnese fuori dalla Camera"
        descrizione: "Gli echi vogliono il cristallo, forse. Se porti via Agnese su per la scala, la Camera resta a loro fino all'alba."
        prova: { attributo: fisico, abilita: atletica, difficolta: Media }
        successo:
          titolo: La scala a chiocciola
          testo: |
            Ti carichi Agnese su una spalla e sali la scala a chiocciola con
            Besk che vi tiene la lampada, mentre gli echi girano nella Camera
            senza seguirvi. All'alba sono spariti. Agnese, seduta sul primo
            gradino del seminterrato, ti racconta quello che sente da due anni.
            La Vecchia ascolta, e si consuma per rispondere. Da quando la
            Magnistruttura ha tremato la chiamata è più forte.
          pe: { atletica: 5 }
          effetti: { fazione.accademia: 1, rep.accademia: 1 }
        fallimento:
          titolo: Il gradino
          testo: |
            A metà scala il piede ti scivola sul gradino bagnato. Rotolate giù tutti e due fino al pavimento della Camera.
          effetti: { ferite: 1 }

  # ------------------------------------------------------------ passo 14 · la scelta della condotta
  - id: accademia-la-sera-prima-del-consiglio
    presso: accademia-camera-della-condotta
    immagine: fazioni/gilda-dei-mercanti
    titolo: La sera prima del consiglio
    sommario: "Domani il consiglio ristretto decide della condotta. Stasera Querci ti aspetta sulla scala con un foglio in mano."
    luogo: Accademia di Torvessa, la scala del seminterrato
    area: quartieri-alti
    requisiti: [fazione.accademia == 13, accademia.spia == 1]
    testo: |
      Querci ti aspetta seduto sulla scala del seminterrato, con un foglio
      piegato fra le dita e i manicotti neri tirati su fino ai gomiti. Il
      foglio è un biglietto della Casa dei Nodi, con un nodo disegnato in
      fondo al posto della firma, e dentro ci sono le misure della Lacrima.
      Le tue misure, quelle che hai raccontato all'uomo dai guanti grigi.

      «La Gilda le sapeva prima del Consiglio» dice Querci, senza alzarsi.
      «Le sapevano in quattro, contando anche la persona che le ha prese.» Si gratta il polso sotto il manicotto. «Domani si vota la
      condotta. Prima voglio sapere da che parte voti.»

      {ingannare Media} Querci il biglietto l'ha avuto da qualcuno della
      Gilda che ce l'ha con l'uomo dai guanti grigi. Una prova vera gli manca, e lo sa benissimo.

      {empatia Media} Spera che tu abbia una spiegazione. Gli dispiacerebbe
      avere ragione, almeno stavolta.
    opzioni:
      - testo: "Negare tutto"
        descrizione: "Un biglietto con un nodo disegnato non è una prova. Bisogna dirlo con la faccia giusta."
        prova: { attributo: sociale, abilita: ingannare, difficolta: Difficile }
        successo:
          titolo: Il biglietto nel braciere
          testo: |
            Gli dici che le misure le ha prese anche Tobol, e che Tobol parla
            con mezza città. Lo dici con calma e con un po' di offesa, e Querci
            ti guarda a lungo. Poi butta il biglietto nel braciere della Camera e
            lo guarda bruciare. «Allora domani voti con noi» dice, e se ne va.
          pe: { ingannare: 6 }
          imposta: { accademia.spia: 4 }
        fallimento:
          titolo: Il registro di Querci
          testo: |
            Querci ti lascia finire e poi apre il suo registro a una pagina con
            le date dei tuoi incontri sul davanzale del Mercato dei Nodi. Lo sa
            da settimane. Domani lo saprà il consiglio dei maestri, e dopodomani
            mezza città. Orvald ti fa restituire la borsa della Gilda e ti fa
            giurare di nuovo, davanti a tutti, su un registro nuovo.
          imposta: { accademia.spia: 3 }
          effetti: { scandalo: 1, rep.accademia: -2, monete: -25 }

      - testo: "Confessare a Querci e a Orvald"
        descrizione: "Dire com'è andata e restituire la borsa, accettando quello che viene dopo."
        esito:
          titolo: La borsa sul tavolo
          testo: |
            Glielo dici, e poi lo dici a Orvald, e metti la borsa della Gilda sul
            tavolo dei Regolatori. Orvald la guarda senza toccarla. Ti fa
            giurare di nuovo, sul registro di Querci, e la borsa la manda indietro
            alla Casa dei Nodi con un biglietto suo, molto breve. Per qualche
            settimana in Accademia ti salutano con un cenno in meno.
          imposta: { accademia.spia: 3 }
          effetti: { rep.accademia: -1, monete: -25, rep.gilda: -1 }

  - id: accademia-la-scelta-della-condotta
    presso: accademia-camera-della-condotta
    immagine: ambientazione/cristalli-conduttori
    titolo: La scelta della condotta
    sommario: "Il consiglio ristretto si riunisce nella Camera, con Julia Castaldi seduta sulla sedia di Querci. Ci sono tre strade, e ogni maestro ne difende una."
    luogo: Accademia di Torvessa, la Camera della Condotta
    area: quartieri-alti
    requisiti: [fazione.accademia == 13, accademia.spia != 1]
    testo: |
      Il consiglio ristretto si riunisce nella Camera, con la Vecchia che
      batte lenta alle spalle di tutti. Julia Castaldi è scesa dalla scala a
      chiocciola tenendosi la gonna, e adesso siede sulla sedia imbottita di
      Querci, che sta in piedi con il registro contro il petto. Orvald tiene
      la mappa delle fontane arrotolata sulle ginocchia. Agnese tiene in grembo le mani senza guanti, con le cicatrici del lyssan bene in vista.

      Le strade sono tre. Il giunto tiene viva la Vecchia con la colletta e con i turni dei Regolatori per qualche anno spendendo poco. Lo difende Querci. La Lacrima pietrificata, portata in città al posto
      della Vecchia, durerebbe una vita, ma ha un occhio che guarda. E poi
      c'è la formula di Severo, detta fino in fondo, che sveglierebbe la
      Vecchia del tutto e la legherebbe per sempre a chi la chiama. La
      difende Agnese, a voce bassa.

      {politica-ed-economia Media} Julia ascolta tutti, e intanto conta. Il
      giunto costa al Municipio una colletta all'anno, la Lacrima un carro e
      sei muli, la formula niente. Le cose che non costano niente la
      spaventano più delle altre.

      {magia Difficile} Stasera senti la chiamata anche tu, sotto il battito
      della Vecchia, lontanissima. Due brevi e una lunga, da un posto molto
      più in basso della Camera.

      Julia si volta verso di te. «Il Regolatore è lei» dice. «Mi dica che
      cosa farebbe, e perché.»
    opzioni:
      - testo: "Difendere il giunto"
        descrizione: "Qualche anno di tempo, pagato con la colletta e con i turni. Nessuno decide niente per sempre, e la città dovrà comunque scendere a Darn-Morakh."
        requisiti: [accademia.carica >= 3]
        prova: { attributo: sociale, abilita: persuasione, difficolta: Media }
        successo:
          titolo: Qualche anno
          testo: |
            Dici che la condotta ha bisogno di tempo più che di un miracolo, e
            che qualche anno basta per organizzare la spedizione a Darn-Morakh.
            Querci ti guarda come se l'avessi salvato da un incendio. Julia
            annuisce e firma la colletta per cinque anni. Agnese tace, poi dice
            che i turni li farà finché le mani reggono. Prima di montare il giunto nuovo, però, bisogna staccare la Vecchia dal supporto, dopo aver chiuso le chiuse e svuotato la Camera.
          pe: { persuasione: 6 }
          imposta: { accademia.esito: 1 }
          effetti: { fazione.accademia: 1, rep.castaldi: 0.5 }
        fallimento:
          titolo: La colletta per cinque anni
          testo: |
            Il discorso ti esce confuso, e Julia ti fa ripetere i numeri due
            volte. Alla fine il giunto passa lo stesso, perché costa meno di
            tutto il resto, e Querci lo dice ad alta voce. Prima di montare il
            giunto nuovo bisogna chiudere le chiuse e svuotare la Camera.
          imposta: { accademia.esito: 1 }
          effetti: { fazione.accademia: 1, scandalo: 0.5 }

      - testo: "Lasciare che decida Querci"
        descrizione: "Il tesoriere vuole il giunto, che costa poco. Puoi dargli ragione senza aggiungere niente."
        requisiti: [accademia.carica >= 3]
        esito:
          titolo: Il conto di Querci
          testo: |
            Dici che Querci ha fatto i conti meglio di tutti, e Querci legge i
            suoi conti ad alta voce, fino all'ultima moneta. Julia firma la
            colletta per cinque anni. Prima di montare il giunto nuovo bisogna
            chiudere le chiuse e svuotare la Camera.
          pe: { politica-ed-economia: 3 }
          imposta: { accademia.esito: 1 }
          effetti: { fazione.accademia: 1 }

      - testo: "Difendere la Lacrima"
        descrizione: "Un cristallo che regge la condotta per una vita. Ha un occhio, e il Velo non lo vuole in città."
        quando: [accademia.lacrima == 1]
        prova: { attributo: mentale, abilita: politica-ed-economia, difficolta: Media }
        successo:
          titolo: Una vita
          testo: |
            Metti sul tavolo le misure della Lacrima e i conti di un carro con
            sei muli, e dici che una vita d'acqua vale un occhio che guarda.
            Julia ci pensa a lungo e poi firma. Ottilia Sanvel, quando lo saprà,
            manderà una lettera molto cortese e molto fredda. Per mettere la Lacrima al posto della Vecchia, però, bisogna prima chiudere le chiuse e svuotare la Camera.
          pe: { politica-ed-economia: 6 }
          imposta: { accademia.esito: 2 }
          effetti: { fazione.accademia: 1, rep.velo: -1, rep.castaldi: 0.5 }
        fallimento:
          titolo: L'occhio
          testo: |
            Julia ti chiede dell'occhio, e tu non hai una risposta che la
            tranquillizzi. Firma lo stesso, perché la Lacrima è l'unica cosa che
            dura, ma lo fa con la bocca stretta. Il Velo lo sa prima di sera.
          imposta: { accademia.esito: 2 }
          effetti: { fazione.accademia: 1, rep.velo: -1, scandalo: 0.5 }

      - testo: "Difendere la Lacrima, anche se è della Gilda"
        descrizione: "La Gilda l'ha segnata e la porterà in città. Ma l'acqua passerà sotto la sua gabella."
        quando: [accademia.lacrima == 2]
        esito:
          titolo: La gabella
          testo: |
            Dici che la Lacrima regge la condotta per una vita, e che la Gilda
            ha già i paranchi. Julia firma con le labbra strette. Da domani
            l'acqua di Qir-Azel passa sotto la gabella della Casa dei Nodi, e in
            Via del Salmone qualcuno scrive il tuo nome sul muro della fontana.
            Prima di staccare la Vecchia bisogna chiudere le chiuse e svuotare
            la Camera.
          pe: { politica-ed-economia: 4 }
          imposta: { accademia.esito: 2 }
          effetti: { fazione.accademia: 1, rep.gilda: 1, rep.castaldi: -1, rep.velo: -1, nomea.citta-bassa: -1 }

      - testo: "Dire tu la formula fino in fondo"
        descrizione: "La riga di Severo detta tutta d'un fiato sveglia la Vecchia del tutto. Funziona subito senza spendere niente. In cambio ti legherà a chi chiama."
        requisiti: [accademia.formula >= 1, magia >= 3]
        prova: { attributo: mentale, abilita: magia, difficolta: Difficile }
        successo:
          titolo: Fino in fondo
          testo: |
            Dici che la formula è l'unica strada che non chiede soldi a nessuno,
            e che il prezzo lo paghi tu. Julia ti guarda come si guarda un
            medico che propone di tagliare. Poi firma. Agnese ti prende la mano
            sotto il tavolo e la stringe forte. Prima di dire la riga davanti
            alla Vecchia, però, bisogna chiudere le chiuse e svuotare la Camera.
          pe: { magia: 6 }
          imposta: { accademia.esito: 3 }
          effetti: { fazione.accademia: 1, rep.velo: -1, tormento: 1 }
        fallimento:
          titolo: Il prezzo
          testo: |
            Provi la riga per mostrare che la sai, e la Vecchia risponde così
            forte che Julia si alza in piedi. La formula passa lo stesso, perché
            nessuno ha il coraggio di dire di no dopo averla sentita. Il prezzo
            lo senti subito, dietro gli occhi.
          imposta: { accademia.esito: 3 }
          effetti: { fazione.accademia: 1, rep.velo: -1, tormento: 2 }

      - testo: "Lasciare che la formula la dica Agnese"
        descrizione: "Agnese la sa da due anni e si fida di te. Se il consiglio è d'accordo, la dice lei, fino in fondo."
        quando: [accademia.agnese == 2, accademia.notte == 1]
        esito:
          titolo: La voce di Agnese
          testo: |
            Dici che Agnese la formula la sa meglio di chiunque, e lei alza gli
            occhi dal grembo per la prima volta. Julia la guarda a lungo e poi
            firma. Orvald non dice niente, e srotola la mappa delle fontane come
            per ricordarsi a che cosa serve tutto questo. Prima che Agnese dica la
            riga davanti alla Vecchia bisogna chiudere le chiuse e svuotare la
            Camera.
          pe: { empatia: 4 }
          imposta: { accademia.esito: 3 }
          effetti: { fazione.accademia: 1, rep.velo: -1, tormento: 0.5 }

  # ------------------------------------------------------------ passo 15 · il finale (grado 5), dopo le gallerie
  - id: accademia-il-cerchio-aperto-giunto
    presso: accademia-camera-della-condotta
    immagine: personaggi/orvald-temmerin
    titolo: Il cerchio aperto
    sommario: "L'acqua è tornata nelle fontane. La Vecchia batte di nuovo, con il giunto nuovo, e il consiglio dei maestri ti aspetta nella Camera."
    luogo: Accademia di Torvessa, la Camera della Condotta
    area: quartieri-alti
    requisiti: [fazione.accademia == 14, accademia.eco >= 1, accademia.esito == 1]
    testo: |
      La mattina dopo le gallerie l'acqua torna in tutte le fontane della
      città nello stesso momento, e in Via del Salmone la gente esce in
      strada con i secchi a vederla. La Vecchia batte piano con il giunto nuovo, e il registro dei Regolatori ha già tre firme di stamattina.
      Agnese non è fra quelle. L'ha affidata Orvald a Ottilia Sanvel, che in Cattedrale la cura con le mani nell'acqua tiepida e molto silenzio.

      {empatia Media} Orvald ha la barba lunga di tre giorni e gli occhi
      rossi, e ride per niente. È la stanchezza di chi ha finito una cosa
      cominciata trent'anni fa.

      Il consiglio dei maestri è sceso al completo nella Camera, sette sedie
      intorno al tavolo dei Regolatori. Querci ha portato una borsa e un
      fagotto di lana grigia. Julia Castaldi è in piedi in fondo, con un
      foglio del Municipio in mano.

      «La Vecchia regge qualche anno. Poi tocca a Darn-Morakh, e a chi ci
      vorrà scendere» dice Orvald. Sul tavolo ci sono gli ultimi gessi di
      Severo, ricopiati in fondo alle gallerie, e indicano tutti la Cicatrice.
      «Quando scenderai, le mappe le voglio io.»

      {origine allievo-di-torvessa} Sette sedie, e una è per te. L'ultima
      volta che sei stato davanti a tutto il consiglio era per l'esame del
      secondo anno, e avevi le mani che sudavano come adesso.
    opzioni:
      - testo: "Accettare il cerchio e il Coro dei cristalli"
        descrizione: "Il mantello dei maestri, la borsa del consiglio e la formula che fa cantare insieme tutti i cristalli a portata. Serve Magia 4."
        requisiti: [magia >= 4]
        esito:
          titolo: Il coro
          testo: |
            Querci ti mette sulle spalle il mantello del cerchio aperto, lana
            grigia con il cerchio incompleto ricamato in lyssan, e conta la borsa
            sospirando a ogni moneta. Poi Orvald ti fa appoggiare le mani sul
            tavolo dei Regolatori e ti insegna la formula del coro, e tutti i
            cristalli della Camera cantano la stessa nota per un momento. Julia
            legge il foglio del Municipio. Da oggi l'Accademia ha una voce in
            Consiglio quando si parla di acqua e di cristalli, una voce che parla senza votare, e quella voce sei tu. Ottilia manda un biglietto per dire che Agnese
            ha chiesto di te.
          pe: { magia: 10 }
          almeno: { rep.accademia: 10 }
          imposta: { accademia.voce: 1 }
          effetti: { fazione.accademia: 1, oggetto.accademia-mantello-del-cerchio-aperto: 1, incantesimo.accademia-coro-dei-cristalli: 1, monete: 350, rep.velo: 0.5 }

      - testo: "Accettare il cerchio e il sigillo"
        descrizione: "Il mantello dei maestri, la borsa del consiglio e uno dei sette anelli con il cerchio aperto, quello che i maestri girano sul dito quando una cosa va rifatta."
        esito:
          titolo: Il settimo anello
          testo: |
            Querci ti mette sulle spalle il mantello del cerchio aperto, lana
            grigia con il cerchio incompleto ricamato in lyssan, e conta la borsa
            sospirando a ogni moneta. Orvald si sfila dal dito uno dei sette
            anelli dei maestri e te lo infila al tuo. «Era di Severo» dice. «Lo
            ha lasciato sul mio tavolo, quando è partito.» Julia legge il foglio
            del Municipio. Da oggi l'Accademia ha una voce in Consiglio quando si
            parla di acqua e di cristalli, una voce che parla senza votare, e quella voce sei tu.
            Ottilia manda un biglietto per dire che Agnese ha chiesto di te.
          pe: { accademiche: 10 }
          almeno: { rep.accademia: 10 }
          imposta: { accademia.voce: 1 }
          effetti: { fazione.accademia: 1, oggetto.accademia-mantello-del-cerchio-aperto: 1, oggetto.accademia-sigillo-del-cerchio-aperto: 1, monete: 350, rep.velo: 0.5 }

  - id: accademia-il-cerchio-aperto-lacrima
    presso: accademia-camera-della-condotta
    immagine: ambientazione/mito-occhio-nel-cristallo
    titolo: Il cerchio aperto
    sommario: "La Lacrima pietrificata è al posto della Vecchia, e l'acqua scorre forte in tutte le fontane. Al centro del cristallo l'occhio guarda chi scende."
    luogo: Accademia di Torvessa, la Camera della Condotta
    area: quartieri-alti
    requisiti: [fazione.accademia == 14, accademia.eco >= 1, accademia.esito == 2]
    testo: |
      La Lacrima è arrivata in città su un carro con sei muli, coperta da un
      telo cerato, e ci sono voluti tre giorni per calarla nella Camera con
      i paranchi. Adesso sta sul supporto di lyssan al posto della Vecchia,
      di traverso come stava nella torba, e l'acqua dei canali corre forte
      come non correva da anni. In Via del Salmone la fontana getta anche il
      pomeriggio. La Vecchia, spenta, è partita per le vetrine della
      Biblioteca, dove Mattias Crenn le ha preparato un posto accanto ai
      cristalli dell'Eclisse.

      {magia Media} La Lacrima non batte. Il suo Mana gira piano intorno all'occhio, e l'occhio ti segue da una parete all'altra della Camera.

      Il consiglio dei maestri è sceso al completo, sette sedie intorno al
      tavolo dei Regolatori. Querci ha portato una borsa e un fagotto di lana
      grigia. Julia Castaldi è in piedi in fondo, con un foglio del Municipio
      in mano, e non guarda il cristallo.

      «La Lacrima dura una vita, e la città lo sa» dice Orvald. Sul tavolo ci
      sono gli ultimi gessi di Severo, ricopiati in fondo alle gallerie, e
      indicano tutti la Cicatrice. «Quello che guarda, però, guarda da
      laggiù. Quando scenderai, le mappe le voglio io.»

      {resilienza Media fallita} Ti accorgi di esserti spostato tre volte per
      uscire dallo sguardo dell'occhio, e che l'occhio si è spostato tre
      volte con te.
