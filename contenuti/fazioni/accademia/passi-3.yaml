      ancora sigillata, scritta con una calligrafia molto cortese.

      «L'acqua di Qir-Azel adesso batte con quello che chiama» dice Orvald, accanto agli ultimi gessi di Severo ricopiati in fondo alle gallerie,
      che indicano tutti la Cicatrice. «Quando scenderai, la Vecchia lo saprà prima di noi. E le mappe, comunque, le voglio io.»

      {resilienza Media} Agnese, seduta in fondo, sorride per la prima volta da quando la conosci, e la cosa non ti tranquillizza affatto.
