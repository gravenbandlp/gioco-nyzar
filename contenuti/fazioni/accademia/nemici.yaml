# I nemici nuovi della quest dell'Accademia, tarati su quelli della stessa fase della storia.
# - L'eco dello scavo (passo 6, Gradone Rosso): due figure di luce, come i vermi carogna e il camminatore, Media.
# - Gli echi minori (passi 13 e 15): come i gladiatori dell'Arena, che si apre nello stesso punto della trama.
# - Lo sciame di falene (passo 12, Lacrima): debole e numeroso, tre alla volta.
# - L'Eco della Condotta (passo 15, boss): sopra l'eco del cinghiale dell'Arena, con il danno del Costruttore.
# Gli scontri riusano anche nemici che c'erano già: verme-carogna, camminatore, scagnozzo-degli-scuri,
# balestriere-della-gilda.
nemici:
  - id: accademia-eco-del-giovane-orvald
    immagine: personaggi/orvald-temmerin
    nome: Eco del giovane Orvald
    descrizione: "Un Orvald Temmerin di trent'anni fa, fatto di luce azzurra, con la barba ancora scura e la piccozza in mano. Ripete i gesti dello scavo, e chi gli si mette davanti è un intruso."
    attacco: 3
    difesa: 3
    difesaMentale: 3
    pf: 6
    danno: 1
    iniziativa: 2
    tratti: [eco]

  - id: accademia-eco-dell-uomo-dalle-mani-nere
    immagine: ambientazione/cristalli-conduttori
    nome: Eco dell'uomo dalle mani nere
    descrizione: "Un uomo magro con le dita nere d'inchiostro, fatto della stessa luce. Disegna segni di gesso nell'aria, e dove li finisce l'aria scotta."
    attacco: 3
    difesa: 2
    difesaMentale: 4
    pf: 5
    danno: 1
    iniziativa: 3
    tratti: [eco]

  - id: accademia-eco-minore
    immagine: ambientazione/cristalli-conduttori
    nome: Eco minore della Vecchia
    descrizione: "Una figura d'acqua e di luce alta quanto un uomo, che ha di volta in volta la faccia di uno dei Regolatori degli ultimi dieci anni. Cambia faccia a ogni passo."
    attacco: 3
    difesa: 3
    difesaMentale: 3
    pf: 6
    danno: 1
    iniziativa: 2
    tratti: [eco]

  - id: accademia-sciame-di-falene
    immagine: icone/butterfly
    nome: Sciame di falene
    descrizione: "Un nugolo di falene grigie con le ali polverose, che va dritto contro ogni luce e contro ogni faccia. Una per una non pesano niente."
    attacco: 2
    difesa: 3
    difesaMentale: 1
    pf: 3
    danno: 0
    iniziativa: 3
    puoFuggire: true
    tratti: [animale]

  - id: accademia-eco-della-condotta
    immagine: ambientazione/cristalli-conduttori
    nome: L'Eco della Condotta
    descrizione: "Un'eco grande come la cisterna, fatta dell'acqua dei canali e della luce della Vecchia. Ripete i gesti di tutti quelli che hanno toccato il cristallo in dieci anni, e fra quelli ci sono anche i tuoi."
    attacco: 5
    difesa: 4
    difesaMentale: 4
    pf: 16
    danno: 2
    riduzione: 1
    iniziativa: 2
    tratti: [eco]

scontri:
  - { id: accademia-l-eco-dello-scavo, nome: "L'eco dello scavo", nemici: [accademia-eco-del-giovane-orvald, accademia-eco-dell-uomo-dalle-mani-nere], feriteSconfitta: 3 }
  - { id: accademia-la-sentinella-spenta, nome: "La sentinella spenta", nemici: [camminatore], feriteSconfitta: 2 }
  - { id: accademia-il-nido-dei-vermi, nome: "Il nido dei vermi", nemici: [verme-carogna, verme-carogna], feriteSconfitta: 2 }
  - { id: accademia-i-ladri-degli-scuri, nome: "I ladri dei cristalli", nemici: [scagnozzo-degli-scuri, scagnozzo-degli-scuri], feriteSconfitta: 2 }
  - { id: accademia-i-balestrieri-della-gilda, nome: "I balestrieri della Gilda", nemici: [balestriere-della-gilda, balestriere-della-gilda], feriteSconfitta: 2 }
  - { id: accademia-le-falene, nome: "Lo sciame di falene", nemici: [accademia-sciame-di-falene, accademia-sciame-di-falene, accademia-sciame-di-falene], feriteSconfitta: 2 }
  - { id: accademia-gli-echi-della-notte, nome: "Gli echi della Vecchia", nemici: [accademia-eco-minore, accademia-eco-minore], feriteSconfitta: 3 }
  - { id: accademia-l-eco-della-condotta, nome: "L'Eco della Condotta", nemici: [accademia-eco-della-condotta], feriteSconfitta: 4 }
