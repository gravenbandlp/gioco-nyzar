# Le gallerie della condotta, spedizione del passo 15 della quest dell'Accademia (fazione.accademia == 14).
# Ci si entra dalla Camera della Condotta con «Scendere nelle gallerie». Bisogna chiudere le chiuse, svuotare la
# Camera e staccare la Vecchia dal suo supporto, qualunque sia la strada scelta al passo 14 (accademia.esito).
# Le stanze vanno in fasce di profondità, e una stanza superata non ricompare nella stessa visita:
# 0 l'ingresso (la saracinesca sotto la Casa dei Nodi; la cisterna vuota; il canale stretto, che vale anche a 1),
# 1 le chiuse (le chiuse; gli echi della notte; le incisioni della condotta, che valgono anche a 2),
# 2 sotto la Camera (la camera delle valvole; Agnese, che aspetta se è stata sospesa o guida se l'hai aiutata).
# Il cuore a 3 è il distacco della Vecchia e l'Eco della Condotta, boss Difficile. Le vie per batterla sono Difficili;
# chi fallisce una prova esce con Ferite, Tormento e Scandalo (la città resta senz'acqua) e ritenta. Chi perde lo
# scontro chiude il passo lo stesso, a caro prezzo (accademia.eco 2): Orvald stacca la Vecchia mentre l'Eco ti tiene
# a terra. Chi vince ha accademia.eco 1. Il finale è in passi-3.yaml.
aree:
  - id: accademia-gallerie-della-condotta
    immagine: ambientazione/regno-profondo
    nome: Le gallerie della condotta
    sommario: "I canali dei Precursori sotto i Quartieri Alti, dove l'acqua del Torvessa sale da sola fino alla Camera della Condotta."
    spedizione: { ritorno: quartieri-alti, soglia: 3, stanze: 3 }
    testo: |
      Sotto i Quartieri Alti corre una rete di canali dei Precursori in pietra nera, che porta l'acqua del
      Torvessa su per la roccia fino alla Camera della Condotta e da lì alle fontane della città. L'acqua sale
      da sola contro la pendenza, e lungo i canali non c'è una pompa né una ruota. Lungo il canale corre un
      camminamento stretto, e ogni tanto le gallerie si aprono in cisterne rotonde con le chiuse di bronzo.
      Sul camminamento non passa un topo. L'unico suono è il battito della Vecchia che arriva da sopra.

storylet:
  # ------------------------------------------------------------ l'ingresso, dalla Camera
  - id: accademia-scendere-nelle-gallerie
    presso: accademia-camera-della-condotta
    immagine: ambientazione/regno-profondo
    titolo: Scendere nelle gallerie
    sommario: "Per staccare la Vecchia bisogna chiudere le chiuse e svuotare la Camera. Orvald ha tirato giù dal muro una lama del seminterrato."
    luogo: Accademia di Torvessa, la Camera della Condotta
    area: quartieri-alti
    requisiti: [fazione.accademia == 14, accademia.eco == 0]
    testo: |
      Orvald è sceso nella Camera con una spada corta che ha ancora il cartellino legato all'elsa, e la
      stringe come un attrezzo dimenticato. Dietro il tavolo dei Regolatori, nel pavimento della cisterna, c'è
      una grata di bronzo, e sotto l'acqua del canale scorre nera verso il basso. Il bronzo è verde negli
      angoli e le sbarre sono grosse quanto un polso. Dalla grata sale un'aria fredda che sa di pietra
      bagnata.

      «Le chiuse stanno sotto, fino alla Casa dei Nodi» dice. «Le chiudiamo, la Camera si svuota e la Vecchia
      si stacca, ma quando perde il contatto la chiamata che si è tenuta dentro le uscirà tutta insieme.»

      {magia Media} Sotto la grata il battito della Vecchia scende con l'acqua e torna indietro dal fondo
      delle gallerie. L'eco ci mette molto a tornare, e quando torna è più bassa del battito che è sceso.

      {origine apprendista-raschiatore} Davanti a una grata sul buio le mani vanno da sole a controllare le
      corde, come prima di ogni turno sulle piattaforme.
    opzioni:
      - testo: "Scendere con Orvald"
        descrizione: "Sotto la grata, lungo il canale, fino alle chiuse."
        costo: 1
        esito:
          titolo: La grata
          testo: |
            Sollevate la grata in due, con un lamento di bronzo che rimbomba in tutta la cisterna, e scendete
            la scaletta di ferro fino al camminamento. I pioli sono mangiati dalla ruggine, e la pietra in cui
            sono murati non ha un graffio. L'acqua vi passa accanto nera e veloce, e la luce della lampada ci
            si specchia dentro senza fermarsi.
          vai: accademia-gallerie-della-condotta
      - testo: "Rimandare a domani"
        descrizione: "La Vecchia regge ancora una notte. Le gallerie aspettano."
        costo: 0
        esito:
          titolo: Ancora una notte
          testo: |
            Dici a Orvald che si scende domani, con la luce del giorno sopra la città, anche se quaggiù non
            cambia niente. Lui annuisce e appende la spada corta al chiodo del tavolo dei Regolatori. Il
            cartellino dondola ancora un poco dall'elsa, e poi si ferma.

  # ------------------------------------------------------------ 0 · l'ingresso
  - id: accademia-gallerie-la-saracinesca
    immagine: ambientazione/regno-profondo
    titolo: La saracinesca
    sommario: "Una saracinesca di bronzo sbarra il canale sotto la Casa dei Nodi. Dall'altra parte ci sono le chiuse."
    luogo: Le gallerie della condotta, sotto la Casa dei Nodi
    area: accademia-gallerie-della-condotta
    ripetibile: true
    requisiti: [fazione.accademia == 14, accademia.eco == 0, profondita.accademia-gallerie-della-condotta == 0]
    testo: |
      Il camminamento finisce contro una saracinesca di bronzo che sbarra il canale, e l'acqua ci passa sotto
      ribollendo. Il bronzo è verde di patina fino al ginocchio e lucido più in alto, dove le mani lo hanno
      toccato per anni. Sopra c'è il sigillo della Gilda e accanto una serratura con due buchi per le chiavi
      della Casa dei Nodi e del Municipio.

      {tecnologia Media} La serratura è dei Precursori e i due buchi li ha aggiunti qualcuno dopo, perché il
      bronzo intorno ha ancora i segni del trapano. Il meccanismo vero sta dietro la piastra.

      Orvald batte sul bronzo con il pomo della spada, e la nota lunga si perde nelle gallerie. La saracinesca
      continua a vibrare sotto la tua mano anche quando la nota non si sente più.
    opzioni:
      - testo: "Aprire il meccanismo dietro la piastra"
        descrizione: "Togliere la piastra della serratura e muovere a mano quello che c'è dietro."
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Media }
        successo:
          titolo: Il meccanismo
          testo: |
            Sviti la piastra con la punta della piccozza e dietro trovi una ruota di lyssan con sette tacche.
            Le tacche sono pulite e senza un filo di verde, anche se il bronzo intorno ne è coperto. La giri
            una tacca alla volta ascoltando il bronzo, finché al settimo la saracinesca si alza di un braccio
            con un gemito. Passate sotto bagnati fino alla vita.
          pe: { tecnologia: 5 }
          effetti: { profondita.accademia-gallerie-della-condotta: 1 }
        fallimento:
          titolo: La ruota bloccata
          testo: |
            La ruota si blocca al quarto dente, e la saracinesca resta giù.
            L'acqua ti schizza in faccia per tutto il tempo che ci provi.
          effetti: { ferite: 0.5 }

      - testo: "Farsi aprire dalla Gilda"
        descrizione: "Alla Casa dei Nodi il tuo nome conta. Basta mandare a chiamare il custode della chiave."
        requisiti: [rep.gilda >= 3]
        esito:
          titolo: La chiave della Casa dei Nodi
          testo: |
            Mandi un biglietto su per la scaletta di servizio, e mezz'ora dopo scende un custode della Gilda
            con la chiave al collo e una lanterna. La chiave è di ottone e gira in uno dei buchi aggiunti con
            uno scatto pulito. Apre senza fare domande, perché il tuo nome gli basta, e risale.
          effetti: { profondita.accademia-gallerie-della-condotta: 1 }

      - testo: "Aspettare le chiavi del Municipio"
        descrizione: "Julia Castaldi ha promesso la chiave del Municipio. Ci vorrà un po' prima che arrivi, e quella della Gilda la porta Querci."
        costo: 2
        esito:
          titolo: Due chiavi
          testo: |
            Aspettate seduti sul camminamento, con l'acqua che vi bagna le caviglie ed è fredda come quella di
            un pozzo. Dopo un'ora arriva Querci con la chiave del Municipio e una della Gilda che non dice
            dove ha preso. Apre la saracinesca e torna su a contare con un'aria molto offesa, e le scarpe
            bagnate fanno un rumore di spugna su ogni piolo della scaletta.
          pe: { resistenza: 2 }
          effetti: { profondita.accademia-gallerie-della-condotta: 1 }

  - id: accademia-gallerie-la-cisterna-vuota
    immagine: ambientazione/regno-profondo
    titolo: La cisterna vuota
    sommario: "Una cisterna rotonda senz'acqua, con il fondo coperto di fango secco. In mezzo, qualcosa di luminoso si muove."
    luogo: Le gallerie della condotta, una cisterna laterale
    area: accademia-gallerie-della-condotta
    ripetibile: true
    requisiti: [fazione.accademia == 14, accademia.eco == 0, profondita.accademia-gallerie-della-condotta == 0]
    testo: |
      Una galleria laterale finisce in una cisterna rotonda e vuota, con il fondo coperto di fango secco che
      si è crepato in piastre sollevate agli angoli. Sulla pietra nera delle pareti corre una riga più chiara
      all'altezza della testa, dove l'acqua è rimasta ferma per anni prima di andarsene. In mezzo alla
      cisterna una figura di luce azzurra cammina in tondo, piano, con le braccia lungo i fianchi, e lascia
      impronte nel fango. Il fango è secco e duro, eppure le impronte si riempiono d'acqua appena lei alza il
      piede.

      {percezione Media} Le impronte sono di scarpe piccole da donna, e il tacco affonda più della punta. La
      figura ha il passo di Agnese quando conta, e i passi cadono insieme al battito che arriva da sopra.
    opzioni:
      - testo: "Attraversare la cisterna senza farsi vedere"
        descrizione: "L'eco gira in tondo. Basta passare quando è dall'altra parte."
        prova: { attributo: fisico, abilita: furtivita, difficolta: Media }
        successo:
          titolo: Dall'altra parte
          testo: |
            Aspetti che l'eco sia sul lato lontano e attraversi il fango secco in punta di piedi, con Orvald
            dietro che ti imita passo per passo. Le vostre impronte restano asciutte accanto alle sue, che
            luccicano d'acqua alla lampada. Dall'altra parte la galleria riprende verso le chiuse.
          pe: { furtivita: 4 }
          effetti: { profondita.accademia-gallerie-della-condotta: 1 }
        fallimento:
          titolo: Il fango
          testo: |
            Il fango secco si spacca sotto il piede con un rumore di vetro, e l'eco si gira. Ti viene addosso
            con il passo di Agnese, e la sua mano fredda ti prende il polso prima che tu riesca a tornare
            indietro. Quando ti lascia andare hai la manica fradicia fino al gomito.
          effetti: { tormento: 1, ferite: 0.5 }

      - testo: "Fermarla con il nome"
        descrizione: "Ha il passo di Agnese. Forse risponde al suo nome."
        prova: { attributo: sociale, abilita: empatia, difficolta: Media }
        successo:
          titolo: Agnese
          testo: |
            La chiami per nome, piano, come la chiami nella Camera quando il turno finisce. L'eco si ferma e
            si volta verso di te, poi si scioglie nel fango come acqua in un'aiuola. Il fango beve tutto e
            torna grigio e crepato. Orvald guarda il punto dove era sparita e non dice niente.
          pe: { empatia: 5 }
          effetti: { profondita.accademia-gallerie-della-condotta: 1 }
        fallimento:
          titolo: Un'altra
          testo: |
            La chiami per nome, e l'eco si gira con una faccia che non è quella di Agnese, e nemmeno di
            nessuno che conosci. Ti guarda e muove le labbra senza che ne esca un suono, e tu torni indietro
            di corsa.
          effetti: { tormento: 1 }

  - id: accademia-gallerie-il-canale-stretto
    immagine: ambientazione/regno-profondo
    titolo: Il canale stretto
    sommario: "Il camminamento si interrompe, e per un tratto c'è soltanto il bordo del canale, largo un piede."
    luogo: Le gallerie della condotta, il canale stretto
    area: accademia-gallerie-della-condotta
    ripetibile: true
    requisiti: [fazione.accademia == 14, accademia.eco == 0, profondita.accademia-gallerie-della-condotta <= 1]
    testo: |
      Per trenta passi il camminamento è crollato e resta soltanto un bordo di pietra bagnata largo un piede.
      Le lastre crollate sono finite nel canale, e l'acqua che corre a fianco scura ci passa sopra senza fare
      un'onda, perché il fondo è molto più giù. Dove il canale fa una curva si sente il risucchio di un gorgo.
      Sulla parete opposta corre una fila di anelli di bronzo grossi come un polso, piantati nella pietra nera
      a un braccio teso l'uno dall'altro.

      {acrobazia Media} Con una mano sugli anelli e i piedi di traverso si passa, ma il secondo anello è più
      lontano degli altri.

      Orvald guarda il bordo, poi le sue ginocchia, e sospira.
    opzioni:
      - testo: "Passare sul bordo, di anello in anello"
        descrizione: "Trenta passi con l'acqua a fianco. Gli anelli aiutano, se li prendi tutti."
        prova: { attributo: fisico, abilita: acrobazia, difficolta: Media }
        successo:
          titolo: Gli anelli
          testo: |
            Passi di traverso sul bordo, un anello alla volta, e al secondo ti allunghi fino a sentirti tirare
            la spalla. Il bronzo è freddo e viscido d'acqua, e lo stringi finché ti fanno male le dita. Di là
            tendi la mano a Orvald, che passa brontolando sulle sue ginocchia.
          pe: { acrobazia: 5 }
          effetti: { profondita.accademia-gallerie-della-condotta: 1 }
        fallimento:
          titolo: Il gorgo
          testo: |
            Il secondo anello ti sfugge, e finisci nel canale. L'acqua ti porta fino al gorgo prima che Orvald
            riesca ad afferrarti per la giubba con il manico della spada. Sotto il pelo dell'acqua il gorgo
            tira dritto verso il basso, e i piedi non trovano il fondo.
          effetti: { ferite: 1 }

      - testo: "Tendere una corda fra gli anelli"
        descrizione: "Una corda tesa da un anello all'altro, e si passa tenendosi. Ci vuole tempo, ma è sicuro."
        costo: 2
        esito:
          titolo: La corda tesa
          testo: |
            Leghi la corda anello per anello, con i nodi dei Raschiatori, e poi passate tenendovi alla corda
            con l'acqua che vi tira le gambe. La corda bagnata si irrigidisce, e i nodi stringono sul bronzo
            con un cigolio. Orvald, di là, ti stringe la spalla e si siede un momento sul camminamento.
          pe: { atletica: 2 }
          effetti: { profondita.accademia-gallerie-della-condotta: 1 }

  # ------------------------------------------------------------ 1 · le chiuse
  - id: accademia-gallerie-le-chiuse
    immagine: ambientazione/regno-profondo
    titolo: Le chiuse
    sommario: "Tre chiuse di bronzo, una dopo l'altra, con le ruote arrugginite. Vanno chiuse in ordine, o l'acqua torna indietro tutta insieme."
    luogo: Le gallerie della condotta, le chiuse
    area: accademia-gallerie-della-condotta
    ripetibile: true
    requisiti: [fazione.accademia == 14, accademia.eco == 0, profondita.accademia-gallerie-della-condotta == 1]
    testo: |
      In una cisterna sotto la Casa dei Nodi ci sono le chiuse, tre paratie di bronzo con una ruota di ferro
      grande come un carro. Il bronzo delle paratie è liscio e senza un graffio, e ogni volta che la Vecchia
      batte un velo d'acqua trema lungo i loro bordi. Le ruote invece sono arrugginite fino ai raggi e
      lasciano sulle dita una polvere rossa. Su una c'è un cartellino con la grafia di Agnese, *prima la
      terza*.

      {tecnologia Media} Se cominci dalla prima, l'acqua delle altre due torna indietro e vi travolge, e il
      cartellino ha ragione.

      {atletica Media} La ruota della terza è la più arrugginita, e serve tutta la schiena con un piede
      puntato bene.
    opzioni:
      - testo: "Chiuderle in ordine, dalla terza"
        descrizione: "Il cartellino dice di cominciare dalla terza e di chiudere le altre a ritroso, contando il tempo dell'acqua."
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Media }
        successo:
          titolo: Prima la terza
          testo: |
            Chiudi la terza e aspetti che l'acqua si calmi contando fino a cento. Dopo chiudi le altre due, a
            ritroso. Il canale si svuota lentamente verso il basso e lascia sulla pietra nera una pellicola
            che luccica alla lampada. Il battito della Vecchia, sopra, si fa più forte, e nel canale vuoto
            torna indietro dalle pareti.
          pe: { tecnologia: 5 }
          effetti: { profondita.accademia-gallerie-della-condotta: 1 }
        fallimento:
          titolo: L'acqua indietro
          testo: |
            Conti troppo in fretta, e l'acqua della seconda chiusa torna indietro in un'onda che ti butta
            contro la parete. Orvald ti ripesca dal canale tenendoti per un braccio, e hai la bocca piena di
            un'acqua che sa di metallo.
          effetti: { ferite: 1 }

      - testo: "Girare le ruote a forza"
        descrizione: "La ruggine si vince con la schiena. Tre ruote, tutta la forza che hai."
        prova: { attributo: fisico, abilita: atletica, difficolta: Media }
        successo:
          titolo: La schiena
          testo: |
            Punti il piede contro la paratia e giri la ruota della terza chiusa finché la ruggine non cede con
            uno schiocco. La seconda e la prima vengono più facili. Il canale si svuota, e tu resti
            appoggiat{o|a} alla ruota con le braccia che tremano e i palmi rossi di ruggine.
          pe: { atletica: 5 }
          effetti: { profondita.accademia-gallerie-della-condotta: 1 }
        fallimento:
          titolo: Lo schiocco sbagliato
          testo: |
            Lo schiocco viene dalla tua spalla, e la ruota resta dov'è. Orvald ti
            aiuta a sederti e ti dice di riprovare dopo, con calma.
          effetti: { ferite: 1 }

  - id: accademia-gallerie-gli-echi-della-notte
    immagine: ambientazione/cristalli-conduttori
    titolo: Gli echi della notte
    sommario: "Due echi della Vecchia camminano nel canale svuotato, con le facce che cambiano a ogni passo."
    luogo: Le gallerie della condotta, il canale svuotato
    area: accademia-gallerie-della-condotta
    ripetibile: true
    requisiti: [fazione.accademia == 14, accademia.eco == 0, profondita.accademia-gallerie-della-condotta == 1]
    testo: |
      Nel canale svuotato camminano due echi della Vecchia fatti d'acqua e di luce, con le facce di chi ha
      toccato il cristallo che cambiano a ogni passo. Camminano senza rumore, e si sentono soltanto le gocce
      che cadono dalle loro dita e battono sulla pietra asciutta con il ritmo della Vecchia. Quando ti vedono
      si fermano, e uno alza la mano come Orvald quando chiede silenzio in aula.

      {armi-da-mischia Media} Gli echi si colpiscono quando hanno i piedi sulla pietra, e nel canale vuoto non
      hanno più acqua dove scappare.

      Orvald stringe la spada corta e si mette accanto a te.
    opzioni:
      - testo: "Affrontare gli echi"
        descrizione: "Due echi della Vecchia nel canale vuoto. Orvald è con te."
        combattimento: accademia-gli-echi-della-notte
        vittoria:
          titolo: Il canale pulito
          testo: |
            Gli echi si sciolgono sulla pietra asciutta in due pozze che evaporano subito, e nel canale resta
            a lungo un odore di pioggia sul selciato caldo. Orvald si guarda la spada, che non ha usato, e la
            rinfodera con un certo sollievo.
          effetti: { profondita.accademia-gallerie-della-condotta: 1 }
        sconfitta:
          titolo: La mano fredda
          testo: |
            Uno degli echi ti prende alla gola con la mano di Agnese, che è fredda come l'acqua del canale.
            Orvald lo colpisce con la spada finché non si scioglie e ti trascina indietro fino alle chiuse.
            Per tutta la strada senti sul collo il segno umido delle dita.
          effetti: { ferite: 1, tormento: 1 }

      - testo: "Rimandarli indietro con l'Esorcismo"
        descrizione: "Le parole del Velo rimandano gli echi dove devono stare."
        incantesimo: esorcismo
        prova: { attributo: mentale, abilita: magia, difficolta: Media }
        successo:
          titolo: Le parole del Velo
          testo: |
            Dici le parole del Velo, e gli echi si fermano a metà di un gesto. Poi si sciolgono, e la pietra
            del canale torna asciutta. Le ultime gocce cadute dalle loro dita restano a terra in due file
            dritte e si asciugano per ultime.
          pe: { magia: 5 }
          effetti: { profondita.accademia-gallerie-della-condotta: 1 }
        fallimento:
          titolo: La voce spezzata
          testo: |
            Ti si spezza la voce, e gli echi ti vengono addosso insieme. Orvald
            ti tira indietro per la giubba.
          effetti: { tormento: 1.5 }

      - testo: "Passare lungo il bordo alto"
        descrizione: "Sopra il canale corre un cornicione stretto. Gli echi guardano in basso."
        prova: { attributo: fisico, abilita: furtivita, difficolta: Media }
        successo:
          titolo: Il cornicione
          testo: |
            Passi sul cornicione con la schiena contro la parete, e gli echi, sotto, continuano a camminare
            nel canale vuoto. La pietra dietro la schiena vibra piano a ogni battito della Vecchia. Orvald ti
            segue con i palmi aperti sulla pietra, molto più leggero di quanto pensassi.
          pe: { furtivita: 5 }
          effetti: { profondita.accademia-gallerie-della-condotta: 1 }
        fallimento:
          titolo: Il sasso
          testo: |
            Un sasso del cornicione cade nel canale, e gli echi alzano la testa
            tutti e due. Torni indietro prima che salgano.
          effetti: { tormento: 1 }

  - id: accademia-gallerie-le-incisioni
    immagine: ambientazione/rovine-dei-precursori
    titolo: Le incisioni della condotta
    sommario: "Sulle pareti delle gallerie, dove l'acqua non arriva, ci sono incisioni dei Precursori e, sopra, i gessi di qualcuno."
    luogo: Le gallerie della condotta, sotto la Camera
    area: accademia-gallerie-della-condotta
    ripetibile: true
    requisiti: [fazione.accademia == 14, accademia.eco == 0, profondita.accademia-gallerie-della-condotta >= 1, profondita.accademia-gallerie-della-condotta <= 2]
    testo: |
      Dove le gallerie salgono verso la Camera, sulle pareti sopra la linea dell'acqua ci sono incisioni dei
      Precursori. Sono solchi profondi un dito e larghi uguali dall'inizio alla fine, e in nessun punto c'è il
      segno di uno scalpello. Sopra le incisioni qualcuno ha scritto a gesso. È la grafia fitta di Severo, che
      hai imparato a riconoscere nella torretta, e le frecce indicano tutte la stessa direzione, giù verso la
      Cicatrice.

      {percezione Facile} Uno dei gessi è più bianco degli altri, che l'umidità ha ingrigito. Severo è passato
      di qui dopo essere partito.
    opzioni:
      - testo: "Ricopiare i gessi di Severo"
        descrizione: "Severo ha lasciato le sue ultime note sulle pareti. Orvald vorrà leggerle."
        prova: { attributo: mentale, abilita: accademiche, difficolta: Media }
        successo:
          titolo: Le frecce
          testo: |
            Ricopi i gessi sul quaderno, freccia per freccia. Sono misure del battito prese qui sotto, colonne
            di trattini corti e lunghi scritti di fretta. Accanto all'ultima Severo ha scritto il nome di
            Darn-Morakh e una data di due anni fa. Orvald legge sopra la tua spalla e poi si volta verso il
            canale.
          pe: { accademiche: 5 }
          effetti: { profondita.accademia-gallerie-della-condotta: 1, informazioni.segreto: 1 }
        fallimento:
          titolo: Il gesso che si sbriciola
          testo: |
            Il gesso si sbriciola sotto il dito appena lo sfiori, perché l'umidità l'ha mangiato da dentro, e
            metà delle frecce finisce nell'acqua. La polvere bianca galleggia un momento prima che la corrente
            la porti via. Orvald guarda il punto vuoto della parete a lungo.
          effetti: { tormento: 1 }

      - testo: "Seguire le frecce e basta"
        descrizione: "Non serve leggerle tutte. Basta andare dove vanno."
        esito:
          titolo: Verso il basso
          testo: |
            Segui le frecce lungo la galleria, che sale invece di scendere, e arrivi sotto la Camera. Il
            battito della Vecchia ti arriva dritto nei denti, e a ogni colpo la fiamma della lampada si
            abbassa e si rialza.
          effetti: { profondita.accademia-gallerie-della-condotta: 1 }

  # ------------------------------------------------------------ 2 · sotto la Camera
  - id: accademia-gallerie-la-camera-delle-valvole
    immagine: ambientazione/regno-profondo
    titolo: La camera delle valvole
    sommario: "Sotto la Camera della Condotta, una stanza piena di leve di bronzo. Orvald tiene la leva grande, e tu dai i tempi."
    luogo: Le gallerie della condotta, la camera delle valvole
    area: accademia-gallerie-della-condotta
    ripetibile: true
    requisiti: [fazione.accademia == 14, accademia.eco == 0, profondita.accademia-gallerie-della-condotta == 2]
    testo: |
      Sotto la Camera della Condotta c'è una stanza bassa piena di leve di bronzo, ognuna con un tubo che sale
      nel soffitto. Il soffitto è così basso che Orvald ci sta piegato, e i tubi entrano nella pietra senza
      una giuntura né un filo di malta. Orvald si appende con tutto il peso alla leva grande che svuota la
      Camera, e la leva si abbassa mentre sopra di voi l'acqua comincia a scorrere via.

      «Tu dai i tempi» dice. «Quando la Vecchia batte la lunga io tiro. Se tiro sulla breve, la leva torna su
      e ci porta via le dita.»

      {percezione Media} Il battito arriva dal soffitto un attimo dopo i tubi, e conviene contare su quelli.
      Sotto le dita il bronzo vibra prima che l'orecchio senta il colpo.

      {resistenza Media fallita} Hai fame e le gambe molli, e non sai da quanto siete qui sotto.
    opzioni:
      - testo: "Dare i tempi dai tubi"
        descrizione: "I tubi vibrano un attimo prima del soffitto. Bisogna contare su quelli."
        prova: { attributo: mentale, abilita: percezione, difficolta: Media }
        successo:
          titolo: La Camera vuota
          testo: |
            Tieni la mano su un tubo e dici a Orvald quando tirare, lunga dopo lunga, finché la leva non tocca
            il fondo. Il tubo vibra sempre meno sotto il palmo, finché resta soltanto il battito. Sopra di voi
            l'ultima acqua se ne va dalla Camera con un gorgoglio lungo. La Vecchia, adesso, è asciutta sul
            suo supporto.
          pe: { percezione: 5 }
          effetti: { profondita.accademia-gallerie-della-condotta: 1 }
        fallimento:
          titolo: Le dita
          testo: |
            Dai il tempo sulla breve, e la leva torna su strappando la mano di Orvald dal bronzo. Si fascia le
            dita con un fazzoletto che si macchia subito, e ti dice di riprovare senza lamentarsi.
          effetti: { tormento: 1 }

      - testo: "Tirare tu la leva"
        descrizione: "Orvald ha sessant'anni e le ginocchia di un uomo di ottanta. La leva la tiri tu, e i tempi li dà lui."
        prova: { attributo: fisico, abilita: atletica, difficolta: Media }
        successo:
          titolo: Il peso
          testo: |
            Ti appendi alla leva con tutto il peso, e Orvald ti dà i tempi battendo la spada contro un tubo.
            La leva cala di un dito a ogni colpo, e al quinto le spalle ti bruciano già. Al decimo colpo la
            leva tocca il fondo, e sopra di voi la Camera si svuota.
          pe: { atletica: 5 }
          effetti: { profondita.accademia-gallerie-della-condotta: 1 }
        fallimento:
          titolo: La leva su
          testo: |
            La leva ti scappa di mano e torna su con un colpo che ti prende al
            fianco. Orvald ti aiuta a rialzarti.
          effetti: { ferite: 1 }

  - id: accademia-gallerie-agnese
    immagine: ambientazione/cristalli-conduttori
    titolo: Agnese
    sommario: "Sul camminamento sotto la Camera c'è Agnese, con i guanti nuovi e la lampada, che ti aspetta."
    luogo: Le gallerie della condotta, sotto la Camera
    area: accademia-gallerie-della-condotta
    ripetibile: true
    requisiti: [fazione.accademia == 14, accademia.eco == 0, profondita.accademia-gallerie-della-condotta == 2]
    testo: |
      Sul camminamento sotto la Camera, dove la galleria sale verso la grata del supporto, ti aspetta Agnese
      con i guanti nuovi e una lampada. Dalla grata scende una luce azzurra che si accende e si abbassa con il
      battito. I guanti sono di cuoio chiaro e ancora rigidi sulle nocche. Ha il viso magro di chi ha dormito
      poco per settimane.

      {empatia Media} È venuta perché conosce la Vecchia meglio di chiunque e non sopporta che qualcun altro
      la stacchi.

      «Da qui si sale dritti sotto la Vecchia, e la si stacca dal basso, che è più sicuro» dice alzando la
      lampada verso la grata.
    opzioni:
      - testo: "Lasciare che vi guidi"
        descrizione: "Agnese conosce le gallerie e il supporto. Se ti fidi di lei, fa la strada."
        quando: [accademia.agnese == 2]
        esito:
          titolo: La strada di Agnese
          testo: |
            Agnese vi porta su per una scaletta che non avevi visto, fino a un pianerottolo sotto la grata del
            supporto. Sale senza guardare dove mette i piedi, con la lampada alta. Da lì vedi la base asciutta
            della Vecchia, con le venature accese. Ti mette in mano la clessidra, ancora tiepida delle sue
            mani, per l'ultima volta.
          pe: { empatia: 4 }
          effetti: { profondita.accademia-gallerie-della-condotta: 1 }

      - testo: "Chiederle di scendere con voi"
        descrizione: "Orvald l'ha sospesa dai turni. Lei chiede di esserci lo stesso, e di lasciarla guidare."
        quando: [accademia.agnese != 2]
        prova: { attributo: sociale, abilita: persuasione, difficolta: Media }
        successo:
          titolo: Una volta ancora
          testo: |
            Convinci Orvald a lasciarla venire, una volta ancora. Lui la guarda, poi le tende la mano, e lei
            la stringe attraverso il guanto, che scricchiola. Agnese vi porta su per una scaletta fino al
            pianerottolo sotto la grata del supporto, da dove si vede la base asciutta della Vecchia. Il
            lyssan del supporto è lucido e senza un graffio dopo tutti quegli anni d'acqua.
          pe: { persuasione: 5 }
          effetti: { profondita.accademia-gallerie-della-condotta: 1 }
        fallimento:
          titolo: La sospensione
          testo: |
            Orvald dice di no, e Agnese torna su per la scaletta senza discutere, con la lampada che le trema
            in mano. La sua luce sale piolo per piolo e poi sparisce. La strada sotto la grata, adesso, dovete
            trovarla da soli.
          effetti: { tormento: 1 }

      - testo: "Trovare la scaletta da soli"
        descrizione: "Agnese indica la grata, ma la strada sta a voi. Una scaletta, da qualche parte, deve esserci."
        prova: { attributo: mentale, abilita: percezione, difficolta: Facile }
        successo:
          titolo: La scaletta
          testo: |
            Trovi la scaletta coperta di muschio dietro una colonna, e sali fino al pianerottolo sotto la
            grata del supporto. Il muschio è fradicio e freddo, e sotto ci sono pioli di ferro che la ruggine
            ha mangiato fino a metà. Agnese vi segue con la lampada, in silenzio.
          pe: { percezione: 4 }
          effetti: { profondita.accademia-gallerie-della-condotta: 1 }
        fallimento:
          titolo: Il muschio
          testo: |
            La scaletta è coperta di muschio, e il primo piolo ti si sbriciola
            in mano. Scivoli giù sul camminamento.
          effetti: { ferite: 0.5 }

  # ------------------------------------------------------------ 3 · il cuore: il distacco
  - id: accademia-gallerie-il-distacco
    immagine: ambientazione/cristalli-conduttori
    titolo: Il distacco
    sommario: "La Camera è vuota e la Vecchia è asciutta sul supporto. Quando perde il contatto, la chiamata le esce tutta insieme."
    luogo: Accademia di Torvessa, la Camera della Condotta svuotata
    area: accademia-gallerie-della-condotta
    requisiti: [fazione.accademia == 14, accademia.eco == 0, profondita.accademia-gallerie-della-condotta >= 3]
    testo: |
      Nella cisterna senz'acqua i canali girano secchi lungo le pareti, e la Vecchia sta asciutta sul supporto
      di lyssan, accesa da cima a fondo. Le venature le corrono dentro piene di luce, e a ogni battito l'aria
      della Camera si fa più fredda. Orvald infila la spada alla base del cristallo e la usa come leva, finché
      la lama si piega in un arco.

      La Vecchia si stacca con un rumore di ghiaccio che si rompe, e la chiamata che ha tenuto dentro per
      dieci anni esce tutta insieme. La Camera si riempie di luce e di acqua che non c'era, e prende forma una
      figura grande come la cisterna che ripete i gesti di chi ha toccato la Vecchia. Severo con il gesso,
      Orvald con la piccozza, Agnese con la clessidra e per ultimo tu con il bastone del Regolatore. La figura
      non fa rumore, e il battito adesso arriva da tutte le pareti insieme.

      {rissa Media} Ogni volta che ripete un gesto si ferma un attimo a cercare il passo dopo, ed è lì che si
      apre.

      {origine figlio-della-citta-bassa} In Via del Salmone adesso la fontana è ferma, e pensando alla fila
      con i secchi stringi i pugni.
    opzioni:
      - testo: "Combattere l'Eco della Condotta"
        descrizione: "Un'eco grande come la cisterna, che conosce i tuoi gesti. Orvald è con te, e la spada ce l'ha lui."
        combattimento: accademia-l-eco-della-condotta
        vittoria:
          titolo: L'acqua che torna
          testo: |
            L'Eco si scioglie a metà del tuo stesso gesto, e l'acqua ricade nei canali secchi con un rumore di
            pioggia. Orvald si siede per terra accanto alla Vecchia staccata, con la spada di traverso sulle
            ginocchia, e ride piano. La lama è rimasta storta dove ha fatto da leva. La chiamata, adesso, è
            soltanto un'eco lontana. Prima dell'alba l'acqua torna a salire nei canali.
          pe: { armi-da-mischia: 8 }
          imposta: { accademia.eco: 1 }
          effetti: { rep.accademia: 1 }
          vai: quartieri-alti
        sconfitta:
          titolo: Due giorni senz'acqua
          testo: |
            L'Eco ti schiaccia contro il canale secco, e il colpo ti toglie il fiato e la vista. Quando riapri
            gli occhi è finito, e sei bagnat{o|a} fino alle ossa di un'acqua che sa di pietra. Orvald ha
            staccato la Vecchia da solo mentre l'Eco ti teneva a terra, e l'Eco si è sciolta da sé, dopo aver
            sfondato due canali. Per due giorni in città non arriva acqua, e i portatori la vendono a peso
            d'oro. In Municipio il tuo nome e quello dell'Accademia girano insieme, e non in bene.
          imposta: { accademia.eco: 2 }
          effetti: { ferite: 2, tormento: 1.5, scandalo: 1.5 }
          vai: quartieri-alti

      - testo: "Aprire un varco con l'Esorcismo"
        descrizione: "Le parole del Velo rimandano gli echi dove devono stare. Questo è il più grande che tu abbia mai visto."
        incantesimo: esorcismo
        prova: { attributo: mentale, abilita: magia, difficolta: Difficile }
        successo:
          titolo: Il varco
          testo: |
            Dici le parole del Velo con tutte e due le mani aperte, e l'Eco si apre davanti a te come una
            tenda. Le due metà restano ritte ai lati ancora un momento e ripetono il tuo gesto delle mani
            aperte, poi crollano. In mezzo c'è soltanto la luce della Vecchia, che si spegne piano. L'acqua
            ricade nei canali con un rumore di pioggia, e prima dell'alba torna a salire.
          pe: { magia: 8 }
          imposta: { accademia.eco: 1 }
          effetti: { rep.accademia: 1, tormento: 1 }
          vai: quartieri-alti
        fallimento:
          titolo: La città senz'acqua
          testo: |
            La voce ti si spezza, e l'Eco ti travolge con l'acqua dei canali, che ti entra nel naso tiepida e
            con un sapore di ferro. Orvald ti trascina giù per la grata del supporto. Per due giorni in città
            non arriva acqua, e il tuo nome gira in Municipio. Il lavoro resta da finire, e bisogna
            ridiscendere.
          effetti: { ferite: 1.5, tormento: 1.5, scandalo: 1.5 }
          vai: quartieri-alti

      - testo: "Reggere il flusso mentre Orvald monta il giunto"
        descrizione: "Il giunto nuovo deve toccare la Vecchia prima che l'Eco si sfoghi. Qualcuno deve stare in mezzo al flusso con il bastone, fermo."
        quando: [accademia.esito == 1]
        prova: { attributo: mentale, abilita: resilienza, difficolta: Difficile }
        successo:
          titolo: "Ferm{o|a}"
          testo: |
            Pianti la punta del bastone nel lyssan e resti ferm{o|a} in mezzo al flusso, mentre l'Eco ti passa
            attraverso e ripete i tuoi gesti davanti alla tua faccia. Il lyssan vibra sotto la punta, e la
            vibrazione ti sale lungo il bastone fino alle spalle. Orvald monta il giunto alle tue spalle,
            imprecando. Quando il rame tocca la Vecchia l'Eco rallenta, finché non si siede nei canali come
            acqua che torna a casa.
          pe: { resilienza: 8 }
          imposta: { accademia.eco: 1 }
          effetti: { rep.accademia: 1, tormento: 1 }
          vai: quartieri-alti
        fallimento:
          titolo: "Travolt{o|a}"
          testo: |
            Il flusso ti strappa il bastone di mano e ti butta contro il muro con un colpo che ti risuona nei
            denti. Orvald ti trascina giù per la grata del supporto. Per due giorni in città non arriva acqua,
            e il tuo nome gira in Municipio. Il lavoro resta da finire, e bisogna ridiscendere.
          effetti: { ferite: 1.5, tormento: 1.5, scandalo: 1.5 }
          vai: quartieri-alti

      - testo: "Guidare la Lacrima sul supporto mentre l'Eco si sfoga"
        descrizione: "La Lacrima pende dai paranchi sopra la cisterna. Se tocca il lyssan nel momento giusto, l'Eco ha un altro cristallo a cui rispondere."
        quando: [accademia.esito == 2]
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Difficile }
        successo:
          titolo: L'occhio aperto
          testo: |
            Dai il segnale ai paranchi nel momento in cui l'Eco ripete il gesto di Severo, e la Lacrima scende
            sul supporto di lyssan con un colpo sordo che ti sale dai piedi. L'Eco si ferma, si volta verso
            l'occhio e ci entra dentro, come un fiume che trova il mare. L'acqua ricade nei canali, e prima
            dell'alba torna a salire.
          pe: { tecnologia: 8 }
          imposta: { accademia.eco: 1 }
          effetti: { rep.accademia: 1, tormento: 1 }
          vai: quartieri-alti
        fallimento:
          titolo: Il paranco
          testo: |
            Dai il segnale con un attimo di ritardo, e la Lacrima scende di traverso sul bordo del supporto, e
            il lyssan stride sotto il suo peso. L'Eco ti travolge con l'acqua dei canali. Per due giorni in
            città non arriva acqua, e il tuo nome gira in Municipio. Il lavoro resta da finire, e bisogna
            ridiscendere.
          effetti: { ferite: 1.5, tormento: 1.5, scandalo: 1.5 }
          vai: quartieri-alti

      - testo: "Dire all'Eco la riga di Severo"
        descrizione: "La formula dice di rispondere fino in fondo. Detta all'Eco, la riporta nel cristallo e la sveglia del tutto."
        quando: [accademia.esito == 3]
        prova: { attributo: mentale, abilita: [magia, accademiche], difficolta: Difficile }
        successo:
          titolo: Fino in fondo
          testo: |
            Dici la riga di Severo all'Eco guardandola in faccia, e l'Eco si ferma a metà del tuo gesto. Per
            tutto il tempo che parli la sua faccia è la tua. Poi rientra nella Vecchia tutta insieme, e la
            Vecchia si riattacca da sola al supporto, accesa da cima a fondo, sveglia. L'acqua ricade nei
            canali. Prima dell'alba le fontane della città ripartono, e il battito non si ferma più.
          pe: { magia: 8 }
          imposta: { accademia.eco: 1 }
          effetti: { rep.accademia: 1, tormento: 1.5 }
          vai: quartieri-alti
        fallimento:
          titolo: La riga spezzata
          testo: |
            La riga ti si spezza a metà, e l'Eco risponde al pezzo che hai detto con tutta l'acqua dei canali,
            in un'onda che ti spegne la lampada. Orvald ti trascina giù per la grata. Per due giorni in città
            non arriva acqua, e il tuo nome gira in Municipio. Il lavoro resta da finire, e bisogna
            ridiscendere.
          effetti: { ferite: 1.5, tormento: 2, scandalo: 1.5 }
          vai: quartieri-alti

      - testo: "Chiedere a Orvald di restare nella cisterna con te"
        descrizione: "Le sere d'inverno di nove anni fa lui era quaggiù, a fare i turni. Se l'Eco ripete i suoi gesti, forse ascolta la sua voce."
        quando: [accademia.aurenne >= 1]
        prova: { attributo: sociale, abilita: empatia, difficolta: Difficile }
        successo:
          titolo: La voce del preside
          testo: |
            Orvald posa la spada e resta in mezzo alla cisterna davanti all'Eco, con l'acqua che gli arriva
            alle caviglie. Parla con la voce dell'aula, piano, come parlava alla Vecchia le sere d'inverno
            quando di sopra non si sentiva niente. L'Eco ripete il suo gesto, quello di chi chiede silenzio, e
            poi si ferma. Si scioglie nei canali come acqua che torna a casa. Orvald resta in piedi a lungo,
            con le mani vuote.
          pe: { empatia: 8 }
          imposta: { accademia.eco: 1 }
          effetti: { rep.accademia: 1 }
          vai: quartieri-alti
        fallimento:
          titolo: La voce che trema
          testo: |
            Orvald parla, ma la voce gli trema, e l'Eco ripete il tremito e lo moltiplica finché ne vibra
            tutta la cisterna. Ti travolge con l'acqua dei canali. Per due giorni in città non arriva acqua.
            Il lavoro resta da finire, e bisogna ridiscendere.
          effetti: { ferite: 1.5, tormento: 1.5, scandalo: 1.5 }
          vai: quartieri-alti
