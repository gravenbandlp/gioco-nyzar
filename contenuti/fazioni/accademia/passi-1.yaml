# «Il cerchio aperto», passi 1-5 (fazione.accademia da 0 a 5).
# 1 L'acqua che conta: il cortile della Locanda di Ilka, Besk e la fontana che si ferma; dà la lettera di Besk.
# 2 I cristalli del laboratorio: chi ruba i cristalli carichi (accademia.ladro), poi Lucio Ruspi alla fontana di Via
#   del Salmone (accademia.lucio 1 coperto, 2 denunciato, 3 Orvald alla fontana).
# 3 La lite delle mappe sta in contenuti/citta/accademia.yaml (accademia.tobol); qui il registro degli uditori,
#   con il grado 1.
# 4 La Vecchia: la Camera della Condotta oltre il seminterrato (accademia.camera), poi il giuramento.
# 5 Il diario del centoventi: almeno due preparativi su tre (accademia.preparativi) prima di partire per il Gradone.
storylet:
  # ------------------------------------------------------------ passo 1 · l'acqua che conta
  - id: accademia-l-acqua-che-conta
    immagine: ambientazione/locanda-di-ilka
    titolo: L'acqua che conta
    sommario: "Nella Locanda di Ilka la fontanella si ferma sempre con lo stesso ritmo, e Besk la misura tutta la notte."
    luogo: Locanda di Ilka, il cortile, di notte
    area: citta-bassa
    requisiti: [fazione.accademia == 0, pista.capomozzo >= 10]
    testo: |
      Il cortile della Locanda di Ilka è un quadrato di terra battuta fra la cucina e il muro del vicino, con una fontanella di pietra nell'angolo
      e un fico che ci lascia cadere dentro le foglie. Il getto esce da un tubo di rame, si ferma due volte per poco e una più a lungo, poi
      riparte da capo.

      Besk Dravec è seduta sul bordo della vasca con una clessidra accanto e un cristallo conduttore stretto nel pugno, e a ogni fermata fa un
      segno sul quaderno. «Orvald vuole la misura di tutta la notte, e io domattina ho la sala da aprire» dice, sistemandosi gli occhiali con il
      dorso del polso. «Se resti a contare con me, la cena te la offro io.»

      Dalla cucina, seduta accanto al fuoco con gli occhi lattiginosi rivolti al cortile, Ilka dice una parola piena di consonanti dure. «Dice che
      l'acqua conta» traduce Besk. «È una parola dei Precursori. Me la diceva quando ero piccola, per farmi dormire.»

      {origine allievo-di-torvessa} Al Festival i cristalli dietro il banco di Orvald si sono messi a vibrare tutti insieme poco prima che
      arrivassero le macchine, e questo ritmo te lo ricorda.

      *Una fontana che tiene il tempo, e nessuno che sappia per chi.* Il fico lascia cadere un'altra foglia nella vasca.
    opzioni:
      - testo: "Contare con Besk fino all'alba"
        descrizione: "Serve la pazienza di non addormentarsi fino all'alba. Besk ti presta la matita di riserva."
        prova: { attributo: mentale, abilita: [percezione, resilienza], difficolta: Media }
        successo:
          titolo: Due brevi e una lunga
          testo: |
            Contate a turno finché il cielo sopra il muro diventa grigio, e all'alba Besk trova le vostre colonne uguali riga per riga. Ti mette in mano
            un foglio piegato in quattro con due righe. «Portalo a Orvald. Le guardie la mia grafia la conoscono, e per una lettera all'Accademia ti fanno
            salire.»
          pe: { percezione: 4 }
          imposta: { accademia.lettera: 1 }
          effetti: { fazione.accademia: 1, rep.accademia: 0.5, monete: 3 }
        fallimento:
          titolo: La sabbia
          testo: |
            Verso le due ti accorgi di aver contato con la clessidra ferma. Besk
            cancella mezza colonna con il pollice e ti versa un sidro senza dire
            niente, e alla fine tu ti addormenti sul bordo della vasca.
          effetti: { tormento: 0.5 }

      - testo: "Calarsi nel pozzetto della fontana"
        descrizione: "Sotto la vasca c'è un pozzetto di mattoni con il tubo che arriva dalla strada. Forse lì si vede qualcosa."
        prova: { attributo: fisico, abilita: atletica, difficolta: Media }
        successo:
          titolo: Il tubo
          testo: |
            Ti cali nel pozzetto, con Besk che ti tiene la lanterna sopra la testa. Quando il getto si ferma senti il colpo dell'acqua che torna indietro nel
            tubo fin sotto la via, due volte per poco e la terza più a lungo. Risali, e Besk ti mette in mano un foglio con due righe. «Portalo a Orvald. Per
            una lettera all'Accademia le guardie ti fanno salire.»
          pe: { atletica: 4 }
          imposta: { accademia.lettera: 1 }
          effetti: { fazione.accademia: 1, rep.accademia: 0.5, monete: 3 }
        fallimento:
          titolo: Il mattone smosso
          testo: |
            Il terzo mattone si muove sotto il piede, e ti ritrovi sul fondo del pozzetto con l'acqua alle caviglie e un gomito sbucciato. Besk
            ti tira su per il polso e dice che per stanotte basta così.
          effetti: { ferite: 0.5 }

      - testo: "Sentire il Mana nel getto"
        descrizione: "Basta mettere la mano sotto l'acqua e ascoltare quello che passa insieme a lei."
        requisiti: [magia >= 1]
        prova: { attributo: mentale, abilita: magia, difficolta: Facile }
        successo:
          titolo: Il filo che tira
          testo: |
            Metti la mano sotto il getto gelato e senti un filo di Mana che passa
            con l'acqua e a tratti si tende, come se qualcuno lo tirasse
            dall'altra parte della città, e quando si tende il getto si ferma.
            Besk ti mette in mano un foglio con due righe. «Portalo a Orvald. Per
            una lettera all'Accademia le guardie ti fanno salire.»
          pe: { magia: 4 }
          imposta: { accademia.lettera: 1 }
          effetti: { fazione.accademia: 1, rep.accademia: 0.5, monete: 3 }
        fallimento:
          titolo: Acqua fredda
          testo: |
            Tieni la mano sotto il getto finché non ti diventa rossa, e senti
            soltanto il freddo. Besk ti dice che per sentire il Mana nell'acqua
            serve una mano asciutta e una testa che non pensa alla cena.
          effetti: { tormento: 1 }

      - testo: "Chiedere a Ilka che cosa vuol dire la parola"
        descrizione: "Ilka la parola l'ha detta guardando la fontana. Forse sa che cosa conta, l'acqua."
        immagine: personaggi/ilka-dravec
        prova: { attributo: sociale, abilita: empatia, difficolta: Facile }
        successo:
          titolo: La ninna nanna
          testo: |
            Ilka ti prende la mano fra le sue, secche come pane vecchio, e ti ripete la parola battendoti il tempo sul polso con due colpi brevi e uno più lungo, poi ti dice che così contavano le cose che volevano essere trovate. Besk ha sentito dal cortile e ti dà un foglio con
            due righe da portare a Orvald, insieme a questo.
          pe: { empatia: 4 }
          imposta: { accademia.lettera: 1 }
          effetti: { fazione.accademia: 1, rep.accademia: 0.5, monete: 3 }
        fallimento:
          titolo: Il falò
          testo: |
            Ilka ti prende la mano e ti racconta del falò dei primi carri, che con
            la fontana non c'entra niente, e quando ha finito la fontana si è
            fermata e ripartita cento volte senza di te.
          effetti: { tormento: 0.5 }

      - testo: "Restare sveglio a qualunque costo"
        descrizione: "Contare non è difficile. Difficile è farlo fino all'alba, una tazza di caffè dopo l'altra."
        costo: 2
        esito:
          titolo: Il caffè di Besk
          testo: |
            Besk ti fa un caffè che sa di bruciato, poi un altro. Conti con la schiena contro il fico, ricominciando ogni volta che sbagli, finché all'alba le
            colonne coincidono quasi e Besk ti dà un foglio piegato in quattro. «Portalo a Orvald. Per una lettera all'Accademia le guardie ti fanno salire.»
          pe: { resistenza: 3 }
          imposta: { accademia.lettera: 1 }
          effetti: { fazione.accademia: 1, rep.accademia: 0.5, monete: 3 }

      - testo: "Contare come ti hanno insegnato al primo anno"
        descrizione: "Al primo anno Orvald vi faceva contare i battiti dei cristalli, e questa fontana batte come un cristallo."
        quando: [origine.allievo-di-torvessa >= 1]
        esito:
          titolo: L'esercizio del primo anno
          testo: |
            Conti come al primo anno, girando la clessidra a ogni terza fermata e
            segnando le tacche sul margine del quaderno, e Besk ride perché le fa
            come te. All'alba vi bastano due colonne. Lei ti dà un foglio con due
            righe per Orvald. «Diglielo tu che la sequenza è la stessa del banco.
            Io non c'ero.»
          pe: { accademiche: 4 }
          imposta: { accademia.lettera: 1 }
          effetti: { fazione.accademia: 1, rep.accademia: 0.5, monete: 3 }

  # ------------------------------------------------------------ passo 2 · i cristalli del laboratorio
  - id: accademia-i-cristalli-del-laboratorio
    presso: accademia-di-torvessa
    immagine: personaggi/orvald-temmerin
    titolo: I cristalli del laboratorio
    sommario: "Orvald Temmerin legge la lettera di Besk e non dice niente della fontana. Ha un altro lavoro per te."
    luogo: Accademia di Torvessa, lo studio del preside
    area: quartieri-alti
    requisiti: [fazione.accademia == 1, accademia.ladro == 0]
    testo: |
      Orvald legge la lettera di Besk due volte e la infila sotto il teschio di cinghiale mutato. Senza dire niente della fontana, ricopia la
      sequenza con tre segni piccoli a margine di una mappa delle fontane della città.

      «Dal laboratorio spariscono i cristalli carichi, uno alla settimana» dice. «Voglio sapere chi è prima che se ne accorga Querci, il
      tesoriere, che li conta anche in sogno. Se se ne accorge lui diventa una faccenda del consiglio dei maestri, che non ha mai risolto
      niente in meno di un anno.»

      La cassetta dei cristalli carichi sta nel laboratorio, chiusa a chiave. La chiave ce l'hanno Orvald, la maestra di laboratorio e chiunque
      sappia dove lei la appoggia quando si toglie i guanti.

      *Chi ruba per vendere ne prende più di uno alla settimana.* Pett, sulla trave, sposta il peso da una zampa all'altra.
    opzioni:
      - testo: "Appostarsi nel laboratorio di notte"
        descrizione: "Dietro l'armadio dei vetri c'è posto per una persona, se sta ferma."
        prova: { attributo: fisico, abilita: furtivita, difficolta: Media }
        successo:
          titolo: La manica
          testo: |
            Passi la notte dietro l'armadio dei vetri, con un ginocchio contro una mensola. Poco prima dell'alba entra un ragazzino magro con le
            scarpe troppo grandi, prende la chiave dal posto dei guanti e fa sparire un cristallo nella manica. Lo segui giù per i Gradoni, verso
            Via del Salmone.
          pe: { furtivita: 4 }
          imposta: { accademia.ladro: 1 }
        fallimento:
          titolo: La mensola
          testo: |
            Verso le tre la mensola cede sotto il ginocchio, e una fila di
            ampolle rotola sul pavimento con un rumore che sveglia mezza
            Accademia. Il bidello arriva con la lanterna, e la mattina dopo lo
            sa anche Querci, che ti guarda passare come si guarda un conto
            sbagliato.
          effetti: { scandalo: 1 }

      - testo: "Chiedere a Pett"
        descrizione: "Il corvo il ladro lo conosce. Bisogna convincerlo che ti conviene dirlo."
        immagine: personaggi/orvald-temmerin
        prova: { attributo: sociale, abilita: addestrare-animali, difficolta: Facile }
        successo:
          titolo: L'attaccapanni
          testo: |
            Porti a Pett un pezzo di crosta, e il corvo, mangiata l'ultima briciola, vola all'attaccapanni del primo anno a beccare una giacchetta lisa con un
            buco nella fodera pieno di polvere azzurra di cristallo. Un'allieva ti dice che è di Lucio Ruspi, del primo anno, che abita in Via del Salmone.
          pe: { addestrare-animali: 4 }
          imposta: { accademia.ladro: 1 }
        fallimento:
          titolo: Il forno
          testo: |
            Pett mangia la crosta e vola fuori dalla finestra. Lo trovi al
            forno, sul davanzale, dove il fornaio gli sta dando la seconda
            colazione. Del ladro, per oggi, non ti dice niente.

      - testo: "Seguire il cristallo fino a chi lo compra"
        descrizione: "Un cristallo carico rubato si vende in fretta, e in Città Bassa chi compra lo sanno in tanti."
        quando: [pista.pelle < 6]
        prova: { attributo: sociale, abilita: conoscenze-della-strada, difficolta: Media }
        successo:
          titolo: Il ricettatore degli Scuri
          testo: |
            Chiedi in giro in Città Bassa con una moneta in mano, finché arrivi a un ricettatore degli Scuri. Pensando che tu
            voglia vendere, ti dice che i cristalli dell'Accademia glieli porta un ragazzino di Via del Salmone una volta alla
            settimana, sotto prezzo perché ha fretta.
          pe: { conoscenze-della-strada: 4 }
          imposta: { accademia.ladro: 1 }
        fallimento:
          titolo: La moneta di troppo
          testo: |
            Fai troppe domande e mostri troppe monete, e un uomo degli Scuri
            ti accompagna fuori dal vicolo con una mano sulla spalla. Gentile,
            per ora. La notizia che qualcuno cerca cristalli rubati arriva in
            Caserma prima di te.
          effetti: { sospetto: 1 }

      - testo: "Seguire il cristallo fino a chi lo compra"
        descrizione: "Dopo la caduta di Vesh i cristalli rubati si vendono al Mercato delle Ombre, e i banchi buoni sono pochi."
        quando: [pista.pelle >= 6]
        prova: { attributo: sociale, abilita: conoscenze-della-strada, difficolta: Media }
        successo:
          titolo: Il banco sotto il ponte
          testo: |
            Al Mercato delle Ombre un vecchio con le dita storte vende cristalli su un telo sotto un ponte, e quelli
            dell'Accademia li riconosci dal taglio. Gli compri il più piccolo, e lui ti dice che glieli porta un
            ragazzino di Via del Salmone, una volta alla settimana.
          pe: { conoscenze-della-strada: 4 }
          imposta: { accademia.ladro: 1 }
          effetti: { monete: -2 }
        fallimento:
          titolo: Il telo arrotolato
          testo: |
            Il vecchio ti guarda le mani e la faccia, decide che hai l'aria di
            una guardia e arrotola il telo con tutti i cristalli dentro. Quando
            torni, il giorno dopo, sotto il ponte non c'è nessuno.
          effetti: { sospetto: 1 }

      - testo: "Contare i cristalli ogni sera"
        descrizione: "Non serve un talento. Serve contare la cassetta prima di cena e dopo colazione, per tutta la settimana."
        costo: 2
        esito:
          titolo: Il conto della settimana
          testo: |
            Per una settimana conti la cassetta sera e mattina e segni su un foglio chi entra in laboratorio. Il sesto giorno manca un cristallo, e nelle ore della notte sul foglio c'è un nome solo, Lucio Ruspi,
            primo anno, che abita in Via del Salmone e pulisce il laboratorio per pagarsi la borsa.
          pe: { percezione: 2 }
          imposta: { accademia.ladro: 1 }

      - testo: "Pensare al ragazzino che giurava con le mani in vista"
        descrizione: "Un ragazzino del primo anno giura sempre con le mani in vista, e fra allievi si sa cosa vuol dire."
        quando: [origine.allievo-di-torvessa >= 1]
        esito:
          titolo: Le mani in vista
          testo: |
            Lucio Ruspi, quello del primo anno che pulisce il laboratorio per
            pagarsi la borsa, giura sempre con le mani bene in vista, e gli
            allievi più grandi gli tengono la borsa chiusa quando passa. Lo
            aspetti all'uscita del laboratorio e gli guardi le maniche, e quella
            sinistra pende un poco di più.
          pe: { percezione: 2 }
          imposta: { accademia.ladro: 1 }

  - id: accademia-la-fontana-di-via-del-salmone
    immagine: ambientazione/citta-bassa
    titolo: La fontana di Via del Salmone
    sommario: "Il ragazzino che ruba i cristalli abita in Via del Salmone, dove la fontana all'alba ha una fila lunga."
    luogo: Città Bassa, Via del Salmone, all'alba
    area: citta-bassa
    requisiti: [fazione.accademia == 1, accademia.ladro >= 1]
    testo: |
      La fontana di Via del Salmone è una vasca di pietra con un mascherone di rame senza naso, e all'alba la fila arriva al gomito della strada. A metà mattina
      il getto si ferma, e l'acqua la vendono i portatori con le botti sui carretti.

      {origine figlio-della-citta-bassa} Da bambino ci stavi anche tu, con un secchio sbeccato, e i portatori ti chiamavano per nome per farti sentire in debito.

      Lucio Ruspi è in fila con due secchi e le scarpe di qualcuno più grande. Quando ti vede capisce subito e li appoggia, per mostrarti le mani aperte.

      «Lo so che cosa sembra» dice prima che tu apra bocca. «Mia madre ha la tosse, e l'acqua dei portatori costa più di quello che guadagno pulendo il
      laboratorio. Uno alla settimana, e solo quelli che ad Agnese avanzano.»
    opzioni:
      - testo: "Coprirlo con Orvald"
        descrizione: "Si può raccontare al preside che i cristalli si sono rotti al banco. Bisogna raccontarlo bene."
        prova: { attributo: sociale, abilita: ingannare, difficolta: Media }
        successo:
          titolo: I cristalli incrinati
          testo: |
            Racconti a Orvald che i cristalli si sono incrinati al banco e gli
            porti come prova le schegge di un cristallo sterile. Lui dice soltanto
            che sterili e carichi si incrinano in modo diverso. Il giorno dopo sul
            banco c'è un cartello con la sua grafia, *chi ha bisogno di acqua lo
            dica a me*, e di cristalli non ne spariscono più.
          pe: { ingannare: 5 }
          imposta: { accademia.lucio: 1 }
          effetti: { fazione.accademia: 1, rep.accademia: 0.5, monete: 5 }
        fallimento:
          titolo: Le schegge sbagliate
          testo: |
            Orvald ascolta la storia dell'incidente fino in fondo, ti spiega con
            pazienza come si incrina un cristallo carico e manda Pett a chiamare
            Lucio. Il ragazzino resta in Accademia, ma il laboratorio lo pulisce
            un altro, e per sera la storia la sanno tutti, perché Querci passava
            di lì.
          imposta: { accademia.lucio: 2 }
          effetti: { fazione.accademia: 1, scandalo: 1, monete: 5 }

      - testo: "Dirlo a Orvald com'è"
        descrizione: "Un ladro è un ladro, anche a dodici anni. Orvald deciderà meglio di te."
        esito:
          titolo: Il consiglio dei maestri
          testo: |
            Racconti tutto a Orvald, la madre con la tosse compresa, e Lucio, convocato nello studio, confessa prima che gli venga chiesto. Resta in
            Accademia, ma il laboratorio lo pulisce un altro. Quando è uscito, Orvald resta a lungo con il dito sulla Città Bassa della mappa delle
            fontane, dove l'acqua arriva per ultima.
          pe: { persuasione: 3 }
          imposta: { accademia.lucio: 2 }
          effetti: { fazione.accademia: 1, rep.accademia: 0.5, monete: 5 }

      - testo: "Portare Orvald a vedere la fontana"
        descrizione: "Il preside non scende in Città Bassa da anni, e una mattina in fila spiega più di un rapporto."
        prova: { attributo: sociale, abilita: persuasione, difficolta: Media }
        successo:
          titolo: In fila
          testo: |
            Convinci Orvald a scendere in Via del Salmone all'alba, con Pett sulla
            spalla e un cappello mai visto. Fa la fila senza dire chi è, e quando
            il getto si ferma scrive l'ora sulla mappa delle fontane. Lucio resta
            all'Accademia, l'acqua per casa sua la porta un carretto della scuola,
            e sulla via del ritorno Orvald ti chiama assistente.
          pe: { persuasione: 5 }
          imposta: { accademia.lucio: 3 }
          effetti: { fazione.accademia: 1, rep.accademia: 0.5, monete: 5, nomea.citta-bassa: 0.5 }
        fallimento:
          titolo: Il preside non scende
          testo: |
            Orvald ti ascolta e poi dice che ha lezione. La Città Bassa la conosce bene, e le fontane le misura dalla mappa. Ti accorgi troppo tardi
            che gliel'hai chiesto come un favore, e lui i favori li fa solo a Tobol. Puoi riprovare un altro giorno, con un argomento migliore.
          effetti: { scandalo: 0.5 }

      - testo: "Far parlare i portatori d'acqua davanti a Orvald"
        descrizione: "I portatori di Via del Salmone li conosci da bambino, e se il preside li sente contrattare capisce da solo."
        quando: [origine.figlio-della-citta-bassa >= 1]
        esito:
          titolo: Il prezzo dell'acqua
          testo: |
            Porti Orvald in Via del Salmone a metà mattina, quando il getto è
            fermo, e il portatore più vecchio ti fa il prezzo di quando eri
            bambino, che resta un prezzo da ladri. Orvald guarda la vasca vuota e
            tira fuori la mappa delle fontane. Lucio resta all'Accademia con
            l'acqua portata a casa da un carretto della scuola, e sulla via del
            ritorno Orvald ti chiama assistente.
          pe: { conoscenze-della-strada: 5 }
          imposta: { accademia.lucio: 3 }
          effetti: { fazione.accademia: 1, rep.accademia: 0.5, monete: 5, nomea.citta-bassa: 0.5 }

  # ------------------------------------------------------------ passo 3 · il registro degli uditori (grado 1)
  # La lite delle mappe (contenuti/citta/accademia.yaml) apre questa scena impostando accademia.tobol.
  - id: accademia-il-registro-degli-uditori
    presso: accademia-di-torvessa
    immagine: personaggi/orvald-temmerin
    titolo: Il registro degli uditori
    sommario: "Orvald apre un registro rilegato in tela verde e intinge la penna. Il tuo nome ci sta, se lo vuoi."
    luogo: Accademia di Torvessa, lo studio del preside
    area: quartieri-alti
    requisiti: [fazione.accademia == 2, accademia.tobol >= 1]
    testo: |
      Il giorno dopo la lite Tobol è tornato con una cravatta nuova, gialla a
      righe viola, e Orvald ha fatto finta di non vederla per tutta la
      mattina. Adesso lo studio è tranquillo. Orvald apre un registro
      rilegato in tela verde, con *uditori* scritto sul dorso, pieno di nomi
      con accanto una data, e intinge la penna.

      «Chi sta su questo registro segue le lezioni che vuole e gira per le
      aule senza che il bidello gli chieda chi è» dice. «Le mie lezioni le
      paga a metà, perché il preside sono io. In cambio, quando torno al
      Gradone, mi servirà qualcuno che sappia tenere una corda e la bocca
      chiusa.» Scrive il tuo nome con la grafia stretta e soffia
      sull'inchiostro.

      {politica-ed-economia Media} Le lezioni a metà prezzo le paga lui di
      tasca sua, e un preside che fa sconti è un preside che vuole qualcosa.

      Sulla scrivania ci sono un cristallo d'aula su un anello d'ottone e una
      lente da tasca chiusa come un orologio, che Tobol ha lasciato lì
      uscendo, con un biglietto. Pett li guarda tutti e due con molto
      interesse.
    opzioni:
      - testo: "Chiedere le sere di Besk"
        descrizione: "Non hai mai sentito un cristallo rispondere. Besk fa sedute al tavolo di cucina, gratis per gli uditori."
        quando: [magia == 0]
        esito:
          titolo: Tre sere al tavolo di cucina
          testo: |
            Per tre sere, con due righe di Orvald per Besk e il cristallo d'aula
            in mano, ti siedi al tavolo di cucina della Locanda di Ilka e respiri
            come ti dice lei. La terza sera il cristallo si scalda e una venatura
            si accende d'azzurro, e Ilka dal suo angolo dice che la stanza è
            diventata più fredda.
          pe: { magia: 20 }
          almeno: { rep.accademia: 2 }
          effetti: { fazione.accademia: 1, monete: 30, oggetto.accademia-cristallo-d-aula: 1 }

      - testo: "Prendere il cristallo d'aula e la lezione dello scudo"
        descrizione: "Orvald insegna la difesa prima dell'attacco. Per un uditore, la prima lezione la offre lui."
        quando: [magia >= 1, incantesimo.scudo-arcano == 0]
        esito:
          titolo: La mela morsicata
          testo: |
            Orvald ti tira addosso quello che trova sulla scrivania, dalla mela morsicata al libro, e la lamina regge fino
            all'ultimo, mentre Pett fa il suo verso che somiglia a una risata. Poi ti infila al dito l'anello del cristallo
            d'aula. «L'hanno consumato trenta allievi prima di te, quindi consumalo anche tu.»
          pe: { magia: 3 }
          almeno: { rep.accademia: 2 }
          effetti: { fazione.accademia: 1, monete: 30, oggetto.accademia-cristallo-d-aula: 1, incantesimo.scudo-arcano: 1 }

      - testo: "Prendere il cristallo d'aula e la lezione del sussurro"
        descrizione: "Una formula che si dice a bocca chiusa. Orvald la insegna di solito a poco, oggi gratis."
        quando: [magia >= 1, incantesimo.sussurro-di-paura == 0]
        esito:
          titolo: Dietro le mappe
          testo: |
            Provi la formula su Pett, che secondo Orvald ci è abituato, e il corvo arruffa le penne e va a nascondersi dietro una pila di mappe, da
            dove ti guarda con un occhio solo e molto rancore. Orvald ti infila al dito l'anello del cristallo d'aula e ti ricorda che al corvo
            adesso devi delle noci.
          pe: { magia: 3 }
          almeno: { rep.accademia: 2 }
          effetti: { fazione.accademia: 1, monete: 30, oggetto.accademia-cristallo-d-aula: 1, incantesimo.sussurro-di-paura: 1 }

      - testo: "Prendere il cristallo d'aula"
        descrizione: "Un cristallo consumato da trenta allievi. Chi lo porta sente il Mana un poco prima degli altri."
        quando: [magia >= 1]
        esito:
          titolo: Trenta allievi
          testo: |
            Orvald ti infila al dito l'anello d'ottone del cristallo d'aula e
            ti fa sentire, con la punta di un dito, il bordo consumato dove
            trenta allievi prima di te hanno cercato la venatura. Il cristallo
            si scalda appena, e a te sembra un saluto.
          pe: { magia: 5 }
          almeno: { rep.accademia: 2 }
          effetti: { fazione.accademia: 1, monete: 30, oggetto.accademia-cristallo-d-aula: 1 }

      - testo: "Prendere la lente di Tobol"
        descrizione: "Sul biglietto c'è scritto *per chi ha guardato la mappa invece di guardare noi*. È la lente di riserva di Tobol."
        immagine: personaggi/tobol-aspern
        esito:
          titolo: Il biglietto di Tobol
          testo: |
            Apri la lente e la carta della scrivania ti salta incontro, con la
            macchia di tè della mappa del Gradone grande come un lago. Il
            biglietto di Tobol dice che ne ha sei e che questa la puoi rompere.
            Orvald brontola che Tobol regala sempre le cose degli altri, ma la
            lente era davvero sua.
          pe: { percezione: 5 }
          almeno: { rep.accademia: 2 }
          effetti: { fazione.accademia: 1, monete: 30, oggetto.accademia-lente-da-tasca: 1 }

  # ------------------------------------------------------------ passo 4 · la Vecchia
  - id: accademia-la-vecchia
    presso: accademia-di-torvessa
    immagine: ambientazione/cristalli-conduttori
    titolo: La Vecchia
    sommario: "Il lunedì sera Orvald ti porta oltre il seminterrato, dietro una porta di ferro che non hai mai visto aperta."
    luogo: Accademia di Torvessa, oltre il seminterrato
    area: quartieri-alti
    requisiti: [fazione.accademia == 3, accademia.camera == 0]
    testo: |
      Il lunedì sera Orvald ti porta nel seminterrato e poi oltre, dietro il bersaglio di lyssan, fino a una porta di ferro più vecchia della prima,
      da cui una scala a chiocciola scende nel buio.

      Sotto c'è una cisterna rotonda dei Precursori, con i canali di pietra lungo le pareti e l'acqua del Torvessa che ci sale dentro da sola. Al
      centro, su un supporto di lyssan, c'è un cristallo alto come due uomini, con venature azzurre che si accendono due volte per poco e una più a
      lungo, come la fontana di Ilka.

      {magia Media} Il battito lento ti arriva nei denti prima che nelle orecchie, e il Mana qui dentro si muove come una bestia stanca.

      Accanto al cristallo, a un tavolo con un registro e una clessidra, conta sottovoce una donna sui sessant'anni con i guanti di pelle. «Agnese
      Lunardi, maestra di laboratorio» dice Orvald. «Qui sotto la chiamiamo Regolatrice.» Alle sue spalle tiene un altro registro Ermanno Querci, il
      tesoriere, con i manicotti di tela nera.

      «Questa è la Vecchia» dice Agnese senza smettere di contare. «Tiene l'acqua alla città da dieci anni, e basta fino al prossimo inverno se
      nessuno la fa arrabbiare.»

      {origine allievo-di-torvessa} Fra gli allievi questa si chiama la porta dell'acqua, e al terzo anno facevi finta di non crederci più.
    opzioni:
      - testo: "Sentire la carica della Vecchia"
        descrizione: "Agnese ti lascia appoggiare la mano sul supporto di lyssan. Il cristallo dice quanto gli resta a chi lo sa ascoltare."
        requisiti: [magia >= 1]
        prova: { attributo: mentale, abilita: magia, difficolta: Media }
        successo:
          titolo: Il fondo del pozzo
          testo: |
            Appoggi la mano sul lyssan e il battito ti sale lungo il braccio. Dentro c'è molto Mana, ma sotto si vede il fondo, come quello di un pozzo d'estate.
            Agnese ti guarda la faccia e annuisce. «Adesso lo sai anche tu» dice, rimettendo a posto la clessidra, «ed era meglio quando lo sapevamo in tre.»
          pe: { magia: 5 }
          imposta: { accademia.camera: 1 }
          effetti: { rep.accademia: 0.5 }
        fallimento:
          titolo: Il colpo
          testo: |
            Appoggi la mano sul lyssan, e il battito ti arriva tutto in una
            volta, fino alla nuca. Ti ritrovi seduto sul pavimento bagnato con
            Agnese che ti tiene la testa e ti conta i battiti al polso come
            conta quelli del cristallo. Quanto gli resta l'ha detto lei, e devi
            fidarti.
          imposta: { accademia.camera: 1 }
          effetti: { tormento: 1 }

      - testo: "Leggere i registri di Agnese"
        descrizione: "Ogni turno ha la sua riga, da dieci anni. In una colonna c'è la carica che il cristallo consuma."
        prova: { attributo: mentale, abilita: [accademiche, politica-ed-economia], difficolta: Media }
        successo:
          titolo: La colonna che raddoppia
          testo: |
            I dieci registri hanno la colonna del consumo sempre uguale fino all'estate scorsa. Dal giorno del Festival i numeri
            raddoppiano, e in certe notti triplicano. Quando lo fai notare, Querci chiude il suo registro e dice che lui l'aveva detto
            in consiglio già a marzo.
          pe: { accademiche: 5 }
          imposta: { accademia.camera: 1 }
          effetti: { rep.accademia: 0.5 }
        fallimento:
          titolo: La grafia di Agnese
          testo: |
            La grafia di Agnese è minuta e piena di abbreviazioni sue, e dopo il
            terzo registro ti si incrociano gli occhi. Le chiedi che cosa vuol
            dire un segno, e lei te lo spiega piano, nello stesso modo in cui lo spiega agli allievi del primo anno.
          imposta: { accademia.camera: 1 }
          effetti: { tormento: 1 }

      - testo: "Guardare le mani di Agnese"
        descrizione: "Porta i guanti anche qui sotto, dove fa freddo d'estate e d'inverno. Ogni tanto se li toglie per scrivere."
        prova: { attributo: mentale, abilita: medicina, difficolta: Facile }
        successo:
          titolo: I tremori
          testo: |
            Quando si toglie il guanto destro per scrivere, la mano di Agnese trema appena, a scatti regolari, il tremore che i maestri chiamano
            Dissonanza e i medici non sanno curare. Lei se ne accorge e si rimette il guanto senza fretta. «Sono otto anni che scendo qui» dice,
            lisciandosi il cuoio sulle dita, «e le mani se li ricordano tutti.»
          pe: { medicina: 5 }
          imposta: { accademia.camera: 1 }
          effetti: { rep.accademia: 0.5 }
        fallimento:
          titolo: I guanti
          testo: |
            Agnese i guanti non se li toglie nemmeno per scrivere. Dopo un po' si accorge che glieli guardi. Si volta dall'altra parte e
            continua a contare, e per tutta la sera ti parla soltanto di numeri.
          imposta: { accademia.camera: 1 }
          effetti: { tormento: 1 }

      - testo: "Reggere il battito della cisterna"
        descrizione: "Quaggiù il battito della Vecchia rimbomba nelle pareti. Restare in piedi e ascoltare è già una prova."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Media }
        successo:
          titolo: In piedi
          testo: |
            Resti in piedi al bordo del canale mentre il battito ti passa
            attraverso, e a poco a poco smetti di aspettarlo. Lo ascolti come
            si ascolta il mare di notte. Dopo un'ora Agnese ti mette in mano la clessidra. «Il prossimo giro lo conti tu, così vedo se reggi» dice.
          pe: { resilienza: 5 }
          imposta: { accademia.camera: 1 }
          effetti: { rep.accademia: 0.5 }
        fallimento:
          titolo: Il secchio
          testo: |
            Al decimo battito ti piega in due un conato, e Querci ti allunga un secchio che evidentemente tiene lì apposta. Risali la scala a
            chiocciola appoggiato al muro, e per tutta la notte sogni l'acqua
            che sale nei canali.
          imposta: { accademia.camera: 1 }
          effetti: { tormento: 1 }

      - testo: "Dire ad Agnese che la porta di ferro, fra gli allievi, si chiama la porta dell'acqua"
        descrizione: "Una leggenda degli allievi che era vera. Forse ad Agnese fa piacere saperlo."
        quando: [origine.allievo-di-torvessa >= 1]
        esito:
          titolo: La porta dell'acqua
          testo: |
            Glielo dici, e Agnese smette di contare per la prima volta da quando
            sei sceso. Ride piano, con un suono arrugginito. «La porta
            dell'acqua» ripete. «Allora gli allievi ne sanno più del consiglio.»
            Ti fa sedere al tavolo dei Regolatori e ti mostra dove guardare sul
            registro, come ti mostrava al laboratorio dove mettere le dita.
          pe: { accademiche: 5 }
          imposta: { accademia.camera: 1 }
          effetti: { rep.accademia: 0.5 }

  - id: accademia-il-giuramento
    presso: accademia-di-torvessa
    immagine: personaggi/orvald-temmerin
    titolo: Il giuramento
    sommario: "Orvald Temmerin ti chiede di non parlare della Vecchia con nessuno. Querci tiene già la penna in mano."
    luogo: Accademia di Torvessa, la Camera della Condotta
    area: quartieri-alti
    requisiti: [fazione.accademia == 3, accademia.camera >= 1]
    testo: |
      Prima di risalire Orvald ti trattiene accanto al tavolo dei Regolatori,
      mentre la Vecchia batte alle sue spalle e Querci tiene la penna sospesa
      sul registro.

      «Se la città sapesse che la sua acqua dipende da un cristallo che si sta
      spegnendo, domattina ogni famiglia con un cristallo grande lo chiuderebbe
      in cantina con due guardie davanti» dice Orvald. «Le comunità si sono già
      sbranate una volta per i conduttori, nella Guerra del Cristallo. Quindi
      ti chiedo il silenzio. Lo chiedo a tutti quelli che scendono quaggiù, e
      finora l'hanno dato tutti.»

      {empatia Media} Orvald ha già deciso che giurerai, e se non lo fai gli
      dispiace per te prima che per sé. Querci invece spera che tu rifiuti, per
      avere ragione su qualcosa.

      Agnese ha smesso di contare e ti guarda, con le mani guantate intrecciate
      sul registro.
    opzioni:
      - testo: "Giurare"
        descrizione: "Una firma sul registro di Querci e la parola data a Orvald. Della Vecchia, fuori di qui, non parli."
        esito:
          titolo: La firma
          testo: |
            Firmi sul registro di Querci e stringi la mano a Orvald, che la tiene
            un momento più del solito. «La Vecchia viene dal Gradone Rosso» dice,
            mentre risalite. «Io e un amico l'abbiamo staccata dal suo nucleo
            trent'anni fa. Se la riattacco, si ricarica da sola.» In cima alla
            scala Querci ti fa notare che per stasera non ti paga nessuno.
          pe: { resilienza: 5 }
          imposta: { accademia.giuramento: 1 }
          effetti: { fazione.accademia: 1, rep.accademia: 1 }

      - testo: "Rifiutare di giurare"
        descrizione: "Un segreto sull'acqua della città non è dell'Accademia. Puoi tacere lo stesso, ma senza firmare."
        esito:
          titolo: La pagina bianca
          testo: |
            Dici che starai zitto finché ti sembrerà giusto, senza firmare. Querci
            chiude il registro con un colpo secco, e Orvald, dopo averci pensato,
            dice che gli va bene e che Querci ti terrà d'occhio. Mentre risalite
            ti spiega il piano lo stesso. La Vecchia viene dal Gradone Rosso, e
            lui vuole riattaccarla al nucleo da cui l'ha staccata trent'anni fa.
          pe: { persuasione: 5 }
          imposta: { accademia.giuramento: 2 }
          effetti: { fazione.accademia: 1, rep.accademia: 0.5 }

      - testo: "Giurare e chiedere a Querci quanto costa una Vecchia nuova"
        descrizione: "Il tesoriere sa i conti meglio di chiunque. Se glieli chiedi nel modo giusto, te li dice per sfogarsi."
        prova: { attributo: mentale, abilita: politica-ed-economia, difficolta: Media }
        successo:
          titolo: Il conto di Querci
          testo: |
            Querci si illumina e ti spiega che un cristallo così grande si va a prendere a Darn-Morakh, con una spedizione che costa quanto tre anni di Accademia, e che le licenze sul grano di Julia Castaldi servono anche a questo. Sulla scala Orvald ti spiega il suo piano, che costa
            molto meno. La Vecchia viene dal Gradone Rosso, e lui vuole riattaccarla al suo nucleo.
          pe: { politica-ed-economia: 5 }
          imposta: { accademia.giuramento: 1 }
          effetti: { fazione.accademia: 1, rep.accademia: 1, informazioni.pettegolezzo: 1 }
        fallimento:
          titolo: Il registro chiuso
          testo: |
            Chiedi a Querci quanto costerebbe una Vecchia nuova come si chiede il
            prezzo del pesce, e lui risponde che non sono affari di un uditore.
            Sulla scala Orvald ti spiega il piano. La Vecchia viene dal Gradone
            Rosso, e lui vuole riattaccarla al nucleo da cui l'ha staccata
            trent'anni fa.
          imposta: { accademia.giuramento: 1 }
          effetti: { fazione.accademia: 1, rep.accademia: 1, scandalo: 0.5 }

  # ------------------------------------------------------------ passo 5 · il diario del centoventi
  - id: accademia-il-diario-del-centoventi
    presso: accademia-di-torvessa
    immagine: personaggi/orvald-temmerin
    titolo: Il diario del centoventi
    sommario: "Per tornare al Gradone Rosso Orvald ha soltanto il diario del centoventi, e mancano delle pagine."
    luogo: Accademia di Torvessa, lo studio del preside
    area: quartieri-alti
    requisiti: [fazione.accademia == 4]
    testo: |
      Sulla scrivania di Orvald c'è un diario di cuoio con *centoventi* sulla copertina, aperto a un disegno della Vecchia spenta,
      distesa in una sala rotonda.

      «Io e Severo Dalmas l'abbiamo trovata così, l'abbiamo staccata dal suo nucleo di pietra nera e portata in città su un carro»
      dice. «Per vent'anni è stata in un magazzino, finché nel centoquaranta la condotta di prima ha ceduto e Severo l'ha svegliata
      con una formula sua.» Gira le pagine fino a una cucitura vuota. «Le pagine di quell'anno non ci sono più, e Severo se n'è
      andato due anni dopo.»

      {accademiche Media} La cucitura è tagliata di netto, da qualcuno che sapeva quali pagine voleva.

      Per tornare servono le iscrizioni della sala, che lui copiò per la Biblioteca, e un'attrezzatura da Raschiatori, perché la
      sua è marcita in cantina. Serve anche una strada, visto che Tobol dice che il sentiero non c'è più.
    opzioni:
      - testo: "Leggere i calchi delle iscrizioni con Mattias Crenn"
        descrizione: "In Biblioteca ci sono i calchi che Orvald consegnò trent'anni fa. Mattias li sa trovare, leggerli è un'altra faccenda."
        immagine: personaggi/mattias-crenn
        quando: [accademia.calchi == 0]
        prova: { attributo: mentale, abilita: accademiche, difficolta: Media }
        successo:
          titolo: I calchi
          testo: |
            Mattias trova i calchi in un cassetto che nessuno apriva da vent'anni. Ci passate un pomeriggio, lui legge ad alta voce e tu confronti i segni,
            finché le incisioni della sala rotonda hanno un ordine, alcune per le porte, altre per le soglie da non passare. Mattias ti fa una copia in
            bella e ti chiede di riportargliela intera.
          pe: { accademiche: 5 }
          imposta: { accademia.calchi: 1 }
          effetti: { accademia.preparativi: 1 }
        fallimento:
          titolo: Il carboncino
          testo: |
            I calchi sono sbiaditi, e a forza di confrontarli ti ritrovi le
            dita nere di carboncino e le iscrizioni ancora mescolate. Mattias ti
            dice di tornare quando ha trovato il secondo cassetto, che è in un
            altro piano e forse in un'altra ala.
          effetti: { tormento: 0.5 }

      - testo: "Ricopiare la strada con Tobol"
        descrizione: "Tobol ha la mappa nuova del Gradone con la frana, e gli serve una copia senza quote sbagliate."
        immagine: personaggi/tobol-aspern
        quando: [accademia.strada == 0]
        prova: { attributo: mentale, abilita: percezione, difficolta: Facile }
        successo:
          titolo: Le quote
          testo: |
            Ricopi la mappa di Tobol curvo sul suo tavolo, con Whisp che ti
            cammina sul polso, la frana segnata a tratteggio e il giro largo per
            evitarla. Tobol confronta le due mappe e ti paga la copia, perché
            anche gli amici si pagano, soprattutto quelli che non sbagliano.
          pe: { percezione: 5 }
          imposta: { accademia.strada: 1 }
          effetti: { accademia.preparativi: 1, monete: 5 }
        fallimento:
          titolo: La quota sbagliata
          testo: |
            Sbagli una quota, e la frana sulla tua copia finisce in mezzo al
            fiume. Tobol se ne accorge al primo sguardo e ti fa ricominciare da capo, con un'allegria che non ha nessuna fretta.
          effetti: { tormento: 0.5 }

      - testo: "Farsi dare l'attrezzatura da Dragna Gro-Malog"
        descrizione: "Al Grifone di Ferro la capo squadra dei Raschiatori presta corde e imbraghi a chi sa chiederli."
        immagine: personaggi/dragna-gro-malog
        quando: [accademia.attrezzi == 0]
        prova: { attributo: sociale, abilita: persuasione, difficolta: Media }
        successo:
          titolo: Le corde di Dragna
          testo: |
            Dragna ti ascolta a braccia incrociate e ti presta due corde e un imbrago con una lampada da piattaforma, avvertendoti che se torni senza
            le corde le paghi come nuove. «E di' al preside che l'arenaria non tiene i chiodi» aggiunge. «Lo sa, ma se lo dimentica sempre.»
          pe: { persuasione: 5 }
          imposta: { accademia.attrezzi: 1 }
          effetti: { accademia.preparativi: 1 }
        fallimento:
          titolo: Il nome sbagliato
          testo: |
            Chiedi le corde a Dragna come si chiede un favore, e lei ti risponde
            che i favori li fa ai suoi. Ti consiglia di tornare quando avrai
            sudato su una piattaforma almeno una volta.
          effetti: { scandalo: 0.5 }

      - testo: "Prendere l'attrezzatura dei Raschiatori da amico"
        descrizione: "Ai Raschiatori ormai sei noto. Le corde te le prestano senza discutere."
        immagine: personaggi/dragna-gro-malog
        quando: [accademia.attrezzi == 0]
        requisiti: [rep.raschiatori >= 3]
        esito:
          titolo: Fra amici
          testo: |
            Dragna ti vede entrare e ti lancia un rotolo di corda prima che tu
            apra bocca. Poi aggiunge un imbrago e una lampada da piattaforma, e
            ti avverte che l'arenaria del Gradone non tiene i chiodi.
          pe: { atletica: 3 }
          imposta: { accademia.attrezzi: 1 }
          effetti: { accademia.preparativi: 1 }

      - testo: "Aiutare Orvald a fare i bagagli"
        descrizione: "Tre giorni a rammendare tende vecchie e a ungere fibbie, un lavoro che chiunque può fare."
        quando: [accademia.preparativi < 2]
        costo: 2
        esito:
          titolo: Le tende del centoventi
          testo: |
            Passi tre giorni in cantina con Orvald a rammendare le tende del vecchio scavo e a ungere le fibbie. Mentre lavora ti racconta del Gradone, e da come
            ne parla capisci che la tenda di Severo stava lontano dalla sua. Alla fine avete due tende che tengono e un sacco di cose che non servivano.
          pe: { resistenza: 2 }
          effetti: { accademia.preparativi: 1 }

      - testo: "Prendere le corde della tua squadra"
        descrizione: "Le corde della tua squadra le conosci nodo per nodo. Basta chiederle al magazzino del Grifone."
        quando: [origine.apprendista-raschiatore >= 1, accademia.attrezzi == 0]
        esito:
          titolo: Le corde di casa
          testo: |
            Al magazzino del Grifone il ragazzo di turno ti riconosce e ti
            lascia scegliere. Prendi le corde della tua squadra, quelle con il nodo rosso alle estremità, e ci aggiungi un imbrago con una lampada da piattaforma.
            Dragna, dal tavolo, alza il boccale verso di te senza chiedere dove
            vai.
          pe: { atletica: 3 }
          imposta: { accademia.attrezzi: 1 }
          effetti: { accademia.preparativi: 1 }

      - testo: "Partire per il Gradone Rosso"
        descrizione: "La strada del Gradone parte dalla Superficie Fratturata, a monte del Torvessa. Orvald è pronto da trent'anni."
        requisiti: [accademia.preparativi >= 2]
        esito:
          titolo: Il carro
          testo: |
            Orvald noleggia un carro con un mulo solo, perché sei erano per
            portare la Vecchia. Besk sale dietro con i quaderni. Uscite dalla
            città per la Superficie Fratturata e risalite il Torvessa per un
            giorno, finché l'arenaria rossa del Gradone vi riempie l'orizzonte e
            Orvald la guarda in silenzio, con la piccozza sulle ginocchia.
          pe: { accademiche: 3 }
          effetti: { fazione.accademia: 1, rep.accademia: 0.5 }
