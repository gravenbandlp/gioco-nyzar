# «Il cerchio aperto», passi 1-5 (fazione.accademia da 0 a 5).
# 1 L'acqua che conta: il cortile della Locanda di Ilka, Besk e la fontana che si ferma; dà la lettera di Besk.
# 2 I cristalli del laboratorio: chi ruba i cristalli carichi (accademia.ladro), poi Lucio Ruspi alla fontana di Via
#   del Salmone (accademia.lucio 1 coperto, 2 denunciato, 3 Orvald alla fontana).
# 3 La lite delle mappe sta in contenuti/citta/accademia.yaml (accademia.tobol); qui il registro degli uditori,
#   con il grado 1.
# 4 La Vecchia: la Camera della Condotta oltre il seminterrato (accademia.camera), poi il giuramento.
# 5 Il diario del centoventi: almeno due preparativi su tre (accademia.preparativi) prima di partire per il Gradone.
storylet:
  # ------------------------------------------------------------ passo 1 · l'acqua che conta
  - id: accademia-l-acqua-che-conta
    immagine: ambientazione/locanda-di-ilka
    titolo: L'acqua che conta
    sommario: "Nel cortile della Locanda di Ilka la fontanella si ferma un momento, sempre con lo stesso ritmo. Besk Dravec la deve misurare tutta la notte."
    luogo: Locanda di Ilka, il cortile, di notte
    area: citta-bassa
    requisiti: [fazione.accademia == 0, pista.capomozzo >= 10]
    testo: |
      Il cortile della Locanda di Ilka è un quadrato di terra battuta fra la
      cucina e il muro del vicino, con una fontanella di pietra nell'angolo e
      un fico che ci lascia cadere dentro le foglie. A quest'ora i clienti se
      ne sono andati, e dalla porta della cucina arriva l'odore delle patate
      speziate rimaste sul fuoco. Besk Dravec è seduta sul bordo della vasca
      con una clessidra accanto, il quaderno aperto sulle ginocchia e un
      cristallo conduttore stretto nel pugno, e muove le labbra contando.

      La fontanella getta acqua da un tubo di rame. A un certo punto il getto
      si ferma un momento e poi riparte. Besk fa un segno sul quaderno
      senza alzare gli occhi.

      {percezione Facile} Due fermate brevi e una lunga, e poi di nuovo da
      capo, sempre uguali. Le fontane di solito non tengono il tempo.

      «Orvald vuole la misura di tutta la notte, e io domattina ho la sala da
      aprire» dice Besk, e si sistema gli occhiali con il dorso del polso.
      «Se resti a contare con me, la cena te la offro io. Se ti addormenti, te
      la offro lo stesso, ma poi ti sveglio.»

      Dalla cucina, seduta accanto al fuoco con gli occhi lattiginosi rivolti
      al cortile, Ilka dice una parola piena di consonanti dure che non hai mai sentito. Besk smette di contare. «Dice che l'acqua conta» traduce.
      «È una parola dei Precursori. Me la diceva quando ero piccola, per farmi
      dormire.»

      {magia Media} Il cristallo nel pugno di Besk si scalda e si raffredda
      insieme al getto. Nell'acqua il Mana c'è, e arriva a scatti.

      {origine allievo-di-torvessa} Al Festival, dietro il banco di Orvald, i
      cristalli si sono messi a vibrare tutti insieme poco prima che
      arrivassero le macchine. Questo ritmo ti si ferma da qualche parte fra
      la nuca e le scapole.

      *Una fontana che tiene il tempo, e nessuno che sappia per chi.* Il fico
      lascia cadere un'altra foglia nella vasca.
    opzioni:
      - testo: "Contare con Besk fino all'alba"
        descrizione: "Serve la pazienza di non addormentarsi fino all'alba. Besk ti presta la matita di riserva."
        prova: { attributo: mentale, abilita: [percezione, resilienza], difficolta: Media }
        successo:
          titolo: Due brevi e una lunga
          testo: |
            Contate a turno finché il cielo
            sopra il muro non diventa grigio. La sequenza non cambia mai, e verso
            le tre te la senti battere nelle tempie anche quando l'acqua scorre.
            All'alba Besk confronta le vostre colonne e le trova uguali riga per riga. Ti guarda come si guarda un collega. Scrive due righe su un foglio, lo
            piega in quattro e te lo mette in mano. «Portalo a Orvald. Le
            guardie dei Quartieri Alti la mia grafia la conoscono, e per una
            lettera all'Accademia ti fanno salire.»
          pe: { percezione: 4 }
          imposta: { accademia.lettera: 1 }
          effetti: { fazione.accademia: 1, rep.accademia: 0.5, monete: 3 }
        fallimento:
          titolo: La sabbia
          testo: |
            Verso le due ti accorgi di aver contato il getto con la sabbia ferma,
            perché hai girato la clessidra e poi te ne sei dimenticato. Besk
            cancella mezza colonna con il pollice e ti versa un sidro senza dire
            niente, che è peggio di qualunque rimprovero. Alla fine la notte la
            conta da sola, e tu ti addormenti sul bordo della vasca.

            {resistenza Media fallita} Il corpo aveva deciso che era ora di
            dormire molto prima di te, e alla fine ha vinto lui.
          effetti: { tormento: 0.5 }

      - testo: "Calarsi nel pozzetto della fontana"
        descrizione: "Sotto la vasca c'è un pozzetto di mattoni con il tubo che arriva dalla strada. Se si ferma l'acqua, qualcosa si vedrà."
        prova: { attributo: fisico, abilita: atletica, difficolta: Media }
        successo:
          titolo: Il tubo
          testo: |
            Sollevi la grata e ti cali nel pozzetto puntando i piedi sui
            mattoni, con Besk che ti tiene la lanterna sopra la testa. Il tubo
            di rame che arriva dalla strada è freddo e vibra appena. Quando il
            getto si ferma, il tubo si ferma con lui, e senti il colpo dell'acqua
            che torna indietro fin sotto la via, due volte per poco e la terza volta più a lungo. Risali con le ginocchia bagnate. Besk scrive due righe su un
            foglio e te lo mette in mano. «Portalo a Orvald. Per una lettera
            all'Accademia le guardie ti fanno salire.»
          pe: { atletica: 4 }
          imposta: { accademia.lettera: 1 }
          effetti: { fazione.accademia: 1, rep.accademia: 0.5, monete: 3 }
        fallimento:
          titolo: Il mattone smosso
          testo: |
            Il terzo mattone si muove sotto il piede, e ti ritrovi seduto
            sul fondo del pozzetto con l'acqua alle caviglie e un gomito
            sbucciato. Besk ti tira su per il polso e ti dice che il tubo, da lì sotto, almeno l'hai sentito bene, e che per stanotte basta così.
          effetti: { ferite: 0.5 }

      - testo: "Sentire il Mana nel getto"
        descrizione: "Basta mettere la mano sotto l'acqua e ascoltare quello che passa insieme a lei."
        requisiti: [magia >= 1]
        prova: { attributo: mentale, abilita: magia, difficolta: Facile }
        successo:
          titolo: Il filo che tira
          testo: |
            Metti la mano sotto il getto, e l'acqua gelata ti fa contrarre le
            dita. Poi lo senti, un filo di Mana che passa con l'acqua e a tratti
            si tende, come se qualcuno lo tirasse dall'altra parte della città.
            Quando si tende il getto si ferma. Lo dici a Besk, che smette di
            scrivere e ti fissa da sopra gli occhiali. Poi scrive due righe su
            un foglio e te lo mette in mano. «Portalo a Orvald. Per una lettera
            all'Accademia le guardie ti fanno salire.»
          pe: { magia: 4 }
          imposta: { accademia.lettera: 1 }
          effetti: { fazione.accademia: 1, rep.accademia: 0.5, monete: 3 }
        fallimento:
          titolo: Acqua fredda
          testo: |
            Tieni la mano sotto il getto finché non ti diventa rossa, e senti
            soltanto il freddo. Besk ti dice che per sentire il Mana nell'acqua
            serve una mano asciutta e una testa che non pensa alla cena.
          effetti: { tormento: 1 }

      - testo: "Chiedere a Ilka che cosa vuol dire la parola"
        descrizione: "Ilka la parola l'ha detta guardando la fontana. Forse sa che cosa conta, l'acqua."
        immagine: personaggi/ilka-dravec
        prova: { attributo: sociale, abilita: empatia, difficolta: Facile }
        successo:
          titolo: La ninna nanna
          testo: |
            Ti siedi accanto al fuoco e chiedi a Ilka della parola. Lei ti prende la mano fra le sue, secche come pane vecchio, e te la ripete piano. Intanto batte il tempo con il pollice sul tuo polso, due colpi brevi seguiti da uno più lungo. «Così contavano le cose che volevano essere
            trovate» dice, e poi ti chiede chi sei, perché se n'è già scordata.
            Besk ha sentito tutto dal cortile. Scrive due righe su un foglio e te
            lo mette in mano. «Portalo a Orvald, e digli anche questo.»
          pe: { empatia: 4 }
          imposta: { accademia.lettera: 1 }
          effetti: { fazione.accademia: 1, rep.accademia: 0.5, monete: 3 }
        fallimento:
          titolo: Il falò
          testo: |
            Ilka ti prende la mano e comincia a raccontarti del falò dei primi
            carri, che con la fontana non c'entra niente. La ascolti fino in
            fondo per educazione, e quando hai finito la fontana si è fermata e
            ripartita cento volte senza di te.
          effetti: { tormento: 0.5 }

      - testo: "Restare sveglio a qualunque costo"
        descrizione: "Contare non è difficile. Difficile è farlo fino all'alba, una tazza di caffè dopo l'altra."
        costo: 2
        esito:
          titolo: Il caffè di Besk
          testo: |
            Besk ti fa un caffè che sa di bruciato e te ne fa un altro quando il
            primo smette di funzionare. Conti con le palpebre pesanti e la schiena contro il fico. Sbagli due volte il conto e ricominci sempre da capo. All'alba le
            colonne coincidono quasi. Besk ti mette in mano un foglio piegato in
            quattro con due righe per Orvald. «Le guardie dei Quartieri Alti la
            mia grafia la conoscono. Per una lettera all'Accademia ti fanno
            salire.»
          pe: { resistenza: 3 }
          imposta: { accademia.lettera: 1 }
          effetti: { fazione.accademia: 1, rep.accademia: 0.5, monete: 3 }

      - testo: "Contare come ti hanno insegnato al primo anno"
        descrizione: "Al primo anno Orvald vi faceva contare i battiti dei cristalli con la clessidra. Questa fontana batte come un cristallo."
        quando: [origine.allievo-di-torvessa >= 1]
        esito:
          titolo: L'esercizio del primo anno
          testo: |
            Ti siedi accanto a Besk e conti come al primo anno, con la clessidra
            girata a ogni terza fermata e le tacche sul margine del quaderno.
            Besk ti guarda la mano e ride, perché fa le tacche come te. All'alba
            vi bastano due colonne. Lei scrive due righe per Orvald e ti dà il
            foglio. «Diglielo tu che la sequenza è la stessa del banco. Io non
            c'ero.»
          pe: { accademiche: 4 }
          imposta: { accademia.lettera: 1 }
          effetti: { fazione.accademia: 1, rep.accademia: 0.5, monete: 3 }

  # ------------------------------------------------------------ passo 2 · i cristalli del laboratorio
  - id: accademia-i-cristalli-del-laboratorio
    presso: accademia-di-torvessa
    immagine: personaggi/orvald-temmerin
    titolo: I cristalli del laboratorio
    sommario: "Orvald Temmerin legge la lettera di Besk e non dice niente della fontana. Ha un altro lavoro per te."
    luogo: Accademia di Torvessa, lo studio del preside
    area: quartieri-alti
    requisiti: [fazione.accademia == 1, accademia.ladro == 0]
    testo: |
      Orvald legge la lettera di Besk due volte, in piedi accanto alla finestra. Poi la infila sotto il teschio di cinghiale mutato insieme alle
      altre carte che vuole tenere a portata di mano. Della fontana non dice
      niente. Ricopia la sequenza a margine di una mappa con tre segni piccoli e ci soffia sopra perché l'inchiostro asciughi.

      {accademiche Media} La mappa è della rete delle fontane. Le ha segnate
      tutte, dai Quartieri Alti fino all'ultima della Città Bassa, e accanto ad
      alcune c'è una data.

      «Dal laboratorio spariscono i cristalli carichi, uno alla settimana»
      dice, guardando la mappa. «Voglio sapere chi è prima che se ne accorga
      Querci, il tesoriere, che li conta anche in sogno. Se se ne accorge lui,
      sarà una faccenda del consiglio dei maestri, e il consiglio dei maestri
      non ha mai risolto niente in meno di un anno.» Pett, sulla trave,
      sposta il peso da una zampa all'altra.

      {addestrare-animali Facile} Pett sa chi è. Un corvo vede tutto quello che
      luccica, e i cristalli carichi luccicano parecchio.

      Il laboratorio è in fondo al corridoio delle aule, con il banco di pietra
      nera e la cassetta dei cristalli carichi chiusa a chiave. La chiave ce
      l'hanno Orvald, la maestra di laboratorio e chiunque sappia dove la
      maestra la appoggia quando si toglie i guanti.

      *Uno alla settimana, sempre uno. Chi ruba per vendere ne prende di più.* Pett, sulla trave, chiude un occhio come se fosse d'accordo.
    opzioni:
      - testo: "Appostarsi nel laboratorio di notte"
        descrizione: "Dietro l'armadio dei vetri c'è posto per una persona, se sta ferma."
        prova: { attributo: fisico, abilita: furtivita, difficolta: Media }
        successo:
          titolo: La manica
          testo: |
            Passi la notte dietro l'armadio dei vetri, con un ginocchio contro
            una mensola e il naso pieno di polvere di gesso. Poco prima dell'alba
            la porta si apre e entra un ragazzino magro con le scarpe troppo
            grandi. Prende la chiave dal posto dei guanti e apre la cassetta, poi fa sparire un cristallo nella manica, svelto come un giocatore di
            carte. Lo segui fino al portone. In strada scende i Gradoni verso la
            Città Bassa, e verso Via del Salmone.
          pe: { furtivita: 4 }
          imposta: { accademia.ladro: 1 }
        fallimento:
          titolo: La mensola
          testo: |
            Verso le tre la mensola cede sotto il ginocchio, e una fila di
            ampolle rotola sul pavimento con un rumore che sveglia mezza
            Accademia. Il bidello arriva con la lanterna, e la mattina dopo lo
            sa anche Querci, che ti guarda passare come si guarda un conto
            sbagliato.
          effetti: { scandalo: 1 }

      - testo: "Chiedere a Pett"
        descrizione: "Il corvo il ladro lo conosce. Bisogna convincerlo che ti conviene dirlo."
        immagine: personaggi/orvald-temmerin
        prova: { attributo: sociale, abilita: addestrare-animali, difficolta: Facile }
        successo:
          titolo: L'attaccapanni
          testo: |
            Porti a Pett un pezzo di crosta del forno e lo lasci decidere. Il corvo mangia la crosta fino all'ultima briciola. Poi vola nel corridoio delle aule,
            fino all'attaccapanni del primo anno, dove becca con insistenza una
            giacchetta lisa. Nella fodera c'è un buco cucito male, e dentro il
            buco una polvere azzurra di cristallo. Un'allieva ti dice che la giacchetta è di Lucio Ruspi, uno del primo anno che abita in Via del Salmone.
          pe: { addestrare-animali: 4 }
          imposta: { accademia.ladro: 1 }
        fallimento:
          titolo: Il forno
          testo: |
            Pett mangia la crosta e vola fuori dalla finestra. Lo trovi al
            forno, sul davanzale, dove il fornaio gli sta dando la seconda
            colazione. Del ladro, per oggi, non ti dice niente.

      - testo: "Seguire il cristallo fino a chi lo compra"
        descrizione: "Un cristallo carico rubato si vende in fretta, e in Città Bassa chi compra lo sanno in tanti."
        quando: [pista.pelle < 6]
        prova: { attributo: sociale, abilita: conoscenze-della-strada, difficolta: Media }
        successo:
          titolo: Il ricettatore degli Scuri
          testo: |
            Chiedi in giro in Città Bassa con una moneta in mano, e la terza
            moneta ti porta da un ricettatore che lavora per gli Scuri, in un
            retrobottega che odora di cuoio bagnato. I cristalli dell'Accademia
            li riconosce dal taglio, e te lo dice perché pensa che tu voglia
            vendere. Glieli porta un ragazzino di Via del Salmone una volta alla settimana, e li vende sotto prezzo perché ha fretta.
          pe: { conoscenze-della-strada: 4 }
          imposta: { accademia.ladro: 1 }
        fallimento:
          titolo: La moneta di troppo
          testo: |
            Fai troppe domande e mostri troppe monete, e un uomo degli Scuri
            ti accompagna fuori dal vicolo con una mano sulla spalla. Gentile,
            per ora. La notizia che qualcuno cerca cristalli rubati arriva in
            Caserma prima di te.
          effetti: { sospetto: 1 }

      - testo: "Seguire il cristallo fino a chi lo compra"
        descrizione: "Dopo la caduta di Vesh i cristalli rubati si vendono al Mercato delle Ombre, e i banchi buoni sono pochi."
        quando: [pista.pelle >= 6]
        prova: { attributo: sociale, abilita: conoscenze-della-strada, difficolta: Media }
        successo:
          titolo: Il banco sotto il ponte
          testo: |
            Al Mercato delle Ombre un vecchio con le dita storte vende cristalli
            sotto un ponte, su un telo steso per terra. Quelli dell'Accademia li
            riconosci dal taglio prima che lui apra bocca. Gli compri il più
            piccolo e lui, contento di aver fatto un affare, ti dice che glieli
            porta un ragazzino di Via del Salmone una volta alla settimana, e li lascia sotto prezzo perché ha fretta.
          pe: { conoscenze-della-strada: 4 }
          imposta: { accademia.ladro: 1 }
          effetti: { monete: -2 }
        fallimento:
          titolo: Il telo arrotolato
          testo: |
            Il vecchio ti guarda le mani e la faccia, decide che hai l'aria di
            una guardia e arrotola il telo con tutti i cristalli dentro. Quando
            torni, il giorno dopo, sotto il ponte non c'è nessuno.
          effetti: { sospetto: 1 }

      - testo: "Contare i cristalli ogni sera"
        descrizione: "Non serve un talento. Serve contare la cassetta prima di cena e dopo colazione, per tutta la settimana."
        costo: 2
        esito:
          titolo: Il conto della settimana
          testo: |
            Per una settimana conti la cassetta la sera e la mattina, e segni
            chi entra in laboratorio su un foglio nascosto sotto il banco. Il sesto giorno manca un cristallo, e sul foglio, nelle ore fra la sera e la mattina, c'è un nome solo. Lucio Ruspi, primo anno, che abita in
            Via del Salmone e il laboratorio lo pulisce per pagarsi la borsa.
          pe: { percezione: 2 }
          imposta: { accademia.ladro: 1 }

      - testo: "Pensare al ragazzino che giurava con le mani in vista"
        descrizione: "In Accademia c'è un ragazzino del primo anno che giura sempre tenendo bene in vista tutte e due le mani. Fra allievi si sa che cosa vuol dire."
        quando: [origine.allievo-di-torvessa >= 1]
        esito:
          titolo: Le mani in vista
          testo: |
            Lo conosci di vista, Lucio Ruspi, quello del primo anno che pulisce
            il laboratorio per pagarsi la borsa. Giura sempre con tutte e due le
            mani bene in vista, e in corridoio gli allievi più grandi gli tengono
            la borsa chiusa quando passa. Ti basta aspettarlo all'uscita del
            laboratorio e guardargli le maniche. Quella sinistra pende un poco di
            più.
          pe: { percezione: 2 }
          imposta: { accademia.ladro: 1 }

  - id: accademia-la-fontana-di-via-del-salmone
    immagine: ambientazione/citta-bassa
    titolo: La fontana di Via del Salmone
    sommario: "Il ragazzino che ruba i cristalli abita in Via del Salmone. La fontana della sua strada, la mattina, ha una fila lunga."
    luogo: Città Bassa, Via del Salmone, all'alba
    area: citta-bassa
    requisiti: [fazione.accademia == 1, accademia.ladro >= 1]
    testo: |
      La fontana di Via del Salmone è una vasca di pietra con un mascherone
      di rame che ha perso il naso, e all'alba la fila arriva fino al gomito
      della strada. Donne con i secchi, vecchi con le brocche, bambini con
      tutto quello che tiene l'acqua. Il getto è sottile, e verso metà
      mattina si ferma del tutto. Da lì in avanti l'acqua la portano i
      portatori, con le botti sui carretti, e la fanno pagare.

      {conoscenze-della-strada Media} I portatori la prendono alla fontana dei Quartieri Alti, dove il getto resta forte tutto il giorno, e la rivendono qui. È il
      commercio più onesto della strada, e anche il più odiato.

      Lucio Ruspi è in fila con due secchi, magro, con le scarpe di qualcuno
      più grande e i capelli bagnati pettinati all'indietro per sembrare in
      ordine. Quando ti vede capisce subito, e lo capisci dal fatto che
      appoggia i secchi e ti mostra tutte e due le mani aperte.

      «Lo so che cosa sembra» dice. «Mia madre ha la tosse, e l'acqua dei
      portatori costa più di quello che guadagno pulendo il laboratorio.
      Uno alla settimana, e solo quelli che ad Agnese avanzano.»

      {empatia Facile} Ha preparato questa frase molte volte, di notte. Adesso
      che la dice ad alta voce gli sembra più piccola di come se la ricordava.

      {origine figlio-della-citta-bassa} Questa fila la conosci. Da bambino ci
      stavi con un secchio sbeccato, e i portatori ti chiamavano per nome per
      farti sentire in debito.
    opzioni:
      - testo: "Coprirlo con Orvald"
        descrizione: "Si può raccontare al preside che i cristalli si sono rotti al banco. Bisogna raccontarlo bene."
        prova: { attributo: sociale, abilita: ingannare, difficolta: Media }
        successo:
          titolo: I cristalli incrinati
          testo: |
            Racconti a Orvald che i cristalli mancanti si sono incrinati al
            banco, e che qualcuno ha avuto vergogna a dirlo. Gli porti le schegge
            di un cristallo sterile come prova. Orvald le gira sul palmo a lungo
            e dice soltanto che i cristalli sterili e quelli carichi si
            incrinano in modo diverso. Poi chiude il discorso. Il giorno dopo
            sul banco del laboratorio c'è un cartello con la sua grafia, *chi
            ha bisogno di acqua lo dica a me*, e di cristalli non ne spariscono
            più. A te dice che la Città Bassa, da qualche mese, la sente nei
            conti delle fontane.
          pe: { ingannare: 5 }
          imposta: { accademia.lucio: 1 }
          effetti: { fazione.accademia: 1, rep.accademia: 0.5, monete: 5 }
        fallimento:
          titolo: Le schegge sbagliate
          testo: |
            Porti a Orvald le schegge di un cristallo sterile e gli racconti
            dell'incidente al banco. Orvald ti ascolta fino in fondo, poi ti
            spiega con pazienza come si incrina un cristallo carico, e manda
            Pett a chiamare Lucio. Il ragazzino entra con le mani già in vista.
            Orvald lo tiene in Accademia, ma il laboratorio lo pulisce un altro.
            Querci, che passava di lì, segna qualcosa su un foglio, e la
            storia dei cristalli in Accademia la sanno tutti per sera.
          imposta: { accademia.lucio: 2 }
          effetti: { fazione.accademia: 1, scandalo: 1, monete: 5 }

      - testo: "Dirlo a Orvald com'è"
        descrizione: "Un ladro è un ladro, anche a dodici anni. Orvald deciderà meglio di te."
        esito:
          titolo: Il consiglio dei maestri
          testo: |
            Racconti tutto a Orvald, la madre con la tosse compresa. Lui ascolta
            senza interromperti e poi convoca Lucio nello studio. Il ragazzino
            confessa prima che gli venga chiesto. Orvald lo tiene in Accademia. Il laboratorio però lo pulisce un altro, e la borsa la paga a metà Querci,
            che è il tesoriere e ne fa una questione di principio. Quando il
            ragazzino è uscito, Orvald resta a lungo davanti alla mappa delle
            fontane, con il dito sulla Città Bassa, dove l'acqua arriva per
            ultima.
          pe: { persuasione: 3 }
          imposta: { accademia.lucio: 2 }
          effetti: { fazione.accademia: 1, rep.accademia: 0.5, monete: 5 }

      - testo: "Portare Orvald a vedere la fontana"
        descrizione: "Il preside non scende in Città Bassa da anni. Una mattina in fila gli spiegherebbe tutto meglio di un rapporto."
        prova: { attributo: sociale, abilita: persuasione, difficolta: Media }
        successo:
          titolo: In fila
          testo: |
            Convinci Orvald a scendere in Via del Salmone all'alba, con Pett
            sulla spalla e un cappello che nessuno gli aveva mai visto. Si mette
            in fila dietro una donna con due brocche e aspetta il suo turno senza
            dire chi è. Quando il getto si ferma, a metà mattina, tira fuori la
            mappa delle fontane e ci scrive l'ora. Poi va a parlare con la madre
            di Lucio. Il ragazzino resta all'Accademia, e da quel giorno l'acqua
            per casa sua la porta un carretto dell'Accademia. Sulla via del
            ritorno Orvald ti chiama assistente, senza chiederti se ti va.
          pe: { persuasione: 5 }
          imposta: { accademia.lucio: 3 }
          effetti: { fazione.accademia: 1, rep.accademia: 0.5, monete: 5, nomea.citta-bassa: 0.5 }
        fallimento:
          titolo: Il preside non scende
          testo: |
            Orvald ti ascolta e poi dice che ha lezione. Dice che la Città Bassa la conosce bene e che le fontane le misura dalla mappa. Ti accorgi troppo
            tardi che gliel'hai chiesto come si chiede un favore, e lui i favori
            li fa solo a Tobol. Puoi riprovare un altro giorno, con un argomento
            migliore.

            {persuasione Media fallita} Gli hai parlato della madre di Lucio. Ti
            serviva parlargli della mappa, che è l'unica cosa che ascolta.
          effetti: { scandalo: 0.5 }

      - testo: "Far parlare i portatori d'acqua davanti a Orvald"
        descrizione: "I portatori di Via del Salmone li conosci da quando eri bambino. Se il preside li sente contrattare, capisce da solo."
        quando: [origine.figlio-della-citta-bassa >= 1]
        esito:
          titolo: Il prezzo dell'acqua
          testo: |
            Porti Orvald in Via del Salmone a metà mattina, quando il getto si
            è fermato, e chiami il portatore più vecchio per nome. Lui ti
            riconosce e ti fa il prezzo di quando eri bambino, che resta un
            prezzo da ladri. Orvald lo sente, guarda la vasca vuota e tira fuori
            la mappa delle fontane. Lucio resta all'Accademia, e l'acqua per
            casa sua la porta un carretto della scuola. Sulla via del ritorno
            Orvald ti chiama assistente.
          pe: { conoscenze-della-strada: 5 }
          imposta: { accademia.lucio: 3 }
          effetti: { fazione.accademia: 1, rep.accademia: 0.5, monete: 5, nomea.citta-bassa: 0.5 }

  # ------------------------------------------------------------ passo 3 · il registro degli uditori (grado 1)
  # La lite delle mappe (contenuti/citta/accademia.yaml) apre questa scena impostando accademia.tobol.
  - id: accademia-il-registro-degli-uditori
    presso: accademia-di-torvessa
    immagine: personaggi/orvald-temmerin
    titolo: Il registro degli uditori
    sommario: "Orvald Temmerin apre un registro rilegato in tela verde e intinge la penna. Il tuo nome ci sta, se lo vuoi."
    luogo: Accademia di Torvessa, lo studio del preside
    area: quartieri-alti
    requisiti: [fazione.accademia == 2, accademia.tobol >= 1]
    testo: |
      Il giorno dopo la lite Tobol è tornato con una cravatta nuova, gialla a
      righe viola, e Orvald ha fatto finta di non vederla per tutta la
      mattina. Adesso lo studio è tranquillo. Orvald apre un registro
      rilegato in tela verde, con *uditori* scritto sul dorso, e intinge la
      penna. Le pagine sono piene di nomi con accanto una data, e alcuni
      hanno una croce piccola, quelli che non sono più tornati.

      «Chi sta su questo registro segue le lezioni che vuole e gira per le
      aule senza che il bidello gli chieda chi è» dice. «Le mie lezioni le
      paga a metà, perché il preside sono io. In cambio, quando torno al
      Gradone, mi servirà qualcuno che sappia tenere una corda e la bocca
      chiusa.» Scrive il tuo nome con la grafia stretta e soffia
      sull'inchiostro. «Il Gradone lo sai, ormai. Il perché te lo dico
      quando serve.»

      {politica-ed-economia Media} Le lezioni a metà prezzo le paga lui di
      tasca sua, e Querci lo sa. Un preside che fa sconti è un preside che
      vuole qualcosa.

      Sulla scrivania ci sono un cristallo d'aula su un anello d'ottone e una
      lente da tasca chiusa come un orologio, che Tobol ha lasciato lì
      uscendo, con un biglietto. Pett li guarda tutti e due con molto
      interesse.

      {magia Facile fallita} Il cristallo d'aula ti sembra un sasso grazioso.
      Agli altri, a quanto pare, sembra qualcosa di più.
    opzioni:
      - testo: "Chiedere le sere di Besk"
        descrizione: "Non hai mai sentito un cristallo rispondere. Besk fa sedute di studio al tavolo di cucina, e per un uditore dell'Accademia non le fa pagare."
        quando: [magia == 0]
        esito:
          titolo: Tre sere al tavolo di cucina
          testo: |
            Orvald scrive due righe per Besk sul retro del biglietto di Tobol e
            ti mette in mano il cristallo d'aula. Per tre sere ti siedi al
            tavolo di cucina della Locanda di Ilka, fra le bruciature degli
            allievi di prima, e respiri come ti dice Besk. La terza sera il
            cristallo si scalda sotto le dita e una venatura si accende
            d'azzurro, e Ilka dal suo angolo dice che la stanza è diventata più
            fredda. Besk scrive una riga sul quaderno e ti stringe la mano come
            a un collega.
          pe: { magia: 20 }
          almeno: { rep.accademia: 2 }
          effetti: { fazione.accademia: 1, monete: 30, oggetto.accademia-cristallo-d-aula: 1 }

      - testo: "Prendere il cristallo d'aula e la lezione dello scudo"
        descrizione: "Orvald insegna la difesa prima dell'attacco. Per un uditore, la prima lezione la offre lui."
        quando: [magia >= 1, incantesimo.scudo-arcano == 0]
        esito:
          titolo: La mela morsicata
          testo: |
            Orvald ti tira addosso quello che trova sulla scrivania, la mela
            morsicata per prima e il libro per ultimo, mentre tu tieni le mani alzate. La lamina regge anche al libro,
            che cade sul pavimento a un palmo dalla tua faccia, e Pett fa il suo
            verso che somiglia a una risata. Poi Orvald ti infila al dito
            l'anello del cristallo d'aula. «Questo l'hanno consumato trenta allievi prima di te, quindi consumalo anche tu» dice.
          pe: { magia: 3 }
          almeno: { rep.accademia: 2 }
          effetti: { fazione.accademia: 1, monete: 30, oggetto.accademia-cristallo-d-aula: 1, incantesimo.scudo-arcano: 1 }

      - testo: "Prendere il cristallo d'aula e la lezione del sussurro"
        descrizione: "Una formula che si dice a bocca chiusa. Orvald la insegna di solito a poco, oggi gratis."
        quando: [magia >= 1, incantesimo.sussurro-di-paura == 0]
        esito:
          titolo: Dietro le mappe
          testo: |
            Provi la formula su Pett, perché Orvald dice che il corvo ci è abituato da anni. Pett arruffa le penne e va a nascondersi dietro una pila
            di mappe, da dove ti guarda con un occhio solo e molto rancore.
            Orvald ti infila al dito l'anello del cristallo d'aula e ti ricorda che al corvo, da adesso in avanti, devi delle noci.
          pe: { magia: 3 }
          almeno: { rep.accademia: 2 }
          effetti: { fazione.accademia: 1, monete: 30, oggetto.accademia-cristallo-d-aula: 1, incantesimo.sussurro-di-paura: 1 }

      - testo: "Prendere il cristallo d'aula"
        descrizione: "Un cristallo consumato da trenta allievi. Chi lo porta sente il Mana un poco prima degli altri."
        quando: [magia >= 1]
        esito:
          titolo: Trenta allievi
          testo: |
            Orvald ti infila al dito l'anello d'ottone del cristallo d'aula e
            ti fa sentire, con la punta di un dito, il bordo consumato dove
            trenta allievi prima di te hanno cercato la venatura. Il cristallo
            si scalda appena, e a te sembra un saluto.
          pe: { magia: 5 }
          almeno: { rep.accademia: 2 }
          effetti: { fazione.accademia: 1, monete: 30, oggetto.accademia-cristallo-d-aula: 1 }

      - testo: "Prendere la lente di Tobol"
        descrizione: "Sul biglietto c'è scritto *per chi ha guardato la mappa invece di guardare noi*. È la lente di riserva di Tobol."
        immagine: personaggi/tobol-aspern
        esito:
          titolo: Il biglietto di Tobol
          testo: |
            Apri la lente e la carta della scrivania ti salta incontro, con
            ogni fibra al suo posto e la macchia di tè della mappa del Gradone
            grande come un lago. Il biglietto di Tobol dice che ne ha sei, e che
            questa è quella di riserva, quindi la puoi rompere. Orvald brontola
            che Tobol regala sempre le cose degli altri, ma la lente era
            davvero sua.
          pe: { percezione: 5 }
          almeno: { rep.accademia: 2 }
          effetti: { fazione.accademia: 1, monete: 30, oggetto.accademia-lente-da-tasca: 1 }

  # ------------------------------------------------------------ passo 4 · la Vecchia
  - id: accademia-la-vecchia
    presso: accademia-di-torvessa
    immagine: ambientazione/cristalli-conduttori
    titolo: La Vecchia
    sommario: "È lunedì sera, e il seminterrato è di Orvald. Stasera ti porta oltre la collezione, dietro una porta di ferro che non hai mai visto aperta."
    luogo: Accademia di Torvessa, oltre il seminterrato
    area: quartieri-alti
    requisiti: [fazione.accademia == 3, accademia.camera == 0]
    testo: |
      Il lunedì sera il seminterrato è di Orvald, e stasera ci scendi con lui.
      Passate la collezione senza fermarvi, fra le lame oliate e i teschi con
      i cartellini, fino al bersaglio di lyssan in fondo. Dietro il bersaglio
      c'è una seconda porta di ferro, più vecchia della prima, e dietro la
      porta una scala a chiocciola che scende nel buio umido. L'aria sa di
      pietra bagnata e di qualcosa di metallico e dolce.

      Sotto c'è una cisterna rotonda dei Precursori, con i canali di pietra
      che girano lungo le pareti e l'acqua del Torvessa che ci sale dentro da
      sola, senza bisogno di ruote o di pompe. Al centro, su un supporto di lyssan, c'è un
      cristallo alto come due uomini, attraversato da venature azzurre che si
      accendono e si spengono. Due brevi e una lunga.

      {magia Media} Ti arriva nei denti prima che nelle orecchie. È un battito lento e grande che fa vibrare l'acqua dei canali. Il Mana lì dentro è
      tanto, e si muove come una bestia stanca.

      Accanto al cristallo, a un tavolo con un registro e una clessidra, c'è
      una donna sui sessant'anni con i guanti di pelle e i capelli grigi
      raccolti in una crocchia. Conta sottovoce. «Agnese Lunardi, maestra di
      laboratorio» dice Orvald. «Qui sotto la chiamiamo Regolatrice.» Alle
      sue spalle un uomo magro con due manicotti di tela nera sulle maniche
      tiene un altro registro e non si presenta, perché lo sanno tutti che è Ermanno Querci, il tesoriere.

      «Questa è la Vecchia» dice Agnese, senza smettere di contare. «Tiene
      l'acqua alla città da dieci anni. Basta fino al prossimo inverno, se
      nessuno la fa arrabbiare.»

      {origine allievo-di-torvessa} Fra gli allievi gira da sempre la storia
      della porta di ferro dietro il bersaglio, quella che dà sull'acqua. Al
      primo anno ci credevi. Al terzo facevi finta di non crederci più.
    opzioni:
      - testo: "Sentire la carica della Vecchia"
        descrizione: "Agnese ti lascia appoggiare la mano sul supporto di lyssan. Il cristallo dice quanto gli resta a chi lo sa ascoltare."
        requisiti: [magia >= 1]
        prova: { attributo: mentale, abilita: magia, difficolta: Media }
        successo:
          titolo: Il fondo del pozzo
          testo: |
            Appoggi la mano sul lyssan, e il battito della Vecchia ti sale
            lungo il braccio. Dentro c'è molto Mana, e sotto il Mana c'è un
            fondo che si vede, come si vede il fondo di un pozzo d'estate.
            Agnese ti guarda la faccia e annuisce lentamente. «Adesso lo sai anche tu» dice, rimettendo a posto la clessidra. «Era meglio quando lo sapevamo in tre.»
          pe: { magia: 5 }
          imposta: { accademia.camera: 1 }
          effetti: { rep.accademia: 0.5 }
        fallimento:
          titolo: Il colpo
          testo: |
            Appoggi la mano sul lyssan, e il battito ti arriva tutto in una
            volta, fino alla nuca. Ti ritrovi seduto sul pavimento bagnato con
            Agnese che ti tiene la testa e ti conta i battiti al polso come
            conta quelli del cristallo. Quanto gli resta l'ha detto lei, e devi
            fidarti.
          imposta: { accademia.camera: 1 }
          effetti: { tormento: 1 }

      - testo: "Leggere i registri di Agnese"
        descrizione: "Ogni turno ha la sua riga, da dieci anni. In una colonna c'è la carica che il cristallo consuma."
        prova: { attributo: mentale, abilita: [accademiche, politica-ed-economia], difficolta: Media }
        successo:
          titolo: La colonna che raddoppia
          testo: |
            I registri sono dieci, uno per ogni anno di turni, e la colonna del consumo è
            sempre uguale fino all'estate scorsa. Dal giorno del Festival in poi
            i numeri raddoppiano, e in certe notti triplicano. Lo fai notare a
            voce alta. Querci chiude il suo registro e dice che lui l'aveva detto in consiglio già a marzo, e nessuno l'aveva ascoltato.
          pe: { accademiche: 5 }
          imposta: { accademia.camera: 1 }
          effetti: { rep.accademia: 0.5 }
        fallimento:
          titolo: La grafia di Agnese
          testo: |
            La grafia di Agnese è minuta e piena di abbreviazioni sue, e dopo il
            terzo registro ti si incrociano gli occhi. Le chiedi che cosa vuol
            dire un segno, e lei te lo spiega piano, nello stesso modo in cui lo spiega agli allievi del primo anno.
          imposta: { accademia.camera: 1 }
          effetti: { tormento: 1 }

      - testo: "Guardare le mani di Agnese"
        descrizione: "Porta i guanti anche qui sotto, dove fa freddo d'estate e d'inverno. Ogni tanto se li toglie per scrivere."
        prova: { attributo: mentale, abilita: medicina, difficolta: Facile }
        successo:
          titolo: I tremori
          testo: |
            Quando si toglie il guanto destro per scrivere, la mano di Agnese
            trema appena, a scatti regolari. È il tremore di chi lavora troppo
            a lungo accanto a un cristallo grande, quello che i maestri chiamano
            Dissonanza e i medici non sanno curare. Lei se ne accorge e si
            rimette il guanto senza fretta. «Sono otto anni che scendo qui» dice, lisciandosi il cuoio sulle dita. «Le mani se li ricordano tutti.»
          pe: { medicina: 5 }
          imposta: { accademia.camera: 1 }
          effetti: { rep.accademia: 0.5 }
        fallimento:
          titolo: I guanti
          testo: |
            Agnese i guanti non se li toglie nemmeno per scrivere. Dopo un po' si accorge che glieli guardi. Si volta dall'altra parte e
            continua a contare, e per tutta la sera ti parla soltanto di numeri.
          imposta: { accademia.camera: 1 }
          effetti: { tormento: 1 }

      - testo: "Reggere il battito della cisterna"
        descrizione: "Quaggiù il battito della Vecchia rimbomba nelle pareti. Restare in piedi e ascoltare è già una prova."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Media }
        successo:
          titolo: In piedi
          testo: |
            Resti in piedi al bordo del canale mentre il battito ti passa
            attraverso, e a poco a poco smetti di aspettarlo. Lo ascolti come
            si ascolta il mare di notte. Dopo un'ora Agnese ti mette in mano la clessidra. «Il prossimo giro lo conti tu, così vedo se reggi» dice.
          pe: { resilienza: 5 }
          imposta: { accademia.camera: 1 }
          effetti: { rep.accademia: 0.5 }
        fallimento:
          titolo: Il secchio
          testo: |
            Al decimo battito ti piega in due un conato, e Querci ti allunga un secchio che evidentemente tiene lì apposta. Risali la scala a
            chiocciola appoggiato al muro, e per tutta la notte sogni l'acqua
            che sale nei canali.
          imposta: { accademia.camera: 1 }
          effetti: { tormento: 1 }

      - testo: "Dire ad Agnese che la porta di ferro, fra gli allievi, si chiama la porta dell'acqua"
        descrizione: "Una leggenda degli allievi che era vera. Forse ad Agnese fa piacere saperlo."
        quando: [origine.allievo-di-torvessa >= 1]
        esito:
          titolo: La porta dell'acqua
          testo: |
            Glielo dici, e Agnese smette di contare per la prima volta da quando
            sei sceso. Ride piano, con un suono arrugginito. «La porta
            dell'acqua» ripete. «Allora gli allievi ne sanno più del consiglio.»
            Ti fa sedere al tavolo dei Regolatori e ti mostra dove guardare sul
            registro, come ti mostrava al laboratorio dove mettere le dita.
          pe: { accademiche: 5 }
          imposta: { accademia.camera: 1 }
          effetti: { rep.accademia: 0.5 }

  - id: accademia-il-giuramento
    presso: accademia-di-torvessa
    immagine: personaggi/orvald-temmerin
    titolo: Il giuramento
    sommario: "Orvald Temmerin ti chiede di non parlare della Vecchia con nessuno. Querci tiene già la penna in mano."
    luogo: Accademia di Torvessa, la Camera della Condotta
    area: quartieri-alti
    requisiti: [fazione.accademia == 3, accademia.camera >= 1]
    testo: |
      Prima di risalire Orvald ti trattiene accanto al tavolo dei Regolatori.
      La Vecchia continua a battere alle sue spalle, e l'acqua dei canali
      trema a ogni colpo. Querci ha aperto il suo registro a una pagina
      bianca e tiene la penna sospesa.

      «Se la città sapesse che la sua acqua dipende da un cristallo che si
      sta spegnendo, domattina ogni famiglia con un cristallo grande lo
      chiuderebbe in cantina con due guardie davanti» dice Orvald. «Le
      comunità si sono già sbranate una volta per i conduttori. Si chiama
      Guerra del Cristallo, e nei libri occupa più pagine di quante ne
      meriti.» Si passa la mano sulla barba corta. «Quindi ti chiedo il
      silenzio. Lo chiedo a tutti quelli che scendono quaggiù, e finora l'hanno
      dato tutti.»

      {politica-ed-economia Media} Un cristallo grande in città vale quanto
      una casa nei Quartieri Alti. Se si sapesse, la Gilda alzerebbe i prezzi
      la sera stessa, e lo farebbe con le migliori intenzioni.

      Agnese ha smesso di contare e ti guarda, con le mani guantate
      intrecciate sul registro.

      {empatia Media} Orvald ha già deciso che giurerai, e se non lo fai gli
      dispiace per te prima che per sé. Querci invece spera che tu rifiuti,
      per avere ragione su qualcosa.
    opzioni:
      - testo: "Giurare"
        descrizione: "Una firma sul registro di Querci e la parola data a Orvald. Della Vecchia, fuori di qui, non parli."
        esito:
          titolo: La firma
          testo: |
            Firmi sul registro di Querci, che controlla la firma due volte, e
            stringi la mano a Orvald. Lui la tiene un momento più del solito.
            «Il piano è semplice da dire e difficile da fare» dice, mentre
            risalite la scala. «La Vecchia viene dal Gradone Rosso. Io e un amico
            l'abbiamo staccata dal suo nucleo trent'anni fa. Se la riattacco, si
            ricarica da sola.» In cima alla scala si ferma. «Querci ti farà
            notare che per stasera non ti paga nessuno.» Querci, dietro di voi,
            lo fa notare.
          pe: { resilienza: 5 }
          imposta: { accademia.giuramento: 1 }
          effetti: { fazione.accademia: 1, rep.accademia: 1 }

      - testo: "Rifiutare di giurare"
        descrizione: "Un segreto sull'acqua della città non è dell'Accademia. Puoi tacere lo stesso, ma senza firmare."
        esito:
          titolo: La pagina bianca
          testo: |
            Dici che starai zitto finché ti sembrerà giusto, e che una firma non
            cambia niente. Querci chiude il registro sulla pagina bianca con un
            colpo secco. Orvald ci pensa a lungo, poi dice che gli va bene, e
            che d'ora in poi Querci ti terrà d'occhio perché è il suo mestiere.
            Mentre risalite ti spiega il piano lo stesso. La Vecchia viene dal
            Gradone Rosso, e lui vuole riattaccarla al nucleo da cui l'ha
            staccata trent'anni fa.
          pe: { persuasione: 5 }
          imposta: { accademia.giuramento: 2 }
          effetti: { fazione.accademia: 1, rep.accademia: 0.5 }

      - testo: "Giurare e chiedere a Querci quanto costa una Vecchia nuova"
        descrizione: "Il tesoriere sa i conti meglio di chiunque. Se glieli chiedi nel modo giusto, te li dice per sfogarsi."
        prova: { attributo: mentale, abilita: politica-ed-economia, difficolta: Media }
        successo:
          titolo: Il conto di Querci
          testo: |
            Firmi, e poi chiedi a Querci quanto costerebbe sostituire la Vecchia.
            Il tesoriere si illumina come non l'hai mai visto. Ti spiega che un cristallo così grande si va a prendere, perché in vendita non ce n'è. Se ne trovano soltanto a Darn-Morakh, e una spedizione laggiù costa quanto tre anni di Accademia. Le licenze sul grano di Julia Castaldi,
            ti dice abbassando la voce, servono anche a questo. Orvald ti
            ascolta dalla scala, e quando lo raggiungi ti spiega il suo piano,
            che costa molto meno. La Vecchia viene dal Gradone Rosso, e lui
            vuole riattaccarla al suo nucleo.
          pe: { politica-ed-economia: 5 }
          imposta: { accademia.giuramento: 1 }
          effetti: { fazione.accademia: 1, rep.accademia: 1, informazioni.pettegolezzo: 1 }
        fallimento:
          titolo: Il registro chiuso
          testo: |
            Firmi, e poi chiedi a Querci quanto costerebbe una Vecchia nuova. Lo
            chiedi male, come si chiede il prezzo del pesce, e Querci ti
            risponde che non sono affari di un uditore. Orvald, sulla scala, ti
            spiega il piano lui. La Vecchia viene dal Gradone Rosso, e lui vuole
            riattaccarla al nucleo da cui l'ha staccata trent'anni fa.
          imposta: { accademia.giuramento: 1 }
          effetti: { fazione.accademia: 1, rep.accademia: 1, scandalo: 0.5 }

  # ------------------------------------------------------------ passo 5 · il diario del centoventi
  - id: accademia-il-diario-del-centoventi
    presso: accademia-di-torvessa
    immagine: personaggi/orvald-temmerin
    titolo: Il diario del centoventi
    sommario: "Per tornare al Gradone Rosso servono le iscrizioni copiate allora e una corda buona, e prima di tutto una strada. Orvald ha soltanto il diario, e mancano delle pagine."
    luogo: Accademia di Torvessa, lo studio del preside
    area: quartieri-alti
    requisiti: [fazione.accademia == 4]
    testo: |
      Sulla scrivania di Orvald c'è un diario rilegato in cuoio, gonfio di
      umidità, con *centoventi* inciso sulla copertina. Lo apre a una pagina
      con un disegno a penna. È la Vecchia, spenta, distesa di traverso in
      una sala rotonda, con due figure piccole accanto per dare la misura.

      «Io e Severo Dalmas l'abbiamo trovata così» dice. «Era spenta e l'abbiamo
      staccata dal suo supporto, che era un nucleo di pietra nera, e l'abbiamo
      portata in città su un carro con sei muli. Per vent'anni è stata in un
      magazzino. Poi, nel centoquaranta, la condotta di prima ha ceduto, e
      Severo l'ha svegliata con una formula sua.» Gira le pagine fino a una
      cucitura vuota. «Le pagine di quell'anno non ci sono più. Severo se n'è
      andato due anni dopo, e il resto del diario non l'ho mai voluto
      leggere.»

      {accademiche Media} La cucitura è stata tagliata con un temperino, di
      netto. Chi l'ha fatto sapeva quali pagine voleva.

      Elenca sulle dita quello che serve. Le iscrizioni della sala, che lui
      copiò allora e diede alla Biblioteca. Una corda e un'attrezzatura da
      Raschiatori, perché la sua è marcita in cantina. E la strada, visto che
      Tobol dice che il sentiero non c'è più.

      {resistenza Facile} Pensi alla scarpata da risalire con la corda in spalla, e le spalle ti fanno male prima ancora di partire.

      *Una formula sua. Lo dice come si dice di una ricetta di famiglia.* Orvald chiude il diario e ci appoggia sopra il palmo.
    opzioni:
      - testo: "Leggere i calchi delle iscrizioni con Mattias Crenn"
        descrizione: "In Biblioteca ci sono i calchi che Orvald consegnò trent'anni fa. Mattias li sa trovare, leggerli è un'altra faccenda."
        immagine: personaggi/mattias-crenn
        quando: [accademia.calchi == 0]
        prova: { attributo: mentale, abilita: accademiche, difficolta: Media }
        successo:
          titolo: I calchi
          testo: |
            Mattias trova i calchi in un cassetto che nessuno apriva da
            vent'anni, fogli di carta grossa con le iscrizioni ripassate a
            carboncino. Ci passate un pomeriggio intero, lui legge ad alta voce e tu confronti i segni, finché le incisioni della sala rotonda non hanno un
            ordine. Alcune indicano le porte, altre le soglie da non passare.
            Mattias ti fa una copia in bella e ti chiede di riportargliela
            intera.
          pe: { accademiche: 5 }
          imposta: { accademia.calchi: 1 }
          effetti: { accademia.preparativi: 1 }
        fallimento:
          titolo: Il carboncino
          testo: |
            I calchi sono sbiaditi, e a forza di confrontarli ti ritrovi le
            dita nere di carboncino e le iscrizioni ancora mescolate. Mattias ti
            dice di tornare quando ha trovato il secondo cassetto, che è in un
            altro piano e forse in un'altra ala.
          effetti: { tormento: 0.5 }

      - testo: "Ricopiare la strada con Tobol"
        descrizione: "Tobol ha la mappa nuova del Gradone, quella con la frana. Gli serve una copia, e qualcuno che non sbagli le quote."
        immagine: personaggi/tobol-aspern
        quando: [accademia.strada == 0]
        prova: { attributo: mentale, abilita: percezione, difficolta: Facile }
        successo:
          titolo: Le quote
          testo: |
            Ricopi la mappa di Tobol curvo sul suo tavolo, con Whisp che ti
            cammina sul polso e la lente di Tobol a portata di mano. Ogni quota
            al suo posto, la frana segnata a tratteggio, il giro largo per
            evitarla. Tobol confronta le due mappe e ti paga la copia, perché
            dice che anche gli amici si pagano, soprattutto quelli che non
            sbagliano.
          pe: { percezione: 5 }
          imposta: { accademia.strada: 1 }
          effetti: { accademia.preparativi: 1, monete: 5 }
        fallimento:
          titolo: La quota sbagliata
          testo: |
            Sbagli una quota, e la frana sulla tua copia finisce in mezzo al
            fiume. Tobol se ne accorge al primo sguardo e ti fa ricominciare da capo, con un'allegria che non ha nessuna fretta.
          effetti: { tormento: 0.5 }

      - testo: "Farsi dare l'attrezzatura da Dragna Gro-Malog"
        descrizione: "Al Grifone di Ferro la capo squadra dei Raschiatori presta corde e imbraghi a chi sa chiederli nel modo giusto."
        immagine: personaggi/dragna-gro-malog
        quando: [accademia.attrezzi == 0]
        prova: { attributo: sociale, abilita: persuasione, difficolta: Media }
        successo:
          titolo: Le corde di Dragna
          testo: |
            Dragna ti ascolta con le braccia incrociate e poi ti fa ripetere il
            nome del Gradone. Ti presta due corde e un imbrago, più una lampada da piattaforma, e ti avverte che se torni senza le corde le paghi come
            nuove. «E di' al preside che l'arenaria non tiene i chiodi» aggiunge, contando le corde con il pollice. «Lo sa, ma se lo dimentica sempre.»
          pe: { persuasione: 5 }
          imposta: { accademia.attrezzi: 1 }
          effetti: { accademia.preparativi: 1 }
        fallimento:
          titolo: Il nome sbagliato
          testo: |
            Chiedi le corde a Dragna come si chiede un favore, e lei ti risponde
            che i favori li fa ai suoi. Ti consiglia di tornare quando avrai
            sudato su una piattaforma almeno una volta.
          effetti: { scandalo: 0.5 }

      - testo: "Prendere l'attrezzatura dei Raschiatori da amico"
        descrizione: "Ai Raschiatori ormai sei noto. Le corde te le prestano senza discutere."
        immagine: personaggi/dragna-gro-malog
        quando: [accademia.attrezzi == 0]
        requisiti: [rep.raschiatori >= 3]
        esito:
          titolo: Fra amici
          testo: |
            Dragna ti vede entrare e ti lancia un rotolo di corda prima che tu
            apra bocca. Poi aggiunge un imbrago e una lampada da piattaforma, e
            ti avverte che l'arenaria del Gradone non tiene i chiodi.
          pe: { atletica: 3 }
          imposta: { accademia.attrezzi: 1 }
          effetti: { accademia.preparativi: 1 }

      - testo: "Aiutare Orvald a fare i bagagli"
        descrizione: "Tre giorni a rammendare tende vecchie e a ungere fibbie, un lavoro che chiunque può fare."
        quando: [accademia.preparativi < 2]
        costo: 2
        esito:
          titolo: Le tende del centoventi
          testo: |
            Passi tre giorni in cantina con Orvald a tirare fuori le tende del vecchio scavo e a rammendarle, e poi a ungere le fibbie di cuoio una per una. Lui ti
            racconta del Gradone mentre lavora, e da come ne parla capisci dove
            stava la tenda di Severo, lontano dalla sua. Alla fine avete due
            tende che tengono e un sacco di cose che non servivano.
          pe: { resistenza: 2 }
          effetti: { accademia.preparativi: 1 }

      - testo: "Prendere le corde della tua squadra"
        descrizione: "Le corde della tua squadra le conosci nodo per nodo. Basta chiederle al magazzino del Grifone."
        quando: [origine.apprendista-raschiatore >= 1, accademia.attrezzi == 0]
        esito:
          titolo: Le corde di casa
          testo: |
            Al magazzino del Grifone il ragazzo di turno ti riconosce e ti
            lascia scegliere. Prendi le corde della tua squadra, quelle con il nodo rosso alle estremità, e ci aggiungi un imbrago con una lampada da piattaforma.
            Dragna, dal tavolo, alza il boccale verso di te senza chiedere dove
            vai.
          pe: { atletica: 3 }
          imposta: { accademia.attrezzi: 1 }
          effetti: { accademia.preparativi: 1 }

      - testo: "Partire per il Gradone Rosso"
        descrizione: "La strada del Gradone parte dalla Superficie Fratturata, a monte del Torvessa. Orvald è pronto da trent'anni."
        requisiti: [accademia.preparativi >= 2]
        esito:
          titolo: Il carro
          testo: |
            Orvald noleggia un carro con un mulo solo, perché sei erano per
            portare la Vecchia, e due per tornare a vederla gli sembrano uno
            spreco. Besk sale dietro con i quaderni. Lasciate la città dalla
            Superficie Fratturata e risalite il Torvessa per un giorno, finché
            l'arenaria rossa del Gradone non vi riempie l'orizzonte. Orvald la
            guarda in silenzio, con la piccozza sulle ginocchia.
          pe: { accademiche: 3 }
          effetti: { fazione.accademia: 1, rep.accademia: 0.5 }
