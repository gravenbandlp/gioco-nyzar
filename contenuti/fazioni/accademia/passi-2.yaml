# «Il cerchio aperto», passi 7, 8, 10 e 11 (fazione.accademia da 6 a 11). Il passo 6 è la spedizione del Gradone
# Rosso (spedizione-gradone.yaml), il passo 9 la cattedra (contenuti/citta/accademia.yaml); qui c'è soltanto la
# variante del passo 9 per chi aveva già la cattedra prima della quest (accademia.cattedra >= 1).
# 7 La stanza di Dalmas: aprire la porta (accademia.stanza), poi i quaderni e la formula (accademia.formula) e la
#   scelta su Agnese (accademia.agnese 1 detto a Orvald, 2 taciuto). Con pista.tribu >= 4 le pergamene della torre
#   della Palude sono già sulla scrivania e la formula si ricostruisce più facilmente.
# 8 La lingua delle macchine: Ambrin al Nodo, Ilka alla locanda o Mattias in Biblioteca (accademia.lingua), poi la
#   risposta: con il congegno di controllo di Capomozzo il disco vibra sulla stessa sequenza, senza resta ignota.
# 10 L'acqua in Consiglio: il Municipio a porte chiuse (accademia.consiglio 1 autorizzato, 2 la notizia esce).
#   L'offerta della Gilda la porta Ottone Malgrani fino a pista.pelle < 7, poi Tarquin Cordani. Dopo la seduta l'uomo della
#   Casa dei Nodi propone di riferire (accademia.spia, scena facoltativa fino al passo 13).
# 11 La colletta dei cristalli: accademia.carica fino a 3, il furto (accademia.furto), il giunto.
storylet:
  # ------------------------------------------------------------ passo 7 · la stanza di Dalmas
  - id: accademia-la-stanza-di-dalmas
    presso: accademia-di-torvessa
    immagine: ambientazione/accademia-di-torvessa
    titolo: La stanza di Dalmas
    sommario: "Severo Dalmas ha svegliato la Vecchia con una formula sua e poi se n'è andato. La sua stanza nella torretta è chiusa da allora."
    luogo: Accademia di Torvessa, la torretta
    area: quartieri-alti
    requisiti: [fazione.accademia == 6, accademia.stanza == 0]
    testo: |
      La torretta dell'Accademia è un cilindro di pietra con una scala che gira contro il muro, e i gradini
      sono più consumati in basso che in cima. L'ultima porta in cima ha la vernice verde scrostata e una
      serratura di Mana dei Precursori, un disco d'ottone con sette solchi e senza buco per la chiave. Dove la
      vernice si è staccata il legno è secco e pieno di forellini di tarlo. L'ottone del disco, sotto la
      polvere, non ha nemmeno un punto verde. Sul pianerottolo c'è uno sgabello coperto di polvere.

      Orvald si ferma due gradini sotto. «Severo se n'è andato due anni dopo aver svegliato la Vecchia» dice.
      «Diceva che la sentiva anche nel sonno. Ha chiuso la porta, mi ha lasciato le chiavi del laboratorio e
      non ho più saputo niente. In otto anni non l'ho mai aperta, e dopo il Gradone so che avrei dovuto farlo
      il giorno stesso.»

      {origine allievo-di-torvessa} Al primo anno vi sfidavate a toccare di notte la porta verde del maestro
      andato via, e tu l'hai sfiorata con un dito prima di scappare.

      Pett è salito con voi e passeggia sullo sgabello fino a un angolo preciso, lasciando nella polvere una
      fila di impronte sottili. Lì si ferma e ti guarda.
    opzioni:
      - testo: "Aprire con il Sigillo"
        descrizione: "Il Sigillo chiude le serrature di Mana, e chi lo sa chiudere le sa anche aprire."
        incantesimo: sigillo
        prova: { attributo: mentale, abilita: magia, difficolta: Media }
        successo:
          titolo: Sette solchi
          testo: |
            Appoggi il palmo sul disco e fai scorrere il Mana dentro i solchi al contrario, come si riavvolge
            un filo. L'ottone resta freddo sotto la mano anche quando il Mana ci corre dentro. Al settimo
            solco il disco gira da solo con un rumore di ingranaggio ben oliato, e la porta verde si apre
            verso l'interno. Dalla stanza esce un odore di carta vecchia e di gesso.
          pe: { magia: 4 }
          imposta: { accademia.stanza: 1 }
        fallimento:
          titolo: Il ritorno
          testo: |
            Il disco ti rimanda indietro il Mana tutto insieme, e ti ritrovi sedut{o|a} sul pianerottolo con
            il braccio intorpidito fino alla spalla e le dita che non si chiudono. Orvald ti aiuta a rialzarti
            e dice che Severo le serrature le faceva bene, purtroppo.
          effetti: { tormento: 1 }

      - testo: "Leggere i solchi nella polvere"
        descrizione: "La polvere nei solchi dice in che ordine il Mana ci è passato l'ultima volta. Bisogna leggerla senza soffiarci sopra."
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Difficile }
        successo:
          titolo: L'ordine della polvere
          testo: |
            Ti chini sul disco con la lanterna di traverso perché la luce radente faccia ombra nei solchi.
            Guardi la polvere finché non vedi dove è più sottile. Tocchi i solchi nell'ordine, dal più pulito
            al più sporco, con il polso appoggiato al bordo. Al settimo la serratura scatta, e Orvald, dietro
            di te, batte le mani una volta sola.
          pe: { tecnologia: 6 }
          imposta: { accademia.stanza: 1 }
        fallimento:
          titolo: Il solco sbagliato
          testo: |
            Al quarto solco il disco si scalda e torna alla posizione di partenza con uno scatto secco. Ti
            brucia la punta delle dita, e il bruciore ti resta addosso fino a sera. Orvald ti dice di
            aspettare domani, quando la serratura si sarà calmata.
          effetti: { ferite: 0.5 }

      - testo: "Pagare Pett per quello che sa"
        descrizione: "Il corvo si è fermato in un angolo dello sgabello. Una noce e un po' di pazienza potrebbero bastare."
        immagine: personaggi/orvald-temmerin
        prova: { attributo: sociale, abilita: addestrare-animali, difficolta: Media }
        successo:
          titolo: La chiave sotto lo sgabello
          testo: |
            Offri a Pett una noce, poi un'altra. Alla terza il corvo scende dallo sgabello, ci infila il becco
            sotto e tira fuori una chiave d'ottone con un dischetto di cristallo al posto dell'impugnatura,
            grigia della stessa polvere del pianerottolo. Orvald la riconosce e impallidisce. È la chiave di
            Severo, e Pett l'ha tenuta lì per otto anni senza dirlo a nessuno. Il dischetto appoggiato sul
            disco apre la porta al primo tocco.
          pe: { addestrare-animali: 5 }
          imposta: { accademia.stanza: 1 }
        fallimento:
          titolo: Le noci di Pett
          testo: |
            Pett si mangia le noci una alla volta e le tiene ferme con la zampa sul legno dello sgabello. Poi
            si mette a dormire proprio lì, sopra quello che sa. Orvald dice che con lui ci prova da anni, e
            che il corvo i suoi segreti li vende cari.

      - testo: "Aspettare Agnese, che ha una chiave per tutto"
        descrizione: "La maestra di laboratorio ha un mazzo di chiavi al collo. Forse fra quelle c'è anche questa."
        costo: 2
        esito:
          titolo: La chiave al collo
          testo: |
            Agnese arriva dopo il suo turno, con i guanti ancora umidi, e quando vede la porta si ferma sul
            gradino. Poi sfila dal collo una cordicella con una chiave d'ottone e un dischetto di cristallo al
            posto dell'impugnatura, la appoggia sul disco e la porta si apre senza un rumore. Orvald la guarda
            a lungo senza chiederle niente. Lei si rimette la chiave sotto il colletto e scende senza
            salutare.
          pe: { empatia: 3 }
          imposta: { accademia.stanza: 1 }

  - id: accademia-i-quaderni-di-dalmas
    presso: accademia-di-torvessa
    immagine: ambientazione/accademia-di-torvessa
    titolo: I quaderni di Dalmas
    sommario: "La stanza di Severo Dalmas è rimasta com'era. Sulle pareti ci sono i gessi della sua formula, e sul tavolo i quaderni."
    luogo: Accademia di Torvessa, la stanza in cima alla torretta
    area: quartieri-alti
    requisiti: [fazione.accademia == 6, accademia.stanza >= 1]
    testo: |
      La stanza è piccola e piena di luce, perché nessuno ha mai tirato la tenda sulla Cicatrice. Le pareti
      sono coperte di segni di gesso sempre più fitti fino al soffitto, dove Severo doveva salire sulla sedia.
      In basso i segni sono larghi e distanziati. Più in alto il gesso è stato premuto tanto forte da lasciare
      solchi bianchi nell'intonaco. Sul tavolo ci sono una pila di quaderni neri e una tazza con il fondo di
      un tè seccato da otto anni, crepato come il letto di uno stagno d'estate.

      {accademiche Media} I segni sulle pareti hanno le stesse forme delle iscrizioni dei calchi del Gradone,
      in una lingua che all'Accademia compare solo nelle note a margine.

      Orvald resta sulla soglia con una mano sullo stipite, mentre Pett va dritto alla tazza.

      Accanto ai quaderni c'è un rettangolo senza polvere, grande come un registro, dove fino a poco fa
      qualcuno teneva un libro.

      {percezione Facile} Nella polvere del tavolo c'è il segno recente di un guanto di pelle dalle dita
      lunghe e sottili, con le cuciture dei polpastrelli ancora nitide.

      {origine figlio-del-circolo} Il vaso sul davanzale ha una pianta secca da anni, e ti accorgi che al
      Circolo avresti saputo dirne il nome dalle radici.
    opzioni:
      - testo: "Ricostruire la formula dai quaderni e dai gessi"
        descrizione: "I quaderni sono in ordine di data. I gessi sulle pareti sono le prove, e le prove sbagliate sono cancellate con una riga."
        quando: [accademia.formula == 0, pista.tribu < 4]
        prova: { attributo: mentale, abilita: accademiche, difficolta: Media }
        successo:
          titolo: La riga che resta
          testo: |
            Ci passi la giornata, con i quaderni aperti sul letto e il collo piegato all'indietro verso i
            gessi del soffitto. Le prove cancellate sono centinaia. Una sola riga, sopra la porta, non ha la
            riga sopra, e nel quaderno di quella data Severo ha scritto *questa risponde*. La ricopi lettera
            per lettera, e il gesso è così vecchio che si sbriciola se ci passi vicino con l'unghia. Non è una
            formula dell'Arte dei cristalli, e i segni sono della stessa famiglia delle formule che
            all'Accademia non si insegnano.
          pe: { accademiche: 6 }
          imposta: { accademia.formula: 1 }
          effetti: { informazioni.segreto: 1 }
        fallimento:
          titolo: Centinaia di righe
          testo: |
            A sera hai il collo rigido e cento righe ricopiate, e nessuna che torni. Orvald ti porta su una
            scodella di minestra, che si fredda accanto alla tazza di Severo. Ti dice di ricominciare domani
            dai quaderni, che Severo era più ordinato sulla carta che sui muri.
          effetti: { tormento: 0.5 }

      - testo: "Ricostruire la formula con le pergamene della torre"
        descrizione: "Sulla scrivania di Orvald ci sono le pergamene della torre della Palude Acquanera. Orvald ha già capito di chi erano."
        quando: [accademia.formula == 0, pista.tribu >= 4]
        prova: { attributo: mentale, abilita: accademiche, difficolta: Facile }
        successo:
          titolo: La torre della Palude
          testo: |
            Le pergamene della torre hanno la stessa grafia dei quaderni e gli stessi segni dei gessi in bella
            copia. Dai fogli arriva ancora un odore di palude e di muffa. Il mago che abitava la torre della
            Palude era Severo, e Orvald l'ha capito dal sigillo del cerchio incompleto in fondo a ogni foglio.
            Con le pergamene accanto ai quaderni la formula viene fuori in un pomeriggio, sopra la porta,
            l'unica riga senza la cancellatura. Nel quaderno di quella data Severo ha scritto *questa
            risponde*.
          pe: { accademiche: 6 }
          imposta: { accademia.formula: 1 }
          effetti: { informazioni.segreto: 1 }
        fallimento:
          titolo: Due grafie
          testo: |
            Le pergamene e i quaderni hanno la stessa grafia scritta a vent'anni di distanza, e tu continui a
            confonderle anche con i fogli affiancati sul tavolo. A sera Orvald ti dice di lasciar perdere per
            oggi. Ha gli occhi rossi, e non per la polvere.
          effetti: { tormento: 0.5 }

      - testo: "Chiedere ad Agnese perché porta la chiave di questa stanza"
        descrizione: "Il segno di guanto sul tavolo è recente. In Accademia c'è una sola persona che porta i guanti anche d'estate."
        immagine: ambientazione/cristalli-conduttori
        quando: [accademia.formula == 0]
        prova: { attributo: sociale, abilita: empatia, difficolta: Media }
        successo:
          titolo: Il registro mancante
          testo: |
            Agnese conta fino alla fine del giro, poi tira fuori da sotto il tavolo un registro rilegato in
            nero, il rettangolo senza polvere della torretta. Sulla copertina c'è ancora la polvere grigia
            della stanza di Severo. Dentro ci sono le notti della Vecchia degli ultimi due anni, e accanto a
            molte una riga sottolineata, sempre la stessa. «Severo l'aveva scritta sopra la porta. Quando la
            Vecchia cala io la dico a mezza voce, e lei si rialza ogni volta un po' più a lungo» dice, senza
            guardarti.
          pe: { empatia: 6 }
          imposta: { accademia.formula: 1 }
          effetti: { informazioni.segreto: 1 }
        fallimento:
          titolo: Il turno
          testo: |
            Agnese ti ascolta senza smettere di contare, e quando hai finito ti dice che durante il turno non
            si parla. Il turno dura fino all'alba. All'alba se n'è già andata da un'altra scala, e sul tavolo
            resta solo l'impronta umida dei suoi guanti.
          effetti: { sospetto: 0.5 }

      - testo: "Dirlo a Orvald"
        descrizione: "Agnese tiene accesa la Vecchia con una formula che nessuno all'Accademia dovrebbe conoscere. Il preside deve saperlo."
        quando: [accademia.formula >= 1]
        esito:
          titolo: I turni di notte
          testo: |
            Glielo dici nello studio, con la porta chiusa. Orvald ascolta guardando la mappa delle fontane, e
            quando hai finito resta zitto a lungo. Poi scende nella Camera e ne risale un'ora dopo da solo,
            con l'orlo dei pantaloni bagnato. Agnese è sospesa dai turni, e i turni di notte li fa lui, per la
            prima volta da otto anni. «Aveva ragione lei, la Vecchia si rialza» ti dice il giorno dopo, con la
            barba non fatta. «Si rialza con una formula che io non so leggere. Questo non mi piace per
            niente.»
          pe: { politica-ed-economia: 3 }
          imposta: { accademia.agnese: 1 }
          effetti: { fazione.accademia: 1, rep.accademia: 0.5 }

      - testo: "Tacere e aiutare Agnese"
        descrizione: "Puoi tenerlo per te e darle una mano nei turni."
        quando: [accademia.formula >= 1]
        esito:
          titolo: Il secondo paio di mani
          testo: |
            Scendi nella Camera durante il turno di Agnese e le dici che Orvald non saprà niente da te. Lei ti
            guarda a lungo, poi ti mette in mano la clessidra e ti insegna a contare il battito come lo conta
            lei, con la punta delle dita sul lyssan. Quando la Vecchia cala, verso le tre, dice la riga di
            Severo a mezza voce. L'acqua dei canali si ferma, e subito dopo senti il cristallo rialzarsi sotto
            le dita. Ti ringrazia una volta sola, all'alba, sulla scala.
          pe: { resilienza: 3 }
          imposta: { accademia.agnese: 2 }
          effetti: { fazione.accademia: 1, rep.accademia: 0.5, sospetto: 1 }

  # ------------------------------------------------------------ passo 8 · la lingua delle macchine
  - id: accademia-la-formula-al-nodo
    presso: mercato-dei-nodi
    immagine: personaggi/ambrin-qell
    titolo: La lingua delle macchine
    sommario: "All'Accademia nessuno sa leggere una formula precuriana senza vergognarsene. Al Nodo d'Ossidiana Ambrin Qell non si vergogna di niente."
    luogo: Mercato dei Nodi, il Nodo d'Ossidiana
    area: ponti-sospesi
    requisiti: [fazione.accademia == 7, accademia.lingua == 0]
    testo: |
      Al Nodo d'Ossidiana Ambrin Qell ricopia una pergamena dietro il bancone, e il corvo ti guarda entrare
      dalla sua stanga. Fuori le corde del Mercato dei Nodi scricchiolano sotto il passo della gente che torna
      a casa. Ambrin legge la riga di Severo senza toccarla, poi la gira con la punta della penna come un
      insetto morto. La penna perde, e accanto alla riga resta una goccia d'inchiostro che lui non asciuga.

      «All'Accademia vi insegnano che queste non esistono, e poi venite da me di sera con il cappuccio tirato
      sugli occhi» dice Ambrin. «Te la leggo, ma qui le cose hanno un prezzo. E quando esci dal Nodo con una
      formula precuriana in tasca, in fondo al ponte ci sono due chierici del Velo che contano chi entra.»

      Il corvo scende sul bancone e tiene ferma la pergamena con una zampa, e le unghie gli si chiudono
      proprio sulla riga di Severo.
    opzioni:
      - testo: "Convincere Ambrin a leggerla"
        descrizione: "Ambrin legge le formule precuriane per chi sa spiegare perché gli servono."
        prova: { attributo: sociale, abilita: persuasione, difficolta: Media }
        successo:
          titolo: Un ordine
          testo: |
            Gli racconti dell'acqua senza dire della Vecchia, e Ambrin capisce lo stesso. Legge la riga a voce
            bassissima, una sillaba alla volta, e le lanterne della bottega tremano. «È un ordine, della
            stessa famiglia del Comando. Il cristallo non lo accende affatto. Dice a una cosa di rispondere a
            chi la chiama, e chi lo dice resta legato a chi ascolta.» All'uscita i due chierici in fondo al
            ponte ti guardano passare con molta attenzione, e uno dei due si sposta per vederti meglio la
            faccia sotto il cappuccio.
          pe: { persuasione: 5 }
          imposta: { accademia.lingua: 1 }
          effetti: { sospetto: 1 }
        fallimento:
          titolo: Il cappuccio
          testo: |
            Ambrin ti ascolta e ti restituisce la pergamena con la punta della penna e senza toccarla con le
            dita. Prima di leggerti una formula così vuole sapere che uso ne farai, e tu non hai saputo
            dirglielo. All'uscita i chierici appoggiati alle corde del parapetto ti guardano lo stesso.
          effetti: { sospetto: 1 }

      - testo: "Farla leggere da socio"
        descrizione: "Hai la chiave del retrobottega. Fra soci le formule si leggono senza discutere il prezzo."
        requisiti: [nodo.socio >= 1]
        esito:
          titolo: Il retrobottega
          testo: |
            Ambrin ti fa passare nel retrobottega, dove i chierici non vedono, e legge la riga a voce
            bassissima fra le casse che sanno di paglia e di cera. «È un ordine, della stessa famiglia del
            Comando. Dice a una cosa di rispondere a chi la chiama, e chi lo dice resta legato a chi ascolta.»
            Poi ti fa uscire dalla porta sul retro, quella che dà sulle corde.
          pe: { magia: 4 }
          imposta: { accademia.lingua: 1 }

      - testo: "Pagare la lettura"
        descrizione: "Ambrin ha un prezzo per tutto. Per questo ne ha uno alto."
        requisiti: [monete >= 25]
        esito:
          titolo: Il prezzo della lettura
          testo: |
            Ambrin conta le monete due volte, facendole scivolare sul bancone con un dito, poi le mette nel
            cassetto e legge la riga a voce bassissima. «È un ordine. Dice a una cosa di rispondere a chi la
            chiama, e chi lo dice resta legato a chi ascolta.» All'uscita i due chierici in fondo al ponte
            scrivono qualcosa su una tavoletta.
          pe: { magia: 3 }
          imposta: { accademia.lingua: 1 }
          effetti: { monete: -25, sospetto: 1 }

  - id: accademia-la-formula-da-ilka
    presso: locanda-di-ilka
    immagine: ambientazione/locanda-di-ilka
    titolo: La ninna nanna di Ilka
    sommario: "Ilka Dravec conosce qualche parola dei Precursori. Forse ne conosce anche una riga intera."
    luogo: Locanda di Ilka, accanto al fuoco
    area: citta-bassa
    requisiti: [fazione.accademia == 7, accademia.lingua == 0]
    testo: |
      Il pomeriggio la Locanda di Ilka è quasi vuota. Besk lava i boccali dietro il banco e li mette a scolare
      capovolti in fila su uno strofinaccio. Ilka è al suo posto accanto al fuoco con una coperta di lana
      sulle ginocchia. Ti saluta per nome prima che tu entri, e questa volta ci azzecca.

      Ti siedi accanto a lei e tiri fuori la riga di Severo, ricopiata su un foglio che a forza di pieghe si è
      fatto morbido come stoffa. Ilka è quasi cieca, ma quando la pronunci a mezza voce smette di dondolarsi e
      le mani le restano ferme sulla coperta.

      «Questa la cantava mia nonna, quando i carri non volevano ripartire» dice Ilka. Besk si asciuga le mani
      nello strofinaccio e viene a sedersi dall'altra parte con il quaderno già aperto. «Mamma, la parola
      giusta» dice piano. «Quella che diceva la nonna.» Ilka sorride a qualcuno che non c'è.

      {origine figlio-della-citta-bassa} In Città Bassa le nonne olvare cantano ai bambini in una lingua che
      non traduce più nessuno, e tu ricordi un pezzo di una cantilena da contare sulle dita, una falange per
      ogni sillaba.
    opzioni:
      - testo: "Lasciare che Ilka la canti"
        descrizione: "Non serve chiederle niente. Serve ascoltarla, e non interromperla quando sbaglia."
        prova: { attributo: sociale, abilita: empatia, difficolta: Facile }
        successo:
          titolo: La cantilena
          testo: |
            Ilka canta la riga intera a voce bassa, come una ninna nanna. Nelle pause batte il tempo con il
            pollice sul ginocchio, due colpi brevi seguiti da uno lungo, nel punto dove la lana della coperta
            è consumata fino alla trama. Il fuoco si abbassa mentre canta. Quando finisce chiede a Besk chi è
            la persona seduta accanto a lei. Besk le scrive il significato sul quaderno parola per parola, con
            la matita che gratta sulla carta. «Rispondi a chi ti chiama, e non smettere» legge a voce alta.
            «Chi canta resta con chi risponde.»
          pe: { empatia: 5 }
          imposta: { accademia.lingua: 1 }
        fallimento:
          titolo: Il falò dei carri
          testo: |
            Ilka comincia la riga, poi passa al falò dei primi carri e non torna più indietro. Il pollice
            intanto continua a batterle sul ginocchio due brevi e una lunga, anche quando la voce racconta
            d'altro. Besk ti fa segno di lasciarla stare, e ti dice di tornare un pomeriggio che sua madre è
            più lucida.
          effetti: { tormento: 0.5 }

      - testo: "Cantare con lei la cantilena che conosci"
        descrizione: "Se Ilka comincia e tu continui, forse lei trova la strada fino in fondo."
        prova: { attributo: sociale, abilita: espressivita, difficolta: Media }
        successo:
          titolo: A due voci
          testo: |
            Attacchi la cantilena dove si interrompe lei, e Ilka ti segue sorpresa. La tua cantilena e la sua
            riga hanno lo stesso passo, e le sillabe cadono sulle stesse dita. Poi Ilka ti supera e la porta
            fino in fondo con una voce che Besk dice di non sentirle da anni. Besk scrive il significato sul
            quaderno. «Rispondi a chi ti chiama, e non smettere. Chi canta resta con chi risponde.» Poi chiude
            il quaderno e ti guarda male, perché sua madre adesso è stanca e felice e lei non ci era mai
            riuscita.
          pe: { espressivita: 5 }
          imposta: { accademia.lingua: 1 }
        fallimento:
          titolo: La nota stonata
          testo: |
            Stoni alla seconda nota, e Ilka ride così forte che le scivola la coperta. Gliela rimetti sulle
            ginocchia, e della riga si è già dimenticata. In compenso ti tiene la mano fino a sera fra le sue,
            secche come pane vecchio, e ti chiama con il nome di un suo cugino.

  - id: accademia-la-formula-in-biblioteca
    presso: biblioteca-di-qir-azel
    immagine: personaggi/mattias-crenn
    titolo: I calchi e la riga
    sommario: "Mattias Crenn ha i calchi del Gradone e una pazienza infinita. Per scomporre una formula precuriana servono tutti e due."
    luogo: Biblioteca di Qir-Azel, la sala di lettura
    area: quartieri-alti
    requisiti: [fazione.accademia == 7, accademia.lingua == 0]
    testo: |
      Nella sala di lettura della Biblioteca la luce scende da finestre strette in alto e sui tavoli di noce
      resta un odore di colla e di carta vecchia. Mattias Crenn ti aspetta con i calchi del Gradone già stesi
      e fermati agli angoli con quattro calamai. Sono fogli sottili passati a carboncino sulla pietra, e i
      segni ci restano in bianco con i bordi netti e senza una sbavatura di scalpello. Mattias ha preparato
      anche una tavola di segni ricopiata a mano, con un punto interrogativo accanto a ogni segno.

      In fondo alla sala, dietro una grata, cominciano gli scaffali sigillati con la cera nera. Ulric Stanne
      passa fra i tavoli con il mazzo delle chiavi alla cintura e guarda i calchi con curiosità.

      Mattias si alza gli occhiali sulla fronte stempiata e appoggia accanto ai calchi la riga di Severo,
      scritta a inchiostro su un foglio di quaderno con le lettere che pendono tutte a destra. Poi la
      confronta segno per segno, muovendo le labbra.
    opzioni:
      - testo: "Scomporre la formula sui calchi"
        descrizione: "Segno per segno, con la tavola di Mattias e molta pazienza. È un lavoro da giorni."
        prova: { attributo: mentale, abilita: accademiche, difficolta: Difficile }
        successo:
          titolo: Rispondere
          testo: |
            Ci mettete tre giorni e alla fine hai le dita nere di carboncino fino alle nocche. Sulla tavola di
            Mattias adesso c'è una parola accanto a ogni segno della riga. È un ordine, rivolto a una cosa che
            ascolta, perché risponda a chi la chiama e non smetta. Il segno finale lega chi parla a chi
            risponde. Mattias si toglie gli occhiali e li pulisce a lungo sulla manica, poi ti dice che
            preferiva i punti interrogativi.
          pe: { accademiche: 6 }
          imposta: { accademia.lingua: 1 }
        fallimento:
          titolo: I punti interrogativi
          testo: |
            Dopo tre giorni la tavola ha più punti interrogativi di prima.
            Mattias dice che la Biblioteca ha tempo, e che puoi tornare quando
            vuoi.
          effetti: { tormento: 0.5 }

      - testo: "Aprire con la tua chiave il fascio delle misure"
        descrizione: "Negli scaffali sigillati c'è un fascio di misure dei cristalli raccolte per vent'anni. Con quello accanto, la formula si legge meglio."
        requisiti: [biblioteca.tessera >= 1]
        prova: { attributo: mentale, abilita: accademiche, difficolta: Media }
        successo:
          titolo: Il fascio delle misure
          testo: |
            Il fascio è legato con lo spago e pieno di tabelle scritte da mani diverse in vent'anni, le misure
            dei battiti dei cristalli maggiori della città. Battono tutti insieme, e le colonne coincidono
            riga per riga dall'inchiostro più vecchio e ormai marrone fino a quello ancora nero delle ultime
            pagine. A margine qualcuno ha scritto il nome di Darn-Morakh con un punto interrogativo. Con le
            tabelle accanto la riga di Severo si apre in un pomeriggio. È un ordine a una cosa che ascolta,
            perché risponda a chi la chiama, e lega chi parla a chi risponde.
          pe: { accademiche: 6 }
          imposta: { accademia.lingua: 1 }
          effetti: { informazioni.segreto: 1 }
        fallimento:
          titolo: Lo spago
          testo: |
            Le tabelle sono troppe e scritte da troppe mani, e a sera hai soltanto il mal di testa. Ulric ti
            chiede di rimettere lo spago con lo stesso nodo da legatore che c'era, e alla fine lo rifà lui con
            due giri del pollice.
          effetti: { tormento: 0.5 }

      - testo: "Lasciare la riga a Mattias e tornare fra una settimana"
        descrizione: "Mattias lavora meglio da solo, e la Biblioteca chiude tardi."
        costo: 2
        esito:
          titolo: Una settimana dopo
          testo: |
            Quando torni, una settimana dopo, Mattias ha gli occhi rossi e la tavola piena. Accanto ai calchi
            i quattro calamai sono vuoti, e c'è una pila di fogli cancellati alta un palmo. Mattias ti legge
            la riga parola per parola. È un ordine a una cosa che ascolta, perché risponda a chi la chiama e
            non smetta, e chi lo dice resta legato a chi risponde. Ti chiede di non dirgli a che cosa serve.
          pe: { accademiche: 2 }
          imposta: { accademia.lingua: 1 }

  - id: accademia-due-brevi-e-una-lunga
    presso: accademia-di-torvessa
    immagine: personaggi/orvald-temmerin
    titolo: Due brevi e una lunga
    sommario: "Adesso sai che cosa dice la riga di Severo. Orvald vuole sentirlo da te, nello studio, con la mappa delle fontane aperta."
    luogo: Accademia di Torvessa, lo studio del preside
    area: quartieri-alti
    requisiti: [fazione.accademia == 7, accademia.lingua >= 1]
    testo: |
      Sulla scrivania Orvald ha steso la mappa delle fontane e l'ha fermata agli angoli con il calamaio e due
      libri. Accanto c'è il quaderno di Besk aperto sulla notte del cortile di Ilka, con la colonna dei tempi
      scritta a matita e ripassata a penna. Gli racconti che cosa dice la riga di Severo, e lui ascolta a
      occhi chiusi come ascolta le formule degli allievi.

      «Quindi Severo le ha ordinato di rispondere, e da dieci anni lei risponde a qualcuno» dice alla fine
      guardando la colonna di Besk. «Adesso bisogna capire chi la chiama.»

      {magia Media} Ti accorgi che con il dito stai battendo sulla scrivania il ritmo della Vecchia che hai
      sentito nella Camera, e che il dito ha cominciato prima che Orvald parlasse.

      Pett si è appollaiato sul teschio di cinghiale e non si muove, con le penne lisce e la testa girata
      verso la mappa.
    opzioni:
      - testo: "Appoggiare sulla mappa il congegno di Aurenne"
        descrizione: "Il disco che portava al collo comandava le macchine della Salvaguardia. Le macchine del Festival battevano due brevi e una lunga."
        quando: [oggetto.congegno-di-controllo >= 1]
        esito:
          titolo: La stessa chiamata
          testo: |
            Appoggi il congegno di controllo sulla mappa delle fontane, e dopo un momento il disco comincia a
            vibrare con due colpi brevi e uno lungo. È lo stesso ritmo della colonna di Besk, e la carta della
            mappa trema sotto il bordo del disco. La Vecchia rispondeva alla stessa chiamata che al Festival
            ha messo in cammino le macchine, e la chiamata partiva dal congegno, cioè da Capomozzo. «Adesso il
            congegno è spento sulla mia scrivania, eppure la Vecchia batte lo stesso» dice Orvald piano, e
            Pett si stringe nelle penne.
          pe: { tecnologia: 5 }
          effetti: { fazione.accademia: 1, rep.accademia: 0.5 }

      - testo: "Dire a Orvald che la fonte non la sapete"
        descrizione: "Due brevi e una lunga, come al Festival. Da dove arrivi la chiamata, per ora, non lo sa nessuno."
        quando: [oggetto.congegno-di-controllo == 0]
        esito:
          titolo: A chi
          testo: |
            Gli dici quello che sai. La sequenza della fontana è quella che hanno battuto i cristalli del
            banco al Festival, prima che arrivassero le macchine. La riga di Severo dice alla Vecchia di
            rispondere a chi chiama, e chi sia a chiamare non lo sapete. Orvald scrive la domanda in cima alla
            mappa con la sua grafia stretta, e ci mette accanto un punto interrogativo grande. «Per adesso
            basta sapere che qualcuno chiama, e il resto lo chiediamo al Consiglio» dice, e arrotola la mappa
            prima che l'inchiostro sia asciutto.
          pe: { accademiche: 5 }
          effetti: { fazione.accademia: 1, rep.accademia: 0.5 }

  # ------------------------------------------------------------ passo 9 · per chi ha già la cattedra
  # La cattedra (contenuti/citta/accademia.yaml) chiede accademia.cattedra == 0. Chi l'aveva presa prima della quest
  # passa da qui, con le stesse ricompense del grado 3.
  - id: accademia-il-voto-del-maestro-aggiunto
    presso: accademia-di-torvessa
    immagine: personaggi/orvald-temmerin
    titolo: Il voto del maestro aggiunto
    sommario: "Giovedì il consiglio dei maestri vota sulla Vecchia, e Orvald conta i voti sulle dita."
    luogo: Accademia di Torvessa, la sala del consiglio dei maestri
    area: quartieri-alti
    requisiti: [fazione.accademia == 8, accademia.cattedra >= 1]
    testo: |
      La sala del consiglio dei maestri ha sette sedie scompagnate intorno a un tavolo di noce, e ognuna ha
      l'imbottitura consumata in un punto diverso. Sopra il camino c'è un ritratto del fondatore così annerito
      dal fumo che si vedono soltanto le mani. Giovedì si vota se portare la Vecchia davanti al Consiglio
      della città, e Orvald ha contato tre volte un pareggio. Querci e due maestri vogliono tacere fino
      all'inverno e chiedere i soldi a cose fatte.

      «Tu sei maestro aggiunto da prima che cominciasse tutto questo» dice Orvald battendoti la nocca sul
      petto. «Il tuo voto vale come il mio, e Querci lo sa.»

      {politica-ed-economia Media} In un consiglio di vecchi un pareggio si rompe convincendo il più stanco,
      cioè il maestro di storia che ha la sedia più vicina alla porta e vuole andare a pranzo.
    opzioni:
      - testo: "Convincere il maestro di storia prima del pranzo"
        descrizione: "Un voto in più basta. Il maestro di storia è stanco, e ha fame."
        prova: { attributo: sociale, abilita: persuasione, difficolta: Media }
        successo:
          titolo: Il pranzo
          testo: |
            Al consiglio parli poco e porti il discorso verso la fine dell'ora, quando il maestro di storia
            comincia a guardare la porta. Lui vota con Orvald pur di uscire e ha già l'altra mano sulla
            maniglia, e Querci sospira. Orvald si sfila dal dito l'anello d'ottone dei Precursori e te lo
            mette nel palmo, ancora caldo. «Pett lo nasconde ogni settimana. Adesso lo nasconde a te» dice.
            Nella torretta, da stasera, c'è una stanza tua.
          pe: { persuasione: 5 }
          almeno: { rep.accademia: 6 }
          effetti: { fazione.accademia: 1, rep.accademia: 1, oggetto.accademia-anello-d-ottone: 1 }
        fallimento:
          titolo: Un voto di scarto
          testo: |
            Il maestro di storia vota con Querci, e il consiglio resta pari mentre dal corridoio arriva
            l'odore del pranzo. Resta pari fino a quando Tobol, che non ha diritto di voto, minaccia di
            raccontare a tutti la storia della sua cravatta. La proposta passa per stanchezza. Orvald ti dà lo
            stesso l'anello d'ottone e la stanza nella torretta, ma Querci da oggi ti saluta con mezzo cenno.
          almeno: { rep.accademia: 6 }
          effetti: { fazione.accademia: 1, oggetto.accademia-anello-d-ottone: 1, scandalo: 1 }

      - testo: "Votare e chiedere la lezione del Sigillo"
        descrizione: "Al posto dell'anello, la formula che chiude le serrature di Mana. Orvald la regala ai maestri che votano bene."
        quando: [magia >= 3, incantesimo.sigillo == 0]
        prova: { attributo: mentale, abilita: magia, difficolta: Difficile }
        successo:
          titolo: La porta del seminterrato
          testo: |
            La proposta passa per un voto, il tuo. Dopo il consiglio Orvald ti porta nel seminterrato e ti fa
            chiudere la porta con il Sigillo, e il Mana si chiude nella serratura con uno scatto che senti fin
            nei denti. Poi Orvald prova ad aprirla con la spalla, e la porta non si muove nemmeno nel gioco
            dei cardini. Nella torretta, da stasera, c'è una stanza tua.
          pe: { magia: 5 }
          almeno: { rep.accademia: 6 }
          effetti: { fazione.accademia: 1, rep.accademia: 1, incantesimo.sigillo: 1 }
        fallimento:
          titolo: La serratura che resiste
          testo: |
            La proposta passa per un voto, il tuo, ma il Sigillo nel seminterrato ti scappa di mano tre volte.
            Ogni volta la serratura si chiude a metà e poi si riapre con un clic. Orvald ti dà l'anello
            d'ottone al posto della formula, e ti dice di tornare a lezione quando vuoi.
          almeno: { rep.accademia: 6 }
          effetti: { fazione.accademia: 1, rep.accademia: 1, oggetto.accademia-anello-d-ottone: 1, tormento: 0.5 }

      - testo: "Votare e basta"
        descrizione: "Una mano alzata al momento giusto. Il resto lo fa Orvald."
        esito:
          titolo: La mano alzata
          testo: |
            Al momento del voto alzi la mano, e la proposta passa di un voto. Querci annota tutto sul registro
            e chiude la penna con un colpo secco, e il maestro di storia è già sulla porta prima che abbia
            finito. Orvald ti dà l'anello d'ottone che Pett nasconde ogni settimana, e la chiave della stanza
            vuota nella torretta.
          pe: { politica-ed-economia: 3 }
          almeno: { rep.accademia: 6 }
          effetti: { fazione.accademia: 1, rep.accademia: 0.5, oggetto.accademia-anello-d-ottone: 1 }

  # ------------------------------------------------------------ passo 10 · l'acqua in Consiglio
  - id: accademia-l-acqua-in-consiglio
    presso: municipio
    immagine: fazioni/consiglio-di-qir-azel
    titolo: L'acqua in Consiglio
    sommario: "Il consiglio dei maestri ha votato. Adesso la Vecchia va davanti al Consiglio di Qir-Azel a porte chiuse, e il discorso tocca a te."
    luogo: Municipio, la sala del Consiglio a porte chiuse
    area: quartieri-alti
    requisiti: [fazione.accademia == 9]
    testo: |
      La sala del Consiglio ha le tende di velluto tirate, con l'orlo consumato dove le mani le scostano, e un
      lampadario di cristalli ronza sopra il tavolo ovale. Julia Castaldi siede a capotavola con le mani sui
      registri. Padre Vantes, per il Velo, tiene gli occhi bassi. Tenebra sta nell'ombra fra due finestre per
      i Raschiatori, con le vene che gli brillano sotto la pelle. Chi siede per la Gilda ha già aperto davanti
      a sé un fascio di carte con il sigillo della Casa dei Nodi, e le ha allineate al bordo del tavolo.

      {politica-ed-economia Media} La Gilda ha portato un'offerta scritta prima ancora di sapere la domanda, e
      quindi qualcuno fra i maestri ha parlato presto.

      Orvald si alza e dice tre frasi sulla condotta, e alla quarta si impappina. Si risiede rosso fino alle
      orecchie, e la sedia gli scricchiola sotto.

      «Dunque» dice Julia sistemandosi gli occhiali. «L'acqua di questa città dipende da un cristallo che si
      spegne entro l'inverno, e io lo sento oggi. Mi dica che cosa vuole, e quanto costa.»

      {origine rampollo-dei-quartieri-alti} Questa sala la conosci dalle sedute in cui tuo padre ti portava a
      stare zitt{o|a} in fondo, su una panca troppo alta per i tuoi piedi.

      {origine mercante-dei-ponti} Le carte della Gilda le riconosci dal taglio, scritte per essere accettate
      prima che qualcuno faccia i conti.
    opzioni:
      - testo: "Convincere il Consiglio"
        descrizione: "Un discorso che tenga insieme l'acqua e i soldi, davanti a quattro persone che non vogliono sentirlo."
        prova: { attributo: sociale, abilita: persuasione, difficolta: Difficile }
        successo:
          titolo: La colletta e la Lacrima
          testo: |
            Parli dell'acqua di Via del Salmone prima che della Vecchia, e della fila alla fontana prima che
            dei cristalli. Julia smette di prendere appunti a metà discorso e posa la penna di traverso sul
            registro. Una spedizione a Darn-Morakh costa troppo e il Consiglio la scarta. Autorizza due cose.
            Una colletta di cristalli, in silenzio, per alleggerire la Vecchia, e un sopralluogo alla Lacrima
            pietrificata, il cristallo più grande della regione, nelle torbiere a nord del Torvessa. Julia ti
            stringe la mano e ti paga il disturbo dalla cassa del Municipio.
          pe: { persuasione: 6 }
          imposta: { accademia.consiglio: 1 }
          effetti: { fazione.accademia: 1, rep.castaldi: 1, monete: 20 }
        fallimento:
          titolo: La sera stessa
          testo: |
            Il discorso ti scappa di mano a metà, quando Padre Vantes chiede se la Cripta è stata informata.
            Lo chiede senza alzare gli occhi dal tavolo, e dopo la domanda nessuno guarda più te. Il Consiglio
            autorizza lo stesso la colletta e il sopralluogo alla Lacrima pietrificata, perché non ha altra
            scelta. La sera stessa, però, la notizia esce dal Municipio, e il giorno dopo i portatori d'acqua
            di tutta la città hanno alzato i prezzi.
          imposta: { accademia.consiglio: 2 }
          effetti: { fazione.accademia: 1, scandalo: 1.5, rep.castaldi: 0.5 }

      - testo: "Far vedere al Consiglio l'acqua di Via del Salmone"
        descrizione: "Un secchio vuoto della fontana della Città Bassa a metà mattina, con i registri di Agnese accanto. Le carte parlano meglio di te."
        prova: { attributo: mentale, abilita: accademiche, difficolta: Media }
        successo:
          titolo: Il secchio vuoto
          testo: |
            Metti sul tavolo ovale un secchio vuoto e il registro di Agnese aperto alla pagina del Festival,
            con la colonna che raddoppia. Il secchio è di legno cerchiato di ferro e ha il fondo asciutto.
            Spieghi i numeri uno per uno, senza aggettivi. Tenebra si avvicina al tavolo per la prima volta e
            guarda la colonna a lungo, e la luce delle sue vene cade sulla carta. Il Consiglio autorizza una
            colletta di cristalli in silenzio e un sopralluogo alla Lacrima pietrificata, il cristallo più
            grande della regione, nelle torbiere a nord del Torvessa. Julia ti fa pagare il disturbo dalla
            cassa del Municipio.
          pe: { accademiche: 6 }
          imposta: { accademia.consiglio: 1 }
          effetti: { fazione.accademia: 1, rep.castaldi: 1, monete: 20 }
        fallimento:
          titolo: I numeri sbagliati
          testo: |
            Sbagli una colonna, e chi siede per la Gilda te lo fa notare con garbo davanti a tutti. Appoggia
            il dito sulla riga sbagliata e ce lo lascia finché l'hanno vista tutti. Il Consiglio autorizza lo
            stesso la colletta e il sopralluogo alla Lacrima pietrificata. La sera stessa, però, la notizia
            esce dal Municipio, e l'indomani l'acqua dei portatori costa il doppio in tutta la città.
          imposta: { accademia.consiglio: 2 }
          effetti: { fazione.accademia: 1, scandalo: 1.5, rep.castaldi: 0.5 }

      - testo: "Smontare l'offerta di Ottone Malgrani"
        descrizione: "Ottone offre i cristalli registrati della Gilda a un prezzo che sembra un favore. Bisogna leggere le clausole in fondo."
        immagine: personaggi/ottone-malgrani
        quando: [pista.pelle < 7]
        prova: { attributo: mentale, abilita: politica-ed-economia, difficolta: Media }
        successo:
          titolo: Le clausole in fondo
          testo: |
            La clausola sta in fondo all'ultima pagina, scritta più piccola del resto. I cristalli si pagano
            in dieci anni con gli interessi, e fino all'ultima rata la condotta passa sotto la gabella della
            Casa dei Nodi. Lo dici ad alta voce. Ottone Malgrani raccoglie le carte con un sorriso stretto. Il
            Consiglio autorizza una colletta di cristalli in silenzio e un sopralluogo alla Lacrima
            pietrificata, il cristallo più grande della regione. Julia ti fa pagare il disturbo, e ti guarda
            un po' più a lungo del necessario.
          pe: { politica-ed-economia: 6 }
          imposta: { accademia.consiglio: 1 }
          effetti: { fazione.accademia: 1, rep.castaldi: 1, monete: 20, rep.gilda: -0.5 }
        fallimento:
          titolo: Il favore
          testo: |
            Le clausole sono scritte bene, e Ottone le difende meglio di come le attacchi tu. Risponde senza
            guardare le carte e cita ogni volta la pagina giusta. Il Consiglio rimanda l'offerta della Gilda e
            autorizza intanto la colletta e il sopralluogo alla Lacrima pietrificata. La sera stessa la
            notizia esce dal Municipio, probabilmente dalla porta della Gilda.
          imposta: { accademia.consiglio: 2 }
          effetti: { fazione.accademia: 1, scandalo: 1.5, rep.castaldi: 0.5 }

      - testo: "Smontare l'offerta di Tarquin Cordani"
        descrizione: "Per la Gilda, adesso, siede il Sovrintendente in persona. La sua offerta è onesta, e proprio per questo va letta con cura."
        quando: [pista.pelle >= 7]
        prova: { attributo: mentale, abilita: politica-ed-economia, difficolta: Media }
        successo:
          titolo: Le mani ferme
          testo: |
            Tarquin Cordani offre i cristalli registrati della Gilda a rate, e l'offerta è onesta fino alla
            penultima pagina. Nell'ultima la condotta passa sotto la gabella della Casa dei Nodi finché il
            debito non è pagato. Lo fai notare con calma. Le mani di Tarquin, che fino a lì hanno girato le
            pagine, smettono di muoversi sopra il tavolo. Poi lui ammette che la clausola l'ha voluta il suo
            consiglio. Il Consiglio autorizza una colletta di cristalli in silenzio e un sopralluogo alla
            Lacrima pietrificata, il cristallo più grande della regione.
          pe: { politica-ed-economia: 6 }
          imposta: { accademia.consiglio: 1 }
          effetti: { fazione.accademia: 1, rep.castaldi: 1, monete: 20, rep.gilda: -0.5 }
        fallimento:
          titolo: L'offerta onesta
          testo: |
            Tarquin risponde a ogni tua obiezione con un numero esatto, e lo dice piano perché Julia faccia in
            tempo a scriverlo. Il Consiglio comincia a guardare lui invece di te. Alla fine si rimanda ogni
            decisione sulla Gilda, e passano soltanto la colletta e il sopralluogo alla Lacrima pietrificata.
            La sera stessa la notizia esce dal Municipio.
          imposta: { accademia.consiglio: 2 }
          effetti: { fazione.accademia: 1, scandalo: 1.5, rep.castaldi: 0.5 }

      - testo: "Parlare come in Consiglio"
        descrizione: "Sai come si parla in questa sala, dove ci si siede e quando si tace. Julia lo vede appena apri bocca."
        quando: [origine.rampollo-dei-quartieri-alti >= 1]
        esito:
          titolo: Come in Consiglio
          testo: |
            Ti alzi, saluti la Rappresentante per prima e il Velo per secondo, e aspetti che il lampadario
            smetta di ronzare. Dopo un momento il ronzio cala, e nella sala resta soltanto il fruscio delle
            carte della Gilda. Poi parli dell'acqua con la calma che in questa sala si usa per le tasse, e
            lasci che i numeri facciano paura da soli. Julia ti ascolta come ascoltava tuo padre. Il Consiglio
            autorizza una colletta di cristalli in silenzio e un sopralluogo alla Lacrima pietrificata, il
            cristallo più grande della regione, e ti paga il disturbo dalla cassa del Municipio.
          pe: { galateo: 6 }
          imposta: { accademia.consiglio: 1 }
          effetti: { fazione.accademia: 1, rep.castaldi: 1, monete: 20 }

      - testo: "Leggere le carte della Gilda come al banco"
        descrizione: "Un'offerta della Gilda scritta in fretta ha sempre la stessa clausola nello stesso posto. Al banco l'hai vista cento volte."
        quando: [origine.mercante-dei-ponti >= 1]
        esito:
          titolo: La clausola del banco
          testo: |
            Giri le carte fino alla penultima pagina senza leggere le prime, perché sai dove stanno queste
            clausole. La pagina è scritta più fitta delle altre, con i margini stretti. La condotta passerebbe
            sotto la gabella della Casa dei Nodi finché il debito non è pagato. Lo leggi ad alta voce, e chi
            siede per la Gilda raccoglie le carte senza discutere. Il Consiglio autorizza una colletta di
            cristalli in silenzio e un sopralluogo alla Lacrima pietrificata, il cristallo più grande della
            regione.
          pe: { politica-ed-economia: 6 }
          imposta: { accademia.consiglio: 1 }
          effetti: { fazione.accademia: 1, rep.castaldi: 1, monete: 20, rep.gilda: -0.5 }

  # Facoltativa, dopo la seduta: l'uomo della Casa dei Nodi. Chi accetta viene messo alla prova al passo 14.
  - id: accademia-l-uomo-della-casa-dei-nodi
    presso: municipio
    immagine: fazioni/gilda-dei-mercanti
    titolo: L'uomo della Casa dei Nodi
    sommario: "Sulla scalinata del Municipio un uomo con il sigillo della Gilda sul colletto ti aspetta. Ha una proposta, e la fa camminando."
    luogo: Quartieri Alti, la scalinata del Municipio
    area: quartieri-alti
    requisiti: [fazione.accademia >= 10, fazione.accademia <= 12, accademia.spia == 0]
    testo: |
      Sulla scalinata del Municipio un uomo con il sigillo della Gilda al colletto ti si mette accanto e
      scende al tuo passo. Ha una voce gentile e non ti dice il suo nome. I suoi guanti grigi sono di pelle
      sottile, cuciti con un filo dello stesso colore, e sui polpastrelli non hanno un segno d'uso.

      «La Casa dei Nodi vuole soltanto sapere quello che sa il Consiglio, un giorno prima» dice. «Racconta a
      noi quello che racconta già al Consiglio, e noi la paghiamo bene.» Ti fa scivolare in mano una borsa
      piccola e pesante, e ritira la mano prima che tu possa restituirla. Le monete dentro non tintinnano,
      perché qualcuno le ha avvolte in un panno.

      {ingannare Media} Chi ti dà la borsa prima della risposta sa già che la terrai, oppure vuole che
      qualcuno vi veda.

      {conoscenze-della-strada Facile} Ai piedi della scalinata aspetta una carrozza nera senza stemma, con le
      tendine abbassate.
    opzioni:
      - testo: "Accettare e tenere la borsa"
        descrizione: "Qualche moneta ogni tanto, e la stima della Gilda. Basta raccontare."
        esito:
          titolo: Il nodo al guanto
          testo: |
            Chiudi la mano sulla borsa, e il cuoio è ancora tiepido della sua. L'uomo annuisce e ti spiega
            come trovarlo, un nodo al guanto sinistro lasciato sul davanzale del Mercato dei Nodi. Poi sale
            sulla carrozza e se ne va. Ti sembra che sulla scalinata non ci fosse nessuno a guardarvi, e quasi
            ci credi.
          imposta: { accademia.spia: 1 }
          effetti: { monete: 25, rep.gilda: 1 }
      - testo: "Restituirgli la borsa"
        descrizione: "Con il giuramento o senza, l'acqua della città non si racconta a chi la vuole vendere."
        esito:
          titolo: I guanti grigi
          testo: |
            Gli rimetti la borsa nel palmo e gli chiudi tu le dita sopra, e le dita dentro il guanto cedono
            senza resistenza. Lui sorride senza offendersi e ti dice che la proposta resta valida fino
            all'inverno, poi sale sulla carrozza. Dalla finestra del Municipio, al primo piano, Julia Castaldi
            ha visto tutto.
          imposta: { accademia.spia: 2 }
          effetti: { rep.castaldi: 0.5 }
      - testo: "Accettare e dirlo a Orvald"
        descrizione: "Si può prendere la borsa e raccontare alla Gilda soltanto quello che decide il preside. Bisogna recitare bene la parte."
        prova: { attributo: sociale, abilita: ingannare, difficolta: Media }
        successo:
          titolo: Le notizie del preside
          testo: |
            Prendi la borsa, e la sera stessa la porti a Orvald. Lui la soppesa sul palmo due volte e ride,
            per la prima volta da settimane. D'ora in poi alla Casa dei Nodi racconterai quello che ti detta
            lui, con la sua grafia stretta su foglietti che poi bruci nel camino dello studio. La borsa la
            tiene Querci, e ti dà la tua parte sospirando.
          pe: { ingannare: 5 }
          imposta: { accademia.spia: 2 }
          effetti: { monete: 10, rep.accademia: 0.5 }
        fallimento:
          titolo: La carrozza
          testo: |
            Prendi la borsa recitando male, e l'uomo se ne accorge. Te la sfila dalle dita con due dita
            guantate e molta cortesia, e sale sulla carrozza. Il giorno dopo alla Casa dei Nodi il tuo nome è
            scritto in un registro che non è quello degli amici.
          imposta: { accademia.spia: 2 }
          effetti: { rep.gilda: -0.5, sospetto: 0.5 }

  # ------------------------------------------------------------ passo 11 · la colletta dei cristalli
  - id: accademia-la-colletta-dei-cristalli
    presso: accademia-di-torvessa
    immagine: ambientazione/cristalli-conduttori
    titolo: La colletta dei cristalli
    sommario: "La Vecchia si può alleggerire con un giunto che le passi la carica di molti cristalli piccoli. Servono cristalli, e qualcuno che li raccolga."
    luogo: Accademia di Torvessa, il laboratorio
    area: quartieri-alti
    requisiti: [fazione.accademia == 10]
    testo: |
      Sul banco del laboratorio c'è il disegno del giunto, tracciato a inchiostro su un foglio grande fermato
      agli angoli con quattro pesi di piombo. È un anello di rame con dodici alloggiamenti per i cristalli
      piccoli e un braccio che tocca la base della Vecchia. Accanto c'è una cassetta vuota di legno chiaro,
      con gli angoli rinforzati di latta e l'etichetta *colletta* scritta da Querci.

      «Ogni cristallo carico nel giunto è una notte in più per la Vecchia» dice Agnese. «Il giunto lo so
      disegnare, ma a costruirlo bene ci vuole qualcuno che conosca le macchine dei Precursori meglio di me.»

      {tecnologia Media} Gli alloggiamenti distano meno di un dito l'uno dall'altro, e con dodici cristalli
      carichi il rame si scalda come una pentola.

      In città ci sono i cristalli degli Averi, le gemme sugli usci dei Quartieri Alti e i frammenti esausti
      che Bram Halgast rifonde nel suo crogiolo. Sulla Superficie Oda Krell monta le macchine dei Precursori
      da vent'anni.

      {origine rampollo-dei-quartieri-alti} Sai quali famiglie tengono le gemme sugli usci per bellezza e
      quali per paura.

      {origine figlio-della-citta-bassa} In Città Bassa i frammenti esausti si tengono in un barattolo sopra
      il camino, finché qualcuno non ha fame.
    opzioni:
      - testo: "Portare un cristallo carico"
        descrizione: "Dagli Averi alla cassetta di Querci. Il tesoriere te lo segna sul registro, e la Vecchia ringrazia a modo suo."
        requisiti: [cristalli.cristallo-carico >= 1]
        esito:
          titolo: Una notte in più
          testo: |
            Posi il cristallo nella cassetta. Querci lo pesa sul palmo e lo guarda contro la finestra finché
            dentro non si accende una venatura. Poi lo segna sul registro con il tuo nome accanto. Agnese lo
            porta giù nella Camera prima di sera.
          effetti: { cristalli.cristallo-carico: -1, accademia.carica: 1, rep.accademia: 0.5 }

      - testo: "Caricare i cristalli sterili al banco di prova"
        descrizione: "Il banco del laboratorio carica i cristalli sterili, se chi tiene le mani sul rame sa spingere il Mana piano."
        prova: { attributo: mentale, abilita: magia, difficolta: Media }
        successo:
          titolo: Dodici canaline
          testo: |
            Passi la notte al banco con i guanti di Agnese, che ti stanno larghi, a spingere il Mana nei
            cristalli sterili della scorta dell'Accademia. Il Mana corre nelle canaline di rame con un ronzio
            sottile, e fra un cristallo e l'altro lasci raffreddare il banco contando. All'alba due si sono
            incrinati, e uno pulsa d'azzurro nella cassetta di Querci.
          pe: { magia: 5 }
          effetti: { accademia.carica: 1 }
        fallimento:
          titolo: Il rame caldo
          testo: |
            Il Mana ti torna indietro al terzo cristallo, e passi il resto della notte con le mani nell'acqua
            fredda. Le punte delle dita ti formicolano fino al mattino. Agnese ti dice che al banco ci si
            siede riposati.
          effetti: { ferite: 0.5, tormento: 1 }

      - testo: "Chiedere le gemme degli usci ai Quartieri Alti"
        descrizione: "Molte famiglie tengono un cristallo carico sopra la porta, per bellezza. Bisogna convincerle a prestarlo senza dire perché."
        prova: { attributo: sociale, abilita: galateo, difficolta: Media }
        successo:
          titolo: Il prestito
          testo: |
            Bussi a sei portoni con una lettera del Municipio e il tuo abito migliore, e parli di un restauro
            delle lanterne pubbliche. Tre famiglie ti prestano la gemma dell'uscio, e una ti offre anche il
            tè. Le gemme stanno in castoni d'ottone avvitati all'architrave, e per toglierle ti serve ogni
            volta una scala. Querci le segna sul registro come prestiti, con una data di restituzione che
            nessuno rispetterà.
          pe: { galateo: 5 }
          effetti: { accademia.carica: 1, rep.castaldi: 0.5 }
        fallimento:
          titolo: Il portone chiuso
          testo: |
            Al terzo portone un maggiordomo ti chiede perché un restauro delle lanterne abbia bisogno delle
            gemme private. Te lo chiede dalla soglia senza aprire del tutto il battente, e tu non hai una
            risposta pronta. Per sera ne parlano in due salotti.
          effetti: { scandalo: 1 }

      - testo: "Raccogliere i frammenti esausti per il crogiolo di Bram"
        descrizione: "In Città Bassa i frammenti esausti si trovano in ogni casa. Bram Halgast li rifonde in cristalli piccoli, se glieli porti."
        prova: { attributo: sociale, abilita: conoscenze-della-strada, difficolta: Facile }
        successo:
          titolo: I barattoli sopra il camino
          testo: |
            Giri per la Città Bassa con un sacco e qualche moneta, e i barattoli sopra i camini si svuotano
            nel tuo sacco uno dopo l'altro. I frammenti sono grigi e opachi, e nel sacco fanno il rumore della
            ghiaia. Bram Halgast li fonde nel crogiolo e te ne restituisce un cristallo piccolo e torbido,
            carico a metà, che Querci accetta storcendo il naso.
          pe: { conoscenze-della-strada: 4 }
          effetti: { accademia.carica: 1, nomea.citta-bassa: 0.5 }
        fallimento:
          titolo: Il sacco mezzo vuoto
          testo: |
            Le porte a cui bussi sono quelle sbagliate, e a sera il sacco è mezzo vuoto. Bram lo scuote una
            volta per sentirne il peso. Poi ci guarda dentro e ti dice di tornare quando è pieno.
          effetti: { sospetto: 0.5 }

      - testo: "Bussare porta per porta in Via del Salmone"
        descrizione: "Lucio Ruspi conosce ogni porta della sua strada. Con lui, i frammenti si raccolgono senza fatica, ma ci vuole tempo."
        costo: 2
        esito:
          titolo: La strada di Lucio
          testo: |
            Lucio ti porta di porta in porta, presentandoti alle madri come {il maestro|la maestra}
            dell'Accademia, e tu non lo correggi. In Via del Salmone i frammenti esausti li danno volentieri,
            perché la fontana la conoscono tutti. Te li mettono nel sacco avvolti in uno straccio. A sera Bram
            Halgast ve ne fonde un cristallo piccolo, carico appena, che è comunque una notte in più.
          pe: { empatia: 2 }
          effetti: { accademia.carica: 0.5 }

      - testo: "Far costruire il giunto da Oda Krell"
        descrizione: "Oda Krell monta i congegni dei Precursori nella sua baracca sulla Superficie. Se le porti il disegno di Agnese, forse lo corregge."
        quando: [accademia.giunto == 0]
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Difficile }
        successo:
          titolo: Gli alloggiamenti larghi
          testo: |
            Oda guarda il disegno di Agnese, ci fa sopra tre segni con il carboncino e allarga gli
            alloggiamenti. Poi te lo fa costruire con le tue mani, nella sua baracca, perché dice che chi
            monta un giunto deve sapere dove si rompe. Ci mettete due giorni, e alla fine hai le dita nere di
            carboncino e di limatura. Il giunto che porti in città è più largo di quello disegnato, e il rame
            resta freddo anche con tutti i cristalli dentro.
          pe: { tecnologia: 6 }
          imposta: { accademia.giunto: 1 }
          effetti: { accademia.carica: 1 }
        fallimento:
          titolo: La saldatura
          testo: |
            La saldatura del braccio ti si apre in mano appena lo togli dalla morsa, e lo stagno ancora molle
            ti cola sul pollice. Oda ti fa rifare tutto da capo, il giorno dopo. Per oggi ti manda a casa con
            una scottatura sul pollice.
          effetti: { ferite: 0.5 }

      - testo: "Montare il giunto e partire per la Lacrima"
        descrizione: "Con tre cristalli nel giunto la Vecchia guadagna tempo. Poi resta da andare a vedere la Lacrima pietrificata."
        requisiti: [accademia.carica >= 3, accademia.furto >= 1]
        esito:
          titolo: Il braccio di rame
          testo: |
            Tu e Agnese montate il giunto di notte, giù nella Camera. Quando il braccio di rame tocca la base
            della Vecchia, le venature si accendono tutte insieme e poi rallentano, e il battito si allunga
            come quello di chi si addormenta. L'acqua nei canali di pietra smette di vibrare e torna liscia.
            Agnese si toglie i guanti e si siede per terra, contro il tavolo dei Regolatori. Il giorno dopo
            Besk e Tobol preparano i bagagli per le torbiere.
          pe: { tecnologia: 4 }
          effetti: { fazione.accademia: 1, rep.accademia: 1 }

  - id: accademia-la-notte-del-furto
    presso: accademia-di-torvessa
    immagine: ambientazione/cristalli-conduttori
    titolo: La notte del furto
    sommario: "La cassetta della colletta è vuota, e la finestra del laboratorio ha la grata piegata. Qualcuno sapeva dove guardare."
    luogo: Accademia di Torvessa, il laboratorio, di notte
    area: quartieri-alti
    requisiti: [fazione.accademia == 10, accademia.carica >= 3, accademia.furto == 0]
    testo: |
      Querci ti sveglia prima dell'alba con una candela in mano. Nel laboratorio la cassetta della colletta è
      vuota. Le sbarre della grata sono piegate verso l'interno, e sul pavimento sotto la finestra ci sono
      scaglie di ruggine fresca. Sul davanzale c'è l'impronta di una scarpa chiodata.

      Querci tiene il registro stretto al petto. «Lo sapevano in otto fra il Consiglio e il consiglio dei
      maestri, più chi ha la bocca larga» dice, e da come lo dice pensa a te e poi a se stesso.

      I chiodi hanno lasciato graffi chiari sulla pietra umida, e i graffi portano giù per i Gradoni verso i
      magazzini sul bordo dei Ponti. Se ti muovi adesso trovi i ladri prima che vendano la carica.

      {atletica Media} Due uomini con due sacchi pieni non corrono, e se scendi i Gradoni saltando i
      pianerottoli sei davanti a loro prima del bordo.
    opzioni:
      - testo: "Raggiungere i ladri e riprendersi i cristalli"
        descrizione: "Sono due ragazzi degli Scuri, e hanno fretta di vendere."
        quando: [pista.pelle < 6]
        combattimento: accademia-i-ladri-degli-scuri
        vittoria:
          titolo: La cassetta ritrovata
          testo: |
            Li trovi dietro un magazzino del bordo, intenti a dividere i cristalli in due sacchi. Il primo
            scappa appena ti vede, e il secondo resta, e se ne pente. Riporti i cristalli a Querci prima di
            colazione. Lui li dispone sul banco in file ordinate e li conta tre volte. Alla fine ti ringrazia,
            una parola sola.
          imposta: { accademia.furto: 1 }
          effetti: { rep.accademia: 0.5, rep.scuri: -0.5 }
        sconfitta:
          titolo: Un sacco su due
          testo: |
            Ti lasciano a terra dietro il magazzino e scappano con un sacco, dimenticando l'altro nella
            fretta. Riporti a Querci quello che resta, zoppicando, con il ginocchio che ti pulsa a ogni
            gradino dei Gradoni. La colletta, adesso, è un po' più leggera.
          imposta: { accademia.furto: 1 }
          effetti: { accademia.carica: -1 }

      - testo: "Raggiungere i ladri e riprendersi i cristalli"
        descrizione: "Sono balestrieri con il mantello dei Custodi rovesciato. La Gilda, o qualcuno che la imita."
        quando: [pista.pelle >= 6]
        combattimento: accademia-i-balestrieri-della-gilda
        vittoria:
          titolo: I mantelli rovesciati
          testo: |
            Li raggiungi sul primo ponte, prima che arrivino al Mercato dei Nodi. Hanno i mantelli dei Custodi
            rovesciati, e uno ha il sigillo della Gilda cucito dentro la fodera a punti piccoli e fitti.
            Riporti i cristalli a Querci, che li conta tre volte e poi si siede.
          imposta: { accademia.furto: 1 }
          effetti: { rep.accademia: 0.5, rep.gilda: -0.5 }
        sconfitta:
          titolo: Il ponte
          testo: |
            Una quadrella ti prende di striscio sul braccio e va a piantarsi nel corrimano con un colpo sordo.
            I ladri spariscono oltre il ponte con un sacco su due. L'altro lo ritrovi in mezzo alle assi,
            incastrato fra due tavole sopra il vuoto, dove è caduto. La colletta, adesso, è un po' più
            leggera.
          imposta: { accademia.furto: 1 }
          effetti: { accademia.carica: -1, ferite: 0.5 }

      - testo: "Seguire le tracce senza farsi vedere"
        descrizione: "Una scarpa chiodata lascia segni dappertutto. Seguirla fino al compratore vale più dei cristalli."
        prova: { attributo: fisico, abilita: furtivita, difficolta: Media }
        successo:
          titolo: Il compratore
          testo: |
            Segui le scarpe chiodate fino a un magazzino del bordo che odora di corda bagnata e di catrame. Da
            dietro una pila di casse vedi i ladri consegnare i sacchi a un uomo con i guanti grigi. Quando se
            ne vanno, i sacchi sono ancora lì, in attesa del carro. Te li riprendi e lasci al loro posto un
            sasso con un biglietto di Querci, che il tesoriere ha scritto con piacere.
          pe: { furtivita: 5 }
          imposta: { accademia.furto: 1 }
          effetti: { rep.accademia: 0.5, informazioni.pettegolezzo: 1 }
        fallimento:
          titolo: Il cane
          testo: |
            Al terzo vicolo un cane ti abbaia addosso da dietro un portone, e le finestre del vicolo si
            accendono una dopo l'altra. Quando torni a cercare le tracce sono sparite sotto i carri del
            mattino. Della colletta torna indietro soltanto quello che era rimasto in fondo alla cassetta.
          imposta: { accademia.furto: 1 }
          effetti: { accademia.carica: -1, sospetto: 0.5 }

      - testo: "Lasciar perdere e ricominciare la colletta"
        descrizione: "Inseguire due ladri di notte per i Gradoni non è affare da maestri. I cristalli si raccolgono di nuovo."
        esito:
          titolo: Da capo
          testo: |
            Dici a Querci che i cristalli si raccolgono di nuovo, e lui ti guarda come se avessi proposto di
            bruciare il registro. Poi apre una pagina nuova, la liscia con il palmo e ci scrive *colletta,
            seconda*. Agnese, quando lo sa, raddrizza le sbarre a martellate e mette un lucchetto alla grata.
          imposta: { accademia.furto: 1 }
          effetti: { accademia.carica: -2 }
