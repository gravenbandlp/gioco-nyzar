# La quest dell'Accademia di Torvessa, «Il cerchio aperto» (fazione.accademia, 15 passi).
# La condotta dell'acqua di Qir-Azel va avanti da dieci anni con un cristallo enorme, la Vecchia, che si sta
# esaurendo. Sta nella Camera della Condotta, oltre il seminterrato di Orvald. Il protagonista entra come aiutante
# di Besk, scende al Gradone Rosso (passo 6) e alla Lacrima pietrificata (passo 12), e al passo 15 stacca la
# Vecchia nelle gallerie della condotta. I passi 13-15 aspettano pista.capomozzo >= 7.
# File: quest.yaml (pista, gradi, quality, luogo, incantesimo), passi-1/2/3.yaml (i passi), ripetibili.yaml (i servizi
# dei gradi), spedizione-gradone/lacrima/gallerie.yaml, oggetti.yaml, nemici.yaml, glossario.yaml.
# La catena breve di contenuti/citta/accademia.yaml è diventata il passo 3 (la-lite-delle-mappe) e il passo 9
# (una-cattedra-a-torvessa e la-chiave-del-seminterrato); il registro delle allieve è un interludio facoltativo.
# La lettera di Besk (accademia.lettera) vale come invito limitato: chi non ha l'invito sale all'Accademia con
# «La lettera di Besk» (ripetibili.yaml), che lo porta nei Quartieri Alti.
# Quality di stato (tutte nascoste tranne la formula, la colletta e la voce in Consiglio):
# - accademia.ladro 1 sai chi ruba i cristalli; accademia.lucio 1 l'hai coperto, 2 denunciato, 3 Orvald alla fontana.
# - accademia.camera 1 hai visto la Vecchia; accademia.giuramento 1 hai giurato il silenzio, 2 hai rifiutato.
# - accademia.preparativi (contatore) con accademia.calchi, accademia.strada, accademia.attrezzi: i preparativi
#   del passo 5, che danno un vantaggio nel Gradone. accademia.diario 1 hai ritrovato le pagine del 140.
# - accademia.stanza 1 la stanza di Dalmas è aperta; accademia.formula 1 la formula ricostruita;
#   accademia.agnese 1 l'hai detto a Orvald, 2 hai taciuto e aiutato Agnese.
# - accademia.lingua 1 qualcuno ti ha letto la formula; accademia.consiglio 1 il Consiglio ha autorizzato in
#   silenzio, 2 la notizia è uscita dal Municipio; accademia.spia 1 riferisci alla Casa dei Nodi, 2 hai rifiutato,
#   3 Querci ti ha scoperto, 4 l'hai tenuto nascosto.
# - accademia.carica (0-5) la colletta dei cristalli; accademia.giunto 1 il giunto l'ha fatto Oda Krell;
#   accademia.furto 1 la notte del furto è passata.
# - accademia.custode 1 hai incontrato il novizio del Velo alla Lacrima; accademia.lacrima 1 misurata, 2 segnata
#   per la Gilda, 3 sigillata per il Velo.
# - accademia.notte 1 hai fermato Agnese nella notte del battito; accademia.esito 1 il giunto, 2 la Lacrima,
#   3 la formula; accademia.eco 1 l'Eco della Condotta è sciolta; accademia.voce il posto in Consiglio, senza voto.
quality:
  - { id: fazione.accademia, immagine: ambientazione/accademia-di-torvessa, nome: Il cerchio aperto, categoria: pista, descrizione: "Nella fontana del cortile di Ilka l'acqua si ferma e riparte, sempre con lo stesso ritmo. Besk Dravec deve misurarla tutta la notte per Orvald Temmerin, e le serve qualcuno che conti con lei." }
  - { id: accademia.lettera, immagine: icone/envelope, nome: La lettera di Besk, categoria: accesso, descrizione: "Due righe di Besk Dravec per Orvald Temmerin, piegate in quattro. Alle guardie dei Quartieri Alti bastano per lasciarti salire fino all'Accademia." }
  - { id: accademia.ladro, nome: Il ladro dei cristalli, categoria: stato, nascosta: true }
  - { id: accademia.lucio, nome: Lucio Ruspi, categoria: stato, nascosta: true, descrizione: "1 l'hai coperto, 2 l'hai denunciato, 3 hai portato Orvald alla fontana di Via del Salmone." }
  - { id: accademia.camera, nome: La Camera della Condotta, categoria: stato, nascosta: true }
  - { id: accademia.giuramento, nome: Il silenzio sulla Vecchia, categoria: stato, nascosta: true, descrizione: "1 hai giurato, 2 hai rifiutato." }
  - { id: accademia.preparativi, nome: I preparativi per il Gradone, categoria: stato, nascosta: true }
  - { id: accademia.calchi, nome: I calchi delle iscrizioni, categoria: stato, nascosta: true }
  - { id: accademia.strada, nome: La strada ricopiata, categoria: stato, nascosta: true }
  - { id: accademia.attrezzi, nome: L'attrezzatura dei Raschiatori, categoria: stato, nascosta: true }
  - { id: accademia.diario, nome: Le pagine del centoquaranta, categoria: stato, nascosta: true }
  - { id: accademia.stanza, nome: La stanza di Dalmas, categoria: stato, nascosta: true }
  - { id: accademia.formula, immagine: icone/scroll-unfurled, nome: La formula di Dalmas, categoria: stato, descrizione: "Hai ricostruito dai quaderni di Severo Dalmas la formula che tiene accesa la Vecchia, e che nessun maestro dell'Accademia ha mai scritto." }
  - { id: accademia.agnese, nome: Agnese e la formula, categoria: stato, nascosta: true, descrizione: "1 l'hai detto a Orvald, 2 hai taciuto e l'hai aiutata." }
  - { id: accademia.lingua, nome: La lingua delle macchine, categoria: stato, nascosta: true }
  - { id: accademia.consiglio, nome: L'acqua in Consiglio, categoria: stato, nascosta: true, descrizione: "1 il Consiglio ha deciso a porte chiuse, 2 la notizia è uscita dal Municipio." }
  - { id: accademia.spia, nome: L'uomo della Casa dei Nodi, categoria: stato, nascosta: true, descrizione: "1 riferisci alla Gilda, 2 hai rifiutato, 3 Querci ti ha scoperto, 4 l'hai tenuto nascosto." }
  - { id: accademia.carica, immagine: icone/crystal-cluster, nome: La colletta dei cristalli, categoria: stato, descrizione: "Quanta carica hai raccolto per alleggerire la Vecchia. Con tre il giunto si può montare." }
  - { id: accademia.giunto, nome: Il giunto di Oda Krell, categoria: stato, nascosta: true }
  - { id: accademia.furto, nome: La notte del furto, categoria: stato, nascosta: true }
  - { id: accademia.custode, nome: Il novizio alla Lacrima, categoria: stato, nascosta: true }
  - { id: accademia.lacrima, nome: La Lacrima pietrificata, categoria: stato, nascosta: true, descrizione: "1 misurata, 2 segnata per la Gilda, 3 sigillata per il Velo." }
  - { id: accademia.notte, nome: La notte del battito, categoria: stato, nascosta: true }
  - { id: accademia.esito, nome: La scelta della condotta, categoria: stato, nascosta: true, descrizione: "1 il giunto, 2 la Lacrima, 3 la formula." }
  - { id: accademia.eco, nome: L'Eco della Condotta, categoria: stato, nascosta: true }
  - { id: accademia.voce, immagine: icone/scroll-quill, nome: Voce dell'Accademia in Consiglio, categoria: stato, descrizione: "Siedi in Consiglio per l'Accademia di Torvessa quando si parla di acqua e di cristalli. Puoi parlare quanto vuoi, ma non voti." }

fazioni:
  - id: accademia
    nome: Accademia di Torvessa
    immagine: icone/crystal-wand
    reputazione: rep.accademia
    pista: fazione.accademia
    gradi:
      - { passo: 3, nome: Uditore, ricompensa: "Un cristallo d'aula o la lente da tasca di Tobol, le lezioni di Orvald a metà prezzo, le sere di Besk per chi non ha mai acceso un cristallo, e qualche moneta." }
      - { passo: 6, nome: Assistente di laboratorio, ricompensa: "La piccozza del centoventi, la chiave del laboratorio con la branda e il lavoro delle lanterne, e Leggere il Mana senza pagare la lezione." }
      - { passo: 9, nome: Maestro aggiunto, ricompensa: "La cattedra e la chiave del seminterrato, una stanza nella torretta dove dormire gratis, e Sigillo o Lancia di luce oppure l'anello d'ottone di Orvald." }
      - { passo: 12, nome: Regolatore, ricompensa: "Il bastone del Regolatore, la Camera della Condotta con la rendita del turno e i cristalli caricati gratis, e la stima di Julia Castaldi." }
      - { passo: 15, nome: Maestro del Cerchio, ricompensa: "Il mantello del cerchio aperto, il Coro dei cristalli o il sigillo del cerchio aperto, una borsa pesante e una voce in Consiglio senza voto." }

luoghi:
  - id: accademia-camera-della-condotta
    area: quartieri-alti
    nome: La Camera della Condotta
    immagine: ambientazione/cristalli-conduttori
    sommario: "Oltre il seminterrato di Orvald, una cisterna dei Precursori dove l'acqua del Torvessa sale da sola."
    requisiti: [fazione.accademia >= 12]
    testo: |
      Dietro la seconda porta di ferro del seminterrato una scala a chiocciola scende fino a una cisterna dei
      Precursori, rotonda, con i canali di pietra che girano lungo le pareti e l'acqua del Torvessa che ci sale
      dentro senza pompe. Al centro, su un supporto di lyssan, c'è la Vecchia, un cristallo alto come due uomini
      con le venature azzurre che si accendono a intervalli. Sul tavolo dei Regolatori, accanto al registro, c'è una tazza che i turni si passano senza lavarla mai.

incantesimi:
  - id: accademia-coro-dei-cristalli
    nome: Coro dei cristalli
    tradizione: cristalli
    livello: 4
    uso: [combattimento]
    immagine: ambientazione/cristalli-conduttori
    descrizione: "Tutti i cristalli a portata cantano la nota del tuo, e il Mana arriva addosso a ogni nemico insieme. Un tiro contro la Resilienza di ciascun nemico, danno pari al margine più 1, doppio sugli echi."
    tipo: area
    difesa: resilienza
    danno: 1
    doppioContro: [eco]
