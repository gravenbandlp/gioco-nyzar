# Il Gradone Rosso, spedizione del passo 6 della quest dell'Accademia (fazione.accademia == 5).
# Ci si entra dalla Superficie Fratturata con «La scarpata del Gradone». Le stanze vanno in fasce di profondità,
# e una stanza superata non ricompare nella stessa visita:
# 0 l'avvicinamento (la frana di arenaria, che sul sentiero del mulo vale due punti; il mulo di Orvald),
# 1 lo scavo del centoventi (il campo abbandonato, che dà le pagine del centoquaranta; la galleria puntellata;
#   il nido dei vermi, che vale anche a 2),
# 2 la rovina (le pareti che battono, la sentinella spenta, l'alveo piccolo).
# Il cuore a 3 è il nucleo del Gradone con l'eco dello scavo (Media): chiude il passo con il grado 2.
# I preparativi del passo 5 aiutano: la strada di Tobol (accademia.strada) rende Facile la frana, l'attrezzatura dei
# Raschiatori (accademia.attrezzi) toglie le Ferite della galleria, i calchi (accademia.calchi) l'alveo piccolo.
aree:
  - id: accademia-gradone-rosso
    immagine: ambientazione/gradone-rosso
    nome: Il Gradone Rosso
    sommario: "La scarpata di arenaria a monte del Torvessa, con il vecchio scavo di Orvald sotto la frana e, ancora più sotto, la rovina da cui è uscita la Vecchia."
    spedizione: { ritorno: superficie-fratturata, soglia: 3, stanze: 3 }
    testo: |
      Il Gradone Rosso è una scarpata di arenaria alta quanto dieci case, a monte del Torvessa, che il vento del nord e le piogge sfogliano a strati sottili
      come le pagine di un libro bagnato. Ai piedi della scarpata ci sono i
      cumuli di sabbia rossa delle frane vecchie, e in mezzo ai cumuli i
      pali marci del campo di trent'anni fa. Sotto il campo si apre lo scavo
      del centoventi, una galleria puntellata che scende nella roccia, e in
      fondo alla galleria comincia la rovina dei Precursori, con le pareti di
      pietra nera che non si sfogliano mai.

storylet:
  # ------------------------------------------------------------ l'ingresso, nella Superficie
  - id: accademia-la-scarpata-del-gradone
    immagine: ambientazione/gradone-rosso
    titolo: La scarpata del Gradone
    sommario: "Il carro di Orvald si ferma dove finisce la strada. Da qui in avanti c'è soltanto l'arenaria rossa."
    luogo: Superficie Fratturata, ai piedi del Gradone Rosso
    area: superficie-fratturata
    requisiti: [fazione.accademia == 5]
    testo: |
      Il carro si ferma dove la strada lungo il Torvessa diventa un sentiero
      di sabbia rossa, e il mulo si rifiuta di andare oltre con un'ostinazione
      che Orvald dice di rispettare. Davanti a voi la scarpata del Gradone
      sale fino al cielo, a strati, con le radici degli arbusti scoperte in
      cima. Dove una volta c'era il sentiero c'è una frana larga come una
      piazza.

      Orvald pianta la tenda accanto al carro, con movimenti che le mani
      ricordano meglio di lui. «Io aspetto qui» dice. «Le ginocchia non sono
      più quelle del centoventi, e qualcuno deve tenere acceso il fuoco per
      quando tornate.» Besk si carica i quaderni sulla schiena e ti guarda.

      {atletica Media} Puoi salire per la frana, dove la sabbia scivola, o
      per i fianchi, dove la roccia regge. Le gambe preferiscono la roccia,
      e anche la testa.

      {empatia Media} Orvald ha detto che aspetta per le ginocchia. Guarda la
      scarpata come si guarda la casa di un amico morto, e non vuole entrarci
      per primo.

      {origine apprendista-raschiatore} Su questa arenaria non ti fideresti di
      un chiodo, e infatti Dragna l'aveva detto. Ti viene da controllare due
      volte le corde, e lo fai.
    opzioni:
      - testo: "Salire al Gradone con Besk"
        descrizione: "Orvald aspetta al campo con il fuoco acceso. Lo scavo è sotto la frana."
        costo: 1
        esito:
          titolo: La sabbia rossa
          testo: |
            Salite verso la frana con la sabbia che vi entra negli stivali a ogni
            passo, Besk davanti con il quaderno già aperto. Quando ti volti, il
            fumo del fuoco di Orvald sale dritto nell'aria ferma, e lui è seduto
            accanto con la piccozza sulle ginocchia.
          vai: accademia-gradone-rosso
      - testo: "Tornare in città e partire un altro giorno"
        descrizione: "Il Gradone aspetta da trent'anni. Può aspettare ancora."
        costo: 0
        esito:
          titolo: Il carro indietro
          testo: |
            Dici a Orvald che preferisci tornare con la luce giusta, e lui
            smonta la tenda senza una parola. Sulla strada del ritorno il mulo
            cammina molto più volentieri.

  # ------------------------------------------------------------ 0 · l'avvicinamento
  - id: accademia-gradone-la-frana
    immagine: ambientazione/gradone-rosso
    titolo: La frana di arenaria
    sommario: "Dove c'era il sentiero del mulo c'è una frana ripida di sabbia rossa che si muove sotto i piedi."
    luogo: Il Gradone Rosso, la frana
    area: accademia-gradone-rosso
    ripetibile: true
    requisiti: [fazione.accademia == 5, profondita.accademia-gradone-rosso == 0]
    testo: |
      La frana è un pendio di sabbia rossa e lastre sfogliate, largo quanto
      una piazza, che sale fino a una cengia sotto cui si vede la bocca nera
      dello scavo. Ogni volta che qualcuno ci mette un piede, una lingua di
      sabbia scivola giù con un fruscio secco. Sul lato sinistro, dove la
      roccia regge ancora, si intravedono i gradini scavati del vecchio
      sentiero del mulo, interrotti a metà da un salto di due uomini.

      {percezione Facile} La sabbia scivola meno dove ci sono le lastre
      grandi. Saltando dall'una all'altra si sale senza toccarla quasi mai.

      Besk si toglie gli occhiali e li infila nella camicia, poi si lega il
      quaderno alla cintura con lo spago.
    opzioni:
      - testo: "Risalire la frana di lastra in lastra"
        descrizione: "La sabbia scivola, le lastre grandi reggono. Bisogna saltare bene."
        quando: [accademia.strada == 0]
        prova: { attributo: fisico, abilita: atletica, difficolta: Media }
        successo:
          titolo: La cengia
          testo: |
            Sali di lastra in lastra con Besk dietro che mette i piedi dove li
            hai messi tu. A metà una lastra si muove e tu sei già su quella
            dopo. Arrivate alla cengia con le ginocchia rosse di sabbia e la
            bocca dello scavo davanti.
          pe: { atletica: 4 }
          effetti: { profondita.accademia-gradone-rosso: 1 }
        fallimento:
          titolo: Giù con la sabbia
          testo: |
            La lastra su cui ti appoggi decide di partire, e tu parti con lei.
            Ti fermi in fondo alla frana, sdraiato nella sabbia, con un gomito
            sbucciato e Besk che ti chiama dall'alto.
          effetti: { ferite: 0.5 }

      - testo: "Seguire il giro della mappa di Tobol"
        descrizione: "Sulla copia che hai fatto con Tobol la frana si gira a destra, per un canalone che sale piano."
        quando: [accademia.strada >= 1]
        prova: { attributo: fisico, abilita: atletica, difficolta: Facile }
        successo:
          titolo: Il canalone
          testo: |
            Il canalone della mappa c'è davvero. È stretto e in ombra, con una scalinata
            naturale di lastre che nessuna pioggia ha ancora portato via.
            Arrivate alla cengia senza nemmeno sporcarvi. Besk dice che Tobol va
            pagato il doppio.
          pe: { atletica: 3 }
          effetti: { profondita.accademia-gradone-rosso: 1 }
        fallimento:
          titolo: Il canalone sbagliato
          testo: |
            Sbagli canalone, perché ce ne sono due e la mappa ne segna uno, e
            torni indietro con le gambe dure dopo un'ora di salita inutile.
          effetti: { ferite: 0.5 }

      - testo: "Saltare dal sentiero del mulo"
        descrizione: "I gradini di Orvald arrivano a metà, poi c'è un salto di due uomini. Di là il sentiero porta dritto dentro lo scavo."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Difficile }
        successo:
          titolo: Il salto
          testo: |
            Prendi la rincorsa sui gradini del mulo e salti il vuoto, e
            atterri dall'altra parte con le mani sulla roccia viva. Besk passa
            con la corda, imprecando in una lingua che non è la tua. Di là il sentiero prosegue intero e vi porta sopra la cengia e poi giù, fin dentro la galleria dello scavo.
          pe: { acrobazia: 6 }
          effetti: { profondita.accademia-gradone-rosso: 2 }
        fallimento:
          titolo: Il salto corto
          testo: |
            Il salto è corto di un palmo. Ti aggrappi al bordo con le dita e
            Besk ti tira su per la cintura con la faccia rossa per lo sforzo. Per un bel pezzo nessuno dei due parla.
          effetti: { ferite: 1 }

  - id: accademia-gradone-il-mulo-di-orvald
    immagine: ambientazione/gradone-rosso
    titolo: Il mulo di Orvald
    sommario: "Il mulo del carro è tornato indietro da solo, e adesso ti segue a distanza come se aspettasse un'offerta."
    luogo: Il Gradone Rosso, ai piedi della scarpata
    area: accademia-gradone-rosso
    ripetibile: true
    requisiti: [fazione.accademia == 5, profondita.accademia-gradone-rosso == 0]
    testo: |
      Il mulo del carro si è slegato da solo, a quanto pare con i denti, e vi
      ha seguiti fino ai piedi della scarpata. Adesso sta fermo a dieci passi,
      con le orecchie in avanti, e guarda la frana come una vecchia conoscente. Ha le ginocchia segnate da vecchie cicatrici. Orvald, dal
      campo, vi grida che quel mulo è nipote di quello del centoventi e che
      la strada la sa.

      {addestrare-animali Media} Le orecchie in avanti vogliono dire che ha
      voglia di andare. Basta non tirarlo, e lasciargli credere che l'idea
      sia sua.

      {cavalcare Facile} Una bestia così si monta senza sella, con una mano
      nella criniera, e su un pendio sa dove mettere gli zoccoli meglio di
      qualunque stivale.
    opzioni:
      - testo: "Lasciarsi portare dal mulo"
        descrizione: "Un mulo che conosce la strada vale una mappa. Bisogna convincerlo a fartela vedere."
        prova: { attributo: sociale, abilita: addestrare-animali, difficolta: Media }
        successo:
          titolo: Il nipote del mulo
          testo: |
            Gli parli piano e gli offri una mela, e lui la prende con
            delicatezza. Poi si avvia da solo verso il fianco della scarpata,
            per un sentiero di capre che nessuna mappa segna, e voi gli andate
            dietro. Vi lascia sulla cengia, davanti alla bocca dello scavo, e
            torna giù al campo senza voltarsi.
          pe: { addestrare-animali: 5 }
          effetti: { profondita.accademia-gradone-rosso: 1 }
        fallimento:
          titolo: La mela
          testo: |
            Il mulo si mangia la mela e torna al campo, dove Orvald gli gratta
            la fronte. Dalla scarpata vedi Orvald ridere, ed è la prima volta da
            quando siete partiti.

      - testo: "Montarlo e salire in groppa"
        descrizione: "Senza sella e con una mano nella criniera. Se il mulo è d'accordo, si sale in un attimo."
        prova: { attributo: fisico, abilita: cavalcare, difficolta: Media }
        successo:
          titolo: Senza sella
          testo: |
            Il mulo ti lascia salire e poi parte su per il fianco della scarpata
            a passo sicuro, con Besk attaccata alla coda. In cima ti scrolla giù
            senza cattiveria e torna al campo. La cengia è lì, e la bocca dello
            scavo anche.
          pe: { cavalcare: 5 }
          effetti: { profondita.accademia-gradone-rosso: 1 }
        fallimento:
          titolo: Nella sabbia
          testo: |
            Il mulo fa due passi, poi si ferma di colpo e tu prosegui da solo,
            per un tratto breve e in volo. Atterri nella sabbia rossa, e il mulo
            ti guarda con una curiosità educata.
          effetti: { ferite: 0.5 }

      - testo: "Aggirare la scarpata a piedi"
        descrizione: "C'è un giro lungo dalla parte del fiume, che chiede soltanto tempo e gambe buone."
        costo: 2
        esito:
          titolo: Il giro del fiume
          testo: |
            Aggirate la scarpata dalla parte del Torvessa, in mezzo alle canne alte fino al petto, e risalite per un fianco dove la roccia è salda. Ci
            mettete mezza giornata. Quando arrivate alla cengia avete i piedi
            fradici e il sole basso, e la bocca dello scavo è già in ombra.
          pe: { resistenza: 2 }
          effetti: { profondita.accademia-gradone-rosso: 1 }

  # ------------------------------------------------------------ 1 · lo scavo del centoventi
  - id: accademia-gradone-il-campo-abbandonato
    immagine: ambientazione/gradone-rosso
    titolo: Il campo abbandonato
    sommario: "Sulla cengia, davanti allo scavo, ci sono ancora le tende marcite del centoventi e le casse con le etichette di Orvald."
    luogo: Il Gradone Rosso, il campo del centoventi
    area: accademia-gradone-rosso
    ripetibile: true
    requisiti: [fazione.accademia == 5, profondita.accademia-gradone-rosso == 1]
    testo: |
      Sulla cengia ci sono ancora i resti del campo di trent'anni fa. Due
      tende sono crollate sotto il peso della sabbia, e la tela si sbriciola
      a toccarla, mentre la terza, più in disparte, è rimasta in piedi per
      metà. Ci sono casse di legno con le etichette scritte dalla grafia
      stretta di Orvald, *corde*, *gesso*, *viveri, non toccare*, e una
      pentola rovesciata con dentro un nido di vespe abbandonato.

      {percezione Media} La tenda in disparte ha i paletti piantati più
      fondi. Chi ci dormiva voleva che restasse in piedi a lungo.

      Besk apre la cassa del gesso e ne tira fuori un mozzicone, consumato
      su un lato solo. «Questo l'ha usato qualcuno che scriveva tanto»
      dice.

      {medicina Facile fallita} L'odore di muffa della tela ti arriva in
      gola e ti fa tossire, e la tosse non ti passa per un pezzo.
    opzioni:
      - testo: "Frugare nella tenda in disparte"
        descrizione: "Quella di Severo, a giudicare dai paletti. Se ha lasciato qualcosa, è lì."
        prova: { attributo: mentale, abilita: percezione, difficolta: Media }
        successo:
          titolo: Le pagine del centoquaranta
          testo: |
            Sotto la branda della tenda, avvolto in una tela cerata, c'è un
            fascio di pagine tagliate con il temperino. Sono le pagine del
            diario di Orvald dell'anno centoquaranta, e Severo le ha portate qui,
            sul posto da cui era partito tutto. L'ultima riga è con la grafia di
            Severo, più fitta di quella di Orvald. *La formula non è nostra.
            L'abbiamo soltanto ricordata.* Le avvolgi di nuovo nella tela e le
            metti nella giubba, contro il petto.
          pe: { percezione: 5 }
          imposta: { accademia.diario: 1 }
          effetti: { profondita.accademia-gradone-rosso: 1, informazioni.segreto: 1 }
        fallimento:
          titolo: Le vespe
          testo: |
            Sollevi la tela della tenda, e da sotto la branda esce un vespaio
            vivo, altro che abbandonato. Scappi giù dalla cengia con Besk, e
            quando tornate le vespe sono ancora lì a fare la guardia.
          effetti: { ferite: 0.5 }

      - testo: "Prendere il gesso e le corde dalle casse"
        descrizione: "Le corde di trent'anni fa sono marce. Il gesso e i chiodi d'ottone invece servono ancora, e poi si passa oltre, verso lo scavo."
        esito:
          titolo: Le casse di Orvald
          testo: |
            Prendi dalle casse il gesso e una manciata di chiodi d'ottone che non
            hanno preso la ruggine, e lasci le corde dove sono, marce. Besk segna
            tutto sul quaderno, perché Orvald vorrà sapere che cosa avete
            toccato. La bocca dello scavo vi aspetta a dieci passi.
          effetti: { profondita.accademia-gradone-rosso: 1 }

  - id: accademia-gradone-la-galleria-puntellata
    immagine: ambientazione/gradone-rosso
    titolo: La galleria puntellata
    sommario: "Lo scavo del centoventi scende nella roccia fra pali di legno marciti, e a ogni passo cade un po' di sabbia."
    luogo: Il Gradone Rosso, lo scavo
    area: accademia-gradone-rosso
    ripetibile: true
    requisiti: [fazione.accademia == 5, profondita.accademia-gradone-rosso == 1]
    testo: |
      La galleria dello scavo scende nella roccia con una pendenza leggera,
      larga quanto un carro, e i pali che la puntellano sono neri di muffa e
      piegati sotto il peso. Dal soffitto cade un filo di sabbia continuo,
      come in una clessidra rovesciata. In fondo, dove la galleria incontra la
      pietra nera dei Precursori, si vede un riflesso azzurro.

      {tecnologia Media} I pali reggono ancora perché si appoggiano l'uno
      all'altro. Se ne togli uno, cedono tutti in fila.

      {origine fuggiasco-di-ghoran} Nelle miniere di Ghoran le gallerie
      puntellate così le passavi in fila, con la testa bassa e la paura di
      toccare il legno. Le spalle si piegano da sole.

      Besk ti tiene la lampada sopra la spalla e trattiene il fiato.
    opzioni:
      - testo: "Rinforzare i pali prima di passare"
        descrizione: "Due pali nuovi nei punti giusti, e la galleria regge per il tempo di passare."
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Media }
        successo:
          titolo: I due pali
          testo: |
            Trovi i due punti dove i pali vecchi spingono di più e ci infili di
            traverso due assi delle casse del campo, a colpi di pietra. La
            sabbia smette di cadere. Passate in fondo alla galleria senza
            parlare, e senza toccare niente.
          pe: { tecnologia: 5 }
          effetti: { profondita.accademia-gradone-rosso: 1 }
        fallimento:
          titolo: Il palo sbagliato
          testo: |
            Il primo palo che tocchi era quello sbagliato. Tre pali cedono in
            fila e una cascata di sabbia ti prende sulla schiena, e Besk ti tira
            fuori per le caviglie.
          effetti: { ferite: 1 }

      - testo: "Passare di corsa"
        descrizione: "Trenta passi di galleria. Se corri, la sabbia ti cade dietro."
        quando: [accademia.attrezzi == 0]
        prova: { attributo: fisico, abilita: atletica, difficolta: Media }
        successo:
          titolo: Trenta passi
          testo: |
            Corri piegato in due con la lampada in mano, e dietro di te un palo
            cede e la galleria si riempie di polvere rossa. Besk arriva un
            momento dopo, bianca di sabbia dalla testa ai piedi, e ride per il
            nervoso.
          pe: { atletica: 4 }
          effetti: { profondita.accademia-gradone-rosso: 1, ferite: 0.5 }
        fallimento:
          titolo: La sabbia addosso
          testo: |
            A metà galleria un palo cede proprio sopra di te. La sabbia ti
            butta a terra e ti riempie la bocca, e quando ti rialzi sei di nuovo
            all'imbocco, senza sapere come.
          effetti: { ferite: 1 }

      - testo: "Passare legati con le corde dei Raschiatori"
        descrizione: "Le corde e l'imbrago di Dragna servono a questo. Con un capo legato fuori e l'altro addosso, se crolla qualcosa ti tirano fuori."
        quando: [accademia.attrezzi >= 1]
        esito:
          titolo: Il nodo dei Raschiatori
          testo: |
            Leghi un capo della corda a un masso fuori dall'imbocco e l'altro
            all'imbrago, e passi la galleria tenendo la corda tesa. A metà cade
            un palo, e la sabbia ti scivola addosso senza fermarti. In fondo ti
            sleghi e tiri la corda per Besk, che passa come su un ponte.
          pe: { atletica: 3 }
          effetti: { profondita.accademia-gradone-rosso: 1 }

  - id: accademia-gradone-il-nido-dei-vermi
    immagine: bestiario/verme-carogna
    titolo: Il nido dei vermi
    sommario: "In una galleria laterale dello scavo qualcosa di pallido si muove nel buio, e l'odore è quello della carne lasciata al sole."
    luogo: Il Gradone Rosso, una galleria laterale
    area: accademia-gradone-rosso
    ripetibile: true
    requisiti: [fazione.accademia == 5, profondita.accademia-gradone-rosso >= 1, profondita.accademia-gradone-rosso <= 2]
    testo: |
      Sulla destra si apre una galleria laterale dello scavo, così bassa che bisogna chinarsi, e da lì esce un odore dolciastro di carne andata a male. La lampada di Besk ci
      arriva appena. Sul pavimento ci sono ossa di capra spolpate e, in
      fondo, due forme pallide lunghe quanto un uomo, arrotolate su se
      stesse, con una corona di tentacoli intorno alla bocca.

      {medicina Media} Il tocco di quei tentacoli irrigidisce i muscoli. Chi
      ne viene preso resta fermo e sente tutto, e i vermi lo sanno.

      {furtivita Facile} Dormono, e i vermi carogna dormono profondo. Basta
      passare lungo la parete opposta, dove la lampada non li sfiora.
    opzioni:
      - testo: "Affrontare i vermi"
        descrizione: "Due vermi carogna in una galleria stretta. Meglio colpirli prima che si sveglino del tutto."
        combattimento: accademia-il-nido-dei-vermi
        vittoria:
          titolo: La galleria pulita
          testo: |
            L'ultimo verme si ritira nel suo buco e smette di muoversi. Besk ti
            aiuta a scrollarti di dosso la bava, che puzza in un modo che ti
            resterà nel naso per giorni. Oltre il nido la galleria scende verso
            la pietra nera.
          effetti: { profondita.accademia-gradone-rosso: 1 }
        sconfitta:
          titolo: Il tocco
          testo: |
            Un tentacolo ti sfiora il collo, e le gambe smettono di risponderti.
            Besk ti trascina fuori dalla galleria per le ascelle, e ci vuole
            un'ora prima che tu possa muovere le dita.
          effetti: { ferite: 1 }

      - testo: "Passare lungo la parete, al buio"
        descrizione: "Con la lampada coperta si passa lungo la parete opposta, tenendoci sopra la mano."
        prova: { attributo: fisico, abilita: furtivita, difficolta: Media }
        successo:
          titolo: Lungo la parete
          testo: |
            Copri la lampada con la giubba e passi lungo la parete opposta, con
            Besk che ti tiene una mano sulla spalla. A metà un verme si srotola
            nel sonno e tu resti fermo finché non si riarrotola. Poi siete oltre,
            dove la galleria scende verso la pietra nera.
          pe: { furtivita: 5 }
          effetti: { profondita.accademia-gradone-rosso: 1 }
        fallimento:
          titolo: L'osso
          testo: |
            Pesti un osso di capra, che si spezza con un rumore secco. I vermi si srotolano tutti e due nello stesso momento. Tu e Besk tornate indietro di corsa fino alla galleria principale.
          effetti: { ferite: 0.5 }

  # ------------------------------------------------------------ 2 · la rovina
  - id: accademia-gradone-le-pareti-che-battono
    immagine: ambientazione/rovine-dei-precursori
    titolo: Le pareti che battono
    sommario: "Dove finisce l'arenaria comincia la pietra nera dei Precursori, e la pietra nera batte come un cuore."
    luogo: Il Gradone Rosso, la rovina
    area: accademia-gradone-rosso
    ripetibile: true
    requisiti: [fazione.accademia == 5, profondita.accademia-gradone-rosso == 2]
    testo: |
      In fondo allo scavo l'arenaria finisce di colpo, e comincia un
      corridoio di pietra nera liscia, senza giunture, che scende verso il
      basso con una curva lunga. Le pareti sono tiepide al tatto. Ogni tanto ci passa dentro un battito con due colpi brevi seguiti da uno lungo, e la luce della lampada trema.

      {magia Media} È lo stesso battito della Vecchia, molto più debole, come
      un'eco che torna da lontano dopo tanti anni.

      Besk si ferma e apre il quaderno per contare. Poi lo chiude, perché le tremano le mani.

      {resilienza Media fallita} A ogni battito ti sembra che qualcuno ti
      chiami per nome da dietro la parete, e ti volti ogni volta.
    opzioni:
      - testo: "Andare avanti contando i battiti"
        descrizione: "Contare tiene la testa occupata, e a ogni conto corrisponde un passo."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Media }
        successo:
          titolo: Un passo per ogni conto
          testo: |
            Conti a voce bassa, e fai un passo per ogni battito. Besk conta con
            te, e le vostre due voci nel corridoio coprono quella che sembra
            venire da dietro la pietra. In fondo alla curva il corridoio si
            allarga.
          pe: { resilienza: 5 }
          effetti: { profondita.accademia-gradone-rosso: 1 }
        fallimento:
          titolo: Il nome
          testo: |
            Al centesimo battito ti senti chiamare per nome con la voce di tua
            madre, e torni indietro di corsa fino all'arenaria. Ti ci vuole un
            pezzo per smettere di tremare.
          effetti: { tormento: 0.5 }

      - testo: "Tapparsi le orecchie e correre"
        descrizione: "Il battito si sente con le orecchie. Con la cera nelle orecchie, forse meno."
        prova: { attributo: fisico, abilita: resistenza, difficolta: Media }
        successo:
          titolo: La cera
          testo: |
            Ti tappi le orecchie con la cera della lampada e corri giù per la
            curva con il fiato corto. Il battito ti arriva lo stesso, attraverso
            i piedi, ma non ti chiama più. In fondo ti levi la cera e trovi Besk
            che ti aspettava, pallida.
          pe: { resistenza: 5 }
          effetti: { profondita.accademia-gradone-rosso: 1 }
        fallimento:
          titolo: Attraverso i piedi
          testo: |
            Il battito ti entra dai piedi, e a metà curva ti fermi senza fiato
            con la fronte contro la pietra tiepida. Besk ti riporta indietro
            tenendoti per la manica.
          effetti: { tormento: 0.5 }

  - id: accademia-gradone-la-sentinella-spenta
    immagine: bestiario/salvaguardia-precursori
    titolo: La sentinella spenta
    sommario: "In una nicchia del corridoio sta in piedi una macchina della Salvaguardia, alta quanto un uomo, con la testa girata all'indietro."
    luogo: Il Gradone Rosso, la rovina
    area: accademia-gradone-rosso
    ripetibile: true
    requisiti: [fazione.accademia == 5, profondita.accademia-gradone-rosso == 2]
    testo: |
      In una nicchia del corridoio c'è un camminatore della Salvaguardia,
      una macchina alta quanto un uomo e senza volto, con la testa girata
      all'indietro e le braccia lungo i fianchi. È coperto di polvere rossa.
      Sul petto ha una placca con una croce di gesso, tracciata da una mano umana molto tempo fa.

      {tecnologia Media} Sulla nuca ha un pannello con quattro viti di
      lyssan. Chi le ha messe voleva che si potessero togliere a mano.

      Quando gli passate davanti, la testa gira di un grado verso di voi, con
      un ronzio sottile.

      {armi-da-mischia Facile} Le giunture delle ginocchia sono scoperte. Se
      si muove, è lì che si ferma.
    opzioni:
      - testo: "Spegnerla dal pannello della nuca"
        descrizione: "Quattro viti di lyssan e un meccanismo che qualcuno ha già aperto una volta."
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Media }
        successo:
          titolo: Le quattro viti
          testo: |
            Giri attorno alla macchina senza fretta e sviti le quattro viti con
            le dita. Dentro il pannello c'è un cristallo grande come un uovo,
            che stacchi. La testa smette di ronzare. Nel cristallo c'è ancora
            un po' di carica.
          pe: { tecnologia: 5 }
          effetti: { profondita.accademia-gradone-rosso: 1, cristalli.cristallo-sterile: 1 }
        fallimento:
          titolo: La testa che gira
          testo: |
            Alla terza vite la testa gira del tutto verso di te, e tu ti tiri
            indietro di scatto. La macchina resta ferma dov'è, e per stavolta lasci stare il pannello.
          effetti: { tormento: 0.5 }

      - testo: "Chiuderla con il Sigillo"
        descrizione: "Il Sigillo chiude le serrature di Mana. Anche quelle che tengono acceso un camminatore."
        incantesimo: sigillo
        prova: { attributo: mentale, abilita: magia, difficolta: Facile }
        successo:
          titolo: La croce di gesso
          testo: |
            Posi la mano sulla croce di gesso e chiudi il Mana della macchina
            dentro di lei. Il ronzio si spegne. Sotto il gesso, sulla placca, c'è
            un segno inciso uguale a quelli dei calchi del Gradone.
          pe: { magia: 4 }
          effetti: { profondita.accademia-gradone-rosso: 1 }
        fallimento:
          titolo: Il Mana che torna
          testo: |
            Il Mana ti torna indietro dalla placca e ti fa saltare la mano via.
            La testa del camminatore gira verso di te e resta lì.
          effetti: { tormento: 0.5 }

      - testo: "Passarle davanti senza fermarsi"
        descrizione: "Forse si limita a guardare chi passa, e forse no."
        prova: { attributo: fisico, abilita: furtivita, difficolta: Media }
        successo:
          titolo: Il ronzio dietro
          testo: |
            Le passi davanti a passo regolare, senza guardarla. Il ronzio ti
            segue per un tratto e poi tace. Besk ti raggiunge dopo, camminando
            all'indietro per non perderla d'occhio.
          pe: { furtivita: 4 }
          effetti: { profondita.accademia-gradone-rosso: 1 }
        fallimento:
          titolo: Il braccio
          testo: |
            La macchina allunga un braccio e ti sbarra il passo, senza colpirti.
            Torni indietro, e il braccio torna lungo il fianco.
          effetti: { tormento: 0.5 }

      - testo: "Abbatterla"
        descrizione: "È una macchina vecchia e sola. Se si sveglia, meglio che sia ferma per sempre."
        combattimento: accademia-la-sentinella-spenta
        vittoria:
          titolo: La macchina a terra
          testo: |
            La macchina cade in ginocchio e poi in avanti, con la testa ancora
            girata. Dal petto le stacchi il cristallo che la teneva accesa.
          effetti: { profondita.accademia-gradone-rosso: 1, cristalli.cristallo-sterile: 1, reliquie.scheggia: 1 }
        sconfitta:
          titolo: La nicchia
          testo: |
            Il camminatore ti spinge contro la parete con una forza da mulino,
            e poi torna nella sua nicchia. Besk ti aiuta a rialzarti.
          effetti: { ferite: 1 }

  - id: accademia-gradone-l-alveo-piccolo
    immagine: ambientazione/rovine-dei-precursori
    titolo: L'alveo piccolo
    sommario: "Una sala laterale con un piccolo alveo vuoto nel pavimento e le pareti coperte di incisioni."
    luogo: Il Gradone Rosso, una sala laterale della rovina
    area: accademia-gradone-rosso
    ripetibile: true
    requisiti: [fazione.accademia == 5, profondita.accademia-gradone-rosso == 2]
    testo: |
      La sala laterale è rotonda, con il soffitto basso, e al centro del
      pavimento c'è un alveo vuoto, una conca liscia della forma di un
      cristallo grande come un braccio. Le pareti sono coperte di incisioni
      fitte, e qualcuno ci ha passato sopra il gesso per leggerle meglio.
      Sul pavimento ci sono pezzi di metallo inciso staccati dal muro.

      {accademiche Media} Le incisioni ripetono una stessa sequenza di segni,
      con piccole varianti, come un esercizio scritto cento volte.

      {percezione Facile} Sotto le incisioni, all'altezza del ginocchio,
      qualcuno ha scritto a gesso una data, *centoquaranta*.
    opzioni:
      - testo: "Leggere le incisioni con i calchi della Biblioteca"
        descrizione: "I calchi di Mattias dicono dove guardare. Con quelli, le incisioni si leggono in fretta."
        quando: [accademia.calchi >= 1]
        prova: { attributo: mentale, abilita: accademiche, difficolta: Facile }
        successo:
          titolo: Le soglie
          testo: |
            Con la copia di Mattias aperta sulle ginocchia, le incisioni si
            ordinano da sole. Indicano la sala grande, giù per il corridoio, e
            una soglia da non passare con il fuoco acceso. Prendi i frammenti
            incisi più belli e prosegui.
          pe: { accademiche: 4 }
          effetti: { profondita.accademia-gradone-rosso: 1, reliquie.frammento-inciso: 2 }
        fallimento:
          titolo: La copia sbagliata
          testo: |
            Confronti la copia di Mattias con la parete sbagliata, e ci metti
            un'ora a capirlo. Il gesso della lampada intanto si consuma.
          effetti: { tormento: 0.5 }

      - testo: "Leggere le incisioni a occhio"
        descrizione: "Senza i calchi ci vuole più tempo. I segni però si ripetono, e quello che si ripete prima o poi parla."
        prova: { attributo: mentale, abilita: accademiche, difficolta: Media }
        successo:
          titolo: L'esercizio
          testo: |
            Dopo un'ora di confronti capisci che le incisioni sono la stessa frase scritta molte volte, e che indicano la sala grande giù per il
            corridoio. Prendi due frammenti incisi dal pavimento e prosegui.
          pe: { accademiche: 5 }
          effetti: { profondita.accademia-gradone-rosso: 1, reliquie.frammento-inciso: 2 }
        fallimento:
          titolo: Le incisioni ferme
          testo: |
            Dopo un'ora di confronti le incisioni ti sembrano tutte uguali, e lo
            sono. Besk ti dice che il preside ne sarebbe contento.
          effetti: { tormento: 0.5 }

      - testo: "Raccogliere i frammenti e andare avanti"
        descrizione: "I pezzi incisi sul pavimento valgono qualcosa alla collezione di Orvald. Il resto, lo capirà lui."
        esito:
          titolo: Le tasche piene
          testo: |
            Raccogli i frammenti di metallo inciso e te li infili nelle tasche,
            che si fanno pesanti. Besk ricopia in fretta tre righe dalla parete,
            e uscite dalla sala verso il corridoio che scende.
          effetti: { profondita.accademia-gradone-rosso: 1, reliquie.frammento-inciso: 1 }

  # ------------------------------------------------------------ 3 · il cuore: il nucleo del Gradone
  - id: accademia-gradone-il-nucleo
    immagine: ambientazione/rovine-dei-precursori
    titolo: Il nucleo del Gradone
    sommario: "In fondo alla rovina c'è la sala rotonda del disegno di Orvald, con l'alveo vuoto della Vecchia e, al centro, un nucleo di pietra nera."
    luogo: Il Gradone Rosso, la sala del nucleo
    area: accademia-gradone-rosso
    requisiti: [fazione.accademia == 5, profondita.accademia-gradone-rosso >= 3]
    testo: |
      La sala rotonda è quella del disegno di Orvald. Ha la volta altissima e un alveo
      vuoto lungo il pavimento della forma esatta della Vecchia, distesa di
      traverso. Al centro c'è un nucleo di pietra nera grande come un carro,
      liscio, senza venature, che a toccarlo resta muto. Sul pavimento e sulle pareti tutto intorno ci sono segni di gesso fitti, la prima stesura di una formula che qualcuno ha cancellato e riscritto molte volte.

      {magia Media} Il nucleo è freddo. Il Mana c'è, chiuso dentro, come in
      una stanza con la porta murata.

      Quando ti avvicini al nucleo, l'aria davanti a te si increspa e si
      accende di azzurro. Prendono forma due figure di luce. Una è un uomo
      robusto con la barba scura e una piccozza in mano, e lo riconosci
      dalla piega delle spalle. È Orvald, trent'anni fa. L'altro è magro, con
      le dita nere d'inchiostro, e traccia segni nell'aria con un gesso che
      non c'è. Ripetono i gesti dello scavo, e quando ti vedono si voltano
      tutti e due insieme, come davanti a un intruso.

      {empatia Media} L'Orvald giovane ride a una cosa che l'altro ha detto.
      Il preside che aspetta al campo non ride così da anni.

      {origine allievo-di-torvessa} La piega delle spalle è la stessa che fa
      in aula quando sta per fare la domanda a cui nessuno saprà rispondere. Ti viene
      voglia di alzare la mano.

      Besk ti stringe il braccio. «Sono echi» sussurra. «Come quelli
      dell'Arena. Se li tocchi, li tocchi davvero.»
    opzioni:
      - testo: "Affrontare l'eco dello scavo"
        descrizione: "Due echi di luce che difendono uno scavo di trent'anni fa. Picchiano come gente viva."
        combattimento: accademia-l-eco-dello-scavo
        vittoria:
          titolo: La porta chiusa
          testo: |
            Gli echi si sciolgono uno dopo l'altro in una polvere azzurra che
            ricade sui segni di gesso. Appoggi la mano sul nucleo, e capisci
            senza bisogno della magia che la Vecchia non si riattacca. Il nucleo
            si è staccato da solo, molto prima che arrivassero Orvald e Severo,
            e ha chiuso la porta. Ricopi i gessi sul quaderno di Besk e torni al
            campo. Orvald ascolta, poi ti mette in mano la sua piccozza. «Me
            l'ha fatta Bram, la prima volta. Adesso tocca a te tirare fuori le
            cose dalla roccia.» Da domani hai la chiave del laboratorio.
          pe: { armi-da-mischia: 5 }
          almeno: { rep.accademia: 4 }
          effetti: { fazione.accademia: 1, rep.accademia: 1, oggetto.accademia-piccozza-del-centoventi: 1, reperto.sigillato: 1, cristalli.cristallo-sterile: 2 }
          vai: superficie-fratturata
        sconfitta:
          titolo: L'intruso
          testo: |
            L'Orvald giovane ti colpisce con il piatto della piccozza, e l'altro
            ti brucia la spalla con un segno di gesso che scotta. Besk ti
            trascina fuori dalla sala. Tornate al campo di notte, e Orvald vi
            medica senza chiedere niente.
          effetti: { ferite: 1.5, tormento: 0.5 }
          vai: superficie-fratturata

      - testo: "Sciogliere l'eco con l'Esorcismo"
        descrizione: "La Liturgia dell'Albero rimanda gli echi dove devono stare. Due echi stanchi non resistono a lungo."
        incantesimo: esorcismo
        prova: { attributo: mentale, abilita: magia, difficolta: Media }
        successo:
          titolo: Il congedo
          testo: |
            Dici le parole del Velo con il palmo aperto verso di loro, e gli
            echi si fermano a metà di un gesto. Si guardano fra loro e poi guardano te. Poi si sciolgono in una polvere azzurra. Appoggi la mano sul nucleo e
            lo senti chiuso, come una porta murata da dentro. La Vecchia non si
            riattacca. Al campo Orvald ascolta con la testa bassa, poi ti mette
            in mano la sua piccozza del centoventi. «Adesso tocca a te tirare
            fuori le cose dalla roccia» dice. Da domani hai la chiave del
            laboratorio.
          pe: { magia: 5 }
          almeno: { rep.accademia: 4 }
          effetti: { fazione.accademia: 1, rep.accademia: 1, oggetto.accademia-piccozza-del-centoventi: 1, reperto.sigillato: 1, cristalli.cristallo-sterile: 2 }
          vai: superficie-fratturata
        fallimento:
          titolo: Le parole spezzate
          testo: |
            Le parole ti si spezzano in bocca, e gli echi ti vengono addosso
            insieme. Scappi con Besk fino all'arenaria, e la spalla ti brucia per tutta la strada.
          effetti: { ferite: 1, tormento: 0.5 }
          vai: superficie-fratturata

      - testo: "Sciogliere l'eco con il Mana del nucleo"
        descrizione: "Gli echi sono fatti di Mana, e il Mana si può spingere altrove. Ci vuole una mano ferma."
        requisiti: [magia >= 1]
        prova: { attributo: mentale, abilita: magia, difficolta: Media }
        successo:
          titolo: La luce che si spegne
          testo: |
            Appoggi le mani sul nucleo e tiri verso di te la luce degli echi,
            come si tira un filo da un gomitolo. Le figure si sfilacciano e
            spariscono. Sotto le mani il nucleo resta chiuso, una porta murata da
            dentro, e capisci che la Vecchia non si riattacca. Al campo Orvald
            ascolta senza parlare. Poi ti mette in mano la sua piccozza del
            centoventi e ti dice che da domani hai la chiave del laboratorio.
          pe: { magia: 5 }
          almeno: { rep.accademia: 4 }
          effetti: { fazione.accademia: 1, rep.accademia: 1, oggetto.accademia-piccozza-del-centoventi: 1, reperto.sigillato: 1, cristalli.cristallo-sterile: 2 }
          vai: superficie-fratturata
        fallimento:
          titolo: Il filo che tira
          testo: |
            Il filo tira dalla parte sbagliata, e gli echi ti entrano nelle mani
            come acqua gelata. Ti ritrovi fuori dalla sala con Besk che ti
            strofina i polsi.
          effetti: { tormento: 1 }
          vai: superficie-fratturata

      - testo: "Lasciare che la scena finisca e ascoltare"
        descrizione: "Gli echi ripetono quello che è successo. Se resti fermo e li lasci fare, forse lo senti anche tu."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Media }
        successo:
          titolo: Ha chiuso la porta
          testo: |
            Resti fermo accanto all'alveo vuoto, e gli echi smettono di
            guardarti. L'uomo dalle mani nere appoggia il palmo sul nucleo e
            parla all'Orvald giovane, e la voce arriva tardi, come da un'altra
            stanza. «Non dorme. Ha chiuso la porta.» Poi la scena finisce e la
            luce si spegne. Al campo racconti tutto a Orvald, parola per parola.
            Lui ti ascolta con le mani strette sul manico della piccozza, poi te
            la dà. «Severo l'aveva capito subito, e io non l'ho ascoltato» dice.
            Da domani hai la chiave del laboratorio.
          pe: { resilienza: 5 }
          almeno: { rep.accademia: 4 }
          effetti: { fazione.accademia: 1, rep.accademia: 1, oggetto.accademia-piccozza-del-centoventi: 1, reperto.sigillato: 1, cristalli.cristallo-sterile: 2, tormento: 0.5 }
          vai: superficie-fratturata
        fallimento:
          titolo: Troppo vicino
          testo: |
            Gli echi ti passano attraverso, e per un momento ti senti giovane e
            con la barba scura, e poi niente. Ti risvegli sulla cengia, con Besk
            che ti dà acqua dalla borraccia.
          effetti: { tormento: 1 }
          vai: superficie-fratturata
