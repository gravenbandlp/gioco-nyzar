# Il Gradone Rosso, spedizione del passo 6 della quest dell'Accademia (fazione.accademia == 5).
# Ci si entra dalla Superficie Fratturata con «La scarpata del Gradone». Le stanze vanno in fasce di profondità,
# e una stanza superata non ricompare nella stessa visita:
# 0 l'avvicinamento (la frana di arenaria, che sul sentiero del mulo vale due punti; il mulo di Orvald),
# 1 lo scavo del centoventi (il campo abbandonato, che dà le pagine del centoquaranta; la galleria puntellata;
#   il nido dei vermi, che vale anche a 2),
# 2 la rovina (le pareti che battono, la sentinella spenta, l'alveo piccolo).
# Il cuore a 3 è il nucleo del Gradone con l'eco dello scavo (Media): chiude il passo con il grado 2.
# I preparativi del passo 5 aiutano: la strada di Tobol (accademia.strada) rende Facile la frana, l'attrezzatura dei
# Raschiatori (accademia.attrezzi) toglie le Ferite della galleria, i calchi (accademia.calchi) l'alveo piccolo.
aree:
  - id: accademia-gradone-rosso
    immagine: ambientazione/gradone-rosso
    nome: Il Gradone Rosso
    sommario: "La scarpata sul Torvessa, con lo scavo di Orvald e la rovina da cui è uscita la Vecchia."
    spedizione: { ritorno: superficie-fratturata, soglia: 3, stanze: 3 }
    testo: |
      Il Gradone Rosso è una scarpata di arenaria alta quanto dieci case, a monte del Torvessa, che le piogge sfogliano a strati come un libro bagnato. Ai
      piedi ci sono le frane vecchie e i pali marci del campo di trent'anni fa; sotto il campo lo scavo del centoventi scende nella roccia fino alla rovina
      dei Precursori, dove la pietra nera non si sfoglia mai.

storylet:
  # ------------------------------------------------------------ l'ingresso, nella Superficie
  - id: accademia-la-scarpata-del-gradone
    immagine: ambientazione/gradone-rosso
    titolo: La scarpata del Gradone
    sommario: "Il carro di Orvald si ferma dove finisce la strada, davanti all'arenaria rossa."
    luogo: Superficie Fratturata, ai piedi del Gradone Rosso
    area: superficie-fratturata
    requisiti: [fazione.accademia == 5]
    testo: |
      Il carro si ferma dove la strada lungo il Torvessa diventa sabbia rossa.
      La scarpata del Gradone sale a strati, e dove c'era il sentiero c'è una
      frana larga come una piazza.

      «Io aspetto qui con la tenda e il fuoco, le ginocchia non sono più
      quelle del centoventi» dice Orvald, mentre Besk si carica i quaderni
      sulla schiena.

      {empatia Media} Orvald guarda la scarpata come la casa di un amico
      morto, e non vuole entrarci per primo.

      {origine apprendista-raschiatore} Su questa arenaria Dragna non si
      fiderebbe di un chiodo, e tu controlli due volte le corde.
    opzioni:
      - testo: "Salire al Gradone con Besk"
        descrizione: "Orvald aspetta al campo, e lo scavo è sotto la frana."
        costo: 1
        esito:
          titolo: La sabbia rossa
          testo: |
            Salite verso la frana con la sabbia negli stivali. Quando ti volti, il
            fumo del fuoco di Orvald sale dritto nell'aria ferma.
          vai: accademia-gradone-rosso
      - testo: "Tornare in città e partire un altro giorno"
        descrizione: "Il Gradone aspetta da trent'anni e può aspettare ancora."
        costo: 0
        esito:
          titolo: Il carro indietro
          testo: |
            Orvald smonta la tenda senza una parola, e sulla strada del ritorno il
            mulo cammina molto più volentieri.

  # ------------------------------------------------------------ 0 · l'avvicinamento
  - id: accademia-gradone-la-frana
    immagine: ambientazione/gradone-rosso
    titolo: La frana di arenaria
    sommario: "Dove c'era il sentiero del mulo c'è una frana di sabbia rossa che si muove sotto i piedi."
    luogo: Il Gradone Rosso, la frana
    area: accademia-gradone-rosso
    ripetibile: true
    requisiti: [fazione.accademia == 5, profondita.accademia-gradone-rosso == 0]
    testo: |
      La frana di sabbia rossa e lastre sfogliate sale fino a una cengia,
      sotto cui si apre la bocca nera dello scavo, e a ogni passo scivola
      giù con un fruscio secco. Sul lato sinistro restano i gradini del
      vecchio sentiero del mulo, interrotti a metà da un salto di due
      uomini.

      {percezione Facile} La sabbia scivola meno dove ci sono le lastre
      grandi, e saltando dall'una all'altra non la tocchi quasi mai.
    opzioni:
      - testo: "Risalire la frana di lastra in lastra"
        descrizione: "Le lastre grandi reggono, se sai dove saltare."
        quando: [accademia.strada == 0]
        prova: { attributo: fisico, abilita: atletica, difficolta: Media }
        successo:
          titolo: La cengia
          testo: |
            Sali di lastra in lastra con Besk che mette i piedi dove li hai messi
            tu, e arrivate alla cengia con le ginocchia rosse di sabbia.
          pe: { atletica: 4 }
          effetti: { profondita.accademia-gradone-rosso: 1 }
        fallimento:
          titolo: Giù con la sabbia
          testo: |
            La lastra su cui ti appoggi parte, e tu scivoli con lei fino in fondo
            alla frana sbucciandoti un gomito.
          effetti: { ferite: 0.5 }

      - testo: "Seguire il giro della mappa di Tobol"
        descrizione: "Sulla copia fatta con Tobol la frana si aggira a destra, per un canalone."
        quando: [accademia.strada >= 1]
        prova: { attributo: fisico, abilita: atletica, difficolta: Facile }
        successo:
          titolo: Il canalone
          testo: |
            Il canalone della mappa c'è davvero, con una scalinata naturale di lastre
            in ombra. Besk dice che Tobol va pagato il doppio.
          pe: { atletica: 3 }
          effetti: { profondita.accademia-gradone-rosso: 1 }
        fallimento:
          titolo: Il canalone sbagliato
          testo: |
            Sbagli canalone, perché ce ne sono due e la mappa ne segna uno, e
            perdi un'ora di salita.
          effetti: { ferite: 0.5 }

      - testo: "Saltare dal sentiero del mulo"
        descrizione: "Oltre il salto di due uomini, il sentiero di Orvald porta allo scavo."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Difficile }
        successo:
          titolo: Il salto
          testo: |
            Prendi la rincorsa e atterri dall'altra parte con le mani sulla roccia viva. Besk passa con la corda, imprecando in una lingua che non è la tua, e il sentiero
            vi porta dentro la galleria dello scavo.
          pe: { acrobazia: 6 }
          effetti: { profondita.accademia-gradone-rosso: 2 }
        fallimento:
          titolo: Il salto corto
          testo: |
            Il salto è corto di un palmo. Ti aggrappi al bordo con le dita e Besk ti tira su per la cintura, e per un
            bel pezzo nessuno dei due parla.
          effetti: { ferite: 1 }

  - id: accademia-gradone-il-mulo-di-orvald
    immagine: ambientazione/gradone-rosso
    titolo: Il mulo di Orvald
    sommario: "Il mulo del carro è tornato da solo e ti segue a distanza, come se aspettasse un'offerta."
    luogo: Il Gradone Rosso, ai piedi della scarpata
    area: accademia-gradone-rosso
    ripetibile: true
    requisiti: [fazione.accademia == 5, profondita.accademia-gradone-rosso == 0]
    testo: |
      Il mulo del carro si è slegato, a quanto pare con i denti, e vi ha seguiti fino alla scarpata. Sta fermo a dieci passi con le
      orecchie in avanti, e dal campo Orvald vi grida che è nipote del mulo del centoventi e la strada la sa.

      {addestrare-animali Media} Le orecchie in avanti vogliono dire che ha voglia di andare, e basta lasciargli credere che l'idea sia
      sua.
    opzioni:
      - testo: "Lasciarsi portare dal mulo"
        descrizione: "Un mulo che conosce la strada vale una mappa."
        prova: { attributo: sociale, abilita: addestrare-animali, difficolta: Media }
        successo:
          titolo: Il nipote del mulo
          testo: |
            Prende la mela con delicatezza e si avvia per un sentiero di capre sul
            fianco della scarpata. Vi lascia sulla cengia davanti allo scavo e
            torna al campo senza voltarsi.
          pe: { addestrare-animali: 5 }
          effetti: { profondita.accademia-gradone-rosso: 1 }
        fallimento:
          titolo: La mela
          testo: |
            Il mulo si mangia la mela e torna al campo, dove Orvald gli gratta la
            fronte ridendo.

      - testo: "Montarlo e salire in groppa"
        descrizione: "Senza sella e con una mano nella criniera, se il mulo ci sta."
        prova: { attributo: fisico, abilita: cavalcare, difficolta: Media }
        successo:
          titolo: Senza sella
          testo: |
            Il mulo sale il fianco della scarpata a passo sicuro, con Besk
            attaccata alla coda, e in cima ti scrolla giù senza cattiveria davanti
            allo scavo.
          pe: { cavalcare: 5 }
          effetti: { profondita.accademia-gradone-rosso: 1 }
        fallimento:
          titolo: Nella sabbia
          testo: |
            Il mulo fa due passi e si ferma di colpo, e tu prosegui da solo in
            volo fino alla sabbia rossa.
          effetti: { ferite: 0.5 }

      - testo: "Aggirare la scarpata a piedi"
        descrizione: "Il giro lungo dalla parte del fiume chiede solo tempo e gambe buone."
        costo: 2
        esito:
          titolo: Il giro del fiume
          testo: |
            Aggirate la scarpata fra le canne del Torvessa e risalite per un fianco di roccia salda. Arrivate alla cengia dopo mezza giornata,
            con i piedi fradici.
          pe: { resistenza: 2 }
          effetti: { profondita.accademia-gradone-rosso: 1 }

  # ------------------------------------------------------------ 1 · lo scavo del centoventi
  - id: accademia-gradone-il-campo-abbandonato
    immagine: ambientazione/gradone-rosso
    titolo: Il campo abbandonato
    sommario: "Sulla cengia restano le tende marcite del centoventi e le casse con le etichette di Orvald."
    luogo: Il Gradone Rosso, il campo del centoventi
    area: accademia-gradone-rosso
    ripetibile: true
    requisiti: [fazione.accademia == 5, profondita.accademia-gradone-rosso == 1]
    testo: |
      Sulla cengia restano i resti del campo di trent'anni fa, con due tende
      crollate sotto la sabbia e una terza in disparte, ancora in piedi per
      metà. Ci sono le casse con le etichette di Orvald, *corde*, *gesso*,
      *viveri, non toccare*, e una pentola rovesciata con dentro un nido di
      vespe abbandonato.

      {percezione Media} La tenda in disparte ha i paletti piantati più
      fondi. Chi ci dormiva voleva che restasse in piedi a lungo.
    opzioni:
      - testo: "Frugare nella tenda in disparte"
        descrizione: "Quella di Severo, a giudicare dai paletti."
        prova: { attributo: mentale, abilita: percezione, difficolta: Media }
        successo:
          titolo: Le pagine del centoquaranta
          testo: |
            Sotto la branda, in una tela cerata, ci sono le pagine del diario di
            Orvald dell'anno centoquaranta, tagliate con il temperino e riportate
            qui da Severo. L'ultima riga è nella sua grafia fitta. *La formula non
            è nostra. L'abbiamo soltanto ricordata.* Le metti nella giubba, contro
            il petto.
          pe: { percezione: 5 }
          imposta: { accademia.diario: 1 }
          effetti: { profondita.accademia-gradone-rosso: 1, informazioni.segreto: 1 }
        fallimento:
          titolo: Le vespe
          testo: |
            Da sotto la branda esce un vespaio tutt'altro che abbandonato, e
            scappi giù dalla cengia con Besk.
          effetti: { ferite: 0.5 }

      - testo: "Prendere il gesso e le corde dalle casse"
        descrizione: "Il gesso e i chiodi d'ottone servono ancora, le corde no."
        esito:
          titolo: Le casse di Orvald
          testo: |
            Prendi il gesso e i chiodi d'ottone senza ruggine, e Besk segna tutto
            sul quaderno perché Orvald vorrà saperlo.
          effetti: { profondita.accademia-gradone-rosso: 1 }

  - id: accademia-gradone-la-galleria-puntellata
    immagine: ambientazione/gradone-rosso
    titolo: La galleria puntellata
    sommario: "Lo scavo del centoventi scende nella roccia fra pali marciti che perdono sabbia."
    luogo: Il Gradone Rosso, lo scavo
    area: accademia-gradone-rosso
    ripetibile: true
    requisiti: [fazione.accademia == 5, profondita.accademia-gradone-rosso == 1]
    testo: |
      La galleria scende nella roccia fra pali neri di muffa piegati sotto il
      peso, e dal soffitto cade un filo continuo di sabbia. In fondo, dove
      comincia la pietra nera dei Precursori, si vede un riflesso azzurro.

      {tecnologia Media} I pali reggono perché si appoggiano l'uno all'altro,
      e se ne togli uno cedono tutti in fila.

      {origine fuggiasco-di-ghoran} Nelle miniere di Ghoran gallerie così le
      passavi con la testa bassa e la paura di toccare il legno, e le spalle
      si piegano da sole.
    opzioni:
      - testo: "Rinforzare i pali prima di passare"
        descrizione: "Due pali nuovi nei punti giusti reggono il tempo di passare."
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Media }
        successo:
          titolo: I due pali
          testo: |
            Infili due assi delle casse dove i pali vecchi spingono di più, e la
            sabbia smette di cadere il tempo di passare.
          pe: { tecnologia: 5 }
          effetti: { profondita.accademia-gradone-rosso: 1 }
        fallimento:
          titolo: Il palo sbagliato
          testo: |
            Il primo palo che tocchi è quello sbagliato, e quando tre pali cedono
            in fila Besk ti tira fuori dalla sabbia per le caviglie.
          effetti: { ferite: 1 }

      - testo: "Passare di corsa"
        descrizione: "Sono trenta passi, e se corri la sabbia ti cade dietro."
        quando: [accademia.attrezzi == 0]
        prova: { attributo: fisico, abilita: atletica, difficolta: Media }
        successo:
          titolo: Trenta passi
          testo: |
            Corri piegato in due mentre dietro di te un palo cede in una nuvola
            rossa. Besk ti raggiunge bianca di sabbia e ride per il nervoso.
          pe: { atletica: 4 }
          effetti: { profondita.accademia-gradone-rosso: 1, ferite: 0.5 }
        fallimento:
          titolo: La sabbia addosso
          testo: |
            A metà galleria un palo cede sopra di te, e ti rialzi all'imbocco
            sputando sabbia.
          effetti: { ferite: 1 }

      - testo: "Passare legati con le corde dei Raschiatori"
        descrizione: "Con le corde di Dragna legate fuori, se crolla qualcosa ti tirano fuori."
        quando: [accademia.attrezzi >= 1]
        esito:
          titolo: Il nodo dei Raschiatori
          testo: |
            Leghi la corda a un masso fuori dall'imbocco e passi tenendola tesa, e
            quando a metà cade un palo la sabbia ti scivola addosso senza
            fermarti.
          pe: { atletica: 3 }
          effetti: { profondita.accademia-gradone-rosso: 1 }

  - id: accademia-gradone-il-nido-dei-vermi
    immagine: bestiario/verme-carogna
    titolo: Il nido dei vermi
    sommario: "In una galleria laterale qualcosa di pallido si muove, e puzza di carne lasciata al sole."
    luogo: Il Gradone Rosso, una galleria laterale
    area: accademia-gradone-rosso
    ripetibile: true
    requisiti: [fazione.accademia == 5, profondita.accademia-gradone-rosso >= 1, profondita.accademia-gradone-rosso <= 2]
    testo: |
      Una galleria laterale, così bassa che bisogna chinarsi, manda un odore dolciastro di carne andata a male. Fra ossa di capra spolpate dormono due vermi carogna
      pallidi lunghi quanto un uomo, con una corona di tentacoli intorno alla bocca.

      {furtivita Facile} I vermi carogna dormono profondo. Basta passare lungo la parete opposta, dove la lampada non li sfiora.
    opzioni:
      - testo: "Affrontare i vermi"
        descrizione: "Due vermi carogna da colpire prima che si sveglino del tutto."
        combattimento: accademia-il-nido-dei-vermi
        vittoria:
          titolo: La galleria pulita
          testo: |
            L'ultimo verme si ritira nel suo buco. La bava ti resterà nel naso per
            giorni, ma oltre il nido la galleria scende verso la pietra nera.
          effetti: { profondita.accademia-gradone-rosso: 1 }
        sconfitta:
          titolo: Il tocco
          testo: |
            Un tentacolo ti sfiora il collo e le gambe smettono di risponderti,
            finché Besk non ti trascina fuori per le ascelle.
          effetti: { ferite: 1 }

      - testo: "Passare lungo la parete, al buio"
        descrizione: "Con la lampada coperta, lungo la parete opposta."
        prova: { attributo: fisico, abilita: furtivita, difficolta: Media }
        successo:
          titolo: Lungo la parete
          testo: |
            Passi lungo la parete con la lampada sotto la giubba e la mano di Besk
            sulla spalla, e quando un verme si srotola nel sonno resti fermo fino
            a quando torna ad arrotolarsi.
          pe: { furtivita: 5 }
          effetti: { profondita.accademia-gradone-rosso: 1 }
        fallimento:
          titolo: L'osso
          testo: |
            Pesti un osso di capra, che si spezza con un rumore secco, e mentre i vermi si srotolano tu e Besk tornate indietro di corsa.
          effetti: { ferite: 0.5 }

  # ------------------------------------------------------------ 2 · la rovina
  - id: accademia-gradone-le-pareti-che-battono
    immagine: ambientazione/rovine-dei-precursori
    titolo: Le pareti che battono
    sommario: "Dove finisce l'arenaria comincia la pietra nera dei Precursori, e la pietra nera batte come un cuore."
    luogo: Il Gradone Rosso, la rovina
    area: accademia-gradone-rosso
    ripetibile: true
    requisiti: [fazione.accademia == 5, profondita.accademia-gradone-rosso == 2]
    testo: |
      L'arenaria finisce di colpo e comincia un corridoio di pietra nera liscia che scende con una curva lunga. Le pareti sono tiepide, e ogni tanto ci passa dentro un
      battito che fa tremare la luce della lampada.

      {magia Media} È il battito della Vecchia, molto più debole, come un'eco che torna dopo tanti anni.

      Besk apre il quaderno per contare, poi lo chiude perché le tremano le mani.
    opzioni:
      - testo: "Andare avanti contando i battiti"
        descrizione: "Contare tiene la testa occupata, un passo per ogni conto."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Media }
        successo:
          titolo: Un passo per ogni conto
          testo: |
            Conti a voce bassa, un passo per ogni battito, e la voce di Besk che
            conta con te copre quella dietro la pietra fino in fondo alla curva.
          pe: { resilienza: 5 }
          effetti: { profondita.accademia-gradone-rosso: 1 }
        fallimento:
          titolo: Il nome
          testo: |
            Al centesimo battito ti senti chiamare con la voce di tua madre e
            torni di corsa fino all'arenaria, tremando.
          effetti: { tormento: 1 }

      - testo: "Tapparsi le orecchie e correre"
        descrizione: "Con la cera nelle orecchie il battito forse si sente meno."
        prova: { attributo: fisico, abilita: resistenza, difficolta: Media }
        successo:
          titolo: La cera
          testo: |
            Con la cera della lampada nelle orecchie corri giù per la curva. Il
            battito ti arriva lo stesso dai piedi, ma non ti chiama più.
          pe: { resistenza: 5 }
          effetti: { profondita.accademia-gradone-rosso: 1 }
        fallimento:
          titolo: Attraverso i piedi
          testo: |
            Il battito ti entra dai piedi e a metà curva ti fermi con la fronte
            contro la pietra tiepida, finché Besk ti riporta indietro per la
            manica.
          effetti: { tormento: 1 }

  - id: accademia-gradone-la-sentinella-spenta
    immagine: bestiario/salvaguardia-precursori
    titolo: La sentinella spenta
    sommario: "In una nicchia del corridoio sta una macchina della Salvaguardia con la testa girata all'indietro."
    luogo: Il Gradone Rosso, la rovina
    area: accademia-gradone-rosso
    ripetibile: true
    requisiti: [fazione.accademia == 5, profondita.accademia-gradone-rosso == 2]
    testo: |
      In una nicchia c'è un camminatore della Salvaguardia, alto quanto un uomo e senza volto,
      con la testa girata all'indietro e un pannello sulla nuca chiuso da quattro viti. Sul
      petto ha una placca con una croce di gesso tracciata da una mano umana molto tempo fa.
      Quando gli passate davanti la testa gira di un grado verso di voi, ronzando.

      {tecnologia Media} Le viti sono di lyssan, e chi le ha messe voleva che si potessero
      togliere a mano.
    opzioni:
      - testo: "Spegnerla dal pannello della nuca"
        descrizione: "Quattro viti di lyssan, che qualcuno ha già svitato una volta."
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Media }
        successo:
          titolo: Le quattro viti
          testo: |
            Sviti le quattro viti con le dita e dal pannello stacchi un cristallo
            grande come un uovo, ancora un po' carico, mentre la testa smette di
            ronzare.
          pe: { tecnologia: 5 }
          effetti: { profondita.accademia-gradone-rosso: 1, cristalli.cristallo-sterile: 1 }
        fallimento:
          titolo: La testa che gira
          testo: |
            Alla terza vite la testa gira del tutto verso di te, e per stavolta lasci stare il
            pannello.
          effetti: { tormento: 1 }

      - testo: "Chiuderla con il Sigillo"
        descrizione: "Il Sigillo chiude anche le serrature di Mana di un camminatore."
        incantesimo: sigillo
        prova: { attributo: mentale, abilita: magia, difficolta: Facile }
        successo:
          titolo: La croce di gesso
          testo: |
            Posi la mano sulla croce di gesso e chiudi il Mana della macchina
            dentro di lei. Sotto il gesso, sulla placca, c'è un segno uguale a
            quelli dei calchi del Gradone.
          pe: { magia: 4 }
          effetti: { profondita.accademia-gradone-rosso: 1 }
        fallimento:
          titolo: Il Mana che torna
          testo: |
            Il Mana ti torna indietro dalla placca e ti fa saltare via la mano, e
            la testa del camminatore resta girata verso di te.
          effetti: { tormento: 1 }

      - testo: "Passarle davanti senza fermarsi"
        descrizione: "Forse si limita a guardare chi passa, e forse no."
        prova: { attributo: fisico, abilita: furtivita, difficolta: Media }
        successo:
          titolo: Il ronzio dietro
          testo: |
            Le passi davanti senza guardarla, e il ronzio ti segue per un tratto e
            poi tace.
          pe: { furtivita: 4 }
          effetti: { profondita.accademia-gradone-rosso: 1 }
        fallimento:
          titolo: Il braccio
          testo: |
            La macchina allunga un braccio e ti sbarra il passo, senza colpirti.
            Torni indietro, e il braccio torna lungo il fianco.
          effetti: { tormento: 1 }

      - testo: "Abbatterla"
        descrizione: "Una macchina vecchia e sola, meglio ferma per sempre."
        combattimento: accademia-la-sentinella-spenta
        vittoria:
          titolo: La macchina a terra
          testo: |
            La macchina cade in ginocchio e poi in avanti, con la testa ancora
            girata. Dal petto le stacchi il cristallo che la teneva accesa.
          effetti: { profondita.accademia-gradone-rosso: 1, cristalli.cristallo-sterile: 1, reliquie.scheggia: 1 }
        sconfitta:
          titolo: La nicchia
          testo: |
            Il camminatore ti spinge contro la parete con una forza da mulino,
            e poi torna nella sua nicchia. Besk ti aiuta a rialzarti.
          effetti: { ferite: 1 }

  - id: accademia-gradone-l-alveo-piccolo
    immagine: ambientazione/rovine-dei-precursori
    titolo: L'alveo piccolo
    sommario: "Una sala laterale con un piccolo alveo vuoto nel pavimento e le pareti coperte di incisioni."
    luogo: Il Gradone Rosso, una sala laterale della rovina
    area: accademia-gradone-rosso
    ripetibile: true
    requisiti: [fazione.accademia == 5, profondita.accademia-gradone-rosso == 2]
    testo: |
      La sala laterale è rotonda e bassa, con un alveo vuoto nel pavimento
      della forma di un cristallo grande come un braccio. Le pareti sono
      fitte di incisioni ripassate a gesso, e per terra ci sono pezzi di
      metallo inciso staccati dal muro.

      {percezione Facile} Sotto le incisioni, all'altezza del ginocchio,
      qualcuno ha scritto a gesso una data, *centoquaranta*.
    opzioni:
      - testo: "Leggere le incisioni con i calchi della Biblioteca"
        descrizione: "Con i calchi di Mattias le incisioni si leggono in fretta."
        quando: [accademia.calchi >= 1]
        prova: { attributo: mentale, abilita: accademiche, difficolta: Facile }
        successo:
          titolo: Le soglie
          testo: |
            Con la copia di Mattias le incisioni indicano la sala grande, giù per
            il corridoio, e una soglia da non passare con il fuoco acceso.
            Raccogli i frammenti migliori e prosegui.
          pe: { accademiche: 4 }
          effetti: { profondita.accademia-gradone-rosso: 1, reliquie.frammento-inciso: 2 }
        fallimento:
          titolo: La copia sbagliata
          testo: |
            Confronti la copia di Mattias con la parete sbagliata, e ci metti
            un'ora a capirlo.
          effetti: { tormento: 1 }

      - testo: "Leggere le incisioni a occhio"
        descrizione: "Senza calchi ci vuole tempo, ma i segni si ripetono."
        prova: { attributo: mentale, abilita: accademiche, difficolta: Media }
        successo:
          titolo: L'esercizio
          testo: |
            Dopo un'ora capisci che le incisioni ripetono la stessa frase e indicano la sala grande giù per il corridoio. Raccogli due frammenti
            e prosegui.
          pe: { accademiche: 5 }
          effetti: { profondita.accademia-gradone-rosso: 1, reliquie.frammento-inciso: 2 }
        fallimento:
          titolo: Le incisioni ferme
          testo: |
            Dopo un'ora di confronti le incisioni ti sembrano tutte uguali, e lo
            sono. Besk ti dice che il preside ne sarebbe contento.
          effetti: { tormento: 1 }

      - testo: "Raccogliere i frammenti e andare avanti"
        descrizione: "I pezzi incisi valgono qualcosa per la collezione di Orvald."
        esito:
          titolo: Le tasche piene
          testo: |
            Ti riempi le tasche di frammenti incisi mentre Besk ricopia tre righe
            dalla parete.
          effetti: { profondita.accademia-gradone-rosso: 1, reliquie.frammento-inciso: 1 }

  # ------------------------------------------------------------ 3 · il cuore: il nucleo del Gradone
  - id: accademia-gradone-il-nucleo
    immagine: ambientazione/rovine-dei-precursori
    titolo: Il nucleo del Gradone
    sommario: "La sala rotonda del disegno di Orvald, con l'alveo vuoto della Vecchia e un nucleo di pietra nera."
    luogo: Il Gradone Rosso, la sala del nucleo
    area: accademia-gradone-rosso
    requisiti: [fazione.accademia == 5, profondita.accademia-gradone-rosso >= 3]
    testo: |
      La sala rotonda è quella del disegno di Orvald, con la volta altissima e un alveo vuoto lungo il pavimento, della forma esatta della Vecchia distesa di traverso. Al centro c'è un nucleo di pietra nera grande
      come un carro. Il gesso copre il pavimento con una formula riscritta molte volte.

      {magia Media} Il nucleo è freddo. Il Mana c'è, chiuso dentro, come in una stanza con la porta murata.

      Quando ti avvicini, l'aria davanti a te si increspa di azzurro e prende la forma di due figure di luce. Una è un uomo robusto con la barba scura e una piccozza, e dalla piega delle spalle riconosci Orvald,
      trent'anni fa. L'altro è magro, con le dita nere d'inchiostro, e traccia segni nell'aria con un gesso che non c'è. Ripetono i gesti dello scavo, poi si voltano insieme verso di te.

      {empatia Media} L'Orvald giovane ride a una cosa che l'altro ha detto. Il preside che aspetta al campo non ride così da anni.

      {origine allievo-di-torvessa} È la piega delle spalle che fa in aula prima della domanda a cui nessuno saprà rispondere, e ti viene voglia di alzare la mano.

      Besk ti stringe il braccio. «Sono echi» sussurra. «Come quelli dell'Arena. Se li tocchi, li tocchi davvero.»
    opzioni:
      - testo: "Affrontare l'eco dello scavo"
        descrizione: "Due echi di luce che picchiano come gente viva."
        combattimento: accademia-l-eco-dello-scavo
        vittoria:
          titolo: La porta chiusa
          testo: |
            Gli echi si sciolgono in polvere azzurra sui gessi, che ricopi sul
            quaderno di Besk. Toccando il nucleo capisci che la Vecchia non si
            riattacca, perché il nucleo si è staccato da solo molto prima di
            Orvald e Severo. Al campo Orvald ti dà la sua piccozza. «Me l'ha fatta
            Bram. Adesso tocca a te tirare fuori le cose dalla roccia.» Da domani
            hai la chiave del laboratorio.
          pe: { armi-da-mischia: 5 }
          almeno: { rep.accademia: 4 }
          effetti: { fazione.accademia: 1, rep.accademia: 1, oggetto.accademia-piccozza-del-centoventi: 1, reperto.sigillato: 1, cristalli.cristallo-sterile: 2 }
          vai: superficie-fratturata
        sconfitta:
          titolo: L'intruso
          testo: |
            L'Orvald giovane ti colpisce con il piatto della piccozza e l'altro ti
            brucia la spalla con un segno di gesso. Al campo, di notte, Orvald vi
            medica senza chiedere niente.
          effetti: { ferite: 1.5, tormento: 1 }
          vai: superficie-fratturata

      - testo: "Sciogliere l'eco con l'Esorcismo"
        descrizione: "La Liturgia dell'Albero rimanda gli echi dove devono stare."
        incantesimo: esorcismo
        prova: { attributo: mentale, abilita: magia, difficolta: Media }
        successo:
          titolo: Il congedo
          testo: |
            Dici le parole del Velo, e gli echi si sciolgono in polvere azzurra. Sotto la tua mano il nucleo resta chiuso come una porta murata da dentro, e
            la Vecchia non si riattacca. Al campo Orvald ascolta e ti dà la sua piccozza del centoventi. «Adesso tocca a te tirare fuori le cose dalla
            roccia.» Da domani hai la chiave del laboratorio.
          pe: { magia: 5 }
          almeno: { rep.accademia: 4 }
          effetti: { fazione.accademia: 1, rep.accademia: 1, oggetto.accademia-piccozza-del-centoventi: 1, reperto.sigillato: 1, cristalli.cristallo-sterile: 2 }
          vai: superficie-fratturata
        fallimento:
          titolo: Le parole spezzate
          testo: |
            Le parole ti si spezzano in bocca e gli echi ti vengono addosso insieme, e scappi con
            Besk con la spalla che brucia.
          effetti: { ferite: 1, tormento: 1 }
          vai: superficie-fratturata

      - testo: "Sciogliere l'eco con il Mana del nucleo"
        descrizione: "Gli echi sono Mana, e il Mana si spinge altrove con una mano ferma."
        requisiti: [magia >= 1]
        prova: { attributo: mentale, abilita: magia, difficolta: Media }
        successo:
          titolo: La luce che si spegne
          testo: |
            Appoggi le mani sul nucleo e tiri verso di te la luce degli echi come
            un filo da un gomitolo, finché le figure si sfilacciano. Il nucleo
            resta chiuso e la Vecchia non si riattacca. Al campo Orvald ascolta
            senza parlare, poi ti dà la sua piccozza del centoventi e ti dice che
            da domani hai la chiave del laboratorio.
          pe: { magia: 5 }
          almeno: { rep.accademia: 4 }
          effetti: { fazione.accademia: 1, rep.accademia: 1, oggetto.accademia-piccozza-del-centoventi: 1, reperto.sigillato: 1, cristalli.cristallo-sterile: 2 }
          vai: superficie-fratturata
        fallimento:
          titolo: Il filo che tira
          testo: |
            Il filo tira dalla parte sbagliata e gli echi ti entrano nelle mani
            come acqua gelata. Ti ritrovi fuori con Besk che ti strofina i polsi.
          effetti: { tormento: 1.5 }
          vai: superficie-fratturata

      - testo: "Lasciare che la scena finisca e ascoltare"
        descrizione: "Se resti fermo e lasci finire la scena, forse la senti anche tu."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Media }
        successo:
          titolo: Ha chiuso la porta
          testo: |
            Resti fermo accanto all'alveo e gli echi smettono di guardarti. L'uomo
            dalle mani nere appoggia il palmo sul nucleo e parla all'Orvald
            giovane, con una voce che arriva come da un'altra stanza. «Non dorme.
            Ha chiuso la porta.» Al campo Orvald ascolta il racconto stringendo la
            piccozza, poi te la dà. «Severo l'aveva capito subito, e io non l'ho
            ascoltato.» Da domani hai la chiave del laboratorio.
          pe: { resilienza: 5 }
          almeno: { rep.accademia: 4 }
          effetti: { fazione.accademia: 1, rep.accademia: 1, oggetto.accademia-piccozza-del-centoventi: 1, reperto.sigillato: 1, cristalli.cristallo-sterile: 2, tormento: 1 }
          vai: superficie-fratturata
        fallimento:
          titolo: Troppo vicino
          testo: |
            Gli echi ti passano attraverso e per un momento ti senti giovane e con
            la barba scura. Ti risvegli sulla cengia, con Besk che ti dà acqua.
          effetti: { tormento: 1.5 }
          vai: superficie-fratturata
