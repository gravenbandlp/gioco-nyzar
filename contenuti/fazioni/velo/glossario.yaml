# La quest della Confraternita del Velo: le voci del glossario per i personaggi nuovi. Presentazioni stabili, senza
# segreti: chi è, che cosa fa, dove lo si trova, un tratto riconoscibile. Padre Ermes Valdrano non ha "Ermes" fra gli
# alias, perché in città c'è già Ermes Calvi, lo scrivano del lavatoio.
glossario:
  - id: ermes-valdrano
    nome: Padre Ermes Valdrano
    alias: [Padre Valdrano, Valdrano]
    tipo: personaggio
    sottotitolo: "Cronista maggiore della Cattedrale del Velo"
    testo: "Sacerdote anziano del Velo, cronista maggiore della Cattedrale. Scrive i bollettini delle sacche e misura la Marea nei pozzi con la corda al cristallo. Porta un righello alla cintura e offre il tè a chiunque passi."

  - id: lauro-bessi
    nome: Fratello Lauro Bessi
    alias: [Fratello Lauro, Bessi]
    tipo: personaggio
    sottotitolo: "Campanaro della Cattedrale del Velo"
    testo: "Il campanaro della Cattedrale, un uomo magro che guarda l'altare da una feritoia prima di tirare la corda delle ore. Ha servito al vecchio Santuario e da allora ha paura di sbagliare le ore canoniche."

  - id: silvano-ardice
    nome: Silvano Ardice
    alias: [Ardice]
    tipo: personaggio
    sottotitolo: "Predicatore del Culto dell'Antico in Città Bassa"
    testo: "Ex sacerdote del Velo, ha lasciato l'ordine dopo l'incendio del Santuario. Predica il Culto dell'Antico in Città Bassa da una cassetta rovesciata, con la voce rauca di chi parla all'aperto. Lo sceriffo lo tollera, la Cattedrale no."

  - id: sorella-alenna
    nome: Sorella Alenna
    alias: [Alenna]
    tipo: personaggio
    sottotitolo: "Monaca del Velo a Tuarmir"
    testo: "Monaca del Velo mandata a Tuarmir a controllare che le erbe vendute alla Cattedrale restino pure. Madre Cerya le ha affiancato una novizia del villaggio perché impari le piante. Scrive lettere fitte, e da qualche mese ne scrive meno."

  - id: serad-di-tuarmir
    nome: Serad di Tuarmir
    alias: [Serad]
    tipo: personaggio
    sottotitolo: "Sacerdote del Velo scomparso nella gola"
    testo: "Sacerdote del Velo sparito dieci anni fa nella gola di Tuarmir. Il suo nome non è mai stato cancellato dai registri della Cattedrale. A Tuarmir se ne parla poco, e Lonn Var dice che era troppo curioso."

  - id: lonn-var
    nome: Lonn Var
    tipo: personaggio
    sottotitolo: "Mercante delle erbe di Tuarmir"
    testo: "Mercante di Qir-Azel che vende al Velo le erbe e i muschi della gola di Tuarmir. Da una decina d'anni smercia anche droghe spirituali ai clienti discreti dei Quartieri Alti."

  - id: kael-dareth
    nome: Kael Dareth
    tipo: personaggio
    sottotitolo: "Il guerriero che tornò dal Labirinto nel 130"
    testo: "Uno dei tre guerrieri tornati nel 130 dal rito delle maschere nel Labirinto di Darn-Morakh, con le pupille di metallo liquido e due lame dei Precursori che cantavano. In Cattedrale il suo ritratto ha la bocca cucita con fili d'oro."
