# La quest della Confraternita del Velo: le voci del glossario per i personaggi nuovi. Presentazioni stabili, senza
# segreti: chi è, che cosa fa, dove lo si trova, un tratto riconoscibile. Padre Ermes Valdrano non ha "Ermes" fra gli
# alias, perché in città c'è già Ermes Calvi, lo scrivano del lavatoio.
glossario:
  - id: ermes-valdrano
    nome: Padre Ermes Valdrano
    alias: [Padre Valdrano, Valdrano]
    tipo: personaggio
    sottotitolo: "Cronista maggiore della Cattedrale del Velo"
    testo: "Sacerdote anziano della Confraternita del Velo, cronista maggiore della Cattedrale. Scrive i bollettini delle sacche e misura la Marea nei pozzi con la corda al cristallo, come si faceva al vecchio Santuario. Porta sempre un righello alla cintura e offre il tè a chiunque passi dai tavoli lunghi dei cronisti."

  - id: lauro-bessi
    nome: Fratello Lauro Bessi
    alias: [Fratello Lauro, Bessi]
    tipo: personaggio
    sottotitolo: "Campanaro della Cattedrale del Velo"
    testo: "Il campanaro della Cattedrale. È un uomo magro con i capelli sempre in disordine, che guarda l'altare da una feritoia prima di tirare la corda delle ore. Ha servito al vecchio Santuario, e da allora suona le ore canoniche con la paura di sbagliarle. Scende di rado dal campanile, e mangia lassù."

  - id: silvano-ardice
    nome: Silvano Ardice
    alias: [Ardice]
    tipo: personaggio
    sottotitolo: "Predicatore del Culto dell'Antico in Città Bassa"
    testo: "Ex sacerdote del Velo che ha lasciato l'ordine dopo l'incendio del Santuario. Predica in Città Bassa su una cassetta rovesciata per il Culto dell'Antico. Lo sceriffo lo tollera, in Cattedrale lo guardano male. Ha la voce rauca di chi parla all'aperto, e la scalda con quello che gli offrono da bere."

  - id: sorella-alenna
    nome: Sorella Alenna
    alias: [Alenna]
    tipo: personaggio
    sottotitolo: "Monaca del Velo a Tuarmir"
    testo: "Monaca della Confraternita del Velo mandata a Tuarmir per controllare che le erbe vendute alla Cattedrale restino pure. Dice di essere lì per studiare le piante, e Madre Cerya le ha messo accanto una novizia del villaggio perché impari a riconoscerle. Scrive lettere fitte, e da qualche mese ne scrive meno."

  - id: serad-di-tuarmir
    nome: Serad di Tuarmir
    alias: [Serad]
    tipo: personaggio
    sottotitolo: "Sacerdote del Velo scomparso nella gola"
    testo: "Sacerdote della Confraternita del Velo che dieci anni fa sparì nella gola di Tuarmir senza lasciare traccia. Il suo nome non è mai stato cancellato dai registri della Cattedrale. A Tuarmir se ne parla poco, e il mercante Lonn Var dice che era troppo curioso."

  - id: lonn-var
    nome: Lonn Var
    tipo: personaggio
    sottotitolo: "Mercante delle erbe di Tuarmir"
    testo: "Mercante di Qir-Azel che tiene le rotte fra Tuarmir e la città e vende al Velo le erbe e i muschi della gola. Da una decina d'anni smercia anche certe varianti meno regolari, droghe spirituali le chiama lui, ai clienti discreti dei Quartieri Alti. Viaggia con un mulo carico e un libro dei conti sempre aperto."

  - id: kael-dareth
    nome: Kael Dareth
    tipo: personaggio
    sottotitolo: "Il guerriero che tornò dal Labirinto nel 130"
    testo: "Guerriero solitario, uno dei tre che nel 130 tornarono dal rito delle maschere nel Labirinto di Darn-Morakh, con le pupille di metallo liquido. Portava due lame dei Precursori che cantavano quando le estraeva. In Cattedrale il suo ritratto ha la bocca cucita con fili d'oro, e i paladini lo invocano prima di tacere quello che hanno visto."
