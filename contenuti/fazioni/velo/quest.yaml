# La quest di fazione della Confraternita del Velo (ottobre 2026): la pista fazione.velo (0 → 15), i cinque gradi e
# gli stati che le scene si passano. Il filo è la riga strappata del registro del Santuario: sei sacerdoti usciti
# prima del fuoco del 145, uno dei quali, Padre Ermes Valdrano, registra la città da dieci anni per chi porta la
# moneta con l'occhio chiuso. Il nome di chi c'è dietro non si dice mai.
# Dove stanno i passi:
# - 1, 4 e 6 sono le storie della catena breve, rimaste in contenuti/citta/cattedrale.yaml con i requisiti cambiati
#   (i Giardini della Linfa con Lino, gli archivi minori con la notte del Santuario, il voto con la veglia).
# - 2, 3 e 5 in passi-1.yaml; 7, 9 e 10 in passi-2.yaml, con gli ingressi delle due spedizioni; 12-15 in passi-3.yaml.
# - Le spedizioni: spedizione-sacca.yaml (passo 8, sotto l'Orlo dei Rottami), spedizione-gola.yaml (passo 11, la
#   gola di Tuarmir nella Superficie Fratturata).
# - I ripetibili e i servizi dei gradi in servizi.yaml (le due opzioni dei gradi 3 e 4 stanno nelle Ore del Velo, in
#   cattedrale.yaml); oggetti e incantesimo in oggetti.yaml; nemici e scontri in nemici.yaml; i personaggi nuovi in
#   glossario.yaml.
# Trama: i passi 1-11 non chiedono niente; il 12 vuole pista.capomozzo >= 8 (la Madre ti ha già ricevuto nella scena
# del ritorno), il 13-15 pista.capomozzo >= 9 (Aurenne sveglia). Il passo 2 ha due varianti, Via dei Rasoi con
# pista.pelle < 6 e le macerie della Pignatta con pista.pelle >= 6.
# Reputazione: i passi di grado la portano almeno a 2, 4, 6, 8, 10; gli altri danno +½ o +1. Le soglie di
# reputazione della catena breve sono cadute: decide il passo.
quality:
  - { id: fazione.velo, immagine: fazioni/confraternita-del-velo, nome: "La riga strappata", categoria: pista, descrizione: "Sulla tavoletta di cera di Ottilia Sanvel c'è posto per un nome nuovo, e in Cattedrale le mani pulite servono sempre. La pista si chiude a 15." }
  - { id: velo.copia, nome: I sei nomi nel quaderno, categoria: stato, nascosta: true, descrizione: "1 se negli archivi minori hai copiato di nascosto la colonna dei sacerdoti." }
  - { id: velo.bessi, nome: La riga di Bessi, categoria: stato, nascosta: true, descrizione: "1 se Fratello Lauro Bessi ti ha confessato di aver strappato lui la riga." }
  - { id: velo.sacca, nome: La sacca sotto l'Orlo, categoria: stato, nascosta: true, descrizione: "1 misurata con la corda al cristallo ed entrata nel bollettino, 2 lasciata fuori." }
  - { id: velo.lettere, immagine: icone/envelope, nome: Le lettere a S., categoria: stato, descrizione: "Un pacco di lettere senza firma trovate in una cassetta di latta sotto l'Orlo dei Rottami. Le righe sono dritte come tirate al righello." }
  - { id: velo.moneta, immagine: icone/semi-closed-eye, nome: Il disco con l'occhio chiuso, categoria: stato, descrizione: "Un disco di metallo grande come una moneta, con un occhio chiuso inciso sopra. In mano non pesa niente." }
  - { id: velo.allarme, nome: Valdrano in guardia, categoria: stato, nascosta: true, descrizione: "Quante volte Valdrano è stato messo in guardia dalle lettere girate per la Cattedrale. Indurisce i passi 13 e 14." }
  - { id: velo.garitta, immagine: icone/key, nome: La chiave di garitta, categoria: accesso, descrizione: "La chiave delle garitte del Velo sopra i ponti-ascensore. Ci passi senza domande, e decidi tu chi va in Cripta a purificarsi." }
  - { id: velo.ardice, nome: Silvano Ardice, categoria: stato, nascosta: true, descrizione: "1 ascoltato fino in fondo, 2 in cella per la tua denuncia, 3 protetto dal sergente." }
  - { id: velo.aiutata, nome: La raccolta di Alenna, categoria: stato, nascosta: true, descrizione: "1 se nella gola di Tuarmir hai aiutato Sorella Alenna a raccogliere." }
  - { id: velo.alenna, nome: Sorella Alenna, categoria: stato, nascosta: true, descrizione: "1 tornata in città con te, 2 rimasta a Tuarmir con Madre Cerya." }
  - { id: velo.attesa, nome: L'attesa della Madre, categoria: stato, nascosta: true, descrizione: "1 se hai accettato di aspettare la mossa falsa, 2 se sei andato da Vantes e dallo sceriffo." }
  - { id: velo.campanile, nome: Bessi avvertito, categoria: stato, nascosta: true }
  - { id: velo.liuto, nome: Celia avvertita, categoria: stato, nascosta: true }
  - { id: velo.artiglio, nome: Aurenne avvertita, categoria: stato, nascosta: true }
  - { id: velo.porte, nome: Ottilia avvertita, categoria: stato, nascosta: true }
  - { id: velo.valdrano, nome: Padre Valdrano dopo la compieta, categoria: stato, nascosta: true, descrizione: "1 preso, 2 morto nella rottura del cristallo, 3 fuggito." }
  - { id: velo.finale, nome: Quello che la città sa, categoria: stato, nascosta: true, descrizione: "1 detto in Consiglio, 2 taciuto nella Cripta, 3 Valdrano rimandato fra i suoi con una lettera falsa." }
  - { id: velo.crepuscolo, nome: La lettera falsa, categoria: stato, nascosta: true, descrizione: "1 se Valdrano è tornato fra i suoi con una lettera scritta dal Velo. Per il Capitolo II." }
  - { id: velo.udienza, immagine: personaggi/madre-del-velo, nome: Udienza nella Cripta, categoria: accesso, descrizione: "La Madre del Velo ti riceve sotto l'altare quando scendi. Ascolta, e qualche volta risponde." }

fazioni:
  - id: velo
    nome: Confraternita del Velo
    immagine: fazioni/confraternita-del-velo
    reputazione: rep.velo
    pista: fazione.velo
    gradi:
      - { passo: 3, nome: Laico della tavoletta, ricompensa: "La corda del laico, le lezioni della Liturgia a metà offerta, l'infermeria dei laici e la paga di benvenuto di Sorella Arva." }
      - { passo: 6, nome: Laico consacrato, ricompensa: "Il sigillo del Velo, la Cripta aperta, Rimarginare e Veglia senza offerta, e i confratelli che ti rimettono in piedi in convalescenza e nel delirio." }
      - { passo: 9, nome: Custode dei pozzi, ricompensa: "La lanterna del custode, la chiave di garitta con il suo turno, la purificazione senza offerta ed Esorcismo insegnato gratis." }
      - { passo: 12, nome: Velato della Cripta, ricompensa: "Il velo grigio di chi serve sotto l'altare, una cella nel chiostro dove dormire senza pagare e il servizio della Cripta." }
      - { passo: 15, nome: Custode del Silenzio, ricompensa: "Una delle due lame di Kael Dareth, il Battito insegnato senza offerta, una borsa pesante e, secondo come finisce, l'udienza nella Cripta o il simbolo dell'Albero in platino." }
