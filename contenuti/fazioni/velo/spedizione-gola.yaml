# La gola di Tuarmir, spedizione del passo 11 della quest del Velo (fazione.velo == 10). Ci si entra dalla Superficie
# Fratturata (velo-la-strada-di-tuarmir, in passi-2.yaml); la ritirata riporta in Superficie. Il villaggio resta sullo
# sfondo: la spedizione è la gola sotto le case.
# Le stanze chiedono tutte fazione.velo == 10 e vanno in fasce di profondità; una stanza superata non ricompare nella
# stessa visita:
# 0 la strada (le erbatrici con le maschere; Lonn Var, che vale anche a 1), 1 i terrazzi (le foglie che cambiano; il
# vento dalla parte sbagliata, che vale anche a 2), 2 il fondo della gola (il fungo da non guardare; i predoni della
# gola; le fenditure che si lamentano, che valgono anche a 3), 3 sotto la porta (il riparo di Sorella Alenna, dove
# aiutarla a raccogliere imposta velo.aiutata; Madre Cerya sul sentiero). Il cuore a 4 è la porta precuriana con l'Eco
# di Serad: batterlo, lasciarlo bussare e prendergli la moneta o scacciarlo con l'Esorcismo apre il seguito delle due
# monete, dove Alenna racconta la notte del 145 e decide (o decidi tu) se tornare in città (velo.alenna).
aree:
  - id: velo-gola-di-tuarmir
    immagine: ambientazione/tuarmir
    nome: La gola di Tuarmir
    sommario: "Una gola di roccia scura con le case di Tuarmir scavate nella pietra, che scende fino a una porta."
    spedizione: { ritorno: superficie-fratturata, soglia: 4, stanze: 3 }
    testo: |
      Tuarmir è scavata nelle pareti della gola, case-grotta coperte di un
      muschio così fitto che sembrano escrescenze della roccia. Sotto il
      villaggio la gola scende per terrazzi di erbe fino alle fenditure che i
      raccoglitori non nominano, e il vento soffia verso valle con un odore di
      pietra spaccata da poco.

storylet:
  # ------------------------------------------------------------ 0 · la strada
  - id: velo-gola-le-erbatrici
    immagine: ambientazione/tuarmir
    titolo: Le erbatrici
    sommario: "Sul sentiero della gola tre raccoglitrici con le maschere tagliano muschio e si fermano a guardarti."
    luogo: La gola di Tuarmir, il sentiero sotto il villaggio
    area: velo-gola-di-tuarmir
    ripetibile: true
    requisiti: [fazione.velo == 10, profondita.velo-gola-di-tuarmir == 0]
    testo: |
      Sotto le prime case tre raccoglitrici tagliano il muschio di una parete,
      con maschere di stoffa grigia sulla metà bassa della faccia. La più
      vecchia si abbassa la maschera e ti guarda il sigillo.

      «Sei del Velo» dice. «La sorella è giù, al riparo sotto la porta. Senza
      maschera non ci arrivi.»

      {resistenza Media fallita} Hai già cominciato a tossire, una tosse secca
      che sale dal fondo della gola e non si decide a uscire.
    opzioni:
      - testo: "Chiedere una maschera"
        descrizione: "Le raccoglitrici ne hanno di ricambio, se le convinci che sei qui solo per la sorella."
        prova: { attributo: sociale, abilita: [persuasione, empatia], difficolta: Media }
        successo:
          titolo: La maschera grigia
          testo: |
            Le dici di Alenna e delle lettere che non arrivano più, e la vecchia
            ti lega dietro la nuca una maschera ancora umida. L'erba amara ti fa
            lacrimare, ma la tosse si ferma.
          pe: { empatia: 3 }
          effetti: { profondita.velo-gola-di-tuarmir: 1 }
        fallimento:
          titolo: Il coltello ricurvo
          testo: |
            La vecchia torna al muschio senza risponderti, e resti sul sentiero a
            tossire finché non torni indietro.
          effetti: { tormento: 1 }

      - testo: "Legarti al viso un fazzoletto bagnato"
        descrizione: "Un fazzoletto bagnato nell'acqua della gola è peggio di una maschera, ma meglio di niente."
        prova: { attributo: fisico, abilita: resistenza, difficolta: Media }
        successo:
          titolo: Il fazzoletto
          testo: |
            Bagni il fazzoletto in un rivolo che sa di ferro, te lo leghi sul naso
            e scendi a passi corti.
          effetti: { profondita.velo-gola-di-tuarmir: 1 }
        fallimento:
          titolo: Le spore
          testo: |
            Il fazzoletto si asciuga in fretta, e a metà sentiero ti siedi su un
            sasso con la testa che gira.
          effetti: { tormento: 1 }

      - testo: "Aiutarle a tagliare il muschio"
        descrizione: "Un'ora a tagliare muschio a strisce, e forse una maschera in cambio."
        costo: 2
        esito:
          titolo: Il muschio
          testo: |
            Per un'ora tagli muschio con un coltello prestato, e alla fine la
            vecchia ti lega dietro la nuca una maschera grigia.
          effetti: { profondita.velo-gola-di-tuarmir: 1 }

  - id: velo-gola-lonn-var
    immagine: icone/swap-bag
    titolo: Lonn Var
    sommario: "Su una piazzola del sentiero un mercante carica un mulo di erbe per il Velo e di qualcosa per i clienti discreti."
    luogo: La gola di Tuarmir, una piazzola del sentiero
    area: velo-gola-di-tuarmir
    ripetibile: true
    requisiti: [fazione.velo == 10, profondita.velo-gola-di-tuarmir <= 1]
    testo: |
      Dove il sentiero si allarga, un uomo con un panciotto di velluto liso
      segna su un libro dei conti i sacchetti caricati sul mulo.

      «Lonn Var, per servirti. Erbe per il Velo, muschi per i riti e qualche
      fungo per i signori dei Quartieri Alti che dormono male» dice, battendo
      la mano su un sacchetto legato con un nastro viola. «Droghe spirituali,
      che il Velo finge di non vedere.»

      {politica-ed-economia Facile} Qualcuno nel Velo ci guadagna, e le
      forniture di Tuarmir le firma un cronista.

      Lonn Var e il mulo stanno in mezzo al sentiero.
    opzioni:
      - testo: "Comprargli un sacchetto"
        descrizione: "Il sacchetto viola costa caro, ma a un cliente Lonn Var fa strada volentieri."
        requisiti: [monete >= 15]
        esito:
          titolo: Il nastro viola
          testo: |
            Gli conti le monete in mano, e lui ti dà il sacchetto viola e tira da
            parte il mulo con un inchino. La sorella del Velo, ti dice, è giù
            sotto la porta.
          effetti: { profondita.velo-gola-di-tuarmir: 1, monete: -15, informazioni.pettegolezzo: 1 }

      - testo: "Fargli capire che il Velo sa"
        descrizione: "Un laico del Velo che riconosce il nastro viola è un problema per Lonn Var."
        prova: { attributo: sociale, abilita: [intimidire, ingannare], difficolta: Media }
        successo:
          titolo: Il cronista
          testo: |
            Gli dici che le forniture si possono rileggere, e Lonn Var smette di
            sorridere. Ti dice in fretta che le firma il cronista maggiore, un
            sacerdote anziano che chiude gli occhi su tutto, e tira il mulo contro
            la parete per farti passare.
          pe: { intimidire: 3 }
          effetti: { profondita.velo-gola-di-tuarmir: 1, informazioni.voce: 1 }
        fallimento:
          titolo: Il sorriso
          testo: |
            Lonn Var ride e dice che in Cattedrale il nastro viola lo conoscono
            meglio di te, poi resta lì a contare i sacchetti finché non te ne vai.
          effetti: { scandalo: 1 }

      - testo: "Aspettare che finisca di caricare"
        descrizione: "Prima o poi il mulo deve partire, basta non guardare i sacchetti."
        costo: 2
        esito:
          titolo: Il mulo
          testo: |
            Lonn Var conta i sacchetti tre volte, poi parte fischiettando verso il
            villaggio.
          effetti: { profondita.velo-gola-di-tuarmir: 1 }

  # ------------------------------------------------------------ 1 · i terrazzi
  - id: velo-gola-le-foglie
    immagine: ambientazione/tuarmir
    titolo: Le foglie
    sommario: "Sui terrazzi le erbe medicinali sembrano quelle di sempre, ma da vicino una sfumatura è cambiata."
    luogo: La gola di Tuarmir, i terrazzi delle erbe
    area: velo-gola-di-tuarmir
    ripetibile: true
    requisiti: [fazione.velo == 10, profondita.velo-gola-di-tuarmir == 1]
    testo: |
      I terrazzi scendono a gradini lungo la gola, con file di salvia
      d'argento e cardo del sonno, le erbe che Sorella Giulia usa nei Giardini
      della Linfa. Da vicino, sul bordo delle foglie, corre una linea sottile
      di un grigioblu che non sapresti nominare. Per scendere bisogna passare
      in mezzo alle erbe.

      {natura Difficile} Una pianta cambia il bordo delle foglie quando cambia
      l'aria che respira, e queste l'hanno fatto tutte insieme.

      {origine figlio-del-circolo} Nel Bosco di Velthar ti hanno insegnato a
      guardare il bordo delle foglie prima del colore. I druidi lo chiamano il
      primo segno.
    opzioni:
      - testo: "Studiare le foglie"
        descrizione: "Se le erbe cambiano il Velo deve saperlo, e una foglia raccolta bene dice molto."
        prova: { attributo: mentale, abilita: [natura, medicina], difficolta: Media }
        successo:
          titolo: La linea grigia
          testo: |
            Spezzi una foglia di salvia d'argento, e la linea grigioblu corre
            dentro le vene, con un odore di pietra spaccata. La metti nel libro di
            preghiere per Giulia.
          pe: { natura: 3 }
          effetti: { profondita.velo-gola-di-tuarmir: 1 }
        fallimento:
          titolo: La peluria
          testo: |
            La peluria della foglia ti si attacca alla pelle e brucia, e passi il
            tempo a sciacquarti le dita gonfie in un rivolo.
          effetti: { ferite: 0.5 }

      - testo: "Scendere senza toccare le erbe"
        descrizione: "I muretti sono bassi, e con un po' di equilibrio si passa sul bordo."
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Media }
        successo:
          titolo: Il bordo dei muretti
          testo: |
            Cammini sul bordo dei muretti a braccia larghe, e all'ultimo terrazzo
            salti giù sul sentiero.
          effetti: { profondita.velo-gola-di-tuarmir: 1 }
        fallimento:
          titolo: Il muretto
          testo: |
            Un sasso si muove e finisci a quattro zampe fra le erbe, e ti rialzi
            con le mani a chiazze rosse.
          effetti: { ferite: 0.5 }

      - testo: "Fare il giro lungo, per il canalone"
        descrizione: "Il canalone di sassi a lato dei terrazzi è lungo e scivoloso, ma lontano dalle erbe."
        costo: 2
        esito:
          titolo: Il canalone
          testo: |
            Scendi il canalone a passi corti, con i sassi che rotolano fino in
            fondo, e arrivi giù con le scarpe piene di ghiaia.
          effetti: { profondita.velo-gola-di-tuarmir: 1 }

  - id: velo-gola-il-vento
    immagine: ambientazione/tuarmir
    titolo: Il vento dalla parte sbagliata
    sommario: "Il vento della gola dovrebbe venire dalla Cicatrice, e invece sale dal fondo."
    luogo: La gola di Tuarmir, una cengia sopra il fondo
    area: velo-gola-di-tuarmir
    ripetibile: true
    requisiti: [fazione.velo == 10, profondita.velo-gola-di-tuarmir >= 1, profondita.velo-gola-di-tuarmir <= 2]
    testo: |
      La cengia corre a mezza parete, e il vento ti gonfia la maschera
      portando un rumore lontano e basso. A Qir-Azel il vento della
      Superficie viene sempre dalla Cicatrice, e questo sale dal fondo della
      gola. Più avanti la cengia si restringe.

      {percezione Media} Le maschere appese ad asciugare lungo la cengia sono
      tutte girate verso il villaggio, e anche le erbe dei terrazzi si
      piegano verso l'alto.
    opzioni:
      - testo: "Seguire il vento fino all'origine"
        descrizione: "Un vento che sale da una gola nasce da qualche parte, e seguendolo ci arrivi."
        prova: { attributo: mentale, abilita: [percezione, natura], difficolta: Media }
        successo:
          titolo: La fenditura
          testo: |
            Controvento arrivi sopra una fenditura stretta nel fondo, da cui il
            vento esce come da una bocca. Ti segni il punto e scendi per un
            sentiero di capre.
          pe: { percezione: 3 }
          effetti: { profondita.velo-gola-di-tuarmir: 1 }
        fallimento:
          titolo: La raffica
          testo: |
            Una raffica ti schiaccia contro la parete con le unghie nel muschio, e
            torni indietro un passo alla volta.
          effetti: { tormento: 1 }

      - testo: "Passare il tratto stretto"
        descrizione: "La cengia si restringe a un palmo, ma con la schiena alla parete si passa."
        prova: { attributo: fisico, abilita: [acrobazia, resistenza], difficolta: Media }
        successo:
          titolo: Un palmo
          testo: |
            Passi con la schiena incollata alla roccia e i talloni sul vuoto, e
            dall'altra parte la cengia si allarga e scende.
          effetti: { profondita.velo-gola-di-tuarmir: 1 }
        fallimento:
          titolo: Il vuoto
          testo: |
            A metà un piede scivola e resti appeso al muschio con una mano sola.
            Torni indietro con le gambe che tremano.
          effetti: { ferite: 0.5 }

      - testo: "Aspettare che il vento cali"
        descrizione: "Il vento della gola cala la sera, dicono le raccoglitrici."
        costo: 2
        esito:
          titolo: La sera
          testo: |
            Aspetti la sera al riparo di uno spuntone, e il vento cala davvero.
            Passi la cengia nella luce grigia, e dall'altra parte ricomincia alle
            tue spalle.
          effetti: { profondita.velo-gola-di-tuarmir: 1 }

  # ------------------------------------------------------------ 2 · il fondo della gola
  - id: velo-gola-il-fungo
    immagine: ambientazione/tuarmir
    titolo: Il fungo da non guardare
    sommario: "In fondo alla gola cresce un fungo che i raccoglitori non guardano mai."
    luogo: La gola di Tuarmir, il fondo
    area: velo-gola-di-tuarmir
    ripetibile: true
    requisiti: [fazione.velo == 10, profondita.velo-gola-di-tuarmir == 2]
    testo: |
      Il fondo della gola è un letto di pietre umide e muschio nero. In mezzo
      al sentiero, su un ceppo marcio, cresce un fungo grande come una mano
      aperta, con il cappello di un colore che cambia a seconda di come lo
      guardi, e intorno non cresce nient'altro. Gli occhi ti ci tornano da
      soli, e ogni volta la testa ti duole di più.

      {accademiche Media} A Tuarmir raccontano che Madre Cerya perse la vista
      a nove anni per aver guardato un fungo da lasciare stare.
    opzioni:
      - testo: "Passare senza guardarlo"
        descrizione: "Gli occhi sui piedi e sulle pietre, con la testa ferma."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Media }
        successo:
          titolo: Gli occhi sui piedi
          testo: |
            Passi accanto al ceppo contando le pietre, e dopo una ventina di passi
            il mal di testa se ne va.
          effetti: { profondita.velo-gola-di-tuarmir: 1 }
        fallimento:
          titolo: Un'occhiata
          testo: |
            All'ultimo passo ti volti, e ti ritrovi seduto sul sentiero con la
            testa che pulsa, senza sapere da quanto.
          effetti: { tormento: 1.5 }

      - testo: "Passare a occhi chiusi, a tastoni"
        descrizione: "Madre Cerya cammina nella gola senza vederla, e per venti passi puoi farlo anche tu."
        prova: { attributo: mentale, abilita: [natura, percezione], difficolta: Media }
        successo:
          titolo: Al tatto
          testo: |
            A occhi chiusi, le mani sul muschio della parete, distingui le pietre
            bagnate dalle asciutte, e quando trovi il legno marcio del ceppo lo
            giri al largo.
          pe: { natura: 3 }
          effetti: { profondita.velo-gola-di-tuarmir: 1 }
        fallimento:
          titolo: Il ceppo
          testo: |
            Inciampi nel ceppo, la mano finisce sul cappello tiepido del fungo e
            apri gli occhi d'istinto. Torni indietro con la testa che pulsa.
          effetti: { tormento: 1.5 }

      - testo: "Coprirlo con la maschera"
        descrizione: "Un fungo coperto non si guarda, e la maschera di ricambio è abbastanza grande."
        costo: 2
        esito:
          titolo: La stoffa grigia
          testo: |
            Ti avvicini all'indietro e lanci la maschera sopra il fungo senza
            voltarti, e sotto la stoffa grigia qualcosa continua a cambiare
            colore.
          effetti: { profondita.velo-gola-di-tuarmir: 1, tormento: 1 }

  - id: velo-gola-i-predoni
    immagine: ambientazione/tuarmir
    titolo: I predoni della gola
    sommario: "Due uomini con le dita lunghe e grigie scendono dalle rocce con i coltelli in mano."
    luogo: La gola di Tuarmir, il fondo
    area: velo-gola-di-tuarmir
    ripetibile: true
    requisiti: [fazione.velo == 10, profondita.velo-gola-di-tuarmir == 2]
    testo: |
      Due uomini scendono dalle rocce scivolando sul muschio, con i coltelli
      in mano e le dita lunghe e grigie, con una falange di troppo.
      Respirano con la bocca aperta, come se l'aria non bastasse, e uno dei
      due ti indica la bisaccia.

      {natura Media} Mesi nel vento nuovo, dormendo nelle fenditure. La
      Marea non li ha ancora cambiati del tutto, e quello che resta di loro
      ha fame.
    opzioni:
      - testo: "Affrontarli"
        descrizione: "La Marea li ha resi lenti a capire, e la fame cattivi."
        combattimento: velo-i-predoni-della-gola
        vittoria:
          titolo: Le fenditure
          testo: |
            Il secondo predone scappa su per le rocce lasciando il coltello, e il
            primo resta seduto nel muschio. Riprendi il sentiero con il coltello
            alla cintura.
          effetti: { profondita.velo-gola-di-tuarmir: 1 }
        sconfitta:
          titolo: La bisaccia
          testo: |
            Ti ritrovi nel muschio con il sapore del sangue in bocca. I predoni ti
            prendono il pane e spariscono su per le rocce.
          effetti: { tormento: 1 }

      - testo: "Dargli il pane"
        descrizione: "Un uomo che mangia ha le mani occupate, e un pane costa poco."
        prova: { attributo: sociale, abilita: [empatia, addestrare-animali], difficolta: Media }
        successo:
          titolo: Il pane
          testo: |
            Spezzi il pane davanti a loro, e lo mangiano accucciati senza smettere
            di guardarti prima di tornare sulle rocce.
          pe: { empatia: 3 }
          effetti: { profondita.velo-gola-di-tuarmir: 1 }
        fallimento:
          titolo: Il pane nel muschio
          testo: |
            Il pane lo prendono, ma il secondo vuole anche la bisaccia e ti spinge
            contro la roccia per strappartela.
          effetti: { ferite: 0.5 }

      - testo: "Tornare indietro e prendere un'altra strada"
        descrizione: "Il fondo della gola ha altri sentieri, più lunghi, lontani dalle rocce dei predoni."
        costo: 2
        esito:
          titolo: Il sentiero lungo
          testo: |
            Torni indietro piano e prendi un sentiero lungo il torrente, guadando
            due volte fino al ginocchio. Dei predoni non c'è più traccia.
          effetti: { profondita.velo-gola-di-tuarmir: 1 }

  - id: velo-gola-le-fenditure
    immagine: ambientazione/tuarmir
    titolo: Le fenditure
    sommario: "Da una fenditura nella roccia arriva un lamento regolare, e davanti c'è un fiore che fa luce."
    luogo: La gola di Tuarmir, le fenditure sotto il villaggio
    area: velo-gola-di-tuarmir
    ripetibile: true
    requisiti: [fazione.velo == 10, profondita.velo-gola-di-tuarmir >= 2, profondita.velo-gola-di-tuarmir <= 3]
    testo: |
      Lungo la parete di fondo si aprono le fenditure, alte quanto un uomo e
      larghe una spalla. Da una arriva un lamento a intervalli regolari,
      sempre sulla stessa nota, e davanti all'imboccatura un fiore bianco
      manda una luce fredda. Il sentiero passa rasente la parete.

      {natura Media} Sotto i petali si vede la forma di una mano, e dalla mano
      parte la radice.

      {origine figlio-della-citta-bassa fuggiasco-di-ghoran} Un lamento così
      l'hai già sentito, da qualcuno che si lamentava per abitudine molto dopo
      che il dolore era passato.
    opzioni:
      - testo: "Guardare dentro la fenditura"
        descrizione: "Se dentro c'è qualcuno, va tirato fuori."
        prova: { attributo: mentale, abilita: [percezione, resilienza], difficolta: Media }
        successo:
          titolo: Il vento nella roccia
          testo: |
            La fenditura è vuota e scende a spirale nel buio, e il lamento è il
            vento che dentro la roccia trova una nota sola. Passi oltre con la
            nuca fredda.
          effetti: { profondita.velo-gola-di-tuarmir: 1 }
        fallimento:
          titolo: La nota
          testo: |
            Il lamento ti arriva in faccia, e per un attimo è una voce che dice
            una parola che non capisci. Ti ritiri e sbatti la testa contro la
            roccia.
          effetti: { tormento: 1, ferite: 0.5 }

      - testo: "Benedire il morto sotto il fiore"
        descrizione: "Chi è morto sotto il fiore non ha avuto la preghiera."
        prova: { attributo: sociale, abilita: [empatia, galateo], difficolta: Media }
        successo:
          titolo: La preghiera dei morti
          testo: |
            Dici la preghiera dei morti con due dita sulla terra, e il lamento si
            interrompe giusto il tempo di accorgertene.
          pe: { empatia: 3 }
          effetti: { profondita.velo-gola-di-tuarmir: 1 }
        fallimento:
          titolo: Il fiore
          testo: |
            A metà preghiera vedi che la mano sotto i petali ha le unghie lunghe e
            grigie, e le parole ti si fermano in gola.
          effetti: { tormento: 1 }

      - testo: "Passare in fretta, rasente la parete"
        descrizione: "Il lamento è lamento e il fiore è fiore, basta non fermarsi."
        costo: 2
        esito:
          titolo: In fretta
          testo: |
            Passi svelto con la spalla contro la roccia, e il lamento si confonde
            presto con il rumore del torrente.
          effetti: { profondita.velo-gola-di-tuarmir: 1, tormento: 1 }

  # ------------------------------------------------------------ 3 · sotto la porta
  - id: velo-gola-il-riparo
    immagine: ambientazione/tuarmir
    titolo: Il riparo di Alenna
    sommario: "In un riparo di pietra sotto la parete una monaca del Velo e una ragazza del villaggio legano erbe in mazzi."
    luogo: La gola di Tuarmir, un riparo di pietra sotto la porta
    area: velo-gola-di-tuarmir
    ripetibile: true
    requisiti: [fazione.velo == 10, profondita.velo-gola-di-tuarmir == 3]
    testo: |
      Dove la gola si stringe, davanti a un riparo di pietra, due donne
      legano erbe in mazzi. Una, Sorella Alenna, porta la tonaca del Velo;
      l'altra è una ragazza del villaggio, con le mani verdi fino ai polsi.

      «Vantes» dice Alenna, senza alzare la testa dai mazzi. «Gliel'avevo
      scritto, di non mandare nessuno. Le erbe cambiano e il vento ha girato,
      e se scrivo quello che vedo mi chiamano pazza, così ho smesso di
      scrivere.»

      {percezione Facile} Sulla parete liscia in fondo alla gola c'è un
      rettangolo più scuro della pietra intorno, troppo dritto per essere
      naturale.
    opzioni:
      - testo: "Aiutarla a raccogliere"
        descrizione: "Le erbe di stasera vanno legate prima del buio, e chi lavora accanto a lei la sente parlare."
        prova: { attributo: mentale, abilita: [natura, medicina], difficolta: Media }
        successo:
          titolo: I mazzi
          testo: |
            Leghi erbe accanto alla ragazza fino a sera, e Alenna parla da sola
            delle foglie, del vento che ha girato e di Madre Cerya che dice di non
            guardare in alto. Quando la cesta è piena ti indica la parete liscia,
            dove c'è la porta.
          pe: { natura: 3 }
          imposta: { velo.aiutata: 1 }
          effetti: { profondita.velo-gola-di-tuarmir: 1 }
        fallimento:
          titolo: Le erbe sbagliate
          testo: |
            Leghi il cardo con la salvia, e la ragazza ride dietro la mano mentre
            Alenna rifà i mazzi da capo.
          effetti: { tormento: 1 }

      - testo: "Darle la lettera di Vantes"
        descrizione: "Forse una lettera con il sigillo del Velo la legge, anche se non scrive più."
        prova: { attributo: sociale, abilita: [persuasione, galateo], difficolta: Media }
        successo:
          titolo: La lettera
          testo: |
            Alenna legge in piedi, e a metà si siede. Infila la lettera nella
            tonaca e ti dice che Vantes le chiede scusa, e che lei non sa di che
            cosa. Poi ti indica la parete liscia.
          pe: { persuasione: 3 }
          effetti: { profondita.velo-gola-di-tuarmir: 1 }
        fallimento:
          titolo: Il sigillo intatto
          testo: |
            Alenna posa la lettera chiusa nella cesta e torna ai mazzi, e resti in
            piedi finché la ragazza non ti porta un sasso.
          effetti: { tormento: 1 }

      - testo: "Aspettare che finisca il lavoro"
        descrizione: "Le erbe vengono prima delle visite, e lei parlerà quando avrà deciso."
        costo: 2
        esito:
          titolo: La sera
          testo: |
            Aspetti tutta la sera. Quando l'ultima cesta è piena Alenna si pulisce
            le mani sulla tonaca e ti indica il rettangolo scuro sulla parete
            liscia.
          effetti: { profondita.velo-gola-di-tuarmir: 1 }

  - id: velo-gola-madre-cerya
    immagine: ambientazione/tuarmir
    titolo: Madre Cerya
    sommario: "Sul sentiero verso la parete liscia una vecchia cieca cammina senza bastone e non inciampa mai."
    luogo: La gola di Tuarmir, il sentiero sotto la parete liscia
    area: velo-gola-di-tuarmir
    ripetibile: true
    requisiti: [fazione.velo == 10, profondita.velo-gola-di-tuarmir == 3]
    testo: |
      Sul sentiero verso la parete liscia una vecchia piccola, con gli occhi
      chiusi da pieghe di pelle, cammina senza bastone sulle pietre bagnate e
      ogni tanto tocca una pianta con le dita macchiate di verde. È Madre
      Cerya, l'erborista che guida la raccolta di Tuarmir, e ti ha sentito
      arrivare da lontano.

      «Vieni per la porta, come tutti quelli del Velo» dice, senza voltarsi.
      «Serad era arrivato a una porta, e ha bussato. Dieci anni, e qualche
      notte lo sentiamo ancora.»

      {empatia Facile} Ti dice una cosa che sa, come direbbe che domani
      piove.
    opzioni:
      - testo: "Chiederle della porta"
        descrizione: "Se c'è un modo di arrivare alla porta, Cerya lo conosce."
        prova: { attributo: sociale, abilita: [empatia, galateo], difficolta: Media }
        successo:
          titolo: La scala dei raccoglitori
          testo: |
            Cerya ti prende il polso con la mano verde e ti porta a una scala di
            gradini scavati nella roccia, nascosta dal muschio. «Sali piano, e se
            senti bussare non rispondere» ti raccomanda.
          pe: { empatia: 3 }
          effetti: { profondita.velo-gola-di-tuarmir: 1 }
        fallimento:
          titolo: Il raccolto
          testo: |
            Cerya ti dice che stasera la porta va lasciata in pace, e si
            allontana. Cerchi una strada da solo finché non fa buio.
          effetti: { tormento: 1 }

      - testo: "Darle la lettera di Vantes"
        descrizione: "Cerya è cieca, e forse vuole che qualcuno le legga la lettera di Vantes."
        prova: { attributo: sociale, abilita: [persuasione, accademiche], difficolta: Media }
        successo:
          titolo: La voce di Vantes
          testo: |
            Le leggi la lettera ad alta voce, e alla fine lei sorride appena. «Il
            vecchio Aurelio» dice, e ti porta a una scala di gradini scavati nella
            roccia che sale verso la parete.
          pe: { persuasione: 3 }
          effetti: { profondita.velo-gola-di-tuarmir: 1 }
        fallimento:
          titolo: Le parole del Velo
          testo: |
            A metà lettera lei alza una mano. «Parole del Velo» dice, e se ne va
            per il suo sentiero.
          effetti: { tormento: 1 }

      - testo: "Seguirla a distanza"
        descrizione: "Cerya va dove va il raccolto, e il raccolto sale."
        costo: 2
        esito:
          titolo: I gradini nel muschio
          testo: |
            La segui a distanza per tutto il pomeriggio. Al tramonto sale per una
            scala di gradini nascosta dal muschio, e a metà volta verso di te gli
            occhi chiusi e ti fa cenno di passare.
          effetti: { profondita.velo-gola-di-tuarmir: 1 }

  # ------------------------------------------------------------ il cuore · la porta di Serad
  - id: velo-la-porta-di-serad
    immagine: ambientazione/rovine-dei-precursori
    titolo: La porta
    sommario: "In cima alla scala dei raccoglitori, nella parete liscia, c'è una porta di metallo grigio, e davanti qualcuno bussa."
    luogo: La gola di Tuarmir, la parete liscia
    area: velo-gola-di-tuarmir
    requisiti: [fazione.velo == 10, profondita.velo-gola-di-tuarmir >= 4]
    testo: |
      In cima alla scala, nella parete liscia come ardesia, c'è una porta di
      metallo grigio senza maniglia né cardini, incassata con una precisione
      che nessuno scalpellino di Tuarmir avrebbe saputo dare.

      {tecnologia Media} È precuriana. Non ha serrature perché non si apre
      dall'esterno, e i bordi sono freddi come se dall'altra parte ci fosse
      l'inverno.

      Davanti alla porta c'è un uomo con la tonaca del Velo, fatto di una luce
      grigia e sporca come la polvere in un raggio di sole. Bussa tre volte,
      aspetta con la testa piegata ad ascoltare, e quando nessuno risponde
      bussa di nuovo. La mano sinistra è chiusa contro il petto, e nel palmo
      brilla qualcosa di piccolo e scuro.

      {origine accolito-del-velo} Il nome di Serad di Tuarmir lo leggevi ogni
      mattina sul registro dei sacerdoti, l'unico con la riga ancora aperta
      dopo dieci anni.

      Nella tasca, il disco con l'occhio chiuso comincia a vibrare, e lo senti
      nei denti prima che nelle dita.
    opzioni:
      - testo: "Affrontare l'Eco di Serad"
        descrizione: "È un'eco della Marea, e se lo interrompi si volta."
        combattimento: velo-l-eco-di-serad
        vittoria:
          titolo: L'ultimo colpo
          testo: |
            L'Eco si disfa a metà di un colpo alla porta, e sul gradino resta la
            cosa piccola e scura che teneva nella mano sinistra. Alenna arriva di
            corsa dalla scala, con la ragazza del villaggio dietro.
          segue: velo-le-due-monete
        sconfitta:
          titolo: Il pugno
          testo: |
            L'Eco ti colpisce con il pugno con cui bussava, e il freddo della
            porta ti entra nel petto. Ti ritrovi sul gradino fra le braccia di
            Alenna, mentre la ragazza stacca dalla mano dell'Eco la cosa scura.
          effetti: { tormento: 1.5 }
          segue: velo-le-due-monete

      - testo: "Lasciarlo bussare e prendergli quello che tiene"
        descrizione: "Fra un colpo e l'altro ha la testa piegata verso la porta, e la mano sinistra è a portata."
        prova: { attributo: fisico, abilita: furtivita, difficolta: Difficile }
        successo:
          titolo: Fra un colpo e l'altro
          testo: |
            Gli sfili la cosa scura dalla mano sinistra con due dita, fredda come
            la porta. L'Eco bussa ancora tre volte e per la prima volta in dieci
            anni si ferma, sfilacciandosi nel vento.
          pe: { furtivita: 5 }
          segue: velo-le-due-monete
        fallimento:
          titolo: La testa che si gira
          testo: |
            La testa dell'Eco si gira, con due buchi di luce grigia al posto degli
            occhi, e il freddo ti prende fino ai gomiti. Alenna ti tira via per la
            tonaca, e la cosa scura ti resta in mano per caso.
          effetti: { tormento: 1.5 }
          segue: velo-le-due-monete

      - testo: "Recitare l'Esorcismo sulla soglia"
        incantesimo: esorcismo
        descrizione: "Serad era del Velo, e le parole del rito delle cripte forse le riconosce."
        prova: { attributo: mentale, abilita: magia, difficolta: Difficile }
        successo:
          titolo: Le parole del Velo
          testo: |
            Alla terza frase del rito l'Eco smette di bussare e la sua bocca si
            muove con la tua, sulle stesse parole. Poi lascia cadere sul gradino
            la cosa scura e si sfilaccia nel vento.
          pe: { magia: 5 }
          segue: velo-le-due-monete
        fallimento:
          titolo: Il rito spezzato
          testo: |
            L'Eco ti risponde con le stesse parole, un attimo prima di te, e la
            voce ti si spezza. Alenna ti tira indietro, e la ragazza raccoglie dal
            gradino la cosa scura che gli è caduta.
          effetti: { tormento: 1.5 }
          segue: velo-le-due-monete

  - id: velo-le-due-monete
    immagine: ambientazione/tuarmir
    titolo: I due dischi
    tipo: seguito
    luogo: La gola di Tuarmir, la scala dei raccoglitori
    area: velo-gola-di-tuarmir
    requisiti: [fazione.velo == 10, profondita.velo-gola-di-tuarmir >= 4]
    testo: |
      La cosa scura è un disco di metallo grande come una moneta, con un
      occhio chiuso inciso sopra. Quando lo avvicini a quello che porti in
      tasca i due dischi vibrano, con un suono che non arriva alle orecchie e
      ti si ferma nei denti.

      {magia Media} Si chiamano. Sono fatti per sapere l'uno dell'altro, a una
      certa distanza, e per nient'altro.

      Alenna si siede sul gradino, con la schiena alla porta, e racconta. Era
      una dei sei della compieta, e quella notte Valdrano li chiamò fuori per
      il rito votivo sull'orlo della Cicatrice. «Ma Valdrano rientrò prima di
      noi» dice. «Disse che andava a prendere i libri delle misure, che non
      voleva lasciare al fumo. Ne uscì quando le fiamme erano già in cima
      all'ala nord, con i libri sotto il braccio, asciutti.»

      La ragazza del villaggio le si siede accanto e le prende la mano verde
      nella sua.
    opzioni:
      - testo: "Lasciare che sia lei a decidere"
        descrizione: "Avete raccolto insieme e lei ti ha parlato, e la scelta è sua."
        quando: [velo.aiutata >= 1]
        esito:
          titolo: La ragazza del villaggio
          testo: |
            Alenna guarda la ragazza a lungo e ti dice che resta, perché Madre
            Cerya ha bisogno di qualcuno che sappia scrivere quello che lei sa. Ti
            dà una lettera per Vantes chiusa con la cera verde delle erbe, e
            risali la gola da solo con i due dischi in tasche diverse.
          pe: { empatia: 5 }
          imposta: { velo.alenna: 2 }
          effetti: { fazione.velo: 1, rep.velo: 1, reperto.sigillato: 1 }
          vai: superficie-fratturata

      - testo: "Riportarla in città"
        descrizione: "Quello che ha visto va detto in Cattedrale, e lei ha bisogno che qualcuno decida."
        quando: [velo.aiutata == 0]
        esito:
          titolo: La strada di casa
          testo: |
            Le dici che quello che sa va detto in Cattedrale, e alla fine si alza,
            mentre la ragazza piange senza rumore. Risalite la gola insieme, e i
            due dischi li tieni in tasche diverse.
          pe: { persuasione: 5 }
          imposta: { velo.alenna: 1 }
          effetti: { fazione.velo: 1, rep.velo: 1, reperto.sigillato: 1 }
          vai: superficie-fratturata

      - testo: "Lasciarla con Madre Cerya"
        descrizione: "Qui ha un lavoro e una ragazza che le vuole bene, e in città ha Valdrano."
        quando: [velo.aiutata == 0]
        esito:
          titolo: Il riparo
          testo: |
            Le dici di restare, e lei ti guarda come se le avessi tolto un peso.
            Ti dà una lettera per Vantes chiusa con la cera verde, e risali la
            gola da solo con i due dischi in tasche diverse.
          pe: { empatia: 5 }
          imposta: { velo.alenna: 2 }
          effetti: { fazione.velo: 1, rep.velo: 1, reperto.sigillato: 1 }
          vai: superficie-fratturata
