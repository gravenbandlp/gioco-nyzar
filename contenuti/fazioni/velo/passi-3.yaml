# La quest della Confraternita del Velo, passi 12-15.
# - Passo 12 (fazione.velo == 11, grado 4): sotto l'altare, con la Madre del Velo. Si apre con pista.capomozzo >= 8;
#   prima Vantes ti dice che la Madre non riceve. La Madre ascolta e non dice quello che sa: accettare l'attesa
#   (velo.attesa 1) o andare da Vantes e dalla Caserma (2). Il seguito in navata, con il disco che vibra al passaggio
#   di Valdrano, chiude il passo e dà il grado.
# - Passo 13 (== 12, da qui pista.capomozzo >= 9): il tè ai tavoli dei cronisti. Reggere la parte (Ingannare, più
#   difficile con velo.allarme), scoprirsi o farlo seguire dai passeri di Giulia. Il seguito dice il piano e lascia
#   avvertire chi vuoi: Bessi, Celia, Aurenne, Ottilia (velo.campanile, liuto, artiglio, porte). Ognuno è una via
#   nel passo 14.
# - Passo 14 (== 13): la compieta grande, la boss battle. Tutte le vie sono Difficili; fallire costa Tormento e
#   Ferite, e Valdrano fugge. velo.valdrano: 1 preso, 2 morto nella rottura, 3 fuggito.
# - Passo 15 (== 14, grado 5): la bocca cucita. La Madre chiede che cosa deve sapere la città: dirlo in Consiglio,
#   tacerlo nella Cripta, o (Valdrano preso e attesa accettata) rimandarlo fra i suoi con una lettera falsa. Ogni
#   ramo dà la lama di Kael Dareth e la borsa; il resto in velo.finale.
storylet:
  # ------------------------------------------------------------ passo 12 · la Madre non riceve
  - id: velo-la-madre-non-riceve
    presso: cattedrale-del-velo
    immagine: personaggi/padre-vantes
    titolo: La Madre non riceve
    sommario: "Le lettere, i dischi, la notte del 145. È roba per la Madre, e la Madre, dice Vantes, adesso non riceve."
    luogo: Cattedrale del Velo, la scala della Cripta
    area: quartieri-alti
    requisiti: [fazione.velo == 11, pista.capomozzo < 8]
    testo: |
      Davanti alla scala della Cripta c'è Padre Vantes, con le mani giunte sul
      ventre e la faccia di un uomo che ha dormito poco. Ti ascolta fino in
      fondo, la riga strappata, la sacca sotto l'Orlo, le lettere a S. e il
      racconto di Alenna, e mentre parli guarda il disco che tieni sul palmo.

      «La Madre non riceve, adesso» dice alla fine. «Quando riceverà, ti
      chiamerà lei.» Ti posa due dita sul polso. «Con quello che succede a
      Capomozzo, la Cripta ha altro da ascoltare.»

      {empatia Media} Vorrebbe scendere lui, con le tue lettere in mano, e sa
      di non poterlo fare. Ha l'aria di un uomo a cui è stato chiesto di
      aspettare per primo.

      Il disco sul palmo è freddo e leggero, e non vibra.
    opzioni:
      - testo: "Aspettare che la Madre ti chiami"
        descrizione: "Vantes ha ragione, o almeno ha l'ordine di dirlo. La Cripta resta dov'è."
        costo: 0
        esito:
          titolo: La scala
          testo: |
            Rimetti il disco in tasca e risali in navata. Vantes resta davanti
            alla scala con le mani giunte, e quando ti volti dalla porta non
            si è ancora mosso.

  # ------------------------------------------------------------ passo 12 · sotto l'altare (grado 4)
  - id: velo-sotto-l-altare
    presso: cattedrale-del-velo
    immagine: personaggi/madre-del-velo
    titolo: Sotto l'altare
    sommario: "La Madre del Velo ti riceve nella Cripta. Ascolta tutta la storia della riga strappata, e i veli non si muovono."
    luogo: Cattedrale del Velo, la Cripta
    area: quartieri-alti
    requisiti: [fazione.velo == 11, pista.capomozzo >= 8]
    testo: |
      Le colonne della Cripta si perdono nel buio oltre il cerchio delle
      candele, e sopra la tua testa, attraverso la volta, senti il battito del
      cristallo rosso come si sente il cuore di qualcuno contro il quale si è
      appoggiati. La Madre siede sul suo seggio di pietra, avvolta nei veli
      grigi e neri che le scendono fino ai piedi. Di lei non si vedono nemmeno
      le mani.

      Le racconti tutto. La riga strappata e le sei firme, la sacca senza
      misura e la cassetta di latta, le lettere a S. e le due notti del 145,
      quella di Ardice con la Cicatrice che brillava e quella di Alenna con i
      libri asciutti. Posi i due dischi sul gradino del seggio. I veli non si
      muovono.

      {resistenza Media} Il freddo della pietra ti sale dalle ginocchia fino
      ai fianchi. Nessuno ti ha detto di alzarti, e il corpo ha già capito che
      non te lo dirà nessuno.

      {empatia Difficile} Alla seconda cosa che le dici capisci che niente di
      quello che le dici è nuovo per lei. Ti ascolta come si ascolta qualcuno
      che legge ad alta voce una lettera che hai scritto tu.

      «Chi scrive da dieci anni sa aspettare» dice la Madre, con una voce
      bassa e senza inflessioni che non sembra venire da un punto preciso.
      «Anche chi legge. Si attende ciò che si conosce.» Un velato ti si
      avvicina con un velo grigio ripiegato sulle braccia, lo stesso che porta
      lui.

      {origine accolito-del-velo} Da novizio guardavi passare i velati grigi
      dal fondo della navata, chiedendoti che cosa vedessero sotto l'altare.
      Adesso il velo grigio è sulle braccia di uno di loro, e lo stanno
      porgendo a te.

      *Dieci anni, e lei lo sapeva.* Il pensiero ti arriva da solo, e lo
      ricacci giù, perché qui sotto ti sembra che lei possa sentirlo.
    opzioni:
      - testo: "Accettare l'attesa"
        descrizione: "Il velo grigio, il disco in tasca e la pazienza. Chi scrive da dieci anni prima o dopo sbaglia una mossa."
        esito:
          titolo: Il velo grigio
          testo: |
            Chini la testa, e il velato ti posa sulle spalle il velo grigio,
            che è più leggero di come sembra. La Madre ti chiede di tenere il
            disco in tasca e di passare per la navata alle ore canoniche, come
            sempre. Ti riprendi un disco dal gradino. L'altro resta sulla
            pietra, e quando sali la scala nessuno lo ha ancora toccato.
          imposta: { velo.attesa: 1 }
          segue: velo-la-navata-della-sera

      - testo: "Chiederle perché ha lasciato fare"
        descrizione: "Dieci anni di lettere sotto il suo altare. Una domanda così, alla Madre, non la fa nessuno."
        prova: { attributo: sociale, abilita: empatia, difficolta: Difficile }
        successo:
          titolo: Un ordine che cade
          testo: |
            Per un lungo momento i veli restano fermi. Poi la voce cambia di
            poco, e per un attimo è quasi la voce di una donna stanca. Ti dice
            che ha visto cadere un ordine, molto tempo fa, perché tutti quelli
            che ne facevano parte avevano fretta di sapere chi tradiva. «Il
            Velo dura perché sa aspettare» dice, e la voce torna quella di
            prima. Il velato ti posa sulle spalle il velo grigio.
          pe: { empatia: 10 }
          imposta: { velo.attesa: 1 }
          segue: velo-la-navata-della-sera
        fallimento:
          titolo: I veli fermi
          testo: |
            La domanda resta sospesa fra le colonne, e la Madre non risponde.
            Dopo un po' il velato ti posa sulle spalle il velo grigio, come se
            la domanda non fosse mai stata fatta. Ti riprendi un disco dal
            gradino, e risali la scala con la nuca che scotta.
          imposta: { velo.attesa: 1 }
          segue: velo-la-navata-della-sera

      - testo: "Rifiutare e andare da Vantes e dalla Caserma"
        descrizione: "Aspettare vuol dire lasciarlo scrivere ancora. Vantes siede in Consiglio, e la Caserma ha le celle."
        esito:
          titolo: Le spalle alla Madre
          testo: |
            Le dici che non aspetterai, e i veli non si muovono nemmeno questa
            volta. Il velato ti posa lo stesso sulle spalle il velo grigio,
            senza una parola. Vantes ti ascolta in sagrestia diventando sempre
            più pallido, poi ti accompagna alla Caserma, dove un ufficiale
            prende nota di tutto con una lentezza che sembra fatta apposta. Da
            quel giorno la Madre non ti manda più a chiamare.
          imposta: { velo.attesa: 2 }
          segue: velo-la-navata-della-sera

      - testo: "Lasciarti mettere il velo grigio in silenzio"
        descrizione: "Da novizio ti hanno insegnato che sotto l'altare non si fanno domande. Questa volta la lezione serve."
        quando: [origine.accolito-del-velo >= 1]
        esito:
          titolo: La lezione di allora
          testo: |
            Chini la testa senza dire niente, come ti hanno insegnato, e il
            velato ti posa sulle spalle il velo grigio. La Madre ti chiede di
            tenere il disco in tasca e di passare per la navata alle ore
            canoniche. Mentre risali la scala ti accorgi che stai camminando
            al passo lento dei velati, senza averlo deciso.
          imposta: { velo.attesa: 1 }
          segue: velo-la-navata-della-sera

  - id: velo-la-navata-della-sera
    presso: cattedrale-del-velo
    immagine: ambientazione/cattedrale-del-velo
    titolo: La navata della sera
    tipo: seguito
    luogo: Cattedrale del Velo, la navata, all'ora del vespro
    area: quartieri-alti
    requisiti: [fazione.velo == 11]
    testo: |
      La sera dopo attraversi la navata all'ora del vespro con il velo grigio
      sulle spalle, e la gente si scansa per lasciarti passare, come si fa con
      i velati. Il disco è nella tasca della tonaca, contro la coscia. Dai
      tavoli dei cronisti esce Padre Valdrano con la teiera di coccio in mano,
      e viene verso l'altare per la sua strada di sempre, a passi corti,
      strascicando appena il piede destro.

      A dieci passi il disco comincia a vibrare. Lo senti nella coscia, poi
      nei denti, un suono senza suono che sale piano. A cinque passi Valdrano
      si ferma.

      {ingannare Media} Non si è fermato per la teiera. La mano libera è
      andata alla tasca della tonaca, e ci è rimasta.

      {percezione Facile} Sotto la tonaca, alla cintura, il righello di bosso
      non c'è più. Al suo posto c'è un righello di metallo scuro.

      Valdrano ti guarda il velo grigio, poi la faccia. Poi sorride con
      gentilezza, e ti offre il tè.
    opzioni:
      - testo: "Accettare il tè"
        descrizione: "Il tè di Valdrano lo prendono tutti, in Cattedrale. Rifiutarlo sarebbe più strano."
        esito:
          titolo: Velato della Cripta
          testo: |
            Accetti la tazza, e lui te la riempie con la mano ferma. Parlate
            del vespro e del tempo. Quando se ne va il disco si calma piano,
            come un cane che smette di ringhiare, e tu ti accorgi di avere la
            tazza ancora piena in mano. La sera Ottilia ti dà la chiave di una
            cella nel chiostro, dove i velati dormono quando vogliono.
          pe: { resilienza: 10 }
          effetti: { fazione.velo: 1, oggetto.velo-velo-grigio: 1 }
          almeno: { rep.velo: 8 }

      - testo: "Tenere la mano lontana dalla tasca"
        descrizione: "Lui ha messo la mano sulla sua. Se tu metti la tua sulla tua, lo sa."
        prova: { attributo: sociale, abilita: [ingannare, resilienza], difficolta: Media }
        successo:
          titolo: Le mani ferme
          testo: |
            Tieni le mani giunte davanti alla cintura come un velato vero, e
            gli rispondi che il tè lo prendi più tardi, dopo il vespro. Lui
            annuisce, e la mano gli esce dalla tasca. Lo guardi allontanarsi
            verso l'altare, e il disco si calma un passo alla volta. La sera
            Ottilia ti dà la chiave di una cella nel chiostro, dove i velati
            dormono quando vogliono.
          pe: { ingannare: 10 }
          effetti: { fazione.velo: 1, oggetto.velo-velo-grigio: 1 }
          almeno: { rep.velo: 8 }
        fallimento:
          titolo: La mano in tasca
          testo: |
            La mano ti va alla tasca da sola, sul disco che vibra, e Valdrano
            la guarda. Sorride di nuovo, e se ne va verso l'altare senza
            fretta. La sera Ottilia ti dà la chiave di una cella nel chiostro,
            dove i velati dormono quando vogliono, e tu ci passi la notte a
            fissare il soffitto.
          effetti: { fazione.velo: 1, oggetto.velo-velo-grigio: 1, velo.allarme: 1 }
          almeno: { rep.velo: 8 }

      - testo: "Guardarlo negli occhi"
        descrizione: "Dieci anni di lettere, e adesso è a cinque passi. Vuoi vedere che faccia ha uno così."
        esito:
          titolo: Gli occhi del cronista
          testo: |
            Lo guardi negli occhi, e lui regge lo sguardo con gentilezza, come
            un vecchio maestro con un allievo che ha qualcosa da dire. Poi
            abbassa gli occhi sul tuo velo grigio, e se ne va verso l'altare
            con la teiera. La sera Ottilia ti dà la chiave di una cella nel
            chiostro, dove i velati dormono quando vogliono.
          pe: { resilienza: 10 }
          effetti: { fazione.velo: 1, oggetto.velo-velo-grigio: 1 }
          almeno: { rep.velo: 8 }

  # ------------------------------------------------------------ passo 13 · il tè di Valdrano
  - id: velo-il-te-di-valdrano
    presso: cattedrale-del-velo
    immagine: icone/teapot
    titolo: Il tè di Valdrano
    sommario: "Anche il disco di Valdrano ha vibrato. Ai tavoli dei cronisti c'è una tazza girata per te, e lui ti aspetta."
    luogo: Cattedrale del Velo, i tavoli lunghi dei cronisti
    area: quartieri-alti
    requisiti: [fazione.velo == 12, pista.capomozzo >= 9]
    testo: |
      Ai tavoli lunghi dei cronisti, la mattina dopo, c'è una tazza girata
      davanti al posto vuoto accanto a Valdrano. Gli altri cronisti copiano i
      registri a testa bassa, e quando ti siedi nessuno alza gli occhi.
      Valdrano ti versa il tè senza chiederti se lo vuoi. Ha il righello di
      metallo scuro posato sul tavolo accanto alla teiera, e ci tiene sopra
      due dita come su un libro di preghiere.

      «Non ci si incontra mai» dice piano, guardando il tè. «Se non quando chi
      sta sopra lo vuole. In dieci anni non è mai successo, e allora mi
      domando chi ti manda.» Ti guarda il velo grigio. «Oppure se ti manda
      qualcuno.»

      {ingannare Media} Non sa chi sei. Ha due risposte pronte, una per il
      superiore e una per il messaggero, e aspetta di capire quale usare.

      {accademiche Media} Le lettere cominciavano tutte con il soggetto e
      finivano con un punto. Lui parla allo stesso modo, con le frasi che si
      chiudono dove devono.

      Il disco nella tua tasca vibra piano, e quello nella sua pure. Lo senti
      nei denti, come un dente che sta per fare male.

      {origine accolito-del-velo} Questo tè lo hai bevuto mille volte da
      novizio, quando Valdrano passava fra i banchi a correggere le copie e ne
      versava una tazza a chi aveva sbagliato meno. Ha lo stesso sapore, e ti
      si ferma in gola.
    opzioni:
      - testo: "Reggere la parte"
        descrizione: "Lui crede che ti mandi qualcuno. Se glielo lasci credere, forse ti dice che cosa aspetta."
        quando: [velo.allarme == 0]
        prova: { attributo: sociale, abilita: ingannare, difficolta: Difficile }
        successo:
          titolo: L'istruzione
          testo: |
            Bevi il tè e non rispondi, e lasci che sia lui a riempire il
            silenzio. Lo riempie. Parla della compieta grande, di chi siederà
            sull'ultima panca, di una crepa nel cristallo che lui conosce
            meglio dei sacerdoti che ci pregano davanti. Quando ha finito ti
            chiede se l'istruzione è quella, e tu gli dici di sì con un cenno.
          pe: { ingannare: 5 }
          segue: velo-chi-avvertire
        fallimento:
          titolo: Il tè freddo
          testo: |
            Rispondi una frase di troppo, e Valdrano posa la tazza. Sorride
            con gentilezza, ti ringrazia della visita e torna ai suoi
            registri. Il tè ti resta in mano, freddo. Quello che aspetta lo
            metti insieme da solo, nei giorni dopo, dai registri dei turni e
            dalle sue visite al campanile.
          effetti: { velo.allarme: 1 }
          segue: velo-chi-avvertire

      - testo: "Reggere la parte"
        descrizione: "Lui crede che ti mandi qualcuno, ma qualcuno lo ha già messo in guardia. Bisogna essere molto bravi."
        quando: [velo.allarme >= 1]
        prova: { attributo: sociale, abilita: ingannare, difficolta: Molto difficile }
        successo:
          titolo: L'istruzione
          testo: |
            Bevi il tè e non rispondi, e lasci che sia lui a riempire il
            silenzio. Ci mette molto, e tu non ti muovi. Alla fine parla della
            compieta grande, di chi siederà sull'ultima panca, di una crepa
            nel cristallo che lui conosce meglio dei sacerdoti che ci pregano
            davanti. Poi ti chiede se l'istruzione è quella, e tu gli dici di
            sì con un cenno.
          pe: { ingannare: 5 }
          segue: velo-chi-avvertire
        fallimento:
          titolo: Il tè freddo
          testo: |
            Valdrano ti lascia parlare, e quando hai finito posa la tazza. Ti
            ringrazia della visita con gentilezza e torna ai suoi registri.
            Quello che aspetta lo metti insieme da solo, nei giorni dopo, dai
            registri dei turni e dalle sue visite al campanile.
          effetti: { velo.allarme: 1 }
          segue: velo-chi-avvertire

      - testo: "Dirgli chi sei"
        descrizione: "Sei il laico che ha trovato la cassetta. Che lo sappia, e che sappia che lo sai."
        esito:
          titolo: La calma
          testo: |
            Gli racconti tutta la storia della cassetta di latta sotto l'Orlo,
            e lui ti ascolta bevendo. Quando hai finito nega con calma, senza
            alzare la voce, e ti ricorda che un righello lo può comprare
            chiunque. Poi ti versa altro tè. Quello che aspetta lo metti
            insieme da solo, nei giorni dopo, dai registri dei turni e dalle
            sue visite al campanile, in fretta, perché adesso sa.
          pe: { empatia: 5 }
          effetti: { velo.allarme: 1 }
          segue: velo-chi-avvertire

      - testo: "Farlo seguire dai passeri di Giulia"
        descrizione: "Sorella Giulia parla con i passeri, e i passeri vanno dappertutto. Ci vogliono giorni, e una buona mano con le bestie."
        costo: 2
        prova: { attributo: mentale, abilita: [natura, addestrare-animali], difficolta: Media }
        successo:
          titolo: I passeri
          testo: |
            Bevi il tè parlando del tempo, poi te ne vai. Per tre giorni
            Giulia libera un passero ogni volta che Valdrano esce dai tavoli,
            e la sera te li fa contare sulla mano. Al campanile ci va due
            volte, di notte. In navata si ferma ogni sera davanti all'altare
            nello stesso punto, e tocca la pietra del cristallo con il
            righello di metallo.
          pe: { natura: 5 }
          segue: velo-chi-avvertire
        fallimento:
          titolo: Il passero sulla tazza
          testo: |
            Il secondo giorno un passero si posa sulla teiera di Valdrano,
            davanti a tutti i cronisti, e lui lo guarda a lungo. Poi alza gli
            occhi e cerca Giulia fra le colonne. Quello che aspetta lo metti
            insieme lo stesso, ma lui ormai sa che lo stai guardando.
          effetti: { velo.allarme: 1 }
          segue: velo-chi-avvertire

  - id: velo-chi-avvertire
    presso: cattedrale-del-velo
    immagine: ambientazione/cattedrale-del-velo
    titolo: Chi avvertire
    tipo: seguito
    luogo: Cattedrale del Velo, i giorni prima della compieta grande
    area: quartieri-alti
    requisiti: [fazione.velo == 12]
    testo: |
      Il piano, messo insieme pezzo per pezzo, è questo. Aurenne è l'ultima
      testimone viva del fuoco del Santuario, e alla compieta grande sarà
      sull'ultima panca, come sempre. Alla compieta grande la navata è piena,
      ci sono i consiglieri sulla prima panca e Vantes al pulpito. In quel
      momento Valdrano vuole aprire per pochi secondi la crepa che
      c'è dentro il cristallo rosso, quella che conosce da quarant'anni di
      misure, perché la città senta che cosa risponde quando il Velo prega.

      {magia Difficile} Il cristallo batte come un cuore perché qualcosa,
      dall'altra parte, lo tiene in ritmo. Se la crepa si apre, quello che sta
      dall'altra parte sente la navata, e la navata sente lui.

      La compieta grande è fra tre giorni. Fratello Lauro Bessi è al
      campanile, e suona le ore. Sorella Celia accorda il liuto sulla panca
      laterale. Aurenne prega sull'ultima panca, lontana dagli altri, con
      l'artiglio nascosto nella manica. Ottilia tiene le chiavi delle porte.

      {politica-ed-economia Media} Ogni persona che avverti è una persona in
      più che può sbagliare, o parlare. Ognuna è anche una mano in più, la
      sera della compieta.
    opzioni:
      - testo: "Avvertire Fratello Lauro Bessi"
        descrizione: "Dal campanile si vede l'altare, e le campane suonano più forte di qualunque salmo."
        quando: [velo.campanile == 0]
        costo: 0
        esito:
          titolo: Le campane a martello
          testo: |
            Bessi ti ascolta sotto la campana grande, con il pane sulle
            ginocchia. Quando capisci che ha capito, ti dice che le campane a
            martello si suonano per il fuoco, e che lui quella notte non le
            suonò. «Stavolta le suono» dice, e si stringe le mani fra le
            ginocchia per non farle tremare.
          imposta: { velo.campanile: 1 }
          segue: velo-chi-avvertire

      - testo: "Avvertire Sorella Celia"
        descrizione: "Il liuto di Celia regge la navata. Se la navata canta, è più difficile sentire altro."
        quando: [velo.liuto == 0]
        costo: 0
        esito:
          titolo: Il nastro al polso
          testo: |
            Celia ti ascolta accordando il liuto, e a metà smette. Ti chiede
            soltanto quale salmo, e quando glielo dici sceglie già la
            tonalità. Prima che te ne vada si stringe al polso il nastro che
            Ottilia le fa sempre togliere. «La compieta grande la suono con
            questo» dice.
          imposta: { velo.liuto: 1 }
          segue: velo-chi-avvertire

      - testo: "Avvertire Aurenne"
        descrizione: "È lei che Valdrano vuole sull'ultima panca. È lei che ha più diritto di saperlo."
        quando: [velo.artiglio == 0]
        immagine: personaggi/aurenne
        costo: 0
        esito:
          titolo: L'artiglio
          testo: |
            Aurenne ti ascolta senza voltarsi dall'altare. Quando hai finito
            tira fuori l'artiglio dalla manica e lo guarda a lungo, come se
            fosse di un'altra. Ti dice che ha fatto voto di non combattere
            più, e che i voti si possono rompere una volta sola, poi rimette
            l'artiglio nella manica con un gesto lento.
          imposta: { velo.artiglio: 1 }
          segue: velo-chi-avvertire

      - testo: "Avvertire Ottilia"
        descrizione: "Ottilia tiene le chiavi di tutte le porte della Cattedrale, e sa contare chi esce."
        quando: [velo.porte == 0]
        immagine: personaggi/ottilia-sanvel
        costo: 0
        esito:
          titolo: Le chiavi
          testo: |
            Ottilia ti ascolta con le mani nelle maniche, e quando nomini
            Valdrano le si muove un muscolo della mascella. Ti dice che la
            sera della compieta grande starà sulla porta del chiostro con le
            chiavi, come quella notte. «Stavolta conto anche chi entra» dice.
          imposta: { velo.porte: 1 }
          segue: velo-chi-avvertire

      - testo: "Aspettare la compieta grande"
        descrizione: "Hai avvertito chi volevi. Il resto lo deciderà la sera."
        esito:
          titolo: Tre giorni
          testo: |
            Passi i tre giorni come al solito, con il velo grigio sulle spalle
            e il disco in tasca. Ai tavoli dei cronisti Valdrano ti versa il
            tè ogni mattina, e ogni mattina lo bevi. La sera della compieta
            grande le campane suonano l'ultima ora, e la navata si riempie.
          pe: { resilienza: 5 }
          effetti: { fazione.velo: 1, rep.velo: 0.5 }

  # ------------------------------------------------------------ passo 14 · la compieta grande
  - id: velo-la-compieta-grande
    presso: cattedrale-del-velo
    immagine: ambientazione/cattedrale-del-velo
    titolo: La compieta grande
    sommario: "La navata è piena di candele e di gente, Vantes è al pulpito e Aurenne sull'ultima panca. Valdrano è sul gradino più basso dell'altare."
    luogo: Cattedrale del Velo, la navata, alla compieta grande
    area: quartieri-alti
    requisiti: [fazione.velo == 13, pista.capomozzo >= 9]
    testo: |
      Alla compieta grande la navata è piena fino alle porte. Sulla prima
      panca siedono i consiglieri con le mogli, e dietro di loro i fedeli dei
      Quartieri Alti, e in fondo, in piedi, quelli della Città Bassa che sono
      saliti per sentire Celia. Ogni panca ha la sua candela. Padre Vantes è
      al pulpito con il libro aperto, e Sorella Celia accorda il liuto sulla
      panca laterale. Sull'ultima panca, sola, c'è Aurenne con le mani nelle
      maniche.

      Padre Valdrano è sul gradino più basso dell'altare, dove i cronisti
      stanno durante le funzioni per prendere nota. Ha il righello di metallo
      scuro in mano, dritto davanti a sé come un'asta, e la punta appoggiata
      alla pietra del cristallo.

      {armi-da-mischia Media} Il righello è lungo come un braccio, e lui lo
      tiene come una leva. Una leva si strappa di mano tirando di lato, dalla
      parte del pollice.

      {percezione Media} La punta del righello è nel punto esatto dove Giulia
      ha visto fermarsi i passeri, e il punto dove si appoggiava ogni sera. Lì
      la pietra ha una linea più scura, sottile come un capello.

      {resilienza Media fallita} Il cuore ti batte al ritmo del cristallo, e
      non riesci a farlo smettere. È come avere due cuori, e uno non è il tuo.

      Vantes comincia il salmo. La navata risponde.
    opzioni:
      - testo: "Avvicinarti all'altare"
        descrizione: "Il gradino più basso, a tre passi da Valdrano. Da lì si vede la punta del righello."
        costo: 0
        esito:
          titolo: Tre passi
          testo: |
            Scivoli lungo la navata laterale con il velo grigio sulle spalle,
            e la gente si scansa come si fa con i velati. Ti fermi a tre passi
            dal gradino. Valdrano ti vede, e non smette di guardare il
            cristallo.
          segue: velo-il-cristallo-batte

      - testo: "Restare vicino ad Aurenne"
        descrizione: "È lei che Valdrano vuole sull'ultima panca. Se stasera la crepa si apre, lei è la prima a sentirla."
        costo: 0
        esito:
          titolo: L'ultima panca
          testo: |
            Ti siedi sull'ultima panca accanto ad Aurenne. Lei non ti guarda,
            e la mano dell'artiglio, nella manica, si chiude a pugno. Da qui
            l'altare è lontano, e Valdrano è una figura grigia sul gradino più
            basso.
          segue: velo-il-cristallo-batte

  - id: velo-il-cristallo-batte
    presso: cattedrale-del-velo
    immagine: personaggi/madre-del-velo
    titolo: Il cristallo batte fuori tempo
    tipo: seguito
    luogo: Cattedrale del Velo, l'altare, alla compieta grande
    area: quartieri-alti
    requisiti: [fazione.velo == 13]
    testo: |
      A metà del salmo il cristallo batte fuori tempo. La navata se ne accorge
      tutta insieme, e il salmo si inceppa a metà di una parola. Il cristallo
      batte ancora sempre più svelto, e la sua luce rossa si fa grigia, del
      grigio della corda al cristallo quando arriva in fondo alla sacca. Dalla
      pietra esce una voce che risponde al salmo con le parole giuste e un
      attimo di ritardo, e la navata la sente.

      {magia Media} La crepa si sta aprendo. Il righello di Valdrano è dentro
      la pietra fino a metà, e quello che risponde sta passando dalla crepa
      come l'acqua da una diga.

      Valdrano ha gli occhi chiusi e le labbra che si muovono. Sul gradino,
      accanto a lui, la luce grigia prende la forma di un sacerdote. In navata
      qualcuno grida, e le candele delle prime panche si spengono una dopo
      l'altra, verso il fondo.

      {intimidire Media} Valdrano con le mani è un vecchio come tanti. È la
      cosa sul gradino che bisogna temere, e il righello che la tiene aperta.

      Il disco in tasca ti scotta come un tizzone.
    opzioni:
      - testo: "Affrontare Valdrano e l'Eco"
        descrizione: "Il righello nella pietra, il sacerdote di luce grigia, e una navata piena di gente. Bisogna toglierglielo di mano."
        quando: [velo.allarme < 2]
        combattimento: velo-la-compieta
        vittoria:
          titolo: Il righello
          testo: |
            L'Eco si sfilaccia all'ultimo colpo, e Valdrano cade in ginocchio
            sul gradino con le mani sul righello. Glielo strappi dalla pietra,
            e il cristallo batte una volta sola, fortissimo, prima di tornare
            rosso. Le guardie del Velo prendono Valdrano per le braccia. Lui
            non oppone resistenza, e mentre lo portano via guarda il cristallo
            come si guarda una porta chiusa in faccia.
          pe: { armi-da-mischia: 10 }
          imposta: { velo.valdrano: 1 }
          effetti: { fazione.velo: 1, rep.velo: 1, reperto.sigillato: 1 }
        sconfitta:
          titolo: La porta del chiostro
          testo: |
            Ti ritrovi a terra sul gradino, con la voce del cristallo nelle
            orecchie e il sangue in bocca. Quando riesci ad alzare la testa la
            luce è tornata rossa, e il gradino è vuoto. Valdrano è uscito
            dalla porta della sagrestia con il righello, mentre la navata
            scappava dall'altra parte, e nessuno ha pensato di fermarlo.
          imposta: { velo.valdrano: 3 }
          effetti: { fazione.velo: 1, rep.velo: 1, tormento: 2 }

      - testo: "Affrontare Valdrano e le Eco"
        descrizione: "Valdrano era pronto, e il cristallo ha aperto la crepa più in fretta. Sul gradino i sacerdoti di luce grigia sono due."
        quando: [velo.allarme >= 2]
        combattimento: velo-la-compieta-in-allarme
        vittoria:
          titolo: Il righello
          testo: |
            L'ultima Eco si sfilaccia, e Valdrano cade in ginocchio sul
            gradino con le mani sul righello. Glielo strappi dalla pietra, e
            il cristallo batte una volta sola, fortissimo, prima di tornare
            rosso. Le guardie del Velo prendono Valdrano per le braccia, e lui
            si lascia portare via guardando il cristallo.
          pe: { armi-da-mischia: 10 }
          imposta: { velo.valdrano: 1 }
          effetti: { fazione.velo: 1, rep.velo: 1, reperto.sigillato: 1 }
        sconfitta:
          titolo: La porta del chiostro
          testo: |
            Ti ritrovi a terra sul gradino, con la voce del cristallo nelle
            orecchie e il sangue in bocca. Quando riesci ad alzare la testa la
            luce è tornata rossa, e il gradino è vuoto. Valdrano è uscito
            dalla porta della sagrestia con il righello, mentre la navata
            scappava dall'altra parte.
          imposta: { velo.valdrano: 3 }
          effetti: { fazione.velo: 1, rep.velo: 1, tormento: 2 }

      - testo: "Tenere il tempo con le campane di Bessi"
        descrizione: "Bessi suona a martello dal campanile. Se qualcuno tiene il tempo del Battito accanto all'altare, il cristallo torna al suo ritmo."
        quando: [velo.campanile >= 1]
        prova: { attributo: mentale, abilita: resilienza, difficolta: Difficile }
        successo:
          titolo: A martello
          testo: |
            Dal campanile le campane attaccano a martello tutte insieme, e tu
            ti inginocchi accanto al gradino con due dita sul polso a dire la
            Preghiera del Battito ad alta voce, contro la voce del cristallo.
            Il cristallo esita e sbaglia un colpo, poi torna al ritmo delle
            campane. L'Eco si spegne. Valdrano apre gli occhi, e le guardie
            del Velo lo prendono per le braccia prima che li richiuda.
          pe: { resilienza: 10 }
          imposta: { velo.valdrano: 1 }
          effetti: { fazione.velo: 1, rep.velo: 1, reperto.sigillato: 1 }
        fallimento:
          titolo: Il ritmo sbagliato
          testo: |
            Le campane suonano a martello, e tu perdi il tempo al terzo colpo.
            Il cristallo ti trascina nel suo ritmo, e per un momento la
            preghiera la dici con la voce che esce dalla pietra. Quando torni
            in te il cristallo è rosso e Valdrano non c'è più. È uscito dalla
            sagrestia con il righello, e nessuno l'ha visto.
          imposta: { velo.valdrano: 3 }
          effetti: { fazione.velo: 1, rep.velo: 1, tormento: 2, ferite: 1 }

      - testo: "Reggere la navata con il liuto di Celia"
        descrizione: "Celia attacca il salmo dall'inizio. Se la navata canta con lei, la voce del cristallo resta sola."
        quando: [velo.liuto >= 1]
        prova: { attributo: sociale, abilita: espressivita, difficolta: Difficile }
        successo:
          titolo: Il salmo da capo
          testo: |
            Celia attacca il salmo da capo a voce piena, e tu ti alzi in piedi
            in mezzo alla navata a cantare con lei. Dopo tre note canta la
            prima panca, panca dopo panca il salmo arriva in fondo, e alla
            fine canta anche la Città Bassa. La voce del cristallo resta sola,
            un attimo in ritardo su tutti, e si spegne. Le guardie del Velo
            prendono Valdrano sul gradino con il righello ancora in mano.
          pe: { espressivita: 10 }
          imposta: { velo.valdrano: 1 }
          effetti: { fazione.velo: 1, rep.velo: 1, reperto.sigillato: 1 }
        fallimento:
          titolo: La voce sola
          testo: |
            Celia attacca il salmo, e tu le vai dietro, ma la navata ha paura
            e non canta. La tua voce resta sola con la sua, e quella del
            cristallo le copre tutte e due. Quando finisce la luce è rossa e
            il gradino è vuoto, perché Valdrano è uscito dalla sagrestia
            mentre tutti guardavano l'altare.
          imposta: { velo.valdrano: 3 }
          effetti: { fazione.velo: 1, rep.velo: 1, tormento: 2, ferite: 1 }

      - testo: "Lasciare che Aurenne rompa il voto"
        descrizione: "Aurenne si è alzata dall'ultima panca, con l'artiglio fuori dalla manica. Bisognerà fermarla in tempo."
        quando: [velo.artiglio >= 1]
        prova: { attributo: sociale, abilita: empatia, difficolta: Difficile }
        successo:
          titolo: La mano buona
          testo: |
            Aurenne attraversa la navata e posa l'artiglio sul cristallo,
            sulla linea scura. La pietra si chiude con un rumore di vetro, e
            il righello si spezza dentro di lei. Valdrano cade dal gradino e
            non si rialza. Prima che Aurenne prema ancora, le prendi la mano
            buona e la chiami per nome, e lei toglie l'artiglio dalla pietra e
            ti guarda come se si svegliasse in quel momento.
          pe: { empatia: 10 }
          imposta: { velo.valdrano: 2 }
          effetti: { fazione.velo: 1, rep.velo: 1, reperto.sigillato: 1 }
        fallimento:
          titolo: L'artiglio sulla pietra
          testo: |
            Aurenne posa l'artiglio sul cristallo, e quando provi a fermarla
            il cristallo ti risponde con la sua voce e ti butta indietro fino
            alle panche. La crepa si chiude, e il cristallo torna rosso. Sul
            gradino non c'è nessuno. Valdrano è uscito dalla sagrestia mentre
            tutti guardavano Aurenne, che resta in ginocchio davanti
            all'altare con la mano dell'artiglio che sanguina.
          imposta: { velo.valdrano: 3 }
          effetti: { fazione.velo: 1, rep.velo: 1, tormento: 2, ferite: 1 }

      - testo: "Prenderlo vivo con Ottilia"
        descrizione: "Ottilia ha chiuso le porte del chiostro e della sagrestia, ed è in fondo alla navata con un bastone. Bisogna arrivare al gradino prima della cosa grigia."
        quando: [velo.porte >= 1]
        prova: { attributo: fisico, abilita: [rissa, armi-da-mischia], difficolta: Difficile }
        successo:
          titolo: La porta chiusa
          testo: |
            Corri al gradino mentre Ottilia ti viene dietro con il bastone, e
            prendi Valdrano per il polso prima che l'Eco ti sbarri la strada.
            Il righello esce dalla pietra con un rumore di dente strappato, e
            il cristallo torna rosso. Valdrano si gira verso la sagrestia, e
            trova la porta chiusa a chiave. Ottilia lo guarda dal fondo della
            navata, e conta.
          pe: { rissa: 10 }
          imposta: { velo.valdrano: 1 }
          effetti: { fazione.velo: 1, rep.velo: 1, reperto.sigillato: 1 }
        fallimento:
          titolo: La finestra del chiostro
          testo: |
            L'Eco ti sbarra la strada, e quando ti rialzi il gradino è vuoto.
            Valdrano ha trovato chiusa la porta della sagrestia, e allora è
            uscito dalla finestra del chiostro, a settant'anni, con il
            righello sotto il braccio. Ottilia è ancora sulla porta, con le
            chiavi in mano.
          imposta: { velo.valdrano: 3 }
          effetti: { fazione.velo: 1, rep.velo: 1, tormento: 2, ferite: 1 }

      - testo: "Scacciare l'Eco con l'Esorcismo"
        incantesimo: esorcismo
        descrizione: "Il rito delle cripte, a voce alta, davanti a tutta la navata. Senza la cosa grigia, Valdrano è un vecchio con un righello."
        prova: { attributo: mentale, abilita: magia, difficolta: Difficile }
        successo:
          titolo: Il rito davanti a tutti
          testo: |
            Reciti il rito a voce alta, e la navata si zittisce per
            ascoltarti. L'Eco si piega, poi si sfilaccia come fumo verso la
            crepa, e la crepa si chiude dietro di lei. Valdrano apre gli occhi
            su un cristallo rosso, e sulle guardie del Velo che salgono il
            gradino.
          pe: { magia: 10 }
          imposta: { velo.valdrano: 1 }
          effetti: { fazione.velo: 1, rep.velo: 1, reperto.sigillato: 1 }
        fallimento:
          titolo: La voce rotta
          testo: |
            A metà del rito la voce del cristallo copre la tua, e l'Eco ti
            risponde con le tue stesse parole. Ti ritrovi in ginocchio con le
            mani sulle orecchie. Quando la crepa si chiude il gradino è vuoto,
            e Valdrano è uscito dalla sagrestia.
          imposta: { velo.valdrano: 3 }
          effetti: { fazione.velo: 1, rep.velo: 1, tormento: 2, ferite: 1 }

  # ------------------------------------------------------------ passo 15 · la bocca cucita (grado 5)
  - id: velo-la-bocca-cucita
    presso: cattedrale-del-velo
    immagine: personaggi/madre-del-velo
    titolo: La bocca cucita
    sommario: "La mattina dopo la compieta la Madre ti manda a chiamare. Nel reliquiario dei Tre Portatori ci sono due lame, e una domanda."
    luogo: Cattedrale del Velo, la Cripta, il reliquiario dei Tre Portatori
    area: quartieri-alti
    requisiti: [fazione.velo == 14, pista.capomozzo >= 9]
    testo: |
      La mattina dopo la compieta un velato ti aspetta sulla porta della
      cella, e ti accompagna giù per la scala fino a una parte della Cripta
      dove non sei mai sceso. È una sala piccola e bassa, il reliquiario dei
      Tre Portatori, con tre nicchie scavate nella pietra. In quella di mezzo,
      su un panno di velluto grigio, ci sono due lame dritte di acciaio scuro
      senza ornamenti, e sopra la nicchia c'è un ritratto vecchio. È un uomo
      con gli occhi color rame e la bocca cucita con fili d'oro.

      {accademiche Media} Kael Dareth. Le sue due lame le consegnò al Velo nel
      134, quando rifiutò un posto nelle cerimonie, e i paladini lo invocano
      prima di tacere quello che hanno visto.

      La Madre è in piedi davanti al ritratto, avvolta nei veli. Che tu abbia
      accettato di aspettare oppure no, ti ha mandato a chiamare.

      «La città ha sentito una voce nel cristallo» dice. «Adesso vorrà sapere
      di chi era. Si può dirle della riga strappata, dei sei sacerdoti
      chiamati fuori e del fuoco lasciato accendere. Si può dirle che un
      vecchio cronista ha avuto un malore durante la compieta.» I veli non si
      muovono. «Lo decidi tu. Le lame sono due, e ne resta una sola qui.»

      {origine accolito-del-velo} Il ritratto con la bocca cucita lo guardavi
      di sbieco da novizio, quando ti mandavano a spolverare le cornici. Ti
      faceva paura, e adesso ti guarda come se aspettasse una risposta anche
      lui.

      *La verità, o il Velo.* Ti accorgi che le mani ti si sono giunte da
      sole, come in preghiera.
    opzioni:
      - testo: "Dirlo alla città"
        descrizione: "La riga strappata, la fuga dei sei e il fuoco lasciato accendere, detti in Consiglio davanti a Vantes e a Julia Castaldi. Il Velo ne uscirà ferito."
        esito:
          titolo: La strada per il Municipio
          testo: |
            La Madre resta immobile per un tempo lungo. Poi ti dice che chi
            parla una volta sa quanto costa, e che il costo lo paga anche lei.
            Il velato prende una delle due lame dalla nicchia e te la porge
            con il fodero. Vantes ti aspetta in navata con il mantello buono.
          segue: velo-davanti-al-consiglio

      - testo: "Tacerlo"
        descrizione: "Un vecchio cronista ha avuto un malore. Il Velo resta in piedi, e la verità scende nelle celle."
        esito:
          titolo: La scala delle celle
          testo: |
            La Madre china appena la testa, un movimento che non le avevi mai
            visto fare. Il velato prende una delle due lame dalla nicchia e te
            la porge con il fodero. Poi ti indica la scala delle celle, nelle
            cantine del vecchio Santuario.
          segue: velo-la-scala-delle-celle

      - testo: "Lasciarlo correre fra i suoi"
        descrizione: "Valdrano è nelle celle, e chi lo aspetta non sa ancora niente. Una lettera scritta bene può rimandarlo indietro, e dire a loro quello che vuole il Velo."
        quando: [velo.valdrano == 1, velo.attesa == 1]
        esito:
          titolo: La lettera
          testo: |
            I veli si muovono, per la prima volta da quando la conosci. La
            Madre dice soltanto una parola, *bene*, e il velato prende una
            delle due lame dalla nicchia e te la porge con il fodero. Poi ti
            porta alle celle, dove Valdrano è seduto sulla branda con le mani
            in grembo.
          segue: velo-la-lettera-falsa

  - id: velo-davanti-al-consiglio
    presso: municipio
    immagine: ambientazione/quartieri-alti
    titolo: Davanti al Consiglio
    tipo: seguito
    luogo: Il Municipio, la sala del Consiglio
    area: quartieri-alti
    requisiti: [fazione.velo == 14]
    testo: |
      La sala del Consiglio è piena come la navata della compieta, e l'aria è
      la stessa, di gente che ha paura e vuole sapere di chi è la colpa. Padre
      Vantes siede al suo posto, con il mantello buono e la faccia di chi non
      ha dormito, e Julia Castaldi ha le pratiche già lette davanti a sé, in
      una pila ordinata. Quando ti alzi a parlare la lama di Kael Dareth, al
      fianco, tintinna contro la panca.

      {politica-ed-economia Media} Metà della sala vuole sentire che il Velo è
      marcio, l'altra metà che è innocente. Nessuno vuole la storia intera,
      che è più lunga e non fa comodo a nessuno.

      {galateo Facile} Julia Castaldi ti guarda come si guarda un testimone,
      con la penna già intinta. È la sola nella sala che sia venuta per
      ascoltare.

      Nella bisaccia hai quello che resta delle lettere con i due dischi. Hai
      anche il foglio del registro con la riga strappata che Ottilia ti ha
      dato stamattina senza dire niente.
    opzioni:
      - testo: "Raccontare tutto, dall'inizio"
        descrizione: "Dalla riga strappata fino al fuoco del Santuario. Ci vuole una voce che regga per un'ora."
        quando: [pista.acciaio < 8]
        prova: { attributo: sociale, abilita: [persuasione, politica-ed-economia], difficolta: Difficile }
        successo:
          titolo: Custode del Silenzio
          testo: |
            Racconti per un'ora, e la sala ti ascolta fino in fondo. Quando
            arrivi al fuoco lasciato accendere nessuno si muove più sulle panche. Julia Castaldi
            chiede una copia di tutto. Vantes resta seduto con la schiena
            dritta anche se è umiliato, e quando esci ti posa due dita sul
            polso, senza parlare. La sera ti porta in sagrestia il simbolo
            dell'Albero in platino, quello con il ramo annerito, e una borsa
            di monete del Velo. La Madre non ti riceverà più. In città, da
            domani, Silvano Ardice torna a predicare, e la gente lo ascolta.
          pe: { persuasione: 10 }
          imposta: { velo.finale: 1 }
          effetti: { fazione.velo: 1, oggetto.velo-lama-di-kael: 1, oggetto.velo-simbolo-in-platino: 1, monete: 350, rep.castaldi: 1, rep.caserma: 0.5 }
          almeno: { rep.velo: 10 }
        fallimento:
          titolo: Le risate
          testo: |
            A metà racconto qualcuno ride, e la sala si divide in due. Tu
            arrivi in fondo lo stesso, ma la verità che esce dal Municipio è a
            pezzi, ognuno buono per una fazione diversa. Julia Castaldi chiede
            una copia di tutto. La sera Vantes ti porta in sagrestia il
            simbolo dell'Albero in platino e una borsa di monete del Velo, e
            ti dice che la verità detta male resta verità. La Madre non ti
            riceverà più.
          imposta: { velo.finale: 1 }
          effetti: { fazione.velo: 1, oggetto.velo-lama-di-kael: 1, oggetto.velo-simbolo-in-platino: 1, monete: 350, rep.castaldi: 1, rep.caserma: 0.5, scandalo: 1 }
          almeno: { rep.velo: 10 }

      - testo: "Raccontare tutto, dall'inizio"
        descrizione: "Dopo l'Acciaieria la parola di Vantes pesa in Consiglio. Con lui al tuo fianco, la sala ascolta."
        quando: [pista.acciaio >= 8]
        prova: { attributo: sociale, abilita: [persuasione, politica-ed-economia], difficolta: Media }
        successo:
          titolo: Custode del Silenzio
          testo: |
            Vantes si alza per primo, e dice alla sala che quello che sentirà
            lo ha confermato lui. Poi ti lascia parlare. Racconti per un'ora,
            e quando arrivi al fuoco lasciato accendere le panche smettono di scricchiolare. Julia
            Castaldi chiede una copia di tutto. La sera Vantes ti porta in
            sagrestia il simbolo dell'Albero in platino, quello con il ramo
            annerito, e una borsa di monete del Velo. La Madre non ti riceverà
            più.
          pe: { persuasione: 10 }
          imposta: { velo.finale: 1 }
          effetti: { fazione.velo: 1, oggetto.velo-lama-di-kael: 1, oggetto.velo-simbolo-in-platino: 1, monete: 350, rep.castaldi: 1, rep.caserma: 0.5 }
          almeno: { rep.velo: 10 }
        fallimento:
          titolo: Le risate
          testo: |
            A metà racconto qualcuno ride, e nemmeno Vantes riesce a fermare
            la sala. Arrivi in fondo lo stesso. Julia Castaldi chiede una
            copia di tutto. La sera Vantes ti porta in sagrestia il simbolo
            dell'Albero in platino e una borsa di monete del Velo, e ti dice
            che la verità detta male resta verità. La Madre non ti riceverà
            più.
          imposta: { velo.finale: 1 }
          effetti: { fazione.velo: 1, oggetto.velo-lama-di-kael: 1, oggetto.velo-simbolo-in-platino: 1, monete: 350, rep.castaldi: 1, rep.caserma: 0.5, scandalo: 1 }
          almeno: { rep.velo: 10 }

      - testo: "Mettere le carte sul tavolo di Julia Castaldi"
        descrizione: "Le lettere e il foglio del registro parlano da soli, e Julia Castaldi sa leggere."
        esito:
          titolo: La pila di Julia
          testo: |
            Posi tutto sul tavolo di Julia Castaldi senza dire una parola, e
            lei legge per un'ora mentre la sala aspetta e mormora. Alla fine
            alza gli occhi e dice alla sala che il Consiglio ne discuterà a
            porte chiuse. Più tardi, sulla porta, ti stringe la mano. La sera
            Vantes ti porta in sagrestia il simbolo dell'Albero in platino e
            una borsa di monete del Velo. La Madre non ti riceverà più.
