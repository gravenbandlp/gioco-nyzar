          almeno: { rep.velo: 10 }

  - id: velo-la-scala-delle-celle
    presso: cattedrale-del-velo
    immagine: personaggi/ottilia-sanvel
    titolo: La scala delle celle
    tipo: seguito
    luogo: Cattedrale del Velo, le celle nelle cantine del vecchio Santuario
    area: quartieri-alti
    requisiti: [fazione.velo == 14]
    testo: |
      Le celle stanno nelle cantine del vecchio Santuario, come gli archivi
      minori, e l'incendio le ha risparmiate allo stesso modo. Si scende per
      una scala stretta, con un corrimano di corda consumato dalle mani. In
      fondo c'è un corridoio con sei porte, e la prima è quella dove morì Mirn
      il Sordo. Ottilia Sanvel ti aspetta in cima alla scala con le chiavi, e
      il foglio del registro con la riga strappata ripiegato in quattro.

      {resilienza Media} Quaggiù l'aria ha lo stesso freddo fermo della
      galleria sotto l'Orlo. Ti chiedi se dipenda dalle cantine o da chi ci è
      stato chiuso.

      «La Madre dice che quello che si tace va custodito, perché il sapere si
      accumula e basta» dice Ottilia. «Saggezza è quello che decidi di non
      dimenticare.» Ti porge il foglio. «Questo va giù con il resto.»

      {empatia Media} Lo dice con la voce di tutte le mattine. Ma ha ripiegato
      il foglio quattro volte, con molta cura, come si piega una lettera che
      si vuole rileggere.
    opzioni:
      - testo: "Accompagnare Valdrano nelle celle"
        descrizione: "Valdrano scende con te, e non risale. Il resto lo dirà il registro del mattino."
        quando: [velo.valdrano == 1]
        esito:
          titolo: Custode del Silenzio
          testo: |
            Valdrano scende la scala davanti a te, piano, con il ginocchio che
            gli fa male. Davanti alla terza porta si ferma e ti chiede del tè.
            Glielo prometti. Ottilia chiude la porta a chiave, e la mattina
            dopo aggiunge un nome al suo elenco del mattino, quello che ripete
            prima del primo movimento. La sera la Madre ti fa sapere che puoi
            scendere nella Cripta quando vuoi, e Sorella Arva ti conta una
            borsa di monete con le mani che le tremano un poco.
          pe: { resilienza: 10 }
          imposta: { velo.finale: 2 }
          effetti: { fazione.velo: 1, oggetto.velo-lama-di-kael: 1, velo.udienza: 1, monete: 350, rep.velo: 1 }
          almeno: { rep.velo: 10 }

      - testo: "Portare giù le lettere e il foglio"
        descrizione: "Valdrano non verrà a sedersi su quella branda. Quello che resta di lui è carta, e la carta va custodita."
        quando: [velo.valdrano >= 2]
        esito:
          titolo: Custode del Silenzio
          testo: |
            Scendi con tutte le carte di Valdrano sotto il braccio, e le
            chiudi nella terza cella dentro una cassetta di latta nuova.
            Ottilia chiude la porta a chiave, e la mattina dopo aggiunge un
            nome al suo elenco del mattino. La sera la Madre ti fa sapere che
            puoi scendere nella Cripta quando vuoi, e Sorella Arva ti conta
            una borsa di monete con le mani che le tremano un poco.
          pe: { resilienza: 10 }
          imposta: { velo.finale: 2 }
          effetti: { fazione.velo: 1, oggetto.velo-lama-di-kael: 1, velo.udienza: 1, monete: 350, rep.velo: 1 }
          almeno: { rep.velo: 10 }

      - testo: "Tenere per te una copia della riga"
        descrizione: "La riga strappata va giù. Una copia in fondo al quaderno, fra due conti della spesa, non la cerca nessuno."
        prova: { attributo: fisico, abilita: furtivita, difficolta: Difficile }
        successo:
          titolo: Fra due conti della spesa
          testo: |
            Mentre Ottilia apre la porta della cella ricopi la riga strappata
            in fondo al quaderno, con l'ora, fra due conti della spesa. Lei
            non si volta. La mattina dopo aggiunge un nome al suo elenco del
            mattino. La sera la Madre ti fa sapere che puoi scendere nella
            Cripta quando vuoi, e Sorella Arva ti conta una borsa di monete.
          pe: { furtivita: 10 }
          imposta: { velo.finale: 2 }
          effetti: { fazione.velo: 1, oggetto.velo-lama-di-kael: 1, velo.udienza: 1, monete: 350, rep.velo: 1, informazioni.segreto: 1 }
          almeno: { rep.velo: 10 }
        fallimento:
          titolo: La mano tesa
          testo: |
            Ottilia si volta mentre scrivi, e ti tende la mano. Le dai il
            quaderno, e lei strappa la pagina con cura e la mette nella cella
            con il resto, senza una parola. La mattina dopo aggiunge un nome
            al suo elenco del mattino. La sera la Madre ti fa sapere che puoi
            scendere nella Cripta quando vuoi, e Sorella Arva ti conta una
            borsa di monete.
          imposta: { velo.finale: 2 }
          effetti: { fazione.velo: 1, oggetto.velo-lama-di-kael: 1, velo.udienza: 1, monete: 350, rep.velo: 1 }
          almeno: { rep.velo: 10 }

  - id: velo-la-lettera-falsa
    presso: cattedrale-del-velo
    immagine: icone/envelope
    titolo: La lettera falsa
    tipo: seguito
    luogo: Cattedrale del Velo, la terza cella
    area: quartieri-alti
    requisiti: [fazione.velo == 14]
    testo: |
      Nella terza cella c'è una branda con un tavolino, e sul tavolino
      qualcuno ha già preparato la carta dei cronisti con l'inchiostro
      semplice. Accanto c'è il righello di metallo scuro di Valdrano. Valdrano
      è seduto sulla branda e guarda il righello con le mani in grembo. Ha la
      faccia di un uomo che sa già come andrà, e la trova giusta.

      La lettera deve partire stanotte dalla cassetta sotto l'Orlo, con la
      grafia di Valdrano e le sue frasi, che cominciano dal soggetto e
      finiscono con un punto. Deve dire che la compieta è fallita per un
      malore, che il Velo non sa niente, e che il cronista maggiore torna al
      suo posto in attesa di istruzioni. Poi Valdrano tornerà ai tavoli
      lunghi, a versare il tè, e chi riceve le sue lettere riceverà quelle che
      vuole il Velo.

      {ingannare Media} Lui starà a guardare senza aiutarti né ostacolarti. Ha
      finito di scegliere molto tempo fa, e adesso aspetta come ha sempre
      aspettato.

      {accademiche Facile} Le lettere a S. le hai lette tutte. La grafia la
      conosci, le frasi pure. Il righello, sul tavolino, fa il resto.
    opzioni:
      - testo: "Scrivere la lettera con il suo righello"
        descrizione: "La sua carta, il suo inchiostro, le sue righe dritte. Bisogna imitare quarant'anni di grafia."
        prova: { attributo: mentale, abilita: [accademiche, percezione], difficolta: Media }
        successo:
          titolo: Custode del Silenzio
          testo: |
            Scrivi la lettera riga per riga, con il righello sotto la penna, e
            quando hai finito la mostri a Valdrano. La legge due volte. Poi
            annuisce una volta sola, e te la restituisce. Stanotte la cassetta
            sotto l'Orlo avrà la sua lettera, e domattina Valdrano tornerà ai
            tavoli lunghi. La Madre ti fa sapere che puoi scendere nella
            Cripta quando vuoi, e Sorella Arva ti conta una borsa di monete.
          pe: { accademiche: 10 }
          imposta: { velo.finale: 3 }
          effetti: { fazione.velo: 1, oggetto.velo-lama-di-kael: 1, velo.udienza: 1, monete: 350, rep.velo: 0.5, velo.crepuscolo: 1 }
          almeno: { rep.velo: 10 }
        fallimento:
          titolo: La riga storta
          testo: |
            La terza riga ti viene storta, e Valdrano te lo fa notare senza
            alzare gli occhi. La riscrivi cinque volte, finché lui non smette
            di guardarla. Stanotte la cassetta sotto l'Orlo avrà la sua
            lettera, e tu non sai se sia buona. La Madre ti fa sapere che puoi
            scendere nella Cripta quando vuoi, e Sorella Arva ti conta una
            borsa di monete.
          imposta: { velo.finale: 3 }
          effetti: { fazione.velo: 1, oggetto.velo-lama-di-kael: 1, velo.udienza: 1, monete: 350, rep.velo: 0.5, velo.crepuscolo: 1, tormento: 0.5 }
          almeno: { rep.velo: 10 }

      - testo: "Fargliela scrivere"
        descrizione: "La grafia migliore è la sua. Bisogna convincerlo che conviene anche a lui."
        prova: { attributo: sociale, abilita: [ingannare, persuasione], difficolta: Media }
        successo:
          titolo: Custode del Silenzio
          testo: |
            Gli dici che la sola strada per uscire dalla cella è la sua penna,
            e lui ci pensa a lungo. Poi prende il righello e scrive la lettera
            da solo, senza correggere una parola, e te la porge asciutta.
            Stanotte la cassetta sotto l'Orlo avrà la sua lettera. La Madre ti
            fa sapere che puoi scendere nella Cripta quando vuoi, e Sorella
            Arva ti conta una borsa di monete.
          pe: { ingannare: 10 }
          imposta: { velo.finale: 3 }
          effetti: { fazione.velo: 1, oggetto.velo-lama-di-kael: 1, velo.udienza: 1, monete: 350, rep.velo: 0.5, velo.crepuscolo: 1 }
          almeno: { rep.velo: 10 }
        fallimento:
          titolo: Il punto in più
          testo: |
            Valdrano scrive la lettera, e quando la rileggi ti accorgi che
            alla fine di una frase ci sono due punti invece di uno. Lui ti
            guarda e non dice niente. La correggi tu, e speri che basti. La
            Madre ti fa sapere che puoi scendere nella Cripta quando vuoi, e
            Sorella Arva ti conta una borsa di monete.
          imposta: { velo.finale: 3 }
          effetti: { fazione.velo: 1, oggetto.velo-lama-di-kael: 1, velo.udienza: 1, monete: 350, rep.velo: 0.5, velo.crepuscolo: 1, tormento: 0.5 }
          almeno: { rep.velo: 10 }

      - testo: "Copiare le sue frasi, una per una"
        descrizione: "Le quaranta lettere sono lì. Basta prendere una frase da ognuna e cucirle insieme, con pazienza."
        costo: 2
        esito:
          titolo: Custode del Silenzio
          testo: |
            Passi la notte nella cella a cucire la lettera con le frasi delle
            altre, una da ognuna, mentre Valdrano dorme sulla branda o finge
            di dormire. All'alba la lettera dice quello che deve dire con le
            sue parole. Stanotte la cassetta sotto l'Orlo la avrà. La Madre ti
            fa sapere che puoi scendere nella Cripta quando vuoi, e Sorella
            Arva ti conta una borsa di monete.
          pe: { accademiche: 10 }
          imposta: { velo.finale: 3 }
          effetti: { fazione.velo: 1, oggetto.velo-lama-di-kael: 1, velo.udienza: 1, monete: 350, rep.velo: 0.5, velo.crepuscolo: 1 }
          almeno: { rep.velo: 10 }
