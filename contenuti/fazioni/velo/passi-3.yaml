# La quest della Confraternita del Velo, passi 12-15.
# - Passo 12 (fazione.velo == 11, grado 4): sotto l'altare, con la Madre del Velo. Si apre con pista.capomozzo >= 8;
#   prima Vantes ti dice che la Madre non riceve. La Madre ascolta e non dice quello che sa: accettare l'attesa
#   (velo.attesa 1) o andare da Vantes e dalla Caserma (2). Il seguito in navata, con il disco che vibra al passaggio
#   di Valdrano, chiude il passo e dà il grado.
# - Passo 13 (== 12, da qui pista.capomozzo >= 9): il tè ai tavoli dei cronisti. Reggere la parte (Ingannare, più
#   difficile con velo.allarme), scoprirsi o farlo seguire dai passeri di Giulia. Il seguito dice il piano e lascia
#   avvertire chi vuoi: Bessi, Celia, Aurenne, Ottilia (velo.campanile, liuto, artiglio, porte). Ognuno è una via
#   nel passo 14.
# - Passo 14 (== 13): la compieta grande, la boss battle. Tutte le vie sono Difficili; fallire costa Tormento e
#   Ferite, e Valdrano fugge. velo.valdrano: 1 preso, 2 morto nella rottura, 3 fuggito.
# - Passo 15 (== 14, grado 5): la bocca cucita. La Madre chiede che cosa deve sapere la città: dirlo in Consiglio,
#   tacerlo nella Cripta, o (Valdrano preso e attesa accettata) rimandarlo fra i suoi con una lettera falsa. Ogni
#   ramo dà la lama di Kael Dareth e la borsa; il resto in velo.finale.
storylet:
  # ------------------------------------------------------------ passo 12 · la Madre non riceve
  - id: velo-la-madre-non-riceve
    presso: cattedrale-del-velo
    immagine: personaggi/padre-vantes
    titolo: La Madre non riceve
    sommario: "Le lettere e i dischi sono roba per la Madre, che adesso, dice Vantes, non riceve."
    luogo: Cattedrale del Velo, la scala della Cripta
    area: quartieri-alti
    requisiti: [fazione.velo == 11, pista.capomozzo < 8]
    testo: |
      Davanti alla scala della Cripta Padre Vantes, con gli occhi rossi di
      sonno, ascolta tutta la storia guardando il disco che tieni sul palmo.

      «La Madre non riceve, adesso» dice alla fine. «Quando riceverà, ti
      chiamerà lei.» Ti posa due dita sul polso. «Con quello che succede a
      Capomozzo, la Cripta ha altro da ascoltare.»

      {empatia Media} Vorrebbe scendere lui, con le tue lettere in mano, e sa
      di non poterlo fare.
    opzioni:
      - testo: "Aspettare che la Madre ti chiami"
        descrizione: "Vantes ha ragione, o almeno ha l'ordine di dirlo."
        costo: 0
        esito:
          titolo: La scala
          testo: |
            Rimetti il disco in tasca e risali in navata, e Vantes resta davanti
            alla scala con le mani giunte.

  # ------------------------------------------------------------ passo 12 · sotto l'altare (grado 4)
  - id: velo-sotto-l-altare
    presso: cattedrale-del-velo
    immagine: personaggi/madre-del-velo
    titolo: Sotto l'altare
    sommario: "La Madre del Velo ti riceve nella Cripta e ascolta tutta la storia della riga strappata senza muovere i veli."
    luogo: Cattedrale del Velo, la Cripta
    area: quartieri-alti
    requisiti: [fazione.velo == 11, pista.capomozzo >= 8]
    testo: |
      Le colonne della Cripta si perdono nel buio oltre il cerchio delle
      candele, e attraverso la volta senti il battito del cristallo rosso come
      il cuore di qualcuno contro cui sei appoggiato. La Madre siede sul
      seggio di pietra, avvolta in veli grigi e neri che non lasciano vedere
      nemmeno le mani.

      Le racconti tutto, dalla riga strappata alla cassetta di latta, fino
      alle due notti del 145, quella di Ardice con la Cicatrice che brillava e
      quella di Alenna con i libri asciutti. Posi i due dischi sul gradino del
      seggio, e i veli non si muovono.

      {empatia Difficile} Alla seconda cosa che le dici capisci che niente è
      nuovo per lei. Ti ascolta come si ascolta qualcuno che legge ad alta
      voce una lettera che hai scritto tu.

      «Chi scrive da dieci anni sa aspettare» dice la Madre, con una voce
      bassa che non sembra venire da un punto preciso. «Anche chi legge. Si
      attende ciò che si conosce.» Un velato ti si avvicina con un velo grigio
      ripiegato sulle braccia.

      {origine accolito-del-velo} Da novizio guardavi passare i velati grigi
      dal fondo della navata, chiedendoti che cosa vedessero sotto l'altare.
      Adesso il velo grigio lo porgono a te.

      *Dieci anni, e lei lo sapeva.*
    opzioni:
      - testo: "Accettare l'attesa"
        descrizione: "Il velo grigio, il disco in tasca e la pazienza, finché chi scrive sbaglia una mossa."
        esito:
          titolo: Il velo grigio
          testo: |
            Il velato ti posa sulle spalle il velo grigio, più leggero di come
            sembra. La Madre ti chiede di tenere il disco in tasca e di passare
            per la navata alle ore canoniche. Ti riprendi un disco dal gradino, e
            l'altro resta sulla pietra.
          imposta: { velo.attesa: 1 }
          segue: velo-la-navata-della-sera

      - testo: "Chiederle perché ha lasciato fare"
        descrizione: "Dieci anni di lettere sotto il suo altare, e una domanda che alla Madre non fa nessuno."
        prova: { attributo: sociale, abilita: empatia, difficolta: Difficile }
        successo:
          titolo: Un ordine che cade
          testo: |
            I veli restano fermi a lungo. Poi, con una voce quasi da donna stanca,
            la Madre ti dice di aver visto cadere un ordine perché tutti avevano
            fretta di sapere chi tradiva. «Il Velo dura perché sa aspettare.» Il
            velato ti posa sulle spalle il velo grigio.
          pe: { empatia: 10 }
          imposta: { velo.attesa: 1 }
          segue: velo-la-navata-della-sera
        fallimento:
          titolo: I veli fermi
          testo: |
            La Madre non risponde. Dopo un po' il velato ti posa sulle spalle il
            velo grigio, come se la domanda non fosse mai stata fatta, e risali
            con un disco in tasca e la nuca che scotta.
          imposta: { velo.attesa: 1 }
          segue: velo-la-navata-della-sera
          effetti: { scandalo: 0.5 }

      - testo: "Rifiutare e andare da Vantes e dalla Caserma"
        descrizione: "Aspettare vuol dire lasciarlo scrivere ancora, e la Caserma ha le celle."
        esito:
          titolo: Le spalle alla Madre
          testo: |
            Alla tua risposta i veli restano immobili, e il velato ti posa lo
            stesso il velo grigio sulle spalle. Vantes, sempre più pallido, ti
            accompagna alla Caserma, dove un ufficiale prende nota con una
            lentezza che sembra fatta apposta. Da quel giorno la Madre non ti
            manda più a chiamare.
          imposta: { velo.attesa: 2 }
          segue: velo-la-navata-della-sera

      - testo: "Lasciarti mettere il velo grigio in silenzio"
        descrizione: "Da novizio ti hanno insegnato che sotto l'altare non si fanno domande."
        quando: [origine.accolito-del-velo >= 1]
        esito:
          titolo: La lezione di allora
          testo: |
            Il velato ti posa sulle spalle il velo grigio, e la Madre ti chiede di
            tenere il disco in tasca e di passare per la navata alle ore
            canoniche. Risalendo ti accorgi di camminare al passo lento dei
            velati.
          imposta: { velo.attesa: 1 }
          segue: velo-la-navata-della-sera

  - id: velo-la-navata-della-sera
    presso: cattedrale-del-velo
    immagine: ambientazione/cattedrale-del-velo
    titolo: La navata della sera
    tipo: seguito
    luogo: Cattedrale del Velo, la navata, all'ora del vespro
    area: quartieri-alti
    requisiti: [fazione.velo == 11]
    testo: |
      La sera dopo attraversi la navata all'ora del vespro con il velo grigio
      sulle spalle, e la gente si scansa come si fa con i velati. Dai tavoli
      dei cronisti esce Padre Valdrano con la teiera di coccio, a passi
      corti, strascicando appena il piede destro.

      A dieci passi il disco in tasca comincia a vibrare, e lo senti nei
      denti. A cinque passi Valdrano si ferma.

      {ingannare Media} Non si è fermato per la teiera. La mano libera è
      andata alla tasca della tonaca, e ci è rimasta.

      {percezione Facile} Alla cintura il righello di bosso non c'è più. Al
      suo posto c'è un righello di metallo scuro.

      Valdrano ti guarda in faccia e ti offre il tè con un sorriso gentile.
    opzioni:
      - testo: "Accettare il tè"
        descrizione: "Il tè di Valdrano lo prendono tutti, e rifiutarlo sarebbe più strano."
        esito:
          titolo: Velato della Cripta
          testo: |
            Lui ti riempie la tazza con la mano ferma, e parlate del tempo. Quando
            se ne va il disco si calma piano, come un cane che smette di
            ringhiare. La sera Ottilia ti dà la chiave di una cella nel chiostro,
            dove i velati dormono quando vogliono.
          pe: { resilienza: 10 }
          effetti: { fazione.velo: 1, oggetto.velo-velo-grigio: 1 }
          almeno: { rep.velo: 8 }

      - testo: "Tenere la mano lontana dalla tasca"
        descrizione: "Lui ha messo la mano sulla tasca, e se lo fai anche tu lo sa."
        prova: { attributo: sociale, abilita: [ingannare, resilienza], difficolta: Media }
        successo:
          titolo: Le mani ferme
          testo: |
            Con le mani giunte davanti alla cintura come un velato vero, gli dici
            che il tè lo prendi dopo il vespro, e la mano gli esce dalla tasca. La
            sera Ottilia ti dà la chiave di una cella nel chiostro, dove i velati
            dormono quando vogliono.
          pe: { ingannare: 10 }
          effetti: { fazione.velo: 1, oggetto.velo-velo-grigio: 1 }
          almeno: { rep.velo: 8 }
        fallimento:
          titolo: La mano in tasca
          testo: |
            La mano ti va alla tasca da sola, e Valdrano la guarda e se ne va
            sorridendo. La sera Ottilia ti dà la chiave di una cella nel chiostro,
            e ci passi la notte a fissare il soffitto.
          effetti: { fazione.velo: 1, oggetto.velo-velo-grigio: 1, velo.allarme: 1, sospetto: 0.5 }
          almeno: { rep.velo: 8 }

      - testo: "Guardarlo negli occhi"
        descrizione: "Dieci anni di lettere, e adesso è a cinque passi."
        esito:
          titolo: Gli occhi del cronista
          testo: |
            Lui regge lo sguardo come un vecchio maestro con un allievo che ha
            qualcosa da dire, poi se ne va con la teiera. La sera Ottilia ti dà la
            chiave di una cella nel chiostro, dove i velati dormono quando
            vogliono.
          pe: { resilienza: 10 }
          effetti: { fazione.velo: 1, oggetto.velo-velo-grigio: 1 }
          almeno: { rep.velo: 8 }

  # ------------------------------------------------------------ passo 13 · il tè di Valdrano
  - id: velo-il-te-di-valdrano
    presso: cattedrale-del-velo
    immagine: icone/teapot
    titolo: Il tè di Valdrano
    sommario: "Anche il disco di Valdrano ha vibrato, e ai tavoli dei cronisti c'è una tazza girata per te."
    luogo: Cattedrale del Velo, i tavoli lunghi dei cronisti
    area: quartieri-alti
    requisiti: [fazione.velo == 12, pista.capomozzo >= 9]
    testo: |
      La mattina dopo, ai tavoli lunghi, c'è una tazza girata davanti al posto
      vuoto accanto a Valdrano. Lui ti versa il tè senza chiedere, con due
      dita posate sul righello di metallo scuro come su un libro di preghiere.

      «Non ci si incontra mai» dice piano, guardando il tè. «Se non quando chi
      sta sopra lo vuole. In dieci anni non è mai successo, e allora mi
      domando chi ti manda.» Ti guarda il velo grigio. «Oppure se ti manda
      qualcuno.»

      {ingannare Media} Non sa chi sei. Ha due risposte pronte, una per il
      superiore e una per il messaggero, e aspetta di capire quale usare.

      Il disco nella tua tasca vibra piano, e quello nella sua pure.

      {origine accolito-del-velo} Questo tè lo versava da novizio a chi aveva
      sbagliato meno le copie. Ha lo stesso sapore, e ti si ferma in gola.
    opzioni:
      - testo: "Reggere la parte"
        descrizione: "Se gli lasci credere che ti mandi qualcuno, forse ti dice che cosa aspetta."
        quando: [velo.allarme == 0]
        prova: { attributo: sociale, abilita: ingannare, difficolta: Difficile }
        successo:
          titolo: L'istruzione
          testo: |
            Bevi in silenzio, e lui lo riempie parlando della compieta grande, di
            chi siederà sull'ultima panca, di una crepa nel cristallo che conosce
            meglio dei sacerdoti che ci pregano davanti. Alla fine ti chiede se
            l'istruzione è quella, e tu annuisci.
          pe: { ingannare: 5 }
          segue: velo-chi-avvertire
        fallimento:
          titolo: Il tè freddo
          testo: |
            Rispondi una frase di troppo, e Valdrano posa la tazza e torna ai
            registri. Quello che aspetta lo metti insieme da solo, dai registri
            dei turni e dalle sue visite al campanile.
          effetti: { velo.allarme: 1, sospetto: 0.5 }
          segue: velo-chi-avvertire

      - testo: "Reggere la parte"
        descrizione: "Qualcuno lo ha già messo in guardia, e bisogna essere molto bravi."
        quando: [velo.allarme >= 1]
        prova: { attributo: sociale, abilita: ingannare, difficolta: Molto difficile }
        successo:
          titolo: L'istruzione
          testo: |
            Bevi in silenzio, e lui ci mette molto a parlare. Alla fine ti dice
            della compieta grande, di chi siederà sull'ultima panca, di una crepa
            nel cristallo che conosce meglio dei sacerdoti, e ti chiede se
            l'istruzione è quella. Annuisci senza alzare gli occhi dalla tazza.
          pe: { ingannare: 5 }
          segue: velo-chi-avvertire
        fallimento:
          titolo: Il tè freddo
          testo: |
            Quando hai finito di parlare Valdrano posa la tazza e torna ai
            registri. Quello che aspetta lo metti insieme da solo, dai registri
            dei turni e dalle sue visite al campanile.
          effetti: { velo.allarme: 1, sospetto: 0.5 }
          segue: velo-chi-avvertire

      - testo: "Dirgli chi sei"
        descrizione: "Sei il laico che ha trovato la cassetta, e lui deve sapere che lo sai."
        esito:
          titolo: La calma
          testo: |
            Gli racconti della cassetta di latta, e lui nega con calma,
            ricordandoti che un righello lo può comprare chiunque. Quello che
            aspetta lo metti insieme da solo, dai registri dei turni e dalle sue
            visite al campanile, in fretta, perché adesso sa.
          pe: { empatia: 5 }
          effetti: { velo.allarme: 1 }
          segue: velo-chi-avvertire

      - testo: "Farlo seguire dai passeri di Giulia"
        descrizione: "Sorella Giulia parla con i passeri, e i passeri vanno dappertutto."
        costo: 2
        prova: { attributo: mentale, abilita: [natura, addestrare-animali], difficolta: Media }
        successo:
          titolo: I passeri
          testo: |
            Per tre giorni Giulia libera un passero ogni volta che Valdrano lascia
            i tavoli. Due notti va al campanile, e ogni sera si ferma davanti
            all'altare nello stesso punto a toccare la pietra del cristallo con il
            righello di metallo.
          pe: { natura: 5 }
          segue: velo-chi-avvertire
        fallimento:
          titolo: Il passero sulla tazza
          testo: |
            Il secondo giorno un passero si posa sulla teiera di Valdrano, e lui
            alza gli occhi a cercare Giulia fra le colonne. Quello che aspetta lo
            metti insieme lo stesso, ma ormai sa che lo stai guardando.
          effetti: { velo.allarme: 1, sospetto: 0.5 }
          segue: velo-chi-avvertire

  - id: velo-chi-avvertire
    presso: cattedrale-del-velo
    immagine: ambientazione/cattedrale-del-velo
    titolo: Chi avvertire
    tipo: seguito
    luogo: Cattedrale del Velo, i giorni prima della compieta grande
    area: quartieri-alti
    requisiti: [fazione.velo == 12]
    testo: |
      Il piano, messo insieme pezzo per pezzo, è questo. Aurenne, l'ultima
      testimone viva del fuoco del Santuario, alla compieta grande sarà
      sull'ultima panca come sempre, con la navata piena e Vantes al pulpito.
      In quel momento Valdrano vuole aprire per pochi secondi la crepa dentro
      il cristallo rosso, perché la città senta che cosa risponde quando il
      Velo prega.

      {magia Difficile} Il cristallo batte come un cuore perché qualcosa,
      dall'altra parte, lo tiene in ritmo. Se la crepa si apre, quello che sta
      dall'altra parte sente la navata, e la navata sente lui.

      Mancano tre giorni. Fratello Lauro Bessi suona le ore al campanile,
      Sorella Celia accorda il liuto, Aurenne prega in fondo con l'artiglio
      nascosto nella manica, e Ottilia tiene le chiavi delle porte.
    opzioni:
      - testo: "Avvertire Fratello Lauro Bessi"
        descrizione: "Dal campanile si vede l'altare, e le campane suonano più forte di qualunque salmo."
        quando: [velo.campanile == 0]
        costo: 0
        esito:
          titolo: Le campane a martello
          testo: |
            Bessi ti ascolta sotto la campana grande, con il pane sulle ginocchia.
            Quella notte le campane a martello, quelle del fuoco, non le suonò.
            «Stavolta le suono» dice, stringendosi le mani fra le ginocchia.
          imposta: { velo.campanile: 1 }
          segue: velo-chi-avvertire

      - testo: "Avvertire Sorella Celia"
        descrizione: "Se la navata canta con il liuto di Celia, è più difficile sentire altro."
        quando: [velo.liuto == 0]
        costo: 0
        esito:
          titolo: Il nastro al polso
          testo: |
            Celia ti chiede soltanto quale salmo, e sceglie già la tonalità. Poi
            si stringe al polso il nastro che Ottilia le fa sempre togliere. «La
            compieta grande la suono con questo» dice.
          imposta: { velo.liuto: 1 }
          segue: velo-chi-avvertire

      - testo: "Avvertire Aurenne"
        descrizione: "È lei che Valdrano vuole sull'ultima panca, e ha più diritto di saperlo."
        quando: [velo.artiglio == 0]
        immagine: personaggi/aurenne
        costo: 0
        esito:
          titolo: L'artiglio
          testo: |
            Aurenne ti ascolta senza voltarsi, poi tira fuori l'artiglio dalla
            manica e lo guarda come se fosse di un'altra. Ha fatto voto di non
            combattere più, e un voto si rompe una volta sola.
          imposta: { velo.artiglio: 1 }
          segue: velo-chi-avvertire

      - testo: "Avvertire Ottilia"
        descrizione: "Ottilia tiene le chiavi di tutte le porte, e sa contare chi esce."
        quando: [velo.porte == 0]
        immagine: personaggi/ottilia-sanvel
        costo: 0
        esito:
          titolo: Le chiavi
          testo: |
            Quando nomini Valdrano, a Ottilia si muove un muscolo della mascella.
            La sera della compieta grande starà sulla porta del chiostro con le
            chiavi, come quella notte. «Stavolta conto anche chi entra» dice.
          imposta: { velo.porte: 1 }
          segue: velo-chi-avvertire

      - testo: "Aspettare la compieta grande"
        descrizione: "Hai avvertito chi volevi, e il resto lo deciderà la sera."
        esito:
          titolo: Tre giorni
          testo: |
            Passi i tre giorni con il velo grigio e il disco in tasca, bevendo
            ogni mattina il tè di Valdrano. La sera della compieta grande la
            navata si riempie.
          pe: { resilienza: 5 }
          effetti: { fazione.velo: 1, rep.velo: 0.5 }

  # ------------------------------------------------------------ passo 14 · la compieta grande
  - id: velo-la-compieta-grande
    presso: cattedrale-del-velo
    immagine: ambientazione/cattedrale-del-velo
    titolo: La compieta grande
    sommario: "La navata è piena di candele e di gente, e Valdrano aspetta sul gradino più basso dell'altare."
    luogo: Cattedrale del Velo, la navata, alla compieta grande
    area: quartieri-alti
    requisiti: [fazione.velo == 13, pista.capomozzo >= 9]
    testo: |
      Alla compieta grande la navata è piena fino alle porte, dai consiglieri
      della prima panca alla gente della Città Bassa salita per sentire
      Celia. Vantes è al pulpito, Celia sulla panca laterale con il liuto, e
      sull'ultima panca, sola, c'è Aurenne con le mani nelle maniche.

      Padre Valdrano è sul gradino più basso dell'altare, dove i cronisti
      prendono nota, con il righello di metallo scuro dritto davanti a sé
      come un'asta e la punta appoggiata alla pietra del cristallo.

      {armi-da-mischia Media} Il righello è lungo come un braccio, e lui lo
      tiene come una leva. Una leva si strappa di mano tirando di lato, dalla
      parte del pollice.

      {percezione Media} La punta è nel punto esatto dove si fermava ogni
      sera, e lì la pietra ha una linea più scura, sottile come un capello.

      Vantes comincia il salmo, e la navata risponde.
    opzioni:
      - testo: "Avvicinarti all'altare"
        descrizione: "Dal gradino più basso, a tre passi da Valdrano, si vede la punta del righello."
        costo: 0
        esito:
          titolo: Tre passi
          testo: |
            Scivoli lungo la navata laterale e ti fermi a tre passi dal gradino.
            Valdrano ti vede, senza smettere di guardare il cristallo.
          segue: velo-il-cristallo-batte

      - testo: "Restare vicino ad Aurenne"
        descrizione: "Se stasera la crepa si apre, Aurenne è la prima a sentirla."
        costo: 0
        esito:
          titolo: L'ultima panca
          testo: |
            Ti siedi sull'ultima panca accanto ad Aurenne, e nella manica la sua
            mano dell'artiglio si chiude a pugno.
          segue: velo-il-cristallo-batte

  - id: velo-il-cristallo-batte
    presso: cattedrale-del-velo
    immagine: personaggi/madre-del-velo
    titolo: Il cristallo batte fuori tempo
    tipo: seguito
    luogo: Cattedrale del Velo, l'altare, alla compieta grande
    area: quartieri-alti
    requisiti: [fazione.velo == 13]
    testo: |
      A metà del salmo il cristallo batte fuori tempo, e il salmo si inceppa a
      metà di una parola. La luce rossa si fa grigia come la corda al
      cristallo in fondo alla sacca, e dalla pietra esce una voce che risponde
      al salmo con un attimo di ritardo.

      {magia Media} La crepa si sta aprendo. Il righello è dentro la pietra
      fino a metà, e quello che risponde passa come l'acqua da una diga.

      Valdrano ha gli occhi chiusi e le labbra che si muovono, e accanto a lui
      la luce grigia prende la forma di un sacerdote. In navata qualcuno
      grida, e le candele si spengono dalle prime panche verso il fondo.

      {intimidire Media} Valdrano con le mani è un vecchio come tanti. È la
      cosa sul gradino che bisogna temere, e il righello che la tiene aperta.

      Il disco in tasca ti scotta come un tizzone.
    opzioni:
      - testo: "Affrontare Valdrano e l'Eco"
        descrizione: "Il righello nella pietra e il sacerdote di luce grigia, davanti a una navata piena."
        quando: [velo.allarme < 2]
        combattimento: velo-la-compieta
        vittoria:
          titolo: Il righello
          testo: |
            L'Eco si sfilaccia all'ultimo colpo, e Valdrano cade in ginocchio. Gli
            strappi il righello dalla pietra, e il cristallo batte una volta sola,
            fortissimo, prima di tornare rosso. Le guardie del Velo lo portano
            via, e lui guarda il cristallo come una porta chiusa in faccia.
          pe: { armi-da-mischia: 10 }
          imposta: { velo.valdrano: 1 }
          effetti: { fazione.velo: 1, rep.velo: 1, reperto.sigillato: 1 }
        sconfitta:
          titolo: La porta del chiostro
          testo: |
            Ti ritrovi a terra con il sangue in bocca, e il gradino è vuoto.
            Valdrano è uscito dalla sagrestia con il righello mentre la navata
            scappava.
          imposta: { velo.valdrano: 3 }
          effetti: { fazione.velo: 1, rep.velo: 1, tormento: 2 }

      - testo: "Affrontare Valdrano e le Eco"
        descrizione: "Valdrano era pronto, e sul gradino i sacerdoti di luce grigia sono due."
        quando: [velo.allarme >= 2]
        combattimento: velo-la-compieta-in-allarme
        vittoria:
          titolo: Il righello
          testo: |
            L'ultima Eco si sfilaccia, e Valdrano cade in ginocchio. Gli strappi
            il righello dalla pietra, e il cristallo batte una volta sola,
            fortissimo, prima di tornare rosso. Le guardie del Velo lo portano
            via.
          pe: { armi-da-mischia: 10 }
          imposta: { velo.valdrano: 1 }
          effetti: { fazione.velo: 1, rep.velo: 1, reperto.sigillato: 1 }
        sconfitta:
          titolo: La porta del chiostro
          testo: |
            Ti ritrovi a terra sul gradino con il sangue in bocca, e quando alzi
            la testa il gradino è vuoto. Valdrano è uscito dalla sagrestia con il
            righello, mentre la navata scappava dall'altra parte.
          imposta: { velo.valdrano: 3 }
          effetti: { fazione.velo: 1, rep.velo: 1, tormento: 2 }

      - testo: "Tenere il tempo con le campane di Bessi"
        descrizione: "Se qualcuno tiene il tempo del Battito con le campane di Bessi, il cristallo torna al suo ritmo."
        quando: [velo.campanile >= 1]
        prova: { attributo: mentale, abilita: resilienza, difficolta: Difficile }
        successo:
          titolo: A martello
          testo: |
            Le campane di Bessi attaccano a martello, e tu dici la Preghiera del
            Battito ad alta voce accanto al gradino, contro la voce del cristallo.
            Il cristallo sbaglia un colpo e torna al ritmo delle campane, e quando
            l'Eco si spegne le guardie del Velo prendono Valdrano per le braccia.
          pe: { resilienza: 10 }
          imposta: { velo.valdrano: 1 }
          effetti: { fazione.velo: 1, rep.velo: 1, reperto.sigillato: 1 }
        fallimento:
          titolo: Il ritmo sbagliato
          testo: |
            Al terzo colpo perdi il tempo, e per un momento la preghiera la dici
            con la voce che esce dalla pietra. Quando torni in te il cristallo è
            rosso, e Valdrano è uscito dalla sagrestia con il righello.
          imposta: { velo.valdrano: 3 }
          effetti: { fazione.velo: 1, rep.velo: 1, tormento: 2, ferite: 1 }

      - testo: "Reggere la navata con il liuto di Celia"
        descrizione: "Se la navata canta con Celia, la voce del cristallo resta sola."
        quando: [velo.liuto >= 1]
        prova: { attributo: sociale, abilita: espressivita, difficolta: Difficile }
        successo:
          titolo: Il salmo da capo
          testo: |
            Celia attacca il salmo da capo, e tu ti alzi a cantare con lei. Panca
            dopo panca il salmo arriva fino in fondo, e la voce del cristallo
            resta sola, in ritardo su tutti, finché si spegne. Le guardie del Velo
            prendono Valdrano con il righello ancora in mano.
          pe: { espressivita: 10 }
          imposta: { velo.valdrano: 1 }
          effetti: { fazione.velo: 1, rep.velo: 1, reperto.sigillato: 1 }
        fallimento:
          titolo: La voce sola
          testo: |
            La navata ha paura e non canta, e la voce del cristallo copre la tua e
            quella di Celia. Quando finisce il gradino è vuoto, perché Valdrano è
            uscito dalla sagrestia mentre tutti guardavano l'altare.
          imposta: { velo.valdrano: 3 }
          effetti: { fazione.velo: 1, rep.velo: 1, tormento: 2, ferite: 1 }

      - testo: "Lasciare che Aurenne rompa il voto"
        descrizione: "Aurenne si è alzata con l'artiglio fuori dalla manica, e bisognerà fermarla in tempo."
        quando: [velo.artiglio >= 1]
        prova: { attributo: sociale, abilita: empatia, difficolta: Difficile }
        successo:
          titolo: La mano buona
          testo: |
            Aurenne posa l'artiglio sulla linea scura del cristallo, e la pietra
            si chiude con un rumore di vetro, spezzando il righello. Valdrano cade
            dal gradino. Prima che lei prema ancora le prendi la mano buona e la
            chiami per nome, e Aurenne si ferma come se si svegliasse.
          pe: { empatia: 10 }
          imposta: { velo.valdrano: 2 }
          effetti: { fazione.velo: 1, rep.velo: 1, reperto.sigillato: 1 }
        fallimento:
          titolo: L'artiglio sulla pietra
          testo: |
            Il cristallo ti butta indietro fino alle panche, e la crepa si chiude.
            Mentre tutti guardano Aurenne, in ginocchio con la mano dell'artiglio
            che sanguina, Valdrano esce dalla sagrestia.
          imposta: { velo.valdrano: 3 }
          effetti: { fazione.velo: 1, rep.velo: 1, tormento: 2, ferite: 1 }

      - testo: "Prenderlo vivo con Ottilia"
        descrizione: "Ottilia ha chiuso le porte del chiostro e della sagrestia, e bisogna arrivare al gradino prima della cosa grigia."
        quando: [velo.porte >= 1]
        prova: { attributo: fisico, abilita: [rissa, armi-da-mischia], difficolta: Difficile }
        successo:
          titolo: La porta chiusa
          testo: |
            Corri al gradino con Ottilia dietro e prendi Valdrano per il polso. Il
            righello esce dalla pietra con un rumore di dente strappato, e il
            cristallo torna rosso. Valdrano si gira verso la sagrestia e trova la
            porta chiusa a chiave, mentre Ottilia, dal fondo, conta.
          pe: { rissa: 10 }
          imposta: { velo.valdrano: 1 }
          effetti: { fazione.velo: 1, rep.velo: 1, reperto.sigillato: 1 }
        fallimento:
          titolo: La finestra del chiostro
          testo: |
            L'Eco ti sbarra la strada, e quando ti rialzi il gradino è vuoto.
            Trovata chiusa la sagrestia, Valdrano è uscito dalla finestra del
            chiostro, a settant'anni, con il righello sotto il braccio.
          imposta: { velo.valdrano: 3 }
          effetti: { fazione.velo: 1, rep.velo: 1, tormento: 2, ferite: 1 }

      - testo: "Scacciare l'Eco con l'Esorcismo"
        incantesimo: esorcismo
        descrizione: "Senza la cosa grigia, Valdrano è un vecchio con un righello."
        prova: { attributo: mentale, abilita: magia, difficolta: Difficile }
        successo:
          titolo: Il rito davanti a tutti
          testo: |
            Reciti il rito a voce alta nella navata zitta, e l'Eco si sfilaccia
            verso la crepa, che si chiude dietro di lei. Le guardie del Velo
            salgono il gradino.
          pe: { magia: 10 }
          imposta: { velo.valdrano: 1 }
          effetti: { fazione.velo: 1, rep.velo: 1, reperto.sigillato: 1 }
        fallimento:
          titolo: La voce rotta
          testo: |
            La voce del cristallo copre la tua, e l'Eco ti risponde con le tue
            stesse parole. Quando la crepa si chiude il gradino è vuoto, e
            Valdrano è uscito dalla sagrestia.
          imposta: { velo.valdrano: 3 }
          effetti: { fazione.velo: 1, rep.velo: 1, tormento: 2, ferite: 1 }

  # ------------------------------------------------------------ passo 15 · la bocca cucita (grado 5)
  - id: velo-la-bocca-cucita
    presso: cattedrale-del-velo
    immagine: personaggi/madre-del-velo
    titolo: La bocca cucita
    sommario: "La Madre ti chiama nel reliquiario dei Tre Portatori, dove ti aspettano due lame e una domanda."
    luogo: Cattedrale del Velo, la Cripta, il reliquiario dei Tre Portatori
    area: quartieri-alti
    requisiti: [fazione.velo == 14, pista.capomozzo >= 9]
    testo: |
      La mattina dopo la compieta un velato ti accompagna nel reliquiario dei
      Tre Portatori, una sala bassa della Cripta con tre nicchie nella pietra.
      In quella di mezzo, su un panno di velluto grigio, ci sono due lame
      dritte di acciaio scuro, e sopra c'è il ritratto di un uomo con gli
      occhi color rame e la bocca cucita con fili d'oro.

      {accademiche Media} Kael Dareth. Consegnò le sue due lame al Velo nel
      134, quando rifiutò un posto nelle cerimonie, e i paladini lo invocano
      prima di tacere quello che hanno visto.

      La Madre è in piedi davanti al ritratto. Che tu abbia accettato di
      aspettare oppure no, ti ha mandato a chiamare.

      «La città ha sentito una voce nel cristallo» dice. «Adesso vorrà sapere
      di chi era. Si può dirle della riga strappata, dei sei sacerdoti
      chiamati fuori e del fuoco lasciato accendere. Si può dirle che un
      vecchio cronista ha avuto un malore durante la compieta.» I veli non si
      muovono. «Lo decidi tu. Le lame sono due, e ne resta una sola qui.»

      {origine accolito-del-velo} Il ritratto con la bocca cucita lo
      spolveravi da novizio guardandolo di sbieco, e adesso sembra aspettare
      una risposta anche lui.
    opzioni:
      - testo: "Dirlo alla città"
        descrizione: "La verità detta in Consiglio, e il Velo ne uscirà ferito."
        esito:
          titolo: La strada per il Municipio
          testo: |
            La Madre resta immobile a lungo. Poi ti dice che chi parla una volta
            sa quanto costa, e che il costo lo paga anche lei. Il velato ti porge
            una delle due lame con il fodero, e Vantes ti aspetta in navata.
          segue: velo-davanti-al-consiglio

      - testo: "Tacerlo"
        descrizione: "Un vecchio cronista ha avuto un malore, e la verità scende nelle celle."
        esito:
          titolo: La scala delle celle
          testo: |
            La Madre china appena la testa, un movimento che non le avevi mai
            visto fare. Il velato ti porge una delle due lame e ti indica la scala
            delle celle, nelle cantine del vecchio Santuario.
          segue: velo-la-scala-delle-celle

      - testo: "Lasciarlo correre fra i suoi"
        descrizione: "Una lettera scritta bene può rimandare Valdrano fra i suoi, e dire a loro quello che vuole il Velo."
        quando: [velo.valdrano == 1, velo.attesa == 1]
        esito:
          titolo: La lettera
          testo: |
            I veli si muovono, per la prima volta, e la Madre dice soltanto
            *bene*. Il velato ti porge una delle due lame e ti porta alle celle,
            dove Valdrano aspetta sulla branda con le mani in grembo.
          segue: velo-la-lettera-falsa

  - id: velo-davanti-al-consiglio
    presso: municipio
    immagine: ambientazione/quartieri-alti
    titolo: Davanti al Consiglio
    tipo: seguito
    luogo: Il Municipio, la sala del Consiglio
    area: quartieri-alti
    requisiti: [fazione.velo == 14]
    testo: |
      La sala del Consiglio è piena come la navata della compieta, di gente
      che ha paura e vuole un colpevole. Padre Vantes siede pallido al suo
      posto, e Julia Castaldi ha davanti le pratiche già lette. Quando ti alzi
      la lama di Kael Dareth tintinna contro la panca.

      {politica-ed-economia Media} Metà della sala vuole sentire che il Velo è
      marcio, l'altra metà che è innocente. Nessuno vuole la storia intera,
      che non fa comodo a nessuno.

      {galateo Facile} Julia Castaldi ti guarda come si guarda un testimone,
      con la penna già intinta, la sola venuta per ascoltare.

      Nella bisaccia hai le lettere con i due dischi, e il foglio della riga
      strappata che Ottilia ti ha dato stamattina senza dire niente.
    opzioni:
      - testo: "Raccontare tutto, dall'inizio"
        descrizione: "Dalla riga strappata fino al fuoco del Santuario, con una voce che regga per un'ora."
        quando: [pista.acciaio < 8]
        prova: { attributo: sociale, abilita: [persuasione, politica-ed-economia], difficolta: Difficile }
        successo:
          titolo: Custode del Silenzio
          testo: |
            Racconti per un'ora, e quando arrivi al fuoco lasciato accendere nessuno si muove
            più sulle panche. Julia Castaldi chiede una copia di tutto. La sera Vantes ti porta
            il simbolo dell'Albero in platino con il ramo annerito e una borsa di monete del
            Velo. La Madre non ti riceverà più, e Silvano Ardice torna a predicare.
          pe: { persuasione: 10 }
          imposta: { velo.finale: 1 }
          effetti: { fazione.velo: 1, oggetto.velo-lama-di-kael: 1, oggetto.velo-simbolo-in-platino: 1, monete: 350, rep.castaldi: 1, rep.caserma: 0.5 }
          almeno: { rep.velo: 10 }
        fallimento:
          titolo: Le risate
          testo: |
            A metà racconto qualcuno ride, e la verità esce dal Municipio a pezzi,
            buoni per fazioni diverse. Julia Castaldi chiede una copia di tutto.
            La sera Vantes ti porta il simbolo dell'Albero in platino e una borsa
            di monete del Velo. La Madre non ti riceverà più.
          imposta: { velo.finale: 1 }
          effetti: { fazione.velo: 1, oggetto.velo-lama-di-kael: 1, oggetto.velo-simbolo-in-platino: 1, monete: 350, rep.castaldi: 1, rep.caserma: 0.5, scandalo: 1.5 }
          almeno: { rep.velo: 10 }

      - testo: "Raccontare tutto, dall'inizio"
        descrizione: "Dopo l'Acciaieria la parola di Vantes pesa in Consiglio, e con lui al tuo fianco la sala ascolta."
        quando: [pista.acciaio >= 8]
        prova: { attributo: sociale, abilita: [persuasione, politica-ed-economia], difficolta: Media }
        successo:
          titolo: Custode del Silenzio
          testo: |
            Vantes dice alla sala che quello che sentirà lo ha confermato lui, e racconti per
            un'ora davanti a panche che smettono di scricchiolare. Julia Castaldi chiede una copia
            di tutto. La sera Vantes ti porta il simbolo dell'Albero in platino e una borsa di
            monete del Velo. La Madre non ti riceverà più.
          pe: { persuasione: 10 }
          imposta: { velo.finale: 1 }
          effetti: { fazione.velo: 1, oggetto.velo-lama-di-kael: 1, oggetto.velo-simbolo-in-platino: 1, monete: 350, rep.castaldi: 1, rep.caserma: 0.5 }
          almeno: { rep.velo: 10 }
        fallimento:
          titolo: Le risate
          testo: |
            A metà racconto qualcuno ride, e nemmeno Vantes ferma la sala, ma
            Julia Castaldi chiede una copia di tutto. La sera Vantes ti porta il
            simbolo dell'Albero in platino e una borsa di monete del Velo. La
            Madre non ti riceverà più.
          imposta: { velo.finale: 1 }
          effetti: { fazione.velo: 1, oggetto.velo-lama-di-kael: 1, oggetto.velo-simbolo-in-platino: 1, monete: 350, rep.castaldi: 1, rep.caserma: 0.5, scandalo: 1.5 }
          almeno: { rep.velo: 10 }

      - testo: "Mettere le carte sul tavolo di Julia Castaldi"
        descrizione: "Le lettere e il foglio del registro parlano da soli, e Julia Castaldi sa leggere."
        esito:
          titolo: La pila di Julia
          testo: |
            Julia Castaldi legge le tue carte per un'ora mentre la sala mormora,
            poi annuncia che il Consiglio ne discuterà a porte chiuse. La sera
            Vantes ti porta il simbolo dell'Albero in platino e una borsa di
            monete del Velo. La Madre non ti riceverà più.
          pe: { politica-ed-economia: 10 }
          imposta: { velo.finale: 1 }
          effetti: { fazione.velo: 1, oggetto.velo-lama-di-kael: 1, oggetto.velo-simbolo-in-platino: 1, monete: 350, rep.castaldi: 1, rep.caserma: 0.5 }
          almeno: { rep.velo: 10 }

  - id: velo-la-scala-delle-celle
    presso: cattedrale-del-velo
    immagine: personaggi/ottilia-sanvel
    titolo: La scala delle celle
    tipo: seguito
    luogo: Cattedrale del Velo, le celle nelle cantine del vecchio Santuario
    area: quartieri-alti
    requisiti: [fazione.velo == 14]
    testo: |
      Le celle stanno nelle cantine del vecchio Santuario, risparmiate
      dall'incendio come gli archivi minori. In fondo a una scala stretta c'è
      un corridoio con sei porte, e la prima è quella dove morì Mirn il Sordo.
      Ottilia Sanvel ti aspetta in cima con le chiavi e il foglio della riga
      strappata ripiegato in quattro.

      «La Madre dice che quello che si tace va custodito, perché il sapere si
      accumula e basta» dice Ottilia. «Saggezza è quello che decidi di non
      dimenticare.» Ti porge il foglio. «Questo va giù con il resto.»

      {empatia Media} Lo dice con la voce di tutte le mattine, ma ha piegato
      il foglio con molta cura, come una lettera che si vuole rileggere.
    opzioni:
      - testo: "Accompagnare Valdrano nelle celle"
        descrizione: "Valdrano scende con te, e non risale."
        quando: [velo.valdrano == 1]
        esito:
          titolo: Custode del Silenzio
          testo: |
            Valdrano scende la scala davanti a te, piano, con il ginocchio che gli
            fa male, e davanti alla terza porta ti chiede del tè. Glielo prometti.
            Ottilia chiude a chiave e la mattina dopo aggiunge un nome al suo
            elenco del mattino. La Madre ti apre la Cripta quando vuoi, e Sorella
            Arva ti conta una borsa di monete con le mani che le tremano.
          pe: { resilienza: 10 }
          imposta: { velo.finale: 2 }
          effetti: { fazione.velo: 1, oggetto.velo-lama-di-kael: 1, velo.udienza: 1, monete: 350, rep.velo: 1 }
          almeno: { rep.velo: 10 }

      - testo: "Portare giù le lettere e il foglio"
        descrizione: "Valdrano non verrà a sedersi su quella branda, e quello che resta di lui è carta da custodire."
        quando: [velo.valdrano >= 2]
        esito:
          titolo: Custode del Silenzio
          testo: |
            Chiudi le carte di Valdrano nella terza cella, in una cassetta di
            latta nuova, e Ottilia aggiunge un nome al suo elenco del mattino. La
            Madre ti apre la Cripta quando vuoi, e Sorella Arva ti conta una borsa
            di monete.
          pe: { resilienza: 10 }
          imposta: { velo.finale: 2 }
          effetti: { fazione.velo: 1, oggetto.velo-lama-di-kael: 1, velo.udienza: 1, monete: 350, rep.velo: 1 }
          almeno: { rep.velo: 10 }

      - testo: "Tenere per te una copia della riga"
        descrizione: "La riga va giù, ma una copia fra due conti della spesa non la cerca nessuno."
        prova: { attributo: fisico, abilita: furtivita, difficolta: Difficile }
        successo:
          titolo: Fra due conti della spesa
          testo: |
            Mentre Ottilia apre la cella ricopi la riga strappata in fondo al
            quaderno, e lei non si volta. La mattina dopo aggiunge un nome al suo
            elenco del mattino. La Madre ti apre la Cripta quando vuoi, e Sorella
            Arva ti conta una borsa di monete.
          pe: { furtivita: 10 }
          imposta: { velo.finale: 2 }
          effetti: { fazione.velo: 1, oggetto.velo-lama-di-kael: 1, velo.udienza: 1, monete: 350, rep.velo: 1, informazioni.segreto: 1 }
          almeno: { rep.velo: 10 }
        fallimento:
          titolo: La mano tesa
          testo: |
            Ottilia si volta, ti strappa la pagina dal quaderno e la mette nella
            cella con il resto. La mattina dopo aggiunge un nome al suo elenco del
            mattino. La Madre ti apre la Cripta quando vuoi, e Sorella Arva ti
            conta una borsa di monete.
          imposta: { velo.finale: 2 }
          effetti: { fazione.velo: 1, oggetto.velo-lama-di-kael: 1, velo.udienza: 1, monete: 350, rep.velo: 1, sospetto: 0.5 }
          almeno: { rep.velo: 10 }

  - id: velo-la-lettera-falsa
    presso: cattedrale-del-velo
    immagine: icone/envelope
    titolo: La lettera falsa
    tipo: seguito
    luogo: Cattedrale del Velo, la terza cella
    area: quartieri-alti
    requisiti: [fazione.velo == 14]
    testo: |
      Nella terza cella, sul tavolino accanto alla branda, c'è già pronta la
      carta dei cronisti con il righello di metallo scuro di Valdrano. Lui è
      seduto sulla branda, le mani in grembo, e ha la faccia di un uomo che sa
      già come andrà e la trova giusta.

      La lettera deve partire stanotte dalla cassetta sotto l'Orlo, con la sua
      grafia e le sue frasi che cominciano dal soggetto e finiscono con un
      punto. Deve dire che la compieta è fallita per un malore, che il Velo
      non sa niente, e che il cronista maggiore torna al suo posto in attesa
      di istruzioni. Così chi riceve le sue lettere riceverà quelle che vuole
      il Velo.

