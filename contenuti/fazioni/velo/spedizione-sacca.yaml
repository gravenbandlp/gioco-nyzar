# La sacca sotto l'Orlo, spedizione del passo 8 della quest del Velo (fazione.velo == 7). Ci si entra dal pozzo di scolo
# dietro la baracca di Grusk (velo-il-pozzo-di-scolo, in passi-2.yaml), con Padre Walter che tiene la corda dall'alto.
# Le stanze chiedono tutte fazione.velo == 7 e vanno in fasce di profondità; una stanza superata non ricompare nella
# stessa visita:
# 0 la discesa (i pioli; gli spazzini della notte, che valgono anche a 1), 1 i condotti della Prima Breccia (le grate
# con i sigilli del 115; i vapori azzurrastri, che valgono anche a 2), 2 il bordo della sacca (i nidi dei vermi
# carogna; il reperto scartato; l'eco del Raschiatore del 115, che vale anche a 3), 3 la galleria asciutta (l'aria
# fredda; le impronte). Il cuore a 4 è la sacca, con il nato della sacca: batterlo o tenerlo lontano con l'Esorcismo
# apre il seguito della corda al cristallo, dove la sacca si misura (velo.sacca 1). Chi esce con la sola cassetta la
# lascia fuori dal bollettino (velo.sacca 2). In ogni ramo trovi le lettere e il disco, e il passo si chiude.
aree:
  - id: velo-sacca-dell-orlo
    immagine: ambientazione/orlo-dei-rottami
    nome: La sacca sotto l'Orlo
    sommario: "Sotto la spiaggia dei rottami corrono i condotti della Prima Breccia, quelli da cui nel 115 salì la Marea."
    spedizione: { ritorno: citta-bassa, soglia: 4, stanze: 3 }
    testo: |
      Sotto l'Orlo dei Rottami la Città Bassa ha scaricato per cinquant'anni quello che non voleva più vedere,
      e la terra se l'è preso un po' alla volta. Il pozzo di scolo scende fra muri di mattoni rossi fino ai
      condotti della Prima Breccia, tubi di pietra larghi come una stanza. La pietra è lisciata dall'acqua
      fino all'altezza del ginocchio, e più su porta ancora i segni dello scalpello. Nel 115 ne salì la Marea,
      e il Velo li chiuse con grate e sigilli che adesso sono ruggine.

      Dall'alto arriva la corda di Walter. È sempre tesa, e quando ti fermi la senti vibrare piano contro il
      fianco.

storylet:
  # ------------------------------------------------------------ 0 · la discesa
  - id: velo-sacca-i-pioli
    immagine: ambientazione/orlo-dei-rottami
    titolo: I pioli
    sommario: "La scala del pozzo di scolo scende per cento pioli nel buio. La ruggine se n'è mangiati parecchi."
    luogo: La sacca sotto l'Orlo, il pozzo di scolo
    area: velo-sacca-dell-orlo
    ripetibile: true
    requisiti: [fazione.velo == 7, profondita.velo-sacca-dell-orlo == 0]
    testo: |
      La scala del pozzo è fatta di pioli di ferro piantati nei mattoni rossi, e la ruggine ne ha mangiati più
      della metà. Alcuni si piegano sotto il piede, altri ti restano in mano con un moncone sbriciolato al
      posto della punta. Il pozzo è largo quanto un carro e gocciola da tutti i giunti, e ogni goccia arriva
      in fondo molto dopo che l'hai vista partire. Walter ti aspetta al primo pianerottolo con la lanterna
      alla cintura e la corda che sale dritta verso il cerchio di cielo.

      {atletica Media} Sui mattoni ci sono incavi lucidi dove qualcuno ha messo i piedi al posto dei pioli
      mancanti. Sono profondi un dito e hanno gli orli arrotondati, e chi scende di qui lo fa spesso.
    opzioni:
      - testo: "Scendere piolo per piolo"
        descrizione: "I piedi negli incavi, le mani sui pioli buoni."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Media }
        successo:
          titolo: Il pianerottolo
          testo: |
            Trovi gli incavi uno dopo l'altro e lasci stare i pioli che si piegano, e la punta del piede ci
            entra giusta come in una staffa. Al pianerottolo Walter ti mette sulla spalla una mano pesante e
            calda, poi ti indica l'imbocco del primo condotto. Da lì in avanti la corda la tiene lui
            dall'alto.
          effetti: { profondita.velo-sacca-dell-orlo: 1 }
        fallimento:
          titolo: Il piolo
          testo: |
            Un piolo ti resta in mano, e scivoli per tre braccia con le unghie sui mattoni prima che la corda
            di Walter si tenda e ti fermi con uno strattone alla vita. Resti appes{o|a} contro i mattoni con
            le ginocchia sbucciate, e Walter ti tira su fino all'ultimo piolo sicuro senza dire niente. Il
            piolo che avevi in mano lo senti toccare il fondo molto dopo.
          effetti: { ferite: 0.5 }

      - testo: "Farti calare da Walter"
        descrizione: "Walter ha le braccia di uno scaricatore. Se ti siedi nel cappio della corda, ti cala lui, ma ci vuole tempo."
        costo: 2
        esito:
          titolo: Il cappio
          testo: |
            Ti siedi nel cappio della corda come su un'altalena, e Walter ti cala giù un braccio alla volta,
            piano, contando sottovoce. I mattoni ti passano davanti al naso e la malta si sbriciola dove li
            sfiori con la spalla. Arrivi al pianerottolo con le gambe intorpidite e il segno della corda
            stampato sulle cosce.
          effetti: { profondita.velo-sacca-dell-orlo: 1 }

  - id: velo-sacca-gli-spazzini
    immagine: personaggi/grusk
    titolo: Gli spazzini della notte
    sommario: "In fondo al pozzo due spazzini senza licenza contrattano cristalli sterili alla luce di una lanterna cieca."
    luogo: La sacca sotto l'Orlo, il fondo del pozzo
    area: velo-sacca-dell-orlo
    ripetibile: true
    requisiti: [fazione.velo == 7, profondita.velo-sacca-dell-orlo <= 1]
    testo: |
      In fondo al pozzo, nel fango di ruggine e cocci, due uomini sono accucciati intorno a una lanterna
      cieca. Su un sacco steso fra loro c'è una fila di cristalli sterili spenti e opachi, e uno li batte con
      la punta del coltello per sentire se suonano pieni. Quando li illumini si alzano con i ganci da rottami
      in mano.

      {conoscenze-della-strada Media} Di giorno l'Orlo è della Gilda e di notte di chi ci scende. I cristalli
      sterili si vendono a peso agli alchimisti del Mercato delle Ombre.

      «Il Velo» dice il più vecchio guardando la tua tonaca. Il più giovane ha già fatto un passo verso il
      buio del condotto, e tiene il gancio basso lungo la gamba.

      {origine mercante-dei-ponti} Dalla prima offerta capisci che si stanno facendo un prezzo da ladri tutti
      e due.
    opzioni:
      - testo: "Dirgli che non sei qui per loro"
        descrizione: "Il Velo cerca una sacca, non due spazzini. Se ti credono, ti dicono anche dove si passa."
        prova: { attributo: sociale, abilita: [politica-ed-economia, persuasione], difficolta: Media }
        successo:
          titolo: Il passaggio buono
          testo: |
            Gli spieghi che dei loro cristalli non ti importa niente, e che della sacca invece ti importa
            molto. Il vecchio ci pensa a lungo, poi ti indica con la punta del gancio il condotto di sinistra.
            Ti spiega che è quello dove si passa senza bagnarsi, il condotto dove di notte scende uno con la
            tonaca grigia, che loro lasciano passare senza guardarlo. Lo dice abbassando la voce anche se
            laggiù non c'è nessuno a sentirlo.
          pe: { politica-ed-economia: 3 }
          effetti: { profondita.velo-sacca-dell-orlo: 1 }
        fallimento:
          titolo: Il gancio
          testo: |
            Il vecchio non ti crede. Raccoglie il sacco con i cristalli in un gesto solo e sparisce nel
            condotto, e il giovane gli va dietro agitando il gancio verso di te. Resti al buio con la lanterna
            e il fango fino alle caviglie. Per un po' senti ancora i cristalli tintinnare nel sacco sempre più
            lontano.
          effetti: { tormento: 1 }

      - testo: "Affrontarli"
        descrizione: "Hanno i ganci, e il buio lo conoscono meglio di te. Però sono spazzini, e di soldati hanno poco."
        combattimento: velo-gli-spazzini
        vittoria:
          titolo: I cristalli sterili
          testo: |
            Il giovane scappa per primo, e il vecchio gli va dietro zoppicando. Sul sacco steso nel fango sono
            rimasti un paio di cristalli sterili, che ti metti in tasca con gli spigoli ancora sporchi di
            ruggine. Dall'alto la corda di Walter si muove di un palmo, come a chiedere se è tutto a posto, e
            tu la tiri una volta per dire di sì.
          effetti: { profondita.velo-sacca-dell-orlo: 1, cristalli.cristallo-sterile: 2 }
        sconfitta:
          titolo: Il fango
          testo: |
            Un gancio ti prende sulla spalla, e un altro sulla caviglia, e ti ritrovi con la faccia nel fango
            di ruggine. Gli spazzini se ne vanno con il loro sacco, e tu ti rialzi tenendoti alla corda di
            Walter con il fango incollato alle ciglia.
          effetti: { tormento: 1 }

      - testo: "Aspettare che se ne vadano"
        descrizione: "Prima o poi il prezzo lo trovano, e se ne vanno. Basta spegnere la lanterna e stare fermi."
        costo: 2
        esito:
          titolo: Al buio
          testo: |
            Spegni la lanterna e ti appiattisci contro i mattoni. Gli spazzini si chiamano un paio di volte a
            bassa voce, poi tornano a contrattare a mezze parole sul peso di ogni cristallo, e dopo un'ora che
            sembra una notte si mettono il sacco in spalla e spariscono in un condotto laterale. Riaccendi la
            lanterna con le dita intorpidite e vai avanti.
          effetti: { profondita.velo-sacca-dell-orlo: 1 }

  # ------------------------------------------------------------ 1 · i condotti della Prima Breccia
  - id: velo-sacca-le-grate
    immagine: ambientazione/orlo-dei-rottami
    titolo: Le grate del 115
    sommario: "Il condotto è chiuso da una grata con i sigilli del Velo del 115. Qualcuno l'ha aperta, e poi l'ha richiusa con cura."
    luogo: La sacca sotto l'Orlo, i condotti della Prima Breccia
    area: velo-sacca-dell-orlo
    ripetibile: true
    requisiti: [fazione.velo == 7, profondita.velo-sacca-dell-orlo == 1]
    testo: |
      Il condotto è chiuso da una grata di ferro coperta di sigilli di piombo con l'Albero del Velo. Su ognuno
      la stessa mano ha inciso il 115, l'anno della Prima Breccia, con le cifre strette e inclinate a destra.
      Alcuni sono rotti e altri sono di un piombo ancora chiaro, con la stessa data. Il ferro della grata si
      sfoglia sotto l'unghia, e i sigilli chiari ci stanno sopra senza una macchia.

      {percezione Facile} La catena della grata ha un lucchetto nuovo e un velo d'olio sulle maglie. Chi passa
      di qui vuole farlo in silenzio.

      Dietro la grata il condotto scende, e l'aria che ne viene è più fredda di quella del pozzo. Porta un
      odore dolce che con la ruggine e il fango non ha niente a che fare.
    opzioni:
      - testo: "Leggere i sigilli"
        descrizione: "Un sigillo del Velo dice chi l'ha messo e perché. Uno rifatto dice ancora di più."
        prova: { attributo: mentale, abilita: [accademiche, percezione], difficolta: Media }
        successo:
          titolo: Il punzone
          testo: |
            Pulisci i sigilli nuovi con il pollice. Sotto la data, piccolo, c'è il segno del punzone dei
            cronisti, un righello con due tacche, lo stesso che hai visto sui registri del chiostro. Il piombo
            è così fresco che il pollice ci lascia un'impronta lucida. Il lucchetto si apre con la chiave dei
            pozzi che Walter ti ha dato per sicurezza, e la grata gira sui cardini oliati senza un cigolio.
          pe: { accademiche: 3 }
          effetti: { profondita.velo-sacca-dell-orlo: 1 }
        fallimento:
          titolo: Il piombo
          testo: |
            Gratti un sigillo con l'unghia per leggerlo meglio, e il piombo si stacca e ti cade nel fango. Lo
            cerchi a lungo, inginocchiat{o|a}, con la lanterna che ti scotta il polso e il fango freddo che ti
            passa la stoffa sulle ginocchia. Quando lo ritrovi è spezzato in due, e la grata è ancora chiusa.
          effetti: { tormento: 1 }

      - testo: "Forzare il lucchetto"
        descrizione: "È nuovo e oliato, e chi l'ha messo non voleva sentirlo cigolare. Una lama al punto giusto lo apre."
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Media }
        successo:
          titolo: Il lucchetto oliato
          testo: |
            Infili la punta del coltello nella serratura e la giri finché qualcosa scatta. Il lucchetto si
            apre senza un rumore, come se aspettasse soltanto te. L'olio ti resta sulle dita con un odore di
            sego. Lo richiudi alle tue spalle, perché chi passa di qui non si accorga che sei passat{o|a}
            anche tu.
          pe: { tecnologia: 3 }
          effetti: { profondita.velo-sacca-dell-orlo: 1 }
        fallimento:
          titolo: La punta
          testo: |
            La punta del coltello si spezza dentro la serratura con uno schiocco secco che il condotto ti
            rimanda due volte, e il lucchetto resta chiuso con un pezzo della tua lama dentro. Chiunque passi
            di qui stanotte saprà che qualcuno ci ha provato.
          effetti: { tormento: 1 }

      - testo: "Passare dal tubo di scolo"
        descrizione: "Accanto alla grata c'è un tubo di scolo largo quanto le spalle. È sporco, ed è lungo."
        costo: 2
        esito:
          titolo: Il tubo
          testo: |
            Ti infili nel tubo a gomiti e ginocchia, con la lanterna spinta davanti a te, e ci strisci per un
            tempo che non sai misurare. Il tubo è di terracotta e ogni giunto ti gratta la schiena quando ci
            passi sotto. Esci dall'altra parte della grata copert{o|a} di una melma grigia che odora di
            cantina, e Walter, quando tiri la corda per dirgli che sei passat{o|a}, risponde con due strappi
            brevi.
          effetti: { profondita.velo-sacca-dell-orlo: 1, contaminazione: 1 }

  - id: velo-sacca-i-vapori
    immagine: ambientazione/marea-grigia
    titolo: I vapori azzurrastri
    sommario: "Nel condotto galleggia un vapore azzurrastro all'altezza del petto. È lo stesso che nel 115 salì dai pozzi."
    luogo: La sacca sotto l'Orlo, un condotto in discesa
    area: velo-sacca-dell-orlo
    ripetibile: true
    requisiti: [fazione.velo == 7, profondita.velo-sacca-dell-orlo >= 1, profondita.velo-sacca-dell-orlo <= 2]
    testo: |
      A metà della curva del condotto l'aria cambia colore. Un vapore azzurrastro galleggia all'altezza del
      petto e scivola piano verso il calore della lanterna. Sotto il vapore il pavimento è asciutto, e contro
      la volta l'aria è limpida. Il bordo di sotto è netto come la superficie di un'acqua ferma, e un topo che
      arriva dalla curva ci passa sotto con il muso schiacciato a terra.

      {natura Media} È Marea Grigia nella sua forma più leggera, quella che si respira senza accorgersene. Nel
      115 ne bastò una notte per mandare centinaia di persone al Santuario.

      {origine apprendista-raschiatore} Sulle piattaforme ti hanno insegnato ridendo che il vapore azzurro sta
      a mezz'aria e si passa sotto carponi. Nessuno di quelli che ridevano l'aveva mai visto.
    opzioni:
      - testo: "Passare senza prendere aria"
        descrizione: "Una trentina di passi dentro il vapore. Se il fiato regge, la Marea resta fuori."
        prova: { attributo: fisico, abilita: [resistenza, atletica], difficolta: Media }
        successo:
          titolo: Trenta passi
          testo: |
            Riempi i polmoni e attraversi il vapore a passo svelto, con gli occhi socchiusi e la lanterna
            bassa. Dentro, la fiamma si fa azzurra e la sua luce non arriva oltre il tuo braccio. Quando esci
            dall'altra parte il petto ti brucia e le tempie ti battono, ma l'aria che prendi è pulita. Ti
            volti, e il vapore si è già richiuso alle tue spalle.
          effetti: { profondita.velo-sacca-dell-orlo: 1 }
        fallimento:
          titolo: Sapore di ferro
          testo: |
            A metà strada il fiato finisce, e l'aria che prendi sa di ferro e ti gratta la gola. Torni
            indietro tossendo, con gli occhi che lacrimano e un sapore di moneta sotto la lingua che non va
            via.
          effetti: { contaminazione: 1 }

      - testo: "Passare sotto, carponi"
        descrizione: "Sotto il vapore il pavimento è pulito. Basta stare bassi, e non avere fretta."
        prova: { attributo: fisico, abilita: [acrobazia, furtivita], difficolta: Media }
        successo:
          titolo: Carponi
          testo: |
            Ti abbassi fino a sfiorare la pietra con il mento e strisci sotto il vapore, con la lanterna
            spinta davanti a te. Sopra la tua testa l'azzurro si abbassa piano verso la lanterna, e tu tieni
            gli occhi sulla pietra. Dall'altra parte ti rialzi con le ginocchia indolenzite e la tonaca da
            lavare.
          effetti: { profondita.velo-sacca-dell-orlo: 1 }
        fallimento:
          titolo: La testa alta
          testo: |
            A metà strada alzi la testa per vedere quanto manca, e il vapore ti entra nel naso e ti punge
            dietro gli occhi. Torni indietro di gomito con la tosse, e ti siedi contro la parete finché il
            sapore di ferro non passa.
          effetti: { contaminazione: 1 }

      - testo: "Aspettare che il vapore si alzi"
        descrizione: "Il vapore sale verso la lanterna. Se la spegni e aspetti, forse si alza abbastanza da passare."
        costo: 2
        esito:
          titolo: Al buio
          testo: |
            Spegni la lanterna e aspetti al buio, sedut{o|a}, finché il vapore non sale verso la volta e
            lascia libero il passaggio. Ci vuole molto. Al buio conti le gocce che cadono dalla volta finché
            perdi il numero. Quando passi, l'azzurro è sopra di te come un soffitto basso, e qualche filo ti
            scende sui capelli.
          effetti: { profondita.velo-sacca-dell-orlo: 1, contaminazione: 1 }

  # ------------------------------------------------------------ 2 · il bordo della sacca
  - id: velo-sacca-i-nidi
    immagine: bestiario/verme-carogna
    titolo: I nidi
    sommario: "Il condotto si allarga in una cisterna, e le pareti sono coperte di buchi. In ogni buco c'è qualcosa che si muove."
    luogo: La sacca sotto l'Orlo, una cisterna sul bordo
    area: velo-sacca-dell-orlo
    ripetibile: true
    requisiti: [fazione.velo == 7, profondita.velo-sacca-dell-orlo == 2]
    testo: |
      Il condotto sbocca in una cisterna rotonda dalle pareti bucate come una forma di formaggio. I buchi sono
      larghi quanto un pugno e hanno l'orlo lucido, levigato da qualcosa che ci entra e ci esce da molto
      tempo. Da qualche buco esce una testa cieca e bianca che annusa l'aria e si ritira. Sul fondo c'è un
      mucchio di ossa piccole spolpate con cura, e da vicino ognuna è segnata da file di denti fini.

      {natura Facile} Vermi carogna, che sentono il calore più del rumore.

      L'uscita è una bocca di pietra nera a venti passi, e la lanterna che hai in mano è la cosa più calda
      della cisterna. Mentre la guardi, le teste nei buchi più vicini si voltano piano verso la fiamma.
    opzioni:
      - testo: "Aprirti la strada"
        descrizione: "Sono ciechi e lenti a capire. Se ne escono due, due si possono stendere."
        combattimento: vermi-carogna
        vittoria:
          titolo: La bocca nera
          testo: |
            Il secondo verme si ritira nel suo buco con un sibilo, lasciando sulla pietra una scia di bava che
            fuma appena nell'aria fredda. Attraversi la cisterna di corsa, con le teste cieche che si
            affacciano da tutte le parti e rientrano, e ti infili nella bocca nera dall'altra parte.
          effetti: { profondita.velo-sacca-dell-orlo: 1 }
        sconfitta:
          titolo: I denti
          testo: |
            Un verme ti si attacca al polpaccio con una bocca tonda piena di denti fini, e quando riesci a
            staccarlo ne sono usciti altri tre. Torni nel condotto zoppicando, e le teste cieche ti seguono
            fino al bordo dei buchi, annusando.
          effetti: { tormento: 1 }

      - testo: "Passare con la lanterna schermata"
        descrizione: "Sentono il calore. Se la lanterna è chiusa e tu stai lontan{o|a} dalle pareti, forse non ti sentono."
        prova: { attributo: fisico, abilita: furtivita, difficolta: Media }
        successo:
          titolo: In punta di piedi
          testo: |
            Chiudi la lanterna fino a lasciare un filo di luce e attraversi la cisterna nel mezzo, lontano dai
            buchi, mettendo i piedi dove non ci sono ossa. Una testa esce ad annusare, e rientra. Da vicino il
            loro odore è dolciastro e caldo come quello di un pollaio chiuso. Arrivi alla bocca nera sulle
            punte dei piedi, con le dita intorpidite sulla maniglia della lanterna.
          effetti: { profondita.velo-sacca-dell-orlo: 1 }
        fallimento:
          titolo: Le ossa
          testo: |
            A metà cisterna pesti un mucchio di ossa, e lo scricchiolio fa uscire le teste da tutti i buchi
            insieme. Sono più di quante ne avevi contate. Torni indietro di corsa, e uno ti sfiora la caviglia
            con i denti.
          effetti: { ferite: 0.5 }

      - testo: "Gettare un rottame caldo dall'altra parte"
        descrizione: "Un pezzo di lamiera scaldato sulla lanterna li attira. Ci vuole tempo per scaldarlo, e pazienza per aspettare che abbocchino."
        costo: 2
        esito:
          titolo: La lamiera
          testo: |
            Scaldi un pezzo di lamiera sulla fiamma finché non ti brucia le dita attraverso la manica, e lo
            lanci in fondo alla cisterna. Le teste escono tutte da quella parte e dietro le teste i corpi sono
            lunghi più di un braccio. Passi dall'altra parte rasente il muro, e alle tue spalle senti i denti
            sul metallo.
          effetti: { profondita.velo-sacca-dell-orlo: 1 }

  - id: velo-sacca-il-reperto-scartato
    immagine: ambientazione/orlo-dei-rottami
    titolo: Il reperto scartato
    sommario: "In mezzo ai rottami dei Raschiatori c'è un pezzo di macchina dei Precursori che qualcuno ha buttato via. È ancora carico."
    luogo: La sacca sotto l'Orlo, il bordo dei rottami
    area: velo-sacca-dell-orlo
    ripetibile: true
    requisiti: [fazione.velo == 7, profondita.velo-sacca-dell-orlo == 2]
    testo: |
      Qui finiscono i rottami che i Raschiatori buttano dall'Orlo, e il condotto ne è pieno fino a metà. In
      mezzo alle lamiere precuriane piegate qualcosa manda una luce verdina a intermittenza. È un cilindro
      grande come un avambraccio, con una fessura su un lato. Le lamiere intorno sono piegate e schiacciate
      dalla caduta, e il cilindro non ha un'ammaccatura.

      {tecnologia Media} I Raschiatori buttano quello che non sanno aprire. Questo è chiuso e la luce viene da
      dentro, quindi il nucleo è ancora vivo. I bordi della fessura combaciano senza gioco, e non ci
      entrerebbe la punta di un ago.

      Il passaggio continua in salita oltre il mucchio, e per arrivarci bisogna scavalcarlo.
    opzioni:
      - testo: "Prendere il cilindro"
        descrizione: "Se il nucleo è vivo, Oda Krell saprà che farne. Bisogna sfilarlo dai rottami senza farlo cadere."
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Media }
        successo:
          titolo: Il guscio chiuso
          testo: |
            Sfili il cilindro dai rottami un dito alla volta tenendolo dritto, e la luce verdina non si
            spegne. È appena tiepido, e uguale in tutti i punti. Lo avvolgi nella camicia di ricambio e lo
            infili nella bisaccia, dove continua a pulsare contro la tua schiena. Poi scavalchi il mucchio e
            prendi la salita.
          effetti: { profondita.velo-sacca-dell-orlo: 1, reperto.sigillato: 1 }
        fallimento:
          titolo: La scossa
          testo: |
            Afferri il cilindro dal lato sbagliato, e una scossa ti risale il braccio fino ai denti. Lo lasci
            cadere nei rottami, dove la luce si spegne. Resti sedut{o|a} con il braccio intorpidito e la testa
            che ronza. Nell'aria resta un odore di temporale.
          effetti: { tormento: 1 }

      - testo: "Scavalcare i rottami"
        descrizione: "Le lamiere sono taglienti e il mucchio si muove. Si passa, con un po' di equilibrio."
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Media }
        successo:
          titolo: Il mucchio
          testo: |
            Sali sul mucchio piano, provando ogni lamiera con il piede prima di metterci il peso, e scendi
            dall'altra parte senza un graffio. Le lamiere precuriane non danno nessun suono quando ci passi
            sopra. Il cilindro lo lasci dov'è, a lampeggiare per nessuno.
          effetti: { profondita.velo-sacca-dell-orlo: 1 }
        fallimento:
          titolo: La lamiera
          testo: |
            Una lamiera si sposta sotto il tuo peso, e ti apre il palmo da un lato all'altro con un taglio
            così netto che il sangue arriva un momento dopo. Scendi dal mucchio dalla parte da cui eri
            salit{o|a}, con la mano stretta nella manica.
          effetti: { ferite: 0.5 }

      - testo: "Spostare i rottami uno per uno"
        descrizione: "Lento e faticoso, ma sicuro. Il mucchio non ha fretta, e la corda di Walter è lunga."
        costo: 2
        esito:
          titolo: Uno per uno
          testo: |
            Sposti le lamiere una per una e le appoggi contro la parete, finché nel mucchio non si apre un
            passaggio largo quanto le tue spalle. Le più vecchie hanno ancora gli spigoli vivi sotto la
            sporcizia. Hai le braccia di piombo e i palmi neri. In fondo al passaggio il condotto riprende a
            salire.
          effetti: { profondita.velo-sacca-dell-orlo: 1 }

  - id: velo-sacca-l-eco-del-115
    immagine: ambientazione/marea-grigia
    titolo: L'eco del 115
    sommario: "In un condotto laterale un Raschiatore con la lanterna spenta chiama i compagni di una squadra che non tornò mai su."
    luogo: La sacca sotto l'Orlo, un condotto laterale
    area: velo-sacca-dell-orlo
    ripetibile: true
    requisiti: [fazione.velo == 7, profondita.velo-sacca-dell-orlo >= 2, profondita.velo-sacca-dell-orlo <= 3]
    testo: |
      Dal condotto laterale arriva la voce di un uomo che chiama dei nomi uno dopo l'altro con la pausa per la
      risposta, poi ricomincia dal primo. È un Raschiatore con una tuta di un taglio che non si usa da decenni
      e una lanterna spenta in mano. La sua figura è grigia e trasparente ai bordi. I suoi piedi non lasciano
      segni nel fango, e il fango intorno a lui è liscio come se nessuno ci camminasse da anni.

      {resilienza Media} È un'eco della Marea, rimasta qui quando la squadra del 115 non è tornata. Se lo
      ascolti troppo cominci a ripetere anche tu, e già al secondo giro ti accorgi di muovere le labbra.

      {origine apprendista-raschiatore} Sulle piattaforme una lanterna appesa al Ponte dei Morti ricorda
      ancora la squadra del 115, e uno dei nomi che chiama è inciso lì sopra.

      L'eco sta in mezzo al condotto, che è l'unica strada. Il condotto è largo quanto due uomini, e per
      passare devi arrivargli a un palmo.
    opzioni:
      - testo: "Passargli accanto senza ascoltare"
        descrizione: "È un'eco, e ripete. Basta tenere la bocca chiusa quando chiama."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Media }
        successo:
          titolo: I nomi
          testo: |
            Passi accanto all'eco a capo chino, con i nomi che ti scivolano addosso uno dopo l'altro e un
            freddo di cantina sul fianco più vicino a lui. Al quarto ti viene da rispondere, e ti mordi la
            lingua. Quando ti volti, dall'altra parte del condotto, l'eco ha ricominciato dal primo.
          effetti: { profondita.velo-sacca-dell-orlo: 1 }
        fallimento:
          titolo: La risposta
          testo: |
            Al terzo nome rispondi senza volerlo, e la tua voce esce con la stessa cadenza della sua. L'eco si
            volta verso di te con la lanterna spenta alzata. Resti ferm{o|a} con il cuore in gola finché non
            torna a chiamare, poi indietreggi fino al condotto principale.
          effetti: { tormento: 1 }

      - testo: "Recitare l'Esorcismo"
        incantesimo: esorcismo
        descrizione: "Il rito delle cripte scaccia quello che non dovrebbe restare. Questo Raschiatore aspetta da trentacinque anni."
        prova: { attributo: mentale, abilita: magia, difficolta: Media }
        successo:
          titolo: L'ultimo nome
          testo: |
            Reciti il rito a voce bassa, e l'eco si ferma a metà di un nome. La figura si sfilaccia come fumo
            in una corrente, a partire dalla lanterna, e l'ultima cosa che sparisce è la bocca, ancora aperta.
            Nel condotto resta soltanto l'odore della pietra bagnata. Il fango dove stava è liscio e senza
            impronte.
          pe: { magia: 3 }
          effetti: { profondita.velo-sacca-dell-orlo: 1 }
        fallimento:
          titolo: Il rito spezzato
          testo: |
            A metà del rito la voce ti si incrina, e l'eco si volta verso di te con la lanterna alzata. Torni
            nel condotto principale. Per un pezzo continui a sentire i nomi anche dopo la curva, dove la sua
            voce non può più arrivare.
          effetti: { tormento: 1 }

      - testo: "Aspettare che arrivi in fondo all'elenco"
        descrizione: "I nomi sono tanti. Quando li ha detti tutti, forse si ferma un momento."
        costo: 2
        esito:
          titolo: L'elenco
          testo: |
            Ti siedi all'imbocco del condotto e conti i nomi, che al secondo giro sai già in fila senza
            volerlo. Sono ventidue. Dopo l'ultimo l'eco resta in silenzio il tempo di contare fino a tre, con
            la testa voltata verso il buio, e in quel momento gli passi accanto. Alle tue spalle ricomincia
            dal primo.
          effetti: { profondita.velo-sacca-dell-orlo: 1, tormento: 1 }

  # ------------------------------------------------------------ 3 · la galleria asciutta
  - id: velo-sacca-l-aria-fredda
    immagine: ambientazione/orlo-dei-rottami
    titolo: L'aria fredda
    sommario: "Il condotto si fa asciutto, e l'aria cambia. È fredda in un modo che con la stagione non c'entra."
    luogo: La sacca sotto l'Orlo, la galleria asciutta
    area: velo-sacca-dell-orlo
    ripetibile: true
    requisiti: [fazione.velo == 7, profondita.velo-sacca-dell-orlo == 3]
    testo: |
      Il condotto smette di gocciolare, e il fango lascia il posto a una polvere fine. L'aria si fa fredda e
      la fiamma della lanterna si allunga sottile e dritta, senza un tremito. Il fiato ti esce in nuvole
      bianche che restano sospese davanti alla faccia e non si disfano.

      {magia Media} Qui il Mana sta fermo, e l'aria è fredda perché non succede niente.

      Dall'alto la corda di Walter dà tre strappi brevi e poi altri tre. Il segnale per risalire è un altro.
      Ti dici che è soltanto Walter che cambia presa lassù, con le braccia stanche dopo tante ore, e te lo
      ripeti mentre la corda torna immobile fra le dita.

      {origine accolito-del-velo} In Cripta, sotto l'altare, c'è un punto dove l'aria è così. I novizi ci
      passavano in fretta senza parlarne, e tu con loro.
    opzioni:
      - testo: "Andare avanti nel freddo"
        descrizione: "Il freddo non morde e non ferisce. Bisogna soltanto convincersene."
        prova: { attributo: mentale, abilita: [resilienza, magia], difficolta: Media }
        successo:
          titolo: Il punto fermo
          testo: |
            Cammini nel freddo contando i passi, e verso il duecentesimo smetti di sentirlo. In fondo alla
            galleria l'aria umida torna a muoversi, e ti accorgi di avere i capelli pieni di brina. La corda
            di Walter si tende di nuovo, normale.
          effetti: { profondita.velo-sacca-dell-orlo: 1 }
        fallimento:
          titolo: Tre strappi
          testo: |
            A metà galleria ti fermi, e non riesci più a ripartire. Il freddo è entrato nelle ginocchia e
            nella testa e i pensieri ti arrivano lenti e uno per volta. Tiri la corda tre volte, e Walter ti
            tira indietro fino all'imbocco, con una delicatezza che non ti aspettavi da quelle mani.
          effetti: { tormento: 1 }

      - testo: "Rispondere ai tre strappi"
        descrizione: "Tre strappi, e poi altri tre. Se è Walter che chiama, conviene saperlo."
        prova: { attributo: mentale, abilita: percezione, difficolta: Media }
        successo:
          titolo: Il segnale
          testo: |
            Rispondi con due strappi, il segnale per dire che stai bene. Aspetti tanto che le dita ti si
            intorpidiscono sulla canapa. Dall'alto arrivano tre strappi lenti, poi uno. Walter ti sta dicendo
            di proseguire, e di fare piano. Attraversi il freddo tenendo la corda con una mano, come un
            corrimano.
          effetti: { profondita.velo-sacca-dell-orlo: 1 }
        fallimento:
          titolo: Il segnale sbagliato
          testo: |
            Rispondi con tre strappi, e Walter ti tira su di dieci braccia prima che tu riesca a fermarlo. Ti
            ritrovi nel condotto di prima, con la corda che ti segna la vita e la polvere della galleria
            ancora sulle ginocchia.
          effetti: { ferite: 0.5 }

      - testo: "Accendere una seconda candela"
        descrizione: "Due fiamme scaldano più di una, e la seconda la tieni di riserva. Si va piano."
        costo: 2
        esito:
          titolo: Due fiamme
          testo: |
            Accendi un moccolo alla fiamma della lanterna e lo tieni nell'altra mano. Le due fiamme sottili si
            allungano insieme verso il fondo della galleria, e tu le segui passo dopo passo finché l'aria non
            torna a muoversi. Il moccolo si consuma fino alle dita, e la cera che ti cola sul pollice si
            rapprende subito.
          effetti: { profondita.velo-sacca-dell-orlo: 1 }

  - id: velo-sacca-le-impronte
    immagine: ambientazione/orlo-dei-rottami
    titolo: Le impronte
    sommario: "Nella polvere della galleria ci sono impronte di sandali, e accanto, a intervalli regolari, gocce di cera."
    luogo: La sacca sotto l'Orlo, la galleria asciutta
    area: velo-sacca-dell-orlo
    ripetibile: true
    requisiti: [fazione.velo == 7, profondita.velo-sacca-dell-orlo == 3]
    testo: |
      Nella polvere della galleria ci sono molte impronte una sopra l'altra, tutte della stessa misura. Sono
      dei sandali di corda che il Velo dà ai sacerdoti. La polvere è così fine che nella trama si contano i
      fili. Vanno e tornano sulla stessa linea, e accanto ci sono gocce di cera bianca, grigie di polvere le
      più vecchie e lucide le più nuove. Nella polvere non c'è nessun'altra traccia, nemmeno la zampa di un
      topo.

      {medicina Difficile} Il passo è corto e il piede destro strascica, come per un ginocchio malato da anni.
      Il bordo destro di ogni impronta è smussato dove il sandalo ha strisciato prima di posarsi.

      Più avanti una frana chiude la galleria, e le impronte ci girano intorno a destra, dove c'è un varco.
    opzioni:
      - testo: "Seguire le impronte"
        descrizione: "Chi passa di qui sa dove andare. Le impronte portano dove porta lui."
        prova: { attributo: mentale, abilita: percezione, difficolta: Media }
        successo:
          titolo: Il varco
          testo: |
            Segui le impronte rasente la frana e passi dal varco, dove sulla pietra c'è una macchia di cera
            più grande delle altre, larga come un palmo e fatta di colature sovrapposte. Qui qualcuno si ferma
            ogni volta per appoggiare la candela. Oltre il varco il condotto si apre, e senti l'odore della
            sacca.
          effetti: { profondita.velo-sacca-dell-orlo: 1 }
        fallimento:
          titolo: La frana
          testo: |
            Le impronte ti si confondono una sull'altra, e segui quelle sbagliate, che finiscono contro la
            frana. Mentre cerchi un appiglio una pietra si stacca e ti prende sulla spalla. La polvere che
            solleva resta a lungo sospesa nell'aria ferma.
          effetti: { ferite: 0.5 }

      - testo: "Raccogliere le gocce di cera"
        descrizione: "Una candela del Velo ha la cera bianca dei laboratori della Cattedrale. Le gocce dicono da quanto tempo passa di qui."
        prova: { attributo: mentale, abilita: [natura, accademiche], difficolta: Media }
        successo:
          titolo: Dieci anni
          testo: |
            Conti gli strati di cera grigia sulle gocce più vecchie, come gli anelli di un albero, e ti fermi
            quando hai finito le dita delle due mani. Dieci anni di candele, sullo stesso sentiero. Metti in
            tasca una goccia nuova che non ha ancora preso la polvere e segui la cera fino al varco.
          effetti: { profondita.velo-sacca-dell-orlo: 1 }
        fallimento:
          titolo: La cera
          testo: |
            Le gocce si sbriciolano fra le dita, e la polvere che sollevi ti entra negli occhi. Quando torni a
            vederci la galleria ti sembra più lunga di prima e la fiamma della lanterna più bassa.
          effetti: { tormento: 1 }

      - testo: "Cercare il varco a tastoni"
        descrizione: "Una frana ha sempre un varco, se si ha la pazienza di cercarlo."
        costo: 2
        esito:
          titolo: A tastoni
          testo: |
            Passi le mani su tutta la frana, pietra per pietra, finché a destra non trovi il vuoto. È stretto,
            e ci passi di fianco con la lanterna sopra la testa e le pietre che ti grattano il petto.
            Dall'altra parte senti l'odore dolce di frutta marcia che viene dalla sacca.
          effetti: { profondita.velo-sacca-dell-orlo: 1 }

  # ------------------------------------------------------------ il cuore · la sacca
  - id: velo-la-sacca
    immagine: ambientazione/marea-grigia
    titolo: La sacca
    sommario: "In fondo alla galleria la terra ha ceduto, e c'è una conca di fango grigio che respira. Accanto, nella parete, c'è una cassetta di latta."
    luogo: La sacca sotto l'Orlo, il fondo
    area: velo-sacca-dell-orlo
    requisiti: [fazione.velo == 7, profondita.velo-sacca-dell-orlo >= 4]
    testo: |
      In fondo alla galleria la terra ha ceduto, e il pavimento finisce sul bordo di una conca piena di fango
      grigio. Il fango ha la superficie liscia e opaca del piombo, e ogni tanto si gonfia in una bolla lenta
      che scoppia e lascia nell'aria un odore dolce di frutta marcia. Sul bordo è piantato un picchetto di
      ferro con un anello per legare la corda.

      {natura Difficile} È una sacca di Marea alimentata dal basso, che non si svuota mai. Se il bollettino
      non la segna, fra un anno il fango arriva ai condotti e fra due nelle cantine della Città Bassa.

      In una nicchia asciutta dall'altra parte ci sono delle lamiere precuriane appoggiate con cura una contro
      l'altra, e sotto spunta l'angolo di una cassetta di latta. La latta non ha un punto di ruggine, in un
      posto dove le grate del Velo sono diventate ruggine in pochi anni.

      Il fango si gonfia più vicino al bordo, e stavolta la bolla non scoppia. Ne esce una cosa grande come un
      cane, fatta di ossa di topo e pezzi di lamiera tenuti insieme dal grigio. Ha una testa senza occhi
      girata verso la lanterna, e quando sposti la lanterna la testa la segue.

      {rissa Media} Si muove a scatti, e va colpita quando si ferma fra uno scatto e l'altro. Ogni scatto
      finisce con un colpo di lamiera sulla pietra, e subito dopo il colpo resta ferma.
    opzioni:
      - testo: "Affrontare il nato della sacca"
        descrizione: "È fatto di rottami e di Marea, e protegge la sacca come un cane la ciotola. Per misurarla bisogna toglierlo di mezzo."
        combattimento: velo-il-nato-della-sacca
        vittoria:
          titolo: Il grigio che torna grigio
          testo: |
            Il nato si sfascia all'ultimo colpo, e le ossa di topo ricadono nel fango, che se le riprende con
            una bolla lenta. Le lamiere restano a galla ancora un poco e poi vanno giù anche loro, di taglio.
            Hai le mani che tremano e un taglio sul braccio, e il picchetto davanti a te. Tiri la corda di
            Walter per dirgli di darti tutta la lunghezza.
          segue: velo-la-corda-al-cristallo
        sconfitta:
          titolo: Tre strappi
          testo: |
            Il nato ti butta a terra sul bordo della conca, e il fango ti arriva alla bocca. È tiepido e sa di
            frutta marcia. Tiri la corda tre volte. Mentre Walter ti tira via la mano sinistra trova l'angolo
            della cassetta sotto le lamiere, e la stringe. Arrivi al pozzo trascinat{o|a} sulla schiena, con
            la cassetta contro il petto e la sacca senza misura.
          effetti: { fazione.velo: 1, rep.velo: 1, velo.lettere: 1, velo.moneta: 1, contaminazione: 1.5 }
          imposta: { velo.sacca: 2 }
          vai: citta-bassa

      - testo: "Tenerlo lontano con l'Esorcismo"
        incantesimo: esorcismo
        descrizione: "Il rito delle cripte scaccia quello che non dovrebbe esserci. Laggiù, con il fango che si gonfia, ci vuole una voce ferma."
        prova: { attributo: mentale, abilita: magia, difficolta: Difficile }
        successo:
          titolo: La voce ferma
          testo: |
            Reciti il rito con la lanterna alta, e il nato si ferma a mezzo scatto. Ogni parola lo spinge
            indietro di un palmo con uno stridio di lamiera sulla pietra, finché non affonda nel fango da cui
            è uscito. Sul punto dove è sparito sale ancora una bolla, e poi il fango torna liscio. Il
            picchetto è libero. Tiri la corda di Walter per dirgli di darti tutta la lunghezza.
          pe: { magia: 5 }
          segue: velo-la-corda-al-cristallo
        fallimento:
          titolo: La voce rotta
          testo: |
            A metà del rito la voce ti si rompe, e il nato ti è addosso. Le ossa di topo ti premono sul collo
            leggere e fredde. Tiri la corda tre volte, e mentre Walter ti tira via la mano sinistra trova
            l'angolo della cassetta sotto le lamiere. Arrivi al pozzo con la cassetta contro il petto, la
            tonaca piena di fango e la sacca senza misura.
          effetti: { fazione.velo: 1, rep.velo: 1, velo.lettere: 1, velo.moneta: 1, contaminazione: 1.5, tormento: 1 }
          imposta: { velo.sacca: 2 }
          vai: citta-bassa

      - testo: "Prendere la cassetta e tornare su"
        descrizione: "Il nato guarda la lanterna. Se la posi dall'altra parte, la nicchia si raggiunge al buio, e la sacca resta senza misura."
        prova: { attributo: fisico, abilita: furtivita, difficolta: Media }
        successo:
          titolo: Al buio
          testo: |
            Posi la lanterna sul bordo della conca e ti allontani al buio, rasente la parete. Il nato si gira
            verso la luce, e nel buio senti le sue lamiere battere sulla pietra a ogni scatto. Trovi la
            nicchia a tastoni, sfili la cassetta da sotto le lamiere e tiri la corda tre volte. Walter ti
            porta su piano. La sacca resta laggiù a gonfiarsi senza che nessuno l'abbia misurata.
          pe: { furtivita: 5 }
          effetti: { fazione.velo: 1, rep.velo: 1, velo.lettere: 1, velo.moneta: 1, contaminazione: 1 }
          imposta: { velo.sacca: 2 }
          vai: citta-bassa
        fallimento:
          titolo: La lamiera
          testo: |
            Una lamiera ti scivola dalle dita e cade sulla pietra con un rumore di campana, che la galleria ti
            rimanda due volte. Il nato si volta. Hai appena il tempo di stringere la cassetta e tirare la
            corda, e Walter ti tira via mentre qualcosa ti morde la caviglia. Arrivi al pozzo con la cassetta
            stretta al petto e la sacca senza misura, e sulla caviglia gonfia hai il segno di denti piccoli e
            fitti.
          effetti: { fazione.velo: 1, rep.velo: 1, velo.lettere: 1, velo.moneta: 1, contaminazione: 1, ferite: 1 }
          imposta: { velo.sacca: 2 }
          vai: citta-bassa

  - id: velo-la-corda-al-cristallo
    immagine: ambientazione/marea-grigia
    titolo: La corda al cristallo
    tipo: seguito
    luogo: La sacca sotto l'Orlo, il bordo della conca
    area: velo-sacca-dell-orlo
    requisiti: [fazione.velo == 7, profondita.velo-sacca-dell-orlo >= 4]
    testo: |
      Leghi la corda all'anello del picchetto e la cali nel fango un braccio alla volta, e i frammenti di
      cristallo spariscono sotto la superficie. Il fango si chiude sopra ognuno senza fare un'onda. Quando la
      tiri su ogni frammento dirà il colore della Marea alla sua profondità, e il numero dei grigi è la misura
      che va sul bollettino.

      {natura Media} La corda va calata e tirata su dritta, perché se striscia contro il bordo i cristalli si
      colorano a caso.

      Il vapore sale dal fango in fili sottili e ti brucia gli occhi quando ti chini sul bordo. A venti
      braccia senti il fondo, o qualcosa che fa finta di esserlo. La corda si posa e resta ferma, e poi scende
      ancora di un palmo e si ferma di nuovo.

      {accademiche Facile} Nei bollettini del Santuario nessuno ha mai scritto più di sei frammenti grigi in
      quarant'anni.
    opzioni:
      - testo: "Tirare su la corda dritta"
        descrizione: "Venti braccia di corda bagnata, a mani nude, senza farla strisciare. Poi si contano i grigi."
        prova: { attributo: mentale, abilita: [natura, accademiche], difficolta: Difficile }
        successo:
          titolo: Nove grigi
          testo: |
            Tiri su la corda dritta un braccio alla volta, con i palmi che bruciano. La corda esce dal fango
            tiepida e coperta di una pellicola grigia che non cola. I frammenti escono uno dopo l'altro e
            sempre più scuri, finché non restano soltanto i grigi. Ne conti nove. Poi vai alla nicchia e
            prendi la cassetta, che pesa più di quanto dovrebbe una cassetta vuota. Walter ti porta su piano.
            Al pozzo gli dici il numero, e lui chiude gli occhi.
          pe: { natura: 5 }
          effetti: { fazione.velo: 1, rep.velo: 1, velo.lettere: 1, velo.moneta: 1, reliquie.scheggia: 1 }
          imposta: { velo.sacca: 1 }
          vai: citta-bassa
        fallimento:
          titolo: La corda che striscia
          testo: |
            A metà la corda ti scivola e striscia contro il bordo, e i frammenti escono tutti dello stesso
            grigio sporco che non vuol dire niente. Il vapore che sale dal fango ti brucia la gola, e per
            tutta la risalita hai in bocca il sapore dolce della frutta marcia. Prendi la cassetta dalla
            nicchia e tiri tre volte. Al pozzo dici a Walter che la misura non vale, e lui ti mette una mano
            sulla spalla.
          effetti: { fazione.velo: 1, rep.velo: 1, velo.lettere: 1, velo.moneta: 1, contaminazione: 1.5 }
          imposta: { velo.sacca: 2 }
          vai: citta-bassa

      - testo: "Tirarla su palmo a palmo, con Walter"
        descrizione: "Dall'alto Walter può tenere la corda tesa mentre tu la guidi."
        costo: 2
        esito:
          titolo: Palmo a palmo
          testo: |
            Walter tiene la corda tesa dall'alto, e tu la guidi fuori dal fango palmo a palmo, piegat{o|a} sul
            bordo della conca con il vapore in faccia. Ci vuole un'ora, e a metà le braccia ti tremano tanto
            che devi fermarti con la corda puntata contro la coscia. I frammenti grigi sono nove. Prendi la
            cassetta dalla nicchia, e Walter ti porta su piano. Al pozzo gli dici il numero, e lui chiude gli
            occhi.
          pe: { resilienza: 5 }
          effetti: { fazione.velo: 1, rep.velo: 1, velo.lettere: 1, velo.moneta: 1, reliquie.scheggia: 1, contaminazione: 1 }
          imposta: { velo.sacca: 1 }
          vai: citta-bassa
