# La sacca sotto l'Orlo, spedizione del passo 8 della quest del Velo (fazione.velo == 7). Ci si entra dal pozzo di scolo
# dietro la baracca di Grusk (velo-il-pozzo-di-scolo, in passi-2.yaml), con Padre Walter che tiene la corda dall'alto.
# Le stanze chiedono tutte fazione.velo == 7 e vanno in fasce di profondità; una stanza superata non ricompare nella
# stessa visita:
# 0 la discesa (i pioli; gli spazzini della notte, che valgono anche a 1), 1 i condotti della Prima Breccia (le grate
# con i sigilli del 115; i vapori azzurrastri, che valgono anche a 2), 2 il bordo della sacca (i nidi dei vermi
# carogna; il reperto scartato; l'eco del Raschiatore del 115, che vale anche a 3), 3 la galleria asciutta (l'aria
# fredda; le impronte). Il cuore a 4 è la sacca, con il nato della sacca: batterlo o tenerlo lontano con l'Esorcismo
# apre il seguito della corda al cristallo, dove la sacca si misura (velo.sacca 1). Chi esce con la sola cassetta la
# lascia fuori dal bollettino (velo.sacca 2). In ogni ramo trovi le lettere e il disco, e il passo si chiude.
aree:
  - id: velo-sacca-dell-orlo
    immagine: ambientazione/orlo-dei-rottami
    nome: La sacca sotto l'Orlo
    sommario: "Sotto la spiaggia dei rottami corrono i condotti da cui nel 115 salì la Marea, fino alla sacca che manca dal bollettino."
    spedizione: { ritorno: citta-bassa, soglia: 4, stanze: 3 }
    testo: |
      Sotto l'Orlo dei Rottami la Città Bassa ha scaricato per cinquant'anni
      quello che non voleva più vedere. Il pozzo di scolo scende fra muri di
      mattoni rossi fino ai condotti della Prima Breccia, tubi di pietra
      larghi come una stanza da cui nel 115 salì la Marea, chiusi dal Velo
      con grate e sigilli ormai arrugginiti. Dall'alto arriva la corda di
      Walter, che ti tiene per la vita.

storylet:
  # ------------------------------------------------------------ 0 · la discesa
  - id: velo-sacca-i-pioli
    immagine: ambientazione/orlo-dei-rottami
    titolo: I pioli
    sommario: "La scala del pozzo di scolo scende per cento pioli nel buio, e la ruggine se n'è mangiati parecchi."
    luogo: La sacca sotto l'Orlo, il pozzo di scolo
    area: velo-sacca-dell-orlo
    ripetibile: true
    requisiti: [fazione.velo == 7, profondita.velo-sacca-dell-orlo == 0]
    testo: |
      La ruggine ha mangiato più pioli di quanti ne abbia lasciati, e alcuni
      si piegano sotto il piede. Walter ti aspetta già al primo
      pianerottolo, con la lanterna alla cintura e la corda che sale dritta
      verso il cerchio di cielo.

      {atletica Media} Sui mattoni ci sono incavi lucidi dove qualcuno mette
      i piedi al posto dei pioli mancanti, e chi scende di qui lo fa spesso.
    opzioni:
      - testo: "Scendere piolo per piolo"
        descrizione: "I piedi negli incavi e le mani sui pioli buoni, con la corda di Walter pronta a tendersi."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Media }
        successo:
          titolo: Il pianerottolo
          testo: |
            Trovi gli incavi uno dopo l'altro, e al pianerottolo Walter ti posa
            sulla spalla una mano pesante e ti indica il primo condotto.
          effetti: { profondita.velo-sacca-dell-orlo: 1 }
        fallimento:
          titolo: Il piolo
          testo: |
            Un piolo ti resta in mano, e scivoli per tre braccia prima che la
            corda di Walter ti fermi con uno strattone alla vita. Lui ti tira su
            fino all'ultimo piolo sicuro senza dire niente.
          effetti: { ferite: 0.5 }

      - testo: "Farti calare da Walter"
        descrizione: "Walter ha le braccia di uno scaricatore e può calarti nel cappio della corda, ma ci vuole tempo."
        costo: 2
        esito:
          titolo: Il cappio
          testo: |
            Seduto nel cappio come su un'altalena, scendi un braccio alla volta
            mentre Walter conta sottovoce, e arrivi con le gambe intorpidite.
          effetti: { profondita.velo-sacca-dell-orlo: 1 }

  - id: velo-sacca-gli-spazzini
    immagine: personaggi/grusk
    titolo: Gli spazzini della notte
    sommario: "In fondo al pozzo due spazzini senza licenza contrattano cristalli sterili alla luce di una lanterna cieca."
    luogo: La sacca sotto l'Orlo, il fondo del pozzo
    area: velo-sacca-dell-orlo
    ripetibile: true
    requisiti: [fazione.velo == 7, profondita.velo-sacca-dell-orlo <= 1]
    testo: |
      In fondo al pozzo, su un fango di ruggine e cocci, due uomini
      contrattano alla luce di una lanterna cieca una fila di cristalli
      sterili. Quando li illumini si alzano con i ganci.

      {conoscenze-della-strada Media} Spazzini senza licenza, e i cristalli
      sterili si vendono a peso agli alchimisti del Mercato delle Ombre.

      «Il Velo» dice il più vecchio, guardando la tua tonaca. «Non abbiamo
      niente da purificare.» Il più giovane ha già fatto un passo verso il
      buio del condotto.

      {origine mercante-dei-ponti} Dalla prima offerta senti che si stanno
      facendo un prezzo da ladri tutti e due.
    opzioni:
      - testo: "Dirgli che non sei qui per loro"
        descrizione: "Il Velo cerca una sacca, e se ti credono ti dicono anche dove si passa."
        prova: { attributo: sociale, abilita: [politica-ed-economia, persuasione], difficolta: Media }
        successo:
          titolo: Il passaggio buono
          testo: |
            Gli spieghi che cerchi la sacca e non loro. Il vecchio ti indica con
            il gancio il condotto di sinistra, dove si passa all'asciutto e dove
            di notte scende uno con la tonaca grigia che loro lasciano passare
            senza guardarlo.
          pe: { politica-ed-economia: 3 }
          effetti: { profondita.velo-sacca-dell-orlo: 1 }
        fallimento:
          titolo: Il gancio
          testo: |
            Il vecchio non ti crede. Raccoglie il sacco e sparisce nel condotto
            con il giovane dietro, e resti al buio con il fango fino alle
            caviglie.
          effetti: { tormento: 1 }

      - testo: "Affrontarli"
        descrizione: "Hanno i ganci e conoscono il buio, ma di soldati hanno poco."
        combattimento: velo-gli-spazzini
        vittoria:
          titolo: I cristalli sterili
          testo: |
            Il giovane scappa per primo, e il vecchio gli va dietro zoppicando. Ti
            metti in tasca un paio di cristalli sterili rimasti sul sacco.
          effetti: { profondita.velo-sacca-dell-orlo: 1, cristalli.cristallo-sterile: 2 }
        sconfitta:
          titolo: Il fango
          testo: |
            Un gancio ti prende sulla spalla e un altro sulla caviglia, e gli
            spazzini se ne vanno con il sacco mentre ti rialzi dal fango.
          effetti: { tormento: 1 }

      - testo: "Aspettare che se ne vadano"
        descrizione: "Prima o poi il prezzo lo trovano, basta spegnere la lanterna e stare fermi."
        costo: 2
        esito:
          titolo: Al buio
          testo: |
            Spegni la lanterna e ti appiattisci contro i mattoni, e dopo un'ora
            gli spazzini spariscono in un condotto laterale.
          effetti: { profondita.velo-sacca-dell-orlo: 1 }

  # ------------------------------------------------------------ 1 · i condotti della Prima Breccia
  - id: velo-sacca-le-grate
    immagine: ambientazione/orlo-dei-rottami
    titolo: Le grate del 115
    sommario: "Il condotto è chiuso da una grata con i sigilli del Velo del 115, che qualcuno ha aperto e richiuso con cura."
    luogo: La sacca sotto l'Orlo, i condotti della Prima Breccia
    area: velo-sacca-dell-orlo
    ripetibile: true
    requisiti: [fazione.velo == 7, profondita.velo-sacca-dell-orlo == 1]
    testo: |
      Il condotto è chiuso da una grata di ferro piena di sigilli di piombo
      con l'Albero del Velo e la data del 115, l'anno della Prima Breccia.
      Alcuni sono rotti, altri nuovi, di un piombo ancora chiaro, con la
      stessa data incisa dalla stessa mano. La catena ha un lucchetto nuovo e
      un velo d'olio sulle maglie.

      {accademiche Media} I sigilli del Velo si rompono una volta sola. Chi li
      ha rifatti teneva da parte il punzone del 115 da trentacinque anni.
    opzioni:
      - testo: "Leggere i sigilli"
        descrizione: "Un sigillo rifatto dice chi l'ha messo, e perché."
        prova: { attributo: mentale, abilita: [accademiche, percezione], difficolta: Media }
        successo:
          titolo: Il punzone
          testo: |
            Sotto la data dei sigilli nuovi c'è il segno del punzone dei cronisti,
            un righello con due tacche, lo stesso dei registri del chiostro. Il
            lucchetto si apre con la chiave dei pozzi che ti ha dato Walter, e la
            grata gira senza un cigolio.
          pe: { accademiche: 3 }
          effetti: { profondita.velo-sacca-dell-orlo: 1 }
        fallimento:
          titolo: Il piombo
          testo: |
            Il piombo di un sigillo si stacca sotto l'unghia e cade nel fango, e
            quando lo ritrovi è spezzato in due.
          effetti: { tormento: 1 }

      - testo: "Forzare il lucchetto"
        descrizione: "Il lucchetto è nuovo e oliato, e una lama al punto giusto lo apre."
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Media }
        successo:
          titolo: Il lucchetto oliato
          testo: |
            Giri la punta del coltello nella serratura finché qualcosa scatta, e
            richiudi il lucchetto alle tue spalle perché chi passa non si accorga
            di te.
          pe: { tecnologia: 3 }
          effetti: { profondita.velo-sacca-dell-orlo: 1 }
        fallimento:
          titolo: La punta
          testo: |
            La punta del coltello si spezza dentro la serratura, e chiunque passi
            stanotte saprà che qualcuno ci ha provato.
          effetti: { tormento: 1 }

      - testo: "Passare dal tubo di scolo"
        descrizione: "Accanto alla grata c'è un tubo di scolo largo quanto le spalle."
        costo: 2
        esito:
          titolo: Il tubo
          testo: |
            Strisci nel tubo a gomiti e ginocchia ed esci oltre la grata coperto
            di una melma grigia che odora di cantina.
          effetti: { profondita.velo-sacca-dell-orlo: 1, contaminazione: 1 }

  - id: velo-sacca-i-vapori
    immagine: ambientazione/marea-grigia
    titolo: I vapori azzurrastri
    sommario: "Nel condotto galleggia un vapore azzurrastro all'altezza del petto, lo stesso che nel 115 salì dai pozzi."
    luogo: La sacca sotto l'Orlo, un condotto in discesa
    area: velo-sacca-dell-orlo
    ripetibile: true
    requisiti: [fazione.velo == 7, profondita.velo-sacca-dell-orlo >= 1, profondita.velo-sacca-dell-orlo <= 2]
    testo: |
      A metà della curva del condotto un vapore azzurrastro galleggia
      all'altezza del petto, sottile come il fumo di una pipa, e si muove
      verso il calore della lanterna. Sotto, il pavimento è asciutto, e sopra,
      contro la volta, l'aria è limpida.

      {natura Media} È Marea Grigia nella sua forma più leggera. Nel 115 ne
      bastò una notte per mandare centinaia di persone al Santuario.

      {origine apprendista-raschiatore} Sulle piattaforme ti hanno insegnato
      ridendo che il vapore azzurro si passa sotto, carponi. Nessuno di quelli
      che ridevano lo aveva mai visto.
    opzioni:
      - testo: "Passare senza prendere aria"
        descrizione: "Una trentina di passi dentro il vapore, e la Marea resta fuori se il fiato regge."
        prova: { attributo: fisico, abilita: [resistenza, atletica], difficolta: Media }
        successo:
          titolo: Trenta passi
          testo: |
            Attraversi il vapore a passo svelto con i polmoni pieni, e dall'altra
            parte, con le tempie che battono, prendi aria pulita.
          effetti: { profondita.velo-sacca-dell-orlo: 1 }
        fallimento:
          titolo: Sapore di ferro
          testo: |
            A metà strada il fiato finisce, e torni indietro tossendo con un
            sapore di moneta sotto la lingua.
          effetti: { contaminazione: 1 }

      - testo: "Passare sotto, carponi"
        descrizione: "Sotto il vapore il pavimento è pulito, basta stare bassi."
        prova: { attributo: fisico, abilita: [acrobazia, furtivita], difficolta: Media }
        successo:
          titolo: Carponi
          testo: |
            Strisci sotto il vapore con il mento che sfiora la pietra e la
            lanterna spinta avanti, e dall'altra parte ti rialzi con le ginocchia
            indolenzite.
          effetti: { profondita.velo-sacca-dell-orlo: 1 }
        fallimento:
          titolo: La testa alta
          testo: |
            A metà alzi la testa per vedere quanto manca, e il vapore ti entra nel
            naso. Torni indietro tossendo.
          effetti: { contaminazione: 1 }

      - testo: "Aspettare che il vapore si alzi"
        descrizione: "Il vapore sale verso la lanterna, e spegnendola forse si alza abbastanza."
        costo: 2
        esito:
          titolo: Al buio
          testo: |
            Aspetti al buio finché il vapore non sale verso la volta, e quando
            passi l'azzurro ti sta sopra come un soffitto basso.
          effetti: { profondita.velo-sacca-dell-orlo: 1, contaminazione: 1 }

  # ------------------------------------------------------------ 2 · il bordo della sacca
  - id: velo-sacca-i-nidi
    immagine: bestiario/verme-carogna
    titolo: I nidi
    sommario: "Il condotto si allarga in una cisterna con le pareti piene di buchi, e in ogni buco qualcosa si muove."
    luogo: La sacca sotto l'Orlo, una cisterna sul bordo
    area: velo-sacca-dell-orlo
    ripetibile: true
    requisiti: [fazione.velo == 7, profondita.velo-sacca-dell-orlo == 2]
    testo: |
      Il condotto sbocca in una cisterna rotonda con le pareti bucate come
      una forma di formaggio. Da qualche buco esce una testa cieca e bianca
      che annusa l'aria e si ritira, e sul fondo c'è un mucchio di ossa
      piccole spolpate con cura. L'uscita è una bocca di pietra nera a venti
      passi.

      {natura Facile} Vermi carogna. Sentono il calore più che il rumore, e
      la lanterna è la cosa più calda della cisterna.
    opzioni:
      - testo: "Aprirti la strada"
        descrizione: "Sono ciechi e lenti a capire, e due si possono stendere."
        combattimento: vermi-carogna
        vittoria:
          titolo: La bocca nera
          testo: |
            Il secondo verme si ritira nel buco con un sibilo, e attraversi la
            cisterna di corsa fino alla bocca nera.
          effetti: { profondita.velo-sacca-dell-orlo: 1 }
        sconfitta:
          titolo: I denti
          testo: |
            Un verme ti si attacca al polpaccio, e quando lo stacchi ne sono
            usciti altri tre. Torni nel condotto zoppicando.
          effetti: { tormento: 1 }

      - testo: "Passare con la lanterna schermata"
        descrizione: "Con la lanterna chiusa e lontano dalle pareti, forse non ti sentono."
        prova: { attributo: fisico, abilita: furtivita, difficolta: Media }
        successo:
          titolo: In punta di piedi
          testo: |
            Con un filo di luce attraversi la cisterna nel mezzo, lontano dai
            buchi. Una testa esce ad annusare e rientra, e arrivi alla bocca nera
            sulle punte dei piedi.
          effetti: { profondita.velo-sacca-dell-orlo: 1 }
        fallimento:
          titolo: Le ossa
          testo: |
            A metà pesti un mucchio di ossa, e le teste escono da tutti i buchi
            insieme. Torni indietro di corsa, con un morso sfiorato alla caviglia.
          effetti: { ferite: 0.5 }

      - testo: "Gettare un rottame caldo dall'altra parte"
        descrizione: "Un pezzo di lamiera scaldato sulla lanterna li attira, ma ci vuole pazienza."
        costo: 2
        esito:
          titolo: La lamiera
          testo: |
            Scaldi una lamiera sulla fiamma e la lanci in fondo alla cisterna. Le
            teste escono tutte da quella parte, e passi rasente il muro opposto.
          effetti: { profondita.velo-sacca-dell-orlo: 1 }

  - id: velo-sacca-il-reperto-scartato
    immagine: ambientazione/orlo-dei-rottami
    titolo: Il reperto scartato
    sommario: "In mezzo ai rottami dei Raschiatori c'è un pezzo di macchina dei Precursori ancora carico."
    luogo: La sacca sotto l'Orlo, il bordo dei rottami
    area: velo-sacca-dell-orlo
    ripetibile: true
    requisiti: [fazione.velo == 7, profondita.velo-sacca-dell-orlo == 2]
    testo: |
      Qui finiscono i rottami che i Raschiatori buttano dall'Orlo, e il
      condotto ne è pieno fino a metà. In mezzo, un cilindro grande come un
      avambraccio manda una luce verdina a intermittenza, come una lucciola
      stanca. Il passaggio continua in salita oltre il mucchio.

      {tecnologia Media} I Raschiatori buttano quello che non sanno aprire.
      Questo è chiuso, e la luce viene da dentro, quindi il nucleo è ancora
      vivo.
    opzioni:
      - testo: "Prendere il cilindro"
        descrizione: "Se il nucleo è vivo Oda Krell saprà che farne, purché non cada."
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Media }
        successo:
          titolo: Il guscio chiuso
          testo: |
            Sfili il cilindro dai rottami un dito alla volta e lo avvolgi nella
            camicia di ricambio. Nella bisaccia continua a pulsare contro la tua
            schiena.
          effetti: { profondita.velo-sacca-dell-orlo: 1, reperto.sigillato: 1 }
        fallimento:
          titolo: La scossa
          testo: |
            Afferri il cilindro dal lato sbagliato, e una scossa ti risale il
            braccio fino ai denti. Cade nei rottami e la luce si spegne.
          effetti: { tormento: 1 }

      - testo: "Scavalcare i rottami"
        descrizione: "Le lamiere sono taglienti e il mucchio si muove, ma si passa."
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Media }
        successo:
          titolo: Il mucchio
          testo: |
            Provi ogni lamiera con il piede prima di metterci il peso e scendi
            dall'altra parte senza un graffio, lasciando il cilindro a lampeggiare
            per nessuno.
          effetti: { profondita.velo-sacca-dell-orlo: 1 }
        fallimento:
          titolo: La lamiera
          testo: |
            Una lamiera si sposta sotto il tuo peso e ti apre il palmo. Torni giù
            dalla parte da cui eri salito, con la mano stretta nella manica.
          effetti: { ferite: 0.5 }

      - testo: "Spostare i rottami uno per uno"
        descrizione: "Lento e faticoso ma sicuro, e la corda di Walter è lunga."
        costo: 2
        esito:
          titolo: Uno per uno
          testo: |
            Sposti le lamiere una per una finché si apre un passaggio largo quanto
            le spalle, e ci passi con le braccia di piombo e i palmi neri.
          effetti: { profondita.velo-sacca-dell-orlo: 1 }

  - id: velo-sacca-l-eco-del-115
    immagine: ambientazione/marea-grigia
    titolo: L'eco del 115
    sommario: "In un condotto laterale un Raschiatore con la lanterna spenta chiama i compagni di una squadra che non tornò mai su."
    luogo: La sacca sotto l'Orlo, un condotto laterale
    area: velo-sacca-dell-orlo
    ripetibile: true
    requisiti: [fazione.velo == 7, profondita.velo-sacca-dell-orlo >= 2, profondita.velo-sacca-dell-orlo <= 3]
    testo: |
      Dal condotto laterale arriva una voce d'uomo che chiama dei nomi uno
      dopo l'altro, con la pausa per la risposta, e poi ricomincia dal primo.
      È un Raschiatore con una tuta di un taglio che non si usa da decenni e
      una lanterna spenta, trasparente ai bordi, fermo in mezzo all'unica
      strada.

      {resilienza Media} È un'eco della Marea, rimasta qui quando la squadra
      del 115 non è tornata, e se lo ascolti troppo cominci a ripetere anche
      tu.

      {origine apprendista-raschiatore} La squadra del 115 ha ancora una
      lanterna al Ponte dei Morti, con inciso uno dei nomi che chiama.
    opzioni:
      - testo: "Passargli accanto senza ascoltare"
        descrizione: "È un'eco e ripete, basta tenere la bocca chiusa."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Media }
        successo:
          titolo: I nomi
          testo: |
            Passi accanto all'eco a capo chino, e al quarto nome ti mordi la
            lingua per non rispondere.
          effetti: { profondita.velo-sacca-dell-orlo: 1 }
        fallimento:
          titolo: La risposta
          testo: |
            Al terzo nome rispondi senza volerlo, e l'eco si volta con la lanterna
            alzata. Indietreggi fino al condotto principale.
          effetti: { tormento: 1 }

      - testo: "Recitare l'Esorcismo"
        incantesimo: esorcismo
        descrizione: "Questo Raschiatore aspetta da trentacinque anni, e il rito delle cripte lo può lasciar andare."
        prova: { attributo: mentale, abilita: magia, difficolta: Media }
        successo:
          titolo: L'ultimo nome
          testo: |
            L'eco si ferma a metà di un nome e si sfilaccia come fumo in una
            corrente, a partire dalla lanterna, e l'ultima cosa a sparire è la
            bocca, ancora aperta.
          pe: { magia: 3 }
          effetti: { profondita.velo-sacca-dell-orlo: 1 }
        fallimento:
          titolo: Il rito spezzato
          testo: |
            A metà del rito la voce ti si incrina, e l'eco si volta con la
            lanterna alzata. Torni indietro, e per un pezzo continui a sentire i
            nomi.
          effetti: { tormento: 1 }

      - testo: "Aspettare che arrivi in fondo all'elenco"
        descrizione: "Quando ha detto tutti i nomi, forse si ferma un momento."
        costo: 2
        esito:
          titolo: L'elenco
          testo: |
            Conti i nomi, e sono ventidue. Dopo l'ultimo l'eco tace per il tempo
            di contare fino a tre, e in quel momento gli passi accanto.
          effetti: { profondita.velo-sacca-dell-orlo: 1, tormento: 1 }

  # ------------------------------------------------------------ 3 · la galleria asciutta
  - id: velo-sacca-l-aria-fredda
    immagine: ambientazione/orlo-dei-rottami
    titolo: L'aria fredda
    sommario: "Il condotto si fa asciutto, e l'aria è fredda in un modo che con la stagione non c'entra."
    luogo: La sacca sotto l'Orlo, la galleria asciutta
    area: velo-sacca-dell-orlo
    ripetibile: true
    requisiti: [fazione.velo == 7, profondita.velo-sacca-dell-orlo == 3]
    testo: |
      Il condotto smette di gocciolare e il fango lascia il posto a una
      polvere fine. L'aria è ferma e fredda, diversa da quella delle cantine,
      e la fiamma della lanterna si allunga sottile. Dall'alto la corda di
      Walter dà tre strappi brevi, che non sono il segnale per risalire, e poi
      altri tre.

      {origine accolito-del-velo} In Cripta, sotto l'altare, c'è un punto dove
      l'aria è così, e i novizi ci passano in fretta senza parlarne.
    opzioni:
      - testo: "Andare avanti nel freddo"
        descrizione: "Il freddo non morde e non ferisce, bisogna solo convincersene."
        prova: { attributo: mentale, abilita: [resilienza, magia], difficolta: Media }
        successo:
          titolo: Il punto fermo
          testo: |
            Cammini contando i passi, e in fondo alla galleria l'aria umida torna
            a muoversi. Hai i capelli pieni di brina.
          effetti: { profondita.velo-sacca-dell-orlo: 1 }
        fallimento:
          titolo: Tre strappi
          testo: |
            A metà galleria il freddo ti entra nelle ginocchia e non riesci a
            ripartire. Tiri tre volte, e Walter ti riporta all'imbocco con una
            delicatezza che non ti aspettavi.
          effetti: { tormento: 1 }

      - testo: "Rispondere ai tre strappi"
        descrizione: "Se è Walter che chiama, conviene saperlo."
        prova: { attributo: mentale, abilita: percezione, difficolta: Media }
        successo:
          titolo: Il segnale
          testo: |
            Rispondi con due strappi, il segnale che stai bene, e Walter risponde
            con tre strappi lenti e uno, che vuol dire di proseguire piano.
            Attraversi il freddo con la corda in mano come un corrimano.
          effetti: { profondita.velo-sacca-dell-orlo: 1 }
        fallimento:
          titolo: Il segnale sbagliato
          testo: |
            Rispondi con tre strappi, e Walter ti tira su di dieci braccia prima
            che tu riesca a fermarlo.
          effetti: { ferite: 0.5 }

      - testo: "Accendere una seconda candela"
        descrizione: "Due fiamme scaldano più di una, e la seconda fa da riserva."
        costo: 2
        esito:
          titolo: Due fiamme
          testo: |
            Accendi un moccolo alla lanterna e segui le due fiamme sottili finché
            l'aria torna a muoversi. Il moccolo si consuma fino alle dita.
          effetti: { profondita.velo-sacca-dell-orlo: 1 }

  - id: velo-sacca-le-impronte
    immagine: ambientazione/orlo-dei-rottami
    titolo: Le impronte
    sommario: "Nella polvere della galleria ci sono impronte di sandali e, a intervalli regolari, gocce di cera."
    luogo: La sacca sotto l'Orlo, la galleria asciutta
    area: velo-sacca-dell-orlo
    ripetibile: true
    requisiti: [fazione.velo == 7, profondita.velo-sacca-dell-orlo == 3]
    testo: |
      Nella polvere ci sono molte impronte della stessa misura, dei sandali
      con la suola di corda che il Velo dà ai sacerdoti, e accanto gocce di
      cera bianca, le più vecchie grigie di polvere e le nuove ancora
      lucide. Più avanti la galleria finisce contro una frana, e le impronte
      la girano da destra.

      {medicina Difficile} Il passo è corto, e il piede destro strascica
      appena. Chi cammina così ha un ginocchio che gli fa male da anni.
    opzioni:
      - testo: "Seguire le impronte"
        descrizione: "Chi passa di qui sa dove andare."
        prova: { attributo: mentale, abilita: percezione, difficolta: Media }
        successo:
          titolo: Il varco
          testo: |
            Segui le impronte rasente la frana fino a un varco, dove una macchia
            di cera più grande dice che qualcuno ci appoggia la candela ogni
            volta. Oltre il varco senti l'odore della sacca.
          effetti: { profondita.velo-sacca-dell-orlo: 1 }
        fallimento:
          titolo: La frana
          testo: |
            Segui le impronte sbagliate fino contro la frana, e mentre cerchi un
            appiglio una pietra ti prende sulla spalla.
          effetti: { ferite: 0.5 }

      - testo: "Raccogliere le gocce di cera"
        descrizione: "La cera bianca dei laboratori della Cattedrale dice da quanto tempo passa di qui."
        prova: { attributo: mentale, abilita: [natura, accademiche], difficolta: Media }
        successo:
          titolo: Dieci anni
          testo: |
            Conti gli strati di cera grigia come gli anelli di un albero e arrivi
            a dieci, dieci anni di candele sullo stesso sentiero. Metti in tasca
            una goccia nuova e segui la cera fino al varco.
          effetti: { profondita.velo-sacca-dell-orlo: 1 }
        fallimento:
          titolo: La cera
          testo: |
            Le gocce si sbriciolano fra le dita, e la polvere ti entra negli
            occhi.
          effetti: { tormento: 1 }

      - testo: "Cercare il varco a tastoni"
        descrizione: "Una frana ha sempre un varco, per chi ha pazienza."
        costo: 2
        esito:
          titolo: A tastoni
          testo: |
            Passi le mani sulla frana pietra per pietra finché a destra trovi il
            vuoto, e ci passi di fianco. Dall'altra parte senti l'odore dolce
            della sacca.
          effetti: { profondita.velo-sacca-dell-orlo: 1 }

  # ------------------------------------------------------------ il cuore · la sacca
  - id: velo-la-sacca
    immagine: ambientazione/marea-grigia
    titolo: La sacca
    sommario: "In fondo alla galleria c'è una conca di fango grigio che si gonfia, e nella parete una cassetta di latta."
    luogo: La sacca sotto l'Orlo, il fondo
    area: velo-sacca-dell-orlo
    requisiti: [fazione.velo == 7, profondita.velo-sacca-dell-orlo >= 4]
    testo: |
      In fondo alla galleria la terra ha ceduto in una conca larga come un
      cortile, piena di fango grigio che ogni tanto si gonfia in una bolla
      lenta e lascia un odore dolce di frutta marcia. Sul bordo c'è un
      picchetto di ferro con un anello, dove si lega la corda per calarla, con
      segni vecchi di un anno.

      {natura Difficile} È una sacca di Marea alimentata dal basso. Se il
      bollettino non la segna, fra un anno il fango arriva ai condotti, e fra
      due nelle cantine della Città Bassa.

      Dall'altra parte della conca, in una nicchia asciutta, delle lamiere
      precuriane sono appoggiate con cura come una porta, e sotto si vede
      l'angolo di una cassetta di latta.

      Il fango si gonfia più vicino, e la bolla non scoppia. Ne esce qualcosa
      grande come un cane, fatto di ossa di topo e pezzi di lamiera tenuti
      insieme dal grigio, con una testa senza occhi che si gira verso la
      lanterna.

      {rissa Media} Si muove a scatti, e fra uno scatto e l'altro si ferma del
      tutto. È in quel momento che si colpisce.
    opzioni:
      - testo: "Affrontare il nato della sacca"
        descrizione: "È fatto di rottami e di Marea, e protegge la sacca come un cane la ciotola."
        combattimento: velo-il-nato-della-sacca
        vittoria:
          titolo: Il grigio che torna grigio
          testo: |
            Il nato si sfascia all'ultimo colpo, e il fango si riprende le ossa di
            topo con una bolla lenta. Con un taglio sul braccio, tiri la corda di
            Walter per avere tutta la lunghezza.
          segue: velo-la-corda-al-cristallo
        sconfitta:
          titolo: Tre strappi
          testo: |
            Il nato ti butta a terra sul bordo della conca, e il fango ti arriva
            alla bocca. Tiri la corda tre volte, e mentre Walter ti trascina via
            la mano sinistra trova la cassetta sotto le lamiere. Arrivi al pozzo
            con la cassetta contro il petto e la sacca senza misura.
          effetti: { fazione.velo: 1, rep.velo: 1, velo.lettere: 1, velo.moneta: 1, contaminazione: 1.5 }
          imposta: { velo.sacca: 2 }
          vai: citta-bassa

      - testo: "Tenerlo lontano con l'Esorcismo"
        incantesimo: esorcismo
        descrizione: "Con una voce ferma il rito delle cripte può ricacciarlo nel fango."
        prova: { attributo: mentale, abilita: magia, difficolta: Difficile }
        successo:
          titolo: La voce ferma
          testo: |
            Il nato si ferma a mezzo scatto, e ogni parola del rito lo spinge
            indietro di un palmo finché non affonda nel fango. Tiri la corda di
            Walter per avere tutta la lunghezza.
          pe: { magia: 5 }
          segue: velo-la-corda-al-cristallo
        fallimento:
          titolo: La voce rotta
          testo: |
            A metà del rito la voce ti si rompe e il nato ti è addosso. Mentre
            Walter ti trascina via afferri la cassetta sotto le lamiere, e la
            sacca resta senza misura.
          effetti: { fazione.velo: 1, rep.velo: 1, velo.lettere: 1, velo.moneta: 1, contaminazione: 1.5, tormento: 1 }
          imposta: { velo.sacca: 2 }
          vai: citta-bassa

      - testo: "Prendere la cassetta e tornare su"
        descrizione: "Il nato guarda la lanterna, e al buio la nicchia si raggiunge, ma la sacca resta senza misura."
        prova: { attributo: fisico, abilita: furtivita, difficolta: Media }
        successo:
          titolo: Al buio
          testo: |
            Posi la lanterna sul bordo e ti allontani al buio, mentre il nato si
            gira verso la luce. Sfili la cassetta da sotto le lamiere e Walter ti
            porta su, lasciando la sacca senza misura.
          pe: { furtivita: 5 }
          effetti: { fazione.velo: 1, rep.velo: 1, velo.lettere: 1, velo.moneta: 1, contaminazione: 1 }
          imposta: { velo.sacca: 2 }
          vai: citta-bassa
        fallimento:
          titolo: La lamiera
          testo: |
            Una lamiera cade con un rumore di campana e il nato si volta. Stringi
            la cassetta mentre Walter ti trascina via, con un morso alla caviglia
            e la sacca senza misura.
          effetti: { fazione.velo: 1, rep.velo: 1, velo.lettere: 1, velo.moneta: 1, contaminazione: 1, ferite: 1 }
          imposta: { velo.sacca: 2 }
          vai: citta-bassa

  - id: velo-la-corda-al-cristallo
    immagine: ambientazione/marea-grigia
    titolo: La corda al cristallo
    tipo: seguito
    luogo: La sacca sotto l'Orlo, il bordo della conca
    area: velo-sacca-dell-orlo
    requisiti: [fazione.velo == 7, profondita.velo-sacca-dell-orlo >= 4]
    testo: |
      Leghi la corda all'anello del picchetto e la cali nel fango, con i
      frammenti di cristallo che spariscono sotto la superficie grigia. Tirati
      su, ognuno dirà il colore della Marea alla sua profondità, dal rosa al
      grigio, e il numero dei grigi è la misura che va sul bollettino. La
      corda scende fino a venti braccia, molto più di quanto la conca sembri
      profonda.

      {accademiche Facile} I bollettini del Santuario segnavano la profondità
      in frammenti grigi, e in quarant'anni nessuno ne ha mai scritti più di
      sei.

      Nella nicchia, la cassetta di latta aspetta sotto le sue lamiere.
    opzioni:
      - testo: "Tirare su la corda dritta"
        descrizione: "Venti braccia di corda bagnata a mani nude, senza farla strisciare."
        prova: { attributo: mentale, abilita: [natura, accademiche], difficolta: Difficile }
        successo:
          titolo: Nove grigi
          testo: |
            Tiri su la corda dritta con i palmi che bruciano, e i frammenti escono
            sempre più scuri finché restano solo i grigi. Sono nove. Prendi la
            cassetta, che pesa più di quanto dovrebbe una cassetta vuota, e al
            pozzo dici il numero a Walter, che chiude gli occhi.
          pe: { natura: 5 }
          effetti: { fazione.velo: 1, rep.velo: 1, velo.lettere: 1, velo.moneta: 1, reliquie.scheggia: 1 }
          imposta: { velo.sacca: 1 }
          vai: citta-bassa
        fallimento:
          titolo: La corda che striscia
          testo: |
            La corda striscia contro il bordo e i frammenti escono tutti dello
            stesso grigio sporco. Prendi la cassetta, e al pozzo Walter ti mette
            una mano sulla spalla quando gli dici che la misura non vale.
          effetti: { fazione.velo: 1, rep.velo: 1, velo.lettere: 1, velo.moneta: 1, contaminazione: 1.5 }
          imposta: { velo.sacca: 2 }
          vai: citta-bassa

      - testo: "Tirarla su palmo a palmo, con Walter"
        descrizione: "Walter tiene la corda tesa dall'alto mentre tu la guidi, ma ci vuole il doppio e il fango si gonfia vicino."
        costo: 2
        esito:
          titolo: Palmo a palmo
          testo: |
            Walter tiene la corda tesa e tu la guidi fuori dal fango palmo a
            palmo, con il vapore in faccia. Dopo un'ora i grigi sono nove. Prendi
            la cassetta, e al pozzo dici il numero a Walter, che chiude gli occhi.
          pe: { resilienza: 5 }
          effetti: { fazione.velo: 1, rep.velo: 1, velo.lettere: 1, velo.moneta: 1, reliquie.scheggia: 1, contaminazione: 1 }
          imposta: { velo.sacca: 1 }
          vai: citta-bassa
