# La quest della Confraternita del Velo, passi 7, 9 e 10, con gli ingressi delle spedizioni dei passi 8 e 11.
# - Passo 7 (fazione.velo == 6): la prima notte di garitta con Padre Walter sopra i piloni. Il Raschiatore ferito e i
#   contrabbandieri, poi il seguito con il ragazzo che parla una lingua che non conosce. Walter ti dà appuntamento al
#   pozzo di scolo dell'Orlo.
# - Passo 8 (== 7): l'ingresso della spedizione «La sacca sotto l'Orlo» dal pozzo di scolo dietro la baracca di Grusk
#   (le stanze e il cuore in spedizione-sacca.yaml).
# - Passo 9 (== 8, grado 3): le lettere a «S.» e il disco con l'occhio chiuso. Leggerle apre il seguito in cui
#   decidi a chi portarle: Walter, Ottilia (velo.allarme +1), Vantes (trattenerlo o lasciarlo fare) o nessuno. Dà
#   la chiave di garitta e il primo indizio dell'occhio chiuso (crepuscolo.indizi).
# - Passo 10 (== 9): Silvano Ardice predica in Città Bassa. Ascoltarlo, discutere, denunciarlo o proteggerlo dal
#   sergente (galdrick.via == 1) imposta velo.ardice e apre il seguito con il racconto della notte del 145.
# - Passo 11 (== 10): l'ingresso della spedizione «La gola di Tuarmir» dalla Superficie Fratturata (le stanze e il
#   cuore in spedizione-gola.yaml).
storylet:
  # ------------------------------------------------------------ passo 7 · la garitta dei piloni
  - id: velo-la-garitta-dei-piloni
    immagine: personaggi/padre-walter
    titolo: La garitta dei piloni
    sommario: "I laici consacrati fanno la prima notte di garitta con Padre Walter, sopra i piloni da cui sale chi viene dalla Cicatrice."
    luogo: I piloni sull'orlo della Cicatrice, la garitta del Velo, di notte
    area: ponti-sospesi
    requisiti: [fazione.velo == 6]
    testo: |
      La garitta del Velo è una cabina appesa al pilone più alto, sopra
      l'argano dei ponti-ascensore. Padre Walter ti lascia l'unico sgabello e
      resta in piedi davanti al registro dei Protocolli di Pozzo.

      «Chi sale passa dalla Cripta, così vuole il protocollo da più di
      trent'anni» dice. Stanotte però decidi tu, e lui guarda.

      Verso la seconda ora la gabbia sale dalla Cicatrice con un Raschiatore
      dalla gamba fasciata alla meglio, la benda già nera, e due uomini senza
      la piastrina della Gilda, con un sacco ciascuno, che guardano la garitta
      e poi il vuoto.

      {medicina Facile} La benda è stata rifatta almeno due volte sulla stessa
      ferita, e se in Cripta gli guardano gli occhi prima della gamba, la
      gamba rischia.

      {origine apprendista-raschiatore} L'argano lo vedi per la prima volta
      dalla parte di chi aspetta, e il letto che il Raschiatore vuole adesso
      dipende da te.
    opzioni:
      - testo: "Applicare il protocollo a tutti"
        descrizione: "Il registro dice Cripta per tutti, e l'hanno scritto quelli che hanno visto il 115."
        esito:
          titolo: Il protocollo
          testo: |
            Scrivi i tre nomi sul registro e li mandi in Cripta con la guardia del
            pilone, e Walter annuisce una volta. I contrabbandieri, prima di
            andare, lasciano cadere i sacchi giù dal ponte, e li senti toccare il
            fondo dopo molto tempo.
          effetti: { rep.raschiatori: -0.5 }
          segue: velo-il-ragazzo-che-parla

      - testo: "Lasciarli passare"
        descrizione: "Sono stanchi e vogliono andare a casa, e il registro lo scrivi tu."
        esito:
          titolo: Tre righe bianche
          testo: |
            Lasci il registro bianco e fai cenno ai tre di passare. Il Raschiatore
            ti batte una mano sulla spalla, e i contrabbandieri spariscono nel
            buio dei Ponti mentre il prete aggiunge carbone al braciere senza
            commentare.

            {empatia Media} Walter si tiene il giudizio per sé. Sta prendendo le
            misure di chi sei, come fa con la Marea.
          effetti: { rep.raschiatori: 0.5 }
          segue: velo-il-ragazzo-che-parla

      - testo: "Curare la gamba del Raschiatore sul posto"
        descrizione: "Prima la gamba, e la Cripta può aspettare fino a domani."
        prova: { attributo: mentale, abilita: medicina, difficolta: Media }
        successo:
          titolo: La benda pulita
          testo: |
            La ferita è sporca ma non profonda, e la rifasci alla luce del
            braciere mentre il Raschiatore ti racconta il turno per non pensarci.
            Domani in Cripta ci andrà con le sue gambe, e i contrabbandieri li
            manda Walter alla guardia del pilone.
          pe: { medicina: 5 }
          effetti: { rep.raschiatori: 0.5 }
          segue: velo-il-ragazzo-che-parla
        fallimento:
          titolo: La benda nera
          testo: |
            La ferita ricomincia a sanguinare, e Walter preme due dita nel punto
            giusto e chiama la guardia. Il Raschiatore va in Cripta in barella, e
            il protocollo lo firma Walter.
          segue: velo-il-ragazzo-che-parla
          effetti: { tormento: 0.5 }

      - testo: "Recitare Rimarginare sulla gamba"
        incantesimo: rimarginare
        descrizione: "La preghiera dei guaritori chiude una ferita, se il vento non ti porta via le parole."
        prova: { attributo: mentale, abilita: magia, difficolta: Media }
        successo:
          titolo: La riga rosa
          testo: |
            Dici la preghiera contro il vento con le mani sulla benda nera, e
            sotto resta una riga rosa che il Raschiatore guarda come un trucco da
            fiera.
          pe: { magia: 5 }
          effetti: { rep.raschiatori: 0.5 }
          segue: velo-il-ragazzo-che-parla
        fallimento:
          titolo: Il vento
          testo: |
            Il vento ti porta via le parole a metà, e la gamba resta com'era. Il
            Raschiatore va in Cripta in barella, e il protocollo lo firma Walter.
          segue: velo-il-ragazzo-che-parla
          effetti: { tormento: 0.5 }

      - testo: "Coprire il ferito della tua squadra"
        descrizione: "Il ferito è uno della tua squadra, e la benda gliel'hai fatta tu tre giorni fa."
        quando: [raschiatore >= 1]
        esito:
          titolo: Uno dei nostri
          testo: |
            Gli dici il suo nome prima che apra bocca, e lui ride. Scrivi che è
            passato dalla Cripta, con l'ora di domani, e lo mandi a casa; Walter
            legge la riga e non la corregge, e i contrabbandieri spariscono nella
            confusione.
          effetti: { rep.raschiatori: 0.5 }
          segue: velo-il-ragazzo-che-parla

  - id: velo-il-ragazzo-che-parla
    immagine: personaggi/padre-walter
    titolo: Il ragazzo che parla
    tipo: seguito
    luogo: I piloni sull'orlo della Cicatrice, la garitta del Velo, prima dell'alba
    area: ponti-sospesi
    requisiti: [fazione.velo == 6]
    testo: |
      Prima dell'alba la gabbia risale con un ragazzo solo, quindici anni al
      massimo, la piastrina di una squadra al collo e nemmeno un graffio.
      Parla a bassa voce senza fermarsi, in una lingua che non conosci, con
      una cadenza da filastrocca.

      {accademiche Difficile} Del precuriano dei libri ha soltanto qualche
      suono. Somiglia a un elenco, come se contasse qualcosa che non finisce.

      «Mirn il Sordo parlava così» dice Walter. «Lo prendemmo noi, e morì in
      una cella sotto la Cattedrale, nelle cantine del vecchio Santuario.» Poi
      aggiunge che quest'anno nel libro di Valdrano mancano le misure
      dell'Orlo dei Rottami, che ci sono sempre state.

      {origine fuggiasco-di-ghoran} Quando Walter scalda le mani al braciere,
      gli vedi sui polsi le cicatrici lisce che a Ghoran lasciano i ferri, e
      lui non le nasconde.
    opzioni:
      - testo: "Mandarlo alle celle"
        descrizione: "Per chi sente le voci il protocollo vuole le celle, e i sacerdoti sanno che cosa fare."
        esito:
          titolo: Le celle
          testo: |
            Affidi il ragazzo alla guardia, e lui parla anche mentre scende la
            scala. All'alba Walter firma sotto di te e ti dà appuntamento per
            stanotte al pozzo di scolo dietro la baracca di Grusk, all'Orlo dei
            Rottami, dove porterà la corda al cristallo.
          pe: { resilienza: 5 }
          effetti: { fazione.velo: 1, rep.velo: 0.5, monete: 6 }

      - testo: "Portarlo in Cripta con te"
        descrizione: "Le celle sono il posto dove è morto Mirn, e il ragazzo puoi accompagnarlo tu."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Media }
        successo:
          titolo: La scala della Cripta
          testo: |
            A metà della scala della Cripta ti accorgi che la filastrocca ha un
            ritornello, e che a ogni ritornello il ragazzo ti stringe più forte la
            mano. I velati lo fanno sedere vicino al cristallo. Sul portale Walter
            ti dà appuntamento per stanotte al pozzo di scolo dietro la baracca di
            Grusk, con la corda al cristallo.
          pe: { resilienza: 5 }
          effetti: { fazione.velo: 1, rep.velo: 0.5, monete: 6, tormento: 1 }
        fallimento:
          titolo: Il ritornello
          testo: |
            A metà della scala dici la filastrocca insieme al ragazzo, ad alta
            voce, finché un velato non vi separa. Quando risali, Walter ti dà
            appuntamento per stanotte al pozzo di scolo dietro la baracca di
            Grusk, con la corda al cristallo.
          effetti: { fazione.velo: 1, rep.velo: 0.5, monete: 6, tormento: 1.5 }

      - testo: "Chiedere a Walter di Ghoran"
        descrizione: "Le cicatrici ai polsi le hai riconosciute, e fra chi le porta a volte ci si parla."
        quando: [origine.fuggiasco-di-ghoran >= 1]
        esito:
          titolo: I ferri
          testo: |
            Walter ha lasciato Ghoran a vent'anni, e il Velo gli ha dato un posto
            dove le mani servissero ad altro; del resto preferisce tacere.
            All'alba ti dà appuntamento per stanotte al pozzo di scolo dietro la
            baracca di Grusk, con la corda al cristallo.
          pe: { empatia: 5 }
          effetti: { fazione.velo: 1, rep.velo: 0.5, monete: 6 }

      - testo: "Chiedere a Walter che cosa sente"
        descrizione: "Sopra la cripta di Padre Sollen Walter aveva sentito un'aria fredda e paziente, e quassù ha la stessa faccia."
        quando: [pista.sepolcro >= 3]
        esito:
          titolo: Fredda e paziente
          testo: |
            «Sopra l'Orlo» dice Walter. «Quando il vento gira, sento la stessa
            aria fredda e paziente della cripta di Padre Sollen.» All'alba ti dà
            appuntamento per stanotte al pozzo di scolo dietro la baracca di
            Grusk, con la corda al cristallo.
          pe: { resilienza: 5 }
          effetti: { fazione.velo: 1, rep.velo: 0.5, monete: 6 }

  # ------------------------------------------------------------ passo 8 · l'ingresso della sacca
  - id: velo-il-pozzo-di-scolo
    presso: orlo-dei-rottami
    immagine: ambientazione/orlo-dei-rottami
    titolo: Il pozzo di scolo
    sommario: "Walter ti aspetta con la corda al cristallo sul pozzo di scolo dietro la baracca di Grusk."
    luogo: Orlo dei Rottami, dietro la baracca di Grusk, di notte
    area: citta-bassa
    requisiti: [fazione.velo == 7]
    testo: |
      Dietro la baracca di Grusk c'è un pozzo di scolo senza grata, e dal buio
      sale un odore dolce di frutta marcia. Padre Walter è seduto sul bordo
      con in grembo un rotolo di corda, che ha un frammento di cristallo
      legato ogni dieci braccia.

      «La corda al cristallo si cala nella sacca, e il cristallo cambia colore
      secondo quanta Marea trova» dice, mostrandoti il primo frammento, di un
      rosa pallido. «Valdrano la cala ogni anno in tutti i pozzi della città,
      e quest'anno qui non è sceso.»

      {natura Media} Il rosa è il colore buono. Più giù il cristallo diventa
      azzurro e poi grigio, e chi ha visto il grigio non lo racconta
      volentieri.

      Sotto l'Orlo corrono i condotti della Prima Breccia, da cui nel 115 salì
      la Marea. Walter scenderà con te fino al primo livello, poi terrà la
      corda dall'alto, e se tiri tre volte ti tira su.
    opzioni:
      - testo: "Scendere con Walter"
        descrizione: "I pioli sono mangiati dalla ruggine e la lanterna fa poca strada, ma Walter è con te."
        esito:
          titolo: I primi pioli
          testo: |
            Walter ti lega la corda alla vita con un nodo che non hai mai visto e
            scende per primo. Dopo una ventina di pioli il cerchio di cielo si fa
            piccolo come una moneta, e poi sparisce.
          vai: velo-sacca-dell-orlo

      - testo: "Chiedere a Walter perché non ci scende Valdrano"
        descrizione: "Le misure sono il lavoro del cronista maggiore, e Walter sa più di quello che dice."
        costo: 0
        esito:
          titolo: Le ginocchia di un vecchio
          testo: |
            «Dice che le ginocchia non lo reggono più» risponde Walter. «Lo dice
            da quest'anno.» Arrotola la corda con cura, un giro dopo l'altro, e
            poi ti chiede se sei pronto.

      - testo: "Rimandare a un'altra notte"
        descrizione: "Il pozzo resta dov'è, e Walter sa aspettare."
        costo: 0
        esito:
          titolo: Un'altra notte
          testo: |
            Walter rimette la grata sul pozzo con una mano sola. «Un'altra notte»
            dice, e resta seduto sul bordo a guardare il buio.

  # ------------------------------------------------------------ passo 9 · le lettere a nessuno (grado 3)
  - id: velo-lettere-a-nessuno
    presso: cattedrale-del-velo
    immagine: ambientazione/cattedrale-del-velo
    titolo: Lettere a nessuno
    sommario: "La cassetta trovata sotto l'Orlo contiene lettere senza firma e un disco di metallo che non pesa niente."
    luogo: Cattedrale del Velo, un angolo del chiostro, a notte fonda
    area: quartieri-alti
    requisiti: [fazione.velo == 8]
    testo: |
      Le lettere le apri nel chiostro quando i novizi dormono, alla luce di
      una lanterna schermata. Sono una quarantina, tenute insieme da uno
      spago, e nessuna è firmata, ma tutte cominciano con una lettera sola,
      *S.*, seguita da un punto. La carta è quella buona dei cronisti, le
      righe sono dritte come tirate a righello, e le più vecchie hanno dieci
      anni.

      {percezione Media} L'inchiostro è quello semplice, senza la polvere di
      cristallo che il Velo mette in quello dei registri. Chi le ha scritte
      non voleva che si leggessero con la luce della Cripta.

      Parlano delle udienze della Madre, con i nomi di chi scende in Cripta,
      delle visite di Padre Vantes in Consiglio, dei pellegrinaggi alla
      Roccia. Niente che un cronista non saprebbe, scritto per qualcuno che
      non lo sa.

      Sul fondo della cassetta c'è un disco di metallo scuro grande come una
      moneta, con un occhio chiuso inciso sopra, così leggero che devi
      guardarlo per sapere che ce l'hai ancora fra le dita.

      {magia Difficile} Il Mana intorno al disco sta fermo, come l'acqua di
      uno stagno quando smette di piovere.

      *Dieci anni di lettere, e nessuno le ha mai ritirate.*
    opzioni:
      - testo: "Leggerle tutte, in ordine"
        descrizione: "Dalla più vecchia alla più nuova, finché la lanterna regge."
        prova: { attributo: mentale, abilita: [accademiche, percezione], difficolta: Media }
        successo:
          titolo: L'ultima lettera
          testo: |
            L'ultima lettera è di dopo la razzia, e parla dei bollettini, della
            riga sotto l'Orlo e di un laico nuovo con l'occhio buono che l'ha
            ricostruita, descritto meglio di come ti descriveresti tu. In fondo
            c'è una frase sola, *si attende istruzione*.
          pe: { accademiche: 5 }
          segue: velo-a-chi-portarle
        fallimento:
          titolo: La lanterna corta
          testo: |
            La lanterna si spegne a metà del pacco, e le altre le leggi il giorno
            dopo, in fretta, saltando le ultime. Di notte sogni righe dritte che
            non finiscono mai.
          effetti: { tormento: 1 }
          segue: velo-a-chi-portarle

      - testo: "Studiare il disco"
        descrizione: "Un metallo senza peso con un occhio chiuso inciso, che qualcuno in città deve aver già visto."
        prova: { attributo: mentale, abilita: [tecnologia, magia], difficolta: Media }
        successo:
          titolo: L'occhio chiuso
          testo: |
            L'incisione è un occhio chiuso con il sopracciglio rovesciato, e il
            bordo è liscio come se nessuno l'avesse tagliato. Vicino al cristallo
            di una lampada ti dà un formicolio nei denti, appena.
          pe: { tecnologia: 5 }
          segue: velo-a-chi-portarle
        fallimento:
          titolo: Un disco
          testo: |
            Lo giri sotto la lanterna finché ti fanno male gli occhi, e resta un
            disco con un occhio chiuso. Due volte durante la notte ti alzi a
            controllare che sia ancora in tasca.
          effetti: { tormento: 1 }
          segue: velo-a-chi-portarle

      - testo: "Leggerne una a notte"
        descrizione: "Una a notte nel chiostro, e in qualche settimana niente ti sfugge."
        costo: 2
        esito:
          titolo: Una a notte
          testo: |
            Ne leggi una a notte, e dopo un po' riconosci chi scrive dal modo in
            cui comincia ogni frase dal soggetto. L'ultima è di dopo la razzia, e
            parla di te.
          pe: { resilienza: 5 }
          segue: velo-a-chi-portarle

      - testo: "Riconoscere la lega del disco"
        descrizione: "All'Accademia ti hanno mostrato le leghe dei Precursori, e questa la ricordi."
        quando: [origine.allievo-di-torvessa >= 1]
        esito:
          titolo: La teca del seminterrato
          testo: |
            Questa lega l'hai vista in una teca del seminterrato di Orvald
            Temmerin, con un cartellino che diceva soltanto *precuriana, uso
            ignoto*. Quella della teca era una scheggia, e questo disco è intero e
            inciso.
          pe: { tecnologia: 5 }
          segue: velo-a-chi-portarle

  - id: velo-a-chi-portarle
    presso: cattedrale-del-velo
    immagine: personaggi/ottilia-sanvel
    titolo: A chi portarle
    tipo: seguito
    luogo: Cattedrale del Velo, il chiostro, al mattino
    area: quartieri-alti
    requisiti: [fazione.velo == 8]
    testo: |
      Al mattino rileghi le lettere con lo spago e le infili sotto la tunica,
      con il disco in tasca. Chi le ha scritte cammina in questa Cattedrale.
      La carta è dei cronisti, le righe sono tirate a righello e le misure
      dell'Orlo mancano dal libro di Valdrano, abbastanza da far pendere la
      testa da una parte e niente che basti a un tribunale.

      {politica-ed-economia Media} Il Velo che spia se stesso è una notizia
      che i Malgrani pagherebbero a peso d'oro.

      Padre Walter spegne le candele della notte in navata. Ottilia è alla
      tavoletta di cera, e la disciplina interna è sua. Padre Vantes sta
      uscendo per il Municipio con il mantello buono. In fondo al chiostro
      Fratello Lauro Bessi scende dal campanile con il pane sotto il braccio,
      e quando ti vede si ferma ad aspettare che tu sia solo.
    opzioni:
      - testo: "Portarle a Walter"
        descrizione: "Walter non parla quasi mai, e quello che sa lo porta alla Madre soltanto."
        immagine: personaggi/padre-walter
        esito:
          titolo: Custode dei pozzi
          testo: |
            Walter soppesa le lettere e le infila nella manica del saio senza
            leggerle. «Alla Madre» dice. Più tardi lui e Ottilia ti consegnano la
            chiave delle garitte del Velo e la lanterna dei custodi, con la grata
            di rame, e uscendo Bessi ti dice all'orecchio che Silvano Ardice ti
            vuole parlare.
          effetti: { fazione.velo: 1, velo.garitta: 1, oggetto.velo-lanterna-del-custode: 1, crepuscolo.indizi: 1, velo.lettere: -1 }
          almeno: { rep.velo: 6 }

      - testo: "Portarle a Ottilia"
        descrizione: "La disciplina interna è sua, e Ottilia trova sempre il colpevole."
        immagine: personaggi/ottilia-sanvel
        esito:
          titolo: L'indagine della disciplina
          testo: |
            Ottilia legge la prima e l'ultima e le chiude in un cassetto. Per una
            settimana i cronisti passano uno per uno negli archivi minori, e
            Valdrano ne esce pulito. Poi Ottilia e Walter ti consegnano la chiave
            delle garitte e la lanterna dei custodi, e Bessi ti dice all'orecchio
            che Silvano Ardice ti vuole parlare.

            {ingannare Media} Valdrano ha offerto il tè a Ottilia due volte nella
            stessa settimana.
          effetti: { fazione.velo: 1, velo.garitta: 1, oggetto.velo-lanterna-del-custode: 1, crepuscolo.indizi: 1, velo.lettere: -1, velo.allarme: 1 }
          almeno: { rep.velo: 6 }

      - testo: "Portarle a Vantes e trattenerlo"
        descrizione: "Vantes vorrà portarle in Consiglio, a meno di convincerlo che servono a qualcun altro."
        immagine: personaggi/padre-vantes
        prova: { attributo: sociale, abilita: persuasione, difficolta: Difficile }
        successo:
          titolo: Il mantello buono
          testo: |
            Vantes legge tre lettere con il mantello addosso, e alla terza si
            siede. Gli fai notare chi ne approfitterebbe in Consiglio, e alla fine
            chiude le lettere nello scrittoio. Walter e Ottilia ti consegnano la
            chiave delle garitte e la lanterna dei custodi, e Bessi ti dice
            all'orecchio che Silvano Ardice ti vuole parlare.
          pe: { persuasione: 5 }
          effetti: { fazione.velo: 1, velo.garitta: 1, oggetto.velo-lanterna-del-custode: 1, crepuscolo.indizi: 1, velo.lettere: -1 }
          almeno: { rep.velo: 6 }
        fallimento:
          titolo: In Consiglio
          testo: |
            Vantes porta le lettere in Municipio, e la sera torna più vecchio,
            perché in Consiglio ne hanno riso e qualcuno ne ha preso nota. Walter
            e Ottilia ti consegnano la chiave delle garitte e la lanterna dei
            custodi, e Bessi ti dice all'orecchio che Silvano Ardice ti vuole
            parlare.
          effetti: { fazione.velo: 1, velo.garitta: 1, oggetto.velo-lanterna-del-custode: 1, crepuscolo.indizi: 1, velo.lettere: -1, velo.allarme: 1, scandalo: 0.5 }
          almeno: { rep.velo: 6 }

      - testo: "Lasciare che Vantes le porti in Consiglio"
        descrizione: "Se Vantes dice in Consiglio che il Velo è spiato, qualcuno gli crederà."
        immagine: personaggi/padre-vantes
        esito:
          titolo: Le risate del Consiglio
          testo: |
            Vantes legge le lettere ad alta voce in Municipio, e la sera torna più
            vecchio. In Consiglio c'è chi ride e chi prende nota, e Julia Castaldi
            gli chiede una copia. Walter e Ottilia ti consegnano la chiave delle
            garitte e la lanterna dei custodi, e Bessi ti dice all'orecchio che
            Silvano Ardice ti vuole parlare.
          effetti: { fazione.velo: 1, velo.garitta: 1, oggetto.velo-lanterna-del-custode: 1, crepuscolo.indizi: 1, velo.lettere: -1, velo.allarme: 1 }
          almeno: { rep.velo: 6 }

      - testo: "Tenerle per te"
        descrizione: "Finché non sai chi le ha scritte, chiunque le veda è uno in più che lo sa."
        esito:
          titolo: Sotto la tunica
          testo: |
            Nascondi le lettere in fondo alla sacca, avvolte in una camicia.
            Quando Walter e Ottilia ti consegnano la chiave delle garitte e la
            lanterna dei custodi, Walter ti guarda un momento più del solito.
            Uscendo, Bessi ti dice all'orecchio che Silvano Ardice ti vuole
            parlare.
          effetti: { fazione.velo: 1, velo.garitta: 1, oggetto.velo-lanterna-del-custode: 1, crepuscolo.indizi: 1 }
          almeno: { rep.velo: 6 }

  # ------------------------------------------------------------ passo 10 · il predicatore dell'Antico
  - id: velo-il-predicatore
    immagine: ambientazione/citta-bassa
    titolo: Il predicatore dell'Antico
    sommario: "Silvano Ardice, uno dei sei sacerdoti della compieta, predica in Città Bassa e ti vuole parlare."
    luogo: Città Bassa, una piazzetta vicino alle vasche del lavatoio
    area: citta-bassa
    requisiti: [fazione.velo == 9]
    testo: |
      Silvano Ardice predica vicino alle vasche del lavatoio, in piedi su una
      cassetta, davanti a una ventina di lavandaie e Raschiatori. Ha la tonaca
      del Velo scolorita e la voce rauca di tante prediche all'aperto, e ogni
      tanto beve dalla fiaschetta che gli porge una lavandaia.

      «L'Albero è un testimone, ha visto cadere i Precursori e non ha mosso un
      ramo» dice. «Un dio che lascia scappare i suoi preti mentre la sua casa
      brucia, io non lo prego più.»

      {accademiche Media} È la dottrina del Culto dell'Antico, nata dalla fuga
      dei sacerdoti del 145, che in Cattedrale chiamano eresia e tollerano
      finché resta in Città Bassa.

      All'angolo una guardia della Caserma lo guarda come un cane che abbaia
      troppo. Ardice ti vede e ti fa un cenno con la fiaschetta.

      {origine figlio-del-circolo} Le parole sono del Velo, ma le pause lunghe
      sono quelle delle veglie del Circolo.
    opzioni:
      - testo: "Ascoltarlo fino in fondo"
        descrizione: "La predica è lunga, e le parole fanno male a chi porta il velo."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Media }
        successo:
          titolo: La fiaschetta
          testo: |
            Resti fino all'ultima parola senza abbassare gli occhi, nemmeno quando
            Ardice nomina la Madre. Lui scende dalla cassetta, ti offre un sorso
            di vinaccia addolcita con il miele bruciato e ti porta all'ombra di un
            portone.
          pe: { resilienza: 5 }
          imposta: { velo.ardice: 1 }
          segue: velo-la-notte-di-ardice
        fallimento:
          titolo: Il segno dell'Albero
          testo: |
            Ti fai il segno dell'Albero ogni volta che Ardice lo bestemmia, e le
            lavandaie ridono. Lui ti guarda con una specie di tenerezza, e alla
            fine ti porta all'ombra di un portone, dove il riso arriva meno.
          effetti: { tormento: 1 }
          imposta: { velo.ardice: 1 }
          segue: velo-la-notte-di-ardice

      - testo: "Rispondergli con le parole della Madre"
        descrizione: "La Madre ha scritto sull'eresia pagine che i novizi imparano a memoria."
        prova: { attributo: sociale, abilita: [persuasione, accademiche], difficolta: Difficile }
        successo:
          titolo: La disputa
          testo: |
            Gli rispondi con le parole della Madre sul velo che protegge la mente,
            e le lavandaie si girano dall'uno all'altro come al gioco della palla.
            Alla fine Ardice ride, ti dice che al Santuario uno come te
            l'avrebbero mandato a predicare nei villaggi e ti porta all'ombra di
            un portone.
          pe: { persuasione: 5 }
          imposta: { velo.ardice: 1 }
          effetti: { rep.velo: 0.5 }
          segue: velo-la-notte-di-ardice
        fallimento:
          titolo: La memoria corta
          testo: |
            Perdi a metà una frase della Madre, e Ardice la finisce per te meglio
            di come l'avresti detta, tra gli applausi delle lavandaie. Poi ti
            porta all'ombra di un portone con una mano sulla spalla.
          effetti: { scandalo: 1 }
          imposta: { velo.ardice: 1 }
          segue: velo-la-notte-di-ardice

      - testo: "Denunciarlo a Ottilia"
        descrizione: "Il Velo lo vuole fuori dalla città, e alla Caserma basta una lettera di Ottilia."
        esito:
          titolo: La cella
          testo: |
            La mattina dopo la Caserma va a prendere Ardice alla cassetta, davanti
            alle lavandaie, che non te lo perdoneranno presto. Il pomeriggio ti
            lasciano entrare a parlargli, e lui, seduto sulla branda, ti
            aspettava.
          imposta: { velo.ardice: 2 }
          effetti: { rep.velo: 0.5, rep.caserma: -0.5 }
          segue: velo-la-notte-di-ardice

      - testo: "Proteggerlo dalla guardia"
        descrizione: "In Caserma comanda un sergente che i predicatori li vuole in cella, e la guardia ha già deciso."
        quando: [galdrick.via == 1]
        prova: { attributo: sociale, abilita: [intimidire, galateo], difficolta: Media }
        successo:
          titolo: Il laico del Velo
          testo: |
            Fermi la guardia prima che arrivi alla cassetta e le dici che il Velo
            si occupa dei suoi preti da solo, anche quando non sono più suoi. Lei
            sputa per terra e torna all'angolo, e Ardice ti porta all'ombra di un
            portone.
          pe: { galateo: 5 }
          imposta: { velo.ardice: 3 }
          segue: velo-la-notte-di-ardice
        fallimento:
          titolo: Il bastone
          testo: |
            Il bastone della guardia ti prende sul braccio, e Ardice finisce in
            cella lo stesso. Il pomeriggio ti lasciano entrare a parlargli, per
            pietà del livido.
          effetti: { ferite: 0.5 }
          imposta: { velo.ardice: 2 }
          segue: velo-la-notte-di-ardice

      - testo: "Rispondere alle sue pause"
        descrizione: "Le pause sono quelle delle veglie del Circolo, e chi le conosce sa dove si risponde."
        quando: [origine.figlio-del-circolo >= 1]
        esito:
          titolo: La veglia
          testo: |
            Nelle pause rispondi con il respiro, come al Circolo. Alla fine Ardice
            ti chiede in quale radura hai vegliato la prima volta, e ti porta
            all'ombra di un portone.
          pe: { empatia: 5 }
          imposta: { velo.ardice: 1 }
          segue: velo-la-notte-di-ardice

      - testo: "Chiedergli della disgrazia dei salotti"
        descrizione: "Nei salotti dei Quartieri Alti l'incendio è una disgrazia senza colpevoli, e Ardice lo chiama in un altro modo."
        quando: [origine.rampollo-dei-quartieri-alti >= 1]
        esito:
          titolo: L'abbandono
          testo: |
            Gli chiedi della disgrazia del Santuario con le parole dei salotti, e
            lui scoppia a ridere. Per lui fu un abbandono, e la differenza la
            sanno i quaranta che dormivano dentro. Poi ti porta all'ombra di un
            portone.
          pe: { galateo: 5 }
          imposta: { velo.ardice: 1 }
          segue: velo-la-notte-di-ardice

  - id: velo-la-notte-di-ardice
    immagine: ambientazione/evento-notti-cucite-145
    titolo: La notte di Ardice
    tipo: seguito
    luogo: Città Bassa, all'ombra di un portone o dietro le sbarre
    area: citta-bassa
    requisiti: [fazione.velo == 9]
    testo: |
      «Ci chiamò Valdrano» dice Ardice, con la fiaschetta vuota fra le mani.
      «Era il cronista dei turni, allora come adesso. Disse che la Madre
      voleva un rito votivo sull'orlo della Cicatrice a mezzanotte, con sei
      sacerdoti esatti, e che si firmava la compieta prima di uscire. Io ero
      giovane, e un rito votivo è un onore. Sull'orlo pregammo un'ora. La
      Cicatrice brillava come sempre. Quando tornammo il Santuario bruciava
      dall'ala nord, e i quaranta erano dentro.»

      {percezione Media} Bessi ti aveva detto che la Cicatrice era scura. Uno
      dei due ricorda male, o ricorda quello che gli hanno detto di ricordare.

      «Il rito votivo la Madre non l'aveva mai chiesto. Lo seppi l'anno dopo,
      e lasciai la tonaca.» Si guarda quella scolorita che porta ancora.
      «Quasi tutta.»

      In sagrestia Padre Vantes ascolta il racconto con le dita sul tuo polso,
      e alla fine ammette che Sorella Alenna è partita per Tuarmir otto mesi
      fa su consiglio di Valdrano, e che da due mesi le sue lettere dalla gola
      non arrivano più.
    opzioni:
      - testo: "Chiedere a Vantes perché non l'ha detto prima"
        descrizione: "Due mesi senza lettere, e Vantes lo sapeva."
        immagine: personaggi/padre-vantes
        esito:
          titolo: Le lettere che non arrivano
          testo: |
            «Perché le lettere a volte si perdono» dice Vantes, «e perché non
            volevo che fosse vero.» Le ultime di Alenna parlavano di erbe che
            cambiano e di vento, con la grafia storta. Ti chiede di andare a
            Tuarmir e di portarla a casa, se vuole venire.
          pe: { empatia: 5 }
          effetti: { fazione.velo: 1 }

      - testo: "Chiedergli di Valdrano"
        descrizione: "Vantes conosce Valdrano da quarant'anni."
        immagine: personaggi/padre-vantes
        esito:
          titolo: Quarant'anni di tè
          testo: |
            Valdrano gli ha insegnato a scrivere i registri da novizio, e da
            quarant'anni gli offre il tè ogni mattina. «Era sull'orlo con gli
            altri» dice piano. «Lo hanno visto in sei.» Ti chiede di andare a
            Tuarmir a cercare Alenna.

            {ingannare Media} Lo hanno visto in cinque, più lui stesso. Vantes lo
            sa, e ha scelto di contarlo due volte.
          pe: { accademiche: 5 }
          effetti: { fazione.velo: 1 }

      - testo: "Promettere di andare a cercarla"
        descrizione: "Tuarmir è in una gola della Superficie Fratturata, e ci si va a piedi."
        immagine: ambientazione/tuarmir
        esito:
          titolo: La gola
          testo: |
            Glielo prometti prima che te lo chieda, e Vantes ti benedice con una
            mano sulla testa come si faceva ai pellegrini. Ti dà una lettera per
            Madre Cerya e una per Alenna, chiuse con il sigillo del Velo.
          pe: { resilienza: 5 }
          effetti: { fazione.velo: 1 }

  # ------------------------------------------------------------ passo 11 · l'ingresso della gola
  - id: velo-la-strada-di-tuarmir
    immagine: ambientazione/tuarmir
    titolo: La strada di Tuarmir
    sommario: "Sorella Alenna non scrive più da Tuarmir, a mezza giornata di cammino, dove dicono che il vento ha cambiato direzione."
    luogo: Superficie Fratturata, il sentiero che scende verso Tuarmir
    area: superficie-fratturata
    requisiti: [fazione.velo == 10]
    testo: |
      Il sentiero per Tuarmir lascia la piana di basalto e scende fra pareti
      di roccia scura che si stringono a ogni curva, su un muschio così fitto
      che i passi non fanno rumore.

      {natura Media} Il muschio si piega dalla parte da cui viene il vento, e
      qui si piega tutto verso valle. Il vento della Cicatrice dovrebbe
      soffiare dall'altra parte.

      Appese a un ramo storto ci sono tre maschere di stoffa impregnate
      d'erbe, lasciate ad asciugare. In tasca hai le lettere di Vantes per
      Madre Cerya e per Alenna, e il disco con l'occhio chiuso.

      *Due mesi senza lettere.* Ti sistemi la tracolla e guardi giù, dove il
      sentiero sparisce nell'ombra.
    opzioni:
      - testo: "Scendere nella gola"
        descrizione: "Il sentiero è scivoloso e la luce poca, e Alenna è da qualche parte in fondo."
        esito:
          titolo: Nell'ombra
          testo: |
            Scendi tenendoti alla parete, e dopo la terza curva la luce si fa
            grigia come al tramonto. Prendi una delle maschere dal ramo, perché a
            Tuarmir si fa così, e te la leghi al collo.
          vai: velo-gola-di-tuarmir

      - testo: "Aspettare che il sole entri nella gola"
        descrizione: "Il sole entra nella gola due ore al giorno, e forse conviene scendere con quelle."
        costo: 0
        esito:
          titolo: Il sole che non arriva
          testo: |
            Aspetti su una pietra all'imbocco della gola, e quando il sole arriva
            sul sentiero è già ora di tornare indietro.
