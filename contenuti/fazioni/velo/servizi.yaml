# La quest della Confraternita del Velo: i servizi e i ripetibili che si aprono con i gradi.
# - Grado 1 (fazione.velo >= 3): la scuola del laico, con le lezioni della Liturgia a metà offerta; l'infermeria dei
#   laici, dove una Ferita si cura con un'offerta piccola.
# - Grado 2 (>= 6): Rimarginare e Veglia senza offerta; i confratelli in convalescenza e nel delirio, con un'azione in
#   più che fa salire il recupero del doppio. La Cripta è già aperta dal voto (cattedrale.yaml).
# - Grado 3 (>= 9): Esorcismo senza offerta; la purificazione dei custodi, senza offerta, nell'infermeria. Il turno di
#   garitta sta nelle Ore del Velo (cattedrale.yaml), con la reputazione fino a 8.
# - Grado 4 (>= 12): la cella nel chiostro, dove si dorme senza pagare. Il servizio della Cripta sta nelle Ore del Velo,
#   con la reputazione fino a 10.
# - Grado 5 (>= 15): il Battito insegnato senza offerta; l'udienza nella Cripta per chi ha taciuto o lasciato correre
#   (velo.udienza); il Battito sulla Marea, per chi lo conosce.
storylet:
  # ------------------------------------------------------------ le lezioni della Liturgia
  - id: velo-la-scuola-del-laico
    presso: cattedrale-del-velo
    immagine: fazioni/confraternita-del-velo
    titolo: La scuola del laico
    sommario: "Il nome sulla tavoletta apre anche la scuola dei novizi, dove ai laici la Liturgia costa meno."
    luogo: Cattedrale del Velo, la scuola dei novizi, dopo le lezioni
    area: quartieri-alti
    ripetibile: true
    requisiti: [fazione.velo >= 3]
    testo: |
      Dopo le lezioni il sacerdote della Liturgia resta alla cattedra a pulire
      gli occhiali con la manica. Ai laici della tavoletta, dice, l'offerta si
      chiede a metà; ai consacrati niente, e ai custodi dei pozzi nemmeno per
      il rito delle cripte. Sul banco c'è la cassetta delle offerte.

      {origine accolito-del-velo} Sotto il piano di quel banco ci sono ancora
      le tue iniziali da novizio, e accanto ce ne sono di nuove.
    opzioni:
      - testo: "Benedizione, a metà offerta"
        immagine: personaggi/madre-del-velo
        descrizione: "La preghiera breve dei laici, per metà dell'offerta."
        requisiti: [magia >= 1, incantesimo.benedizione == 0, monete >= 5, rep.velo >= 2]
        costo: 2
        prova: { attributo: mentale, abilita: magia, difficolta: Facile }
        successo:
          titolo: La prima preghiera
          testo: |
            Ripeti la preghiera finché le parole vengono da sole, e lasci nella
            cassetta metà dell'offerta.
          effetti: { monete: -5, incantesimo.benedizione: 1 }
        fallimento:
          titolo: Non ancora
          testo: "Il sacerdote scuote la testa e ti rimanda alla preghiera della sera."
          effetti: {}

      - testo: "Rimarginare, a metà offerta"
        immagine: personaggi/madre-del-velo
        descrizione: "La preghiera dei guaritori, per metà dell'offerta."
        quando: [fazione.velo < 6]
        requisiti: [magia >= 2, incantesimo.rimarginare == 0, monete >= 15, rep.velo >= 4]
        costo: 2
        prova: { attributo: mentale, abilita: magia, difficolta: Media }
        successo:
          titolo: Le mani calde
          testo: |
            Su un muratore col polso sbucciato, in infermeria, la pelle si chiude
            in una riga rosa. Lasci metà dell'offerta.
          effetti: { monete: -15, incantesimo.rimarginare: 1 }
        fallimento:
          titolo: Non ancora
          testo: "Il polso del muratore resta sbucciato, e il sacerdote ti rimanda alla preghiera della sera."
          effetti: {}

      - testo: "Rimarginare, senza offerta"
        immagine: personaggi/madre-del-velo
        descrizione: "La preghiera dei guaritori, che il Velo non fa pagare ai consacrati."
        quando: [fazione.velo >= 6]
        requisiti: [magia >= 2, incantesimo.rimarginare == 0, rep.velo >= 4]
        costo: 2
        prova: { attributo: mentale, abilita: magia, difficolta: Media }
        successo:
          titolo: Le mani calde
          testo: |
            Su un muratore col polso sbucciato, in infermeria, la pelle si chiude
            in una riga rosa. Quando fai per aprire la cassetta il sacerdote ti
            ferma la mano.
          effetti: { incantesimo.rimarginare: 1 }
        fallimento:
          titolo: Non ancora
          testo: "Il polso del muratore resta sbucciato, e il sacerdote ti rimanda alla preghiera della sera."
          effetti: {}

      - testo: "Veglia, a metà offerta"
        immagine: personaggi/madre-del-velo
        descrizione: "La preghiera della notte, per metà dell'offerta."
        quando: [fazione.velo < 6]
        requisiti: [magia >= 2, incantesimo.veglia == 0, monete >= 15, rep.velo >= 4]
        costo: 2
        prova: { attributo: mentale, abilita: magia, difficolta: Media }
        successo:
          titolo: La notte in navata
          testo: |
            Passi la notte in ginocchio accanto a un novizio, e all'alba lui dorme
            e tu no. Lasci metà dell'offerta.
          effetti: { monete: -15, incantesimo.veglia: 1 }
        fallimento:
          titolo: Non ancora
          testo: "Verso la terza ora ti addormenti sulla panca, e il sacerdote ti sveglia all'alba."
          effetti: {}

      - testo: "Veglia, senza offerta"
        immagine: personaggi/madre-del-velo
        descrizione: "La preghiera della notte, che il Velo non fa pagare ai consacrati."
        quando: [fazione.velo >= 6]
        requisiti: [magia >= 2, incantesimo.veglia == 0, rep.velo >= 4]
        costo: 2
        prova: { attributo: mentale, abilita: magia, difficolta: Media }
        successo:
          titolo: La notte in navata
          testo: |
            Passi la notte in ginocchio accanto a un novizio, e all'alba lui dorme
            e tu no. Il sacerdote non apre la cassetta.
          effetti: { incantesimo.veglia: 1 }
        fallimento:
          titolo: Non ancora
          testo: "Verso la terza ora ti addormenti sulla panca, e il sacerdote ti sveglia all'alba."
          effetti: {}

      - testo: "Esorcismo, a metà offerta"
        immagine: personaggi/madre-del-velo
        descrizione: "Il rito delle cripte, per metà dell'offerta."
        quando: [fazione.velo < 9]
        requisiti: [magia >= 3, incantesimo.esorcismo == 0, monete >= 30, rep.velo >= 6]
        costo: 2
        prova: { attributo: mentale, abilita: magia, difficolta: Difficile }
        successo:
          titolo: Nella cripta
          testo: |
            Nella cripta sotto la scuola reciti il rito finché la fiamma della
            candela smette di piegarsi verso il muro. Lasci metà dell'offerta.
          effetti: { monete: -30, incantesimo.esorcismo: 1 }
        fallimento:
          titolo: Non ancora
          testo: "La fiamma continua a piegarsi verso il muro, e il sacerdote ti riporta su per il gomito."
          effetti: {}

      - testo: "Esorcismo, senza offerta"
        immagine: personaggi/madre-del-velo
        descrizione: "Il rito delle cripte, che il Velo non fa pagare ai custodi dei pozzi."
        quando: [fazione.velo >= 9]
        requisiti: [magia >= 3, incantesimo.esorcismo == 0, rep.velo >= 6]
        costo: 2
        prova: { attributo: mentale, abilita: magia, difficolta: Difficile }
        successo:
          titolo: Nella cripta
          testo: |
            Nella cripta sotto la scuola reciti il rito finché la fiamma della
            candela smette di piegarsi verso il muro. Il sacerdote non guarda
            nemmeno la cassetta.
          effetti: { incantesimo.esorcismo: 1 }
        fallimento:
          titolo: Non ancora
          testo: "La fiamma continua a piegarsi verso il muro, e il sacerdote ti riporta su per il gomito."
          effetti: {}

      - testo: "Il Battito"
        immagine: personaggi/madre-del-velo
        descrizione: "La preghiera della Cripta che porta il cuore al passo del cristallo, gratis per il Custode del Silenzio."
        quando: [fazione.velo >= 15]
        requisiti: [magia >= 4, incantesimo.velo-il-battito == 0, rep.velo >= 8]
        costo: 2
        prova: { attributo: mentale, abilita: magia, difficolta: Molto difficile }
        successo:
          titolo: Il passo del cristallo
          testo: |
            Sul gradino più basso della Cripta, due dita sul polso, ripeti le
            parole di un velato anziano finché il cuore rallenta al passo del
            cristallo. Quando risali le mani ti formicolano fino ai gomiti.
          effetti: { incantesimo.velo-il-battito: 1 }
        fallimento:
          titolo: Il cuore svelto
          testo: "Il cuore resta svelto, e il velato ti dice di tornare quando avrai smesso di avere fretta."
          effetti: {}

  # ------------------------------------------------------------ l'infermeria dei laici
  - id: velo-l-infermeria-dei-laici
    presso: cattedrale-del-velo
    immagine: personaggi/nadja-oresca
    titolo: L'infermeria dei laici
    sommario: "In fondo all'infermeria della navata nord Nadja Oresca tiene due brande pulite per i laici del Velo."
    luogo: Cattedrale del Velo, l'infermeria della navata nord
    area: quartieri-alti
    ripetibile: true
    requisiti: [fazione.velo >= 3]
    testo: |
      Dietro una tenda di lino ci sono due brande per i laici e un catino di
      rame. Nadja Oresca chiede un'offerta piccola, quanto basta per le bende,
      e ti saluta con un proverbio in lingua antica girandosi l'anello di rame
      al dito. Nella stanza accanto c'è la vasca della purificazione dei
      custodi dei pozzi, con l'acqua che sa di resina.
    opzioni:
      - testo: "Farti medicare"
        descrizione: "Una branda, le bende di Nadja e un'ora di riposo, per un'offerta piccola."
        requisiti: [ferite >= 0.5, monete >= 5]
        esito:
          titolo: Le bende di Nadja
          testo: |
            Nadja ti rifà le fasciature lamentandosi di sua madre. Le ferite
            tirano meno, e lasci l'offerta nel catino.
          effetti: { monete: -5, ferite: -1 }

      - testo: "La purificazione dei custodi"
        descrizione: "I custodi dei pozzi scendono dove gli altri non vanno, e il Velo li purifica gratis."
        quando: [fazione.velo >= 9]
        requisiti: [contaminazione >= 0.5]
        esito:
          titolo: L'acqua di resina
          testo: |
            Un velato ti bagna la fronte con l'acqua che sa di resina e ti preme i
            pollici sulle tempie, e il sapore di metallo sotto la lingua se ne va
            quasi del tutto.
          effetti: { contaminazione: -0.5 }

  # ------------------------------------------------------------ la cella nel chiostro
  - id: velo-la-cella-del-chiostro
    presso: cattedrale-del-velo
    immagine: ambientazione/cattedrale-del-velo
    titolo: La cella nel chiostro
    sommario: "I velati della Cripta hanno celle nel chiostro, e una di quelle porte adesso si apre con la tua chiave."
    luogo: Cattedrale del Velo, il chiostro, la cella dei velati
    area: quartieri-alti
    ripetibile: true
    requisiti: [fazione.velo >= 12]
    testo: |
      La cella è stretta, con una branda sotto una finestra alta che dà sui
      Giardini della Linfa; di notte la luce verdina delle piante sale fino
      al soffitto. Sul davanzale c'è un vaso con una talea che brilla
      appena.

      {natura Facile} È una talea del cespuglio vecchio dei Giardini, il
      primo che si accende. Qualcuno la annaffia anche quando la cella è
      vuota.
    opzioni:
      - testo: "Dormire nella cella"
        descrizione: "Una notte nel chiostro, con la luce dei Giardini sul soffitto, gratis per i velati."
        esito:
          titolo: La luce verdina
          testo: |
            Ti svegli al primo rintocco dell'alba, e sul catino qualcuno ha
            lasciato un pezzo di pane. Le ferite tirano meno e la testa è più
            leggera.
          effetti: { ferite: -1, tormento: -0.5 }

  # ------------------------------------------------------------ l'udienza nella Cripta
  - id: velo-l-udienza-nella-cripta
    presso: cattedrale-del-velo
    immagine: personaggi/madre-del-velo
    titolo: L'udienza nella Cripta
    sommario: "Il Custode del Silenzio scende nella Cripta quando vuole, e la Madre qualche volta risponde."
    luogo: Cattedrale del Velo, la Cripta
    area: quartieri-alti
    ripetibile: true
    requisiti: [velo.udienza >= 1]
    testo: |
      Scendi in Cripta con la lama di Kael Dareth al fianco, e i velati si
      scostano. La Madre siede sul seggio di pietra avvolta nei veli, sotto il
      battito lungo del cristallo, e davanti a lei c'è uno sgabello basso su
      cui nessun altro si siede. Aspetta che tu parli.

      {resilienza Media} Quaggiù le voci che ti porti dietro dalle profondità
      si fermano in cima alla scala, come cani che aspettano il padrone fuori
      da una chiesa.
    opzioni:
      - testo: "Sederti ai piedi del seggio"
        descrizione: "Un'ora in silenzio davanti alla Madre, sotto il battito del cristallo."
        requisiti: [tormento >= 0.5]
        esito:
          titolo: Il ritmo lungo
          testo: |
            Nessuno dei due parla. Dopo un po' le mani ti si aprono sulle
            ginocchia e i pensieri si fanno più piccoli, e quando risali la navata
            è piena di luce.
          effetti: { tormento: -1 }

      - testo: "Portarle quello che si dice in città"
        descrizione: "La Madre ascolta tutto, e il Velo paga quello che ascolta."
        requisiti: [informazioni.voce >= 1]
        esito:
          titolo: Le voci della città
          testo: |
            Le racconti quello che si dice per strada, e la sera Sorella Arva ti
            conta qualche moneta sul palmo, segnandola fra le spese della Cripta.
          effetti: { informazioni.voce: -1, monete: 15 }

  # ------------------------------------------------------------ il Battito sulla Marea
  - id: velo-il-battito-sulla-marea
    presso: cattedrale-del-velo
    immagine: fazioni/confraternita-del-velo
    titolo: Il Battito sulla Marea
    sommario: "La preghiera della Cripta porta il cuore al passo del cristallo, e la Marea sotto la pelle si ritira."
    luogo: Cattedrale del Velo, il gradino più basso della Cripta
    area: quartieri-alti
    ripetibile: true
    requisiti: [incantesimo.velo-il-battito >= 1, contaminazione >= 0.5]
    testo: |
      Ti siedi sul gradino più basso della Cripta con due dita sul polso e
      cominci la preghiera. La Marea sotto la pelle è un formicolio freddo
      dietro gli occhi.
    opzioni:
      - testo: "Recitare il Battito"
        incantesimo: velo-il-battito
        descrizione: "Se la preghiera riesce, la Marea si ritira di mezza tacca."
        prova: { attributo: mentale, abilita: magia, difficolta: Media }
        successo:
          titolo: Un battito indietro
          testo: "Il cuore rallenta fino al passo del cristallo, e il formicolio freddo si ritira dalle dita come l'acqua dalla sabbia."
          effetti: { contaminazione: -0.5 }
        fallimento:
          titolo: Il cuore svelto
          testo: "Il cuore non rallenta, e il formicolio resta dov'è."
          effetti: {}

  # ------------------------------------------------------------ i confratelli, in convalescenza e nel delirio
  - id: velo-i-confratelli-in-infermeria
    immagine: personaggi/nadja-oresca
    titolo: I confratelli
    sommario: "Un laico consacrato in infermeria ha sempre accanto Nadja o un novizio."
    luogo: Cattedrale del Velo, l'infermeria
    area: convalescenza
    ripetibile: true
    requisiti: [fazione.velo >= 6]
    testo: |
      Accanto alla tua branda c'è sempre qualcuno. Nadja Oresca passa con le
      bende e un proverbio, i novizi del primo anno ti portano l'infuso, e una
      sera Sorella Giulia ti lascia sul davanzale un vaso di linfa che di
      notte fa una luce verdina.

      {empatia Media} I novizi vengono anche per sé, perché accanto a un
      consacrato ferito si sentono più vicini alla Cripta e più lontani dal
      dormitorio.
    opzioni:
      - testo: "Lasciarti curare dai confratelli"
        descrizione: "Le bende di Nadja e l'infuso dei novizi fanno andare più svelto il recupero."
        prova: { attributo: mentale, abilita: [medicina, resilienza], difficolta: Facile }
        successo:
          titolo: Le mani del Velo
          testo: |
            Bevi l'infuso anche quando sa di aceto, e in due giorni ti alzi da
            solo. Nadja annota qualcosa con un mezzo sorriso.
          effetti: { recupero.convalescenza: 2 }
        fallimento:
          titolo: Il paziente difficile
          testo: |
            Ti alzi troppo presto e Nadja ti rimette giù con un proverbio. Il
            recupero va avanti lo stesso, più piano.
          effetti: { recupero.convalescenza: 1 }

  - id: velo-i-confratelli-nelle-celle
    immagine: ambientazione/cattedrale-del-velo
    titolo: I confratelli
    sommario: "Nelle celle sotto la Cattedrale i velati scendono a dire la Preghiera del Battito accanto a un laico consacrato."
    luogo: Cattedrale del Velo, le celle
    area: delirio
    ripetibile: true
    requisiti: [fazione.velo >= 6]
    testo: |
      Nelle celle le voci non smettono. Ogni sera un velato si siede fuori
      dalla tua porta e dice la Preghiera del Battito a mezza voce, due dita
      sul polso, finché non ti addormenti. A volte è Padre Walter, che la
      dice più piano degli altri.

      {resilienza Media} Quando la preghiera da fuori e le voci da dentro
      vanno allo stesso ritmo, le voci perdono il filo.
    opzioni:
      - testo: "Pregare con chi è fuori dalla porta"
        descrizione: "La Preghiera del Battito a due voci, attraverso la porta, fa andare più svelto il recupero."
        prova: { attributo: mentale, abilita: [resilienza, magia], difficolta: Facile }
        successo:
          titolo: Due voci
          testo: |
            Dici la preghiera insieme al velato, e a metà le voci si confondono e
            tacciono. Dormi fino al mattino senza sogni.
          effetti: { recupero.delirio: 2 }
        fallimento:
          titolo: La voce in più
          testo: |
            A metà preghiera una delle voci comincia a dirla con voi, un attimo in
            ritardo, ma si stanca prima del velato.
          effetti: { recupero.delirio: 1 }
