# La quest della Confraternita del Velo: i nemici e gli scontri. Tarati sulla fase della storia in cui compaiono.
# - Passo 2: gli scagnozzi degli Scuri in Via dei Rasoi (quelli di pelle.yaml).
# - Passo 8, sotto l'Orlo: gli spazzini della notte (come gli sgherri dei Malgrani), i vermi carogna della Foresta e
#   il nato della sacca al cuore (come il cinghiale mutato, con un punto di riduzione).
# - Passo 11, la gola di Tuarmir: i predoni mutati (come gli orchi della razzia) e l'Eco di Serad al cuore (come
#   l'eco del cinghiale dell'Arena, un poco meno forte; Esorcismo gli fa danno doppio).
# - Passo 14, la compieta: Padre Valdrano e l'Eco della compieta, la boss battle (come Aurenne sul ponte). Con
#   Valdrano messo in guardia due volte o più (velo.allarme >= 2) le Eco sono due.
nemici:
  - id: velo-spazzino-della-notte
    immagine: personaggi/grusk
    nome: Spazzino della notte
    descrizione: "Uno degli spazzini senza licenza che di notte scendono sotto l'Orlo a raccattare cristalli sterili. Ha una lanterna cieca e un gancio da rottami, e non ha nessuna voglia di essere visto."
    attacco: 2
    difesa: 2
    difesaMentale: 2
    pf: 10
    danno: 3
    iniziativa: 2
    puoFuggire: true

  - id: velo-nato-della-sacca
    immagine: ambientazione/marea-grigia
    nome: Il nato della sacca
    descrizione: "Qualcosa che la Marea ha messo insieme sul fondo della sacca con ossa di topo e lamiera tenute insieme dal fango grigio. Si muove a scatti e ha la pelle dura come una crosta."
    attacco: 4
    difesa: 3
    difesaMentale: 2
    pf: 13
    danno: 2
    riduzione: 3
    iniziativa: 2

  - id: velo-predone-mutato
    immagine: ambientazione/tuarmir
    nome: Predone della gola
    descrizione: "Uno dei predoni che si nascondono nelle fenditure sotto Tuarmir. Ha respirato il vento nuovo troppo a lungo, e le dita gli sono diventate lunghe e grigie."
    attacco: 3
    difesa: 2
    difesaMentale: 2
    pf: 8
    danno: 2
    riduzione: 2
    iniziativa: 2

  - id: velo-eco-di-serad
    immagine: ambientazione/tuarmir
    nome: L'Eco di Serad
    descrizione: "La forma di un uomo con la tonaca del Velo, fatta di luce sporca, che ripete davanti alla porta gli ultimi gesti di dieci anni fa. Bussa alla porta, aspetta a lungo, poi bussa di nuovo, e se lo interrompi si volta verso di te."
    attacco: 4
    difesa: 3
    difesaMentale: 4
    pf: 21
    danno: 3
    riduzione: 4
    iniziativa: 2
    tratti: [eco]

  - id: velo-valdrano
    immagine: icone/monk-face
    nome: Padre Ermes Valdrano
    descrizione: "Il cronista maggiore della Cattedrale, con il righello di metallo in mano come un'asta. Ha settant'anni e si muove poco, ma ogni parola che dice ti toglie qualcosa."
    attacco: 4
    difesa: 3
    difesaMentale: 5
    pf: 11
    danno: 2
    iniziativa: 3
    magia: 6
    energia: 7
    incantesimi: [maledizione, sussurro-di-paura]

  - id: velo-eco-della-compieta
    immagine: ambientazione/cattedrale-del-velo
    nome: L'Eco della compieta
    descrizione: "La voce che esce dal cristallo rosso e risponde ai salmi con un attimo di ritardo, e poi prende forma sul gradino dell'altare. Ha la sagoma di un sacerdote e la luce grigia della Marea."
    attacco: 4
    difesa: 3
    difesaMentale: 3
    pf: 9
    danno: 2
    riduzione: 1
    iniziativa: 2
    tratti: [eco]
    magia: 4
    energia: 3
    incantesimi: [sussurro-che-svuota]

scontri:
  - { id: velo-pedaggio-degli-scuri, nome: "Il pedaggio di Via dei Rasoi", nemici: [scagnozzo-degli-scuri, scagnozzo-degli-scuri], feriteSconfitta: 2, rinforzo: { danno: 1 } }
  - { id: velo-gli-spazzini, nome: "Gli spazzini della notte", nemici: [velo-spazzino-della-notte, velo-spazzino-della-notte], feriteSconfitta: 2 }
  - { id: velo-il-nato-della-sacca, nome: "Il nato della sacca", nemici: [velo-nato-della-sacca], feriteSconfitta: 3 }
  - { id: velo-i-predoni-della-gola, nome: "I predoni della gola", nemici: [velo-predone-mutato, velo-predone-mutato], feriteSconfitta: 2 }
  - { id: velo-l-eco-di-serad, nome: "L'Eco di Serad", nemici: [velo-eco-di-serad], feriteSconfitta: 3 }
  - { id: velo-la-compieta, nome: "La compieta", nemici: [velo-valdrano, velo-eco-della-compieta], feriteSconfitta: 4 }
  - { id: velo-la-compieta-in-allarme, nome: "La compieta", nemici: [velo-valdrano, velo-eco-della-compieta, velo-eco-della-compieta], feriteSconfitta: 4 }
