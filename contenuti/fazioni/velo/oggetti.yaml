# La quest della Confraternita del Velo: gli oggetti dei gradi e l'incantesimo del grado 5.
# Grado 1 la corda del laico (accessorio +1), grado 2 il sigillo del Velo (accessorio +2), grado 3 la lanterna del
# custode (accessorio +3), grado 4 il velo grigio (accessorio +3 con un difetto), grado 5 una delle due lame di Kael
# Dareth (spada lunga +4, Rumorosa perché canta quando esce dal fodero), più il simbolo dell'Albero in platino per
# chi dice la verità in Consiglio (accessorio +3). Il Battito è la Liturgia di livello 4: lo insegna la Cripta, senza
# offerta, a chi è arrivato in fondo alla quest (servizi.yaml).
oggetti:
  - id: velo-corda-del-laico
    nome: La corda del laico
    immagine: icone/rope-coil
    descrizione: "Una cordicella di canapa con trentadue nodi, uno per ogni trave del soffitto del dormitorio. I laici del Velo la portano alla cintura e ci contano le preghiere, e le mani si ricordano da sole come si stringe una benda."
    slot: accessorio
    grado: 1
    proprieta: { talento: { medicina: 1 } }

  - id: velo-sigillo-del-velo
    nome: Il sigillo del Velo
    immagine: icone/wax-seal
    descrizione: "Un dischetto di bronzo con l'Albero inciso, appeso a un nastro grigio. È il sigillo dei laici consacrati, e alle porte della Cattedrale lo guardano prima di guardare te."
    slot: accessorio
    grado: 2
    proprieta: { talento: { resilienza: 1, persuasione: 1 }, chiave: [velo] }

  - id: velo-lanterna-del-custode
    nome: La lanterna del custode
    immagine: icone/old-lantern
    descrizione: "La lanterna delle garitte del Velo, con il vetro affumicato e una grata di rame davanti alla fiamma. Chi sale dai pozzi ci respira dentro prima di parlare, e la grata trattiene una parte di quello che si porta su."
    slot: accessorio
    grado: 3
    proprieta: { schermata: true, talento: { natura: 1 } }

  - id: velo-velo-grigio
    nome: Il velo grigio
    immagine: icone/hood
    descrizione: "Il velo di chi serve sotto l'altare, grigio come la cenere e lungo fino alle spalle. In Cattedrale chi lo vede abbassa la voce, e fuori qualcuno cambia strada. Le voci che salgono dalla Cripta ci passano attraverso più piano."
    slot: accessorio
    grado: 3
    proprieta: { lucida: true, talento: { empatia: 1, galateo: 1 } }
    difetti: [riconoscibile]

  - id: velo-lama-di-kael
    nome: La lama di Kael Dareth
    immagine: icone/broadsword
    descrizione: "Una delle due lame che Kael Dareth riportò dal Labirinto e consegnò al Velo nel 134. È di acciaio dei Precursori, più leggera di quanto sembri, e quando esce dal fodero canta una nota sola, lunga, che fa voltare chi è vicino."
    slot: arma
    base: spada-lunga
    grado: 4
    dadi: 2
    proprieta: { affilata: 1, penetrante: 1, talento: { resilienza: 1 }, chiave: [kael] }
    difetti: [rumorosa]

  - id: velo-simbolo-in-platino
    nome: Il simbolo dell'Albero in platino
    immagine: icone/sun-priest
    descrizione: "Il simbolo dell'Albero che stava sull'altare del vecchio Santuario, salvato dal fuoco da Padre Vantes insieme alla talea dei Giardini. Ha un ramo annerito. Chi lo porta, quando sbaglia, trova il coraggio di riprovare."
    slot: accessorio
    grado: 3
    proprieta: { secondaScelta: true }

incantesimi:
  - id: velo-il-battito
    nome: Il Battito
    tradizione: albero
    livello: 4
    uso: [combattimento, storie]
    immagine: fazioni/confraternita-del-velo
    descrizione: "La preghiera che si dice in Cripta con due dita sul polso, finché il cuore va al passo del cristallo. In combattimento tu e i tuoi compagni recuperate PF pari ai successi; fuori dal combattimento toglie mezza Contaminazione."
    tipo: cura
    alleati: true
