# La quest della Confraternita del Velo, passi 2, 3 e 5. I passi 1 e 4 stanno in contenuti/citta/cattedrale.yaml.
# - Passo 2 (fazione.velo == 1): la processione dei morti della razzia scende al Cimitero. Con pista.pelle < 6 gli
#   Scuri chiedono il pedaggio in Via dei Rasoi, con pista.pelle >= 6 si passa davanti alle macerie della Pignatta.
#   Al Cimitero il seguito con Padre Valdrano, che inchioda i bollettini delle sacche, chiude il passo.
# - Passo 3 (== 2, grado 1): la riga del bollettino coperta a carboncino, la sacca sotto l'Orlo. Ricostruirla,
#   chiedere a Grusk o fare la guardia di notte apre il seguito in Cattedrale, dove Ottilia scrive il tuo nome nella
#   colonna dei laici.
# - Passo 5 (== 4): chi erano i sei sacerdoti della compieta. Il libro delle prebende di Arva, i fogli dei cantori di
#   Celia, Nadja o il quaderno (velo.copia) aprono il seguito al campanile con Fratello Lauro Bessi, che chiude il
#   passo; se aspetti con lui, confessa di aver strappato la riga (velo.bessi).
storylet:
  # ------------------------------------------------------------ passo 2 · la processione, con gli Scuri
  - id: velo-la-processione-dei-morti
    presso: via-dei-rasoi
    immagine: fazioni/confraternita-del-velo
    titolo: Le campane a lutto
    sommario: "Ottilia ti ha scritto sulla tavoletta per la processione dei morti della razzia, che passa da Via dei Rasoi."
    luogo: Città Bassa, Via dei Rasoi, al gomito della strada
    area: citta-bassa
    requisiti: [fazione.velo == 1, pista.pelle < 6]
    testo: |
      La processione dei morti della razzia scende dalla Cattedrale al
      Cimitero con le campane a lutto, per la strada lunga che attraversa la
      Città Bassa. Padre Vantes cammina in testa, Sorella Celia lo segue
      suonando il liuto, e tu porti uno dei ceri grandi.

      Al gomito di Via dei Rasoi tre uomini degli Scuri sono seduti su una
      panca messa di traverso, e il più giovane lucida una mela. Il più
      vecchio dice a Vantes che il quartiere è loro, e che chi lo attraversa
      con le candele accese paga il pedaggio come i carri. Vantes si ferma, e
      con lui il liuto.

      {intimidire Media} Il giovane della mela guarda il vecchio per sapere
      che cosa fare, e senza il vecchio la panca si sposta da sola.

      {origine figlio-della-citta-bassa} Il vecchio ti conosce da quando
      giocavi sotto i carri, e adesso fa finta di non ricordarsi il tuo nome.
    opzioni:
      - testo: "Pagare il pedaggio"
        descrizione: "È il modo più rapido, e la cera cola."
        requisiti: [monete >= 10]
        esito:
          titolo: Il prezzo dei ceri
          testo: |
            Conti le monete nel palmo del vecchio mentre la processione guarda, e
            lui fa un cenno al ragazzo, che sposta la panca con un piede. Vantes
            riparte senza dirti niente, e a metà della discesa ti posa due dita
            sul polso per qualche passo.
          effetti: { monete: -10 }
          segue: velo-il-cronista-dei-bollettini

      - testo: "Trattare il prezzo"
        descrizione: "Per gli Scuri anche un pedaggio è un affare da discutere."
        prova: { attributo: sociale, abilita: politica-ed-economia, difficolta: Media }
        successo:
          titolo: Il pedaggio dei morti
          testo: |
            Fai notare al vecchio che metà dei ceri li hanno comprati le famiglie
            di Via dei Rasoi, e che far pagare il pedaggio sui propri morti è un
            modo curioso di fare affari. Si accontenta di un paio di monete per la
            panca, e il ragazzo la sposta.
          pe: { politica-ed-economia: 5 }
          effetti: { monete: -2 }
          segue: velo-il-cronista-dei-bollettini
        fallimento:
          titolo: La fila che aspetta
          testo: |
            Discuti finché le candele della fila cominciano a spegnersi, e alla
            fine paga Vantes, con una gentilezza che agli Scuri piace meno di un
            insulto. Lungo la discesa senti i fedeli parlare di te senza fare il
            tuo nome.
          effetti: { scandalo: 1 }
          segue: velo-il-cronista-dei-bollettini

      - testo: "Dirgli di spostarsi"
        descrizione: "Un cero grande, in mano a chi sa usarlo, è anche un bastone."
        prova: { attributo: sociale, abilita: intimidire, difficolta: Media }
        successo:
          titolo: La panca
          testo: |
            Porti la fiamma del cero all'altezza della faccia del vecchio e gli
            dici che la processione passa adesso. Lui si alza con calma, per non
            dare l'idea di avere fretta, e sposta la panca con le sue mani.
          pe: { intimidire: 5 }
          segue: velo-il-cronista-dei-bollettini
        fallimento:
          titolo: La spinta
          testo: |
            Il vecchio ti spinge contro il muro per il bavero, e il cero ti si
            spezza in due fra le mani. Vantes dice una parola sola, e gli Scuri vi
            lasciano passare ridendo.
          effetti: { ferite: 0.5 }
          segue: velo-il-cronista-dei-bollettini

      - testo: "Posare il cero e farti avanti"
        descrizione: "Sono tre, ma il terzo è un ragazzo con una mela."
        combattimento: velo-pedaggio-degli-scuri
        vittoria:
          titolo: La strada libera
          testo: |
            Il secondo finisce disteso sulla panca e la rompe, mentre il ragazzo
            lascia cadere la mela e scappa. Torni in fila con le nocche che
            sanguinano, e da domani in Via dei Rasoi il tuo nome lo sanno.
          effetti: { rep.scuri: -1 }
          segue: velo-il-cronista-dei-bollettini
        sconfitta:
          titolo: La fiamma nel fango
          testo: |
            Ti ritrovi nel fango con il cero spento e il sapore del sangue in
            bocca, e gli Scuri si fanno pagare da Vantes. Una vecchia della fila
            ti aiuta ad alzarti e ti riaccende il cero con la sua candela.
          effetti: { rep.scuri: -0.5 }
          segue: velo-il-cronista-dei-bollettini

      - testo: "Reggere il canto di Celia"
        descrizione: "Se il canto riparte, la fila riparte con lui, e passare sopra una processione che canta è più difficile."
        prova: { attributo: sociale, abilita: espressivita, difficolta: Media }
        successo:
          titolo: Il salmo dei morti
          testo: |
            Attacchi il salmo dei morti a voce piena, e dopo tre note Celia ti
            viene dietro con il liuto, poi la fila. Quando il vecchio si accorge
            di essere l'unico seduto si alza in fretta e se ne va.
          pe: { espressivita: 5 }
          segue: velo-il-cronista-dei-bollettini
        fallimento:
          titolo: La nota storta
          testo: |
            Attacchi il salmo troppo in alto, e alla seconda strofa la voce ti si
            rompe davanti a tutta la Città Bassa. Paga Vantes, e Celia riprende il
            salmo da capo nella tonalità giusta, guardando dritto davanti a sé.
          effetti: { tormento: 1 }
          segue: velo-il-cronista-dei-bollettini

      - testo: "Parlare al vecchio come uno del vicolo"
        descrizione: "Sotto i carri di questa strada ci sei cresciuto, e il vecchio si ricorda di te."
        quando: [origine.figlio-della-citta-bassa >= 1]
        esito:
          titolo: Il nome di tua madre
          testo: |
            Gli parli nel dialetto della strada e gli ricordi la volta che ti ha
            tirato fuori da sotto un carro per un orecchio. Lui sbuffa, si fa dare
            un paio di monete per salvare la faccia e sposta la panca da solo.
          pe: { conoscenze-della-strada: 5 }
          effetti: { monete: -2 }
          segue: velo-il-cronista-dei-bollettini

  # ------------------------------------------------------------ passo 2 · la processione, dopo la Pignatta
  - id: velo-la-processione-sulle-macerie
    presso: macerie-della-pignatta
    immagine: ambientazione/pignatta-grassa
    titolo: Le campane a lutto
    sommario: "Ottilia ti ha scritto sulla tavoletta per la processione dei morti, che passa davanti alle macerie della Pignatta Grassa."
    luogo: Città Bassa, davanti alle macerie della Pignatta
    area: citta-bassa
    requisiti: [fazione.velo == 1, pista.pelle >= 6]
    testo: |
      La processione dei morti della razzia scende dalla Cattedrale al
      Cimitero con le campane a lutto, per la strada lunga che attraversa la
      Città Bassa. Padre Vantes cammina in testa, Sorella Celia lo segue
      suonando il liuto, e tu porti uno dei ceri grandi.

      La strada passa davanti a quello che resta della Pignatta Grassa, dove
      la gente del quartiere guarda passare il Velo a braccia conserte, e un
      uomo si rigira fra le dita una manciata di fango.

      {empatia Media} Ce l'ha con chi è venuto dai Quartieri Alti a piangere
      i morti del suo quartiere, e il fango è per le tonache pulite.

      {origine figlio-della-citta-bassa} Le facce le conosci quasi tutte, e
      qualcuna ti riconosce sotto il cero e fa il conto di chi sei diventato.

      *Se qui ci fermiamo, non ripartiamo più.* Il passo della fila rallenta,
      e il liuto di Celia perde il tempo.
    opzioni:
      - testo: "Tenere il passo"
        descrizione: "Il passo della fila lo tiene chi sta in mezzo, e gli altri gli vengono dietro."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Media }
        successo:
          titolo: Il passo
          testo: |
            Guardi la nuca di Vantes e conti i passi a tempo con la campanella, e
            dopo un po' la fila ti viene dietro e Celia ritrova il tempo. L'uomo
            del fango lascia cadere la manciata e si pulisce le mani sui calzoni.
          pe: { resilienza: 5 }
          segue: velo-il-cronista-dei-bollettini
        fallimento:
          titolo: Il fango sul cero
          testo: |
            Ti volti a guardare le facce lungo il muro, e il fango ti prende sulla
            spalla e schizza sul cero. Riparti con la tonaca macchiata e gli occhi
            di tutto il quartiere addosso.
          effetti: { tormento: 1 }
          segue: velo-il-cronista-dei-bollettini

      - testo: "Benedire le macerie"
        descrizione: "Anche la Pignatta ha avuto i suoi morti, e nessuno del Velo è venuto a dirlo."
        prova: { attributo: sociale, abilita: empatia, difficolta: Media }
        successo:
          titolo: I morti della Pignatta
          testo: |
            Alzi il cero verso i muri anneriti e dici la preghiera dei morti anche
            per quelli della Pignatta, forte perché la senta il cortile. L'uomo
            del fango si toglie il cappello con la mano sporca e per un tratto
            cammina in coda.
          pe: { empatia: 5 }
          effetti: { nomea.citta-bassa: 0.5 }
          segue: velo-il-cronista-dei-bollettini
        fallimento:
          titolo: La preghiera fuori posto
          testo: |
            Attacchi la preghiera, e dal muro una donna ti chiede ad alta voce
            dove era il Velo la notte che la Pignatta bruciava. Torni in fila a
            testa bassa, con quella domanda nelle orecchie fino al Cimitero.
          effetti: { tormento: 1 }
          segue: velo-il-cronista-dei-bollettini

      - testo: "Reggere il canto di Celia"
        descrizione: "Il liuto perde il tempo, e una voce che canta lo ritrova."
        prova: { attributo: sociale, abilita: espressivita, difficolta: Media }
        successo:
          titolo: Il salmo dei morti
          testo: |
            Attacchi il salmo dei morti a voce piena, e dopo tre note Celia ti
            viene dietro. Lungo il muro della Pignatta qualcuno muove le labbra
            sulle parole che sa, e nessuno tira il fango.
          pe: { espressivita: 5 }
          segue: velo-il-cronista-dei-bollettini
        fallimento:
          titolo: La nota storta
          testo: |
            La voce ti si rompe alla seconda strofa, e dal muro arriva una risata
            e poi una manciata di fango sulla tonaca di Celia. Lei riprende il
            salmo nella tonalità giusta e si porta la macchia fino al Cimitero
            senza toccarla.
          effetti: { tormento: 1 }
          segue: velo-il-cronista-dei-bollettini

      - testo: "Fare scudo ai ceri"
        descrizione: "Il fango prima o poi arriverà, ed è meglio che arrivi su di te."
        quando: [nomea.citta-bassa < 0]
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Media }
        successo:
          titolo: La tonaca sporca
          testo: |
            Ti metti fra il muro e la fila e prendi il fango sulla schiena, e i
            ceri passano accesi. Alla terza manciata qualcuno lungo il muro dice
            basta, e l'uomo si ferma con il braccio alzato.
          pe: { atletica: 5 }
          segue: velo-il-cronista-dei-bollettini
        fallimento:
          titolo: I ceri spenti
          testo: |
            Il fango ti arriva in faccia prima che tu riesca a metterti in mezzo,
            e due ceri si spengono. Vantes li riaccende con il suo, uno per uno,
            sotto gli occhi del quartiere.
          effetti: { scandalo: 1 }
          segue: velo-il-cronista-dei-bollettini

      - testo: "Camminare e basta"
        descrizione: "Un passo dopo l'altro fino al Cimitero, e la fila te lo farà pesare."
        costo: 2
        esito:
          titolo: Fino al Cimitero
          testo: |
            Cammini con gli occhi sul selciato e passi davanti alle macerie senza
            guardare nessuno. La fila ci mette il doppio, e al cancello del
            Cimitero hai le spalle rigide come il cero.
          segue: velo-il-cronista-dei-bollettini

      - testo: "Chiamare per nome chi guarda"
        descrizione: "Le facce lungo il muro le conosci, e un nome detto ad alta voce vale una benedizione."
        quando: [origine.figlio-della-citta-bassa >= 1]
        esito:
          titolo: I nomi lungo il muro
          testo: |
            Saluti per nome la gente lungo il muro, la fornaia, il figlio del
            cordaio. L'uomo del fango ti riconosce, lascia cadere la manciata e ti
            chiede una preghiera per suo cognato, morto nella Pignatta quella
            notte. La dici con il cero alto.
          pe: { empatia: 5 }
          effetti: { nomea.citta-bassa: 0.5 }
          segue: velo-il-cronista-dei-bollettini

  # ------------------------------------------------------------ passo 2 · al Cimitero
  - id: velo-il-cronista-dei-bollettini
    presso: cimitero-di-qir-azel
    immagine: ambientazione/cimitero-di-qir-azel
    titolo: Il cronista dei bollettini
    tipo: seguito
    luogo: Cimitero di Qir-Azel, la cappella del cancello
    area: citta-bassa
    requisiti: [fazione.velo == 1]
    testo: |
      Al Cimitero la processione si scioglie fra le tombe. Accanto alla cripta
      di Idrian Sollen brucia una candela quasi arrivata al piattino, accesa
      da qualcuno che non era in processione.

      {percezione Media} Sul gradino ci sono le gocce di cera di molte altre
      candele, una sopra l'altra. Qualcuno ne lascia una qui ogni giorno.

      Sulla porta della cappella del cancello un sacerdote anziano inchioda
      una pergamena lunga con un martelletto, i chiodi fra le labbra. Ha la
      tonaca grigia dei cronisti e un righello di bosso infilato alla cintura
      come una spada da cerimonia.

      «Sai leggere?» chiede, togliendosi i chiodi di bocca. «Allora mi servi.
      Io sono Padre Ermes Valdrano, e questi sono i bollettini delle sacche.»
      Ti mostra un fascio di pergamene legate con lo spago. «Vanno sulle porte
      delle cappelle e agli angoli dei mercati, uno per strada. La gente li
      legge e sa dove non mandare i figli a giocare.»

      {origine accolito-del-velo} Il cronista maggiore, in tutti i tuoi anni
      da novizio, non ti ha mai rivolto la parola. Adesso ti sorride come a un
      vecchio conoscente.

      {politica-ed-economia Facile} Un bollettino delle sacche è una mappa di
      quello che in Città Bassa vale meno. Chi lo scrive sa prima degli altri
      dove scenderanno gli affitti.
    opzioni:
      - testo: "Prendere il fascio di bollettini"
        descrizione: "I bollettini vanno inchiodati ben tesi, domani prima del mercato."
        esito:
          titolo: Uno per strada
          testo: |
            Valdrano ti mette in mano il fascio e il martelletto e ti spiega dove
            vanno, porta per porta, senza guardare nessuna mappa. «I chiodi li
            compri tu, e Sorella Arva te li rimborsa, se glieli porti contati»
            dice, ridendo piano nel naso.
          pe: { accademiche: 2 }
          effetti: { fazione.velo: 1, rep.velo: 0.5 }

      - testo: "Chiedergli della candela accanto alla cripta"
        descrizione: "Il cronista sa sempre tutto di tutti, anche di quella candela."
        esito:
          titolo: Un uomo di abitudini
          testo: |
            «Padre Walter» dice Valdrano, senza voltarsi. «Ne accende una ogni
            giorno, da dopo la razzia. Le abitudini sono la cosa più facile da
            scrivere.» Ti mette in mano il fascio di bollettini e il martelletto.
            «Domani, prima del mercato. Uno per strada.»
          pe: { percezione: 2 }
          effetti: { fazione.velo: 1, rep.velo: 0.5 }

      - testo: "Chiedergli della riga coperta a carboncino"
        descrizione: "Sul bollettino della Città Bassa qualcuno ha coperto la riga della sacca sotto l'Orlo."
        quando: [visto.carta-bollettino >= 1]
        esito:
          titolo: La Gilda
          testo: |
            Valdrano batte due colpetti con l'unghia sul righello. «La Gilda»
            dice. «Lo fanno ogni anno, con le sacche vicine ai loro magazzini. Io
            riscrivo, loro cancellano.» Ti mette in mano il fascio e il
            martelletto. «Domani ricominciamo, prima del mercato.»

            {ingannare Difficile} Ha risposto prima che finissi la domanda, come
            se l'aspettasse da giorni.
          pe: { accademiche: 2 }
          effetti: { fazione.velo: 1, rep.velo: 0.5 }

      - testo: "Salutarlo come cronista maggiore"
        descrizione: "In Cattedrale ti hanno insegnato i titoli di tutti, anche quelli che nessuno usa più."
        quando: [origine.accolito-del-velo >= 1]
        esito:
          titolo: Il titolo vecchio
          testo: |
            Lo saluti con il titolo intero, cronista maggiore della Cattedrale e
            custode delle misure, e lui si ferma con il martelletto a mezz'aria.
            Quel titolo, dice, lo usa solo Ottilia quando è di cattivo umore. Ti
            mette in mano il fascio di bollettini e il martelletto, guardandoti le
            mani come per ricordarsele.
          pe: { galateo: 2 }
          effetti: { fazione.velo: 1, rep.velo: 0.5 }

  # ------------------------------------------------------------ passo 3 · la riga coperta (grado 1)
  - id: velo-il-carboncino
    immagine: ambientazione/citta-bassa
    titolo: I bollettini delle sacche
    sommario: "Il giorno dopo, sul bollettino della Città Bassa una riga è già sparita sotto il carboncino."
    luogo: Città Bassa, la porta di una cappella sul mercato
    area: citta-bassa
    requisiti: [fazione.velo == 2]
    testo: |
      Hai inchiodato i bollettini prima del mercato, ben tesi come voleva
      Valdrano. Il giorno dopo, davanti alla cappella del mercato, c'è la
      solita piccola folla che cerca il nome della propria strada sperando di
      non trovarlo.

      A metà della pergamena una riga è sparita sotto una passata di
      carboncino, fatta senza fretta, dritta da un capo all'altro come se ci
      fosse stato sotto un righello. Di sbieco si vede ancora l'inchiostro. È
      la riga della sacca sotto l'Orlo dei Rottami.

      {politica-ed-economia Media} All'Orlo lavorano gli spazzini con la
      licenza della Gilda. Una sacca sul bollettino vuol dire meno gente sulla
      spiaggia dei rottami, e meno affari.

      {origine accolito-del-velo} Il righello lo usano i cronisti del chiostro
      per tirare i bollettini. Te lo dici, e subito dopo ti dici che un
      righello lo può comprare chiunque.

      Un ragazzino ti tira la manica e ti chiede se la riga nera vuol dire che
      lì si può andare a giocare. Gli dici di no, più forte del necessario.
    opzioni:
      - testo: "Ricostruire la riga"
        descrizione: "Il carboncino copre l'inchiostro, ma con la luce radente il solco della penna si legge."
        prova: { attributo: mentale, abilita: [accademiche, natura], difficolta: Facile }
        successo:
          titolo: Il solco della penna
          testo: |
            Con la luce di traverso le lettere tornano fuori dal nero una alla
            volta, e dicono la sacca sotto l'Orlo dei Rottami, segnalata otto
            giorni fa, senza profondità. Dopo la data c'è un trattino minuscolo
            che sui bollettini non hai mai visto.
          pe: { accademiche: 3 }
          segue: velo-la-colonna-dei-laici
        fallimento:
          titolo: Il pollice nero
          testo: |
            Passi il pollice sul carboncino e lo spalmi su mezza riga, che adesso
            non si legge più. Il ragazzino ti guarda con disapprovazione.
          effetti: { tormento: 0.5 }

      - testo: "Ricordare la riga che hai già letto"
        descrizione: "Sul vecchio bollettino l'hai ricostruita con l'unghia, ed era la stessa sacca."
        quando: [visto.carta-bollettino >= 1]
        costo: 0
        esito:
          titolo: La stessa riga
          testo: |
            È la stessa sacca che avevi letto sotto il carboncino del vecchio
            bollettino, coperta con la stessa mano ferma. Allora avevi pensato a
            un caso, ma adesso le volte sono due, e il bollettino è nuovo di ieri.
          segue: velo-la-colonna-dei-laici

      - testo: "Chiedere a Grusk"
        descrizione: "Grusk lavora all'Orlo da sempre e sa chi ci scende di notte, se lo preghi."
        immagine: personaggi/grusk
        prova: { attributo: sociale, abilita: [persuasione, conoscenze-della-strada], difficolta: Media }
        successo:
          titolo: La carriola rossa
          testo: |
            Trovi Grusk sulla spiaggia dei rottami, seduto sulla sua carriola
            rossa. Gli spazzini della Gilda, dice, il carboncino non sanno neanche
            dove si compra. Poi abbassa la voce e ti racconta che di notte dal
            pozzo di scolo dietro la sua baracca scende uno con la tonaca grigia,
            e risale prima dell'alba.

            {ingannare Media} Grusk beve, ma su questo non sta inventando.
          pe: { persuasione: 3 }
          segue: velo-la-colonna-dei-laici
        fallimento:
          titolo: Un altro giro
          testo: |
            Alla terza bottiglia Grusk ti racconta di un dente d'oro trovato in un
            barile. Della riga non sa niente, o non ricorda più di saperlo.
          effetti: { monete: -2, scandalo: 0.5 }

      - testo: "Comprare il silenzio di Grusk con un segreto"
        descrizione: "Grusk compra quello che non sa, e un segreto vale più di una bottiglia."
        immagine: personaggi/grusk
        requisiti: [informazioni.segreto >= 1]
        esito:
          titolo: Uno scambio
          testo: |
            Gli racconti all'orecchio una cosa che sai, e Grusk se la gira in
            bocca come un sorso di vino buono. In cambio ti dice che di notte dal
            pozzo di scolo dietro la sua baracca scende uno con la tonaca grigia,
            e risale prima dell'alba.
          effetti: { informazioni.segreto: -1 }
          segue: velo-la-colonna-dei-laici

      - testo: "Fare la guardia al bollettino di notte"
        descrizione: "Chi copre una riga torna a coprire quella riscritta."
        costo: 2
        esito:
          titolo: La tonaca grigia
          testo: |
            Riscrivi la riga e aspetti nel portone di fronte. Verso la seconda ora
            una figura con la tonaca grigia del Velo, di spalle, appoggia qualcosa
            di lungo e dritto sotto la riga e la copre con tre passate lente.
            Quando ti alzi è già sparita nel vicolo.
          pe: { furtivita: 3 }
          segue: velo-la-colonna-dei-laici

      - testo: "Chiedere ai banchi della Gilda chi ha pagato il carboncino"
        descrizione: "Quando la Gilda fa sparire una sacca paga qualcuno, e ai banchi lo sanno sempre."
        quando: [origine.mercante-dei-ponti >= 1]
        esito:
          titolo: Nessuno ha pagato
          testo: |
            Ai banchi della Gilda ti dicono che gli altri anni il carboncino sulle
            sacche lo pagava il magazzino più vicino. Quest'anno nessuno ha pagato
            niente, e all'Orlo la Gilda non ha magazzini. Qualcuno ha coperto la
            riga gratis.
          pe: { politica-ed-economia: 3 }
          segue: velo-la-colonna-dei-laici

  - id: velo-la-colonna-dei-laici
    presso: cattedrale-del-velo
    immagine: personaggi/ottilia-sanvel
    titolo: La colonna dei laici
    tipo: seguito
    luogo: Cattedrale del Velo, i tavoli dei cronisti e la tavoletta di cera
    area: quartieri-alti
    requisiti: [fazione.velo == 2]
    testo: |
      Trovi Padre Valdrano ai tavoli lunghi del chiostro, fra i cronisti che
      copiano i registri. Prima che tu apra bocca ti riempie una tazza dalla
      teiera di coccio, e ascolta la storia della riga bevendo a piccoli
      sorsi.

      «La Gilda» dice. «Lo fanno ogni anno, con le sacche vicine ai loro
      affari. Io riscrivo e loro cancellano, e così passiamo l'inverno.» Si
      tocca il righello alla cintura con due dita. «La riscrivo stasera.
      Grazie, figliolo. Hai l'occhio buono.»

      {percezione Difficile} Il righello è di bosso, con gli spigoli consumati
      e un'ombra nera lungo un lato, come di carbone passato e ripassato.

      Accanto alla sagrestia Ottilia Sanvel ti aspetta alla tavoletta di cera,
      con lo stilo in mano. Sotto i lavori del giorno c'è una colonna che non
      avevi mai notato, *laici*, con una decina di nomi nella sua grafia
      piccola e diritta.

      {origine accolito-del-velo} Il tuo nome su questa tavoletta l'hai visto
      per anni nella colonna dei novizi, e la mano di Ottilia ci va da sola
      prima di correggersi.
    opzioni:
      - testo: "Lasciare la riga a Valdrano"
        descrizione: "È il suo bollettino, e ha detto che la riscrive stasera."
        esito:
          titolo: Laico della tavoletta
          testo: |
            Ottilia scrive il tuo nome in fondo alla colonna dei laici e ti mette
            in mano la cordicella di canapa con trentadue nodi che i laici portano
            alla cintura. «Negli archivi minori mi servono mani pulite» dice.
            «Quando sarà il momento, te lo scrivo qui.» La sera Sorella Arva ti
            conta la paga di benvenuto, facendoti capire che è un'eccezione.
          effetti: { fazione.velo: 1, oggetto.velo-corda-del-laico: 1, monete: 30, informazioni.voce: 1 }
          almeno: { rep.velo: 2 }

      - testo: "Denunciare gli spazzini dell'Orlo alla Gilda"
        descrizione: "Se a cancellare le sacche è la Gilda, agli spazzini dell'Orlo costerà la licenza."
        esito:
          titolo: La lettera alla Gilda
          testo: |
            Ottilia mette il sigillo del Velo sotto la tua lettera alla Gilda, e
            gli spazzini dell'Orlo perderanno la licenza per un mese. Poi scrive
            il tuo nome fra i laici e ti dà la cordicella con trentadue nodi.
            «Negli archivi minori mi servono mani pulite. Quando sarà il momento,
            te lo scrivo qui.» La sera Arva ti conta la paga di benvenuto.
          effetti: { fazione.velo: 1, oggetto.velo-corda-del-laico: 1, monete: 30, informazioni.voce: 1, rep.gilda: -0.5, rep.velo: 0.5 }
          almeno: { rep.velo: 2 }

      - testo: "Tenere una copia della riga per te"
        descrizione: "Valdrano la riscrive stasera, ma una copia in tasca non fa male a nessuno."
        esito:
          titolo: Una riga in tasca
          testo: |
            Copi sul quaderno la riga della sacca con la data e il trattino
            minuscolo, e Valdrano ti vede e sorride. Poi Ottilia scrive il tuo
            nome fra i laici e ti dà la cordicella con trentadue nodi. «Negli
            archivi minori mi servono mani pulite. Quando sarà il momento, te lo
            scrivo qui.» La sera Arva ti conta la paga di benvenuto.
          effetti: { fazione.velo: 1, oggetto.velo-corda-del-laico: 1, monete: 30, informazioni.voce: 1 }
          almeno: { rep.velo: 2 }

  # ------------------------------------------------------------ passo 5 · le firme della compieta
  - id: velo-le-firme-della-compieta
    presso: cattedrale-del-velo
    immagine: ambientazione/cattedrale-del-velo
    titolo: Le firme della compieta
    sommario: "Sei sacerdoti hanno firmato la compieta la notte dell'incendio e sono usciti, e in Cattedrale qualcuno sa chi erano."
    luogo: Cattedrale del Velo, la navata e il chiostro
    area: quartieri-alti
    requisiti: [fazione.velo == 4]
    testo: |
      Da quando hai visto l'ultimo foglio del registro, in Cattedrale guardi
      le mani dei sacerdoti anziani, come se le sei firme della compieta si
      potessero riconoscere dalle dita. Quei sei sono usciti prima del fuoco,
      mentre Ottilia contava sulla porta chi riusciva a scappare.

      Il libro delle prebende del Santuario ce l'ha Sorella Arva, chiuso in
      una cassa che lei chiama la dispensa, e lo apre volentieri a chi ha
      bisogno di un piccolo prestito. Sorella Celia tiene i fogli dei
      cantori, dove i sacerdoti si firmavano per le ore cantate. Nadja
      Oresca, in infermeria, sa tutto di tutti.
    opzioni:
      - testo: "Firmare il prestito di Sorella Arva"
        descrizione: "Arva presta qualche moneta, si tiene subito gli interessi e apre la dispensa."
        immagine: icone/coins
        requisiti: [monete >= 8]
        esito:
          titolo: La dispensa
          testo: |
            Arva ti conta in mano qualche moneta e se ne riprende subito una parte
            per gli interessi. Nel libro delle prebende del 145, che odora di
            canfora, i sei nomi ci sono tutti, con una nota a margine sull'anno
            dopo.
          effetti: { monete: -8 }
          segue: velo-il-campanile

      - testo: "Leggere il libro delle prebende con Arva"
        descrizione: "Se tieni dietro ai conti di Arva, il libro lo apre senza prestiti."
        prova: { attributo: mentale, abilita: politica-ed-economia, difficolta: Media }
        successo:
          titolo: I conti del 145
          testo: |
            Le fai le domande giuste sulla differenza fra una prebenda e un
            beneficio, e alla fine Arva apre la cassa per mostrarti come si faceva
            bene. I sei nomi della compieta sono lì in colonna, con una nota a
            margine sull'anno dopo.
          pe: { politica-ed-economia: 5 }
          segue: velo-il-campanile
        fallimento:
          titolo: Il beneficio
          testo: |
            Alla terza volta che le chiedi di ripetere la differenza fra prebenda
            e beneficio, Arva ti guarda con molta compassione e ti propone un
            piccolo prestito, per carità.
          effetti: { scandalo: 0.5 }

      - testo: "Sfogliare i fogli dei cantori con Celia"
        descrizione: "Nelle ore cantate i sacerdoti firmavano i fogli dei canti, e Celia li conserva."
        immagine: personaggi/sorella-celia
        prova: { attributo: sociale, abilita: [galateo, espressivita], difficolta: Facile }
        successo:
          titolo: Le firme dei cantori
          testo: |
            Celia ti apre la custodia dei fogli dei canti canticchiando le
            melodie. Le sei firme della compieta del 145 tornano su parecchi
            fogli, e Celia sa dirti chi aveva la voce bassa e chi stonava, finché
            all'ultimo foglio la melodia le si ferma in gola.
          pe: { galateo: 5 }
          segue: velo-il-campanile
        fallimento:
          titolo: Il nastro
          testo: |
            Un foglio ti si strappa sull'angolo, e Celia lo liscia sul ginocchio e
            ripone la custodia. Mentre si allontana tormenta con le dita un nastro
            nuovo al polso.
          effetti: { scandalo: 0.5 }

      - testo: "Ascoltare Nadja in infermeria"
        descrizione: "Dei sacerdoti vecchi Nadja sa le malattie, e anche dove abitano."
        immagine: personaggi/nadja-oresca
        prova: { attributo: sociale, abilita: [empatia, medicina], difficolta: Media }
        successo:
          titolo: Le malattie dei vecchi
          testo: |
            Mentre la aiuti fra le brande, Nadja si gira l'anello di rame intorno
            al dito e parla. Due dei sacerdoti di allora li ha accompagnati lei
            all'ultima benedizione, uno se n'è andato dall'ordine, e gli altri li
            vedi ogni giorno.
          pe: { empatia: 5 }
          segue: velo-il-campanile
        fallimento:
          titolo: Il proverbio
          testo: |
            Nadja ti manda a vuotare un catino, e quando torni parla di sua madre.
            Alla tua domanda risponde con un proverbio in lingua antica.
          effetti: { scandalo: 0.5 }

      - testo: "Rileggere i sei nomi del quaderno"
        descrizione: "Li hai copiati negli archivi minori, e basta metterli in fila con quello che si dice in Cattedrale."
        quando: [velo.copia >= 1]
        costo: 0
        esito:
          titolo: Fra due conti della spesa
          testo: |
            Ci lavori sopra per una sera, facendo le domande una per volta e mai
            alla stessa persona, finché di ogni nome sai dove abita o dove è
            sepolto. La dispensa di Arva non ti è servita.
          segue: velo-il-campanile

  - id: velo-il-campanile
    presso: cattedrale-del-velo
    immagine: ambientazione/cattedrale-del-velo
    titolo: Il campanile
    tipo: seguito
    luogo: Cattedrale del Velo, la cella delle campane
    area: quartieri-alti
    requisiti: [fazione.velo == 4]
    testo: |
      Dei sei nomi, due sono morti. Sorella Alenna è a Tuarmir da otto mesi, a
      controllare le erbe che il Velo compra, e Silvano Ardice ha lasciato
      l'ordine l'anno dopo il fuoco e predica in Città Bassa su una cassetta
      rovesciata. In Cattedrale restano Padre Ermes Valdrano e il campanaro,
      Fratello Lauro Bessi.

      In cima ai centoquattro gradini del campanile Bessi siede sotto la
      campana grande con un pezzo di pane in mano e l'occhio alla feritoia da
      cui si vede l'altare. Quando gli dici del registro il pane gli cade
      sulle ginocchia.

      «Ci chiamarono fuori per un rito votivo, sull'orlo della Cicatrice, a
      mezzanotte» dice, alla feritoia più che a te. «La Cicatrice era scura.»
      Si gratta il polso fino a farlo diventare rosso, e chi li chiamò non lo
      dice.

      {empatia Media} Guarda l'altare come se dovesse suonare l'ora da un
      momento all'altro, e sbagliarla.
    opzioni:
      - testo: "Insistere"
        descrizione: "Bessi sa chi li chiamò sull'orlo, e lassù non può scappare."
        prova: { attributo: sociale, abilita: intimidire, difficolta: Media }
        successo:
          titolo: Il tavolo della compieta
          testo: |
            Gli stai addosso finché ammette che firmarono la compieta tutti e sei
            allo stesso tavolo e uscirono insieme dalla porta della sagrestia. Poi
            suona l'ora con un quarto d'anticipo, e la campana ti riempie la testa
            finché non scendi.
          pe: { intimidire: 5 }
          effetti: { fazione.velo: 1, rep.velo: 0.5 }
        fallimento:
          titolo: La campana
          testo: |
            Più insisti, più Bessi si chiude, finché afferra la corda e suona
            l'ora con un quarto d'anticipo. Scendi i centoquattro gradini con le
            orecchie che fischiano.
          effetti: { fazione.velo: 1, rep.velo: 0.5, tormento: 1 }

      - testo: "Aspettare con lui l'ora dopo"
        descrizione: "Se resti finché la campana suona, forse dopo parla."
        costo: 2
        esito:
          titolo: La riga a matita
          testo: |
            Dividete il pane seduti sul pavimento. Quando il cristallo pulsa in
            navata Bessi suona l'ora giusta, e dopo un po' ti racconta che la riga
            a matita del registro, quella con l'ora in cui i sacerdoti uscirono,
            l'ha strappata lui la mattina dopo. «Perché l'ora la sapevo a memoria,
            e nessuno me l'ha mai chiesta» dice alla feritoia.
          pe: { empatia: 5 }
          imposta: { velo.bessi: 1 }
          effetti: { fazione.velo: 1, rep.velo: 0.5 }

      - testo: "Lasciarlo alle sue campane"
        descrizione: "Ha già detto più di quanto volesse, e il resto può aspettare."
        esito:
          titolo: Il pane
          testo: |
            Gli rimetti in mano il pane, e lui ti ringrazia con un cenno senza
            staccare l'occhio dalla feritoia. Al centesimo gradino senti la
            campana suonare l'ora sopra la tua testa, giusta al rintocco.
          pe: { resilienza: 5 }
          effetti: { fazione.velo: 1, rep.velo: 0.5 }

      - testo: "Riconoscere la sua firma"
        descrizione: "Una delle sei firme ha il giro di penna dei cantori, che da novizio ti hanno insegnato."
        quando: [origine.accolito-del-velo >= 1]
        costo: 0
        esito:
          titolo: Il giro di penna
          testo: |
            Gli dici che una delle firme della compieta ha il giro di penna dei
            cantori, che in Cattedrale usa ancora uno solo. Bessi ti guarda le
            mani a lungo, poi ti racconta che la riga a matita del registro,
            quella con l'ora in cui i sacerdoti uscirono, l'ha strappata lui la
            mattina dopo. «Perché l'ora la sapevo a memoria, e nessuno me l'ha mai
            chiesta» dice alla feritoia.
          pe: { accademiche: 5 }
          imposta: { velo.bessi: 1 }
          effetti: { fazione.velo: 1, rep.velo: 0.5 }
