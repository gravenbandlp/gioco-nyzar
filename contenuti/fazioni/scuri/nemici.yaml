# I nemici della quest degli Scuri. Tarati sugli Scuri e sui mercenari della fine del capitolo
# (contenuti/nemici/pelle.yaml, arena.yaml): i passi "prima" si giocano a metà capitolo, quelli "dopo" alla fine.
# - I mercenari di Ghoran senza paga (passi 4 "dopo", 10, 12, 15) e Durgan, il boss del passo 15 (Difficile).
# - Le Vie di Sotto (passo 5): contrabbandieri, cappucci del Velo e la Salvaguardia ruotata del cuore (boss).
# - La Casa dei Nodi di notte (passo 11): i balestrieri della Gilda (contenuti/nemici/registro-tribu.yaml) e
#   Varn Kett al cuore (boss).
# - I miliziani della Caserma (passo 14, se l'ingresso di notte va storto).
nemici:
  - id: scuri-mercenario-di-ghoran
    immagine: ambientazione/ghoran
    nome: Mercenario di Ghoran
    descrizione: "Un uomo dei clan con le orecchie piene di anelli di rame e la lancia corta. La paga non la vede da settimane, e il gettone d'argilla lo considera un diritto."
    attacco: 3
    difesa: 3
    difesaMentale: 2
    pf: 8
    danno: 3
    riduzione: 3
    iniziativa: 2
    puoFuggire: true

  - id: scuri-durgan
    immagine: fazioni/scuri
    nome: Durgan
    descrizione: "Il nano delle cicatrici, con l'ascia sulla spalla come un attrezzo da lavoro. Nel cerchio di gesso non apre bocca, e aspetta che sia tu a fare il primo passo."
    attacco: 4
    difesa: 3
    difesaMentale: 3
    pf: 12
    danno: 3
    riduzione: 1
    iniziativa: 1

  - id: scuri-contrabbandiere
    immagine: ambientazione/mercato-delle-ombre
    nome: Contrabbandiere senza banda
    descrizione: "Uno che porta casse sotto la Città Bassa per conto suo e non paga la porta a nessuno. Ha un coltello da cordaio e la lanterna cieca appesa al collo."
    attacco: 3
    difesa: 2
    difesaMentale: 2
    pf: 9
    danno: 2
    iniziativa: 2
    puoFuggire: true

  - id: scuri-cappuccio-del-velo
    immagine: fazioni/confraternita-del-velo
    nome: Cappuccio del Velo
    descrizione: "Uno degli uomini che la Confraternita tiene sulle sue porte del Mercato. Combatte con un bastone ferrato e non mostra mai il viso."
    attacco: 3
    difesa: 3
    difesaMentale: 3
    pf: 8
    danno: 2
    riduzione: 2
    iniziativa: 2
    puoFuggire: true

  - id: scuri-salvaguardia-ruotata
    immagine: bestiario/salvaguardia-precursori
    nome: La Salvaguardia delle nove colonne
    descrizione: "Una macchina dei Precursori alta due volte un uomo, con la testa girata all'indietro e le braccia montate al contrario. Dormiva da secoli fra le colonne, e si sveglia girando su sé stessa."
    attacco: 5
    difesa: 3
    difesaMentale: 5
    pf: 30
    danno: 3
    riduzione: 2
    iniziativa: 2

  - id: scuri-varn-kett
    immagine: personaggi/varn-kett
    nome: Varn Kett
    descrizione: "L'ispettore dei dazi, con il cappotto color tabacco e la spada della milizia che non ha mai restituito. Vent'anni di ronde gli hanno insegnato a non avere fretta."
    attacco: 5
    difesa: 4
    difesaMentale: 3
    pf: 16
    danno: 3
    riduzione: 1
    iniziativa: 3

  - id: scuri-miliziano
    immagine: ambientazione/guarnigione-di-qir-azel
    nome: Miliziano della Caserma
    descrizione: "Una guardia di turno nel cortile della Caserma, con il mantello scarlatto e la mazza corta. Ha più voglia di chiamare il sergente che di combattere."
    attacco: 3
    difesa: 3
    difesaMentale: 2
    pf: 8
    danno: 2
    riduzione: 3
    iniziativa: 2
    puoFuggire: true

scontri:
  - { id: scuri-la-porta-di-servizio, nome: "I riscossori alla porta di servizio", nemici: [scuri-mercenario-di-ghoran, scuri-mercenario-di-ghoran], feriteSconfitta: 2 }
  - { id: scuri-la-galleria-delle-casse, nome: "La galleria delle casse", nemici: [scuri-contrabbandiere, scuri-contrabbandiere], feriteSconfitta: 2 }
  - { id: scuri-i-cappucci, nome: "I cappucci del Velo", nemici: [scuri-cappuccio-del-velo, scuri-cappuccio-del-velo], feriteSconfitta: 2 }
  - { id: scuri-la-sala-delle-nove-colonne, nome: "La sala delle nove colonne", nemici: [scuri-salvaguardia-ruotata], feriteSconfitta: 4 }
  - { id: scuri-la-strada-dei-gettoni, nome: "La strada dei gettoni", nemici: [scuri-mercenario-di-ghoran, scuri-mercenario-di-ghoran], feriteSconfitta: 2 }
  - { id: scuri-la-ronda-dei-balestrieri, nome: "La ronda dei balestrieri", nemici: [balestriere-della-gilda, balestriere-della-gilda], feriteSconfitta: 2, rinforzo: { pf: 6, danno: 2 } }
  - { id: scuri-la-cassaforte-dei-timbri, nome: "Varn Kett alla cassaforte", nemici: [scuri-varn-kett, balestriere-della-gilda, balestriere-della-gilda], feriteSconfitta: 4, rinforzo: { pf: 2, danno: 1, riduzione: 2, solo: [balestriere-della-gilda] } }
  - { id: scuri-la-porta-piu-debole, nome: "La porta più debole", nemici: [scuri-mercenario-di-ghoran, scuri-mercenario-di-ghoran, scuri-mercenario-di-ghoran], feriteSconfitta: 3 }
  - { id: scuri-il-cortile-della-caserma, nome: "Il cortile della Caserma", nemici: [scuri-miliziano, scuri-miliziano], feriteSconfitta: 3 }
  - { id: scuri-il-cerchio-di-gesso, nome: "Il cerchio di gesso", nemici: [scuri-durgan, scuri-mercenario-di-ghoran, scuri-mercenario-di-ghoran], feriteSconfitta: 4 }
  - { id: scuri-il-cerchio-con-squiggor, nome: "Il cerchio di gesso", nemici: [scuri-durgan, squiggor-ironfist, scuri-mercenario-di-ghoran], feriteSconfitta: 4, rinforzo: { pf: 4, danno: 2, solo: [squiggor-ironfist] } }
