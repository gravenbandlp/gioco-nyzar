# La quest degli Scuri, passi 6-10 (fazione.scuri 5 → 10).
# 6 Le chiavi vecchie (grado 2), alla Caserma. Prima: il ragazzo che faceva il palo in Via dei Rasoi è in cella, e
#   Vesh lo vuole fuori prima che parli (Borso guarda altrove, la porta la apre qualcun altro; con galdrick.via 1 il
#   cambio della guardia è più facile). Dopo: Mauro in attesa del processo (mauro 0 o 1) o, se è morto, Nestor in
#   catene, che sa dov'è la seconda dispensa e può dare la ricetta della pasta nera (scuri.nestor).
# 7 Il tavolo di Mirko. Prima: Vesh nel cortile delle risse, che ha capito che il tempo dei profili bassi è finito, e
#   il messaggio a voce per Ottone Malgrani al mulino (seguito). Con il registro dei Malgrani negli Averi Vesh ne
#   vuole una copia. Dopo: gli anelli tornati ai debitori, e i debiti di chi li riscuote per primo.
# 8 Prima della prossima luna, con Gaia. Prima: Vesh l'ha condannata e vuole che sia tu a sistemare la cosa; nessuna
#   strada la fa sparire (gaia 2 se l'avverti o la porti da Galdrick). Dopo: Gaia ha riconosciuto il segno dei
#   gettoni, il marchio di un clan di Ghoran che ha anche lei sotto la spalla, e vuole sparire.
# 9 L'ultimo ordine (grado 3) e il bivio con la Caserma (bivio.legge). Prima: la cantina della Pignatta il pomeriggio
#   dell'assalto (pista.pelle == 5), Vesh ti dà le tre chiavi. Dopo: la veglia olvara per Vesh alla Locanda di Ilka,
#   dove entra Durgan. In tutte e due la scena d'ingresso porta bivio.legge a 2 (con la scelta in scena e rep.caserma
#   −2 se la quest della Caserma è cominciata, oppure la Caserma, con bivio.legge 1 e rep.scuri −2); il seguito chiude
#   il passo. La veglia olvara è un'invenzione misurata: la sedia vuota del morto, il sidro, i debiti detti a voce.
# 10 Il gettone d'argilla (bivio.legge == 2): la guerra con Durgan comincia. Hagra (scuri.hagra) si può staccare da
#   lui se i trenta di Ghoran sono finiti bene (guarnigione.mercenari).
storylet:
  # ------------------------------------------------------------ 6 · le chiavi vecchie, prima di Vesh (grado 2)
  - id: scuri-le-chiavi-vecchie
    presso: guarnigione-di-qir-azel
    immagine: personaggi/borso
    titolo: Le chiavi vecchie
    sommario: "Un ragazzo degli Scuri è in una cella della Caserma, e Mirko Vesh lo vuole fuori prima che parli. Borso guarderà altrove."
    luogo: Guarnigione di Qir-Azel, il cortile e le celle
    area: quartieri-alti
    requisiti: [fazione.scuri == 5, pista.pelle < 4]
    testo: |
      Il ragazzo che faceva il palo in Via dei Rasoi l'hanno preso una sera di pioggia, e sta in una cella del
      piano interrato della Caserma. Ha la lingua lunga, e a Mirko le lingue lunghe nelle celle non piacciono.
      Mauro te lo spiega al bancone con un fico secco in mano, che non si decide a mangiare e che a forza di
      girarlo fra le dita è diventato lucido. «Borso guarda altrove, come sempre, però la porta non la apre
      lui. Le chiavi vecchie ce le ha, e tocca a qualcuno usarle.»

      Ti ha dato un mazzo di chiavi di ferro unte d'olio, ma alla porta del piano interrato c'è sempre
      qualcuno. Sono chiavi lunghe una spanna con l'ingegno a tre denti, e l'olio è stato steso da poco perché
      girino senza rumore.

      {furtivita Media} Al rintocco della sesta si fa il cambio della guardia, e per un minuto scarso la porta
      resta sguarnita. La scala è troppo stretta per due uomini armati, e la guardia vecchia deve salire prima
      che la nuova scenda.

      {galateo Facile} Alla Caserma un ordine con il sigillo giusto apre più porte di un mazzo di chiavi.

      {origine figlio-della-citta-bassa} Il ragazzo lo conosci di vista. Quando portavi i pacchi ti correva
      dietro per portare il più pesante.
    opzioni:
      - testo: "Presentare un ordine di trasferimento falso"
        descrizione: "Rozalia scrive un ordine di trasferimento con il sigillo della Caserma. Il sergente lo deve leggere senza farsi domande."
        prova: { attributo: sociale, abilita: [galateo, ingannare], difficolta: Difficile }
        successo:
          titolo: Il trasferimento
          testo: |
            Il sergente legge l'ordine di Rozalia muovendo le labbra, poi alza il foglio contro la finestra e
            guarda il sigillo controluce. Alla fine ti fa scendere con due miliziani. Il ragazzo esce dalla
            cella con le mani legate davanti, per il trasferimento. Al primo vicolo della Città Bassa le mani
            si slegano da sole. La sera Mauro ti presenta a un uomo magro con un anello per dito, che ti
            guarda a lungo e ti dice che adesso sei nel registro.
          pe: { galateo: 5 }
          almeno: { rep.scuri: 4 }
          effetti: { fazione.scuri: 1, rep.caserma: -1, oggetto.scuri-cappuccio-degli-scuri: 1 }
        fallimento:
          titolo: Il sigillo controluce
          testo: |
            Il sergente guarda il sigillo controluce per troppo tempo, poi ti dice che gli ordini di
            trasferimento li firma lo sceriffo, e lo sceriffo non li firma di domenica. Te ne vai prima che
            finisca di chiederti come ti chiami e attraversi il cortile senza correre, e senti il suo sguardo
            sulla nuca fino al portone.
          effetti: { sospetto: 1.5 }

      - testo: "Aprire la cella al cambio della guardia"
        descrizione: "Al rintocco della sesta la porta del piano interrato resta sola per un minuto scarso. Le chiavi vecchie fanno il resto."
        quando: [galdrick.via == 0]
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Media }
        successo:
          titolo: Il cambio della guardia
          testo: |
            Al rintocco della sesta scendi le scale mentre la guardia vecchia sale e la nuova non è ancora
            arrivata. Le chiavi vecchie entrano unte nella serratura e girano senza rumore, e lo scatto della
            mandata lo senti nel palmo più che nell'orecchio. Il ragazzo esce scalzo, con le scarpe in mano, e
            in fondo al corridoio Borso volta la testa verso il muro. La sera Mauro ti presenta a un uomo
            magro con un anello per dito, che ti dice che adesso sei nel registro.
          pe: { furtivita: 5 }
          almeno: { rep.scuri: 4 }
          effetti: { fazione.scuri: 1, rep.caserma: -1, oggetto.scuri-cappuccio-degli-scuri: 1 }
        fallimento:
          titolo: La guardia nuova
          testo: |
            La guardia nuova arriva in anticipo, e ti trovi sulle scale con le chiavi vecchie in mano. Le fai
            cadere in un secchio d'acqua sporca, dove vanno a fondo con un tonfo breve, e dici che stavi
            cercando il pozzo. Lui ti accompagna al pozzo con molta cortesia, e il pozzo è nel cortile.
          effetti: { sospetto: 1.5 }

      - testo: "Aprire la cella mentre lo sceriffo è a Ghoran"
        descrizione: "Con Galdrick a Ghoran la Caserma dorme di più. Il cambio della guardia si fa quando capita."
        quando: [galdrick.via == 1]
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Facile }
        successo:
          titolo: La Caserma che dorme
          testo: |
            Senza lo sceriffo il cambio della guardia si fa quando capita, e stasera capita tardi. Dal corpo
            di guardia arriva il rumore dei dadi su un tavolo. Scendi le scale con le chiavi vecchie e apri la
            cella. Il ragazzo esce scalzo con le scarpe in mano. In fondo al corridoio Borso volta la testa
            verso il muro. La sera Mauro ti presenta a un uomo magro con un anello per dito, che ti dice che
            adesso sei nel registro.
          pe: { furtivita: 5 }
          almeno: { rep.scuri: 4 }
          effetti: { fazione.scuri: 1, rep.caserma: -1, oggetto.scuri-cappuccio-degli-scuri: 1 }
        fallimento:
          titolo: Il sergente sveglio
          testo: |
            Lo sceriffo è a Ghoran, ma il sergente è sveglio, e ti trova sulle scale con le chiavi vecchie in
            mano. Dici che cercavi il pozzo. Il sergente ti accompagna al pozzo, che è nel cortile, e ti
            guarda bere un sorso d'acqua fino in fondo. L'acqua è gelida e sa di ferro.
          effetti: { sospetto: 1.5 }

      - testo: "Firmare tu il rilascio"
        descrizione: "La Caserma ti conosce, e un rilascio firmato da uno di casa non lo controlla nessuno. Prima o poi però lo sceriffo legge tutto."
        requisiti: [rep.caserma >= 4]
        esito:
          titolo: La tua firma
          testo: |
            Il sergente ti conosce, e quando gli porgi il rilascio con la tua firma lo mette sul mucchio senza
            leggerlo. Il ragazzo sale le scale senza credere ai suoi occhi, e sbatte le palpebre alla luce del
            cortile. Ti guarda come si guarda un mago. Mauro, la sera, ride così forte che il bancone trema, e
            ti presenta a un uomo magro con un anello per dito, che ti dice che adesso sei nel registro. Lo
            sceriffo, la settimana dopo, legge tutto.
          almeno: { rep.scuri: 4 }
          effetti: { fazione.scuri: 1, rep.caserma: -2, oggetto.scuri-cappuccio-degli-scuri: 1 }

      - testo: "Restituire le chiavi a Mauro"
        descrizione: "Una cella della Caserma è un'altra cosa rispetto a un vetraio che non paga. Mauro se lo ricorderà."
        costo: 0
        esito:
          titolo: Il fico secco
          testo: |
            Posi il mazzo di chiavi sul bancone, e l'olio lascia un alone scuro sul legno. Mauro guarda le
            chiavi e poi guarda te, e finalmente mangia il fico secco, masticandolo a lungo. Ti dice che le
            chiavi restano lì sul bancone, nel caso tu cambiassi idea. Per il resto della sera non ti versa da
            bere.
          effetti: { rep.scuri: -1 }

  # ------------------------------------------------------------ 6 · le chiavi vecchie, dopo Vesh, con Mauro in cella
  - id: scuri-le-chiavi-vecchie-dopo
    presso: guarnigione-di-qir-azel
    immagine: personaggi/mauro-scrocco
    titolo: Le chiavi vecchie
    sommario: "Mauro Scrocco aspetta il processo in una cella della Caserma, e sa a memoria i debiti di tutta la Città Bassa."
    luogo: Guarnigione di Qir-Azel, le celle del piano interrato
    area: quartieri-alti
    requisiti: [fazione.scuri == 5, pista.pelle >= 6, mauro != 2]
    testo: |
      Mauro Scrocco aspetta il processo in fondo al corridoio delle celle, e senza la camicia color zafferano
      sembra più vecchio. La cella è larga tre passi, e la luce ci scende da una finestra a bocca di lupo alta
      sul muro. Mauro siede sulla panca con le mani sulle ginocchia, come un oste che aspetta l'ultimo
      cliente, e quando ti vede alla grata ti fa il sorriso del bancone.

      «Al processo mi chiederanno chi deve cosa a chi, {amico mio|amica mia}» dice. «I debiti della Città
      Bassa li so tutti a memoria. Se li dico al giudice mi salvo la pelle, e da domani la Città Bassa paga la
      Caserma invece di voi.» Si gratta la pancia. «Gaia dice che adesso alla Caserma ci sali tu.»

      {empatia Media} Più della forca lo spaventa arrivare al processo senza che nessuno gli abbia chiesto di
      tacere. Lo dicono le mani, che restano ferme sulle ginocchia anche quando la voce scherza.

      In un'altra cella Borso sta seduto in catene, con la catena raccolta in grembo perché non faccia rumore.
      Guarda il muro, e non si volta nemmeno al nome di Mauro.
    opzioni:
      - testo: "Convincerlo a tacere"
        descrizione: "Mauro deve arrivare al processo con la bocca chiusa. Bisogna fargli capire che chi è rimasto si ricorderà di lui."
        prova: { attributo: sociale, abilita: [empatia, persuasione], difficolta: Media }
        successo:
          titolo: La bocca chiusa
          testo: |
            Gli dici che chi è rimasto pagherà la sua parte alla moglie ogni mese, e che i suoi debiti restano
            suoi. Mauro ti ascolta con gli occhi chiusi. Poi ti fa un cenno con il mento, il cenno del
            bancone, e ti dice di salutargli Rozalia. La sera Gaia ti porta un cappuccio di lana grigia cucito
            a mano, con i punti fitti e la lana ancora ruvida, dicendoti che adesso sei nel registro, anche se
            il registro non c'è più.
          pe: { empatia: 5 }
          almeno: { rep.scuri: 4 }
          effetti: { fazione.scuri: 1, rep.caserma: -1, oggetto.scuri-cappuccio-degli-scuri: 1 }
        fallimento:
          titolo: Il bancone
          testo: |
            Gli parli dei debiti e della moglie, e Mauro ti ascolta sorridendo come al bancone, quando un
            cliente gli raccontava una storia che sapeva già. Alla fine ti dice che ci penserà. Torni su per
            le scale senza sapere che cosa dirà al giudice, su gradini di pietra consumati al centro da chi è
            sceso prima di te.
          effetti: { tormento: 0.5 }

      - testo: "Fargli paura"
        descrizione: "Mauro sa che cosa succede a chi parla. Gliel'ha fatto succedere lui, tante volte."
        prova: { attributo: sociale, abilita: [intimidire, conoscenze-della-strada], difficolta: Media }
        successo:
          titolo: La regola di casa
          testo: |
            Gli ricordi la regola di casa, che una gamba rotta non lavora, e gli ricordi che in cella le gambe
            si rompono più facilmente. Mauro smette di sorridere, e nel corridoio si sente soltanto l'acqua
            che gocciola dalla bocca di lupo. Poi fa una risata corta e ti dice che hai imparato bene. La sera
            Gaia ti porta un cappuccio di lana grigia cucito a mano, dicendoti che adesso sei nel registro.
          pe: { intimidire: 5 }
          almeno: { rep.scuri: 4 }
          effetti: { fazione.scuri: 1, rep.caserma: -1, oggetto.scuri-cappuccio-degli-scuri: 1 }
        fallimento:
          titolo: Il ragazzo
          testo: |
            Provi a fargli paura, e Mauro ti guarda come si guarda un ragazzo che gioca a fare il grande. Ti
            dice di tornare quando avrai rotto una gamba vera. La guardia in fondo al corridoio ti guarda
            uscire, e ti segna sul suo foglio con un mozzicone di matita.
          effetti: { sospetto: 1 }

      - testo: "Pagare la guardia perché lo tratti bene"
        descrizione: "Un uomo trattato bene aspetta il processo più tranquillo, e un uomo tranquillo tace. La guardia accetta monete."
        requisiti: [monete >= 25]
        esito:
          titolo: Il vino della guardia
          testo: |
            Paghi la guardia perché a Mauro arrivi il vino al posto dell'acqua, e una coperta di lana spessa.
            Mauro lo capisce al primo sorso, e la volta dopo ti saluta con il bicchiere alzato e la coperta
            sulle spalle. Al processo dice soltanto i debiti dei morti. La sera Gaia ti porta un cappuccio di
            lana grigia cucito a mano, dicendoti che adesso sei nel registro.
          almeno: { rep.scuri: 4 }
          effetti: { fazione.scuri: 1, monete: -25, rep.caserma: -1, oggetto.scuri-cappuccio-degli-scuri: 1 }

      - testo: "Firmare tu il permesso di visita"
        descrizione: "La Caserma ti conosce. Un permesso firmato da uno di casa porta Rozalia o Gaia alla grata, e Mauro con loro parla."
        requisiti: [rep.caserma >= 4]
        esito:
          titolo: Le visite
          testo: |
            Firmi i permessi di visita, e per una settimana alla grata di Mauro passano le facce di chi è
            rimasto. Lui tace al processo, e lo sceriffo, quando legge il registro delle visite, trova il tuo
            nome in fondo a ogni pagina, sempre con la stessa grafia. La sera Gaia ti porta un cappuccio di
            lana grigia cucito a mano, dicendoti che adesso sei nel registro.
          almeno: { rep.scuri: 4 }
          effetti: { fazione.scuri: 1, rep.caserma: -2, oggetto.scuri-cappuccio-degli-scuri: 1 }

  # ------------------------------------------------------------ 6 · le chiavi vecchie, dopo Vesh, con Mauro morto
  - id: scuri-le-chiavi-vecchie-nestor
    presso: guarnigione-di-qir-azel
    immagine: personaggi/nestor-gramm
    titolo: Le chiavi vecchie
    sommario: "Nestor Gramm è in catene alla Caserma e prepara le tisane ai carcerieri. Sa dove sta la seconda dispensa degli Scuri."
    luogo: Guarnigione di Qir-Azel, le celle del piano interrato
    area: quartieri-alti
    requisiti: [fazione.scuri == 5, pista.pelle >= 6, mauro == 2]
    testo: |
      Nestor Gramm sta in catene in una cella del piano interrato, e la catena arriva fino alla stufa del
      corridoio dove fa bollire le tisane. La stufa è di ghisa, e sul piano c'è un pentolino annerito che fuma
      piano. Ti versa una tazza di coccio, e tu la tieni in mano senza berla mentre il calore ti passa nelle
      dita.

      «Mauro è morto sullo spiazzo e i debiti se li è portati con sé» dice. «La seconda dispensa invece è
      ancora piena, sotto il Mercato dei Nodi, dietro una porta che conosciamo in due. L'altro è morto, e io
      qui ci resto vent'anni. Che cosa mi date, per la porta?»

      {medicina Media} La tisana è solo camomilla e scorza d'arancia. Lo dicono il colore giallo chiaro e i
      filamenti di scorza che girano sul fondo.

      {ingannare Media} Sulla dispensa dice il vero, ma sulla porta esita troppo e lo sguardo gli scappa verso
      la stufa, e non la conoscono in due.

      Gaia ti ha detto di non bere niente di quello che offre Nestor.
    opzioni:
      - testo: "Farti dare la ricetta della pasta nera"
        descrizione: "La pasta nera chiude le ferite in una notte. Nestor la insegna solo a chi sa già di che cosa parla."
        prova: { attributo: mentale, abilita: [medicina, natura], difficolta: Media }
        successo:
          titolo: La pasta nera
          testo: |
            Gli chiedi della pasta nera nominando le erbe giuste, e Nestor ti guarda per la prima volta come
            un collega. Te la detta a voce bassa ingrediente per ingrediente, e conta le dosi sulle dita. Poi
            ti dice anche dove sta la seconda dispensa. La sera Gaia ti porta un cappuccio di lana grigia
            cucito a mano, dicendoti che adesso sei nel registro.
          pe: { medicina: 5 }
          almeno: { rep.scuri: 4 }
          imposta: { scuri.nestor: 1 }
          effetti: { fazione.scuri: 1, rep.caserma: -1, oggetto.scuri-cappuccio-degli-scuri: 1 }
        fallimento:
          titolo: L'erba sbagliata
          testo: |
            Nomini un'erba sbagliata, e Nestor si mette a ridere così forte che la catena tintinna contro il
            ferro della stufa. Ti versa un'altra tazza di camomilla e ti dice di tornare quando saprai
            distinguere la ruta dalla salvia.
          effetti: { scandalo: 0.5 }

      - testo: "Promettergli che i suoi avranno la loro parte"
        descrizione: "Nestor ha una sorella al Mercato dei Nodi. Chi è rimasto può pagarle ogni mese quello che lui non guadagna."
        prova: { attributo: sociale, abilita: [persuasione, empatia], difficolta: Media }
        successo:
          titolo: La sorella
          testo: |
            Gli prometti che sua sorella avrà la sua parte ogni mese. Nestor ci pensa mescolando la tisana con
            lo straccio, poi ti dice della porta dietro il banco delle spezie. Nella seconda dispensa Gaia
            trova boccette e unguenti in file ordinate sugli scaffali, ognuno con l'etichetta scritta a mano.
            Trova anche un cappuccio di lana grigia, cucito a mano, che ti mette in mano dicendo che adesso
            sei nel registro.
          pe: { persuasione: 5 }
          almeno: { rep.scuri: 4 }
          effetti: { fazione.scuri: 1, rep.caserma: -1, unguento: 2, oggetto.scuri-cappuccio-degli-scuri: 1 }
        fallimento:
          titolo: Le promesse
          testo: |
            Gli prometti molte cose, e Nestor le ascolta tutte annuendo. Poi ti dice che le promesse le faceva
            anche Mirko, e che lui è in catene lo stesso. Ti versa altra tisana nella tazza ancora piena e si
            volta verso la stufa.
          effetti: { scandalo: 0.5 }

      - testo: "Pagare la guardia perché gli allunghi la catena"
        descrizione: "Una catena più lunga arriva alla finestra. Per un uomo in cella è un regalo grande."
        requisiti: [monete >= 25]
        esito:
          titolo: La finestra
          testo: |
            Paghi la guardia, e la catena di Nestor si allunga di tre anelli, abbastanza da arrivare alla
            finestra a bocca di lupo. Nestor ci si mette sotto e guarda il cielo per un'ora intera, con la
            faccia nella striscia di luce grigia che scende dal muro. Poi ti dice della porta dietro il banco
            delle spezie. La sera Gaia ti porta un cappuccio di lana grigia cucito a mano, dicendoti che
            adesso sei nel registro.
          almeno: { rep.scuri: 4 }
          effetti: { fazione.scuri: 1, monete: -25, rep.caserma: -1, oggetto.scuri-cappuccio-degli-scuri: 1 }

  # ------------------------------------------------------------ 7 · il tavolo di Mirko, prima di Vesh
  - id: scuri-il-tavolo-di-mirko
    presso: pignatta-grassa
    immagine: personaggi/mirko-vesh
    titolo: Il tavolo di Mirko
    sommario: "Mirko Vesh ti aspetta nel cortile delle risse, seduto sull'unica sedia. Vuole sapere tutto quello che hai visto da quando sei in città."
    luogo: Pignatta Grassa, il cortile delle risse
    area: citta-bassa
    requisiti: [fazione.scuri == 6, pista.pelle < 4]
    testo: |
      Il cortile delle risse è vuoto, e nel cerchio di gesso c'è una sedia sola. Il gesso è stato ripassato da
      poco sopra le tracce vecchie, e dove le pietre sono sconnesse la linea salta e riprende più in là. Mirko
      Vesh siede sulla sedia a gambe accavallate, con un anello a ogni dito, e ti fa segno di sederti per
      terra davanti a lui. Le pietre in quel punto sono fredde e lisciate da chi ci è finito prima di te.

      Vuole sapere della razzia del Festival e della Dama d'Argento, poi chiede di Capomozzo. Ascolta le
      risposte girandosi gli anelli uno dopo l'altro, e il metallo batte piano contro le nocche. Sono anelli
      spaiati d'ottone e d'argento, e nessuno è uguale a un altro. Al mignolo sinistro però si ferma, perché
      quell'anello è liscio e non lo gira.

      «Per dieci anni abbiamo tenuto un profilo basso, ma dopo la razzia in città guardano tutti» dice.
      «Ottone Malgrani vuole chiudere i conti con noi prima che qualcuno guardi lui. Per quell'uomo abbiamo
      bruciato i mulini dei concorrenti.»

      {empatia Media} Quando dice «dieci anni» le dita gli restano ferme sugli anelli. Più di Ottone lo
      preoccupa che sia finito il tempo in cui bastava avere paura di lui.

      {intimidire Facile} Tu stai per terra e lui sulla sedia, al centro del cerchio dove di solito ci si
      picchia, e non serve aggiungere altro.

      Ti affida un messaggio a voce per Ottone, da dire al mulino all'alba.
    opzioni:
      - testo: "Portare il messaggio al mulino"
        descrizione: "Un messaggio a voce, da dire a Ottone Malgrani e a nessun altro. Mirko te lo fa ripetere due volte."
        esito:
          titolo: Il messaggio
          testo: |
            Mirko ti fa ripetere il messaggio tre volte, e alla terza ti corregge una parola senza alzare la
            voce. «I mulini bruciano anche per due» dici, e lui annuisce. Ti batte piano una mano sulla
            spalla, e attraverso la stoffa senti gli anelli. Poi ti manda via prima che il cortile si riempia.
          segue: scuri-il-mulino-all-alba

      - testo: "Offrirgli il registro dei Malgrani da copiare"
        descrizione: "Nei tuoi Averi c'è il registro dei pagamenti di Ottone agli Scuri. Rozalia può copiarlo in una notte, se qualcuno l'aiuta."
        quando: [oggetto.registro-dei-malgrani >= 1]
        prova: { attributo: mentale, abilita: [accademiche, percezione], difficolta: Difficile }
        successo:
          titolo: La copia di una notte
          testo: |
            Passi la notte nel retrobottega con Rozalia a dettarle le cifre del registro, mentre lei le copia
            con due penne, una per mano. Le penne grattano la carta nello stesso momento, e alla luce della
            candela le righe crescono a coppie. All'alba la copia è identica, compresa una macchia
            d'inchiostro. Mirko la sfoglia e sorride. Poi ti dà il messaggio per Ottone, da portare a voce al
            mulino.
          pe: { accademiche: 5 }
          effetti: { rep.scuri: 1, informazioni.segreto: 1 }
          segue: scuri-il-mulino-all-alba
        fallimento:
          titolo: Le cifre sbagliate
          testo: |
            Passi la notte a dettare le cifre a Rozalia, e all'alba lei trova tre righe sbagliate, tutte tue.
            Le segna una per una con l'unghia sporca d'inchiostro. La copia va bene lo stesso, dice, ma ti
            guarda come si guarda un garzone. Mirko la sfoglia senza commenti e ti dà il messaggio per Ottone.
          effetti: { tormento: 1 }
          segue: scuri-il-mulino-all-alba

      - testo: "Raccontargli quello che non ti ha chiesto"
        descrizione: "Mirko vuole sapere tutto. Una cosa che non sa ancora vale più delle risposte."
        prova: { attributo: sociale, abilita: [persuasione, espressivita], difficolta: Media }
        successo:
          titolo: La cosa che non sapeva
          testo: |
            Gli racconti di una faccia che hai visto alla Caserma e che non dovrebbe esserci, e Mirko smette
            di girarsi gli anelli. Ti ascolta fino in fondo con le mani ferme sulle ginocchia. Alla fine ti fa
            alzare da terra e ti dà la sedia, che è ancora calda. Lui resta in piedi, e ti affida il messaggio
            per Ottone da portare al mulino.
          pe: { persuasione: 5 }
          effetti: { rep.scuri: 0.5 }
          segue: scuri-il-mulino-all-alba
        fallimento:
          titolo: La cosa che sapeva già
          testo: |
            Gli racconti di una faccia che hai visto alla Caserma, e Mirko ti dice il nome di quella faccia
            prima che tu finisca. Lo sapeva già. L'anello che stava girando non si è nemmeno fermato. Ti dà il
            messaggio per Ottone con un sorriso gentile, come si dà un dolce a un bambino che ha detto una
            bugia.
          segue: scuri-il-mulino-all-alba
          effetti: { scandalo: 0.5 }

  # ------------------------------------------------------------ 7 · il seguito, al mulino all'alba
  - id: scuri-il-mulino-all-alba
    presso: segheria-e-mulino-malgrani
    immagine: personaggi/ottone-malgrani
    titolo: Il mulino all'alba
    tipo: seguito
    luogo: Il mulino dei Malgrani, all'alba
    area: citta-bassa
    requisiti: [fazione.scuri == 6, pista.pelle < 4]
    testo: |
      All'alba il mulino è già bianco di farina dalle soglie fino ai coppi del tetto. Lungo il canale del
      cristallo la ruota gira con un rumore di pioggia, e dentro i muri le macine battono un colpo sordo e
      regolare che ti arriva su per le suole. Ottone Malgrani arriva a cavallo con due guardie in livrea
      verde. Scende e infila una mano in un sacco aperto per sentire com'è macinata la farina, e la sfrega fra
      il pollice e l'indice. Quando ti vede accanto alla ruota manda le guardie a controllare i carri.

      Gli dici il messaggio parola per parola, come te l'ha fatto ripetere Mirko. «I mulini bruciano anche per
      due.» Ottone si pulisce lentamente la mano sulla giubba, e sul panno scuro restano cinque strisce
      bianche. La farina gli resta anche nelle pieghe delle dita.

      {empatia Media} La mano gli trema, perché ha capito il messaggio meglio di te.

      {politica-ed-economia Media} Con i mulini dei concorrenti bruciati i Malgrani hanno avuto tutta la
      farina della città, e Ottone sa quanto costerebbe il secondo incendio.

      {origine rampollo-dei-quartieri-alti} Ottone ti ha visto ai ricevimenti, e quando capisce che cosa ci
      fai accanto al suo mulino ti guarda come un cane di casa che morde.
    opzioni:
      - testo: "Leggere la sua paura e riferirla a Mirko"
        descrizione: "Mirko vuole sapere come l'ha presa. Le parole di Ottone contano meno delle sue mani."
        prova: { attributo: sociale, abilita: [empatia, percezione], difficolta: Media }
        successo:
          titolo: Le mani di Ottone
          testo: |
            Ottone ti risponde che ha capito, e ti dice di riferire che non dimentica gli amici. Le mani però
            le tiene dietro la schiena, e la sinistra stringe la destra fino a farle diventare bianche le
            nocche. Lo racconti a Mirko quella sera. Lui si gira l'anello liscio per la prima volta da quando
            lo conosci, e ti fa dare da Mauro una borsa pesante.
          pe: { empatia: 5 }
          effetti: { fazione.scuri: 1, rep.scuri: 1, monete: 40, informazioni.segreto: 1 }
        fallimento:
          titolo: Le parole di Ottone
          testo: |
            Ottone ti dice che ha capito e che non dimentica gli amici, e tu riferisci a Mirko le sue parole
            così come sono. Mirko ti ascolta e ti chiede delle mani. Del mulino ricordi il cavallo e la ruota,
            e delle mani niente. Ti fa dare la borsa lo stesso, un po' più leggera.
          effetti: { fazione.scuri: 1, rep.scuri: 0.5, monete: 30, scandalo: 0.5 }

      - testo: "Aggiungere qualcosa di tuo al messaggio"
        descrizione: "Un messaggio è più forte se chi lo porta sembra sapere più di quello che dice."
        prova: { attributo: sociale, abilita: [intimidire, ingannare], difficolta: Media }
        successo:
          titolo: Il mulino di Anselmo Brey
          testo: |
            Dopo il messaggio aggiungi che l'unico mulino ancora intero, oltre ai suoi, è quello di Anselmo
            Brey, e che sarebbe un peccato. Ottone impallidisce sotto la farina e resta con la mano sporca a
            mezz'aria. Mirko, quando glielo racconti, ride fino a tossire, e ti dice di non farlo mai più
            senza chiedere. Poi ti fa dare da Mauro una borsa pesante.
          pe: { intimidire: 5 }
          effetti: { fazione.scuri: 1, rep.scuri: 1, monete: 40, sospetto: 1 }
        fallimento:
          titolo: La guardia in livrea
          testo: |
            Aggiungi qualcosa di tuo, e Ottone chiama una guardia con un fischio corto fra i denti. La guardia
            ti accompagna fino al ponte con la mano sulla spada e ti resta a mezzo passo per tutta la strada.
            Mirko sospira quando glielo racconti e ti dice che i messaggi si portano interi, senza condimenti,
            mentre Mauro ti conta una borsa leggera.
          effetti: { fazione.scuri: 1, monete: 25, sospetto: 1 }

      - testo: "Dire il messaggio e andartene"
        descrizione: "Un messaggio a voce si dice e si lascia lì. Il resto lo capisce chi lo riceve."
        esito:
          titolo: La farina sulla giubba
          testo: |
            Dici il messaggio e te ne vai lungo il canale senza voltarti. Alle tue spalle la ruota continua a
            girare, e il suo rumore di pioggia ti segue fino al primo ponte. A Mirko racconti soltanto della
            farina che Ottone aveva sulla giubba, e lui annuisce come se bastasse. Ti fa dare da Mauro una
            borsa.
          effetti: { fazione.scuri: 1, rep.scuri: 0.5, monete: 35 }

  # ------------------------------------------------------------ 7 · i debiti di Mirko, dopo Vesh
  - id: scuri-il-tavolo-di-mirko-dopo
    immagine: ambientazione/citta-bassa
    titolo: I debiti di Mirko
    sommario: "Galdrick ha restituito gli anelli ai debitori di Mirko Vesh. Adesso i debiti sono di chi li riscuote per primo."
    luogo: Città Bassa, le strade dei debitori
    area: citta-bassa
    requisiti: [fazione.scuri == 6, pista.pelle >= 6]
    testo: |
      Dopo la notte della Pignatta lo sceriffo ha restituito gli anelli di Mirko ai debitori ancora vivi, e in
      Città Bassa è sembrata una gentilezza. Gli anelli però sono metà del conto. L'altra metà sono i debiti,
      che adesso sono di chi li riscuote per primo.

      Gaia ti porta nelle strade dei debitori con una lista che Rozalia ha scritto a memoria, una quindicina
      di nomi fra Via del Salmone e i vicoli dietro le fucine. Su una porta c'è già un gettone d'argilla,
      fissato al legno con un grumo di pece e segnato da una mano aperta con tre dita. Gaia lo stacca con
      l'unghia e lo butta nel tombino.

      {conoscenze-della-strada Media} La gente paga a chi la minaccia di più, e gli altri tengono la borsa
      chiusa finché non capiscono chi vince.

      Al quarto nome apre una donna con un neonato in braccio. Ti mostra l'anello del marito, un cerchio di
      ferro sottile consumato dal lato del palmo, e ti chiede se deve pagare lo stesso.
    opzioni:
      - testo: "Condonare i debiti dei più poveri"
        descrizione: "Una parte della lista non potrà mai pagare. Cancellarli davanti a tutti costa monete e fa parlare la strada."
        esito:
          titolo: La riga dritta
          testo: |
            Prendi la lista e con il carbone tiri una riga dritta sui nomi dei più poveri, davanti alla donna
            con il neonato. Il carbone gratta la carta e ti lascia le dita nere. Gaia ti guarda come se avessi
            bruciato una borsa. In una settimana mezza Via del Salmone sa che chi è rimasto degli Scuri ha
            cancellato dei debiti, e l'altra metà paga prima del previsto per farsi cancellare il prossimo.
          effetti: { fazione.scuri: 1, rep.scuri: 0.5, nomea.citta-bassa: 1, monete: 15 }

      - testo: "Riscuotere prima dei mercenari"
        descrizione: "I mercenari di Durgan passano il venerdì. Se arrivi il giovedì, la strada paga te."
        prova: { attributo: sociale, abilita: [intimidire, politica-ed-economia], difficolta: Media }
        successo:
          titolo: Il giovedì
          testo: |
            Il giovedì passi la lista porta per porta, e a ognuna stacchi il gettone d'argilla e lo butti nel
            tombino. Sul legno resta soltanto un cerchio scuro di pece. Chi paga, paga a te. Il venerdì i
            mercenari di Durgan trovano le porte pulite e le borse vuote, e si fermano a guardare la strada
            come si guarda un campo dopo la grandine.
          pe: { intimidire: 5 }
          effetti: { fazione.scuri: 1, rep.scuri: 1, monete: 40 }
        fallimento:
          titolo: Il venerdì anticipato
          testo: |
            Passi la lista il giovedì, e al terzo nome trovi già lì i mercenari di Durgan, che quella
            settimana sono passati in anticipo. Ti guardano dall'alto e ridono. Riscuoti quello che resta, e
            la sera Gaia conta le monete due volte. Le impila sul tavolo per grandezza e sospira.
          effetti: { fazione.scuri: 1, rep.scuri: 0.5, monete: 15, sospetto: 0.5 }

      - testo: "Rinegoziare porta per porta"
        descrizione: "Ogni debitore ha un prezzo che può pagare. Trovarlo è lavoro lungo."
        costo: 2
        esito:
          titolo: Quindici porte
          testo: |
            Ti siedi in quindici cucine una dopo l'altra, e in ognuna chiedi quanto si può pagare davvero e lo
            segni. Le tavole sono segnate dai coltelli, e la gente ti parla con le mani appoggiate sul legno.
            Ti offrono un bicchiere di vino in sei, e una minestra in una. A sera la lista è cambiata da cima
            a fondo, e i debiti sono più piccoli e più sicuri. Gaia legge i numeri e ti dice che Mirko ci
            avrebbe messo meno, e avrebbe preso di più.
          effetti: { fazione.scuri: 1, rep.scuri: 1, monete: 25, nomea.citta-bassa: 0.5 }

      - testo: "Bussare alle porte dei vicoli della tua infanzia"
        descrizione: "I vicoli dietro le fucine li conosci uno per uno. Alla gente che ti ha visto crescere si chiede in un altro modo."
        quando: [origine.figlio-della-citta-bassa >= 1]
        esito:
          titolo: Il figlio di quella del secondo piano
          testo: |
            Bussi alle porte dei vicoli dietro le fucine, e ognuno ti riconosce come {il figlio|la figlia} di
            quella del secondo piano. I chiavistelli sono gli stessi di quando eri piccol{o|a}, e da dietro i
            muri arriva ancora il colpo dei magli. Chi può paga, e chi non può ti dà da mangiare e ti racconta
            perché. Tiri una riga sui nomi dei più poveri, e la strada lo sa prima di sera. Gaia ti guarda
            come si guarda uno che ha un vantaggio ingiusto, e lo invidia.
          effetti: { fazione.scuri: 1, rep.scuri: 0.5, nomea.citta-bassa: 1, monete: 15 }

  # ------------------------------------------------------------ 8 · prima della prossima luna, prima di Vesh
  - id: scuri-prima-della-prossima-luna
    presso: grifone-di-ferro
    immagine: personaggi/gaia-acari
    titolo: Prima della prossima luna
    sommario: "Mirko Vesh sa per chi canta Gaia Acari, e l'ha condannata prima della prossima luna. Vuole che sia tu a sistemare la cosa."
    luogo: Locanda del Grifone di Ferro, la sera
    area: ponti-sospesi
    requisiti: [fazione.scuri == 7, pista.pelle < 4]
    testo: |
      Mirko te l'ha detto girandosi l'anello del pollice. La ragazzina col cappuccio blu porta notizie allo
      sceriffo da prima della razzia. Lui lo sa da allora, e le ha fatto portare solo notizie false. Adesso è
      stanco, e l'ha condannata prima della prossima luna. «Sistemala tu, come vuoi. Mi interessa sapere
      come.»

      Gaia è al Grifone, vicino al camino, con la tazza di latte caldo che Brunella non le fa mai pagare. La
      tazza è di terracotta sbeccata sul bordo, e lei beve dal lato buono. Imita un Raschiatore che racconta
      una frana e fa crollare il soffitto con le braccia, e il Raschiatore vero ride più di tutti. Quando ti
      vede entrare smette e beve tenendo la tazza con tutte e due le mani.

      {furtivita Facile} Si è seduta con le spalle al muro e la porta della cucina a due passi. Ha lasciato la
      sedia scostata dal tavolo, per alzarsi senza doverla spostare.

      {origine figlio-della-citta-bassa} Gaia correva fra i vicoli quando tu portavi già i pacchi, una bambina
      con le ginocchia sbucciate e il cappuccio troppo grande.
    opzioni:
      - testo: "Farne un canale di notizie false per Galdrick, come vuole Mirko"
        descrizione: "Gaia continua a cantare per lo sceriffo, e le canzoni gliele scrive Mirko."
        quando: [gaia < 2]
        prova: { attributo: sociale, abilita: [ingannare, persuasione], difficolta: Media }
        successo:
          titolo: Le canzoni di Mirko
          testo: |
            Le dici che Mirko non sa niente e che d'ora in poi le notizie per lo sceriffo gliele porti tu, più
            buone di quelle che trova da sola. Lei ci crede, e il latte smette di tremarle nella tazza. Mirko,
            quando glielo racconti, si toglie l'anello del pollice e te lo fa vedere controluce davanti alla
            candela, e ti dice che viva serve di più.
          pe: { ingannare: 5 }
          effetti: { fazione.scuri: 1, rep.scuri: 1, monete: 20 }
        fallimento:
          titolo: Il latte
          testo: |
            Le parli delle notizie e dello sceriffo, e a metà del discorso Gaia posa la tazza. Ti guarda come
            si guarda un gatto che finge di dormire. Poi si alza, ringrazia Brunella per il latte ed esce
            dalla porta della cucina. Sul tavolo la tazza è mezza piena, e il latte ci fa già la pellicola.
          effetti: { sospetto: 0.5 }

      - testo: "Farne un canale di notizie false per Galdrick"
        descrizione: "Gaia sa già che Mirko l'ha scoperta. Convincerla a continuare a cantare, con le canzoni di Mirko, è più difficile."
        quando: [gaia >= 2]
        prova: { attributo: sociale, abilita: [ingannare, persuasione], difficolta: Difficile }
        successo:
          titolo: Viva serve di più
          testo: |
            Le dici la verità, quasi tutta. Mirko sa, e per restare viva deve continuare a portare allo
            sceriffo quello che le darai tu. Gaia ascolta con la tazza ferma a mezz'aria finché il latte
            smette di fumare. Accetta. Prima di andarsene ti dice senza nessuna rabbia che non ti perdonerà.
            Mirko, quando glielo racconti, annuisce soddisfatto.
          pe: { ingannare: 5 }
          effetti: { fazione.scuri: 1, rep.scuri: 1, monete: 20 }
        fallimento:
          titolo: La porta della cucina
          testo: |
            Le dici che deve continuare a cantare, e lei capisce per chi prima che tu finisca. Esce dalla
            porta della cucina senza voltarsi, e la porta sbatte due volte contro lo stipite prima di
            fermarsi. Per una settimana al Grifone nessuno la vede, e Brunella ti guarda come se fosse colpa
            tua.
          effetti: { sospetto: 0.5 }

      - testo: "Avvertirla e dire a Mirko che è scappata"
        descrizione: "Gaia sparisce per un po', e Mirko deve credere che sia scappata da sola. A Mirko si mente una volta sola."
        prova: { attributo: sociale, abilita: [ingannare, conoscenze-della-strada], difficolta: Difficile }
        successo:
          titolo: Scappata
          testo: |
            Le dici tutto sottovoce, e Gaia sparisce dalla porta della cucina prima che il latte si raffreddi.
            A Mirko racconti che è scappata ai Ponti, e lo racconti così bene che ci credi un poco anche tu.
            Lui si gira l'anello liscio del mignolo. «Ai Ponti, dici. La faccio cercare lì» dice. Dopo una
            settimana Gaia torna più magra e con il cappuccio infangato fino all'orlo, e adesso ti deve una
            cosa.
          pe: { ingannare: 5 }
          imposta: { gaia: 2 }
          effetti: { fazione.scuri: 1, rep.scuri: 0.5 }
        fallimento:
          titolo: L'anello liscio
          testo: |
            Le dici tutto sottovoce, e Gaia sparisce. A Mirko racconti che è scappata ai Ponti, e lui ti
            ascolta girando l'anello liscio, cosa che non fa mai. L'anello scorre sul dito senza un rumore.
            Alla fine ti dice che ti crede, e tu capisci che non ti crede. Da quel giorno Mauro ti versa da
            bere un po' meno.
          imposta: { gaia: 2 }
          effetti: { fazione.scuri: 1, rep.scuri: -1, sospetto: 0.5 }

      - testo: "Portarla da Galdrick"
        descrizione: "Lo sceriffo la protegge, e gli Scuri lo sanno entro un'ora. È la scelta che si paga di più."
        quando: [galdrick.via == 0]
        immagine: personaggi/toren-galdrick
        esito:
          titolo: Il taccuino dello sceriffo
          testo: |
            La porti alla Caserma per la scala di servizio, e Galdrick la riceve in piedi con i pollici nella
            cintura. Scrive il suo nome nel taccuino e poi il tuo, sotto, con una matita consumata fino a due
            dita. Gaia dorme in una stanza della Caserma per un mese. Gli Scuri lo sanno entro un'ora, e
            quando entri alla Pignatta Mauro ti versa da bere e lascia il bicchiere sul bancone senza
            spingerlo verso di te.
          imposta: { gaia: 2 }
          effetti: { fazione.scuri: 1, rep.scuri: -3, rep.caserma: 1 }

      - testo: "Parlarle come uno dei vicoli"
        descrizione: "Gaia correva fra i vicoli quando tu portavi i pacchi. Fra quelli dei vicoli certe cose si dicono senza giri."
        quando: [origine.figlio-della-citta-bassa >= 1]
        esito:
          titolo: Le ginocchia sbucciate
          testo: |
            Le ricordi di quando aveva le ginocchia sbucciate e il cappuccio troppo grande, e lei ride per la
            prima volta stasera con una mano davanti alla bocca. Poi le dici di Mirko, piano. Gaia sparisce
            per una settimana, e a Mirko racconti che è scappata ai Ponti. Lui ti crede, perché tu sei un{o|a}
            dei vicoli e lei anche. Quando torna, Gaia ti deve una cosa.
          imposta: { gaia: 2 }
          effetti: { fazione.scuri: 1, rep.scuri: 0.5 }

  # ------------------------------------------------------------ 8 · prima della prossima luna, dopo Vesh
  - id: scuri-prima-della-prossima-luna-dopo
    presso: ponte-dei-morti
    immagine: personaggi/gaia-acari
    titolo: Il segno sotto la spalla
    sommario: "Gaia ha guardato bene il segno dei gettoni d'argilla, e da quel giorno non dorme. Ti aspetta sotto il Ponte dei Morti."
    luogo: Ponte dei Morti, sotto le assi
    area: ponti-sospesi
    requisiti: [fazione.scuri == 7, pista.pelle >= 6]
    testo: |
      Gaia ti aspetta sotto le assi del Ponte dei Morti, seduta su una trave con le gambe a penzoloni, e gira
      fra le dita un gettone d'argilla. La trave è di metallo annerito e tenuta insieme da bulloni ribattuti a
      mano, e la luce delle lanterne appese ai parapetti scende a strisce fra le assi. Quando Gaia batte il
      tallone sul metallo si stacca una scaglia di ruggine, e dal fondo non arriva nessun rumore.

      Senza dire niente si abbassa la spalla della camicia e ti mostra sotto la clavicola un vecchio segno
      inciso nella pelle, cicatrizzato bianco. Le linee sono dritte e tutte della stessa profondità, fatte da
      una mano che quel lavoro lo faceva spesso. È una mano aperta con tre dita, la stessa dei gettoni.

      «A Ghoran segnano così quelli che il clan ha comprato» dice guardando il vuoto. «Avevo sei anni, e sono
      scappata a otto. Durgan non lo sa. I suoi uomini però lo sanno leggere. Prima o poi uno di loro mi vedrà
      cambiare la camicia.» Si tira su la spalla. «Voglio sparire, e ho bisogno di qualcuno che mi dica dove.»

      {empatia Facile} Ti ha mostrato il segno per chiederti di non dirlo a nessuno.

      {origine fuggiasco-di-ghoran} Il segno della mano con tre dita lo conosci. Senza volerlo ti stringi il
      braccio sinistro, dove la stessa gente ti ha lasciato un'altra cicatrice.
    opzioni:
      - testo: "Dirle che la proteggete voi"
        descrizione: "Gli Scuri proteggono i loro. Se Gaia resta, la strada deve vedere che nessuno la tocca."
        prova: { attributo: sociale, abilita: [empatia, persuasione], difficolta: Media }
        successo:
          titolo: Chi è rimasto
          testo: |
            Le dici che Gaia Acari è di chi è rimasto, e che chi la tocca lo paga, e che la Città Bassa lo
            saprà entro domani. Lei ti guarda a lungo con le dita ferme sul gettone. Poi lo rimette in tasca
            invece di buttarlo nel vuoto. Il giorno dopo in Via del Salmone lo sanno tutti, e due mercenari
            che la guardavano cambiano strada.
          pe: { empatia: 5 }
          effetti: { fazione.scuri: 1, rep.scuri: 1, nomea.citta-bassa: 0.5 }
        fallimento:
          titolo: Parole
          testo: |
            Le dici che la proteggerete. Lei ti chiede chi esattamente, dato che degli Scuri sono rimasti in
            quattro, e a questo una risposta non ce l'hai. Gaia si rimette il cappuccio e resta sulla trave.
            Quando te ne vai sta ancora girando il gettone fra le dita, e l'argilla le ha lasciato una polvere
            chiara sui polpastrelli.
          effetti: { tormento: 0.5 }

      - testo: "Affidarla a Galdrick"
        descrizione: "Galdrick ha un debito con Ghoran, e Gaia è una cosa che a Ghoran hanno perso. In Caserma nessun mercenario la tocca."
        quando: [galdrick.via == 0]
        immagine: personaggi/toren-galdrick
        esito:
          titolo: La stanza in Caserma
          testo: |
            La accompagni alla Caserma, e Galdrick ascolta la sua storia senza interromperla. Quando lei gli
            mostra il segno sulla spalla lo sceriffo distoglie gli occhi. Le dà una stanza sopra le scuderie
            della Caserma, con il pavimento di assi e l'odore dei cavalli che sale dalle fessure. A te stringe
            la mano più a lungo del solito. In Città Bassa qualcuno dice che chi è rimasto degli Scuri va a
            chiedere aiuto allo sceriffo.
          imposta: { gaia: 2 }
          effetti: { fazione.scuri: 1, rep.caserma: 1 }

      - testo: "Usarla come esca per trovare chi incide i gettoni"
        descrizione: "I mercenari che sanno leggere il segno vorranno sapere chi è. Seguendo chi la cerca, si arriva a chi incide."
        prova: { attributo: sociale, abilita: [ingannare, intimidire], difficolta: Media }
        successo:
          titolo: L'esca
          testo: |
            Gaia gira per Via del Salmone con la spalla scoperta, e tu la segui a venti passi. Al secondo
            giorno un mercenario la vede e corre a dirlo a qualcuno. Quel qualcuno ha le mani sporche
            d'argilla secca fino ai polsi e alla cintura un punteruolo con la punta consumata. Lo segui fino a
            un magazzino vicino all'Orlo. Gaia torna a coprirsi la spalla e da quel giorno ti parla meno.
          pe: { ingannare: 5 }
          effetti: { fazione.scuri: 1, rep.scuri: 1, informazioni.segreto: 1 }
        fallimento:
          titolo: La spalla scoperta
          testo: |
            Gaia gira per Via del Salmone con la spalla scoperta. Il mercenario che la vede non corre a dirlo
            a nessuno e la prende per il braccio. Arrivi in tempo per staccarglielo, e ti costa un taglio sul
            polso che sanguina fino a sera. Gaia si copre la spalla, e quella sera non ti rivolge la parola.
          effetti: { ferite: 1 }

      - testo: "Mostrarle che anche tu sei scappat{o|a} da lì"
        descrizione: "A Ghoran chi scappa riconosce chi è scappato. Con te Gaia può parlare senza difendersi."
        quando: [origine.fuggiasco-di-ghoran >= 1]
        esito:
          titolo: Due cicatrici
          testo: |
            Ti tiri su la manica e le mostri la tua cicatrice. Gaia la guarda senza dire niente per molto
            tempo, e alla fine ci passa sopra un dito per sentire com'è rimarginata. Poi ti racconta di Ghoran
            come non l'ha mai raccontato a nessuno, e quando ha finito ti dice che resta. Il giorno dopo in
            Via del Salmone sanno tutti che chi tocca la ragazzina col cappuccio blu lo paga.
          effetti: { fazione.scuri: 1, rep.scuri: 1, nomea.citta-bassa: 0.5 }

  # ------------------------------------------------------------ 9 · l'ultimo ordine, prima di Vesh (il bivio)
  - id: scuri-l-ultimo-ordine
    presso: pignatta-grassa
    immagine: personaggi/mirko-vesh
    titolo: L'ultimo ordine
    sommario: "Il pomeriggio prima della notte della Pignatta, Mirko Vesh ti fa chiamare in cantina. Sa già dove sarai stanotte."
    luogo: Pignatta Grassa, la cantina, il pomeriggio
    area: citta-bassa
    requisiti: [fazione.scuri == 8, pista.pelle == 5, bivio.legge != 1]
    testo: |
      La cantina della Pignatta è fresca e buia, piena di botti segnate con il gesso. Sa di vino inacidito e
      di terra bagnata, e la volta di mattoni è così bassa che ci passi solo a testa china. Mirko Vesh siede
      su una botte vuota accanto a una candela e si pulisce le unghie con uno stiletto da manica, uguale a
      quello che Rozalia ha dato a te. Di sopra Mauro fa spostare i tavoli e appendere le lanterne, e le gambe
      delle sedie grattano sulle assi sopra la tua testa.

      «Borso mi ha detto che stanotte Galdrick scende, e chi gli cammina dietro» dice senza alzare gli occhi.
      Posa lo stiletto. «Non ti chiedo di tradirlo. Ti chiedo un'altra cosa, e prima voglio che tu mi
      ascolti.»

      {percezione Media} Al pollice destro c'è il segno bianco di un anello tolto da poco, e la pelle conserva
      ancora il solco.

      {empatia Difficile} Ha già deciso come finisce stanotte, e vuole che qualcuno sappia come finisce dopo.

      Sul tavolo accanto alla candela c'è un anello di rame con tre chiavi di ferro, lucide sull'impugnatura
      dove le dita le hanno girate per anni.
    opzioni:
      - testo: "Ascoltarlo fino in fondo"
        descrizione: "Mirko Vesh non ha mai chiesto a nessuno di ascoltarlo. Oggi lo chiede."
        quando: [fazione.caserma == 0]
        esito:
          titolo: Le tre chiavi
          testo: |
            Ti siedi su una botte davanti a lui. Lui ti spinge sul tavolo l'anello con le tre chiavi, che
            strisciano sul legno con un rumore di ferro. Ti spiega che sono le porte degli Scuri al Mercato
            delle Ombre, e che da domani qualcuno deve tenere i conti.
          imposta: { bivio.legge: 2 }
          segue: scuri-le-tre-chiavi

      - testo: "Dirgli che stanotte non camminerai dietro Galdrick"
        descrizione: "Hai cominciato a lavorare anche per la Caserma, e Mirko lo sa. Se resti, dalla Caserma esci adesso, e per sempre."
        quando: [fazione.caserma >= 1]
        esito:
          titolo: Il distintivo
          testo: |
            Gli dici che stanotte non sarai dietro lo sceriffo. Mirko ti guarda a lungo e poi annuisce una
            volta. «Allora da domani dalla Caserma non ti aspettano più» dice, «e lo sceriffo, questo, lo
            capirà prima di tutti.» Ti spinge sul tavolo l'anello con le tre chiavi.
          imposta: { bivio.legge: 2 }
          effetti: { rep.caserma: -2 }
          segue: scuri-le-tre-chiavi

      - testo: "Lasciargli le chiavi e tornare dalla Caserma"
        descrizione: "Stanotte lo sceriffo scende, e tu cammini dietro di lui. Gli Scuri finiscono qui, per te."
        quando: [fazione.caserma >= 1]
        immagine: personaggi/toren-galdrick
        esito:
          titolo: La scala della cantina
          testo: |
            Gli dici che stanotte camminerai dietro Galdrick. Mirko annuisce come se avesse vinto una
            scommessa con sé stesso, e rimette le chiavi in tasca. «Allora ci vediamo stanotte» dice. Risali
            la scala della cantina, che ha i gradini di legno scavati al centro. Di sopra Mauro smette di
            appendere lanterne per guardarti uscire.
          imposta: { bivio.legge: 1 }
          effetti: { rep.scuri: -2 }

      - testo: "Prendere tempo"
        descrizione: "Una cosa così non si decide in una cantina. Ma il tempo, oggi, è poco."
        quando: [fazione.caserma >= 1]
        costo: 0
        esito:
          titolo: Fino al tramonto
          testo: |
            Gli dici che ci devi pensare. Mirko guarda la candela, che è consumata a metà. «Fino a quando
            arriva qui» dice, e mette un dito sulla cera, un pollice più in basso. Sulla cera resta l'impronta
            del suo polpastrello. Poi riprende a pulirsi le unghie.

  # ------------------------------------------------------------ 9 · il seguito, prima di Vesh (grado 3)
  - id: scuri-le-tre-chiavi
    presso: pignatta-grassa
    immagine: personaggi/mirko-vesh
    titolo: Le tre chiavi
    tipo: seguito
    luogo: Pignatta Grassa, la cantina, il pomeriggio
    area: citta-bassa
    requisiti: [fazione.scuri == 8, bivio.legge == 2]
    testo: |
      Mirko fa girare sul tavolo l'anello di rame, e le tre chiavi tintinnano contro il legno. «Mauro parla
      troppo» dice. «Tiene i debiti a memoria e li dice ad alta voce, e la gente paga una volta per paura e
      poi smette. Rozalia è brava ma non si fida di nessuno, e con lei gli altri se ne vanno in una settimana.
      Domani i conti li deve tenere una faccia nuova, che la Caserma non conosce ancora.»

      Si guarda gli anelli alla luce della candela. Gli altri sono graffiati e ammaccati, e quello liscio sul
      mignolo sinistro, l'unico senza un segno, lo copre con l'altra mano.

      {politica-ed-economia Media} Tre porte al Mercato delle Ombre sono tre rendite, e chi le tiene domani
      sarà l'unico degli Scuri ad avere ancora un'entrata.
    opzioni:
      - testo: "Prendere le chiavi e tacere"
        descrizione: "Le chiavi in tasca, e nessuna domanda. È così che si sta al tavolo d'angolo."
        esito:
          titolo: In tasca
          testo: |
            Prendi l'anello con le tre chiavi e lo metti in tasca, dove tintinna contro lo stiletto. Mirko
            annuisce. Prima che tu risalga ti dà una borsa pesante e ti dice che è la tua parte di domani, e
            la borsa ti tira giù la cintura da un lato. Alla porta della cantina ti volti, e lui si sta di
            nuovo pulendo le unghie alla luce della candela.
          almeno: { rep.scuri: 6 }
          effetti: { fazione.scuri: 1, monete: 60, oggetto.scuri-tre-chiavi: 1 }

      - testo: "Chiedergli di andarsene stanotte"
        descrizione: "I Ponti sono grandi, e Laresh è lontana. Un uomo che ha già deciso di morire a volte cambia idea, se qualcuno glielo chiede."
        prova: { attributo: sociale, abilita: [persuasione, empatia], difficolta: Difficile }
        successo:
          titolo: Dieci anni
          testo: |
            Gli dici che i Ponti sono grandi, e lui ride, una risata vera che rimbomba sotto la volta. Poi ti
            racconta di dieci anni di inseguimenti con Galdrick, di quando lo ha visto per la prima volta da
            giovane, e di quanto si somigliavano. «Se scappo, lui mi cerca per altri dieci anni» dice. «Non ne
            ho voglia, e stanotte la chiudiamo una volta per tutte.» Ti mette le chiavi in mano e ti dà una
            borsa pesante.
          pe: { persuasione: 5 }
          almeno: { rep.scuri: 6 }
          effetti: { fazione.scuri: 1, monete: 60, informazioni.segreto: 1, oggetto.scuri-tre-chiavi: 1 }
        fallimento:
          titolo: I Ponti sono grandi
          testo: |
            Gli dici che i Ponti sono grandi, e lui sorride appena e scuote la testa senza nemmeno
            risponderti. Ti mette in mano le chiavi, fredde dell'aria della cantina, e ti dà una borsa
            pesante. Poi non dice più niente finché non risali la scala.
          almeno: { rep.scuri: 6 }
          effetti: { fazione.scuri: 1, monete: 60, tormento: 1, oggetto.scuri-tre-chiavi: 1 }

      - testo: "Chiedergli dell'anello liscio"
        descrizione: "È l'unico anello che Mirko non gira e che copre con l'altra mano. Tutti gli altri sono dei debitori."
        prova: { attributo: sociale, abilita: [empatia, galateo], difficolta: Media }
        successo:
          titolo: L'anello di sua madre
          testo: |
            Mirko si guarda il mignolo, dove l'anello ha scavato un solco nella pelle. Ti dice che l'anello
            liscio era di sua madre, che lo portava sul pollice perché aveva le mani grandi, e che ai suoi
            tempi gli olvari seppellivano i morti con l'anello. «Io invece lo lascio a chi viene dopo» dice,
            «a chi se lo prende.» Ti mette le chiavi in mano e ti dà una borsa pesante.
          pe: { empatia: 5 }
          almeno: { rep.scuri: 6 }
          effetti: { fazione.scuri: 1, monete: 60, oggetto.scuri-tre-chiavi: 1 }
        fallimento:
          titolo: Il mignolo
          testo: |
            Gli chiedi dell'anello liscio, e Mirko copre il mignolo con l'altra mano e ti risponde che è un
            anello. Ti mette le chiavi in mano e ti dà una borsa pesante, e la conversazione finisce lì.
          almeno: { rep.scuri: 6 }
          effetti: { fazione.scuri: 1, monete: 60, oggetto.scuri-tre-chiavi: 1, scandalo: 0.5 }

  # ------------------------------------------------------------ 9 · la veglia, dopo Vesh (il bivio)
  - id: scuri-la-veglia
    presso: locanda-di-ilka
    immagine: ambientazione/locanda-di-ilka
    titolo: La veglia
    sommario: "Alla Locanda di Ilka i vecchi olvari vegliano Mirko Vesh, con una sedia vuota accanto al fuoco. Chi è rimasto degli Scuri c'è tutto."
    luogo: Locanda di Ilka, la sera
    area: citta-bassa
    requisiti: [fazione.scuri == 8, pista.pelle >= 6, bivio.legge != 1]
    testo: |
      Alla Locanda di Ilka hanno spostato i tavoli contro le pareti e messo accanto al fuoco una sedia vuota,
      con un bicchiere di sidro sopra. Sul pavimento restano i rettangoli chiari dove i tavoli stavano fino a
      ieri. È la veglia olvara per Mirko Vesh. I vecchi olvari siedono in cerchio con il cappello sulle
      ginocchia, e Besk versa senza far pagare nessuno. Ilka Dravec tiene gli occhi lattiginosi sulla sedia e
      racconta di quando Mirko, da bambino, le rubava le castagne dalla padella.

      Gaia siede per terra vicino alla porta, e Karn è appoggiato al muro e non fischia.

      {accademiche Media} Alle veglie olvare ognuno dice ad alta voce un debito con il morto, e Ilka lo chiude
      con una goccia di sidro nel fuoco. Chi parla per ultimo si prende i debiti che nessuno ha reclamato.

      {origine figlio-della-citta-bassa} Alle veglie olvare ci andavi da bambin{o|a} per le patate speziate, e
      l'ultimo a parlare era sempre il più vecchio.

      Sulla soglia compare Durgan, il nano delle cicatrici, con due mercenari di Ghoran alle spalle. Entra
      senza togliersi niente e appoggia l'ascia al muro accanto a Karn. Il manico è fasciato di cuoio,
      annerito nel punto dove la mano lo stringe. Poi Durgan si siede nel cerchio.
    opzioni:
      - testo: "Restare nel cerchio"
        descrizione: "Durgan vuole parlare per ultimo. Bisogna essere ancora seduti quando tocca."
        quando: [fazione.caserma == 0]
        esito:
          titolo: Il cerchio
          testo: |
            Resti sedut{o|a}. Uno dopo l'altro i vecchi olvari dicono il loro debito con Mirko, e Ilka fa
            cadere la goccia di sidro nel fuoco, che a ogni goccia sfrigola. Durgan aspetta con le mani sulle
            ginocchia. Il cerchio si stringe, e alla fine restate soltanto voi due a non avere parlato.
          imposta: { bivio.legge: 2 }
          segue: scuri-chi-parla-per-ultimo

      - testo: "Dire a Gaia che dalla Caserma hai chiuso"
        descrizione: "Gaia ti ha visto entrare e uscire dalla Caserma. Prima del cerchio ti chiede di scegliere, perché qui stanotte si sceglie."
        quando: [fazione.caserma >= 1]
        esito:
          titolo: Il cappuccio blu
          testo: |
            Gaia ti raggiunge vicino al muro con il cappuccio blu tirato fino agli occhi. Ti chiede a bassa
            voce se stanotte sei degli Scuri o dello sceriffo, perché alla veglia di Mirko non si viene con
            tutte e due le facce. Le dici che dalla Caserma hai chiuso. Lei annuisce e torna a sedersi. Lo
            sceriffo lo saprà domani, e capirà.
          imposta: { bivio.legge: 2 }
          effetti: { rep.caserma: -2 }
          segue: scuri-chi-parla-per-ultimo

      - testo: "Alzarti e uscire"
        descrizione: "Lavori anche per la Caserma, e stanotte bisogna scegliere. Se esci adesso, gli Scuri non ti chiameranno più."
        quando: [fazione.caserma >= 1]
        immagine: personaggi/toren-galdrick
        esito:
          titolo: La porta
          testo: |
            Ti alzi ed esci mentre un vecchio olvaro dice il suo debito, e la sua voce non si interrompe.
            Sulla soglia ti volti. Gaia ti guarda andare senza muoversi, e Durgan sorride appena, perché
            adesso nel cerchio c'è un posto in meno.
          imposta: { bivio.legge: 1 }
          effetti: { rep.scuri: -2 }

      - testo: "Aspettare un altro giro"
        descrizione: "La veglia dura tutta la notte. Si può ancora guardare, prima di scegliere."
        quando: [fazione.caserma >= 1]
        costo: 0
        esito:
          titolo: Un giro di sidro
          testo: |
            Besk ti riempie il bicchiere di un sidro torbido che sa di mele cotte, e tu guardi il fuoco. Un
            vecchio olvaro racconta di quando Mirko gli ha prestato i soldi per il funerale della moglie e poi
            non glieli ha mai chiesti indietro. Ilka fa cadere la goccia, e il cerchio aspetta.

  # ------------------------------------------------------------ 9 · il seguito, dopo Vesh (grado 3)
  - id: scuri-chi-parla-per-ultimo
    immagine: ambientazione/locanda-di-ilka
    titolo: Chi parla per ultimo
    tipo: seguito
    luogo: Locanda di Ilka, a notte fonda
    area: citta-bassa
    requisiti: [fazione.scuri == 8, bivio.legge == 2]
    testo: |
      Restate voi due, e Durgan si alza senza riprendere l'ascia. Guardando la sedia vuota dice che Mirko gli
      doveva tre mesi di paga e che se la prende dalla Città Bassa. «Gli Scuri sono morti con lui, e i debiti
      dei morti li riscuote chi ha le braccia per farlo» dice, e allarga le sue sul cerchio. Ilka non fa
      cadere la goccia di sidro e resta con la brocca sospesa sopra il fuoco. Nella stanza si sente soltanto
      un ciocco che si assesta nel camino.

      {armi-da-mischia Media} L'ascia è a un passo dalla sua mano, e un mercenario sulla porta tiene già la
      mano sul coltello.

      «Tocca a te» ti dice Ilka. Accanto a lei c'è un anello di rame con tre chiavi di ferro, e Besk ti
      racconterà che Mirko l'aveva lasciato per l'ultimo a parlare.
    opzioni:
      - testo: "Parlare per ultimo"
        descrizione: "Un debito con Mirko, detto davanti a tutti, e la parola giusta perché i vecchi olvari ti diano ragione."
        prova: { attributo: sociale, abilita: [persuasione, espressivita], difficolta: Difficile }
        successo:
          titolo: La goccia
          testo: |
            Dici il tuo debito con Mirko, e poi dici che i debiti dei morti si chiudono e non si riscuotono, e
            che chi li riscuote è un ladro di veglie. I vecchi olvari battono il cappello sulle ginocchia.
            Ilka fa cadere la goccia di sidro nel fuoco, e il fuoco sfrigola. Ti mette in mano l'anello con le
            tre chiavi, e Besk una borsa pesante. Durgan riprende l'ascia ed esce senza una parola, ma alla
            porta si volta a guardarti in faccia, per ricordarsela.
          pe: { persuasione: 5 }
          almeno: { rep.scuri: 6 }
          effetti: { fazione.scuri: 1, monete: 60, nomea.citta-bassa: 0.5, oggetto.scuri-tre-chiavi: 1 }
        fallimento:
          titolo: La voce che si incrina
          testo: |
            Dici il tuo debito con Mirko, e a metà la voce ti si incrina. Durgan sorride. I vecchi olvari
            restano zitti, e credi di avere perso. Poi Ilka fa cadere la goccia lo stesso, perché alle veglie
            conta chi parla e non come. Ti mette in mano l'anello con le tre chiavi. Durgan esce, e alla porta
            si volta a guardarti.
          almeno: { rep.scuri: 6 }
          effetti: { fazione.scuri: 1, monete: 40, tormento: 1, oggetto.scuri-tre-chiavi: 1 }

      - testo: "Lasciar parlare Rozalia per te"
        descrizione: "Rozalia lavora per te, e le parole le sa scegliere meglio di chiunque. Alle veglie, però, chi parla conta."
        quando: [macerie.rozalia == 3]
        immagine: personaggi/rozalia-marga
        prova: { attributo: sociale, abilita: [persuasione, galateo], difficolta: Media }
        successo:
          titolo: Per la precisione
          testo: |
            Rozalia si alza dal fondo della stanza, dove nessuno l'aveva vista entrare, e dice che parla a
            nome tuo. Elenca a memoria i debiti di Mirko con la Città Bassa, ognuno con la sua data, e alla
            fine dice che li chiude tutti a nome tuo. Ilka fa cadere la goccia. Ti mette in mano l'anello con
            le tre chiavi, e Durgan esce senza una parola.
          pe: { persuasione: 5 }
          almeno: { rep.scuri: 6 }
          effetti: { fazione.scuri: 1, monete: 60, oggetto.scuri-tre-chiavi: 1 }
        fallimento:
          titolo: A nome di un altro
          testo: |
            Rozalia parla a nome tuo, e i vecchi olvari si guardano fra loro, perché alle veglie non si parla
            a nome di un altro. Ilka aspetta che tu dica almeno una parola, e tu la dici. La goccia cade. Ti
            mette in mano l'anello con le tre chiavi, ma la borsa di Besk è più leggera.
          almeno: { rep.scuri: 6 }
          effetti: { fazione.scuri: 1, monete: 40, oggetto.scuri-tre-chiavi: 1, scandalo: 0.5 }

      - testo: "Dire soltanto il tuo debito, e sederti"
        descrizione: "Nessun discorso. Un debito detto a voce, come fanno i vecchi, e poi si aspetta."
        esito:
          titolo: Il debito detto a voce
          testo: |
            Dici il tuo debito con Mirko in una frase sola, come i vecchi olvari, e ti risiedi. Durgan aspetta
            che tu continui, e tu non continui. Ilka fa cadere la goccia nel fuoco, perché alle veglie basta
            quello. Ti mette in mano l'anello con le tre chiavi. Durgan esce, e alla porta si volta a
            guardarti in faccia.
          almeno: { rep.scuri: 6 }
          effetti: { fazione.scuri: 1, monete: 40, oggetto.scuri-tre-chiavi: 1 }

      - testo: "Raccontare le tue consegne per Mirko"
        descrizione: "Da ragazzin{o|a} portavi i pacchi degli Scuri su e giù per Via del Salmone. Ilka ti ha visto crescere."
        quando: [origine.figlio-della-citta-bassa >= 1]
        esito:
          titolo: Il ragazzo delle consegne
          testo: |
            Racconti di quando portavi i pacchi per Mirko, e del pacco che ti si è rotto in mano e che lui ti
            ha perdonato. Ilka ride con la sua voce roca e ti lascia parlare fino in fondo. Fa cadere la
            goccia senza che nessuno la chieda, e ti mette in mano l'anello con le tre chiavi. Besk ti dà una
            borsa pesante, mentre Durgan esce senza voltarsi.
          almeno: { rep.scuri: 6 }
          effetti: { fazione.scuri: 1, monete: 60, nomea.citta-bassa: 0.5, oggetto.scuri-tre-chiavi: 1 }

  # ------------------------------------------------------------ 10 · il gettone d'argilla
  - id: scuri-il-gettone-d-argilla
    immagine: ambientazione/citta-bassa
    titolo: Il gettone d'argilla
    sommario: "Sulle porte della Città Bassa compaiono gettoni d'argilla inchiodati al legno. Chi li ha, paga la protezione ai mercenari di Durgan."
    luogo: Città Bassa, Via del Salmone
    area: citta-bassa
    requisiti: [fazione.scuri == 9, pista.pelle >= 6, bivio.legge == 2]
    testo: |
      In una settimana i gettoni d'argilla sono comparsi su metà delle porte di Via del Salmone, inchiodati
      all'altezza degli occhi. Sono dischi d'argilla secca grandi come una moneta grossa con un segno inciso a
      punta, e il chiodo che li tiene è nuovo e lucido nel legno annerito delle porte. Chi ha il gettone paga
      la protezione ai mercenari di Durgan ogni venerdì, e chi non ce l'ha lo avrà presto. Il Consiglio non
      paga i mercenari, e Durgan la paga se l'è trovata da solo.

      {rissa Facile} I mercenari passano a riscuotere in tre. Quello in mezzo porta il sacco con tutte e due
      le mani, e per far cadere il sacco bisogna stendere lui per primo.

      Gaia ti cammina accanto con il cappuccio basso. «Hagra non è d'accordo con lui» dice. «L'ho sentita
      dirgli che a Ghoran chi taglieggia le donne perde la faccia, e lui le ha risposto che a Ghoran adesso
      non ci tornano.»

      {origine fuggiasco-di-ghoran} I mercenari dicono che il clan paga quando torna, e a Ghoran tutti sanno
      che vuol dire mai. Su queste porte il gettone segna un debito che nessuno di loro ha intenzione di
      saldare.
    opzioni:
      - testo: "Seguire i gettoni fino a chi li incide"
        descrizione: "Un gettone esce da una mano sola, e la mano sta da qualche parte con l'argilla sotto le unghie."
        prova: { attributo: mentale, abilita: [percezione, politica-ed-economia], difficolta: Media }
        successo:
          titolo: Il magazzino dell'argilla
          testo: |
            Segui il mercenario con il sacco dal venerdì al sabato, e il sabato lo vedi entrare in un
            magazzino vicino all'Orlo. Dentro un vecchio dei clan incide gettoni su un tavolo con il
            punteruolo, e ha le mani grigie di polvere d'argilla fino ai polsi. Ne conti duecento pronti, in
            fila come pani. Gaia porta il conto a Rozalia, e Rozalia dice che Durgan sta comprando i
            funzionari di Mirko con i soldi dei gettoni e che una cosa simile si batte soltanto con il timbro.
          pe: { percezione: 5 }
          effetti: { fazione.scuri: 1, rep.scuri: 1, monete: 15, informazioni.segreto: 1 }
        fallimento:
          titolo: Il sacco
          testo: |
            Segui il mercenario con il sacco, e al secondo angolo lui si gira e ti aspetta con i due compagni.
            Ti chiedono se vuoi un gettone anche tu, e quello con il sacco te ne mostra uno sul palmo aperto.
            Te ne vai senza voltarti, e senti le loro risate fino in fondo alla strada.
          effetti: { sospetto: 1 }

      - testo: "Liberare una strada intera"
        descrizione: "Tre mercenari passano a riscuotere il venerdì. Se una strada li vede scappare, le altre se lo ricordano."
        combattimento: scuri-la-strada-dei-gettoni
        vittoria:
          titolo: La strada pulita
          testo: |
            Li aspetti il venerdì in fondo a Via del Salmone, e quando il sacco cade si rompe e i gettoni
            rotolano nel tombino. I mercenari se ne vanno zoppicando. La strada ti guarda dalle finestre, e
            prima di sera i gettoni sono spariti da tutte le porte. Nel legno restano soltanto i buchi dei
            chiodi. Rozalia ti fa sapere che Durgan adesso compra i funzionari di Mirko, e che si batte
            soltanto con il timbro.
          effetti: { fazione.scuri: 1, rep.scuri: 1, monete: 15, nomea.citta-bassa: 1 }
        sconfitta:
          titolo: Il venerdì
          testo: |
            Sono tre e tu sei un{o|a}, e il venerdì finisce con te sedut{o|a} contro una porta e un gettone
            d'argilla infilato nel colletto. L'argilla è fredda e ti gratta la nuca. La strada ti ha visto
            dalle finestre. Gaia ti aiuta ad alzarti e ti toglie il gettone dal colletto, e lo butta nel
            tombino.
          effetti: { nomea.citta-bassa: -0.5 }

      - testo: "Far arrivare le prove a Galdrick, tramite Gaia"
        descrizione: "La Caserma ha portato i mercenari in città."
        quando: [galdrick.via == 0]
        prova: { attributo: sociale, abilita: [ingannare, conoscenze-della-strada], difficolta: Media }
        successo:
          titolo: La mossa di Mirko
          testo: |
            Dai a Gaia una lista di porte e di venerdì, scritta da Rozalia con la grafia di un bottegaio
            spaventato e le righe che scendono storte verso il fondo del foglio. Gaia la fa arrivare alla
            Caserma come una volta faceva con le sue notizie. Tre giorni dopo la milizia passa per Via del
            Salmone e stacca i gettoni dalle porte uno per uno con una tenaglia. Rozalia ride e dice che è la
            mossa che avrebbe fatto Mirko. Poi aggiunge che Durgan adesso compra i funzionari.
          pe: { ingannare: 5 }
          effetti: { fazione.scuri: 1, rep.scuri: 1, monete: 15, rep.caserma: 1 }
        fallimento:
          titolo: La grafia
          testo: |
            La lista arriva alla Caserma, e il sergente la confronta con la grafia di Rozalia che è nel
            registro delle visite. Tiene i due fogli affiancati sul tavolo e passa il dito sulle stesse
            lettere. Galdrick fa staccare i gettoni lo stesso, e poi fa chiamare te. Ti chiede se hai altro da
            dirgli, e tu ti guardi bene dal rispondere di sì.
          effetti: { fazione.scuri: 1, rep.scuri: 0.5, rep.caserma: -1, sospetto: 1.5 }

      - testo: "Parlare con Hagra"
        descrizione: "Hagra non è d'accordo con Durgan. Se nella faccenda del prosciutto l'hai trattata bene, ti ascolta."
        quando: [guarnigione.mercenari >= 1]
        prova: { attributo: sociale, abilita: [persuasione, empatia], difficolta: Facile }
        successo:
          titolo: La resina
          testo: |
            Trovi Hagra al Mercato dei Nodi davanti a un banco di prosciutti. Mastica resina con le tre righe
            di argilla secca sulla faccia, e ti riconosce subito. Ti dice che una parte dei mercenari non
            vuole riscuotere dalle donne e che sta con Durgan solo perché la Caserma non paga. «Eh» dice, e
            sputa la resina. «Se paga qualcun altro, cambia tutto.» Rozalia, quando lo viene a sapere, dice
            che Durgan sta comprando i funzionari.
          pe: { persuasione: 5 }
          imposta: { scuri.hagra: 1 }
          effetti: { fazione.scuri: 1, rep.scuri: 1, monete: 15 }
        fallimento:
          titolo: Il prosciutto
          testo: |
            Trovi Hagra al Mercato dei Nodi, e lei ti ascolta masticando resina. Poi ti dice che con il
            prosciutto sei stat{o|a} gentile e che la gentilezza la ricorda, però la paga la dà Durgan. Sputa
            la resina accanto ai tuoi stivali e torna dai suoi. Sul selciato resta una pallina scura con il
            segno dei denti.
          effetti: { scandalo: 0.5 }

      - testo: "Dire ai mercenari quello che sa chi è scappato"
        descrizione: "Il clan paga quando torna, e a Ghoran tutti sanno che vuol dire mai. Detto nella lingua dei clan, il gettone pesa diverso."
        quando: [origine.fuggiasco-di-ghoran >= 1]
        esito:
          titolo: Mai
          testo: |
            Fermi il mercenario con il sacco e gli dici nella lingua dei clan che il clan paga quando torna, e
            che lui a Ghoran non ci tornerà. Lui ti guarda a lungo con la mano ferma sulla bocca del sacco. Ti
            dice dov'è il magazzino dove incidono i gettoni, e che Durgan con quei soldi compra i funzionari
            di Mirko. Rozalia, quando glielo racconti, dice che si batte soltanto con il timbro.
          effetti: { fazione.scuri: 1, rep.scuri: 1, monete: 15, informazioni.segreto: 1 }
