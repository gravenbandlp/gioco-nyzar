# La quest degli Scuri, passi 6-10 (fazione.scuri 5 → 10).
# 6 Le chiavi vecchie (grado 2), alla Caserma. Prima: il ragazzo che faceva il palo in Via dei Rasoi è in cella, e
#   Vesh lo vuole fuori prima che parli (Borso guarda altrove, la porta la apre qualcun altro; con galdrick.via 1 il
#   cambio della guardia è più facile). Dopo: Mauro in attesa del processo (mauro 0 o 1) o, se è morto, Nestor in
#   catene, che sa dov'è la seconda dispensa e può dare la ricetta della pasta nera (scuri.nestor).
# 7 Il tavolo di Mirko. Prima: Vesh nel cortile delle risse, che ha capito che il tempo dei profili bassi è finito, e
#   il messaggio a voce per Ottone Malgrani al mulino (seguito). Con il registro dei Malgrani negli Averi Vesh ne
#   vuole una copia. Dopo: gli anelli tornati ai debitori, e i debiti di chi li riscuote per primo.
# 8 Prima della prossima luna, con Gaia. Prima: Vesh l'ha condannata e vuole che sia tu a sistemare la cosa; nessuna
#   strada la fa sparire (gaia 2 se l'avverti o la porti da Galdrick). Dopo: Gaia ha riconosciuto il segno dei
#   gettoni, il marchio di un clan di Ghoran che ha anche lei sotto la spalla, e vuole sparire.
# 9 L'ultimo ordine (grado 3) e il bivio con la Caserma (bivio.legge). Prima: la cantina della Pignatta il pomeriggio
#   dell'assalto (pista.pelle == 5), Vesh ti dà le tre chiavi. Dopo: la veglia olvara per Vesh alla Locanda di Ilka,
#   dove entra Durgan. In tutte e due la scena d'ingresso porta bivio.legge a 2 (con la scelta in scena e rep.caserma
#   −2 se la quest della Caserma è cominciata, oppure la Caserma, con bivio.legge 1 e rep.scuri −2); il seguito chiude
#   il passo. La veglia olvara è un'invenzione misurata: la sedia vuota del morto, il sidro, i debiti detti a voce.
# 10 Il gettone d'argilla (bivio.legge == 2): la guerra con Durgan comincia. Hagra (scuri.hagra) si può staccare da
#   lui se i trenta di Ghoran sono finiti bene (guarnigione.mercenari).
storylet:
  # ------------------------------------------------------------ 6 · le chiavi vecchie, prima di Vesh (grado 2)
  - id: scuri-le-chiavi-vecchie
    presso: guarnigione-di-qir-azel
    immagine: personaggi/borso
    titolo: Le chiavi vecchie
    sommario: "Un ragazzo degli Scuri è in una cella della Caserma, e Mirko Vesh lo vuole fuori prima che parli."
    luogo: Guarnigione di Qir-Azel, il cortile e le celle
    area: quartieri-alti
    requisiti: [fazione.scuri == 5, pista.pelle < 4]
    testo: |
      Il ragazzo che faceva il palo in Via dei Rasoi sta da una settimana in
      una cella del piano interrato della Caserma. Ha sedici anni e una
      lingua lunga, e a Mirko le lingue lunghe nelle celle non piacciono.
      «Borso guarda altrove, però la porta non la apre lui» ti dice Mauro al
      bancone, rigirando un fico secco che non si decide a mangiare. Ti dà
      un mazzo di vecchie chiavi di ferro unte d'olio, legate con un laccio
      da scarpe.

      La porta del piano interrato resta senza guardia solo al rintocco
      della sesta, per il minuto scarso del cambio.

      {galateo Facile} Alla Caserma un ordine con il sigillo giusto apre più
      porte di un mazzo di chiavi, e il sergente legge piano.

      {origine figlio-della-citta-bassa} Il ragazzo lo conosci di vista. Ti
      correva dietro quando portavi i pacchi, e voleva sempre portare il più
      pesante.
    opzioni:
      - testo: "Presentare un ordine di trasferimento falso"
        descrizione: "Rozalia scrive un ordine di trasferimento con il sigillo della Caserma, da far leggere al sergente."
        prova: { attributo: sociale, abilita: [galateo, ingannare], difficolta: Difficile }
        successo:
          titolo: Il trasferimento
          testo: |
            Il sergente legge l'ordine di Rozalia muovendo le labbra e fa scendere
            due miliziani. Il ragazzo esce legato per il trasferimento, e al primo
            vicolo le mani gli si slegano da sole. La sera Mauro ti presenta a un
            uomo magro con un anello per dito, e sei nel registro.
          pe: { galateo: 5 }
          almeno: { rep.scuri: 4 }
          effetti: { fazione.scuri: 1, rep.caserma: -1, oggetto.scuri-cappuccio-degli-scuri: 1 }
        fallimento:
          titolo: Il sigillo controluce
          testo: |
            Il sergente guarda il sigillo controluce troppo a lungo, poi ti dice
            che gli ordini di trasferimento li firma lo sceriffo, e non di
            domenica. Te ne vai prima che ti chieda come ti chiami.
          effetti: { sospetto: 1.5 }

      - testo: "Aprire la cella al cambio della guardia"
        descrizione: "Al rintocco della sesta la porta del piano interrato resta sola per un minuto scarso."
        quando: [galdrick.via == 0]
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Media }
        successo:
          titolo: Il cambio della guardia
          testo: |
            Al rintocco della sesta scendi fra una guardia e l'altra, e le chiavi
            unte girano senza rumore. Il ragazzo esce scalzo mentre Borso, in
            fondo al corridoio, volta la testa verso il muro. La sera Mauro ti
            presenta a un uomo magro con un anello per dito, e sei nel registro.
          pe: { furtivita: 5 }
          almeno: { rep.scuri: 4 }
          effetti: { fazione.scuri: 1, rep.caserma: -1, oggetto.scuri-cappuccio-degli-scuri: 1 }
        fallimento:
          titolo: La guardia nuova
          testo: |
            La guardia nuova arriva in anticipo e ti trova sulle scale. Fai cadere
            le chiavi in un secchio d'acqua sporca e dici che cercavi il pozzo, e
            lui ti accompagna con molta cortesia al pozzo, che è nel cortile.
          effetti: { sospetto: 1.5 }

      - testo: "Aprire la cella mentre lo sceriffo è a Ghoran"
        descrizione: "Con Galdrick a Ghoran la Caserma dorme di più, e il cambio della guardia si fa quando capita."
        quando: [galdrick.via == 1]
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Facile }
        successo:
          titolo: La Caserma che dorme
          testo: |
            Senza lo sceriffo il cambio della guardia stasera capita tardi, e le
            chiavi vecchie aprono la cella senza fretta. In fondo al corridoio
            Borso volta la testa verso il muro. La sera Mauro ti presenta a un
            uomo magro con un anello per dito, e sei nel registro.
          pe: { furtivita: 5 }
          almeno: { rep.scuri: 4 }
          effetti: { fazione.scuri: 1, rep.caserma: -1, oggetto.scuri-cappuccio-degli-scuri: 1 }
        fallimento:
          titolo: Il sergente sveglio
          testo: |
            Lo sceriffo è a Ghoran, ma il sergente è sveglio e ti trova sulle
            scale con le chiavi in mano. Dici che cercavi il pozzo, e lui ti ci
            accompagna e ti guarda bere fino in fondo.
          effetti: { sospetto: 1.5 }

      - testo: "Firmare tu il rilascio"
        descrizione: "Un rilascio firmato da uno di casa non lo controlla nessuno, almeno finché lo sceriffo non legge tutto."
        requisiti: [rep.caserma >= 4]
        esito:
          titolo: La tua firma
          testo: |
            Il sergente ti conosce, e mette il rilascio con la tua firma sul
            mucchio senza leggerlo. La sera Mauro ti presenta a un uomo magro con
            un anello per dito, e sei nel registro. La settimana dopo lo sceriffo
            legge tutto.
          almeno: { rep.scuri: 4 }
          effetti: { fazione.scuri: 1, rep.caserma: -2, oggetto.scuri-cappuccio-degli-scuri: 1 }

      - testo: "Restituire le chiavi a Mauro"
        descrizione: "Rinunciare a una cella della Caserma è lecito, e Mauro se lo ricorderà."
        costo: 0
        esito:
          titolo: Il fico secco
          testo: |
            Posi il mazzo di chiavi sul bancone, e Mauro finalmente mangia il fico
            secco. Le chiavi restano lì, ti dice, nel caso tu cambiassi idea, e
            per il resto della sera non ti versa da bere.
          effetti: { rep.scuri: -1 }

  # ------------------------------------------------------------ 6 · le chiavi vecchie, dopo Vesh, con Mauro in cella
  - id: scuri-le-chiavi-vecchie-dopo
    presso: guarnigione-di-qir-azel
    immagine: personaggi/mauro-scrocco
    titolo: Le chiavi vecchie
    sommario: "Mauro Scrocco aspetta il processo in una cella della Caserma, con a memoria i debiti di tutta la Città Bassa."
    luogo: Guarnigione di Qir-Azel, le celle del piano interrato
    area: quartieri-alti
    requisiti: [fazione.scuri == 5, pista.pelle >= 6, mauro != 2]
    testo: |
      Mauro Scrocco aspetta il processo in fondo al corridoio delle celle, e
      senza la camicia color zafferano sembra più vecchio. Siede sulla panca
      con le mani sulle ginocchia, come un oste che aspetta l'ultimo cliente,
      e alla grata ti fa il sorriso del bancone.

      «Al processo mi chiederanno chi deve cosa a chi» dice. «I debiti della
      Città Bassa li so tutti a memoria. Se li dico ho la vita salva, e la
      Città Bassa paga la Caserma invece di pagare voi. Gaia mi ha detto che
      adesso sei tu quello che ci sale, alla Caserma.»

      {empatia Media} Ha paura di arrivare al processo senza che nessuno gli
      abbia chiesto di tacere.

      In un'altra cella Borso sta in catene con gli occhi al muro, e non si
      volta nemmeno al nome di Mauro. *I debiti di una città intera, in una
      testa sola.* Ti accorgi di avere abbassato la voce.
    opzioni:
      - testo: "Convincerlo a tacere"
        descrizione: "Mauro deve arrivare al processo con la bocca chiusa, sapendo che chi è rimasto si ricorderà di lui."
        prova: { attributo: sociale, abilita: [empatia, persuasione], difficolta: Media }
        successo:
          titolo: La bocca chiusa
          testo: |
            Gli prometti che chi è rimasto pagherà la sua parte alla moglie. Mauro
            ascolta a occhi chiusi e ti fa il cenno del bancone con il mento. La
            sera Gaia ti porta un cappuccio di lana grigia, il segno che sei nel
            registro anche se il registro non c'è più.
          pe: { empatia: 5 }
          almeno: { rep.scuri: 4 }
          effetti: { fazione.scuri: 1, rep.caserma: -1, oggetto.scuri-cappuccio-degli-scuri: 1 }
        fallimento:
          titolo: Il bancone
          testo: |
            Mauro ti ascolta sorridendo come al bancone, quando un cliente gli
            raccontava una storia che sapeva già, e alla fine ti dice che ci
            penserà. Torni su senza sapere che cosa dirà al giudice.
          effetti: { tormento: 0.5 }

      - testo: "Fargli paura"
        descrizione: "Mauro sa che cosa succede a chi parla, perché gliel'ha fatto succedere lui tante volte."
        prova: { attributo: sociale, abilita: [intimidire, conoscenze-della-strada], difficolta: Media }
        successo:
          titolo: La regola di casa
          testo: |
            Gli ricordi che in cella le gambe si rompono più facilmente. Mauro
            smette di sorridere, poi fa una risata corta e ti dice che hai
            imparato bene. La sera Gaia ti porta un cappuccio di lana grigia, il
            segno che sei nel registro.
          pe: { intimidire: 5 }
          almeno: { rep.scuri: 4 }
          effetti: { fazione.scuri: 1, rep.caserma: -1, oggetto.scuri-cappuccio-degli-scuri: 1 }
        fallimento:
          titolo: Il ragazzo
          testo: |
            Mauro ti guarda come un ragazzo che gioca a fare il grande e ti dice
            di tornare quando avrai rotto una gamba vera. Uscendo, la guardia in
            fondo al corridoio ti segna sul suo foglio.
          effetti: { sospetto: 1 }

      - testo: "Pagare la guardia perché lo tratti bene"
        descrizione: "Un uomo trattato bene aspetta il processo tranquillo, e la guardia accetta monete."
        requisiti: [monete >= 25]
        esito:
          titolo: Il vino della guardia
          testo: |
            Paghi la guardia perché a Mauro arrivino una coperta e il vino al
            posto dell'acqua, e al processo lui dice soltanto i debiti dei morti.
            La sera Gaia ti porta un cappuccio di lana grigia, il segno che sei
            nel registro.
          almeno: { rep.scuri: 4 }
          effetti: { fazione.scuri: 1, monete: -25, rep.caserma: -1, oggetto.scuri-cappuccio-degli-scuri: 1 }

      - testo: "Firmare tu il permesso di visita"
        descrizione: "Un permesso firmato da uno di casa porta Rozalia o Gaia alla grata, e con loro Mauro parla."
        requisiti: [rep.caserma >= 4]
        esito:
          titolo: Le visite
          testo: |
            Con i tuoi permessi alla grata di Mauro passano le facce di chi è
            rimasto, e al processo lui tace. Lo sceriffo trova il tuo nome su ogni
            pagina del registro delle visite. La sera Gaia ti porta un cappuccio
            di lana grigia, il segno che sei nel registro.
          almeno: { rep.scuri: 4 }
          effetti: { fazione.scuri: 1, rep.caserma: -2, oggetto.scuri-cappuccio-degli-scuri: 1 }

  # ------------------------------------------------------------ 6 · le chiavi vecchie, dopo Vesh, con Mauro morto
  - id: scuri-le-chiavi-vecchie-nestor
    presso: guarnigione-di-qir-azel
    immagine: personaggi/nestor-gramm
    titolo: Le chiavi vecchie
    sommario: "Nestor Gramm, in catene alla Caserma, prepara le tisane ai carcerieri e sa dove sta la seconda dispensa degli Scuri."
    luogo: Guarnigione di Qir-Azel, le celle del piano interrato
    area: quartieri-alti
    requisiti: [fazione.scuri == 5, pista.pelle >= 6, mauro == 2]
    testo: |
      Nestor Gramm sta in catene in una cella del piano interrato, con il
      grembiule grigio e la catena abbastanza lunga da arrivare alla stufa
      del corridoio, dove fa bollire le tisane per i carcerieri. Ti versa una
      tazza che non bevi, come ti ha raccomandato Gaia.

      «Mauro è morto sullo spiazzo, e i debiti se li è portati con sé» dice.
      «La seconda dispensa invece è ancora piena. Sta sotto il Mercato dei
      Nodi, dietro una porta che conosciamo in due, e l'altro è morto. Io in
      questa cella ci resto vent'anni. Che cosa mi date, per la porta?»

      {medicina Media} La tisana è camomilla e scorza d'arancia. Ai
      carcerieri la fa più forte, ed è per questo che lo lasciano arrivare
      alla stufa.

      {ingannare Media} Sulla porta ha esitato un momento di troppo, e la
      porta non la conoscono in due.
    opzioni:
      - testo: "Farti dare la ricetta della pasta nera"
        descrizione: "Nestor insegna la pasta nera, che chiude le ferite in una notte, solo a chi se ne intende."
        prova: { attributo: mentale, abilita: [medicina, natura], difficolta: Media }
        successo:
          titolo: La pasta nera
          testo: |
            Nomini le erbe giuste, e Nestor ti guarda per la prima volta come un
            collega. Ti detta la pasta nera ingrediente per ingrediente, e poi la
            porta della dispensa. La sera Gaia ti porta un cappuccio di lana
            grigia, il segno che sei nel registro.
          pe: { medicina: 5 }
          almeno: { rep.scuri: 4 }
          imposta: { scuri.nestor: 1 }
          effetti: { fazione.scuri: 1, rep.caserma: -1, oggetto.scuri-cappuccio-degli-scuri: 1 }
        fallimento:
          titolo: L'erba sbagliata
          testo: |
            Nomini un'erba sbagliata, e Nestor si mette a ridere così forte che
            la catena tintinna. Ti versa un'altra tazza di camomilla e ti dice
            di tornare quando saprai distinguere la ruta dalla salvia.
          effetti: { scandalo: 0.5 }

      - testo: "Promettergli che i suoi avranno la loro parte"
        descrizione: "Nestor ha una sorella al Mercato dei Nodi, e chi è rimasto può pagarle quello che lui non guadagna."
        prova: { attributo: sociale, abilita: [persuasione, empatia], difficolta: Media }
        successo:
          titolo: La sorella
          testo: |
            Gli prometti la parte di sua sorella ogni mese, e Nestor, dopo averci
            pensato mescolando la tisana, ti dice della porta dietro il banco
            delle spezie. Nella seconda dispensa Gaia trova boccette e unguenti, e
            un cappuccio di lana grigia per te, il segno che sei nel registro.
          pe: { persuasione: 5 }
          almeno: { rep.scuri: 4 }
          effetti: { fazione.scuri: 1, rep.caserma: -1, unguento: 2, oggetto.scuri-cappuccio-degli-scuri: 1 }
        fallimento:
          titolo: Le promesse
          testo: |
            Nestor ascolta le tue promesse annuendo, poi ti dice che le faceva
            anche Mirko, e lui è in catene lo stesso, e si volta verso la stufa.
          effetti: { scandalo: 0.5 }

      - testo: "Pagare la guardia perché gli allunghi la catena"
        descrizione: "Una catena più lunga arriva alla finestra, e per un uomo in cella è un regalo grande."
        requisiti: [monete >= 25]
        esito:
          titolo: La finestra
          testo: |
            Con le tue monete la guardia allunga la catena di Nestor fino alla
            finestra, e lui guarda il cielo per un'ora prima di dirti della porta
            dietro il banco delle spezie. La sera Gaia ti porta un cappuccio di
            lana grigia, il segno che sei nel registro.
          almeno: { rep.scuri: 4 }
          effetti: { fazione.scuri: 1, monete: -25, rep.caserma: -1, oggetto.scuri-cappuccio-degli-scuri: 1 }

  # ------------------------------------------------------------ 7 · il tavolo di Mirko, prima di Vesh
  - id: scuri-il-tavolo-di-mirko
    presso: pignatta-grassa
    immagine: personaggi/mirko-vesh
    titolo: Il tavolo di Mirko
    sommario: "Mirko Vesh ti aspetta nel cortile delle risse e vuole sapere tutto quello che hai visto."
    luogo: Pignatta Grassa, il cortile delle risse
    area: citta-bassa
    requisiti: [fazione.scuri == 6, pista.pelle < 4]
    testo: |
      Nel cortile delle risse, vuoto a quest'ora, c'è una sedia sola dentro il
      cerchio di gesso. Mirko Vesh ci sta seduto, magro ed elegante, con un
      anello a ogni dito, e ti fa segno di sederti per terra davanti a lui.
      Mentre gli racconti della razzia del Festival e di Capomozzo si gira gli
      anelli dal pollice al mignolo come un rosario, tranne quello liscio del
      mignolo sinistro.

      «Dopo la razzia la città è diventata grande» dice, «e Ottone Malgrani mi
      guarda come un debito da chiudere. Gli abbiamo bruciato i mulini dei
      concorrenti, a quell'uomo, uno dopo l'altro.» Ti dà un messaggio per
      Ottone, da portare a voce al mulino all'alba.

      {empatia Media} Teme che sia finito il tempo in cui bastava avere paura
      di lui, più di quanto tema Ottone.
    opzioni:
      - testo: "Portare il messaggio al mulino"
        descrizione: "Un messaggio a voce per Ottone Malgrani e nessun altro, che Mirko ti fa ripetere."
        esito:
          titolo: Il messaggio
          testo: |
            Mirko ti fa ripetere il messaggio tre volte e alla terza ti corregge
            una parola. «I mulini bruciano anche per due.» Poi ti manda via prima
            che il cortile si riempia.
          segue: scuri-il-mulino-all-alba

      - testo: "Offrirgli il registro dei Malgrani da copiare"
        descrizione: "Nei tuoi Averi c'è il registro dei pagamenti di Ottone agli Scuri, e Rozalia può copiarlo in una notte."
        quando: [oggetto.registro-dei-malgrani >= 1]
        prova: { attributo: mentale, abilita: [accademiche, percezione], difficolta: Difficile }
        successo:
          titolo: La copia di una notte
          testo: |
            Passi la notte nel retrobottega a dettare il registro a Rozalia, che
            copia con due penne, una per mano. All'alba Mirko sfoglia la copia
            sorridendo e ti dà il messaggio per Ottone.
          pe: { accademiche: 5 }
          effetti: { rep.scuri: 1, informazioni.segreto: 1 }
          segue: scuri-il-mulino-all-alba
        fallimento:
          titolo: Le cifre sbagliate
          testo: |
            All'alba Rozalia trova nella copia tre righe sbagliate per colpa tua.
            Mirko la sfoglia senza commenti e ti dà il messaggio per Ottone.
          effetti: { tormento: 1 }
          segue: scuri-il-mulino-all-alba

      - testo: "Raccontargli quello che non ti ha chiesto"
        descrizione: "Mirko vuole sapere tutto, e una cosa che non sa ancora vale più delle risposte."
        prova: { attributo: sociale, abilita: [persuasione, espressivita], difficolta: Media }
        successo:
          titolo: La cosa che non sapeva
          testo: |
            Gli racconti di una faccia vista alla Caserma che non dovrebbe
            esserci, e Mirko smette di girarsi gli anelli. Alla fine ti cede la
            sua sedia e ti affida il messaggio per Ottone.
          pe: { persuasione: 5 }
          effetti: { rep.scuri: 0.5 }
          segue: scuri-il-mulino-all-alba
        fallimento:
          titolo: La cosa che sapeva già
          testo: |
            Mirko ti dice il nome di quella faccia prima che tu finisca, perché lo
            sapeva già. Ti dà il messaggio per Ottone con un sorriso gentile, come
            si dà un dolce a un bambino che ha detto una bugia.
          segue: scuri-il-mulino-all-alba
          effetti: { scandalo: 0.5 }

  # ------------------------------------------------------------ 7 · il seguito, al mulino all'alba
  - id: scuri-il-mulino-all-alba
    presso: segheria-e-mulino-malgrani
    immagine: personaggi/ottone-malgrani
    titolo: Il mulino all'alba
    tipo: seguito
    luogo: Il mulino dei Malgrani, all'alba
    area: citta-bassa
    requisiti: [fazione.scuri == 6, pista.pelle < 4]
    testo: |
      All'alba il mulino è già bianco di farina e la ruota gira sul canale del
      cristallo con un rumore di pioggia. Ottone Malgrani arriva a cavallo e
      infila una mano in un sacco per sentire la macinatura. Quando ti vede
      accanto alla ruota manda le sue due guardie a controllare i carri.

      Gli dici il messaggio parola per parola. «I mulini bruciano anche per
      due.» Ottone si pulisce lentamente la mano sulla giubba.

      {empatia Media} La mano gli trema mentre la pulisce. Ha capito il
      messaggio meglio di te.

      {origine rampollo-dei-quartieri-alti} Ottone ti ha visto ai ricevimenti,
      e adesso ti guarda come un cane di casa che morde.
    opzioni:
      - testo: "Leggere la sua paura e riferirla a Mirko"
        descrizione: "Mirko vuole sapere come l'ha presa, e le mani di Ottone contano più delle sue parole."
        prova: { attributo: sociale, abilita: [empatia, percezione], difficolta: Media }
        successo:
          titolo: Le mani di Ottone
          testo: |
            Ottone ti dice di riferire che non dimentica gli amici, con le mani
            strette dietro la schiena. Quando lo racconti, Mirko si gira l'anello
            liscio per la prima volta da quando lo conosci, e ti fa dare da Mauro
            una borsa pesante.
          pe: { empatia: 5 }
          effetti: { fazione.scuri: 1, rep.scuri: 1, monete: 40, informazioni.segreto: 1 }
        fallimento:
          titolo: Le parole di Ottone
          testo: |
            Riferisci a Mirko le parole di Ottone e basta. Lui ti chiede delle
            mani, che tu non hai guardato, e ti fa dare la borsa lo stesso, un po'
            più leggera.
          effetti: { fazione.scuri: 1, rep.scuri: 0.5, monete: 30, scandalo: 0.5 }

      - testo: "Aggiungere qualcosa di tuo al messaggio"
        descrizione: "Un messaggio è più forte se chi lo porta sembra sapere più di quello che dice."
        prova: { attributo: sociale, abilita: [intimidire, ingannare], difficolta: Media }
        successo:
          titolo: Il mulino di Anselmo Brey
          testo: |
            Aggiungi che l'unico mulino ancora intero, oltre ai suoi, è quello di
            Anselmo Brey, e che sarebbe un peccato. Ottone impallidisce sotto la
            farina. Mirko ride fino a tossire e ti fa dare da Mauro una borsa
            pesante, ma ti proibisce di rifarlo senza chiedere.
          pe: { intimidire: 5 }
          effetti: { fazione.scuri: 1, rep.scuri: 1, monete: 40, sospetto: 1 }
        fallimento:
          titolo: La guardia in livrea
          testo: |
            Ottone chiama una guardia con un fischio, e la guardia ti accompagna
            fino al ponte con la mano sulla spada. Mirko sospira che i messaggi si
            portano interi, e Mauro ti conta una borsa leggera.
          effetti: { fazione.scuri: 1, monete: 25, sospetto: 1 }

      - testo: "Dire il messaggio e andartene"
        descrizione: "Un messaggio a voce si dice e si lascia lì, e il resto lo capisce chi lo riceve."
        esito:
          titolo: La farina sulla giubba
          testo: |
            Dici il messaggio e te ne vai lungo il canale senza voltarti. A Mirko
            racconti soltanto della farina sulla giubba di Ottone, e lui annuisce
            come se bastasse e ti fa dare da Mauro una borsa.
          effetti: { fazione.scuri: 1, rep.scuri: 0.5, monete: 35 }

  # ------------------------------------------------------------ 7 · i debiti di Mirko, dopo Vesh
  - id: scuri-il-tavolo-di-mirko-dopo
    immagine: ambientazione/citta-bassa
    titolo: I debiti di Mirko
    sommario: "Galdrick ha restituito gli anelli ai debitori di Mirko Vesh, e i debiti sono di chi li riscuote per primo."
    luogo: Città Bassa, le strade dei debitori
    area: citta-bassa
    requisiti: [fazione.scuri == 6, pista.pelle >= 6]
    testo: |
      Dopo la notte della Pignatta lo sceriffo ha restituito gli anelli di
      Mirko ai debitori ancora vivi. Restano i debiti, che adesso sono di
      chi li riscuote per primo.

      Gaia ti porta per le strade dei debitori con una lista che Rozalia ha
      scritto a memoria, una quindicina di nomi fra Via del Salmone e i
      vicoli dietro le fucine. Su una porta c'è già un gettone d'argilla
      inchiodato, e Gaia lo butta nel tombino. Al quarto nome una donna con
      un neonato in braccio ti mostra l'anello del marito appena restituito
      e ti chiede se adesso deve pagare lo stesso.
    opzioni:
      - testo: "Condonare i debiti dei più poveri"
        descrizione: "Una parte della lista non pagherà mai, e cancellarla davanti a tutti costa monete e fa parlare la strada."
        esito:
          titolo: La riga dritta
          testo: |
            Davanti alla donna con il neonato tiri una riga di carbone sui nomi
            dei più poveri, e Gaia ti guarda come se avessi bruciato una borsa. In
            una settimana mezza Via del Salmone lo sa, e l'altra metà paga in
            anticipo sperando nella prossima riga.
          effetti: { fazione.scuri: 1, rep.scuri: 0.5, nomea.citta-bassa: 1, monete: 15 }

      - testo: "Riscuotere prima dei mercenari"
        descrizione: "I mercenari di Durgan passano il venerdì, e se arrivi il giovedì la strada paga te."
        prova: { attributo: sociale, abilita: [intimidire, politica-ed-economia], difficolta: Media }
        successo:
          titolo: Il giovedì
          testo: |
            Il giovedì passi la lista porta per porta staccando i gettoni
            d'argilla, e chi paga paga a te. Il venerdì i mercenari di Durgan
            trovano le porte pulite e le borse vuote, e guardano la strada come un
            campo dopo la grandine.
          pe: { intimidire: 5 }
          effetti: { fazione.scuri: 1, rep.scuri: 1, monete: 40 }
        fallimento:
          titolo: Il venerdì anticipato
          testo: |
            Al terzo nome trovi i mercenari di Durgan già lì, passati in anticipo
            proprio questa settimana, che ti guardano dall'alto e ridono. Riscuoti
            quello che resta, e la sera Gaia conta le monete due volte e sospira.
          effetti: { fazione.scuri: 1, rep.scuri: 0.5, monete: 15, sospetto: 0.5 }

      - testo: "Rinegoziare porta per porta"
        descrizione: "Ogni debitore ha un prezzo che può pagare, e trovarlo è lavoro lungo."
        costo: 2
        esito:
          titolo: Quindici porte
          testo: |
            Ti siedi in quindici cucine, e in ognuna chiedi quanto si può pagare
            davvero e lo segni. A sera i debiti sono più piccoli e più sicuri, e
            Gaia ti dice che Mirko ci avrebbe messo meno e avrebbe preso di più.
          effetti: { fazione.scuri: 1, rep.scuri: 1, monete: 25, nomea.citta-bassa: 0.5 }

      - testo: "Bussare alle porte dei vicoli della tua infanzia"
        descrizione: "Alla gente dei vicoli dietro le fucine, che ti ha visto crescere, si chiede in un altro modo."
        quando: [origine.figlio-della-citta-bassa >= 1]
        esito:
          titolo: Il figlio di quella del secondo piano
          testo: |
            Nei vicoli dietro le fucine tutti ti riconoscono come il figlio di
            quella del secondo piano. Chi può paga e gli altri ti offrono da
            mangiare. Tiri una riga sui più poveri, e prima di sera la strada lo
            sa.
          effetti: { fazione.scuri: 1, rep.scuri: 0.5, nomea.citta-bassa: 1, monete: 15 }

  # ------------------------------------------------------------ 8 · prima della prossima luna, prima di Vesh
  - id: scuri-prima-della-prossima-luna
    presso: grifone-di-ferro
    immagine: personaggi/gaia-acari
    titolo: Prima della prossima luna
    sommario: "Mirko Vesh ha condannato Gaia Acari, che canta per lo sceriffo, e vuole che sia tu a sistemarla."
    luogo: Locanda del Grifone di Ferro, la sera
    area: ponti-sospesi
    requisiti: [fazione.scuri == 7, pista.pelle < 4]
    testo: |
      Mirko te l'ha detto girandosi l'anello del pollice. La ragazzina col
      cappuccio blu porta notizie allo sceriffo da prima della razzia, e
      lui, che lo sa da sempre, le ha fatto portare solo notizie false.
      Adesso è stanco, e l'ha condannata prima della prossima luna.
      «Sistemala tu, come vuoi. Mi interessa sapere come.»

      Gaia è al Grifone, vicino al camino, con la tazza di latte caldo che
      Brunella non le fa mai pagare. Quando ti vede entrare la stringe con
      tutte e due le mani.

      {empatia Media} Sa che sei qui per lei, e sta decidendo se ha paura di
      te.

      {origine figlio-della-citta-bassa} Gaia correva fra i vicoli quando tu
      portavi già i pacchi, con le ginocchia sbucciate e il cappuccio troppo
      grande.
    opzioni:
      - testo: "Farne un canale di notizie false per Galdrick, come vuole Mirko"
        descrizione: "Gaia continua a cantare per lo sceriffo le canzoni scritte da Mirko, e resta viva finché non lo capisce."
        quando: [gaia < 2]
        prova: { attributo: sociale, abilita: [ingannare, persuasione], difficolta: Media }
        successo:
          titolo: Le canzoni di Mirko
          testo: |
            Le dici che Mirko non sa niente e che d'ora in poi le notizie per lo
            sceriffo gliele porti tu, migliori delle sue. Lei ci crede, e il latte
            smette di tremarle nella tazza. Mirko ti dice che viva serve di più.
          pe: { ingannare: 5 }
          effetti: { fazione.scuri: 1, rep.scuri: 1, monete: 20 }
        fallimento:
          titolo: Il latte
          testo: |
            A metà del discorso Gaia posa la tazza e ti guarda come un gatto che
            finge di dormire. Poi ringrazia Brunella per il latte ed esce dalla
            porta della cucina.
          effetti: { sospetto: 0.5 }

      - testo: "Farne un canale di notizie false per Galdrick"
        descrizione: "Gaia sa che Mirko l'ha scoperta, e convincerla a cantare le sue canzoni è più difficile."
        quando: [gaia >= 2]
        prova: { attributo: sociale, abilita: [ingannare, persuasione], difficolta: Difficile }
        successo:
          titolo: Viva serve di più
          testo: |
            Le dici quasi tutta la verità. Per restare viva, adesso che Mirko sa,
            deve portare allo sceriffo quello che le darai tu. Gaia accetta con la
            tazza ferma a mezz'aria, e andando via ti dice senza rabbia che non ti
            perdonerà.
          pe: { ingannare: 5 }
          effetti: { fazione.scuri: 1, rep.scuri: 1, monete: 20 }
        fallimento:
          titolo: La porta della cucina
          testo: |
            Gaia capisce per chi deve cantare prima che tu finisca, ed esce dalla
            porta della cucina senza voltarsi. Per una settimana al Grifone
            nessuno la vede, e Brunella ti guarda come se fosse colpa tua.
          effetti: { sospetto: 0.5 }

      - testo: "Avvertirla e dire a Mirko che è scappata"
        descrizione: "Gaia sparisce per un po', e Mirko deve credere che sia scappata da sola."
        prova: { attributo: sociale, abilita: [ingannare, conoscenze-della-strada], difficolta: Difficile }
        successo:
          titolo: Scappata
          testo: |
            Gaia sparisce dalla porta della cucina prima che il latte si
            raffreddi. A Mirko racconti che è scappata ai Ponti, così bene che
            quasi ci credi anche tu. Dopo una settimana Gaia torna più magra, e
            adesso ti deve una cosa.
          pe: { ingannare: 5 }
          imposta: { gaia: 2 }
          effetti: { fazione.scuri: 1, rep.scuri: 0.5 }
        fallimento:
          titolo: L'anello liscio
          testo: |
            A Mirko racconti che Gaia è scappata ai Ponti, e lui ti ascolta
            girando l'anello liscio, cosa che non fa mai. Ti dice che ti crede, e
            capisci che non è vero. Da quel giorno Mauro ti versa da bere un po'
            meno.
          imposta: { gaia: 2 }
          effetti: { fazione.scuri: 1, rep.scuri: -1, sospetto: 0.5 }

      - testo: "Portarla da Galdrick"
        descrizione: "Lo sceriffo la protegge, però gli Scuri lo sanno entro un'ora e te la fanno pagare."
        quando: [galdrick.via == 0]
        immagine: personaggi/toren-galdrick
        esito:
          titolo: Il taccuino dello sceriffo
          testo: |
            Per la scala di servizio la porti da Galdrick, che scrive nel taccuino
            il nome di lei e sotto il tuo. Gli Scuri lo sanno entro un'ora, e alla
            Pignatta Mauro ti versa da bere e lascia il bicchiere sul bancone
            senza spingerlo verso di te.
          imposta: { gaia: 2 }
          effetti: { fazione.scuri: 1, rep.scuri: -3, rep.caserma: 1 }

      - testo: "Parlarle come uno dei vicoli"
        descrizione: "Fra quelli dei vicoli, dove Gaia correva quando tu portavi i pacchi, certe cose si dicono senza giri."
        quando: [origine.figlio-della-citta-bassa >= 1]
        esito:
          titolo: Le ginocchia sbucciate
          testo: |
            Le ricordi le ginocchia sbucciate e il cappuccio troppo grande, e lei
            ride per la prima volta stasera. Poi le dici di Mirko, piano. Gaia
            sparisce per una settimana, e Mirko crede alla fuga ai Ponti perché
            gliela racconti tu, che sei dei vicoli come lei.
          imposta: { gaia: 2 }
          effetti: { fazione.scuri: 1, rep.scuri: 0.5 }

  # ------------------------------------------------------------ 8 · prima della prossima luna, dopo Vesh
  - id: scuri-prima-della-prossima-luna-dopo
    presso: ponte-dei-morti
    immagine: personaggi/gaia-acari
    titolo: Il segno sotto la spalla
    sommario: "Gaia ha guardato bene il segno dei gettoni d'argilla, e ti aspetta sotto il Ponte dei Morti."
    luogo: Ponte dei Morti, sotto le assi
    area: ponti-sospesi
    requisiti: [fazione.scuri == 7, pista.pelle >= 6]
    testo: |
      Sotto le assi del Ponte dei Morti Gaia ti aspetta seduta su una trave
      sopra il vuoto, girando fra le dita un gettone d'argilla. In silenzio
      si abbassa la spalla della camicia e ti mostra sotto la clavicola un
      vecchio segno inciso nella pelle, una mano aperta con tre dita come
      quella dei gettoni.

      «A Ghoran segnano così quelli che il clan ha comprato» dice. «Io avevo
      sei anni, e sono scappata a otto. Durgan non lo sa. I suoi uomini però
      lo sanno leggere, e un giorno uno di loro mi vedrà cambiare la
      camicia. Voglio sparire, e ho bisogno di qualcuno che mi dica dove.»

      {empatia Facile} Ti ha mostrato il segno per chiederti di non dire
      niente, ed è la cosa più grande che abbia mai chiesto a qualcuno.

      {origine fuggiasco-di-ghoran} Ti stringi il braccio sinistro, dove hai
      una cicatrice diversa, fatta dalla stessa gente.
    opzioni:
      - testo: "Dirle che la proteggete voi"
        descrizione: "Gli Scuri proteggono i loro, e se Gaia resta la strada deve vedere che nessuno la tocca."
        prova: { attributo: sociale, abilita: [empatia, persuasione], difficolta: Media }
        successo:
          titolo: Chi è rimasto
          testo: |
            Le dici che Gaia Acari è di chi è rimasto, e che chi la tocca lo paga.
            Lei rimette il gettone in tasca invece di buttarlo nel vuoto. Il
            giorno dopo lo sa tutta Via del Salmone, e due mercenari che la
            guardavano cambiano strada.
          pe: { empatia: 5 }
          effetti: { fazione.scuri: 1, rep.scuri: 1, nomea.citta-bassa: 0.5 }
        fallimento:
          titolo: Parole
          testo: |
            Lei ti chiede chi la proteggerà, esattamente, dato che degli Scuri
            siete rimasti in quattro, e una risposta non ce l'hai. Quando te ne
            vai è ancora sulla trave a girare il gettone fra le dita.
          effetti: { tormento: 0.5 }

      - testo: "Affidarla a Galdrick"
        descrizione: "Galdrick ha un debito con Ghoran, e in Caserma nessun mercenario la tocca."
        quando: [galdrick.via == 0]
        immagine: personaggi/toren-galdrick
        esito:
          titolo: La stanza in Caserma
          testo: |
            Galdrick ascolta Gaia senza interromperla, e davanti al segno
            distoglie gli occhi. Le dà una stanza sopra le scuderie della Caserma
            e a te stringe la mano più a lungo del solito, mentre in Città Bassa
            qualcuno dice che gli Scuri vanno a chiedere aiuto allo sceriffo.
          imposta: { gaia: 2 }
          effetti: { fazione.scuri: 1, rep.caserma: 1 }

      - testo: "Usarla come esca per trovare chi incide i gettoni"
        descrizione: "Seguendo i mercenari che riconoscono il segno, si arriva a chi incide i gettoni."
        prova: { attributo: sociale, abilita: [ingannare, intimidire], difficolta: Media }
        successo:
          titolo: L'esca
          testo: |
            Segui Gaia a venti passi per Via del Salmone, con la spalla scoperta.
            Al secondo giorno un mercenario la vede e corre da un uomo con le mani
            sporche d'argilla, che segui fino a un magazzino vicino all'Orlo. Da
            quel giorno Gaia ti parla meno.
          pe: { ingannare: 5 }
          effetti: { fazione.scuri: 1, rep.scuri: 1, informazioni.segreto: 1 }
        fallimento:
          titolo: La spalla scoperta
          testo: |
            Il mercenario che vede la spalla di Gaia la prende per il braccio, e
            arrivi in tempo per staccarglielo a prezzo di un taglio sul polso.
            Gaia si copre, e quella sera non ti rivolge la parola.
          effetti: { ferite: 1 }

      - testo: "Mostrarle che anche tu sei scappato da lì"
        descrizione: "A Ghoran chi scappa riconosce chi è scappato. Con te Gaia può parlare senza difendersi."
        quando: [origine.fuggiasco-di-ghoran >= 1]
        esito:
          titolo: Due cicatrici
          testo: |
            Le mostri la tua cicatrice, e Gaia la guarda a lungo in silenzio. Poi
            ti racconta di Ghoran come non l'ha mai raccontato a nessuno, e alla
            fine resta. Il giorno dopo in Via del Salmone sanno tutti che chi
            tocca la ragazzina col cappuccio blu lo paga.
          effetti: { fazione.scuri: 1, rep.scuri: 1, nomea.citta-bassa: 0.5 }

  # ------------------------------------------------------------ 9 · l'ultimo ordine, prima di Vesh (il bivio)
  - id: scuri-l-ultimo-ordine
    presso: pignatta-grassa
    immagine: personaggi/mirko-vesh
    titolo: L'ultimo ordine
    sommario: "Il pomeriggio prima della notte della Pignatta, Mirko Vesh ti fa chiamare in cantina. Sa già dove sarai stanotte."
    luogo: Pignatta Grassa, la cantina, il pomeriggio
    area: citta-bassa
    requisiti: [fazione.scuri == 8, pista.pelle == 5, bivio.legge != 1]
    testo: |
      La cantina della Pignatta è fresca e buia, piena di botti segnate col
      gesso. Mirko Vesh siede su una botte vuota accanto a una candela e si
      pulisce le unghie con uno stiletto da manica, uguale a quello che
      Rozalia ha dato a te. Di sopra Mauro fa spostare i tavoli e appendere le
      lanterne.

      «Borso mi ha detto che stanotte Galdrick scende» dice, senza alzare gli
      occhi. «Mi ha detto anche chi gli cammina dietro.» Posa lo stiletto.
      «Non ti chiedo di tradirlo. Ti chiedo un'altra cosa, e prima voglio che
      tu mi ascolti.»

      {empatia Difficile} Ha già deciso come finisce stanotte, e vuole che
      qualcuno sappia come finisce dopo.

      Sul tavolo accanto alla candela c'è un anello di rame con tre chiavi di
      ferro. *Lo sa, e mi ha chiamato lo stesso.* Ti accorgi di essere rimasto
      in piedi con le mani dietro la schiena, come un allievo.
    opzioni:
      - testo: "Ascoltarlo fino in fondo"
        descrizione: "Mirko Vesh non ha mai chiesto a nessuno di ascoltarlo, e oggi lo chiede."
        quando: [fazione.caserma == 0]
        esito:
          titolo: Le tre chiavi
          testo: |
            Ti siedi su una botte davanti a lui, e lui ti spinge sul tavolo
            l'anello con le tre chiavi. Ti spiega che sono le porte degli
            Scuri al Mercato delle Ombre, e che da domani qualcuno deve
            tenere i conti.
          imposta: { bivio.legge: 2 }
          segue: scuri-le-tre-chiavi

      - testo: "Dirgli che stanotte non camminerai dietro Galdrick"
        descrizione: "Mirko sa che lavori anche per la Caserma, e se resti ne esci adesso, per sempre."
        quando: [fazione.caserma >= 1]
        esito:
          titolo: Il distintivo
          testo: |
            Mirko ti guarda a lungo, poi annuisce una volta. «Allora da domani
            dalla Caserma non ti aspettano più» dice, «e lo sceriffo lo capirà
            prima di tutti.» Ti spinge sul tavolo l'anello con le tre chiavi.
          imposta: { bivio.legge: 2 }
          effetti: { rep.caserma: -2 }
          segue: scuri-le-tre-chiavi

      - testo: "Lasciargli le chiavi e tornare dalla Caserma"
        descrizione: "Stanotte cammini dietro lo sceriffo, e per te gli Scuri finiscono qui."
        quando: [fazione.caserma >= 1]
        immagine: personaggi/toren-galdrick
        esito:
          titolo: La scala della cantina
          testo: |
            Mirko annuisce come se avesse vinto una scommessa con sé stesso, e
            rimette le chiavi in tasca. «Allora ci vediamo stanotte» dice. Di
            sopra Mauro smette di appendere lanterne per guardarti uscire.
          imposta: { bivio.legge: 1 }
          effetti: { rep.scuri: -2 }

      - testo: "Prendere tempo"
        descrizione: "In una cantina, con il poco tempo di oggi, una cosa così è difficile da decidere."
        quando: [fazione.caserma >= 1]
        costo: 0
        esito:
          titolo: Fino al tramonto
          testo: |
            Gli dici che ci devi pensare. Mirko guarda la candela, che è
            consumata a metà. «Fino a quando arriva qui» dice, e mette un dito
            sulla cera, un pollice più in basso. Poi riprende a pulirsi le
            unghie.

  # ------------------------------------------------------------ 9 · il seguito, prima di Vesh (grado 3)
  - id: scuri-le-tre-chiavi
    presso: pignatta-grassa
    immagine: personaggi/mirko-vesh
    titolo: Le tre chiavi
    tipo: seguito
    luogo: Pignatta Grassa, la cantina, il pomeriggio
    area: citta-bassa
    requisiti: [fazione.scuri == 8, bivio.legge == 2]
    testo: |
      Mirko fa girare l'anello di rame sul tavolo, e le tre chiavi tintinnano.
      «Mauro i debiti li dice ad alta voce, e chi sente un debito ad alta voce
      paga per paura e poi non paga più» dice. «Rozalia è troppo brava, e chi
      è troppo bravo non si fida di nessuno. Domani qualcuno deve tenere i
      conti, e le facce nuove durano di più.» Poi copre con l'altra mano
      l'anello liscio del mignolo.

      {resilienza Media} Di sopra qualcuno ride e sposta un tavolo. Fra
      qualche ora quella risata sarà su un selciato, e lo sai soltanto tu.
    opzioni:
      - testo: "Prendere le chiavi e tacere"
        descrizione: "Le chiavi in tasca e nessuna domanda, come si sta al tavolo d'angolo."
        esito:
          titolo: In tasca
          testo: |
            Metti in tasca l'anello con le tre chiavi, che tintinna contro lo
            stiletto. Prima che tu risalga Mirko ti dà una borsa pesante, la tua
            parte di domani, e quando ti volti dalla porta lui si sta di nuovo
            pulendo le unghie alla luce della candela.
          almeno: { rep.scuri: 6 }
          effetti: { fazione.scuri: 1, monete: 60, oggetto.scuri-tre-chiavi: 1 }

      - testo: "Chiedergli di andarsene stanotte"
        descrizione: "Un uomo che ha deciso di morire a volte cambia idea, se qualcuno glielo chiede."
        prova: { attributo: sociale, abilita: [persuasione, empatia], difficolta: Difficile }
        successo:
          titolo: Dieci anni
          testo: |
            Gli dici che i Ponti sono grandi, e lui ride davvero. Ti racconta dei
            dieci anni di inseguimenti con Galdrick, e di quanto si somigliavano
            da giovani. «Se scappo, lui mi aspetta per altri dieci anni. Gli devo
            la fine.» Ti mette le chiavi in mano con una borsa pesante.
          pe: { persuasione: 5 }
          almeno: { rep.scuri: 6 }
          effetti: { fazione.scuri: 1, monete: 60, informazioni.segreto: 1, oggetto.scuri-tre-chiavi: 1 }
        fallimento:
          titolo: I Ponti sono grandi
          testo: |
            Mirko ti guarda come un ragazzo che consiglia a un vecchio di imparare
            a nuotare. Ti mette le chiavi in mano con una borsa pesante, e non
            dice più niente finché non risali.
          almeno: { rep.scuri: 6 }
          effetti: { fazione.scuri: 1, monete: 60, tormento: 1, oggetto.scuri-tre-chiavi: 1 }

      - testo: "Chiedergli dell'anello liscio"
        descrizione: "È l'unico anello che Mirko non gira, e lo copre con l'altra mano."
        prova: { attributo: sociale, abilita: [empatia, galateo], difficolta: Media }
        successo:
          titolo: L'anello di sua madre
          testo: |
            Ti dice che l'anello liscio era di sua madre, che lo portava sul
            pollice perché aveva le mani grandi, e che ai suoi tempi gli olvari
            seppellivano i morti con l'anello. «Io invece lo lascio a chi se lo
            prende» dice. Ti mette le chiavi in mano con una borsa pesante.
          pe: { empatia: 5 }
          almeno: { rep.scuri: 6 }
          effetti: { fazione.scuri: 1, monete: 60, oggetto.scuri-tre-chiavi: 1 }
        fallimento:
          titolo: Il mignolo
          testo: |
            Mirko copre il mignolo con l'altra mano e ti risponde che è un anello.
            Ti mette in mano le chiavi e una borsa pesante, e la conversazione
            finisce lì.
          almeno: { rep.scuri: 6 }
          effetti: { fazione.scuri: 1, monete: 60, oggetto.scuri-tre-chiavi: 1, scandalo: 0.5 }

  # ------------------------------------------------------------ 9 · la veglia, dopo Vesh (il bivio)
  - id: scuri-la-veglia
    immagine: ambientazione/locanda-di-ilka
    titolo: La veglia
    sommario: "Alla Locanda di Ilka i vecchi olvari vegliano Mirko Vesh, e chi è rimasto degli Scuri c'è tutto."
    luogo: Locanda di Ilka, la sera
    area: citta-bassa
    requisiti: [fazione.scuri == 8, pista.pelle >= 6, bivio.legge != 1]
    testo: |
      Alla Locanda di Ilka hanno messo accanto al fuoco una sedia vuota con
      un bicchiere di sidro che nessuno beve. È la veglia olvara per Mirko
      Vesh. I vecchi olvari della Città Bassa siedono in cerchio con il
      cappello sulle ginocchia, mentre Ilka Dravec, gli occhi lattiginosi
      rivolti alla sedia, racconta di quando Mirko bambino le rubava le
      castagne. Besk passa con la brocca senza far pagare nessuno.

      Gaia siede per terra vicino alla porta, Karn è appoggiato al muro e non
      fischia. A turno ognuno dice ad alta voce un debito con il morto, e
      Ilka lo chiude con una goccia di sidro nel fuoco. Chi parla per ultimo
      si prende i debiti che nessuno ha reclamato.

      {origine figlio-della-citta-bassa} Alle veglie olvare ci andavi da
      bambino per le patate speziate, e l'ultimo a parlare era sempre il più
      vecchio.

      A metà della veglia la porta si apre e il fuoco si piega. Entra Durgan,
      il nano delle cicatrici, con due mercenari di Ghoran alle spalle.
      Appoggia l'ascia al muro accanto a Karn e si siede nel cerchio. *Vuole
      parlare per ultimo.* Dall'altra parte della stanza le mani di Gaia si
      chiudono.
    opzioni:
      - testo: "Restare nel cerchio"
        descrizione: "Durgan vuole parlare per ultimo, e bisogna essere ancora seduti quando tocca."
        quando: [fazione.caserma == 0]
        esito:
          titolo: Il cerchio
          testo: |
            Resti seduto. Uno dopo l'altro i vecchi olvari dicono il loro debito
            con Mirko e Ilka fa cadere la goccia nel fuoco, finché restate
            soltanto tu e Durgan a non avere parlato.
          imposta: { bivio.legge: 2 }
          segue: scuri-chi-parla-per-ultimo

      - testo: "Dire a Gaia che dalla Caserma hai chiuso"
        descrizione: "Gaia ti ha visto entrare e uscire dalla Caserma, e stanotte ti chiede di scegliere."
        quando: [fazione.caserma >= 1]
        esito:
          titolo: Il cappuccio blu
          testo: |
            Gaia ti raggiunge vicino al muro e ti chiede sottovoce se stanotte sei
            degli Scuri o dello sceriffo, perché alla veglia di Mirko non si viene
            con due facce. Le dici che dalla Caserma hai chiuso, e lei torna a
            sedersi. Lo sceriffo lo saprà domani, e capirà.
          imposta: { bivio.legge: 2 }
          effetti: { rep.caserma: -2 }
          segue: scuri-chi-parla-per-ultimo

      - testo: "Alzarti e uscire"
        descrizione: "Stanotte bisogna scegliere, e se esci adesso gli Scuri non ti chiameranno più."
        quando: [fazione.caserma >= 1]
        immagine: personaggi/toren-galdrick
        esito:
          titolo: La porta
          testo: |
            Ti alzi ed esci mentre un vecchio olvaro dice il suo debito. Sulla
            soglia ti volti. Gaia ti guarda andare senza muoversi, e Durgan
            sorride appena, perché adesso nel cerchio c'è un posto in meno.
          imposta: { bivio.legge: 1 }
          effetti: { rep.scuri: -2 }

      - testo: "Aspettare un altro giro"
        descrizione: "La veglia dura tutta la notte, e prima di scegliere si può ancora guardare."
        quando: [fazione.caserma >= 1]
        costo: 0
        esito:
          titolo: Un giro di sidro
          testo: |
            Besk ti riempie il bicchiere. Un vecchio olvaro racconta di quando
            Mirko gli ha prestato i soldi per il funerale della moglie senza
            chiederli mai indietro, e Ilka fa cadere la goccia mentre il cerchio
            aspetta.

  # ------------------------------------------------------------ 9 · il seguito, dopo Vesh (grado 3)
  - id: scuri-chi-parla-per-ultimo
    immagine: ambientazione/locanda-di-ilka
    titolo: Chi parla per ultimo
    tipo: seguito
    luogo: Locanda di Ilka, a notte fonda
    area: citta-bassa
    requisiti: [fazione.scuri == 8, bivio.legge == 2]
    testo: |
      Restate voi due. Durgan si alza senza riprendere l'ascia e parla con
      l'accento dei clan, guardando la sedia vuota. Secondo lui Mirko gli
      doveva tre mesi di paga, che adesso si prende dalla Città Bassa, perché
      gli Scuri sono morti con Mirko e i debiti dei morti li riscuote chi ha
      le braccia per farlo. Ilka resta con la brocca sospesa sopra il fuoco,
      e la goccia non cade.

      {intimidire Media} Durgan non ha paura di nessuno in questa stanza,
      tranne che di Ilka, e non capisce perché la goccia non sia caduta.

      {armi-da-mischia Media} L'ascia è a un passo dalla sua mano, e dei due
      mercenari sulla porta uno ha già la mano sul coltello.

      Ilka gira la testa verso di te. «Tocca a te» dice. Accanto a lei c'è
      l'anello di rame con le tre chiavi, che Mirko le aveva lasciato per chi
      avesse parlato per ultimo.
    opzioni:
      - testo: "Parlare per ultimo"
        descrizione: "Un debito con Mirko, detto davanti a tutti con la parola giusta perché i vecchi ti diano ragione."
        prova: { attributo: sociale, abilita: [persuasione, espressivita], difficolta: Difficile }
        successo:
          titolo: La goccia
          testo: |
            Dici il tuo debito con Mirko, e poi che i debiti dei morti si chiudono
            e chi li riscuote è un ladro di veglie. I vecchi olvari battono il
            cappello sulle ginocchia, e Ilka fa cadere la goccia e ti mette in
            mano l'anello con le tre chiavi. Alla porta Durgan si volta a
            guardarti in faccia, per ricordarsela.
          pe: { persuasione: 5 }
          almeno: { rep.scuri: 6 }
          effetti: { fazione.scuri: 1, monete: 60, nomea.citta-bassa: 0.5, oggetto.scuri-tre-chiavi: 1 }
        fallimento:
          titolo: La voce che si incrina
          testo: |
            A metà del tuo debito la voce ti si incrina e Durgan sorride. Ilka fa
            cadere la goccia lo stesso, perché alle veglie conta chi parla più di
            come parla, e ti mette in mano l'anello con le tre chiavi. Alla porta
            Durgan si volta a guardarti.
          almeno: { rep.scuri: 6 }
          effetti: { fazione.scuri: 1, monete: 40, tormento: 1, oggetto.scuri-tre-chiavi: 1 }

      - testo: "Lasciar parlare Rozalia per te"
        descrizione: "Rozalia sceglie le parole meglio di chiunque, però alle veglie conta chi parla."
        quando: [macerie.rozalia == 3]
        immagine: personaggi/rozalia-marga
        prova: { attributo: sociale, abilita: [persuasione, galateo], difficolta: Media }
        successo:
          titolo: Per la precisione
          testo: |
            Rozalia si alza dal fondo della stanza, dove nessuno l'aveva vista
            entrare, e a nome tuo elenca a memoria i debiti di Mirko con la Città
            Bassa, chiudendoli tutti. Ilka fa cadere la goccia e ti mette in mano
            l'anello con le tre chiavi, e Durgan esce senza una parola.
          pe: { persuasione: 5 }
          almeno: { rep.scuri: 6 }
          effetti: { fazione.scuri: 1, monete: 60, oggetto.scuri-tre-chiavi: 1 }
        fallimento:
          titolo: A nome di un altro
          testo: |
            Alle veglie non si parla a nome di un altro, e i vecchi olvari si
            guardano fra loro. Ilka aspetta che tu dica almeno una parola, e
            quando la dici la goccia cade. Ti mette in mano l'anello con le tre
            chiavi, ma la borsa di Besk è più leggera.
          almeno: { rep.scuri: 6 }
          effetti: { fazione.scuri: 1, monete: 40, oggetto.scuri-tre-chiavi: 1, scandalo: 0.5 }

      - testo: "Dire soltanto il tuo debito, e sederti"
        descrizione: "Nessun discorso, solo un debito detto a voce come fanno i vecchi, e poi si aspetta."
        esito:
          titolo: Il debito detto a voce
          testo: |
            Dici il tuo debito con Mirko in una frase sola, come i vecchi olvari,
            e ti risiedi. Ilka fa cadere la goccia, perché alle veglie basta
            quello, e ti mette in mano l'anello con le tre chiavi, mentre Durgan
            si alza per andarsene.
          almeno: { rep.scuri: 6 }
          effetti: { fazione.scuri: 1, monete: 40, oggetto.scuri-tre-chiavi: 1 }

      - testo: "Raccontare le tue consegne per Mirko"
        descrizione: "Da ragazzino portavi i pacchi degli Scuri per Via del Salmone, e Ilka ti ha visto crescere."
        quando: [origine.figlio-della-citta-bassa >= 1]
        esito:
          titolo: Il ragazzo delle consegne
          testo: |
            Racconti del pacco che ti si è rotto in mano da ragazzino e che Mirko
            ti ha perdonato. Ilka ride con la sua voce roca e fa cadere la goccia
            senza che nessuno la chieda. Ti dà l'anello con le tre chiavi, e
            Durgan esce senza voltarsi.
          almeno: { rep.scuri: 6 }
          effetti: { fazione.scuri: 1, monete: 60, nomea.citta-bassa: 0.5, oggetto.scuri-tre-chiavi: 1 }

  # ------------------------------------------------------------ 10 · il gettone d'argilla
  - id: scuri-il-gettone-d-argilla
    immagine: ambientazione/citta-bassa
    titolo: Il gettone d'argilla
    sommario: "Sulle porte della Città Bassa compaiono gettoni d'argilla, e chi li ha paga la protezione ai mercenari di Durgan."
    luogo: Città Bassa, Via del Salmone
    area: citta-bassa
    requisiti: [fazione.scuri == 9, pista.pelle >= 6, bivio.legge == 2]
    testo: |
      In una settimana i gettoni d'argilla sono comparsi su metà delle porte
      di Via del Salmone, e chi li ha paga la protezione ai mercenari di
      Durgan ogni venerdì. Il Consiglio, con le casse vuote, i mercenari non
      li paga, e Durgan la paga se l'è trovata da solo.

      {rissa Facile} I mercenari che riscuotono vanno in tre, e il primo da
      stendere è quello in mezzo, che porta il sacco.

      «Hagra non è d'accordo con lui» sussurra Gaia sotto il cappuccio.
      «L'ho sentita dirgli che a Ghoran chi taglieggia le donne perde la
      faccia, e lui le ha risposto che a Ghoran adesso non ci tornano.»
    opzioni:
      - testo: "Seguire i gettoni fino a chi li incide"
        descrizione: "Un gettone esce da una mano sola, che sta da qualche parte con l'argilla sotto le unghie."
        prova: { attributo: mentale, abilita: [percezione, politica-ed-economia], difficolta: Media }
        successo:
          titolo: Il magazzino dell'argilla
          testo: |
            Segui il mercenario con il sacco fino a un magazzino vicino all'Orlo,
            dove un vecchio dei clan incide gettoni con il punteruolo, già
            duecento in fila come pani. Rozalia dice che Durgan con quei soldi
            compra i funzionari di Mirko, e che si batte soltanto con il timbro.
          pe: { percezione: 5 }
          effetti: { fazione.scuri: 1, rep.scuri: 1, monete: 15, informazioni.segreto: 1 }
        fallimento:
          titolo: Il sacco
          testo: |
            Al secondo angolo il mercenario con il sacco si gira e ti aspetta con
            i due compagni, chiedendoti se vuoi un gettone anche tu. Te ne vai fra
            le loro risate.
          effetti: { sospetto: 1 }

      - testo: "Liberare una strada intera"
        descrizione: "Se una strada vede scappare i tre mercenari del venerdì, le altre se lo ricordano."
        combattimento: scuri-la-strada-dei-gettoni
        vittoria:
          titolo: La strada pulita
          testo: |
            Li aspetti il venerdì in fondo a Via del Salmone, e quando il sacco
            cade i gettoni rotolano nel tombino. Prima di sera spariscono da tutte
            le porte. Rozalia ti fa sapere che Durgan compra i funzionari di
            Mirko, e che si batte soltanto con il timbro.
          effetti: { fazione.scuri: 1, rep.scuri: 1, monete: 15, nomea.citta-bassa: 1 }
        sconfitta:
          titolo: Il venerdì
          testo: |
            Sono tre e tu sei uno, e il venerdì finisce con te seduto contro una
            porta, sotto gli occhi della strada, con un gettone d'argilla nel
            colletto. Gaia ti aiuta ad alzarti e butta il gettone nel tombino.
          effetti: { nomea.citta-bassa: -0.5 }

      - testo: "Far arrivare le prove a Galdrick, tramite Gaia"
        descrizione: "Se lo sceriffo sa che i mercenari della Caserma taglieggiano la Città Bassa, fa il lavoro degli Scuri."
        quando: [galdrick.via == 0]
        prova: { attributo: sociale, abilita: [ingannare, conoscenze-della-strada], difficolta: Media }
        successo:
          titolo: La mossa di Mirko
          testo: |
            Gaia fa arrivare alla Caserma una lista di porte e di venerdì, scritta
            da Rozalia con la grafia di un bottegaio spaventato. Tre giorni dopo
            la milizia stacca i gettoni da Via del Salmone uno per uno. Rozalia
            ride, perché Mirko avrebbe fatto lo stesso, e aggiunge che Durgan
            adesso compra i funzionari.
          pe: { ingannare: 5 }
          effetti: { fazione.scuri: 1, rep.scuri: 1, monete: 15, rep.caserma: 1 }
        fallimento:
          titolo: La grafia
          testo: |
            Il sergente riconosce nella lista la grafia di Rozalia, che è nel
            registro delle visite. Galdrick fa staccare i gettoni lo stesso, poi
            ti chiede se hai altro da dirgli, e tu ti guardi bene dal rispondere
            di sì.
          effetti: { fazione.scuri: 1, rep.scuri: 0.5, rep.caserma: -1, sospetto: 1.5 }

      - testo: "Parlare con Hagra"
        descrizione: "Hagra non è d'accordo con Durgan, e se col prosciutto l'hai trattata bene ti ascolta."
        quando: [guarnigione.mercenari >= 1]
        prova: { attributo: sociale, abilita: [persuasione, empatia], difficolta: Facile }
        successo:
          titolo: La resina
          testo: |
            Hagra mastica resina davanti a un banco di prosciutti al Mercato dei
            Nodi. Ti dice che una parte dei mercenari non vuole riscuotere dalle
            donne, e sta con Durgan solo perché la Caserma non paga. «Eh. Se paga
            qualcun altro, cambia tutto.» Rozalia, quando lo sa, dice che Durgan
            sta comprando i funzionari.
          pe: { persuasione: 5 }
          imposta: { scuri.hagra: 1 }
          effetti: { fazione.scuri: 1, rep.scuri: 1, monete: 15 }
        fallimento:
          titolo: Il prosciutto
          testo: |
            Hagra ti ascolta masticando resina, poi ti dice che la gentilezza col
            prosciutto la ricorda, però la paga la dà Durgan. Sputa la resina
            accanto ai tuoi stivali e torna dai suoi.
          effetti: { scandalo: 0.5 }

      - testo: "Dire ai mercenari quello che sa chi è scappato"
        descrizione: "Il clan paga quando torna vuol dire mai, e detto nella lingua dei clan il gettone pesa diverso."
        quando: [origine.fuggiasco-di-ghoran >= 1]
        esito:
          titolo: Mai
          testo: |
            Al mercenario con il sacco dici nella lingua dei clan che il clan paga
            quando torna, e lui a Ghoran non ci tornerà. Dopo un lungo silenzio ti
            dice dov'è il magazzino dei gettoni, e che Durgan con quei soldi
            compra i funzionari di Mirko.
          effetti: { fazione.scuri: 1, rep.scuri: 1, monete: 15, informazioni.segreto: 1 }
