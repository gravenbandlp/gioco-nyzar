# I lavori e i servizi della quest degli Scuri, che si aprono con i gradi (fazione.scuri).
# Grado 1 (passo 3): la settimana, cioè consegne, palo e riscossioni piccole (rep.scuri fino a 4), e il modo di
#   riavere il Contatto nell'ombra se una crisi del Sospetto l'ha bruciato.
# Grado 2 (passo 6): le carte pulite (Sospetto e Scandalo che scendono, a pagamento) e il ricettatore all'Orlo dei
#   Rottami, dove Grusk compra i pezzi grossi meglio del suo banco e con poco Sospetto.
# Grado 3 (passo 9): il banco del tavolo d'angolo al Mercato delle Ombre, che paga meglio dei banchi senza timbro con
#   metà del Sospetto, e la lezione di Correzione dall'uomo del banco del fondo (gratis, con Magia 3). Con la matrice
#   del timbro (passo 11) i meccanismi escono timbrati, senza Sospetto.
# Grado 4 (passo 12): il rifugio delle Vie di Sotto (luogo scuri-il-rifugio), con la decima della porta (minore se una
#   porta è caduta, doppia con il tavolo nuovo del passo 15) e una branda per far scendere Sospetto e Ferite.
# Grado 5, finale 3 (il registro allo sceriffo): la parola dello sceriffo alla Caserma, al posto della decima.
storylet:
  # ------------------------------------------------------------ grado 1 · la settimana
  - id: scuri-la-settimana
    immagine: fazioni/scuri
    titolo: La settimana
    sommario: "Ogni lunedì Gaia porta i lavori della settimana degli Scuri, e le facce nuove se li dividono."
    luogo: Città Bassa, dietro le fucine
    area: citta-bassa
    ripetibile: true
    requisiti: [fazione.scuri >= 3]
    testo: |
      Il lunedì, dietro le fucine, Gaia tira fuori il foglietto con i lavori
      della settimana nella grafia diritta di Rozalia, e le facce nuove se
      li dividono sul muretto. A chi arriva tardi tocca il palo sotto la
      pioggia.
    opzioni:
      - testo: "Portare un pacco dall'altra parte della Città Bassa"
        descrizione: "Un pacco avvolto nella tela cerata, da portare senza passare davanti alla Guardia."
        requisiti: [rep.scuri < 4]
        prova: { attributo: fisico, abilita: [furtivita, atletica], difficolta: Media }
        successo:
          titolo: La tela cerata
          testo: |
            Porti il pacco per i vicoli dove la Guardia non passa, e una porta
            socchiusa lo scambia con una moneta e un cenno.
          effetti: { monete: 4, rep.scuri: 0.5 }
        fallimento:
          titolo: La Guardia all'angolo
          testo: |
            Un miliziano all'angolo ti costringe al giro largo, e alla porta ti
            dicono di tornare domani.
          effetti: { sospetto: 1 }

      - testo: "Fare il palo a una partita"
        descrizione: "Mentre al tavolo si gioca forte, qualcuno deve fischiare se arriva la Guardia."
        prova: { attributo: mentale, abilita: [percezione, resilienza], difficolta: Media }
        successo:
          titolo: Il fischio
          testo: |
            La Guardia non passa. All'alba ti pagano la notte e ti offrono il
            fondo di una bottiglia.
          effetti: { monete: 3 }
        fallimento:
          titolo: Il sonno
          testo: |
            Ti addormenti in piedi e la Guardia ti passa accanto senza vederti. Al
            tavolo nessuno se ne accorge, e la paga è dimezzata lo stesso.
          effetti: { monete: 1 }

      - testo: "Riscuotere un debito piccolo"
        descrizione: "Un bottegaio che deve poco e paga tardi va solo ricordato nel modo giusto."
        requisiti: [rep.scuri < 4]
        prova: { attributo: sociale, abilita: [intimidire, persuasione], difficolta: Media }
        successo:
          titolo: Il bottegaio
          testo: |
            Chiedi al bottegaio della moglie e dei figli, per nome, finché non
            apre il cassetto da solo. Una delle monete te la tieni.
          effetti: { monete: 5, rep.scuri: 0.5 }
        fallimento:
          titolo: Domani
          testo: |
            Il bottegaio giura che domani paga tutto. Il giorno dopo la bottega è
            chiusa, con un cartello che dice *torno subito*.

      - testo: "Farti ridare una porta del Mercato delle Ombre"
        descrizione: "Il Sospetto ti ha bruciato il contatto, ma una faccia degli Scuri sa dove si scende adesso."
        quando: [contatto-ombra == 0]
        esito:
          titolo: La porta nuova
          testo: |
            Gaia ti porta a una cantina nuova e ti insegna come si bussa. Questa
            porta l'hai pagata con la settimana, e la prossima la paghi in un
            altro modo.
          imposta: { contatto-ombra: 1 }

  # ------------------------------------------------------------ grado 2 · le carte pulite
  - id: scuri-carte-pulite
    immagine: personaggi/rozalia-marga
    titolo: Le carte pulite
    sommario: "Un copista allievo di Rozalia sa far sparire un rapporto della Caserma o una lettera che parla di te."
    luogo: Città Bassa, il retro di una rivendita di sale
    area: citta-bassa
    ripetibile: true
    requisiti: [fazione.scuri >= 6]
    testo: |
      Il copista lavora nel retro di una rivendita di sale con una lente
      legata al collo, e batte due volte la penna sul calamaio come Rozalia,
      senza la sua grazia. Per chi è nel registro degli Scuri fa scendere i
      rapporti della Caserma in fondo al mucchio dello sceriffo. In un
      bicchiere d'acqua galleggia un pennino rotto, per ricordargli di non
      premere troppo.
    opzioni:
      - testo: "Pagare per un rapporto ricopiato"
        descrizione: "Il copista fa scendere un rapporto in fondo al mucchio, e si fa pagare bene."
        requisiti: [sospetto >= 1, monete >= 15]
        esito:
          titolo: La data sbagliata
          testo: |
            Il copista si fa dire il giorno e il nome del miliziano, e due giorni
            dopo il tuo rapporto è in fondo al mucchio, datato all'anno scorso.
          effetti: { sospetto: -1, monete: -15 }

      - testo: "Ricopiare tu il rapporto, sotto la sua lente"
        descrizione: "Il copista fa pagare meno a chi gli presta una mano buona."
        requisiti: [sospetto >= 1, monete >= 5]
        prova: { attributo: mentale, abilita: [accademiche, percezione], difficolta: Media }
        successo:
          titolo: La mano buona
          testo: |
            Ricopi il rapporto con la grafia del sergente e cambi la data con un
            tratto solo, e il copista ti fa pagare soltanto l'inchiostro.
          effetti: { sospetto: -1, monete: -5 }
        fallimento:
          titolo: Il pennino
          testo: |
            Il pennino si spezza a metà della data e finisce nel bicchiere con
            l'altro, e l'inchiostro sprecato lo paghi tu.
          effetti: { monete: -5 }

      - testo: "Far sparire una lettera che parla di te"
        descrizione: "Una lettera di un salotto dei Quartieri Alti con il tuo nome può finire in un camino."
        requisiti: [scandalo >= 1, monete >= 15]
        esito:
          titolo: Il camino
          testo: |
            La lettera finisce in un camino, e al suo posto arriva un biglietto di
            scuse per un invito mancato, scritto con la grafia giusta.
          effetti: { scandalo: -1, monete: -15 }

  # ------------------------------------------------------------ grado 2 · il ricettatore
  - id: scuri-il-ricettatore
    presso: orlo-dei-rottami
    immagine: personaggi/grusk
    titolo: Il ricettatore
    sommario: "Dietro la baracca Grusk tiene un'altra bilancia per chi è nel registro degli Scuri, e paga meglio."
    luogo: Orlo dei Rottami, dietro la baracca di Grusk
    area: citta-bassa
    ripetibile: true
    requisiti: [fazione.scuri >= 6]
    testo: |
      Davanti alla baracca Grusk ha la bilancia storta che vedono tutti.
      Dietro, sotto un telo incerato, ne tiene una dritta per chi è nel
      registro degli Scuri, e su quella i pezzi grossi li paga meglio. Nella
      carriola rossa contro il muro dorme un gatto con un orecchio solo.
    opzioni:
      - testo: "Vendere un meccanismo dei Precursori"
        descrizione: "Un congegno intero, anche spento, che Grusk rivende all'Accademia o a chi paga di più."
        requisiti: [reliquie.meccanismo-spento >= 1]
        esito:
          titolo: La bilancia dritta
          testo: |
            Pesato il meccanismo sulla bilancia dritta, Grusk te lo paga e lo
            mette nella carriola sotto il gatto, che non si sveglia.
          effetti: { reliquie.meccanismo-spento: -1, monete: 32, sospetto: 1 }

      - testo: "Vendere un cristallo carico"
        descrizione: "Un cristallo pieno di Mana e senza timbro. Grusk sa a chi rivenderlo."
        requisiti: [cristalli.cristallo-carico >= 1]
        esito:
          titolo: Il ronzio
          testo: |
            Grusk si avvicina il cristallo all'orecchio, come fanno al Mercato
            delle Ombre, e ti paga senza contrattare.
          effetti: { cristalli.cristallo-carico: -1, monete: 30, sospetto: 1 }

      - testo: "Vendere un reperto sigillato"
        descrizione: "Un pezzo di macchina chiuso nel suo guscio, che Grusk compra senza aprirlo."
        requisiti: [reperto.sigillato >= 1]
        esito:
          titolo: La scommessa
          testo: |
            Grusk scuote il reperto vicino all'orecchio e ti paga il prezzo di una
            scommessa. Nella carriola il gatto apre l'occhio buono e lo richiude.
          effetti: { reperto.sigillato: -1, monete: 8 }

      - testo: "Vendere un frammento inciso"
        descrizione: "Un pezzo di metallo dei Precursori con i segni incisi, e Grusk paga i segni."
        requisiti: [reliquie.frammento-inciso >= 1]
        esito:
          titolo: I segni
          testo: |
            Grusk passa il pollice sui segni come se sapesse leggerli e ti paga
            più che davanti, e quelli a spirale, dice, li paga il doppio.
          effetti: { reliquie.frammento-inciso: -1, monete: 6 }

  # ------------------------------------------------------------ grado 3 · il banco del tavolo d'angolo
  - id: scuri-il-banco-del-tavolo-d-angolo
    presso: mercato-delle-ombre
    immagine: ambientazione/mercato-delle-ombre
    titolo: Il banco del tavolo d'angolo
    sommario: "Dietro la colonna del Mercato delle Ombre, chi tiene le chiavi ha un banco che il Velo non vede."
    luogo: Mercato delle Ombre, dietro la colonna
    area: citta-bassa
    ripetibile: true
    requisiti: [fazione.scuri >= 9]
    testo: |
      Dietro la colonna con il detto inciso c'è un banco con una tenda di
      sacco, che dalle porte del Velo non si vede. È il banco di chi ha le
      tre chiavi, e quando arrivi ci si siede l'uomo del banco del fondo,
      quello che ascolta i segreti a occhi chiusi, con il suo sacchetto di
      monete di conî diversi.

      {magia Media} Ha le dita sporche di gesso e conosce formule che
      all'Accademia non insegnano.
    opzioni:
      - testo: "Vendere un segreto dietro la tenda"
        descrizione: "Al banco del fondo i segreti si pagano bene, e dietro la tenda nessuno vede chi li vende."
        requisiti: [informazioni.segreto >= 1]
        esito:
          titolo: Dietro la tenda
          testo: |
            L'uomo del fondo ascolta il tuo segreto a occhi chiusi e ti paga in
            colonne di monete di conî diversi.
          effetti: { informazioni.segreto: -1, monete: 42, sospetto: 1 }

      - testo: "Vendere un cristallo carico"
        descrizione: "Un cristallo senza timbro, venduto dietro la tenda invece che sotto gli occhi delle porte."
        requisiti: [cristalli.cristallo-carico >= 1]
        esito:
          titolo: Il cristallo
          testo: |
            L'uomo del fondo ascolta il cristallo a occhi chiusi e te lo paga
            senza contrattare.
          effetti: { cristalli.cristallo-carico: -1, monete: 42, sospetto: 1 }

      - testo: "Vendere un meccanismo dei Precursori"
        descrizione: "Un congegno intero, venduto dietro la tenda a chi sa a che cosa serve."
        requisiti: [reliquie.meccanismo-spento >= 1]
        esito:
          titolo: Gli ingranaggi
          testo: |
            L'uomo del fondo tasta gli ingranaggi a occhi chiusi e ti paga, poi
            avvolge il congegno nella tenda come un neonato.
          effetti: { reliquie.meccanismo-spento: -1, monete: 42, sospetto: 1 }

      - testo: "Timbrare un meccanismo con la matrice"
        descrizione: "Con il timbro della Gilda un meccanismo esce dal Mercato in regola, e nessuno si ricorda di te."
        quando: [scuri.matrice >= 1]
        requisiti: [reliquie.meccanismo-spento >= 1]
        esito:
          titolo: Il timbro
          testo: |
            Premi la matrice sull'ottone e il sigillo della Gilda resta nitido.
            L'uomo del fondo ride senza rumore e ti paga il prezzo della Casa dei
            Nodi.
          effetti: { reliquie.meccanismo-spento: -1, monete: 45 }

      - testo: "Farti insegnare la formula di Correzione"
        descrizione: "La formula dei Profeti delle Geometrie, gratis per chi tiene le chiavi, costa mezza tacca di Tormento a lancio."
        immagine: ambientazione/rovine-dei-precursori
        requisiti: [magia >= 3, incantesimo.correzione == 0]
        costo: 2
        prova: { attributo: mentale, abilita: magia, difficolta: Difficile }
        successo:
          titolo: Il cerchio sul banco
          testo: |
            L'uomo del fondo rovescia una moneta sul banco e ti fa chiudere
            intorno un cerchio di gesso dicendo la formula, e la moneta torna nel
            suo sacchetto. Ti fa ripetere finché il gesso non si stacca più, poi
            cancella tutto con la manica.

            {magia Difficile} Hai disegnato una cosa, e la cosa è accaduta. Ti fa
            male la testa sopra l'occhio.
          effetti: { incantesimo.correzione: 1 }
        fallimento:
          titolo: Il cerchio aperto
          testo: |
            Il cerchio ti si apre a metà e la moneta resta dov'è. Ti tocca
            esercitarti sul tavolo della cucina.
          effetti: { tormento: 1 }

  # ------------------------------------------------------------ grado 4 · la decima della porta
  - id: scuri-la-decima
    presso: scuri-il-rifugio
    immagine: ambientazione/mercato-delle-ombre
    titolo: La decima della porta
    sommario: "Nella cassetta di ferro sulla mensola i portinai lasciano la parte della tua porta del Mercato."
    luogo: Il rifugio delle Vie di Sotto
    area: citta-bassa
    ripetibile: true
    requisiti: [fazione.scuri >= 12, scuri.decima >= 1]
    testo: |
      Nella cassetta di ferro sulla mensola del rifugio, di cui hai l'unica
      chiave, il ragazzo dell'Orlo che fa il portinaio alla tua porta lascia
      la sera la decima. Accanto mette un sasso dipinto, e il colore dice
      com'è andata la settimana. Questa volta è blu, con una faccia
      sorridente.
    opzioni:
      - testo: "Ritirare la decima"
        descrizione: "La parte della tua porta, che il portinaio conta e chiude nella cassetta."
        quando: [scuri.decima == 1, scuri.porta == 0]
        costo: 2
        esito:
          titolo: La cassetta
          testo: |
            Sotto le monete c'è un biglietto del ragazzo con i nomi di chi è
            sceso, che bruci nella candela.
          effetti: { monete: 9 }

      - testo: "Ritirare la decima delle due porte rimaste"
        descrizione: "Durgan si è preso una delle porte, e la decima è più leggera."
        quando: [scuri.decima == 1, scuri.porta >= 1]
        costo: 2
        esito:
          titolo: La cassetta leggera
          testo: |
            Le monete sono meno di prima, e il biglietto dice che alla porta di
            Durgan scende più gente.
          effetti: { monete: 6 }

      - testo: "Ritirare la decima di tutte le porte"
        descrizione: "Al tavolo nuovo la decima arriva da tutte le porte degli Scuri, e la cassetta pesa il doppio."
        quando: [scuri.decima >= 2]
        costo: 2
        esito:
          titolo: La cassetta piena
          testo: |
            La cassetta è piena fino al coperchio, e il biglietto del ragazzo è
            lungo due facciate.
          effetti: { monete: 16 }

      - testo: "Farti dare la decima in cristalli"
        descrizione: "Alla porta passano anche cristalli senza timbro, e il portinaio può tenerli da parte per te."
        costo: 3
        esito:
          titolo: Il cristallo nella cassetta
          testo: |
            Una settimana dopo nella cassetta c'è un cristallo carico avvolto in
            uno straccio, che ronza contro il ferro.
          effetti: { cristalli.cristallo-carico: 1 }

  # ------------------------------------------------------------ grado 4 · la branda del rifugio
  - id: scuri-la-branda-del-rifugio
    presso: scuri-il-rifugio
    immagine: ambientazione/mercato-delle-ombre
    titolo: La branda del rifugio
    sommario: "Una branda di corda e due uscite, sotto la Città Bassa, dove non ti cerca nessuno."
    luogo: Il rifugio delle Vie di Sotto
    area: citta-bassa
    ripetibile: true
    requisiti: [fazione.scuri >= 12]
    testo: |
      La branda di corda sta contro la parete più asciutta del rifugio, con
      una coperta di lana grigia. La mattina arrivano dalla scala i martelli
      del bottaio e la notte dalla galleria il gocciolare dell'acqua. Qui
      sotto la Guardia non scende, e sul muro qualcuno ha inciso una tacca
      per ogni notte passata al sicuro.
    opzioni:
      - testo: "Dormire nel rifugio"
        descrizione: "Una notte intera sotto la Città Bassa, dove la Guardia non scende."
        costo: 2
        esito:
          titolo: Le tacche
          testo: |
            Dormi sotto la coperta di lana fino ai martelli del bottaio, e prima
            di risalire incidi anche tu una tacca nel muro.
          effetti: { sospetto: -1, ferite: -0.5 }

      - testo: "Ascoltare le Vie di Sotto, la notte"
        descrizione: "Dalla galleria arrivano voci di contrabbandieri che passano. Chi ascolta sa chi porta che cosa."
        esito:
          titolo: Le voci della galleria
          testo: |
            Resti sveglio al buio vicino alla galleria ad ascoltare i
            contrabbandieri che passano parlando di prezzi e di carichi, e ti
            tieni quello che serve.
          effetti: { informazioni.voce: 2 }

  # ------------------------------------------------------------ grado 5 · la parola dello sceriffo (finale 3)
  - id: scuri-la-parola-dello-sceriffo
    presso: guarnigione-di-qir-azel
    immagine: personaggi/toren-galdrick
    titolo: La parola dello sceriffo
    sommario: "Dopo le chiavi e i nomi degli Scuri, in Caserma una porta resta aperta per te."
    luogo: Guarnigione di Qir-Azel, l'ufficio dello sceriffo
    area: quartieri-alti
    ripetibile: true
    requisiti: [scuri.finale == 3]
    testo: |
      In Caserma ti salutano tutti, e nessuno ti stringe la mano. La porta
      dello sceriffo è sempre socchiusa quando arrivi, e Galdrick alza gli
      occhi dal taccuino solo dopo che l'hai chiusa.

      {empatia Media} Ti è grato, e non gli piace esserlo. Guarda prima le
      tue mani e poi la tua faccia.

      Sulle porte della Città Bassa la pentola tagliata in due ricompare ogni
      tanto, e il sergente la fa lavare.
    opzioni:
      - testo: "Chiedergli di stracciare un rapporto"
        descrizione: "Un rapporto della Guardia con il tuo nome dentro, e allo sceriffo basta una riga."
        requisiti: [sospetto >= 1]
        esito:
          titolo: La riga
          testo: |
            Galdrick tira una riga sul tuo nome con la matita corta, e ti fa
            notare che si può tirare anche al contrario.
          effetti: { sospetto: -1 }

      - testo: "Raccontargli una cosa della Città Bassa"
        descrizione: "Lo sceriffo vuole sapere che cosa succede dove tu passi e lui no."
        requisiti: [informazioni.voce >= 2, rep.caserma < 8]
        esito:
          titolo: Il taccuino
          testo: |
            Lui scrive nel taccuino quello che hai sentito nei vicoli e ti
            ringrazia guardandoti le mani.
          effetti: { informazioni.voce: -2, rep.caserma: 0.5 }
