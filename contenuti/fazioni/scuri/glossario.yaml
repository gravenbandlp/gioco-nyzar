# Le voci del glossario per la quest degli Scuri: i personaggi che le scene nominano e che non avevano una voce.
# Cosimo Venn compare già in contenuti/citta/macerie.yaml (il cantiere), senza voce. Durgan ha due voci in
# contenuti/glossario/blocco8.yaml che chiedono pista.arena >= 1: questa variante vale per chi non ha giocato l'Arena.
glossario:
  - id: cosimo-venn
    nome: Cosimo Venn
    alias: [Venn]
    tipo: personaggio
    sottotitolo: "Ispettore dei lotti della Casa dei Nodi"
    testo: "Magro ispettore dei lotti della Casa dei Nodi, con i manicotti di tela e gli stivali sempre puliti. Mastica menta e arrossisce fino alle orecchie quando è in imbarazzo. Il suo scrittoio è il più vicino alla finestra, nella sala degli ispettori."
    requisiti: []

  - id: durgan-senza-paga
    nome: Durgan
    tipo: personaggio
    sottotitolo: "Mercenario della Città Bassa"
    testo: "Nano massiccio dal volto coperto di cicatrici, che porta l'ascia in spalla come un attrezzo da lavoro. Sedeva al tavolo di Mauro Scrocco alla Pignatta Grassa prima dell'incendio, e adesso lo ascoltano i mercenari di Ghoran rimasti senza paga. In combattimento non apre mai bocca."
    requisiti: [pista.arena == 0, pista.pelle >= 6]
