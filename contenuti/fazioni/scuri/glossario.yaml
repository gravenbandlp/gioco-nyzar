# Le voci del glossario per la quest degli Scuri: i personaggi che le scene nominano e che non avevano una voce.
# Cosimo Venn compare già in contenuti/citta/macerie.yaml (il cantiere), senza voce. Durgan ha due voci in
# contenuti/glossario/blocco8.yaml che chiedono pista.arena >= 1: questa variante vale per chi non ha giocato l'Arena.
glossario:
  - id: cosimo-venn
    nome: Cosimo Venn
    alias: [Venn]
    tipo: personaggio
    sottotitolo: "Ispettore dei lotti della Casa dei Nodi"
    testo: "Ispettore dei lotti della Casa dei Nodi, un uomo magro con i manicotti di tela sulle maniche e gli stivali sempre puliti, che tiene ben lontani dalla cenere. Mastica menta e arrossisce fino alle orecchie quando qualcosa lo mette in imbarazzo. Ha lo scrittoio in fondo alla sala degli ispettori, il più vicino alla finestra."
    requisiti: []

  - id: durgan-senza-paga
    nome: Durgan
    tipo: personaggio
    sottotitolo: "Mercenario della Città Bassa"
    testo: "Nano massiccio con il volto coperto di cicatrici e una grande ascia da battaglia, che si porta sulla spalla come un attrezzo da lavoro. Sedeva al tavolo di Mauro Scrocco alla Pignatta Grassa, finché la taverna non è bruciata. Adesso i mercenari di Ghoran rimasti senza paga lo ascoltano, e chi ci ha avuto a che fare racconta che durante un combattimento non apre mai bocca."
    requisiti: [pista.arena == 0, pista.pelle >= 6]
