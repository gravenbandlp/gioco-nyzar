# La quest degli Scuri, passi 11-15 (fazione.scuri 10 → 15). Tutti chiedono pista.pelle >= 6 e bivio.legge == 2.
# 11 La Casa dei Nodi di notte: Cosimo Venn dà la pianta (con scuri.venn la dà subito), poi la spedizione
#    (spedizione-casa-dei-nodi.yaml), che chiude il passo alla cassaforte dei timbri con la matrice, il registro dei
#    funzionari pagati o tutti e due.
# 12 Le tre porte (grado 4), al Mercato delle Ombre: Durgan attacca le porte degli Scuri nella stessa notte. Il Velo
#    tollera il Mercato perché il Mercato gli racconta le cose, e la sua mano al Mercato è Ottilia Sanvel. Chi lascia
#    cadere una porta tiene le altre due (scuri.porta, decima minore).
# 13 Nihali torna da Pannion, alla cisterna dell'Orlo, con le bande dei villaggi: una partita a Zekar (scuri-nihali),
#    il suo trucco, le cure (più facili con la ricetta di Nestor o per il Figlio del Circolo). Squiggor, se vivo, si
#    può riportare dalla tua parte (scuri.squiggor 1) o lasciare a Durgan (2).
# 14 L'anello liscio, nel deposito della Caserma (scuri.anello). Con galdrick.via 0 e rep.caserma >= 3 lo si chiede a
#    Galdrick, che ti dice in faccia che cosa sei. La sciabola resta a lui fino al passo 15.
# 15 Chi tiene i conti (grado 5): Durgan nel cerchio di gesso delle macerie (boss Difficile, o vie sociali tutte
#    Difficili; scuri.durgan 1 piegato, 2 preso dalla Caserma), poi il finale (scuri.finale): 1 il tavolo nuovo,
#    2 la mano sinistra (Rozalia, se non è in cella, o Nihali), 3 il registro allo sceriffo (rep.scuri −5,
#    rep.caserma +3). Ogni finale dà la sciabola di Vesh, che Galdrick manda con un biglietto, e l'anello liscio.
storylet:
  # ------------------------------------------------------------ 11 · la Casa dei Nodi di notte, l'ingresso
  - id: scuri-la-casa-dei-nodi-di-notte
    immagine: ambientazione/mercato-dei-nodi
    titolo: La Casa dei Nodi di notte
    sommario: "Il registro dei funzionari comprati da Durgan sta nella cassaforte dei timbri, alla Casa dei Nodi."
    luogo: Quartieri Alti, sotto le terrazze della Casa dei Nodi
    area: quartieri-alti
    requisiti: [fazione.scuri == 10, pista.pelle >= 6, bivio.legge == 2]
    testo: |
      Durgan compra con i soldi dei gettoni i funzionari che erano di Mirko,
      e Cosimo Venn li segna per la Gilda in un registro chiuso nella
      cassaforte dei timbri della Casa dei Nodi, con la matrice del timbro.
      «Il registro ti dà i funzionari e la matrice ti dà i timbri» ha detto
      Rozalia. «Se prendi tutti e due, la Gilda ti viene a cercare.»

      Di notte la Casa dei Nodi ha le lanterne dei Custodi di Passaggio
      accese a ogni piano. Sotto la terrazza dei carichi ti aspetta Venn, il
      cappuccio sugli occhi, masticando menta più in fretta del solito.

      {empatia Media} Venn ha paura di Durgan più che di te, perché chi
      compra funzionari prima o poi compra anche chi li segna.

      {origine mercante-dei-ponti} Di giorno la Casa dei Nodi la conosci dai
      banchi del pianterreno, e di notte ti sembra più alta.
    opzioni:
      - testo: "Farti dare la pianta da Venn"
        descrizione: "Venn sa dove dormono i balestrieri e quando passa la ronda, se gli conviene dirlo."
        prova: { attributo: sociale, abilita: [persuasione, intimidire], difficolta: Media }
        successo:
          titolo: La pianta
          testo: |
            Gli dici che chi compra i funzionari presto comprerà anche chi li
            segna. Venn arrossisce, ti dà una pianta a matita con le ronde segnate
            a margine e se ne va senza voltarsi.
          pe: { persuasione: 5 }
          imposta: { scuri.allarme: 0 }
          vai: scuri-casa-dei-nodi
        fallimento:
          titolo: Senza pianta
          testo: |
            Venn giura di non sapere niente e se ne va in fretta. Le catene si
            salgono lo stesso, senza sapere dove dormono i balestrieri.
          imposta: { scuri.allarme: 1 }
          vai: scuri-casa-dei-nodi
          effetti: { sospetto: 0.5 }

      - testo: "Ricordargli il quaderno nero"
        descrizione: "Hai una copia dei pagamenti di Venn, e lui non vuole che qualcuno la legga ad alta voce."
        quando: [scuri.venn >= 1]
        esito:
          titolo: La finestra accostata
          testo: |
            Gli reciti a memoria due righe datate del suo quaderno nero, e Venn
            smette di masticare. Ti dà la pianta con le ronde a margine e ti dice
            che stanotte la finestra del suo scrittoio resterà accostata.
          imposta: { scuri.allarme: 0 }
          vai: scuri-casa-dei-nodi

      - testo: "Salire senza pianta"
        descrizione: "Le catene si salgono anche senza pianta, se prima si guarda bene."
        costo: 2
        esito:
          titolo: Le lanterne dei Custodi
          testo: |
            Passi un'ora sotto la terrazza dei carichi a seguire le lanterne dei
            Custodi da un piano all'altro, finché non capisci il giro. Poi afferri
            la prima catena e cominci a salire.
          imposta: { scuri.allarme: 0 }
          vai: scuri-casa-dei-nodi

  # ------------------------------------------------------------ 12 · le tre porte (grado 4)
  - id: scuri-le-tre-porte
    presso: mercato-delle-ombre
    immagine: ambientazione/mercato-delle-ombre
    titolo: Le tre porte
    sommario: "Durgan attacca nella stessa notte le tre porte degli Scuri al Mercato delle Ombre, e il Velo guarda."
    luogo: Mercato delle Ombre, le porte degli Scuri
    area: citta-bassa
    requisiti: [fazione.scuri == 11, pista.pelle >= 6, bivio.legge == 2]
    testo: |
      Lo sapeva tutto il Mercato. Stanotte Durgan prende insieme le tre porte
      degli Scuri, con gli uomini che la Caserma non paga. Le prime due le
      tengono Gaia e Karn, la terza un ragazzo dell'Orlo che segue Karn
      dappertutto. Ai banchi i mercanti hanno coperto la merce con i teli e
      ci si sono seduti sopra, ad aspettare chi vince.

      Alle altre cinque porte i cappucci del Velo stanno immobili ai lati
      dell'arco. In mezzo alla piazza, accanto al banco del formaggio, c'è
      una donna bassa e robusta con il cappuccio abbassato sugli occhi
      grigio-verdi e le mani nelle maniche. È Ottilia Sanvel, della
      Confraternita del Velo, e non compra niente.

      {origine accolito-del-velo} Ottilia la riconosci dalle mani nelle
      maniche prima che dalla faccia. Ti ha fatto alzare all'alba per anni.
    opzioni:
      - testo: "Difendere la porta più debole"
        descrizione: "La porta del ragazzo dell'Orlo dà su una cantina larga dove entrano in tre, e lì servi tu."
        combattimento: scuri-la-porta-piu-debole
        vittoria:
          titolo: La cantina larga
          testo: |
            Nella cantina larga il primo mercenario cade sulla scala addosso al
            secondo, e il terzo scappa. Le altre porte reggono fino all'alba, e
            Gaia ti porta una brigantina di cuoio nero piena di piastrine cucite a
            mano, perché una porta adesso è tua.
          almeno: { rep.scuri: 8 }
          imposta: { scuri.decima: 1 }
          effetti: { fazione.scuri: 1, oggetto.scuri-brigantina: 1 }
        sconfitta:
          titolo: La scala
          testo: |
            Ne fermi due, e il terzo ti prende sulla scala con il manico della
            lancia. Gaia ti trascina via con il sangue in bocca, e per il resto
            della notte la porta è loro.

      - testo: "Trattare con Ottilia Sanvel"
        descrizione: "Il Velo appoggia chi gli racconta le cose, e Ottilia vorrà qualcosa in cambio, per iscritto."
        immagine: personaggi/ottilia-sanvel
        prova: { attributo: sociale, abilita: [galateo, persuasione], difficolta: Difficile }
        successo:
          titolo: Una notizia al mese
          testo: |
            Ottilia vuole una notizia al mese dalle tue porte, e nessuna formula
            proibita venduta ai novizi. Quando prometti, i cappucci delle cinque
            porte si spostano verso le vostre e i mercenari tornano su per le
            scale. Gaia ti porta una brigantina di cuoio nero, perché una porta
            adesso è tua.
          pe: { galateo: 5 }
          almeno: { rep.scuri: 8 }
          imposta: { scuri.decima: 1 }
          effetti: { fazione.scuri: 1, rep.velo: 1, oggetto.scuri-brigantina: 1 }
        fallimento:
          titolo: Il chiostro
          testo: |
            Ottilia ti dice che il Velo non sceglie fra due bande di ladri, e che
            stanotte guarderà. Quando i mercenari di Durgan scendono corri alla
            porta più debole, troppo tardi.
          effetti: { ferite: 1 }

      - testo: "Mostrare a Ottilia il registro dei funzionari pagati"
        descrizione: "Il registro di Venn sporca mezza Gilda, e per il Velo vale un anno di notizie."
        quando: [scuri.libro >= 1]
        immagine: personaggi/ottilia-sanvel
        prova: { attributo: sociale, abilita: [galateo, persuasione], difficolta: Media }
        successo:
          titolo: Un anno di notizie
          testo: |
            Ottilia legge tre pagine del registro senza toccarle e ti chiede le
            stesse promesse. Quando le fai, i cappucci si spostano verso le vostre
            porte, e Gaia ti porta una brigantina di cuoio nero, perché una porta
            adesso è tua.
          pe: { galateo: 5 }
          almeno: { rep.scuri: 8 }
          imposta: { scuri.decima: 1 }
          effetti: { fazione.scuri: 1, rep.velo: 1, oggetto.scuri-brigantina: 1 }
        fallimento:
          titolo: Le pagine sbagliate
          testo: |
            Fra i nomi del registro Ottilia trova quello di un novizio della
            Cattedrale. Ne parlerà con te un'altra notte, e resta al banco del
            formaggio mentre i mercenari scendono.
          effetti: { ferite: 1 }

      - testo: "Offrire a Ottilia le reliquie timbrate con la matrice"
        descrizione: "Con la matrice della Gilda una reliquia del Velo esce dal Mercato in regola, e Ottilia sa quanto vale."
        quando: [scuri.matrice >= 1, scuri.libro == 0]
        immagine: personaggi/ottilia-sanvel
        prova: { attributo: sociale, abilita: [galateo, persuasione], difficolta: Media }
        successo:
          titolo: Il timbro
          testo: |
            Con il timbro della Gilda, le dici, le reliquie della Confraternita
            potranno uscire dal Mercato, e Ottilia ti guarda per la prima volta
            come uno con cui si tratta. In cambio di questo e della solita notizia
            al mese i cappucci si spostano verso le vostre porte, e Gaia ti porta
            una brigantina di cuoio nero, perché una porta adesso è tua.
          pe: { galateo: 5 }
          almeno: { rep.scuri: 8 }
          imposta: { scuri.decima: 1 }
          effetti: { fazione.scuri: 1, rep.velo: 1, oggetto.scuri-brigantina: 1 }
        fallimento:
          titolo: Il timbro rubato
          testo: |
            Ottilia ti ricorda che la matrice è della Gilda, e il Velo non compra
            cose rubate alla Gilda in una notte in cui la Gilda guarda. Resta al
            banco del formaggio, e i mercenari scendono.
          effetti: { ferite: 1 }

      - testo: "Lasciar cadere una porta e tenere le altre due"
        descrizione: "La porta del ragazzo dell'Orlo si perde comunque, e chiudendosi nelle altre due si tengono quelle."
        esito:
          titolo: Due porte su tre
          testo: |
            Lasci la cantina larga ai mercenari e corri fino all'alba fra le altre
            due porte, che reggono. Durgan ha una porta degli Scuri e voi due, e
            Gaia ti porta una brigantina di cuoio nero dicendoti che una è tua.
          almeno: { rep.scuri: 8 }
          imposta: { scuri.decima: 1, scuri.porta: 1 }
          effetti: { fazione.scuri: 1, oggetto.scuri-brigantina: 1 }

      - testo: "Parlare a Ottilia come un novizio"
        descrizione: "Ottilia ti ha fatto alzare all'alba per anni, e un novizio lo ascolta fino in fondo."
        quando: [origine.accolito-del-velo >= 1]
        immagine: personaggi/ottilia-sanvel
        prova: { attributo: sociale, abilita: [galateo, resilienza], difficolta: Media }
        successo:
          titolo: La regola dei lumi
          testo: |
            Le parli con le mani raccolte davanti alla cintura, come si impara nel
            corridoio dell'alba, e prometti quello che chiede. I cappucci si
            spostano verso le vostre porte, e Gaia ti porta una brigantina di
            cuoio nero.
          pe: { galateo: 5 }
          almeno: { rep.scuri: 8 }
          imposta: { scuri.decima: 1 }
          effetti: { fazione.scuri: 1, rep.velo: 1, oggetto.scuri-brigantina: 1 }
        fallimento:
          titolo: La fila
          testo: |
            Le parli come un novizio, e Ottilia ti tratta come un novizio. Ti
            rimanda in fondo alla fila con una frase sola, e resta al banco del
            formaggio mentre i mercenari scendono.
          effetti: { ferite: 1 }

  # ------------------------------------------------------------ 13 · Nihali torna da Pannion
  - id: scuri-nihali-torna-da-pannion
    presso: orlo-dei-rottami
    immagine: personaggi/nihali-cuzan
    titolo: Nihali torna da Pannion
    sommario: "Nihali Cuzan è tornato da Pannion più malato, con i capi delle bande dei villaggi, e vuole una partita."
    luogo: Orlo dei Rottami, la cisterna rovesciata
    area: citta-bassa
    requisiti: [fazione.scuri == 12, pista.pelle >= 6, bivio.legge == 2]
    testo: |
      Nihali Cuzan è tornato da Pannion con la prima carovana d'autunno e si
      è ripreso la cassa di ferro della cisterna, più magro, con la faccia
      grigia e il fazzoletto ricamato più nero di prima. Con lui ci sono i
      capi delle bande di Pannion e di Tuarmir, che non si tolgono il
      cappello e sono venuti a sapere a chi conviene rispondere adesso che
      Mirko non c'è.

      «A carte dico la verità anche quando baro» dice Nihali, mescolando.
      «Giochiamo. Se vinci tu, le bande stanno a sentire te.»

      {percezione Difficile} Quando mescola, la carta di fondo resta sempre
      la stessa, un fante di coppe con l'angolo ingiallito.

      {origine figlio-del-circolo} Quel grigio sulla faccia, al Circolo, lo
      curavano con la radice amara, e sai dove trovarla.
    opzioni:
      - testo: "Giocare la partita"
        descrizione: "Una partita a Zekar con Nihali, e se vinci le bande dei villaggi stanno a sentire te."
        zekar: scuri-nihali
        vittoria:
          titolo: Le bande
          testo: |
            Vinci al venti esatto, e Nihali butta le carte ridendo fino a tossire
            mentre i due capi si tolgono il cappello. Ti indica l'anello liscio di
            Mirko, nel deposito della Caserma, e ti regala un reperto portato da
            Pannion.
          imposta: { scuri.nihali: 1 }
          effetti: { fazione.scuri: 1, rep.scuri: 1, reperto.sigillato: 1 }
        sconfitta:
          titolo: Il fante di coppe
          testo: |
            Nihali vince con un fante di coppe che non doveva esserci e si prende
            la posta, mentre i due capi si rimettono il cappello.
          effetti: { monete: -15 }

      - testo: "Scoprire il suo trucco"
        descrizione: "Dire davanti ai capi che la carta di fondo è sempre la stessa vale una vittoria."
        prova: { attributo: mentale, abilita: [percezione, ingannare], difficolta: Difficile }
        successo:
          titolo: La carta di fondo
          testo: |
            Prima che distribuisca giri il mazzo, e in fondo c'è il fante di
            coppe. «Allora sai guardare» dice Nihali sorridendo. I due capi si
            tolgono il cappello, e Nihali ti indica l'anello liscio nel deposito
            della Caserma e ti regala un reperto di Pannion.
          pe: { percezione: 5 }
          imposta: { scuri.nihali: 1 }
          effetti: { fazione.scuri: 1, rep.scuri: 1, reperto.sigillato: 1 }
        fallimento:
          titolo: Il polso
          testo: |
            Giri il mazzo, e in fondo c'è una carta qualsiasi. Nihali ti guarda il
            polso finché non lo lasci, e i due capi delle bande ridono di te per
            il resto della sera.
          effetti: { rep.scuri: -0.5, scandalo: 0.5 }

      - testo: "Curarlo prima della partita"
        descrizione: "Chi tiene in piedi Nihali ancora un inverno ha il suo debito, e le bande lo vedono."
        prova: { attributo: mentale, abilita: [medicina, natura], difficolta: Difficile }
        successo:
          titolo: Un inverno in più
          testo: |
            Gli togli la pipa di bocca e gli prepari un decotto che lo fa dormire
            un giorno intero. Si sveglia meno grigio, e davanti ai capi ti indica
            l'anello liscio, nel deposito della Caserma.
          pe: { medicina: 5 }
          imposta: { scuri.nihali: 1 }
          effetti: { fazione.scuri: 1, rep.scuri: 1, reperto.sigillato: 1 }
        fallimento:
          titolo: La pipa
          testo: |
            Nihali beve il tuo decotto ringraziando, poi si riaccende la pipa. I
            medici di Pannion gli hanno detto le stesse cose, e la partita si
            gioca un'altra sera.
          effetti: { tormento: 0.5 }

      - testo: "Curarlo con la pasta nera di Nestor"
        descrizione: "La pasta nera di Nestor tiene in piedi un uomo per un inverno, anche col fegato guasto."
        quando: [scuri.nestor >= 1]
        prova: { attributo: mentale, abilita: [medicina, natura], difficolta: Media }
        successo:
          titolo: La ricetta di Nestor
          testo: |
            Nihali riconosce la pasta nera dall'odore e ride, chiedendoti se il
            vecchio è ancora vivo. La sera ha la faccia meno grigia, e davanti ai
            capi ti dice che le bande aspettano l'anello liscio, nel deposito
            della Caserma.
          pe: { medicina: 5 }
          imposta: { scuri.nihali: 1 }
          effetti: { fazione.scuri: 1, rep.scuri: 1, reperto.sigillato: 1 }
        fallimento:
          titolo: La dose
          testo: |
            Sbagli la dose, e la pasta nera fa a Nihali quello che fa ai topi del
            retrobottega. Sopravvive, e la partita si gioca quando avrà smesso di
            vedere doppio.
          effetti: { tormento: 0.5 }

      - testo: "Promettergli una porta del Mercato"
        descrizione: "Una porta del Mercato è una rendita per la vecchiaia, e le bande vedranno la promessa."
        esito:
          titolo: La porta di Nihali
          testo: |
            Gli prometti la porta del ragazzo dell'Orlo, per quando sarà stanco, e
            Nihali accetta tossendo. Davanti ai capi ti indica l'anello liscio,
            nel deposito della Caserma, e da quel giorno una parte della tua
            decima va a lui.
          imposta: { scuri.nihali: 1 }
          effetti: { fazione.scuri: 1, rep.scuri: 0.5 }

      - testo: "Riportare Squiggor dalla tua parte"
        descrizione: "Squiggor sta con Durgan perché Durgan paga, ma alla cisterna vale ancora la tregua dell'Orlo."
        quando: [squiggor < 2, scuri.squiggor == 0]
        requisiti: [contatto-ombra >= 1]
        immagine: personaggi/squiggor-ironfist
        prova: { attributo: sociale, abilita: [intimidire, conoscenze-della-strada], difficolta: Media }
        successo:
          titolo: La benda
          testo: |
            Fuori dalla cisterna Squiggor fa la guardia per Durgan. Gli ricordi la
            tregua dell'Orlo e chi pagava la sua benda quando Mirko era vivo. Lui
            sputa ed entra con te, e da quella sera fa la guardia alla tua porta.
          pe: { intimidire: 5 }
          imposta: { scuri.squiggor: 1 }
        fallimento:
          titolo: La paga di Durgan
          testo: |
            Squiggor ti risponde che la benda adesso la paga Durgan, e con una
            spinta ti fa sedere sulle lamiere.
          imposta: { scuri.squiggor: 2 }
          effetti: { ferite: 0.5 }

  # ------------------------------------------------------------ 14 · l'anello liscio
  - id: scuri-l-anello-liscio
    presso: guarnigione-di-qir-azel
    immagine: personaggi/toren-galdrick
    titolo: L'anello liscio
    sommario: "Per le bande chi porta l'anello liscio di Mirko ha parlato con il morto, e l'anello è in Caserma."
    luogo: Guarnigione di Qir-Azel, il deposito
    area: quartieri-alti
    requisiti: [fazione.scuri == 13, pista.pelle >= 6, bivio.legge == 2]
    testo: |
      L'anello liscio, l'unico che Mirko portava di suo, sta nel deposito
      della Caserma in una cassetta di legno, accanto alla sciabola con cui
      Mirko ha aperto il fianco dello sceriffo. Senza l'anello le bande dei
      villaggi non si muovono.

      Il deposito sta in fondo al cortile, accanto alle scuderie, con una
      porta di quercia e un lucchetto grosso come un pugno. Gaia giura che
      una vecchia cantina delle Vie di Sotto arriva fin sotto il cortile.

      {galateo Media} Il furiere della Caserma firma ogni ordine di prelievo
      che abbia il sigillo dello sceriffo in basso a destra.

      {origine fuggiasco-di-ghoran} Hagra ha le chiavi del magazzino dei
      mercenari di Ghoran rimasti in Caserma, che ha una porta sul deposito.
    opzioni:
      - testo: "Chiederlo a Galdrick"
        descrizione: "Lo sceriffo ha restituito tutti gli altri anelli, e questo potrebbe darlo a chi glielo chiede in faccia."
        quando: [galdrick.via == 0]
        requisiti: [rep.caserma >= 3]
        esito:
          titolo: L'ufficio dello sceriffo
          testo: |
            Sali all'ufficio dello sceriffo e chiedi di lui. Il sergente ti
            guarda come si guarda uno che è andato a bussare alla porta
            sbagliata, poi ti fa entrare.
          segue: scuri-galdrick-e-l-anello

      - testo: "Presentare un ordine di prelievo falso"
        descrizione: "Il furiere firma tutto quello che ha il sigillo dello sceriffo, e Rozalia il sigillo lo sa fare."
        prova: { attributo: sociale, abilita: [galateo, ingannare], difficolta: Difficile }
        successo:
          titolo: Il furiere
          testo: |
            Il furiere legge l'ordine con il dito, guarda il sigillo in basso a
            destra e ti apre il deposito. Prendi l'anello liscio, e la sciabola
            resta nella cassetta, perché l'ordine dice anello e il furiere sa
            leggere.
          pe: { galateo: 5 }
          imposta: { scuri.anello: 1 }
          effetti: { fazione.scuri: 1, rep.scuri: 1, rep.caserma: -1 }
        fallimento:
          titolo: Il sigillo storto
          testo: |
            Il furiere guarda il sigillo e lo trova storto di un capello. Ti
            dice che va a chiedere allo sceriffo, e tu non lo aspetti.
          effetti: { sospetto: 1.5, rep.caserma: -1 }

      - testo: "Entrare di notte dalle Vie di Sotto"
        descrizione: "La cantina di Gaia arriva sotto il cortile, dove alla seconda ora il miliziano dorme."
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Difficile }
        successo:
          titolo: La cantina sotto il cortile
          testo: |
            Esci da una botola nelle scuderie e attraversi il cortile al buio. Il
            miliziano dorme con la mazza in grembo e il lucchetto cede alla terza
            chiave vecchia. Prendi l'anello liscio e lasci la sciabola, che in
            Città Bassa riconoscerebbero tutti.
          pe: { furtivita: 5 }
          imposta: { scuri.anello: 1 }
          effetti: { fazione.scuri: 1, rep.scuri: 1, rep.caserma: -2 }
        fallimento:
          titolo: I cavalli
          testo: |
            Un cavallo ti nitrisce in faccia appena esci dalla botola, e il
            miliziano si sveglia e chiama. Perdi i due mantelli scarlatti soltanto
            nelle gallerie, con le ginocchia sbucciate.
          effetti: { ferite: 1, sospetto: 1.5 }

      - testo: "Farti largo nel cortile"
        descrizione: "Davanti al deposito di notte ci sono due miliziani, e lo sceriffo lo saprà."
        combattimento: scuri-il-cortile-della-caserma
        vittoria:
          titolo: Il lucchetto
          testo: |
            I due miliziani vanno giù senza gridare e il lucchetto cede al pomo.
            Con l'anello liscio in tasca sei nelle Vie di Sotto prima che la
            Caserma si svegli, e il giorno dopo tutta la Città Bassa sa della
            visita al deposito.
          imposta: { scuri.anello: 1 }
          effetti: { fazione.scuri: 1, rep.scuri: 1, rep.caserma: -3 }
        sconfitta:
          titolo: La mazza corta
          testo: |
            Il secondo miliziano ti prende alla spalla con la mazza corta, e
            arrivano gli altri. Scappi dalle scuderie per la botola, e li perdi
            nelle gallerie.
          effetti: { sospetto: 1.5 }

      - testo: "Farti aprire da Hagra il magazzino accanto al deposito"
        descrizione: "Hagra ha le chiavi del magazzino che dà sul deposito, e a un fuggiasco di Ghoran apre."
        quando: [origine.fuggiasco-di-ghoran >= 1]
        prova: { attributo: sociale, abilita: [persuasione, intimidire], difficolta: Media }
        successo:
          titolo: La porta sola
          testo: |
            Hagra ti apre il magazzino masticando resina e fra le brande ti indica
            la porta del deposito, senza chiederti che cosa cerchi. Prendi
            l'anello liscio e lasci la sciabola, e uscendo Hagra ti dice soltanto
            «eh».
          pe: { persuasione: 5 }
          imposta: { scuri.anello: 1 }
          effetti: { fazione.scuri: 1, rep.scuri: 1, rep.caserma: -2 }
        fallimento:
          titolo: La resina
          testo: |
            Hagra ti dice che per una cosa così rischia la paga che non le danno,
            e chiude il magazzino a chiave. Dal portone il sergente ti guarda
            uscire.
          effetti: { sospetto: 1.5 }

  # ------------------------------------------------------------ 14 · il seguito, nell'ufficio di Galdrick
  - id: scuri-galdrick-e-l-anello
    immagine: personaggi/toren-galdrick
    titolo: Quello che sei
    tipo: seguito
    luogo: Guarnigione di Qir-Azel, l'ufficio dello sceriffo
    area: quartieri-alti
    requisiti: [fazione.scuri == 13]
    testo: |
      Galdrick ti riceve seduto, con il fianco ancora rigido sotto la giubba.
      Ti ascolta senza interromperti, poi tira fuori da un cassetto la
      cassetta del deposito.

      «Le porte del Mercato le conosco tutte da vent'anni, e non ci sono mai
      entrato, perché il Velo sa le cose che ci si dicono e io so le cose che
      sa il Velo» dice. «Così la città sta in piedi.» Guarda l'anello liscio
      controluce. «Mirko diceva che la città aveva scelto lui, e io gli
      rispondevo che era la paura. Tu che cosa dici?»

      {empatia Media} Ti guarda senza rabbia, nello stesso modo in cui
      guardava Mirko.
    opzioni:
      - testo: "Dirgli che la Città Bassa ha bisogno di qualcuno che tenga i conti"
        descrizione: "Il vuoto lasciato da Mirko lo riempie qualcuno comunque, meglio uno che lo sceriffo conosce."
        prova: { attributo: sociale, abilita: [persuasione, politica-ed-economia], difficolta: Media }
        successo:
          titolo: Uno che conosco
          testo: |
            Galdrick scrive una riga sul taccuino. «Meglio uno che conosco» dice,
            e ti posa l'anello nel palmo. La sciabola la tiene, finché non saprà
            che cosa sei diventato, e alla porta non ti stringe la mano.
          pe: { persuasione: 5 }
          imposta: { scuri.anello: 1 }
          effetti: { fazione.scuri: 1, rep.scuri: 1, rep.caserma: 1 }
        fallimento:
          titolo: La matita corta
          testo: |
            Galdrick ti dà l'anello lo stesso, perché non è suo, e ti dice senza
            alzare gli occhi dal taccuino che un ladro che si fa chiamare
            contabile resta un ladro. «Mirko almeno non si dava nomi.»
          imposta: { scuri.anello: 1 }
          effetti: { fazione.scuri: 1, rep.scuri: 1, sospetto: 0.5 }

      - testo: "Dirgli che è la paura, come diceva lui"
        descrizione: "Sono le parole che Galdrick ha detto a Mirko l'ultima notte, e ripetergliele è dire la verità."
        prova: { attributo: sociale, abilita: [empatia, galateo], difficolta: Media }
        successo:
          titolo: La sedia
          testo: |
            Gli dici che è la paura, e che lo sai perché la usi. Galdrick ride, e
            la risata gli fa male al fianco. Ti posa l'anello nel palmo e tiene la
            sciabola. «Almeno con me sei onesto.»
          pe: { empatia: 5 }
          imposta: { scuri.anello: 1 }
          effetti: { fazione.scuri: 1, rep.scuri: 1, rep.caserma: 1 }
        fallimento:
          titolo: Le parole sue
          testo: |
            Gli dici che è la paura, e Galdrick ti risponde che le sue parole in
            bocca tua suonano come una canzone rubata. Ti dà l'anello e tiene
            la sciabola, e ti fa accompagnare al portone dal sergente.
          imposta: { scuri.anello: 1 }
          effetti: { fazione.scuri: 1, rep.scuri: 1, scandalo: 0.5 }

      - testo: "Prendere l'anello e tacere"
        descrizione: "Allo sceriffo non si risponde, si prende quello che dà e si esce."
        esito:
          titolo: Il silenzio
          testo: |
            Galdrick annuisce come se avessi risposto e ti posa l'anello nel
            palmo, tenendo la sciabola. Quando sei sulla porta lo senti dire,
            piano, che lui aspetta, come aspettava Mirko.
          imposta: { scuri.anello: 1 }
          effetti: { fazione.scuri: 1, rep.scuri: 1 }

  # ------------------------------------------------------------ 15 · il cerchio di gesso
  - id: scuri-il-cerchio-di-gesso
    presso: macerie-della-pignatta
    immagine: fazioni/scuri
    titolo: Il cerchio di gesso
    sommario: "Durgan ti aspetta nel cerchio di gesso del cortile delle risse, con l'ascia sulla spalla."
    luogo: Le macerie della Pignatta, il cortile delle risse
    area: citta-bassa
    requisiti: [fazione.scuri == 14, pista.pelle >= 6, bivio.legge == 2]
    testo: |
      Il cortile delle risse della Pignatta è pieno di cenere bagnata, e sotto
      la cenere si vede il cerchio di gesso, ripassato stamattina. Durgan ci
      sta dentro con l'ascia sulla spalla, e contro il muro annerito, dietro
      di lui, una ventina di mercenari di Ghoran che la Caserma non paga
      tengono le lance appoggiate a terra. Il nano non ha aperto bocca, e
      nessuno si aspetta che lo faccia.

      Dietro di te c'è quello che hai raccolto. Gaia è seduta sul bancone di
      quercia e Karn sul muro di fondo, Nihali su una cassa con il fazzoletto
      in mano, e i due capi delle bande hanno il cappello sulle ginocchia. Sui
      tetti intorno la Città Bassa guarda senza fingere il contrario.

      {armi-da-mischia Media} L'ascia di Durgan è pesante in punta, e dopo
      ogni colpo il suo fianco resta scoperto.

      {origine fuggiasco-di-ghoran} Fra i clan una sfida nel cerchio si fa
      senza armi, e chi esce dal cerchio perde la faccia. Durgan l'ascia l'ha
      portata, e i suoi uomini se ne sono accorti.

      Sul dito ti pesa l'anello liscio. *Mirko si sedeva su una sedia, in
      mezzo al cerchio.* Fai un passo dentro il gesso.
    opzioni:
      - testo: "Combattere nel cerchio"
        descrizione: "Durgan e due dei suoi, e se lo pieghi davanti a tutti i mercenari capiscono chi paga."
        quando: [scuri.squiggor != 2]
        combattimento: scuri-il-cerchio-di-gesso
        vittoria:
          titolo: In ginocchio nel gesso
          testo: |
            Durgan non apre bocca nemmeno quando l'ascia gli scappa di mano e
            rotola nella cenere. Resta in ginocchio nel cerchio, e il cortile
            aspetta che tu dica che cosa succede adesso.
          imposta: { scuri.durgan: 1 }
          segue: scuri-chi-tiene-i-conti
        sconfitta:
          titolo: La cenere
          testo: |
            L'ascia di Durgan ti prende di piatto sulla schiena e ti butta fuori
            dal cerchio. Gaia e Karn ti tirano via prima del secondo colpo, e
            quella notte Durgan si prende una delle tue porte.
          imposta: { scuri.porta: 1 }

      - testo: "Combattere nel cerchio contro Durgan e Squiggor"
        descrizione: "Squiggor è rimasto con Durgan, e nel cerchio entrano tutti e due."
        quando: [scuri.squiggor == 2]
        combattimento: scuri-il-cerchio-con-squiggor
        vittoria:
          titolo: La benda e l'ascia
          testo: |
            Squiggor va giù per primo e resta seduto nella cenere a ridere, come
            rideva quando lo colpivano. Durgan resta in ginocchio senza l'ascia, e
            il cortile aspetta che tu dica che cosa succede adesso.
          imposta: { scuri.durgan: 1 }
          segue: scuri-chi-tiene-i-conti
        sconfitta:
          titolo: La cenere
          testo: |
            Squiggor ti tiene e Durgan colpisce, e ti ritrovi fuori dal cerchio
            con la faccia nella cenere. Gaia e Karn ti tirano via. Quella notte
            Durgan si prende una delle tue porte.
          imposta: { scuri.porta: 1 }

      - testo: "Comprare i mercenari con la paga che la Caserma non dà"
        descrizione: "I mercenari stanno con Durgan perché paga, e davanti a una borsa più pesante cambiano padrone."
        requisiti: [monete >= 100]
        prova: { attributo: mentale, abilita: [politica-ed-economia, percezione], difficolta: Difficile }
        successo:
          titolo: La paga
          testo: |
            Posi sul bancone di quercia la paga di tre mesi, per chi torna a
            Ghoran o per chi lavora per te. Uno dopo l'altro i mercenari posano la
            lancia e vanno al bancone, e Durgan resta solo nel cerchio.
          pe: { politica-ed-economia: 5 }
          imposta: { scuri.durgan: 1 }
          effetti: { monete: -100 }
          segue: scuri-chi-tiene-i-conti
        fallimento:
          titolo: La borsa
          testo: |
            Durgan guarda la borsa e ride, per la prima volta da quando lo
            conosci. «Chi paga una volta paga sempre» dice ai suoi, e i mercenari
            si prendono la borsa e restano con lui.
          effetti: { monete: -50, scandalo: 0.5 }

      - testo: "Pagarli con le reliquie timbrate"
        descrizione: "Con la matrice della Gilda una reliquia diventa moneta pulita, e ai mercenari basta che valga."
        quando: [scuri.matrice >= 1]
        prova: { attributo: mentale, abilita: [politica-ed-economia, percezione], difficolta: Difficile }
        successo:
          titolo: Il timbro della Gilda
          testo: |
            Apri una cassa di reliquie con il timbro fresco della Gilda e dici ai
            mercenari che con quelle si comprano un viaggio a Ghoran e una casa.
            Uno ne guarda il timbro e la mostra agli altri, e Durgan resta solo
            nel cerchio.
          pe: { politica-ed-economia: 5 }
          imposta: { scuri.durgan: 1 }
          segue: scuri-chi-tiene-i-conti
        fallimento:
          titolo: Il timbro fresco
          testo: |
            Durgan passa il pollice su una reliquia e il timbro si sbava. «Chi
            paga con la carta della Gilda paga con la carta» dice, e i mercenari
            restano con lui.
          effetti: { sospetto: 1.5 }

      - testo: "Far parlare Hagra davanti a tutti"
        descrizione: "Hagra non vuole riscuotere dalle donne, e detto nel cerchio davanti a tutti pesa."
        quando: [scuri.hagra >= 1]
        prova: { attributo: sociale, abilita: [persuasione, empatia], difficolta: Difficile }
        successo:
          titolo: Eh
          testo: |
            Hagra entra nel cerchio dalla tua parte, sputa la resina ai piedi di
            Durgan e dice nella lingua dei clan che cosa pensa di chi taglieggia
            le donne. Metà dei mercenari posa la lancia, e l'altra metà la segue.
          pe: { persuasione: 5 }
          imposta: { scuri.durgan: 1 }
          segue: scuri-chi-tiene-i-conti
        fallimento:
          titolo: La paga
          testo: |
            Durgan risponde a Hagra con una frase sola sulla paga, e lei esce dal
            cerchio alzando le spalle. I mercenari restano dove sono.
          effetti: { rep.scuri: -0.5, scandalo: 0.5 }

      - testo: "Far prendere Durgan da Galdrick"
        descrizione: "Una lista di porte taglieggiate e funzionari comprati, arrivata alla Caserma al momento giusto, fa il lavoro senza sangue."
        quando: [galdrick.via == 0]
        prova: { attributo: sociale, abilita: [ingannare, conoscenze-della-strada], difficolta: Difficile }
        successo:
          titolo: I mantelli scarlatti
          testo: |
            Gaia porta la lista alla Caserma all'alba, e a mezzogiorno i mantelli
            scarlatti entrano nel cortile delle risse. Galdrick ti fa un cenno
            lento con il mento, e Durgan esce dal cerchio in catene mentre i suoi
            uomini guardano te.
          pe: { ingannare: 5 }
          imposta: { scuri.durgan: 2 }
          segue: scuri-chi-tiene-i-conti
        fallimento:
          titolo: La lista
          testo: |
            Lo sceriffo legge la lista e ti fa chiamare, per chiederti perché un
            capo degli Scuri gli porta i suoi nemici su un foglio. Durgan resta
            nel cerchio.
          effetti: { rep.caserma: -1, sospetto: 1.5 }

      - testo: "Sfidarlo con il codice dei clan"
        descrizione: "Fra i clan nel cerchio si entra senza armi, e Durgan l'ascia l'ha portata."
        quando: [origine.fuggiasco-di-ghoran >= 1]
        prova: { attributo: sociale, abilita: [intimidire, conoscenze-della-strada], difficolta: Difficile }
        successo:
          titolo: Senza armi
          testo: |
            Getti fuori dal gesso la cintura con le armi e dici nella lingua dei
            clan che chi entra con l'ascia ha già perso la faccia. Durgan getta
            fuori la sua, e quando lo metti con la schiena nella cenere i suoi
            uomini non si muovono.
          pe: { intimidire: 5 }
          imposta: { scuri.durgan: 1 }
          segue: scuri-chi-tiene-i-conti
        fallimento:
          titolo: L'ascia
          testo: |
            Getti fuori dal gesso la tua cintura e dici la sfida dei clan, ma
            Durgan l'ascia la tiene, e quella notte si prende una delle tue porte.
          imposta: { scuri.porta: 1 }
          effetti: { scandalo: 0.5 }

  # ------------------------------------------------------------ 15 · chi tiene i conti (grado 5)
  - id: scuri-chi-tiene-i-conti
    presso: macerie-della-pignatta
    immagine: fazioni/scuri
    titolo: Chi tiene i conti
    tipo: seguito
    luogo: Le macerie della Pignatta, il cortile delle risse
    area: citta-bassa
    requisiti: [fazione.scuri == 14, scuri.durgan >= 1]
    testo: |
      Durgan è fuori dal gioco, e i mercenari di Ghoran guardano te. La
      Città Bassa vuole sapere chi tiene i conti adesso, e con quali regole.

      Rozalia te le ha scritte su un foglio piegato in tre. Nelle consegne
      non vanno i ragazzi sotto i sedici anni e sulle porte non si
      inchiodano gettoni, e il sangue si versa soltanto con il tuo sì. In
      fondo ha lasciato una riga vuota per la tua firma.

      {politica-ed-economia Media} Al tavolo d'angolo si prende la decima di
      tutte le porte e si paga per chiunque finisca in cella. Dietro il
      tavolo si prende meno, e si rischia meno.

      Sul cancello del cortile si è fermato un garzone della Caserma con una
      cassetta di legno. Dentro c'è la sciabola di Mirko, con un biglietto
      dello sceriffo legato all'elsa che dice *a chi tiene i conti, perché
      sappia di chi era*.
    opzioni:
      - testo: "Sederti al tavolo d'angolo"
        descrizione: "Il tavolo nuovo è tuo, con le regole che hai firmato, e la Città Bassa risponde a te."
        esito:
          titolo: Il tavolo nuovo
          testo: |
            Firmi la riga vuota con la penna di Rozalia e ti siedi sul bancone di
            quercia, e i mercenari depongono le lance davanti a te. Entro la
            mattina dopo del tavolo nuovo sanno la Caserma e Julia Castaldi, che
            le sue licenze voleva farle rispettare da sola.
          almeno: { rep.scuri: 10 }
          imposta: { scuri.finale: 1, scuri.decima: 2 }
          effetti: { fazione.scuri: 1, monete: 350, nomea.citta-bassa: 1, rep.caserma: -2, rep.castaldi: -1, oggetto.scuri-sciabola-di-vesh: 1, oggetto.scuri-anello-liscio: 1 }

      - testo: "Mettere Rozalia al tavolo e restare dietro"
        descrizione: "Mirko diceva che Rozalia è troppo brava, e al tavolo davanti a tutti siede lei."
        quando: [macerie.rozalia != 2]
        immagine: personaggi/rozalia-marga
        esito:
          titolo: La mano sinistra
          testo: |
            Rozalia firma la riga vuota con il suo nome senza ricciolo e si siede
            sul bancone di quercia. «Per la precisione, tesoro, questo tavolo è
            tuo» dice a bassa voce, «e io ci sto seduta sopra.» La Caserma vede
            lei, e la Città Bassa sa chi c'è dietro.
          almeno: { rep.scuri: 10 }
          imposta: { scuri.finale: 2 }
          effetti: { fazione.scuri: 1, monete: 300, oggetto.scuri-sciabola-di-vesh: 1, oggetto.scuri-anello-liscio: 1 }

      - testo: "Mettere Nihali al tavolo e restare dietro"
        descrizione: "Nihali dice la verità anche quando bara, e le bande lo conoscono, così al tavolo siede lui."
        immagine: personaggi/nihali-cuzan
        esito:
          titolo: La mano sinistra
          testo: |
            Nihali firma la riga vuota con una grafia elegante e tremolante e
            accende la pipa. «Per un inverno o due» dice, tossendo. I capi delle
            bande si tolgono il cappello davanti a lui e guardano te.
          almeno: { rep.scuri: 10 }
          imposta: { scuri.finale: 2 }
          effetti: { fazione.scuri: 1, monete: 300, oggetto.scuri-sciabola-di-vesh: 1, oggetto.scuri-anello-liscio: 1 }

      - testo: "Portare il registro allo sceriffo"
        descrizione: "Galdrick avrà porte e nomi, e la Città Bassa non lo dimenticherà."
        quando: [galdrick.via == 0]
        immagine: personaggi/toren-galdrick
        esito:
          titolo: La cassetta
          testo: |
            Restituisci la sciabola al garzone e nella cassetta metti il foglio
            delle regole, con i nomi di tutti sul retro e la porta del Mercato di
            ognuno. Galdrick li legge uno per uno, poi ti rimette in mano la
            sciabola. «Meglio in mano tua che nel deposito.» Entro sera, sulle
            porte della Città Bassa compare una pentola tagliata in due.
          imposta: { scuri.finale: 3, scuri.decima: 0 }
          effetti: { fazione.scuri: 1, monete: 400, rep.scuri: -5, rep.caserma: 3,  oggetto.scuri-sciabola-di-vesh: 1, oggetto.scuri-anello-liscio: 1 }
