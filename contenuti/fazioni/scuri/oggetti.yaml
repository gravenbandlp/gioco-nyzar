# Gli oggetti della quest degli Scuri: uno per grado, più l'anello liscio di Vesh al grado 5.
# Grado 1 lo stiletto da manica (arma, grado 1); grado 2 il cappuccio degli Scuri (accessorio, grado 2); grado 3 le
# tre chiavi del Mercato delle Ombre (accessorio, grado 2, con la chiave tre-porte che apre opzioni nelle scene);
# grado 4 la brigantina degli Scuri (armatura, grado 3); grado 5 la sciabola di Vesh (arma, grado 4, il pezzo
# unico della quest) e l'anello liscio (accessorio, grado 3, legato).
# Punti di grado: grado più un punto per ogni difetto (docs/regolamento-oggetti.md).
oggetti:
  - id: scuri-stiletto-da-manica
    nome: Stiletto da manica
    immagine: icone/plain-dagger
    descrizione: "Una lama stretta come un ferro da calza, con il fodero cucito dentro la manica. Rozalia lo dà alle facce nuove, e lo vuole indietro pulito."
    slot: arma
    base: pugnale
    grado: 1
    dadi: 1

  - id: scuri-cappuccio-degli-scuri
    nome: Cappuccio degli Scuri
    immagine: icone/hooded-figure
    descrizione: "Lana grigia tinta due volte, con l'orlo cucito a mano da qualcuno che sapeva farlo. Nei vicoli chi lo vede abbassa la voce, e chi lo porta impara presto a non farsi sentire."
    slot: accessorio
    grado: 2
    proprieta: { talento: { furtivita: 1, intimidire: 1 } }

  - id: scuri-tre-chiavi
    nome: Le tre chiavi del Mercato
    immagine: icone/house-keys
    descrizione: "Tre chiavi di ferro su un anello di rame, una per ogni porta degli Scuri al Mercato delle Ombre. Le porte cambiano ogni due o tre mesi, e le chiavi con loro."
    slot: accessorio
    grado: 2
    proprieta: { talento: { conoscenze-della-strada: 1, ingannare: 1 }, chiave: [tre-porte] }

  - id: scuri-brigantina
    nome: Brigantina degli Scuri
    immagine: icone/leather-armor
    descrizione: "Cuoio nero foderato di piastrine cucite a mano, una per ogni debito riscosso da chi l'ha portata prima di te. Non fa rumore, e in Città Bassa la riconoscono tutti."
    slot: armatura
    base: cuoio-rinforzato
    grado: 3
    dadi: 1
    proprieta: { silenziosa: true, robusta: 1 }
    difetti: [riconoscibile]

  - id: scuri-sciabola-di-vesh
    nome: Sciabola di Vesh
    immagine: icone/piercing-sword
    descrizione: "La lama sottile di Mirko Vesh, roba da sala d'armi, con l'elsa d'argento consumata dove lui teneva il pollice. Ha aperto il fianco di Galdrick la notte della Pignatta, e chiunque in Città Bassa la riconosce da lontano."
    slot: arma
    base: spada-corta
    grado: 4
    dadi: 2
    proprieta: { affilata: 1, rapida: 1, penetrante: 1 }
    difetti: [riconoscibile]

  - id: scuri-anello-liscio
    nome: Anello liscio di Vesh
    immagine: icone/ring
    descrizione: "Argento senza pietra e senza segni, consumato su un lato. Era l'unico anello che Mirko Vesh portava di suo. Una volta al dito non viene più via, e chi te lo vede addosso si ricorda a chi deve qualcosa."
    slot: accessorio
    grado: 3
    proprieta: { talento: { persuasione: 1, intimidire: 1, ingannare: 1, conoscenze-della-strada: 1 } }
    difetti: [legata]
