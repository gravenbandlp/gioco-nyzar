# Le Vie di Sotto, spedizione del passo 5 della quest degli Scuri (fazione.scuri == 4). Ci si entra da
# scuri-le-vie-di-sotto o scuri-le-vie-di-sotto-dopo (passi-1.yaml), con Gaia e Karn; la ritirata porta in Città Bassa.
# Le stanze chiedono fazione.scuri == 4 e vanno in fasce di profondità; una stanza superata non ricompare nella stessa
# visita:
# 0 gli imbocchi (le frecce di gesso, la grata di Via del Salmone, la cantina dei cerchi);
# 1 le gallerie dei contrabbandieri (la galleria delle casse, il passaggio dei cappucci, la cisterna ferma);
# 2 le opere dei Precursori (il condotto dei cristalli morti, la sacca di Marea, il ponte di catena sulla Cicatrice);
# 3 la soglia (la porta murata, le ossa con la mappa).
# Il cuore a 4 è la sala delle nove colonne, con la Salvaguardia ruotata (boss Difficile, oppure spegnerla o passarle
# accanto con una prova Difficile). Chi la supera sceglie la sala nuova del Mercato nel seguito (scuri.sala), e il
# passo si chiude. Chi perde torna in Città Bassa con le ferite, e la spedizione resta aperta.
# Combattere i cappucci del Velo costa rep.velo.
aree:
  - id: scuri-vie-di-sotto
    immagine: ambientazione/mercato-delle-ombre
    nome: Le Vie di Sotto
    sommario: "Sotto la Città Bassa le cantine dei contrabbandieri si attaccano alle cisterne dei Precursori. Da qualche parte c'è una sala grande abbastanza per il Mercato delle Ombre."
    spedizione: { ritorno: citta-bassa, soglia: 4, stanze: 3 }
    testo: |
      Sotto la Città Bassa le cantine si toccano. In due secoli chi aveva
      qualcosa da nascondere ha bucato il muro del vicino, e il vicino ha
      bucato quello dopo, finché le cantine si sono attaccate alle cisterne
      dei Precursori e alle gallerie che nessuno ricorda di avere scavato.
      Si cammina con l'acqua alle caviglie e la testa bassa, in un'aria che
      puzza di muffa.

      Sui muri ci sono frecce di gesso all'altezza del ginocchio, lasciate
      da generazioni di contrabbandieri. Gaia li legge come si legge un
      giornale. Karn va avanti con la lanterna cieca e fischia a mezza voce,
      e ogni tanto smette di colpo per ascoltare.

storylet:
  # ------------------------------------------------------------ 0 · gli imbocchi
  - id: scuri-vds-le-frecce-di-gesso
    immagine: ambientazione/mercato-delle-ombre
    titolo: Le frecce di gesso
    sommario: "Al primo bivio i muri sono coperti di frecce di gesso, e indicano tutte una direzione diversa."
    luogo: Le Vie di Sotto, il primo bivio
    area: scuri-vie-di-sotto
    ripetibile: true
    requisiti: [fazione.scuri == 4, profondita.scuri-vie-di-sotto == 0]
    testo: |
      Il primo bivio è una stanza bassa con tre aperture, e i muri sono
      coperti di frecce di gesso dal pavimento fino all'altezza del petto.
      Ce ne sono di fresche accanto alle vecchie, e qualcuna è stata
      cancellata con la mano e rifatta poco più in là. Gaia si accuccia
      davanti al muro e le guarda a lungo, con la lingua fra i denti.

      {percezione Media} Le frecce vecchie sono più basse di quelle nuove.
      Quelli che le hanno segnate per primi erano più piccoli, o erano
      bambini.

      Karn intanto ha smesso di fischiare. Dall'apertura di destra arriva
      un rumore d'acqua che scorre, e da quella di sinistra niente del
      tutto.
    opzioni:
      - testo: "Leggere le frecce più vecchie"
        descrizione: "Le frecce nuove le fa chiunque. Le vecchie le facevano quelli che sapevano dove andare."
        prova: { attributo: mentale, abilita: [percezione, accademiche], difficolta: Media }
        successo:
          titolo: Le frecce basse
          testo: |
            Segui le frecce più basse e più sbiadite, e ti accorgi che
            puntano sempre verso l'apertura in mezzo, anche quando qualcuno
            ci ha disegnato sopra una freccia nuova nell'altra direzione.
            Gaia ti dà una gomitata d'approvazione. Dopo venti passi la
            galleria di mezzo scende dolcemente, e l'acqua sotto i piedi
            diventa più bassa.
          effetti: { profondita.scuri-vie-di-sotto: 1 }
        fallimento:
          titolo: La freccia nuova
          testo: |
            Scegli la freccia più chiara, che è anche la più nuova, e porta in
            un cunicolo cieco dove qualcuno ha lasciato un secchio rovesciato
            per sedersi. Torni indietro con la schiena piegata e il collo che
            ti fa male. Gaia, al bivio, sta già cancellando quella freccia con
            la manica.

      - testo: "Andare dietro all'acqua che scorre"
        descrizione: "L'acqua che scorre va da qualche parte. Il problema è sapere quanto è profonda."
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Media }
        successo:
          titolo: La corrente
          testo: |
            Entri nell'apertura di destra con l'acqua che sale dalle
            ginocchia fino alla vita, e la corrente ti spinge avanti invece
            di trattenerti. Dopo un tratto la galleria risale e l'acqua ti
            lascia su un gradino di pietra, fradicio fino al collo e un po'
            più avanti degli altri. Karn arriva per ultimo, tenendo la
            lanterna sopra la testa.

            {resistenza Media} L'acqua è così fredda che le gambe smettono di
            lamentarsi. È il momento in cui cominciano a preoccuparti loro.
          effetti: { profondita.scuri-vie-di-sotto: 1 }
        fallimento:
          titolo: Il gradino che non c'è
          testo: |
            Entri nell'apertura di destra, e al terzo passo il fondo sparisce.
            Finisci sotto con tutta la testa, e Karn ti ripesca per il bavero
            prima che la corrente ti porti via. Torni al bivio sputando acqua
            che sa di ferro.
          effetti: { ferite: 0.5 }

      - testo: "Mandare avanti Karn e aspettare il fischio"
        descrizione: "Karn conosce i tetti meglio delle cantine. Ma ci vede al buio, e se trova la strada fischia."
        costo: 2
        esito:
          titolo: Il fischio
          testo: |
            Karn va avanti da solo con la lanterna cieca. Al bivio restate
            al buio ad aspettarlo. Il tempo passa lento, e Gaia a un certo
            punto ti racconta sottovoce una barzelletta sui Raschiatori che
            non fa ridere nessuno dei due. Poi dal fondo della galleria di
            mezzo arriva per due volte la canzone di Karn, ed è il segnale
            per andare.
          effetti: { profondita.scuri-vie-di-sotto: 1 }

  - id: scuri-vds-la-grata-del-salmone
    immagine: ambientazione/citta-bassa
    titolo: La grata di Via del Salmone
    sommario: "Sopra le vostre teste c'è la grata di un tombino, e da lì scende acqua sporca. Il passaggio sotto si sta allagando."
    luogo: Le Vie di Sotto, sotto Via del Salmone
    area: scuri-vie-di-sotto
    ripetibile: true
    requisiti: [fazione.scuri == 4, profondita.scuri-vie-di-sotto == 0]
    testo: |
      La galleria passa sotto la grata di un tombino di Via del Salmone, e
      dalla grata arriva la luce grigia della strada insieme all'acqua dei
      lavatoi. Senti passare un carro sopra la testa, e poi una donna che
      chiama un bambino per nome due volte. Sotto la grata il passaggio
      scende, e l'acqua che entra lo sta riempiendo, una spanna alla volta.

      {atletica Facile} Se ci si muove adesso si passa con l'acqua al petto.
      Fra poco ci vorrà il fiato, e non è detto che basti.

      Gaia guarda in su verso la grata e poi guarda te. Ha già legato la
      candela di sego al cappuccio, dove l'acqua non arriva.
    opzioni:
      - testo: "Passare subito, con l'acqua al petto"
        descrizione: "Una galleria che si allaga si passa finché si può. Dopo non si passa più."
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Media }
        successo:
          titolo: Con l'acqua al petto
          testo: |
            Passi con l'acqua al petto e le braccia alzate, e dall'altra parte
            il passaggio risale su un gradino asciutto. Dietro di te Gaia passa
            aggrappata al bavero di Karn. Sopra la grata la donna sta ancora
            chiamando il bambino, e il bambino non risponde.
          effetti: { profondita.scuri-vie-di-sotto: 1 }
        fallimento:
          titolo: L'acqua al mento
          testo: |
            A metà passaggio l'acqua ti arriva al mento, e ti tocca tornare
            indietro sputando acqua sporca, con gli stivali pieni. Gaia ti aspetta
            sul gradino, e quando arrivi ti strizza la manica della giubba
            senza dire niente, come farebbe una sorella maggiore.
          effetti: { ferite: 0.5 }

      - testo: "Chiudere la grata da sotto"
        descrizione: "La grata ha un fermo arrugginito. Se lo giri, l'acqua passa altrove, ma bisogna arrivarci."
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Media }
        successo:
          titolo: Il fermo
          testo: |
            Sali sulle spalle di Karn e arrivi al fermo della grata, che gira
            con un lamento di ruggine. Sopra la strada qualcuno impreca contro
            il tombino otturato. L'acqua smette di scendere, e il passaggio sotto
            si svuota abbastanza da passare con l'acqua alle ginocchia.
          effetti: { profondita.scuri-vie-di-sotto: 1, sospetto: 0.5 }
        fallimento:
          titolo: La ruggine
          testo: |
            Sali sulle spalle di Karn, e il fermo ti resta in mano, mangiato
            dalla ruggine. Cadi all'indietro nell'acqua con il pezzo di ferro
            stretto nel pugno, e Karn sopra di te ride per la prima volta da
            quando siete scesi.
          effetti: { ferite: 0.5 }

      - testo: "Aspettare che i lavatoi chiudano"
        descrizione: "A sera i lavatoi di Via del Salmone chiudono, e l'acqua smette di scendere. Basta aspettare al buio."
        costo: 2
        esito:
          titolo: I lavatoi chiusi
          testo: |
            Aspettate seduti sul gradino, al buio, finché la luce della grata
            diventa blu e poi nera. Quando le lavandaie se ne vanno l'acqua
            smette di scendere, e il passaggio si svuota piano. Passate con
            l'acqua alle ginocchia, e Gaia si lamenta del freddo per tutto il
            tratto.
          effetti: { profondita.scuri-vie-di-sotto: 1 }

  - id: scuri-vds-la-cantina-dei-cerchi
    immagine: ambientazione/citta-bassa
    titolo: La cantina dei cerchi
    sommario: "Una cantina piena di cerchi di ferro per le botti, e sopra le assi del soffitto qualcuno che dorme."
    luogo: Le Vie di Sotto, sotto la bottega di un bottaio
    area: scuri-vie-di-sotto
    ripetibile: true
    requisiti: [fazione.scuri == 4, profondita.scuri-vie-di-sotto == 0]
    testo: |
      La galleria sbuca nella cantina di un bottaio, fra cataste di doghe e
      cerchi di ferro appesi a dei chiodi lungo il muro. Dall'altra parte
      c'è una porticina bassa che continua verso il basso. Sopra le assi del
      soffitto il bottaio dorme, e lo senti russare a ondate lunghe, con una
      pausa in mezzo che ogni volta ti ferma un piede a mezz'aria.

      {furtivita Facile} Le assi del pavimento scricchiolano lungo il muro,
      dove passano tutti. In mezzo alla stanza, fra le doghe, sono più
      solide.

      {origine figlio-della-citta-bassa} I cerchi di ferro da ragazzino li
      rubavi in una cantina come questa, per farli correre nella polvere con
      un bastone. Il bottaio di allora russava uguale.
    opzioni:
      - testo: "Attraversare la cantina in mezzo alle doghe"
        descrizione: "Un passo alla volta, fra le cataste, mentre il bottaio russa."
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Media }
        successo:
          titolo: Fra le doghe
          testo: |
            Attraversi la cantina fra le cataste di doghe, posando i piedi
            quando il bottaio inspira. Alla porticina ti volti, e Gaia sta
            facendo lo stesso dietro di te, con le braccia larghe per
            l'equilibrio. Il russare non si interrompe mai.
          effetti: { profondita.scuri-vie-di-sotto: 1 }
        fallimento:
          titolo: Il cerchio
          testo: |
            Urti con la spalla un cerchio di ferro, che rotola per tutta la
            cantina con un rumore da campana. Sopra le assi il russare si
            ferma. Restate immobili al buio finché non riprende, e poi
            tornate indietro nella galleria per prudenza.
          effetti: { sospetto: 0.5 }

      - testo: "Cercare un'altra porta fra le cataste"
        descrizione: "Una cantina di contrabbandieri ha sempre due uscite. Quella che si vede, e l'altra."
        prova: { attributo: mentale, abilita: [percezione, tecnologia], difficolta: Media }
        successo:
          titolo: La botte vuota
          testo: |
            In fondo alla cantina c'è una botte grande senza tappo, e dentro la
            botte non c'è vino. C'è una scala a pioli che scende. Ci passate
            uno alla volta, e Karn rimette a posto il coperchio sopra di voi.
            In fondo trovi una scheggia di metallo precuriano usata come
            fermaporta.
          effetti: { profondita.scuri-vie-di-sotto: 1, reliquie.scheggia: 1 }
        fallimento:
          titolo: Il vino
          testo: |
            Apri una botte che sembrava vuota, ed era piena. Il vino ti bagna
            fino alle ginocchia e l'odore riempie la cantina. Sopra le assi il
            bottaio smette di russare per annusare, e voi tornate indietro di
            corsa.

      - testo: "Rubare un cerchio, come allora"
        descrizione: "Un cerchio di ferro torna sempre utile, e il bottaio di questa cantina russa come quello di allora."
        quando: [origine.figlio-della-citta-bassa >= 1]
        esito:
          titolo: Come allora
          testo: |
            Stacchi un cerchio dal chiodo con due dita, come ti avevano
            insegnato i ragazzi più grandi, e lo porti fino alla porticina
            senza farlo suonare. Dall'altra parte lo appendi a un chiodo, per
            il prossimo ragazzino. Gaia ti guarda fare e capisce da dove vieni,
            e da quel momento ti cede il passo nei punti stretti.
          effetti: { profondita.scuri-vie-di-sotto: 1 }

  # ------------------------------------------------------------ 1 · le gallerie dei contrabbandieri
  - id: scuri-vds-la-galleria-delle-casse
    immagine: ambientazione/mercato-delle-ombre
    titolo: La galleria delle casse
    sommario: "Una galleria piena di casse impilate, e due contrabbandieri senza banda che non hanno voglia di cederti il passo."
    luogo: Le Vie di Sotto, la galleria delle casse
    area: scuri-vie-di-sotto
    ripetibile: true
    requisiti: [fazione.scuri == 4, profondita.scuri-vie-di-sotto == 1]
    testo: |
      La galleria è stretta e piena di casse impilate fino al soffitto, con
      un passaggio in mezzo largo quanto un uomo di traverso. In fondo,
      seduti sulle casse, due contrabbandieri con la lanterna cieca appesa
      al collo dividono una salsiccia con un coltello da cordaio. Quando vi
      vedono smettono di masticare.

      «Questa roba non è degli Scuri» dice il più vecchio, «e il passaggio
      nemmeno.» Ha un orecchio solo, e gira la testa per sentirvi meglio.

      {rissa Media} Il più giovane tiene il coltello nella sinistra e la
      salsiccia nella destra. Se lo devi stendere, è la destra che gli
      serve.

      {conoscenze-della-strada Media} Contrabbandieri senza banda. Nessuno
      li protegge e nessuno li vendica, e lo sanno. Hanno più paura di voi
      di quanta ne mostrino.
    opzioni:
      - testo: "Farti largo"
        descrizione: "Due contrabbandieri con un coltello da cordaio. Se ne vanno alla prima ferita, se li lasci andare."
        combattimento: scuri-la-galleria-delle-casse
        vittoria:
          titolo: Le casse
          testo: |
            Il più giovane scappa per primo, lasciando la salsiccia. Il
            vecchio con un orecchio solo si arrende con le mani alzate, e
            quando gli dai la schiena è già sparito fra le casse. In una cassa
            aperta trovi frammenti di cristallo e un paio di schegge, e Gaia ti
            dice di prenderli, perché tanto non sono di nessuno.
          effetti: { profondita.scuri-vie-di-sotto: 1, cristalli.frammento-esausto: 2, reliquie.scheggia: 1 }
        sconfitta:
          titolo: Il coltello da cordaio
          testo: |
            Il coltello da cordaio ti prende sul braccio, e il vecchio ti
            spinge indietro fra le casse finché non sei di nuovo all'imbocco.
            Karn ti fascia il braccio con la sua sciarpa, che puzza di fumo, e
            vi tocca cercare un'altra strada.

      - testo: "Trattare il passaggio"
        descrizione: "Due contrabbandieri senza banda vivono di passaggi. Si può pagare il loro, o promettere qualcosa."
        prova: { attributo: sociale, abilita: [persuasione, conoscenze-della-strada], difficolta: Media }
        successo:
          titolo: La salsiccia
          testo: |
            Ti siedi su una cassa davanti a loro e gli spieghi che la sala nuova
            del Mercato avrà bisogno di qualcuno che porti le casse, e che chi
            vi lascia passare adesso porterà le casse dopo. Il vecchio ci pensa
            girando la testa. Poi ti offre un pezzo di salsiccia, che è il
            modo di dire di sì in questa galleria.
          effetti: { profondita.scuri-vie-di-sotto: 1 }
        fallimento:
          titolo: L'orecchio solo
          testo: |
            Parli al vecchio dalla parte dell'orecchio che non ha. Lui ti
            lascia finire, poi ti chiede di ripetere tutto dall'altra parte, e
            alla seconda volta il discorso non funziona più. Vi fanno
            indietreggiare fino all'imbocco con il coltello.

      - testo: "Pagare il passaggio"
        descrizione: "In una galleria piena di casse il modo più rapido di passare è diventare un cliente."
        requisiti: [monete >= 6]
        esito:
          titolo: La tariffa
          testo: |
            Posi le monete sulla cassa più vicina, e il vecchio le conta con il
            pollice senza alzarsi. «Tariffa di passaggio» dice, come se fosse
            scritta da qualche parte. Il più giovane si sposta di lato con la
            salsiccia in mano, e passate uno alla volta.
          effetti: { profondita.scuri-vie-di-sotto: 1, monete: -6 }

  - id: scuri-vds-il-passaggio-dei-cappucci
    immagine: fazioni/confraternita-del-velo
    titolo: Il passaggio dei cappucci
    sommario: "Due uomini incappucciati del Velo stanno di guardia a un arco di pietra, con i bastoni ferrati appoggiati al muro."
    luogo: Le Vie di Sotto, un arco di pietra
    area: scuri-vie-di-sotto
    ripetibile: true
    requisiti: [fazione.scuri == 4, profondita.scuri-vie-di-sotto == 1]
    testo: |
      Sotto un arco di pietra più vecchio delle gallerie intorno ci sono due
      uomini con il cappuccio alzato e il bastone ferrato appoggiato al
      muro. Non giocano a dadi e non parlano. Stanno in piedi ai due lati
      dell'arco, e sotto i cappucci non si vede la faccia. Sono i cappucci
      del Velo, quelli che tengono le cinque porte della Confraternita al
      Mercato.

      Gaia si ferma di colpo e ti tira indietro per la manica. «Con loro si
      tratta, o si passa senza farsi vedere» dice a voce bassissima. «Se li
      tocchi, lo sanno in Cattedrale prima che tu sia tornato su.»

      {armi-da-mischia Media} I bastoni ferrati sono più lunghi di qualunque
      lama tu abbia. Se arrivi a portata di mano, però, non servono più.

      {origine accolito-del-velo} Il nodo con cui hanno stretto il
      cappuccio sotto il mento è quello che si insegna ai novizi il primo
      inverno. Uno dei due lo ha fatto storto, come lo facevi tu.
    opzioni:
      - testo: "Chiedere il passo con le buone maniere"
        descrizione: "Il Velo rispetta la forma. Un saluto giusto e una richiesta giusta aprono più porte di un coltello."
        prova: { attributo: sociale, abilita: [galateo, persuasione], difficolta: Media }
        successo:
          titolo: Il saluto
          testo: |
            Ti avvicini con le mani in vista e chini la testa davanti all'arco,
            e chiedi il passo per gli Scuri che aprono la strada al Mercato. Il
            cappuccio di destra ti guarda a lungo da sotto la stoffa. Poi si
            sposta di un passo, con il bastone in mano. Mentre passi ti dice
            che il Velo si ricorderà chi ha chiesto.
          effetti: { profondita.scuri-vie-di-sotto: 1 }
        fallimento:
          titolo: Il bastone
          testo: |
            Chiedi il passo, e il cappuccio di sinistra abbassa il bastone
            davanti a te all'altezza del petto, in silenzio, ed è tutta la
            risposta che avrai. Tornate indietro, e Gaia per un pezzo
            cammina più vicina a te del solito.

      - testo: "Passare dal condotto di lato, senza farti vedere"
        descrizione: "Accanto all'arco c'è un condotto basso. I cappucci guardano la galleria, non il muro."
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Media }
        successo:
          titolo: Il condotto
          testo: |
            Ti infili nel condotto basso accanto all'arco e strisci sui gomiti,
            con il naso a una spanna dalla pietra. Passi a due passi dai
            cappucci, e senti uno dei due sospirare di noia. Dall'altra parte
            aspetti Gaia e Karn con il cuore che batte forte.
          effetti: { profondita.scuri-vie-di-sotto: 1 }
        fallimento:
          titolo: Il gomito
          testo: |
            Nel condotto il gomito ti scivola su un sasso e il rumore rimbomba
            nella pietra. Quando sbuchi dall'altra parte ti aspettano tutti e
            due, con i bastoni in mano. Ti riaccompagnano all'imbocco del
            condotto senza toccarti e senza dire una parola.
          effetti: { sospetto: 0.5 }

      - testo: "Passare con la forza"
        descrizione: "Due uomini con il bastone non fermano tre persone decise. Il Velo, però, se lo ricorderà."
        combattimento: scuri-i-cappucci
        vittoria:
          titolo: I cappucci a terra
          testo: |
            Il primo cappuccio va giù quando gli arrivi sotto il bastone. Il
            secondo si ritira nel buio della galleria senza voltarsi, e non lo
            sentite correre. Passate l'arco. Gaia dice che a quest'ora in
            Cattedrale qualcuno sta già scrivendo il tuo nome.
          effetti: { profondita.scuri-vie-di-sotto: 1, rep.velo: -1 }
        sconfitta:
          titolo: Il bastone ferrato
          testo: |
            Il bastone ferrato ti prende dietro il ginocchio e poi sulla
            spalla, e ti ritrovi seduto nell'acqua. I cappucci non ti finiscono.
            Aspettano che tu ti alzi e ti indicano la galleria da cui sei
            venuto.
          effetti: { rep.velo: -1 }

      - testo: "Rifare il nodo al cappuccio di quello di destra"
        descrizione: "Il nodo storto è quello dei novizi. Un accolito sa come si corregge, e un cappuccio del Velo sa chi glielo ha insegnato."
        quando: [origine.accolito-del-velo >= 1]
        esito:
          titolo: Il nodo dei novizi
          testo: |
            Ti avvicini al cappuccio di destra e gli rifai il nodo sotto il
            mento senza chiedere il permesso, come si fa in dormitorio con i
            più piccoli. Lui resta immobile. Quando hai finito si sposta di un
            passo e ti lascia passare, e mentre passi lo senti toccarsi il nodo
            con due dita.
          effetti: { profondita.scuri-vie-di-sotto: 1 }

  - id: scuri-vds-la-cisterna-ferma
    immagine: ambientazione/rovine-dei-precursori
    titolo: La cisterna ferma
    sommario: "Una cisterna dei Precursori piena d'acqua nera e ferma. Dall'altra parte la galleria continua."
    luogo: Le Vie di Sotto, una cisterna dei Precursori
    area: scuri-vie-di-sotto
    ripetibile: true
    requisiti: [fazione.scuri == 4, profondita.scuri-vie-di-sotto == 1]
    testo: |
      La galleria finisce sul bordo di una cisterna dei Precursori liscia
      come l'interno di una tazza, e piena d'acqua nera che non si muove.
      Dall'altra parte, a trenta bracciate, la galleria continua da
      un'apertura quadrata. Lungo la parete corre una cornice larga un
      piede, viscida di muffa.

      {atletica Media} Trenta bracciate si fanno. L'acqua però è ferma da
      anni, e quella ferma da anni è più fredda di quanto sembri.

      Karn getta un sasso nell'acqua, e il sasso affonda senza un suono, come
      se l'acqua se lo fosse preso.
    opzioni:
      - testo: "Attraversare a nuoto"
        descrizione: "Trenta bracciate nell'acqua nera. Dall'altra parte c'è un gradino per uscire."
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Media }
        successo:
          titolo: Trenta bracciate
          testo: |
            Nuoti con la candela legata alla testa e gli occhi sull'apertura
            quadrata. L'acqua ti stringe il petto come una cinghia, e alla
            ventesima bracciata non senti più le dita. Esci dal gradino
            dall'altra parte e ti tiri su con le braccia, e poi tiri su Gaia,
            che ha nuotato in silenzio dietro di te.
          effetti: { profondita.scuri-vie-di-sotto: 1 }
        fallimento:
          titolo: Il freddo
          testo: |
            A metà cisterna il freddo ti prende le gambe, e devi tornare
            indietro con le braccia sole. Karn ti tira fuori dall'acqua per il
            colletto. Tremi così forte che ti battono i denti, e Gaia ti
            strofina le braccia con le sue mani piccole e ruvide.
          effetti: { ferite: 0.5 }

      - testo: "Fare il giro sulla cornice"
        descrizione: "La cornice è larga un piede ed è viscida. Ci si passa con la schiena al muro, se non si guarda giù."
        prova: { attributo: fisico, abilita: [acrobazia, furtivita], difficolta: Media }
        successo:
          titolo: La cornice
          testo: |
            Fai il giro della cisterna con la schiena al muro e i talloni sulla
            cornice, un passo laterale alla volta. Sotto di te l'acqua nera
            riflette la candela, e cerchi di non guardarla. Arrivi all'apertura
            quadrata con le mani sporche di muffa fino ai polsi.
          effetti: { profondita.scuri-vie-di-sotto: 1 }
        fallimento:
          titolo: La muffa
          testo: |
            A metà cornice il piede ti scivola sulla muffa, e finisci nell'acqua
            nera con un tonfo che rimbomba in tutta la cisterna. Torni a riva a
            nuoto, con il fiato rotto dal freddo.
          effetti: { ferite: 0.5 }

      - testo: "Cercare un'altra strada intorno"
        descrizione: "Una cisterna ha sempre un canale di scolo. Trovarlo richiede tempo, ma è asciutto."
        costo: 2
        esito:
          titolo: Il canale di scolo
          testo: |
            Tornate indietro e cercate un canale di scolo, e lo trovate dopo
            un'ora. È basso e asciutto, pieno di nidi di topo. Lo percorrete
            a carponi. Sbucate dall'altra parte della cisterna con le
            ginocchia scorticate e la polvere nei capelli, e Gaia
            starnutisce tre volte.
          effetti: { profondita.scuri-vie-di-sotto: 1 }

  # ------------------------------------------------------------ 2 · le opere dei Precursori
  - id: scuri-vds-il-condotto-dei-cristalli
    immagine: ambientazione/cristalli-conduttori
    titolo: Il condotto dei cristalli morti
    sommario: "Un condotto dei Precursori foderato di cristalli spenti. Un portello chiude il passaggio, e si apre soltanto se il condotto si accende."
    luogo: Le Vie di Sotto, un condotto dei Precursori
    area: scuri-vie-di-sotto
    ripetibile: true
    requisiti: [fazione.scuri == 4, profondita.scuri-vie-di-sotto == 2]
    testo: |
      Il condotto è rotondo, alto quanto un uomo, e foderato di cristalli
      opachi incastrati nella pietra come denti in una gengiva. In fondo c'è
      un portello di metallo con una ruota al centro, e accanto una fila di
      sette cristalli più grandi, tutti spenti tranne il primo, che manda una
      luce verde debolissima.

      {tecnologia Media} I sette cristalli sono una serratura. Il primo è
      acceso perché qualcuno ha già provato, e si è fermato lì.

      {magia Facile} Nei cristalli spenti c'è ancora un filo di Mana, come
      la brace sotto la cenere, e basterebbe soffiarci sopra per
      riaccenderlo.
    opzioni:
      - testo: "Accendere i cristalli nell'ordine giusto"
        descrizione: "Sette cristalli e un ordine. Chi conosce i congegni dei Precursori sa da quale si comincia."
        prova: { attributo: mentale, abilita: [tecnologia, magia], difficolta: Media }
        successo:
          titolo: La ruota
          testo: |
            Tocchi i cristalli seguendo le loro facce, dalla più piccola
            alla più grande, invece dell'ordine della fila. Si accendono uno
            dopo l'altro, e al settimo la ruota del portello gira da sola
            con un sospiro d'aria vecchia. Uno dei cristalli piccoli si
            stacca dalla parete, ancora tiepido.
          effetti: { profondita.scuri-vie-di-sotto: 1, cristalli.cristallo-sterile: 1 }
        fallimento:
          titolo: La scossa
          testo: |
            Tocchi i cristalli nell'ordine della fila, e al terzo una scossa ti
            sale fino alla spalla. Tutti e sette si spengono, compreso il
            primo. Gaia ti guarda la mano, che trema da sola, e poi guarda il
            portello chiuso.
          effetti: { ferite: 0.5, tormento: 0.5 }

      - testo: "Forzare la ruota a mano"
        descrizione: "Il portello è vecchio, e le cose vecchie a volte cedono alla forza."
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Difficile }
        successo:
          titolo: La forza
          testo: |
            Tu e Karn vi appendete alla ruota con tutto il peso, e dopo un
            lungo momento la ruota cede con un rumore di ossa. Il portello si
            apre di una spanna, e poi di un'altra. Passate di lato, con i palmi
            rossi e la schiena che vi ricorderà questo portello per giorni.
          effetti: { profondita.scuri-vie-di-sotto: 1, ferite: 0.5 }
        fallimento:
          titolo: La ruota ferma
          testo: |
            Vi appendete alla ruota con tutto il peso, e la ruota non si muove
            di un dito. Karn smette di fischiare per bestemmiare. Vi sedete per
            terra a soffiarvi sui palmi, che bruciano.
          effetti: { ferite: 0.5 }

      - testo: "Tornare indietro e trovare un altro condotto"
        descrizione: "Le opere dei Precursori hanno sempre più di un condotto. Ci vuole tempo, e la schiena."
        costo: 2
        esito:
          titolo: Il condotto di servizio
          testo: |
            Tornate indietro e cercate finché trovate un condotto più piccolo,
            quello che i Precursori usavano per le riparazioni, con le
            maniglie di metallo ancora fissate alla pietra. Ci passate a
            quattro zampe per un tempo che sembra lunghissimo, e sbucate dopo il
            portello, coperti di polvere bianca.
          effetti: { profondita.scuri-vie-di-sotto: 1 }

  - id: scuri-vds-la-sacca-di-marea
    immagine: ambientazione/marea-grigia
    titolo: La sacca di Marea
    sommario: "Una nebbia grigia ristagna in una galleria bassa. È una sacca di Marea, e la strada passa in mezzo."
    luogo: Le Vie di Sotto, una galleria bassa
    area: scuri-vie-di-sotto
    ripetibile: true
    requisiti: [fazione.scuri == 4, profondita.scuri-vie-di-sotto == 2]
    testo: |
      In una galleria bassa ristagna una nebbia grigia che non si muove con
      l'aria. Arriva all'altezza del petto, e sopra la nebbia la candela
      brucia dritta, mentre dentro la fiamma si piega verso il basso. È una
      sacca di Marea Grigia, piccola, risalita da chissà quale crepa.

      {resilienza Media} Dentro la nebbia ci sono voci, o qualcosa che le
      somiglia. Se ascolti troppo, cominciano a dire il tuo nome.

      Gaia si tira il cappuccio blu fin sotto il mento e si ferma. «Io lì
      dentro non ci passo» dice. «Se ci passi tu, io faccio il giro, e ci
      vediamo dall'altra parte.»
    opzioni:
      - testo: "Attraversare la nebbia senza respirare"
        descrizione: "La sacca è lunga una ventina di passi. Con la bocca chiusa e la testa ferma si passa."
        prova: { attributo: mentale, abilita: [resilienza, medicina], difficolta: Media }
        successo:
          titolo: Venti passi
          testo: |
            Ti stringi il naso fra due dita e cammini dentro la nebbia contando i passi. Le
            voci arrivano al decimo e se ne vanno al quindicesimo, e non hai
            capito niente di quello che dicevano. Al ventesimo passo sei fuori,
            con i polmoni che bruciano e un sapore di ferro in bocca.
          effetti: { profondita.scuri-vie-di-sotto: 1, contaminazione: 0.5 }
        fallimento:
          titolo: Il tuo nome
          testo: |
            Al decimo passo una voce dentro la nebbia dice il tuo nome, e ti
            fermi ad ascoltare. Respiri. Karn ti trascina fuori per il braccio,
            e ti ritrovi seduto sul bordo della sacca con le mani grigie fino
            ai polsi e la testa che gira.
          effetti: { contaminazione: 1, tormento: 0.5 }

      - testo: "Fare il giro con Gaia"
        descrizione: "Gaia conosce un passaggio intorno. È lungo e stretto, e ci vuole il tempo che ci vuole."
        costo: 2
        esito:
          titolo: Il giro
          testo: |
            Gaia ti porta per un passaggio che gira intorno alla sacca, così
            stretto che a un certo punto devi toglierti la giubba e spingerla
            avanti. Lei passa senza toglierla. Sbucate dall'altra parte dopo un
            tempo lunghissimo, e la nebbia grigia è là, alle vostre spalle,
            ferma come prima.
          effetti: { profondita.scuri-vie-di-sotto: 1 }

      - testo: "Leggere la sacca con il Mana"
        descrizione: "All'Accademia insegnano che una sacca di Marea ha delle correnti, come l'acqua. Dove la corrente è debole si passa."
        quando: [origine.allievo-di-torvessa >= 1]
        prova: { attributo: mentale, abilita: magia, difficolta: Facile }
        successo:
          titolo: La corrente debole
          testo: |
            Chiudi gli occhi e senti la sacca come ti hanno insegnato, una
            corrente fredda che gira su sé stessa. Sul lato sinistro la
            corrente è più debole, e ci passi rasente al muro con la manica
            premuta sulla bocca. Le voci restano lontane. Quando esci ti accorgi di
            avere preso appunti a mente, come in aula.
          effetti: { profondita.scuri-vie-di-sotto: 1, contaminazione: 0.5 }
        fallimento:
          titolo: La corrente forte
          testo: |
            Senti la corrente, e la senti al contrario. Passi dal lato dove è
            più forte, e la nebbia ti si attacca addosso come una ragnatela
            bagnata. Karn ti tira fuori per il braccio, e hai le mani grigie
            fino ai polsi.
          effetti: { contaminazione: 1, tormento: 0.5 }

  - id: scuri-vds-il-ponte-di-catena
    immagine: ambientazione/cicatrice-del-mondo
    titolo: Il ponte di catena
    sommario: "Una galleria si affaccia sul vuoto della Cicatrice, e dall'altra parte una catena tesa porta all'imbocco successivo."
    luogo: Le Vie di Sotto, sopra la Cicatrice
    area: scuri-vie-di-sotto
    ripetibile: true
    requisiti: [fazione.scuri == 4, profondita.scuri-vie-di-sotto == 2]
    testo: |
      La galleria finisce di colpo sul bordo dell'altopiano, e davanti a te
      c'è il vuoto della Cicatrice, con il vento che sale dal basso e le luci
      dei Ponti Sospesi lontane, a destra. A una ventina di passi, sulla
      parete di fronte, si apre l'imbocco della galleria successiva. In mezzo
      c'è una catena tesa, e sopra la catena una corda più sottile per le
      mani.

      {acrobazia Media} La catena oscilla poco, perché è pesante. È la corda
      sopra che si muove, e la corda è quella che ti tradisce.

      Karn passa per primo, con la lanterna appesa al collo e le braccia
      larghe, fischiando la sua canzone a tempo con i passi.
    opzioni:
      - testo: "Passare sulla catena come Karn"
        descrizione: "Piedi sulla catena, mani sulla corda, occhi sull'imbocco. Il vento fa il resto."
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Media }
        successo:
          titolo: Dall'altra parte
          testo: |
            Passi sulla catena con i piedi di traverso e le mani leggere sulla
            corda, senza fidarti troppo. A metà il vento ti spinge di lato, e tu
            pieghi le ginocchia e aspetti che passi. Quando arrivi all'imbocco
            Karn ti tende la mano e ti tira dentro, e la sua canzone riprende
            dalla nota dove l'aveva lasciata.
          effetti: { profondita.scuri-vie-di-sotto: 1 }
        fallimento:
          titolo: La corda
          testo: |
            A metà ti affidi troppo alla corda, che scivola via sotto le
            dita, e ti ritrovi appeso alla catena con le braccia e le gambe
            a penzoloni sul vuoto. Torni indietro a forza di braccia, un
            anello alla volta, e quando tocchi il bordo ti siedi e non
            riesci a parlare per un po'.
          effetti: { ferite: 0.5, tormento: 0.5 }

      - testo: "Legarti alla catena con la cintura"
        descrizione: "Una cintura passata intorno alla catena rallenta il passo, e se cadi ti tiene appeso."
        costo: 2
        esito:
          titolo: La cintura
          testo: |
            Passi la cintura intorno alla catena e la stringi alla giubba, e
            attraversi a forza di braccia, spingendo la cintura avanti a ogni
            passo. Ci metti un tempo infinito. Due volte il vento ti fa
            oscillare sul vuoto, e due volte la cintura tiene. Arrivi
            dall'altra parte con le braccia che non senti più.
          effetti: { profondita.scuri-vie-di-sotto: 1, tormento: 0.5 }

      - testo: "Camminare sulla catena come sulle piattaforme"
        descrizione: "Sulle piattaforme della Cicatrice si cammina su catene come questa tutti i giorni, con il vento in faccia."
        quando: [origine.apprendista-raschiatore >= 1]
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Facile }
        successo:
          titolo: Come sulle piattaforme
          testo: |
            Passi sulla catena come facevi sulle piattaforme, guardando la
            parete di fronte e mai il vuoto, con il peso sui talloni. Arrivi
            all'imbocco prima di Karn, che ti guarda arrivare con la canzone
            ferma in bocca. Poi ti torni a voltare per aiutare Gaia.
          effetti: { profondita.scuri-vie-di-sotto: 1 }
        fallimento:
          titolo: Il vento diverso
          testo: |
            Il vento qui sale dal basso invece di soffiare di lato come
            sulle piattaforme, e a metà ti strappa i piedi dalla catena.
            Resti appeso con le mani e torni indietro a forza di braccia,
            con la vergogna che brucia più dei palmi.
          effetti: { ferite: 0.5, tormento: 0.5 }

  # ------------------------------------------------------------ 3 · la soglia
  - id: scuri-vds-la-porta-murata
    immagine: ambientazione/rovine-dei-precursori
    titolo: La porta murata
    sommario: "In fondo a una galleria c'è una porta dei Precursori chiusa con mattoni moderni. Qualcuno l'ha murata, e non tanto tempo fa."
    luogo: Le Vie di Sotto, la porta murata
    area: scuri-vie-di-sotto
    ripetibile: true
    requisiti: [fazione.scuri == 4, profondita.scuri-vie-di-sotto == 3]
    testo: |
      In fondo alla galleria c'è un'alta porta dei Precursori con una
      cornice di metallo che non ha preso la ruggine. Qualcuno l'ha chiusa
      con un muro di mattoni moderni, tirato su in fretta e senza intonaco.
      Fra un mattone e l'altro filtra un'aria più calda, con l'odore
      dell'olio vecchio.

      {tecnologia Media} Qualcuno ha murato la porta senza chiuderla. Dietro
      i mattoni il congegno della cornice è ancora acceso, e aspetta che
      qualcuno la apra.

      {armi-da-mischia Facile} Quei mattoni li ha messi qualcuno con fretta e
      poca calce. Con il pomo di un'arma e un po' di pazienza vengono via.

      Gaia appoggia l'orecchio ai mattoni e resta in ascolto. Dall'altra
      parte arriva un ronzio basso e regolare, come quello di un alveare.
    opzioni:
      - testo: "Togliere i mattoni uno alla volta"
        descrizione: "Poca calce e molta fretta. Si tolgono piano, perché il ronzio dall'altra parte non cambi."
        prova: { attributo: fisico, abilita: [atletica, furtivita], difficolta: Media }
        successo:
          titolo: I mattoni
          testo: |
            Togli i mattoni uno per volta, facendo leva con il pomo, e li posi
            per terra senza rumore. Quando il buco è abbastanza largo la porta
            dei Precursori si apre da sola, scorrendo nella parete. Il ronzio
            si fa più forte. Gaia ti guarda e si porta un dito alle labbra.
          effetti: { profondita.scuri-vie-di-sotto: 1 }
        fallimento:
          titolo: Il muro che cade
          testo: |
            Togli un mattone, e il muro intero si siede su sé stesso con un
            rumore di frana. Il ronzio dall'altra parte cambia, e poi torna
            uguale. Aspettate a lungo, schiacciati contro la parete, prima di
            osare muovervi, e la polvere ti è entrata dappertutto.
          effetti: { ferite: 0.5, sospetto: 0.5 }

      - testo: "Trovare l'apertura del congegno"
        descrizione: "Una porta dei Precursori ha sempre un modo di aprirsi. Basta trovare dove la cornice è più calda."
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Media }
        successo:
          titolo: La cornice calda
          testo: |
            Passi le dita sulla cornice di metallo e trovi un punto più caldo,
            all'altezza della spalla, dove i mattoni non arrivano. Lo premi, e
            la porta scorre nella parete portandosi dietro il muro, che crolla
            dall'altra parte in un mucchio ordinato. Il ronzio si fa più forte.
          effetti: { profondita.scuri-vie-di-sotto: 1, reliquie.frammento-inciso: 1 }
        fallimento:
          titolo: La cornice fredda
          testo: |
            Passi le dita sulla cornice, e la cornice è fredda dappertutto. Ci
            perdi un'ora, finché Karn non ti fa notare che il congegno, se
            c'era, è dietro i mattoni come il resto.

      - testo: "Mandare Karn a cercare un'altra entrata"
        descrizione: "Karn conosce i tetti, e i tetti delle gallerie sono come i tetti delle case. C'è sempre un buco."
        costo: 2
        esito:
          titolo: Il buco nel soffitto
          testo: |
            Karn sale lungo la parete come sui tetti della Città Bassa, e trova
            un buco nel soffitto della galleria che dà dall'altra parte del
            muro. Vi tira su uno alla volta con la cintura. Scendete dall'altra
            parte in una stanza buia, dove il ronzio è più forte.
          effetti: { profondita.scuri-vie-di-sotto: 1 }

  - id: scuri-vds-le-ossa-con-la-mappa
    immagine: ambientazione/rovine-dei-precursori
    titolo: Le ossa con la mappa
    sommario: "In una nicchia ci sono le ossa di tre contrabbandieri, e uno ha ancora in mano una mappa disegnata sulla pelle di un tamburo."
    luogo: Le Vie di Sotto, una nicchia
    area: scuri-vie-di-sotto
    ripetibile: true
    requisiti: [fazione.scuri == 4, profondita.scuri-vie-di-sotto == 3]
    testo: |
      In una nicchia scavata nel muro ci sono le ossa di tre uomini, seduti
      uno accanto all'altro come se aspettassero il loro turno. Hanno ancora
      gli stivali e le cinture, e uno stringe fra le dita una pelle di tamburo
      arrotolata, con sopra una mappa disegnata a carbone. Accanto a loro
      c'è una lanterna con il vetro rotto e una borraccia vuota.

      {medicina Media} Le ferite non c'entrano. Le ossa sono intere, e sono
      seduti composti. Sono morti di fame, o di freddo, aspettando qualcuno
      che non è venuto.

      Gaia si fa il segno che in Città Bassa si fa davanti ai morti, due
      dita sulla bocca, e non tocca niente.
    opzioni:
      - testo: "Leggere la mappa senza toglierla dalle sue mani"
        descrizione: "La mappa è vecchia e il carbone è sbiadito. Chi sa leggere le vecchie carte ci trova una sala."
        prova: { attributo: mentale, abilita: [accademiche, percezione], difficolta: Media }
        successo:
          titolo: La sala grande
          testo: |
            Srotoli la pelle di tamburo senza staccarla dalle dita del morto,
            e la leggi alla luce della candela. È la mappa delle Vie di Sotto
            di cent'anni fa, e in basso c'è una sala segnata con nove puntini
            in cerchio. Accanto, con una mano diversa, qualcuno ha scritto *non
            svegliare*. Riarrotoli la mappa e la rimetti dov'era.
          effetti: { profondita.scuri-vie-di-sotto: 1 }
        fallimento:
          titolo: Il carbone
          testo: |
            Srotoli la pelle, e il carbone si sfarina sotto le dita. Della
            mappa restano poche righe e una macchia nera. Gaia ti guarda con
            gli occhi stretti, e tu rimetti la pelle fra le dita del morto,
            chiedendo scusa a mezza voce.

      - testo: "Frugare nelle cinture dei morti"
        descrizione: "I contrabbandieri portavano tutto con sé. Ai morti non serve più."
        prova: { attributo: mentale, abilita: [percezione, resilienza], difficolta: Facile }
        successo:
          titolo: Le cinture
          testo: |
            Nelle cinture trovi un frammento inciso dei Precursori, avvolto in
            un pezzo di stoffa, e due schegge. In una tasca c'è un biglietto
            che nessuno potrà più leggere. Gaia guarda da un'altra parte mentre
            frughi. Quando hai finito, ti dice di metterti in cammino.
          effetti: { profondita.scuri-vie-di-sotto: 1, reliquie.frammento-inciso: 1, reliquie.scheggia: 2 }
        fallimento:
          titolo: Le dita
          testo: |
            Mentre frughi una cintura, le dita del morto si staccano e cadono
            nel tuo palmo, una per una, come castagne secche. Le rimetti a
            posto con le mani che tremano, e per il resto della galleria non
            riesci a smettere di pulirti le mani sulla giubba.
          effetti: { tormento: 0.5 }

      - testo: "Lasciarli in pace e andare avanti"
        descrizione: "Tre uomini che aspettano qualcuno. Si può passare senza disturbarli, e cercare la strada da soli."
        costo: 2
        esito:
          titolo: Il segno davanti ai morti
          testo: |
            Fai anche tu il segno di Gaia, due dita sulla bocca, e passate
            oltre senza toccare niente. Cercate la strada da soli per un tempo
            lunghissimo, e alla fine la trovate seguendo il ronzio. Gaia dice
            che i morti, quando li lasci in pace, ti mandano dove devi andare.
          effetti: { profondita.scuri-vie-di-sotto: 1 }

  # ------------------------------------------------------------ 4 · il cuore: la sala delle nove colonne
  - id: scuri-vds-la-sala-delle-nove-colonne
    immagine: bestiario/salvaguardia-precursori
    titolo: La sala delle nove colonne
    sommario: "Una sala grande come una piazza, nove colonne in cerchio, e in mezzo una macchina dei Precursori che dorme in piedi."
    luogo: Le Vie di Sotto, la sala delle nove colonne
    area: scuri-vie-di-sotto
    requisiti: [fazione.scuri == 4, profondita.scuri-vie-di-sotto >= 4]
    testo: |
      La sala è grande come una piazza della Città Bassa, con il soffitto a
      volta perso nel buio e nove colonne di pietra liscia disposte in
      cerchio. Il ronzio viene da qui. In mezzo al cerchio c'è una macchina
      dei Precursori alta due volte un uomo, con la testa girata all'indietro
      e le braccia montate al contrario, i gomiti verso l'esterno. Sta in
      piedi e non si muove, e il ronzio esce dal suo petto.

      Ai lati della sala si aprono due passaggi. Uno porta a una sala
      laterale asciutta, con il pavimento piano, adatta ai banchi. L'altro
      porta a una stanza che finisce sul vuoto della Cicatrice, con una
      scala di corda arrotolata sul bordo, buona per chi deve scappare.

      {tecnologia Difficile} Sul fianco della macchina c'è un pannello con
      tre incavi. È il congegno di controllo, e chi sa dove mettere le dita
      la spegne prima che si svegli.

      {resilienza Media} Il ronzio ti entra nei denti. Se resti qui abbastanza
      a lungo, cominci a ronzare anche tu.

      Gaia si è fermata sull'ultimo gradino. «È lei che teneva lontano tutti»
      sussurra. «Per questo la sala è vuota.» Karn ha smesso di fischiare, e
      ha la mano sul coltello.
    opzioni:
      - testo: "Svegliarla e combattere"
        descrizione: "Una macchina della Salvaguardia grande come due uomini e lenta a girarsi. Se la butti giù, la sala è vostra."
        combattimento: scuri-la-sala-delle-nove-colonne
        vittoria:
          titolo: La macchina a terra
          testo: |
            La macchina si sveglia girando su sé stessa, con le braccia al
            contrario che colpiscono da dove non te lo aspetti. Ci vuole tutto
            quello che hai. Quando cade fa tremare le nove colonne, e il ronzio
            si spegne di colpo. Nel silenzio senti Gaia ridere, una risata
            nervosa che non riesce a fermare. Dal petto della macchina estrai
            un cristallo ancora carico.
          imposta: { scuri.salvaguardia: 1 }
          effetti: { cristalli.cristallo-carico: 1, reliquie.meccanismo-spento: 1 }
          segue: scuri-vds-la-sala-nuova
        sconfitta:
          titolo: Le braccia al contrario
          testo: |
            La macchina si sveglia girando su sé stessa, e un braccio montato al
            contrario ti prende alle spalle e ti scaraventa contro una colonna.
            Karn ti trascina fuori dalla sala per i piedi, e Gaia vi guida
            indietro per tutta la strada, fino alla scala del formaggio. Quando
            esci all'aria aperta sputi sangue, e la sala è ancora della
            macchina.
          vai: citta-bassa

      - testo: "Spegnerla con il congegno di controllo"
        descrizione: "Tre incavi sul fianco, e una macchina che dorme. Bisogna sapere dove mettere le dita, e farlo senza svegliarla."
        prova: { attributo: mentale, abilita: [tecnologia, magia], difficolta: Difficile }
        successo:
          titolo: Il pannello
          testo: |
            Ti avvicini alla macchina in punta di piedi e metti tre dita
            negli incavi del pannello, nell'ordine che ti suggerisce la
            forma. Il ronzio cala, poi si ferma. La testa girata
            all'indietro si abbassa sul petto, e la macchina resta lì,
            spenta, come una statua, mentre Karn ricomincia a fischiare.
          pe: { tecnologia: 5 }
          imposta: { scuri.salvaguardia: 1 }
          effetti: { reliquie.frammento-inciso: 1 }
          segue: scuri-vds-la-sala-nuova
        fallimento:
          titolo: Il risveglio
          testo: |
            Metti le dita negli incavi nell'ordine sbagliato, e il ronzio sale
            di colpo. La testa della macchina gira su sé stessa e si ferma
            davanti a te. Scappate senza voltarvi, e lei vi insegue fino alla
            porta murata, dove si ferma come se ci fosse un confine. Uscite in
            Città Bassa con le ginocchia sbucciate.
          effetti: { ferite: 1.5, tormento: 0.5 }
          vai: citta-bassa

      - testo: "Lasciarla dormire e passarle accanto"
        descrizione: "Una macchina che dorme non vede chi passa piano. Le sale laterali si raggiungono girandole intorno, a pochi passi da lei."
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Difficile }
        successo:
          titolo: Il cerchio delle colonne
          testo: |
            Giri intorno alla macchina da una colonna all'altra, con le spalle
            basse e i piedi che cercano la pietra più liscia. Il ronzio non
            cambia. Arrivi ai passaggi laterali con Gaia e Karn dietro di te, e
            la macchina resta in mezzo al cerchio, addormentata, a fare la
            guardia al Mercato senza saperlo.
          pe: { furtivita: 5 }
          imposta: { scuri.salvaguardia: 2 }
          segue: scuri-vds-la-sala-nuova
        fallimento:
          titolo: Il passo storto
          testo: |
            A metà del giro posi il piede su una pietra che si muove, e il
            ronzio cambia tono. La testa della macchina gira di mezzo giro.
            Scappate senza voltarvi fino alla porta murata, e uscite in Città
            Bassa con il cuore in gola e le ginocchia sbucciate.
          effetti: { ferite: 1.5, tormento: 0.5 }
          vai: citta-bassa

  # ------------------------------------------------------------ 4 · il seguito: la sala nuova del Mercato
  - id: scuri-vds-la-sala-nuova
    immagine: ambientazione/mercato-delle-ombre
    titolo: La sala nuova
    tipo: seguito
    luogo: Le Vie di Sotto, la sala delle nove colonne
    area: scuri-vie-di-sotto
    requisiti: [fazione.scuri == 4]
    testo: |
      Con la macchina ferma, la sala delle nove colonne è vostra. Gaia
      cammina avanti e indietro fra i due passaggi laterali con le mani in
      tasca, e misura a passi tutte e due le stanze. Karn segna le colonne
      con il gesso, una croce per ognuna, e ricomincia a fischiare.

      La stanza asciutta è grande, con il pavimento piano e l'aria buona.
      Ci starebbero tutti i banchi del Mercato, e i clienti verrebbero
      volentieri. L'altra stanza finisce sul vuoto della Cicatrice, con la
      scala di corda arrotolata sul bordo. È più piccola e più fredda, ed è
      l'unica sala del Mercato da cui si può scappare senza passare dalle
      porte.

      {politica-ed-economia Media} Una sala comoda porta più clienti, e più
      clienti portano più decime. Una sala con l'uscita sul vuoto porta meno
      clienti e più contrabbandieri, gente che paga meglio e scappa prima.

      Gaia si ferma accanto a te. «Scegli tu» dice. Poi, dopo un momento,
      più piano. «E se un giorno mi vedi uscire da una di queste, da quale
      parte vado non lo dici a nessuno.»

      {empatia Media} Non ti sta chiedendo un favore. Ti sta dicendo che un
      giorno se ne andrà, e che vuole sapere se può fidarsi di te.
    opzioni:
      - testo: "La sala asciutta, per i banchi"
        descrizione: "Più clienti portano più decime, in una sala che il Velo e la Caserma troveranno presto."
        esito:
          titolo: La sala dei banchi
          testo: |
            Scegli la sala asciutta, e Gaia annuisce come se l'avesse sempre
            saputo. Karn segna l'ingresso con una croce di gesso più grande
            delle altre. Una settimana dopo il Mercato delle Ombre apre nella
            sala nuova, con i banchi in fila e il formaggio al solito posto, e
            alle tre porte degli Scuri c'è la fila.
          imposta: { scuri.sala: 1 }
          effetti: { fazione.scuri: 1, rep.scuri: 1 }
          vai: citta-bassa

      - testo: "La sala con l'uscita sul vuoto"
        descrizione: "Meno clienti, e una via di fuga che nessun altro ha. Chi scappa paga meglio."
        esito:
          titolo: La scala di corda
          testo: |
            Scegli la sala sul vuoto, e Gaia ti guarda con un'espressione
            nuova, quasi grata. Karn controlla la scala di corda nodo per
            nodo. Una settimana dopo il Mercato delle Ombre apre nella sala
            nuova, che è più fredda di quella di prima, e chi scende ci
            viene per comprare quello che non si trova altrove.
          imposta: { scuri.sala: 2 }
          effetti: { fazione.scuri: 1, rep.scuri: 1 }
          vai: citta-bassa

      - testo: "Promettere a Gaia di non dire niente"
        descrizione: "Prima di scegliere, una promessa. Gaia vuole sapere se può fidarsi di te."
        costo: 0
        esito:
          titolo: La promessa
          testo: |
            Le dici che da quale parte esce non lo dirai a nessuno, nemmeno
            se te lo chiede chi paga. Gaia ti guarda da sotto il cappuccio,
            poi annuisce una volta sola. Ti dice che anche lei ti ha visto
            fare qualcosa che terrà per sé, e si guarda bene dal dirti che
            cosa.
          segue: scuri-vds-la-sala-nuova
