# Le Vie di Sotto, spedizione del passo 5 della quest degli Scuri (fazione.scuri == 4). Ci si entra da
# scuri-le-vie-di-sotto o scuri-le-vie-di-sotto-dopo (passi-1.yaml), con Gaia e Karn; la ritirata porta in Città Bassa.
# Le stanze chiedono fazione.scuri == 4 e vanno in fasce di profondità; una stanza superata non ricompare nella stessa
# visita:
# 0 gli imbocchi (le frecce di gesso, la grata di Via del Salmone, la cantina dei cerchi);
# 1 le gallerie dei contrabbandieri (la galleria delle casse, il passaggio dei cappucci, la cisterna ferma);
# 2 le opere dei Precursori (il condotto dei cristalli morti, la sacca di Marea, il ponte di catena sulla Cicatrice);
# 3 la soglia (la porta murata, le ossa con la mappa).
# Il cuore a 4 è la sala delle nove colonne, con la Salvaguardia ruotata (boss Difficile, oppure spegnerla o passarle
# accanto con una prova Difficile). Chi la supera sceglie la sala nuova del Mercato nel seguito (scuri.sala), e il
# passo si chiude. Chi perde torna in Città Bassa con le ferite, e la spedizione resta aperta.
# Combattere i cappucci del Velo costa rep.velo.
aree:
  - id: scuri-vie-di-sotto
    immagine: ambientazione/mercato-delle-ombre
    nome: Le Vie di Sotto
    sommario: "Sotto la Città Bassa, fra cantine di contrabbandieri e cisterne dei Precursori, c'è spazio per il Mercato delle Ombre."
    spedizione: { ritorno: citta-bassa, soglia: 4, stanze: 3 }
    testo: |
      Sotto la Città Bassa le cantine si toccano. In due secoli chi aveva
      qualcosa da nascondere ha bucato il muro del vicino, finché le cantine
      si sono attaccate alle cisterne dei Precursori. Si cammina con l'acqua
      alle caviglie, fra frecce di gesso che Gaia legge come un giornale, e
      Karn va avanti con la lanterna cieca fischiando a mezza voce.

storylet:
  # ------------------------------------------------------------ 0 · gli imbocchi
  - id: scuri-vds-le-frecce-di-gesso
    immagine: ambientazione/mercato-delle-ombre
    titolo: Le frecce di gesso
    sommario: "Al primo bivio i muri sono coperti di frecce di gesso che indicano tutte una direzione diversa."
    luogo: Le Vie di Sotto, il primo bivio
    area: scuri-vie-di-sotto
    ripetibile: true
    requisiti: [fazione.scuri == 4, profondita.scuri-vie-di-sotto == 0]
    testo: |
      Il primo bivio è una stanza bassa con tre aperture e i muri coperti di
      frecce di gesso, fresche accanto alle vecchie. Dall'apertura di destra
      arriva un rumore d'acqua che scorre, da quella di sinistra niente.

      {percezione Media} Le frecce vecchie sono più basse di quelle nuove.
      Quelli che le hanno segnate per primi erano più piccoli, o erano
      bambini.
    opzioni:
      - testo: "Leggere le frecce più vecchie"
        descrizione: "Le frecce vecchie le faceva chi sapeva dove andare."
        prova: { attributo: mentale, abilita: [percezione, accademiche], difficolta: Media }
        successo:
          titolo: Le frecce basse
          testo: |
            Le frecce più basse e sbiadite puntano sempre verso l'apertura in
            mezzo, e la galleria di mezzo scende dolcemente verso acqua più bassa.
          effetti: { profondita.scuri-vie-di-sotto: 1 }
        fallimento:
          titolo: La freccia nuova
          testo: |
            La freccia più nuova porta in un cunicolo cieco con un secchio
            rovesciato per sedersi. Quando torni, Gaia sta già cancellando quella
            freccia con la manica.

      - testo: "Andare dietro all'acqua che scorre"
        descrizione: "L'acqua che scorre va da qualche parte, ma non sai quanto è profonda."
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Media }
        successo:
          titolo: La corrente
          testo: |
            L'acqua sale fino alla vita e la corrente ti spinge avanti, finché la
            galleria risale e ti lascia fradicio su un gradino di pietra.
          effetti: { profondita.scuri-vie-di-sotto: 1 }
        fallimento:
          titolo: Il gradino che non c'è
          testo: |
            Al terzo passo il fondo sparisce, e Karn ti ripesca per il bavero
            prima che la corrente ti porti via. Torni al bivio sputando acqua che
            sa di ferro.
          effetti: { ferite: 0.5 }

      - testo: "Mandare avanti Karn e aspettare il fischio"
        descrizione: "Karn conosce meglio i tetti delle cantine, ma ci vede al buio, e se trova la strada fischia."
        costo: 2
        esito:
          titolo: Il fischio
          testo: |
            Karn va avanti da solo, e Gaia ti racconta al buio una barzelletta sui
            Raschiatori che non fa ridere nessuno. Poi dalla galleria di mezzo
            arriva due volte la canzone di Karn.
          effetti: { profondita.scuri-vie-di-sotto: 1 }

  - id: scuri-vds-la-grata-del-salmone
    immagine: ambientazione/citta-bassa
    titolo: La grata di Via del Salmone
    sommario: "Dalla grata di un tombino scende acqua sporca, e il passaggio sotto si sta allagando."
    luogo: Le Vie di Sotto, sotto Via del Salmone
    area: scuri-vie-di-sotto
    ripetibile: true
    requisiti: [fazione.scuri == 4, profondita.scuri-vie-di-sotto == 0]
    testo: |
      La galleria passa sotto il tombino di Via del Salmone, e insieme alla
      luce grigia della strada scende l'acqua dei lavatoi. Sopra la testa
      una donna chiama un bambino per nome. Sotto la grata il passaggio
      scende, e l'acqua lo riempie una spanna alla volta.
    opzioni:
      - testo: "Passare subito, con l'acqua al petto"
        descrizione: "Una galleria che si allaga si passa finché si può."
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Media }
        successo:
          titolo: Con l'acqua al petto
          testo: |
            Passi con l'acqua al petto e le braccia alzate fino a un gradino
            asciutto, e Gaia ti segue aggrappata al bavero di Karn.
          effetti: { profondita.scuri-vie-di-sotto: 1 }
        fallimento:
          titolo: L'acqua al mento
          testo: |
            A metà l'acqua ti arriva al mento, e torni indietro sputando. Gaia ti
            strizza la manica senza dire niente, come una sorella maggiore.
          effetti: { ferite: 0.5 }

      - testo: "Chiudere la grata da sotto"
        descrizione: "Il fermo arrugginito della grata, se lo giri, manda l'acqua altrove."
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Media }
        successo:
          titolo: Il fermo
          testo: |
            Dalle spalle di Karn arrivi al fermo, che gira con un lamento di
            ruggine, e il passaggio si svuota fino alle ginocchia.
          effetti: { profondita.scuri-vie-di-sotto: 1, sospetto: 1 }
        fallimento:
          titolo: La ruggine
          testo: |
            Il fermo arrugginito ti resta in mano e cadi all'indietro nell'acqua,
            mentre Karn ride per la prima volta da quando siete scesi.
          effetti: { ferite: 0.5 }

      - testo: "Aspettare che i lavatoi chiudano"
        descrizione: "A sera i lavatoi chiudono e l'acqua smette di scendere."
        costo: 2
        esito:
          titolo: I lavatoi chiusi
          testo: |
            Aspettate al buio che i lavatoi chiudano, e passate con l'acqua alle
            ginocchia mentre Gaia si lamenta del freddo.
          effetti: { profondita.scuri-vie-di-sotto: 1 }

  - id: scuri-vds-la-cantina-dei-cerchi
    immagine: ambientazione/citta-bassa
    titolo: La cantina dei cerchi
    sommario: "Una cantina piena di cerchi di ferro per le botti, con il bottaio che dorme sopra le assi del soffitto."
    luogo: Le Vie di Sotto, sotto la bottega di un bottaio
    area: scuri-vie-di-sotto
    ripetibile: true
    requisiti: [fazione.scuri == 4, profondita.scuri-vie-di-sotto == 0]
    testo: |
      La galleria sbuca nella cantina di un bottaio, fra cataste di doghe e
      cerchi di ferro appesi ai chiodi, con una porticina bassa dall'altra
      parte. Sopra le assi del soffitto il bottaio russa a ondate lunghe.

      {furtivita Facile} Lungo il muro, dove passano tutti, le assi
      scricchiolano. In mezzo, fra le doghe, sono più solide.

      {origine figlio-della-citta-bassa} Da ragazzino rubavi i cerchi di
      ferro in una cantina come questa, per farli correre nella polvere con
      un bastone.
    opzioni:
      - testo: "Attraversare la cantina in mezzo alle doghe"
        descrizione: "Un passo alla volta fra le cataste, al ritmo del bottaio."
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Media }
        successo:
          titolo: Fra le doghe
          testo: |
            Attraversi fra le cataste posando i piedi quando il bottaio inspira, e
            Gaia ti segue a braccia larghe. Il russare non si interrompe mai.
          effetti: { profondita.scuri-vie-di-sotto: 1 }
        fallimento:
          titolo: Il cerchio
          testo: |
            Urti un cerchio di ferro, che rotola per la cantina con un rumore da
            campana, e il russare si ferma. Quando riprende, tornate indietro
            nella galleria per prudenza.
          effetti: { sospetto: 1 }

      - testo: "Cercare un'altra porta fra le cataste"
        descrizione: "Una cantina di contrabbandieri ha sempre due uscite."
        prova: { attributo: mentale, abilita: [percezione, tecnologia], difficolta: Media }
        successo:
          titolo: La botte vuota
          testo: |
            Dentro una botte grande senza tappo c'è una scala a pioli che scende,
            e in fondo trovi una scheggia di metallo precuriano usata come
            fermaporta.
          effetti: { profondita.scuri-vie-di-sotto: 1, reliquie.scheggia: 1 }
        fallimento:
          titolo: Il vino
          testo: |
            La botte che sembrava vuota era piena, e al rumore del vino il bottaio
            smette di russare. Tornate indietro di corsa.

      - testo: "Rubare un cerchio, come allora"
        descrizione: "Un cerchio di ferro torna sempre utile, e questo bottaio russa come quello di allora."
        quando: [origine.figlio-della-citta-bassa >= 1]
        esito:
          titolo: Come allora
          testo: |
            Stacchi un cerchio dal chiodo con due dita, come ti avevano insegnato
            i ragazzi più grandi. Gaia capisce da dove vieni, e da quel momento ti
            cede il passo nei punti stretti.
          effetti: { profondita.scuri-vie-di-sotto: 1 }

  # ------------------------------------------------------------ 1 · le gallerie dei contrabbandieri
  - id: scuri-vds-la-galleria-delle-casse
    immagine: ambientazione/mercato-delle-ombre
    titolo: La galleria delle casse
    sommario: "Una galleria piena di casse e due contrabbandieri senza banda che non vogliono cederti il passo."
    luogo: Le Vie di Sotto, la galleria delle casse
    area: scuri-vie-di-sotto
    ripetibile: true
    requisiti: [fazione.scuri == 4, profondita.scuri-vie-di-sotto == 1]
    testo: |
      Nella galleria piena di casse impilate fino al soffitto, due
      contrabbandieri seduti in fondo dividono una salsiccia con un coltello
      da cordaio.

      «Questa roba non è degli Scuri» dice il più vecchio, «e il passaggio
      nemmeno.» Ha un orecchio solo, e gira la testa per sentirvi meglio.

      {conoscenze-della-strada Media} Contrabbandieri senza banda. Nessuno
      li protegge e nessuno li vendica, e hanno più paura di voi di quanta
      ne mostrino.
    opzioni:
      - testo: "Farti largo"
        descrizione: "Due contrabbandieri con un coltello da cordaio se ne vanno alla prima ferita."
        combattimento: scuri-la-galleria-delle-casse
        vittoria:
          titolo: Le casse
          testo: |
            Il più giovane scappa lasciando la salsiccia, e il vecchio sparisce
            fra le casse. In una cassa aperta trovi frammenti di cristallo e un
            paio di schegge.
          effetti: { profondita.scuri-vie-di-sotto: 1, cristalli.frammento-esausto: 2, reliquie.scheggia: 1 }
        sconfitta:
          titolo: Il coltello da cordaio
          testo: |
            Il coltello da cordaio ti prende sul braccio, e Karn ti fascia con la
            sua sciarpa mentre cercate un'altra strada.

      - testo: "Trattare il passaggio"
        descrizione: "Due contrabbandieri senza banda vivono di passaggi, e qualcosa si può promettere."
        prova: { attributo: sociale, abilita: [persuasione, conoscenze-della-strada], difficolta: Media }
        successo:
          titolo: La salsiccia
          testo: |
            Gli spieghi che la sala nuova del Mercato avrà bisogno di qualcuno che
            porti le casse. Il vecchio ci pensa girando la testa, poi ti offre un
            pezzo di salsiccia, che in questa galleria vuol dire sì.
          effetti: { profondita.scuri-vie-di-sotto: 1 }
        fallimento:
          titolo: L'orecchio solo
          testo: |
            Parli al vecchio dalla parte dell'orecchio che non ha, e quando ripeti
            tutto dall'altra il discorso non funziona più. Vi fanno indietreggiare
            con il coltello.

      - testo: "Pagare il passaggio"
        descrizione: "In una galleria piena di casse si passa prima da clienti."
        requisiti: [monete >= 6]
        esito:
          titolo: La tariffa
          testo: |
            Il vecchio conta le monete con il pollice senza alzarsi. «Tariffa di
            passaggio» dice, come se fosse scritta da qualche parte, e il giovane
            si sposta di lato.
          effetti: { profondita.scuri-vie-di-sotto: 1, monete: -6 }

  - id: scuri-vds-il-passaggio-dei-cappucci
    immagine: fazioni/confraternita-del-velo
    titolo: Il passaggio dei cappucci
    sommario: "Due cappucci del Velo stanno di guardia a un arco di pietra, con i bastoni ferrati al muro."
    luogo: Le Vie di Sotto, un arco di pietra
    area: scuri-vie-di-sotto
    ripetibile: true
    requisiti: [fazione.scuri == 4, profondita.scuri-vie-di-sotto == 1]
    testo: |
      Sotto un arco di pietra più vecchio delle gallerie intorno stanno due
      uomini immobili con il cappuccio alzato e il bastone ferrato al muro.
      Sono i cappucci del Velo, che tengono le porte della Confraternita al
      Mercato.

      Gaia ti tira indietro per la manica. «Con loro si tratta, o si passa
      senza farsi vedere» sussurra. «Se li tocchi, lo sanno in Cattedrale
      prima che tu sia tornato su.»

      {origine accolito-del-velo} Il nodo del cappuccio sotto il mento è
      quello che si insegna ai novizi il primo inverno, e quello di destra
      l'ha fatto storto, come lo facevi tu.
    opzioni:
      - testo: "Chiedere il passo con le buone maniere"
        descrizione: "Il Velo rispetta la forma, e una richiesta giusta apre più porte di un coltello."
        prova: { attributo: sociale, abilita: [galateo, persuasione], difficolta: Media }
        successo:
          titolo: Il saluto
          testo: |
            Con le mani in vista chiedi il passo per gli Scuri che aprono la
            strada al Mercato. Il cappuccio di destra si sposta di un passo e ti
            dice che il Velo si ricorderà chi ha chiesto.
          effetti: { profondita.scuri-vie-di-sotto: 1 }
        fallimento:
          titolo: Il bastone
          testo: |
            Il cappuccio di sinistra abbassa il bastone davanti al tuo petto, in
            silenzio, ed è tutta la risposta che avrai.

      - testo: "Passare dal condotto di lato, senza farti vedere"
        descrizione: "I cappucci guardano la galleria e non il condotto basso accanto all'arco."
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Media }
        successo:
          titolo: Il condotto
          testo: |
            Strisci sui gomiti nel condotto basso, a due passi dai cappucci, e ne
            senti uno sospirare di noia. Dall'altra parte aspetti Gaia e Karn.
          effetti: { profondita.scuri-vie-di-sotto: 1 }
        fallimento:
          titolo: Il gomito
          testo: |
            Il gomito ti scivola su un sasso, e dall'altra parte ti aspettano
            tutti e due per riaccompagnarti all'imbocco.
          effetti: { sospetto: 1 }

      - testo: "Passare con la forza"
        descrizione: "Due uomini con il bastone contro tre persone decise, e il Velo se lo ricorderà."
        combattimento: scuri-i-cappucci
        vittoria:
          titolo: I cappucci a terra
          testo: |
            Il primo cappuccio va giù quando gli arrivi sotto il bastone, e il
            secondo si ritira nel buio senza voltarsi. Gaia dice che in Cattedrale
            qualcuno sta già scrivendo il tuo nome.
          effetti: { profondita.scuri-vie-di-sotto: 1, rep.velo: -1 }
        sconfitta:
          titolo: Il bastone ferrato
          testo: |
            Il bastone ferrato ti prende dietro il ginocchio, e i cappucci
            aspettano che ti alzi per indicarti la galleria da cui sei venuto.
          effetti: { rep.velo: -1 }

      - testo: "Rifare il nodo al cappuccio di quello di destra"
        descrizione: "Il nodo storto è quello dei novizi, e un accolito sa come si corregge."
        quando: [origine.accolito-del-velo >= 1]
        esito:
          titolo: Il nodo dei novizi
          testo: |
            Gli rifai il nodo sotto il mento senza chiedere, come in dormitorio
            con i più piccoli. Lui si sposta di un passo, toccandosi il nodo con
            due dita.
          effetti: { profondita.scuri-vie-di-sotto: 1 }

  - id: scuri-vds-la-cisterna-ferma
    immagine: ambientazione/rovine-dei-precursori
    titolo: La cisterna ferma
    sommario: "Una cisterna dei Precursori piena d'acqua nera e ferma, con la galleria che continua dall'altra parte."
    luogo: Le Vie di Sotto, una cisterna dei Precursori
    area: scuri-vie-di-sotto
    ripetibile: true
    requisiti: [fazione.scuri == 4, profondita.scuri-vie-di-sotto == 1]
    testo: |
      La galleria finisce su una cisterna dei Precursori liscia come una
      tazza e piena d'acqua nera. L'apertura quadrata da cui si prosegue è a
      trenta bracciate, e lungo la parete corre una cornice larga un piede,
      viscida di muffa.

      {atletica Media} Trenta bracciate si fanno, ma l'acqua ferma da anni è
      più fredda di quanto sembri.
    opzioni:
      - testo: "Attraversare a nuoto"
        descrizione: "Trenta bracciate nell'acqua nera, fino a un gradino per uscire."
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Media }
        successo:
          titolo: Trenta bracciate
          testo: |
            Nuoti con la candela legata alla testa, e quando esci dal gradino non
            senti più le dita. Tiri su Gaia, che ti ha seguito in silenzio.
          effetti: { profondita.scuri-vie-di-sotto: 1 }
        fallimento:
          titolo: Il freddo
          testo: |
            A metà il freddo ti prende le gambe, e Karn ti tira fuori per il
            colletto.
          effetti: { ferite: 0.5 }

      - testo: "Fare il giro sulla cornice"
        descrizione: "La cornice è larga un piede e viscida, e si passa con la schiena al muro."
        prova: { attributo: fisico, abilita: [acrobazia, furtivita], difficolta: Media }
        successo:
          titolo: La cornice
          testo: |
            Fai il giro con la schiena al muro, un passo laterale alla volta,
            senza guardare l'acqua che riflette la candela. Arrivi all'apertura
            con le mani sporche di muffa.
          effetti: { profondita.scuri-vie-di-sotto: 1 }
        fallimento:
          titolo: La muffa
          testo: |
            Il piede ti scivola sulla muffa e finisci nell'acqua nera con un tonfo
            che rimbomba. Torni a riva a nuoto, tremando.
          effetti: { ferite: 0.5 }

      - testo: "Cercare un'altra strada intorno"
        descrizione: "Una cisterna ha sempre un canale di scolo, lungo ma asciutto."
        costo: 2
        esito:
          titolo: Il canale di scolo
          testo: |
            Trovate un canale di scolo pieno di nidi di topo e lo percorrete a
            carponi, e Gaia starnutisce tre volte.
          effetti: { profondita.scuri-vie-di-sotto: 1 }

  # ------------------------------------------------------------ 2 · le opere dei Precursori
  - id: scuri-vds-il-condotto-dei-cristalli
    immagine: ambientazione/cristalli-conduttori
    titolo: Il condotto dei cristalli morti
    sommario: "Un portello chiude un condotto dei Precursori foderato di cristalli spenti."
    luogo: Le Vie di Sotto, un condotto dei Precursori
    area: scuri-vie-di-sotto
    ripetibile: true
    requisiti: [fazione.scuri == 4, profondita.scuri-vie-di-sotto == 2]
    testo: |
      Il condotto è rotondo e foderato di cristalli opachi. In fondo c'è un
      portello di metallo con una ruota, e accanto sette cristalli più
      grandi, spenti tranne il primo, che manda una luce verde debolissima.

      {tecnologia Media} I sette cristalli sono una serratura. Il primo è
      acceso perché qualcuno ha già provato, e si è fermato lì.
    opzioni:
      - testo: "Accendere i cristalli nell'ordine giusto"
        descrizione: "Chi conosce i congegni dei Precursori sa da quale si comincia."
        prova: { attributo: mentale, abilita: [tecnologia, magia], difficolta: Media }
        successo:
          titolo: La ruota
          testo: |
            Tocchi i cristalli dalla faccia più piccola alla più grande, e al
            settimo la ruota del portello gira da sola. Uno dei cristalli piccoli
            si stacca dalla parete, ancora tiepido.
          effetti: { profondita.scuri-vie-di-sotto: 1, cristalli.cristallo-sterile: 1 }
        fallimento:
          titolo: La scossa
          testo: |
            Al terzo cristallo una scossa ti sale fino alla spalla, e si spengono
            tutti, anche il primo.
          effetti: { ferite: 0.5, tormento: 1 }

      - testo: "Forzare la ruota a mano"
        descrizione: "Il portello è vecchio, e le cose vecchie a volte cedono."
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Difficile }
        successo:
          titolo: La forza
          testo: |
            Tu e Karn vi appendete alla ruota finché cede con un rumore di ossa, e
            passate di lato con i palmi rossi.
          effetti: { profondita.scuri-vie-di-sotto: 1, ferite: 0.5 }
        fallimento:
          titolo: La ruota ferma
          testo: |
            La ruota non si muove di un dito, e Karn smette di fischiare per
            bestemmiare.
          effetti: { ferite: 0.5 }

      - testo: "Tornare indietro e trovare un altro condotto"
        descrizione: "Le opere dei Precursori hanno sempre più di un condotto."
        costo: 2
        esito:
          titolo: Il condotto di servizio
          testo: |
            Il condotto stretto delle riparazioni ha ancora le maniglie di
            metallo, e ci passate a quattro zampe fino a sbucare oltre il
            portello.
          effetti: { profondita.scuri-vie-di-sotto: 1 }

  - id: scuri-vds-la-sacca-di-marea
    immagine: ambientazione/marea-grigia
    titolo: La sacca di Marea
    sommario: "Una nebbia grigia ristagna in una galleria bassa, e la strada passa in mezzo."
    luogo: Le Vie di Sotto, una galleria bassa
    area: scuri-vie-di-sotto
    ripetibile: true
    requisiti: [fazione.scuri == 4, profondita.scuri-vie-di-sotto == 2]
    testo: |
      In una galleria bassa ristagna una nebbia grigia all'altezza del
      petto, che non si muove con l'aria, e dentro la fiamma della candela
      si piega verso il basso. È una piccola sacca di Marea Grigia.

      {resilienza Media} Dentro la nebbia ci sono voci, o qualcosa che le
      somiglia. Se ascolti troppo, cominciano a dire il tuo nome.

      Gaia si tira il cappuccio blu fin sotto il mento. «Io lì dentro non ci
      passo. Se ci passi tu, io faccio il giro.»
    opzioni:
      - testo: "Attraversare la nebbia senza respirare"
        descrizione: "Una ventina di passi, con la bocca chiusa e la testa ferma."
        prova: { attributo: mentale, abilita: [resilienza, medicina], difficolta: Media }
        successo:
          titolo: Venti passi
          testo: |
            Con il naso stretto fra le dita conti i passi, e le voci arrivano al decimo e
            se ne vanno al quindicesimo. Al ventesimo sei fuori.
          effetti: { profondita.scuri-vie-di-sotto: 1, contaminazione: 1 }
        fallimento:
          titolo: Il tuo nome
          testo: |
            Al decimo passo una voce dice il tuo nome, e ti fermi. Karn ti
            trascina fuori con le mani grigie fino ai polsi.
          effetti: { contaminazione: 1.5, tormento: 1 }

      - testo: "Fare il giro con Gaia"
        descrizione: "Gaia conosce un passaggio stretto che gira intorno."
        costo: 2
        esito:
          titolo: Il giro
          testo: |
            Nel passaggio di Gaia devi toglierti la giubba e spingerla avanti,
            mentre lei passa vestita.
          effetti: { profondita.scuri-vie-di-sotto: 1 }

      - testo: "Leggere la sacca con il Mana"
        descrizione: "All'Accademia insegnano che una sacca di Marea ha delle correnti, e dove sono deboli si passa."
        quando: [origine.allievo-di-torvessa >= 1]
        prova: { attributo: mentale, abilita: magia, difficolta: Facile }
        successo:
          titolo: La corrente debole
          testo: |
            La sacca gira su sé stessa come una corrente fredda, più debole a
            sinistra, e ci passi rasente al muro con la manica sulla bocca.
          effetti: { profondita.scuri-vie-di-sotto: 1, contaminazione: 1 }
        fallimento:
          titolo: La corrente forte
          testo: |
            Senti la corrente al contrario e passi dal lato più forte, e la nebbia
            ti si attacca addosso. Karn ti tira fuori con le mani grigie fino ai
            polsi.
          effetti: { contaminazione: 1.5, tormento: 1 }

  - id: scuri-vds-il-ponte-di-catena
    immagine: ambientazione/cicatrice-del-mondo
    titolo: Il ponte di catena
    sommario: "Una galleria si affaccia sulla Cicatrice, e una catena tesa porta all'imbocco di fronte."
    luogo: Le Vie di Sotto, sopra la Cicatrice
    area: scuri-vie-di-sotto
    ripetibile: true
    requisiti: [fazione.scuri == 4, profondita.scuri-vie-di-sotto == 2]
    testo: |
      La galleria finisce di colpo sul vuoto della Cicatrice, con le luci dei
      Ponti Sospesi lontane a destra. A una ventina di passi si apre
      l'imbocco successivo, e in mezzo c'è una catena tesa con una corda più
      sottile per le mani. Karn passa per primo, fischiando a tempo con i
      passi.

      {acrobazia Media} La catena è pesante e oscilla poco. È la corda sopra
      che si muove, e ti tradisce.
    opzioni:
      - testo: "Passare sulla catena come Karn"
        descrizione: "Piedi sulla catena e mani sulla corda, con il vento contro."
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Media }
        successo:
          titolo: Dall'altra parte
          testo: |
            Passi con i piedi di traverso e le mani leggere sulla corda, piegando
            le ginocchia alle raffiche. All'imbocco Karn ti tira dentro.
          effetti: { profondita.scuri-vie-di-sotto: 1 }
        fallimento:
          titolo: La corda
          testo: |
            A metà la corda ti scivola via dalle dita e resti appeso alla catena
            sul vuoto. Torni indietro un anello alla volta.
          effetti: { ferite: 0.5, tormento: 1 }

      - testo: "Legarti alla catena con la cintura"
        descrizione: "Una cintura intorno alla catena rallenta il passo, ma se cadi ti tiene."
        costo: 2
        esito:
          titolo: La cintura
          testo: |
            Spingi la cintura avanti a ogni passo, e due volte il vento ti fa
            oscillare sul vuoto e la cintura tiene.
          effetti: { profondita.scuri-vie-di-sotto: 1, tormento: 1 }

      - testo: "Camminare sulla catena come sulle piattaforme"
        descrizione: "Sulle piattaforme della Cicatrice si cammina su catene come questa tutti i giorni."
        quando: [origine.apprendista-raschiatore >= 1]
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Facile }
        successo:
          titolo: Come sulle piattaforme
          testo: |
            Passi guardando la parete di fronte e mai il vuoto, con il peso sui
            talloni, e arrivi prima di Karn, che resta con la canzone ferma in
            bocca.
          effetti: { profondita.scuri-vie-di-sotto: 1 }
        fallimento:
          titolo: Il vento diverso
          testo: |
            Qui il vento sale dal basso invece di soffiare di lato, e a metà ti
            strappa i piedi dalla catena. Torni indietro a forza di braccia, con
            la vergogna che brucia più dei palmi.
          effetti: { ferite: 0.5, tormento: 1 }

  # ------------------------------------------------------------ 3 · la soglia
  - id: scuri-vds-la-porta-murata
    immagine: ambientazione/rovine-dei-precursori
    titolo: La porta murata
    sommario: "In fondo a una galleria c'è una porta dei Precursori murata con mattoni moderni, e non tanto tempo fa."
    luogo: Le Vie di Sotto, la porta murata
    area: scuri-vie-di-sotto
    ripetibile: true
    requisiti: [fazione.scuri == 4, profondita.scuri-vie-di-sotto == 3]
    testo: |
      In fondo alla galleria un'alta porta dei Precursori, con una cornice di
      metallo senza ruggine, è chiusa da un muro di mattoni moderni tirato su
      in fretta. Dall'altra parte arriva un ronzio basso e regolare, come di
      un alveare.

      {tecnologia Media} Hanno murato la porta senza chiuderla. Dietro i
      mattoni il congegno della cornice è ancora acceso.
    opzioni:
      - testo: "Togliere i mattoni uno alla volta"
        descrizione: "Poca calce e molta fretta, ma il ronzio dall'altra parte non deve cambiare."
        prova: { attributo: fisico, abilita: [atletica, furtivita], difficolta: Media }
        successo:
          titolo: I mattoni
          testo: |
            Togli i mattoni uno per volta facendo leva con il pomo, e la porta dei
            Precursori scorre nella parete. Il ronzio si fa più forte, e Gaia si
            porta un dito alle labbra.
          effetti: { profondita.scuri-vie-di-sotto: 1 }
        fallimento:
          titolo: Il muro che cade
          testo: |
            Al primo mattone il muro intero crolla con un rumore di frana, e
            aspettate a lungo contro la parete che il ronzio torni uguale.
          effetti: { ferite: 0.5, sospetto: 1 }

      - testo: "Trovare l'apertura del congegno"
        descrizione: "Una porta dei Precursori ha sempre un modo di aprirsi, dove la cornice è più calda."
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Media }
        successo:
          titolo: La cornice calda
          testo: |
            All'altezza della spalla la cornice è più calda, e quando premi la
            porta scorre nella parete portandosi dietro il muro.
          effetti: { profondita.scuri-vie-di-sotto: 1, reliquie.frammento-inciso: 1 }
        fallimento:
          titolo: La cornice fredda
          testo: |
            La cornice è fredda dappertutto, e dopo un'ora Karn ti fa notare che
            il congegno, se c'era, è dietro i mattoni.

      - testo: "Mandare Karn a cercare un'altra entrata"
        descrizione: "Karn conosce i tetti, e anche le gallerie hanno sempre un buco."
        costo: 2
        esito:
          titolo: Il buco nel soffitto
          testo: |
            Karn trova un buco nel soffitto oltre il muro e vi tira su uno alla
            volta con la cintura. Scendete in una stanza buia dove il ronzio è più
            forte.
          effetti: { profondita.scuri-vie-di-sotto: 1 }

  - id: scuri-vds-le-ossa-con-la-mappa
    immagine: ambientazione/rovine-dei-precursori
    titolo: Le ossa con la mappa
    sommario: "In una nicchia ci sono le ossa di tre contrabbandieri, e uno stringe una mappa disegnata su una pelle di tamburo."
    luogo: Le Vie di Sotto, una nicchia
    area: scuri-vie-di-sotto
    ripetibile: true
    requisiti: [fazione.scuri == 4, profondita.scuri-vie-di-sotto == 3]
    testo: |
      In una nicchia del muro ci sono le ossa di tre uomini seduti uno accanto
      all'altro, come se aspettassero il loro turno. Uno stringe fra le dita
      una pelle di tamburo arrotolata, con una mappa disegnata a carbone. Gaia
      si fa il segno che in Città Bassa si fa davanti ai morti, due dita sulla
      bocca.

      {medicina Media} Le ossa sono intere e composte. Sono morti di fame o di
      freddo, aspettando qualcuno che non è venuto.
    opzioni:
      - testo: "Leggere la mappa senza toglierla dalle sue mani"
        descrizione: "Chi sa leggere le vecchie carte ci trova una sala."
        prova: { attributo: mentale, abilita: [accademiche, percezione], difficolta: Media }
        successo:
          titolo: La sala grande
          testo: |
            È la mappa delle Vie di Sotto di cent'anni fa. In basso c'è una sala
            segnata da nove puntini in cerchio, e accanto un'altra mano ha scritto
            *non svegliare*. La rimetti fra le dita del morto.
          effetti: { profondita.scuri-vie-di-sotto: 1 }
        fallimento:
          titolo: Il carbone
          testo: |
            Il carbone si sfarina sotto le dita, e della mappa restano poche
            righe. Rimetti la pelle fra le dita del morto, chiedendo scusa a mezza
            voce.

      - testo: "Frugare nelle cinture dei morti"
        descrizione: "I contrabbandieri portavano tutto con sé, e ai morti non serve più."
        prova: { attributo: mentale, abilita: [percezione, resilienza], difficolta: Facile }
        successo:
          titolo: Le cinture
          testo: |
            Nelle cinture trovi un frammento inciso dei Precursori e due schegge,
            mentre Gaia guarda da un'altra parte.
          effetti: { profondita.scuri-vie-di-sotto: 1, reliquie.frammento-inciso: 1, reliquie.scheggia: 2 }
        fallimento:
          titolo: Le dita
          testo: |
            Le dita del morto ti cadono nel palmo come castagne secche, e per il
            resto della galleria continui a pulirti le mani.
          effetti: { tormento: 1 }

      - testo: "Lasciarli in pace e andare avanti"
        descrizione: "Si può passare senza disturbarli, e cercare la strada da soli."
        costo: 2
        esito:
          titolo: Il segno davanti ai morti
          testo: |
            Fai anche tu il segno di Gaia e trovate la strada da soli seguendo il
            ronzio. I morti lasciati in pace, dice Gaia, ti mandano dove devi
            andare.
          effetti: { profondita.scuri-vie-di-sotto: 1 }

  # ------------------------------------------------------------ 4 · il cuore: la sala delle nove colonne
  - id: scuri-vds-la-sala-delle-nove-colonne
    immagine: bestiario/salvaguardia-precursori
    titolo: La sala delle nove colonne
    sommario: "Una sala grande come una piazza, nove colonne in cerchio e in mezzo una macchina dei Precursori che dorme in piedi."
    luogo: Le Vie di Sotto, la sala delle nove colonne
    area: scuri-vie-di-sotto
    requisiti: [fazione.scuri == 4, profondita.scuri-vie-di-sotto >= 4]
    testo: |
      La sala è grande come una piazza della Città Bassa, con nove colonne di
      pietra liscia disposte in cerchio. In mezzo c'è una macchina dei
      Precursori alta due volte un uomo, con la testa girata all'indietro e le
      braccia montate al contrario. Non si muove, e il ronzio esce dal suo
      petto.

      Ai lati si aprono due passaggi, uno verso una sala asciutta con il
      pavimento piano, l'altro verso una stanza che finisce sul vuoto della
      Cicatrice, con una scala di corda arrotolata sul bordo.

      {tecnologia Difficile} Sul fianco della macchina c'è un pannello con tre
      incavi. Chi sa dove mettere le dita la spegne prima che si svegli.

      Gaia si è fermata sull'ultimo gradino. «È lei che teneva lontano tutti»
      sussurra. «Per questo la sala è vuota.» Karn ha la mano sul coltello.
    opzioni:
      - testo: "Svegliarla e combattere"
        descrizione: "Grande come due uomini e lenta a girarsi, e se cade la sala è vostra."
        combattimento: scuri-la-sala-delle-nove-colonne
        vittoria:
          titolo: La macchina a terra
          testo: |
            La macchina si sveglia girando su sé stessa, con le braccia al
            contrario che colpiscono da dove non te lo aspetti. Quando cade fa
            tremare le nove colonne e il ronzio si spegne, e dal suo petto estrai
            un cristallo ancora carico.
          imposta: { scuri.salvaguardia: 1 }
          effetti: { cristalli.cristallo-carico: 1, reliquie.meccanismo-spento: 1 }
          segue: scuri-vds-la-sala-nuova
        sconfitta:
          titolo: Le braccia al contrario
          testo: |
            Un braccio montato al contrario ti scaraventa contro una colonna. Karn
            ti trascina fuori per i piedi e Gaia vi guida fino alla scala del
            formaggio, e la sala resta della macchina.
          vai: citta-bassa

      - testo: "Spegnerla con il congegno di controllo"
        descrizione: "Tre incavi sul fianco, da toccare senza svegliarla."
        prova: { attributo: mentale, abilita: [tecnologia, magia], difficolta: Difficile }
        successo:
          titolo: Il pannello
          testo: |
            Metti tre dita negli incavi nell'ordine che ti suggerisce la forma, e
            il ronzio si ferma. Karn ricomincia a fischiare.
          pe: { tecnologia: 5 }
          imposta: { scuri.salvaguardia: 1 }
          effetti: { reliquie.frammento-inciso: 1 }
          segue: scuri-vds-la-sala-nuova
        fallimento:
          titolo: Il risveglio
          testo: |
            Sbagli l'ordine e il ronzio sale di colpo. La macchina vi insegue fino
            alla porta murata, dove si ferma come davanti a un confine.
          effetti: { ferite: 1.5, tormento: 1 }
          vai: citta-bassa

      - testo: "Lasciarla dormire e passarle accanto"
        descrizione: "Una macchina che dorme non vede chi passa piano, e le sale laterali sono dietro di lei."
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Difficile }
        successo:
          titolo: Il cerchio delle colonne
          testo: |
            Giri intorno alla macchina da una colonna all'altra senza che il
            ronzio cambi, e arrivi ai passaggi laterali con Gaia e Karn. La
            macchina resta a fare la guardia al Mercato senza saperlo.
          pe: { furtivita: 5 }
          imposta: { scuri.salvaguardia: 2 }
          segue: scuri-vds-la-sala-nuova
        fallimento:
          titolo: Il passo storto
          testo: |
            Una pietra si muove sotto il piede e la testa della macchina gira di
            mezzo giro. Scappate fino alla porta murata.
          effetti: { ferite: 1.5, tormento: 1 }
          vai: citta-bassa

  # ------------------------------------------------------------ 4 · il seguito: la sala nuova del Mercato
  - id: scuri-vds-la-sala-nuova
    immagine: ambientazione/mercato-delle-ombre
    titolo: La sala nuova
    tipo: seguito
    luogo: Le Vie di Sotto, la sala delle nove colonne
    area: scuri-vie-di-sotto
    requisiti: [fazione.scuri == 4]
    testo: |
      Con la macchina ferma, la sala delle nove colonne è vostra. Gaia
      misura a passi le due stanze laterali, e Karn segna ogni colonna con
      una croce di gesso.

      Nella stanza asciutta starebbero tutti i banchi del Mercato. L'altra,
      più piccola, finisce sul vuoto della Cicatrice ed è l'unica sala da
      cui si scappa senza passare dalle porte.

      «Scegli tu» dice Gaia fermandosi accanto a te, e poi, più piano: «E se
      un giorno mi vedi uscire da una di queste, da quale parte vado non lo
      dici a nessuno.»
    opzioni:
      - testo: "La sala asciutta, per i banchi"
        descrizione: "Più clienti e più decime, in una sala che il Velo e la Caserma troveranno presto."
        esito:
          titolo: La sala dei banchi
          testo: |
            Karn segna l'ingresso con una croce più grande delle altre. Una
            settimana dopo il Mercato delle Ombre apre nella sala nuova, con il
            formaggio al solito posto, e alle tre porte degli Scuri c'è la fila.
          imposta: { scuri.sala: 1 }
          effetti: { fazione.scuri: 1, rep.scuri: 1 }
          vai: citta-bassa

      - testo: "La sala con l'uscita sul vuoto"
        descrizione: "Meno clienti, e una via di fuga che nessun altro ha."
        esito:
          titolo: La scala di corda
          testo: |
            Karn controlla la scala di corda nodo per nodo. Una settimana dopo il
            Mercato apre nella sala nuova, più fredda, dove si scende per quello
            che non si trova altrove.
          imposta: { scuri.sala: 2 }
          effetti: { fazione.scuri: 1, rep.scuri: 1 }
          vai: citta-bassa

      - testo: "Promettere a Gaia di non dire niente"
        descrizione: "Prima di scegliere, Gaia vuole sapere se può fidarsi di te."
        costo: 0
        esito:
          titolo: La promessa
          testo: |
            Le prometti che da quale parte esce lo terrai per te, anche con chi
            paga. Gaia annuisce una volta sola, e ti dice che anche lei ti ha
            visto fare qualcosa che terrà per sé.
          segue: scuri-vds-la-sala-nuova
