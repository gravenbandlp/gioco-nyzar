# La quest degli Scuri, passi 1-5 (fazione.scuri 0 → 5). Ogni passo ha la versione "prima" (pista.pelle < 4,
# Mauro alla Pignatta e Vesh vivo) e la versione "dopo" (pista.pelle >= 6, Gaia fra le macerie).
# 1 Il conto del vetraio: si entra con rep.scuri >= 0 prima di Vesh, senza condizioni dopo; il debito.scuri della
#   prigione si salda qui.
# 2 La spalla del baro, alla cisterna dell'Orlo (prima: Nihali e l'ispettore della Gilda, con la variante per chi ha
#   svuotato la bisca con Galdrick; dopo: i gettoni d'argilla dei mercenari di Ghoran e il nome di Durgan).
# 3 Firme (grado 1): la licenza falsa per Cosimo Venn della Casa dei Nodi. Prima nel retrobottega di Rozalia, dopo
#   nel suo nascondiglio (macerie.rozalia 0, 1 o 3, che passa a 3) o dietro la grata di una cella (2). Il seguito con
#   Venn è lo stesso per tutti e chiude il passo.
# 4 La colonna della Maison: prima Vesh vuole sapere chi sale le scale (varianti secondo jass), dopo alla porta di
#   servizio riscuote un mercenario di Ghoran.
# 5 Le Vie di Sotto: l'ingresso alla spedizione (spedizione-vie-di-sotto.yaml), che chiude il passo al cuore.
storylet:
  # ------------------------------------------------------------ 1 · il conto del vetraio, prima di Vesh
  - id: scuri-il-conto-del-vetraio
    presso: pignatta-grassa
    immagine: personaggi/mauro-scrocco
    titolo: Il conto del vetraio
    sommario: "Mauro Scrocco ti fa sedere al tavolo d'angolo della Pignatta Grassa per presentarti un debitore."
    luogo: Pignatta Grassa, il tavolo d'angolo
    area: citta-bassa
    requisiti: [fazione.scuri == 0, pista.pelle < 4, rep.scuri >= 0, pista.capomozzo >= 10]
    testo: |
      Alla Pignatta Grassa il tavolo d'angolo ha la gamba zoppa rincalzata da
      un tappo di sughero, e da lì si vedono la porta e il bancone. Mauro
      Scrocco ti ci fa sedere con una mano sulla spalla, in una camicia color
      zafferano e con un odore di cipolla e di vino cotto che arriva prima di
      lui.

      «Una faccia nuova» dice, come si dice di un vino. «Al banco del vetro
      di Via del Salmone c'è un uomo che non paga da tre mesi. Lo voglio
      pagante, e lo voglio intero. Una gamba rotta non lavora, e chi resta a
      casa dal banco i debiti non li paga.»

      Il vetraio ha una figlia apprendista e una partita di vetri pronta per
      la Maison des Lunes, la sola cosa di valore in bottega. Mauro ti dice a
      memoria il suo nome e quelli della moglie e della figlia.

      {empatia Media} Per lui un debitore è una persona di famiglia che ha
      smesso di scrivere.

      {origine figlio-della-citta-bassa} La figlia del vetraio la conosci.
      Quando portavi le consegne per Via del Salmone spazzava i cocci davanti
      al banco, e ti chiedeva sempre che cosa c'era nel pacco.
    opzioni:
      - testo: "Guardare bene i vetri della partita"
        descrizione: "Una partita di vetri per la Maison costa più di quanto un vetraio di Via del Salmone possa permettersi."
        prova: { attributo: mentale, abilita: [percezione, politica-ed-economia], difficolta: Media }
        successo:
          titolo: Il verde nel vetro
          testo: |
            Alzi una lastra controluce e ci trovi una vena verdina, polvere di
            cristalli senza timbro. Glielo dici piano perché la figlia non senta,
            e il vetraio conta i soldi del primo mese senza discutere. La lastra
            la tieni tu, come ricordo.
          pe: { percezione: 5 }
          imposta: { debito.scuri: 0 }
          effetti: { fazione.scuri: 1, rep.scuri: 1, monete: 8 }
        fallimento:
          titolo: Il vetro è vetro
          testo: |
            Alzi le lastre controluce una per una come un intenditore, ma per te
            sono vetri e basta. Il vetraio se ne accorge e si fa coraggio a
            spiegarti che i tempi sono duri, e alla Pignatta Mauro ti riempie il
            bicchiere per consolarti.
          effetti: { scandalo: 0.5 }

      - testo: "Proporgli di pagare a rate"
        descrizione: "Un debito diviso in dodici è un debito che si paga, se qualcuno lo fa sembrare possibile."
        prova: { attributo: sociale, abilita: [persuasione, politica-ed-economia], difficolta: Media }
        successo:
          titolo: Dodici rate
          testo: |
            Fate i conti su una lastra scartata con un pezzo di carbone, e viene fuori una rata alla
            settimana per dodici settimane. Il vetraio paga la prima contando le monete due volte, e Mauro
            ascolta la storia ridendo con la pancia che gli trema sotto la camicia.
          pe: { persuasione: 5 }
          imposta: { debito.scuri: 0 }
          effetti: { fazione.scuri: 1, rep.scuri: 1, monete: 8 }
        fallimento:
          titolo: Il pianto
          testo: |
            Il vetraio scoppia a piangere sul banco, e non capisci se per sollievo
            o per disperazione. Te ne vai con una promessa che domani avrà già
            dimenticato.
          effetti: { scandalo: 0.5 }

      - testo: "Fargli paura"
        descrizione: "Basta rompere una lastra sola davanti alla figlia, anche se Mauro ha detto intero."
        prova: { attributo: sociale, abilita: intimidire, difficolta: Facile }
        successo:
          titolo: Una lastra sola
          testo: |
            Lasci cadere una lastra sul pavimento senza fretta e il vetraio paga
            il primo mese senza contarlo. Mauro ti chiede quante lastre hai rotto,
            e quando gli dici una sospira come davanti a un bicchiere versato.
          imposta: { debito.scuri: 0 }
          effetti: { fazione.scuri: 1, rep.scuri: 0.5, monete: 8, sospetto: 1 }
        fallimento:
          titolo: La figlia
          testo: |
            La figlia del vetraio ti toglie la lastra di mano con le dita piene di
            tagli vecchi, e il vetraio grida aiuto dalla porta. Te ne vai prima
            che arrivi qualcuno con il mantello rosso.
          effetti: { sospetto: 1 }

      - testo: "Pagare tu il suo debito"
        descrizione: "Un debito saldato da un altro resta saldato, e agli Scuri interessa che il conto torni."
        requisiti: [monete >= 20]
        esito:
          titolo: Chi paga
          testo: |
            Posi la borsa sul tavolo d'angolo e dici a Mauro che il vetraio ha
            pagato. Lui la pesa sul palmo senza aprirla e ride. «Tu sei uno che
            compra la gente. Sbagli il prezzo, però.» Ti restituisce qualche
            moneta, la tua parte del lavoro.
          imposta: { debito.scuri: 0 }
          effetti: { fazione.scuri: 1, rep.scuri: 0.5, monete: -12 }

      - testo: "Chiedere se il lavoro sconta il debito della prigione"
        descrizione: "Gli Scuri ti hanno tolto da una cella, e il tuo nome è nel registro dei favori di Rozalia."
        quando: [debito.scuri >= 1]
        costo: 0
        esito:
          titolo: Il registro dei favori
          testo: |
            Mauro ride tanto che il tavolo zoppo dondola. Il conto lo tiene
            Rozalia, e Rozalia non sconta niente. «Porta il vetraio, e le dico di
            tirare una riga sul tuo nome» dice, battendosi un dito sul naso.

      - testo: "Ascoltare Mauro che ti ricorda Rozalia"
        descrizione: "Avevi promesso a Rozalia Marga un resoconto all'ora del mercato, e alla Pignatta se lo ricordano."
        quando: [resoconto.scuri >= 1, pista.dama-argento >= 10]
        costo: 0
        esito:
          titolo: L'ora del mercato
          testo: |
            «Rozalia ti ha aspettato all'ora del mercato due volte» dice Mauro,
            con il bicchiere a mezz'aria. «La seconda ha comprato le pere, per non
            perdere la mattina. Le pere erano buone, il resoconto non è mai
            arrivato.» Te lo dice sorridendo, e la sedia ti diventa più dura.

      - testo: "Chiedere alla figlia del vetraio che cosa sa"
        descrizione: "Spazzava i cocci quando portavi i pacchi, e sa dove il padre nasconde le cose."
        quando: [origine.figlio-della-citta-bassa >= 1]
        prova: { attributo: sociale, abilita: [empatia, conoscenze-della-strada], difficolta: Facile }
        successo:
          titolo: La polvere verde
          testo: |
            La figlia ti riconosce e ti chiede che cosa c'è nel pacco, come una
            volta. Ti mostra di nascosto la cassetta della polvere verde
            chiedendoti di non fare male al padre, e al vetraio basta vederti con
            la cassetta in mano per pagare il primo mese. Uscendo lei ti dà un
            pezzo di vetro verde levigato come un sasso di fiume.
          pe: { empatia: 5 }
          imposta: { debito.scuri: 0 }
          effetti: { fazione.scuri: 1, rep.scuri: 1, monete: 8 }
        fallimento:
          titolo: Il pacco
          testo: |
            La figlia ti riconosce e si fa scura in faccia, perché adesso sa per
            chi portavi i pacchi. Chiude la porta del retro, e il vetraio ti dice
            che oggi non c'è nessuno da pagare.
          effetti: { scandalo: 0.5 }

      - testo: "Offrirgli di vendere i vetri ai Ponti"
        descrizione: "Al Mercato dei Nodi una partita di lastre buone si vende in un pomeriggio, e la differenza paga il debito."
        quando: [origine.mercante-dei-ponti >= 1]
        esito:
          titolo: Il pomeriggio ai Ponti
          testo: |
            Convinci il vetraio a vendere metà della partita ai banchi dei Ponti,
            dove le lastre valgono più che alla Maison. In un pomeriggio, con un
            carretto tirato dalla figlia, vendi tutto a un mercante che conosci, e
            Mauro conta le monete del primo mese leccandosi il pollice.
          pe: { politica-ed-economia: 5 }
          imposta: { debito.scuri: 0 }
          effetti: { fazione.scuri: 1, rep.scuri: 1, monete: 8 }

  # ------------------------------------------------------------ 1 · il conto del vetraio, dopo Vesh
  - id: scuri-il-conto-del-vetraio-dopo
    presso: macerie-della-pignatta
    immagine: personaggi/gaia-acari
    titolo: Il conto del vetraio
    sommario: "Fra le macerie della Pignatta una ragazzina col cappuccio blu ti aspetta sul bancone bruciato con un lavoro."
    luogo: Le macerie della Pignatta, il bancone di quercia
    area: citta-bassa
    requisiti: [fazione.scuri == 0, pista.pelle >= 6, pista.capomozzo >= 10]
    testo: |
      Gaia Acari è seduta sul bancone di quercia della Pignatta, l'unica cosa
      che il fuoco non si è mangiato, con le gambe a penzoloni e il cappuccio
      blu tirato fino al naso. Ti fa segno di sederti accanto a lei, come se
      il bancone fosse suo.

      «Quelli che sono rimasti hanno bisogno di una faccia che le guardie non
      conoscono» dice. «Il vetraio di Via del Salmone non paga da quando qui
      è bruciato tutto, perché secondo lui gli Scuri sono morti con Mirko.»
      Fa la voce grossa di Mauro, così uguale che ti volti a cercarlo. «Una
      gamba rotta non lavora, e chi resta a casa dal banco i debiti non li
      paga.» Poi torna la sua. «Era la regola di casa, e noi la teniamo.»

      {intimidire Media} Ha detto *teniamo* come una parola troppo grande per
      lei, e l'ha detta lo stesso.

      Il vetraio ha una figlia apprendista e una partita di lastre pronta per
      la Maison, e da qualche settimana alla sua porta bussano anche certi
      uomini con le orecchie piene di anelli di rame.
    opzioni:
      - testo: "Guardare bene i vetri della partita"
        descrizione: "Una partita di vetri per la Maison costa più di quanto un vetraio di Via del Salmone possa comprare."
        prova: { attributo: mentale, abilita: [percezione, politica-ed-economia], difficolta: Media }
        successo:
          titolo: Il verde nel vetro
          testo: |
            Nella lastra controluce trovi la vena verdina della polvere senza
            timbro, e il vetraio capisce che chi sa del vetro sa anche dove lo
            compra. Paga il primo mese chiedendo se quelli con gli anelli di rame
            torneranno, e Gaia gli dice di no con una sicurezza che non ha.
          pe: { percezione: 5 }
          imposta: { debito.scuri: 0 }
          effetti: { fazione.scuri: 1, rep.scuri: 1, monete: 8 }
        fallimento:
          titolo: Il vetro è vetro
          testo: |
            Per te le lastre sono vetri e basta, e il vetraio se ne accorge e ti
            spiega che con la Pignatta è bruciato anche il suo debito. Gaia ti
            tira fuori per la manica. «Ripassiamo» dice, e sputa nel tombino.
          effetti: { scandalo: 0.5 }

      - testo: "Proporgli di pagare a rate"
        descrizione: "Un debito a rate è un debito che si paga, e chi paga voi non ha monete per gli altri."
        prova: { attributo: sociale, abilita: [persuasione, politica-ed-economia], difficolta: Media }
        successo:
          titolo: Prima degli altri
          testo: |
            Fate i conti sul banco con un pezzo di carbone, una rata alla settimana con la prima subito. Il
            vetraio paga quando gli fai notare che chi paga gli Scuri ha già un padrone, e i padroni nuovi
            bussano solo alle botteghe libere.
          pe: { persuasione: 5 }
          imposta: { debito.scuri: 0 }
          effetti: { fazione.scuri: 1, rep.scuri: 1, monete: 8 }
        fallimento:
          titolo: Chi bussa più forte
          testo: |
            Il vetraio ti risponde che ci penserà, e in Via del Salmone vuol dire
            che pagherà chi bussa più forte. Fuori Gaia ti dice che domani ci
            torni, e stavolta bussi tu.
          effetti: { scandalo: 0.5 }

      - testo: "Fargli paura"
        descrizione: "Una lastra rotta davanti alla figlia, una sola, perché la regola di casa dice intero."
        prova: { attributo: sociale, abilita: intimidire, difficolta: Facile }
        successo:
          titolo: Una lastra sola
          testo: |
            Lasci cadere una lastra sul pavimento senza fretta, e il vetraio paga
            il primo mese senza contarlo. Fuori Gaia ti dice che Mirko avrebbe
            rotto la lastra più piccola, che faceva lo stesso rumore.
          imposta: { debito.scuri: 0 }
          effetti: { fazione.scuri: 1, rep.scuri: 0.5, monete: 8, sospetto: 1 }
        fallimento:
          titolo: La figlia
          testo: |
            La figlia del vetraio ti sfila la lastra di mano con le dita piene di
            tagli vecchi, e il vetraio grida dalla porta. Gaia è già in fondo alla
            via, e dietro l'angolo fa finta di non averti mai visto.
          effetti: { sospetto: 1 }

      - testo: "Pagare tu il suo debito"
        descrizione: "Un debito saldato da un altro resta saldato, e a chi è rimasto interessa che il conto torni."
        requisiti: [monete >= 20]
        esito:
          titolo: Chi paga
          testo: |
            Posi la borsa sul bancone bruciato e dici a Gaia che il vetraio ha
            pagato. Lei la soppesa e scuote la testa. «Così non funziona, perché
            se paghi tu domani lui non paga nessuno» dice, ma la borsa la tiene, e
            ti restituisce la tua parte contata con molta cura.
          imposta: { debito.scuri: 0 }
          effetti: { fazione.scuri: 1, rep.scuri: 0.5, monete: -12 }

      - testo: "Chiedere se il lavoro sconta il debito della prigione"
        descrizione: "Gli Scuri ti hanno tolto da una cella, e il tuo nome era nel registro dei favori di Rozalia."
        quando: [debito.scuri >= 1]
        costo: 0
        esito:
          titolo: Il registro bruciato
          testo: |
            Gaia ci pensa battendo i talloni sul bancone. «Il registro dei favori
            è bruciato col retrobottega, ma il tuo nome me lo ricordo io» dice.
            «Porta il vetraio, e vedrai che me lo dimentico.»

      - testo: "Chiedere alla figlia del vetraio che cosa sa"
        descrizione: "Lei spazzava i cocci quando tu portavi i pacchi per Via del Salmone."
        quando: [origine.figlio-della-citta-bassa >= 1]
        prova: { attributo: sociale, abilita: [empatia, conoscenze-della-strada], difficolta: Facile }
        successo:
          titolo: La polvere verde
          testo: |
            La figlia ti riconosce e ti racconta che quelli con gli anelli di rame
            sono già passati a prendersi una lastra senza pagarla. Ti mostra la
            cassetta della polvere verde e ti chiede di tenerli lontani, e il
            padre, capito che lo proteggerai, paga il primo mese.
          pe: { empatia: 5 }
          imposta: { debito.scuri: 0 }
          effetti: { fazione.scuri: 1, rep.scuri: 1, monete: 8 }
        fallimento:
          titolo: Il pacco
          testo: |
            La figlia ti riconosce e si fa scura in faccia, perché adesso sa per
            chi portavi i pacchi. Il vetraio ti dice che oggi non c'è nessuno da
            pagare, e Gaia, fuori su un paracarro, non ti chiede com'è andata.
          effetti: { scandalo: 0.5 }

  # ------------------------------------------------------------ 2 · la spalla del baro, prima di Vesh
  - id: scuri-la-spalla-del-baro
    presso: orlo-dei-rottami
    immagine: personaggi/nihali-cuzan
    titolo: La spalla del baro
    sommario: "Alla cisterna rovesciata dell'Orlo un ispettore della Gilda vince troppo, sempre al tavolo di Nihali Cuzan."
    luogo: Orlo dei Rottami, la cisterna rovesciata, di notte
    area: citta-bassa
    requisiti: [fazione.scuri == 1, pista.pelle < 4]
    testo: |
      Alla cisterna rovesciata dei Precursori, all'Orlo, il biglietto di
      Mauro lo legge Nihali Cuzan, seduto sulla sua cassa di ferro
      inchiodata al pavimento, fra un colpo di tosse e l'altro nel
      fazzoletto ricamato. Ha le mani più curate della Città Bassa e le
      tiene sempre in vista.

      Al suo tavolo, da tre sere, un ispettore della Gilda con il distintivo
      dei Custodi in tasca vince quasi sempre. «Mi serve una spalla» dice
      Nihali. «Uno che perde quando serve, e intanto guarda le mani giuste.
      Le mie le guardano già tutti.»

      {ingannare Media} L'ispettore ride troppo quando vince e troppo poco
      quando perde. Ha bisogno che la bisca lo veda vincere.

      {origine apprendista-raschiatore} Sul retro della cisterna c'è una
      fessura nella lamiera all'altezza del ginocchio, da cui da ragazzino
      passavi per rubare le candele.
    opzioni:
      - testo: "Sederti al tavolo e perdere al momento giusto"
        descrizione: "Bisogna perdere la mano che conta, e farla sembrare sfortuna."
        quando: [colpo.bisca == 0]
        prova: { attributo: sociale, abilita: [ingannare, espressivita], difficolta: Media }
        successo:
          titolo: La mano che conta
          testo: |
            Perdi tre mani piccole sbuffando, e quando l'ispettore alza la posta
            cali una carta sbagliata con l'aria offesa del perdente nato. Lui si
            rilassa e comincia a guardare te invece di Nihali, e a fine serata se
            ne va più leggero. Nihali ti allunga una regina di picche con l'angolo
            piegato, per Rozalia.
          pe: { ingannare: 5 }
          effetti: { fazione.scuri: 1, rep.scuri: 0.5, monete: 10 }
        fallimento:
          titolo: La mano sbagliata
          testo: |
            Perdi le mani piccole come d'accordo, poi per distrazione vinci quella
            grossa, e l'ispettore se ne va senza finire il bicchiere. Nihali ti
            dice di tornare quando avrai imparato a perdere.

            {ingannare Media fallita} Ti eri preparato tutto, tranne la
            possibilità di avere una mano buona davvero.
          effetti: { sospetto: 0.5 }

      - testo: "Guardare le mani dell'ispettore"
        descrizione: "Chi vince tre sere di fila contro Nihali ha un aiuto, da trovare senza farsi notare."
        quando: [colpo.bisca == 0]
        prova: { attributo: mentale, abilita: percezione, difficolta: Difficile }
        successo:
          titolo: La cera della Gilda
          testo: |
            Alle spalle dell'ispettore vedi il suo pollice passare sull'angolo
            delle carte prima di girarle, dove c'è un velo di cera rossa dei
            sigilli della Gilda che alla luce gialla della bisca non si vede.
            Nihali sorride per la prima volta e ti dà una regina di picche con
            l'angolo piegato, da portare a Rozalia.
          pe: { percezione: 5 }
          effetti: { fazione.scuri: 1, rep.scuri: 0.5, monete: 10, informazioni.segreto: 1 }
        fallimento:
          titolo: Lo sguardo
          testo: |
            Lo guardi giocare così a lungo che alla fine l'ispettore si volta e ti
            chiede se vuoi una sedia o un ritratto. Mezza bisca ride, e per
            stasera la spalla la fa qualcun altro.
          effetti: { sospetto: 1 }

      - testo: "Passare la serata a servire da bere"
        descrizione: "Chi porta i boccali sente tutto e nessuno lo guarda, anche se è lavoro lungo e pagato poco."
        quando: [colpo.bisca == 0]
        costo: 2
        esito:
          titolo: I boccali
          testo: |
            Porti boccali per tutta la notte. L'ispettore beve molto, e a ogni
            giro ordina anche per due uomini seduti in fondo, che non giocano.
            All'alba Nihali guarda i due andarsene e ti dà una regina di picche
            con l'angolo piegato, da portare a Rozalia.
          pe: { resistenza: 3 }
          effetti: { fazione.scuri: 1, rep.scuri: 0.5, monete: 4 }

      - testo: "Convincere Nihali che quella notte non c'eri"
        descrizione: "Nihali si ricorda bene la notte in cui hai svuotato la sua cassa con Galdrick."
        quando: [colpo.bisca >= 1]
        prova: { attributo: sociale, abilita: [ingannare, persuasione], difficolta: Difficile }
        successo:
          titolo: Una faccia somigliante
          testo: |
            Gli racconti che quella notte eri a Laresh, con il nome della locanda
            e il prezzo della zuppa. Nihali ti dice che hai una faccia molto
            somigliante, e che le facce somiglianti gli portano sfortuna, ma ti
            mette al tavolo lo stesso. A fine serata ti dà una regina di picche
            con l'angolo piegato.
          pe: { ingannare: 5 }
          effetti: { fazione.scuri: 1, rep.scuri: 0.5, monete: 10 }
        fallimento:
          titolo: Il conto della cassa
          testo: |
            Nihali ti lascia finire, poi ti elenca moneta per moneta quello che
            mancava nella cassa. Paghi una parte e il resto lo perdi al suo
            tavolo, e all'alba ti dà la regina di picche.
          effetti: { fazione.scuri: 1, rep.scuri: -0.5, monete: -10, sospetto: 0.5 }

      - testo: "Pagare la cassa della bisca e chiedere scusa"
        descrizione: "Restituire quello che hai preso con Galdrick è il modo più rapido per tornare al suo tavolo."
        quando: [colpo.bisca >= 1]
        requisiti: [monete >= 25]
        esito:
          titolo: Le monete sul tavolo
          testo: |
            Posi sul tavolo di Nihali le monete già contate in pile, e lui le fa
            scivolare nel cassetto con il dorso della mano. «Le scuse non le
            prendo. Queste sì.» Fai da spalla al suo tavolo fino all'alba, e ti
            guadagni una regina di picche con l'angolo piegato, per Rozalia.
          effetti: { fazione.scuri: 1, monete: -25 }

      - testo: "Guardare il tavolo dalla fessura sul retro"
        descrizione: "Dalla fessura nella lamiera si vedono le mani dei giocatori da sotto il tavolo."
        quando: [origine.apprendista-raschiatore >= 1, colpo.bisca == 0]
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Facile }
        successo:
          titolo: Sotto il tavolo
          testo: |
            Ti infili nella fessura come da ragazzino, solo più a fatica, e da
            sotto il tavolo vedi il pollice dell'ispettore lisciare gli angoli
            delle carte segnati con la cera rossa dei sigilli della Gilda.
            All'alba Nihali ti dà una regina di picche con l'angolo piegato, da
            portare a Rozalia.
          pe: { furtivita: 5 }
          effetti: { fazione.scuri: 1, rep.scuri: 0.5, monete: 10, informazioni.segreto: 1 }
        fallimento:
          titolo: La lamiera
          testo: |
            La fessura è più stretta di come la ricordavi, o tu sei più largo, e
            ti libera un ragazzino dell'Orlo ridendo così forte da farsi sentire
            ai tavoli. Nihali ti guarda passare con le mani sbucciate e non dice
            niente.
          effetti: { sospetto: 0.5 }

  # ------------------------------------------------------------ 2 · la spalla del baro, dopo Vesh
  - id: scuri-la-spalla-del-baro-dopo
    presso: orlo-dei-rottami
    immagine: ambientazione/orlo-dei-rottami
    titolo: I gettoni d'argilla
    sommario: "La bisca della cisterna rovesciata ha nuovi padroni, e chi perde paga con gettoni d'argilla."
    luogo: Orlo dei Rottami, la cisterna rovesciata, di notte
    area: citta-bassa
    requisiti: [fazione.scuri == 1, pista.pelle >= 6]
    testo: |
      Sulla cassa di ferro della cisterna, dove sedeva Nihali Cuzan, adesso
      siede un mercenario di Ghoran con le orecchie piene di anelli di rame.
      Sui tavoli, al posto delle monete, ci sono pile di gettoni d'argilla
      con un segno inciso.

      Gaia si è fermata sulla soglia, dove la luce non arriva. «Prima era di
      Nihali. Adesso è di quelli che la Caserma ha portato da Ghoran e poi
      si è scordata di pagare.» Fra i tavoli senti un nome detto a mezza
      voce, sempre lo stesso, quello di Durgan.

      {origine fuggiasco-di-ghoran} Il segno sui gettoni lo conosci, o ne
      conosci di simili, perché a Ghoran ogni clan ha il suo.
    opzioni:
      - testo: "Giocare e contare le carte"
        descrizione: "I mercenari giocano forte e contano male, e chi tiene il conto delle carte vince."
        prova: { attributo: mentale, abilita: [percezione, politica-ed-economia], difficolta: Media }
        successo:
          titolo: La pila
          testo: |
            Giochi fino a tardi tenendo a mente le carte uscite e vinci una pila
            di gettoni alta un palmo. Il mercante della cassa li cambia
            brontolando e te ne lascia uno, da portare a chi deve vederlo, e fuori
            Gaia lo rigira fra le dita senza più parlare.
          pe: { percezione: 5 }
          effetti: { fazione.scuri: 1, rep.scuri: 0.5, monete: 10 }
        fallimento:
          titolo: I gettoni degli altri
          testo: |
            Perdi tutto, e il mercenario della cassa ti dà un gettone d'argilla al
            posto del resto. «Il clan paga quando torna» dice, fra le risate degli
            altri. Fuori Gaia fa una smorfia che le arriccia tutte le lentiggini.
          effetti: { monete: -5, tormento: 0.5 }

      - testo: "Capire chi conia i gettoni"
        descrizione: "Un gettone d'argilla è facile da fare, ma il segno lo incide sempre la stessa mano."
        prova: { attributo: mentale, abilita: [politica-ed-economia, accademiche], difficolta: Media }
        successo:
          titolo: La mano che incide
          testo: |
            Alla lanterna il segno è una mano aperta a tre dita, e su tutti i
            gettoni il solco è più profondo a sinistra, come lo fa chi incide con
            la destra e preme troppo. «Li fa uno solo» dici a Gaia, e lei ripete
            il nome che si sente fra i tavoli.
          pe: { politica-ed-economia: 5 }
          effetti: { fazione.scuri: 1, rep.scuri: 0.5, monete: 6, informazioni.pettegolezzo: 1 }
        fallimento:
          titolo: Tutti uguali
          testo: |
            Confronti i gettoni alla lanterna finché ti si incrociano gli occhi, e
            ti sembrano tutti uguali. Un mercenario ti chiede se li vuoi comprare
            o sposare, e Gaia ti porta via per la manica.
          effetti: { scandalo: 0.5 }

      - testo: "Offrire da bere al tavolo dei mercenari"
        descrizione: "Chi non vede la paga da settimane beve volentieri a spese d'altri, e bevendo parla del capo."
        requisiti: [monete >= 6]
        esito:
          titolo: Il nano
          testo: |
            Al terzo giro pagato da te i mercenari ti parlano di Durgan, un nano con
            la faccia piena di cicatrici che sedeva al tavolo di Mauro prima del
            fuoco e adesso è l'unico che trova da pagarli. Uno ti regala un gettone
            d'argilla, e Gaia, quando glielo mostri, smette di parlare.
          effetti: { fazione.scuri: 1, rep.scuri: 0.5, monete: -6 }

      - testo: "Riconoscere il segno del clan"
        descrizione: "A Ghoran ogni clan firma con il suo segno, e questo l'hai già visto sui carri della bilancia."
        quando: [origine.fuggiasco-di-ghoran >= 1]
        prova: { attributo: sociale, abilita: [conoscenze-della-strada, intimidire], difficolta: Facile }
        successo:
          titolo: La mano con tre dita
          testo: |
            La mano aperta a tre dita è il segno di un clan che a Ghoran comprava
            e rivendeva, e lo vedevi sui carri coperti. Lo dici al mercenario
            della cassa nella lingua dei clan, e lui ti cambia i gettoni senza
            discutere e te ne lascia uno da portare a chi deve vederlo.
          pe: { conoscenze-della-strada: 5 }
          effetti: { fazione.scuri: 1, rep.scuri: 0.5, monete: 6, informazioni.pettegolezzo: 1 }
        fallimento:
          titolo: La lingua dei clan
          testo: |
            Il mercenario ti risponde ridendo in un dialetto più a sud del tuo, e
            te ne vai prima che ti chieda da quale clan sei scappato.
          effetti: { tormento: 0.5 }

  # ------------------------------------------------------------ 3 · firme, prima di Vesh
  - id: scuri-firme
    presso: pignatta-grassa
    immagine: personaggi/rozalia-marga
    titolo: Firme
    sommario: "Nel retrobottega della Pignatta Rozalia Marga guarda la tua carta e decide che puoi portare una lettera."
    luogo: Pignatta Grassa, il retrobottega
    area: citta-bassa
    requisiti: [fazione.scuri == 2, pista.pelle < 4]
    testo: |
      Il retrobottega della Pignatta è più ordinato della bottega di un
      notaio, con le cartelle di cuoio in fila per famiglia e per mestiere,
      tutte etichettate nella stessa grafia diritta. Rozalia Marga lavora
      sotto la sola finestra, con la piuma d'oca dietro l'orecchio e
      l'inchiostro fino alla seconda falange, e infila la regina di picche di
      Nihali in una cartella senza commenti.

      «Per la precisione, tesoro, Nihali non regala carte a nessuno» dice.
      Dal tavolo prende un foglio con il sigillo della Gilda, una licenza per
      i carichi notturni sui Ponti, e ci soffia sopra. «Questa va a Cosimo
      Venn, alla Casa dei Nodi. Da sei anni compra i suoi permessi da me, e
      da sei anni prova a pagarli meno. Tu porti la licenza e riporti la
      cifra intera.»

      {origine rampollo-dei-quartieri-alti} Una delle cartelle porta il nome
      di un Casato che a casa tua si invitava a cena.

      In fondo alla licenza manca la firma del collaudo, e Rozalia te la
      indica con la punta della piuma. *Vuole vedere che mano ho.* Le tue
      dita, sul bordo del tavolo, si sono già messe a tamburellare.
    opzioni:
      - testo: "Prendere la licenza così com'è"
        descrizione: "La firma del collaudo la mette Venn, che è il suo mestiere, e tu fai il corriere."
        esito:
          titolo: La busta
          testo: |
            Rozalia piega la licenza in tre e la chiude in una busta. «La firma la
            mette lui, che per una volta lavora» dice, e alla porta ti ripete la
            cifra due volte.
          segue: scuri-firme-venn

      - testo: "Firmare tu la riga del collaudo"
        descrizione: "Rozalia ha lasciato la riga vuota apposta, con accanto la firma del funzionario da copiare."
        prova: { attributo: mentale, abilita: [accademiche, percezione], difficolta: Media }
        successo:
          titolo: La mano ferma
          testo: |
            Copi la firma tenendo la penna alta come quel funzionario, e chiudi
            l'ultima lettera con il suo ricciolo stanco. «Tesoro, hai la mano di
            un impiegato del catasto» dice Rozalia, e da lei è un complimento.
            Chiude la licenza in una busta e ti ripete la cifra due volte.
          pe: { accademiche: 5 }
          segue: scuri-firme-venn
        fallimento:
          titolo: Il ricciolo
          testo: |
            Il ricciolo ti viene grasso come quello di un bambino che impara le
            lettere. Rozalia gratta via l'inchiostro prima che si asciughi e rifà
            la firma lei, senza guardare il modello.
          segue: scuri-firme-venn
          effetti: { scandalo: 0.5 }

      - testo: "Chiederle chi è Cosimo Venn"
        descrizione: "Venn compra permessi falsi da sei anni, e Rozalia sa sempre più di quello che dice."
        costo: 0
        esito:
          titolo: La cartella della Gilda
          testo: |
            Rozalia apre una cartella più spessa delle altre, con l'etichetta
            *Gilda*, piena di nomi con accanto colonne di date. Venn è un
            ispettore dei lotti con gli stivali sempre puliti, e gli altri della
            cartella stanno più in alto. «A quelli, tesoro, gli stivali li
            puliscono altri» dice.

      - testo: "Sfogliare la cassetta delle firme di famiglia"
        descrizione: "Nella cassetta di ferro sul tavolo ci sono le firme dei Casati, e una cartella ti riguarda."
        quando: [origine.rampollo-dei-quartieri-alti >= 1]
        esito:
          titolo: La firma di tuo padre
          testo: |
            Mentre Rozalia sigilla la licenza apri la cartella della tua famiglia
            e ci trovi la firma di tuo padre ricopiata venti volte, ogni volta un
            po' meglio. «Firma bene, tuo padre» dice Rozalia, senza fermarti. «Con
            le maiuscole si vede che ha studiato.» Poi ti mette in mano la busta
            per Venn.
          segue: scuri-firme-venn

  # ------------------------------------------------------------ 3 · firme, dopo Vesh, con Rozalia libera
  - id: scuri-firme-dopo
    immagine: personaggi/rozalia-marga
    titolo: Firme
    sommario: "Gaia ti porta in una cantina di Via del Salmone, dove Rozalia Marga tiene la cassetta delle firme."
    luogo: Città Bassa, una cantina di Via del Salmone
    area: citta-bassa
    requisiti: [fazione.scuri == 2, pista.pelle >= 6, macerie.rozalia != 2]
    testo: |
      La cantina sta sotto una rivendita di sale, e ci si scende da una
      botola dietro il banco. In fondo, su un tavolo fatto con due botti e
      una porta, c'è la cassetta di ferro annerita dal fuoco della Pignatta,
      e accanto la lanterna cieca di Rozalia Marga.

      Rozalia gira due volte fra le dita macchiate d'inchiostro il gettone
      d'argilla che le porge Gaia, e lo fa sparire in una tasca. «Di giorno
      scrivo lettere per le lavandaie, tesoro. La notte, per la precisione,
      scrivo ancora per chi paga meglio» dice. Dalla cassetta tira fuori un
      foglio con il sigillo della Gilda, una licenza per i carichi notturni
      sui Ponti. «Cosimo Venn, alla Casa dei Nodi. Da sei anni compra i suoi
      permessi da me, e il fuoco non gli ha fatto passare la voglia.»

      {galateo Media} Ha detto *tesoro* a te e non a Gaia. Gaia se n'è
      accorta, e guarda il soffitto.

      In fondo alla licenza manca la firma del collaudo, e Rozalia te la
      indica con la punta della piuma.
    opzioni:
      - testo: "Prendere la licenza così com'è"
        descrizione: "La firma del collaudo la mette Venn, e tu fai solo il corriere."
        esito:
          titolo: La busta
          testo: |
            Rozalia piega la licenza in tre e passa il dorso dell'unghia sulla
            piega, poi ti ripete la cifra due volte, la seconda guardando Gaia.
          imposta: { macerie.rozalia: 3 }
          segue: scuri-firme-venn

      - testo: "Firmare tu la riga del collaudo"
        descrizione: "Rozalia ha lasciato la riga vuota apposta, con la firma da copiare su un'altra carta."
        prova: { attributo: mentale, abilita: [accademiche, percezione], difficolta: Media }
        successo:
          titolo: La mano ferma
          testo: |
            Copi la firma tenendo la penna alta, come la tiene quel funzionario, e
            chiudi l'ultima lettera con il suo ricciolo stanco. Rozalia guarda te
            più a lungo del foglio. «Tesoro, con una mano così ti apro un tavolo»
            dice, e chiude la licenza in una busta.
          pe: { accademiche: 5 }
          imposta: { macerie.rozalia: 3 }
          segue: scuri-firme-venn
        fallimento:
          titolo: Il ricciolo
          testo: |
            Il ricciolo ti viene grasso come quello di uno scolaro. Rozalia gratta
            via l'inchiostro e rifà la firma lei senza guardare il modello, mentre
            Gaia ridacchia nel cappuccio, poi ti consegna la busta.
          imposta: { macerie.rozalia: 3 }
          segue: scuri-firme-venn
          effetti: { scandalo: 0.5 }

      - testo: "Chiederle chi è Cosimo Venn"
        descrizione: "Un ispettore dei lotti che compra permessi falsi da sei anni, e che il fuoco non ha spaventato."
        costo: 0
        esito:
          titolo: La cartella della Gilda
          testo: |
            Dalla cassetta Rozalia tira fuori un fascio etichettato *Gilda*,
            decine di nomi con le loro date. Venn è un ispettore dei lotti con gli
            stivali sempre puliti, mentre gli altri stanno più in alto. «Adesso
            che Mirko non paga più, tesoro, qualcuno li sta comprando» dice.

  # ------------------------------------------------------------ 3 · firme, dopo Vesh, con Rozalia in cella
  - id: scuri-firme-dalla-cella
    presso: guarnigione-di-qir-azel
    immagine: personaggi/rozalia-marga
    titolo: Firme
    sommario: "Rozalia Marga è in una cella della Caserma, e una licenza falsa si può fare anche attraverso una grata."
    luogo: Guarnigione di Qir-Azel, le celle del piano interrato
    area: quartieri-alti
    requisiti: [fazione.scuri == 2, pista.pelle >= 6, macerie.rozalia == 2]
    testo: |
      Gaia ti ha detto quale guardia si lascia comprare con una pagnotta, e
      la pagnotta è bastata. Nelle celle umide del piano interrato una
      goccia cade da una grata sempre nello stesso punto, e Rozalia Marga ci
      ha messo sotto il piatto del rancio per contarle.

      «In cella mi hai portata tu, e adesso vieni a chiedermi lavoro» dice
      senza voltarsi. «Per la precisione è la cosa più divertente che mi sia
      successa da quando sono entrata.» La piuma gliel'hanno tolta, e dietro
      l'orecchio si è infilata uno stecco di paglia. «Cosimo Venn, alla Casa
      dei Nodi, compra da me da sei anni, e vuole una licenza per i carichi
      notturni. Io qui dentro sono senza carta, e tu fuori sei senza mano.
      Vediamo chi dei due la fa, tesoro.»

      {empatia Media} Ride, e intanto si stringe le braccia intorno ai
      fianchi per il freddo. Il lavoro le serve per sentirsi ancora Rozalia.

      La guardia in cima alle scale si è seduta e ha girato lo sgabello
      verso il cortile.
    opzioni:
      - testo: "Copiare la firma seguendo la sua voce"
        descrizione: "Rozalia ti detta la firma un tratto alla volta attraverso la grata, e tu scrivi sul ginocchio."
        prova: { attributo: mentale, abilita: [accademiche, percezione], difficolta: Media }
        successo:
          titolo: Un tratto alla volta
          testo: |
            Rozalia ti detta la firma tratto per tratto, con la fronte contro le
            sbarre e gli occhi chiusi, e tu la copi sul ginocchio. Quando hai
            finito la guarda a lungo, poi ti dice di piegarla in tre.
          pe: { accademiche: 5 }
          segue: scuri-firme-venn
        fallimento:
          titolo: L'inchiostro sul ginocchio
          testo: |
            Al terzo tratto la goccia della grata cade sul foglio e l'inchiostro
            si allarga come un fiore. Rozalia torna a contare le gocce nel piatto
            e ti dice di ripassare domani.
          effetti: { tormento: 0.5 }

      - testo: "Farle passare carta e inchiostro sotto la porta"
        descrizione: "La guardia ha girato lo sgabello verso il cortile, e sotto la porta passano foglio e boccetta."
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Media }
        successo:
          titolo: La sua mano
          testo: |
            Fai scivolare foglio e boccetta sotto la porta, e Rozalia li prende
            con due dita come cose sue. Scrive in ginocchio sulla panca con lo
            stecco di paglia intinto nell'inchiostro, e la firma le viene perfetta
            lo stesso.
          pe: { furtivita: 5 }
          segue: scuri-firme-venn
        fallimento:
          titolo: La boccetta
          testo: |
            La boccetta ti scivola dalle dita e rotola sulla pietra con un rumore
            che sale per le scale. La guardia si gira, e te ne vai con la scusa
            della pagnotta mentre Rozalia torna a contare le gocce.
          effetti: { sospetto: 1 }

      - testo: "Pagare un copista del Municipio"
        descrizione: "Al Municipio c'è sempre un copista che arrotonda la paga, e Rozalia sa quale."
        requisiti: [monete >= 15]
        esito:
          titolo: Il copista
          testo: |
            Rozalia ti dà il nome di un copista del Municipio e quello di sua
            moglie, perché è con lei che si tratta. Prima di sera la licenza è
            pronta, con una firma un po' troppo pulita, e Rozalia sospira che Venn
            non se ne accorgerà.
          effetti: { monete: -15 }
          segue: scuri-firme-venn

  # ------------------------------------------------------------ 3 · il seguito, alla Casa dei Nodi (grado 1)
  - id: scuri-firme-venn
    immagine: personaggi/rozalia-marga
    titolo: Cosimo Venn
    tipo: seguito
    luogo: Casa dei Nodi, la sala degli ispettori dei lotti
    area: quartieri-alti
    requisiti: [fazione.scuri == 2]
    testo: |
      Alla Casa dei Nodi gli ispettori dei lotti lavorano in una sala lunga al
      primo piano. Cosimo Venn ha lo scrittoio in fondo, vicino alla finestra,
      ed è un uomo magro dagli stivali puliti che mastica menta. Copre la
      busta con il libro dei lotti prima ancora che tu l'abbia posata.

      Legge la licenza arrossendo fino alle orecchie, poi conta le monete in
      pile, meno di quelle che ti ha detto Rozalia. «I tempi sono quelli che
      sono» dice, «e i carichi di notte rendono meno.» Nel cassetto, sotto le
      monete, c'è un quaderno nero dove scrive una riga ogni volta che paga
      qualcuno.

      {ingannare Media} I carichi di notte rendono come sempre. Venn prova con
      te il discorso che ha fatto a Rozalia per sei anni.

      *Quanto in alto arrivano, gli Scuri?* La mano ti va da sola alla busta
      vuota in tasca.
    opzioni:
      - testo: "Pretendere la cifra intera"
        descrizione: "Rozalia ti ha ripetuto la cifra due volte, e una licenza così si paga intera."
        prova: { attributo: sociale, abilita: [persuasione, intimidire], difficolta: Media }
        successo:
          titolo: Le pile da cinque
          testo: |
            Gli dici a voce bassa che le licenze per i carichi notturni le fa una
            persona sola in città, e che ha una memoria eccellente, e Venn conta
            altre due pile senza alzare gli occhi. La sera Rozalia ti scrive nel
            suo registro fra le facce nuove degli Scuri e ti dà la tua parte e uno
            stiletto da manica.
          pe: { persuasione: 5 }
          almeno: { rep.scuri: 2 }
          imposta: { contatto-ombra: 1, debito.scuri: 0 }
          effetti: { fazione.scuri: 1, monete: 35, oggetto.scuri-stiletto-da-manica: 1 }
        fallimento:
          titolo: I tempi
          testo: |
            Venn ti spiega i tempi con tanta pazienza che alla fine sembrano duri
            anche a te. La sera Rozalia pesa la borsa con un sospiro e ti scrive
            lo stesso nel registro, con una parte più piccola e uno stiletto da
            manica.
          almeno: { rep.scuri: 2 }
          imposta: { contatto-ombra: 1, debito.scuri: 0 }
          effetti: { fazione.scuri: 1, monete: 20, oggetto.scuri-stiletto-da-manica: 1, scandalo: 0.5 }

      - testo: "Copiare il quaderno nero mentre conta"
        descrizione: "Mentre Venn conta, il quaderno nero dove segna i pagamenti resta aperto nel cassetto."
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Difficile }
        successo:
          titolo: Il quaderno nero
          testo: |
            Sporgendoti sul cassetto leggi le ultime pagine del quaderno nero,
            nomi di funzionari della Gilda con date e cifre, e la sera li ricopi a
            memoria. Rozalia guarda la tua copia più a lungo della borsa e ti
            scrive nel suo registro, con la tua parte e uno stiletto da manica.
          pe: { furtivita: 5 }
          almeno: { rep.scuri: 2 }
          imposta: { contatto-ombra: 1, debito.scuri: 0, scuri.venn: 1 }
          effetti: { fazione.scuri: 1, monete: 25, oggetto.scuri-stiletto-da-manica: 1 }
        fallimento:
          titolo: La lingua
          testo: |
            Venn chiude il cassetto con il ginocchio senza smettere di contare, e
            quella sera alla Casa dei Nodi qualcuno chiede il tuo nome al
            portiere. Rozalia ti scrive lo stesso nel registro, con la tua parte e
            uno stiletto da manica.
          almeno: { rep.scuri: 2 }
          imposta: { contatto-ombra: 1, debito.scuri: 0 }
          effetti: { fazione.scuri: 1, monete: 25, sospetto: 1.5, oggetto.scuri-stiletto-da-manica: 1 }

      - testo: "Prendere quello che dà e andartene"
        descrizione: "Una borsa leggera è sempre una borsa, e Rozalia farà i suoi conti."
        esito:
          titolo: La borsa leggera
          testo: |
            Prendi le pile senza contarle, e Venn ti saluta sollevato. La sera
            Rozalia soppesa la borsa due volte e ti scrive nel registro con un
            tratto più corto del solito, con una parte piccola e uno stiletto da
            manica.
          almeno: { rep.scuri: 2 }
          imposta: { contatto-ombra: 1, debito.scuri: 0 }
          effetti: { fazione.scuri: 1, monete: 20, oggetto.scuri-stiletto-da-manica: 1 }

      - testo: "Parlargli nella lingua dei banchi"
        descrizione: "Al Mercato dei Nodi chi abbassa il prezzo con la scusa dei tempi finisce in fila con gli altri."
        quando: [origine.mercante-dei-ponti >= 1]
        prova: { attributo: sociale, abilita: [persuasione, politica-ed-economia], difficolta: Facile }
        successo:
          titolo: Il listino
          testo: |
            Gli citi il listino dei carichi notturni al Mercato dei Nodi di questa
            settimana e di quella prima, e Venn smette di parlare dei tempi e
            conta le pile giuste. La sera Rozalia ti scrive nel suo registro e ti
            dà la tua parte e uno stiletto da manica.
          pe: { politica-ed-economia: 5 }
          almeno: { rep.scuri: 2 }
          imposta: { contatto-ombra: 1, debito.scuri: 0 }
          effetti: { fazione.scuri: 1, monete: 35, oggetto.scuri-stiletto-da-manica: 1 }
        fallimento:
          titolo: Uno della Gilda
          testo: |
            Venn ti riconosce per uno della Gilda e invece di pagare di più si
            spaventa, e ti dà le pile in fretta per mandarti via. Rozalia ti
            scrive lo stesso nel registro, con uno stiletto da manica e una parte
            più piccola.
          almeno: { rep.scuri: 2 }
          imposta: { contatto-ombra: 1, debito.scuri: 0 }
          effetti: { fazione.scuri: 1, monete: 20, oggetto.scuri-stiletto-da-manica: 1, scandalo: 0.5 }

  # ------------------------------------------------------------ 4 · la colonna della Maison, prima di Vesh
  - id: scuri-la-colonna-della-maison
    presso: via-dei-rasoi
    immagine: ambientazione/maison-des-lunes
    titolo: La colonna della Maison
    sommario: "La Maison des Lunes paga gli Scuri ogni mese, ma Mirko Vesh vuole sapere chi sale le sue scale."
    luogo: Via dei Rasoi, davanti alla Maison des Lunes
    area: citta-bassa
    requisiti: [fazione.scuri == 3, pista.pelle < 4]
    testo: |
      Nel registro di Rozalia la Maison des Lunes ha una colonna tutta sua,
      e paga ogni mese, sempre in tempo. «A Mirko le monete della Maison non
      interessano» ti dice Mauro al bancone. «Vuole sapere chi sale quelle
      scale e quante volte al mese, e Nerissa Dalvane i nomi non li dà a
      nessuno.»

      Nerissa riceve nel salotto del primo piano e Gretchen tiene il salone,
      con una risata profonda che arriva fino in strada. La Maison ha una
      porta di servizio sul vicolo, e al primo piano una finestra che
      qualcuno lascia sempre socchiusa.

      {empatia Media} Mauro ti manda come un ragazzo a prendere il vino in
      cantina sapendo che la scala è rotta, e gli dispiace un poco.

      {origine rampollo-dei-quartieri-alti} Alcuni di quelli che salgono
      quelle scale li hai visti a cena a casa tua, con la moglie al braccio.
    opzioni:
      - testo: "Trattare con Nerissa"
        descrizione: "Forse Nerissa accetta di scegliere lei che cosa raccontare, in cambio della pace con gli Scuri."
        immagine: personaggi/nerissa-dalvane
        prova: { attributo: sociale, abilita: [persuasione, galateo], difficolta: Difficile }
        successo:
          titolo: Le notizie scelte
          testo: |
            Nerissa ti ascolta davanti al tè, con la mano sul medaglione. Le
            proponi una notizia al mese scelta da lei, e i nomi restano suoi. Ci
            pensa finché il tè si raffredda, poi ti racconta di un consigliere che
            sale ogni giovedì a piangere. A Mirko, dice, può bastare per un mese.
          pe: { persuasione: 5 }
          effetti: { fazione.scuri: 1, rep.scuri: 1, rep.maison: 1, informazioni.segreto: 1 }
        fallimento:
          titolo: La porta accostata
          testo: |
            Nerissa ti spiega con molta gentilezza che nella sua casa decidono le
            ragazze, e le ragazze hanno deciso di non avere memoria. Sulla soglia
            ti dice che il tè, la prossima volta, sarà più caldo.
          effetti: { scandalo: 0.5 }

      - testo: "Piazzare un orecchio al primo piano"
        descrizione: "La finestra socchiusa dà su un corridoio dove la sera si sentono le voci delle stanze."
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Media }
        successo:
          titolo: Il corridoio
          testo: |
            Dalla grondaia del vicolo scavalchi la finestra socchiusa e passi la
            sera seduto nel buio del corridoio. Dalle stanze arrivano due nomi
            detti per intero, e Mauro li ripete sottovoce, contento come un
            bambino. Alla Maison qualcuno trova una tegola spostata, e da quel
            giorno la finestra resta chiusa.
          pe: { furtivita: 5 }
          effetti: { fazione.scuri: 1, rep.scuri: 1, rep.maison: -1, informazioni.segreto: 1 }
        fallimento:
          titolo: Gretchen
          testo: |
            Scavalchi la finestra e ti trovi davanti Gretchen con una candela in
            mano. Ride con la sua risata profonda e ti accompagna giù per la scala
            di servizio tenendoti per l'orecchio, e in strada c'è già chi guarda.
          effetti: { rep.maison: -1, scandalo: 1 }

      - testo: "Coprire Jass con Mauro"
        descrizione: "Jass passa a te quello che sente, e per tenerla basta dire a Mauro che il canale è tuo."
        quando: [jass == 1]
        prova: { attributo: sociale, abilita: [ingannare, persuasione], difficolta: Media }
        successo:
          titolo: Il canale
          testo: |
            Racconti a Mauro di un cliente chiacchierone che hai fatto bere e gli
            porti come prova un nome passato da Jass. Mauro ride e non chiede più
            di lei, e Jass, quando lo sa, ti bacia su una guancia e poi ti chiede
            la sua parte.
          pe: { ingannare: 5 }
          effetti: { fazione.scuri: 1, rep.scuri: 1, informazioni.segreto: 1 }
        fallimento:
          titolo: Mauro sa contare
          testo: |
            Mauro ti fa ripetere il nome del cliente, e la seconda volta lo
            sbagli. Non dice niente e ti batte sulla spalla più forte del solito,
            e la settimana dopo Jass torna a riferire a lui.
          effetti: { fazione.scuri: 1, rep.scuri: -0.5, informazioni.segreto: 1, sospetto: 0.5 }

      - testo: "Fare tu l'orecchio che era di Jass"
        descrizione: "Il posto di Jass nel salone è vuoto, e ci vuole qualcuno con il tempo di passarci le serate."
        quando: [jass >= 2]
        costo: 2
        esito:
          titolo: Le serate nel salone
          testo: |
            Passi tre serate nel salone con un bicchiere che non finisci mai,
            accanto al posto vuoto di Jass. Alla terza Gretchen ti fa portare il
            conto del vino, che è un modo gentile di mandarti via, ma hai già due
            nomi, e Mauro li ripete sottovoce, contento.
          effetti: { fazione.scuri: 1, rep.scuri: 1, rep.maison: -1, informazioni.segreto: 1 }

      - testo: "Comprare da Gretchen una lista di nomi"
        descrizione: "Gretchen manda avanti la casa quando Nerissa è altrove, e anche una lista vecchia di clienti vale qualcosa."
        immagine: personaggi/nerissa-dalvane
        requisiti: [monete >= 20]
        esito:
          titolo: I clienti di una volta
          testo: |
            Gretchen conta le monete a occhi chiusi e ti scrive su un ventaglio di
            carta i nomi di quattro clienti che non vengono più, nomi vecchi che
            Mirko non ha. Mauro ride e dice che Gretchen è la donna più onesta
            della Città Bassa, perché ti ha venduto esattamente quello che ha
            promesso.
          effetti: { fazione.scuri: 1, rep.scuri: 1, monete: -20, informazioni.segreto: 1 }

      - testo: "Salire le scale da cliente"
        descrizione: "Chi sa stare in un salotto dei Quartieri Alti entra nel salone e sa dove guardare."
        quando: [origine.rampollo-dei-quartieri-alti >= 1]
        prova: { attributo: sociale, abilita: [galateo, ingannare], difficolta: Facile }
        successo:
          titolo: Il salone
          testo: |
            Entri dalla porta della catena come entrava tuo zio, con il mantello
            sul braccio, e Gretchen ti fa accomodare senza domande. Due uomini ti
            salutano con il nome di tuo padre e ti dicono i loro, che Mauro ripete
            sottovoce, contento come un bambino.
          pe: { galateo: 5 }
          effetti: { fazione.scuri: 1, rep.scuri: 1, rep.maison: -1, informazioni.segreto: 1 }
        fallimento:
          titolo: Il nome di tuo padre
          testo: |
            Gretchen ti riconosce per il figlio di tuo padre prima che tu apra
            bocca, ti offre un bicchiere e ti chiede, ridendo, se in famiglia
            sanno che sei qui. Prima di domenica lo saprà anche tua madre.
          effetti: { rep.maison: -1, scandalo: 1 }

  # ------------------------------------------------------------ 4 · la colonna della Maison, dopo Vesh
  - id: scuri-la-colonna-della-maison-dopo
    presso: via-dei-rasoi
    immagine: ambientazione/maison-des-lunes
    titolo: La porta di servizio
    sommario: "Alla porta di servizio della Maison des Lunes riscuote un mercenario di Ghoran, e il mese è raddoppiato."
    luogo: Via dei Rasoi, il vicolo della porta di servizio
    area: citta-bassa
    requisiti: [fazione.scuri == 3, pista.pelle >= 6]
    testo: |
      Gaia ti fa accucciare dietro i bidoni della cucina, nel vicolo stretto
      della porta di servizio della Maison, all'ora in cui buttano l'acqua
      dei piatti.

      Alla porta bussa un mercenario di Ghoran con la lancia corta in spalla,
      mentre un compagno con un'ascia aspetta all'imbocco del vicolo. Una
      ragazza della cucina gli dà una borsa, e lui conta le monete e chiede
      l'altra metà, con il piede sulla soglia perché lei non possa chiudere.

      «Prima la Maison pagava gli Scuri e basta» sussurra Gaia. «Adesso paga
      il doppio a Durgan, perché Nerissa sangue sulla porta non ne vuole. Se
      ricomincia a pagare noi, la strada lo vede.»

      {armi-da-mischia Media} La lancia è troppo lunga per questo vicolo,
      l'ascia del compagno no.

      {origine fuggiasco-di-ghoran} Il riscossore parla con l'accento dei
      clan del sud, quello dei sorveglianti che contavano le teste nei
      recinti la sera.
    opzioni:
      - testo: "Difendere la porta"
        descrizione: "Due mercenari in un vicolo stretto, e se li mandi via la Maison sa chi l'ha protetta."
        combattimento: scuri-la-porta-di-servizio
        vittoria:
          titolo: Il vicolo
          testo: |
            Nel vicolo la lancia non gira, e quando il primo mercenario ci prova
            gli sei già addosso. Il secondo resiste di più, poi se ne vanno
            zoppicando e lasciano la borsa sulla soglia. La sera Nerissa manda a
            dire, per mano di Gretchen, che la colonna della Maison torna nel
            registro di chi è rimasto.
          effetti: { fazione.scuri: 1, rep.scuri: 1, rep.maison: 1 }
        sconfitta:
          titolo: I bidoni
          testo: |
            Il secondo mercenario ti prende alle spalle con il manico dell'ascia,
            e finisci fra i bidoni con l'acqua dei piatti nel colletto mentre loro
            se ne vanno con tutte e due le metà. Gaia resta zitta per tutta la
            strada, che da lei è la cosa più crudele.

      - testo: "Pagare tu la loro parte del mese"
        descrizione: "Una borsa per il riscossore compra tempo fino al mese prossimo, e a volte basta."
        requisiti: [monete >= 30]
        esito:
          titolo: Il tempo comprato
          testo: |
            Esci da dietro i bidoni, metti la tua borsa in mano al mercenario e
            gli dici che per questo mese la Maison ha pagato. Lui ti guarda la
            faccia per ricordarsela e se ne va senza fretta. Nerissa ti manda una
            bottiglia di vino buono e un biglietto senza firma.
          effetti: { fazione.scuri: 1, rep.scuri: 0.5, rep.maison: 1, monete: -30 }

      - testo: "Convincere Nerissa a pagare soltanto voi"
        descrizione: "Nerissa paga Durgan per non avere sangue sulla porta, e va convinta che voi la proteggete meglio."
        immagine: personaggi/nerissa-dalvane
        prova: { attributo: sociale, abilita: [persuasione, galateo], difficolta: Difficile }
        successo:
          titolo: Una colonna sola
          testo: |
            Nel salotto, davanti al tè, dici a Nerissa che Durgan raddoppia oggi e
            triplica domani, mentre gli Scuri per vent'anni hanno chiesto sempre
            la stessa cifra. Lei ascolta con la mano sul medaglione, poi ti
            racconta di un consigliere che sale ogni giovedì, da portare a chi è
            rimasto come prova che la Maison è tornata.
          pe: { persuasione: 5 }
          effetti: { fazione.scuri: 1, rep.scuri: 1, rep.maison: 1, informazioni.segreto: 1 }
        fallimento:
          titolo: Il sangue sulla porta
          testo: |
            Nerissa ti chiede chi difenderà la porta il giorno che Durgan si
            arrabbia, e la tua risposta non la convince. «Quando sarete di più di
            loro» dice, e ti chiude la porta alle spalle.
          effetti: { scandalo: 0.5 }

      - testo: "Spaventare il riscossore"
        descrizione: "Un mercenario senza paga e lontano da casa ha più paura di quanto mostri."
        prova: { attributo: sociale, abilita: [intimidire, conoscenze-della-strada], difficolta: Media }
        successo:
          titolo: Quello che rende
          testo: |
            Ti metti fra il mercenario e la porta e gli dici a voce bassa i nomi
            delle strade dove si dorme male senza amici, e del fabbro che non
            ripara le lance di chi non conosce. I due se ne vanno, e la ragazza
            della cucina chiude la porta ridendo per lo spavento.
          pe: { intimidire: 5 }
          effetti: { fazione.scuri: 1, rep.scuri: 1, rep.maison: 0.5, sospetto: 1 }
        fallimento:
          titolo: La lancia
          testo: |
            Il mercenario ti appoggia la punta della lancia sotto lo sterno senza
            cambiare espressione e ti fa indietreggiare fino ai bidoni. Prende la
            seconda metà e se ne va, e per due giorni hai un livido tondo come una
            moneta sopra l'ombelico.
          effetti: { ferite: 1 }

      - testo: "Parlargli nella lingua dei clan"
        descrizione: "Un uomo dei clan lontano da Ghoran ascolta chi parla la sua lingua, anche quando non gli piace."
        quando: [origine.fuggiasco-di-ghoran >= 1]
        prova: { attributo: sociale, abilita: [intimidire, conoscenze-della-strada], difficolta: Facile }
        successo:
          titolo: Il clan paga quando torna
          testo: |
            Gli dici nella lingua dei clan che a Ghoran un clan che taglieggia una
            casa di donne perde la faccia, e che la notizia arriva prima di lui.
            Il mercenario sputa e se ne va con il compagno, e Gaia ti fissa come
            se ti vedesse per la prima volta.
          pe: { intimidire: 5 }
          effetti: { fazione.scuri: 1, rep.scuri: 1, rep.maison: 0.5, sospetto: 1 }
        fallimento:
          titolo: Il dialetto del sud
          testo: |
            Lui ti risponde nel dialetto del sud ridendoti in faccia, ti appoggia
            la punta della lancia sotto lo sterno e ti fa indietreggiare fino ai
            bidoni. Per due giorni hai un livido tondo come una moneta.
          effetti: { ferite: 1 }

  # ------------------------------------------------------------ 5 · le Vie di Sotto, l'ingresso prima di Vesh
  - id: scuri-le-vie-di-sotto
    immagine: ambientazione/mercato-delle-ombre
    titolo: Le Vie di Sotto
    sommario: "Il Mercato delle Ombre cambia stanza, e tocca agli Scuri aprire la strada dalle loro porte alla sala nuova."
    luogo: Città Bassa, il banco del formaggio
    area: citta-bassa
    requisiti: [fazione.scuri == 4, pista.pelle < 4]
    testo: |
      Il Mercato delle Ombre cambia stanza ogni due o tre mesi, e questa
      volta tocca agli Scuri aprire la strada dalle loro porte alla sala
      nuova; le altre cinque sono della Confraternita del Velo. Gaia ti
      aspetta dietro il banco del formaggio del mercato piccolo, sopra una
      botola da cui una scala scende nel buio.

      Con lei c'è Karn, il tagliagole dei tetti, che fischia a mezza voce la
      sua canzone di sempre. «Le Vie di Sotto sono cantine attaccate alle
      cisterne dei Precursori» dice Gaia. «Ci passano i contrabbandieri
      senza banda e i cappucci del Velo. Da qualche parte c'è una sala
      grande abbastanza per il Mercato, e la troviamo noi.»

      {origine figlio-della-citta-bassa} Da ragazzino ti dicevano che sotto
      il banco del formaggio c'era la tana di un mostro. Era la scala degli
      Scuri, e il mostro era il formaggiaio.
    opzioni:
      - testo: "Scendere con Gaia e Karn"
        descrizione: "La scala è lunga e il buio fitto, e Gaia conosce solo i primi passi."
        esito:
          titolo: I pioli
          testo: |
            Scendi per ultimo, con la candela fra i denti, e in fondo trovi acqua
            fino alla caviglia e un odore di muffa e di cera. Karn accende una
            lanterna cieca, e Gaia segna con il gesso una freccia all'altezza del
            ginocchio.
          vai: scuri-vie-di-sotto

      - testo: "Farti raccontare da Gaia le Vie di Sotto"
        descrizione: "Gaia conosce ogni passaggio sotto i ponti, e qualcosa anche sotto la Città Bassa."
        costo: 0
        esito:
          titolo: Le regole di sotto
          testo: |
            Gaia te le dice mentre si allaccia le scarpe. La strada si segna col
            gesso basso, con i contrabbandieri si tratta e ai cappucci del Velo si
            cede il passo, e al primo ronzio si torna indietro. Karn smette di
            fischiare per dirti che l'ultima volta il ronzio l'ha sentito un suo
            amico, che non è tornato.
          segue: scuri-le-vie-di-sotto

      - testo: "Scendere dalla cantina del bottaio"
        descrizione: "La cantina di un bottaio poco più avanti finisce in un muro crollato, ed è più corta."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Facile }
        successo:
          titolo: Il muro crollato
          testo: |
            Passi fra le doghe della cantina del bottaio e ti infili nel varco del
            muro crollato. Dall'altra parte ritrovi Gaia e Karn in fondo alla
            scala, e Gaia ti guarda con il rispetto che si deve a una strada che
            lei non conosceva.
          pe: { atletica: 3 }
          vai: scuri-vie-di-sotto
        fallimento:
          titolo: I calcinacci
          testo: |
            Nel varco un calcinaccio ti cade sulla spalla con una pioggia di
            polvere, e arrivi dall'altra parte tossendo. Gaia e Karn ti aspettano
            già, asciutti come se fossero scesi in carrozza.
          effetti: { ferite: 0.5 }
          vai: scuri-vie-di-sotto

  # ------------------------------------------------------------ 5 · le Vie di Sotto, l'ingresso dopo Vesh
  - id: scuri-le-vie-di-sotto-dopo
    immagine: ambientazione/mercato-delle-ombre
    titolo: Le Vie di Sotto
    sommario: "La Caserma ha murato la sala del Mercato delle Ombre, e chi trova la nuova si prende le porte."
    luogo: Città Bassa, il banco del formaggio
    area: citta-bassa
    requisiti: [fazione.scuri == 4, pista.pelle >= 6]
    testo: |
      Dopo la notte della Pignatta la Caserma ha trovato la vecchia sala del Mercato
      delle Ombre e l'ha murata, con uno stemma dipinto sopra. Il Mercato si sposta
      come sempre, ma la strada verso la sala nuova non la apre nessuno, e intanto i
      cappucci del Velo aspettano di prendersi le porte e i mercenari di Durgan
      chiedono in giro dove si scende.

      Gaia ti aspetta dietro il banco del formaggio del mercato piccolo, sopra la
      botola della scala di ferro. Con lei c'è Karn, il tagliagole dei tetti,
      smagrito, che fischia a mezza voce la sua canzone di sempre. «Se la sala la
      troviamo noi, tre porte sono nostre» dice Gaia, «e se la trova Durgan si
      prende tutte le porte che vuole, perché il Velo glielo lascia fare.»
