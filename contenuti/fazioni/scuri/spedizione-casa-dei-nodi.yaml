# La Casa dei Nodi di notte, spedizione del passo 11 della quest degli Scuri (fazione.scuri == 10). Ci si entra da
# scuri-la-casa-dei-nodi-di-notte (passi-3.yaml), che azzera scuri.allarme (o lo porta a 1 senza la pianta di Venn);
# la ritirata porta ai Quartieri Alti. Come il Maniero: le prove fallite alzano scuri.allarme, a tre le stanze si
# chiudono e arriva la ronda dei balestrieri (scuri-cdn-la-ronda), che riporta l'allarme a 1 in ogni ramo.
# Le stanze chiedono fazione.scuri == 10 e scuri.allarme < 3, in fasce di profondità:
# 0 le catene esterne (la terrazza dei carichi, le catene che reggono le terrazze);
# 1 gli uffici dei Custodi di Passaggio (la sala delle bilance, il dormitorio dei balestrieri, lo scrittoio di Venn,
#   con la finestra accostata se hai la copia dei suoi pagamenti);
# 2 l'archivio dei dazi (gli scaffali dei sigilli, il registro dei passaggi notturni);
# 3 il terzo piano (la sala con due porte, la scala dei Custodi).
# Il cuore a 4 è la cassaforte dei timbri: con l'allarme sotto a due si apre con la Tecnologia o con Correzione
# (prove Difficili), con l'allarme a due o più ci sono Varn Kett e due balestrieri (boss Difficile, o Persuasione
# Difficile per uscire con il solo registro). Il seguito sceglie la matrice, il registro o tutti e due, e chiude il passo.
aree:
  - id: scuri-casa-dei-nodi
    immagine: ambientazione/mercato-dei-nodi
    nome: La Casa dei Nodi di notte
    sommario: "La sede della Gilda dei Mercanti di notte, un intrico di catene e terrazze con le lanterne dei Custodi accese a ogni piano. In fondo all'archivio dei dazi c'è la cassaforte dei timbri."
    spedizione: { ritorno: quartieri-alti, soglia: 4, stanze: 3 }
    testo: |
      Di notte la Casa dei Nodi sembra più alta. Le terrazze si reggono una
      con l'altra con catene grosse come un braccio, e fra una terrazza e
      quella sopra passa il vento della Cicatrice, che fa cigolare gli anelli.
      A ogni piano c'è una lanterna dei Custodi di Passaggio, e le lanterne si
      spostano.

      Dentro, gli uffici sono stanze lunghe con gli scrittoi in fila, e
      l'archivio dei dazi è un corridoio di scaffali che sale fino al terzo
      piano, dove la Gilda tiene le riunioni che non vuole far sentire. Ogni
      rumore rimbomba sulle assi, e i Custodi hanno il sonno leggero di chi
      è pagato per averlo.

storylet:
  # ------------------------------------------------------------ 0 · le catene esterne
  - id: scuri-cdn-la-terrazza-dei-carichi
    immagine: ambientazione/mercato-dei-nodi
    titolo: La terrazza dei carichi
    sommario: "Sulla terrazza dei carichi ci sono sacchi e casse in attesa del mattino, e una lanterna dei Custodi che fa il giro."
    luogo: La Casa dei Nodi, la terrazza dei carichi
    area: scuri-casa-dei-nodi
    ripetibile: true
    requisiti: [fazione.scuri == 10, scuri.allarme < 3, profondita.scuri-casa-dei-nodi == 0]
    testo: |
      La terrazza dei carichi è piena di sacchi di grano e di casse con il
      sigillo della Gilda, impilate in attesa delle chiatte del mattino. Una
      lanterna dei Custodi fa il giro della terrazza con calma, e poi torna
      indietro. Il Custode che la porta canticchia fra sé una canzone dei
      Ponti, sempre la stessa strofa, perché le altre non le ricorda.

      {furtivita Media} La lanterna fa il giro in cento passi. Fra un giro e
      l'altro, dietro i sacchi, c'è buio abbastanza per una persona.

      {politica-ed-economia Facile} Sui sacchi c'è il sigillo del dazio
      pagato. Su qualcuno il sigillo è nuovo e la ceralacca ancora lucida,
      messo stanotte da qualcuno che non dorme.
    opzioni:
      - testo: "Passare dietro i sacchi fra un giro e l'altro"
        descrizione: "Cento passi di lanterna, e il buio dietro i sacchi. Bisogna contare."
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Media }
        successo:
          titolo: Cento passi
          testo: |
            Conti i passi del Custode insieme alla sua canzone, e quando la
            strofa ricomincia attraversi la terrazza dietro i sacchi. Arrivi
            alla porta di servizio prima che la lanterna torni, con le spalle
            incollate al muro e la canzone che ormai sai anche tu.
          effetti: { profondita.scuri-casa-dei-nodi: 1 }
        fallimento:
          titolo: Il sacco
          testo: |
            Urti un sacco, e il grano comincia a uscire da una cucitura con
            un fruscio lungo. La lanterna si ferma. Il Custode chiede due
            volte chi c'è, e poi chiama qualcuno al piano di sopra.
          effetti: { scuri.allarme: 1 }

      - testo: "Salire sulle casse fino alla terrazza di sopra"
        descrizione: "Le casse sono impilate fino a metà parete. Dalla cima si arriva alla balaustra della terrazza di sopra."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Media }
        successo:
          titolo: La balaustra
          testo: |
            Sali sulle casse come su una scala storta e ti aggrappi alla
            balaustra della terrazza di sopra, e il Custode passa sotto di te
            senza alzare la lanterna. Ti tiri su con le braccia e scavalchi.
          effetti: { profondita.scuri-casa-dei-nodi: 1 }
        fallimento:
          titolo: La cassa che cede
          testo: |
            La cassa in cima si inclina sotto il tuo peso, e salti giù prima che
            cada. Cade lo stesso, con un rumore di vasellame rotto. La lanterna
            arriva di corsa, e tu sei già dietro i sacchi, con il cuore in gola.
          effetti: { scuri.allarme: 1, ferite: 0.5 }

      - testo: "Aspettare il cambio dei Custodi"
        descrizione: "A mezzanotte i Custodi si danno il cambio, e per un po' la terrazza è vuota. Bisogna solo aspettare al freddo."
        costo: 2
        esito:
          titolo: Il cambio
          testo: |
            Aspetti fra i sacchi con il vento della Cicatrice nel collo finché
            non suona mezzanotte. Il Custode della canzone se ne va, e quello
            nuovo ci mette un po' ad arrivare, perché si ferma a parlare sulle
            scale. Attraversi la terrazza vuota con le mani gelate.
          effetti: { profondita.scuri-casa-dei-nodi: 1 }

  - id: scuri-cdn-le-catene
    immagine: ambientazione/ponti-sospesi
    titolo: Le catene delle terrazze
    sommario: "Le terrazze della Casa dei Nodi sono appese l'una all'altra con catene grosse come un braccio. Salirle è la strada più corta."
    luogo: La Casa dei Nodi, le catene esterne
    area: scuri-casa-dei-nodi
    ripetibile: true
    requisiti: [fazione.scuri == 10, scuri.allarme < 3, profondita.scuri-casa-dei-nodi == 0]
    testo: |
      Dal bordo della terrazza più bassa partono le catene che reggono quella
      di sopra, grosse come un braccio e fredde di rugiada. Sono una decina,
      tirate in diagonale verso l'alto, e il vento le fa cantare. Sopra, a
      quattro uomini d'altezza, c'è la finestra degli uffici dei Custodi.

      {atletica Media} Le catene tese reggono un uomo. Quelle che pendono un
      poco, invece, sono messe lì per bellezza, e non reggono niente.

      {acrobazia Media fallita} Guardi in su, e la Casa dei Nodi ti sembra
      girare. Il tuo equilibrio, con molta cortesia, preferirebbe la scala.
    opzioni:
      - testo: "Salire sulla catena più tesa"
        descrizione: "Mani e ginocchia, e il vento che la fa cantare. Quella più tesa regge di sicuro."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Media }
        successo:
          titolo: La catena tesa
          testo: |
            Sali a mani e ginocchia sulla catena più tesa, un anello alla volta,
            e il vento ti spinge contro il ferro invece di strapparti via. Alla
            finestra degli uffici arrivi con le mani rosse di ruggine, e la
            finestra è chiusa con un gancio che si apre con una lama.
          effetti: { profondita.scuri-casa-dei-nodi: 1 }
        fallimento:
          titolo: La catena per bellezza
          testo: |
            La catena che hai scelto pende un poco più delle altre, e a metà
            salita scende di colpo di un palmo con un clangore che sveglia mezza
            terrazza. Ti lasci cadere sulle casse. La catena era lì per
            bellezza.
          effetti: { scuri.allarme: 1, ferite: 0.5 }

      - testo: "Arrampicarsi sulla parete, sugli anelli dei carichi"
        descrizione: "Sul muro ci sono gli anelli di ferro per legare i carichi, uno ogni braccio. È una scala, se non si ha fretta."
        costo: 2
        esito:
          titolo: Gli anelli
          testo: |
            Sali sugli anelli di ferro uno dopo l'altro, adagio, controllando
            ogni presa due volte. Ci metti il doppio del tempo, e quando arrivi
            alla finestra degli uffici hai le dita che non si chiudono più. La
            finestra però è lì, e dentro è buio.
          effetti: { profondita.scuri-casa-dei-nodi: 1 }

      - testo: "Scegliere la catena giusta come un mercante dei Ponti"
        descrizione: "Ai Ponti si sa quali catene della Casa dei Nodi reggono e quali sono messe per far vedere. I mercanti ci scherzano sopra."
        quando: [origine.mercante-dei-ponti >= 1]
        esito:
          titolo: Per far vedere
          testo: |
            Ai banchi del Mercato dei Nodi si scherza sulle catene della Casa,
            che per metà sono messe per far vedere. Ti ricordi quali, e sali su
            una delle altre senza esitare, mentre il vento canta in quelle
            finte. Alla finestra degli uffici arrivi senza un graffio.
          effetti: { profondita.scuri-casa-dei-nodi: 1 }

  # ------------------------------------------------------------ 1 · gli uffici dei Custodi di Passaggio
  - id: scuri-cdn-la-sala-delle-bilance
    immagine: ambientazione/mercato-dei-nodi
    titolo: La sala delle bilance
    sommario: "Una sala piena di bilance da dazio, e su ognuna un campanello che suona se si muove il piatto."
    luogo: La Casa dei Nodi, la sala delle bilance
    area: scuri-casa-dei-nodi
    ripetibile: true
    requisiti: [fazione.scuri == 10, scuri.allarme < 3, profondita.scuri-casa-dei-nodi == 1]
    testo: |
      La sala delle bilance è lunga e bassa, con le bilance da dazio in fila
      come banchi di scuola. Ognuna ha i piatti d'ottone e un campanellino
      appeso al giogo, che suona se il piatto si muove senza che il pesatore
      lo voglia. È un'invenzione della Gilda contro chi tocca le bilance di
      notte, e sopra l'ultima ci dorme un gatto grigio.

      {tecnologia Media} I campanelli sono legati al giogo con un filo. Se
      blocchi il giogo, il piatto si muove e il campanello resta zitto.

      {percezione Facile} Il gatto tiene un occhio aperto, e quell'occhio è
      puntato su di te.
    opzioni:
      - testo: "Bloccare i gioghi e passare in mezzo"
        descrizione: "Un dito sul giogo, un passo, il dito sul giogo dopo. Un lavoro di pazienza."
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Media }
        successo:
          titolo: I gioghi
          testo: |
            Passi fra le bilance tenendo un dito su ogni giogo mentre ti sposti,
            e i campanelli restano zitti. Il gatto ti guarda arrivare fino alla
            porta in fondo, e quando la apri sbadiglia.
          effetti: { profondita.scuri-casa-dei-nodi: 1 }
        fallimento:
          titolo: Il campanello
          testo: |
            Alla terza bilancia il giogo ti scappa da sotto il dito, e il
            campanello suona a lungo con una nota sottile. Il gatto salta
            giù e scappa, mentre dal corridoio arrivano dei passi.
          effetti: { scuri.allarme: 1 }

      - testo: "Passare lungo il muro, lontano dalle bilance"
        descrizione: "Fra le bilance e il muro c'è un passaggio stretto. Ci si passa di fianco, senza toccare niente."
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Media }
        successo:
          titolo: Di fianco
          testo: |
            Passi di fianco lungo il muro con la pancia in dentro, e i
            piatti d'ottone ti sfiorano la giubba senza muoversi. In fondo
            alla sala il gatto si stira e ti apre la strada come un
            portiere.
          effetti: { profondita.scuri-casa-dei-nodi: 1 }
        fallimento:
          titolo: Il gomito
          testo: |
            Il gomito ti tocca un piatto, e tutte le bilance della fila suonano
            una dopo l'altra, come campane a festa. Ti appiattisci contro il
            muro aspettando i passi.
          effetti: { scuri.allarme: 1 }

      - testo: "Portare via il gatto, e aspettare"
        descrizione: "Se il gatto scende dalla bilancia, la fa suonare. Meglio prenderlo in braccio e aspettare che si addormenti."
        costo: 2
        esito:
          titolo: Il gatto grigio
          testo: |
            Prendi in braccio il gatto grigio prima che decida di scendere,
            e lui si lascia prendere. Lo tieni in braccio fino alle fusa,
            studiando la sala. Quando lo posi su una sedia vuota hai capito
            dove passare.
          effetti: { profondita.scuri-casa-dei-nodi: 1 }

  - id: scuri-cdn-il-dormitorio-dei-balestrieri
    immagine: fazioni/gilda-dei-mercanti
    titolo: Il dormitorio dei balestrieri
    sommario: "Per arrivare all'archivio si passa da un dormitorio di balestrieri della Gilda. Dormono, quasi tutti."
    luogo: La Casa dei Nodi, il dormitorio dei balestrieri
    area: scuri-casa-dei-nodi
    ripetibile: true
    requisiti: [fazione.scuri == 10, scuri.allarme < 3, profondita.scuri-casa-dei-nodi == 1]
    testo: |
      Il corridoio che porta all'archivio passa dentro un dormitorio, una
      stanza lunga con le brande in fila e le balestre appese al muro sopra
      ogni branda. Dodici balestrieri della Gilda dormono con la bocca aperta,
      e uno, in fondo, è seduto sul letto a cucirsi una calza alla luce di un
      mozzicone.

      {armi-da-distanza Media} Le balestre sul muro sono scariche, con i
      dardi in una cassa accanto alla porta. Per caricarne una ci vuole il
      tempo di contare fino a dieci.

      {resistenza Facile fallita} L'aria del dormitorio puzza di piedi. Lo
      stomaco ti chiede di passare in fretta.
    opzioni:
      - testo: "Passare fra le brande"
        descrizione: "Dodici uomini che dormono e uno che cuce. Un passo alla volta, fra il russare."
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Media }
        successo:
          titolo: Fra le brande
          testo: |
            Passi fra le brande con il russare che ti copre i passi, e
            quello che cuce la calza si punge un dito proprio mentre gli
            passi alle spalle. Impreca a bassa voce e se lo mette in bocca,
            e quando rialza la testa tu sei già uscito.
          effetti: { profondita.scuri-casa-dei-nodi: 1 }
        fallimento:
          titolo: La calza
          testo: |
            Quello che cuce alza la testa e ti vede. Per un momento vi guardate
            in silenzio, con l'ago a mezz'aria. Poi lui apre la bocca, e tu
            sei già fuori dalla porta, e dietro di te il dormitorio si sveglia.
          effetti: { scuri.allarme: 1 }

      - testo: "Convincere quello sveglio che sei un Custode"
        descrizione: "Di notte gli uffici sono pieni di Custodi che non conoscono tutti. Un tono annoiato e un'aria di fretta bastano."
        prova: { attributo: sociale, abilita: [ingannare, galateo], difficolta: Media }
        successo:
          titolo: Il Custode di turno
          testo: |
            Entri come se il dormitorio fosse tuo e chiedi con voce annoiata
            a quello della calza se ha visto passare l'ispettore. Lui ti
            risponde di no e ti indica la porta dell'archivio, e torna alla
            sua calza.
          effetti: { profondita.scuri-casa-dei-nodi: 1 }
        fallimento:
          titolo: Quale ispettore
          testo: |
            Gli chiedi dell'ispettore, e lui ti chiede quale, perché stanotte
            di ispettori non ce ne sono. Ti guarda meglio. Torni indietro dicendo
            che allora hai sbagliato piano, e lui posa la calza.
          effetti: { scuri.allarme: 1 }

      - testo: "Fare il giro dal cortile"
        descrizione: "Il dormitorio si evita passando dal cortile interno, sotto le finestre degli uffici. È lungo, e al freddo."
        costo: 2
        esito:
          titolo: Il cortile interno
          testo: |
            Torni indietro e scendi nel cortile interno, dove il vento della
            Cicatrice gira in tondo come in un pozzo. Lo attraversi rasente al
            muro fino a una porta di servizio dell'archivio, che si apre con
            una spinta. Ci hai messo un'ora, e non hai più sensibilità nelle
            orecchie.
          effetti: { profondita.scuri-casa-dei-nodi: 1 }

  - id: scuri-cdn-lo-scrittoio-di-venn
    immagine: ambientazione/mercato-dei-nodi
    titolo: Lo scrittoio di Venn
    sommario: "La sala degli ispettori dei lotti, con gli scrittoi in fila. Quello di Cosimo Venn è il più vicino alla finestra."
    luogo: La Casa dei Nodi, la sala degli ispettori dei lotti
    area: scuri-casa-dei-nodi
    ripetibile: true
    requisiti: [fazione.scuri == 10, scuri.allarme < 3, profondita.scuri-casa-dei-nodi == 1]
    testo: |
      La sala degli ispettori dei lotti di notte è vuota, con gli scrittoi in
      fila sotto le finestre e i registri chiusi in pile. Lo scrittoio di
      Cosimo Venn è in fondo, il più vicino alla finestra, e sopra c'è ancora
      un rametto di menta masticato a metà. Dalla finestra si vede il tetto
      dell'archivio dei dazi, a un salto di distanza.

      {percezione Media} Nel cassetto dello scrittoio, dove Venn teneva il
      quaderno nero, ci sono soltanto pile di monete da cinque e una pianta
      dell'archivio disegnata a matita.

      {acrobazia Media} Il tetto dell'archivio è due braccia più in basso
      della finestra, e le tegole sono bagnate di rugiada.
    opzioni:
      - testo: "Uscire dalla finestra accostata"
        descrizione: "Venn ti ha promesso che stanotte la finestra del suo scrittoio sarebbe rimasta accostata."
        quando: [scuri.venn >= 1]
        esito:
          titolo: La finestra di Venn
          testo: |
            La finestra dello scrittoio di Venn è accostata, come aveva
            promesso, con un pezzo di carta piegato nel battente perché non
            sbatta. Esci sul davanzale e salti sul tetto dell'archivio, dove le
            tegole ti accolgono senza un rumore.
          effetti: { profondita.scuri-casa-dei-nodi: 1 }

      - testo: "Saltare sul tetto dell'archivio"
        descrizione: "Due braccia più in basso, e le tegole bagnate. Il salto si fa una volta sola."
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Media }
        successo:
          titolo: Le tegole
          testo: |
            Apri la finestra e salti dal davanzale. Atterri sulle tegole con
            le ginocchia piegate, e una tegola scivola via e cade nel
            cortile, dove nessuno la sente. Dal lucernario dell'archivio
            entri fra gli scaffali.
          effetti: { profondita.scuri-casa-dei-nodi: 1 }
        fallimento:
          titolo: La grondaia
          testo: |
            Salti, e le tegole bagnate ti scivolano sotto i piedi. Ti ritrovi
            appeso alla grondaia con un braccio solo, e la grondaia geme. Torni
            dentro dalla finestra a forza di braccia, mentre di sotto qualcuno
            apre un'imposta.
          effetti: { scuri.allarme: 1, ferite: 0.5 }

      - testo: "Seguire la pianta del cassetto"
        descrizione: "Nel cassetto di Venn c'è una pianta dell'archivio. Seguirla vuol dire passare dalle scale, e le scale sono lunghe."
        prova: { attributo: mentale, abilita: [percezione, accademiche], difficolta: Media }
        successo:
          titolo: La pianta a matita
          testo: |
            Leggi la pianta alla luce della finestra e trovi un passaggio che
            dalla sala degli ispettori scende all'archivio per una scala di
            servizio. La segui contando le porte, e arrivi fra gli scaffali
            senza incontrare nessuno.
          effetti: { profondita.scuri-casa-dei-nodi: 1 }
        fallimento:
          titolo: La porta sbagliata
          testo: |
            Segui la pianta, e la pianta è vecchia. La porta che dovrebbe
            dare sulla scala dà su uno sgabuzzino pieno di scope, che cadono
            tutte insieme.
          effetti: { scuri.allarme: 1 }

  # ------------------------------------------------------------ 2 · l'archivio dei dazi
  - id: scuri-cdn-gli-scaffali-dei-sigilli
    immagine: ambientazione/biblioteca-di-qir-azel
    titolo: Gli scaffali dei sigilli
    sommario: "L'archivio dei dazi è un labirinto di scaffali, e ogni corridoio porta il sigillo di un anno. La cassaforte sta in fondo a uno di questi."
    luogo: La Casa dei Nodi, l'archivio dei dazi
    area: scuri-casa-dei-nodi
    ripetibile: true
    requisiti: [fazione.scuri == 10, scuri.allarme < 3, profondita.scuri-casa-dei-nodi == 2]
    testo: |
      L'archivio dei dazi è un labirinto di scaffali alti fino al soffitto,
      pieni di registri rilegati in cuoio. In testa a ogni corridoio c'è una
      targa d'ottone con il sigillo di un anno, a partire dal Patto delle
      Corde. I corridoi più vecchi sono pieni di polvere, quelli nuovi
      odorano ancora di colla. La cassaforte dei timbri, dice Rozalia, sta in
      fondo al corridoio dell'anno in cui il timbro è stato cambiato.

      {accademiche Media} La Gilda ha cambiato il timbro dopo uno scandalo di
      dazi falsi, e lo scandalo è finito su tutti gli almanacchi. Se ti
      ricordi l'anno dello scandalo, sai qual è il corridoio.

      {resistenza Media} La polvere dei corridoi vecchi ti pizzica il naso, e
      uno starnuto qui dentro si sentirebbe fino al terzo piano.
    opzioni:
      - testo: "Ricordare l'anno in cui la Gilda cambiò il timbro"
        descrizione: "Uno scandalo di dazi falsi, finito su tutti gli almanacchi. Bisogna ricordare quale."
        prova: { attributo: mentale, abilita: [accademiche, politica-ed-economia], difficolta: Media }
        successo:
          titolo: L'anno dello scandalo
          testo: |
            Te lo ricordi a metà corridoio, insieme al nome del funzionario che
            fu impiccato sul Ponte delle Mille Corde. Trovi la targa giusta, e
            il corridoio dell'anno dello scandalo finisce contro una porta di
            ferro con una serratura dei Precursori.
          effetti: { profondita.scuri-casa-dei-nodi: 1 }
        fallimento:
          titolo: Gli almanacchi
          testo: |
            Ti ricordi lo scandalo, e non l'anno. Percorri tre corridoi sbagliati
            e nel terzo starnutisci. Lo starnuto rimbomba fra gli scaffali, e al
            piano di sopra una porta si apre.
          effetti: { scuri.allarme: 1 }

      - testo: "Seguire le impronte nella polvere"
        descrizione: "Chi va alla cassaforte di notte lascia impronte nei corridoi vecchi, dove nessuno spazza."
        prova: { attributo: mentale, abilita: [percezione, natura], difficolta: Media }
        successo:
          titolo: Le impronte
          testo: |
            Nella polvere di un corridoio vecchio ci sono impronte di
            stivali puliti che vanno e tornano sempre per la stessa strada.
            Le segui fino a una porta di ferro con una serratura dei
            Precursori. Gli stivali puliti, in questa casa, li porta uno
            solo.
          effetti: { profondita.scuri-casa-dei-nodi: 1 }
        fallimento:
          titolo: Le tue impronte
          testo: |
            Segui delle impronte per mezz'ora prima di accorgerti che sono le
            tue. Quando torni al punto di partenza, in fondo al corridoio
            principale c'è la luce di una lanterna che si avvicina.
          effetti: { scuri.allarme: 1 }

      - testo: "Leggere le targhe una per una"
        descrizione: "Senza ricordare l'anno, si leggono tutte le targhe. Ci vuole la notte."
        costo: 2
        esito:
          titolo: Tutte le targhe
          testo: |
            Leggi le targhe d'ottone una per una con la candela riparata dalla
            mano, e ogni targa ti dice un anno e un sigillo. Alla trentesima il
            sigillo cambia forma. Il corridoio finisce contro una porta di ferro
            con una serratura dei Precursori.
          effetti: { profondita.scuri-casa-dei-nodi: 1 }

  - id: scuri-cdn-il-registro-dei-passaggi-notturni
    immagine: ambientazione/ponti-sospesi
    titolo: Il registro dei passaggi notturni
    sommario: "Sul leggio dell'archivio è aperto il registro dei carichi passati di notte sui Ponti. Qualcuno ci ha scritto stanotte."
    luogo: La Casa dei Nodi, il leggio dell'archivio
    area: scuri-casa-dei-nodi
    ripetibile: true
    requisiti: [fazione.scuri == 10, scuri.allarme < 3, profondita.scuri-casa-dei-nodi == 2]
    testo: |
      In mezzo all'archivio c'è un leggio con un registro aperto, il registro
      dei passaggi notturni, dove i Custodi segnano i carichi che attraversano
      i Ponti dopo il tramonto. Accanto c'è un calamaio aperto, e la penna
      è ancora umida. L'ultima riga è stata scritta stanotte, e porta il
      sigillo di una licenza per i carichi notturni.

      {politica-ed-economia Media} La licenza dell'ultima riga è una di
      quelle che Rozalia vende a Venn. Il carico è passato con il timbro
      della Gilda, e la Gilda non sa di averlo dato.

      {ingannare Facile} La penna è umida, e il calamaio aperto. Chi l'ha
      lasciato è andato a prendere qualcosa, e tornerà.
    opzioni:
      - testo: "Leggere le ultime pagine e passare oltre"
        descrizione: "Chi passa di notte sui Ponti con le licenze di Rozalia vale un segreto. Basta leggere in fretta."
        prova: { attributo: mentale, abilita: [percezione, politica-ed-economia], difficolta: Media }
        successo:
          titolo: Le licenze di Rozalia
          testo: |
            Leggi le ultime pagine in fretta e trovi undici licenze di Rozalia
            in un mese, tutte con lo stesso nome di carico, *casse di menta*.
            Ti viene da ridere. Lo tieni a mente e passi oltre prima che torni
            chi ha lasciato la penna.
          effetti: { profondita.scuri-casa-dei-nodi: 1, informazioni.segreto: 1 }
        fallimento:
          titolo: Chi torna
          testo: |
            Leggi troppo a lungo, e chi aveva lasciato la penna torna con
            una tazza in mano. È un vecchio Custode con gli occhiali sulla
            fronte, e quando ti vede lascia cadere la tazza.
          effetti: { scuri.allarme: 1 }

      - testo: "Nasconderti dietro il leggio e aspettare chi torna"
        descrizione: "Chi scrive di notte nel registro torna alla penna. Si può vedere chi è, e dove va dopo."
        prova: { attributo: fisico, abilita: [furtivita, resistenza], difficolta: Media }
        successo:
          titolo: Il Custode con la tazza
          testo: |
            Torna un vecchio Custode con gli occhiali sulla fronte e una
            tazza fumante. Scrive un'altra riga e se ne va verso il fondo
            dell'archivio, dove una porta di ferro si apre e si richiude.
            Sai dov'è la cassaforte, e sai che lui ha la chiave.
          effetti: { profondita.scuri-casa-dei-nodi: 1 }
        fallimento:
          titolo: La tazza
          testo: |
            Il vecchio Custode torna con una tazza fumante e, prima di
            scrivere, si gira a guardare dietro il leggio come se sapesse.
            Ti vede, e la tazza gli scivola dalle dita.
          effetti: { scuri.allarme: 1 }

      - testo: "Strappare l'ultima pagina e andare"
        descrizione: "La pagina con le licenze di Rozalia può servire. Strappata con calma, non fa rumore."
        esito:
          titolo: La pagina
          testo: |
            Strappi l'ultima pagina con calma, piegandola prima lungo la
            cucitura, e te la infili nella giubba. Il registro resta aperto su
            una pagina bianca. Chi torna alla penna se ne accorgerà domattina, e
            stanotte tu sarai già altrove.
          effetti: { profondita.scuri-casa-dei-nodi: 1, informazioni.pettegolezzo: 1, scuri.allarme: 0.5 }

  # ------------------------------------------------------------ 3 · il terzo piano
  - id: scuri-cdn-la-sala-delle-due-porte
    immagine: ambientazione/quartieri-alti
    titolo: La sala delle due porte
    sommario: "Al terzo piano c'è la sala delle riunioni riservate, con due porte che si chiudono soltanto da dentro. Dall'altra parte c'è la cassaforte."
    luogo: La Casa dei Nodi, il terzo piano
    area: scuri-casa-dei-nodi
    ripetibile: true
    requisiti: [fazione.scuri == 10, scuri.allarme < 3, profondita.scuri-casa-dei-nodi == 3]
    testo: |
      Il terzo piano è una sala sola, quella delle riunioni riservate della
      Gilda, con un tavolo ovale e dodici sedie. Ha due porte, una per parte,
      che si chiudono soltanto da dentro con un catenaccio. Per arrivare alla
      cassaforte bisogna attraversarla, e stanotte una delle due porte è
      chiusa. Da sotto filtra una lama di luce.

      {tecnologia Media} Il catenaccio della porta chiusa è a molla. Se spingi
      la porta nel punto giusto, la molla scatta da sola.

      {origine rampollo-dei-quartieri-alti} In questa sala ci sei entrato da
      ragazzino dietro tuo padre, e ti ricordi che lui spingeva la porta
      sinistra con il palmo, in alto, quando il catenaccio faceva i
      capricci.
    opzioni:
      - testo: "Spingere la porta nel punto giusto"
        descrizione: "Un catenaccio a molla si apre se la porta si spinge dove la molla è più debole."
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Media }
        successo:
          titolo: La molla
          testo: |
            Passi le dita lungo lo stipite finché senti la molla, poi spingi
            piano con il palmo e il catenaccio scatta da solo. La porta si
            apre sulla sala vuota. La lama di luce veniva da una lanterna
            dimenticata sul tavolo ovale, e la porta di fronte dà sulla
            cassaforte.
          effetti: { profondita.scuri-casa-dei-nodi: 1 }
        fallimento:
          titolo: Il catenaccio
          testo: |
            Spingi la porta dove ti sembra, e il catenaccio non si muove. Ci
            metti più forza, e la porta sbatte contro il telaio con un colpo
            sordo. Nella sala, dietro la porta, qualcuno sposta una sedia.
          effetti: { scuri.allarme: 1 }

      - testo: "Passare dal cornicione esterno"
        descrizione: "La sala ha finestre sul vuoto, e sotto le finestre corre un cornicione. Si passa fuori, e si rientra dall'altra parte."
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Media }
        successo:
          titolo: Il cornicione
          testo: |
            Esci da una finestra del corridoio e cammini sul cornicione con la
            faccia contro il muro e il vento della Cicatrice nella schiena. Due
            finestre più in là rientri, e sei dall'altra parte della sala,
            davanti alla cassaforte.
          effetti: { profondita.scuri-casa-dei-nodi: 1 }
        fallimento:
          titolo: Il vento
          testo: |
            Sul cornicione il vento ti strappa il cappuccio, che vola via nel
            buio. Rientri dalla finestra di partenza con il cuore che ti batte
            nelle orecchie, e dal cortile qualcuno chiede chi c'è.
          effetti: { scuri.allarme: 1, tormento: 0.5 }

      - testo: "Spingere la porta come faceva tuo padre"
        descrizione: "Il palmo in alto, sulla porta sinistra, quando il catenaccio faceva i capricci."
        quando: [origine.rampollo-dei-quartieri-alti >= 1]
        esito:
          titolo: Come tuo padre
          testo: |
            Spingi la porta sinistra con il palmo, in alto, come faceva tuo
            padre, e il catenaccio scatta con lo stesso rumore di allora. Per un
            momento ti aspetti di vederlo entrare. La sala è vuota, e dall'altra
            parte c'è la cassaforte.
          effetti: { profondita.scuri-casa-dei-nodi: 1 }

  - id: scuri-cdn-la-scala-dei-custodi
    immagine: ambientazione/ponti-sospesi
    titolo: La scala dei Custodi
    sommario: "Una scala a chiocciola sale al terzo piano dentro una torretta di corde e legno, e cigola a ogni gradino."
    luogo: La Casa dei Nodi, la torretta della scala
    area: scuri-casa-dei-nodi
    ripetibile: true
    requisiti: [fazione.scuri == 10, scuri.allarme < 3, profondita.scuri-casa-dei-nodi == 3]
    testo: |
      La scala dei Custodi sale a chiocciola dentro una torretta di legno
      legata con le corde come i ponti, e cigola a ogni gradino in un modo
      diverso. In cima c'è un pianerottolo con una porta, e dietro la porta
      la cassaforte dei timbri. A metà scala c'è un Custode addormentato sui
      gradini, con la lanterna fra le ginocchia.

      {atletica Media} I gradini cigolano al centro. Sul bordo, dove il legno
      è inchiodato alla torretta, si sale in silenzio.

      {empatia Facile} Il Custode addormentato è un ragazzo. Dorme sulla
      scala perché da lì sente arrivare tutti, e si è addormentato lo stesso.
    opzioni:
      - testo: "Salire sul bordo dei gradini, scavalcando il Custode"
        descrizione: "Sul bordo i gradini tacciono. Il ragazzo addormentato, però, occupa mezza scala."
        prova: { attributo: fisico, abilita: [atletica, furtivita], difficolta: Media }
        successo:
          titolo: Il bordo
          testo: |
            Sali sul bordo dei gradini con una mano sulla corda della torretta,
            e scavalchi il ragazzo addormentato con un passo lungo. Lui si gira
            nel sonno e borbotta un nome. Arrivi al pianerottolo senza un
            cigolio.
          effetti: { profondita.scuri-casa-dei-nodi: 1 }
        fallimento:
          titolo: Il cigolio
          testo: |
            Al passo lungo il gradino sotto di te cigola, e il ragazzo apre
            gli occhi. Ti guarda a lungo con gli occhi ancora pieni di
            sonno, finché non si mette a gridare.
          effetti: { scuri.allarme: 1 }

      - testo: "Svegliarlo con gentilezza e dirgli di tornare a letto"
        descrizione: "Un ragazzo addormentato sulla scala si spaventa. Uno svegliato con gentilezza, a volte, obbedisce."
        prova: { attributo: sociale, abilita: [persuasione, ingannare], difficolta: Media }
        successo:
          titolo: A letto
          testo: |
            Gli tocchi la spalla e gli dici, con la voce di un sergente
            stanco, che il turno è finito e che può andare a dormire nel suo
            letto. Lui si alza ringraziandoti e scende la scala con la
            lanterna, strascicando i piedi, mentre tu sali al buio.
          effetti: { profondita.scuri-casa-dei-nodi: 1 }
        fallimento:
          titolo: Il sergente
          testo: |
            Gli dici che il turno è finito, e lui ti chiede chi sei, perché il
            sergente stanotte è sua zia. Lo guardi. Lui guarda te, e scende la
            scala di corsa.
          effetti: { scuri.allarme: 1 }

      - testo: "Aspettare che si svegli e se ne vada"
        descrizione: "Chi dorme sulla scala prima o poi si sveglia con il collo storto, e va a cercare un letto."
        costo: 2
        esito:
          titolo: Il collo storto
          testo: |
            Aspetti in fondo alla scala, nel buio, per un'ora intera. Alla fine
            il ragazzo si sveglia, si massaggia il collo, e scende borbottando
            senza vederti. Sali sul bordo dei gradini fino al pianerottolo.
          effetti: { profondita.scuri-casa-dei-nodi: 1 }

  # ------------------------------------------------------------ la ronda dei balestrieri (allarme a 3)
  - id: scuri-cdn-la-ronda
    immagine: fazioni/gilda-dei-mercanti
    titolo: La ronda dei balestrieri
    sommario: "L'allarme è suonato. Due balestrieri della Gilda salgono le scale con le lanterne, e frugano una stanza dopo l'altra."
    luogo: La Casa dei Nodi, un corridoio
    area: scuri-casa-dei-nodi
    requisiti: [fazione.scuri == 10, scuri.allarme >= 3]
    testo: |
      Adesso la Casa dei Nodi è sveglia. Per i corridoi si sentono porte che
      si aprono e voci che chiamano, e due balestrieri della Gilda salgono
      le scale con le lanterne alte e le balestre cariche, frugando una
      stanza dopo l'altra. Arriveranno alla tua fra poco.

      {armi-da-distanza Media} Le balestre sono cariche, e in un corridoio
      un dardo non sbaglia. Dopo il primo tiro ci vuole tempo per
      ricaricarle.

      {furtivita Media} Sopra la porta c'è una mensola larga, piena di
      registri vecchi. Chi ci sale e resta immobile non lo cerca nessuno.
    opzioni:
      - testo: "Aspettarli dietro la porta"
        descrizione: "Due balestrieri in un corridoio stretto. Se li metti giù prima che tirino, la casa torna a dormire."
        combattimento: scuri-la-ronda-dei-balestrieri
        vittoria:
          titolo: Dietro la porta
          testo: |
            Il primo balestriere entra con la lanterna avanti, e tu sei dietro
            la porta. Il secondo tira e manca. Quando sono a terra li leghi con
            le cinghie delle loro balestre e li chiudi in un armadio. La casa,
            poco alla volta, torna a dormire.
          imposta: { scuri.allarme: 1 }
        sconfitta:
          titolo: Il dardo
          testo: |
            Il dardo ti prende di striscio sul braccio, e scappi per un
            corridoio che non conosci finché non perdi le lanterne. Ti nascondi
            in uno sgabuzzino per un'ora, a fasciarti il braccio con la camicia.
            Quando esci la casa si è calmata.
          imposta: { scuri.allarme: 1 }
          effetti: { sospetto: 1 }

      - testo: "Salire sulla mensola sopra la porta"
        descrizione: "Chi cerca guarda per terra e dietro le porte. Sopra la porta non guarda nessuno."
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Difficile }
        successo:
          titolo: La mensola
          testo: |
            Sali sulla mensola fra i registri vecchi e ti fai piccolo. I
            balestrieri entrano e guardano dappertutto tranne che in alto, e
            poi se ne vanno. Resti lassù finché la casa non torna a dormire,
            con la polvere dei registri nel naso.
          pe: { furtivita: 5 }
          imposta: { scuri.allarme: 1 }
        fallimento:
          titolo: Il registro che cade
          testo: |
            Sali sulla mensola, e un registro vecchio scivola giù e cade ai
            piedi del primo balestriere. Lui alza la lanterna. Salti giù e
            scappi, e il dardo ti prende di striscio. Perdi le lanterne in un
            corridoio, e aspetti in uno sgabuzzino che la casa si calmi.
          imposta: { scuri.allarme: 1 }
          effetti: { ferite: 1, sospetto: 1 }

      - testo: "Comprare il silenzio della ronda"
        descrizione: "I balestrieri della Gilda sono pagati poco, e lo sanno. Una borsa pesante e un nome sbagliato da scrivere nel rapporto."
        requisiti: [monete >= 20]
        esito:
          titolo: Il rapporto
          testo: |
            Esci dalla stanza con le mani alzate e una borsa in una delle due. I
            balestrieri si guardano. Poi il più vecchio prende la borsa e dice
            all'altro che nel rapporto scriveranno di un gatto. Se ne vanno, e
            la casa torna a dormire.
          imposta: { scuri.allarme: 1 }
          effetti: { monete: -20 }

  # ------------------------------------------------------------ 4 · il cuore: la cassaforte dei timbri
  - id: scuri-cdn-la-cassaforte-dei-timbri
    immagine: personaggi/varn-kett
    titolo: La cassaforte dei timbri
    sommario: "In fondo all'archivio dei dazi c'è la cassaforte dei timbri, chiusa da un congegno dei Precursori. Dentro ci sono la matrice e il registro."
    luogo: La Casa dei Nodi, la cassaforte dei timbri
    area: scuri-casa-dei-nodi
    requisiti: [fazione.scuri == 10, profondita.scuri-casa-dei-nodi >= 4]
    testo: |
      La cassaforte dei timbri è una stanza piccola, con le pareti foderate di
      ferro e una porta tonda dei Precursori, senza serratura. Al centro della
      porta c'è un disco di metallo diviso in spicchi, e ogni spicchio porta un
      simbolo inciso. Dietro, dice Rozalia, ci sono la matrice del timbro e il
      registro dei funzionari pagati, quello che tiene Venn.

      {tecnologia Difficile} Gli spicchi si girano come la ruota di un
      mulino. Ogni simbolo ha un posto, e il congegno lo sente quando ce lo
      metti.

      {magia Media} Nel disco c'è un filo di Mana che gira in tondo, lento.
      Si sente meglio con le dita che con gli occhi.

      Se la casa è sveglia, davanti alla porta tonda c'è Varn Kett, con il
      cappotto color tabacco e gli stivali da pioggia, e la spada della
      milizia sulle ginocchia. Muove le dita sul ginocchio come se scrivesse
      su una pergamena invisibile, e due balestrieri gli stanno ai lati.
    opzioni:
      - testo: "Girare gli spicchi del disco"
        descrizione: "La casa dorme ancora. Il congegno dei Precursori si apre a chi sente dove va ogni simbolo."
        quando: [scuri.allarme < 2]
        prova: { attributo: mentale, abilita: [tecnologia, magia], difficolta: Difficile }
        successo:
          titolo: La porta tonda
          testo: |
            Giri gli spicchi uno per volta, con le dita sul metallo, e ognuno a
            un certo punto si ferma con uno scatto leggero. All'ultimo la porta
            tonda rientra nel muro con un sospiro d'aria vecchia. Dentro ci sono
            due cassetti di ferro.
          pe: { tecnologia: 5 }
          segue: scuri-cdn-la-cassaforte-aperta
        fallimento:
          titolo: Il disco che gira
          testo: |
            Giri gli spicchi, e al terzo il disco riparte da solo e torna al
            punto di partenza con un ronzio che sale per tutto l'archivio. Al
            piano di sopra qualcuno si sveglia e scende.
          effetti: { scuri.allarme: 2 }

      - testo: "Disegnare sul disco la formula di Correzione"
        descrizione: "Per i Profeti delle Geometrie ciò che si disegna accade. Un cerchio di gesso intorno al disco, e il disco è aperto."
        quando: [scuri.allarme < 2]
        incantesimo: correzione
        prova: { attributo: mentale, abilita: magia, difficolta: Difficile }
        successo:
          titolo: Il cerchio di gesso
          testo: |
            Disegni con il gesso un cerchio intorno al disco, dicendo la formula
            mentre lo chiudi, e disegni la porta aperta. Quando alzi il gesso la
            porta tonda è rientrata nel muro. Ti fa male la testa sopra l'occhio
            sinistro, e dentro ci sono due cassetti di ferro.
          segue: scuri-cdn-la-cassaforte-aperta
        fallimento:
          titolo: Il cerchio aperto
          testo: |
            Il cerchio ti si apre a metà, e il gesso si spezza. Il disco comincia
            a girare da solo con un ronzio che sale per tutto l'archivio, e al
            piano di sopra qualcuno si sveglia.
          effetti: { scuri.allarme: 2 }

      - testo: "Affrontare Varn Kett"
        descrizione: "Varn Kett non si compra, e i due balestrieri tirano dritto. Se li batti, la cassaforte è tua."
        quando: [scuri.allarme >= 2]
        combattimento: scuri-la-cassaforte-dei-timbri
        vittoria:
          titolo: Il cappotto color tabacco
          testo: |
            Varn Kett si batte come un miliziano di vent'anni fa, senza
            sprecare un colpo, e quando va giù lo fa sedendosi, con la spada
            di traverso sulle ginocchia. Ti guarda aprire la cassaforte con
            le sue chiavi, e muove le dita sul ginocchio, scrivendo.
          segue: scuri-cdn-la-cassaforte-aperta
        sconfitta:
          titolo: Il portone
          testo: |
            Kett ti disarma con un colpo secco e ti accompagna lui stesso al
            portone della Casa dei Nodi, con la spada nel fodero e la mano sul
            tuo braccio. Ti dice che non ti ha visto, perché stanotte non vuole
            scrivere un rapporto lungo. Il tuo nome, però, l'ha già scritto
            sulla pergamena invisibile.
          effetti: { sospetto: 1 }
          vai: quartieri-alti

      - testo: "Mostrare a Kett che cosa c'è nel registro"
        descrizione: "Kett non si compra. Ma il registro di Venn sporca la Gilda più di qualunque furto, e Kett è stato miliziano prima che ispettore."
        quando: [scuri.allarme >= 2]
        prova: { attributo: sociale, abilita: [persuasione, politica-ed-economia], difficolta: Difficile }
        successo:
          titolo: Vent'anni nella milizia
          testo: |
            Gli dici chi c'è nel registro dei funzionari pagati, e chi li
            paga. Kett ascolta muovendo le dita. Poi apre la cassaforte con
            le sue chiavi e ti dà il registro, e la matrice la tiene.
            «Questo sporca la Gilda più del furto, e se lo porti fuori da
            qui io non ti ho visto» dice.
          pe: { persuasione: 5 }
          imposta: { scuri.libro: 1, scuri.allarme: 0 }
          effetti: { fazione.scuri: 1, rep.scuri: 1, rep.gilda: -1 }
          vai: quartieri-alti
        fallimento:
          titolo: La pergamena invisibile
          testo: |
            Kett ti ascolta muovendo le dita sul ginocchio, e alla fine ti dice
            che i ladri parlano sempre della sporcizia degli altri. Ti fa
            accompagnare al portone dai balestrieri, e il tuo nome lo scrive
            due volte.
          effetti: { sospetto: 2, rep.gilda: -1 }
          vai: quartieri-alti

  # ------------------------------------------------------------ 4 · il seguito: la cassaforte aperta
  - id: scuri-cdn-la-cassaforte-aperta
    immagine: ambientazione/mercato-dei-nodi
    titolo: La cassaforte aperta
    tipo: seguito
    luogo: La Casa dei Nodi, la cassaforte dei timbri
    area: scuri-casa-dei-nodi
    requisiti: [fazione.scuri == 10]
    testo: |
      Nella cassaforte ci sono due cassetti di ferro. Il primo contiene, su
      un panno di velluto, la matrice del timbro della Gilda, un cilindro
      d'ottone grande come un pugno con il sigillo inciso al contrario. Nel
      secondo c'è un registro rilegato in nero, con la grafia di Venn, e
      dentro i nomi dei funzionari della Gilda a libro paga, ognuno con le
      sue date. Alcuni nomi sono cancellati con una riga, e accanto c'è
      scritto a matita un altro pagatore, con una D.

      {politica-ed-economia Media} Il registro ti dà i funzionari, e Durgan
      perde quelli che ha comprato. La matrice fa valere ogni reliquia che
      timbri quanto una della Gilda. Se le prendi tutte e due, la Gilda non
      dorme finché non ti trova.

      {furtivita Media} Una cosa si porta via in silenzio. Due cose pesano
      il doppio, e i cassetti di ferro cigolano.
    opzioni:
      - testo: "Prendere la matrice del timbro"
        descrizione: "Una reliquia timbrata da te vale quanto una timbrata da loro. La Gilda verrà a cercarla."
        esito:
          titolo: La matrice
          testo: |
            Avvolgi la matrice nel velluto e la infili nella giubba, dove pesa
            come un sasso. Esci dalla Casa dei Nodi per la strada da cui sei
            venuto. All'alba la Gilda cambia le serrature, e il sigillo della
            matrice comincia a girare per la Città Bassa su reliquie che la
            Gilda non ha mai visto.
          imposta: { scuri.matrice: 1 }
          effetti: { fazione.scuri: 1, rep.scuri: 1, rep.gilda: -2, reliquie.frammento-inciso: 2 }
          vai: quartieri-alti

      - testo: "Prendere il registro dei funzionari pagati"
        descrizione: "Con il registro i funzionari sono tuoi. Durgan perde quelli che ha comprato."
        esito:
          titolo: Il registro nero
          testo: |
            Prendi il registro nero e lo infili nella giubba. Esci per la strada
            da cui sei venuto, e la mattina dopo Rozalia lo sfoglia sul tavolo e
            batte due volte la penna sul calamaio. In una settimana i funzionari
            che Durgan aveva comprato smettono di rispondere ai suoi uomini.
          imposta: { scuri.libro: 1 }
          effetti: { fazione.scuri: 1, rep.scuri: 1, rep.gilda: -1, informazioni.segreto: 1 }
          vai: quartieri-alti

      - testo: "Prendere tutti e due"
        descrizione: "La matrice e il registro. La Gilda non dorme finché non ti trova, e i cassetti di ferro cigolano."
        esito:
          titolo: Tutti e due
          testo: |
            Prendi la matrice e il registro, e il secondo cassetto cigola come
            una porta di cantina. Esci per la strada da cui sei venuto con la
            Casa dei Nodi che si sveglia alle tue spalle, una lanterna dopo
            l'altra. La mattina dopo in Città Bassa ci sono due miliziani della
            Gilda a ogni angolo, e cercano te.
          imposta: { scuri.matrice: 1, scuri.libro: 1 }
          effetti: { fazione.scuri: 1, rep.scuri: 1, rep.gilda: -2, sospetto: 2, informazioni.segreto: 1 }
          vai: quartieri-alti
