# La Casa dei Nodi di notte, spedizione del passo 11 della quest degli Scuri (fazione.scuri == 10). Ci si entra da
# scuri-la-casa-dei-nodi-di-notte (passi-3.yaml), che azzera scuri.allarme (o lo porta a 1 senza la pianta di Venn);
# la ritirata porta ai Quartieri Alti. Come il Maniero: le prove fallite alzano scuri.allarme, a tre le stanze si
# chiudono e arriva la ronda dei balestrieri (scuri-cdn-la-ronda), che riporta l'allarme a 1 in ogni ramo.
# Le stanze chiedono fazione.scuri == 10 e scuri.allarme < 3, in fasce di profondità:
# 0 le catene esterne (la terrazza dei carichi, le catene che reggono le terrazze);
# 1 gli uffici dei Custodi di Passaggio (la sala delle bilance, il dormitorio dei balestrieri, lo scrittoio di Venn,
#   con la finestra accostata se hai la copia dei suoi pagamenti);
# 2 l'archivio dei dazi (gli scaffali dei sigilli, il registro dei passaggi notturni);
# 3 il terzo piano (la sala con due porte, la scala dei Custodi).
# Il cuore a 4 è la cassaforte dei timbri: con l'allarme sotto a due si apre con la Tecnologia o con Correzione
# (prove Difficili), con l'allarme a due o più ci sono Varn Kett e due balestrieri (boss Difficile, o Persuasione
# Difficile per uscire con il solo registro). Il seguito sceglie la matrice, il registro o tutti e due, e chiude il passo.
aree:
  - id: scuri-casa-dei-nodi
    immagine: ambientazione/mercato-dei-nodi
    nome: La Casa dei Nodi di notte
    sommario: "In fondo all'archivio dei dazi c'è la cassaforte dei timbri."
    spedizione: { ritorno: quartieri-alti, soglia: 4, stanze: 3 }
    testo: |
      Di notte la Casa dei Nodi sembra più alta. Le terrazze si reggono l'una all'altra con catene che
      cigolano al vento della Cicatrice, e gli anelli sono lucidi dove sfregano da anni l'uno contro l'altro.
      A ogni piano si sposta una lanterna dei Custodi di Passaggio.

      Dentro ci sono uffici con gli scrittoi in fila e l'archivio dei dazi, un corridoio di scaffali che sale
      fino al terzo piano, dove la Gilda tiene le riunioni che non vuole far sentire. In fondo all'archivio
      c'è la cassaforte dei timbri, chiusa da una porta tonda più vecchia di tutto il legno che le sta
      intorno. Ogni rumore rimbomba sulle assi, e i Custodi hanno il sonno leggero di chi è pagato per averlo.

storylet:
  # ------------------------------------------------------------ 0 · le catene esterne
  - id: scuri-cdn-la-terrazza-dei-carichi
    immagine: ambientazione/mercato-dei-nodi
    titolo: La terrazza dei carichi
    sommario: "Sulla terrazza dei carichi ci sono sacchi e casse in attesa del mattino, e una lanterna dei Custodi che fa il giro."
    luogo: La Casa dei Nodi, la terrazza dei carichi
    area: scuri-casa-dei-nodi
    ripetibile: true
    requisiti: [fazione.scuri == 10, scuri.allarme < 3, profondita.scuri-casa-dei-nodi == 0]
    testo: |
      La terrazza dei carichi è piena di sacchi di grano e di casse con il sigillo della Gilda, in attesa
      delle chiatte del mattino. Le assi sono bagnate di rugiada e scricchiolano dove le travi sotto sono più
      distanti. Una lanterna dei Custodi la percorre avanti e indietro, e il Custode che la porta canticchia
      sempre la stessa strofa di una canzone dei Ponti. Dal bordo della terrazza sale il vento della
      Cicatrice, che sa di ferro bagnato.

      {furtivita Media} La lanterna fa il giro in cento passi, e nel frattempo dietro i sacchi c'è buio
      abbastanza per una persona. La luce si ferma contro la tela dei sacchi e non ci gira mai dietro.
    opzioni:
      - testo: "Passare dietro i sacchi fra un giro e l'altro"
        descrizione: "Cento passi di lanterna, e il buio dietro i sacchi. Bisogna contare."
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Media }
        successo:
          titolo: Cento passi
          testo: |
            Conti i passi del Custode insieme alla sua canzone, e quando la strofa ricomincia attraversi la
            terrazza dietro i sacchi. Metti i piedi dove le assi poggiano sulle travi, e il legno resta zitto.
            Arrivi alla porta di servizio prima che la lanterna torni, con le spalle incollate al muro e la
            canzone che ormai sai anche tu.
          effetti: { profondita.scuri-casa-dei-nodi: 1 }
        fallimento:
          titolo: Il sacco
          testo: |
            Urti un sacco, e il grano comincia a uscire da una cucitura con un fruscio lungo e si allarga
            sulle assi bagnate. La lanterna si ferma. Il Custode chiede due volte chi c'è, e poi chiama
            qualcuno al piano di sopra.
          effetti: { scuri.allarme: 1 }

      - testo: "Salire sulle casse fino alla terrazza di sopra"
        descrizione: "Le casse sono impilate fino a metà parete. Dalla cima si arriva alla balaustra della terrazza di sopra."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Media }
        successo:
          titolo: La balaustra
          testo: |
            Sali sulle casse come su una scala storta e ti aggrappi alla balaustra della terrazza di sopra,
            con il legno bagnato di rugiada sotto le dita. Il Custode passa sotto di te senza alzare la
            lanterna, e la sua strofa ti arriva da sotto i piedi. Ti tiri su con le braccia e scavalchi.
          effetti: { profondita.scuri-casa-dei-nodi: 1 }
        fallimento:
          titolo: La cassa che cede
          testo: |
            La cassa in cima si inclina sotto il tuo peso, e salti giù prima che cada. Cade lo stesso, con un
            rumore di vasellame rotto che rimbomba fra le terrazze. La lanterna arriva di corsa, e tu sei già
            dietro i sacchi con la faccia schiacciata contro la tela.
          effetti: { scuri.allarme: 1, ferite: 0.5 }

      - testo: "Aspettare il cambio dei Custodi"
        descrizione: "A mezzanotte i Custodi si danno il cambio, e per un po' la terrazza è vuota. Bisogna solo aspettare al freddo."
        costo: 2
        esito:
          titolo: Il cambio
          testo: |
            Aspetti fra i sacchi con il vento della Cicatrice nel collo finché non suona mezzanotte, e il
            vento ti porta i rintocchi a pezzi. Il Custode della canzone se ne va, e quello nuovo ci mette un
            po' ad arrivare, perché si ferma a parlare sulle scale. Attraversi la terrazza vuota con le mani
            gelate.
          effetti: { profondita.scuri-casa-dei-nodi: 1 }

  - id: scuri-cdn-le-catene
    immagine: ambientazione/ponti-sospesi
    titolo: Le catene delle terrazze
    sommario: "Le terrazze della Casa dei Nodi sono appese l'una all'altra con catene grosse come un braccio. Salirle è la strada più corta."
    luogo: La Casa dei Nodi, le catene esterne
    area: scuri-casa-dei-nodi
    ripetibile: true
    requisiti: [fazione.scuri == 10, scuri.allarme < 3, profondita.scuri-casa-dei-nodi == 0]
    testo: |
      Dal bordo della terrazza più bassa partono le catene che reggono quella di sopra, grosse come un braccio
      e fredde di rugiada. Sono una decina, tirate in diagonale verso l'alto, e il vento le fa cantare. Dove
      le catene entrano nel bordo i perni sono ribattuti a caldo, e la ruggine colata ha annerito il legno
      tutto intorno. Sopra, a quattro uomini d'altezza, c'è la finestra degli uffici dei Custodi.

      {atletica Media} Le catene tese reggono un uomo. Quelle che pendono un poco sono messe lì per bellezza e
      non reggono niente, e nel vento la loro nota è più bassa.
    opzioni:
      - testo: "Salire sulla catena più tesa"
        descrizione: "Mani e ginocchia, e il vento che la fa cantare. Quella più tesa regge di sicuro."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Media }
        successo:
          titolo: La catena tesa
          testo: |
            Sali a mani e ginocchia sulla catena più tesa, un anello alla volta, e il vento ti spinge contro
            il ferro invece di strapparti via. Sotto le ginocchia senti la catena vibrare della sua nota. Alla
            finestra degli uffici arrivi con le mani rosse di ruggine, e la finestra è chiusa con un gancio
            che si apre con una lama.
          effetti: { profondita.scuri-casa-dei-nodi: 1 }
        fallimento:
          titolo: La catena per bellezza
          testo: |
            La catena che hai scelto pende un poco più delle altre, e a metà salita scende di colpo di un
            palmo con un clangore che sveglia mezza terrazza. Ti lasci cadere sulle casse, e l'urto ti svuota
            i polmoni. Sopra di te la catena messa lì per bellezza oscilla ancora, e il vento ci canta dentro
            più basso che nelle altre.
          effetti: { scuri.allarme: 1, ferite: 0.5 }

      - testo: "Arrampicarsi sulla parete, sugli anelli dei carichi"
        descrizione: "Sul muro ci sono gli anelli di ferro per legare i carichi, uno ogni braccio. È una scala, se non si ha fretta."
        costo: 2
        esito:
          titolo: Gli anelli
          testo: |
            Sali sugli anelli di ferro uno dopo l'altro, adagio, controllando ogni presa due volte. Gli anelli
            sono murati nel piombo, e uno ogni tanto gira nella sua sede quando ci metti il peso. Ci metti il
            doppio del tempo, e quando arrivi alla finestra degli uffici hai le dita che non si chiudono più.
            La finestra però è lì, e dentro è buio.
          effetti: { profondita.scuri-casa-dei-nodi: 1 }

      - testo: "Scegliere la catena giusta come un mercante dei Ponti"
        descrizione: "Ai Ponti si sa quali catene della Casa dei Nodi reggono e quali sono messe per far vedere."
        quando: [origine.mercante-dei-ponti >= 1]
        esito:
          titolo: Per far vedere
          testo: |
            Ai banchi del Mercato dei Nodi si scherza sulle catene della Casa, che per metà sono messe per far
            vedere. Ti ricordi quali, e sali su una delle altre senza esitare, mentre il vento canta più basso
            in quelle finte. Alla finestra degli uffici arrivi senza un graffio.
          effetti: { profondita.scuri-casa-dei-nodi: 1 }

  # ------------------------------------------------------------ 1 · gli uffici dei Custodi di Passaggio
  - id: scuri-cdn-la-sala-delle-bilance
    immagine: ambientazione/mercato-dei-nodi
    titolo: La sala delle bilance
    sommario: "Una sala piena di bilance da dazio, e su ognuna un campanello che suona se si muove il piatto."
    luogo: La Casa dei Nodi, la sala delle bilance
    area: scuri-casa-dei-nodi
    ripetibile: true
    requisiti: [fazione.scuri == 10, scuri.allarme < 3, profondita.scuri-casa-dei-nodi == 1]
    testo: |
      La sala delle bilance è lunga e bassa, con le bilance da dazio in fila come banchi di scuola. Ognuna ha
      i piatti d'ottone e un campanellino appeso al giogo, che la Gilda ci ha messo contro chi le tocca di
      notte. Sopra l'ultima dorme un gatto grigio, e sotto il suo peso il piatto è sceso fino al banco.

      {tecnologia Media} I campanelli sono legati al giogo con un filo, e se blocchi il giogo il piatto si
      muove in silenzio.
    opzioni:
      - testo: "Bloccare i gioghi e passare in mezzo"
        descrizione: "Un dito sul giogo, un passo, il dito sul giogo dopo. Un lavoro di pazienza."
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Media }
        successo:
          titolo: I gioghi
          testo: |
            Passi fra le bilance tenendo un dito su ogni giogo mentre ti sposti, e i campanelli restano zitti.
            L'ottone dei gioghi è freddo e unto di grasso, e il dito ci scivola appena smetti di premere. Il
            gatto ti guarda arrivare fino alla porta in fondo, e quando la apri sbadiglia.
          effetti: { profondita.scuri-casa-dei-nodi: 1 }
        fallimento:
          titolo: Il campanello
          testo: |
            Alla terza bilancia il giogo ti scappa da sotto il dito, e il campanello suona a lungo con una
            nota sottile. Il gatto salta giù e scappa, e il suo piatto risale con un altro squillo mentre dal
            corridoio arrivano dei passi.
          effetti: { scuri.allarme: 1 }

      - testo: "Passare lungo il muro, lontano dalle bilance"
        descrizione: "Fra le bilance e il muro c'è un passaggio stretto. Ci si passa di fianco, senza toccare niente."
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Media }
        successo:
          titolo: Di fianco
          testo: |
            Passi di fianco lungo il muro con la pancia in dentro, e i piatti d'ottone ti sfiorano la giubba
            senza muoversi. L'intonaco ti lascia una striscia bianca sulla schiena. In fondo alla sala il
            gatto si stira e ti apre la strada come un portiere.
          effetti: { profondita.scuri-casa-dei-nodi: 1 }
        fallimento:
          titolo: Il gomito
          testo: |
            Il gomito ti tocca un piatto, e tutte le bilance della fila suonano una dopo l'altra, come campane
            a festa. Ti appiattisci contro il muro aspettando i passi, mentre in fondo alla fila l'ultimo
            campanello oscilla ancora.
          effetti: { scuri.allarme: 1 }

      - testo: "Portare via il gatto, e aspettare"
        descrizione: "Se il gatto scende dalla bilancia, la fa suonare. Meglio prenderlo in braccio e aspettare che si addormenti."
        costo: 2
        esito:
          titolo: Il gatto grigio
          testo: |
            Prendi in braccio il gatto grigio prima che decida di scendere, e lui si lascia prendere. Con la
            mano libera tieni fermo il giogo, e il piatto vuoto risale senza un suono. Lo tieni in braccio
            fino alle fusa, studiando la sala. Quando lo posi su una sedia vuota hai capito dove passare.
          effetti: { profondita.scuri-casa-dei-nodi: 1 }

  - id: scuri-cdn-il-dormitorio-dei-balestrieri
    immagine: fazioni/gilda-dei-mercanti
    titolo: Il dormitorio dei balestrieri
    sommario: "Per arrivare all'archivio si passa da un dormitorio di balestrieri della Gilda. Dormono, quasi tutti."
    luogo: La Casa dei Nodi, il dormitorio dei balestrieri
    area: scuri-casa-dei-nodi
    ripetibile: true
    requisiti: [fazione.scuri == 10, scuri.allarme < 3, profondita.scuri-casa-dei-nodi == 1]
    testo: |
      Il corridoio per l'archivio passa da un dormitorio con le brande in fila e una balestra appesa sopra
      ognuna. Dodici balestrieri della Gilda dormono a bocca aperta, e l'aria sa di lana bagnata e di sego. In
      fondo uno si cuce una calza alla luce di un mozzicone, e sul muro dietro di lui le ombre delle balestre
      si allungano fino al soffitto.

      {armi-da-distanza Media} Le balestre sono scariche, con la corda allentata, e i dardi stanno in una
      cassa vicino alla porta. Per caricarne una ci vuole il tempo di contare fino a dieci.
    opzioni:
      - testo: "Passare fra le brande"
        descrizione: "Dodici uomini che dormono e uno che cuce. Un passo alla volta, fra il russare."
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Media }
        successo:
          titolo: Fra le brande
          testo: |
            Passi fra le brande mettendo i piedi vicino ai chiodi delle assi, dove il legno non cede, e il
            russare ti copre i passi. Quello che cuce la calza si punge un dito proprio mentre gli passi alle
            spalle. Impreca a bassa voce e se lo mette in bocca, e quando rialza la testa tu sei già
            uscit{o|a}.
          effetti: { profondita.scuri-casa-dei-nodi: 1 }
        fallimento:
          titolo: La calza
          testo: |
            Quello che cuce alza la testa e ti vede. Restate a guardarvi in silenzio, con l'ago a mezz'aria e
            il filo che gli pende dalle dita. Poi lui apre la bocca, e tu sei già fuori dalla porta. Dietro di
            te il dormitorio si sveglia, e le brande cigolano tutte insieme.
          effetti: { scuri.allarme: 1 }

      - testo: "Convincere quello sveglio che sei un Custode"
        descrizione: "Di notte gli uffici sono pieni di Custodi che non conoscono tutti. Un tono annoiato e un'aria di fretta bastano."
        prova: { attributo: sociale, abilita: [ingannare, galateo], difficolta: Media }
        successo:
          titolo: Il Custode di turno
          testo: |
            Entri come se il dormitorio fosse tuo e chiedi con voce annoiata a quello della calza se ha visto
            passare l'ispettore. Lui ti risponde di no con l'ago fra i denti e ti indica la porta
            dell'archivio, e torna alla sua calza.
          effetti: { profondita.scuri-casa-dei-nodi: 1 }
        fallimento:
          titolo: Quale ispettore
          testo: |
            Gli chiedi dell'ispettore, e lui ti chiede quale, perché stanotte di ispettori non ce ne sono. Ti
            guarda meglio, dai piedi alla faccia. Torni indietro dicendo che allora hai sbagliato piano, e lui
            posa la calza.
          effetti: { scuri.allarme: 1 }

      - testo: "Fare il giro dal cortile"
        descrizione: "Il dormitorio si evita passando dal cortile interno, sotto le finestre degli uffici. È lungo, e al freddo."
        costo: 2
        esito:
          titolo: Il cortile interno
          testo: |
            Torni indietro e scendi nel cortile interno, dove il vento della Cicatrice gira in tondo come in
            un pozzo e solleva la polvere in mulinelli. Lo attraversi rasente al muro fino a una porta di
            servizio dell'archivio, che si apre con una spinta. Ci hai messo un'ora, e non hai più sensibilità
            nelle orecchie.
          effetti: { profondita.scuri-casa-dei-nodi: 1 }

  - id: scuri-cdn-lo-scrittoio-di-venn
    immagine: ambientazione/mercato-dei-nodi
    titolo: Lo scrittoio di Venn
    sommario: "La sala degli ispettori dei lotti, con gli scrittoi in fila. Quello di Cosimo Venn è il più vicino alla finestra."
    luogo: La Casa dei Nodi, la sala degli ispettori dei lotti
    area: scuri-casa-dei-nodi
    ripetibile: true
    requisiti: [fazione.scuri == 10, scuri.allarme < 3, profondita.scuri-casa-dei-nodi == 1]
    testo: |
      Di notte la sala degli ispettori dei lotti è vuota, e sugli scrittoi in fila i calamai sono chiusi con
      il tappo di sughero. Sullo scrittoio di Cosimo Venn, il più vicino alla finestra, c'è ancora un rametto
      di menta masticato a metà. Dalla finestra il tetto dell'archivio dei dazi è a un salto.

      {percezione Media} Nel cassetto dove Venn teneva il quaderno nero ci sono soltanto monete da cinque e
      una pianta dell'archivio disegnata a matita. Sulle pieghe la matita è sbiadita, e la carta è più gialla
      di tutto il resto del cassetto.
    opzioni:
      - testo: "Uscire dalla finestra accostata"
        descrizione: "Venn ti ha promesso che stanotte la finestra del suo scrittoio sarebbe rimasta accostata."
        quando: [scuri.venn >= 1]
        esito:
          titolo: La finestra di Venn
          testo: |
            La finestra dello scrittoio di Venn è accostata, come aveva promesso, con un pezzo di carta
            piegato nel battente perché non sbatta. Esci sul davanzale bagnato e salti sul tetto
            dell'archivio, e atterri sulle tegole senza un rumore.
          effetti: { profondita.scuri-casa-dei-nodi: 1 }

      - testo: "Saltare sul tetto dell'archivio"
        descrizione: "Due braccia più in basso, e le tegole bagnate. Il salto si fa una volta sola."
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Media }
        successo:
          titolo: Le tegole
          testo: |
            Apri la finestra e salti dal davanzale. Atterri sulle tegole con le ginocchia piegate, e una
            tegola scivola via e cade nel cortile, dove nessuno la sente. Il lucernario dell'archivio ha il
            telaio gonfio di umidità e cede alla seconda spinta, e scendi fra gli scaffali.
          effetti: { profondita.scuri-casa-dei-nodi: 1 }
        fallimento:
          titolo: La grondaia
          testo: |
            Salti, e le tegole bagnate ti scivolano sotto i piedi. Ti ritrovi appes{o|a} alla grondaia con un
            braccio solo, e la grondaia si piega sui suoi ganci con un cigolio lungo. Torni dentro dalla
            finestra a forza di braccia, mentre di sotto qualcuno apre un'imposta.
          effetti: { scuri.allarme: 1, ferite: 0.5 }

      - testo: "Seguire la pianta del cassetto"
        descrizione: "Nel cassetto di Venn c'è una pianta dell'archivio. Seguirla vuol dire passare dalle scale, e le scale sono lunghe."
        prova: { attributo: mentale, abilita: [percezione, accademiche], difficolta: Media }
        successo:
          titolo: La pianta a matita
          testo: |
            Leggi la pianta alla luce della finestra e trovi un passaggio che dalla sala degli ispettori
            scende all'archivio per una scala di servizio. La segui contando le porte. Sui gradini della scala
            di servizio la polvere è intatta, e arrivi fra gli scaffali senza incontrare nessuno.
          effetti: { profondita.scuri-casa-dei-nodi: 1 }
        fallimento:
          titolo: La porta sbagliata
          testo: |
            Segui la pianta, e la pianta è vecchia. La porta che dovrebbe dare sulla scala dà su uno
            sgabuzzino pieno di scope, che cadono tutte insieme sulle assi con un rumore che rimbomba per
            tutto il piano.
          effetti: { scuri.allarme: 1 }

  # ------------------------------------------------------------ 2 · l'archivio dei dazi
  - id: scuri-cdn-gli-scaffali-dei-sigilli
    immagine: ambientazione/biblioteca-di-qir-azel
    titolo: Gli scaffali dei sigilli
    sommario: "L'archivio dei dazi è un labirinto di scaffali, e ogni corridoio porta il sigillo di un anno."
    luogo: La Casa dei Nodi, l'archivio dei dazi
    area: scuri-casa-dei-nodi
    ripetibile: true
    requisiti: [fazione.scuri == 10, scuri.allarme < 3, profondita.scuri-casa-dei-nodi == 2]
    testo: |
      L'archivio dei dazi è un labirinto di scaffali carichi di registri fino al soffitto, e fra gli scaffali
      l'aria è secca di carta vecchia. In testa a ogni corridoio una targa d'ottone porta il sigillo di un
      anno, a partire dal Patto delle Corde. Le targhe dei primi anni sono verdi di ossido, e nei corridoi
      vecchi la polvere sui registri è alta un dito. Secondo Rozalia la cassaforte dei timbri sta in fondo al
      corridoio dell'anno in cui il timbro è cambiato.

      {accademiche Media} La Gilda lo ha cambiato dopo uno scandalo di dazi falsi finito su tutti gli
      almanacchi. Se ti ricordi l'anno, sai qual è il corridoio.
    opzioni:
      - testo: "Ricordare l'anno in cui la Gilda cambiò il timbro"
        descrizione: "Uno scandalo di dazi falsi, finito su tutti gli almanacchi. Bisogna ricordare quale."
        prova: { attributo: mentale, abilita: [accademiche, politica-ed-economia], difficolta: Media }
        successo:
          titolo: L'anno dello scandalo
          testo: |
            Te lo ricordi a metà corridoio, insieme al nome del funzionario che fu impiccato sul Ponte delle
            Mille Corde. Trovi la targa giusta, e il corridoio dell'anno dello scandalo finisce contro una
            porta di ferro con una serratura dei Precursori. La porta ha la ruggine nelle giunture. La
            serratura è di un metallo grigio e liscio senza un graffio, e resta fredda sotto la mano anche
            dopo che ce l'hai tenuta.
          effetti: { profondita.scuri-casa-dei-nodi: 1 }
        fallimento:
          titolo: Gli almanacchi
          testo: |
            Ti ricordi lo scandalo, e non l'anno. Percorri tre corridoi sbagliati, e nel terzo la polvere dei
            registri ti entra nel naso e starnutisci. Lo starnuto rimbomba fra gli scaffali, e al piano di
            sopra una porta si apre.
          effetti: { scuri.allarme: 1 }

      - testo: "Seguire le impronte nella polvere"
        descrizione: "Chi va alla cassaforte di notte lascia impronte nei corridoi vecchi, dove nessuno spazza."
        prova: { attributo: mentale, abilita: [percezione, natura], difficolta: Media }
        successo:
          titolo: Le impronte
          testo: |
            Nella polvere di un corridoio vecchio ci sono impronte di stivali puliti che vanno e tornano
            sempre per la stessa strada. Hanno il tacco stretto e sono tutte della stessa misura. Le segui
            fino a una porta di ferro con una serratura dei Precursori. Gli stivali puliti, in questa casa, li
            porta uno solo.
          effetti: { profondita.scuri-casa-dei-nodi: 1 }
        fallimento:
          titolo: Le tue impronte
          testo: |
            Segui delle impronte per mezz'ora prima di accorgerti che sono le tue. Nei corridoi vecchi le
            targhe sono tutte verdi allo stesso modo, e la polvere è la stessa. Quando torni al punto di
            partenza, in fondo al corridoio principale c'è la luce di una lanterna che si avvicina.
          effetti: { scuri.allarme: 1 }

      - testo: "Leggere le targhe una per una"
        descrizione: "Senza ricordare l'anno, si leggono tutte le targhe. Ci vuole la notte."
        costo: 2
        esito:
          titolo: Tutte le targhe
          testo: |
            Leggi le targhe d'ottone una per una con la candela riparata dalla mano, e ogni targa ti dice un
            anno e un sigillo. La cera ti cola sulle dita e si indurisce. Alla trentesima il sigillo cambia
            forma. Il corridoio finisce contro una porta di ferro con una serratura dei Precursori, e la
            serratura è l'unica cosa del corridoio senza polvere.
          effetti: { profondita.scuri-casa-dei-nodi: 1 }

  - id: scuri-cdn-il-registro-dei-passaggi-notturni
    immagine: ambientazione/ponti-sospesi
    titolo: Il registro dei passaggi notturni
    sommario: "Sul leggio dell'archivio è aperto il registro dei carichi passati di notte sui Ponti. Qualcuno ci ha scritto stanotte."
    luogo: La Casa dei Nodi, il leggio dell'archivio
    area: scuri-casa-dei-nodi
    ripetibile: true
    requisiti: [fazione.scuri == 10, scuri.allarme < 3, profondita.scuri-casa-dei-nodi == 2]
    testo: |
      In mezzo all'archivio un leggio di legno scuro regge il registro dei passaggi notturni, dove i Custodi
      segnano i carichi che attraversano i Ponti dopo il tramonto. Il piano inclinato è consumato in due
      conche chiare dove da anni si appoggiano i gomiti di chi scrive. La penna accanto al calamaio è ancora
      umida. L'ultima riga è di stanotte e porta il sigillo di una licenza per i carichi notturni. Lontano fra
      gli scaffali un cucchiaino batte contro una tazza.

      {politica-ed-economia Media} Rozalia vende a Venn licenze come questa. Il carico è passato con il timbro
      della Gilda, e la Gilda non sa di averlo dato.
    opzioni:
      - testo: "Leggere le ultime pagine e passare oltre"
        descrizione: "Chi passa di notte sui Ponti con le licenze di Rozalia vale un segreto. Basta leggere in fretta."
        prova: { attributo: mentale, abilita: [percezione, politica-ed-economia], difficolta: Media }
        successo:
          titolo: Le licenze di Rozalia
          testo: |
            Leggi le ultime pagine in fretta seguendo le righe con l'unghia, e trovi undici licenze di Rozalia
            in un mese. Hanno tutte lo stesso nome di carico, *casse di menta*. Ti viene da ridere. Lo tieni a
            mente e passi oltre prima che torni chi ha lasciato la penna.
          effetti: { profondita.scuri-casa-dei-nodi: 1, informazioni.segreto: 1 }
        fallimento:
          titolo: Chi torna
          testo: |
            Leggi troppo a lungo, e chi aveva lasciato la penna torna con una tazza in mano. È un vecchio
            Custode con gli occhiali sulla fronte, e quando ti vede lascia cadere la tazza. La tazza va in
            pezzi sul pavimento con un rumore che corre fra gli scaffali.
          effetti: { scuri.allarme: 1 }

      - testo: "Nasconderti dietro il leggio e aspettare chi torna"
        descrizione: "Chi scrive di notte nel registro torna alla penna. Si può vedere chi è, e dove va dopo."
        prova: { attributo: fisico, abilita: [furtivita, resistenza], difficolta: Media }
        successo:
          titolo: Il Custode con la tazza
          testo: |
            Ti accucci dietro il leggio, dove l'odore dell'inchiostro è più forte. Torna un vecchio Custode
            con gli occhiali sulla fronte e una tazza fumante. Scrive un'altra riga e se ne va verso il fondo
            dell'archivio, dove una porta di ferro si apre e si richiude con un colpo che ti arriva dalle assi
            alle ginocchia. Sai dov'è la cassaforte, e sai che lui ha la chiave.
          effetti: { profondita.scuri-casa-dei-nodi: 1 }
        fallimento:
          titolo: La tazza
          testo: |
            Il vecchio Custode torna con una tazza fumante e, prima di scrivere, si gira a guardare dietro il
            leggio come se sapesse. Ti vede, e la tazza gli scivola dalle dita e si rovescia sulle assi in una
            pozza che fuma.
          effetti: { scuri.allarme: 1 }

      - testo: "Strappare l'ultima pagina e andare"
        descrizione: "La pagina con le licenze di Rozalia può servire. Strappata con calma, non fa rumore."
        esito:
          titolo: La pagina
          testo: |
            Strappi l'ultima pagina con calma, piegandola prima lungo la cucitura finché il filo cede senza un
            rumore, e te la infili nella giubba. Il registro resta aperto su una pagina bianca. Chi torna alla
            penna se ne accorgerà domattina, e stanotte tu sarai già altrove.
          effetti: { profondita.scuri-casa-dei-nodi: 1, informazioni.pettegolezzo: 1, scuri.allarme: 0.5 }

  # ------------------------------------------------------------ 3 · il terzo piano
  - id: scuri-cdn-la-sala-delle-due-porte
    immagine: ambientazione/quartieri-alti
    titolo: La sala delle due porte
    sommario: "Al terzo piano c'è la sala delle riunioni riservate, con due porte che si chiudono soltanto da dentro. Dall'altra parte c'è la cassaforte."
    luogo: La Casa dei Nodi, il terzo piano
    area: scuri-casa-dei-nodi
    ripetibile: true
    requisiti: [fazione.scuri == 10, scuri.allarme < 3, profondita.scuri-casa-dei-nodi == 3]
    testo: |
      Il terzo piano è una sala sola, dove la Gilda tiene le riunioni riservate intorno a un tavolo ovale. Ha
      due porte di quercia con le bandelle di ferro che si chiudono solo da dentro con un catenaccio, e per
      arrivare alla cassaforte bisogna attraversare la sala. Stanotte una è chiusa, e da sotto filtra una lama
      di luce. La luce resta ferma sulle assi del corridoio, e nessuna ombra ci passa davanti.

      {tecnologia Media} Il catenaccio è a molla e scatta da solo se spingi la porta nel punto giusto. Lo dice
      la vernice, che è consumata dove le mani hanno spinto per anni sempre nello stesso posto.

      {origine rampollo-dei-quartieri-alti} Da {ragazzino|ragazzina} entravi qui dietro tuo padre, che
      spingeva la porta sinistra in alto con il palmo quando il catenaccio faceva i capricci.
    opzioni:
      - testo: "Spingere la porta nel punto giusto"
        descrizione: "Un catenaccio a molla si apre se la porta si spinge dove la molla è più debole."
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Media }
        successo:
          titolo: La molla
          testo: |
            Passi le dita lungo lo stipite finché senti sotto il legno la tensione della molla, poi spingi
            piano con il palmo e il catenaccio scatta da solo. La porta si apre sulla sala vuota. La lama di
            luce veniva da una lanterna dimenticata sul tavolo ovale, con lo stoppino corto e il vetro
            annerito da una notte intera. La porta di fronte dà sulla cassaforte.
          effetti: { profondita.scuri-casa-dei-nodi: 1 }
        fallimento:
          titolo: Il catenaccio
          testo: |
            Spingi la porta dove ti sembra, e il catenaccio non si muove. Ci metti più forza, e la porta
            sbatte contro il telaio con un colpo sordo che scende per le assi fino al piano di sotto. Nella
            sala, dietro la porta, qualcuno sposta una sedia.
          effetti: { scuri.allarme: 1 }

      - testo: "Passare dal cornicione esterno"
        descrizione: "La sala ha finestre sul vuoto, e sotto le finestre corre un cornicione. Si passa fuori, e si rientra dall'altra parte."
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Media }
        successo:
          titolo: Il cornicione
          testo: |
            Esci da una finestra del corridoio e cammini sul cornicione con la faccia contro il muro e il
            vento della Cicatrice nella schiena. Il cornicione è largo quanto il tuo piede, e sotto di te le
            catene delle terrazze cigolano a ogni raffica. Due finestre più in là rientri, e sei dall'altra
            parte della sala, davanti alla cassaforte.
          effetti: { profondita.scuri-casa-dei-nodi: 1 }
        fallimento:
          titolo: Il vento
          testo: |
            Sul cornicione il vento ti strappa il cappuccio e lo porta via nel buio della Cicatrice, e non lo
            vedi scendere. Rientri dalla finestra di partenza con il cuore che ti batte nelle orecchie, e dal
            cortile qualcuno chiede chi c'è.
          effetti: { scuri.allarme: 1, tormento: 1 }

      - testo: "Spingere la porta come faceva tuo padre"
        descrizione: "Il palmo in alto, sulla porta sinistra, quando il catenaccio faceva i capricci."
        quando: [origine.rampollo-dei-quartieri-alti >= 1]
        esito:
          titolo: Come tuo padre
          testo: |
            Spingi la porta sinistra con il palmo, in alto, come faceva tuo padre, e il catenaccio scatta con
            lo stesso rumore di allora. Il legno sotto la tua mano è liscio e più scuro, dove lui appoggiava
            la sua. Ti volti verso il corridoio come se dovesse entrare anche lui. La sala è vuota, e
            dall'altra parte c'è la cassaforte.
          effetti: { profondita.scuri-casa-dei-nodi: 1 }

  - id: scuri-cdn-la-scala-dei-custodi
    immagine: ambientazione/ponti-sospesi
    titolo: La scala dei Custodi
    sommario: "Una scala a chiocciola sale al terzo piano dentro una torretta di corde e legno, e cigola a ogni gradino."
    luogo: La Casa dei Nodi, la torretta della scala
    area: scuri-casa-dei-nodi
    ripetibile: true
    requisiti: [fazione.scuri == 10, scuri.allarme < 3, profondita.scuri-casa-dei-nodi == 3]
    testo: |
      La scala dei Custodi sale a chiocciola in una torretta di legno legata con le corde come i ponti, e ogni
      gradino cigola in modo diverso. Le corde sono di canapa catramata, e dove passano intorno ai pali hanno
      scavato nel legno dei solchi lisci. In cima, dietro la porta del pianerottolo, c'è la cassaforte dei
      timbri. A metà scala un Custode dorme con la lanterna fra le ginocchia, e la fiamma bassa gli illumina
      il mento da sotto.

      {empatia Facile} È un ragazzo che si è messo sulla scala per sentire arrivare tutti, e si è addormentato
      lo stesso. Tiene ancora la mano stretta sul manico della lanterna.
    opzioni:
      - testo: "Salire sul bordo dei gradini, scavalcando il Custode"
        descrizione: "Sul bordo i gradini tacciono. Il ragazzo addormentato, però, occupa mezza scala."
        prova: { attributo: fisico, abilita: [atletica, furtivita], difficolta: Media }
        successo:
          titolo: Il bordo
          testo: |
            Sali sul bordo dei gradini con una mano sulla corda della torretta, che è tesa come una sartia.
            Scavalchi il ragazzo addormentato con un passo lungo, e lui si gira nel sonno e borbotta un nome.
            Arrivi al pianerottolo senza un cigolio.
          effetti: { profondita.scuri-casa-dei-nodi: 1 }
        fallimento:
          titolo: Il cigolio
          testo: |
            Al passo lungo il gradino sotto di te cigola con una nota acuta, e il ragazzo apre gli occhi. Ti
            guarda a lungo con gli occhi ancora pieni di sonno e la lanterna che gli trema fra le ginocchia,
            finché non si mette a gridare.
          effetti: { scuri.allarme: 1 }

      - testo: "Svegliarlo con gentilezza e dirgli di tornare a letto"
        descrizione: "Un ragazzo addormentato sulla scala si spaventa. Uno svegliato con gentilezza, a volte, obbedisce."
        prova: { attributo: sociale, abilita: [persuasione, ingannare], difficolta: Media }
        successo:
          titolo: A letto
          testo: |
            Gli tocchi la spalla e gli dici, con la voce di un sergente stanco, che il turno è finito e che
            può andare a dormire nel suo letto. Lui si alza ringraziandoti e scende la scala con la lanterna,
            strascicando i piedi. La luce gira giù per la chiocciola e sparisce, e tu sali al buio con la mano
            sulla corda.
          effetti: { profondita.scuri-casa-dei-nodi: 1 }
        fallimento:
          titolo: Il sergente
          testo: |
            Gli dici che il turno è finito, e lui ti chiede chi sei, perché il sergente stanotte è sua zia. Lo
            guardi. Lui guarda te e scende la scala di corsa, e ogni gradino gli risponde con il suo cigolio
            fino in fondo.
          effetti: { scuri.allarme: 1 }

      - testo: "Aspettare che si svegli e se ne vada"
        descrizione: "Chi dorme sulla scala prima o poi si sveglia con il collo storto, e va a cercare un letto."
        costo: 2
        esito:
          titolo: Il collo storto
          testo: |
            Aspetti in fondo alla scala per un'ora intera al buio, e impari a riconoscere lo scricchiolio
            della torretta quando il vento della Cicatrice tira le corde. Alla fine il ragazzo si sveglia e si
            massaggia il collo, poi scende borbottando senza vederti. Sali sul bordo dei gradini fino al
            pianerottolo.
          effetti: { profondita.scuri-casa-dei-nodi: 1 }

  # ------------------------------------------------------------ la ronda dei balestrieri (allarme a 3)
  - id: scuri-cdn-la-ronda
    immagine: fazioni/gilda-dei-mercanti
    titolo: La ronda dei balestrieri
    sommario: "L'allarme è suonato. Due balestrieri della Gilda salgono le scale con le lanterne, e frugano una stanza dopo l'altra."
    luogo: La Casa dei Nodi, un corridoio
    area: scuri-casa-dei-nodi
    requisiti: [fazione.scuri == 10, scuri.allarme >= 3]
    testo: |
      Adesso la Casa dei Nodi è sveglia. Per i corridoi si sentono porte che si aprono e voci che chiamano, e
      due balestrieri della Gilda salgono le scale con le lanterne alte e le balestre cariche, frugando una
      stanza dopo l'altra. Senti i loro stivali sulle assi del piano di sotto e il colpo secco di ogni porta
      che spalancano. Arriveranno alla tua fra poco.

      {furtivita Media} Sopra la porta c'è una mensola larga di quercia, piena di registri vecchi e di
      polvere. Chi ci sale e resta immobile non lo cerca nessuno.
    opzioni:
      - testo: "Aspettarli dietro la porta"
        descrizione: "Due balestrieri in un corridoio stretto. Se li metti giù prima che tirino, la casa torna a dormire."
        combattimento: scuri-la-ronda-dei-balestrieri
        vittoria:
          titolo: Dietro la porta
          testo: |
            Il primo balestriere entra con la lanterna avanti, e tu sei dietro la porta. Il secondo tira e
            manca, e il dardo si pianta nello stipite e resta lì a vibrare. Quando sono a terra li leghi con
            le cinghie delle loro balestre e li chiudi in un armadio. La casa, poco alla volta, torna a
            dormire.
          imposta: { scuri.allarme: 1 }
        sconfitta:
          titolo: Il dardo
          testo: |
            Il dardo ti prende di striscio sul braccio, e scappi per un corridoio che non conosci finché non
            perdi le lanterne. Ti nascondi in uno sgabuzzino per un'ora a fasciarti il braccio con la camicia,
            e senti gli stivali passare due volte davanti alla porta. Quando esci la casa si è calmata.
          imposta: { scuri.allarme: 1 }
          effetti: { sospetto: 1.5 }

      - testo: "Salire sulla mensola sopra la porta"
        descrizione: "Chi cerca guarda per terra e dietro le porte. Sopra la porta non guarda nessuno."
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Difficile }
        successo:
          titolo: La mensola
          testo: |
            Sali sulla mensola fra i registri vecchi e ti fai piccol{o|a}, con le ginocchia contro il petto e
            la tavola che si flette sotto il tuo peso. I balestrieri entrano e guardano dappertutto tranne che
            in alto, e poi se ne vanno. Resti lassù finché la casa non torna a dormire, con la polvere dei
            registri nel naso.
          pe: { furtivita: 5 }
          imposta: { scuri.allarme: 1 }
        fallimento:
          titolo: Il registro che cade
          testo: |
            Sali sulla mensola, e un registro vecchio scivola giù e cade di piatto ai piedi del primo
            balestriere in una nuvola di polvere. Lui alza la lanterna. Salti giù e scappi, e il dardo ti
            prende di striscio. Perdi le lanterne in un corridoio, e aspetti in uno sgabuzzino che la casa si
            calmi.
          imposta: { scuri.allarme: 1 }
          effetti: { ferite: 1, sospetto: 1.5 }

      - testo: "Comprare il silenzio della ronda"
        descrizione: "I balestrieri della Gilda sono pagati poco, e lo sanno. Una borsa pesante e un nome sbagliato da scrivere nel rapporto."
        requisiti: [monete >= 20]
        esito:
          titolo: Il rapporto
          testo: |
            Esci dalla stanza con le mani alzate e una borsa in una delle due. I balestrieri si guardano. Poi
            il più vecchio prende la borsa e la soppesa sul palmo prima di dire all'altro che nel rapporto
            scriveranno di un gatto. Se ne vanno, e la casa torna a dormire.
          imposta: { scuri.allarme: 1 }
          effetti: { monete: -20 }

  # ------------------------------------------------------------ 4 · il cuore: la cassaforte dei timbri
  - id: scuri-cdn-la-cassaforte-dei-timbri
    immagine: personaggi/varn-kett
    titolo: La cassaforte dei timbri
    sommario: "In fondo all'archivio dei dazi c'è la cassaforte dei timbri, chiusa da un congegno dei Precursori. Dentro ci sono la matrice e il registro."
    luogo: La Casa dei Nodi, la cassaforte dei timbri
    area: scuri-casa-dei-nodi
    requisiti: [fazione.scuri == 10, profondita.scuri-casa-dei-nodi >= 4]
    testo: |
      La cassaforte dei timbri è una stanzetta foderata di ferro, chiusa da una porta tonda dei Precursori. Le
      lastre delle pareti sono chiodate a mano e hanno le giunture scure di ruggine. La porta incassata in
      mezzo è di un metallo grigio che non ha una giuntura né un graffio. Sulla porta un disco di metallo è
      diviso in spicchi incisi con un simbolo ciascuno. Rozalia dice che dietro ci sono la matrice del timbro
      e il registro di Venn con i funzionari pagati.

      {tecnologia Difficile} Ogni simbolo ha un posto, e il congegno sente quando ce lo metti. Se appoggi
      l'orecchio al disco senti dietro un ticchettio lento, e nessuno lo ha caricato.

      Se la casa è sveglia, Varn Kett siede davanti alla porta fra due balestrieri. Ha il cappotto color
      tabacco e la spada della milizia sulle ginocchia, e muove le dita come se scrivesse su una pergamena
      invisibile.
    opzioni:
      - testo: "Girare gli spicchi del disco"
        descrizione: "La casa dorme ancora. Il congegno dei Precursori si apre a chi sente dove va ogni simbolo."
        quando: [scuri.allarme < 2]
        prova: { attributo: mentale, abilita: [tecnologia, magia], difficolta: Difficile }
        successo:
          titolo: La porta tonda
          testo: |
            Giri gli spicchi uno per volta con le dita sul metallo, e ognuno a un certo punto si ferma con uno
            scatto leggero che senti nell'osso del dito più che nell'orecchio. All'ultimo la porta tonda
            rientra nel muro con un sospiro d'aria vecchia. Dentro ci sono due cassetti di ferro.
          pe: { tecnologia: 5 }
          segue: scuri-cdn-la-cassaforte-aperta
        fallimento:
          titolo: Il disco che gira
          testo: |
            Giri gli spicchi, e al terzo il disco riparte da solo e torna al punto di partenza con un ronzio
            che sale per tutto l'archivio. Lo senti nei denti prima che nelle orecchie. Al piano di sopra
            qualcuno si sveglia e scende.
          effetti: { scuri.allarme: 2, sospetto: 0.5 }

      - testo: "Disegnare sul disco la formula di Correzione"
        descrizione: "Per i Profeti delle Geometrie ciò che si disegna accade. Un cerchio di gesso intorno al disco, e il disco è aperto."
        quando: [scuri.allarme < 2]
        incantesimo: correzione
        prova: { attributo: mentale, abilita: magia, difficolta: Difficile }
        successo:
          titolo: Il cerchio di gesso
          testo: |
            Disegni con il gesso un cerchio intorno al disco, dicendo la formula mentre lo chiudi, e disegni
            la porta aperta. Quando alzi il gesso la porta tonda è rientrata nel muro, e non l'hai sentita
            muoversi. Ti fa male la testa sopra l'occhio sinistro, e dentro ci sono due cassetti di ferro.
          segue: scuri-cdn-la-cassaforte-aperta
        fallimento:
          titolo: Il cerchio aperto
          testo: |
            Il cerchio ti si apre a metà, e il gesso si spezza fra le dita. Dove toccava il metallo non resta
            nemmeno la polvere. Il disco comincia a girare da solo con un ronzio che sale per tutto
            l'archivio, e al piano di sopra qualcuno si sveglia.
          effetti: { scuri.allarme: 2, tormento: 0.5 }

      - testo: "Affrontare Varn Kett"
        descrizione: "Varn Kett non si compra, e i due balestrieri tirano dritto. Se li batti, la cassaforte è tua."
        quando: [scuri.allarme >= 2]
        combattimento: scuri-la-cassaforte-dei-timbri
        vittoria:
          titolo: Il cappotto color tabacco
          testo: |
            Varn Kett si batte come un miliziano di vent'anni fa, senza sprecare un colpo. Quando va giù lo fa
            sedendosi piano, con la spada di traverso sulle ginocchia e il fiato corto. Ti guarda aprire la
            cassaforte con le sue chiavi, e muove le dita sul ginocchio, scrivendo.
          segue: scuri-cdn-la-cassaforte-aperta
        sconfitta:
          titolo: Il portone
          testo: |
            Kett ti disarma con un colpo secco, e la mano ti resta intorpidita fino al polso. Ti accompagna
            lui stesso al portone della Casa dei Nodi con la spada nel fodero e la mano sul tuo braccio. Ti
            dice che non ti ha visto, perché stanotte non vuole scrivere un rapporto lungo. Il tuo nome, però,
            l'ha già scritto sulla pergamena invisibile.
          effetti: { sospetto: 1.5 }
          vai: quartieri-alti

      - testo: "Mostrare a Kett che cosa c'è nel registro"
        descrizione: "Kett non si compra. Ma il registro di Venn sporca la Gilda più di qualunque furto, e Kett è stato miliziano prima che ispettore."
        quando: [scuri.allarme >= 2]
        prova: { attributo: sociale, abilita: [persuasione, politica-ed-economia], difficolta: Difficile }
        successo:
          titolo: Vent'anni nella milizia
          testo: |
            Gli dici chi c'è nel registro dei funzionari pagati, e chi li paga. Kett ascolta muovendo le dita,
            e a ogni nome le dita si fermano un momento. Poi apre la cassaforte con le sue chiavi e ti dà il
            registro, e la matrice la tiene. «Questo sporca la Gilda più del furto, e se lo porti fuori da qui
            io non ti ho visto» dice.
          pe: { persuasione: 5 }
          imposta: { scuri.libro: 1, scuri.allarme: 0 }
          effetti: { fazione.scuri: 1, rep.scuri: 1, rep.gilda: -1 }
          vai: quartieri-alti
        fallimento:
          titolo: La pergamena invisibile
          testo: |
            Kett ti ascolta muovendo le dita sul ginocchio, e alla fine ti dice che i ladri parlano sempre
            della sporcizia degli altri. Ti fa accompagnare al portone dai balestrieri, che ti tengono la
            balestra puntata alla schiena per tutte le scale. Il tuo nome lo scrive due volte.
          effetti: { sospetto: 2, rep.gilda: -1 }
          vai: quartieri-alti

  # ------------------------------------------------------------ 4 · il seguito: la cassaforte aperta
  - id: scuri-cdn-la-cassaforte-aperta
    immagine: ambientazione/mercato-dei-nodi
    titolo: La cassaforte aperta
    tipo: seguito
    luogo: La Casa dei Nodi, la cassaforte dei timbri
    area: scuri-casa-dei-nodi
    requisiti: [fazione.scuri == 10]
    testo: |
      La cassaforte ha due cassetti di ferro battuto a mano, molto più giovani della porta che li chiude. Il
      primo custodisce su un panno di velluto la matrice d'ottone del timbro della Gilda, con il sigillo
      inciso al contrario. L'ottone è lucido sui rilievi e nero nei solchi, dove l'inchiostro di anni non è
      più venuto via. Nell'altro c'è un registro nero con i nomi dei funzionari della Gilda a libro paga,
      scritti da Venn. Accanto ad alcuni nomi cancellati c'è a matita un altro pagatore con una D.

      {politica-ed-economia Media} Il registro ti dà i funzionari e toglie a Durgan quelli che ha comprato,
      mentre la matrice fa valere ogni reliquia che timbri quanto una della Gilda. Se prendi tutte e due, la
      Gilda non dorme finché non ti trova.
    opzioni:
      - testo: "Prendere la matrice del timbro"
        descrizione: "Una reliquia timbrata da te vale quanto una timbrata da loro. La Gilda verrà a cercarla."
        esito:
          titolo: La matrice
          testo: |
            Avvolgi la matrice nel velluto e la infili nella giubba, dove pesa come un sasso e resta fredda
            contro le costole. Esci dalla Casa dei Nodi per la strada da cui sei venut{o|a}. All'alba la Gilda
            cambia le serrature, e il sigillo della matrice comincia a girare per la Città Bassa su reliquie
            che la Gilda non ha mai visto.
          imposta: { scuri.matrice: 1 }
          effetti: { fazione.scuri: 1, rep.scuri: 1, rep.gilda: -2, reliquie.frammento-inciso: 2 }
          vai: quartieri-alti

      - testo: "Prendere il registro dei funzionari pagati"
        descrizione: "Con il registro i funzionari sono tuoi. Durgan perde quelli che ha comprato."
        esito:
          titolo: Il registro nero
          testo: |
            Prendi il registro nero e lo infili nella giubba. La copertina è di cuoio liscio, con gli angoli
            consumati dal pollice di chi lo sfogliava. Esci per la strada da cui sei venut{o|a}, e la mattina
            dopo Rozalia lo sfoglia sul tavolo e batte due volte la penna sul calamaio. In una settimana i
            funzionari che Durgan aveva comprato smettono di rispondere ai suoi uomini.
          imposta: { scuri.libro: 1 }
          effetti: { fazione.scuri: 1, rep.scuri: 1, rep.gilda: -1, informazioni.segreto: 1 }
          vai: quartieri-alti

      - testo: "Prendere tutti e due"
        descrizione: "La matrice e il registro. La Gilda non dorme finché non ti trova, e i cassetti di ferro cigolano."
        esito:
          titolo: Tutti e due
          testo: |
            Prendi la matrice e il registro, e il secondo cassetto cigola come una porta di cantina. Esci per
            la strada da cui sei venut{o|a}, e alle tue spalle la Casa dei Nodi si sveglia una lanterna dopo
            l'altra, dal terzo piano giù fino alle terrazze. La mattina dopo in Città Bassa ci sono due
            miliziani della Gilda a ogni angolo, e cercano te.
          imposta: { scuri.matrice: 1, scuri.libro: 1 }
          effetti: { fazione.scuri: 1, rep.scuri: 1, rep.gilda: -2, sospetto: 2, informazioni.segreto: 1 }
          vai: quartieri-alti
