# La Casa dei Nodi di notte, spedizione del passo 11 della quest degli Scuri (fazione.scuri == 10). Ci si entra da
# scuri-la-casa-dei-nodi-di-notte (passi-3.yaml), che azzera scuri.allarme (o lo porta a 1 senza la pianta di Venn);
# la ritirata porta ai Quartieri Alti. Come il Maniero: le prove fallite alzano scuri.allarme, a tre le stanze si
# chiudono e arriva la ronda dei balestrieri (scuri-cdn-la-ronda), che riporta l'allarme a 1 in ogni ramo.
# Le stanze chiedono fazione.scuri == 10 e scuri.allarme < 3, in fasce di profondità:
# 0 le catene esterne (la terrazza dei carichi, le catene che reggono le terrazze);
# 1 gli uffici dei Custodi di Passaggio (la sala delle bilance, il dormitorio dei balestrieri, lo scrittoio di Venn,
#   con la finestra accostata se hai la copia dei suoi pagamenti);
# 2 l'archivio dei dazi (gli scaffali dei sigilli, il registro dei passaggi notturni);
# 3 il terzo piano (la sala con due porte, la scala dei Custodi).
# Il cuore a 4 è la cassaforte dei timbri: con l'allarme sotto a due si apre con la Tecnologia o con Correzione
# (prove Difficili), con l'allarme a due o più ci sono Varn Kett e due balestrieri (boss Difficile, o Persuasione
# Difficile per uscire con il solo registro). Il seguito sceglie la matrice, il registro o tutti e due, e chiude il passo.
aree:
  - id: scuri-casa-dei-nodi
    immagine: ambientazione/mercato-dei-nodi
    nome: La Casa dei Nodi di notte
    sommario: "La sede della Gilda dei Mercanti di notte, con la cassaforte dei timbri in fondo all'archivio dei dazi."
    spedizione: { ritorno: quartieri-alti, soglia: 4, stanze: 3 }
    testo: |
      Di notte la Casa dei Nodi sembra più alta. Le terrazze si reggono l'una
      all'altra con catene grosse come un braccio, che il vento della
      Cicatrice fa cigolare, e a ogni piano si sposta una lanterna dei Custodi
      di Passaggio. Dentro, ogni rumore rimbomba sulle assi, e l'archivio dei
      dazi sale fra gli scaffali fino al terzo piano.

storylet:
  # ------------------------------------------------------------ 0 · le catene esterne
  - id: scuri-cdn-la-terrazza-dei-carichi
    immagine: ambientazione/mercato-dei-nodi
    titolo: La terrazza dei carichi
    sommario: "Sulla terrazza dei carichi aspettano il mattino sacchi e casse, e una lanterna dei Custodi fa il giro."
    luogo: La Casa dei Nodi, la terrazza dei carichi
    area: scuri-casa-dei-nodi
    ripetibile: true
    requisiti: [fazione.scuri == 10, scuri.allarme < 3, profondita.scuri-casa-dei-nodi == 0]
    testo: |
      Sulla terrazza dei carichi i sacchi di grano e le casse della Gilda
      aspettano le chiatte del mattino. Il Custode di ronda canticchia
      sempre la stessa strofa di una canzone dei Ponti.

      {furtivita Media} La lanterna fa il giro in cento passi, e fra un giro
      e l'altro dietro i sacchi c'è buio abbastanza.
    opzioni:
      - testo: "Passare dietro i sacchi fra un giro e l'altro"
        descrizione: "Cento passi di lanterna e il buio dietro i sacchi, contando bene."
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Media }
        successo:
          titolo: Cento passi
          testo: |
            Conti i passi del Custode sulla sua canzone, e quando la strofa
            ricomincia attraversi dietro i sacchi fino alla porta di servizio.
          effetti: { profondita.scuri-casa-dei-nodi: 1 }
        fallimento:
          titolo: Il sacco
          testo: |
            Urti un sacco e il grano esce da una cucitura con un fruscio lungo, e
            il Custode chiama il piano di sopra.
          effetti: { scuri.allarme: 1 }

      - testo: "Salire sulle casse fino alla terrazza di sopra"
        descrizione: "Le casse impilate arrivano alla balaustra della terrazza di sopra."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Media }
        successo:
          titolo: La balaustra
          testo: |
            Sali sulle casse come su una scala storta e scavalchi la balaustra di
            sopra, mentre il Custode passa sotto senza alzare la lanterna.
          effetti: { profondita.scuri-casa-dei-nodi: 1 }
        fallimento:
          titolo: La cassa che cede
          testo: |
            La cassa in cima si inclina e cade con un rumore di vasellame rotto,
            ma quando la lanterna arriva sei già dietro i sacchi.
          effetti: { scuri.allarme: 1, ferite: 0.5 }

      - testo: "Aspettare il cambio dei Custodi"
        descrizione: "A mezzanotte i Custodi si danno il cambio, e per un po' la terrazza resta vuota."
        costo: 2
        esito:
          titolo: Il cambio
          testo: |
            Aspetti fra i sacchi fino a mezzanotte, e mentre il Custode nuovo
            chiacchiera sulle scale attraversi la terrazza vuota con le mani
            gelate.
          effetti: { profondita.scuri-casa-dei-nodi: 1 }

  - id: scuri-cdn-le-catene
    immagine: ambientazione/ponti-sospesi
    titolo: Le catene delle terrazze
    sommario: "Le terrazze sono appese l'una all'altra con catene grosse come un braccio, la strada più corta."
    luogo: La Casa dei Nodi, le catene esterne
    area: scuri-casa-dei-nodi
    ripetibile: true
    requisiti: [fazione.scuri == 10, scuri.allarme < 3, profondita.scuri-casa-dei-nodi == 0]
    testo: |
      Dal bordo della terrazza più bassa una decina di catene sale in
      diagonale, e il vento le fa cantare. In cima, a quattro uomini
      d'altezza, c'è la finestra degli uffici dei Custodi.

      {atletica Media} Le catene tese reggono un uomo. Quelle che pendono un
      poco sono messe lì per bellezza.
    opzioni:
      - testo: "Salire sulla catena più tesa"
        descrizione: "Mani e ginocchia sulla catena più tesa, che regge di sicuro."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Media }
        successo:
          titolo: La catena tesa
          testo: |
            Sali a mani e ginocchia sulla catena più tesa e arrivi alla finestra
            degli uffici con le mani rosse di ruggine. Il gancio si apre con una
            lama.
          effetti: { profondita.scuri-casa-dei-nodi: 1 }
        fallimento:
          titolo: La catena per bellezza
          testo: |
            La catena pende un poco, e a metà salita scende di un palmo con un
            clangore che sveglia mezza terrazza.
          effetti: { scuri.allarme: 1, ferite: 0.5 }

      - testo: "Arrampicarsi sulla parete, sugli anelli dei carichi"
        descrizione: "Gli anelli di ferro per legare i carichi salgono il muro come una scala, se non si ha fretta."
        costo: 2
        esito:
          titolo: Gli anelli
          testo: |
            Sali sugli anelli controllando ogni presa due volte, e alla finestra
            degli uffici arrivi tardi, con le dita che non si chiudono più.
          effetti: { profondita.scuri-casa-dei-nodi: 1 }

      - testo: "Scegliere la catena giusta come un mercante dei Ponti"
        descrizione: "Ai Ponti si sa quali catene della Casa dei Nodi reggono e quali sono per far vedere."
        quando: [origine.mercante-dei-ponti >= 1]
        esito:
          titolo: Per far vedere
          testo: |
            Ai Ponti si scherza sulle catene finte della Casa. Ti ricordi quali
            sono e sali sulle altre, senza un graffio.
          effetti: { profondita.scuri-casa-dei-nodi: 1 }

  # ------------------------------------------------------------ 1 · gli uffici dei Custodi di Passaggio
  - id: scuri-cdn-la-sala-delle-bilance
    immagine: ambientazione/mercato-dei-nodi
    titolo: La sala delle bilance
    sommario: "Una sala di bilance da dazio, ognuna con un campanello che suona se si muove il piatto."
    luogo: La Casa dei Nodi, la sala delle bilance
    area: scuri-casa-dei-nodi
    ripetibile: true
    requisiti: [fazione.scuri == 10, scuri.allarme < 3, profondita.scuri-casa-dei-nodi == 1]
    testo: |
      Le bilance da dazio stanno in fila come banchi di scuola, e a ogni
      giogo è appeso un campanellino che suona se il piatto si muove.
      Sull'ultima dorme un gatto grigio con un occhio aperto.

      {tecnologia Media} Se tieni fermo il giogo, il campanello resta zitto.
    opzioni:
      - testo: "Bloccare i gioghi e passare in mezzo"
        descrizione: "Un dito su ogni giogo mentre passi, con pazienza."
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Media }
        successo:
          titolo: I gioghi
          testo: |
            Passi fra le bilance tenendo un dito su ogni giogo, e i campanelli
            restano zitti. Quando apri la porta in fondo il gatto sbadiglia.
          effetti: { profondita.scuri-casa-dei-nodi: 1 }
        fallimento:
          titolo: Il campanello
          testo: |
            Alla terza bilancia il giogo ti scappa e il campanello suona con una
            nota sottile. Il gatto scappa, e dal corridoio arrivano dei passi.
          effetti: { scuri.allarme: 1 }

      - testo: "Passare lungo il muro, lontano dalle bilance"
        descrizione: "Fra le bilance e il muro c'è un passaggio stretto, da fare di fianco."
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Media }
        successo:
          titolo: Di fianco
          testo: |
            Passi di fianco lungo il muro con la pancia in dentro, e i piatti
            d'ottone ti sfiorano la giubba senza muoversi.
          effetti: { profondita.scuri-casa-dei-nodi: 1 }
        fallimento:
          titolo: Il gomito
          testo: |
            Il gomito ti tocca un piatto, e tutte le bilance della fila suonano
            una dopo l'altra come campane a festa.
          effetti: { scuri.allarme: 1 }

      - testo: "Portare via il gatto, e aspettare"
        descrizione: "Se il gatto scende dalla bilancia la fa suonare, e conviene prenderlo in braccio."
        costo: 2
        esito:
          titolo: Il gatto grigio
          testo: |
            Prendi in braccio il gatto grigio prima che scenda, e mentre fa le
            fusa studi la sala. Quando lo posi su una sedia sai dove passare.
          effetti: { profondita.scuri-casa-dei-nodi: 1 }

  - id: scuri-cdn-il-dormitorio-dei-balestrieri
    immagine: fazioni/gilda-dei-mercanti
    titolo: Il dormitorio dei balestrieri
    sommario: "Per arrivare all'archivio si passa da un dormitorio di balestrieri della Gilda. Dormono, quasi tutti."
    luogo: La Casa dei Nodi, il dormitorio dei balestrieri
    area: scuri-casa-dei-nodi
    ripetibile: true
    requisiti: [fazione.scuri == 10, scuri.allarme < 3, profondita.scuri-casa-dei-nodi == 1]
    testo: |
      Il corridoio dell'archivio attraversa un dormitorio dove dodici
      balestrieri della Gilda dormono a bocca aperta, con le balestre
      scariche appese sopra le brande. In fondo ne resta sveglio uno solo,
      che si cuce una calza alla luce di un mozzicone.
    opzioni:
      - testo: "Passare fra le brande"
        descrizione: "Dodici uomini che dormono e uno che cuce, un passo alla volta fra il russare."
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Media }
        successo:
          titolo: Fra le brande
          testo: |
            Il russare ti copre i passi, e quello della calza si punge un dito
            proprio mentre gli passi alle spalle. Quando rialza la testa sei già
            uscito.
          effetti: { profondita.scuri-casa-dei-nodi: 1 }
        fallimento:
          titolo: La calza
          testo: |
            Quello che cuce alza la testa e ti vede, con l'ago a mezz'aria. Quando
            apre la bocca sei già fuori, e dietro di te il dormitorio si sveglia.
          effetti: { scuri.allarme: 1 }

      - testo: "Convincere quello sveglio che sei un Custode"
        descrizione: "Di notte i Custodi non si conoscono tutti, e bastano un tono annoiato e un'aria di fretta."
        prova: { attributo: sociale, abilita: [ingannare, galateo], difficolta: Media }
        successo:
          titolo: Il Custode di turno
          testo: |
            Chiedi con voce annoiata a quello della calza se ha visto passare
            l'ispettore. Lui ti indica la porta dell'archivio e torna a cucire.
          effetti: { profondita.scuri-casa-dei-nodi: 1 }
        fallimento:
          titolo: Quale ispettore
          testo: |
            Lui ti chiede quale ispettore, perché stanotte non ce ne sono, e posa
            la calza mentre torni indietro dicendo che hai sbagliato piano.
          effetti: { scuri.allarme: 1 }

      - testo: "Fare il giro dal cortile"
        descrizione: "Il dormitorio si evita passando dal cortile interno, al freddo."
        costo: 2
        esito:
          titolo: Il cortile interno
          testo: |
            Fai il giro dal cortile interno, nel vento che gira come in un pozzo,
            ed entri nell'archivio da una porta di servizio dopo un'ora, con le
            orecchie gelate.
          effetti: { profondita.scuri-casa-dei-nodi: 1 }

  - id: scuri-cdn-lo-scrittoio-di-venn
    immagine: ambientazione/mercato-dei-nodi
    titolo: Lo scrittoio di Venn
    sommario: "Nella sala degli ispettori dei lotti, lo scrittoio di Cosimo Venn è il più vicino alla finestra."
    luogo: La Casa dei Nodi, la sala degli ispettori dei lotti
    area: scuri-casa-dei-nodi
    ripetibile: true
    requisiti: [fazione.scuri == 10, scuri.allarme < 3, profondita.scuri-casa-dei-nodi == 1]
    testo: |
      La sala degli ispettori di notte è vuota. Sullo scrittoio di Cosimo
      Venn c'è ancora un rametto di menta masticato a metà, e nel cassetto
      una pianta dell'archivio a matita. Dalla finestra si vede il tetto
      dell'archivio dei dazi, due braccia più in basso, con le tegole
      bagnate.
    opzioni:
      - testo: "Uscire dalla finestra accostata"
        descrizione: "Venn ti ha promesso che stanotte la finestra del suo scrittoio sarebbe rimasta accostata."
        quando: [scuri.venn >= 1]
        esito:
          titolo: La finestra di Venn
          testo: |
            La finestra di Venn è accostata, con un pezzo di carta piegato nel
            battente perché non sbatta. Salti sul tetto dell'archivio senza un
            rumore.
          effetti: { profondita.scuri-casa-dei-nodi: 1 }

      - testo: "Saltare sul tetto dell'archivio"
        descrizione: "Due braccia più in basso, sulle tegole bagnate, il salto si fa una volta sola."
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Media }
        successo:
          titolo: Le tegole
          testo: |
            Atterri sulle tegole con le ginocchia piegate, e una tegola che
            scivola nel cortile non la sente nessuno. Dal lucernario entri fra gli
            scaffali.
          effetti: { profondita.scuri-casa-dei-nodi: 1 }
        fallimento:
          titolo: La grondaia
          testo: |
            Le tegole ti scivolano sotto i piedi e resti appeso alla grondaia, poi
            rientri a forza di braccia mentre di sotto si apre un'imposta.
          effetti: { scuri.allarme: 1, ferite: 0.5 }

      - testo: "Seguire la pianta del cassetto"
        descrizione: "La pianta di Venn passa dalle scale, e le scale sono lunghe."
        prova: { attributo: mentale, abilita: [percezione, accademiche], difficolta: Media }
        successo:
          titolo: La pianta a matita
          testo: |
            La pianta indica una scala di servizio che scende all'archivio, e
            contando le porte arrivi fra gli scaffali senza incontrare nessuno.
          effetti: { profondita.scuri-casa-dei-nodi: 1 }
        fallimento:
          titolo: La porta sbagliata
          testo: |
            La pianta è vecchia, e la porta della scala dà su uno sgabuzzino pieno
            di scope, che cadono tutte insieme.
          effetti: { scuri.allarme: 1 }

  # ------------------------------------------------------------ 2 · l'archivio dei dazi
  - id: scuri-cdn-gli-scaffali-dei-sigilli
    immagine: ambientazione/biblioteca-di-qir-azel
    titolo: Gli scaffali dei sigilli
    sommario: "La cassaforte sta in fondo a uno dei corridoi dell'archivio, dove ogni scaffale è un anno."
    luogo: La Casa dei Nodi, l'archivio dei dazi
    area: scuri-casa-dei-nodi
    ripetibile: true
    requisiti: [fazione.scuri == 10, scuri.allarme < 3, profondita.scuri-casa-dei-nodi == 2]
    testo: |
      In testa a ogni corridoio di scaffali una targa d'ottone porta il
      sigillo di un anno, e i corridoi vecchi sono pieni di polvere. La
      cassaforte, dice Rozalia, sta in fondo al corridoio dell'anno in cui la
      Gilda ha cambiato il timbro.

      {accademiche Media} Fu dopo uno scandalo di dazi falsi finito su tutti
      gli almanacchi.
    opzioni:
      - testo: "Ricordare l'anno in cui la Gilda cambiò il timbro"
        descrizione: "Uno scandalo di dazi falsi, finito su tutti gli almanacchi, di cui ricordare l'anno."
        prova: { attributo: mentale, abilita: [accademiche, politica-ed-economia], difficolta: Media }
        successo:
          titolo: L'anno dello scandalo
          testo: |
            Ti ricordi l'anno, e anche il funzionario impiccato sul Ponte delle
            Mille Corde. Il corridoio giusto finisce contro una porta di ferro con
            una serratura dei Precursori.
          effetti: { profondita.scuri-casa-dei-nodi: 1 }
        fallimento:
          titolo: Gli almanacchi
          testo: |
            Dello scandalo ricordi tutto tranne l'anno. Al terzo corridoio
            sbagliato starnutisci, e al piano di sopra una porta si apre.
          effetti: { scuri.allarme: 1 }

      - testo: "Seguire le impronte nella polvere"
        descrizione: "Chi va alla cassaforte di notte lascia impronte nei corridoi vecchi, dove nessuno spazza."
        prova: { attributo: mentale, abilita: [percezione, natura], difficolta: Media }
        successo:
          titolo: Le impronte
          testo: |
            Nella polvere ci sono impronte di stivali puliti, e in questa casa li
            porta uno solo. Vanno e tornano fino a una porta di ferro con una
            serratura dei Precursori.
          effetti: { profondita.scuri-casa-dei-nodi: 1 }
        fallimento:
          titolo: Le tue impronte
          testo: |
            Dopo mezz'ora ti accorgi che le impronte sono le tue, e in fondo al
            corridoio principale si avvicina una lanterna.
          effetti: { scuri.allarme: 1 }

      - testo: "Leggere le targhe una per una"
        descrizione: "Senza ricordare l'anno si leggono tutte le targhe, e ci vuole la notte."
        costo: 2
        esito:
          titolo: Tutte le targhe
          testo: |
            Leggi le targhe una per una con la candela riparata dalla mano, e alla
            trentesima il sigillo cambia forma, davanti a una porta di ferro con
            una serratura dei Precursori.
          effetti: { profondita.scuri-casa-dei-nodi: 1 }

  - id: scuri-cdn-il-registro-dei-passaggi-notturni
    immagine: ambientazione/ponti-sospesi
    titolo: Il registro dei passaggi notturni
    sommario: "Sul leggio dell'archivio è aperto il registro dei carichi passati di notte, e qualcuno ci ha scritto stanotte."
    luogo: La Casa dei Nodi, il leggio dell'archivio
    area: scuri-casa-dei-nodi
    ripetibile: true
    requisiti: [fazione.scuri == 10, scuri.allarme < 3, profondita.scuri-casa-dei-nodi == 2]
    testo: |
      Sul leggio in mezzo all'archivio è aperto il registro dei passaggi
      notturni, dove i Custodi segnano i carichi che attraversano i Ponti dopo
      il tramonto. La penna è ancora umida, e l'ultima riga, scritta stanotte,
      porta il sigillo di una licenza per i carichi notturni.

      {politica-ed-economia Media} È una delle licenze di Rozalia, e la Gilda
      non sa di averla data.
    opzioni:
      - testo: "Leggere le ultime pagine e passare oltre"
        descrizione: "Chi passa di notte con le licenze di Rozalia vale un segreto, se leggi in fretta."
        prova: { attributo: mentale, abilita: [percezione, politica-ed-economia], difficolta: Media }
        successo:
          titolo: Le licenze di Rozalia
          testo: |
            Nelle ultime pagine trovi undici licenze di Rozalia in un mese, tutte
            per *casse di menta*, e passi oltre prima che torni chi ha lasciato la
            penna.
          effetti: { profondita.scuri-casa-dei-nodi: 1, informazioni.segreto: 1 }
        fallimento:
          titolo: Chi torna
          testo: |
            Leggi troppo a lungo, e torna un vecchio Custode con gli occhiali
            sulla fronte e una tazza in mano, che quando ti vede gli cade.
          effetti: { scuri.allarme: 1 }

      - testo: "Nasconderti dietro il leggio e aspettare chi torna"
        descrizione: "Chi scrive di notte nel registro torna alla penna, e si può vedere dove va dopo."
        prova: { attributo: fisico, abilita: [furtivita, resistenza], difficolta: Media }
        successo:
          titolo: Il Custode con la tazza
          testo: |
            Il vecchio Custode che torna alla penna va poi verso il fondo
            dell'archivio, dove una porta di ferro si apre e si richiude. Adesso
            sai dov'è la cassaforte.
          effetti: { profondita.scuri-casa-dei-nodi: 1 }
        fallimento:
          titolo: La tazza
          testo: |
            Il vecchio Custode torna con una tazza fumante e guarda dietro il
            leggio come se sapesse. Ti vede, e la tazza gli scivola dalle dita.
          effetti: { scuri.allarme: 1 }

      - testo: "Strappare l'ultima pagina e andare"
        descrizione: "La pagina con le licenze di Rozalia può servire, e strappata con calma non fa rumore."
        esito:
          titolo: La pagina
          testo: |
            Pieghi l'ultima pagina lungo la cucitura e la strappi con calma, poi
            te la infili nella giubba. Chi torna alla penna se ne accorgerà
            domattina.
          effetti: { profondita.scuri-casa-dei-nodi: 1, informazioni.pettegolezzo: 1, scuri.allarme: 0.5 }

  # ------------------------------------------------------------ 3 · il terzo piano
  - id: scuri-cdn-la-sala-delle-due-porte
    immagine: ambientazione/quartieri-alti
    titolo: La sala delle due porte
    sommario: "Al terzo piano, oltre la sala delle riunioni riservate, c'è la cassaforte."
    luogo: La Casa dei Nodi, il terzo piano
    area: scuri-casa-dei-nodi
    ripetibile: true
    requisiti: [fazione.scuri == 10, scuri.allarme < 3, profondita.scuri-casa-dei-nodi == 3]
    testo: |
      Il terzo piano è la sala delle riunioni riservate della Gilda, con due
      porte che si chiudono solo da dentro con un catenaccio. Per arrivare
      alla cassaforte bisogna attraversarla, e stanotte una porta è chiusa,
      con una lama di luce sotto.

      {origine rampollo-dei-quartieri-alti} Da ragazzino ci entravi dietro tuo
      padre, che spingeva la porta sinistra con il palmo, in alto, quando il
      catenaccio faceva i capricci.
    opzioni:
      - testo: "Spingere la porta nel punto giusto"
        descrizione: "Un catenaccio a molla si apre se la porta si spinge dove la molla è più debole."
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Media }
        successo:
          titolo: La molla
          testo: |
            Trovi la molla lungo lo stipite e spingi piano con il palmo, e il
            catenaccio scatta. La luce veniva da una lanterna dimenticata, e la
            porta di fronte dà sulla cassaforte.
          effetti: { profondita.scuri-casa-dei-nodi: 1 }
        fallimento:
          titolo: Il catenaccio
          testo: |
            Il catenaccio non si muove, e con più forza la porta sbatte contro il
            telaio. Nella sala qualcuno sposta una sedia.
          effetti: { scuri.allarme: 1 }

      - testo: "Passare dal cornicione esterno"
        descrizione: "Sotto le finestre della sala corre un cornicione sul vuoto, per rientrare dall'altra parte."
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Media }
        successo:
          titolo: Il cornicione
          testo: |
            Cammini sul cornicione con la faccia contro il muro e il vento della
            Cicatrice nella schiena, e due finestre più in là rientri davanti alla
            cassaforte.
          effetti: { profondita.scuri-casa-dei-nodi: 1 }
        fallimento:
          titolo: Il vento
          testo: |
            Il vento ti strappa il cappuccio, che vola via nel buio. Rientri dalla
            finestra di partenza, e dal cortile qualcuno chiede chi c'è.
          effetti: { scuri.allarme: 1, tormento: 1 }

      - testo: "Spingere la porta come faceva tuo padre"
        descrizione: "Il palmo in alto, sulla porta sinistra, quando il catenaccio faceva i capricci."
        quando: [origine.rampollo-dei-quartieri-alti >= 1]
        esito:
          titolo: Come tuo padre
          testo: |
            Spingi in alto la porta sinistra con il palmo come faceva tuo padre, e
            il catenaccio scatta con lo stesso rumore di allora.
          effetti: { profondita.scuri-casa-dei-nodi: 1 }

  - id: scuri-cdn-la-scala-dei-custodi
    immagine: ambientazione/ponti-sospesi
    titolo: La scala dei Custodi
    sommario: "Una scala a chiocciola cigolante sale al terzo piano dentro una torretta di corde e legno."
    luogo: La Casa dei Nodi, la torretta della scala
    area: scuri-casa-dei-nodi
    ripetibile: true
    requisiti: [fazione.scuri == 10, scuri.allarme < 3, profondita.scuri-casa-dei-nodi == 3]
    testo: |
      La scala dei Custodi sale a chiocciola dentro una torretta di legno e
      corde, e ogni gradino cigola in un modo diverso. In cima c'è la porta
      della cassaforte, e a metà scala dorme un giovane Custode con la
      lanterna fra le ginocchia.

      {atletica Media} Sul bordo dei gradini, dove il legno è inchiodato alla
      torretta, si sale in silenzio.
    opzioni:
      - testo: "Salire sul bordo dei gradini, scavalcando il Custode"
        descrizione: "Sul bordo i gradini tacciono, ma il ragazzo addormentato occupa mezza scala."
        prova: { attributo: fisico, abilita: [atletica, furtivita], difficolta: Media }
        successo:
          titolo: Il bordo
          testo: |
            Sali sul bordo dei gradini tenendoti alla corda e scavalchi il ragazzo
            con un passo lungo. Lui si gira nel sonno e borbotta un nome.
          effetti: { profondita.scuri-casa-dei-nodi: 1 }
        fallimento:
          titolo: Il cigolio
          testo: |
            Al passo lungo il gradino cigola e il ragazzo apre gli occhi. Ti
            guarda a lungo, pieno di sonno, finché non si mette a gridare.
          effetti: { scuri.allarme: 1 }

      - testo: "Svegliarlo con gentilezza e dirgli di tornare a letto"
        descrizione: "Un ragazzo svegliato con gentilezza a volte obbedisce."
        prova: { attributo: sociale, abilita: [persuasione, ingannare], difficolta: Media }
        successo:
          titolo: A letto
          testo: |
            Con la voce di un sergente stanco gli dici che il turno è finito, e
            lui ti ringrazia e scende con la lanterna strascicando i piedi.
          effetti: { profondita.scuri-casa-dei-nodi: 1 }
        fallimento:
          titolo: Il sergente
          testo: |
            Lui ti chiede chi sei, perché stanotte il sergente è sua zia, e scende
            la scala di corsa.
          effetti: { scuri.allarme: 1 }

      - testo: "Aspettare che si svegli e se ne vada"
        descrizione: "Chi dorme sulla scala prima o poi si sveglia col collo storto e va a cercare un letto."
        costo: 2
        esito:
          titolo: Il collo storto
          testo: |
            Aspetti un'ora nel buio in fondo alla scala, finché il ragazzo si
            sveglia e scende borbottando senza vederti.
          effetti: { profondita.scuri-casa-dei-nodi: 1 }

  # ------------------------------------------------------------ la ronda dei balestrieri (allarme a 3)
  - id: scuri-cdn-la-ronda
    immagine: fazioni/gilda-dei-mercanti
    titolo: La ronda dei balestrieri
    sommario: "L'allarme è suonato, e due balestrieri della Gilda frugano le stanze una dopo l'altra."
    luogo: La Casa dei Nodi, un corridoio
    area: scuri-casa-dei-nodi
    requisiti: [fazione.scuri == 10, scuri.allarme >= 3]
    testo: |
      Adesso la Casa dei Nodi è sveglia. Due balestrieri della Gilda frugano
      le stanze una dopo l'altra con le lanterne alte e le balestre cariche,
      e arriveranno alla tua fra poco. Sopra la porta c'è una mensola larga,
      piena di registri vecchi.

      {armi-da-distanza Media} Dopo il primo tiro, una balestra chiede tempo
      per essere ricaricata.
    opzioni:
      - testo: "Aspettarli dietro la porta"
        descrizione: "Due balestrieri in un corridoio stretto, da mettere giù prima che tirino."
        combattimento: scuri-la-ronda-dei-balestrieri
        vittoria:
          titolo: Dietro la porta
          testo: |
            Il primo entra con la lanterna avanti e il secondo tira e manca. Li
            leghi con le cinghie delle balestre dentro un armadio, e la casa poco
            alla volta torna a dormire.
          imposta: { scuri.allarme: 1 }
        sconfitta:
          titolo: Il dardo
          testo: |
            Il dardo ti prende di striscio sul braccio, e scappi finché perdi le
            lanterne. Ti fasci in uno sgabuzzino, finché la casa si calma.
          imposta: { scuri.allarme: 1 }
          effetti: { sospetto: 1.5 }

      - testo: "Salire sulla mensola sopra la porta"
        descrizione: "Chi cerca guarda per terra e dietro le porte. Sopra la porta non guarda nessuno."
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Difficile }
        successo:
          titolo: La mensola
          testo: |
            Sulla mensola, fra i registri, i balestrieri non ti cercano, e resti
            lassù con la polvere nel naso finché la casa torna a dormire.
          pe: { furtivita: 5 }
          imposta: { scuri.allarme: 1 }
        fallimento:
          titolo: Il registro che cade
          testo: |
            Un registro scivola giù ai piedi del primo balestriere. Scappi con un
            dardo di striscio sul braccio e aspetti in uno sgabuzzino che la casa
            si calmi.
          imposta: { scuri.allarme: 1 }
          effetti: { ferite: 1, sospetto: 1.5 }

      - testo: "Comprare il silenzio della ronda"
        descrizione: "I balestrieri della Gilda sono pagati poco, e una borsa compra un nome sbagliato nel rapporto."
        requisiti: [monete >= 20]
        esito:
          titolo: Il rapporto
          testo: |
            Esci con le mani alzate e una borsa, e il più vecchio dei balestrieri
            la prende. Nel rapporto, dice all'altro, scriveranno di un gatto.
          imposta: { scuri.allarme: 1 }
          effetti: { monete: -20 }

  # ------------------------------------------------------------ 4 · il cuore: la cassaforte dei timbri
  - id: scuri-cdn-la-cassaforte-dei-timbri
    immagine: personaggi/varn-kett
    titolo: La cassaforte dei timbri
    sommario: "In fondo all'archivio, dietro un congegno dei Precursori, ci sono la matrice e il registro."
    luogo: La Casa dei Nodi, la cassaforte dei timbri
    area: scuri-casa-dei-nodi
    requisiti: [fazione.scuri == 10, profondita.scuri-casa-dei-nodi >= 4]
    testo: |
      La cassaforte dei timbri è una stanzetta foderata di ferro, con una
      porta tonda dei Precursori senza serratura e al centro un disco diviso
      in spicchi incisi. Dietro ci sono la matrice del timbro e il registro
      dei funzionari pagati.

      {tecnologia Difficile} Gli spicchi girano come la ruota di un mulino, e
      il congegno sente quando un simbolo arriva al suo posto.

      Se la casa è sveglia, fra due balestrieri davanti alla porta siede Varn
      Kett, con il cappotto color tabacco e la spada della milizia sulle
      ginocchia. Muove le dita come se scrivesse su una pergamena invisibile.
    opzioni:
      - testo: "Girare gli spicchi del disco"
        descrizione: "Mentre la casa dorme, il congegno si apre a chi sente dove va ogni simbolo."
        quando: [scuri.allarme < 2]
        prova: { attributo: mentale, abilita: [tecnologia, magia], difficolta: Difficile }
        successo:
          titolo: La porta tonda
          testo: |
            Giri gli spicchi con le dita sul metallo, e ognuno si ferma con uno
            scatto. All'ultimo la porta tonda rientra nel muro, e dentro ci sono
            due cassetti di ferro.
          pe: { tecnologia: 5 }
          segue: scuri-cdn-la-cassaforte-aperta
        fallimento:
          titolo: Il disco che gira
          testo: |
            Al terzo spicchio il disco riparte da solo con un ronzio che sale per
            tutto l'archivio, e al piano di sopra qualcuno si sveglia.
          effetti: { scuri.allarme: 2, sospetto: 0.5 }

      - testo: "Disegnare sul disco la formula di Correzione"
        descrizione: "Per i Profeti delle Geometrie ciò che si disegna accade, anche una porta aperta."
        quando: [scuri.allarme < 2]
        incantesimo: correzione
        prova: { attributo: mentale, abilita: magia, difficolta: Difficile }
        successo:
          titolo: Il cerchio di gesso
          testo: |
            Chiudi un cerchio di gesso intorno al disco dicendo la formula, e
            quando alzi il gesso la porta è rientrata nel muro. Ti fa male la
            testa sopra l'occhio, e dentro ci sono due cassetti di ferro.
          segue: scuri-cdn-la-cassaforte-aperta
        fallimento:
          titolo: Il cerchio aperto
          testo: |
            Il cerchio si apre a metà e il gesso si spezza. Il disco gira da solo
            con un ronzio che sale per l'archivio, e di sopra qualcuno si sveglia.
          effetti: { scuri.allarme: 2, tormento: 0.5 }

      - testo: "Affrontare Varn Kett"
        descrizione: "Battuti Varn Kett, che non si compra, e i suoi balestrieri, la cassaforte è tua."
        quando: [scuri.allarme >= 2]
        combattimento: scuri-la-cassaforte-dei-timbri
        vittoria:
          titolo: Il cappotto color tabacco
          testo: |
            Varn Kett si batte senza sprecare un colpo e va giù sedendosi, con la
            spada sulle ginocchia. Ti guarda aprire la cassaforte con le sue
            chiavi, scrivendo con le dita.
          segue: scuri-cdn-la-cassaforte-aperta
        sconfitta:
          titolo: Il portone
          testo: |
            Kett ti disarma con un colpo secco e ti accompagna al portone
            tenendoti per il braccio. Stanotte non vuole scrivere un rapporto
            lungo, però il tuo nome l'ha già scritto.
          effetti: { sospetto: 1.5 }
          vai: quartieri-alti

      - testo: "Mostrare a Kett che cosa c'è nel registro"
        descrizione: "Kett è stato miliziano prima che ispettore, e il registro di Venn sporca la Gilda più di un furto."
        quando: [scuri.allarme >= 2]
        prova: { attributo: sociale, abilita: [persuasione, politica-ed-economia], difficolta: Difficile }
        successo:
          titolo: Vent'anni nella milizia
          testo: |
            Kett ascolta i nomi del registro muovendo le dita, poi apre la
            cassaforte e ti dà il registro, tenendo la matrice. «Se lo porti fuori
            da qui, io non ti ho visto.»
          pe: { persuasione: 5 }
          imposta: { scuri.libro: 1, scuri.allarme: 0 }
          effetti: { fazione.scuri: 1, rep.scuri: 1, rep.gilda: -1 }
          vai: quartieri-alti
        fallimento:
          titolo: La pergamena invisibile
          testo: |
            Kett ti dice che i ladri parlano sempre della sporcizia degli altri.
            Ti fa accompagnare al portone dai balestrieri, e il tuo nome lo scrive
            due volte.
          effetti: { sospetto: 2, rep.gilda: -1 }
          vai: quartieri-alti

  # ------------------------------------------------------------ 4 · il seguito: la cassaforte aperta
  - id: scuri-cdn-la-cassaforte-aperta
    immagine: ambientazione/mercato-dei-nodi
    titolo: La cassaforte aperta
    tipo: seguito
    luogo: La Casa dei Nodi, la cassaforte dei timbri
    area: scuri-casa-dei-nodi
    requisiti: [fazione.scuri == 10]
    testo: |
      Sul velluto del primo cassetto c'è la matrice del timbro della Gilda,
      un cilindro d'ottone con il sigillo inciso al contrario, e nel secondo
      il registro nero di Venn con i funzionari della Gilda a libro paga.
      Accanto ad alcuni nomi cancellati c'è un altro pagatore a matita, con
      una D.

      {furtivita Media} Una cosa sola si porta via in silenzio, mentre i
      cassetti di ferro cigolano.
    opzioni:
      - testo: "Prendere la matrice del timbro"
        descrizione: "Una reliquia timbrata da te vale quanto una della Gilda, che verrà a cercarla."
        esito:
          titolo: La matrice
          testo: |
            Avvolgi la matrice nel velluto e la infili nella giubba. All'alba la
            Gilda cambia le serrature, e il suo sigillo comincia a girare per la
            Città Bassa su reliquie che non ha mai visto.
          imposta: { scuri.matrice: 1 }
          effetti: { fazione.scuri: 1, rep.scuri: 1, rep.gilda: -2, reliquie.frammento-inciso: 2 }
          vai: quartieri-alti

      - testo: "Prendere il registro dei funzionari pagati"
        descrizione: "Con il registro i funzionari sono tuoi, e Durgan perde quelli che ha comprato."
        esito:
          titolo: Il registro nero
          testo: |
            Ti infili il registro nella giubba. La mattina dopo Rozalia lo sfoglia
            battendo due volte la penna sul calamaio, e in una settimana i
            funzionari di Durgan smettono di rispondere ai suoi uomini.
          imposta: { scuri.libro: 1 }
          effetti: { fazione.scuri: 1, rep.scuri: 1, rep.gilda: -1, informazioni.segreto: 1 }
          vai: quartieri-alti

      - testo: "Prendere tutti e due"
        descrizione: "La matrice e il registro, e la Gilda non dorme finché non ti trova."
        esito:
          titolo: Tutti e due
          testo: |
            Il secondo cassetto cigola come una porta di cantina, ed esci con la
            matrice e il registro mentre la Casa dei Nodi si sveglia. La mattina
            dopo in Città Bassa ci sono due miliziani della Gilda a ogni angolo, a
            cercarti.
          imposta: { scuri.matrice: 1, scuri.libro: 1 }
          effetti: { fazione.scuri: 1, rep.scuri: 1, rep.gilda: -2, sospetto: 2, informazioni.segreto: 1 }
          vai: quartieri-alti
