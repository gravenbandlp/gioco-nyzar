# Il guado del Torvessa, spedizione del passo 8 della quest del Consiglio (fazione.consiglio == 7).
# Si parte dal Maniero Castaldi con `consiglio-i-carri-di-laresh` (passi-2.yaml, imposta consiglio.partito 1).
# La ritirata porta alla Superficie Fratturata, e da lì si torna ai carri con `consiglio-tornare-ai-carri`.
# Due carri del Comune carichi del grano delle terre dei Castaldi a Laresh, con un carrettiere di Quintus Vael,
# vanno verso la città per il guado vecchio del Torvessa, per non passare dal ponte del dazio.
# Al posto dell'allarme c'è consiglio.carri-persi: i fallimenti gravi delle stanze e del cuore fanno perdere un
# carro (o il suo carico). Il passo 9 legge quanti ne sono arrivati.
# Le stanze vanno in fasce di profondità, e una stanza superata non ricompare nella stessa visita:
# 0 i granai (il granaio del fattore, le fiammelle sui campi; il carico storto, che vale anche a 1),
# 1 la strada fra i campi (il guado del rio, la ruota spaccata), 2 le colline basse (il posto di blocco, gli orchi
# profughi; l'osteria del bivio, che vale anche a 3), 3 la riva del Torvessa (il pesatore della Gilda, la barca dei
# pescatori). Ogni stanza ha due prove e una via senza prova che costa due rintocchi.
# Il cuore a 4 è il guado vecchio, con l'agguato di Guido Sarpa: prima della caduta di Ottone (pista.pelle < 7) i
# suoi uomini sono sgherri dei Malgrani, dopo sono scagnozzi delle cellule dei villaggi pagati da Tebaldo Ronchi.
# consiglio.sarpa: 1 battuto (o vincitore, se perdi lo scontro), 2 passa al Comune con i carrettieri, 3 aggirato
# dal guado basso. Ogni ramo chiude il passo e riporta ai Quartieri Alti, con i carri nel seminterrato del Maniero.
aree:
  - id: consiglio-guado-del-torvessa
    immagine: ambientazione/laresh
    nome: Il guado del Torvessa
    sommario: "Due carri di grano dei Castaldi da Laresh al guado vecchio del Torvessa, lontano dal dazio della Gilda."
    spedizione: { ritorno: superficie-fratturata, soglia: 4, stanze: 3 }
    testo: |
      I granai dei Castaldi sono tre fienili di pietra ai margini di Laresh, e
      oltre le colline scorre il Torvessa. La strada maestra lo passa sul
      ponte, dove la Gilda pesa ogni sacco; più a valle c'è il guado vecchio,
      una lingua di ghiaia per chi preferisce che nessuno conti i sacchi.

      I due carri del Comune li guida un carrettiere che Quintus Vael ti ha
      prestato con una raccomandazione borbottata.

storylet:
  # ------------------------------------------------------------ il rientro, dalla Superficie
  - id: consiglio-tornare-ai-carri
    immagine: ambientazione/laresh
    titolo: Tornare ai carri
    sommario: "I carri del grano ti aspettano dove li hai lasciati, con il carrettiere di Quintus seduto sulla stanga."
    luogo: Superficie Fratturata, la strada di Laresh
    area: superficie-fratturata
    ripetibile: true
    requisiti: [fazione.consiglio == 7, consiglio.partito >= 1]
    testo: |
      Ritrovi i carri fermi a lato della strada di Laresh, con i buoi che
      ruminano e il carrettiere di Quintus seduto sulla stanga a rammendarsi
      una calza con l'ago da sacchi. Ti vede arrivare e non smette di cucire,
      e il Torvessa è ancora dall'altra parte delle colline.
    opzioni:
      - testo: "Riprendere la strada con i carri"
        descrizione: "Si riparte dai granai, perché i buoi vanno abbeverati e i sacchi ricontati."
        esito:
          titolo: Di nuovo in strada
          testo: |
            Il carrettiere infila l'ago nella tesa del cappello e schiocca la
            lingua ai buoi. Ricontate i sacchi e il conto torna; lui lo ripete a
            mezza voce per tutta la prima salita, come una preghiera imparata
            male.
          vai: consiglio-guado-del-torvessa

  # ------------------------------------------------------------ 0 · i granai
  - id: consiglio-guado-il-granaio-del-fattore
    immagine: ambientazione/laresh
    titolo: Il granaio del fattore
    sommario: "Il fattore dei Castaldi tiene il granaio sbarrato finché non sa chi pagherà il grano."
    luogo: Laresh, l'aia dei granai dei Castaldi
    area: consiglio-guado-del-torvessa
    ripetibile: true
    requisiti: [profondita.consiglio-guado-del-torvessa == 0]
    testo: |
      Il fattore dei Castaldi, un uomo magro con la camicia abbottonata fino
      al collo, ti aspetta sulla soglia del fienile con la stanga della porta
      sulla spalla e un quaderno unto sotto il braccio.

      «Il signor Aldous mi ha scritto di dare il grano al Comune» dice. «Poi
      è passato uno a cavallo a chiedere chi lo pagava. Io i conti li rendo a
      chi firma, e chi firma non lo so più.»

      {origine rampollo-dei-quartieri-alti} I fattori delle terre di famiglia
      li vedevi solo alle feste del raccolto, e non ti sei mai chiesto chi
      firmasse per loro.
    opzioni:
      - testo: "Convincerlo che il Comune risponde del carico"
        descrizione: "Hai il nome di Julia Castaldi da spendere, e lui ha paura di sbagliare padrone."
        prova: { attributo: sociale, abilita: [persuasione, galateo], difficolta: Media }
        successo:
          titolo: La firma
          testo: |
            Gli spieghi che il Comune risponde dei suoi carri e scrivi la ricevuta
            sul suo quaderno, mentre lui guarda la firma asciugarsi come un
            notaio. Poi solleva la stanga, e prima che tu riparta ti mette in mano
            un fagotto con pane e formaggio.
          effetti: { profondita.consiglio-guado-del-torvessa: 1, monete: 2 }
        fallimento:
          titolo: Il cavaliere
          testo: |
            Più gli parli del Comune, più lui stringe la stanga. Aspetterà un
            biglietto del signor Aldous scritto di suo pugno, e tu passi il
            pomeriggio sull'aia a cacciare le galline dalle ruote.
          effetti: { ferite: 0.5 }
      - testo: "Fare i conti del raccolto con lui"
        descrizione: "Se i sacchi tornano sul suo quaderno e sulla tua ricevuta, non c'è niente da temere."
        prova: { attributo: mentale, abilita: [politica-ed-economia, accademiche], difficolta: Media }
        successo:
          titolo: Il quaderno unto
          testo: |
            Seduti su un sacco, rifate i conti riga per riga e tornano tutti. Alla
            fine il fattore ti scrive in fondo alla pagina il nome del cavaliere
            che è passato a chiedere, con una mano che trema un poco.
          effetti: { profondita.consiglio-guado-del-torvessa: 1, informazioni.voce: 1 }
        fallimento:
          titolo: Il sacco in più
          testo: |
            I conti ti danno un sacco in più di quelli che vedi, e lo dici ad alta
            voce. Il fattore trova l'errore nella tua colonna, e da quel momento
            ti tratta come un esattore e ci mette tutto il pomeriggio a farti
            caricare.
          effetti: { sospetto: 1 }
      - testo: "Caricare i sacchi con le tue mani"
        descrizione: "Un fattore si fida di chi suda sul suo grano. Ci vuole il giorno intero."
        costo: 2
        esito:
          titolo: Le spalle
          testo: |
            Porti i sacchi ai carri uno per spalla, finché il fattore non viene ad
            aiutarti senza dire niente. A sera hai la schiena di un vecchio, e la
            sua stretta di mano vale più di una ricevuta.
          effetti: { profondita.consiglio-guado-del-torvessa: 1, ferite: 0.5 }

  - id: consiglio-guado-le-fiammelle-sui-campi
    immagine: ambientazione/laresh
    titolo: Le fiammelle sui campi
    sommario: "Al tramonto, sui campi di stoppie intorno ai granai, si accendono fiammelle azzurre che nessuno ha acceso."
    luogo: Laresh, i campi di stoppie
    area: consiglio-guado-del-torvessa
    ripetibile: true
    requisiti: [profondita.consiglio-guado-del-torvessa == 0]
    testo: |
      Quando l'ultima luce lascia i campi di stoppie, fra i covoni si
      accendono piccole fiammelle azzurre che galleggiano all'altezza del
      ginocchio e si spostano piano verso i carri, mentre i buoi puntano gli
      zoccoli.

      «Sono gli spiriti del raccolto» dice il carrettiere, facendosi il segno
      dell'Albero. «Contano i sacchi, e se ne manca uno si prendono un bue.»

      {origine figlio-del-circolo} Al Circolo le chiamano lucciole del
      raccolto, e si lascia sempre un pugno di spighe sul bordo del campo.
    opzioni:
      - testo: "Lasciare un sacco aperto sul bordo del campo"
        descrizione: "Se contano il grano, forse si accontentano di contarne un po'."
        prova: { attributo: mentale, abilita: [natura, empatia], difficolta: Media }
        successo:
          titolo: La parte degli spiriti
          testo: |
            Spargi una manciata di grano sulle stoppie, a mano larga. Le fiammelle
            ci si posano una dopo l'altra e si spengono, e al mattino resta solo
            una brina azzurrina che si scioglie al primo sole.
          effetti: { profondita.consiglio-guado-del-torvessa: 1 }
        fallimento:
          titolo: Il sacco sbagliato
          testo: |
            Spargi il grano, ma le fiammelle lo ignorano e si radunano intorno al
            secondo carro per tutta la notte, mentre il carrettiere prega
            sottovoce. Al mattino un sacco è squarciato da una parte e vuoto.
          effetti: { tormento: 1 }
      - testo: "Disperderle con il Mana"
        descrizione: "Sono fuochi di Mana, e il Mana si può spingere da un'altra parte."
        prova: { attributo: mentale, abilita: [magia, resilienza], difficolta: Media }
        successo:
          titolo: Il vento sulle stoppie
          testo: |
            Spingi piano il Mana delle fiammelle verso il bosco, e loro lo seguono
            in fila fino a perdersi fra i tronchi. Il carrettiere, con un rispetto
            nuovo e un po' di diffidenza, ti offre un sorso dalla borraccia.
          effetti: { profondita.consiglio-guado-del-torvessa: 1, informazioni.voce: 1 }
        fallimento:
          titolo: La scottatura fredda
          testo: |
            Spingi il Mana, e le fiammelle ti vengono addosso. Una ti si posa sul
            dorso della mano con un freddo che arriva all'osso, e quando all'alba
            se ne vanno ti resta un segno azzurro a forma di moneta.
          effetti: { ferite: 0.5, tormento: 1 }
      - testo: "Vegliare fino all'alba accanto ai buoi"
        descrizione: "Lasciate in pace, le fiammelle se ne vanno da sole prima dell'alba, ma ti costa una notte in bianco."
        costo: 2
        esito:
          titolo: La veglia
          testo: |
            Passi la notte fra i carri, con la schiena contro una ruota, a
            guardare le fiammelle girare intorno ai buoi mentre il carrettiere
            russa. All'alba rientrano nei covoni, e tu ti alzi con gli occhi che
            bruciano.
          effetti: { profondita.consiglio-guado-del-torvessa: 1, tormento: 1 }

  # ------------------------------------------------------------ 0–1 · il carico storto
  - id: consiglio-guado-il-carico-storto
    immagine: ambientazione/laresh
    titolo: Il carico storto
    sommario: "Al primo sobbalzo il secondo carro si inclina da una parte, perché i sacchi sono impilati male."
    luogo: Laresh, la strada bianca fuori dai granai
    area: consiglio-guado-del-torvessa
    ripetibile: true
    requisiti: [profondita.consiglio-guado-del-torvessa <= 1]
    testo: |
      Appena fuori dall'aia il secondo carro esce da una buca inclinato, e
      sotto il telone i sacchi scivolano tutti dalla stessa parte. Il
      carrettiere ferma i buoi e scende a guardare.

      «Li hanno impilati a piramide» dice, con il disprezzo di un artigiano
      per il lavoro degli altri. «A piramide si impilano le mele.»

      {tecnologia Media} Se sposti il peso sull'asse posteriore e tendi la
      corda di traverso, il carro si raddrizza da solo alla prima curva.
    opzioni:
      - testo: "Rifare il carico sacco per sacco"
        descrizione: "Lavoro di schiena, e il carrettiere ti dice dove metterli."
        prova: { attributo: fisico, abilita: [resistenza, atletica], difficolta: Media }
        successo:
          titolo: A mattoni
          testo: |
            Rimettete su metà dei sacchi a file sfalsate, come i mattoni, con il
            carrettiere che ti corregge ogni sacco con un dito. Il carro torna
            dritto, e nel fondo del carico trovate qualche moneta caduta a chi
            l'aveva impilato.
          effetti: { profondita.consiglio-guado-del-torvessa: 1, monete: 3 }
        fallimento:
          titolo: Il sacco nel fosso
          testo: |
            Un sacco ti scivola dalla spalla e si apre nel fosso pieno d'acqua. A
            sera il carro è dritto, e tu hai una spalla che scricchiola e i
            calzoni pieni di grano bagnato.
          effetti: { ferite: 0.5 }
      - testo: "Tendere la corda di traverso"
        descrizione: "Un nodo ben fatto vale una schiena intera."
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Media }
        successo:
          titolo: Il nodo del carrettiere
          testo: |
            Fai passare la corda sotto l'asse e la riporti di traverso sul carico
            con un nodo a scorsoio. Alla prima curva il carro si raddrizza, e il
            carrettiere ti chiede di rifargli il nodo più piano, per impararlo.
          effetti: { profondita.consiglio-guado-del-torvessa: 1 }
        fallimento:
          titolo: La corda che salta
          testo: |
            La corda salta dal gancio e ti frusta il braccio, mentre il carico si
            sposta ancora di più. Per rimettere tutto a posto ci mettete fino al
            buio, e tu con un gomito che non si piega.
          effetti: { ferite: 0.5, tormento: 1 }
      - testo: "Andare piano fino alla prossima fattoria"
        descrizione: "Al passo d'uomo, con le spalle contro la sponda per tenere su il carico."
        costo: 2
        esito:
          titolo: Al passo
          testo: |
            Cammini accanto al carro con la spalla contro la sponda per tutta la
            mattina. Alla fattoria più vicina un ragazzo vi aiuta a rifare il
            carico in cambio di un passaggio, e tu riparti con una spalla più
            bassa dell'altra.
          effetti: { profondita.consiglio-guado-del-torvessa: 1, ferite: 0.5 }

  # ------------------------------------------------------------ 1 · la strada fra i campi
  - id: consiglio-guado-il-guado-del-rio
    immagine: ambientazione/laresh
    titolo: Il guado del rio
    sommario: "Con la pioggia della notte il rio ha rotto gli argini, e la strada ci finisce dentro."
    luogo: La strada fra i campi, il rio
    area: consiglio-guado-del-torvessa
    ripetibile: true
    requisiti: [profondita.consiglio-guado-del-torvessa == 1]
    testo: |
      A metà mattina la strada finisce dentro un rio color caffellatte,
      gonfio di pioggia, che si porta dietro i rami della notte. Il
      carrettiere misura l'acqua con il pungolo, che sparisce quasi fino alla
      sua mano.

      «Coi carri pieni non passiamo» dice. «O passiamo una volta sola.»

      {cavalcare Media} Il bue di sinistra è quello a cui l'acqua piace di
      meno. Se ci entra lui per primo, l'altro lo segue.
    opzioni:
      - testo: "Entrare nell'acqua e tracciare il passaggio"
        descrizione: "Una corda legata in vita e i piedi a tastare il fondo."
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Media }
        successo:
          titolo: Il fondo di ghiaia
          testo: |
            Entri nel rio con la corda in vita, tastando il fondo prima di
            caricarci il peso, e pianti paletti lungo la ghiaia buona fino
            all'altra sponda. I carri passano con l'acqua ai mozzi, e su un
            paletto trovate impigliata una borsa portata dalla piena, con qualche
            moneta verdastra.
          effetti: { profondita.consiglio-guado-del-torvessa: 1, monete: 4 }
        fallimento:
          titolo: La corrente
          testo: |
            Al quarto passo il fondo sparisce e il carrettiere ti tira fuori con
            la corda come un pesce. Avete perso mezza giornata, e tu hai un
            ginocchio gonfio e i vestiti fradici.
          effetti: { ferite: 0.5, tormento: 1 }
      - testo: "Far passare il bue di sinistra per primo"
        descrizione: "Le bestie da tiro sentono il fondo meglio degli uomini, se si fidano di chi le guida."
        prova: { attributo: fisico, abilita: [cavalcare, resistenza], difficolta: Media }
        successo:
          titolo: Il bue che sa
          testo: |
            Parli piano al bue di sinistra, a lungo, finché non smette di puntare
            gli zoccoli. Entra nell'acqua con il muso alto e si sceglie la strada
            sul fondo come se la conoscesse, e l'altro lo segue.
          effetti: { profondita.consiglio-guado-del-torvessa: 1 }
        fallimento:
          titolo: Il carro di traverso
          testo: |
            A metà guado il bue tira di lato e il primo carro si mette di traverso
            nella corrente. Per salvarlo tagliate le corde, e i sacchi della
            sponda se ne vanno lenti verso valle.
          effetti: { ferite: 0.5, consiglio.carri-persi: 1 }
      - testo: "Aspettare che l'acqua cali"
        descrizione: "Il rio si sgonfia in un giorno, e il grano può aspettare; chi vi segue forse no."
        costo: 2
        esito:
          titolo: Un giorno sulla riva
          testo: |
            Aspettate sotto i pioppi che l'acqua cali. Al tramonto un uomo a
            cavallo si ferma sulla collina dietro di voi a guardare i carri, poi
            se ne va, e all'alba passate con l'acqua alle ginocchia.
          effetti: { profondita.consiglio-guado-del-torvessa: 1, tormento: 1 }

  - id: consiglio-guado-la-ruota-spaccata
    immagine: ambientazione/laresh
    titolo: La ruota spaccata
    sommario: "Il primo carro si ferma in mezzo alla strada con una ruota aperta e i raggi segati."
    luogo: La strada fra i campi, il bivio dei gelsi
    area: consiglio-guado-del-torvessa
    ripetibile: true
    requisiti: [profondita.consiglio-guado-del-torvessa == 1]
    testo: |
      Al bivio dei gelsi il primo carro si siede sulla strada con la ruota
      destra aperta come un melograno. Il carrettiere ti mostra la rottura
      senza dire niente, e vedi il segno pulito di una sega fino a metà dei
      raggi.

      Dietro il gelso più grosso c'è una casupola con la forgia e un mucchio
      di ruote vecchie, e sulla porta un vecchio con il grembiule di cuoio vi
      guarda come clienti che non hanno scelta.

      {origine mercante-dei-ponti} Da come si sistema il grembiule capisci che
      il prezzo l'ha già fatto, come quelli che ai Ponti riparano le
      carrucole.
    opzioni:
      - testo: "Rifare i raggi con il vecchio"
        descrizione: "Lui ha le ruote vecchie e la forgia. Le mani e la pazienza ce le metti tu."
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Media }
        successo:
          titolo: La ruota di un altro
          testo: |
            Adattate una ruota vecchia lavorando tutto il pomeriggio di raspa e di
            fuoco, e il vecchio smette di fare il prezzo per insegnarti a
            stringere un cerchio a caldo. Alla fine ti chiede meno del previsto e
            ti regala due chiodi da ruota.
          effetti: { profondita.consiglio-guado-del-torvessa: 1, monete: -2, informazioni.voce: 1 }
        fallimento:
          titolo: Il cerchio storto
          testo: |
            Il cerchio stretto a caldo si piega da una parte, e ci vogliono un
            secondo giorno e una seconda ruota, che il vecchio vi fa pagare cara.
            In più ti scotti le dita su un ferro che sembrava freddo.
          effetti: { ferite: 0.5, monete: -4 }
      - testo: "Spingere il carro fino alla forgia con i buoi"
        descrizione: "Con la ruota legata a un palo e tutto il peso sulle tue spalle, fino alla casupola."
        prova: { attributo: fisico, abilita: [resistenza, atletica], difficolta: Media }
        successo:
          titolo: Il palo sotto l'asse
          testo: |
            Con un palo sotto l'asse a mo' di slitta, spingi dalla parte della
            ruota rotta mentre i buoi tirano. Arrivate alla forgia con la schiena
            fumante, e il vecchio ripara la ruota senza fiatare.
          effetti: { profondita.consiglio-guado-del-torvessa: 1 }
        fallimento:
          titolo: L'asse incrinato
          testo: |
            A metà strada il palo scivola e l'asse si incrina sulla pietra. Per
            alleggerire il carro lasciate dei sacchi sotto il gelso, e quando
            tornate a prenderli non ci sono più.
          effetti: { ferite: 0.5, consiglio.carri-persi: 1 }
      - testo: "Pagare il vecchio quello che chiede"
        descrizione: "Ha capito che siete in trappola al suo bivio, quindi il conto lo fa lui."
        costo: 2
        esito:
          titolo: Il prezzo del bivio
          testo: |
            Paghi senza discutere, e il vecchio ripara la ruota un raggio alla
            volta, fermandosi a bere a ogni raggio. Ripartite il giorno dopo con
            la borsa più leggera.
          effetti: { profondita.consiglio-guado-del-torvessa: 1, monete: -5 }

  # ------------------------------------------------------------ 2 · le colline basse
  - id: consiglio-guado-il-posto-di-blocco
    immagine: ambientazione/laresh
    titolo: Il posto di blocco
    sommario: "In cima alla prima collina due uomini con il mantello dei Custodi sbarrano la strada con una stanga."
    luogo: Le colline basse, la stanga sulla strada
    area: consiglio-guado-del-torvessa
    ripetibile: true
    requisiti: [profondita.consiglio-guado-del-torvessa == 2]
    testo: |
      In cima alla prima collina una stanga su due cavalletti sbarra la
      strada. Accanto, all'ombra di un fico, siedono due uomini con il
      mantello grigio dei Custodi. Il più grosso, con la fibbia cucita storta
      sul petto, apre un registro sulla stanga.

      «Dazio delle colline» dice. «Un tanto a sacco, per la manutenzione della
      strada.» Intorno a lui la strada non ha mai visto un badile.

      {origine figlio-della-citta-bassa} Nei vicoli si faceva lo stesso con le
      fasce della milizia comprate da un rigattiere, e bastava che il cliente
      non sapesse leggere.
    opzioni:
      - testo: "Chiedere di vedere il suo sigillo"
        descrizione: "Un Custode vero il sigillo ce l'ha. Uno falso deve inventarsi qualcosa."
        prova: { attributo: mentale, abilita: [percezione, politica-ed-economia], difficolta: Media }
        successo:
          titolo: Il sigillo che manca
          testo: |
            Gli chiedi il sigillo che i Custodi portano al collo, e lui si tocca
            il petto dove non c'è. Quando gli indichi la fibbia cucita storta, i
            due se ne vanno per i campi lasciando sul cavalletto il registro e il
            borsello delle monete raccolte stamattina.
          effetti: { profondita.consiglio-guado-del-torvessa: 1, monete: 5 }
        fallimento:
          titolo: Il registro
          testo: |
            Il grosso ti sbatte sotto il naso il registro pieno di croci, e mentre
            cerchi di leggerlo il secondo carica due sacchi su un mulo e se ne va
            per il campo.
          effetti: { sospetto: 1, consiglio.carri-persi: 1 }
      - testo: "Recitare la parte di un Custode più alto in grado"
        descrizione: "Se lui è un Custode, tu puoi essere il suo superiore, e chi mente male teme chi mente meglio."
        prova: { attributo: sociale, abilita: [ingannare, intimidire], difficolta: Media }
        successo:
          titolo: L'ispezione
          testo: |
            Sfogli il registro con la faccia annoiata di un ispettore e chiedi
            dove sono stati versati gli incassi della settimana scorsa. Il grosso
            balbetta, e alla fine tolgono la stanga scusandosi e ti allungano una
            manciata di monete perché non scriva il suo nome.
          effetti: { profondita.consiglio-guado-del-torvessa: 1, monete: 4 }
        fallimento:
          titolo: Il nome del capitano
          testo: |
            Il grosso ti chiede il nome del tuo capitano e ride di quello che
            inventi. Pagate il dazio intero più una parte per l'offesa, e il
            carrettiere per tutta la discesa non ti rivolge la parola.
          effetti: { monete: -4, scandalo: 1 }
      - testo: "Pagare il dazio e tirare dritto"
        descrizione: "Costa meno di una rissa, e le colline sono ancora lunghe."
        costo: 2
        esito:
          titolo: Il dazio delle colline
          testo: |
            Paghi a sacco, e il grosso conta i sacchi due volte, sbagliando sempre
            a suo favore. Dalla collina dopo lo vedi rimettere la stanga di
            traverso per il prossimo carro, fischiettando.
          effetti: { profondita.consiglio-guado-del-torvessa: 1, monete: -6 }

  - id: consiglio-guado-gli-orchi-profughi
    immagine: ambientazione/laresh
    titolo: Gli orchi profughi
    sommario: "Degli orchi affamati si sono rifugiati in un casolare bruciato lungo la strada del grano."
    luogo: Le colline basse, il casolare bruciato
    area: consiglio-guado-del-torvessa
    ripetibile: true
    requisiti: [profondita.consiglio-guado-del-torvessa == 2]
    testo: |
      Dove la strada gira intorno alla seconda collina c'è un casolare
      bruciato, e sulla soglia compaiono quattro orchi magri, con le costole
      che si contano sotto la pelle grigioverde; uno ha il braccio fasciato.
      Nessuno impugna un'arma, però non si spostano dalla strada.

      «Spiumatori» dice il carrettiere con la mano sul coltello. «Scappati
      dopo la razzia.»

      {empatia Media} Il più giovane guarda i sacchi e si lecca le labbra, poi
      se ne vergogna. Hanno più fame che voglia di combattere.

      {origine fuggiasco-di-ghoran} Le costole contate le conosci dai tempi di
      Ghoran, quando si mangiava dopo la bilancia.
    opzioni:
      - testo: "Dividere con loro un sacco di grano"
        descrizione: "Un sacco in meno al Maniero e una strada tranquilla, purché non sembri una debolezza."
        prova: { attributo: sociale, abilita: [empatia, persuasione], difficolta: Media }
        successo:
          titolo: Il sacco aperto
          testo: |
            Posi un sacco sulla soglia del casolare e torni indietro di qualche
            passo. Quello con il braccio fasciato lo apre con i denti e i quattro
            si spostano, e il più giovane ti dice in un comune stentato che al
            fiume ci sono uomini che aspettano qualcuno.
          effetti: { profondita.consiglio-guado-del-torvessa: 1, informazioni.voce: 1 }
        fallimento:
          titolo: La mano sul coltello
          testo: |
            Mentre posi il sacco il carrettiere estrae il coltello, e gli orchi si
            buttano sul secondo carro. Prima che tu riesca a calmare tutti hanno
            portato via mezzo carico, ma nessuno si è fatto male.
          effetti: { consiglio.carri-persi: 1 }
      - testo: "Farli spostare con la voce"
        descrizione: "Hanno fame e paura, e basta che la paura sia più grande."
        prova: { attributo: sociale, abilita: [intimidire, addestrare-animali], difficolta: Media }
        successo:
          titolo: La strada libera
          testo: |
            In piedi sul carro gli parli forte e lento, con la mano sulla cintura.
            Si ritirano nel casolare uno alla volta, senza voltarti le spalle, e
            il carrettiere ti guarda con un'ammirazione che non ti fa piacere.
          effetti: { profondita.consiglio-guado-del-torvessa: 1 }
        fallimento:
          titolo: Il sasso
          testo: |
            Il più giovane ti tira un sasso che ti prende sullo zigomo, e la
            strada resta chiusa. Fate il giro largo per i campi, fra i fossi, fino
            a sera.
          effetti: { ferite: 0.5, tormento: 1 }
      - testo: "Fare il giro largo per i pascoli"
        descrizione: "I carri fra i muretti e i fossi dei pascoli, lontano dal casolare."
        costo: 2
        esito:
          titolo: I muretti
          testo: |
            Passate per i pascoli aprendo e richiudendo i varchi nei muretti,
            sotto gli occhi degli orchi, e riprendete la strada dopo la collina
            con un'asse rotta sul fondo del secondo carro.
          effetti: { profondita.consiglio-guado-del-torvessa: 1, ferite: 0.5 }

  # ------------------------------------------------------------ 2–3 · l'osteria del bivio
  - id: consiglio-guado-l-osteria-del-bivio
    immagine: ambientazione/laresh
    titolo: L'osteria del bivio
    sommario: "All'ultimo bivio prima del fiume c'è un'osteria con la pergola, dove i carrettieri del grano si fermano e parlano."
    luogo: Le colline basse, l'osteria del bivio
    area: consiglio-guado-del-torvessa
    ripetibile: true
    requisiti: [profondita.consiglio-guado-del-torvessa >= 2, profondita.consiglio-guado-del-torvessa <= 3]
    testo: |
      L'osteria sta dove la strada si divide fra il ponte del dazio e il guado
      vecchio, con una pergola di vite e due tavoli pieni di carrettieri. Uno
      alza il bicchiere verso il tuo carrettiere e lo chiama per nome, e il
      tuo tira dritto con gli occhi sui buoi.

      {conoscenze-della-strada Media} In un posto così le notizie si vendono a
      bicchieri, e chi passa per il guado vecchio ha un motivo che qui sanno
      tutti prima di lui.
    opzioni:
      - testo: "Offrire da bere e ascoltare"
        descrizione: "Un giro per i tavoli, e qualcuno parla."
        prova: { attributo: sociale, abilita: [conoscenze-della-strada, galateo], difficolta: Media }
        successo:
          titolo: Un giro di vino
          testo: |
            Dopo il secondo bicchiere un carrettiere anziano ti racconta che al
            guado, da due giorni, ci sono uomini accampati sotto i salici che non
            pescano. Te li conta sulle dita e ti chiede di non dire chi te l'ha
            detto.
          effetti: { profondita.consiglio-guado-del-torvessa: 1, monete: -2, informazioni.voce: 1 }
        fallimento:
          titolo: Il bicchiere di troppo
          testo: |
            Offri due giri, e i carrettieri bevono volentieri parlando di buoi e
            del prezzo del fieno. Ti alzi con la borsa più leggera, e il tuo
            carrettiere ti aspetta sul carro con le braccia conserte.
          effetti: { monete: -4, tormento: 1 }
      - testo: "Chiedere al tuo carrettiere chi era quell'uomo"
        descrizione: "Si conoscono, e il tuo carrettiere ha fatto finta di niente."
        prova: { attributo: sociale, abilita: [empatia, intimidire], difficolta: Media }
        successo:
          titolo: I vecchi compagni
          testo: |
            Dopo la curva il carrettiere ti dice che quello guidava con lui i
            carri dei Malgrani, prima che Quintus lo prendesse a servizio, e che
            ha chiesto se il grano dei Castaldi passa dal guado. Giura di essere
            stato zitto, e ti sembra sincero.
          effetti: { profondita.consiglio-guado-del-torvessa: 1, informazioni.voce: 1 }
        fallimento:
          titolo: Il muso
          testo: |
            Insisti troppo e lui si offende. Per il resto della giornata guida i
            buoi in silenzio e troppo piano, e al tramonto non sai più se fidarti
            di lui.
          effetti: { tormento: 1, sospetto: 1 }
      - testo: "Tirare dritto senza fermarsi"
        descrizione: "Meno si parla di questi carri, meglio è, anche a costo di perdere il fresco della pergola."
        costo: 2
        esito:
          titolo: Senza fermarsi
          testo: |
            Tirate dritto verso il guado vecchio, mentre ai tavoli tutti tacciono.
            Dopo la curva senti ridere alle tue spalle, e qualcuno se ne va a
            cavallo per i campi.
          effetti: { profondita.consiglio-guado-del-torvessa: 1, sospetto: 1 }

  # ------------------------------------------------------------ 3 · la riva del Torvessa
  - id: consiglio-guado-il-pesatore-della-gilda
    immagine: ambientazione/laresh
    titolo: Il pesatore della Gilda
    sommario: "Sulla riva del Torvessa vi aspetta Fabrizio Lodde con la stadera della Gilda e il registro aperto."
    luogo: La riva del Torvessa, sotto i salici
    area: consiglio-guado-del-torvessa
    ripetibile: true
    requisiti: [profondita.consiglio-guado-del-torvessa == 3]
    testo: |
      Dove il Torvessa si allarga fra i salici siede su uno sgabello
      pieghevole Fabrizio Lodde, il pesatore, con una stadera appesa a un ramo
      e il registro della Gilda sulle ginocchia. Il cavallo è legato poco più
      su.

      «Che passi dal ponte o dal guado, il grano che entra in città la Gilda
      lo pesa» dice senza alzarsi. «A modo mio, s'intende, perché qui il ponte
      non c'è.»

      {intimidire Media} Sta seduto per sembrare a suo agio, e ha messo lo
      sgabello in modo da avere il cavallo alle spalle.
    opzioni:
      - testo: "Fargli notare che il guado non è del ponte"
        descrizione: "La Gilda pesa al ponte e lui lo sa meglio di te, basta dirlo nel modo giusto."
        prova: { attributo: mentale, abilita: [politica-ed-economia, accademiche], difficolta: Media }
        successo:
          titolo: Le regole del ponte
          testo: |
            Gli citi il regolamento del dazio, le stesse parole che lui legge ai
            carrettieri sul ponte, e gli chiedi in quale articolo si parla del
            guado. Lodde chiude il registro di colpo e risale verso il cavallo con
            lo sgabello sotto il braccio, borbottando che il Comune ha fretta di
            imparare.
          effetti: { profondita.consiglio-guado-del-torvessa: 1, informazioni.voce: 1 }
        fallimento:
          titolo: La pesata
          testo: |
            Lui il regolamento lo conosce meglio di te, e ti ricorda la clausola
            sul grano destinato alla vendita. Pesa i sacchi con il pollice sulla
            stadera, e paghi per un carico più grande del tuo.
          effetti: { monete: -5, sospetto: 1 }
      - testo: "Fargli capire che è solo"
        descrizione: "È lontano dal ponte, senza Custodi, con due carri del Comune davanti."
        prova: { attributo: sociale, abilita: [intimidire, persuasione], difficolta: Media }
        successo:
          titolo: Il cavallo alle spalle
          testo: |
            Ti siedi davanti al suo sgabello e gli chiedi quanto ci mette un uomo
            a cavallo a tornare al ponte prima di buio. Lodde ci pensa, poi smonta
            la stadera e se ne va con molta cortesia, dimenticando sotto il salice
            il sacchetto dei pesi di ottone.
          effetti: { profondita.consiglio-guado-del-torvessa: 1, monete: 3 }
        fallimento:
          titolo: Il nome nel registro
          testo: |
            Lodde si alza e scrive nel registro il tuo nome, scandendolo ad alta
            voce, con il numero dei sacchi e l'ora. Quel registro finirà sul
            tavolo della Casa dei Nodi prima della fine del mese.
          effetti: { sospetto: 1.5 }
      - testo: "Lasciargli pesare i sacchi a modo suo"
        descrizione: "Si paga e si passa, ma Lodde è lento e il sole è già basso."
        costo: 2
        esito:
          titolo: A modo suo
          testo: |
            Lodde pesa i sacchi uno alla volta, con il pollice sul piatto, fino al
            tramonto. Paghi quello che chiede per una ricevuta che vale meno della
            carta, e arrivate al guado con il buio.
          effetti: { profondita.consiglio-guado-del-torvessa: 1, monete: -6 }

  - id: consiglio-guado-la-barca-dei-pescatori
    immagine: ambientazione/roccia-di-wren
    titolo: La barca dei pescatori
    sommario: "Due pescatori riparano una rete sulla riva, e il guado vecchio lo conoscono, con chi ci passa."
    luogo: La riva del Torvessa, la spiaggia dei pescatori
    area: consiglio-guado-del-torvessa
    ripetibile: true
    requisiti: [profondita.consiglio-guado-del-torvessa == 3]
    testo: |
      Su una spiaggetta di sabbia grigia due pescatori riparano una rete
      accanto a una barca a fondo piatto tirata in secca, e non alzano la
      testa al passaggio dei carri. Più giù si vede la ghiaia del guado
      vecchio, e dai salici dell'altra sponda, mezzi nascosti dalla foschia,
      sale un filo di fumo.

      {natura Media} I gabbiani se ne stanno sulla sponda di qua, perché di là
      qualcuno li ha fatti alzare.

      {origine apprendista-raschiatore} I pescatori fanno il nodo della rete
      con il giro di pollice che sulle piattaforme si usa per le corde di
      sicurezza.
    opzioni:
      - testo: "Chiedere ai pescatori chi c'è sull'altra sponda"
        descrizione: "Vedono tutto quello che passa sul fiume, e non parlano con tutti."
        prova: { attributo: sociale, abilita: [empatia, conoscenze-della-strada], difficolta: Media }
        successo:
          titolo: Il fumo di là
          testo: |
            Tieni il capo della rete che uno dei due ti porge finché il nodo non è
            fatto. Poi ti dicono che di là ci sono uomini da due giorni, con i
            cavalli nascosti fra i salici, e il più vecchio ti regala una lenza.
          effetti: { profondita.consiglio-guado-del-torvessa: 1, informazioni.voce: 1 }
        fallimento:
          titolo: La rete
          testo: |
            I pescatori ti parlano della corrente e di un luccio grosso come un
            bambino. Quando insisti uno dei due spinge la barca in acqua e
            sparisce a remi lenti nella foschia, verso l'altra sponda.
          effetti: { sospetto: 1, tormento: 1 }
      - testo: "Prendere la barca e guardare l'altra sponda"
        descrizione: "Una barca a fondo piatto e la foschia a coprirti, se sai muoverti senza schizzi."
        prova: { attributo: fisico, abilita: [furtivita, atletica], difficolta: Media }
        successo:
          titolo: I cavalli fra i salici
          testo: |
            Nascosto dalla foschia, ti lasci portare dalla corrente lungo l'altra
            sponda e conti i cavalli legati fra i salici e gli uomini sdraiati con
            le armi accanto. Sotto un salice trovi una borsa dimenticata con il
            pranzo e qualche moneta.
          effetti: { profondita.consiglio-guado-del-torvessa: 1, monete: 3 }
        fallimento:
          titolo: Lo schizzo
          testo: |
            Il remo batte sul bordo con uno schiocco, e dall'altra sponda partono
            dei sassi; uno ti prende alla spalla, e torni a riva remando con un
            braccio solo.
          effetti: { ferite: 0.5, sospetto: 1 }
      - testo: "Aspettare la notte sulla spiaggia"
        descrizione: "Con il buio si vedrà se di là accendono un fuoco, ma la notte sulla riva è fredda."
        costo: 2
        esito:
          titolo: La notte sulla riva
          testo: |
            Aspettate il buio dietro la barca, senza fuoco. Dall'altra sponda non
            arriva nessuna luce, e a mezzanotte senti un cavallo nitrire fra i
            salici prima che qualcuno lo zittisca. Passi la notte con il mantello
            umido addosso.
          effetti: { profondita.consiglio-guado-del-torvessa: 1, ferite: 0.5 }

  # ------------------------------------------------------------ il cuore · il guado vecchio
  - id: consiglio-il-guado
    immagine: ambientazione/roccia-di-wren
    titolo: Il guado vecchio
    sommario: "A metà del guado vecchio escono dai salici uomini armati, guidati da un carrettiere con il pungolo."
    luogo: Il Torvessa, il guado vecchio
    area: consiglio-guado-del-torvessa
    requisiti: [fazione.consiglio == 7, profondita.consiglio-guado-del-torvessa >= 4]
    testo: |
      Il guado vecchio è una lingua di ghiaia che attraversa il Torvessa di
      sbieco, segnata da due file di pali neri. I carri ci entrano uno dietro
      l'altro, con l'acqua ai mozzi, e a metà del fiume il carrettiere di
      Quintus tira le redini.

      Dai salici dell'altra sponda escono uomini con bastoni e lame corte e si
      dispongono sulla ghiaia. Davanti a loro un uomo largo di spalle, con la
      barba grigia tagliata col coltello, entra in acqua fino alle ginocchia e
      si appoggia a un pungolo di frassino.

      «Guido Sarpa» dice il tuo carrettiere sottovoce. «Vent'anni sui carri
      del grano dei Malgrani. Ogni guado di questo fiume lo conosce a occhi
      chiusi.»

      «Il grano lo portiamo noi da qui in avanti» dice Sarpa, con la voce
      grossa che si usa per chiamare i buoi. «Voi tornate a casa a piedi, e
      nessuno si bagna più del necessario. Non ho niente contro di te.»

      {armi-da-mischia Media} Il pungolo è lungo il doppio di una spada, e lui
      lo tiene basso. In acqua chi cade non si rialza in fretta.

      {conoscenze-della-strada Media} Dietro di lui i carrettieri si guardano
      fra loro più di quanto guardino te. Sono uomini comprati per una
      giornata, e qualcuno fa già il conto di quanto vale la sua.
    opzioni:
      - testo: "Affrontare Sarpa e i suoi uomini nel guado"
        descrizione: "Gli sgherri dei Malgrani hanno la livrea sotto i mantelli, e Sarpa in acqua colpisce basso."
        quando: [pista.pelle < 7]
        combattimento: consiglio-l-agguato-al-guado
        vittoria:
          titolo: Il pungolo
          testo: |
            Sarpa cade all'indietro nella corrente e tu raccogli il pungolo prima
            che il fiume se lo porti. Gli sgherri dei Malgrani scappano sulla
            ghiaia lasciando mantelli e qualche borsa.

            Tre giorni dopo i carri entrano nel seminterrato del Maniero Castaldi,
            dove Eolio Drest segna ogni sacco su una lavagnetta.
          effetti: { fazione.consiglio: 1, rep.castaldi: 0.5, oggetto.consiglio-pungolo-di-sarpa: 1, monete: 10 }
          imposta: { consiglio.sarpa: 1 }
          vai: quartieri-alti
        sconfitta:
          titolo: In acqua
          testo: |
            Il pungolo ti prende dietro le ginocchia e finisci sotto, con il fiume
            in bocca. Quando riemergi gli sgherri stanno trascinando il secondo
            carro verso i salici.

            Arrivi in città con un carro solo e le costole ammaccate, e nel
            seminterrato del Maniero Castaldi Eolio Drest conta i sacchi due volte
            senza dire il numero.
          effetti: { fazione.consiglio: 1, consiglio.carri-persi: 1 }
          imposta: { consiglio.sarpa: 1 }
          vai: quartieri-alti
      - testo: "Affrontare Sarpa e i suoi uomini nel guado"
        descrizione: "I ragazzi delle cellule dei villaggi li paga Tebaldo Ronchi, e Sarpa in acqua colpisce basso."
        quando: [pista.pelle >= 7]
        combattimento: consiglio-l-agguato-al-guado-dopo
        vittoria:
          titolo: Il pungolo
          testo: |
            Sarpa cade all'indietro nella corrente e tu raccogli il pungolo prima
            che il fiume se lo porti. I ragazzi delle cellule scappano sulla
            ghiaia, e uno perde una borsa con le monete di Ronchi ancora divise a
            mucchietti.

            Tre giorni dopo i carri entrano nel seminterrato del Maniero Castaldi,
            dove Eolio Drest segna ogni sacco su una lavagnetta.
          effetti: { fazione.consiglio: 1, rep.castaldi: 0.5, oggetto.consiglio-pungolo-di-sarpa: 1, monete: 10 }
          imposta: { consiglio.sarpa: 1 }
          vai: quartieri-alti
        sconfitta:
          titolo: In acqua
          testo: |
            Il pungolo ti prende dietro le ginocchia e finisci sotto, con il fiume
            in bocca. Quando riemergi i ragazzi delle cellule stanno trascinando
            il secondo carro verso i salici.

            Arrivi in città con un carro solo e le costole ammaccate, e nel
            seminterrato del Maniero Castaldi Eolio Drest conta i sacchi due volte
            senza dire il numero.
          effetti: { fazione.consiglio: 1, consiglio.carri-persi: 1 }
          imposta: { consiglio.sarpa: 1 }
          vai: quartieri-alti
      - testo: "Convincere i carrettieri che non li pagheranno"
        descrizione: "Chi paga un furto di solito paga a metà, e i carrettieri a giornata devono sentirtelo dire."
        prova: { attributo: sociale, abilita: [persuasione, conoscenze-della-strada], difficolta: Difficile }
        successo:
          titolo: La paga in tasca
          testo: |
            Parli ai carrettieri uno per uno, e chiedi chi gli garantisce la paga
            adesso che il grano è del Comune. I bastoni si abbassano uno dopo
            l'altro, e Sarpa ride amaro e ti chiede se al Comune serve un
            carrettiere che conosce i guadi.

            I carri arrivano in città con Sarpa in testa, ed Eolio Drest, nel
            seminterrato del Maniero Castaldi, segna i sacchi senza fare domande.
          effetti: { fazione.consiglio: 1, rep.castaldi: 0.5 }
          imposta: { consiglio.sarpa: 2 }
          vai: quartieri-alti
        fallimento:
          titolo: Le bastonate
          testo: |
            Sarpa ti lascia parlare fino a metà, poi fa un cenno, e il primo
            bastone ti arriva sulla spalla. Quando ti rialzi nella corrente il
            secondo carro è già fra i salici.

            Arrivi in città con un carro solo e la spalla gonfia, ed Eolio Drest
            ti apre il seminterrato del Maniero e conta i sacchi in silenzio.
          effetti: { fazione.consiglio: 1, ferite: 1, consiglio.carri-persi: 1 }
          imposta: { consiglio.sarpa: 1 }
          vai: quartieri-alti
      - testo: "Tornare indietro e passare di notte dal guado basso"
        descrizione: "Più a valle c'è un guado basso forse non sorvegliato, dove di notte si rischia un carro."
        prova: { attributo: mentale, abilita: [natura, percezione], difficolta: Difficile }
        successo:
          titolo: Il guado basso
          testo: |
            Fai voltare i carri come se rinunciassi, e con il buio cerchi il guado
            basso tastando il fondo con un palo. Il primo carro passa; il secondo
            scivola in una buca, e per salvare i buoi lasci andare il suo carico
            nella corrente.

            All'alba sei dall'altra parte, e nel seminterrato del Maniero Castaldi
            Eolio Drest fa stendere i sacchi bagnati ad asciugare.
          effetti: { fazione.consiglio: 1, consiglio.carri-persi: 1 }
          imposta: { consiglio.sarpa: 3 }
          vai: quartieri-alti
        fallimento:
          titolo: Il fiume di notte
          testo: |
            Nel buio sbagli guado e la corrente ti trascina sui sassi finché non
            ti aggrappi a una radice. Sulla riva ti aspetta Sarpa con una
            lanterna, e il secondo carro è già legato ai suoi buoi.

            Arrivi in città con un carro solo, ed Eolio Drest ti apre il
            seminterrato del Maniero senza fare domande.
          effetti: { fazione.consiglio: 1, ferite: 1, consiglio.carri-persi: 1 }
          imposta: { consiglio.sarpa: 1 }
          vai: quartieri-alti
      - testo: "Mostrare ai carrettieri come sono legati i carri"
        descrizione: "Le loro corde hanno il doppio nodo dei carri del mercato di Ghoran, e tu sai chi lo paga."
        quando: [origine.fuggiasco-di-ghoran >= 1]
        esito:
          titolo: Il nodo di Ghoran
          testo: |
            Indichi ai carrettieri le corde, annodate con il doppio nodo che a
            Ghoran si usa per i carri della bilancia, e spieghi a cosa serve. I
            bastoni si abbassano, e Sarpa, che quel nodo lo fa da vent'anni, ti
            chiede se al Comune serve un carrettiere.

            I carri arrivano in città con Sarpa in testa, e al Maniero Castaldi
            Eolio Drest segna i sacchi.
          pe: { persuasione: 5 }
          effetti: { fazione.consiglio: 1, rep.castaldi: 0.5 }
          imposta: { consiglio.sarpa: 2 }
          vai: quartieri-alti
