# La quest di fazione del Consiglio di Qir-Azel e della casata Castaldi (pista fazione.consiglio, 0 → 15;
# reputazione rep.castaldi). Dalla panca dell'anticamera al tavolo della sala consiliare: le faccende che il
# Consiglio rinvia, il debito di grano dei Castaldi con i Malgrani, le sedie vuote dei Tarvelin e dei Malgrani.
#
# Dove sta cosa:
# - passi 1, 3 e 5: le tre storie di contenuti/citta/municipio.yaml (le petizioni, il ritratto, l'incarico), con i
#   requisiti cambiati in fazione.consiglio == 0, 2 e 4 e la pista negli esiti.
# - passi 2, 4 e 6: passi-1.yaml (il ponticello di Ada, la cena di consiglio, la tribuna).
# - passi 7-10: passi-2.yaml (il bilancio di Aldous, la partenza dei carri, il grano nel magazzino, l'idromele
#   delle dieci). Chiedono pista.tribu >= 1. Il passo 8 è la spedizione spedizione-guado.yaml.
# - passi 11-15: passi-3.yaml (le sedie vuote, il giardino di Maerith, la notte prima della seduta, la seduta,
#   la spilla). Chiedono pista.acciaio >= 8 e restano chiusi con pista.pelle fra 4 e 6, come l'Arena. Il passo 13
#   è la spedizione spedizione-maniero.yaml.
# - servizi.yaml: i ripetibili che si aprono con i gradi. oggetti.yaml, nemici.yaml, glossario.yaml.
#
# Gli stati del mondo: prima della caduta di Ottone (pista.pelle < 7) il creditore dei Castaldi è la casa dei
# Malgrani con Ottone in Consiglio; dopo (pista.pelle >= 7) le obbligazioni le tiene Urtilia Mendion a Ghoran, e
# in città le porta Tebaldo Ronchi, il suo procuratore. Ronchi cura gli affari dei Malgrani di Ghoran in tutti e due
# gli stati.
#
# I sette seggi (il Codex con i nomi del gioco): Julia Castaldi, Galdrick, Padre Vantes per il Velo, Tenebra per i
# Raschiatori, Tarquin Cordani per la Gilda, e le due sedie delle famiglie, quella dei Malgrani e quella dei
# Tarvelin. Il seggio dei Malgrani lo decide il passo 14 (seggio.malgrani, in contenuti/fazioni/comuni.yaml):
# 1 alle cooperative con Marko Thessel o Anselmo Brey, 2 alla Gilda, 3 all'erede sotto la tutela di Urtilia.
#
# I voti della seduta (passo 14): consiglio.voti conta i voti che il protagonista porta in sala. Vantes, Tenebra,
# Cordani e la sedia dei Tarvelin valgono uno ciascuno; le carte di Aldous salvate al passo 13 valgono uno; lo
# scontro in sala vinto ne vale tre. Si vince con cinque.
quality:
  - { id: fazione.consiglio, immagine: fazioni/consiglio-di-qir-azel, nome: Dalla panca al tavolo, categoria: pista, descrizione: "Julia Castaldi tiene insieme il Consiglio di Qir-Azel con le pratiche già lette e la voce roca. Dalla panca dell'anticamera alla sala dei sette seggi c'è una scala sola, e qualcuno deve salirla per lei." }

  # passo 6: il consigliere con cui hai parlato dopo la prima seduta
  - { id: consiglio.voce, nome: Il consigliere della tribuna, categoria: stato, nascosta: true, descrizione: "1 Padre Vantes, 2 Tenebra, 3 Tarquin Cordani, 4 Galdrick o il suo sergente, 5 Ottone Malgrani." }
  # passo 7: sai del debito di grano; 2 se al passo 14 il debito è stato cancellato in cambio del seggio
  - { id: consiglio.debito, nome: Il debito di grano dei Castaldi, categoria: stato, nascosta: true }
  # passo 8: la spedizione del guado
  - { id: consiglio.partito, nome: I carri di Laresh sono partiti, categoria: stato, nascosta: true }
  - { id: consiglio.carri-persi, nome: Carri persi sulla strada del grano, categoria: stato, nascosta: true }
  - { id: consiglio.sarpa, nome: Guido Sarpa al guado, categoria: stato, nascosta: true, descrizione: "1 battuto, 2 i carrettieri passano al Comune con lui, 3 aggirato dal guado basso." }
  # passo 9: dove va il grano. 1 la casata, 2 la città, 3 a metà
  - { id: consiglio.grano, nome: Il grano nel magazzino, categoria: stato, nascosta: true }
  # passo 10: 1 il libretto a Julia, 2 il silenzio comprato, 3 Ettore va da Julia di persona
  - { id: consiglio.ettore, nome: Il libretto di Ettore Castaldi, categoria: stato, nascosta: true }
  # passo 12: 1 Liaren siede in Consiglio, 2 nomina un altro, 3 nessuno e il seggio va al voto
  - { id: consiglio.tarvelin, nome: La sedia dei Tarvelin, categoria: stato, nascosta: true }
  # passo 13: la spedizione del Maniero di notte
  - { id: consiglio.notte, nome: La notte prima della seduta, categoria: stato, nascosta: true }
  - { id: consiglio.gazza, nome: Il vantaggio della Gazza, categoria: stato, nascosta: true, descrizione: "Sale a ogni prova fallita nel Maniero di notte. A tre la ladra ha già le carte, e sui tetti bisogna prima raggiungerla." }
  - { id: consiglio.carte, nome: Le carte di Aldous, categoria: stato, nascosta: true, descrizione: "1 restano a casa, 2 la Gazza scappa con le carte, 3 gliele lasci tu." }
  # passo 14: i voti contati alla vigilia e in sala
  - { id: consiglio.voti, nome: I voti della seduta, categoria: stato, nascosta: true }
  - { id: consiglio.voto-vantes, nome: Il voto di Padre Vantes, categoria: stato, nascosta: true }
  - { id: consiglio.voto-tenebra, nome: Il voto di Tenebra, categoria: stato, nascosta: true }
  - { id: consiglio.voto-cordani, nome: Il voto di Tarquin Cordani, categoria: stato, nascosta: true }
  - { id: consiglio.voto-tarvelin, nome: Il voto della sedia dei Tarvelin, categoria: stato, nascosta: true }
  - { id: consiglio.esito, nome: La seduta, categoria: stato, nascosta: true, descrizione: "1 vinta, 2 persa, 3 mediata con Ottone Malgrani." }
  # passo 15
  - { id: consiglio.condizione, nome: La cassa dei respinti, categoria: stato, nascosta: true, descrizione: "1 se hai accettato di sedere alle sedute a condizione che la cassa dei respinti non esista più." }

fazioni:
  - id: consiglio
    nome: Consiglio di Qir-Azel
    immagine: fazioni/consiglio-di-qir-azel
    reputazione: rep.castaldi
    pista: fazione.consiglio
    gradi:
      - { passo: 3, nome: Scrivano della panca, ricompensa: "La penna d'osso del Municipio, una borsa piccola e un angolo del bancone di Tullio, dove si scrivono le petizioni di chi non sa scrivere." }
      - { passo: 6, nome: Incaricato del Consiglio, ricompensa: "La lettera col sigillo del Consiglio, che apre le porte dei consiglieri e degli archivi e fa sparire qualche multa, un posto in tribuna e una borsa." }
      - { passo: 9, nome: Messo del sigillo, ricompensa: "Il cuoio della Guardia Castaldi e il cortile di Quintus Vael, dove la sua scorta si allena all'alba e accetta chi parla a nome di Julia." }
      - { passo: 12, nome: Cancelliere, ricompensa: "L'anello delle bilance e la stanza degli ospiti al Maniero Castaldi, dove si dorme e si guarisce senza pagare." }
      - { passo: 15, nome: Voce del Consiglio, ricompensa: "La mazza del Patto, la spilla del Consiglio, una borsa pesante e un posto alle sedute con il tuo parere a verbale." }
