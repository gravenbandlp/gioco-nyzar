# Il Maniero Castaldi di notte, spedizione del passo 13 della quest del Consiglio (fazione.consiglio 12 → 13).
# La notte prima della seduta una ladra di Ghoran, Nives Orsat detta la Gazza, entra nel Maniero per prendere il
# bilancio parallelo di Aldous e le obbligazioni di grano firmate da Julia. Il protagonista difende la casa con
# Quintus Vael: è il Maniero Malgrani visto dall'altra parte.
# L'ingresso è in passi-3.yaml (imposta consiglio.notte 1 e consiglio.gazza 0); dopo una ritirata si rientra con
# `consiglio-tornare-al-maniero` (Quartieri Alti, ripetibile).
# Le stanze vanno in fasce di profondità, e una stanza superata non ricompare nella stessa visita:
# 0 il cortile e il pianterreno (il fico, la cucina dei segnali muti; il portone delle bilance vale anche a 1),
# 1 il seminterrato (i sacchi di Laresh, la porta del vino), 2 i piani nobili (lo studio di Aldous, la sala da
# pranzo), 3 fra i tetti di rame (la stanza dei nipoti, il lucernario).
# consiglio.gazza è il vantaggio della ladra: sale di uno a ogni prova fallita e a ogni via lunga (costo 2). Non
# chiude nessuna stanza. A tre la Gazza ha già le carte, e sui tetti bisogna prima raggiungerla.
# Il cuore a 4 è `consiglio-sui-tetti-di-rame`: il combattimento (con Ettore al Maniero se consiglio.ettore == 3),
# pagarla, farla aspettare da Quintus, inseguirla se ha le carte, oppure lasciargliele (rep.scuri >= 3).
# consiglio.carte: 1 restano a casa (e valgono un voto in seduta), 2 la Gazza scappa, 3 gliele lasci tu.
# Ogni esito del cuore porta la pista a 13 e riporta ai Quartieri Alti, tranne l'inseguimento riuscito, che ti
# lascia sul tetto davanti a lei.
aree:
  - id: consiglio-maniero-di-notte
    immagine: fazioni/famiglia-castaldi
    nome: Il Maniero Castaldi, di notte
    sommario: "Quintus Vael chiude le porte una per una, e tu cerchi la Gazza prima che arrivi alle carte di Aldous."
    spedizione: { ritorno: quartieri-alti, soglia: 4, stanze: 3 }
    testo: |
      Di notte il Maniero Castaldi sembra più piccolo, tre piani di pietra chiara sotto i tetti di rame e
      sopra il seminterrato dei magazzini. Le imposte di quercia dei piani nobili sono chiuse, e la pietra
      prende la poca luce che sale dalla strada fino al primo cornicione. Più su il rame bagnato di guazza è
      nero.

      Qualcuno è entrato. Quintus Vael l'ha capito da una tegola smossa e da un cane che non ha abbaiato, e
      adesso gira per il cortile con la mano sull'elsa. Ogni tanto dai tetti arriva lo scatto secco del rame
      che si ritira al freddo, e tu ti ripeti che è soltanto quello. La ladra cerca il bilancio di Aldous e le
      obbligazioni firmate da Julia, le carte che domani qualcuno vorrebbe leggere in Consiglio.

storylet:
  # ------------------------------------------------------------ il rientro, ai Quartieri Alti
  - id: consiglio-tornare-al-maniero
    presso: consiglio-maniero-castaldi
    immagine: fazioni/famiglia-castaldi
    titolo: Tornare al Maniero
    sommario: "La notte non è finita, e al Maniero Castaldi Quintus Vael ti aspetta al portone di servizio."
    luogo: Quartieri Alti, il portone di servizio del Maniero Castaldi
    area: quartieri-alti
    ripetibile: true
    requisiti: [fazione.consiglio == 12, consiglio.notte >= 1]
    testo: |
      Il portone di servizio del Maniero è socchiuso, con un cuneo di legno sotto il battente perché non
      sbatta. Il cuneo è tagliato da poco, e il legno sul taglio è ancora chiaro. Quintus Vael ci sta
      appoggiato con una spalla e guarda i tetti, e quando arrivi non ti chiede dove sei stat{o|a}. Ti allunga
      una lanterna cieca con lo sportello già chiuso. La latta è tiepida, e dalle fessure dello sportello esce
      un filo di odore di sego.
    opzioni:
      - testo: "Rientrare con Quintus"
        descrizione: "La ladra è ancora dentro, o ci è tornata. Si ricomincia dal cortile."
        esito:
          titolo: Il cuneo sotto la porta
          testo: |
            Nel cortile il fico muove le foglie anche se non c'è vento, e tu ti tiri su il bavero senza sapere
            perché. Quintus ti dice a mezza voce che Brem fa il giro delle terrazze e che le porte chiuse sono
            ancora chiuse, per quanto ne sa lui. Poi ti indica il buio con il mento e se ne va dall'altra
            parte del cortile, e i suoi passi sulle lastre si sentono fino all'ultimo.
          vai: consiglio-maniero-di-notte

  # ------------------------------------------------------------ 0 · il cortile e il pianterreno
  - id: consiglio-notte-il-fico
    immagine: fazioni/famiglia-castaldi
    titolo: Il fico del cortile
    sommario: "Il fico antico in mezzo al cortile ha una corda annodata fra i rami più alti."
    luogo: Il Maniero Castaldi, il cortile interno
    area: consiglio-maniero-di-notte
    ripetibile: true
    requisiti: [profondita.consiglio-maniero-di-notte == 0]
    testo: |
      Il cortile interno è un quadrato di lastre chiare con il fico antico nel mezzo. Le radici hanno
      sollevato le lastre intorno al tronco, e due sono spaccate di netto lungo la venatura della pietra.
      Intorno al tronco contorto c'è una panchina di legno che il fico si sta mangiando anno dopo anno, e dai
      rami più alti, dove la chioma tocca il cornicione, pende una corda sottile piena di nodi. I nodi stanno
      a un palmo l'uno dall'altro, alla misura di una mano piccola.

      {origine rampollo-dei-quartieri-alti} Nei manieri dei Quartieri Alti l'albero del cortile è il primo che
      i bambini imparano ad arrampicare, e da piccol{o|a} anche tu sei uscit{o|a} di casa da un ramo così.

      Sotto il fico la terra è smossa in due punti, e un piede leggero ha schiacciato una foglia contro la
      panchina.
    opzioni:
      - testo: "Leggere le tracce sotto l'albero"
        descrizione: "La corda dice dove è salita. La terra smossa forse dice dove voleva andare."
        prova: { attributo: mentale, abilita: percezione, difficolta: Media }
        successo:
          titolo: La punta del piede
          testo: |
            Le impronte sono di una scarpa morbida senza tacco, e affondano di punta, come si cammina quando
            si conta di non fare rumore. Vanno dalla corda alla grata del seminterrato e non tornano indietro.
            La grata ha un lucchetto chiuso e una sbarra appena piegata, e dove il ferro si è piegato la
            ruggine è saltata via in scaglie. Tu ci passi accanto con la gola stretta e scendi la scaletta dei
            magazzini.
          effetti: { profondita.consiglio-maniero-di-notte: 1 }
        fallimento:
          titolo: Le foglie
          testo: |
            Ti chini sulla terra smossa e ci metti la lanterna troppo vicino, e lo sportello si apre di uno
            spiraglio. La luce sale lungo il tronco fino alla chioma. Lassù qualcosa si ferma. Poi la corda
            sale da sola fra i rami, un nodo dopo l'altro, e sparisce oltre il cornicione.
          effetti: { consiglio.gazza: 1 }
      - testo: "Salire sul fico fino al cornicione"
        descrizione: "La corda l'ha messa lei. Dall'alto si vede il cortile intero, e forse anche dove è andata."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Media }
        successo:
          titolo: Il cornicione
          testo: |
            Sali dalla parte del tronco dove la corteccia è liscia di mani, e i rami del fico reggono più di
            quanto promettono. Dal cornicione vedi il cortile a picco e la finestra della cucina con la sua
            luce bassa. Sulla corda, all'ultimo nodo, è infilata fra i trefoli una piuma grigia e bianca. La
            canapa è secca e pulita, comprata da poco. Tasti la piuma fra le dita e poi scendi dall'altra
            parte verso la porta della cucina, con le mani che sanno di linfa.
          effetti: { profondita.consiglio-maniero-di-notte: 1 }
        fallimento:
          titolo: Il ramo secco
          testo: |
            A metà salita metti il piede su un ramo che ha deciso di morire proprio stanotte, e scendi molto
            più in fretta di quanto eri salit{o|a}. Atterri sulla panchina mangiata dal fico con un colpo che
            si sente in tutto il cortile, e una foglia larga ti cade in faccia subito dopo. Quintus si
            affaccia da una porta a guardarti, poi si ritira senza dire niente.
          effetti: { consiglio.gazza: 1, ferite: 0.5 }
      - testo: "Fare il giro lungo del portico"
        descrizione: "Sotto il portico si passa senza toccare l'albero. Ci si mette più tempo."
        costo: 2
        esito:
          titolo: Il portico
          testo: |
            Giri intorno al cortile sotto il portico una colonna alla volta, e ti fermi ogni tanto ad
            ascoltare. Le colonne sono di pietra chiara, e alla base sono scheggiate dai secchi e dalle scope
            di chi ci ha lavato intorno per generazioni. Le finestre del primo piano sono buie, e in una c'è
            il riflesso del fico che si muove. Quando arrivi alla porta della cucina sono passati molti
            minuti, e il fico da quella parte non ha più la corda.
          effetti: { profondita.consiglio-maniero-di-notte: 1, consiglio.gazza: 1 }

  - id: consiglio-notte-la-cucina-dei-segnali
    immagine: fazioni/famiglia-castaldi
    titolo: La cucina dei segnali muti
    sommario: "Eolio Drest è in piedi in cucina in camicia da notte, e alla servitù parla soltanto con le mani."
    luogo: Il Maniero Castaldi, la cucina
    area: consiglio-maniero-di-notte
    ripetibile: true
    requisiti: [profondita.consiglio-maniero-di-notte == 0]
    testo: |
      La cucina è l'unica stanza del pianterreno con il fuoco acceso. Il camino è largo quanto una porta di
      stalla, e le braci sono coperte a metà di cenere perché non facciano fiamma alta. Intorno al tavolo
      grande quattro servitori in camicia da notte stanno svegli e zitti. Davanti al camino c'è il maggiordomo
      Eolio Drest, con il campanello di bronzo alla cintura e il batacchio legato con un giro di spago perché
      non suoni. Muove le dita, e una ragazza va a chiudere un'imposta senza che lui abbia detto una parola.

      {empatia Media fallita} Ti sembrano tranquilli finché la ragazza dell'imposta non torna al tavolo e si
      stringe le mani fra le ginocchia.

      Fra le tazze c'è un piatto di biscotti intatto, e il latte nelle tazze ha già fatto la pelle.
    opzioni:
      - testo: "Chiedere a Eolio che cosa ha visto la servitù"
        descrizione: "Se qualcuno ha visto passare la ladra, Eolio lo sa già. Bisogna chiederlo nel modo giusto."
        prova: { attributo: sociale, abilita: galateo, difficolta: Media }
        successo:
          titolo: Tre dita sul polso
          testo: |
            Aspetti che Eolio abbia finito il suo segnale e gli chiedi a voce bassa, con un mezzo inchino, se
            la casa ha notato visite. Lui si tocca il polso con tre dita, e la lavandaia risponde per lui.
            Dice che la porta del seminterrato l'ha chiusa lei alla sera e che adesso è aperta. Eolio ti
            accompagna fino alla scala dei magazzini e ti tiene la porta con la stessa cura con cui la
            terrebbe a un ospite. Dal fondo della scala sale l'odore asciutto della farina.
          effetti: { profondita.consiglio-maniero-di-notte: 1 }
        fallimento:
          titolo: La voce alta
          testo: |
            Fai la domanda a voce normale, e in quella cucina zitta suona come un grido. I servitori si
            voltano tutti insieme, e una sedia striscia sulla pietra. Eolio ti risponde con un cenno minuscolo
            verso il soffitto che non capisci, e il campanello alla sua cintura dondola senza suonare. Prima
            che tu possa chiedere di nuovo da qualche parte sopra le vostre teste si chiude una porta.
          effetti: { consiglio.gazza: 1 }
      - testo: "Sederti con la ragazza dell'imposta"
        descrizione: "È la più spaventata della cucina, e chi ha paura di solito ha visto qualcosa."
        prova: { attributo: sociale, abilita: empatia, difficolta: Media }
        successo:
          titolo: Il biscotto
          testo: |
            Ti siedi accanto a lei e le passi un biscotto dal piatto, e lei lo tiene in mano senza mangiarlo
            finché non le si sbriciola fra le dita. Ti racconta a pezzi che è scesa a prendere l'acqua e ha
            visto una donna vestita di grigio nel corridoio della dispensa, ferma come un attaccapanni. La
            donna le ha messo un dito sulle labbra, e lei è tornata su. Eolio ascolta senza muovere le mani, e
            alla fine ti indica la porta della dispensa, che dà sul seminterrato.
          effetti: { profondita.consiglio-maniero-di-notte: 1 }
        fallimento:
          titolo: Il piatto intatto
          testo: |
            Ti siedi accanto alla ragazza e le chiedi che cosa ha visto, e lei scoppia a piangere senza
            rumore, con la faccia nelle mani e le spalle che tremano sotto la camicia da notte. Eolio fa un
            segnale, e una cuoca le mette un braccio intorno alle spalle e ti guarda male. Esci dalla cucina
            con la sensazione di aver calpestato qualcosa, e con la notte che intanto va avanti.
          effetti: { consiglio.gazza: 1 }
      - testo: "Scendere per la scala di servizio senza disturbare"
        descrizione: "La cucina ha una scala che porta ai magazzini. Ci si arriva girando largo intorno alla servitù."
        costo: 2
        esito:
          titolo: La scala di servizio
          testo: |
            Fai un cenno a Eolio e giri intorno al tavolo rasente al muro, fino alla scaletta di servizio. È
            stretta, con i gradini di pietra consumati al centro, e scende a gomito verso il buio dei
            magazzini. Dopo il gomito l'aria si fa fresca e porta l'odore della farina. A metà ti fermi due
            volte perché ti sembra di sentire un passo sotto di te, e la seconda volta è il tuo cuore.
          effetti: { profondita.consiglio-maniero-di-notte: 1, consiglio.gazza: 1 }

  - id: consiglio-notte-il-portone
    immagine: fazioni/famiglia-castaldi
    titolo: Il portone delle bilance
    sommario: "Il portone principale è sprangato dall'interno, eppure la spranga è stata sollevata e rimessa a posto."
    luogo: Il Maniero Castaldi, l'atrio
    area: consiglio-maniero-di-notte
    ripetibile: true
    requisiti: [profondita.consiglio-maniero-di-notte <= 1]
    testo: |
      L'atrio è una sala alta e spoglia con il pavimento a scacchi e una panca lungo il muro, dove i
      visitatori aspettano che Marella li chiami. Gli scacchi sono di marmo bianco e di ardesia, e quelli
      davanti alla panca sono opachi di suole. Il portone di quercia ha le bilance intagliate sull'architrave,
      e dall'interno lo chiude una spranga di ferro. Sotto la spranga ci sono due granelli di ruggine freschi.

      {tecnologia Media} I ganci sono graffiati sotto, perché qualcuno ha sollevato la spranga con una leva
      sottile infilata fra i battenti e poi l'ha rimessa giù con calma. I graffi sono lucidi nel ferro scuro e
      non hanno ancora preso la ruggine.

      {origine figlio-della-citta-bassa} Una spranga sollevata da fuori e rimessa a posto da dentro è un
      lavoro da professionisti.

      Sul cuscino ricamato della panca qualcuno si è seduto da poco, perché la piuma non si è ancora rialzata.
    opzioni:
      - testo: "Esaminare la spranga e i ganci"
        descrizione: "Se è entrata di qui, lo dicono i graffi. Forse dicono anche con che cosa."
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Media }
        successo:
          titolo: La leva sottile
          testo: |
            Passi il pollice sotto i ganci e trovi la scheggia di una lama sottile e piatta, spezzata nello
            sforzo. L'acciaio è buono, temperato fino al blu. Una ladra che lascia pezzi dei suoi attrezzi ha
            avuto fretta, almeno una volta. Ti infili la scheggia nella cintura e prendi la porta che
            dall'atrio scende verso i magazzini, dove i granelli di ruggine continuano a due a due sul
            pavimento.
          effetti: { profondita.consiglio-maniero-di-notte: 1 }
        fallimento:
          titolo: La spranga
          testo: |
            Sollevi la spranga per guardare sotto i ganci, e la spranga è più pesante di quanto sembra. Ti
            scivola di mano e batte contro il battente con un colpo che rimbomba nell'atrio e poi su per la
            scala. Da qualche parte un cane si sveglia e abbaia, una volta sola. Rimetti la spranga a posto
            con le dita che pulsano.
          effetti: { consiglio.gazza: 1 }
      - testo: "Sederti sulla panca e ascoltare la casa"
        descrizione: "Dalla panca dei visitatori si sentono tutte le porte del pianterreno. Basta stare zitti."
        prova: { attributo: mentale, abilita: [percezione, resilienza], difficolta: Media }
        successo:
          titolo: La panca dei visitatori
          testo: |
            Ti siedi sul cuscino ricamato e stai ferm{o|a} finché il Maniero non smette di farsi notare. Le
            travi si assestano con un colpo secco ogni tanto, come fanno quando la notte rinfresca, e il fico
            gratta una grondaia. Poi più in basso una porta del seminterrato si apre e non si richiude. Ti
            alzi senza far rumore e vai verso quella porta, con il cuscino che si rialza piano alle tue
            spalle.
          effetti: { profondita.consiglio-maniero-di-notte: 1 }
        fallimento:
          titolo: I rumori di una casa vecchia
          testo: |
            Ascolti la casa, e una casa vecchia di notte fa troppi rumori. Ogni trave che scricchiola ti
            sembra un passo, e ogni passo ti sembra la ladra. Quando ti alzi hai le gambe intorpidite e
            nessuna idea di dove andare, e dal cortile Quintus ti fa segno di sbrigarti.
          effetti: { consiglio.gazza: 1 }
      - testo: "Controllare a una a una le porte dell'atrio"
        descrizione: "Sono sei, e ognuna va aperta piano. È lento, ma non si sbaglia."
        costo: 2
        esito:
          titolo: Sei porte
          testo: |
            Apri le porte dell'atrio una dopo l'altra e piano, con la mano sulla maniglia finché lo scatto non
            è passato. Trovi un guardaroba pieno di mantelli che odorano di pioggia e uno stanzino con le
            scope. L'ultima porta dà sulla scala dei magazzini, e dal fondo sale l'odore della farina con
            un'aria più fredda di quella dell'atrio.
          effetti: { profondita.consiglio-maniero-di-notte: 1, consiglio.gazza: 1 }

  # ------------------------------------------------------------ 1 · il seminterrato
  - id: consiglio-notte-i-sacchi-di-laresh
    immagine: ambientazione/laresh
    titolo: I sacchi di Laresh
    sommario: "Nel magazzino del grano, fra i sacchi arrivati da Laresh, c'è un'impronta nella farina."
    luogo: Il Maniero Castaldi, il magazzino del grano
    area: consiglio-maniero-di-notte
    ripetibile: true
    requisiti: [profondita.consiglio-maniero-di-notte == 1]
    testo: |
      Il magazzino del grano è una volta bassa di mattoni, con i sacchi di Laresh impilati fino al soffitto,
      ognuno con il marchio della casata. I mattoni sono umidi, e fra le giunture la calce si sfarina di
      salnitro. La polvere bianca ti si posa sulle ciglia. Fra le pile un topo rosicchia la tela, e quando
      alzi la lanterna smette. In fondo un sacco è scivolato e si è aperto, e sulla farina sparsa c'è
      un'impronta nitida di scarpa morbida senza tacco.

      {percezione Facile} L'impronta va verso la scala dei piani nobili, e sul terzo gradino c'è un granello
      di farina. La ladra ha fretta, o il sacco l'ha sorpresa quanto te.
    opzioni:
      - testo: "Seguire l'impronta senza calpestarla"
        descrizione: "Dove va una scarpa morbida in un magazzino di grano? Basta guardare dove è stata messa la farina."
        prova: { attributo: mentale, abilita: percezione, difficolta: Media }
        successo:
          titolo: I granelli sui gradini
          testo: |
            Segui l'impronta di sacco in sacco chin{o|a} sulla farina, con la lanterna aperta appena. La ladra
            ha camminato sul bordo delle pile dove la farina non cade, e ha sbagliato soltanto al sacco
            aperto. I granelli salgono per la scala dei piani nobili sempre più radi, e sul legno dei gradini
            devi abbassare la lanterna per vederli. Li segui fino al primo pianerottolo, e lì finiscono contro
            uno zerbino sbattuto di fresco.
          effetti: { profondita.consiglio-maniero-di-notte: 1 }
        fallimento:
          titolo: Lo starnuto
          testo: |
            Ti chini sull'impronta, e la polvere vince. Lo starnuto rimbomba sotto la volta e solleva una
            nuvola bianca che si posa su tutto, impronta compresa. Nell'aria ferma del magazzino la nuvola ci
            mette molto a scendere. Quando si dirada hai la farina fino alle sopracciglia, e il pavimento è
            liscio come una tovaglia.
          effetti: { consiglio.gazza: 1 }
      - testo: "Contare i sacchi"
        descrizione: "Una ladra di carte non ruba grano. Però può aver nascosto qualcosa dove nessuno guarda."
        prova: { attributo: mentale, abilita: [politica-ed-economia, accademiche], difficolta: Media }
        successo:
          titolo: Il sacco in più
          testo: |
            Conti le pile con il dito, come si contano le righe di un registro, e una pila ha un sacco in più
            del marchio che porta. Il sacco in più è più leggero degli altri e cede sotto la mano. Dentro, al
            posto del grano, c'è una borsa di tela con una corda di ricambio e un pacchetto di pane secco, la
            ritirata che la ladra si era preparata. Lasci tutto dov'è e prendi la scala, con la soddisfazione
            di uno che ha trovato l'errore in fondo alla colonna.
          effetti: { profondita.consiglio-maniero-di-notte: 1 }
        fallimento:
          titolo: I conti sbagliati
          testo: |
            Conti le pile, e il conto torna. Lo rifai, e torna di nuovo, ma diverso. Alla terza volta ti
            accorgi che stai contando due volte i sacchi della fila di dietro, e che sopra la tua testa, sulla
            scala, una tavola ha appena scricchiolato.
          effetti: { consiglio.gazza: 1 }
      - testo: "Passare in fretta fra le pile"
        descrizione: "La polvere si posa su tutto. Meglio attraversare il magazzino senza fermarsi."
        costo: 2
        esito:
          titolo: La polvere bianca
          testo: |
            Attraversi il magazzino a passi lunghi e con la manica sul naso, fino alla scala. Quando ci arrivi
            hai la giubba bianca sulle spalle e un sapore di pane crudo in bocca, e la farina ti scricchiola
            fra i denti. Ti scuoti sul primo gradino, e la farina cade sui gradini come neve.
          effetti: { profondita.consiglio-maniero-di-notte: 1, consiglio.gazza: 1 }

  - id: consiglio-notte-la-porta-del-vino
    immagine: personaggi/quintus-vael
    titolo: La porta del vino
    sommario: "Davanti alla cantina del vino Brem Anthos dorme seduto per terra, e non dovrebbe."
    luogo: Il Maniero Castaldi, la cantina
    area: consiglio-maniero-di-notte
    ripetibile: true
    requisiti: [profondita.consiglio-maniero-di-notte == 1]
    testo: |
      La cantina del vino ha una porta di ferro chiodato, e stanotte la guardia di turno è Brem Anthos, il
      vice di Quintus. I chiodi hanno la testa larga e sono ribattuti dall'interno, e il ferro tiene il freddo
      della cantina anche da questa parte. Brem dorme per terra con la schiena contro il ferro e la testa
      sulla spalla, e accanto alla mano ha una tazza di latta rovesciata. Il vino colato dalla tazza si è
      seccato sulla pietra in una macchia scura.

      {medicina Media} Il respiro è troppo regolare per un uomo che dorme seduto. Nella tazza c'era qualcosa
      oltre al vino.

      {origine figlio-della-citta-bassa} Una tazza portata alla guardia con un sorriso è il primo trucco che
      insegnano nei vicoli.

      La chiave della cantina è ancora appesa alla cintura di Brem. Più avanti nel corridoio la scala sale
      verso i piani nobili.
    opzioni:
      - testo: "Svegliare Brem"
        descrizione: "Acqua fredda, sale sotto il naso, la mano sul polso. Se si sveglia, la ladra ha un nemico in più."
        prova: { attributo: mentale, abilita: medicina, difficolta: Media }
        successo:
          titolo: Due occhi rossi
          testo: |
            Sollevi la testa di Brem, gli bagni i polsi con l'acqua del secchio e gli schiacci un pizzico di
            sale sotto il naso. Brem tossisce e apre gli occhi rossi, con le pupille strette come capocchie di
            spillo. Ti racconta con la lingua impastata che la tazza gliel'ha portata una ragazza nuova della
            servitù. Si rimette in piedi appoggiandosi al muro e sale con te verso i piani nobili con la mano
            sull'elsa.
          pe: { medicina: 3 }
          effetti: { profondita.consiglio-maniero-di-notte: 1 }
        fallimento:
          titolo: Il sonno pesante
          testo: |
            Gli bagni i polsi e lo scuoti, e Brem apre gli occhi, ti guarda senza vederti e ti chiama con il
            nome di qualcun altro. Poi torna giù nel sonno con un sospiro contento, e la sua mano ti scivola
            dal braccio pesante e molle. Lo stendi sul fianco come si fa con gli ubriachi, mentre il tempo
            passa.
          effetti: { consiglio.gazza: 1 }
      - testo: "Annusare la tazza"
        descrizione: "Che cosa ha bevuto Brem dice chi gliel'ha dato, e da dove viene."
        prova: { attributo: mentale, abilita: [natura, medicina], difficolta: Media }
        successo:
          titolo: Papavero e miele
          testo: |
            Ti porti la tazza al naso. Sotto il vino c'è il dolce del miele e l'amaro del papavero, e sul
            fondo della latta è rimasto un deposito scuro e granuloso. È una dose da dormire fino all'alba
            senza fare danni. Chi l'ha preparata voleva la porta libera e la guardia viva. Lasci Brem a
            dormire con la testa su un sacco vuoto e prendi la scala, più tranquill{o|a} di prima e più
            preoccupat{o|a}.
          effetti: { profondita.consiglio-maniero-di-notte: 1 }
        fallimento:
          titolo: Il vino della casa
          testo: |
            Annusi la tazza e senti soltanto il vino della casa, buono, con un retrogusto che non riconosci.
            Ne bagni la punta della lingua per capirlo, e la lingua subito si fa insensibile. Per qualche
            minuto il corridoio si allunga e le pareti si fanno morbide. Quando torni in te sei sedut{o|a}
            accanto a Brem.
          effetti: { consiglio.gazza: 1, tormento: 1 }
      - testo: "Lasciarlo dormire e proseguire"
        descrizione: "Brem dorme, e la ladra intanto sale. Lo trovi Quintus, più tardi."
        costo: 2
        esito:
          titolo: La chiave alla cintura
          testo: |
            Sfili la chiave della cantina dalla cintura di Brem, perché non la prenda qualcun altro, e gli
            giri la testa in una posizione più comoda. Lui borbotta un ringraziamento a nessuno. La chiave è
            di ferro pieno e lunga quanto una mano. Sali la scala dei piani nobili con la chiave che ti batte
            contro il fianco a ogni gradino, e ogni gradino ti sembra il più rumoroso della casa.
          effetti: { profondita.consiglio-maniero-di-notte: 1, consiglio.gazza: 1 }

  # ------------------------------------------------------------ 2 · i piani nobili
  - id: consiglio-notte-lo-studio-di-aldous
    immagine: fazioni/famiglia-castaldi
    titolo: Lo studio di Aldous
    sommario: "Nello studio di Aldous Castaldi un cassetto della scrivania è stato forzato, e le carte sono in ordine sul piano."
    luogo: Il Maniero Castaldi, lo studio di Aldous
    area: consiglio-maniero-di-notte
    ripetibile: true
    requisiti: [profondita.consiglio-maniero-di-notte == 2]
    testo: |
      Lo studio di Aldous ha le finestre sulle terrazze e le pareti coperte di registri rilegati in tela
      grigia. Sui dorsi gli anni sono scritti a inchiostro in una colonna regolare, e la tela è lisa soltanto
      sui registri più recenti. Il cassetto di destra, quello con la serratura, è aperto di un dito, e sul
      piano qualcuno ha disposto le carte in file ordinate per leggerle con calma. Accanto alle carte c'è una
      lucerna spenta, e lo stoppino è ancora tiepido.

      {tecnologia Media} La serratura non è rotta. L'hanno aperta con due ferri e una pazienza da orologiaio,
      lasciando appena un graffio sul legno.

      Una finestra è socchiusa, e il vento delle terrazze muove le tende.
    opzioni:
      - testo: "Capire che cosa manca dal cassetto"
        descrizione: "Una ladra di carte lascia sul tavolo quello che non le serve. Quello che manca dice dove andrà."
        prova: { attributo: mentale, abilita: percezione, difficolta: Media }
        successo:
          titolo: La cartella grigia
          testo: |
            Il cassetto ha il fondo segnato da un rettangolo più chiaro, dove per anni è stata appoggiata una
            cartella. La cartella non c'è più, e con lei il bilancio che Aldous tiene da solo. Le obbligazioni
            firmate da Julia invece sono ancora qui, sotto il fondo doppio che la ladra non ha trovato in
            tempo. Il fondo si solleva con l'unghia da una tacca nell'angolo. Prendi le obbligazioni, e le tue
            dita le stringono più forte di quanto serva mentre esci verso le scale del terzo piano.
          effetti: { profondita.consiglio-maniero-di-notte: 1 }
        fallimento:
          titolo: Le carte in fila
          testo: |
            Sfogli le carte in fila sul piano una dopo l'altra, sperando di capire dall'ordine che cosa
            cercava. La carta è fredda e un po' molle per l'aria che entra dalla finestra. Arrivi in fondo con
            un contratto di affitto in mano e nessuna idea, e intanto dal soffitto arriva un passo leggero,
            uno solo, che va verso le terrazze.
          effetti: { consiglio.gazza: 1 }
      - testo: "Studiare la serratura forzata"
        descrizione: "Due ferri e un graffio. Chi apre così ha un suo modo di lavorare, e un suo modo di uscire."
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Media }
        successo:
          titolo: I ferri da orologiaio
          testo: |
            Ti chini sulla serratura con la lanterna. I graffi sono due, uguali ai lati della toppa, e dentro
            il nottolino c'è una goccia d'olio fresca. È olio chiaro e senza odore. La ladra ha oliato la
            serratura prima di aprirla, per non farla cantare. Una che lavora così esce dalla stessa strada da
            cui è entrata. La finestra socchiusa dà sulle terrazze e sui tetti, così esci da lì anche tu.
          effetti: { profondita.consiglio-maniero-di-notte: 1 }
        fallimento:
          titolo: Il cassetto che si chiude
          testo: |
            Tocchi il cassetto per guardare meglio la serratura, e il cassetto si richiude con uno scatto
            secco e pulito, come fanno i meccanismi appena oliati. Adesso è chiuso a chiave, e la chiave ce
            l'ha Aldous, che dorme due porte più in là e che stanotte non ha nessuna voglia di svegliarsi.
          effetti: { consiglio.gazza: 1 }
      - testo: "Uscire dalla finestra sulle terrazze"
        descrizione: "La finestra è socchiusa. Le terrazze sono strette, e scivolose di notte."
        costo: 2
        esito:
          titolo: Le terrazze
          testo: |
            Scavalchi il davanzale e cammini sulla terrazza con la schiena al muro, mentre sotto di te il
            cortile è un pozzo nero con il fico in fondo. La terrazza è larga quanto due piedi messi di
            traverso, e le lastre sono lisce di umido. Arrivi alla scala esterna del terzo piano con le mani
            bagnate di sudore freddo.
          effetti: { profondita.consiglio-maniero-di-notte: 1, consiglio.gazza: 1 }

  - id: consiglio-notte-la-sala-da-pranzo
    immagine: personaggi/marella-castaldi
    titolo: La sala da pranzo
    sommario: "Sulla tavola della sala da pranzo i segnaposto della cena di domani sono stati copiati su un foglio."
    luogo: Il Maniero Castaldi, la sala da pranzo
    area: consiglio-maniero-di-notte
    ripetibile: true
    requisiti: [profondita.consiglio-maniero-di-notte == 2]
    testo: |
      La sala da pranzo è già apparecchiata per la cena di domani, dopo la seduta. La tovaglia di lino ha
      ancora le pieghe del cassetto, e i bicchieri di cristallo sono allineati a filo con il bordo dei piatti.
      Sulla tovaglia i segnaposto di cartoncino sono disposti come una mappa del Consiglio, con le casate da
      una parte e gli altri seggi dall'altra. Accanto al piatto di capotavola c'è un foglio sottile dove
      qualcuno ha ricopiato a matita la disposizione della tavola.

      {galateo Media} Marella mette i nemici a un posto di distanza e gli indecisi vicino al vino. Chi ha
      copiato la tavola sa leggere anche questo.

      {origine rampollo-dei-quartieri-alti} A tavole così ti mettevano sempre in fondo fra i figli delle altre
      casate, e da lì si vedeva benissimo chi parlava con chi.
    opzioni:
      - testo: "Leggere la copia della tavola"
        descrizione: "A che cosa serve a una ladra la disposizione di una cena? Dipende da chi la paga."
        prova: { attributo: mentale, abilita: [accademiche, politica-ed-economia], difficolta: Media }
        successo:
          titolo: I nomi a matita
          testo: |
            La copia è esatta, con i nomi giusti e i posti giusti. La matita ha calcato tanto che sul rovescio
            del foglio i nomi si leggono in rilievo. Sopra tre nomi c'è una crocetta, quelli degli indecisi
            vicino al vino. Chi la paga vuole sapere su chi lavorare prima della seduta, e da chi Marella si
            aspetta il voto. Pieghi il foglio e te lo metti in tasca, e intanto senti un fruscio sulla scala
            del terzo piano, dove la casa diventa tetto.
          effetti: { profondita.consiglio-maniero-di-notte: 1 }
        fallimento:
          titolo: La matita
          testo: |
            Ti metti a leggere il foglio, e la grafia è così minuta che devi avvicinare la lanterna. Ti
            accorgi solo dopo che la luce passa dalle finestre della sala, e sul vetro nero vedi la fiamma e
            la tua faccia come le vede chi sta fuori. Lassù sulle terrazze qualcosa cambia direzione e se ne
            va verso il tetto.
          effetti: { consiglio.gazza: 1 }
      - testo: "Rimettere a posto i segnaposto spostati"
        descrizione: "Mentre copiava, la ladra ne ha toccati alcuni. Chi conosce le tavole sa dove ha messo le mani."
        prova: { attributo: sociale, abilita: galateo, difficolta: Media }
        successo:
          titolo: Il posto di Marella
          testo: |
            Tre segnaposto sono girati di un dito, come succede quando li si solleva per leggerli, e sul bordo
            hanno una traccia grigia di polpastrelli. Li rimetti dritti, e sotto l'ultimo trovi una piuma
            grigia e bianca, uguale a quella della corda del fico. La ladra se l'è lasciata dietro chinandosi.
            Esci dalla sala dalla porta della servitù, quella che porta alla scala del terzo piano.
          effetti: { profondita.consiglio-maniero-di-notte: 1 }
        fallimento:
          titolo: Il bicchiere
          testo: |
            Allunghi la mano verso un segnaposto e urti un bicchiere di cristallo, che tintinna contro il
            vicino e poi contro quello dopo, in una fila di note acute lungo tutta la tavola. Li fermi con il
            palmo aperto. Quando la sala torna zitta resti ferm{o|a} con la mano sui cristalli, ad ascoltare
            se qualcuno di sopra ha sentito.
          effetti: { consiglio.gazza: 1 }
      - testo: "Attraversare la sala senza toccare niente"
        descrizione: "La tavola di Marella si guarda e non si tocca. La porta della servitù è in fondo."
        costo: 2
        esito:
          titolo: In punta di piedi
          testo: |
            Giri intorno alla tavola tenendoti a un braccio dalla tovaglia, e i segnaposto ti scorrono accanto
            con i loro nomi scritti in bella. La porta della servitù cigola appena sui cardini. Dietro c'è la
            scaletta stretta che sale fra le travi del terzo piano, dove già si sente il vento sul rame.
          effetti: { profondita.consiglio-maniero-di-notte: 1, consiglio.gazza: 1 }

  # ------------------------------------------------------------ 3 · fra i tetti di rame
  - id: consiglio-notte-la-stanza-dei-nipoti
    immagine: fazioni/famiglia-castaldi
    titolo: La stanza dei nipoti
    sommario: "Al terzo piano Vesper e Mira sono svegli sotto le coperte, con la candela accesa. Hanno visto passare qualcuno."
    luogo: Il Maniero Castaldi, il terzo piano
    area: consiglio-maniero-di-notte
    ripetibile: true
    requisiti: [profondita.consiglio-maniero-di-notte == 3]
    testo: |
      La stanza dei nipoti è ricavata sotto il tetto, con le travi a vista, due letti uno di fronte all'altro
      e una candela accesa in un piattino sul pavimento. La candela è consumata quasi fino in fondo, e la cera
      colata ha riempito il piattino fino all'orlo. Vesper e Mira stanno seduti sullo stesso letto con la
      coperta tirata fino al naso. Dalla finestrella aperta sul tetto entra il vento che fa suonare il rame, e
      a ogni raffica la fiamma si piega verso i letti.

      Mira ti guarda con gli occhi seri della zia e non dice niente. Vesper indica la finestrella con il
      mento, come fa Quintus.

      {intimidire Media fallita} Ti viene da chiedere in fretta e a voce alta come ai testimoni, ma la voce
      alta manderebbe due bambini sotto il cuscino.
    opzioni:
      - testo: "Sederti sul letto e chiedere piano"
        descrizione: "Vesper vuole raccontare, Mira vuole capire se ti può credere."
        prova: { attributo: sociale, abilita: empatia, difficolta: Media }
        successo:
          titolo: La signora grigia
          testo: |
            Ti siedi sul bordo del letto e chiedi a Mira se ha visto un fantasma, e lei scuote la testa con un
            disprezzo da adulta. Era una signora vestita di grigio, ti spiega Vesper, che è passata dalla
            finestrella con una cartella sotto il braccio e si è messa un dito sulle labbra. Mira aggiunge che
            è andata verso il camino grande. Le rimbocchi la coperta, e lei te lo lascia fare.
          effetti: { profondita.consiglio-maniero-di-notte: 1 }
        fallimento:
          titolo: Il cuscino
          testo: |
            Chiedi a Vesper che cosa ha visto, e Vesper guarda la sorella, e la sorella guarda te. Nessuno dei
            due parla. Dopo un poco Mira soffia sulla candela e si gira contro il muro. Il fumo dello stoppino
            sale dritto finché il vento della finestrella non lo spezza, e nel buio Vesper ti chiede se puoi
            andare via, per favore.
          effetti: { consiglio.gazza: 1 }
      - testo: "Chiedere in fretta, come a un testimone"
        descrizione: "Non c'è tempo per le favole. La ladra è sul tetto adesso."
        prova: { attributo: sociale, abilita: intimidire, difficolta: Difficile }
        successo:
          titolo: Due voci insieme
          testo: |
            Chiedi chi hanno visto e da che parte è andata, una domanda dopo l'altra, e i bambini rispondono
            insieme e uno sopra l'altro, prima di decidere se avere paura di te. Una signora grigia, verso il
            camino grande. Esci dalla finestrella mentre dietro di te Mira comincia a piangere con molta
            dignità.
          effetti: { profondita.consiglio-maniero-di-notte: 1 }
        fallimento:
          titolo: Il pianto
          testo: |
            Alla prima domanda Vesper scoppia a piangere, e Mira lo segue per solidarietà, più forte. Dal
            piano di sotto Marella chiama i figli per nome, e le porte si aprono una dopo l'altra lungo il
            corridoio. Sul tetto chi ascoltava sa esattamente dove sei.
          effetti: { consiglio.gazza: 1, scandalo: 1 }
      - testo: "Mandarli a dormire nella stanza dei genitori e uscire sul tetto"
        descrizione: "Prima i bambini al sicuro, poi la ladra. Ci vuole qualche minuto."
        costo: 2
        esito:
          titolo: Il corridoio dei genitori
          testo: |
            Prendi Mira in braccio e Vesper per mano e li accompagni giù per il corridoio fino alla porta dei
            genitori, dove Marella li tira dentro senza una domanda. Poi torni su per la finestrella e metti
            il piede sul rame freddo e ruvido di vecchio, con il vento che ti gonfia la giubba.
          effetti: { profondita.consiglio-maniero-di-notte: 1, consiglio.gazza: 1 }

  - id: consiglio-notte-il-lucernario
    immagine: fazioni/famiglia-castaldi
    titolo: Il lucernario
    sommario: "Il lucernario sopra la scala grande è aperto, e sul vetro c'è il segno di una mano."
    luogo: Il Maniero Castaldi, sotto il lucernario
    area: consiglio-maniero-di-notte
    ripetibile: true
    requisiti: [profondita.consiglio-maniero-di-notte == 3]
    testo: |
      In cima alla scala grande uno dei vetri del lucernario piombato è sollevato sul cardine. Dall'apertura
      scende l'aria fredda della notte, e il vento sul rame da quella parte si sente più forte. Sul vetro
      accanto, appannato, c'è l'impronta di una mano piccola con le dita aperte, e sul corrimano c'è un
      graffio fresco, chiaro nel legno scuro e lucidato dalle mani.

      {acrobazia Media} Dal corrimano al bordo del lucernario c'è un salto lungo quanto un uomo, e sotto il
      corrimano la tromba delle scale scende per tre piani nel buio. Chi l'ha fatto sapeva atterrare sulle
      mani senza rumore.

      {origine figlio-della-citta-bassa} Le ladre di città entrano dal basso ed escono dall'alto, perché chi
      insegue guarda sempre le porte. L'hai imparato da ragazz{o|a}, inseguendo un ladro di pane.
    opzioni:
      - testo: "Saltare dal corrimano al lucernario"
        descrizione: "Lei l'ha fatto. Tu hai le scarpe sbagliate e meno pratica."
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Media }
        successo:
          titolo: Il bordo del vetro
          testo: |
            Sali in piedi sul corrimano, conti fino a tre e salti. Le mani trovano il bordo di piombo e i
            piedi pedalano nel vuoto sopra la tromba delle scale. Poi sei fuori, in ginocchio sul rame freddo
            con le ginocchia che bruciano e sui palmi una polvere grigia e grassa di piombo. Nel buio, verso
            il camino grande, qualcosa si sposta.
          effetti: { profondita.consiglio-maniero-di-notte: 1 }
        fallimento:
          titolo: La tromba delle scale
          testo: |
            Salti, e le dita scivolano sul piombo umido. Resti appes{o|a} sopra la tromba delle scale con le
            gambe nel vuoto, e senti il bordo di piombo piegarsi sotto le dita. Allora ti lasci cadere sul
            pianerottolo con un tonfo che sveglia mezzo piano. Ti rialzi con un polso che pulsa.
          effetti: { consiglio.gazza: 1, ferite: 0.5 }
      - testo: "Leggere l'impronta sul vetro"
        descrizione: "Una mano piccola, le dita aperte. Si è appoggiata per guardare dentro, o per guardare fuori."
        prova: { attributo: mentale, abilita: percezione, difficolta: Media }
        successo:
          titolo: Le dita aperte
          testo: |
            L'impronta ha il pollice verso il cortile e le dita verso la strada, e il palmo è largo appena
            quanto la metà del tuo. La ladra si è appoggiata per guardare fuori, verso il camino grande e il
            tetto della casa vicina, la strada di uscita. Sali dalla scaletta di servizio e sbuchi sul tetto
            dalla parte giusta.
          effetti: { profondita.consiglio-maniero-di-notte: 1 }
        fallimento:
          titolo: Il fiato sul vetro
          testo: |
            Ti avvicini troppo, e il tuo fiato appanna il vetro e cancella l'impronta. Il vetro torna
            trasparente piano, e dell'impronta non resta niente. Resti a guardarlo con la faccia di uno che ha
            appena rovesciato il calamaio sulla pagina giusta.
          effetti: { consiglio.gazza: 1 }
      - testo: "Prendere la scaletta di servizio fino al tetto"
        descrizione: "C'è una botola per gli spazzacamini, in fondo al corridoio. È lontana."
        costo: 2
        esito:
          titolo: La botola degli spazzacamini
          testo: |
            Percorri il corridoio fino in fondo, dove una scala a pioli sale verso una botola annerita di
            fuliggine. Ogni piolo ti lascia sulle mani una riga nera. La botola resiste, poi cede con un colpo
            di spalla. Esci sul tetto con la faccia nera fino agli occhi e il rame che ti scotta di freddo
            sotto i palmi.
          effetti: { profondita.consiglio-maniero-di-notte: 1, consiglio.gazza: 1 }

  # ------------------------------------------------------------ il cuore · sui tetti di rame
  - id: consiglio-sui-tetti-di-rame
    immagine: fazioni/famiglia-castaldi
    titolo: Sui tetti di rame
    sommario: "Sul tetto del Maniero, fra i comignoli, una donna vestita di grigio si volta a guardarti."
    luogo: Il Maniero Castaldi, i tetti di rame
    area: consiglio-maniero-di-notte
    requisiti: [fazione.consiglio == 12, profondita.consiglio-maniero-di-notte >= 4]
    testo: |
      I tetti di rame del Maniero scendono ripidi verso il cortile e verso la strada, con il camino grande in
      mezzo ai comignoli. Le lastre sono inchiodate a scaglie sulle travi, e la guazza della notte le copre di
      un velo sottile che sotto la suola non fa presa. Oltre il cornicione comincia il tetto della casa
      vicina, dopo tre passi lunghi di vuoto.

      Accanto al camino grande c'è Nives Orsat, la Gazza. È vestita di grigio e ha un coltello corto per mano,
      con le lame tenute basse lungo le cosce. Sul bordo verso la strada un ragazzo tiene pronta una scala di
      corda, con i due ganci di ferro già fissati alla pietra del cornicione. Se la cartella grigia di Aldous
      è già sua, lei la porta a tracolla dietro la schiena. Se non lo è, glielo leggi nella fretta con cui
      guarda il lucernario alle tue spalle.

      {armi-da-distanza Media} Il punto debole è il ragazzo, che sta sul bordo con il peso sui talloni. Senza
      la scala a lei resta solo il salto verso il tetto vicino, e con la guazza sul rame è un salto che si
      sbaglia.

      {conoscenze-della-strada Media} Una ladra di carte lavora a prezzo fisso, e il prezzo copre la strada di
      uscita. Se la strada costa più del previsto, il contratto si può ridiscutere.

      Dal cortile sale il passo di Quintus sul selciato, e poi si ferma sotto la grondaia. Invece di scappare,
      la Gazza aspetta di vedere che cosa farai.
    opzioni:
      - testo: "Affrontarla sui tetti"
        descrizione: "La Gazza e il ragazzo con la scala, sul rame bagnato. Lei è veloce, e tu sei stanc{o|a}."
        quando: [consiglio.gazza < 3, consiglio.ettore != 3]
        combattimento: consiglio-la-gazza-sui-tetti
        vittoria:
          titolo: La cartella grigia
          testo: |
            Il ragazzo scappa giù per la scala di corda appena la Gazza scivola sul rame. Lei resta sul bordo
            del tetto aggrappata a un comignolo con un braccio, e il coltello le cade nel cortile con un
            tintinnio sul selciato. Ti allunga la cartella prima che tu la chieda. Quintus la porta giù per la
            botola degli spazzacamini, legata con la sua stessa corda, e lei si sfila i guanti per fartene
            dono con una smorfia da giocatrice che paga il debito di una partita. Sono guanti di pelle
            sottile, con le punte delle dita consumate fino alla trama.
          effetti: { fazione.consiglio: 1, consiglio.voti: 1, rep.castaldi: 1, oggetto.consiglio-guanti-della-gazza: 1 }
          imposta: { consiglio.carte: 1 }
          vai: quartieri-alti
        sconfitta:
          titolo: Il salto
          testo: |
            Il ragazzo ti tiene impegnat{o|a} con il coltello quanto basta, e quando ti volti la Gazza ha già
            saltato leggera sul tetto vicino con la cartella sulla schiena. Ti lascia un taglio sul braccio e
            un inchino dall'altra parte del vuoto. Quintus ti trova sedut{o|a} contro i mattoni ancora tiepidi
            del camino grande e ti fascia il braccio senza una parola. Sotto di te nella casa le luci si
            accendono a una a una.
          effetti: { fazione.consiglio: 1 }
          imposta: { consiglio.carte: 2 }
          vai: quartieri-alti
      - testo: "Affrontarla sui tetti, con Ettore"
        descrizione: "Stanotte Ettore Castaldi dorme al Maniero."
        quando: [consiglio.gazza < 3, consiglio.ettore == 3]
        combattimento: consiglio-la-gazza-da-sola
        vittoria:
          titolo: Due contro una
          testo: |
            Ettore si mette fra il ragazzo e la scala di corda, e il ragazzo decide in fretta che non ne vale
            la paga. Tu e la Gazza restate da soli sul rame e girate intorno al camino grande, finché lei non
            scivola e si aggrappa al comignolo. Ti allunga la cartella, poi si sfila i guanti e te li porge
            con le due mani, come si paga una partita persa.

            All'alba Ettore beve il tè di Eolio in cucina, sobrio, con i piedi nudi sul pavimento freddo.
            Aldous rimette la cartella nel cassetto e gira la chiave due volte, senza riuscire a dire grazie a
            nessuno dei due.
          effetti: { fazione.consiglio: 1, consiglio.voti: 1, rep.castaldi: 1, oggetto.consiglio-guanti-della-gazza: 1 }
          imposta: { consiglio.carte: 1 }
          vai: quartieri-alti
        sconfitta:
          titolo: Il tetto vicino
          testo: |
            Ettore tiene il ragazzo, ma la Gazza tiene te. Quando scivoli sul rame bagnato lei è già in volo
            verso il tetto vicino con la cartella sulla schiena. Atterra sulle mani senza un rumore e sparisce
            dietro un comignolo. Ettore ti tira su per il bavero, ti guarda il taglio sulla fronte e dice che
            ne ha visti di peggio, e non è chiaro se parli del taglio o di te.
          effetti: { fazione.consiglio: 1 }
          imposta: { consiglio.carte: 2 }
          vai: quartieri-alti
      - testo: "Inseguirla fra i tetti"
        descrizione: "Ha già le carte e corre verso il tetto vicino. Se la raggiungi prima del salto, se ne riparla."
        quando: [consiglio.gazza >= 3]
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Difficile }
        successo:
          titolo: Il comignolo
          testo: |
            La Gazza salta sul tetto vicino e tu salti dietro di lei. Atterri con un ginocchio sul colmo e una
            mano sul suo mantello, e qui le tegole sono di cotto ruvido che finalmente tiene. Lei si libera
            con uno strattone, ma deve fermarsi contro un comignolo con la cartella stretta al petto e il
            ragazzo della scala che arriva di corsa alle sue spalle. Siete di nuovo faccia a faccia, e
            stavolta è lei a cercare una via con gli occhi.
          imposta: { consiglio.gazza: 2 }
        fallimento:
          titolo: La grondaia
          testo: |
            Corri e scivoli, e il rame ti porta giù per la falda fino alla grondaia, che ti ferma con un colpo
            alle costole. La grondaia è di piombo e si piega di un dito sotto il tuo peso, poi regge. Quando
            alzi la testa la Gazza è già sul tetto vicino, una sagoma grigia contro il cielo, e poi nemmeno
            quella. Quintus ti tira su dalla grondaia per la cintura e guarda il tetto vuoto a lungo, con la
            mascella serrata.
          effetti: { fazione.consiglio: 1, ferite: 1 }
          imposta: { consiglio.carte: 2 }
          vai: quartieri-alti
      - testo: "Pagarla più del suo mandante"
        descrizione: "Una ladra a prezzo fisso può cambiare cliente, se il nuovo paga meglio e subito. Bisogna convincerla che la strada di uscita è chiusa."
        quando: [consiglio.gazza < 3]
        requisiti: [monete >= 60]
        prova: { attributo: sociale, abilita: [persuasione, conoscenze-della-strada], difficolta: Difficile }
        successo:
          titolo: Il contratto nuovo
          testo: |
            Le dici che Quintus ha un uomo sul tetto vicino, che è vero da un minuto, e che il suo mandante
            non la tirerà fuori dalle celle della Caserma. Poi le mostri la borsa. La Gazza la soppesa con lo
            sguardo e fa un cenno al ragazzo, che sgancia la scala di corda e la ritira arrotolata sul
            braccio. Ti dà la cartella e prende la borsa. Esce dalla botola degli spazzacamini scortata da
            Quintus, con il passo di una che ha chiuso un affare onesto.
          effetti: { fazione.consiglio: 1, consiglio.voti: 1, rep.castaldi: 1, monete: -60 }
          imposta: { consiglio.carte: 1 }
          vai: quartieri-alti
        fallimento:
          titolo: Il prezzo sbagliato
          testo: |
            Le mostri la borsa, e lei ride piano. Ti prende una parte delle monete con un gesto così rapido
            che te ne accorgi dopo, dal peso diverso nella mano. Mentre la guardi contare salta sul tetto
            vicino con la cartella sulla schiena. La senti ridere ancora, due tetti più in là, e poi niente.
            Quintus ti trova con la borsa alleggerita in mano.
          effetti: { fazione.consiglio: 1, monete: -20, scandalo: 0.5 }
          imposta: { consiglio.carte: 2 }
          vai: quartieri-alti
      - testo: "Capire da dove uscirà e farla aspettare da Quintus"
        descrizione: "La scala di corda è una finta, o forse no. Se indovini la sua uscita, Quintus ci arriva prima di lei."
        quando: [consiglio.gazza < 3]
        prova: { attributo: mentale, abilita: [percezione, conoscenze-della-strada], difficolta: Difficile }
        successo:
          titolo: La terza grondaia
          testo: |
            Guardi la scala di corda e poi i piedi della Gazza, che sono girati dall'altra parte. Puntano
            verso la terza grondaia, quella col tubo di piombo che scende nel vicolo, e il piombo è graffiato
            di fresco all'altezza del cornicione. Fai un fischio, e dal cortile Quintus capisce. Quando la
            Gazza scende dal tubo trova lui ad aspettarla in fondo, con la spada nel fodero e la mano tesa per
            la cartella.

            All'alba Aldous rimette le carte nel cassetto, e Quintus ti fa un cenno con il mento, che per lui
            è un discorso.
          effetti: { fazione.consiglio: 1, consiglio.voti: 1, rep.castaldi: 1 }
          imposta: { consiglio.carte: 1 }
          vai: quartieri-alti
        fallimento:
          titolo: La scala di corda
          testo: |
            Scommetti sulla grondaia e fischi a Quintus, e Quintus corre al vicolo. La Gazza scende per la
            scala di corda verso la strada, proprio dove l'avevi esclusa, e da laggiù ti saluta con la mano.
            Ti volti troppo in fretta e il rame bagnato ti scivola sotto la suola. Finisci contro un comignolo
            con la spalla, e il mattone ti lascia sulla giacca una striscia di fuliggine.
          effetti: { fazione.consiglio: 1, ferite: 1 }
          imposta: { consiglio.carte: 2 }
          vai: quartieri-alti
      - testo: "Lasciarle le carte"
        descrizione: "La Gazza ti ha riconosciuto. Sa che hai amici fra gli Scuri, e ti offre una parte se guardi dall'altra parte."
        quando: [rep.scuri >= 3]
        esito:
          titolo: Dall'altra parte
          testo: |
            La Gazza nomina a mezza voce un paio di persone che conosci, giù in Città Bassa, e ti lancia una
            borsa piccola che prendi al volo senza volerlo. Guardi il camino grande per il tempo che le serve,
            e conti i mattoni anneriti della prima fila. Quando ti volti c'è soltanto la scala di corda che
            sparisce oltre il cornicione. Dal cortile Quintus ti chiama, e tu gli rispondi che è scappata, e
            lui non dice niente.

            All'alba Aldous trova il cassetto vuoto e si siede alla scrivania senza accendere la lampada.
          effetti: { fazione.consiglio: 1, rep.scuri: 1, monete: 40 }
          imposta: { consiglio.carte: 3 }
          vai: quartieri-alti
