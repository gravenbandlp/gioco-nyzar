# Il Maniero Castaldi di notte, spedizione del passo 13 della quest del Consiglio (fazione.consiglio 12 → 13).
# La notte prima della seduta una ladra di Ghoran, Nives Orsat detta la Gazza, entra nel Maniero per prendere il
# bilancio parallelo di Aldous e le obbligazioni di grano firmate da Julia. Il protagonista difende la casa con
# Quintus Vael: è il Maniero Malgrani visto dall'altra parte.
# L'ingresso è in passi-3.yaml (imposta consiglio.notte 1 e consiglio.gazza 0); dopo una ritirata si rientra con
# `consiglio-tornare-al-maniero` (Quartieri Alti, ripetibile).
# Le stanze vanno in fasce di profondità, e una stanza superata non ricompare nella stessa visita:
# 0 il cortile e il pianterreno (il fico, la cucina dei segnali muti; il portone delle bilance vale anche a 1),
# 1 il seminterrato (i sacchi di Laresh, la porta del vino), 2 i piani nobili (lo studio di Aldous, la sala da
# pranzo), 3 fra i tetti di rame (la stanza dei nipoti, il lucernario).
# consiglio.gazza è il vantaggio della ladra: sale di uno a ogni prova fallita e a ogni via lunga (costo 2). Non
# chiude nessuna stanza. A tre la Gazza ha già le carte, e sui tetti bisogna prima raggiungerla.
# Il cuore a 4 è `consiglio-sui-tetti-di-rame`: il combattimento (con Ettore al Maniero se consiglio.ettore == 3),
# pagarla, farla aspettare da Quintus, inseguirla se ha le carte, oppure lasciargliele (rep.scuri >= 3).
# consiglio.carte: 1 restano a casa (e valgono un voto in seduta), 2 la Gazza scappa, 3 gliele lasci tu.
# Ogni esito del cuore porta la pista a 13 e riporta ai Quartieri Alti, tranne l'inseguimento riuscito, che ti
# lascia sul tetto davanti a lei.
aree:
  - id: consiglio-maniero-di-notte
    immagine: fazioni/famiglia-castaldi
    nome: Il Maniero Castaldi, di notte
    sommario: "Una ladra è nel Maniero Castaldi la notte prima della seduta, e cerca le carte di Aldous."
    spedizione: { ritorno: quartieri-alti, soglia: 4, stanze: 3 }
    testo: |
      Di notte il Maniero Castaldi sembra più piccolo, con le finestre buie
      tranne una al terzo piano, dove la nipote più piccola dorme con la
      candela accesa. Qualcuno è entrato, e Quintus Vael chiude le porte una a
      una con la mano sull'elsa. La ladra cerca il bilancio di Aldous e le
      obbligazioni firmate da Julia, le carte che domani qualcuno vorrebbe
      leggere in Consiglio.

storylet:
  # ------------------------------------------------------------ il rientro, ai Quartieri Alti
  - id: consiglio-tornare-al-maniero
    immagine: fazioni/famiglia-castaldi
    titolo: Tornare al Maniero
    sommario: "La notte non è finita, e al Maniero Castaldi Quintus Vael ti aspetta al portone di servizio."
    luogo: Quartieri Alti, il portone di servizio del Maniero Castaldi
    area: quartieri-alti
    ripetibile: true
    requisiti: [fazione.consiglio == 12, consiglio.notte >= 1]
    testo: |
      Quintus Vael ti aspetta appoggiato al portone di servizio, socchiuso
      su un cuneo di legno, e senza chiederti dove sei stato ti allunga una
      lanterna cieca con lo sportello già chiuso.
    opzioni:
      - testo: "Rientrare con Quintus"
        descrizione: "La ladra è ancora dentro, o ci è tornata. Si ricomincia dal cortile."
        esito:
          titolo: Il cuneo sotto la porta
          testo: |
            Quintus toglie il cuneo con la punta dello stivale e richiude il
            battente alle tue spalle. A mezza voce ti dice che Brem fa il giro
            delle terrazze, poi ti indica il buio con il mento e se ne va
            dall'altra parte del cortile.
          vai: consiglio-maniero-di-notte

  # ------------------------------------------------------------ 0 · il cortile e il pianterreno
  - id: consiglio-notte-il-fico
    immagine: fazioni/famiglia-castaldi
    titolo: Il fico del cortile
    sommario: "Il fico antico in mezzo al cortile ha una corda annodata fra i rami più alti."
    luogo: Il Maniero Castaldi, il cortile interno
    area: consiglio-maniero-di-notte
    ripetibile: true
    requisiti: [profondita.consiglio-maniero-di-notte == 0]
    testo: |
      Il cortile interno è un quadrato di lastre chiare con un fico antico nel
      mezzo, che si sta mangiando la panchina legata al tronco. Fra i rami più
      alti, dove la chioma tocca il cornicione, pende una corda sottile
      annodata a un palmo da un nodo all'altro, e sotto l'albero la terra è
      smossa in due punti.

      {origine rampollo-dei-quartieri-alti} Da piccolo anche tu sei uscito di
      casa dal ramo di un albero così, la prima cosa che i bambini dei manieri
      imparano ad arrampicare.
    opzioni:
      - testo: "Leggere le tracce sotto l'albero"
        descrizione: "La corda dice dove è salita, la terra smossa forse dove voleva andare."
        prova: { attributo: mentale, abilita: percezione, difficolta: Media }
        successo:
          titolo: La punta del piede
          testo: |
            Le impronte di una scarpa morbida affondano di punta e vanno dalla
            corda alla grata del seminterrato senza tornare indietro. La grata ha
            una sbarra appena piegata, e tu scendi la scaletta dei magazzini.
          effetti: { profondita.consiglio-maniero-di-notte: 1 }
        fallimento:
          titolo: Le foglie
          testo: |
            La lanterna troppo vicina alla terra apre lo sportello di uno
            spiraglio, e la luce sale lungo il tronco. Lassù qualcosa si ferma,
            poi la corda sale da sola fra i rami e sparisce oltre il cornicione.
          effetti: { consiglio.gazza: 1 }
      - testo: "Salire sul fico fino al cornicione"
        descrizione: "La corda l'ha messa lei, e dall'alto forse si vede dove è andata."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Media }
        successo:
          titolo: Il cornicione
          testo: |
            Sali dove la corteccia è liscia di mani fino al cornicione, e
            all'ultimo nodo della corda trovi infilata una piuma grigia e bianca.
            La prendi e scendi dall'altra parte, verso la porta della cucina.
          effetti: { profondita.consiglio-maniero-di-notte: 1 }
        fallimento:
          titolo: Il ramo secco
          testo: |
            A metà salita un ramo secco cede, e atterri sulla panchina con un
            colpo che si sente in tutto il cortile. Quintus si affaccia a
            guardarti e si ritira senza dire niente.
          effetti: { consiglio.gazza: 1, ferite: 0.5 }
      - testo: "Fare il giro lungo del portico"
        descrizione: "Sotto il portico si passa senza toccare l'albero, ma ci si mette di più."
        costo: 2
        esito:
          titolo: Il portico
          testo: |
            Giri il cortile sotto il portico fermandoti ad ascoltare, e quando
            arrivi alla porta della cucina fra i rami del fico la corda non c'è
            più.
          effetti: { profondita.consiglio-maniero-di-notte: 1, consiglio.gazza: 1 }

  - id: consiglio-notte-la-cucina-dei-segnali
    immagine: fazioni/famiglia-castaldi
    titolo: La cucina dei segnali muti
    sommario: "Eolio Drest è in piedi in cucina in camicia da notte, e alla servitù parla soltanto con le mani."
    luogo: Il Maniero Castaldi, la cucina
    area: consiglio-maniero-di-notte
    ripetibile: true
    requisiti: [profondita.consiglio-maniero-di-notte == 0]
    testo: |
      La cucina è l'unica stanza del pianterreno con il fuoco acceso. Intorno
      al tavolo, con un piatto di biscotti intatto fra le tazze, quattro
      servitori in camicia da notte stanno zitti, e davanti al camino Eolio
      Drest, il maggiordomo, ha il batacchio del campanello legato con un
      nastro. Muove le dita, e una ragazza va a chiudere un'imposta, poi torna
      al tavolo e si stringe le mani fra le ginocchia.

      {galateo Facile} A quest'ora si aspetta che il padrone di casa parli per
      primo, e qui il padrone di casa parla con le mani.
    opzioni:
      - testo: "Chiedere a Eolio che cosa ha visto la servitù"
        descrizione: "Se qualcuno ha visto passare la ladra Eolio lo sa già, ma va chiesto nel modo giusto."
        prova: { attributo: sociale, abilita: galateo, difficolta: Media }
        successo:
          titolo: Tre dita sul polso
          testo: |
            Gli chiedi a voce bassa, con un mezzo inchino, se la casa ha notato
            visite. Eolio si tocca il polso, e la lavandaia risponde per lui che
            la porta del seminterrato l'ha chiusa lei, e adesso è aperta; lui ti
            accompagna alla scala dei magazzini come un ospite.
          effetti: { profondita.consiglio-maniero-di-notte: 1 }
        fallimento:
          titolo: La voce alta
          testo: |
            A voce normale, in quella cucina, la tua domanda suona come un grido.
            Eolio ti fa un cenno verso il soffitto che non capisci, e sopra le
            vostre teste si chiude una porta.
          effetti: { consiglio.gazza: 1 }
      - testo: "Sederti con la ragazza dell'imposta"
        descrizione: "È la più spaventata della cucina, e chi ha paura di solito ha visto qualcosa."
        prova: { attributo: sociale, abilita: empatia, difficolta: Media }
        successo:
          titolo: Il biscotto
          testo: |
            Le passi un biscotto, e lei lo tiene in mano senza mangiarlo mentre ti
            racconta a pezzi di una donna vestita di grigio, ferma nel corridoio
            della dispensa, che le ha messo un dito sulle labbra. Eolio ti indica
            la porta della dispensa, che dà sul seminterrato.
          effetti: { profondita.consiglio-maniero-di-notte: 1 }
        fallimento:
          titolo: Il piatto intatto
          testo: |
            Lei scoppia a piangere senza rumore, con la faccia nelle mani, e una
            cuoca le mette un braccio intorno alle spalle guardandoti male. Esci
            dalla cucina mentre la notte va avanti.
          effetti: { consiglio.gazza: 1 }
      - testo: "Scendere per la scala di servizio senza disturbare"
        descrizione: "Una scala dalla cucina porta ai magazzini, girando largo intorno alla servitù."
        costo: 2
        esito:
          titolo: La scala di servizio
          testo: |
            Giri intorno al tavolo rasente al muro fino alla scaletta di servizio,
            che scende a gomito verso i magazzini. A metà ti fermi due volte per
            un passo sotto di te, e la seconda volta è il tuo cuore.
          effetti: { profondita.consiglio-maniero-di-notte: 1, consiglio.gazza: 1 }

  - id: consiglio-notte-il-portone
    immagine: fazioni/famiglia-castaldi
    titolo: Il portone delle bilance
    sommario: "Il portone principale è sprangato dall'interno, eppure la spranga è stata sollevata e rimessa a posto."
    luogo: Il Maniero Castaldi, l'atrio
    area: consiglio-maniero-di-notte
    ripetibile: true
    requisiti: [profondita.consiglio-maniero-di-notte <= 1]
    testo: |
      L'atrio è una sala alta con il pavimento a scacchi e una panca per i
      visitatori. Il portone di quercia è chiuso dall'interno da una spranga
      di ferro, e sotto i ganci ci sono due granelli di ruggine freschi.

      {tecnologia Media} I ganci sono graffiati sotto. Qualcuno ha sollevato
      la spranga con una leva sottile infilata fra i battenti, e poi l'ha
      rimessa giù con calma.

      {origine figlio-della-citta-bassa} Nei vicoli si dice che i ladri bravi
      chiudono le porte meglio dei padroni di casa.
    opzioni:
      - testo: "Esaminare la spranga e i ganci"
        descrizione: "Se è entrata di qui lo dicono i graffi, e forse anche con che cosa."
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Media }
        successo:
          titolo: La leva sottile
          testo: |
            Sotto i ganci trovi la scheggia di una lama sottile spezzata nello
            sforzo e te la infili nella cintura. Poi prendi la porta che scende ai
            magazzini, dove i granelli di ruggine continuano a due a due sul
            pavimento.
          effetti: { profondita.consiglio-maniero-di-notte: 1 }
        fallimento:
          titolo: La spranga
          testo: |
            La spranga ti scivola di mano e batte contro il battente con un colpo
            che rimbomba nell'atrio. Da qualche parte un cane si sveglia e abbaia
            una volta sola.
          effetti: { consiglio.gazza: 1 }
      - testo: "Sederti sulla panca e ascoltare la casa"
        descrizione: "Dalla panca dei visitatori si sentono tutte le porte del pianterreno, se si sta zitti."
        prova: { attributo: mentale, abilita: [percezione, resilienza], difficolta: Media }
        successo:
          titolo: La panca dei visitatori
          testo: |
            Ti siedi sul cuscino ricamato della panca e aspetti, finché più in
            basso una porta del seminterrato si apre e non si richiude. Ti alzi
            senza far rumore e vai da quella parte.
          effetti: { profondita.consiglio-maniero-di-notte: 1 }
        fallimento:
          titolo: I rumori di una casa vecchia
          testo: |
            Ogni trave che scricchiola ti sembra un passo, e quando ti alzi hai le
            gambe intorpidite e nessuna idea di dove andare. Dal cortile Quintus
            ti fa segno di sbrigarti.
          effetti: { consiglio.gazza: 1 }
      - testo: "Controllare a una a una le porte dell'atrio"
        descrizione: "Sono sei porte da aprire piano, e ci vuole tempo."
        costo: 2
        esito:
          titolo: Sei porte
          testo: |
            Apri piano le porte dell'atrio una dopo l'altra trovando mantelli e
            scope, finché l'ultima dà sulla scala dei magazzini e dal fondo sale
            l'odore della farina.
          effetti: { profondita.consiglio-maniero-di-notte: 1, consiglio.gazza: 1 }

  # ------------------------------------------------------------ 1 · il seminterrato
  - id: consiglio-notte-i-sacchi-di-laresh
    immagine: ambientazione/laresh
    titolo: I sacchi di Laresh
    sommario: "Nel magazzino del grano, fra i sacchi arrivati da Laresh, c'è un'impronta nella farina."
    luogo: Il Maniero Castaldi, il magazzino del grano
    area: consiglio-maniero-di-notte
    ripetibile: true
    requisiti: [profondita.consiglio-maniero-di-notte == 1]
    testo: |
      Il magazzino del grano è una volta bassa di mattoni, con i sacchi di
      Laresh impilati fino al soffitto e la polvere bianca che ti si posa
      sulle ciglia. In fondo, fra due pile, un sacco è scivolato e si è
      aperto, e sulla farina sparsa c'è un'impronta sola, nitida, di una
      scarpa morbida.

      {percezione Facile} L'impronta va verso la scala dei piani nobili, e c'è
      un granello di farina sul terzo gradino.
    opzioni:
      - testo: "Seguire l'impronta senza calpestarla"
        descrizione: "Una scarpa morbida in un magazzino di grano lascia la sua strada nella farina."
        prova: { attributo: mentale, abilita: percezione, difficolta: Media }
        successo:
          titolo: I granelli sui gradini
          testo: |
            Segui l'impronta lungo il bordo delle pile, dove la farina non cade, e
            i granelli ti portano su per la scala dei piani nobili fino a uno
            zerbino sbattuto di fresco.
          effetti: { profondita.consiglio-maniero-di-notte: 1 }
        fallimento:
          titolo: Lo starnuto
          testo: |
            Ti chini sull'impronta e la polvere vince. Lo starnuto solleva una
            nuvola bianca che copre anche l'impronta, e tu resti con la farina
            fino alle sopracciglia.
          effetti: { consiglio.gazza: 1 }
      - testo: "Contare i sacchi"
        descrizione: "Una ladra di carte non ruba grano, però può aver nascosto qualcosa dove nessuno guarda."
        prova: { attributo: mentale, abilita: [politica-ed-economia, accademiche], difficolta: Media }
        successo:
          titolo: Il sacco in più
          testo: |
            Conti le pile come le righe di un registro, e una ha un sacco in più.
            Dentro c'è una borsa di tela con una corda di ricambio e del pane
            secco, la ritirata della ladra; lasci tutto dov'è e prendi la scala.
          effetti: { profondita.consiglio-maniero-di-notte: 1 }
        fallimento:
          titolo: I conti sbagliati
          testo: |
            Conti le pile e il conto torna ogni volta diverso, finché ti accorgi
            che conti due volte la fila di dietro. Sopra la tua testa, sulla
            scala, una tavola ha appena scricchiolato.
          effetti: { consiglio.gazza: 1 }
      - testo: "Passare in fretta fra le pile"
        descrizione: "La polvere si posa su tutto, meglio attraversare il magazzino senza fermarsi."
        costo: 2
        esito:
          titolo: La polvere bianca
          testo: |
            Attraversi il magazzino a passi lunghi, con la manica sul naso, e
            arrivi alla scala con la giubba bianca sulle spalle e un sapore di
            pane crudo in bocca.
          effetti: { profondita.consiglio-maniero-di-notte: 1, consiglio.gazza: 1 }

  - id: consiglio-notte-la-porta-del-vino
    immagine: personaggi/quintus-vael
    titolo: La porta del vino
    sommario: "Davanti alla cantina del vino Brem Anthos dorme seduto per terra, e non dovrebbe."
    luogo: Il Maniero Castaldi, la cantina
    area: consiglio-maniero-di-notte
    ripetibile: true
    requisiti: [profondita.consiglio-maniero-di-notte == 1]
    testo: |
      Davanti alla porta di ferro della cantina del vino dorme Brem Anthos, il
      vice di Quintus, seduto per terra con la schiena contro il ferro.
      Accanto alla sua mano c'è una tazza di latta rovesciata, e la chiave
      della cantina è ancora appesa alla cintura.

      {medicina Media} Il respiro è troppo regolare e le pupille sotto le
      palpebre sono strette come punte di spillo, perché nella tazza c'era
      qualcosa oltre al vino.

      {origine figlio-della-citta-bassa} Una tazza portata alla guardia con un
      sorriso è il primo trucco che insegnano nei vicoli.
    opzioni:
      - testo: "Svegliare Brem"
        descrizione: "Con acqua fredda e sale sotto il naso si sveglia, e la ladra ha un nemico in più."
        prova: { attributo: mentale, abilita: medicina, difficolta: Media }
        successo:
          titolo: Due occhi rossi
          testo: |
            Gli bagni i polsi e gli metti del sale sotto il naso. Brem tossisce e
            cerca la spada prima ancora di sapere dov'è; con la lingua impastata
            ti dice che la tazza gliel'ha portata una ragazza nuova della servitù,
            poi sale con te verso i piani nobili.
          pe: { medicina: 3 }
          effetti: { profondita.consiglio-maniero-di-notte: 1 }
        fallimento:
          titolo: Il sonno pesante
          testo: |
            Brem apre gli occhi, ti chiama con il nome di qualcun altro e torna
            giù nel sonno con un sospiro contento. Lo stendi sul fianco, come si
            fa con gli ubriachi, mentre il tempo passa.
          effetti: { consiglio.gazza: 1 }
      - testo: "Annusare la tazza"
        descrizione: "Quello che ha bevuto Brem dice chi gliel'ha dato, e da dove viene."
        prova: { attributo: mentale, abilita: [natura, medicina], difficolta: Media }
        successo:
          titolo: Papavero e miele
          testo: |
            Sotto il vino senti il miele e l'amaro del papavero, una dose da
            dormire fino all'alba senza danni, e chi l'ha preparata voleva la
            porta libera e la guardia viva. Lasci dormire Brem e prendi la scala.
          effetti: { profondita.consiglio-maniero-di-notte: 1 }
        fallimento:
          titolo: Il vino della casa
          testo: |
            Senti solo il vino della casa e un retrogusto che non riconosci, così
            ne bagni la punta della lingua. Il corridoio si allunga e le pareti si
            fanno morbide, e quando torni in te sei seduto accanto a Brem.
          effetti: { consiglio.gazza: 1, tormento: 1 }
      - testo: "Lasciarlo dormire e proseguire"
        descrizione: "Brem dorme e la ladra intanto sale, lo troverà Quintus più tardi."
        costo: 2
        esito:
          titolo: La chiave alla cintura
          testo: |
            Sfili la chiave della cantina dalla cintura di Brem e gli sistemi la
            testa contro il muro. Sali la scala dei piani nobili con la chiave che
            ti batte sul fianco a ogni gradino.
          effetti: { profondita.consiglio-maniero-di-notte: 1, consiglio.gazza: 1 }

  # ------------------------------------------------------------ 2 · i piani nobili
  - id: consiglio-notte-lo-studio-di-aldous
    immagine: fazioni/famiglia-castaldi
    titolo: Lo studio di Aldous
    sommario: "Nello studio di Aldous un cassetto della scrivania è stato forzato, e le carte sono in ordine sul piano."
    luogo: Il Maniero Castaldi, lo studio di Aldous
    area: consiglio-maniero-di-notte
    ripetibile: true
    requisiti: [profondita.consiglio-maniero-di-notte == 2]
    testo: |
      Lo studio di Aldous ha le pareti coperte di registri in tela grigia. Il
      cassetto della scrivania con la serratura è aperto di un dito, e sul
      piano qualcuno ha disposto le carte in file ordinate, come per leggerle
      con calma; una finestra sulle terrazze è socchiusa.

      {tecnologia Media} La serratura non è rotta. L'hanno aperta con due
      ferri e una pazienza da orologiaio, e sul legno resta appena un graffio.
    opzioni:
      - testo: "Capire che cosa manca dal cassetto"
        descrizione: "Una ladra di carte lascia sul tavolo quello che non le serve, e quello che manca dice dove andrà."
        prova: { attributo: mentale, abilita: percezione, difficolta: Media }
        successo:
          titolo: La cartella grigia
          testo: |
            Sul fondo del cassetto un rettangolo più chiaro segna il posto della
            cartella con il bilancio di Aldous, che non c'è più. Le obbligazioni
            firmate da Julia sono ancora sotto il fondo doppio; le prendi ed esci
            verso le scale del terzo piano.
          effetti: { profondita.consiglio-maniero-di-notte: 1 }
        fallimento:
          titolo: Le carte in fila
          testo: |
            Sfogli le carte cercando di capire dall'ordine che cosa cercava, e
            arrivi in fondo con un contratto d'affitto in mano. Dal soffitto
            arriva un passo leggero che va verso le terrazze.
          effetti: { consiglio.gazza: 1 }
      - testo: "Studiare la serratura forzata"
        descrizione: "Chi apre con due ferri e un graffio ha un suo modo di lavorare, e di uscire."
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Media }
        successo:
          titolo: I ferri da orologiaio
          testo: |
            Nel nottolino trovi una goccia d'olio fresca, messa per non far
            cantare la serratura. Una che lavora così esce da dove è entrata, e la
            finestra socchiusa dà sulle terrazze, così esci da lì anche tu.
          effetti: { profondita.consiglio-maniero-di-notte: 1 }
        fallimento:
          titolo: Il cassetto che si chiude
          testo: |
            Il cassetto si richiude a chiave con uno scatto secco, e la chiave ce
            l'ha Aldous, che dorme due porte più in là.
          effetti: { consiglio.gazza: 1 }
      - testo: "Uscire dalla finestra sulle terrazze"
        descrizione: "La finestra è socchiusa, e le terrazze sono strette e scivolose di notte."
        costo: 2
        esito:
          titolo: Le terrazze
          testo: |
            Cammini sulla terrazza con la schiena al muro, sopra il cortile nero,
            fino alla scala esterna del terzo piano, e arrivi con le mani bagnate
            di sudore freddo.
          effetti: { profondita.consiglio-maniero-di-notte: 1, consiglio.gazza: 1 }

  - id: consiglio-notte-la-sala-da-pranzo
    immagine: personaggi/marella-castaldi
    titolo: La sala da pranzo
    sommario: "Sulla tavola della sala da pranzo i segnaposto della cena di domani sono stati copiati su un foglio."
    luogo: Il Maniero Castaldi, la sala da pranzo
    area: consiglio-maniero-di-notte
    ripetibile: true
    requisiti: [profondita.consiglio-maniero-di-notte == 2]
    testo: |
      La sala da pranzo è già apparecchiata per la cena che segue la seduta,
      con i segnaposto disposti come una mappa del Consiglio. Accanto al
      piatto di capotavola c'è la tavola ricopiata a matita su un foglio
      sottile, e l'ultima riga si interrompe a metà di un nome.

      {galateo Media} Marella mette i nemici a un posto di distanza e gli
      indecisi vicino al vino, e chi ha copiato la tavola sa leggere anche
      questo.

      {origine rampollo-dei-quartieri-alti} A tavole così ti mettevano in
      fondo fra i figli delle altre casate, e da lì si vedeva bene chi
      parlava con chi.
    opzioni:
      - testo: "Leggere la copia della tavola"
        descrizione: "A che cosa serve a una ladra la disposizione di una cena dipende da chi la paga."
        prova: { attributo: mentale, abilita: [accademiche, politica-ed-economia], difficolta: Media }
        successo:
          titolo: I nomi a matita
          testo: |
            Sopra tre nomi, quelli degli indecisi vicino al vino, c'è una
            crocetta, perché chi paga la ladra vuole sapere su chi lavorare prima
            della seduta. Pieghi il foglio in tasca mentre senti un fruscio sulla
            scala del terzo piano.
          effetti: { profondita.consiglio-maniero-di-notte: 1 }
        fallimento:
          titolo: La matita
          testo: |
            La grafia è così minuta che devi avvicinare la lanterna, e solo dopo
            ti accorgi che la luce si vede dalle terrazze. Lassù qualcosa cambia
            direzione e se ne va verso il tetto.
          effetti: { consiglio.gazza: 1 }
      - testo: "Rimettere a posto i segnaposto spostati"
        descrizione: "Mentre copiava la ladra ne ha toccati alcuni, e chi conosce le tavole sa dove."
        prova: { attributo: sociale, abilita: galateo, difficolta: Media }
        successo:
          titolo: Il posto di Marella
          testo: |
            Tre segnaposto sono girati di un dito, e sotto l'ultimo trovi una
            piuma grigia e bianca, uguale a quella della corda del fico. Esci
            dalla porta della servitù verso la scala del terzo piano.
          effetti: { profondita.consiglio-maniero-di-notte: 1 }
        fallimento:
          titolo: Il bicchiere
          testo: |
            Urti un bicchiere di cristallo, che tintinna contro il vicino e poi
            contro quello dopo, lungo tutta la tavola. Li fermi con il palmo
            aperto, ma ormai la casa ti ha sentito.
          effetti: { consiglio.gazza: 1 }
      - testo: "Attraversare la sala senza toccare niente"
        descrizione: "La tavola di Marella si guarda e non si tocca, e la porta della servitù è in fondo."
        costo: 2
        esito:
          titolo: In punta di piedi
          testo: |
            Giri intorno alla tavola senza sfiorare la tovaglia ed esci dalla
            porta della servitù, sulla scaletta che sale fra le travi del terzo
            piano.
          effetti: { profondita.consiglio-maniero-di-notte: 1, consiglio.gazza: 1 }

  # ------------------------------------------------------------ 3 · fra i tetti di rame
  - id: consiglio-notte-la-stanza-dei-nipoti
    immagine: fazioni/famiglia-castaldi
    titolo: La stanza dei nipoti
    sommario: "Al terzo piano Vesper e Mira sono svegli sotto le coperte, e hanno visto passare qualcuno."
    luogo: Il Maniero Castaldi, il terzo piano
    area: consiglio-maniero-di-notte
    ripetibile: true
    requisiti: [profondita.consiglio-maniero-di-notte == 3]
    testo: |
      La stanza dei nipoti è ricavata sotto il tetto, con le travi a vista e
      una candela in un piattino sul pavimento. Vesper e Mira sono seduti
      sullo stesso letto con la coperta fino al naso, e dalla finestrella
      aperta entra il vento che fa suonare il rame.

      Mira ti guarda con gli occhi seri della zia e non dice niente. Vesper
      indica la finestrella con il mento, lo stesso gesto di Quintus.

      {empatia Facile} Hanno paura, e anche voglia di raccontarlo. Il maggiore
      tiene la mano della sorella e fa finta che sia lei a tenere la sua.
    opzioni:
      - testo: "Sederti sul letto e chiedere piano"
        descrizione: "Vesper vuole raccontare, Mira vuole capire se ti può credere."
        prova: { attributo: sociale, abilita: empatia, difficolta: Media }
        successo:
          titolo: La signora grigia
          testo: |
            Mira, quando le chiedi se ha visto un fantasma, scuote la testa con
            disprezzo. Era una signora vestita di grigio, spiega Vesper, passata
            dalla finestrella con una cartella sotto il braccio verso il camino
            grande.
          effetti: { profondita.consiglio-maniero-di-notte: 1 }
        fallimento:
          titolo: Il cuscino
          testo: |
            Vesper guarda la sorella e la sorella guarda te. Poi Mira soffia sulla
            candela e si gira contro il muro, e nel buio Vesper ti chiede se puoi
            andare via, per favore.
          effetti: { consiglio.gazza: 1 }
      - testo: "Chiedere in fretta, come a un testimone"
        descrizione: "Non c'è tempo per le favole, perché la ladra adesso è sul tetto."
        prova: { attributo: sociale, abilita: intimidire, difficolta: Difficile }
        successo:
          titolo: Due voci insieme
          testo: |
            Le domande in fila fanno rispondere i bambini insieme, prima che
            decidano se avere paura di te, e ne esce una signora grigia andata
            verso il camino grande. Esci dalla finestrella mentre Mira piange con
            molta dignità.
          effetti: { profondita.consiglio-maniero-di-notte: 1 }
        fallimento:
          titolo: Il pianto
          testo: |
            Alla prima domanda Vesper scoppia a piangere, e Mira lo segue più
            forte. Al piano di sotto si aprono le porte, e sul tetto chi ascoltava
            sa esattamente dove sei.
          effetti: { consiglio.gazza: 1, scandalo: 1 }
      - testo: "Mandarli a dormire nella stanza dei genitori e uscire sul tetto"
        descrizione: "Prima i bambini al sicuro e poi la ladra, anche se ci vuole qualche minuto."
        costo: 2
        esito:
          titolo: Il corridoio dei genitori
          testo: |
            Accompagni i bambini fino alla porta dei genitori, dove Marella li
            tira dentro senza una domanda. Poi torni alla finestrella e metti il
            piede sul rame freddo, con il vento che ti gonfia la giubba.
          effetti: { profondita.consiglio-maniero-di-notte: 1, consiglio.gazza: 1 }

  - id: consiglio-notte-il-lucernario
    immagine: fazioni/famiglia-castaldi
    titolo: Il lucernario
    sommario: "Il lucernario sopra la scala grande è aperto, e sul vetro c'è il segno di una mano."
    luogo: Il Maniero Castaldi, sotto il lucernario
    area: consiglio-maniero-di-notte
    ripetibile: true
    requisiti: [profondita.consiglio-maniero-di-notte == 3]
    testo: |
      In cima alla scala grande uno dei vetri del lucernario è sollevato sul
      cardine, e ne entra l'aria fredda di una notte senza luna. Sul vetro
      accanto, appannato, c'è l'impronta di una mano piccola con le dita
      aperte, e sul corrimano un graffio fresco.

      {acrobazia Media} Dal corrimano al bordo del lucernario c'è un salto
      lungo quanto un uomo, e chi l'ha fatto sapeva atterrare sulle mani senza
      rumore.

      {origine figlio-della-citta-bassa} Le ladre di città entrano dal basso
      ed escono dall'alto, perché chi insegue guarda sempre le porte.
    opzioni:
      - testo: "Saltare dal corrimano al lucernario"
        descrizione: "Lei l'ha fatto, e tu hai le scarpe sbagliate e meno pratica."
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Media }
        successo:
          titolo: Il bordo del vetro
          testo: |
            Salti dal corrimano e le mani trovano il bordo di piombo, mentre i piedi
            pedalano sopra la tromba delle scale. Poi sei fuori, in ginocchio sul
            rame freddo, e verso il camino grande qualcosa si sposta.
          effetti: { profondita.consiglio-maniero-di-notte: 1 }
        fallimento:
          titolo: La tromba delle scale
          testo: |
            Le dita scivolano sul piombo umido e ti lasci cadere sul pianerottolo
            con un tonfo che sveglia mezzo piano. Ti rialzi con un polso che
            pulsa.
          effetti: { consiglio.gazza: 1, ferite: 0.5 }
      - testo: "Leggere l'impronta sul vetro"
        descrizione: "Una mano piccola con le dita aperte, appoggiata per guardare dentro o per guardare fuori."
        prova: { attributo: mentale, abilita: percezione, difficolta: Media }
        successo:
          titolo: Le dita aperte
          testo: |
            Il pollice è verso il cortile, quindi la ladra guardava fuori, verso
            il camino grande e il tetto della casa vicina. Sali dalla scaletta di
            servizio e sbuchi sul tetto dalla parte giusta.
          effetti: { profondita.consiglio-maniero-di-notte: 1 }
        fallimento:
          titolo: Il fiato sul vetro
          testo: |
            Il tuo fiato appanna il vetro e cancella l'impronta, e il vetro grigio
            non ti dice più niente.
          effetti: { consiglio.gazza: 1 }
      - testo: "Prendere la scaletta di servizio fino al tetto"
        descrizione: "In fondo al corridoio, lontano, c'è una botola per gli spazzacamini."
        costo: 2
        esito:
          titolo: La botola degli spazzacamini
          testo: |
            Una scala a pioli sale a una botola annerita di fuliggine, che cede al
            secondo colpo di spalla, e sbuchi sul tetto con la faccia nera fino
            agli occhi.
          effetti: { profondita.consiglio-maniero-di-notte: 1, consiglio.gazza: 1 }

  # ------------------------------------------------------------ il cuore · sui tetti di rame
  - id: consiglio-sui-tetti-di-rame
    immagine: fazioni/famiglia-castaldi
    titolo: Sui tetti di rame
    sommario: "Sul tetto del Maniero, fra i comignoli, una donna vestita di grigio si volta a guardarti."
    luogo: Il Maniero Castaldi, i tetti di rame
    area: consiglio-maniero-di-notte
    requisiti: [fazione.consiglio == 12, profondita.consiglio-maniero-di-notte >= 4]
    testo: |
      I tetti di rame del Maniero scendono in falde ripide verso il cortile e
      verso la strada, con i comignoli in fila e il camino grande in mezzo. Il
      rame è bagnato di guazza, e di là dal cornicione, a un salto di
      distanza, comincia il tetto della casa vicina.

      Accanto al camino grande c'è Nives Orsat, la Gazza. È minuta e vestita
      di grigio scuro, con i capelli chiusi in una cuffia e un coltello corto
      per mano. Più in là, sul bordo verso la strada, un ragazzo tiene pronta
      una scala di corda arrotolata. La cartella grigia di Aldous, se è già
      sua, le pende a tracolla; se non lo è, gliela leggi nella fretta con cui
      guarda il lucernario alle tue spalle.

      {armi-da-distanza Media} Il ragazzo con la scala è il punto debole.
      Senza la scala le resta il salto verso il tetto vicino, e con la guazza
      è un salto che si sbaglia.

      {conoscenze-della-strada Media} Una ladra di carte lavora a prezzo
      fisso, e il prezzo copre la strada di uscita. Se la strada costa più del
      previsto, il contratto si ridiscute.

      Dal cortile sale la voce di Quintus. La Gazza ti guarda e non scappa, e
      aspetta di vedere che cosa farai.
    opzioni:
      - testo: "Affrontarla sui tetti"
        descrizione: "La Gazza è veloce e tu sei stanco, sul rame bagnato."
        quando: [consiglio.gazza < 3, consiglio.ettore != 3]
        combattimento: consiglio-la-gazza-sui-tetti
        vittoria:
          titolo: La cartella grigia
          testo: |
            Appena la Gazza scivola sul rame il ragazzo scappa giù per la scala, e
            lei resta aggrappata a un comignolo. Ti allunga la cartella e si sfila
            i guanti per fartene dono, con una smorfia da giocatrice che salda un
            debito, e Quintus la porta giù legata con la sua stessa corda.

            All'alba Aldous rimette la cartella nel cassetto con mani che non
            smettono di tremare.
          effetti: { fazione.consiglio: 1, consiglio.voti: 1, rep.castaldi: 1, oggetto.consiglio-guanti-della-gazza: 1 }
          imposta: { consiglio.carte: 1 }
          vai: quartieri-alti
        sconfitta:
          titolo: Il salto
          testo: |
            Il ragazzo ti tiene impegnato con il coltello quanto basta, e quando
            ti volti la Gazza è già sul tetto vicino con la cartella. Ti lascia un
            taglio sul braccio e un inchino dall'altra parte del vuoto.
          effetti: { fazione.consiglio: 1 }
          imposta: { consiglio.carte: 2 }
          vai: quartieri-alti
      - testo: "Affrontarla sui tetti, con Ettore"
        descrizione: "Ettore Castaldi, salito scalzo dalla botola con la spada in mano, si occupa del ragazzo."
        quando: [consiglio.gazza < 3, consiglio.ettore == 3]
        combattimento: consiglio-la-gazza-da-sola
        vittoria:
          titolo: Due contro una
          testo: |
            Ettore si piazza davanti alla scala, e il ragazzo decide che non ne
            vale la paga. Sul rame restate tu e la Gazza, finché lei non scivola
            sul comignolo. Ti allunga la cartella e i guanti con le due mani, come
            si paga una partita persa.

            All'alba Ettore, sobrio, beve il tè di Eolio in cucina, e Aldous
            rimette la cartella nel cassetto senza riuscire a dire grazie.
          effetti: { fazione.consiglio: 1, consiglio.voti: 1, rep.castaldi: 1, oggetto.consiglio-guanti-della-gazza: 1 }
          imposta: { consiglio.carte: 1 }
          vai: quartieri-alti
        sconfitta:
          titolo: Il tetto vicino
          testo: |
            Ettore blocca il ragazzo, ma quando scivoli sul rame bagnato la Gazza
            è già in volo verso il tetto vicino con la cartella. Lui ti tira su
            per il bavero, ti guarda il taglio sulla fronte e dice che ne ha visti
            di peggio, senza chiarire se parla del taglio o di te.
          effetti: { fazione.consiglio: 1 }
          imposta: { consiglio.carte: 2 }
          vai: quartieri-alti
      - testo: "Inseguirla fra i tetti"
        descrizione: "Ha già le carte e corre verso il tetto vicino, e va presa prima del salto."
        quando: [consiglio.gazza >= 3]
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Difficile }
        successo:
          titolo: Il comignolo
          testo: |
            Corri sul rame con le braccia larghe e salti dietro di lei sul tetto
            vicino, atterrando con una mano sul suo mantello. Lei si libera, ma
            deve fermarsi contro un comignolo con la cartella stretta al petto, e
            stavolta è lei a cercare una via con gli occhi.
          imposta: { consiglio.gazza: 2 }
        fallimento:
          titolo: La grondaia
          testo: |
            Il rame ti porta giù per la falda fino alla grondaia, che ti ferma con
            un colpo alle costole. Quando alzi la testa la Gazza è una sagoma
            grigia sul tetto vicino, e poi nemmeno quella.
          effetti: { fazione.consiglio: 1, ferite: 1 }
          imposta: { consiglio.carte: 2 }
          vai: quartieri-alti
      - testo: "Pagarla più del suo mandante"
        descrizione: "Una ladra a prezzo fisso cambia cliente se il nuovo paga meglio e la sua uscita è chiusa."
        quando: [consiglio.gazza < 3]
        requisiti: [monete >= 60]
        prova: { attributo: sociale, abilita: [persuasione, conoscenze-della-strada], difficolta: Difficile }
        successo:
          titolo: Il contratto nuovo
          testo: |
            Le dici che Quintus ha un uomo sul tetto vicino, vero da un minuto, e
            che il suo mandante non la tirerà fuori dalle celle della Caserma, poi
            le mostri la borsa. La Gazza fa un cenno al ragazzo e la scala
            sparisce; scambia la cartella con la borsa ed esce dalla botola
            scortata da Quintus, contenta dell'affare.

            All'alba Aldous conta le carte due volte.
          effetti: { fazione.consiglio: 1, consiglio.voti: 1, rep.castaldi: 1, monete: -60 }
          imposta: { consiglio.carte: 1 }
          vai: quartieri-alti
        fallimento:
          titolo: Il prezzo sbagliato
          testo: |
            Lei ride piano e ti sfila una parte delle monete con un gesto che noti
            solo dopo. Mentre conti quello che resta, salta sul tetto vicino con
            la cartella.
          effetti: { fazione.consiglio: 1, monete: -20, scandalo: 0.5 }
          imposta: { consiglio.carte: 2 }
          vai: quartieri-alti
      - testo: "Capire da dove uscirà e farla aspettare da Quintus"
        descrizione: "Se indovini da dove uscirà, Quintus può arrivarci prima di lei."
        quando: [consiglio.gazza < 3]
        prova: { attributo: mentale, abilita: [percezione, conoscenze-della-strada], difficolta: Difficile }
        successo:
          titolo: La terza grondaia
          testo: |
            I piedi della Gazza sono girati verso la terza grondaia, quella col
            tubo di piombo che scende nel vicolo. Fai un fischio, e quando lei
            scende dal tubo trova Quintus ad aspettarla con la mano tesa per la
            cartella, mentre il ragazzo con la scala scappa.

            All'alba Quintus ti fa un cenno con il mento, che per lui è un
            discorso.
          effetti: { fazione.consiglio: 1, consiglio.voti: 1, rep.castaldi: 1 }
          imposta: { consiglio.carte: 1 }
          vai: quartieri-alti
        fallimento:
          titolo: La scala di corda
          testo: |
            Fischi a Quintus, che corre al vicolo, e la Gazza scende per la scala
            di corda dove l'avevi esclusa e ti saluta dalla strada. Voltandoti
            troppo in fretta finisci contro un comignolo con la spalla.
          effetti: { fazione.consiglio: 1, ferite: 1 }
          imposta: { consiglio.carte: 2 }
          vai: quartieri-alti
      - testo: "Lasciarle le carte"
        descrizione: "La Gazza sa che hai amici fra gli Scuri, e ti offre una parte se guardi altrove."
        quando: [rep.scuri >= 3]
        esito:
          titolo: Dall'altra parte
          testo: |
            La Gazza nomina a mezza voce un paio di amici tuoi in Città Bassa e ti
            lancia una borsa piccola. Guardi il camino grande finché la scala di
            corda non sparisce oltre il cornicione, poi dici a Quintus che è
            scappata, e lui non chiede da che parte; Brem, dalla terrazza di
            sotto, guardava il tetto.

            All'alba Aldous trova il cassetto vuoto e si siede alla scrivania al
            buio.
          effetti: { fazione.consiglio: 1, rep.scuri: 1, monete: 40 }
          imposta: { consiglio.carte: 3 }
          vai: quartieri-alti
