# Quest del Consiglio, secondo atto (fazione.consiglio 6 → 10). Si apre con pista.tribu >= 1.
# - passo 7 `consiglio-il-bilancio-di-aldous` (fazione.consiglio == 6, Maniero Castaldi): Aldous mostra il bilancio
#   parallelo. Le obbligazioni di grano firmate per i coloni di Laresh negli anni di magra sono intestate alla casa
#   dei Malgrani e maturano in questa stagione; dopo la caduta di Ottone (pista.pelle >= 7) le tiene Urtilia a
#   Ghoran. Aldous vuole pagare con il raccolto delle terre di Laresh, che Julia ha promesso al pane della Città
#   Bassa, e ti chiede di scortarlo. Ogni via chiude il passo e dà consiglio.debito 1.
# - passo 8 `consiglio-i-carri-di-laresh` (fazione.consiglio == 7, consiglio.partito == 0): la partenza, con
#   `vai: consiglio-guado-del-torvessa` (spedizione-guado.yaml). A cavallo si parte un passo più avanti. La pista
#   sale al cuore della spedizione.
# - passo 9 `consiglio-il-grano-nel-magazzino` (fazione.consiglio == 8): Julia trova il grano. consiglio.grano: 1 la
#   casata paga il debito, 2 il grano va al pane della Città Bassa, 3 a metà con una dilazione (Politica ed economia
#   Difficile, solo con al massimo un carro perso; se fallisce vale 2). Il Figlio della Città Bassa e il Rampollo
#   hanno un argomento loro. Ogni via porta al seguito del grado III `consiglio-messo-del-sigillo`.
# - passo 10: due ingressi secondo segreto.ettore (la Maison lo dà al suo passo 4): `consiglio-l-idromele-delle-dieci`
#   (0, la notizia arriva da Tullio e da Sara Beck) e `consiglio-l-idromele-delle-dieci-noto` (>= 1, sai già dove
#   Ettore passa le notti). Tutti e due portano al seguito `consiglio-il-libretto-di-ettore`: Tebaldo Ronchi, che
#   cura in città gli affari dei Malgrani di Ghoran, ha un testimone e vuole uno scandalo. consiglio.ettore: 1 il
#   libretto a Julia (rep.maison −1), 2 il silenzio del testimone comprato, 3 Ettore va dalla cugina (Empatia
#   Difficile, la spada del paladino). Con rep.maison >= 3 il libretto te lo dà Nerissa. Se fallisce la prova con
#   Sara Beck la scena si riapre dall'ingresso.
storylet:
  # ------------------------------------------------------------ passo 7 · il bilancio di Aldous
  - id: consiglio-il-bilancio-di-aldous
    immagine: fazioni/famiglia-castaldi
    titolo: Il bilancio di Aldous
    sommario: "Sul bancone di Tullio c'è una busta per te, senza firma, con le bilance dei Castaldi impresse nella ceralacca. Dentro c'è un'ora e una porta di servizio."
    luogo: Maniero Castaldi, lo studio di Aldous
    area: quartieri-alti
    requisiti: [fazione.consiglio == 6, pista.tribu >= 1]
    testo: |
      Alla porta di servizio del Maniero ti aspetta Eolio Drest con una
      lanterna schermata, e ti porta su per le scale dei valletti senza dire
      una parola. Al secondo piano bussa due volte allo studio, poi apre la
      porta e si ritira. Lo studio di Aldous Castaldi è una stanza stretta con
      una finestra sulle terrazze, gli scaffali pieni di registri rilegati in
      tela grigia e una scrivania così sgombra che sembra appena comprata.

      Aldous ti aspetta in piedi, con le mani giunte dietro la schiena. È di
      poco più vecchio di Julia e ne dimostra dieci anni di più. Ti stringe la
      mano, poi tira fuori dal cassetto un registro sottile, rilegato in cuoio
      invece che in tela, e lo apre sulla scrivania fra voi due.

      «Mia sorella riceve in Municipio, e io ricevo qui» dice a voce bassa.
      «Di solito ricevo i creditori.» Negli anni di magra la casata ha firmato
      obbligazioni di grano per sfamare i coloni di Laresh e di Pannion. Sono
      intestate alla casa dei Malgrani, firmate davanti a un notaio di Ghoran
      con l'inchiostro marrone di laggiù, e maturano in questa stagione, prima
      dell'inverno. Il raccolto delle terre di famiglia a Laresh basterebbe a
      pagarne una parte. Julia però quel grano l'ha promesso al pane della
      Città Bassa.

      {politica-ed-economia Media} Chi tiene le obbligazioni di una casata
      tiene anche chi la guida. Julia combatte i mulini dei Malgrani in
      Consiglio, e intanto deve loro il grano di casa sua.

      {empatia Facile} Tiene le mani dietro la schiena perché gli tremano. Te
      ne accorgi quando le porta avanti per voltare la pagina, e le rimette
      subito al loro posto.

      «Vorrei che lei non lo sapesse finché il grano non è in cantina» dice.
      «Mi serve qualcuno che vada a Laresh e lo porti qui prima che il
      creditore lo sappia, e che non porti la livrea di casa.»
    opzioni:
      - testo: "Leggere il bilancio fino in fondo"
        descrizione: "Il registro di cuoio ha più pagine di quelle che Aldous ti mostra. Le colonne in fondo sono quelle che contano."
        prova: { attributo: mentale, abilita: politica-ed-economia, difficolta: Media }
        successo:
          titolo: L'ultima colonna
          testo: |
            Volti le pagine da solo, e Aldous te lo lascia fare. Nelle ultime
            c'è un bilancio diverso, compilato a mano ogni mese con la stessa
            grafia minuta, dove il creditore chiede il rientro di tutto e
            subito. In fondo alla colonna c'è il Maniero intero con il suo
            fico e i suoi tetti di rame, segnato con una cifra sola. Chiudi il
            registro. Aldous ti dice che quella pagina la rifà da tre anni, e
            che sua sorella non l'ha mai vista. Gli rispondi che andrai a
            Laresh, e lui ti stringe la mano una seconda volta, più a lungo.

            {resilienza Media} La cifra in fondo alla colonna ti resta davanti
            agli occhi anche a registro chiuso. Una casa intera, scritta in
            piccolo per non spaventare chi la scrive.
          pe: { politica-ed-economia: 5 }
          imposta: { consiglio.debito: 1 }
          effetti: { fazione.consiglio: 1, rep.castaldi: 0.5 }
        fallimento:
          titolo: Le colonne grigie
          testo: |
            Le cifre del registro sono fitte e minute, e dopo la terza pagina
            ti si confondono davanti agli occhi. Aldous ti guarda perdere il
            filo con una pazienza che fa più male di un rimprovero, poi chiude
            il registro e te lo riassume in due frasi, a voce bassa. Il debito
            è grande e la stagione è questa. Gli rispondi che andrai a Laresh,
            e lui annuisce come si annuisce a un fornitore.
          imposta: { consiglio.debito: 1 }
          effetti: { fazione.consiglio: 1, scandalo: 0.5 }

      - testo: "Chiedergli perché l'ha nascosto a Julia"
        descrizione: "Un fratello che tiene i conti di casa non nasconde un debito alla sorella senza un motivo. Il motivo, forse, è lei."
        prova: { attributo: sociale, abilita: empatia, difficolta: Media }
        successo:
          titolo: Lui filtra, lei decide
          testo: |
            Aldous ci mette un po' a risponderti. Poi ti racconta che la sera,
            quando Julia rientra dal Municipio, è lui a dirle quello che vale
            la pena sapere, e che è sempre andata così, con lui che filtra e
            lei che decide. Due volte le ha proposto di saldare in perdita, e
            due volte lei ha detto di no. «Se le mostro questo, lei lo usa»
            dice. «Lo trasforma in una battaglia, e le battaglie di Julia le
            paga la casa.» Gli rispondi che andrai a Laresh, e per la prima
            volta Aldous si siede.

            {empatia Media} Ha paura per la sorella e ha paura della sorella
            nello stesso momento. Ti ha chiamato perché tu non sei di
            famiglia.
          pe: { empatia: 5 }
          imposta: { consiglio.debito: 1 }
          effetti: { fazione.consiglio: 1, rep.castaldi: 0.5 }
        fallimento:
          titolo: Una frase di suo padre
          testo: |
            Glielo chiedi troppo presto, e Aldous ti risponde con una frase
            che doveva essere di suo padre, sulla casata che firma promesse e
            le mantiene. Poi richiude il registro e ti chiede soltanto se vai
            a Laresh. Gli rispondi di sì, e lui ti accompagna alla porta dello
            studio con le mani dietro la schiena.
          imposta: { consiglio.debito: 1 }
          effetti: { fazione.consiglio: 1, scandalo: 0.5 }

      - testo: "Chiedere che cosa farebbe Ottone se lo sapesse"
        descrizione: "Il creditore siede in Consiglio. Aldous deve averci pensato più di una notte."
        quando: [pista.pelle < 7]
        esito:
          titolo: Il rientro
          testo: |
            «Chiederebbe il rientro il giorno prima del voto sulle licenze»
            dice Aldous, senza bisogno di pensarci. «Oppure non lo
            chiederebbe, e basterebbe a Julia sapere che può farlo.» Ti
            racconta che Ottone le obbligazioni non le tiene nemmeno in città,
            perché gli affari dei Malgrani si amministrano a Ghoran, e che in
            città le porta un procuratore vestito di nero. Gli rispondi che
            andrai a Laresh, e lui annuisce una volta.
          pe: { politica-ed-economia: 3 }
          imposta: { consiglio.debito: 1 }
          effetti: { fazione.consiglio: 1 }

      - testo: "Chiedere chi tiene adesso le obbligazioni"
        descrizione: "Ottone non c'è più, e i beni dei Malgrani sono finiti all'asta. Le obbligazioni, a quanto pare, no."
        quando: [pista.pelle >= 7]
        esito:
          titolo: Intestate a Ghoran
          testo: |
            «All'asta non ci sono andate» dice Aldous. «Erano intestate alla
            casa di Ghoran, e a Ghoran le tiene Urtilia Mendion, con tutto il
            resto che i Malgrani avevano laggiù.» In città, aggiunge, gliele
            porta un procuratore vestito di nero, che è già passato due volte
            a ricordargli la scadenza, sempre con molta cortesia. Gli rispondi
            che andrai a Laresh, e lui annuisce una volta.

            {politica-ed-economia Media} Ottone è caduto e il debito è rimasto
            in piedi. I Castaldi adesso devono il grano a una donna che sta a
            Ghoran e che in Consiglio non ha nessuno da convincere.
          pe: { politica-ed-economia: 3 }
          imposta: { consiglio.debito: 1 }
          effetti: { fazione.consiglio: 1 }

  # ------------------------------------------------------------ passo 8 · la partenza dei carri
  - id: consiglio-i-carri-di-laresh
    immagine: ambientazione/laresh
    titolo: I carri di Laresh
    sommario: "All'alba, nel cortile del Maniero Castaldi, ci sono due carri del Comune con i buoi già attaccati. Quintus Vael ti aspetta sotto il fico."
    luogo: Maniero Castaldi, il cortile, all'alba
    area: quartieri-alti
    requisiti: [fazione.consiglio == 7, consiglio.partito == 0]
    testo: |
      All'alba il cortile del Maniero è grigio, e sotto il fico i buoi dei due
      carri del Comune soffiano nuvole nell'aria fredda. Sui carri non c'è
      niente, a parte una cerata ripiegata e due forche. Quintus Vael sta in
      piedi accanto al primo con l'armatura di cuoio e un carrettiere della
      sua guardia, un uomo magro che non toglie mai il cappello, e quando ti
      vede arrivare guarda il cielo invece di salutarti.

      «Due giorni fino a Laresh e due per tornare» dice. «Al ritorno non
      passate dal ponte del dazio, dove i pesatori della Gilda contano i
      sacchi. Il guado vecchio sul Torvessa è più lungo e più bagnato, e lì
      non conta nessuno.» Ti dà un foglio piegato, con il sigillo di Aldous,
      per il fattore dei Castaldi.

      {armi-da-distanza Media} Il carrettiere tiene una balestra leggera
      carica sotto la cerata, con la sicura tirata. Quintus non porta nessuno
      a fare una strada di grano senza un'arma che tiri da lontano.

      {cavalcare Facile} Nella stalla in fondo al cortile c'è una giumenta
      sellata. Quintus l'ha fatta preparare per te, o per chi tra voi sa
      starci sopra.

      Vesper e Mira Castaldi guardano i buoi dalle finestre del terzo piano
      con il naso schiacciato contro il vetro.
    opzioni:
      - testo: "Partire con i carri"
        descrizione: "A piedi accanto ai buoi, come il carrettiere. Quattro giorni di strada, e il grano al ritorno."
        esito:
          titolo: La strada di Laresh
          testo: |
            Sali sul primo carro accanto al carrettiere, che ti fa posto senza
            togliersi il cappello. Quintus apre il portone del cortile e lo
            richiude alle vostre spalle prima che le ruote abbiano finito di
            uscire. Due giorni dopo, con la schiena rotta dal carro e la
            polvere nei denti, arrivate ai granai dei Castaldi a Laresh.
          imposta: { consiglio.partito: 1 }
          vai: consiglio-guado-del-torvessa
      - testo: "Partire a cavallo davanti ai carri"
        descrizione: "Chi sta in sella vede la strada prima dei buoi, e arriva ai granai in tempo per parlare con il fattore prima che arrivino i carri."
        prova: { attributo: fisico, abilita: cavalcare, difficolta: Media }
        successo:
          titolo: Un giorno di vantaggio
          testo: |
            La giumenta è nervosa per il primo miglio e poi capisce chi
            comanda. Arrivi ai granai di Laresh un giorno prima dei carri, e
            quando i buoi entrano nell'aia il fattore ha già contato i sacchi
            e tu hai già visto chi si aggira intorno alla strada.
          pe: { cavalcare: 5 }
          imposta: { consiglio.partito: 1 }
          effetti: { profondita.consiglio-guado-del-torvessa: 1 }
          vai: consiglio-guado-del-torvessa
        fallimento:
          titolo: La giumenta
          testo: |
            La giumenta ti porta per un miglio dove vuole lei e poi ti lascia
            in un fosso, con un'eleganza che quasi ammiri. Arrivi ai granai di
            Laresh sul carro, insieme ai buoi, con un fianco che ti fa male a
            ogni buca e il carrettiere che guarda la strada con molta
            attenzione per non guardare te.
          imposta: { consiglio.partito: 1 }
          effetti: { ferite: 0.5 }
          vai: consiglio-guado-del-torvessa

  # ------------------------------------------------------------ passo 9 · il grano nel magazzino
  - id: consiglio-il-grano-nel-magazzino
    immagine: fazioni/famiglia-castaldi
    titolo: Il grano nel magazzino
    sommario: "I sacchi di Laresh sono nel seminterrato del Maniero. Stanotte Julia è scesa a cercare una bottiglia, e li ha trovati."
    luogo: Maniero Castaldi, il seminterrato
    area: quartieri-alti
    requisiti: [fazione.consiglio == 8, pista.tribu >= 1]
    testo: |
      Il seminterrato del Maniero è una fila di magazzini a volta, con le
      pareti di pietra chiara annerite dalle lanterne e un odore di vino e di
      cantina. I sacchi di Laresh sono nel magazzino in fondo, impilati fino
      alla volta, con le bilance dei Castaldi stampate in nero sulla tela. Il
      messaggio di Eolio diceva soltanto di scendere. Davanti ai sacchi c'è
      Julia in vestaglia con una lanterna in mano, e accanto a lei Aldous,
      ancora vestito da giorno.

      Litigano a voce bassa, perché i bambini dormono al terzo piano e le
      volte del seminterrato portano i suoni fin sotto i tetti. Julia dice che
      quel grano l'ha promesso al pane della Città Bassa davanti a tutto il
      Consiglio. Aldous le risponde con una cifra, e poi con un'altra, e la
      seconda è il Maniero.

      {politica-ed-economia Media} Lei ha ragione davanti al Consiglio e lui
      ha ragione davanti al notaio. Il guaio è che il Consiglio e il notaio,
      questa volta, vogliono gli stessi sacchi.

      {origine rampollo-dei-quartieri-alti} Hai già sentito litigare così,
      nelle cantine di casa tua, a voce bassa per non svegliare i bambini.
      Allora eri uno dei bambini, e fingevi di dormire.

      Marella scende le scale con uno scialle sulle spalle e si mette fra i
      due, come fa quando in famiglia manca un accordo. Poi si gira verso di
      te. «Tu eri sulla strada» dice. «Dimmi che cosa hai visto, e che cosa
      costa questo grano a chi l'ha portato.»

      {empatia Media} Julia non ti guarda. Ha capito chi ha guidato i carri
      appena ti ha visto sulla scala, e adesso sta decidendo se fidarsi di te
      prima o dopo averti perdonato.
    opzioni:
      - testo: "Dire che il grano deve pagare il debito"
        descrizione: "Il grano paga le obbligazioni, la leva sulla Rappresentante cade, e il pane in Città Bassa resta caro ancora per una stagione."
        esito:
          titolo: La casata
          testo: |
            Racconti la strada e il guado, e poi dici che un Maniero perso non
            aiuterebbe nessuno in città, e la Città Bassa meno di tutti. Julia
            ti ascolta fino in fondo. Poi posa la lanterna su un sacco e dice
            ad Aldous di mandare il grano al notaio domattina, con la stessa
            voce con cui firmerebbe una multa contro se stessa. Aldous chiude
            gli occhi un momento. Per questa stagione il pane della Città
            Bassa resterà caro, e in Municipio qualcuno se ne ricorderà.
          pe: { politica-ed-economia: 3 }
          imposta: { consiglio.grano: 1 }
          effetti: { rep.castaldi: 1, nomea.citta-bassa: -0.5 }
          segue: consiglio-messo-del-sigillo
      - testo: "Dire che il grano deve andare al pane della Città Bassa"
        descrizione: "Il grano va dove Julia l'ha promesso. Il debito resta, e chi tiene le obbligazioni continua a tenerle."
        esito:
          titolo: La città
          testo: |
            Racconti la strada e il guado, e poi dici che in Città Bassa una
            promessa del Comune vale soltanto il giorno che viene mantenuta.
            Julia annuisce una volta. Aldous ti guarda come si guarda un
            creditore nuovo, poi prende la lanterna dalle mani della sorella e
            sale le scale senza salutare nessuno. I carri del Comune ripartono
            all'alba con i sacchi, e la settimana dopo il pane della Città
            Bassa costa un poco meno. Aldous, da quel giorno, non ti saluta
            più.
          pe: { empatia: 3 }
          imposta: { consiglio.grano: 2 }
          effetti: { nomea.citta-bassa: 1 }
          segue: consiglio-messo-del-sigillo
      - testo: "Proporre metà al debito e una dilazione per il resto"
        descrizione: "Con abbastanza sacchi si può pagare una parte e chiedere tempo per il resto, a patto di saper scrivere la proposta in modo che il notaio la accetti."
        requisiti: [consiglio.carri-persi <= 1]
        prova: { attributo: mentale, abilita: politica-ed-economia, difficolta: Difficile }
        successo:
          titolo: A metà
          testo: |
            Ti fai dare un foglio e scrivi la proposta sul coperchio di una
            botte, con Aldous che ti detta le scadenze e Julia che ti corregge
            le parole. Metà del grano al notaio per le obbligazioni più
            vicine, e il resto ai forni della Città Bassa, con una dilazione
            per il saldo fino al raccolto dell'anno prossimo. Quando hai
            finito i due fratelli leggono il foglio insieme, con le teste
            vicine sotto la lanterna, e per la prima volta stanotte non
            litigano.

            {politica-ed-economia Difficile} Una dilazione toglie al creditore
            la scadenza, e senza la scadenza la leva sulla Rappresentante si
            accorcia di molto.
          pe: { politica-ed-economia: 6 }
          imposta: { consiglio.grano: 3 }
          effetti: { rep.castaldi: 0.5, nomea.citta-bassa: 0.5 }
          segue: consiglio-messo-del-sigillo
        fallimento:
          titolo: La proposta sul coperchio
          testo: |
            Scrivi la proposta sul coperchio di una botte, e Aldous ci trova
            un buco alla seconda riga. Il notaio di Ghoran non accetterebbe
            mai una dilazione scritta così. Julia ti toglie il foglio di mano
            con gentilezza e decide da sola. Il grano va ai forni della Città
            Bassa, e il debito resta dov'è. Aldous sale le scale senza
            salutare nessuno, e da quel giorno non saluta più nemmeno te.
          imposta: { consiglio.grano: 2 }
          effetti: { nomea.citta-bassa: 1, scandalo: 0.5 }
          segue: consiglio-messo-del-sigillo

      - testo: "Dire quanto costa il pane nei vicoli"
        descrizione: "Il prezzo del pane in Città Bassa lo sai a memoria, perché l'hai pagato per tutta l'infanzia. Lo sa anche Julia, ma da un registro."
        quando: [origine.figlio-della-citta-bassa >= 1]
        esito:
          titolo: Il prezzo di una pagnotta
          testo: |
            Non racconti la strada. Dici il prezzo di una pagnotta in Città
            Bassa quest'inverno e quello dell'inverno scorso, e poi il nome
            del forno dove li hai pagati. Julia ti guarda per la prima volta
            da quando sei sceso. Aldous apre la bocca e la richiude. I sacchi
            ripartono all'alba per i forni della Città Bassa, e il debito
            resta dov'è. Aldous, da quel giorno, non ti saluta più.
          pe: { empatia: 3 }
          imposta: { consiglio.grano: 2 }
          effetti: { nomea.citta-bassa: 1 }
          segue: consiglio-messo-del-sigillo
      - testo: "Dire quanto costa un maniero perso"
        descrizione: "Hai visto che cosa resta di una casata quando i creditori arrivano al portone. Nei Quartieri Alti le case perse non si dimenticano."
        quando: [origine.rampollo-dei-quartieri-alti >= 1]
        esito:
          titolo: Le case perse
          testo: |
            Racconti di una casa dei Quartieri Alti che hai visto svuotare da
            bambino, una stanza alla volta, mentre i figli giocavano in
            cortile con i mobili già venduti. Marella si stringe lo scialle.
            Julia resta in silenzio a lungo, poi dice ad Aldous di mandare il
            grano al notaio domattina. Per questa stagione il pane della Città
            Bassa resterà caro, e in Municipio qualcuno se ne ricorderà.
          pe: { politica-ed-economia: 3 }
          imposta: { consiglio.grano: 1 }
          effetti: { rep.castaldi: 1, nomea.citta-bassa: -0.5 }
          segue: consiglio-messo-del-sigillo

  # ------------------------------------------------------------ grado III · messo del sigillo
  - id: consiglio-messo-del-sigillo
    immagine: personaggi/quintus-vael
    titolo: Il messo del sigillo
    tipo: seguito
    luogo: Maniero Castaldi, il cortile
    area: quartieri-alti
    requisiti: [fazione.consiglio == 8]
    testo: |
      Il mattino dopo Julia ti aspetta in cortile, sotto il fico, già vestita
      per il Municipio. Accanto a lei c'è Quintus Vael, con un fagotto di
      cuoio sotto il braccio. Dal portone aperto si sentono i buoi dei carri
      del Comune, che qualcuno sta attaccando di nuovo.

      «D'ora in poi, quando non posso esserci io, parli tu» dice Julia. «Al
      Municipio, alla Casa dei Nodi e dove ti mando. Quello che dici lo firmo
      io.» Poi guarda le finestre dello studio, al secondo piano, dove la
      lampada di Aldous è ancora accesa, e aggiunge che suo fratello ha
      comprato un cassetto nuovo con la serratura, e che va bene così.

      {intimidire Media} Parlare a nome della Rappresentante vuol dire che chi
      ti sbatte la porta in faccia la sbatte in faccia a lei. Lo sanno tutti,
      e quasi nessuno avrà il coraggio di provarci.

      Quintus scioglie il fagotto e ti mostra un corpetto di cuoio bollito,
      con le bilance incrociate impresse sul petto. «La mia scorta lo porta
      così» dice. «All'alba, nel cortile, ci alleniamo. Se parli per lei, ti
      voglio lì almeno una volta alla settimana.»

      {armi-da-mischia Media} Il cuoio è tagliato stretto sotto le ascelle,
      per lasciare libero il braccio della spada. Quintus pensa prima a come
      ci si difende e poi a come si sta in piedi alle cerimonie.
    opzioni:
      - testo: "Indossare il cuoio della Guardia"
        descrizione: "Il cuoio della scorta di Quintus e il cortile all'alba, con la voce di Julia quando lei non c'è."
        immagine: icone/leather-armor
        esito:
          titolo: Messo del sigillo
          testo: |
            Ti infili il corpetto sopra la camicia, e Quintus te lo stringe ai
            fianchi con due strattoni, come si sella un cavallo. Ti sta bene,
            e ti sorprende quanto poco pesi. Julia ti guarda un momento con la
            testa piegata da una parte, poi si avvia verso il portone, perché
            in Municipio la panca è già piena. Quintus ti dice che domani
            all'alba cominciate dalle parate.
          pe: { armi-da-mischia: 3 }
          almeno: { rep.castaldi: 6 }
          effetti: { fazione.consiglio: 1, oggetto.consiglio-cuoio-della-guardia: 1 }
      - testo: "Chiedere a Julia che cosa ne pensa di quello che hai deciso"
        descrizione: "Stanotte hai deciso del grano della sua casa. Prima di parlare a nome suo, forse vuoi sapere se è ancora d'accordo."
        esito:
          titolo: La sua firma
          testo: |
            Julia ci pensa mentre Quintus ti stringe il cuoio ai fianchi. «Hai
            deciso una cosa che non volevo decidere io» dice. «Per questo ti
            tengo. Quando sbaglierai sarà la mia firma, e ci penserò io a
            ricordartelo.» Poi si avvia verso il portone, perché in Municipio
            la panca è già piena, e Quintus ti dice che domani all'alba
            cominciate dalle parate.

            {empatia Media} Non ti ha detto se era d'accordo. Ti ha detto che
            ti tiene, e da lei vale di più.
          pe: { empatia: 3 }
          almeno: { rep.castaldi: 6 }
          effetti: { fazione.consiglio: 1, oggetto.consiglio-cuoio-della-guardia: 1 }

  # ------------------------------------------------------------ passo 10 · l'idromele delle dieci
  - id: consiglio-l-idromele-delle-dieci
    presso: municipio
    immagine: personaggi/ettore-castaldi
    titolo: L'idromele delle dieci
    sommario: "Tullio ti aspetta sulla scalinata con gli occhiali in mano. Un procuratore vestito di nero ha chiesto quando c'è seduta, e se in seduta si può parlare di famiglia."
    luogo: Municipio, la scalinata
    area: quartieri-alti
    requisiti: [fazione.consiglio == 9, pista.tribu >= 1, segreto.ettore == 0]
    testo: |
      Tullio Merga ti ferma sulla scalinata prima che tu arrivi alla porta,
      con gli occhiali in mano e la voce bassa. Stamattina in anticamera è
      salito un procuratore vestito di nero, con il colletto alto e una
      cartella di cuoio sotto il braccio, che si chiama Tebaldo Ronchi e cura
      in città gli affari dei Malgrani di Ghoran. Ha chiesto la data della
      prossima seduta e se in seduta, quando ci sono di mezzo le famiglie dei
      consiglieri, si possono portare testimoni.

      {galateo Media} Un procuratore non chiede delle regole delle sedute. Le
      sa a memoria, e se le chiede ad alta voce in anticamera vuole che la
      domanda arrivi a qualcuno.

      Poco dopo, al bancone di Tullio, arriva un biglietto senza firma da Via
      del Salmone, scritto con la grafia tonda di Sara Beck. Dice che il
      signore in nero è passato alla Maison des Lunes tre sere di fila, e che
      ha pagato da bere a uno sguattero per sapere chi, fra i clienti, ha il
      libretto dei conti più lungo. In fondo, sottolineato due volte, c'è il
      nome di Ettore Castaldi.

      {origine figlio-della-citta-bassa} Uno sguattero pagato da bere è un
      testimone che costa poco e parla tanto. Nei vicoli lo sanno tutti, e chi
      lo paga di solito lo sa meglio degli altri.

      Ettore lo trovi alla Birreria del Paladino Stanco, alle dieci del
      mattino, con un boccale di idromele davanti.
    opzioni:
      - testo: "Andare alla Birreria del Paladino Stanco"
        descrizione: "Ettore apre la Birreria alle nove, e alle dieci è già al secondo boccale."
        immagine: personaggi/ettore-castaldi
        esito:
          titolo: Le dieci del mattino
          testo: |
            Scendi in Città Bassa con il biglietto di Sara in tasca. Alla
            Birreria le imposte sono socchiuse e il pavimento è ancora bagnato
            della lavata del mattino, e nella sala vuota l'unico rumore è il
            boccale di Ettore che torna sul tavolo.
          segue: consiglio-il-libretto-di-ettore

  - id: consiglio-l-idromele-delle-dieci-noto
    presso: municipio
    immagine: personaggi/ettore-castaldi
    titolo: L'idromele delle dieci
    sommario: "Tullio ti aspetta sulla scalinata. Un procuratore vestito di nero ha chiesto delle sedute e dei testimoni, e tu sai già dove Ettore Castaldi passa le notti."
    luogo: Municipio, la scalinata
    area: quartieri-alti
    requisiti: [fazione.consiglio == 9, pista.tribu >= 1, segreto.ettore >= 1]
    testo: |
      Tullio Merga ti ferma sulla scalinata con gli occhiali in mano e la voce
      bassa. Stamattina in anticamera è salito un procuratore vestito di nero,
      con il colletto alto e una cartella di cuoio sotto il braccio, che si
      chiama Tebaldo Ronchi e cura in città gli affari dei Malgrani di Ghoran.
      Ha chiesto la data della prossima seduta e se in seduta, quando ci sono
      di mezzo le famiglie dei consiglieri, si possono portare testimoni.

      Hai già capito prima che Tullio abbia finito. Dove passa le
      notti Ettore Castaldi lo sai da quando sei stato alla Maison des Lunes,
      e lo sa Sara Beck, che di chi entra si ricorda per anni. Adesso, a
      quanto pare, lo sa anche un procuratore di Ghoran, e se lo sa lui lo
      saprà il Consiglio.

      {politica-ed-economia Media} Un cugino della Rappresentante con il
      libretto dei conti aperto alla Maison, letto in seduta da un testimone.
      È lo scandalo che serve a chi vuole Julia senza maggioranza, e non costa
      niente.

      {empatia Facile} Tullio non sa niente della Maison. Sa soltanto che il
      signore in nero gli ha sorriso, e che i sorrisi così, al bancone, li ha
      visti soltanto prima delle multe.

      Ettore lo trovi alla Birreria del Paladino Stanco, alle dieci del
      mattino, con un boccale di idromele davanti. Questa volta sai già che
      cosa dirgli, e non sai come.
    opzioni:
      - testo: "Andare dritto alla Birreria"
        descrizione: "Sai dove beve di giorno e dove va di notte. Conviene trovarlo prima di Ronchi."
        immagine: personaggi/ettore-castaldi
        esito:
          titolo: Prima di Ronchi
          testo: |
            Scendi in Città Bassa quasi di corsa. Alla Birreria le imposte
            sono socchiuse e il pavimento è ancora bagnato della lavata del
            mattino. Ettore alza gli occhi dal boccale e capisce dalla tua
            faccia che non sei venuto per l'idromele.
          segue: consiglio-il-libretto-di-ettore

  - id: consiglio-il-libretto-di-ettore
    immagine: personaggi/ettore-castaldi
    titolo: Il libretto di Ettore
    tipo: seguito
    luogo: Città Bassa, la Birreria del Paladino Stanco
    area: citta-bassa
    requisiti: [fazione.consiglio == 9]
    testo: |
      La Birreria del Paladino Stanco a quest'ora è vuota, con le sedie ancora
      capovolte sui tavoli e l'odore dolce del mosto che sale dalla cantina.
      Sopra il bancone è appesa l'armatura di Ettore, lucidata come se dovesse
      indossarla domattina, e sotto l'armatura, di traverso su due ganci, c'è
      la sua spada lunga. Ettore siede al tavolo vicino alla finestra, in
      maniche di camicia, con il boccale di idromele e la barba pettinata.

      Gli racconti del procuratore in nero, e lui ti ascolta senza
      interromperti, guardando il boccale. Il libretto dei conti della Maison
      lo tiene Sara Beck al bancone d'ingresso, e lo sguattero pagato da bere
      è pronto a dire in seduta quante sere a settimana il cugino della
      Rappresentante passa in Via del Salmone.

      {medicina Media} Le mani sono ferme e la barba è curata, ma sul collo ha
      le venuzze rotte di chi beve ogni giorno da anni. Uno che regge così
      bene lo fa da troppo tempo.

      {origine accolito-del-velo} Sul pomo della spada c'è la foglia rossa
      dell'Albero, smaltata. In Cattedrale ti hanno insegnato che un paladino
      che appende la spada la consegna al Velo, e questa al Velo non è mai
      arrivata.

      «Julia non lo sa» dice Ettore alla fine, e lo dice al boccale. «Non l'ha
      mai saputo nessuno della famiglia. Io mi sono sempre detto che non era
      materia del Consiglio.»
    opzioni:
      - testo: "Farti dare il libretto da Sara Beck e portarlo a Julia"
        descrizione: "Sara tiene i conti di tutti, e un libretto in mano alla Rappresentante non può più finire in mano a Ronchi. Julia però lo userà."
        immagine: personaggi/sara-beck
        prova: { attributo: sociale, abilita: [galateo, persuasione], difficolta: Media }
        successo:
          titolo: La leva
          testo: |
            Sara Beck ti ascolta al bancone d'ingresso, con le dita sulla
            chiave dell'armadio delle armi. Alla fine stacca una alla volta le
            pagine di Ettore con un coltello da carta e te le dà dicendo che
            alla Maison i conti dei clienti non escono mai, e che questa è la
            prima volta. Le porti a Julia la sera stessa. Lei le legge in
            piedi, poi le chiude nel cassetto con la chiave. «Ci vuole una
            seduta» dice, «e prima ci vuole la sedia dei Tarvelin.» Del cugino
            non dice niente, e alla Maison, la settimana dopo, arriva un
            controllo del Comune.

            {politica-ed-economia Media} Adesso Julia ha un motivo suo per
            occuparsi della Maison, e un'arma di cui in Consiglio non sospetta
            nessuno. Che cosa ne farà, non lo sa nemmeno lei.
          pe: { persuasione: 5 }
          imposta: { consiglio.ettore: 1 }
          effetti: { fazione.consiglio: 1, rep.castaldi: 0.5, rep.maison: -1 }
        fallimento:
          titolo: L'armadio delle armi
          testo: |
            Sara Beck ti ascolta con le dita sulla chiave dell'armadio delle
            armi, e quando hai finito ti dice con la sua voce allegra che alla
            Maison i conti dei clienti non escono mai, nemmeno per la
            Rappresentante. Ti accompagna alla porta chiamandoti per nome.
            Torni alla Birreria, ed Ettore è al terzo boccale.
          effetti: { scandalo: 1 }

      - testo: "Chiedere il libretto a Nerissa Dalvane"
        descrizione: "Nerissa ti conosce, e nella sua casa decidono le ragazze. Un libretto letto in seduta danneggerebbe la Maison prima ancora di Ettore."
        immagine: personaggi/nerissa-dalvane
        requisiti: [rep.maison >= 3]
        esito:
          titolo: Le pagine staccate
          testo: |
            Nerissa ti riceve nel salotto con le tende tirate e ti ascolta
            senza alzare la voce, come sempre. Poi chiama Sara e si fa portare
            il libretto, ne stacca le pagine di Ettore con le sue mani e te le
            consegna piegate. «Meglio in un cassetto del Municipio che in una
            cartella di cuoio» dice. Le porti a Julia la sera stessa. Lei le
            legge in piedi, le chiude nel cassetto con la chiave e dice che ci
            vuole una seduta, e prima la sedia dei Tarvelin. La settimana
            dopo, alla Maison, arriva lo stesso un controllo del Comune, e
            Nerissa non te lo rimprovera.
          pe: { galateo: 3 }
          imposta: { consiglio.ettore: 1 }
          effetti: { fazione.consiglio: 1, rep.castaldi: 0.5, rep.maison: -1 }

      - testo: "Comprare il silenzio dello sguattero"
        descrizione: "Lo sguattero parla perché Ronchi paga da bere. Chi paga di più compra la sua memoria, finché dura."
        requisiti: [monete >= 40]
        esito:
          titolo: Una memoria corta
          testo: |
            Lo sguattero lo trovi nel cortile della Maison, a svuotare i
            secchi. Gli metti in mano una borsa e gli spieghi che cosa non si
            ricorderà, e lui annuisce con la faccia di un ragazzo che non ha
            mai visto tante monete insieme. Il giorno dopo sale in Municipio
            al posto suo una lettera di Ronchi, che rinuncia ai testimoni con
            molta cortesia. Di tutto questo non sapranno niente né Julia né
            Ettore.

            {conoscenze-della-strada Media} Una memoria comprata resta in
            vendita. Ronchi lo sa, e sa anche a chi rivolgersi per ricomprarla.
          imposta: { consiglio.ettore: 2 }
          effetti: { fazione.consiglio: 1, rep.castaldi: 0.5, monete: -40, sospetto: 1 }

      - testo: "Convincere Ettore ad andare lui da Julia"
        descrizione: "Se lo dice lui alla cugina, il libretto di Ronchi non vale più niente. Ettore però non le ha mai detto niente, da quando ha appeso la spada."
        prova: { attributo: sociale, abilita: empatia, difficolta: Difficile }
        successo:
          titolo: La spada sotto l'armatura
          testo: |
            Non gli parli della Maison. Gli parli dell'armatura sopra il
            bancone, e del perché la lucida ogni settimana se non deve più
            metterla. Ettore resta a lungo zitto, poi spinge il boccale in
            mezzo al tavolo e si alza. Prima di uscire stacca la spada dai
            ganci e te la mette in mano. «Questa la tenevo per il giorno in
            cui avrei avuto il coraggio» dice. «Il coraggio, a quanto pare, me
            l'hai portato tu, e io non ne ho bisogno per salire una scala.» Va
            in Municipio da solo. Julia la sera ti dice soltanto che ci vuole
            una seduta, e prima la sedia dei Tarvelin, e ha gli occhi rossi.

            {empatia Difficile} Per un po' Ettore non berrà. Durerà quanto
            durerà, e lui lo sa. Oggi però ha salito le scale del Municipio da
            sobrio.
          pe: { empatia: 6 }
          imposta: { consiglio.ettore: 3 }
          effetti: { fazione.consiglio: 1, rep.castaldi: 0.5, rep.maison: 0.5, oggetto.consiglio-spada-del-paladino: 1 }
        fallimento:
          titolo: Il terzo boccale
          testo: |
            Gli parli della cugina e della famiglia, e a ogni parola Ettore si
            chiude un poco di più, finché non si alza a lavare un bicchiere
            che era già pulito. Alla fine il libretto lo vai a prendere tu, da
            Sara Beck, che stacca le pagine con un coltello da carta e te le
            dà senza sorridere. Julia le legge in piedi e le chiude nel
            cassetto. Dice che ci vuole una seduta, e prima la sedia dei
            Tarvelin. Alla Maison, la settimana dopo, arriva un controllo del
            Comune.
          imposta: { consiglio.ettore: 1 }
          effetti: { fazione.consiglio: 1, rep.maison: -1, scandalo: 0.5 }
