# Quest del Consiglio, secondo atto (fazione.consiglio 6 → 10). Si apre con pista.tribu >= 1.
# - passo 7 `consiglio-il-bilancio-di-aldous` (fazione.consiglio == 6, Maniero Castaldi): Aldous mostra il bilancio
#   parallelo. Le obbligazioni di grano firmate per i coloni di Laresh negli anni di magra sono intestate alla casa
#   dei Malgrani e maturano in questa stagione; dopo la caduta di Ottone (pista.pelle >= 7) le tiene Urtilia a
#   Ghoran. Aldous vuole pagare con il raccolto delle terre di Laresh, che Julia ha promesso al pane della Città
#   Bassa, e ti chiede di scortarlo. Ogni via chiude il passo e dà consiglio.debito 1.
# - passo 8 `consiglio-i-carri-di-laresh` (fazione.consiglio == 7, consiglio.partito == 0): la partenza, con
#   `vai: consiglio-guado-del-torvessa` (spedizione-guado.yaml). A cavallo si parte un passo più avanti. La pista
#   sale al cuore della spedizione.
# - passo 9 `consiglio-il-grano-nel-magazzino` (fazione.consiglio == 8): Julia trova il grano. consiglio.grano: 1 la
#   casata paga il debito, 2 il grano va al pane della Città Bassa, 3 a metà con una dilazione (Politica ed economia
#   Difficile, solo con al massimo un carro perso; se fallisce vale 2). Il Figlio della Città Bassa e il Rampollo
#   hanno un argomento loro. Ogni via porta al seguito del grado III `consiglio-messo-del-sigillo`.
# - passo 10: due ingressi secondo segreto.ettore (la Maison lo dà al suo passo 4): `consiglio-l-idromele-delle-dieci`
#   (0, la notizia arriva da Tullio e da Sara Beck) e `consiglio-l-idromele-delle-dieci-noto` (>= 1, sai già dove
#   Ettore passa le notti). Tutti e due portano al seguito `consiglio-il-libretto-di-ettore`: Tebaldo Ronchi, che
#   cura in città gli affari dei Malgrani di Ghoran, ha un testimone e vuole uno scandalo. consiglio.ettore: 1 il
#   libretto a Julia (rep.maison −1), 2 il silenzio del testimone comprato, 3 Ettore va dalla cugina (Empatia
#   Difficile, la spada del paladino). Con rep.maison >= 3 il libretto te lo dà Nerissa. Se fallisce la prova con
#   Sara Beck la scena si riapre dall'ingresso.
storylet:
  # ------------------------------------------------------------ passo 7 · il bilancio di Aldous
  - id: consiglio-il-bilancio-di-aldous
    immagine: fazioni/famiglia-castaldi
    titolo: Il bilancio di Aldous
    sommario: "Una busta senza firma con le bilance dei Castaldi nella ceralacca ti dà un'ora e una porta di servizio."
    luogo: Maniero Castaldi, lo studio di Aldous
    area: quartieri-alti
    requisiti: [fazione.consiglio == 6, pista.tribu >= 1]
    testo: |
      Eolio Drest ti accompagna per le scale dei valletti fino allo studio di
      Aldous Castaldi, una stanza stretta piena di registri in tela grigia.

      Aldous ha pochi anni più di Julia e ne dimostra dieci di più. Apre sulla
      scrivania un registro di cuoio. «Mia sorella riceve in Municipio, e io
      qui» dice a voce bassa. «Di solito ricevo i creditori.»

      Negli anni di magra la casata ha firmato obbligazioni di grano per
      sfamare i coloni di Laresh e di Pannion, intestate ai Malgrani davanti a
      un notaio di Ghoran, che maturano prima dell'inverno. Il raccolto di
      famiglia a Laresh ne pagherebbe una parte, ma Julia l'ha promesso al
      pane della Città Bassa.

      «Vorrei che lei non lo sapesse finché il grano non è in cantina. Mi
      serve qualcuno senza la livrea di casa, che vada a Laresh prima che il
      creditore lo sappia» dice.
    opzioni:
      - testo: "Leggere il bilancio fino in fondo"
        descrizione: "Il registro di cuoio ha più pagine di quelle che Aldous ti mostra, e le ultime contano."
        prova: { attributo: mentale, abilita: politica-ed-economia, difficolta: Media }
        successo:
          titolo: L'ultima colonna
          testo: |
            Volti le pagine. Nelle ultime c'è un bilancio compilato a mano ogni
            mese, dove il creditore chiede il rientro di tutto, e in fondo alla
            colonna c'è il Maniero intero, con una cifra sola. Aldous ti dice che
            quella pagina la rifà da tre anni e che sua sorella non l'ha mai
            vista. Gli dici che andrai a Laresh, e lui ti stringe la mano più a
            lungo.
          pe: { politica-ed-economia: 5 }
          imposta: { consiglio.debito: 1 }
          effetti: { fazione.consiglio: 1, rep.castaldi: 0.5 }
        fallimento:
          titolo: Le colonne grigie
          testo: |
            Dopo la terza pagina le cifre ti si confondono davanti agli occhi, e
            Aldous chiude il registro e ti dice soltanto che il debito è grande e
            la stagione è questa. Gli rispondi che andrai a Laresh, e lui annuisce
            come si annuisce a un fornitore.
          imposta: { consiglio.debito: 1 }
          effetti: { fazione.consiglio: 1, scandalo: 0.5 }

      - testo: "Chiedergli perché l'ha nascosto a Julia"
        descrizione: "Un fratello non nasconde un debito alla sorella senza un motivo, e il motivo forse è lei."
        prova: { attributo: sociale, abilita: empatia, difficolta: Media }
        successo:
          titolo: Lui filtra, lei decide
          testo: |
            La sera, quando Julia rientra dal Municipio, è Aldous a dirle quello
            che vale la pena sapere. Due volte le ha proposto di saldare in
            perdita, e due volte lei ha detto di no. «Se le mostro questo, lo
            trasforma in una battaglia, e le battaglie di Julia le paga la casa»
            dice. Gli rispondi che andrai a Laresh, e per la prima volta Aldous si
            siede.
          pe: { empatia: 5 }
          imposta: { consiglio.debito: 1 }
          effetti: { fazione.consiglio: 1, rep.castaldi: 0.5 }
        fallimento:
          titolo: Una frase di suo padre
          testo: |
            Glielo chiedi troppo presto, e Aldous ti risponde con una frase che
            doveva essere di suo padre, sulla casata che firma promesse e le
            mantiene. Poi ti chiede soltanto se vai a Laresh, e quando rispondi di
            sì ti accompagna alla porta.
          imposta: { consiglio.debito: 1 }
          effetti: { fazione.consiglio: 1, scandalo: 0.5 }

      - testo: "Chiedere che cosa farebbe Ottone se lo sapesse"
        descrizione: "Il creditore siede in Consiglio. Aldous deve averci pensato più di una notte."
        quando: [pista.pelle < 7]
        esito:
          titolo: Il rientro
          testo: |
            «Chiederebbe il rientro il giorno prima del voto sulle licenze» dice
            Aldous senza pensarci. «Oppure non lo chiederebbe, e a Julia
            basterebbe sapere che può farlo.» Gli affari dei Malgrani si
            amministrano a Ghoran, e in città le obbligazioni le porta un
            procuratore vestito di nero. Gli rispondi che andrai a Laresh, e lui
            annuisce una volta.
          pe: { politica-ed-economia: 3 }
          imposta: { consiglio.debito: 1 }
          effetti: { fazione.consiglio: 1 }

      - testo: "Chiedere chi tiene adesso le obbligazioni"
        descrizione: "Ottone non c'è più, e i beni dei Malgrani sono finiti all'asta. Le obbligazioni, a quanto pare, no."
        quando: [pista.pelle >= 7]
        esito:
          titolo: Intestate a Ghoran
          testo: |
            «All'asta non ci sono andate» dice Aldous. «Erano intestate alla casa
            di Ghoran, e a Ghoran le tiene Urtilia Mendion con tutto il resto che
            i Malgrani avevano laggiù.» In città gliele porta un procuratore
            vestito di nero, che è già passato due volte a ricordargli la
            scadenza, con molta cortesia. Gli rispondi che andrai a Laresh, e lui
            annuisce una volta.
          pe: { politica-ed-economia: 3 }
          imposta: { consiglio.debito: 1 }
          effetti: { fazione.consiglio: 1 }

  # ------------------------------------------------------------ passo 8 · la partenza dei carri
  - id: consiglio-i-carri-di-laresh
    immagine: ambientazione/laresh
    titolo: I carri di Laresh
    sommario: "All'alba due carri del Comune aspettano nel cortile del Maniero, e Quintus Vael ti aspetta sotto il fico."
    luogo: Maniero Castaldi, il cortile, all'alba
    area: quartieri-alti
    requisiti: [fazione.consiglio == 7, consiglio.partito == 0]
    testo: |
      All'alba, sotto il fico del cortile, i buoi dei due carri del Comune
      soffiano nuvole nell'aria fredda. Quintus Vael aspetta accanto al primo
      con un carrettiere della sua guardia, un uomo magro che non toglie mai
      il cappello. Dalle finestre del terzo piano Vesper e Mira Castaldi
      guardano i buoi con il naso contro il vetro.

      «Due giorni fino a Laresh e due per tornare» dice. «Al ritorno prendete
      il guado vecchio sul Torvessa, che è più lungo, perché al ponte del
      dazio i pesatori della Gilda contano i sacchi.» Ti dà un foglio con il
      sigillo di Aldous per il fattore dei Castaldi, e ti indica nella stalla
      una giumenta sellata.

      {armi-da-distanza Media} Il carrettiere tiene una balestra leggera
      carica sotto la cerata. Quintus non porta nessuno su una strada di grano
      senza un'arma che tiri da lontano.
    opzioni:
      - testo: "Partire con i carri"
        descrizione: "A piedi accanto ai buoi, come il carrettiere. Quattro giorni di strada, e il grano al ritorno."
        esito:
          titolo: La strada di Laresh
          testo: |
            Sali sul primo carro accanto al carrettiere, e Quintus richiude il
            portone alle vostre spalle prima che le ruote abbiano finito di
            uscire. Due giorni dopo, con la schiena rotta e la polvere nei denti,
            arrivate ai granai dei Castaldi a Laresh.
          imposta: { consiglio.partito: 1 }
          vai: consiglio-guado-del-torvessa
      - testo: "Partire a cavallo davanti ai carri"
        descrizione: "In sella vedi la strada prima dei buoi, e parli con il fattore prima che arrivino i carri."
        prova: { attributo: fisico, abilita: cavalcare, difficolta: Media }
        successo:
          titolo: Un giorno di vantaggio
          testo: |
            La giumenta è nervosa per il primo miglio, poi capisce chi comanda.
            Arrivi a Laresh un giorno prima dei carri, e quando i buoi entrano
            nell'aia il fattore ha già contato i sacchi e tu hai già visto chi si
            aggira lungo la strada.
          pe: { cavalcare: 5 }
          imposta: { consiglio.partito: 1 }
          effetti: { profondita.consiglio-guado-del-torvessa: 1 }
          vai: consiglio-guado-del-torvessa
        fallimento:
          titolo: La giumenta
          testo: |
            La giumenta ti porta per un miglio dove vuole lei e poi ti lascia in
            un fosso, con un'eleganza che quasi ammiri. Arrivi a Laresh sul carro,
            con un fianco che duole a ogni buca.
          imposta: { consiglio.partito: 1 }
          effetti: { ferite: 0.5 }
          vai: consiglio-guado-del-torvessa

  # ------------------------------------------------------------ passo 9 · il grano nel magazzino
  - id: consiglio-il-grano-nel-magazzino
    immagine: fazioni/famiglia-castaldi
    titolo: Il grano nel magazzino
    sommario: "Stanotte Julia è scesa nel seminterrato del Maniero a cercare una bottiglia, e ha trovato i sacchi di Laresh."
    luogo: Maniero Castaldi, il seminterrato
    area: quartieri-alti
    requisiti: [fazione.consiglio == 8, pista.tribu >= 1]
    testo: |
      Il seminterrato del Maniero è una fila di magazzini a volta che odorano
      di vino, e nell'ultimo i sacchi di Laresh sono impilati fino alla volta,
      con le bilance dei Castaldi stampate sulla tela. Il messaggio di Eolio
      diceva soltanto di scendere. Davanti ai sacchi c'è Julia in vestaglia
      con una lanterna, e accanto a lei Aldous, ancora vestito da giorno.

      Litigano a voce bassa, perché i bambini dormono al terzo piano e le
      volte portano i suoni fin sotto i tetti. Julia dice che quel grano l'ha
      promesso al pane della Città Bassa davanti a tutto il Consiglio. Aldous
      le risponde con una cifra, e poi con un'altra, e la seconda è il
      Maniero.

      {politica-ed-economia Media} Lei ha ragione davanti al Consiglio e lui
      davanti al notaio, e questa volta il Consiglio e il notaio vogliono gli
      stessi sacchi.

      {origine rampollo-dei-quartieri-alti} Hai già sentito litigare così,
      nelle cantine di casa tua, a voce bassa per non svegliare i bambini;
      allora eri uno dei bambini, e fingevi di dormire.

      Marella scende le scale con uno scialle sulle spalle e si mette fra i
      due, poi si gira verso di te. «Tu eri sulla strada» dice. «Dimmi che
      cosa hai visto, e che cosa costa questo grano a chi l'ha portato.»
    opzioni:
      - testo: "Dire che il grano deve pagare il debito"
        descrizione: "Il grano paga le obbligazioni e la leva sulla Rappresentante cade, ma il pane in Città Bassa resta caro."
        esito:
          titolo: La casata
          testo: |
            Racconti la strada e il guado, e poi dici che un Maniero perso non
            aiuterebbe nessuno, la Città Bassa meno di tutti. Julia posa la
            lanterna su un sacco e dice ad Aldous di mandare il grano al notaio
            domattina, con la voce con cui firmerebbe una multa contro se stessa.
            Per questa stagione il pane della Città Bassa resterà caro, e in
            Municipio qualcuno se ne ricorderà.
          pe: { politica-ed-economia: 3 }
          imposta: { consiglio.grano: 1 }
          effetti: { rep.castaldi: 1, nomea.citta-bassa: -0.5 }
          segue: consiglio-messo-del-sigillo
      - testo: "Dire che il grano deve andare al pane della Città Bassa"
        descrizione: "Il grano va dove Julia l'ha promesso. Il debito resta, e chi tiene le obbligazioni continua a tenerle."
        esito:
          titolo: La città
          testo: |
            Racconti la strada e il guado, e poi dici che in Città Bassa una
            promessa del Comune vale soltanto il giorno che viene mantenuta. Julia
            annuisce una volta. Aldous prende la lanterna dalle mani della sorella
            e sale le scale senza salutare, e da quel giorno non saluta più
            nemmeno te. I carri ripartono all'alba, e la settimana dopo il pane
            della Città Bassa costa un poco meno.
          pe: { empatia: 3 }
          imposta: { consiglio.grano: 2 }
          effetti: { nomea.citta-bassa: 1 }
          segue: consiglio-messo-del-sigillo
      - testo: "Proporre metà al debito e una dilazione per il resto"
        descrizione: "Una parte del grano al debito e una dilazione per il resto, se la proposta convince il notaio."
        requisiti: [consiglio.carri-persi <= 1]
        prova: { attributo: mentale, abilita: politica-ed-economia, difficolta: Difficile }
        successo:
          titolo: A metà
          testo: |
            Scrivi la proposta sul coperchio di una botte, con Aldous che detta le
            scadenze e Julia che corregge le parole. Metà del grano va al notaio
            per le obbligazioni più vicine e il resto ai forni della Città Bassa,
            con una dilazione fino al raccolto dell'anno prossimo. I due fratelli
            leggono il foglio con le teste vicine sotto la lanterna, e per la
            prima volta stanotte non litigano.
          pe: { politica-ed-economia: 6 }
          imposta: { consiglio.grano: 3 }
          effetti: { rep.castaldi: 0.5, nomea.citta-bassa: 0.5 }
          segue: consiglio-messo-del-sigillo
        fallimento:
          titolo: La proposta sul coperchio
          testo: |
            Aldous trova un buco alla seconda riga della tua proposta, una
            dilazione che il notaio di Ghoran non accetterebbe mai. Julia ti
            toglie il foglio di mano con gentilezza e decide da sola, e il grano
            va ai forni della Città Bassa. Aldous sale le scale senza salutare, e
            da quel giorno non saluta più nemmeno te.
          imposta: { consiglio.grano: 2 }
          effetti: { nomea.citta-bassa: 1, scandalo: 0.5 }
          segue: consiglio-messo-del-sigillo

      - testo: "Dire quanto costa il pane nei vicoli"
        descrizione: "Il prezzo del pane in Città Bassa lo sai a memoria, e Julia lo sa da un registro."
        quando: [origine.figlio-della-citta-bassa >= 1]
        esito:
          titolo: Il prezzo di una pagnotta
          testo: |
            Non racconti la strada. Dici il prezzo di una pagnotta in Città Bassa
            quest'inverno e quello dell'inverno scorso, e il nome del forno dove
            li hai pagati, e Julia ti guarda per la prima volta da quando sei
            sceso. I sacchi ripartono all'alba per i forni, e Aldous, da quel
            giorno, non ti saluta più.
          pe: { empatia: 3 }
          imposta: { consiglio.grano: 2 }
          effetti: { nomea.citta-bassa: 1 }
          segue: consiglio-messo-del-sigillo
      - testo: "Dire quanto costa un maniero perso"
        descrizione: "Hai visto che cosa resta di una casata quando i creditori arrivano al portone."
        quando: [origine.rampollo-dei-quartieri-alti >= 1]
        esito:
          titolo: Le case perse
          testo: |
            Racconti di una casa dei Quartieri Alti che hai visto svuotare da
            bambino, una stanza alla volta, mentre i figli giocavano in cortile
            con i mobili già venduti. Julia resta in silenzio a lungo, poi dice ad
            Aldous di mandare il grano al notaio domattina. Per questa stagione il
            pane della Città Bassa resterà caro.
          pe: { politica-ed-economia: 3 }
          imposta: { consiglio.grano: 1 }
          effetti: { rep.castaldi: 1, nomea.citta-bassa: -0.5 }
          segue: consiglio-messo-del-sigillo

  # ------------------------------------------------------------ grado III · messo del sigillo
  - id: consiglio-messo-del-sigillo
    immagine: personaggi/quintus-vael
    titolo: Il messo del sigillo
    tipo: seguito
    luogo: Maniero Castaldi, il cortile
    area: quartieri-alti
    requisiti: [fazione.consiglio == 8]
    testo: |
      Il mattino dopo Julia ti aspetta in cortile, sotto il fico, già vestita
      per il Municipio, e accanto a lei c'è Quintus Vael con un fagotto di
      cuoio sotto il braccio.

      Julia ti dice che d'ora in poi, quando non può esserci lei, parli tu, al
      Municipio, alla Casa dei Nodi e dove ti manda, e quello che dici lo
      firma lei. Poi guarda la finestra dello studio, dove la lampada di
      Aldous è ancora accesa, e aggiunge che suo fratello ha comprato un
      cassetto nuovo con la serratura, e che va bene così.

      {intimidire Media} Chi ti sbatte la porta in faccia adesso la sbatte in
      faccia a lei, e quasi nessuno avrà il coraggio di provarci.

      Quintus scioglie il fagotto e ti mostra un corpetto di cuoio bollito con
      le bilance incrociate impresse sul petto. «La mia scorta lo porta così,
      e all'alba ci alleniamo nel cortile» dice, «e se parli per lei ti voglio
      lì almeno una volta alla settimana.»
    opzioni:
      - testo: "Indossare il cuoio della Guardia"
        descrizione: "Il cuoio della scorta di Quintus e il cortile all'alba, con la voce di Julia quando lei non c'è."
        immagine: icone/leather-armor
        esito:
          titolo: Messo del sigillo
          testo: |
            Ti infili il corpetto sopra la camicia, e Quintus te lo stringe ai
            fianchi con due strattoni, come si sella un cavallo; pesa meno di
            quanto pensavi. Julia ti guarda un momento con la testa piegata, poi
            si avvia verso il portone, perché in Municipio la panca è già piena, e
            Quintus ti dice che domani all'alba cominciate dalle parate.
          pe: { armi-da-mischia: 3 }
          almeno: { rep.castaldi: 6 }
          effetti: { fazione.consiglio: 1, oggetto.consiglio-cuoio-della-guardia: 1 }
      - testo: "Chiedere a Julia che cosa ne pensa di quello che hai deciso"
        descrizione: "Stanotte hai deciso del grano della sua casa, e adesso parlerai a nome suo."
        esito:
          titolo: La sua firma
          testo: |
            Julia ci pensa mentre Quintus ti stringe il cuoio ai fianchi. «Hai
            deciso una cosa che non volevo decidere io» dice. «Per questo ti
            tengo. Quando sbaglierai sarà la mia firma, e ci penserò io a
            ricordartelo.» Poi si avvia verso il portone, e Quintus ti dice che
            domani all'alba cominciate dalle parate.
          pe: { empatia: 3 }
          almeno: { rep.castaldi: 6 }
          effetti: { fazione.consiglio: 1, oggetto.consiglio-cuoio-della-guardia: 1 }

  # ------------------------------------------------------------ passo 10 · l'idromele delle dieci
  - id: consiglio-l-idromele-delle-dieci
    presso: municipio
    immagine: personaggi/ettore-castaldi
    titolo: L'idromele delle dieci
    sommario: "Un procuratore vestito di nero ha chiesto a Tullio quando c'è seduta, e se in seduta si parla di famiglia."
    luogo: Municipio, la scalinata
    area: quartieri-alti
    requisiti: [fazione.consiglio == 9, pista.tribu >= 1, segreto.ettore == 0]
    testo: |
      Tullio Merga ti ferma sulla scalinata con gli occhiali in mano.
      Stamattina è salito in anticamera Tebaldo Ronchi, il procuratore vestito
      di nero dei Malgrani di Ghoran, e ha chiesto la data della prossima
      seduta e se, quando ci sono di mezzo le famiglie dei consiglieri, si
      possono portare testimoni.

      Al bancone arriva un biglietto senza firma da Via del Salmone, nella
      grafia tonda di Sara Beck. Il signore in nero è passato alla Maison des
      Lunes tre sere di fila e ha pagato da bere a uno sguattero per sapere
      chi ha il libretto dei conti più lungo, e in fondo, sottolineato due
      volte, c'è il nome di Ettore Castaldi.

      {origine figlio-della-citta-bassa} Nei vicoli lo sanno tutti, uno
      sguattero pagato da bere è un testimone che costa poco e parla tanto.

      Ettore lo trovi alla Birreria del Paladino Stanco, alle dieci del
      mattino, con un boccale di idromele davanti.
    opzioni:
      - testo: "Andare alla Birreria del Paladino Stanco"
        descrizione: "Ettore apre la Birreria alle nove, e alle dieci è già al secondo boccale."
        immagine: personaggi/ettore-castaldi
        esito:
          titolo: Le dieci del mattino
          testo: |
            Scendi in Città Bassa con il biglietto di Sara in tasca. Alla Birreria
            il pavimento è ancora bagnato della lavata del mattino, e nella sala
            vuota l'unico rumore è il boccale di Ettore che torna sul tavolo.
          segue: consiglio-il-libretto-di-ettore

  - id: consiglio-l-idromele-delle-dieci-noto
    presso: municipio
    immagine: personaggi/ettore-castaldi
    titolo: L'idromele delle dieci
    sommario: "Un procuratore in nero ha chiesto dei testimoni in seduta, e tu sai dove Ettore passa le notti."
    luogo: Municipio, la scalinata
    area: quartieri-alti
    requisiti: [fazione.consiglio == 9, pista.tribu >= 1, segreto.ettore >= 1]
    testo: |
      Tullio Merga ti ferma sulla scalinata con gli occhiali in mano.
      Stamattina è salito in anticamera Tebaldo Ronchi, il procuratore vestito
      di nero dei Malgrani di Ghoran, e ha chiesto la data della prossima
      seduta e se, quando ci sono di mezzo le famiglie dei consiglieri, si
      possono portare testimoni.

      Dove passa le notti Ettore Castaldi lo sai da quando sei stato alla
      Maison des Lunes, e lo sa Sara Beck. Adesso, a quanto pare, lo sa anche
      un procuratore di Ghoran, e presto lo saprà il Consiglio.

      {politica-ed-economia Media} Il cugino della Rappresentante con il
      libretto dei conti aperto alla Maison, letto in seduta da un testimone,
      è lo scandalo che serve a chi vuole Julia senza maggioranza, e non costa
      niente.

      Ettore lo trovi alla Birreria del Paladino Stanco, alle dieci del
      mattino, con un boccale di idromele davanti.
    opzioni:
      - testo: "Andare dritto alla Birreria"
        descrizione: "Sai dove beve di giorno e dove va di notte. Conviene trovarlo prima di Ronchi."
        immagine: personaggi/ettore-castaldi
        esito:
          titolo: Prima di Ronchi
          testo: |
            Scendi in Città Bassa quasi di corsa. Alla Birreria il pavimento è
            ancora bagnato della lavata del mattino, ed Ettore capisce dalla tua
            faccia che non sei venuto per l'idromele.
          segue: consiglio-il-libretto-di-ettore

  - id: consiglio-il-libretto-di-ettore
    immagine: personaggi/ettore-castaldi
    titolo: Il libretto di Ettore
    tipo: seguito
    luogo: Città Bassa, la Birreria del Paladino Stanco
    area: citta-bassa
    requisiti: [fazione.consiglio == 9]
    testo: |
      A quest'ora la Birreria del Paladino Stanco è vuota. Sopra il bancone è
      appesa l'armatura di Ettore, lucidata come se dovesse indossarla
      domattina, e sotto la sua spada lunga. Ettore siede vicino alla finestra
      in maniche di camicia, davanti al boccale.

      Gli racconti del procuratore in nero, e lui ascolta. Il libretto dei
      conti della Maison lo tiene Sara Beck al bancone d'ingresso, e lo
      sguattero è pronto a dire in seduta quante sere a settimana il cugino
      della Rappresentante passa in Via del Salmone.

      {origine accolito-del-velo} Sul pomo della spada c'è la foglia rossa
      smaltata dell'Albero, e la spada di un paladino che smette andrebbe
      consegnata al Velo.

      «Julia non lo sa» dice Ettore al boccale. «Non l'ha mai saputo nessuno
      della famiglia. Io mi sono sempre detto che non era materia del
      Consiglio.»
    opzioni:
      - testo: "Farti dare il libretto da Sara Beck e portarlo a Julia"
        descrizione: "Un libretto nel cassetto della Rappresentante è al sicuro da Ronchi, e Julia lo userà."
        immagine: personaggi/sara-beck
        prova: { attributo: sociale, abilita: [galateo, persuasione], difficolta: Media }
        successo:
          titolo: La leva
          testo: |
            Sara Beck ti ascolta, poi stacca le pagine di Ettore con un coltello
            da carta e te le dà, la prima volta che dalla Maison escono i conti di
            un cliente. Julia le legge in piedi e le chiude nel cassetto. «Ci
            vuole una seduta, e prima ci vuole la sedia dei Tarvelin» dice. Del
            cugino non dice niente, e la settimana dopo alla Maison arriva un
            controllo del Comune.
          pe: { persuasione: 5 }
          imposta: { consiglio.ettore: 1 }
          effetti: { fazione.consiglio: 1, rep.castaldi: 0.5, rep.maison: -1 }
        fallimento:
          titolo: L'armadio delle armi
          testo: |
            Sara Beck ti ascolta, e alla fine ti dice con la sua voce allegra che
            alla Maison i conti dei clienti non escono mai, nemmeno per la
            Rappresentante. Ti accompagna alla porta chiamandoti per nome, e alla
            Birreria Ettore è al terzo boccale.
          effetti: { scandalo: 1 }

      - testo: "Chiedere il libretto a Nerissa Dalvane"
        descrizione: "Nerissa ti conosce, e un libretto letto in seduta danneggerebbe la Maison prima ancora di Ettore."
        immagine: personaggi/nerissa-dalvane
        requisiti: [rep.maison >= 3]
        esito:
          titolo: Le pagine staccate
          testo: |
            Nerissa ti ascolta nel salotto, poi si fa portare il libretto da Sara
            e ne stacca le pagine di Ettore. «Meglio in un cassetto del Municipio
            che in una cartella di cuoio» dice. Julia le chiude nel cassetto e
            dice che ci vuole una seduta, e prima la sedia dei Tarvelin. La
            settimana dopo alla Maison arriva un controllo del Comune, e Nerissa
            non te lo rimprovera.
          pe: { galateo: 3 }
          imposta: { consiglio.ettore: 1 }
          effetti: { fazione.consiglio: 1, rep.castaldi: 0.5, rep.maison: -1 }

      - testo: "Comprare il silenzio dello sguattero"
        descrizione: "Lo sguattero parla perché Ronchi paga da bere. Chi paga di più compra la sua memoria, finché dura."
        requisiti: [monete >= 40]
        esito:
          titolo: Una memoria corta
          testo: |
            Trovi lo sguattero nel cortile della Maison a svuotare i secchi, gli
            metti in mano una borsa e gli spieghi che cosa non si ricorderà. Il
            giorno dopo arriva in Municipio una lettera con cui Ronchi rinuncia ai
            testimoni con molta cortesia. Né Julia né Ettore ne sapranno niente.

            {conoscenze-della-strada Media} Una memoria comprata resta in vendita,
            e Ronchi sa a chi rivolgersi per ricomprarla.
          imposta: { consiglio.ettore: 2 }
          effetti: { fazione.consiglio: 1, rep.castaldi: 0.5, monete: -40, sospetto: 1 }

      - testo: "Convincere Ettore ad andare lui da Julia"
        descrizione: "Se lo dice lui alla cugina, il libretto di Ronchi non vale più niente."
        prova: { attributo: sociale, abilita: empatia, difficolta: Difficile }
        successo:
          titolo: La spada sotto l'armatura
          testo: |
            Gli parli dell'armatura sopra il bancone, che lucida ogni settimana
            senza più metterla. Ettore resta a lungo zitto, poi stacca la spada
            dai ganci e te la mette in mano. «Questa la tenevo per il giorno in
            cui avrei avuto il coraggio» dice, e va in Municipio da solo. La sera
            Julia, con gli occhi rossi, ti dice soltanto che ci vuole una seduta,
            e prima la sedia dei Tarvelin.
          pe: { empatia: 6 }
          imposta: { consiglio.ettore: 3 }
          effetti: { fazione.consiglio: 1, rep.castaldi: 0.5, rep.maison: 0.5, oggetto.consiglio-spada-del-paladino: 1 }
        fallimento:
          titolo: Il terzo boccale
          testo: |
            A ogni parola sulla cugina Ettore si chiude di più, finché si alza a
            lavare un bicchiere già pulito. Il libretto lo vai a prendere tu da
            Sara Beck, che stacca le pagine e te le dà senza sorridere. Julia le
            chiude nel cassetto e dice che ci vuole una seduta, e prima la sedia
            dei Tarvelin. La settimana dopo alla Maison arriva un controllo del
            Comune.
          imposta: { consiglio.ettore: 1 }
          effetti: { fazione.consiglio: 1, rep.maison: -1, scandalo: 0.5 }
