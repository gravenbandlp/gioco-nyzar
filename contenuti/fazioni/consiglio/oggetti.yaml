# Gli oggetti della quest del Consiglio (fazione.consiglio). Grado = punti da spendere in dadi e proprietà, ogni
# difetto dà un punto in più (docs/regolamento-oggetti.md).
# - I gradi: la penna d'osso (passo 3, accessorio di grado 1), la lettera col sigillo (passo 6, accessorio di grado
#   2 con la chiave sigillo-del-consiglio), il cuoio della Guardia Castaldi (passo 9, armatura di grado 2), l'anello
#   delle bilance (passo 12, accessorio di grado 3), la mazza del Patto (passo 15, arma unica di grado 4) e la spilla
#   del Consiglio (passo 15, accessorio di grado 3).
# - Dalle scelte: il pungolo di Sarpa (cuore del guado, se lo batti), la spada del paladino (passo 10, se Ettore va
#   da Julia di persona), i guanti della Gazza (cuore del Maniero di notte, se la batti).
oggetti:
  - id: consiglio-penna-d-osso
    nome: Penna d'osso del Municipio
    immagine: icone/quill-ink
    descrizione: "Un cannello d'osso con il pennino d'acciaio, di quelli che Tullio Merga tiene sotto chiave nel bancone. Chi la usa scrive dritto anche sulle ginocchia."
    slot: accessorio
    grado: 1
    proprieta: { talento: { accademiche: 1 } }

  - id: consiglio-lettera-col-sigillo
    nome: Lettera col sigillo del Consiglio
    immagine: icone/wax-seal
    descrizione: "Tre righe firmate dalla Rappresentante e la ceralacca del Consiglio colata di traverso. Dice che chi la porta parla per lei, e le porte dei consiglieri si aprono anche controvoglia."
    slot: accessorio
    grado: 2
    proprieta: { talento: { politica-ed-economia: 1, galateo: 1 }, chiave: [sigillo-del-consiglio] }

  - id: consiglio-cuoio-della-guardia
    nome: Cuoio della Guardia Castaldi
    immagine: icone/leather-armor
    descrizione: "Cuoio bollito e ingrassato, con le bilance incrociate impresse sul petto. Quintus Vael lo fa tagliare stretto, perché la sua scorta deve muoversi senza far rumore sulle scale del Municipio."
    slot: armatura
    base: cuoio-rinforzato
    grado: 2
    dadi: 1
    proprieta: { silenziosa: true, rapida: 1 }
    difetti: [riconoscibile]

  - id: consiglio-anello-delle-bilance
    nome: Anello delle bilance
    immagine: icone/ring
    descrizione: "Argento brunito con il sigillo dei Castaldi, due bilance incrociate sopra un cerchio aperto. Lo porta chi presenta le pratiche al voto, e chi lo vede sa a nome di chi parla."
    slot: accessorio
    grado: 3
    proprieta: { talento: { galateo: 2, empatia: 1 } }

  - id: consiglio-mazza-del-patto
    nome: Mazza del Patto
    immagine: icone/flanged-mace
    descrizione: "La mazza che si posa sul tavolo della sala consiliare all'apertura di ogni seduta, forgiata all'Acciaieria quando il Patto delle Corde era ancora fresco d'inchiostro. Le alette portano incisi i nomi delle casate firmatarie, e il manico è consumato dalle mani di chi l'ha portata in sala."
    slot: arma
    base: mazza
    grado: 4
    dadi: 1
    proprieta: { ultimoRespiro: true, affilata: 1, talento: { intimidire: 1 } }
    difetti: [riconoscibile]

  - id: consiglio-spilla-del-consiglio
    nome: Spilla del Consiglio
    immagine: icone/ribbon-medal
    descrizione: "Una spilla d'argento a forma di sette anelli intrecciati, uno per seggio. La porta chi siede alle sedute, e chi parla con la spilla sul bavero lo fa a verbale."
    slot: accessorio
    grado: 3
    proprieta: { talento: { persuasione: 2, politica-ed-economia: 1 } }

  - id: consiglio-pungolo-di-sarpa
    nome: Pungolo da carrettiere di Sarpa
    immagine: icone/spear-hook
    descrizione: "Un'asta di frassino lunga quanto un uomo, con un puntale di ferro ritorto in cima. Guido Sarpa ci ha spinto i buoi dei Malgrani per vent'anni, e qualche volta anche i carrettieri."
    slot: arma
    base: lancia
    grado: 1
    proprieta: { affilata: 1 }

  - id: consiglio-spada-del-paladino
    nome: Spada del paladino stanco
    immagine: icone/broadsword
    descrizione: "La spada lunga che Ettore Castaldi teneva appesa al muro della Birreria sotto l'armatura, con la foglia rossa dell'Albero smaltata sul pomo. Non ha mai perso il filo, anche negli anni in cui nessuno l'ha toccata."
    slot: arma
    base: spada-lunga
    grado: 2
    proprieta: { ultimoRespiro: true }

  - id: consiglio-guanti-della-gazza
    nome: Guanti della Gazza
    immagine: icone/gloves
    descrizione: "Guanti di pelle di capretto sottili come carta, con i polpastrelli rinforzati di seta cerata. Nives Orsat li usava per salire sui tetti di rame e per sfogliare i registri altrui senza lasciare impronte."
    slot: accessorio
    grado: 2
    proprieta: { talento: { acrobazia: 1, furtivita: 1 } }
