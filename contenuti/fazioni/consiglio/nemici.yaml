# I nemici della quest del Consiglio (fazione.consiglio). Tarati sui nemici della stessa fase della storia:
# Guido Sarpa come Roldan Kael (pelle.yaml) e Durgan (arena.yaml), la Gazza più veloce e più fragile, il complice
# come uno scagnozzo degli Scuri.
# - consiglio-l-agguato-al-guado: il cuore del guado del Torvessa prima della caduta di Ottone (pista.pelle < 7),
#   con gli sgherri dei Malgrani; consiglio-l-agguato-al-guado-dopo: dopo, con gli scagnozzi delle cellule dei
#   villaggi pagati da Tebaldo Ronchi.
# - consiglio-la-gazza-sui-tetti: il cuore del Maniero di notte; consiglio-la-gazza-da-sola: lo stesso, quando
#   Ettore Castaldi dorme al Maniero (consiglio.ettore == 3) e si occupa lui del complice.
nemici:
  - id: consiglio-guido-sarpa
    immagine: fazioni/famiglia-malgrani
    nome: Guido Sarpa
    descrizione: "Un carrettiere largo di spalle, con la barba grigia tagliata col coltello e un pungolo di frassino in mano. Conosce i guadi del Torvessa meglio dei pesci, e colpisce alle ginocchia come si fa con i buoi."
    attacco: 4
    difesa: 3
    difesaMentale: 2
    pf: 16
    danno: 3
    riduzione: 1
    iniziativa: 2

  - id: consiglio-nives-orsat
    immagine: fazioni/scuri
    nome: Nives Orsat, la Gazza
    descrizione: "Una donna minuta vestita di grigio scuro, con i capelli stretti in una cuffia e un coltello corto per mano. Sui tetti si muove a balzi brevi, e non resta mai nello stesso punto per due colpi di fila."
    attacco: 4
    difesa: 4
    difesaMentale: 3
    pf: 10
    danno: 2
    riduzione: 2
    iniziativa: 5

  - id: consiglio-complice-della-gazza
    immagine: fazioni/scuri
    nome: Il complice della Gazza
    descrizione: "Un ragazzo di Ghoran con una corda arrotolata a tracolla e un coltello da cuoio. Tiene la scala per la Gazza e la difende come se ne andasse della paga, e probabilmente è così."
    attacco: 3
    difesa: 3
    difesaMentale: 2
    pf: 10
    danno: 2
    iniziativa: 3
    puoFuggire: true

scontri:
  - { id: consiglio-l-agguato-al-guado, nome: "L'agguato al guado", nemici: [consiglio-guido-sarpa, sgherro-malgrani, sgherro-malgrani, sgherro-malgrani], feriteSconfitta: 3, rinforzo: { pf: 2, danno: 1, riduzione: 2, solo: [sgherro-malgrani] } }
  - { id: consiglio-l-agguato-al-guado-dopo, nome: "L'agguato al guado", nemici: [consiglio-guido-sarpa, scagnozzo-degli-scuri, scagnozzo-degli-scuri], feriteSconfitta: 3, rinforzo: { pf: 2, danno: 1, riduzione: 2, solo: [scagnozzo-degli-scuri] } }
  - { id: consiglio-la-gazza-sui-tetti, nome: "La Gazza sui tetti", nemici: [consiglio-nives-orsat, consiglio-complice-della-gazza], feriteSconfitta: 3 }
  - { id: consiglio-la-gazza-da-sola, nome: "La Gazza sui tetti", nemici: [consiglio-nives-orsat], feriteSconfitta: 3 }
