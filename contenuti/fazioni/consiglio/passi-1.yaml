# Quest del Consiglio, primo atto (fazione.consiglio 1 → 6). I passi 1, 3 e 5 sono le storie di
# contenuti/citta/municipio.yaml; qui ci sono i passi pari e i due seguiti dei gradi.
# - passo 2 `consiglio-il-ponticello-di-ada` (fazione.consiglio == 1, Città Bassa): il Comune ha firmato, ma le
#   assi passano dalla Segheria. Prima della caduta di Ottone si tratta con Rennick Dole (bene o con il bando);
#   dopo (pista.pelle >= 7) con la cooperativa, che il Comune non paga da settimane. Oppure paghi tu, o monti le
#   assi di scarto con Ettore Castaldi. Le prove fallite con Rennick e la cooperativa lasciano la scena aperta.
# - grado I `consiglio-scrivano-della-panca` (seguito del ritratto, fazione.consiglio == 2): la penna d'osso, una
#   borsa piccola, l'angolo del bancone di Tullio (il ripetibile delle petizioni in servizi.yaml), l'invito di
#   Marella per il giorno di consiglio.
# - passo 4 `consiglio-la-cena-di-consiglio` (fazione.consiglio == 3, Maniero Castaldi): la tavola di Marella come
#   una mappa del Consiglio, i segnali muti di Eolio Drest, Aldous che si alza a metà cena con un registro. Gli
#   ospiti cambiano con la trama (Ottone fino a pista.pelle 5, Ondrel Tarvelin fino a pista.acciaio 4, i capi
#   delle cooperative dopo pista.pelle 7). Ogni via chiude il passo; i fallimenti costano Scandalo.
# - passo 6 `consiglio-la-tribuna` (fazione.consiglio == 5, Municipio): la prima seduta vista dall'alto, poi una
#   parola con un consigliere, che resta in consiglio.voce (1 Vantes, 2 Tenebra, 3 Cordani, 4 Galdrick o il suo
#   sergente con galdrick.via == 1, 5 Ottone fino a pista.pelle 5) e conta alla seduta del passo 14. Ogni via porta
#   al seguito del grado II `consiglio-a-inchiostro`: il nome a inchiostro, la lettera col sigillo, una borsa.
storylet:
  # ------------------------------------------------------------ passo 2 · il ponticello di Ada
  - id: consiglio-il-ponticello-di-ada
    immagine: ambientazione/citta-bassa
    titolo: Il ponticello di Ada
    sommario: "Al lavatoio della Città Bassa i falegnami del Comune aspettano assi che nessuno ha mandato."
    luogo: Città Bassa, il lavatoio
    area: citta-bassa
    requisiti: [fazione.consiglio == 1]
    testo: |
      Al lavatoio della Città Bassa, sopra il canale di scolo, c'è il
      ponticello della petizione, quattro assi gonfie d'acqua e verdi di
      muschio con una corda per parapetto.

      Accanto alla prima vasca due falegnami del Comune aspettano seduti su
      una cesta, con l'ordine della Rappresentante nel cappello ma senza le
      assi, che alla Segheria finiscono in fondo alla lista ogni volta che
      qualcuno le rimette in cima.

      Ada Rusca ha le braccia nell'acqua fino ai gomiti e non si volta. «Sono
      venuti ieri e sono venuti oggi, e domani verranno anche domani» dice al
      lenzuolo che strizza. In fondo alla via, davanti alla Birreria del
      Paladino Stanco, Ettore Castaldi impila sul selciato le assi di certe
      casse vecchie.

      {origine figlio-della-citta-bassa} Su quelle assi passavi di corsa da
      bambino, con la cesta di tua madre in testa, e già allora si piegavano.
    opzioni:
      - testo: "Contrattare con Rennick Dole alla Segheria"
        descrizione: "Rennick contratta su ogni quattrino, e un quattrino in più per le assi del Comune lo convince prima di qualunque bando."
        immagine: personaggi/rennick-dole
        quando: [pista.pelle < 7]
        prova: { attributo: mentale, abilita: [politica-ed-economia, persuasione], difficolta: Media }
        successo:
          titolo: In cima alla lista
          testo: |
            Rennick Dole ti riceve fra le cataste. Gli fai notare che il Comune
            paga tardi ma paga sempre, e che un fornitore fidato avrà un nome in
            Municipio quando le licenze arriveranno in Consiglio. Lui sposta una
            riga del registro con la matita, e il giorno dopo il ponticello è
            finito. Sulla scalinata del Municipio ti aspetta Tullio Merga, perché
            stanotte in anticamera è caduto il ritratto.
          pe: { politica-ed-economia: 5 }
          effetti: { fazione.consiglio: 1, rep.castaldi: 0.5, rep.malgrani: 0.5 }
        fallimento:
          titolo: La catasta di larice
          testo: |
            Rennick ti lascia parlare contando i tronchi di una catasta, e alla
            fine ti dice che le assi del Comune arriveranno quando arriveranno,
            perché i Malgrani le commesse le pagano subito. Torni al lavatoio a
            mani vuote, e i falegnami ti fanno posto sulla cesta.
          effetti: { scandalo: 0.5 }

      - testo: "Minacciarlo con il bando del Consiglio"
        descrizione: "Un bando inchiodato al pilastro di Via del Velo, con il nome del fornitore che fa aspettare il Comune."
        immagine: personaggi/rennick-dole
        quando: [pista.pelle < 7]
        prova: { attributo: sociale, abilita: intimidire, difficolta: Media }
        successo:
          titolo: Il pilastro di Via del Velo
          testo: |
            Trovi Rennick nel cortile della Segheria e gli descrivi il bando riga
            per riga, compreso il pilastro dove Nino lo inchioderà. Lui diventa
            rosso dal collo in su, e le assi partono quel pomeriggio stesso. Al
            ritorno, sulla scalinata del Municipio, ti aspetta Tullio Merga con
            gli occhiali in mano, perché stanotte in anticamera è caduto il
            ritratto.
          pe: { intimidire: 5 }
          effetti: { fazione.consiglio: 1, rep.castaldi: 0.5, rep.malgrani: -0.5 }
        fallimento:
          titolo: La risata del cortile
          testo: |
            Rennick ride così forte che i garzoni smettono di segare per
            ascoltare, e ti chiede chi avrebbe il coraggio di affiggere un bando
            contro un fornitore dei Malgrani. Esci dal cortile con la segatura nei
            capelli.
          effetti: { scandalo: 1 }

      - testo: "Convincere la cooperativa a fare credito al Comune"
        descrizione: "La Segheria adesso è dei taglialegna, e le assi le hanno, ma il Comune non li paga da settimane."
        immagine: ambientazione/segheria-di-qir-azel
        quando: [pista.pelle >= 7]
        prova: { attributo: sociale, abilita: [empatia, persuasione], difficolta: Media }
        successo:
          titolo: Il ponticello delle loro madri
          testo: |
            I taglialegna della cooperativa i conti del Comune li sanno meglio di
            te. Allora parli del lavatoio, dove passano ogni mattina le loro madri
            e le loro mogli, e il più anziano sputa nella segatura e dice che
            quattro assi le regala alla Città Bassa. I falegnami finiscono prima
            di sera, e sulla scalinata del Municipio ti aspetta Tullio Merga,
            perché stanotte in anticamera è caduto il ritratto.
          pe: { empatia: 5 }
          effetti: { fazione.consiglio: 1, rep.castaldi: 0.5 }
        fallimento:
          titolo: I conti del Comune
          testo: |
            Cominci dai conti del Comune, e i taglialegna ti rispondono con i
            loro, che sono più lunghi dei tuoi. Il più anziano ti accompagna al
            cancello con una mano ferma sulla spalla, e ti dice che il Comune sa
            dove trovarli il giorno in cui paga.
          effetti: { scandalo: 0.5 }

      - testo: "Pagare le assi di tasca tua"
        descrizione: "Quattro assi di larice costano meno di una cena nei Quartieri Alti, e i falegnami sono già lì."
        requisiti: [monete >= 15]
        esito:
          titolo: Le assi pagate
          testo: |
            Compri quattro assi di larice alla Segheria come un cliente qualunque,
            e prima di sera il ponticello ha le assi nuove e un parapetto vero.
            Ada lo attraversa con la cesta sul fianco, poi torna indietro per
            riattraversarlo. Sulla scalinata del Municipio ti aspetta Tullio
            Merga, perché stanotte in anticamera è caduto il ritratto.
          effetti: { monete: -15, fazione.consiglio: 1, rep.castaldi: 0.5 }

      - testo: "Montare le assi di scarto con Ettore"
        descrizione: "Ettore Castaldi impila davanti alla Birreria assi di quercia di casse vecchie, da portare fino al canale."
        immagine: personaggi/ettore-castaldi
        costo: 2
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Facile }
        successo:
          titolo: Le assi di quercia
          testo: |
            Ettore ascolta la storia senza smettere di impilare, poi si carica tre
            assi sulla spalla. Davanti al legno i falegnami si mettono al lavoro,
            ed Ettore pianta i chiodi a colpi lunghi che fanno voltare le
            lavandaie. A sera il ponticello regge un carretto, e Ada ci passa
            sopra battendo il piede due volte. Sulla scalinata del Municipio ti
            aspetta Tullio Merga, perché stanotte in anticamera è caduto il
            ritratto.
          pe: { atletica: 5 }
          effetti: { fazione.consiglio: 1, rep.castaldi: 0.5, nomea.citta-bassa: 0.5 }
        fallimento:
          titolo: Il pollice
          testo: |
            Al secondo viaggio un'asse ti finisce sul piede e poco dopo il
            martello ti trova il pollice. Ettore finisce il lavoro con i falegnami
            mentre Ada ti fascia il dito con una striscia di lenzuolo, e a sera il
            ponticello regge. Sulla scalinata del Municipio ti aspetta Tullio
            Merga, perché stanotte in anticamera è caduto il ritratto.
          effetti: { fazione.consiglio: 1, rep.castaldi: 0.5, ferite: 1 }

  # ------------------------------------------------------------ grado I · scrivano della panca
  - id: consiglio-scrivano-della-panca
    immagine: personaggi/julia-castaldi
    titolo: Un angolo del bancone
    tipo: seguito
    luogo: Municipio, il bancone degli impiegati
    area: quartieri-alti
    requisiti: [fazione.consiglio == 2]
    testo: |
      Prima di tornare nel suo ufficio Julia si ferma al bancone degli
      impiegati e indica a Tullio l'angolo in fondo, sotto la finestra, dove
      si ammucchiano le pratiche da smistare. Tullio capisce prima che lei
      finisca la frase, sgombra l'angolo con due bracciate e tira fuori da un
      cassetto chiuso a chiave una penna con il cannello d'osso.

      «Sulla panca c'è sempre qualcuno con un foglio piegato in quattro» dice
      Julia, «e da domani glielo scrivi tu, con i margini dritti e lo spazio
      per il sigillo, così sale nel cesto e non scende nella cassa.»

      {accademiche Facile} Cannello d'osso e pennino d'acciaio temperato, una
      penna da notaio, e al Municipio ne avranno sei in tutto, che Tullio
      conta ogni sera.

      Dalla porta dell'ufficio esce Marella, con i guanti già infilati, e ti
      porge un cartoncino color crema con le bilance dei Castaldi in un
      angolo. «Giovedì è giorno di consiglio al Maniero» dice, «e tu siediti
      dove ti metto io e non spostare niente.»
    opzioni:
      - testo: "Prendere la penna e sederti al bancone"
        descrizione: "La penna d'osso e un angolo del bancone, con la panca davanti e i suoi fogli piegati."
        immagine: icone/quill-ink
        esito:
          titolo: Scrivano della panca
          testo: |
            Ti siedi nell'angolo sgombro e Tullio ti mette davanti un calamaio
            tutto tuo, che poi sposta di un dito verso il centro. Ti lascia anche
            un sacchetto di monete dalla cassa delle spese minute, «per la carta
            buona». La prima ad alzarsi dalla panca è una vecchia con un foglio
            piegato in quattro, che ti guarda la penna prima della faccia.
          pe: { accademiche: 3 }
          almeno: { rep.castaldi: 2 }
          effetti: { fazione.consiglio: 1, monete: 30, oggetto.consiglio-penna-d-osso: 1 }
      - testo: "Chiedere a Tullio quante penne così ci sono"
        descrizione: "Tullio le tiene sotto chiave. Prima di prenderne una conviene sapere quanto ci tiene."
        esito:
          titolo: Sei penne
          testo: |
            «Sei» dice Tullio, e si toglie gli occhiali per dirlo meglio. «Una ce
            l'ha la Rappresentante e quattro le teniamo noi. La sesta la usava il
            Rappresentante di prima per firmare le grazie, e da allora nessuno ci
            ha più scritto.» Te la chiude fra le dita e ti dà un sacchetto di
            monete dalla cassa delle spese minute, per la carta buona.
          pe: { galateo: 3 }
          almeno: { rep.castaldi: 2 }
          effetti: { fazione.consiglio: 1, monete: 30, oggetto.consiglio-penna-d-osso: 1 }

  # ------------------------------------------------------------ passo 4 · la cena di consiglio
  - id: consiglio-la-cena-di-consiglio
    immagine: personaggi/marella-castaldi
    titolo: La cena di consiglio
    sommario: "Giovedì è giorno di consiglio al Maniero Castaldi, e Marella ha deciso dove ti siedi."
    luogo: Maniero Castaldi, la sala da pranzo
    area: quartieri-alti
    requisiti: [fazione.consiglio == 3]
    testo: |
      Alla sesta campana, nella sala da pranzo del Maniero Castaldi, il tavolo
      è apparecchiato per venti, e i cartoncini color crema che Marella ha
      scritto su ogni piatto disegnano il Consiglio, con i Castaldi al centro
      e la Gilda in fondo.

      Eolio Drest dirige i valletti dalla credenza muovendo due dita, senza
      mai suonare il campanello. A tavola si parla di Stato e mai dei
      Castaldi, e intanto tutti contano i voti sulle licenze. Accanto al tuo,
      un cartoncino è stato spostato di un posto.

      {origine rampollo-dei-quartieri-alti} Da bambino, a tavole come questa,
      ti mettevano in fondo a imparare a non guardare chi parlava con chi.

      A metà della seconda portata Aldous Castaldi, il fratello della
      Rappresentante, si alza pallido con un registro sotto il braccio ed
      esce, e la sua sedia resta vuota.
    opzioni:
      - testo: "Rimettere a posto il segnaposto senza farlo notare"
        descrizione: "A questa tavola un cartoncino fuori posto è una frase detta ad alta voce."
        prova: { attributo: sociale, abilita: galateo, difficolta: Media }
        successo:
          titolo: Un posto più in là
          testo: |
            Quando i valletti portano il pesce e tutti guardano il vassoio, sposti
            il cartoncino con il bordo del piatto finché la grafia di Marella
            torna davanti alla persona giusta. L'ospite che l'aveva spostato legge
            il suo nome e tace per tutto il secondo. Sulla soglia Marella ti
            trattiene per il gomito. «Julia vuole metterti alla prova» dice, «e io
            le ho detto che a tavola la prova l'hai già fatta.»
          pe: { galateo: 5 }
          effetti: { fazione.consiglio: 1, rep.castaldi: 0.5 }
        fallimento:
          titolo: Il cartoncino nella salsa
          testo: |
            Il cartoncino scivola nella salsa e lo ripeschi con due dita mentre
            mezzo tavolo ti guarda, con la grafia di Marella sciolta in una
            macchia bruna, e Marella ride per prima. Sulla soglia ti dice che
            Julia vuole metterti alla prova, e che a tavola, per fortuna, non era
            lei a guardarti.
          effetti: { fazione.consiglio: 1, scandalo: 1 }

      - testo: "Seguire i segnali di Eolio Drest"
        descrizione: "Il maggiordomo dirige la sala senza aprire bocca, e i suoi segnali dicono chi è fuori posto."
        prova: { attributo: mentale, abilita: percezione, difficolta: Media }
        successo:
          titolo: Due dita e un sopracciglio
          testo: |
            Guardi Eolio invece degli ospiti, e impari che due dita verso il basso
            fermano un bicchiere e un sopracciglio alzato manda un valletto dietro
            una sedia. Quando guarda il cartoncino spostato e poi te, capisci che
            ti chiede di farlo tu; lo fai al cambio dei piatti, ed Eolio abbassa
            le palpebre una volta sola. Sulla soglia Marella ti dice che Julia
            vuole metterti alla prova.
          pe: { percezione: 5 }
          effetti: { fazione.consiglio: 1, rep.castaldi: 0.5 }
        fallimento:
          titolo: Il segnale sbagliato
          testo: |
            Quando Eolio alza due dita alzi la mano per il vino, e il valletto che
            veniva verso di te si ferma a metà sala mentre qualcuno sorride dietro
            il tovagliolo. Il resto della cena lo passi con le mani in grembo.
            Sulla soglia Marella ti dice che Julia vuole metterti alla prova, come
            si dà una notizia che poteva essere migliore.
          effetti: { fazione.consiglio: 1, scandalo: 1 }

      - testo: "Fare conversazione con Ottone Malgrani"
        descrizione: "Ottone siede in fondo e ascolta volentieri chi gli parla con garbo di mulini e di decoro."
        immagine: personaggi/ottone-malgrani
        quando: [pista.pelle < 5]
        prova: { attributo: sociale, abilita: [persuasione, galateo], difficolta: Media }
        successo:
          titolo: I panciotti di una volta
          testo: |
            Lodi il ricamo del suo panciotto, e Ottone passa dai ricami ai mulini
            e al decoro che la città ha perduto. Fra una portata e l'altra ti dice
            sorridendo che le licenze sul grano non passeranno mai, tranquillo,
            perché i voti li ha già contati. Sulla soglia Marella ti dice che
            Julia vuole metterti alla prova, e che hai fatto bene a farlo parlare.
          pe: { persuasione: 5 }
          effetti: { fazione.consiglio: 1, rep.castaldi: 0.5, rep.malgrani: 0.5 }
        fallimento:
          titolo: Il decoro
          testo: |
            Ottone ti chiede che cosa pensi della Maison des Lunes, e tu rispondi
            la cosa sbagliata a voce troppo alta. Lui ti ringrazia della
            franchezza e per il resto della cena parla con la signora alla sua
            sinistra. Sulla soglia Marella ti dice che Julia vuole metterti alla
            prova, e ti consiglia di tenere certe opinioni per il dolce.
          effetti: { fazione.consiglio: 1, scandalo: 1 }

      - testo: "Fare conversazione con Ondrel Tarvelin"
        descrizione: "Il padrone dell'Acciaieria siede accanto alla Rappresentante e non tocca il vino. Parla poco, e quando parla lo ascoltano."
        immagine: personaggi/ondrel-tarvelin
        quando: [pista.acciaio < 4]
        prova: { attributo: sociale, abilita: [persuasione, empatia], difficolta: Media }
        successo:
          titolo: Il lyssan
          testo: |
            Gli chiedi del lyssan e non dei Tarvelin, e Ondrel ti guarda per la
            prima volta. Ti spiega a voce bassa come si riconosce una colata buona
            dal colore che prende raffreddandosi, e non guarda mai la sedia vuota
            accanto alla sua, apparecchiata per qualcuno che non viene. Sulla
            soglia Marella ti dice che Julia vuole metterti alla prova.
          pe: { persuasione: 5 }
          effetti: { fazione.consiglio: 1, rep.castaldi: 0.5, rep.tarvelin: 0.5 }
        fallimento:
          titolo: La figlia
          testo: |
            Gli chiedi della figlia, e Ondrel posa la forchetta e risponde che la
            figlia ha una locanda, e che le locande sono un ottimo mestiere. Poi
            tace fino al dolce. Sulla soglia Marella ti dice che Julia vuole
            metterti alla prova, e che a quella tavola di Liaren non si parla da
            anni.
          effetti: { fazione.consiglio: 1, scandalo: 1 }

      - testo: "Fare conversazione con i capi delle cooperative"
        descrizione: "Al posto delle casate cadute siedono i capi delle cooperative, incerti sulla forchetta."
        quando: [pista.pelle >= 7]
        prova: { attributo: sociale, abilita: [empatia, galateo], difficolta: Media }
        successo:
          titolo: La forchetta del pesce
          testo: |
            Ti siedi accanto al capo dei taglialegna e prendi la forchetta piccola
            perché la veda, e lui la prende un momento dopo di te. Poi ti racconta
            della Segheria e dei conti del Comune che non tornano, e ride con
            tutta la tavola. Sulla soglia Marella ti dice che Julia vuole metterti
            alla prova, e che la forchetta giusta l'avrebbe messa lei, se ci
            avesse pensato.
          pe: { galateo: 5 }
          effetti: { fazione.consiglio: 1, rep.castaldi: 0.5, nomea.citta-bassa: 0.5 }
        fallimento:
          titolo: Il vino dei Quartieri Alti
          testo: |
            Versi da bere al capo dei taglialegna spiegandogli il vino, e lui ti
            ascolta come se gli spiegassi la segatura, poi a metà della seconda
            portata si gira verso il vicino. Sulla soglia Marella ti dice che
            Julia vuole metterti alla prova, e che il vino si versa senza
            spiegarlo.
          effetti: { fazione.consiglio: 1, scandalo: 1 }

      - testo: "Seguire Aldous fuori dalla sala"
        descrizione: "Aldous è uscito pallido con un registro, e sulle scale dello studio c'è Quintus Vael."
        prova: { attributo: fisico, abilita: furtivita, difficolta: Media }
        successo:
          titolo: La lampada bassa
          testo: |
            Prendi le scale di servizio, e dalla porta socchiusa dello studio vedi
            Aldous chino su un registro, con la mano sopra una colonna di cifre
            che copre a ogni rumore. A fine cena Marella ti dice che Julia vuole
            metterti alla prova, e intanto ti guarda la polvere sulle scarpe.

            {politica-ed-economia Media} Le somme si fanno di nascosto quando non
            tornano, o quando tornano troppo bene a qualcun altro.
          pe: { furtivita: 5 }
          effetti: { fazione.consiglio: 1, rep.castaldi: 0.5 }
        fallimento:
          titolo: Quintus sulle scale
          testo: |
            A metà delle scale di servizio trovi Quintus Vael seduto su un
            gradino, con un piatto di pane sulle ginocchia. Ti chiede se ti sei
            perso, nel tono in cui si chiede l'ora, e ti riaccompagna a tavola.
            Sulla soglia Marella ti dice che Julia vuole metterti alla prova, e
            che la casa ha più scale di quante ne servano a un ospite.
          effetti: { fazione.consiglio: 1, scandalo: 1 }

      - testo: "Rimettere i segnaposto come ti hanno insegnato da bambino"
        descrizione: "Un cartoncino si sposta con il dorso del coltello, mai con le dita, come ti hanno insegnato."
        quando: [origine.rampollo-dei-quartieri-alti >= 1]
        esito:
          titolo: Il dorso del coltello
          testo: |
            Spingi il cartoncino con il dorso della lama senza guardarlo, mentre
            rispondi alla vicina sul tempo che fa a Laresh, e il nome torna al suo
            posto prima del pesce. L'ospite che l'aveva spostato ti guarda con un
            rispetto pieno di rancore. Sulla soglia Marella ti dice che Julia
            vuole metterti alla prova, e che tua madre ti ha educato bene, anche
            se a lei non l'ha mai detto.
          pe: { galateo: 5 }
          effetti: { fazione.consiglio: 1, rep.castaldi: 0.5 }

  # ------------------------------------------------------------ passo 6 · la tribuna
  - id: consiglio-la-tribuna
    presso: municipio
    immagine: fazioni/consiglio-di-qir-azel
    titolo: La tribuna
    sommario: "È giovedì e c'è seduta, e Julia ti vuole in tribuna a guardare chi vota cosa."
    luogo: Municipio, la sala consiliare
    area: quartieri-alti
    requisiti: [fazione.consiglio == 5]
    testo: |
      La sala consiliare sta al secondo piano del Municipio, con un tavolo di
      noce a ferro di cavallo e sette sedie dallo schienale alto, e sopra
      corre una galleria di legno per il pubblico. Davanti al seggio della
      Rappresentante c'è una mazza di ferro posata di traverso, e la seduta
      comincia quando Tullio la raddrizza.

      Julia legge le pratiche senza guardare il foglio. Padre Vantes posa la
      mano sul braccio di chi parla, e chi parla si ferma come se l'avesse
      deciso da solo. Tenebra ha il cappuccio dei Raschiatori calato sugli
      occhi e alza la mano soltanto quando si parla del Labirinto. Tarquin
      Cordani parla per la Gilda muovendo molto le mani, e Galdrick vota per
      ultimo e sempre con Julia. Le sedie dei Malgrani e dei Tarvelin le
      guardi più a lungo delle altre.

      {politica-ed-economia Media} Tre pratiche rinviate in un pomeriggio,
      ognuna da un seggio diverso, così nessuno deve mai votare contro.

      {galateo Facile} Cordani tiene le mani ferme sul tavolo da quando Julia
      ha nominato le licenze, e in uno che gesticola anche per chiedere il
      sale è come se avesse alzato la voce.

      Alla fine Tullio rimette la mazza di traverso, e fra la sala e lo
      scalone si può parlare per qualche minuto con uno dei consiglieri.
    opzioni:
      - testo: "Avvicinare Padre Vantes sullo scalone"
        descrizione: "Il Gran Sacerdote del Velo scende piano e saluta tutti, e con lui conta come si chiede."
        immagine: personaggi/padre-vantes
        prova: { attributo: sociale, abilita: [galateo, empatia], difficolta: Media }
        successo:
          titolo: La mano sul braccio
          testo: |
            Lo raggiungi al secondo pianerottolo e gli chiedi della pratica sulle
            offerte della Cripta, che è stata rinviata. Vantes ti posa la mano sul
            braccio e ti dice con calma che il Velo voterà con la Rappresentante
            finché lei non gli chiederà di scegliere fra lei e la città. Poi
            riprende a scendere, e la mano ti resta sul braccio per un gradino in
            più.
          pe: { galateo: 5 }
          imposta: { consiglio.voce: 1 }
          effetti: { rep.velo: 0.5 }
          segue: consiglio-a-inchiostro
        fallimento:
          titolo: Il gradino
          testo: |
            Lo raggiungi di corsa e gli parli con le parole che escono a pezzi. Vantes
            ti ascolta con pazienza e ti benedice, che è il suo modo di chiudere una
            conversazione.
          effetti: { scandalo: 1 }
          segue: consiglio-a-inchiostro

      - testo: "Fermare Tenebra prima che scenda ai Ponti"
        descrizione: "Il consigliere dei Raschiatori esce per primo, e parla soltanto di quello che c'è sotto."
        immagine: personaggi/tenebra
        prova: { attributo: sociale, abilita: empatia, difficolta: Media }
        successo:
          titolo: Quello che c'è sotto
          testo: |
            Lo raggiungi sotto il portico e invece di presentarti gli chiedi
            quante squadre sono scese questa settimana. Tenebra ti dice il numero,
            e poi quante ne sono risalite. In Consiglio vota solo sul Labirinto
            perché il resto è roba di superficie, ma se un giorno la superficie
            gli chiederà qualcosa si ricorderà di chi gli ha chiesto delle
            squadre.
          pe: { empatia: 5 }
          imposta: { consiglio.voce: 2 }
          effetti: { rep.raschiatori: 0.5 }
          segue: consiglio-a-inchiostro
        fallimento:
          titolo: Il cappuccio
          testo: |
            Lo chiami per nome sotto il portico, e Tenebra ti guarda a lungo da
            sotto il cappuccio senza dire niente, finché ti accorgi di avere la
            schiena contro una colonna. Poi se ne va verso i Ponti.
          effetti: { tormento: 1 }
          segue: consiglio-a-inchiostro

      - testo: "Parlare con Tarquin Cordani dei dazi"
        descrizione: "Il Sovrintendente della Gilda discute volentieri di conti, se il numero è giusto."
        prova: { attributo: mentale, abilita: politica-ed-economia, difficolta: Media }
        successo:
          titolo: Le mani di Cordani
          testo: |
            Gli parli dei dazi dei Ponti, che tornano sempre con qualche moneta in
            meno dalla stessa parte, e Cordani ti risponde muovendo molto le mani,
            segno che non è arrabbiato. La Gilda, dice, vuole i prezzi alla
            portata della gente quanto la Rappresentante, e le licenze le
            voterebbe se qualcuno gli desse una ragione pulita per farlo.
          pe: { politica-ed-economia: 5 }
          imposta: { consiglio.voce: 3 }
          effetti: { rep.gilda: 0.5 }
          segue: consiglio-a-inchiostro
        fallimento:
          titolo: La colonna sbagliata
          testo: |
            Gli citi una cifra dei dazi e Cordani te la corregge con gentilezza,
            poi corregge anche quella dopo, con le mani ferme sulla balaustra. Ti
            saluta con un inchino corto e va a parlare con qualcuno che i conti li
            sa.
          effetti: { scandalo: 1 }
          segue: consiglio-a-inchiostro

      - testo: "Salutare Galdrick in fondo alla sala"
        descrizione: "Lo sceriffo vota sempre con Julia, e senza elmo sembra più vecchio."
        immagine: personaggi/toren-galdrick
        quando: [galdrick.via == 0]
        esito:
          titolo: I pollici nella cintura
          testo: |
            Galdrick infila i pollici nella cintura e ti dice che in tribuna
            sembravi uno che conta le pecore, il modo giusto di guardare una
            seduta. Poi abbassa la voce e ti racconta chi ha chiesto il rinvio
            delle tre pratiche e chi glielo ha fatto chiedere. Se ti serve
            qualcuno della Guardia, aggiunge, alla Caserma chiedi di lui.
          pe: { politica-ed-economia: 3 }
          imposta: { consiglio.voce: 4 }
          effetti: { rep.caserma: 0.5 }
          segue: consiglio-a-inchiostro
      - testo: "Salutare il sergente seduto al posto di Galdrick"
        descrizione: "Galdrick è a Ghoran, e al suo posto siede il sergente di turno, con l'elmo sotto il braccio."
        quando: [galdrick.via == 1]
        esito:
          titolo: La sedia dello sceriffo
          testo: |
            Il sergente si alza appena ti avvicini, poi si ricorda che non deve e
            si risiede. Galdrick gli ha lasciato un ordine solo, votare con la
            Rappresentante, e dalla sua sedia si vede tutto il tavolo, compreso
            chi ha chiesto il rinvio delle tre pratiche. Se ti serve qualcuno
            della Guardia, aggiunge, alla Caserma chiedi di lui.
          pe: { politica-ed-economia: 3 }
          imposta: { consiglio.voce: 4 }
          effetti: { rep.caserma: 0.5 }
          segue: consiglio-a-inchiostro

      - testo: "Avvicinare Ottone Malgrani"
        descrizione: "Ottone ha votato contro senza dirlo, e con lui il garbo non basta quasi mai."
        immagine: personaggi/ottone-malgrani
        quando: [pista.pelle < 5]
        prova: { attributo: sociale, abilita: galateo, difficolta: Difficile }
        successo:
          titolo: Il guanto
          testo: |
            Ti fai trovare sul suo passaggio e gli cedi il passo con un inchino
            della misura giusta. Ottone ti chiede chi sei, e poi ti spiega con
            molta cortesia che la Rappresentante ha buone idee e pochi voti, e che
            i giovani farebbero bene a contare i secondi prima di innamorarsi
            delle prime. Poi si infila un guanto dito per dito e se ne va.
          pe: { galateo: 5 }
          imposta: { consiglio.voce: 5 }
          effetti: { rep.malgrani: 0.5 }
          segue: consiglio-a-inchiostro
        fallimento:
          titolo: Il passaggio
          testo: |
            Ottone ti passa accanto come accanto a una colonna, e il segretario
            che lo segue annota qualcosa su un taccuino.
          effetti: { scandalo: 1 }
          segue: consiglio-a-inchiostro

      - testo: "Tornare da Julia senza parlare con nessuno"
        descrizione: "Hai visto la seduta. Quello che c'è da dire puoi dirlo a lei."
        costo: 0
        esito:
          titolo: Lo scalone vuoto
          testo: |
            Lasci che i consiglieri scendano con le loro cerchie, poi bussi alla
            porta dell'ufficio con la seduta ancora in testa, sedia per sedia.
          segue: consiglio-a-inchiostro

      - testo: "Aspettare Cordani al portone della Casa dei Nodi"
        descrizione: "Dopo le sedute Cordani si ferma sui gradini della Casa dei Nodi, dove sai come attaccare discorso."
        quando: [origine.mercante-dei-ponti >= 1]
        esito:
          titolo: I gradini della Casa dei Nodi
          testo: |
            Lo aspetti sui gradini della Casa dei Nodi con la licenza in tasca e
            gli chiedi dei dazi sui banchi piccoli. Cordani riconosce il sigillo
            della Gilda sul tuo polsino e ti parla come a un socio, muovendo molto
            le mani, e ti dice che le licenze sul grano le voterebbe se qualcuno
            gli desse una ragione pulita. Poi ti chiede di salutargli la
            Rappresentante.
          pe: { politica-ed-economia: 5 }
          imposta: { consiglio.voce: 3 }
          effetti: { rep.gilda: 0.5 }
          segue: consiglio-a-inchiostro

      - testo: "Raggiungere Tenebra sul Ponte dei Morti"
        descrizione: "Dopo le sedute Tenebra guarda le lanterne dal Ponte dei Morti, e tu sai tacere accanto a un Raschiatore."
        quando: [origine.apprendista-raschiatore >= 1]
        esito:
          titolo: Le lanterne
          testo: |
            Ti appoggi al parapetto accanto a lui senza parlare, a guardare le
            lanterne come si fa a fine turno, finché Tenebra ti chiede di quale
            squadra sei. Glielo dici, e lui annuisce. In Consiglio vota solo
            quando si parla del Labirinto, ti spiega, ma se un giorno la
            superficie gli chiederà qualcosa si ricorderà di chi è venuto a
            cercarlo qui.
          pe: { empatia: 5 }
          imposta: { consiglio.voce: 2 }
          effetti: { rep.raschiatori: 0.5 }
          segue: consiglio-a-inchiostro

  # ------------------------------------------------------------ grado II · a inchiostro
  - id: consiglio-a-inchiostro
    immagine: personaggi/julia-castaldi
    titolo: A inchiostro
    tipo: seguito
    luogo: Municipio, l'ufficio della Rappresentante
    area: quartieri-alti
    requisiti: [fazione.consiglio == 5]
    testo: |
      Julia ti aspetta con il registro aperto alla pagina del margine e ti
      chiede che cosa hai visto. Glielo racconti sedia per sedia, con chi ha
      chiesto il rinvio e chi ha taciuto, e lei ascolta senza interromperti,
      con la penna ferma fra le dita.

      {empatia Media} Non sta controllando se hai visto giusto, perché la
      seduta l'ha vista anche lei. Sta controllando che cosa guardi quando
      guardi una seduta.

      Quando hai finito intinge la penna e scrive il tuo nome a inchiostro
      sopra quello a matita, sottolineandolo con una riga dritta come le
      cifre. Poi dal cassetto socchiuso prende la lettera piegata in tre, con
      la ceralacca colata di traverso. «Con questa ti aprono le porte i
      consiglieri e gli archivi, e alla Casa dei Nodi qualcuno anche
      controvoglia» dice. «In tribuna, da oggi, la prima fila è tua.»
    opzioni:
      - testo: "Prendere la lettera"
        descrizione: "Il tuo nome a inchiostro, la lettera col sigillo, la prima fila della tribuna."
        immagine: icone/wax-seal
        esito:
          titolo: Incaricato del Consiglio
          testo: |
            Ti infili la lettera nella giubba. Julia apre la cassetta di ferro,
            conta una borsa di monete senza guardarle e la spinge verso di te.
            «Per le scarpe» dice. «Chi lavora per il Consiglio cammina parecchio.»
            Mentre esci chiama il nome seguente, e Tullio dal bancone ti saluta
            inforcando gli occhiali, come per vedere meglio chi sei diventato.
          pe: { politica-ed-economia: 3 }
          almeno: { rep.castaldi: 4 }
          effetti: { fazione.consiglio: 1, monete: 50, oggetto.consiglio-lettera-col-sigillo: 1 }
      - testo: "Chiederle perché proprio tu"
        descrizione: "In Municipio c'è gente che aspetta questa lettera da anni. Vale la pena sapere che cosa ha visto Julia."
        esito:
          titolo: Perché proprio tu
          testo: |
            Julia ci pensa il tempo di soffiare sull'inchiostro. «Perché in
            tribuna non hai guardato me» dice. «Tutti guardano me, e tu hai
            guardato le mani di Cordani.» Ti dà la lettera col sigillo e una borsa
            di monete dalla cassetta di ferro, per le scarpe, perché chi lavora
            per il Consiglio cammina parecchio, e poi chiama il nome seguente.
          pe: { empatia: 3 }
          almeno: { rep.castaldi: 4 }
          effetti: { fazione.consiglio: 1, monete: 50, oggetto.consiglio-lettera-col-sigillo: 1 }
