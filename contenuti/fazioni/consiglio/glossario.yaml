# Glossario della quest del Consiglio (fazione.consiglio): i personaggi nuovi che compaiono nei testi, nel formato
# di contenuti/glossario/personaggi.yaml. Dal Codex: Aldous Castaldi, Eolio Drest, Brem Anthos, Vesper e Mira
# Castaldi. Nuovi: Guido Sarpa, Nives Orsat detta la Gazza, Tebaldo Ronchi, Anselmo Brey.
# Anselmo Brey è il mugnaio del Mulino Malgrani, che c'era già. Mira Castaldi non ha l'alias
# del nome, per via dell'arco «Mira» di Irsa.
glossario:
  - id: aldous-castaldi
    nome: Aldous Castaldi
    alias: [Aldous]
    tipo: personaggio
    sottotitolo: "Fratello della Rappresentante, al Maniero Castaldi"
    testo: "Fratello maggiore di Julia Castaldi, manda avanti il Maniero e gli affari della casata, dagli affitti ai contratti con i villaggi di Laresh e Pannion. Veste di grigio o di blu scuro, ascolta con le mani giunte dietro la schiena e parla a bassa voce. Non siede in Consiglio e non si presenta mai da solo."
    requisiti: []

  - id: eolio-drest
    nome: Eolio Drest
    alias: [Eolio]
    tipo: personaggio
    sottotitolo: "Maggiordomo del Maniero Castaldi"
    testo: "Maggiordomo capo del Maniero Castaldi da trent'anni, sotto due generazioni della casata. Porta un campanello di bronzo alla cintura che non suona quasi mai, perché alla servitù dà gli ordini con un sistema di segnali muti inventato da lui. Ricorda ogni stanza della casa e ogni ospite che ci è passato."
    requisiti: []

  - id: brem-anthos
    nome: Brem Anthos
    alias: [Brem]
    tipo: personaggio
    sottotitolo: "Vice di Quintus Vael alla Guardia Castaldi"
    testo: "Il vice di Quintus Vael nella guardia dei Castaldi, giovane ma già veterano, con una spalla che scricchiola quando piove. Fa quasi sempre i turni di notte al Maniero, e conosce il rumore di ogni porta e di ogni tegola di rame."
    requisiti: []

  - id: vesper-castaldi
    nome: Vesper Castaldi
    alias: [Vesper]
    tipo: personaggio
    sottotitolo: "Figlio di Aldous e Marella Castaldi"
    testo: "Il figlio maggiore di Aldous e Marella Castaldi, nipote della Rappresentante. Studia al Maniero con i precettori privati e dorme con la sorella nelle stanze del terzo piano, fra i tetti di rame. Fa domande ai visitatori finché la madre non lo manda via."
    requisiti: []

  - id: mira-castaldi
    nome: Mira Castaldi
    tipo: personaggio
    sottotitolo: "Figlia di Aldous e Marella Castaldi"
    testo: "La figlia minore di Aldous e Marella Castaldi, nipote della Rappresentante. Studia con i precettori al Maniero e dorme con il fratello Vesper al terzo piano, fra i tetti di rame. Parla poco con gli estranei e li guarda molto, come la zia."
    requisiti: []

  - id: guido-sarpa
    nome: Guido Sarpa
    alias: [Sarpa]
    tipo: personaggio
    sottotitolo: "Carrettiere del grano"
    testo: "Carrettiere con la barba grigia tagliata col coltello, che per vent'anni ha guidato i carri del grano dei Malgrani da Laresh alla città. Conosce ogni guado del Torvessa e ogni oste della strada. Dice di sé che lavora per chi paga, e lo dice senza vergogna."
    requisiti: []

  - id: nives-orsat
    nome: Nives Orsat
    alias: [la Gazza]
    tipo: personaggio
    sottotitolo: "Ladra di Ghoran, detta la Gazza"
    testo: "Ladra di professione che viene da Ghoran, minuta, vestita di grigio scuro, con i capelli stretti in una cuffia. La chiamano la Gazza, anche se ruba soltanto carte e mai gioielli. Chi l'ha assoldata racconta che non contratta il prezzo e non sbaglia mai la finestra."
    requisiti: []

  - id: tebaldo-ronchi
    nome: Tebaldo Ronchi
    tipo: personaggio
    sottotitolo: "Procuratore dei Malgrani di Ghoran"
    testo: "Procuratore che cura in città gli affari che la casata dei Malgrani amministra da Ghoran. Veste sempre di nero, con il colletto alto e i guanti anche d'estate, e porta le carte in una cartella di cuoio che non lascia mai a nessuno. Parla con cortesia e ricorda le scadenze di tutti."
    requisiti: []

  - id: anselmo-brey
    nome: Anselmo Brey
    tipo: personaggio
    sottotitolo: "Capo della cooperativa del grano"
    testo: "Il mugnaio che manda avanti il Mulino Malgrani, e che la cooperativa del grano ha scelto come capo quando ha rilevato il mulino. Starnutisce di continuo per la farina, ha le mani infarinate fino ai polsi e un quaderno di conti che tiene meglio dei registri del Comune. In Municipio sale con il cappello in mano e lo rimette appena esce."
    requisiti: [pista.pelle >= 7]
