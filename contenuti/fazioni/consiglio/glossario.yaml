# Glossario della quest del Consiglio (fazione.consiglio): i personaggi nuovi che compaiono nei testi, nel formato
# di contenuti/glossario/personaggi.yaml. Dal Codex: Aldous Castaldi, Eolio Drest, Brem Anthos, Vesper e Mira
# Castaldi. Nuovi: Guido Sarpa, Nives Orsat detta la Gazza, Tebaldo Ronchi, Anselmo Brey.
# Anselmo Brey è il mugnaio del Mulino Malgrani, che c'era già. Mira Castaldi non ha l'alias
# del nome, per via dell'arco «Mira» di Irsa.
glossario:
  - id: aldous-castaldi
    nome: Aldous Castaldi
    alias: [Aldous]
    tipo: personaggio
    sottotitolo: "Fratello della Rappresentante, al Maniero Castaldi"
    testo: "Fratello maggiore di Julia Castaldi, manda avanti il Maniero e gli affari della casata, compresi i contratti con Laresh e Pannion. Veste di scuro, ascolta con le mani giunte dietro la schiena e non siede in Consiglio."
    requisiti: []

  - id: eolio-drest
    nome: Eolio Drest
    alias: [Eolio]
    tipo: personaggio
    sottotitolo: "Maggiordomo del Maniero Castaldi"
    testo: "Maggiordomo capo del Maniero Castaldi da trent'anni. Porta alla cintura un campanello di bronzo che non suona quasi mai, perché alla servitù dà ordini con segnali muti inventati da lui."
    requisiti: []

  - id: brem-anthos
    nome: Brem Anthos
    alias: [Brem]
    tipo: personaggio
    sottotitolo: "Vice di Quintus Vael alla Guardia Castaldi"
    testo: "Il vice di Quintus Vael nella guardia dei Castaldi, giovane ma già veterano, con una spalla che scricchiola quando piove. Fa quasi sempre i turni di notte al Maniero."
    requisiti: []

  - id: vesper-castaldi
    nome: Vesper Castaldi
    alias: [Vesper]
    tipo: personaggio
    sottotitolo: "Figlio di Aldous e Marella Castaldi"
    testo: "Il figlio maggiore di Aldous e Marella Castaldi, nipote della Rappresentante. Studia al Maniero con i precettori, dorme con la sorella al terzo piano e fa domande ai visitatori finché la madre non lo manda via."
    requisiti: []

  - id: mira-castaldi
    nome: Mira Castaldi
    tipo: personaggio
    sottotitolo: "Figlia di Aldous e Marella Castaldi"
    testo: "La figlia minore di Aldous e Marella Castaldi, nipote della Rappresentante. Dorme con il fratello Vesper al terzo piano, fra i tetti di rame, e con gli estranei parla poco e guarda molto, come la zia."
    requisiti: []

  - id: guido-sarpa
    nome: Guido Sarpa
    alias: [Sarpa]
    tipo: personaggio
    sottotitolo: "Carrettiere del grano"
    testo: "Carrettiere con la barba grigia tagliata col coltello, che per vent'anni ha portato il grano dei Malgrani da Laresh alla città. Conosce ogni guado del Torvessa e lavora per chi paga, senza vergogna."
    requisiti: []

  - id: nives-orsat
    nome: Nives Orsat
    alias: [la Gazza]
    tipo: personaggio
    sottotitolo: "Ladra di Ghoran, detta la Gazza"
    testo: "Ladra di Ghoran, minuta, vestita di grigio scuro. La chiamano la Gazza anche se ruba soltanto carte e mai gioielli, e chi l'ha assoldata dice che non sbaglia mai la finestra."
    requisiti: []

  - id: tebaldo-ronchi
    nome: Tebaldo Ronchi
    tipo: personaggio
    sottotitolo: "Procuratore dei Malgrani di Ghoran"
    testo: "Procuratore che cura in città gli affari che i Malgrani amministrano da Ghoran. Veste di nero, porta i guanti anche d'estate e non lascia a nessuno la sua cartella di cuoio."
    requisiti: []

  - id: anselmo-brey
    nome: Anselmo Brey
    tipo: personaggio
    sottotitolo: "Capo della cooperativa del grano"
    testo: "Il mugnaio che la cooperativa del grano ha messo a capo del Mulino Malgrani. Starnutisce di continuo per la farina e tiene un quaderno di conti più preciso dei registri del Comune."
    requisiti: [pista.pelle >= 7]
