    testo: |
      All'alba il Municipio è vuoto, e Julia ti aspetta in piedi dietro la
      scrivania con il registro del Consiglio aperto alla pagina del margine,
      dove sopra il tuo nome a inchiostro c'è una riga dritta, tirata con la
      stessa cura delle cifre. Accanto al registro c'è la spilla del
      Consiglio, sette anelli d'argento intrecciati.

      «Brem Anthos era sulla terrazza sotto i tetti, quella notte» dice senza
      alzare la voce. «Ti ha visto parlare con la ladra, e l'ha vista
      andarsene con le carte di mio fratello in mano. Ha aspettato la fine
      della seduta per dirmelo, perché è un brav'uomo e voleva vedere che
      cosa avresti fatto in sala.»

      {empatia Difficile} Ti odia meno di quanto pensi. Ha fatto il conto di
      quanto le sei costato e di quanto le servi ancora, e i due numeri si
      somigliano.

      «Ieri sera il Consiglio ha votato una voce senza seggio alle sedute, e
      ha votato il tuo nome» continua, «e l'hanno proposto quelli che ti
      conoscono meglio di me. Io non mi sono opposta, perché i voti contano
      anche quando non mi piacciono.» Gira il registro verso di te. «In
      Consiglio parli quanto vuoi, ma sul mio registro il tuo nome resta
      così.»
    opzioni:
      - testo: "Prendere la mazza e uscire"
        descrizione: "La mazza la dà il Consiglio che l'ha votata, mentre la spilla di Julia resta sulla scrivania."
        immagine: icone/flanged-mace
        quando: [pista.pelle < 4]
        esito:
          titolo: Voce del Consiglio
          testo: |
            Tullio ti porta la mazza e una borsa con il sigillo del Consiglio,
            perché il Consiglio paga quello che vota. Julia apre il cassetto e ti
            mostra un disco della Biblioteca con un occhio chiuso inciso sul
            rovescio. «Una notte è uscito da qui ed è tornato» dice. «Te lo mostro
            lo stesso, perché è peggio di te.» Poi lo richiude a chiave, e la
            spilla resta dov'è.
          almeno: { rep.castaldi: 10 }
          effetti: { fazione.consiglio: 1, monete: 400, crepuscolo.indizi: 1, oggetto.consiglio-mazza-del-patto: 1 }
      - testo: "Prendere la mazza e uscire"
        descrizione: "La mazza la dà il Consiglio che l'ha votata, mentre la spilla di Julia resta sulla scrivania."
        immagine: icone/flanged-mace
        quando: [pista.pelle >= 7]
        esito:
          titolo: Voce del Consiglio
          testo: |
            Tullio ti porta la mazza e una borsa con un guscio di metallo chiuso,
            rimasto invenduto all'asta dei Malgrani. Intanto Julia apre il
            cassetto e ti mostra un disco di metallo della Biblioteca con un
            occhio chiuso inciso sul rovescio. «Una notte è uscito da qui ed è
            tornato» dice. «Te lo mostro lo stesso, perché è peggio di te.» Poi lo
            richiude a chiave, e la spilla resta dov'è.
          almeno: { rep.castaldi: 10 }
          effetti: { fazione.consiglio: 1, monete: 300, reperto.sigillato: 1, crepuscolo.indizi: 1, oggetto.consiglio-mazza-del-patto: 1 }
      - testo: "Chiederle perdono"
        descrizione: "Non cambierà la riga sul registro. Forse cambierà il modo in cui lei la rilegge."
        quando: [pista.pelle < 4]
        prova: { attributo: sociale, abilita: empatia, difficolta: Difficile }
        successo:
          titolo: La spilla sul bavero
          testo: |
            Le dici che cosa ti hanno offerto sul tetto e perché hai accettato.
            Julia ti appunta la spilla sul bavero. «La riga resta, e questa la
            porti per ricordarti in sala di che cosa sei capace» dice. Poi, mentre
            Tullio ti porta la mazza e una borsa del Consiglio, ti mostra un disco
            della Biblioteca con un occhio chiuso sul rovescio, uscito una notte
            dal suo cassetto e tornato.
          pe: { empatia: 8 }
          almeno: { rep.castaldi: 10 }
          effetti: { fazione.consiglio: 1, monete: 400, crepuscolo.indizi: 1, oggetto.consiglio-mazza-del-patto: 1, oggetto.consiglio-spilla-del-consiglio: 1 }
        fallimento:
          titolo: La riga dritta
          testo: |
            Cominci a scusarti, e Julia alza una mano e ti dice che le scuse le ha
            sentite da gente migliore. Tullio ti porta la mazza e una borsa del
            Consiglio, e prima di richiudere il cassetto Julia ti mostra un disco
            della Biblioteca con un occhio chiuso inciso sul rovescio, senza dire
            altro. La spilla resta sulla scrivania accanto al registro.
          almeno: { rep.castaldi: 10 }
          effetti: { fazione.consiglio: 1, monete: 400, crepuscolo.indizi: 1, oggetto.consiglio-mazza-del-patto: 1, scandalo: 0.5 }
