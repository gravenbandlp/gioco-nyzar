  # ------------------------------------------------------------ passo 15 · la spilla, dopo il tradimento
  - id: consiglio-la-spilla-cancellata
    presso: municipio
    immagine: personaggi/julia-castaldi
    titolo: La spilla
    sommario: "Julia ti aspetta in ufficio con il registro aperto alla pagina del margine, e il tuo nome ha una riga sopra."
    luogo: Municipio, l'ufficio della Rappresentante, all'alba
    area: quartieri-alti
    requisiti: [fazione.consiglio == 14, consiglio.carte == 3, pista.acciaio >= 8, pista.pelle != 4, pista.pelle != 5, pista.pelle != 6]
    testo: |
      Julia ti aspetta in piedi, con il registro del Consiglio aperto alla pagina del margine. Sopra il tuo
      nome c'è una riga dritta tirata con il righello, così premuta che la penna ha inciso la carta. Accanto
      al registro c'è la spilla del Consiglio a sette anelli d'argento.

      «Brem Anthos era sulla terrazza sotto i tetti, quella notte» dice. «Ti ha visto parlare con la ladra e
      l'ha vista andarsene con le carte di mio fratello. Ha aspettato la fine della seduta per vedere che cosa
      avresti fatto in sala.»

      {empatia Difficile} Ti odia meno di quanto pensi. Ha fatto il conto di quanto le sei costat{o|a} e di
      quanto le servi ancora, e i numeri si somigliano.

      «Ieri sera il Consiglio ha votato una voce senza seggio alle sedute, e ha votato il tuo nome» continua
      girando il registro verso di te. «Io non mi sono opposta, perché i voti valgono anche quando non mi
      piacciono. In sala parlerai quanto vuoi, però di te non mi fido più e sul mio registro il tuo nome resta
      cancellato.»

      Dalla porta socchiusa Tullio non fa nemmeno finta di non ascoltare.
    opzioni:
      - testo: "Prendere la mazza e uscire"
        descrizione: "La mazza è del Consiglio, e il Consiglio ha votato. La spilla di Julia resta sulla scrivania."
        immagine: icone/flanged-mace
        quando: [pista.pelle < 4]
        esito:
          titolo: Voce del Consiglio
          testo: |
            Tullio ti porta la mazza di ferro avvolta in un panno, quella che raddrizza sul tavolo all'inizio
            di ogni seduta, e una borsa con il sigillo del Consiglio, perché il Consiglio paga quello che
            vota. Mentre prendi la mazza Julia apre il cassetto e ti mostra un disco di metallo della
            Biblioteca, con un occhio chiuso inciso sul rovescio. «Una notte è uscito da qui ed è tornato»
            dice. «Te lo mostro lo stesso. Chi l'ha preso mi preoccupa più di te.» Poi lo richiude a chiave, e
            la spilla resta dov'è, accanto alla riga sul registro.
          almeno: { rep.castaldi: 10 }
          effetti: { fazione.consiglio: 1, monete: 400, crepuscolo.indizi: 1, oggetto.consiglio-mazza-del-patto: 1 }
      - testo: "Prendere la mazza e uscire"
        descrizione: "La mazza è del Consiglio, e il Consiglio ha votato. La spilla di Julia resta sulla scrivania."
        immagine: icone/flanged-mace
        quando: [pista.pelle >= 7]
        esito:
          titolo: Voce del Consiglio
          testo: |
            Tullio ti porta la mazza di ferro avvolta in un panno, e dalla cassetta mezza vuota una borsa e un
            guscio di metallo chiuso, rimasto invenduto all'asta del caveau dei Malgrani, perché il Consiglio
            paga quello che vota. Il guscio è liscio e pesa come un sasso di fiume. Mentre prendi la mazza
            Julia apre il cassetto e ti mostra un disco di metallo della Biblioteca, con un occhio chiuso
            inciso sul rovescio. «Una notte è uscito da qui ed è tornato» dice. «Te lo mostro lo stesso. Chi
            l'ha preso mi preoccupa più di te.» Poi lo richiude a chiave, e la spilla resta dov'è.
          almeno: { rep.castaldi: 10 }
          effetti: { fazione.consiglio: 1, monete: 300, reperto.sigillato: 1, crepuscolo.indizi: 1, oggetto.consiglio-mazza-del-patto: 1 }
      - testo: "Chiederle perdono"
        descrizione: "Non cambierà la riga sul registro. Forse cambierà il modo in cui lei la rilegge."
        quando: [pista.pelle < 4]
        prova: { attributo: sociale, abilita: empatia, difficolta: Difficile }
        successo:
          titolo: La spilla sul bavero
          testo: |
            Julia ti ascolta fino in fondo con gli occhi nei tuoi, poi prende la spilla e te la appunta sul
            bavero. Le dita le tremano appena sul fermaglio. «La riga sul registro resta» dice. «La spilla te
            la do perché in sala mi servi, e perché ti sei scusat{o|a} bene. Non farmene pentire.» Tullio ti
            porta la mazza e una borsa del Consiglio. Prima di lasciarti andare Julia ti mostra un disco di
            metallo della Biblioteca, con un occhio chiuso inciso sul rovescio, uscito una notte dal suo
            cassetto e tornato, e non ti dice altro.
          pe: { empatia: 8 }
          almeno: { rep.castaldi: 10 }
          effetti: { fazione.consiglio: 1, monete: 400, crepuscolo.indizi: 1, oggetto.consiglio-mazza-del-patto: 1, oggetto.consiglio-spilla-del-consiglio: 1 }
        fallimento:
          titolo: La riga dritta
          testo: |
            Cominci a scusarti, e Julia alza una mano. «Lascia stare» dice. «Le scuse non cambiano quello che
            è successo, e stamattina non ho tempo di ascoltarle.» Tullio ti porta la mazza avvolta nel panno e
            una borsa del Consiglio. Prima di richiudere il cassetto Julia ti mostra un disco di metallo della
            Biblioteca con un occhio chiuso inciso sul rovescio, e non ti dice altro. La spilla resta sulla
            scrivania accanto al registro aperto, dove la riga sopra il tuo nome ha inciso la carta.
          almeno: { rep.castaldi: 10 }
          effetti: { fazione.consiglio: 1, monete: 400, crepuscolo.indizi: 1, oggetto.consiglio-mazza-del-patto: 1, scandalo: 0.5 }
