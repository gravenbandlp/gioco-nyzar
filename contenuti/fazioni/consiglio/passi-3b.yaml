  # ------------------------------------------------------------ passo 15 · la spilla, dopo il tradimento
  - id: consiglio-la-spilla-cancellata
    presso: municipio
    immagine: personaggi/julia-castaldi
    titolo: La spilla
    sommario: "È l'alba dopo la seduta. Julia ti aspetta in ufficio con il registro aperto alla pagina del margine, e il tuo nome ha una riga sopra."
    luogo: Municipio, l'ufficio della Rappresentante, all'alba
    area: quartieri-alti
    requisiti: [fazione.consiglio == 14, consiglio.carte == 3, pista.acciaio >= 8, pista.pelle != 4, pista.pelle != 5, pista.pelle != 6]
    testo: |
      All'alba il Municipio è vuoto. Julia ti aspetta in piedi dietro la
      scrivania, con il registro del Consiglio aperto alla pagina del margine.
      Il tuo nome a inchiostro è ancora lì, e sopra c'è una riga dritta,
      tirata con la stessa cura delle cifre. Accanto al registro c'è la spilla
      del Consiglio, sette anelli d'argento intrecciati.

      «Brem Anthos era sulla terrazza sotto i tetti, quella notte» dice. «Ti
      ha visto parlare con la ladra, e l'ha vista andarsene con le carte di
      mio fratello in mano. Ha aspettato la fine della seduta per dirmelo,
      perché è un brav'uomo e voleva vedere che cosa avresti fatto in sala.»
      La voce non la alza, come non l'ha mai alzata con nessuno.

      {empatia Difficile} Ti odia meno di quanto pensi. Ha fatto il conto di
      quanto le sei costato e di quanto le servi ancora, e i due numeri si
      somigliano.

      «Ieri sera il Consiglio ha votato una voce senza seggio alle sedute, e
      ha votato il tuo nome» continua. «L'hanno proposto quelli che ti
      conoscono meglio di me, e io non mi sono opposta, perché i voti contano
      anche quando non mi piacciono.» Gira il registro verso di te. «In
      Consiglio parli quanto vuoi. Sul mio registro il tuo nome resta così.»

      {intimidire Media} La riga sul tuo nome non è una minaccia. È un
      promemoria, e Julia i promemoria li rilegge ogni mattina.

      Dalla porta socchiusa Tullio non fa nemmeno finta di non ascoltare.
    opzioni:
      - testo: "Prendere la mazza e uscire"
        descrizione: "La mazza è del Consiglio, e il Consiglio ha votato. La spilla di Julia resta sulla scrivania."
        immagine: icone/flanged-mace
        quando: [pista.pelle < 4]
        esito:
          titolo: Voce del Consiglio
          testo: |
            Tullio ti porta la mazza di ferro avvolta in un panno, quella che
            raddrizza sul tavolo all'inizio di ogni seduta, e una borsa con il
            sigillo del Consiglio, perché il Consiglio paga quello che vota.
            Mentre prendi la mazza Julia apre il cassetto e ti mostra un disco
            di metallo della Biblioteca, con un occhio chiuso inciso sul
            rovescio. «Una notte è uscito da qui ed è tornato» dice. «Questo
            te lo mostro lo stesso, perché è peggio di te.» Poi lo richiude a
            chiave, e la spilla resta dov'è.
          almeno: { rep.castaldi: 10 }
          effetti: { fazione.consiglio: 1, monete: 400, crepuscolo.indizi: 1, oggetto.consiglio-mazza-del-patto: 1 }
      - testo: "Prendere la mazza e uscire"
        descrizione: "La mazza è del Consiglio, e il Consiglio ha votato. La spilla di Julia resta sulla scrivania."
        immagine: icone/flanged-mace
        quando: [pista.pelle >= 7]
        esito:
          titolo: Voce del Consiglio
          testo: |
            Tullio ti porta la mazza di ferro avvolta in un panno, e dalla
            cassetta mezza vuota una borsa e un guscio di metallo chiuso,
            rimasto invenduto all'asta del caveau dei Malgrani, perché il
            Consiglio paga quello che vota. Mentre prendi la mazza Julia apre
            il cassetto e ti mostra un disco di metallo della Biblioteca, con
            un occhio chiuso inciso sul rovescio. «Una notte è uscito da qui
            ed è tornato» dice. «Questo te lo mostro lo stesso, perché è
            peggio di te.» Poi lo richiude a chiave, e la spilla resta dov'è.
          almeno: { rep.castaldi: 10 }
          effetti: { fazione.consiglio: 1, monete: 300, reperto.sigillato: 1, crepuscolo.indizi: 1, oggetto.consiglio-mazza-del-patto: 1 }
      - testo: "Chiederle perdono"
        descrizione: "Non cambierà la riga sul registro. Forse cambierà il modo in cui lei la rilegge."
        quando: [pista.pelle < 4]
        prova: { attributo: sociale, abilita: empatia, difficolta: Difficile }
        successo:
          titolo: La spilla sul bavero
          testo: |
            Invece di cercare scuse le dici che cosa ti hanno offerto sul
            tetto e perché hai detto di sì, e poi taci. Julia ti ascolta fino
            in fondo, con gli occhi nei tuoi, poi prende la spilla e te la
            appunta sul bavero. «La riga resta, e questa la porti perché ogni
            volta che parli in sala ti ricordi di che cosa sei capace» dice.
            Tullio ti porta la mazza e una borsa del Consiglio. Prima di
            lasciarti andare Julia ti mostra un disco di metallo della
            Biblioteca, con un occhio chiuso inciso sul rovescio, uscito una
            notte dal suo cassetto e tornato, e non ti dice altro.
          pe: { empatia: 8 }
          almeno: { rep.castaldi: 10 }
          effetti: { fazione.consiglio: 1, monete: 400, crepuscolo.indizi: 1, oggetto.consiglio-mazza-del-patto: 1, oggetto.consiglio-spilla-del-consiglio: 1 }
        fallimento:
