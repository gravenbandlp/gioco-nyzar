            di metallo senza una giuntura, che all'asta del caveau dei Malgrani
            non ha voluto nessuno. «Il resto della paga te lo devo, e me lo
            ricorderò» dice.
          pe: { politica-ed-economia: 5 }
          almeno: { rep.castaldi: 10 }
          effetti: { fazione.consiglio: 1, monete: 300, reperto.sigillato: 1, crepuscolo.indizi: 1, oggetto.consiglio-mazza-del-patto: 1, oggetto.consiglio-spilla-del-consiglio: 1 }
      - testo: "Guardare meglio il segno prima di rispondere"
        descrizione: "Un occhio chiuso inciso su un oggetto della Biblioteca, da guardare da vicino prima di rispondere."
        quando: [pista.pelle < 4]
        prova: { attributo: mentale, abilita: [percezione, tecnologia], difficolta: Media }
        successo:
          titolo: La punta sottile
          testo: |
            Giri il disco verso la finestra. Il segno l'ha inciso con una punta
