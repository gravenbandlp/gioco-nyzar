          effetti: { fazione.consiglio: 1, monete: 400, crepuscolo.indizi: 1, informazioni.segreto: 1, oggetto.consiglio-mazza-del-patto: 1, oggetto.consiglio-spilla-del-consiglio: 1 }
        fallimento:
