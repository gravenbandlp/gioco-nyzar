        quando: [pista.pelle >= 7]
        esito:
          titolo: Voce del Consiglio
          testo: |
            Julia ti appunta la spilla sul bavero con le sue dita. Poi apre la cassetta di ferro, che è mezza
            vuota, e ti dà una borsa con il sigillo del Consiglio e un guscio di metallo chiuso. Lo rigiri fra
            le mani e non trovi una giuntura, e il metallo resta freddo anche dopo che l'hai tenuto un po'.
            «Questo all'asta del caveau dei Malgrani non l'ha voluto nessuno» dice. «Ti devo ancora una parte
            della paga. L'ho scritto sul registro, così non me ne dimentico.» Tullio entra con il tè, e dal
            bancone, quando esci, ti saluta inforcando gli occhiali.
          pe: { politica-ed-economia: 5 }
          almeno: { rep.castaldi: 10 }
          effetti: { fazione.consiglio: 1, monete: 300, reperto.sigillato: 1, crepuscolo.indizi: 1, oggetto.consiglio-mazza-del-patto: 1, oggetto.consiglio-spilla-del-consiglio: 1 }
      - testo: "Guardare meglio il segno prima di rispondere"
        descrizione: "Un occhio chiuso inciso su un oggetto della Biblioteca. Prima di prendere la mazza, vale la pena guardarlo da vicino."
        quando: [pista.pelle < 4]
        prova: { attributo: mentale, abilita: [percezione, tecnologia], difficolta: Media }
        successo:
          titolo: La punta sottile
          testo: |
            Il segno è inciso con una punta d'acciaio da incisore, e la mano che l'ha fatto era sicura e
            l'aveva già fatto altre volte. Il solco ha i bordi netti e sul fondo il metallo è ancora lucido,
            mentre tutto intorno il disco è scuro. Julia ti guarda guardare, e non dice niente. Poi ti dà la
            mazza, ti appunta la spilla sul bavero e ti mette in mano una borsa pesante con il sigillo del
            Consiglio. «Erano soldi per le licenze, e le licenze possono aspettare» dice.
          pe: { percezione: 5 }
          almeno: { rep.castaldi: 10 }
          effetti: { fazione.consiglio: 1, monete: 400, crepuscolo.indizi: 1, informazioni.segreto: 1, oggetto.consiglio-mazza-del-patto: 1, oggetto.consiglio-spilla-del-consiglio: 1 }
        fallimento:
