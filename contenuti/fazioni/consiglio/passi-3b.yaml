# Quest del Consiglio, terzo atto, la fine (fazione.consiglio 13 → 15). Stessi requisiti di passi-3.yaml.
# - passo 14, la seduta, in tre scene:
#   `consiglio-la-vigilia` (fazione.consiglio == 13, Municipio) è una scena da cui si torna: ogni opzione conta il
#   voto di un consigliere e poi sparisce (consiglio.voto-<seggio>: 1 con Julia, 2 perso). Vantes con rep.velo >= 2,
#   con consiglio.voce == 1, con Persuasione Media o con la via dell'Accolito; Tenebra con rep.raschiatori >= 2, con
#   consiglio.voce == 2 o con Intimidire Difficile; Cordani con consiglio.grano != 2 (una ragione pulita), con
#   consiglio.voce 3 o 4 o con Politica ed economia Media; la sedia dei Tarvelin con consiglio.tarvelin 1 o 2. Ogni
#   voto vale consiglio.voti +1 (le carte di Aldous salvate al passo 13 ne valgono già uno). «Entrare in sala» porta
#   alla seduta, prima (`consiglio-la-seduta`, Ottone e la sedia dei Tarvelin) o dopo la caduta di Ottone
#   (`consiglio-la-seduta-dei-malgrani`, Ronchi e la sedia dei Malgrani).
#   La seduta è la boss battle sociale: due vie Difficili (Persuasione o Espressività, Politica ed economia o
#   Accademiche). Se riesce consiglio.voti +3; se fallisce Scandalo +1 e rep.castaldi −1. Prima della caduta, con
#   rep.malgrani >= 2 o consiglio.voce == 5, si può mediare con Ottone (consiglio.esito 3, licenze rinviate e debito
#   dilazionato) e il passo si chiude lì.
#   `consiglio-lo-spoglio` conta: con consiglio.voti >= 5 si vince (consiglio.esito 1). Prima della caduta la sedia
#   dei Tarvelin non va alla Gilda; dopo, chi vince sceglie il seggio dei Malgrani (seggio.malgrani 1 alle cooperative
#   con Marko Thessel, se non è partito per Laresh, o con Anselmo Brey; 2 alla Gilda; 3 all'erede in cambio del
#   debito cancellato, consiglio.debito 2). Con meno voti si perde (consiglio.esito 2): prima la sedia va alla
#   Gilda per ora, dopo decide Ronchi (seggio.malgrani 3, il debito resta).
# - passo 15, la spilla: tre ingressi. `consiglio-la-spilla` (seduta vinta o mediata), `consiglio-la-spilla-amara`
#   (seduta persa), tutti e due verso `consiglio-il-dispositivo`, dove Julia mostra il dispositivo della Biblioteca
#   con l'occhio chiuso (crepuscolo.indizi +1) e dà il grado V. `consiglio-la-spilla-cancellata` se al passo 13 hai
#   lasciato le carte alla Gazza (consiglio.carte == 3): Julia lo sa e cancella il tuo nome dal suo registro, ma il
#   Consiglio ha votato la Voce e la mazza è del Consiglio; la spilla di Julia, in quel ramo, si ottiene solo
#   chiedendole perdono (Empatia Difficile). Il grado V dà sempre la mazza del Patto (grado 4); la borsa è più
#   grossa prima della caduta, dopo è più piccola e ci si aggiunge un reperto del caveau dei Malgrani rimasto
#   invenduto.
storylet:
  # ------------------------------------------------------------ passo 14 · la vigilia
  - id: consiglio-la-vigilia
    presso: municipio
    immagine: fazioni/consiglio-di-qir-azel
    titolo: La vigilia della seduta
    sommario: "Alla sesta campana c'è seduta, e Tullio ha una lista dei sette seggi da riempire."
    luogo: Municipio, il bancone di Tullio
    area: quartieri-alti
    requisiti: [fazione.consiglio == 13, pista.acciaio >= 8, pista.pelle != 4, pista.pelle != 5, pista.pelle != 6]
    testo: |
      La seduta è alla sesta campana, e la panca dell'anticamera è già piena
      di gente che vuole un posto in tribuna. Sul bancone Tullio Merga ha
      preparato la lista dei sette seggi, con una croce già segnata accanto a
      Julia e una accanto a Galdrick.

      {politica-ed-economia Media} Due croci sicure e una sedia che vota
      sempre contro. Le quattro che restano, dal Velo ai Tarvelin, hanno
      ognuna il suo prezzo, e non sempre si paga in monete.

      Passandoti accanto con le pratiche sotto il braccio, Julia ti dice che
      la mozione la presenterà l'altra parte e lei risponderà per ultima.

      {origine rampollo-dei-quartieri-alti} Nelle case dei Quartieri Alti i
      voti si contano a colazione, diceva tua madre versando il tè, e chi non
      li ha contati in sala ci arriva per farsi contare.

      Tullio ti porge la lista e una matita con la punta appena fatta.
    opzioni:
      # Padre Vantes
      - testo: "Passare in Cattedrale da Padre Vantes"
        descrizione: "Il Velo ti conosce, e Vantes vota con chi il Velo conosce."
        immagine: personaggi/padre-vantes
        quando: [consiglio.voto-vantes == 0]
        requisiti: [rep.velo >= 2]
        esito:
          titolo: La mano del Gran Sacerdote
          testo: |
            Vantes ti riceve in sacrestia mentre due chierici gli allacciano i
            paramenti della seduta, ti ascolta per poco e ti posa la mano sul
            braccio. Il Velo, dice, voterà con la Rappresentante. Sulla lista di
            Tullio metti una croce accanto al Velo.
          imposta: { consiglio.voto-vantes: 1 }
          effetti: { consiglio.voti: 1 }
      - testo: "Ricordare a Vantes la conversazione sullo scalone"
        descrizione: "Il Velo vota con Julia, ti ha detto, finché lei non lo fa scegliere fra sé e la città."
        immagine: personaggi/padre-vantes
        quando: [consiglio.voto-vantes == 0, consiglio.voce == 1]
        esito:
          titolo: Lo scalone
          testo: |
            Glielo ricordi sul sagrato, e Vantes sorride come a un buon allievo.
            Oggi, dice, la Rappresentante non chiede al Velo di scegliere, e
            quindi il Velo vota con lei. Sulla lista di Tullio metti una croce
            accanto al Velo.
          imposta: { consiglio.voto-vantes: 1 }
          effetti: { consiglio.voti: 1 }
      - testo: "Convincere Padre Vantes"
        descrizione: "Vantes vota secondo coscienza, e la coscienza del Velo ascolta chi la sa prendere dal verso giusto."
        immagine: personaggi/padre-vantes
        quando: [consiglio.voto-vantes == 0]
        prova: { attributo: sociale, abilita: [persuasione, galateo], difficolta: Media }
        successo:
          titolo: La coscienza del Velo
          testo: |
            In sacrestia gli parli delle petizioni con le croci al posto delle
            firme e della cassa dei respinti, e Vantes ti lascia finire. Il Velo,
            dice, non ha mai saputo dire di no a una vedova, e oggi la vedova è la
            Rappresentante. Sulla lista di Tullio metti una croce accanto al Velo.
          pe: { persuasione: 5 }
          imposta: { consiglio.voto-vantes: 1 }
          effetti: { consiglio.voti: 1 }
        fallimento:
          titolo: Secondo coscienza
          testo: |
            Vantes ti ascolta con la mano sul tuo braccio e alla fine ti benedice,
            perché la coscienza del Velo stamattina non ha ancora deciso. Accanto
            al Velo lasci lo spazio bianco.
          imposta: { consiglio.voto-vantes: 2 }
          effetti: { scandalo: 0.5 }

      # Tenebra
      - testo: "Scendere ai Ponti a cercare Tenebra"
        descrizione: "Tenebra vota sul Labirinto, o quando glielo chiede chi ci è sceso."
        immagine: personaggi/tenebra
        quando: [consiglio.voto-tenebra == 0]
        requisiti: [rep.raschiatori >= 2]
        esito:
          titolo: Le lanterne
          testo: |
            Sul Ponte dei Morti Tenebra ti chiede in cambio del voto una voce dei
            Raschiatori sulle decisioni che riguardano il denaro della città.
            Gliela prometti a nome di Julia, e accanto ai Raschiatori metti una
            croce.
          imposta: { consiglio.voto-tenebra: 1 }
          effetti: { consiglio.voti: 1 }
      - testo: "Ricordare a Tenebra le squadre"
        descrizione: "Gli hai chiesto delle squadre, e lui ha detto che se ne sarebbe ricordato."
        immagine: personaggi/tenebra
        quando: [consiglio.voto-tenebra == 0, consiglio.voce == 2]
        esito:
          titolo: Si ricorda
          testo: |
            Tenebra è già sotto il portico del Municipio, e prima che tu parli ti
            dice quante squadre sono scese questa settimana e quante sono
            risalite. Si ricorda, e oggi vota con la Rappresentante. Accanto ai
            Raschiatori metti una croce.
          imposta: { consiglio.voto-tenebra: 1 }
          effetti: { consiglio.voti: 1 }
      - testo: "Mettere Tenebra davanti a quello che perde"
        descrizione: "Con un seggio in più alla Gilda, i Raschiatori pagheranno le lanterne a peso d'oro."
        immagine: personaggi/tenebra
        quando: [consiglio.voto-tenebra == 0]
        prova: { attributo: sociale, abilita: intimidire, difficolta: Difficile }
        successo:
          titolo: Il prezzo delle lanterne
          testo: |
            Gli elenchi i dazi della Gilda sulle funi e sull'olio delle lanterne,
            e quanto saliranno con un voto in più al tavolo. Tenebra resta
            immobile sotto il cappuccio, poi dice che voterà con la Rappresentante
            e che vuole, firmata, una voce sulle decisioni del denaro. Accanto ai
            Raschiatori metti una croce.
          pe: { intimidire: 6 }
          imposta: { consiglio.voto-tenebra: 1 }
          effetti: { consiglio.voti: 1 }
        fallimento:
          titolo: Il cappuccio calato
          testo: |
            Tenebra ti lascia finire senza muoversi, poi ti dice che i Raschiatori
            le paure se le scelgono da soli, e che oggi non votano. Accanto ai
            Raschiatori lasci lo spazio bianco.
          imposta: { consiglio.voto-tenebra: 2 }
          effetti: { sospetto: 0.5 }

      # Tarquin Cordani
      - testo: "Dare a Cordani la ragione pulita che cercava"
        descrizione: "Con il debito dei Castaldi pagato, le licenze non sono più la vendetta di una casata indebitata."
        quando: [consiglio.voto-cordani == 0, consiglio.grano != 2]
        esito:
          titolo: Una ragione pulita
          testo: |
            Sui gradini della Casa dei Nodi gli racconti del grano di Laresh e di
            come è stato usato, e Cordani muove molto le mani mentre ascolta. Una
            Rappresentante che paga i suoi debiti prima di toccare i mulini degli
            altri, dice, è una ragione pulita, e la Gilda voterà con lei. Accanto
            alla Gilda metti una croce.
          imposta: { consiglio.voto-cordani: 1 }
          effetti: { consiglio.voti: 1 }
      - testo: "Ricordare a Cordani i conti dei dazi"
        descrizione: "Dopo la prima seduta ti ha detto che cosa gli serviva per votare con la Rappresentante."
        quando: [consiglio.voto-cordani == 0, consiglio.voce == 3]
        esito:
          titolo: I polsini
          testo: |
            Cordani ti riconosce dai conti dei dazi e ti dice che ha ripensato a
            quella conversazione più di quanto avrebbe voluto, e che la Gilda,
            almeno oggi, voterà con la Rappresentante. Accanto alla Gilda metti
            una croce.
          imposta: { consiglio.voto-cordani: 1 }
          effetti: { consiglio.voti: 1 }
      - testo: "Usare quello che ti ha detto la Caserma"
        descrizione: "La Caserma ti ha detto chi chiede i rinvii e per conto di chi, cosa che Cordani non ama sentire."
        quando: [consiglio.voto-cordani == 0, consiglio.voce == 4]
        esito:
          titolo: Chi chiede i rinvii
          testo: |
            Sui gradini della Casa dei Nodi gli dici a voce bassa chi in Consiglio
            chiede i rinvii per conto della Gilda senza che il Sovrintendente lo
            sappia. Le mani di Cordani si fermano. Oggi, dice, la Gilda voterà
            come decide il suo Sovrintendente, cioè con la Rappresentante. Accanto
            alla Gilda metti una croce.
          imposta: { consiglio.voto-cordani: 1 }
          effetti: { consiglio.voti: 1 }
      - testo: "Convincere Cordani con i conti"
        descrizione: "Cordani vuole una ragione pulita per votare, e bisogna dargliela in cifre."
        quando: [consiglio.voto-cordani == 0]
        prova: { attributo: mentale, abilita: politica-ed-economia, difficolta: Media }
        successo:
          titolo: Le cifre
          testo: |
            Gli mostri sulla lista il prezzo della farina negli ultimi tre anni e
            quello del pane in Città Bassa, colonna accanto a colonna, e Cordani
            ferma le mani su una riga. Con questi conti, dice, la Gilda può votare
            con la Rappresentante senza vergognarsene alla Casa dei Nodi. Accanto
            alla Gilda metti una croce.
          pe: { politica-ed-economia: 5 }
          imposta: { consiglio.voto-cordani: 1 }
          effetti: { consiglio.voti: 1 }
        fallimento:
          titolo: La riga sbagliata
          testo: |
            Cordani trova l'errore alla seconda colonna e te lo indica con un
            dito, molto cortesemente, perché la Gilda vota sui conti giusti.
            Accanto alla Gilda lasci lo spazio bianco.
          imposta: { consiglio.voto-cordani: 2 }
          effetti: { scandalo: 0.5 }

      # la sedia dei Tarvelin
      - testo: "Accompagnare in sala la nuova voce dei Tarvelin"
        descrizione: "Il nome detto davanti a te sulla soglia del Maniero Tarvelin oggi siede per la prima volta."
        immagine: ambientazione/maniero-tarvelin
        quando: [consiglio.voto-tarvelin == 0, consiglio.tarvelin >= 1, consiglio.tarvelin <= 2]
        esito:
          titolo: Il nastro nero
          testo: |
            La nuova voce dei Tarvelin arriva a piedi e in anticipo e ti chiede di
            salire le scale insieme. In sala Tullio slega il nastro nero dalla
            sedia e lo ripiega con cura, e quando metti la croce accanto ai
            Tarvelin la matita ti trema un poco.
          imposta: { consiglio.voto-tarvelin: 1 }
          effetti: { consiglio.voti: 1 }

      # in sala
      - testo: "Entrare in sala"
        descrizione: "Suona la sesta campana, e quello che manca alla lista si decide in sala."
        quando: [pista.pelle < 4]
        costo: 0
        esito:
          titolo: La sesta campana
          testo: |
            Restituisci la lista a Tullio, che la piega in quattro e se la infila
            nel panciotto, e salite insieme verso la sala consiliare, dove la
            tribuna è già piena fino alla balaustra.
          segue: consiglio-la-seduta
      - testo: "Entrare in sala"
        descrizione: "Suona la sesta campana, e quello che manca alla lista si decide in sala."
        quando: [pista.pelle >= 7]
        costo: 0
        esito:
          titolo: La sesta campana
          testo: |
            Restituisci la lista a Tullio, che la piega in quattro e se la infila
            nel panciotto, e salite insieme verso la sala consiliare, dove la
            tribuna è già piena fino alla balaustra.
          segue: consiglio-la-seduta-dei-malgrani

      - testo: "Parlare a Vantes come un novizio del Velo"
        descrizione: "In Cattedrale hai imparato come si chiede una cosa al Gran Sacerdote, e in che ordine."
        immagine: personaggi/padre-vantes
        quando: [consiglio.voto-vantes == 0, origine.accolito-del-velo >= 1]
        esito:
          titolo: Nell'ordine giusto
          testo: |
            Ti inginocchi davanti a Vantes e gli chiedi il voto con le parole che
            ti hanno insegnato da novizio, con la città prima della
            Rappresentante. Vantes sorride, ti fa alzare con una mano sotto il
            gomito e dice che il Velo voterà con lei. Accanto al Velo metti una
            croce.
          pe: { galateo: 3 }
          imposta: { consiglio.voto-vantes: 1 }
          effetti: { consiglio.voti: 1 }

  # ------------------------------------------------------------ passo 14 · la seduta, prima della caduta di Ottone
  - id: consiglio-la-seduta
    immagine: personaggi/ottone-malgrani
    titolo: La seduta
    tipo: seguito
    luogo: Municipio, la sala consiliare
    area: quartieri-alti
    requisiti: [fazione.consiglio == 13]
    testo: |
      La sala consiliare è piena come non l'hai mai vista, e la tribuna
      scricchiola sotto i gomiti di chi si sporge dalla balaustra. Tullio
      raddrizza la mazza, e Ottone Malgrani si alza per primo, con il
      panciotto ricamato e i guanti in mano, a presentare la mozione della
      Gilda sulla sedia dei Tarvelin, sicuro dei voti contati la sera prima.

      Dietro di lui, contro il muro, c'è Tebaldo Ronchi con la cartella di
      cuoio stretta sotto il braccio, tenuta in modo che tutti la vedano. Che
      cosa ci sia dentro, dopo la notte sui tetti del Maniero, lo sai soltanto
      tu, e Julia la guarda più spesso di quanto guardi Ottone.

      Quando Ottone si siede, Julia non si alza. Si gira verso la tribuna e ti
      fa un cenno con il mento davanti a tutti, e in sala qualcuno ride piano.
      Accanto al suo seggio c'è uno sgabello senza schienale, che Tullio ha
      messo lì stamattina senza che nessuno glielo chiedesse.

      {origine mercante-dei-ponti} Hai visto Ottone vendere farina al banco
      con la stessa faccia, senza mai alzare il prezzo ad alta voce; il prezzo
      lo alza dopo, quando il cliente ha già detto di sì.
    opzioni:
      - testo: "Parlare per Julia davanti alla sala"
        descrizione: "La sala deve sentire che cosa farebbe la Gilda con un voto in più, e la tribuna fa il resto."
        prova: { attributo: sociale, abilita: [persuasione, espressivita], difficolta: Difficile }
        successo:
          titolo: La tribuna in piedi
          testo: |
            Parli in piedi accanto allo sgabello, senza guardare il foglio.
            Racconti della panca con le ventitré tacche e del grano di Laresh, e
            di quante pratiche il Consiglio ha rinviato solo perché una sedia
            restasse vuota, e a metà la tribuna smette di scricchiolare. Quando ti
            siedi Ottone ha i guanti stretti in un pugno, e Ronchi tiene la
            cartella chiusa.
          pe: { persuasione: 8 }
          effetti: { consiglio.voti: 3 }
          segue: consiglio-lo-spoglio
        fallimento:
          titolo: La risata in tribuna
          testo: |
            Perdi il filo sulle tacche della panca e la tribuna ride nel punto
            sbagliato, mentre Ottone si alza a ringraziarti della passione. Ronchi
            apre la cartella di un dito e la richiude, e mezza sala lo vede.
          effetti: { scandalo: 1.5, rep.castaldi: -1 }
          segue: consiglio-lo-spoglio

      - testo: "Rispondere a Ottone con i conti"
        descrizione: "Il registro del Patto e il prezzo della farina rispondono al decoro di Ottone in cifre."
        prova: { attributo: mentale, abilita: [politica-ed-economia, accademiche], difficolta: Difficile }
        successo:
          titolo: La clausola della soglia
          testo: |
            Apri il registro del Patto sullo sgabello e leggi la clausola della
            soglia parola per parola, poi il prezzo della farina degli ultimi tre
            anni mulino per mulino, con i nomi dei proprietari, senza mai alzare
            la voce. Quando chiudi il registro Cordani ha le mani ferme sul tavolo
            e Ottone guarda Ronchi, che guarda il pavimento.
          pe: { politica-ed-economia: 8 }
          effetti: { consiglio.voti: 3 }
          segue: consiglio-lo-spoglio
        fallimento:
          titolo: Il riporto
          testo: |
            Al terzo anno sbagli una colonna, e Ottone te lo fa notare con un
            sorriso davanti a tutta la sala. Da lì in avanti ogni cifra suona come
            un tentativo, e la tribuna comincia a parlare a voce bassa.
          effetti: { scandalo: 1.5, rep.castaldi: -1 }
          segue: consiglio-lo-spoglio

      - testo: "Mediare con Ottone"
        descrizione: "I Malgrani ti conoscono, e con una mediazione nessuno perde la faccia e nessuno vince."
        immagine: personaggi/ottone-malgrani
        requisiti: [rep.malgrani >= 2]
        esito:
          titolo: La mediazione
          testo: |
            Chiedi una sospensione e nella stanzetta dietro la sala tratti con
            Ottone mentre Ronchi prende appunti. Le licenze tornano in fondo alla
            pila fino alla prossima stagione e la sedia dei Tarvelin resta vuota
            fino a un voto vero; le obbligazioni dei Castaldi slittano di un anno,
            e in sala la mozione viene ritirata con molta cortesia. Julia approva
            senza commenti e, uscendo, non ti stringe la mano.
          pe: { persuasione: 5 }
          imposta: { consiglio.esito: 3 }
          effetti: { fazione.consiglio: 1, rep.malgrani: 1 }
      - testo: "Mediare con Ottone, che ti ha già parlato"
        descrizione: "Sullo scalone Ottone ti ha trattato da persona con cui si può parlare."
        immagine: personaggi/ottone-malgrani
        quando: [consiglio.voce == 5]
        esito:
          titolo: La mediazione
          testo: |
            Chiedi una sospensione, e Ottone ti segue nella stanzetta dietro la
            sala infilandosi i guanti dito per dito, perché si ricorda di te. Le
            licenze tornano in fondo alla pila fino alla prossima stagione e la
            sedia dei Tarvelin resta vuota fino a un voto vero; le obbligazioni
            dei Castaldi slittano di un anno. Julia approva senza commenti e,
            uscendo, non ti stringe la mano.
          pe: { persuasione: 5 }
          imposta: { consiglio.esito: 3 }
          effetti: { fazione.consiglio: 1, rep.malgrani: 1 }

  # ------------------------------------------------------------ passo 14 · la seduta, dopo la caduta di Ottone
  - id: consiglio-la-seduta-dei-malgrani
    immagine: fazioni/consiglio-di-qir-azel
    titolo: La seduta
    tipo: seguito
    luogo: Municipio, la sala consiliare
    area: quartieri-alti
    requisiti: [fazione.consiglio == 13]
    testo: |
      La sala consiliare è piena come non l'hai mai vista, e in tribuna, fra la
      gente dei Quartieri Alti, ci sono i mugnai e i taglialegna delle
      cooperative con il cappello in mano. Tullio raddrizza la mazza. La sedia
      dei Malgrani, che stava contro il muro dal giorno della condanna di
      Ottone, stamattina l'hanno rimessa al tavolo.

      Dietro la sedia vuota, in piedi perché non ha diritto di sedersi, Tebaldo
      Ronchi presenta con voce gentile e precisa la richiesta di Urtilia
      Mendion, che vuole il seggio dei Malgrani per il primogenito di Ottone,
      sotto la tutela della prozia, e offre in cambio la cancellazione delle
      obbligazioni di grano della casata della Rappresentante. Che cosa ci sia
      nella sua cartella di cuoio, dopo la notte sui tetti del Maniero, lo sai
      soltanto tu.

      {politica-ed-economia Media} Ha messo il debito di Julia sul tavolo del
      Consiglio come un regalo. Se lei rifiuta, la tribuna saprà che ha un
      debito, e se accetta saprà a chi lo deve.

      Julia non si alza. Si gira verso di te e ti fa un cenno con il mento,
      davanti a tutti, verso lo sgabello senza schienale che Tullio ha messo
      accanto al suo seggio stamattina.

      {origine fuggiasco-di-ghoran} L'inchiostro marrone sulle carte di Ronchi
      lo conosci, perché a Ghoran ci scrivono i contratti di vendita al
      mercato.
    opzioni:
      - testo: "Parlare per Julia davanti alla sala"
        descrizione: "La sala deve sentire che cosa vuol dire un seggio comprato da Ghoran."
        prova: { attributo: sociale, abilita: [persuasione, espressivita], difficolta: Difficile }
        successo:
          titolo: La tribuna in piedi
          testo: |
            Parli in piedi accanto allo sgabello e racconti della panca con le
            ventitré tacche e del grano di Laresh, e di un seggio della città
            deciso da una donna che sta a Ghoran. A metà del discorso i mugnai in
            tribuna si rimettono il cappello uno dopo l'altro, come si fa in Città
            Bassa quando si è d'accordo, e Ronchi ti ascolta fino in fondo
            annuendo.
          pe: { persuasione: 8 }
          effetti: { consiglio.voti: 3 }
          segue: consiglio-lo-spoglio
        fallimento:
          titolo: Il regalo
          testo: |
            Cominci dal debito, e la tribuna sente soltanto quello. Ronchi ti
            ringrazia di aver spiegato così bene quanto sia generosa l'offerta di
            Urtilia, e mezza sala ride.
          effetti: { scandalo: 1.5, rep.castaldi: -1 }
          segue: consiglio-lo-spoglio

      - testo: "Rispondere a Ronchi con il Patto"
        descrizione: "Il Patto dice come si nomina un seggio, e non dice niente di tutori a Ghoran."
        prova: { attributo: mentale, abilita: [politica-ed-economia, accademiche], difficolta: Difficile }
        successo:
          titolo: La soglia del maniero
          testo: |
            Apri il registro del Patto sullo sgabello e leggi la clausola della
            soglia, poi ricordi alla sala che il Maniero Malgrani l'ha comprato la
            città all'asta, e che sulla sua soglia non c'è più nessuno dei
            Malgrani a nominare niente. Ronchi ti ascolta senza interromperti, e
            quando chiudi il registro è il primo a sorridere.
          pe: { politica-ed-economia: 8 }
          effetti: { consiglio.voti: 3 }
          segue: consiglio-lo-spoglio
        fallimento:
          titolo: La tutela
          testo: |
            Ronchi ti risponde con un'altra clausola, due pagine dopo, sulle
            tutele dei minori delle casate firmatarie, e la legge ad alta voce con
            l'indice sulla riga. La tribuna comincia a parlare a voce bassa.
          effetti: { scandalo: 1.5, rep.castaldi: -1 }
          segue: consiglio-lo-spoglio

  # ------------------------------------------------------------ passo 14 · lo spoglio
  - id: consiglio-lo-spoglio
    immagine: fazioni/consiglio-di-qir-azel
    titolo: Lo spoglio
    tipo: seguito
    luogo: Municipio, la sala consiliare
    area: quartieri-alti
    requisiti: [fazione.consiglio == 13]
    testo: |
      Tullio chiama i seggi uno per uno, nell'ordine del Patto, con la lista
      piegata ancora nel panciotto. A ogni nome una mano si alza o resta sul
      tavolo, e Tullio fa un segno a matita sul registro senza guardare
      nessuno in faccia. In tribuna non parla più nessuno.

      Julia tiene le mani intrecciate sul tavolo, così strette che le nocche
      sono bianche, e invece delle mani alzate guarda la matita di Tullio.

      {politica-ed-economia Facile} Le croci che hai messo stamattina adesso
      sono mani alzate o mani ferme, e quello che hai detto in sala ha
      spostato quelle che mancavano, oppure no.
    opzioni:
      - testo: "La sedia dei Tarvelin resta alla città"
        descrizione: "La mozione della Gilda è respinta."
        quando: [pista.pelle < 4, consiglio.voti >= 5]
        esito:
          titolo: Respinta
          testo: |
            Tullio scrive *respinta* sul registro e la sottolinea due volte. La
            sedia dei Tarvelin non va alla Gilda, e le licenze sul grano restano
            all'ordine del giorno. Ottone esce per primo infilandosi i guanti e
            Ronchi lo segue. Quando in tribuna qualcuno batte le mani, Tullio lo
            guarda finché non smette. Julia raccoglie le pratiche con gli angoli
            pari e ti dice di passare da lei domattina all'alba.
          pe: { politica-ed-economia: 6 }
          imposta: { consiglio.esito: 1 }
          effetti: { fazione.consiglio: 1, rep.castaldi: 1 }
      - testo: "La sedia dei Tarvelin va alla Gilda, per ora"
        descrizione: "La mozione della Gilda passa."
        quando: [pista.pelle < 4, consiglio.voti < 5]
        esito:
          titolo: Approvata
          testo: |
            Tullio scrive *approvata* sul registro, con una grafia più piccola del
            solito. La Gilda terrà la sedia dei Tarvelin finché l'erede non si
            presenta, e le licenze sul grano tornano in fondo alla pila. Ottone
            saluta la Rappresentante con un inchino perfetto, e Julia raccoglie le
            pratiche e ti dice di passare da lei domattina all'alba.
          imposta: { consiglio.esito: 2 }
          effetti: { fazione.consiglio: 1 }

      - testo: "Il seggio dei Malgrani alle cooperative, con Marko Thessel"
        descrizione: "Marko Thessel sa leggere una venatura e trattare con Laresh, e conosce la Segheria della cooperativa."
        immagine: personaggi/marko-thessel
        quando: [pista.pelle >= 7, consiglio.voti >= 5, segheria.cooperativa != 2]
        esito:
          titolo: La camicia di lino
          testo: |
            Tullio scrive *respinta* accanto alla richiesta di Urtilia, e la sala
            vota di nuovo sulla proposta di Julia, il seggio dei Malgrani alle
            cooperative con Marko Thessel a sederlo. Marko scende dalla tribuna
            con la camicia di lino chiaro cambiata apposta e si siede sulla sedia
            dei Malgrani come su una sedia qualunque. Ronchi se ne va salutando
            tutti, e Julia ti dice di passare da lei domattina all'alba.
          pe: { politica-ed-economia: 6 }
          imposta: { consiglio.esito: 1, seggio.malgrani: 1 }
          effetti: { fazione.consiglio: 1, rep.castaldi: 1, nomea.citta-bassa: 1 }
      - testo: "Il seggio dei Malgrani alle cooperative, con Anselmo Brey"
        descrizione: "Anselmo Brey, capo della cooperativa del grano, ha il quaderno dei conti in tasca e la farina fino ai polsi."
        quando: [pista.pelle >= 7, consiglio.voti >= 5]
        esito:
          titolo: Il cappello in mano
          testo: |
            Tullio scrive *respinta* accanto alla richiesta di Urtilia, e la sala
            vota di nuovo sulla proposta di Julia, il seggio dei Malgrani alle
            cooperative con Anselmo Brey a sederlo. Anselmo scende dalla tribuna
            con la farina ancora sulle maniche e si siede tenendo il cappello
            sulle ginocchia. Ronchi se ne va salutando tutti, e Julia ti dice di
            passare da lei domattina all'alba.
          pe: { politica-ed-economia: 6 }
          imposta: { consiglio.esito: 1, seggio.malgrani: 1 }
          effetti: { fazione.consiglio: 1, rep.castaldi: 1, nomea.citta-bassa: 1 }
      - testo: "Il seggio dei Malgrani alla Gilda"
        descrizione: "La Gilda avrebbe due voti al tavolo, e Cordani te ne sarebbe grato a lungo."
        quando: [pista.pelle >= 7, consiglio.voti >= 5]
        esito:
          titolo: Il secondo voto della Gilda
          testo: |
            Tullio scrive *respinta* accanto alla richiesta di Urtilia, e Julia
            propone il seggio dei Malgrani alla Gilda, perché glielo hai chiesto
            tu e lei firma quello che dici. Per il resto della seduta Cordani
            muove le mani più del solito, mentre in tribuna i mugnai si rimettono
            il cappello senza dire niente. Julia ti dice di passare da lei
            domattina all'alba.
          pe: { politica-ed-economia: 6 }
          imposta: { consiglio.esito: 1, seggio.malgrani: 2 }
          effetti: { fazione.consiglio: 1, rep.gilda: 1 }
      - testo: "Il seggio dei Malgrani all'erede, in cambio del debito"
        descrizione: "Il primogenito di Ottone siederà sotto la tutela di Urtilia, e i Castaldi saranno liberi."
        quando: [pista.pelle >= 7, consiglio.voti >= 5]
        esito:
          titolo: I Castaldi liberi
          testo: |
            Tullio scrive *respinta* accanto alla richiesta di Urtilia, e subito
            dopo, su tua proposta, la sala vota la stessa richiesta come proposta
            della Rappresentante. Ronchi tira fuori dalla cartella le obbligazioni
            dei Castaldi e le straccia davanti alla tribuna, una per una, con le
            mani guantate. Julia guarda i pezzi di carta sul pavimento e ti dice
            soltanto di passare da lei domattina all'alba.
          pe: { politica-ed-economia: 6 }
          imposta: { consiglio.esito: 1, seggio.malgrani: 3, consiglio.debito: 2 }
          effetti: { fazione.consiglio: 1, rep.malgrani: 2 }
      - testo: "Il seggio dei Malgrani lo decide Ronchi"
        descrizione: "La richiesta di Urtilia passa."
        quando: [pista.pelle >= 7, consiglio.voti < 5]
        esito:
          titolo: Approvata
          testo: |
            Tullio scrive *approvata* sul registro, con una grafia più piccola del
            solito. Il seggio dei Malgrani va al primogenito di Ottone sotto la
            tutela di Urtilia Mendion, e finché il ragazzo non avrà l'età lo
            siederà il suo procuratore. Ronchi gira intorno alla sedia e si siede,
            per la prima volta. Le obbligazioni dei Castaldi restano nella
            cartella, e Julia ti dice di passare da lei domattina all'alba.
          imposta: { consiglio.esito: 2, seggio.malgrani: 3 }
          effetti: { fazione.consiglio: 1 }

  # ------------------------------------------------------------ passo 15 · la spilla
  - id: consiglio-la-spilla
    presso: municipio
    immagine: personaggi/julia-castaldi
    titolo: La spilla
    sommario: "All'alba dopo la seduta Julia ti aspetta in ufficio, con la spilla del Consiglio sulla scrivania."
    luogo: Municipio, l'ufficio della Rappresentante, all'alba
    area: quartieri-alti
    requisiti: [fazione.consiglio == 14, consiglio.esito != 2, consiglio.carte != 3, pista.acciaio >= 8, pista.pelle != 4, pista.pelle != 5, pista.pelle != 6]
    testo: |
      All'alba il Municipio è vuoto, e la panca dell'anticamera ha ancora la
      forma di chi ci si è seduto ieri. Julia è nel suo ufficio con la stessa
      toga della seduta, e non ha dormito. Sulla scrivania, fra le pratiche
      impilate con gli angoli pari, c'è la spilla del Consiglio, sette anelli
      d'argento intrecciati, che in tutti questi mesi non le hai mai visto
      togliere.

      «Il Consiglio ha votato una cosa, ieri sera, dopo che sei uscito» dice.
      «Alle sedute, da oggi, siede anche una voce senza seggio, che parla a
      verbale anche se non vota.» Spinge la spilla verso di te con un dito.
      «La voce sei tu, se vuoi.»

      {empatia Media} Ha vinto, o almeno ha evitato di perdere, eppure non
      sorride. Sta facendo i conti di quello che le è costato, e la spilla è
      una delle voci del conto.

      Dalla porta socchiusa Tullio fa finta di non ascoltare, con una tazza
      di tè in mano, per lei.
    opzioni:
      - testo: "Accettare"
        descrizione: "Un posto alle sedute accanto a lei, senza seggio, con il tuo parere a verbale."
        esito:
          titolo: A verbale
          testo: |
            Prendi la spilla, che pesa meno di quanto pensavi, e Julia annuisce
            una volta sola, come per la data di una seduta. Poi apre il cassetto
            della scrivania, quello che chiude sempre a chiave.
          segue: consiglio-il-dispositivo
      - testo: "Accettare a una condizione"
        descrizione: "Che nel seminterrato non ci sia più una cassa dove finiscono le petizioni scritte male."
        esito:
          titolo: La condizione
          testo: |
            Le dici che la prendi se nel seminterrato del Municipio non esisterà
            più una cassa dei respinti, nemmeno tenuta in ordine per anno. Julia
            guarda la porta socchiusa, dietro cui Tullio ha smesso di far finta.
            «Mettilo a verbale alla prima seduta, così lo firmo davanti a tutti»
            dice, e apre il cassetto della scrivania, quello che chiude sempre a
            chiave.
          imposta: { consiglio.condizione: 1 }
          segue: consiglio-il-dispositivo

  - id: consiglio-la-spilla-amara
    presso: municipio
    immagine: personaggi/julia-castaldi
    titolo: La spilla
    sommario: "All'alba dopo la seduta persa Julia ti aspetta in ufficio, con la spilla del Consiglio sulla scrivania."
    luogo: Municipio, l'ufficio della Rappresentante, all'alba
    area: quartieri-alti
    requisiti: [fazione.consiglio == 14, consiglio.esito == 2, consiglio.carte != 3, pista.acciaio >= 8, pista.pelle != 4, pista.pelle != 5, pista.pelle != 6]
    testo: |
      All'alba il Municipio è vuoto. Julia è nel suo ufficio con le finestre
      chiuse e la stessa toga della seduta, e sulla scrivania non ci sono
      pratiche, soltanto il registro del Consiglio aperto alla pagina di ieri
      e accanto la spilla d'argento a sette anelli intrecciati che in tutti
      questi mesi non le hai mai visto togliere.

      «Ho ancora il seggio e non ho più la maggioranza» dice, prima che tu ti
      sieda. «Per un po' le pratiche le presenteranno gli altri. Ieri sera,
      dopo che sei uscito, il Consiglio ha votato una cosa che nessuno ha
      avuto il coraggio di bocciare, una voce senza seggio alle sedute, che
      parla a verbale senza votare.» Spinge la spilla verso di te con un dito.
      «Mi serve qualcuno che parli quando io non posso più. La voce sei tu, se
      vuoi.»

      {empatia Media} La seduta non te la rimprovera adesso e non te la
      rimprovererà mai. Ha già deciso che la colpa è sua, perché la firma era
      sua.

      Dalla porta socchiusa Tullio fa finta di non ascoltare, con una tazza di
      tè in mano, per lei.
    opzioni:
      - testo: "Accettare"
        descrizione: "Un posto alle sedute accanto a lei, senza seggio, adesso che le serve più di prima."
        esito:
          titolo: A verbale
          testo: |
            Prendi la spilla e la tieni nel palmo, e pesa meno di quanto
            pensavi. Julia annuisce una volta sola. Poi apre il cassetto della
            scrivania, quello che chiude sempre a chiave.
          segue: consiglio-il-dispositivo
      - testo: "Accettare a una condizione"
        descrizione: "Che nel seminterrato non ci sia più la cassa dei respinti, cosa che può fare anche senza maggioranza."
        esito:
          titolo: La condizione
          testo: |
            Le dici che la prendi se nel seminterrato del Municipio non esisterà
            più una cassa dei respinti. Julia ti guarda a lungo, e per la prima
            volta da quando sei entrato le si scioglie qualcosa intorno alla
            bocca. «Per questa la maggioranza non serve» dice, «basta Tullio, e
            una scala.» Poi apre il cassetto della scrivania, quello che chiude
            sempre a chiave.
          imposta: { consiglio.condizione: 1 }
          segue: consiglio-il-dispositivo

  - id: consiglio-il-dispositivo
    immagine: ambientazione/biblioteca-di-qir-azel
    titolo: Il dispositivo
    tipo: seguito
    luogo: Municipio, l'ufficio della Rappresentante
    area: quartieri-alti
    requisiti: [fazione.consiglio == 14]
    testo: |
      Dal cassetto Julia tira fuori un disco di metallo scuro, con un
      cristallo opaco al centro e il sigillo della Biblioteca inciso sul
      rovescio, e lo posa accanto alla spilla.

      La Biblioteca ne dà pochi e uno spetta alla Rappresentante, per entrare
      fra gli scaffali sigillati senza che le campanelle di Ulric suonino. «Io
      non l'ho mai usato. Una notte è uscito da questo cassetto ed è tornato,
      lo so perché la serratura la ungo io e la mattina dopo l'olio era sul
      pavimento. Era la notte in cui dagli scaffali della costa nord sono
      spariti i volumi che nessuno ha mai preso in prestito» dice, girando il
      disco con un dito.

      Accanto al sigillo qualcuno ha inciso un occhio chiuso che prima non
      c'era.

      {tecnologia Media} Il cristallo è più opaco sul lato che tocca il palmo,
      e l'ha tenuto in mano a lungo qualcuno che non è Julia.

      Chi sospetta, Julia lo tiene per sé. Rimette il disco nel cassetto, lo
      chiude a chiave e tira fuori dall'armadio, avvolta in un panno, la mazza
      di ferro che Tullio raddrizza sul tavolo all'inizio di ogni seduta. Ieri
      sera, dice, hanno votato anche questa, e la voce del Consiglio la porta
      in sala e la porta via quando la seduta è finita.
    opzioni:
      - testo: "Prendere la mazza e la spilla"
        descrizione: "La mazza del Patto, la spilla di Julia, e una borsa del Consiglio."
        immagine: icone/flanged-mace
        quando: [pista.pelle < 4]
        esito:
          titolo: Voce del Consiglio
          testo: |
            Il manico della mazza è consumato dalle mani di chi l'ha portata prima
            di te. Julia ti appunta la spilla sul bavero e dalla cassetta di ferro
            ti dà una borsa pesante con il sigillo del Consiglio. «Le casse le ho
            fatte riempire per le licenze» dice, «e le licenze, per ora,
            aspettano.» Quando esci, Tullio ti saluta dal bancone inforcando gli
            occhiali.
          pe: { politica-ed-economia: 5 }
          almeno: { rep.castaldi: 10 }
          effetti: { fazione.consiglio: 1, monete: 400, crepuscolo.indizi: 1, oggetto.consiglio-mazza-del-patto: 1, oggetto.consiglio-spilla-del-consiglio: 1 }
      - testo: "Prendere la mazza e la spilla"
        descrizione: "La mazza del Patto, la spilla di Julia, e quello che le casse vuote del Comune possono dare."
        immagine: icone/flanged-mace
        quando: [pista.pelle >= 7]
        esito:
          titolo: Voce del Consiglio
          testo: |
            Il manico della mazza è consumato dalle mani di chi l'ha portata prima
            di te. Julia ti appunta la spilla sul bavero e dalla cassetta di ferro
