# I servizi ripetibili della quest del Consiglio, aperti dai gradi (fazione.consiglio).
# - grado I (passo 3) `consiglio-petizioni-sulla-panca`: l'angolo del bancone di Tullio. Si scrivono le petizioni di
#   chi non sa scrivere, per qualche moneta, una voce o un po' di nomea in Città Bassa (fino a 2).
# - grado II (passo 6) `consiglio-una-multa-in-meno`: con la lettera col sigillo Tullio archivia una segnalazione
#   (Sospetto −1) o una lamentela (Scandalo −1), a pagamento.
# - grado III (passo 9) `consiglio-il-cortile-di-quintus`: all'alba con la scorta di Quintus Vael. PE in Armi da
#   mischia, Intimidire o Resistenza (Quintus non fa da maestro oltre il 2: si sale con la pratica).
# - grado IV (passo 12) `consiglio-la-stanza-degli-ospiti`: l'alloggio gratuito al Maniero Castaldi (Ferite −1,
#   Tormento −½), oppure la cena di famiglia.
# - grado V (passo 15) `consiglio-le-sedute-del-consiglio`: la voce senza seggio a verbale, pagata bene. Con
#   consiglio.condizione 1 si controlla che la cassa dei respinti resti vuota.
storylet:
  # ------------------------------------------------------------ grado I · le petizioni sulla panca
  - id: consiglio-petizioni-sulla-panca
    presso: municipio
    immagine: icone/quill-ink
    titolo: Le petizioni della panca
    sommario: "Nel tuo angolo del bancone c'è un calamaio, e sulla panca qualcuno con un foglio piegato in quattro."
    luogo: Municipio, l'angolo del bancone
    area: quartieri-alti
    ripetibile: true
    requisiti: [fazione.consiglio >= 3]
    testo: |
      Il tuo angolo del bancone sta sotto la finestra, con il calamaio che
      Tullio ha spostato di un dito verso il centro. Sulla panca oggi aspetta
      una donna con un fazzoletto in testa e un bambino addormentato sulla
      spalla, e tiene in mano un foglio piegato e ripiegato tante volte che
      non sa più da che parte si apre.
    opzioni:
      - testo: "Scrivere la petizione in bella"
        descrizione: "Margini dritti e lo spazio per il sigillo, perché salga nel cesto e non scenda nella cassa."
        prova: { attributo: mentale, abilita: [accademiche, politica-ed-economia], difficolta: Media }
        successo:
          titolo: Nel cesto
          testo: |
            Ti fai raccontare la richiesta due volte e la scrivi in una pagina
            sola, e quando sale nel cesto la donna ti lascia qualche moneta
            avvolta nel fazzoletto.
          pe: { accademiche: 3 }
          effetti: { monete: 4 }
        fallimento:
          titolo: La strada sbagliata
          testo: |
            Dimentichi la strada, e Tullio te lo fa notare con un dito sulla riga
            prima che salga nel cesto. La riscrivi da capo mentre il bambino si
            sveglia, e ci perdi la mattina.
          effetti: { monete: 1 }

      - testo: "Ascoltare quello che non è scritto"
        descrizione: "Chi chiede una cosa al Comune spesso ne ha in mente un'altra."
        prova: { attributo: sociale, abilita: [empatia, conoscenze-della-strada], difficolta: Media }
        successo:
          titolo: L'altra richiesta
          testo: |
            Lasci la penna e la fai parlare, e in mezzo al tetto da riparare viene
            fuori il padrone di casa che alza l'affitto a ogni lavoro del Comune.
            Il suo nome lo tieni per te.
          pe: { empatia: 3 }
          effetti: { monete: 2, informazioni.voce: 1 }
        fallimento:
          titolo: Troppe domande
          testo: |
            Le fai una domanda di troppo e la donna si chiude come una porta, ti
            detta la petizione parola per parola e se ne va appena sale nel cesto.

      - testo: "Scrivere gratis per chi non ha niente"
        descrizione: "Una moneta di meno per te, e una petizione in più nel cesto. In Città Bassa queste cose si raccontano."
        quando: [nomea.citta-bassa < 2]
        esito:
          titolo: Il fazzoletto
          testo: |
            Le restituisci il fazzoletto con le monete dentro, e la settimana dopo
            sulla panca ci sono tre persone del suo vicolo che chiedono di te per
            nome.
          pe: { empatia: 2 }
          effetti: { nomea.citta-bassa: 0.5 }

  # ------------------------------------------------------------ grado II · una multa in meno
  - id: consiglio-una-multa-in-meno
    presso: municipio
    immagine: icone/wax-seal
    titolo: Una multa in meno
    sommario: "Con la lettera col sigillo, qualche segnalazione della Guardia o lamentela delle casate finisce in archivio."
    luogo: Municipio, il bancone di Tullio
    area: quartieri-alti
    ripetibile: true
    requisiti: [fazione.consiglio >= 6, chiave.sigillo-del-consiglio >= 1]
    testo: |
      Il venerdì Tullio smista le segnalazioni della Guardia e le lamentele
      delle casate, e quando vede spuntare la lettera col sigillo dalla tua
      giubba si toglie gli occhiali. «Le carte si archiviano, se c'è una
      ragione e se c'è chi paga la carta da bollo» dice, e indica una
      cassetta di latta con una fessura nel coperchio.

      {politica-ed-economia Media} Un'archiviazione con il sigillo del
      Consiglio mette la carta in una cassa dove nessuno la cerca, che in
      questa città vale quanto cancellarla.
    opzioni:
      - testo: "Far archiviare una segnalazione della Guardia"
        descrizione: "Una segnalazione con il tuo nome finisce in archivio, in ordine per anno."
        requisiti: [sospetto >= 1, monete >= 12]
        esito:
          titolo: In archivio
          testo: |
            Infili le monete nella fessura, e Tullio scrive *archiviata* su una
            carta della Guardia e la mette nella cartella per il seminterrato,
            dove l'umido farà il resto.
          effetti: { monete: -12, sospetto: -1 }
      - testo: "Far archiviare una lamentela delle casate"
        descrizione: "Una lamentela dei Quartieri Alti contro di te finisce sotto la polvere."
        requisiti: [scandalo >= 1, monete >= 12]
        esito:
          titolo: Sotto le altre
          testo: |
            Infili le monete nella fessura, e Tullio infila una lettera su carta
            profumata in fondo alle lamentele vecchie, che non legge più nessuno.
          effetti: { monete: -12, scandalo: -1 }
      - testo: "Lasciare i mucchi come sono"
        descrizione: "Per oggi le carte possono restare dove sono."
        costo: 0
        esito:
          titolo: I tre mucchi
          testo: |
            Ringrazi Tullio e lasci i mucchi dove sono, e lui riprende a smistare
            muovendo appena le labbra.

  # ------------------------------------------------------------ grado III · il cortile di Quintus
  - id: consiglio-il-cortile-di-quintus
    immagine: personaggi/quintus-vael
    titolo: Il cortile di Quintus
    sommario: "All'alba la scorta di Quintus si allena sotto il fico del Maniero, e chi parla per Julia è benvenuto."
    luogo: Maniero Castaldi, il cortile, all'alba
    area: quartieri-alti
    ripetibile: true
    requisiti: [fazione.consiglio >= 9]
    testo: |
      All'alba, sotto il fico del Maniero, i cinque uomini della scorta di
      Quintus Vael si scaldano le mani. Quintus non urla mai, e quando
      qualcuno sbaglia gli si mette accanto finché quello non se ne accorge
      da solo.

      {armi-da-mischia Media} Le spade di legno hanno il piombo nel pomo e
      pesano più di quelle vere, perché Quintus vuole che la scorta si
      stanchi qui, prima delle scale del Municipio.
    opzioni:
      - testo: "Fare le parate con la scorta"
        descrizione: "Spade di legno con il piombo nel pomo, e Quintus che ti guarda le spalle."
        prova: { attributo: fisico, abilita: [armi-da-mischia, rissa], difficolta: Media }
        successo:
          titolo: Le spalle
          testo: |
            A metà mattina Quintus ti abbassa la spalla destra di un dito, e il
            colpo successivo ti costa la metà della fatica.
          pe: { armi-da-mischia: 5 }
        fallimento:
          titolo: Il piombo nel pomo
          testo: |
            Al terzo scambio la spada di legno ti arriva sulle nocche, e Quintus
            ti manda a mettere la mano nel secchio prima di farti riprendere con
            l'altra.
          pe: { armi-da-mischia: 2 }
          effetti: { ferite: 0.5 }
      - testo: "Stare di guardia con lo sguardo di Quintus"
        descrizione: "Quintus insegna a fermare un uomo prima che si avvicini, con lo sguardo, alla porta del cortile."
        prova: { attributo: sociale, abilita: intimidire, difficolta: Media }
        successo:
          titolo: La porta del cortile
          testo: |
            Stai alla porta del cortile con le braccia lungo i fianchi, e un
            garzone con una cesta ti guarda in faccia e cambia marciapiede. Dietro
            di te Quintus fa un mezzo verso che con lui vale un applauso.
          pe: { intimidire: 5 }
        fallimento:
          titolo: Il garzone
          testo: |
            Guardi chi passa con tutta la severità che hai, e un garzone si ferma
            a chiederti se hai bisogno di qualcosa. Quintus ti dice che lo sguardo
            funziona meglio con le spalle ferme.
          pe: { intimidire: 2 }
      - testo: "Correre il giro delle terrazze con la scorta"
        descrizione: "Le scale dal Maniero alla Cattedrale e ritorno, prima che la città si svegli."
        prova: { attributo: fisico, abilita: [resistenza, atletica], difficolta: Media }
        successo:
          titolo: Il giro delle terrazze
          testo: |
            Corri con la scorta su per le terrazze fino alla Cattedrale e giù fino
            al Municipio, e al ritorno hai le gambe di legno come tre uomini su
            cinque.
          pe: { resistenza: 5 }
        fallimento:
          titolo: Il sagrato
          testo: |
            Sul sagrato della Cattedrale ti fermi con le mani sulle ginocchia, e
            al Maniero Quintus ti aspetta con un mestolo d'acqua e nessun
            commento.
          pe: { resistenza: 2 }
          effetti: { ferite: 0.5 }

  # ------------------------------------------------------------ grado IV · la stanza degli ospiti
  - id: consiglio-la-stanza-degli-ospiti
    immagine: fazioni/famiglia-castaldi
    titolo: La stanza degli ospiti
    sommario: "Al secondo piano del Maniero Castaldi Marella tiene pronta una stanza per il Cancelliere."
    luogo: Maniero Castaldi, la stanza degli ospiti
    area: quartieri-alti
    ripetibile: true
    requisiti: [fazione.consiglio >= 12]
    testo: |
      La stanza degli ospiti ha le finestre sulle terrazze e un letto con le
      lenzuola che sanno di lavanda. Dalla sala da pranzo salgono le voci
      della cena di famiglia, e ogni tanto la risata di Mira, che i precettori
      non sono ancora riusciti a rendere educata.

      {resistenza Facile} Il materasso di lana è stato rifatto da poco, e il
      corpo lo capisce prima di te.
    opzioni:
      - testo: "Dormire nella stanza degli ospiti"
        descrizione: "Un letto vero per una notte, con la colazione portata in camera."
        esito:
          titolo: Una notte al Maniero
          testo: |
            Dormi senza sognare, e la mattina un valletto ti lascia sulla soglia
            pane caldo e miele con un biglietto di Marella, che ti augura una
            buona giornata in Municipio.
          effetti: { ferite: -1, tormento: -0.5 }
      - testo: "Scendere a cena con la famiglia"
        descrizione: "Alla tavola dei Castaldi si parla di Stato, e si sente parecchio."
        esito:
          titolo: Di Stato
          testo: |
            Marella ti fa sedere fra Vesper e Mira, che ti chiedono se è vero che
            hai visto la Marea, e fra un discorso di Stato e l'altro senti tre
            cose sulla Gilda che domani sapranno in pochi.
          pe: { galateo: 2 }
          effetti: { informazioni.pettegolezzo: 1, tormento: -0.5 }

  # ------------------------------------------------------------ grado V · le sedute del Consiglio
  - id: consiglio-le-sedute-del-consiglio
    presso: municipio
    immagine: fazioni/consiglio-di-qir-azel
    titolo: Le sedute del Consiglio
    sommario: "Il giovedì c'è seduta, e accanto al seggio della Rappresentante ti aspetta il tuo sgabello."
    luogo: Municipio, la sala consiliare
    area: quartieri-alti
    ripetibile: true
    requisiti: [fazione.consiglio >= 15]
    testo: |
      Il giovedì porti la mazza del Patto in sala, e Tullio la raddrizza
      quando la seduta comincia. Dallo sgabello accanto al seggio della
      Rappresentante vedi la tribuna, dove ormai qualcuno ti saluta per nome,
      mentre al tavolo passano le pratiche di sempre e una mozione della
      Gilda ogni due settimane.

      {politica-ed-economia Media} Una voce a verbale resta scritta anche
      senza voto, e fra un anno qualcuno dovrà spiegare perché non l'ha
      ascoltata.
    opzioni:
      - testo: "Parlare a verbale su una pratica"
        descrizione: "Una pratica rinviata da mesi, e la sala che deve sentire perché non si può rinviare ancora."
        prova: { attributo: sociale, abilita: [persuasione, galateo], difficolta: Media }
        successo:
          titolo: A verbale
          testo: |
            Parli dallo sgabello per il tempo che serve, e la pratica passa con un
            voto di scarto. Tullio scrive il tuo nome sul verbale accanto ad
            *approvata*, e Julia ti paga dalla cassetta di ferro.
          pe: { persuasione: 3 }
          effetti: { monete: 15 }
        fallimento:
          titolo: Rinviata
          testo: |
            Parli troppo a lungo e la sala comincia a guardare le finestre, finché
            la pratica viene rinviata di un mese. Julia ti paga lo stesso, perché
            la seduta l'hai fatta.
          effetti: { monete: 6, scandalo: 1 }
      - testo: "Leggere le pratiche prima di Julia"
        descrizione: "Le pratiche della seduta, lette per primo, con tre righe in fondo su chi ci guadagna."
        prova: { attributo: mentale, abilita: [politica-ed-economia, accademiche], difficolta: Media }
        successo:
          titolo: Chi ci guadagna
          testo: |
            In fondo a una pratica trovi un nome che non dovrebbe esserci, e Julia
            lo sottolinea due volte e ti chiede di tenerlo per te, perfino con
            Tullio, prima di pagarti.
          pe: { politica-ed-economia: 3 }
          effetti: { monete: 15, informazioni.voce: 1 }
        fallimento:
          titolo: Le righe in fondo
          testo: |
            La mattina ti accorgi di aver scritto le righe di una pratica in fondo
            a un'altra, e Julia le rimette in ordine senza dirti niente e ti paga
            lo stesso.
          effetti: { monete: 6 }
      - testo: "Scendere a controllare la stanza delle casse"
        descrizione: "In seminterrato c'era una cassa dei respinti, e la tua condizione era che sparisse."
        quando: [consiglio.condizione >= 1]
        costo: 0
        esito:
          titolo: La stanza vuota
          testo: |
            Nella stanza bassa in fondo al seminterrato le casse non ci sono più.
            Al loro posto Tullio ha messo un tavolo e un registro aperto, dove
            ogni petizione con le croci al posto delle firme ha una riga e un
            esito.
          pe: { empatia: 3 }
