# Quest del Consiglio, terzo atto (fazione.consiglio 10 → 15). Chiede pista.acciaio >= 8 (Ondrel è morto e la
# sedia dei Tarvelin è vuota) e resta chiuso con pista.pelle fra 4 e 6, come l'Arena: gli ingressi dei passi hanno
# i requisiti pista.pelle != 4, != 5, != 6, oppure due versioni, prima (pista.pelle < 4) e dopo (pista.pelle >= 7)
# la caduta di Ottone.
# - passo 11: `consiglio-le-sedie-vuote` (prima: Ottone vuole la sedia dei Tarvelin per la Gilda finché l'erede non
#   si presenta) e `consiglio-le-sedie-vuote-dopo` (dopo: Tebaldo Ronchi chiede la sedia dei Malgrani per il
#   primogenito sotto la tutela di Urtilia e offre il debito in cambio). Tutti e due portano all'archivio che
#   allaga (`consiglio-l-archivio-che-allaga`) e alle pagine incollate del registro del Patto
#   (`consiglio-le-pagine-incollate`). Con la lettera col sigillo (chiave.sigillo-del-consiglio) la Casa dei Nodi
#   presta la sua copia, e la prova è Facile. La clausola: il seggio di una casa firmataria va a chi la casa nomina
#   sulla soglia del proprio maniero.
# - passo 12 `consiglio-il-giardino-di-maerith` (Grifone di Ferro): Liaren non vuole il seggio né il Maniero.
#   consiglio.tarvelin: 1 siede lei (Empatia Difficile, Media con rep.tarvelin >= 2; il Figlio del Circolo legge il
#   giardino), 2 nomina un altro (Irsa con acciaieria.futuro 3, Abele Torsi con 2), 3 nessuno e il seggio va al voto.
#   Le prove fallite lasciano la scena aperta. 1 e 2 portano a `consiglio-la-soglia-del-maniero`; ogni ramo dà il
#   grado IV (Cancelliere): l'anello delle bilance e la stanza degli ospiti (servizi.yaml).
# - passo 13 `consiglio-la-notte-prima-della-seduta`: l'ingresso nella spedizione spedizione-maniero.yaml (imposta
#   consiglio.notte 1 e consiglio.gazza 0). La pista sale al cuore.
# - passo 14 (passi-3b.yaml): la vigilia, la seduta, lo spoglio. passo 15 (passi-3b.yaml): la spilla.
storylet:
  # ------------------------------------------------------------ passo 11 · le sedie vuote
  - id: consiglio-le-sedie-vuote
    presso: municipio
    immagine: fazioni/consiglio-di-qir-azel
    titolo: Le sedie vuote
    sommario: "Sulla sedia dei Tarvelin c'è un nastro nero da quando Ondrel è morto, e Ottone vuole riempirla."
    luogo: Municipio, l'ufficio della Rappresentante
    area: quartieri-alti
    requisiti: [fazione.consiglio == 10, pista.acciaio >= 8, pista.pelle < 4]
    testo: |
      Sulla sedia dei Tarvelin, in sala consiliare, c'è un nastro nero legato
      allo schienale, e da quando Ondrel è morto nessuno ci si siede. Julia ti
      riceve a porta chiusa con una pratica nuova del segretario di Ottone
      Malgrani, in cui la Gilda propone di tenere la sedia finché l'erede non
      si presenta, e di votare al posto suo nel frattempo.

      {politica-ed-economia Media} Con la sedia dei Tarvelin la Gilda avrebbe
      due voti al tavolo, e le licenze sul grano tornerebbero in fondo alla
      pila per altri cinque anni.

      «L'erede è Liaren, e Liaren fa la locandiera sui Ponti» dice Julia, «e
      Ottone conta sul fatto che lei non salga mai le scale del Municipio.»
      Prima di rispondergli vuole sapere che cosa dice il Patto delle Corde
      sui seggi rimasti senza capo, e la copia del Comune sta nell'archivio
      sotto il Municipio, che allaga ogni primavera.
    opzioni:
      - testo: "Scendere in archivio con Tullio"
        descrizione: "L'archivio sta oltre la grata della banca cittadina, e Tullio ha la chiave e una lanterna."
        esito:
          titolo: Oltre la grata
          testo: |
            Tullio prende la lanterna e le chiavi, e scendete oltre la grata della
            banca fino a una porta bassa con i cardini verdi di ruggine.
          segue: consiglio-l-archivio-che-allaga

  - id: consiglio-le-sedie-vuote-dopo
    presso: municipio
    immagine: fazioni/consiglio-di-qir-azel
    titolo: Le sedie vuote
    sommario: "In sala consiliare sono vuote le sedie dei Tarvelin e dei Malgrani, e un procuratore vuole riempirne una."
    luogo: Municipio, l'ufficio della Rappresentante
    area: quartieri-alti
    requisiti: [fazione.consiglio == 10, pista.acciaio >= 8, pista.pelle >= 7]
    testo: |
      In sala consiliare due sedie sono vuote, quella dei Tarvelin con un
      nastro nero allo schienale e quella dei Malgrani, spinta contro il muro
      il giorno della condanna di Ottone. Julia ti riceve a porta chiusa con
      una lettera firmata da Tebaldo Ronchi, in cui Urtilia Mendion chiede che
      il seggio dei Malgrani passi al primogenito di Ottone, sotto la sua
      tutela, e in cambio offre di cancellare le obbligazioni di grano dei
      Castaldi.

      {politica-ed-economia Media} Se Julia accetta l'ha comprata Ghoran, e se
      rifiuta ha preferito i suoi debiti alla città.

      «Ronchi vuole una risposta in seduta, davanti a tutti» dice Julia, «e io
      prima voglio sapere che cosa dice il Patto delle Corde sui seggi rimasti
      senza capo. La copia del Comune sta nell'archivio sotto il Municipio,
      che allaga ogni primavera.»
    opzioni:
      - testo: "Scendere in archivio con Tullio"
        descrizione: "L'archivio sta oltre la grata della banca cittadina, e Tullio ha la chiave e una lanterna."
        esito:
          titolo: Oltre la grata
          testo: |
            Tullio prende la lanterna e le chiavi, e scendete oltre la grata della
            banca fino a una porta bassa con i cardini verdi di ruggine.
          segue: consiglio-l-archivio-che-allaga

  - id: consiglio-l-archivio-che-allaga
    immagine: ambientazione/biblioteca-di-qir-azel
    titolo: L'archivio che allaga
    tipo: seguito
    luogo: Municipio, l'archivio
    area: quartieri-alti
    requisiti: [fazione.consiglio == 10]
    testo: |
      L'archivio del Municipio è una sala lunga a volta, due gradini sotto il
      corridoio, con la riga scura dell'ultima piena all'altezza di una
      caviglia. Le casse stanno su assi appoggiate a mattoni, in file che si
      perdono oltre la luce della lanterna, e sulle più lontane il gesso che
      diceva l'anno si è sciolto.

      Tullio appende la lanterna a un gancio e si guarda intorno con le mani
      sui fianchi. Il Patto delle Corde, dice, il Comune l'ha ricopiato in un
      registro rilegato in pelle, in una cassa degli anni della fondazione, ma
      quali siano quelle casse non lo sa più nessuno.

      {accademiche Media} I registri della fondazione hanno le borchie di
      ottone agli angoli, perché allora il Comune voleva sembrare una banca.
      Basta cercare il verde dell'ottone sotto la polvere.
    opzioni:
      - testo: "Cercare il registro fra le casse"
        descrizione: "Due giorni di casse aperte e richiuse nell'umido, e chi sa che cosa cercare ne apre la metà."
        prova: { attributo: mentale, abilita: [accademiche, percezione], difficolta: Media }
        successo:
          titolo: Le borchie di ottone
          testo: |
            Al secondo giorno trovi gli angoli verdi sotto la polvere, in una
            cassa senza gesso dietro i registri del catasto. Il registro del Patto
            è rilegato in pelle scura, con le pagine di mezzo incollate dall'umido
            in un blocco solo, e Tullio lo prende con due mani, come un neonato.
          pe: { accademiche: 5 }
          segue: consiglio-le-pagine-incollate
        fallimento:
          titolo: Il catasto
          testo: |
            Apri casse per due giorni, fra i registri del catasto e tre anni di
            petizioni respinte, e il registro del Patto salta fuori al terzo
            giorno, quando hai già la febbre dell'umido. Le pagine di mezzo si
            sono incollate in un blocco solo.
          effetti: { ferite: 0.5 }
          segue: consiglio-le-pagine-incollate

      - testo: "Restare giù finché non salta fuori"
        descrizione: "Aprendole tutte si trova anche senza sapere dove cercare, purché si regga all'umido."
        costo: 2
        prova: { attributo: fisico, abilita: resistenza, difficolta: Facile }
        successo:
          titolo: Tutte le casse
          testo: |
            Apri le casse una dopo l'altra e le richiudi con ordine perché Tullio
            ti guarda, e verso sera del secondo giorno trovi il registro del
            Patto, rilegato in pelle scura, con le pagine di mezzo attaccate in un
            blocco solo.
          pe: { resistenza: 5 }
          segue: consiglio-le-pagine-incollate
        fallimento:
          titolo: La febbre dell'umido
          testo: |
            Il terzo giorno tossisci a ogni cassa che apri, e il registro lo trova
            Tullio mentre tu sei piegato in due su un gradino. Le pagine di mezzo
            sono incollate in un blocco solo.
          effetti: { ferite: 1 }
          segue: consiglio-le-pagine-incollate

      - testo: "Chiedere la copia della Casa dei Nodi"
        descrizione: "Alla Casa dei Nodi c'è una copia asciutta che ti devono mostrare, e Cordani lo saprà prima di sera."
        immagine: icone/wax-seal
        requisiti: [chiave.sigillo-del-consiglio >= 1]
        prova: { attributo: mentale, abilita: accademiche, difficolta: Facile }
        successo:
          titolo: La copia della Gilda
          testo: |
            Il custode della Casa dei Nodi legge la lettera e ti mette davanti la
            copia asciutta della Gilda. Alla terza pagina la clausola dice che il
            seggio di una casa firmataria va a chi la casa nomina sulla soglia del
            proprio maniero, ad alta voce, davanti a un testimone del Consiglio.
            Prima di sera Cordani manda in Municipio un biglietto di
            congratulazioni per lo zelo dei suoi incaricati.
          pe: { accademiche: 5 }
          effetti: { fazione.consiglio: 1, rep.castaldi: 0.5, informazioni.segreto: 1 }
        fallimento:
          titolo: Il leggio vuoto
          testo: |
            Il custode dei registri torna con la notizia che la copia della Gilda
            è in rilegatura, e lo sarà per un mese, e te lo dice guardandoti negli
            occhi. In Municipio Tullio ha già preso la lanterna, e il registro del
            Comune lo trovate in archivio in due giorni, con le pagine di mezzo
            incollate in un blocco solo.
          segue: consiglio-le-pagine-incollate
          effetti: { tormento: 0.5 }

  - id: consiglio-le-pagine-incollate
    immagine: ambientazione/biblioteca-di-qir-azel
    titolo: Le pagine incollate
    tipo: seguito
    luogo: Municipio, il bancone di Tullio
    area: quartieri-alti
    requisiti: [fazione.consiglio == 10]
    testo: |
      Il registro del Patto sta sul bancone di Tullio, sopra un panno pulito
      che le borchie di ottone macchiano di verde. Le prime pagine con le
      firme delle casate si leggono, mentre quelle sui seggi si sono
      incollate in un blocco spesso un dito, con i bordi scuri e duri come un
      biscotto.

      {tecnologia Media} La colla di un tempo cede al vapore, e una lama
      sottile scaldata sopra la lanterna passa fra i fogli senza strapparli,
      se si va piano.

      Tullio si toglie gli occhiali e li pulisce due volte, poi va a prendere
      il bricco del tè dalla stufa dell'anticamera e lo posa sul bancone
      accanto al registro senza dire niente. Fra il terzo e il quarto foglio
      del blocco c'è un filo di luce, dove la colla ha ceduto da sola.
    opzioni:
      - testo: "Staccare le pagine con una lama scaldata"
        descrizione: "Un coltello sottile scaldato sulla lanterna, un foglio alla volta, cominciando dal filo di luce."
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Media }
        successo:
          titolo: La soglia del maniero
          testo: |
            Passi la lama scaldata fra i fogli finché la colla cede. Alla quinta
            pagina la clausola dice che il seggio di una casa firmataria va a chi
            la casa nomina sulla soglia del proprio maniero, ad alta voce, davanti
            a un testimone del Consiglio. «Per questo la città aspetta che l'erede
            dei Tarvelin torni a casa» dice Julia da sopra la tua spalla, «e lo
            sapevano tutti senza sapere perché.»
          pe: { tecnologia: 5 }
          effetti: { fazione.consiglio: 1, rep.castaldi: 0.5, informazioni.segreto: 1 }
        fallimento:
          titolo: La pagina strappata
          testo: |
            Alla quarta pagina la lama si raffredda e il foglio si strappa a metà.
            Sulla metà che ti resta c'è l'inizio della clausola, il seggio di una
            casa firmataria va a chi la casa nomina sulla soglia del proprio
            maniero, e poi lo strappo. Julia dice che basta così, e Tullio mette
            l'altra metà in una busta e per tutto il giorno non ti guarda.
          effetti: { fazione.consiglio: 1, tormento: 0.5 }

      - testo: "Scollarle al vapore del bricco"
        descrizione: "Il bricco di Tullio e un pomeriggio intero, un foglio alla volta."
        costo: 2
        esito:
          titolo: Il pomeriggio del bricco
          testo: |
            Tieni il blocco sopra il becco del bricco per tutto il pomeriggio,
            mentre la panca dell'anticamera vi guarda lavorare come al teatro.
            Alla quinta pagina la clausola dice che il seggio di una casa
            firmataria va a chi la casa nomina sulla soglia del proprio maniero,
            davanti a un testimone del Consiglio. Julia la legge e dice che per
            questo la città aspetta che l'erede dei Tarvelin torni a casa.
          pe: { accademiche: 3 }
          effetti: { fazione.consiglio: 1, rep.castaldi: 0.5 }

  # ------------------------------------------------------------ passo 12 · il giardino di Maerith
  - id: consiglio-il-giardino-di-maerith
    presso: grifone-di-ferro
    immagine: personaggi/liaren-tarvelin
    titolo: Il giardino di Maerith
    sommario: "Il seggio dei Tarvelin va a chi Liaren nominerà sulla soglia del Maniero, e stasera Liaren suona al Grifone."
    luogo: Locanda del Grifone di Ferro, la sala
    area: ponti-sospesi
    requisiti: [fazione.consiglio == 11, pista.acciaio >= 8, pista.pelle != 4, pista.pelle != 5, pista.pelle != 6]
    testo: |
      Al Grifone di Ferro è sera, e la sala è piena di Raschiatori con gli
      stivali sporchi della piattaforma. Liaren Tarvelin suona il samisen
      seduta sul bancone e canta una canzone sui ponti che a metà cambia le
      parole per prendere in giro un Raschiatore in prima fila. Brunella,
      passando con due piatti per mano, guarda la lettera col sigillo che ti
      spunta dalla giubba.

      Quando la canzone finisce Liaren si siede al tuo tavolo, con la sedia
      girata al contrario e il mento sullo schienale. Le spieghi la clausola
      del Patto e la proposta che aspetta in Consiglio. Ti risponde che al
      Maniero dei Tarvelin non entra da anni e che il seggio di suo padre lo
      lascia volentieri a chi lo vuole; ma se sulla soglia non nomina nessuno,
      al voto vincono quelli che il seggio lo vogliono troppo.

      {empatia Media} Lo chiama suo padre, come se parlasse di un altro, e il
      giardino chiuso è la cosa che le fa più paura.

      {origine figlio-del-circolo} Il giardino dei Tarvelin l'hai visto dal
      muro, con i rami che scavalcano il cancello e le catene. Al Circolo ti
      hanno insegnato che un giardino chiuso da dieci anni si legge da quello
      che è cresciuto senza nessuno.
    opzioni:
      - testo: "Convincerla a sedere lei"
        descrizione: "Liaren non vuole il seggio, e forse per questo sarebbe la persona giusta."
        quando: [rep.tarvelin < 2]
        prova: { attributo: sociale, abilita: [empatia, persuasione], difficolta: Difficile }
        successo:
          titolo: La sedia al contrario
          testo: |
            Le parli della sala del Grifone, dei Raschiatori che stasera hanno
            cantato con lei e di quanti di loro in Consiglio non hanno nessuno che
            si ricordi come si chiamano. Liaren gira la sedia per il verso giusto
            e ci si siede con le mani in grembo, a lungo. Poi dice che domattina
            va al Maniero, e che vuole te alla soglia come testimone del
            Consiglio.
          pe: { empatia: 6 }
          imposta: { consiglio.tarvelin: 1 }
          segue: consiglio-la-soglia-del-maniero
        fallimento:
          titolo: Il samisen
          testo: |
            Le parli del dovere della casata, e a ogni parola Liaren si fa più
            lontana, finché torna sul bancone a suonare una canzone lenta che in
            sala nessuno conosce. Brunella ti porta via il piatto e ti dice di
            tornare quando avrai un'idea migliore.
          effetti: { scandalo: 0.5 }

      - testo: "Convincerla a sedere lei"
        descrizione: "Liaren si fida di te, e da te forse può ascoltare perché dovrebbe prendere il seggio."
        quando: [rep.tarvelin >= 2]
        prova: { attributo: sociale, abilita: [empatia, persuasione], difficolta: Media }
        successo:
          titolo: La sedia al contrario
          testo: |
            Le parli della sala del Grifone, dei Raschiatori che stasera hanno
            cantato con lei e di quanti di loro in Consiglio non hanno nessuno che
            si ricordi come si chiamano. Liaren ti ascolta come si ascolta un
            amico che ha ragione, poi gira la sedia per il verso giusto. Domattina
            va al Maniero, e vuole te alla soglia come testimone del Consiglio.
          pe: { empatia: 5 }
          imposta: { consiglio.tarvelin: 1 }
          segue: consiglio-la-soglia-del-maniero
        fallimento:
          titolo: Il samisen
          testo: |
            Le parli del dovere della casata, e Liaren ti ferma con una mano e ti
            dice che proprio tu dovresti sapere che di suo padre non vuole niente.
            Torna sul bancone a riprendere il samisen, e Brunella ti dice di
            tornare quando avrai un'idea migliore.
          effetti: { scandalo: 0.5 }

      - testo: "Portarle il nome di Irsa Valbrun"
        descrizione: "Irsa, socia di Liaren all'Acciaieria e consigliera della Gilda, saprebbe tenere testa a chiunque."
        immagine: personaggi/irsa-valbrun
        quando: [acciaieria.futuro == 3]
        prova: { attributo: sociale, abilita: [persuasione, politica-ed-economia], difficolta: Media }
        successo:
          titolo: Il grembiule in Consiglio
          testo: |
            Le dici che il seggio non deve sederlo per forza lei, se sulla soglia
            nomina qualcuno di cui si fida, e Liaren ride, perché ha capito subito
            a chi pensi. Irsa in Consiglio con il grembiule da bottega, dice,
            sarebbe la cosa più bella che la sala abbia visto da anni. Domattina
            va al Maniero, e vuole te alla soglia come testimone del Consiglio.
          pe: { persuasione: 5 }
          imposta: { consiglio.tarvelin: 2 }
          segue: consiglio-la-soglia-del-maniero
        fallimento:
          titolo: La socia
          testo: |
            Liaren ti ricorda che Irsa siede già nel consiglio della Gilda, e che
            una Tarvelin che regala il seggio di famiglia a una della Gilda in
            sala la leggerebbero tutti allo stesso modo. Torna al samisen, e
            Brunella ti dice di tornare quando avrai un'idea migliore.
          effetti: { scandalo: 0.5 }

      - testo: "Portarle il nome di Abele Torsi"
        descrizione: "Abele Torsi manda avanti l'Acciaieria con gli operai, e in Consiglio non ha mai parlato uno della colata."
        quando: [acciaieria.futuro == 2]
        prova: { attributo: sociale, abilita: [persuasione, empatia], difficolta: Media }
        successo:
          titolo: Uno della colata
          testo: |
            Le dici che il seggio dei Tarvelin era il seggio dell'Acciaieria, e
            che all'Acciaieria adesso decidono gli operai. Liaren ci pensa girando
            il bicchiere, poi dice che Abele Torsi in Consiglio, con le scottature
            sulle braccia, sarebbe la cosa più giusta che suo padre non avrebbe
            mai fatto. Domattina va al Maniero, e vuole te alla soglia come
            testimone del Consiglio.
          pe: { persuasione: 5 }
          imposta: { consiglio.tarvelin: 2 }
          segue: consiglio-la-soglia-del-maniero
        fallimento:
          titolo: Il capoturno
          testo: |
            Liaren ti chiede se Abele lo sa, e quando ammetti di no ti dice che un
            uomo non si nomina in Consiglio a sua insaputa, se si vuole che ci
            resti più di una seduta. Torna al samisen, e Brunella ti dice di
            tornare quando avrai un'idea migliore.
          effetti: { scandalo: 0.5 }

      - testo: "Lasciare che il seggio vada al voto"
        descrizione: "Liaren non vuole scegliere, e il seggio andrà al voto portato da qualcuno di fiducia."
        esito:
          titolo: Cancelliere
          testo: |
            Le dici che va bene così, e Liaren ti ringrazia con una canzone in
            più. Il giorno dopo Julia tira fuori da un astuccio un anello
            d'argento con le bilance dei Castaldi. «Se il seggio va al voto, la
            nomina la porta il Cancelliere, e da oggi il Cancelliere sei tu» dice.
            Marella aggiunge che al Maniero la stanza degli ospiti è pronta per
            te.
          pe: { politica-ed-economia: 5 }
          imposta: { consiglio.tarvelin: 3 }
          almeno: { rep.castaldi: 8 }
          effetti: { fazione.consiglio: 1, oggetto.consiglio-anello-delle-bilance: 1 }

      - testo: "Raccontarle che cosa c'è nel giardino di sua madre"
        descrizione: "Al Circolo un giardino chiuso si legge come una lettera, e tu l'hai visto dal muro."
        quando: [origine.figlio-del-circolo >= 1]
        prova: { attributo: mentale, abilita: [natura, percezione], difficolta: Media }
        successo:
          titolo: Quello che Maerith ha piantato
          testo: |
            Le racconti del giardino come lo hai visto dal muro, con i meli a
            spalliera che hanno preso la forma del muro e sotto il glicine una
            fila di rose piantate dove il sole arriva soltanto la mattina, l'ora
            in cui Maerith ci stava. Liaren ti ascolta con gli occhi bassi. Poi
            dice che domattina va al Maniero, e che vuole te alla soglia come
            testimone del Consiglio.
          pe: { natura: 5 }
          imposta: { consiglio.tarvelin: 1 }
          segue: consiglio-la-soglia-del-maniero
        fallimento:
          titolo: Il samisen
          testo: |
            Ti accorgi tardi di aver nominato le piante con i nomi del Circolo,
            che lei non conosce, e Liaren ti ascolta per cortesia prima di tornare
            al samisen. Brunella ti dice di tornare quando avrai un'idea migliore.
          effetti: { scandalo: 0.5 }

  - id: consiglio-la-soglia-del-maniero
    immagine: ambientazione/maniero-tarvelin
    titolo: La soglia del Maniero
    tipo: seguito
    luogo: Maniero Tarvelin, il giardino chiuso
    area: quartieri-alti
    requisiti: [fazione.consiglio == 11]
    testo: |
      Il Maniero Tarvelin è la casa più silenziosa dei Quartieri Alti, con le
      persiane chiuse e il cancello del giardino tenuto da una catena
      arrugginita girata tre volte intorno alle sbarre. Liaren arriva a piedi
      da sola, con il samisen a tracolla e una cesoia da potatura presa in
      prestito dalla cucina di Brunella.

      Resta a lungo davanti al cancello, poi infila la cesoia nell'anello più
      consumato e ci si appende con tutto il peso finché cede con uno schiocco
      secco. Ti dice di aspettarla sulla soglia ed entra da sola.

      {empatia Media} Ha voluto entrare con una cosa di Brunella, che l'ha
      cresciuta, invece che con le chiavi di Ondrel.

      Resta dentro un'ora. Dal cancello vedi i rami dei meli e il glicine che
      ha mangiato il pergolato, e una volta senti poche note di samisen che si
      interrompono. Quando esce ha le mani sporche di terra e gli occhi
      asciutti. Sale i gradini del Maniero, si gira verso di te sulla soglia e
      aspetta che tu tiri fuori la lettera col sigillo, perché un testimone
      del Consiglio deve avere un sigillo da mostrare.
    opzioni:
      - testo: "Ascoltarla dire il suo nome"
        descrizione: "Liaren Tarvelin, sulla soglia della casa di suo padre, nomina se stessa."
        quando: [consiglio.tarvelin == 1]
        esito:
          titolo: Liaren Tarvelin
          testo: |
            «Il seggio dei Tarvelin lo siede Liaren Tarvelin» dice ad alta voce, e
            scende i gradini pulendosi le mani sui calzoni. Il giorno dopo Julia
            tira fuori da un astuccio di velluto un anello d'argento con le
            bilance dei Castaldi. «La nomina in Consiglio la porta il Cancelliere,
            e da oggi il Cancelliere sei tu» dice. Marella aggiunge che al Maniero
            la stanza degli ospiti è pronta per te.
          pe: { galateo: 5 }
          almeno: { rep.castaldi: 8 }
          effetti: { fazione.consiglio: 1, rep.tarvelin: 1, oggetto.consiglio-anello-delle-bilance: 1 }
      - testo: "Ascoltarla dire il nome di chi siederà"
        descrizione: "Liaren Tarvelin, sulla soglia della casa di suo padre, nomina qualcuno al suo posto."
        quando: [consiglio.tarvelin == 2]
        esito:
          titolo: Un nome sulla soglia
          testo: |
            Liaren dice il nome scandendo il cognome, e scendendo i gradini ti
            dice che il seggio di suo padre lavora all'Acciaieria, dove doveva
            stare. Il giorno dopo Julia tira fuori da un astuccio un anello
            d'argento con le bilance dei Castaldi. «La nomina la porta il
            Cancelliere, e da oggi il Cancelliere sei tu» dice. Marella aggiunge
            che al Maniero la stanza degli ospiti è pronta per te.
          pe: { galateo: 5 }
          almeno: { rep.castaldi: 8 }
          effetti: { fazione.consiglio: 1, rep.tarvelin: 1, oggetto.consiglio-anello-delle-bilance: 1 }

  # ------------------------------------------------------------ passo 13 · la notte prima della seduta
  - id: consiglio-la-notte-prima-della-seduta
    immagine: fazioni/famiglia-castaldi
    titolo: La notte prima della seduta
    sommario: "Domani c'è seduta, e stanotte Eolio Drest ha visto un'ombra sui tetti del Maniero."
    luogo: Maniero Castaldi, la porta di servizio, di notte
    area: quartieri-alti
    requisiti: [fazione.consiglio == 12, consiglio.notte == 0, pista.acciaio >= 8, pista.pelle != 4, pista.pelle != 5, pista.pelle != 6]
    testo: |
      Il ragazzo di Quintus ti trova a mezzanotte. Alla porta di servizio del
      Maniero Castaldi le lanterne sono spente, e Quintus Vael aspetta nel
      buio con la spada fuori dal fodero.

      Domani c'è seduta, e a chi vuole Julia senza maggioranza serve leggere
      in sala il debito dei Castaldi, che sta nel cassetto nuovo dello studio
      di Aldous. Stanotte Eolio Drest ha visto un'ombra passare sui tetti,
      sopra le stanze dei bambini, e ha fatto a Quintus il segnale che in
      trent'anni non aveva mai usato.

      {conoscenze-della-strada Media} Una che entra in un maniero dai tetti
      sa già quale stanza cerca, e qualcuno l'ha pagata bene.

      «Brem fa il turno di notte, e non risponde al fischio. Gli altri li ho
      messi alle porte» dice Quintus a voce bassissima, guardando i tetti.
      «Tu vieni dentro con me, e se la trovi prima tu, non la lasci andare.»
    opzioni:
      - testo: "Entrare con Quintus dalla porta di servizio"
        descrizione: "Quintus conosce la casa dal cortile ai tetti, e tu devi conoscere la ladra."
        esito:
          titolo: Dentro
          testo: |
            Quintus apre la porta con due dita. Il cortile odora di cera e di
            cenere fredda, e il fico nel mezzo è una macchia più nera delle altre.
          imposta: { consiglio.notte: 1, consiglio.gazza: 0 }
          vai: consiglio-maniero-di-notte
      - testo: "Chiedere a Eolio dove l'ha vista"
        descrizione: "Il maggiordomo dei segnali muti sa dov'era l'ombra e dove andava."
        prova: { attributo: sociale, abilita: [empatia, galateo], difficolta: Media }
        successo:
          titolo: Due dita verso l'alto
          testo: |
            Eolio è in fondo al corridoio di servizio, con il campanello di bronzo
            stretto nel pugno perché non suoni. Alza due dita verso il soffitto e
            poi le piega verso lo studio, e capisci che la ladra è scesa dai tetti
            a cercare e ha ancora da fare. Entri nel cortile con un vantaggio che
            lei non sa di averti dato.
          pe: { empatia: 5 }
          imposta: { consiglio.notte: 1, consiglio.gazza: 0 }
          vai: consiglio-maniero-di-notte
        fallimento:
          titolo: Il campanello
          testo: |
            Chiedi a Eolio ad alta voce dove l'ha vista, e il maggiordomo chiude
            gli occhi mentre sopra di voi il rumore fra le tegole si ferma e
            riparte più veloce.
          imposta: { consiglio.notte: 1, consiglio.gazza: 1 }
          vai: consiglio-maniero-di-notte
          effetti: { scandalo: 0.5 }
      - testo: "Salire sui tetti dalla casa accanto"
        descrizione: "Se la ladra è entrata dai tetti, uscirà dai tetti. Si può aspettarla lassù, o almeno cominciare dall'alto."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Media }
        successo:
          titolo: Il cortile dall'alto
          testo: |
            Sali dalla grondaia della casa accanto e ti affacci sul cortile del
            Maniero da sopra le tegole, e da lassù vedi una corda sottile tesa fra
            un ramo del fico e il ballatoio del primo piano, che dal basso nessuno
            avrebbe visto. Scendi lungo la corda, e Quintus ti raggiunge già
            sapendo da che parte guardare.
          pe: { atletica: 5 }
          imposta: { consiglio.notte: 1, consiglio.gazza: 0 }
          effetti: { profondita.consiglio-maniero-di-notte: 1 }
          vai: consiglio-maniero-di-notte
        fallimento:
          titolo: La tegola
          testo: |
            A metà della grondaia una tegola si stacca e va a spaccarsi nel
            cortile con un rumore di campanaccio. Rientri dalla porta di servizio
            con le mani sbucciate, e sopra di voi qualcuno adesso sa di non essere
            solo.
          imposta: { consiglio.notte: 1, consiglio.gazza: 1 }
          effetti: { ferite: 0.5 }
          vai: consiglio-maniero-di-notte
