# La quest di fazione della Caserma (ottobre 2026): «Il mantello scarlatto», pista fazione.caserma da 0 a 15.
# Il protagonista entra come ausiliario a giornata ed esce Capitano della Guardia. I passi:
#  1 il registro del furiere (passi-1)            9 la lista dello sceriffo (guarnigione.yaml, grado 3, il bivio)
#  2 la ronda di notte (guarnigione.yaml)         10 i trenta di Ghoran (guarnigione.yaml)
#  3 il mantello di Bruno Lesca (passi-1, grado 1) 11 il Pesatore (passi-3)
#  4 la casa di pietra blu (passi-1)              12 la strada del fango (spedizione, grado 4)
#  5 sotto le assi (spedizione)                   13 la lettera da Ghoran (passi-3)
#  6 il fuoco al Ponte del Conciatore (passi-2, grado 2)  14 il Mulino Nero (spedizione)
#  7 la paga che non arriva (passi-2)             15 il capitano (passi-3, grado 5)
#  8 il miliziano con la tosse (passi-2)
# Il bivio con gli Scuri (bivio.legge, in fazioni/comuni.yaml) si decide al passo 9; i passi 10-15 chiedono
# bivio.legge == 1. Requisiti di trama: passo 9 e 11 galdrick.via == 0, passo 10 pista.capomozzo >= 1, passi 13-15
# pista.pelle >= 6 (e il 15 galdrick.via == 0). I ripetibili di fazione sono in servizi.yaml.
# Nomi nuovi rispetto all'intelaiatura, cambiati perché già presi nel gioco: il sergente d'addestramento è Duilio
# Gasti (Ilario c'è già nel registro), il miliziano con la tosse Fulvio Saldo (Nino è il garzone del Municipio), la
# sguattera della casa blu Brina (Sefa Orrin vende lanterne al Mercato dei Nodi).
quality:
  - { id: fazione.caserma, immagine: ambientazione/guarnigione-di-qir-azel, nome: "Il mantello scarlatto", categoria: pista, descrizione: "Dopo la razzia la Caserma di Galdrick ha più mantelli che uomini, e il furiere cerca braccia da scrivere sul registro. Chi firma entra a giornata, con la paga quando arriva." }
  - { id: caserma.capitano, immagine: icone/police-badge, nome: Capitano della Guardia, categoria: stato, descrizione: "Il Consiglio di Qir-Azel ti ha confermato Capitano della Guardia, un titolo rimasto vuoto dalla morte di Ivo Carstan. Il Municipio ti apre senza invito e la Caserma ti paga ogni settimana." }
  - { id: caserma.pensione, nome: La pensione della madre di Bruno, categoria: stato, nascosta: true, descrizione: "1 Galdrick paga di tasca sua una pensione alla madre di Bruno Lesca." }
  - { id: caserma.nando, nome: Dove sta Nando, categoria: stato, nascosta: true, descrizione: "Dove hai messo al sicuro Nando Rizza (1 in Caserma, 2 al Grifone di Ferro, 3 da Mamma Tesh)." }
  - { id: caserma.secchi, nome: La catena dei secchi, categoria: stato, nascosta: true, descrizione: "La catena dei secchi al Ponte del Conciatore (1 ha retto, 2 si è rotta)." }
  - { id: caserma.sergente, nome: Il sergente sotto la trave, categoria: stato, nascosta: true, descrizione: "Il sergente sotto la trave al Ponte del Conciatore (1 tirato fuori in tempo, 2 tirato fuori tardi)." }
  - { id: caserma.sbarra, nome: La sbarra del Custode, categoria: stato, nascosta: true, descrizione: "La sbarra del Custode al Ponte del Conciatore (1 alzata in tempo, 2 alzata tardi)." }
  - { id: caserma.fuoco, nome: Le fasi riuscite dell'incendio, categoria: stato, nascosta: true, descrizione: "Quante delle tre fasi dell'incendio sono riuscite. Con due il ponte si salva." }
  - { id: caserma.incendio, nome: Il Ponte del Conciatore, categoria: stato, nascosta: true, descrizione: "1 il ponte si è salvato, 2 ha perso tre campate e Linna si è ustionata le mani." }
  - { id: caserma.anticipo, nome: La paga anticipata, categoria: stato, nascosta: true, descrizione: "1 hai anticipato tu la paga delle ronde, 2 Galdrick te l'ha rimborsata." }
  - { id: caserma.saldo, nome: Fulvio Saldo, categoria: stato, nascosta: true, descrizione: "Che cosa hai fatto di Fulvio Saldo (1 arrestato, 2 girato perché riferisca a te, 3 lasciato andare con il debito pagato)." }
  - { id: caserma.cavillo, nome: Il cavillo della clausola, categoria: stato, nascosta: true, descrizione: "1 hai trovato il cavillo nella clausola di Ghoran, che vale solo per chi è arrivato dopo l'accordo." }
  - { id: caserma.guida, nome: La guida per la strada del fango, categoria: stato, nascosta: true, descrizione: "Chi ti accompagna sulla strada per Ghoran (1 Hagra, 2 una guida a pagamento, 3 nessuno)." }
  - { id: caserma.hagra, nome: Il favore del clan di Hagra, categoria: stato, nascosta: true, descrizione: "1 Hagra ha contestato il sigillo davanti ai suoi uomini, e il suo clan ti deve un favore." }
  - { id: caserma.borso, nome: Il silenzio di Borso, categoria: stato, nascosta: true, descrizione: "1 Borso si è accorto che gli mentivi, e non parlerà più con te." }
  - { id: caserma.promessa, nome: La promessa a Borso, categoria: stato, nascosta: true, descrizione: "1 hai promesso a Borso di far arrivare un'offerta di riscatto al clan del Guado, tramite Hagra." }
  - { id: caserma.disertori, nome: I disertori convinti, categoria: stato, nascosta: true, descrizione: "Quanti disertori del Mulino Nero hai convinto a deporre le armi. Con due, nella cantina restano soltanto Brando e Nihali." }
  - { id: caserma.brando, nome: Brando Selli, categoria: stato, nascosta: true, descrizione: "1 Brando Selli si è arreso, 2 l'hai preso ferito." }
  - { id: caserma.nihali, nome: Nihali al Mulino Nero, categoria: stato, nascosta: true, descrizione: "1 Nihali Cuzan è in catene, 2 è fuggito con metà del libro delle paghe di Vesh." }
  - { id: caserma.libro, nome: Il libro delle paghe di Vesh, categoria: stato, nascosta: true, descrizione: "Che cosa hai fatto del libro delle paghe di Vesh (1 letto in cortile, 2 affidato a Galdrick, 3 bruciato nella stufa del furiere)." }
  - { id: caserma.carstan, nome: La spada nella teca, categoria: stato, nascosta: true, descrizione: "1 hai preso la spada di Ivo Carstan, 2 l'hai lasciata nella teca." }
  - { id: caserma.municipio, nome: Il voto del Consiglio, categoria: stato, nascosta: true, descrizione: "1 il Consiglio ha votato il tuo titolo in Municipio." }

fazioni:
  - id: caserma
    nome: La Caserma di Qir-Azel
    immagine: icone/guarded-tower
    reputazione: rep.caserma
    pista: fazione.caserma
    gradi:
      - { passo: 3, nome: Miliziano, ricompensa: "Il mantello scarlatto, la paga del giuramento e l'armeria d'ordinanza della Caserma a prezzo ridotto." }
      - { passo: 6, nome: Capo di ronda, ricompensa: "La lanterna di ronda, il nome in rosso sulla lavagna e una branda in Caserma per curarsi le ferite." }
      - { passo: 9, nome: Vice-sceriffo, ricompensa: "Un nome falso nella lista di Galdrick, la giubba senza mostrine, gli incarichi della lista e le pratiche che si perdono." }
      - { passo: 12, nome: Luogotenente dello sceriffo, ricompensa: "La cotta della Caserma, l'archivio dei rapporti e lo sconto del luogotenente all'armeria." }
      - { passo: 15, nome: Capitano della Guardia, ricompensa: "La spada di Ivo Carstan o le piastre della Caserma, il distintivo del capitano, una borsa pesante e la paga del capitano." }

luoghi:
  - id: caserma-casa-blu
    area: citta-bassa
    nome: La casa di pietra blu
    immagine: ambientazione/citta-bassa
    sommario: "Il posto di guardia della Caserma in Città Bassa, con le inferriate alle finestre e il registro delle denunce."
    testo: |
      Il posto di guardia della Caserma in Città Bassa sta in una casa di pietra blu all'angolo di due vicoli, con
      le inferriate alle finestre e una lanterna sopra la porta che di notte resta accesa. Dentro c'è un banco con due
      panche davanti e la stufa nell'angolo, e in fondo una cucina dove Brina, la sguattera, tiene sempre una pentola sul fuoco.
      Sul banco c'è il registro delle denunce, aperto alla pagina del giorno.
    requisiti: [fazione.caserma >= 3]
