# La quest della Caserma, passi 11, 13 e 15 (il 12 e il 14 sono le spedizioni della strada del fango e del Mulino
# Nero), più la lettura del registro del Pesatore dagli Averi.
# 11 il Pesatore: Ulmo Strass in ufficio con la clausola firmata da Galdrick per avere i trenta di Ghoran, e il nome
#    di Brina sul foglio (caserma.cavillo se trovi il cavillo). Qualunque cosa si faccia, quella notte il Pesatore la
#    porta via dalla casa blu; il seguito della notte chiude il passo.
# 13 la lettera da Ghoran (pista.pelle >= 6): Borso in catene e i nomi del quarto senza paga. La promessa a Borso
#    (caserma.promessa) usa la riga del registro del Pesatore; se Borso scopre la bugia tace (caserma.borso).
#    Il seguito, in cima alla colonna, è Brando Selli.
# 15 il capitano (grado 5): la veglia per Carstan e il libro delle paghe di Vesh (caserma.libro), la teca all'alba
#    (la spada di Carstan o le piastre della Caserma, caserma.carstan) e, dopo, il voto in Municipio (caserma.municipio).
#    Il segreto usato: le strade, la notte di Carstan, le tenne Mastrel, mentre Galdrick era in ginocchio accanto a lui.
storylet:
  # ------------------------------------------------------------ passo 11 · il Pesatore
  - id: caserma-il-pesatore
    presso: guarnigione-di-qir-azel
    immagine: ambientazione/ghoran
    titolo: Il Pesatore
    sommario: "Dietro i trenta mercenari di Ghoran è arrivato anche un altro uomo, con un foglio sigillato."
    luogo: Guarnigione di Qir-Azel, l'ufficio dello sceriffo
    area: quartieri-alti
    requisiti: [fazione.caserma == 10, bivio.legge == 1, galdrick.via == 0]
    testo: |
      La sera dei trenta, masticando la sua resina sotto il portico, Hagra ti
      ha detto che da Ghoran, dietro ai mercenari, era arrivato anche un uomo
      di tutt'altro mestiere.

      Stamattina quell'uomo è seduto nell'ufficio di Galdrick, sulla sedia
      degli ospiti. È grosso e calmo, con le mani larghe da mugnaio, e si
      chiama Ulmo Strass, ma a Ghoran lo chiamano il Pesatore. Sul tavolo c'è
      un foglio con il sigillo di cera verde di un clan e due firme, quella
      di un capo dei recinti e quella di Galdrick.

      {accademiche Media} È la clausola che i clan di Ghoran mettono in ogni
      accordo con le città, niente asilo ai fuggiaschi dei recinti, e per
      avere i trenta lo sceriffo l'ha firmata.

      «Era il prezzo» dice Galdrick. «Non pensavo che qualcuno sarebbe venuto
      a riscuotere.» Il Pesatore gira il foglio verso di te. Sotto le firme
      c'è un elenco corto di nomi, e il terzo è *Brina, cucina della casa di
      pietra blu*.

      {origine fuggiasco-di-ghoran} L'ultimo nome è il tuo, con il segno del
      recinto da cui sei scappato. Galdrick ci mette sopra il pollice, come
      per tenere fermo il foglio, finché il Pesatore non smette di guardare.

      Il Pesatore sorride, con la pazienza di un uomo che ha pesato sacchi
      tutta la vita.
    opzioni:
      - testo: "Cercare il cavillo nella clausola"
        descrizione: "Un accordo scritto ha una data, e chi è arrivato prima potrebbe esserne fuori."
        prova: { attributo: mentale, abilita: [accademiche, politica-ed-economia], difficolta: Difficile }
        successo:
          titolo: La data
          testo: |
            In fondo al foglio c'è la data dell'accordo, e la clausola dice *chi fuggirà*,
            al futuro, mentre Brina è alla casa blu da due anni. Lo dici ad alta voce, e
            Galdrick si appoggia allo schienale. Il Pesatore piega il foglio in quattro e
            se lo mette in tasca, sorridendo ancora.

            {politica-ed-economia Media} Il foglio non gli basta più, e quello che gli
            serve lo cercherà di notte.
          pe: { accademiche: 5 }
          imposta: { caserma.cavillo: 1 }
          segue: caserma-la-porta-delle-cucine
        fallimento:
          titolo: Il futuro
          testo: |
            Leggi il foglio tre volte senza trovare niente, e il Pesatore ti
            guarda come si guarda un bambino che cerca di sollevare un sacco. Poi
            lo piega in quattro e se lo mette in tasca.
          segue: caserma-la-porta-delle-cucine
          effetti: { tormento: 0.5 }

      - testo: "Chiedere a Hagra quanto vale il sigillo"
        descrizione: "A Ghoran i clan si contestano i sigilli fra loro, e Hagra viene da un altro clan."
        prova: { attributo: sociale, abilita: [empatia, conoscenze-della-strada], difficolta: Media }
        successo:
          titolo: La cera verde
          testo: |
            Hagra smette di masticare e ci pensa prima di rispondere. «La cera
            verde è del clan del Guado, e al Guado vale, eh, ma se un altro clan
            la contesta davanti a testimoni non vale più niente.» Si gratta
            l'argilla secca sulla guancia. «Il mio clan lo contesterebbe a
            pagamento. Il prezzo lo decido quando serve.»
          pe: { empatia: 5 }
          segue: caserma-la-porta-delle-cucine
        fallimento:
          titolo: Affari di clan
          testo: |
            Hagra ti dice gentile che i sigilli sono affari dei clan e che la
            Guardia farebbe bene a non metterci il naso. Poi torna a guardare il
            cortile.
          segue: caserma-la-porta-delle-cucine
          effetti: { sospetto: 0.5 }

      - testo: "Nascondere Brina prima di sera"
        descrizione: "In Città Bassa una sguattera si può far sparire per una notte, senza dire a Galdrick dove."
        prova: { attributo: sociale, abilita: [conoscenze-della-strada, ingannare], difficolta: Media }
        successo:
          titolo: La cantina del bottaio
          testo: |
            Il bottaio del vicolo delle Fasce ti deve una firma, e accetta di
            tenere Brina in cantina fra le botti per una notte. Lei viene senza
            domande e si porta il mestolo. Galdrick ti risponde che non vuole
            sapere niente, e intanto scrive una riga sul taccuino.
          pe: { conoscenze-della-strada: 5 }
          segue: caserma-la-porta-delle-cucine
        fallimento:
          titolo: Il mestolo
          testo: |
            Brina non vuole andare, perché la casa blu è l'unico posto dove ha
            dormito tranquilla da quando è scappata e stasera i detenuti devono
            mangiare. Si rimette a mescolare la zuppa.
          segue: caserma-la-porta-delle-cucine
          effetti: { tormento: 0.5 }

      - testo: "Restare a guardare il Pesatore"
        descrizione: "Gli occhi del Pesatore cercano il tuo nome sotto il pollice di Galdrick, e si può reggere quello sguardo."
        quando: [origine.fuggiasco-di-ghoran >= 1]
        prova: { attributo: mentale, abilita: resilienza, difficolta: Media }
        successo:
          titolo: Lo sguardo
          testo: |
            Il Pesatore ti guarda come guardava la merce sulla bilancia, dai polsi
            alle caviglie, e tu non abbassi gli occhi. Alla fine è lui a girarsi
            verso Galdrick. «Questa la conosco» dice, e non aggiunge altro.

            {origine fuggiasco-di-ghoran} Le spalle volevano curvarsi come al
            mercato, e tenerle dritte ti fa male fino alle scapole.
          pe: { resilienza: 5 }
          segue: caserma-la-porta-delle-cucine
        fallimento:
          titolo: La bilancia
          testo: |
            A metà dello sguardo del Pesatore ti accorgi di avere le spalle curve
            e gli occhi sul pavimento, e lui sorride appena. Galdrick tiene il
            pollice sul foglio finché non sei uscito.
          segue: caserma-la-porta-delle-cucine
          effetti: { tormento: 0.5 }

  - id: caserma-la-porta-delle-cucine
    immagine: ambientazione/citta-bassa
    titolo: La porta delle cucine
    tipo: seguito
    luogo: Città Bassa, la casa di pietra blu, di notte
    area: citta-bassa
    requisiti: [fazione.caserma == 10]
    testo: |
      Quella notte resti alla casa blu. Fulvio è di turno alla porta
      principale, e due miliziani mandati per rinforzo dal sergente dei
      Ponti stanno sul retro, vicino alla porta delle cucine. La zuppa di
      Brina è sul fuoco, coperta, per i detenuti del mattino, e stanotte nel
      vicolo anche i gatti sono rimasti dentro.

      {furtivita Media} Due rinforzi che nessuno ti ha presentato, e messi
      proprio sul retro. Le porte di una casa si aprono da dentro più
      facilmente che da fuori.

      Verso la terza campana senti un cane che non abbaia ma ringhia basso,
      dalla parte del vicolo delle cucine.
    opzioni:
      - testo: "Correre alla porta delle cucine"
        descrizione: "Il ringhio viene dal retro, a dieci passi dalla stufa."
        prova: { attributo: fisico, abilita: [atletica, rissa], difficolta: Media }
        successo:
          titolo: Il carro nel vicolo
          testo: |
            La porta delle cucine è aperta, con il paletto tirato da dentro, e i
            due rinforzi non ci sono. Nel vicolo c'è un carro con una gabbia di
            legno, e dentro Brina tiene ancora il mestolo in mano. Mandi contro il
            muro il primo uomo che ti si para davanti, poi il cane ti prende il
            braccio e qualcuno ti spinge giù, e quando ti rialzi il carro è
            sparito.
          pe: { rissa: 3 }
          effetti: { fazione.caserma: 1, ferite: 1, rep.scuri: -0.5, rep.caserma: 0.5, informazioni.segreto: 1 }
        fallimento:
          titolo: Il paletto
          testo: |
            Inciampi nella panca al buio, e alla porta delle cucine trovi il
            paletto tirato da dentro e il vicolo vuoto, con le impronte larghe di
            un cane e il solco di due ruote. I due rinforzi non ci sono più.
          effetti: { fazione.caserma: 1, ferite: 0.5, rep.scuri: -0.5, rep.caserma: 0.5, informazioni.segreto: 1 }

      - testo: "Guardare in faccia i miliziani di rinforzo"
        descrizione: "Prima di correre, conviene sapere chi ha aperto la porta."
        prova: { attributo: mentale, abilita: percezione, difficolta: Media }
        successo:
          titolo: Due facce
          testo: |
            Dalla finestra della cucina li vedi tirare piano il paletto mentre il
            carro entra nel vicolo. Hanno il mantello scarlatto e le facce del
            cortile, due di quelli che non chiedevano mai della paga. Quando
            arrivi alla porta il carro è in fondo al vicolo, con Brina nella
            gabbia, e i due sono spariti dall'altra parte.

            {percezione Media} Uno dei due ha la toppa dello stemma cucita al
            rovescio.
          pe: { percezione: 3 }
          effetti: { fazione.caserma: 1, rep.scuri: -0.5, rep.caserma: 0.5, informazioni.segreto: 1 }
        fallimento:
          titolo: Il buio
          testo: |
            Dalla finestra vedi soltanto il buio, e quando arrivi alla porta il
            paletto è tirato e il vicolo è vuoto. Sulla stufa la zuppa bolle
            ancora.
          effetti: { fazione.caserma: 1, rep.scuri: -0.5, rep.caserma: 0.5, informazioni.segreto: 1, tormento: 0.5 }

      - testo: "Restare accanto alla stufa fino all'alba"
        descrizione: "Qualcuno deve restare con la zuppa e i detenuti."
        esito:
          titolo: La zuppa calda
          testo: |
            Resti accanto alla stufa con la mano sull'elsa, e il ringhio nel
            vicolo si allontana con un rumore di ruote. All'alba la porta delle
            cucine è aperta, con il paletto tirato da dentro, e i due rinforzi non
            ci sono più.

            {resilienza Media} Hai scelto di non correre, e lo sapevi mentre lo
            sceglievi.
          effetti: { fazione.caserma: 1, tormento: 1, rep.scuri: -0.5, rep.caserma: 0.5, informazioni.segreto: 1 }

  # ------------------------------------------------------------ passo 13 · la lettera da Ghoran
  - id: caserma-la-lettera-da-ghoran
    presso: guarnigione-di-qir-azel
    immagine: personaggi/borso
    titolo: La lettera da Ghoran
    sommario: "Vesh è morto, e i nomi di chi in Caserma prendeva la sua paga li sa soltanto Borso."
    luogo: Guarnigione di Qir-Azel, le celle, a notte fonda
    area: quartieri-alti
    requisiti: [fazione.caserma == 12, bivio.legge == 1, pista.pelle >= 6]
    testo: |
      Dalla notte della Pignatta il quarto della Caserma che prendeva anche
      la paga di Vesh è rimasto con una paga sola. Sei miliziani hanno
      chiesto il congedo nella stessa settimana, e due non si sono più visti.
      Galdrick non può fare le scale delle celle, e ti ha detto chi deve
      sapere i nomi.

      In fondo al corridoio delle celle Borso siede sulla paglia con le
      catene ai polsi e il naso rotto. Quando sente i tuoi passi alza la
      testa. «È arrivata una lettera da Ghoran?» chiede, con la voce bassa di
      sempre.

      {politica-ed-economia Media} Le buste della paga di Vesh le portava lui
      ogni primo del mese, e ha in testa il libro dei nomi meglio di
      qualsiasi registro.

      *Due figli venduti al clan del Guado.* La riga del Pesatore ti torna in
      mente, e la mano va alla tasca dove tieni il registro.
    opzioni:
      - testo: "Dargli la riga del Pesatore e promettergli il riscatto"
        descrizione: "Nel registro del Pesatore c'è la riga dei suoi figli, e Hagra può far arrivare un'offerta al Guado."
        quando: [caserma.borso == 0]
        requisiti: [oggetto.caserma-registro-del-pesatore >= 1]
        esito:
          titolo: La riga
          testo: |
            Infili per lo spioncino il registro aperto alla pagina giusta, e Borso
            lo avvicina alla lanterna con le mani incatenate. Per molto tempo non
            dice niente, poi ti chiede se Hagra conosce qualcuno al Guado. Gli
            dici di sì. Lui ti restituisce il registro e comincia a dettare i nomi
            uno per uno, ciascuno con il suo turno, e non si ferma finché non ha
            finito.
          imposta: { caserma.promessa: 1 }
          segue: caserma-la-colonna-di-brando

      - testo: "Mentirgli sulla lettera"
        descrizione: "Una lettera da Ghoran si può inventare, ma se se ne accorge non parlerà mai più."
        quando: [caserma.borso == 0]
        prova: { attributo: sociale, abilita: ingannare, difficolta: Difficile }
        successo:
          titolo: La lettera
          testo: |
            Gli dici che è arrivata una lettera del clan del Guado e che i due
            ragazzi sono vivi. Borso ti guarda a lungo dallo spioncino, poi chiude
            gli occhi e ti detta i nomi, con la voce più bassa del solito.

            {ingannare Difficile} Hai detto la bugia che lui voleva sentire, e ti
            resterà addosso come la paglia delle celle sui vestiti.
          pe: { ingannare: 5 }
          effetti: { tormento: 1 }
          segue: caserma-la-colonna-di-brando
        fallimento:
          titolo: Il nome del clan
          testo: |
            Borso ti chiede il nome del capo clan che l'ha mandata, e tu esiti un
            momento di troppo. Torna a sedersi sulla paglia, e da quella notte,
            quando passi davanti allo spioncino, non alza più la testa.
          imposta: { caserma.borso: 1 }
          effetti: { tormento: 1 }

      - testo: "Strappargli i nomi"
        descrizione: "È in catene e tu hai le chiavi, e lo si paga dopo."
        quando: [caserma.borso == 0]
        prova: { attributo: sociale, abilita: intimidire, difficolta: Difficile }
        successo:
          titolo: Metà dei nomi
          testo: |
            Entri nella cella e gli parli abbastanza da vicino da sentire l'odore
            della paglia sulla sua pelle. Borso ti dà a denti stretti la metà dei
            nomi. Poi smette, e nessuna minaccia lo fa ricominciare, però quella
            metà basta per arrivare in cima.
          pe: { intimidire: 5 }
          effetti: { tormento: 1 }
          segue: caserma-la-colonna-di-brando
        fallimento:
          titolo: Le catene
          testo: |
            Alzi la voce, e Borso allunga le mani incatenate e ti tira contro le
            sbarre, piano, quanto basta per farti capire che potrebbe, poi ti
            lascia andare.
          effetti: { ferite: 0.5 }

      - testo: "Incrociare le ricevute del furiere con i turni"
        descrizione: "Chi nei mesi di ritardo ha chiesto meno anticipi degli altri una paga ce l'aveva."
        prova: { attributo: mentale, abilita: politica-ed-economia, difficolta: Difficile }
        successo:
          titolo: Chi non chiedeva
          testo: |
            Passi tre notti con il furiere a incrociare le ricevute degli anticipi
            con i registri dei turni. Chi non ha mai chiesto un anticipo e aveva
            il turno giusto nelle notti giuste finisce in una colonna di quindici
            nomi, e in cima c'è un sergente con vent'anni di servizio.
          pe: { politica-ed-economia: 5 }
          segue: caserma-la-colonna-di-brando
        fallimento:
          titolo: Troppe ricevute
          testo: |
            Le ricevute sono migliaia, e alla terza notte hai trenta nomi, metà
            dei quali soltanto prudenti. Il furiere ti dice che così si accusa
            mezza Caserma.
          effetti: { tormento: 1 }

      - testo: "Mettere insieme quello che sanno Fulvio e Nando"
        descrizione: "Fulvio sa chi prendeva il foglio dei turni e Nando ha visto chi contava i soldi."
        costo: 3
        esito:
          titolo: Due testimoni
          testo: |
            Ci vogliono quattro giorni. Fulvio ti dice chi prendeva il foglio e a
            chi lo portava, e Nando, seduto sulla panca della casa blu, riconosce
            le facce che gli descrivi, e a ogni nome il primo trema e il secondo
            mangia una mela. Alla fine la colonna ha dodici nomi, e in cima c'è un
            sergente con vent'anni di servizio.
          segue: caserma-la-colonna-di-brando

  - id: caserma-la-colonna-di-brando
    immagine: ambientazione/guarnigione-di-qir-azel
    titolo: In cima alla colonna
    tipo: seguito
    luogo: Guarnigione di Qir-Azel, il magazzino del furiere, all'alba
    area: quartieri-alti
    requisiti: [fazione.caserma == 12]
    testo: |
      In cima alla colonna c'è Brando Selli, sergente dei Ponti, con vent'anni
      di servizio e i baffi corti da regolamento. Ti ha insegnato lui a
      piegare il mantello sul braccio prima di uscire di ronda, e stanotte non
      è rientrato dal turno.

      Con lui mancano tre miliziani dei Ponti, e manca il libro delle paghe di
      Vesh, rilegato in cuoio rosso come te l'ha descritto Borso. Borso l'ha
      visto l'ultima volta la notte della Pignatta, in mano a Nihali Cuzan che
      scappava dalla porta sul retro.

      {politica-ed-economia Media} Chi ha in mano quel libro può vendere ogni
      nome due volte, a chi è scritto dentro e a chi lo vuole leggere.

      Il furiere ti guarda dal banco con gli occhiali in mano, e dal corridoio
      Galdrick ti fa chiamare.
    opzioni:
      - testo: "Portare la colonna a Galdrick"
        descrizione: "Lo sceriffo resta in Caserma con la fasciatura al fianco, ed è lui a decidere chi va."
        immagine: personaggi/toren-galdrick
        esito:
          titolo: Un ordine con il tuo grado
          testo: |
            Galdrick legge la colonna con una mano sul fianco, e al nome di Brando
            chiude gli occhi. «Mi ha portato il pane quando ero in letto» dice.
            Poi firma un ordine perché la squadra la guidi tu, e ti dice che i
            disertori sono stati visti sulla strada di Laresh, oltre il Ponte del
            Conciatore, verso i mulini bruciati.
          pe: { resilienza: 3 }
          effetti: { fazione.caserma: 1, rep.caserma: 0.5, informazioni.segreto: 1 }

      - testo: "Contare i mantelli in magazzino"
        descrizione: "Chi diserta porta via il mantello, e il furiere sa quanti ne mancano."
        prova: { attributo: mentale, abilita: [percezione, politica-ed-economia], difficolta: Facile }
        successo:
          titolo: Quattro cartellini
          testo: |
            Dallo scaffale dei mantelli di scorta ne mancano quattro, e i
            cartellini con i nomi sono rimasti appesi ai chiodi, fra cui quello di
            Brando. Dietro lo scaffale trovi una mappa della strada di Laresh
            strappata da un almanacco della Gilda, con un cerchio a carboncino
            intorno a un mulino bruciato.
          pe: { percezione: 3 }
          effetti: { fazione.caserma: 1, rep.caserma: 0.5, informazioni.segreto: 1 }
        fallimento:
          titolo: I cartellini
          testo: |
            I conti dei mantelli non tornano, perché la settimana scorsa il
            furiere ne ha dati tre alle reclute nuove. A mezzogiorno Galdrick ti
            manda a dire che i disertori sono stati visti sulla strada di Laresh,
            verso i mulini bruciati.
          effetti: { fazione.caserma: 1, informazioni.segreto: 1, tormento: 0.5 }

      - testo: "Andare al gabbiotto della ronda dei Ponti"
        descrizione: "Brando ha passato vent'anni sui Ponti, e qualcuno l'ha visto andare via."
        prova: { attributo: sociale, abilita: [conoscenze-della-strada, empatia], difficolta: Media }
        successo:
          titolo: Il Custode del turno di notte
          testo: |
            Il Custode del turno di notte ti dice che Brando è passato all'alba a
            piedi con tre dei suoi, portando le gerle come i facchini, diretto al
            Ponte del Conciatore e alla strada di Laresh. Gli ha pagato la
            gabella, cosa che in vent'anni non aveva mai fatto, e il Custode te lo
            racconta come un addio.
          pe: { empatia: 3 }
          effetti: { fazione.caserma: 1, rep.caserma: 0.5, informazioni.segreto: 1 }
        fallimento:
          titolo: Nessuno ha visto
          testo: |
            Al gabbiotto nessuno ha visto niente, tutti con la stessa faccia, e a
            mezzogiorno Galdrick ti manda a dire che i disertori sono stati visti
            sulla strada di Laresh, verso i mulini bruciati.
          effetti: { fazione.caserma: 1, informazioni.segreto: 1, sospetto: 0.5 }

  # ------------------------------------------------------------ passo 15 · il capitano (grado 5)
  - id: caserma-la-veglia-per-carstan
    presso: guarnigione-di-qir-azel
    immagine: ambientazione/evento-notti-cucite-145
    titolo: La veglia per Carstan
    sommario: "La Guardia veglia la spada di Ivo Carstan, e tu hai sotto il mantello il libro di Vesh."
    luogo: Guarnigione di Qir-Azel, il corridoio del mastio, di notte
    area: quartieri-alti
    requisiti: [fazione.caserma == 14, bivio.legge == 1, pista.pelle >= 6, galdrick.via == 0]
    testo: |
      Una notte all'anno, nell'anniversario dell'ultima delle Notti Cucite,
      la Guardia veglia fino all'alba la spada di Ivo Carstan, con le
      candele su ogni gradino del corridoio del mastio e i miliziani a turno
      davanti alla teca. Galdrick veglia su una sedia dell'ufficio.

      Sotto il mantello il libro delle paghe di Vesh ti pesa contro le
      costole, e nel cortile, fra quelli che aspettano il turno, ci sono
      uomini il cui nome sta lì dentro. All'alba dovrai decidere che cosa
      farne.

      {origine accolito-del-velo} Al Velo le veglie si fanno con le parole,
      e le tue labbra cominciano per abitudine la preghiera dei morti.

      Verso la seconda campana Livio Mastrel ti si siede accanto e ti offre
      un pezzo di liquirizia. «Quella notte ero di ronda» dice, guardando la
      spada. «Quando hanno trovato Carstan nel vicolo, Galdrick gli si è
      inginocchiato accanto a tenergli la mano, e le strade le ho tenute io
      con quattro ragazzi. La città ha deciso che il Cucitore l'aveva
      fermato lui, e lui non l'ha mai smentito. Gli serviva che la Caserma
      avesse un uomo così, e ha fatto l'uomo così per cinque anni.»

      {empatia Media} Mastrel non è amaro, vuole che tu sappia quanto costa
      un titolo deciso dalla città, perché domani ne avrai uno anche tu.
    opzioni:
      - testo: "Leggere il libro in cortile, nome per nome"
        descrizione: "All'alba, davanti alla Guardia schierata, la Caserma perde un quarto degli uomini e la Città Bassa lo vede."
        prova: { attributo: sociale, abilita: [espressivita, intimidire], difficolta: Media }
        successo:
          titolo: I nomi
          testo: |
            All'alba sali sul gradino del portico e leggi i nomi uno per uno con
            la paga accanto. A ogni nome un uomo esce dalla fila e va a mettersi
            contro il muro, e nessuno scappa. Quando chiudi il libro contro il
            muro ci sono ventisei mantelli scarlatti, e in fila ne restano
            settanta. Entro mezzogiorno alla casa blu, per la prima volta, c'è la
            coda per denunciare.
          pe: { espressivita: 5 }
          imposta: { caserma.libro: 1 }
          effetti: { nomea.citta-bassa: 1 }
          segue: caserma-la-teca
        fallimento:
          titolo: La voce
          testo: |
            Al quinto nome la voce ti si incrina, e il resto lo leggi con le pause
            sbagliate mentre i miliziani escono dalla fila uno dopo l'altro.
            Quando chiudi il libro il cortile è diviso in due, e qualcuno contro
            il muro ride di te a mezza voce. La Città Bassa lo sa entro
            mezzogiorno lo stesso.
          imposta: { caserma.libro: 1 }
          effetti: { nomea.citta-bassa: 1, scandalo: 1 }
          segue: caserma-la-teca

      - testo: "Dare il libro a Galdrick"
        descrizione: "Galdrick deciderà caso per caso, con tutto il tempo che serve."
        immagine: personaggi/toren-galdrick
        esito:
          titolo: Caso per caso
          testo: |
            Galdrick legge un nome della prima pagina e chiude gli occhi. Poi
            infila il libro nella tasca interna della divisa, accanto al taccuino.
            «Uno alla volta, e ci vorrà un anno» dice, come una promessa fatta
            anche ai nomi.

            {politica-ed-economia Media} In un anno qualcuno scapperà e qualcuno
            cambierà vita, e Galdrick ha deciso che il prezzo è giusto.
          pe: { resilienza: 5 }
          imposta: { caserma.libro: 2 }
          effetti: { rep.caserma: 0.5 }
          segue: caserma-la-teca

      - testo: "Bruciarlo nella stufa del furiere"
        descrizione: "La Caserma resta intera e il debito con Vesh sparisce, e Galdrick disapproverà senza impedirtelo."
        esito:
          titolo: La stufa
          testo: |
            Prima dell'alba scendi al magazzino e metti il libro nella stufa del
            furiere pagina per pagina, perché intero non brucia. Il furiere,
            arrivato quando l'ultima pagina si sta arricciando, scrive *legna* su
            una ricevuta in bianco e te la fa firmare.

            {empatia Media} L'ha scritta anche se non è d'accordo, e nel suo
            alfabeto vuol dire che se lo porterà dietro insieme a te.
          pe: { furtivita: 5 }
          imposta: { caserma.libro: 3 }
          effetti: { rep.caserma: 1, nomea.citta-bassa: -0.5 }
          segue: caserma-la-teca

  - id: caserma-la-teca
    immagine: ambientazione/guarnigione-di-qir-azel
    titolo: La teca
    tipo: seguito
    luogo: Guarnigione di Qir-Azel, il corridoio del mastio, all'alba
    area: quartieri-alti
    requisiti: [fazione.caserma == 14]
    testo: |
      Quando l'ultima coppia ha finito il turno di veglia, Galdrick si alza
      piano, con la mano sul fianco, e apre la teca con una chiave della
      divisa. Il vetro cigola sui cardini che nessuno ha unto da anni.
      Toglie la spada dal panno rosso e te la porge di piatto, sulle due
      mani.

      «In una teca non serve a niente» dice. «Carstan non l'avrebbe voluta
      qui dentro.» Guarda i miliziani addormentati sui gradini. «Il
      Consiglio ti conferma capitano della Guardia stamattina. Julia l'ha
      già scritto, e lo mette ai voti per farlo sapere.»

      {armi-da-mischia Media} Il filo è ammaccato a metà, dove Carstan ha
      parato l'ultima volta, e il bilanciamento è quello di una spada usata
      ogni giorno da chi sapeva usarla.

      {origine rampollo-dei-quartieri-alti} A casa tua le spade dei nonni
      stavano appese sopra il camino e nessuno le ha mai tolte, e adesso non
      sai nemmeno come si ringrazia.

      Sulla soglia del magazzino il furiere tiene fra le braccia un'armatura
      a piastre brunita, che ha unto ogni primavera per cinque anni senza
      che nessuno la indossasse.
    opzioni:
      - testo: "Prendere la spada di Carstan"
        descrizione: "La spada del vecchio sceriffo, con il filo ammaccato, che in città riconosceranno tutti."
        esito:
          titolo: Il filo ammaccato
          testo: |
            Prendi la spada, e i miliziani sui gradini si alzano uno dopo l'altro
            battendo il pugno sul petto. Il furiere ti consegna il distintivo
            d'argento brunito del capitano e una borsa pesante, la paga arretrata
            del titolo, e ti fa firmare la ricevuta. Contro il portone aperto una
            donna con uno scialle grigio cerca il rammendo sulla tua spalla prima
            della tua faccia, e poi ti sorride.
          imposta: { caserma.carstan: 1, caserma.capitano: 1 }
          effetti: { fazione.caserma: 1, oggetto.caserma-spada-di-ivo-carstan: 1, oggetto.caserma-distintivo-del-capitano: 1, monete: 350, racconto: 1, informazioni.segreto: 1 }
          almeno: { rep.caserma: 10 }
          segue: caserma-il-voto-del-consiglio

      - testo: "Lasciare la spada nella teca"
        descrizione: "È la spada di Carstan, e il furiere ha in braccio un'altra cosa."
        esito:
          titolo: Le piastre
          testo: |
            Rimetti la spada sul panno rosso con le due mani, e Galdrick chiude la
            teca annuendo una volta. Il furiere ti mette contro il petto
            l'armatura a piastre. «Questa allora, che è del capitano e l'ho unta
            per cinque anni.» Poi ti consegna il distintivo d'argento brunito e
            una borsa pesante con la paga arretrata del titolo. Contro il portone
            una donna con uno scialle grigio guarda il tuo mantello.
          imposta: { caserma.carstan: 2, caserma.capitano: 1 }
          effetti: { fazione.caserma: 1, oggetto.caserma-piastre-della-caserma: 1, oggetto.caserma-distintivo-del-capitano: 1, monete: 350, racconto: 1, informazioni.segreto: 1 }
          almeno: { rep.caserma: 10 }
          segue: caserma-il-voto-del-consiglio

  - id: caserma-il-voto-del-consiglio
    immagine: fazioni/consiglio-di-qir-azel
    titolo: Il voto del Consiglio
    tipo: seguito
    luogo: Municipio, la sala del Consiglio
    area: quartieri-alti
    requisiti: [caserma.capitano == 1, caserma.municipio == 0]
    testo: |
      A metà mattina sali la scalinata del Municipio con il distintivo sul
      mantello, e l'usciere ti apre prima che tu bussi. Il punto è il primo
      della seduta, e Julia Castaldi legge dalla pratica *conferma del
      titolo di Capitano della Guardia di Qir-Azel*, poi alza gli occhi su
      di te come quando sei venuto per la paga.

      {galateo Media} Davanti al Consiglio un capitano sta in piedi con il
      mantello chiuso e ringrazia chi presiede prima del voto, perché dopo
      sembrerebbe un pagamento.

      Il furiere, dalla galleria, tiene il registro aperto sulle ginocchia.
    opzioni:
      - testo: "Ringraziare il Consiglio prima del voto"
        descrizione: "Due parole in piedi, con il mantello chiuso, per un voto che c'è già."
        prova: { attributo: sociale, abilita: [galateo, persuasione], difficolta: Facile }
        successo:
          titolo: All'unanimità
          testo: |
            Ringrazi Julia e il Consiglio con due frasi e ti siedi. Il voto è
            all'unanimità, perfino la Gilda alza la mano, e uscendo l'usciere ti
            dice che da oggi in Municipio si entra senza invito.
          pe: { galateo: 5 }
          imposta: { caserma.municipio: 1 }
          effetti: { rep.castaldi: 1 }
        fallimento:
          titolo: Dopo il voto
          testo: |
            Ringrazi dopo il voto e troppo a lungo, e il voto passa con due
            astenuti. Il furiere dalla galleria lo scrive e chiude il registro con
            un colpo secco.
          imposta: { caserma.municipio: 1 }
          effetti: { scandalo: 1 }

      - testo: "Fare un cenno a Julia, come si fa a casa"
        descrizione: "Nei Quartieri Alti un voto già scritto si ringrazia con un cenno."
        quando: [origine.rampollo-dei-quartieri-alti >= 1]
        esito:
          titolo: Il cenno
          testo: |
            Fai a Julia il cenno che tua madre faceva ai padroni di casa quando la
            cena era riuscita, e lei te lo restituisce senza sorridere. Il voto è
            all'unanimità, e l'usciere ti dice che da oggi in Municipio si entra
            senza invito.
          pe: { galateo: 5 }
          imposta: { caserma.municipio: 1 }
          effetti: { rep.castaldi: 1 }

  # ------------------------------------------------------------ dagli Averi · il registro del Pesatore
  - id: caserma-leggere-il-registro-del-pesatore
    titolo: Il registro del Pesatore
    tipo: oggetto
    area: citta-bassa
    immagine: ambientazione/ghoran
    requisiti: [oggetto.caserma-registro-del-pesatore >= 1]
    sommario: "Il quaderno di cuoio unto con le vendite del Pesatore degli ultimi dieci anni."
    testo: |
      Il quaderno ha la copertina di cuoio unto e l'odore del carro dove è
      stato per anni accanto alla bilancia. Il Pesatore scrive piccolo e
      dritto, con una grafia da scrivano, e in ogni riga ci sono una data e
      un peso, e accanto al prezzo il segno del clan che ha comprato. Al
      posto dei nomi ci sono le descrizioni, *ragazza, denti buoni*, *due
      fratelli, venduti insieme*.

      A metà quaderno, otto anni fa, c'è la riga che hai già letto. *Due
      figli del naso rotto, al clan del Guado.*

      {origine fuggiasco-di-ghoran} Sfogli le pagine dell'anno in cui sei
      scappato e ti fermi prima di arrivare al mese, con il quaderno stretto
      al petto.
    opzioni:
      - testo: "Cercare il segno del Guado nelle altre pagine"
        descrizione: "Il clan del Guado compare molte volte, e si può contare quante."
        costo: 0
        esito:
          titolo: Il segno del Guado
          testo: |
            Conti il segno del Guado pagina dopo pagina e ti fermi a quaranta
            righe in dieci anni, quasi tutte di ragazzi pagati bene.

            {politica-ed-economia Media} Un clan che compra tanti ragazzi li
            rivende o li consuma in un lavoro duro. In tutti e due i casi il
            riscatto costerà caro.

      - testo: "Chiudere il registro"
        descrizione: "Basta così, per stasera."
        costo: 0
        esito:
          titolo: Il cuoio unto
          testo: |
            Rimetti il registro nella bisaccia, e l'odore del cuoio unto lo lavi
            via dalle dita con l'acqua fredda, due volte.
