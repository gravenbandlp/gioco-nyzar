# La quest della Caserma, passi 11, 13 e 15 (il 12 e il 14 sono le spedizioni della strada del fango e del Mulino
# Nero), più la lettura del registro del Pesatore dagli Averi.
# 11 il Pesatore: Ulmo Strass in ufficio con la clausola firmata da Galdrick per avere i trenta di Ghoran, e il nome
#    di Brina sul foglio (caserma.cavillo se trovi il cavillo). Qualunque cosa si faccia, quella notte il Pesatore la
#    porta via dalla casa blu; il seguito della notte chiude il passo.
# 13 la lettera da Ghoran (pista.pelle >= 6): Borso in catene e i nomi del quarto senza paga. La promessa a Borso
#    (caserma.promessa) usa la riga del registro del Pesatore; se Borso scopre la bugia tace (caserma.borso).
#    Il seguito, in cima alla colonna, è Brando Selli.
# 15 il capitano (grado 5): la veglia per Carstan e il libro delle paghe di Vesh (caserma.libro), la teca all'alba
#    (la spada di Carstan o le piastre della Caserma, caserma.carstan) e, dopo, il voto in Municipio (caserma.municipio).
#    Il segreto usato: le strade, la notte di Carstan, le tenne Mastrel, mentre Galdrick era in ginocchio accanto a lui.
storylet:
  # ------------------------------------------------------------ passo 11 · il Pesatore
  - id: caserma-il-pesatore
    presso: guarnigione-di-qir-azel
    immagine: ambientazione/ghoran
    titolo: Il Pesatore
    sommario: "Dietro i trenta di Ghoran è arrivato in città un uomo che non è un mercenario. Stamattina è nell'ufficio dello sceriffo, con un foglio sigillato."
    luogo: Guarnigione di Qir-Azel, l'ufficio dello sceriffo
    area: quartieri-alti
    requisiti: [fazione.caserma == 10, bivio.legge == 1, galdrick.via == 0]
    testo: |
      La sera dei trenta Hagra ti ha detto che dietro ai mercenari da Ghoran era arrivato un uomo che non è un
      mercenario.

      Stamattina quell'uomo è seduto nell'ufficio di Galdrick sulla sedia degli ospiti. È un uomo grosso con
      le mani larghe da mugnaio appoggiate sulle ginocchia, e la sedia scricchiola sotto di lui quando si
      sposta. Si chiama Ulmo Strass, e a Ghoran lo chiamano il Pesatore. Sul tavolo c'è un foglio con il
      sigillo di cera verde di un clan, firmato da un capo dei recinti e da Galdrick. La cera è spessa e
      conserva netta l'impronta di un anello.

      {accademiche Media} I clan di Ghoran mettono da sempre in ogni accordo con le città la clausola che nega
      asilo ai fuggiaschi dei recinti. Per avere i trenta lo sceriffo l'ha firmata.

      «Era il prezzo» dice Galdrick senza guardare il foglio. «Non pensavo che qualcuno sarebbe venuto a
      riscuotere.» Il Pesatore gira il foglio verso di te. Sotto le firme c'è un elenco corto di nomi, e il
      terzo è *Brina, cucina della casa di pietra blu*.

      {origine fuggiasco-di-ghoran} L'ultimo nome è il tuo, con il segno del recinto da cui sei scappat{o|a}.
      Galdrick ci appoggia sopra il pollice e lo tiene lì finché il Pesatore non smette di guardare.
    opzioni:
      - testo: "Cercare il cavillo nella clausola"
        descrizione: "Un accordo scritto ha sempre una data. Se la clausola vale da quel giorno in poi, chi è arrivato prima è fuori."
        prova: { attributo: mentale, abilita: [accademiche, politica-ed-economia], difficolta: Difficile }
        successo:
          titolo: La data
          testo: |
            Chiedi di leggere il foglio, e il Pesatore te lo lascia leggere con indulgenza. In fondo c'è la
            data dell'accordo, e la clausola dice *chi fuggirà*, al futuro. Brina è alla casa blu da due anni.
            Lo dici ad alta voce, e Galdrick si appoggia allo schienale e si passa una mano sulla faccia. Il
            Pesatore riprende il foglio, lo piega in quattro con due passate del pollice sulla piega e lo
            mette in tasca, senza smettere di sorridere.
          pe: { accademiche: 5 }
          imposta: { caserma.cavillo: 1 }
          segue: caserma-la-porta-delle-cucine
        fallimento:
          titolo: Il futuro
          testo: |
            Leggi il foglio tre volte e non trovi niente che non sia già chiaro. Il Pesatore ti lascia leggere
            con pazienza, e le sue mani restano ferme sulle ginocchia per tutto il tempo. «Prenditi pure tutto
            il tempo che ti serve» dice, gentile. Poi riprende il foglio, lo piega in quattro e lo mette in
            tasca.
          segue: caserma-la-porta-delle-cucine
          effetti: { tormento: 0.5 }

      - testo: "Chiedere a Hagra quanto vale il sigillo"
        descrizione: "Il sigillo è di un clan. A Ghoran i clan si contestano i sigilli fra loro, e Hagra viene da un altro clan."
        prova: { attributo: sociale, abilita: [empatia, conoscenze-della-strada], difficolta: Media }
        successo:
          titolo: La cera verde
          testo: |
            Trovi Hagra sotto il portico, con la schiena contro una colonna, e le chiedi del sigillo. «La cera
            verde è del clan del Guado, e al Guado vale, eh, ma se un altro clan la contesta davanti a
            testimoni non vale più niente» dice. «Il mio clan lo contesterebbe a pagamento. Il prezzo lo
            decido quando serve.»

            {conoscenze-della-strada Media} Hagra ha lasciato il prezzo in sospeso apposta. Fra i clan è il
            modo di dire che sarà alto, e che vale la pena pagarlo.
          pe: { empatia: 5 }
          segue: caserma-la-porta-delle-cucine
        fallimento:
          titolo: Affari di clan
          testo: |
            Hagra ti ascolta masticando e poi ti dice che i sigilli sono affari dei clan, eh. La Guardia della
            città farebbe bene a non metterci il naso. Lo dice gentile e senza smettere di masticare. Poi ti
            volta le spalle e torna a guardare il cortile.
          segue: caserma-la-porta-delle-cucine
          effetti: { sospetto: 0.5 }

      - testo: "Nascondere Brina prima di sera"
        descrizione: "In Città Bassa una sguattera si può far sparire per una notte. Galdrick non deve sapere dove."
        prova: { attributo: sociale, abilita: [conoscenze-della-strada, ingannare], difficolta: Media }
        successo:
          titolo: La cantina del bottaio
          testo: |
            Il bottaio del vicolo delle Fasce ti deve una firma, e accetta di tenere Brina in cantina fra le
            botti per una notte. La cantina sa di vino acido e di doghe bagnate. Lei viene senza fare domande
            e si porta il mestolo. Galdrick, quando glielo dici, ti risponde che non vuole sapere niente, e
            intanto scrive una riga sul taccuino.
          pe: { conoscenze-della-strada: 5 }
          segue: caserma-la-porta-delle-cucine
        fallimento:
          titolo: Il mestolo
          testo: |
            Brina non vuole andare. Dice che la casa blu è l'unico posto dove ha dormito tranquilla da quando
            è scappata, e che i detenuti stasera devono mangiare. Si rimette a mescolare la zuppa, e il
            mestolo batte sul fondo della pentola a ogni giro. Tu non trovi le parole per farla smettere.
          segue: caserma-la-porta-delle-cucine
          effetti: { tormento: 0.5 }

      - testo: "Restare a guardare il Pesatore"
        descrizione: "Gli occhi del Pesatore cercano il tuo nome sotto il pollice di Galdrick. Si può reggere quello sguardo."
        quando: [origine.fuggiasco-di-ghoran >= 1]
        prova: { attributo: mentale, abilita: resilienza, difficolta: Media }
        successo:
          titolo: Lo sguardo
          testo: |
            Il Pesatore ti guarda come guardava la merce sulla bilancia, dai polsi alle caviglie e senza
            nessuna fretta. Tu lo lasci fare senza abbassare gli occhi. Dopo un poco è lui a girarsi verso
            Galdrick. «Questa merce la conosco» dice con gentilezza, e non aggiunge altro.

            {origine fuggiasco-di-ghoran} Le spalle volevano curvarsi, come al mercato. Le hai tenute dritte,
            e adesso ti fanno male fino alle scapole.
          pe: { resilienza: 5 }
          segue: caserma-la-porta-delle-cucine
        fallimento:
          titolo: La bilancia
          testo: |
            Il Pesatore ti guarda come guardava la merce sulla bilancia, e a metà sguardo ti accorgi di avere
            le spalle curve e gli occhi sul pavimento. Le assi davanti alla scrivania di Galdrick sono
            consumate in due solchi chiari, dove si fermano i piedi di chi viene a rapporto. Lui sorride
            appena. Galdrick tiene il pollice sul foglio finché non sei uscit{o|a}.
          segue: caserma-la-porta-delle-cucine
          effetti: { tormento: 0.5 }

  - id: caserma-la-porta-delle-cucine
    immagine: ambientazione/citta-bassa
    titolo: La porta delle cucine
    tipo: seguito
    luogo: Città Bassa, la casa di pietra blu, di notte
    area: citta-bassa
    requisiti: [fazione.caserma == 10]
    testo: |
      Quella notte resti alla casa blu. Fulvio è di turno alla porta principale, mentre sul retro ci sono due
      miliziani che il sergente dei Ponti ha mandato di rinforzo. Sulla stufa accesa c'è la zuppa di Brina per
      i detenuti del mattino, e il coperchio della pentola batte piano ogni volta che il brodo sale.

      {furtivita Media} Nessuno ti ha presentato quei due, e li hanno messi proprio accanto alla porta delle
      cucine, che si apre da dentro.

      Il fuoco della stufa è l'unica luce della stanza, e dalle finestre il vicolo è nero. Verso la terza
      campana senti un cane che ringhia basso nel vicolo delle cucine.
    opzioni:
      - testo: "Correre alla porta delle cucine"
        descrizione: "Il ringhio viene dal retro. Ci sono dieci passi fra la stufa e la porta."
        prova: { attributo: fisico, abilita: [atletica, rissa], difficolta: Media }
        successo:
          titolo: Il carro nel vicolo
          testo: |
            Arrivi alla porta delle cucine e la trovi aperta, con il paletto tirato da dentro. Il ferro del
            paletto è ancora tiepido di una mano. I due miliziani di rinforzo non ci sono. Nel vicolo c'è un
            carro con una gabbia di legno, e dentro la gabbia Brina tiene ancora il mestolo in mano. Colpisci
            il primo uomo che ti si para davanti e lo mandi contro il muro, poi il cane ti prende il braccio e
            un'altra mano ti spinge giù. Quando ti rialzi il carro è in fondo al vicolo, e poi non c'è più.
          pe: { rissa: 3 }
          effetti: { fazione.caserma: 1, ferite: 1, rep.scuri: -0.5, rep.caserma: 0.5, informazioni.segreto: 1 }
        fallimento:
          titolo: Il paletto
          testo: |
            Inciampi nella panca al buio, e quando arrivi alla porta delle cucine il paletto è tirato da
            dentro e il vicolo è vuoto. Sul selciato ci sono le impronte larghe di un cane e il solco di due
            ruote, che gira all'angolo in fondo. I due miliziani di rinforzo non ci sono più.
          effetti: { fazione.caserma: 1, ferite: 0.5, rep.scuri: -0.5, rep.caserma: 0.5, informazioni.segreto: 1 }

      - testo: "Guardare in faccia i miliziani di rinforzo"
        descrizione: "Prima di correre, conviene sapere chi ha aperto la porta."
        prova: { attributo: mentale, abilita: percezione, difficolta: Media }
        successo:
          titolo: Due facce
          testo: |
            Dalla finestra della cucina li vedi tirare piano il paletto e fare un passo indietro nel buio
            mentre il carro entra nel vicolo. Nessuno dei due si volta verso la casa. Hanno il mantello
            scarlatto e le facce che conosci dal cortile, due di quelli che non chiedevano mai della paga.
            Quando arrivi alla porta il carro è già in fondo al vicolo, con Brina nella gabbia e il mestolo
            ancora in mano, e i due miliziani sono spariti dall'altra parte.
          pe: { percezione: 3 }
          effetti: { fazione.caserma: 1, rep.scuri: -0.5, rep.caserma: 0.5, informazioni.segreto: 1 }
        fallimento:
          titolo: Il buio
          testo: |
            Dalla finestra della cucina vedi soltanto il buio, e una sagoma che potrebbe essere chiunque.
            Quando arrivi alla porta il paletto è tirato e il vicolo è vuoto. Il cane ha smesso di ringhiare.
            Sulla stufa la zuppa bolle ancora.
          effetti: { fazione.caserma: 1, rep.scuri: -0.5, rep.caserma: 0.5, informazioni.segreto: 1, tormento: 0.5 }

      - testo: "Restare accanto alla stufa fino all'alba"
        descrizione: "Nel vicolo andrà come deve andare. Qualcuno deve restare con la zuppa e i detenuti."
        esito:
          titolo: La zuppa calda
          testo: |
            Resti sedut{o|a} accanto alla stufa con la mano sull'elsa, e il ringhio nel vicolo si allontana
            con un rumore di ruote. Per il resto della notte tieni acceso il fuoco e conti i colpi della
            campana. All'alba la porta delle cucine è aperta, con il paletto tirato da dentro, e i due
            miliziani di rinforzo non ci sono più. Sul fuoco la zuppa è ancora calda.
          effetti: { fazione.caserma: 1, tormento: 1, rep.scuri: -0.5, rep.caserma: 0.5, informazioni.segreto: 1 }

  # ------------------------------------------------------------ passo 13 · la lettera da Ghoran
  - id: caserma-la-lettera-da-ghoran
    presso: guarnigione-di-qir-azel
    immagine: personaggi/borso
    titolo: La lettera da Ghoran
    sommario: "Vesh è morto, e un quarto della Caserma è rimasto senza la seconda paga. I loro nomi li sa soltanto Borso, che portava le buste."
    luogo: Guarnigione di Qir-Azel, le celle, a notte fonda
    area: quartieri-alti
    requisiti: [fazione.caserma == 12, bivio.legge == 1, pista.pelle >= 6]
    testo: |
      Dalla notte della Pignatta il quarto della Caserma che prendeva anche la paga di Vesh è rimasto con una
      paga sola. Galdrick ha la fasciatura al fianco e non può scendere le scale delle celle, così ti ha detto
      chi deve sapere i nomi.

      Il corridoio delle celle è basso e umido, e l'unica lanterna pende da un gancio a metà. In fondo c'è
      Borso, con le catene ai polsi e il grembiule di cuoio, dietro una porta che fino a poco fa chiudeva lui.
      Gli anelli delle catene sono nuovi e ancora lucidi di grasso. Il cuoio del grembiule invece è consumato
      e chiaro sul fianco, dove per anni ha battuto l'anello delle chiavi. «È arrivata una lettera da Ghoran?»
      chiede a voce bassa.

      {politica-ed-economia Media} Le buste della paga di Vesh le portava lui una per uomo, e i nomi li ha in
      testa meglio di qualsiasi registro.

      *Due figli venduti al clan del Guado.* Ti torna in mente la riga del registro del Pesatore, e la mano va
      alla tasca dove lo tieni.
    opzioni:
      - testo: "Dargli la riga del Pesatore e promettergli il riscatto"
        descrizione: "Nel registro del Pesatore c'è la riga dei suoi figli. Hagra può far arrivare un'offerta al clan del Guado. È una promessa che andrà mantenuta."
        quando: [caserma.borso == 0]
        requisiti: [oggetto.caserma-registro-del-pesatore >= 1]
        esito:
          titolo: La riga
          testo: |
            Apri il registro alla pagina giusta e lo infili aperto per lo spioncino, che è largo appena quanto
            il quaderno. Borso lo prende con le mani incatenate e lo avvicina alla lanterna del corridoio. Per
            molto tempo non dice niente, e le catene ai suoi polsi non fanno nessun rumore. Poi ti chiede se
            Hagra conosce qualcuno al Guado. Gli dici di sì. Lui chiude il registro e te lo restituisce. Poi
            comincia a dettare i nomi uno per uno, ciascuno con il suo turno, e non si ferma finché non ha
            finito.
          imposta: { caserma.promessa: 1 }
          segue: caserma-la-colonna-di-brando

      - testo: "Mentirgli sulla lettera"
        descrizione: "Una lettera da Ghoran si può inventare. Se se ne accorge, però, non parlerà mai più."
        quando: [caserma.borso == 0]
        prova: { attributo: sociale, abilita: ingannare, difficolta: Difficile }
        successo:
          titolo: La lettera
          testo: |
            Gli dici che una lettera è arrivata a nome del clan del Guado, e che i due ragazzi sono vivi.
            Borso ti guarda a lungo dallo spioncino, e nella fessura vedi soltanto i suoi occhi con la luce
            della lanterna che ci batte dentro. Poi chiude gli occhi e ti detta i nomi uno per uno, con la
            voce più bassa del solito.
          pe: { ingannare: 5 }
          effetti: { tormento: 1 }
          segue: caserma-la-colonna-di-brando
        fallimento:
          titolo: Il nome del clan
          testo: |
            Gli dici che una lettera è arrivata, e lui ti chiede il nome del capo clan che l'ha mandata. Esiti
            un momento di troppo. Borso torna a sedersi sulla paglia con la schiena contro la pietra, e le
            catene scendono con lui e si ammucchiano sul pavimento. Da quella notte, quando passi davanti allo
            spioncino, non alza più la testa.
          imposta: { caserma.borso: 1 }
          effetti: { tormento: 1 }

      - testo: "Strappargli i nomi"
        descrizione: "È in catene, e tu hai le chiavi. Si può fare, e lo si paga dopo."
        quando: [caserma.borso == 0]
        prova: { attributo: sociale, abilita: intimidire, difficolta: Difficile }
        successo:
          titolo: Metà dei nomi
          testo: |
            Giri la chiave nella serratura ed entri nella cella. Gli parli da vicino, abbastanza da sentire
            l'odore della paglia sulla sua pelle. Borso ti dà i nomi a denti stretti, e a ogni nome stringe le
            dita sugli anelli della catena. A metà smette, e nessuna minaccia lo fa ricominciare. La metà,
            però, basta per arrivare in cima.
          pe: { intimidire: 5 }
          effetti: { tormento: 1 }
          segue: caserma-la-colonna-di-brando
        fallimento:
          titolo: Le catene
          testo: |
            Entri nella cella e alzi la voce, e Borso ti guarda senza paura. Poi allunga le mani incatenate e
            ti tira contro le sbarre, piano, quanto basta per farti capire che potrebbe, e ti lascia andare.
            Sul mantello ti restano due righe di ruggine dove le sbarre l'hanno toccato.
          effetti: { ferite: 0.5 }

      - testo: "Incrociare le ricevute del furiere con i turni"
        descrizione: "Il furiere ha le ricevute di ogni paga. Chi ha chiesto meno anticipi degli altri, nei mesi di ritardo, una paga ce l'aveva."
        prova: { attributo: mentale, abilita: politica-ed-economia, difficolta: Difficile }
        successo:
          titolo: Chi non chiedeva
          testo: |
            Passi tre notti con il furiere al banco del magazzino, a incrociare le ricevute degli anticipi con
            i registri dei turni alla luce di una lampada a olio. Il furiere tiene le ricevute legate a
            mazzetti con lo spago, un mazzetto per mese, e quelle degli anni vecchi sono ingiallite fino al
            colore del tè. Chi non ha mai chiesto un anticipo e ha sempre avuto il turno giusto nelle notti
            giuste finisce in una colonna. La colonna ha quindici nomi, e in cima c'è un sergente con
            vent'anni di servizio.
          pe: { politica-ed-economia: 5 }
          segue: caserma-la-colonna-di-brando
        fallimento:
          titolo: Troppe ricevute
          testo: |
            Le ricevute sono migliaia e i turni cambiano ogni settimana. Alla terza notte la lampada ha
            lasciato un alone nero sulle travi del magazzino, e tu hai una colonna di trenta nomi, metà dei
            quali sono soltanto prudenti. Il furiere ti dice che così si accusa mezza Caserma, e ti rimanda a
            dormire.
          effetti: { tormento: 1 }

      - testo: "Mettere insieme quello che sanno Fulvio e Nando"
        descrizione: "Fulvio sa chi prendeva il foglio dei turni, e Nando ha visto chi contava i soldi sotto il ponte."
        costo: 3
        esito:
          titolo: Due testimoni
          testo: |
            Ci vogliono quattro giorni. Fulvio ti dice chi prendeva il foglio e a chi lo portava, e Nando,
            seduto sulla panca della casa blu, riconosce le facce che gli descrivi. A ogni nome il primo trema
            e il secondo mangia una mela, e sotto la panca i torsoli si allineano uno accanto all'altro come
            le reclute alla rassegna. Alla fine la colonna ha dodici nomi, e in cima c'è un sergente con
            vent'anni di servizio.
          segue: caserma-la-colonna-di-brando

  - id: caserma-la-colonna-di-brando
    immagine: ambientazione/guarnigione-di-qir-azel
    titolo: In cima alla colonna
    tipo: seguito
    luogo: Guarnigione di Qir-Azel, il magazzino del furiere, all'alba
    area: quartieri-alti
    requisiti: [fazione.caserma == 12]
    testo: |
      Il foglio della colonna è sul banco del magazzino, sotto la prima luce grigia che entra dalla finestra
      alta. In cima c'è Brando Selli, sergente dei Ponti con vent'anni di servizio. Ti ha insegnato lui a
      piegare il mantello sul braccio prima della ronda, e stanotte non è rientrato dal turno.

      Con lui mancano tre miliziani dei Ponti, e manca il libro delle paghe di Vesh che Borso ti ha descritto.
      Ha la copertina di cuoio rosso e dentro i nomi di chi in Caserma prendeva la seconda paga. Borso l'ha
      visto l'ultima volta la notte della Pignatta, in mano a Nihali Cuzan che scappava dalla porta sul retro.

      {politica-ed-economia Media} Senza Vesh chi ha quel libro può vendere ogni nome due volte, a chi è
      scritto dentro e a chi lo vuole leggere.

      Dal corridoio Galdrick ti fa chiamare.
    opzioni:
      - testo: "Portare la colonna a Galdrick"
        descrizione: "Lo sceriffo ha la fasciatura al fianco e non può cavalcare. Ma è lui che decide chi va."
        immagine: personaggi/toren-galdrick
        esito:
          titolo: Un ordine con il tuo grado
          testo: |
            Galdrick legge la colonna seduto, con una mano sul fianco, e tiene il foglio lontano dagli occhi
            per via della luce scarsa. Quando arriva al nome di Brando chiude gli occhi per un momento. «Mi ha
            portato il pane quando ero in letto» dice. Poi firma un ordine con il tuo grado, perché la squadra
            la guidi tu, e ti dice che i disertori sono stati visti sulla strada di Laresh, oltre il Ponte del
            Conciatore, verso i mulini bruciati.
          pe: { resilienza: 3 }
          effetti: { fazione.caserma: 1, rep.caserma: 0.5, informazioni.segreto: 1 }

      - testo: "Contare i mantelli in magazzino"
        descrizione: "Chi diserta porta via il mantello. Il furiere sa quanti ne mancano, e di chi."
        prova: { attributo: mentale, abilita: [percezione, politica-ed-economia], difficolta: Facile }
        successo:
          titolo: Quattro cartellini
          testo: |
            Il furiere apre lo scaffale dei mantelli di scorta e conta con il dito. Ne mancano quattro, e i
            cartellini sono rimasti appesi ai chiodi con i nomi, nei quattro posti vuoti dove la polvere sul
            ripiano non c'è. Uno dei quattro è quello di Brando. Dietro lo scaffale trovi una mappa della
            strada di Laresh strappata da un almanacco della Gilda, con un cerchio a carboncino intorno a un
            mulino bruciato.
          pe: { percezione: 3 }
          effetti: { fazione.caserma: 1, rep.caserma: 0.5, informazioni.segreto: 1 }
        fallimento:
          titolo: I cartellini
          testo: |
            Conti i mantelli e i cartellini due volte, e i conti non tornano perché il furiere la settimana
            scorsa ne ha dati tre alle reclute nuove. Il registro delle consegne lo dice in una riga a matita
            che hai saltato tutte e due le volte. A mezzogiorno Galdrick ti manda a dire che i disertori sono
            stati visti sulla strada di Laresh, verso i mulini bruciati.
          effetti: { fazione.caserma: 1, informazioni.segreto: 1, tormento: 0.5 }

      - testo: "Andare al gabbiotto della ronda dei Ponti"
        descrizione: "Brando ha passato vent'anni sui Ponti. Qualcuno l'ha visto andare via, e non l'ha fermato."
        prova: { attributo: sociale, abilita: [conoscenze-della-strada, empatia], difficolta: Media }
        successo:
          titolo: Il Custode del turno di notte
          testo: |
            Al gabbiotto della ronda dei Ponti il Custode del turno di notte ti dice che Brando è passato
            all'alba con tre dei suoi, a piedi, con le gerle come i facchini. Gli ha anche pagato la gabella,
            cosa che in vent'anni non aveva mai fatto. La moneta è ancora sul davanzale del gabbiotto, perché
            il Custode non ha avuto il coraggio di metterla nella cassetta. Erano diretti al Ponte del
            Conciatore, verso la strada di Laresh.
          pe: { empatia: 3 }
          effetti: { fazione.caserma: 1, rep.caserma: 0.5, informazioni.segreto: 1 }
        fallimento:
          titolo: Nessuno ha visto
          testo: |
            Al gabbiotto nessuno ha visto niente, e lo dicono tutti con la stessa faccia, guardando il fiume
            invece di te. A mezzogiorno Galdrick ti manda a dire che i disertori sono stati visti sulla strada
            di Laresh, verso i mulini bruciati.
          effetti: { fazione.caserma: 1, informazioni.segreto: 1, sospetto: 0.5 }

  # ------------------------------------------------------------ passo 15 · il capitano (grado 5)
  - id: caserma-la-veglia-per-carstan
    presso: guarnigione-di-qir-azel
    immagine: ambientazione/evento-notti-cucite-145
    titolo: La veglia per Carstan
    sommario: "Una notte all'anno la Guardia veglia la spada di Ivo Carstan fino all'alba. Quest'anno hai sotto il mantello il libro delle paghe di Vesh."
    luogo: Guarnigione di Qir-Azel, il corridoio del mastio, di notte
    area: quartieri-alti
    requisiti: [fazione.caserma == 14, bivio.legge == 1, pista.pelle >= 6, galdrick.via == 0]
    testo: |
      Nell'anniversario dell'ultima delle Notti Cucite la Guardia veglia fino all'alba la spada di Ivo
      Carstan. La spada è nella teca, sul panno rosso, con il filo ammaccato rivolto verso il corridoio.
      Galdrick è seduto su una sedia portata dall'ufficio, con la mano sul fianco, e non dorme.

      Sotto il mantello hai il libro delle paghe di Vesh, e il cuoio della copertina ti si è scaldato contro
      il fianco. Nel cortile, fra quelli che aspettano il turno di veglia, ci sono uomini scritti in quel
      libro.

      {origine accolito-del-velo} Al Velo le veglie si fanno con le parole, e le tue labbra cominciano da sole
      la preghiera dei morti.

      Verso la seconda campana Livio Mastrel si siede accanto a te sul gradino con la sua liquirizia. «Quella
      notte ero di ronda, e Galdrick era il vice» dice. «Quando hanno trovato Carstan nel vicolo gli si è
      inginocchiato accanto e gli ha tenuto la mano fino al mattino, e le strade le ho tenute io con quattro
      ragazzi. La città ha deciso che il Cucitore l'aveva fermato lui, e lui ha lasciato dire. Alla Caserma
      serviva un uomo così, e lui l'ha fatto per cinque anni.»

      All'alba dovrai decidere che cosa fare del libro.
    opzioni:
      - testo: "Leggere il libro in cortile, nome per nome"
        descrizione: "All'alba, davanti alla Guardia schierata. La Caserma perde un quarto degli uomini, e la Città Bassa vede che la Guardia si guarda allo specchio."
        prova: { attributo: sociale, abilita: [espressivita, intimidire], difficolta: Media }
        successo:
          titolo: I nomi
          testo: |
            All'alba sali sul gradino del portico e apri il libro. Leggi i nomi uno per uno, con la paga
            accanto, senza alzare la voce. A ogni nome un uomo del cortile esce dalla fila e va a mettersi
            contro il muro, e il suo posto nella fila resta vuoto perché nessuno stringe. Nessuno scappa.
            Quando chiudi il libro, contro il muro ci sono ventisei mantelli scarlatti, e in fila ne restano
            settanta. In Città Bassa entro mezzogiorno lo sanno tutti, e alla casa blu, per la prima volta,
            c'è la coda per denunciare.
          pe: { espressivita: 5 }
          imposta: { caserma.libro: 1 }
          effetti: { nomea.citta-bassa: 1 }
          segue: caserma-la-teca
        fallimento:
          titolo: La voce
          testo: |
            All'alba sali sul gradino del portico e apri il libro, e al quinto nome la voce ti si incrina. Il
            resto lo leggi peggio, con le pause sbagliate e il dito che perde la riga, mentre i miliziani
            escono dalla fila uno dopo l'altro. Quando chiudi il libro il cortile è diviso in due, e qualcuno
            contro il muro ride di te a mezza voce. La Città Bassa lo sa entro mezzogiorno lo stesso.
          imposta: { caserma.libro: 1 }
          effetti: { nomea.citta-bassa: 1, scandalo: 1 }
          segue: caserma-la-teca

      - testo: "Dare il libro a Galdrick"
        descrizione: "La legge di Galdrick è paziente. Deciderà lui caso per caso, con tutto il tempo che serve."
        immagine: personaggi/toren-galdrick
        esito:
          titolo: Caso per caso
          testo: |
            All'alba porti il libro a Galdrick e glielo metti in mano. Lui lo apre alla prima pagina e legge
            un nome, poi chiude gli occhi. Poi lo infila nella tasca interna della divisa accanto al taccuino.
            Il libro ci entra così stretto che la stoffa tira sui bottoni. «Li sento uno alla volta, ognuno
            con il suo rapporto, e ci vorrà un anno, forse di più» dice, abbottonando la divisa sopra il
            libro. «Chi ha preso quei soldi deve sentirselo dire da me, in faccia.»
          pe: { resilienza: 5 }
          imposta: { caserma.libro: 2 }
          effetti: { rep.caserma: 0.5 }
          segue: caserma-la-teca

      - testo: "Bruciarlo nella stufa del furiere"
        descrizione: "La Caserma resta intera, e il debito con Vesh sparisce con lui. Galdrick lo disapproverà senza impedirtelo."
        esito:
          titolo: La stufa
          testo: |
            Prima dell'alba scendi al magazzino, apri lo sportello della stufa del furiere e ci metti dentro
            il libro, pagina per pagina, perché intero non brucia. La copertina di cuoio rosso la metti per
            ultima, e si torce sulle braci con un fumo che sa di grasso. Il furiere arriva quando l'ultima
            pagina si sta arricciando. Guarda il fuoco e poi te. Prende dal banco una ricevuta in bianco. Ci
            scrive *legna*, la data, e te la fa firmare.
          pe: { furtivita: 5 }
          imposta: { caserma.libro: 3 }
          effetti: { rep.caserma: 1, nomea.citta-bassa: -0.5 }
          segue: caserma-la-teca

  - id: caserma-la-teca
    immagine: ambientazione/guarnigione-di-qir-azel
    titolo: La teca
    tipo: seguito
    luogo: Guarnigione di Qir-Azel, il corridoio del mastio, all'alba
    area: quartieri-alti
    requisiti: [fazione.caserma == 14]
    testo: |
      All'alba Galdrick si alza piano dalla sedia con la mano sul fianco e apre la teca con una chiave che
      tiene nella divisa. Poi toglie la spada dal panno rosso e te la porge di piatto sulle due mani. Il filo
      è ammaccato in più punti, e il cuoio dell'impugnatura è annerito e liscio nel tratto dove si chiudeva la
      mano di Carstan.

      «Carstan questa spada la usava, e qui dentro non serve a nessuno» dice. «Prendila. Stamattina il
      Consiglio ti conferma capitano della Guardia. Julia ha già scritto la nomina, e il voto serve a renderla
      pubblica.» Abbassa la voce perché i miliziani dormono sui gradini. «Te lo dico adesso, che dopo c'è
      gente. Hai fatto un buon lavoro.»

      {origine rampollo-dei-quartieri-alti} A casa tua le spade dei nonni stavano appese sopra il camino e
      nessuno le toglieva. Qui un uomo apre una teca e te ne mette una in mano, e non sai come si ringrazia.

      Sulla soglia del magazzino il furiere tiene in braccio un'armatura a piastre brunita che ha unto per
      cinque anni.
    opzioni:
      - testo: "Prendere la spada di Carstan"
        descrizione: "La spada del vecchio sceriffo, con il filo ammaccato. In città la riconosceranno tutti."
        esito:
          titolo: Il filo ammaccato
          testo: |
            Prendi la spada, e il corridoio si sveglia. I miliziani sui gradini si alzano uno dopo l'altro, e
            qualcuno batte il pugno sul petto con un colpo sordo che il corridoio di pietra ripete. Il furiere
            ti consegna il distintivo d'argento brunito del capitano insieme a una borsa pesante, la paga
            arretrata del titolo, che il Consiglio non pagava da cinque anni a nessuno, e ti fa firmare la
            ricevuta per tutte e due le cose. In fondo al corridoio, contro il portone aperto, c'è una donna
            con uno scialle grigio che guarda il tuo mantello.
          imposta: { caserma.carstan: 1, caserma.capitano: 1 }
          effetti: { fazione.caserma: 1, oggetto.caserma-spada-di-ivo-carstan: 1, oggetto.caserma-distintivo-del-capitano: 1, monete: 350, racconto: 1, informazioni.segreto: 1 }
          almeno: { rep.caserma: 10 }
          segue: caserma-il-voto-del-consiglio

      - testo: "Lasciare la spada nella teca"
        descrizione: "È la spada di Carstan, e la Guardia ci tiene. Il furiere ha in braccio un'altra cosa."
        esito:
          titolo: Le piastre
          testo: |
            Rimetti la spada sul panno rosso con le due mani, come te l'ha data. Il furiere si fa avanti con
            l'armatura a piastre e te la mette contro il petto, e le piastre sono fredde attraverso la camicia
            e lucide di sego. «Questa allora» dice. «È del capitano, e l'ho unta per cinque anni.» Poi ti
            consegna il distintivo d'argento brunito e una borsa pesante con la paga arretrata del titolo, e
            ti fa firmare la ricevuta per tutte e tre le cose. In fondo al corridoio, contro il portone, c'è
            una donna con uno scialle grigio che guarda il tuo mantello.
          imposta: { caserma.carstan: 2, caserma.capitano: 1 }
          effetti: { fazione.caserma: 1, oggetto.caserma-piastre-della-caserma: 1, oggetto.caserma-distintivo-del-capitano: 1, monete: 350, racconto: 1, informazioni.segreto: 1 }
          almeno: { rep.caserma: 10 }
          segue: caserma-il-voto-del-consiglio

  - id: caserma-il-voto-del-consiglio
    immagine: fazioni/consiglio-di-qir-azel
    titolo: Il voto del Consiglio
    tipo: seguito
    luogo: Municipio, la sala del Consiglio
    area: quartieri-alti
    requisiti: [caserma.capitano == 1, caserma.municipio == 0]
    testo: |
      Sali la scalinata del Municipio con il distintivo sul mantello, e l'usciere ti apre prima che tu bussi.
      Nella sala del Consiglio i banchi sono disposti a ferro di cavallo intorno al tavolo di chi presiede.
      Julia Castaldi legge dalla pratica *conferma del titolo di Capitano della Guardia di Qir-Azel* e alza
      gli occhi su di te come quando sei venut{o|a} per la paga.

      {galateo Media} Davanti al Consiglio un capitano sta in piedi con il mantello chiuso e ringrazia chi
      presiede prima del voto, perché dopo sembrerebbe un pagamento.

      I consiglieri della Gilda guardano il distintivo, quelli dei Castaldi Julia. Il furiere è in galleria
      con il registro sulle ginocchia.
    opzioni:
      - testo: "Ringraziare il Consiglio prima del voto"
        descrizione: "Due parole, in piedi, con il mantello chiuso. Il voto c'è già, e qui si tratta di farlo bene."
        prova: { attributo: sociale, abilita: [galateo, persuasione], difficolta: Facile }
        successo:
          titolo: All'unanimità
          testo: |
            Ringrazi Julia e il Consiglio con due frasi, e ti siedi. Il voto è all'unanimità, perfino la Gilda
            alza la mano, e il furiere dalla galleria lo scrive sul registro con una grafia più grande del
            solito. Uscendo, l'usciere ti dice che da oggi in Municipio si entra senza invito.
          pe: { galateo: 5 }
          imposta: { caserma.municipio: 1 }
          effetti: { rep.castaldi: 1 }
        fallimento:
          titolo: Dopo il voto
          testo: |
            Ringrazi dopo il voto, e per troppo tempo, e un consigliere della Gilda tira fuori l'orologio dal
            taschino e lo tiene aperto sul palmo finché non hai finito. Il voto passa lo stesso con due
            astenuti. Il furiere dalla galleria lo scrive sul registro e chiude il libro con un colpo secco.
          imposta: { caserma.municipio: 1 }
          effetti: { scandalo: 1 }

      - testo: "Fare un cenno a Julia, come si fa a casa"
        descrizione: "Nei Quartieri Alti un voto già scritto si ringrazia con un cenno, non con un discorso."
        quando: [origine.rampollo-dei-quartieri-alti >= 1]
        esito:
          titolo: Il cenno
          testo: |
            Fai a Julia il cenno che tua madre faceva ai padroni di casa quando la cena era riuscita, un mezzo
            inchino del mento con gli occhi bassi, e lei te lo restituisce senza sorridere. Il voto è
            all'unanimità. Uscendo, l'usciere ti dice che da oggi in Municipio si entra senza invito.
          pe: { galateo: 5 }
          imposta: { caserma.municipio: 1 }
          effetti: { rep.castaldi: 1 }

  # ------------------------------------------------------------ dagli Averi · il registro del Pesatore
  - id: caserma-leggere-il-registro-del-pesatore
    titolo: Il registro del Pesatore
    tipo: oggetto
    area: citta-bassa
    immagine: ambientazione/ghoran
    requisiti: [oggetto.caserma-registro-del-pesatore >= 1]
    sommario: "Un quaderno di cuoio unto, con le vendite del Pesatore degli ultimi dieci anni."
    testo: |
      Il quaderno ha la copertina di cuoio unto e l'odore del carro dove è stato per anni accanto alla
      bilancia. Gli angoli delle pagine sono neri di dita, e la carta è ondulata dove l'ha presa l'umido. Il
      Pesatore scrive piccolo e dritto con una grafia da scrivano. Ogni riga ha una data e un peso, e accanto
      al prezzo il segno del clan che ha comprato. Al posto dei nomi ci sono le descrizioni, *ragazza, denti
      buoni*, *uomo, mano sinistra storta*, *due fratelli, venduti insieme*.

      A metà quaderno c'è la riga che hai già letto. *Due figli del naso rotto, al clan del Guado.*

      {origine fuggiasco-di-ghoran} Sfogli le pagine dell'anno in cui sei scappat{o|a} e ti fermi prima del
      mese. Chiudi il quaderno e ti accorgi che lo stringi al petto.
    opzioni:
      - testo: "Cercare il segno del Guado nelle altre pagine"
        descrizione: "Il clan del Guado compare molte volte. Si può contare quante."
        costo: 0
        esito:
          titolo: Il segno del Guado
          testo: |
            Conti il segno del Guado con il dito pagina dopo pagina, e ti fermi a quaranta. Quaranta righe in
            dieci anni, quasi tutte di ragazzi, e nelle più vecchie l'inchiostro è diventato marrone. Il clan
            del Guado compra giovani, e li paga bene.

      - testo: "Chiudere il registro"
        descrizione: "Basta così, per stasera."
        costo: 0
        esito:
          titolo: Il cuoio unto
          testo: |
            Chiudi il registro e lo rimetti nella bisaccia, e per un po' ti resta sulle dita l'odore del cuoio
            unto. Lo lavi via con l'acqua fredda due volte. La seconda volta strofini le dita con la cenere
            del focolare.
