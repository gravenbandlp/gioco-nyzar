# La quest della Caserma, passi 6, 7 e 8.
# 6 il fuoco al Ponte del Conciatore (grado 2, Capo di ronda): una scena a fasi. Le tre fasi (i secchi, il sergente
#   sotto la trave, la sbarra del Custode) si giocano una volta ciascuna, in qualsiasi ordine, e segnano caserma.secchi,
#   .sergente e .sbarra (1 riuscita, 2 fallita) e caserma.fuoco (le riuscite). Fatte tutte e tre, si chiude: con due
#   riuscite il ponte si salva (caserma.incendio 1, più reputazione), altrimenti perde tre campate e Linna si ustiona
#   (caserma.incendio 2). Il grado arriva in tutti e due i casi.
# 7 la paga che non arriva: i conti del furiere in Caserma, poi il Consiglio in Municipio (Ottone finché pista.pelle < 6,
#   le casse vuote della ricostruzione dopo). Si può anche anticipare la paga di tasca propria (caserma.anticipo, che la
#   Caserma rimborsa al passo 12).
# 8 il miliziano con la tosse: Fulvio Saldo alla casa blu, poi la bettola dell'Orlo e la scelta (caserma.saldo).
storylet:
  # ------------------------------------------------------------ passo 6 · il fuoco al Ponte del Conciatore (grado 2)
  - id: caserma-il-fuoco-al-conciatore
    immagine: ambientazione/conceria-kasselt
    titolo: Il fuoco al Ponte del Conciatore
    sommario: "All'imbocco del Ponte del Conciatore brucia un magazzino di pelli, e la ronda mista guarda te."
    luogo: Città Bassa, l'imbocco del Ponte del Conciatore
    area: citta-bassa
    requisiti: [fazione.caserma == 5]
    testo: |
      Il magazzino di pelli all'imbocco del Ponte del Conciatore brucia dal
      tetto con una fiamma bassa e grassa, e il fumo scende sul ponte invece
      di salire. Le travi del primo arco sono già nere, e se il fuoco le
      prende il ponte perde le campate fino al fiume.

      Sei arrivato con la ronda mista del pomeriggio, e Linna Varo ha ancora
      la mazza in mano. Il sergente della ronda è entrato a cercare il
      guardiano e una trave gli è caduta sulle gambe, e da dentro lo senti
      chiamare con voce calma.

      {medicina Media} Finché la voce non cambia ha ancora aria, e il fumo
      non gli è sceso nel petto.

      L'acqua è nel Torvessa sotto il ponte, e per arrivarci la catena dei
      secchi deve passare dalla scala dei Custodi. Davanti alla scala la
      sbarra della gabella è abbassata, e un Custode di Passaggio con il
      registro aperto ripete che senza gabella non passano nemmeno i secchi.

      {politica-ed-economia Facile} Il Custode ha paura che domani qualcuno
      gli chieda perché la sbarra era alzata.

      I miliziani guardano te e i Raschiatori guardano i miliziani, e Linna
      ti chiede che cosa facciamo, al plurale. *Tre cose, e una sola
      persona.* Il mantello scarlatto ti pesa addosso il doppio.
    opzioni:
      - testo: "Mettere in piedi la catena dei secchi"
        descrizione: "Miliziani e Raschiatori mescolati in fila dal fiume al tetto, che fra loro non si parlano."
        quando: [caserma.secchi == 0]
        prova: { attributo: sociale, abilita: [persuasione, intimidire], difficolta: Media }
        successo:
          titolo: La catena
          testo: |
            Metti un miliziano fra due Raschiatori e un Raschiatore fra due
            miliziani, e a chi protesta metti in mano il secchio pieno prima che
            finisca la frase. La catena parte storta e si raddrizza, e dopo dieci
            secchi nessuno guarda più il colore del mantello di chi gli sta
            accanto. La fiamma sul tetto si abbassa di un braccio.
          pe: { persuasione: 3 }
          imposta: { caserma.secchi: 1 }
          effetti: { caserma.fuoco: 1 }
        fallimento:
          titolo: I secchi per terra
          testo: |
            Per fare prima metti i miliziani da una parte e i Raschiatori
            dall'altra, e a metà scala le due mezze catene si pestano i piedi. La
            lite arriva prima dell'acqua, e quando la catena riparte il tetto è
            già crollato da un lato.
          imposta: { caserma.secchi: 2 }
          effetti: { ferite: 0.5 }

      - testo: "Tirare fuori il sergente"
        descrizione: "La trave gli è caduta sulle gambe, e ci vogliono spalle buone per il fumo."
        quando: [caserma.sergente == 0]
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Media }
        successo:
          titolo: La trave
          testo: |
            Entri con il mantello bagnato sulla testa e trovi il sergente con la
            trave sulle gambe e un fazzoletto sulla bocca. Metti la spalla sotto
            la trave finché lui sfila le gambe, e lo trascini fuori per la cintura
            mentre il soffitto viene giù a pezzi. Sulla strada ti chiede se il
            guardiano l'ha trovato qualcun altro.
          pe: { atletica: 3 }
          imposta: { caserma.sergente: 1 }
          effetti: { caserma.fuoco: 1 }
        fallimento:
          titolo: Il fumo
          testo: |
            Il fumo ti chiude la gola al terzo passo, e la trave non si muove
            finché due Raschiatori non entrano con una leva. Escono tutti
            tossendo, il sergente con una gamba storta e tu con le mani ustionate.
          imposta: { caserma.sergente: 2 }
          effetti: { ferite: 1 }

      - testo: "Alzare la sbarra con la forza"
        descrizione: "La sbarra è un palo con un lucchetto, e la Gilda si ricorderà del rapporto del Custode."
        quando: [caserma.sbarra == 0]
        esito:
          titolo: Il lucchetto
          testo: |
            Colpisci il lucchetto con la mazza di Linna, e al secondo colpo la
            sbarra si alza da sola sul contrappeso. Mentre la catena passa sotto,
            il Custode ti chiede il nome con la mano che trema, e tu glielo dici,
            perché il mantello scarlatto lo hanno visto tutti.
          imposta: { caserma.sbarra: 1 }
          effetti: { caserma.fuoco: 1, rep.gilda: -1 }

      - testo: "Convincere il Custode ad alzare la sbarra"
        descrizione: "Il Custode ha paura del registro più che del fuoco, e gli serve la riga giusta."
        quando: [caserma.sbarra == 0]
        prova: { attributo: mentale, abilita: politica-ed-economia, difficolta: Media }
        successo:
          titolo: La riga sul registro
          testo: |
            Gli chiedi il registro e scrivi tu la riga che lo fa dormire
            tranquillo, *sbarra alzata per ordine della Guardia a causa di
            incendio*, con l'ora e la tua firma. Il Custode la legge due volte
            muovendo le labbra, poi alza la sbarra e passa i secchi anche lui.
          pe: { politica-ed-economia: 3 }
          imposta: { caserma.sbarra: 1 }
          effetti: { caserma.fuoco: 1 }
        fallimento:
          titolo: Il regolamento della Gilda
          testo: |
            Il Custode ti risponde articolo per articolo e perdi il tempo di venti
            secchi, finché un Raschiatore anziano alza la sbarra con un calcio
            mentre il Custode scrive il nome di tutti.
          imposta: { caserma.sbarra: 2 }
          effetti: { rep.gilda: -0.5, sospetto: 0.5 }

      - testo: "Mandare a chiamare Varn Kett"
        descrizione: "Varn Kett è stato vent'anni nella milizia prima della Gilda, e con lui il Custode cede, ma bisogna aspettarlo."
        immagine: personaggi/varn-kett
        quando: [caserma.sbarra == 0]
        costo: 2
        esito:
          titolo: Le dita nell'aria
          testo: |
            Varn Kett arriva dalla Casa dei Nodi con il cappotto color tabacco
            abbottonato storto e muove le dita nell'aria come su una pergamena che
            vede soltanto lui. «Soccorso pubblico» dice al Custode. «Lo metti a
            carico della Guardia, e la Guardia lo paga a fine mese, come sempre.»
            La sbarra si alza, ma il fuoco intanto si è preso un'altra trave.
          imposta: { caserma.sbarra: 1 }
          effetti: { caserma.fuoco: 1, rep.gilda: 0.5 }

      - testo: "Fare la catena alla maniera dei Raschiatori"
        descrizione: "Sulle piattaforme i secchi si passano con il canto della squadra, che i miliziani imparano in fretta."
        quando: [caserma.secchi == 0, origine.apprendista-raschiatore >= 1]
        prova: { attributo: sociale, abilita: [persuasione, espressivita], difficolta: Facile }
        successo:
          titolo: Il canto della squadra
          testo: |
            Attacchi il canto dei turni della Cicatrice, e i tre Raschiatori lo
            riprendono alla seconda battuta, poi il ritmo prende anche i
            miliziani. La catena scende al fiume e risale come una cosa sola, e la
            fiamma sul tetto si abbassa di un braccio.

            {origine apprendista-raschiatore} L'ultima volta l'hai cantato sulla
            piattaforma con la tua squadra, e uno dei Raschiatori capisce da dove
            vieni senza chiedertelo.
          pe: { persuasione: 3 }
          imposta: { caserma.secchi: 1 }
          effetti: { caserma.fuoco: 1 }
        fallimento:
          titolo: Il canto stonato
          testo: |
            Attacchi il canto troppo veloce, e la catena si spezza in due ritmi
            che si pestano i piedi. Prima che riparta il tetto è crollato da un
            lato.
          imposta: { caserma.secchi: 2 }
          effetti: { ferite: 0.5 }

      - testo: "Citare al Custode la clausola dei soccorsi"
        descrizione: "Lo statuto della Gilda ha una clausola per gli incendi, che i Custodi giovani non leggono mai."
        quando: [caserma.sbarra == 0, origine.mercante-dei-ponti >= 1]
        prova: { attributo: mentale, abilita: [politica-ed-economia, accademiche], difficolta: Facile }
        successo:
          titolo: L'articolo dei soccorsi
          testo: |
            Gli citi a memoria l'articolo con il suo numero, e aggiungi che lo
            statuto l'ha firmato suo nonno, se è di famiglia Custode come sembra.
            Rosso in faccia, il Custode alza la sbarra e ricopia la clausola sul
            registro parola per parola.

            {origine mercante-dei-ponti} Tuo padre la recitava ai Custodi ogni
            volta che gli prendeva fuoco un carro, cosa che in famiglia succedeva
            più spesso del necessario.
          pe: { politica-ed-economia: 3 }
          imposta: { caserma.sbarra: 1 }
          effetti: { caserma.fuoco: 1 }
        fallimento:
          titolo: Lo statuto vecchio
          testo: |
            Il Custode ti mostra che lo statuto l'hanno rifatto l'anno scorso con
            un comma in più, e mentre lo leggete la sbarra la alza un Raschiatore
            con un calcio.
          imposta: { caserma.sbarra: 2 }
          effetti: { rep.gilda: -0.5, scandalo: 0.5 }

      - testo: "Contare i danni all'alba"
        descrizione: "Il magazzino è perduto e il ponte è ancora in piedi."
        quando: [caserma.secchi >= 1, caserma.sergente >= 1, caserma.sbarra >= 1, caserma.fuoco >= 2]
        esito:
          titolo: Il nome in rosso
          testo: |
            All'alba del magazzino restano travi nere, ma il ponte è intero, e
            contro il parapetto dormono i miliziani e i Raschiatori, mescolati
            come li avevi messi in fila. In Caserma Gasti scrive il tuo nome in
            rosso sulla lavagna dei turni, e il furiere ti consegna una lanterna
            di ronda e la chiave della branda in fondo al magazzino. Della ronda
            dell'incendio, ti dice, non sa con che cosa pagarla.
          pe: { persuasione: 5 }
          imposta: { caserma.incendio: 1 }
          effetti: { fazione.caserma: 1, oggetto.caserma-lanterna-di-ronda: 1, monete: 25, rep.caserma: 1, rep.raschiatori: 1 }
          almeno: { rep.caserma: 4 }

      - testo: "Contare i danni all'alba"
        descrizione: "Il fuoco è spento, ma il ponte ha perso tre campate e Linna ha le mani fasciate."
        quando: [caserma.secchi >= 1, caserma.sergente >= 1, caserma.sbarra >= 1, caserma.fuoco < 2]
        esito:
          titolo: Tre campate
          testo: |
            Tre campate del Ponte del Conciatore sono cadute nel fiume, e i carri
            per Laresh faranno il giro lungo per un mese. Linna nasconde le mani
            fasciate sotto le ascelle e dice che non fanno male. In Caserma Gasti
            scrive il tuo nome in rosso sulla lavagna e il furiere ti consegna la
            lanterna e la chiave della branda, ma la ronda dell'incendio non sa
            con che cosa pagarla.
          pe: { resilienza: 5 }
          imposta: { caserma.incendio: 2 }
          effetti: { fazione.caserma: 1, oggetto.caserma-lanterna-di-ronda: 1, monete: 25, tormento: 1 }
          almeno: { rep.caserma: 4 }

  # ------------------------------------------------------------ passo 7 · la paga che non arriva
  - id: caserma-la-paga-che-non-arriva
    presso: guarnigione-di-qir-azel
    immagine: ambientazione/guarnigione-di-qir-azel
    titolo: La paga che non arriva
    sommario: "Il Consiglio non vota la paga delle ronde, e qualcuno deve andare in Municipio con i conti."
    luogo: Guarnigione di Qir-Azel, il banco del furiere
    area: quartieri-alti
    requisiti: [fazione.caserma == 6]
    testo: |
      Il furiere paga le ronde dal cassetto del suo banco, una moneta alla
      volta, e su ogni ricevuta scrive *anticipo*. Il cassetto è quasi
      vuoto, e dietro di lui c'è una pila di fogli legata con lo spago, sei
      mesi di richieste al Consiglio con il timbro *rinviata* in rosso.

      «La seduta è dopodomani» dice. «Ci vuole qualcuno che vada su con i
      conti e li sappia dire. Lo sceriffo li dice come si leggono le
      condanne, e il Consiglio si offende. Gasti in Municipio non apre
      bocca.» Si pulisce gli occhiali con il lembo della camicia. «Tu hai la
      faccia nuova, e il nome in rosso sulla lavagna.»

      {percezione Facile} Le ricevute degli anticipi sono firmate tutte,
      tranne la riga del furiere. Si è pagato per ultimo, e per adesso non
      si è pagato.

      Nel cortile un miliziano in fila conta gli spiccioli che ha, e poi li
      riconta.
    opzioni:
      - testo: "Rifare i conti del furiere"
        descrizione: "Sei mesi di ronde e di cristalli da lanterna, che messi in colonna si leggono da soli."
        prova: { attributo: mentale, abilita: politica-ed-economia, difficolta: Media }
        successo:
          titolo: Una colonna sola
          testo: |
            Passi la notte al banco con il furiere, che ti corregge le somme con
            la punta della penna. All'alba hai in bella una colonna sola, con il
            costo di una notte di ronda e in fondo il debito del Consiglio
            sottolineato due volte. Il furiere te la mette in mano come un
            diploma.
          pe: { politica-ed-economia: 3 }
          segue: caserma-in-municipio
        fallimento:
          titolo: Le somme
          testo: |
            Alla terza pagina sbagli un riporto che si mangia mezza colonna, e
            all'alba il furiere rifà tutto da capo con un sospiro lungo.
          effetti: { tormento: 1 }

      - testo: "Anticipare tu la paga delle ronde"
        descrizione: "Con una borsa delle tue i miliziani mangiano da stasera, e la Caserma te la renderà."
        requisiti: [monete >= 40]
        esito:
          titolo: La ricevuta del furiere
          testo: |
            Il furiere guarda a lungo la tua borsa, poi conta le monete a
            mucchietti e ti scrive una ricevuta, *anticipo, da restituire*, con la
            prima firma sua che vedi su quel registro. Poi ti fa notare che fra
            tutti quelli in fila l'unico che non ha mai chiesto quando arriva la
            paga è Fulvio Saldo.
          imposta: { caserma.anticipo: 1 }
          effetti: { fazione.caserma: 1, monete: -40, rep.caserma: 1 }

      - testo: "Andare in Municipio senza i conti in bella"
        descrizione: "Il furiere ti dà i fogli legati con lo spago, e il resto lo dici a voce."
        costo: 2
        esito:
          titolo: Lo spago
          testo: |
            Passi la sera seduto sul bordo del pozzo a leggere i fogli legati con
            lo spago, finché sai a memoria i totali, e la mattina dopo sali la
            scalinata del Municipio con la pila sotto il braccio.
          segue: caserma-in-municipio

      - testo: "Rifare i conti come all'Accademia"
        descrizione: "All'Accademia i bilanci si fanno con il metodo delle due colonne, che Orvald Temmerin insegna con la riga sulle dita."
        quando: [origine.allievo-di-torvessa >= 1]
        prova: { attributo: mentale, abilita: [politica-ed-economia, accademiche], difficolta: Facile }
        successo:
          titolo: Le due colonne
          testo: |
            Metti in una colonna quello che la Caserma ha speso e nell'altra
            quello che il Consiglio ha rinviato, e le due colonne si guardano in
            faccia per tutta la pagina. Il furiere ti chiede se all'Accademia lo
            insegnano a chiunque o solo a chi paga la retta.

            {origine allievo-di-torvessa} Orvald diceva che un bilancio ben fatto
            è un'accusa che non alza la voce, ed era l'unica lezione in cui
            sorrideva.
          pe: { politica-ed-economia: 3 }
          segue: caserma-in-municipio
        fallimento:
          titolo: La terza colonna
          testo: |
            Il metodo funziona finché il furiere non tira fuori le spese di
            servizio, che non stanno in nessuna delle due colonne, e all'alba ti
            manda a dormire.
          effetti: { tormento: 1 }

      - testo: "Rifare i conti come al banco dei Ponti"
        descrizione: "Al Mercato dei Nodi i conti si rifanno a voce alta finché chi deve pagare non si stanca."
        quando: [origine.mercante-dei-ponti >= 1]
        prova: { attributo: mentale, abilita: [politica-ed-economia, percezione], difficolta: Facile }
        successo:
          titolo: A voce alta
          testo: |
            Rifai i conti a voce alta come al banco, e a metà notte il furiere
            risponde ai totali prima che tu li dica. All'alba sotto la colonna c'è
            la cifra che il Consiglio deve, sottolineata due volte.

            {origine mercante-dei-ponti} Tuo padre diceva che un conto detto a
            voce alta pesa il doppio di uno scritto.
          pe: { politica-ed-economia: 3 }
          segue: caserma-in-municipio
        fallimento:
          titolo: La voce roca
          testo: |
            A metà notte hai la voce roca e il furiere dorme sul registro, e
            all'alba la colonna è a metà.
          effetti: { tormento: 1 }

  - id: caserma-in-municipio
    immagine: fazioni/consiglio-di-qir-azel
    titolo: La seduta del Consiglio
    tipo: seguito
    luogo: Municipio, la sala del Consiglio
    area: quartieri-alti
    requisiti: [fazione.caserma == 6]
    testo: |
      La sala del Consiglio ha le finestre alte e un tavolo a ferro di
      cavallo, e la richiesta della Caserma è l'ultimo punto, dopo le
      fontane della piazza alta. A capotavola Julia Castaldi sfoglia la
      pratica e alza gli occhi su di te prima di chiamarti, come per
      misurarti.

      Dal lato della Gilda un consigliere dice che la Caserma spende troppo
      e conta male, e che una vigilanza dei Custodi sui suoi conti farebbe
      bene a tutti. Ha davanti un fascicolo con le cifre della Caserma.

      {ingannare Media} Il fascicolo è aperto alla pagina giusta da prima
      che tu entrassi. Qualcuno sapeva di che cosa avresti parlato.

      Julia ti dà la parola con un cenno della penna.
    opzioni:
      - testo: "Parlare al Consiglio"
        descrizione: "Una notte di ronda costa quanto una cena in questa sala, e va detto senza offendere nessuno."
        prova: { attributo: sociale, abilita: [persuasione, galateo], difficolta: Difficile }
        successo:
          titolo: Il prezzo di una notte
          testo: |
            Parli della notte dell'incendio al Ponte del Conciatore e di quanto
            sarebbe costato rifare tre campate, e solo alla fine metti il prezzo
            di una notte di ronda accanto a quello di un arco di ponte. Julia
            lascia che il silenzio lavori per lei e mette ai voti, e la paga passa
            con due voti contrari.
          pe: { persuasione: 5 }
          effetti: { fazione.caserma: 1, rep.castaldi: 0.5, rep.caserma: 1 }
        fallimento:
          titolo: Rinviata a metà
          testo: |
            Parli troppo a lungo, e il consigliere della Gilda ti interrompe con
            una domanda sui cristalli da lanterna a cui non sai rispondere. Julia
            mette ai voti metà della paga adesso e metà il mese prossimo, e il
            furiere scrive *metà* sul registro.
          effetti: { fazione.caserma: 1, scandalo: 1 }

      - testo: "Smontare il fascicolo di Ottone Malgrani"
        descrizione: "Il fascicolo glielo ha preparato il Maniero di Ottone, e da qualche parte è sbagliato."
        immagine: personaggi/ottone-malgrani
        quando: [pista.pelle < 6]
        prova: { attributo: mentale, abilita: [percezione, politica-ed-economia], difficolta: Media }
        successo:
          titolo: Il mese sbagliato
          testo: |
            Le cifre del fascicolo sono giuste ma vengono dal mese della razzia,
            quando la Caserma ha comprato in una settimana le lance di un anno, e
            lo dici con la data. Ottone Malgrani, in fondo alla sala, se ne va
            prima del voto, e la paga passa.

            {politica-ed-economia Media} Voleva la Caserma sotto i Custodi della
            Gilda, cioè sotto di sé, e il tuo nome se lo ricorderà.
          pe: { percezione: 5 }
          effetti: { fazione.caserma: 1, rep.castaldi: 0.5, rep.caserma: 1, rep.malgrani: -1 }
        fallimento:
          titolo: Le lance
          testo: |
            Non trovi l'errore, perché è nella data e tu guardi le somme. Il
            consigliere chiude il fascicolo sorridendo. Julia fa passare metà
            della paga, e dal fondo della sala Ottone Malgrani ti guarda uscire.
          effetti: { fazione.caserma: 1, scandalo: 1 }

      - testo: "Proporre di pagare la Guardia con le licenze del grano"
        descrizione: "Le licenze nuove del grano rendono, e una parte potrebbe andare alle ronde che le fanno rispettare."
        quando: [pista.pelle >= 6]
        prova: { attributo: mentale, abilita: politica-ed-economia, difficolta: Media }
        successo:
          titolo: Le licenze
          testo: |
            Dici che senza le ronde le licenze del grano sono carta, perché i
            mulini delle cooperative li controlla la Guardia, e chi controlla deve
            mangiare. Julia prende un appunto a margine, e la paga passa a carico
            delle licenze, la prima entrata della Caserma che non dipende
            dall'umore del Consiglio.

            {politica-ed-economia Facile} Ci aveva già pensato, e le mancava
            qualcuno che lo dicesse al posto dei Castaldi.
          pe: { politica-ed-economia: 5 }
          effetti: { fazione.caserma: 1, rep.castaldi: 0.5, rep.caserma: 1 }
        fallimento:
          titolo: La ricostruzione
          testo: |
            Il consigliere della Gilda risponde che le licenze servono a
            ricostruire la Città Bassa, e Julia fa passare metà della paga.
          effetti: { fazione.caserma: 1, scandalo: 1 }

      - testo: "Aspettare la seduta del mese dopo"
        descrizione: "Si torna con la stessa richiesta, e intanto la Caserma tira la cinghia."
        costo: 2
        esito:
          titolo: Un mese
          testo: |
            Torni il mese seguente con la stessa pila di fogli e qualche ricevuta
            in più, e la paga passa senza discussione, perché i consiglieri hanno
            altro per la testa. Il furiere la conta sul banco moneta per moneta.
          effetti: { fazione.caserma: 1 }

      - testo: "Parlarne a cena dai Castaldi, la sera prima"
        descrizione: "Nei Quartieri Alti un voto si ottiene la sera prima, a tavola."
        quando: [origine.rampollo-dei-quartieri-alti >= 1]
        prova: { attributo: sociale, abilita: [galateo, persuasione], difficolta: Media }
        successo:
          titolo: Il secondo piatto
          testo: |
            A cena dai Castaldi nomini la Caserma solo al secondo piatto, di
            passaggio, come una cosa che ti hanno raccontato, e Julia finge di non
            sentire. La mattina dopo mette ai voti la paga prima delle fontane, e
            passa senza discussione.

            {origine rampollo-dei-quartieri-alti} Tua madre faceva lo stesso con i
            fornitori, e ti ritrovi a usare perfino il suo tono.
          pe: { persuasione: 5 }
          effetti: { fazione.caserma: 1, rep.castaldi: 0.5, rep.caserma: 1 }
        fallimento:
          titolo: Il piatto sbagliato
          testo: |
            Nomini la Caserma già al primo piatto e a tavola cala un gelo cortese,
            e la mattina dopo Julia fa passare solo metà della paga.
          effetti: { fazione.caserma: 1, scandalo: 1 }

  # ------------------------------------------------------------ passo 8 · il miliziano con la tosse
  - id: caserma-il-miliziano-con-la-tosse
    presso: caserma-casa-blu
    immagine: ambientazione/citta-bassa
    titolo: Il miliziano con la tosse
    sommario: "Fulvio Saldo non chiede mai quando arriva la paga, e oggi ha chiesto un altro permesso."
    luogo: Città Bassa, la casa di pietra blu
    area: citta-bassa
    requisiti: [fazione.caserma == 7]
    testo: |
      Contando la paga sul banco, il furiere ti ha fatto notare che in tutto
      il mese di ritardo l'unico a non chiedergli mai quando arrivava era
      Fulvio Saldo.

      Alla casa blu Fulvio tossisce nella sciarpa e chiede il permesso per il
      pomeriggio, perché il figlio piccolo ha la febbre. Ha moglie e due
      figli in Via del Salmone, e lo sa tutta la Città Bassa. Brina lo guarda
      uscire con il mestolo fermo a mezz'aria.

      {conoscenze-della-strada Media} Un miliziano con un debito di carte con
      gli Scuri non deve fare niente di grave. Gli basta guardare da un'altra
      parte all'ora giusta, e vendere i suoi turni.

      Sul registro dei turni, che ormai tieni tu, quest'anno i permessi di
      Fulvio sono trentadue crocette, e il figlio piccolo, a contarli, ha la
      febbre ogni dieci giorni.
    opzioni:
      - testo: "Seguirlo durante il permesso"
        descrizione: "Fulvio esce verso Via del Salmone, e bisogna vedere se ci arriva."
        prova: { attributo: fisico, abilita: furtivita, difficolta: Media }
        successo:
          titolo: La bettola dell'Orlo
          testo: |
            Fulvio passa davanti a Via del Salmone senza girare e scende verso
            l'Orlo dei Rottami con il mantello piegato sotto il braccio. In una
            bettola con la porta bassa si siede a un tavolo dove c'è già un uomo
            con il cappuccio, e gli spinge davanti un foglio piegato.
          pe: { furtivita: 3 }
          segue: caserma-il-debito-di-fulvio
        fallimento:
          titolo: Via del Salmone
          testo: |
            Al secondo vicolo Fulvio ti vede riflesso in una vetrina, e va dritto
            a casa in Via del Salmone, dove dalla finestra lo vedi sedersi accanto
            al letto di un bambino con la febbre vera.
          effetti: { tormento: 1 }

      - testo: "Farlo parlare alla casa blu, prima che esca"
        descrizione: "Una porta chiusa e trentadue crocette sul registro dei turni."
        prova: { attributo: sociale, abilita: [empatia, intimidire], difficolta: Media }
        successo:
          titolo: Trentadue
          testo: |
            Chiudi la porta e gli metti davanti il registro aperto alla pagina
            delle crocette. Arrivato a venti Fulvio si toglie la sciarpa, e sotto
            ha la faccia di un uomo che non dorme da mesi. Dice che non è come
            pensi, e poi ti racconta che è esattamente come pensi.
          pe: { empatia: 3 }
          segue: caserma-il-debito-di-fulvio
        fallimento:
          titolo: La febbre
          testo: |
            Fulvio ti parla della febbre del figlio e del medico troppo caro, e se
            ne va con il permesso firmato mentre tu resti con la sensazione di
            avere sbagliato domanda.
          effetti: { tormento: 1 }

      - testo: "Mettergli davanti Nando"
        descrizione: "Nando l'ha visto sotto il Ponte delle Mille Corde, e davanti a lui la febbre non regge."
        costo: 2
        esito:
          titolo: Il testimone
          testo: |
            Fai sedere Nando sulla panca della casa blu con una mela in mano, e
            quando Fulvio rientra e lo vede si ferma sulla porta. Si guardano a
            lungo, poi Fulvio si siede dall'altra parte della panca e si abbassa
            la sciarpa.
          segue: caserma-il-debito-di-fulvio

  - id: caserma-il-debito-di-fulvio
    immagine: ambientazione/orlo-dei-rottami
    titolo: Il debito di Fulvio Saldo
    tipo: seguito
    luogo: Città Bassa, una bettola dell'Orlo dei Rottami
    area: citta-bassa
    requisiti: [fazione.caserma == 7]
    testo: |
      Fulvio racconta guardando il tavolo. Il debito è cominciato tre anni
      fa con una partita di Zekar alla Pignatta ed è cresciuto da solo, come
      i debiti degli Scuri. Lui non ha fatto male a nessuno, ha guardato da
      un'altra parte quando glielo dicevano e ha venduto i turni della casa
      blu, e ogni turno valeva una riga in meno sul debito.

      {percezione Media} Il foglio piegato è il registro dei turni della
      settimana, ricopiato con la sua grafia lenta. Ci ha messo anche la tua
      ronda.

      «Di altri non so niente» dice, prima che tu lo chieda. «Io portavo il
      foglio e prendevo la riga, e chi c'era sopra di me mi guardavo bene
      dal chiederlo.» Si stringe la sciarpa fra le mani e dice che ha due
      figli.

      *Un nome solo, e la Caserma ne ha cento.* Il rapporto, comunque vada,
      finisce sul tavolo dello sceriffo.
    opzioni:
      - testo: "Arrestarlo"
        descrizione: "Le celle della Caserma e poi un processo, se Fulvio arriva vivo a testimoniare."
        esito:
          titolo: Le manette
          testo: |
            Lungo la strada verso la Caserma Fulvio non tossisce mai, e davanti a
            Via del Salmone tiene gli occhi a terra. Il furiere lo scrive sul
            registro delle celle, con sotto, a matita, il nome della moglie. Entro
            sera in Città Bassa si sa che alla casa blu hanno preso uno degli
            Scuri, e per gli Scuri un miliziano in cella è uno che può parlare.
          pe: { resilienza: 3 }
          imposta: { caserma.saldo: 1 }
          effetti: { fazione.caserma: 1, rep.scuri: -1, rep.caserma: 0.5, informazioni.segreto: 1 }

      - testo: "Girarlo perché riferisca a te"
        descrizione: "Fulvio continua a portare il foglio che scrivi tu, e ti dice chi glielo chiede."
        prova: { attributo: sociale, abilita: [persuasione, intimidire], difficolta: Media }
        successo:
          titolo: Il foglio giusto
          testo: |
            Gli spieghi come funzionerà, piano, perché capisca ogni parola. Ogni
            settimana il foglio dei turni lo scrivi tu, e lui, dopo averlo portato
            al tavolo dell'Orlo, ti dice chi lo ha preso. Dopo averci pensato a
            lungo Fulvio annuisce, e quando te ne vai non tossisce più.

            {ingannare Media} Un uomo che ha venduto i turni una volta può vendere
            anche te, e adesso dovete fare finta di fidarvi.
          pe: { persuasione: 3 }
          imposta: { caserma.saldo: 2 }
          effetti: { fazione.caserma: 1, rep.caserma: 0.5, informazioni.segreto: 1 }
        fallimento:
          titolo: La paura più grande
          testo: |
            Fulvio diventa grigio, perché degli Scuri ha più paura che della
            Caserma. Ti chiede di arrestarlo, perché in cella almeno sa dove sta,
            e il furiere scrive il suo nome sul registro delle celle.
          imposta: { caserma.saldo: 1 }
          effetti: { fazione.caserma: 1, rep.scuri: -1, informazioni.segreto: 1, tormento: 0.5 }

      - testo: "Pagare il suo debito e lasciarlo andare"
        descrizione: "Una borsa delle tue al tavolo degli Scuri chiude il debito di Fulvio, in cambio di una ricevuta."
        requisiti: [monete >= 30]
        esito:
          titolo: La ricevuta con la croce
          testo: |
            Al tavolo dell'Orlo paghi all'uomo con il cappuccio il debito di
            Fulvio fino all'ultima riga, e lui firma la ricevuta con una croce.
            Fulvio la legge tre volte, poi ti dice che se un giorno ti serve una
            porta aperta lui sa quali porte si aprono.

            {conoscenze-della-strada Media} Hai comprato un uomo in contanti, che
            in Città Bassa è il modo più sicuro e il più caro.
          pe: { empatia: 3 }
          imposta: { caserma.saldo: 3 }
          effetti: { fazione.caserma: 1, monete: -30 }

      - testo: "Rispondere al ricatto di Fulvio"
        descrizione: "Fulvio ti ha visto al tavolo degli Scuri alla Pignatta, e se cade lui, dice, cadi anche tu."
        immagine: fazioni/scuri
        quando: [rep.scuri >= 3, pista.pelle < 6]
        prova: { attributo: sociale, abilita: ingannare, difficolta: Difficile }
        successo:
          titolo: Per servizio
          testo: |
            Gli dici con aria annoiata che alla Pignatta ci andavi per servizio e
            che lo sceriffo lo sa da sempre, e Fulvio ci crede perché è la sola
            cosa che gli conviene credere. Accetta di riferire a te.

            {ingannare Difficile} La bugia regge perché non l'hai difesa, e se
            avessi alzato la voce ci avrebbe visto dentro.
          pe: { ingannare: 5 }
          imposta: { caserma.saldo: 2 }
          effetti: { fazione.caserma: 1, rep.caserma: 0.5, informazioni.segreto: 1 }
        fallimento:
          titolo: Le sere alla Pignatta
          testo: |
            Fulvio ride, per la prima volta, e ti elenca le sere con i nomi di chi
            c'era. Lo porti in cella lo stesso, e il giorno dopo Galdrick ha sul
            taccuino le tue sere alla Pignatta, scritte con la grafia lenta di
            Fulvio.
          imposta: { caserma.saldo: 1 }
          effetti: { fazione.caserma: 1, rep.scuri: -1, sospetto: 1.5, informazioni.segreto: 1 }
