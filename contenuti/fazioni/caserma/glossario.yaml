# Glossario della quest della Caserma: i personaggi nuovi che compaiono nei testi di contenuti/fazioni/caserma/.
# Presentazioni generali, senza segreti né cose che il giocatore scopre giocando (formato di glossario/personaggi.yaml).
glossario:
  - id: duilio-gasti
    nome: Duilio Gasti
    alias: [Gasti]
    tipo: personaggio
    sottotitolo: "Sergente d'addestramento della Caserma"
    testo: "Sergente d'addestramento della Caserma di Qir-Azel, tarchiato, con una voce che arriva fino alle mura. Nel cortile conta ad alta voce e ricomincia da uno a ogni errore. Quando lo sceriffo è fuori città comanda lui, e malvolentieri."
    requisiti: []

  - id: bruno-lesca
    nome: Bruno Lesca
    tipo: personaggio
    sottotitolo: "Miliziano della Caserma, morto nella razzia"
    testo: "Miliziano della Guardia di Qir-Azel, morto a ventidue anni sulle mura la notte della razzia del Festival. Sua madre abita in fondo alla discesa della Caserma, e il suo mantello rammendato è già passato a un altro."
    requisiti: []

  - id: fulvio-saldo
    nome: Fulvio Saldo
    alias: [Fulvio]
    tipo: personaggio
    sottotitolo: "Miliziano della casa di pietra blu"
    testo: "Miliziano del posto di guardia della Caserma in Città Bassa, con la sciarpa fino al naso e una tosse che compare quando c'è un sergente a sentirla. Ha moglie e due figli in Via del Salmone."
    requisiti: []

  - id: nando-rizza
    nome: Nando Rizza
    alias: [Nando]
    tipo: personaggio
    sottotitolo: "Facchino dei Ponti Sospesi"
    testo: "Facchino di quattordici anni che porta gerle fra il Mercato dei Nodi e il Ponte delle Mille Corde. Dorme quasi sempre nelle reti sotto le assi, e conosce i sottoponti come le sue tasche, che sono vuote."
    requisiti: []

  - id: brina
    nome: Brina
    tipo: personaggio
    sottotitolo: "Sguattera della casa di pietra blu"
    testo: "Sguattera minuta del posto di guardia della Caserma in Città Bassa, sempre con le maniche arrotolate. Viene da Ghoran e non ne parla. Fa la zuppa per i miliziani e per i detenuti con lo stesso mestolo."
    requisiti: []

  - id: ulmo-strass
    nome: Ulmo Strass
    alias: [Pesatore, Strass]
    tipo: personaggio
    sottotitolo: "Il Pesatore di Ghoran"
    testo: "Uomo di Ghoran grosso e lento, detto il Pesatore. Per anni ha pesato gli schiavi al mercato dei recinti sulla bilancia da grano che si porta ancora dietro, e adesso riporta ai clan chi dai recinti è scappato."
    requisiti: []

  - id: brando-selli
    nome: Brando Selli
    alias: [Brando, Selli]
    tipo: personaggio
    sottotitolo: "Sergente dei Ponti"
    testo: "Sergente della Guardia ai Ponti Sospesi, con vent'anni di servizio e i baffi corti da regolamento. Sa a memoria i turni di tutti, e con lui i conti dei Custodi di Passaggio tornano sempre."
    requisiti: []
