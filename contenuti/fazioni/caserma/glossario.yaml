# Glossario della quest della Caserma: i personaggi nuovi che compaiono nei testi di contenuti/fazioni/caserma/.
# Presentazioni generali, senza segreti né cose che il giocatore scopre giocando (formato di glossario/personaggi.yaml).
glossario:
  - id: duilio-gasti
    nome: Duilio Gasti
    alias: [Gasti]
    tipo: personaggio
    sottotitolo: "Sergente d'addestramento della Caserma"
    testo: "Sergente d'addestramento della Caserma di Qir-Azel, un uomo tarchiato con la voce che arriva fino alle mura. Nel cortile conta ad alta voce, e quando una recluta sbaglia ricomincia da uno. Quando lo sceriffo è fuori città comanda lui, e lo fa malvolentieri, perché le carte gli piacciono meno dei manichini."
    requisiti: []

  - id: bruno-lesca
    nome: Bruno Lesca
    tipo: personaggio
    sottotitolo: "Miliziano della Caserma, morto nella razzia"
    testo: "Miliziano della Guardia di Qir-Azel, morto sulle mura la notte della razzia del Festival. Aveva ventidue anni e una madre che abita in fondo alla discesa della Caserma. Il suo mantello scarlatto è tornato in magazzino con un rammendo sulla spalla, e il furiere l'ha dato a un altro."
    requisiti: []

  - id: fulvio-saldo
    nome: Fulvio Saldo
    alias: [Fulvio]
    tipo: personaggio
    sottotitolo: "Miliziano della casa di pietra blu"
    testo: "Miliziano del posto di guardia della Caserma in Città Bassa, con la sciarpa tirata fino al naso e una tosse che compare quando c'è un sergente a sentirla. Ha moglie e due figli in Via del Salmone, e chiede permessi più spesso di chiunque altro."
    requisiti: []

  - id: nando-rizza
    nome: Nando Rizza
    alias: [Nando]
    tipo: personaggio
    sottotitolo: "Facchino dei Ponti Sospesi"
    testo: "Facchino di quattordici anni che porta gerle fra il Mercato dei Nodi e il Ponte delle Mille Corde, più svelto dei carretti e meno caro. Dorme dove capita, quasi sempre nelle reti sotto le assi, e conosce i sottoponti come le sue tasche, che sono vuote."
    requisiti: []

  - id: brina
    nome: Brina
    tipo: personaggio
    sottotitolo: "Sguattera della casa di pietra blu"
    testo: "Sguattera del posto di guardia della Caserma in Città Bassa, una donna minuta con le maniche sempre arrotolate. Viene da Ghoran e non ne parla. Fa la zuppa per i miliziani e anche per i detenuti delle due celle, con lo stesso mestolo e la stessa porzione."
    requisiti: []

  - id: ulmo-strass
    nome: Ulmo Strass
    alias: [Pesatore, Strass]
    tipo: personaggio
    sottotitolo: "Il Pesatore di Ghoran"
    testo: "Uomo di Ghoran grosso e lento nei modi, che tutti chiamano il Pesatore. Per anni ha pesato gli schiavi al mercato dei recinti, sulla bilancia da grano che si porta ancora dietro sul carro. Adesso lavora per i clan, e riporta indietro chi dai recinti è scappato."
    requisiti: []

  - id: brando-selli
    nome: Brando Selli
    alias: [Brando, Selli]
    tipo: personaggio
    sottotitolo: "Sergente dei Ponti"
    testo: "Sergente della Guardia ai Ponti Sospesi, con vent'anni di servizio e i baffi tagliati corti come vuole il regolamento. I miliziani giovani lo rispettano perché sa a memoria i turni di tutti, e i Custodi di Passaggio perché alla fine del mese i conti con lui tornano sempre."
    requisiti: []
