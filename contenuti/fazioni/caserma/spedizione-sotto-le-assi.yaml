# La quest della Caserma, passo 5 (fazione.caserma == 4): «Sotto le assi», spedizione nei sottoponti sotto il Ponte
# delle Mille Corde, a cercare Nando Rizza prima che lo trovino quelli che lo cercano.
# Ci si entra da caserma-sotto-le-assi (Ponti Sospesi, ripetibile finché il passo è aperto): con Gaia se gaia >= 2,
# pagandola, oppure da soli. Ritorno ai Ponti Sospesi, soglia 3, tre stanze alla volta.
# Fasce di profondità: 0 la scala di corda, i teli cerati, il braciere di Mamma Tesh; 0-1 il vento; 1 le reti del
# Mercato, il tavolato marcio; 1-2 i mutati della Marea; 2 le travi maestre, il tagliagole. Il cuore (3) è la rete
# sotto il Mercato, con due uomini che ne tagliano le corde (combattimento Medio, oppure la trave, Difficile); poi
# il seguito decide dove mettere Nando al sicuro (caserma.nando) e chiude il passo.
aree:
  - id: caserma-sotto-le-assi
    immagine: ambientazione/ponti-sospesi
    nome: Sotto le assi
    sommario: "Il paese di reti e teli cerati appeso sotto il Ponte delle Mille Corde, dove la Guardia non scende mai."
    spedizione: { ritorno: ponti-sospesi, soglia: 3, stanze: 3 }
    testo: |
      Sotto il tavolato del Ponte delle Mille Corde c'è un secondo ponte che
      nessuno ha progettato, fatto di reti da pesca annodate fra le travi e
      di ripari di tela cerata, dove vive chi di sopra non ha un posto. Si
      passa da una rete all'altra su scale di corda e passerelle larghe un
      piede, con il vuoto della Cicatrice sotto.

storylet:
  # ------------------------------------------------------------ l'ingresso, ai Ponti Sospesi
  - id: caserma-sotto-le-assi
    presso: ponte-delle-mille-corde
    immagine: ambientazione/ponti-sospesi
    titolo: Sotto le assi
    sommario: "Il facchino della casa blu dorme nelle reti sotto il Ponte delle Mille Corde, e qualcuno lo cerca."
    luogo: Ponte delle Mille Corde, il terzo pilone dopo il gabbiotto dei Custodi
    area: ponti-sospesi
    ripetibile: true
    requisiti: [fazione.caserma == 4]
    testo: |
      Il terzo pilone dopo il gabbiotto dei Custodi ha una scala di corda
      legata al parapetto, che scende fra le travi verso l'odore di catrame e
      il cigolio delle reti.

      Seduta sul parapetto c'è una ragazzina dal cappuccio blu, Gaia Acari,
      che mangia una mela torsolo compreso. Nando lo conosce, ti dice, dorme
      nella rete grande sotto il Mercato dei Nodi, e da stamattina due uomini
      chiedono di lui a tutti i bracieri.

      {origine figlio-della-citta-bassa} Qui sotto hai dormito anche tu per un
      inverno, e le mani ricordano il nodo della scala che scivola.
    opzioni:
      - testo: "Farsi guidare da Gaia"
        descrizione: "Per un pasto caldo e nessuna domanda Gaia ti porta dove serve."
        immagine: personaggi/gaia-acari
        quando: [gaia >= 2]
        esito:
          titolo: La guida
          testo: |
            Gaia butta il torsolo nel vuoto e scende per prima, dicendoti a ogni
            nodo chi l'ha fatto. Alla prima rete ti chiede soltanto se al Grifone
            c'è lo stufato.
          vai: caserma-sotto-le-assi

      - testo: "Pagare Gaia perché ti guidi"
        descrizione: "Gaia ti guarda il mantello e ti fa un prezzo da Guardia."
        immagine: personaggi/gaia-acari
        quando: [gaia < 2]
        requisiti: [monete >= 5]
        esito:
          titolo: Il prezzo da Guardia
          testo: |
            Gaia conta le monete due volte e le fa sparire nel cappuccio, poi scende
            per prima e ti aspetta a ogni nodo. Alla prima rete ti avverte che il
            prezzo comprende la discesa, e per la salita si vedrà.
          effetti: { monete: -5 }
          vai: caserma-sotto-le-assi

      - testo: "Scendere da solo"
        descrizione: "La scala è lì, e nessuno ti dirà dove mettere i piedi."
        costo: 2
        esito:
          titolo: La scala che scivola
          testo: |
            La scala gira su se stessa a ogni piolo e a metà un nodo scivola di un
            palmo, lasciandoti appeso. Arrivi alla prima rete con le mani segnate
            dalla corda.
          vai: caserma-sotto-le-assi

      - testo: "Scendere dal lato dei bambini"
        descrizione: "Sul pilone ci sono le tacche che usano i bambini, e le hai usate anche tu."
        quando: [origine.figlio-della-citta-bassa >= 1]
        costo: 2
        esito:
          titolo: Le tacche
          testo: |
            Le tacche nel pilone ci sono ancora, più consumate di come le ricordi.
            Alla prima rete Gaia ti chiede da che rete venivi, perché quella
            strada la conoscono solo quelli di sotto.
          vai: caserma-sotto-le-assi

  # ------------------------------------------------------------ 0 · le prime reti
  - id: caserma-assi-la-scala-di-corda
    immagine: ambientazione/ponti-sospesi
    titolo: La seconda scala
    sommario: "Dalla prima rete una seconda scala scende verso le travi del Mercato, tirata su a metà."
    luogo: Sotto le assi, la prima rete
    area: caserma-sotto-le-assi
    ripetibile: true
    requisiti: [fazione.caserma == 4, profondita.caserma-sotto-le-assi == 0]
    testo: |
      La prima rete è larga come una stanza, con le camicie da facchino stese
      ad asciugare. La seconda scala, verso le travi del Mercato dei Nodi, è
      tirata su a metà e legata a un anello di ferro, e un vecchio seduto su
      una cassa ti guarda con le mani in grembo.

      {acrobazia Media} La rete regge, se ti tieni ai nodi e non alle maglie
      rammendate.
    opzioni:
      - testo: "Calarsi lungo la rete"
        descrizione: "Nodo dopo nodo, con il vuoto sotto, per la strada più corta."
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Media }
        successo:
          titolo: Nodo dopo nodo
          testo: |
            Ti cali tenendoti ai nodi e in fondo trovi una trave con tutti e due i
            piedi, mentre dall'alto il vecchio ti approva con il mento.
          effetti: { profondita.caserma-sotto-le-assi: 1 }
        fallimento:
          titolo: Le maglie
          testo: |
            Afferri una maglia invece di un nodo, e la maglia si apre. Ti fermi
            con il gomito incastrato e risali sulla rete larga, dove il vecchio
            non si è mosso.
          effetti: { ferite: 0.5 }

      - testo: "Chiedere al vecchio come si slega"
        descrizione: "Il vecchio sa benissimo come si slega quel nodo."
        prova: { attributo: sociale, abilita: [empatia, persuasione], difficolta: Media }
        successo:
          titolo: Il nodo al contrario
          testo: |
            Il vecchio vuole sapere se il mantello tiene la pioggia, e glielo fai
            toccare. Poi si alza dalla cassa con un rumore di ginocchia e slega il
            nodo con due dita, e la scala si srotola fino alle travi.
          effetti: { profondita.caserma-sotto-le-assi: 1 }
        fallimento:
          titolo: La cassa
          testo: |
            Il vecchio ti dà le spalle, e provi il nodo da solo fino a romperti le
            unghie mentre lui fischietta.
          effetti: { tormento: 1 }

      - testo: "Fare il giro dalla rete accanto"
        descrizione: "C'è un'altra strada, più lunga, attraverso i ripari dei vicini."
        costo: 2
        esito:
          titolo: Il giro lungo
          testo: |
            Passi di rete in rete chiedendo permesso a ogni riparo come in un
            condominio, e arrivi alle travi del Mercato da un'altra parte con un
            sorso di brodo in corpo e i polpacci di pietra.
          effetti: { profondita.caserma-sotto-le-assi: 1 }

  - id: caserma-assi-i-teli-cerati
    immagine: ambientazione/ponti-sospesi
    titolo: I teli cerati
    sommario: "Una fila di ripari di tela cerata chiude il passaggio, e dietro ogni tela c'è qualcuno."
    luogo: Sotto le assi, i ripari di tela cerata
    area: caserma-sotto-le-assi
    ripetibile: true
    requisiti: [fazione.caserma == 4, profondita.caserma-sotto-le-assi == 0]
    testo: |
      Una fila di ripari di tela cerata cuciti l'uno all'altro chiude il
      passaggio fra due travi, e sul telo del primo è cucito un avanzo di
      mantello della Guardia. Quando ti avvicini, il russare dietro la tela
      si interrompe.

      {empatia Media} La stoffa buona non si butta, e quaggiù la Guardia si
      incontra soltanto quando ha già buttato via qualcosa.
    opzioni:
      - testo: "Chiedere il permesso di passare"
        descrizione: "Sotto le assi si chiede permesso come in una casa."
        prova: { attributo: sociale, abilita: [galateo, empatia], difficolta: Media }
        successo:
          titolo: Permesso
          testo: |
            Bussi sul palo del primo riparo come su uno stipite, e una donna ti fa
            passare in mezzo alla sua casa. Gli altri ripari si scostano uno dopo
            l'altro, e dall'ultimo un uomo ti dice che la rete di Nando è sotto il
            Mercato.
          effetti: { profondita.caserma-sotto-le-assi: 1, informazioni.voce: 1 }
        fallimento:
          titolo: La tela chiusa
          testo: |
            Chiedi permesso con la voce della Guardia, che quaggiù suona come un
            ordine, e da una tela esce un braccio che ti vuota un secchio sugli
            stivali.
          effetti: { scandalo: 1 }

      - testo: "Passare dietro i ripari, sulla trave"
        descrizione: "Dietro le tende corre una trave libera, appena più larga di un piede."
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Media }
        successo:
          titolo: Dietro le tele
          testo: |
            Giri dietro i ripari sulla trave, con la tela cerata che ti sfiora la
            spalla e il vuoto dall'altra parte. Nessuno sa che sei passato, tranne
            un gatto che ti segue con la coda alta.
          effetti: { profondita.caserma-sotto-le-assi: 1 }
        fallimento:
          titolo: Il palo
          testo: |
            A metà trave urti un palo e un riparo intero si affloscia sui suoi
            abitanti, e una scarpa ti prende alla nuca mentre torni indietro.
          effetti: { ferite: 0.5 }

      - testo: "Aspettare che il passaggio si svuoti"
        descrizione: "Prima o poi quelli dei ripari escono a prendere l'acqua."
        costo: 2
        esito:
          titolo: L'ora dell'acqua
          testo: |
            Verso sera la gente esce con i secchi verso la scala, e tu passi fra
            le tende vuote e le pentole sul fuoco spento. Un bambino rimasto di
            guardia ti guarda passare e non dice niente.
          effetti: { profondita.caserma-sotto-le-assi: 1 }

  - id: caserma-assi-il-braciere
    immagine: ambientazione/ponti-sospesi
    titolo: Il braciere di Mamma Tesh
    sommario: "Sulla piattaforma più larga brucia un braciere fatto con un elmo rovesciato, e intorno al fuoco si paga."
    luogo: Sotto le assi, la piattaforma di Mamma Tesh
    area: caserma-sotto-le-assi
    ripetibile: true
    requisiti: [fazione.caserma == 4, profondita.caserma-sotto-le-assi == 0]
    testo: |
      Sulla piattaforma più larga brucia un braciere ricavato da un elmo
      rovesciato, con una dozzina di persone intorno. Lo attizza Mamma Tesh,
      una donna piccola con le mani annerite, che vedendoti dice all'elmo di
      fare meno fumo.

      «Intorno al Capitano si paga con una storia o con un favore, e se
      proprio ci tieni con le monete» dice, battendo il ferro sull'elmo. Di
      là dal fuoco un uomo racconta di due forestieri che hanno chiesto di
      un ragazzino con la gerla.

      {origine figlio-della-citta-bassa} Da bambino pagavi questo fuoco con
      le storie di tuo padre, e Mamma Tesh se ne ricorda.
    opzioni:
      - testo: "Pagare con una storia"
        descrizione: "Intorno al braciere vince chi fa ridere o chi fa stare zitti tutti."
        prova: { attributo: sociale, abilita: [espressivita, ingannare], difficolta: Media }
        successo:
          titolo: La storia del prosciutto
          testo: |
            Racconti del furiere che dà la ricevuta anche per la paglia dei
            manichini, e Mamma Tesh ride più di tutti, a bocca chiusa. L'uomo
            dall'altra parte del fuoco ti dice che i due forestieri sono andati
            verso la rete grande.
          effetti: { profondita.caserma-sotto-le-assi: 1, informazioni.voce: 1 }
        fallimento:
          titolo: La storia lunga
          testo: |
            La tua storia finisce in un punto dove nessuno ride. Mamma Tesh ti
            lascia scaldare le mani e poi ti indica la scala da cui sei venuto.
          effetti: { tormento: 1 }

      - testo: "Pagare con qualche moneta"
        descrizione: "Mamma Tesh le prende, anche se per lei è il modo più triste di pagare."
        requisiti: [monete >= 3]
        esito:
          titolo: Il modo triste
          testo: |
            Mamma Tesh fa sparire le monete con il sospiro di una nonna a cui
            hanno portato un regalo comprato, poi ti indica la passerella verso il
            Mercato e ti dice di tenerti a destra, dove le assi sono nuove.
          effetti: { profondita.caserma-sotto-le-assi: 1, monete: -3 }

      - testo: "Promettere un favore"
        descrizione: "Un favore da Guardia vale qualcosa, quaggiù."
        costo: 2
        esito:
          titolo: Il favore
          testo: |
            Mamma Tesh ci pensa a lungo mescolando le braci, poi ti chiede di far
            togliere la catena che la Gilda ha messo all'imbocco della scala nord.
            Le dici che ci proverai, e lei annuisce come se l'avessi già fatto.
          effetti: { profondita.caserma-sotto-le-assi: 1 }

  # ------------------------------------------------------------ 0–1 · il vento
  - id: caserma-assi-il-vento
    immagine: ambientazione/cicatrice-del-mondo
    titolo: Il vento dalla Cicatrice
    sommario: "Una raffica sale dalla Cicatrice e fa ballare le reti come lenzuola stese."
    luogo: Sotto le assi, una passerella scoperta
    area: caserma-sotto-le-assi
    ripetibile: true
    requisiti: [fazione.caserma == 4, profondita.caserma-sotto-le-assi <= 1]
    testo: |
      Sulla passerella scoperta fra due piloni il vento freddo sale dalla
      Cicatrice a raffiche, e a ogni raffica le reti si gonfiano come
      lenzuola e la passerella ondeggia di un palmo. In mezzo qualcuno ha
      legato un nastro rosso al corrimano.

      {natura Media} Le raffiche vengono a gruppi di tre, con una pausa lunga
      dopo la terza, ed è nella pausa che si passa.
    opzioni:
      - testo: "Passare nella pausa fra le raffiche"
        descrizione: "Si conta fino alla terza raffica e si parte."
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Media }
        successo:
          titolo: Dopo la terza
          testo: |
            Dopo la terza raffica parti, con la passerella ferma come un
            pavimento, e la prima raffica del gruppo dopo ti prende alle spalle
            quando sei già al pilone.
          effetti: { profondita.caserma-sotto-le-assi: 1 }
        fallimento:
          titolo: La quarta
          testo: |
            Dopo la terza raffica ne arriva una quarta, e resti appeso al
            corrimano con le gambe nel vuoto finché una mano dal pilone ti tira su
            per la cintura. Quando ti giri a ringraziare c'è soltanto una gerla
            appoggiata.
          effetti: { ferite: 0.5, tormento: 1 }

      - testo: "Attraversare carponi, legato al corrimano"
        descrizione: "Con la cintura passata nel corrimano si va piano, però si arriva."
        costo: 2
        esito:
          titolo: Carponi
          testo: |
            Attraversi carponi facendo scorrere la cintura sul corrimano un palmo
            alla volta, e arrivi con le ginocchia piene di schegge e un rispetto
            nuovo per chi ci passa ogni giorno con la gerla.
          effetti: { profondita.caserma-sotto-le-assi: 1 }

      - testo: "Chiedere a chi passa di tenerti la corda"
        descrizione: "I facchini passano di qui con la gerla piena, e uno, per poco, ti tiene."
        prova: { attributo: sociale, abilita: [persuasione, conoscenze-della-strada], difficolta: Facile }
        successo:
          titolo: La corda del facchino
          testo: |
            Un facchino ti lega una corda alla vita e ti dice di guardare il
            nastro rosso e mai i piedi. Arrivi dall'altra parte guardando il
            nastro, e lo paghi in pane.
          effetti: { profondita.caserma-sotto-le-assi: 1 }
        fallimento:
          titolo: Il mantello
          testo: |
            I facchini passano oltre, e uno ti dice che la corda la tiene ai suoi,
            e che i suoi, quaggiù, non portano il rosso.
          effetti: { tormento: 1 }

  # ------------------------------------------------------------ 1 · sotto il Mercato
  - id: caserma-assi-le-reti-del-mercato
    immagine: ambientazione/mercato-dei-nodi
    titolo: Le reti del Mercato
    sommario: "Sotto il Mercato dei Nodi le reti sono piene di casse che di sopra nessuno ha pesato."
    luogo: Sotto le assi, sotto il Mercato dei Nodi
    area: caserma-sotto-le-assi
    ripetibile: true
    requisiti: [fazione.caserma == 4, profondita.caserma-sotto-le-assi == 1]
    testo: |
      Sotto il Mercato dei Nodi da ogni rete pendono casse senza il bollo
      della Gilda, e ogni tanto da una botola fra le assi ne scende una,
      calata a mano. A tre casse di distanza un uomo con il cappuccio degli
      Scuri lega un nodo, troppo occupato per accorgersi di te.

      {politica-ed-economia Media} Ogni cassa che scende dalla botola non
      paga la gabella, e Varn Kett darebbe un dito per vedere queste reti.
    opzioni:
      - testo: "Passare senza farsi vedere dall'uomo delle casse"
        descrizione: "Dietro le casse appese si passa curvi, mentre l'uomo è occupato con il nodo."
        prova: { attributo: fisico, abilita: furtivita, difficolta: Media }
        successo:
          titolo: Dietro le casse
          testo: |
            Passi curvo dietro le casse, e quando l'uomo alza la testa sei già due
            reti più in là. Lo vedi tirare una corda che scende verso la rete
            grande.
          effetti: { profondita.caserma-sotto-le-assi: 1 }
        fallimento:
          titolo: La cassa che dondola
          testo: |
            Urti una cassa, e l'uomo vede il mantello scarlatto e sparisce fra le
            reti con un fischio corto, ripetuto più in basso. Torni indietro prima
            che arrivi chi ha risposto.
          effetti: { sospetto: 1 }

      - testo: "Contare le casse e i bolli"
        descrizione: "Se le casse sono tante qualcuno di sopra le cala, e un numero vale sempre qualcosa."
        prova: { attributo: mentale, abilita: [percezione, politica-ed-economia], difficolta: Media }
        successo:
          titolo: Ventisei casse
          testo: |
            Conti ventisei casse senza bollo e tre botole, e segni con il
            carboncino sulla fodera del mantello i numeri dei banchi di sopra. Poi
            segui la corda dell'uomo fino a una passerella che scende.
          effetti: { profondita.caserma-sotto-le-assi: 1, informazioni.pettegolezzo: 1 }
        fallimento:
          titolo: Le casse uguali
          testo: |
            Alla ventesima cassa non sai più se l'hai già contata, e mentre
            ricominci l'uomo con il cappuccio ti vede e sparisce.
          effetti: { tormento: 1 }

      - testo: "Prendere la strada lunga sotto le casse"
        descrizione: "Si passa sotto, appesi alle reti, lontano dalle botole."
        costo: 2
        esito:
          titolo: Sotto le casse
          testo: |
            Attraversi appeso sotto le reti, mano dopo mano, con le casse sopra la
            testa e il vuoto sotto, e quando ti tiri su dall'altra parte le spalle
            bruciano e la rete grande è vicina.
          effetti: { profondita.caserma-sotto-le-assi: 1 }

  - id: caserma-assi-il-tavolato-marcio
    immagine: ambientazione/ponti-sospesi
    titolo: Il tavolato marcio
    sommario: "Un tratto di assi inchiodate su due travi, nero di umido, è l'unico passaggio verso il basso."
    luogo: Sotto le assi, il tavolato vecchio
    area: caserma-sotto-le-assi
    ripetibile: true
    requisiti: [fazione.caserma == 4, profondita.caserma-sotto-le-assi == 1]
    testo: |
      L'unico passaggio verso il basso è un tavolato di venti passi
      inchiodato su due travi, con le assi nere di umido. Al centro c'è un
      buco largo quanto un uomo, coperto da una porta vecchia con la maniglia
      ancora attaccata.

      {percezione Media} I chiodi sono nuovi solo da un lato. Chi l'ha
      riparato ci passa sempre da quella parte, e dall'altra si fida della
      fortuna.
    opzioni:
      - testo: "Passare sul lato dei chiodi nuovi"
        descrizione: "Le assi riparate reggono, se le riconosci una per una."
        prova: { attributo: mentale, abilita: percezione, difficolta: Media }
        successo:
          titolo: Il lato giusto
          testo: |
            Passi sul lato dei chiodi nuovi guardando ogni testa prima di posare
            il piede, e alla fine apri a fatica i pugni che hai tenuto chiusi per
            venti passi.
          effetti: { profondita.caserma-sotto-le-assi: 1 }
        fallimento:
          titolo: La porta
          testo: |
            La porta sopra il buco scivola sotto il tuo piede, e ti salvi
            aggrappandoti alla maniglia, che ti resta in mano. Torni indietro
            sulle ginocchia, con la maniglia in tasca.
          effetti: { ferite: 1 }

      - testo: "Camminare sulla trave sotto il tavolato"
        descrizione: "Sotto le assi la trave è intera, larga una spanna."
        prova: { attributo: fisico, abilita: acrobazia, difficolta: Media }
        successo:
          titolo: La trave
          testo: |
            Ti cali sotto il tavolato e cammini sulla trave scivolosa, con le assi
            marce sopra la testa come corrimano, fino alla discesa verso le travi
            maestre.
          effetti: { profondita.caserma-sotto-le-assi: 1 }
        fallimento:
          titolo: Il muschio
          testo: |
            A metà la trave viscida ti butta a cavalcioni con una caviglia che
            pulsa, e torni indietro così, un palmo alla volta.
          effetti: { ferite: 0.5 }

      - testo: "Rinforzare il passaggio con la porta"
        descrizione: "Sistemare bene la porta sopra il buco richiede tempo."
        costo: 2
        esito:
          titolo: La porta inchiodata
          testo: |
            Sposti la porta di traverso sul buco, perché poggi su due travi, e la
            blocchi con due chiodi battuti con il tacco. Ci passi sopra a quattro
            zampe, e il prossimo troverà un passaggio migliore.
          effetti: { profondita.caserma-sotto-le-assi: 1 }

  # ------------------------------------------------------------ 1–2 · i mutati
  - id: caserma-assi-i-mutati
    immagine: ambientazione/marea-grigia
    titolo: Quelli della Marea
    sommario: "In fondo a una rete vive gente che la Marea ha cambiato."
    luogo: Sotto le assi, la rete dei mutati
    area: caserma-sotto-le-assi
    ripetibile: true
    requisiti: [fazione.caserma == 4, profondita.caserma-sotto-le-assi >= 1, profondita.caserma-sotto-le-assi <= 2]
    testo: |
      La rete in fondo al passaggio è la più bassa, con la nebbia della
      Cicatrice fino alle caviglie, e intorno a una lanterna di Mana siedono
      quattro o cinque persone. A uno brillano gli occhi come a un gatto e
      una donna ha le vene dei polsi chiare come acqua. La discesa parte dal
      centro del loro cerchio.

      {medicina Media} Stare vicini non attacca la Marea, eppure il corpo ti
      fa fare mezzo passo indietro.
    opzioni:
      - testo: "Sedersi un momento con loro"
        descrizione: "Al cerchio si entra sedendosi, come a un tavolo."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Media }
        successo:
          titolo: Il cerchio
          testo: |
            Ti siedi fra loro con le mani verso la lanterna, e alla donna con le
            vene chiare racconti del mercato di sera. Il cerchio si apre sulla
            discesa.
          effetti: { profondita.caserma-sotto-le-assi: 1 }
        fallimento:
          titolo: La lanterna
          testo: |
            La luce della lanterna ti entra negli occhi più del dovuto, e quando
            torni in te hai un sapore di ferro sulla lingua e il cerchio ti guarda
            tornare indietro.
          effetti: { contaminazione: 1, tormento: 1 }

      - testo: "Chiedere di Nando"
        descrizione: "Quaggiù i bambini passano da tutti, forse anche da loro."
        prova: { attributo: sociale, abilita: empatia, difficolta: Media }
        successo:
          titolo: Il ragazzino delle mele
          testo: |
            All'uomo con gli occhi da gatto si illumina la faccia, perché Nando
            gli porta le mele avanzate dal Mercato. Ti indica la discesa e ti dice
            di sbrigarti, perché stamattina ne sono passati due che cercavano le
            stesse mele.
          effetti: { profondita.caserma-sotto-le-assi: 1, informazioni.voce: 1 }
        fallimento:
          titolo: Le maniche
          testo: |
            Il cerchio si chiude come un pugno, e la donna con le vene chiare si
            mette davanti alla discesa finché non torni indietro.
          effetti: { tormento: 1 }

      - testo: "Girare largo, lungo il pilone"
        descrizione: "Lungo il pilone c'è un appiglio freddo che evita il cerchio."
        costo: 2
        esito:
          titolo: Il pilone
          testo: |
            Giri lungo il pilone con le dita nelle fessure della pietra bagnata e
            la nebbia lungo le gambe, e scendi con le mani gelate e grigie fino al
            polso.
          effetti: { profondita.caserma-sotto-le-assi: 1, contaminazione: 1 }

  # ------------------------------------------------------------ 2 · le travi maestre
  - id: caserma-assi-le-travi-maestre
    immagine: ambientazione/cicatrice-del-mondo
    titolo: Le travi maestre
    sommario: "Le travi del Ponte delle Mille Corde passano sopra il vuoto, senza reti sotto."
    luogo: Sotto le assi, le travi maestre
    area: caserma-sotto-le-assi
    ripetibile: true
    requisiti: [fazione.caserma == 4, profondita.caserma-sotto-le-assi == 2]
    testo: |
      Qui finiscono le reti. Le travi maestre, larghe come una panca,
      corrono per trenta passi sopra il vuoto della Cicatrice fino al pilone
      del Mercato, con un listello inchiodato a ogni passo per dare presa
      agli stivali. Da sotto sale una luce grigia che non viene da nessun
      sole.

      {atletica Media} Trenta passi su una panca, che per terra faresti a
      occhi chiusi.
    opzioni:
      - testo: "Camminare sulla trave"
        descrizione: "Un listello alla volta, senza guardare giù."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Media }
        successo:
          titolo: Trenta listelli
          testo: |
            Al quindicesimo listello smetti di contare perché le gambe hanno
            capito il ritmo, e al pilone del Mercato senti sotto il cigolio di una
            rete grande.
          effetti: { profondita.caserma-sotto-le-assi: 1 }
        fallimento:
          titolo: Il listello rotto
          testo: |
            Al decimo passo un listello si stacca e cade nella luce grigia senza
            fare rumore, e torni indietro a cavalcioni, con la guancia contro il
            legno.
          effetti: { ferite: 1 }

      - testo: "Passare sotto la trave, appesi"
        descrizione: "Sotto la trave c'è la fune tesa dei manutentori, da fare a forza di braccia."
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Media }
        successo:
          titolo: La fune dei manutentori
          testo: |
            Vai avanti appeso alla fune con le gambe sulla luce grigia, e ai due
            terzi non senti più le spalle. Arrivi al pilone con le mani che si
            aprono a fatica.
          effetti: { profondita.caserma-sotto-le-assi: 1 }
        fallimento:
          titolo: Le braccia
          testo: |
            A metà fune le braccia smettono di obbedire, e torni indietro una
            presa alla volta, con le mani spellate.
          effetti: { ferite: 0.5 }

      - testo: "Aspettare il carro dei manutentori"
        descrizione: "Una volta al giorno i manutentori della Gilda passano sulla fune con un carrello."
        costo: 2
        esito:
          titolo: Il carrello
          testo: |
            A sera il carrello dei manutentori passa con due uomini e una
            lanterna, e tu ci salti sopra al pilone. Ti guardano il mantello senza
            dire niente e al Mercato ti fanno scendere con una spinta.
          effetti: { profondita.caserma-sotto-le-assi: 1 }

  - id: caserma-assi-il-tagliagole
    immagine: fazioni/scuri
    titolo: Uno che sale
    sommario: "Su una scala di corda fra le travi un uomo con il coltello legato al polso sale verso di te."
    luogo: Sotto le assi, la scala verso la rete grande
    area: caserma-sotto-le-assi
    ripetibile: true
    requisiti: [fazione.caserma == 4, profondita.caserma-sotto-le-assi == 2]
    testo: |
      A metà della scala che gira intorno al pilone sale un uomo magro con il
      coltello legato al polso da un laccio, e quando ti vede si ferma con un
      piede nel vuoto, sorridendo con i denti storti. «Il ragazzino non c'è»
      dice, con la cortesia di un oste che chiude. «Torna di sopra, che qui
      si cade.»

      {rissa Media} Sulla scala vince chi sta sopra, e lui infatti non sale
      più.
    opzioni:
      - testo: "Affrontarlo sulla scala"
        descrizione: "È solo, e tu stai sopra di lui sulla scala."
        combattimento: caserma-un-tagliagole
        vittoria:
          titolo: Il laccio
          testo: |
            Alla terza coltellata gli pesti la mano sul piolo. Resta appeso per il
            laccio finché se lo sfila, e scivolato sulla rete di sotto scappa
            senza voltarsi.
          effetti: { profondita.caserma-sotto-le-assi: 1 }
        sconfitta:
          titolo: Di sopra
          testo: |
            Il coltello arriva da sotto e ti apre il braccio, e torni sulla rete
            con il sangue nella manica mentre lui ti guarda salire.
          effetti: { tormento: 1 }

      - testo: "Convincerlo che te ne vai"
        descrizione: "Gli basta che tu sparisca dalla sua scala."
        prova: { attributo: sociale, abilita: [ingannare, persuasione], difficolta: Media }
        successo:
          titolo: Il giro dietro il pilone
          testo: |
            Alzi le mani e risali dicendo che del ragazzino non ti importa, e lui
            ti segue finché non ti allontani, poi riprende la sua strada verso
            l'alto. Appena sparisce torni alla scala e scendi verso la rete
            grande.
          effetti: { profondita.caserma-sotto-le-assi: 1 }
        fallimento:
          titolo: Il secondo coltello
          testo: |
            Lui ride, e dalla manica gli esce un secondo coltello senza laccio che
            ti prende di striscio al polpaccio. Torni sulla rete prima che trovi
            il terzo.
          effetti: { ferite: 1 }

      - testo: "Aspettare che se ne vada"
        descrizione: "Prima o poi deve salire o scendere, e tu puoi aspettare dietro le casse."
        costo: 2
        esito:
          titolo: Dietro le casse
          testo: |
            Ti nascondi dietro una cassa appesa finché l'uomo risale, passandoti a
            un braccio senza vederti. Scendi verso la rete grande con le gambe
            addormentate.
          effetti: { profondita.caserma-sotto-le-assi: 1 }

  # ------------------------------------------------------------ il cuore · la rete grande
  - id: caserma-assi-la-rete-grande
    immagine: ambientazione/mercato-dei-nodi
    titolo: La rete grande
    sommario: "Sotto il Mercato dei Nodi, nella rete più grande dei sottoponti, due uomini stanno tagliando le corde."
    luogo: Sotto le assi, la rete grande sotto il Mercato dei Nodi
    area: caserma-sotto-le-assi
    requisiti: [fazione.caserma == 4, profondita.caserma-sotto-le-assi >= 3]
    testo: |
      La rete grande è tesa fra quattro piloni sotto il centro del Mercato dei Nodi, larga quanto una piazza. Nel mezzo, dove dormono
      i facchini, c'è un mucchio di stracci e di tela, e dalla tela spunta una mano stretta a una maglia.

      Sul pilone più vicino due uomini con il cappuccio tagliano le corde che reggono la rete, una alla volta, senza fretta. A ogni
      corda tagliata la rete si inclina verso il vuoto, e il mucchio di stracci scivola di un palmo.

      {armi-da-mischia Media} Tagliano con coltelli ricurvi da pescatore, attrezzi da corda che diventano armi solo se li hai già in
      mano quando arrivi.

      {empatia Facile} La mano sotto la tela si stringe a ogni corda che cade. Nando è sveglio, e fa finta di non esserci perché è
      l'unica cosa che può fare.

      A uno dei due il cappuccio scivola indietro, e ti vede. Taglia un'altra corda, guardandoti.
    opzioni:
      - testo: "Affrontare i due uomini sul pilone"
        descrizione: "Sono due sul pilone, con i coltelli da corda, e la rete si inclina."
        combattimento: caserma-la-rete
        vittoria:
          titolo: Le corde
          testo: |
            Il primo scappa verso le travi a quattro zampe e il secondo si butta
            giù per la scala del pilone. Sulla rete inclinata come un tetto il
            mucchio di stracci è fermo a un palmo dal bordo, e ne esce un
            ragazzino con le ginocchia nere di catrame.
          segue: caserma-assi-nando
        sconfitta:
          titolo: La rete che cede
          testo: |
            Ti tengono sul pilone finché non tagliano l'ultima corda, e il mucchio
            di stracci scivola via. Lo vedi aggrapparsi al bordo e sparire verso
            le travi, più svelto di un gatto, e torni di sopra con il sangue nella
            manica.
          effetti: { tormento: 1 }
          vai: ponti-sospesi

      - testo: "Arrivare alla rete prima che cada"
        descrizione: "Lungo la trave alta, larga un piede, si arriva alla rete senza passare dai due."
        prova: { attributo: fisico, abilita: acrobazia, difficolta: Difficile }
        successo:
          titolo: La trave alta
          testo: |
            Corri sulla trave alta e ti lasci cadere sulla rete mentre l'ultima
            corda si spezza. Nel mucchio di stracci trovi un braccio sottile e
            tiri fuori il ragazzino come un pesce, aggrappandoti con lui al bordo
            sano, e i due uomini se ne vanno.
          pe: { acrobazia: 5 }
          segue: caserma-assi-nando
        fallimento:
          titolo: La trave scivola
          testo: |
            La trave alta è bagnata di nebbia e atterri sulla rete di schiena,
            rotolando fino al bordo. Sul pilone i due ridono e tagliano un'altra
            corda, e adesso sei sulla rete con loro.
          effetti: { ferite: 1 }

      - testo: "Tornare indietro"
        descrizione: "Due uomini armati sopra il vuoto, e si può tornare con qualcuno in più."
        costo: 0
        esito:
          titolo: Di sopra
          testo: |
            Torni indietro sulla scala, e l'ultima cosa che vedi è il mucchio di
            stracci che scivola ancora di un palmo. Risali ai Ponti con le mani
            che tremano.
          vai: ponti-sospesi

  - id: caserma-assi-nando
    immagine: ambientazione/ponti-sospesi
    titolo: Nando Rizza
    tipo: seguito
    luogo: Sotto le assi, la rete grande
    area: caserma-sotto-le-assi
    requisiti: [fazione.caserma == 4]
    testo: |
      Nando Rizza si siede sul bordo della rete con le ginocchia contro il petto, e
      trema anche se non fa freddo.

      «Era il miliziano della casa blu che tossisce nella sciarpa» dice. «Contava i
      soldi sulla mano con uno degli Scuri, poi l'altro gli ha dato un foglio da
      leggere, e io ho fatto cadere la gerla. Non lo dico a nessuno se mi dite dove
      dormire, lontano da qua.»

      {politica-ed-economia Media} Un nome e nessuna prova scritta, e con un nome
      solo la Caserma non si muove.

      *Fulvio Saldo.* Lo sapevi dalla prima sera, da come tossiva.
    opzioni:
      - testo: "Portarlo in Caserma"
        descrizione: "La Caserma è il posto più sicuro della città, se ti fidi di tutti quelli che ci lavorano."
        esito:
          titolo: La branda in magazzino
          testo: |
            Il furiere gli trova una branda fra i mantelli piegati, e Nando firma
            la ricevuta della coperta con una croce e poi, storto, con il suo
            nome. A sera dorme con la mela in mano, e dalle mura vedi del fumo
            verso il Ponte del Conciatore.

            {furtivita Media} Alla casa blu lo sapranno entro domani, perché in
            Caserma le notizie corrono lungo la lavagna dei turni.
          pe: { acrobazia: 5 }
          imposta: { caserma.nando: 1 }
          effetti: { fazione.caserma: 1, monete: 10, rep.ponti: 0.5, rep.caserma: 0.5 }
          vai: ponti-sospesi

      - testo: "Portarlo al Grifone di Ferro"
        descrizione: "Al Grifone Brunella dà il latte caldo ai ragazzini, se Liaren accetta di tenerne uno."
        prova: { attributo: sociale, abilita: persuasione, difficolta: Facile }
        successo:
          titolo: Il sottoscala del Grifone
          testo: |
            Liaren guarda Nando dalla testa ai piedi e chiama Brunella, che gli
            mette davanti una scodella prima di sapere come si chiama, e il
            sottoscala ha una branda libera. Sulla via del ritorno vedi del fumo
            verso il Ponte del Conciatore.
          pe: { acrobazia: 5 }
          imposta: { caserma.nando: 2 }
          effetti: { fazione.caserma: 1, monete: 10, rep.ponti: 0.5, rep.caserma: 0.5 }
          vai: ponti-sospesi
        fallimento:
          titolo: Il prezzo del sottoscala
          testo: |
            Liaren dice che i ragazzini costano come gli adulti, e paghi una
            settimana di sottoscala, latte di Brunella compreso. Sulla via del
            ritorno vedi del fumo verso il Ponte del Conciatore.
          pe: { acrobazia: 5 }
          imposta: { caserma.nando: 2 }
          effetti: { fazione.caserma: 1, monete: 4, rep.ponti: 0.5 }
          vai: ponti-sospesi

      - testo: "Lasciarlo da Mamma Tesh"
        descrizione: "Chi sta sotto la protezione di Mamma Tesh non lo tocca nessuno, e lei chiederà qualcosa in cambio."
        costo: 2
        esito:
          titolo: Sotto il Capitano
          testo: |
            Mamma Tesh batte il ferro sull'elmo mentre qualcuno mette una scodella
            in mano al ragazzino. «Adesso è mio, e tu mi devi un favore da
            Guardia, di quelli grossi» dice, come si dice il prezzo del pane.
            Sulla via del ritorno vedi del fumo verso il Ponte del Conciatore.
          pe: { acrobazia: 5 }
          imposta: { caserma.nando: 3 }
          effetti: { fazione.caserma: 1, monete: 10, rep.ponti: 0.5 }
          vai: ponti-sospesi
