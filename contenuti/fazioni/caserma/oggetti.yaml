# Gli oggetti della quest della Caserma (fazione.caserma). Grado = punti da spendere, più uno per ogni difetto.
# Grado 1 (passo 3): il mantello scarlatto. Grado 2 (passo 6): la lanterna di ronda. Grado 3 (passo 9): la giubba
# senza mostrine. Grado 4 (passo 12): la cotta della Caserma e il registro del Pesatore, da leggere negli Averi.
# Passo 14: il mazzo di Nihali. Grado 5 (passo 15): la spada di Ivo Carstan oppure le piastre della Caserma
# (grado 4, una delle due, secondo chi prende la spada dalla teca), e il distintivo del capitano.
oggetti:
  - id: caserma-mantello-scarlatto
    nome: Mantello scarlatto
    immagine: icone/cape
    descrizione: "Il mantello della Guardia di Qir-Azel, di lana grossa tinta di rosso, con un rammendo sulla spalla. Tiene caldo sulle mura e in Città Bassa lo vedono arrivare da due strade di distanza."
    slot: accessorio
    grado: 1
    proprieta: { talento: { intimidire: 1, resistenza: 1 } }
    difetti: [riconoscibile]

  - id: caserma-lanterna-di-ronda
    nome: Lanterna di ronda
    immagine: icone/old-lantern
    descrizione: "Una lanterna di ferro battuto con lo sportello che si chiude a metà, per fare luce senza farsi vedere. Il furiere ne dà una ai capi di ronda, con la ricevuta."
    slot: accessorio
    grado: 2
    proprieta: { talento: { percezione: 1 }, rapida: 1 }

  - id: caserma-giubba-senza-mostrine
    nome: Giubba senza mostrine
    immagine: icone/leather-armor
    descrizione: "Cuoio rinforzato di taglio comune, senza alcuno stemma sul petto, con le cuciture ripassate a cera perché non scricchiolino. È la divisa di chi nella lista dello sceriffo non ha divisa."
    slot: armatura
    base: cuoio-rinforzato
    grado: 3
    dadi: 1
    proprieta: { silenziosa: true, talento: { ingannare: 1 } }

  - id: caserma-cotta-della-caserma
    nome: Cotta della Caserma
    immagine: icone/chain-mail
    descrizione: "La cotta di maglia dei luogotenenti, con gli anelli doppi sulle spalle e sul fianco sinistro. L'armaiolo della Caserma la rifà su misura, e sotto il colletto ribatte un anello d'ottone con il numero del grado."
    slot: armatura
    base: cotta-di-maglia
    grado: 3
    dadi: 1
    proprieta: { robusta: 1 }

  - id: caserma-registro-del-pesatore
    nome: Registro del Pesatore
    immagine: icone/book-cover
    descrizione: "Un quaderno dalla copertina di cuoio unto, con le vendite del Pesatore degli ultimi dieci anni. Ogni riga ha un peso e un prezzo, e accanto il segno del clan che ha comprato."
    slot: nessuno
    usa: caserma-leggere-il-registro-del-pesatore

  - id: caserma-mazzo-di-nihali
    nome: Mazzo di Nihali
    immagine: icone/card-pick
    descrizione: "Il mazzo da Zekar di Nihali Cuzan, con il dorso blu e gli angoli lisi. Ha imparato a stare nella mano di chi lo tiene, e chi ha giocato alla Pignatta lo riconosce."
    slot: accessorio
    grado: 1
    proprieta: { talento: { ingannare: 1, percezione: 1 } }
    difetti: [riconoscibile]

  - id: caserma-spada-di-ivo-carstan
    nome: Spada di Ivo Carstan
    immagine: icone/broadsword
    descrizione: "La spada lunga del vecchio capitano della Guardia, con il filo ammaccato a metà lama e l'elsa fasciata di cuoio nuovo. Per anni è stata nella teca della Caserma, e in città la riconoscono tutti."
    slot: arma
    base: spada-lunga
    grado: 4
    dadi: 2
    proprieta: { affilata: 1, ultimoRespiro: true }
    difetti: [riconoscibile]

  - id: caserma-piastre-della-caserma
    nome: Piastre della Caserma
    immagine: icone/breastplate
    descrizione: "L'armatura a piastre che la Caserma tiene da parte per il suo capitano, con lo stemma della Guardia sbalzato sul petto brunito. È rimasta su un manichino nel magazzino per anni, e il furiere l'ha unta ogni primavera."
    slot: armatura
    base: armatura-a-piastre
    grado: 4
    dadi: 2
    proprieta: { robusta: 1 }

  - id: caserma-distintivo-del-capitano
    nome: Distintivo del capitano
    immagine: icone/police-badge
    descrizione: "Una placca d'argento brunito con la torre di Qir-Azel, da appuntare sul mantello. Apre le porte del Municipio, e in Caserma fa alzare in piedi chi è seduto."
    slot: accessorio
    grado: 3
    proprieta: { talento: { intimidire: 1, persuasione: 1, galateo: 1 }, chiave: [capitano] }
