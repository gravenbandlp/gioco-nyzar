# La quest della Caserma, passi 1, 3 e 4 (il passo 2, la ronda di notte, sta in citta/guarnigione.yaml; il 5, sotto
# le assi, in spedizione-sotto-le-assi.yaml).
# 1 il registro del furiere: Duilio Gasti mette alla prova l'ausiliario nel cortile; chi fallisce entra con riserva.
# 3 il mantello di Bruno Lesca (grado 1, Miliziano): i mantelli dei morti in magazzino, poi il giuramento in cortile
#   e la madre di Bruno sulla discesa. Con rep.scuri >= 3 (prima della Pignatta) Gasti chiede da chi bevi.
# 4 la casa di pietra blu: il posto di guardia in Città Bassa (luogo caserma-casa-blu), il bottaio che non vuole
#   firmare e, a sera, Nando Rizza che entra di corsa e scappa nei sottoponti.
storylet:
  # ------------------------------------------------------------ passo 1 · il registro del furiere
  - id: caserma-il-registro-del-furiere
    presso: guarnigione-di-qir-azel
    immagine: ambientazione/guarnigione-di-qir-azel
    titolo: Il registro del furiere
    sommario: "Il furiere della Caserma scrive a registro chiunque abbia due braccia buone. Prima, però, il sergente d'addestramento vuole vederle lavorare."
    luogo: Guarnigione di Qir-Azel, il banco del furiere e il cortile
    area: quartieri-alti
    requisiti: [fazione.caserma == 0]
    testo: |
      Il furiere tiene il banco delle consegne in fondo al corridoio del
      mastio, e ti ascolta con la penna sospesa sopra il registro. A metà
      della tua prima frase ha già intinto. Dopo la razzia, ti spiega senza
      alzare gli occhi, la Caserma ha più mantelli che uomini, e gli
      ausiliari a giornata lui li scrive in fondo alla pagina, con la paga
      quando arriva. Alle sue spalle gli scaffali sono pieni di mantelli
      scarlatti piegati, con il cartellino.

      {conoscenze-della-strada Facile} Troppi mantelli per un magazzino che
      fa fatica a comprare le lanterne. Sono di chi dalle mura non è
      tornato, e il furiere non ha ancora trovato a chi darli.

      Sopra il banco, su un piedistallo di legno scuro, c'è una teca di
      vetro con dentro una spada lunga appoggiata su un panno rosso stinto.
      Il filo è ammaccato a metà lama, e sul cartiglio c'è un nome solo,
      *Ivo Carstan*. I miliziani che passano abbassano la voce davanti al
      vetro.

      {accademiche Media} Ivo Carstan era lo sceriffo di Qir-Azel prima di
      Galdrick, e il Cucitore lo prese in un vicolo l'ultima delle Notti
      Cucite. La spada l'hanno raccolta dove era caduta.

      «Per il registro mi basta una firma» dice il furiere, e indica il
      cortile con la penna. «Gasti, di solito, vuole qualcosa di più.»

      Nel cortile il sergente d'addestramento, Duilio Gasti, ha una voce
      che arriva fino alle mura. Conta le parate di sei reclute davanti ai
      manichini di paglia, e quando una sbaglia ricomincia da uno.

      {origine apprendista-raschiatore} Tre delle reclute portano la cintura
      degli attrezzi dei Raschiatori sopra la giubba. In questo cortile il
      Ferro e la Guardia si addestrano insieme da prima che tu nascessi, e
      quelle tre ti riconoscono dal modo in cui guardi il cammino di ronda,
      misurandolo come una piattaforma.

      *Se sbaglio, ricomincia da uno anche per me.* Ti asciughi le mani sui
      calzoni prima di avvicinarti.
    opzioni:
      - testo: "Parare ai manichini davanti alle reclute"
        descrizione: "Gasti ti mette in mano una spada di legno e conta. Si arriva a dodici senza sbagliare."
        prova: { attributo: fisico, abilita: armi-da-mischia, difficolta: Media }
        successo:
          titolo: Dodici
          testo: |
            Gasti conta, e tu pari. Al sei la spada di legno ti scivola nella
            mano sudata e la riprendi in tempo, al nove una recluta dei
            Raschiatori smette di guardare il suo manichino per guardare te.
            Al dodici il sergente tace. Poi ti prende la spada di mano, la
            soppesa come se volesse capire dove sta il trucco, e la rimette
            nella rastrelliera.

            {armi-da-mischia Facile} Il manichino ha la spalla sinistra
            consumata dai colpi di tutti quelli venuti prima di te. Hai
            colpito dove colpiscono tutti, ed è per questo che Gasti è
            contento.

            Il furiere scrive il tuo nome in fondo alla pagina e ti fa firmare
            la ricevuta della giornata. Mentre soffia sull'inchiostro ti dice
            che una faccia che i suoi sergenti non conoscono gli
            tornerà utile.
          pe: { armi-da-mischia: 3 }
          effetti: { fazione.caserma: 1, rep.caserma: 0.5, monete: 3 }
        fallimento:
          titolo: Da uno
          testo: |
            Al quinto colpo la spada di legno ti salta di mano e finisce sotto
            la rastrelliera, e Gasti ricomincia da uno. Alla terza volta che
            ricomincia le reclute hanno smesso di parare per guardare. Il
            sergente non alza la voce. Ti dice che per oggi va bene così, e
            che domani all'alba le latrine del cortile hanno bisogno di
            qualcuno.

            Il furiere ti scrive in fondo alla pagina con una crocetta
            accanto, che vuol dire con riserva, e ti fa firmare lo stesso.
          effetti: { fazione.caserma: 1, ferite: 0.5 }

      - testo: "Correre il giro del cammino di ronda"
        descrizione: "Dal portone alla torre nord e ritorno, sulle mura, prima che Gasti finisca di contare fino a cento."
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Media }
        successo:
          titolo: Prima del cento
          testo: |
            Sali la scala delle mura due gradini alla volta, e il cammino di
            ronda è più stretto di come sembrava dal cortile, con le pietre
            lisce dove passano le guardie. Alla torre nord tocchi il muro con
            la mano aperta, come ti ha detto Gasti, e torni indietro con il
            vento in faccia. Quando rimetti piede nel cortile il sergente è
            arrivato a novantuno.

            {resistenza Media} Le gambe protestano soltanto dopo, mentre il
            furiere ti scrive sul registro. Ti siedi sul
            bordo del pozzo fingendo di farlo per comodità.

            Il furiere ti fa firmare la ricevuta e ti dice, soffiando
            sull'inchiostro, che una faccia che i suoi sergenti non conoscono
            gli tornerà utile.
          pe: { atletica: 3 }
          effetti: { fazione.caserma: 1, rep.caserma: 0.5, monete: 3 }
        fallimento:
          titolo: Centoventi
          testo: |
            A metà strada il fiato ti abbandona, e alla torre nord ci arrivi
            camminando, con una mano sul fianco. Gasti finisce di contare fino
            a cento mentre sei ancora sulle mura, e poi continua, a voce un po'
            più bassa, per educazione. Rientri a centoventi. Il sergente ti
            dice che domani all'alba le latrine del cortile hanno bisogno di
            qualcuno, e che lì il fiato non serve.

            Il furiere ti scrive in fondo alla pagina con una crocetta
            accanto, che vuol dire con riserva.
          effetti: { fazione.caserma: 1, ferite: 0.5 }

      - testo: "Recitare il regolamento a memoria"
        descrizione: "Gasti ti dà un libretto cucito a mano con il regolamento della Guardia. Hai il tempo di una parata per impararne la prima pagina."
        prova: { attributo: mentale, abilita: accademiche, difficolta: Facile }
        successo:
          titolo: Articolo primo
          testo: |
            Il libretto ha gli angoli molli di chi l'ha tenuto in tasca per
            anni, e la prima pagina dice chi può fermare chi e per quanto tempo
            lo si può tenere in cella. La reciti a Gasti senza saltare una
            virgola. Il sergente ascolta con le braccia incrociate e alla fine
            ti chiede l'articolo nove, che sta alla terza pagina, e tu lo sai
            perché nel frattempo hai continuato a leggere.

            {accademiche Facile} L'articolo nove dice che il miliziano non
            accetta doni in servizio. Qualcuno, nel margine, ci ha disegnato
            un piccolo prosciutto.

            Il furiere ti scrive e ti dice che una faccia che i suoi sergenti
            non conoscono gli tornerà utile.
          pe: { accademiche: 3 }
          effetti: { fazione.caserma: 1, rep.caserma: 0.5, monete: 3 }
        fallimento:
          titolo: Il libretto in tasca
          testo: |
            Le parole della prima pagina ti si confondono con quelle della
            seconda, e quando Gasti ti chiede chi può fermare chi rispondi con
            sicurezza una cosa che nel regolamento non c'è. Le reclute ridono.
            Il sergente ti lascia il libretto e ti dice di riportarglielo
            domani all'alba, dopo il turno alle latrine.

            Il furiere ti scrive in fondo alla pagina, con una crocetta accanto
            che vuol dire con riserva.
          effetti: { fazione.caserma: 1, tormento: 0.5 }

      - testo: "Far tornare un conto al furiere"
        descrizione: "Sul registro i mantelli in magazzino e gli uomini in servizio non tornano da una settimana, e il furiere ci ha passato le notti."
        prova: { attributo: mentale, abilita: politica-ed-economia, difficolta: Media }
        successo:
          titolo: Due righe
          testo: |
            Il furiere ti gira il registro con un sospiro, come si passa un
            neonato che non smette di piangere. Ci metti un'ora di colonne, e
            alla fine trovi due mantelli scritti due volte nella stessa riga,
            alla consegna come alla restituzione, con la stessa grafia tonda. Il furiere guarda le due righe a lungo. Poi ci tira sopra
            una linea sottile con il righello e ti scrive sul registro in bella,
            in fondo alla pagina, senza passare dal cortile.

            {politica-ed-economia Media} La grafia tonda è quella di un
            sergente della ronda di notte, che scrive in fretta. Il furiere
            adesso lo sa, e a ogni riga tonda guarderà due volte.

            Ti dice che una faccia che i suoi sergenti non conoscono gli
            tornerà utile.
          pe: { politica-ed-economia: 3 }
          effetti: { fazione.caserma: 1, rep.caserma: 0.5, monete: 3 }
        fallimento:
          titolo: Il conto del furiere
          testo: |
            Ci metti un'ora e trovi un errore, e il furiere ti mostra con la
            punta della penna che l'errore l'hai fatto tu, alla terza colonna.
            Lo dice con dolcezza. Poi ti manda in cortile da Gasti, che non ha
            tempo per le prove e ti mette per l'indomani al turno delle
            latrine.

            Il furiere ti scrive in fondo alla pagina con una crocetta accanto,
            che vuol dire con riserva.
          effetti: { fazione.caserma: 1, tormento: 0.5 }

      - testo: "Firmare con riserva e prendere il turno delle latrine"
        descrizione: "Gasti ha da fare con le reclute. Il furiere ti scrive subito, se accetti il turno delle latrine."
        costo: 2
        esito:
          titolo: Il turno dell'alba
          testo: |
            Il furiere ti scrive in fondo alla pagina, con una crocetta accanto
            che vuol dire con riserva, e Gasti ti affida un secchio e una
            spazzola dalle setole consumate. Passi l'alba alle latrine del
            cortile, mentre le reclute si allenano a dieci passi da te e fanno
            finta di non sentire l'odore. A mezzogiorno il sergente passa a
            controllare. Annusa l'aria, e poi cancella la crocetta con il
            pollice.

            {resistenza Facile} Lo stomaco si è arreso all'odore dopo la prima
            ora. Le ginocchia, sulla pietra bagnata, non si sono arrese mai.
          pe: { resistenza: 3 }
          effetti: { fazione.caserma: 1 }

  # ------------------------------------------------------------ passo 3 · il mantello di Bruno Lesca (grado 1)
  - id: caserma-i-mantelli-dei-morti
    presso: guarnigione-di-qir-azel
    immagine: ambientazione/guarnigione-di-qir-azel
    titolo: I mantelli dei morti
    sommario: "Domani c'è il giuramento, e i mantelli nuovi non sono arrivati. Il furiere distribuisce quelli che ha sugli scaffali."
    luogo: Guarnigione di Qir-Azel, il magazzino del furiere
    area: quartieri-alti
    requisiti: [fazione.caserma == 2]
    testo: |
      I mantelli nuovi per il giuramento dovevano arrivare dalla Conceria
      Kasselt una settimana fa, e non sono arrivati. Il furiere ha tirato giù
      dagli scaffali quelli piegati con il cartellino, e li consegna uno per
      uno alle reclute in fila, con la ricevuta. Non legge i cartellini ad
      alta voce. Li stacca con le forbici e li mette in una scatola di latta
      sotto il banco.

      Il tuo è di lana grossa tinta di rosso, più pesante di quanto
      sembrasse sullo scaffale, con un rammendo sulla spalla sinistra fatto
      a punti fitti. Quando lo apri, all'interno del colletto c'è un nome
      ricamato in filo nero da una mano paziente, *Bruno Lesca*.

      {percezione Media} Il rammendo è fresco, ma il filo nero del nome è
      vecchio e ha preso la forma del collo di chi lo portava. Il buco sulla
      spalla l'ha fatto una freccia orchesca, e il resto della storia l'ha
      ricucito il furiere.

      {empatia Facile} Le reclute davanti a te hanno aperto il mantello
      anche loro, e due hanno trovato un nome. Una lo ha già girato
      all'esterno, perché non le tocchi il collo.

      Dietro la fila Linna Varo ti fa un cenno con il mento. Il suo mantello
      le arriva alle caviglie e lei lo tiene sollevato con una mano, come un
      orlo da sposa. Dal cortile arriva la voce di Gasti, che prova la
      formula del giuramento da solo, e a ogni frase sbaglia la stessa
      parola.

      *Domani lo porti davanti a tutti, con il suo nome sul collo.* Ti
      accorgi di tenerlo piegato sul braccio, come quelli che escono di
      ronda.
    opzioni:
      - testo: "Chiedere al furiere chi era Bruno Lesca"
        descrizione: "I cartellini sono nella scatola di latta, e il furiere ha un registro anche per i morti."
        prova: { attributo: sociale, abilita: [empatia, persuasione], difficolta: Media }
        successo:
          titolo: La scatola di latta
          testo: |
            Il furiere non risponde subito. Finisce la fila e ripone la
            scatola di latta sotto il banco, poi apre un registro più piccolo
            con la copertina nera e cerca la pagina con il dito. «Bruno Lesca,
            ventidue anni, torre nord» legge. «La madre sta in fondo alla
            discesa, nella casa con la grondaia verde. Viene al portone il
            primo del mese e chiede se è arrivato niente per lei.» Chiude il
            registro tenendoci dentro il dito, come se dovesse riaprirlo
            presto. «Non arriva mai niente, perché il Consiglio la pensione
            non la vota.»

            {politica-ed-economia Media} Una pensione per le vedove e le madri
            dei miliziani, in un Consiglio che non trova i soldi nemmeno per
            le lanterne. Il furiere la chiede da anni, e la scrive ogni volta
            in fondo alla lista.
          segue: caserma-il-giuramento
        fallimento:
          titolo: I morti si contano
          testo: |
            Il furiere ti guarda da sopra gli occhiali e continua a consegnare
            mantelli. «I morti li conto» dice alla recluta dopo di te, «e li
            conto bene.» Non aggiunge altro, e tu torni nella fila con il
            mantello sul braccio e la sensazione di avere chiesto troppo
            presto una cosa che si chiede dopo.
          segue: caserma-il-giuramento

      - testo: "Rivoltare il colletto come la recluta davanti a te"
        descrizione: "Il nome resta dentro la lana, solo che non ti tocca più il collo."
        esito:
          titolo: Il colletto
          testo: |
            Rivolti il colletto all'esterno e lo appunti con uno spillo che ti
            presta Linna. Il nome adesso guarda fuori, verso chi ti sta
            davanti, e a te tocca soltanto la lana ruvida della fodera. Linna ti
            guarda fare e poi rivolta il suo, benché dentro il suo colletto
            non ci sia scritto niente.
          segue: caserma-il-giuramento

      - testo: "Provare la formula con Gasti"
        descrizione: "Il sergente sbaglia sempre la stessa parola del giuramento, e domani la dovrà dire davanti a tutto il cortile."
        prova: { attributo: sociale, abilita: [espressivita, galateo], difficolta: Media }
        successo:
          titolo: Davanti alla città
          testo: |
            Ti metti davanti a Gasti come se fossi la recluta e lui lo
            sceriffo, e gli fai ripetere la formula finché non arriva in fondo
            senza inciampare. La parola sbagliata è *custodire*, e lui da
            vent'anni dice *custodiare*. Alla quinta volta la dice giusta, e
            si gira verso il cortile vuoto per controllare che nessuno abbia
            sentito le prime quattro.

            {espressivita Facile} Gli manca il fiato a metà formula, perché la
            dice tutta d'un fiato, come un ordine. Se respirasse dopo *città*
            arriverebbe in fondo con l'aria che gli serve.
          pe: { espressivita: 3 }
          segue: caserma-il-giuramento
        fallimento:
          titolo: Custodiare
          testo: |
            Gli fai ripetere la formula tre volte, e alla terza la sbagli anche
            tu, nello stesso punto. Gasti ti guarda con una gratitudine
            enorme, come si guarda un compagno di sventura, e ti dice che
            domani la diranno sbagliata in due e nessuno se ne accorgerà.
          segue: caserma-il-giuramento

  - id: caserma-il-giuramento
    immagine: ambientazione/guarnigione-di-qir-azel
    titolo: Il giuramento
    tipo: seguito
    luogo: Guarnigione di Qir-Azel, il cortile
    area: quartieri-alti
    requisiti: [fazione.caserma == 2]
    testo: |
      Il giuramento si fa nel cortile all'ora in cui il sole arriva sopra le
      mura, con le reclute in fila davanti alla porta del mastio e i
      miliziani anziani sotto il portico, in mantello. Gasti legge la
      formula, e voi la ripetete una frase alla volta. La finestra
      dell'ufficio dello sceriffo è aperta. Il furiere sta sulla soglia del
      magazzino con il registro al petto, e ogni tanto si sporge per
      contare le teste.

      {intimidire Media} I miliziani sotto il portico guardano le reclute più
      della cerimonia. Cercano chi abbassa gli occhi per primo, e se lo
      segnano.

      A metà formula, oltre il portone, vedi una donna che sale piano la
      discesa. Ha uno scialle grigio e le scarpe della domenica, e quando
      arriva al portone non entra. Si ferma accanto alle guardie e guarda le
      finestre, e dopo le finestre i mantelli. Ti accorgi che sta contando
      anche lei.

      {empatia Media} Le facce delle reclute non le interessano. Cerca un
      rammendo sulla spalla sinistra, e l'ha già trovato.

      Gasti arriva a *custodire* e lo dice giusto, e qualcuno sotto il
      portico fa un mezzo applauso che muore subito. Poi il sergente chiude
      il libretto e vi dichiara miliziani della Guardia di Qir-Azel, con la
      paga piena per le ronde. Il furiere scrive. La donna è ancora al
      portone.
    opzioni:
      - testo: "Andarle a dire che il mantello ce l'hai tu"
        descrizione: "Attraversi il cortile davanti a tutti, con il nome di suo figlio sul collo."
        prova: { attributo: sociale, abilita: empatia, difficolta: Media }
        successo:
          titolo: Il rammendo
          testo: |
            Attraversi il cortile e ti fermi davanti a lei senza avere
            preparato una parola, così le dici il tuo nome. Lei allunga una mano e tocca il
            rammendo sulla spalla, i punti fitti uno per uno, come si contano
            le perle di una collana. «L'ha cucito bene» dice. «Il furiere.
            Bruno non lo avrebbe mai cucito così bene.» Poi ti chiede se
            stai sulle mura nord, e le dici di sì anche se non lo sai ancora.

            {empatia Media} Ha deciso che d'ora in poi passerà al portone ogni
            tanto, a vedere se il mantello è ancora in giro. Te lo dice con
            gli occhi, per non doverti chiedere il permesso.

            Il furiere ti consegna la paga del giuramento e ti assegna al posto
            di guardia della Città Bassa, nella casa di pietra blu.
          pe: { empatia: 5 }
          effetti: { fazione.caserma: 1, monete: 30, oggetto.caserma-mantello-scarlatto: 1 }
          almeno: { rep.caserma: 2 }
        fallimento:
          titolo: Lo scialle
          testo: |
            Attraversi il cortile, e a tre passi da lei capisci di non avere
            preparato niente. Le dici che ti dispiace, e lei ti guarda il
            colletto e poi la faccia, e si stringe lo scialle sulle spalle.
            «Grazie» dice, e scende la discesa più in fretta di come l'ha
            salita. Torni nella fila con il mantello che ti pesa sulla spalla
            sinistra.

            Il furiere ti consegna la paga del giuramento e ti assegna al posto
            di guardia della Città Bassa, nella casa di pietra blu.
          effetti: { fazione.caserma: 1, monete: 30, oggetto.caserma-mantello-scarlatto: 1, tormento: 0.5 }
          almeno: { rep.caserma: 2 }

      - testo: "Restituirle il mantello"
        descrizione: "È di suo figlio. Tu puoi aspettare quelli nuovi della Conceria, e fare le ronde senza."
        esito:
          titolo: Una settimana senza
          testo: |
            Ti togli il mantello in mezzo al cortile, lo pieghi come ti ha
            insegnato il furiere e glielo porti al portone. Lei lo prende con
            tutte e due le mani e non lo apre. Per una settimana esci di ronda
            in giubba, e le guardie del portone ti chiamano la recluta senza
            mantello. Il lunedì dopo arrivano quelli della Conceria, che
            puzzano ancora di tintura, e il furiere te ne consegna uno con la
            ricevuta e un'occhiata che non ti sa spiegare.

            {galateo Media} In Caserma il mantello si rende alla famiglia
            quando muore un capitano, e per le reclute il regolamento tace.
            Il furiere ha cercato la regola per vietarlo e non l'ha trovata.

            Ti assegnano al posto di guardia della Città Bassa, nella casa di
            pietra blu.
          pe: { galateo: 5 }
          effetti: { fazione.caserma: 1, monete: 30, oggetto.caserma-mantello-scarlatto: 1 }
          almeno: { rep.caserma: 2 }

      - testo: "Chiedere a Galdrick una pensione per lei"
        descrizione: "Il Consiglio non la vota. Lo sceriffo è alla finestra, e ha una cassa delle spese di servizio."
        immagine: personaggi/toren-galdrick
        quando: [galdrick.via == 0]
        prova: { attributo: sociale, abilita: persuasione, difficolta: Difficile }
        successo:
          titolo: Alla voce spese di servizio
          testo: |
            Sali in ufficio con il mantello addosso e lo dici a Galdrick
            senza girarci intorno. Lo sceriffo ascolta con i pollici nella
            cintura, poi guarda dalla finestra la donna al portone. «Il
            Consiglio non la vota da quattro anni» dice. «La vota il furiere,
            da oggi, alla voce spese di servizio, finché il Consiglio non si
            vergogna.» Scrive una riga sul taccuino e ti rimanda in cortile.

            {politica-ed-economia Media} La cassa delle spese di servizio non
            la controlla nessuno, ed è per questo che Galdrick ci fa passare
            le cose giuste.

            Il furiere ti consegna la paga del giuramento e ti assegna alla
            casa di pietra blu, in Città Bassa.
          pe: { persuasione: 5 }
          effetti: { fazione.caserma: 1, monete: 30, oggetto.caserma-mantello-scarlatto: 1, rep.caserma: 0.5 }
          imposta: { caserma.pensione: 1 }
          almeno: { rep.caserma: 2 }
        fallimento:
          titolo: Il Consiglio non vota
          testo: |
            Galdrick ti ascolta fino in fondo e ti risponde che ha chiesto la
            pensione al Consiglio quattro volte, e quattro volte la paga
            delle ronde è arrivata in ritardo per punizione. «Se la pago io,
            domani me ne chiedono trenta» dice, e si gira verso la finestra.
            Quando torni in cortile la donna non c'è più.

            Il furiere ti consegna la paga del giuramento e ti assegna alla
            casa di pietra blu, in Città Bassa.
          effetti: { fazione.caserma: 1, monete: 30, oggetto.caserma-mantello-scarlatto: 1 }
          almeno: { rep.caserma: 2 }

      - testo: "Giurare senza rispondere a Gasti"
        descrizione: "Prima della formula Gasti ti ha chiesto davanti a tutti da chi bevi alla Pignatta Grassa. Puoi giurare come se non avessi sentito."
        immagine: fazioni/scuri
        quando: [rep.scuri >= 3, pista.pelle < 6]
        esito:
          titolo: La domanda nel cortile
          testo: |
            Prima della formula Gasti si è fermato davanti a te e ti ha
            chiesto, abbastanza forte per il portico, da chi bevi la sera alla
            Pignatta Grassa. Tu hai guardato davanti a te e hai detto la
            formula con gli altri, e il sergente non ha insistito. Dopo, mentre
            il furiere ti consegna il mantello e la paga, due miliziani
            sotto il portico parlano a bassa voce e guardano dalla tua parte.
            La donna con lo scialle scende la discesa senza avvicinarsi.

            Ti assegnano alla casa di pietra blu, in Città Bassa, che è il
            posto dove si manda chi deve farsi conoscere.
          effetti: { fazione.caserma: 1, monete: 30, oggetto.caserma-mantello-scarlatto: 1, sospetto: 1 }
          almeno: { rep.caserma: 2 }

      - testo: "Rispondere a Gasti davanti a tutti"
        descrizione: "Prima della formula Gasti ti ha chiesto davanti a tutti da chi bevi alla Pignatta Grassa. Puoi dirglielo."
        immagine: fazioni/scuri
        quando: [rep.scuri >= 3, pista.pelle < 6]
        esito:
          titolo: Da Mauro
          testo: |
            «Da Mauro Scrocco» hai detto, «e pago io.» Il cortile si è fatto
            silenzioso, e Gasti ti ha guardato a lungo prima di andare avanti
            con la formula. Dopo il giuramento il sergente ti dice che lo
            sceriffo, queste cose, le scrive sul taccuino, e che una riga
            scritta da chi l'ha detta da solo vale più di dieci scritte da
            altri. In Città Bassa, entro sera, la tua risposta la conoscono già,
            e alla Pignatta qualcuno smette di offrirti da bere.

            Il furiere ti consegna il mantello e la paga del giuramento, e ti
            assegna alla casa di pietra blu.
          effetti: { fazione.caserma: 1, monete: 30, oggetto.caserma-mantello-scarlatto: 1, rep.scuri: -1 }
          almeno: { rep.caserma: 2 }

      - testo: "Portare il mantello in Cattedrale con lei"
        descrizione: "Al Velo i mantelli dei caduti si benedicono prima di passare a un altro. Qui non l'ha fatto nessuno."
        immagine: ambientazione/cattedrale-del-velo
        quando: [origine.accolito-del-velo >= 1]
        prova: { attributo: sociale, abilita: [empatia, galateo], difficolta: Media }
        successo:
          titolo: La benedizione dei mantelli
          testo: |
            Glielo proponi al portone, e lei ti guarda il saio che non porti
            più come se lo vedesse ancora. Scendete insieme fino alla
            Cattedrale, e nella cappella laterale un chierico che ti conosce
            dice le parole sul mantello aperto sopra l'altare, con il nome di
            Bruno rivolto verso l'alto. Lei tiene la mano sul rammendo per
            tutto il tempo. All'uscita ti dice che passerà al portone ogni
            tanto, a vedere se il mantello sta bene.

            {origine accolito-del-velo} Le parole le sapevi anche tu, e le
            labbra le hanno dette insieme al chierico. Per un momento hai
            avuto di nuovo le mani piene di cera.

            Il furiere ti consegna la paga del giuramento e ti assegna al posto
            di guardia della Città Bassa, nella casa di pietra blu.
          pe: { empatia: 5 }
          effetti: { fazione.caserma: 1, monete: 30, oggetto.caserma-mantello-scarlatto: 1 }
          almeno: { rep.caserma: 2 }
        fallimento:
          titolo: La cappella chiusa
          testo: |
            Scendete insieme fino alla Cattedrale, e la cappella laterale è
            chiusa per le pulizie. Il chierico di turno non ti riconosce e vi
            fa aspettare sui gradini fino a sera, e quando finalmente dice le
            parole le dice in fretta. Lei ti ringrazia lo stesso, ma sulla via
            del ritorno non parla.

            Il furiere ti consegna la paga del giuramento e ti assegna alla
            casa di pietra blu, in Città Bassa.
          effetti: { fazione.caserma: 1, monete: 30, oggetto.caserma-mantello-scarlatto: 1, tormento: 0.5 }
          almeno: { rep.caserma: 2 }

  # ------------------------------------------------------------ passo 4 · la casa di pietra blu
  - id: caserma-la-casa-di-pietra-blu
    presso: caserma-casa-blu
    immagine: ambientazione/citta-bassa
    titolo: La casa di pietra blu
    sommario: "Il registro delle denunce della casa blu ha le pagine bianche. Stamattina un bottaio è entrato con la bottega sfasciata e non vuole dire da chi."
    luogo: Città Bassa, il posto di guardia della casa di pietra blu
    area: citta-bassa
    requisiti: [fazione.caserma == 3]
    testo: |
      Il posto di guardia della Caserma in Città Bassa è una casa di pietra
      blu con le inferriate, e una stufa che fuma quando tira vento da nord.
      Sul banco c'è il registro delle denunce, aperto. Le ultime venti
      pagine sono bianche, e in cima a ognuna qualcuno ha scritto la data
      con cura, giorno dopo giorno, senza niente sotto.

      Il miliziano di turno con te è Fulvio Saldo, quello con la sciarpa
      tirata fino al naso. Tossisce quando passa qualcuno davanti alla
      finestra e smette quando la strada è vuota. In cucina, dietro la
      tenda, una donna minuta con le maniche arrotolate mescola una pentola
      e canticchia senza aprire la bocca. Fulvio ti dice che si chiama
      Brina, e che di Ghoran non bisogna chiederle niente.

      {medicina Facile} La tosse di Fulvio viene dalla gola. È una tosse da
      permesso, e lui la spende poco alla volta, perché sa che a un certo
      punto il sergente smetterà di crederci.

      Davanti al banco, con il cappello fra le mani, c'è un bottaio con le
      dita piene di schegge. Stanotte gli hanno sfasciato la bottega,
      le doghe sparse per la strada e il tornio spaccato. Vuole che la
      Guardia lo sappia. Non vuole firmare, e non vuole dire chi è stato.

      {conoscenze-della-strada Media} In Città Bassa chi firma una denuncia
      contro gli Scuri, o contro quello che ne resta, poi deve tornare a
      casa a piedi. Il bottaio lo sa, e sa anche che lo sai tu.

      {origine figlio-della-citta-bassa} Il bottaio sta in fondo al vicolo
      delle Fasce, dove da bambino andavi a rubare i cerchi di ferro per
      farli rotolare. Ti riconosce dalla voce prima che dalla faccia, e il
      mento gli si abbassa di un dito.

      *Una pagina bianca in più, se se ne va così.* Prendi la penna dal
      banco e la tieni in mano senza intingerla.
    opzioni:
      - testo: "Convincerlo a firmare la denuncia"
        descrizione: "Una firma sul registro è il primo nome in venti pagine. Bisogna fargli credere che la Guardia tornerà anche domani."
        prova: { attributo: sociale, abilita: [empatia, persuasione], difficolta: Media }
        successo:
          titolo: Il primo nome
          testo: |
            Gli chiedi del tornio, e lui te ne parla come di un parente
            malato, dal prezzo che l'ha pagato al nome di chi gliel'ha
            venduto. Poi gli prometti
            che la ronda passerà davanti alla sua bottega due volte a notte per
            un mese, e lo scrivi sul registro davanti a lui, con la data. Lui
            guarda la riga a lungo, e alla fine firma sotto. È il primo nome in
            venti pagine.

            {empatia Media} Non ha firmato per la promessa. Ha firmato perché
            l'hai scritta prima di chiedergli niente, e adesso è nero su bianco
            anche il tuo impegno.

            Fulvio tossisce, chiede il permesso ed esce.
          effetti: { nomea.citta-bassa: 0.5 }
          segue: caserma-il-facchino-che-scappa
        fallimento:
          titolo: Il cappello
          testo: |
            Gli dici che la Guardia lo proteggerà, e lui sorride come si
            sorride a un bambino. Si rimette il cappello, ti ringrazia per la
            pazienza ed esce senza firmare. Sulla porta si volta a guardare
            la strada nei due sensi, prima di uscirci.
          effetti: { tormento: 0.5 }

      - testo: "Cercare da soli chi è stato"
        descrizione: "In Città Bassa una bottega sfasciata la vede mezza strada. Qualcuno, per un prezzo, parla."
        prova: { attributo: sociale, abilita: conoscenze-della-strada, difficolta: Media }
        successo:
          titolo: Il ragazzo con il cappuccio
          testo: |
            Fai il giro delle botteghe vicine e compri un mezzo pane da una
            fornaia che vede tutto dalla finestra. Ti dice che è stato un
            ragazzo con il cappuccio degli Scuri, uno che riscuote per conto
            suo da quando nessuno gli dice più quanto chiedere, e che stanotte
            dorme al fienile dietro la conceria. Lo trovi lì, con il
            sacchetto dei soldi del bottaio ancora sotto la testa.

            {intimidire Facile} Ha diciassette anni e il coltello più grande
            della sua mano. Quando vede il mantello scarlatto lo lascia
            cadere prima ancora che tu dica niente.

            Il bottaio, quando gli riporti il sacchetto, firma la denuncia
            senza farsi pregare. Fulvio tossisce, chiede il permesso ed esce.
          pe: { conoscenze-della-strada: 3 }
          effetti: { nomea.citta-bassa: 0.5, monete: 2 }
          segue: caserma-il-facchino-che-scappa
        fallimento:
          titolo: Mezzo pane
          testo: |
            Fai il giro delle botteghe vicine e trovi soltanto porte che si
            chiudono quando vedono il mantello. Una fornaia ti vende mezzo pane
            al prezzo di uno intero e ti dice che stanotte dormiva. Torni alla
            casa blu con il pane, e il bottaio se n'è già andato.
          effetti: { monete: -1 }

      - testo: "Fare come gli Scuri e metterlo alle strette"
        descrizione: "Se ha più paura di te che di loro, firma. Funziona sempre, e in Città Bassa se lo ricordano."
        prova: { attributo: sociale, abilita: intimidire, difficolta: Facile }
        successo:
          titolo: La firma storta
          testo: |
            Chiudi la porta, ti appoggi al banco e gli dici che senza firma la
            Guardia non può fare niente, e che una Guardia che non può fare
            niente, stanotte, passerà da un'altra parte. Lui firma. La firma
            gli viene storta, e la penna fa un buco nella carta. Quando esce,
            dalla cucina non arriva più il canticchiare di Brina, e per il
            resto del pomeriggio, quando le chiedi qualcosa, ti risponde con
            un cenno.

            {empatia Facile} Brina ha già sentito parlare così, in un altro
            posto. Ha smesso di cantare per non farsi notare.

            Fulvio tossisce, chiede il permesso ed esce.
          effetti: { nomea.citta-bassa: -1 }
          segue: caserma-il-facchino-che-scappa
        fallimento:
          titolo: La porta aperta
          testo: |
            Ti appoggi al banco e alzi la voce, e il bottaio fa un passo
            indietro e poi un altro, finché non è sulla porta. Se ne va senza
            firmare, e sulla strada lo sente mezzo vicolo raccontare che alla
            casa blu adesso parlano come gli Scuri.
          effetti: { nomea.citta-bassa: -0.5 }

      - testo: "Passare la giornata al banco"
        descrizione: "Se la casa blu resta aperta tutto il giorno con qualcuno al banco, verso sera qualcuno entra a denunciare."
        costo: 2
        esito:
          titolo: Le pagine bianche
          testo: |
            Il bottaio se ne va senza firmare, e tu resti al banco fino a sera.
            Entra una vecchia per un gatto, che è sul tetto e non vuole
            scendere, poi un uomo per una lite di confine fra due vasi di
            gerani. Li scrivi tutti e due sul registro con la data e la firma,
            e al tramonto le pagine bianche sono diciotto. A metà pomeriggio
            Brina ti porta una scodella di zuppa senza che tu la chieda.

            {resilienza Facile} La giornata è lunga e la sedia è dura, e non
            succede niente di importante. Ma il registro è un po' meno bianco,
            ed è per questo che sei qui.

            Fulvio tossisce, chiede il permesso ed esce.
          pe: { resilienza: 3 }
          segue: caserma-il-facchino-che-scappa

      - testo: "Parlargli come uno del vicolo delle Fasce"
        descrizione: "Il bottaio ti ha riconosciuto. Uno del vicolo, a uno del vicolo, la firma la dà."
        quando: [origine.figlio-della-citta-bassa >= 1]
        prova: { attributo: sociale, abilita: [conoscenze-della-strada, empatia], difficolta: Facile }
        successo:
          titolo: I cerchi di ferro
          testo: |
            Gli ricordi i cerchi di ferro che gli rubavi, e lui ride per la
            prima volta e ti dice che lo sapeva benissimo, e che li lasciava
            fuori apposta. Poi firma, perché a uno del vicolo si firma. Della
            ronda davanti alla bottega non vuole sapere. Vuole che ci passi tu,
            la sera, senza mantello.

            Fulvio tossisce, chiede il permesso ed esce.
          effetti: { nomea.citta-bassa: 0.5 }
          segue: caserma-il-facchino-che-scappa
        fallimento:
          titolo: Uno del vicolo
          testo: |
            Gli parli come uno del vicolo, e lui ti guarda il mantello
            scarlatto e ti risponde come si risponde alla Guardia. Se ne va
            senza firmare, con il cappello in testa.
          effetti: { tormento: 0.5 }

  - id: caserma-il-facchino-che-scappa
    immagine: ambientazione/ponti-sospesi
    titolo: Il facchino che scappa
    tipo: seguito
    luogo: Città Bassa, la casa di pietra blu, a sera
    area: citta-bassa
    requisiti: [fazione.caserma == 3]
    testo: |
      A sera Fulvio non è ancora tornato dal permesso. Accendi la lanterna
      sopra la porta, e mentre la stai appendendo un ragazzino ti passa
      sotto il braccio e si infila nella casa blu di corsa, con una gerla
      vuota sulle spalle e le ginocchia nere di catrame. Avrà quattordici
      anni. Si ferma davanti al banco con il fiato corto e guarda il
      registro, e dopo il registro te.

      «Sotto il Ponte delle Mille Corde» dice, «ieri notte. Uno con il
      mantello come il tuo prendeva i soldi da uno con il cappuccio. Li
      contava sulla mano.» Inghiotte. «E adesso mi cercano. Due, da
      stamattina.»

      {percezione Media} Le ginocchia nere sono di catrame delle reti, quello
      che si spalma sulle corde dei sottoponti. Dorme là sotto, e stanotte ci
      deve tornare.

      {empatia Media} Non è venuto per denunciare nessuno. È venuto perché
      la casa blu è l'unico posto con la lanterna accesa, e adesso che è
      dentro non sa più se ha fatto bene.

      Brina esce dalla cucina con il mestolo in mano. Quando lo vede dice
      piano un nome, *Nando*. Il ragazzino si volta verso di lei, poi verso la
      porta, e prima che tu possa allungare una mano è già fuori, giù per il
      vicolo, verso i Ponti.
    opzioni:
      - testo: "Corrergli dietro"
        descrizione: "Un facchino dei Ponti corre più svelto di un miliziano. Ma tu non porti la gerla."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Media }
        successo:
          titolo: La scala di corda
          testo: |
            Lo segui fino all'imbocco del Ponte delle Mille Corde, e lì lo
            vedi scavalcare il parapetto e sparire giù per una scala di corda,
            sotto le assi. Ti affacci. La scala scende nel buio fra le travi,
            e dal fondo arriva il rumore delle reti che dondolano. Prendi nota
            del pilone, il terzo dopo il gabbiotto dei Custodi, e torni alla
            casa blu a scrivere sul registro la prima denuncia che non ha
            firmato nessuno.

            {atletica Facile} Sei arrivato al parapetto un passo dopo di lui.
            Ancora un passo e l'avresti preso per la gerla, e adesso saresti
            appeso anche tu a quella scala.
          pe: { atletica: 3 }
          effetti: { fazione.caserma: 1, rep.caserma: 0.5 }
        fallimento:
          titolo: I panni stesi
          testo: |
            Lo perdi al secondo incrocio, fra i panni stesi, e torni alla casa
            blu con un lenzuolo bagnato sulla spalla che non è tuo. Brina ti
            guarda dalla porta della cucina, e quando le chiedi dove dorme il
            ragazzino ti dice soltanto che dorme sotto le assi, dove dormono
            tutti quelli che non hanno un posto.
          effetti: { fazione.caserma: 1 }

      - testo: "Chiedere a Brina chi è"
        descrizione: "Brina l'ha chiamato per nome. Forse gli dà la zuppa anche lui."
        prova: { attributo: sociale, abilita: [empatia, galateo], difficolta: Facile }
        successo:
          titolo: Nando Rizza
          testo: |
            Brina rimette il mestolo nella pentola prima di rispondere. «Nando
            Rizza» dice. «Porta le gerle al Mercato dei Nodi. Viene la sera, si
            mangia la zuppa sulla porta e se ne va, e io non gli chiedo niente
            perché lui non chiede niente a me.» Ti versa una scodella anche per
            te. «Dorme nelle reti sotto il Ponte delle Mille Corde. Se lo
            cercano quelli, lo trovano.»

            {origine fuggiasco-di-ghoran} Brina tiene il mestolo con la mano
            sinistra e la destra chiusa contro il fianco, e sul polso destro ha
            una riga chiara che conosci. Lei vede che la guardi e tira giù la
            manica.

            Scrivi sul registro la prima denuncia che non ha firmato nessuno.
          pe: { empatia: 3 }
          effetti: { fazione.caserma: 1, rep.caserma: 0.5 }
        fallimento:
          titolo: La tenda
          testo: |
            Brina ti guarda, poi torna in cucina e tira la tenda. Dopo un poco
            la senti riprendere a mescolare, più in fretta di prima. Scrivi sul
            registro la prima denuncia che non ha firmato nessuno, e sotto
            scrivi *facchino, quattordici anni, Ponte delle Mille Corde*, che
            è tutto quello che sai.
          effetti: { fazione.caserma: 1 }

      - testo: "Scrivere tutto sul registro e aspettare Fulvio"
        descrizione: "Il ragazzino ha visto un mantello scarlatto. Prima di correre da qualche parte, conviene sapere quali mantelli erano in giro ieri notte."
        esito:
          titolo: Il registro dei turni
          testo: |
            Scrivi la denuncia del ragazzino sul registro insieme all'ora e
            al pilone, poi apri il registro dei turni. Ieri notte, sotto il
            Ponte delle Mille Corde, la ronda non era prevista. Fulvio rientra
            un'ora dopo la fine del permesso, con la sciarpa sul naso e il
            fiato che sa di vino, e tossisce quando apri la porta.

            {ingannare Media} La tosse arriva un momento prima che lui ti veda,
            e smette appena ti ha visto. Si era preparato a trovare il
            sergente.
          pe: { percezione: 3 }
          effetti: { fazione.caserma: 1, rep.caserma: 0.5 }
