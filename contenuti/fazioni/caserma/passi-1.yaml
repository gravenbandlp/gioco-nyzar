# La quest della Caserma, passi 1, 3 e 4 (il passo 2, la ronda di notte, sta in citta/guarnigione.yaml; il 5, sotto
# le assi, in spedizione-sotto-le-assi.yaml).
# 1 il registro del furiere: Duilio Gasti mette alla prova l'ausiliario nel cortile; chi fallisce entra con riserva.
# 3 il mantello di Bruno Lesca (grado 1, Miliziano): i mantelli dei morti in magazzino, poi il giuramento in cortile
#   e la madre di Bruno sulla discesa. Con rep.scuri >= 3 (prima della Pignatta) Gasti chiede da chi bevi.
# 4 la casa di pietra blu: il posto di guardia in Città Bassa (luogo caserma-casa-blu), il bottaio che non vuole
#   firmare e, a sera, Nando Rizza che entra di corsa e scappa nei sottoponti.
storylet:
  # ------------------------------------------------------------ passo 1 · il registro del furiere
  - id: caserma-il-registro-del-furiere
    presso: guarnigione-di-qir-azel
    immagine: ambientazione/guarnigione-di-qir-azel
    titolo: Il registro del furiere
    sommario: "Il furiere della Caserma scrive a registro chiunque abbia due braccia buone. Prima, però, il sergente d'addestramento vuole vederle lavorare."
    luogo: Guarnigione di Qir-Azel, il banco del furiere e il cortile
    area: quartieri-alti
    requisiti: [fazione.caserma == 0, pista.capomozzo >= 10]
    testo: |
      Il furiere tiene il banco delle consegne in fondo al corridoio del mastio e ti ascolta con la penna
      sospesa sopra il registro. Ti spiega che dopo la razzia la Caserma ha più mantelli che uomini. Gli
      ausiliari a giornata li scrive in fondo alla pagina, con la paga quando arriva. Alle sue spalle gli
      scaffali sono pieni di mantelli scarlatti piegati con il cartellino.

      Sopra il banco, in una teca di vetro, c'è una spada lunga su un panno rosso stinto. Il filo è ammaccato
      a metà lama, e sul cartiglio c'è un nome solo, *Ivo Carstan*.

      {accademiche Media} Ivo Carstan era lo sceriffo di Qir-Azel prima di Galdrick, e il Cucitore lo prese in
      un vicolo l'ultima delle Notti Cucite.

      «Per il registro mi basta una firma» dice il furiere, e indica il cortile con la penna. «Gasti di solito
      vuole qualcosa di più.»

      Nel cortile il sergente Duilio Gasti conta le parate di sei reclute davanti ai manichini di paglia, e
      quando una sbaglia ricomincia da uno.

      {origine apprendista-raschiatore} In questo cortile il Ferro e la Guardia si addestrano insieme, e tre
      reclute portano sopra la giubba la cintura dei Raschiatori. Ti riconoscono dal modo in cui misuri con
      gli occhi il cammino di ronda.
    opzioni:
      - testo: "Parare ai manichini davanti alle reclute"
        descrizione: "Gasti ti mette in mano una spada di legno e conta. Si arriva a dodici senza sbagliare."
        prova: { attributo: fisico, abilita: armi-da-mischia, difficolta: Media }
        successo:
          titolo: Dodici
          testo: |
            Gasti conta, e tu pari. Al dodici il sergente tace. Poi ti prende la
            spada di mano, la soppesa come se volesse capire dove sta il trucco, e
            la rimette nella rastrelliera.

            Il furiere scrive il tuo nome in fondo alla pagina e ti fa firmare la
            ricevuta della giornata. Mentre soffia sull'inchiostro ti dice che una
            faccia che i suoi sergenti non conoscono gli tornerà utile.
          pe: { armi-da-mischia: 3 }
          effetti: { fazione.caserma: 1, rep.caserma: 0.5, monete: 3 }
        fallimento:
          titolo: Da uno
          testo: |
            Al quinto colpo la spada di legno ti salta di mano e finisce sotto la
            rastrelliera, e Gasti ricomincia da uno. Il sergente non alza la voce.
            Ti dice che per oggi va bene così, e che domani all'alba le latrine
            del cortile hanno bisogno di qualcuno.

            Il furiere ti scrive in fondo alla pagina con una crocetta accanto,
            che vuol dire con riserva, e ti fa firmare lo stesso.
          effetti: { fazione.caserma: 1, ferite: 0.5 }

      - testo: "Correre il giro del cammino di ronda"
        descrizione: "Dal portone alla torre nord e ritorno, sulle mura, prima che Gasti finisca di contare fino a cento."
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Media }
        successo:
          titolo: Prima del cento
          testo: |
            Alla torre nord tocchi il muro con la mano aperta, come ti ha detto
            Gasti, e torni indietro con il vento in faccia. Quando rimetti piede
            nel cortile il sergente è arrivato a novantuno.

            Il furiere ti fa firmare la ricevuta e ti dice, soffiando
            sull'inchiostro, che una faccia che i suoi sergenti non conoscono gli
            tornerà utile.
          pe: { atletica: 3 }
          effetti: { fazione.caserma: 1, rep.caserma: 0.5, monete: 3 }
        fallimento:
          titolo: Centoventi
          testo: |
            A metà strada il fiato ti abbandona, e alla torre nord ci arrivi
            camminando, con una mano sul fianco. Gasti finisce di contare fino
            a cento mentre sei ancora sulle mura, e poi continua, a voce un po'
            più bassa, per educazione. Rientri a centoventi. Il sergente ti
            dice che domani all'alba le latrine del cortile hanno bisogno di
            qualcuno, e che lì le gambe non servono.

            Il furiere ti scrive in fondo alla pagina con una crocetta
            accanto, che vuol dire con riserva.
          effetti: { fazione.caserma: 1, ferite: 0.5 }

      - testo: "Recitare il regolamento a memoria"
        descrizione: "Gasti ti dà un libretto cucito a mano con il regolamento della Guardia. Hai il tempo di una parata per impararne la prima pagina."
        prova: { attributo: mentale, abilita: accademiche, difficolta: Facile }
        successo:
          titolo: Articolo primo
          testo: |
            Il libretto ha gli angoli molli di chi l'ha tenuto in tasca per anni,
            e la prima pagina dice chi può fermare chi e per quanto tempo lo si
            può tenere in cella. La reciti a Gasti senza saltare una virgola.

            Il furiere ti scrive e ti dice che una faccia che i suoi sergenti non
            conoscono gli tornerà utile.
          pe: { accademiche: 3 }
          effetti: { fazione.caserma: 1, rep.caserma: 0.5, monete: 3 }
        fallimento:
          titolo: Il libretto in tasca
          testo: |
            Le parole della prima pagina ti si confondono con quelle della
            seconda, e quando Gasti ti chiede chi può fermare chi rispondi con
            sicurezza una cosa che nel regolamento non c'è. Le reclute ridono.
            Il sergente ti lascia il libretto e ti dice di riportarglielo
            domani all'alba, dopo il turno alle latrine.

            Il furiere ti scrive in fondo alla pagina, con una crocetta accanto
            che vuol dire con riserva.
          effetti: { fazione.caserma: 1, tormento: 1 }

      - testo: "Far tornare un conto al furiere"
        descrizione: "Sul registro i mantelli in magazzino e gli uomini in servizio non tornano da una settimana, e il furiere ci ha passato le notti."
        prova: { attributo: mentale, abilita: politica-ed-economia, difficolta: Media }
        successo:
          titolo: Due righe
          testo: |
            Ci metti un'ora di colonne, e alla fine trovi due mantelli scritti due volte nella stessa riga, alla consegna come alla
            restituzione, con la stessa grafia tonda. Il furiere guarda le due righe a lungo. Poi ci tira sopra una linea sottile con
            il righello e ti scrive sul registro in bella, in fondo alla pagina, senza passare dal cortile.

            Ti dice che una faccia che i suoi sergenti non conoscono gli tornerà utile.
          pe: { politica-ed-economia: 3 }
          effetti: { fazione.caserma: 1, rep.caserma: 0.5, monete: 3 }
        fallimento:
          titolo: Il conto del furiere
          testo: |
            Ci metti un'ora e trovi un errore, e il furiere ti mostra con la punta
            della penna che l'errore l'hai fatto tu, alla terza colonna. Poi ti
            manda in cortile da Gasti, che non ha tempo per le prove e ti mette
            per l'indomani al turno delle latrine.

            Il furiere ti scrive in fondo alla pagina con una crocetta accanto,
            che vuol dire con riserva.
          effetti: { fazione.caserma: 1, tormento: 1 }

      - testo: "Firmare con riserva e prendere il turno delle latrine"
        descrizione: "Gasti ha da fare con le reclute. Il furiere ti scrive subito, se accetti il turno delle latrine."
        costo: 2
        esito:
          titolo: Il turno dell'alba
          testo: |
            Il furiere ti scrive in fondo alla pagina, con una crocetta accanto
            che vuol dire con riserva, e Gasti ti affida un secchio e una spazzola
            dalle setole consumate. Passi l'alba alle latrine del cortile, mentre
            le reclute si allenano a dieci passi da te e fanno finta di non
            sentire l'odore. A mezzogiorno il sergente passa a controllare. Annusa
            l'aria, e poi cancella la crocetta con il pollice.
          pe: { resistenza: 3 }
          effetti: { fazione.caserma: 1 }

  # ------------------------------------------------------------ passo 3 · il mantello di Bruno Lesca (grado 1)
  - id: caserma-i-mantelli-dei-morti
    presso: guarnigione-di-qir-azel
    immagine: ambientazione/guarnigione-di-qir-azel
    titolo: I mantelli dei morti
    sommario: "Domani c'è il giuramento, e i mantelli nuovi non sono arrivati. Il furiere distribuisce quelli che ha sugli scaffali."
    luogo: Guarnigione di Qir-Azel, il magazzino del furiere
    area: quartieri-alti
    requisiti: [fazione.caserma == 2]
    testo: |
      I mantelli nuovi per il giuramento dovevano arrivare dalla Conceria Kasselt una settimana fa, e non sono
      arrivati. Il furiere consegna alle reclute in fila quelli degli scaffali, e prima stacca i cartellini
      con le forbici senza leggerli e li mette in una scatola di latta sotto il banco.

      Il tuo è di lana grossa tinta di rosso, con un rammendo a punti fitti sulla spalla sinistra. Dentro il
      colletto c'è un nome ricamato in filo nero, *Bruno Lesca*.

      {empatia Facile} Anche due delle reclute davanti a te hanno trovato un nome, e una ha già girato il
      colletto all'esterno perché non le tocchi il collo.

      Dietro la fila Linna Varo ti fa un cenno con il mento.
    opzioni:
      - testo: "Chiedere al furiere chi era Bruno Lesca"
        descrizione: "I cartellini sono nella scatola di latta, e il furiere ha un registro anche per i morti."
        prova: { attributo: sociale, abilita: [empatia, persuasione], difficolta: Media }
        successo:
          titolo: La scatola di latta
          testo: |
            «Bruno Lesca, ventidue anni, torre nord» legge. «La madre sta in fondo
            alla discesa, nella casa con la grondaia verde. Viene al portone il
            primo del mese e chiede se è arrivato niente per lei.» Chiude il
            registro tenendoci dentro il dito, come se dovesse riaprirlo presto.
            «Non arriva mai niente, perché il Consiglio la pensione non la vota.»
          segue: caserma-il-giuramento
        fallimento:
          titolo: I morti si contano
          testo: |
            Il furiere ti guarda da sopra gli occhiali e continua a consegnare
            mantelli. «Il registro dei morti lo apro per i parenti, non per le
            reclute» dice, e passa a quella dopo di te. Tu torni nella fila con il
            mantello sul braccio e la sensazione di avere chiesto troppo
            presto una cosa che si chiede dopo.
          segue: caserma-il-giuramento
          effetti: { scandalo: 0.5 }

      - testo: "Rivoltare il colletto come la recluta davanti a te"
        descrizione: "Il nome resta dentro la lana, solo che non ti tocca più il collo."
        esito:
          titolo: Il colletto
          testo: |
            Rivolti il colletto all'esterno e lo appunti con uno spillo che ti
            presta Linna. Il nome adesso guarda fuori, verso chi ti sta
            davanti, e a te tocca soltanto la lana ruvida della fodera. Linna ti
            guarda fare e poi rivolta il suo, benché dentro il suo colletto
            non ci sia scritto niente.
          segue: caserma-il-giuramento

      - testo: "Provare la formula con Gasti"
        descrizione: "Il sergente sbaglia sempre la stessa parola del giuramento, e domani la dovrà dire davanti a tutto il cortile."
        prova: { attributo: sociale, abilita: [espressivita, galateo], difficolta: Media }
        successo:
          titolo: Davanti alla città
          testo: |
            Ti metti davanti a Gasti come se fossi la recluta e lui lo sceriffo, e
            gli fai ripetere la formula finché non arriva in fondo senza
            inciampare. La parola sbagliata è *custodire*, e lui da vent'anni dice
            *custodiare*. Alla quinta volta la dice giusta, e si gira verso il
            cortile vuoto per controllare che nessuno abbia sentito le prime
            quattro.
          pe: { espressivita: 3 }
          segue: caserma-il-giuramento
        fallimento:
          titolo: Custodiare
          testo: |
            Gli fai ripetere la formula tre volte, e alla terza la sbagli anche
            tu, nello stesso punto. Gasti scoppia a ridere e ti dà una manata
            sulla spalla. «Bene, domani la diciamo sbagliata in due, e se siamo
            in due nessuno se ne accorge» dice.
          segue: caserma-il-giuramento
          effetti: { scandalo: 0.5 }

  - id: caserma-il-giuramento
    immagine: ambientazione/guarnigione-di-qir-azel
    titolo: Il giuramento
    tipo: seguito
    luogo: Guarnigione di Qir-Azel, il cortile
    area: quartieri-alti
    requisiti: [fazione.caserma == 2]
    testo: |
      Il giuramento si fa nel cortile quando il sole arriva sopra le mura, con le reclute in fila e gli
      anziani sotto il portico. Gasti legge la formula e voi la ripetete una frase alla volta, sotto la
      finestra aperta dell'ufficio dello sceriffo.

      A metà formula una donna sale piano la discesa con uno scialle grigio e le scarpe della domenica, e al
      portone non entra. Si ferma accanto alle guardie a guardare i mantelli, e ti accorgi che li sta
      contando.

      {empatia Media} Cerca un rammendo sulla spalla sinistra, e l'ha già trovato.

      Gasti arriva a *custodire* e lo dice giusto. Poi chiude il libretto e vi dichiara miliziani della
      Guardia di Qir-Azel, con la paga piena per le ronde. La donna è ancora al portone.
    opzioni:
      - testo: "Andarle a dire che il mantello ce l'hai tu"
        descrizione: "Attraversi il cortile davanti a tutti, con il nome di suo figlio sul collo."
        prova: { attributo: sociale, abilita: empatia, difficolta: Media }
        successo:
          titolo: Il rammendo
          testo: |
            Attraversi il cortile e ti fermi davanti a lei senza avere preparato una
            parola, così le dici il tuo nome. Lei allunga una mano e tocca il rammendo
            sulla spalla, i punti fitti uno per uno, come si contano le perle di una
            collana. «L'ha cucito bene» dice. «Il furiere. Bruno non lo avrebbe mai cucito
            così bene.»

            Il furiere ti consegna la paga del giuramento e ti assegna al posto di guardia
            della Città Bassa, nella casa di pietra blu.
          pe: { empatia: 5 }
          effetti: { fazione.caserma: 1, monete: 30, oggetto.caserma-mantello-scarlatto: 1 }
          almeno: { rep.caserma: 2 }
        fallimento:
          titolo: Lo scialle
          testo: |
            Attraversi il cortile, e a tre passi da lei capisci di non avere
            preparato niente. Le dici che ti dispiace, e lei ti guarda il
            colletto e poi la faccia, e si stringe lo scialle sulle spalle.
            «Grazie» dice, e scende la discesa più in fretta di come l'ha
            salita. Torni nella fila con il mantello che ti pesa sulla spalla
            sinistra.

            Il furiere ti consegna la paga del giuramento e ti assegna al posto
            di guardia della Città Bassa, nella casa di pietra blu.
          effetti: { fazione.caserma: 1, monete: 30, oggetto.caserma-mantello-scarlatto: 1, tormento: 1 }
          almeno: { rep.caserma: 2 }

      - testo: "Restituirle il mantello"
        descrizione: "È di suo figlio. Tu puoi aspettare quelli nuovi della Conceria, e fare le ronde senza."
        esito:
          titolo: Una settimana senza
          testo: |
            Ti togli il mantello in mezzo al cortile, lo pieghi come ti ha
            insegnato il furiere e glielo porti al portone. Lei lo prende con
            tutte e due le mani e non lo apre. Il lunedì dopo arrivano quelli
            della Conceria, che puzzano ancora di tintura, e il furiere te ne
            consegna uno con la ricevuta e un'occhiata che non ti sa spiegare.

            Ti assegnano al posto di guardia della Città Bassa, nella casa di
            pietra blu.
          pe: { galateo: 5 }
          effetti: { fazione.caserma: 1, monete: 30, oggetto.caserma-mantello-scarlatto: 1 }
          almeno: { rep.caserma: 2 }

      - testo: "Chiedere a Galdrick una pensione per lei"
        descrizione: "Il Consiglio non la vota. Lo sceriffo è alla finestra, e ha una cassa delle spese di servizio."
        immagine: personaggi/toren-galdrick
        quando: [galdrick.via == 0]
        prova: { attributo: sociale, abilita: persuasione, difficolta: Difficile }
        successo:
          titolo: Alla voce spese di servizio
          testo: |
            Sali in ufficio con il mantello addosso e lo dici a Galdrick senza
            girarci intorno. «Il Consiglio non la vota da quattro anni» dice. «Da
            oggi la paga il furiere, alla voce spese di servizio, finché il
            Consiglio non si decide.» Scrive una riga sul taccuino e ti rimanda
            in cortile.

            Il furiere ti consegna la paga del giuramento e ti assegna alla casa
            di pietra blu, in Città Bassa.
          pe: { persuasione: 5 }
          effetti: { fazione.caserma: 1, monete: 30, oggetto.caserma-mantello-scarlatto: 1, rep.caserma: 0.5 }
          imposta: { caserma.pensione: 1 }
          almeno: { rep.caserma: 2 }
        fallimento:
          titolo: Il Consiglio non vota
          testo: |
            Galdrick ti ascolta fino in fondo e ti risponde che ha chiesto la
            pensione al Consiglio quattro volte, e quattro volte la paga
            delle ronde è arrivata in ritardo per punizione. «Se la pago io,
            domani me ne chiedono trenta» dice, e si gira verso la finestra.
            Quando torni in cortile la donna non c'è più.

            Il furiere ti consegna la paga del giuramento e ti assegna alla
            casa di pietra blu, in Città Bassa.
          effetti: { fazione.caserma: 1, monete: 30, oggetto.caserma-mantello-scarlatto: 1, tormento: 0.5 }
          almeno: { rep.caserma: 2 }

      - testo: "Giurare senza rispondere a Gasti"
        descrizione: "Prima della formula Gasti ti ha chiesto davanti a tutti da chi bevi alla Pignatta Grassa. Puoi giurare come se non avessi sentito."
        immagine: fazioni/scuri
        quando: [rep.scuri >= 3, pista.pelle < 6]
        esito:
          titolo: La domanda nel cortile
          testo: |
            Prima della formula Gasti si è fermato davanti a te e ti ha chiesto,
            abbastanza forte per il portico, da chi bevi la sera alla Pignatta
            Grassa. Dopo, mentre il furiere ti consegna il mantello e la paga, due
            miliziani sotto il portico parlano a bassa voce e guardano dalla tua
            parte.

            Ti assegnano alla casa di pietra blu, in Città Bassa, che è il posto
            dove si manda chi deve farsi conoscere.
          effetti: { fazione.caserma: 1, monete: 30, oggetto.caserma-mantello-scarlatto: 1, sospetto: 1.5 }
          almeno: { rep.caserma: 2 }

      - testo: "Rispondere a Gasti davanti a tutti"
        descrizione: "Prima della formula Gasti ti ha chiesto davanti a tutti da chi bevi alla Pignatta Grassa. Puoi dirglielo."
        immagine: fazioni/scuri
        quando: [rep.scuri >= 3, pista.pelle < 6]
        esito:
          titolo: Da Mauro
          testo: |
            «Da Mauro Scrocco» hai detto, «e pago io.» Dopo il giuramento il
            sergente ti dice che lo sceriffo queste cose le scrive sul taccuino,
            e che è meglio se le trova dette da te che riferite da un altro.
            In Città Bassa, entro sera, la tua risposta la
            conoscono già, e alla Pignatta qualcuno smette di offrirti da bere.

            Il furiere ti consegna il mantello e la paga del giuramento, e ti
            assegna alla casa di pietra blu.
          effetti: { fazione.caserma: 1, monete: 30, oggetto.caserma-mantello-scarlatto: 1, rep.scuri: -1 }
          almeno: { rep.caserma: 2 }

      - testo: "Portare il mantello in Cattedrale con lei"
        descrizione: "Al Velo i mantelli dei caduti si benedicono prima di passare a un altro. Qui non l'ha fatto nessuno."
        immagine: ambientazione/cattedrale-del-velo
        quando: [origine.accolito-del-velo >= 1]
        prova: { attributo: sociale, abilita: [empatia, galateo], difficolta: Media }
        successo:
          titolo: La benedizione dei mantelli
          testo: |
            Glielo proponi al portone, e lei ti guarda il saio che non porti più
            come se lo vedesse ancora. Scendete insieme fino alla Cattedrale, e
            nella cappella laterale un chierico che ti conosce dice le parole sul
            mantello aperto sopra l'altare, con il nome di Bruno rivolto verso
            l'alto.

            {origine accolito-del-velo} Le parole le sapevi anche tu, e le labbra
            le hanno dette insieme al chierico. Per un momento hai avuto di nuovo
            le mani piene di cera.

            Il furiere ti consegna la paga del giuramento e ti assegna al posto di
            guardia della Città Bassa, nella casa di pietra blu.
          pe: { empatia: 5 }
          effetti: { fazione.caserma: 1, monete: 30, oggetto.caserma-mantello-scarlatto: 1 }
          almeno: { rep.caserma: 2 }
        fallimento:
          titolo: La cappella chiusa
          testo: |
            Scendete insieme fino alla Cattedrale, e la cappella laterale è
            chiusa per le pulizie. Il chierico di turno non ti riconosce e vi
            fa aspettare sui gradini fino a sera, e quando finalmente dice le
            parole le dice in fretta. Lei ti ringrazia lo stesso, ma sulla via
            del ritorno non parla.

            Il furiere ti consegna la paga del giuramento e ti assegna alla
            casa di pietra blu, in Città Bassa.
          effetti: { fazione.caserma: 1, monete: 30, oggetto.caserma-mantello-scarlatto: 1, tormento: 1 }
          almeno: { rep.caserma: 2 }

  # ------------------------------------------------------------ passo 4 · la casa di pietra blu
  - id: caserma-la-casa-di-pietra-blu
    presso: caserma-casa-blu
    immagine: ambientazione/citta-bassa
    titolo: La casa di pietra blu
    sommario: "Stamattina un bottaio è entrato con la bottega sfasciata e non vuole dire da chi."
    luogo: Città Bassa, il posto di guardia della casa di pietra blu
    area: citta-bassa
    requisiti: [fazione.caserma == 3]
    testo: |
      Il posto di guardia della Caserma in Città Bassa è una casa di pietra blu con le inferriate e una stufa
      che fuma. Sul banco è aperto il registro delle denunce. Le ultime venti pagine sono bianche, e in cima a
      ognuna qualcuno ha scritto con cura la data senza niente sotto.

      Di turno con te c'è Fulvio Saldo, quello con la sciarpa tirata fino al naso. Una donna minuta mescola
      una pentola in cucina dietro la tenda e canticchia a bocca chiusa. Fulvio ti dice che si chiama Brina e
      che di Ghoran non bisogna chiederle niente.

      Davanti al banco c'è un bottaio con il cappello fra le mani. Stanotte gli hanno sfasciato la bottega e
      spaccato il tornio, e vuole che la Guardia lo sappia. Non vuole firmare, e non vuole dire chi è stato.

      {conoscenze-della-strada Media} In Città Bassa chi firma una denuncia contro gli Scuri poi deve tornare
      a casa a piedi. Il bottaio lo sa, e sa che lo sai anche tu.

      {origine figlio-della-citta-bassa} Il bottaio sta in fondo al vicolo delle Fasce, dove da bambin{o|a}
      andavi a rubare i cerchi di ferro. Ti riconosce dalla voce prima che dalla faccia.
    opzioni:
      - testo: "Convincerlo a firmare la denuncia"
        descrizione: "Una firma sul registro è il primo nome in venti pagine. Bisogna fargli credere che la Guardia tornerà anche domani."
        prova: { attributo: sociale, abilita: [empatia, persuasione], difficolta: Media }
        successo:
          titolo: Il primo nome
          testo: |
            Gli chiedi del tornio, e lui te ne parla come di un parente malato,
            dal prezzo che l'ha pagato al nome di chi gliel'ha venduto. Poi gli
            prometti che la ronda passerà davanti alla sua bottega due volte a
            notte per un mese, e lo scrivi sul registro davanti a lui, con la
            data. Lui guarda la riga a lungo, e alla fine firma sotto.

            Fulvio tossisce, chiede il permesso ed esce.
          effetti: { nomea.citta-bassa: 0.5 }
          segue: caserma-il-facchino-che-scappa
        fallimento:
          titolo: Il cappello
          testo: |
            Gli dici che la Guardia lo proteggerà, e lui sorride come si
            sorride a un bambino. Si rimette il cappello, ti ringrazia per la
            pazienza ed esce senza firmare. Sulla porta si volta a guardare
            la strada nei due sensi, prima di uscirci.
          effetti: { tormento: 1 }

      - testo: "Cercare da soli chi è stato"
        descrizione: "In Città Bassa una bottega sfasciata la vede mezza strada. Qualcuno, per un prezzo, parla."
        prova: { attributo: sociale, abilita: conoscenze-della-strada, difficolta: Media }
        successo:
          titolo: Il ragazzo con il cappuccio
          testo: |
            Fai il giro delle botteghe vicine e compri un mezzo pane da una
            fornaia che vede tutto dalla finestra. Ti dice che è stato un ragazzo
            con il cappuccio degli Scuri, uno che riscuote per conto suo da quando
            nessuno gli dice più quanto chiedere, e che stanotte dorme al fienile
            dietro la conceria. Lo trovi lì, con il sacchetto dei soldi del
            bottaio ancora sotto la testa.

            Il bottaio, quando gli riporti il sacchetto, firma la denuncia senza
            farsi pregare. Fulvio tossisce, chiede il permesso ed esce.
          pe: { conoscenze-della-strada: 3 }
          effetti: { nomea.citta-bassa: 0.5, monete: 2 }
          segue: caserma-il-facchino-che-scappa
        fallimento:
          titolo: Mezzo pane
          testo: |
            Fai il giro delle botteghe vicine e trovi soltanto porte che si
            chiudono quando vedono il mantello. Una fornaia ti vende mezzo pane
            al prezzo di uno intero e ti dice che stanotte dormiva. Torni alla
            casa blu con il pane, e il bottaio se n'è già andato.
          effetti: { monete: -1, sospetto: 0.5 }

      - testo: "Fare come gli Scuri e metterlo alle strette"
        descrizione: "Se ha più paura di te che di loro, firma. Funziona sempre, e in Città Bassa se lo ricordano."
        prova: { attributo: sociale, abilita: intimidire, difficolta: Facile }
        successo:
          titolo: La firma storta
          testo: |
            Chiudi la porta, ti appoggi al banco e gli dici che senza firma la
            Guardia non può fare niente, e che una Guardia che non può fare
            niente, stanotte, passerà da un'altra parte. Lui firma. La firma gli
            viene storta, e la penna fa un buco nella carta. Quando esce, dalla
            cucina non arriva più il canticchiare di Brina, e per il resto del
            pomeriggio, quando le chiedi qualcosa, ti risponde con un cenno.

            Fulvio tossisce, chiede il permesso ed esce.
          effetti: { nomea.citta-bassa: -1 }
          segue: caserma-il-facchino-che-scappa
        fallimento:
          titolo: La porta aperta
          testo: |
            Ti appoggi al banco e alzi la voce, e il bottaio fa un passo
            indietro e poi un altro, finché non è sulla porta. Se ne va senza
            firmare, e sulla strada lo sente mezzo vicolo raccontare che alla
            casa blu adesso parlano come gli Scuri.
          effetti: { nomea.citta-bassa: -0.5, sospetto: 0.5 }

      - testo: "Passare la giornata al banco"
        descrizione: "Se la casa blu resta aperta tutto il giorno con qualcuno al banco, verso sera qualcuno entra a denunciare."
        costo: 2
        esito:
          titolo: Le pagine bianche
          testo: |
            Il bottaio se ne va senza firmare, e tu resti al banco fino a sera.
            Entra una vecchia per un gatto, che è sul tetto e non vuole scendere,
            poi un uomo per una lite di confine fra due vasi di gerani. Li scrivi
            tutti e due sul registro con la data e la firma, e al tramonto le
            pagine bianche sono diciotto. A metà pomeriggio Brina ti porta una
            scodella di zuppa senza che tu la chieda.

            Fulvio tossisce, chiede il permesso ed esce.
          pe: { resilienza: 3 }
          segue: caserma-il-facchino-che-scappa

      - testo: "Parlargli come uno del vicolo delle Fasce"
        descrizione: "Il bottaio ti ha riconosciuto. Uno del vicolo, a uno del vicolo, la firma la dà."
        quando: [origine.figlio-della-citta-bassa >= 1]
        prova: { attributo: sociale, abilita: [conoscenze-della-strada, empatia], difficolta: Facile }
        successo:
          titolo: I cerchi di ferro
          testo: |
            Gli ricordi i cerchi di ferro che gli rubavi, e lui ride per la
            prima volta e ti dice che lo sapeva benissimo, e che li lasciava
            fuori apposta. Poi firma, perché a uno del vicolo si firma. Della
            ronda davanti alla bottega non vuole sapere. Vuole che ci passi tu,
            la sera, senza mantello.

            Fulvio tossisce, chiede il permesso ed esce.
          effetti: { nomea.citta-bassa: 0.5 }
          segue: caserma-il-facchino-che-scappa
        fallimento:
          titolo: "Un{o|a} del vicolo"
          testo: |
            Gli parli come uno del vicolo, e lui ti guarda il mantello
            scarlatto e ti risponde come si risponde alla Guardia. Se ne va
            senza firmare, con il cappello in testa.
          effetti: { tormento: 1 }

  - id: caserma-il-facchino-che-scappa
    immagine: ambientazione/ponti-sospesi
    titolo: Il facchino che scappa
    tipo: seguito
    luogo: Città Bassa, la casa di pietra blu, a sera
    area: citta-bassa
    requisiti: [fazione.caserma == 3]
    testo: |
      A sera Fulvio non è ancora tornato dal permesso. Mentre appendi la lanterna sopra la porta, un ragazzino
      sui quattordici anni ti passa sotto il braccio e si infila di corsa nella casa blu, con una gerla vuota
      sulle spalle e le ginocchia nere di catrame. Si ferma davanti al banco e ti guarda.

      «Ieri notte sotto il Ponte delle Mille Corde uno con il mantello come il tuo prendeva i soldi da uno con
      il cappuccio, e li contava sulla mano» dice. «Adesso mi cercano in due, da stamattina.»

      {percezione Media} È il catrame delle reti dei sottoponti, dove il ragazzino dorme e dove stanotte deve
      tornare.

      Brina esce dalla cucina con il mestolo e quando lo vede dice piano un nome, *Nando*. Il ragazzino guarda
      lei e poi la porta, e prima che tu possa fermarlo corre giù per il vicolo verso i Ponti.
    opzioni:
      - testo: "Corrergli dietro"
        descrizione: "Un facchino dei Ponti corre più svelto di un miliziano. Ma tu non porti la gerla."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Media }
        successo:
          titolo: La scala di corda
          testo: |
            Lo segui fino all'imbocco del Ponte delle Mille Corde, e lì lo vedi
            scavalcare il parapetto e sparire giù per una scala di corda, sotto le
            assi. La scala scende nel buio fra le travi, e dal fondo arriva il
            rumore delle reti che dondolano. Prendi nota del pilone, il terzo dopo
            il gabbiotto dei Custodi, e torni alla casa blu a scrivere sul
            registro la prima denuncia che non ha firmato nessuno.
          pe: { atletica: 3 }
          effetti: { fazione.caserma: 1, rep.caserma: 0.5 }
        fallimento:
          titolo: I panni stesi
          testo: |
            Lo perdi al secondo incrocio, fra i panni stesi, e torni alla casa
            blu con un lenzuolo bagnato sulla spalla che non è tuo. Brina ti
            guarda dalla porta della cucina, e quando le chiedi dove dorme il
            ragazzino ti dice soltanto che dorme sotto le assi, come tanti ragazzi
            senza casa, e che di più lei non sa.
          effetti: { fazione.caserma: 1 }

      - testo: "Chiedere a Brina chi è"
        descrizione: "Brina l'ha chiamato per nome. Forse gli dà la zuppa anche lui."
        prova: { attributo: sociale, abilita: [empatia, galateo], difficolta: Facile }
        successo:
          titolo: Nando Rizza
          testo: |
            Brina rimette il mestolo nella pentola prima di rispondere. «Nando
            Rizza» dice. «Porta le gerle al Mercato dei Nodi. Viene la sera, si
            mangia la zuppa sulla porta e se ne va, e io non gli chiedo niente
            perché lui non chiede niente a me.» Ti versa una scodella anche per
            te. «Dorme nelle reti sotto il Ponte delle Mille Corde. Se lo
            cercano quelli, lo trovano.»

            {origine fuggiasco-di-ghoran} Brina tiene il mestolo con la mano
            sinistra e la destra chiusa contro il fianco, e sul polso destro ha
            una riga chiara che conosci. Lei vede che la guardi e tira giù la
            manica.

            Scrivi sul registro la prima denuncia che non ha firmato nessuno.
          pe: { empatia: 3 }
          effetti: { fazione.caserma: 1, rep.caserma: 0.5 }
        fallimento:
          titolo: La tenda
          testo: |
            Brina ti guarda, poi torna in cucina e tira la tenda. Dopo un poco
            la senti riprendere a mescolare, più in fretta di prima. Scrivi sul
            registro la prima denuncia che non ha firmato nessuno, e sotto
            scrivi *facchino, quattordici anni, Ponte delle Mille Corde*, che
            è tutto quello che sai.
          effetti: { fazione.caserma: 1, tormento: 0.5 }

      - testo: "Scrivere tutto sul registro e aspettare Fulvio"
        descrizione: "Il ragazzino ha visto un mantello scarlatto. Prima di correre da qualche parte, conviene sapere quali mantelli erano in giro ieri notte."
        esito:
          titolo: Il registro dei turni
          testo: |
            Scrivi la denuncia del ragazzino sul registro insieme all'ora e
            al pilone, poi apri il registro dei turni. Ieri notte, sotto il
            Ponte delle Mille Corde, la ronda non era prevista. Fulvio rientra
            un'ora dopo la fine del permesso, con la sciarpa sul naso e
            l'alito che sa di vino, e tossisce quando apri la porta.

            {ingannare Media} La tosse arriva un momento prima che lui ti veda,
            e smette appena ti ha visto. Si era preparato a trovare il
            sergente.
          pe: { percezione: 3 }
          effetti: { fazione.caserma: 1, rep.caserma: 0.5 }
