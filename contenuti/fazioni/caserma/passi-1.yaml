# La quest della Caserma, passi 1, 3 e 4 (il passo 2, la ronda di notte, sta in citta/guarnigione.yaml; il 5, sotto
# le assi, in spedizione-sotto-le-assi.yaml).
# 1 il registro del furiere: Duilio Gasti mette alla prova l'ausiliario nel cortile; chi fallisce entra con riserva.
# 3 il mantello di Bruno Lesca (grado 1, Miliziano): i mantelli dei morti in magazzino, poi il giuramento in cortile
#   e la madre di Bruno sulla discesa. Con rep.scuri >= 3 (prima della Pignatta) Gasti chiede da chi bevi.
# 4 la casa di pietra blu: il posto di guardia in Città Bassa (luogo caserma-casa-blu), il bottaio che non vuole
#   firmare e, a sera, Nando Rizza che entra di corsa e scappa nei sottoponti.
storylet:
  # ------------------------------------------------------------ passo 1 · il registro del furiere
  - id: caserma-il-registro-del-furiere
    presso: guarnigione-di-qir-azel
    immagine: ambientazione/guarnigione-di-qir-azel
    titolo: Il registro del furiere
    sommario: "Il furiere della Caserma scrive a registro chiunque abbia due braccia buone, ma prima Gasti vuole vederle lavorare."
    luogo: Guarnigione di Qir-Azel, il banco del furiere e il cortile
    area: quartieri-alti
    requisiti: [fazione.caserma == 0, pista.capomozzo >= 10]
    testo: |
      Il furiere tiene il banco delle consegne in fondo al corridoio del
      mastio, e a metà della tua prima frase ha già intinto la penna. Dopo
      la razzia, ti spiega, la Caserma ha più mantelli che uomini, e alle
      sue spalle gli scaffali sono pieni di mantelli scarlatti piegati, con
      il cartellino.

      Sopra il banco, in una teca di vetro, c'è una spada lunga con il filo
      ammaccato a metà lama e un cartiglio con un nome solo, *Ivo Carstan*.
      I miliziani che passano abbassano la voce.

      {accademiche Media} Ivo Carstan era lo sceriffo prima di Galdrick, e
      il Cucitore lo prese in un vicolo l'ultima delle Notti Cucite.

      «Per il registro mi basta una firma» dice il furiere, e indica il
      cortile con la penna. «Gasti, di solito, vuole qualcosa di più.»

      Nel cortile il sergente d'addestramento, Duilio Gasti, conta con una
      voce che arriva fino alle mura le parate di sei reclute davanti ai
      manichini di paglia, e quando una sbaglia ricomincia da uno.

      {origine apprendista-raschiatore} Tre reclute portano la cintura degli
      attrezzi dei Raschiatori sopra la giubba, e ti riconoscono dal modo in
      cui misuri il cammino di ronda, come una piattaforma.

      *Se sbaglio, ricomincia da uno anche per me.* Ti asciughi le mani sui
      calzoni prima di avvicinarti.
    opzioni:
      - testo: "Parare ai manichini davanti alle reclute"
        descrizione: "Gasti ti mette in mano una spada di legno e conta fino a dodici."
        prova: { attributo: fisico, abilita: armi-da-mischia, difficolta: Media }
        successo:
          titolo: Dodici
          testo: |
            Gasti conta e tu pari. Al sei la spada di legno ti scivola nella mano
            sudata e la riprendi in tempo, e al dodici il sergente te la prende di
            mano e la soppesa, come per capire dove sta il trucco. Il furiere
            scrive il tuo nome in fondo alla pagina e, soffiando sull'inchiostro,
            ti dice che una faccia che i suoi sergenti non conoscono gli tornerà
            utile.
          pe: { armi-da-mischia: 3 }
          effetti: { fazione.caserma: 1, rep.caserma: 0.5, monete: 3 }
        fallimento:
          titolo: Da uno
          testo: |
            Al quinto colpo la spada di legno ti salta di mano, e Gasti ricomincia
            da uno finché le reclute smettono di parare per guardare. Il sergente
            ti manda alle latrine del cortile domani all'alba, e il furiere ti
            scrive in fondo alla pagina con una crocetta, che vuol dire con
            riserva.
          effetti: { fazione.caserma: 1, ferite: 0.5 }

      - testo: "Correre il giro del cammino di ronda"
        descrizione: "Dal portone alla torre nord e ritorno, sulle mura, prima che Gasti arrivi a cento."
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Media }
        successo:
          titolo: Prima del cento
          testo: |
            Sali sulle mura due gradini alla volta e alla torre nord tocchi il
            muro con la mano aperta. Quando rimetti piede nel cortile Gasti è a
            novantuno, e il furiere ti fa firmare dicendo che una faccia che i
            suoi sergenti non conoscono gli tornerà utile.

            {resistenza Media} Le gambe protestano soltanto dopo, e ti siedi sul
            bordo del pozzo fingendo di farlo per comodità.
          pe: { atletica: 3 }
          effetti: { fazione.caserma: 1, rep.caserma: 0.5, monete: 3 }
        fallimento:
          titolo: Centoventi
          testo: |
            A metà strada le gambe si fanno di piombo e alla torre nord ci arrivi
            camminando. Gasti arriva a cento e per educazione continua a contare
            più piano, finché rientri a centoventi. Domani all'alba ti aspettano
            le latrine, e il furiere ti scrive con una crocetta accanto, che vuol
            dire con riserva.
          effetti: { fazione.caserma: 1, ferite: 0.5 }

      - testo: "Recitare il regolamento a memoria"
        descrizione: "Gasti ti dà il libretto del regolamento, e hai il tempo di una parata per impararne la prima pagina."
        prova: { attributo: mentale, abilita: accademiche, difficolta: Facile }
        successo:
          titolo: Articolo primo
          testo: |
            La prima pagina del libretto dice chi può fermare chi e per quanto
            tempo lo si può tenere in cella, e la reciti senza saltare una
            virgola. Gasti ti chiede anche l'articolo nove, che sta alla terza
            pagina, e lo sai perché nel frattempo hai continuato a leggere. Il
            furiere ti scrive e ti dice che una faccia che i suoi sergenti non
            conoscono gli tornerà utile.
          pe: { accademiche: 3 }
          effetti: { fazione.caserma: 1, rep.caserma: 0.5, monete: 3 }
        fallimento:
          titolo: Il libretto in tasca
          testo: |
            La prima pagina ti si confonde con la seconda, e a Gasti rispondi con
            sicurezza una cosa che nel regolamento non c'è, fra le risate delle
            reclute. Il sergente ti manda alle latrine all'alba, e il furiere ti
            scrive in fondo alla pagina con una crocetta, che vuol dire con
            riserva.
          effetti: { fazione.caserma: 1, tormento: 1 }

      - testo: "Far tornare un conto al furiere"
        descrizione: "Da una settimana sul registro i mantelli in magazzino e gli uomini in servizio non tornano."
        prova: { attributo: mentale, abilita: politica-ed-economia, difficolta: Media }
        successo:
          titolo: Due righe
          testo: |
            Dopo un'ora sul registro del furiere trovi due mantelli scritti due volte nella stessa riga, con la stessa grafia tonda. Il
            furiere ci tira sopra una linea con il righello e ti scrive in bella senza passare dal cortile, perché una faccia che i
            suoi sergenti non conoscono gli tornerà utile.

            {politica-ed-economia Media} La grafia tonda è di un sergente della ronda di notte, e il furiere adesso lo sa.
          pe: { politica-ed-economia: 3 }
          effetti: { fazione.caserma: 1, rep.caserma: 0.5, monete: 3 }
        fallimento:
          titolo: Il conto del furiere
          testo: |
            Dopo un'ora trovi un errore, e il furiere ti mostra con la punta della
            penna che l'hai fatto tu, alla terza colonna. Gasti ti mette al turno
            delle latrine, e il furiere ti scrive con una crocetta accanto, che
            vuol dire con riserva.
          effetti: { fazione.caserma: 1, tormento: 1 }

      - testo: "Firmare con riserva e prendere il turno delle latrine"
        descrizione: "Il furiere ti scrive subito, se accetti il turno delle latrine."
        costo: 2
        esito:
          titolo: Il turno dell'alba
          testo: |
            Il furiere ti scrive con una crocetta accanto, che vuol dire con
            riserva, e Gasti ti affida un secchio e una spazzola consumata. Passi
            l'alba alle latrine mentre le reclute si allenano a dieci passi e
            fanno finta di non sentire l'odore. A mezzogiorno il sergente annusa
            l'aria e cancella la crocetta con il pollice.
          pe: { resistenza: 3 }
          effetti: { fazione.caserma: 1 }

  # ------------------------------------------------------------ passo 3 · il mantello di Bruno Lesca (grado 1)
  - id: caserma-i-mantelli-dei-morti
    presso: guarnigione-di-qir-azel
    immagine: ambientazione/guarnigione-di-qir-azel
    titolo: I mantelli dei morti
    sommario: "Domani c'è il giuramento, e il furiere distribuisce i mantelli che ha sugli scaffali."
    luogo: Guarnigione di Qir-Azel, il magazzino del furiere
    area: quartieri-alti
    requisiti: [fazione.caserma == 2]
    testo: |
      I mantelli nuovi per il giuramento dovevano arrivare dalla Conceria
      Kasselt una settimana fa, e non sono arrivati. Il furiere consegna alle
      reclute in fila quelli degli scaffali, e i cartellini li stacca con le
      forbici senza leggerli e li mette in una scatola di latta sotto il
      banco.

      Il tuo è di lana grossa, più pesante di quanto sembrasse, con un
      rammendo a punti fitti sulla spalla sinistra. All'interno del colletto
      c'è un nome ricamato in filo nero, *Bruno Lesca*.

      {percezione Media} Il rammendo è fresco, ma il filo del nome ha preso
      la forma del collo di chi lo portava. Il buco sulla spalla l'ha fatto
      una freccia orchesca.

      {empatia Facile} Due reclute davanti a te hanno trovato un nome, e una
      ha già girato il colletto all'esterno, perché non le tocchi il collo.

      Dietro la fila Linna Varo tiene sollevato con una mano il suo mantello,
      che le arriva alle caviglie. Dal cortile arriva la voce di Gasti che
      prova la formula del giuramento, e a ogni frase sbaglia la stessa
      parola.

      *Domani lo porti davanti a tutti, con il suo nome sul collo.* Ti
      accorgi di tenerlo piegato sul braccio, come quelli che escono di
      ronda.
    opzioni:
      - testo: "Chiedere al furiere chi era Bruno Lesca"
        descrizione: "I cartellini sono nella scatola di latta, e il furiere ha un registro anche per i morti."
        prova: { attributo: sociale, abilita: [empatia, persuasione], difficolta: Media }
        successo:
          titolo: La scatola di latta
          testo: |
            Finita la fila, il furiere apre un registro piccolo dalla copertina
            nera. «Bruno Lesca, ventidue anni, torre nord. La madre sta in fondo
            alla discesa, nella casa con la grondaia verde, e il primo del mese
            viene al portone a chiedere se è arrivato niente per lei.» Chiude il
            registro. «Non arriva mai niente, perché il Consiglio la pensione non
            la vota.»
          segue: caserma-il-giuramento
        fallimento:
          titolo: I morti si contano
          testo: |
            Il furiere ti guarda da sopra gli occhiali e continua a consegnare
            mantelli. «I morti li conto» dice alla recluta dopo di te, «e li conto
            bene.» Torni nella fila con la sensazione di avere chiesto troppo
            presto.
          segue: caserma-il-giuramento
          effetti: { scandalo: 0.5 }

      - testo: "Rivoltare il colletto come la recluta davanti a te"
        descrizione: "Il nome resta dentro la lana, solo che non ti tocca più il collo."
        esito:
          titolo: Il colletto
          testo: |
            Rivolti il colletto all'esterno e lo appunti con uno spillo di Linna,
            e il nome adesso guarda chi ti sta davanti. Linna ti guarda fare e
            rivolta il suo, benché dentro non ci sia scritto niente.
          segue: caserma-il-giuramento

      - testo: "Provare la formula con Gasti"
        descrizione: "Il sergente sbaglia sempre la stessa parola del giuramento, e domani la dirà davanti a tutto il cortile."
        prova: { attributo: sociale, abilita: [espressivita, galateo], difficolta: Media }
        successo:
          titolo: Davanti alla città
          testo: |
            Fai ripetere la formula a Gasti finché non arriva in fondo senza
            inciampare. La parola sbagliata è *custodire*, che lui da vent'anni
            dice *custodiare*, e alla quinta volta la dice giusta e si gira verso
            il cortile vuoto a controllare che nessuno abbia sentito le prime
            quattro.
          pe: { espressivita: 3 }
          segue: caserma-il-giuramento
        fallimento:
          titolo: Custodiare
          testo: |
            Alla terza ripetizione la sbagli anche tu, nello stesso punto. Gasti
            ti guarda con la gratitudine di un compagno di sventura e ti dice che
            domani la diranno sbagliata in due, e nessuno se ne accorgerà.
          segue: caserma-il-giuramento
          effetti: { scandalo: 0.5 }

  - id: caserma-il-giuramento
    immagine: ambientazione/guarnigione-di-qir-azel
    titolo: Il giuramento
    tipo: seguito
    luogo: Guarnigione di Qir-Azel, il cortile
    area: quartieri-alti
    requisiti: [fazione.caserma == 2]
    testo: |
      Il giuramento si fa nel cortile quando il sole arriva sopra le mura,
      con le reclute in fila davanti al mastio e i miliziani anziani sotto il
      portico. Gasti legge la formula e voi la ripetete una frase alla volta,
      mentre dalla finestra aperta del suo ufficio guarda lo sceriffo.

      {intimidire Media} I miliziani sotto il portico guardano le reclute più
      della cerimonia, e si segnano chi abbassa gli occhi per primo.

      A metà formula una donna con uno scialle grigio e le scarpe della
      domenica sale piano la discesa e si ferma al portone, accanto alle
      guardie, senza entrare. Guarda i mantelli, e ti accorgi che sta
      contando anche lei.

      {empatia Media} Le facce delle reclute non le interessano. Cerca un
      rammendo sulla spalla sinistra, e l'ha già trovato.

      Gasti arriva a *custodire* e lo dice giusto, e sotto il portico
      qualcuno accenna un applauso che muore subito. Poi vi dichiara
      miliziani della Guardia di Qir-Azel, con la paga piena per le ronde, e
      la donna è ancora al portone.
    opzioni:
      - testo: "Andarle a dire che il mantello ce l'hai tu"
        descrizione: "Attraversi il cortile davanti a tutti, con il nome di suo figlio sul collo."
        prova: { attributo: sociale, abilita: empatia, difficolta: Media }
        successo:
          titolo: Il rammendo
          testo: |
            Ti fermi davanti a lei e le dici il tuo nome. Lei tocca il rammendo sulla
            spalla, i punti fitti uno per uno. «L'ha cucito bene il furiere, Bruno non
            l'avrebbe mai fatto così» dice piano. Ti chiede se stai sulle mura nord, e le
            dici di sì anche se non lo sai ancora. Il furiere ti consegna la paga del
            giuramento e ti assegna alla casa di pietra blu.
          pe: { empatia: 5 }
          effetti: { fazione.caserma: 1, monete: 30, oggetto.caserma-mantello-scarlatto: 1 }
          almeno: { rep.caserma: 2 }
        fallimento:
          titolo: Lo scialle
          testo: |
            A tre passi da lei ti accorgi di essere a mani vuote, senza una parola
            pronta, e le dici che ti dispiace. Lei ti guarda il colletto, poi la
            faccia. «Grazie» dice, e scende la discesa più in fretta di come l'ha
            salita. Il furiere ti consegna la paga del giuramento e ti assegna
            alla casa di pietra blu, in Città Bassa.
          effetti: { fazione.caserma: 1, monete: 30, oggetto.caserma-mantello-scarlatto: 1, tormento: 1 }
          almeno: { rep.caserma: 2 }

      - testo: "Restituirle il mantello"
        descrizione: "È di suo figlio, e tu puoi aspettare quelli nuovi della Conceria."
        esito:
          titolo: Una settimana senza
          testo: |
            Ti togli il mantello in mezzo al cortile, lo pieghi come ti ha
            insegnato il furiere e glielo porti al portone, e lei lo prende con
            tutte e due le mani senza aprirlo. Per una settimana esci di ronda in
            giubba, la recluta senza mantello, finché arrivano quelli della
            Conceria che puzzano ancora di tintura. Ti assegnano alla casa di
            pietra blu, in Città Bassa.
          pe: { galateo: 5 }
          effetti: { fazione.caserma: 1, monete: 30, oggetto.caserma-mantello-scarlatto: 1 }
          almeno: { rep.caserma: 2 }

      - testo: "Chiedere a Galdrick una pensione per lei"
        descrizione: "Il Consiglio la pensione non la vota, e lo sceriffo ha una cassa delle spese di servizio."
        immagine: personaggi/toren-galdrick
        quando: [galdrick.via == 0]
        prova: { attributo: sociale, abilita: persuasione, difficolta: Difficile }
        successo:
          titolo: Alla voce spese di servizio
          testo: |
            Sali in ufficio e lo dici a Galdrick senza girarci intorno. Lo
            sceriffo guarda dalla finestra la donna al portone, con i pollici
            nella cintura. «Il Consiglio non la vota da quattro anni» dice. «La
            vota il furiere, da oggi, alla voce spese di servizio, finché il
            Consiglio non si vergogna.» Il furiere ti consegna la paga del
            giuramento e ti assegna alla casa di pietra blu, in Città Bassa.
          pe: { persuasione: 5 }
          effetti: { fazione.caserma: 1, monete: 30, oggetto.caserma-mantello-scarlatto: 1, rep.caserma: 0.5 }
          imposta: { caserma.pensione: 1 }
          almeno: { rep.caserma: 2 }
        fallimento:
          titolo: Il Consiglio non vota
          testo: |
            Galdrick ti risponde che ha chiesto la pensione al Consiglio quattro
            volte, e quattro volte la paga delle ronde è arrivata in ritardo per
            punizione. «Se la pago io, domani me ne chiedono trenta.» Quando torni
            in cortile la donna non c'è più, e il furiere ti consegna la paga del
            giuramento e ti assegna alla casa di pietra blu, in Città Bassa.
          effetti: { fazione.caserma: 1, monete: 30, oggetto.caserma-mantello-scarlatto: 1, tormento: 0.5 }
          almeno: { rep.caserma: 2 }

      - testo: "Giurare senza rispondere a Gasti"
        descrizione: "Gasti ti ha chiesto davanti a tutti da chi bevi alla Pignatta Grassa, e puoi non sentire."
        immagine: fazioni/scuri
        quando: [rep.scuri >= 3, pista.pelle < 6]
        esito:
          titolo: La domanda nel cortile
          testo: |
            Quando Gasti ti ha chiesto, abbastanza forte per il portico, da chi
            bevi alla Pignatta Grassa, hai detto la formula con gli altri
            guardando davanti a te. Il sergente ha lasciato perdere. Mentre il
            furiere ti consegna mantello e paga, due miliziani sotto il portico
            parlano a bassa voce guardando dalla tua parte. Ti assegnano alla casa
            di pietra blu, in Città Bassa, dove si manda chi deve farsi conoscere.
          effetti: { fazione.caserma: 1, monete: 30, oggetto.caserma-mantello-scarlatto: 1, sospetto: 1.5 }
          almeno: { rep.caserma: 2 }

      - testo: "Rispondere a Gasti davanti a tutti"
        descrizione: "Gasti ti ha chiesto davanti a tutti da chi bevi alla Pignatta Grassa, e puoi dirglielo."
        immagine: fazioni/scuri
        quando: [rep.scuri >= 3, pista.pelle < 6]
        esito:
          titolo: Da Mauro
          testo: |
            «Da Mauro Scrocco» hai detto, «e pago io.» Dopo il giuramento Gasti ti
            dice che lo sceriffo queste cose le scrive sul taccuino, e che una
            riga detta da solo vale più di dieci scritte da altri. Entro sera la
            tua risposta la conosce tutta la Città Bassa, e alla Pignatta qualcuno
            smette di offrirti da bere. Il furiere ti assegna alla casa di pietra
            blu.
          effetti: { fazione.caserma: 1, monete: 30, oggetto.caserma-mantello-scarlatto: 1, rep.scuri: -1 }
          almeno: { rep.caserma: 2 }

      - testo: "Portare il mantello in Cattedrale con lei"
        descrizione: "Al Velo i mantelli dei caduti si benedicono prima di passare a un altro, e qui nessuno l'ha fatto."
        immagine: ambientazione/cattedrale-del-velo
        quando: [origine.accolito-del-velo >= 1]
        prova: { attributo: sociale, abilita: [empatia, galateo], difficolta: Media }
        successo:
          titolo: La benedizione dei mantelli
          testo: |
            Nella cappella laterale della Cattedrale un chierico dice le parole
            sul mantello aperto sopra l'altare. Lei tiene la mano sul rammendo, e
            all'uscita ti dice che passerà al portone, a vedere se il mantello sta
            bene.

            {origine accolito-del-velo} Le parole le hanno dette anche le tue
            labbra, insieme al chierico.

            Il furiere ti consegna la paga del giuramento e ti assegna alla casa
            di pietra blu.
          pe: { empatia: 5 }
          effetti: { fazione.caserma: 1, monete: 30, oggetto.caserma-mantello-scarlatto: 1 }
          almeno: { rep.caserma: 2 }
        fallimento:
          titolo: La cappella chiusa
          testo: |
            La cappella laterale è chiusa per le pulizie, e il chierico di turno
            vi fa aspettare sui gradini fino a sera per poi dire le parole in
            fretta. Lei ti ringrazia lo stesso, ma sulla via del ritorno non
            parla. Il furiere ti consegna la paga del giuramento e ti assegna alla
            casa di pietra blu.
          effetti: { fazione.caserma: 1, monete: 30, oggetto.caserma-mantello-scarlatto: 1, tormento: 1 }
          almeno: { rep.caserma: 2 }

  # ------------------------------------------------------------ passo 4 · la casa di pietra blu
  - id: caserma-la-casa-di-pietra-blu
    presso: caserma-casa-blu
    immagine: ambientazione/citta-bassa
    titolo: La casa di pietra blu
    sommario: "Alla casa blu un bottaio con la bottega sfasciata non vuole dire chi è stato."
    luogo: Città Bassa, il posto di guardia della casa di pietra blu
    area: citta-bassa
    requisiti: [fazione.caserma == 3]
    testo: |
      Il posto di guardia è una casa di pietra blu, e il registro delle
      denunce ha le ultime venti pagine bianche, con la sola data in cima.

      Di turno con te c'è Fulvio Saldo, che porta la sciarpa fino al naso e
      tossisce quando qualcuno passa davanti alla finestra. In cucina la
      sguattera Brina mescola una pentola, e di Ghoran, ti avverte Fulvio,
      non bisogna chiederle niente.

      Davanti al banco un bottaio rigira il cappello fra le mani. Stanotte
      gli hanno sfasciato la bottega e il tornio, e vuole che la Guardia lo
      sappia senza firmare né dire chi è stato.

      {origine figlio-della-citta-bassa} Il bottaio sta in fondo al vicolo
      delle Fasce, dove da bambino gli rubavi i cerchi di ferro, e ti
      riconosce dalla voce.
    opzioni:
      - testo: "Convincerlo a firmare la denuncia"
        descrizione: "Una firma sarebbe il primo nome in venti pagine, se crede che la Guardia tornerà anche domani."
        prova: { attributo: sociale, abilita: [empatia, persuasione], difficolta: Media }
        successo:
          titolo: Il primo nome
          testo: |
            Gli chiedi del tornio, e lui te ne parla come di un parente malato.
            Poi gli prometti che la ronda passerà davanti alla bottega due volte a
            notte per un mese, e lo scrivi sul registro davanti a lui, con la
            data. Lui guarda la riga a lungo e firma sotto, il primo nome in venti
            pagine. Fulvio chiede il permesso ed esce tossendo.
          effetti: { nomea.citta-bassa: 0.5 }
          segue: caserma-il-facchino-che-scappa
        fallimento:
          titolo: Il cappello
          testo: |
            Gli dici che la Guardia lo proteggerà, e lui sorride come si sorride a
            un bambino. Se ne va senza firmare, guardando la strada nei due sensi
            prima di uscirci.
          effetti: { tormento: 1 }

      - testo: "Cercare da soli chi è stato"
        descrizione: "Una bottega sfasciata la vede mezza strada, e qualcuno, per un prezzo, parla."
        prova: { attributo: sociale, abilita: conoscenze-della-strada, difficolta: Media }
        successo:
          titolo: Il ragazzo con il cappuccio
          testo: |
            Una fornaia ti vende mezzo pane e ti dice che è stato un ragazzo con
            il cappuccio degli Scuri, che riscuote per conto suo e dorme al
            fienile dietro la conceria. Lo trovi lì con il sacchetto dei soldi del
            bottaio sotto la testa, e quando vede il mantello scarlatto lascia
            cadere il coltello. Il bottaio firma senza farsi pregare, e Fulvio
            chiede il permesso ed esce tossendo.
          pe: { conoscenze-della-strada: 3 }
          effetti: { nomea.citta-bassa: 0.5, monete: 2 }
          segue: caserma-il-facchino-che-scappa
        fallimento:
          titolo: Mezzo pane
          testo: |
            Davanti al mantello le porte delle botteghe si chiudono, e una fornaia
            ti vende mezzo pane al prezzo di uno intero giurando che stanotte
            dormiva. Quando torni alla casa blu il bottaio se n'è andato.
          effetti: { monete: -1, sospetto: 0.5 }

      - testo: "Fare come gli Scuri e metterlo alle strette"
        descrizione: "Se ha più paura di te che di loro firma, e in Città Bassa se lo ricordano."
        prova: { attributo: sociale, abilita: intimidire, difficolta: Facile }
        successo:
          titolo: La firma storta
          testo: |
            Chiudi la porta e gli dici che una Guardia senza firma non può fare
            niente, e che stanotte passerà da un'altra parte. Lui firma storto,
            con la penna che buca la carta. Dalla cucina non arriva più il
            canticchiare di Brina, che per il resto del pomeriggio ti risponde con
            un cenno. Fulvio chiede il permesso ed esce tossendo.
          effetti: { nomea.citta-bassa: -1 }
          segue: caserma-il-facchino-che-scappa
        fallimento:
          titolo: La porta aperta
          testo: |
            Alzi la voce e il bottaio arretra fino alla porta, e se ne va senza
            firmare a raccontare a mezzo vicolo che alla casa blu adesso parlano
            come gli Scuri.
          effetti: { nomea.citta-bassa: -0.5, sospetto: 0.5 }

      - testo: "Passare la giornata al banco"
        descrizione: "Se la casa blu resta aperta tutto il giorno, verso sera qualcuno entra a denunciare."
        costo: 2
        esito:
          titolo: Le pagine bianche
          testo: |
            Il bottaio se ne va senza firmare, e tu resti al banco fino a sera.
            Entrano una vecchia per un gatto sul tetto e un uomo per una lite di
            confine fra due vasi di gerani, e al tramonto le pagine bianche sono
            diciotto. Brina ti porta una scodella di zuppa senza che tu la chieda,
            e Fulvio chiede il permesso ed esce tossendo.
          pe: { resilienza: 3 }
          segue: caserma-il-facchino-che-scappa

      - testo: "Parlargli come uno del vicolo delle Fasce"
        descrizione: "Il bottaio ti ha riconosciuto, e a uno del vicolo la firma si dà."
        quando: [origine.figlio-della-citta-bassa >= 1]
        prova: { attributo: sociale, abilita: [conoscenze-della-strada, empatia], difficolta: Facile }
        successo:
          titolo: I cerchi di ferro
          testo: |
            Gli ricordi i cerchi di ferro che gli rubavi, e lui ride perché li
            lasciava fuori apposta. Firma, perché a uno del vicolo si firma, però
            la ronda davanti alla bottega non la vuole, e preferisce che ci passi
            tu la sera, senza mantello. Fulvio chiede il permesso ed esce
            tossendo.
          effetti: { nomea.citta-bassa: 0.5 }
          segue: caserma-il-facchino-che-scappa
        fallimento:
          titolo: Uno del vicolo
          testo: |
            Il bottaio ti guarda il mantello scarlatto e ti risponde come si
            risponde alla Guardia, poi se ne va senza firmare.
          effetti: { tormento: 1 }

  - id: caserma-il-facchino-che-scappa
    immagine: ambientazione/ponti-sospesi
    titolo: Il facchino che scappa
    tipo: seguito
    luogo: Città Bassa, la casa di pietra blu, a sera
    area: citta-bassa
    requisiti: [fazione.caserma == 3]
    testo: |
      A sera Fulvio non è ancora tornato dal permesso. Mentre appendi la
      lanterna sopra la porta un ragazzino di quattordici anni ti passa sotto
      il braccio e si infila nella casa blu, con una gerla vuota sulle spalle
      e le ginocchia nere di catrame.

      «Sotto il Ponte delle Mille Corde» dice, «ieri notte. Uno con il
      mantello come il tuo prendeva i soldi da uno con il cappuccio. Li
      contava sulla mano.» Inghiotte. «E adesso mi cercano. Due, da
      stamattina.»

      {percezione Media} Il catrame è quello delle reti dei sottoponti. Dorme
      là sotto, e stanotte ci deve tornare.

      Brina esce dalla cucina con il mestolo in mano e dice piano un nome,
      *Nando*. Il ragazzino si volta verso di lei, poi verso la porta, e prima
      che tu possa allungare una mano è già giù per il vicolo, verso i Ponti.
    opzioni:
      - testo: "Corrergli dietro"
        descrizione: "Un facchino dei Ponti corre più svelto di un miliziano, ma tu non porti la gerla."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Media }
        successo:
          titolo: La scala di corda
          testo: |
            Lo segui fino al Ponte delle Mille Corde e lo vedi scavalcare il
            parapetto e sparire giù per una scala di corda, fra le travi sotto le
            assi. Prendi nota del pilone, il terzo dopo il gabbiotto dei Custodi,
            e torni alla casa blu a scrivere sul registro la prima denuncia che
            non ha firmato nessuno.
          pe: { atletica: 3 }
          effetti: { fazione.caserma: 1, rep.caserma: 0.5 }
        fallimento:
          titolo: I panni stesi
          testo: |
            Lo perdi al secondo incrocio, fra i panni stesi. Alla casa blu Brina
            ti dice soltanto che dorme sotto le assi, dove dormono tutti quelli
            che non hanno un posto.
          effetti: { fazione.caserma: 1 }

      - testo: "Chiedere a Brina chi è"
        descrizione: "Brina l'ha chiamato per nome, e forse gli dà la zuppa."
        prova: { attributo: sociale, abilita: [empatia, galateo], difficolta: Facile }
        successo:
          titolo: Nando Rizza
          testo: |
            Brina rimette il mestolo nella pentola prima di rispondere. «Nando
            Rizza. Porta le gerle al Mercato dei Nodi, la sera viene a mangiarsi
            la zuppa sulla porta e dorme nelle reti sotto il Ponte delle Mille
            Corde.»

            {origine fuggiasco-di-ghoran} Sul suo polso destro c'è una riga chiara
            che conosci, e quando vede che la guardi tira giù la manica.

            Scrivi sul registro la prima denuncia che non ha firmato nessuno.
          pe: { empatia: 3 }
          effetti: { fazione.caserma: 1, rep.caserma: 0.5 }
        fallimento:
          titolo: La tenda
          testo: |
            Brina torna in cucina e tira la tenda. Scrivi sul registro la prima
            denuncia che non ha firmato nessuno, e sotto *facchino, quattordici
            anni, Ponte delle Mille Corde*, che è tutto quello che sai.
          effetti: { fazione.caserma: 1, tormento: 0.5 }

      - testo: "Scrivere tutto sul registro e aspettare Fulvio"
        descrizione: "Il ragazzino ha visto un mantello scarlatto, e conviene sapere quali mantelli erano in giro ieri notte."
        esito:
          titolo: Il registro dei turni
          testo: |
            Scrivi la denuncia con l'ora e il pilone, poi apri il registro dei
            turni. Ieri notte, sotto il Ponte delle Mille Corde, la ronda non era
            prevista. Fulvio rientra un'ora dopo la fine del permesso, con l'alito
            che sa di vino, e tossisce quando apri la porta.

            {ingannare Media} La tosse arriva un momento prima che lui ti veda,
            perché si era preparato a trovare il sergente.
          pe: { percezione: 3 }
          effetti: { fazione.caserma: 1, rep.caserma: 0.5 }
