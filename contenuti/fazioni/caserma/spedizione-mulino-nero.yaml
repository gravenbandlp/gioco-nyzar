# La quest della Caserma, passo 14 (fazione.caserma == 13, pista.pelle >= 6): «Il Mulino Nero», uno dei mulini che gli
# Scuri bruciarono per i Malgrani, sulla strada di Laresh oltre il Ponte del Conciatore. Ci si sono chiusi Brando
# Selli, tre miliziani disertori e Nihali Cuzan con il libro delle paghe di Vesh.
# Ci si entra da caserma-il-mulino-nero (Città Bassa, ripetibile finché il passo è aperto). Ritorno in Città Bassa,
# soglia 4, tre stanze alla volta.
# Fasce di profondità: 0 i campi bruciati, il canale; 0-1 la vedetta; 1 il cortile, la stalla (Fulvio Saldo secondo
# caserma.saldo); 1-2 le travi in fiamme; 2 la sala delle macine (combattimento), la scala del mulino; 2-3 la ruota;
# 3 il granaio annerito. In quattro stanze si può convincere un disertore a deporre le armi (caserma.disertori): con
# due, nella cantina restano soltanto Brando e Nihali (scontro caserma-la-cantina-ridotta).
# Il cuore (4) è la cantina sotto la ruota: Brando e Nihali (boss Difficile), oppure parlare con Brando (Difficile).
# Il seguito chiude il passo: Nihali preso o fuggito con metà del libro (caserma.nihali), la colonna con l'occhio
# chiuso nel libro (crepuscolo.indizi), la cassa dei disertori e il mazzo di Nihali.
aree:
  - id: caserma-mulino-nero
    immagine: ambientazione/mulino-malgrani
    nome: Il Mulino Nero
    sommario: "Il mulino bruciato dove Brando Selli e i disertori tengono il libro delle paghe di Vesh."
    spedizione: { ritorno: citta-bassa, soglia: 4, stanze: 3 }
    testo: |
      Il mulino dei Malgrani sta su un canale che scende verso il Torvessa,
      a mezza giornata dal Ponte del Conciatore, e da quando gli Scuri gli
      hanno dato fuoco lo chiamano il Mulino Nero. Dal comignolo del
      granaio, sotto il tetto crollato a metà, esce un filo di fumo.

storylet:
  # ------------------------------------------------------------ l'ingresso, in Città Bassa
  - id: caserma-il-mulino-nero
    immagine: ambientazione/mulino-malgrani
    titolo: Il Mulino Nero
    sommario: "Con Galdrick ferito, guidi tu la squadra contro Brando Selli e i disertori, al Mulino Nero."
    luogo: Città Bassa, la porta dell'ovest
    area: citta-bassa
    ripetibile: true
    requisiti: [fazione.caserma == 13, bivio.legge == 1, pista.pelle >= 6]
    testo: |
      Alla porta dell'ovest ti aspettano sei miliziani e Linna Varo, con i
      mantelli piegati sul braccio come insegnava Brando. Galdrick vi ha
      salutato dal portone con la mano sul fianco, dicendo soltanto che li
      vuole vivi.

      {armi-da-mischia Media} Brando para alto e corto con la spada
      d'ordinanza, e lo sai perché quella parata te l'ha insegnata lui.

      Oltre il Ponte del Conciatore, la strada di Laresh porta fra i campi
      fino al filo di fumo del Mulino Nero.
    opzioni:
      - testo: "Partire con la squadra"
        descrizione: "Mezza giornata a piedi, fino al pomeriggio."
        esito:
          titolo: La strada di Laresh
          testo: |
            Partite a passo di ronda, e Linna ti racconta a voce bassa di suo
            padre e del Ponte dei Morti, per riempire la strada. Nel pomeriggio il
            filo di fumo diventa il comignolo del mulino.
          vai: caserma-mulino-nero

      - testo: "Partire a cavallo, prima della squadra"
        descrizione: "A cavallo arrivi prima e studi il mulino senza farti vedere."
        quando: [chiave.cavalcatura >= 1]
        costo: 0
        esito:
          titolo: Davanti a tutti
          testo: |
            Parti all'alba e a metà mattina sei già sulla collinetta di stoppie
            davanti al mulino, a contarne le finestre. Quando la squadra ti
            raggiunge sai da che parte entrare.
          vai: caserma-mulino-nero

  # ------------------------------------------------------------ 0 · fuori dal mulino
  - id: caserma-mulino-i-campi-bruciati
    immagine: ambientazione/mulino-malgrani
    titolo: I campi bruciati
    sommario: "Trecento passi di campi bruciati, senza riparo, sotto le finestre del mulino."
    luogo: Il Mulino Nero, i campi bruciati
    area: caserma-mulino-nero
    ripetibile: true
    requisiti: [fazione.caserma == 13, profondita.caserma-mulino-nero == 0]
    testo: |
      Fra la strada e il mulino ci sono trecento passi di stoppie nere senza
      un riparo, e dalle finestre del primo piano si vede tutto. Il vento
      soffia dal mulino verso la strada e si porta via i rumori.

      {armi-da-distanza Media} Trecento passi sono lunghi per una balestra
      leggera, e chi è alla finestra aspetta che arriviate a metà.
    opzioni:
      - testo: "Attraversare i campi a gruppi, di corsa"
        descrizione: "Di corsa a coppie, così dalla finestra si può tirare a uno solo."
        prova: { attributo: fisico, abilita: [atletica, furtivita], difficolta: Media }
        successo:
          titolo: Di filare in filare
          testo: |
            Mandi la squadra a coppie da un filare all'altro, e arrivate tutti al
            muro del cortile con un solo dardo piantato nelle stoppie dietro
            Linna.
          effetti: { profondita.caserma-mulino-nero: 1 }
        fallimento:
          titolo: Il dardo
          testo: |
            Partite troppo insieme e un dardo prende un miliziano alla spalla.
            Perdete un'ora a rimandarlo in città.
          effetti: { ferite: 0.5, tormento: 1 }

      - testo: "Arrivare dal lato del vento"
        descrizione: "Girando largo, il vento si porta via i vostri rumori."
        prova: { attributo: mentale, abilita: [natura, percezione], difficolta: Media }
        successo:
          titolo: Sottovento
          testo: |
            Fate il giro largo dal lato del vento, curvi fra le stoppie, e
            arrivate al muro del cortile senza che dalla finestra parta niente.
          effetti: { profondita.caserma-mulino-nero: 1 }
        fallimento:
          titolo: Il vento che gira
          testo: |
            A metà del giro il vento cambia, e quando dalla finestra qualcuno
            grida vi ritirate sulla strada.
          effetti: { tormento: 1 }

      - testo: "Aspettare il buio"
        descrizione: "Di notte i campi sono buio, ma si perde un giorno."
        costo: 2
        esito:
          titolo: La notte nelle stoppie
          testo: |
            Aspettate il buio nel fosso della strada e attraversate i campi uno
            alla volta. Linna arriva al muro per ultima e ti dice che ha contato
            le stelle per non pensare.
          effetti: { profondita.caserma-mulino-nero: 1 }

  - id: caserma-mulino-il-canale
    immagine: ambientazione/mulino-malgrani
    titolo: Il canale
    sommario: "Il canale arriva fino alla ruota, e si può risalire nell'acqua."
    luogo: Il Mulino Nero, il canale
    area: caserma-mulino-nero
    ripetibile: true
    requisiti: [fazione.caserma == 13, profondita.caserma-mulino-nero == 0]
    testo: |
      Il canale scorre torbido fra due rive di pietra, nascosto alle
      finestre, dal ponticello della strada fino alla ruota, dove
      un'apertura nel muro fa entrare l'acqua in cantina. Vicino al
      ponticello, su un sasso della riva, c'è un mantello scarlatto piegato
      con cura.

      {resistenza Media} L'acqua di un canale d'autunno è fredda, e le gambe
      se ne accorgeranno al primo passo.
    opzioni:
      - testo: "Risalire il canale nell'acqua"
        descrizione: "Nell'acqua fino alla vita, sotto la riva."
        prova: { attributo: fisico, abilita: [resistenza, furtivita], difficolta: Media }
        successo:
          titolo: Sotto la riva
          testo: |
            Curvi sotto la riva, con le armi sopra la testa, arrivate gelati al
            muro del mulino senza che nessuno vi veda.
          effetti: { profondita.caserma-mulino-nero: 1 }
        fallimento:
          titolo: La buca
          testo: |
            Finisci in una buca fino al collo, e il rumore fa affacciare qualcuno
            alla finestra. Dovete tornare indietro nell'acqua.
          effetti: { ferite: 0.5 }

      - testo: "Prendere il mantello piegato sul sasso"
        descrizione: "È di uno dei disertori, e piegato così sembra un ripensamento."
        prova: { attributo: sociale, abilita: [empatia, conoscenze-della-strada], difficolta: Facile }
        successo:
          titolo: Il cartellino
          testo: |
            Sotto il colletto c'è il cartellino del furiere con il nome di un
            ragazzo dei Ponti che ha fatto la ronda mista con te. Ti porti il
            mantello sul braccio per restituirglielo.
          effetti: { profondita.caserma-mulino-nero: 1 }
        fallimento:
          titolo: Un mantello
          testo: |
            È soltanto un mantello piegato bene, e lo lasci sul suo sasso.
          effetti: { tormento: 1 }

      - testo: "Fare il giro largo dal ponticello"
        descrizione: "Si gira largo dietro gli alberi, e ci vuole tempo."
        costo: 2
        esito:
          titolo: Il giro degli alberi
          testo: |
            Girate dietro i pioppi oltre il ponticello e arrivate asciutti al muro
            posteriore del mulino, con il sole già basso.
          effetti: { profondita.caserma-mulino-nero: 1 }

  # ------------------------------------------------------------ 0–1 · la vedetta
  - id: caserma-mulino-la-vedetta
    immagine: icone/cape
    titolo: La vedetta
    sommario: "Sul muro del cortile un disertore fa la vedetta con la testa fra le mani."
    luogo: Il Mulino Nero, il muro del cortile
    area: caserma-mulino-nero
    ripetibile: true
    requisiti: [fazione.caserma == 13, profondita.caserma-mulino-nero <= 1]
    testo: |
      Sul muro del cortile siede uno dei disertori, con il mantello
      scarlatto rovesciato e una balestra leggera sulle ginocchia. Invece di
      guardare la strada tiene la testa fra le mani.

      {empatia Facile} Lo conosci, è quello che ti ha prestato la sciarpa
      una notte di ronda d'inverno e non te l'ha più chiesta indietro.
    opzioni:
      - testo: "Parlargli dal basso del muro"
        descrizione: "Se torna indietro, in cantina ci sarà un uomo in meno."
        prova: { attributo: sociale, abilita: persuasione, difficolta: Media }
        successo:
          titolo: La sciarpa
          testo: |
            Gli parli piano della notte della sciarpa e gli dici che Galdrick li
            vuole vivi. Alla fine posa la balestra e scende dalla tua parte, e
            Linna gli dà la sua borraccia.
          effetti: { profondita.caserma-mulino-nero: 1, caserma.disertori: 1 }
        fallimento:
          titolo: La balestra
          testo: |
            Lui scatta in piedi e tira, più spaventato di te, poi sparisce oltre
            il muro gridando che arrivate.
          effetti: { ferite: 0.5 }

      - testo: "Arrivargli alle spalle"
        descrizione: "Da dietro lo si prende prima che alzi la balestra."
        prova: { attributo: fisico, abilita: [furtivita, rissa], difficolta: Media }
        successo:
          titolo: Il polso
          testo: |
            Gli prendi il polso della balestra prima che si volti, e lui non lotta
            mentre lo leghi al cancello con la sua cinghia.
          effetti: { profondita.caserma-mulino-nero: 1 }
        fallimento:
          titolo: Il grido
          testo: |
            Una pietra si stacca sotto la tua mano e il disertore grida l'allarme,
            così vi ritirate nelle stoppie.
          effetti: { tormento: 1 }

      - testo: "Aspettare che scenda dal muro"
        descrizione: "Prima del tramonto scende per il cambio."
        costo: 2
        esito:
          titolo: Il cambio
          testo: |
            Aspettate nel fosso che scenda per il cambio e scavalcate il muro
            mentre il cortile è vuoto.
          effetti: { profondita.caserma-mulino-nero: 1 }

  # ------------------------------------------------------------ 1 · il cortile e la stalla
  - id: caserma-mulino-il-cortile
    immagine: ambientazione/mulino-malgrani
    titolo: Il cortile del mulino
    sommario: "Nel cortile ci sono i sacchi di farina bruciata e un disertore che spacca legna."
    luogo: Il Mulino Nero, il cortile
    area: caserma-mulino-nero
    ripetibile: true
    requisiti: [fazione.caserma == 13, profondita.caserma-mulino-nero == 1]
    testo: |
      Il cortile è coperto di cenere, e lungo il muro stanno i sacchi di
      farina bruciata dei Malgrani. In mezzo un disertore spacca legna con
      la spada d'ordinanza, perché l'ascia non l'hanno trovata.

      {galateo Media fallita} Ti chiedi se fra disertori e miliziani ci si
      saluti ancora con il pugno sul petto, e il pugno ti resta a metà
      strada.
    opzioni:
      - testo: "Convincerlo a posare la spada"
        descrizione: "Se posa la spada adesso, in cantina ci sarà un uomo in meno."
        prova: { attributo: sociale, abilita: persuasione, difficolta: Media }
        successo:
          titolo: La legna
          testo: |
            Gli dici che la legna gliela spacca un altro, e lui pianta la spada
            nel ceppo. Ti dice che Brando è giù con l'uomo delle carte, e che
            hanno paura tutti e due.
          effetti: { profondita.caserma-mulino-nero: 1, caserma.disertori: 1 }
        fallimento:
          titolo: La spada nel ceppo
          testo: |
            Lui ti risponde con un fendente da cortile, che pari per abitudine, e
            scappa dentro il mulino gridando.
          effetti: { ferite: 0.5 }

      - testo: "Prenderlo prima che gridi"
        descrizione: "Ha le mani occupate, e bastano tre passi di corsa."
        prova: { attributo: fisico, abilita: [rissa, atletica], difficolta: Media }
        successo:
          titolo: I tre passi
          testo: |
            Lo prendi per la cintura prima che si giri e lo legate sui sacchi, e
            lui chiude gli occhi senza gridare.
          effetti: { profondita.caserma-mulino-nero: 1 }
        fallimento:
          titolo: La cenere
          testo: |
            Scivoli nella cenere al secondo passo e il disertore fa in tempo a
            gridare, così vi ritirate dietro il muro.
          effetti: { ferite: 0.5 }

      - testo: "Girare dietro i sacchi"
        descrizione: "Lungo il muro, dietro i sacchi, fino alla porta del mulino."
        costo: 2
        esito:
          titolo: Dietro i sacchi
          testo: |
            Passate curvi dietro i sacchi, coperti dal rumore della legna, e
            arrivate alla porta del mulino grigi di farina bruciata.
          effetti: { profondita.caserma-mulino-nero: 1 }

  - id: caserma-mulino-la-stalla
    immagine: ambientazione/mulino-malgrani
    titolo: La stalla
    sommario: "La stalla del mulino ha una porta sprangata che dà sulla sala delle macine."
    luogo: Il Mulino Nero, la stalla
    area: caserma-mulino-nero
    ripetibile: true
    requisiti: [fazione.caserma == 13, profondita.caserma-mulino-nero == 1]
    testo: |
      La stalla è l'unica stanza del mulino con il tetto intero. Ci sono due
      muli alla mangiatoia, e in fondo una porta sprangata dall'interno dà
      sulla sala delle macine. Dalla fessura sotto arrivano la luce di una
      lanterna e delle voci.

      {addestrare-animali Facile} I muli hanno il marchio della Caserma sulla
      coscia. Brando ha portato via anche quelli, e stamattina li ha
      strigliati.
    opzioni:
      - testo: "Alzare la spranga con la lama"
        descrizione: "Una lama nella fessura, piano, mentre dentro parlano."
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Media }
        successo:
          titolo: La spranga
          testo: |
            Alzi la spranga con la lama un dito alla volta, mentre di là qualcuno
            racconta una partita a carte, e la porta si apre senza rumore.
          effetti: { profondita.caserma-mulino-nero: 1 }
        fallimento:
          titolo: La lama
          testo: |
            La spranga cade con un colpo che sveglia i muli, e vi ritirate nel
            cortile mentre di là le voci tacciono.
          effetti: { tormento: 1 }

      - testo: "Bussare come Fulvio"
        descrizione: "Fulvio Saldo è con loro e riferisce a te. Alla stalla bussa due volte, poi una."
        quando: [caserma.saldo == 2]
        prova: { attributo: sociale, abilita: empatia, difficolta: Media }
        successo:
          titolo: Due volte, poi una
          testo: |
            La spranga si alza e Fulvio ti guarda a lungo da sopra la sciarpa
            prima di aprire. «Io non ho visto niente» dice, e si mette contro il
            muro con le mani alzate.
          effetti: { profondita.caserma-mulino-nero: 1, caserma.disertori: 1 }
        fallimento:
          titolo: La faccia di Fulvio
          testo: |
            Fulvio si affaccia alla fessura e grida il tuo nome verso la sala
            prima di chiuderti la porta in faccia. Il foglio dei turni l'ha
            venduto anche a te.
          effetti: { sospetto: 1.5 }

      - testo: "Chiamare Fulvio dalla fessura"
        descrizione: "Gli hai pagato il debito, e Fulvio Saldo sa quali porte si aprono."
        quando: [caserma.saldo == 3]
        esito:
          titolo: La porta aperta
          testo: |
            Fulvio apre con la sciarpa sul naso. «Brando è giù in cantina con
            quello delle carte» dice. «Gli altri due sono di sopra, nel granaio.»
            Poi esce a sedersi sui sacchi del cortile.
          effetti: { profondita.caserma-mulino-nero: 1, caserma.disertori: 1 }

      - testo: "Uscire dalla stalla e cercare un'altra porta"
        descrizione: "La sala ha anche una porta sul canale, più lontana."
        costo: 2
        esito:
          titolo: La porta sul canale
          testo: |
            Entrate dalla porta socchiusa sul canale nella sala delle macine, dove
            la luce della lanterna arriva soltanto a metà.
          effetti: { profondita.caserma-mulino-nero: 1 }

  # ------------------------------------------------------------ 1–2 · le travi in fiamme
  - id: caserma-mulino-le-travi-in-fiamme
    immagine: ambientazione/mulino-malgrani
    titolo: Le travi che bruciano ancora
    sommario: "Una trave del tetto brucia ancora sopra l'unico passaggio."
    luogo: Il Mulino Nero, il corridoio delle travi
    area: caserma-mulino-nero
    ripetibile: true
    requisiti: [fazione.caserma == 13, profondita.caserma-mulino-nero >= 1, profondita.caserma-mulino-nero <= 2]
    testo: |
      Nel corridoio verso la sala delle macine il tetto è mezzo crollato, e
      una trave maestra brucia ancora dall'interno come un tizzone, lasciando
      cadere pezzi di brace. Sotto c'è il solo passaggio, largo quanto un
      uomo.

      {medicina Media} Le travi di quercia bruciano così per settimane, e il
      giorno che cedono vengono giù tutte insieme.
    opzioni:
      - testo: "Passare sotto la trave di corsa"
        descrizione: "Uno alla volta e di corsa, sotto la trave che brucia."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Media }
        successo:
          titolo: La brace
          testo: |
            Passi per primo di corsa, e una brace ti buca il mantello senza
            arrivare alla pelle. Gli altri ti seguono uno alla volta.
          effetti: { profondita.caserma-mulino-nero: 1 }
        fallimento:
          titolo: Il pezzo di trave
          testo: |
            A metà passaggio un pezzo di trave ti cade sul braccio, e torni
            indietro con la manica che fuma.
          effetti: { ferite: 1 }

      - testo: "Puntellare la trave"
        descrizione: "Una trave messa di traverso regge quella che brucia il tempo di passare."
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Media }
        successo:
          titolo: Il puntello
          testo: |
            Pianti di traverso una trave del pavimento crollato sotto quella che
            brucia, e passate tutti prima che il puntello cominci a fumare.
          effetti: { profondita.caserma-mulino-nero: 1 }
        fallimento:
          titolo: Il puntello storto
          testo: |
            Il puntello scivola sul pavimento bagnato e la trave ci scende sopra
            con uno sbuffo di brace, così vi ritirate nel cortile tossendo.
          effetti: { ferite: 0.5, tormento: 1 }

      - testo: "Aspettare che la trave cada"
        descrizione: "Prima o poi cade da sola, basta stare lontani."
        costo: 2
        esito:
          titolo: Il crollo
          testo: |
            Dopo un'ora d'attesa nel cortile la trave cede tutta insieme, con un
            rumore che fa volare i corvi dal tetto. Quando la polvere si posa il
            passaggio è libero.
          effetti: { profondita.caserma-mulino-nero: 1 }

  # ------------------------------------------------------------ 2 · la sala delle macine e la scala
  - id: caserma-mulino-la-sala-delle-macine
    immagine: ambientazione/mulino-malgrani
    titolo: La sala delle macine
    sommario: "Fra le macine ferme aspettano due balestrieri con il mantello rovesciato o il cappuccio degli Scuri."
    luogo: Il Mulino Nero, la sala delle macine
    area: caserma-mulino-nero
    ripetibile: true
    requisiti: [fazione.caserma == 13, profondita.caserma-mulino-nero == 2]
    testo: |
      La sala delle macine è alta due piani, con l'albero di trasmissione
      spezzato che pende sulle macine ferme. Dietro ci sono due uomini con le
      balestre leggere, uno con il cappuccio degli Scuri e l'altro con il
      mantello scarlatto rovesciato.

      {intimidire Media} Il disertore guarda lo Scuro prima di guardare te.
      Se lo Scuro cade, lui posa la balestra.
    opzioni:
      - testo: "Affrontarli fra le macine"
        descrizione: "Si avanza da una macina all'altra, sotto due balestre."
        combattimento: caserma-i-balestrieri
        vittoria:
          titolo: Le macine
          testo: |
            Avanzi di macina in macina sotto i dardi e prendi lo Scuro mentre
            ricarica. Il disertore posa la balestra e si siede sulla macina con le
            mani in grembo.
          effetti: { profondita.caserma-mulino-nero: 1, caserma.disertori: 1 }
        sconfitta:
          titolo: Il dardo nella gamba
          testo: |
            Un dardo ti prende alla coscia, e Linna ti tira fuori dalla sala per
            il mantello.
          effetti: { tormento: 1 }

      - testo: "Parlare al disertore sopra la testa dello Scuro"
        descrizione: "Se il disertore posa la balestra, lo Scuro resta solo."
        prova: { attributo: sociale, abilita: [persuasione, intimidire], difficolta: Media }
        successo:
          titolo: Il nome del turno
          testo: |
            Dici ad alta voce il nome del disertore e quello di sua sorella, che
            vende il pane al Mercato dei Nodi, e lui abbassa la balestra. Lo
            Scuro, rimasto solo, scappa per la porta sul canale.
          effetti: { profondita.caserma-mulino-nero: 1, caserma.disertori: 1 }
        fallimento:
          titolo: Il dardo dello Scuro
          testo: |
            Lo Scuro tira prima che il disertore possa decidere, e con un dardo di
            striscio al fianco vi ritirate fuori dalla sala.
          effetti: { ferite: 1 }

      - testo: "Aspettare che finiscano i dardi"
        descrizione: "Le balestre leggere hanno pochi dardi, e dietro la porta si aspetta."
        costo: 2
        esito:
          titolo: I dardi contati
          testo: |
            Fate sporgere da dietro la porta un mantello su un bastone finché i
            dardi finiscono. Lo Scuro scappa dalla porta sul canale e il disertore
            resta seduto sulla macina.
          effetti: { profondita.caserma-mulino-nero: 1 }

  - id: caserma-mulino-la-scala
    immagine: ambientazione/mulino-malgrani
    titolo: La scala del granaio
    sommario: "In cima alla scala bruciata un disertore non sa se scendere."
    luogo: Il Mulino Nero, la scala
    area: caserma-mulino-nero
    ripetibile: true
    requisiti: [fazione.caserma == 13, profondita.caserma-mulino-nero == 2]
    testo: |
      La scala di legno che sale al granaio ha metà dei gradini bruciati, e
      quelli rimasti reggono soltanto sul bordo. In cima, seduto sull'ultimo
      gradino intero, il più giovane dei disertori ti guarda salire con la
      spada sulle ginocchia.

      {empatia Media} Ha diciannove anni, forse meno, ed è rimasto perché
      Brando era il suo sergente.
    opzioni:
      - testo: "Convincerlo a scendere"
        descrizione: "Un sergente non chiede a un ragazzo di morire per lui."
        prova: { attributo: sociale, abilita: [empatia, persuasione], difficolta: Media }
        successo:
          titolo: Il sergente
          testo: |
            Gli ricordi che Brando gli ha detto di andarsene finché poteva. Il
            ragazzo piange senza vergogna, poi scende sul bordo dei gradini e ti
            dà la spada con l'elsa avanti.
          effetti: { profondita.caserma-mulino-nero: 1, caserma.disertori: 1 }
        fallimento:
          titolo: La spada
          testo: |
            Lui si alza con la spada in mano e ti dice che Brando è il suo
            sergente e tu no, e torni giù prima che un gradino ti ceda.
          effetti: { tormento: 1 }

      - testo: "Salire sul bordo dei gradini"
        descrizione: "Sul bordo i gradini reggono, se sali prima che lui decida."
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Media }
        successo:
          titolo: Il bordo
          testo: |
            Sali svelto sul bordo dei gradini e gli prendi la spada dalle
            ginocchia prima che si alzi, e lui non te la nega.
          effetti: { profondita.caserma-mulino-nero: 1 }
        fallimento:
          titolo: Il gradino
          testo: |
            Un gradino ti cede sotto il piede e resti appeso al montante, mentre
            il ragazzo ti guarda tornare giù.
          effetti: { ferite: 0.5 }

      - testo: "Lasciarlo lì e cercare un'altra strada"
        descrizione: "Dalla sala delle macine si scende in cantina anche per il canale."
        costo: 2
        esito:
          titolo: La scala del canale
          testo: |
            Dietro le macine trovi una scaletta di pietra che scende verso il
            canale e la ruota.
          effetti: { profondita.caserma-mulino-nero: 1 }

  # ------------------------------------------------------------ 2–3 · la ruota
  - id: caserma-mulino-la-ruota
    immagine: ambientazione/mulino-malgrani
    titolo: La ruota
    sommario: "Fra le pale spezzate della ruota si passa fino alla cantina."
    luogo: Il Mulino Nero, la ruota
    area: caserma-mulino-nero
    ripetibile: true
    requisiti: [fazione.caserma == 13, profondita.caserma-mulino-nero >= 2, profondita.caserma-mulino-nero <= 3]
    testo: |
      La ruota, alta tre uomini, è ferma nel canale con un cuneo che le
      blocca l'asse. Da un'apertura nel muro, sotto le pale spezzate,
      salgono dalla cantina la luce di una lanterna e una voce che conta
      piano, in un gergo che capisci a metà.

      {conoscenze-della-strada Media} È il gergo dei bari della Pignatta.
      Nihali conta le carte, come faceva al tavolo, per calmarsi.
    opzioni:
      - testo: "Passare fra le pale della ruota"
        descrizione: "Fra le pale c'è un varco, a patto di non toccare il cuneo."
        prova: { attributo: fisico, abilita: [acrobazia, furtivita], difficolta: Media }
        successo:
          titolo: Fra le pale
          testo: |
            Passi fra le pale con l'acqua alle ginocchia e il cuneo a un palmo
            dalla spalla, fin sotto l'apertura della cantina. La voce che conta
            smette per un momento, poi riprende.
          effetti: { profondita.caserma-mulino-nero: 1 }
        fallimento:
          titolo: Il cuneo
          testo: |
            Urti il cuneo con la spalla e la ruota gira di un palmo, e torni
            indietro di corsa prima che l'apertura si chiuda.
          effetti: { ferite: 0.5 }

      - testo: "Bloccare la ruota per sempre"
        descrizione: "Con una trave fra le pale l'apertura resta aperta."
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Media }
        successo:
          titolo: La trave fra le pale
          testo: |
            Blocchi la ruota con una trave infilata fra due pale e passate tutti
            sotto l'apertura senza fretta.
          effetti: { profondita.caserma-mulino-nero: 1 }
        fallimento:
          titolo: La trave che scivola
          testo: |
            La trave scivola sulle pale bagnate e cade nel canale, e in cantina la
            voce smette di contare.
          effetti: { tormento: 1 }

      - testo: "Aspettare la notte nel canale"
        descrizione: "Di notte la lanterna in cantina si vede, e voi no."
        costo: 2
        esito:
          titolo: Il canale di notte
          testo: |
            Aspettate la notte nell'acqua del canale, e quando la lanterna in
            cantina si abbassa passate fra le pale uno alla volta.
          effetti: { profondita.caserma-mulino-nero: 1 }

  # ------------------------------------------------------------ 3 · il granaio
  - id: caserma-mulino-il-granaio
    immagine: ambientazione/mulino-malgrani
    titolo: Il granaio annerito
    sommario: "Nel granaio, sotto il tetto crollato, c'è l'ultimo dei disertori, con la cassa delle paghe."
    luogo: Il Mulino Nero, il granaio
    area: caserma-mulino-nero
    ripetibile: true
    requisiti: [fazione.caserma == 13, profondita.caserma-mulino-nero == 3]
    testo: |
      Il granaio sta sotto il tetto mezzo crollato, e il grano bruciato
      scricchiola sotto gli stivali. In un angolo, seduto su una cassa di
      ferro chiusa con un lucchetto, c'è l'ultimo dei disertori, un uomo
      grosso con i capelli bianchi e la spada sguainata accanto.

      {politica-ed-economia Media} È la cassa delle paghe della ronda dei
      Ponti, e se l'è portata dietro senza aprirla.
    opzioni:
      - testo: "Convincerlo a lasciare la cassa"
        descrizione: "Trent'anni di servizio e una cassa mai aperta. Forse vuole che qualcuno gliela riprenda."
        prova: { attributo: sociale, abilita: [persuasione, galateo], difficolta: Media }
        successo:
          titolo: La cassa chiusa
          testo: |
            Gli chiedi perché non l'ha aperta, e dopo averci pensato a lungo ti
            risponde che la paga dei Ponti non è roba sua. Poi ti dà la chiave del
            lucchetto.
          effetti: { profondita.caserma-mulino-nero: 1, caserma.disertori: 1 }
        fallimento:
          titolo: Trent'anni
          testo: |
            Ti risponde che in trent'anni ne ha sentiti tanti come te, e quando si
            alza con la spada in mano tornate giù dalla scala.
          effetti: { tormento: 1 }

      - testo: "Disarmarlo"
        descrizione: "Se lo prendi prima che si alzi, non ha spazio per la spada."
        prova: { attributo: fisico, abilita: [rissa, armi-da-mischia], difficolta: Media }
        successo:
          titolo: La spada a terra
          testo: |
            Gli sei addosso prima che si alzi e lui non lotta. Ti dice soltanto
            che una volta, al cortile, quella presa la insegnava lui.
          effetti: { profondita.caserma-mulino-nero: 1 }
        fallimento:
          titolo: Il vecchio
          testo: |
            Si alza più svelto di quanto credessi e il pomo della spada ti prende
            alla tempia, e Linna ti trascina fuori dal granaio per il mantello.
          effetti: { ferite: 1 }

      - testo: "Lasciarlo con la sua cassa"
        descrizione: "Una botola scende in cantina, e lui dalla cassa non si muove."
        costo: 2
        esito:
          titolo: La botola
          testo: |
            Lo lasci sulla cassa e sotto il grano bruciato trovi la botola che
            scende in cantina, verso una luce di lanterna.
          effetti: { profondita.caserma-mulino-nero: 1 }

  # ------------------------------------------------------------ il cuore · la cantina sotto la ruota
  - id: caserma-mulino-la-cantina
    immagine: personaggi/nihali-cuzan
    titolo: La cantina sotto la ruota
    sommario: "In cantina Brando Selli e Nihali Cuzan aspettano con il libro delle paghe di Vesh."
    luogo: Il Mulino Nero, la cantina
    area: caserma-mulino-nero
    requisiti: [fazione.caserma == 13, profondita.caserma-mulino-nero >= 4]
    testo: |
      La cantina sotto la ruota è bassa e umida. Su un tavolo fatto di una
      porta e due botti ci sono una lanterna, un mazzo di carte e un libro
      dalla copertina di cuoio rosso, e lì seduto Nihali Cuzan mischia le
      carte con la pipa spenta fra i denti. Fra te e il tavolo c'è Brando
      Selli, con il mantello rovesciato e la spada d'ordinanza tenuta bassa,
      come si insegna in cortile.

      «Il libro lo vende lui» dice Brando, senza girarsi verso Nihali. «Nei
      villaggi, una pagina alla volta. A chi c'è scritto sopra, e a chi lo
      vuole leggere.» Ti guarda il mantello. «Il mio nome è a pagina tre.
      Vent'anni di ronde e il mio nome a pagina tre.»

      {empatia Media} Non ti chiede pietà. Vuole che tu capisca che lui sa
      quanto è caduto in basso, e che non ha intenzione di sentirselo dire.

      {percezione Difficile} Nihali ha una carta fra le dita della mano
      sinistra, sotto il tavolo. La tiene lì da quando sei entrato.
    opzioni:
      - testo: "Parlare con Brando"
        descrizione: "Vent'anni prima di te ha firmato il registro del furiere con la tua stessa grafia."
        prova: { attributo: sociale, abilita: [persuasione, empatia], difficolta: Difficile }
        successo:
          titolo: Lo stesso banco
          testo: |
            Gli dici che sul registro del furiere la sua firma del primo giorno è
            uguale alla tua, messa allo stesso banco, forse con la stessa penna.
            Brando ti ascolta con la spada bassa. Alla fine te la porge con l'elsa
            avanti e si toglie il mantello rovesciato, mentre dietro di lui Nihali
            smette di mischiare.
          imposta: { caserma.brando: 1 }
          segue: caserma-mulino-il-libro
        fallimento:
          titolo: La spada alzata
          testo: |
            Gli parli del registro, e Brando ride, corto. «Il furiere fa firmare
            tutti allo stesso modo» dice. Pari il primo colpo con la parata che ti
            ha insegnato lui, e il secondo ti prende al braccio mentre indietreggi
            verso la scala.
          effetti: { ferite: 1 }

      - testo: "Affrontare Brando e Nihali"
        descrizione: "Brando para come si insegna in cortile, e con lui ci sono Nihali e un disertore."
        quando: [caserma.disertori < 2]
        combattimento: caserma-la-cantina
        vittoria:
          titolo: La parata
          testo: |
            Brando para tutti i colpi che ti ha insegnato lui, finché a farlo
            cadere è una finta storta da vicolo che non ti ha insegnato nessuno.
            Resta sul pavimento bagnato con la gamba ferita e ti dice di prendere
            il libro, prima che lo prenda l'altro.
          imposta: { caserma.brando: 2 }
          segue: caserma-mulino-il-libro
        sconfitta:
          titolo: Linna
          testo: |
            Nihali ti tira una carta in faccia e Brando ti passa sotto la guardia,
            ma Linna si mette fra te e la spada e la ferita al fianco la prende
            lei. Mentre la squadra vi trascina fuori, ti chiede a denti stretti se
            le hanno rovinato il mantello.
          effetti: { tormento: 1 }
          vai: citta-bassa

      - testo: "Affrontare Brando e Nihali"
        descrizione: "Brando e Nihali sono rimasti soli, perché i disertori hanno deposto le armi."
        quando: [caserma.disertori >= 2]
        combattimento: caserma-la-cantina-ridotta
        vittoria:
          titolo: La parata
          testo: |
            Brando para tutti i colpi che ti ha insegnato lui, finché a farlo
            cadere è una finta storta da vicolo che non ti ha insegnato nessuno.
            Resta sul pavimento bagnato con la gamba ferita e ti dice di prendere
            il libro, prima che lo prenda l'altro.
          imposta: { caserma.brando: 2 }
          segue: caserma-mulino-il-libro
        sconfitta:
          titolo: Linna
          testo: |
            Nihali ti tira una carta in faccia e Brando ti passa sotto la guardia,
            ma Linna si mette fra te e la spada e la ferita al fianco la prende
            lei. Mentre la squadra vi trascina fuori, ti chiede a denti stretti se
            le hanno rovinato il mantello.
          effetti: { tormento: 1 }
          vai: citta-bassa

      - testo: "Ritirarsi e tornare con più uomini"
        descrizione: "La cantina ha una scala sola, e si può tornare un'altra volta."
        costo: 0
        esito:
          titolo: La scala
          testo: |
            Indietreggi verso la scala e Brando non ti segue. Dal tavolo Nihali ti
            saluta con una carta, il re dei Ponti, e la rimette nel mazzo.
          vai: citta-bassa

  - id: caserma-mulino-il-libro
    immagine: personaggi/nihali-cuzan
    titolo: Il libro delle paghe
    tipo: seguito
    luogo: Il Mulino Nero, la cantina
    area: caserma-mulino-nero
    requisiti: [fazione.caserma == 13]
    testo: |
      Il libro delle paghe di Vesh è aperto sul tavolo alla pagina tre,
      mentre Nihali tossisce nel fazzoletto accanto all'apertura del canale.
      Le colonne sono in due grafie, e l'ultima pagina porta la data della
      notte della Pignatta.

      In fondo al libro c'è una colonna di versamenti che non vengono da
      Vesh, e accanto a ogni cifra un occhio chiuso.

      {accademiche Difficile fallita} L'occhio chiuso non l'hai mai visto, e
      la memoria interrogata risponde con un vago senso di colpa.

      In Caserma nessuno saprà dirti che cosa sia, e Nihali, se lo sa, non
      lo dirà.
    opzioni:
      - testo: "Prendere Nihali sulla scala del canale"
        descrizione: "Due disertori che hanno deposto le armi aspettano sulla riva del canale."
        quando: [caserma.disertori >= 2]
        esito:
          titolo: La riva
          testo: |
            Nihali si infila nell'apertura del canale, ma sulla riva lo aspettano
            Linna e i due disertori, che lo riportano dentro bagnato mentre
            tossisce ridendo. Ti metti sotto il mantello il libro intero e il
            mazzo di Nihali. Nella cassa dei disertori c'è la paga di un mese di
            ronde.
          pe: { persuasione: 5 }
          imposta: { caserma.nihali: 1 }
          effetti: { fazione.caserma: 1, monete: 120, oggetto.caserma-mazzo-di-nihali: 1, crepuscolo.indizi: 1, rep.caserma: 1 }
          vai: citta-bassa

      - testo: "Inseguire Nihali nel canale"
        descrizione: "Nihali scappa nel canale con metà del libro strappato."
        quando: [caserma.disertori < 2]
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Difficile }
        successo:
          titolo: Il canale
          testo: |
            Nihali strappa metà del libro e si butta nel canale, ma lo prendi per
            il colletto prima della ruota, e lui, tossendo dalle risate, ti dà le
            pagine bagnate ma ancora leggibili. Nella cassa dei disertori c'è la
            paga di un mese di ronde, e sul tavolo il mazzo di Nihali.
          pe: { atletica: 5 }
          imposta: { caserma.nihali: 1 }
          effetti: { fazione.caserma: 1, monete: 120, oggetto.caserma-mazzo-di-nihali: 1, crepuscolo.indizi: 1, rep.caserma: 1 }
          vai: citta-bassa
        fallimento:
          titolo: Metà del libro
          testo: |
            Nihali strappa metà del libro e si butta nel canale, e lo perdi oltre
            la ruota, nei campi bruciati. Ti restano l'altra metà del libro,
            quella con la colonna dell'occhio chiuso, e il mazzo sul tavolo. Nella
            cassa dei disertori c'è la paga di un mese di ronde.
          imposta: { caserma.nihali: 2 }
          effetti: { fazione.caserma: 1, monete: 120, oggetto.caserma-mazzo-di-nihali: 1, crepuscolo.indizi: 1 }
          vai: citta-bassa

      - testo: "Lasciarlo andare e restare con i feriti"
        descrizione: "Brando sanguina, e Nihali intanto porta via metà del libro."
        esito:
          titolo: I feriti
          testo: |
            Lasci che Nihali sparisca nel canale con metà del libro e stringi la
            cintura sopra la ferita di Brando finché il sangue non rallenta. Ti
            restano l'altra metà del libro, con la colonna dell'occhio chiuso, e
            il mazzo di Nihali. Nella cassa dei disertori c'è la paga di un mese
            di ronde.
          pe: { medicina: 5 }
          imposta: { caserma.nihali: 2 }
          effetti: { fazione.caserma: 1, monete: 120, oggetto.caserma-mazzo-di-nihali: 1, crepuscolo.indizi: 1, rep.caserma: 1 }
          vai: citta-bassa
