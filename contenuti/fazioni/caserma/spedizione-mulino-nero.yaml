# La quest della Caserma, passo 14 (fazione.caserma == 13, pista.pelle >= 6): «Il Mulino Nero», uno dei mulini che gli
# Scuri bruciarono per i Malgrani, sulla strada di Laresh oltre il Ponte del Conciatore. Ci si sono chiusi Brando
# Selli, tre miliziani disertori e Nihali Cuzan con il libro delle paghe di Vesh.
# Ci si entra da caserma-il-mulino-nero (Città Bassa, ripetibile finché il passo è aperto). Ritorno in Città Bassa,
# soglia 4, tre stanze alla volta.
# Fasce di profondità: 0 i campi bruciati, il canale; 0-1 la vedetta; 1 il cortile, la stalla (Fulvio Saldo secondo
# caserma.saldo); 1-2 le travi in fiamme; 2 la sala delle macine (combattimento), la scala del mulino; 2-3 la ruota;
# 3 il granaio annerito. In quattro stanze si può convincere un disertore a deporre le armi (caserma.disertori): con
# due, nella cantina restano soltanto Brando e Nihali (scontro caserma-la-cantina-ridotta).
# Il cuore (4) è la cantina sotto la ruota: Brando e Nihali (boss Difficile), oppure parlare con Brando (Difficile).
# Il seguito chiude il passo: Nihali preso o fuggito con metà del libro (caserma.nihali), la colonna con l'occhio
# chiuso nel libro (crepuscolo.indizi), la cassa dei disertori e il mazzo di Nihali.
aree:
  - id: caserma-mulino-nero
    immagine: ambientazione/mulino-malgrani
    nome: Il Mulino Nero
    sommario: "Un mulino dei Malgrani bruciato dagli Scuri, sulla strada di Laresh."
    spedizione: { ritorno: citta-bassa, soglia: 4, stanze: 3 }
    testo: |
      Il mulino sta sulla riva di un canale che scende verso il Torvessa, a mezza giornata dal Ponte del
      Conciatore. Era dei Malgrani finché gli Scuri non gli hanno dato fuoco, e adesso lo chiamano il Mulino
      Nero. I muri sono anneriti fino al tetto, crollato a metà. Fra le pietre la calce delle giunture si è
      cotta e sbriciolata, e sopra ogni finestra la fuliggine ha lasciato una lingua nera fino alla gronda. La
      ruota è ferma nel canale con le pale spezzate, e dal comignolo del granaio esce un filo di fumo.

      Intorno ci sono campi di grano bruciati e mai riseminati. Le stoppie nere sono rimaste in piedi, e a
      ogni passo la cenere si alza e ricade sulle scarpe. Sui campi non c'è un uccello, e i corvi stanno tutti
      sul tetto del mulino.

storylet:
  # ------------------------------------------------------------ l'ingresso, in Città Bassa
  - id: caserma-il-mulino-nero
    presso: caserma-casa-blu
    immagine: ambientazione/mulino-malgrani
    titolo: Il Mulino Nero
    sommario: "Brando Selli e i disertori sono al Mulino Nero, sulla strada di Laresh. Galdrick ha la ferita al fianco, così la squadra la guidi tu."
    luogo: Città Bassa, la porta dell'ovest
    area: citta-bassa
    ripetibile: true
    requisiti: [fazione.caserma == 13, bivio.legge == 1, pista.pelle >= 6]
    testo: |
      La squadra ti aspetta alla porta dell'ovest con i mantelli piegati sul braccio, come ha insegnato Brando
      a tutti. Sono sei miliziani e Linna Varo, che ormai porta il mantello senza tenerlo sollevato con la
      mano. Galdrick vi ha salutato dal portone e ha detto soltanto che li vuole vivi.

      {empatia Media} I miliziani hanno fatto la ronda con Brando per anni. Andranno dove dici tu, ma ognuno
      spera di non essere il primo.

      Il Mulino Nero si vede da lontano per il filo di fumo. È l'unico comignolo che fuma su tutta la strada
      di Laresh.
    opzioni:
      - testo: "Partire con la squadra"
        descrizione: "Mezza giornata a piedi con la squadra. Si arriva al mulino nel pomeriggio."
        esito:
          titolo: La strada di Laresh
          testo: |
            Partite a passo di ronda, con il sole alle spalle, e nessuno canta. Oltre il Ponte del Conciatore
            la strada diventa di terra battuta, e ai lati i campi sono stoppie nere che nessuno ha riseminato.
            Linna cammina accanto a te e ti racconta di suo padre e del Ponte dei Morti, a voce bassa, per
            riempire la strada. Nel pomeriggio il filo di fumo diventa un comignolo, e sotto il comignolo un
            mulino nero.
          vai: caserma-mulino-nero

      - testo: "Partire a cavallo, prima della squadra"
        descrizione: "A cavallo si arriva prima, e si guarda il mulino da lontano prima che i disertori vedano la squadra."
        quando: [chiave.cavalcatura >= 1]
        costo: 0
        esito:
          titolo: Davanti a tutti
          testo: |
            Parti a cavallo all'alba e arrivi al mulino a metà mattina, molto prima della squadra. Lo guardi a
            lungo da una collinetta di stoppie e conti le finestre. Il cavallo strappa l'erba al margine della
            strada, e ogni tanto alza la testa verso il mulino con le orecchie dritte. Quando la squadra ti
            raggiunge sai già da che parte entrare.
          vai: caserma-mulino-nero

  # ------------------------------------------------------------ 0 · fuori dal mulino
  - id: caserma-mulino-i-campi-bruciati
    immagine: ambientazione/mulino-malgrani
    titolo: I campi bruciati
    sommario: "Fra il mulino e la strada ci sono i campi bruciati, dove non c'è un riparo. Dalle finestre si vede chi arriva."
    luogo: Il Mulino Nero, i campi bruciati
    area: caserma-mulino-nero
    ripetibile: true
    requisiti: [fazione.caserma == 13, profondita.caserma-mulino-nero == 0]
    testo: |
      Fra la strada e il mulino ci sono trecento passi di campi bruciati, piatti, con le stoppie nere che
      arrivano al ginocchio e nient'altro. Le stoppie si sbriciolano sotto la suola e lasciano sui calzoni una
      cenere grassa che non va via con la mano. Fra i filari non c'è un passero, e quando metti il piede
      avanti non salta via nemmeno un grillo. Dalle finestre del primo piano del mulino si vede tutto. Le
      finestre non hanno più le imposte, e i muri intorno sono neri fino al tetto. In una delle finestre, ogni
      tanto, si muove qualcosa.

      {natura Facile} Il vento viene dal mulino verso la strada, e porta via i rumori. Chi cammina nelle
      stoppie dal lato giusto non si sente.
    opzioni:
      - testo: "Attraversare i campi a gruppi, di corsa"
        descrizione: "Due alla volta, di corsa, da un filare di stoppie all'altro. Chi è alla finestra può tirare a uno solo."
        prova: { attributo: fisico, abilita: [atletica, furtivita], difficolta: Media }
        successo:
          titolo: Di filare in filare
          testo: |
            Mandi la squadra a coppie, di corsa, da un filare all'altro, e tu vai con l'ultima coppia. Dalla
            finestra parte un dardo che arriva troppo tardi e si pianta nelle stoppie dietro Linna. Intorno
            all'asta si alza un piccolo sbuffo di cenere. Arrivate tutti al muro del cortile con le stoppie
            nei calzoni.
          effetti: { profondita.caserma-mulino-nero: 1 }
        fallimento:
          titolo: Il dardo
          testo: |
            Partite troppo insieme, e dalla finestra il dardo trova un miliziano alla spalla. Lo trascinate
            indietro fino alla strada. Quando gli togli il dardo lo riconosci, perché è uguale a quelli che il
            furiere conta due volte sul banco. Ci vuole un'ora per rimandarlo in città e rimettere in piedi la
            squadra.
          effetti: { ferite: 0.5, tormento: 1 }

      - testo: "Arrivare dal lato del vento"
        descrizione: "Il vento porta via i rumori. Girando largo, dal lato giusto, si arriva al muro senza farsi vedere."
        prova: { attributo: mentale, abilita: [natura, percezione], difficolta: Media }
        successo:
          titolo: Sottovento
          testo: |
            Fai girare la squadra largo, dal lato da cui viene il vento, curvi fra le stoppie. Ci mettete il
            doppio. Il vento passa sulle stoppie con un fruscio continuo che copre i vostri passi. Arrivate al
            muro del cortile senza che dalla finestra parta niente, e senti dentro una voce che dice che non
            arriverà nessuno prima di sera.
          effetti: { profondita.caserma-mulino-nero: 1 }
        fallimento:
          titolo: Il vento che gira
          testo: |
            A metà del giro il vento gira, come fa il vento di pianura nel pomeriggio, e vi spinge davanti la
            cenere delle stoppie verso il mulino. Dalla finestra qualcuno grida. Vi ritirate sulla strada
            prima che arrivino i dardi.
          effetti: { tormento: 1 }

      - testo: "Aspettare il buio"
        descrizione: "Di notte i campi sono soltanto buio. Si perde un giorno, e la squadra si innervosisce."
        costo: 2
        esito:
          titolo: La notte nelle stoppie
          testo: |
            Aspettate il buio sdraiati nel fosso della strada, con la squadra che si passa il pane senza
            parlare. Il fondo del fosso è umido e sa di terra bruciata. Quando la luna è coperta attraversate
            i campi uno alla volta. Linna arriva al muro per ultima, e ti dice che ha contato le stelle per
            non pensare.
          effetti: { profondita.caserma-mulino-nero: 1 }

  - id: caserma-mulino-il-canale
    immagine: ambientazione/mulino-malgrani
    titolo: Il canale
    sommario: "Il canale del mulino arriva fino alla ruota. Si può risalire nell'acqua, sotto la riva."
    luogo: Il Mulino Nero, il canale
    area: caserma-mulino-nero
    ripetibile: true
    requisiti: [fazione.caserma == 13, profondita.caserma-mulino-nero == 0]
    testo: |
      Il canale che porta l'acqua alla ruota scorre torbido fra due rive di pietra, con l'erba che pende dai
      bordi. Le pietre sono squadrate e murate a secco, e sono verdi di muschio fino a una riga netta che
      segna l'altezza dell'acqua di quando la ruota girava. Adesso l'acqua passa un palmo sotto quella riga e
      porta a galla una schiuma grigia di cenere. Dal ponticello della strada il canale arriva fino al mulino
      senza che dalle finestre lo si veda. In fondo, sotto la ruota ferma, c'è un'apertura nel muro dove
      l'acqua entra nella cantina.

      {percezione Facile} Sulla riva, all'altezza del ponticello, c'è un mantello scarlatto piegato con cura
      su un sasso. È piegato in quattro con il colletto in cima e gli orli pari. Qualcuno se l'è tolto prima
      di andarsene, e non l'ha buttato.
    opzioni:
      - testo: "Risalire il canale nell'acqua"
        descrizione: "Nell'acqua fino alla vita, sotto la riva, fino al muro del mulino."
        prova: { attributo: fisico, abilita: [resistenza, furtivita], difficolta: Media }
        successo:
          titolo: Sotto la riva
          testo: |
            Risalite il canale nell'acqua fino alla vita, curvi sotto la riva e con le armi sopra la testa. Il
            fondo è fango sopra le lastre, e a ogni passo ne sale una nuvola che la corrente porta via.
            Arrivate al muro del mulino gelati e muti, e nessuno vi ha visti.
          effetti: { profondita.caserma-mulino-nero: 1 }
        fallimento:
          titolo: La buca
          testo: |
            A metà canale il fondo sparisce in una buca, e tu ci finisci dentro fino al collo. Nella buca
            l'acqua è più fredda di colpo e i piedi non trovano il fondo. Il rumore che fai basta a far
            affacciare qualcuno alla finestra, e dovete tornare indietro nell'acqua.
          effetti: { ferite: 0.5 }

      - testo: "Prendere il mantello piegato sul sasso"
        descrizione: "È di uno dei tre disertori. Chi l'ha piegato così forse non è del tutto convinto."
        prova: { attributo: sociale, abilita: [empatia, conoscenze-della-strada], difficolta: Facile }
        successo:
          titolo: Il cartellino
          testo: |
            Sotto il colletto il mantello ha ancora il cartellino del furiere, cucito a punti fitti e con
            sopra a inchiostro un nome che conosci. È un ragazzo dei Ponti che ha fatto la ronda mista con te.
            Lo pieghi sul braccio e lo porti con te per restituirglielo. Seguite la riva fino al mulino.
          effetti: { profondita.caserma-mulino-nero: 1 }
        fallimento:
          titolo: Un mantello
          testo: |
            È soltanto un mantello piegato bene, con la lana umida di rugiada e gli orli pari. Lo lasci sul
            sasso e torni sulla strada con la sensazione di avere perso qualcosa che non sai dire.
          effetti: { tormento: 1 }

      - testo: "Fare il giro largo dal ponticello"
        descrizione: "Dal ponticello si arriva al mulino girando dietro gli alberi. È lungo."
        costo: 2
        esito:
          titolo: Il giro degli alberi
          testo: |
            Passate il ponticello e girate dietro una fila di pioppi, piano, per un tempo lungo. I pioppi
            hanno le foglie basse annerite dal fumo, e quelle in cima sono ancora verdi. Arrivate al muro
            posteriore del mulino con le scarpe asciutte e il sole già basso.
          effetti: { profondita.caserma-mulino-nero: 1 }

  # ------------------------------------------------------------ 0–1 · la vedetta
  - id: caserma-mulino-la-vedetta
    immagine: icone/cape
    titolo: La vedetta
    sommario: "Seduto sul muro del cortile c'è un disertore con il mantello rovesciato, di vedetta. Ha la balestra sulle ginocchia e la testa fra le mani."
    luogo: Il Mulino Nero, il muro del cortile
    area: caserma-mulino-nero
    ripetibile: true
    requisiti: [fazione.caserma == 13, profondita.caserma-mulino-nero <= 1]
    testo: |
      Sul muro del cortile, seduto con le gambe penzoloni, c'è uno dei disertori. Porta il mantello scarlatto
      rovesciato, con la fodera grigia di fuori, e ha una balestra leggera sulle ginocchia. La corda è tesa e
      il dardo è già nella scanalatura. Invece di guardare la strada tiene la testa fra le mani. Il muro è
      alto poco più di un uomo e le pietre in cima sono crepate dal calore dell'incendio, e ogni volta che lui
      sposta il peso ne cade un filo di polvere.

      {empatia Facile} Lo conosci. Ti ha prestato la sciarpa una notte di ronda d'inverno, e non te l'ha più
      chiesta indietro.
    opzioni:
      - testo: "Parlargli dal basso del muro"
        descrizione: "Dirgli che si può ancora tornare. Se ci crede posa la balestra, così nella cantina ci sarà un uomo in meno."
        prova: { attributo: sociale, abilita: persuasione, difficolta: Media }
        successo:
          titolo: La sciarpa
          testo: |
            Dal basso del muro gli parli piano di quella notte d'inverno, quando ti ha prestato la sciarpa.
            Lui alza la testa. Gli dici che Galdrick li vuole vivi e che un mantello rovesciato si rigira.
            Dopo un tempo lungo posa la balestra sul muro e scende dalla tua parte, e Linna gli dà la sua
            borraccia. Lui ha le mani nere di cenere fino ai polsi e beve senza fermarsi.
          effetti: { profondita.caserma-mulino-nero: 1, caserma.disertori: 1 }
        fallimento:
          titolo: La balestra
          testo: |
            Gli parli dal basso del muro, e lui si alza di scatto con la balestra puntata, più spaventato di
            te. Il dardo ti passa accanto con un ronzio corto e si pianta nel fosso fino alle penne. Lui
            sparisce dall'altra parte del muro gridando che arrivano.
          effetti: { ferite: 0.5 }

      - testo: "Arrivargli alle spalle"
        descrizione: "Ha la testa fra le mani. Da dietro, sul muro, lo si prende prima che alzi la balestra."
        prova: { attributo: fisico, abilita: [furtivita, rissa], difficolta: Media }
        successo:
          titolo: Il polso
          testo: |
            Sali sul muro da dietro e gli prendi il polso della balestra prima che si volti. Il polso è
            freddo, e le dita lasciano andare la balestra prima ancora che tu stringa. Lui non lotta. Lo leghi
            al cancello del cortile con la sua cinghia, e scavalchi.
          effetti: { profondita.caserma-mulino-nero: 1 }
        fallimento:
          titolo: Il grido
          testo: |
            Una pietra del muro cotta dall'incendio si sbriciola sotto la tua mano, e lui si volta e grida.
            Dal mulino gli rispondono. Vi ritirate nelle stoppie bruciate prima che arrivino gli altri, e le
            stoppie scricchiolano a ogni passo.
          effetti: { tormento: 1 }

      - testo: "Aspettare che scenda dal muro"
        descrizione: "Prima del tramonto deve scendere per il cambio. Basta aspettare nel fosso."
        costo: 2
        esito:
          titolo: Il cambio
          testo: |
            Aspettate nel fosso, sdraiati fra le stoppie bruciate che vi anneriscono le ginocchia. Quando il
            sole tocca i pioppi lui scende dal muro per il cambio, e nessuno sale al suo posto. Scavalcate il
            muro nel momento in cui il cortile è vuoto.
          effetti: { profondita.caserma-mulino-nero: 1 }

  # ------------------------------------------------------------ 1 · il cortile e la stalla
  - id: caserma-mulino-il-cortile
    immagine: ambientazione/mulino-malgrani
    titolo: Il cortile del mulino
    sommario: "Nel cortile ci sono i sacchi di farina bruciata e un disertore che spacca legna."
    luogo: Il Mulino Nero, il cortile
    area: caserma-mulino-nero
    ripetibile: true
    requisiti: [fazione.caserma == 13, profondita.caserma-mulino-nero == 1]
    testo: |
      Lungo il muro del cortile coperto di cenere ci sono i sacchi di farina dei Malgrani, bruciata dentro la
      tela intatta. La tela ha appena un'ombra marrone sulle cuciture, e dove un sacco si è aperto la farina è
      nera e compatta come una crosta di pane. In mezzo un disertore spacca legna con la spada d'ordinanza
      perché l'ascia non l'hanno trovata, e ogni colpo rimbomba sui muri anneriti. Il ceppo è un tronco
      annerito da un lato, e accanto c'è già un mucchio di schegge corte e storte.

      {armi-da-mischia Facile} Così la spada si rovina in una settimana. Il filo è già pieno di tacche, e la
      lama ha preso una curva leggera verso la punta. Lui lo sa e lo fa lo stesso perché è l'unica cosa che
      ha.
    opzioni:
      - testo: "Convincerlo a posare la spada"
        descrizione: "È uno dei tre di Brando. Se posa la spada adesso, nella cantina ci sarà un uomo in meno."
        prova: { attributo: sociale, abilita: persuasione, difficolta: Media }
        successo:
          titolo: La legna
          testo: |
            Gli dici che la legna gliela spacca un altro, e lui guarda la spada rovinata come se la vedesse
            per la prima volta. Poi la pianta nel ceppo e si siede sui sacchi, e dalla tela sotto di lui sale
            uno sbuffo di cenere nera che gli resta sulle ginocchia. «Brando è giù in cantina, con quello
            delle carte» dice, senza alzare la testa, «e hanno paura tutti e due.»
          effetti: { profondita.caserma-mulino-nero: 1, caserma.disertori: 1 }
        fallimento:
          titolo: La spada nel ceppo
          testo: |
            Gli parli, e lui ti risponde con la spada, un fendente da cortile che pari per abitudine. La lama
            ti arriva sul ferro già smussata dalla legna, e il colpo ti resta nel polso. Poi scappa dentro il
            mulino gridando, e voi vi buttate dietro i sacchi.
          effetti: { ferite: 0.5 }

      - testo: "Prenderlo prima che gridi"
        descrizione: "Ha le mani occupate con la legna. Tre passi di corsa nel cortile."
        prova: { attributo: fisico, abilita: [rissa, atletica], difficolta: Media }
        successo:
          titolo: I tre passi
          testo: |
            Tre passi di corsa nella cenere, e lo prendi per la cintura prima che si giri. Lo stendete sui
            sacchi e lo legate, e lui non grida. La cenere che avete sollevato ricade piano su tutti e due. Ti
            guarda il mantello scarlatto, e chiude gli occhi.
          effetti: { profondita.caserma-mulino-nero: 1 }
        fallimento:
          titolo: La cenere
          testo: |
            Scivoli nella cenere al secondo passo, e lui ha il tempo di girarsi
            e gridare. Vi ritirate dietro il muro del cortile.
          effetti: { ferite: 0.5 }

      - testo: "Girare dietro i sacchi"
        descrizione: "Lungo il muro, dietro i sacchi bruciati, si arriva alla porta del mulino."
        costo: 2
        esito:
          titolo: Dietro i sacchi
          testo: |
            Passate curvi dietro i sacchi, uno alla volta, mentre il disertore spacca legna e il rumore copre
            i vostri passi. Quando lui si ferma a riprendere fiato vi fermate anche voi. La farina bruciata vi
            si attacca ai mantelli, e arrivate alla porta del mulino grigi come fantasmi.
          effetti: { profondita.caserma-mulino-nero: 1 }

  - id: caserma-mulino-la-stalla
    immagine: ambientazione/mulino-malgrani
    titolo: La stalla
    sommario: "La stalla del mulino ha una porta che dà sulla sala delle macine. Qualcuno ci ha messo la paglia nuova."
    luogo: Il Mulino Nero, la stalla
    area: caserma-mulino-nero
    ripetibile: true
    requisiti: [fazione.caserma == 13, profondita.caserma-mulino-nero == 1]
    testo: |
      La stalla del mulino è l'unica stanza con il tetto intero. Le travi sono di castagno e hanno soltanto la
      fuliggine, perché il fuoco ci è passato sopra senza prenderle. Ci sono due muli legati alla mangiatoia
      che sonnecchiano in piedi con il peso su tre zampe, e paglia nuova sul pavimento. In fondo una porta di
      legno dà sulla sala delle macine. La porta è sprangata dall'interno. Dalla fessura sotto la porta arriva
      la luce di una lanterna, e si sentono voci.

      {percezione Media} Il calore ha fatto ritirare il legno della porta, e la fessura è larga un dito. La
      spranga si sposta da fuori, con una lama infilata nella fessura, se chi sta dentro non ci si appoggia.
    opzioni:
      - testo: "Alzare la spranga con la lama"
        descrizione: "Una lama nella fessura, piano, mentre dentro parlano."
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Media }
        successo:
          titolo: La spranga
          testo: |
            Infili la lama nella fessura e alzi la spranga un dito alla volta, mentre dall'altra parte
            qualcuno racconta di una partita di carte. Dove poggia sul gancio il legno della spranga è grasso
            di sego, e la lama ci scorre sopra senza strappi. La spranga cade nel suo gancio senza rumore, e
            la porta si apre di un palmo.
          effetti: { profondita.caserma-mulino-nero: 1 }
        fallimento:
          titolo: La lama
          testo: |
            La spranga scivola dal gancio e cade sul pavimento della sala con un colpo che sveglia i muli. Uno
            scalcia contro la mangiatoia e l'altro si mette a ragliare. Dentro le voci smettono, e voi vi
            ritirate nel cortile.
          effetti: { tormento: 1 }

      - testo: "Bussare come Fulvio"
        descrizione: "Fulvio Saldo è con loro, e riferisce a te. Ha detto che alla stalla bussa due volte, poi una."
        quando: [caserma.saldo == 2]
        prova: { attributo: sociale, abilita: empatia, difficolta: Media }
        successo:
          titolo: Due volte, poi una
          testo: |
            Bussi due volte, poi una. Le nocche sul legno annerito fanno un suono sordo. Dopo un momento la
            spranga si alza e nella fessura compare la faccia di Fulvio, con la sciarpa sul naso. Ti guarda a
            lungo, e poi apre. «Io non ho visto niente» dice, e si mette contro il muro con le mani alzate.
          effetti: { profondita.caserma-mulino-nero: 1, caserma.disertori: 1 }
        fallimento:
          titolo: La faccia di Fulvio
          testo: |
            Bussi due volte, poi una. La spranga si alza, e nella fessura compare la faccia di Fulvio. Ti
            guarda, poi grida il tuo nome verso la sala e ti chiude la porta in faccia, e la spranga ricade
            nel gancio con un colpo secco che fa scartare i muli. Il foglio dei turni, alla fine, l'ha venduto
            anche a te.
          effetti: { sospetto: 1.5 }

      - testo: "Chiamare Fulvio dalla fessura"
        descrizione: "Fulvio Saldo è con loro. Gli hai pagato il debito, e lui ha detto che sa quali porte si aprono."
        quando: [caserma.saldo == 3]
        esito:
          titolo: La porta aperta
          testo: |
            Chiami Fulvio piano dalla fessura. Dopo un momento la spranga si alza, e lui apre la porta con la
            sciarpa sul naso, e stavolta non tossisce. «Brando è giù in cantina con quello delle carte» dice.
            «Gli altri due sono di sopra, nel granaio.» Poi esce nel cortile e si siede sui sacchi ad
            aspettare, con le mani fra le ginocchia e la cenere che gli imbianca gli stivali.
          effetti: { profondita.caserma-mulino-nero: 1, caserma.disertori: 1 }

      - testo: "Uscire dalla stalla e cercare un'altra porta"
        descrizione: "La sala ha anche una porta sul canale, più lontana."
        costo: 2
        esito:
          titolo: La porta sul canale
          testo: |
            Girate intorno al mulino fino alla porta sul canale, socchiusa. Sui cardini c'è grasso fresco
            annerito dalla fuliggine, e la porta si apre senza un cigolio. Entrate uno alla volta nella sala
            delle macine, dove la luce della lanterna arriva soltanto a metà.
          effetti: { profondita.caserma-mulino-nero: 1 }

  # ------------------------------------------------------------ 1–2 · le travi in fiamme
  - id: caserma-mulino-le-travi-in-fiamme
    immagine: ambientazione/mulino-malgrani
    titolo: Le travi che bruciano ancora
    sommario: "Dentro il mulino una trave del tetto brucia ancora piano, dalla notte dell'incendio. Sotto bisogna passare."
    luogo: Il Mulino Nero, il corridoio delle travi
    area: caserma-mulino-nero
    ripetibile: true
    requisiti: [fazione.caserma == 13, profondita.caserma-mulino-nero >= 1, profondita.caserma-mulino-nero <= 2]
    testo: |
      Il corridoio che porta alla sala delle macine ha il tetto mezzo crollato, e una trave maestra brucia
      ancora piano, dall'interno, come un tizzone. Il carbone di fuori è crepato a scaglie, e nelle crepe la
      brace si accende di arancione quando passa un filo d'aria. Ogni tanto ne cade un pezzo sul pavimento di
      pietra, dove un velo d'acqua colato dal tetto rotto lo fa sfrigolare. L'aria sa di fumo vecchio e di
      resina. Sotto la trave c'è il solo passaggio, largo quanto un uomo.

      {medicina Media} Le travi di quercia bruciano così per settimane, dentro. Il giorno che cedono vengono
      giù tutte insieme, senza avvisare.
    opzioni:
      - testo: "Passare sotto la trave di corsa"
        descrizione: "Un passaggio solo, sotto una trave che brucia. Uno alla volta, di corsa."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Media }
        successo:
          titolo: La brace
          testo: |
            Passi per prim{o|a} di corsa, e una brace ti cade sulla spalla e ti brucia il mantello senza
            arrivare alla pelle. Sulla lana resta un buco dagli orli duri e lucidi che sa di corno bruciato.
            Gli altri passano dietro di te uno alla volta, e Linna per ultima, con il mantello sulla testa.
          effetti: { profondita.caserma-mulino-nero: 1 }
        fallimento:
          titolo: Il pezzo di trave
          testo: |
            A metà passaggio un pezzo di trave si stacca e ti cade sul braccio. Si sbriciola nell'urto e ti
            lascia sulla manica una manciata di brace. Torni indietro con la manica che fuma e la pelle che
            brucia sotto.
          effetti: { ferite: 1 }

      - testo: "Puntellare la trave"
        descrizione: "Con una trave del pavimento messa di traverso, la trave che brucia regge per il tempo di passare."
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Media }
        successo:
          titolo: Il puntello
          testo: |
            Fai portare una trave dal pavimento crollato e la pianti di traverso sotto quella che brucia, con
            un sasso alla base. Il legno fa un solo scricchiolio quando prende il peso, e poi regge. Passate
            tutti senza fretta, e il puntello comincia a fumare quando l'ultimo è dall'altra parte.
          effetti: { profondita.caserma-mulino-nero: 1 }
        fallimento:
          titolo: Il puntello storto
          testo: |
            Il puntello scivola sul pavimento bagnato, e la trave che brucia ci scende sopra di un palmo con
            uno sbuffo di brace. Dal tetto cade una pioggia di tegole cotte che si rompono sulla pietra, e vi
            ritirate nel cortile tossendo.
          effetti: { ferite: 0.5, tormento: 1 }

      - testo: "Aspettare che la trave cada"
        descrizione: "Prima o poi cade da sola. Bisogna avere pazienza e stare lontani."
        costo: 2
        esito:
          titolo: Il crollo
          testo: |
            Aspettate nel cortile per un'ora. Poi la trave cede tutta insieme, con un rumore che fa volare i
            corvi dal tetto, e dentro il mulino qualcuno grida. I corvi girano due volte sopra il mulino e
            vanno a posarsi sui pioppi, lontano dal fumo. Quando la polvere si posa il passaggio è libero e
            pieno di brace che si spegne.
          effetti: { profondita.caserma-mulino-nero: 1 }

  # ------------------------------------------------------------ 2 · la sala delle macine e la scala
  - id: caserma-mulino-la-sala-delle-macine
    immagine: ambientazione/mulino-malgrani
    titolo: La sala delle macine
    sommario: "Fra le macine ferme ci sono due uomini con le balestre. Uno è degli Scuri, l'altro ha il mantello rovesciato."
    luogo: Il Mulino Nero, la sala delle macine
    area: caserma-mulino-nero
    ripetibile: true
    requisiti: [fazione.caserma == 13, profondita.caserma-mulino-nero == 2]
    testo: |
      La sala delle macine è alta due piani, con le macine di pietra ferme al centro. Sono larghe quanto un
      carro e scanalate a raggiera, e nelle scanalature è rimasta la farina bruciata. Sopra di loro la
      tramoggia di legno è bruciata a metà e ha lasciato cadere sul pavimento una lingua di grano nero. Dietro
      le macine ci sono due uomini con le balestre leggere. Uno porta il cappuccio degli Scuri e la faccia di
      chi ha perso tutto alla Pignatta, l'altro il mantello scarlatto rovesciato.

      {intimidire Media} Il disertore guarda lo Scuro prima di te. Ha le nocche bianche sulla balestra e il
      dito lontano dalla leva. Se lo Scuro cade, lui posa la balestra.
    opzioni:
      - testo: "Affrontarli fra le macine"
        descrizione: "Due balestre e due macine di pietra. Si avanza da una macina all'altra."
        combattimento: caserma-i-balestrieri
        vittoria:
          titolo: Le macine
          testo: |
            Avanzi da una macina all'altra mentre i dardi si piantano nella pietra e ne staccano schegge e
            sbuffi di farina nera. Arrivi sullo Scuro mentre ricarica, con il piede ancora nella staffa della
            balestra. Il disertore posa la balestra per terra prima ancora che tu ti giri, e si siede sulla
            macina con le mani in grembo.
          effetti: { profondita.caserma-mulino-nero: 1, caserma.disertori: 1 }
        sconfitta:
          titolo: Il dardo nella gamba
          testo: |
            Un dardo ti prende alla coscia, e un altro si pianta nella macina a un dito dalla tua faccia. Ti
            trascini fuori dalla sala con Linna che ti tira per il mantello, e la gamba lascia una riga scura
            nella farina del pavimento.
          effetti: { tormento: 1 }

      - testo: "Parlare al disertore sopra la testa dello Scuro"
        descrizione: "Dirgli il suo nome, il suo turno, chi lo aspetta in città. Se posa la balestra, lo Scuro resta solo."
        prova: { attributo: sociale, abilita: [persuasione, intimidire], difficolta: Media }
        successo:
          titolo: Il nome del turno
          testo: |
            Dici il nome del disertore ad alta voce, e il suo turno di ronda, e il nome di sua sorella che
            vende il pane al Mercato dei Nodi. La tua voce torna giù dal soffitto alto due piani, e ogni nome
            si sente due volte. Lui abbassa la balestra. Lo Scuro capisce di essere solo, tira un dardo che
            non va da nessuna parte e scappa per la porta sul canale.
          effetti: { profondita.caserma-mulino-nero: 1, caserma.disertori: 1 }
        fallimento:
          titolo: Il dardo dello Scuro
          testo: |
            Cominci a parlare, e lo Scuro tira prima che il disertore possa decidere. Il dardo ti prende di
            striscio al fianco e ti apre la giubba per un palmo. Vi ritirate fuori dalla sala, e il dardo
            resta piantato nella porta alle vostre spalle.
          effetti: { ferite: 1 }

      - testo: "Aspettare che finiscano i dardi"
        descrizione: "Le balestre leggere hanno pochi dardi. Al riparo dietro la porta, si aspetta."
        costo: 2
        esito:
          titolo: I dardi contati
          testo: |
            Restate al riparo dietro la porta e fate sporgere un mantello su un bastone, ogni tanto, perché
            tirino. Linna conta i buchi nella lana ad alta voce, uno a ogni dardo. Dopo un'ora i dardi
            finiscono. Lo Scuro scappa dalla porta sul canale, e il disertore resta seduto sulla macina.
          effetti: { profondita.caserma-mulino-nero: 1 }

  - id: caserma-mulino-la-scala
    immagine: ambientazione/mulino-malgrani
    titolo: La scala del granaio
    sommario: "La scala di legno che sale al granaio è bruciata a metà. In cima c'è un disertore che non sa se scendere."
    luogo: Il Mulino Nero, la scala
    area: caserma-mulino-nero
    ripetibile: true
    requisiti: [fazione.caserma == 13, profondita.caserma-mulino-nero == 2]
    testo: |
      La scala che sale dalla sala delle macine al granaio è di legno, e metà gradini sono bruciati e caduti.
      Quelli rimasti sono carbone sopra e legno chiaro sotto, e sui bordi, dove si incastrano nei montanti, il
      fuoco li ha toccati appena. In cima, seduto sull'ultimo gradino intero, c'è un ragazzo con il mantello
      rovesciato e la spada sulle ginocchia. È il più giovane dei tre. Ti guarda salire con gli occhi lucidi.

      {empatia Media} Ha diciannove anni, forse meno. È qui perché Brando era il suo sergente, e un sergente
      non si lascia solo.
    opzioni:
      - testo: "Convincerlo a scendere"
        descrizione: "Un sergente non si lascia solo. Ma un sergente non chiede a un ragazzo di morire per lui."
        prova: { attributo: sociale, abilita: [empatia, persuasione], difficolta: Media }
        successo:
          titolo: Il sergente
          testo: |
            Gli ricordi che Brando gli ha detto di andarsene, quando poteva. Il ragazzo piange senza vergogna,
            con la spada sulle ginocchia, e alla fine scende la scala sul bordo dei gradini. Ti dà la spada
            con l'elsa avanti, come insegnano in cortile, e l'elsa è ancora calda delle sue mani.
          effetti: { profondita.caserma-mulino-nero: 1, caserma.disertori: 1 }
        fallimento:
          titolo: La spada
          testo: |
            Gli dici di scendere, e lui si alza con la spada in mano. La punta gli trema all'altezza della tua
            faccia. Ti dice che Brando è il suo sergente e che tu non lo sei. Torni giù dalla scala prima che
            un gradino ti ceda sotto il piede.
          effetti: { tormento: 1 }

      - testo: "Salire sul bordo dei gradini"
        descrizione: "Sul bordo i gradini reggono. Si sale prima che lui decida che cosa fare."
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Media }
        successo:
          titolo: Il bordo
          testo: |
            Sali svelto sul bordo dei gradini con le mani sui montanti e il carbone che si sbriciola sotto le
            dita, e sei in cima prima che lui si alzi. Gli prendi la spada dalle ginocchia, e lui non te la
            nega.
          effetti: { profondita.caserma-mulino-nero: 1 }
        fallimento:
          titolo: Il gradino
          testo: |
            Un gradino ti cede sotto il piede, e ti ritrovi appes{o|a} al montante con le gambe nel vuoto. Il
            gradino arriva sul pavimento della sala in tre pezzi e solleva una nuvola di cenere. Il ragazzo
            resta in cima a guardarti tornare giù.
          effetti: { ferite: 0.5 }

      - testo: "Lasciarlo lì e cercare un'altra strada"
        descrizione: "Dalla sala delle macine si scende anche in cantina, per la scala del canale."
        costo: 2
        esito:
          titolo: La scala del canale
          testo: |
            Lasci il ragazzo in cima alla scala e cerchi un'altra strada. La trovi dietro le macine, una
            scaletta di pietra che scende verso il canale e la ruota. I gradini sono umidi e coperti di una
            patina verde, e da sotto sale il rumore dell'acqua.
          effetti: { profondita.caserma-mulino-nero: 1 }

  # ------------------------------------------------------------ 2–3 · la ruota
  - id: caserma-mulino-la-ruota
    immagine: ambientazione/mulino-malgrani
    titolo: La ruota
    sommario: "La ruota ferma del mulino scende nel canale fino alla cantina. Fra le pale spezzate si può passare."
    luogo: Il Mulino Nero, la ruota
    area: caserma-mulino-nero
    ripetibile: true
    requisiti: [fazione.caserma == 13, profondita.caserma-mulino-nero >= 2, profondita.caserma-mulino-nero <= 3]
    testo: |
      La ruota del mulino è ferma nel canale con le pale di legno spezzate. Le pale rimaste sono nere sopra la
      linea dell'acqua e chiare sotto, e da quella linea pendono alghe lunghe che la corrente tira tutte dalla
      stessa parte. Sotto, dove l'acqua entra nella cantina, c'è un'apertura nel muro grande quanto una porta.
      Dalla cantina salgono la luce di una lanterna e una voce che conta piano. Sono numeri detti uno dopo
      l'altro a voce bassa, e ogni tanto la voce si ferma e ricomincia da capo.

      {tecnologia Media} L'asse della ruota è bloccato da un cuneo di quercia piantato a colpi di mazza fra
      l'asse e il suo appoggio di pietra, e il legno è lucido d'acqua. Se lo togli, la ruota gira di mezzo
      giro e l'apertura si chiude.
    opzioni:
      - testo: "Passare fra le pale della ruota"
        descrizione: "Le pale spezzate lasciano un varco. Bisogna non toccare il cuneo."
        prova: { attributo: fisico, abilita: [acrobazia, furtivita], difficolta: Media }
        successo:
          titolo: Fra le pale
          testo: |
            Passi fra le pale spezzate con l'acqua fino alle ginocchia, piano, con il cuneo a un palmo dalla
            spalla. Dall'asse ti cola sul collo un'acqua fredda che sa di ferro. Arrivi sotto l'apertura della
            cantina, e la voce che conta smette e poi riprende dallo stesso numero.
          effetti: { profondita.caserma-mulino-nero: 1 }
        fallimento:
          titolo: Il cuneo
          testo: |
            Urti il cuneo con la spalla, e la ruota cigola e gira di un palmo. Il cigolio corre lungo l'asse
            fino dentro il muro. Torni indietro di corsa nell'acqua, prima che l'apertura si chiuda con te
            dentro.
          effetti: { ferite: 0.5 }

      - testo: "Bloccare la ruota per sempre"
        descrizione: "Con una trave infilata fra le pale, la ruota non gira più e l'apertura resta aperta."
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Media }
        successo:
          titolo: La trave fra le pale
          testo: |
            Infili una trave fra due pale e la blocchi contro il muro, e la ruota non si muove più. La trave
            entra con un colpo sordo e resta incastrata fra il legno bagnato e la pietra. Passate tutti sotto
            l'apertura senza fretta.
          effetti: { profondita.caserma-mulino-nero: 1 }
        fallimento:
          titolo: La trave che scivola
          testo: |
            La trave scivola sulle pale bagnate e cade nel canale con uno schizzo che si sente fino in
            cantina. Ti restano fra le dita le alghe delle pale. La voce che conta smette, e non riprende.
          effetti: { tormento: 1 }

      - testo: "Aspettare la notte nel canale"
        descrizione: "Di notte la lanterna in cantina si vede, e chi sta dentro no."
        costo: 2
        esito:
          titolo: Il canale di notte
          testo: |
            Aspettate la notte nel canale, con l'acqua alle ginocchia e le gambe che non si sentono più. Dopo
            il tramonto le rane cominciano a cantare, e smettono tutte insieme quando in cantina qualcuno
            tossisce. Quando la lanterna in cantina si abbassa, passate fra le pale uno alla volta.
          effetti: { profondita.caserma-mulino-nero: 1 }

  # ------------------------------------------------------------ 3 · il granaio
  - id: caserma-mulino-il-granaio
    immagine: ambientazione/mulino-malgrani
    titolo: Il granaio annerito
    sommario: "Nel granaio, sotto il tetto crollato, c'è l'ultimo dei disertori, con la cassa delle paghe."
    luogo: Il Mulino Nero, il granaio
    area: caserma-mulino-nero
    ripetibile: true
    requisiti: [fazione.caserma == 13, profondita.caserma-mulino-nero == 3]
    testo: |
      Il granaio sta sotto il tetto mezzo crollato, e sul pavimento il grano bruciato fa uno strato nero. Lo
      strato è alto una spanna e scricchiola sotto i piedi, e dove il tetto è aperto la pioggia l'ha impastato
      in una crosta. In un angolo l'ultimo dei disertori siede su una cassa di ferro con il lucchetto. È un
      uomo grosso con i capelli bianchi e tiene la spada sguainata appoggiata alla cassa. Intorno alla cassa
      il grano nero è pestato in un cerchio stretto, che è tutto lo spazio in cui si è mosso da quando è qui.

      {politica-ed-economia Media} È la cassa delle paghe della ronda dei Ponti che Brando portava al furiere.
      Sul lucchetto non c'è un graffio. Se l'è portata dietro e non l'ha aperta.
    opzioni:
      - testo: "Convincerlo a lasciare la cassa"
        descrizione: "Trent'anni di servizio, e una cassa che non ha aperto. Forse vuole soltanto che qualcuno gliela riprenda."
        prova: { attributo: sociale, abilita: [persuasione, galateo], difficolta: Media }
        successo:
          titolo: La cassa chiusa
          testo: |
            Gli chiedi perché non l'ha aperta. Lui ci pensa a lungo, poi ti risponde che la paga dei Ponti non
            è roba sua. Si alza dalla cassa e rinfodera la spada. Poi ti dà la chiave del lucchetto, che porta
            appesa al collo con un laccio di cuoio ed è ancora calda quando te la mette in mano.
          effetti: { profondita.caserma-mulino-nero: 1, caserma.disertori: 1 }
        fallimento:
          titolo: Trent'anni
          testo: |
            Lui ti ascolta fino in fondo, con le mani sul pomo della spada e gli occhi sul lucchetto. «Capi di
            ronda giovani ne ho sentiti parecchi, in trent'anni. La cassa resta qui» dice. Poi si alza con la
            spada in mano, e voi tornate giù dalla scala.
          effetti: { tormento: 1 }

      - testo: "Disarmarlo"
        descrizione: "È vecchio e grosso. Se lo prendi prima che si alzi, non ha spazio per la spada."
        prova: { attributo: fisico, abilita: [rissa, armi-da-mischia], difficolta: Media }
        successo:
          titolo: La spada a terra
          testo: |
            Gli sei addosso prima che si alzi, e la spada gli cade sul grano bruciato e ci affonda senza un
            suono. Lui non lotta. Ti guarda e ti dice che una volta, al cortile, era lui a insegnare quella
            presa.
          effetti: { profondita.caserma-mulino-nero: 1 }
        fallimento:
          titolo: Il vecchio
          testo: |
            Si alza più svelto di quanto credessi, e il pomo della spada ti prende alla tempia. Ti ritrovi sul
            grano bruciato con la testa che gira e la bocca piena di cenere amara. Linna ti tira fuori dal
            granaio per il mantello.
          effetti: { ferite: 1 }

      - testo: "Lasciarlo con la sua cassa"
        descrizione: "Dal granaio una botola scende in cantina. Lui non si muoverà dalla cassa."
        costo: 2
        esito:
          titolo: La botola
          testo: |
            Lo lasci seduto sulla cassa e trovi la botola nel pavimento del granaio, sotto il grano bruciato.
            Lui non gira nemmeno la testa. La apri piano, e il grano nero scivola nella fessura e cade di
            sotto con un fruscio lungo. Sotto c'è la scala della cantina, e una luce di lanterna.
          effetti: { profondita.caserma-mulino-nero: 1 }

  # ------------------------------------------------------------ il cuore · la cantina sotto la ruota
  - id: caserma-mulino-la-cantina
    immagine: personaggi/nihali-cuzan
    titolo: La cantina sotto la ruota
    sommario: "Nella cantina sotto la ruota Brando Selli e Nihali Cuzan aspettano alla luce di una lanterna, con il libro delle paghe di Vesh sul tavolo."
    luogo: Il Mulino Nero, la cantina
    area: caserma-mulino-nero
    requisiti: [fazione.caserma == 13, profondita.caserma-mulino-nero >= 4]
    testo: |
      La cantina sotto la ruota è bassa e umida, e l'acqua del canale scorre lungo il muro. La volta è di
      mattoni e la tocchi alzando la mano, e dalle giunture pendono gocce che cadono sempre negli stessi punti
      del pavimento. Attraverso il muro senti la corrente che spinge contro la ruota ferma, con un colpo sordo
      a intervalli lunghi. Al centro, su un tavolo fatto con una porta su due botti, c'è un libro con la
      copertina di cuoio rosso accanto a un mazzo di carte. La porta ha ancora i cardini e la toppa vuota
      della serratura. Al tavolo siede Nihali Cuzan con la pipa spenta fra i denti e mischia le carte. Fra te
      e il tavolo c'è Brando Selli, con il mantello rovesciato e la spada d'ordinanza tenuta bassa come si
      insegna in cortile.

      «Il libro lo vende lui» dice Brando. «Nei villaggi, una pagina alla volta, a chi c'è scritto sopra e a
      chi lo vuole leggere. Vent'anni di ronde e il mio nome a pagina tre.»

      {percezione Difficile} Da quando sei entrat{o|a} Nihali tiene sotto il tavolo una carta fra le dita
      della sinistra. Con la destra continua a mischiare, e il fruscio del mazzo non cambia mai ritmo.
    opzioni:
      - testo: "Parlare con Brando"
        descrizione: "Ha firmato vent'anni prima di te allo stesso banco, e se lo capisce posa la spada da solo."
        prova: { attributo: sociale, abilita: [persuasione, empatia], difficolta: Difficile }
        successo:
          titolo: Lo stesso banco
          testo: |
            Gli dici che hai visto la sua firma sul registro del furiere, quella del primo giorno, e che è
            uguale alla tua. Avete firmato allo stesso banco la ricevuta del mantello, forse con la stessa
            penna. Brando ti ascolta con la spada bassa. Poi la gira e te la porge con l'elsa avanti, come si
            insegna in cortile, e si toglie il mantello rovesciato. Lo piega sul braccio come ha insegnato a
            tutti. Dietro di lui, Nihali ha smesso di mischiare.
          imposta: { caserma.brando: 1 }
          segue: caserma-mulino-il-libro
        fallimento:
          titolo: La spada alzata
          testo: |
            Gli parli del registro, e Brando ride, corto. «Il furiere fa firmare tutti allo stesso modo» dice,
            e alza la spada. Pari il primo colpo per abitudine, perché è una parata che ti ha insegnato lui, e
            il secondo ti prende al braccio mentre indietreggi verso la scala. Il sangue ti scende caldo fino
            al polso e gocciola sul pavimento bagnato.
          effetti: { ferite: 1 }

      - testo: "Affrontare Brando e Nihali"
        descrizione: "Brando para come si insegna in cortile, e Nihali bara anche quando combatte. Con loro c'è ancora un disertore."
        quando: [caserma.disertori < 2]
        combattimento: caserma-la-cantina
        vittoria:
          titolo: La parata
          testo: |
            Sotto la volta bassa non c'è spazio per i fendenti, e vi battete di punta e di guardia. Brando
            para tutte le parate che conosci, perché le conosce anche lui, e ti batte su quelle che hai
            imparato da sol{o|a}. Alla fine è una che non ti ha insegnato nessuno a farlo cadere, una finta
            storta da vicolo. Resta sul pavimento bagnato con la gamba ferita, e ti dice di prendere il libro
            prima che lo prenda l'altro.
          imposta: { caserma.brando: 2 }
          segue: caserma-mulino-il-libro
        sconfitta:
          titolo: Linna
          testo: |
            Nihali ti tira una carta in faccia, e Brando ti passa sotto la guardia. Ti ritrovi con la schiena
            contro il muro della cantina, viscido dell'acqua del canale, e Linna si mette fra te e la spada.
            La ferita la prende lei, al fianco. La squadra vi trascina fuori dal mulino, e Linna ti chiede a
            denti stretti se le hanno rovinato il mantello.
          effetti: { tormento: 1 }
          vai: citta-bassa

      - testo: "Affrontare Brando e Nihali"
        descrizione: "I disertori hanno deposto le armi. Nella cantina restano Brando, con la spada bassa, e Nihali con le sue carte."
        quando: [caserma.disertori >= 2]
        combattimento: caserma-la-cantina-ridotta
        vittoria:
          titolo: La parata
          testo: |
            Sotto la volta bassa non c'è spazio per i fendenti, e vi battete di punta e di guardia. Brando
            para tutte le parate che conosci, perché le conosce anche lui, e ti batte su quelle che hai
            imparato da sol{o|a}. Alla fine è una che non ti ha insegnato nessuno a farlo cadere, una finta
            storta da vicolo. Resta sul pavimento bagnato con la gamba ferita, e ti dice di prendere il libro
            prima che lo prenda l'altro.
          imposta: { caserma.brando: 2 }
          segue: caserma-mulino-il-libro
        sconfitta:
          titolo: Linna
          testo: |
            Nihali ti tira una carta in faccia, e Brando ti passa sotto la guardia. Ti ritrovi con la schiena
            contro il muro della cantina, viscido dell'acqua del canale, e Linna si mette fra te e la spada.
            La ferita la prende lei, al fianco. La squadra vi trascina fuori dal mulino, e Linna ti chiede a
            denti stretti se le hanno rovinato il mantello.
          effetti: { tormento: 1 }
          vai: citta-bassa

      - testo: "Ritirarsi e tornare con più uomini"
        descrizione: "La cantina ha una scala sola. Si può tornare un'altra volta."
        costo: 0
        esito:
          titolo: La scala
          testo: |
            Indietreggi verso la scala con la spada alzata, e Brando non ti segue. Resta fermo con la punta
            bassa e ti guarda la guardia fino al primo gradino. Dal tavolo Nihali ti saluta con una carta, il
            re dei Ponti, e la rimette nel mazzo.
          vai: citta-bassa

  - id: caserma-mulino-il-libro
    immagine: personaggi/nihali-cuzan
    titolo: Il libro delle paghe
    tipo: seguito
    luogo: Il Mulino Nero, la cantina
    area: caserma-mulino-nero
    requisiti: [fazione.caserma == 13]
    testo: |
      Il libro delle paghe di Vesh è sul tavolo, aperto alla pagina tre, accanto alle carte di Nihali. Nihali
      si è alzato e ti guarda dall'apertura del canale tossendo nel fazzoletto.

      Le colonne sono scritte in due grafie, e l'ultima pagina ha la data della notte della Pignatta. Una
      grafia è stretta e pende in avanti, e l'altra è tonda e preme tanto che la pagina dopo ne porta il
      rilievo.

      {percezione Media} In fondo al libro una colonna non torna. Sono versamenti mai usciti che non vengono
      da Vesh, e accanto a ogni cifra c'è un occhio chiuso disegnato con cura. Gli occhi sono tutti identici,
      e la palpebra è fatta con un tratto solo che non si stacca mai dalla carta.

      Nessuno in Caserma saprà dirti che cosa sia quell'occhio, e Nihali non lo dirà.
    opzioni:
      - testo: "Prendere Nihali sulla scala del canale"
        descrizione: "I disertori hanno deposto le armi, e due di loro aspettano sulla riva del canale. Nihali non ha dove andare."
        quando: [caserma.disertori >= 2]
        esito:
          titolo: La riva
          testo: |
            Nihali si infila nell'apertura del canale, e sulla riva lo aspettano i due disertori che hanno
            deposto le armi, con Linna. Lo riportano dentro bagnato fino alla vita, mentre tossisce ridendo.
            Chiudi il libro intero e lo metti sotto il mantello, e il cuoio rosso umido ti si attacca alla
            camicia. Nella cassa dei disertori c'è la paga di un mese di ronde, e sul tavolo il mazzo di
            Nihali, che lui ti guarda prendere.
          pe: { persuasione: 5 }
          imposta: { caserma.nihali: 1 }
          effetti: { fazione.caserma: 1, monete: 120, oggetto.caserma-mazzo-di-nihali: 1, crepuscolo.indizi: 1, rep.caserma: 1 }
          vai: citta-bassa

      - testo: "Inseguire Nihali nel canale"
        descrizione: "Nihali si infila nell'apertura del canale con metà del libro strappato in mano. Bisogna essere svelti."
        quando: [caserma.disertori < 2]
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Difficile }
        successo:
          titolo: Il canale
          testo: |
            Nihali strappa metà del libro e si butta nell'apertura del canale, e tu gli sei dietro prima che
            arrivi alla ruota. Sotto la ruota l'acqua è fredda e veloce e ti tira le gambe verso i campi. Lo
            prendi per il colletto nell'acqua fino alla vita. Lui tossisce ridendo e ti dà le pagine
            strappate, bagnate, che si possono ancora leggere. Nella cassa dei disertori c'è la paga di un
            mese di ronde, e sul tavolo il mazzo di Nihali.
          pe: { atletica: 5 }
          imposta: { caserma.nihali: 1 }
          effetti: { fazione.caserma: 1, monete: 120, oggetto.caserma-mazzo-di-nihali: 1, crepuscolo.indizi: 1, rep.caserma: 1 }
          vai: citta-bassa
        fallimento:
          titolo: Metà del libro
          testo: |
            Nihali strappa metà del libro e si butta nell'apertura del canale, e quando ci arrivi tu è già
            oltre la ruota, nell'acqua alta, con le pagine sopra la testa. Per un po' vedi il bianco delle
            pagine muoversi sopra le stoppie nere, e poi lo perdi nei campi bruciati. Ti resta l'altra metà
            del libro, quella con la colonna dell'occhio chiuso, e sul tavolo il mazzo di carte che ha
            lasciato. Nella cassa dei disertori c'è la paga di un mese di ronde.
          imposta: { caserma.nihali: 2 }
          effetti: { fazione.caserma: 1, monete: 120, oggetto.caserma-mazzo-di-nihali: 1, crepuscolo.indizi: 1 }
          vai: citta-bassa

      - testo: "Lasciarlo andare e restare con i feriti"
        descrizione: "Brando sanguina, e la squadra ha bisogno di te. Nihali porta via metà del libro."
        esito:
          titolo: I feriti
          testo: |
            Lasci che Nihali strappi metà del libro e sparisca nel canale. Ti inginocchi accanto a Brando sul
            pavimento bagnato e gli stringi la cintura sopra la ferita finché il sangue non rallenta. Il
            sangue è caldo e ti arriva fino ai polsi. Lui ti guarda fare senza dire niente. Sul tavolo restano
            l'altra metà del libro, con la colonna dell'occhio chiuso, e il mazzo di Nihali. Nella cassa dei
            disertori c'è la paga di un mese di ronde.
          pe: { medicina: 5 }
          imposta: { caserma.nihali: 2 }
          effetti: { fazione.caserma: 1, monete: 120, oggetto.caserma-mazzo-di-nihali: 1, crepuscolo.indizi: 1, rep.caserma: 1 }
          vai: citta-bassa
