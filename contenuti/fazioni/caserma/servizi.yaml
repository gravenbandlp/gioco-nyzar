# I ripetibili della quest della Caserma, che si aprono con i passi e con i gradi:
# - l'armeria d'ordinanza (grado 1, passo 3): lancia, balestra leggera, cotta di maglia e scudo a prezzo ridotto;
#   dal grado 4 (passo 12) con lo sconto del luogotenente;
# - il registro della casa blu (dal passo 4): il lavoro al posto di guardia in Città Bassa, con la nomea;
# - la branda in Caserma (grado 2, passo 6): si dorme e ci si cura;
# - una pratica che si perde (grado 3, passo 9): il furiere archivia male un rapporto, e il Sospetto scende;
# - l'archivio dei rapporti (grado 4, passo 12): informazioni dai rapporti delle ronde;
# - la paga del capitano (grado 5, con caserma.capitano): la rendita del titolo e la rassegna della Guardia.
# I prezzi stanno negli effetti e nei requisiti, mai nella prosa.
storylet:
  # ------------------------------------------------------------ l'armeria d'ordinanza
  - id: caserma-l-armeria-d-ordinanza
    presso: guarnigione-di-qir-azel
    immagine: ambientazione/guarnigione-di-qir-azel
    titolo: L'armeria d'ordinanza
    sommario: "Il furiere vende ai miliziani le armi d'ordinanza al prezzo della Caserma, e per ognuna c'è la sua ricevuta."
    luogo: Guarnigione di Qir-Azel, il magazzino del furiere
    area: quartieri-alti
    ripetibile: true
    requisiti: [fazione.caserma >= 3]
    testo: |
      Dietro il banco del furiere, oltre gli scaffali dei mantelli, c'è una
      rastrelliera con le lance d'ordinanza in fila e un armadio chiuso a
      chiave dove stanno le balestre. Le cotte di maglia sono appese a un
      palo come prosciutti in una dispensa, e ognuna ha un cartellino con la
      taglia. Il furiere le vende ai miliziani al prezzo che le paga la
      Caserma, e su ogni ricevuta scrive *ordinanza* con la sua grafia
      piccola.

      {armi-da-mischia Facile} Le lance sono tutte uguali, con la punta
      forgiata dai Due Mastini e il bollo della Caserma sull'asta. Sono
      brutte e fatte per durare dieci anni in mano a chi non le pulisce mai.

      Il furiere ti guarda il mantello prima di aprire l'armadio, e poi il
      registro, per controllare il grado.
    opzioni:
      - testo: "Comprare una lancia d'ordinanza"
        descrizione: "Una lancia della Caserma, con il bollo sull'asta. Arriva prima dell'altro, perché è più lunga."
        quando: [fazione.caserma < 12]
        requisiti: [monete >= 16]
        costo: 0
        esito:
          titolo: La lancia
          testo: |
            Il furiere stacca una lancia dalla rastrelliera e te la porge con
            la ricevuta. Firmi, e lui soffia sull'inchiostro.
          effetti: { monete: -16, oggetto.lancia: 1 }
      - testo: "Comprare una balestra leggera"
        descrizione: "Dall'armadio chiuso a chiave. Il furiere conta i dardi due volte."
        quando: [fazione.caserma < 12]
        requisiti: [monete >= 40]
        costo: 0
        esito:
          titolo: La balestra
          testo: |
            Il furiere apre l'armadio con la chiave più piccola del suo mazzo e
            ti consegna una balestra leggera con dodici dardi, che conta due
            volte sul banco. Firmi la ricevuta per la balestra e un'altra per i
            dardi.
          effetti: { monete: -40, oggetto.balestra-leggera: 1 }
      - testo: "Comprare una cotta di maglia"
        descrizione: "Dal palo delle cotte, con il cartellino della taglia giusta."
        quando: [fazione.caserma < 12]
        requisiti: [monete >= 100]
        costo: 0
        esito:
          titolo: La cotta
          testo: |
            Il furiere ti prende le misure con lo sguardo e stacca dal palo una
            cotta con il cartellino giusto. Pesa più di quanto pensassi. La
            firmi, e lui annota la taglia accanto al tuo nome.
          effetti: { monete: -100, oggetto.cotta-di-maglia: 1 }
      - testo: "Comprare uno scudo"
        descrizione: "Uno scudo tondo della Guardia, con la torre dipinta sopra."
        quando: [fazione.caserma < 12]
        requisiti: [monete >= 13]
        costo: 0
        esito:
          titolo: Lo scudo
          testo: |
            Lo scudo ha la torre di Qir-Azel dipinta sopra, scrostata sul bordo
            dove lo hanno usato altri prima di te. Il furiere ci mette sopra la
            ricevuta.
          effetti: { monete: -13, oggetto.scudo: 1 }
      - testo: "Comprare una lancia, con lo sconto del luogotenente"
        descrizione: "Il luogotenente firma le sue ricevute da solo, e il furiere gli fa il prezzo di costo."
        quando: [fazione.caserma >= 12]
        requisiti: [monete >= 12]
        costo: 0
        esito:
          titolo: Al prezzo di costo
          testo: |
            Il furiere ti porge la lancia e la ricevuta, e stavolta la ricevuta
            la firmi da tutte e due le parti.
          effetti: { monete: -12, oggetto.lancia: 1 }
      - testo: "Comprare una balestra leggera, con lo sconto del luogotenente"
        descrizione: "Dall'armadio chiuso a chiave, al prezzo di costo."
        quando: [fazione.caserma >= 12]
        requisiti: [monete >= 30]
        costo: 0
        esito:
          titolo: La chiave piccola
          testo: |
            Il furiere ti dà la chiave piccola dell'armadio perché te la prenda
            da solo, e conta i dardi mentre la scegli.
          effetti: { monete: -30, oggetto.balestra-leggera: 1 }
      - testo: "Comprare una cotta di maglia, con lo sconto del luogotenente"
        descrizione: "Dal palo delle cotte, al prezzo di costo."
        quando: [fazione.caserma >= 12]
        requisiti: [monete >= 75]
        costo: 0
        esito:
          titolo: La taglia
          testo: |
            Il furiere stacca la cotta dal palo e la pesa sulla mano, come se
            potesse leggerci il prezzo. Firmi la ricevuta come luogotenente.
          effetti: { monete: -75, oggetto.cotta-di-maglia: 1 }
      - testo: "Comprare uno scudo, con lo sconto del luogotenente"
        descrizione: "Uno scudo tondo della Guardia, al prezzo di costo."
        quando: [fazione.caserma >= 12]
        requisiti: [monete >= 10]
        costo: 0
        esito:
          titolo: La torre dipinta
          testo: |
            Il furiere sceglie lo scudo con la torre meno scrostata e te lo
            porge con la ricevuta.
          effetti: { monete: -10, oggetto.scudo: 1 }

  # ------------------------------------------------------------ il registro della casa blu
  - id: caserma-il-registro-della-casa-blu
    presso: caserma-casa-blu
    immagine: ambientazione/citta-bassa
    titolo: Il registro della casa blu
    sommario: "Al posto di guardia della Città Bassa c'è sempre una denuncia da scrivere, un vicolo da girare o una pagina da mettere in ordine."
    luogo: Città Bassa, la casa di pietra blu
    area: citta-bassa
    ripetibile: true
    requisiti: [fazione.caserma >= 4]
    testo: |
      Il registro delle denunce della casa blu adesso ha le pagine scritte,
      con la data in cima e sotto le firme storte di chi scrive poco, quando
      non c'è l'impronta di un pollice. Sul banco c'è una tazza di zuppa che
      si raffredda, e alla porta una donna con un cesto aspetta il suo turno
      senza lamentarsi. In cucina qualcuno canticchia a bocca chiusa.

      {conoscenze-della-strada Media} In Città Bassa una denuncia vuol dire
      che qualcuno ha deciso che la Guardia serve a qualcosa. Ogni pagina
      scritta è una piccola scommessa fatta su di te.
    opzioni:
      - testo: "Raccogliere le denunce del giorno"
        descrizione: "Galline sparite, liti di cortile, un muro crollato. Ascoltare tutti e scrivere bene."
        requisiti: [nomea.citta-bassa < 3]
        prova: { attributo: sociale, abilita: [empatia, persuasione], difficolta: Media }
        successo:
          titolo: La coda
          testo: |
            Ascolti la donna con il cesto e dopo di lei due fratelli che
            litigano per una scala. Scrivi tutto con la data, e ognuno
            firma. A sera il registro ha sei righe nuove, e il furiere ti
            paga la giornata quando passi in Caserma.
          effetti: { monete: 4, nomea.citta-bassa: 0.5 }
        fallimento:
          titolo: I due fratelli
          testo: |
            I due fratelli della scala litigano anche con te, e se ne vanno
            insieme, d'accordo almeno su questo. La donna con il cesto, nel
            frattempo, si è stancata di aspettare.
          effetti: { monete: 1 }

      - testo: "Fare il giro dei vicoli"
        descrizione: "Il giro della sera, quando la casa blu chiude le imposte e la Città Bassa apre le sue."
        prova: { attributo: fisico, abilita: [atletica, furtivita], difficolta: Media }
        successo:
          titolo: Il giro della sera
          testo: |
            Fai il giro dei vicoli con la lanterna bassa, e ti fermi dove ti
            chiamano. Una lite finisce prima di cominciare, e un ladro di
            lenzuola lascia cadere il lenzuolo e scappa. Torni alla casa blu
            con i piedi che fanno male e la paga del turno.
          effetti: { monete: 4 }
        fallimento:
          titolo: Il vicolo sbagliato
          testo: |
            In un vicolo senza lanterne inciampi in un secchio, e qualcuno dal
            buio ride. Torni alla casa blu con un ginocchio sbucciato e la paga
            ridotta.
          effetti: { monete: 1, ferite: 0.5 }

      - testo: "Mettere in ordine il registro"
        descrizione: "Le denunce scritte di fretta vanno ricopiate in bella, e le firme controllate."
        prova: { attributo: mentale, abilita: [accademiche, politica-ed-economia], difficolta: Facile }
        successo:
          titolo: In bella
          testo: |
            Ricopi in bella le denunce della settimana, e trovi due volte lo
            stesso furto denunciato da due vicini diversi, che dicono di
            aver perso la stessa gallina. Lo scrivi a margine, perché il
            prossimo che passa lo sappia.
          effetti: { monete: 3 }
        fallimento:
          titolo: Le firme col pollice
          testo: |
            Le firme fatte con il pollice si somigliano tutte, e a metà pagina
            non sai più chi ha denunciato che cosa. Lasci il lavoro a metà.
          effetti: { monete: 1 }

  # ------------------------------------------------------------ la branda
  - id: caserma-la-branda
    presso: guarnigione-di-qir-azel
    immagine: ambientazione/guarnigione-di-qir-azel
    titolo: La branda in Caserma
    sommario: "In fondo al magazzino, dietro i mantelli, c'è una branda che il furiere tiene per i capi di ronda."
    luogo: Guarnigione di Qir-Azel, il fondo del magazzino
    area: quartieri-alti
    ripetibile: true
    requisiti: [fazione.caserma >= 6]
    testo: |
      In fondo al magazzino, dietro gli scaffali dei mantelli, il furiere
      tiene una branda con una coperta di lana grigia e un cuscino di paglia,
      per i capi di ronda che finiscono il turno troppo tardi per tornare a
      casa. Accanto c'è un catino d'acqua e una cassetta con le bende. Il
      furiere ti ha dato la chiave, con la ricevuta.

      {resistenza Facile} Il corpo riconosce la branda prima di te, e si
      prepara a lasciarsi andare.

      Dal cortile arriva il rumore dei manichini colpiti a tempo, e la voce
      di Gasti che conta.
    opzioni:
      - testo: "Dormire sulla branda"
        descrizione: "Una notte in Caserma, con il rumore del cortile e la coperta di lana."
        esito:
          titolo: La coperta grigia
          testo: |
            Dormi con la coperta di lana tirata sulla testa, e ti sveglia la
            voce di Gasti che ricomincia da uno. Le ferite tirano meno di ieri.
          effetti: { ferite: -1 }
      - testo: "Farsi rifare le fasciature dal cerusico"
        descrizione: "Il cerusico della Caserma passa la mattina, e per poco ti rifà le fasciature come si deve."
        requisiti: [monete >= 6]
        esito:
          titolo: Le bende pulite
          testo: |
            Il cerusico della Caserma ti toglie le bende vecchie e ti rifà
            le fasciature borbottando. Poi ti dice di dormire fino a
            mezzogiorno. Lo fai. Quando ti alzi hai la testa più leggera.
          effetti: { ferite: -1.5, tormento: -0.5, monete: -6 }

  # ------------------------------------------------------------ una pratica che si perde
  - id: caserma-una-pratica-che-si-perde
    presso: guarnigione-di-qir-azel
    immagine: ambientazione/guarnigione-di-qir-azel
    titolo: Una pratica che si perde
    sommario: "Il furiere archivia i rapporti con cura, tranne quando un vice-sceriffo gli chiede di archiviarne uno male."
    luogo: Guarnigione di Qir-Azel, il banco del furiere
    area: quartieri-alti
    ripetibile: true
    requisiti: [fazione.caserma >= 9, bivio.legge == 1]
    testo: |
      Il furiere archivia i rapporti delle ronde in cassette di legno, una
      per mese, in ordine di data. Le cassette sono tutte uguali e hanno
      l'etichetta scritta a mano. Ogni tanto un rapporto finisce nella
      cassetta sbagliata, e quel rapporto non lo ritrova più nessuno, finché
      il furiere non decide di ritrovarlo.

      {politica-ed-economia Media} Un rapporto che si perde è una pratica che
      non arriva sul tavolo dello sceriffo. Il furiere lo fa per i vice della
      lista, e soltanto in cambio di qualcosa che valga un rapporto.

      Il furiere ti guarda da sopra gli occhiali e aspetta che tu chieda.
    opzioni:
      - testo: "Dargli una voce di vicolo in cambio"
        descrizione: "Una voce vale un rapporto archiviato male. Il furiere la scrive in un altro registro, il suo."
        requisiti: [informazioni.voce >= 1, sospetto >= 0.5]
        esito:
          titolo: La cassetta sbagliata
          testo: |
            Gli racconti la voce sottovoce, e lui la scrive in un quadernetto che
            tiene sotto il banco. Poi prende dalla cassetta del mese un rapporto
            con il tuo nome e lo infila in quella dell'anno scorso, senza
            guardarlo. Il Sospetto che ti seguiva per i vicoli, da domani, ha un
            foglio in meno.
          effetti: { informazioni.voce: -1, sospetto: -2 }
      - testo: "Pagare le spese di servizio"
        descrizione: "Il furiere non accetta soldi. Le spese di servizio, però, le registra."
        requisiti: [monete >= 15, sospetto >= 0.5]
        esito:
          titolo: Spese di servizio
          testo: |
            Metti le monete sul banco, e lui le registra alla voce *spese di
            servizio* con la data e la tua firma. Poi sposta un rapporto da una
            cassetta all'altra, con la faccia di un uomo che riordina.
          effetti: { monete: -15, sospetto: -1 }

  # ------------------------------------------------------------ l'archivio dei rapporti
  - id: caserma-l-archivio-dei-rapporti
    presso: guarnigione-di-qir-azel
    immagine: ambientazione/guarnigione-di-qir-azel
    titolo: L'archivio dei rapporti
    sommario: "Con la chiave dell'archivio, il luogotenente può leggere anni di rapporti di ronda. Dentro c'è mezza città."
    luogo: Guarnigione di Qir-Azel, l'archivio
    area: quartieri-alti
    ripetibile: true
    requisiti: [fazione.caserma >= 12, bivio.legge == 1]
    testo: |
      L'archivio è una stanza senza finestre sotto le scale del mastio, con
      gli scaffali dal pavimento al soffitto e le cassette dei rapporti
      ordinate per anno. Al centro c'è un tavolo con una lampada e una sedia
      sola, e tutto sa di carta vecchia. La chiave ce l'avete tu e il
      furiere.

      {accademiche Media} Anni di ronde, scritte a matita da gente che
      sapeva scrivere a fatica. Chi sa leggere fra le righe ci trova dove
      andava la gente, e con chi.

      Sul tavolo il furiere ti ha lasciato un candelotto nuovo e un foglio
      bianco per gli appunti.
    opzioni:
      - testo: "Leggere i rapporti dei Ponti"
        descrizione: "I rapporti delle ronde dei Ponti, con le barche che passano di notte senza pagare la gabella."
        prova: { attributo: mentale, abilita: [politica-ed-economia, percezione], difficolta: Media }
        successo:
          titolo: Le notti dei Ponti
          testo: |
            Leggi due anni di ronde dei Ponti e ti segni le notti in cui la
            stessa barca è passata sotto il Ponte dei Morti con le stesse
            lanterne spente. È una cosa che qualcuno, al Mercato dei Nodi,
            pagherebbe per sapere.
          effetti: { informazioni.pettegolezzo: 1 }
        fallimento:
          titolo: La lampada
          testo: |
            La lampada si consuma prima che tu trovi qualcosa che valga la
            pena. Esci con gli occhi che bruciano e il foglio bianco.
          effetti: { tormento: 0.5 }

      - testo: "Cercare un nome nei rapporti vecchi"
        descrizione: "Un nome che torna, anno dopo anno, in rapporti diversi. Trovarlo richiede una memoria lunga."
        prova: { attributo: mentale, abilita: [percezione, accademiche], difficolta: Difficile }
        successo:
          titolo: Il nome che torna
          testo: |
            Il nome torna sette volte in quattro anni, sempre in un rapporto
            diverso e sempre accanto a una cosa sparita. Nessuno l'ha mai
            messo insieme, perché nessuno prima di te ha mai letto tutti i
            rapporti.
          effetti: { informazioni.segreto: 1 }
        fallimento:
          titolo: I nomi uguali
          testo: |
            I nomi della Città Bassa si ripetono tutti, e a mezzanotte hai tre
            Marco e quattro Ida e nessuna storia. Chiudi le cassette.
          effetti: { tormento: 0.5 }

  # ------------------------------------------------------------ la paga del capitano
  - id: caserma-la-paga-del-capitano
    presso: guarnigione-di-qir-azel
    immagine: ambientazione/guarnigione-di-qir-azel
    titolo: La paga del capitano
    sommario: "Ogni settimana il furiere conta la paga del capitano sul banco, e ogni settimana la Guardia aspetta la rassegna."
    luogo: Guarnigione di Qir-Azel, il cortile
    area: quartieri-alti
    ripetibile: true
    requisiti: [caserma.capitano >= 1]
    testo: |
      Il lunedì mattina il furiere conta a mucchietti sul banco la paga del
      capitano, e ti fa firmare la ricevuta con il titolo intero, perché
      dice che le abbreviazioni sono l'inizio della fine. Nel cortile la
      Guardia è schierata per la rassegna, con i mantelli scarlatti chiusi
      fino al collo. Gasti conta le file ad alta voce.

      {intimidire Facile} Quando passi davanti alle file i miliziani
      raddrizzano la schiena di un dito, e adesso lo fanno per te.

      Dalla finestra dell'ufficio Galdrick guarda il cortile, con i pollici
      nella cintura.
    opzioni:
      - testo: "Ritirare la paga della settimana"
        descrizione: "La paga del titolo, contata a mucchietti sul banco."
        costo: 2
        esito:
          titolo: I mucchietti
          testo: |
            Il furiere conta i mucchietti due volte e te li spinge sul banco con
            la ricevuta. Firmi con il titolo intero. Lui soffia sull'inchiostro
            e passa alla riga dopo.
          effetti: { monete: 25 }
      - testo: "Passare in rassegna la Guardia"
        descrizione: "La rassegna del lunedì, fila per fila. Una parola giusta a chi la merita, e un'occhiata a chi ha la fibbia storta."
        requisiti: [rep.caserma < 10]
        prova: { attributo: sociale, abilita: [intimidire, galateo], difficolta: Media }
        successo:
          titolo: Le file dritte
          testo: |
            Passi le file una per una. Raddrizzi una fibbia, e chiedi a una
            recluta il nome di sua madre. A fine rassegna Gasti smette di
            contare senza che nessuno gliel'abbia detto, e il cortile resta
            in silenzio finché non dai il rompete le righe.
          effetti: { monete: 10, rep.caserma: 0.5 }
        fallimento:
          titolo: La fibbia
          testo: |
            Ti fermi troppo a lungo davanti a una fibbia storta, e la recluta
            arrossisce fino alle orecchie mentre le file dietro ridono. Gasti
            ricomincia a contare da uno, per coprirle.
          effetti: { monete: 5 }
