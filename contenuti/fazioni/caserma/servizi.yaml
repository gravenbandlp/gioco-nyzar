# I ripetibili della quest della Caserma, che si aprono con i passi e con i gradi:
# - l'armeria d'ordinanza (grado 1, passo 3): lancia, balestra leggera, cotta di maglia e scudo a prezzo ridotto;
#   dal grado 4 (passo 12) con lo sconto del luogotenente;
# - il registro della casa blu (dal passo 4): il lavoro al posto di guardia in Città Bassa, con la nomea;
# - la branda in Caserma (grado 2, passo 6): si dorme e ci si cura;
# - una pratica che si perde (grado 3, passo 9): il furiere archivia male un rapporto, e il Sospetto scende;
# - l'archivio dei rapporti (grado 4, passo 12): informazioni dai rapporti delle ronde;
# - la paga del capitano (grado 5, con caserma.capitano): la rendita del titolo e la rassegna della Guardia.
# I prezzi stanno negli effetti e nei requisiti, mai nella prosa.
storylet:
  # ------------------------------------------------------------ l'armeria d'ordinanza
  - id: caserma-l-armeria-d-ordinanza
    presso: guarnigione-di-qir-azel
    immagine: ambientazione/guarnigione-di-qir-azel
    titolo: L'armeria d'ordinanza
    sommario: "Il furiere vende ai miliziani le armi d'ordinanza al prezzo della Caserma, con la ricevuta."
    luogo: Guarnigione di Qir-Azel, il magazzino del furiere
    area: quartieri-alti
    ripetibile: true
    requisiti: [fazione.caserma >= 3]
    testo: |
      Dietro il banco del furiere ci sono una rastrelliera di lance
      d'ordinanza e un armadio chiuso a chiave per le balestre, mentre le
      cotte di maglia pendono da un palo come prosciutti. Su ogni ricevuta
      il furiere scrive *ordinanza* con la sua grafia piccola.

      {armi-da-mischia Facile} Le lance con il bollo della Caserma sono
      brutte e fatte per durare dieci anni in mano a chi non le pulisce mai.
    opzioni:
      - testo: "Comprare una lancia d'ordinanza"
        descrizione: "Una lancia della Caserma, che arriva prima dell'altro perché è più lunga."
        quando: [fazione.caserma < 12]
        requisiti: [monete >= 16]
        costo: 0
        esito:
          titolo: La lancia
          testo: |
            Il furiere stacca una lancia dalla rastrelliera e te la porge con
            la ricevuta. Firmi, e lui soffia sull'inchiostro.
          effetti: { monete: -16, oggetto.lancia: 1 }
      - testo: "Comprare una balestra leggera"
        descrizione: "Dall'armadio chiuso a chiave, con i dardi contati due volte."
        quando: [fazione.caserma < 12]
        requisiti: [monete >= 40]
        costo: 0
        esito:
          titolo: La balestra
          testo: |
            Il furiere apre l'armadio con la chiave più piccola e ti consegna una
            balestra leggera con dodici dardi, contati due volte.
          effetti: { monete: -40, oggetto.balestra-leggera: 1 }
      - testo: "Comprare una cotta di maglia"
        descrizione: "Dal palo delle cotte, con il cartellino della taglia giusta."
        quando: [fazione.caserma < 12]
        requisiti: [monete >= 100]
        costo: 0
        esito:
          titolo: La cotta
          testo: |
            Il furiere stacca dal palo una cotta della tua taglia, che pesa più di
            quanto pensassi.
          effetti: { monete: -100, oggetto.cotta-di-maglia: 1 }
      - testo: "Comprare uno scudo"
        descrizione: "Uno scudo tondo della Guardia, con la torre dipinta sopra."
        quando: [fazione.caserma < 12]
        requisiti: [monete >= 13]
        costo: 0
        esito:
          titolo: Lo scudo
          testo: |
            Lo scudo ha la torre di Qir-Azel dipinta sopra, scrostata sul bordo
            dove l'hanno usato altri prima di te.
          effetti: { monete: -13, oggetto.scudo: 1 }
      - testo: "Comprare una lancia, con lo sconto del luogotenente"
        descrizione: "Il luogotenente firma le sue ricevute da solo, e paga il prezzo di costo."
        quando: [fazione.caserma >= 12]
        requisiti: [monete >= 12]
        costo: 0
        esito:
          titolo: Al prezzo di costo
          testo: |
            Il furiere ti porge la lancia e la ricevuta, e stavolta la ricevuta
            la firmi da tutte e due le parti.
          effetti: { monete: -12, oggetto.lancia: 1 }
      - testo: "Comprare una balestra leggera, con lo sconto del luogotenente"
        descrizione: "Dall'armadio chiuso a chiave, al prezzo di costo."
        quando: [fazione.caserma >= 12]
        requisiti: [monete >= 30]
        costo: 0
        esito:
          titolo: La chiave piccola
          testo: |
            Il furiere ti dà la chiave piccola dell'armadio perché te la prenda
            da solo, e conta i dardi mentre la scegli.
          effetti: { monete: -30, oggetto.balestra-leggera: 1 }
      - testo: "Comprare una cotta di maglia, con lo sconto del luogotenente"
        descrizione: "Dal palo delle cotte, al prezzo di costo."
        quando: [fazione.caserma >= 12]
        requisiti: [monete >= 75]
        costo: 0
        esito:
          titolo: La taglia
          testo: |
            Il furiere soppesa la cotta come se potesse leggerci il prezzo, e tu
            firmi la ricevuta come luogotenente.
          effetti: { monete: -75, oggetto.cotta-di-maglia: 1 }
      - testo: "Comprare uno scudo, con lo sconto del luogotenente"
        descrizione: "Uno scudo tondo della Guardia, al prezzo di costo."
        quando: [fazione.caserma >= 12]
        requisiti: [monete >= 10]
        costo: 0
        esito:
          titolo: La torre dipinta
          testo: |
            Il furiere sceglie lo scudo con la torre meno scrostata e te lo
            porge con la ricevuta.
          effetti: { monete: -10, oggetto.scudo: 1 }

  # ------------------------------------------------------------ il registro della casa blu
  - id: caserma-il-registro-della-casa-blu
    presso: caserma-casa-blu
    immagine: ambientazione/citta-bassa
    titolo: Il registro della casa blu
    sommario: "Al posto di guardia della Città Bassa c'è sempre una denuncia da scrivere o un vicolo da girare."
    luogo: Città Bassa, la casa di pietra blu
    area: citta-bassa
    ripetibile: true
    requisiti: [fazione.caserma >= 4]
    testo: |
      Il registro della casa blu adesso ha le pagine piene di firme storte e
      impronte di pollice, e alla porta una donna con un cesto aspetta il
      suo turno senza lamentarsi.

      {conoscenze-della-strada Media} In Città Bassa una denuncia è una
      piccola scommessa sulla Guardia, e adesso la Guardia sei tu.
    opzioni:
      - testo: "Raccogliere le denunce del giorno"
        descrizione: "Galline sparite e liti di cortile da scrivere bene."
        requisiti: [nomea.citta-bassa < 3]
        prova: { attributo: sociale, abilita: [empatia, persuasione], difficolta: Media }
        successo:
          titolo: La coda
          testo: |
            Ascolti la donna con il cesto e due fratelli che litigano per una
            scala, e il furiere ti paga la giornata.
          effetti: { monete: 4, nomea.citta-bassa: 0.5 }
        fallimento:
          titolo: I due fratelli
          testo: |
            I due fratelli litigano anche con te, e intanto la donna con il cesto
            si stanca di aspettare.
          effetti: { monete: 1 }

      - testo: "Fare il giro dei vicoli"
        descrizione: "Il giro della sera, quando la Città Bassa apre le sue imposte."
        prova: { attributo: fisico, abilita: [atletica, furtivita], difficolta: Media }
        successo:
          titolo: Il giro della sera
          testo: |
            Fai il giro con la lanterna bassa, e un ladro di lenzuola lascia
            cadere il lenzuolo e scappa. Torni alla casa blu con la paga del
            turno.
          effetti: { monete: 4 }
        fallimento:
          titolo: Il vicolo sbagliato
          testo: |
            Inciampi in un secchio in un vicolo buio, e torni con un ginocchio
            sbucciato e la paga ridotta.
          effetti: { monete: 1, ferite: 0.5 }

      - testo: "Mettere in ordine il registro"
        descrizione: "Le denunce scritte di fretta vanno ricopiate in bella."
        prova: { attributo: mentale, abilita: [accademiche, politica-ed-economia], difficolta: Facile }
        successo:
          titolo: In bella
          testo: |
            Ricopiando in bella trovi lo stesso furto denunciato da due vicini,
            che dicono di aver perso la stessa gallina, e lo segni a margine.
          effetti: { monete: 3 }
        fallimento:
          titolo: Le firme col pollice
          testo: |
            Le impronte di pollice si somigliano tutte, e a metà pagina non sai
            più chi ha denunciato che cosa.
          effetti: { monete: 1 }

  # ------------------------------------------------------------ la branda
  - id: caserma-la-branda
    presso: guarnigione-di-qir-azel
    immagine: ambientazione/guarnigione-di-qir-azel
    titolo: La branda in Caserma
    sommario: "Il furiere tiene una branda in fondo al magazzino per i capi di ronda."
    luogo: Guarnigione di Qir-Azel, il fondo del magazzino
    area: quartieri-alti
    ripetibile: true
    requisiti: [fazione.caserma >= 6]
    testo: |
      Il furiere tiene in fondo al magazzino una branda con una coperta di
      lana grigia per i capi di ronda che finiscono il turno troppo tardi, e
      dal cortile arriva la voce di Gasti che conta.

      {resistenza Facile} Il corpo riconosce la branda prima di te, e si
      prepara a lasciarsi andare.
    opzioni:
      - testo: "Dormire sulla branda"
        descrizione: "Una notte in Caserma, sotto la coperta di lana."
        esito:
          titolo: La coperta grigia
          testo: |
            Ti sveglia Gasti che ricomincia da uno, e le ferite tirano meno di
            ieri.
          effetti: { ferite: -1 }
      - testo: "Farsi rifare le fasciature dal cerusico"
        descrizione: "Il cerusico della Caserma passa la mattina, e per poco ti rifà le fasciature."
        requisiti: [monete >= 6]
        esito:
          titolo: Le bende pulite
          testo: |
            Il cerusico ti rifà le fasciature borbottando e ti manda a dormire
            fino a mezzogiorno.
          effetti: { ferite: -1.5, tormento: -0.5, monete: -6 }

  # ------------------------------------------------------------ una pratica che si perde
  - id: caserma-una-pratica-che-si-perde
    presso: guarnigione-di-qir-azel
    immagine: ambientazione/guarnigione-di-qir-azel
    titolo: Una pratica che si perde
    sommario: "Il furiere archivia i rapporti con cura, tranne quando un vice-sceriffo gli chiede di sbagliare."
    luogo: Guarnigione di Qir-Azel, il banco del furiere
    area: quartieri-alti
    ripetibile: true
    requisiti: [fazione.caserma >= 9, bivio.legge == 1]
    testo: |
      Il furiere archivia i rapporti delle ronde in cassette tutte uguali, e
      ogni tanto uno finisce nella cassetta sbagliata e non lo ritrova più
      nessuno.

      {politica-ed-economia Media} Un rapporto perso non arriva sul tavolo
      dello sceriffo. Il furiere lo fa per i vice della lista, in cambio di
      qualcosa che valga un rapporto.

      Ti guarda da sopra gli occhiali e aspetta.
    opzioni:
      - testo: "Dargli una voce di vicolo in cambio"
        descrizione: "Una voce vale un rapporto archiviato male, e il furiere la scrive nel suo registro."
        requisiti: [informazioni.voce >= 1, sospetto >= 0.5]
        esito:
          titolo: La cassetta sbagliata
          testo: |
            Il furiere scrive la voce in un quadernetto sotto il banco e infila il
            rapporto con il tuo nome nella cassetta dell'anno scorso. Il Sospetto
            che ti seguiva ha un foglio in meno.
          effetti: { informazioni.voce: -1, sospetto: -2 }
      - testo: "Pagare le spese di servizio"
        descrizione: "Il furiere registra volentieri le spese di servizio."
        requisiti: [monete >= 15, sospetto >= 0.5]
        esito:
          titolo: Spese di servizio
          testo: |
            Il furiere registra le monete alla voce *spese di servizio* e sposta
            un rapporto da una cassetta all'altra, come se riordinasse.
          effetti: { monete: -15, sospetto: -1 }

  # ------------------------------------------------------------ l'archivio dei rapporti
  - id: caserma-l-archivio-dei-rapporti
    presso: guarnigione-di-qir-azel
    immagine: ambientazione/guarnigione-di-qir-azel
    titolo: L'archivio dei rapporti
    sommario: "Con la chiave dell'archivio il luogotenente può leggere anni di rapporti di ronda, e dentro c'è mezza città."
    luogo: Guarnigione di Qir-Azel, l'archivio
    area: quartieri-alti
    ripetibile: true
    requisiti: [fazione.caserma >= 12, bivio.legge == 1]
    testo: |
      L'archivio è una stanza senza finestre sotto le scale del mastio, con
      le cassette dei rapporti ordinate per anno fino al soffitto e un
      tavolo con una lampada e un foglio bianco per gli appunti.

      {accademiche Media} Anni di ronde scritte a matita da gente che
      scriveva a fatica, e fra le righe c'è dove andava la gente, e con chi.
    opzioni:
      - testo: "Leggere i rapporti dei Ponti"
        descrizione: "Le ronde dei Ponti, con le barche che passano di notte senza pagare la gabella."
        prova: { attributo: mentale, abilita: [politica-ed-economia, percezione], difficolta: Media }
        successo:
          titolo: Le notti dei Ponti
          testo: |
            In due anni di ronde dei Ponti la stessa barca passa sotto il Ponte
            dei Morti con le lanterne spente, sempre nelle stesse notti. Al
            Mercato dei Nodi qualcuno pagherebbe per saperlo.
          effetti: { informazioni.pettegolezzo: 1 }
        fallimento:
          titolo: La lampada
          testo: |
            La lampada si consuma prima che tu trovi qualcosa, ed esci con gli
            occhi che bruciano e il foglio bianco.
          effetti: { tormento: 1 }

      - testo: "Cercare un nome nei rapporti vecchi"
        descrizione: "Un nome che torna anno dopo anno, per chi ha la memoria lunga."
        prova: { attributo: mentale, abilita: [percezione, accademiche], difficolta: Difficile }
        successo:
          titolo: Il nome che torna
          testo: |
            Il nome torna sette volte in quattro anni, sempre accanto a una cosa
            sparita, e nessuno l'ha mai messo insieme perché nessuno ha mai letto
            tutti i rapporti.
          effetti: { informazioni.segreto: 1 }
        fallimento:
          titolo: I nomi uguali
          testo: |
            I nomi della Città Bassa si ripetono, e a mezzanotte hai tre Marco e
            quattro Ida e nessuna storia.
          effetti: { tormento: 1 }

  # ------------------------------------------------------------ la paga del capitano
  - id: caserma-la-paga-del-capitano
    presso: guarnigione-di-qir-azel
    immagine: ambientazione/guarnigione-di-qir-azel
    titolo: La paga del capitano
    sommario: "Ogni lunedì il furiere conta la paga del capitano, e la Guardia aspetta la rassegna."
    luogo: Guarnigione di Qir-Azel, il cortile
    area: quartieri-alti
    ripetibile: true
    requisiti: [caserma.capitano >= 1]
    testo: |
      Il lunedì il furiere conta la paga del capitano e ti fa firmare con il
      titolo intero, perché le abbreviazioni sono l'inizio della fine. Nel
      cortile la Guardia è schierata per la rassegna, e Gasti conta le file
      ad alta voce.

      {intimidire Facile} Quando passi davanti alle file i miliziani
      raddrizzano la schiena di un dito, e adesso lo fanno per te.
    opzioni:
      - testo: "Ritirare la paga della settimana"
        descrizione: "La paga del titolo, contata a mucchietti sul banco."
        costo: 2
        esito:
          titolo: I mucchietti
          testo: |
            Il furiere conta i mucchietti due volte e te li spinge sul banco con
            la ricevuta, che firmi con il titolo intero.
          effetti: { monete: 25 }
      - testo: "Passare in rassegna la Guardia"
        descrizione: "La rassegna del lunedì, una parola a chi la merita e un'occhiata alle fibbie storte."
        requisiti: [rep.caserma < 10]
        prova: { attributo: sociale, abilita: [intimidire, galateo], difficolta: Media }
        successo:
          titolo: Le file dritte
          testo: |
            Passi le file una per una e chiedi a una recluta il nome di sua madre.
            A fine rassegna Gasti smette di contare da solo, e il cortile tace
            fino al rompete le righe.
          effetti: { monete: 10, rep.caserma: 0.5 }
        fallimento:
          titolo: La fibbia
          testo: |
            Ti fermi troppo davanti a una fibbia storta, e Gasti ricomincia a
            contare da uno per coprire le risate delle file.
          effetti: { monete: 5 }
