# La quest della Caserma, passo 12 (fazione.caserma == 11, grado 4): «La strada del fango», all'inseguimento del
# Pesatore sulla strada per Ghoran, ai margini della Palude Acquanera, per riportare indietro Brina.
# Ci si entra da caserma-la-strada-del-fango (Città Bassa, ripetibile finché il passo è aperto): con Hagra
# (caserma.guida 1, che apre un'opzione sociale in ogni fascia), con una guida a pagamento (2) o da soli (3).
# Ritorno in Città Bassa, soglia 4, tre stanze alla volta.
# Fasce di profondità: 0 la pietra miliare, la locanda; 0-1 la pioggia; 1 il guado, i canneti; 1-2 il fango;
# 2 il bivacco dei cacciatori, i cani da presa (combattimento); 2-3 le tracce; 3 la bilancia nel fango.
# Il cuore (4) è il carro-gabbia: il Pesatore con un cacciatore (boss Difficile); oppure Hagra contesta il sigillo
# (caserma.guida == 1, Difficile, caserma.hagra), il cavillo (caserma.cavillo == 1, Difficile), o per il Fuggiasco di
# Ghoran salire sulla bilancia al posto di Brina (Difficile). Chi perde torna in città con le Ferite dello scontro.
# Il seguito chiude il passo: Brina libera, il registro del Pesatore, il grado di luogotenente e, con
# caserma.anticipo == 1, il rimborso della paga anticipata.
aree:
  - id: caserma-strada-del-fango
    immagine: ambientazione/palude-acquanera
    nome: La strada del fango
    sommario: "La strada del sud verso Ghoran, che dopo l'ultima pietra miliare diventa una pista di fango lungo la palude."
    spedizione: { ritorno: citta-bassa, soglia: 4, stanze: 3 }
    testo: |
      Mezza giornata fuori da Qir-Azel il lastricato finisce e comincia una
      pista di fango battuto fra la Palude Acquanera e le colline spoglie. A
      Ghoran ci vogliono sei giorni, e il carro del Pesatore ne ha due di
      vantaggio, con i solchi troppo profondi per un carro vuoto e accanto
      le orme larghe dei cani.

storylet:
  # ------------------------------------------------------------ l'ingresso, in Città Bassa
  - id: caserma-la-strada-del-fango
    immagine: ambientazione/palude-acquanera
    titolo: La strada del fango
    sommario: "Galdrick ha firmato un ordine con il tuo grado per riportare Brina, ma la legge della città finisce all'ultima pietra miliare."
    luogo: Città Bassa, la porta del sud
    area: citta-bassa
    ripetibile: true
    requisiti: [fazione.caserma == 11, bivio.legge == 1]
    testo: |
      Galdrick ti ha consegnato l'ordine nella casa blu, con la zuppa di
      Brina ancora calda e la faccia rossa fino alla testa rasata. Sotto il
      tuo grado c'è una riga sola, *riportarla indietro*.

      {politica-ed-economia Media} Un ordine della Caserma vale fino
      all'ultima pietra miliare, e dopo quanto la carta su cui è scritto.

      Alla porta del sud Hagra mastica resina appoggiata alla lancia. Dice
      che conosce la pista fino al Guado, e che il Pesatore lo conosce anche
      meglio, eh.

      {origine fuggiasco-di-ghoran} È la strada da cui sei arrivato in città,
      di notte, con le ginocchia sanguinanti.
    opzioni:
      - testo: "Partire con Hagra"
        descrizione: "Hagra conosce la pista e i clan del Guado, e ha un prezzo che non ha ancora detto."
        immagine: ambientazione/ghoran
        esito:
          titolo: La lancia di Hagra
          testo: |
            Hagra sputa la resina nel fango e parte senza aspettarti, con la
            lancia in spalla. Al primo miglio ti chiede se sai perché la chiamano
            la strada del fango, e ride. «Lo vedrai, eh.»
          imposta: { caserma.guida: 1 }
          vai: caserma-strada-del-fango

      - testo: "Pagare una guida della porta del sud"
        descrizione: "Alla porta ci sono uomini che accompagnano i carri fino alla palude senza fare domande."
        requisiti: [monete >= 15]
        esito:
          titolo: La guida della porta
          testo: |
            La guida, un uomo piccolo con un cappello di paglia, conta le monete
            due volte e ti avverte che fino al Guado ci va, oltre no.
          imposta: { caserma.guida: 2 }
          effetti: { monete: -15 }
          vai: caserma-strada-del-fango

      - testo: "Partire da solo"
        descrizione: "I solchi del carro si vedono già dalla porta, e basta seguirli finché si vedono."
        costo: 2
        esito:
          titolo: I solchi
          testo: |
            Esci dalla porta del sud con l'ordine nella tasca interna e l'acqua
            per tre giorni, mentre Hagra ti guarda andare senza chiamarti.
          imposta: { caserma.guida: 3 }
          vai: caserma-strada-del-fango

  # ------------------------------------------------------------ 0 · l'ultima pietra
  - id: caserma-fango-la-pietra-miliare
    immagine: ambientazione/palude-acquanera
    titolo: L'ultima pietra miliare
    sommario: "Una pietra con la torre di Qir-Azel incisa, mezza affondata nel fango, dove finisce la legge della città."
    luogo: La strada del fango, l'ultima pietra miliare
    area: caserma-strada-del-fango
    ripetibile: true
    requisiti: [fazione.caserma == 11, profondita.caserma-strada-del-fango == 0]
    testo: |
      Dove il lastricato finisce c'è una pietra miliare alta fino al
      ginocchio, con la torre di Qir-Azel incisa verso la città e la faccia
      liscia verso sud. Sopra c'è una ciotola di legno con dentro una moneta
      verde di muschio, e oltre il fango arriva subito alla caviglia.

      {accademiche Media} Le pietre miliari le ha messe il Consiglio, una
      per giorno di cammino, e la faccia liscia verso sud l'hanno lasciata
      così apposta.
    opzioni:
      - testo: "Seguire i solchi nel fango"
        descrizione: "I solchi sono profondi e dritti, e il fango è traditore."
        prova: { attributo: fisico, abilita: [resistenza, atletica], difficolta: Media }
        successo:
          titolo: Il passo del fango
          testo: |
            Impari presto il passo corto del fango, piatto, senza spingere sulla
            punta, e i solchi ti portano avanti per mezza giornata.
          effetti: { profondita.caserma-strada-del-fango: 1 }
        fallimento:
          titolo: Lo stivale
          testo: |
            Al terzo passo il fango si prende uno stivale, e lo recuperi infilando
            il braccio fino al gomito.
          effetti: { ferite: 0.5 }

      - testo: "Lasciare una moneta nella ciotola"
        descrizione: "Chi passa di qui lascia una moneta nella ciotola, e il perché bisogna chiederlo a chi l'ha lasciata."
        requisiti: [monete >= 1]
        esito:
          titolo: La ciotola
          testo: |
            Metti una moneta accanto a quella verde, sentendoti un po' stupido e
            un po' meglio, e passi la pietra.
          effetti: { profondita.caserma-strada-del-fango: 1, monete: -1 }

      - testo: "Chiedere a Hagra della pietra"
        descrizione: "Hagra guarda la pietra come si guarda un cartello conosciuto."
        quando: [caserma.guida == 1]
        prova: { attributo: sociale, abilita: [empatia, conoscenze-della-strada], difficolta: Facile }
        successo:
          titolo: La moneta per tornare
          testo: |
            «La moneta è per tornare» dice Hagra. «Chi va a Ghoran la lascia qui,
            e se torna se la riprende. Quella verde, eh, non l'ha ripresa
            nessuno.» Lei passa senza lasciare niente.
          effetti: { profondita.caserma-strada-del-fango: 1 }
        fallimento:
          titolo: Le storie dei clan
          testo: |
            Hagra ti dice che è una storia dei clan e passa oltre, mentre il fango
            ti prende fino alla caviglia.
          effetti: { tormento: 1 }

      - testo: "Aspettare che il fango si asciughi un poco"
        descrizione: "A mezzogiorno il sole indurisce la crosta del fango, al prezzo di mezza giornata."
        costo: 2
        esito:
          titolo: La crosta
          testo: |
            Aspetti sulla pietra finché il sole non fa la crosta, e ci cammini
            sopra con il peso sui talloni, mezza giornata dietro il carro.
          effetti: { profondita.caserma-strada-del-fango: 1 }

  - id: caserma-fango-la-locanda
    immagine: ambientazione/palude-acquanera
    titolo: La locanda della palude
    sommario: "Una locanda di canne e fango a un giorno da Qir-Azel, dove il Pesatore ha pagato da bere a tutti."
    luogo: La strada del fango, la locanda della palude
    area: caserma-strada-del-fango
    ripetibile: true
    requisiti: [fazione.caserma == 11, profondita.caserma-strada-del-fango == 0]
    testo: |
      A un giorno di cammino c'è una locanda di canne e fango seccato, e
      dietro il bancone l'oste, una donna enorme con un fazzoletto rosso in
      testa, ha appeso al chiodo un collare da cane nuovo.

      «Due giorni fa» dice prima che tu chieda. «Ha pagato da bere a tutti,
      e i cacciatori hanno dormito nel fienile. Nella gabbia c'era una donna
      con un mestolo in mano.»
    opzioni:
      - testo: "Farsi raccontare dei cacciatori"
        descrizione: "L'oste ricorda tutto, se le si chiede la cosa giusta."
        prova: { attributo: sociale, abilita: [empatia, persuasione], difficolta: Media }
        successo:
          titolo: Il fienile
          testo: |
            Con il Pesatore ci sono due cacciatori, e uno dei tre cani è morto al
            guado. Quando la donna con il mestolo ha chiesto acqua per tutti il
            Pesatore gliel'ha data, e l'oste lo racconta con un rispetto
            riluttante per lei.
          effetti: { profondita.caserma-strada-del-fango: 1, informazioni.voce: 1 }
        fallimento:
          titolo: Il boccale
          testo: |
            L'oste vende da bere e non storie, e ti mette davanti un boccale di
            birra di palude che sa di torba e che paghi.
          effetti: { monete: -1 }

      - testo: "Dormire nel fienile dei cacciatori"
        descrizione: "Nel fienile la paglia è ancora schiacciata dove i cacciatori hanno dormito."
        prova: { attributo: mentale, abilita: percezione, difficolta: Media }
        successo:
          titolo: La paglia
          testo: |
            Nella paglia trovi un foglio con un elenco di villaggi nella grafia
            dritta del Pesatore, e all'alba riparti sapendo dove sarà il carro fra
            due giorni.
          effetti: { profondita.caserma-strada-del-fango: 1, ferite: -0.5 }
        fallimento:
          titolo: Le pulci
          testo: |
            Nella paglia trovi soltanto le pulci dei cani, e ti svegli all'alba
            grattandoti mentre l'oste ride dalla porta.
          effetti: { tormento: 1 }

      - testo: "Lasciare che parli Hagra"
        descrizione: "Fra la gente della palude e i clan ci sono conti vecchi, e l'oste guarda Hagra in un altro modo."
        quando: [caserma.guida == 1]
        prova: { attributo: sociale, abilita: [galateo, empatia], difficolta: Facile }
        successo:
          titolo: La resina
          testo: |
            Hagra e l'oste masticano resina insieme in silenzio, a lungo. Poi
            l'oste le dice che il Pesatore passerà il Guado di Pietra domani
            notte, perché il Guado Grande è in piena.
          effetti: { profondita.caserma-strada-del-fango: 1, informazioni.voce: 1 }
        fallimento:
          titolo: I conti vecchi
          testo: |
            L'oste rifiuta la resina di Hagra con un gesto della mano, e Hagra si
            offende in un modo che non capisci e non ti parla fino a sera.
          effetti: { tormento: 1 }

      - testo: "Mangiare e ripartire"
        descrizione: "Una scodella calda e via, senza domande."
        costo: 2
        esito:
          titolo: La zuppa di torba
          testo: |
            Mangi una zuppa pepata che sa di torba, mentre due avventori parlano
            del carro con la gabbia come di un temporale passato.
          effetti: { profondita.caserma-strada-del-fango: 1 }

  # ------------------------------------------------------------ 0–1 · la pioggia
  - id: caserma-fango-la-pioggia
    immagine: ambientazione/palude-acquanera
    titolo: La pioggia sulla palude
    sommario: "Dalla palude arriva un temporale, e i solchi del carro si riempiono d'acqua."
    luogo: La strada del fango, sotto la pioggia
    area: caserma-strada-del-fango
    ripetibile: true
    requisiti: [fazione.caserma == 11, profondita.caserma-strada-del-fango <= 1]
    testo: |
      Il temporale arriva dalla palude come un muro grigio, e la pista
      diventa un torrente basso che cancella i solchi e le orme dei cani. A
      duecento passi c'è un boschetto di salici con i rami che toccano
      terra.
    opzioni:
      - testo: "Andare avanti sotto la pioggia"
        descrizione: "Seguire i solchi finché si vedono, e dopo andare a occhio."
        prova: { attributo: fisico, abilita: [resistenza, atletica], difficolta: Media }
        successo:
          titolo: Sotto l'acqua
          testo: |
            Segui i solchi finché si vedono, e poi la linea dei salici che il
            carro ha costeggiato, e dopo il temporale li ritrovi oltre il
            boschetto.
          effetti: { profondita.caserma-strada-del-fango: 1 }
        fallimento:
          titolo: Il torrente
          testo: |
            L'acqua ti porta via una gamba e scivoli per dieci passi fino a una
            radice. Ti rialzi coperto di fango, e la pista non c'è più.
          effetti: { ferite: 0.5 }

      - testo: "Ripararsi sotto i salici"
        descrizione: "Sotto i salici si sta asciutti, ma dopo bisogna ritrovare la pista."
        prova: { attributo: mentale, abilita: [natura, percezione], difficolta: Media }
        successo:
          titolo: I rami spezzati
          testo: |
            Aspetti la fine del temporale contro un tronco, e ritrovi la pista dai
            rami spezzati all'altezza del tetto di un carro.
          effetti: { profondita.caserma-strada-del-fango: 1 }
        fallimento:
          titolo: Il fango liscio
          testo: |
            Dopo il temporale la pista è sparita sotto un fango liscio come un
            lenzuolo, e giri per un'ora prima di capire che segui le tue impronte.
          effetti: { tormento: 1 }

      - testo: "Aspettare che Hagra trovi la strada"
        descrizione: "Hagra annusa l'aria e guarda le colline invece del fango."
        quando: [caserma.guida == 1]
        esito:
          titolo: Le colline
          testo: |
            Hagra guarda le colline contando sulle dita e va in diagonale sotto la
            pioggia, finché ritrovate i solchi dove lei li aspettava. «I carri
            vanno dove la strada è dura, eh» dice.
          effetti: { profondita.caserma-strada-del-fango: 1 }

  # ------------------------------------------------------------ 1 · il guado e i canneti
  - id: caserma-fango-il-guado
    immagine: ambientazione/palude-acquanera
    titolo: Il Guado di Pietra
    sommario: "Il fiume delle colline si passa su una fila di pietre piatte, e su una c'è una macchia scura."
    luogo: La strada del fango, il Guado di Pietra
    area: caserma-strada-del-fango
    ripetibile: true
    requisiti: [fazione.caserma == 11, profondita.caserma-strada-del-fango == 1]
    testo: |
      Il fiume giallo di fango si passa su una fila di pietre piatte. Sulla
      quarta c'è una macchia scura, e sulla riva opposta, fra le canne, il
      corpo di un cane da presa con una zampa storta.

      {armi-da-distanza Media} Il carro ha guadato più a valle, dove l'acqua
      è bassa, e là le ruote hanno lasciato due tagli nella riva.
    opzioni:
      - testo: "Passare sulle pietre"
        descrizione: "Pietra dopo pietra, con l'acqua in mezzo, e la quarta è sporca di sangue."
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Media }
        successo:
          titolo: Le pietre piatte
          testo: |
            Passi con le braccia larghe, mettendo il piede accanto alla macchia
            scura, e il cane fra le canne ti guarda passare con gli occhi aperti.
          effetti: { profondita.caserma-strada-del-fango: 1 }
        fallimento:
          titolo: La quarta pietra
          testo: |
            Sulla quarta pietra il sangue secco scivola, e la corrente ti riporta
            per venti passi verso la riva da cui eri partito.
          effetti: { ferite: 1 }

      - testo: "Guadare dove è passato il carro"
        descrizione: "Più a valle l'acqua è bassa e il fondo duro, e ci si bagna soltanto."
        prova: { attributo: mentale, abilita: [natura, percezione], difficolta: Media }
        successo:
          titolo: I tagli nella riva
          testo: |
            Guadi dove le ruote hanno tagliato la riva, con l'acqua alle
            ginocchia. Dall'altra parte, fra le orme dei cani, ce n'è una che
            strascica, perché uno adesso zoppica.
          effetti: { profondita.caserma-strada-del-fango: 1 }
        fallimento:
          titolo: Il fondo molle
          testo: |
            Guadi nel punto sbagliato e il fondo di fango ti tiene un piede mentre
            l'acqua sale, finché lo liberi lasciandoci lo stivale.
          effetti: { ferite: 0.5 }

      - testo: "Passare il guado al modo dei clan"
        descrizione: "Hagra dice che c'è un modo di passare il guado che si insegna ai bambini dei clan."
        quando: [caserma.guida == 1]
        esito:
          titolo: Il passo dei clan
          testo: |
            Hagra ti fa legare gli stivali al collo ed entra in acqua di traverso
            alla corrente, con la lancia piantata a monte come un terzo piede, e
            tu metti i piedi dove li mette lei.
          effetti: { profondita.caserma-strada-del-fango: 1 }

      - testo: "Cercare un passaggio più a monte"
        descrizione: "A monte il fiume diventa un torrente che si salta."
        costo: 2
        esito:
          titolo: A monte
          testo: |
            Risali il fiume per un'ora finché diventa un torrente fra due sassi.
            Hai perso mezza giornata, e quando ripassi il cane fra le canne è
            ancora lì.
          effetti: { profondita.caserma-strada-del-fango: 1 }

  - id: caserma-fango-i-canneti
    immagine: ambientazione/palude-acquanera
    titolo: I canneti
    sommario: "La pista attraversa un canneto alto più di un uomo, dove qualcosa si muove contro il vento."
    luogo: La strada del fango, i canneti della palude
    area: caserma-strada-del-fango
    ripetibile: true
    requisiti: [fazione.caserma == 11, profondita.caserma-strada-del-fango == 1]
    testo: |
      Nel canneto la luce è verde e le canne si piegano tutte sotto il vento
      della palude, tranne un gruppo, a una ventina di passi dalla pista,
      che si piega dalla parte opposta.

      {furtivita Media} Qualcuno è accucciato lì dentro e sta fermo, anche
      se le canne intorno a lui non ci riescono.
    opzioni:
      - testo: "Andare a vedere chi c'è"
        descrizione: "Venti passi fra le canne, piano, per trovarlo prima che trovi te."
        prova: { attributo: fisico, abilita: furtivita, difficolta: Media }
        successo:
          titolo: Il ragazzo
          testo: |
            Fra le canne c'è un ragazzo magro come un ramo, con una corda segata
            ai polsi, scappato dal carro la seconda notte. Nella gabbia sono
            rimasti in quattro, dice, più una donna con un mestolo. Gli dai il tuo
            pane e la strada per la città.
          effetti: { profondita.caserma-strada-del-fango: 1, informazioni.voce: 1 }
        fallimento:
          titolo: Il ragazzo che scappa
          testo: |
            Le canne frusciano sotto i tuoi stivali, e chi c'era scappa verso la
            palude con una corda che gli penzola da un polso.
          effetti: { ferite: 0.5 }

      - testo: "Chiamarlo da lontano"
        descrizione: "Chi scappa ha più paura di te che tu di lui, e basta una voce gentile."
        prova: { attributo: sociale, abilita: [empatia, persuasione], difficolta: Media }
        successo:
          titolo: La voce
          testo: |
            Dopo un tempo lungo esce un ragazzo magro con una corda segata ai
            polsi. Nella gabbia sono rimasti in quattro, dice, più una donna che
            gli ha segato la corda con il mestolo.
          effetti: { profondita.caserma-strada-del-fango: 1, informazioni.voce: 1 }
        fallimento:
          titolo: Il silenzio delle canne
          testo: |
            Chiami, e le canne smettono di muoversi. Quando vai a vedere c'è
            soltanto un pezzo di corda segata nel fango.
          effetti: { tormento: 1 }

      - testo: "Tirare dritto per la pista"
        descrizione: "Chiunque sia, il carro è più avanti."
        costo: 2
        esito:
          titolo: La pista
          testo: |
            Tiri dritto con la mano sull'elsa finché il canneto non finisce, e
            alle tue spalle le canne si piegano dalla parte sbagliata un'ultima
            volta.
          effetti: { profondita.caserma-strada-del-fango: 1 }

  # ------------------------------------------------------------ 1–2 · il pantano
  - id: caserma-fango-il-pantano
    immagine: ambientazione/palude-acquanera
    titolo: Il pantano
    sommario: "Per un tratto la pista sparisce sotto un pantano nero che il carro ha passato e tu devi passare a piedi."
    luogo: La strada del fango, il pantano
    area: caserma-strada-del-fango
    ripetibile: true
    requisiti: [fazione.caserma == 11, profondita.caserma-strada-del-fango >= 1, profondita.caserma-strada-del-fango <= 2]
    testo: |
      Qui la strada si merita il nome. Per un tiro d'arco la pista sparisce
      sotto un pantano nero che ribolle piano, attraversato dalle assi mezze
      affondate che i cacciatori hanno buttato sotto le ruote.

      {natura Media} Dove ribolle il fango è profondo, mentre le assi stanno
      dove il fondo regge.
    opzioni:
      - testo: "Passare sulle assi dei cacciatori"
        descrizione: "Le assi sono mezze affondate e storte, e vanno passate senza fermarsi."
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Media }
        successo:
          titolo: Le assi
          testo: |
            Passi da un'asse all'altra senza fermarti, perché se ti fermi l'asse affonda,
            e arrivi dall'altra parte con gli stivali pesanti come secchi.
          effetti: { profondita.caserma-strada-del-fango: 1 }
        fallimento:
          titolo: Fino alla vita
          testo: |
            Un'asse si gira sotto il piede e affondi fino alla vita. Ne esci a
            forza di braccia, con un odore addosso che ti accompagnerà per giorni.
          effetti: { ferite: 1 }

      - testo: "Girare dove il fango non ribolle"
        descrizione: "Il fondo che regge si riconosce, se lo si sa leggere."
        prova: { attributo: mentale, abilita: natura, difficolta: Media }
        successo:
          titolo: Il fondo duro
          testo: |
            Giri largo seguendo i giunchi, che vogliono il fondo duro, e ci metti
            il doppio, con il fango soltanto alle caviglie.
          effetti: { profondita.caserma-strada-del-fango: 1 }
        fallimento:
          titolo: La bolla
          testo: |
            Una chiazza di giunchi che giunchi non sono ti cede sotto i piedi con
            una bolla di gas che ti scoppia in faccia.
          effetti: { ferite: 0.5, tormento: 1 }

      - testo: "Tagliare canne e farsi un passaggio"
        descrizione: "Con un fascio di canne sotto i piedi si galleggia un poco, se si ha tempo."
        costo: 2
        esito:
          titolo: Il fascio di canne
          testo: |
            Tagli canne per un'ora, le leghi in fasci e ci passi sopra a quattro
            zampe, con le mani piene di tagli sottili.
          effetti: { profondita.caserma-strada-del-fango: 1 }

  # ------------------------------------------------------------ 2 · il bivacco e i cani
  - id: caserma-fango-il-bivacco
    immagine: ambientazione/palude-acquanera
    titolo: Il bivacco dei cacciatori
    sommario: "Il fuoco dei cacciatori è ancora tiepido, e qui il carro si è fermato una notte intera."
    luogo: La strada del fango, il bivacco dei cacciatori
    area: caserma-strada-del-fango
    ripetibile: true
    requisiti: [fazione.caserma == 11, profondita.caserma-strada-del-fango == 2]
    testo: |
      In una radura fra due ontani c'è la cenere ancora tiepida di un fuoco,
      con intorno le impronte di tre uomini e dei cani e il segno delle
      ruote dove il carro ha passato la notte.

      {percezione Facile} Sulla corteccia di un ontano, all'altezza del
      fondo di una gabbia, qualcuno ha inciso con un'unghia due righe e un
      cerchio, che a Ghoran vuol dire *aspetta*.
    opzioni:
      - testo: "Leggere le tracce del bivacco"
        descrizione: "Le tracce dicono quanti erano e quando sono partiti, a chi le sa leggere."
        prova: { attributo: mentale, abilita: [percezione, natura], difficolta: Media }
        successo:
          titolo: Mezza giornata
          testo: |
            Sono partiti all'alba, con un cavallo che zoppica e i due cani
            rimasti. Prima di notte li avrai raggiunti, se non ti fermi.
          effetti: { profondita.caserma-strada-del-fango: 1 }
        fallimento:
          titolo: Le ossa di pollo
          testo: |
            Giri intorno al fuoco finché ti accorgi che le impronte che segui sono
            le tue.
          effetti: { tormento: 1 }

      - testo: "Mangiare e riposare sulla cenere tiepida"
        descrizione: "Dopo due giorni di fango, un'ora accanto a un fuoco ti rimette in piedi."
        prova: { attributo: fisico, abilita: resistenza, difficolta: Facile }
        successo:
          titolo: La cenere
          testo: |
            Ravvivi la cenere con due rami e mangi il pane duro della bisaccia, e
            quando riparti le gambe sono di nuovo tue.
          effetti: { profondita.caserma-strada-del-fango: 1, ferite: -0.5 }
        fallimento:
          titolo: Il sonno
          testo: |
            Ti siedi un momento accanto alla cenere e ti svegli che il sole è
            calato di un palmo, con il collo che fa male.
          effetti: { tormento: 1 }

      - testo: "Chiedere a Hagra del segno sull'ontano"
        descrizione: "Due righe sopra un cerchio, che Hagra legge come una parola."
        quando: [caserma.guida == 1]
        esito:
          titolo: Aspetta
          testo: |
            Hagra ci passa sopra il pollice. «L'ha fatto qualcuno dei recinti, per
            chi viene dietro» dice. «Vuol dire aspetta, eh.» Poi si toglie la
            resina di bocca e la attacca sul segno.
          effetti: { profondita.caserma-strada-del-fango: 1 }

  - id: caserma-fango-i-cani
    immagine: icone/hound
    titolo: I cani da presa
    sommario: "Il Pesatore ha lasciato indietro i cani, per vedere chi lo segue."
    luogo: La strada del fango, un argine
    area: caserma-strada-del-fango
    ripetibile: true
    requisiti: [fazione.caserma == 11, profondita.caserma-strada-del-fango == 2]
    testo: |
      Sull'argine fra la pista e la palude due cani da presa con le orecchie
      tagliate corte sono legati a un paletto piantato nel fango. Non
      abbaiano, e si alzano insieme tendendo la catena.

      {addestrare-animali Media} La catena è lunga e il paletto è piantato
      male. A Ghoran ai cani da presa levano l'abbaiare da cuccioli, insieme
      alla voglia di giocare.
    opzioni:
      - testo: "Affrontare i cani"
        descrizione: "Due cani da presa con il paletto piantato male, che arriveranno insieme."
        combattimento: caserma-i-cani-da-presa
        vittoria:
          titolo: La catena
          testo: |
            Il primo cane ti prende la manica finché non lo colpisci, e il secondo
            resta impigliato nella sua catena.
          effetti: { profondita.caserma-strada-del-fango: 1 }
        sconfitta:
          titolo: Il morso
          testo: |
            I cani ti stendono nel fango sotto il loro peso, finché scalci via il
            paletto e la catena li trascina giù dall'argine nella palude.
          effetti: { tormento: 1 }

      - testo: "Girare lontano dalla catena"
        descrizione: "La catena è lunga, ma basta passare oltre il cerchio dei denti."
        prova: { attributo: fisico, abilita: [furtivita, atletica], difficolta: Media }
        successo:
          titolo: Il cerchio
          testo: |
            Scendi nell'acqua fino alle ginocchia e passi oltre il cerchio della
            catena, con i cani che tirano fino a strozzarsi.
          effetti: { profondita.caserma-strada-del-fango: 1 }
        fallimento:
          titolo: Il paletto
          testo: |
            Il paletto si sfila dal fango e la catena ti arriva addosso con i cani
            attaccati, e ti salvi in acqua con un morso sulla caviglia.
          effetti: { ferite: 1 }

      - testo: "Calmarli con la voce"
        descrizione: "I cani da presa obbediscono a una voce sola, e si può provare a imitarla."
        prova: { attributo: sociale, abilita: addestrare-animali, difficolta: Media }
        successo:
          titolo: La voce del padrone
          testo: |
            Parli piano, con la voce bassa e uguale dei cacciatori, finché i cani
            si siedono e ti lasciano passare a un braccio dai denti.
          pe: { addestrare-animali: 5 }
          effetti: { profondita.caserma-strada-del-fango: 1 }
        fallimento:
          titolo: La voce sbagliata
          testo: |
            La voce ti esce troppo alta e i cani la prendono per una sfida, e tu
            torni indietro un passo alla volta senza voltare le spalle.
          effetti: { tormento: 1 }

  # ------------------------------------------------------------ 2–3 · le tracce
  - id: caserma-fango-le-tracce
    immagine: ambientazione/palude-acquanera
    titolo: Le tracce che si dividono
    sommario: "Le orme dei cani si dividono in due, e i solchi del carro spariscono sulla ghiaia."
    luogo: La strada del fango, la ghiaia
    area: caserma-strada-del-fango
    ripetibile: true
    requisiti: [fazione.caserma == 11, profondita.caserma-strada-del-fango >= 2, profondita.caserma-strada-del-fango <= 3]
    testo: |
      Sul dosso di ghiaia i solchi del carro spariscono, e le orme fresche
      dei cani si dividono in due file, una verso le colline e l'altra verso
      la palude.

      {natura Media} Un carro carico sulla ghiaia rovescia comunque i sassi
      con la parte umida in su, se li guardi con il sole basso.

      {origine figlio-del-circolo} Al Circolo ti hanno insegnato che un cane
      alla catena affonda di più le unghie davanti, e una delle due file non
      le ha.
    opzioni:
      - testo: "Leggere i sassi rovesciati"
        descrizione: "Sulla ghiaia il carro ha lasciato sassi rovesciati, con la parte umida in su."
        prova: { attributo: mentale, abilita: [natura, percezione], difficolta: Media }
        successo:
          titolo: Il lato umido
          testo: |
            Con il sole basso alle spalle i sassi rovesciati luccicano in fila
            verso le colline, dove oltre il dosso il fumo diventa una colonna
            sottile.
          effetti: { profondita.caserma-strada-del-fango: 1 }
        fallimento:
          titolo: La palude
          testo: |
            Segui le orme verso la palude e dopo mezz'ora trovi soltanto il
            paletto di un cane.
          effetti: { tormento: 1 }

      - testo: "Seguire le orme dei cani verso le colline"
        descrizione: "Tirare a indovinare, ma a passo svelto."
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Media }
        successo:
          titolo: La colonna di fumo
          testo: |
            Corri sulle orme dei cani, e oltre il dosso vedi la colonna di fumo e
            sotto la sagoma di un carro con una gabbia.
          effetti: { profondita.caserma-strada-del-fango: 1 }
        fallimento:
          titolo: La salita
          testo: |
            A metà salita le gambe ti diventano di legno, e in cima le orme girano
            indietro verso la palude.
          effetti: { ferite: 0.5 }

      - testo: "Leggere le unghie dei cani"
        descrizione: "Al Circolo un cane alla catena e un cane libero si distinguono dalle unghie."
        quando: [origine.figlio-del-circolo >= 1]
        prova: { attributo: mentale, abilita: natura, difficolta: Facile }
        successo:
          titolo: Le unghie
          testo: |
            Leggi le orme unghia per unghia, come ti hanno insegnato nel Bosco di
            Velthar, e prendi la fila che tira la catena verso le colline, dove
            oltre il dosso c'è il carro.

            {origine figlio-del-circolo} Il maestro del Circolo te lo faceva fare
            sulle orme delle volpi, e non pensavi che sarebbe servito per gli
            uomini.
          pe: { natura: 5 }
          effetti: { profondita.caserma-strada-del-fango: 1 }
        fallimento:
          titolo: Le unghie sbagliate
          testo: |
            Le unghie nella ghiaia sono confuse e prendi la fila che ti porta al
            paletto di un cane nella palude.
          effetti: { tormento: 1 }

      - testo: "Aspettare il buio e cercare il fuoco"
        descrizione: "Di notte un fuoco si vede da lontano, e basta aspettare."
        costo: 2
        esito:
          titolo: Il fuoco nel buio
          testo: |
            Aspetti il buio sulla ghiaia, con il freddo che sale dalla palude,
            finché sulle colline si accende un punto arancione verso cui ti
            avvicini piano.
          effetti: { profondita.caserma-strada-del-fango: 1 }

  # ------------------------------------------------------------ 3 · la bilancia
  - id: caserma-fango-la-bilancia
    immagine: ambientazione/ghoran
    titolo: La bilancia nel fango
    sommario: "A cento passi dal carro, sul ciglio della pista, c'è una bilancia da grano piantata nel fango."
    luogo: La strada del fango, a cento passi dal carro
    area: caserma-strada-del-fango
    ripetibile: true
    requisiti: [fazione.caserma == 11, profondita.caserma-strada-del-fango == 3]
    testo: |
      A cento passi dal carro c'è una bilancia da grano piantata nel fango,
      i piatti di ferro consumati al centro e una pila di pesi di bronzo
      numerati sotto. Sulla collina, accanto al fuoco, un uomo grosso è
      seduto su un ceppo vicino al carro con la gabbia.

      {politica-ed-economia Media} La bilancia non serve a pesare. L'ha
      piantata qui perché chi arriva la veda prima di vedere lui, e capisca
      con chi ha a che fare.

      {origine fuggiasco-di-ghoran} Le gambe ti si fermano da sole a cento
      passi dalla bilancia, dove si fermavano allora.
    opzioni:
      - testo: "Avvicinarsi al carro dal lato della palude"
        descrizione: "Dal lato della palude il fuoco acceca chi guarda verso il buio, se passi senza farti sentire."
        prova: { attributo: fisico, abilita: furtivita, difficolta: Media }
        successo:
          titolo: Dal buio
          testo: |
            Giri dal lato della palude fino a sentire le voci, e nella gabbia
            Brina muove il mestolo di un dito per dirti che ti ha visto.
          effetti: { profondita.caserma-strada-del-fango: 1 }
        fallimento:
          titolo: Il ramo
          testo: |
            Un ramo secco ti si spezza sotto il piede e un cacciatore si alza con
            la balestra, e torni strisciando fino alla bilancia.
          effetti: { ferite: 0.5 }

      - testo: "Avvicinarsi a viso aperto, con l'ordine in mano"
        descrizione: "Qui un ordine della Caserma vale poco, eppure il Pesatore rispetta le carte."
        prova: { attributo: sociale, abilita: [intimidire, galateo], difficolta: Media }
        successo:
          titolo: L'ordine
          testo: |
            Cammini verso il fuoco con l'ordine aperto in mano, e il Pesatore,
            seduto, ti fa segno di sederti dall'altra parte del fuoco come a un
            tavolo di trattative.
          effetti: { profondita.caserma-strada-del-fango: 1 }
        fallimento:
          titolo: La balestra
          testo: |
            A metà strada un dardo di balestra si pianta nel fango ai tuoi piedi,
            e torni alla bilancia con le mani alzate senza che il Pesatore si sia
            girato.
          effetti: { tormento: 1 }

      - testo: "Chiedere a Hagra di andare avanti da sola"
        descrizione: "Una donna dei clan al fuoco del Pesatore è una visita, un mantello scarlatto è un attacco."
        quando: [caserma.guida == 1]
        esito:
          titolo: La visita
          testo: |
            Hagra va avanti a mani aperte e il Pesatore la saluta con il nome del
            suo clan, lei risponde con quello del Guado e ti fa segno, e arrivi al
            fuoco dietro di lei come un parente.
          effetti: { profondita.caserma-strada-del-fango: 1 }

  # ------------------------------------------------------------ il cuore · il carro-gabbia
  - id: caserma-fango-il-carro-gabbia
    immagine: ambientazione/ghoran
    titolo: Il carro-gabbia
    sommario: "Accanto al fuoco, sulla collina, il Pesatore aspetta seduto su un ceppo, e nella gabbia c'è Brina."
    luogo: La strada del fango, il carro del Pesatore
    area: caserma-strada-del-fango
    requisiti: [fazione.caserma == 11, profondita.caserma-strada-del-fango >= 4]
    testo: |
      Nella gabbia di legno sul pianale del carro ci sono cinque persone con
      i polsi legati, fra cui Brina. Il Pesatore sta seduto su un ceppo
      accanto al fuoco con un randello cerchiato di ferro sulle ginocchia, e
      con lui c'è un cacciatore con la balestra e una rete zavorrata sulla
      spalla. L'altro cacciatore è ancora nella palude a cercarti.

      «La legge della tua città finisce alla pietra» dice il Pesatore, con
      la sua voce calma. «Qui c'è la mia.» Batte il randello sul ceppo, una
      volta. «Abbiamo tutti e due un foglio firmato dal tuo sceriffo. Uno
      dei due vale di più, e lo sappiamo.»

      {armi-da-mischia Difficile} Tiene il randello basso e aspetta che ti
      muova tu per primo, come si aspetta che un piatto della bilancia si
      abbassi.
    opzioni:
      - testo: "Affrontare il Pesatore e il suo cacciatore"
        descrizione: "Il Pesatore è grosso e paziente, il cacciatore ha la rete, e hanno mangiato."
        combattimento: caserma-il-pesatore
        vittoria:
          titolo: Il randello nel fango
          testo: |
            La rete ti prende alle gambe una volta, e la seconda la tagli prima
            che si chiuda. Il Pesatore combatte come pesa, senza nessuna fretta,
            finché perde l'equilibrio tutto insieme come un sacco. Dal fango ti
            guarda senza rabbia. «Allora vale di più il tuo» dice.
          segue: caserma-fango-il-registro
        sconfitta:
          titolo: La rete zavorrata
          testo: |
            La rete zavorrata ti stende nel fango e il randello del Pesatore fa il
            resto, con calma. Ti risvegli all'alba sulla pista, con l'ordine
            piegato in quattro nella tasca.
          effetti: { tormento: 1 }
          vai: citta-bassa

      - testo: "Lasciare che Hagra contesti il sigillo"
        descrizione: "Hagra può dichiarare davanti a tutti che per il suo clan la cera verde del Guado non vale."
        quando: [caserma.guida == 1]
        prova: { attributo: sociale, abilita: intimidire, difficolta: Difficile }
        successo:
          titolo: Il sigillo contestato
          testo: |
            Hagra si mette fra te e il fuoco e dice ad alta voce che per il suo
            clan il sigillo del Guado non vale niente. Il Pesatore conta le teste
            come si contano i sacchi, poi se ne va nel buio con il suo uomo,
            lasciando il carro.

            {conoscenze-della-strada Media} Hagra ha messo il suo clan contro il
            Guado per te, e a Ghoran il conto arriverà a nome tuo.
          imposta: { caserma.hagra: 1 }
          segue: caserma-fango-il-registro
        fallimento:
          titolo: Lo sguardo del Pesatore
          testo: |
            Il Pesatore chiede a Hagra quanto le hai promesso, e quando lei esita
            il cacciatore alza la balestra. La mattina dopo il carro non c'è più.
          effetti: { ferite: 1 }
          vai: citta-bassa

      - testo: "Mostrargli il cavillo della clausola"
        descrizione: "La clausola parla di chi fuggirà, al futuro, mentre Brina era alla casa blu da prima."
        quando: [caserma.cavillo == 1]
        prova: { attributo: sociale, abilita: [persuasione, galateo], difficolta: Difficile }
        successo:
          titolo: Al futuro
          testo: |
            Gli leggi il suo foglio ad alta voce fino al verbo al futuro, e gli
            dici quando Brina è arrivata alla casa blu. Il Pesatore ascolta con la
            testa inclinata, poi apre la gabbia e fa scendere soltanto Brina,
            perché le carte, dice, sono carte.
          segue: caserma-fango-il-registro
        fallimento:
          titolo: Le carte
          testo: |
            Il Pesatore ti risponde che le carte le scrive chi ha i cacciatori, e
            ti guarda come un sacco che non vale la pena pesare.
          effetti: { tormento: 1 }

      - testo: "Salire sulla bilancia al posto di Brina"
        descrizione: "Il Pesatore ti ha riconosciuto e ti vuole al posto di Brina. Quando ti voltano le spalle, si può scendere."
        quando: [origine.fuggiasco-di-ghoran >= 1]
        prova: { attributo: mentale, abilita: resilienza, difficolta: Difficile }
        successo:
          titolo: Il piatto della bilancia
          testo: |
            Sali sul piatto di ferro e il Pesatore mette i pesi sull'altro, uno
            per uno, mentre Brina scende dalla gabbia e corre giù per la pista.
            Quando il cacciatore si volta a guardarla scendi e gli strappi la
            balestra, e il Pesatore resta con un peso in mano e niente da pesare.

            {origine fuggiasco-di-ghoran} Le gambe ti tremavano come la prima
            volta, ma questa volta dal piatto sei sceso tu.
          pe: { resilienza: 5 }
          segue: caserma-fango-il-registro
        fallimento:
          titolo: Come allora
          testo: |
            Il ferro sotto i piedi ti riporta indietro di anni e le gambe non si
            muovono più, finché il Pesatore ti spinge giù con il randello. La
            merce che scappa due volte, dice, non vale niente.
          effetti: { tormento: 1 }
          vai: citta-bassa

      - testo: "Tornare in città"
        descrizione: "Il Pesatore è forte e riposato, e si può tornare a prenderlo prima che il carro arrivi a Ghoran."
        costo: 0
        esito:
          titolo: La strada indietro
          testo: |
            Torni indietro nel buio con il fuoco del Pesatore acceso alle spalle,
            e all'alba lasci una moneta nella ciotola della pietra miliare.
          vai: citta-bassa

  - id: caserma-fango-il-registro
    immagine: ambientazione/ghoran
    titolo: Il registro del Pesatore
    tipo: seguito
    luogo: La strada del fango, il carro del Pesatore
    area: caserma-strada-del-fango
    requisiti: [fazione.caserma == 11]
    testo: |
      Con la chiave del Pesatore apri la gabbia, e Brina scende per ultima,
      con il mestolo che non ha mollato nemmeno per dormire, scusandosi per
      la zuppa della casa blu, che sarà andata a male.

      Sul pianale c'è il quaderno delle vendite, con accanto a ogni peso il
      segno del clan che ha comprato. Una riga di otto anni fa ti ferma il
      dito, *Due figli del naso rotto, al clan del Guado*.

      {accademiche Media} Otto anni fa Borso è arrivato in città con il naso
      rotto e nient'altro, e alla Caserma ha cominciato a risparmiare.
    opzioni:
      - testo: "Riportare Brina in città"
        descrizione: "Sei giorni di fango all'indietro, con i prigionieri liberati."
        quando: [caserma.anticipo != 1]
        esito:
          titolo: Luogotenente
          testo: |
            Dopo sei giorni, alla pietra miliare, Brina guarda la torre incisa e
            passa. Galdrick vi aspetta sul portone della Caserma, e quando vede
            Brina con il mestolo si gira verso il cortile per un poco. Poi ti
            nomina luogotenente davanti alla Guardia schierata, e il furiere ti
            consegna una cotta di maglia con gli anelli doppi e la chiave
            dell'archivio dei rapporti.
          pe: { resilienza: 5 }
          effetti: { fazione.caserma: 1, oggetto.caserma-cotta-della-caserma: 1, oggetto.caserma-registro-del-pesatore: 1, monete: 60, informazioni.segreto: 1 }
          almeno: { rep.caserma: 8 }
          vai: citta-bassa

      - testo: "Riportare Brina in città"
        descrizione: "Sei giorni di fango all'indietro, con i prigionieri liberati, e in Caserma ti aspetta una ricevuta."
        quando: [caserma.anticipo == 1]
        esito:
          titolo: Luogotenente
          testo: |
            Dopo sei giorni, alla pietra miliare, Brina guarda la torre incisa e
            passa. Galdrick vi aspetta sul portone della Caserma, e quando vede
            Brina si gira verso il cortile. Poi ti nomina luogotenente davanti
