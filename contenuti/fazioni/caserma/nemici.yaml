# I nemici della quest della Caserma, tarati con una simulazione (5 ottobre 2026, script privato sullo stesso motore
# di npm run simula): i tagliagole e i cani come gli scagnozzi degli Scuri (Medio per un personaggio nuovo forte in
# combattimento); il Pesatore con il suo cacciatore poco più duro dei tenenti di Vesh, la boss battle di fine capitolo;
# la cantina del Mulino Nero più dura ancora, e con due disertori convinti (caserma-la-cantina-ridotta) come i tenenti.
# Nihali Cuzan è quello di nemici/pelle.yaml.
nemici:
  - id: caserma-tagliagole
    immagine: fazioni/scuri
    nome: Tagliagole dei sottoponti
    descrizione: "Un uomo magro con il coltello legato al polso da un laccio, per non perderlo cadendo. Si muove sulle travi a quattro zampe quando gli conviene."
    attacco: 3
    difesa: 2
    difesaMentale: 2
    pf: 9
    danno: 2
    iniziativa: 3
    puoFuggire: true

  - id: caserma-cane-da-presa
    immagine: icone/hound
    nome: Cane da presa
    descrizione: "Un cane dei recinti di Ghoran con il petto largo e le orecchie tagliate corte, addestrato a mordere senza abbaiare prima."
    attacco: 3
    difesa: 2
    difesaMentale: 1
    pf: 9
    danno: 2
    iniziativa: 4
    tratti: [animale]

  - id: caserma-cacciatore-di-ghoran
    immagine: ambientazione/ghoran
    nome: Cacciatore del Pesatore
    descrizione: "Uno degli uomini del Pesatore, con la balestra a tracolla e una rete zavorrata arrotolata sulla spalla. Mira alle gambe, perché la merce si paga intera."
    attacco: 3
    difesa: 2
    difesaMentale: 2
    pf: 5
    danno: 2
    iniziativa: 3

  - id: caserma-ulmo-strass
    immagine: ambientazione/ghoran
    nome: Ulmo Strass, il Pesatore
    descrizione: "Un uomo grosso e calmo, con le mani da mugnaio e un randello cerchiato di ferro. Combatte come pesa, aspettando senza fretta che sia l'altro a sbilanciarsi."
    attacco: 5
    difesa: 3
    difesaMentale: 3
    pf: 12
    danno: 4
    riduzione: 3
    iniziativa: 2

  - id: caserma-disertore
    immagine: icone/cape
    nome: Disertore della Guardia
    descrizione: "Un miliziano con il mantello scarlatto rovesciato, la fodera grigia di fuori. Ha la spada d'ordinanza e la paura di chi sa come finisce un processo per diserzione."
    attacco: 3
    difesa: 3
    difesaMentale: 2
    pf: 6
    danno: 2
    riduzione: 2
    iniziativa: 2
    puoFuggire: true

  - id: caserma-balestriere-degli-scuri
    immagine: fazioni/scuri
    nome: Balestriere degli Scuri
    descrizione: "Uno degli ultimi uomini di Vesh, che dopo la Pignatta è rimasto senza paga. Tira dalla balestra leggera e ricarica senza guardare le mani."
    attacco: 4
    difesa: 2
    difesaMentale: 2
    pf: 10
    danno: 3
    iniziativa: 3
    puoFuggire: true

  - id: caserma-brando-selli
    immagine: icone/cape
    nome: Brando Selli
    descrizione: "Sergente dei Ponti con vent'anni di servizio, che tiene bassa la spada d'ordinanza e porta il mantello rovesciato. Para come insegnano in cortile, e conosce tutte le parate che conosci tu."
    attacco: 5
    difesa: 3
    difesaMentale: 3
    pf: 17
    danno: 3
    riduzione: 1
    iniziativa: 3

scontri:
  - { id: caserma-un-tagliagole, nome: "Un tagliagole sulle travi", nemici: [caserma-tagliagole], feriteSconfitta: 2 }
  - { id: caserma-la-rete, nome: "I tagliagole alla rete", nemici: [caserma-tagliagole, caserma-tagliagole], feriteSconfitta: 2 }
  - { id: caserma-i-cani-da-presa, nome: "I cani da presa", nemici: [caserma-cane-da-presa, caserma-cane-da-presa], feriteSconfitta: 2 }
  - { id: caserma-il-pesatore, nome: "Il Pesatore e il suo cacciatore", nemici: [caserma-ulmo-strass, caserma-cacciatore-di-ghoran], feriteSconfitta: 4 }
  - { id: caserma-i-balestrieri, nome: "I balestrieri nella sala delle macine", nemici: [caserma-balestriere-degli-scuri, caserma-disertore], feriteSconfitta: 3 }
  - { id: caserma-la-cantina, nome: "Brando Selli e Nihali Cuzan", nemici: [caserma-brando-selli, nihali-cuzan, caserma-disertore], feriteSconfitta: 4, rinforzo: { pf: 2, danno: 1, riduzione: 2, solo: [nihali-cuzan] } }
  - { id: caserma-la-cantina-ridotta, nome: "Brando Selli e Nihali Cuzan", nemici: [caserma-brando-selli, nihali-cuzan], feriteSconfitta: 4, rinforzo: { pf: 2, danno: 1, riduzione: 2, solo: [nihali-cuzan] } }
