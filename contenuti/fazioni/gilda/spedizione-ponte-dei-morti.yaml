# Sotto il Ponte dei Morti, spedizione del passo 8 della quest della Gilda (fazione.gilda == 7).
# Ci si entra dalla botola del gabbiotto (`gilda-la-botola-del-gabbiotto`, passi-2.yaml). Ritorno ai Ponti, soglia 4.
# Le stanze vanno in fasce di profondità, e una stanza superata non ricompare nella stessa visita:
#   0 la botola e le scalette (le scale di corda; la nebbia sotto le assi, che vale anche a 1);
#   1 le passerelle di servizio (i Lunghi; le lanterne dei Raschiatori; l'esattore degli Scuri, solo con
#     pista.pelle < 6, che vale anche a 2);
#   2 i magazzini appesi (le botti col segno raschiato; la fune segata; il balestriere di guardia, che vale anche a 3);
#   3 la campata cieca.
# Ogni stanza ha una via lunga che costa due rintocchi e fa avanzare comunque.
# Il cuore a 4 è la casa appesa di Maedric. Con maedric <= 1 (fuggito) Maedric è tornato a riprendersi i libri:
# combattimento Difficile con due balestrieri, o trattativa (Persuasione, Difficile). Con maedric >= 2 (in cella o
# morto) la casa la tiene il balestriere con la toppa sulla fodera: combattimento o Empatia (Media). Chi perde torna
# sui Ponti e può riprovare. Il seguito `gilda-sottoponti-il-secondo-libro` chiude il passo: il libro dei pagamenti,
# la lanterna cieca di Maedric e il bottino del magazzino appeso (rep.scuri -1 se gli Scuri ci sono ancora).
aree:
  - id: gilda-sotto-il-ponte-dei-morti
    immagine: ambientazione/ponte-dei-morti
    nome: Sotto il Ponte dei Morti
    sommario: "In fondo a una campata senza lanterne c'è la casa di Maedric Holl."
    spedizione: { ritorno: ponti-sospesi, soglia: 4, stanze: 3 }
    testo: |
      Sotto le assi del Ponte dei Morti la nebbia della Cicatrice si addensa, e la luce delle lanterne dei
      Raschiatori arriva dall'alto a macchie gialle. Fra i piloni corrono passerelle di servizio con scale di
      corda e gabbie da carico, e il legno è nero di catrame e bagnato di nebbia. Più in basso ci sono
      magazzini di assi sospesi nel vuoto e chiusi a lucchetto. Le catene che li reggono sono rosse di
      ruggine, e i lucchetti sono gli unici pezzi di ferro ancora lucidi. Fra le passerelle non vola un
      gabbiano.

      Qui sotto vive gente che i registri della Gilda non contano. I Lunghi stanno sulle passerelle da sempre,
      e i ragazzi della corda salgono dalla Città Bassa.

# La musica della spedizione (come le altre aree in contenuti/audio.yaml).
colonna:
  - { contesto: area, id: gilda-sotto-il-ponte-dei-morti, musica: the-light-that-failed, ambiente: rain-in-town }

storylet:
  # ------------------------------------------------------------ 0 · la botola e le scalette
  - id: gilda-sottoponti-le-scalette
    immagine: icone/ladder
    titolo: Le scalette
    sommario: "Dalla botola le scale di corda scendono fino alle prime passerelle. Ai pioli ne mancano parecchi."
    luogo: Sotto il Ponte dei Morti, le scalette
    area: gilda-sotto-il-ponte-dei-morti
    ripetibile: true
    requisiti: [fazione.gilda == 7, profondita.gilda-sotto-il-ponte-dei-morti == 0]
    testo: |
      Dalla passerella sotto la botola partono tre scale di corda che scendono nella nebbia in direzioni
      diverse. Una è nuova e di canapa chiara, con i nodi dei pioli ancora stretti e pelosi di fibre. Le altre
      due sono nere di catrame, e a quella di sinistra manca un piolo ogni tre. Dove mancano restano i monconi
      delle legature, che le mani hanno consumato lisci. In cima a ciascuna c'è un pezzetto di stoffa
      colorata, e quella della scala di sinistra è sbiadita fino al bianco.

      {acrobazia Media} La scala nuova dondola più delle altre perché nessuno l'ha ancora appesantita, mentre
      le vecchie si sono allungate sotto anni di carichi e stanno quasi ferme.

      Dall'alto arriva la voce di Teo Marsan che conta a mezza voce, poi più niente.
    opzioni:
      - testo: "Scendere dalla scala vecchia, quella senza pioli"
        descrizione: "Un piolo ogni tre manca. Nessuno ci sale, e nessuno ti aspetta in fondo."
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Media }
        successo:
          titolo: I pioli che mancano
          testo: |
            Scendi a forza di braccia dove mancano i pioli, con i piedi che cercano il catrame e la nebbia che
            ti bagna la faccia. Il catrame è freddo e ti resta appiccicato ai palmi per tutta la discesa. In
            fondo c'è una passerella vuota, e un cartello di legno inchiodato a un pilone indica due direzioni
            con due frecce che non dicono dove.
          pe: { acrobazia: 3 }
          effetti: { profondita.gilda-sotto-il-ponte-dei-morti: 1 }
        fallimento:
          titolo: Il piolo marcio
          testo: |
            Un piolo si spezza sotto il tuo piede, e resti appes{o|a} alle mani con la nebbia che ti gira
            intorno. Il pezzo di piolo cade nella nebbia e non lo senti arrivare da nessuna parte. Risali fino
            alla botola con le braccia che bruciano, e ti siedi sulla passerella a massaggiarti gli avambracci
            prima di riprovare.
          effetti: { ferite: 0.5 }
      - testo: "Scendere dalla scala nuova, quella di canapa"
        descrizione: "Qualcuno l'ha appesa da poco, e la usa. Magari è proprio quello che cerchi."
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Media }
        successo:
          titolo: La canapa chiara
          testo: |
            Scendi piano, tenendo la scala ferma con le ginocchia perché non dondoli. In fondo trovi una
            passerella con le assi spazzate di recente e una lanterna spenta appesa a un chiodo, ancora
            tiepida. Dallo stoppino sale ancora un filo di fumo che puzza di sego. Chi l'ha spenta è andato
            verso i magazzini, e non da molto.
          pe: { furtivita: 3 }
          effetti: { profondita.gilda-sotto-il-ponte-dei-morti: 1 }
        fallimento:
          titolo: La scala che dondola
          testo: |
            La scala nuova dondola a ogni piolo, e a metà discesa sbatti contro un pilone con la spalla. Il
            rumore rimbomba sotto le assi come un colpo di tamburo. Da sotto a sinistra qualcuno fischia due
            volte nella nebbia, e poi niente. Risali alla botola ad aspettare che si calmi, con la spalla che
            pulsa.
          effetti: { sospetto: 1 }
      - testo: "Aspettare che qualcuno salga e chiedergli la strada"
        descrizione: "Prima o poi da una di queste scale sale qualcuno. Ci vuole pazienza, e la nebbia è fredda."
        costo: 2
        esito:
          titolo: Il ragazzo della corda
          testo: |
            Dopo un'ora sale un ragazzo con una fune a tracolla e un pesce secco in mano. Sale scalzo, e le
            dita dei piedi si chiudono sui pioli come mani. Guarda te e poi la botola, e decide che non sono
            affari suoi. In cambio della tua pazienza ti indica la scala giusta, quella con lo straccio verde,
            e sparisce verso l'alto.
          effetti: { profondita.gilda-sotto-il-ponte-dei-morti: 1 }

  # ------------------------------------------------------------ 0–1 · la nebbia sotto le assi
  - id: gilda-sottoponti-la-nebbia-sotto-le-assi
    immagine: ambientazione/ponte-dei-morti
    titolo: La nebbia sotto le assi
    sommario: "La nebbia si fa così fitta che non vedi la passerella sotto i tuoi piedi. Da qualche parte cigolano le corde."
    luogo: Sotto il Ponte dei Morti, fra i piloni
    area: gilda-sotto-il-ponte-dei-morti
    ripetibile: true
    requisiti: [fazione.gilda == 7, profondita.gilda-sotto-il-ponte-dei-morti <= 1]
    testo: |
      La nebbia sale dalla Cicatrice a ondate e ti arriva al petto, poi sopra la testa, finché la passerella
      sparisce. È fredda e ti lascia sulle labbra un sapore di ferro. Senti il legno bagnato sotto le suole e
      le corde che cigolano da ogni parte, e non capisci quali tengono la tua passerella. Una volta sola fra
      due ondate le corde tacciono tutte insieme, e senti soltanto l'acqua che gocciola dalle assi nel vuoto.

      {percezione Media} Le corde portanti fanno un cigolio basso e lungo, che sale di tono quando la
      passerella si carica. Le funi dei carichi fanno un suono corto e acuto, come una porta che non chiude.

      La tua mano trova il corrimano bagnato e lo stringe fino a farsi male.
    opzioni:
      - testo: "Seguire il cigolio delle corde portanti"
        descrizione: "Le corde che reggono le passerelle hanno una voce loro. Bisogna saperla distinguere."
        prova: { attributo: mentale, abilita: [percezione, tecnologia], difficolta: Media }
        successo:
          titolo: La voce bassa delle corde
          testo: |
            Ascolti, e a poco a poco distingui il cigolio lungo delle portanti da quello acuto delle funi di
            carico. Cammini verso il suono basso, un passo alla volta, con la mano sul corrimano. Quando la
            nebbia si dirada sei su una passerella larga, fra due piloni, dove la gente dei sottoponti ha
            steso i panni. Sono fradici di nebbia e gocciolano sulle assi.
          pe: { percezione: 3 }
          effetti: { profondita.gilda-sotto-il-ponte-dei-morti: 1 }
        fallimento:
          titolo: La fune di carico
          testo: |
            Segui il cigolio sbagliato e finisci su una fune di carico che si muove sotto i piedi. Dal fondo
            arriva il dondolio di un carico che non vedi. Torni indietro a carponi, con le dita aggrappate
            alle assi, fino alla scala da cui eri sces{o|a}.
          effetti: { tormento: 1 }
      - testo: "Tirare dritto senza pensare al vuoto"
        descrizione: "Una passerella è una passerella. Se finora ti ha retto, ti reggerà ancora."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Media }
        successo:
          titolo: Un passo dopo l'altro
          testo: |
            Conti i passi ad alta voce, come un bambino sulle scale, e la passerella ti regge per tutti e
            quaranta. Nella nebbia la tua voce non fa eco contro niente. Quando la nebbia si dirada sei fra
            due piloni, su un tratto più largo, con le gambe molli e la voce un po' troppo alta.
          effetti: { profondita.gilda-sotto-il-ponte-dei-morti: 1 }
        fallimento:
          titolo: "Ferm{o|a}"
          testo: |
            Al decimo passo le gambe smettono di obbedire. Ti tremano le ginocchia e le dita non si staccano
            dal corrimano bagnato. Resti ferm{o|a} nella nebbia finché non si dirada da sola, e quando si
            dirada sei ancora vicin{o|a} alla scala da cui sei sces{o|a}.
          effetti: { tormento: 1 }
      - testo: "Aspettare che la nebbia si abbassi"
        descrizione: "La nebbia sale e scende come la marea. Basta aspettare seduti, e non guardare giù."
        costo: 2
        esito:
          titolo: La marea della nebbia
          testo: |
            Ti siedi sulle assi con la schiena a un pilone e aspetti. La nebbia scende piano, come l'acqua in
            un catino bucato, e scopre la passerella un'asse alla volta. Il pilone è grasso di catrame e ti
            lascia una striscia nera sulla giubba. Quando riparti hai il sedere bagnato e il collo rigido, ma
            vedi dove metti i piedi.
          effetti: { profondita.gilda-sotto-il-ponte-dei-morti: 1 }

  # ------------------------------------------------------------ 1 · le passerelle di servizio
  - id: gilda-sottoponti-i-lunghi
    immagine: icone/hooded-figure
    titolo: I Lunghi
    sommario: "Su una piattaforma di servizio tre uomini alti e magri giocano a dadi su una botte. Il passaggio è loro, e lo fanno pagare."
    luogo: Sotto il Ponte dei Morti, una piattaforma di servizio
    area: gilda-sotto-il-ponte-dei-morti
    ripetibile: true
    requisiti: [fazione.gilda == 7, profondita.gilda-sotto-il-ponte-dei-morti == 1]
    testo: |
      La passerella finisce su una piattaforma appesa a quattro catene, dove tre uomini dalle braccia lunghe
      giocano a dadi su una botte. Le catene sono unte di fresco, e la piattaforma gira di un palmo quando ci
      metti il piede. I dadi sono d'osso e consumati fino a essere quasi tondi. Sono i Lunghi, e quando ti
      vedono smettono di giocare senza fretta.

      «Pedaggio» dice il più vecchio battendo il dado sulla botte. «Chi scende dalla botola dei custodi paga
      il doppio, perché i custodi non pagano mai.»

      {armi-da-mischia Media} I loro coltelli ricurvi da cordaio hanno la lama corta e niente guardia, e
      parano male. Su una piattaforma così stretta conta chi arriva primo.

      Dietro di loro la passerella va ai magazzini appesi.
    opzioni:
      - testo: "Pagare il pedaggio"
        descrizione: "Il doppio, perché vieni dalla botola dei custodi. Almeno è un prezzo onesto."
        requisiti: [monete >= 6]
        esito:
          titolo: Il pedaggio doppio
          testo: |
            Conti le monete una per una sul legno umido della botte, e il più vecchio le fa sparire con il
            palmo senza contarle. «Di là» dice, e indica la passerella. Uno dei tre ti accompagna fino al
            primo magazzino appeso e torna indietro senza salutare.
          effetti: { monete: -6, profondita.gilda-sotto-il-ponte-dei-morti: 1 }
      - testo: "Trattare il pedaggio come uno del posto"
        descrizione: "Sotto i ponti ogni prezzo si tratta, e chi non tratta è un forestiero."
        requisiti: [monete >= 3]
        prova: { attributo: sociale, abilita: conoscenze-della-strada, difficolta: Media }
        successo:
          titolo: Un dado per uno
          testo: |
            Gli proponi di giocarti il pedaggio a dadi con un tiro solo, e il vecchio ride. Tira per primo, e
            i dadi d'osso rotolano sulla botte fino al bordo. Perdi. Paghi la metà, perché chi gioca coi
            Lunghi ha diritto allo sconto, e uno dei tre ti accompagna fino ai magazzini appesi raccontandoti
            di sua sorella.
          pe: { conoscenze-della-strada: 3 }
          effetti: { monete: -3, profondita.gilda-sotto-il-ponte-dei-morti: 1 }
        fallimento:
          titolo: Il forestiero
          testo: |
            Provi a trattare, e il vecchio ti guarda come un pesce guarda un amo nudo. Raddoppia il prezzo.
            Gli altri due riprendono a giocare prima che tu abbia finito di parlare. Te ne torni verso le
            scalette con le orecchie rosse, a cercare un'altra strada.
          effetti: { rep.ponti: -0.5 }
      - testo: "Passare con la forza"
        descrizione: "Tre Lunghi su una piattaforma stretta, con il vuoto tutto intorno. Si arriva primi o non si arriva."
        combattimento: gilda-i-lunghi
        vittoria:
          titolo: La botte rovesciata
          testo: |
            Il primo Lungo finisce contro la botte e la rovescia, e il secondo si lascia scivolare lungo una
            catena fino a sparire nella nebbia. I dadi rotolano giù dalla piattaforma e nessuno si china a
            raccoglierli. Il vecchio alza le mani e ti fa passare, guardandoti con un rispetto che non ti fa
            piacere.
          effetti: { profondita.gilda-sotto-il-ponte-dei-morti: 1, rep.ponti: -0.5 }
        sconfitta:
          titolo: "Appes{o|a} alla catena"
          testo: |
            Ti ritrovi appes{o|a} a una catena della piattaforma, con le gambe nel vuoto e un Lungo che ti
            guarda da sopra la catena con molta calma. La catena è unta e ti scivola fra le dita un anello
            alla volta. Poi ti aiutano a risalire, perché un morto sotto i ponti è una seccatura per tutti, e
            ti rimandano verso le scalette.
          effetti: { ferite: 1, rep.ponti: -0.5 }
      - testo: "Salutarli con le parole dei ragazzi della corda"
        descrizione: "I Lunghi e i ragazzi della corda si fanno la guerra, ma si rispettano. Tu sai come si saluta un Lungo."
        quando: [origine.figlio-della-citta-bassa >= 1]
        requisiti: [monete >= 3]
        esito:
          titolo: Il saluto
          testo: |
            Li saluti come vi salutavate in Via del Salmone, con la mano sul coltello e il pollice alzato, e
            il vecchio si mette a ridere così forte che la piattaforma dondola sulle catene. Ti fa pagare la
            metà del pedaggio e ti indica la passerella con il mento. «Ah, uno dei ragazzi della corda» dice,
            «be', voi pagate sempre la metà, e la metà sia.»
          effetti: { monete: -3, profondita.gilda-sotto-il-ponte-dei-morti: 1 }

  - id: gilda-sottoponti-le-lanterne
    immagine: ambientazione/ponte-dei-morti
    titolo: Le lanterne della veglia
    sommario: "Sotto le passerelle pendono le lanterne dei Raschiatori, così fitte che bisogna passarci in mezzo senza toccarle."
    luogo: Sotto il Ponte dei Morti, sotto le lanterne
    area: gilda-sotto-il-ponte-dei-morti
    ripetibile: true
    requisiti: [fazione.gilda == 7, profondita.gilda-sotto-il-ponte-dei-morti == 1]
    testo: |
      Qui sotto le lanterne dei Raschiatori pendono da lunghe catene calate dal parapetto del ponte. Ognuna ha
      un cristallo acceso per un compagno rimasto nel Labirinto, e la passerella ci passa in mezzo come in un
      bosco di luci. Sul vetro di ciascuna è inciso a punta un nome con il suo anno. La luce dei cristalli è
      ferma e non fa fumo, e il vetro è caldo abbastanza da asciugare la nebbia che ci si posa. Una si è
      impigliata nel corrimano e blocca il passaggio.

      {origine apprendista-raschiatore} Sul vetro della lanterna impigliata c'è un nome che conosci, uno della
      squadra di Dragna che scendeva con te il primo anno.

      Su una cassa all'imbocco una vecchia Raschiatrice ti guarda arrivare senza dire niente.
    opzioni:
      - testo: "Passare sotto la lanterna senza toccarla"
        descrizione: "Bisogna piegarsi fino alle assi e passare, con le mani a posto."
        prova: { attributo: fisico, abilita: acrobazia, difficolta: Media }
        successo:
          titolo: Sotto la luce
          testo: |
            Ti pieghi fino a toccare le assi con le ginocchia e passi sotto la lanterna impigliata. La schiena
            ne sfiora il fondo di vetro, e il calore ti passa attraverso la giubba. La vecchia Raschiatrice ti
            guarda passare e annuisce una volta, come si annuisce a chi sa stare in chiesa.
          pe: { acrobazia: 3 }
          effetti: { profondita.gilda-sotto-il-ponte-dei-morti: 1, rep.raschiatori: 0.5 }
        fallimento:
          titolo: Il vetro
          testo: |
            Ti pieghi, ma la spalla urta la lanterna e la manda a sbattere contro il pilone. Il vetro regge, e
            il colpo corre su per la catena fino al parapetto. Intorno le altre lanterne oscillano tutte
            insieme. La vecchia Raschiatrice si alza e ti fa tornare indietro con un gesto della mano, e tu
            torni indietro.
          effetti: { rep.raschiatori: -0.5 }
      - testo: "Chiedere alla vecchia di farti passare"
        descrizione: "Lei veglia le lanterne. Sa come si sposta una catena senza offendere nessuno."
        prova: { attributo: sociale, abilita: [empatia, galateo], difficolta: Media }
        successo:
          titolo: La catena spostata
          testo: |
            Le chiedi il permesso e il nome del Raschiatore della lanterna, e lei te lo dice insieme all'anno.
            Poi si alza, stacca la catena dal corrimano con due dita e la riappende un palmo più in là. Gli
            anelli scorrono sul legno con un suono di ferro unto. «Adesso passa» dice, «e prima di andartene
            dillo anche tu, il suo nome.»
          pe: { empatia: 3 }
          effetti: { profondita.gilda-sotto-il-ponte-dei-morti: 1, rep.raschiatori: 0.5 }
        fallimento:
          titolo: Il gettone
          testo: |
            Glielo chiedi, e lei ti guarda il gettone di bronzo della Gilda alla cintura prima della faccia.
            Alla luce dei cristalli il bronzo luccica più di ogni altra cosa sulla passerella. «Quelli della
            Casa passano di sopra» dice, «e qui sotto non hanno niente da fare.» Torna a guardare le lanterne.
            Ti tocca tornare verso le scalette.
          effetti: { rep.raschiatori: -0.5 }
      - testo: "Fare il giro largo, fuori dalle lanterne"
        descrizione: "Lungo il bordo esterno della passerella, dove il corrimano non c'è più."
        costo: 2
        esito:
          titolo: Il bordo
          testo: |
            Fai il giro lungo il bordo esterno, dove il corrimano è stato tagliato chissà quando, con la
            schiena al vuoto e la faccia al pilone. Sui monconi il taglio è diventato grigio e morbido come
            feltro. Ci metti molto, e la vecchia Raschiatrice ti guarda tutto il tempo con la testa piegata.
          effetti: { profondita.gilda-sotto-il-ponte-dei-morti: 1 }
      - testo: "Dire il nome del compagno e spostare la catena"
        descrizione: "Lo conoscevi. Alla veglia si dice il nome prima di toccare la lanterna, e allora si può."
        quando: [origine.apprendista-raschiatore >= 1]
        esito:
          titolo: Il nome detto
          testo: |
            Dici il nome del compagno ad alta voce, con l'anno, come alla veglia. La vecchia Raschiatrice si
            alza in piedi. Stacchi la catena dal corrimano e la lanterna ti gira fra le mani, e il nome inciso
            nel vetro ti passa sotto il pollice. La riappendi un palmo più in là, e lei ti tocca il braccio
            quando le passi accanto.
          effetti: { profondita.gilda-sotto-il-ponte-dei-morti: 1, rep.raschiatori: 0.5 }

  # ------------------------------------------------------------ 1–2 · l'esattore degli Scuri
  - id: gilda-sottoponti-l-esattore
    immagine: fazioni/scuri
    titolo: L'esattore degli Scuri
    sommario: "Sulla passerella dei magazzini due uomini con il cappuccio riscuotono la quota degli Scuri da chi passa. Prima la riscuoteva Maedric."
    luogo: Sotto il Ponte dei Morti, la passerella dei magazzini
    area: gilda-sotto-il-ponte-dei-morti
    ripetibile: true
    requisiti: [fazione.gilda == 7, pista.pelle < 6, profondita.gilda-sotto-il-ponte-dei-morti >= 1, profondita.gilda-sotto-il-ponte-dei-morti <= 2]
    testo: |
      Sulla passerella dei magazzini appesi due uomini con il cappuccio grigio stanno appoggiati al corrimano,
      e chi passa lascia qualcosa nella mano del più basso. Ai loro piedi c'è una cassetta di legno dove
      finisce quello che raccolgono. Una donna con il cesto del pesce ne lascia uno. Un ragazzo lascia una
      moneta tosata con il bordo limato fino a lucidarlo, e il più basso la soppesa sul palmo e gliela rende.

      {conoscenze-della-strada Media} Prima riscuoteva Maedric per conto degli Scuri e per conto suo. Adesso
      riscuotono loro, e il prezzo è salito.

      Il più basso ti vede il gettone della Gilda alla cintura e sorride con i denti che gli restano.
    opzioni:
      - testo: "Passare in mezzo a loro"
        descrizione: "Sono in due, e la passerella è stretta. Se cominci tu, la cominci bene."
        combattimento: gilda-l-esattore
        vittoria:
          titolo: La passerella libera
          testo: |
            Il più alto finisce oltre il corrimano e si salva aggrappandosi a una catena. Il più basso scappa
            verso le scalette gridando un nome che non conosci. La donna del pesce ti guarda passare e si
            riprende il suo pesce dalla cassetta dell'esattore, dopo averlo scelto fra gli altri tenendolo per
            la coda.
          effetti: { profondita.gilda-sotto-il-ponte-dei-morti: 1, rep.scuri: -0.5 }
        sconfitta:
          titolo: La quota
          testo: |
            Ti tengono con la faccia sulle assi finché non hai capito chi comanda qui sotto, e lo capisci in
            fretta. Le assi sotto la tua guancia puzzano di pesce marcio. Poi ti rimandano verso le scalette
            con un calcio, e il più basso ti augura buona giornata.
          effetti: { ferite: 1, sospetto: 1 }
      - testo: "Spacciarti per un uomo di Maedric"
        descrizione: "Maedric aveva i suoi uomini, e qualcuno torna ancora a prendere roba. Basta sapere che cosa dire."
        prova: { attributo: sociale, abilita: ingannare, difficolta: Media }
        successo:
          titolo: La roba del custode
          testo: |
            Gli dici che vieni a prendere la roba del custode, e che il custode ricorda chi l'ha aiutato e chi
            no. Il più basso si gratta il mento con il pollice mentre ci pensa, e la barba gli raspa sotto
            l'unghia. Poi ti fa passare con un gesto largo. «Salutalo da parte nostra» dice, «e digli che la
            quota adesso la riscuotiamo noi.»
          pe: { ingannare: 3 }
          effetti: { profondita.gilda-sotto-il-ponte-dei-morti: 1 }
        fallimento:
          titolo: Il nome sbagliato
          testo: |
            Gli dici che vieni da parte di Maedric, e il più alto ti chiede il nome di sua sorella, che non
            sai. Lo chiede senza staccarsi dal corrimano, mentre il più basso ti guarda il gettone. Ti
            rimandano indietro senza toccarti, ma stasera alla Pignatta qualcuno saprà che uno con il gettone
            della Gilda gira sotto il Ponte dei Morti.
          effetti: { sospetto: 1.5 }
      - testo: "Pagare la quota"
        descrizione: "Una moneta per passare. Gli Scuri sapranno che la Gilda paga anche qui."
        requisiti: [monete >= 4]
        esito:
          titolo: Una moneta in mano
          testo: |
            Metti le monete nella mano del più basso, che le guarda una per una alla luce di una lanterna. Una
            la morde, e la butta nella cassetta solo dopo. Ti fa passare. Il più alto, quando gli passi
            accanto, ti dice a mezza voce che adesso sanno che la Gilda paga, e che lo diranno in giro.
          effetti: { monete: -4, rep.scuri: 0.5, profondita.gilda-sotto-il-ponte-dei-morti: 1 }

  # ------------------------------------------------------------ 2 · i magazzini appesi
  - id: gilda-sottoponti-le-botti-raschiate
    immagine: icone/barrel
    titolo: Le botti raschiate
    sommario: "In un magazzino appeso, con il lucchetto rotto, ci sono botti della Gilda con il nodo raschiato via. Le stesse del magazzino di ponente."
    luogo: Sotto il Ponte dei Morti, un magazzino appeso
    area: gilda-sotto-il-ponte-dei-morti
    ripetibile: true
    requisiti: [fazione.gilda == 7, profondita.gilda-sotto-il-ponte-dei-morti == 2]
    testo: |
      Il magazzino è una scatola di assi appesa a quattro catene che oscilla appena quando entri. Dentro c'è
      odore di crusca e di legno bagnato. Ci sono una ventina di botti, e su ognuna il nodo della Gilda è
      stato raschiato via come sulle casse del magazzino di ponente dopo il Festival. Il legno raschiato è più
      chiaro del resto e non ha ancora preso l'umido.

      {percezione Media} Sotto la raschiatura si legge ancora un pezzo di numero di lotto della Casa dei Nodi,
      nella grafia stretta di un ispettore. L'inchiostro è entrato nelle venature più a fondo di dove è
      arrivata la lama.

      Fra le botti le impronte nella polvere portano a una porticina in fondo e a una passerella più bassa
      dove le lanterne non arrivano.
    opzioni:
      - testo: "Leggere i numeri di lotto"
        descrizione: "Sono mezzi raschiati. Con la luce giusta e un po' di pazienza si ricostruiscono."
        prova: { attributo: mentale, abilita: [percezione, politica-ed-economia], difficolta: Media }
        successo:
          titolo: I lotti di Cosimo
          testo: |
            Inclini una botte verso la luce che filtra dalle assi e ricostruisci il numero, cifra dopo cifra.
            Le cifre si leggono meglio di sbieco, dove l'inchiostro è rimasto nelle venature. È un lotto del
            Festival, firmato da Cosimo Venn nel suo libro come *razzia*. Te lo copi sul polsino della camicia
            e prendi la porticina in fondo.
          pe: { percezione: 3 }
          effetti: { profondita.gilda-sotto-il-ponte-dei-morti: 1, informazioni.pettegolezzo: 1 }
        fallimento:
          titolo: Le cifre mangiate
          testo: |
            Le cifre sono raschiate troppo a fondo, e a forza di girare le botti una ti rotola su un piede. È
            piena e pesa quanto un uomo. Zoppichi fino alla porticina in fondo, maledicendo a mezza voce chi
            ha inventato le botti.
          effetti: { profondita.gilda-sotto-il-ponte-dei-morti: 1, ferite: 0.5 }
      - testo: "Aprire una botte"
        descrizione: "Quello che c'è dentro dice più di quello che c'è scritto fuori."
        prova: { attributo: mentale, abilita: [tecnologia, natura], difficolta: Media }
        successo:
          titolo: Cristalli nella crusca
          testo: |
            Sollevi il coperchio con il coltello. Sotto un palmo di crusca ci sono cristalli, imballati uno
            per uno nella paglia, senza timbro. Sono freddi al tatto e senza una scheggia. Ne prendi uno,
            perché un cristallo in tasca è una prova che si porta in giro, e prendi la porticina in fondo.
          pe: { tecnologia: 3 }
          effetti: { profondita.gilda-sotto-il-ponte-dei-morti: 1, cristalli.cristallo-sterile: 1 }
        fallimento:
          titolo: Il coperchio
          testo: |
            Il coperchio salta via di colpo e la crusca ti finisce in faccia e sulle assi, dove resta come una
            traccia per chiunque passi dopo di te. Il magazzino oscilla sulle catene per il colpo. Te ne vai
            dalla porticina in fondo sputando crusca.
          effetti: { profondita.gilda-sotto-il-ponte-dei-morti: 1, sospetto: 1 }
      - testo: "Seguire le impronte senza fermarsi"
        descrizione: "Le botti restano qui. Le impronte vanno verso la casa che cerchi."
        costo: 2
        esito:
          titolo: Le impronte
          testo: |
            Segui le impronte fra le botti fino alla porticina e oltre, giù su una passerella più bassa dove
            le lanterne non arrivano. Ci metti tempo, perché ogni tanto le impronte si perdono e devi tornare
            indietro. Sulle assi bagnate la polvere finisce, e le impronte diventano macchie di umido che si
            asciugano mentre le guardi.
          effetti: { profondita.gilda-sotto-il-ponte-dei-morti: 1 }

  - id: gilda-sottoponti-la-fune-segata
    immagine: icone/rope-coil
    titolo: La fune segata
    sommario: "Una passerella pende di traverso. Una delle sue funi portanti è stata segata a metà, con un taglio pulito."
    luogo: Sotto il Ponte dei Morti, fra i magazzini appesi
    area: gilda-sotto-il-ponte-dei-morti
    ripetibile: true
    requisiti: [fazione.gilda == 7, profondita.gilda-sotto-il-ponte-dei-morti == 2]
    testo: |
      La passerella fra due magazzini appesi pende di traverso, e dalla parte bassa il corrimano sfiora il
      vuoto. Una delle quattro funi portanti è stata segata a metà e regge con le fibre che restano. Quelle
      fibre sono tese fino a diventare lucide, e ogni tanto se ne spezza una con uno schiocco secco.

      {tecnologia Media} Il taglio è pulito, fatto con un segaccio da funi come quelli dei chiattaioli, e
      dentro le fibre sono ancora chiare. Qualcuno voleva che la passerella reggesse ancora un po' e poi
      cedesse sotto il primo peso giusto.

      Più in basso, nella nebbia, si vede la sagoma scura di un'altra passerella.
    opzioni:
      - testo: "Attraversare dalla parte alta"
        descrizione: "Con il peso sulla fune buona, e in fretta."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Media }
        successo:
          titolo: Dalla parte alta
          testo: |
            Attraversi tenendoti alla fune buona, con i piedi sul bordo alto delle assi e il vuoto alla tua
            destra. La fune segata canta sotto il tuo peso e regge, anche quando a metà strada due fibre
            saltano insieme. Dall'altra parte ti volti, e ti viene in mente che a segarla così ci vuole uno
            che conosce le funi.
          pe: { atletica: 3 }
          effetti: { profondita.gilda-sotto-il-ponte-dei-morti: 1 }
        fallimento:
          titolo: La fune che cede
          testo: |
            A metà strada la fune segata cede del tutto, e la passerella si gira di lato. Il capo spezzato
            della fune frusta l'aria sopra la tua testa e poi pende nella nebbia. Resti aggrappat{o|a} al
            corrimano con le gambe nel vuoto, e risali a forza di braccia fino al magazzino da cui eri
            partit{o|a}.
          effetti: { ferite: 1 }
      - testo: "Legare la fune prima di passare"
        descrizione: "Un nodo da carico sopra il taglio, e la fune regge come nuova. O quasi."
        prova: { attributo: mentale, abilita: [tecnologia, accademiche], difficolta: Media }
        successo:
          titolo: Il nodo sopra il taglio
          testo: |
            Fai un nodo da carico sopra il taglio come il nodo dei soci alla Casa dei Nodi, e lo stringi
            finché la fune bagnata smette di scricchiolare dentro il nodo. La passerella si raddrizza di un
            palmo. Attraversi senza fretta, e dall'altra parte lasci il nodo dov'è, per chi passa dopo.
          pe: { tecnologia: 3 }
          effetti: { profondita.gilda-sotto-il-ponte-dei-morti: 1, rep.ponti: 0.5 }
        fallimento:
          titolo: Il nodo che scivola
          testo: |
            Il nodo scivola sulla fune bagnata e ti brucia i palmi. Sotto il catrame la fune è viscida di
            nebbia, e il nodo non trova presa. Riprovi due volte prima di rinunciare, e torni indietro a
            cercare un'altra strada con le mani che ti fanno male.
          effetti: { ferite: 0.5 }
      - testo: "Scendere alla passerella di sotto"
        descrizione: "È più lunga e più buia, ma le sue funi sono intere."
        costo: 2
        esito:
          titolo: Di sotto
          testo: |
            Ti cali lungo una catena fino alla passerella di sotto, che gira intorno a due piloni prima di
            risalire. È lunga e buia, e ci passa il vento della Cicatrice. Sale freddo dal basso e ti tira i
            vestiti verso l'alto. Quando risali sei dall'altra parte della fune segata, con le mani nere di
            catrame.
          effetti: { profondita.gilda-sotto-il-ponte-dei-morti: 1 }
      - testo: "Fare il nodo come sulla Cicatrice"
        descrizione: "Sulle piattaforme una fune segata si lega appesi, con una mano. L'hai fatto cento volte."
        quando: [origine.apprendista-raschiatore >= 1]
        esito:
          titolo: Una mano
          testo: |
            Ti appendi al corrimano con una mano e con l'altra fai il nodo dei Raschiatori sopra il taglio,
            quello che regge anche bagnato. Il capo libero lo tiri con i denti. La passerella si raddrizza di
            un palmo, e la attraversi in sei passi.
          pe: { tecnologia: 3 }
          effetti: { profondita.gilda-sotto-il-ponte-dei-morti: 1, rep.ponti: 0.5 }

  # ------------------------------------------------------------ 2–3 · il balestriere di guardia
  - id: gilda-sottoponti-il-balestriere-di-guardia
    immagine: icone/crossbow
    titolo: Il balestriere di guardia
    sommario: "All'imbocco della campata senza lanterne c'è un balestriere della Gilda seduto su una cassa. Uno degli uomini di Maedric."
    luogo: Sotto il Ponte dei Morti, all'imbocco della campata cieca
    area: gilda-sotto-il-ponte-dei-morti
    ripetibile: true
    requisiti: [fazione.gilda == 7, profondita.gilda-sotto-il-ponte-dei-morti >= 2, profondita.gilda-sotto-il-ponte-dei-morti <= 3]
    testo: |
      All'imbocco di una campata buia un uomo con una balestra leggera sulle ginocchia siede su una cassa e
      mangia castagne secche da un sacchetto. Le bucce le butta oltre il corrimano, una alla volta. La
      balestra è carica, con la corda tesa e il dardo già nella scanalatura. Ha il mantello dei Custodi con lo
      stemma della Gilda scucito a metà, e i punti sono tagliati da un lato solo. È uno dei balestrieri di
      Maedric Holl, e gli altri sono spariti con lui.

      {empatia Media} Conta con il pollice le castagne che gli restano senza guardarle, e non sa chi gli darà
      la paga del mese.
    opzioni:
      - testo: "Strisciargli alle spalle nella nebbia"
        descrizione: "La nebbia sale a ondate. Fra un'ondata e l'altra c'è il tempo di dieci passi."
        prova: { attributo: fisico, abilita: furtivita, difficolta: Media }
        successo:
          titolo: Dieci passi
          testo: |
            Aspetti l'ondata di nebbia e ti muovi con lei, dieci passi alla volta, finché non sei dentro la
            campata buia alle sue spalle. Fra un'ondata e l'altra resti accucciat{o|a} dietro un pilone, con
            il legno bagnato contro la guancia. Lo senti masticare castagne per un pezzo, mentre ti allontani
            al buio.
          pe: { furtivita: 3 }
          effetti: { profondita.gilda-sotto-il-ponte-dei-morti: 1 }
        fallimento:
          titolo: Il dardo nel pilone
          testo: |
            La nebbia si dirada a metà strada, e lui ti vede. Il dardo si pianta nel pilone accanto alla tua
            testa e ci resta a vibrare. Torni indietro di corsa fra le lanterne, mentre lui ricarica senza
            fretta.
          effetti: { ferite: 0.5, sospetto: 1 }
      - testo: "Disarmarlo prima che tiri"
        descrizione: "Una balestra leggera tira una volta. Dopo, è un bastone."
        combattimento: gilda-il-balestriere-di-guardia
        vittoria:
          titolo: Le castagne
          testo: |
            Lo raggiungi mentre ricarica, e la balestra finisce nella Cicatrice insieme al sacchetto di
            castagne. Sulle assi ne restano due o tre, e lui le guarda. Poi alza le mani e ti dice che la paga
            del mese non gliel'ha data nessuno, e che per lui puoi passare.
          effetti: { profondita.gilda-sotto-il-ponte-dei-morti: 1 }
        sconfitta:
          titolo: Il dardo nella spalla
          testo: |
            Il dardo ti prende di striscio alla spalla prima che tu arrivi, e il secondo colpo te lo dà con il
            calcio della balestra. Il calcio è rinforzato di ferro e ti lascia in bocca il sapore del sangue.
            Ti trascini indietro fra le lanterne, con la spalla che sanguina.
          effetti: { ferite: 1 }
      - testo: "Offrirgli la paga del mese"
        descrizione: "Maedric non lo paga più. Tu puoi."
        requisiti: [monete >= 8]
        esito:
          titolo: La paga
          testo: |
            Gli metti in mano le monete, e lui le conta una alla volta come le castagne prima di infilarle nel
            sacchetto insieme a loro. Poi si alza, si mette la balestra a tracolla e se ne va verso le
            scalette. Prima di sparire ti dice che la casa che cerchi è in fondo alla campata, e che la porta
            si apre tirando.
          effetti: { monete: -8, profondita.gilda-sotto-il-ponte-dei-morti: 1 }

  # ------------------------------------------------------------ 3 · la campata cieca
  - id: gilda-sottoponti-la-campata-cieca
    immagine: ambientazione/ponte-dei-morti
    titolo: La campata cieca
    sommario: "Una campata senza lanterne, buia come l'interno di un pugno. In fondo, da qualche parte, c'è la casa di Maedric."
    luogo: Sotto il Ponte dei Morti, la campata cieca
    area: gilda-sotto-il-ponte-dei-morti
    ripetibile: true
    requisiti: [fazione.gilda == 7, profondita.gilda-sotto-il-ponte-dei-morti == 3]
    testo: |
      La campata cieca è una lunga passerella sotto un tratto di ponte senza le lanterne dei Raschiatori. Nel
      buio senti le assi sotto i piedi e il corrimano sotto la mano, e da sotto sale il vento freddo della
      Cicatrice. Il corrimano è consumato in una scanalatura larga un palmo, dove si sono appoggiate molte
      mani. Qui le assi non cigolano, e sotto il vento non si sente nessun altro rumore. Ti dici che il legno
      tace perché è asciutto. In fondo, molto lontano, c'è un filo di luce gialla sottile come una crepa.

      {furtivita Media} Se tu senti il vento, chi sta in fondo sente te. Il vento soffia verso il fondo e
      porta da quella parte ogni rumore che fai.
    opzioni:
      - testo: "Avanzare al buio, con la mano sul corrimano"
        descrizione: "Un passo alla volta, senza fare rumore, verso il filo di luce."
        prova: { attributo: fisico, abilita: [furtivita, resistenza], difficolta: Media }
        successo:
          titolo: Il filo di luce
          testo: |
            Avanzi con la mano sul corrimano e i piedi che tastano le assi, e il filo di luce cresce a poco a
            poco fino a diventare la fessura di una porta. Più ti avvicini più il vento cala, e gli ultimi
            passi li fai in un'aria ferma che puzza di olio da lampada. La casa è appesa sotto il ponte con
            quattro catene, come una lanterna enorme.
          pe: { furtivita: 3 }
          effetti: { profondita.gilda-sotto-il-ponte-dei-morti: 1 }
        fallimento:
          titolo: L'asse che manca
          testo: |
            A metà campata un'asse manca, e il tuo piede trova il vuoto. Ti salvi aggrappandoti al corrimano
            con tutte e due le mani, e il rumore delle assi rotola lungo la campata fino in fondo. Quando il
            rumore finisce anche il vento si è fermato. Il filo di luce in fondo si spegne, e tu torni
            indietro fino alle lanterne.
          effetti: { ferite: 0.5 }
      - testo: "Contare le assi a voce bassa"
        descrizione: "Una campata ha un numero di assi. Quella che manca si sente prima di cadere."
        prova: { attributo: mentale, abilita: [percezione, resilienza], difficolta: Media }
        successo:
          titolo: Centoquattordici
          testo: |
            Conti le assi sotto la suola una alla volta, e alla centoquattordicesima il piede non trova
            niente. La salti. Le assi sono tutte larghe una spanna, e dopo un po' il conto va avanti da solo.
            Alla duecentesima la fessura di luce è a dieci passi da te, ed è la porta di una casa appesa sotto
            il ponte con quattro catene.
          pe: { percezione: 3 }
          effetti: { profondita.gilda-sotto-il-ponte-dei-morti: 1 }
        fallimento:
          titolo: Il conto perso
          testo: |
            Perdi il conto a sessanta e ricominci, ma lo perdi di nuovo. La seconda volta un nodo nel legno ti
            dice sotto la suola che quell'asse l'hai già contata. Il buio ti si stringe intorno alla testa.
            Torni verso le lanterne a passo svelto, senza voltarti.
          effetti: { tormento: 1 }
      - testo: "Avanzare carponi"
        descrizione: "Carponi non si cade. Ci si sporca, ci si mette molto, ma non si cade."
        costo: 2
        esito:
          titolo: Carponi
          testo: |
            Avanzi carponi, con le mani che tastano ogni asse prima di metterci sopra il peso. Fra un'asse e
            l'altra le dita trovano fessure larghe un dito, e da lì sale il vento della Cicatrice. Ci metti
            un'eternità, e quando arrivi alla porta della casa appesa hai le ginocchia scorticate e la faccia
            nera di catrame.
          effetti: { profondita.gilda-sotto-il-ponte-dei-morti: 1 }
      - testo: "Aprire di un dito la lanterna cieca"
        descrizione: "Una lanterna che fa luce per un dito. Qui sotto è tutto quello che serve."
        requisiti: [chiave.notte-sui-ponti >= 1]
        costo: 0
        esito:
          titolo: Un dito di luce
          testo: |
            Apri lo sportello della lanterna di un dito, e la luce ti mostra le assi una alla volta, senza
            arrivare in fondo alla campata. Dove manca l'asse la luce scende nel buco e non trova niente su
            cui fermarsi. La salti e arrivi alla porta della casa appesa senza un rumore.
          effetti: { profondita.gilda-sotto-il-ponte-dei-morti: 1 }

  # ------------------------------------------------------------ il cuore · la casa appesa
  - id: gilda-sottoponti-la-casa-appesa
    immagine: personaggi/maedric-holl
    titolo: La casa appesa
    sommario: "In fondo alla campata cieca c'è una casa di assi appesa sotto il ponte, e dentro la luce è accesa."
    luogo: Sotto il Ponte dei Morti, la casa appesa di Maedric
    area: gilda-sotto-il-ponte-dei-morti
    requisiti: [fazione.gilda == 7, profondita.gilda-sotto-il-ponte-dei-morti >= 4]
    testo: |
      La casa di Maedric Holl è una stanza sola appesa sotto il ponte con quattro catene, in fondo a una
      passerella stretta. Le catene scendono dalle travi del ponte fino agli angoli del tetto, e gli anelli
      più alti sono lucidi dove sfregano contro i ganci. Quando il vento della Cicatrice sale da sotto la casa
      ruota appena, e le catene cigolano una dopo l'altra sempre nello stesso ordine. La finestra sul vuoto ha
      le imposte chiuse, e dalla fessura della porta esce una luce gialla. Era questo l'indirizzo che Maedric
      dava alla Casa dei Nodi, e nessun ispettore ci era mai sceso.

      Dentro vedi la branda accanto alla stufetta e il tavolo con i libri impilati. La stufetta è ancora
      tiepida e manda un odore di carbone bagnato. E c'è qualcuno.

      {percezione Media} I libri sono legati con lo spago accanto a una borsa di cuoio aperta. Il nodo è fatto
      a metà e un capo dello spago pende ancora dal tavolo, perché chi è qui stava per portarli via.

      {origine figlio-della-citta-bassa} Da ragazz{o|a} ti dicevano di non andare oltre le lanterne, perché lì
      abitava l'uomo del mantello cerato. Pensavi fosse una storia per spaventare i piccoli.
    opzioni:
      - testo: "Affrontare Maedric e i suoi balestrieri"
        descrizione: "Maedric è tornato a prendersi i libri, con due balestrieri. Lo spazio è poco, e le balestre tirano una volta."
        requisiti: [maedric <= 1]
        combattimento: gilda-maedric-e-i-balestrieri
        vittoria:
          titolo: Il mantello cerato
          testo: |
            I balestrieri cadono uno dopo l'altro nello spazio stretto fra la branda e il tavolo, e Maedric si
            ritrova con la schiena contro la finestra chiusa. Apre le imposte con una mano dietro la schiena e
            ti guarda. «I ponti di notte non sono i ponti di giorno» dice. Poi si lascia cadere nel vuoto,
            aggrappato a una corda che aveva legato lì da anni, e i libri restano sul tavolo. Il nodo che
            tiene la corda al gancio della finestra è nero di catrame, e la corda scende tesa nella nebbia
            finché non la vedi più.
          segue: gilda-sottoponti-il-secondo-libro
        sconfitta:
          titolo: La porta che si chiude
          testo: |
            Un dardo ti prende alla gamba, e un balestriere ti spinge fuori dalla porta. Ti ritrovi sulla
            passerella con la porta chiusa davanti, e dall'altra parte senti scorrere il chiavistello. Il
            sangue ti cola caldo nello stivale. Torni indietro zoppicando per la campata cieca e poi su per le
            scalette, fino alla botola.
          effetti: { ferite: 1 }
          vai: ponti-sospesi
      - testo: "Trattare con Maedric"
        descrizione: "Maedric lavora a tariffa, con tutti. I libri hanno un prezzo, e anche la sua fuga."
        requisiti: [maedric <= 1]
        prova: { attributo: sociale, abilita: [persuasione, conoscenze-della-strada], difficolta: Difficile }
        successo:
          titolo: La tariffa
          testo: |
            Gli dici che i suoi vecchi soci lo cercano, e che tu sei {l'unico|l'unica} in città che lo lascerà
            andare. Maedric ti ascolta con gli occhi acquosi e il mantello sulle spalle. «La tariffa è giusta»
            dice alla fine. Spinge i libri verso di te con due dita. Poi apre le imposte e scende nel vuoto
            lungo una corda annodata. La corda sfrega contro il davanzale ancora per un po' e poi si ferma, e
            sui ponti non lo vedrai più.
          pe: { persuasione: 5 }
          segue: gilda-sottoponti-il-secondo-libro
        fallimento:
          titolo: Il prezzo sbagliato
          testo: |
            Gli proponi un prezzo, e Maedric sorride appena con le labbra sottili. «Hai sbagliato il conto»
            dice, e quando alza la mano per fare un cenno ai balestrieri il mantello cerato gli scricchiola
            sulla spalla. Ti ritrovi sulla passerella con la porta chiusa davanti e un livido sulla fronte, e
            torni indietro fino alla botola.
          effetti: { ferite: 0.5 }
          vai: ponti-sospesi
      - testo: "Affrontare il balestriere con la toppa"
        descrizione: "Maedric non c'è più, e la casa la tiene uno dei suoi uomini, con due compagni. Non sa più per chi la tiene."
        requisiti: [maedric >= 2]
        combattimento: gilda-la-casa-appesa
        vittoria:
          titolo: La toppa sulla fodera
          testo: |
            Nello spazio stretto fra la branda e il tavolo le balestre servono a poco. Gli altri due scappano
            dalla finestra lungo una corda, e la corda batte contro il davanzale finché non arrivano in fondo.
            Il balestriere con la toppa sulla fodera resta seduto sulla branda con le mani alzate. «Tanto non
            c'era più nessuno a pagarci» dice, e ti indica i libri sul tavolo.
          segue: gilda-sottoponti-il-secondo-libro
        sconfitta:
          titolo: Fuori dalla porta
          testo: |
            Un balestriere ti colpisce con il calcio della balestra, e ti ritrovi sulla passerella con la
            porta chiusa davanti e un ronzio nell'orecchio. Torni indietro zoppicando per la campata cieca,
            fino alla botola.
          effetti: { ferite: 1 }
          vai: ponti-sospesi
      - testo: "Parlare al balestriere con la toppa"
        descrizione: "Quella toppa gliel'ha cucita qualcuno che gli vuole bene. Un uomo così vorrebbe tornare a casa."
        requisiti: [maedric >= 2]
        prova: { attributo: sociale, abilita: empatia, difficolta: Media }
        successo:
          titolo: Chi l'ha cucita
          testo: |
            Gli chiedi chi gli ha cucito la toppa. Lui guarda la fodera e poi te, e passa il pollice sui punti
            piccoli e fitti. Ti dice che gliel'ha cucita sua madre. Vive in Città Bassa e crede che lui faccia
            il custode di giorno. Manda via gli altri due con un cenno e ti lascia i libri sul tavolo.
            «Diglielo tu, alla Casa, che non ho preso niente» dice, e se ne va per la campata.
          pe: { empatia: 5 }
          segue: gilda-sottoponti-il-secondo-libro
        fallimento:
          titolo: Non sono affari tuoi
          testo: |
            Gli parli della toppa, e lui si alza di scatto. «Non sono affari tuoi» dice, e la balestra si alza
            con lui. Esci dalla porta camminando all'indietro, con la punta del dardo che ti segue fino alla
            soglia, e torni fino alla botola con il cuore che ti batte nei denti.
          effetti: { tormento: 1 }
          vai: ponti-sospesi
      - testo: "Tornare indietro fino alla botola"
        descrizione: "La casa appesa resta qui. Si può tornare con più forze."
        costo: 0
        esito:
          titolo: Indietro
          testo: |
            Richiudi la porta piano e torni indietro per la campata cieca con la mano sul corrimano. Alle tue
            spalle la luce gialla della casa si fa sempre più piccola, e il cigolio delle catene ti arriva
            finché il vento non lo copre.
          vai: ponti-sospesi

  - id: gilda-sottoponti-il-secondo-libro
    immagine: icone/notebook
    titolo: Il secondo libro
    tipo: seguito
    luogo: Sotto il Ponte dei Morti, la casa appesa di Maedric
    area: gilda-sotto-il-ponte-dei-morti
    requisiti: [fazione.gilda == 7]
    testo: |
      Sul tavolo ci sono due libri legati con lo spago. Il primo è un registro di pelle uguale a quello che
      hai già visto. Il secondo è il quaderno di conti di Maedric, scritto in chiaro con la sua grafia
      sottile, e le pagine sono gonfie dell'umidità che sale dalla nebbia. Racconta sei anni di soldi degli
      Scuri passati dai magazzini di scarico di Ansaldo Morlacchi a tre banchi della Casa dei Nodi come
      pagamenti per noli mai fatti, e accanto a ogni somma c'è il nome del funzionario che la riceveva. Le
      colonne sono tirate a righello, e in sei anni la mano che le ha scritte non cambia mai.

      {politica-ed-economia Media} Le date tornano con quelle dei noli fantasma dell'archivio.

      Accanto ai libri c'è una lanterna di latta con lo sportello a scatto, che fa luce per un dito. La latta
      è annerita sopra il camino e lucida sulla maniglia. Sotto la branda c'è una cassa con rotoli di monete e
      alcuni cristalli carichi senza timbro.

      {origine mercante-dei-ponti} Il nome di quei magazzini l'hai letto mille volte sulle bolle del tuo
      banco, e ogni volta il nolo ti sembrava caro.
    opzioni:
      - testo: "Portare via i libri e il bottino"
        descrizione: "I libri, la lanterna di Maedric, i rotoli di monete e i cristalli. Agli Scuri mancheranno."
        requisiti: [pista.pelle < 6]
        esito:
          titolo: Tutto sotto la giubba
          testo: |
            Metti i libri sotto la giubba e la lanterna alla cintura, e le monete con i cristalli finiscono
            nella borsa di cuoio di Maedric. Risali fino alle scalette, e a ogni piolo la borsa ti tira la
            spalla verso il vuoto. Quando esci dalla botola Teo Marsan ti aspetta con la lanterna alzata e
            conta i libri tre volte. Prima di sera alla Pignatta sapranno chi ha svuotato la casa appesa.
          effetti: { oggetto.gilda-lanterna-cieca-di-maedric: 1, monete: 25, cristalli.cristallo-carico: 2, rep.scuri: -1, racconto: 1, rep.gilda: 0.5, fazione.gilda: 1 }
          vai: ponti-sospesi
      - testo: "Portare via i libri e il bottino"
        descrizione: "I libri, la lanterna di Maedric, i rotoli di monete e i cristalli. Gli Scuri non ci sono più a reclamarli."
        requisiti: [pista.pelle >= 6]
        esito:
          titolo: Tutto sotto la giubba
          testo: |
            Metti i libri sotto la giubba e la lanterna alla cintura, e le monete con i cristalli finiscono
            nella borsa di cuoio di Maedric. Risali fino alle scalette, e a ogni piolo la borsa ti tira la
            spalla verso il vuoto. Quando esci dalla botola Teo Marsan ti aspetta con la lanterna alzata e
            conta i libri tre volte.
          effetti: { oggetto.gilda-lanterna-cieca-di-maedric: 1, monete: 25, cristalli.cristallo-carico: 2, racconto: 1, rep.gilda: 0.5, fazione.gilda: 1 }
          vai: ponti-sospesi
      - testo: "Prendere i libri e la lanterna, e lasciare il resto ai sottoponti"
        descrizione: "Le monete e i cristalli restano nella cassa. Qualcuno dei sottoponti li troverà, e se ne ricorderà."
        esito:
          titolo: La cassa aperta
          testo: |
            Prendi i libri e la lanterna, e lasci la cassa aperta sotto la branda con i rotoli di monete in
            fila. Sulla passerella incroci la vecchia Raschiatrice delle lanterne, o una che le somiglia, e le
            dici dove andare a guardare. Quando esci dalla botola Teo Marsan conta i libri tre volte.
          effetti: { oggetto.gilda-lanterna-cieca-di-maedric: 1, rep.ponti: 1, rep.raschiatori: 0.5, racconto: 1, rep.gilda: 0.5, fazione.gilda: 1 }
          vai: ponti-sospesi
