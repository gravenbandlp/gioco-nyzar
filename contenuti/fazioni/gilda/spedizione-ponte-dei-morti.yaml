# Sotto il Ponte dei Morti, spedizione del passo 8 della quest della Gilda (fazione.gilda == 7).
# Ci si entra dalla botola del gabbiotto (`gilda-la-botola-del-gabbiotto`, passi-2.yaml). Ritorno ai Ponti, soglia 4.
# Le stanze vanno in fasce di profondità, e una stanza superata non ricompare nella stessa visita:
#   0 la botola e le scalette (le scale di corda; la nebbia sotto le assi, che vale anche a 1);
#   1 le passerelle di servizio (i Lunghi; le lanterne dei Raschiatori; l'esattore degli Scuri, solo con
#     pista.pelle < 6, che vale anche a 2);
#   2 i magazzini appesi (le botti col segno raschiato; la fune segata; il balestriere di guardia, che vale anche a 3);
#   3 la campata cieca.
# Ogni stanza ha una via lunga che costa due rintocchi e fa avanzare comunque.
# Il cuore a 4 è la casa appesa di Maedric. Con maedric <= 1 (fuggito) Maedric è tornato a riprendersi i libri:
# combattimento Difficile con due balestrieri, o trattativa (Persuasione, Difficile). Con maedric >= 2 (in cella o
# morto) la casa la tiene il balestriere con la toppa sulla fodera: combattimento o Empatia (Media). Chi perde torna
# sui Ponti e può riprovare. Il seguito `gilda-sottoponti-il-secondo-libro` chiude il passo: il libro dei pagamenti,
# la lanterna cieca di Maedric e il bottino del magazzino appeso (rep.scuri -1 se gli Scuri ci sono ancora).
aree:
  - id: gilda-sotto-il-ponte-dei-morti
    immagine: ambientazione/ponte-dei-morti
    nome: Sotto il Ponte dei Morti
    sommario: "Sotto le assi del Ponte dei Morti, fra passerelle nella nebbia, c'è la casa appesa di Maedric Holl."
    spedizione: { ritorno: ponti-sospesi, soglia: 4, stanze: 3 }
    testo: |
      Sotto le assi del Ponte dei Morti la nebbia della Cicatrice si
      addensa, e la luce delle lanterne dei Raschiatori arriva dall'alto a
      macchie gialle. Fra i piloni corrono passerelle di servizio larghe un
      uomo, e più in basso pendono nel vuoto magazzini di assi chiusi a
      lucchetto. Ci vivono i Lunghi e i ragazzi della corda, gente che i
      registri della Gilda non contano.

# La musica della spedizione (come le altre aree in contenuti/audio.yaml).
colonna:
  - { contesto: area, id: gilda-sotto-il-ponte-dei-morti, musica: the-light-that-failed, ambiente: rain-in-town }

storylet:
  # ------------------------------------------------------------ 0 · la botola e le scalette
  - id: gilda-sottoponti-le-scalette
    immagine: icone/ladder
    titolo: Le scalette
    sommario: "Dalla botola le scale di corda scendono alle prime passerelle, con parecchi pioli mancanti."
    luogo: Sotto il Ponte dei Morti, le scalette
    area: gilda-sotto-il-ponte-dei-morti
    ripetibile: true
    requisiti: [fazione.gilda == 7, profondita.gilda-sotto-il-ponte-dei-morti == 0]
    testo: |
      Dalla passerella sotto la botola tre scale di corda scendono nella
      nebbia. Una è nuova, di canapa chiara. Le altre due sono nere di
      catrame, e a quella di sinistra manca un piolo ogni tre.

      {conoscenze-della-strada Media} In cima a ogni scala c'è un pezzetto
      di stoffa colorata, il segno di chi la tiene. Chi sale su quella di un
      altro prima o poi paga.
    opzioni:
      - testo: "Scendere dalla scala vecchia, quella senza pioli"
        descrizione: "Un piolo ogni tre manca, ma nessuno ti aspetta in fondo."
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Media }
        successo:
          titolo: I pioli che mancano
          testo: |
            Scendi a forza di braccia dove mancano i pioli fino a una passerella
            vuota.
          pe: { acrobazia: 3 }
          effetti: { profondita.gilda-sotto-il-ponte-dei-morti: 1 }
        fallimento:
          titolo: Il piolo marcio
          testo: |
            Un piolo si spezza e resti appeso alle mani. Risali fino alla botola
            con le braccia che bruciano.
          effetti: { ferite: 0.5 }
      - testo: "Scendere dalla scala nuova, quella di canapa"
        descrizione: "Qualcuno l'ha appesa da poco e la usa, e magari è proprio chi cerchi."
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Media }
        successo:
          titolo: La canapa chiara
          testo: |
            In fondo c'è una passerella spazzata di recente, con una lanterna
            spenta e ancora tiepida appesa a un chiodo.
          pe: { furtivita: 3 }
          effetti: { profondita.gilda-sotto-il-ponte-dei-morti: 1 }
        fallimento:
          titolo: La scala che dondola
          testo: |
            La scala dondola, e a metà sbatti la spalla contro un pilone con un
            rumore da tamburo. Dalla nebbia qualcuno fischia due volte, e tu
            risali alla botola ad aspettare.
          effetti: { sospetto: 1 }
      - testo: "Aspettare che qualcuno salga e chiedergli la strada"
        descrizione: "Prima o poi da una di queste scale sale qualcuno, ma la nebbia è fredda."
        costo: 2
        esito:
          titolo: Il ragazzo della corda
          testo: |
            Dopo un'ora sale un ragazzo con una fune a tracolla e un pesce secco
            in mano. Ti indica la scala giusta, quella con lo straccio verde, e
            sparisce verso l'alto.
          effetti: { profondita.gilda-sotto-il-ponte-dei-morti: 1 }

  # ------------------------------------------------------------ 0–1 · la nebbia sotto le assi
  - id: gilda-sottoponti-la-nebbia-sotto-le-assi
    immagine: ambientazione/ponte-dei-morti
    titolo: La nebbia sotto le assi
    sommario: "La nebbia si fa così fitta che non vedi la passerella sotto i piedi."
    luogo: Sotto il Ponte dei Morti, fra i piloni
    area: gilda-sotto-il-ponte-dei-morti
    ripetibile: true
    requisiti: [fazione.gilda == 7, profondita.gilda-sotto-il-ponte-dei-morti <= 1]
    testo: |
      La nebbia sale dalla Cicatrice a ondate finché non ti passa sopra la
      testa. Non vedi più la passerella, e intorno cigolano corde di cui non
      sai quali tengono la tua.

      {percezione Media} Le corde portanti cigolano basso, con un suono
      lungo. Le funi dei carichi fanno un suono corto e acuto, come una
      porta che non chiude.
    opzioni:
      - testo: "Seguire il cigolio delle corde portanti"
        descrizione: "Le corde che reggono le passerelle hanno una voce loro."
        prova: { attributo: mentale, abilita: [percezione, tecnologia], difficolta: Media }
        successo:
          titolo: La voce bassa delle corde
          testo: |
            Cammini verso il cigolio basso delle portanti e sbuchi su una
            passerella larga, dove la gente dei sottoponti ha steso i panni.
          pe: { percezione: 3 }
          effetti: { profondita.gilda-sotto-il-ponte-dei-morti: 1 }
        fallimento:
          titolo: La fune di carico
          testo: |
            Segui il cigolio sbagliato e finisci su una fune di carico che si
            muove sotto i piedi. Torni indietro a carponi fino alla scala.
          effetti: { tormento: 1 }
      - testo: "Tirare dritto senza pensare al vuoto"
        descrizione: "Se finora la passerella ti ha retto, ti reggerà ancora."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Media }
        successo:
          titolo: Un passo dopo l'altro
          testo: |
            Conti i passi ad alta voce come un bambino sulle scale, e la
            passerella ti regge per tutti e quaranta.
          effetti: { profondita.gilda-sotto-il-ponte-dei-morti: 1 }
        fallimento:
          titolo: Fermo
          testo: |
            Al decimo passo le gambe smettono di obbedire, e quando la nebbia si
            dirada sei ancora vicino alla scala.
          effetti: { tormento: 1 }
      - testo: "Aspettare che la nebbia si abbassi"
        descrizione: "La nebbia sale e scende come la marea, e basta aspettare seduti."
        costo: 2
        esito:
          titolo: La marea della nebbia
          testo: |
            Aspetti con la schiena a un pilone che la nebbia scenda, e riparti con
            il sedere bagnato e il collo rigido.
          effetti: { profondita.gilda-sotto-il-ponte-dei-morti: 1 }

  # ------------------------------------------------------------ 1 · le passerelle di servizio
  - id: gilda-sottoponti-i-lunghi
    immagine: icone/hooded-figure
    titolo: I Lunghi
    sommario: "Su una piattaforma di servizio tre uomini alti e magri giocano a dadi, e il passaggio lo fanno pagare."
    luogo: Sotto il Ponte dei Morti, una piattaforma di servizio
    area: gilda-sotto-il-ponte-dei-morti
    ripetibile: true
    requisiti: [fazione.gilda == 7, profondita.gilda-sotto-il-ponte-dei-morti == 1]
    testo: |
      La passerella finisce su una piattaforma appesa a quattro catene, dove
      tre uomini dalle braccia lunghe giocano a dadi su una botte, con i
      coltelli ricurvi da cordaio alla cintura. Sono i Lunghi.

      «Pedaggio» dice il più vecchio, e batte il dado sulla botte. «Chi
      scende dalla botola dei custodi paga il doppio, perché i custodi non
      pagano mai.»

      {conoscenze-della-strada Facile} Ha battuto il dado perché tu vedessi
      il sei. Qui sotto vuol dire che ha già vinto, e che il resto è
      conversazione.
    opzioni:
      - testo: "Pagare il pedaggio"
        descrizione: "Il doppio, perché vieni dalla botola dei custodi, ma almeno è un prezzo onesto."
        requisiti: [monete >= 6]
        esito:
          titolo: Il pedaggio doppio
          testo: |
            Il vecchio fa sparire le monete con il palmo senza contarle. «Di là»
            dice, e uno dei tre ti accompagna fino al primo magazzino appeso.
          effetti: { monete: -6, profondita.gilda-sotto-il-ponte-dei-morti: 1 }
      - testo: "Trattare il pedaggio come uno del posto"
        descrizione: "Sotto i ponti ogni prezzo si tratta, e chi non tratta è un forestiero."
        requisiti: [monete >= 3]
        prova: { attributo: sociale, abilita: conoscenze-della-strada, difficolta: Media }
        successo:
          titolo: Un dado per uno
          testo: |
            Ti giochi il pedaggio con un tiro solo e perdi, ma chi gioca coi
            Lunghi paga la metà, e uno dei tre ti accompagna raccontandoti di sua
            sorella.
          pe: { conoscenze-della-strada: 3 }
          effetti: { monete: -3, profondita.gilda-sotto-il-ponte-dei-morti: 1 }
        fallimento:
          titolo: Il forestiero
          testo: |
            Il vecchio ti guarda come un pesce guarda un amo nudo e raddoppia il
            prezzo. Torni verso le scalette con le orecchie rosse.
          effetti: { rep.ponti: -0.5 }
      - testo: "Passare con la forza"
        descrizione: "Tre Lunghi su una piattaforma stretta, con il vuoto tutto intorno."
        combattimento: gilda-i-lunghi
        vittoria:
          titolo: La botte rovesciata
          testo: |
            Il primo Lungo finisce contro la botte e il secondo scivola giù per
            una catena. Il vecchio alza le mani e ti fa passare, con un rispetto
            che non ti fa piacere.
          effetti: { profondita.gilda-sotto-il-ponte-dei-morti: 1, rep.ponti: -0.5 }
        sconfitta:
          titolo: Appeso alla catena
          testo: |
            Ti ritrovi appeso a una catena con le gambe nel vuoto. Ti aiutano a
            risalire, perché un morto sotto i ponti è una seccatura per tutti, e
            ti rimandano verso le scalette.
          effetti: { ferite: 1, rep.ponti: -0.5 }
      - testo: "Salutarli con le parole dei ragazzi della corda"
        descrizione: "I Lunghi rispettano i ragazzi della corda anche quando ci fanno la guerra."
        quando: [origine.figlio-della-citta-bassa >= 1]
        requisiti: [monete >= 3]
        esito:
          titolo: Il saluto
          testo: |
            Li saluti come in Via del Salmone, con la mano sul coltello e il
            pollice alzato, e il vecchio ride. Ti fa pagare la metà. «I ragazzi
            della corda li conosco» dice, «pagano male e ridono bene.»
          effetti: { monete: -3, profondita.gilda-sotto-il-ponte-dei-morti: 1 }

  - id: gilda-sottoponti-le-lanterne
    immagine: ambientazione/ponte-dei-morti
    titolo: Le lanterne della veglia
    sommario: "Sotto le passerelle pendono fitte le lanterne dei Raschiatori, e bisogna passarci in mezzo senza toccarle."
    luogo: Sotto il Ponte dei Morti, sotto le lanterne
    area: gilda-sotto-il-ponte-dei-morti
    ripetibile: true
    requisiti: [fazione.gilda == 7, profondita.gilda-sotto-il-ponte-dei-morti == 1]
    testo: |
      Qui le lanterne dei Raschiatori pendono basse, ognuna con il suo
      cristallo acceso per un compagno rimasto nel Labirinto, così fitte che
      la passerella ci passa in mezzo come in un bosco di luci. Una si è
      impigliata nel corrimano e blocca il passaggio, e su una cassa
      all'imbocco una vecchia Raschiatrice ti guarda arrivare.

      {origine apprendista-raschiatore} Sul vetro della lanterna impigliata
      c'è un nome che conosci. Era della squadra di Dragna, e scendeva con
      te il primo anno.
    opzioni:
      - testo: "Passare sotto la lanterna senza toccarla"
        descrizione: "Piegarsi fino alle assi e passare, con le mani a posto."
        prova: { attributo: fisico, abilita: acrobazia, difficolta: Media }
        successo:
          titolo: Sotto la luce
          testo: |
            Passi sotto la lanterna con le ginocchia sulle assi e la schiena che
            ne sfiora il vetro caldo. La vecchia Raschiatrice annuisce, come a chi
            sa stare in chiesa.
          pe: { acrobazia: 3 }
          effetti: { profondita.gilda-sotto-il-ponte-dei-morti: 1, rep.raschiatori: 0.5 }
        fallimento:
          titolo: Il vetro
          testo: |
            La spalla urta la lanterna e la manda contro il pilone. Il vetro
            regge, ma la vecchia ti fa tornare indietro con un gesto.
          effetti: { rep.raschiatori: -0.5 }
      - testo: "Chiedere alla vecchia di farti passare"
        descrizione: "Lei veglia le lanterne e sa spostare una catena senza offendere nessuno."
        prova: { attributo: sociale, abilita: [empatia, galateo], difficolta: Media }
        successo:
          titolo: La catena spostata
          testo: |
            La vecchia ti dice il nome del Raschiatore e l'anno, e riappende la
            catena un palmo più in là. «Adesso passa» dice, «e prima di andartene
            dillo anche tu, il suo nome.»
          pe: { empatia: 3 }
          effetti: { profondita.gilda-sotto-il-ponte-dei-morti: 1, rep.raschiatori: 0.5 }
        fallimento:
          titolo: Il gettone
          testo: |
            Lei ti guarda il gettone della Gilda prima della faccia. «La Casa
            passa da sopra» dice, e torni verso le scalette.
          effetti: { rep.raschiatori: -0.5 }
      - testo: "Fare il giro largo, fuori dalle lanterne"
        descrizione: "Lungo il bordo esterno, dove il corrimano non c'è più."
        costo: 2
        esito:
          titolo: Il bordo
          testo: |
            Fai il giro sul bordo esterno con la schiena al vuoto, sotto lo
            sguardo della vecchia Raschiatrice.
          effetti: { profondita.gilda-sotto-il-ponte-dei-morti: 1 }
      - testo: "Dire il nome del compagno e spostare la catena"
        descrizione: "Lo conoscevi, e alla veglia si dice il nome prima di toccare la lanterna."
        quando: [origine.apprendista-raschiatore >= 1]
        esito:
          titolo: Il nome detto
          testo: |
            Dici il nome e l'anno ad alta voce come alla veglia, e la vecchia si
            alza in piedi. Sposti la catena di un palmo, e lei ti tocca il braccio
            quando passi.
          effetti: { profondita.gilda-sotto-il-ponte-dei-morti: 1, rep.raschiatori: 0.5 }

  # ------------------------------------------------------------ 1–2 · l'esattore degli Scuri
  - id: gilda-sottoponti-l-esattore
    immagine: fazioni/scuri
    titolo: L'esattore degli Scuri
    sommario: "Sulla passerella dei magazzini due uomini incappucciati riscuotono la quota degli Scuri, che prima riscuoteva Maedric."
    luogo: Sotto il Ponte dei Morti, la passerella dei magazzini
    area: gilda-sotto-il-ponte-dei-morti
    ripetibile: true
    requisiti: [fazione.gilda == 7, pista.pelle < 6, profondita.gilda-sotto-il-ponte-dei-morti >= 1, profondita.gilda-sotto-il-ponte-dei-morti <= 2]
    testo: |
      Sulla passerella dei magazzini due uomini con il cappuccio di tela
      grigia stanno appoggiati al corrimano, e chi passa lascia qualcosa
      nella mano del più basso. Un ragazzo gli lascia una moneta, e lui
      gliela rende perché è tosata.

      {conoscenze-della-strada Media} Prima riscuoteva Maedric, che teneva
      una parte per sé. Adesso riscuotono gli Scuri, e il prezzo è salito.

      Il più basso ti vede il gettone della Gilda e sorride con tutti i
      denti che gli restano.
    opzioni:
      - testo: "Passare in mezzo a loro"
        descrizione: "Sono in due su una passerella stretta, e conviene cominciare tu."
        combattimento: gilda-l-esattore
        vittoria:
          titolo: La passerella libera
          testo: |
            Il più alto finisce oltre il corrimano e si salva su una catena, il
            più basso scappa verso le scalette, e chi passa si riprende la sua
            quota dalla cassetta.
          effetti: { profondita.gilda-sotto-il-ponte-dei-morti: 1, rep.scuri: -0.5 }
        sconfitta:
          titolo: La quota
          testo: |
            Ti tengono con la faccia sulle assi finché non capisci chi comanda qui
            sotto, poi ti rimandano verso le scalette con un calcio.
          effetti: { ferite: 1, sospetto: 1 }
      - testo: "Spacciarti per un uomo di Maedric"
        descrizione: "Qualcuno degli uomini di Maedric torna ancora a prendere roba."
        prova: { attributo: sociale, abilita: ingannare, difficolta: Media }
        successo:
          titolo: La roba del custode
          testo: |
            Dici che vieni a prendere la roba del custode, e il più basso ti fa
            passare. «Salutalo da parte nostra» dice, «e digli che la quota adesso
            la riscuotiamo noi.»
          pe: { ingannare: 3 }
          effetti: { profondita.gilda-sotto-il-ponte-dei-morti: 1 }
        fallimento:
          titolo: Il nome sbagliato
          testo: |
            Il più alto ti chiede il nome della sorella di Maedric, che non sai.
            Ti rimandano indietro, e stasera alla Pignatta sapranno che uno della
            Gilda gira qui sotto.
          effetti: { sospetto: 1.5 }
      - testo: "Pagare la quota"
        descrizione: "Gli Scuri sapranno che la Gilda paga anche qui."
        requisiti: [monete >= 4]
        esito:
          titolo: Una moneta in mano
          testo: |
            Il più basso guarda le monete alla luce di una lanterna e ti fa
            passare, e il più alto ti sussurra che i custodi della Gilda prima o
            poi pagano sempre volentieri.
          effetti: { monete: -4, rep.scuri: 0.5, profondita.gilda-sotto-il-ponte-dei-morti: 1 }

  # ------------------------------------------------------------ 2 · i magazzini appesi
  - id: gilda-sottoponti-le-botti-raschiate
    immagine: icone/barrel
    titolo: Le botti raschiate
    sommario: "In un magazzino appeso ci sono botti della Gilda con il nodo raschiato via, come quelle del magazzino di ponente."
    luogo: Sotto il Ponte dei Morti, un magazzino appeso
    area: gilda-sotto-il-ponte-dei-morti
    ripetibile: true
    requisiti: [fazione.gilda == 7, profondita.gilda-sotto-il-ponte-dei-morti == 2]
    testo: |
      Il magazzino è una scatola di assi appesa a quattro catene, con il
      lucchetto rotto. Dentro ci sono una ventina di botti con il nodo della
      Gilda raschiato via, come sulle casse del magazzino di ponente dopo il
      Festival.

      {percezione Media} Sotto la raschiatura si legge ancora un pezzo di
      numero di lotto della Casa dei Nodi, nella grafia stretta di un
      ispettore.

      Fra le botti un sentiero di impronte porta a una porticina in fondo,
      su una passerella più bassa.
    opzioni:
      - testo: "Leggere i numeri di lotto"
        descrizione: "Mezzi raschiati, ma con la luce giusta si ricostruiscono."
        prova: { attributo: mentale, abilita: [percezione, politica-ed-economia], difficolta: Media }
        successo:
          titolo: I lotti di Cosimo
          testo: |
            Inclini una botte verso la luce e ricostruisci il numero cifra per
            cifra. È un lotto del Festival, segnato da Cosimo Venn nel suo libro
            come *razzia*, e te lo copi sul polsino della camicia.
          pe: { percezione: 3 }
          effetti: { profondita.gilda-sotto-il-ponte-dei-morti: 1, informazioni.pettegolezzo: 1 }
        fallimento:
          titolo: Le cifre mangiate
          testo: |
            Le cifre sono raschiate troppo a fondo, e una botte ti rotola su un
            piede.
          effetti: { profondita.gilda-sotto-il-ponte-dei-morti: 1, ferite: 0.5 }
      - testo: "Aprire una botte"
        descrizione: "Quello che c'è dentro dice più di quello che c'è scritto fuori."
        prova: { attributo: mentale, abilita: [tecnologia, natura], difficolta: Media }
        successo:
          titolo: Cristalli nella crusca
          testo: |
            Sotto un palmo di crusca ci sono cristalli senza timbro, imballati uno
            per uno nella paglia. Ne prendi uno, perché è una prova che si porta
            in tasca.
          pe: { tecnologia: 3 }
          effetti: { profondita.gilda-sotto-il-ponte-dei-morti: 1, cristalli.cristallo-sterile: 1 }
        fallimento:
          titolo: Il coperchio
          testo: |
            Il coperchio salta e la crusca finisce sulle assi, dove resta come una
            traccia per chiunque passi dopo di te.
          effetti: { profondita.gilda-sotto-il-ponte-dei-morti: 1, sospetto: 1 }
      - testo: "Seguire le impronte senza fermarsi"
        descrizione: "Le impronte vanno verso la casa che cerchi."
        costo: 2
        esito:
          titolo: Le impronte
          testo: |
            Segui le impronte fino alla passerella più bassa, tornando indietro
            ogni volta che si perdono.
          effetti: { profondita.gilda-sotto-il-ponte-dei-morti: 1 }

  - id: gilda-sottoponti-la-fune-segata
    immagine: icone/rope-coil
    titolo: La fune segata
    sommario: "Una passerella pende di traverso, con una fune portante segata a metà."
    luogo: Sotto il Ponte dei Morti, fra i magazzini appesi
    area: gilda-sotto-il-ponte-dei-morti
    ripetibile: true
    requisiti: [fazione.gilda == 7, profondita.gilda-sotto-il-ponte-dei-morti == 2]
    testo: |
      La passerella fra due magazzini appesi pende di traverso, e il
      corrimano dalla parte bassa sfiora il vuoto. Una delle quattro funi
      portanti è segata a metà, e regge con le fibre che restano.

      {tecnologia Media} Il taglio è dritto, fatto con un segaccio da funi
      come quelli dei chiattaioli. Qualcuno voleva che la passerella
      reggesse ancora un po' e poi cedesse sotto il peso giusto.

      Più in basso, nella nebbia, si vede la sagoma di un'altra passerella.
    opzioni:
      - testo: "Attraversare dalla parte alta"
        descrizione: "Con il peso sulla fune buona, e in fretta."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Media }
        successo:
          titolo: Dalla parte alta
          testo: |
            La fune segata canta sotto il tuo peso ma regge. Dall'altra parte
            pensi che a segarla così ci vuole uno che conosce le funi.
          pe: { atletica: 3 }
          effetti: { profondita.gilda-sotto-il-ponte-dei-morti: 1 }
        fallimento:
          titolo: La fune che cede
          testo: |
            A metà la fune segata cede e la passerella si gira di lato. Risali a
            forza di braccia fino al magazzino da cui eri partito.
          effetti: { ferite: 1 }
      - testo: "Legare la fune prima di passare"
        descrizione: "Un nodo da carico sopra il taglio, e la fune regge quasi come nuova."
        prova: { attributo: mentale, abilita: [tecnologia, accademiche], difficolta: Media }
        successo:
          titolo: Il nodo sopra il taglio
          testo: |
            Fai un nodo da carico sopra il taglio e la passerella si raddrizza di
            un palmo. Dall'altra parte lasci il nodo per chi passa dopo.
          pe: { tecnologia: 3 }
          effetti: { profondita.gilda-sotto-il-ponte-dei-morti: 1, rep.ponti: 0.5 }
        fallimento:
          titolo: Il nodo che scivola
          testo: |
            Il nodo scivola sulla fune bagnata e ti brucia i palmi, e torni
            indietro a cercare un'altra strada.
          effetti: { ferite: 0.5 }
      - testo: "Scendere alla passerella di sotto"
        descrizione: "È più lunga e più buia, ma le sue funi sono intere."
        costo: 2
        esito:
          titolo: Di sotto
          testo: |
            Ti cali lungo una catena sulla passerella di sotto, che gira intorno a
            due piloni, e risali oltre la fune segata con le mani nere di catrame.
          effetti: { profondita.gilda-sotto-il-ponte-dei-morti: 1 }
      - testo: "Fare il nodo come sulla Cicatrice"
        descrizione: "Sulle piattaforme una fune segata si lega appesi, con una mano sola."
        quando: [origine.apprendista-raschiatore >= 1]
        esito:
          titolo: Una mano
          testo: |
            Appeso al corrimano, fai sopra il taglio il nodo dei Raschiatori,
            quello che regge anche bagnato, e attraversi in sei passi.
          pe: { tecnologia: 3 }
          effetti: { profondita.gilda-sotto-il-ponte-dei-morti: 1, rep.ponti: 0.5 }

  # ------------------------------------------------------------ 2–3 · il balestriere di guardia
  - id: gilda-sottoponti-il-balestriere-di-guardia
    immagine: icone/crossbow
    titolo: Il balestriere di guardia
    sommario: "All'imbocco della campata senza lanterne siede un balestriere di Maedric."
    luogo: Sotto il Ponte dei Morti, all'imbocco della campata cieca
    area: gilda-sotto-il-ponte-dei-morti
    ripetibile: true
    requisiti: [fazione.gilda == 7, profondita.gilda-sotto-il-ponte-dei-morti >= 2, profondita.gilda-sotto-il-ponte-dei-morti <= 3]
    testo: |
      Dove finiscono le lanterne, all'imbocco di una campata buia, un uomo
      con il mantello dei Custodi siede su una cassa con una balestra
      leggera sulle ginocchia, e mangia castagne secche da un sacchetto. È
      uno dei balestrieri di Maedric Holl.

      {empatia Media} Mangia le castagne una alla volta, contandole. Non sa
      da chi prenderà la paga del mese.
    opzioni:
      - testo: "Strisciargli alle spalle nella nebbia"
        descrizione: "Fra un'ondata di nebbia e l'altra c'è il tempo di dieci passi."
        prova: { attributo: fisico, abilita: furtivita, difficolta: Media }
        successo:
          titolo: Dieci passi
          testo: |
            Ti muovi con le ondate di nebbia, dieci passi alla volta, e lo lasci a
            masticare castagne alle tue spalle.
          pe: { furtivita: 3 }
          effetti: { profondita.gilda-sotto-il-ponte-dei-morti: 1 }
        fallimento:
          titolo: Il dardo nel pilone
          testo: |
            La nebbia si dirada e il dardo si pianta nel pilone accanto alla tua
            testa. Torni di corsa fra le lanterne.
          effetti: { ferite: 0.5, sospetto: 1 }
      - testo: "Disarmarlo prima che tiri"
        descrizione: "Una balestra leggera tira una volta, e dopo è un bastone."
        combattimento: gilda-il-balestriere-di-guardia
        vittoria:
          titolo: Le castagne
          testo: |
            La balestra finisce nella Cicatrice insieme alle castagne. Lui alza le
            mani e ti dice che la paga non gliel'ha data nessuno, e che per lui
            puoi passare.
          effetti: { profondita.gilda-sotto-il-ponte-dei-morti: 1 }
        sconfitta:
          titolo: Il dardo nella spalla
          testo: |
            Il dardo ti prende di striscio alla spalla e il calcio della balestra
            fa il resto. Ti trascini indietro fra le lanterne.
          effetti: { ferite: 1 }
      - testo: "Offrirgli la paga del mese"
        descrizione: "Maedric ha smesso di pagarlo, e tu puoi farlo al posto suo."
        requisiti: [monete >= 8]
        esito:
          titolo: La paga
          testo: |
            Conta le monete come le castagne, poi si mette la balestra a tracolla
            e se ne va. Prima di sparire ti dice che la casa è in fondo alla
            campata, e che la porta si apre tirando.
          effetti: { monete: -8, profondita.gilda-sotto-il-ponte-dei-morti: 1 }

  # ------------------------------------------------------------ 3 · la campata cieca
  - id: gilda-sottoponti-la-campata-cieca
    immagine: ambientazione/ponte-dei-morti
    titolo: La campata cieca
    sommario: "Una campata senza lanterne, buia come l'interno di un pugno, e in fondo la casa di Maedric."
    luogo: Sotto il Ponte dei Morti, la campata cieca
    area: gilda-sotto-il-ponte-dei-morti
    ripetibile: true
    requisiti: [fazione.gilda == 7, profondita.gilda-sotto-il-ponte-dei-morti == 3]
    testo: |
      La campata cieca è una passerella lunga sotto un tratto di ponte dove
      i Raschiatori non appendono lanterne. Il buio è completo, e sale da
      sotto il vento freddo della Cicatrice. In fondo, molto lontano, c'è un
      filo di luce gialla, sottile come una crepa in una porta.

      {furtivita Media} Nel buio i rumori arrivano da più lontano. Se tu
      senti il vento, chi sta in fondo sente te.
    opzioni:
      - testo: "Avanzare al buio, con la mano sul corrimano"
        descrizione: "Un passo alla volta, senza rumore, verso il filo di luce."
        prova: { attributo: fisico, abilita: [furtivita, resistenza], difficolta: Media }
        successo:
          titolo: Il filo di luce
          testo: |
            Avanzi tastando le assi, e il filo di luce cresce fino a diventare la
            fessura di una porta. La casa è appesa sotto il ponte con quattro
            catene, come una lanterna enorme.
          pe: { furtivita: 3 }
          effetti: { profondita.gilda-sotto-il-ponte-dei-morti: 1 }
        fallimento:
          titolo: L'asse che manca
          testo: |
            Un'asse manca e il piede trova il vuoto. Ti salvi al corrimano, ma il
            rumore rotola fino in fondo e la luce si spegne.
          effetti: { ferite: 0.5 }
      - testo: "Contare le assi a voce bassa"
        descrizione: "Una campata ha un numero di assi, e quella che manca si sente prima di cadere."
        prova: { attributo: mentale, abilita: [percezione, resilienza], difficolta: Media }
        successo:
          titolo: Centoquattordici
          testo: |
            Alla centoquattordicesima asse il piede trova il vuoto e la salti.
            Poco dopo sei davanti alla porta di una casa appesa sotto il ponte con
            quattro catene.
          pe: { percezione: 3 }
          effetti: { profondita.gilda-sotto-il-ponte-dei-morti: 1 }
        fallimento:
          titolo: Il conto perso
          testo: |
            Perdi il conto due volte, e torni verso le lanterne a passo svelto.
          effetti: { tormento: 1 }
      - testo: "Avanzare carponi"
        descrizione: "Carponi ci si sporca e ci si mette molto, però non si cade."
        costo: 2
        esito:
          titolo: Carponi
          testo: |
            Avanzi carponi tastando ogni asse, e arrivi alla porta della casa
            appesa con le ginocchia scorticate e la faccia nera di catrame.
          effetti: { profondita.gilda-sotto-il-ponte-dei-morti: 1 }
      - testo: "Aprire di un dito la lanterna cieca"
        descrizione: "Una lanterna che fa luce per un dito, ed è tutto quello che serve."
        requisiti: [chiave.notte-sui-ponti >= 1]
        costo: 0
        esito:
          titolo: Un dito di luce
          testo: |
            Con lo sportello aperto di un dito vedi le assi una alla volta. Salti
            quella che manca e arrivi alla porta della casa appesa senza un
            rumore.
          effetti: { profondita.gilda-sotto-il-ponte-dei-morti: 1 }

  # ------------------------------------------------------------ il cuore · la casa appesa
  - id: gilda-sottoponti-la-casa-appesa
    immagine: personaggi/maedric-holl
    titolo: La casa appesa
    sommario: "In fondo alla campata cieca c'è una casa di assi appesa sotto il ponte, con la luce accesa."
    luogo: Sotto il Ponte dei Morti, la casa appesa di Maedric
    area: gilda-sotto-il-ponte-dei-morti
    requisiti: [fazione.gilda == 7, profondita.gilda-sotto-il-ponte-dei-morti >= 4]
    testo: |
      La casa di Maedric Holl è una stanza sola appesa sotto la campata
      cieca del Ponte dei Morti. Era l'indirizzo che Maedric dava alla Casa,
      e nessun ispettore ci era mai sceso.

      Dentro ci sono la branda, il tavolo con i libri impilati e il mantello
      cerato che gocciola da un chiodo. E c'è qualcuno.

      {percezione Media} I libri sono legati con lo spago accanto a una
      borsa di cuoio aperta, e chi è qui stava per portarli via.

      {origine figlio-della-citta-bassa} Da ragazzo ti dicevano che oltre le
      lanterne del Ponte dei Morti abitava l'uomo del mantello cerato.
    opzioni:
      - testo: "Affrontare Maedric e i suoi balestrieri"
        descrizione: "Maedric è tornato per i libri con due balestrieri, e le balestre tirano una volta."
        requisiti: [maedric <= 1]
        combattimento: gilda-maedric-e-i-balestrieri
        vittoria:
          titolo: Il mantello cerato
          testo: |
            I balestrieri cadono nello spazio stretto fra la branda e il tavolo, e
            Maedric apre le imposte alle sue spalle. «I ponti di notte non sono i
            ponti di giorno» dice, e si lascia cadere nel vuoto aggrappato a una
            corda legata lì da anni, lasciando i libri sul tavolo.
          segue: gilda-sottoponti-il-secondo-libro
        sconfitta:
          titolo: La porta che si chiude
          testo: |
            Un dardo ti prende alla gamba e un balestriere ti spinge fuori. Torni
            zoppicando fino alla botola, con il sangue nello stivale.
          effetti: { ferite: 1 }
          vai: ponti-sospesi
      - testo: "Trattare con Maedric"
        descrizione: "Maedric lavora a tariffa con tutti, e anche la sua fuga ha un prezzo."
        requisiti: [maedric <= 1]
        prova: { attributo: sociale, abilita: [persuasione, conoscenze-della-strada], difficolta: Difficile }
        successo:
          titolo: La tariffa
          testo: |
            Gli dici che i suoi vecchi soci lo cercano, e che solo tu lo lascerai
            andare. «La tariffa è giusta» dice Maedric, e spinge i libri verso di
            te con due dita. Poi scende dalla finestra lungo una corda annodata, e
            sui ponti non lo vedrai più.
          pe: { persuasione: 5 }
          segue: gilda-sottoponti-il-secondo-libro
        fallimento:
          titolo: Il prezzo sbagliato
          testo: |
            Maedric sorride appena. «Hai sbagliato il conto» dice, e fa un cenno
            ai balestrieri. Torni alla botola con un livido sulla fronte.
          effetti: { ferite: 0.5 }
          vai: ponti-sospesi
      - testo: "Affrontare il balestriere con la toppa"
        descrizione: "La casa la tengono tre uomini di Maedric, che non sanno più per chi."
        requisiti: [maedric >= 2]
        combattimento: gilda-la-casa-appesa
        vittoria:
          titolo: La toppa sulla fodera
          testo: |
            Nello spazio stretto le balestre servono a poco, e gli altri due
            scappano dalla finestra. Il balestriere con la toppa sulla fodera
            resta sulla branda con le mani alzate. «Tanto non c'era più nessuno a
            pagarci» dice, e ti indica i libri.
          segue: gilda-sottoponti-il-secondo-libro
        sconfitta:
          titolo: Fuori dalla porta
          testo: |
            Il calcio di una balestra ti rimanda sulla passerella, e torni
            zoppicando fino alla botola.
          effetti: { ferite: 1 }
          vai: ponti-sospesi
      - testo: "Parlare al balestriere con la toppa"
        descrizione: "Quella toppa gliel'ha cucita qualcuno che gli vuole bene."
        requisiti: [maedric >= 2]
        prova: { attributo: sociale, abilita: empatia, difficolta: Media }
        successo:
          titolo: Chi l'ha cucita
          testo: |
            La toppa gliel'ha cucita sua madre, che vive in Città Bassa e crede
            che lui faccia il custode. Manda via gli altri due e ti lascia i
            libri. «Diglielo tu, alla Casa, che non ho preso niente» dice, e se ne
            va.
          pe: { empatia: 5 }
          segue: gilda-sottoponti-il-secondo-libro
        fallimento:
          titolo: Non sono affari tuoi
          testo: |
            «Non sono affari tuoi» dice, e la balestra si alza con lui. Esci
            camminando all'indietro e torni fino alla botola.
          effetti: { tormento: 1 }
          vai: ponti-sospesi
      - testo: "Tornare indietro fino alla botola"
        descrizione: "La casa appesa resta qui, e si può tornare con più forze."
        costo: 0
        esito:
          titolo: Indietro
          testo: |
            Richiudi piano la porta e torni per la campata cieca, con la luce
            gialla della casa che si fa sempre più piccola alle spalle.
          vai: ponti-sospesi

  - id: gilda-sottoponti-il-secondo-libro
    immagine: icone/notebook
    titolo: Il secondo libro
    tipo: seguito
    luogo: Sotto il Ponte dei Morti, la casa appesa di Maedric
    area: gilda-sotto-il-ponte-dei-morti
    requisiti: [fazione.gilda == 7]
    testo: |
      I libri sul tavolo sono due. Il primo è un registro di pelle come
      quello che conosci; il secondo è un quaderno in chiaro, nella grafia
      di Maedric, con sei anni di pagamenti degli Scuri entrati nella Casa
      dei Nodi dai magazzini di scarico di Ansaldo Morlacchi, come noli mai
      fatti. Ogni mese una parte usciva verso tre banchi della Casa, e
      accanto a ogni somma ci sono la data e il nome del funzionario.

      {politica-ed-economia Media} Con questo quaderno Elleri non ha più
      niente da spiegare, e le date tornano con quelle dei noli fantasma
      dell'archivio.

      Accanto ai libri c'è una lanterna di latta con lo sportello a scatto,
      e sotto la branda una cassa di rotoli di monete e cristalli carichi
      senza timbro.

      {origine mercante-dei-ponti} Il nome dei magazzini di scarico l'hai
      letto su tutte le bolle del tuo banco, e ogni volta il nolo ti
      sembrava caro.
    opzioni:
      - testo: "Portare via i libri e il bottino"
        descrizione: "Anche i rotoli di monete e i cristalli, che agli Scuri mancheranno."
        requisiti: [pista.pelle < 6]
        esito:
          titolo: Tutto sotto la giubba
          testo: |
            Metti i libri sotto la giubba e il resto nella borsa di Maedric. Fuori
            dalla botola Teo Marsan conta i libri tre volte, e prima di sera alla
            Pignatta sapranno chi ha svuotato la casa appesa.
          effetti: { oggetto.gilda-lanterna-cieca-di-maedric: 1, monete: 25, cristalli.cristallo-carico: 2, rep.scuri: -1, racconto: 1, rep.gilda: 0.5, fazione.gilda: 1 }
          vai: ponti-sospesi
      - testo: "Portare via i libri e il bottino"
        descrizione: "Gli Scuri non ci sono più a reclamare il bottino."
        requisiti: [pista.pelle >= 6]
        esito:
          titolo: Tutto sotto la giubba
          testo: |
            Metti i libri sotto la giubba e il resto nella borsa di Maedric. Fuori
            dalla botola Teo Marsan ti aspetta con la lanterna alzata e conta i
            libri tre volte.
          effetti: { oggetto.gilda-lanterna-cieca-di-maedric: 1, monete: 25, cristalli.cristallo-carico: 2, racconto: 1, rep.gilda: 0.5, fazione.gilda: 1 }
          vai: ponti-sospesi
      - testo: "Prendere i libri e la lanterna, e lasciare il resto ai sottoponti"
        descrizione: "Le monete e i cristalli restano nella cassa, e qualcuno dei sottoponti se ne ricorderà."
        esito:
          titolo: La cassa aperta
          testo: |
            Lasci la cassa aperta, e sulla passerella dici alla vecchia
            Raschiatrice delle lanterne, o a una che le somiglia, dove guardare.
            Fuori dalla botola Teo Marsan conta i libri tre volte.
          effetti: { oggetto.gilda-lanterna-cieca-di-maedric: 1, rep.ponti: 1, rep.raschiatori: 0.5, racconto: 1, rep.gilda: 0.5, fazione.gilda: 1 }
          vai: ponti-sospesi
