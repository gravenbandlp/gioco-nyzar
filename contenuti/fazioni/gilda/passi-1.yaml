# La quest della Gilda, passi 1-5 (fazione.gilda 0 → 5). Vedi quest.yaml per le quality.
# 1 L'avviso di Lira (0 → 1): l'avviso al gabbiotto delle Mille Corde e la mattina al banco di Varn Kett, con il
#   carrettiere dal doppio fondo, poi la vedova e il sacerdote del Velo (seguito). Aperto a tutti dopo il prologo.
# 2 Le casse del Festival (1 → 2): il magazzino forzato durante la razzia, Cosimo Venn e Ormun Pell. Fra le travi
#   i ragazzi della corda (seguito). L'ammanco va a Cosimo (gilda.ammanco 1) o a Lira (2, il primo voto).
# 3 Il nodo di cera (2 → 3): la fune dei soci alla Casa dei Nodi e il padrino (gilda.padrino). Il nodo davanti ai
#   soci (seguito) dà il grado I, Socio di corda.
# 4 La pista di Laresh (3 → 4): i sei carri sulla Superficie e la spedizione (spedizione-laresh.yaml).
# 5 Timbri di notte (4 → 5): i cristalli sterili di Ambrin Qell (gilda.cristalli), poi alla Casa dei Nodi il
#   cassetto di Marzio Elleri e la scelta fra Varn e il silenzio (gilda.timbri).
quality:
  - { id: gilda.cristalli, nome: I cristalli sterili di Ambrin, categoria: stato, nascosta: true, descrizione: "1 dopo aver visto i cristalli timbrati e sterili del Nodo d'Ossidiana." }
  - { id: gilda.cassetto, nome: Il cassetto di Elleri, categoria: stato, nascosta: true, descrizione: "1 quando sai da quale cassetto escono i timbri falsi." }

storylet:
  # ------------------------------------------------------------ passo 1 · l'avviso di Lira
  - id: gilda-l-avviso-di-lira
    presso: ponte-delle-mille-corde
    immagine: personaggi/lira-demos
    titolo: L'avviso di Lira
    sommario: "La Gilda cerca aspiranti soci, e Varn Kett li mette alla prova con una mattina al suo banco."
    luogo: Imbocco del Ponte delle Mille Corde, all'alba
    area: ponti-sospesi
    requisiti: [fazione.gilda == 0, prologo == 0, pista.capomozzo >= 10]
    testo: |
      Sul fianco del gabbiotto dei Custodi, all'imbocco delle Mille Corde,
      c'è un foglio con il sigillo verde della Gilda e la colla ancora
      lucida agli angoli. La Casa dei Nodi cerca aspiranti soci di buona
      fama. Le domande si portano a Lira Demos all'archivio dei dazi, e la
      prima prova la dà l'ispettore Kett al banco la mattina dopo.

      La mattina dopo Lira è appoggiata allo stipite del gabbiotto, con un
      rotolo di avvisi sotto il braccio e i fili di rame della treccia che
      prendono la luce dell'alba. «Alla Casa servono braccia oneste, che sui
      ponti sono più rare del lyssan» ti dice. «Oggi lavori al banco con
      Varn, e stasera lui mi dice se valgono qualcosa.»

      Dentro il gabbiotto Varn Kett ti indica uno sgabello senza alzare gli
      occhi, e con la destra scrive qualcosa sull'aria. All'imbocco c'è già
      il primo carro, un carro di sale tirato da due muli, con il
      carrettiere che sbadiglia apposta e le ruote che affondano nelle assi
      più di quanto dovrebbero sei sacchi di sale.

      {origine mercante-dei-ponti} Varn ti conosce dal registro, perché la
      tua commissione passa da questo banco ogni mese, e ti mette davanti la
      penna vera, quella che di solito non presta.
    opzioni:
      - testo: "Guardare sotto il carro"
        descrizione: "Un fondo che sta troppo in alto si vede dalle assi, se ti chini abbastanza."
        prova: { attributo: mentale, abilita: percezione, difficolta: Media }
        successo:
          titolo: Il doppio fondo
          testo: |
            Ti chini fino a sentire l'odore del legno bagnato e vedi una spanna di
            troppo fra l'assale e il pianale, chiodato di fresco. Sotto le nocche
            il pianale suona vuoto, e sotto il sale ci sono quattro casse di
            cristalli senza timbro.

            Varn scrive due righe sull'aria. «Il sale passa» dice al carrettiere,
            «e le casse restano qui.»
          pe: { percezione: 3 }
          segue: gilda-il-banco-di-varn
        fallimento:
          titolo: Sei sacchi di sale
          testo: |
            Fra le ruote vedi soltanto fango e paglia, e fai segno al carrettiere
            di passare. Varn esce dal gabbiotto e batte due volte le nocche sul
            pianale, che suona vuoto come una botte; sotto il sale ci sono quattro
            casse di cristalli senza timbro.

            Rientra senza dirti niente e scrive sull'aria una riga sola, molto
            corta.
          segue: gilda-il-banco-di-varn
          effetti: { scandalo: 0.5 }
      - testo: "Fare scaricare il carro"
        descrizione: "Un carrettiere che sbadiglia apposta ha qualcosa da nascondere, e basta farglielo capire."
        prova: { attributo: sociale, abilita: intimidire, difficolta: Media }
        successo:
          titolo: Scarica
          testo: |
            Ti pianti davanti ai muli e gli dici di scaricare sacco per sacco, con
            la calma di uno che ha tempo fino a sera. Lui ride, poi guarda la coda
            dei carri alle sue spalle e al quarto sacco ti indica il doppio fondo
            con il mento. Sotto ci sono quattro casse di cristalli senza timbro.

            Varn ti guarda a lungo, e con la mano scrive sull'aria una riga lunga.
          pe: { intimidire: 3 }
          segue: gilda-il-banco-di-varn
        fallimento:
          titolo: La coda
          testo: |
            Il carrettiere scarica con una lentezza perfetta, un sacco alla volta, mentre la coda
            dei carri si allunga fino alla piattaforma dei bottai e qualcuno comincia a gridarti
            dietro parole che conosce benissimo. Alla fine è Varn a uscire a battere sul pianale, e
            a trovare le casse.
          effetti: { rep.ponti: -0.5, scandalo: 0.5 }
          segue: gilda-il-banco-di-varn
      - testo: "Fare due conti sul carico"
        descrizione: "Il sale pesa sempre uguale e le ruote affondano secondo il carico, e i numeri non sbadigliano."
        prova: { attributo: mentale, abilita: politica-ed-economia, difficolta: Media }
        successo:
          titolo: Il conto delle ruote
          testo: |
            Chiedi al carrettiere quanto ha pagato il sale a Laresh e quanto pensa
            di venderlo al Mercato dei Nodi, e i due numeri insieme non danno un
            guadagno che valga il viaggio. Lui si gratta la nuca e ti indica il
            doppio fondo, dove ci sono quattro casse di cristalli senza timbro.

            Varn rifà il conto sull'aria con le dita, e gli torna.
          pe: { politica-ed-economia: 3 }
          segue: gilda-il-banco-di-varn
        fallimento:
          titolo: I conti degli altri
          testo: |
            Il carrettiere ti dà così tanti prezzi, e con tanta precisione, che
            alla fine il suo viaggio ti sembra un affare, e lo lasci passare. Varn
            lo ferma con un fischio e trova le casse battendo sul pianale, senza
            dire una parola.
          effetti: { rep.ponti: -0.5, scandalo: 0.5 }
          segue: gilda-il-banco-di-varn
      - testo: "Recitargli il regolamento dei carichi"
        descrizione: "I carrettieri sanno che chi recita a memoria le formule della Gilda le ha anche usate."
        quando: [origine.mercante-dei-ponti >= 1]
        esito:
          titolo: Articolo sette
          testo: |
            Gli reciti l'articolo sui carichi misti, quello che a un mercante dei
            Ponti insegnano prima di contare, con la voce annoiata di un vecchio
            banconiere. Arrivato alle confische il carrettiere ti ferma con la
            mano e ti indica il doppio fondo, con quattro casse di cristalli senza
            timbro.

            Varn ti guarda da sopra la spalla, e per un momento la sua mano resta
            ferma.
          pe: { politica-ed-economia: 3 }
          segue: gilda-il-banco-di-varn

  - id: gilda-il-banco-di-varn
    presso: ponte-delle-mille-corde
    immagine: personaggi/varn-kett
    titolo: Il banco di Varn
    tipo: seguito
    luogo: Imbocco del Ponte delle Mille Corde, a mezzogiorno
    area: ponti-sospesi
    requisiti: [fazione.gilda == 0]
    testo: |
      Il gabbiotto cuoce sotto la lamiera di mezzogiorno, e Varn non si toglie il cappotto color tabacco.
      Davanti al banco arrivano insieme una vedova con un cesto di pane caldo per il Mercato dei Nodi,
      senza la moneta della gabella, e un sacerdote del Velo in tunica grigia, che non paga perché il
      Velo, dice, non paga i ponti che garantisce.

      {galateo Media} Il sacerdote ha la tunica stirata e i sandali nuovi, e si è vestito per questa
      discussione più che per la strada.

      Varn ti spinge davanti il regolamento della Gilda, un libro con la costola rotta che si apre da solo
      sulle pagine più usate, e incrocia le braccia.

      {origine accolito-del-velo} La tunica grigia è quella delle parrocchie basse. Sai quali parole usa
      la Cattedrale quando un suo uomo sbaglia in pubblico, e questo non le ha mai sentite.
    opzioni:
      - testo: "Esentare la vedova con il regolamento"
        descrizione: "Da qualche parte nel libro della Gilda c'è un articolo per il pane, da trovare prima che si raffreddi."
        prova: { attributo: mentale, abilita: politica-ed-economia, difficolta: Facile }
        successo:
          titolo: L'articolo del pane
          testo: |
            L'articolo è fra le norme sulle granaglie, e dice che il pane fresco
            portato a mano per la vendita del giorno passa senza gabella. La
            vedova passa, e il sacerdote, davanti a un libro aperto, paga per non
            restare l'unico a discutere.

            Varn scrive il tuo nome sull'aria. La sera Lira ti mette in mano
            qualche moneta e un biglietto per i magazzini della Gilda.
          pe: { politica-ed-economia: 3 }
          effetti: { monete: 5, rep.gilda: 0.5, fazione.gilda: 1 }
        fallimento:
          titolo: Il libro che si apre da solo
          testo: |
            Il libro continua ad aprirsi da solo sulle pagine sbagliate, e il pane
            si raffredda. Alla fine Varn gira tre pagine fino all'articolo del
            pane fresco. La vedova passa, e il sacerdote paga borbottando.

            La sera Lira ti dà qualche moneta e un biglietto per i magazzini, e ti
            dice che Varn ti ha scritto, ma più piccolo.
          effetti: { monete: 5, fazione.gilda: 1, scandalo: 0.5 }
      - testo: "Pagare tu la gabella della vedova"
        descrizione: "Una moneta è una moneta, e il pane si raffredda."
        requisiti: [monete >= 2]
        esito:
          titolo: Di tasca tua
          testo: |
            Metti la moneta sul banco prima che Varn possa dire qualcosa. La
            vedova ti lascia nel palmo una pagnotta piccola ancora calda, e il
            sacerdote, visto uno sconosciuto pagare per una donna del popolo,
            mette mano alla borsa anche lui.

            Varn annota sull'aria qualcosa che non è una cifra. La sera Lira ti dà
            la paga della giornata e un biglietto per i magazzini della Gilda.
          effetti: { monete: 3, rep.gilda: 0.5, rep.ponti: 0.5, fazione.gilda: 1 }
      - testo: "Convincere il sacerdote con garbo"
        descrizione: "Il Velo garantisce il Patto delle Corde dal 127, e lui ama i buoni esempi."
        prova: { attributo: sociale, abilita: galateo, difficolta: Media }
        successo:
          titolo: Il buon esempio
          testo: |
            Gli dici, con l'inchino corto delle parrocchie, che una garanzia vale
            di più quando chi la dà paga per primo. Lui se ne accorge e paga
            davanti alla coda, con un gesto largo, mentre Varn fa passare la
            vedova con due dita.

            La sera Lira ti dà qualche moneta e un biglietto per i magazzini.
            «Varn dice che parli come un notaio» riferisce, e sembra un
            complimento.
          pe: { galateo: 3 }
          effetti: { monete: 5, rep.gilda: 0.5, fazione.gilda: 1 }
        fallimento:
          titolo: Il garante
          testo: |
            Gli parli del Patto delle Corde, e lui ti corregge su una data e su un
            nome e ti spiega il Patto per un quarto d'ora, mentre la coda si
            allunga. Alla fine Varn lo fa passare gratis per liberare il ponte.

            La sera Lira ti dà la paga della giornata e il biglietto per i
            magazzini, e non ti riferisce niente.
          effetti: { monete: 5, scandalo: 1, fazione.gilda: 1 }
      - testo: "Fargli vergogna davanti alla coda"
        descrizione: "Se dici forte che il sacerdote passa gratis e la vedova paga il pane, la coda ti sente."
        prova: { attributo: sociale, abilita: intimidire, difficolta: Media }
        successo:
          titolo: La coda ascolta
          testo: |
            Dici ad alta voce che il Velo non paga i ponti mentre le vedove pagano
            il pane, e la coda comincia a mormorare. Il sacerdote paga, rosso fino
            alle orecchie, e se ne va senza benedire nessuno; la vedova passa con
            il suo pane.

            La sera Lira ti dà qualche moneta e il biglietto per i magazzini, e ti
            avverte che in Cattedrale il tuo nome lo sanno già.
          pe: { intimidire: 3 }
          effetti: { monete: 5, rep.gilda: 0.5, rep.velo: -0.5, fazione.gilda: 1 }
        fallimento:
          titolo: La coda ride
          testo: |
            Il sacerdote alza la voce più di te, e la coda ride di tutti e due.
            Varn esenta la vedova con l'articolo del pane e fa pagare il sacerdote
            con tre parole a voce bassa.

            La sera Lira ti dà la paga e il biglietto per i magazzini, e ti
            consiglia di stare lontano dalla Cattedrale per qualche giorno.
          effetti: { monete: 5, rep.velo: -0.5, fazione.gilda: 1, sospetto: 0.5 }
      - testo: "Parlare al sacerdote da confratello"
        descrizione: "In Cattedrale ti hanno insegnato come si richiama un fratello senza farlo davanti a tutti."
        quando: [origine.accolito-del-velo >= 1]
        esito:
          titolo: A bassa voce
          testo: |
            Gli dici due parole all'orecchio, con la formula che la Madre usa per
            i sacerdoti che dimenticano di essere ospiti in città. Lui ti guarda
            le mani prima della faccia, riconosce il modo in cui le tieni e paga
            senza discutere.

            Varn scrive il tuo nome sull'aria, e la sera Lira ti mette in mano
            qualche moneta e un biglietto per i magazzini della Gilda.
          pe: { galateo: 3 }
          effetti: { monete: 5, rep.gilda: 0.5, fazione.gilda: 1 }

  # ------------------------------------------------------------ passo 2 · le casse del Festival
  - id: gilda-le-casse-del-festival
    immagine: ambientazione/ponti-sospesi
    titolo: Le casse del Festival
    sommario: "Lira ti manda a un magazzino forzato la notte della razzia, dove l'ispettore Cosimo Venn vuole chiudere l'inventario."
    luogo: Ponti Sospesi, un magazzino della Gilda sulla campata di ponente
    area: ponti-sospesi
    requisiti: [fazione.gilda == 1]
    testo: |
      Il magazzino è una baracca lunga appesa sotto la campata di ponente,
      con una porta nuova di legno chiaro al posto di quella che gli orchi
      hanno sfondato la notte del Festival. Dentro, le casse sono impilate
      fino alle travi, ognuna con il nodo della Gilda dipinto a stampo.

      Cosimo Venn, l'ispettore dei lotti, ti aspetta con il libro sotto il
      braccio e gli stivali puliti. «Inventario di quello che hanno portato
      via gli orchi, si chiude oggi così domani lo firmo» dice. Seduto su
      una cassa, Ormun Pell, il caposquadra dei ponteggiatori, guarda il
      soffitto, dove un passo leggero si ferma quando alzi la testa.

      {percezione Media} Su alcune casse vicino alla porta il nodo è stato
      raschiato via da poco, e il legno sotto è ancora chiaro. Un'orda in
      fuga si porta via quello che sta in braccio, e per queste ci voleva un
      carro.
    opzioni:
      - testo: "Contare le casse una per una"
        descrizione: "Il libro di Cosimo dice quante casse c'erano prima della razzia, e il resto è aritmetica."
        prova: { attributo: mentale, abilita: politica-ed-economia, difficolta: Media }
        successo:
          titolo: Il conto che non torna
          testo: |
            Conti le casse una fila alla volta con il libro di Cosimo aperto sulla
            mano, e a metà pomeriggio hai la somma. Manca un terzo del magazzino,
            quasi tutto con il nodo raschiato, e se n'è andato dopo gli orchi, con
            calma, su un carro.

            Cosimo legge il tuo conto e si pulisce gli stivali uno contro l'altro,
            anche se sono puliti.
          pe: { politica-ed-economia: 3 }
          segue: gilda-l-ammanco
        fallimento:
          titolo: Il conto di Cosimo
          testo: |
            Le file sono impilate storte e due volte ricominci da capo, finché al
            tramonto Cosimo scrive una cifra sua nel libro e ti fa firmare sotto.
            Uscendo Ormun ti mormora che mancano le casse col nodo raschiato, e
            che hai appena firmato un conto in cui non manca niente.
          effetti: { scandalo: 1 }
          segue: gilda-l-ammanco
      - testo: "Fare due chiacchiere con il guardiano"
        descrizione: "La notte del Festival il guardiano c'era, e adesso ha molta paura di qualcosa."
        prova: { attributo: sociale, abilita: [empatia, intimidire], difficolta: Media }
        successo:
          titolo: Il carro dopo gli orchi
          testo: |
            Il guardiano, un vecchio con un occhio solo, la notte del Festival si
            è chiuso in una botte. Due notti dopo è arrivato un carro, e gli
            uomini avevano le chiavi del lucchetto nuovo e gli hanno dato una
            moneta da spendere alla Pignatta.

            «Avevano la livrea dei magazzini di scarico» dice, «e io la moneta
            l'ho presa. Questo al signore con gli stivali non lo dici.»
          pe: { empatia: 3 }
          segue: gilda-l-ammanco
        fallimento:
          titolo: La botte
          testo: |
            Il guardiano ti racconta tre volte della botte in cui si è nascosto,
            ogni volta con un orco in più, e della notte dopo non dice niente.
            Quando insisti si mette a piangere, e Cosimo ti guarda male dall'altra
            parte del magazzino.

            Ormun ti passa accanto e ti dice a mezza voce di contare le casse con
            il nodo raschiato.
          effetti: { scandalo: 1 }
          segue: gilda-l-ammanco
      - testo: "Salire fra le travi"
        descrizione: "Lassù qualcuno cammina leggero, e le casse impilate fanno quasi da scala."
        prova: { attributo: fisico, abilita: acrobazia, difficolta: Media }
        successo:
          titolo: Sulle travi
          testo: |
            Sali sulle casse come su una scala storta fino alla prima trave, con
            le schegge nei palmi. Nel buio caldo sotto la lamiera due ragazzi
            stanno accucciati accanto a un sacco, e quando ti vedono si guardano
            fra loro.
          pe: { acrobazia: 3 }
          segue: gilda-fra-le-travi
        fallimento:
          titolo: La pila che crolla
          testo: |
            La terza pila cede sotto il tuo piede e vieni giù con lei, mentre fra
            le travi due ombre scappano verso la finestra del tetto. Ormun ti
            toglie una scheggia dal gomito e ti dice di guardare le casse col nodo
            raschiato, perché quei due guardavano quelle.
          effetti: { ferite: 1 }
          segue: gilda-l-ammanco

  - id: gilda-fra-le-travi
    immagine: icone/rope-coil
    titolo: Fra le travi
    tipo: seguito
    luogo: Ponti Sospesi, sotto il tetto del magazzino
    area: ponti-sospesi
    requisiti: [fazione.gilda == 1]
    testo: |
      I ragazzi saranno sui quattordici anni, scalzi, con le funi arrotolate
      a tracolla. Sono ragazzi della corda, di quelli che vivono sotto i
      ponti, e il sacco accanto a loro è pieno di stoppa, con sopra un nodo
      della Gilda grattato via a metà.

      «Noi non abbiamo preso niente» dice il più grande. «Siamo venuti a
      vedere se era rimasto qualcosa, che è diverso.» Sotto di voi Cosimo
      chiede chi c'è lassù, e nessuno gli risponde.

      {rissa Facile} Il più grande tiene la mano dietro la schiena, sul
      manico di qualcosa, e il più piccolo scapperà per primo.

      {origine figlio-della-citta-bassa} Alla loro età portavi i messaggi in
      Via del Salmone, e i ragazzi della corda ti rubavano il pane dalle
      tasche.
    opzioni:
      - testo: "Afferrarli prima che scappino"
        descrizione: "Due ragazzi svelti che conoscono il tetto meglio di te, però sono ragazzi."
        combattimento: gilda-ragazzi-della-corda
        vittoria:
          titolo: Il nome del carro
          testo: |
            Il piccolo ti scivola fra le dita ma il grande no, e quando si stanca
            di dimenarsi ti dice quello che sa. Due notti dopo la razzia uomini
            con la livrea dei magazzini di scarico hanno caricato un carro con le
            casse raschiate, e loro due hanno solo guardato. Lo lasci andare, e
            scappa dalla finestra del tetto.
          segue: gilda-l-ammanco
        sconfitta:
          titolo: Scivolati via
          testo: |
            Il grande ti colpisce allo stinco e il piccolo ti butta la fune fra le
            gambe, e quando ti rialzi sei solo. Zoppicando porti giù a Cosimo la
            stoppa con il nodo raschiato, e lui la prende con due dita.
          segue: gilda-l-ammanco
      - testo: "Comprarli con qualche moneta"
        descrizione: "Hanno fame, e sotto i ponti una verità costa quanto una cena."
        requisiti: [monete >= 3]
        esito:
          titolo: Il prezzo di una cena
          testo: |
            Il grande guarda le monete come una trappola, poi le prende tutte
            insieme. Due notti dopo la razzia, dice, sono arrivati uomini con la
            livrea dei magazzini di scarico e le chiavi del lucchetto, e uno
            contava le casse raschiate sulle dita, con i guanti addosso.

            I due spariscono dalla finestra del tetto prima che tu possa chiedere
            altro.
          effetti: { monete: -3, informazioni.voce: 1 }
          segue: gilda-l-ammanco
      - testo: "Lasciarli andare e guardare dove vanno"
        descrizione: "Dalla finestra del tetto si vede la campata, e la campata porta da qualche parte."
        prova: { attributo: fisico, abilita: [furtivita, atletica], difficolta: Media }
        successo:
          titolo: La campata di ponente
          testo: |
            Dalla finestra del tetto li vedi correre lungo la campata fino a una
            piattaforma di carico chiusa da un cancello, con il marchio dei
            magazzini di scarico della Gilda su un muro di tavole. Bussano due
            volte, e qualcuno gli apre subito, come a gente di casa.
          segue: gilda-l-ammanco
        fallimento:
          titolo: La finestra del tetto
          testo: |
            Allunghi troppo il collo dalla finestra del tetto e la lamiera ti
            taglia la fronte. Torni giù con il sangue negli occhi e il sacco di
            stoppa con il nodo raschiato, e Cosimo ti presta un fazzoletto con
            aria offesa.
          effetti: { ferite: 0.5 }
          segue: gilda-l-ammanco
      - testo: "Parlare con loro come uno di Via del Salmone"
        descrizione: "I ragazzi della corda rispettano chi ha fatto il loro mestiere, e tu l'hai fatto."
        quando: [origine.figlio-della-citta-bassa >= 1]
        esito:
          titolo: Uno di loro
          testo: |
            Ti siedi sulla trave come in Via del Salmone e chiedi chi paga di più
            adesso che i messaggi non li porta più nessuno. Il grande ride, poi ti
            racconta degli uomini con la livrea dei magazzini di scarico che due
            notti dopo la razzia, con le chiavi del lucchetto, hanno caricato un
            carro con le casse raschiate.

            Andandosene dalla finestra del tetto, il piccolo ti saluta con la
            mano.
          segue: gilda-l-ammanco

  - id: gilda-l-ammanco
    immagine: personaggi/lira-demos
    titolo: L'ammanco
    tipo: seguito
    luogo: Ponti Sospesi, il magazzino della Gilda
    area: ponti-sospesi
    requisiti: [fazione.gilda == 1]
    testo: |
      Al tramonto il magazzino si svuota, e Ormun se ne va fischiando fra i
      denti senza salutare. Restate tu e Cosimo Venn nella luce rossa della
      porta nuova, con il libro dei lotti sul banco. Sapete tutti e due che
      manca un terzo del magazzino, e che se n'è andato dopo gli orchi, su
      un carro.

      «Lo scriviamo come razzia» dice Cosimo con dolcezza. «È stata una
      razzia, no? La Casa ha già abbastanza grane. Io firmo e firmi tu, così
      domani ti pago la giornata.»

      {empatia Media} Ha fretta, e non per la Casa. Chi vuole chiudere in
      fretta un conto ha quasi sempre qualcosa da perdere.

      Il biglietto di Lira è ancora nella tua tasca. Dicono che all'archivio
      dei dazi lei resti fino a tardi, e che i conti che non tornano li
      metta in una scatola di tasselli.
    opzioni:
      - testo: "Firmare con Cosimo"
        descrizione: "Una razzia è una razzia, e lui paga la giornata."
        esito:
          titolo: Razzia
          testo: |
            Firmi sotto la sua firma, e lui ti stringe la mano con una mano fredda
            e asciutta; il giorno dopo ti paga la giornata e qualcosa in più. Nel
            libro dei lotti l'ammanco diventa una riga sola, *razzia del
            Festival*. Quando lo dici a Lira lei annuisce, e la mano le va alla
            scatola dei tasselli e si ferma lì.
          imposta: { gilda.ammanco: 1 }
          effetti: { monete: 12, rep.gilda: 0.5, fazione.gilda: 1 }
      - testo: "Portare l'ammanco a Lira"
        descrizione: "Cosimo vuole chiudere in fretta, e Lira i conti che non tornano non li chiude mai."
        esito:
          titolo: Un tassello
          testo: |
            Cosimo chiude il libro e se ne va. All'archivio dei dazi Lira ti
            ascolta ordinando i tasselli, poi ne inchioda uno a forma di carro
            sulla costola di un registro nuovo. «Oggi non serve a niente, i conti
            così servono fra un anno» dice.

            Ti paga la giornata di tasca sua, e uscendo la senti fare il tuo nome
            a qualcuno che risponde con la voce calma del Sovrintendente.
          imposta: { gilda.ammanco: 2 }
          effetti: { monete: 8, rep.gilda: 0.5, gilda.voti: 1, fazione.gilda: 1 }

  # ------------------------------------------------------------ passo 3 · il nodo di cera
  - id: gilda-il-nodo-di-cera
    presso: gilda-casa-dei-nodi
    immagine: fazioni/gilda-dei-mercanti
    titolo: Il nodo di cera
    sommario: "Alla Casa dei Nodi un socio nuovo ha bisogno di un padrino, e te ne offrono due."
    luogo: Casa dei Nodi, la sala dei soci
    area: quartieri-alti
    requisiti: [fazione.gilda == 2]
    testo: |
      La sala dei soci è una stanza lunga e bassa al pianterreno della Casa
      dei Nodi, con le travi annerite dal fumo. Da una trave all'altra corre
      la fune dei soci, una vecchia gomena grossa come un braccio, e lungo
      la fune pendono centinaia di nodi di cera verde, ognuno con un nome,
      perché i primi tiracorde firmarono il Patto con un nodo e alla Casa si
      fa ancora così.

      Per avere il tuo nodo serve un padrino. Irsa Valbrun, con il grembiule
      da bottega sopra il panciotto, ti offre il suo nome e quello delle
      botteghe che votano con lei. Accanto alla finestra Ansaldo Morlacchi,
      il consigliere delle carovane e dei magazzini di scarico, ti offre il
      suo nome e una paga ogni mese, contando le condizioni sulle dita
      guantate.

      {conoscenze-della-strada Media} I due uomini fermi alla porta hanno la
      livrea dei magazzini di scarico, la stessa di cui ti hanno parlato al
      magazzino di ponente.

      Tarquin Cordani attraversa la sala in camicia bianca e ti stringe la
      mano come se vi conosceste, senza chiederti niente, poi va a sedersi
      in fondo con le mani ferme sul tavolo.

      {galateo Media} Irsa ti guarda le mani e Morlacchi le scarpe. Cordani
      non ti guarda affatto, che in questa sala è il modo più gentile di
      lasciarti libero.
    opzioni:
      - testo: "Chiedere a Irsa di farti da madrina"
        descrizione: "L'ala pragmatica delle botteghe, che il Velo stima, e un'armaiola che ti guarda le mani prima di fidarsi."
        immagine: personaggi/irsa-valbrun
        esito:
          titolo: La madrina col grembiule
          testo: |
            Irsa ti gira la mano palmo in su per guardarti i calli. «Va bene»
            dice. «Ma alla Casa i miei soci votano come pensano, e tu farai lo
            stesso.» Morlacchi ti fa un inchino più corto del primo e torna alla
            finestra.
          imposta: { gilda.padrino: 1 }
          segue: gilda-il-nodo-davanti-ai-soci
      - testo: "Accettare Morlacchi e la sua paga"
        descrizione: "Un nome che apre i magazzini e una paga ogni mese, con le condizioni contate da lui sulle dita."
        immagine: icone/hooded-figure
        esito:
          titolo: Le dita guantate
          testo: |
            Il velluto dei guanti di Morlacchi è caldo. «I magazzini sono il cuore
            della Gilda» dice. «I ponti sono soltanto le vene.» Ti spiega le
            condizioni contandole sulle dita ed esaurisce una mano, mentre Irsa
            piega il grembiule e se ne va senza voltarsi.
          imposta: { gilda.padrino: 2 }
          segue: gilda-il-nodo-davanti-ai-soci
      - testo: "Accettare Morlacchi e trattare la paga"
        descrizione: "Uno che conta sulle dita le condizioni ha già contato anche quanto è disposto a cedere."
        immagine: icone/hooded-figure
        prova: { attributo: sociale, abilita: persuasione, difficolta: Media }
        successo:
          titolo: Il sesto dito
          testo: |
            Lo lasci contare fino alla quinta condizione e poi gli chiedi se ce
            n'è una sesta, quella che riguarda te. Morlacchi ride piano e ti mette
            in mano subito la paga del primo mese, in una borsa di velluto. «Mi
            piacciono i soci che sanno contare» dice.
          imposta: { gilda.padrino: 2 }
          effetti: { monete: 10 }
          segue: gilda-il-nodo-davanti-ai-soci
        fallimento:
          titolo: Le condizioni
          testo: |
            Morlacchi ti ascolta con la testa inclinata, poi ricomincia a contare
            le condizioni dalla prima, con più calma, come si fa con i bambini.
            Alla fine accetti le sue, e i due uomini alla porta si scambiano
            un'occhiata.
          imposta: { gilda.padrino: 2 }
          effetti: { rep.gilda: -0.5, scandalo: 0.5 }
          segue: gilda-il-nodo-davanti-ai-soci
      - testo: "Chiedere a Corin Ashdale"
        descrizione: "Corin, socio da anni, non ha mai fatto da padrino a nessuno, e una sera te l'ha offerto."
        immagine: personaggi/corin-ashdale
        requisiti: [pista.corin < 6]
        esito:
          titolo: Il fazzoletto al taschino
          testo: |
            Corin si alza da una panca in fondo e attraversa la sala per
            abbracciarti, cosa che alla Casa dei Nodi non si fa. «Il mio primo
            figlioccio» dice, abbastanza forte perché lo senta Morlacchi, che
            conta qualcosa sulle dita e lascia perdere.
          imposta: { gilda.padrino: 3 }
          segue: gilda-il-nodo-davanti-ai-soci
      - testo: "Chiedere a Corin Ashdale"
        descrizione: "Alla Casa tutti salutano Corin, tornato da Laresh per l'Arena, e un figlioccio non l'ha mai avuto."
        immagine: personaggi/corin-ashdale
        requisiti: [pista.corin >= 6, pista.arena >= 1]
        esito:
          titolo: Il fazzoletto al taschino
          testo: |
            Con la polvere di Laresh ancora sugli stivali, Corin si alza da una
            panca in fondo e attraversa la sala per abbracciarti, cosa che alla
            Casa dei Nodi non si fa. «Il mio primo figlioccio» dice, abbastanza
            forte perché lo senta Morlacchi, che lascia perdere.
          imposta: { gilda.padrino: 3 }
          segue: gilda-il-nodo-davanti-ai-soci

  - id: gilda-il-nodo-davanti-ai-soci
    presso: gilda-casa-dei-nodi
    immagine: icone/knot
    titolo: Il nodo davanti ai soci
    tipo: seguito
    luogo: Casa dei Nodi, sotto la fune dei soci
    area: quartieri-alti
    requisiti: [fazione.gilda == 2, gilda.padrino >= 1]
    testo: |
      Il nodo si fa davanti a tutti, su una scala a pioli appoggiata alla
      trave, con un filo di cera verde scaldato su una lampada. Il padrino
      regge la scala, e i soci guardano dal basso scommettendo a mezza voce
      su quanto reggerà la cera, perché chi fa cadere un nodo se lo sente
      ricordare per anni.

      {acrobazia Facile} La scala è vecchia e storta, e il piolo buono è il
      terzo, perché gli altri sono lucidi di cera.

      {accademiche Media} Il nodo del Patto è il nodo da carico delle funi
      portanti. Ha due giri e una volta, e stretto dalla parte giusta regge
      una campata.

      *Un nodo è soltanto un nodo, e lo guardano in duecento.* In fondo alla
      sala Tarquin Cordani ha smesso di parlare con il vicino e guarda la
      fune.
    opzioni:
      - testo: "Salire e fare il nodo in alto, dove si vede"
        descrizione: "I nodi più alti sono dei soci che contano, ed è lì che la scala balla di più."
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Facile }
        successo:
          titolo: Il nodo in alto
          testo: |
            Sali fino all'ultimo piolo e fai il nodo sopra tutti gli altri, con la
            cera che ti brucia i polpastrelli. Lira ti scrive nel Libro dei soci e
            Varn ti dà il gettone di bronzo, con la licenza della Gilda per chi
            non l'aveva; da soci la commissione non si paga.

            Prima di sera parti a scortare sei carri per Laresh e a riportare il
            grano.
          pe: { acrobazia: 3 }
          almeno: { rep.gilda: 2 }
          imposta: { licenza-gilda: 1 }
          effetti: { oggetto.gilda-gettone-del-socio: 1, monete: 30, fazione.gilda: 1 }
        fallimento:
          titolo: Il nodo che scivola
          testo: |
            Al quarto piolo la scala gira e ti aggrappi alla fune, facendo cadere
            tre nodi di altri soci. Il tuo lo fai più in basso fra le risate, e
            tiene lo stesso. Lira ti scrive nel Libro dei soci e Varn ti dà il
            gettone di bronzo, con la licenza della Gilda per chi non l'aveva.

            Prima di sera parti a scortare sei carri per Laresh.
          almeno: { rep.gilda: 2 }
          imposta: { licenza-gilda: 1 }
          effetti: { oggetto.gilda-gettone-del-socio: 1, monete: 30, scandalo: 1, fazione.gilda: 1 }
      - testo: "Fare il nodo del Patto, quello delle funi portanti"
        descrizione: "I vecchi soci riconoscono al primo giro il nodo delle funi portanti."
        prova: { attributo: mentale, abilita: [accademiche, tecnologia], difficolta: Facile }
        successo:
          titolo: Due giri e una volta
          testo: |
            Fai il nodo da carico dei tiracorde con i due giri e la volta, e la
            sala lo riconosce e smette di scommettere. Lira ti scrive nel Libro
            dei soci e Varn ti dà il gettone di bronzo, con la licenza della Gilda
            per chi non l'aveva; da soci la commissione non si paga.

            Prima di sera parti a scortare sei carri per Laresh e a riportare il
            grano.
          pe: { accademiche: 3 }
          almeno: { rep.gilda: 2 }
          imposta: { licenza-gilda: 1 }
          effetti: { oggetto.gilda-gettone-del-socio: 1, monete: 30, fazione.gilda: 1 }
        fallimento:
          titolo: Il nodo da pacchi
          testo: |
            A metà del nodo del Patto sbagli il verso della volta, e ne esce un
            nodo da pacchi con il fiocco che fa ridere la sala, ma tiene. Lira ti
            scrive nel Libro dei soci e Varn ti dà il gettone di bronzo, con la
            licenza per chi non l'aveva.

            Per un mese sarai quello del fiocco, e prima di sera parti a scortare
            sei carri per Laresh.
          almeno: { rep.gilda: 2 }
          imposta: { licenza-gilda: 1 }
          effetti: { oggetto.gilda-gettone-del-socio: 1, monete: 30, scandalo: 1, fazione.gilda: 1 }
      - testo: "Fare il nodo come sulle corde della Cicatrice"
        descrizione: "Sulle piattaforme si annoda appesi nel vuoto con una mano sola, e una scala a pioli non ti spaventa."
        quando: [origine.apprendista-raschiatore >= 1]
        esito:
          titolo: Una mano sola
          testo: |
            Sali la scala senza tenerti come sulle piattaforme e fai il nodo con
            una mano sola. Qualche socio storce il naso, perché i Raschiatori qui
            non piacciono, e qualcun altro paga la scommessa. Lira ti scrive nel
            Libro dei soci e Varn ti dà il gettone di bronzo, con la licenza della
            Gilda per chi non l'aveva.

            Prima di sera parti a scortare sei carri per Laresh.
          pe: { acrobazia: 3 }
          almeno: { rep.gilda: 2 }
          imposta: { licenza-gilda: 1 }
          effetti: { oggetto.gilda-gettone-del-socio: 1, monete: 30, fazione.gilda: 1 }
      - testo: "Fare il nodo da banco dei Ponti"
        descrizione: "Al banco chiudi i pacchi della Gilda con il nodo dei soci da quando avevi otto anni."
        quando: [origine.mercante-dei-ponti >= 1]
        esito:
          titolo: A occhi chiusi
          testo: |
            Fai il nodo dei soci come chiudi un pacco al banco, e qualcuno
            riconosce il gesto e dice il nome del tuo banco. Lira ti scrive nel
            Libro dei soci e Varn ti dà il gettone di bronzo. La licenza ce l'hai
            già, e da oggi la commissione non la paghi più.

            Prima di sera parti a scortare sei carri per Laresh.
          pe: { acrobazia: 3 }
          almeno: { rep.gilda: 2 }
          imposta: { licenza-gilda: 1 }
          effetti: { oggetto.gilda-gettone-del-socio: 1, monete: 30, fazione.gilda: 1 }

  # ------------------------------------------------------------ passo 4 · i sei carri (la spedizione è in spedizione-laresh.yaml)
  - id: gilda-i-sei-carri
    immagine: ambientazione/laresh
    titolo: I sei carri per Laresh
    sommario: "Fuori dalle mura aspettano sei carri della Gilda con i cani da soma di Cahir, stalliere di Laresh."
    luogo: Superficie Fratturata, dove la strada lastricata finisce
    area: superficie-fratturata
    requisiti: [fazione.gilda == 3]
    testo: |
      I sei carri bassi della Gilda aspettano dove finisce la strada
      lastricata. Portano attrezzi e sale da scambiare con il grano al bivio
      di Laresh, e alle stanghe ci sono cani da soma grossi come vitelli,
      con le orecchie mozze, che ti annusano le mani uno alla volta.

      Li guida Cahir, uno stalliere mezzelfo di Laresh con una cicatrice di
      morso sull'avambraccio, che prima ancora di presentarsi ti dice che le
      carovane della Gilda non gli piacciono e che un giorno ne avrà una
      sua.

      «Quella della settimana scorsa al bivio non è mai arrivata» aggiunge.
      «In città il pane è salito, e alla Casa hanno deciso di mandare un
      socio nuovo a vedere la strada.»

      {origine figlio-del-circolo} I cani tengono il muso verso nord anche
      da fermi, e al Circolo una muta che guarda tutta da una parte si
      lascia in pace.
    opzioni:
      - testo: "Partire con i carri"
        descrizione: "Al passo dei cani, con la tela cerata che sbatte e Cahir che non parla."
        esito:
          titolo: Il sentiero dei carri
          testo: |
            Cahir schiocca la lingua e i cani tirano tutti insieme. Dove la strada
            lastricata finisce comincia il sentiero, e tu cammini accanto
            all'ultimo carro mentre la città diventa una macchia grigia sopra la
            Cicatrice.
          vai: gilda-pista-di-laresh
      - testo: "Partire a cavallo, in testa alla carovana"
        descrizione: "Dalla sella si vede la strada prima dei cani, e le gambe ringraziano."
        requisiti: [chiave.cavalcatura >= 1]
        costo: 0
        esito:
          titolo: In testa
          testo: |
            Monti in sella e prendi la testa della carovana. Cahir ti guarda la
            cavalcatura da esperto e alla fine fa un cenno di approvazione che
            sembra costargli, e i cani ti seguono senza bisogno di schiocchi.
          vai: gilda-pista-di-laresh
      - testo: "Farsi raccontare della carovana scomparsa"
        descrizione: "Cahir ama i suoi cani più di quanto detesti la Gilda, e i cani di quella carovana erano suoi."
        prova: { attributo: sociale, abilita: [empatia, addestrare-animali], difficolta: Media }
        successo:
          titolo: I cani di Cahir
          testo: |
            Gli chiedi dei cani invece che della carovana, e per la prima volta ti
            guarda. Erano quattro, i migliori della sua muta, e portavano al bivio
            grano e bestiame; in fondo alla fila c'era un carro coperto che non
            era di Laresh, con un uomo della Gilda a cassetta, e a Cahir piaceva
            poco.

            Poi schiocca la lingua e i cani tirano.
          effetti: { informazioni.voce: 1 }
          vai: gilda-pista-di-laresh
        fallimento:
          titolo: Il finimento
          testo: |
            Cahir si mette a sistemare un finimento che era già a posto e ti
            risponde che lui guida i cani, e che le domande le fanno alla Casa dei
            Nodi. Poi schiocca la lingua, e i cani partono senza aspettarti.
          vai: gilda-pista-di-laresh
          effetti: { scandalo: 0.5 }

  # ------------------------------------------------------------ passo 5 · timbri di notte
  - id: gilda-timbri-di-notte
    presso: mercato-dei-nodi
    immagine: personaggi/ambrin-qell
    titolo: Timbri di notte
    sommario: "Ambrin Qell ha comprato tre cristalli timbrati dalla Gilda, ed erano sterili."
    luogo: Mercato dei Nodi, il Nodo d'Ossidiana
    area: ponti-sospesi
    requisiti: [fazione.gilda == 4, gilda.cristalli == 0]
    testo: |
      Il corvo sul bancone del Nodo d'Ossidiana ti guarda entrare, e poi
      guarda il gettone di bronzo alla tua cintura. Ambrin Qell non si alza.
      Sul vetro del bancone ha messo in fila tre cristalli su un panno nero,
      ognuno con un cartellino che porta il nodo verde della Gilda e la
      data.

      «Li ho comprati carichi e timbrati, al prezzo dei carichi» dice. «Il
      timbro della Casa dovrebbe voler dire qualcosa.» Spinge il panno verso
      di te con un dito. «Lo chiedo a te perché porti il gettone e non sei
      ancora abbastanza vecchio da mentire bene.»

      {magia Media} Vicini fra loro, i cristalli carichi ronzano appena, e
      questi restano muti.

      {origine allievo-di-torvessa} Al primo anno in Accademia vi facevano
      tenere in mano un cristallo sterile e uno carico, a occhi chiusi,
      finché non sentivate la differenza nei polpastrelli.
    opzioni:
      - testo: "Provare i cristalli"
        descrizione: "Un cristallo carico risponde a chi sa ascoltarlo, o a chi sa smontarlo."
        prova: { attributo: mentale, abilita: [magia, tecnologia], difficolta: Media }
        successo:
          titolo: Tre cristalli sterili
          testo: |
            Li tieni uno alla volta fra pollice e indice aspettando il battito
            lento dei cristalli carichi, che non arriva. Qualcuno ha timbrato come
            carichi dei cristalli sterili. Ambrin, che lo sospettava, ti paga il
            disturbo e ti dà i cartellini, tutti con il numero del banco del
            timbro della Casa dei Nodi.
          pe: { magia: 3 }
          imposta: { gilda.cristalli: 1 }
          effetti: { monete: 10, rep.nodo: 0.5 }
        fallimento:
          titolo: Il battito che non c'è
          testo: |
            A un certo punto ti sembra di sentire un battito, che invece è il tuo
            polso. Ambrin ti guarda sbagliare con pazienza, poi ti dice che sono
            sterili e ti dà i cartellini, tutti con il numero del banco del timbro
            della Casa dei Nodi; il disturbo non te lo paga.
          imposta: { gilda.cristalli: 1 }
          effetti: { tormento: 1 }
      - testo: "Leggere il Mana nei cristalli"
        descrizione: "L'incantesimo che si insegna in Accademia proprio per i cristalli falsi."
        incantesimo: leggere-il-mana
        prova: { attributo: mentale, abilita: magia, difficolta: Facile }
        successo:
          titolo: Il Mana fermo
          testo: |
            Apri la mano sopra il panno, e sopra i tre cristalli il Mana non sale.
            Sono sterili, timbrati come carichi da qualcuno sicuro che nessuno li
            avrebbe provati. Ambrin ti paga il disturbo e ti dà i cartellini,
            tutti con il numero del banco del timbro della Casa dei Nodi.
          pe: { magia: 3 }
          imposta: { gilda.cristalli: 1 }
          effetti: { monete: 10, rep.nodo: 0.5 }
        fallimento:
          titolo: La mano vuota
          testo: |
            Il Mana ti sfugge e torna indietro, freddo, fino al gomito. Ambrin
            aspetta che ti riprenda, poi ti dice che sono sterili e ti dà i
            cartellini, tutti con il numero del banco del timbro della Casa dei
            Nodi.
          imposta: { gilda.cristalli: 1 }
          effetti: { tormento: 1 }
      - testo: "Confrontare i timbri"
        descrizione: "Un timbro vero della Gilda ce l'hai in tasca, sulla licenza, da mettere accanto agli altri."
        prova: { attributo: mentale, abilita: percezione, difficolta: Media }
        successo:
          titolo: Il nodo storto
          testo: |
            Metti la tua licenza accanto ai cartellini. Il nodo è giusto e la data
            anche, ma l'inchiostro è più fresco della data di una settimana, e
            ogni timbro è battuto due volte, come si fa di fretta e al buio. Il
            numero di banco è quello del banco del timbro della Casa dei Nodi, e
            Ambrin ti paga il disturbo senza contare le monete.
          pe: { percezione: 3 }
          imposta: { gilda.cristalli: 1 }
          effetti: { monete: 10, rep.nodo: 0.5 }
        fallimento:
          titolo: Timbri uguali
          testo: |
            I timbri ti sembrano tutti uguali al tuo, e lo dici. Ambrin ti fa
            notare che il tuo è vecchio di un anno e i loro di una settimana, e
            battuti due volte; ti dà i cartellini con il numero del banco del
            timbro, e il disturbo non te lo paga.
          imposta: { gilda.cristalli: 1 }
          effetti: { rep.nodo: -0.5, scandalo: 0.5 }
      - testo: "Sentirli con i polpastrelli, come al primo anno"
        descrizione: "In Accademia l'esercizio si faceva a occhi chiusi, e un cristallo sterile è freddo in un modo suo."
        quando: [origine.allievo-di-torvessa >= 1]
        esito:
          titolo: Freddi nel modo sbagliato
          testo: |
            A occhi chiusi i tre cristalli sono freddi come il vetro, mentre un
            cristallo carico è freddo come l'acqua di pozzo. Ambrin ti paga il
            disturbo e ti dà i cartellini, tutti con il numero del banco del
            timbro della Casa dei Nodi.
          pe: { magia: 3 }
          imposta: { gilda.cristalli: 1 }
          effetti: { monete: 10, rep.nodo: 0.5 }

  - id: gilda-il-cassetto-di-elleri
    presso: gilda-casa-dei-nodi
    immagine: fazioni/gilda-dei-mercanti
    titolo: Il banco del timbro
    sommario: "I cartellini portano il numero del banco del timbro, dove Marzio Elleri custodisce i sigilli della Casa."
    luogo: Casa dei Nodi, il banco del timbro
    area: quartieri-alti
    requisiti: [fazione.gilda == 4, gilda.cristalli >= 1, gilda.cassetto == 0]
    testo: |
      Il banco del timbro sta in fondo al corridoio del primo piano, e la
      coda dei mercanti arriva fino alle scale. Ci siede dietro Marzio
      Elleri, il cancelliere della Casa che fa anche l'avvocato della Gilda.
      È un uomo rotondo con i manicotti di tela sulle maniche che chiede a
      tutti della famiglia mentre timbra. I sigilli stanno in un cassetto
      chiuso con una chiave che lui porta al collo sotto la camicia. La sera
      se ne va per ultimo, e alle sue spalle una tenda nasconde un
      ripostiglio di scope.

      {ingannare Media} È gentile con tutti allo stesso modo, che vuol dire
      con nessuno. Una gentilezza così si impara come un mestiere.

      Quando arriva il tuo turno Elleri ti chiede come sta il tuo padrino e
      lo chiama per nome, anche se tu non gli hai detto chi è.
    opzioni:
      - testo: "Restare nella Casa dopo la chiusura"
        descrizione: "Dietro la tenda del ripostiglio si aspetta al buio chi usa il timbro di notte."
        prova: { attributo: fisico, abilita: furtivita, difficolta: Difficile }
        successo:
          titolo: La lampada schermata
          testo: |
            Aspetti dietro la tenda finché la Casa tace. Dopo la seconda campana
            torna Marzio Elleri con una lampada schermata da un fazzoletto. Apre
            il cassetto con la chiave che porta al collo e timbra trenta
            cartellini, due colpi ciascuno, poi li infila in una busta di cuoio
            con il marchio dei magazzini di scarico.

            Esci alla prima luce dalla finestra dei bagni, con le ginocchia che
            scricchiolano.
          pe: { furtivita: 5 }
          imposta: { gilda.cassetto: 1 }
          segue: gilda-quello-che-sai-dei-timbri
        fallimento:
          titolo: La scopa
          testo: |
            Dietro la tenda urti una scopa proprio mentre Elleri chiude il
            cassetto. Lui scosta la tenda con due dita e ti accompagna alla porta
            parlando del tempo, gentile come sempre. Sulla scrivania, accanto al
            cassetto, hai visto una busta di cuoio con il marchio dei magazzini di
            scarico, piena di cartellini già timbrati.
          imposta: { gilda.cassetto: 1 }
          effetti: { sospetto: 1.5 }
          segue: gilda-quello-che-sai-dei-timbri
      - testo: "Parlare dei sigilli con Elleri"
        descrizione: "Un uomo che ama il suo lavoro risponde volentieri alle domande di un socio nuovo e curioso."
        prova: { attributo: sociale, abilita: [galateo, ingannare], difficolta: Media }
        successo:
          titolo: Il secondo colpo
          testo: |
            Gli chiedi perché i timbri della Casa si battono una volta sola, ed
            Elleri ti spiega che chi batte due volte ha fretta o la mano che
            trema. Intanto guarda i tuoi cartellini sul banco e smette di
            sorridere. Li timbra di nuovo con il suo una volta sola, e quando te
            ne vai lo vedi aprire il cassetto.
          pe: { galateo: 3 }
          imposta: { gilda.cassetto: 1 }
          segue: gilda-quello-che-sai-dei-timbri
        fallimento:
          titolo: La famiglia
          testo: |
            Elleri ti risponde parlando del tuo padrino e della strada di Laresh,
            e alla fine sei tu ad aver risposto a lui. Prima che tu te ne vada,
            però, apre il cassetto per riporre la penna, e dentro vedi una busta
            di cuoio con il marchio dei magazzini di scarico, piena di cartellini
            timbrati.
          imposta: { gilda.cassetto: 1 }
          effetti: { sospetto: 1 }
          segue: gilda-quello-che-sai-dei-timbri
      - testo: "Pagare il garzone delle lampade"
        descrizione: "Il garzone delle lampade vede chi resta dopo la chiusura, e nessuno gli chiede mai niente."
        requisiti: [monete >= 5]
        esito:
          titolo: Le lampade del primo piano
          testo: |
            Il garzone si mette le monete in bocca per contarle con la lingua. Poi
            ti racconta che il cancelliere torna tre sere a settimana, dopo la
            seconda campana, con una lampada schermata, e riparte con una busta di
            cuoio dei magazzini di scarico; ogni volta gli regala una caramella di
            menta.
          imposta: { gilda.cassetto: 1 }
          effetti: { monete: -5 }
          segue: gilda-quello-che-sai-dei-timbri
      - testo: "Mettersi in coda e guardare come timbra"
        descrizione: "Tre ore di coda sono tante, ma da metà fila si vede bene il banco."
        costo: 2
        esito:
          titolo: Tre ore di coda
          testo: |
            Ti rimetti in coda tre volte, con tre scuse diverse, e guardi Elleri
            timbrare tutto una volta sola, pulito. Solo quando un uomo con la
            livrea dei magazzini di scarico gli lascia una busta di cuoio, lui la
            infila nel cassetto senza aprirla e chiude subito a chiave.
          imposta: { gilda.cassetto: 1 }
          segue: gilda-quello-che-sai-dei-timbri

  - id: gilda-quello-che-sai-dei-timbri
    presso: gilda-casa-dei-nodi
    immagine: personaggi/varn-kett
    titolo: Quello che sai dei timbri
    tipo: seguito
    luogo: Casa dei Nodi, la scalinata
    area: quartieri-alti
    requisiti: [fazione.gilda == 4, gilda.cassetto >= 1]
    testo: |
      Sulla scalinata della Casa ti siedi su un gradino consumato. I timbri
      falsi escono dal cassetto di Marzio Elleri e finiscono nelle buste dei
      magazzini di scarico, ma un cartellino battuto due volte e una busta
      vista di sfuggita valgono la tua parola, e la tua parola alla Casa dei
      Nodi vale quanto un nodo di cera vecchio di un mese.

      {politica-ed-economia Media} Un avvocato della Gilda che timbra di
      notte sa anche come spiegarlo di giorno, e una prova sola gli direbbe
      dove guardare.

      Varn Kett sta salendo la scalinata con la lista del giorno appuntata
      alla cintura e gli stivali da pioggia. Quando ti vede rallenta, e la
      sua mano destra comincia a scrivere sull'aria prima che tu abbia
      aperto bocca.
    opzioni:
      - testo: "Dirlo a Varn"
        descrizione: "Varn scrive tutto e non sbaglia mai una riga."
        esito:
          titolo: Una riga sull'aria
          testo: |
            Glielo dici a voce bassa, e Varn ti ascolta in piedi senza guardarti,
            con la mano che scrive una riga lunga. «Il cancelliere» dice soltanto.
            «Lo scrivo, e aspetto. Tu non fare niente.» Riprende la salita
            lasciando l'impronta bagnata degli stivali sui gradini, e prima di
            entrare ti fa un cenno con il mento, uno solo.
          imposta: { gilda.timbri: 1 }
          effetti: { rep.gilda: 0.5, fazione.gilda: 1 }
      - testo: "Tenerlo per te"
        descrizione: "Una cosa che sai soltanto tu vale di più finché resta tua."
        esito:
          titolo: Il gradino
          testo: |
            Saluti Varn con un cenno e resti seduto finché non è entrato. Il
            cassetto di Elleri te lo tieni come una moneta cucita nella fodera, e
            prima di alzarti scrivi la data dietro uno dei cartellini di Ambrin e
            lo infili nella suola dello stivale.
          imposta: { gilda.timbri: 2 }
          effetti: { informazioni.segreto: 1, fazione.gilda: 1 }
      - testo: "Andare a dirlo direttamente al Sovrintendente"
        descrizione: "Cordani è l'unico pulito della Casa, dicono, ma un socio nuovo al terzo piano senza invito fa parlare."
        prova: { attributo: sociale, abilita: [galateo, persuasione], difficolta: Media }
        successo:
          titolo: Le mani ferme
          testo: |
            Il valletto del terzo piano ti guarda come un levriero guarderebbe un
            gatto, ma Cordani ti riceve in piedi accanto alla finestra, con le
            mani ferme sul davanzale. «Grazie» dice alla fine. «Varn lo saprà da
            me. Non parlarne con nessun altro.» Uscendo ti accorgi che non ti ha
            chiesto come lo sai.
          imposta: { gilda.timbri: 1 }
          effetti: { rep.gilda: 0.5, fazione.gilda: 1 }
        fallimento:
          titolo: Il valletto
          testo: |
            Il valletto ti fa aspettare un'ora su una panca e poi ti dice che il
            Sovrintendente è uscito. Scendendo incroci Elleri, che ti saluta per
            nome e ti chiede se il terzo piano ti è piaciuto. Nel pomeriggio Varn
            ti ascolta in silenzio e scrive tutto sull'aria.
          imposta: { gilda.timbri: 1 }
          effetti: { sospetto: 1, fazione.gilda: 1 }
