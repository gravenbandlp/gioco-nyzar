# La quest della Gilda, passi 1-5 (fazione.gilda 0 → 5). Vedi quest.yaml per le quality.
# 1 L'avviso di Lira (0 → 1): l'avviso al gabbiotto delle Mille Corde e la mattina al banco di Varn Kett, con il
#   carrettiere dal doppio fondo, poi la vedova e il sacerdote del Velo (seguito). Aperto a tutti dopo il prologo.
# 2 Le casse del Festival (1 → 2): il magazzino forzato durante la razzia, Cosimo Venn e Ormun Pell. Fra le travi
#   i ragazzi della corda (seguito). L'ammanco va a Cosimo (gilda.ammanco 1) o a Lira (2, il primo voto).
# 3 Il nodo di cera (2 → 3): la fune dei soci alla Casa dei Nodi e il padrino (gilda.padrino). Il nodo davanti ai
#   soci (seguito) dà il grado I, Socio di corda.
# 4 La pista di Laresh (3 → 4): i sei carri sulla Superficie e la spedizione (spedizione-laresh.yaml).
# 5 Timbri di notte (4 → 5): i cristalli sterili di Ambrin Qell (gilda.cristalli), poi alla Casa dei Nodi il
#   cassetto di Marzio Elleri e la scelta fra Varn e il silenzio (gilda.timbri).
quality:
  - { id: gilda.cristalli, nome: I cristalli sterili di Ambrin, categoria: stato, nascosta: true, descrizione: "1 dopo aver visto i cristalli timbrati e sterili del Nodo d'Ossidiana." }
  - { id: gilda.cassetto, nome: Il cassetto di Elleri, categoria: stato, nascosta: true, descrizione: "1 quando sai da quale cassetto escono i timbri falsi." }

storylet:
  # ------------------------------------------------------------ passo 1 · l'avviso di Lira
  - id: gilda-l-avviso-di-lira
    presso: ponte-delle-mille-corde
    immagine: personaggi/lira-demos
    titolo: L'avviso di Lira
    sommario: "Sul gabbiotto delle Mille Corde c'è un avviso della Casa dei Nodi. La Gilda cerca aspiranti soci, e Varn Kett li mette alla prova con una mattina al banco."
    luogo: Imbocco del Ponte delle Mille Corde, all'alba
    area: ponti-sospesi
    requisiti: [fazione.gilda == 0, prologo == 0, pista.capomozzo >= 10]
    testo: |
      Sul fianco del gabbiotto dei Custodi, all'imbocco delle Mille Corde,
      qualcuno ha inchiodato un foglio con il sigillo verde della Gilda, e
      la colla agli angoli è ancora lucida. La Casa dei Nodi cerca aspiranti
      soci di buona fama, disposti a lavorare per i ponti prima che per sé.
      Le domande si portano a Lira Demos, all'archivio dei dazi. In fondo,
      in una grafia minuta e diritta, c'è scritto che la prima prova la dà
      l'ispettore Kett, al banco, la mattina dopo.

      La mattina dopo Lira è appoggiata allo stipite del gabbiotto, con un
      rotolo di avvisi sotto il braccio e i fili di rame della treccia che
      prendono la luce grigia dell'alba. «Alla Casa servono braccia» ti
      dice. «Braccia oneste, che sui ponti sono una merce più rara del
      lyssan. Oggi lavori al banco con Varn, e stasera lui mi dice se
      valgono qualcosa.»

      {empatia Media} L'avviso l'ha incollato lei. Si ferma a leggerlo poca
      gente, e lei se le ricorda tutte, perché ogni volta spera.

      Dentro il gabbiotto Varn Kett ti indica uno sgabello senza alzare gli
      occhi, e la sua mano destra scrive qualcosa sull'aria. Il primo carro
      della giornata è già all'imbocco, un carro di sale tirato da due muli,
      con il carrettiere che sbadiglia apposta. Le ruote affondano nelle
      assi più di quanto dovrebbero sei sacchi di sale.

      {origine mercante-dei-ponti} Varn ti conosce dal registro, perché la
      tua commissione passa da questo banco ogni mese. Ti fa un cenno breve
      e ti mette davanti la penna vera, quella che di solito non presta.

      {politica-ed-economia Facile} Sei sacchi di sale pagano una gabella da
      niente. Un carro che pesa il doppio e paga per sei sacchi trasporta
      quasi sempre qualcosa che non è sale.
    opzioni:
      - testo: "Guardare sotto il carro"
        descrizione: "Un fondo che sta troppo in alto si vede dalle assi, se ti chini abbastanza."
        prova: { attributo: mentale, abilita: percezione, difficolta: Media }
        successo:
          titolo: Il doppio fondo
          testo: |
            Ti chini fino a sentire l'odore del legno bagnato e guardi fra
            le ruote. Fra l'assale e il pianale c'è una spanna di troppo, e
            le teste dei chiodi sono nuove. Batti con le nocche e il pianale
            suona vuoto. Il carrettiere smette di sbadigliare. Sotto il sale
            ci sono quattro casse di cristalli senza timbro, imballate nella
            paglia.

            Varn scrive due righe sull'aria e poi una sul registro di carta.
            «Il sale passa» dice al carrettiere, «e le casse restano qui.»
          pe: { percezione: 3 }
          segue: gilda-il-banco-di-varn
        fallimento:
          titolo: Sei sacchi di sale
          testo: |
            Ti chini, guardi fra le ruote e vedi soltanto fango e paglia.
            Fai segno al carrettiere di passare. Varn si alza ed esce dal
            gabbiotto. Batte due volte le nocche sul pianale, che suona
            vuoto come una botte. Sotto il sale ci sono quattro casse di
            cristalli senza timbro.

            {percezione Media fallita} Guardavi le ruote, e il trucco stava
            nell'altezza del pianale. Lo sapevi anche, ma gli occhi avevano
            già deciso dove guardare.

            Varn non ti dice niente. Rientra nel gabbiotto e scrive
            sull'aria una riga sola, molto corta.
          segue: gilda-il-banco-di-varn
          effetti: { scandalo: 0.5 }
      - testo: "Fare scaricare il carro"
        descrizione: "Un carrettiere che sbadiglia apposta ha qualcosa da nascondere. Basta farglielo capire."
        prova: { attributo: sociale, abilita: intimidire, difficolta: Media }
        successo:
          titolo: Scarica
          testo: |
            Ti pianti davanti ai muli e gli dici di scaricare, sacco per
            sacco, con la voce di uno che ha tempo fino a sera. Lui ride,
            poi guarda la coda dei carri che si allunga alle sue spalle e
            smette di ridere. Al quarto sacco si arrende e ti indica il
            doppio fondo con il mento, come se fosse colpa del carro. Sotto
            ci sono quattro casse di cristalli senza timbro.

            Varn esce dal gabbiotto e guarda prima le casse, poi te. La mano
            destra scrive sull'aria una riga lunga.
          pe: { intimidire: 3 }
          segue: gilda-il-banco-di-varn
        fallimento:
          titolo: La coda
          testo: |
            Gli dici di scaricare, e lui comincia a farlo con una lentezza
            perfetta, un sacco alla volta e una pausa fra l'uno e l'altro, mentre alle sue spalle la
            coda dei carri si allunga fino alla piattaforma dei bottai e
            qualcuno comincia a gridare il tuo nome, che non sa, insieme a
            parole che sa benissimo. Alla fine è Varn a uscire, a battere
            sul pianale e a trovare le casse.

            {intimidire Media fallita} Hai fatto paura alla coda, e al
            carrettiere niente. Lui lo sapeva prima di te.
          effetti: { rep.ponti: -0.5, scandalo: 0.5 }
          segue: gilda-il-banco-di-varn
      - testo: "Fare due conti sul carico"
        descrizione: "Un sacco di sale pesa sempre uguale, le ruote affondano secondo il carico, e il carrettiere paga per sei sacchi. I numeri non sbadigliano."
        prova: { attributo: mentale, abilita: politica-ed-economia, difficolta: Media }
        successo:
          titolo: Il conto delle ruote
          testo: |
            Chiedi al carrettiere quanto ha pagato il sale a Laresh e quanto
            pensa di venderlo al Mercato dei Nodi. Lui risponde, e i due
            numeri insieme non danno un guadagno che valga il viaggio. Gli
            fai notare che nessuno attraversa la Superficie per rimetterci.
            Lui si gratta la nuca e ti indica il doppio fondo. Sotto ci sono
            quattro casse di cristalli senza timbro.

            Varn ascolta il conto dall'interno del gabbiotto e lo rifà
            sull'aria con le dita, e gli torna.
          pe: { politica-ed-economia: 3 }
          segue: gilda-il-banco-di-varn
        fallimento:
          titolo: I conti degli altri
          testo: |
            Chiedi i prezzi al carrettiere, e lui te ne dà così tanti, e con
            tanta precisione, che alla fine il suo viaggio ti sembra un
            affare. Lo lasci passare. Varn lo ferma con un fischio. Batte
            sul pianale e trova le casse senza dire una parola.

            {politica-ed-economia Facile fallita} I numeri erano veri tutti
            quanti. Era la somma a essere falsa, e tu l'hai fatta fare a
            lui.
          effetti: { rep.ponti: -0.5, scandalo: 0.5 }
          segue: gilda-il-banco-di-varn
      - testo: "Recitargli il regolamento dei carichi"
        descrizione: "Le formule della Gilda le sai a memoria, e i carrettieri sanno che chi le sa a memoria le ha usate."
        quando: [origine.mercante-dei-ponti >= 1]
        esito:
          titolo: Articolo sette
          testo: |
            Gli reciti l'articolo sui carichi misti, quello che a un
            mercante dei Ponti insegnano prima di insegnargli a contare, con
            la voce annoiata di chi lo ha detto cento volte al banco.
            Arrivato alla parte sulle confische il carrettiere ti ferma con
            la mano e ti indica il doppio fondo. Sotto ci sono quattro casse
            di cristalli senza timbro.

            Varn ti guarda da sopra la spalla e per un momento la sua mano
            resta ferma. Poi riprende a scrivere sull'aria.
          pe: { politica-ed-economia: 3 }
          segue: gilda-il-banco-di-varn

  - id: gilda-il-banco-di-varn
    presso: ponte-delle-mille-corde
    immagine: personaggi/varn-kett
    titolo: Il banco di Varn
    tipo: seguito
    luogo: Imbocco del Ponte delle Mille Corde, a mezzogiorno
    area: ponti-sospesi
    requisiti: [fazione.gilda == 0]
    testo: |
      A mezzogiorno il sole batte sulla lamiera del gabbiotto e dentro si
      cuoce. Varn non si toglie il cappotto color tabacco, e tu non osi
      toglierti la giubba. Davanti al banco arrivano due persone insieme.
      Una vedova con un cesto di pane coperto da un telo, che deve portarlo
      al Mercato dei Nodi e non ha la moneta della gabella. Un sacerdote del
      Velo con la tunica grigia e le mani nelle maniche, che non intende
      pagare perché il Velo, dice, non paga i ponti che garantisce.

      {galateo Media} Il sacerdote ha la tunica stirata e i sandali nuovi.
      Si è vestito per questa discussione, e la discussione gli piace più
      della strada.

      La vedova tiene il cesto con tutte e due le mani, e il pane sotto il
      telo è ancora caldo, perché lo senti. Dall'alba hai mangiato soltanto
      una crosta, e lo stomaco te lo ricorda con un brontolio. Varn ti spinge davanti il regolamento della
      Gilda, un libro con la costola rotta che si apre da solo sulle pagine
      più usate, e incrocia le braccia.

      {origine accolito-del-velo} La tunica grigia è quella dei sacerdoti
      delle parrocchie basse. Sai quali parole usa la Cattedrale quando un
      suo uomo sbaglia in pubblico, e sai anche che questo non le ha mai
      sentite.

      *Due casi in una mattina sola, e lui mi sta guardando le mani.* Dietro
      la vedova un ragazzo con un carretto di cavoli aspetta il suo turno e
      fischia una canzone dei Ponti, sbagliando sempre lo stesso punto.
    opzioni:
      - testo: "Esentare la vedova con il regolamento"
        descrizione: "Da qualche parte, nel libro della Gilda, c'è un articolo per il pane. Bisogna trovarlo prima che si raffreddi."
        prova: { attributo: mentale, abilita: politica-ed-economia, difficolta: Facile }
        successo:
          titolo: L'articolo del pane
          testo: |
            Lo trovi a metà del libro, fra le norme sulle granaglie, scritto
            in una grafia più vecchia delle altre. Il pane fresco portato a
            mano per la vendita del giorno passa senza gabella, da quando
            una carestia ha insegnato alla Gilda che un ponte vuoto non
            incassa niente. La vedova passa. Il sacerdote, davanti a un
            libro aperto, paga anche lui per non restare l'unico a
            discutere.

            Varn scrive il tuo nome sull'aria, una lettera alla volta. La
            sera Lira ti mette in mano qualche moneta e un biglietto per i
            magazzini della Gilda.
          pe: { politica-ed-economia: 3 }
          effetti: { monete: 5, rep.gilda: 0.5, fazione.gilda: 1 }
        fallimento:
          titolo: Il libro che si apre da solo
          testo: |
            Sfogli il regolamento avanti e indietro, e il libro continua ad
            aprirsi da solo sulle stesse pagine, che parlano di altro. Il
            pane intanto si raffredda. Alla fine Varn allunga una mano e
            gira tre pagine, fino all'articolo del pane fresco. La vedova
            passa. Il sacerdote paga e se ne va borbottando del tempo che
            gli avete fatto perdere.

            La sera Lira ti dà qualche moneta e un biglietto per i
            magazzini, e ti dice che Varn ti ha scritto, ma più piccolo.
          effetti: { monete: 5, fazione.gilda: 1, scandalo: 0.5 }
      - testo: "Pagare tu la gabella della vedova"
        descrizione: "Una moneta è una moneta. Il pane, invece, si raffredda."
        requisiti: [monete >= 2]
        esito:
          titolo: Di tasca tua
          testo: |
            Metti la moneta sul banco prima che Varn possa dire qualcosa. La
            vedova ti ringrazia due volte e la seconda volta ti lascia nel
            palmo una pagnotta piccola ancora calda, e tu la mangi senza
            nemmeno aspettare che sia passata. Il sacerdote vede uno
            sconosciuto pagare per una donna del popolo e mette mano alla
            borsa anche lui.

            Varn guarda la moneta e poi guarda te. Annota sull'aria qualcosa
            che non è una cifra. La sera Lira ti dà la paga della giornata e
            un biglietto per i magazzini della Gilda.
          effetti: { monete: 3, rep.gilda: 0.5, rep.ponti: 0.5, fazione.gilda: 1 }
      - testo: "Convincere il sacerdote con garbo"
        descrizione: "Il Velo garantisce il Patto delle Corde dal 127. Un garante che paga dà il buon esempio, e lui ama i buoni esempi."
        prova: { attributo: sociale, abilita: galateo, difficolta: Media }
        successo:
          titolo: Il buon esempio
          testo: |
            Gli dici che il Velo garantisce i ponti da quando sono quasi
            bruciati, e che una garanzia vale di più quando chi la dà paga
            per primo. Lo dici con l'inchino corto delle parrocchie, e lui
            se ne accorge. Paga, e lo fa davanti alla coda, con un gesto
            largo. La vedova, nel frattempo, passa con il suo pane, perché
            Varn le ha fatto segno con due dita.

            La sera Lira ti dà qualche moneta e un biglietto per i
            magazzini. «Varn dice che parli come un notaio» riferisce, e
            sembra un complimento.
          pe: { galateo: 3 }
          effetti: { monete: 5, rep.gilda: 0.5, fazione.gilda: 1 }
        fallimento:
          titolo: Il garante
          testo: |
            Gli parli del Patto delle Corde, e lui ti corregge su una data e
            su un nome, e alla fine ti spiega il Patto per un quarto d'ora.
            La coda si allunga. Alla fine Varn lo fa passare gratis per
            liberare il ponte, e lo annota sull'aria con un movimento secco.

            {galateo Media fallita} Hai trattato di storia con un uomo che
            voleva soltanto avere ragione. Bastava dargliela su una cosa
            qualsiasi.

            La sera Lira ti dà la paga della giornata e il biglietto per i
            magazzini, e non ti riferisce niente.
          effetti: { monete: 5, scandalo: 1, fazione.gilda: 1 }
      - testo: "Fargli vergogna davanti alla coda"
        descrizione: "Un sacerdote che passa gratis mentre una vedova paga il pane. La coda lo sente, se lo dici forte."
        prova: { attributo: sociale, abilita: intimidire, difficolta: Media }
        successo:
          titolo: La coda ascolta
          testo: |
            Dici ad alta voce, perché la coda senta, che il Velo non paga i
            ponti mentre le vedove pagano il pane. La coda comincia a
            mormorare. Il sacerdote diventa rosso fino alle orecchie e paga,
            e se ne va senza benedire nessuno. La vedova passa con il suo
            pane.

            La sera Lira ti dà qualche moneta e il biglietto per i
            magazzini. Ti dice anche che in Cattedrale, a quest'ora, il tuo
            nome lo sanno già.
          pe: { intimidire: 3 }
          effetti: { monete: 5, rep.gilda: 0.5, rep.velo: -0.5, fazione.gilda: 1 }
        fallimento:
          titolo: La coda ride
          testo: |
            Alzi la voce, e il sacerdote alza la sua più di te, e la coda
            ride di tutti e due in parti uguali. Varn esce dal gabbiotto,
            esenta la vedova con l'articolo del pane e fa pagare il
            sacerdote con tre parole a voce bassa.

            La sera Lira ti dà il biglietto per i magazzini della Gilda
            insieme alla paga, e ti consiglia di non passare dalla
            Cattedrale per qualche giorno.
          effetti: { monete: 5, rep.velo: -0.5, fazione.gilda: 1, sospetto: 0.5 }
      - testo: "Parlare al sacerdote da confratello"
        descrizione: "In Cattedrale ti hanno insegnato come si richiama un fratello senza farlo davanti a tutti."
        quando: [origine.accolito-del-velo >= 1]
        esito:
          titolo: A bassa voce
          testo: |
            Ti avvicini e gli dici due parole all'orecchio, con la formula
            che la Madre usa per i sacerdoti che dimenticano di essere
            ospiti nella città. Lui ti guarda le mani prima della faccia,
            riconosce il modo in cui le tieni, e paga senza discutere. La
            vedova passa con il suo pane.

            Varn scrive il tuo nome sull'aria. La sera Lira ti mette in mano
            qualche moneta e un biglietto per i magazzini della Gilda.
          pe: { galateo: 3 }
          effetti: { monete: 5, rep.gilda: 0.5, fazione.gilda: 1 }

  # ------------------------------------------------------------ passo 2 · le casse del Festival
  - id: gilda-le-casse-del-festival
    immagine: ambientazione/ponti-sospesi
    titolo: Le casse del Festival
    sommario: "Il biglietto di Lira ti manda a un magazzino della Gilda forzato la notte della razzia. L'ispettore Cosimo Venn vuole chiudere l'inventario in giornata."
    luogo: Ponti Sospesi, un magazzino della Gilda sulla campata di ponente
    area: ponti-sospesi
    requisiti: [fazione.gilda == 1]
    testo: |
      Il magazzino è una baracca lunga appesa sotto la campata di ponente,
      con il tetto di lamiera e una porta che gli orchi hanno sfondato a
      colpi d'ascia la notte del Festival. La porta nuova di legno chiaro è
      già al suo posto, e stona con tutto il resto. Dentro le casse sono
      impilate fino alle travi, e su ognuna c'è il nodo della Gilda, dipinto
      a stampo.

      Cosimo Venn, l'ispettore dei lotti, ti aspetta con il libro sotto il
      braccio e gli stivali puliti, e quando ti vede batte la penna sulla
      copertina. «Inventario di quello che hanno portato via gli orchi»
      dice. «Si chiude oggi, così domani lo firmo.» Dietro di lui, seduto su
      una cassa, un nano con la barba legata e le mani sporche di pece si
      gratta il naso. È Ormun Pell, il caposquadra dei ponteggiatori, che
      intanto guarda il soffitto.

      {percezione Media} Su alcune casse il nodo della Gilda è stato
      raschiato via con una lama, di recente, perché il legno sotto è ancora
      chiaro. Sono le casse che stanno più vicine alla porta.

      {politica-ed-economia Media} Un'orda in fuga si porta via quello che
      sta in braccio. Per svuotare mezza fila di casse da sei ci vuole un
      carro, e un carro sulle assi della campata si sente da tre ponti.

      Fra le travi qualcosa si muove, un passo leggero che si ferma quando
      alzi la testa. Ormun continua a guardare il soffitto e non dice
      niente. Ha l'aria di uno che quel passo l'ha già sentito ieri.
    opzioni:
      - testo: "Contare le casse una per una"
        descrizione: "Il libro di Cosimo dice quante ce n'erano prima della razzia. Il resto è aritmetica, se si ha pazienza."
        prova: { attributo: mentale, abilita: politica-ed-economia, difficolta: Media }
        successo:
          titolo: Il conto che non torna
          testo: |
            Conti le casse una fila alla volta, con il libro di Cosimo
            aperto sulla mano sinistra, e a metà pomeriggio hai la somma.
            Manca un terzo del magazzino, e quasi tutto quello che manca
            aveva il nodo raschiato. Gli orchi sono passati di qui, si vede
            dalla porta. Il resto se n'è andato dopo, con calma, su un
            carro.

            Cosimo legge il tuo conto e si pulisce gli stivali, uno contro
            l'altro, anche se sono puliti.
          pe: { politica-ed-economia: 3 }
          segue: gilda-l-ammanco
        fallimento:
          titolo: Il conto di Cosimo
          testo: |
            Conti le casse, ma le file sono impilate storte e due volte
            ricominci da capo. Al tramonto Cosimo ti prende il libro di
            mano, scrive una cifra sua e ti fa firmare sotto. Ormun ti passa
            accanto mentre esci e ti mormora che mancano quelle col nodo
            raschiato, e che tu hai appena firmato un conto in cui non manca
            niente.

            {politica-ed-economia Media fallita} Hai firmato senza
            rileggere, per stanchezza, che al banco è la prima cosa che
            insegnano a non fare.
          effetti: { scandalo: 1 }
          segue: gilda-l-ammanco
      - testo: "Fare due chiacchiere con il guardiano"
        descrizione: "Il magazzino ha un guardiano di notte. La notte del Festival c'era, e adesso ha molta paura di qualcosa."
        prova: { attributo: sociale, abilita: [empatia, intimidire], difficolta: Media }
        successo:
          titolo: Il carro dopo gli orchi
          testo: |
            Il guardiano è un vecchio con un occhio solo, e quando lo prendi
            da parte trema prima di parlare. La notte del Festival si è
            chiuso in una botte mentre gli orchi sfondavano la porta. Due
            notti dopo, a razzia finita, è arrivato un carro con le ruote
            fasciate di stracci. Gli uomini avevano le chiavi del lucchetto
            nuovo, e uno gli ha messo una moneta in mano per andarsi a
            scaldare alla Pignatta.

            «Avevano la livrea dei magazzini di scarico» dice, e si tocca
            l'occhio vuoto. «Io la moneta l'ho presa. Questo, al signore con
            gli stivali, non lo dici.»
          pe: { empatia: 3 }
          segue: gilda-l-ammanco
        fallimento:
          titolo: La botte
          testo: |
            Il guardiano ti racconta della botte in cui si è nascosto mentre
            gli orchi sfondavano la porta, e te lo racconta tre volte, ogni
            volta con un orco in più. Della notte dopo non dice niente.
            Quando insisti si mette a piangere, e Cosimo, dall'altra parte
            del magazzino, ti guarda come si guarda uno che maltratta i
            vecchi.

            Ormun ti passa accanto e ti dice a mezza voce di contare le
            casse con il nodo raschiato.
          effetti: { scandalo: 1 }
          segue: gilda-l-ammanco
      - testo: "Salire fra le travi"
        descrizione: "Qualcuno lassù cammina leggero e si ferma quando lo guardi. Le casse impilate fanno quasi da scala."
        prova: { attributo: fisico, abilita: acrobazia, difficolta: Media }
        successo:
          titolo: Sulle travi
          testo: |
            Sali sulle casse come su una scala storta e ti tiri su fino alla
            prima trave, con le schegge che ti entrano nei palmi. Lassù, nel
            buio caldo sotto la lamiera, due ragazzi stanno accucciati
            accanto a un sacco, e quando ti vedono si guardano fra loro.

            {acrobazia Facile} La trave regge, il tetto di lamiera no. Tieni
            il peso sui talloni e non toccare la lamiera con la testa.
          pe: { acrobazia: 3 }
          segue: gilda-fra-le-travi
        fallimento:
          titolo: La pila che crolla
          testo: |
            Sali sulle casse, ma la terza pila cede sotto il tuo piede e
            vieni giù insieme a lei, con un rumore che fa voltare tutto il
            magazzino. Fra le travi due ombre scappano verso la finestra del
            tetto e spariscono sulla campata. Ormun ti aiuta a rialzarti, ti
            toglie una scheggia dal gomito e ti dice di guardare le casse
            col nodo raschiato, perché erano quelle che quei due stavano
            guardando.
          effetti: { ferite: 1 }
          segue: gilda-l-ammanco

  - id: gilda-fra-le-travi
    immagine: icone/rope-coil
    titolo: Fra le travi
    tipo: seguito
    luogo: Ponti Sospesi, sotto il tetto del magazzino
    area: ponti-sospesi
    requisiti: [fazione.gilda == 1]
    testo: |
      I ragazzi saranno sui quattordici anni, scalzi, con le funi arrotolate
      a tracolla come cinture troppo grandi. Sono due ragazzi della corda,
      quelli che vivono sotto i ponti e salgono di sopra solo per prendere
      quello che trovano. Il sacco accanto a loro è pieno di stoppa, e sulla
      stoppa c'è un nodo della Gilda grattato via a metà, tagliato da una
      cassa.

      {rissa Facile} Il più grande tiene la mano dietro la schiena, sul
      manico di qualcosa. Il più piccolo guarda la finestra del tetto, e
      scapperà per primo.

      «Noi non abbiamo preso niente» dice il più grande. «Siamo venuti a
      vedere se era rimasto qualcosa, che è diverso.» Sotto di voi Cosimo
      chiede ad alta voce chi c'è lassù, e nessuno gli risponde.

      {origine figlio-della-citta-bassa} I ragazzi della corda li conosci,
      perché alla loro età portavi i messaggi in Via del Salmone e loro ti
      rubavano il pane dalle tasche. Le facce sono cambiate, e il modo di
      tenere la fune a tracolla è sempre lo stesso.
    opzioni:
      - testo: "Afferrarli prima che scappino"
        descrizione: "Due ragazzi svelti che conoscono il tetto meglio di te. Però sono ragazzi."
        combattimento: gilda-ragazzi-della-corda
        vittoria:
          titolo: Il nome del carro
          testo: |
            Il piccolo ti scivola fra le dita, il grande no. Lo tieni per il
            colletto mentre si dimena, e quando si stanca ti dice quello che
            sa. Due notti dopo la razzia sono venuti uomini con la livrea
            dei magazzini di scarico, hanno caricato un carro con le casse
            raschiate, e loro due hanno solo guardato. Poi lo lasci andare,
            e lui scappa dalla finestra del tetto senza voltarsi.
          segue: gilda-l-ammanco
        sconfitta:
          titolo: Scivolati via
          testo: |
            Il grande ti colpisce allo stinco con qualcosa di duro, il
            piccolo ti butta la fune fra le gambe, e quando ti rialzi sei
            solo sotto la lamiera. Dal sacco abbandonato spunta la stoppa
            con il nodo raschiato. Lo porti giù a Cosimo zoppicando, e lui
            lo prende con due dita.
          segue: gilda-l-ammanco
      - testo: "Comprarli con qualche moneta"
        descrizione: "Hanno fame e lo sanno anche loro. Il prezzo di una verità, sotto i ponti, è il prezzo di una cena."
        requisiti: [monete >= 3]
        esito:
          titolo: Il prezzo di una cena
          testo: |
            Apri la mano con le monete sul palmo, e il grande le guarda come
            si guarda una trappola. Poi le prende tutte insieme. Due notti
            dopo la razzia, dice, sono arrivati uomini con la livrea dei
            magazzini di scarico, con le chiavi del lucchetto, e hanno
            caricato un carro con le casse raschiate. Uno contava le casse
            sulle dita, con i guanti addosso.

            I due spariscono dalla finestra del tetto prima che tu possa
            chiedere altro.
          effetti: { monete: -3, informazioni.voce: 1 }
          segue: gilda-l-ammanco
      - testo: "Lasciarli andare e guardare dove vanno"
        descrizione: "Scappano dalla finestra del tetto. Dalla finestra del tetto si vede la campata, e la campata porta da qualche parte."
        prova: { attributo: fisico, abilita: [furtivita, atletica], difficolta: Media }
        successo:
          titolo: La campata di ponente
          testo: |
            Li lasci scappare e ti affacci alla finestra del tetto. I due
            corrono lungo la campata fino a una piattaforma di carico chiusa
            da un cancello, dove su un muro di tavole c'è il marchio dei
            magazzini di scarico della Gilda. Bussano due volte, e qualcuno
            gli apre.

            {furtivita Media} Due colpi e la porta si apre. Quei ragazzi qui
            sono di casa.
          segue: gilda-l-ammanco
        fallimento:
          titolo: La finestra del tetto
          testo: |
            Ti affacci alla finestra del tetto in tempo per vederli sparire
            sotto la campata, e allunghi troppo il collo. La lamiera ti
            taglia la fronte. Torni giù con il sangue negli occhi e un sacco
            di stoppa con il nodo raschiato, e Cosimo ti presta un
            fazzoletto pulito con un'aria offesa.
          effetti: { ferite: 0.5 }
          segue: gilda-l-ammanco
      - testo: "Parlare con loro come uno di Via del Salmone"
        descrizione: "I ragazzi della corda rispettano chi ha fatto il loro mestiere. Tu l'hai fatto, e si vede da come ti siedi sulla trave."
        quando: [origine.figlio-della-citta-bassa >= 1]
        esito:
          titolo: Uno di loro
          testo: |
            Ti siedi sulla trave a gambe penzoloni, come vi sedevate in Via
            del Salmone a guardare i carri, e chiedi chi paga di più adesso
            che i messaggi non li porta più nessuno. Il grande ride. Poi ti
            racconta che due notti dopo la razzia sono venuti uomini con la
            livrea dei magazzini di scarico, con le chiavi del lucchetto, e
            hanno caricato un carro con le casse raschiate.

            Se ne vanno dalla finestra del tetto, e il piccolo ti saluta con
            la mano, cosa che i ragazzi della corda non fanno mai.
          segue: gilda-l-ammanco

  - id: gilda-l-ammanco
    immagine: personaggi/lira-demos
    titolo: L'ammanco
    tipo: seguito
    luogo: Ponti Sospesi, il magazzino della Gilda
    area: ponti-sospesi
    requisiti: [fazione.gilda == 1]
    testo: |
      Al tramonto il magazzino si svuota. I facchini se ne vanno con la
      paga, Ormun si chiude la giubba e se ne va senza salutare, fischiando
      fra i denti. Restate tu e Cosimo Venn nella luce rossa che entra dalla
      porta nuova, e sul banco ci sono il libro dei lotti e quello che sai.
      Manca un terzo del magazzino, e se n'è andato dopo gli orchi, su un
      carro.

      «Lo scriviamo come razzia» dice Cosimo, e lo dice con dolcezza. «È
      stata una razzia, no? La Casa ha già abbastanza grane. Io firmo e
      firmi tu, così domani ti pago la giornata.» Ha la penna in mano, e gli
      stivali puliti che brillano nella luce rossa.

      {empatia Media} Ha fretta, e non per la Casa. Chi vuole chiudere in
      fretta un conto ha quasi sempre qualcosa da perdere, anche quando non
      ha niente da nascondere.

      Il biglietto di Lira è ancora nella tua tasca, piegato in quattro.
      Dicono che all'archivio dei dazi lei ci stia fino a tardi, e che i
      conti che non tornano li metta in una scatola di tasselli.
    opzioni:
      - testo: "Firmare con Cosimo"
        descrizione: "Una razzia è una razzia. La Casa ha già abbastanza grane, e lui paga la giornata."
        esito:
          titolo: Razzia
          testo: |
            Firmi sotto la sua firma, e lui ti stringe la mano con una mano
            fredda e asciutta. Il giorno dopo ti paga la giornata, e un po'
            di più, perché è stata lunga. Nel libro dei lotti l'ammanco è
            diventato una riga sola, *razzia del Festival*, scritta in bella
            grafia. Quando lo dici a Lira lei annuisce senza dire niente, e
            la mano le va alla scatola dei tasselli e si ferma lì.
          imposta: { gilda.ammanco: 1 }
          effetti: { monete: 12, rep.gilda: 0.5, fazione.gilda: 1 }
      - testo: "Portare l'ammanco a Lira"
        descrizione: "Cosimo vuole chiudere in fretta. Lira all'archivio i conti che non tornano non li chiude mai."
        esito:
          titolo: Un tassello
          testo: |
            Dici a Cosimo che il conto lo porti all'archivio, e lui chiude
            il libro con uno scatto e se ne va. All'archivio dei dazi Lira
            ti ascolta ordinando i tasselli per forma. Quando hai finito ne
            prende uno a forma di carro, lo inchioda sulla costola di un
            registro nuovo e ci scrive dentro la data. «Non serve a niente,
            oggi» dice. «I conti così servono fra un anno.»

            Ti paga la giornata di tasca sua. Uscendo la senti dire il tuo
            nome a qualcuno nella stanza accanto, e la voce che le risponde
            è quella calma del Sovrintendente.
          imposta: { gilda.ammanco: 2 }
          effetti: { monete: 8, rep.gilda: 0.5, gilda.voti: 1, fazione.gilda: 1 }

  # ------------------------------------------------------------ passo 3 · il nodo di cera
  - id: gilda-il-nodo-di-cera
    presso: gilda-casa-dei-nodi
    immagine: fazioni/gilda-dei-mercanti
    titolo: Il nodo di cera
    sommario: "Alla Casa dei Nodi un socio nuovo ha bisogno di un padrino che lo presenti. Te ne offrono due, e il Sovrintendente ti stringe la mano senza chiedere niente."
    luogo: Casa dei Nodi, la sala dei soci
    area: quartieri-alti
    requisiti: [fazione.gilda == 2]
    testo: |
      La sala dei soci è una stanza lunga e bassa al pianterreno della Casa
      dei Nodi, con le travi annerite dal fumo delle lampade. Da una trave
      all'altra corre la fune dei soci, una vecchia gomena grossa come un
      braccio, e lungo la fune pendono centinaia di nodi di cera, verdi,
      ognuno con un cartellino e un nome. I primi tiracorde, il giorno del
      Patto, firmarono con un nodo perché scrivere non lo sapevano, e alla
      Casa si fa ancora così.

      Per avere il tuo nodo serve un padrino. Irsa Valbrun è venuta con il
      grembiule da bottega sopra il panciotto, e ti offre il suo nome e
      quello delle botteghe che votano con lei. Accanto alla finestra un
      uomo magro in giacca di velluto ti fa un inchino. È Ansaldo Morlacchi,
      il consigliere che tiene le carovane e i magazzini di scarico, e ti
      offre il suo nome e una paga, ogni mese, contando le condizioni sulle
      dita guantate.

      {conoscenze-della-strada Media} I magazzini di scarico hanno una
      livrea. Al magazzino di ponente qualcuno ti ha già detto di che colore
      è, ed è quella che hanno addosso i due uomini fermi alla porta.

      Tarquin Cordani passa in mezzo alla sala in camicia bianca, con i
      polsini dai piccoli sigilli di casa, e ti stringe la mano come se vi
      conosceste, senza chiederti niente. Va a sedersi in fondo, con le mani
      ferme sul tavolo.

      {galateo Media} Irsa ti guarda prima le mani, poi gli occhi. Morlacchi
      ti guarda le scarpe, e Cordani non ti guarda affatto, che in questa
      sala è il modo più gentile di lasciarti libero.
    opzioni:
      - testo: "Chiedere a Irsa di farti da madrina"
        descrizione: "Le botteghe, l'ala pragmatica, il Velo che la stima. E un'armaiola che ti guarda le mani prima di fidarsi."
        immagine: personaggi/irsa-valbrun
        esito:
          titolo: La madrina col grembiule
          testo: |
            Irsa ti stringe la mano e la gira, palmo in su, per guardarti i
            calli. «Va bene» dice. «Ma alla Casa i miei soci votano come
            pensano, e tu farai lo stesso.» Morlacchi ti fa un altro
            inchino, più corto del primo, e torna alla finestra a contare
            qualcosa sulle dita.
          imposta: { gilda.padrino: 1 }
          segue: gilda-il-nodo-davanti-ai-soci
      - testo: "Accettare Morlacchi e la sua paga"
        descrizione: "Un nome che apre i magazzini e una paga ogni mese. Le condizioni le conta lui, sulle dita."
        immagine: icone/hooded-figure
        esito:
          titolo: Le dita guantate
          testo: |
            Morlacchi ti prende la mano fra le sue, e il velluto dei guanti
            è caldo. «I magazzini sono il cuore della Gilda» dice. «I ponti
            sono soltanto le vene.» Ti spiega le condizioni contandole sulle
            dita, ed esaurisce una mano. Irsa si toglie il grembiule e lo
            piega con cura, poi se ne va senza voltarsi.
          imposta: { gilda.padrino: 2 }
          segue: gilda-il-nodo-davanti-ai-soci
      - testo: "Accettare Morlacchi e trattare la paga"
        descrizione: "Uno che conta sulle dita le condizioni ha già contato anche quanto è disposto a cedere."
        immagine: icone/hooded-figure
        prova: { attributo: sociale, abilita: persuasione, difficolta: Media }
        successo:
          titolo: Il sesto dito
          testo: |
            Lo lasci contare fino alla quinta condizione e poi gli chiedi se
            ce n'è una sesta, quella che riguarda te. Morlacchi ride piano,
            e la paga del primo mese te la mette in mano subito, in una
            borsa di velluto. «Mi piacciono i soci che sanno contare» dice.
            Irsa se ne va senza voltarsi.
          imposta: { gilda.padrino: 2 }
          effetti: { monete: 10 }
          segue: gilda-il-nodo-davanti-ai-soci
        fallimento:
          titolo: Le condizioni
          testo: |
            Provi a discutere la paga, e Morlacchi ti ascolta con la testa
            inclinata, poi ricomincia a contare le condizioni dalla prima,
            con più calma, come si fa con i bambini. Alla fine accetti
            quelle che aveva detto lui, e due uomini alla porta si scambiano
            un'occhiata.

            {persuasione Media fallita} Hai trattato con uno che tratta per
            mestiere davanti a mezza sala. La sala si ricorderà chi ha
            ceduto.
          imposta: { gilda.padrino: 2 }
          effetti: { rep.gilda: -0.5, scandalo: 0.5 }
          segue: gilda-il-nodo-davanti-ai-soci
      - testo: "Chiedere a Corin Ashdale"
        descrizione: "Corin è socio da anni, paga da bere a tutti e non ha mai fatto da padrino a nessuno. Te l'ha offerto lui, una sera."
        immagine: personaggi/corin-ashdale
        requisiti: [pista.corin < 6]
        esito:
          titolo: Il fazzoletto al taschino
          testo: |
            Corin si alza da una panca in fondo, si sistema il fazzoletto al
            taschino e attraversa la sala per abbracciarti, cosa che alla
            Casa dei Nodi non si fa. «Il mio primo figlioccio» dice,
            abbastanza forte perché lo senta Morlacchi. Irsa sorride.
            Morlacchi conta qualcosa sulle dita e lascia perdere.
          imposta: { gilda.padrino: 3 }
          segue: gilda-il-nodo-davanti-ai-soci
      - testo: "Chiedere a Corin Ashdale"
        descrizione: "Corin è tornato da Laresh per l'Arena, e alla Casa dei Nodi tutti lo salutano. Un figlioccio non l'ha mai avuto."
        immagine: personaggi/corin-ashdale
        requisiti: [pista.corin >= 6, pista.arena >= 1]
        esito:
          titolo: Il fazzoletto al taschino
          testo: |
            Corin ha ancora la polvere della strada di Laresh sugli stivali.
            Si alza da una panca in fondo, si sistema il fazzoletto al
            taschino e attraversa la sala per abbracciarti, cosa che alla
            Casa dei Nodi non si fa. «Il mio primo figlioccio» dice,
            abbastanza forte perché lo senta Morlacchi. Irsa sorride, e
            Morlacchi lascia perdere.
          imposta: { gilda.padrino: 3 }
          segue: gilda-il-nodo-davanti-ai-soci

  - id: gilda-il-nodo-davanti-ai-soci
    presso: gilda-casa-dei-nodi
    immagine: icone/knot
    titolo: Il nodo davanti ai soci
    tipo: seguito
    luogo: Casa dei Nodi, sotto la fune dei soci
    area: quartieri-alti
    requisiti: [fazione.gilda == 2, gilda.padrino >= 1]
    testo: |
      Il nodo si fa davanti a tutti, su una scala a pioli appoggiata alla
      trave, con un filo di cera verde scaldato su una lampada e il
      cartellino con il tuo nome. Il padrino regge la scala. I soci guardano
      dal basso, con le mani in tasca o sul panciotto, e qualcuno scommette
      a mezza voce su quanto reggerà la cera. Non sono pochi i nodi caduti,
      e chi li ha fatti cadere se lo sente ricordare per anni.

      {acrobazia Facile} La scala è vecchia e storta, e la trave è più alta
      di quanto sembri dal basso. Il piolo buono è il terzo, gli altri sono
      lucidi di cera.

      {accademiche Media} Il nodo del Patto è un nodo da carico, quello che
      i tiracorde usavano per le funi portanti. Ha due giri e una volta, e
      se lo stringi dalla parte giusta regge una campata.

      La lampada ti scalda la cera fra le dita, e le dita sudano. *Un nodo è
      soltanto un nodo, e lo guardano in duecento.* In fondo alla sala
      Tarquin Cordani ha smesso di parlare con il vicino e guarda la fune.
    opzioni:
      - testo: "Salire e fare il nodo in alto, dove si vede"
        descrizione: "I nodi più alti sono quelli dei soci che contano. È anche dove la scala balla di più."
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Facile }
        successo:
          titolo: Il nodo in alto
          testo: |
            Sali fino all'ultimo piolo e fai il nodo sopra tutti gli altri,
            con la cera che ti brucia i polpastrelli e la scala che si muove
            a ogni giro. Quando scendi qualcuno applaude, e qualcun altro
            paga una scommessa. Lira ti scrive nel Libro dei soci, e Varn ti
            mette in mano il gettone di bronzo con il nodo inciso, e il tuo
            nome dall'altra parte, già pronto. Chi non aveva la licenza
            della Gilda la riceve con il gettone, e i soci la commissione
            non la pagano.

            Prima di sera ti dicono dove andare. Sei carri di attrezzi
            partono per Laresh dalla Superficie, e alla Casa serve qualcuno
            che li porti al bivio e torni con il grano.
          pe: { acrobazia: 3 }
          almeno: { rep.gilda: 2 }
          imposta: { licenza-gilda: 1 }
          effetti: { oggetto.gilda-gettone-del-socio: 1, monete: 30, fazione.gilda: 1 }
        fallimento:
          titolo: Il nodo che scivola
          testo: |
            Sali, ma al quarto piolo la scala gira su se stessa e tu ti
            aggrappi alla fune con tutte e due le mani. Tre nodi di altri
            soci cadono sul pavimento. Il tuo lo fai più in basso e in
            fretta mentre la sala ride, e tiene lo stesso. Lira ti scrive
            nel Libro dei soci lo stesso, e Varn ti mette in mano il gettone
            di bronzo con il nodo inciso. Chi non aveva la licenza della
            Gilda la riceve con il gettone.

            I tre soci dei nodi caduti si ricorderanno il tuo nome a lungo.
            Prima di sera ti mandano a scortare sei carri che partono per
            Laresh dalla Superficie.
          almeno: { rep.gilda: 2 }
          imposta: { licenza-gilda: 1 }
          effetti: { oggetto.gilda-gettone-del-socio: 1, monete: 30, scandalo: 1, fazione.gilda: 1 }
      - testo: "Fare il nodo del Patto, quello delle funi portanti"
        descrizione: "Due giri e una volta, stretto dalla parte giusta. I vecchi soci lo riconoscono al primo giro."
        prova: { attributo: mentale, abilita: [accademiche, tecnologia], difficolta: Facile }
        successo:
          titolo: Due giri e una volta
          testo: |
            Fai il nodo da carico delle tiracorde con i suoi due giri e la
            volta, e lo stringi dalla parte del peso. Un vecchio socio in
            prima fila lo riconosce e lo dice ad alta voce, e la sala smette
            di scommettere. Lira ti scrive nel Libro dei soci, e Varn ti
            mette in mano il gettone di bronzo con il nodo inciso. Chi non
            aveva la licenza della Gilda la riceve con il gettone, e i soci
            la commissione non la pagano.

            Prima di sera ti dicono dove andare. Sei carri di attrezzi
            partono per Laresh dalla Superficie, e alla Casa serve qualcuno
            che li porti al bivio e torni con il grano.
          pe: { accademiche: 3 }
          almeno: { rep.gilda: 2 }
          imposta: { licenza-gilda: 1 }
          effetti: { oggetto.gilda-gettone-del-socio: 1, monete: 30, fazione.gilda: 1 }
        fallimento:
          titolo: Il nodo da pacchi
          testo: |
            Cominci il nodo del Patto e a metà non ti ricordi più da che
            parte va la volta. Finisce in un nodo da pacchi con il fiocco, e
            la sala ride di cuore. Il nodo tiene lo stesso. Lira ti scrive
            nel Libro dei soci, e Varn ti mette in mano il gettone di
            bronzo. Chi non aveva la licenza della Gilda la riceve con il
            gettone.

            Per un mese alla Casa ti chiameranno quello del fiocco. Prima di
            sera ti mandano a scortare sei carri che partono per Laresh
            dalla Superficie.
          almeno: { rep.gilda: 2 }
          imposta: { licenza-gilda: 1 }
          effetti: { oggetto.gilda-gettone-del-socio: 1, monete: 30, scandalo: 1, fazione.gilda: 1 }
      - testo: "Fare il nodo come sulle corde della Cicatrice"
        descrizione: "Sulle piattaforme si annoda appesi nel vuoto, con una mano sola. Una scala a pioli non ti fa nessuna paura."
        quando: [origine.apprendista-raschiatore >= 1]
        esito:
          titolo: Una mano sola
          testo: |
            Sali la scala senza tenerti, come si sale sulle piattaforme, e
            fai il nodo con una mano sola, l'altra in tasca. Qualche socio
            storce il naso, perché alla Casa dei Nodi i Raschiatori non
            piacciono, e qualcun altro paga la scommessa. Lira ti scrive nel
            Libro dei soci, e Varn ti dà il gettone di bronzo con il nodo
            inciso. Chi non aveva la licenza della Gilda la riceve con il
            gettone.

            Prima di sera ti mandano a scortare sei carri che partono per
            Laresh dalla Superficie.
          pe: { acrobazia: 3 }
          almeno: { rep.gilda: 2 }
          imposta: { licenza-gilda: 1 }
          effetti: { oggetto.gilda-gettone-del-socio: 1, monete: 30, fazione.gilda: 1 }
      - testo: "Fare il nodo da banco dei Ponti"
        descrizione: "Al banco i pacchi della Gilda si chiudono con il nodo dei soci da quando avevi otto anni. Lo fai a occhi chiusi."
        quando: [origine.mercante-dei-ponti >= 1]
        esito:
          titolo: A occhi chiusi
          testo: |
            Fai il nodo dei soci con la stessa velocità con cui chiudi un
            pacco al banco, senza guardare la cera, e lo stringi prima che
            la sala abbia finito di scommettere. Qualcuno riconosce il gesto
            e dice il nome del tuo banco. Lira ti scrive nel Libro dei soci,
            e Varn ti dà il gettone di bronzo con il nodo inciso. La licenza
            ce l'hai già, e da oggi la commissione non la paghi più.

            Prima di sera ti mandano a scortare sei carri che partono per
            Laresh dalla Superficie.
          pe: { acrobazia: 3 }
          almeno: { rep.gilda: 2 }
          imposta: { licenza-gilda: 1 }
          effetti: { oggetto.gilda-gettone-del-socio: 1, monete: 30, fazione.gilda: 1 }

  # ------------------------------------------------------------ passo 4 · i sei carri (la spedizione è in spedizione-laresh.yaml)
  - id: gilda-i-sei-carri
    immagine: ambientazione/laresh
    titolo: I sei carri per Laresh
    sommario: "Fuori dalle mura aspettano sei carri della Gilda e una muta di cani da soma. Li guida Cahir, uno stalliere di Laresh che vorrebbe una carovana sua."
    luogo: Superficie Fratturata, dove la strada lastricata finisce
    area: superficie-fratturata
    requisiti: [fazione.gilda == 3]
    testo: |
      I carri aspettano dove la strada lastricata finisce e comincia il
      sentiero, sei carri bassi coperti di tela cerata con dentro attrezzi e
      sale per Laresh. Al bivio di Laresh li scaricheranno e li riempiranno
      di grano. Attaccati alle stanghe ci sono cani da soma grossi come
      vitelli, con il pelo raso e le orecchie mozze, che ti annusano le mani
      uno alla volta.

      Li guida un mezzelfo giovane con i capelli legati e una cicatrice di
      morso sull'avambraccio. Si chiama Cahir e fa lo stalliere a Laresh. Ti
      dice in faccia, prima ancora di presentarsi bene, che a lui una
      carovana della Gilda non piace, e che un giorno ne avrà una sua.

      {empatia Facile} Lo dice a te perché sei nuovo e non conti ancora
      niente. A un socio vecchio non lo direbbe.

      «La carovana della settimana scorsa non è mai arrivata» aggiunge,
      sistemando un finimento. «Al bivio non l'hanno vista. In città il pane
      è salito, e alla Casa dei Nodi qualcuno ha deciso di mandare un socio
      nuovo a vedere com'è la strada.»

      {resistenza Media} Il vento della Superficie ha già trovato il buco
      nella tua giubba, all'altezza dei reni. Prima di sera lo troverà anche
      la fatica.

      {origine figlio-del-circolo} I cani da soma hanno il muso verso nord
      anche da fermi, e le orecchie mozze tese nella stessa direzione. Al
      Circolo una muta che guarda tutta da una parte si lascia in pace
      finché non ha deciso cosa vuole.
    opzioni:
      - testo: "Partire con i carri"
        descrizione: "Al passo dei cani, con la tela cerata che sbatte e Cahir che non parla."
        esito:
          titolo: Il sentiero dei carri
          testo: |
            Cahir schiocca la lingua e i cani tirano tutti insieme, con un
            rumore di finimenti. La strada lastricata finisce sotto le ruote
            del primo carro, e da lì in avanti è sentiero. Cammini accanto
            all'ultimo carro con la mano sulla tela, e la città alle tue
            spalle diventa una macchia grigia sopra la Cicatrice.
          vai: gilda-pista-di-laresh
      - testo: "Partire a cavallo, in testa alla carovana"
        descrizione: "Dalla sella si vede la strada prima dei cani, e le gambe ringraziano."
        requisiti: [chiave.cavalcatura >= 1]
        costo: 0
        esito:
          titolo: In testa
          testo: |
            Monti in sella e prendi la testa della carovana. Cahir ti guarda
            la cavalcatura da esperto, la bocca, gli zoccoli, il modo in cui
            tieni le redini, e alla fine fa un cenno di approvazione che
            sembra costargli. Dalla sella la strada si vede prima, e i cani
            ti seguono senza bisogno di schiocchi.
          vai: gilda-pista-di-laresh
      - testo: "Farsi raccontare della carovana scomparsa"
        descrizione: "Cahir ama i suoi cani più di quanto detesti la Gilda, e i cani di quella carovana erano suoi."
        prova: { attributo: sociale, abilita: [empatia, addestrare-animali], difficolta: Media }
        successo:
          titolo: I cani di Cahir
          testo: |
            Gli chiedi dei cani, invece che della carovana, e lui per la
            prima volta ti guarda. Erano quattro, i migliori della sua muta,
            e la carovana li portava al bivio con un carico di grano e di
            bestiame. In fondo alla fila, dice, c'era un carro coperto che
            non era di Laresh, con un uomo della Gilda a cassetta. Di quel
            carro Cahir sa soltanto che gli piaceva poco.

            Poi schiocca la lingua e i cani tirano.
          effetti: { informazioni.voce: 1 }
          vai: gilda-pista-di-laresh
        fallimento:
          titolo: Il finimento
          testo: |
            Gli chiedi della carovana, e Cahir si mette a sistemare un
            finimento che era già a posto. Ti risponde che lui guida i cani
            e basta, e che le domande le fanno alla Casa dei Nodi. Poi
            schiocca la lingua, e i cani partono senza aspettarti.

            {empatia Media fallita} Hai chiesto della carovana a uno che
            aveva perso i cani. Era la domanda della Gilda, e lui ha
            risposto alla Gilda.
          vai: gilda-pista-di-laresh
          effetti: { scandalo: 0.5 }

  # ------------------------------------------------------------ passo 5 · timbri di notte
  - id: gilda-timbri-di-notte
    presso: mercato-dei-nodi
    immagine: personaggi/ambrin-qell
    titolo: Timbri di notte
    sommario: "Ambrin Qell ha comprato tre cristalli con il timbro della Gilda, ed erano sterili. Al Nodo d'Ossidiana vuole sapere che cosa vale un timbro, adesso che sei un socio."
    luogo: Mercato dei Nodi, il Nodo d'Ossidiana
    area: ponti-sospesi
    requisiti: [fazione.gilda == 4, gilda.cristalli == 0]
    testo: |
      Il corvo sul bancone del Nodo d'Ossidiana ti guarda entrare e poi
      guarda il gettone di bronzo che ti pende dalla cintura. Ambrin Qell
      non si alza. Sul vetro del bancone ha messo tre cristalli in fila, su
      un panno nero, e accanto a ciascuno c'è un cartellino di carta con il
      nodo verde del timbro della Gilda e la data.

      «Li ho comprati in regola» dice. «Carichi e timbrati, al prezzo dei
      carichi. Il timbro della Casa dovrebbe voler dire qualcosa.» Spinge il
      panno verso di te con la punta di un dito. «A te lo chiedo perché
      porti il gettone e non sei ancora abbastanza vecchio da mentire bene.»

      {magia Media} Sul vetro i tre cristalli dovrebbero ronzare appena,
      come tutti i cristalli carichi vicini fra loro, e invece restano muti.
      Il Mana, qui sopra, è fermo come l'acqua in un catino.

      {tecnologia Media} Le facce dei cristalli sono tagliate troppo bene.
      Un cristallo carico si taglia lungo le vene, mentre questi sono stati
      squadrati come mattoni, per farli sembrare più grossi.

      {origine allievo-di-torvessa} Al primo anno in Accademia vi facevano
      tenere in mano un cristallo sterile e uno carico, a occhi chiusi,
      finché non sentivate la differenza nei polpastrelli. Ti prudono le
      dita prima ancora di toccarli.

      Il corvo fa due passi lungo il bancone e si ferma accanto al terzo
      cristallo, con la testa piegata.
    opzioni:
      - testo: "Provare i cristalli"
        descrizione: "Un cristallo carico risponde a chi sa ascoltarlo, o a chi sa smontarlo."
        prova: { attributo: mentale, abilita: [magia, tecnologia], difficolta: Media }
        successo:
          titolo: Tre cristalli sterili
          testo: |
            Li tieni uno alla volta fra pollice e indice e aspetti il
            battito lento dei cristalli carichi, che non arriva. Sono
            sterili, buoni per fare lume in cucina, e qualcuno li ha
            timbrati come carichi. Ambrin annuisce lentamente, perché lo
            sospettava. Ti paga il disturbo e ti dà i cartellini, che
            portano tutti lo stesso numero di banco, quello del banco del
            timbro alla Casa dei Nodi.
          pe: { magia: 3 }
          imposta: { gilda.cristalli: 1 }
          effetti: { monete: 10, rep.nodo: 0.5 }
        fallimento:
          titolo: Il battito che non c'è
          testo: |
            Tieni i cristalli in mano a lungo, e a un certo punto ti sembra
            di sentire un battito, che invece è il tuo polso. Ambrin ti
            guarda sbagliare con pazienza. Poi è lei a dirti che sono
            sterili. Ti dà i cartellini, che portano tutti il numero del
            banco del timbro alla Casa dei Nodi. Il disturbo non te lo paga.

            {magia Media fallita} Hai cercato il Mana e hai trovato te
            stesso, che succede a tutti la prima volta e diverte sempre chi
            guarda.
          imposta: { gilda.cristalli: 1 }
          effetti: { tormento: 1 }
      - testo: "Leggere il Mana nei cristalli"
        descrizione: "L'incantesimo che si insegna in Accademia proprio per i cristalli falsi."
        incantesimo: leggere-il-mana
        prova: { attributo: mentale, abilita: magia, difficolta: Facile }
        successo:
          titolo: Il Mana fermo
          testo: |
            Apri la mano sopra il panno e lasci che il Mana ti salga nel
            palmo. Sopra i tre cristalli non sale niente. Sono sterili,
            timbrati come carichi da qualcuno che sapeva che nessuno li
            avrebbe provati. Ambrin ti paga il disturbo e ti dà i
            cartellini, che portano tutti il numero del banco del timbro
            alla Casa dei Nodi.
          pe: { magia: 3 }
          imposta: { gilda.cristalli: 1 }
          effetti: { monete: 10, rep.nodo: 0.5 }
        fallimento:
          titolo: La mano vuota
          testo: |
            Il Mana ti sfugge fra le dita e torna indietro, freddo, fino al
            gomito. Ambrin aspetta che tu ti riprenda, poi ti dice che sono
            sterili e ti dà i cartellini, che portano tutti il numero del
            banco del timbro alla Casa dei Nodi.
          imposta: { gilda.cristalli: 1 }
          effetti: { tormento: 1 }
      - testo: "Confrontare i timbri"
        descrizione: "Un timbro vero della Gilda ce l'hai in tasca, sulla licenza. Gli altri si guardano accanto a quello."
        prova: { attributo: mentale, abilita: percezione, difficolta: Media }
        successo:
          titolo: Il nodo storto
          testo: |
            Metti la tua licenza accanto ai cartellini e guardi i timbri con
            il naso a un palmo dal vetro. Il nodo dei cartellini è giusto,
            la data anche, ma l'inchiostro è più fresco della data di una
            settimana. Su ogni cartellino il timbro è stato battuto due
            volte, come fa chi timbra di fretta e al buio. Il numero di
            banco è quello del banco del timbro della Casa dei Nodi. Ambrin
            ti paga il disturbo senza contare le monete.
          pe: { percezione: 3 }
          imposta: { gilda.cristalli: 1 }
          effetti: { monete: 10, rep.nodo: 0.5 }
        fallimento:
          titolo: Timbri uguali
          testo: |
            Guardi i timbri finché ti sembrano tutti uguali al tuo, e allora
            lo dici. Ambrin sorride appena e ti fa notare che il tuo timbro
            è vecchio di un anno e il loro di una settimana, e che sui loro
            il nodo è battuto due volte. Ti dà i cartellini con il numero
            del banco del timbro, e il disturbo non te lo paga.
          imposta: { gilda.cristalli: 1 }
          effetti: { rep.nodo: -0.5, scandalo: 0.5 }
      - testo: "Sentirli con i polpastrelli, come al primo anno"
        descrizione: "In Accademia l'esercizio si faceva a occhi chiusi. Un cristallo sterile è freddo in un modo suo."
        quando: [origine.allievo-di-torvessa >= 1]
        esito:
          titolo: Freddi nel modo sbagliato
          testo: |
            Chiudi gli occhi e prendi i tre cristalli uno dopo l'altro. Sono
            freddi come il vetro, mentre un cristallo carico è freddo come
            l'acqua di pozzo, e la differenza te l'hanno fatta imparare a
            forza di ore. Ambrin ti paga il disturbo e ti dà i cartellini,
            che portano tutti il numero del banco del timbro alla Casa dei
            Nodi.
          pe: { magia: 3 }
          imposta: { gilda.cristalli: 1 }
          effetti: { monete: 10, rep.nodo: 0.5 }

  - id: gilda-il-cassetto-di-elleri
    presso: gilda-casa-dei-nodi
    immagine: fazioni/gilda-dei-mercanti
    titolo: Il banco del timbro
    sommario: "I cartellini dei cristalli sterili portano il numero del banco del timbro. I sigilli della Casa li custodisce il cancelliere Marzio Elleri, e la sera chiude a chiave."
    luogo: Casa dei Nodi, il banco del timbro
    area: quartieri-alti
    requisiti: [fazione.gilda == 4, gilda.cristalli >= 1, gilda.cassetto == 0]
    testo: |
      Il banco del timbro sta in fondo al corridoio del primo piano, sotto
      una finestra alta, e la coda dei mercanti arriva fino alle scale.
      Dietro il banco siede Marzio Elleri, cancelliere della Casa, che fa
      anche l'avvocato della Gilda. È un uomo rotondo e gentile con i
      manicotti di tela sulle maniche per non sporcarle d'inchiostro. Timbra
      sorridendo e chiede a tutti della famiglia. Non alza mai la voce,
      nemmeno con il mercante che gli grida in faccia per un ritardo.

      I sigilli stanno in un cassetto del banco, chiuso con una chiave che
      Elleri porta appesa al collo, sotto la camicia. A sera chiude il
      cassetto, saluta gli impiegati uno per uno e se ne va per ultimo.

      {ingannare Media} È gentile con tutti allo stesso modo, il che vuol
      dire che non lo è con nessuno. Una gentilezza così si impara come un
      mestiere.

      {furtivita Media} Dietro il banco c'è una tenda che nasconde un
      ripostiglio di scope. Da lì il cassetto si vede, e chi passa nel
      corridoio non vede il ripostiglio.

      Ti metti in coda con i cartellini in tasca. Quando arriva il tuo turno
      Elleri ti chiede come sta il tuo padrino e lo chiama per nome, anche
      se tu non gli hai detto chi è.
    opzioni:
      - testo: "Restare nella Casa dopo la chiusura"
        descrizione: "Dietro la tenda del ripostiglio si aspettano alcune ore al buio. Chi usa il timbro di notte lo usa quando non c'è nessuno."
        prova: { attributo: fisico, abilita: furtivita, difficolta: Difficile }
        successo:
          titolo: La lampada schermata
          testo: |
            Aspetti dietro la tenda finché la Casa tace e le gambe ti si
            addormentano. Dopo la seconda campana la porta del corridoio si
            apre, e Marzio Elleri torna con una lampada schermata da un
            fazzoletto. Apre il cassetto con la chiave che porta al collo e
            timbra trenta cartellini, due colpi ciascuno, in fretta. Poi li
            infila in una busta di cuoio con il marchio dei magazzini di
            scarico.

            Esci alla prima luce dalla finestra dei bagni, con le ginocchia
            che scricchiolano a ogni passo.
          pe: { furtivita: 5 }
          imposta: { gilda.cassetto: 1 }
          segue: gilda-quello-che-sai-dei-timbri
        fallimento:
          titolo: La scopa
          testo: |
            Dietro la tenda urti una scopa, e la scopa cade proprio mentre
            Elleri chiude il cassetto. Lui scosta la tenda con due dita e ti
            guarda, gentile come sempre. «Il ripostiglio è freddo, di sera»
            dice, «e gli impiegati se ne sono andati.» Ti accompagna alla
            porta chiedendoti del tempo. Sulla scrivania, accanto al
            cassetto, hai visto una busta di cuoio con il marchio dei
            magazzini di scarico, piena di cartellini già timbrati.
          imposta: { gilda.cassetto: 1 }
          effetti: { sospetto: 1.5 }
          segue: gilda-quello-che-sai-dei-timbri
      - testo: "Parlare dei sigilli con Elleri"
        descrizione: "Un uomo che ama il suo lavoro ne parla volentieri. Basta fargli le domande di un socio nuovo e curioso."
        prova: { attributo: sociale, abilita: [galateo, ingannare], difficolta: Media }
        successo:
          titolo: Il secondo colpo
          testo: |
            Gli chiedi, da socio nuovo, perché i timbri della Casa si
            battono una volta sola. Elleri si illumina e ti spiega che un
            timbro buono si batte una volta, e che chi lo batte due volte ha
            fretta o ha la mano che trema. Lo dice guardando i tuoi
            cartellini, che hai lasciato sul banco, e per la prima volta
            smette di sorridere. Poi li timbra con il suo una volta sola, e
            te li rende senza una parola.

            Mentre te ne vai vedi che apre il cassetto e ci guarda dentro.
          pe: { galateo: 3 }
          imposta: { gilda.cassetto: 1 }
          segue: gilda-quello-che-sai-dei-timbri
        fallimento:
          titolo: La famiglia
          testo: |
            Gli chiedi dei sigilli, ed Elleri ti risponde parlando del tuo
            padrino e della strada di Laresh, che sa più lunga di quanto gli
            hai detto. Alla fine sei tu ad aver risposto a lui. Prima che tu
            te ne vada, però, apre il cassetto per riporre la penna, e
            dentro vedi una busta di cuoio con il marchio dei magazzini di
            scarico, piena di cartellini timbrati.

            {ingannare Media fallita} Era lui a fare le domande, e tu non te
            ne sei accorto fino alle scale.
          imposta: { gilda.cassetto: 1 }
          effetti: { sospetto: 1 }
          segue: gilda-quello-che-sai-dei-timbri
      - testo: "Pagare il garzone delle lampade"
        descrizione: "Il garzone accende e spegne le lampade della Casa. Vede chi resta dopo la chiusura, e nessuno gli chiede mai niente."
        requisiti: [monete >= 5]
        esito:
          titolo: Le lampade del primo piano
          testo: |
            Il garzone prende le monete e se le mette in bocca, una alla
            volta, per contarle con la lingua. Poi ti racconta che il
            cancelliere torna tre sere a settimana, dopo la seconda campana,
            con una lampada schermata, e che riparte con una busta di cuoio
            dei magazzini di scarico. Lui gli accende la lampada del
            corridoio e Elleri gli dà una caramella di menta, ogni volta.
          imposta: { gilda.cassetto: 1 }
          effetti: { monete: -5 }
          segue: gilda-quello-che-sai-dei-timbri
      - testo: "Mettersi in coda e guardare come timbra"
        descrizione: "Tre ore di coda sono tante, ma da metà fila si vede bene il banco."
        costo: 2
        esito:
          titolo: Tre ore di coda
          testo: |
            Ti rimetti in coda tre volte, con tre scuse diverse, e guardi
            Elleri lavorare. Timbra tutto una volta sola, pulito. Solo una
            volta, quando un uomo con la livrea dei magazzini di scarico gli
            lascia una busta di cuoio, lui la infila nel cassetto senza
            aprirla e senza timbrarla, e chiude subito a chiave.
          imposta: { gilda.cassetto: 1 }
          segue: gilda-quello-che-sai-dei-timbri

  - id: gilda-quello-che-sai-dei-timbri
    presso: gilda-casa-dei-nodi
    immagine: personaggi/varn-kett
    titolo: Quello che sai dei timbri
    tipo: seguito
    luogo: Casa dei Nodi, la scalinata
    area: quartieri-alti
    requisiti: [fazione.gilda == 4, gilda.cassetto >= 1]
    testo: |
      Sulla scalinata della Casa, all'uscita, ti fermi a metà e ti siedi su
      un gradino consumato. I timbri falsi escono dal cassetto di Marzio
      Elleri e finiscono nelle buste dei magazzini di scarico. Lo sai, e non
      hai niente in mano che lo provi. Un cartellino battuto due volte e una
      busta di cuoio vista di sfuggita valgono la tua parola, e la tua
      parola alla Casa dei Nodi vale quanto un nodo di cera vecchio di un
      mese.

      {politica-ed-economia Media} Un avvocato della Gilda che timbra di
      notte sa anche come spiegarlo di giorno. Contro uno così una prova
      sola è un regalo, perché gli dice dove guardare.

      Varn Kett sta salendo la scalinata con la lista del giorno appuntata
      alla cintura e gli stivali da pioggia. Quando ti vede rallenta, e la
      sua mano destra comincia a scrivere sull'aria prima che tu abbia
      aperto bocca.
    opzioni:
      - testo: "Dirlo a Varn"
        descrizione: "Varn non fa niente senza una prova. Però scrive tutto, e non sbaglia mai una riga."
        esito:
          titolo: Una riga sull'aria
          testo: |
            Glielo dici a voce bassa, seduto sul gradino. Varn ti ascolta in
            piedi senza guardarti. La sua mano scrive una riga lunga, poi
            torna a sinistra e scende di un dito. «Il cancelliere» dice
            soltanto, e per un poco la mano resta ferma. «Lo scrivo, e
            aspetto. Tu non fare niente.» Poi riprende la salita, con gli
            stivali che lasciano l'impronta bagnata sui gradini. Prima di
            entrare si volta e ti fa un cenno con il mento, uno solo.
          imposta: { gilda.timbri: 1 }
          effetti: { rep.gilda: 0.5, fazione.gilda: 1 }
      - testo: "Tenerlo per te"
        descrizione: "Una cosa che sai soltanto tu vale di più finché resta tua."
        esito:
          titolo: Il gradino
          testo: |
            Saluti Varn con un cenno e resti seduto finché non è entrato. Il
            cassetto di Elleri te lo tieni, come si tiene una moneta cucita
            nella fodera. Prima di alzarti ti scrivi la data dietro uno dei
            cartellini di Ambrin, con la grafia più piccola che hai, e lo
            infili nella suola dello stivale.
          imposta: { gilda.timbri: 2 }
          effetti: { informazioni.segreto: 1, fazione.gilda: 1 }
      - testo: "Andare a dirlo direttamente al Sovrintendente"
        descrizione: "Cordani è l'unico uomo pulito della Casa, dicono. Un socio nuovo che sale al terzo piano senza invito, però, fa parlare."
        prova: { attributo: sociale, abilita: [galateo, persuasione], difficolta: Media }
        successo:
          titolo: Le mani ferme
          testo: |
            Sali al terzo piano e chiedi del Sovrintendente al valletto, che
            ti guarda come un levriero guarderebbe un gatto. Cordani ti
            riceve in piedi accanto alla finestra e ti ascolta con le mani
            ferme sul davanzale. «Grazie» dice alla fine. «Varn lo saprà da
            me. Non parlarne con nessun altro.» Uscendo ti accorgi che non
            ti ha chiesto come lo sai.
          imposta: { gilda.timbri: 1 }
          effetti: { rep.gilda: 0.5, fazione.gilda: 1 }
        fallimento:
          titolo: Il valletto
          testo: |
            Il valletto del terzo piano ti ascolta, ti dice che il
            Sovrintendente è occupato e ti fa sedere su una panca per
            un'ora. Poi ti dice che è uscito. Scendendo incroci Elleri sulle
            scale, che ti saluta per nome e ti chiede se il terzo piano ti è
            piaciuto. Varn, nel pomeriggio, ti ascolta in silenzio e scrive
            tutto sull'aria.
          imposta: { gilda.timbri: 1 }
          effetti: { sospetto: 1, fazione.gilda: 1 }
