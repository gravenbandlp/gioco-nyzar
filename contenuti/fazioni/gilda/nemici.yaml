# I nemici e gli scontri della quest della Gilda dei Mercanti (fazione.gilda). Tarati su quelli della stessa fase:
# i Lunghi e la scorta di Morlacchi come le guardie dei Malgrani e gli scagnozzi degli Scuri (pelle.yaml), i gabbiani
# come le bestie della Foresta, Ugo Bracco come Mauro Scrocco e Balthog (boss del passo 14).
# Gli scontri usano anche nemici che esistono già: borseggiatore (citta-bassa.yaml), predone e drone-cieco
# (superficie/area.yaml), cinghiale-mutato e verme-carogna (foresta.yaml), maedric-holl e balestriere-della-gilda
# (registro-tribu.yaml), scagnozzo-degli-scuri (pelle.yaml), gladiatore (arena.yaml).
nemici:
  - id: gilda-lungo-dei-sottoponti
    immagine: ambientazione/ponte-dei-morti
    nome: Lungo dei sottoponti
    descrizione: "Un uomo alto e magro della banda che sta sotto i ponti da sempre, con un coltello ricurvo da cordaio. Combatte appeso, e se le cose vanno male si lascia scivolare lungo una fune."
    attacco: 3
    difesa: 3
    difesaMentale: 2
    pf: 8
    danno: 2
    riduzione: 2
    iniziativa: 3
    puoFuggire: true

  - id: gilda-scorta-di-morlacchi
    immagine: icone/hooded-figure
    nome: Uomo della scorta di Morlacchi
    descrizione: "Un mercenario dei magazzini di scarico, con il giaco di cuoio sotto il mantello della Gilda e una lama corta pagata bene. Conta i colpi come conta le casse."
    attacco: 3
    difesa: 3
    difesaMentale: 2
    pf: 10
    danno: 3
    riduzione: 2
    iniziativa: 2

  - id: gilda-capo-della-scorta
    immagine: icone/hooded-figure
    nome: Il capo della scorta
    descrizione: "Il caposquadra dei magazzini di Morlacchi, con i guanti da carico e una mazza ferrata. Ha l'ordine di tornare con un documento, e non vuole tornare senza."
    attacco: 4
    difesa: 3
    difesaMentale: 3
    pf: 10
    danno: 2
    riduzione: 3
    iniziativa: 2

  - id: gilda-gabbiani-di-cresta-grigia
    immagine: icone/seagull
    nome: Gabbiani di cresta grigia
    descrizione: "Uno stormo che nidifica sulle travi bruciate dei piloni. Difendono i nidi tutti insieme a colpi di becco, e se ne vanno quando ne cade uno."
    attacco: 3
    difesa: 4
    difesaMentale: 1
    pf: 9
    danno: 1
    iniziativa: 4
    tratti: [animale]
    puoFuggire: true

  - id: gilda-chiattaiolo
    immagine: icone/pulley-hook
    nome: Chiattaiolo di Bracco
    descrizione: "Un uomo delle chiatte grandi, con le braccia gonfie a forza di argani e un gancio da carico in mano. Lavora per Ugo Bracco perché Bracco paga il giovedì."
    attacco: 3
    difesa: 2
    difesaMentale: 2
    pf: 6
    danno: 2
    iniziativa: 2
    puoFuggire: true

  - id: gilda-ugo-bracco
    immagine: icone/pulley-hook
    nome: Ugo Bracco
    descrizione: "Il padrone delle chiatte grandi, largo come una porta, con il segaccio da funi alla cintura e una sbarra d'argano in mano. Sulle assi si muove meglio di quanto dica la sua mole."
    attacco: 5
    difesa: 3
    difesaMentale: 3
    pf: 19
    danno: 3
    riduzione: 1
    iniziativa: 2

scontri:
  - { id: gilda-ragazzi-della-corda, nome: "I ragazzi della corda", nemici: [borseggiatore, borseggiatore], feriteSconfitta: 2, rinforzo: { pf: 2, danno: 1, riduzione: 2 } }
  - { id: gilda-i-mugnai-senza-mulino, nome: "I mugnai senza mulino", nemici: [predone, predone], feriteSconfitta: 2, rinforzo: { pf: 2, danno: 1, riduzione: 2 } }
  - { id: gilda-il-cinghiale-nel-grano, nome: "Il cinghiale nel grano", nemici: [cinghiale-mutato], feriteSconfitta: 3, rinforzo: { pf: 2, danno: 2, riduzione: 3 } }
  - { id: gilda-le-bestie-sul-grano, nome: "Le bestie sul grano nero", nemici: [cinghiale-mutato, verme-carogna, verme-carogna], feriteSconfitta: 3, rinforzo: { pf: 6, danno: 1, riduzione: 3 } }
  - { id: gilda-i-lunghi, nome: "I Lunghi", nemici: [gilda-lungo-dei-sottoponti, gilda-lungo-dei-sottoponti], feriteSconfitta: 2 }
  - { id: gilda-l-esattore, nome: "L'esattore degli Scuri", nemici: [scagnozzo-degli-scuri, scagnozzo-degli-scuri], feriteSconfitta: 2, rinforzo: { danno: 1 } }
  - { id: gilda-il-balestriere-di-guardia, nome: "Il balestriere di guardia", nemici: [balestriere-della-gilda], feriteSconfitta: 2, rinforzo: { pf: 2, danno: 1, riduzione: 2 } }
  - { id: gilda-maedric-e-i-balestrieri, nome: "Maedric e i balestrieri", nemici: [maedric-holl, balestriere-della-gilda, balestriere-della-gilda], feriteSconfitta: 3, rinforzo: { danno: 2 } }
  - { id: gilda-la-casa-appesa, nome: "La casa appesa", nemici: [balestriere-della-gilda, balestriere-della-gilda, gilda-lungo-dei-sottoponti], feriteSconfitta: 3, rinforzo: { pf: 6, danno: 1, solo: [balestriere-della-gilda] } }
  - { id: gilda-la-scorta-di-tasha, nome: "La scorta di Tasha", nemici: [gladiatore, gladiatore], feriteSconfitta: 3 }
  - { id: gilda-lo-stormo, nome: "Lo stormo", nemici: [gilda-gabbiani-di-cresta-grigia, gilda-gabbiani-di-cresta-grigia], feriteSconfitta: 2 }
  - { id: gilda-il-guardiano-dormiente, nome: "Il guardiano dormiente", nemici: [drone-cieco, drone-cieco], feriteSconfitta: 2, rinforzo: { danno: 2 } }
  - { id: gilda-la-scorta-di-morlacchi, nome: "La scorta di Morlacchi", nemici: [gilda-capo-della-scorta, gilda-scorta-di-morlacchi, gilda-scorta-di-morlacchi], feriteSconfitta: 3 }
  - { id: gilda-un-uomo-della-scorta, nome: "Un uomo della scorta", nemici: [gilda-scorta-di-morlacchi], feriteSconfitta: 2 }
  - { id: gilda-la-notte-prima-del-voto, nome: "Ugo Bracco sulla campata", nemici: [gilda-ugo-bracco, gilda-chiattaiolo, gilda-chiattaiolo], feriteSconfitta: 4 }
