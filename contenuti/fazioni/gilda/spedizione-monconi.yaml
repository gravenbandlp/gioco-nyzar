# I monconi del Ventisette, spedizione del passo 11 della quest della Gilda (fazione.gilda == 10).
# I piloni dei due ponti bruciati nel 127, sopra la Cicatrice. Ci si entra da `gilda-le-tre-versioni` (passi-3.yaml),
# con Ormun Pell o, con chiatta.posto, sulla Mula di Ilde (si salta la prima fascia). Ritorno ai Ponti, soglia 5.
# Le stanze vanno in fasce di profondità, e una stanza superata non ricompare nella stessa visita:
#   0 il pilone di ponente (la base; la scala di ferro, che vale anche a 1);
#   1 le corde vecchie (le corde del 127; il ponte di funi, che vale anche a 2);
#   2 la loggia delle tiracorde (la parete dei nodi; i segni delle famiglie);
#   3 le travi bruciate (le travi; i gabbiani di cresta grigia e l'uomo della scorta, che valgono anche a 4);
#   4 il cuore di metallo del pilone.
# Ogni stanza ha una via lunga che costa due rintocchi e fa avanzare comunque.
# Il cuore a 5 è la camera del pilone, con il vano dei Precursori: si apre con Tecnologia (Difficile), con l'incantesimo
# Sigillo o svegliando il guardiano (droni ciechi). Aperto il vano (gilda.vano 1), il seguito `gilda-monconi-la-scorta`
# mostra il documento firmato del 127 e porta la scorta di Morlacchi: combattimento, Persuasione o la discesa per le corde
# vecchie, tutte Difficili. Chi perde torna ai Ponti, e al ritorno il vano è già aperto.
# Il documento (canone proposto e approvato): i sigilli delle tre famiglie del Patto, quello di Hakkos Cordani per primo.
aree:
  - id: gilda-monconi-del-ventisette
    immagine: ambientazione/cicatrice-del-mondo
    nome: I monconi del Ventisette
    sommario: "Nella loggia del pilone di ponente un tiracorde nascose la verità sull'incendio."
    spedizione: { ritorno: ponti-sospesi, soglia: 5, stanze: 3 }
    testo: |
      Dove la Cicatrice si allarga a valle delle Mille Corde, due piloni di ferro nero escono dalla parete
      come denti rotti. Sono quello che resta dei due ponti che presero fuoco nella notte del 127. La ruggine
      li copre dalla base alla cima, e dove il vento l'ha staccata a scaglie sotto si vede un metallo scuro e
      liscio che il fuoco non ha segnato.

      Dalle cime pendono ancora le corde vecchie annerite dal catrame e dal fuoco, che oscillano nel vento. A
      metà del pilone di ponente c'è una loggia di pietra dove le tiracorde del Patto si riparavano dal vento.
      Le sue pietre sono spaccate dal calore e tenute insieme da grappe di ferro, e il metallo a cui la loggia
      si appoggia non ha una crepa.

# La musica della spedizione (come le altre aree in contenuti/audio.yaml).
colonna:
  - { contesto: area, id: gilda-monconi-del-ventisette, musica: the-light-that-failed, ambiente: forest-night }

storylet:
  # ------------------------------------------------------------ 0 · il pilone di ponente
  - id: gilda-monconi-il-pilone-di-ponente
    immagine: ambientazione/cicatrice-del-mondo
    titolo: La base del pilone
    sommario: "Per salire ci sono soltanto i pioli di ferro dei tiracorde, arrugginiti da cento anni."
    luogo: I monconi del Ventisette, la base del pilone di ponente
    area: gilda-monconi-del-ventisette
    ripetibile: true
    requisiti: [fazione.gilda == 10, profondita.gilda-monconi-del-ventisette == 0]
    testo: |
      La base del pilone di ponente è un blocco di ferro nero piantato nella roccia. Dove il ferro entra nella
      pietra non c'è una colata di piombo né una zeppa, e la roccia lo stringe senza una fessura. Lungo il
      fianco i tiracorde piantarono pioli di ferro per salire a lavorare, e oggi metà sono arrugginiti e
      qualcuno manca. La ruggine dei pioli è colata giù in strisce rosse lungo il nero del fianco.

      {tecnologia Media} Il pilone non è ferro di Qir-Azel, e sotto la ruggine c'è un metallo liscio e scuro
      che i tiracorde non sapevano fare.

      Ormun Pell si sputa nelle mani e guarda in su con la pipa spenta fra i denti. «Mio padre ci saliva e
      diceva che il pilone regge perché non è nostro» dice.
    opzioni:
      - testo: "Salire per i pioli"
        descrizione: "Uno alla volta, saggiando ogni piolo prima di metterci il peso."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Media }
        successo:
          titolo: I pioli
          testo: |
            Sali piolo dopo piolo, saggiando ognuno con la mano prima di metterci il peso. Fra un piolo e
            l'altro le dita trovano il metallo del pilone, liscio sotto la ruggine colata e senza un appiglio.
            Al trentesimo il vento della Cicatrice ti prende di fianco, e tu resti incollat{o|a} al ferro
            finché passa. Al sessantesimo arrivi a una porticina aperta nel fianco del pilone, e ti ci infili
            dentro con le mani che tremano.
          pe: { atletica: 3 }
          effetti: { profondita.gilda-monconi-del-ventisette: 1 }
        fallimento:
          titolo: Il piolo che si stacca
          testo: |
            Al ventesimo piolo il ferro si stacca sotto il tuo piede, e resti appes{o|a} con le mani mentre il
            piolo cade nella Cicatrice senza un suono. Aspetti di sentirlo battere sulla roccia di sotto, e il
            colpo non arriva. Ormun ti afferra la caviglia da sotto e ti rimette su un piolo buono. Poi
            scendete insieme e vi sedete alla base, sulle ginocchia che tremano.
          effetti: { ferite: 0.5 }
      - testo: "Cercare la via dei tiracorde"
        descrizione: "I tiracorde non salivano a caso. Da qualche parte c'è la via buona, segnata come la segnavano loro."
        prova: { attributo: mentale, abilita: [percezione, accademiche], difficolta: Media }
        successo:
          titolo: Le tacche
          testo: |
            Giri intorno alla base e trovi le tacche incise nel ferro accanto ai pioli buoni, tre righe corte
            che i tiracorde facevano con lo scalpello. Hanno i bordi mangiati dalla ruggine e sotto il dito si
            sentono appena. Le segui, e la via buona sale a zig zag ed è più lunga della diretta, ma ti porta
            san{o|a} fino a una porticina nel fianco del pilone.
          pe: { percezione: 3 }
          effetti: { profondita.gilda-monconi-del-ventisette: 1 }
        fallimento:
          titolo: Ruggine
          testo: |
            Cerchi segni sul ferro, e trovi soltanto ruggine e cacca di gabbiano. Sui pioli più alti la cacca
            ha fatto croste bianche spesse un dito. Ormun ti guarda cercare per un'ora, poi si stringe nelle
            spalle e ti dice che domani ci riprovate.
          effetti: { tormento: 1 }
      - testo: "Salire legati a Ormun, piano"
        descrizione: "Una corda fra te e lui. Lui sale per primo e ti aspetta a ogni sosta."
        costo: 2
        esito:
          titolo: In cordata
          testo: |
            Ormun ti lega a sé con una corda di canapa e sale per primo, piano, fermandosi a ogni sosta ad
            aspettarti e a fumare la pipa spenta. Fra una sosta e l'altra la corda fra voi pende in un arco
            che il vento fa ondeggiare. Ci mettete mezza giornata. Quando arrivate alla porticina nel fianco
            del pilone il sole è già basso sulla Cicatrice.
          effetti: { profondita.gilda-monconi-del-ventisette: 1 }

  # ------------------------------------------------------------ 0–1 · la scala di ferro
  - id: gilda-monconi-la-scala-di-ferro
    immagine: icone/ladder
    titolo: La scala di ferro
    sommario: "Dentro il pilone sale una scala di ferro a chiocciola, buia, con i gradini mangiati dalla ruggine."
    luogo: I monconi del Ventisette, dentro il pilone
    area: gilda-monconi-del-ventisette
    ripetibile: true
    requisiti: [fazione.gilda == 10, profondita.gilda-monconi-del-ventisette <= 1]
    testo: |
      Dentro il pilone il buio sa di ruggine bagnata. Una scala di ferro a chiocciola sale lungo la parete
      interna, fissata al metallo liscio con staffe che non ha fatto mano umana. Le staffe escono dalla parete
      senza un bullone e senza una saldatura, e sono più distanti fra loro di quanto servirebbe a una scala. I
      gradini invece li hanno messi i tiracorde, e uno su quattro è marcio di ruggine. Le gocce che cadono
      dall'alto battono sui gradini buoni con un suono chiaro, e su quelli marci non fanno rumore.

      {acrobazia Media fallita} Il primo gradino che provi si piega sotto il piede come carta bagnata.

      Molto in alto un filo di luce entra da una feritoia.
    opzioni:
      - testo: "Salire saltando i gradini marci"
        descrizione: "Uno su quattro cede. Bisogna capire quale prima di metterci il piede."
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Media }
        successo:
          titolo: Uno su quattro
          testo: |
            Sali tenendoti alla parete, e ogni quarto gradino lo salti. La chiocciola gira e gira, e a metà
            salita la parete sotto la tua mano smette di essere fredda e diventa tiepida, e resta così fino in
            cima. Dopo un tempo lungo arrivi alla feritoia, dove una passerella esce dal pilone verso le corde
            vecchie.
          pe: { acrobazia: 3 }
          effetti: { profondita.gilda-monconi-del-ventisette: 1 }
        fallimento:
          titolo: Il gradino
          testo: |
            Un gradino cede, e scivoli giù per la chiocciola per un giro intero, sbattendo le ginocchia sul
            ferro, prima di fermarti contro una staffa. Il gradino rotto continua a cadere nel buio sotto di
            te, e lo senti rimbalzare per molti giri. Poi ricominci da capo, e il ginocchio ti fa zoppicare a
            ogni gradino.
          effetti: { ferite: 1 }
      - testo: "Provare i gradini con il coltello"
        descrizione: "La lama entra nel ferro marcio e rimbalza su quello buono. È lento, ma è sicuro."
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Media }
        successo:
          titolo: La lama
          testo: |
            Batti la lama su ogni gradino prima di salirci. Il ferro buono suona, quello marcio tace. Una
            volta la lama tocca per sbaglio la parete, e il metallo del pilone rende una nota lunga che sale
            per tutta la torre. Arrivi alla feritoia con la lama spuntata e le gambe intere, e oltre la
            feritoia c'è una passerella verso le corde vecchie.
          pe: { tecnologia: 3 }
          effetti: { profondita.gilda-monconi-del-ventisette: 1 }
        fallimento:
          titolo: Il suono uguale
          testo: |
            Batti la lama sui gradini, e a un certo punto ti sembrano suonare tutti allo stesso modo. L'ultimo
            colpo continua a girare dentro il pilone molto dopo che hai fermato la mano. Ti fermi a metà scala
            al buio, aspetti che il cuore rallenti e poi scendi.
          effetti: { tormento: 1 }
      - testo: "Salire sulla parete, lungo le staffe"
        descrizione: "Le staffe dei Precursori non arrugginiscono. Sono scomode e distanti, ma reggono."
        costo: 2
        esito:
          titolo: Le staffe
          testo: |
            Lasci la scala e sali da una staffa all'altra, aggrappat{o|a} al metallo liscio che non
            arrugginisce. Le staffe sono troppo distanti per un corpo come il tuo, e a ogni presa devi
            allungarti finché la spalla tira. Ci metti il doppio del tempo, e le dita ti si coprono di
            vesciche. Alla feritoia ti siedi e ti guardi le mani a lungo.
          effetti: { profondita.gilda-monconi-del-ventisette: 1 }

  # ------------------------------------------------------------ 1 · le corde vecchie
  - id: gilda-monconi-le-corde-vecchie
    immagine: icone/rope-coil
    titolo: Le corde del 127
    sommario: "Dal moncone del ponte pendono le corde vecchie, bruciate a metà. Per arrivare alla loggia bisogna passarci sopra."
    luogo: I monconi del Ventisette, le corde vecchie
    area: gilda-monconi-del-ventisette
    ripetibile: true
    requisiti: [fazione.gilda == 10, profondita.gilda-monconi-del-ventisette == 1]
    testo: |
      Fuori dalla feritoia una passerella di ferro corre lungo il fianco del pilone e finisce nel vuoto.
      L'ultimo palmo di ferro è annerito e ha i bordi arricciati come carta bruciata. Da lì pendono una
      dozzina di corde del 127 annerite dal catrame e dal fuoco, alcune tese verso la loggia e altre libere
      sulla Cicatrice. Quelle libere oscillano nel vento, e quando due si toccano fanno un rumore sordo di
      legno.

      {tecnologia Media} Le corde bruciate sembrano intere e dentro sono cenere. Quelle buone hanno il catrame
      lucido, che sciogliendosi ha protetto la fibra.

      {origine apprendista-raschiatore} Le corde vecchie le leggi con le dita, come sulla piattaforma a fine
      turno. Ognuna ha la sua voce, e due di queste hanno la voce sbagliata.
    opzioni:
      - testo: "Scegliere la corda buona"
        descrizione: "Quella con il catrame lucido, che ha retto il fuoco. Bisogna trovarla prima di metterci il peso."
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Media }
        successo:
          titolo: Il catrame lucido
          testo: |
            Tocchi le corde una alla volta e scegli quella con il catrame più lucido, che sotto le dita è dura
            come legno. Ormun annuisce, e tu passi appes{o|a} a lei, mano dopo mano, fino alla loggia, mentre
            sotto di te la Cicatrice manda su il suo bagliore azzurro. A metà la corda si allunga di un palmo
            sotto il tuo peso, e poi tiene.
          pe: { tecnologia: 3 }
          effetti: { profondita.gilda-monconi-del-ventisette: 1 }
        fallimento:
          titolo: La cenere
          testo: |
            Scegli una corda che sembra buona, e appena ci metti il peso senti la fibra sbriciolarsi dentro,
            come pane secco. Ormun ti tira indietro per la giubba. La corda si spezza e cade nella Cicatrice
            in due pezzi, e dal punto della rottura esce uno sbuffo di cenere che il vento porta via.
          effetti: { tormento: 1 }
      - testo: "Lasciare che scelga Ormun"
        descrizione: "Suo padre ci saliva. Lui le corde le conosce meglio di te, e lo sa."
        prova: { attributo: sociale, abilita: [empatia, persuasione], difficolta: Media }
        successo:
          titolo: Il padre di Ormun
          testo: |
            Gli chiedi di suo padre, e Ormun ti racconta mentre tocca le corde. Suo padre era ponteggiatore,
            la notte del 127, e la mattina dopo è salito qui a tagliare le funi che bruciavano ancora. Sulle
            corde che Ormun tocca si vede ancora il taglio netto di una lama sotto la crosta nera. Poi sceglie
            una corda e ci passa per primo, e tu lo segui tenendo gli occhi sulle sue mani.
          pe: { empatia: 3 }
          effetti: { profondita.gilda-monconi-del-ventisette: 1 }
        fallimento:
          titolo: Il silenzio di Ormun
          testo: |
            Glielo chiedi, e Ormun ti guarda come se gli avessi chiesto di portarti in braccio. Poi scende
            dalla passerella e torna alla feritoia, e dai suoi passi sulla chiocciola capisci che salta ogni
            quarto gradino senza pensarci. Lo raggiungi giù e gli chiedi scusa, e lui ti dice che domani
            forse.
          effetti: { tormento: 1 }
      - testo: "Fare il giro per la passerella di sotto"
        descrizione: "Sotto la passerella grande ce n'è un'altra, di servizio, che gira intorno al pilone. È lunga, e manca di qualche asse."
        costo: 2
        esito:
          titolo: Il giro
          testo: |
            Scendi alla passerella di servizio e giri intorno al pilone tenendoti al ferro, saltando le assi
            che mancano. Dove manca un'asse sotto i tuoi piedi c'è soltanto il bagliore azzurro della
            Cicatrice. Ci metti il tempo di un pasto. Quando risali sei dall'altra parte, sotto la loggia.
          effetti: { profondita.gilda-monconi-del-ventisette: 1 }
      - testo: "Leggere le corde con le dita"
        descrizione: "Sulla piattaforma si fa a fine turno, una corda alla volta. Due di queste hanno la voce sbagliata."
        quando: [origine.apprendista-raschiatore >= 1]
        esito:
          titolo: La voce delle corde
          testo: |
            Passi le dita sulle corde una alla volta ascoltando la fibra, e scarti le due che suonano vuote.
            Sotto i polpastrelli le corde buone vibrano piano nel vento, e quelle due frusciano come sabbia in
            un sacco. Ormun ti guarda fare e alla fine si toglie la pipa di bocca. «Come mio padre» dice
            soltanto. Passi sulla corda buona fino alla loggia.
          pe: { tecnologia: 3 }
          effetti: { profondita.gilda-monconi-del-ventisette: 1 }

  # ------------------------------------------------------------ 1–2 · il ponte di funi
  - id: gilda-monconi-il-ponte-di-funi
    immagine: icone/rope-bridge
    titolo: Il ponte di funi
    sommario: "Fra il moncone e la loggia i tiracorde tesero un ponte di funi. Ne restano tre corde e qualche asse, e il vento della Cicatrice."
    luogo: I monconi del Ventisette, il ponte di funi
    area: gilda-monconi-del-ventisette
    ripetibile: true
    requisiti: [fazione.gilda == 10, profondita.gilda-monconi-del-ventisette >= 1, profondita.gilda-monconi-del-ventisette <= 2]
    testo: |
      Il ponte di funi dei tiracorde attraversa il vuoto fra il moncone e la loggia del pilone. Delle assi e
      dei corrimano restano tre corde, due per le mani e una per i piedi, e il vento della Cicatrice lo fa
      dondolare come un'altalena. Le corde entrano nel muro della loggia attraverso anelli di ferro, e lì la
      canapa è consumata fino a metà dello spessore.

      {atletica Media} Tre corde bastano se tieni il peso sulle mani e fai scivolare i piedi senza sollevarli.

      Sotto il ponte un gabbiano risale il vento senza battere le ali. Dall'altra parte la porta della loggia
      sbatte nel vento.
    opzioni:
      - testo: "Attraversare a mani strette"
        descrizione: "Il peso sulle mani, i piedi che scivolano. Senza guardare giù."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Media }
        successo:
          titolo: Dall'altra parte
          testo: |
            Attraversi con il peso sulle mani e i piedi che scivolano sulla corda di sotto, senza mai
            sollevarli. A metà il vento ti prende, e tu ti fermi e aspetti che passi. La canapa ti scorre
            sotto i palmi ruvida di catrame vecchio e li lascia neri. Dall'altra parte ti siedi sulla soglia
            della loggia con le mani che bruciano.
          pe: { atletica: 3 }
          effetti: { profondita.gilda-monconi-del-ventisette: 1 }
        fallimento:
          titolo: L'altalena
          testo: |
            A metà strada una raffica fa girare il ponte su se stesso, e ti ritrovi appes{o|a} a testa in giù
            con le gambe intrecciate alla corda. Al posto del cielo vedi il bagliore azzurro della Cicatrice
            che sale dal fondo. Torni indietro così, a forza di braccia, e sul moncone resti sdraiat{o|a} a
            lungo a guardare il cielo.
          effetti: { ferite: 0.5, tormento: 1 }
      - testo: "Legare una corda tua alle funi vecchie"
        descrizione: "Una corda di sicurezza fra la tua cintura e la fune di sopra. Se cadi, resti appes{o|a}."
        prova: { attributo: mentale, abilita: [tecnologia, natura], difficolta: Media }
        successo:
          titolo: La sicura
          testo: |
            Leghi una corda alla cintura e la fai scorrere sulla fune di sopra con un nodo che scivola
            soltanto in avanti. Attraversi piano, e a metà il vento ti sposta e la sicura ti tiene. Il nodo
            stride sulla fune vecchia e ne stacca scaglie di catrame che cadono girando nel vuoto. Arrivi alla
            loggia con la corda tesa e il cuore che rallenta.
          pe: { tecnologia: 3 }
          effetti: { profondita.gilda-monconi-del-ventisette: 1 }
        fallimento:
          titolo: Il nodo sbagliato
          testo: |
            Il nodo della sicura si stringe al primo strappo e ti blocca a metà ponte. Ci metti un'eternità a
            scioglierlo con le dita intirizzite, mentre il ponte dondola e la sicura ti strattona la cintura a
            ogni oscillazione. Alla fine torni indietro, a tentoni, verso il moncone.
          effetti: { tormento: 1 }
      - testo: "Aspettare che il vento cali"
        descrizione: "I tiracorde dicono che prima o poi cala, e non dicono quando."
        costo: 2
        esito:
          titolo: La calma
          testo: |
            Aspetti sedut{o|a} sul moncone con la schiena al ferro, e verso il tramonto il vento della
            Cicatrice si calma. Nella calma senti salire dal fondo della Cicatrice un fruscio lungo e
            regolare. Allora il ponte di funi si ferma come un'amaca vuota, e lo attraversi senza fretta.
          effetti: { profondita.gilda-monconi-del-ventisette: 1 }

  # ------------------------------------------------------------ 2 · la loggia delle tiracorde
  - id: gilda-monconi-la-loggia
    immagine: icone/knot
    titolo: La parete dei nodi
    sommario: "La loggia delle tiracorde è una stanza di pietra con una parete coperta di nodi. Ogni nodo è un nome, e i nomi raccontano qualcosa."
    luogo: I monconi del Ventisette, la loggia delle tiracorde
    area: gilda-monconi-del-ventisette
    ripetibile: true
    requisiti: [fazione.gilda == 10, profondita.gilda-monconi-del-ventisette == 2]
    testo: |
      La loggia è una stanza di pietra dalle finestre strette, con un focolare spento da cinquant'anni e una
      panca lunga. La cenere nel focolare si è indurita in una crosta grigia, e la panca è consumata al centro
      dove ci si sedeva. Lungo la parete di fondo pendono da chiodi di ferro centinaia di corde annodate, e
      ogni nodo è una firma come sulla fune dei soci alla Casa. Le corde più in alto sono scure e rigide, e a
      ogni fila verso il pavimento la canapa schiarisce.

      {accademiche Media} I tiracorde che non sapevano scrivere firmavano con un nodo. Questa parete è il
      registro più vecchio della città, e quasi nessuno sa più leggerlo.

      Ormun si toglie il cappello, e non gliel'avevi mai visto fare.
    opzioni:
      - testo: "Leggere i nodi"
        descrizione: "Due giri sono un nome, tre una famiglia, la volta è l'anno. Qualcosa del genere."
        prova: { attributo: mentale, abilita: accademiche, difficolta: Media }
        successo:
          titolo: Il registro dei nodi
          testo: |
            Leggi i nodi dall'alto verso il basso, come un libro. In cima ci sono le famiglie del Patto, con i
            nodi fitti uno accanto all'altro. Più in basso, dopo il 127, c'è un nodo solo, ripetuto ogni anno,
            sempre lo stesso, fino a quaranta anni fa. Le corde di quel nodo sono tutte della stessa canapa, e
            il nodo è stretto ogni volta allo stesso modo. Ormun ti dice a mezza voce che è il nodo dei
            Vennari. Qualcuno della famiglia di Clelia è tornato qui ogni anno a dire che era ancora vivo, e
            che sapeva.
          pe: { accademiche: 5 }
          effetti: { profondita.gilda-monconi-del-ventisette: 1 }
        fallimento:
          titolo: Nodi
          testo: |
            Guardi i nodi finché diventano soltanto nodi, corde annodate su una parete di pietra. Le corde si
            muovono appena tutte insieme nella corrente delle finestre, e i nodi ti si confondono davanti agli
            occhi. Ormun ti tocca il braccio e ti indica la porta in fondo alla loggia, verso le travi.
          effetti: { tormento: 1 }
      - testo: "Appendere un nodo tuo"
        descrizione: "Sulla fune dei soci ne hai già uno. Qui sarebbe un'altra cosa, e Ormun ti guarderebbe."
        prova: { attributo: fisico, abilita: [acrobazia, tecnologia], difficolta: Facile }
        successo:
          titolo: Il tuo nodo
          testo: |
            Prendi un pezzo di corda dalla panca e ci fai lo stesso nodo che hai fatto alla Casa. Lo appendi a
            un chiodo vuoto, sotto quelli dei Vennari. La tua corda è chiara e morbida in mezzo a quelle
            scure, e la corrente delle finestre la muove più delle altre. Ormun ti guarda e si rimette il
            cappello. Poi ti indica la porta in fondo alla loggia, verso le travi.
          effetti: { profondita.gilda-monconi-del-ventisette: 1, rep.ponti: 0.5 }
        fallimento:
          titolo: Il chiodo
          testo: |
            Il chiodo cede appena ci appendi il nodo, e quando lo raccogli vedi che la ruggine gli ha mangiato
            il gambo fino a uno spillo. Si è portato dietro tre corde vecchie, che si sbriciolano sul
            pavimento. Ormun raccoglie i pezzi uno per uno e li mette sulla panca, senza guardarti.
          effetti: { rep.ponti: -0.5 }
      - testo: "Passare oltre senza toccare niente"
        descrizione: "È un registro. I registri si rispettano anche quando non si sanno leggere."
        costo: 2
        esito:
          titolo: Il rispetto
          testo: |
            Passi davanti alla parete senza toccarla, piano, come si passa in una chiesa. Ormun ti segue con
            il cappello in mano. Nel silenzio della loggia il vento passa fra le finestre strette con un
            fischio basso. In fondo alla loggia una porta bassa dà sulle travi bruciate.
          effetti: { profondita.gilda-monconi-del-ventisette: 1 }

  - id: gilda-monconi-i-segni-delle-famiglie
    immagine: icone/wax-seal
    titolo: I segni delle famiglie
    sommario: "Sul pavimento della loggia sono incisi i segni delle famiglie dei tiracorde. Quelli dei Vennari e dei Lusardi sono i più consumati."
    luogo: I monconi del Ventisette, il pavimento della loggia
    area: gilda-monconi-del-ventisette
    ripetibile: true
    requisiti: [fazione.gilda == 10, profondita.gilda-monconi-del-ventisette == 2]
    testo: |
      Accanto al focolare sono incisi nel pavimento i segni delle famiglie che lavoravano sul pilone. Sono
      piccoli disegni come una spola o un ago da vela, con una tacca per ogni anno. Le tacche sono fatte con
      la punta di un coltello, e le più vecchie si leggono soltanto con le dita perché i piedi le hanno quasi
      spianate. I più consumati sono quelli dei Vennari e dei Lusardi, e su quello dei Vennari c'è un
      mozzicone di candela. Intorno al mozzicone la pietra è pulita, e il resto del pavimento ha un dito di
      polvere.

      {empatia Media} L'ha accesa qualcuno che pregava non molto tempo fa, perché la cera è ancora morbida
      sotto l'unghia.
    opzioni:
      - testo: "Ricopiare i segni"
        descrizione: "Basta un carboncino del focolare e la pazienza di ricopiarli tutti. Clelia vorrà vederli."
        prova: { attributo: mentale, abilita: [accademiche, percezione], difficolta: Media }
        successo:
          titolo: Il foglio dei segni
          testo: |
            Ricopi i segni uno per uno su un foglio, con un carboncino del focolare, e accanto scrivi i nomi
            che Ormun conosce. Ormun li dice piano, e per qualcuno ci pensa a lungo prima di scuotere la
            testa. Quando hai finito il foglio è nero di carbone e di storia. Lo pieghi nella giubba accanto
            al cuore e prendi la porta bassa verso le travi.
          pe: { accademiche: 3 }
          effetti: { profondita.gilda-monconi-del-ventisette: 1, informazioni.pettegolezzo: 1 }
        fallimento:
          titolo: Il carbone
          testo: |
            Il carboncino si sbriciola fra le dita, e il foglio diventa una macchia nera come le tue mani fino
            ai polsi. Ormun ride per la prima volta da quando siete saliti, e ti dice di lasciar perdere i
            segni e pensare alle travi.
          effetti: { profondita.gilda-monconi-del-ventisette: 1, tormento: 1 }
      - testo: "Accendere la candela dei Vennari"
        descrizione: "Qualcuno l'ha lasciata per un motivo. Accenderla è un gesto, e i gesti qui contano."
        prova: { attributo: sociale, abilita: [empatia, galateo], difficolta: Media }
        successo:
          titolo: La candela
          testo: |
            Accendi il mozzicone con l'acciarino, e la fiamma sta dritta anche con il vento che entra dalle
            finestre. Alla sua luce le tacche dei Vennari fanno ombra, e per la prima volta riesci a contarle
            tutte. Ormun si toglie di nuovo il cappello. Restate a guardarla finché si spegne da sola, poi
            prendete la porta bassa verso le travi.
          pe: { empatia: 3 }
          effetti: { profondita.gilda-monconi-del-ventisette: 1, tormento: -0.5 }
        fallimento:
          titolo: Lo stoppino
          testo: |
            Lo stoppino è troppo corto, e la fiamma ti brucia le dita prima di prendere. La candela si spegne
            in un filo di fumo che sa di sego vecchio. Ormun non dice niente, e prendete la porta bassa verso
            le travi in silenzio.
          effetti: { profondita.gilda-monconi-del-ventisette: 1, ferite: 0.5 }
      - testo: "Tirare dritto verso le travi"
        descrizione: "I segni restano qui. La scorta di Morlacchi, intanto, sale."
        costo: 2
        esito:
          titolo: Verso le travi
          testo: |
            Passi sopra i segni senza fermarti, attent{o|a} a non calpestarli, e prendi la porta bassa in
            fondo alla loggia. Ormun resta indietro un momento, chinato sul segno dei Lusardi, poi ti
            raggiunge. Ha la punta delle dita grigia di polvere e se la pulisce sui calzoni.
          effetti: { profondita.gilda-monconi-del-ventisette: 1 }

  # ------------------------------------------------------------ 3 · le travi bruciate
  - id: gilda-monconi-le-travi-bruciate
    immagine: ambientazione/cicatrice-del-mondo
    titolo: Le travi bruciate
    sommario: "Oltre la loggia le travi annerite del ponte bruciato sporgono sul vuoto. Il fuoco del 127 le ha piegate come candele."
    luogo: I monconi del Ventisette, le travi bruciate
    area: gilda-monconi-del-ventisette
    ripetibile: true
    requisiti: [fazione.gilda == 10, profondita.gilda-monconi-del-ventisette == 3]
    testo: |
      Oltre la porta bassa cominciano le travi del ponte bruciato, che sporgono sul vuoto storte come candele
      lasciate al sole. Dove si piegano il ferro ha fatto grinze fitte, e una crosta nera che si stacca a
      scaglie. Fra una trave e l'altra restano le staffe di ferro delle assi, e da sotto sale il bagliore
      azzurro della Cicatrice. Quando il vento soffia le travi vibrano tutte insieme, con una nota bassa che
      senti nei talloni.

      {accademiche Difficile} Il ferro si piega così soltanto con un fuoco molto più caldo di un incendio di
      legno. Nel 127 qualcuno aveva preparato bene le funi da far bruciare.

      In fondo alle travi una porta di metallo senza maniglia chiude il cuore del pilone.
    opzioni:
      - testo: "Camminare sulle travi"
        descrizione: "Sono larghe un piede, e storte. Bisogna tenere il peso basso e non pensarci."
        prova: { attributo: fisico, abilita: [acrobazia, resistenza], difficolta: Media }
        successo:
          titolo: Il peso basso
          testo: |
            Cammini sulle travi con il peso basso e le braccia larghe, da una staffa all'altra, mentre il
            vento ti tira la giubba. Sotto le suole la crosta nera scricchiola e si stacca, e le scaglie
            scendono girando verso il bagliore. In fondo arrivi al metallo liscio del cuore del pilone, e ci
            appoggi la mano. È tiepido, anche se qui il sole non arriva.
          pe: { acrobazia: 3 }
          effetti: { profondita.gilda-monconi-del-ventisette: 1 }
        fallimento:
          titolo: La trave storta
          testo: |
            Una trave si inclina sotto il tuo peso più di quanto pensavi, e ti ritrovi a cavalcioni del ferro,
            abbracciat{o|a} a lui, con le gambe nel vuoto. Il ferro geme piano sotto di te e poi si ferma.
            Ormun ti tira indietro con una corda, e tornate alla loggia a scaldarvi le mani.
          effetti: { ferite: 0.5, tormento: 1 }
      - testo: "Studiare il ferro piegato"
        descrizione: "Il fuoco del 127 ha lasciato il segno sul ferro. Un segno si legge, se si sa come."
        prova: { attributo: mentale, abilita: [accademiche, tecnologia], difficolta: Media }
        successo:
          titolo: L'olio
          testo: |
            Gratti la crosta nera di una trave con la lama. Sotto c'è una macchia lucida che sa ancora d'olio,
            dopo cinquant'anni. L'olio è denso e giallo, e resta attaccato alla lama come miele. Le funi del
            ponte erano state bagnate d'olio prima del fuoco. Te lo segni sul polsino e passi oltre lungo la
            trave più dritta.
          pe: { accademiche: 3 }
          effetti: { profondita.gilda-monconi-del-ventisette: 1, informazioni.pettegolezzo: 1 }
        fallimento:
          titolo: La crosta
          testo: |
            Gratti la crosta, ma sotto c'è soltanto altra crosta, e la lama ti scivola sul ferro tagliandoti
            il dorso della mano. Le gocce di sangue cadono sulla trave, e sulla crosta nera non si vedono più.
            Ti fasci con il fazzoletto e torni alla loggia.
          effetti: { ferite: 0.5 }
      - testo: "Passare per le staffe, sotto le travi"
        descrizione: "Sotto le travi le staffe sono vicine e solide. Ci si passa appesi, a forza di braccia."
        costo: 2
        esito:
          titolo: Appesi
          testo: |
            Passi sotto le travi appes{o|a} alle staffe, una dopo l'altra, con la Cicatrice che ti illumina le
            suole. A metà guardi giù, e nel bagliore azzurro lo sguardo non trova un fondo dove fermarsi. Ci
            metti molto, e le braccia alla fine non le senti più. Ma arrivi in fondo, accanto alla porta di
            metallo.
          effetti: { profondita.gilda-monconi-del-ventisette: 1 }

  # ------------------------------------------------------------ 3–4 · i gabbiani di cresta grigia
  - id: gilda-monconi-i-gabbiani
    immagine: icone/seagull
    titolo: I gabbiani di cresta grigia
    sommario: "Sulle travi nidificano i gabbiani di cresta grigia. Hanno le uova, e non vogliono visite."
    luogo: I monconi del Ventisette, i nidi sulle travi
    area: gilda-monconi-del-ventisette
    ripetibile: true
    requisiti: [fazione.gilda == 10, profondita.gilda-monconi-del-ventisette >= 3, profondita.gilda-monconi-del-ventisette <= 4]
    testo: |
      Sulle travi più alte, al riparo dal vento, i gabbiani di cresta grigia hanno fatto i nidi con le fibre
      delle corde bruciate. I nidi sono neri e lucidi di catrame, e dentro ci sono uova chiazzate di grigio.
      Quando ti vedono se ne alzano una trentina e ti girano intorno gridando. Nessuno si posa sul metallo
      scuro del pilone, che pure è il riparo migliore dal vento.

      {rissa Facile} I gabbiani attaccano agli occhi, e un braccio alzato davanti alla faccia vale più di
      un'arma.

      La strada per la porta di metallo passa proprio sotto i nidi.
    opzioni:
      - testo: "Passare sotto i nidi con il braccio alzato"
        descrizione: "Lo stormo attaccherà. Bisogna tenere la faccia coperta e non fermarsi."
        combattimento: gilda-lo-stormo
        vittoria:
          titolo: Lo stormo
          testo: |
            I gabbiani ti si buttano addosso a ondate, e tu passi sotto i nidi con il braccio alzato e la lama
            nell'altra mano. Quando ne cadono due, gli altri si alzano e se ne vanno sopra la Cicatrice,
            gridando. I due caduti scivolano giù dalle travi e spariscono nel bagliore azzurro senza che tu
            senta il colpo. Hai il braccio pieno di beccate e la giubba sporca.
          effetti: { profondita.gilda-monconi-del-ventisette: 1 }
        sconfitta:
          titolo: Le beccate
          testo: |
            I gabbiani ti si buttano addosso tutti insieme, e tu indietreggi fino alla loggia con le braccia
            sopra la testa e le mani piene di sangue. I becchi ti hanno aperto la pelle delle nocche in tagli
            piccoli e fitti. Ormun ti fascia le dita bestemmiando contro tutti gli uccelli del mondo.
          effetti: { tormento: 1 }
      - testo: "Girare lontano dai nidi"
        descrizione: "I gabbiani attaccano soltanto chi si avvicina alle uova. Bisogna sapere dove sono."
        prova: { attributo: mentale, abilita: natura, difficolta: Media }
        successo:
          titolo: Lontano dalle uova
          testo: |
            Guardi dove si posano i gabbiani e capisci dove sono i nidi. Giri intorno, lungo il bordo esterno
            delle travi, con lo stormo che ti grida sopra la testa senza toccarti. Il bordo è largo quanto il
            tuo piede, e a ogni raffica il vento della Cicatrice ti spinge verso il vuoto. In fondo arrivi
            alla porta di metallo, con le orecchie che fischiano.
          pe: { natura: 3 }
          effetti: { profondita.gilda-monconi-del-ventisette: 1 }
        fallimento:
          titolo: Il nido nascosto
          testo: |
            Giri lontano dai nidi che vedi, e metti il piede in uno che non vedevi. Le uova si rompono, e lo
            stormo ti piomba addosso. Scappi fino alla loggia con il braccio sopra la testa e una poltiglia di
            guscio e catrame sotto la suola.
          effetti: { ferite: 0.5, tormento: 1 }
      - testo: "Aspettare che lo stormo vada a pescare"
        descrizione: "Al tramonto i gabbiani scendono nella Cicatrice. Lasciano i nidi per poco."
        costo: 2
        esito:
          titolo: Il tramonto
          testo: |
            Aspetti nella loggia fino al tramonto, quando lo stormo si butta giù nella Cicatrice a caccia di
            qualcosa. Li guardi scendere nel bagliore azzurro finché non li distingui più. Passi sotto i nidi
            in fretta, mentre restano soltanto le uova e qualche piuma grigia.
          effetti: { profondita.gilda-monconi-del-ventisette: 1 }

  # ------------------------------------------------------------ 3–4 · l'uomo della scorta
  - id: gilda-monconi-l-uomo-della-scorta
    immagine: icone/hooded-figure
    titolo: L'uomo della scorta
    sommario: "Sulle travi c'è un uomo con la livrea dei magazzini di scarico, che guarda giù verso la base del pilone."
    luogo: I monconi del Ventisette, le travi alte
    area: gilda-monconi-del-ventisette
    ripetibile: true
    requisiti: [fazione.gilda == 10, profondita.gilda-monconi-del-ventisette >= 3, profondita.gilda-monconi-del-ventisette <= 4]
    testo: |
      Su una trave alta, accucciato contro il pilone, c'è un uomo con il mantello della Gilda sopra un giaco
      di cuoio. Il giaco ha le cuciture nuove e il cuoio non ha ancora preso la forma delle spalle. Sulla
      manica ha la livrea dei magazzini di scarico, e guarda giù, verso la base del pilone, con una mano sopra
      gli occhi. È uno della scorta di Morlacchi, mandato avanti a vedere la strada, e gli altri non sono
      lontani.

      {furtivita Media} Guarda giù, non di lato. Il vento copre i passi, se li fai quando soffia.
    opzioni:
      - testo: "Arrivargli addosso prima che si giri"
        descrizione: "Una trave stretta, un uomo solo. Bisogna arrivare prima che chiami gli altri."
        combattimento: gilda-un-uomo-della-scorta
        vittoria:
          titolo: La livrea
          testo: |
            Gli arrivi addosso mentre si gira, e la lama gli scappa di mano e cade nella Cicatrice. Lui si
            arrende con la schiena al pilone. Lo leghi alla trave con la sua stessa cintura e prosegui verso
            la porta di metallo, mentre lui ti promette che Morlacchi lo saprà. Lo dice a voce bassa, e tiene
            la schiena staccata dal metallo quanto glielo permette la cintura.
          effetti: { profondita.gilda-monconi-del-ventisette: 1 }
        sconfitta:
          titolo: Il fischio
          testo: |
            Lui ti vede arrivare e ti colpisce di piatto, e poi fischia forte verso il basso. Da sotto
            risponde un altro fischio, e poi un terzo più vicino. Torni indietro fino alla loggia prima che
            arrivino gli altri, con il fischio che ti rimbomba nelle orecchie.
          effetti: { sospetto: 1 }
      - testo: "Passargli alle spalle con il vento"
        descrizione: "Un passo per ogni raffica, e la schiena contro il pilone."
        prova: { attributo: fisico, abilita: furtivita, difficolta: Media }
        successo:
          titolo: Con il vento
          testo: |
            Ti muovi soltanto quando soffia il vento, un passo per raffica, e gli passi alle spalle mentre lui
            guarda giù. Gli passi così vicin{o|a} che senti l'odore di grasso del suo giaco nuovo. Arrivi alla
            porta di metallo senza che si sia voltato una volta.
          pe: { furtivita: 3 }
          effetti: { profondita.gilda-monconi-del-ventisette: 1 }
        fallimento:
          titolo: La raffica che cala
          testo: |
            Il vento cala proprio mentre fai il passo, e nella calma la suola che gratta sul ferro si sente
            fino a lui. Lui si volta e ti vede, poi fischia verso il basso, e tu torni indietro fino alla
            loggia.
          effetti: { sospetto: 1 }
      - testo: "Fargli contare i soldi altrove"
        descrizione: "Un uomo della scorta è pagato per salire. Nessuno lo paga per cadere."
        prova: { attributo: sociale, abilita: [persuasione, intimidire], difficolta: Media }
        successo:
          titolo: Il conto
          testo: |
            Gli parli con calma dalla trave accanto, e gli fai notare quanto è alta la Cicatrice e quanto è
            bassa la sua paga. Lui ci pensa, e intanto guarda giù nel bagliore azzurro più a lungo di quanto
            vorrebbe. Poi scende per la via da cui è salito, e ti dice che agli altri dirà che la loggia era
            vuota.
          pe: { persuasione: 3 }
          effetti: { profondita.gilda-monconi-del-ventisette: 1 }
        fallimento:
          titolo: La paga
          testo: |
            Gli parli della paga, e lui ride. Dice che Morlacchi paga bene anche chi cade, e intanto si è già
            portato due dita alla bocca. Il fischio scende lungo il pilone verso il basso, e tu torni indietro
            fino alla loggia.
          effetti: { sospetto: 1 }

  # ------------------------------------------------------------ 4 · il cuore di metallo del pilone
  - id: gilda-monconi-il-metallo-del-pilone
    immagine: ambientazione/rovine-dei-precursori
    titolo: Il metallo del pilone
    sommario: "In cima alle travi il ferro dei tiracorde finisce, e comincia il metallo liscio dei Precursori. Dentro il pilone qualcosa ronza."
    luogo: I monconi del Ventisette, il cuore del pilone
    area: gilda-monconi-del-ventisette
    ripetibile: true
    requisiti: [fazione.gilda == 10, profondita.gilda-monconi-del-ventisette == 4]
    testo: |
      Dove finiscono le travi comincia il metallo scuro del pilone vero, senza una giuntura. Il fuoco del 127
      ha annerito le travi fino all'ultimo palmo, e sul metallo del pilone non ha lasciato nemmeno un alone di
      fumo. Molto in fondo qualcosa ronza come un alveare chiuso in una cassa. Il ronzio resta uguale quando
      il vento soffia e quando cala, e ti arriva dai piedi più che dalle orecchie.

      {magia Media} Il Mana qui dentro gira lento in cerchio, come intorno ai reperti chiusi.

      {tecnologia Media} Sul metallo linee sottili girano intorno al pilone e scendono verso una porta, le
      stesse dei gusci sigillati della Superficie. Sono incise così fini che l'unghia non ci entra, e nessuna
      ha un punto dove l'incisore ha ripreso il lavoro.

      Ormun tiene la mano lontana dal metallo e guarda la porta, che non ha maniglia né serratura come nel
      disegno del nonno di Clelia.
    opzioni:
      - testo: "Seguire le linee incise"
        descrizione: "Girano intorno al pilone e scendono. Dove scendono, c'è la porta."
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Media }
        successo:
          titolo: Le linee
          testo: |
            Segui le linee con la punta del dito senza toccarle, girando intorno al pilone fino a un incavo
            accanto alla porta, grande come una mano aperta. Le linee finiscono tutte lì, e il bordo
            dell'incavo è più liscio del resto, dove una mano ci si è appoggiata molte volte. Ormun ti guarda
            annuendo con la pipa fra i denti.
          pe: { tecnologia: 3 }
          effetti: { profondita.gilda-monconi-del-ventisette: 1 }
        fallimento:
          titolo: Il giro
          testo: |
            Segui le linee intorno al pilone e ti accorgi tardi che hai fatto tre giri, e che le linee girano
            all'infinito. La testa ti gira con loro. Ti siedi su una trave finché il mondo non si ferma. Nella
            polvere intorno al pilone le tue impronte fanno tre cerchi, uno dentro l'altro.
          effetti: { tormento: 1 }
      - testo: "Ascoltare il ronzio"
        descrizione: "Il Mana gira in cerchio. Chi sa ascoltarlo sente dove si ferma."
        prova: { attributo: mentale, abilita: [magia, resilienza], difficolta: Media }
        successo:
          titolo: Dove si ferma
          testo: |
            Appoggi l'orecchio al metallo tiepido, e il ronzio ti entra nei denti. Gira e gira, e in un punto
            solo si ferma per un battito, come una pausa fra due parole. Lo ascolti girare tre volte, e la
            pausa cade sempre nello stesso punto. È accanto alla porta, dove c'è un incavo grande come una
            mano.
          pe: { magia: 3 }
          effetti: { profondita.gilda-monconi-del-ventisette: 1, tormento: 1 }
        fallimento:
          titolo: Nei denti
          testo: |
            Il ronzio ti entra nei denti e non se ne va più. Ti stacchi dal metallo con la mascella che vibra
            e le orecchie che fischiano, e ti ci vuole un'ora per smettere di sentirlo. Anche dopo, quando ci
            passi sopra la lingua, i denti sono tiepidi.
          effetti: { tormento: 1.5 }
      - testo: "Aspettare che Ormun trovi la porta"
        descrizione: "Suo padre è salito fin qui, la mattina dopo il fuoco. Forse ha raccontato qualcosa."
        costo: 2
        esito:
          titolo: Il racconto di Ormun
          testo: |
            Ormun si siede su una trave e si accende finalmente la pipa. Ti racconta che suo padre, la mattina
            dopo il fuoco, vide un tiracorde vecchio uscire dal pilone con le mani vuote, e richiudere la
            porta appoggiandoci il palmo. Mentre parla il fumo della pipa gli gira intorno alla testa e non
            arriva mai fino al metallo. Poi ti indica l'incavo accanto alla porta.
          effetti: { profondita.gilda-monconi-del-ventisette: 1 }

  # ------------------------------------------------------------ il cuore · la camera del pilone
  - id: gilda-monconi-la-camera-del-pilone
    immagine: ambientazione/rovine-dei-precursori
    titolo: La camera del pilone
    sommario: "Accanto alla porta di metallo c'è un incavo grande come una mano."
    luogo: I monconi del Ventisette, la porta del cuore del pilone
    area: gilda-monconi-del-ventisette
    requisiti: [fazione.gilda == 10, profondita.gilda-monconi-del-ventisette >= 5]
    testo: |
      La porta del cuore del pilone è un pannello di metallo scuro e liscio che combacia con il resto del
      pilone senza una fessura. Accanto c'è un incavo grande come una mano aperta, dove le linee incise del
      pilone si stringono e si fermano. Dietro il pannello il ronzio è più forte e ogni tanto si interrompe.

      {tecnologia Difficile} I congegni dei Precursori si aprono con una sequenza di pressioni nel punto
      giusto. Chi l'ha aperta prima di te ha lasciato sul metallo tre segni di pollice, così netti che le
      righe della pelle si contano una per una.

      {magia Media} Dietro il pannello il Mana gira chiuso su se stesso. Un incantesimo che sigilla e
      disigilla, come quelli dell'Accademia, ci parlerebbe.

      Sul pannello non c'è un granello di polvere, e ti dici che è il ronzio a scuoterla via. In un angolo c'è
      una cosa rotonda coperta di polvere spessa un dito. Nel mezzo c'è un cerchio più sottile, dove la
      polvere si è sollevata e si è posata di nuovo.
    opzioni:
      - testo: "Aprire il congegno"
        descrizione: "Tre segni di pollice per tre pressioni. Bisogna trovare l'ordine, prima che il guardiano si svegli."
        quando: [gilda.vano == 0]
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Difficile }
        successo:
          titolo: Tre pressioni
          testo: |
            Premi il palmo nell'incavo e poi il pollice sui tre segni uno alla volta, nell'ordine in cui sono
            più consumati. Il ronzio si ferma, e il pannello scivola di lato senza un suono. Dentro c'è una
            camera stretta con le pareti che brillano piano e una nicchia all'altezza del petto. La luce viene
            da tutte le pareti insieme, e sul pavimento la tua ombra non c'è.
          pe: { tecnologia: 10 }
          imposta: { gilda.vano: 1 }
          segue: gilda-monconi-la-scorta
        fallimento:
          titolo: Il guardiano
          testo: |
            Premi i segni nell'ordine sbagliato, e la cosa rotonda nell'angolo si accende tutta e si alza
            nell'aria. La polvere le scivola di dosso in un colpo solo. Ti colpisce sulla tempia prima di
            tornare a terra a spegnersi, dentro lo stesso cerchio da cui si era alzata. Ti rialzi con il
            sangue negli occhi e la porta ancora chiusa.
          effetti: { ferite: 1 }
      - testo: "Aprirla con il Sigillo"
        descrizione: "L'incantesimo dell'Accademia che sigilla e disigilla. Il pilone dovrebbe riconoscerlo."
        quando: [gilda.vano == 0]
        incantesimo: sigillo
        prova: { attributo: mentale, abilita: magia, difficolta: Media }
        successo:
          titolo: Il Mana che si apre
          testo: |
            Appoggi la mano nell'incavo e dici la formula del Sigillo al contrario, come insegnano in
            Accademia. Il Mana che gira nel pilone ti passa nel palmo e ti risale fino alla spalla, e il
            pannello scivola di lato. Dentro c'è una camera stretta con una nicchia all'altezza del petto.
            Quando stacchi la mano il giro del Mana ti resta nel polso, e va allo stesso passo del ronzio.
          pe: { magia: 5 }
          imposta: { gilda.vano: 1 }
          segue: gilda-monconi-la-scorta
        fallimento:
          titolo: Il Mana che torna
          testo: |
            La formula ti si spezza in bocca, e il Mana torna indietro fino al gomito, freddo come acqua di
            pozzo. La porta resta chiusa, e la cosa rotonda nell'angolo si accende per un momento sotto la
            polvere. La luce le gira intorno da un fianco all'altro prima di spegnersi.
          effetti: { tormento: 1 }
      - testo: "Svegliare il guardiano e farla finita"
        descrizione: "La cosa rotonda nell'angolo è un drone dei Precursori, e non è da solo. Se cadono, la porta si apre."
        quando: [gilda.vano == 0]
        combattimento: gilda-il-guardiano-dormiente
        vittoria:
          titolo: I droni a terra
          testo: |
            I droni si alzano dall'angolo e dal soffitto, due sfere che ronzano, e tu li abbatti uno dopo
            l'altro sul metallo del pilone. Non hanno occhi né fessure, eppure ti trovano ogni volta che ti
            sposti. Quando l'ultimo si spegne il ronzio dietro la porta si ferma, e il pannello scivola di
            lato da solo. Dentro c'è una camera stretta con una nicchia all'altezza del petto.
          imposta: { gilda.vano: 1 }
          segue: gilda-monconi-la-scorta
        sconfitta:
          titolo: Il ronzio
          testo: |
            I droni ti colpiscono da due parti, e tu ti ritrovi a indietreggiare sulle travi con le braccia
            sopra la testa. Dove finisce il metallo del pilone le due sfere si fermano nello stesso punto e
            restano sospese. Ormun ti tira giù per la via della loggia. Tornate ai Ponti con il ronzio che vi
            segue fin dentro le orecchie.
          vai: ponti-sospesi
      - testo: "Tornare al vano aperto"
        descrizione: "Il pannello è come l'hai lasciato, scostato di lato. Dentro c'è la nicchia."
        quando: [gilda.vano >= 1]
        costo: 0
        esito:
          titolo: Il vano aperto
          testo: |
            Il pannello è rimasto scostato come l'avevi lasciato, e sul bordo non si è posato un granello di
            polvere. Entri nella camera stretta e ti fermi davanti alla nicchia, con il cuore che ti batte
            fino in gola.
          segue: gilda-monconi-la-scorta
      - testo: "Scendere e tornare un'altra volta"
        descrizione: "Il pilone resta qui, e il guardiano anche."
        costo: 0
        esito:
          titolo: La discesa
          testo: |
            Scendete per la via della loggia e delle corde vecchie, con il ronzio del pilone che vi accompagna
            fino alla base. Lo senti nei pioli sotto le mani fino all'ultimo, e smette quando metti i piedi
            sulla roccia. Ormun non dice niente per tutta la strada.
          vai: ponti-sospesi
      - testo: "Aprire il congegno come un reperto"
        descrizione: "Sulle piattaforme i gusci dei Precursori si aprono con la pressione giusta, mai con la forza. Questo è un guscio grande come una casa."
        quando: [gilda.vano == 0, origine.apprendista-raschiatore >= 1]
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Media }
        successo:
          titolo: La pressione giusta
          testo: |
            Appoggi il palmo nell'incavo come sui gusci delle piattaforme, e aspetti che il metallo ti dica
            dove premere. Il segnale è un tepore che si sposta sotto la pelle e si ferma in tre punti, uno
            dopo l'altro. Premi tre volte, piano. Il ronzio si ferma e il pannello scivola di lato. Dentro c'è
            una camera stretta con una nicchia all'altezza del petto.
          pe: { tecnologia: 10 }
          imposta: { gilda.vano: 1 }
          segue: gilda-monconi-la-scorta
        fallimento:
          titolo: Il guscio che punge
          testo: |
            Premi, e il metallo ti respinge la mano con una scossa. La cosa rotonda nell'angolo si alza e ti
            colpisce sulla tempia prima di tornare a terra, e la porta resta chiusa davanti a te. Sul
            pavimento la sfera gira ancora un poco su se stessa prima di fermarsi.
          effetti: { ferite: 1 }

  - id: gilda-monconi-la-scorta
    immagine: icone/tied-scroll
    titolo: Il documento e la scorta
    tipo: seguito
    luogo: I monconi del Ventisette, la camera del pilone
    area: gilda-monconi-del-ventisette
    requisiti: [fazione.gilda == 10, gilda.vano >= 1]
    testo: |
      Nella nicchia c'è un rotolo di pergamena avvolto nella tela cerata. La tela si è fatta dura e si apre
      con uno scricchiolio, e dentro la pergamena è chiara e morbida sotto le dita. È il documento del 127,
      l'unica copia, con i sigilli in cera rossa delle tre famiglie del Patto. Il primo è quello di Hakkos
      Cordani, il primo Sovrintendente.

      Nella notte del 127 le tre famiglie bruciarono insieme i tre ponti per raddoppiare i pedaggi e
      ricostruirli con il denaro della Gilda. Accanto ai sigilli c'è un nodo da tiracorde fatto con una corda
      bruciata, nera fino all'anima delle fibre.

      {accademiche Media} È il nodo dei Vennari, e un nodo stretto accanto ai sigilli vale quanto una firma.
      Vuol dire che anche il nonno di Clelia ha firmato per attestare che c'era.

      Dalla loggia arriva il rumore di una mazza ferrata che batte sul ferro. Il metallo del pilone non lo
      porta, e i colpi li senti soltanto dall'apertura del pannello, ognuno un poco più vicino. Sale la scorta
      di Morlacchi, tre uomini guidati da un capo con i guanti da carico e la livrea dei magazzini.

      {origine rampollo-dei-quartieri-alti} Il sigillo dei Cordani l'hai visto sulle lettere d'invito sopra il
      camino di casa, nella stessa cera rossa. Trovarlo qui sotto ti fa raddrizzare la schiena come davanti a
      un tradimento in famiglia.
    opzioni:
      - testo: "Affrontare la scorta sulle travi"
        descrizione: "Tre uomini pagati bene, su travi strette, sopra la Cicatrice. È una battaglia da non perdere."
        combattimento: gilda-la-scorta-di-morlacchi
        vittoria:
          titolo: Le travi
          testo: |
            Il capo della scorta cade sulle travi con la mazza fuori portata, e gli altri due scappano per la
            via della loggia. Lui ti guarda da terra e ti chiede soltanto di non dirlo a Morlacchi. Nella
            loggia, mentre scendi, trovi su un chiodo un paio di guanti da tiracorde con il palmo intrecciato
            di corda, e li prendi. Il cuoio del dorso è secco e crepato, e la corda del palmo è ancora intera.
            Il documento è nella tua giubba, contro il petto.
          pe: { atletica: 5, accademiche: 5 }
          effetti: { oggetto.gilda-guanti-delle-tiracorde: 1, reliquie.frammento-inciso: 2, racconto: 1, rep.gilda: 0.5, fazione.gilda: 1 }
          vai: ponti-sospesi
        sconfitta:
          titolo: Il documento nella nicchia
          testo: |
            Il capo della scorta ti colpisce con la mazza e tu cadi contro il pannello, che sotto la schiena è
            tiepido e vibra appena. Fai appena in tempo a rimettere il rotolo nella nicchia, dove loro non
            arrivano, prima che ti trascinino fuori. Ti lasciano sulle travi, convinti che il pilone fosse
            vuoto, e Ormun ti porta giù appoggiat{o|a} alla sua spalla.
          vai: ponti-sospesi
      - testo: "Convincerli a contare i soldi altrove"
        descrizione: "Sono pagati per tornare con un documento. Bisogna convincerli che il documento non c'era."
        prova: { attributo: sociale, abilita: [persuasione, ingannare], difficolta: Difficile }
        successo:
          titolo: La loggia vuota
          testo: |
            Esci dalla camera con le mani vuote e il rotolo nella giubba, e dici al capo della scorta che la
            nicchia era vuota da cinquant'anni. Gli mostri il pannello aperto e la polvere. Lui ci pensa
            guardando la Cicatrice e i suoi uomini, e intanto la mazza gli batte piano contro lo stivale. Alla
            fine se ne vanno. Nella loggia, scendendo, trovi un paio di guanti da tiracorde su un chiodo, e li
            prendi.
          pe: { persuasione: 5, accademiche: 5 }
          effetti: { oggetto.gilda-guanti-delle-tiracorde: 1, reliquie.frammento-inciso: 2, racconto: 1, rep.gilda: 0.5, fazione.gilda: 1 }
          vai: ponti-sospesi
        fallimento:
          titolo: Le tasche
          testo: |
            Gli dici che la nicchia era vuota, e lui ti chiede di vuotare le tasche. Rimetti il rotolo nella
            nicchia con un gesto che lui non vede, e intanto ti mettono le mani addosso. I guanti da carico
            del capo ti grattano la faccia come tela di sacco. Ti lasciano sulle travi con un occhio nero,
            convinti di avere perso tempo.
          effetti: { ferite: 1 }
          vai: ponti-sospesi
      - testo: "Scendere per le corde vecchie con il documento"
        descrizione: "Dalla camera c'è una feritoia sulle corde del 127. Si scende appesi, sopra il vuoto, prima che arrivino."
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Difficile }
        successo:
          titolo: Le corde del 127
          testo: |
            Ti infili nella feritoia e scendi lungo le corde vecchie, mano dopo mano, con il rotolo nella
            giubba e la Cicatrice sotto i piedi. Il catrame delle corde si è fatto duro come corteccia e ti
            scortica i palmi. Sopra di te la scorta grida e cerca. A metà discesa trovi su una staffa un paio
            di guanti da tiracorde, lasciati lì da qualcuno tanto tempo fa, e li infili. Ormun ti aspetta alla
            base con la pipa accesa.
          pe: { acrobazia: 5, accademiche: 5 }
          effetti: { oggetto.gilda-guanti-delle-tiracorde: 1, reliquie.frammento-inciso: 2, racconto: 1, rep.gilda: 0.5, fazione.gilda: 1 }
          vai: ponti-sospesi
        fallimento:
          titolo: La corda che brucia
          testo: |
            Una corda vecchia si sbriciola sotto le tue mani, e fai appena in tempo a tornare nella camera e a
            rimettere il rotolo nella nicchia prima che la scorta ti trovi. I pezzi della corda cadono nella
            Cicatrice senza un rumore. Ti lasciano sulle travi con le mani scorticate, e Ormun ti porta giù
            per la via della loggia.
          effetti: { ferite: 1 }
          vai: ponti-sospesi
      - testo: "Scendere per le corde come sulla Cicatrice"
        descrizione: "Sulle piattaforme si scende appesi tutti i giorni. Le corde del 127 sono soltanto più vecchie."
        quando: [origine.apprendista-raschiatore >= 1]
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Media }
        successo:
          titolo: Come sulla piattaforma
          testo: |
            Scendi per le corde vecchie come scendevi sulle piattaforme, con una mano sempre su una corda
            buona e il rotolo nella giubba. Le corde buone le riconosci al tatto, perché sotto il catrame
            restano dure mentre quelle marce cedono sotto il pollice. A metà discesa trovi su una staffa un
            paio di guanti da tiracorde, e li infili. Sopra di te la scorta grida, mentre Ormun ti aspetta
            alla base con la pipa accesa.
          pe: { acrobazia: 5, accademiche: 5 }
          effetti: { oggetto.gilda-guanti-delle-tiracorde: 1, reliquie.frammento-inciso: 2, racconto: 1, rep.gilda: 0.5, fazione.gilda: 1 }
          vai: ponti-sospesi
        fallimento:
          titolo: La corda che brucia
          testo: |
            Una corda si sbriciola sotto le tue mani, e torni nella camera in tempo per rimettere il rotolo
            nella nicchia. Sotto la crosta di catrame la corda era soltanto polvere nera, e ti resta sulle
            dita. La scorta ti lascia sulle travi con le mani scorticate, e Ormun ti porta giù per la via
            della loggia.
          effetti: { ferite: 1 }
          vai: ponti-sospesi
