# I monconi del Ventisette, spedizione del passo 11 della quest della Gilda (fazione.gilda == 10).
# I piloni dei due ponti bruciati nel 127, sopra la Cicatrice. Ci si entra da `gilda-le-tre-versioni` (passi-3.yaml),
# con Ormun Pell o, con chiatta.posto, sulla Mula di Ilde (si salta la prima fascia). Ritorno ai Ponti, soglia 5.
# Le stanze vanno in fasce di profondità, e una stanza superata non ricompare nella stessa visita:
#   0 il pilone di ponente (la base; la scala di ferro, che vale anche a 1);
#   1 le corde vecchie (le corde del 127; il ponte di funi, che vale anche a 2);
#   2 la loggia delle tiracorde (la parete dei nodi; i segni delle famiglie);
#   3 le travi bruciate (le travi; i gabbiani di cresta grigia e l'uomo della scorta, che valgono anche a 4);
#   4 il cuore di metallo del pilone.
# Ogni stanza ha una via lunga che costa due rintocchi e fa avanzare comunque.
# Il cuore a 5 è la camera del pilone, con il vano dei Precursori: si apre con Tecnologia (Difficile), con l'incantesimo
# Sigillo o svegliando il guardiano (droni ciechi). Aperto il vano (gilda.vano 1), il seguito `gilda-monconi-la-scorta`
# mostra il documento firmato del 127 e porta la scorta di Morlacchi: combattimento, Persuasione o la discesa per le corde
# vecchie, tutte Difficili. Chi perde torna ai Ponti, e al ritorno il vano è già aperto.
# Il documento (canone proposto e approvato): i sigilli delle tre famiglie del Patto, quello di Hakkos Cordani per primo.
aree:
  - id: gilda-monconi-del-ventisette
    immagine: ambientazione/cicatrice-del-mondo
    nome: I monconi del Ventisette
    sommario: "I piloni dei due ponti bruciati nel 127, sopra la Cicatrice. Nella loggia di ponente un tiracorde nascose la verità sull'incendio."
    spedizione: { ritorno: ponti-sospesi, soglia: 5, stanze: 3 }
    testo: |
      A valle delle Mille Corde, dove la Cicatrice si allarga, due piloni di
      ferro nero escono dalla parete come denti rotti. Sono quello che resta
      dei ponti bruciati nella notte del 127, e nessuno ci sale da
      cinquant'anni.

      Dalle cime pendono le corde vecchie annerite dal fuoco, sulle travi
      nidificano i gabbiani di cresta grigia, e a metà del pilone di ponente
      c'è la loggia dove le tiracorde del Patto si riparavano dal vento.

# La musica della spedizione (come le altre aree in contenuti/audio.yaml).
colonna:
  - { contesto: area, id: gilda-monconi-del-ventisette, musica: the-light-that-failed, ambiente: forest-night }

storylet:
  # ------------------------------------------------------------ 0 · il pilone di ponente
  - id: gilda-monconi-il-pilone-di-ponente
    immagine: ambientazione/cicatrice-del-mondo
    titolo: La base del pilone
    sommario: "Il pilone di ponente si sale soltanto per i pioli arrugginiti dei tiracorde."
    luogo: I monconi del Ventisette, la base del pilone di ponente
    area: gilda-monconi-del-ventisette
    ripetibile: true
    requisiti: [fazione.gilda == 10, profondita.gilda-monconi-del-ventisette == 0]
    testo: |
      La base del pilone di ponente è un blocco di ferro nero piantato nella
      roccia, che sale stringendosi per cento braccia fino al moncone del
      ponte. Lungo il fianco i tiracorde piantarono un piolo ogni braccio, e
      la ruggine ne ha mangiati metà.

      {tecnologia Media} Il ferro del pilone non viene da Qir-Azel. Sotto la
      ruggine c'è un metallo liscio e scuro che i tiracorde non sapevano
      fare.

      Ormun Pell si sputa nelle mani e guarda in su, con la pipa spenta fra
      i denti. «Mio padre ci saliva, e diceva che il pilone regge perché non
      è nostro.»
    opzioni:
      - testo: "Salire per i pioli"
        descrizione: "Uno alla volta, saggiando ogni piolo prima di metterci il peso."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Media }
        successo:
          titolo: I pioli
          testo: |
            Sali saggiando ogni piolo con la mano, e quando il vento ti prende di
            fianco resti incollato al ferro finché passa. In cima ti infili in una
            porticina nel fianco del pilone.
          pe: { atletica: 3 }
          effetti: { profondita.gilda-monconi-del-ventisette: 1 }
        fallimento:
          titolo: Il piolo che si stacca
          testo: |
            Un piolo si stacca sotto il tuo piede e cade nella Cicatrice senza un
            suono. Ormun ti afferra la caviglia, e scendete insieme.
          effetti: { ferite: 0.5 }
      - testo: "Cercare la via dei tiracorde"
        descrizione: "I tiracorde non salivano a caso, e la via buona la segnavano."
        prova: { attributo: mentale, abilita: [percezione, accademiche], difficolta: Media }
        successo:
          titolo: Le tacche
          testo: |
            Accanto ai pioli buoni trovi le tacche dei tiracorde, tre righe incise
            con lo scalpello, e la via che segnano ti porta sano fino a una
            porticina nel fianco del pilone.
          pe: { percezione: 3 }
          effetti: { profondita.gilda-monconi-del-ventisette: 1 }
        fallimento:
          titolo: Ruggine
          testo: |
            Trovi soltanto ruggine e cacca di gabbiano, e Ormun dice che domani ci
            riprovate.
          effetti: { tormento: 1 }
      - testo: "Salire legati a Ormun, piano"
        descrizione: "Una corda fra te e lui, e lui sale per primo."
        costo: 2
        esito:
          titolo: In cordata
          testo: |
            Ormun ti lega a sé con una corda di canapa e sale per primo,
            aspettandoti a ogni sosta. Alla porticina nel fianco del pilone
            arrivate con il sole già basso.
          effetti: { profondita.gilda-monconi-del-ventisette: 1 }

  # ------------------------------------------------------------ 0–1 · la scala di ferro
  - id: gilda-monconi-la-scala-di-ferro
    immagine: icone/ladder
    titolo: La scala di ferro
    sommario: "Dentro il pilone sale al buio una scala di ferro a chiocciola mangiata dalla ruggine."
    luogo: I monconi del Ventisette, dentro il pilone
    area: gilda-monconi-del-ventisette
    ripetibile: true
    requisiti: [fazione.gilda == 10, profondita.gilda-monconi-del-ventisette <= 1]
    testo: |
      Dentro il pilone il buio sa di ruggine bagnata. La scala a chiocciola
      è fissata al metallo liscio con staffe che non ha fatto mano umana. I
      gradini li hanno messi i tiracorde, in ferro di Qir-Azel, e uno su
      quattro è marcio. Molto in alto entra un filo di luce da una feritoia.

      {acrobazia Media fallita} Il primo gradino che provi si piega sotto il
      piede come carta bagnata, e il tuo equilibrio si offende.
    opzioni:
      - testo: "Salire saltando i gradini marci"
        descrizione: "Uno su quattro cede, e bisogna capire quale prima di metterci il piede."
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Media }
        successo:
          titolo: Uno su quattro
          testo: |
            Sali saltando i gradini marci fino alla feritoia, dove una passerella
            esce verso le corde vecchie.
          pe: { acrobazia: 3 }
          effetti: { profondita.gilda-monconi-del-ventisette: 1 }
        fallimento:
          titolo: Il gradino
          testo: |
            Un gradino cede e scivoli giù per un giro di chiocciola sbattendo le
            ginocchia. Ricominci zoppicando.
          effetti: { ferite: 1 }
      - testo: "Provare i gradini con il coltello"
        descrizione: "La lama rimbalza sul ferro buono ed entra in quello marcio, e si va piano ma sicuri."
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Media }
        successo:
          titolo: La lama
          testo: |
            Il ferro buono suona sotto la lama e quello marcio tace, e arrivi alla
            feritoia con la lama spuntata e le gambe intere.
          pe: { tecnologia: 3 }
          effetti: { profondita.gilda-monconi-del-ventisette: 1 }
        fallimento:
          titolo: Il suono uguale
          testo: |
            A metà scala i gradini suonano tutti uguali, e scendi al buio.
          effetti: { tormento: 1 }
      - testo: "Salire sulla parete, lungo le staffe"
        descrizione: "Le staffe dei Precursori non arrugginiscono, e reggono anche se sono scomode."
        costo: 2
        esito:
          titolo: Le staffe
          testo: |
            Sali da una staffa all'altra e ci metti il doppio, e alla feritoia ti
            guardi a lungo le dita piene di vesciche.
          effetti: { profondita.gilda-monconi-del-ventisette: 1 }

  # ------------------------------------------------------------ 1 · le corde vecchie
  - id: gilda-monconi-le-corde-vecchie
    immagine: icone/rope-coil
    titolo: Le corde del 127
    sommario: "Per arrivare alla loggia bisogna passare sulle corde vecchie del 127, bruciate a metà."
    luogo: I monconi del Ventisette, le corde vecchie
    area: gilda-monconi-del-ventisette
    ripetibile: true
    requisiti: [fazione.gilda == 10, profondita.gilda-monconi-del-ventisette == 1]
    testo: |
      Dalla feritoia una passerella di ferro corre lungo il pilone e finisce
      nel vuoto, dove il ponte si attaccava. Lì pendono una dozzina di corde
      del 127 annerite dal fuoco, e alcune sono ancora tese verso la loggia.

      {tecnologia Media} Le corde bruciate cedono dall'interno. Quelle buone
      hanno il catrame lucido, che sciogliendosi ha protetto la fibra.

      {origine apprendista-raschiatore} Le corde vecchie le leggi come sulla
      piattaforma a fine turno, con le dita. Due di queste hanno la voce
      sbagliata.
    opzioni:
      - testo: "Scegliere la corda buona"
        descrizione: "Quella con il catrame lucido, da trovare prima di metterci il peso."
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Media }
        successo:
          titolo: Il catrame lucido
          testo: |
            Scegli la corda con il catrame più lucido, dura come legno sotto le
            dita, e passi appeso a lei fino alla loggia sopra il bagliore azzurro
            della Cicatrice.
          pe: { tecnologia: 3 }
          effetti: { profondita.gilda-monconi-del-ventisette: 1 }
        fallimento:
          titolo: La cenere
          testo: |
            La fibra ti si sbriciola dentro come pane secco, e Ormun ti tira
            indietro per la giubba mentre la corda cade nella Cicatrice.
          effetti: { tormento: 1 }
      - testo: "Lasciare che scelga Ormun"
        descrizione: "Suo padre ci saliva, e le corde lui le conosce meglio di te."
        prova: { attributo: sociale, abilita: [empatia, persuasione], difficolta: Media }
        successo:
          titolo: Il padre di Ormun
          testo: |
            Ormun tocca le corde e ti racconta di suo padre, ponteggiatore, che la
            mattina dopo il 127 salì qui a tagliare le funi che bruciavano ancora.
            Poi passa per primo, e tu lo segui guardandogli le mani.
          pe: { empatia: 3 }
          effetti: { profondita.gilda-monconi-del-ventisette: 1 }
        fallimento:
          titolo: Il silenzio di Ormun
          testo: |
            Ormun ti guarda come se gli avessi chiesto di portarti in braccio e
            torna alla feritoia. Domani, forse.
          effetti: { tormento: 1 }
      - testo: "Fare il giro per la passerella di sotto"
        descrizione: "Più in basso una passerella di servizio gira intorno al pilone, anche se le manca qualche asse."
        costo: 2
        esito:
          titolo: Il giro
          testo: |
            Fai il giro del pilone sulla passerella di servizio, saltando le assi
            che mancano, e risali sotto la loggia.
          effetti: { profondita.gilda-monconi-del-ventisette: 1 }
      - testo: "Leggere le corde con le dita"
        descrizione: "Sulla piattaforma si fa a fine turno, una corda alla volta."
        quando: [origine.apprendista-raschiatore >= 1]
        esito:
          titolo: La voce delle corde
          testo: |
            Passi le dita sulle corde e scarti le due che suonano vuote. Ormun si
            toglie la pipa di bocca. «Come mio padre» dice soltanto, e passi sulla
            corda buona fino alla loggia.
          pe: { tecnologia: 3 }
          effetti: { profondita.gilda-monconi-del-ventisette: 1 }

  # ------------------------------------------------------------ 1–2 · il ponte di funi
  - id: gilda-monconi-il-ponte-di-funi
    immagine: icone/rope-bridge
    titolo: Il ponte di funi
    sommario: "Fra il moncone e la loggia restano tre corde del ponte di funi, nel vento della Cicatrice."
    luogo: I monconi del Ventisette, il ponte di funi
    area: gilda-monconi-del-ventisette
    ripetibile: true
    requisiti: [fazione.gilda == 10, profondita.gilda-monconi-del-ventisette >= 1, profondita.gilda-monconi-del-ventisette <= 2]
    testo: |
      Del ponte di funi fra il moncone e la loggia restano tre corde, due
      per le mani e una per i piedi, che il vento della Cicatrice fa
      dondolare come un'altalena. Dall'altra parte la porta della loggia
      sbatte aperta.

      {atletica Media} Tre corde bastano, se tieni il peso sulle mani e fai
      scivolare i piedi senza sollevarli mai.
    opzioni:
      - testo: "Attraversare a mani strette"
        descrizione: "Il peso sulle mani e i piedi che scivolano, senza guardare giù."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Media }
        successo:
          titolo: Dall'altra parte
          testo: |
            Attraversi con il peso sulle mani e ti fermi quando soffia. Dall'altra
            parte ti siedi sulla soglia con le mani che bruciano.
          pe: { atletica: 3 }
          effetti: { profondita.gilda-monconi-del-ventisette: 1 }
        fallimento:
          titolo: L'altalena
          testo: |
            Una raffica fa girare il ponte e ti lascia appeso a testa in giù.
            Torni indietro a forza di braccia e resti a lungo sdraiato sul
            moncone.
          effetti: { ferite: 0.5, tormento: 1 }
      - testo: "Legare una corda tua alle funi vecchie"
        descrizione: "Una corda di sicurezza fra la cintura e la fune di sopra."
        prova: { attributo: mentale, abilita: [tecnologia, natura], difficolta: Media }
        successo:
          titolo: La sicura
          testo: |
            Fai scorrere la sicura sulla fune di sopra con un nodo che scivola
            solo in avanti, e quando il vento ti sposta la corda ti tiene.
          pe: { tecnologia: 3 }
          effetti: { profondita.gilda-monconi-del-ventisette: 1 }
        fallimento:
          titolo: Il nodo sbagliato
          testo: |
            Il nodo si stringe al primo strappo e ti blocca a metà ponte, e torni
            indietro a tentoni dopo averlo sciolto.
          effetti: { tormento: 1 }
      - testo: "Aspettare che il vento cali"
        descrizione: "I tiracorde dicono che prima o poi cala, ma non quando."
        costo: 2
        esito:
          titolo: La calma
          testo: |
            Verso il tramonto il vento si calma, e il ponte di funi si ferma come
            un'amaca vuota. Lo attraversi senza fretta.
          effetti: { profondita.gilda-monconi-del-ventisette: 1 }

  # ------------------------------------------------------------ 2 · la loggia delle tiracorde
  - id: gilda-monconi-la-loggia
    immagine: icone/knot
    titolo: La parete dei nodi
    sommario: "Nella loggia delle tiracorde una parete è coperta di nodi, e ogni nodo è un nome."
    luogo: I monconi del Ventisette, la loggia delle tiracorde
    area: gilda-monconi-del-ventisette
    ripetibile: true
    requisiti: [fazione.gilda == 10, profondita.gilda-monconi-del-ventisette == 2]
    testo: |
      La loggia è una stanza di pietra con le finestre strette, costruita
      dentro il pilone come un nido, con un focolare spento da
      cinquant'anni. Lungo la parete di fondo pendono centinaia di corde,
      ognuna con un nodo diverso, e ogni nodo è una firma come sulla fune
      dei soci alla Casa.

      {accademiche Media} I tiracorde che non sapevano scrivere firmavano
      con un nodo. Questa parete è il registro più vecchio della città, e
      quasi nessuno sa più leggerlo.

      Ormun si toglie il cappello, cosa che non gli hai mai visto fare.
    opzioni:
      - testo: "Leggere i nodi"
        descrizione: "I nodi si leggono dall'alto in basso come le righe di un libro."
        prova: { attributo: mentale, abilita: accademiche, difficolta: Media }
        successo:
          titolo: Il registro dei nodi
          testo: |
            In cima ci sono le famiglie del Patto, e dopo il 127 c'è un nodo solo,
            ripetuto per decenni sempre un po' più in basso, fino a quarant'anni
            fa. È il nodo dei Vennari, dice Ormun a mezza voce. Qualcuno della
            famiglia di Clelia è tornato qui ogni anno a dire che era ancora vivo,
            e che sapeva.
          pe: { accademiche: 5 }
          effetti: { profondita.gilda-monconi-del-ventisette: 1 }
        fallimento:
          titolo: Nodi
          testo: |
            I nodi restano soltanto corde annodate. Ormun ti tocca il braccio e ti
            indica la porta verso le travi.
          effetti: { tormento: 1 }
      - testo: "Appendere un nodo tuo"
        descrizione: "Sulla fune dei soci ne hai già uno, ma qui sarebbe un'altra cosa."
        prova: { attributo: fisico, abilita: [acrobazia, tecnologia], difficolta: Facile }
        successo:
          titolo: Il tuo nodo
          testo: |
            Rifai il nodo della Casa con un pezzo di corda e lo appendi sotto
            quelli dei Vennari. Ormun si rimette il cappello e ti indica la porta
            verso le travi.
          effetti: { profondita.gilda-monconi-del-ventisette: 1, rep.ponti: 0.5 }
        fallimento:
          titolo: Il chiodo
          testo: |
            Il chiodo cede e si porta dietro tre corde vecchie, che si
            sbriciolano. Ormun le raccoglie senza guardarti.
          effetti: { rep.ponti: -0.5 }
      - testo: "Passare oltre senza toccare niente"
        descrizione: "I registri si rispettano anche quando non si sanno leggere."
        costo: 2
        esito:
          titolo: Il rispetto
          testo: |
            Passi davanti alla parete come si passa in una chiesa, con Ormun che
            tiene il cappello in mano. In fondo una porta bassa dà sulle travi.
          effetti: { profondita.gilda-monconi-del-ventisette: 1 }

  - id: gilda-monconi-i-segni-delle-famiglie
    immagine: icone/wax-seal
    titolo: I segni delle famiglie
    sommario: "Sul pavimento della loggia sono incisi i segni delle famiglie dei tiracorde."
    luogo: I monconi del Ventisette, il pavimento della loggia
    area: gilda-monconi-del-ventisette
    ripetibile: true
    requisiti: [fazione.gilda == 10, profondita.gilda-monconi-del-ventisette == 2]
    testo: |
      Accanto al focolare sono incisi nella pietra i segni delle famiglie
      che lavoravano sul pilone, ognuno con una tacca per anno. I più
      consumati sono quelli dei Vennari e dei Lusardi, e su quello dei
      Vennari c'è un mozzicone di candela consumato fino alla pietra.

      {empatia Media} La candela l'ha accesa qualcuno che pregava, non molto
      tempo fa. La cera è ancora morbida sotto l'unghia.
    opzioni:
      - testo: "Ricopiare i segni"
        descrizione: "Un carboncino del focolare e un po' di pazienza; Clelia vorrà vederli."
        prova: { attributo: mentale, abilita: [accademiche, percezione], difficolta: Media }
        successo:
          titolo: Il foglio dei segni
          testo: |
            Ricopi i segni a carboncino, scrivendoci accanto i nomi che Ormun
            conosce, e pieghi il foglio nella giubba.
          pe: { accademiche: 3 }
          effetti: { profondita.gilda-monconi-del-ventisette: 1, informazioni.pettegolezzo: 1 }
        fallimento:
          titolo: Il carbone
          testo: |
            Il carboncino si sbriciola e il foglio diventa una macchia nera, e
            Ormun ride per la prima volta da quando siete saliti.
          effetti: { profondita.gilda-monconi-del-ventisette: 1, tormento: 1 }
      - testo: "Accendere la candela dei Vennari"
        descrizione: "Qualcuno l'ha lasciata per un motivo, e qui i gesti contano."
        prova: { attributo: sociale, abilita: [empatia, galateo], difficolta: Media }
        successo:
          titolo: La candela
          testo: |
            La fiamma sta dritta anche nel vento delle finestre. Ormun si toglie
            di nuovo il cappello, e la guardate finché si spegne da sola.
          pe: { empatia: 3 }
          effetti: { profondita.gilda-monconi-del-ventisette: 1, tormento: -0.5 }
        fallimento:
          titolo: Lo stoppino
          testo: |
            Lo stoppino è troppo corto e ti brucia le dita, e andate verso le
            travi in silenzio.
          effetti: { profondita.gilda-monconi-del-ventisette: 1, ferite: 0.5 }
      - testo: "Tirare dritto verso le travi"
        descrizione: "I segni restano qui, e intanto la scorta di Morlacchi sale."
        costo: 2
        esito:
          titolo: Verso le travi
          testo: |
            Passi sopra i segni attento a non calpestarli. Ormun resta indietro un
            momento, chinato sul segno dei Lusardi.
          effetti: { profondita.gilda-monconi-del-ventisette: 1 }

  # ------------------------------------------------------------ 3 · le travi bruciate
  - id: gilda-monconi-le-travi-bruciate
    immagine: ambientazione/cicatrice-del-mondo
    titolo: Le travi bruciate
    sommario: "Oltre la loggia le travi del ponte bruciato sporgono sul vuoto, piegate dal fuoco."
    luogo: I monconi del Ventisette, le travi bruciate
    area: gilda-monconi-del-ventisette
    ripetibile: true
    requisiti: [fazione.gilda == 10, profondita.gilda-monconi-del-ventisette == 3]
    testo: |
      Oltre la porta bassa le travi annerite del ponte bruciato sporgono sul
      vuoto, piegate dal calore come candele lasciate al sole, con il
      bagliore azzurro della Cicatrice sotto.

      {accademiche Difficile} Il ferro si piega così soltanto con un fuoco
      molto più caldo di un incendio di legno. Nel 127 qualcuno aveva
      preparato bene le funi da far bruciare.

      In fondo, dove il pilone si stringe, una porta di metallo senza
      maniglia chiude il cuore del pilone.
    opzioni:
      - testo: "Camminare sulle travi"
        descrizione: "Sono larghe un piede, e bisogna tenere il peso basso."
        prova: { attributo: fisico, abilita: [acrobazia, resistenza], difficolta: Media }
        successo:
          titolo: Il peso basso
          testo: |
            Cammini con il peso basso e le braccia larghe, e in fondo appoggi la
            mano sul metallo liscio del cuore del pilone.
          pe: { acrobazia: 3 }
          effetti: { profondita.gilda-monconi-del-ventisette: 1 }
        fallimento:
          titolo: La trave storta
          testo: |
            Una trave si inclina e ti ritrovi a cavalcioni del ferro con le gambe
            nel vuoto, finché Ormun non ti tira indietro con una corda.
          effetti: { ferite: 0.5, tormento: 1 }
      - testo: "Studiare il ferro piegato"
        descrizione: "Il fuoco del 127 ha lasciato il segno sul ferro, per chi sa leggerlo."
        prova: { attributo: mentale, abilita: [accademiche, tecnologia], difficolta: Media }
        successo:
          titolo: L'olio
          testo: |
            Sotto la crosta nera di una trave la lama trova una macchia lucida che
            sa ancora d'olio. Le funi del ponte erano state bagnate d'olio prima
            del fuoco.
          pe: { accademiche: 3 }
          effetti: { profondita.gilda-monconi-del-ventisette: 1, informazioni.pettegolezzo: 1 }
        fallimento:
          titolo: La crosta
          testo: |
            Sotto la crosta c'è altra crosta, e la lama ti scivola sul dorso della
            mano.
          effetti: { ferite: 0.5 }
      - testo: "Passare per le staffe, sotto le travi"
        descrizione: "Sotto le travi le staffe sono vicine e solide, da passare a forza di braccia."
        costo: 2
        esito:
          titolo: Appesi
          testo: |
            Passi appeso alle staffe con la Cicatrice che ti illumina le suole, e
            arrivi alla porta di metallo con le braccia che non senti più.
          effetti: { profondita.gilda-monconi-del-ventisette: 1 }

  # ------------------------------------------------------------ 3–4 · i gabbiani di cresta grigia
  - id: gilda-monconi-i-gabbiani
    immagine: icone/seagull
    titolo: I gabbiani di cresta grigia
    sommario: "Sulle travi nidificano i gabbiani di cresta grigia, che difendono le uova."
    luogo: I monconi del Ventisette, i nidi sulle travi
    area: gilda-monconi-del-ventisette
    ripetibile: true
    requisiti: [fazione.gilda == 10, profondita.gilda-monconi-del-ventisette >= 3, profondita.gilda-monconi-del-ventisette <= 4]
    testo: |
      Sulle travi più alte i gabbiani di cresta grigia hanno fatto i nidi
      con le fibre delle corde bruciate, proprio sopra il passaggio verso la
      porta di metallo. Quando ti vedono se ne alzano una trentina e ti
      girano intorno gridando.

      {natura Media} Difendono le uova. Se resti lontano dai nidi ti seguono
      gridando, e attaccano soltanto chi si avvicina.
    opzioni:
      - testo: "Passare sotto i nidi con il braccio alzato"
        descrizione: "Lo stormo attaccherà, e bisogna coprirsi la faccia e non fermarsi."
        combattimento: gilda-lo-stormo
        vittoria:
          titolo: Lo stormo
          testo: |
            Passi sotto i nidi con il braccio alzato e la lama nell'altra mano, e
            quando ne cadono due gli altri se ne vanno. Hai il braccio pieno di
            beccate.
          effetti: { profondita.gilda-monconi-del-ventisette: 1 }
        sconfitta:
          titolo: Le beccate
          testo: |
            Lo stormo ti ricaccia fino alla loggia con le mani piene di sangue, e
            Ormun te le fascia bestemmiando.
          effetti: { tormento: 1 }
      - testo: "Girare lontano dai nidi"
        descrizione: "Attaccano soltanto chi si avvicina alle uova."
        prova: { attributo: mentale, abilita: natura, difficolta: Media }
        successo:
          titolo: Lontano dalle uova
          testo: |
            Da dove si posano capisci dove sono i nidi, e giri lungo il bordo
            esterno delle travi con lo stormo che grida senza toccarti.
          pe: { natura: 3 }
          effetti: { profondita.gilda-monconi-del-ventisette: 1 }
        fallimento:
          titolo: Il nido nascosto
          testo: |
            Metti il piede in un nido che non vedevi, e lo stormo ti ricaccia fino
            alla loggia.
          effetti: { ferite: 0.5, tormento: 1 }
      - testo: "Aspettare che lo stormo vada a pescare"
        descrizione: "Al tramonto i gabbiani scendono a pescare e lasciano i nidi per poco."
        costo: 2
        esito:
          titolo: Il tramonto
          testo: |
            Al tramonto lo stormo si butta nella Cicatrice, e tu passi sotto i
            nidi in fretta.
          effetti: { profondita.gilda-monconi-del-ventisette: 1 }

  # ------------------------------------------------------------ 3–4 · l'uomo della scorta
  - id: gilda-monconi-l-uomo-della-scorta
    immagine: icone/hooded-figure
    titolo: L'uomo della scorta
    sommario: "Sulle travi c'è un uomo della scorta di Morlacchi, mandato avanti."
    luogo: I monconi del Ventisette, le travi alte
    area: gilda-monconi-del-ventisette
    ripetibile: true
    requisiti: [fazione.gilda == 10, profondita.gilda-monconi-del-ventisette >= 3, profondita.gilda-monconi-del-ventisette <= 4]
    testo: |
      Su una trave alta, accucciato contro il pilone, c'è un uomo con la
      livrea dei magazzini di scarico sulla manica che guarda giù verso la
      base. È uno della scorta di Morlacchi mandato avanti, e gli altri non
      sono lontani.

      {furtivita Media} Guarda giù, non di lato. Il vento copre i passi, se
      li fai quando soffia.
    opzioni:
      - testo: "Arrivargli addosso prima che si giri"
        descrizione: "Un uomo solo su una trave stretta, prima che chiami gli altri."
        combattimento: gilda-un-uomo-della-scorta
        vittoria:
          titolo: La livrea
          testo: |
            La lama gli cade nella Cicatrice e lui si arrende. Lo leghi alla trave
            con la sua cintura, mentre ti promette che Morlacchi lo saprà.
          effetti: { profondita.gilda-monconi-del-ventisette: 1 }
        sconfitta:
          titolo: Il fischio
          testo: |
            Ti colpisce di piatto e fischia verso il basso, e torni alla loggia
            prima che arrivino gli altri.
          effetti: { sospetto: 1 }
      - testo: "Passargli alle spalle con il vento"
        descrizione: "Un passo per ogni raffica, con la schiena contro il pilone."
        prova: { attributo: fisico, abilita: furtivita, difficolta: Media }
        successo:
          titolo: Con il vento
          testo: |
            Ti muovi soltanto quando soffia il vento, e gli passi alle spalle
            senza che si volti mai.
          pe: { furtivita: 3 }
          effetti: { profondita.gilda-monconi-del-ventisette: 1 }
        fallimento:
          titolo: La raffica che cala
          testo: |
            Il vento cala mentre fai il passo, la suola gratta sul ferro e lui
            fischia verso il basso. Torni alla loggia.
          effetti: { sospetto: 1 }
      - testo: "Fargli contare i soldi altrove"
        descrizione: "Un uomo della scorta è pagato per salire, e nessuno lo paga per cadere."
        prova: { attributo: sociale, abilita: [persuasione, intimidire], difficolta: Media }
        successo:
          titolo: Il conto
          testo: |
            Gli fai notare quanto è alta la Cicatrice e quanto è bassa la sua
            paga. Lui scende per dove è salito, e agli altri dirà che la loggia
            era vuota.
          pe: { persuasione: 3 }
          effetti: { profondita.gilda-monconi-del-ventisette: 1 }
        fallimento:
          titolo: La paga
          testo: |
            Lui ride, dice che Morlacchi paga bene anche chi cade e fischia verso
            il basso.
          effetti: { sospetto: 1 }

  # ------------------------------------------------------------ 4 · il cuore di metallo del pilone
  - id: gilda-monconi-il-metallo-del-pilone
    immagine: ambientazione/rovine-dei-precursori
    titolo: Il metallo del pilone
    sommario: "In cima alle travi comincia il metallo dei Precursori, e dentro il pilone qualcosa ronza."
    luogo: I monconi del Ventisette, il cuore del pilone
    area: gilda-monconi-del-ventisette
    ripetibile: true
    requisiti: [fazione.gilda == 10, profondita.gilda-monconi-del-ventisette == 4]
    testo: |
      Dove le travi finiscono comincia il metallo scuro del pilone vero,
      tiepido anche nel vento. Dentro, molto in fondo, qualcosa ronza come
      un alveare chiuso in una cassa.

      {tecnologia Media} Sul metallo girano linee incise sottili come
      capelli, le stesse dei gusci sigillati della Superficie, e scendono
      verso una porta.

      Ormun tiene la mano lontana dal metallo e guarda la porta, che non ha
      maniglia né serratura, come nel disegno del nonno di Clelia.
    opzioni:
      - testo: "Seguire le linee incise"
        descrizione: "Girano intorno al pilone e scendono fino alla porta."
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Media }
        successo:
          titolo: Le linee
          testo: |
            Segui le linee con la punta del dito fino a un incavo grande come una
            mano, accanto alla porta, dove finiscono tutte.
          pe: { tecnologia: 3 }
          effetti: { profondita.gilda-monconi-del-ventisette: 1 }
        fallimento:
          titolo: Il giro
          testo: |
            Dopo tre giri capisci che le linee non finiscono mai, e ti siedi
            finché la testa non smette di girare.
          effetti: { tormento: 1 }
      - testo: "Ascoltare il ronzio"
        descrizione: "Il Mana gira in cerchio, e chi lo sa ascoltare sente dove si ferma."
        prova: { attributo: mentale, abilita: [magia, resilienza], difficolta: Media }
        successo:
          titolo: Dove si ferma
          testo: |
            Con l'orecchio sul metallo senti il ronzio fermarsi per un battito in
            un punto solo, accanto alla porta, dove c'è un incavo grande come una
            mano.
          pe: { magia: 3 }
          effetti: { profondita.gilda-monconi-del-ventisette: 1, tormento: 1 }
        fallimento:
          titolo: Nei denti
          testo: |
            Il ronzio ti entra nei denti, e ci vuole un'ora per smettere di
            sentirlo.
          effetti: { tormento: 1.5 }
      - testo: "Aspettare che Ormun trovi la porta"
        descrizione: "Suo padre è salito fin qui la mattina dopo il fuoco."
        costo: 2
        esito:
          titolo: Il racconto di Ormun
          testo: |
            Ormun si accende la pipa. Suo padre, la mattina dopo il fuoco, vide un
            vecchio tiracorde uscire dal pilone a mani vuote e richiudere la porta
            con il palmo, appoggiandolo nell'incavo che ora ti indica.
          effetti: { profondita.gilda-monconi-del-ventisette: 1 }

  # ------------------------------------------------------------ il cuore · la camera del pilone
  - id: gilda-monconi-la-camera-del-pilone
    immagine: ambientazione/rovine-dei-precursori
    titolo: La camera del pilone
    sommario: "Accanto alla porta di metallo c'è un incavo grande come una mano, e dietro la verità sul 127."
    luogo: I monconi del Ventisette, la porta del cuore del pilone
    area: gilda-monconi-del-ventisette
    requisiti: [fazione.gilda == 10, profondita.gilda-monconi-del-ventisette >= 5]
    testo: |
      La porta del cuore del pilone è un pannello di metallo scuro alto due uomini, con
      accanto un incavo grande come una mano aperta. Nella polvere davanti alla porta
      restano le impronte vecchie di un paio di stivali.

      {tecnologia Difficile} I congegni dei Precursori si aprono con una sequenza di
      pressioni, e chi l'ha aperta prima di te ha lasciato tre volte il segno del pollice
      sul metallo.

      In un angolo c'è una cosa rotonda grande come un pugno, con linee incise che si
      accendono piano. Ormun si mette fra te e lei.
    opzioni:
      - testo: "Aprire il congegno"
        descrizione: "Tre segni di pollice, nell'ordine giusto, prima che il guardiano si svegli."
        quando: [gilda.vano == 0]
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Difficile }
        successo:
          titolo: Tre pressioni
          testo: |
            Premi il palmo nell'incavo e poi i tre segni, dal più consumato al
            meno. Il pannello scivola di lato su una camera stretta, con le pareti
            che brillano piano e una nicchia all'altezza del petto.
          pe: { tecnologia: 10 }
          imposta: { gilda.vano: 1 }
          segue: gilda-monconi-la-scorta
        fallimento:
          titolo: Il guardiano
          testo: |
            All'ordine sbagliato la cosa rotonda si alza e ti colpisce sulla
            tempia, e la porta resta chiusa.
          effetti: { ferite: 1 }
      - testo: "Aprirla con il Sigillo"
        descrizione: "L'incantesimo dell'Accademia che chiude e riapre, e il pilone dovrebbe riconoscerlo."
        quando: [gilda.vano == 0]
        incantesimo: sigillo
        prova: { attributo: mentale, abilita: magia, difficolta: Media }
        successo:
          titolo: Il Mana che si apre
          testo: |
            Con la mano nell'incavo dici la formula del Sigillo al contrario, e il
            pannello scivola di lato su una camera stretta con una nicchia
            all'altezza del petto.
          pe: { magia: 5 }
          imposta: { gilda.vano: 1 }
          segue: gilda-monconi-la-scorta
        fallimento:
          titolo: Il Mana che torna
          testo: |
            La formula ti si spezza in bocca e il Mana ti torna nel braccio,
            freddo come acqua di pozzo.
          effetti: { tormento: 1 }
      - testo: "Svegliare il guardiano e farla finita"
        descrizione: "La cosa rotonda è un drone dei Precursori, e non è sola."
        quando: [gilda.vano == 0]
        combattimento: gilda-il-guardiano-dormiente
        vittoria:
          titolo: I droni a terra
          testo: |
            Due sfere si alzano ronzando, e le abbatti una dopo l'altra sul
            metallo. Quando l'ultima si spegne il pannello scivola di lato su una
            camera stretta con una nicchia all'altezza del petto.
          imposta: { gilda.vano: 1 }
          segue: gilda-monconi-la-scorta
        sconfitta:
          titolo: Il ronzio
          testo: |
            I droni ti ricacciano sulle travi, e Ormun ti riporta ai Ponti con il
            ronzio nelle orecchie.
          vai: ponti-sospesi
      - testo: "Tornare al vano aperto"
        descrizione: "Il pannello è scostato come l'hai lasciato."
        quando: [gilda.vano >= 1]
        costo: 0
        esito:
          titolo: Il vano aperto
          testo: |
            Entri nella camera stretta e ti fermi davanti alla nicchia.
          segue: gilda-monconi-la-scorta
      - testo: "Scendere e tornare un'altra volta"
        descrizione: "Il pilone resta qui, e il guardiano anche."
        costo: 0
        esito:
          titolo: La discesa
          testo: |
            Scendete per la loggia e le corde vecchie, e Ormun non dice niente per
            tutta la strada.
          vai: ponti-sospesi
      - testo: "Aprire il congegno come un reperto"
        descrizione: "Sulle piattaforme i gusci dei Precursori si aprono con la pressione giusta, e questo è un guscio grande come una casa."
        quando: [gilda.vano == 0, origine.apprendista-raschiatore >= 1]
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Media }
        successo:
          titolo: La pressione giusta
          testo: |
            Appoggi il palmo come sui gusci delle piattaforme e aspetti che il
            metallo ti dica dove premere. Il pannello scivola di lato su una
            camera stretta con una nicchia all'altezza del petto.
          pe: { tecnologia: 10 }
          imposta: { gilda.vano: 1 }
          segue: gilda-monconi-la-scorta
        fallimento:
          titolo: Il guscio che punge
          testo: |
            Il metallo ti respinge con una scossa e la cosa rotonda ti colpisce
            sulla tempia.
          effetti: { ferite: 1 }

  - id: gilda-monconi-la-scorta
    immagine: icone/tied-scroll
    titolo: Il documento e la scorta
    tipo: seguito
    luogo: I monconi del Ventisette, la camera del pilone
    area: gilda-monconi-del-ventisette
    requisiti: [fazione.gilda == 10, gilda.vano >= 1]
    testo: |
      Nella nicchia c'è un rotolo di pergamena avvolto nella tela cerata. È
      il documento del 127, la versione unica, con i sigilli delle tre
      famiglie del Patto in cera rossa. Il primo è quello di Hakkos Cordani,
      il primo Sovrintendente.

      Le tre famiglie bruciarono insieme i tre ponti per raddoppiare i
      pedaggi e ricostruirli con il denaro della Gilda, e le bande in livrea
      che per sette notti si ammazzarono nei vicoli non lo seppero mai.
      Accanto ai sigilli c'è un nodo fatto con una corda bruciata.

      {accademiche Media} È il nodo dei Vennari. Il nonno di Clelia ha
      firmato anche lui, sotto i padroni, per dire che c'era.

      Dalla loggia arriva il colpo di una mazza ferrata sul ferro. La scorta
      di Morlacchi è salita, tre uomini con il capo in guanti da carico e
      livrea dei magazzini.

      {origine rampollo-dei-quartieri-alti} Il sigillo dei Cordani l'hai
      visto sulle lettere d'invito, sopra il camino di casa tua, e trovarlo
      qui è come scoprire un tradimento in famiglia.
    opzioni:
      - testo: "Affrontare la scorta sulle travi"
        descrizione: "Tre uomini pagati bene su travi strette sopra la Cicatrice."
        combattimento: gilda-la-scorta-di-morlacchi
        vittoria:
          titolo: Le travi
          testo: |
            Il capo della scorta cade con la mazza fuori portata, e gli altri
            scappano. Da terra ti chiede soltanto di non dirlo a Morlacchi.
            Scendendo trovi su un chiodo della loggia un paio di guanti da
            tiracorde con il palmo intrecciato, e li prendi.
          pe: { atletica: 5, accademiche: 5 }
          effetti: { oggetto.gilda-guanti-delle-tiracorde: 1, reliquie.frammento-inciso: 2, racconto: 1, rep.gilda: 0.5, fazione.gilda: 1 }
          vai: ponti-sospesi
        sconfitta:
          titolo: Il documento nella nicchia
          testo: |
            La mazza ti manda contro il pannello, e fai appena in tempo a
            rimettere il rotolo nella nicchia. Ti lasciano sulle travi convinti
            che il pilone fosse vuoto.
          vai: ponti-sospesi
      - testo: "Convincerli a contare i soldi altrove"
        descrizione: "Devono credere che il documento non ci fosse."
        prova: { attributo: sociale, abilita: [persuasione, ingannare], difficolta: Difficile }
        successo:
          titolo: La loggia vuota
          testo: |
            Esci a mani vuote, con il rotolo nella giubba, e mostri al capo la
            nicchia piena di polvere. Alla fine se ne vanno. Scendendo trovi su un
            chiodo della loggia un paio di guanti da tiracorde, e li prendi.
          pe: { persuasione: 5, accademiche: 5 }
          effetti: { oggetto.gilda-guanti-delle-tiracorde: 1, reliquie.frammento-inciso: 2, racconto: 1, rep.gilda: 0.5, fazione.gilda: 1 }
          vai: ponti-sospesi
        fallimento:
          titolo: Le tasche
          testo: |
            Ti fanno vuotare le tasche, ma il rotolo l'hai già rimesso nella
            nicchia. Ti lasciano sulle travi con un occhio nero.
          effetti: { ferite: 1 }
          vai: ponti-sospesi
      - testo: "Scendere per le corde vecchie con il documento"
        descrizione: "Dalla camera una feritoia dà sulle corde del 127."
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Difficile }
        successo:
          titolo: Le corde del 127
          testo: |
            Scendi per le corde vecchie con il rotolo nella giubba e la scorta che
            grida sopra di te. A metà discesa trovi su una staffa un paio di
            guanti da tiracorde e li infili, e alla base Ormun ti aspetta con la
            pipa accesa.
          pe: { acrobazia: 5, accademiche: 5 }
          effetti: { oggetto.gilda-guanti-delle-tiracorde: 1, reliquie.frammento-inciso: 2, racconto: 1, rep.gilda: 0.5, fazione.gilda: 1 }
          vai: ponti-sospesi
        fallimento:
          titolo: La corda che brucia
          testo: |
            Una corda si sbriciola sotto le mani, e torni in tempo per rimettere
            il rotolo nella nicchia prima che la scorta ti trovi.
          effetti: { ferite: 1 }
          vai: ponti-sospesi
      - testo: "Scendere per le corde come sulla Cicatrice"
        descrizione: "Sulle piattaforme si scende appesi tutti i giorni."
        quando: [origine.apprendista-raschiatore >= 1]
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Media }
        successo:
          titolo: Come sulla piattaforma
          testo: |
            Scendi con una mano sempre su una corda buona e il rotolo nella
            giubba. A metà discesa trovi su una staffa un paio di guanti da
            tiracorde e li infili, e alla base ti aspetta Ormun.
          pe: { acrobazia: 5, accademiche: 5 }
          effetti: { oggetto.gilda-guanti-delle-tiracorde: 1, reliquie.frammento-inciso: 2, racconto: 1, rep.gilda: 0.5, fazione.gilda: 1 }
          vai: ponti-sospesi
        fallimento:
          titolo: La corda che brucia
          testo: |
            Una corda si sbriciola, e torni in tempo per rimettere il rotolo nella
            nicchia prima che la scorta ti trovi.
          effetti: { ferite: 1 }
          vai: ponti-sospesi
