# Gli oggetti della quest della Gilda dei Mercanti (fazione.gilda). Grado = punti da spendere in dadi e proprietà;
# ogni difetto dà un punto in più (docs/regolamento-oggetti.md). Nessuno ha un prezzo: non si comprano.
#   gilda-gettone-del-socio          grado 1, accessorio. Passo 3, grado I (Socio di corda).
#   gilda-giubba-dei-custodi         grado 2, armatura. Passo 6, grado II (Riscontratore).
#   gilda-lanterna-cieca-di-maedric  grado 1, accessorio con la chiave notte-sui-ponti. Passo 8, la casa appesa.
#   gilda-sigillo-del-portasigillo   grado 2, accessorio con la chiave sigillo-gilda. Passo 9, grado III (Portasigillo).
#   gilda-guanti-delle-tiracorde     grado 2, accessorio con la chiave corde. Passo 11, il pilone.
#   gilda-spada-del-membro-eletto e gilda-balestra-dei-ponti   grado 3, armi. Dopo il passo 12, grado IV (Membro
#                                    eletto): Irsa Valbrun ne fa una, a scelta (servizi.yaml, il pezzo di Irsa).
#   gilda-catena-del-terzo-piano     grado 3, accessorio con la chiave terzo-piano. Passo 15, grado V.
#   gilda-cappa-delle-mille-corde    grado 4, armatura, l'oggetto unico del grado V (Consigliere del terzo piano).
# Le chiavi notte-sui-ponti e corde aprono opzioni ai passi 10, 13 e 14.
oggetti:
  - id: gilda-gettone-del-socio
    nome: Gettone del socio di corda
    immagine: icone/token
    descrizione: "Un disco di bronzo con un nodo inciso da una parte e il tuo nome dall'altra, appeso a un laccio di cera verde. Al banco lo si appoggia prima di parlare, e chi lo vede abbassa il prezzo e il tono."
    slot: accessorio
    grado: 1
    proprieta: { talento: { persuasione: 1 } }

  - id: gilda-giubba-dei-custodi
    nome: Giubba dei Custodi di Passaggio
    immagine: icone/leather-armor
    descrizione: "Cuoio della Conceria Kasselt con le spalle imbottite, cucito per stare in piedi tutta la notte su un ponte bagnato. Le fibbie sono fasciate di stoffa perché non battano."
    slot: armatura
    base: cuoio-rinforzato
    grado: 2
    dadi: 1
    proprieta: { silenziosa: true }

  - id: gilda-lanterna-cieca-di-maedric
    nome: Lanterna cieca di Maedric
    immagine: icone/old-lantern
    descrizione: "Una lanterna di latta con lo sportello che si chiude a scatto e una fessura sola, larga un dito. Maedric Holl la usava per leggere i suoi libri sotto le assi senza farsi vedere da sopra."
    slot: accessorio
    grado: 1
    proprieta: { talento: { furtivita: 1 }, chiave: [notte-sui-ponti] }

  - id: gilda-sigillo-del-portasigillo
    nome: Sigillo del portasigillo
    immagine: icone/stamper
    descrizione: "Il timbro della Gilda su un manico d'ottone, con la custodia di cuoio che si aggancia alla cintura. Ogni carico che tocca diventa un carico in regola, e ogni uomo che lo vede si ricorda chi lo porta."
    slot: accessorio
    grado: 2
    proprieta: { talento: { politica-ed-economia: 1, galateo: 1 }, chiave: [sigillo-gilda] }

  - id: gilda-guanti-delle-tiracorde
    nome: Guanti delle tiracorde
    immagine: icone/gloves
    descrizione: "Guanti di pelle di capra con il palmo rinforzato da un intreccio di corda, trovati nella loggia del pilone bruciato. Li cucivano le tiracorde prima del Patto, e tengono ancora la presa."
    slot: accessorio
    grado: 2
    proprieta: { talento: { acrobazia: 1, atletica: 1 }, chiave: [corde] }

  - id: gilda-spada-del-membro-eletto
    nome: Spada del membro eletto
    immagine: icone/broadsword
    descrizione: "Una spada lunga di acciaio di Bram Halgast, bilanciata da Irsa Valbrun sul tuo braccio. Sul forte della lama c'è inciso un nodo, e l'elsa è fasciata del cuoio verde dei soci."
    slot: arma
    base: spada-lunga
    grado: 3
    dadi: 1
    proprieta: { affilata: 1, rapida: 1 }

  - id: gilda-balestra-dei-ponti
    nome: Balestra dei ponti
    immagine: icone/crossbow
    descrizione: "Una balestra pesante con il caricatore a leva dei Custodi di Passaggio, rifatta da Irsa Valbrun. Tira dritto anche con il vento della Cicatrice, e sul calcio c'è inciso un nodo."
    slot: arma
    base: balestra-pesante
    grado: 3
    dadi: 1
    proprieta: { caricatore: true, affilata: 1 }

  - id: gilda-catena-del-terzo-piano
    nome: Catena del terzo piano
    immagine: icone/gem-chain
    descrizione: "Una catena d'argento a maglie piatte, con un nodo d'oro al posto del fermaglio. La portano al collo i consiglieri della Gilda, e la porta della sala del terzo piano si apre soltanto a chi ce l'ha."
    slot: accessorio
    grado: 3
    proprieta: { talento: { galateo: 1, persuasione: 1, intimidire: 1 }, chiave: [terzo-piano] }

  - id: gilda-cappa-delle-mille-corde
    nome: Cappa delle mille corde
    immagine: icone/cape
    descrizione: "Una cappa di cuoio scuro foderata con l'intreccio delle funi del Patto, quelle che i tiracorde annodarono nel 118, rinforzato con filo d'acciaio. Ferma una lama come una cotta e non fa rumore, e in città la riconoscono tutti."
    slot: armatura
    base: cuoio-rinforzato
    grado: 4
    dadi: 2
    proprieta: { robusta: 1, silenziosa: true }
    difetti: [riconoscibile]
