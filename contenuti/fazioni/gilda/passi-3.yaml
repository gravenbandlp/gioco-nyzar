# La quest della Gilda, passi 11-15 (fazione.gilda 10 → 15). Vedi quest.yaml per le quality.
# 11 I monconi del Ventisette (10 → 11): Lira ha tre versioni dell'incendio del 127 e manca l'unica firmata. Clelia
#   Vennari sa che suo nonno la nascose nella loggia del pilone bruciato. Spedizione spedizione-monconi.yaml (con
#   chiatta.posto Ilde ti porta sulla Mula e si salta la prima fascia).
# 12 L'assemblea dei soci (11 → 12): l'elezione a membro eletto (più facile con gilda.voti >= 4, senza prova nella via
#   venduta), poi il documento del 127 a una delle quattro mani (seguito, gilda.127). Grado IV.
# 13 I voti delle botteghe (12 → 13): tre visite fra sei, una per bottega o famiglia (gilda.giro e gilda.giro-*),
#   ognuna vale un voto; le reputazioni e le storie della città aprono le vie senza prova. Poi la sera Ormun Pell ti
#   ferma alle Mille Corde (gilda.giro >= 3): qualcuno ha toccato le corde.
# 14 La notte prima del voto (13 → 14): boss Ugo Bracco e i suoi chiattaioli sulla campata centrale delle Mille Corde.
#   Combattimento, reggere il ponte fino all'alba (due prove Difficili), staccare i chiattaioli dal padrone, la
#   lanterna cieca; nella via venduta si può lasciar fare. Fallire costa Ferite e due voti. Il seguito decide di
#   Bracco (gilda.bracco).
# 15 Il terzo piano (14 → 15): il voto con i nodi e il discorso, Difficile, Media con cinque voti, Facile con otto.
#   Vince Tarquin (gilda.esito 1), Irsa se Tarquin ha pubblicato il 127 (2), Morlacchi se il discorso fallisce o
#   nella via venduta (3). Il seguito dà il grado V in ogni caso.
# La coda `gilda-il-seggio-dei-malgrani` si apre dopo il passo 15 se il Consiglio ha dato il seggio dei Malgrani alla
# Gilda (seggio.malgrani == 2).
storylet:
  # ------------------------------------------------------------ passo 11 · le tre versioni (la spedizione è in spedizione-monconi.yaml)
  - id: gilda-le-tre-versioni
    presso: gilda-casa-dei-nodi
    immagine: personaggi/lira-demos
    titolo: Le tre versioni del Ventisette
    sommario: "Lira ha tre versioni dell'incendio dei ponti del 127, e Clelia Vennari sa dov'è la quarta, quella che manca."
    luogo: Casa dei Nodi, l'archivio dei dazi
    area: quartieri-alti
    requisiti: [fazione.gilda == 10]
    testo: |
      Sul tavolo dell'archivio Lira ha messo tre fascicoli legati con il
      nastro rosso, le tre versioni della notte del 127 in cui tre ponti
      presero fuoco insieme. Ogni famiglia del Patto ne depositò una alla
      Casa, e ognuna accusa le altre due.

      «Ne esisteva una quarta, quella firmata» dice Lira, indicandoti una
      riga vuota nel registro. «Il Velo la chiese dopo la settima notte, e
      qualcuno la portò via prima che arrivasse in Cattedrale.»

      Accanto alla finestra siede Clelia Vennari, ultima di una famiglia del
      Patto, con una scatola di latta in grembo. Suo nonno, che era
      tiracorde, diceva che la verità sui ponti stava nella loggia del
      pilone di ponente, dove nessuno sale più.

      {origine rampollo-dei-quartieri-alti} Clelia ti riconosce dal cognome
      e ti fa un cenno con il mento.

      Lira aggiunge che Morlacchi lo sa, e che stamattina ha mandato la sua
      scorta verso i monconi.
    opzioni:
      - testo: "Andare ai piloni con Ormun"
        descrizione: "Ormun Pell conosce i piloni bruciati, e le corde vecchie le ha toccate da giovane."
        esito:
          titolo: I monconi
          testo: |
            Ormun ti aspetta all'imbocco delle Mille Corde con una fune sulla
            spalla. «Ai monconi ci sono saliti in pochi, e scesi in meno» dice, e
            ti porta alla base del pilone di ponente, dove il ferro nero del 127
            esce dalla roccia come un dente rotto.
          vai: gilda-monconi-del-ventisette
      - testo: "Farti portare da Ilde sulla Mula"
        descrizione: "Dal cavo della Mula, la chiatta di Ilde, il pilone si raggiunge di lato saltando la salita."
        requisiti: [chiatta.posto >= 1]
        esito:
          titolo: La Mula
          testo: |
            Ilde Sarrocchi ti porta sulla Mula lungo il cavo fin sotto il pilone
            di ponente e accosta a una scala di ferro che dalla riva non si vede.
            «Socio, qui ti lascio» dice, con la liquirizia fra i denti.
          effetti: { profondita.gilda-monconi-del-ventisette: 1 }
          vai: gilda-monconi-del-ventisette
      - testo: "Convincere Clelia a dirti di più"
        descrizione: "Una vecchia signora dei Ponti racconta tutto, se la si tratta come merita."
        prova: { attributo: sociale, abilita: [galateo, empatia], difficolta: Media }
        successo:
          titolo: La scatola di latta
          testo: |
            Quando la chiami donna Clelia, come si faceva una volta, lei apre la
            scatola di latta. Dentro c'è un sigillo da ceralacca con il manico
            d'osso e un foglio ingiallito con il disegno di una loggia e di una
            porta di metallo senza serratura. «Mio nonno la chiamava la stanza dei
            Precursori» dice. «Diceva che si apre con le mani giuste.» Il foglio
            te lo lascia.
          pe: { galateo: 3 }
          effetti: { informazioni.pettegolezzo: 1 }
          vai: gilda-monconi-del-ventisette
        fallimento:
          titolo: La scatola chiusa
          testo: |
            Clelia chiude la scatola di latta con uno scatto. «Mio nonno diceva
            che chi corre sui ponti ci muore» dice. Esci senza il disegno, e ai
            piloni ci vai con Ormun, che ti aspetta all'imbocco delle Mille Corde.
          vai: gilda-monconi-del-ventisette
          effetti: { scandalo: 0.5 }

  # ------------------------------------------------------------ passo 12 · l'assemblea dei soci
  - id: gilda-l-assemblea-dei-soci
    presso: gilda-casa-dei-nodi
    immagine: fazioni/gilda-dei-mercanti
    titolo: L'assemblea dei soci
    sommario: "L'assemblea dei soci elegge i membri del nuovo anno, e il tuo nome è nella lista."
    luogo: Casa dei Nodi, la sala dei soci
    area: quartieri-alti
    requisiti: [fazione.gilda == 11]
    testo: |
      La sala dei soci è piena fino alle finestre. I membri eletti siedono sulle panche davanti e gli
      altri soci stanno in piedi dietro. Si vota per alzata di mano, un nome alla volta, e il tuo è il
      settimo della lista.

      In prima fila, accanto a Cordani, siede Ottilia Sanvel. È una monaca bassa e robusta che la
      Madre del Velo, garante del Patto, ha mandato a vedere con i suoi occhi. Morlacchi siede
      dall'altra parte della sala con i guanti in grembo, e conta le mani alzate prima del
      cancelliere.

      Il documento del 127 è nella tua giubba, e gli angoli della carta ti pungono la pelle quando ti
      muovi.
    opzioni:
      - testo: "Parlare all'assemblea"
        descrizione: "Due frasi giuste, e le mani si alzano o restano in tasca."
        requisiti: [gilda.voti < 4]
        prova: { attributo: sociale, abilita: [galateo, persuasione], difficolta: Media }
        successo:
          titolo: Le mani alzate
          testo: |
            Dici chi sei e ringrazi il padrino, e le mani si alzano una dopo
            l'altra dal fondo della sala. Sei membro eletto, e alla fine della
            seduta Cordani ti fa cenno di salire al terzo piano.
          pe: { galateo: 5 }
          segue: gilda-il-documento-del-127
        fallimento:
          titolo: Per tre mani
          testo: |
            Parli troppo, e in fondo qualcuno sbadiglia forte. Il cancelliere
            conta le mani due volte e sei eletto per tre voti, mentre Morlacchi ti
            sorride dall'altra parte della sala. Cordani ti fa cenno di salire al
            terzo piano.
          effetti: { scandalo: 1 }
          segue: gilda-il-documento-del-127
      - testo: "Parlare all'assemblea con i tuoi voti in sala"
        descrizione: "I soci che voteranno come chiedi tu alzeranno la mano per primi, e gli altri li seguiranno."
        requisiti: [gilda.voti >= 4]
        prova: { attributo: sociale, abilita: [galateo, persuasione], difficolta: Facile }
        successo:
          titolo: Le mani alzate
          testo: |
            I tuoi alzano la mano prima che tu finisca la seconda frase, e la sala
            li segue senza bisogno di contare. Sei membro eletto, e alla fine
            della seduta Cordani ti fa cenno di salire al terzo piano.
          pe: { galateo: 3 }
          segue: gilda-il-documento-del-127
        fallimento:
          titolo: Le mani lente
          testo: |
            Ti si annoda la lingua sulla seconda frase, ma i tuoi alzano la mano
            lo stesso e la sala li segue. Sei eletto, e qualcuno ride del tuo
            inciampo; Cordani ti fa cenno di salire al terzo piano.
          effetti: { scandalo: 1 }
          segue: gilda-il-documento-del-127
      - testo: "Lasciare che votino gli uomini di Morlacchi"
        descrizione: "I soci dei magazzini alzano la mano quando la alza Morlacchi."
        requisiti: [gilda.via == 3]
        esito:
          titolo: La mano di Morlacchi
          testo: |
            Dietro la mano di Morlacchi si alza mezza sala, e sei membro eletto.
            Ottilia Sanvel scrive qualcosa su un taccuino, e Cordani ti fa cenno
            di salire al terzo piano senza guardarti.
          segue: gilda-il-documento-del-127

  - id: gilda-il-documento-del-127
    presso: gilda-casa-dei-nodi
    immagine: icone/tied-scroll
    titolo: Quattro mani
    tipo: seguito
    luogo: Casa dei Nodi, la sala del terzo piano
    area: quartieri-alti
    requisiti: [fazione.gilda == 11]
    testo: |
      Al terzo piano Cordani chiude le due porte, e per la prima volta le
      sue mani non stanno ferme sul tavolo. Ti chiede il documento del 127,
      senza dirti che cosa ne farà. Nel corridoio aspetta Ottilia Sanvel,
      che lo vuole in Cattedrale, e Morlacchi ti ha fatto sapere che il suo
      prezzo è quello di sempre.

      Il documento porta i sigilli delle tre famiglie del Patto, e il primo
      è quello di Hakkos Cordani, il nonno di Tarquin. Le famiglie
      bruciarono insieme i tre ponti per raddoppiare i pedaggi e
      ricostruirli con il denaro della Gilda, e le bande in livrea che si
      ammazzarono nei vicoli per sette notti non lo seppero mai.

      {empatia Difficile} Sa già che cosa c'è scritto, lo leggi nella fronte
      che non si muove. Lo sapeva prima di te, o lo temeva da sempre.
    opzioni:
      - testo: "Darlo a Tarquin Cordani"
        descrizione: "È il nome di suo nonno, e decide lui che cosa farne giocandosi la rielezione."
        immagine: fazioni/gilda-dei-mercanti
        esito:
          titolo: Il sigillo del nonno
          testo: |
            Cordani lo legge in piedi e si siede al sigillo di suo nonno. «Lo
            pubblico domani» dice. «Una Gilda che non sa chi ha bruciato i suoi
            ponti non merita di riscuoterne i pedaggi.» Da domani sei membro
            eletto, con la firma sulle lettere di presentazione, un letto alla
            foresteria della Casa e un'armaiola che vuole vederti.
          almeno: { rep.gilda: 8 }
          imposta: { gilda.127: 1 }
          effetti: { monete: 40, rep.velo: 0.5, fazione.gilda: 1 }
      - testo: "Darlo a Ottilia Sanvel per il Velo"
        descrizione: "Ottilia lo prende solo se la convinci che in Cattedrale serve più che qui."
        immagine: personaggi/ottilia-sanvel
        prova: { attributo: sociale, abilita: [galateo, persuasione], difficolta: Media }
        successo:
          titolo: In Cattedrale
          testo: |
            Ottilia prende il documento con due mani. «Lo custodirà la Madre»
            dice. «La Gilda saprà che esiste, e questo basta a tenerla buona.»
            Cordani ti guarda dalla soglia con le mani di nuovo ferme. Da domani
            sei membro eletto, con un letto alla foresteria e un'armaiola che
            vuole vederti.
          pe: { galateo: 3 }
          almeno: { rep.gilda: 8 }
          imposta: { gilda.127: 2 }
          effetti: { monete: 40, rep.velo: 1, gilda.voti: 1, fazione.gilda: 1 }
        fallimento:
          titolo: Un rimprovero
          testo: |
            Ottilia prende il documento, ma ti fa notare con calma che consegnare
            i segreti della propria Casa in un corridoio non è un buon esempio. Da
            domani sei membro eletto, con un letto alla foresteria e un'armaiola
            che vuole vederti.
          almeno: { rep.gilda: 8 }
          imposta: { gilda.127: 2 }
          effetti: { monete: 40, rep.velo: 0.5, fazione.gilda: 1, scandalo: 0.5 }
      - testo: "Venderlo a Morlacchi"
        descrizione: "Una corda al collo dei Cordani a pochi giorni dal voto, al prezzo di sempre."
        immagine: icone/hooded-figure
        esito:
          titolo: La corda
          testo: |
            Nell'ufficio sopra il magazzino Morlacchi sorride al sigillo dei
            Cordani come a un vecchio amico e ti conta la borsa sulle dita. Da
            domani sei membro eletto, con un letto alla foresteria della Casa, e
            Ottilia Sanvel, quando lo saprà, scriverà alla Madre.
          almeno: { rep.gilda: 8 }
          imposta: { gilda.127: 3 }
          effetti: { monete: 120, rep.velo: -1, fazione.gilda: 1 }
      - testo: "Tenerlo per te, nascosto"
        descrizione: "Nessuna delle quattro mani, e un segreto nascosto in casa tua per sempre."
        esito:
          titolo: Sotto l'asse
          testo: |
            Dici a Cordani che nella loggia hai trovato soltanto polvere, e lui
            non insiste. La sera nascondi il documento sotto un'asse di casa tua e
            dormi male. Da domani sei membro eletto, con un letto alla foresteria
            e un'armaiola che vuole vederti.
          almeno: { rep.gilda: 8 }
          imposta: { gilda.127: 4 }
          effetti: { monete: 40, informazioni.segreto: 1, fazione.gilda: 1 }
      - testo: "Portarlo a Ottilia come un fratello del Velo"
        descrizione: "Ottilia ti ha visto novizio e conosce il gesto di chi porge una cosa con due mani."
        quando: [origine.accolito-del-velo >= 1]
        esito:
          titolo: Con due mani
          testo: |
            Glielo porgi con due mani, come si porgono le cose sull'altare, e
            Ottilia lo prende guardandoti come all'alba, quando correggeva le
            letture dei novizi. «La Madre lo custodirà» dice. Da domani sei membro
            eletto, con un letto alla foresteria e un'armaiola che vuole vederti.
          pe: { galateo: 3 }
          almeno: { rep.gilda: 8 }
          imposta: { gilda.127: 2 }
          effetti: { monete: 40, rep.velo: 1, gilda.voti: 1, fazione.gilda: 1 }

  # ------------------------------------------------------------ passo 13 · i voti delle botteghe
  - id: gilda-i-voti-delle-botteghe
    presso: gilda-casa-dei-nodi
    immagine: icone/vote
    titolo: I voti delle botteghe
    sommario: "Si elegge il Sovrintendente, e Morlacchi compra i voti e fa girare una calunnia."
    luogo: Casa dei Nodi, la lista dei soci
    area: quartieri-alti
    requisiti: [fazione.gilda == 12, gilda.giro < 3]
    testo: |
      Nella sala dei soci il cancelliere nuovo ha appeso la lista dei
      votanti, tre fogli fitti di nomi e di mestieri, per il voto con i nodi
      di fra pochi giorni. Morlacchi intanto compra voti con le borse di
      velluto senza nasconderlo. Nei salotti dei Quartieri Alti fa girare la
      voce che il Sovrintendente divide il letto con un teatrante e che una
      Gilda guidata così non sa più tenere i conti.

      {politica-ed-economia Media} Le botteghe votano con Irsa, l'approdo
      vota con chi difende le funi, le vecchie famiglie con chi ricorda i
      loro nomi. Hai il tempo di tre visite, forse quattro.

      Cordani non fa campagna, e quando passa nella sala con la camicia
      bianca la gente lo guarda come un uomo che ha già perso.
    opzioni:
      - testo: "Fare il giro delle botteghe con Irsa"
        descrizione: "Le botteghe votano con Irsa, e vogliono sapere che cosa farà la Casa con i loro dazi."
        immagine: personaggi/irsa-valbrun
        quando: [gilda.giro-botteghe == 0]
        prova: { attributo: mentale, abilita: politica-ed-economia, difficolta: Media }
        successo:
          titolo: I dazi delle botteghe
          testo: |
            Giri le botteghe con Irsa parlando di dazi con i conti in mano, e
            spieghi quanto pesano sulle gabelle i noli fantasma dei magazzini. A
            sera Irsa ti dice che le botteghe voteranno con te, guardandoti le
            mani come la prima volta.
          pe: { politica-ed-economia: 3 }
          effetti: { gilda.giro: 1, gilda.giro-botteghe: 1, gilda.voti: 1, rep.gilda: 0.5, rep.botteghe: 0.5 }
        fallimento:
          titolo: I conti sbagliati
          testo: |
            Alla bottega del cuoiaio sbagli un conto davanti a tutti, e il cuoiaio
            te lo corregge con il gesso sul bancone. Uscendo, Irsa ti dice che le
            botteghe voteranno come pensano, e che oggi pensano poco di te.
          effetti: { gilda.giro: 1, gilda.giro-botteghe: 1, scandalo: 0.5 }
      - testo: "Fare il giro delle botteghe con Irsa, da amico"
        descrizione: "Bram Halgast e Irsa ti conoscono, e alle botteghe basta vederti con lei."
        immagine: personaggi/irsa-valbrun
        quando: [gilda.giro-botteghe == 0]
        requisiti: [rep.botteghe >= 5]
        esito:
          titolo: Un amico delle botteghe
          testo: |
            In ogni bottega qualcuno ti saluta per nome prima che Irsa ti
            presenti, e alla Fucina Bram alza il bicchiere al Sovrintendente. Le
            botteghe voteranno con te senza bisogno di parlare di dazi.
          effetti: { gilda.giro: 1, gilda.giro-botteghe: 1, gilda.voti: 1, rep.gilda: 0.5, rep.botteghe: 0.5 }
      - testo: "Andare all'approdo delle chiatte"
        descrizione: "I chiattaioli piccoli votano contro chi taglia le funi, e devono credere che non sei tu."
        quando: [gilda.giro-approdo == 0]
        prova: { attributo: sociale, abilita: persuasione, difficolta: Media }
        successo:
          titolo: Le funi
          testo: |
            Seduto su un rotolo di fune, prometti ai chiattaioli piccoli che Ormun
            farà controllare i cavi ogni mese e che chi sega una fune risponderà
            alla Caserma. Ti ascoltano masticando, finché uno sputa nella
            Cicatrice e dice che l'approdo voterà con te.
          pe: { persuasione: 3 }
          effetti: { gilda.giro: 1, gilda.giro-approdo: 1, gilda.voti: 1, rep.gilda: 0.5, rep.ponti: 0.5 }
        fallimento:
          titolo: Le promesse della Casa
          testo: |
            Un chiattaiolo vecchio ride delle tue promesse sui cavi, che la Casa
            ha fatto tante volte mentre le funi si segavano lo stesso. Te ne vai
            con le scarpe bagnate e nessun voto.
          effetti: { gilda.giro: 1, gilda.giro-approdo: 1, scandalo: 0.5 }
      - testo: "Andare all'approdo con il nome di Ugo Bracco"
        descrizione: "Sai chi ha segato la fune della Mula, e all'approdo basta dirlo nel modo giusto."
        quando: [gilda.giro-approdo == 0]
        requisiti: [chiatta.colpevole == 1]
        esito:
          titolo: Il nome
          testo: |
            Dici ad alta voce chi ha segato la fune della Mula. I chiattaioli
            piccoli guardano le chiatte grandi di Bracco ormeggiate in fondo, poi
            Ilde ti batte una mano sulla spalla e ti chiama socio, e l'approdo
            vota con te.
          effetti: { gilda.giro: 1, gilda.giro-approdo: 1, gilda.voti: 1, rep.gilda: 0.5, rep.ponti: 0.5 }
      - testo: "Fare visita alle vecchie famiglie del Patto"
        descrizione: "Le famiglie dei tiracorde hanno ancora un voto ciascuna, e vogliono essere ricordate prima che votate."
        quando: [gilda.giro-famiglie == 0]
        prova: { attributo: sociale, abilita: galateo, difficolta: Media }
        successo:
          titolo: I nomi ricordati
          testo: |
            Visiti le vecchie famiglie una per una, nei salotti con i ritratti dei
            nonni che firmarono con un nodo, ricordando in ogni casa il nome
            giusto. Clelia Vennari, che ti ha accompagnato, ti dice che le
            famiglie del Patto voteranno con te.
          pe: { galateo: 3 }
          effetti: { gilda.giro: 1, gilda.giro-famiglie: 1, gilda.voti: 1, rep.gilda: 0.5 }
        fallimento:
          titolo: Il nonno sbagliato
          testo: |
            Nella seconda casa scambi il nonno con lo zio, e la voce gira, così
            nelle case dopo ti accolgono con la porta socchiusa. Le famiglie del
            Patto voteranno come vogliono.
          effetti: { gilda.giro: 1, gilda.giro-famiglie: 1, scandalo: 0.5 }
      - testo: "Fare visita alle famiglie con Berengario Lusardi"
        descrizione: "Lusardi ti deve qualcosa, e le vecchie famiglie a Lusardi aprono la porta."
        quando: [gilda.giro-famiglie == 0]
        requisiti: [lusardi.passo >= 3]
        esito:
          titolo: La redingote
          testo: |
            Berengario Lusardi ti accompagna con la redingote buona ed entra per
            primo in ogni casa, con il cappello in mano, e le famiglie del Patto
            votano con te.
          effetti: { gilda.giro: 1, gilda.giro-famiglie: 1, gilda.voti: 1, rep.gilda: 0.5 }
      - testo: "Corteggiare la sedia dei Tarvelin"
        descrizione: "Ondrel Tarvelin parla poco e pesa molto, e con il suo voto viene quello dell'Acciaieria."
        immagine: personaggi/ondrel-tarvelin
        quando: [gilda.giro-tarvelin == 0]
        requisiti: [pista.acciaio < 4]
        prova: { attributo: sociale, abilita: galateo, difficolta: Difficile }
        successo:
          titolo: Il voto dell'Acciaieria
          testo: |
            Ondrel ti riceve in piedi in un ufficio pieno di fumo e ti ascolta
            senza una parola. Alla fine annuisce. «I Tarvelin votano per chi tiene
            i conti in ordine» dice, e con lui voterà l'Acciaieria.
          pe: { galateo: 5 }
          effetti: { gilda.giro: 1, gilda.giro-tarvelin: 1, gilda.voti: 1, rep.gilda: 0.5, rep.tarvelin: 0.5 }
        fallimento:
          titolo: Il fumo
          testo: |
            Ondrel ti congeda con un cenno senza aver detto una parola, e te ne
            vai con il fumo nei vestiti e la sensazione di aver parlato a un muro
            di ghisa.
          effetti: { gilda.giro: 1, gilda.giro-tarvelin: 1, scandalo: 0.5 }
      - testo: "Chiedere il voto dell'Acciaieria"
        descrizione: "L'Acciaieria adesso è di chi ci lavora, o di Liaren con Irsa come socia. Votano con Irsa."
        quando: [gilda.giro-tarvelin == 0]
        requisiti: [pista.acciaio >= 4, acciaieria.futuro >= 2]
        esito:
          titolo: L'Acciaieria riaccesa
          testo: |
            All'Acciaieria ti ascoltano nel cortile fra le colate, con le maniche
            arrotolate, e votano con Irsa, che vota con te. Il capoturno ti
            stringe la mano con una mano che scotta.
          effetti: { gilda.giro: 1, gilda.giro-tarvelin: 1, gilda.voti: 1, rep.gilda: 0.5 }
      - testo: "Chiedere il voto dell'Acciaieria"
        descrizione: "L'Acciaieria l'ha comprata la Gilda, cioè i magazzini. Chi la amministra vota come gli dice Morlacchi."
        quando: [gilda.giro-tarvelin == 0]
        requisiti: [pista.acciaio >= 4, acciaieria.futuro == 1]
        esito:
          titolo: L'amministratore
          testo: |
            L'amministratore dell'Acciaieria ti offre un bicchiere di vino di
            Laresh e ti spiega che i proprietari, cioè i magazzini di scarico,
            hanno già deciso. Bevi il vino e te ne vai.
          effetti: { gilda.giro: 1, gilda.giro-tarvelin: 1 }
      - testo: "Andare nel salotto di Isotta Cordani"
        descrizione: "La calunnia di Morlacchi gira nei salotti, e in quello di Isotta la si può fermare."
        quando: [gilda.giro-salotto == 0]
        prova: { attributo: sociale, abilita: [espressivita, empatia], difficolta: Media }
        successo:
          titolo: Il ventaglio
          testo: |
            Nel salotto di Isotta Cordani racconti del levriero di famiglia che
            ruba i guanti alle signore, e la sala ride. Quando qualcuno nomina il
            teatrante dici che a teatro ci va mezza città, e da quella sera la
            calunnia gira meno.
          pe: { espressivita: 3 }
          effetti: { gilda.giro: 1, gilda.giro-salotto: 1, gilda.voti: 1, rep.gilda: 0.5 }
        fallimento:
          titolo: Il ventaglio aperto
          testo: |
            Difendi il Sovrintendente troppo, e una signora con il ventaglio ti
            chiede perché ci tieni tanto. Da quella sera la calunnia gira con un
            pezzo in più.
          effetti: { gilda.giro: 1, gilda.giro-salotto: 1, scandalo: 1 }
      - testo: "Portare Orazio Belcanto nel salotto di Isotta"
        descrizione: "Al Teatro ti devono qualcosa, e il teatrante della calunnia, se parla lui, ne fa uno spettacolo."
        quando: [gilda.giro-salotto == 0]
        requisiti: [rep.teatro >= 4]
        esito:
          immagine: personaggi/orazio-belcanto
          titolo: Il teatrante
          testo: |
            Orazio Belcanto, con un anello a ogni dito, recita nel salotto di
            Isotta la calunnia di Morlacchi come una commedia, finché la sala ride
            fino alle lacrime. Da quella sera nessuno ripete più la storia senza
            sentirsi ridicolo.
          effetti: { gilda.giro: 1, gilda.giro-salotto: 1, gilda.voti: 1, rep.gilda: 0.5, rep.teatro: 0.5 }
      - testo: "Chiedere il voto a Corin Ashdale"
        descrizione: "Corin vota come gli chiedi tu, e lo trovi al Grifone, a sera."
        immagine: personaggi/corin-ashdale
        quando: [gilda.giro-corin == 0]
        requisiti: [pista.corin < 6]
        costo: 2
        esito:
          titolo: Al Grifone
          testo: |
            Trovi Corin al Grifone a mezzanotte, mentre offre da bere a dei
            Raschiatori che non conosce. Ti promette il suo voto prima ancora che
            tu lo chieda, poi di nuovo, più forte, perché lo sentano tutti.
          effetti: { gilda.giro: 1, gilda.giro-corin: 1, gilda.voti: 1, rep.gilda: 0.5 }
      - testo: "Scrivere a Corin Ashdale"
        descrizione: "Corin è lontano, ma il suo voto vale anche per lettera."
        immagine: personaggi/corin-ashdale
        quando: [gilda.giro-corin == 0]
        requisiti: [pista.corin >= 6]
        costo: 2
        esito:
          titolo: Per lettera
          testo: |
            La risposta alla tua lettera arriva in tre giorni con un corriere di
            Laresh, su una carta che sa di fieno. Corin scrive che vota con te, e
            in fondo alla lettera ha disegnato un cavallo, piuttosto male.
          effetti: { gilda.giro: 1, gilda.giro-corin: 1, gilda.voti: 1, rep.gilda: 0.5 }
      - testo: "Visitare le vecchie famiglie come uno di loro"
        descrizione: "Tu nei salotti delle vecchie famiglie ci sei cresciuto. Sai quale nonno nominare in ogni casa."
        quando: [gilda.giro-famiglie == 0, origine.rampollo-dei-quartieri-alti >= 1]
        esito:
          titolo: A casa
          testo: |
            Visiti le vecchie famiglie come da bambino gli amici di tuo padre,
            nominando in ogni casa il nonno giusto con il tono giusto, e ti
            offrono il tè nelle tazze buone. Le famiglie del Patto voteranno con
            te.
          pe: { galateo: 3 }
          effetti: { gilda.giro: 1, gilda.giro-famiglie: 1, gilda.voti: 1, rep.gilda: 0.5 }

  - id: gilda-le-corde-toccate
    presso: ponte-delle-mille-corde
    immagine: ambientazione/ponti-sospesi
    titolo: Le corde toccate
    sommario: "Sulle Mille Corde Ormun Pell ti ferma, perché qualcuno ha toccato le corde della campata centrale."
    luogo: Ponte delle Mille Corde, la sera
    area: ponti-sospesi
    requisiti: [fazione.gilda == 12, gilda.giro >= 3]
    testo: |
      La sera, a due giorni dal voto, torni alla Casa dei Nodi passando
      dalle Mille Corde con la testa piena di nomi, e a metà della campata
      centrale Ormun Pell ti sbarra la strada con un braccio, la lanterna in
      mano e la barba piena di segatura.

      «Qualcuno ha toccato le corde» dice, e ti porta al parapetto. Sotto
      l'impalcato le funi portanti, grosse come cosce, corrono verso il
      pilone. Su una, a due braccia dal parapetto, c'è un segno di gesso.
      «Questo non l'ho fatto io. E io segno tutto.»

      {origine apprendista-raschiatore} Leggi la corda come quelle della
      piattaforma a fine turno, e intorno al segno la fibra è pettinata,
      dove qualcuno l'ha già provata con la lama.
    opzioni:
      - testo: "Guardare la fune da vicino"
        descrizione: "Sporgendosi dal parapetto, con Ormun che ti tiene per la cintura."
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Media }
        successo:
          titolo: La lama provata
          testo: |
            Ti sporgi con Ormun che ti tiene per la cintura e vedi la fibra
            pettinata dove qualcuno ha provato la lama, con segni uguali su altre
            due funi della campata. Ormun bestemmia a lungo, in nanico.
          pe: { tecnologia: 3 }
          effetti: { rep.gilda: 0.5, fazione.gilda: 1 }
        fallimento:
          titolo: Il gesso
          testo: |
            Ti sporgi e la lanterna ti scivola nella Cicatrice. Ormun ti tira su
            per la cintura e ti dice che ha trovato altri due segni sulle funi che
            portano la campata. Poi ti chiede chi gli ripaga la lanterna.
          effetti: { rep.ponti: -0.5, fazione.gilda: 1, tormento: 0.5 }
      - testo: "Chiedere a Ormun chi può essere stato"
        descrizione: "Ormun chiude un occhio su tante cose, ma su questa forse ne apre due."
        prova: { attributo: sociale, abilita: [conoscenze-della-strada, empatia], difficolta: Media }
        successo:
          titolo: Il segaccio
          testo: |
            Ormun ci pensa con la pipa spenta in bocca. «Un segno così lo fanno i
            chiattaioli delle chiatte grandi» dice. «Quelli di Bracco, come con la
            Mula.» Ti lascia la lanterna e va a svegliare la sua squadra.
          pe: { conoscenze-della-strada: 3 }
          effetti: { rep.gilda: 0.5, fazione.gilda: 1 }
        fallimento:
          titolo: Un occhio chiuso
          testo: |
            Ormun ti risponde che sui ponti ognuno guarda le sue corde, e se ne va
            lasciandoti la lanterna perché stanotte la campata la guardi tu.
          effetti: { tormento: 1, fazione.gilda: 1 }
      - testo: "Andare a chiamare Varn"
        descrizione: "A quest'ora Varn va cercato, e lui scrive tutto senza sbagliare una riga."
        costo: 2
        esito:
          titolo: La notte di Varn
          testo: |
            Varn viene sul ponte in camicia da notte e stivali da pioggia e scrive
            sull'aria a lungo. Poi ti dice che le funi segnate sono tre e che le
            chiatte grandi di Bracco sono ormeggiate sotto la campata da due
            giorni.
          effetti: { rep.gilda: 0.5, fazione.gilda: 1 }

  # ------------------------------------------------------------ passo 14 · la notte prima del voto
  - id: gilda-la-notte-prima-del-voto
    presso: ponte-delle-mille-corde
    immagine: ambientazione/ponti-sospesi
    titolo: La notte prima del voto
    sommario: "La notte prima del voto Ugo Bracco e i suoi chiattaioli segano le funi della campata centrale."
    luogo: Ponte delle Mille Corde, la notte prima del voto
    area: ponti-sospesi
    requisiti: [fazione.gilda == 13]
    testo: |
      Dopo la seconda campana la campata centrale delle Mille Corde è vuota,
      e la nebbia della Cicatrice sale fino al parapetto. Sotto l'impalcato,
      appesi alle funi portanti, ci sono quattro uomini, e il più grosso,
      largo come una porta e con una sbarra d'argano alla cintura, è Ugo
      Bracco, che sega la prima fune a metà con la calma che ha usato per la
      fune della Mula.

      Se nessuno interviene, all'alba la campata cederà sotto il primo carro
      del mercato, e i soci andranno a votare con il crollo negli occhi.

      {armi-da-mischia Media} Bracco sta appeso con una mano e sega con
      l'altra. I suoi uomini hanno ganci da carico, e sono più lenti.

      Dietro di te, nella nebbia, arrivano i ponteggiatori di Ormun con le
      funi sulle spalle.
    opzioni:
      - testo: "Scendere sulle funi e affrontare Bracco"
        descrizione: "Bracco e due chiattaioli appesi sotto il ponte, ed è il modo più breve e più duro."
        combattimento: gilda-la-notte-prima-del-voto
        vittoria:
          titolo: La sbarra d'argano
          testo: |
            Li affronti appesi sopra il vuoto. Il primo chiattaiolo si salva su
            una fune di servizio e il secondo scappa verso il pilone, e alla fine
            è Bracco a restare appeso con una mano sola, il segaccio perduto nella
            Cicatrice.
          pe: { armi-da-mischia: 5 }
          segue: gilda-bracco-appeso
        sconfitta:
          titolo: La campata a metà
          testo: |
            Bracco ti manda contro una fune con la sbarra d'argano, e i
            chiattaioli finiscono il lavoro. All'alba la campata cede a metà sotto
            il primo carro, che resta in bilico sul vuoto, e al voto i soci ne
            parlano tutti.
          imposta: { gilda.bracco: 3 }
          effetti: { gilda.voti: -2, rep.ponti: -0.5, fazione.gilda: 1 }
      - testo: "Reggere il ponte con i ponteggiatori fino all'alba"
        descrizione: "Con le funi di servizio sull'argano di Ormun la campata resta su, anche se Bracco scappa."
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Difficile }
        successo:
          titolo: Le funi di servizio
          testo: |
            Bracco vi vede e scappa verso le chiatte. Tu e i ponteggiatori tirate
            per tutta la notte le funi di servizio che Ormun avvolge all'argano, e
            la campata si raddrizza di un palmo alla volta, finché verso l'alba
            restano da legare le funi nuove.
          pe: { atletica: 5 }
          segue: gilda-l-alba-sulla-campata
        fallimento:
          titolo: Le braccia
          testo: |
            Alle tre le braccia ti cedono e una fune di servizio ti scappa dalle
            mani, bruciandoti i palmi. All'alba la campata cede a metà sotto il
            primo carro, che resta in bilico sul vuoto, e Bracco è sparito con le
            sue chiatte.
          imposta: { gilda.bracco: 3 }
          effetti: { ferite: 2, gilda.voti: -2, fazione.gilda: 1 }
      - testo: "Staccare i chiattaioli dal padrone"
        descrizione: "Bracco paga il giovedì. Domani è venerdì, e la Caserma sale sui ponti all'alba."
        prova: { attributo: sociale, abilita: intimidire, difficolta: Difficile }
        successo:
          titolo: Il giovedì
          testo: |
            Avverti i chiattaioli, invece di Bracco, che la Caserma sale all'alba
            e che chi è appeso a quelle funi ci resta da solo. Il primo molla il
            gancio e risale, e gli altri due lo seguono, lasciando Bracco sotto il
            ponte con il segaccio in mano.
          pe: { intimidire: 5 }
          segue: gilda-bracco-appeso
        fallimento:
          titolo: La risata
          testo: |
            Bracco ride così forte che lo senti sopra il vento, e i chiattaioli
            finiscono il lavoro. All'alba la campata cede a metà sotto il primo
            carro, e tu la guardi cedere con la voce rotta.
          imposta: { gilda.bracco: 3 }
          effetti: { ferite: 2, gilda.voti: -2, fazione.gilda: 1 }
      - testo: "Arrivargli addosso al buio, con la lanterna cieca"
        descrizione: "Un dito di luce nella nebbia, e Bracco che sega da solo con la testa bassa."
        requisiti: [chiave.notte-sui-ponti >= 1]
        prova: { attributo: fisico, abilita: furtivita, difficolta: Difficile }
        successo:
          titolo: Un dito di luce
          testo: |
            Scendi lungo una fune di servizio con la lanterna cieca aperta di un
            dito e gli metti la lama sotto l'orecchio mentre sega. I suoi uomini
            non si accorgono di niente finché lui non lascia cadere il segaccio.
          pe: { furtivita: 5 }
          segue: gilda-bracco-appeso
        fallimento:
          titolo: Lo sportello
          testo: |
            Lo sportello della lanterna scatta, e Bracco si volta. Ti
            colpisce con la sbarra prima che tu arrivi, e mentre ti rialzi i
            chiattaioli finiscono il lavoro. All'alba la campata cede a metà
            sotto il primo carro.
          imposta: { gilda.bracco: 3 }
          effetti: { ferite: 2, gilda.voti: -2, fazione.gilda: 1 }
      - testo: "Lasciar fare"
        descrizione: "L'ordine a Bracco l'hai visto firmare tu, nell'ufficio sopra il magazzino. Morlacchi ricorda chi lo lascia lavorare."
        requisiti: [gilda.via == 3]
        costo: 0
        esito:
          titolo: Il primo carro
          testo: |
            Resti al parapetto finché Bracco ti saluta con il segaccio. All'alba
            la campata cede a metà sotto un carro di verdura della Città Bassa, e
            il carrettiere resta appeso alla stanga a lungo; al voto i soci di
            Morlacchi ne parlano tutti.
          imposta: { gilda.bracco: 4 }
          effetti: { tormento: 1.5, gilda.voti: -2, monete: 30, fazione.gilda: 1 }

  - id: gilda-l-alba-sulla-campata
    presso: ponte-delle-mille-corde
    immagine: icone/rope-bridge
    titolo: L'alba sulla campata
    tipo: seguito
    luogo: Ponte delle Mille Corde, verso l'alba
    area: ponti-sospesi
    requisiti: [fazione.gilda == 13]
    testo: |
      Verso l'alba la campata è di nuovo dritta, tenuta su dalle funi di
      servizio avvolte all'argano di Ormun, che però non sono fatte per
      reggere un carro. Bisogna legare le tre funi nuove al posto di quelle
      segate prima che passi il primo carro del mercato, e Ormun ha le mani
      a pezzi. Dalla parte della Città Bassa si sente già il rumore delle
      ruote.
    opzioni:
      - testo: "Legare le funi nuove"
        descrizione: "Tre nodi da carico, appeso sotto l'impalcato, con il carro in arrivo."
        prova: { attributo: mentale, abilita: [tecnologia, accademiche], difficolta: Difficile }
        successo:
          titolo: Il primo carro
          testo: |
            Leghi la terza fune mentre le ruote del primo carro sono già sulla
            campata, e il ponte trema ma regge. Ormun ti tira su per la cintura e
            ti offre la sua pipa, accesa per la prima volta, mentre Bracco è già
            sparito oltre la Cicatrice.
          pe: { tecnologia: 5 }
          imposta: { gilda.bracco: 3 }
          effetti: { monete: 20, rep.ponti: 1, gilda.voti: 1, racconto: 1, rep.gilda: 0.5, fazione.gilda: 1 }
        fallimento:
          titolo: Il nodo che scivola
          testo: |
            Il terzo nodo scivola sotto il primo carro, e la campata scende di un
            braccio con un rumore che sveglia mezzo quartiere. Il carro resta in
            bilico e nessuno cade, ma al voto i soci ne parlano tutti.
          imposta: { gilda.bracco: 3 }
          effetti: { ferite: 1, gilda.voti: -1, fazione.gilda: 1 }
      - testo: "Chiudere il ponte finché Ormun non lega le funi"
        descrizione: "Un ponte chiuso il giorno del voto fa parlare, e uno crollato di più."
        prova: { attributo: sociale, abilita: [intimidire, persuasione], difficolta: Media }
        successo:
          titolo: Il ponte chiuso
          testo: |
            All'imbocco della campata fermi i carri uno dopo l'altro con la voce
            del portasigillo, mentre i carrettieri bestemmiano. Ormun lega le funi
            con le ultime forze, e a metà mattina il ponte riapre.
          pe: { intimidire: 3 }
          imposta: { gilda.bracco: 3 }
          effetti: { monete: 20, rep.ponti: 1, rep.gilda: 0.5, fazione.gilda: 1 }
        fallimento:
          titolo: La coda dei carri
          testo: |
            Il primo carrettiere ti passa accanto con la frusta alzata, e il ponte
            scende di un braccio sotto le sue ruote. Ormun salva la campata
            all'ultimo momento, ma al voto se ne parlerà in tutta la sala.
          imposta: { gilda.bracco: 3 }
          effetti: { gilda.voti: -1, fazione.gilda: 1, scandalo: 0.5 }

  - id: gilda-bracco-appeso
    presso: ponte-delle-mille-corde
    immagine: icone/pulley-hook
    titolo: Bracco appeso
    tipo: seguito
    luogo: Ponte delle Mille Corde, sotto la campata centrale
    area: ponti-sospesi
    requisiti: [fazione.gilda == 13]
    testo: |
      Ugo Bracco è appeso a una fune portante con una mano sola, sopra la
      nebbia della Cicatrice, senza più il segaccio. Ti guarda con la faccia
      rossa per lo sforzo e ride, perché è l'unica cosa che può fare.

      «Il nome lo sai» dice. «Te lo dico lo stesso, se mi tiri su. Le dita
      guantate. Paga bene, e paga il giovedì, come me.» La mano gli scivola
      di un dito sulla fune, e più del vuoto, capisci, lo spaventa la
      Caserma.
    opzioni:
      - testo: "Tirarlo su e consegnarlo a Varn"
        descrizione: "Varn lo scrive e la Caserma lo chiude, e all'approdo lo sapranno prima di mezzogiorno."
        esito:
          titolo: In catene
          testo: |
            Lo tiri su per il bavero e lui si lascia legare, pesante come un sacco
            di sale. All'alba lo consegni a Varn, e nella cassa della sua chiatta
            trovate monete e un ordine senza firma con il sigillo dei magazzini di
            scarico.
          pe: { atletica: 3 }
          imposta: { gilda.bracco: 1 }
          effetti: { monete: 20, rep.ponti: 1, rep.caserma: 0.5, gilda.voti: 1, rep.gilda: 0.5, fazione.gilda: 1 }
      - testo: "Lasciarlo cadere"
        descrizione: "Ha segato la fune della Mula e stanotte quella delle Mille Corde, e la Cicatrice è lì sotto."
        esito:
          titolo: La nebbia
          testo: |
            Lo guardi mentre le dita gli scivolano sulla fune una dopo l'altra,
            finché la nebbia se lo prende senza un rumore. Nella cassa della sua
            chiatta trovate monete e un ordine con il sigillo dei magazzini, e
            alla Pignatta nessuno chiederà di lui.
          imposta: { gilda.bracco: 2 }
          effetti: { monete: 20, rep.ponti: 1, tormento: 1.5, gilda.voti: 1, rep.gilda: 0.5, fazione.gilda: 1 }
      - testo: "Lasciarlo andare oltre la Cicatrice"
        descrizione: "Tiralo su e lascialo scappare con una chiatta, perché chi deve la vita a qualcuno non torna facilmente."
        esito:
          titolo: Oltre la Cicatrice
          testo: |
            Lo tiri su e lo lasci andare, e Bracco se ne va lungo il cavo su una
            chiatta piccola. Nella cassa della sua chiatta grande trovate monete e
            un ordine con il sigillo dei magazzini, e Ilde, quando lo saprà, non
            ti parlerà per una settimana.
          imposta: { gilda.bracco: 3 }
          effetti: { monete: 20, rep.ponti: 0.5, gilda.voti: 1, rep.gilda: 0.5, fazione.gilda: 1 }

  # ------------------------------------------------------------ passo 15 · il terzo piano
  - id: gilda-il-voto-dei-nodi
    presso: gilda-casa-dei-nodi
    immagine: icone/knot
    titolo: Il voto dei nodi
    sommario: "Si elegge il Sovrintendente con un nodo sulla corda di ciascun candidato, e per ultimo parli tu."
    luogo: Casa dei Nodi, la sala del voto
    area: quartieri-alti
    requisiti: [fazione.gilda == 14]
    testo: |
      Nella sala dei soci hanno teso tre corde nuove dalla trave al
      pavimento, ognuna con il cartellino di un candidato, e i soci ci
      faranno un nodo di cera verde a testa, come nel 118. Sulle prime due
      ci sono i nomi di Cordani e di Morlacchi; la terza è per Irsa Valbrun,
      che l'ala delle botteghe ha voluto candidare per ogni evenienza.

      Cordani parla per primo e poco, con le mani ferme sul leggio.
      Morlacchi parla a lungo contando gli argomenti sulle dita guantate, e
      alla fine dell'ultimo dito la sala applaude. Tocca a te, che hai
      portato i libri.

      {espressivita Media} La sala è piena di gente che ha già deciso e di
      gente che aspetta di sentirsi dire che cosa ha deciso. Parla a questi
      ultimi.

      {politica-ed-economia Media} I voti che hai raccolto sono lì, in piedi
      fra gli altri, e ognuno porta con sé quello di un vicino, se lo guardi
      mentre parli.

      {origine mercante-dei-ponti} Hai pagato la commissione a questa Casa
      per anni senza mai entrare nella sala del voto, e adesso i mercanti
      del tuo ponte ti guardano dalla prima fila.
    opzioni:
      - testo: "Parlare per Cordani"
        descrizione: "Con i libri in mano e pochi voti alle spalle, la sala va convinta da capo."
        requisiti: [gilda.127 != 1, gilda.voti < 5]
        prova: { attributo: sociale, abilita: [persuasione, espressivita], difficolta: Difficile }
        successo:
          titolo: La corda di Cordani
          testo: |
            Parli dei noli fantasma e della fune segata sotto le Mille Corde,
            senza alzare la voce. Quando si vota i nodi sulla corda di Cordani
            salgono fino alla trave, e Morlacchi si toglie i guanti per la prima
            volta da quando lo conosci.
          pe: { persuasione: 10 }
          imposta: { gilda.esito: 1 }
          segue: gilda-la-sala-del-terzo-piano
        fallimento:
          titolo: La corda di Morlacchi
          testo: |
            La sala ha già sentito Morlacchi, e i tuoi argomenti arrivano dopo i
            suoi come un carro in coda. I nodi sulla sua corda salgono fino alla
            trave, e Cordani si alza a stringergli la mano, con le mani ferme.
          imposta: { gilda.esito: 3 }
          segue: gilda-la-sala-del-terzo-piano
          effetti: { scandalo: 0.5 }
      - testo: "Parlare per Cordani, con i tuoi voti in sala"
        descrizione: "I soci che hai raccolto sono in piedi fra gli altri, e basta guardarli mentre parli."
        requisiti: [gilda.127 != 1, gilda.voti >= 5, gilda.voti < 8]
        prova: { attributo: sociale, abilita: [persuasione, espressivita], difficolta: Media }
        successo:
          titolo: La corda di Cordani
          testo: |
            Parli guardando i tuoi uno alla volta, e ognuno si volta verso il
            vicino. Quando si vota i nodi sulla corda di Cordani salgono fino alla
            trave, e Morlacchi si toglie i guanti e li posa sulla panca.
          pe: { persuasione: 10 }
          imposta: { gilda.esito: 1 }
          segue: gilda-la-sala-del-terzo-piano
        fallimento:
          titolo: La corda di Morlacchi
          testo: |
            Parli, ma a metà del discorso ti si spezza la voce, e la sala se
            ne accorge. I tuoi votano con te, gli altri con Morlacchi, e gli
            altri sono di più. I nodi sulla sua corda salgono fino alla
            trave.
          imposta: { gilda.esito: 3 }
          segue: gilda-la-sala-del-terzo-piano
          effetti: { scandalo: 0.5 }
      - testo: "Parlare per Cordani, con mezza sala dalla tua"
        descrizione: "La sala, visitata fino all'ultimo salotto, aspetta che tu dica quello che sa già."
        requisiti: [gilda.127 != 1, gilda.voti >= 8]
        prova: { attributo: sociale, abilita: [persuasione, espressivita], difficolta: Facile }
        successo:
          titolo: La corda di Cordani
          testo: |
            Parli poco, perché non serve parlare molto. Quando si comincia a
            votare, i nodi sulla corda di Cordani salgono così in fretta che
            il cancelliere deve mandare a prendere altra cera. Morlacchi si
            toglie i guanti e li posa sulla panca.
          pe: { persuasione: 10 }
          imposta: { gilda.esito: 1 }
          segue: gilda-la-sala-del-terzo-piano
        fallimento:
          titolo: Per un nodo
          testo: |
            Inciampi su una frase, e qualcuno ride. I nodi salgono sulle due
            corde quasi alla pari, e il cancelliere li conta tre volte prima
            di dire che Morlacchi ha vinto per un nodo.
          imposta: { gilda.esito: 3 }
          segue: gilda-la-sala-del-terzo-piano
          effetti: { scandalo: 0.5 }
      - testo: "Parlare per Irsa Valbrun"
        descrizione: "Cordani si è ritirato dopo il documento del 127, e la corda di Irsa ha pochi nodi."
        requisiti: [gilda.127 == 1, gilda.voti < 5]
        prova: { attributo: sociale, abilita: [persuasione, espressivita], difficolta: Difficile }
        successo:
          titolo: La terza corda
          testo: |
            Cordani si è ritirato con una frase sola, e la sala è ancora scossa
            dal documento del 127. Parli di Irsa e delle mani che guarda prima
            degli occhi, e i nodi salgono sulla terza corda fino alla trave mentre
            Irsa si toglie il grembiule.
          pe: { persuasione: 10 }
          imposta: { gilda.esito: 2 }
          segue: gilda-la-sala-del-terzo-piano
        fallimento:
          titolo: La seconda corda
          testo: |
            Parli di Irsa, ma la sala vuole sentire parlare del documento, e
            tu non sai che cosa dirne. I nodi salgono sulla corda di
            Morlacchi. Irsa ti stringe la mano e ti dice che ci hai provato.
          imposta: { gilda.esito: 3 }
          segue: gilda-la-sala-del-terzo-piano
          effetti: { scandalo: 0.5 }
      - testo: "Parlare per Irsa Valbrun, con i tuoi voti in sala"
        descrizione: "I tuoi voti sono in piedi fra gli altri, da portare sulla terza corda."
        requisiti: [gilda.127 == 1, gilda.voti >= 5]
        prova: { attributo: sociale, abilita: [persuasione, espressivita], difficolta: Media }
        successo:
          titolo: La terza corda
          testo: |
            Parli di Irsa guardando i tuoi uno alla volta, e i tuoi guardano
            i loro vicini. Quando si vota, i nodi salgono sulla terza corda
            fino alla trave. Irsa si toglie il grembiule e va a sedersi dove
            sedeva Cordani.
          pe: { persuasione: 10 }
          imposta: { gilda.esito: 2 }
          segue: gilda-la-sala-del-terzo-piano
        fallimento:
          titolo: La seconda corda
          testo: |
            Parli di Irsa, ma la sala è ancora scossa dal documento, e i
            nodi si dividono. Quelli di Morlacchi sono di più. Irsa ti
            stringe la mano e ti dice che ci hai provato.
          imposta: { gilda.esito: 3 }
          segue: gilda-la-sala-del-terzo-piano
          effetti: { scandalo: 0.5 }
      - testo: "Parlare per Morlacchi"
        descrizione: "La via venduta arriva fin qui, con i voti suoi e le parole tue."
        requisiti: [gilda.via == 3]
        esito:
          titolo: Le dita guantate
          testo: |
            La sala ti ascolta con l'attenzione dovuta a chi ha già vinto, e i
            nodi salgono sulla corda di Morlacchi. Cordani gli stringe la mano e
            poi, per la prima volta da mesi, la stringe anche a te, senza
            guardarti.
          imposta: { gilda.esito: 3 }
          segue: gilda-la-sala-del-terzo-piano
      - testo: "Tradire Morlacchi all'ultimo"
        descrizione: "Lui crede che parlerai per lui. Se invece leggi davanti a tutti l'ordine dei magazzini, la sala cambia corda."
        requisiti: [gilda.via == 3]
        prova: { attributo: sociale, abilita: [ingannare, espressivita], difficolta: Difficile }
        successo:
          titolo: L'ordine letto
          testo: |
            Sul leggio leggi l'ordine dei magazzini per il cavo della chiatta, con
            il sigillo bene in vista, e poi i noli fantasma. Morlacchi resta
            immobile mentre la sala si muove, e quando i nodi salgono sulla corda
            di Cordani esce dalla porta di servizio senza i guanti.
          pe: { ingannare: 10 }
          imposta: { gilda.esito: 1 }
          segue: gilda-la-sala-del-terzo-piano
        fallimento:
          titolo: Il foglio tremante
          testo: |
            Ti trema la mano, e Morlacchi dice ad alta voce che quel foglio l'hai
            scritto tu. La sala gli crede e i nodi salgono sulla sua corda fino
            alla trave, mentre lui ti sorride come a un debitore.
          imposta: { gilda.esito: 3 }
          effetti: { scandalo: 1.5 }
          segue: gilda-la-sala-del-terzo-piano

  - id: gilda-la-sala-del-terzo-piano
    presso: gilda-casa-dei-nodi
    immagine: fazioni/gilda-dei-mercanti
    titolo: La sala del terzo piano
    tipo: seguito
    luogo: Casa dei Nodi, la sala del terzo piano
    area: quartieri-alti
    requisiti: [fazione.gilda == 14, gilda.esito >= 1]
    testo: |
      La sera del voto entri nella sala del terzo piano dalla porta grande,
      quella con il chiavistello di ferro. Il Sovrintendente siede a
      capotavola, e una delle sette sedie di cuoio è vuota, con sopra una
      catena d'argento a maglie piatte chiusa da un nodo d'oro.

      Sullo schienale è appesa una cappa di cuoio scuro foderata con
      l'intreccio delle funi del Patto, quelle che i tiracorde annodarono
      nel 118 al posto del nome, e in città quella cappa la conoscono tutti.
      Al terzo piano nessuno si siede prima che il Sovrintendente abbia
      posato le mani sul tavolo.
    opzioni:
      - testo: "Sedere accanto a Tarquin Cordani"
        descrizione: "Cordani è Sovrintendente per altri cinque anni, e la sedia è quella lasciata da Morlacchi."
        requisiti: [gilda.esito == 1]
        esito:
          titolo: Il consigliere
          testo: |
            Cordani ti indica la sedia che è stata di Morlacchi. Irsa ti mette la
            catena al collo e Lira ti consegna la chiave della sala, mentre Varn
            scrive il tuo nome sull'aria. La cappa è tua, con la borsa più pesante
            mai pagata dalla Casa a un socio.

            «Il commercio può servire la città oltre che il profitto» dice
            Cordani, a qualcuno che gli crede.
          pe: { politica-ed-economia: 10 }
          almeno: { rep.gilda: 10 }
          imposta: { gilda.consigliere: 1 }
          effetti: { oggetto.gilda-cappa-delle-mille-corde: 1, oggetto.gilda-catena-del-terzo-piano: 1, monete: 350, racconto: 1, fazione.gilda: 1 }
      - testo: "Sedere accanto a Irsa Valbrun"
        descrizione: "Irsa è Sovrintendente e Cordani si è ritirato, e la sedia è quella lasciata da Irsa."
        requisiti: [gilda.esito == 2]
        esito:
          titolo: Il consigliere
          testo: |
            Irsa siede a capotavola con il grembiule piegato sulle ginocchia e ti
            indica la sua vecchia sedia. Cordani, venuto da semplice socio, ti
            mette la catena al collo, e Lira ti consegna la chiave della sala. La
            cappa è tua, con la borsa più pesante che la Casa abbia mai pagato a
            un socio.

            «Prima ti guardo, poi ti eleggo» dice Irsa, e tutta la sala ride.
          pe: { politica-ed-economia: 10 }
          almeno: { rep.gilda: 10 }
          imposta: { gilda.consigliere: 1 }
          effetti: { oggetto.gilda-cappa-delle-mille-corde: 1, oggetto.gilda-catena-del-terzo-piano: 1, monete: 350, racconto: 1, fazione.gilda: 1 }
      - testo: "Sedere in minoranza, di fronte a Morlacchi"
        descrizione: "Morlacchi è Sovrintendente, e la sedia te la lascia Cordani uscendo dal terzo piano."
        requisiti: [gilda.esito == 3]
        esito:
          titolo: In minoranza
          testo: |
            Morlacchi siede a capotavola con i guanti posati accanto alle mani.
            Cordani ti mette la catena al collo e ti cede la sua sedia. «Tienila
            calda» dice, ed esce dalla porta grande. La cappa è tua, e la borsa
            del tesoriere è pesante, anche se Morlacchi l'ha contata sulle dita
            prima di dartela.

            Da domani al terzo piano lui conterà sulle dita e tu nei libri.
          pe: { politica-ed-economia: 10 }
          almeno: { rep.gilda: 10 }
          imposta: { gilda.consigliere: 1 }
          effetti: { oggetto.gilda-cappa-delle-mille-corde: 1, oggetto.gilda-catena-del-terzo-piano: 1, monete: 300, racconto: 1, fazione.gilda: 1 }

  # ------------------------------------------------------------ la coda · il seggio dei Malgrani
  - id: gilda-il-seggio-dei-malgrani
    presso: gilda-casa-dei-nodi
    immagine: fazioni/consiglio-di-qir-azel
    titolo: Il seggio dei Malgrani
    sommario: "Il Consiglio ha dato alla Gilda il seggio dei Malgrani, e al terzo piano qualcuno comincia già a contare."
    luogo: Casa dei Nodi, la sala del terzo piano
    area: quartieri-alti
    requisiti: [fazione.gilda >= 15, seggio.malgrani == 2, gilda.seggio == 0]
    testo: |
      La notizia arriva al terzo piano con un messo del Municipio che legge
      il foglio a voce alta senza alzare gli occhi. Il seggio dei Malgrani
      in Consiglio, da oggi, è della Gilda, che accanto a Tarquin Cordani ha
      adesso una seconda voce a quel tavolo.

      Qualcuno stappa una bottiglia di vino di Laresh, e qualcuno,
      dall'altra parte del tavolo, comincia a contare chi siederà sulla
      seconda sedia, ora che le segherie e i mulini dei Malgrani passano da
      questa stanza.

      {empatia Media} Lira non beve. Guarda la bottiglia, e poi guarda te,
      come la prima volta all'archivio.
    opzioni:
      - testo: "Brindare con il terzo piano"
        descrizione: "È una vittoria della Casa, e la Casa sei anche tu."
        costo: 0
        esito:
          titolo: Il vino di Laresh
          testo: |
            Alzi il bicchiere con gli altri, e qualcuno ti batte una mano sulla
            spalla e ti chiama consigliere. Per una sera la Casa dei Nodi sembra
            una di quelle famiglie che litigano a tavola e si vogliono bene lo
            stesso.
          imposta: { gilda.seggio: 1 }
          effetti: { rep.gilda: 0.5 }
      - testo: "Chiedere a Lira che cosa pensa"
        descrizione: "Lira non beve, e i conti che non tornano li mette in una scatola."
        costo: 0
        esito:
          titolo: Un tassello nuovo
          testo: |
            Lira ti porta all'archivio e inchioda un tassello nuovo, a forma di
            sedia, sulla costola di un registro vuoto. «Fra un anno vedremo. Due
            seggi sono due bocche da sfamare, e tu tieni i conti, consigliere»
            dice, e ti dà il registro.
          imposta: { gilda.seggio: 1 }
          effetti: { informazioni.pettegolezzo: 1 }
