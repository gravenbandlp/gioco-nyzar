# La quest della Gilda, passi 11-15 (fazione.gilda 10 → 15). Vedi quest.yaml per le quality.
# 11 I monconi del Ventisette (10 → 11): Lira ha tre versioni dell'incendio del 127 e manca l'unica firmata. Clelia
#   Vennari sa che suo nonno la nascose nella loggia del pilone bruciato. Spedizione spedizione-monconi.yaml (con
#   chiatta.posto Ilde ti porta sulla Mula e si salta la prima fascia).
# 12 L'assemblea dei soci (11 → 12): l'elezione a membro eletto (più facile con gilda.voti >= 4, senza prova nella via
#   venduta), poi il documento del 127 a una delle quattro mani (seguito, gilda.127). Grado IV.
# 13 I voti delle botteghe (12 → 13): tre visite fra sei, una per bottega o famiglia (gilda.giro e gilda.giro-*),
#   ognuna vale un voto; le reputazioni e le storie della città aprono le vie senza prova. Poi la sera Ormun Pell ti
#   ferma alle Mille Corde (gilda.giro >= 3): qualcuno ha toccato le corde.
# 14 La notte prima del voto (13 → 14): boss Ugo Bracco e i suoi chiattaioli sulla campata centrale delle Mille Corde.
#   Combattimento, reggere il ponte fino all'alba (due prove Difficili), staccare i chiattaioli dal padrone, la
#   lanterna cieca; nella via venduta si può lasciar fare. Fallire costa Ferite e due voti. Il seguito decide di
#   Bracco (gilda.bracco).
# 15 Il terzo piano (14 → 15): il voto con i nodi e il discorso, Difficile, Media con cinque voti, Facile con otto.
#   Vince Tarquin (gilda.esito 1), Irsa se Tarquin ha pubblicato il 127 (2), Morlacchi se il discorso fallisce o
#   nella via venduta (3). Il seguito dà il grado V in ogni caso.
# La coda `gilda-il-seggio-dei-malgrani` si apre dopo il passo 15 se il Consiglio ha dato il seggio dei Malgrani alla
# Gilda (seggio.malgrani == 2).
storylet:
  # ------------------------------------------------------------ passo 11 · le tre versioni (la spedizione è in spedizione-monconi.yaml)
  - id: gilda-le-tre-versioni
    presso: gilda-casa-dei-nodi
    immagine: personaggi/lira-demos
    titolo: Le tre versioni del Ventisette
    sommario: "All'archivio Lira ha tre versioni dell'incendio dei ponti del 127, e nessuna è firmata. Una vecchia signora dei Ponti sa dov'è quella che manca."
    luogo: Casa dei Nodi, l'archivio dei dazi
    area: quartieri-alti
    requisiti: [fazione.gilda == 10]
    testo: |
      Sul tavolo dell'archivio Lira ha messo tre fascicoli legati con il
      nastro rosso. Sono le tre versioni della notte del 127, quando tre
      ponti presero fuoco insieme. Ogni famiglia del Patto ne depositò una
      alla Casa, e ognuna accusa le altre due. Le prove non combaciano, e la
      cronaca della città parla ancora di una settimana di incidenti
      edilizi.

      «Ne esisteva una quarta» dice Lira, «la versione unica, quella
      firmata. Il Velo la chiese dopo la settima notte, e qualcuno la portò
      via prima che arrivasse in Cattedrale. Nei registri c'è il posto
      vuoto.» Ti indica una riga con il dito, e la riga è vuota davvero.

      Accanto alla finestra, seduta su uno sgabello pieghevole con la
      schiena diritta e i guanti di pizzo, c'è Clelia Vennari, l'ultima di
      una famiglia che firmò il Patto con un nodo. Ha in grembo una scatola
      di latta. «Mio nonno era tiracorde» dice, «e ha lavorato sui piloni
      del 127 fino all'ultimo giorno. Diceva sempre che la verità sui ponti
      stava nella loggia del pilone di ponente, e che nessuno ci saliva
      più.»

      {politica-ed-economia Media} Alla vigilia del voto un documento così
      può affondare una famiglia intera, e chi lo trova per primo decide
      quale.

      {origine rampollo-dei-quartieri-alti} Clelia Vennari ti riconosce il
      nome dal cognome, e ti fa un cenno con il mento, come a una tavola di
      una volta. In casa tua il nome dei Vennari si diceva a mezza voce.

      Lira abbassa la voce. «Morlacchi lo sa» dice, «e stamattina ha mandato
      la sua scorta verso i monconi.»
    opzioni:
      - testo: "Andare ai piloni con Ormun"
        descrizione: "Ormun Pell conosce i piloni bruciati, e le corde vecchie le ha toccate da giovane."
        esito:
          titolo: I monconi
          testo: |
            Ormun ti aspetta all'imbocco delle Mille Corde con una fune
            arrotolata sulla spalla e la pipa spenta fra i denti. «I
            monconi» dice, e sputa nella Cicatrice. «Ci sono saliti in
            pochi, e scesi in meno.» Ti porta fino alla base del pilone di
            ponente, dove il ferro nero del 127 esce dalla roccia come un
            dente rotto.
          vai: gilda-monconi-del-ventisette
      - testo: "Farti portare da Ilde sulla Mula"
        descrizione: "Ilde ti tiene un posto sulla chiatta. Dal cavo della Mula il pilone si raggiunge di lato, saltando la salita."
        requisiti: [chiatta.posto >= 1]
        esito:
          titolo: La Mula
          testo: |
            Ilde Sarrocchi ti carica sulla Mula con la liquirizia fra i
            denti e ti porta lungo il cavo fin sotto il pilone di ponente.
            «Socio, qui ti lascio» dice, e accosta la chiatta a una scala di
            ferro che dalla riva non si vede. Sali e sei già sopra il primo
            tratto.
          effetti: { profondita.gilda-monconi-del-ventisette: 1 }
          vai: gilda-monconi-del-ventisette
      - testo: "Convincere Clelia a dirti di più"
        descrizione: "Suo nonno le ha raccontato della loggia. Una vecchia signora dei Ponti racconta tutto, se la si tratta come merita."
        prova: { attributo: sociale, abilita: [galateo, empatia], difficolta: Media }
        successo:
          titolo: La scatola di latta
          testo: |
            Ti siedi accanto a lei e la chiami donna Clelia, come si faceva.
            Lei apre la scatola di latta. Dentro c'è un sigillo da ceralacca
            con il manico d'osso e un foglio ingiallito, con il disegno di
            una loggia e una porta di metallo che non ha serratura. «Mio
            nonno la chiamava la stanza dei Precursori» dice. «Diceva che si
            apre con le mani giuste.» Ti lascia il foglio e ti accompagna
            fino alle scale.
          pe: { galateo: 3 }
          effetti: { informazioni.pettegolezzo: 1 }
          vai: gilda-monconi-del-ventisette
        fallimento:
          titolo: La scatola chiusa
          testo: |
            Le chiedi della loggia con troppa fretta, e Clelia chiude la
            scatola di latta con uno scatto. «Mio nonno diceva che chi corre
            sui ponti ci muore» dice. Esci dall'archivio senza il disegno, e
            ai piloni ci vai con Ormun, che ti aspetta all'imbocco delle
            Mille Corde.
          vai: gilda-monconi-del-ventisette

  # ------------------------------------------------------------ passo 12 · l'assemblea dei soci
  - id: gilda-l-assemblea-dei-soci
    presso: gilda-casa-dei-nodi
    immagine: fazioni/gilda-dei-mercanti
    titolo: L'assemblea dei soci
    sommario: "L'assemblea dei soci vota l'elezione dei membri del nuovo anno, e il tuo nome è nella lista. Il documento del 127 è ancora nella tua giubba."
    luogo: Casa dei Nodi, la sala dei soci
    area: quartieri-alti
    requisiti: [fazione.gilda == 11]
    testo: |
      La sala dei soci è piena fino alle finestre, e sotto la fune dei nodi
      ci sono più persone di quante ne hai mai viste alla Casa. I membri
      eletti siedono sulle panche davanti, con i panciotti buoni, e gli
      altri soci stanno in piedi dietro. Si vota per alzata di mano, un nome
      alla volta. Il tuo è il settimo della lista.

      In prima fila, accanto a Cordani, siede una monaca bassa e robusta con
      i capelli corti. È Ottilia Sanvel, mandata dalla Madre del Velo, che
      garantisce il Patto delle Corde dal 127 e quest'anno vuole vedere con
      i suoi occhi. Morlacchi siede dall'altra parte della sala, con i
      guanti in grembo, e conta le mani alzate prima che il cancelliere le
      conti.

      {galateo Media} Davanti all'assemblea si parla poco. Due frasi per
      dire chi sei, una per ringraziare il padrino, e poi si tace.

      {resistenza Facile fallita} Hai la bocca secca e la camicia incollata
      alla schiena, come la mattina del tuo primo nodo.

      Il documento del 127 è nella tua giubba contro il petto, e lo senti a
      ogni respiro. Cordani ti ha guardato una volta sola, entrando.
    opzioni:
      - testo: "Parlare all'assemblea"
        descrizione: "Due frasi giuste. Le mani si alzano o restano in tasca."
        requisiti: [gilda.voti < 4]
        prova: { attributo: sociale, abilita: [galateo, persuasione], difficolta: Media }
        successo:
          titolo: Le mani alzate
          testo: |
            Dici chi sei, e ringrazi il padrino, e taci. Le mani si alzano
            una dopo l'altra, cominciando dal fondo della sala. Il
            cancelliere conta, e sei membro eletto. Cordani batte le mani
            una volta sola, piano. Alla fine della seduta ti fa cenno di
            salire al terzo piano.
          pe: { galateo: 5 }
          segue: gilda-il-documento-del-127
        fallimento:
          titolo: Per tre mani
          testo: |
            Parli troppo, e a metà della seconda frase in fondo qualcuno
            sbadiglia forte. Le mani si alzano lente, e il cancelliere le
            conta due volte. Sei eletto per tre voti. Morlacchi ti sorride
            dall'altra parte della sala e conta qualcosa sulle dita. Cordani
            ti fa cenno di salire al terzo piano.
          effetti: { scandalo: 0.5 }
          segue: gilda-il-documento-del-127
      - testo: "Parlare all'assemblea con i tuoi voti in sala"
        descrizione: "I soci che voteranno come chiedi tu sono qui, e alzeranno la mano per primi. Gli altri li seguiranno."
        requisiti: [gilda.voti >= 4]
        prova: { attributo: sociale, abilita: [galateo, persuasione], difficolta: Facile }
        successo:
          titolo: Le mani alzate
          testo: |
            I tuoi alzano la mano prima che tu finisca la seconda frase, e
            il resto della sala li segue. Il cancelliere non ha bisogno di
            contare. Sei membro eletto, e Cordani batte le mani una volta
            sola. Alla fine della seduta ti fa cenno di salire al terzo
            piano.
          pe: { galateo: 3 }
          segue: gilda-il-documento-del-127
        fallimento:
          titolo: Le mani lente
          testo: |
            Ti si annoda la lingua sulla seconda frase, e i tuoi alzano la
            mano lo stesso, per affetto. Il resto della sala li segue con
            calma. Sei eletto, e qualcuno ride del tuo inciampo. Cordani ti
            fa cenno di salire al terzo piano.
          effetti: { scandalo: 0.5 }
          segue: gilda-il-documento-del-127
      - testo: "Lasciare che votino gli uomini di Morlacchi"
        descrizione: "I magazzini hanno i loro soci, e i soci di Morlacchi alzano la mano quando la alza lui."
        requisiti: [gilda.via == 3]
        esito:
          titolo: La mano di Morlacchi
          testo: |
            Morlacchi alza la mano per primo, e dietro di lui si alza mezza
            sala, come un campo di grano sotto il vento. Sei membro eletto.
            In prima fila Ottilia Sanvel guarda Morlacchi e poi te, e scrive
            qualcosa su un taccuino. Cordani ti fa cenno di salire al terzo
            piano, senza guardarti.
          segue: gilda-il-documento-del-127

  - id: gilda-il-documento-del-127
    presso: gilda-casa-dei-nodi
    immagine: icone/tied-scroll
    titolo: Quattro mani
    tipo: seguito
    luogo: Casa dei Nodi, la sala del terzo piano
    area: quartieri-alti
    requisiti: [fazione.gilda == 11]
    testo: |
      Al terzo piano Cordani chiude le due porte, e per la prima volta da
      quando lo conosci le sue mani non stanno ferme sul tavolo. Ti chiede
      il documento del 127. Non ti dice che cosa ne farà. Ottilia Sanvel
      aspetta nel corridoio, perché il Velo è garante del Patto e vuole il
      documento in Cattedrale. Morlacchi, uscendo dalla sala dei soci, ti ha
      fatto sapere che il suo prezzo è ancora quello di sempre.

      Il documento porta i sigilli delle tre famiglie del Patto, e il primo
      è quello dei Cordani, di Hakkos Cordani, il nonno di Tarquin. Le
      famiglie bruciarono insieme i tre ponti per raddoppiare i pedaggi e
      ricostruirli con il denaro della Gilda, e le bande in livrea che si
      ammazzarono nei vicoli per sette notti non lo seppero mai.

      {empatia Difficile} Sa già che cosa c'è scritto. Glielo leggi in
      faccia, nella fronte che non si muove. Lo sapeva prima di te, o lo
      temeva da sempre.

      {politica-ed-economia Media} Pubblicato, il documento costa a Cordani
      la rielezione e fa del Velo l'arbitro di tutto. In mano a Morlacchi
      diventa una corda al collo dei Cordani. Nascosto, è un debito che
      qualcuno prima o poi verrà a riscuotere.
    opzioni:
      - testo: "Darlo a Tarquin Cordani"
        descrizione: "È il nome di suo nonno. Che cosa farne lo decide lui, e lui si gioca la rielezione."
        immagine: fazioni/gilda-dei-mercanti
        esito:
          titolo: Il sigillo del nonno
          testo: |
            Glielo dai, e Cordani lo legge tutto in piedi. Quando arriva al
            sigillo di suo nonno si siede. «Lo pubblico domani» dice,
            «perché una Gilda che non sa chi ha bruciato i suoi ponti non
            merita di riscuoterne i pedaggi.» Poi ti stringe la mano con una
            presa lunga. Da domani sei membro eletto, con la firma sulle
            lettere di presentazione, un letto alla foresteria della Casa e
            un'armaiola che vuole vederti.
          almeno: { rep.gilda: 8 }
          imposta: { gilda.127: 1 }
          effetti: { monete: 40, rep.velo: 0.5, fazione.gilda: 1 }
      - testo: "Darlo a Ottilia Sanvel per il Velo"
        descrizione: "Il Velo è garante del Patto dal 127. Ottilia lo prende soltanto se è convinta che in Cattedrale serva più che qui."
        immagine: personaggi/ottilia-sanvel
        prova: { attributo: sociale, abilita: [galateo, persuasione], difficolta: Media }
        successo:
          titolo: In Cattedrale
          testo: |
            Esci nel corridoio e glielo porgi. Ottilia ti ascolta e ti
            risponde in frasi brevi senza superlativi, e alla fine lo prende
            con due mani. «Lo custodirà la Madre» dice. «La Gilda saprà che
            esiste, e questo basta a tenerla buona.» Cordani, dalla soglia,
            ti guarda con le mani di nuovo ferme. Da domani sei membro
            eletto, con un letto alla foresteria e un'armaiola che vuole
            vederti.
          pe: { galateo: 3 }
          almeno: { rep.gilda: 8 }
          imposta: { gilda.127: 2 }
          effetti: { monete: 40, rep.velo: 1, gilda.voti: 1, fazione.gilda: 1 }
        fallimento:
          titolo: Un rimprovero
          testo: |
            Ottilia prende il documento, ma prima ti fa notare, con calma,
            che un membro della Gilda che consegna i segreti della sua Casa
            nel corridoio non dà un buon esempio. Lo porta in Cattedrale lo
            stesso. Cordani ti guarda dalla soglia. Da domani sei membro
            eletto, con un letto alla foresteria e un'armaiola che vuole
            vederti.
          almeno: { rep.gilda: 8 }
          imposta: { gilda.127: 2 }
          effetti: { monete: 40, rep.velo: 0.5, fazione.gilda: 1 }
      - testo: "Venderlo a Morlacchi"
        descrizione: "Una corda al collo dei Cordani, a pochi giorni dal voto. Il suo prezzo è quello di sempre."
        immagine: icone/hooded-figure
        esito:
          titolo: La corda
          testo: |
            Scendi dalla scala di servizio e lo porti nell'ufficio sopra il
            magazzino. Morlacchi lo legge con i guanti e sorride al sigillo
            dei Cordani come a un vecchio amico. Ti conta la borsa sulle
            dita. Da domani sei membro eletto, con un letto alla foresteria
            della Casa. Ottilia Sanvel, quando lo saprà, scriverà alla
            Madre.
          almeno: { rep.gilda: 8 }
          imposta: { gilda.127: 3 }
          effetti: { monete: 120, rep.velo: -1, fazione.gilda: 1 }
      - testo: "Tenerlo per te, nascosto"
        descrizione: "Nessuna delle quattro mani. Un documento così, nascosto in casa tua, vale un segreto per sempre."
        esito:
          titolo: Sotto l'asse
          testo: |
            Dici a Cordani che nella loggia hai trovato soltanto polvere e
            travi bruciate. Lui ti guarda a lungo con le mani ferme e non
            insiste. La sera lo nascondi sotto un'asse di casa tua, avvolto
            nella tela cerata, e dormi male. Da domani sei membro eletto,
            con un letto alla foresteria e un'armaiola che vuole vederti.
          almeno: { rep.gilda: 8 }
          imposta: { gilda.127: 4 }
          effetti: { monete: 40, informazioni.segreto: 1, fazione.gilda: 1 }
      - testo: "Portarlo a Ottilia come un fratello del Velo"
        descrizione: "Ottilia ti ha visto da novizio all'alba nel corridoio. Sa che cosa vuol dire quando un accolito le porta una cosa con due mani."
        quando: [origine.accolito-del-velo >= 1]
        esito:
          titolo: Con due mani
          testo: |
            Esci nel corridoio e glielo porgi con due mani, come si porgono
            le cose sull'altare. Ottilia lo prende senza dire niente, e per
            un momento ti guarda come ti guardava all'alba, quando
            correggeva le letture dei novizi. «La Madre lo custodirà» dice.
            Da domani sei membro eletto, con un letto alla foresteria e
            un'armaiola che vuole vederti.
          pe: { galateo: 3 }
          almeno: { rep.gilda: 8 }
          imposta: { gilda.127: 2 }
          effetti: { monete: 40, rep.velo: 1, gilda.voti: 1, fazione.gilda: 1 }

  # ------------------------------------------------------------ passo 13 · i voti delle botteghe
  - id: gilda-i-voti-delle-botteghe
    presso: gilda-casa-dei-nodi
    immagine: icone/vote
    titolo: I voti delle botteghe
    sommario: "Fra pochi giorni si elegge il Sovrintendente. Morlacchi compra i voti e nei salotti fa girare una calunnia, e ogni socio ha il suo prezzo."
    luogo: Casa dei Nodi, la lista dei soci
    area: quartieri-alti
    requisiti: [fazione.gilda == 12, gilda.giro < 3]
    testo: |
      Nella sala dei soci il cancelliere nuovo ha appeso la lista dei
      votanti, tre fogli fitti di nomi, e accanto a ogni nome c'è il
      mestiere. Si vota fra pochi giorni, con i nodi, come nel 118.
      Morlacchi intanto compra voti, e lo fa senza nasconderlo, con le borse
      di velluto. Nei salotti dei Quartieri Alti fa girare una voce, che il
      Sovrintendente divide il letto con un teatrante e che una Gilda
      guidata così non sa più tenere i conti.

      {conoscenze-della-strada Media} Ogni socio ha un prezzo, e quasi mai è
      una moneta. C'è chi vuole una gabella più bassa e chi vuole essere
      ascoltato, e qualcuno vuole soltanto che qualcuno vada a trovarlo.

      {politica-ed-economia Media} Le botteghe votano con Irsa, l'approdo
      vota con chi difende le funi, le vecchie famiglie con chi ricorda i
      loro nomi. Hai il tempo di tre visite, forse quattro.

      Cordani non fa campagna. Lo vedi passare nella sala con la camicia
      bianca, e la gente si volta a guardarlo come si guarda un uomo che ha
      già perso.

      {empatia Media} Si è arreso meno di quanto sembri. Semplicemente non
      sa come si chiede un voto, perché non l'ha mai dovuto chiedere.
    opzioni:
      - testo: "Fare il giro delle botteghe con Irsa"
        descrizione: "Le botteghe del ferro e del cuoio votano con Irsa. Vogliono sapere che cosa farà la Casa con i dazi delle botteghe piccole."
        immagine: personaggi/irsa-valbrun
        quando: [gilda.giro-botteghe == 0]
        prova: { attributo: mentale, abilita: politica-ed-economia, difficolta: Media }
        successo:
          titolo: I dazi delle botteghe
          testo: |
            Fai il giro con Irsa da una bottega all'altra, e in ognuna ti
            fermi a parlare di dazi con i conti in mano. Ai bottegai spieghi
            quanto pesano i noli fantasma dei magazzini sulle loro gabelle.
            Alla fine della giornata Irsa ti dice che le botteghe voteranno
            con te, e lo dice guardandoti le mani, come la prima volta.
          pe: { politica-ed-economia: 3 }
          effetti: { gilda.giro: 1, gilda.giro-botteghe: 1, gilda.voti: 1, rep.gilda: 0.5, rep.botteghe: 0.5 }
        fallimento:
          titolo: I conti sbagliati
          testo: |
            Fai il giro con Irsa, ma alla bottega del cuoiaio sbagli un
            conto davanti a tutti, e il cuoiaio te lo corregge con il gesso
            sul bancone. Le botteghe ti ascoltano con educazione. Irsa,
            uscendo, ti dice che voteranno come pensano, e che oggi pensano
            poco di te.
          effetti: { gilda.giro: 1, gilda.giro-botteghe: 1 }
      - testo: "Fare il giro delle botteghe con Irsa, da amico"
        descrizione: "Bram Halgast e Irsa ti conoscono, e le botteghe lo sanno. Basta farsi vedere con lei."
        immagine: personaggi/irsa-valbrun
        quando: [gilda.giro-botteghe == 0]
        requisiti: [rep.botteghe >= 5]
        esito:
          titolo: Un amico delle botteghe
          testo: |
            Fai il giro con Irsa, e in ogni bottega qualcuno ti saluta per
            nome prima ancora che lei ti presenti. Alla Fucina Bram ti offre
            da bere e alza il bicchiere al Sovrintendente. Le botteghe
            voteranno con te, e non c'è bisogno di parlare di dazi.
          effetti: { gilda.giro: 1, gilda.giro-botteghe: 1, gilda.voti: 1, rep.gilda: 0.5, rep.botteghe: 0.5 }
      - testo: "Andare all'approdo delle chiatte"
        descrizione: "I chiattaioli piccoli votano contro chi taglia le funi. Bisogna convincerli che non sei tu."
        quando: [gilda.giro-approdo == 0]
        prova: { attributo: sociale, abilita: persuasione, difficolta: Media }
        successo:
          titolo: Le funi
          testo: |
            All'approdo parli ai chiattaioli piccoli seduto su un rotolo di
            fune, e gli prometti che la Casa farà controllare i cavi da
            Ormun ogni mese, e che chi sega una fune risponderà alla
            Caserma. Ti ascoltano masticando, e alla fine uno sputa nella
            Cicatrice e dice che va bene, e che l'approdo voterà con te.
          pe: { persuasione: 3 }
          effetti: { gilda.giro: 1, gilda.giro-approdo: 1, gilda.voti: 1, rep.gilda: 0.5, rep.ponti: 0.5 }
        fallimento:
          titolo: Le promesse della Casa
          testo: |
            Gli prometti i controlli sui cavi, e un chiattaiolo vecchio
            ride. Dice che le promesse della Casa le ha sentite tante volte,
            e che le funi si segano lo stesso. Te ne vai dall'approdo con le
            scarpe bagnate e nessun voto.
          effetti: { gilda.giro: 1, gilda.giro-approdo: 1 }
      - testo: "Andare all'approdo con il nome di Ugo Bracco"
        descrizione: "Sai chi ha segato la fune della Mula. All'approdo basta dirlo nel modo giusto."
        quando: [gilda.giro-approdo == 0]
        requisiti: [chiatta.colpevole == 1]
        esito:
          titolo: Il nome
          testo: |
            All'approdo dici ad alta voce chi ha segato la fune della Mula,
            e che la Casa lo sa. I chiattaioli piccoli si guardano fra loro,
            poi guardano le chiatte grandi di Bracco, ormeggiate in fondo.
            Ilde ti batte una mano sulla spalla e ti chiama socio, e
            l'approdo da quel momento vota con te.
          effetti: { gilda.giro: 1, gilda.giro-approdo: 1, gilda.voti: 1, rep.gilda: 0.5, rep.ponti: 0.5 }
      - testo: "Fare visita alle vecchie famiglie del Patto"
        descrizione: "Le famiglie dei tiracorde hanno ancora un voto ciascuna, e vogliono essere ricordate prima che votate."
        quando: [gilda.giro-famiglie == 0]
        prova: { attributo: sociale, abilita: galateo, difficolta: Media }
        successo:
          titolo: I nomi ricordati
          testo: |
            Visiti le vecchie famiglie una per una, in salotti con le tende
            tirate e i ritratti dei nonni che firmarono con un nodo. In ogni
            casa ti ricordi il nome giusto del nonno giusto. Alla fine
            Clelia Vennari, che ti ha accompagnato, ti dice che le famiglie
            del Patto voteranno con te.
          pe: { galateo: 3 }
          effetti: { gilda.giro: 1, gilda.giro-famiglie: 1, gilda.voti: 1, rep.gilda: 0.5 }
        fallimento:
          titolo: Il nonno sbagliato
          testo: |
            Nella seconda casa scambi il nonno con lo zio, e la padrona di
            casa ti corregge con un sorriso freddo. La voce gira, e nelle
            case dopo ti accolgono con la porta socchiusa. Le famiglie del
            Patto voteranno come vogliono.
          effetti: { gilda.giro: 1, gilda.giro-famiglie: 1 }
      - testo: "Fare visita alle famiglie con Berengario Lusardi"
        descrizione: "Lusardi ti deve qualcosa, e le vecchie famiglie a Lusardi aprono la porta."
        quando: [gilda.giro-famiglie == 0]
        requisiti: [lusardi.passo >= 3]
        esito:
          titolo: La redingote
          testo: |
            Berengario Lusardi ti accompagna con la sua redingote buona, e
            in ogni casa entra per primo, con il cappello in mano. Le
            famiglie del Patto ti ascoltano perché ti ha portato lui, e
            votano con te.
          effetti: { gilda.giro: 1, gilda.giro-famiglie: 1, gilda.voti: 1, rep.gilda: 0.5 }
      - testo: "Corteggiare la sedia dei Tarvelin"
        descrizione: "Ondrel Tarvelin parla poco e pesa molto. Il suo voto porta con sé quello dell'Acciaieria."
        immagine: personaggi/ondrel-tarvelin
        quando: [gilda.giro-tarvelin == 0]
        requisiti: [pista.acciaio < 4]
        prova: { attributo: sociale, abilita: galateo, difficolta: Difficile }
        successo:
          titolo: Il voto dell'Acciaieria
          testo: |
            Ondrel ti riceve in piedi in un ufficio pieno di fumo, pallido
            nei suoi abiti scuri, e ti ascolta senza dire una parola. Alla
            fine annuisce una volta. «I Tarvelin votano per chi tiene i
            conti in ordine» dice. Voterà con te, e con lui l'Acciaieria.
          pe: { galateo: 5 }
          effetti: { gilda.giro: 1, gilda.giro-tarvelin: 1, gilda.voti: 1, rep.gilda: 0.5, rep.tarvelin: 0.5 }
        fallimento:
          titolo: Il fumo
          testo: |
            Ondrel ti ascolta in silenzio e ti congeda con un cenno, senza
            aver detto una parola. Uscendo dall'Acciaieria hai il fumo nei
            vestiti e la sensazione di aver parlato a un muro di ghisa.
          effetti: { gilda.giro: 1, gilda.giro-tarvelin: 1 }
      - testo: "Chiedere il voto dell'Acciaieria"
        descrizione: "L'Acciaieria adesso è di chi ci lavora, o di Liaren con Irsa come socia. Votano con Irsa."
        quando: [gilda.giro-tarvelin == 0]
        requisiti: [pista.acciaio >= 4, acciaieria.futuro >= 2]
        esito:
          titolo: L'Acciaieria riaccesa
          testo: |
            All'Acciaieria ti ricevono nel cortile fra le colate e ti
            ascoltano con le maniche arrotolate. Votano con Irsa, e Irsa
            vota con te. Il capoturno ti stringe la mano con una mano che
            scotta.
          effetti: { gilda.giro: 1, gilda.giro-tarvelin: 1, gilda.voti: 1, rep.gilda: 0.5 }
      - testo: "Chiedere il voto dell'Acciaieria"
        descrizione: "L'Acciaieria l'ha comprata la Gilda, cioè i magazzini. Chi la amministra vota come gli dice Morlacchi."
        quando: [gilda.giro-tarvelin == 0]
        requisiti: [pista.acciaio >= 4, acciaieria.futuro == 1]
        esito:
          titolo: L'amministratore
          testo: |
            L'amministratore dell'Acciaieria ti riceve con molta cortesia e
            ti offre un bicchiere di vino di Laresh. Poi ti spiega che i
            proprietari hanno già deciso, e che i proprietari sono i
            magazzini di scarico. Bevi il vino e te ne vai.
          effetti: { gilda.giro: 1, gilda.giro-tarvelin: 1 }
      - testo: "Andare nel salotto di Isotta Cordani"
        descrizione: "Nei Quartieri Alti la calunnia di Morlacchi gira nei salotti. Nel salotto di Isotta la si può fermare, se si sa parlare."
        quando: [gilda.giro-salotto == 0]
        prova: { attributo: sociale, abilita: [espressivita, empatia], difficolta: Media }
        successo:
          titolo: Il ventaglio
          testo: |
            Nel salotto di Isotta Cordani racconti la storia del levriero di
            famiglia che ruba i guanti alle signore, e la sala ride. Poi,
            quando qualcuno nomina il teatrante, dici che a teatro ci va
            mezza città e che i conti della Gilda li tiene la Casa, e non un
            palco. Isotta chiude il ventaglio. La calunnia, da quella sera,
            gira meno.
          pe: { espressivita: 3 }
          effetti: { gilda.giro: 1, gilda.giro-salotto: 1, gilda.voti: 1, rep.gilda: 0.5 }
        fallimento:
          titolo: Il ventaglio aperto
          testo: |
            Provi a difendere il Sovrintendente, ma lo fai troppo, e una
            signora con il ventaglio ti chiede perché ci tieni tanto. La
            sala sorride. Isotta Cordani ti ringrazia per la visita, e la
            calunnia, da quella sera, gira con un pezzo in più.
          effetti: { gilda.giro: 1, gilda.giro-salotto: 1, scandalo: 0.5 }
      - testo: "Portare Orazio Belcanto nel salotto di Isotta"
        descrizione: "Al Teatro ti devono qualcosa. Se il teatrante della calunnia parla di persona, la calunnia diventa uno spettacolo."
        quando: [gilda.giro-salotto == 0]
        requisiti: [rep.teatro >= 4]
        esito:
          immagine: personaggi/orazio-belcanto
          titolo: Il teatrante
          testo: |
            Orazio Belcanto entra nel salotto di Isotta con un anello a ogni
            dito e recita la calunnia di Morlacchi come una commedia, con le
            voci di tutti. La sala ride fino alle lacrime. Isotta Cordani
            alza il ventaglio, e dietro il ventaglio sorride anche lei. Da
            quella sera nessuno ripete più quella storia senza sentirsi
            ridicolo.
          effetti: { gilda.giro: 1, gilda.giro-salotto: 1, gilda.voti: 1, rep.gilda: 0.5, rep.teatro: 0.5 }
      - testo: "Chiedere il voto a Corin Ashdale"
        descrizione: "Corin vota come gli chiedi tu. Bisogna soltanto trovarlo, e al Grifone si fa sera."
        immagine: personaggi/corin-ashdale
        quando: [gilda.giro-corin == 0]
        requisiti: [pista.corin < 6]
        costo: 2
        esito:
          titolo: Al Grifone
          testo: |
            Trovi Corin al Grifone a mezzanotte, mentre offre da bere a un
            tavolo di Raschiatori che non conosce. Ti abbraccia e ti
            promette il suo voto prima ancora che tu lo chieda, poi te lo
            promette di nuovo, più forte, perché lo sentano tutti.
          effetti: { gilda.giro: 1, gilda.giro-corin: 1, gilda.voti: 1, rep.gilda: 0.5 }
      - testo: "Scrivere a Corin Ashdale"
        descrizione: "Corin è lontano, ma il suo voto vale anche per lettera. Bisogna scrivergli bene, e aspettare la risposta."
        immagine: personaggi/corin-ashdale
        quando: [gilda.giro-corin == 0]
        requisiti: [pista.corin >= 6]
        costo: 2
        esito:
          titolo: Per lettera
          testo: |
            Gli scrivi una lettera lunga, e la risposta arriva in tre giorni
            con un corriere di Laresh, su una carta che sa di fieno. Corin
            scrive che vota con te e ti manda i saluti di mezza Laresh. In
            fondo alla lettera ha disegnato un cavallo, piuttosto male.
          effetti: { gilda.giro: 1, gilda.giro-corin: 1, gilda.voti: 1, rep.gilda: 0.5 }
      - testo: "Visitare le vecchie famiglie come uno di loro"
        descrizione: "Tu nei salotti delle vecchie famiglie ci sei cresciuto. Sai quale nonno nominare in ogni casa."
        quando: [gilda.giro-famiglie == 0, origine.rampollo-dei-quartieri-alti >= 1]
        esito:
          titolo: A casa
          testo: |
            Visiti le vecchie famiglie del Patto come visitavi da bambino
            gli amici di tuo padre, e in ogni casa nomini il nonno giusto
            con il tono giusto. Ti offrono il tè nelle tazze buone. Le
            famiglie del Patto voteranno con te.
          pe: { galateo: 3 }
          effetti: { gilda.giro: 1, gilda.giro-famiglie: 1, gilda.voti: 1, rep.gilda: 0.5 }

  - id: gilda-le-corde-toccate
    presso: ponte-delle-mille-corde
    immagine: ambientazione/ponti-sospesi
    titolo: Le corde toccate
    sommario: "La sera, sulle Mille Corde, Ormun Pell ti ferma con la pipa spenta fra i denti. Qualcuno ha toccato le corde della campata centrale."
    luogo: Ponte delle Mille Corde, la sera
    area: ponti-sospesi
    requisiti: [fazione.gilda == 12, gilda.giro >= 3]
    testo: |
      La sera torni alla Casa dei Nodi passando dalle Mille Corde, con i
      piedi stanchi delle visite e la testa piena di nomi. A metà della
      campata centrale Ormun Pell ti sbarra la strada con un braccio. Ha la
      pipa spenta fra i denti e una lanterna in mano, e la barba legata è
      piena di segatura.

      «Qualcuno ha toccato le corde» dice, e ti porta al parapetto. Sotto
      l'impalcato le funi portanti della campata centrale corrono verso il
      pilone, grosse come cosce. Su una, a due braccia dal parapetto, c'è un
      segno di gesso. «Questo non l'ho fatto io» dice Ormun. «E io segno
      tutto.»

      {tecnologia Media} Un segno di gesso su una fune portante serve a
      ritrovare un punto al buio. Si segna dove si vuole tagliare, quando si
      torna con il segaccio.

      {origine apprendista-raschiatore} Le corde le leggi come le corde
      della piattaforma, che a fine turno si guardano tutte, una per una.
      Questa ha la fibra pettinata intorno al segno, dove qualcuno l'ha già
      provata con la lama.

      Il ponte vibra sotto i carri della sera, come sempre. Fra due giorni
      si vota.
    opzioni:
      - testo: "Guardare la fune da vicino"
        descrizione: "Sporgendosi dal parapetto, con Ormun che ti tiene per la cintura."
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Media }
        successo:
          titolo: La lama provata
          testo: |
            Ti sporgi con Ormun che ti tiene per la cintura e guardi il
            segno alla luce della lanterna. La fibra è pettinata, segno che
            qualcuno ha provato la lama per vedere quanto è dura. Ci sono
            segni uguali su altre due funi, che portano anche loro la
            campata centrale. Ormun bestemmia a lungo, in nanico.
          pe: { tecnologia: 3 }
          effetti: { rep.gilda: 0.5, fazione.gilda: 1 }
        fallimento:
          titolo: Il gesso
          testo: |
            Ti sporgi, e la lanterna ti scivola di mano e cade nella
            Cicatrice. Ormun ti tira su per la cintura e dice che il segno
            l'ha visto lui, e che ne ha trovati altri due, sulle funi che
            portano la campata. Poi ti chiede chi gli ripaga la lanterna.
          effetti: { rep.ponti: -0.5, fazione.gilda: 1 }
      - testo: "Chiedere a Ormun chi può essere stato"
        descrizione: "Ormun chiude un occhio su tante cose, sui ponti. Su questa, forse, ne apre due."
        prova: { attributo: sociale, abilita: [conoscenze-della-strada, empatia], difficolta: Media }
        successo:
          titolo: Il segaccio
          testo: |
            Ormun ci pensa con la pipa spenta in bocca. Poi ti dice che un
            segno così lo fanno i chiattaioli, quelli delle chiatte grandi,
            che le funi le conoscono quanto lui. «Quelli di Bracco» dice.
            «Come con la Mula.» Ti lascia la lanterna e se ne va a svegliare
            la sua squadra.
          pe: { conoscenze-della-strada: 3 }
          effetti: { rep.gilda: 0.5, fazione.gilda: 1 }
        fallimento:
          titolo: Un occhio chiuso
          testo: |
            Ormun ti risponde che sui ponti ognuno guarda le sue corde, e
            che lui ne ha già troppe da guardare. Poi ti lascia la lanterna,
            dicendo che stanotte la campata la guardi tu, e se ne va. Hai
            fatto la domanda sbagliata a un uomo stanco.
          effetti: { tormento: 0.5, fazione.gilda: 1 }
      - testo: "Andare a chiamare Varn"
        descrizione: "Varn scrive tutto e non sbaglia mai una riga. Ci vuole tempo per trovarlo, a quest'ora."
        costo: 2
        esito:
          titolo: La notte di Varn
          testo: |
            Trovi Varn a casa, in camicia da notte e stivali da pioggia.
            Viene sul ponte a guardare il segno, e scrive sull'aria per un
            tempo lungo. Poi dice che le funi segnate sono tre, e che le
            chiatte grandi di Bracco sono ormeggiate sotto la campata da due
            giorni.
          effetti: { rep.gilda: 0.5, fazione.gilda: 1 }

  # ------------------------------------------------------------ passo 14 · la notte prima del voto
  - id: gilda-la-notte-prima-del-voto
    presso: ponte-delle-mille-corde
    immagine: ambientazione/ponti-sospesi
    titolo: La notte prima del voto
    sommario: "La notte prima del voto Ugo Bracco e i suoi chiattaioli sono sulla campata centrale delle Mille Corde, con i segacci. All'alba ci passerà il primo carro."
    luogo: Ponte delle Mille Corde, la notte prima del voto
    area: ponti-sospesi
    requisiti: [fazione.gilda == 13]
    testo: |
      Dopo la seconda campana la campata centrale delle Mille Corde è vuota,
      e la nebbia della Cicatrice sale fino al parapetto. Sotto l'impalcato,
      appesi alle funi portanti come ragni, ci sono quattro uomini. Uno è
      largo come una porta, con un segaccio da funi in mano e una sbarra
      d'argano alla cintura. È Ugo Bracco, il padrone delle chiatte grandi,
      e sta segando la prima fune a metà, con calma, come ha fatto con la
      fune della Mula.

      Se nessuno interviene, all'alba la campata cederà sotto il primo carro
      del mercato. I soci andranno a votare con il crollo negli occhi, e con
      la manutenzione dei ponti del Sovrintendente sulle labbra.

      {armi-da-mischia Media} Bracco sta appeso con una mano e sega con
      l'altra. Su un'asse stretta, con la sbarra d'argano, è un'altra cosa.
      I suoi uomini hanno ganci da carico, e sono più lenti.

      {atletica Difficile} Tre funi segate a metà reggono finché non passa
      un carro. Una campata si può tenere su con le funi di servizio e un
      argano, se si comincia subito e non si smette fino all'alba.

      Dietro di te, nella nebbia, arrivano i passi pesanti di qualcuno. Sono
      i ponteggiatori di Ormun, con le funi sulle spalle.
    opzioni:
      - testo: "Scendere sulle funi e affrontare Bracco"
        descrizione: "Bracco e due chiattaioli, appesi sotto il ponte. È il modo più breve, ed è il più duro."
        combattimento: gilda-la-notte-prima-del-voto
        vittoria:
          titolo: La sbarra d'argano
          testo: |
            Scendi sulle funi e li affronti appesi sopra il vuoto. Il primo
            chiattaiolo molla la presa e si salva su una fune di servizio,
            il secondo scappa verso il pilone. Bracco ti viene addosso con
            la sbarra d'argano, e alla fine è lui a restare appeso con una
            mano sola, il segaccio perduto nella Cicatrice e la faccia rossa
            per lo sforzo.
          pe: { armi-da-mischia: 5 }
          segue: gilda-bracco-appeso
        sconfitta:
          titolo: La campata a metà
          testo: |
            Bracco ti colpisce con la sbarra d'argano e ti manda contro una
            fune, dove resti appeso a fatica. I chiattaioli finiscono il
            lavoro e se ne vanno nella nebbia. All'alba la campata cede a
            metà sotto il primo carro, che resta in bilico sul vuoto con i
            muli che gridano. Nessuno muore, per poco. Al voto i soci ne
            parlano tutti.
          imposta: { gilda.bracco: 3 }
          effetti: { gilda.voti: -2, rep.ponti: -0.5, fazione.gilda: 1 }
      - testo: "Reggere il ponte con i ponteggiatori fino all'alba"
        descrizione: "Le funi di servizio sull'argano di Ormun, con tutte le braccia che hai. Bracco scapperà, ma la campata resterà su."
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Difficile }
        successo:
          titolo: Le funi di servizio
          testo: |
            Tiri le funi di servizio insieme ai ponteggiatori, e Ormun le
            avvolge all'argano. Bracco vi vede e scappa con i suoi verso le
            chiatte. Per tutta la notte tirate, e la campata si raddrizza di
            un palmo alla volta, mentre le funi segate cigolano come porte.
            Verso l'alba qualcuno deve legare le funi nuove al posto giusto.
          pe: { atletica: 5 }
          segue: gilda-l-alba-sulla-campata
        fallimento:
          titolo: Le braccia
          testo: |
            Tirate per tutta la notte, ma alle tre le braccia ti cedono e
            una fune di servizio ti scappa dalle mani, bruciandoti i palmi.
            La campata scende di un braccio. All'alba cede a metà sotto il
            primo carro, e il carro resta in bilico sul vuoto. Bracco
            intanto è sparito con le sue chiatte.
          imposta: { gilda.bracco: 3 }
          effetti: { ferite: 2, gilda.voti: -2, fazione.gilda: 1 }
      - testo: "Staccare i chiattaioli dal padrone"
        descrizione: "Bracco paga il giovedì. Domani è venerdì, e la Caserma sale sui ponti all'alba."
        prova: { attributo: sociale, abilita: intimidire, difficolta: Difficile }
        successo:
          titolo: Il giovedì
          testo: |
            Ti sporgi dal parapetto e parli ai chiattaioli, non a Bracco.
            Gli dici che la Caserma sale all'alba e che chi è appeso a
            quelle funi ci resta appeso da solo. Il primo molla il gancio e
            risale. Gli altri due lo seguono. Bracco resta da solo sotto il
            ponte, con il segaccio in mano e nessuno a tenergli la fune.
          pe: { intimidire: 5 }
          segue: gilda-bracco-appeso
        fallimento:
          titolo: La risata
          testo: |
            Parli ai chiattaioli, e Bracco ride. Ride così forte che lo
            senti sopra il vento. I chiattaioli finiscono il lavoro e se ne
            vanno. All'alba la campata cede a metà sotto il primo carro, e
            tu sei lì a vederla cedere, con la voce rotta di chi ha gridato
            tutta la notte.
          imposta: { gilda.bracco: 3 }
          effetti: { ferite: 2, gilda.voti: -2, fazione.gilda: 1 }
      - testo: "Arrivargli addosso al buio, con la lanterna cieca"
        descrizione: "Un dito di luce nella nebbia, e Bracco che sega con la testa bassa. Se lo sorprendi da solo, non ha il tempo di chiamare i suoi."
        requisiti: [chiave.notte-sui-ponti >= 1]
        prova: { attributo: fisico, abilita: furtivita, difficolta: Difficile }
        successo:
          titolo: Un dito di luce
          testo: |
            Scendi lungo una fune di servizio con la lanterna cieca aperta
            di un dito, e arrivi alle spalle di Bracco mentre sega. Gli
            metti la lama sotto l'orecchio. I suoi uomini, dall'altra parte
            della campata, non si accorgono di niente finché lui non lascia
            cadere il segaccio.
          pe: { furtivita: 5 }
          segue: gilda-bracco-appeso
        fallimento:
          titolo: Lo sportello
          testo: |
            Lo sportello della lanterna scatta, e Bracco si volta. Ti
            colpisce con la sbarra prima che tu arrivi, e mentre ti rialzi i
            chiattaioli finiscono il lavoro. All'alba la campata cede a metà
            sotto il primo carro.
          imposta: { gilda.bracco: 3 }
          effetti: { ferite: 2, gilda.voti: -2, fazione.gilda: 1 }
      - testo: "Lasciar fare"
        descrizione: "L'ordine a Bracco l'hai visto firmare tu, nell'ufficio sopra il magazzino. Morlacchi ricorda chi lo lascia lavorare."
        requisiti: [gilda.via == 3]
        costo: 0
        esito:
          titolo: Il primo carro
          testo: |
            Resti al parapetto e guardi Bracco segare, finché lui alza la
            testa e ti saluta con il segaccio. Poi te ne vai. All'alba la
            campata cede a metà sotto il primo carro, un carro di verdura
            della Città Bassa, e il carrettiere resta appeso alla stanga per
            un tempo lunghissimo prima che qualcuno lo tiri su. Al voto i
            soci di Morlacchi ne parlano tutti.
          imposta: { gilda.bracco: 4 }
          effetti: { tormento: 1, gilda.voti: -2, monete: 30, fazione.gilda: 1 }

  - id: gilda-l-alba-sulla-campata
    presso: ponte-delle-mille-corde
    immagine: icone/rope-bridge
    titolo: L'alba sulla campata
    tipo: seguito
    luogo: Ponte delle Mille Corde, verso l'alba
    area: ponti-sospesi
    requisiti: [fazione.gilda == 13]
    testo: |
      Verso l'alba la campata è di nuovo dritta, tenuta su dalle funi di
      servizio avvolte all'argano di Ormun. Ma le funi di servizio non sono
      fatte per reggere un carro. Bisogna legare le tre funi nuove al posto
      di quelle segate, sotto l'impalcato, prima che passi il primo carro
      del mercato. Ormun ha le mani a pezzi, e i suoi uomini dormono in
      piedi.

      {tecnologia Difficile} Il nodo è quello da carico, sotto un peso che
      cambia a ogni raffica. Se lo stringi dalla parte sbagliata, regge fino
      al primo carro e poi scivola.

      In fondo al ponte, dalla parte della Città Bassa, si sente già il
      rumore delle ruote.
    opzioni:
      - testo: "Legare le funi nuove"
        descrizione: "Tre nodi da carico, appeso sotto l'impalcato, con il carro in arrivo."
        prova: { attributo: mentale, abilita: [tecnologia, accademiche], difficolta: Difficile }
        successo:
          titolo: Il primo carro
          testo: |
            Leghi la terza fune mentre le ruote del primo carro sono già
            sulla campata. Il ponte trema e cigola, ma regge. Il carrettiere
            passa sopra la tua testa fischiettando, senza sapere niente.
            Ormun ti tira su per la cintura e ti offre la sua pipa, accesa
            per la prima volta da quando lo conosci. Bracco, all'alba, è
            sparito oltre la Cicatrice con le sue chiatte.
          pe: { tecnologia: 5 }
          imposta: { gilda.bracco: 3 }
          effetti: { monete: 20, rep.ponti: 1, gilda.voti: 1, racconto: 1, rep.gilda: 0.5, fazione.gilda: 1 }
        fallimento:
          titolo: Il nodo che scivola
          testo: |
            Il terzo nodo scivola quando passa il primo carro, e la campata
            scende di un braccio con un rumore che sveglia mezzo quartiere.
            Il carro resta in bilico, il carrettiere salta giù, e i muli
            gridano. Nessuno cade. Al voto i soci ne parlano tutti.
          imposta: { gilda.bracco: 3 }
          effetti: { ferite: 1, gilda.voti: -1, fazione.gilda: 1 }
      - testo: "Chiudere il ponte finché Ormun non lega le funi"
        descrizione: "Un ponte chiuso il giorno del voto fa parlare. Un ponte crollato fa parlare di più."
        prova: { attributo: sociale, abilita: [intimidire, persuasione], difficolta: Media }
        successo:
          titolo: Il ponte chiuso
          testo: |
            Ti pianti all'imbocco della campata e fermi i carri, uno dopo
            l'altro, con la voce del portasigillo. I carrettieri bestemmiano
            ma si fermano. Ormun lega le funi con le ultime forze, e a metà
            mattina il ponte riapre. Bracco è sparito oltre la Cicatrice.
          pe: { intimidire: 3 }
          imposta: { gilda.bracco: 3 }
          effetti: { monete: 20, rep.ponti: 1, rep.gilda: 0.5, fazione.gilda: 1 }
        fallimento:
          titolo: La coda dei carri
          testo: |
            Provi a fermare i carri, ma il primo carrettiere ti passa
            accanto con la frusta alzata, e il ponte scende di un braccio
            sotto le sue ruote. Ormun salva la campata all'ultimo momento, e
            la coda dei carri arriva fino alla Città Bassa. Al voto se ne
            parlerà in tutta la sala.
          imposta: { gilda.bracco: 3 }
          effetti: { gilda.voti: -1, fazione.gilda: 1 }

  - id: gilda-bracco-appeso
    presso: ponte-delle-mille-corde
    immagine: icone/pulley-hook
    titolo: Bracco appeso
    tipo: seguito
    luogo: Ponte delle Mille Corde, sotto la campata centrale
    area: ponti-sospesi
    requisiti: [fazione.gilda == 13]
    testo: |
      Ugo Bracco è appeso a una fune portante con una mano sola, sopra la
      nebbia della Cicatrice. Il segaccio non ce l'ha più, e la sbarra
      d'argano gli pende dalla cintura, inutile. Ti guarda con la faccia
      rossa per lo sforzo, e ride, perché è l'unica cosa che può fare.

      «Il nome lo sai» dice. «Te lo dico lo stesso, se mi tiri su. Le dita
      guantate. Paga bene, e paga il giovedì, come me.» La mano gli scivola
      di un dito sulla fune.

      {empatia Media} Ha paura, ma non del vuoto. Ha paura di quello che
      succede se lo tiri su e lo porti alla Caserma, davanti alla gente
      dell'approdo.

      Sopra di voi, sulla campata, i ponteggiatori di Ormun stanno già
      legando le funi nuove. All'alba manca poco.
    opzioni:
      - testo: "Tirarlo su e consegnarlo a Varn"
        descrizione: "Varn lo scrive, la Caserma lo chiude. All'approdo lo sapranno prima di mezzogiorno."
        esito:
          titolo: In catene
          testo: |
            Lo tiri su per il bavero, e lui si lascia legare senza opporre
            resistenza, pesante come un sacco di sale. All'alba lo consegni
            a Varn, che lo scrive sull'aria e poi sul registro della
            Caserma. Nella cassa che Bracco tiene sulla chiatta trovate
            monete e un ordine con il sigillo dei magazzini di scarico,
            senza firma.
          pe: { atletica: 3 }
          imposta: { gilda.bracco: 1 }
          effetti: { monete: 20, rep.ponti: 1, rep.caserma: 0.5, gilda.voti: 1, rep.gilda: 0.5, fazione.gilda: 1 }
      - testo: "Lasciarlo cadere"
        descrizione: "Ha segato la fune della Mula, e stanotte quella delle Mille Corde. La Cicatrice è lì sotto."
        esito:
          titolo: La nebbia
          testo: |
            Non lo tiri su. Lo guardi mentre le dita gli scivolano sulla
            fune una dopo l'altra, e poi la nebbia se lo prende senza un
            rumore. Resti appeso al tuo posto finché i ponteggiatori non ti
            chiamano. Nella cassa della sua chiatta trovate monete e un
            ordine con il sigillo dei magazzini. Alla Pignatta nessuno
            chiederà di lui.
          imposta: { gilda.bracco: 2 }
          effetti: { monete: 20, rep.ponti: 1, tormento: 1, gilda.voti: 1, rep.gilda: 0.5, fazione.gilda: 1 }
      - testo: "Lasciarlo andare oltre la Cicatrice"
        descrizione: "Tiralo su, e lascialo scappare con una chiatta. Un uomo che deve la vita a qualcuno non torna facilmente."
        esito:
          titolo: Oltre la Cicatrice
          testo: |
            Lo tiri su e lo lasci andare. Bracco ti guarda come non si
            aspettava di guardarti, poi scende all'approdo, slega una
            chiatta piccola e se ne va lungo il cavo verso l'altra sponda.
            Nella cassa della sua chiatta grande trovate monete e un ordine
            con il sigillo dei magazzini. Ilde, quando lo saprà, non ti
            parlerà per una settimana.
          imposta: { gilda.bracco: 3 }
          effetti: { monete: 20, rep.ponti: 0.5, gilda.voti: 1, rep.gilda: 0.5, fazione.gilda: 1 }

  # ------------------------------------------------------------ passo 15 · il terzo piano
  - id: gilda-il-voto-dei-nodi
    presso: gilda-casa-dei-nodi
    immagine: icone/knot
    titolo: Il voto dei nodi
    sommario: "Alla Casa dei Nodi si elegge il Sovrintendente con un nodo sulla corda di ciascun candidato. Parlano Cordani e Morlacchi, e per ultimo parli tu."
    luogo: Casa dei Nodi, la sala del voto
    area: quartieri-alti
    requisiti: [fazione.gilda == 14]
    testo: |
      Nella sala dei soci hanno teso tre corde nuove, una accanto all'altra,
      dalla trave al pavimento. Su ognuna c'è il cartellino con il nome di
      un candidato, e i soci ci faranno un nodo di cera verde, uno a testa,
      come nel 118. Sulle prime due ci sono i nomi di Cordani e di
      Morlacchi. La terza è per Irsa Valbrun, che l'ala delle botteghe ha
      voluto candidare per ogni evenienza.

      Cordani parla per primo, con le mani ferme sul leggio, e parla poco.
      Morlacchi parla a lungo, contando i suoi argomenti sulle dita
      guantate, e alla fine dell'ultimo dito la sala applaude. Tocca a te,
      come membro eletto che ha portato i libri.

      {espressivita Media} La sala è piena di gente che ha già deciso e di
      gente che aspetta di sentirsi dire che cosa ha deciso. Parla a questi
      ultimi.

      {politica-ed-economia Media} I voti che hai raccolto sono lì, in piedi
      fra gli altri. Ognuno porta con sé quello di un vicino, se lo guardi
      mentre parli.

      {origine mercante-dei-ponti} Hai pagato la commissione a questa Casa
      per anni, al banco, ogni mese, senza mai entrare nella sala del voto.
      Adesso i mercanti del tuo ponte sono seduti in prima fila e ti
      guardano.
    opzioni:
      - testo: "Parlare per Cordani"
        descrizione: "Con i libri in mano e pochi voti alle spalle. Bisogna convincere la sala da capo."
        requisiti: [gilda.127 != 1, gilda.voti < 5]
        prova: { attributo: sociale, abilita: [persuasione, espressivita], difficolta: Difficile }
        successo:
          titolo: La corda di Cordani
          testo: |
            Parli dei noli fantasma e del grano di Laresh, e della fune
            segata sotto le Mille Corde, senza alzare la voce. La sala
            ascolta. Quando si comincia a votare, i nodi sulla corda di
            Cordani salgono uno sopra l'altro fino alla trave. Morlacchi si
            toglie i guanti, per la prima volta da quando lo conosci.
          pe: { persuasione: 10 }
          imposta: { gilda.esito: 1 }
          segue: gilda-la-sala-del-terzo-piano
        fallimento:
          titolo: La corda di Morlacchi
          testo: |
            Parli, ma la sala ha già sentito Morlacchi, e i tuoi argomenti
            arrivano dopo i suoi, come un carro in coda. I nodi sulla corda
            di Morlacchi salgono fino alla trave. Cordani si alza e gli
            stringe la mano, con le mani ferme.
          imposta: { gilda.esito: 3 }
          segue: gilda-la-sala-del-terzo-piano
      - testo: "Parlare per Cordani, con i tuoi voti in sala"
        descrizione: "I soci che hai raccolto sono in piedi fra gli altri. Basta guardarli mentre parli."
        requisiti: [gilda.127 != 1, gilda.voti >= 5, gilda.voti < 8]
        prova: { attributo: sociale, abilita: [persuasione, espressivita], difficolta: Media }
        successo:
          titolo: La corda di Cordani
          testo: |
            Parli guardando i tuoi uno alla volta, e ognuno di loro si volta
            verso il vicino. Quando si comincia a votare, i nodi sulla corda
            di Cordani salgono fino alla trave. Morlacchi si toglie i
            guanti, per la prima volta da quando lo conosci, e li posa sulla
            panca.
          pe: { persuasione: 10 }
          imposta: { gilda.esito: 1 }
          segue: gilda-la-sala-del-terzo-piano
        fallimento:
          titolo: La corda di Morlacchi
          testo: |
            Parli, ma a metà del discorso ti si spezza la voce, e la sala se
            ne accorge. I tuoi votano con te, gli altri con Morlacchi, e gli
            altri sono di più. I nodi sulla sua corda salgono fino alla
            trave.
          imposta: { gilda.esito: 3 }
          segue: gilda-la-sala-del-terzo-piano
      - testo: "Parlare per Cordani, con mezza sala dalla tua"
        descrizione: "Hai fatto il giro dei soci fino all'ultimo salotto. La sala aspetta soltanto che tu dica quello che sa già."
        requisiti: [gilda.127 != 1, gilda.voti >= 8]
        prova: { attributo: sociale, abilita: [persuasione, espressivita], difficolta: Facile }
        successo:
          titolo: La corda di Cordani
          testo: |
            Parli poco, perché non serve parlare molto. Quando si comincia a
            votare, i nodi sulla corda di Cordani salgono così in fretta che
            il cancelliere deve mandare a prendere altra cera. Morlacchi si
            toglie i guanti e li posa sulla panca.
          pe: { persuasione: 10 }
          imposta: { gilda.esito: 1 }
          segue: gilda-la-sala-del-terzo-piano
        fallimento:
          titolo: Per un nodo
          testo: |
            Inciampi su una frase, e qualcuno ride. I nodi salgono sulle due
            corde quasi alla pari, e il cancelliere li conta tre volte prima
            di dire che Morlacchi ha vinto per un nodo.
          imposta: { gilda.esito: 3 }
          segue: gilda-la-sala-del-terzo-piano
      - testo: "Parlare per Irsa Valbrun"
        descrizione: "Cordani ha pubblicato il documento del 127 e si è ritirato. La corda di Irsa è la terza, e ha pochi nodi."
        requisiti: [gilda.127 == 1, gilda.voti < 5]
        prova: { attributo: sociale, abilita: [persuasione, espressivita], difficolta: Difficile }
        successo:
          titolo: La terza corda
          testo: |
            Cordani si è ritirato con una frase sola, e la sala è ancora
            scossa dal documento di suo nonno. Parli di Irsa e delle
            botteghe, e delle mani che lei guarda prima degli occhi. Quando
            si vota, i nodi salgono sulla terza corda fino alla trave, e
            Irsa si toglie il grembiule per la prima volta da quando la
            conosci.
          pe: { persuasione: 10 }
          imposta: { gilda.esito: 2 }
          segue: gilda-la-sala-del-terzo-piano
        fallimento:
          titolo: La seconda corda
          testo: |
            Parli di Irsa, ma la sala vuole sentire parlare del documento, e
            tu non sai che cosa dirne. I nodi salgono sulla corda di
            Morlacchi. Irsa ti stringe la mano e ti dice che ci hai provato.
          imposta: { gilda.esito: 3 }
          segue: gilda-la-sala-del-terzo-piano
      - testo: "Parlare per Irsa Valbrun, con i tuoi voti in sala"
        descrizione: "I tuoi voti sono in piedi fra gli altri. Basta portarli sulla terza corda."
        requisiti: [gilda.127 == 1, gilda.voti >= 5]
        prova: { attributo: sociale, abilita: [persuasione, espressivita], difficolta: Media }
        successo:
          titolo: La terza corda
          testo: |
            Parli di Irsa guardando i tuoi uno alla volta, e i tuoi guardano
            i loro vicini. Quando si vota, i nodi salgono sulla terza corda
            fino alla trave. Irsa si toglie il grembiule e va a sedersi dove
            sedeva Cordani.
          pe: { persuasione: 10 }
          imposta: { gilda.esito: 2 }
          segue: gilda-la-sala-del-terzo-piano
        fallimento:
          titolo: La seconda corda
          testo: |
            Parli di Irsa, ma la sala è ancora scossa dal documento, e i
            nodi si dividono. Quelli di Morlacchi sono di più. Irsa ti
            stringe la mano e ti dice che ci hai provato.
          imposta: { gilda.esito: 3 }
          segue: gilda-la-sala-del-terzo-piano
      - testo: "Parlare per Morlacchi"
        descrizione: "La via venduta arriva fin qui. Lui ha i voti, tu hai le parole, e la sala sa già chi vincerà."
        requisiti: [gilda.via == 3]
        esito:
          titolo: Le dita guantate
          testo: |
            Parli per Morlacchi, e la sala ti ascolta con l'attenzione che
            si dà a chi ha già vinto. I nodi salgono sulla sua corda fino
            alla trave. Cordani si alza, stringe la mano a Morlacchi e poi,
            per la prima volta da mesi, la stringe anche a te, senza
            guardarti.
          imposta: { gilda.esito: 3 }
          segue: gilda-la-sala-del-terzo-piano
      - testo: "Tradire Morlacchi all'ultimo"
        descrizione: "Lui crede che parlerai per lui. Se invece leggi davanti a tutti l'ordine dei magazzini, la sala cambia corda."
        requisiti: [gilda.via == 3]
        prova: { attributo: sociale, abilita: [ingannare, espressivita], difficolta: Difficile }
        successo:
          titolo: L'ordine letto
          testo: |
            Sali sul leggio e invece del discorso leggi l'ordine dei
            magazzini per il cavo della chiatta, con il sigillo bene in
            vista, e dopo l'ordine i noli fantasma. Morlacchi resta immobile
            al suo posto, mentre la sala intorno a lui comincia a muoversi.
            I nodi salgono sulla corda di Cordani fino alla trave, e
            Morlacchi esce dalla porta di servizio senza i guanti.
          pe: { ingannare: 10 }
          imposta: { gilda.esito: 1 }
          segue: gilda-la-sala-del-terzo-piano
        fallimento:
          titolo: Il foglio tremante
          testo: |
            Tiri fuori l'ordine dei magazzini, ma ti trema la mano, e
            Morlacchi dice ad alta voce che quel foglio l'hai scritto tu. La
            sala gli crede. I nodi salgono sulla sua corda fino alla trave,
            e lui ti sorride come si sorride a un debitore.
          imposta: { gilda.esito: 3 }
          effetti: { scandalo: 1 }
          segue: gilda-la-sala-del-terzo-piano

  - id: gilda-la-sala-del-terzo-piano
    presso: gilda-casa-dei-nodi
    immagine: fazioni/gilda-dei-mercanti
    titolo: La sala del terzo piano
    tipo: seguito
    luogo: Casa dei Nodi, la sala del terzo piano
    area: quartieri-alti
    requisiti: [fazione.gilda == 14, gilda.esito >= 1]
    testo: |
      Alla sera del voto la sala del terzo piano si riempie, e per la prima
      volta ci entri dalla porta grande, quella che si chiude da dentro con
      il chiavistello di ferro. Il tavolo ovale ha sette sedie di cuoio. Il
      Sovrintendente siede a capotavola, e una delle sedie è vuota, con
      sopra una catena d'argento a maglie piatte e un nodo d'oro al posto
      del fermaglio.

      Sullo schienale della sedia vuota qualcuno ha appeso una cappa di
      cuoio scuro, foderata con l'intreccio di funi antiche. Le funi sono
      quelle del Patto, le stesse che i tiracorde annodarono nel 118 al
      posto del nome. In città quella cappa la conoscono tutti.

      {galateo Media} Al terzo piano nessuno si siede prima che il
      Sovrintendente abbia posato le mani sul tavolo. Le guardi, e aspetti.

      {politica-ed-economia Media} Una sedia al consiglio interno vale più
      di qualunque licenza. Da qui passano i dazi e i sigilli, e soprattutto
      le decisioni che nessuno scrive.
    opzioni:
      - testo: "Sedere accanto a Tarquin Cordani"
        descrizione: "Cordani è Sovrintendente per altri cinque anni. La sedia è quella che Morlacchi ha dovuto lasciare."
        requisiti: [gilda.esito == 1]
        esito:
          titolo: Il consigliere
          testo: |
            Cordani posa le mani ferme sul tavolo e ti indica la sedia che è
            stata di Morlacchi. Ti siedi. Irsa ti mette la catena al collo
            con le sue mani da armaiola, e Varn scrive il tuo nome
            sull'aria, poi su un foglio vero, che firma. Lira ti consegna la
            chiave della sala. La cappa è tua, e la borsa che il tesoriere
            ti spinge davanti è la più pesante che la Casa abbia mai pagato
            a un socio.

            «Il commercio può servire la città oltre che il profitto» dice
            Cordani, e per la prima volta lo dice a qualcuno che gli crede.
          pe: { politica-ed-economia: 10 }
          almeno: { rep.gilda: 10 }
          imposta: { gilda.consigliere: 1 }
          effetti: { oggetto.gilda-cappa-delle-mille-corde: 1, oggetto.gilda-catena-del-terzo-piano: 1, monete: 350, racconto: 1, fazione.gilda: 1 }
      - testo: "Sedere accanto a Irsa Valbrun"
        descrizione: "Irsa è Sovrintendente, Cordani si è ritirato. La sedia è quella che Irsa ha lasciato per la capotavola."
        requisiti: [gilda.esito == 2]
        esito:
          titolo: Il consigliere
          testo: |
            Irsa siede a capotavola con il grembiule piegato sulle
            ginocchia, e ti indica la sua vecchia sedia. Ti siedi. Cordani,
            che è venuto da semplice socio, ti mette la catena al collo e ti
            stringe la mano. Varn scrive il tuo nome sull'aria, Lira ti
            consegna la chiave della sala. La cappa è tua, e la borsa che il
            tesoriere ti spinge davanti è la più pesante che la Casa abbia
            mai pagato a un socio.

            «Prima ti guardo, poi ti eleggo» dice Irsa, e tutta la sala
            ride.
          pe: { politica-ed-economia: 10 }
          almeno: { rep.gilda: 10 }
          imposta: { gilda.consigliere: 1 }
          effetti: { oggetto.gilda-cappa-delle-mille-corde: 1, oggetto.gilda-catena-del-terzo-piano: 1, monete: 350, racconto: 1, fazione.gilda: 1 }
      - testo: "Sedere in minoranza, di fronte a Morlacchi"
        descrizione: "Morlacchi è Sovrintendente. La sedia te la lascia Cordani, che esce dal terzo piano."
        requisiti: [gilda.esito == 3]
        esito:
          titolo: In minoranza
          testo: |
            Morlacchi siede a capotavola e posa i guanti sul tavolo, accanto
            alle mani. Cordani si alza dalla sua sedia, ti mette la catena
            al collo e te la cede. «Tienila calda» dice, ed esce dalla porta
            grande. Ti siedi di fronte a Morlacchi. Varn scrive il tuo nome
            sull'aria. La cappa è tua, e la borsa del tesoriere è pesante,
            anche se Morlacchi l'ha contata sulle dita prima di dartela.

            Da domani al terzo piano sarete in due a contare. Lui sulle
            dita, tu nei libri.
          pe: { politica-ed-economia: 10 }
          almeno: { rep.gilda: 10 }
          imposta: { gilda.consigliere: 1 }
          effetti: { oggetto.gilda-cappa-delle-mille-corde: 1, oggetto.gilda-catena-del-terzo-piano: 1, monete: 300, racconto: 1, fazione.gilda: 1 }

  # ------------------------------------------------------------ la coda · il seggio dei Malgrani
  - id: gilda-il-seggio-dei-malgrani
    presso: gilda-casa-dei-nodi
    immagine: fazioni/consiglio-di-qir-azel
    titolo: Il seggio dei Malgrani
    sommario: "Il Consiglio di Qir-Azel ha dato il seggio dei Malgrani alla Gilda. Al terzo piano lo festeggiano, e qualcuno comincia già a contare."
    luogo: Casa dei Nodi, la sala del terzo piano
    area: quartieri-alti
    requisiti: [fazione.gilda >= 15, seggio.malgrani == 2, gilda.seggio == 0]
    testo: |
      La notizia arriva al terzo piano con un messo del Municipio, un
      ragazzo con il cappello in mano che legge il foglio a voce alta senza
      alzare gli occhi. Il seggio che i Malgrani avevano in Consiglio, da
      oggi, è della Gilda. In Consiglio per la Gilda siede già Tarquin
      Cordani, e adesso la Casa ha due voci a quel tavolo invece di una.

      Al terzo piano qualcuno stappa una bottiglia di vino di Laresh, e
      qualcuno, dall'altra parte del tavolo, comincia a contare chi siederà
      sulla seconda sedia. Il grano che i Malgrani macinavano, le segherie,
      i mulini, adesso passano tutti da questa stanza.

      {politica-ed-economia Media} Due seggi in Consiglio sono un ponte
      nuovo. Chi lo costruisce decide il pedaggio, e la Casa lo sa meglio di
      chiunque.

      {empatia Media} Lira non beve. Guarda la bottiglia, e poi guarda te,
      come la prima volta all'archivio.
    opzioni:
      - testo: "Brindare con il terzo piano"
        descrizione: "È una vittoria della Casa, e la Casa sei anche tu."
        costo: 0
        esito:
          titolo: Il vino di Laresh
          testo: |
            Alzi il bicchiere con gli altri, e il vino di Laresh ti lascia
            in bocca un gusto d'estate. Qualcuno ti batte una mano sulla
            spalla e ti chiama consigliere. Per una sera la Casa dei Nodi
            sembra una di quelle famiglie che litigano a tavola e si
            vogliono bene lo stesso.
          imposta: { gilda.seggio: 1 }
          effetti: { rep.gilda: 0.5 }
      - testo: "Chiedere a Lira che cosa pensa"
        descrizione: "Lira non beve, e i conti che non tornano li mette in una scatola."
        costo: 0
        esito:
          titolo: Un tassello nuovo
          testo: |
            Lira ti porta all'archivio e prende dalla scatola un tassello
            nuovo, a forma di sedia. Lo inchioda sulla costola di un
            registro vuoto. «Fra un anno vedremo» dice. «Due seggi sono due
            bocche da sfamare. Tu tieni i conti, consigliere.» Ti dà il
            registro.
          imposta: { gilda.seggio: 1 }
          effetti: { informazioni.pettegolezzo: 1 }
