# Glossario della quest della Gilda dei Mercanti (fazione.gilda): i personaggi nuovi e quelli della Gilda che
# compaiono nei testi e non avevano ancora una voce. Nel formato di contenuti/glossario/personaggi.yaml: niente
# segreti, e una variante con requisiti complementari quando un fatto della quest cambia il personaggio.
# Nuovi: Ansaldo Morlacchi, Marzio Elleri, Hakkos Cordani (il nonno di Tarquin, nel Codex Hakkos con un altro
# cognome), Cahir e Tasha la Bianca (dal Codex). Senza voce finora: Tarquin Cordani, Lira Demos, Ormun Pell,
# Fabrizio Lodde, Teo Marsan, Ugo Bracco, Ilde Sarrocchi, Clelia Vennari. Cosimo Venn ha già la sua voce
# (contenuti/fazioni/scuri/glossario.yaml).
glossario:
  - id: tarquin-cordani
    nome: Tarquin Cordani
    alias: [Tarquin]
    tipo: personaggio
    sottotitolo: "Sovrintendente della Gilda dei Mercanti"
    testo: "Sovrintendente della Gilda dei Mercanti, come lo fu suo nonno, e la voce della Gilda in Consiglio. Porta sempre una camicia bianca e i polsini con i piccoli sigilli di casa, e quando si arrabbia lo si capisce soltanto dalle mani, che restano ferme sul tavolo. Crede che il commercio possa servire la città oltre che il profitto."
    requisiti: [gilda.esito < 2]

  - id: tarquin-cordani-dopo-il-voto
    nome: Tarquin Cordani
    alias: [Tarquin]
    tipo: personaggio
    sottotitolo: "Socio della Gilda dei Mercanti, già Sovrintendente"
    testo: "Per cinque anni Sovrintendente della Gilda dei Mercanti, come lo fu suo nonno, e la voce della Gilda in Consiglio. Porta sempre una camicia bianca e i polsini con i piccoli sigilli di casa, e quando si arrabbia lo si capisce soltanto dalle mani, che restano ferme sul tavolo. All'ultimo voto della Casa dei Nodi la sedia è andata a un altro."
    requisiti: [gilda.esito >= 2]

  - id: ansaldo-morlacchi
    nome: Ansaldo Morlacchi
    alias: [Morlacchi]
    tipo: personaggio
    sottotitolo: "Consigliere della Gilda per le carovane e i magazzini"
    testo: "Consigliere della Gilda dei Mercanti per le carovane e i magazzini di scarico, i cui uomini portano una livrea propria. Veste giacche di velluto e porta i guanti anche a tavola. È cortese con tutti, non alza mai la voce, e conta ogni cosa sulle dita guantate, le condizioni come i favori."
    requisiti: [gilda.esito < 3]

  - id: ansaldo-morlacchi-sovrintendente
    nome: Ansaldo Morlacchi
    alias: [Morlacchi]
    tipo: personaggio
    sottotitolo: "Sovrintendente della Gilda dei Mercanti"
    testo: "Sovrintendente della Gilda dei Mercanti dall'ultimo voto della Casa dei Nodi, dopo anni da consigliere delle carovane e dei magazzini di scarico. Veste giacche di velluto e porta i guanti anche a tavola. È cortese con tutti, non alza mai la voce, e conta ogni cosa sulle dita guantate."
    requisiti: [gilda.esito >= 3]

  - id: marzio-elleri
    nome: Marzio Elleri
    alias: [Elleri]
    tipo: personaggio
    sottotitolo: "Cancelliere della Casa dei Nodi"
    testo: "Cancelliere della Casa dei Nodi e avvocato della Gilda. Custodisce i sigilli della Casa al banco del timbro. È un uomo rotondo e gentile, con i manicotti di tela sulle maniche per non sporcarle d'inchiostro. Chiede a tutti della famiglia, si ricorda i nomi dei figli di ogni mercante e non alza mai la voce."
    requisiti: [fazione.gilda < 9]

  - id: marzio-elleri-dimesso
    nome: Marzio Elleri
    alias: [Elleri]
    tipo: personaggio
    sottotitolo: "Già cancelliere della Casa dei Nodi"
    testo: "Per molti anni cancelliere della Casa dei Nodi e avvocato della Gilda. Custodiva i sigilli della Casa al banco del timbro. Un uomo rotondo e gentile, con i manicotti di tela sulle maniche, che chiedeva a tutti della famiglia. Ha lasciato il banco del timbro, e i mercanti in coda se ne sono accorti per primi."
    requisiti: [fazione.gilda >= 9]

  - id: hakkos-cordani
    nome: Hakkos Cordani
    alias: [Hakkos]
    tipo: personaggio
    sottotitolo: "Il primo Sovrintendente della Gilda"
    testo: "Il primo Sovrintendente della Gilda dei Mercanti, nonno di Tarquin Cordani. Veniva da una famiglia di tiracorde e fu fra i firmatari del Patto delle Corde nel 118. In città gli attribuiscono un detto che i Ponti ripetono ancora, secondo cui una corda può essere un ponte o un cappio, a seconda di chi la tiene."
    requisiti: []

  - id: cahir
    nome: Cahir
    tipo: personaggio
    sottotitolo: "Stalliere di Laresh"
    testo: "Stalliere mezzelfo di Laresh, sulla venticinquina, con i capelli legati e una cicatrice di morso sull'avambraccio. Guida i cani da soma delle carovane della Gilda fino al bivio di Laresh, con una pazienza che i cani riconoscono subito. Non nasconde a nessuno che un giorno vorrebbe una carovana sua."
    requisiti: []

  - id: tasha-la-bianca
    nome: Tasha la Bianca
    alias: [Tasha]
    tipo: personaggio
    sottotitolo: "Mercante di Ghoran"
    testo: "Mercante di schiavi di Ghoran, vestita di bianco dalla testa ai piedi, con i capelli bianchi e una voce calma che si sente fino in fondo a un approdo. Vende prigionieri alla Gilda dei Mercanti e a chi paga meglio. Sostiene di liberare le anime attraverso la sofferenza, e lo dice senza alzare la voce."
    requisiti: []

  - id: lira-demos
    nome: Lira Demos
    alias: [Lira]
    tipo: personaggio
    sottotitolo: "Archivista dei dazi della Casa dei Nodi"
    testo: "Archivista dei dazi della Casa dei Nodi, mezzelfa, con i capelli castani intrecciati di fili di rame. Tiene i conti dei ponti come una pratica notarile e inchioda un tassello di legno sulla costola di ogni registro che non torna. Per iscritto non promette niente a nessuno."
    requisiti: []

  - id: ormun-pell
    nome: Ormun Pell
    alias: [Ormun]
    tipo: personaggio
    sottotitolo: "Caposquadra dei ponteggiatori della Gilda"
    testo: "Nano, caposquadra dei ponteggiatori della Gilda, con la barba legata e le mani sporche di pece. Riconosce una fune buona dal cigolio e porta sempre fra i denti una pipa spenta. Sui ponti si dice che chiuda un occhio su molte cose, ma mai su una corda."
    requisiti: []

  - id: remo-ghiselli
    nome: Remo Ghiselli
    alias: [Ghiselli]
    tipo: personaggio
    sottotitolo: "Ispettore dei magazzini della Gilda"
    testo: "Ispettore dei magazzini della Casa dei Nodi. È un uomo pesante e cortese, e conosce a memoria le chiavi di tutti i depositi sui Ponti. Lo ha assunto Tarquin Cordani molti anni fa. Ha una figlia che studia all'Accademia di Torvessa, e ne parla appena può."
    requisiti: []

  - id: fabrizio-lodde
    nome: Fabrizio Lodde
    alias: [Lodde]
    tipo: personaggio
    sottotitolo: "Pesatore della Gilda"
    testo: "Pesatore della Gilda, che gira i banchi del Mercato dei Nodi e le bilance dell'Orlo dei Rottami con la cassetta dei pesi campione. È nato in Città Bassa e da ragazzo frugava fra i rottami. Parla a monosillabi e scrive tutto sul registro della bilancia, con una grafia piccola e ordinata."
    requisiti: []

  - id: teo-marsan
    nome: Teo Marsan
    tipo: personaggio
    sottotitolo: "Custode notturno del Ponte dei Morti"
    testo: "Il custode notturno che la Gilda ha messo al Ponte dei Morti dopo Maedric Holl. È un ragazzo con la barba rada che ferma ogni carro e conta le casse tre volte, muovendo le labbra, prima di scriverle sul registro con una grafia grande da scolaro."
    requisiti: []

  - id: ugo-bracco
    nome: Ugo Bracco
    alias: [Bracco]
    tipo: personaggio
    sottotitolo: "Padrone delle chiatte grandi"
    testo: "Il padrone delle chiatte grandi dell'approdo a valle delle Mille Corde, largo come una porta, con un segaccio da funi sempre alla cintura. Sulle assi si muove meglio di quanto dica la sua mole. Paga i suoi chiattaioli il giovedì, e all'approdo non lo amano."
    requisiti: [gilda.bracco == 0]

  - id: ugo-bracco-dopo-la-notte
    nome: Ugo Bracco
    alias: [Bracco]
    tipo: personaggio
    sottotitolo: "Già padrone delle chiatte grandi"
    testo: "Era il padrone delle chiatte grandi dell'approdo a valle delle Mille Corde, largo come una porta, con un segaccio da funi sempre alla cintura. Dalla notte prima del voto alla Casa dei Nodi le sue chiatte restano ormeggiate, e all'approdo il suo nome si dice sottovoce."
    requisiti: [gilda.bracco >= 1]

  - id: ilde-sarrocchi
    nome: Ilde Sarrocchi
    alias: [Ilde]
    tipo: personaggio
    sottotitolo: "Chiattaiola della Mula"
    testo: "Chiattaiola dell'approdo a valle delle Mille Corde, padrona della Mula, una chiatta a fune che tira con il suo argano. Ha sempre un bastoncino di liquirizia fra i denti e chiama socio chiunque le stia simpatico. Sulle funi ne sa quanto un ponteggiatore."
    requisiti: []

  - id: clelia-vennari
    nome: Clelia Vennari
    alias: [Clelia]
    tipo: personaggio
    sottotitolo: "L'ultima dei Vennari"
    testo: "Una signora anziana dei Ponti, l'ultima di una famiglia di tiracorde che firmò il Patto delle Corde con un nodo di fune. Siede con la schiena diritta e i guanti di pizzo, uno rammendato sul pollice, e chiama le persone con un cenno del mento, come si faceva una volta."
    requisiti: []
