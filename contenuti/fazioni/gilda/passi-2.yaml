# La quest della Gilda, passi 6-10 (fazione.gilda 5 → 10). Vedi quest.yaml per le quality.
# 6 Il conto dei dazi (5 → 6): il riscontro all'archivio con Lira, poi il conto al Municipio davanti a Julia
#   Castaldi (seguito): onesto, arrotondato per Morlacchi o onesto con l'ammanco cifrato (gilda.conto). Grado II.
# 7 Due porte che si chiudono da dentro (6 → 7, con pista.registro >= 5): Tarquin ha il registro di Maedric e i
#   nomi dei tre funzionari (Remo Ghiselli, Fabrizio Lodde, Marzio Elleri). Serve l'altra metà dei conti, e tutte le
#   strade portano alla botola del gabbiotto del Ponte dei Morti. Con maedric == 2 si parla con lui in cella; la
#   Caserma aiuta con Galdrick o, se è a Ghoran (galdrick.via == 1), con il sergente Livio Mastrel.
# 8 Sotto il Ponte dei Morti (7 → 8): la botola di Teo Marsan e la spedizione (spedizione-ponte-dei-morti.yaml).
# 9 Il sigillo (8 → 9): con il secondo libro i tre cadono. Via pulita (gilda.via 1), quieta (2) o, dopo l'offerta di
#   Morlacchi la sera (seguito, gilda.offerta), venduta (3). Grado III in tutti i casi.
#   `gilda-il-sigillo-o-l-ombra`: dopo il grado III, con rep.scuri >= 2, Varn chiede il nome del contatto.
# 10 La merce di Tasha (9 → 10): all'approdo delle chiatte l'ordine dei magazzini di allentare il cavo sotto il carro
#   di Tasha la Bianca, mercante di Ghoran, che porta prigionieri e rifiuta i magazzini di Morlacchi (gilda.tasha).
storylet:
  # ------------------------------------------------------------ passo 6 · il conto dei dazi
  - id: gilda-il-conto-dei-dazi
    presso: gilda-casa-dei-nodi
    immagine: personaggi/lira-demos
    titolo: Il conto dei dazi
    sommario: "Lira vuole che il riscontro mensile dei dazi lo faccia tu, e che il conto al Municipio lo porti tu."
    luogo: Casa dei Nodi, l'archivio dei dazi
    area: quartieri-alti
    requisiti: [fazione.gilda == 5]
    testo: |
      L'archivio dei dazi è una sala lunga al secondo piano della Casa dei
      Nodi, con le finestre sulle catene dei ponti. Lira Demos ha preparato
      il tavolo con i registri del mese e la scatola dei tasselli. Il conto
      dei dazi va al Consiglio ogni mese, firmato da un socio della Casa, e
      stavolta il socio sei tu.

      «Il riscontro si fa riga per riga» dice Lira. «I pedaggi da una parte,
      le casse dei gabbiotti dall'altra. Dove i conti non tornano ci va un
      tassello.»

      {politica-ed-economia Media} Le Mille Corde rendono come ogni mese.
      Sono i magazzini di scarico a non tornare, con noli pagati per carri
      che nessun gabbiotto ha visto passare.

      A metà pomeriggio sulla porta compare Ansaldo Morlacchi, con i guanti
      di velluto e un sorriso educato. «Il conto lo porti tu al Municipio,
      mi dicono» dice. «La Rappresentante Castaldi cerca da anni un pretesto
      per mettere le mani sui ponti, come ha fatto con il grano. Un conto
      arrotondato non fa male a nessuno, e le cifre tonde le piacciono.»
      Conta qualcosa sulle dita e se ne va, e le dita di Lira, ferme sui
      tasselli, ripartono soltanto quando lui ha chiuso la porta.
    opzioni:
      - testo: "Fare il riscontro riga per riga"
        descrizione: "I pedaggi accanto alle casse dei gabbiotti, perché Lira vuole sul tavolo tutto quello che non torna."
        prova: { attributo: mentale, abilita: [politica-ed-economia, percezione], difficolta: Media }
        successo:
          titolo: I noli fantasma
          testo: |
            Lavorando fino a sera trovi che le Mille Corde tornano al quattrino,
            mentre i magazzini di scarico hanno pagato noli per carri mai passati
            da un gabbiotto, anche la settimana dopo il Festival.

            «Adesso lo sai anche tu» dice soltanto Lira, posando sul tavolo un
            tassello a forma di carro accanto a quello vecchio.
          pe: { politica-ed-economia: 5 }
          segue: gilda-il-conto-al-municipio
        fallimento:
          titolo: La seconda lampada
          testo: |
            Alla quarta ora confondi due mesi. Lira riprende il registro da capo e
            lo finisce da sola, mentre tu le passi i volumi, e a notte ti mostra i
            noli dei magazzini di scarico pagati per carri che nessun gabbiotto ha
            visto.
          effetti: { tormento: 1 }
          segue: gilda-il-conto-al-municipio
      - testo: "Lavorare con i tasselli di Lira"
        descrizione: "Ogni tassello è un conto che non tornava, e in fila raccontano una storia più veloce dei registri."
        prova: { attributo: mentale, abilita: [accademiche, percezione], difficolta: Media }
        successo:
          titolo: La fila dei tasselli
          testo: |
            Metti i tasselli in fila per data, e quelli a forma di carro si
            addensano negli stessi mesi dei noli dei magazzini di scarico. Lira li
            rimette nella scatola per forma ma ti lascia la fila disegnata su un
            foglio.
          pe: { accademiche: 5 }
          segue: gilda-il-conto-al-municipio
        fallimento:
          titolo: Per forma
          testo: |
            Li ordini per colore del legno, e la fila non ti dice niente. Lira
            sospira con il naso e li rimette per data in un quarto d'ora, poi ti
            indica con la penna i mesi dei noli dei magazzini di scarico.
          effetti: { tormento: 1 }
          segue: gilda-il-conto-al-municipio
      - testo: "Lasciare il riscontro a Lira e aspettare il conto"
        descrizione: "Lei lo fa meglio di te e lo sapete tutti e due, ma ci vuole la notte."
        costo: 2
        esito:
          titolo: La notte all'archivio
          testo: |
            Lira lavora fino all'alba mentre tu dormi su una panca in fondo
            all'archivio. Quando ti sveglia il conto è pronto, e in margine ha
            segnato a matita i noli dei magazzini di scarico che non tornano.
          segue: gilda-il-conto-al-municipio

  - id: gilda-il-conto-al-municipio
    presso: municipio
    immagine: personaggi/julia-castaldi
    titolo: Il conto al Municipio
    tipo: seguito
    luogo: Municipio, l'ufficio della Rappresentante
    area: quartieri-alti
    requisiti: [fazione.gilda == 5]
    testo: |
      Al Municipio ti fanno aspettare sotto il ritratto della
      Rappresentante, dipinto con più ottimismo che somiglianza. Poi Julia
      Castaldi ti riceve in piedi e prende il conto dei dazi con due dita,
      fermandosi sulle righe che le interessano.

      «La Gilda dice che i ponti si pagano da soli» dice. «Ogni mese mi
      porta un conto in pari, e ogni mese il pane della Città Bassa costa un
      po' di più. Il grano adesso lo controlla il Municipio, e costa meno.
      Mi chiedo se i ponti non costerebbero meno anche loro.»

      {origine rampollo-dei-quartieri-alti} In casa tua dicevano che Julia
      Castaldi legge i conti degli altri come un'altra legge le lettere
      d'amore, cercando quello che non c'è scritto.

      Hai il conto vero nella giubba, con i noli fantasma dei magazzini di
      scarico, e lei aspetta con la penna già intinta.
    opzioni:
      - testo: "Consegnarle il conto onesto"
        descrizione: "Noli compresi, e Julia avrà il suo pretesto e la Casa una ferita aperta."
        prova: { attributo: sociale, abilita: persuasione, difficolta: Media }
        successo:
          titolo: Il conto onesto
          testo: |
            Le dai il conto onesto e le dici che la Gilda correggerà da sola i
            noli che non tornano. «Vediamo quanto dura» dice Julia, e firma. Alla
            Casa Lira ti dà la chiave dell'archivio e Varn la giubba dei Custodi;
            Morlacchi, sulle scale, non ti saluta.
          pe: { persuasione: 3 }
          almeno: { rep.gilda: 4 }
          imposta: { gilda.conto: 1 }
          effetti: { oggetto.gilda-giubba-dei-custodi: 1, rep.castaldi: 1, gilda.voti: 1, fazione.gilda: 1 }
        fallimento:
          titolo: Il pretesto
          testo: |
            Julia trova i noli prima che tu finisca di spiegarli. «Lo sapevo»
            dice. «La Gilda non corregge niente da sola.» Domani lo dirà in
            Consiglio. Alla Casa Lira ti dà lo stesso la chiave dell'archivio e
            Varn la giubba dei Custodi, mentre Morlacchi ti guarda come un debito
            scaduto.
          almeno: { rep.gilda: 4 }
          imposta: { gilda.conto: 1 }
          effetti: { oggetto.gilda-giubba-dei-custodi: 1, rep.castaldi: 0.5, scandalo: 1, fazione.gilda: 1 }
      - testo: "Consegnarle il conto arrotondato"
        descrizione: "Cifre tonde e noli in ordine, e Julia dovrà cercarsi un altro pretesto."
        prova: { attributo: sociale, abilita: ingannare, difficolta: Media }
        successo:
          titolo: Le cifre tonde
          testo: |
            Mentre Julia legge il conto con le cifre tonde parli del prezzo della
            legna, e lei firma senza alzare gli occhi. La sera ti arriva una borsa
            di velluto con i saluti di Morlacchi; il giorno dopo Lira ti dà la
            chiave dell'archivio guardando da un'altra parte, e Varn la giubba dei
            Custodi.
          pe: { ingannare: 3 }
          almeno: { rep.gilda: 4 }
          imposta: { gilda.conto: 2 }
          effetti: { oggetto.gilda-giubba-dei-custodi: 1, rep.gilda: 1, monete: 25, fazione.gilda: 1 }
        fallimento:
          titolo: Il conto troppo tondo
          testo: |
            Julia ti chiede come mai questo mese tutte le cifre finiscono con lo
            zero, e domani ne parleranno in tre salotti. Morlacchi ti manda la sua
            borsa lo stesso; Lira ti dà la chiave dell'archivio senza dire niente,
            e Varn la giubba dei Custodi.
          almeno: { rep.gilda: 4 }
          imposta: { gilda.conto: 2 }
          effetti: { oggetto.gilda-giubba-dei-custodi: 1, monete: 25, scandalo: 1.5, rep.castaldi: -0.5, fazione.gilda: 1 }
      - testo: "Consegnarle il conto onesto, con l'ammanco cifrato"
        descrizione: "Le cifre giuste per lei, e i noli fantasma nel vecchio cifrario dei custodi, che leggono solo Lira e Varn."
        prova: { attributo: mentale, abilita: accademiche, difficolta: Difficile }
        successo:
          titolo: Il margine
          testo: |
            In margine al conto giusto scrivi i noli dei magazzini di scarico con
            i segni del vecchio cifrario dei custodi, e Julia firma senza vederci
            altro che ghirigori. Alla Casa Lira legge il margine e ti guarda come
            una collega; ti dà la chiave dell'archivio e Varn ti porta la giubba
            dei Custodi.
          pe: { accademiche: 5 }
          almeno: { rep.gilda: 4 }
          imposta: { gilda.conto: 3 }
          effetti: { oggetto.gilda-giubba-dei-custodi: 1, rep.gilda: 0.5, gilda.voti: 1, fazione.gilda: 1 }
        fallimento:
          titolo: I ghirigori
          testo: |
            Sbagli due segni del cifrario, e Julia se ne accorge. Le dici la
            verità, perché a quel punto è più semplice, e lei legge i noli con
            interesse prima di firmare. Alla Casa Lira ti dà la chiave
            dell'archivio con un mezzo sospiro, e Varn la giubba dei Custodi.
          almeno: { rep.gilda: 4 }
          imposta: { gilda.conto: 1 }
          effetti: { oggetto.gilda-giubba-dei-custodi: 1, rep.castaldi: 0.5, scandalo: 1, fazione.gilda: 1 }
      - testo: "Parlarle come a una vicina di salotto"
        descrizione: "Julia Castaldi l'hai vista alle cene di casa tua, e un conto si ascolta meglio da chi le conosce."
        quando: [origine.rampollo-dei-quartieri-alti >= 1]
        esito:
          titolo: Fra vicini
          testo: |
            Le ricordi la cena in cui suo marito ha rovesciato il vino sulla
            tovaglia di tua madre, e lei ride. Poi le dai il conto onesto e le
            dici che la Gilda lo correggerà da sola. «Da una casa come la tua ci
            credo» dice, e firma. Alla Casa Lira ti dà la chiave dell'archivio e
            Varn la giubba dei Custodi.
          pe: { galateo: 3 }
          almeno: { rep.gilda: 4 }
          imposta: { gilda.conto: 1 }
          effetti: { oggetto.gilda-giubba-dei-custodi: 1, rep.castaldi: 1, gilda.voti: 1, fazione.gilda: 1 }

  # ------------------------------------------------------------ passo 7 · due porte che si chiudono da dentro
  - id: gilda-due-porte
    presso: gilda-casa-dei-nodi
    immagine: fazioni/gilda-dei-mercanti
    titolo: Due porte che si chiudono da dentro
    sommario: "Il Sovrintendente ti fa salire al terzo piano, dove c'è il registro di Maedric Holl con tre nomi sottolineati."
    luogo: Casa dei Nodi, la sala del terzo piano
    area: quartieri-alti
    requisiti: [fazione.gilda == 6, pista.registro >= 5]
    testo: |
      La sala del terzo piano ha un tavolo ovale, sette sedie di cuoio e due porte
      che si chiudono da dentro. Tarquin Cordani chiude la prima e Varn Kett la
      seconda, poi Cordani si siede con le mani ferme sul tavolo.

      Sul tavolo c'è la copia del registro di Maedric Holl mandata dallo sceriffo,
      con tre nomi sottolineati, ognuno con una cifra al mese da sei anni. Sono
      l'ispettore dei magazzini Remo Ghiselli, il pesatore del Mercato Fabrizio
      Lodde e il cancelliere Marzio Elleri.

      «Un libretto a disegni non basta, Elleri in un pomeriggio spiegherebbe ogni
      riga a un tribunale» dice Cordani, mentre Varn scrive qualcosa sull'aria.
      «Ci serve l'altra metà dei conti, quella che Maedric teneva dove abitava
      davvero, perché l'indirizzo che dava alla Casa non corrisponde a nessuna
      porta.»

      {empatia Difficile} Le mani di Cordani sono ferme perché sono arrabbiate.
      Remo Ghiselli l'ha assunto lui, anni fa.
    opzioni:
      - testo: "Pedinare Remo Ghiselli di notte"
        descrizione: "Un ispettore dei magazzini che esce di casa di notte ha un motivo, e va seguito senza farsi vedere."
        prova: { attributo: fisico, abilita: furtivita, difficolta: Media }
        successo:
          titolo: Tre notti
          testo: |
            Alla terza notte segui Ghiselli fino al gabbiotto del Ponte dei Morti,
            dove il custode nuovo, Teo Marsan, dorme sul banco. Ghiselli solleva
            un'asse del pavimento per infilarci una busta e se ne va pulendosi le
            ginocchia. Il giorno dopo Teo, quando glielo racconti, va a prendere
            la chiave della botola rosso fino alle orecchie.
          pe: { furtivita: 3 }
          effetti: { rep.gilda: 0.5, fazione.gilda: 1 }
        fallimento:
          titolo: La pozzanghera
          testo: |
            Alla seconda notte Ghiselli si volta e ti vede, e il giorno dopo alla
            Casa ti saluta con troppo garbo. Varn ti manda lo stesso al gabbiotto
            del Ponte dei Morti, dove Ghiselli è andato quella notte, e Teo Marsan
            ammette che sotto c'è una botola.
          effetti: { sospetto: 1, fazione.gilda: 1 }
      - testo: "Mettere Lodde alle strette alla sua bilancia"
        descrizione: "Fabrizio Lodde parla a monosillabi e non scappa dal suo banco, dove gli si può parlare davanti a tutti."
        prova: { attributo: sociale, abilita: intimidire, difficolta: Media }
        successo:
          titolo: Un monosillabo
          testo: |
            Accanto alla sua bilancia gli dici a voce bassa la cifra che prende
            ogni mese, e Lodde smette di pesare. «Botola» dice, e poi, sempre a
            monosillabi, che Maedric lasciava la busta sotto il gabbiotto del
            Ponte dei Morti e scendeva da lì, e che la chiave ce l'ha Teo Marsan.
          pe: { intimidire: 3 }
          effetti: { rep.gilda: 0.5, fazione.gilda: 1 }
        fallimento:
          titolo: Il registro della bilancia
          testo: |
            Lodde scrive il tuo nome nel registro della bilancia, e la sera Elleri
            lo sa. Il giorno dopo Varn ti manda al gabbiotto del Ponte dei Morti,
            dove Lodde è passato a guardare le assi, e Teo Marsan ha la chiave di
            una botola.
          effetti: { sospetto: 1.5, fazione.gilda: 1 }
      - testo: "Cercare nel gabbiotto con Teo Marsan"
        descrizione: "Il custode nuovo conta i carri tre volte, ma le assi del suo gabbiotto non le ha mai contate."
        prova: { attributo: mentale, abilita: [percezione, tecnologia], difficolta: Media }
        successo:
          titolo: L'asse lucida
          testo: |
            Teo ti guarda cercare muovendo le labbra. Le assi sono tutte opache di
            fango tranne una lucida ai bordi. Sotto c'è una busta vuota con il
            marchio dei magazzini di scarico, sopra l'anello di ferro di una
            botola, e Teo ne ha la chiave, appesa con le altre, senza sapere che
            cosa apriva.
          pe: { percezione: 3 }
          effetti: { rep.gilda: 0.5, fazione.gilda: 1 }
        fallimento:
          titolo: Tutte le assi
          testo: |
            Sollevi le assi una dopo l'altra mentre Teo le conta ad alta voce, e
            all'alba, con le unghie rotte, trovi sotto l'ultima l'anello di ferro
            di una botola. Teo ha la chiave, appesa con le altre.
          effetti: { ferite: 0.5, fazione.gilda: 1 }
      - testo: "Andare a parlare con Maedric, in cella"
        descrizione: "Maedric Holl è nelle celle della Caserma, e un uomo che lavora a tariffa avrà un prezzo anche lì."
        requisiti: [maedric == 2]
        prova: { attributo: sociale, abilita: [persuasione, conoscenze-della-strada], difficolta: Media }
        successo:
          titolo: La tariffa della cella
          testo: |
            Maedric, seduto sulla branda con il mantello cerato sulle spalle,
            chiede per prezzo una coperta e il nome del custode nuovo. «Sotto il
            gabbiotto c'è una botola» dice, «e sotto la botola una casa. Quando
            sali, saluta la casa da parte mia.»
          pe: { persuasione: 3 }
          effetti: { rep.gilda: 0.5, fazione.gilda: 1 }
        fallimento:
          titolo: Le spalle al muro
          testo: |
            Maedric ti dice soltanto che i ponti di notte non sono i ponti di
            giorno. Sulla soglia, però, il carceriere ti racconta che ogni sera
            Maedric chiede se al gabbiotto del Ponte dei Morti hanno trovato la
            botola.
          effetti: { tormento: 1, fazione.gilda: 1 }
      - testo: "Chiedere un uomo allo sceriffo"
        descrizione: "Galdrick ha letto il registro prima della Casa, e un uomo della Caserma apre più porte di un gettone."
        requisiti: [galdrick.via == 0]
        costo: 2
        esito:
          immagine: personaggi/toren-galdrick
          titolo: Un uomo della Caserma
          testo: |
            Galdrick ti presta un caporale e un mandato con il suo sigillo.
            Davanti al mandato Teo Marsan apre il gabbiotto, e sotto l'ultima asse
            sollevata dal caporale c'è l'anello di ferro di una botola. Teo ne ha
            la chiave, appesa insieme alle altre, e non sapeva che cosa apriva.
          effetti: { rep.caserma: 0.5, rep.gilda: 0.5, fazione.gilda: 1 }
      - testo: "Chiedere un uomo al sergente Mastrel"
        descrizione: "Con lo sceriffo a Ghoran, la Caserma la tiene il sergente Livio Mastrel, che conosce il registro."
        requisiti: [galdrick.via == 1]
        costo: 2
        esito:
          titolo: Il sergente
          testo: |
            Livio Mastrel ti presta un caporale e un mandato con il sigillo della
            Caserma, raccomandandoti di riportargli il caporale intero. Davanti al
            mandato Teo Marsan apre il gabbiotto, e sotto l'ultima asse c'è
            l'anello di ferro di una botola, con la chiave appesa insieme alle
            altre.
          effetti: { rep.caserma: 0.5, rep.gilda: 0.5, fazione.gilda: 1 }

  # ------------------------------------------------------------ passo 8 · la botola (la spedizione è in spedizione-ponte-dei-morti.yaml)
  - id: gilda-la-botola-del-gabbiotto
    presso: ponte-dei-morti
    immagine: ambientazione/ponte-dei-morti
    titolo: La botola del gabbiotto
    sommario: "Sotto il gabbiotto del Ponte dei Morti una botola scende alle passerelle dei sottoponti."
    luogo: Ponte dei Morti, il gabbiotto dei Custodi
    area: ponti-sospesi
    requisiti: [fazione.gilda == 7]
    testo: |
      Teo Marsan apre la botola con la mano che trema e la solleva con tutte
      e due le braccia. Sotto, una scala di corda scende nella nebbia, e
      sale un'aria fredda che sa di ferro bagnato.

      «Sotto i ponti ci abita gente che i registri della Gilda non contano»
      dice Teo. «I Lunghi, i ragazzi della corda, e chissà chi. Maedric ci
      scendeva tutte le notti, dicono.»

      {origine figlio-della-citta-bassa} Da ragazzo passavi per le scale dei
      sottoponti a portare i messaggi senza pagare il gabbiotto, e i piedi
      ricordano ancora quali pioli reggono.
    opzioni:
      - testo: "Scendere la scala di corda"
        descrizione: "Un piolo alla volta, nella nebbia."
        esito:
          titolo: Nella nebbia
          testo: |
            Dopo il decimo piolo la nebbia ti si chiude sopra la testa, e la
            lanterna di Teo diventa piccola e gialla. Sotto i piedi trovi una
            passerella di assi che dondola nel buio pieno di corde.
          vai: gilda-sotto-il-ponte-dei-morti
      - testo: "Calarsi lungo la fune di Maedric"
        descrizione: "Accanto alla scala pende la fune annodata da cui scendeva Maedric, che arriva più lontano."
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Media }
        successo:
          titolo: La fune annodata
          testo: |
            Ti cali nodo dopo nodo lungo la fune di Maedric fino a una passerella
            molto più in basso della scala, saltando come lui il primo tratto
            delle scalette.
          pe: { acrobazia: 3 }
          effetti: { profondita.gilda-sotto-il-ponte-dei-morti: 1 }
          vai: gilda-sotto-il-ponte-dei-morti
        fallimento:
          titolo: Il nodo che scivola
          testo: |
            A metà fune un nodo scivola sotto le dita, e scendi tre braccia
            di colpo con le mani che bruciano. Atterri sulla passerella
            delle scalette con un colpo che ti risale fino ai denti.
          effetti: { ferite: 1 }
          vai: gilda-sotto-il-ponte-dei-morti
      - testo: "Scendere con i Custodi che ti conoscono"
        descrizione: "I Custodi di Passaggio ti lasciano passare senza gabella, e sotto le assi qualcuno ti fa strada."
        requisiti: [ponti.passo >= 1]
        costo: 0
        esito:
          titolo: Il passo dei Ponti
          testo: |
            Un ponteggiatore della squadra di Ormun ti accompagna giù per la via
            di servizio, che taglia le scalette, e ti lascia sulla prima
            passerella con una raccomandazione sui Lunghi.
          vai: gilda-sotto-il-ponte-dei-morti
      - testo: "Scendere per la via dei ragazzi della corda"
        descrizione: "I pioli buoni sono quelli con lo spago rosso. Da ragazzo lo sapevi, e lo sai ancora."
        quando: [origine.figlio-della-citta-bassa >= 1]
        esito:
          titolo: Lo spago rosso
          testo: |
            Scendi mettendo i piedi soltanto sui pioli con lo spago rosso
            come da ragazzo, e la scala non dondola nemmeno. Teo ti guarda
            dalla botola con la bocca aperta.
          vai: gilda-sotto-il-ponte-dei-morti

  # ------------------------------------------------------------ passo 9 · il sigillo
  - id: gilda-il-sigillo
    presso: gilda-casa-dei-nodi
    immagine: fazioni/gilda-dei-mercanti
    titolo: Il sigillo
    sommario: "Con il secondo libro di Maedric i tre funzionari cadono, e Cordani ti offre la funzione di Elleri."
    luogo: Casa dei Nodi, la sala del terzo piano
    area: quartieri-alti
    requisiti: [fazione.gilda == 8]
    testo: |
      Al terzo piano Cordani legge il secondo libro di Maedric fino in fondo, con Varn
      in piedi alle sue spalle. I soldi degli Scuri entravano nella Casa dai magazzini
      di Morlacchi, come pagamenti per noli mai fatti, e ogni mese una parte ne usciva
      verso i banchi dei tre funzionari sottolineati nel registro. Le somme ci sono
      tutte, con le date.

      «Con questo cadono tutti e tre» dice Cordani. «E Morlacchi resta in piedi
      soltanto perché è in consiglio e mancano due mesi al voto.» Va alla finestra, con
      le mani dietro la schiena. «Il guaio è che senza quei tre la Casa si ferma.
      Ghiselli tiene i magazzini e Lodde fa i pesi, Elleri i sigilli. Domani mattina
      nessuno saprebbe pesare un sacco di sale, e il Municipio direbbe che i ponti li
      deve tenere lui.»

      Poi si gira verso di te. «La funzione di Elleri ha bisogno di qualcuno che sappia
      tenere un sigillo e la bocca chiusa. Te la offro. Come cadono i tre, però, lo
      decidiamo adesso.»

      {galateo Media} Ti offre un posto davanti a Varn, ed è un modo di dire a Varn che
      la decisione è anche tua.
    opzioni:
      - testo: "Farli arrestare da Varn davanti a tutti"
        descrizione: "La via pulita, con i tre che escono in catene davanti ai soci e una sala da tenere calma."
        prova: { attributo: sociale, abilita: persuasione, difficolta: Media }
        successo:
          titolo: La via pulita
          testo: |
            Varn li arresta all'ora di punta, e nella sala dei soci che grida sali
            su una panca e leggi le date del libro finché la sala si calma. Per
            tre giorni la Casa si ferma e la città se ne accorge.

            Il quarto giorno Cordani ti dà il sigillo del portasigillo, davanti a
            tutti.
          pe: { persuasione: 5 }
          almeno: { rep.gilda: 6 }
          imposta: { gilda.via: 1 }
          effetti: { oggetto.gilda-sigillo-del-portasigillo: 1, gilda.voti: 2, rep.caserma: 1, scandalo: 1, fazione.gilda: 1 }
        fallimento:
          titolo: I tre giorni
          testo: |
            Varn li arresta all'ora di punta e la sala dei soci esplode, e mentre
            parli dalla panca ti arriva un calamaio sulla tempia. Per tre giorni
            la Casa si ferma, e in Municipio ne parlano come di un disastro.

            Il quarto giorno Cordani ti dà lo stesso il sigillo del portasigillo,
            davanti ai pochi soci rimasti.
          almeno: { rep.gilda: 6 }
          imposta: { gilda.via: 1 }
          effetti: { oggetto.gilda-sigillo-del-portasigillo: 1, gilda.voti: 2, rep.caserma: 1, scandalo: 1.5, ferite: 0.5, fazione.gilda: 1 }
      - testo: "Girarli in testimoni contro Morlacchi"
        descrizione: "La via quieta, con i tre al loro posto ancora un mese come testimoni, da convincere uno alla volta."
        prova: { attributo: sociale, abilita: [empatia, intimidire], difficolta: Media }
        successo:
          titolo: La via quieta
          testo: |
            Ghiselli cede per primo, quando gli parli della figlia all'Accademia e
            di chi le paga la retta. Lodde cede alla seconda frase, ed Elleri ti
            consegna sorridendo una lettera di dimissioni perfetta. Fra un mese,
            in assemblea, Ghiselli dirà quello che sa di Morlacchi e voterà con
            te.

            Cordani ti dà il sigillo del portasigillo in una stanza chiusa, senza
            testimoni.
          pe: { empatia: 5 }
          almeno: { rep.gilda: 6 }
          imposta: { gilda.via: 2 }
          effetti: { oggetto.gilda-sigillo-del-portasigillo: 1, gilda.voti: 2, fazione.gilda: 1 }
        fallimento:
          titolo: Uno su tre
          testo: |
            Ghiselli cede ed Elleri si dimette con una lettera perfetta, ma Lodde
            la notte sparisce dal suo banco al Mercato con la cassetta dei pesi.
            Qualcuno l'ha detto a Morlacchi, che la mattina dopo ti saluta con un
            inchino più lungo del solito.

            Cordani ti dà il sigillo del portasigillo in una stanza chiusa, senza
            testimoni.
          almeno: { rep.gilda: 6 }
          imposta: { gilda.via: 2 }
          effetti: { oggetto.gilda-sigillo-del-portasigillo: 1, gilda.voti: 1, sospetto: 1, fazione.gilda: 1 }
      - testo: "Chiedere una notte per pensarci"
        descrizione: "Morlacchi sa del libro, e prima di decidere forse conviene sentire che cosa offre."
        quando: [gilda.offerta == 0]
        costo: 0
        esito:
          titolo: Una notte
          testo: |
            Cordani ti guarda a lungo, poi annuisce. «Una notte» dice. Quando esci
            dalla Casa un uomo con la livrea dei magazzini di scarico si stacca da
            una colonna del portico e ti dice che il consigliere Morlacchi ti
            aspetta a cena.
          imposta: { gilda.offerta: 1 }
          segue: gilda-la-sera-di-morlacchi

  - id: gilda-la-sera-di-morlacchi
    immagine: icone/hooded-figure
    titolo: La sera di Morlacchi
    tipo: seguito
    luogo: I magazzini di scarico, l'ufficio di Morlacchi
    area: quartieri-alti
    requisiti: [fazione.gilda == 8, gilda.offerta >= 1]
    testo: |
      L'ufficio di Morlacchi è sopra il magazzino più grande, una stanza
      calda con un tavolo apparecchiato per due. Morlacchi versa il vino
      senza togliersi i guanti.

      «Il libro di Maedric» dice, e conta sulle dita. «Primo, se va a
      Cordani la Casa si ferma. Secondo, Cordani perde le elezioni lo
      stesso, perché una Casa ferma non la vota nessuno. Terzo, tu resti con
      un sigillo in mano e nessuno che ti protegga.» Apre la mano. «Se
      invece il libro viene qui, i tre se ne vanno in silenzio e la Casa
      lavora. Tu diventi portasigillo lo stesso, con la mia firma accanto a
      quella di Cordani.»

      Sotto il tovagliolo c'è una borsa, pesante a giudicare da come piega
      il lino.

      {ingannare Media} Finora ha detto soltanto la verità, ed è la cosa che
      ti preoccupa di più.
    opzioni:
      - testo: "Vendergli il libro"
        descrizione: "La via venduta, con la borsa sotto il tovagliolo e la firma di Morlacchi accanto al sigillo."
        esito:
          titolo: La via venduta
          testo: |
            Morlacchi mette il libro in un cassetto senza leggerlo e ti spinge la
            borsa con due dita guantate. Tre giorni dopo i tre funzionari si
            dimettono per motivi di salute, e Cordani firma la tua nomina a
            portasigillo senza guardarti. Da quel giorno smette di salutarti, e
            Lira ti chiede indietro la chiave dell'archivio con la mano tesa.
          almeno: { rep.gilda: 6 }
          imposta: { gilda.via: 3 }
          effetti: { oggetto.gilda-sigillo-del-portasigillo: 1, monete: 150, rep.gilda: 1, rep.castaldi: -1, fazione.gilda: 1 }
      - testo: "Alzare il prezzo prima di vendere"
        descrizione: "Uno che conta sulle dita ha già contato quanto vale il libro per lui."
        prova: { attributo: sociale, abilita: persuasione, difficolta: Media }
        successo:
          titolo: Il sesto dito
          testo: |
            Gli dici che una borsa sotto un tovagliolo è un antipasto. Morlacchi
            ride e va a prenderne una seconda, più piccola. Tre giorni dopo i tre
            si dimettono per motivi di salute, e diventi portasigillo con la firma
            di Morlacchi accanto a quella di Cordani, che firma senza guardarti.
            Lira ti chiede indietro la chiave dell'archivio.
          pe: { persuasione: 3 }
          almeno: { rep.gilda: 6 }
          imposta: { gilda.via: 3 }
          effetti: { oggetto.gilda-sigillo-del-portasigillo: 1, monete: 200, rep.gilda: 1, rep.castaldi: -1, fazione.gilda: 1 }
        fallimento:
          titolo: L'antipasto
          testo: |
            «La borsa è quella» dice Morlacchi, senza più sorridere. «Prendila o
            lasciala.» La prendi con le orecchie che ti scottano. Tre giorni dopo
            i tre si dimettono per motivi di salute e diventi portasigillo con la
            sua firma accanto a quella di Cordani, ma alla Casa si dice che hai
            mercanteggiato con Morlacchi.
          almeno: { rep.gilda: 6 }
          imposta: { gilda.via: 3 }
          effetti: { oggetto.gilda-sigillo-del-portasigillo: 1, monete: 150, rep.castaldi: -1, scandalo: 1, fazione.gilda: 1 }
      - testo: "Alzarti da tavola e tornare da Cordani"
        descrizione: "La borsa resta sotto il tovagliolo, e il libro resta tuo, per adesso."
        costo: 0
        esito:
          titolo: Il vino intatto
          testo: |
            Ti alzi e lasci il bicchiere pieno. «Conta le mie dita quando avrai
            deciso» dice Morlacchi senza alzarsi, e ne alza tre. Torni alla Casa a
            piedi con il libro sotto la giubba.
          segue: gilda-il-sigillo

  - id: gilda-il-sigillo-o-l-ombra
    presso: gilda-casa-dei-nodi
    immagine: personaggi/varn-kett
    titolo: Il sigillo o l'ombra
    sommario: "Varn Kett ti aspetta sulla scalinata, preoccupato per un portasigillo con amici fra gli Scuri."
    luogo: Casa dei Nodi, la scalinata
    area: quartieri-alti
    requisiti: [fazione.gilda >= 9, gilda.ombra == 0, rep.scuri >= 2]
    testo: |
      Varn ti aspetta a metà della scalinata e ti fa sedere sul gradino
      accanto. Con la voce piatta dello sportello ti elenca le notti in cui
      sei stato visto alla Pignatta, le persone con cui hai bevuto, e un
      nome, uno solo, che dice due volte.

      «Un portasigillo che ha amici fra gli Scuri è un sigillo che timbra
      per loro» dice. «Lo so che nella Città Bassa si vive così. Qui no.» La
      mano destra si muove sull'aria, poi si ferma. «Dammi il nome del tuo
      contatto e lo scrivo, oppure dammi il sigillo e lo scrivo lo stesso.»

      {empatia Media} Non gli piace fare questa domanda, e la fa perché
      nessun altro alla Casa la farebbe.
    opzioni:
      - testo: "Dargli il nome"
        descrizione: "Perdi il contatto e la Pignatta lo saprà, mentre la Caserma ti ringrazierà."
        esito:
          titolo: Un nome sull'aria
          testo: |
            Varn scrive il nome sull'aria e poi su un foglio vero, che si mette
            piegato nel cappotto. Due notti dopo alla Pignatta qualcuno rovescia
            il tuo boccale apposta, e al Mercato delle Ombre la porta che
            conoscevi non si apre più.
          imposta: { gilda.ombra: 1, contatto-ombra: 0 }
          effetti: { rep.scuri: -2, rep.caserma: 1, rep.gilda: 0.5 }
      - testo: "Convincerlo che il contatto serve alla Gilda"
        descrizione: "Un portasigillo che sa che cosa passa sotto i ponti è più utile di uno che non lo sa."
        prova: { attributo: sociale, abilita: [persuasione, politica-ed-economia], difficolta: Difficile }
        successo:
          titolo: Le orecchie della Casa
          testo: |
            Gli racconti che cosa sai degli Scuri grazie al tuo contatto. Varn
            scrive una riga sull'aria e la cancella con il palmo, un gesto che non
            gli avevi mai visto fare. «Tienilo pure» dice, «però ogni cosa che
            sai, la so anch'io.»
          pe: { persuasione: 5 }
          imposta: { gilda.ombra: 2 }
        fallimento:
          titolo: Il sigillo sul gradino
          testo: |
            Varn ti ascolta fino in fondo, poi tende la mano, e tu gli dai il
            sigillo. Lo tiene una settimana in un cassetto, e quando te lo
            restituisce alla Casa lo sanno tutti, e sanno perché.
          imposta: { gilda.ombra: 2 }
          effetti: { rep.gilda: -1.5, scandalo: 1 }
      - testo: "Tenerti il nome e lasciargli il sigillo per un po'"
        descrizione: "Il grado resta, ma la Casa ricorda chi si è fatto togliere il sigillo dall'ispettore."
        esito:
          titolo: Il cassetto di Varn
          testo: |
            Il nome non lo dai, e Varn tende la mano come se se lo aspettasse.
            Tiene il sigillo una settimana nel cassetto del gabbiotto e te lo
            restituisce senza dire niente, ma alla Casa lo hanno saputo tutti.
          imposta: { gilda.ombra: 2 }
          effetti: { rep.gilda: -1.5 }

  # ------------------------------------------------------------ passo 10 · la merce di Tasha
  - id: gilda-la-merce-di-tasha
    immagine: ambientazione/ghoran
    titolo: La merce di Tasha
    sommario: "All'approdo delle chiatte arriva il carro di Tasha la Bianca, e al portasigillo un ordine che riguarda il cavo."
    luogo: Ponti Sospesi, l'approdo delle chiatte a fune
    area: ponti-sospesi
    requisiti: [fazione.gilda == 9]
    testo: |
      All'approdo delle chiatte, a valle delle Mille Corde, una piattaforma
      sul cavo d'acciaio aspetta un carro con le sponde chiuse e due
      mercenari di Ghoran di scorta. Accanto al carro c'è una donna vestita
      di bianco, dalla voce calma.

      È Tasha la Bianca, mercante di Ghoran, che per due volte ha rifiutato
      di far passare la sua merce dai magazzini di scarico e stamattina la
      porta di là da sola, per un compratore che la Casa non gradisce.

      Un garzone dei magazzini ti consegna una busta con il sigillo che
      conosci. L'ordine chiede al portasigillo di allentare il fermo del
      cavo a metà traversata e parla di un incidente, con la parola
      sottolineata.

      {percezione Media} Fra le sponde del carro spuntano e si ritirano
      delle dita, di gente seduta sul fondo.

      {origine fuggiasco-di-ghoran} Sul polso di un mercenario della scorta
      c'è il marchio dei recinti, quello che avevi tu.
    opzioni:
      - testo: "Eseguire l'ordine"
        descrizione: "Il fermo del cavo a metà traversata, e Morlacchi saprà che sei suo."
        prova: { attributo: fisico, abilita: tecnologia, difficolta: Media }
        successo:
          titolo: Il fermo
          testo: |
            A metà traversata allenti il fermo del cavo con la chiave dell'argano.
            La chiatta si inclina piano e il carro scivola oltre il bordo senza un
            rumore; il rumore arriva dopo, dal basso. Tasha resta aggrappata a una
            catena sulla chiatta inclinata, e guarda te.

            La sera un uomo dei magazzini ti porta una borsa, e di notte non
            dormi.
          imposta: { gilda.tasha: 1 }
          effetti: { monete: 30, tormento: 1.5, rep.gilda: 1, fazione.gilda: 1 }
        fallimento:
          titolo: Troppo presto
          testo: |
            Allenti il fermo troppo presto, e i mercenari trattengono il carro con
            le funi mentre dentro la gente grida. Tasha guarda l'argano e poi te,
            e da quel giorno a Ghoran conoscono il tuo nome; la sera ti arriva la
            borsa lo stesso, più leggera.
          imposta: { gilda.tasha: 1 }
          effetti: { monete: 15, tormento: 1.5, ferite: 0.5, fazione.gilda: 1 }
      - testo: "Avvertire Tasha senza farti scoprire"
        descrizione: "Due parole all'orecchio mentre controlli i documenti della chiatta, sotto gli occhi dei magazzini."
        prova: { attributo: sociale, abilita: ingannare, difficolta: Media }
        successo:
          titolo: Due parole
          testo: |
            Mentre Tasha ti porge i documenti le dici due parole sul fermo del
            cavo. Lei non cambia espressione e se ne va con il carro per la strada
            lunga, facendoti un cenno con la testa, e la sera un ragazzo ti porta
            una borsa con un nastro bianco.
          pe: { ingannare: 3 }
          imposta: { gilda.tasha: 2 }
          effetti: { monete: 20, fazione.gilda: 1 }
        fallimento:
          titolo: Visto
          testo: |
            Un garzone dei magazzini è più vicino di quanto pensavi. Tasha se ne
            va per la strada lunga, e la sera Morlacchi sa chi l'ha avvertita; il
            giorno dopo al banco del timbro trovi un cartellino battuto due volte
            con il tuo nome sopra.
          imposta: { gilda.tasha: 2 }
          effetti: { sospetto: 1.5, fazione.gilda: 1 }
      - testo: "Portare l'ordine scritto a Cordani"
        descrizione: "Un ordine di omicidio scritto, con il sigillo dei magazzini, e il Sovrintendente ne farà buon uso."
        requisiti: [gilda.via != 3]
        esito:
          titolo: La busta sul tavolo
          testo: |
            Fai fermare la chiatta con un pretesto e porti la busta a Cordani, che
            la chiude a chiave in un cassetto. «Questa vale più di cento voti»
            dice. Tasha passa la Cicatrice con la chiatta del pomeriggio senza
            sapere niente, e Morlacchi da quel giorno sa da che parte stai.
          imposta: { gilda.tasha: 3 }
          effetti: { gilda.voti: 2, rep.gilda: 0.5, fazione.gilda: 1 }
      - testo: "Liberare la merce di notte"
        descrizione: "Di notte il carro resta all'approdo, con i mercenari che dormono a turno."
        prova: { attributo: fisico, abilita: furtivita, difficolta: Difficile }
        successo:
          titolo: Le sponde aperte
          testo: |
            Mentre il mercenario di guardia sonnecchia sull'argano, apri la sponda
            togliendo un perno. Dentro ci sono undici persone legate a due a due;
            le slegate una coppia alla volta, e spariscono sotto le assi dove
            qualcuno dei sottoponti le aspetta. La mattina Tasha trova il carro
            vuoto, e l'ordine dei magazzini resta senza oggetto.
          pe: { furtivita: 5 }
          imposta: { gilda.tasha: 4 }
          effetti: { tormento: -1, racconto: 1, rep.raschiatori: -0.5, fazione.gilda: 1 }
        fallimento:
          titolo: La scorta sveglia
          testo: |
            Il perno della sponda cigola e il mercenario di guardia si sveglia.
            Scappi sotto le assi con un taglio sul braccio, e all'alba Tasha passa
            la Cicatrice con il carro pieno; Morlacchi saprà che l'ordine non
            l'hai eseguito.
          imposta: { gilda.tasha: 2 }
          effetti: { ferite: 1, fazione.gilda: 1 }
      - testo: "Aprire il carro con la forza"
        descrizione: "Se cadono i due mercenari di Ghoran, il carro si apre."
        combattimento: gilda-la-scorta-di-tasha
        vittoria:
          titolo: Il carro aperto
          testo: |
            I mercenari si arrendono quando il secondo finisce contro l'argano.
            Slegate una coppia alla volta, le undici persone del carro spariscono
            sotto le assi, mentre Tasha guarda dal bordo dell'approdo senza
            muovere un dito. «Tornerò con altra merce» dice, calma.
          imposta: { gilda.tasha: 4 }
          effetti: { tormento: -1, racconto: 1, rep.raschiatori: -0.5, fazione.gilda: 1 }
        sconfitta:
          titolo: L'argano
          testo: |
            Il secondo mercenario ti manda contro l'argano, e quando ti rialzi la
            chiatta è già a metà della Cicatrice con il carro e Tasha. Morlacchi
            saprà che l'ordine non l'hai eseguito.
          imposta: { gilda.tasha: 2 }
          effetti: { fazione.gilda: 1 }
      - testo: "Aprire le sponde con la lanterna cieca"
        descrizione: "La lanterna di Maedric fa luce per un dito, abbastanza per un perno e non per i mercenari."
        requisiti: [chiave.notte-sui-ponti >= 1]
        prova: { attributo: fisico, abilita: furtivita, difficolta: Media }
        successo:
          titolo: Un dito di luce
          testo: |
            Di notte apri lo sportello della lanterna cieca quel tanto che basta
            per vedere il perno della sponda. Slegate una coppia alla volta, le
            undici persone dentro spariscono sotto le assi dell'approdo, e la
            mattina Tasha trova il carro vuoto.
          pe: { furtivita: 3 }
          imposta: { gilda.tasha: 4 }
          effetti: { tormento: -1, racconto: 1, rep.raschiatori: -0.5, fazione.gilda: 1 }
        fallimento:
          titolo: Lo sportello che scatta
          testo: |
            Lo sportello della lanterna scatta più forte di quanto ricordavi e il
            mercenario di guardia si sveglia. Scappi sotto le assi con un taglio
            sul braccio, e all'alba Tasha passa la Cicatrice con il carro pieno.
          imposta: { gilda.tasha: 2 }
          effetti: { ferite: 1, fazione.gilda: 1 }
      - testo: "Parlare alla merce nella lingua dei recinti"
        descrizione: "Conosci le parole dei recinti di Ghoran, e i nodi che si slegano in fretta."
        quando: [origine.fuggiasco-di-ghoran >= 1]
        esito:
          titolo: La lingua dei recinti
          testo: |
            Di notte dici fra le sponde del carro le parole dei recinti, quelle
            che si dicono prima di scappare, e dentro qualcuno risponde. Ti
            passano le mani fra le assi e tu sciogli i nodi che conosci a memoria,
            una coppia alla volta. All'alba il carro è vuoto, e a te le mani
            tremano fino a mezzogiorno.
          imposta: { gilda.tasha: 4 }
          effetti: { tormento: -1, racconto: 1, rep.raschiatori: -0.5, fazione.gilda: 1 }
