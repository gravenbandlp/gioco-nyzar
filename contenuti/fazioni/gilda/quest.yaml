# La quest della Gilda dei Mercanti, «Il terzo piano» (fazione.gilda 0 → 15, ottobre 2026).
# L'anno in cui scade il mandato del Sovrintendente Tarquin Cordani e Ansaldo Morlacchi, consigliere delle carovane
# e dei magazzini, vuole la sua sedia. Il protagonista entra come aspirante socio e arriva al terzo piano.
# Qui ci sono la pista, la voce della fazione con i cinque gradi, le quality della quest e la Casa dei Nodi come luogo.
# I passi stanno in passi-1.yaml (1-5), passi-2.yaml (6-10), passi-3.yaml (11-15); le tre spedizioni nei file
# spedizione-*.yaml; i servizi ripetibili dei gradi in servizi.yaml; oggetti, nemici e glossario nei loro file.
#
# Le quality della quest (tutte nascoste tranne i voti e il titolo):
#   gilda.ammanco    passo 2: a chi hai riferito l'ammanco del magazzino (1 Cosimo Venn, 2 Lira Demos).
#   gilda.padrino    passo 3: chi ti ha fatto da padrino (1 Irsa Valbrun, 2 Ansaldo Morlacchi, 3 Corin Ashdale).
#                    Con Morlacchi si apre la sua paga mensile (servizi.yaml).
#   gilda.cahir      passo 4: 1 se hai lasciato Cahir fuori dal rapporto.
#   gilda.timbri     passo 5: i timbri falsi del cassetto di Elleri (1 detto a Varn Kett, 2 tenuto per te).
#   gilda.conto      passo 6: il conto dei dazi al Municipio (1 onesto, 2 arrotondato per Morlacchi, 3 onesto e cifrato).
#   gilda.offerta    passo 9: 1 dopo aver ascoltato l'offerta di Morlacchi per il secondo libro.
#   gilda.via        passo 9: come cadono i tre funzionari (1 pulita, 2 quieta, 3 venduta a Morlacchi).
#   gilda.tasha      passo 10: l'ordine sul Ponte del Conciatore (1 eseguito, 2 Tasha avvertita, 3 portato a Tarquin,
#                    4 merce liberata).
#   gilda.vano       passo 11: 1 dopo aver aperto il vano del pilone (se la scorta ti caccia, al ritorno si salta).
#   gilda.127        passo 12: a chi va il documento firmato del 127 (1 Tarquin, 2 il Velo, 3 Morlacchi, 4 nessuno).
#   gilda.voti       i soci che voteranno come chiedi tu; li contano i passi 2, 6, 9, 10, 13 e 14.
#   gilda.giro e gilda.giro-*   passo 13: le visite ai soci (se ne fanno tre, una per bottega o famiglia).
#   gilda.bracco     passo 14: Ugo Bracco (1 consegnato a Varn, 2 morto, 3 fuggito, 4 lasciato fare).
#   gilda.esito      passo 15: chi è Sovrintendente (1 Tarquin rieletto, 2 Irsa Valbrun, 3 Morlacchi).
#   gilda.ombra      dopo il grado III, con rep.scuri >= 2: Varn chiede il nome del tuo contatto (1 dato, 2 tenuto).
#   gilda.consigliere il titolo del grado V, che apre la seduta del terzo piano.
#   gilda.seggio     la coda del seggio dei Malgrani (seggio.malgrani == 2), vista una volta.
quality:
  - { id: fazione.gilda, immagine: fazioni/gilda-dei-mercanti, nome: Il terzo piano, categoria: pista, descrizione: "La Casa dei Nodi cerca soci con le mani pulite proprio l'anno in cui il Sovrintendente Cordani si gioca la sedia. Dal gabbiotto delle Mille Corde alla sala del terzo piano, un nodo alla volta." }
  - { id: gilda.ammanco, nome: L'ammanco del magazzino, categoria: stato, nascosta: true, descrizione: "1 se l'hai riferito a Cosimo Venn, 2 se l'hai portato a Lira Demos." }
  - { id: gilda.padrino, nome: Il padrino alla Casa dei Nodi, categoria: stato, nascosta: true, descrizione: "1 Irsa Valbrun, 2 Ansaldo Morlacchi, 3 Corin Ashdale." }
  - { id: gilda.cahir, nome: Cahir fuori dal rapporto, categoria: stato, nascosta: true, descrizione: "1 se hai lasciato fuori Cahir dal rapporto sulla carovana." }
  - { id: gilda.timbri, nome: I timbri del cassetto, categoria: stato, nascosta: true, descrizione: "1 se hai detto a Varn Kett dei timbri falsi, 2 se li hai tenuti per te." }
  - { id: gilda.conto, nome: Il conto dei dazi, categoria: stato, nascosta: true, descrizione: "1 onesto, 2 arrotondato per Morlacchi, 3 onesto con l'ammanco cifrato." }
  - { id: gilda.offerta, nome: L'offerta di Morlacchi, categoria: stato, nascosta: true }
  - { id: gilda.via, nome: La via della Gilda, categoria: stato, nascosta: true, descrizione: "1 pulita, 2 quieta, 3 venduta a Morlacchi." }
  - { id: gilda.tasha, nome: La merce di Tasha, categoria: stato, nascosta: true, descrizione: "1 l'ordine eseguito, 2 Tasha avvertita, 3 l'ordine portato a Tarquin, 4 la merce liberata." }
  - { id: gilda.vano, nome: Il vano del pilone aperto, categoria: stato, nascosta: true }
  - { id: gilda.127, nome: Il documento del 127, categoria: stato, nascosta: true, descrizione: "1 a Tarquin Cordani, 2 al Velo, 3 a Morlacchi, 4 nascosto in casa." }
  - { id: gilda.voti, immagine: icone/vote, nome: I voti dei soci, categoria: stato, descrizione: "Quanti soci della Gilda voteranno come chiedi tu, quando si eleggerà il Sovrintendente." }
  - { id: gilda.giro, nome: Le visite ai soci, categoria: stato, nascosta: true }
  - { id: gilda.giro-botteghe, nome: Le botteghe con Irsa, categoria: stato, nascosta: true }
  - { id: gilda.giro-approdo, nome: L'approdo delle chiatte, categoria: stato, nascosta: true }
  - { id: gilda.giro-famiglie, nome: Le vecchie famiglie del Patto, categoria: stato, nascosta: true }
  - { id: gilda.giro-tarvelin, nome: La sedia dei Tarvelin, categoria: stato, nascosta: true }
  - { id: gilda.giro-salotto, nome: Il salotto di Isotta Cordani, categoria: stato, nascosta: true }
  - { id: gilda.giro-corin, nome: Il voto di Corin, categoria: stato, nascosta: true }
  - { id: gilda.bracco, nome: Ugo Bracco, categoria: stato, nascosta: true, descrizione: "1 consegnato a Varn, 2 morto sul ponte, 3 fuggito oltre la Cicatrice, 4 lasciato fare." }
  - { id: gilda.esito, nome: Il Sovrintendente eletto, categoria: stato, nascosta: true, descrizione: "1 Tarquin Cordani, 2 Irsa Valbrun, 3 Ansaldo Morlacchi." }
  - { id: gilda.ombra, nome: Il sigillo o l'ombra, categoria: stato, nascosta: true, descrizione: "1 se hai dato a Varn il nome del tuo contatto fra gli Scuri, 2 se l'hai tenuto." }
  - { id: gilda.consigliere, immagine: icone/house-keys, nome: Consigliere del terzo piano, categoria: accesso, descrizione: "Hai una sedia al consiglio interno della Gilda e la chiave della sala del terzo piano, quella con due porte che si chiudono da dentro." }
  - { id: gilda.seggio, nome: Il seggio dei Malgrani alla Gilda, categoria: stato, nascosta: true }

fazioni:
  - id: gilda
    nome: Gilda dei Mercanti
    immagine: fazioni/gilda-dei-mercanti
    reputazione: rep.gilda
    pista: fazione.gilda
    gradi:
      - { passo: 3, nome: Socio di corda, ricompensa: "Il tuo nodo di cera sulla fune dei soci. Il gettone del socio, la licenza della Gilda a chi non l'ha, il banco dei soci alla Casa dei Nodi e una borsa." }
      - { passo: 6, nome: Riscontratore, ricompensa: "La chiave dell'archivio dei dazi. La giubba dei Custodi di Passaggio e il riscontro mensile con Lira Demos, che paga in monete, pratica e pettegolezzi." }
      - { passo: 9, nome: Portasigillo, ricompensa: "Il timbro della Gilda su carichi e cristalli. Il sigillo del portasigillo, la lezione di Leggere il Mana pagata all'Accademia e il banco della Casa dei Nodi che compra in regola." }
      - { passo: 12, nome: Membro eletto, ricompensa: "Una voce in assemblea e la firma sulle lettere di presentazione. Un'arma di Irsa Valbrun fatta per te e la foresteria della Casa dei Nodi, dove dormi senza pagare." }
      - { passo: 15, nome: Consigliere del terzo piano, ricompensa: "Una sedia al consiglio interno e la chiave della sala. La cappa delle mille corde, la catena del terzo piano, la borsa più grande della Gilda, la seduta del terzo piano, la lezione del Sigillo e il titolo." }

luoghi:
  - id: gilda-casa-dei-nodi
    area: quartieri-alti
    nome: Casa dei Nodi
    immagine: fazioni/gilda-dei-mercanti
    sommario: "La sede della Gilda dei Mercanti, con l'archivio dei dazi e la sala del terzo piano."
    requisiti: [fazione.gilda >= 2]
    testo: |
      La Casa dei Nodi è un intrico di catene e di terrazze sospese poco lontano dalla Cattedrale, e i gradini della
      scalinata sono consumati al centro dalle scarpe dei mercanti. Al pianterreno c'è la sala dei soci, con la fune
      dei soci tesa da una trave all'altra e un nodo di cera per ogni nome del Libro. L'archivio dei dazi sta al
      secondo piano, con le finestre sulle catene dei ponti. Al terzo piano si riunisce il consiglio interno,
      nell'unica sala con due porte che si chiudono da dentro.
