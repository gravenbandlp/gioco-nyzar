# La pista di Laresh, spedizione del passo 4 della quest della Gilda (fazione.gilda == 3).
# Ci si entra da `gilda-i-sei-carri` (passi-1.yaml), sulla Superficie. Ritorno in Superficie, soglia 4.
# Le stanze vanno in fasce di profondità, e una stanza superata non ricompare nella stessa visita:
#   0 la conta dei carri (l'assale incrinato; i cani di Cahir, che vale anche a 1);
#   1 le terrazze di basalto (le crepe segnate in rosso; i mugnai senza mulino, predoni, che vale anche a 2);
#   2 i campi a nord (le spighe nere; i fuochi azzurri; il cinghiale nel grano, che vale anche a 3);
#   3 la notte al campo (i cani che ululano verso nord; le impronte).
# Ogni stanza ha una via lunga che costa due rintocchi e fa avanzare comunque.
# Il cuore a 4 è la carovana che non è arrivata: le bestie mutate sul grano nero (combattimento, Addestrare animali
# o Natura, tutte Difficili); chi perde torna in Superficie e può riprovare. Il seguito `gilda-laresh-il-carro-coperto`
# mostra il carro con le catene aperte e la bolla con il sigillo dei magazzini di Morlacchi; Cahir nomina il Pesatore,
# l'uomo che riporta a Ghoran gli schiavi fuggiti. Lì si chiude il passo (gilda.cahir).
# I segreti di Laresh del Codex (la morte nera del grano, i cani verso nord, le impronte) si mostrano e non si spiegano.
# Dopo il passo la stessa strada torna come lavoro ripetibile, La carovana del mese (servizi.yaml).
aree:
  - id: gilda-pista-di-laresh
    immagine: ambientazione/laresh
    nome: La pista di Laresh
    sommario: "La strada dei carri fino al bivio di Laresh, dove la carovana della settimana scorsa non è mai arrivata."
    spedizione: { ritorno: superficie-fratturata, soglia: 4, stanze: 3 }
    testo: |
      La pista dei carri lascia le terrazze di basalto e scende verso ovest
      fino al bivio di Laresh, due giorni di strada se i cani tirano. Pali
      con stracci rossi segnano i punti in cui la crosta del mondo è
      crepata.

      Verso Laresh la terra si fa scura e grassa, e nei campi a nord le
      spighe da lontano sembrano bruciate. I cani di Cahir tengono il muso
      verso nord anche quando la pista gira a sud.

# La musica della spedizione (come le altre aree in contenuti/audio.yaml).
colonna:
  - { contesto: area, id: gilda-pista-di-laresh, musica: uncharted-dreams, ambiente: forest-day }

storylet:
  # ------------------------------------------------------------ 0 · la conta dei carri
  - id: gilda-laresh-la-conta-dei-carri
    immagine: ambientazione/laresh
    titolo: La conta dei carri
    sommario: "Alla prima sosta Cahir conta i carri, e il quarto ha l'assale incrinato."
    luogo: La pista di Laresh, la prima sosta
    area: gilda-pista-di-laresh
    ripetibile: true
    requisiti: [fazione.gilda == 3, profondita.gilda-pista-di-laresh == 0]
    testo: |
      Alla prima sosta Cahir conta carri e cani all'ombra di un masso grande
      come una casa, toccandoli sulla testa uno per uno. Il quarto carro
      cammina storto da mezza mattina, e da fermo si vede la crepa lunga un
      palmo nell'assale posteriore.

      {tecnologia Media} Una crepa così regge un altro giorno se il carico
      sta in avanti. Il sale, naturalmente, l'hanno caricato tutto dietro.

      Cahir guarda l'assale e poi te, perché il carro è della Gilda e la
      Gilda adesso sei tu.
    opzioni:
      - testo: "Rinforzare l'assale"
        descrizione: "Basta una stecca di legno legata con la corda bagnata, e un po' di fortuna."
        prova: { attributo: mentale, abilita: [tecnologia, natura], difficolta: Media }
        successo:
          titolo: La stecca
          testo: |
            Leghi all'assale una stecca tagliata da un palo segnaletico, con corda
            bagnata che asciugando si stringe da sola. Cahir la tira con tutte e
            due le mani e non trova niente da dire.
          pe: { tecnologia: 3 }
          effetti: { profondita.gilda-pista-di-laresh: 1 }
        fallimento:
          titolo: La corda asciutta
          testo: |
            Usi la corda asciutta, e al primo sobbalzo la stecca ti torna indietro
            sulle dita. Cahir rifà il lavoro da capo senza dirti niente.
          effetti: { ferite: 0.5 }
      - testo: "Spostare il sale in avanti"
        descrizione: "Con il carico davanti l'assale si alleggerisce, ma i sacchi pesano."
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Media }
        successo:
          titolo: I sacchi
          testo: |
            Sposti i sacchi di sale in testa al carro uno per uno, con il
            carrettiere che ti aiuta per vergogna, e il quarto carro riparte con
            la ruota quasi dritta.
          pe: { atletica: 3 }
          effetti: { profondita.gilda-pista-di-laresh: 1 }
        fallimento:
          titolo: Il sacco rotto
          testo: |
            Al terzo sacco la tela si strappa e il sale ti finisce negli occhi. Il
            lavoro lo finiscono Cahir e il carrettiere mentre ti lavi la faccia.
          effetti: { ferite: 0.5 }
      - testo: "Lasciare il carro al masso e ripartire"
        descrizione: "Cinque carri arrivano a Laresh e uno aspetta qui il ritorno, e alla Casa qualcuno lo conterà."
        costo: 2
        esito:
          titolo: Cinque carri
          testo: |
            Lasci il quarto carro all'ombra del masso, con il carrettiere di
            guardia e due cani. La carovana riparte più lenta, con i sacchi divisi
            sugli altri cinque.
          effetti: { profondita.gilda-pista-di-laresh: 1 }

  # ------------------------------------------------------------ 0–1 · i cani di Cahir
  - id: gilda-laresh-i-cani-di-cahir
    immagine: icone/sniffing-dog
    titolo: I cani che non vogliono
    sommario: "A un incrocio di sentieri i cani da soma si piantano sulle zampe e non vogliono più andare avanti."
    luogo: La pista di Laresh, un incrocio di sentieri
    area: gilda-pista-di-laresh
    ripetibile: true
    requisiti: [fazione.gilda == 3, profondita.gilda-pista-di-laresh <= 1]
    testo: |
      Dove la pista incrocia un sentiero di pastori i cani si fermano tutti
      insieme, come se qualcuno avesse tirato una corda. Cahir cammina lungo
      la fila parlando a ciascuno a voce bassa, in una lingua che non è
      proprio una lingua.

      {addestrare-animali Media} Hanno le orecchie mozze girate verso nord.
      Ascoltano qualcosa di molto lontano, e finché non smettono non si
      muovono.

      {origine figlio-del-circolo} Al Circolo una muta che si ferma così si
      lascia stare, perché ha sentito qualcosa che le persone non sentono.
    opzioni:
      - testo: "Aiutare Cahir con i cani"
        descrizione: "Si comincia dal capobranco, perché gli altri seguono lui."
        prova: { attributo: sociale, abilita: addestrare-animali, difficolta: Media }
        successo:
          titolo: Il capobranco
          testo: |
            Ti accucci davanti al cane di testa, un maschio grigio con una spalla
            sola, e aspetti che sia lui a guardarti. Quando fai un passo avanti ti
            segue, e gli altri seguono lui.
          pe: { addestrare-animali: 3 }
          effetti: { profondita.gilda-pista-di-laresh: 1 }
        fallimento:
          titolo: Il morso
          testo: |
            Il capobranco ti prende la mano fra i denti senza stringere, e Cahir
            ti tira indietro per il colletto. Ci vuole un'ora perché i cani si
            decidano.
          effetti: { ferite: 0.5 }
      - testo: "Chiedere a Cahir che cosa sentono"
        descrizione: "Lui ha un'idea, ma non è detto che la dica a uno della Gilda."
        prova: { attributo: sociale, abilita: [empatia, persuasione], difficolta: Media }
        successo:
          titolo: Verso nord
          testo: |
            Cahir ci pensa a lungo. «Sono settimane che di notte ululano tutti
            insieme verso nord» dice. «Tengono il muso da quella parte anche se li
            giri nei box.» Poi schiocca la lingua, e i cani si muovono.
          effetti: { profondita.gilda-pista-di-laresh: 1, informazioni.voce: 1 }
        fallimento:
          titolo: Cose di cani
          testo: |
            «Cose di cani» risponde Cahir, e torna a parlare con loro.

            {empatia Media fallita} Gli hai chiesto di tradire i suoi cani davanti
            a un estraneo, e a uno stalliere non si chiede.
          effetti: { tormento: 1 }
      - testo: "Aspettare che si decidano da soli"
        descrizione: "Prima o poi smettono di ascoltare, ma il pomeriggio è corto."
        costo: 2
        esito:
          titolo: Il pomeriggio perso
          testo: |
            Aspettate seduti, con Cahir che fuma una radice secca che puzza di
            stalla, finché il capobranco non scuote la testa come se si
            svegliasse. Ripartite con il sole già basso.
          effetti: { profondita.gilda-pista-di-laresh: 1 }

  # ------------------------------------------------------------ 1 · le terrazze di basalto
  - id: gilda-laresh-le-crepe-segnate
    immagine: ambientazione/superficie-fratturata
    titolo: Le crepe segnate in rosso
    sommario: "Sulle terrazze di basalto una ruota del secondo carro è finita in una crepa."
    luogo: La pista di Laresh, le terrazze di basalto
    area: gilda-pista-di-laresh
    ripetibile: true
    requisiti: [fazione.gilda == 3, profondita.gilda-pista-di-laresh == 1]
    testo: |
      Le terrazze di basalto scendono verso ovest in gradoni neri, e la
      pista ci passa sopra fra crepe larghe un braccio da cui sale un
      bagliore azzurro. Ognuna ha il suo palo con lo straccio rosso, e i più
      vecchi sono sbiaditi fino al bianco. La ruota destra del secondo carro
      è finita in una crepa fino al mozzo.

      {percezione Media} Lo straccio bianco segna una crepa vecchia, che si
      è chiusa. Quella della ruota non ha palo perché è nuova.
    opzioni:
      - testo: "Sollevare il carro con una leva"
        descrizione: "Un palo segnaletico con un sasso sotto, e sopra tutto il tuo peso."
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Media }
        successo:
          titolo: La leva
          testo: |
            Fai leva con un palo sotto il mozzo mentre Cahir fa tirare i cani, e
            il carro esce grattando la pietra. Pianti il palo accanto alla crepa
            nuova, con il tuo fazzoletto in cima.
          pe: { atletica: 3 }
          effetti: { profondita.gilda-pista-di-laresh: 1 }
        fallimento:
          titolo: Il palo spezzato
          testo: |
            Il palo si spezza e finisci in ginocchio sul bordo della crepa, così
            vicino da sentirne il calore. Il carro esce dopo un'ora di lavoro di
            tutti.
          effetti: { ferite: 1 }
      - testo: "Trovare la strada buona fra le crepe"
        descrizione: "Gli stracci vecchi dicono dove la crosta ha già ceduto, se si guarda bene."
        prova: { attributo: mentale, abilita: [percezione, natura], difficolta: Media }
        successo:
          titolo: Gli stracci bianchi
          testo: |
            Leggendo i pali capisci che la crosta si rompe lungo una linea, come
            un piatto incrinato. Fai passare la carovana sulla pietra vecchia e
            tirate fuori il secondo carro da terreno saldo.
          pe: { percezione: 3 }
          effetti: { profondita.gilda-pista-di-laresh: 1 }
        fallimento:
          titolo: Un'altra crepa
          testo: |
            La strada che scegli porta la ruota del terzo carro in un'altra crepa
            nuova, e liberare i due carri vi prende il resto della giornata.
          effetti: { tormento: 1 }
      - testo: "Scaricare il carro e farlo uscire vuoto"
        descrizione: "Si fa sempre quando c'è tempo, e il tempo lo paghi tu."
        costo: 2
        esito:
          titolo: Vuoto
          testo: |
            Scaricate il carro sacco per sacco, lo tirate fuori vuoto e lo
            ricaricate oltre la crepa. A sera hai le braccia di legno, ma la
            carovana è intera.
          effetti: { profondita.gilda-pista-di-laresh: 1 }

  # ------------------------------------------------------------ 1–2 · i mugnai senza mulino
  - id: gilda-laresh-i-mugnai-senza-mulino
    immagine: ambientazione/superficie-fratturata
    titolo: I mugnai senza mulino
    sommario: "Quattro uomini armati sbarrano la pista con un carretto rovesciato, e hanno le mani bianche di farina."
    luogo: La pista di Laresh, sotto le terrazze
    area: gilda-pista-di-laresh
    ripetibile: true
    requisiti: [fazione.gilda == 3, profondita.gilda-pista-di-laresh >= 1, profondita.gilda-pista-di-laresh <= 2]
    testo: |
      Sotto l'ultima terrazza la pista è sbarrata da un carretto rovesciato.
      Dietro ci sono quattro uomini in armature spaiate, e uno porta un
      grembiule da mugnaio sopra la cotta di cuoio. Chiedono un sacco ogni
      carro per il passaggio.

      {conoscenze-della-strada Media} Sono mugnai senza mulino. Quando un
      mulino brucia, la gente che ci lavorava finisce sulla strada, e
      qualcuno ci finisce con un'ascia.

      {armi-da-mischia Facile} Stanno troppo vicini al carretto, e il primo
      che indietreggia ci inciampa.

      Il mugnaio ti guarda il gettone di bronzo e sputa per terra, lontano
      dai tuoi piedi, con una certa educazione.
    opzioni:
      - testo: "Rovesciare il carretto e passare"
        descrizione: "Sono quattro uomini stanchi e affamati, e tu hai ventiquattro cani alle spalle."
        combattimento: gilda-i-mugnai-senza-mulino
        vittoria:
          titolo: La pista libera
          testo: |
            Il primo che indietreggia inciampa nel carretto, e gli altri scappano
            appena vedono i cani slegati. Nel carretto ci sono soltanto due
            pagnotte dure e un setaccio rotto.
          effetti: { profondita.gilda-pista-di-laresh: 1 }
        sconfitta:
          titolo: Un sacco ogni carro
          testo: |
            Ti mettono a terra in due, e il mugnaio ti tiene l'ascia sopra la
            testa finché Cahir non getta sei sacchi di sale. Ti lasciano la pista
            libera e un livido sulla tempia.
          effetti: { ferite: 1, rep.gilda: -0.5 }
      - testo: "Parlare con il mugnaio"
        descrizione: "Un uomo con il grembiule addosso non ha ancora deciso di essere un predone."
        prova: { attributo: sociale, abilita: [persuasione, empatia], difficolta: Media }
        successo:
          titolo: Il mulino di Rivopuma
          testo: |
            Lavorava a Rivopuma, al mulino bruciato da tre angoli insieme due anni
            fa. Quando gli dici che a Qir-Azel il Mulino Malgrani cerca braccia
            ride amaro, ma fa spostare il carretto e si accontenta di una pagnotta
            a testa.
          pe: { persuasione: 3 }
          effetti: { profondita.gilda-pista-di-laresh: 1, rep.gilda: 0.5 }
        fallimento:
          titolo: La Gilda
          testo: |
            Il mugnaio sente parlare la Gilda e basta, e ti risponde che i mulini
            bruciano e la Gilda incassa lo stesso. Il prezzo sale a due sacchi, e
            Cahir li getta prima che tu possa discutere.
          effetti: { rep.gilda: -0.5 }
      - testo: "Fare mostrare i denti ai cani"
        descrizione: "Ventiquattro cani da soma slegati si capiscono in ogni lingua."
        prova: { attributo: sociale, abilita: [intimidire, addestrare-animali], difficolta: Media }
        successo:
          titolo: I denti
          testo: |
            Cahir slega sei cani, che avanzano senza abbaiare. I quattro uomini
            fanno i conti in fretta e se ne vanno su per la terrazza camminando
            all'indietro.
          pe: { intimidire: 3 }
          effetti: { profondita.gilda-pista-di-laresh: 1 }
        fallimento:
          titolo: Il cane ferito
          testo: |
            Uno degli uomini colpisce un cane con il piatto dell'ascia, e gli
            altri si fermano. Cahir getta due sacchi oltre il carretto e passa a
            piedi, con il cane ferito in braccio e una faccia che non
            dimenticherai.
          effetti: { rep.gilda: -0.5, tormento: 1 }

  # ------------------------------------------------------------ 2 · i campi a nord
  - id: gilda-laresh-le-spighe-nere
    immagine: ambientazione/laresh
    titolo: Le spighe nere
    sommario: "Ai lati della pista i campi di Laresh sono pronti per il raccolto, ma da vicino le spighe sono nere."
    luogo: La pista di Laresh, i campi a nord
    area: gilda-pista-di-laresh
    ripetibile: true
    requisiti: [fazione.gilda == 3, profondita.gilda-pista-di-laresh == 2]
    testo: |
      Dopo le terrazze cominciano i campi di Laresh, gialli verso sud fino
      all'orizzonte e verso nord spenti a chiazze, nere dove si toccano. Una
      spiga staccata dal bordo della pista ti si sgretola fra le dita come
      carbone bagnato.

      {natura Media} Una ruggine del grano parte dalle foglie e sale. Questa
      è partita dal chicco e ha lasciato verdi le foglie, come se il seme
      fosse morto prima di germogliare.

      Cahir non guarda i campi. Ti dice che i contadini la chiamano morte
      nera, e poi tace per un pezzo di strada.
    opzioni:
      - testo: "Studiare il grano malato"
        descrizione: "Una manciata di spighe, un po' di terra e la pazienza di guardarle bene."
        prova: { attributo: mentale, abilita: [natura, medicina], difficolta: Media }
        successo:
          titolo: Dal sotto
          testo: |
            Scavi fino alle radici e vedi che la malattia è salita da sotto, da
            una terra fredda come una cantina. Ti metti in tasca una spiga avvolta
            nel fazzoletto, per farla vedere a chi ne sa di più.
          pe: { natura: 3 }
          effetti: { profondita.gilda-pista-di-laresh: 1, informazioni.pettegolezzo: 1 }
        fallimento:
          titolo: La polvere scura
          testo: |
            Rigiri le spighe a lungo e ti resta soltanto una polvere scura sulle
            mani, che non va via.
          effetti: { profondita.gilda-pista-di-laresh: 1, tormento: 1 }
      - testo: "Tirare dritto tenendo la bocca coperta"
        descrizione: "La polvere del grano nero si alza a ogni folata, ed è meglio non respirarla."
        prova: { attributo: fisico, abilita: resistenza, difficolta: Media }
        successo:
          titolo: Il fazzoletto
          testo: |
            Attraversi i campi neri con il fazzoletto sulla bocca mentre i cani
            starnutiscono a turno, e quando il grano torna giallo l'aria ti sembra
            dolce.
          effetti: { profondita.gilda-pista-di-laresh: 1 }
        fallimento:
          titolo: La tosse
          testo: |
            Il fazzoletto scivola e la polvere ti entra in gola. Tossisci fino
            alla fine dei campi, e Cahir ti passa la borraccia senza guardarti.
          effetti: { profondita.gilda-pista-di-laresh: 1, ferite: 0.5 }
      - testo: "Allungare la strada per i campi gialli"
        descrizione: "Verso sud il grano è sano, e i cani il giro lungo lo fanno volentieri."
        costo: 2
        esito:
          titolo: Il giro dei campi gialli
          testo: |
            Fai girare la carovana verso sud e i cani tirano con la coda dritta.
            Perdete mezza giornata, e a sera i campi neri sono una macchia
            lontana.
          effetti: { profondita.gilda-pista-di-laresh: 1 }

  - id: gilda-laresh-i-fuochi-azzurri
    immagine: ambientazione/laresh
    titolo: I fuochi azzurri
    sommario: "Al tramonto, sopra i campi, si accendono piccole fiamme azzurre che non scaldano e non fanno fumo."
    luogo: La pista di Laresh, i campi a nord, al tramonto
    area: gilda-pista-di-laresh
    ripetibile: true
    requisiti: [fazione.gilda == 3, profondita.gilda-pista-di-laresh == 2]
    testo: |
      Al tramonto, sopra i campi a nord, si accendono piccole fiamme azzurre che galleggiano
      all'altezza di un uomo e si spengono senza lasciare segno. I cani non le guardano nemmeno. Cahir
      dice che a Laresh li chiamano gli spiriti dei morti, e lo dice senza crederci e senza ridere.

      {magia Media} Il Mana qui è sottile come in tutta la Superficie, e i fuochi non ne prendono.
      Bruciano qualcos'altro, o non bruciano affatto.

      Uno dei fuochi si ferma in mezzo alla pista, davanti al primo cane.
    opzioni:
      - testo: "Passarci accanto senza guardarlo"
        descrizione: "I cani ci riescono, e allora ci riesci anche tu."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Media }
        successo:
          titolo: Accanto
          testo: |
            Passando accanto alla fiamma senti un fresco leggero sulla guancia,
            come una porta aperta in un'altra stanza. Poi è dietro di te, e non ti
            volti.
          effetti: { profondita.gilda-pista-di-laresh: 1 }
        fallimento:
          titolo: Il fresco sulla guancia
          testo: |
            Non riesci a staccarle gli occhi di dosso finché non si spegne, e
            quando ti riscuoti ti tocca correre dietro ai carri.
          effetti: { tormento: 1 }
      - testo: "Tendere la mano verso la fiamma"
        descrizione: "Non scalda e non fa fumo, e forse risponde a chi sa ascoltare il Mana."
        prova: { attributo: mentale, abilita: [magia, accademiche], difficolta: Media }
        successo:
          titolo: Freddo
          testo: |
            La fiamma è fredda come acqua di fonte. Si piega verso nord come i
            cani e si spegne, lasciandoti sul palmo una luce azzurra che svanisce
            piano.

            {accademiche Difficile} I testi dei Precursori parlano di luci che
            segnano i confini delle cose sepolte, ma solo in poche note a margine.
          pe: { magia: 3 }
          effetti: { profondita.gilda-pista-di-laresh: 1, tormento: 1 }
        fallimento:
          titolo: La mano azzurra
          testo: |
            Il freddo della fiamma ti sale fino alla spalla, e per un'ora le dita
            restano azzurre sulle unghie. Cahir ti massaggia la mano come a un
            cane che ha preso il gelo.
          effetti: { tormento: 1.5 }
      - testo: "Aspettare che si spengano tutti"
        descrizione: "A Laresh dicono che durano poco, e lì poco può voler dire una notte."
        costo: 2
        esito:
          titolo: La notte dei fuochi
          testo: |
            Aspettate con i carri fermi che i fuochi si spengano sempre più
            lontani, e l'ultimo muore a luna alta. Ripartite al buio.
          effetti: { profondita.gilda-pista-di-laresh: 1 }

  # ------------------------------------------------------------ 2–3 · il cinghiale nel grano
  - id: gilda-laresh-il-cinghiale-nel-grano
    immagine: icone/boar
    titolo: Il cinghiale nel grano
    sommario: "Nel grano nero grufola una bestia grossa come un vitello, con la schiena coperta di placche."
    luogo: La pista di Laresh, ai margini del grano nero
    area: gilda-pista-di-laresh
    ripetibile: true
    requisiti: [fazione.gilda == 3, profondita.gilda-pista-di-laresh >= 2, profondita.gilda-pista-di-laresh <= 3]
    testo: |
      I cani ringhiano tutti verso lo stesso punto del grano nero, dove le
      spighe ondeggiano senza vento, e il cinghiale esce sulla pista. È
      grosso come un vitello, con le zanne storte e la schiena coperta di
      placche grigie che sembrano pietra.

      {armi-da-mischia Media} Le placche finiscono dietro la spalla. Lì
      sotto la pelle è nuda, e il cuore non è lontano.

      Cahir afferra il capobranco per il collare, e il cinghiale abbassa la
      testa.
    opzioni:
      - testo: "Affrontarlo sulla pista"
        descrizione: "Prima che carichi i carri, o i cani."
        combattimento: gilda-il-cinghiale-nel-grano
        vittoria:
          titolo: Dietro la spalla
          testo: |
            Lo colpisci dietro la spalla e crolla sulla pista come un sacco pieno.
            Cahir gli taglia le zanne e te ne regala una, come si fa a Laresh con
            chi uccide la bestia.
          effetti: { profondita.gilda-pista-di-laresh: 1, racconto: 1 }
        sconfitta:
          titolo: Il carro rovesciato
          testo: |
            Il cinghiale ti passa sopra come un carro in discesa e rovescia il
            secondo carro. Raddrizzarlo e raccogliere il sale vi prende il resto
            della giornata.
          effetti: { ferite: 1 }
      - testo: "Fargli girare la testa con i cani"
        descrizione: "Un cinghiale carica quello che ha davanti, e sei cani da sei parti lo confondono."
        prova: { attributo: sociale, abilita: addestrare-animali, difficolta: Media }
        successo:
          titolo: Sei cani da sei parti
          testo: |
            Sei cani girano intorno al cinghiale ai fischi di Cahir. La bestia
            carica il vuoto due volte e rientra nel grano sbuffando.
          pe: { addestrare-animali: 3 }
          effetti: { profondita.gilda-pista-di-laresh: 1 }
        fallimento:
          titolo: Il cane morto
          testo: |
            Un cane si avvicina troppo e il cinghiale lo lancia nel grano con una
            zanna. Cahir mette il cane morto su un carro, e per il resto del
            giorno non ti rivolge la parola.
          effetti: { tormento: 1, rep.gilda: -0.5 }
      - testo: "Far tornare indietro i carri e aspettare"
        descrizione: "Un cinghiale prima o poi se ne va."
        costo: 2
        esito:
          titolo: Indietro piano
          testo: |
            Fai arretrare i carri senza voltare le spalle al grano e aspetti che
            il cinghiale se ne vada. Ripassate a sera.
          effetti: { profondita.gilda-pista-di-laresh: 1 }

  # ------------------------------------------------------------ 3 · la notte al campo
  - id: gilda-laresh-la-notte-al-campo
    immagine: icone/wolf-howl
    titolo: La notte al campo
    sommario: "L'ultima notte prima del bivio, a mezzanotte, i cani ululano tutti insieme verso nord."
    luogo: La pista di Laresh, l'ultimo accampamento
    area: gilda-pista-di-laresh
    ripetibile: true
    requisiti: [fazione.gilda == 3, profondita.gilda-pista-di-laresh == 3]
    testo: |
      L'ultima notte prima del bivio vi accampate con i carri in cerchio e
      un fuoco piccolo, perché sulla Superficie la legna è poca e Cahir la
      conta.

      A mezzanotte i cani si mettono in piedi tutti insieme e ululano verso
      nord su una nota lunga, che non finisce. Cahir si mette a sedere e li
      guarda senza fermarli.

      {addestrare-animali Difficile} I cani che ululano alla luna cambiano
      nota uno dall'altro. Questi la tengono uguale, come un coro che ha
      provato a lungo.
    opzioni:
      - testo: "Fare la guardia fino alle tre"
        descrizione: "Qualcuno deve restare sveglio, e Cahir ha i cani da guardare."
        prova: { attributo: fisico, abilita: [resistenza, percezione], difficolta: Media }
        successo:
          titolo: Le tre
          testo: |
            Vegli con la lama sulle ginocchia, e alle tre in punto i cani smettono
            tutti insieme. Per un momento, molto lontano a nord, ti sembra di
            vedere qualcosa di alto muoversi contro le stelle.
          pe: { resistenza: 3 }
          effetti: { profondita.gilda-pista-di-laresh: 1 }
        fallimento:
          titolo: Addormentato
          testo: |
            Verso le due ti addormenti seduto, e all'alba Cahir ti guarda da sopra
            la tazza.
          effetti: { profondita.gilda-pista-di-laresh: 1, tormento: 1 }
      - testo: "Calmare i cani"
        descrizione: "Un cane si calma con la voce e con le mani, ma ventiquattro sono un'altra cosa."
        prova: { attributo: sociale, abilita: addestrare-animali, difficolta: Media }
        successo:
          titolo: La voce bassa
          testo: |
            Passi fra i cani con la voce bassa di Cahir e una mano sul collo di
            ciascuno, e smettono a uno a uno prima delle tre. Il capobranco per
            ultimo, quando gli tocchi la spalla sola.
          pe: { addestrare-animali: 3 }
          effetti: { profondita.gilda-pista-di-laresh: 1 }
        fallimento:
          titolo: Il coro
          testo: |
            I cani non ti vedono nemmeno, e ululano fino alle tre con te in mezzo
            e la nota che ti vibra nello sterno.
          effetti: { profondita.gilda-pista-di-laresh: 1, tormento: 1 }
      - testo: "Tirarsi la coperta sulla testa"
        descrizione: "Domani c'è il bivio, e stanotte il sonno si prende come viene."
        costo: 2
        esito:
          titolo: Sotto la coperta
          testo: |
            La nota passa anche attraverso la coperta, e all'alba ti svegli stanco
            come se avessi camminato tutta la notte verso nord.
          effetti: { profondita.gilda-pista-di-laresh: 1, tormento: 1 }

  - id: gilda-laresh-le-impronte
    immagine: ambientazione/laresh
    titolo: Le impronte nel fango
    sommario: "A un guado asciutto ci sono impronte di uomini e altre, molto più grandi, con i passi troppo distanti."
    luogo: La pista di Laresh, un guado asciutto
    area: gilda-pista-di-laresh
    ripetibile: true
    requisiti: [fazione.gilda == 3, profondita.gilda-pista-di-laresh == 3]
    testo: |
      Nel fango secco del guado la pista è piena di impronte di stivali, e sopra
      ce ne sono altre, larghe quanto un secchio, a una distanza che un uomo non
      fa nemmeno correndo.

      {percezione Media} Gli stivali vanno verso la città e le impronte grandi
      verso nord, e dove si incrociano sono quelle grandi a stare sopra.

      I cani non vogliono scendere. «È la strada della carovana della settimana
      scorsa, e il bivio è dietro quella collina» dice Cahir.

      {origine fuggiasco-di-ghoran} Fra gli stivali ci sono piedi nudi, piccoli,
      a coppie troppo vicine, di gente incatenata a due a due.
    opzioni:
      - testo: "Seguire le impronte grandi per un tratto"
        descrizione: "Fino al bordo dei campi, abbastanza per capire dove vanno."
        prova: { attributo: mentale, abilita: [natura, percezione], difficolta: Media }
        successo:
          titolo: Verso nord
          testo: |
            Al bordo dei campi neri il grano è spezzato in una striscia larga come
            una strada, che va dritta verso nord fino all'orizzonte. Torni ai
            carri voltandoti spesso.
          pe: { natura: 3 }
          effetti: { profondita.gilda-pista-di-laresh: 1, informazioni.segreto: 1 }
        fallimento:
          titolo: La striscia
          testo: |
            Le segui troppo a lungo, e quando torni Cahir ti aspetta con la frusta
            in mano e una faccia scura.
          effetti: { profondita.gilda-pista-di-laresh: 1, tormento: 1 }
      - testo: "Disegnare le impronte e misurarle"
        descrizione: "Una cosa misurata si può far vedere in città a chi ne sa di più."
        prova: { attributo: mentale, abilita: [accademiche, tecnologia], difficolta: Media }
        successo:
          titolo: Le misure
          testo: |
            Misuri le impronte con la cinghia di un cane e le disegni sul retro di
            una bolla di carico. Ne esce una cosa alta tre volte un uomo, leggera,
            che cammina a balzi lunghi.
          pe: { accademiche: 3 }
          effetti: { profondita.gilda-pista-di-laresh: 1, informazioni.pettegolezzo: 1 }
        fallimento:
          titolo: I conti che non tornano
          testo: |
            Ogni volta i numeri vengono diversi, e Cahir ti chiede se hai finito
            di giocare.
          effetti: { profondita.gilda-pista-di-laresh: 1, tormento: 1 }
      - testo: "Passare il guado senza guardare per terra"
        descrizione: "Le impronte restano dove sono, e il bivio è dietro la collina."
        costo: 2
        esito:
          titolo: Dietro la collina
          testo: |
            Passi il guado con la mano sul collo del capobranco. In cima alla
            collina Cahir si ferma e ti indica qualcosa più in basso, nel grano
            nero.
          effetti: { profondita.gilda-pista-di-laresh: 1 }

  # ------------------------------------------------------------ il cuore · la carovana che non è arrivata
  - id: gilda-laresh-la-carovana-scomparsa
    immagine: ambientazione/laresh
    titolo: La carovana che non è arrivata
    sommario: "Poco prima del bivio, nel grano nero, ci sono i carri rovesciati della settimana scorsa, circondati dalle bestie della Marea."
    luogo: La pista di Laresh, poco prima del bivio
    area: gilda-pista-di-laresh
    requisiti: [fazione.gilda == 3, profondita.gilda-pista-di-laresh >= 4]
    testo: |
      Nel grano nero, a cento passi dalla pista, ci sono cinque carri di
      Laresh rovesciati su un fianco e uno più alto, coperto di tela cerata,
      ancora in piedi. Sul grano dei sacchi sventrati grufola un cinghiale
      coperto di placche grigie, e due vermi lunghi come un uomo strisciano
      lì intorno.

      Cahir non trova i suoi quattro cani. Il carro coperto non è di Laresh,
      ti dice a voce bassa, e le bestie non vi lasceranno avvicinare finché
      c'è grano.

      {origine fuggiasco-di-ghoran} Ai lati della pedana del carro coperto
      ci sono anelli di ferro all'altezza delle caviglie, e tu li hai visti
      dalla parte di chi ci stava legato.

      {armi-da-mischia Media} Il problema è il cinghiale, perché i vermi
      sono ciechi e si girano soltanto verso il rumore.
    opzioni:
      - testo: "Cacciare le bestie con la lama"
        descrizione: "Prima il cinghiale e poi i vermi, che hanno la testa nel grano."
        combattimento: gilda-le-bestie-sul-grano
        vittoria:
          titolo: Il grano sparso
          testo: |
            L'ultimo verme si contorce e smette di muoversi. Hai le braccia sporche
            fino ai gomiti di una cosa che puzza di cantina, e Cahir ti passa accanto
            dritto verso il carro coperto.
          pe: { armi-da-mischia: 3 }
          segue: gilda-laresh-il-carro-coperto
        sconfitta:
          titolo: Indietro fino ai carri
          testo: |
            Il cinghiale ti manda nel grano nero, e Cahir ti tira fuori per le
            caviglie. Riportate la carovana in Superficie, con te sdraiato sui
            sacchi di sale.
          vai: superficie-fratturata
      - testo: "Mandare i cani di Cahir"
        descrizione: "Ventiquattro cani contro tre bestie, da mandare tutti insieme e far tornare tutti."
        prova: { attributo: sociale, abilita: addestrare-animali, difficolta: Difficile }
        successo:
          titolo: La muta
          testo: |
            I cani corrono nel grano nero al fischio che ti ha insegnato Cahir,
            abbaiando per la prima volta da giorni, e le bestie fuggono. Quando
            tornano li conti, e sono ventiquattro.
          pe: { addestrare-animali: 5 }
          segue: gilda-laresh-il-carro-coperto
        fallimento:
          titolo: I cani dispersi
          testo: |
            Il cinghiale si gira e prende due cani, e gli altri si disperdono; a
            sera ne mancano tre. Cahir riporta la carovana in Superficie senza
            guardarti.
          effetti: { tormento: 1, rep.gilda: -0.5 }
          vai: superficie-fratturata
      - testo: "Allontanarle con il grano buono"
        descrizione: "Le bestie mangiano il grano sano, e un sacco aperto controvento le porta lontano dai carri."
        prova: { attributo: mentale, abilita: [natura, addestrare-animali], difficolta: Difficile }
        successo:
          titolo: Controvento
          testo: |
            Spargi controvento un sacco di grano sano e le bestie ti seguono una
            dopo l'altra fino a un avvallamento. Le lasci a mangiare e torni di
            corsa ai carri.
          pe: { natura: 5 }
          segue: gilda-laresh-il-carro-coperto
        fallimento:
          titolo: Il vento che gira
          testo: |
            Il vento gira, e il cinghiale sente te prima del grano. Ti salvi sotto
            un carro rovesciato, e Cahir riporta la carovana in Superficie.
          effetti: { ferite: 1 }
          vai: superficie-fratturata
      - testo: "Tornare indietro e riprovare un'altra volta"
        descrizione: "Con più gente o con più coraggio, perché il carro coperto non scappa."
        costo: 0
        esito:
          titolo: Un'altra volta
          testo: |
            La carovana torna indietro piano, e il carro coperto resta nel grano
            con la tela che sbatte, finché la collina non lo nasconde.
          vai: superficie-fratturata
      - testo: "Leggere le bestie come al Circolo"
        descrizione: "Al Circolo le bestie della Marea temono la terra che le ha cambiate, e basta fargliela annusare."
        quando: [origine.figlio-del-circolo >= 1]
        prova: { attributo: mentale, abilita: [natura, addestrare-animali], difficolta: Media }
        successo:
          titolo: La terra fredda
          testo: |
            Spargi davanti a te la terra fredda di sotto il grano nero, e le
            bestie indietreggiano come da un posto dove sono state male. Cahir ti
            guarda come se ti vedesse per la prima volta.
          pe: { natura: 5 }
          segue: gilda-laresh-il-carro-coperto
        fallimento:
          titolo: La terra sbagliata
          testo: |
            È terra di pista, e le bestie non se ne accorgono. Ti salvi dal
            cinghiale sotto un carro rovesciato, e Cahir riporta la carovana in
            Superficie.
          effetti: { ferite: 1 }
          vai: superficie-fratturata

  - id: gilda-laresh-il-carro-coperto
    immagine: icone/manacles
    titolo: Il carro coperto
    tipo: seguito
    luogo: La pista di Laresh, fra i carri rovesciati
    area: gilda-pista-di-laresh
    requisiti: [fazione.gilda == 3]
    testo: |
      Il carro coperto non ha un nome sulla sponda. Sotto la tela cerata la
      pedana ha due file di anelli di ferro con le catene ancora attaccate,
      aperte con la chiave e non spezzate, e sulla paglia c'è una scodella
      di legno rovesciata.

      Nella cassetta c'è la bolla di carico. Dice *sementi*, sei casse per i
      magazzini di scarico della Gilda, con il sigillo dei magazzini, lo
      stesso delle buste di cuoio di Elleri.

      {politica-ed-economia Media} Una bolla così passa a ogni gabbiotto,
      perché nessuno apre un carro con il sigillo dei magazzini.

      «Questo carro è del Pesatore» dice Cahir, e sputa nel grano. «Quello
      che riporta a Ghoran chi scappa, e si fa pagare a peso.» Poi ti chiede
      di lasciarlo fuori dal rapporto, perché ha una muta da mandare avanti
      e un giorno una carovana sua, e non vuole il suo nome accanto a quello
      del Pesatore.
    opzioni:
      - testo: "Mettere Cahir nel rapporto"
        descrizione: "Un rapporto è un rapporto, e alla Casa dei Nodi una riga omessa prima o poi si paga."
        esito:
          titolo: Tutto scritto
          testo: |
            Il rapporto lo scrivi intero, e Cahir annuisce come se se lo
            aspettasse. Per il resto del viaggio parla soltanto con i cani. Alla
            Casa ti pagano una quota del carico e scrivono il tuo nome accanto a
            quello di Cahir in un registro.
          pe: { politica-ed-economia: 3 }
          effetti: { monete: 20, rep.gilda: 0.5, racconto: 1, fazione.gilda: 1 }
          vai: superficie-fratturata
      - testo: "Lasciarlo fuori dal rapporto"
        descrizione: "Alla Casa qualcuno noterà la riga in meno, e Cahir se lo ricorderà."
        esito:
          titolo: Una riga in meno
          testo: |
            Nel rapporto il suo nome non c'è, e Cahir ti stringe la mano con una
            presa da stalliere. Alla Casa ti pagano una quota del carico, e Varn
            alza gli occhi dal foglio per chiedere chi guidava i cani.
          imposta: { gilda.cahir: 1 }
          effetti: { monete: 20, rep.gilda: -0.5, racconto: 1, fazione.gilda: 1 }
          vai: superficie-fratturata
      - testo: "Chiedergli del Pesatore, prima di decidere"
        descrizione: "Uno che riporta a Ghoran chi scappa. Cahir ne sa più di quanto dica."
        prova: { attributo: sociale, abilita: [empatia, conoscenze-della-strada], difficolta: Media }
        successo:
          titolo: A peso
          testo: |
            Il Pesatore, ti racconta Cahir, pesa i fuggiaschi prima di riportarli
            indietro, e chi li ha comprati paga a peso. Di solito viaggia per
            strade sue, e stavolta si è infilato in una carovana della Gilda. Lo
            lasci fuori dal rapporto, e alla Casa ti pagano una quota del carico.
          imposta: { gilda.cahir: 1 }
          effetti: { monete: 20, rep.gilda: -0.5, racconto: 1, fazione.gilda: 1 }
          vai: superficie-fratturata
        fallimento:
          titolo: Basta così
          testo: |
            Del Pesatore, risponde Cahir, conviene saperne il meno possibile. Nel
            rapporto scrivi tutto, il suo nome compreso, e alla Casa ti pagano una
            quota del carico.
          effetti: { monete: 20, rep.gilda: 0.5, racconto: 1, fazione.gilda: 1, sospetto: 0.5 }
          vai: superficie-fratturata
