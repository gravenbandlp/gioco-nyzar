# I servizi e i lavori ripetibili della Gilda dei Mercanti, che si aprono con i gradi della quest (fazione.gilda).
#   grado I   (passo 3)  `gilda-il-banco-dei-soci`: bende, tonici e unguenti a prezzo da socio, alla Casa dei Nodi.
#                        `gilda-la-paga-di-morlacchi`: la paga mensile, se il padrino è Morlacchi (gilda.padrino == 2).
#   dal passo 4          `gilda-la-carovana-del-mese`: la pista di Laresh come lavoro, sulla Superficie.
#   grado II  (passo 6)  `gilda-il-riscontro`: il riscontro mensile all'archivio con Lira (non nella via venduta).
#   grado III (passo 9)  `gilda-il-banco-della-casa`: la Casa compra in regola cristalli, frammenti e segreti.
#                        `gilda-la-lezione-pagata`: Leggere il Mana (Magia 2) pagata dalla Gilda all'Accademia; con il
#                        grado V anche il Sigillo (Magia 3).
#   grado IV  (passo 12) `gilda-il-pezzo-di-irsa`: Irsa fa un'arma di grado 3 a scelta (una volta).
#                        `gilda-la-foresteria`: si dorme alla Casa dei Nodi senza pagare.
#   grado V   (passo 15) `gilda-la-seduta-del-terzo-piano`: la rendita del consigliere (gilda.consigliere).
storylet:
  # ------------------------------------------------------------ grado I · il banco dei soci
  - id: gilda-il-banco-dei-soci
    presso: gilda-casa-dei-nodi
    immagine: icone/token
    titolo: Il banco dei soci
    sommario: "Al pianterreno della Casa un banco vende ai soci il necessario per la strada, a prezzo da socio."
    luogo: Casa dei Nodi, il banco dei soci
    area: quartieri-alti
    ripetibile: true
    requisiti: [fazione.gilda >= 3]
    testo: |
      Il banco dei soci sta sotto la scalinata, in un vecchio ripostiglio, e
      lo tiene una donna anziana con gli occhiali sulla punta del naso.
      Vende i rimedi della Dispensa al ricarico più basso della città, ma
      prima ti guarda il gettone alla cintura.
    opzioni:
      - testo: "Comprare delle bende"
        descrizione: "Al prezzo da socio."
        requisiti: [monete >= 6]
        costo: 0
        esito:
          titolo: Le bende
          testo: |
            La donna ti avvolge le bende in un vecchio foglio di registro e ci
            aggiunge una caramella di menta.
          effetti: { monete: -6, bende: 1 }
      - testo: "Comprare un tonico"
        descrizione: "Una fiala della Dispensa, al prezzo da socio."
        requisiti: [monete >= 24]
        costo: 0
        esito:
          titolo: Il tonico
          testo: |
            La donna ti porge la fiala tenendola per il collo, come un vino buono.
          effetti: { monete: -24, tonico: 1 }
      - testo: "Comprare un unguento"
        descrizione: "Un vasetto della Dispensa, al prezzo da socio."
        requisiti: [monete >= 20]
        costo: 0
        esito:
          titolo: L'unguento
          testo: |
            La donna ti dà il vasetto e ti consiglia di scaldarlo fra le mani
            prima, perché fa meno male.
          effetti: { monete: -20, unguento: 1 }
      - testo: "Fermarsi a sentire le voci della Casa"
        descrizione: "Al banco dei soci passano tutti, e la donna sente tutto."
        prova: { attributo: sociale, abilita: [conoscenze-della-strada, empatia], difficolta: Media }
        successo:
          titolo: Le voci
          testo: |
            Le compri una caramella che non ti serve e la stai a sentire per
            un'ora, e te ne vai con un paio di nomi che valgono qualcosa.
          effetti: { informazioni.voce: 1 }
        fallimento:
          titolo: La menta
          testo: |
            La donna ti racconta per mezz'ora dei suoi nipoti, e alla fine ti
            regala una caramella per la pazienza.
          effetti: {}

  # ------------------------------------------------------------ grado I · la paga di Morlacchi
  - id: gilda-la-paga-di-morlacchi
    immagine: icone/hooded-figure
    titolo: La paga di Morlacchi
    sommario: "Il tuo padrino paga ogni mese in borse di velluto, e in cambio vuole un giro dei magazzini."
    luogo: I magazzini di scarico, il cortile
    area: quartieri-alti
    ripetibile: true
    requisiti: [fazione.gilda >= 3, gilda.padrino == 2]
    testo: |
      Nel cortile dei magazzini di scarico un garzone ti consegna la borsa
      di velluto del mese. Il consigliere Morlacchi, dice, gradirebbe un
      giro per i magazzini, a vedere se i conti tornano.

      {conoscenze-della-strada Media} Qui i conti li fa tornare chi li
      tiene. Il giro serve a far vedere ai magazzinieri che sei della casa.
    opzioni:
      - testo: "Fare il giro dei magazzini"
        descrizione: "Contare le casse e firmare dove ti dicono."
        prova: { attributo: mentale, abilita: [politica-ed-economia, percezione], difficolta: Media }
        successo:
          titolo: I conti che tornano
          testo: |
            Il caposquadra ti indica quali casse contare e quali lasciar stare, e
            i conti tornano. La borsa pesa un po' più del solito.
          pe: { politica-ed-economia: 2 }
          effetti: { monete: 5 }
        fallimento:
          titolo: La cassa sbagliata
          testo: |
            Conti una cassa che dovevi lasciar stare, e il caposquadra ti toglie
            il registro di mano con un sorriso. La borsa del mese è leggera.
          effetti: { monete: 2, sospetto: 1 }
      - testo: "Prendere la borsa e andartene"
        descrizione: "Il giro lo farà qualcun altro, ma la borsa è tua."
        esito:
          titolo: La borsa di velluto
          testo: |
            Prendi la borsa e te ne vai, e il garzone sale subito le scale
            dell'ufficio. Le monete sembrano meno del solito.
          effetti: { monete: 3 }

  # ------------------------------------------------------------ dal passo 4 · la carovana del mese
  - id: gilda-la-carovana-del-mese
    immagine: ambientazione/laresh
    titolo: La carovana del mese
    sommario: "Ogni mese la Gilda manda al bivio di Laresh una carovana di sale, e serve qualcuno che la porti."
    luogo: Superficie Fratturata, dove parte la pista di Laresh
    area: superficie-fratturata
    ripetibile: true
    requisiti: [fazione.gilda >= 4]
    testo: |
      I carri della carovana aspettano dove finisce la strada lastricata,
      coperti di tela cerata, con i cani da soma alle stanghe. A volte li
      guida Cahir, a volte uno stalliere di Laresh che non ti guarda
      nemmeno. La pista passa sotto le terrazze di basalto e lungo i campi a
      nord, dove le chiazze nere crescono un poco ogni mese.
    opzioni:
      - testo: "Fare da scorta armata"
        descrizione: "In testa alla carovana, con l'arma in mano e gli occhi sulle terrazze."
        costo: 2
        prova: { attributo: fisico, abilita: [armi-da-mischia, armi-da-distanza], difficolta: Media }
        successo:
          titolo: Le terrazze tranquille
          testo: |
            Sulle terrazze due figure si alzano contro il sole, vedono la tua arma
            e si rimettono giù. La Casa ti paga la quota della scorta.
          pe: { armi-da-mischia: 2 }
          effetti: { monete: 12 }
        fallimento:
          titolo: Il sasso
          testo: |
            Un sasso dalle terrazze ti prende alla spalla, e intanto qualcuno
            porta via un sacco dal carro di coda. La Casa ti paga lo stesso, meno
            il sacco.
          effetti: { monete: 4, ferite: 1 }
      - testo: "Guidare i cani"
        descrizione: "I cani da soma tirano meglio se chi li guida sa parlare a un cane."
        costo: 2
        prova: { attributo: sociale, abilita: addestrare-animali, difficolta: Media }
        successo:
          titolo: La muta
          testo: |
            Tieni il capobranco per il collare per tutta l'andata e arrivate al
            bivio mezza giornata prima. La Casa ti paga la quota.
          pe: { addestrare-animali: 2 }
          effetti: { monete: 10 }
        fallimento:
          titolo: Il cane che scappa
          testo: |
            Un cane si libera dei finimenti e lo ritrovi a sera seduto nel grano
            nero, con il muso verso nord. La Casa ti paga meno del solito.
          effetti: { monete: 4, tormento: 1 }
      - testo: "Guidare i cani con Cahir"
        descrizione: "Cahir non ha dimenticato il rapporto, e con te i suoi cani tirano volentieri."
        costo: 2
        requisiti: [gilda.cahir == 1]
        prova: { attributo: sociale, abilita: addestrare-animali, difficolta: Facile }
        successo:
          titolo: Cahir
          testo: |
            Cahir ti lascia la muta e ti parla della carovana che un giorno sarà
            sua, trenta cani per tre carri. Al bivio ti presenta a un mugnaio come
            un amico.
          pe: { addestrare-animali: 2 }
          effetti: { monete: 10, rep.gilda: 0.5 }
        fallimento:
          titolo: Il finimento
          testo: |
            Ti si impiglia un finimento e Cahir lo scioglie ridendo, ma arrivate
            in ritardo e la Casa ti paga un po' meno.
          effetti: { monete: 6 }
      - testo: "Tenere d'occhio i campi a nord"
        descrizione: "Alla Casa qualcuno vorrebbe sapere delle spighe nere e dei fuochi azzurri."
        costo: 2
        prova: { attributo: mentale, abilita: [natura, percezione], difficolta: Media }
        successo:
          titolo: Le chiazze nere
          testo: |
            Misuri a passi le chiazze nere e le segni su un foglio, più grandi del
            mese scorso. Lira lo archivia con un tassello e ti paga la quota.
          pe: { natura: 2 }
          effetti: { monete: 8, informazioni.pettegolezzo: 1 }
        fallimento:
          titolo: Il grano
          testo: |
            Guardi tanto i campi che inciampi in una crepa, e torni con la
            caviglia gonfia e la quota del mese.
          effetti: { monete: 4, ferite: 0.5 }

  # ------------------------------------------------------------ grado II · il riscontro
  - id: gilda-il-riscontro
    presso: gilda-casa-dei-nodi
    immagine: personaggi/lira-demos
    titolo: Il riscontro
    sommario: "All'archivio dei dazi c'è sempre un riscontro da fare, e Lira paga poco e insegna molto."
    luogo: Casa dei Nodi, l'archivio dei dazi
    area: quartieri-alti
    ripetibile: true
    requisiti: [fazione.gilda >= 6, gilda.via != 3]
    testo: |
      Lira ti aspetta al tavolo vicino alla finestra, con i registri del
      mese aperti, e ti indica la sedia che sta in piano solo grazie a un
      vecchio registro sotto una gamba.

      {politica-ed-economia Media} Ogni riscontro dice chi paga in ritardo.
      Sono i pettegolezzi più affidabili della città, e sono scritti in
      colonna.
    opzioni:
      - testo: "Fare il riscontro per la Rappresentante"
        descrizione: "Una copia va al Municipio, e Julia Castaldi apprezza i conti puliti."
        requisiti: [rep.castaldi < 6]
        prova: { attributo: mentale, abilita: [politica-ed-economia, percezione], difficolta: Media }
        successo:
          titolo: Una copia al Municipio
          testo: |
            Porti la copia del riscontro al Municipio, dove Julia Castaldi la
            legge in piedi e ti ringrazia con un cenno. Lira ti paga la giornata.
          pe: { politica-ed-economia: 2 }
          effetti: { monete: 4, informazioni.pettegolezzo: 1, rep.castaldi: 0.5 }
        fallimento:
          titolo: Le righe
          testo: |
            Perdi due righe e le ritrovi a sera, quando Lira ha già finito da
            sola. Ti paga lo stesso, e la copia la porta un garzone.
          effetti: { monete: 2 }
      - testo: "Fare il riscontro per la Casa"
        descrizione: "Il riscontro resta all'archivio, e la Casa apprezza chi tiene i conti in casa."
        requisiti: [rep.gilda < 9]
        prova: { attributo: mentale, abilita: [politica-ed-economia, percezione], difficolta: Media }
        successo:
          titolo: In casa
          testo: |
            Lira lega il riscontro con il nastro e lo archivia con un tassello
            nuovo, e alla Casa si sa che i tuoi conti tornano.
          pe: { politica-ed-economia: 2 }
          effetti: { monete: 4, informazioni.pettegolezzo: 1, rep.gilda: 0.5 }
        fallimento:
          titolo: Le righe
          testo: |
            Perdi due righe e le ritrovi a sera, quando Lira ha già finito da
            sola. Ti paga lo stesso, con un mezzo sospiro.
          effetti: { monete: 2 }
      - testo: "Guardare Lira lavorare"
        descrizione: "Lei lo fa meglio di te, e guardarla è una lezione lunga un giorno."
        costo: 2
        esito:
          titolo: La lezione
          testo: |
            Lira ogni tanto ti spiega una riga senza alzare gli occhi. A sera hai
            la testa piena di colonne, e lei ti paga come se avessi lavorato.
          pe: { politica-ed-economia: 3 }
          effetti: { monete: 3 }

  # ------------------------------------------------------------ grado III · il banco della Casa
  - id: gilda-il-banco-della-casa
    presso: gilda-casa-dei-nodi
    immagine: icone/stamper
    titolo: Il banco della Casa
    sommario: "Il portasigillo vende alla Casa con il timbro, al prezzo pieno."
    luogo: Casa dei Nodi, il banco del timbro
    area: quartieri-alti
    ripetibile: true
    requisiti: [fazione.gilda >= 9]
    testo: |
      Il banco del timbro adesso è tuo, o quasi. Lo tiene un impiegato
      giovane con i manicotti di tela di Elleri, che ti fa passare davanti
      alla fila dei mercanti chiamandoti portasigillo a voce alta. La Casa
      compra in regola quello che porti e lo paga al prezzo pieno, perché lo
      timbri tu.

      {politica-ed-economia Media} Al Mercato dei Nodi un cristallo senza
      timbro vale meno, perché il rischio resta al compratore. Qui il
      rischio se lo prende la Casa.
    opzioni:
      - testo: "Vendere un cristallo carico"
        descrizione: "Timbrato e registrato, al prezzo pieno."
        requisiti: [cristalli.cristallo-carico >= 1]
        costo: 0
        esito:
          titolo: Il timbro
          testo: |
            Timbri il cristallo con un colpo solo, e l'impiegato ti conta le
            monete sul banco.
          effetti: { cristalli.cristallo-carico: -1, monete: 32 }
      - testo: "Vendere un cristallo sterile"
        descrizione: "Per fare lume in cucina, timbrato come sterile."
        requisiti: [cristalli.cristallo-sterile >= 1]
        costo: 0
        esito:
          titolo: Sterile
          testo: |
            Lo timbri come sterile, e l'impiegato ci scrive la data con la sua
            grafia tonda.
          effetti: { cristalli.cristallo-sterile: -1, monete: 6 }
      - testo: "Vendere un frammento inciso"
        descrizione: "La Casa li compra per l'Accademia, che li paga di più."
        requisiti: [reliquie.frammento-inciso >= 1]
        costo: 0
        esito:
          titolo: Il frammento
          testo: |
            L'impiegato avvolge il frammento in un panno e lo mette nella cassetta
            per l'Accademia.
          effetti: { reliquie.frammento-inciso: -1, monete: 6 }
      - testo: "Vendere un segreto alla Casa"
        descrizione: "Al terzo piano qualcuno paga bene quello che sai, senza chiedere da dove viene."
        requisiti: [informazioni.segreto >= 1]
        costo: 0
        esito:
          titolo: Al terzo piano
          testo: |
            Scrivi quello che sai su un foglio sigillato con il tuo timbro, e
            l'impiegato lo porta su e torna con una borsa.
          effetti: { informazioni.segreto: -1, monete: 28 }

  # ------------------------------------------------------------ grado III · la lezione pagata dalla Gilda
  - id: gilda-la-lezione-pagata
    presso: accademia-di-torvessa
    immagine: personaggi/orvald-temmerin
    titolo: La lezione pagata dalla Gilda
    sommario: "La Gilda paga all'Accademia le lezioni dei portasigilli, perché un cristallo falso si riconosce meglio con il Mana."
    luogo: Accademia di Torvessa, il seminterrato
    area: quartieri-alti
    ripetibile: true
    requisiti: [fazione.gilda >= 9]
    testo: |
      Nel seminterrato dell'Accademia Orvald Temmerin tiene una cassetta di
      cristalli carichi mescolati a cristalli falsi, e la apre solo a chi
      paga la lezione. Per i portasigilli paga la Casa, con una ricevuta che
      Orvald legge due volte prima di metterla nel cassetto.

      {magia Media} La cassetta ronza in modo irregolare. Veri e falsi
      parlano insieme, e bisogna imparare a sentirli uno alla volta.
    opzioni:
      - testo: "Imparare Leggere il Mana"
        descrizione: "La lezione la paga la Gilda; servono Magia 2 e la cassetta di Orvald."
        immagine: personaggi/orvald-temmerin
        requisiti: [magia >= 2, incantesimo.leggere-il-mana == 0]
        costo: 2
        prova: { attributo: mentale, abilita: magia, difficolta: Media }
        successo:
          titolo: La cassetta
          testo: |
            Tocchi i cristalli a occhi chiusi finché non senti il battito lento di
            quelli veri e il silenzio dei falsi, e Orvald firma la ricevuta.
          effetti: { incantesimo.leggere-il-mana: 1 }
        fallimento:
          titolo: Non ancora
          testo: |
            I cristalli ti sembrano tutti uguali, e Orvald ti rimanda alla
            settimana prossima.
          effetti: {}
      - testo: "Imparare il Sigillo"
        descrizione: "Il consigliere del terzo piano ha diritto alla lezione più cara dell'Accademia; serve Magia 3."
        immagine: personaggi/orvald-temmerin
        requisiti: [fazione.gilda >= 15, magia >= 3, incantesimo.sigillo == 0]
        costo: 2
        prova: { attributo: mentale, abilita: magia, difficolta: Difficile }
        successo:
          titolo: Sigillato
          testo: |
            Orvald ti fa chiudere con il Mana una scatola di legno finché le mani
            non ti formicolano, e alla fine non si apre nemmeno con il coltello.
          effetti: { incantesimo.sigillo: 1 }
        fallimento:
          titolo: La scatola aperta
          testo: |
            La scatola si apre con un dito, ogni volta. Orvald ti ricorda con
            pazienza che il Sigillo vuole tre lezioni, e la Gilda le paga tutte.
          effetti: {}
      - testo: "Ascoltare la lezione dal fondo dell'aula"
        descrizione: "Senza toccare la cassetta, guardando gli altri, si impara qualcosa lo stesso."
        esito:
          titolo: Dal fondo
          testo: |
            Ascolti da una panca troppo bassa e guardi gli allievi toccare i
            cristalli. Qualcosa ti resta, nelle dita più che nella testa.
          pe: { magia: 2 }

  # ------------------------------------------------------------ grado IV · il pezzo di Irsa
  - id: gilda-il-pezzo-di-irsa
    presso: armeria-di-irsa
    immagine: personaggi/irsa-valbrun
    titolo: Il pezzo di Irsa
    sommario: "Ai membri eletti Irsa Valbrun fa un'arma su misura, ma prima ti guarda."
    luogo: Armeria di Irsa, dietro il banco
    area: citta-bassa
    requisiti: [fazione.gilda >= 12, oggetto.gilda-spada-del-membro-eletto == 0, oggetto.gilda-balestra-dei-ponti == 0]
    testo: |
      Irsa ti fa entrare dietro il banco, dove i pezzi grezzi di Bram
      Halgast pendono dai chiodi. Ti rigira le mani per guardarne i palmi, e
      poi ti chiede se preferisci arrivare addosso alle cose o tenerle
      lontane.

      {armi-da-mischia Media} La spada lunga sul chiodo più vicino è
      bilanciata sul forte, per chi para molto. Per te Irsa la sposterebbe
      sul debole.

      {origine rampollo-dei-quartieri-alti} Nei Quartieri Alti un'arma di
      Irsa si porta come un anello di famiglia. Tuo zio la mostrava a cena e
      non l'aveva mai sguainata.
    opzioni:
      - testo: "Chiederle una spada"
        descrizione: "Una spada lunga di Bram, bilanciata da Irsa sul tuo braccio."
        immagine: icone/broadsword
        esito:
          titolo: La spada del membro eletto
          testo: |
            Irsa lavora tre giorni una lama grezza, e ogni sera torni a
            impugnarla. Il quarto te la consegna con l'elsa fasciata del cuoio
            verde dei soci. «Arriva prima tu» dice, «e lei subito dopo.»
          effetti: { oggetto.gilda-spada-del-membro-eletto: 1 }
      - testo: "Chiederle una balestra"
        descrizione: "La balestra pesante dei Custodi, con il caricatore a leva, rifatta da Irsa."
        immagine: icone/crossbow
        esito:
          titolo: La balestra dei ponti
          testo: |
            Irsa smonta una balestra dei Custodi e ci lavora tre giorni, poi te la
            consegna con il caricatore a leva oliato. «Tira dritto anche con il
            vento della Cicatrice» dice.
          effetti: { oggetto.gilda-balestra-dei-ponti: 1 }

  # ------------------------------------------------------------ grado IV · la foresteria
  - id: gilda-la-foresteria
    presso: gilda-casa-dei-nodi
    immagine: fazioni/gilda-dei-mercanti
    titolo: La foresteria della Casa
    sommario: "Sotto il tetto della Casa dei Nodi i membri eletti venuti da fuori dormono senza pagare."
    luogo: Casa dei Nodi, la foresteria
    area: quartieri-alti
    ripetibile: true
    requisiti: [fazione.gilda >= 12]
    testo: |
      La foresteria è una fila di stanze strette sotto il tetto della Casa,
      con le finestre sulle catene dei ponti. Il vecchio custode ti porta la
      chiave e una brocca d'acqua calda senza che tu la chieda.

      {resistenza Facile} Il corpo riconosce il letto prima della testa, e
      ti chiede di sdraiarti adesso, vestito.
    opzioni:
      - testo: "Dormire alla foresteria"
        descrizione: "Una notte intera, a spese della Casa."
        esito:
          titolo: La lavanda
          testo: |
            Dormi fino a giorno fatto con le catene che cantano sotto la finestra,
            e al risveglio le ferite tirano meno.
          effetti: { ferite: -1, tormento: -0.5 }
      - testo: "Restare due notti"
        descrizione: "Due notti e un giorno senza uscire; il custode non fa domande."
        costo: 2
        esito:
          titolo: Due notti
          testo: |
            Resti due notti e un giorno fra il letto e la finestra, con i pasti
            portati dal custode, e quando scendi hai la testa sgombra.
          effetti: { ferite: -2, tormento: -1 }

  # ------------------------------------------------------------ grado V · la seduta del terzo piano
  - id: gilda-la-seduta-del-terzo-piano
    presso: gilda-casa-dei-nodi
    immagine: icone/gem-chain
    titolo: La seduta del terzo piano
    sommario: "Ogni mese il consiglio interno si riunisce a porte chiuse, e il consigliere ha la sua parte."
    luogo: Casa dei Nodi, la sala del terzo piano
    area: quartieri-alti
    ripetibile: true
    requisiti: [fazione.gilda >= 15, gilda.consigliere >= 1]
    testo: |
      La seduta comincia quando il Sovrintendente posa le mani sul tavolo
      ovale e le porte si chiudono con il chiavistello. Si parla di dazi e
      di soci da ammettere, e alla fine il tesoriere conta la parte di ogni
      consigliere davanti a tutti.

      {intimidire Media} Il consigliere alla tua destra ti guarda la catena
      d'argento ogni volta che parli, e sa che te ne accorgi.
    opzioni:
      - testo: "Sedere alla seduta e votare"
        descrizione: "Ascoltare, alzare la mano quando serve, ritirare la parte."
        esito:
          titolo: La parte del consigliere
          testo: |
            Ascolti fino in fondo e alzi la mano quando serve, poi raccogli nel
            palmo la parte che il tesoriere ti conta.
          pe: { politica-ed-economia: 2 }
          effetti: { monete: 8 }
      - testo: "Prendere la parola sui dazi delle botteghe"
        descrizione: "Le botteghe piccole pagano troppo, e al terzo piano qualcuno deve dirlo."
        prova: { attributo: sociale, abilita: [persuasione, politica-ed-economia], difficolta: Media }
        successo:
          titolo: La gabella abbassata
          testo: |
            Parli dei dazi con i conti in mano, e il consiglio vota di abbassarli
            di un soldo. Irsa, se è in sala, batte le nocche sul tavolo.
          pe: { persuasione: 2 }
          effetti: { monete: 8, rep.botteghe: 0.5 }
        fallimento:
          titolo: La proposta respinta
          testo: |
            La sala ha fretta di andare a cena, e la proposta cade con sei mani
            contro una.
          effetti: { monete: 8, scandalo: 1 }
      - testo: "Firmare lettere di presentazione"
        descrizione: "I soci nuovi hanno bisogno di una firma del terzo piano, e dopo ti devono qualcosa."
        prova: { attributo: sociale, abilita: galateo, difficolta: Facile }
        successo:
          titolo: Le firme
          testo: |
            Ogni socio nuovo ti stringe la mano e ti racconta qualcosa che non
            dovrebbe, e a sera hai qualche nome utile.
          effetti: { monete: 6, informazioni.pettegolezzo: 1 }
        fallimento:
          titolo: L'inchiostro
          testo: |
            Rovesci il calamaio su una lettera e riscrivi tutto da capo, sotto gli
            occhi lucidi del socio nuovo.
          effetti: { monete: 6 }
