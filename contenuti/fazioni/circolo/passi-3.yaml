# La quest del Circolo di Velthar, passi 11-15 (fazione.circolo 10 → 15). Tutti chiedono pista.capomozzo >= 7.
# 11 La tempesta dalla pianura: tre scene di fila (la linea delle piante, le bestie, gli orchi profughi di
#    Capomozzo all'alba). circolo.orchi: 1 accolti, 2 cacciati, 3 consegnati alla Caserma.
# 12 La spirale (grado 4): Padre Vantes viene al margine (circolo.promessa-velo), poi il rito di chi scende.
# 13 La fenditura: l'ingresso nella spedizione (spedizione-fenditura.yaml). Il Custode di linfa sta nel cuore,
#    che porta a 13 e apre subito `circolo-occhi-dorati`.
# 14 Occhi dorati (in spedizione-fenditura.yaml, perché sta nella cavità): quattro strade. Chi esce prima di
#    scegliere ci torna con `circolo-tornare-all-albero`, qui.
# 15 Il respiro lungo (grado 5): una scena per le strade 1-3 (circolo.albero <= 3), una per la strada 4.
#    Più una scena breve per chi ha portato i Raschiatori al margine e non ha dato loro il posto.
storylet:
  # ------------------------------------------------------------ 10 → 11 · la tempesta dalla pianura
  - id: circolo-la-tempesta-dalla-pianura
    presso: circolo-bosco-di-velthar
    immagine: ambientazione/marea-grigia
    titolo: La tempesta dalla pianura
    sommario: "Dalla pianura sale una tempesta di Marea che sembra una parete di latte."
    luogo: Il Bosco di Velthar, il margine sud
    area: superficie-fratturata
    requisiti: [fazione.circolo == 10, pista.capomozzo >= 7]
    testo: |
      La tempesta arriva al tramonto dalla pianura del sud. Da vicino è una parete lattiginosa alta quanto due
      alberi, che avanza al passo di un uomo senza che il vento la spinga. Al margine l'aria è ferma, e le
      foglie dei rami più alti non si muovono. Dove la parete passa l'erba diventa grigia, e sulla parete si
      muovono ombre che potrebbero essere animali. Gli uccelli del margine sono partiti tutti verso nord
      un'ora prima del tramonto, e da allora nel Bosco non canta niente.

      Al margine sud Tharn ha messo in fila gli Irriducibili, una trentina di druidi in ginocchio con le mani
      nella terra fra le radici. È la linea delle piante che il Circolo tiene da cento anni. Stasera il Bosco
      ha il respiro corto. Le cortecce si accendono a scatti come quelle del boschetto grigio, e ogni volta
      restano spente un poco più a lungo.

      {politica-ed-economia Facile} A un giorno di cammino Qir-Azel ha le porte aperte, e se il margine cede
      se ne accorgerà con la tempesta sui tetti.

      Tharn ti indica il posto vuoto fra un vecchio druido con la barba fino alla cintura e una ragazza che
      trema.
    opzioni:
      - testo: "Prendere posto nella linea delle piante"
        descrizione: "Le mani nella terra, fra le radici. Le piante bevono la Marea, e tu le aiuti a bere."
        prova: { attributo: mentale, abilita: natura, difficolta: Media }
        successo:
          titolo: Le mani nella terra
          testo: |
            Infili le mani nella terra fra le radici e senti la Marea arrivare dalle punte, fredda, che sale
            nel legno e si scioglie. La parete ti passa sopra come acqua sopra un sasso, e dentro c'è un odore
            di ferro bagnato. La linea regge. Accanto a te la ragazza smette di tremare.
          pe: { natura: 5 }
          segue: circolo-le-bestie-davanti-alla-tempesta
        fallimento:
          titolo: La radice sbagliata
          testo: |
            Infili le mani fra le radici sbagliate, quelle di un albero già pieno, e la Marea risale invece di
            scendere. Ti entra nelle dita e sale fino ai polsi, e sotto la pelle le vene si fanno grigie.
            Tieni lo stesso, perché la fila non si rompe.
          effetti: { contaminazione: 1 }
          segue: circolo-le-bestie-davanti-alla-tempesta
      - testo: "Bere la Marea di un druido caduto"
        descrizione: "Il vecchio con la barba è caduto in ginocchio, con la faccia grigia."
        incantesimo: bere-la-marea
        prova: { attributo: mentale, abilita: magia, difficolta: Media }
        successo:
          titolo: Il sorso del vecchio
          testo: |
            Gli posi le mani sul petto e tiri su la Marea come si tira l'acqua da un pozzo. Il vecchio
            riprende colore dalle labbra, e la tua bocca sa di ferro. Sotto le dita il suo cuore torna a un
            ritmo che si può contare. Si rimette in fila senza ringraziare, come si fa al Circolo.
          pe: { magia: 5 }
          effetti: { contaminazione: 1, rep.circolo: 0.5 }
          segue: circolo-le-bestie-davanti-alla-tempesta
        fallimento:
          titolo: Troppo
          testo: |
            Tiri troppo forte, e la Marea del vecchio ti entra tutta insieme. È così fredda che ti si serrano
            i denti. Lui si rialza, e sei tu a cadere in ginocchio con la faccia grigia, finché la ragazza non
            ti tira su per il colletto.
          effetti: { contaminazione: 1.5 }
          segue: circolo-le-bestie-davanti-alla-tempesta
      - testo: "Correre ad avvertire la città"
        descrizione: "La città avrà il tempo di chiudere le porte, e il margine avrà una persona in meno."
        prova: { attributo: fisico, abilita: [cavalcare, atletica], difficolta: Media }
        successo:
          titolo: La campana della porta nord
          testo: |
            Corri tutta la notte, e all'alba la campana della porta nord suona a martello. La Caserma chiude
            le porte, il Velo apre la Cattedrale a chi resta fuori, e Julia Castaldi manda i suoi a tappare i
            pozzi. Torni al Bosco a mezzogiorno sul cavallo di un altro e con le cosce scorticate dalla sella.
            Al margine mancano tre alberi che ieri c'erano.
          pe: { cavalcare: 5 }
          effetti: { rep.castaldi: 0.5, rep.velo: 0.5 }
          segue: circolo-le-bestie-davanti-alla-tempesta
        fallimento:
          titolo: Il cavallo azzoppato
          testo: |
            A metà strada il cavallo mette lo zoccolo in una buca, e tu finisci nel fosso. Arrivi alla porta
            nord a piedi, quando le sentinelle hanno già visto la parete da sole, e torni al Bosco zoppicando
            sotto la pioggia grigia. La pioggia ti lascia sulle maniche una patina che non viene via con le
            mani.
          effetti: { ferite: 1 }
          segue: circolo-le-bestie-davanti-alla-tempesta
      - testo: "Portare acqua alla linea"
        descrizione: "Chi non sa tenere le piante può portare l'acqua a chi le tiene. Avanti e indietro, tutta la notte, dentro la nebbia."
        costo: 2
        esito:
          titolo: Avanti e indietro
          testo: |
            Porti l'acqua dal ruscello alla linea con un secchio in ogni mano per tutta la notte, e a ogni
            viaggio la nebbia ti arriva più in alto. Verso mezzanotte l'acqua del ruscello ha un velo grigio
            in superficie, e la porti lo stesso. All'alba hai le braccia di legno e la gola grigia.
          effetti: { contaminazione: 1 }
          segue: circolo-le-bestie-davanti-alla-tempesta

  - id: circolo-le-bestie-davanti-alla-tempesta
    presso: circolo-bosco-di-velthar
    immagine: ambientazione/marea-grigia
    titolo: Le bestie davanti alla tempesta
    sommario: "La tempesta spinge davanti a sé tutto quello che corre, e quello che corre ha perso la testa."
    luogo: Il Bosco di Velthar, il margine sud, nella notte
    area: superficie-fratturata
    tipo: seguito
    requisiti: [fazione.circolo == 10]
    testo: |
      A mezzanotte dalla parete escono le bestie. Volpi e cani di fattoria corrono davanti alla tempesta con
      gli occhi bianchi, dritti contro la linea delle piante, e in mezzo c'è una capra. Nessuna abbaia, e si
      sente solo il rumore delle zampe sull'erba secca. Due hanno il pelo grigio e le zampe piegate dalla
      parte sbagliata, e corrono lo stesso veloci come le altre. Un druido si alza dalla fila, e una volpe gli
      salta alla gola.

      Tharn grida e i lupi del branco si buttano sulle bestie, ma accanto a te la linea comincia ad aprirsi.

      {addestrare-animali Media} Corrono e mordono per paura, e una voce ferma ne può fermare qualcuna. Hanno
      le orecchie schiacciate indietro e la coda fra le zampe, e nessuna si volta a guardare la parete.

      {rissa Facile} Le due che ti vengono addosso hanno le zampe storte e cadranno al primo colpo dato bene.
    opzioni:
      - testo: "Fermare le bestie"
        descrizione: "Due bestie impazzite, svelte, che mordono quello che trovano. La linea dietro di te non si deve aprire."
        combattimento: circolo-bestie-della-tempesta
        vittoria:
          titolo: La linea chiusa
          testo: |
            Le due bestie cadono una sull'altra ai tuoi piedi, e il buco nella linea si chiude dietro di te.
            Da vicino le zampe storte non hanno ossa rotte, e la piega all'indietro è liscia sotto il pelo. Il
            druido con la gola morsa si rialza con la mano sul collo, e torna in fila.
          pe: { rissa: 5 }
          segue: circolo-gli-orchi-al-margine
        sconfitta:
          titolo: I morsi
          testo: |
            Le bestie ti travolgono, e la linea si apre per un tratto. Tharn la richiude con i lupi mentre tu
            ti trascini indietro con le braccia morse. I morsi sanguinano poco, e intorno ai buchi la pelle è
            già grigia. Al mattino ti fasciano con le foglie.
          effetti: { contaminazione: 1 }
          segue: circolo-gli-orchi-al-margine
      - testo: "Reggere la notte sulla linea"
        descrizione: "Restare con le mani nella terra mentre le bestie passano, senza muoverti. Fino all'alba."
        prova: { attributo: fisico, abilita: resistenza, difficolta: Difficile }
        successo:
          titolo: Fino all'alba
          testo: |
            Resti in ginocchio con le mani nella terra. Le bestie ti passano accanto e sopra senza toccarti,
            come l'acqua intorno a un palo, e senti il loro pelo bagnato sfiorarti la nuca. All'alba non senti
            più le ginocchia. Nel tuo tratto la linea ha retto.
          pe: { resistenza: 10 }
          segue: circolo-gli-orchi-al-margine
        fallimento:
          titolo: Le ginocchia
          testo: |
            Verso le quattro le ginocchia ti cedono, e cadi su un fianco dentro la nebbia. Una capra ti passa
            sopra e ti pianta uno zoccolo nella schiena. La ragazza della fila ti rimette le mani nella terra
            e te le tiene ferme lei fino all'alba.
          effetti: { contaminazione: 1, ferite: 1 }
          segue: circolo-gli-orchi-al-margine
      - testo: "Fermarle con Richiamo"
        descrizione: "Sono bestie con la paura addosso. La lingua del Circolo arriva anche a loro, se è detta forte."
        incantesimo: richiamo
        prova: { attributo: mentale, abilita: magia, difficolta: Media }
        successo:
          titolo: La voce ferma
          testo: |
            Dici il Richiamo a voce alta in mezzo al vento, e le bestie più vicine si fermano di colpo con gli
            occhi ancora bianchi. Per tre battiti di cuore restano ferme con le orecchie dritte verso di te.
            Le giri verso il fianco del Bosco, dove la linea è più spessa, e corrono lì.
          pe: { addestrare-animali: 5 }
          segue: circolo-gli-orchi-al-margine
        fallimento:
          titolo: Il vento
          testo: |
            Il vento si porta via il Richiamo a metà, e le bestie ti passano addosso. Ti rialzi con un morso
            al polpaccio e la bocca piena di una nebbia che ha il gusto dell'erba marcia.
          effetti: { contaminazione: 1, ferite: 0.5 }
          segue: circolo-gli-orchi-al-margine

  - id: circolo-gli-orchi-al-margine
    presso: circolo-bosco-di-velthar
    immagine: bestiario/orco
    titolo: Gli orchi al margine
    sommario: "All'alba la tempesta si ferma. Davanti al margine, fra le bestie morte, c'è un gruppo di orchi di Capomozzo senza armi."
    luogo: Il Bosco di Velthar, il margine sud, all'alba
    area: superficie-fratturata
    tipo: seguito
    requisiti: [fazione.circolo == 10]
    testo: |
      All'alba la parete si ferma a cento passi dal margine e si affloscia in una nebbia bassa che il sole
      comincia a bucare. Un terzo degli alberi del margine è grigio fino alle cime. Sull'erba davanti alla
      linea la nebbia lascia una polvere grigia che la rugiada non scioglie.

      Fra le bestie morte davanti alla linea c'è una ventina di orchi senza armi, con gli occhi gonfi nelle
      facce grigie. Vengono da Capomozzo, dove il forte è caduto, e la tempesta li ha spinti fin qui come le
      volpi. Una vecchia con i capelli intrecciati di ossa si inginocchia davanti a Tharn.

      «La legge del Bosco protegge chi non porta lame contro gli alberi» ti dice Tharn piano. «Loro non ne
      portano. In città diranno che abbiamo fatto entrare gli orchi.»

      {origine fuggiasco-di-ghoran} A Ghoran hai visto gli orchi profughi in fila davanti alla bilancia, con
      gli stessi occhi.

      {empatia Facile} La vecchia non chiede niente per sé, e tiene la mano sulla spalla di un ragazzo con la
      febbre. Stringe così forte che ha le nocche bianche.
    opzioni:
      - testo: "Lasciarli entrare nel Bosco"
        descrizione: "La legge del Bosco è chiara. Dolovan Stroud, in città, lo verrà a sapere."
        esito:
          titolo: La legge del Bosco
          testo: |
            Fai segno a Tharn di sì, e lui si scansa. Gli orchi entrano piano nel Bosco in fila, mentre i lupi
            li annusano uno per uno. Il ragazzo con la febbre passa per ultimo, appoggiato alla vecchia. Due
            giorni dopo arriva al Circolo una lettera di Julia Castaldi, con il sigillo della Casata e una
            manciata di monete per chi ha tenuto il margine. In fondo c'è scritto, di suo pugno, che in città
            si parla di orchi nel Bosco.
          pe: { resistenza: 10 }
          effetti: { fazione.circolo: 1, rep.circolo: 1.5, racconto: 1, monete: 15 }
          imposta: { circolo.orchi: 1 }
      - testo: "Mandarli via"
        descrizione: "Il Bosco ha già il respiro corto, e un orco in più è una bocca in più. Bisogna farglielo capire senza toccarli."
        prova: { attributo: sociale, abilita: [intimidire, persuasione], difficolta: Media }
        successo:
          titolo: La pianura
          testo: |
            Ti metti davanti a Tharn e dici alla vecchia che il Bosco non ha posto. Lei ti guarda a lungo
            prima di rialzarsi, e le ossa nei capelli battono piano fra loro. Porta i suoi verso est, nella
            nebbia che si dirada. Tharn non ti parla fino a sera. Due giorni dopo arriva al Circolo una
            lettera di Julia Castaldi, con una manciata di monete per chi ha tenuto il margine.
          pe: { intimidire: 10 }
          effetti: { fazione.circolo: 1, rep.circolo: 1, racconto: 1, monete: 15 }
          imposta: { circolo.orchi: 2 }
        fallimento:
          titolo: Il ragazzo con la febbre
          testo: |
            Alzi la voce, e il ragazzo con la febbre scoppia a piangere. Gli orchi se ne vanno lo stesso verso
            est, ma la vecchia prima ti sputa ai piedi, e mezzo Circolo l'ha visto. Due giorni dopo arriva una
            lettera di Julia Castaldi, con una manciata di monete per chi ha tenuto il margine.
          effetti: { fazione.circolo: 1, rep.circolo: 0.5, racconto: 1, monete: 15, tormento: 1 }
          imposta: { circolo.orchi: 2 }
      - testo: "Consegnarli alla Caserma"
        descrizione: "Profughi di Capomozzo, a un giorno dalla città. La Caserma vorrà sapere chi sono, e li terrà dove li può contare."
        esito:
          titolo: La scorta
          testo: |
            Mandi un ragazzo del Circolo alla porta nord, e a mezzogiorno arriva una scorta della Caserma con
            due carri. Gli orchi ci salgono senza opporsi, e la vecchia non ti guarda. Tharn nemmeno. Sulle
            sponde dei carri ci sono gli anelli di ferro per le catene, e nessuno li usa. Due giorni dopo
            arriva al Circolo una lettera di Julia Castaldi, con una manciata di monete per chi ha tenuto il
            margine, e un biglietto della Caserma che ringrazia.
          pe: { resistenza: 10 }
          effetti: { fazione.circolo: 1, rep.circolo: 1, rep.caserma: 0.5, racconto: 1, monete: 15 }
          imposta: { circolo.orchi: 3 }
      - testo: "Parlare alla vecchia nella lingua dei recinti"
        descrizione: "A Ghoran si impara qualche parola d'orchesco, quella che serve nei recinti. Basta per dirle che qui la bilancia non c'è."
        quando: [origine.fuggiasco-di-ghoran >= 1]
        esito:
          titolo: Nessuna bilancia
          testo: |
            Le dici le poche parole d'orchesco che hai imparato nei recinti, e la vecchia alza la testa di
            scatto. Le dici che qui la bilancia non c'è. Lei te lo fa ripetere, e la seconda volta chiude gli
            occhi. Gli orchi entrano nel Bosco in fila, e i lupi li annusano uno per uno. Due giorni dopo
            arriva una lettera di Julia Castaldi, con una manciata di monete per chi ha tenuto il margine.
          pe: { empatia: 10 }
          effetti: { fazione.circolo: 1, rep.circolo: 1.5, racconto: 1, monete: 15 }
          imposta: { circolo.orchi: 1 }

  # ------------------------------------------------------------ 11 → 12 · la spirale (grado 4)
  - id: circolo-padre-vantes-al-margine
    presso: circolo-bosco-di-velthar
    immagine: personaggi/padre-vantes
    titolo: Padre Vantes al margine
    sommario: "Il Velo è venuto fino al margine del Bosco. Padre Aurelio Vantes vuole sapere che cosa c'è sotto la fenditura, e vuole saperlo per primo."
    luogo: Il Bosco di Velthar, il margine
    area: superficie-fratturata
    requisiti: [fazione.circolo == 11, pista.capomozzo >= 7]
    testo: |
      Al margine, seduto sul tronco con le tre tacche, c'è Padre Aurelio Vantes. Ha la veste rossa infangata
      fino al ginocchio e un bastone da pellegrino che non usa, con il puntale di ferro ancora lucido. Due
      guardie del Velo lo aspettano a venti passi.

      Ti posa due dita sul polso, come fa con tutti in Cattedrale. Le dita sono asciutte e fredde, e le tiene
      lì il tempo di qualche battito.

      «Dopo Capomozzo la Madre ha detto che le rovine si sono ricordate i loro nomi» dice. «Al margine si dice
      che qui sotto se n'è ricordata una che respira. Se sotto il Bosco c'è una radice del Grande Albero la
      Confraternita vuole saperlo per prima, figliol{o|a}, per pregare nel posto giusto. Prenderla no, te lo
      prometto.»

      {politica-ed-economia Media} Una radice del Grande Albero sotto il Bosco del Circolo chiuderebbe
      cent'anni di dottrina, e chi perde la disputa la perde per sempre.

      {origine accolito-del-velo} Quelle due dita te le ha posate sul polso cento volte, per sentire se il
      cuore ti batteva in fretta.
    opzioni:
      - testo: "Promettergli un campione della linfa"
        descrizione: "Una fiala dalla fenditura, da portare in Cattedrale. Il Velo sarà riconoscente, e il Circolo non lo saprà finché non glielo dirai."
        esito:
          titolo: La promessa
          testo: |
            Gli prometti una fiala della linfa che troverai sotto, se la trovi. Vantes ti stringe il polso con
            le due dita e ti benedice a voce bassa, per non farsi sentire dai lupi. Riparte con le guardie
            verso la città, e adesso il bastone da pellegrino lo usa.
          effetti: { rep.velo: 1 }
          imposta: { circolo.promessa-velo: 1 }
          segue: circolo-la-spirale-di-chi-scende
      - testo: "Dirgli di no con garbo"
        descrizione: "Il Velo e il Circolo si rispettano da cent'anni. Un no detto bene lascia le cose come stanno."
        prova: { attributo: sociale, abilita: [galateo, persuasione], difficolta: Media }
        successo:
          titolo: Il no ben detto
          testo: |
            Gli dici che sotto la fenditura scendi per il Bosco, e che quello che trovi lo porterai prima al
            Maestro, come è giusto. Vantes ti ascolta con un sospiro e ti benedice lo stesso. Riparte con le
            guardie senza rancore, e prima di andare ti chiede di pregare per lui, se laggiù ti ricordi.
          pe: { galateo: 5 }
          segue: circolo-la-spirale-di-chi-scende
        fallimento:
          titolo: Il no storto
          testo: |
            Il no ti esce più duro di come volevi, con il Circolo nominato due volte e il Velo nessuna. Vantes
            ritira le dita dal tuo polso. Si rimette in cammino senza benedirti, e le due guardie gli si
            chiudono dietro.
          effetti: { rep.velo: -0.5, scandalo: 0.5 }
          segue: circolo-la-spirale-di-chi-scende
      - testo: "Dirgli di no e basta"
        descrizione: "Il Bosco è del Circolo. Il Velo ha già la sua Cattedrale."
        esito:
          titolo: Il no
          testo: |
            Gli dici di no, e basta. Vantes ti guarda come si guarda un figlio cresciuto storto, con più pena
            che rabbia, e se ne va con le guardie. I lupi di Tharn lo seguono con gli occhi finché non
            sparisce dietro la collina.
          effetti: { rep.velo: -0.5 }
          segue: circolo-la-spirale-di-chi-scende
      - testo: "Rispondergli con le parole del Velo"
        descrizione: "Il Velo ha una formula per chi scende nelle profondità e chiede di tornare. Vantes la riconoscerà, e capirà la risposta."
        quando: [origine.accolito-del-velo >= 1]
        esito:
          titolo: La formula di chi scende
          testo: |
            Gli dici la formula di chi scende, quella che i novizi imparano per i Raschiatori, e alla fine
            aggiungi che quello che troverai lo porterai al Maestro. Vantes chiude gli occhi e la finisce con
            te, parola per parola. Poi ti benedice e riparte senza insistere, con l'aria di uno che ha avuto
            la risposta che si aspettava.
          pe: { galateo: 5 }
          segue: circolo-la-spirale-di-chi-scende

  - id: circolo-la-spirale-di-chi-scende
    presso: circolo-bosco-di-velthar
    immagine: fazioni/circolo-di-velthar
    titolo: La spirale di chi scende
    sommario: "Il rito di chi scende nella fenditura. Ognuno del Circolo Ristretto ti dà qualcosa, e il Maestro resta sopra."
    luogo: Il Bosco di Velthar, il Circolo del Respiro, di notte
    area: superficie-fratturata
    tipo: seguito
    requisiti: [fazione.circolo == 11]
    testo: |
      Il rito di chi scende si fa di notte sulla spirale, con i druidi seduti dall'alto in basso e la
      fenditura che soffia vapore azzurro. A ogni sbuffo le facce sulle pietre più basse diventano azzurre. Tu
      stai in piedi sul bordo, e il calore ti sale lungo le gambe.

      Tharn ti lega al polso una ciocca di pelo grigio del branco intrecciata con un filo rosso, e il pelo
      odora ancora di lupo. Serha ti chiude nella mano un seme scuro grande come una noce. Voren resta dietro
      le pietre e ti fa un gesto con la mano aperta verso il basso, che vuol dire giù. Della sua faccia sotto
      il cappuccio non vedi niente.

      Aelion resta seduto e ti dice che il Maestro resta sopra, perché qualcuno deve ricordarsi di tirare la
      corda.

      {natura Media} Il seme è di una quercia che non hai mai visto. Pesa come un sasso e scalda il palmo, e
      il guscio non ha una sola venatura.
    opzioni:
      - testo: "Ringraziare ognuno con lo sguardo"
        descrizione: "Al Circolo non si ringrazia a parole. Si guarda chi ti ha dato qualcosa, finché non abbassa gli occhi lui."
        esito:
          titolo: Custode del Margine
          testo: |
            Guardi Tharn e Serha uno dopo l'altra, e infine il buio dove sta Voren, e ognuno abbassa gli occhi
            per primo. Aelion ti dice che da stanotte sei Custode del Margine. Serha ti mette sulle spalle un
            mantello di cuoio cucito su uno strato di muschio vivo, che beve la Marea al posto tuo. Il muschio
            è umido e fresco contro la nuca. Serha ti dice che c'è una branda per te nella spirale, accanto
            alla sua, quando torni.
          pe: { empatia: 10 }
          effetti: { fazione.circolo: 1, oggetto.circolo-mantello-di-muschio: 1 }
          almeno: { rep.circolo: 8 }
      - testo: "Mettere il seme nella terra della spirale"
        descrizione: "Un seme di quercia si pianta. Serha te l'ha messo in mano senza dirlo, e forse lo aspetta."
        esito:
          titolo: Il seme
          testo: |
            Ti inginocchi e premi il seme nella terra fra due pietre della spirale, dove la terra è calda e
            secca. Serha sorride, la prima volta che la vedi farlo. Te lo fa riprendere subito, perché il seme
            serve sotto. Aelion ti dice che da stanotte sei Custode del Margine. Serha ti mette sulle spalle
            un mantello di cuoio cucito sul muschio vivo, che beve la Marea al posto tuo, e ti dice che c'è
            una branda per te nella spirale, quando torni.
          pe: { natura: 10 }
          effetti: { fazione.circolo: 1, oggetto.circolo-mantello-di-muschio: 1 }
          almeno: { rep.circolo: 8 }
      - testo: "Rispondere al gesto di Voren"
        descrizione: "La mano aperta verso il basso. Un Silente si risponde in silenzio, e tenendo la sua pressione nella testa."
        esito:
          titolo: Giù
          testo: |
            Apri la mano verso il basso come lui, e la pressione di Voren ti entra dietro gli occhi e ci resta
            calda per tutto il resto del rito. Aelion ti dice che da stanotte sei Custode del Margine. Serha
            ti mette sulle spalle un mantello di cuoio cucito sul muschio vivo, che beve la Marea al posto
            tuo, e ti dice che c'è una branda per te nella spirale, quando torni.
          pe: { resilienza: 10 }
          effetti: { fazione.circolo: 1, oggetto.circolo-mantello-di-muschio: 1, tormento: 1 }
          almeno: { rep.circolo: 8 }

  # ------------------------------------------------------------ 12 → 13 · la discesa nella fenditura
  - id: circolo-la-discesa
    presso: circolo-bosco-di-velthar
    immagine: fazioni/circolo-di-velthar
    titolo: La discesa
    sommario: "La corda è legata alla pietra più bassa della spirale. Sotto, la fenditura soffia calore, e nessuno sa quanto sia profonda."
    luogo: Il Bosco di Velthar, il bordo della fenditura
    area: superficie-fratturata
    requisiti: [fazione.circolo == 12, pista.capomozzo >= 7]
    testo: |
      Legano la corda alla pietra più bassa della spirale con un nodo che Tharn fa e Serha controlla due
      volte. Butti la matassa nella fenditura, e la corda si srotola a lungo nel buio finché si ferma tesa.
      Laggiù il capo non fa nessun rumore. Dal buco sale un calore secco che fa lacrimare gli occhi, e la
      pietra del bordo è tiepida sotto le ginocchia.

      La lupa vecchia di Tharn ti annusa le mani e si siede sul bordo, con il muso verso il buio e le orecchie
      dritte. Tharn dice che se vuole venire viene, fin dove regge il caldo. I druidi ti guardano in silenzio,
      e Aelion tiene una mano sulla corda all'altezza del nodo.

      {atletica Media} Le braccia reggeranno duecento passi di corda nel buio, e senza guanti i palmi no.
    opzioni:
      - testo: "Scendere con la corda"
        descrizione: "Duecento passi di corda nel buio caldo, fino alla gola. Poi si cammina."
        requisiti: [chiave.fenditura >= 1]
        esito:
          titolo: Giù
          testo: |
            Ti infili i guanti di Tharn e ti cali nel buio, una mano sotto l'altra. Dopo venti passi la
            spirale è un cerchio di luce sopra la testa, e dopo cinquanta non c'è più. L'aria diventa calda
            come in una cucina, poi come in una fucina. Il cuoio dei guanti si indurisce e scricchiola a ogni
            presa. Alla fine i piedi toccano la roccia.
          vai: circolo-fenditura
      - testo: "Scendere con la lupa in braccio per il primo tratto"
        descrizione: "Al primo pianerottolo la lupa ti può seguire. Più giù no."
        requisiti: [chiave.fenditura >= 1, chiave.branco >= 1]
        costo: 0
        esito:
          titolo: Il branco fino al caldo
          testo: |
            Scendi con il tuo animale stretto contro il petto fino al primo pianerottolo di roccia, e lì lo
            lasci. Ha il pelo umido di vapore e il cuore che batte forte contro il tuo. Ti segue con gli occhi
            fino a dove arriva la luce, e quando non lo vedi più lo senti ancora, un guaito sottile sopra la
            testa, che non se ne va.
          vai: circolo-fenditura

  # ------------------------------------------------------------ 13 → 14 · tornare all'Albero, se si è usciti prima di scegliere
  - id: circolo-tornare-all-albero
    presso: circolo-bosco-di-velthar
    immagine: fazioni/circolo-di-velthar
    titolo: Tornare all'Albero
    sommario: "Il Custode di linfa non c'è più, e la strada fino all'Albero è libera. Laggiù c'è ancora da decidere."
    luogo: Il Bosco di Velthar, il bordo della fenditura
    area: superficie-fratturata
    requisiti: [fazione.circolo == 13]
    testo: |
      Sulla spirale ti guardano tutti quando passi, e nessuno ti chiede niente. La corda è ancora legata alla
      pietra più bassa, e dalla fenditura sale a sbuffi lenti un vapore azzurro mai visto così denso. Intorno
      al nodo il muschio è cresciuto fino a coprire la corda per un palmo.

      Aelion è seduto accanto al nodo della corda con gli occhi chiusi, e li apre quando arrivi. Il Custode di
      linfa è caduto e la strada fino all'Albero è libera, ma laggiù c'è ancora da scegliere che cosa farne.

      {resilienza Media} Da quando sei risalit{o|a} sogni ogni notte due occhi dorati che ti guardano e basta,
      e la mattina ti svegli riposat{o|a} come dopo un sonno senza sogni.
    opzioni:
      - testo: "Ridiscendere fino all'Albero"
        descrizione: "La strada la conosci, dal caldo della gola alla città sepolta, fino alla cavità."
        costo: 2
        esito:
          titolo: Di nuovo giù
          testo: |
            Ti cali di nuovo nel buio, e la strada fino all'Albero la fai senza fermarti, con il caldo che
            sale e le radici di metallo che ti sfiorano le spalle. Nella città sepolta le case piene di terra
            sono come le hai lasciate. In fondo alla cavità l'Albero ti aspetta, e la roccia sotto di lui è
            ferma.
          segue: circolo-occhi-dorati

  # ------------------------------------------------------------ 14 → 15 · il respiro lungo (grado 5)
  - id: circolo-il-respiro-lungo
    presso: circolo-bosco-di-velthar
    immagine: fazioni/circolo-di-velthar
    titolo: Il respiro lungo
    sommario: "Sulla spirale c'è un posto per te, e il Maestro ti lascia una domanda."
    luogo: Il Bosco di Velthar, il Circolo del Respiro
    area: superficie-fratturata
    requisiti: [fazione.circolo == 14, circolo.albero >= 1, circolo.albero <= 3, pista.capomozzo >= 7]
    testo: |
      In dieci giorni il grigio si ritira. Le cime tornano verdi una mattina tutte insieme e il verde scende
      fino alle radici, finché nel boschetto del sud resta solo la corteccia segnata come dopo una malattia. I
      lupi di Tharn tornano a dormire a sud, e le cortecce si accendono di nuovo piano.

      Il Circolo Ristretto si riunisce sulla spirale. Aelion ti indica la quarta pietra senza alzarsi, e ti
      siedi. La pietra ha al centro un incavo liscio consumato da chi ci sedeva prima, ed è tiepida di vapore.
      Tharn ride sotto la barba e Serha ti guarda come una tavola appena incisa. Il posto di Voren è vuoto
      come sempre.

      «La notte dei Sussurri ero qui» dice Aelion guardando il vapore. «Le voci salivano dal suolo in città, e
      salivano anche qui. Il Bosco rispose.» Lascia passare tre sbuffi. «Che cosa rispose non lo dico.
      Stanotte però puoi farmi una sola domanda.»

      {origine figlio-del-circolo} Quando eri bambin{o|a} la quarta pietra era vuota, e adesso capisci che
      aspettava qualcuno che sarebbe arrivato dopo.
    opzioni:
      - testo: "Chiedere dei Silenti"
        descrizione: "Dove vanno i Silenti quando si fondono con il Bosco, e che cosa trovano là."
        esito:
          titolo: Dove vanno i Silenti
          testo: |
            Aelion ti risponde con un'immagine, la sola che ti darà stanotte. Un fiume che entra in un lago, e
            il lago che entra in un pozzo, e il pozzo che non ha fondo. Poi ti mette in mano una ghianda
            tiepida di metallo vivo che è caduta dall'Albero, e anche un ramo dritto come un'asta con la punta
            fatta lama da sola. La città, ti dice, ha mandato la sua parte per il margine tenuto, e la borsa è
            tua. Da stanotte sei la quarta voce del Circolo Ristretto, e al margine ti chiameranno Respiro di
            Velthar.
          pe: { resilienza: 20 }
          effetti: { fazione.circolo: 1, oggetto.circolo-ramo-di-metallo-vivo: 1, oggetto.circolo-ghianda-di-metallo-vivo: 1, monete: 350, informazioni.segreto: 1 }
          almeno: { rep.circolo: 10 }
          imposta: { circolo.respiro: 1 }
      - testo: "Chiedere della bambina del branco"
        descrizione: "Quella che dormì tre notti accanto all'Albero quando era acceso. Dov'è adesso, e che cosa le ha lasciato."
        esito:
          titolo: La bambina del branco
          testo: |
            Aelion tace così a lungo che pensi di aver sbagliato domanda. Poi ti dice che la bambina è
            cresciuta ed è andata in città. Chi dorme tre notti accanto a un albero acceso ne porta i segni
            per sempre, ti dice, come te adesso. Ti mette in mano una ghianda tiepida di metallo vivo, e anche
            un ramo dritto come un'asta con la punta fatta lama da sola. La città ha mandato la sua parte per
            il margine tenuto, e la borsa è tua. Da stanotte sei la quarta voce del Circolo Ristretto, e al
            margine ti chiameranno Respiro di Velthar.
          pe: { addestrare-animali: 20 }
          effetti: { fazione.circolo: 1, oggetto.circolo-ramo-di-metallo-vivo: 1, oggetto.circolo-ghianda-di-metallo-vivo: 1, monete: 350, informazioni.segreto: 1 }
          almeno: { rep.circolo: 10 }
          imposta: { circolo.respiro: 1 }
      - testo: "Chiedere di Selara Vyn"
        descrizione: "La guaritrice del Circolo che scese nel Rito e tornò con un bracciale di corteccia pietrificata. Il Velo la chiama santa."
        esito:
          titolo: Selara
          testo: |
            Ti dice che Selara era la migliore di loro, che scese perché qualcuno doveva farlo e che il
            bracciale non se l'è mai tolto, perché non era un bracciale. Poi resta zitto a lungo, e alla fine
            ti mette in mano una ghianda di metallo vivo e un ramo dritto come un'asta, con la punta fatta
            lama da sola. La città ha mandato la sua parte per il margine tenuto, e la borsa è tua. Da
            stanotte sei la quarta voce del Circolo Ristretto, e al margine ti chiameranno Respiro di Velthar.
          pe: { magia: 20 }
          effetti: { fazione.circolo: 1, oggetto.circolo-ramo-di-metallo-vivo: 1, oggetto.circolo-ghianda-di-metallo-vivo: 1, monete: 350, informazioni.segreto: 1 }
          almeno: { rep.circolo: 10 }
          imposta: { circolo.respiro: 1 }

  - id: circolo-il-posto-sulla-spirale
    presso: circolo-bosco-di-velthar
    immagine: fazioni/circolo-di-velthar
    titolo: Il posto sulla spirale
    sommario: "Il Bosco è salvo a metà, da altri. Sulla spirale c'è ancora un posto per te, e nessuno te lo offre volentieri."
    luogo: Il Bosco di Velthar, il Circolo del Respiro
    area: superficie-fratturata
    requisiti: [fazione.circolo == 14, circolo.albero == 4, pista.capomozzo >= 7]
    testo: |
      Da quando sotto la fenditura lavorano altri, il grigio si ritira dal Bosco in un mese. Ogni mattina al
      margine passa un carro, e ogni sera ne torna uno più pesante. Nel fango del sentiero le ruote hanno
      scavato due solchi che si fanno più profondi ogni giorno. I lupi di Tharn tornano a sud, ma sulla
      spirale i druidi parlano meno e quando passi si guardano le mani.

      Il Circolo Ristretto si riunisce lo stesso. Aelion ti indica la quarta pietra senza guardarti. Tharn
      tiene gli occhi sui lupi, e la pietra di Serha resta vuota.

      «Il Bosco è guarito perché altri scavano sotto la fenditura e si pagano con quello che c'era laggiù»
      dice Aelion. «L'hai deciso tu, e il margine è salvo. Sulla spirale si ricorderanno tutte e due le cose.»
      «Il posto è tuo, ma il margine non ti chiamerà Respiro di Velthar.»

      {politica-ed-economia Facile} Il carro della mattina porta il sigillo di chi hai scelto, e quello della
      sera porta il Mana.
    opzioni:
      - testo: "Sederti sulla quarta pietra"
        descrizione: "Il posto è tuo, e lo prendi. Il resto verrà, o non verrà."
        esito:
          titolo: La quarta pietra
          testo: |
            Ti siedi sulla quarta pietra, e la pietra è fredda. Aelion ti mette in mano il ramo che hai
            tagliato tu dall'Albero e tenuto per te, dritto come un'asta con la punta fatta lama, e ti dice
            che il Circolo non vuole niente che sia venuto da sotto. Della parte che la città ha mandato per
            il margine tenuto ti dà quello che ti spetta. Da stanotte sei la quarta voce del Circolo
            Ristretto, e i druidi non ti chiamano in nessun modo.
          pe: { natura: 20 }
          effetti: { fazione.circolo: 1, oggetto.circolo-ramo-di-metallo-vivo: 1, monete: 150 }
          almeno: { rep.circolo: 8 }
      - testo: "Chiedere perdono al Circolo Ristretto"
        descrizione: "Un perdono al Circolo si chiede in silenzio, e si ottiene se qualcuno ti guarda per primo. Serve un'anima ferma."
        prova: { attributo: sociale, abilita: [empatia, espressivita], difficolta: Difficile }
        successo:
          titolo: Tharn guarda per primo
          testo: |
            Resti in piedi davanti alla quarta pietra senza dire niente, con le mani aperte, finché qualcuno
            non alza gli occhi. È Tharn, e quando ti guarda i lupi si alzano. Aelion ti mette in mano il ramo
            che hai tagliato dall'Albero, dritto come un'asta con la punta fatta lama, e ti dà la tua parte
            del denaro mandato dalla città. Da stanotte sei la quarta voce del Circolo Ristretto.
          pe: { empatia: 20 }
          effetti: { fazione.circolo: 1, oggetto.circolo-ramo-di-metallo-vivo: 1, monete: 150, rep.circolo: 1 }
          almeno: { rep.circolo: 8 }
        fallimento:
          titolo: Nessuno guarda
          testo: |
            Resti in piedi davanti alla quarta pietra con le mani aperte, e nessuno alza gli occhi. Il vapore
            della fenditura passa e ripassa fra voi. Alla fine ti siedi da sol{o|a}. Aelion ti mette in mano
            il ramo che hai tagliato dall'Albero e la tua parte del denaro della città, e senza guardarti ti
            dice che da stanotte sei la quarta voce del Circolo Ristretto.
          pe: { empatia: 10 }
          effetti: { fazione.circolo: 1, oggetto.circolo-ramo-di-metallo-vivo: 1, monete: 150, tormento: 1.5 }
          almeno: { rep.circolo: 8 }

  # ------------------------------------------------------------ dopo il passo 14 · i Raschiatori al margine
  - id: circolo-i-raschiatori-al-margine
    presso: circolo-bosco-di-velthar
    immagine: personaggi/dragna-gro-malog
    titolo: I Raschiatori al margine
    sommario: "La squadra di Dragna è accampata al margine da settimane, e aspetta che tu le dica dove scavare."
    luogo: Il Bosco di Velthar, il margine
    area: superficie-fratturata
    requisiti: [fazione.circolo >= 14, circolo.dragna == 1, circolo.albero >= 1, circolo.albero <= 3]
    testo: |
      Al margine, dove la strada di Velthar arriva al primo tronco, c'è un accampamento di tende cerate con le
      lanterne dei Raschiatori. La cera dei teli si è crepata lungo le pieghe, e davanti a ogni tenda l'erba è
      sparita sotto un fango nero e battuto. I primi tronchi stanno a dieci passi dalle tende, e in quei dieci
      passi nessuno ha piantato un picchetto. Una squadra di Dragna aspetta lì da settimane con le corde
      arrotolate in matasse ordinate. Il caposquadra è un mezzorco con un orecchio solo e ti viene incontro
      con il cappello in mano.

      «Dragna dice che il posto ce l'hai già detto» dice. «Noi siamo pronti, basta che ci dici quando si
      scende.»

      {conoscenze-della-strada Media} Le lanterne restano accese ogni notte e la squadra mangia lo stesso,
      perché una squadra ferma costa a Dragna quanto una al lavoro. Qualcuno le dovrà pagare ogni giorno
      perso.

      {origine apprendista-raschiatore} Sulle piattaforme il caposquadra ti ha insegnato ad arrotolare una
      corda bagnata senza farle prendere le pieghe, e adesso aspetta che tu gli dica di srotolarla.
    opzioni:
      - testo: "Dirgli che sotto non c'è niente per loro"
        descrizione: "L'Albero resta al Bosco. Dragna non sarà contenta, e la squadra se ne andrà con le corde asciutte."
        esito:
          titolo: Le corde asciutte
          testo: |
            Gli dici che sotto il Bosco non c'è niente da raschiare, e lui ti guarda a lungo e si gira il
            cappello fra le mani. Il giorno dopo le tende non ci sono più, e sull'erba restano i rettangoli
            gialli dove stavano i teli. Al Grifone, si dice, Dragna ha spaccato un boccale sul tavolo
            pronunciando il tuo nome.
          effetti: { rep.raschiatori: -1 }
          imposta: { circolo.dragna: 2 }
      - testo: "Pagare la squadra per il tempo perso"
        descrizione: "Un debito si paga. Se lo paghi tu, Dragna se ne ricorderà meno."
        requisiti: [monete >= 60]
        esito:
          titolo: Il tempo perso
          testo: |
            Gli conti in mano le settimane perse della squadra giorno per giorno, e lui le ricconta davanti a
            te una moneta alla volta. Se ne vanno il mattino dopo senza rancore e anche senza salutare, con le
            corde asciutte sulle spalle. Al Grifone, si dice, Dragna ha bevuto alla tua salute, con poca
            convinzione.
          effetti: { monete: -60, rep.raschiatori: -0.5 }
          imposta: { circolo.dragna: 2 }
