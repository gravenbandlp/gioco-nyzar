# La quest del Circolo di Velthar, passi 11-15 (fazione.circolo 10 → 15). Tutti chiedono pista.capomozzo >= 7.
# 11 La tempesta dalla pianura: tre scene di fila (la linea delle piante, le bestie, gli orchi profughi di
#    Capomozzo all'alba). circolo.orchi: 1 accolti, 2 cacciati, 3 consegnati alla Caserma.
# 12 La spirale (grado 4): Padre Vantes viene al margine (circolo.promessa-velo), poi il rito di chi scende.
# 13 La fenditura: l'ingresso nella spedizione (spedizione-fenditura.yaml). Il Custode di linfa sta nel cuore,
#    che porta a 13 e apre subito `circolo-occhi-dorati`.
# 14 Occhi dorati (in spedizione-fenditura.yaml, perché sta nella cavità): quattro strade. Chi esce prima di
#    scegliere ci torna con `circolo-tornare-all-albero`, qui.
# 15 Il respiro lungo (grado 5): una scena per le strade 1-3 (circolo.albero <= 3), una per la strada 4.
#    Più una scena breve per chi ha portato i Raschiatori al margine e non ha dato loro il posto.
storylet:
  # ------------------------------------------------------------ 10 → 11 · la tempesta dalla pianura
  - id: circolo-la-tempesta-dalla-pianura
    presso: circolo-bosco-di-velthar
    immagine: ambientazione/marea-grigia
    titolo: La tempesta dalla pianura
    sommario: "Dalla pianura sale una tempesta di Marea come una parete di latte, e se il margine del Bosco cede arriva in città."
    luogo: Il Bosco di Velthar, il margine sud
    area: superficie-fratturata
    requisiti: [fazione.circolo == 10, pista.capomozzo >= 7]
    testo: |
      La tempesta arriva al tramonto dalla pianura del sud, una parete
      lattiginosa alta quanto due alberi che avanza al passo di un uomo
      senza che il vento la spinga, e dove passa l'erba diventa grigia.

      Al margine sud Tharn ha messo in fila gli Irriducibili, una trentina
      di druidi a dieci passi l'uno dall'altro con le mani nella terra fra
      le radici. È la linea delle piante, tenuta da cento anni per aiutare
      il Bosco a bere la Marea più in fretta. Stasera il Bosco ha il respiro
      corto, e le cortecce si accendono a scatti come quelle del boschetto
      grigio.

      {politica-ed-economia Facile} Se il margine cede, Qir-Azel, a un
      giorno di cammino, se ne accorgerà con la tempesta sui tetti.

      Tharn ti indica il posto vuoto nella fila, fra un vecchio druido con
      la barba fino alla cintura e una ragazza che trema.
    opzioni:
      - testo: "Prendere posto nella linea delle piante"
        descrizione: "Le mani nella terra fra le radici, ad aiutare le piante a bere."
        prova: { attributo: mentale, abilita: natura, difficolta: Media }
        successo:
          titolo: Le mani nella terra
          testo: |
            Senti la Marea arrivare fredda dalle punte delle radici e sciogliersi
            nel legno. La parete ti passa sopra come acqua sopra un sasso e la
            linea regge, mentre accanto a te la ragazza smette di tremare.
          pe: { natura: 5 }
          segue: circolo-le-bestie-davanti-alla-tempesta
        fallimento:
          titolo: La radice sbagliata
          testo: |
            Infili le mani fra le radici di un albero già pieno e la Marea ti
            risale nelle dita fino ai polsi, ma tieni lo stesso, perché la fila
            non si rompe.
          effetti: { contaminazione: 1 }
          segue: circolo-le-bestie-davanti-alla-tempesta
      - testo: "Bere la Marea di un druido caduto"
        descrizione: "Il vecchio con la barba è caduto in ginocchio con la faccia grigia, e berne la Marea te ne lascia una parte."
        incantesimo: bere-la-marea
        prova: { attributo: mentale, abilita: magia, difficolta: Media }
        successo:
          titolo: Il sorso del vecchio
          testo: |
            Tiri su la Marea dal petto del vecchio come l'acqua da un pozzo, e lui
            riprende colore dalle labbra mentre la tua bocca sa di ferro. Si
            rimette in fila senza ringraziare, come si fa al Circolo.
          pe: { magia: 5 }
          effetti: { contaminazione: 1, rep.circolo: 0.5 }
          segue: circolo-le-bestie-davanti-alla-tempesta
        fallimento:
          titolo: Troppo
          testo: |
            Tiri troppo forte, e sei tu a cadere in ginocchio con la faccia grigia
            finché la ragazza non ti tira su per il colletto.
          effetti: { contaminazione: 1.5 }
          segue: circolo-le-bestie-davanti-alla-tempesta
      - testo: "Correre ad avvertire la città"
        descrizione: "Un giorno di strada da fare in mezza notte a cavallo, lasciando il margine con una persona in meno."
        prova: { attributo: fisico, abilita: [cavalcare, atletica], difficolta: Media }
        successo:
          titolo: La campana della porta nord
          testo: |
            All'alba la campana della porta nord suona a martello. La Caserma
            chiude le porte, il Velo apre la Cattedrale a chi resta fuori, e Julia
            Castaldi manda i suoi a tappare i pozzi. Torni al Bosco a mezzogiorno
            sul cavallo di un altro, e al margine mancano tre alberi che ieri
            c'erano.
          pe: { cavalcare: 5 }
          effetti: { rep.castaldi: 0.5, rep.velo: 0.5 }
          segue: circolo-le-bestie-davanti-alla-tempesta
        fallimento:
          titolo: Il cavallo azzoppato
          testo: |
            A metà strada il cavallo mette lo zoccolo in una buca. Arrivi alla porta nord a piedi, quando le sentinelle hanno già visto la parete da sole, e torni al Bosco
            zoppicando sotto la pioggia grigia.
          effetti: { ferite: 1 }
          segue: circolo-le-bestie-davanti-alla-tempesta
      - testo: "Portare acqua alla linea"
        descrizione: "Chi non sa tenere le piante porta l'acqua a chi le tiene, tutta la notte, dentro la nebbia."
        costo: 2
        esito:
          titolo: Avanti e indietro
          testo: |
            Porti l'acqua dal ruscello alla linea per tutta la notte, con la nebbia sempre più alta a ogni viaggio, e all'alba hai le braccia
            di legno e la gola grigia.
          effetti: { contaminazione: 1 }
          segue: circolo-le-bestie-davanti-alla-tempesta

  - id: circolo-le-bestie-davanti-alla-tempesta
    presso: circolo-bosco-di-velthar
    immagine: ambientazione/marea-grigia
    titolo: Le bestie davanti alla tempesta
    sommario: "La tempesta spinge davanti a sé tutto quello che corre, e quello che corre ha perso la testa."
    luogo: Il Bosco di Velthar, il margine sud, nella notte
    area: superficie-fratturata
    tipo: seguito
    requisiti: [fazione.circolo == 10]
    testo: |
      A mezzanotte dalla parete escono le bestie che la tempesta ha spinto
      davanti a sé, dalle volpi a una capra con la corda al collo. Corrono
      con gli occhi bianchi dritte contro la linea, e due hanno già il pelo
      grigio e le zampe che si piegano dalla parte sbagliata. Un druido si
      alza per spostarsi, e una volpe gli salta alla gola.

      Tharn grida qualcosa che si perde nel vento, i lupi si buttano sulle
      bestie, e la linea comincia ad aprirsi proprio accanto a te.

      {addestrare-animali Media} Corrono e mordono per paura, e una voce
      ferma, in mezzo a tutto questo, ne ferma qualcuna.
    opzioni:
      - testo: "Fermare le bestie"
        descrizione: "Due bestie impazzite che mordono quello che trovano, e la linea dietro di te che non si deve aprire."
        combattimento: circolo-bestie-della-tempesta
        vittoria:
          titolo: La linea chiusa
          testo: |
            Le due bestie cadono una sull'altra ai tuoi piedi, e il buco nella
            linea si chiude. Il druido morso si rialza con la mano sul collo e
            torna in fila.
          pe: { rissa: 5 }
          segue: circolo-gli-orchi-al-margine
        sconfitta:
          titolo: I morsi
          testo: |
            Le bestie ti travolgono e la linea si apre per un tratto, finché Tharn
            la richiude con i lupi. Al mattino ti fasciano le braccia morse con le
            foglie.
          effetti: { contaminazione: 1 }
          segue: circolo-gli-orchi-al-margine
      - testo: "Reggere la notte sulla linea"
        descrizione: "Le mani nella terra, senza muoverti mentre le bestie passano, fino all'alba."
        prova: { attributo: fisico, abilita: resistenza, difficolta: Difficile }
        successo:
          titolo: Fino all'alba
          testo: |
            Le bestie ti passano accanto e sopra senza toccarti, come l'acqua
            intorno a un palo. All'alba hai perso la sensazione delle ginocchia, e
            nel tuo tratto la linea ha retto.
          pe: { resistenza: 10 }
          segue: circolo-gli-orchi-al-margine
        fallimento:
          titolo: Le ginocchia
          testo: |
            Verso le quattro le ginocchia ti cedono e una capra ti passa sopra. La
            ragazza della fila ti rimette le mani nella terra e te le tiene ferme
            lei fino all'alba.
          effetti: { contaminazione: 1, ferite: 1 }
          segue: circolo-gli-orchi-al-margine
      - testo: "Fermarle con Richiamo"
        descrizione: "Sono bestie con la paura addosso, e la lingua del Circolo arriva anche a loro."
        incantesimo: richiamo
        prova: { attributo: mentale, abilita: magia, difficolta: Media }
        successo:
          titolo: La voce ferma
          testo: |
            Al Richiamo gridato nel vento le bestie più vicine si fermano di
            colpo, con gli occhi ancora bianchi, e le giri verso il fianco del
            Bosco, dove la linea è più spessa.
          pe: { addestrare-animali: 5 }
          segue: circolo-gli-orchi-al-margine
        fallimento:
          titolo: Il vento
          testo: |
            Il vento si porta via il Richiamo a metà, e le bestie ti passano
            addosso lasciandoti un morso al polpaccio.
          effetti: { contaminazione: 1, ferite: 0.5 }
          segue: circolo-gli-orchi-al-margine

  - id: circolo-gli-orchi-al-margine
    presso: circolo-bosco-di-velthar
    immagine: bestiario/orco
    titolo: Gli orchi al margine
    sommario: "All'alba la tempesta si ferma, e fra le bestie morte davanti al margine c'è un gruppo di orchi di Capomozzo senza armi."
    luogo: Il Bosco di Velthar, il margine sud, all'alba
    area: superficie-fratturata
    tipo: seguito
    requisiti: [fazione.circolo == 10]
    testo: |
      All'alba la parete si ferma a cento passi dal margine e si affloscia in una nebbia bassa, e dietro di te un terzo degli alberi del
      margine è grigio fino alle cime.

      Fra le bestie morte c'è un gruppo di orchi, una ventina di donne e vecchi con qualche ragazzo, senza armi. Sono scappati da
      Capomozzo quando il forte è caduto, e la tempesta li ha spinti fin qui. Una vecchia con i capelli intrecciati di ossa si
      inginocchia davanti a Tharn, con la mano sulla spalla di un ragazzo che ha la febbre.

      «La legge del Bosco protegge chi non porta lame contro gli alberi» ti dice Tharn, piano. «Loro non ne portano. In città diranno che
      sono orchi.»

      {origine fuggiasco-di-ghoran} Gli orchi profughi li hai visti a Ghoran, in fila davanti alla bilancia, con gli stessi occhi.
    opzioni:
      - testo: "Lasciarli entrare nel Bosco"
        descrizione: "La legge del Bosco è chiara, e Dolovan Stroud lo verrà a sapere."
        esito:
          titolo: La legge del Bosco
          testo: |
            Tharn si scansa, e gli orchi entrano piano nel Bosco mentre i lupi li annusano uno per uno. Due giorni dopo arriva al Circolo una lettera di Julia Castaldi con una manciata di monete per chi ha tenuto il margine, e in fondo, di suo pugno, l'avviso che
            in città si parla di orchi nel Bosco.
          pe: { resistenza: 10 }
          effetti: { fazione.circolo: 1, rep.circolo: 1.5, racconto: 1, monete: 15 }
          imposta: { circolo.orchi: 1 }
      - testo: "Mandarli via"
        descrizione: "Il Bosco ha il respiro corto e un orco in più è una bocca in più, da mandare via senza toccarli."
        prova: { attributo: sociale, abilita: [intimidire, persuasione], difficolta: Media }
        successo:
          titolo: La pianura
          testo: |
            Dici alla vecchia che il Bosco non ha posto, e lei porta i suoi verso est, nella nebbia. Tharn non ti parla fino a sera. Due giorni
            dopo arriva al Circolo una lettera di Julia Castaldi, con una manciata di monete per chi ha tenuto il margine.
          pe: { intimidire: 10 }
          effetti: { fazione.circolo: 1, rep.circolo: 1, racconto: 1, monete: 15 }
          imposta: { circolo.orchi: 2 }
        fallimento:
          titolo: Il ragazzo con la febbre
          testo: |
            Alzi la voce e il ragazzo con la febbre scoppia a piangere. Gli orchi
            se ne vanno verso est, ma la vecchia prima ti sputa ai piedi davanti a
            mezzo Circolo. Due giorni dopo arriva una lettera di Julia Castaldi,
            con una manciata di monete per chi ha tenuto il margine.
          effetti: { fazione.circolo: 1, rep.circolo: 0.5, racconto: 1, monete: 15, tormento: 1 }
          imposta: { circolo.orchi: 2 }
      - testo: "Consegnarli alla Caserma"
        descrizione: "La Caserma vorrà sapere chi sono questi profughi, e li terrà dove li può contare."
        esito:
          titolo: La scorta
          testo: |
            A mezzogiorno arriva una scorta della Caserma con due carri, e gli
            orchi ci salgono senza opporsi, con la vecchia che guarda altrove come
            Tharn. Due giorni dopo arriva al Circolo una lettera di Julia Castaldi
            con una manciata di monete per chi ha tenuto il margine, insieme ai
            ringraziamenti della Caserma.
          pe: { resistenza: 10 }
          effetti: { fazione.circolo: 1, rep.circolo: 1, rep.caserma: 0.5, racconto: 1, monete: 15 }
          imposta: { circolo.orchi: 3 }
      - testo: "Parlare alla vecchia nella lingua dei recinti"
        descrizione: "Nei recinti di Ghoran si impara l'orchesco che basta per dirle che qui la bilancia non c'è."
        quando: [origine.fuggiasco-di-ghoran >= 1]
        esito:
          titolo: Nessuna bilancia
          testo: |
            Alle tue poche parole d'orchesco la vecchia alza la testa di scatto, e
            le dici che qui la bilancia non c'è. Gli orchi entrano nel Bosco in
            fila, annusati dai lupi. Due giorni dopo arriva una lettera di Julia
            Castaldi, con una manciata di monete per chi ha tenuto il margine.
          pe: { empatia: 10 }
          effetti: { fazione.circolo: 1, rep.circolo: 1.5, racconto: 1, monete: 15 }
          imposta: { circolo.orchi: 1 }

  # ------------------------------------------------------------ 11 → 12 · la spirale (grado 4)
  - id: circolo-padre-vantes-al-margine
    presso: circolo-bosco-di-velthar
    immagine: personaggi/padre-vantes
    titolo: Padre Vantes al margine
    sommario: "Padre Aurelio Vantes è venuto fino al margine del Bosco, e vuole sapere per primo che cosa c'è sotto la fenditura."
    luogo: Il Bosco di Velthar, il margine
    area: superficie-fratturata
    requisiti: [fazione.circolo == 11, pista.capomozzo >= 7]
    testo: |
      Sul tronco con le tre tacche, seduto come uno che aspetta la carrozza, c'è Padre Aurelio Vantes, con la veste rossa sporca di
      fango fino al ginocchio. Due guardie del Velo lo aspettano a venti passi senza sapere dove mettere le mani. Si alza quando ti vede
      e ti posa due dita sul polso, come fa con tutti in Cattedrale.

      «Dopo Capomozzo la Madre ha detto che le rovine si sono ricordate i loro nomi» dice. «Al margine qualcuno dice che anche qui sotto
      se n'è ricordata una, e che respira. Se sotto il Bosco c'è una radice del Grande Albero, la Confraternita vuole saperlo per prima,
      figliolo, per pregare nel posto giusto. Prenderla, mai.»

      {politica-ed-economia Media} Una radice del Grande Albero sotto il Bosco del Circolo chiuderebbe cent'anni di dottrina, e chi
      perde la disputa la perde per sempre.

      {origine accolito-del-velo} Le due dita sul polso te le ha posate cento volte, per sentire se il cuore ti batteva in fretta.
    opzioni:
      - testo: "Promettergli un campione della linfa"
        descrizione: "Una fiala dalla fenditura per la Cattedrale, e il Circolo non lo saprà finché non glielo dirai."
        esito:
          titolo: La promessa
          testo: |
            Vantes ti stringe il polso e ti benedice a voce bassa, per non farsi
            sentire dai lupi, e riparte verso la città usando, adesso, il bastone
            da pellegrino.
          effetti: { rep.velo: 1 }
          imposta: { circolo.promessa-velo: 1 }
          segue: circolo-la-spirale-di-chi-scende
      - testo: "Dirgli di no con garbo"
        descrizione: "Il Velo e il Circolo si rispettano da cent'anni, e un no detto bene lascia le cose come stanno."
        prova: { attributo: sociale, abilita: [galateo, persuasione], difficolta: Media }
        successo:
          titolo: Il no ben detto
          testo: |
            Gli dici che quello che trovi sotto lo porterai prima al Maestro, com'è giusto. Vantes sospira e ti benedice lo stesso, e prima di
            andare ti chiede di pregare per lui, se laggiù ti ricordi.
          pe: { galateo: 5 }
          segue: circolo-la-spirale-di-chi-scende
        fallimento:
          titolo: Il no storto
          testo: |
            Il no ti esce più duro di come volevi, con il Circolo nominato due
            volte e il Velo nessuna, e Vantes se ne va senza benedirti.
          effetti: { rep.velo: -0.5, scandalo: 0.5 }
          segue: circolo-la-spirale-di-chi-scende
      - testo: "Dirgli di no e basta"
        descrizione: "Il Bosco è del Circolo, e il Velo ha già la sua Cattedrale."
        esito:
          titolo: Il no
          testo: |
            Vantes ti guarda come un figlio cresciuto storto, con più pena che
            rabbia, e se ne va con le guardie, seguito dagli occhi dei lupi.
          effetti: { rep.velo: -0.5 }
          segue: circolo-la-spirale-di-chi-scende
      - testo: "Rispondergli con le parole del Velo"
        descrizione: "Il Velo ha una formula per chi scende nelle profondità e chiede di tornare, che Vantes riconoscerà."
        quando: [origine.accolito-del-velo >= 1]
        esito:
          titolo: La formula di chi scende
          testo: |
            Gli dici la formula di chi scende, quella che i novizi imparano per i
            Raschiatori, aggiungendo che quello che troverai lo porterai al
            Maestro. Vantes chiude gli occhi e la finisce con te, e riparte
            benedicendoti senza insistere.
          pe: { galateo: 5 }
          segue: circolo-la-spirale-di-chi-scende

  - id: circolo-la-spirale-di-chi-scende
    presso: circolo-bosco-di-velthar
    immagine: fazioni/circolo-di-velthar
    titolo: La spirale di chi scende
    sommario: "Al rito di chi scende nella fenditura ognuno del Circolo Ristretto ti dà qualcosa, e il Maestro resta sopra."
    luogo: Il Bosco di Velthar, il Circolo del Respiro, di notte
    area: superficie-fratturata
    tipo: seguito
    requisiti: [fazione.circolo == 11]
    testo: |
      Il rito di chi scende si fa di notte sulla spirale, con la fenditura che soffia vapore azzurro e tu in piedi sul bordo,
      con il calore che ti sale lungo le gambe come da una stufa aperta.

      Tharn ti lega al polso una ciocca di pelo grigio del branco intrecciata con un filo rosso. Serha ti mette in mano un seme
      scuro grande come una noce e ti chiude le dita sopra con la mano di legnoscuro. Voren, dietro le pietre, ti fa soltanto un
      gesto, la mano aperta verso il basso. Aelion resta seduto, perché qualcuno, dice, deve ricordarsi di tirare la corda.

      {natura Media} Il seme è di quercia, ma di una quercia mai vista, pesante come un sasso e caldo nel palmo.
    opzioni:
      - testo: "Ringraziare ognuno con lo sguardo"
        descrizione: "Al Circolo si ringrazia guardando chi ti ha dato qualcosa finché non abbassa gli occhi lui."
        esito:
          titolo: Custode del Margine
          testo: |
            Guardi Tharn e Serha, e infine il buio dove sta Voren, finché ognuno abbassa gli occhi per primo. Aelion ti fa Custode del Margine, e Serha
            ti mette sulle spalle un mantello di cuoio cucito sul muschio vivo, che beve la Marea al posto tuo. Quando torni, ti dice, c'è una branda per
            te nella spirale, accanto alla sua.
          pe: { empatia: 10 }
          effetti: { fazione.circolo: 1, oggetto.circolo-mantello-di-muschio: 1 }
          almeno: { rep.circolo: 8 }
      - testo: "Mettere il seme nella terra della spirale"
        descrizione: "Un seme di quercia si pianta, e forse Serha lo aspetta."
        esito:
          titolo: Il seme
          testo: |
            Premi il seme nella terra fra due pietre, e Serha sorride per la prima
            volta da quando la conosci, anche se te lo fa riprendere, perché serve
            sotto. Aelion ti fa Custode del Margine, e Serha ti mette sulle spalle
            un mantello di cuoio cucito sul muschio vivo, che beve la Marea al
            posto tuo. Quando torni, c'è una branda per te nella spirale.
          pe: { natura: 10 }
          effetti: { fazione.circolo: 1, oggetto.circolo-mantello-di-muschio: 1 }
          almeno: { rep.circolo: 8 }
      - testo: "Rispondere al gesto di Voren"
        descrizione: "A un Silente si risponde in silenzio, tenendo la sua pressione nella testa."
        esito:
          titolo: Giù
          testo: |
            Apri la mano verso il basso come lui, e la pressione di Voren ti entra
            dietro gli occhi e ci resta, calda, per tutto il rito. Aelion ti fa
            Custode del Margine, e Serha ti mette sulle spalle un mantello di
            cuoio cucito sul muschio vivo, che beve la Marea al posto tuo. Quando
            torni, c'è una branda per te nella spirale.
          pe: { resilienza: 10 }
          effetti: { fazione.circolo: 1, oggetto.circolo-mantello-di-muschio: 1, tormento: 1 }
          almeno: { rep.circolo: 8 }

  # ------------------------------------------------------------ 12 → 13 · la discesa nella fenditura
  - id: circolo-la-discesa
    presso: circolo-bosco-di-velthar
    immagine: fazioni/circolo-di-velthar
    titolo: La discesa
    sommario: "La corda è legata alla pietra più bassa della spirale, e sotto la fenditura soffia calore da una profondità che nessuno conosce."
    luogo: Il Bosco di Velthar, il bordo della fenditura
    area: superficie-fratturata
    requisiti: [fazione.circolo == 12, pista.capomozzo >= 7]
    testo: |
      Tharn lega la corda alla pietra più bassa della spirale e Serha
      controlla il nodo due volte. La matassa scende nel buio srotolandosi a
      lungo, finché si ferma tesa, come presa dall'altra parte, e dal buco
      sale un calore secco che ti fa lacrimare gli occhi. La lupa vecchia di
      Tharn si siede sul bordo, e Aelion tiene una mano sulla corda,
      all'altezza del nodo.

      {atletica Media} Duecento passi di corda nel buio caldo. Le braccia
      reggeranno, i palmi senza guanti no.

      {magia Media} Il Mana che sale dalla fenditura gira su se stesso come
      l'acqua di un fiume dietro un sasso, spinto su da qualcosa laggiù.
    opzioni:
      - testo: "Scendere con la corda"
        descrizione: "Duecento passi di corda nel buio caldo fino alla gola, e poi si cammina."
        requisiti: [chiave.fenditura >= 1]
        esito:
          titolo: Giù
          testo: |
            Con i guanti di Tharn ti cali nel buio una mano sotto l'altra. Dopo
            venti passi la spirale è un cerchio di luce sopra la testa, dopo
            cinquanta non c'è più, e l'aria si fa calda come in una fucina finché
            i piedi toccano la roccia.
          vai: circolo-fenditura
      - testo: "Scendere con la lupa in braccio per il primo tratto"
        descrizione: "Al primo pianerottolo la lupa ti può seguire, e più giù no."
        requisiti: [chiave.fenditura >= 1, chiave.branco >= 1]
        costo: 0
        esito:
          titolo: Il branco fino al caldo
          testo: |
            Scendi con il tuo animale stretto al petto fino al primo pianerottolo
            di roccia e lì lo lasci. Quando non lo vedi più lo senti ancora, un
            guaito sottile sopra la testa che non se ne va.
          vai: circolo-fenditura

  # ------------------------------------------------------------ 13 → 14 · tornare all'Albero, se si è usciti prima di scegliere
  - id: circolo-tornare-all-albero
    presso: circolo-bosco-di-velthar
    immagine: fazioni/circolo-di-velthar
    titolo: Tornare all'Albero
    sommario: "Il Custode di linfa è caduto e la strada fino all'Albero è libera, anche se laggiù c'è ancora da decidere."
    luogo: Il Bosco di Velthar, il bordo della fenditura
    area: superficie-fratturata
    requisiti: [fazione.circolo == 13]
    testo: |
      Sulla spirale ti guardano tutti quando passi, senza chiederti niente. Dalla fenditura sale un vapore azzurro denso come mai prima,
      a sbuffi lenti, come il respiro di un animale che dorme male, e Aelion, seduto accanto al nodo della corda, apre gli occhi quando
      arrivi.

      {resilienza Media} Da quando sei risalito, la notte sogni due occhi dorati che ti guardano senza fare nient'altro.
    opzioni:
      - testo: "Ridiscendere fino all'Albero"
        descrizione: "La strada la conosci, dal caldo della gola alla città sepolta, fino alla cavità."
        costo: 2
        esito:
          titolo: Di nuovo giù
          testo: |
            Ti cali di nuovo nel buio e fai la strada senza fermarti, con le
            radici di metallo che ti sfiorano le spalle, finché in fondo alla
            cavità l'Albero ti aspetta sulla roccia ferma.
          segue: circolo-occhi-dorati

  # ------------------------------------------------------------ 14 → 15 · il respiro lungo (grado 5)
  - id: circolo-il-respiro-lungo
    presso: circolo-bosco-di-velthar
    immagine: fazioni/circolo-di-velthar
    titolo: Il respiro lungo
    sommario: "Il grigio si ritira dal Bosco, e sulla spirale il Maestro ti lascia un posto e una domanda."
    luogo: Il Bosco di Velthar, il Circolo del Respiro
    area: superficie-fratturata
    requisiti: [fazione.circolo == 14, circolo.albero >= 1, circolo.albero <= 3, pista.capomozzo >= 7]
    testo: |
      In dieci giorni il grigio si ritira dalle cime fino alle radici, e nel boschetto del sud resta soltanto la corteccia segnata come dopo
      una malattia. I lupi di Tharn tornano a dormire a sud, e le cortecce si riaccendono piano, con il respiro lungo di chi dorme bene.

      Sulla spirale, stavolta, Aelion ti indica la quarta pietra, e ti siedi. Tharn ride sotto la barba, Serha ti guarda come una tavola
      appena incisa, e il posto di Voren è vuoto come sempre.

      «La notte dei Sussurri ero qui» dice Aelion, guardando il vapore. «Le voci salivano dal suolo in città, e salivano anche qui. Il Bosco
      rispose.» Lascia passare tre sbuffi. «Che cosa rispose, non lo dico. A te, stanotte, lascio una domanda sola.»

      {empatia Difficile} Ha aspettato tredici anni per dire la prima metà, e della seconda ha più paura che vergogna.

      {origine figlio-del-circolo} La quarta pietra, vuota quando eri bambino, aspettava qualcuno che sarebbe arrivato dopo, e ti vengono le
      lacrime agli occhi senza chiedertelo.
    opzioni:
      - testo: "Chiedere dei Silenti"
        descrizione: "Dove vanno i Silenti quando si fondono con il Bosco, e che cosa trovano là."
        esito:
          titolo: Dove vanno i Silenti
          testo: |
            Aelion ti risponde con un'immagine sola, un fiume che entra in un lago e il lago in un pozzo senza fondo. Poi ti dà una ghianda di metallo vivo, un ramo dritto con la punta fatta lama da sola e la
            borsa della città per il margine. Da stanotte sei la quarta voce del Circolo Ristretto, e al margine ti chiameranno Respiro di Velthar.
          pe: { resilienza: 20 }
          effetti: { fazione.circolo: 1, oggetto.circolo-ramo-di-metallo-vivo: 1, oggetto.circolo-ghianda-di-metallo-vivo: 1, monete: 350, informazioni.segreto: 1 }
          almeno: { rep.circolo: 10 }
          imposta: { circolo.respiro: 1 }
      - testo: "Chiedere della bambina del branco"
        descrizione: "Che cosa ha lasciato l'Albero alla bambina che ci dormì accanto, e dov'è adesso."
        esito:
          titolo: La bambina del branco
          testo: |
            Aelion tace, poi ti dice che la bambina è cresciuta ed è andata in città, e che chi dorme accanto a un albero acceso ne porta i segni, come te. Ti dà una ghianda di metallo vivo, un ramo con la punta fatta lama da sola e la borsa della città. Da stanotte sei la quarta voce del Circolo Ristretto, e al
            margine ti chiameranno Respiro di Velthar.
          pe: { addestrare-animali: 20 }
          effetti: { fazione.circolo: 1, oggetto.circolo-ramo-di-metallo-vivo: 1, oggetto.circolo-ghianda-di-metallo-vivo: 1, monete: 350, informazioni.segreto: 1 }
          almeno: { rep.circolo: 10 }
          imposta: { circolo.respiro: 1 }
      - testo: "Chiedere di Selara Vyn"
        descrizione: "La guaritrice del Circolo che scese nel Rito e tornò con un bracciale di corteccia pietrificata, e che il Velo chiama santa."
        esito:
          titolo: Selara
          testo: |
            Al nome di Selara, Serha lascia la spirale. Aelion ti dice che Selara scese perché qualcuno doveva farlo, e che il bracciale non se l'è mai tolto perché non era un bracciale. Poi ti dà una ghianda di metallo vivo, un ramo con la punta fatta lama da sola e la borsa della città. Da stanotte sei la quarta voce del Circolo Ristretto, e ti chiameranno Respiro
            di Velthar.
          pe: { magia: 20 }
          effetti: { fazione.circolo: 1, oggetto.circolo-ramo-di-metallo-vivo: 1, oggetto.circolo-ghianda-di-metallo-vivo: 1, monete: 350, informazioni.segreto: 1 }
          almeno: { rep.circolo: 10 }
          imposta: { circolo.respiro: 1 }

  - id: circolo-il-posto-sulla-spirale
    presso: circolo-bosco-di-velthar
    immagine: fazioni/circolo-di-velthar
    titolo: Il posto sulla spirale
    sommario: "Il Bosco si è salvato a metà grazie ad altri, e sulla spirale il tuo posto nessuno te lo offre volentieri."
    luogo: Il Bosco di Velthar, il Circolo del Respiro
    area: superficie-fratturata
    requisiti: [fazione.circolo == 14, circolo.albero == 4, pista.capomozzo >= 7]
    testo: |
      Il grigio si ritira in un mese, a strappi, da quando sotto la fenditura lavorano altri, e ogni sera al margine torna indietro
      un carro più pesante di quello passato la mattina. Le cortecce si riaccendono, ma sulla spirale i druidi parlano meno, e
      quando passi si guardano le mani. Aelion ti indica la quarta pietra senza guardarti, e la pietra di Serha resta vuota.

      «Il Bosco respira» dice Aelion. «Respira perché altri gli tengono la bocca aperta, e li paga con quello che aveva sotto. Hai
      scelto tu, e la scelta ha salvato il margine. La spirale non dimentica né l'una né l'altra cosa.» Lascia passare tre sbuffi di
      vapore. «Il posto è tuo. Il nome che il margine ti avrebbe dato, no.»

      {politica-ed-economia Facile} Il carro della mattina porta il sigillo di chi hai scelto, e quello della sera porta il Mana.
    opzioni:
      - testo: "Sederti sulla quarta pietra"
        descrizione: "Il posto è tuo, e il resto verrà, o non verrà."
        esito:
          titolo: La quarta pietra
          testo: |
            La quarta pietra è fredda. Aelion ti rende il ramo dell'Albero che hai tenuto per te, perché il Circolo non vuole niente venuto da sotto, e ti dà la tua parte di quanto la
            città ha mandato per il margine. Da stanotte sei la quarta voce del Circolo Ristretto, e i druidi non ti chiamano in nessun modo.
          pe: { natura: 20 }
          effetti: { fazione.circolo: 1, oggetto.circolo-ramo-di-metallo-vivo: 1, monete: 150 }
          almeno: { rep.circolo: 8 }
      - testo: "Chiedere perdono al Circolo Ristretto"
        descrizione: "Al Circolo il perdono si chiede in silenzio, e lo ottiene chi viene guardato per primo."
        prova: { attributo: sociale, abilita: [empatia, espressivita], difficolta: Difficile }
        successo:
          titolo: Tharn guarda per primo
          testo: |
            Resti in piedi davanti alla quarta pietra a mani aperte finché qualcuno alza gli occhi. È Tharn, e i lupi si alzano con lui. Aelion ti mette in mano il ramo dell'Albero, dritto come un'asta
            con la punta fatta lama, e la tua parte del denaro della città. Da stanotte sei la quarta voce del Circolo Ristretto.
          pe: { empatia: 20 }
          effetti: { fazione.circolo: 1, oggetto.circolo-ramo-di-metallo-vivo: 1, monete: 150, rep.circolo: 1 }
          almeno: { rep.circolo: 8 }
        fallimento:
          titolo: Nessuno guarda
          testo: |
            Resti in piedi a mani aperte, e nessuno alza gli occhi, finché ti
            siedi da solo. Aelion ti dà il ramo dell'Albero e la tua parte del
            denaro della città, e ti fa quarta voce del Circolo Ristretto come si
            legge una sentenza.
          pe: { empatia: 10 }
          effetti: { fazione.circolo: 1, oggetto.circolo-ramo-di-metallo-vivo: 1, monete: 150, tormento: 1.5 }
          almeno: { rep.circolo: 8 }

  # ------------------------------------------------------------ dopo il passo 14 · i Raschiatori al margine
  - id: circolo-i-raschiatori-al-margine
    presso: circolo-bosco-di-velthar
    immagine: personaggi/dragna-gro-malog
    titolo: I Raschiatori al margine
    sommario: "La squadra di Dragna è accampata al margine da settimane, e aspetta che tu le dica dove scavare."
    luogo: Il Bosco di Velthar, il margine
    area: superficie-fratturata
    requisiti: [fazione.circolo >= 14, circolo.dragna == 1, circolo.albero >= 1, circolo.albero <= 3]
    testo: |
      Dove la strada di Velthar arriva al primo tronco c'è un accampamento
      di tende cerate con le lanterne dei Raschiatori appese ai pali, dove
      la squadra di Dragna aspetta da settimane con le corde arrotolate. Il
      caposquadra, un mezzorco con un orecchio solo, ti viene incontro con
      il cappello in mano.

      «Dragna dice che ci avevi detto dove» dice. «Noi siamo qui. Ci dici
      quando.»

      {conoscenze-della-strada Media} Una squadra ferma costa a Dragna
      quanto una al lavoro, e ogni giorno qui è un debito che qualcuno le
      dovrà pagare.

      {origine apprendista-raschiatore} Il caposquadra ti ha insegnato sulle
      piattaforme come si arrotola una corda bagnata, e adesso aspetta che
      tu gli dica di srotolarla.
    opzioni:
      - testo: "Dirgli che sotto non c'è niente per loro"
        descrizione: "L'Albero resta al Bosco, e la squadra se ne andrà con le corde asciutte."
        esito:
          titolo: Le corde asciutte
          testo: |
            Il caposquadra ti guarda a lungo girandosi il cappello fra le mani. Il
            giorno dopo le tende non ci sono più, e al Grifone, si dice, Dragna ha
            spaccato un boccale sul tavolo pronunciando il tuo nome.
          effetti: { rep.raschiatori: -1 }
          imposta: { circolo.dragna: 2 }
      - testo: "Pagare la squadra per il tempo perso"
        descrizione: "Un debito si paga, e se lo paghi tu Dragna se ne ricorderà meno."
        requisiti: [monete >= 60]
        esito:
          titolo: Il tempo perso
          testo: |
            Gli conti in mano le settimane perse, e lui le ricconta davanti a te. Se ne vanno il mattino dopo senza rancore e senza salutare, e al Grifone, si dice, Dragna ha bevuto alla tua salute con poca
            convinzione.
          effetti: { monete: -60, rep.raschiatori: -0.5 }
          imposta: { circolo.dragna: 2 }
