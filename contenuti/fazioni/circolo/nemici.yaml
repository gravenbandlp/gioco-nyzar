# I nemici della quest del Circolo di Velthar. Tarati sui nemici della stessa fase della storia:
# i lupi grigi, il cervo e l'eco della radura (passi 4-6) sulla Foresta Strisciante (contenuti/nemici/foresta.yaml),
# il capobranco come il cinghiale mutato, un poco più svelto e resistente; le bestie della tempesta e il guardiano di radici
# (passi 11-13) sui nemici di Capomozzo; il Custode di linfa (boss del passo 13) sul Cavaliere della Marea e sul
# Costruttore di Capomozzo. Tutti gli animali hanno il tratto `animale` (Richiamo funziona), l'eco il tratto `eco`.
nemici:
  - id: circolo-lupo-grigio
    immagine: icone/wolf-head
    nome: Lupo grigio
    descrizione: "Un lupo del boschetto grigio, con il pelo rigido come fil di ferro e le gengive di metallo. Caccia in silenzio e morde basso."
    attacco: 3
    difesa: 2
    difesaMentale: 2
    pf: 5
    danno: 1
    iniziativa: 4
    tratti: [animale]

  - id: circolo-capobranco-grigio
    immagine: icone/wolf-howl
    nome: Il capobranco grigio
    descrizione: "Un lupo grande quanto un vitello, con la schiena coperta di placche lattiginose. Respira a scatti come il boschetto, e il branco si muove al suo respiro."
    attacco: 4
    difesa: 3
    difesaMentale: 3
    pf: 11
    danno: 1
    iniziativa: 3
    tratti: [animale]

  - id: circolo-cervo-di-metallo
    immagine: icone/deer
    nome: Cervo dalle corna di metallo
    descrizione: "Un cervo maschio con le corna diventate di metallo grigio, ramificate come una lampada da chiesa. Carica a testa bassa e non scappa più."
    attacco: 4
    difesa: 3
    difesaMentale: 2
    pf: 9
    danno: 1
    riduzione: 1
    iniziativa: 3
    tratti: [animale]

  - id: circolo-spore-della-linfa-nera
    immagine: icone/mushroom
    nome: Spore della linfa nera
    descrizione: "Una nuvola di spore che si stacca dalla corteccia malata e ti segue, densa come fumo di pipa, e cerca la bocca prima degli occhi."
    attacco: 3
    difesa: 1
    difesaMentale: 1
    pf: 4
    danno: 0
    iniziativa: 1

  - id: circolo-eco-della-radura
    immagine: bestiario/cinghiale-crudele-mutato
    nome: L'eco della radura
    descrizione: "La Marea rappresa nella forma di un cinghiale, con le vene di un cinghiale sotto la pelle e nessun cinghiale dentro. Quando la colpisci si richiude come acqua."
    attacco: 4
    difesa: 3
    difesaMentale: 2
    pf: 12
    danno: 1
    iniziativa: 2
    tratti: [eco]

  - id: circolo-bestia-della-tempesta
    immagine: ambientazione/marea-grigia
    nome: Bestia della tempesta
    descrizione: "Prima era una volpe, o forse un cane, e ormai si capisce a stento. La tempesta lo spinge davanti a sé, e lui morde tutto quello che non scappa."
    attacco: 3
    difesa: 2
    difesaMentale: 2
    pf: 6
    danno: 1
    iniziativa: 3
    tratti: [animale]

  - id: circolo-guardiano-di-radici
    immagine: icone/tree-roots
    nome: Guardiano di radici
    descrizione: "Un groviglio di radici diventate cavi di metallo, che si tende fra le pareti della gola e si richiude su chi passa. In mezzo pulsa una luce azzurra."
    attacco: 4
    difesa: 3
    difesaMentale: 4
    pf: 9
    danno: 1
    riduzione: 1
    iniziativa: 2

  - id: circolo-custode-di-linfa
    immagine: bestiario/salvaguardia-precursori
    nome: Il Custode di linfa
    descrizione: "Una macchina dei Precursori cresciuta dentro un tronco, o un tronco cresciuto attorno a una macchina. Ha quattro braccia di legno e metallo e una camera di linfa azzurra al posto del cuore."
    attacco: 5
    difesa: 4
    difesaMentale: 5
    pf: 16
    danno: 2
    riduzione: 2
    iniziativa: 2

scontri:
  - { id: circolo-lupi-grigi, nome: "I lupi grigi", nemici: [circolo-lupo-grigio, circolo-lupo-grigio], feriteSconfitta: 2 }
  - { id: circolo-il-capobranco-grigio, nome: "Il capobranco grigio", nemici: [circolo-capobranco-grigio], feriteSconfitta: 3 }
  - { id: circolo-le-sentinelle-grigie, nome: "Le sentinelle grigie", nemici: [circolo-lupo-grigio, circolo-lupo-grigio, circolo-lupo-grigio], feriteSconfitta: 2 }
  - { id: circolo-il-cervo-di-metallo, nome: "Il cervo dalle corna di metallo", nemici: [circolo-cervo-di-metallo], feriteSconfitta: 2 }
  - { id: circolo-le-spore, nome: "Le spore della linfa nera", nemici: [circolo-spore-della-linfa-nera, circolo-spore-della-linfa-nera], feriteSconfitta: 2 }
  - { id: circolo-l-eco-della-radura, nome: "L'eco della radura", nemici: [circolo-eco-della-radura], feriteSconfitta: 3 }
  - { id: circolo-bestie-della-tempesta, nome: "Le bestie della tempesta", nemici: [circolo-bestia-della-tempesta, circolo-bestia-della-tempesta], feriteSconfitta: 2 }
  - { id: circolo-il-guardiano-di-radici, nome: "Il guardiano di radici", nemici: [circolo-guardiano-di-radici], feriteSconfitta: 2 }
  - { id: circolo-il-custode-di-linfa, nome: "Il Custode di linfa", nemici: [circolo-custode-di-linfa], feriteSconfitta: 4 }
