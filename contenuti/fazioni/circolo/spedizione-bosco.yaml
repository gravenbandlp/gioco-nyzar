# Il Bosco interno, spedizione della quest del Circolo di Velthar (dal passo 4, poi ripetibile).
# Ci si entra dal Bosco di Velthar (luogo circolo-bosco-di-velthar della Superficie): la prima volta con la scena del
# passo 4 (passi-1.yaml, circolo-il-boschetto-grigio), poi con `circolo-bosco-entrare`. La cavalcatura toglie il
# rintocco dell'ingresso. La ritirata riporta alla Superficie Fratturata.
# Le stanze vanno in fasce di profondità, e una stanza superata non ricompare nella stessa visita:
# 0 il margine (la volpe; le bestie che misurano le lame, che vale anche a 1),
# 1 i sentieri che cambiano (il sentiero che si chiude; la sacca di Marea; il ruscello di linfa, che vale anche a 2),
# 2 le rovine sotto le radici (il muro nel tronco; i cristalli nel legno; il Silente addormentato, che vale anche a 3),
# 3-4 il boschetto grigio (le cortecce color cenere, le spore, i lupi grigi).
# Il cuore a 5 ha due versioni: il capobranco grigio (fazione.circolo == 3, porta a 4) e, dopo, il giro delle
# sentinelle (fazione.circolo >= 4), che si rifà e la prima volta rende di più (circolo.sentinelle).
# Ogni stanza ha una via senza prova che costa due rintocchi e un poco di Ferite, Tormento o Contaminazione.
aree:
  - id: circolo-bosco-interno
    immagine: fazioni/circolo-di-velthar
    nome: Il Bosco interno
    sommario: "I sentieri del Bosco di Velthar che cambiano a ogni stagione, le rovine sotto le radici e, a sud, il boschetto grigio."
    spedizione: { ritorno: superficie-fratturata, soglia: 5, stanze: 3 }
    testo: |
      Oltre il margine il Bosco di Velthar si chiude sopra la testa, la luce arriva verde e a chiazze, e le venature delle cortecce si
      accendono con il ritmo lento di un respiro che dorme. I sentieri cambiano, e quello che prendi entrando non è quello che troverai
      uscendo. Più a sud il verde si fa grigio, e l'aria sa di ferro bagnato.

storylet:
  # ------------------------------------------------------------ l'ingresso, dopo il passo 4
  - id: circolo-bosco-entrare
    presso: circolo-bosco-di-velthar
    immagine: fazioni/circolo-di-velthar
    titolo: Il Bosco interno
    sommario: "Dalla spirale si scende verso i sentieri che cambiano, le rovine sotto le radici e il grigio a sud."
    luogo: Il Bosco di Velthar, il sentiero che scende dalla spirale
    area: superficie-fratturata
    ripetibile: true
    requisiti: [fazione.circolo >= 4]
    testo: |
      Dal bordo della spirale un sentiero scende fra due pietre coperte di muschio, e
      dopo dieci passi è già un altro sentiero. Sulla prima pietra un novizio offre a chi
      scende una bacca dalla sua ciotola, senza alzare gli occhi. Più giù il grigio è
      rimasto, anche se meno di prima, e le sentinelle del branco tornano ogni volta che
      qualcuno le scaccia.

      {natura Facile} Le bacche di sorbo torcono la bocca, e al Circolo le mangiano
      perché tengono sveglia la testa nella nebbia.
    opzioni:
      - testo: "Scendere nel Bosco interno"
        descrizione: "Un giorno di sentieri fino alle rovine, e poi il grigio."
        esito:
          titolo: Il sentiero che scende
          testo: |
            Mastichi una bacca con la smorfia di tutti, e dopo cento passi la
            spirale è sparita.
          vai: circolo-bosco-interno
      - testo: "Scendere a cavallo"
        descrizione: "In sella i primi sentieri passano in fretta, fino al margine del grigio."
        requisiti: [chiave.cavalcatura >= 1]
        costo: 0
        esito:
          titolo: In sella
          testo: |
            Il cavallo scende con le orecchie dritte, e i sentieri gli cambiano
            davanti quasi con riguardo.
          vai: circolo-bosco-interno

  # ------------------------------------------------------------ 0 · il margine
  - id: circolo-bosco-la-volpe
    immagine: fazioni/circolo-di-velthar
    titolo: La volpe sul sentiero
    sommario: "In mezzo al sentiero una volpe rossa ti aspetta seduta, e quando ti avvicini si alza e fa tre passi avanti."
    luogo: Il Bosco interno, i primi sentieri
    area: circolo-bosco-interno
    ripetibile: true
    requisiti: [profondita.circolo-bosco-interno == 0]
    testo: |
      Oltre due faggi saldati a metà altezza ti aspetta una volpe con un
      orecchio strappato, seduta in mezzo al sentiero. Quando fai un passo
      si alza, ne fa tre avanti e si volta a vedere se la segui, dove il
      sentiero si divide in tre.

      {addestrare-animali Media} Ha già deciso qualcosa su di te, e aspetta
      di vedere se te lo meriti.
    opzioni:
      - testo: "Seguire la volpe"
        descrizione: "Le volpi del Bosco conoscono i sentieri di oggi."
        prova: { attributo: mentale, abilita: [natura, percezione], difficolta: Facile }
        successo:
          titolo: La coda rossa
          testo: |
            La segui dalla punta rossa della coda fino a un ruscello, dove ti
            lascia senza salutare.
          effetti: { profondita.circolo-bosco-interno: 1 }
        fallimento:
          titolo: Le felci
          testo: |
            La perdi fra le felci e la ritrovi ai due faggi, paziente in un modo
            che ti offende.
          effetti: { tormento: 1 }
      - testo: "Mostrarle il segno delle tre tacche"
        descrizione: "Le bestie del margine conoscono quel segno meglio dei druidi giovani."
        requisiti: [chiave.bosco >= 1]
        esito:
          titolo: Il segno
          testo: |
            La volpe annusa il dischetto di corteccia e starnutisce, poi trotterella avanti senza
            voltarsi.
          effetti: { profondita.circolo-bosco-interno: 1 }
      - testo: "Chiamarla con Richiamo"
        descrizione: "Una volpe che guida capisce meglio nella sua lingua."
        incantesimo: richiamo
        prova: { attributo: mentale, abilita: magia, difficolta: Facile }
        successo:
          titolo: Due passi davanti
          testo: |
            Al Richiamo la volpe ti cammina accanto con l'orecchio strappato
            girato verso di te, per il sentiero più corto.
          pe: { addestrare-animali: 2 }
          effetti: { profondita.circolo-bosco-interno: 1 }
        fallimento:
          titolo: La parola sbagliata
          testo: |
            Sbagli una sillaba, e la volpe ti guarda come uno straniero che urla
            prima di andarsene.
          effetti: { tormento: 1 }
      - testo: "Prendere il sentiero più largo"
        descrizione: "Senza guida si va per tentativi, e il sentiero largo è il più lungo."
        costo: 2
        esito:
          titolo: I rovi
          testo: |
            Il sentiero largo finisce in un roveto, e ne esci graffiato davanti
            alla volpe che ti aspetta.
          effetti: { profondita.circolo-bosco-interno: 1, ferite: 0.5 }

  # ------------------------------------------------------------ 0-1 · le bestie che misurano
  - id: circolo-bosco-le-bestie-misurano
    immagine: fazioni/circolo-di-velthar
    titolo: Le bestie che misurano
    sommario: "Un cervo e due cornacchie ti sbarrano il sentiero e ti guardano le mani."
    luogo: Il Bosco interno, una radura di felci
    area: circolo-bosco-interno
    ripetibile: true
    requisiti: [profondita.circolo-bosco-interno <= 1]
    testo: |
      In una radura di felci alte fino alla vita un cervo con le corna di velluto sta fermo proprio sul sentiero. Su un ramo basso due
      cornacchie smettono di passarsi un pezzo di corteccia quando entri, e tutte le bestie ti guardano le mani, poi la cintura.

      {armi-da-mischia Facile} Hai una lama alla cintura, e il cervo la guarda come guarderebbe un lupo.
    opzioni:
      - testo: "Restare fermo e lasciarti misurare"
        descrizione: "Le bestie del Bosco misurano chi passa, e guardano la cintura."
        prova: { attributo: mentale, abilita: [resilienza, natura], difficolta: Media }
        successo:
          titolo: Il cervo si sposta
          testo: |
            Resti fermo a mani aperte finché il cervo torna a brucare e ti lascia
            passare.
          effetti: { profondita.circolo-bosco-interno: 1 }
        fallimento:
          titolo: Il grido
          testo: |
            Ti gratti il naso con la mano vicino all'elsa, e il cervo sparisce
            nelle felci con il sentiero.
          effetti: { tormento: 1 }
      - testo: "Parlare al cervo"
        descrizione: "Un cervo che non scappa ha voglia di essere convinto."
        prova: { attributo: sociale, abilita: addestrare-animali, difficolta: Media }
        successo:
          titolo: Il velluto
          testo: |
            Gli parli piano di cose che non contano finché ti lascia il sentiero, e
            una cornacchia ti regala la corteccia.
          pe: { addestrare-animali: 2 }
          effetti: { profondita.circolo-bosco-interno: 1 }
        fallimento:
          titolo: La voce troppo alta
          testo: |
            La voce ti esce troppo alta, e il cervo batte lo zoccolo finché non
            arretri.
          effetti: { tormento: 1 }
      - testo: "Girare largo fra le felci"
        descrizione: "Le felci sono fitte e nascondono buche."
        costo: 2
        esito:
          titolo: Le buche
          testo: |
            Sprofondi in una buca fino al ginocchio e arrivi dall'altra parte con
            la caviglia che pulsa.
          effetti: { profondita.circolo-bosco-interno: 1, ferite: 0.5 }

  # ------------------------------------------------------------ 1 · i sentieri che cambiano
  - id: circolo-bosco-il-sentiero-che-si-chiude
    immagine: fazioni/circolo-di-velthar
    titolo: Il sentiero che si chiude
    sommario: "Dietro di te il sentiero non c'è più, e davanti ce n'è uno nuovo che somiglia molto a quello di prima."
    luogo: Il Bosco interno, i sentieri che cambiano
    area: circolo-bosco-interno
    ripetibile: true
    requisiti: [profondita.circolo-bosco-interno == 1]
    testo: |
      Ti volti a controllare la strada fatta, e al suo posto ci sono due
      tronchi coperti d'edera che non hai mai visto. Davanti il sentiero
      continua uguale, con le radici che affiorano come i gradini di una
      scala distesa.

      {percezione Media} Il muschio sui tronchi cresce più fitto da una
      parte sola, perché il nord, almeno lui, è rimasto dov'era.
    opzioni:
      - testo: "Leggere il muschio e andare a sud"
        descrizione: "Il sentiero cambia, mentre il muschio indica sempre il nord."
        prova: { attributo: mentale, abilita: [percezione, natura], difficolta: Media }
        successo:
          titolo: Il muschio
          testo: |
            Conti il muschio con una mano sui tronchi, e lasci che il sentiero giri verso ovest da solo.
          effetti: { profondita.circolo-bosco-interno: 1 }
        fallimento:
          titolo: Il cerchio
          testo: |
            Dopo un'ora ripassi davanti ai due tronchi con l'edera, alla fine di
            un cerchio perfetto.
          effetti: { tormento: 1 }
      - testo: "Andare avanti senza voltarti"
        descrizione: "I druidi lo insegnano ai novizi, perché voltarsi cambia il sentiero."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Media }
        successo:
          titolo: Gli occhi avanti
          testo: |
            Conti i passi come una cantilena, e quando smetti sei più a sud di
            quanto avresti detto.
          effetti: { profondita.circolo-bosco-interno: 1 }
        fallimento:
          titolo: Ti volti
          testo: |
            Al centesimo passo ti volti, e il sentiero finisce contro una parete
            d'edera da tutte e due le parti.
          effetti: { tormento: 1 }
      - testo: "Aprirti la strada fra l'edera"
        descrizione: "Dove il Bosco chiude un sentiero si passa di traverso, e il Bosco se lo ricorda."
        costo: 2
        esito:
          titolo: L'edera
          testo: |
            Strappi l'edera tralcio per tralcio fino al sentiero giusto, con le
            braccia graffiate che bruciano fino a sera.
          effetti: { profondita.circolo-bosco-interno: 1, ferite: 0.5 }

  - id: circolo-bosco-la-sacca-di-marea
    immagine: ambientazione/marea-grigia
    titolo: La sacca di Marea
    sommario: "In una conca le felci sono diventate grigie, e sul fondo ristagna una nebbia bassa che le piante stanno bevendo."
    luogo: Il Bosco interno, una conca di felci grigie
    area: circolo-bosco-interno
    ripetibile: true
    requisiti: [profondita.circolo-bosco-interno == 1]
    testo: |
      Il sentiero scende in una conca di felci color cenere. Sul fondo
      ristagna una nebbia lattiginosa, ferma come acqua in una pozza, che
      arriva alla cintura dove passa il sentiero, e le radici degli alberi
      ci affondano dentro.

      {natura Media} Le piante la stanno bevendo, ed è il lavoro che il
      Circolo insegna ai novizi, aiutare il Bosco a mandar giù la Marea un
      sorso alla volta.
    opzioni:
      - testo: "Aiutare le piante a bere"
        descrizione: "Piantare le felci sane del bordo intorno alle radici, con la nebbia intorno."
        prova: { attributo: mentale, abilita: natura, difficolta: Difficile }
        successo:
          titolo: Un sorso alla volta
          testo: |
            Pianti le felci intorno alle radici finché la nebbia scende alle
            caviglie, e passi con le unghie nere.
          pe: { natura: 5 }
          effetti: { profondita.circolo-bosco-interno: 1 }
        fallimento:
          titolo: Le mani grigie
          testo: |
            Pianti le felci troppo vicine, e la nebbia ti fa grigie le braccia
            fino al polso.
          effetti: { contaminazione: 1 }
      - testo: "Attraversare senza respirare"
        descrizione: "Trenta passi con la nebbia alla cintura, senza aprire la bocca."
        prova: { attributo: fisico, abilita: [resistenza, atletica], difficolta: Media }
        successo:
          titolo: Trenta passi
          testo: |
            Attraversi a passi lunghi con le braccia alzate, e dall'altra parte
            respiri come un pesce sulla riva.
          effetti: { profondita.circolo-bosco-interno: 1 }
        fallimento:
          titolo: Il ventesimo passo
          testo: |
            Al ventesimo passo il petto riprende fiato da solo nella nebbia, e
            torni indietro tossendo.
          effetti: { contaminazione: 1 }
      - testo: "Bere la Marea al posto delle piante"
        descrizione: "Il Respiro insegna alle mani quello che le piante fanno con le radici."
        incantesimo: bere-la-marea
        prova: { attributo: mentale, abilita: magia, difficolta: Media }
        successo:
          titolo: Il sorso
          testo: |
            Tiri su la nebbia piano, come l'acqua da un pozzo, e le felci
            rinverdiscono, ma un poco di grigio ti resta in gola.
          pe: { magia: 5 }
          effetti: { profondita.circolo-bosco-interno: 1, contaminazione: 1 }
        fallimento:
          titolo: Troppo in una volta
          testo: |
            Tiri troppo forte e la nebbia ti sale nelle braccia fredda come neve,
            senza schiarire la conca.
          effetti: { contaminazione: 1.5 }
      - testo: "Girare largo intorno alla conca"
        descrizione: "Sui bordi la nebbia è più bassa, e il terreno frana."
        costo: 2
        esito:
          titolo: Il bordo che frana
          testo: |
            Il bordo ti frana sotto i piedi, e scivoli fra le felci grigie con la
            bocca piena del loro odore di ferro.
          effetti: { profondita.circolo-bosco-interno: 1, contaminazione: 1 }

  - id: circolo-bosco-il-ruscello-di-linfa
    immagine: fazioni/circolo-di-velthar
    titolo: Il ruscello di linfa
    sommario: "Fra le radici scorre un ruscello di linfa che fa luce verde, e l'unico guado è un tronco coperto di muschio."
    luogo: Il Bosco interno, il ruscello di linfa
    area: circolo-bosco-interno
    ripetibile: true
    requisiti: [profondita.circolo-bosco-interno >= 1, profondita.circolo-bosco-interno <= 2]
    testo: |
      Fra le radici di due querce scorre un ruscello di linfa largo quattro passi, denso come miele, che manda una luce verdina sulle cortecce.
      L'unico ponte è un tronco caduto coperto di muschio bagnato.

      {medicina Media} I guaritori della città la pagano bene, questa luce, perché sulle bende chiude le ferite più ostinate.
    opzioni:
      - testo: "Passare sul tronco"
        descrizione: "Il muschio è bagnato e il tronco gira un poco."
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Media }
        successo:
          titolo: Sul tronco
          testo: |
            Passi con le braccia larghe, e quando il tronco gira di un dito giri
            con lui.
          effetti: { profondita.circolo-bosco-interno: 1 }
        fallimento:
          titolo: Nella linfa
          testo: |
            Il tronco gira e finisci nella linfa fino al petto, e per tutto il giorno le lucciole ti seguono.
          effetti: { ferite: 0.5 }
      - testo: "Raccogliere la linfa e guadare dove è bassa"
        descrizione: "Una fiala di linfa vale qualche moneta in città, e più a valle si guada."
        prova: { attributo: mentale, abilita: [natura, medicina], difficolta: Media }
        successo:
          titolo: La fiala
          testo: |
            Riempi una fiala dove la linfa è più chiara e guadi a valle, con gli
            stivali che diventano verdi e tiepidi.
          effetti: { profondita.circolo-bosco-interno: 1, circolo.linfa: 1 }
        fallimento:
          titolo: La fiala rotta
          testo: |
            La fiala ti scivola dalle dita appiccicose e si rompe, e raccogliendo
            i cocci ti tagli il palmo.
          effetti: { ferite: 0.5 }
      - testo: "Guadare dove capita"
        descrizione: "La linfa è densa dappertutto, e profonda solo in certi punti."
        costo: 2
        esito:
          titolo: Il guado
          testo: |
            Attraversi la linfa come si cammina nel miele, e ne esci con i
            polpacci che tremano.
          effetti: { profondita.circolo-bosco-interno: 1, ferite: 0.5 }

  # ------------------------------------------------------------ 2 · le rovine sotto le radici
  - id: circolo-bosco-il-muro-nel-tronco
    immagine: ambientazione/rovine-dei-precursori
    titolo: Il muro nel tronco
    sommario: "Un albero enorme è cresciuto attorno a un muro dei Precursori, e il metallo spunta dalla corteccia come un osso."
    luogo: Il Bosco interno, le rovine sotto le radici
    area: circolo-bosco-interno
    ripetibile: true
    requisiti: [profondita.circolo-bosco-interno == 2]
    testo: |
      Su una collinetta una quercia enorme è cresciuta attorno a un muro di
      metallo grigio e liscio, alto il doppio di te, con incisioni fini che
      continuano dentro il legno. Il sentiero passa per una fessura larga
      quanto una spalla fra il metallo e la corteccia, da cui arriva un'aria
      più fredda.

      {tecnologia Media} Il metallo non ha ruggine né giunture. È lo stesso
      dei reperti di Oda Krell, ma qui ce n'è un muro intero.
    opzioni:
      - testo: "Leggere le incisioni"
        descrizione: "Le incisioni dei Precursori a volte sono indicazioni, a volte avvisi."
        prova: { attributo: mentale, abilita: [tecnologia, accademiche], difficolta: Media }
        successo:
          titolo: Le linee che scendono
          testo: |
            Le incisioni scendono tutte verso un punto sotto le radici, e ai piedi
            del muro raccogli una scheggia di metallo.
          pe: { tecnologia: 2 }
          effetti: { profondita.circolo-bosco-interno: 1, reliquie.scheggia: 1 }
        fallimento:
          titolo: Il freddo del metallo
          testo: |
            Le incisioni ti intorpidiscono la mano, e te la scaldi sotto l'ascella
            imprecando a bassa voce.
          effetti: { tormento: 1 }
      - testo: "Passare dalla fessura"
        descrizione: "Larga quanto una spalla, da passare di fianco e senza fretta."
        prova: { attributo: fisico, abilita: [acrobazia, furtivita], difficolta: Media }
        successo:
          titolo: Di fianco
          testo: |
            Avanzi di fianco un palmo alla volta, e dall'altra parte il Bosco è
            più buio e più vecchio.
          effetti: { profondita.circolo-bosco-interno: 1 }
        fallimento:
          titolo: Incastrato
          testo: |
            A metà fessura il petto si incastra, e ti liberi soffiando fuori tutta
            l'aria.
          effetti: { ferite: 0.5 }
      - testo: "Arrampicarti sopra il muro"
        descrizione: "La corteccia ha più appigli del muro, se hai tempo."
        costo: 2
        esito:
          titolo: In cima
          testo: |
            Scavalchi il muro dove il legno l'ha coperto, sbucciandoti le mani su
            una cresta di metallo.
          effetti: { profondita.circolo-bosco-interno: 1, ferite: 0.5 }

  - id: circolo-bosco-i-cristalli-nel-legno
    immagine: ambientazione/cristalli-conduttori
    titolo: I cristalli nel legno
    sommario: "Le radici di un faggio hanno inghiottito una fila di cristalli esausti, e li hanno spenti del tutto."
    luogo: Il Bosco interno, le rovine sotto le radici
    area: circolo-bosco-interno
    ripetibile: true
    requisiti: [profondita.circolo-bosco-interno == 2]
    testo: |
      Il sentiero passa sotto le radici di un faggio caduto, alte come due uomini, dove il legno ha avvolto come semi una fila di
      cristalli conduttori diventati opachi. Fra le radici si apre un passaggio basso e buio che puzza di terra smossa.

      {origine allievo-di-torvessa} All'Accademia un cristallo esausto lo buttano via, e qui il Bosco ci ha fatto crescere dentro un
      albero.
    opzioni:
      - testo: "Sentire quale cristallo ha ancora qualcosa"
        descrizione: "Forse uno su dieci ha ancora qualcosa, da sentire con il Mana."
        prova: { attributo: mentale, abilita: magia, difficolta: Media }
        successo:
          titolo: Il battito lento
          testo: |
            Al settimo cristallo senti un battito lontano, e lo stacchi con la punta del coltello.
          effetti: { profondita.circolo-bosco-interno: 1, cristalli.frammento-esausto: 2 }
        fallimento:
          titolo: Il cristallo sbagliato
          testo: |
            Il cristallo che stacchi è vuoto come gli altri, e dal buco cola la linfa scura del faggio.
          effetti: { tormento: 1 }
      - testo: "Strisciare nel passaggio fra le radici"
        descrizione: "Le radici trattengono la terra del passaggio finché non le tocchi."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Media }
        successo:
          titolo: La terra smossa
          testo: |
            Strisci sui gomiti nel buio fino a una conca dove il Bosco è più
            fitto.
          effetti: { profondita.circolo-bosco-interno: 1 }
        fallimento:
          titolo: La frana
          testo: |
            Tocchi una radice con la spalla, e torni indietro sputando la terra
            che ti è caduta addosso.
          effetti: { ferite: 0.5 }
      - testo: "Scavalcare il muro di radici"
        descrizione: "Le radici reggono quasi tutte, per un'arrampicata lunga."
        costo: 2
        esito:
          titolo: Le radici che reggono
          testo: |
            Sali sulle radici come su una scala storta, e due volte una cede e ti
            lascia appeso.
          effetti: { profondita.circolo-bosco-interno: 1, ferite: 0.5 }

  - id: circolo-bosco-il-silente-addormentato
    immagine: fazioni/circolo-di-velthar
    titolo: Il Silente addormentato
    sommario: "Fra le radici di un tasso siede un uomo con gli occhi chiusi, e le radici gli sono cresciute sulle gambe."
    luogo: Il Bosco interno, il tasso dei Silenti
    area: circolo-bosco-interno
    ripetibile: true
    requisiti: [profondita.circolo-bosco-interno >= 2, profondita.circolo-bosco-interno <= 3]
    testo: |
      Ai piedi di un tasso vecchissimo c'è un uomo seduto a gambe incrociate con gli occhi chiusi, la tunica grigio-verde coperta di muschio e le
      radici salite sulle ginocchia. Il sentiero passa a un passo da lui, e sulla radice accanto c'è una ciotola con dell'acqua e una mela.

      {empatia Facile} Dorme soltanto in apparenza. Il resto di lui sta altrove, e il corpo l'ha lasciato qui ad aspettarlo.
    opzioni:
      - testo: "Passare senza fare rumore"
        descrizione: "Un Silente che si sveglia di colpo sveglia anche il Bosco."
        prova: { attributo: fisico, abilita: furtivita, difficolta: Media }
        successo:
          titolo: In punta di piedi
          testo: |
            Passi senza spezzare un rametto, e alle tue spalle senti un sospiro
            più lungo degli altri.
          effetti: { profondita.circolo-bosco-interno: 1 }
        fallimento:
          titolo: Il rametto
          testo: |
            Un rametto si spezza, il Silente apre gli occhi e il sentiero davanti si chiude come una porta.
          effetti: { tormento: 1.5 }
      - testo: "Lasciare qualcosa nella ciotola"
        descrizione: "Al Circolo chi passa davanti a un Silente lascia una piccola offerta."
        prova: { attributo: sociale, abilita: [empatia, galateo], difficolta: Media }
        successo:
          titolo: L'offerta
          testo: |
            Lasci un pezzo di pane accanto alla mela, e le radici del tasso ti fanno largo.
          effetti: { profondita.circolo-bosco-interno: 1 }
        fallimento:
          titolo: L'offerta sbagliata
          testo: |
            Lasci della carne secca, che ai Silenti non si offre, e il tasso ti fa
            cadere un ramo accanto alla testa.
          effetti: { tormento: 1 }
      - testo: "Salutarlo senza voce"
        descrizione: "I Silenti ti hanno insegnato a parlare senza muovere la bocca."
        quando: [circolo.sussurro >= 1]
        esito:
          titolo: Il saluto
          testo: |
            Lo saluti dentro la testa, e ti risponde una parola calda che somiglia
            a un nome di pianta.
          effetti: { profondita.circolo-bosco-interno: 1 }
      - testo: "Fare un lungo giro intorno al tasso"
        descrizione: "Lontano dal Silente il Bosco è più fitto."
        costo: 2
        esito:
          titolo: Il giro lungo
          testo: |
            Giri a cento passi dal tasso fra i rovi, con addosso uno sguardo che
            non trovi mai.
          effetti: { profondita.circolo-bosco-interno: 1, tormento: 1 }

  # ------------------------------------------------------------ 3-4 · il boschetto grigio
  - id: circolo-bosco-le-cortecce-cenere
    immagine: ambientazione/marea-grigia
    titolo: Le cortecce color cenere
    sommario: "Gli alberi del boschetto grigio respirano a scatti, e dalle crepe della corteccia esce una nebbia che sembra latte."
    luogo: Il Bosco interno, il boschetto grigio
    area: circolo-bosco-interno
    ripetibile: true
    requisiti: [profondita.circolo-bosco-interno >= 3]
    testo: |
      Qui gli alberi hanno la corteccia color cenere e le foglie grigie come stracci. Le venature si accendono tutte insieme a scatti, e
      a ogni scatto dalle crepe esce uno sbuffo di nebbia lattiginosa che resta sospesa fra i tronchi.

      {natura Difficile} Gli scatti vengono da sotto. Gli alberi rigettano la nebbia come un cane che ha mangiato l'erba sbagliata.
    opzioni:
      - testo: "Attraversare con un panno bagnato sulla bocca"
        descrizione: "La stoffa bagnata ferma quasi tutta la nebbia."
        prova: { attributo: mentale, abilita: [medicina, natura], difficolta: Media }
        successo:
          titolo: Il panno
          testo: |
            Attraversi con un lembo di camicia bagnato su bocca e naso, che
            diventa grigio al posto tuo.
          effetti: { profondita.circolo-bosco-interno: 1 }
        fallimento:
          titolo: Il panno asciutto
          testo: |
            Il panno si asciuga a metà strada, e tossisci per un'ora.
          effetti: { contaminazione: 1 }
      - testo: "Correre fra uno sbuffo e l'altro"
        descrizione: "Fra due scatti l'aria è quasi pulita, per qualche passo."
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Media }
        successo:
          titolo: Fra due sbuffi
          testo: |
            Conti fino a sei dopo ogni scatto e corri fino a un tronco, cinque
            volte, fino all'altra parte.
          effetti: { profondita.circolo-bosco-interno: 1 }
        fallimento:
          titolo: Il conto sbagliato
          testo: |
            Al terzo scatto sbagli il conto e respiri latte freddo.
          effetti: { contaminazione: 1 }
      - testo: "Attraversare e basta"
        descrizione: "Il boschetto è piccolo, anche se la nebbia si attacca ai polmoni."
        costo: 2
        esito:
          titolo: Dritto in mezzo
          testo: |
            Attraversi con la manica sulla bocca, e dall'altra parte la gola ti sa
            di ferro.
          effetti: { profondita.circolo-bosco-interno: 1, contaminazione: 1.5 }

  - id: circolo-bosco-le-spore
    immagine: ambientazione/marea-grigia
    titolo: Le spore della linfa nera
    sommario: "Da una corteccia spaccata cola una linfa nera, e dalla linfa si alza una nuvola di spore che ti viene incontro."
    luogo: Il Bosco interno, il boschetto grigio
    area: circolo-bosco-interno
    ripetibile: true
    requisiti: [profondita.circolo-bosco-interno >= 3]
    testo: |
      Da un tronco spaccato per il lungo cola una linfa nera come pece,
      coperta da migliaia di funghi grigi che tremano insieme quando ti
      avvicini. Poi si apre una nuvola di spore densa come fumo di pipa, che
      ti viene incontro contro vento.

      {medicina Media} Le spore cercano la bocca e gli occhi, dove la pelle
      è sottile, e quello che portano dentro non va via con l'acqua.
    opzioni:
      - testo: "Disperderle a colpi"
        descrizione: "Una nuvola si sparpaglia se la colpisci prima che si posi."
        combattimento: circolo-le-spore
        vittoria:
          titolo: La nuvola sparpagliata
          testo: |
            Colpisci la nuvola finché si sfilaccia nel vento, e ti spazzoli via la
            polvere grigia.
          effetti: { profondita.circolo-bosco-interno: 1, contaminazione: 1 }
        sconfitta:
          titolo: Nella nuvola
          testo: |
            Le spore ti si posano sulla faccia, e torni indietro a tastoni dietro
            un velo grigio.
          effetti: { contaminazione: 1.5 }
      - testo: "Scappare controvento"
        descrizione: "Le spore vanno dove va il vento."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Media }
        successo:
          titolo: Controvento
          testo: |
            Corri dalla parte fredda finché la nuvola si ferma, come un cane alla
            fine della catena.
          effetti: { profondita.circolo-bosco-interno: 1 }
        fallimento:
          titolo: Il vento gira
          testo: |
            A metà strada il vento gira, e la nuvola ti si posa addosso come
            farina.
          effetti: { contaminazione: 1.5 }
      - testo: "Aspettare che si posino"
        descrizione: "Le spore prima o poi cadono, e la pazienza costa meno delle ferite."
        costo: 2
        esito:
          titolo: L'attesa
          testo: |
            Aspetti tutto il pomeriggio, con la manica sulla bocca, che la nuvola
            si posi sulla linfa.
          effetti: { profondita.circolo-bosco-interno: 1, contaminazione: 1 }

  - id: circolo-bosco-i-lupi-grigi
    immagine: icone/wolf-head
    titolo: I lupi grigi
    sommario: "Due lupi grigi con le gengive di metallo ti tagliano la strada senza ringhiare."
    luogo: Il Bosco interno, il boschetto grigio
    area: circolo-bosco-interno
    ripetibile: true
    requisiti: [profondita.circolo-bosco-interno >= 3]
    testo: |
      Li senti prima di vederli, perché respirano a scatti come gli alberi. Escono dalla nebbia ai due lati del sentiero con
      il pelo rigido come fil di ferro, e quando aprono la bocca le gengive sono di metallo lucido.

      {armi-da-distanza Media} Quello di sinistra zoppica appena sulla zampa davanti, e se attacca lo fa per secondo, da
      quella parte.
    opzioni:
      - testo: "Affrontarli"
        descrizione: "Due lupi grigi che si muovono in silenzio e mordono basso."
        combattimento: circolo-lupi-grigi
        vittoria:
          titolo: Le pelli grigie
          testo: |
            L'ultimo lupo cade in silenzio, e sotto la pelle che stacchi la carne
            è grigia fino all'osso.
          effetti: { profondita.circolo-bosco-interno: 1, circolo.pelle-grigia: 1 }
        sconfitta:
          titolo: I morsi bassi
          testo: |
            I lupi ti mordono ai polpacci finché non cadi, poi se ne vanno come
            dopo un lavoro finito.
      - testo: "Mandarli via con Richiamo"
        descrizione: "Le orecchie sono ancora di lupo, e la lingua giusta le raggiunge."
        incantesimo: richiamo
        prova: { attributo: mentale, abilita: magia, difficolta: Media }
        successo:
          titolo: Le orecchie
          testo: |
            Al Richiamo i lupi girano le orecchie verso di te, poi se ne vanno
            nella nebbia voltandosi.
          pe: { addestrare-animali: 2 }
          effetti: { profondita.circolo-bosco-interno: 1 }
        fallimento:
          titolo: Le parole che non arrivano
          testo: |
            Le parole si fermano alle orecchie, e il lupo di destra ti salta alla
            gamba.
          effetti: { ferite: 1 }
      - testo: "Fissarli finché non cedono"
        descrizione: "Un branco senza il suo capo è incerto, e si può piegare."
        prova: { attributo: sociale, abilita: [intimidire, addestrare-animali], difficolta: Media }
        successo:
          titolo: Lo sguardo
          testo: |
            Li fissi uno dopo l'altro finché il lupo zoppo abbassa gli occhi e l'altro lo segue.
          effetti: { profondita.circolo-bosco-interno: 1 }
        fallimento:
          titolo: Il primo a cedere
          testo: |
            Abbassi gli occhi per primo, e i lupi ti spingono indietro fino agli
            alberi verdi.
          effetti: { ferite: 0.5, tormento: 1 }
      - testo: "Fare un giro largo"
        descrizione: "I lupi grigi restano sul sentiero, e intorno c'è la nebbia."
        costo: 2
        esito:
          titolo: Fuori dal sentiero
          testo: |
            I lupi ti guardano andare senza seguirti, e alla fine del giro la gola ti raschia.
          effetti: { profondita.circolo-bosco-interno: 1, contaminazione: 1 }

  # ------------------------------------------------------------ il cuore · il capobranco (passo 4)
  - id: circolo-bosco-il-capobranco
    immagine: icone/wolf-howl
    titolo: Il cuore del boschetto grigio
    sommario: "Al centro del grigio le radici entrano in un muro dei Precursori, e davanti al muro ti aspetta il capobranco."
    luogo: Il Bosco interno, il cuore del boschetto grigio
    area: circolo-bosco-interno
    requisiti: [profondita.circolo-bosco-interno >= 5, fazione.circolo == 3]
    testo: |
      Al centro del boschetto il terreno sprofonda in una conca larga come una piazza, e sul fondo le radici di tutti gli alberi intorno si infilano in un muro di metallo che affiora come la chiglia di una nave. Dalle giunture
      sale a sbuffi una nebbia lattiginosa, e le venature dei tronchi si accendono insieme a lei.

      Davanti al muro, sdraiato sulla terra nuda, c'è il capobranco, un lupo grande come un vitello con la schiena coperta di placche lucide. Quando ti vede si alza senza fretta, e dalla nebbia escono altri due lupi che si
      siedono dietro di lui. I fianchi gli si gonfiano a scatti insieme al muro, e il branco gli va dietro.

      {natura Media} Il grigio sale dal muro e dalle radici, da sotto, come il grigio nel cuore dei tronchi della Segheria.

      {addestrare-animali Difficile} Il capobranco respira a scatti perché gli fa male. Se lo porti fuori dal ritmo del muro, forse torna a essere un lupo.

      *Tharn mi ha lasciato al margine del grigio, e adesso tocca a me.* Ti asciughi le mani sui calzoni, e sudano lo stesso.
    opzioni:
      - testo: "Abbattere il capobranco"
        descrizione: "Un lupo grande come un vitello, e il branco si sparpaglia se cade il capo."
        combattimento: circolo-il-capobranco-grigio
        vittoria:
          titolo: Il branco si sparpaglia
          testo: |
            Il capobranco cade sulle zampe davanti, come un cavallo che si
            inginocchia, e gli sbuffi del muro si fermano con lui mentre il branco
            scappa nella nebbia. La nebbia sale da sotto, dalle radici. Al margine
            Tharn ti aspetta, e quando gli racconti del muro decide di portarti da
            Serha.
          pe: { natura: 5 }
          effetti: { fazione.circolo: 1, rep.circolo: 1, circolo.pelle-grigia: 2 }
          vai: superficie-fratturata
        sconfitta:
          titolo: Il morso alla spalla
          testo: |
            Il capobranco ti trascina per la spalla sulla terra nuda e poi ti
            lascia andare, e Tharn ti porta fuori dal Bosco sulle spalle.
          effetti: { tormento: 1 }
          vai: superficie-fratturata
      - testo: "Portarlo fuori dal grigio con la voce"
        descrizione: "Con la voce giusta il capobranco potrebbe seguire te invece del muro."
        prova: { attributo: sociale, abilita: addestrare-animali, difficolta: Difficile }
        successo:
          titolo: Il respiro di un lupo
          testo: |
            Ti siedi sulla terra nuda e soffi lento, a voce, come con un cavallo
            spaventato, finché il capobranco perde il ritmo del muro e respira con
            te. Lo porti fuori dalla conca camminando all'indietro, e al margine
            Tharn si mette a ridere piano con le mani sulla faccia. Del muro e
            delle radici parlerai con Serha.
          pe: { addestrare-animali: 10 }
          effetti: { fazione.circolo: 1, rep.circolo: 1 }
          imposta: { circolo.capobranco: 1 }
          vai: superficie-fratturata
        fallimento:
          titolo: Il ritmo del muro
          testo: |
            Il muro sbuffa più forte e il capobranco ti carica, e risali la conca
            carponi con una zampata sul fianco.
          effetti: { ferite: 1.5 }
          vai: superficie-fratturata
      - testo: "Portarlo fuori dal grigio con Richiamo"
        descrizione: "La lingua dei bambini del Circolo arriva anche a un lupo che sta male."
        incantesimo: richiamo
        prova: { attributo: mentale, abilita: magia, difficolta: Difficile }
        successo:
          titolo: Il nome del lupo
          testo: |
            Dici il Richiamo una sillaba per ogni sbuffo del muro, finché il
            capobranco smette di sbuffare e ti guarda. Lo porti fuori dalla conca
            camminando all'indietro, e al margine Tharn si mette a ridere piano
            con le mani sulla faccia. Del muro e delle radici parlerai con Serha.
          pe: { magia: 5, addestrare-animali: 5 }
          effetti: { fazione.circolo: 1, rep.circolo: 1 }
          imposta: { circolo.capobranco: 1 }
          vai: superficie-fratturata
        fallimento:
          titolo: Il ritmo del muro
          testo: |
            Uno sbuffo del muro copre il Richiamo, e risali la conca carponi con
            una zampata sul fianco.
          effetti: { ferite: 1.5 }
          vai: superficie-fratturata
      - testo: "Tornare indietro"
        descrizione: "Il capobranco non ti segue fuori dalla conca."
        costo: 0
        esito:
          titolo: Fuori dal grigio
          testo: |
            Risali la conca all'indietro mentre il capobranco torna a sdraiarsi, e
            al margine Tharn non ti chiede niente.
          vai: superficie-fratturata

  # ------------------------------------------------------------ il cuore · il giro delle sentinelle (dopo il passo 4)
  - id: circolo-bosco-le-sentinelle
    immagine: icone/wolf-head
    titolo: Il giro delle sentinelle
    sommario: "Davanti al muro nel cuore del grigio il branco torna sempre, e qualcuno deve fare il giro e mandarlo via."
    luogo: Il Bosco interno, il cuore del boschetto grigio
    area: circolo-bosco-interno
    requisiti: [profondita.circolo-bosco-interno >= 5, fazione.circolo >= 4]
    testo: |
      La conca è come l'hai lasciata, con le radici nel muro e la nebbia che
      sale dalle giunture. Dove dormiva il capobranco fanno la guardia tre
      lupi grigi giovani e magri, che si alzano insieme quando entri. Sul
      muro qualcuno ha appoggiato una fila di fiale vuote per la linfa che
      cola dalle radici, perché il giro delle sentinelle lo fa chi scende.
    opzioni:
      - testo: "Scacciare le sentinelle"
        descrizione: "Tre lupi giovani, e alle radici la linfa di mesi."
        quando: [circolo.sentinelle == 0]
        combattimento: circolo-le-sentinelle-grigie
        vittoria:
          titolo: Il primo giro
          testo: |
            I lupi scappano, e la linfa raccolta per mesi riempie tutte le fiale.
            La sera Tharn ti dice che il giro l'hai fatto da druido.
          pe: { natura: 5 }
          effetti: { circolo.linfa: 3, circolo.pelle-grigia: 2, rep.circolo: 0.5 }
          imposta: { circolo.sentinelle: 1 }
          vai: superficie-fratturata
        sconfitta:
          titolo: I giovani
          testo: |
            I lupi giovani sono più svelti del loro capo, e ti mordono finché non
            lasci la conca.
          vai: superficie-fratturata
      - testo: "Scacciare le sentinelle"
        descrizione: "Tre lupi giovani come ogni volta, e un poco di linfa."
        quando: [circolo.sentinelle >= 1]
        combattimento: circolo-le-sentinelle-grigie
        vittoria:
          titolo: Il giro
          testo: |
            I lupi scappano come ogni volta, e riempi le fiale con la poca linfa
            delle radici.
          effetti: { circolo.linfa: 1, circolo.pelle-grigia: 1 }
          vai: superficie-fratturata
        sconfitta:
          titolo: I giovani
          testo: |
            I lupi giovani sono più svelti del loro capo, e ti mordono finché non
            lasci la conca.
          vai: superficie-fratturata
      - testo: "Mandarli via con Richiamo"
        descrizione: "I lupi giovani ascoltano più volentieri dei vecchi."
        incantesimo: richiamo
        prova: { attributo: mentale, abilita: magia, difficolta: Media }
        successo:
          titolo: La conca vuota
          testo: |
            Al Richiamo i tre lupi se ne vanno in fila nella nebbia, e raccogli la
            linfa con calma.
          pe: { magia: 2 }
          effetti: { circolo.linfa: 1 }
          vai: superficie-fratturata
        fallimento:
          titolo: I denti
          testo: |
            Il Richiamo arriva a due lupi su tre, e il terzo ti salta addosso.
          effetti: { ferite: 1 }
          vai: superficie-fratturata
      - testo: "Tornare indietro"
        descrizione: "Il giro lo farà qualcun altro, stavolta."
        costo: 0
        esito:
          titolo: Un'altra volta
          testo: |
            Risali la conca senza voltarti, e i lupi tornano a sdraiarsi davanti
            al muro.
          vai: superficie-fratturata
