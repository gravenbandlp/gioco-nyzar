# Il Bosco interno, spedizione della quest del Circolo di Velthar (dal passo 4, poi ripetibile).
# Ci si entra dal Bosco di Velthar (luogo circolo-bosco-di-velthar della Superficie): la prima volta con la scena del
# passo 4 (passi-1.yaml, circolo-il-boschetto-grigio), poi con `circolo-bosco-entrare`. La cavalcatura toglie il
# rintocco dell'ingresso. La ritirata riporta alla Superficie Fratturata.
# Le stanze vanno in fasce di profondità, e una stanza superata non ricompare nella stessa visita:
# 0 il margine (la volpe; le bestie che misurano le lame, che vale anche a 1),
# 1 i sentieri che cambiano (il sentiero che si chiude; la sacca di Marea; il ruscello di linfa, che vale anche a 2),
# 2 le rovine sotto le radici (il muro nel tronco; i cristalli nel legno; il Silente addormentato, che vale anche a 3),
# 3-4 il boschetto grigio (le cortecce color cenere, le spore, i lupi grigi).
# Il cuore a 5 ha due versioni: il capobranco grigio (fazione.circolo == 3, porta a 4) e, dopo, il giro delle
# sentinelle (fazione.circolo >= 4), che si rifà e la prima volta rende di più (circolo.sentinelle).
# Ogni stanza ha una via senza prova che costa due rintocchi e un poco di Ferite, Tormento o Contaminazione.
aree:
  - id: circolo-bosco-interno
    immagine: fazioni/circolo-di-velthar
    nome: Il Bosco interno
    sommario: "I sentieri del Bosco di Velthar che cambiano di stagione in stagione, le rovine sotto le radici e, a sud, il boschetto grigio."
    spedizione: { ritorno: superficie-fratturata, soglia: 5, stanze: 3 }
    testo: |
      Oltre il margine il Bosco di Velthar si chiude sopra la testa, e la luce arriva verde e a chiazze. Il
      terreno è morbido di foglie marce stratificate per anni e cede sotto i piedi senza rumore. Le tue orme
      si riempiono di un'acqua scura, e dopo pochi passi non le ritrovi più.

      I sentieri ci sono, e cambiano. Quello che prendi entrando non è quello che troverai uscendo, e i druidi
      lo dicono con la calma con cui in città si parla della pioggia. Più a sud il verde si fa grigio a
      chiazze, e l'aria sa di ferro bagnato.

storylet:
  # ------------------------------------------------------------ l'ingresso, dopo il passo 4
  - id: circolo-bosco-entrare
    presso: circolo-bosco-di-velthar
    immagine: fazioni/circolo-di-velthar
    titolo: Il Bosco interno
    sommario: "Dalla spirale si scende verso i sentieri che cambiano, le rovine sotto le radici e il grigio a sud."
    luogo: Il Bosco di Velthar, il sentiero che scende dalla spirale
    area: superficie-fratturata
    ripetibile: true
    requisiti: [fazione.circolo >= 4]
    testo: |
      Dal bordo della spirale un sentiero scende fra due pietre coperte di muschio, e dopo dieci passi è già
      un altro sentiero. Per quei dieci passi la terra è battuta e liscia, e oltre non porta più un'orma.
      Sulla prima pietra un novizio offre una bacca a chi scende, senza alzare gli occhi dalla ciotola. La
      ciotola è di legno scavato, e il fondo è tinto di rosso da tutte le bacche che ci sono passate.

      {natura Facile} Le bacche di sorbo sono aspre da torcere la bocca, e al Circolo le mangiano perché
      tengono sveglia la testa nella nebbia.

      Dal fondo del sentiero sale un'aria più fresca di quella della spirale, con un filo di odore di ferro
      bagnato. Più giù il grigio è rimasto, e le sentinelle del branco tornano ogni volta che le scacci.
    opzioni:
      - testo: "Scendere nel Bosco interno"
        descrizione: "Un giorno di sentieri fino alle rovine, e più in fondo il grigio."
        esito:
          titolo: Il sentiero che scende
          testo: |
            Prendi una bacca dalla ciotola del novizio e la mastichi scendendo, con la smorfia che fanno
            tutti. Dopo cento passi la spirale alle tue spalle non si vede più, e il terreno è morbido di
            foglie marce e cede sotto i piedi senza rumore. Davanti il sentiero si piega da una parte che non
            avevi notato.
          vai: circolo-bosco-interno
      - testo: "Scendere a cavallo"
        descrizione: "In sella i primi sentieri passano in fretta. Il cavallo lo lascerai legato al margine del grigio."
        requisiti: [chiave.cavalcatura >= 1]
        costo: 0
        esito:
          titolo: In sella
          testo: |
            Il cavallo scende fra le pietre con il passo corto e le orecchie dritte, e i sentieri gli cambiano
            davanti più piano, quasi con riguardo. Due volte si ferma con uno zoccolo alzato e annusa il
            terreno prima di posarlo. Il novizio ti guarda passare e si tiene stretta la ciotola delle bacche.
          vai: circolo-bosco-interno

  # ------------------------------------------------------------ 0 · il margine
  - id: circolo-bosco-la-volpe
    immagine: fazioni/circolo-di-velthar
    titolo: La volpe sul sentiero
    sommario: "In mezzo al sentiero una volpe rossa ti aspetta seduta, e quando ti avvicini si alza e fa tre passi avanti."
    luogo: Il Bosco interno, i primi sentieri
    area: circolo-bosco-interno
    ripetibile: true
    requisiti: [profondita.circolo-bosco-interno == 0]
    testo: |
      Il sentiero passa fra due faggi con le cortecce saldate a metà altezza, e oltre la porta che fanno ti
      aspetta una volpe con un orecchio strappato. Dove i due tronchi si toccano non c'è cicatrice, e la
      venatura passa dall'uno all'altro senza interrompersi. La volpe è seduta in mezzo al sentiero, e quando
      fai un passo ne fa tre avanti e si volta a vedere se la segui.

      Dietro di lei il sentiero si divide in tre, e nessuno somiglia a quello che avevi in mente. Sulle foglie
      dei tre sentieri ci sono soltanto le orme della volpe, e arrivano da tutti e tre.
    opzioni:
      - testo: "Seguire la volpe"
        descrizione: "Le volpi del Bosco conoscono i sentieri di oggi."
        prova: { attributo: mentale, abilita: [natura, percezione], difficolta: Facile }
        successo:
          titolo: La coda rossa
          testo: |
            Le stai dietro a cinque passi, e quando sparisce fra le felci la ritrovi dalla punta della coda,
            che spunta rossa nel verde. Ti porta per un sentiero che scende piano e poi ti lascia, senza
            salutare, davanti a un ruscello che scorre senza rumore sopra sassi neri.
          effetti: { profondita.circolo-bosco-interno: 1 }
        fallimento:
          titolo: Le felci
          testo: |
            La perdi fra le felci al secondo giro, e quando ti rialzi dal fango il sentiero non è più quello
            di prima. Torni alla porta dei due faggi, dove la volpe è di nuovo seduta ad aspettarti con
            un'aria paziente che ti offende. Ha le zampe pulite, e nel fango intorno a lei non c'è
            un'impronta.
          effetti: { tormento: 1 }
      - testo: "Mostrarle il segno delle tre tacche"
        descrizione: "Le bestie del margine conoscono quel segno meglio dei druidi giovani."
        requisiti: [chiave.bosco >= 1]
        esito:
          titolo: Il segno
          testo: |
            Ti accucci e le mostri il dischetto di corteccia sul palmo, con le tre tacche verso di lei. La
            volpe ci passa sopra il naso e starnutisce. Poi si mette a trotterellare avanti senza più
            voltarsi.
          effetti: { profondita.circolo-bosco-interno: 1 }
      - testo: "Chiamarla con Richiamo"
        descrizione: "Una volpe che ha deciso di guidarti capisce meglio se le parli nella sua lingua."
        incantesimo: richiamo
        prova: { attributo: mentale, abilita: magia, difficolta: Facile }
        successo:
          titolo: Due passi davanti
          testo: |
            Al Richiamo la volpe torna indietro e ti cammina accanto, a due passi, con l'orecchio strappato
            girato verso di te. Dove il sentiero si divide si ferma con il muso alzato e poi riparte senza
            esitare. Il sentiero che sceglie è il più corto.
          pe: { addestrare-animali: 2 }
          effetti: { profondita.circolo-bosco-interno: 1 }
        fallimento:
          titolo: La parola sbagliata
          testo: |
            Sbagli una sillaba, e la volpe ti guarda come si guarda uno straniero che chiede la strada
            urlando. Se ne va per conto suo, e il sentiero si chiude dietro di lei in un fruscio di felci che
            si raddrizzano.
          effetti: { tormento: 1 }
      - testo: "Prendere il sentiero più largo"
        descrizione: "Senza guida si va per tentativi. Il sentiero largo è il più lungo, e il più pieno di rovi."
        costo: 2
        esito:
          titolo: I rovi
          testo: |
            Prendi il sentiero più largo, che dopo un tratto diventa stretto e poi diventa un roveto. Le spine
            sono lunghe un dito e non si piegano sotto la stoffa. Ne esci con le maniche a brandelli e i polsi
            graffiati, molto più avanti di dove volevi arrivare, e la volpe è seduta lì ad aspettarti.
          effetti: { profondita.circolo-bosco-interno: 1, ferite: 0.5 }

  # ------------------------------------------------------------ 0-1 · le bestie che misurano
  - id: circolo-bosco-le-bestie-misurano
    immagine: fazioni/circolo-di-velthar
    titolo: Le bestie che misurano
    sommario: "Un cervo e due cornacchie ti sbarrano il sentiero e ti guardano le mani."
    luogo: Il Bosco interno, una radura di felci
    area: circolo-bosco-interno
    ripetibile: true
    requisiti: [profondita.circolo-bosco-interno <= 1]
    testo: |
      La radura è piena di felci alte fino alla vita, e in mezzo un cervo con le corna di velluto non si
      sposta. Sotto le sue zampe le felci sono schiacciate in un cerchio largo e piatto, e quel cerchio dice
      che sta lì da molto. Su un ramo basso due cornacchie si passano un pezzo di corteccia e smettono quando
      entri. Tutti e tre ti guardano le mani e poi la cintura.

      Nella radura l'unico rumore è il cervo che mastica, e quando ti muovi anche le sue mascelle si fermano.
      Il sentiero passa dove sta il cervo, e le felci sono troppo fitte per girargli attorno in silenzio.
    opzioni:
      - testo: "Restare fermo e lasciarti misurare"
        descrizione: "Le bestie del Bosco misurano chi passa. Bisogna lasciarle fare, con le mani lontane dalla cintura."
        prova: { attributo: mentale, abilita: [resilienza, natura], difficolta: Media }
        successo:
          titolo: Il cervo si sposta
          testo: |
            Resti ferm{o|a} con le mani aperte lungo i fianchi finché il cervo non abbassa la testa a brucare.
            Le cornacchie riprendono il loro gioco con la corteccia. Passi accanto al cervo, e lui ti lascia
            passare annusandoti la manica con un fiato caldo che sa di erba masticata.
          effetti: { profondita.circolo-bosco-interno: 1 }
        fallimento:
          titolo: Il grido
          testo: |
            Ti prude il naso, alzi una mano per grattarti, e la mano passa vicino all'elsa. Le cornacchie
            gridano insieme e il cervo sparisce nelle felci. Dove stava lui adesso il sentiero non c'è più, e
            anche il cerchio di felci schiacciate si è raddrizzato.
          effetti: { tormento: 1 }
      - testo: "Parlare al cervo"
        descrizione: "Voce bassa, occhi bassi. Un cervo che non scappa ha voglia di essere convinto."
        prova: { attributo: sociale, abilita: addestrare-animali, difficolta: Media }
        successo:
          titolo: Il velluto
          testo: |
            Gli parli piano del tempo e delle felci, di cose che non contano. Il cervo muove le orecchie a
            ogni pausa, poi fa un passo di lato e ti lascia il sentiero. Quando passi, una cornacchia ti
            lascia cadere sulla spalla il pezzo di corteccia. Da una parte è liscio dove l'hanno consumato i
            becchi.
          pe: { addestrare-animali: 2 }
          effetti: { profondita.circolo-bosco-interno: 1 }
        fallimento:
          titolo: La voce troppo alta
          testo: |
            La voce ti esce più alta di come volevi, e il cervo batte uno zoccolo per terra. Lo batte ancora
            finché non arretri, e ogni colpo lo senti nelle piante dei piedi. Le cornacchie ridono, o fanno
            qualcosa che ci somiglia molto.
          effetti: { tormento: 1 }
      - testo: "Girare largo fra le felci"
        descrizione: "Le felci sono fitte e nascondono buche. Il cervo ti seguirà con gli occhi per tutto il tempo."
        costo: 2
        esito:
          titolo: Le buche
          testo: |
            Giri largo fra le felci, e al terzo passo il piede ti sprofonda in una buca fino al ginocchio. Il
            fondo è freddo e molle, e lo stivale ne esce con un risucchio. Ci metti un'ora ad arrivare
            dall'altra parte, con la caviglia che pulsa, e il cervo non ti ha perso di vista un momento.
          effetti: { profondita.circolo-bosco-interno: 1, ferite: 0.5 }

  # ------------------------------------------------------------ 1 · i sentieri che cambiano
  - id: circolo-bosco-il-sentiero-che-si-chiude
    immagine: fazioni/circolo-di-velthar
    titolo: Il sentiero che si chiude
    sommario: "Dietro di te il sentiero non c'è più. Davanti ce n'è uno nuovo, e somiglia molto a quello di prima."
    luogo: Il Bosco interno, i sentieri che cambiano
    area: circolo-bosco-interno
    ripetibile: true
    requisiti: [profondita.circolo-bosco-interno == 1]
    testo: |
      Ti volti a controllare la strada fatta, e la strada fatta non c'è. Al suo posto ci sono due tronchi
      coperti d'edera che non hai mai visto, e l'edera non sembra appena cresciuta. I suoi fusti sono spessi
      quanto un polso e hanno la corteccia secca e fessurata dei rampicanti di molti anni. Fra i due tronchi
      le foglie morte non portano un'orma. Davanti a te il sentiero continua uguale, con le radici che
      affiorano come i gradini di una scala distesa.

      {percezione Media} Il muschio sui tronchi cresce più fitto da una parte sola, e almeno il nord è rimasto
      dov'era. Lo controlli su cinque tronchi diversi e lo trovi sempre dalla stessa parte.
    opzioni:
      - testo: "Leggere il muschio e andare a sud"
        descrizione: "Il sentiero cambia, il muschio no. Il grigio sta a sud."
        prova: { attributo: mentale, abilita: [percezione, natura], difficolta: Media }
        successo:
          titolo: Il muschio
          testo: |
            Cammini con una mano sui tronchi per contare il muschio, e tieni il nord sulla schiena. Sotto il
            palmo il muschio è freddo e asciutto anche dove la luce non arriva. Il sentiero prova due volte a
            girarti verso ovest, e ogni volta lo lasci girare da solo.
          effetti: { profondita.circolo-bosco-interno: 1 }
        fallimento:
          titolo: Il cerchio
          testo: |
            Dopo un'ora ripassi davanti ai due tronchi con l'edera, e capisci di aver fatto un cerchio largo e
            perfetto. Sulle foglie davanti ai tronchi non trovi le orme che hai lasciato un'ora fa. Ti siedi
            su una radice a ricominciare il conto.
          effetti: { tormento: 1 }
      - testo: "Andare avanti senza voltarti"
        descrizione: "I druidi lo dicono ai novizi il primo giorno. Dietro il sentiero non è più lo stesso, e voltarsi lo cambia ancora."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Media }
        successo:
          titolo: Gli occhi avanti
          testo: |
            Tieni gli occhi sul sentiero e conti i passi, e i passi diventano una cantilena che ti tiene
            compagnia. Smetti di contare a ottocento, e sei più a sud di quanto possano portarti ottocento
            passi.
          effetti: { profondita.circolo-bosco-interno: 1 }
        fallimento:
          titolo: Ti volti
          testo: |
            Al centesimo passo ti volti, e dietro c'è un sentiero che non hai mai visto e che finisce contro
            una parete d'edera. Davanti succede lo stesso. Fra i tronchi passa un filo d'aria, e le foglie
            dell'edera restano ferme.
          effetti: { tormento: 1 }
      - testo: "Aprirti la strada fra l'edera"
        descrizione: "Dove il Bosco chiude un sentiero, si può sempre passare di traverso. Il Bosco però se lo ricorda."
        costo: 2
        esito:
          titolo: L'edera
          testo: |
            Ti apri la strada fra l'edera con le mani, strappando i tralci uno alla volta. Ogni tralcio si
            stacca dal legno con un rumore di tela strappata e lascia sulla corteccia una fila di piccole
            radici bianche. Dall'altra parte trovi il sentiero giusto, e sulle braccia una ragnatela di graffi
            che brucia fino a sera.
          effetti: { profondita.circolo-bosco-interno: 1, ferite: 0.5 }

  - id: circolo-bosco-la-sacca-di-marea
    immagine: ambientazione/marea-grigia
    titolo: La sacca di Marea
    sommario: "In una conca le felci sono diventate grigie, e sul fondo ristagna una nebbia bassa che le piante stanno bevendo."
    luogo: Il Bosco interno, una conca di felci grigie
    area: circolo-bosco-interno
    ripetibile: true
    requisiti: [profondita.circolo-bosco-interno == 1]
    testo: |
      Il sentiero scende in una conca di felci color cenere, piegate verso il fondo dove ristagna una nebbia
      lattiginosa. Il bordo della nebbia è netto e piano, e resta fermo anche quando fra i rami passa il
      vento. Ti dici che l'aria fredda si ferma sempre nei fondi, come in ogni valle. Le radici degli alberi
      intorno ci affondano dentro, e le venature delle cortecce si accendono a scatti più in fretta del
      solito.

      {natura Media} Le piante stanno bevendo la nebbia, e il Circolo insegna ai novizi ad aiutarle a mandar
      giù la Marea un sorso alla volta. Dal ritmo delle venature capisci che bevono più in fretta di quanto
      riescano a tenere.

      Su ogni stelo al limite della nebbia c'è una riga grigia, sempre alla stessa altezza. Il sentiero
      attraversa la conca nel punto più basso, dove la nebbia arriva alla cintura.
    opzioni:
      - testo: "Aiutare le piante a bere"
        descrizione: "Bisogna smuovere la terra intorno alle radici e piantarci le felci sane del bordo. Il lavoro è lungo, e la nebbia sta lì."
        prova: { attributo: mentale, abilita: natura, difficolta: Difficile }
        successo:
          titolo: Un sorso alla volta
          testo: |
            Smuovi la terra con le mani intorno alle radici e ci pianti le felci verdi del bordo, una per una.
            La nebbia si abbassa di un palmo mentre lavori, e quando hai finito arriva solo alle caviglie. Le
            felci appena piantate sono già grigie fino a metà stelo. Attraversi la conca con la schiena
            indolenzita e le unghie nere.
          pe: { natura: 5 }
          effetti: { profondita.circolo-bosco-interno: 1 }
        fallimento:
          titolo: Le mani grigie
          testo: |
            Pianti le felci troppo in fretta e troppo vicine, e le radici si rubano la terra a vicenda. La
            nebbia ti sale fredda sulle braccia mentre lavori. Per un'ora le mani ti restano grigie fino al
            polso, e non senti la terra che stringi.
          effetti: { contaminazione: 1 }
      - testo: "Attraversare senza respirare"
        descrizione: "La nebbia arriva alla cintura per trenta passi. Trenta passi si fanno, con il fiato giusto."
        prova: { attributo: fisico, abilita: [resistenza, atletica], difficolta: Media }
        successo:
          titolo: Trenta passi
          testo: |
            Riempi i polmoni e attraversi la conca a passi lunghi, con le braccia alzate sopra la nebbia. La
            nebbia non si apre davanti a te e dietro si richiude senza un vortice. Dall'altra parte ti butti a
            sedere e respiri come un pesce sulla riva.
          effetti: { profondita.circolo-bosco-interno: 1 }
        fallimento:
          titolo: Il ventesimo passo
          testo: |
            Al ventesimo passo il fiato finisce e il petto lo riprende per conto suo, pieno di nebbia che sa
            di ferro bagnato. Tossisci fino alla fine della conca e torni indietro piegat{o|a} in due.
          effetti: { contaminazione: 1 }
      - testo: "Bere la Marea al posto delle piante"
        descrizione: "Quello che le piante fanno con le radici il Respiro lo insegna anche alle mani. Una parte resta a te."
        incantesimo: bere-la-marea
        prova: { attributo: mentale, abilita: magia, difficolta: Media }
        successo:
          titolo: Il sorso
          testo: |
            Immergi le mani nella nebbia e la tiri su, piano, come si tira l'acqua da un pozzo. Fra le dita ha
            il peso dell'acqua e non le bagna. La conca si schiarisce fino al fondo, e le felci più vicine
            cominciano a tornare verdi dalla punta. Un poco di quel grigio ti resta in gola.
          pe: { magia: 5 }
          effetti: { profondita.circolo-bosco-interno: 1, contaminazione: 1 }
        fallimento:
          titolo: Troppo in una volta
          testo: |
            Tiri troppo forte, e la nebbia ti sale nelle braccia tutta insieme, fredda come neve. Ti ritrovi
            in ginocchio sul bordo, con le vene dei polsi chiare e la conca piena come prima. Sulle felci la
            nebbia è tornata alla sua riga grigia.
          effetti: { contaminazione: 1.5 }
      - testo: "Girare largo intorno alla conca"
        descrizione: "Sui bordi la nebbia non arriva. I bordi sono ripidi, e franano."
        costo: 2
        esito:
          titolo: Il bordo che frana
          testo: |
            Giri largo tenendoti agli arbusti, e a metà strada il bordo ti frana sotto i piedi. La terra è
            asciutta e friabile e viene giù a zolle intere. Scivoli per un tratto fra le felci grigie, e
            quando ti fermi hai la bocca piena del loro odore di ferro.
          effetti: { profondita.circolo-bosco-interno: 1, contaminazione: 1 }

  - id: circolo-bosco-il-ruscello-di-linfa
    immagine: fazioni/circolo-di-velthar
    titolo: Il ruscello di linfa
    sommario: "Fra le radici scorre un ruscello che non è acqua. Fa luce verde, e l'unico guado è un tronco coperto di muschio."
    luogo: Il Bosco interno, il ruscello di linfa
    area: circolo-bosco-interno
    ripetibile: true
    requisiti: [profondita.circolo-bosco-interno >= 1, profondita.circolo-bosco-interno <= 2]
    testo: |
      Fra le radici di due querce scorre verso sud un ruscello denso come miele, che manda una luce verdina
      sulle cortecce. È linfa uscita da qualche ferita del Bosco. Scorre senza un gorgoglio, e le foglie
      cadute ci restano sopra immobili mentre sotto la linfa si muove. Sopra c'è un tronco caduto coperto di
      muschio bagnato, con le impronte di un animale piccolo che l'ha attraversato senza scivolare. Le
      impronte arrivano fino all'altra riva e lì finiscono. Ti dici che sull'altra riva il muschio è più
      asciutto e non tiene l'orma.

      {medicina Media} I guaritori della città la pagano bene e la mettono sulle bende delle ferite che non si
      chiudono. Una fiala fa luce per giorni anche lontano dal Bosco.
    opzioni:
      - testo: "Passare sul tronco"
        descrizione: "Il muschio è bagnato e il tronco gira un poco. Bisogna andare svelti e non guardare giù."
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Media }
        successo:
          titolo: Sul tronco
          testo: |
            Passi sul tronco con le braccia larghe e lo sguardo sull'altra riva. A metà il tronco gira di un
            dito, e tu giri con lui senza perdere il passo. Sotto di te la linfa scorre lenta e tinge di verde
            il legno bagnato.
          effetti: { profondita.circolo-bosco-interno: 1 }
        fallimento:
          titolo: Nella linfa
          testo: |
            A metà il tronco gira, e tu no. Finisci nella linfa tiepida fino al petto, e ne esci verde e
            luminos{o|a} come una lanterna. La linfa ti si stacca dai vestiti a fili lunghi e lenti. Per il
            resto della giornata le lucciole ti seguono.
          effetti: { ferite: 0.5 }
      - testo: "Raccogliere la linfa e guadare dove è bassa"
        descrizione: "Una fiala di linfa vale qualche moneta in città. Il guado basso sta più a valle, dove la linfa rallenta."
        prova: { attributo: mentale, abilita: [natura, medicina], difficolta: Media }
        successo:
          titolo: La fiala
          testo: |
            Riempi una fiala dove la linfa è più chiara e cammini lungo la riva finché il ruscello non si
            allarga in un guado. Il vetro ti si scalda in mano, e resta caldo anche quando sei lontan{o|a} dal
            ruscello. Passi il guado con la linfa alle caviglie, che ti lascia gli stivali verdi e tiepidi.
          effetti: { profondita.circolo-bosco-interno: 1, circolo.linfa: 1 }
        fallimento:
          titolo: La fiala rotta
          testo: |
            La fiala ti scivola dalle dita appiccicose e si rompe su un sasso. Ti tagli il palmo raccogliendo
            i cocci, e la linfa nella ferita brucia come aceto. Il taglio fa luce verde per un'ora prima di
            scurirsi.
          effetti: { ferite: 0.5 }
      - testo: "Guadare dove capita"
        descrizione: "La linfa non è profonda dappertutto. È densa dappertutto, però."
        costo: 2
        esito:
          titolo: Il guado
          testo: |
            Entri nella linfa e la attraversi con fatica, come si cammina nel miele, mentre lei ti trattiene
            le gambe a ogni passo. Il fondo lo trovi sempre un poco più in basso di dove lo cerca il piede. Ne
            esci dall'altra parte con i polpacci che tremano.
          effetti: { profondita.circolo-bosco-interno: 1, ferite: 0.5 }

  # ------------------------------------------------------------ 2 · le rovine sotto le radici
  - id: circolo-bosco-il-muro-nel-tronco
    immagine: ambientazione/rovine-dei-precursori
    titolo: Il muro nel tronco
    sommario: "Un albero enorme è cresciuto attorno a un muro dei Precursori, e il metallo esce dalla corteccia come un osso da una ferita."
    luogo: Il Bosco interno, le rovine sotto le radici
    area: circolo-bosco-interno
    ripetibile: true
    requisiti: [profondita.circolo-bosco-interno == 2]
    testo: |
      Su una collinetta c'è una quercia che cinque uomini non abbraccerebbero. Il tronco è cresciuto attorno a
      un muro di metallo grigio e liscio, alto il doppio di te, che spunta dalla corteccia dai due lati. Dove
      tocca il metallo la corteccia si è gonfiata in un labbro spesso, e il metallo sotto non ha un graffio.
      Sul metallo ci sono incisioni fini e dritte che continuano dentro il legno e lì si perdono. Hanno lo
      spigolo vivo e il fondo pulito, senza un granello di terra.

      {tecnologia Media} Il metallo senza ruggine e senza giunture è lo stesso dei reperti di Oda Krell, e qui
      ce n'è un muro intero. Una quercia così grossa ci ha messo secoli a crescere, e sul metallo che ha
      inghiottito non c'è una macchia di linfa.

      Il sentiero passa per una fessura fra il metallo e la corteccia, larga quanto una spalla.
    opzioni:
      - testo: "Leggere le incisioni"
        descrizione: "Le incisioni dei Precursori a volte sono indicazioni. A volte sono avvisi."
        prova: { attributo: mentale, abilita: [tecnologia, accademiche], difficolta: Media }
        successo:
          titolo: Le linee che scendono
          testo: |
            Segui le incisioni con il dito. Sono linee che scendono tutte verso lo stesso punto sotto le
            radici, dove il Bosco è più vecchio, e nessuna è più profonda delle altre. Ai piedi del muro trovi
            una scheggia di metallo che il legno ha spinto fuori, e te la metti in tasca prima di passare.
          pe: { tecnologia: 2 }
          effetti: { profondita.circolo-bosco-interno: 1, reliquie.scheggia: 1 }
        fallimento:
          titolo: Il freddo del metallo
          testo: |
            Le incisioni sotto il dito sono così fredde che ti intorpidiscono la mano, e quando la ritiri le
            dita non vogliono chiudersi. Te le scaldi sotto l'ascella per un quarto d'ora, imprecando a bassa
            voce. Sul polpastrello ti resta fino a sera una riga bianca e dritta.
          effetti: { tormento: 1 }
      - testo: "Passare dalla fessura"
        descrizione: "Larga quanto una spalla, e lunga quanto il tronco. Bisogna passarci di fianco e senza fretta."
        prova: { attributo: fisico, abilita: [acrobazia, furtivita], difficolta: Media }
        successo:
          titolo: Di fianco
          testo: |
            Ti infili nella fessura di fianco, con il metallo freddo sulla schiena e la corteccia sul petto, e
            avanzi un palmo alla volta. Il metallo non si scalda contro la tua schiena per tutta la lunghezza
            del tronco. Dall'altra parte il Bosco è più buio e più vecchio.
          effetti: { profondita.circolo-bosco-interno: 1 }
        fallimento:
          titolo: "Incastrat{o|a}"
          testo: |
            A metà fessura il petto si incastra, e per un lungo momento non vai né avanti né indietro. Il
            metallo ti preme freddo fra le scapole e la corteccia scricchiola contro le costole. Ti liberi
            soffiando fuori tutta l'aria, e torni indietro con la camicia strappata.
          effetti: { ferite: 0.5 }
      - testo: "Arrampicarti sopra il muro"
        descrizione: "Il muro è liscio, la corteccia no. Ci vuole tempo, e le mani."
        costo: 2
        esito:
          titolo: In cima
          testo: |
            Sali dalla parte della corteccia, una nocca alla volta, e scavalchi il muro dove il legno l'ha
            coperto. In cima il metallo è spesso quanto una mano, e il legno ci è cresciuto sopra senza
            intaccarlo. Scendendo ti sbucci le mani su una cresta di metallo affilata come una lama.
          effetti: { profondita.circolo-bosco-interno: 1, ferite: 0.5 }

  - id: circolo-bosco-i-cristalli-nel-legno
    immagine: ambientazione/cristalli-conduttori
    titolo: I cristalli nel legno
    sommario: "Le radici di un faggio hanno inghiottito una fila di cristalli esausti, e li hanno spenti del tutto."
    luogo: Il Bosco interno, le rovine sotto le radici
    area: circolo-bosco-interno
    ripetibile: true
    requisiti: [profondita.circolo-bosco-interno == 2]
    testo: |
      Il sentiero passa sotto le radici di un faggio caduto, che si alzano come un muro di terra e legno.
      Dentro le radici ci sono cristalli conduttori grandi come un pugno, diventati opachi. Stanno in file
      regolari, alla stessa distanza l'uno dall'altro, e le radici sono cresciute seguendo le file e chiudendo
      ogni cristallo in una tasca di legno liscio.

      {magia Media} Il Mana dei cristalli l'ha bevuto il faggio, e il faggio l'ha restituito piano alla terra.
      Ne resta una traccia tiepida che scende dai cristalli verso il basso, e verso l'alto non va.

      {origine allievo-di-torvessa} All'Accademia un cristallo esausto lo buttano, e qui il Bosco ci ha fatto
      crescere dentro un albero.

      Fra le radici c'è un passaggio basso e buio che puzza di terra smossa. Il faggio è caduto da anni, e la
      terra del passaggio è smossa di fresco.
    opzioni:
      - testo: "Sentire quale cristallo ha ancora qualcosa"
        descrizione: "Uno su dieci, forse, non è vuoto del tutto. Bisogna sentirlo con il Mana, non con le dita."
        prova: { attributo: mentale, abilita: magia, difficolta: Media }
        successo:
          titolo: Il battito lento
          testo: |
            Passi la mano sui cristalli senza toccarli. Al settimo senti un battito lontano, più lento del tuo
            polso, e quello lo stacchi dal legno con la punta del coltello senza che il faggio se ne lamenti.
            La tasca di legno lo lascia andare con uno schiocco umido.
          effetti: { profondita.circolo-bosco-interno: 1, cristalli.frammento-esausto: 2 }
        fallimento:
          titolo: Il cristallo sbagliato
          testo: |
            Stacchi il cristallo che ti sembrava vivo, ed è vuoto come gli altri. Nel buco che lascia la linfa
            del faggio cola scura e tiepida, e cola a lungo per un albero caduto. Ti senti un cerusico che ha
            tolto il dente sbagliato.
          effetti: { tormento: 1 }
      - testo: "Strisciare nel passaggio fra le radici"
        descrizione: "Il passaggio è buio e basso. Le radici trattengono la terra, finché non le tocchi."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Media }
        successo:
          titolo: La terra smossa
          testo: |
            Strisci sui gomiti nel buio, con le radici che ti sfiorano la nuca. Sotto i gomiti la terra è
            morbida e ha l'odore delle zolle rivoltate da poco. Dall'altra parte riemergi in una conca dove il
            Bosco è più fitto e l'aria più fredda.
          effetti: { profondita.circolo-bosco-interno: 1 }
        fallimento:
          titolo: La frana
          testo: |
            Tocchi una radice con la spalla, e la terra ti cade addosso a
            secchiate. Torni indietro sputando, con la bocca piena di
            terra.
          effetti: { ferite: 0.5 }
      - testo: "Scavalcare il muro di radici"
        descrizione: "Le radici reggono quasi tutte. È un'arrampicata lunga."
        costo: 2
        esito:
          titolo: Le radici che reggono
          testo: |
            Ti arrampichi sulle radici come su una scala storta. Due volte una radice cede e ti lascia
            appes{o|a} per le braccia. Reggono sempre quelle cresciute intorno ai cristalli, che sotto le dita
            sono dure e fredde. Dall'altra parte arrivi con le spalle in fiamme.
          effetti: { profondita.circolo-bosco-interno: 1, ferite: 0.5 }

  - id: circolo-bosco-il-silente-addormentato
    immagine: fazioni/circolo-di-velthar
    titolo: Il Silente addormentato
    sommario: "Seduto fra le radici di un tasso c'è un uomo con gli occhi chiusi. Le radici gli sono cresciute sulle gambe."
    luogo: Il Bosco interno, il tasso dei Silenti
    area: circolo-bosco-interno
    ripetibile: true
    requisiti: [profondita.circolo-bosco-interno >= 2, profondita.circolo-bosco-interno <= 3]
    testo: |
      Ai piedi di un tasso vecchissimo c'è un uomo seduto a gambe incrociate, con gli occhi chiusi e una
      tunica grigio-verde che il muschio comincia a ricoprire. Il muschio è più spesso sulle spalle e nelle
      pieghe del grembo, dove la stoffa non si muove da più tempo. Le radici del tasso gli sono salite sulle
      ginocchia e gli girano intorno alle caviglie senza lasciargli un graffio sulla pelle. Respira piano, una
      volta ogni tanto, e fra un respiro e l'altro arrivi a contare fino a trenta.

      {empatia Facile} Sta bene. Il resto di lui è da qualche altra parte, e ha lasciato qui il corpo ad
      aspettarlo.

      Il sentiero passa a un passo dalle sue ginocchia, e sulla radice accanto qualcuno ha lasciato una
      ciotola di legno con dell'acqua e una mela. La mela è fresca e non ha un segno di becco né di denti. Per
      terra intorno al tasso i rametti secchi sono tutti interi.
    opzioni:
      - testo: "Passare senza fare rumore"
        descrizione: "Un Silente che si sveglia di colpo può svegliare anche il Bosco intorno. Meglio che non si svegli."
        prova: { attributo: fisico, abilita: furtivita, difficolta: Media }
        successo:
          titolo: In punta di piedi
          testo: |
            Passi a un passo dalle sue ginocchia senza spezzare un rametto.
            Quando sei oltre, senti dietro di te un sospiro più lungo degli
            altri.
          effetti: { profondita.circolo-bosco-interno: 1 }
        fallimento:
          titolo: Il rametto
          testo: |
            Il rametto si spezza sotto il tuo tallone, e il Silente apre gli occhi senza guardarti. Gli alberi
            intorno invece ti guardano, e i rami bassi si piegano verso di te tutti nello stesso momento. Il
            sentiero davanti si chiude come una porta.
          effetti: { tormento: 1.5 }
      - testo: "Lasciare qualcosa nella ciotola"
        descrizione: "Al Circolo chi passa davanti a un Silente lascia un'offerta piccola per chi lo accudisce."
        prova: { attributo: sociale, abilita: [empatia, galateo], difficolta: Media }
        successo:
          titolo: L'offerta
          testo: |
            Lasci nella ciotola un pezzo di pane accanto alla mela, e ti inchini come hai visto fare ai
            novizi. Le radici del tasso si spostano di un dito con uno scricchiolio di legno vivo, e il
            sentiero si apre più largo di prima.
          effetti: { profondita.circolo-bosco-interno: 1 }
        fallimento:
          titolo: L'offerta sbagliata
          testo: |
            Lasci nella ciotola un pezzo di carne secca, e capisci troppo tardi che al Circolo la carne non si
            offre ai Silenti. Il tasso fa cadere un ramo secco a un palmo dalla tua testa, e sul tronco non
            trovi il punto da cui si è staccato.
          effetti: { tormento: 1 }
      - testo: "Salutarlo senza voce"
        descrizione: "I Silenti ti hanno insegnato a parlare senza muovere la bocca. A uno di loro si risponde così."
        quando: [circolo.sussurro >= 1]
        esito:
          titolo: Il saluto
          testo: |
            Lo saluti dentro la testa come ti hanno insegnato. Dalla sua ti arriva una parola sola e calda che
            somiglia a un nome di pianta, e per un po' ti lascia sulla lingua un sapore di resina. Il sentiero
            davanti si apre senza bisogno di altro.
          effetti: { profondita.circolo-bosco-interno: 1 }
      - testo: "Fare un lungo giro intorno al tasso"
        descrizione: "Lontano dal Silente il Bosco è più fitto. Si passa, con pazienza."
        costo: 2
        esito:
          titolo: Il giro lungo
          testo: |
            Giri intorno al tasso a cento passi di distanza, fra i rovi. Per tutto il giro ti senti addosso
            uno sguardo, e ogni volta che ti volti il Silente ha gli occhi chiusi e il viso girato verso di
            te.
          effetti: { profondita.circolo-bosco-interno: 1, tormento: 1 }

  # ------------------------------------------------------------ 3-4 · il boschetto grigio
  - id: circolo-bosco-le-cortecce-cenere
    immagine: ambientazione/marea-grigia
    titolo: Le cortecce color cenere
    sommario: "Gli alberi del boschetto grigio respirano a scatti, e dalle crepe della corteccia esce una nebbia che sembra latte."
    luogo: Il Bosco interno, il boschetto grigio
    area: circolo-bosco-interno
    ripetibile: true
    requisiti: [profondita.circolo-bosco-interno >= 3]
    testo: |
      Qui gli alberi hanno la corteccia color cenere fredda, e sotto il palmo si sfarina in scaglie sottili
      che ti lasciano le dita grigie. Le foglie pendono grigie e molli, e per terra non ce n'è una sola
      caduta. Le venature si accendono tutte insieme a scatti, e a ogni scatto dalle crepe esce uno sbuffo di
      nebbia lattiginosa che resta sospeso fra i tronchi. Fra uno scatto e l'altro conti sei battiti del tuo
      cuore, e sono sempre sei.

      {natura Difficile} Gli scatti hanno un ritmo che viene da sotto, più giù delle radici. Gli alberi
      rigettano la nebbia come un cane che ha mangiato l'erba sbagliata.
    opzioni:
      - testo: "Attraversare con un panno bagnato sulla bocca"
        descrizione: "La nebbia si ferma sulla stoffa bagnata, quasi tutta. Bisogna sapere come piegarlo."
        prova: { attributo: mentale, abilita: [medicina, natura], difficolta: Media }
        successo:
          titolo: Il panno
          testo: |
            Bagni un lembo di camicia nella borraccia, lo pieghi in quattro e lo leghi sulla bocca e sul naso.
            Attraversi il boschetto a passi corti, e il panno diventa grigio mentre tu no. Quando lo strizzi
            dall'altra parte cola un'acqua color latte.
          effetti: { profondita.circolo-bosco-interno: 1 }
        fallimento:
          titolo: Il panno asciutto
          testo: |
            Il panno si asciuga a metà strada, e da lì in avanti respiri
            nebbia e stoffa insieme. Tossisci per un'ora.
          effetti: { contaminazione: 1 }
      - testo: "Correre fra uno sbuffo e l'altro"
        descrizione: "Gli scatti hanno un ritmo. Fra due scatti l'aria è quasi pulita, per qualche passo."
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Media }
        successo:
          titolo: Fra due sbuffi
          testo: |
            Aspetti lo scatto, conti fino a sei e corri. Al settimo ti butti dietro un tronco con la bocca
            chiusa mentre la nebbia passa, e il tronco è tiepido contro la guancia e vibra appena a ogni
            sbuffo. Lo fai cinque volte, e alla quinta sei dall'altra parte.
          effetti: { profondita.circolo-bosco-interno: 1 }
        fallimento:
          titolo: Il conto sbagliato
          testo: |
            Al terzo scatto sbagli il conto e ti ritrovi in mezzo allo
            sbuffo. Respiri latte freddo, e torni indietro piegato.
          effetti: { contaminazione: 1 }
      - testo: "Attraversare e basta"
        descrizione: "Il boschetto non è grande. La nebbia però si attacca ai vestiti e ai polmoni."
        costo: 2
        esito:
          titolo: Dritto in mezzo
          testo: |
            Attraversi il boschetto a testa bassa, con la manica sulla bocca.
            Dall'altra parte i vestiti ti sanno di ferro, e la gola pure.
          effetti: { profondita.circolo-bosco-interno: 1, contaminazione: 1.5 }

  - id: circolo-bosco-le-spore
    immagine: ambientazione/marea-grigia
    titolo: Le spore della linfa nera
    sommario: "Da una corteccia spaccata cola una linfa nera, e dalla linfa si alza una nuvola di spore che ti viene incontro."
    luogo: Il Bosco interno, il boschetto grigio
    area: circolo-bosco-interno
    ripetibile: true
    requisiti: [profondita.circolo-bosco-interno >= 3]
    testo: |
      Un tronco si è spaccato per il lungo dall'altezza di un uomo fino a terra, e i due lembi di legno sono
      piegati in fuori. Dalla spaccatura cola una linfa nera e lucida che scende in un filo continuo senza mai
      staccarsi in gocce, e dove tocca terra il suolo è nudo. Sopra sono cresciuti migliaia di funghi grigi
      con il cappello largo un'unghia. Quando ti avvicini tremano tutti insieme e liberano una nuvola di spore
      che ti viene incontro contro vento.

      {medicina Media} Le spore cercano la bocca e gli occhi, e quello che portano dentro non va via con
      l'acqua.

      La nuvola si divide in due e ti gira intorno, e le due metà si muovono alla velocità del tuo passo.
    opzioni:
      - testo: "Disperderle a colpi"
        descrizione: "Una nuvola si sparpaglia, se la colpisci abbastanza forte. Bisogna farlo prima che si posi."
        combattimento: circolo-le-spore
        vittoria:
          titolo: La nuvola sparpagliata
          testo: |
            Colpisci la nuvola finché non si sparpaglia in fili che il vento si porta via. Ti resta addosso
            una polvere grigia e fredda che si infila nelle cuciture, e ti spazzoli i vestiti con le mani fino
            a farle arrossare. Nelle pieghe dei gomiti la polvere resta lo stesso.
          effetti: { profondita.circolo-bosco-interno: 1, contaminazione: 1 }
        sconfitta:
          titolo: Nella nuvola
          testo: |
            Le spore ti si posano sulla faccia e sulle mani, e per un'ora vedi il Bosco attraverso un velo
            grigio. Le palpebre bruciano ogni volta che le chiudi. Torni indietro a tastoni e lasci sulla
            corteccia impronte grigie, finché il velo non se ne va.
          effetti: { contaminazione: 1.5 }
      - testo: "Scappare controvento"
        descrizione: "Le spore vanno dove va il vento. Basta correre dalla parte giusta."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Media }
        successo:
          titolo: Controvento
          testo: |
            Ti bagni un dito e lo alzi, poi corri dalla parte dove il dito sente freddo e salti le radici fra
            i tronchi grigi. La nuvola ti segue per un tratto e poi si ferma come un cane alla fine della
            catena. Resta sospesa fra due alberi finché non la perdi di vista.
          effetti: { profondita.circolo-bosco-interno: 1 }
        fallimento:
          titolo: Il vento gira
          testo: |
            Corri dalla parte giusta, e a metà strada il vento gira. La nuvola ti raggiunge fra due tronchi e
            ti si posa addosso come farina. Le senti asciutte sulla lingua, e sputare non serve.
          effetti: { contaminazione: 1.5 }
      - testo: "Aspettare che si posino"
        descrizione: "Le spore prima o poi cadono, e la pazienza costa meno delle ferite."
        costo: 2
        esito:
          titolo: L'attesa
          testo: |
            Ti siedi a venti passi e aspetti con la manica sulla bocca che la nuvola si posi sulla linfa nera.
            Ci mette tutto il pomeriggio, e qualche filo arriva lo stesso fino a te. Le spore che toccano la
            linfa ci affondano dentro senza lasciare un cerchio.
          effetti: { profondita.circolo-bosco-interno: 1, contaminazione: 1 }

  - id: circolo-bosco-i-lupi-grigi
    immagine: icone/wolf-head
    titolo: I lupi grigi
    sommario: "Due lupi grigi con le gengive di metallo ti tagliano la strada senza ringhiare."
    luogo: Il Bosco interno, il boschetto grigio
    area: circolo-bosco-interno
    ripetibile: true
    requisiti: [profondita.circolo-bosco-interno >= 3]
    testo: |
      Li senti prima di vederli, perché respirano a scatti come gli alberi del boschetto e ogni scatto arriva
      insieme a uno sbuffo delle cortecce. Sono due, ed escono dalla nebbia ai lati del sentiero con la testa
      bassa. Hanno il pelo ritto e rigido, che non ondeggia quando si muovono, e le zampe affondano nelle
      foglie marce senza un fruscio. Quando aprono la bocca mostrano gengive di metallo lucido senza un
      ringhio, e l'alito che ne esce sa di ferro.

      {armi-da-distanza Media} Quello di sinistra zoppica sulla zampa davanti, e attaccherà per secondo.

      {addestrare-animali Difficile} Sono lupi solo in parte, ma hanno ancora orecchie di lupo che ascoltano.
    opzioni:
      - testo: "Affrontarli"
        descrizione: "Due lupi grigi che si muovono in silenzio e mordono basso."
        combattimento: circolo-lupi-grigi
        vittoria:
          titolo: Le pelli grigie
          testo: |
            L'ultimo lupo cade senza un guaito, come era arrivato. La pelle è rigida e pesante, e il coltello
            ci stride sopra prima di entrare. Ne stacchi una prima di andare avanti. Sotto il pelo la carne è
            grigia fino all'osso.
          effetti: { profondita.circolo-bosco-interno: 1, circolo.pelle-grigia: 1 }
        sconfitta:
          titolo: I morsi bassi
          testo: |
            I lupi ti mordono ai polpacci finché non cadi, poi se ne vanno come se avessero finito un lavoro.
            Torni indietro zoppicando, con i calzoni a brandelli. Intorno ai segni dei denti la pelle resta
            fredda anche quando smette di sanguinare.
      - testo: "Mandarli via con Richiamo"
        descrizione: "Le orecchie sono ancora di lupo. Se senti la lingua giusta, forse il resto obbedisce."
        incantesimo: richiamo
        prova: { attributo: mentale, abilita: magia, difficolta: Media }
        successo:
          titolo: Le orecchie
          testo: |
            Dici le parole del Richiamo, e i due lupi girano le orecchie verso di te nello stesso momento.
            Restano fermi a lungo con il muso alto, e per tutto quel tempo i fianchi smettono di andare a
            scatti. Poi se ne vanno piano nella nebbia e si voltano a guardarti.
          pe: { addestrare-animali: 2 }
          effetti: { profondita.circolo-bosco-interno: 1 }
        fallimento:
          titolo: Le parole che non arrivano
          testo: |
            Le parole arrivano alle orecchie e lì si fermano. Le orecchie si girano verso di te, e il resto
            del corpo non le segue. Il lupo di destra ti salta alla gamba, e lo scrolli via lasciandogli un
            pezzo di calzone.
          effetti: { ferite: 1 }
      - testo: "Fissarli finché non cedono"
        descrizione: "Un branco senza il suo capo non sa bene che cosa fare. Bisogna farglielo capire."
        prova: { attributo: sociale, abilita: [intimidire, addestrare-animali], difficolta: Media }
        successo:
          titolo: Lo sguardo
          testo: |
            Allarghi le braccia per farti grande e li fissi uno dopo l'altro senza battere ciglio. Da vicino
            hanno ancora gli occhi gialli di un lupo. Il lupo zoppo abbassa gli occhi per primo, e l'altro lo
            segue nella nebbia.
          effetti: { profondita.circolo-bosco-interno: 1 }
        fallimento:
          titolo: Il primo a cedere
          testo: |
            Il primo ad abbassare gli occhi sei tu, e i lupi lo capiscono.
            Ti girano intorno finché non arretri fino agli alberi verdi.
          effetti: { ferite: 0.5, tormento: 1 }
      - testo: "Fare un giro largo"
        descrizione: "I lupi grigi non lasciano il sentiero. Fuori dal sentiero c'è la nebbia."
        costo: 2
        esito:
          titolo: Fuori dal sentiero
          testo: |
            Ti allontani piano dal sentiero dentro la nebbia, e i lupi ti guardano andare senza seguirti.
            Restano sul bordo del sentiero con le zampe davanti allineate sullo stesso filo. Il giro è lungo,
            e alla fine hai la gola che raschia e gli occhi che lacrimano.
          effetti: { profondita.circolo-bosco-interno: 1, contaminazione: 1 }

  # ------------------------------------------------------------ il cuore · il capobranco (passo 4)
  - id: circolo-bosco-il-capobranco
    immagine: icone/wolf-howl
    titolo: Il cuore del boschetto grigio
    sommario: "Al centro del grigio le radici entrano in un muro dei Precursori, e davanti al muro ti aspetta il capobranco."
    luogo: Il Bosco interno, il cuore del boschetto grigio
    area: circolo-bosco-interno
    requisiti: [profondita.circolo-bosco-interno >= 5, fazione.circolo == 3]
    testo: |
      Al centro del boschetto il terreno sprofonda in una conca larga una trentina di passi. Sul fondo le
      radici di tutti gli alberi intorno scendono a raggiera e si infilano in un muro di metallo che affiora
      dalla terra. Il metallo non ha un punto di ruggine, e ogni radice ci entra senza una crepa intorno né un
      segno di scalpello. Dalle giunture del muro sale a sbuffi una nebbia lattiginosa, e le venature dei
      tronchi si accendono insieme a lei.

      Davanti al muro, sdraiato sulla terra nuda, c'è il capobranco. È un lupo grande come un vitello, con la
      schiena coperta di placche lucide e il muso grigio. Si alza senza fretta quando ti vede, e dalla nebbia
      escono altri due lupi che si siedono dietro di lui. I fianchi gli si gonfiano a scatti insieme al muro,
      e a ogni scatto le placche si sollevano e scoprono una pelle rosa e tesa.

      {addestrare-animali Difficile} Il capobranco respira a scatti perché gli fa male. Se lo porti fuori dal
      ritmo del muro forse torna a essere un lupo.

      *Tharn mi ha lasciato al margine del grigio, e adesso tocca a me.* La terra nuda della conca è tiepida
      sotto gli stivali, e a ogni sbuffo la senti vibrare.
    opzioni:
      - testo: "Abbattere il capobranco"
        descrizione: "Un lupo grande come un vitello, con il branco che guarda. Se cade il capo, il branco si sparpaglia."
        combattimento: circolo-il-capobranco-grigio
        vittoria:
          titolo: Il branco si sparpaglia
          testo: |
            Il capobranco cade sulle zampe davanti come un cavallo che si inginocchia, e gli sbuffi del muro
            si fermano con lui. Gli altri lupi scappano nella nebbia senza un suono. Ti avvicini al muro e
            guardi le radici che ci entrano e la nebbia che continua a salire piano, senza più scatti. Il
            metallo è tiepido sotto il palmo e vibra appena, e la nebbia viene da sotto e da nessun'altra
            parte. Al margine del grigio Tharn ti aspetta, e quando gli racconti del muro decide di portarti
            da Serha.
          pe: { natura: 5 }
          effetti: { fazione.circolo: 1, rep.circolo: 1, circolo.pelle-grigia: 2 }
          vai: superficie-fratturata
        sconfitta:
          titolo: Il morso alla spalla
          testo: |
            Il capobranco ti prende alla spalla e ti trascina per un tratto sulla terra nuda. Poi ti lascia
            andare come si lascia una cosa che non vale la pena. Sulla spalla ti resta una mezzaluna di segni
            a distanza uguale, fredda al tatto. Tharn ti trova al margine del grigio e ti porta fuori dal
            Bosco sulle spalle, senza dire una parola.
          effetti: { tormento: 1 }
          vai: superficie-fratturata
      - testo: "Portarlo fuori dal grigio con la voce"
        descrizione: "Il capobranco respira a scatti perché gli fa male. Con la voce giusta, forse, smette di seguire il muro e segue te."
        prova: { attributo: sociale, abilita: addestrare-animali, difficolta: Difficile }
        successo:
          titolo: Il respiro di un lupo
          testo: |
            Ti siedi sulla terra nuda e cominci a soffiare lento, a voce, come si fa con un cavallo
            spaventato, finché il capobranco non sbaglia uno sbuffo e poi un altro. Alla fine respira con te.
            Lo porti fuori dalla conca camminando all'indietro, e gli altri due lupi ti seguono a distanza.
            Fuori dalla conca le placche sulla sua schiena si abbassano e restano giù. Al margine del grigio
            Tharn lo vede arrivare e si mette a ridere piano, con le mani sulla faccia. Del muro e delle
            radici, poi, parlerai con Serha.
          pe: { addestrare-animali: 10 }
          effetti: { fazione.circolo: 1, rep.circolo: 1 }
          imposta: { circolo.capobranco: 1 }
          vai: superficie-fratturata
        fallimento:
          titolo: Il ritmo del muro
          testo: |
            Soffi lento a voce alta, e per un momento il capobranco ti segue. Poi il muro sbuffa più forte e
            ti manda in faccia una nebbia tiepida, e lui torna al suo ritmo e ti carica. Rotoli via in tempo
            per prenderti solo una zampata sul fianco, e risali la conca carponi.
          effetti: { ferite: 1.5 }
          vai: superficie-fratturata
      - testo: "Portarlo fuori dal grigio con Richiamo"
        descrizione: "La lingua che il Circolo insegna ai bambini arriva anche a un lupo che sta male. Serve un Richiamo forte."
        incantesimo: richiamo
        prova: { attributo: mentale, abilita: magia, difficolta: Difficile }
        successo:
          titolo: Il nome del lupo
          testo: |
            Dici il Richiamo lentamente, una sillaba per ogni sbuffo del muro, e alla terza volta il
            capobranco smette di sbuffare e ti guarda. Lo porti fuori dalla conca camminando all'indietro, e
            gli altri due lupi ti seguono a distanza. Dietro di te il muro continua a sbuffare, e il lupo non
            si volta. Al margine del grigio Tharn lo vede arrivare e si mette a ridere piano, con le mani
            sulla faccia. Del muro e delle radici, poi, parlerai con Serha.
          pe: { magia: 5, addestrare-animali: 5 }
          effetti: { fazione.circolo: 1, rep.circolo: 1 }
          imposta: { circolo.capobranco: 1 }
          vai: superficie-fratturata
        fallimento:
          titolo: Il ritmo del muro
          testo: |
            Il Richiamo ti esce a metà, coperto da uno sbuffo del muro, e il capobranco ti carica. Rotoli via
            in tempo per prenderti solo una zampata sul fianco. Le unghie ti aprono la camicia in quattro
            strisce pulite, e risali la conca carponi.
          effetti: { ferite: 1.5 }
          vai: superficie-fratturata
      - testo: "Tornare indietro"
        descrizione: "Il capobranco non ti segue fuori dalla conca. Il Bosco interno però ricomincia da capo."
        costo: 0
        esito:
          titolo: Fuori dal grigio
          testo: |
            Risali la conca camminando all'indietro, e il capobranco torna a sdraiarsi davanti al muro senza
            toglierti gli occhi di dosso. Quando arrivi al bordo i suoi fianchi hanno ripreso il ritmo del
            muro. Al margine del grigio Tharn ti guarda arrivare e non ti chiede niente.
          vai: superficie-fratturata

  # ------------------------------------------------------------ il cuore · il giro delle sentinelle (dopo il passo 4)
  - id: circolo-bosco-le-sentinelle
    immagine: icone/wolf-head
    titolo: Il giro delle sentinelle
    sommario: "Davanti al muro nel cuore del grigio il branco torna sempre. Qualcuno deve fare il giro e mandarlo via."
    luogo: Il Bosco interno, il cuore del boschetto grigio
    area: circolo-bosco-interno
    requisiti: [profondita.circolo-bosco-interno >= 5, fazione.circolo >= 4]
    testo: |
      La conca è come l'hai lasciata, con le radici che scendono nel muro di metallo e la nebbia che sale
      dalle giunture. Dove dormiva il capobranco adesso fanno la guardia tre lupi grigi più giovani, che si
      alzano insieme quando entri. Le placche sulla loro schiena sono ancora piccole e lasciano vedere il pelo
      fra l'una e l'altra.

      Al Circolo lo chiamano il giro delle sentinelle. Sul muro qualcuno ha lasciato una fila di fiale vuote
      per la linfa che cola dalle radici, e il vetro è appannato dall'umido della nebbia.
    opzioni:
      - testo: "Scacciare le sentinelle"
        descrizione: "Tre lupi grigi giovani. Il primo giro rende di più, perché la linfa si è raccolta da mesi."
        quando: [circolo.sentinelle == 0]
        combattimento: circolo-le-sentinelle-grigie
        vittoria:
          titolo: Il primo giro
          testo: |
            I lupi scappano nella nebbia uno dopo l'altro, e l'ultimo si volta a guardarti prima di sparire.
            Alle radici del muro la linfa si è raccolta per mesi in una pozza scura e luminosa, e ne riempi
            tutte le fiale. Dentro il vetro la linfa continua a mandare luce a scatti, al ritmo del muro. Al
            Circolo, la sera, Tharn conta le pelli e le fiale e ti dice che il giro l'hai fatto da druido.
          pe: { natura: 5 }
          effetti: { circolo.linfa: 3, circolo.pelle-grigia: 2, rep.circolo: 0.5 }
          imposta: { circolo.sentinelle: 1 }
          vai: superficie-fratturata
        sconfitta:
          titolo: I giovani
          testo: |
            I lupi giovani sono più svelti del loro capo e non ringhiano mai, e ti mordono a turno finché non
            lasci la conca. Risali fino al margine del grigio con le gambe che sanguinano.
          vai: superficie-fratturata
      - testo: "Scacciare le sentinelle"
        descrizione: "Tre lupi grigi giovani, come ogni volta. La linfa alle radici è poca, ma c'è."
        quando: [circolo.sentinelle >= 1]
        combattimento: circolo-le-sentinelle-grigie
        vittoria:
          titolo: Il giro
          testo: |
            I lupi scappano nella nebbia come ogni volta, e tu riempi le fiale con la linfa che cola dalle
            radici. Scende a gocce lente lungo il metallo, e ne viene meno della prima volta. La pelle che
            stacchi è di un lupo giovane, con il pelo ancora morbido sul ventre.
          effetti: { circolo.linfa: 1, circolo.pelle-grigia: 1 }
          vai: superficie-fratturata
        sconfitta:
          titolo: I giovani
          testo: |
            I lupi giovani sono più svelti del loro capo, e ti girano intorno in tre per mordere dove non
            guardi. Ti mordono finché non lasci la conca. Risali fino al margine del grigio con le gambe che
            sanguinano.
          vai: superficie-fratturata
      - testo: "Mandarli via con Richiamo"
        descrizione: "I lupi giovani ascoltano più volentieri dei vecchi. Si raccoglie la linfa con calma."
        incantesimo: richiamo
        prova: { attributo: mentale, abilita: magia, difficolta: Media }
        successo:
          titolo: La conca vuota
          testo: |
            Al Richiamo i tre lupi abbassano la testa e se ne vanno in fila nella nebbia. Raccogli la linfa
            alle radici con calma, una fiala alla volta, e il vetro ti si scalda in mano mentre si riempie.
          pe: { magia: 2 }
          effetti: { circolo.linfa: 1 }
          vai: superficie-fratturata
        fallimento:
          titolo: I denti
          testo: |
            Il Richiamo arriva a due lupi su tre, e il terzo ti salta addosso per tutti e tre. Gli altri due
            restano seduti a guardare con le orecchie girate verso di te. Te ne vai con il braccio
            sanguinante.
          effetti: { ferite: 1 }
          vai: superficie-fratturata
      - testo: "Tornare indietro"
        descrizione: "Il giro lo farà qualcun altro, stavolta."
        costo: 0
        esito:
          titolo: Un'altra volta
          testo: |
            Risali la conca senza voltarti, e i lupi tornano a sdraiarsi
            davanti al muro.
          vai: superficie-fratturata
