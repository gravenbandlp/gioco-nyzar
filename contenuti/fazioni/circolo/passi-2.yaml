# La quest del Circolo di Velthar, passi 6-10 (fazione.circolo 5 → 10).
# 6 La radura sigillata (grado 2, pista.corin >= 3): l'eco nella radura della Foresta Strisciante, poi la spirale.
#   Con braska == 2 il puma tiene ferma la forma; il Figlio del Circolo riconosce il cinghiale della porta nord.
# 7 Quello che restituisce la Spina: Voren di notte sulla strada di Velthar, poi la Spina dell'Eco (circolo.parola).
# 8 Il Circolo Ristretto: si sostiene una voce (o si tace), poi si sceglie la via (circolo.via).
# 9 La prova della via (grado 3): due scene per via (Irriducibili la notte col branco, Radicanti la vena e il sangue,
#   Silenti tre notti nel tronco), poi `circolo-il-nome-della-via`, dove Aelion dà il nome e il dono.
# 10 L'Albero si è riacceso (pista.capomozzo >= 7): Aelion racconta (circolo.acceso), poi la corda per la fenditura
#   si trova in tre posti: Serha al Bosco, Dragna al Grifone di Ferro, Oda Krell nella sua baracca.
storylet:
  # ------------------------------------------------------------ 5 → 6 · la radura sigillata
  - id: circolo-la-radura-sigillata
    presso: circolo-bosco-di-velthar
    immagine: ambientazione/foresta-strisciante
    titolo: La radura sigillata
    sommario: "Nella Foresta Strisciante c'è una radura chiusa da un anello di piante che bevono la Marea. Metà sono secche, e dentro qualcosa respira."
    luogo: Foresta Strisciante, la radura del cinghiale
    area: superficie-fratturata
    requisiti: [fazione.circolo == 5, pista.corin >= 3]
    testo: |
      Serha ti accompagna nella Foresta Strisciante con un sacco di piantine avvolte nel muschio bagnato sulla
      spalla buona. Alla radura dove Corin Ashdale ha abbattuto il cinghiale, il Circolo ha piantato un anello
      di felci e di ortiche per tenere dentro la Marea che il cinghiale ha lasciato morendo.

      Metà dell'anello è secca, e le felci si sbriciolano come carta bruciata. Le ortiche morte sono rimaste
      in piedi con le foglie grigie, e quando le sfiori non pungono più. Nel mezzo della radura la Marea si è
      rappresa in un cinghiale vuoto con la pelle di nebbia. Respira a scatti, e ogni volta la nebbia del
      fianco si gonfia e si ritira. Le zanne sono l'unica parte che non ondeggia. Gira piano lungo l'anello e
      cerca il punto dove le piante sono morte.

      {natura Media} La Marea ha imparato la forma dal cinghiale morto qui, e adesso la ripete come un bambino
      ripete una parola che non capisce. Ripete anche il giro, sempre nello stesso verso e sempre alla stessa
      distanza dalle felci.

      {origine figlio-del-circolo} Il respiro spezzato con il sibilo in fondo è quello del cinghiale della
      porta nord, il giorno del Festival. *Quello lo guidavano con il dolore, questo non lo guida nessuno.* Le
      mani ti si stringono da sole.

      «Se esce dall'anello, comincia a copiare le bestie della Foresta» dice Serha, e apre il sacco delle
      piantine.
    opzioni:
      - testo: "Combattere l'eco"
        descrizione: "Una forma di Marea che respira e carica. Si richiude come acqua, e qualcuno dice che l'Esorcismo la ferisce più del ferro."
        combattimento: circolo-l-eco-della-radura
        vittoria:
          titolo: La forma che si disfa
          testo: |
            L'eco si disfa sotto i colpi un pezzo alla volta, dalle zanne fino al muso. Dove la colpisci la
            nebbia si apre e si richiude, e ogni volta si richiude un po' meno. Alla fine resta un soffio
            senza corpo che si posa sulla terra come brina. Serha pianta le felci nuove nei buchi dell'anello
            mentre tu ti siedi sui talloni. Quando ha finito si pulisce le mani sui calzoni e guarda la terra
            dove l'eco si è posata.
          effetti: { contaminazione: 1 }
          segue: circolo-sulla-spirale
        sconfitta:
          titolo: La nebbia addosso
          testo: |
            L'eco ti passa attraverso, e per un lungo momento respiri con lei, a scatti. L'aria che ti entra
            in gola è fredda e sa di ferro. Serha ti trascina fuori dall'anello per il colletto e ti tiene la
            testa fra le ginocchia finché non tossisci tutto. Per riprovare ci vorrà almeno un altro giorno.
          effetti: { contaminazione: 1.5, tormento: 1 }
      - testo: "Riseminare l'anello mentre l'eco gira"
        descrizione: "Le piantine di Serha vanno messe nei buchi dell'anello, una alla volta, mentre la forma passa a due passi."
        prova: { attributo: mentale, abilita: natura, difficolta: Difficile }
        successo:
          titolo: L'anello chiuso
          testo: |
            Pianti le felci di Serha nei buchi dell'anello, una alla volta, contando i passi dell'eco per non
            trovartela davanti. Ogni volta che ti passa alle spalle senti il suo sibilo e un freddo sulla
            nuca. Quando l'ultimo buco si chiude, la forma si ferma in mezzo alla radura e si affloscia come
            un mantice. Le mani ti sono diventate grigie fino al polso.
          pe: { natura: 10 }
          effetti: { contaminazione: 1.5 }
          segue: circolo-sulla-spirale
        fallimento:
          titolo: La zanna
          testo: |
            Pianti la quarta felce al posto sbagliato, e l'eco ci passa attraverso con il fianco. Ti prende di
            striscio con una zanna di nebbia che taglia come una vera, e la ferita resta fredda per tutta la
            sera. Serha ti tira fuori dall'anello e ti dice di riprovare quando avrai smesso di tremare.
          effetti: { contaminazione: 1.5, ferite: 1 }
      - testo: "Lasciare che Braska tenga ferma la forma"
        descrizione: "Il puma è venuto con te, a distanza. Una forma di cinghiale davanti a un puma si ferma, anche se è di nebbia."
        quando: [braska == 2]
        prova: { attributo: mentale, abilita: natura, difficolta: Media }
        successo:
          titolo: Il puma e la forma
          testo: |
            Braska entra nella radura senza un rumore e si siede davanti all'eco, con la coda che batte. La
            forma si ferma e la guarda, come si fermava il cinghiale vero. Il puma non annusa l'aria nemmeno
            una volta, perché la forma non ha odore. Tu intanto pianti le felci nei buchi, una dopo l'altra.
            Quando l'anello si chiude l'eco si affloscia, e Braska se ne va annoiata. Le mani ti sono
            diventate grigie fino al polso.
          pe: { natura: 10 }
          effetti: { contaminazione: 1.5 }
          segue: circolo-sulla-spirale
        fallimento:
          titolo: Il puma si annoia
          testo: |
            Braska tiene ferma la forma per un po' e poi si annoia. Quando se ne va, l'eco riprende il giro e
            ti trova con le mani nella terra. Ti prende di striscio con una zanna di nebbia, e Serha ti tira
            fuori dall'anello.
          effetti: { contaminazione: 1.5, ferite: 1 }
      - testo: "Scacciare l'eco con l'Esorcismo"
        descrizione: "Il Velo ha parole per quello che non dovrebbe restare. A Serha piacciono poco, e qui funzionano."
        incantesimo: esorcismo
        prova: { attributo: mentale, abilita: magia, difficolta: Difficile }
        successo:
          titolo: Le parole del Velo
          testo: |
            Dici le parole dell'Esorcismo davanti all'eco, e la forma si ferma a metà di un passo, poi si
            sfilaccia dalle zanne in giù. Le zanne sono l'ultima cosa che se ne va. Serha pianta le felci nei
            buchi dell'anello senza commentare. Solo alla fine ti dice che le parole del Velo funzionano, e
            che sulla spirale questo non piacerà a nessuno.
          pe: { magia: 5 }
          effetti: { contaminazione: 1 }
          segue: circolo-sulla-spirale
        fallimento:
          titolo: Le parole a metà
          testo: |
            Le parole ti si impastano in bocca, e l'eco ti carica mentre sei ancora alla seconda strofa. Il
            suo fiato ti arriva in faccia freddo prima del colpo. Serha ti tira fuori dall'anello per il
            colletto.
          effetti: { contaminazione: 1.5, tormento: 1 }
      - testo: "Rinforzare l'anello un pezzo alla volta, per giorni"
        descrizione: "Si lavora piano, restando fuori. Si piantano le felci dal di fuori, a braccio teso, finché l'anello non regge."
        costo: 3
        esito:
          titolo: Tre giorni a braccio teso
          testo: |
            Per tre giorni pianti felci dal di fuori dell'anello, a braccio teso, con l'eco che ti passa
            davanti a ogni giro. La sera ti addormenti con il suo sibilo nelle orecchie, e la mattina lo senti
            ancora quando la radura è già silenziosa. Il terzo giorno l'anello si chiude, e la forma si
            affloscia nel mezzo della radura come un mantice vuoto.
          effetti: { contaminazione: 1.5, tormento: 1 }
          segue: circolo-sulla-spirale
      - testo: "Rispondere al respiro del cinghiale"
        descrizione: "Quel sibilo spezzato l'hai già sentito alla porta nord. Al Circolo si risponde alle bestie con il loro stesso respiro, e poi si rallenta."
        quando: [origine.figlio-del-circolo >= 1]
        esito:
          titolo: Piano, poi più piano
          testo: |
            Ti siedi sul bordo dell'anello e respiri come l'eco, a scatti, con il sibilo in fondo che ti
            graffia la gola. La forma si ferma e ti guarda. Poi rallenti piano, e lei rallenta con te, finché
            si accuccia sulla terra e si affloscia. Serha intanto ha chiuso i buchi dell'anello, e le mani ti
            sono diventate grigie fino al polso senza che tu ti accorgessi di averle messe nella terra.
          pe: { natura: 10 }
          effetti: { contaminazione: 1.5 }
          segue: circolo-sulla-spirale

  - id: circolo-sulla-spirale
    presso: circolo-bosco-di-velthar
    immagine: fazioni/circolo-di-velthar
    titolo: Sulla spirale
    sommario: "Il sigillo regge, e Serha ha capito che cosa copia la Marea. Aelion ti chiama a sedere sulla spirale."
    luogo: Il Bosco di Velthar, il Circolo del Respiro
    area: superficie-fratturata
    tipo: seguito
    requisiti: [fazione.circolo == 5]
    testo: |
      Torni al Circolo con Serha la sera dopo. Lei fa tutta la strada in silenzio con le mani ancora sporche
      della terra dell'anello, e soltanto sulla spirale parla, più alle pietre che a te. Il muschio delle
      pietre è fradicio di vapore, e sotto il muschio la pietra resta tiepida anche dopo il tramonto.

      «La Marea copia quello che respira» dice. «Nella radura ha copiato il cinghiale. Sotto il Bosco e sotto
      la Cicatrice copia qualcosa che ha lo stesso ritmo, ed è per questo che gli impulsi coincidono.» Il
      braccio di legnoscuro le pulsa più forte, e lei ci appoggia sopra l'altra mano.

      {magia Media} Il Mana sale dalla fenditura a ondate, e ogni ondata arriva insieme a uno sbuffo di
      vapore. Due ritmi uguali a una giornata di cammino vogliono dire un solo polmone con due bocche.

      Aelion siede sulla pietra più bassa, e quando Serha ha finito ti indica il posto accanto al suo. Sulla
      spirale i druidi si spostano per fartene uno. La pietra che lasciano libera ha nel muschio due incavi
      lisci, dove qualcuno si è seduto per anni.
    opzioni:
      - testo: "Sederti accanto al Maestro"
        descrizione: "Il posto sulla spirale è il grado di Novizio. Lo si prende sedendosi, e restando."
        esito:
          titolo: Novizio della Spirale
          testo: |
            Ti siedi accanto ad Aelion e resti lì finché il vapore non gira verso di te, e allora lui ti dice
            che da oggi sei Novizio della Spirale. Tharn ti mette in mano un arco di tasso tagliato da un ramo
            caduto da solo, teso con il budello. La corda è ancora unta di sego e ti lascia le dita lucide.
            Serha ti insegna come si purifica una pianta senza diventare una pianta. Il resto della notte lo
            passi sulla pietra, con le gambe che si addormentano prima di te.
          pe: { natura: 5 }
          effetti: { fazione.circolo: 1, oggetto.circolo-arco-di-tasso: 1 }
          almeno: { rep.circolo: 4 }
      - testo: "Chiedere che cosa respira sotto il Bosco"
        descrizione: "Serha l'ha detto alle pietre. Aelion forse lo sa, e forse lo dice."
        prova: { attributo: sociale, abilita: [empatia, espressivita], difficolta: Media }
        successo:
          titolo: Un temporale lontano
          testo: |
            Glielo chiedi per immagini, come si fa qui, con una casa che scricchiola di notte. Aelion ti
            risponde con un temporale che si sente arrivare da tanto lontano che i bambini nel frattempo si
            addormentano. Lo dice guardando la fenditura, e sulle pietre intorno i druidi tengono le mani
            ferme sulle ginocchia. Poi ti dice che da oggi sei Novizio della Spirale. Tharn ti mette in mano
            un arco di tasso teso con il budello, e Serha ti insegna come si purifica una pianta.
          pe: { empatia: 5 }
          effetti: { fazione.circolo: 1, oggetto.circolo-arco-di-tasso: 1, rep.circolo: 0.5 }
          almeno: { rep.circolo: 4 }
        fallimento:
          titolo: La domanda diretta
          testo: |
            Glielo chiedi dritto e senza immagini, e la spirale si irrigidisce tutta insieme. Lo senti dal
            fruscio delle vesti, che si ferma su tutte le pietre nello stesso momento. Aelion lascia passare
            tre sbuffi di vapore. Poi ti dice che da oggi sei Novizio della Spirale, come se la domanda non
            l'avessi fatta. Tharn ti mette in mano un arco di tasso, e Serha ti insegna come si purifica una
            pianta.
          effetti: { fazione.circolo: 1, oggetto.circolo-arco-di-tasso: 1, tormento: 1 }
          almeno: { rep.circolo: 4 }

  # ------------------------------------------------------------ 6 → 7 · quello che restituisce la Spina
  - id: circolo-voren-sulla-strada
    presso: circolo-bosco-di-velthar
    immagine: ambientazione/rovolungo
    titolo: Una parola nella testa
    sommario: "Di notte, sulla strada di Velthar, ti cammina accanto qualcuno che non hai sentito arrivare."
    luogo: La strada di Velthar, di notte
    area: superficie-fratturata
    requisiti: [fazione.circolo == 6]
    testo: |
      Torni dal Bosco di notte, e sotto la luna la strada di Velthar è una striscia chiara fra due valli nere.
      La ghiaia è battuta dalle ruote dei carri e scricchiola a ogni tuo passo. A metà strada ti accorgi di
      avere accanto qualcuno con un cappuccio basso e una tunica grigio-verde. Cammina al tuo passo e non
      l'hai sentito arrivare, e sulla ghiaia i suoi piedi non fanno rumore.

      Ogni volta che provi a guardargli la faccia gli occhi ti scivolano sull'orlo del cappuccio. È Voren,
      quello che al Circolo chiamano Manto di Nebbia e che i novizi nominano a bassa voce. Nei campi ai lati
      della strada i grilli tacciono per un tratto davanti a voi e ricominciano quando siete passati.

      {resilienza Media} Ti preme qualcosa dietro gli occhi, leggero come un dito su una porta chiusa. La
      pressione ti scalda le tempie e lascia fredda la nuca. Se lo lasci entrare, la porta si apre da sola.

      Dentro la testa ti arriva una parola detta con una voce calda e un poco roca. *Spina.* Poi la stessa
      parola di nuovo, un soffio più tardi, con un'altra voce sotto, più lontana.
    opzioni:
      - testo: "Lasciarlo entrare"
        descrizione: "Il dito sulla porta chiusa aspetta. Si può aprire."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Media }
        successo:
          titolo: La strada della Spina
          testo: |
            Smetti di spingere, e la pressione dietro gli occhi si fa un'immagine, un pilastro nero sulla
            pianura con la luna dietro. L'immagine resta anche quando apri gli occhi, sopra la strada vera.
            Voren si stacca dalla strada e prende per i campi verso nord, e tu lo segui fra le stoppie.
          pe: { resilienza: 5 }
          segue: circolo-la-spina-dell-eco
        fallimento:
          titolo: La porta chiusa
          testo: |
            Ti irrigidisci senza volerlo, e la pressione diventa un mal di testa che ti piega in due sul
            ciglio della strada. In bocca hai un sapore di ferro. Quando ti rialzi Voren ti aspetta a dieci
            passi, verso nord, senza fretta. Lo segui con le tempie che pulsano.
          effetti: { tormento: 1 }
          segue: circolo-la-spina-dell-eco
      - testo: "Chiedergli che cosa vuole"
        descrizione: "A voce, perché tu la voce ce l'hai. Lui risponderà come può."
        prova: { attributo: sociale, abilita: [empatia, galateo], difficolta: Media }
        successo:
          titolo: Il gesto
          testo: |
            Glielo chiedi a voce bassa, come si parla accanto a un malato. Voren si ferma, ti prende la mano e
            la volta verso nord, con il palmo in su, come si porge una cosa. Ha le dita fredde e asciutte, e
            le ritira subito. Poi prende per i campi, e tu lo segui.
          pe: { empatia: 5 }
          segue: circolo-la-spina-dell-eco
        fallimento:
          titolo: Troppo forte
          testo: |
            La domanda ti esce troppo forte nel silenzio dei campi, e Voren si ritrae come se l'avessi
            colpito. Da un fosso lì vicino si leva un uccello che se ne va basso sulle stoppie. La pressione
            dietro gli occhi si fa dolore. Quando passa, lui è già a dieci passi verso nord, e ti aspetta.
          effetti: { tormento: 1 }
          segue: circolo-la-spina-dell-eco
      - testo: "Seguirlo senza fare domande"
        descrizione: "Al Circolo nessuno fa domande ai Silenti. Si segue e basta, anche per tutta la notte."
        costo: 2
        esito:
          titolo: Per i campi
          testo: |
            Voren si stacca dalla strada e prende per i campi, e tu gli vai dietro per ore fra i solchi e i
            muretti a secco. Lui li scavalca senza far cadere una pietra, e dietro di te ne rotolano
            parecchie. Quando la luna scende, davanti a te sulla pianura si alza un pilastro nero.
          effetti: { ferite: 0.5 }
          segue: circolo-la-spina-dell-eco

  - id: circolo-la-spina-dell-eco
    presso: circolo-bosco-di-velthar
    immagine: ambientazione/superficie-fratturata
    titolo: La Spina dell'Eco
    sommario: "Un pilastro di pietra nera sulla pianura, che restituisce le voci dopo nove battiti, sbagliate."
    luogo: La pianura verso il Rovolungo, la Spina dell'Eco
    area: superficie-fratturata
    tipo: seguito
    requisiti: [fazione.circolo == 6]
    testo: |
      La Spina dell'Eco è un pilastro di pietra nera alto quanto tre uomini, ritto in mezzo all'erba della
      pianura. È liscia dal piede alla cima e senza una giuntura, e il lichene che copre i sassi della pianura
      non ci si è attaccato da nessuna parte. Ai piedi c'è una buca dove qualcuno ha provato a scavare e si è
      fermato. La terra smossa intorno è già coperta d'erba, e il fondo della buca è asciutto anche se la
      pianura è fradicia di rugiada.

      Voren si ferma a dieci passi dalla Spina e grida un nome di donna, il primo suono che gli senti fare.
      Conti i battiti senza volerlo, e per otto battiti non si sente niente, nemmeno il fruscio dell'erba. Al
      nono battito dalla Spina torna una parola diversa, cantata lenta con una cadenza che ti fa rizzare i
      peli sulle braccia.

      {origine accolito-del-velo} La cadenza la conosci. Al Velo le testimonianze della Notte dei Sussurri si
      leggono in cripta, e dicono tutte che le voci del suolo cantavano così.

      {percezione Difficile} La parola che torna sale da sotto la buca, da più in basso di quanto chiunque
      abbia scavato, e il pilastro la porta su come un camino porta il fumo.

      Voren si volta verso di te e ti indica la Spina con il mento.
    opzioni:
      - testo: "Ascoltare la parola che torna"
        descrizione: "Nove battiti, e poi la parola. Bisogna ascoltarla tutta, anche se entra dove non dovrebbe."
        prova: { attributo: mentale, abilita: percezione, difficolta: Media }
        successo:
          titolo: La parola
          testo: |
            Voren grida il nome un'altra volta, e tu ascolti con tutto il corpo. La parola di quattro sillabe
            torna lenta, e stavolta la prendi intera. Ha le vocali lunghe, e la ripeti a fior di labbra finché
            non ti resta. Voren ti prende la mano e la appoggia sulla terra, accanto alla buca. La stessa
            parola vibra nel suolo, lontana, ripetuta da sotto. Lui annuisce una volta sola e ti fa capire con
            le mani che la devi portare al Circolo Ristretto. Il nome di una città, ti pare di capire. Quella
            su cui il Bosco è cresciuto.
          pe: { percezione: 5 }
          effetti: { fazione.circolo: 1, rep.circolo: 0.5, tormento: 1 }
          imposta: { circolo.parola: 1 }
        fallimento:
          titolo: Il ronzio
          testo: |
            La parola ti arriva confusa, mescolata al sangue che ti batte nelle orecchie, e ne afferri solo la
            cadenza. Voren ti guarda a lungo, poi ti appoggia la mano sulla terra accanto alla buca, e senti
            qualcosa vibrare, lontano. La vibrazione ti sale nel polso e ci resta anche quando stacchi la
            mano. Voren ti fa capire che devi portare al Circolo quello che hai sentito, anche se è poco.
          effetti: { fazione.circolo: 1, tormento: 1.5 }
      - testo: "Gridare il tuo nome"
        descrizione: "Voren ha gridato un nome. Se gridi il tuo, la Spina ti restituirà qualcosa, ed è meglio che sia il tuo."
        prova: { attributo: sociale, abilita: espressivita, difficolta: Difficile }
        successo:
          titolo: Il tuo nome
          testo: |
            Al nono battito la Spina ti restituisce il tuo nome giusto e con la tua voce. Subito dopo torna la
            parola di prima, più bassa, come una risposta. Nel tuo nome, sentito da fuori, c'è un respiro in
            mezzo che tu non hai preso. Voren ti stringe il polso così forte che ti lascia il segno delle
            dita. Poi ti appoggia la mano sulla terra, dove la parola vibra ancora, e ti fa capire che la devi
            portare al Circolo Ristretto. Il nome di una città, quella su cui il Bosco è cresciuto.
          pe: { espressivita: 10 }
          effetti: { fazione.circolo: 1, rep.circolo: 1, tormento: 1 }
          imposta: { circolo.parola: 1 }
        fallimento:
          titolo: Il nome sbagliato
          testo: |
            Gridi il tuo nome, e al nono battito la tua voce torna con un nome che appartiene a un altro. Lo
            dice con la tua voce e con la cadenza lenta della parola di prima. Le mani ti diventano fredde
            fino ai polsi. Voren ti porta via dalla Spina tenendoti per il gomito e senza mai voltarsi. Per
            tutta la strada del ritorno ti senti chiamare da dietro con quel nome.
          effetti: { fazione.circolo: 1, tormento: 1.5 }
      - testo: "Leggere il pilastro con il Mana"
        descrizione: "Se la parola passa dal pilastro, il pilastro ha un canale. Il Mana lo sente."
        prova: { attributo: mentale, abilita: magia, difficolta: Media }
        successo:
          titolo: Il camino
          testo: |
            Appoggi il palmo sulla pietra e lasci che il Mana ti salga nel braccio. La pietra è fredda e non
            si scalda sotto la mano. Il pilastro è vuoto dentro come un camino, e scende molto più giù di
            quanto sia alto. Dal fondo sale la parola, a ondate. La prendi intera, quattro sillabe. Voren ti
            tocca la spalla e ti fa capire che la devi portare al Circolo Ristretto. È il nome di una città,
            quella su cui il Bosco è cresciuto.
          pe: { magia: 5 }
          effetti: { fazione.circolo: 1, rep.circolo: 0.5, tormento: 1 }
          imposta: { circolo.parola: 1 }
        fallimento:
          titolo: La pietra fredda
          testo: |
            La pietra ti risucchia il calore della mano fino al gomito, e il Mana ti torna indietro come un
            pugno. Ti siedi per terra con il braccio intorpidito, e Voren aspetta che passi. Sul palmo hai una
            chiazza bianca e fredda, e il sangue ci torna piano. Voren ti fa capire che devi portare al
            Circolo quello che hai sentito.
          effetti: { fazione.circolo: 1, tormento: 1.5 }
      - testo: "Aspettare l'alba accanto a Voren"
        descrizione: "Lui sa che cosa vuole farti vedere. Basta restare, e non avere fretta."
        costo: 2
        esito:
          titolo: L'alba sulla pianura
          testo: |
            Ti siedi accanto a Voren e aspetti. Lui grida il nome tre volte ancora, a distanza di un'ora, e
            ogni volta la parola torna uguale. Torna con le stesse pause e lo stesso fiato, e sempre al nono
            battito. All'alba ti appoggia la mano sulla terra accanto alla buca, dove la parola vibra ancora
            lontana, e ti fa capire che la devi portare al Circolo Ristretto. È il nome di una città, quella
            su cui il Bosco è cresciuto, e lo porti via con le ossa gelate.
          effetti: { fazione.circolo: 1, tormento: 1, ferite: 0.5 }
          imposta: { circolo.parola: 1 }

  # ------------------------------------------------------------ 7 → 8 · il Circolo Ristretto
  - id: circolo-il-circolo-ristretto
    presso: circolo-bosco-di-velthar
    immagine: fazioni/circolo-di-velthar
    titolo: Il Circolo Ristretto
    sommario: "Le quattro voci del Circolo si riuniscono sulla spirale, e ognuna vuole una cosa diversa dalla stessa ferita."
    luogo: Il Bosco di Velthar, il Circolo del Respiro, di notte
    area: superficie-fratturata
    requisiti: [fazione.circolo == 7]
    testo: |
      Il Circolo Ristretto si riunisce di notte sulle quattro pietre più basse della spirale, con gli altri
      druidi più su, nel buio. Sulla prima siede Aelion, poi Tharn con i lupi ai piedi e Serha con il braccio
      di legnoscuro sul ginocchio. La quarta è vuota, e dietro sta in piedi Voren. Tu siedi sul bordo. Le
      prime tre pietre sono scavate al centro dall'uso, e sulla quarta il muschio è cresciuto fitto e intatto
      fino al bordo.

      {origine figlio-del-circolo} Da bambin{o|a} guardavi il Circolo Ristretto dall'alto della spirale, e la
      quarta pietra era vuota anche allora. Nessuno ti ha mai detto di chi fosse.

      Si parla quando il vapore della fenditura gira verso di te, e al buio lo senti arrivare dal caldo umido
      sulla faccia prima di vederlo. Il primo è Tharn, che vuole bruciare il boschetto grigio prima che il
      grigio arrivi alla spirale. Serha vuole scavare fino al muro precuriano con gli strumenti
      dell'Accademia, e capire. Voren non apre bocca, e nella testa di tutti arriva la stessa immagine.
      Lasciare che il Bosco beva finché guarisce, o finché muore. Sulle pietre più alte i druidi si portano le
      dita alle tempie nello stesso momento.

      Aelion ascolta con gli occhi chiusi. Poi il vapore gira verso di te.
    opzioni:
      - testo: "Stare con Tharn"
        descrizione: "Bruciare il grigio prima che cresca. Per convincere un Irriducibile bisogna dimostrare di saperlo fare."
        prova: { attributo: fisico, abilita: [atletica, armi-da-distanza], difficolta: Media }
        successo:
          titolo: Il fuoco
          testo: |
            Racconti del capobranco e della conca, e di come il grigio salisse dal muro più in fretta di
            quanto camminassi. Poi ti alzi e mostri a Tharn come si accende un fuoco controvento con le mani
            bagnate. La fiamma prende sulla corteccia secca al terzo colpo, e il vapore della fenditura la
            piega senza spegnerla. Lui ride, e i lupi alzano la testa. Sulla prima pietra, intanto, Aelion ha
            aperto gli occhi.
          pe: { atletica: 5 }
          effetti: { rep.circolo: 0.5 }
          segue: circolo-con-chi-passerai-la-luna
        fallimento:
          titolo: Il fuoco che non prende
          testo: |
            Ti alzi per mostrare come si brucia il grigio, e l'esca non ti prende fra le dita umide di vapore.
            Le scintille cadono sul muschio e si spengono una dopo l'altra con un piccolo sfrigolio. Tharn ti
            guarda con simpatia, che è peggio. Quando torni a sederti, Aelion ha aperto gli occhi.
          effetti: { ferite: 0.5 }
          segue: circolo-con-chi-passerai-la-luna
      - testo: "Stare con Serha"
        descrizione: "Scavare e capire. Per convincere i Radicanti bisogna parlare la loro lingua, quella dei registri."
        prova: { attributo: mentale, abilita: [accademiche, tecnologia], difficolta: Media }
        successo:
          titolo: La lettera
          testo: |
            Racconti della curva del Velo e delle incisioni che scendono dentro il muro, e Serha annuisce a
            ogni cosa. Alla fine ti affida una lettera per Orvald Temmerin con le misure delle sue tavole,
            chiusa da una ceralacca verde. La carta è ruvida e pesante, e in controluce si vedono le colonne
            di segni che Serha ha copiato dalla pietra. La consegni all'Accademia la settimana dopo, e Orvald
            la legge tre volte. Sulla spirale, intanto, Aelion ha aperto gli occhi.
          pe: { accademiche: 5 }
          effetti: { rep.circolo: 0.5, rep.accademia: 0.5 }
          segue: circolo-con-chi-passerai-la-luna
        fallimento:
          titolo: Le misure sbagliate
          testo: |
            Citi le misure del muro a memoria e ne sbagli due. Serha ti corregge con dolcezza davanti a tutti
            e senza guardare le tavole, perché le sa a memoria meglio di te. Il vapore gira altrove prima che
            tu abbia finito. Quando alzi lo sguardo, Aelion ha aperto gli occhi.
          effetti: { tormento: 1 }
          segue: circolo-con-chi-passerai-la-luna
      - testo: "Stare con Voren"
        descrizione: "Lasciare bere il Bosco. Per stare con un Silente bisogna reggere la sua voce dentro la testa."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Media }
        successo:
          titolo: La pressione
          testo: |
            Lasci che la voce di Voren ti entri nella testa senza dire niente, e la pressione cresce senza
            fermarsi. Gli occhi ti lacrimano e le dita ti si piantano nel muschio della pietra. La reggi a
            occhi aperti finché lui non la ritira. Sulla spirale qualcuno si schiarisce la gola, e Aelion,
            sulla prima pietra, ha aperto gli occhi.
          pe: { resilienza: 5 }
          effetti: { rep.circolo: 0.5, tormento: 1 }
          segue: circolo-con-chi-passerai-la-luna
        fallimento:
          titolo: Ceduto
          testo: |
            La pressione cresce e tu cedi, piegandoti in avanti con le mani sulle tempie. Voren la ritira
            subito, e nella tua testa resta un vuoto che fa più male della voce. Le orecchie ti fischiano, e
            per un po' il fruscio delle vesti sulla spirale ti arriva da lontano. Quando rialzi la testa,
            Aelion ha aperto gli occhi.
          effetti: { tormento: 1.5 }
          segue: circolo-con-chi-passerai-la-luna
      - testo: "Tacere come Aelion"
        descrizione: "Il Maestro non decide. Si può fare come lui, e lasciare la scelta alla luna che viene."
        costo: 2
        esito:
          titolo: Il silenzio del Maestro
          testo: |
            Quando il vapore gira verso di te resti zitt{o|a}, con le mani sulle ginocchia, e lo lasci
            passare. Ogni volta il caldo umido ti bagna la faccia e ti lascia le ciglia pesanti di gocce. Gira
            tre volte, e tre volte lo lasci passare. Alla terza Aelion apre gli occhi e ti guarda.
          segue: circolo-con-chi-passerai-la-luna
      - testo: "Portare tu la lettera per Orvald"
        descrizione: "All'Accademia ti conoscono, e le misure di Serha le sai leggere meglio di chiunque altro qui."
        quando: [origine.allievo-di-torvessa >= 1]
        esito:
          titolo: La lettera
          testo: |
            Dici a Serha che le misure le porti tu a Orvald, e gliele spieghi come te le spiegherebbe lui, con
            i numeri dei cristalli. Lei ti ascolta con la testa piegata di lato e poi ti affida la lettera con
            la ceralacca verde ancora tiepida. La settimana dopo la consegni nello studio di Orvald, che la
            legge tre volte. Aelion, sulla spirale, apre gli occhi.
          pe: { accademiche: 5 }
          effetti: { rep.circolo: 0.5, rep.accademia: 0.5 }
          segue: circolo-con-chi-passerai-la-luna

  - id: circolo-con-chi-passerai-la-luna
    presso: circolo-bosco-di-velthar
    immagine: fazioni/circolo-di-velthar
    titolo: Con chi passerai la luna
    sommario: "Aelion ti chiede con chi passerai la prossima luna. Al Circolo è il modo di chiedere quale via scegli."
    luogo: Il Bosco di Velthar, il Circolo del Respiro, di notte
    area: superficie-fratturata
    tipo: seguito
    requisiti: [fazione.circolo == 7]
    testo: |
      Aelion ti guarda per la prima volta in tutta la notte, con gli occhi argentei screziati di verde. Da
      vicino il verde gli sta intorno alla pupilla in filamenti sottili, fitti come le venature di una foglia.

      «Con chi passerai la prossima luna?» dice.

      Sulla spirale nessuno si muove. Tharn accarezza la testa di un lupo e Serha guarda la fenditura. Voren è
      sparito, anche se la pressione dietro gli occhi ti dice che è ancora lì. Il lupo sotto la mano di Tharn
      tiene le orecchie girate verso la quarta pietra, dove non c'è nessuno. Gli Irriducibili vivono fra le
      bestie, i Radicanti studiano il Mana e i Silenti si sciolgono nel Bosco.

      {origine figlio-del-circolo} Da bambin{o|a} ti avevano detto che la via si sceglie a vent'anni, e invece
      devi sceglierla adesso.
    opzioni:
      - testo: "Con Tharn e i lupi"
        descrizione: "La via degli Irriducibili. Una luna fra le bestie del margine, a caccia."
        esito:
          titolo: Irriducibile
          testo: |
            Lo dici, e Tharn si alza in piedi senza volerlo. I lupi si alzano con lui, e le unghie grattano
            sulla pietra tutte insieme. Aelion annuisce una volta, e ti dice che la luna comincia domani al
            margine, e che la notte col branco ti insegnerà quello che lui non può.
          effetti: { fazione.circolo: 1, rep.circolo: 0.5 }
          imposta: { circolo.via: 1 }
      - testo: "Con Serha e le tavole"
        descrizione: "La via dei Radicanti. Una luna nell'archivio e nelle rovine, a misurare il Mana."
        esito:
          titolo: Radicante
          testo: |
            Lo dici, e Serha smette di guardare il punto vuoto e guarda te. Il braccio di legnoscuro le pulsa
            una volta con forza, e al gomito la corteccia scricchiola. Aelion annuisce e ti dice che la luna
            comincia domani nell'archivio, e che la vena e il sangue ti insegneranno quello che le tavole non
            dicono.
          effetti: { fazione.circolo: 1, rep.circolo: 0.5 }
          imposta: { circolo.via: 2 }
      - testo: "Con Voren e i Silenti"
        descrizione: "La via dei Silenti. Una luna vicino alla fenditura, a dormire in un tronco."
        esito:
          titolo: Silente
          testo: |
            Lo dici, e la pressione dietro gli occhi si scioglie in un calore lento, come una mano sulla nuca.
            Il lupo di Tharn abbassa le orecchie e si sdraia sulla pietra. Sulla spirale qualcuno smette di
            dondolarsi. Aelion ti guarda a lungo prima di annuire. Ti dice che la luna comincia domani, nel
            tronco cavo accanto alla fenditura, e che le tre notti ti insegneranno quello che nessuno di loro
            sa dire.
          effetti: { fazione.circolo: 1, rep.circolo: 0.5 }
          imposta: { circolo.via: 3 }

  # ------------------------------------------------------------ 8 → 9 · Irriducibili, la notte col branco
  - id: circolo-la-notte-col-branco
    presso: circolo-bosco-di-velthar
    immagine: icone/wolf-howl
    titolo: La notte col branco
    sommario: "Una notte di caccia con i lupi di Tharn, dietro un cervo con le corna di metallo che ha smesso di scappare."
    luogo: Il Bosco di Velthar, il margine nord, di notte
    area: superficie-fratturata
    requisiti: [fazione.circolo == 8, circolo.via == 1]
    testo: |
      La caccia comincia al tramonto sul margine nord, sopra una valle di erba alta. L'erba arriva al petto e
      ha le punte già secche, e quando il vento la piega il fruscio scende fino al fondo della valle. Tharn ha
      fatto sedere i sette lupi del branco in cerchio intorno a te, e uno alla volta ti annusano, a cominciare
      dalla lupa vecchia. Ti annusano le mani e il collo, e hanno il fiato che sa di carne cruda.

      «Il cervo ha le corna di metallo da un inverno» dice. «Non scappa più, e quando lo incontri ti carica.
      Stanotte il branco lo caccia, e tu cacci con il branco. Chi resta indietro passa la notte da solo.»

      Sui tronchi del margine ci sono graffi lunghi e paralleli all'altezza di un uomo, e nel legno è rimasta
      una polvere grigia che luccica.

      Una lupa giovane con una macchia bianca sotto la gola si mette accanto a te. Tharn guarda gli altri lupi
      prima di dire qualcosa, e poi non dice niente.
    opzioni:
      - testo: "Correre con il branco"
        descrizione: "Una notte intera di corsa fra l'erba alta e il bosco, con i lupi che non aspettano."
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Media }
        successo:
          titolo: In fila
          testo: |
            Corri in fila con il branco per tutta la notte, e a un certo punto smetti di contare i passi e di
            sentire le gambe. Alla terza ora la lupa con la macchia bianca ti corre accanto spalla a spalla.
            Senti le sue zampe battere sull'erba allo stesso ritmo dei tuoi piedi. Prima dell'alba il branco
            si ferma, con le orecchie dritte, davanti a una gola di roccia.
          pe: { atletica: 10 }
          segue: circolo-il-cervo-di-metallo
        fallimento:
          titolo: Indietro
          testo: |
            Alla seconda ora le gambe ti mollano, e il branco sparisce nell'erba. Corri a vuoto per un tratto,
            e intorno a te c'è solo il fruscio dell'erba che si richiude. Poi trovi la lupa con la macchia
            bianca che ti aspetta, seduta. Ti porta lei fino alla gola di roccia a passo d'uomo, e ci arrivi
            con i polmoni in fiamme.
          effetti: { ferite: 1 }
          segue: circolo-il-cervo-di-metallo
      - testo: "Seguire le orecchie della lupa"
        descrizione: "La lupa con la macchia bianca ti ha scelto. Se le guardi le orecchie, sai dove va il branco prima di lui."
        prova: { attributo: sociale, abilita: addestrare-animali, difficolta: Media }
        successo:
          titolo: Le orecchie
          testo: |
            Corri accanto alla lupa con gli occhi sulle sue orecchie, e quando si girano giri anche tu. Le
            orecchie girano sempre un passo prima delle zampe, e dopo un'ora anche i tuoi piedi hanno preso
            quel passo di anticipo. Tagliate insieme le curve del branco, e arrivate alla gola di roccia prima
            di Tharn, che vi trova lì seduti ad aspettarlo.
          pe: { addestrare-animali: 10 }
          segue: circolo-il-cervo-di-metallo
        fallimento:
          titolo: La curva sbagliata
          testo: |
            La lupa gira a destra e tu, che guardavi le orecchie sbagliate, giri a sinistra. Nel buio scendi
            in un fosso pieno d'acqua fino alle ginocchia, e ne esci con gli stivali che sciaguattano a ogni
            passo. Ci metti un'ora a ritrovarla, e lei ti accoglie con uno sbuffo dal naso. Arrivate alla gola
            di roccia per ultimi.
          effetti: { ferite: 0.5, tormento: 1 }
          segue: circolo-il-cervo-di-metallo
      - testo: "Restare indietro e seguire le tracce"
        descrizione: "Il branco lascia tracce che anche un cittadino sa leggere, se ha la notte intera e non si vergogna."
        costo: 2
        esito:
          titolo: Le tracce
          testo: |
            Lasci andare il branco e segui le tracce nell'erba piegata, al passo, con la lanterna coperta.
            Dove il branco ha corso l'erba è piegata tutta dalla stessa parte, e dove si è fermato c'è un
            cerchio schiacciato e senza rugiada. Ci metti tutta la notte. All'alba trovi la gola di roccia,
            con il branco seduto davanti, e Tharn che ti guarda arrivare.
          effetti: { ferite: 0.5 }
          segue: circolo-il-cervo-di-metallo

  - id: circolo-il-cervo-di-metallo
    presso: circolo-bosco-di-velthar
    immagine: icone/deer
    titolo: Il cervo dalle corna di metallo
    sommario: "In fondo alla gola il cervo aspetta il branco, con le corna di metallo abbassate."
    luogo: Il Bosco di Velthar, una gola di roccia
    area: superficie-fratturata
    tipo: seguito
    requisiti: [fazione.circolo == 8, circolo.via == 1]
    testo: |
      In fondo alla gola c'è il cervo. Ha il collo largo come un tronco, e al posto delle corna rami di
      metallo grigio che tintinnano quando muove la testa. Dove il metallo esce dal cranio la pelle si è
      ritirata e ha lasciato un anello di carne lucida e senza pelo. Tiene il muso basso e non accenna a
      scappare. Sulla ghiaia intorno a lui non c'è l'impronta di nessun'altra bestia. Il branco si apre a
      ventaglio davanti alla gola, e i lupi si siedono a guardare te.

      {armi-da-distanza Media} Il collo è scoperto, e con la luce dell'alba un tiro buono lo prende lì. Fra te
      e lui ci sono una trentina di passi di ghiaia e niente vento.

      {natura Difficile} Tiene la testa bassa perché le corna pesano troppo, e carica perché con quel peso
      scappare è peggio. Sulle spalle ha piaghe aperte dove le punte lo colpiscono ogni volta che abbassa la
      testa.

      Tharn ti è accanto con l'arco in mano e la freccia non incoccata. Ti dice a bassa voce che il branco ha
      fatto la sua parte e che il resto tocca a te. Non ti dice se lui lo abbatterebbe o lo lascerebbe andare.
    opzioni:
      - testo: "Abbattere il cervo"
        descrizione: "Un cervo con le corna di metallo che carica. Il branco guarda."
        combattimento: circolo-il-cervo-di-metallo
        vittoria:
          titolo: La carne al branco
          testo: |
            Il cervo cade sulla ghiaia e le corna tintinnano un'ultima volta. Tharn ti fa tagliare la carne e
            darla al branco, un pezzo per lupo, cominciando dalla lupa vecchia. Vicino al cranio la carne è
            grigia e dura come cuoio, e Tharn la getta fra le rocce senza darla a nessuno. La lupa con la
            macchia bianca prende il suo pezzo dalla tua mano. Tornate al Circolo a mezzogiorno, e Aelion vi
            aspetta sulla spirale.
          pe: { natura: 5 }
          effetti: { fazione.circolo: 1 }
          almeno: { rep.circolo: 6 }
          segue: circolo-il-nome-della-via
        sconfitta:
          titolo: Le corna
          testo: |
            Il cervo ti prende di fianco con le corna e ti scaglia contro la parete della gola. Lo abbatte
            Tharn, con una freccia sola, mentre ti rialzi. Una punta ti ha aperto il fianco, e la ferita resta
            fredda anche quando comincia a sanguinare. La lupa con la macchia bianca ti lecca il sangue dalla
            mano. Tornate al Circolo a mezzogiorno, e Aelion vi aspetta sulla spirale.
          effetti: { fazione.circolo: 1, tormento: 1 }
          almeno: { rep.circolo: 6 }
          segue: circolo-il-nome-della-via
      - testo: "Lasciarlo andare guidando il branco"
        descrizione: "Un cervo che non scappa più si può rimettere a scappare, se il branco gli lascia la strada. Bisogna muovere sette lupi con la voce."
        prova: { attributo: sociale, abilita: addestrare-animali, difficolta: Difficile }
        successo:
          titolo: La strada aperta
          testo: |
            Chiami il branco con la voce bassa e lo sposti, lupo per lupo, finché a destra della gola non si
            apre un varco. Il cervo lo vede. Alza la testa, piano, con le corna che tintinnano, e se ne va dal
            varco al passo. Lo senti andare per un pezzo, con un tintinnio sempre più debole fra gli alberi.
            Tharn ti guarda a lungo, poi ride. Tornate al Circolo a mezzogiorno, e Aelion vi aspetta sulla
            spirale.
          pe: { addestrare-animali: 10 }
          effetti: { fazione.circolo: 1, rep.circolo: 0.5 }
          almeno: { rep.circolo: 6 }
          segue: circolo-il-nome-della-via
        fallimento:
          titolo: Il branco non ascolta
          testo: |
            Il branco ti ascolta a metà, e il cervo carica nel varco sbagliato, dritto su di te. Ti butti a
            terra e le corna ti passano sopra la schiena, strappandoti il mantello. Ti rialzi con la bocca
            piena di ghiaia, e il lembo che pende dal mantello è tagliato netto come da una lama. Il cervo se
            ne va lo stesso. Tornate al Circolo a mezzogiorno, e Aelion vi aspetta sulla spirale.
          effetti: { fazione.circolo: 1, ferite: 1 }
          almeno: { rep.circolo: 6 }
          segue: circolo-il-nome-della-via
      - testo: "Lasciarlo andare con Richiamo"
        descrizione: "Un cervo che carica capisce il Richiamo, se è fatto bene. Il branco, intanto, deve restare seduto."
        incantesimo: richiamo
        prova: { attributo: mentale, abilita: magia, difficolta: Difficile }
        successo:
          titolo: La strada aperta
          testo: |
            Dici il Richiamo al cervo e lo tieni fermo con le parole, mentre il branco si sposta da solo e
            apre un varco. Sotto il tuo Mana senti quello del cervo che si muove lento, e dove cominciano le
            corna c'è un punto freddo. Il cervo alza la testa e se ne va dal varco al passo, con le corna che
            tintinnano. Tharn ride. Tornate al Circolo a mezzogiorno, e Aelion vi aspetta sulla spirale.
          pe: { magia: 5, addestrare-animali: 5 }
          effetti: { fazione.circolo: 1, rep.circolo: 0.5 }
          almeno: { rep.circolo: 6 }
          segue: circolo-il-nome-della-via
        fallimento:
          titolo: La carica
          testo: |
            Il Richiamo arriva al cervo nel momento in cui carica, e non basta a fermarlo. Le corna ti passano
            a un palmo dal fianco e ti strappano il mantello. Ti passa così vicino che senti l'odore del suo
            pelo, e sotto quell'odore c'è quello del ferro. Il cervo se ne va lo stesso. Tornate al Circolo a
            mezzogiorno, e Aelion vi aspetta sulla spirale.
          effetti: { fazione.circolo: 1, ferite: 1 }
          almeno: { rep.circolo: 6 }
          segue: circolo-il-nome-della-via

  # ------------------------------------------------------------ 8 → 9 · Radicanti, la vena e il sangue
  - id: circolo-la-vena-e-il-sangue
    presso: circolo-bosco-di-velthar
    immagine: ambientazione/cristalli-conduttori
    titolo: La vena e il sangue
    sommario: "Serha vuole travasare la Marea di un cristallo carico dentro una pianta, come fece nel 140. Serve un cristallo, e una mano ferma."
    luogo: Il Bosco di Velthar, l'archivio sotto la spirale
    area: superficie-fratturata
    requisiti: [fazione.circolo == 8, circolo.via == 2]
    testo: |
      Nell'archivio Serha ha messo sul banco di pietra un vaso con una piantina di felce e un ago cavo di
      legnoscuro. L'ago è lungo quanto una mano e ha la punta tagliata di sbieco, e il foro è così sottile che
      bisogna tenerlo controluce per vederci attraverso. Intorno al banco le tavole di pietra stanno
      appoggiate alle pareti, e le più basse hanno i segni consumati dalle dita.

      «Nel 140 l'ho fatto la prima volta» dice. «Ci vogliono un cristallo carico e una pianta, con l'ago in
      mezzo. La pianta beve la Marea del cristallo e la rende innocua. Il Bosco lo fa da solo con le radici,
      noi con le mani quando il Bosco non ce la fa.» Si guarda il braccio di legnoscuro. «A volte le mani ci
      rimettono.»

      {conoscenze-della-strada Facile} Un cristallo carico lo vende Oda Krell nella sua baracca, oppure lo
      tengono sotto il bancone al Nodo d'Ossidiana.

      {origine apprendista-raschiatore} Sulle piattaforme un cristallo carico si tiene con due dita, e Serha
      ti guarda le mani per vedere se lo sai.
    opzioni:
      - testo: "Travasare la Marea del cristallo nella pianta"
        descrizione: "Il cristallo carico si consuma. Il Mana si guida con l'ago, e la Marea che scappa resta a te."
        requisiti: [cristalli.cristallo-carico >= 1]
        prova: { attributo: mentale, abilita: magia, difficolta: Difficile }
        successo:
          titolo: Il travaso
          testo: |
            Pianti l'ago nel cristallo e lo guidi verso la felce con il Mana, un filo alla volta. La Marea
            grigia passa nel legnoscuro come acqua in una radice, e la felce la beve. Il legno dell'ago ti si
            fa freddo fra le dita mentre la Marea ci passa. Le foglie le diventano grigie, poi verdi di nuovo,
            dalla punta. Serha non sbatte le palpebre finché non hai finito.
          pe: { magia: 10 }
          effetti: { cristalli.cristallo-carico: -1, contaminazione: 1.5 }
          segue: circolo-la-vena
        fallimento:
          titolo: Il travaso storto
          testo: |
            L'ago ti scappa a metà, e la Marea esce dal cristallo dalla parte sbagliata, sulle tue dita. Ti
            resta sulla pelle un velo grigio e freddo che non va via strofinando. La felce resta verde, e il
            cristallo è vuoto. Serha ti fascia la mano e ti dice di procurarne un altro.
          effetti: { cristalli.cristallo-carico: -1, contaminazione: 1.5 }
      - testo: "Cercare un cristallo carico nelle rovine con Serha"
        descrizione: "Sotto le radici, dove il Bosco non ha ancora bevuto tutto, qualche cristallo è ancora carico. Ci vogliono giorni, e la Marea di quelle rovine."
        costo: 3
        esito:
          titolo: Il cristallo delle rovine
          testo: |
            Scendi con Serha nelle rovine sotto le radici e cercate per tre giorni fra i cristalli inghiottiti
            dal legno, finché lei non ne sente uno che batte ancora. Le radici hanno avvolto i muri delle
            rovine e ne hanno spaccato i blocchi, e i cristalli stanno incastrati nel legno vivo con gli
            spigoli ancora netti. Il travaso lo fa lei, con le tue mani sotto le sue, e la Marea che scappa
            dall'ago la prendete tutti e due.
          effetti: { contaminazione: 1.5 }
          segue: circolo-la-vena

  - id: circolo-la-vena
    presso: circolo-bosco-di-velthar
    immagine: ambientazione/cristalli-conduttori
    titolo: La vena
    sommario: "La felce ha bevuto, e adesso trema. Sotto la terra del vaso è comparsa una vena di luce."
    luogo: Il Bosco di Velthar, l'archivio sotto la spirale
    area: superficie-fratturata
    tipo: seguito
    requisiti: [fazione.circolo == 8, circolo.via == 2]
    testo: |
      La felce ha bevuto e adesso trema. Le foglie si aprono e si chiudono a scatti, e sulla terra del vaso è
      comparsa una vena di luce azzurra che scende nella terracotta. Dove la vena scende, la terracotta si fa
      chiara e tiepida. Serha la guarda a bocca aperta, con il braccio di legnoscuro stretto al petto.

      «Questa l'ho vista una volta sola, anni fa» dice piano. «Mana puro, senza cristallo. Si è mossa verso di
      me e poi è sparita.» Ti sei punt{o|a} il pollice con l'ago senza accorgertene, e una goccia di sangue
      sta per cadere.

      {magia Difficile} La vena si è girata verso la goccia come la limatura di ferro verso una calamita.
      Senti il Mana dell'archivio scivolare tutto verso il tuo pollice.

      {medicina Media} La felce ha bevuto troppo, e se le togli la terra in eccesso forse ce la fa. Le radici
      premono contro la terracotta e sul fondo hanno già aperto una crepa sottile.
    opzioni:
      - testo: "Salvare la felce"
        descrizione: "La pianta ha bevuto troppo. Bisogna toglierle la terra dalle radici, piano, prima che si spacchi."
        prova: { attributo: mentale, abilita: [medicina, natura], difficolta: Media }
        successo:
          titolo: La felce quieta
          testo: |
            Le togli la terra dalle radici con le dita, un pizzico alla volta, e la felce rallenta finché
            torna ferma come una pianta. La terra che togli è calda, e ti lascia sulle dita una polvere
            azzurra che si spegne in fretta. La vena di luce si spegne nella terracotta. Serha ti prende il
            pollice ferito e ci soffia sopra, poi ti porta sulla spirale, dove Aelion vi aspetta.
          pe: { medicina: 10 }
          effetti: { fazione.circolo: 1 }
          almeno: { rep.circolo: 6 }
          segue: circolo-il-nome-della-via
        fallimento:
          titolo: La foglia spaccata
          testo: |
            Togli troppa terra in una volta, e una foglia si spacca per il lungo con un suono di carta. Dalla
            spaccatura esce una linfa chiara che sa di ferro. La felce vive, con una foglia in meno. Serha non
            dice niente e ti porta sulla spirale, dove Aelion vi aspetta.
          effetti: { fazione.circolo: 1, tormento: 1 }
          almeno: { rep.circolo: 6 }
          segue: circolo-il-nome-della-via
      - testo: "Lasciare che la vena tocchi il tuo sangue"
        descrizione: "La vena si muove verso la goccia. Serha l'ha vista una volta sola, e non ha mai saputo perché."
        prova: { attributo: mentale, abilita: [resilienza, magia], difficolta: Difficile }
        successo:
          titolo: La vena e il sangue
          testo: |
            Lasci cadere la goccia sulla terra del vaso. La vena ci corre sopra e la circonda, e per un
            momento diventa rossa. Poi torna azzurra e ti sale calda lungo il dito, sotto la pelle, fino al
            polso, dove sparisce. Per tutta la notte nel polso ti resta un punto tiepido che batte fuori tempo
            con il cuore. Serha ti afferra il polso con la mano di legnoscuro. Ti chiede di non dirlo a
            nessuno, neanche ad Aelion, con la voce di una donna che ha aspettato trent'anni per rivederlo.
            Poi ti porta sulla spirale, dove Aelion vi aspetta.
          pe: { magia: 10 }
          effetti: { fazione.circolo: 1, tormento: 1 }
          imposta: { circolo.vena: 1 }
          almeno: { rep.circolo: 6 }
          segue: circolo-il-nome-della-via
        fallimento:
          titolo: La vena che morde
          testo: |
            La goccia cade, e la vena ci si getta sopra come un cane affamato. Ti sale fredda nel dito, e ti
            morde dentro fino al gomito prima di spegnersi. Sotto la pelle la vedi risalire lungo le vene del
            braccio, azzurra. Serha ti fascia il braccio con le mani che tremano, poi ti porta sulla spirale,
            dove Aelion vi aspetta.
          effetti: { fazione.circolo: 1, contaminazione: 1.5, ferite: 1 }
          almeno: { rep.circolo: 6 }
          segue: circolo-il-nome-della-via
      - testo: "Lasciare fare a Serha"
        descrizione: "Lei l'ha già visto una volta. Le sue mani sanno che cosa fare meglio delle tue."
        costo: 2
        esito:
          titolo: Le mani di Serha
          testo: |
            Ti fai da parte e lasci il vaso a Serha. Lei toglie la terra in eccesso con il braccio di
            legnoscuro, e le dita di legno scavano nella terra calda senza fretta. La vena di luce si spegne
            prima di arrivare al tuo sangue. Ti guarda il pollice ferito come si guarda un'occasione persa, e
            poi ti porta sulla spirale, dove Aelion vi aspetta.
          effetti: { fazione.circolo: 1 }
          almeno: { rep.circolo: 6 }
          segue: circolo-il-nome-della-via

  # ------------------------------------------------------------ 8 → 9 · Silenti, tre notti nel tronco
  - id: circolo-tre-notti-nel-tronco
    presso: circolo-bosco-di-velthar
    immagine: fazioni/circolo-di-velthar
    titolo: Tre notti nel tronco
    sommario: "Accanto alla fenditura c'è un tronco cavo dove i Silenti dormono la prima volta. Ci si entra la sera e si esce dopo tre notti."
    luogo: Il Bosco di Velthar, il tronco cavo accanto alla fenditura
    area: superficie-fratturata
    requisiti: [fazione.circolo == 8, circolo.via == 3]
    testo: |
      Il tronco cavo sta a venti passi dalla spirale, dal lato dove il vapore della fenditura scende invece di
      salire. Il vapore scorre basso sull'erba fino all'apertura del tronco e ci entra. È un tasso morto da
      secoli e ancora in piedi, con dentro il posto per un uomo seduto con le ginocchia al petto. Fuori la
      corteccia è grigia e si stacca a scaglie, e dentro il legno è scuro e lucidato da chi ci si è seduto
      prima di te. Il legno all'interno è caldo come la pelle di un animale.

      Voren tace anche dentro la tua testa. Ti indica l'apertura e si siede a vegliare sulla radice di fronte.

      {resilienza Media} I novizi dicono che la prima notte è la più lunga. La seconda non la ricorda nessuno,
      e della terza nessuno parla.

      Dentro il tronco l'odore del vapore è più forte, e sotto si sente il ferro caldo delle forge della Città
      Bassa.
    opzioni:
      - testo: "Passare la prima notte senza uscire"
        descrizione: "Il buio, il caldo, il vapore. Si resta dentro fino all'alba, qualunque cosa arrivi."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Difficile }
        successo:
          titolo: La prima notte
          testo: |
            Il buio dentro il tronco si fa così fitto che ti dimentichi dove finiscono le mani. Verso
            mezzanotte il legno comincia a battere piano, come un cuore lontano, e tu lo lasci battere. Il
            battito ti arriva nella schiena prima che nelle orecchie. All'alba esci con le gambe addormentate,
            e Voren è ancora sulla radice nella stessa posizione. Sul suo cappuccio la rugiada è intatta. La
            seconda e la terza notte passano senza che tu riesca a contarle.
          pe: { resilienza: 10 }
          effetti: { tormento: 1 }
          segue: circolo-i-ricordi-non-tuoi
        fallimento:
          titolo: Fuori dal tronco
          testo: |
            Verso mezzanotte il legno comincia a battere, e tu esci di corsa a quattro zampe e ti graffi le
            mani sulla corteccia. Voren ti guarda dalla radice, poi ti indica l'apertura un'altra volta.
            Rientri, e il legno è ancora caldo del tuo corpo. Le tre notti ricominciano da capo, e stavolta le
            passi tutte, con le unghie piantate nel legno.
          effetti: { tormento: 1.5 }
          segue: circolo-i-ricordi-non-tuoi
      - testo: "Dormire con una candela accesa"
        descrizione: "Una candela tiene lontano il buio, e al Circolo nessuno lo ha vietato. Le notti però diventano sei."
        costo: 3
        esito:
          titolo: Sei notti
          testo: |
            Accendi una candela e la tieni fra le ginocchia, e il legno non batte finché la fiamma resta
            accesa. La fiamma sta dritta anche quando il vapore entra dall'apertura, e illumina un palmo di
            legno lucido intorno a te. Alla quarta notte la candela finisce, e le notti vere cominciano solo
            allora. Esci dal tronco dopo sei notti, con la cera sulle dita e la testa vuota.
          effetti: { tormento: 1.5 }
          segue: circolo-i-ricordi-non-tuoi

  - id: circolo-i-ricordi-non-tuoi
    presso: circolo-bosco-di-velthar
    immagine: fazioni/circolo-di-velthar
    titolo: I ricordi non tuoi
    sommario: "La terza notte nel tronco ti arrivano ricordi che non sono tuoi, di qualcuno che è stato qui molto tempo fa."
    luogo: Il Bosco di Velthar, il tronco cavo accanto alla fenditura
    area: superficie-fratturata
    tipo: seguito
    requisiti: [fazione.circolo == 8, circolo.via == 3]
    testo: |
      La terza notte arrivano i ricordi. Sei una bambina sdraiata ai piedi di un albero di metallo. Hai le
      mani piccole e sporche di terra, e il tronco si muove sotto le dita come la pelle di un cavallo. Il
      metallo è tiepido, e sotto il palmo della bambina batte piano. Dai rami sale un vapore azzurro, e tu
      dormi lì per tre notti con il branco intorno. L'ultima notte, nel buio sotto l'albero, ci sono due occhi
      dorati senza pupille.

      {percezione Media} Il branco intorno alla bambina è di lupi, e uno ha sulla gola la macchia bianca che
      hai visto altrove.

      All'alba Voren ti aspetta davanti all'apertura. Ti posa la mano sulla fronte, e per la prima volta la
      sua voce ti arriva nella testa con le parole intere a dirti che adesso sai parlare come i Silenti.
    opzioni:
      - testo: "Guardare il ricordo fino in fondo"
        descrizione: "Gli occhi dorati, il vapore, l'albero. Si può tenere il ricordo e guardarlo, invece di lasciarlo andare."
        prova: { attributo: mentale, abilita: percezione, difficolta: Media }
        successo:
          titolo: Il ricordo tenuto
          testo: |
            Tieni il ricordo come si tiene una lettera sotto la luce, e lo guardi da ogni lato. Quello che ti
            resta è il posto, una cavità calda sotto la fenditura. Ha lo stesso caldo umido del vapore che
            sale sulla spirale. Voren lo vede nella tua testa, e la sua mano sulla fronte si fa pesante. Ti
            accompagna sulla spirale, dove Aelion ti aspetta.
          pe: { percezione: 10 }
          effetti: { fazione.circolo: 1, tormento: 1 }
          imposta: { circolo.sussurro: 1 }
          almeno: { rep.circolo: 6 }
          segue: circolo-il-nome-della-via
        fallimento:
          titolo: Il ricordo che scappa
          testo: |
            Provi a tenerlo, e il ricordo ti scappa come l'acqua dalle mani, lasciandoti solo gli occhi
            dorati. Quelli non se ne vanno, e li vedi ancora quando chiudi le palpebre. Voren ti tiene la mano
            sulla fronte finché smetti di tremare, e poi ti accompagna sulla spirale, dove Aelion ti aspetta.
          effetti: { fazione.circolo: 1, tormento: 1.5 }
          imposta: { circolo.sussurro: 1 }
          almeno: { rep.circolo: 6 }
          segue: circolo-il-nome-della-via
      - testo: "Lasciarlo andare"
        descrizione: "Non è tuo, e non sei obbligat{o|a} a tenerlo. I Silenti dicono che i ricordi del Bosco tornano quando servono."
        esito:
          titolo: Il ricordo restituito
          testo: |
            Lasci andare il ricordo, e il ricordo se ne va senza voltarsi, come una persona che esce da una
            stanza. Ti restano il freddo nelle mani e la voce di Voren nella testa. Ti guardi le mani e sono
            di nuovo le tue, anche se sotto le unghie hai la terra. Lui ti accompagna sulla spirale, dove
            Aelion ti aspetta.
          effetti: { fazione.circolo: 1, tormento: 1 }
          imposta: { circolo.sussurro: 1 }
          almeno: { rep.circolo: 6 }
          segue: circolo-il-nome-della-via

  # ------------------------------------------------------------ 9 · il nome della via e il dono
  - id: circolo-il-nome-della-via
    presso: circolo-bosco-di-velthar
    immagine: fazioni/circolo-di-velthar
    titolo: Il nome della via
    sommario: "Sulla spirale Aelion ti dà il nome della tua via, e la via ti dà il suo dono."
    luogo: Il Bosco di Velthar, il Circolo del Respiro
    area: superficie-fratturata
    tipo: seguito
    requisiti: [fazione.circolo == 9]
    testo: |
      Aelion ti aspetta a un passo dalla fenditura e ti posa le dita sulla fronte come si sente la febbre a un
      bambino. Sulla spirale ci sono tutti. Aelion dice il nome della tua via una volta sola, e i druidi lo
      ripetono a mezza voce uno dopo l'altro. Il nome scende la spirale di pietra in pietra, dall'alto fino
      alla fenditura.

      Poi si gira verso sud, dove il grigio non si è ritirato. Sopra gli alberi del sud l'aria ha una foschia
      color cenere che il vento non sposta.

      «Il grigio è ancora lì» dice. «Il Bosco non si muove finché non arriva un tuono, e un tuono così lo
      sentiremo tutti.»

      {politica-ed-economia Facile} Da Iniziato hai un posto nei lavori del Circolo e le lezioni dei druidi
      anziani.
    opzioni:
      - testo: "Accogliere la lupa con la macchia bianca"
        descrizione: "La lupa giovane ti ha scelto la notte della caccia. Tharn dice che si chiama Fumo, e che adesso è tua."
        quando: [circolo.via == 1, braska != 2]
        esito:
          titolo: Fumo
          testo: |
            Tharn ti porta la lupa con la macchia bianca sulla gola e te la lascia ai piedi, senza guinzaglio.
            Prima di lasciarla guarda gli altri lupi, e nessuno si alza. Dice che si chiama Fumo, e che da
            oggi corre con te. Lei ti annusa la mano e si siede alla tua sinistra, mezzo passo avanti, dove
            resterà.
          effetti: { oggetto.circolo-lupa-brina: 1 }
      - testo: "Accogliere Braska"
        descrizione: "Il puma della Foresta Strisciante è venuto fino al margine, e i lupi gli hanno fatto spazio."
        quando: [circolo.via == 1, braska == 2]
        esito:
          titolo: Braska
          testo: |
            Al margine i lupi di Tharn si fanno da parte tutti insieme, con le orecchie basse. Dall'erba alta
            esce Braska, nera con i fianchi rossi, e si siede davanti a te come se avesse un appuntamento.
            Tharn dice che il Bosco ha scelto per lui, e che non si discute. Da oggi Braska va dove vai tu,
            sempre un poco prima di te.
          effetti: { oggetto.circolo-braska: 1 }
      - testo: "Ricevere l'innesto di legnoscuro"
        descrizione: "Serha ti innesta una vena di legnoscuro sotto la pelle dell'avambraccio, e da lì non si toglie più."
        quando: [circolo.via == 2]
        esito:
          titolo: L'innesto
          testo: |
            Serha ti incide l'avambraccio con un ago di legnoscuro e ci infila una vena di legno scuro e
            sottile, lunga come un dito. La vena si attacca alla carne da sola e comincia a pulsare con il tuo
            cuore. Sotto la pelle resta una riga più scura che si gonfia a ogni battito. Fa male per una
            notte. Il mattino dopo il Mana ti passa nel braccio come l'acqua in una radice.
          effetti: { oggetto.circolo-innesto-di-legnoscuro: 1, ferite: 0.5 }
      - testo: "Prendere il cappuccio dei Silenti"
        descrizione: "Sulla pietra accanto alla tua qualcuno ha lasciato un cappuccio grigio-verde. Nessuno ti dice di chi era."
        quando: [circolo.via == 3]
        esito:
          titolo: Il cappuccio
          testo: |
            Prendi il cappuccio dalla pietra e te lo metti. La lana è calda e sa di vapore, e l'orlo è
            consumato e lucido sul davanti, dove altre mani lo hanno tirato giù sugli occhi. Quando alzi gli
            occhi i druidi sulla spirale ti guardano come si guarda qualcuno di cui non si ricorda bene la
            faccia. Voren, dietro di tutti, abbassa il mento di un dito.
          effetti: { oggetto.circolo-cappuccio-di-nebbia: 1 }
      - testo: "Prendere il cappuccio, e lasciare che il Bosco ti tenga la mente"
        descrizione: "I Silenti offrono anche una mente silenziosa, che il Tormento scalfisce meno e che degli altri sente meno. Una volta presa, resta."
        quando: [circolo.via == 3, mutazione.mente-silenziosa == 0]
        esito:
          titolo: La mente silenziosa
          testo: |
            Prendi il cappuccio dalla pietra e te lo metti, e Voren ti posa la mano sulla nuca. Qualcosa nella
            testa si abbassa, come una fiamma quando chiudi la porta, e il rumore dei pensieri degli altri si
            fa lontano. Le paure sono più lontane anche loro, e anche il fruscio del vapore ti arriva
            attutito. Sulla spirale i druidi ti guardano come si guarda qualcuno di cui non si ricorda bene la
            faccia.
          effetti: { oggetto.circolo-cappuccio-di-nebbia: 1 }
          imposta: { mutazione.mente-silenziosa: 1 }

  # ------------------------------------------------------------ 9 → 10 · l'Albero si è riacceso
  - id: circolo-l-albero-si-e-riacceso
    presso: circolo-bosco-di-velthar
    immagine: fazioni/circolo-di-velthar
    titolo: L'Albero si è riacceso
    sommario: "Il giorno in cui è caduto il Costruttore la fenditura ha soffiato vapore azzurro per un'ora. Aelion ti racconta perché."
    luogo: Il Bosco di Velthar, il Circolo del Respiro
    area: superficie-fratturata
    requisiti: [fazione.circolo == 9, pista.capomozzo >= 7, circolo.acceso == 0]
    testo: |
      A sud il grigio ha fatto un salto di cento passi in una notte. Al mattino il nuovo confine si legge
      sulle cortecce, che ieri erano scure e oggi hanno il colore della cenere fredda fino all'altezza di un
      uomo. I lupi di Tharn dormono al margine nord con il muso girato dalla parte opposta al grigio.

      Aelion ti porta dietro le pietre dove il vapore non arriva e il muschio resta asciutto. Lì per la prima
      volta parla senza immagini.

      «Il giorno in cui il Costruttore è caduto a Capomozzo la fenditura ha soffiato vapore azzurro per
      un'ora» dice. «Tanti inverni fa una bambina del branco dormì tre notti accanto a un albero di metallo
      vivo, sotto la fenditura. Poi l'albero si chiuse e lei non lo ritrovò più. Allora era acceso, e adesso
      lo è di nuovo.» «La Madre del Velo ha detto che le rovine si sono ricordate i loro nomi. Lei pensava
      alle sue cripte, e invece è successo qui sotto.»

      {accademiche Media} Le cronache della Caduta dicono che quando una macchina dei Precursori tace l'altra
      risponde. Non dicono quanto lontano arrivi la risposta, e nemmeno dopo quanto tempo.

      {origine figlio-del-circolo} Da piccol{o|a} ti hanno raccontato la storia della bambina del branco come
      una favola per dormire.

      Stamattina il vapore che sale dalla fenditura è più caldo del solito, e lascia sulle pietre della
      spirale gocce tiepide anche all'ombra. Per scendere nella fenditura serve una corda che non si tagli.
    opzioni:
      - testo: "Chiedere dove sta l'Albero"
        descrizione: "Sotto la fenditura, ha detto. Bisogna sapere quanto sotto, e che cosa c'è in mezzo."
        esito:
          titolo: Sotto la spirale
          testo: |
            Aelion ti dice il poco che sa. Sotto la fenditura c'è una gola calda, e sotto la gola la città su
            cui il Bosco è cresciuto, con le case piene di terra fino al soffitto. L'Albero sta ancora più
            giù. Le corde normali si tagliano da sole a metà strada. Quella che serve la può intrecciare Serha
            con le radici vive, oppure ce l'hanno i Raschiatori che scendono nel Labirinto. Anche Oda Krell,
            nella sua baracca, potrebbe averne una.
          imposta: { circolo.acceso: 1 }
      - testo: "Indossare la Maschera della Natura"
        descrizione: "La maschera lega la carne alla macchina. Qui, vicino a un albero di metallo che respira, forse ti dice qualcosa."
        requisiti: [oggetto.maschera-della-natura >= 1]
        esito:
          titolo: Il Bosco si piega
          testo: |
            Ti metti la maschera di corteccia nera, e il Bosco intorno si piega verso di te. I rami bassi
            scendono fino a sfiorarti le spalle, e dentro la maschera la corteccia si scalda contro la faccia.
            Aelion fa un passo indietro e per la prima volta ti guarda con paura. Quando te la togli ti
            tremano le mani. Sai dove sta l'Albero, adesso, sotto la gola calda, e sai che per arrivarci serve
            una corda che non si tagli.
          pe: { magia: 5 }
          effetti: { tormento: 1 }
          imposta: { circolo.acceso: 1 }
      - testo: "Rispondere ad Aelion a chi credi quando nessuno guarda"
        descrizione: "Al Velo hai dato molto, e Aelion lo sa. Prima di dirti dove scendere ti fa una domanda sola."
        quando: [rep.velo >= 5]
        prova: { attributo: sociale, abilita: [empatia, persuasione], difficolta: Media }
        successo:
          titolo: Quando nessuno guarda
          testo: |
            Aelion ti chiede a chi credi quando nessuno guarda. Gli rispondi senza girarci intorno, e lui
            ascolta fino in fondo senza staccarti gli occhi di dosso. Poi annuisce una volta sola e ti dice
            dove sta l'Albero, sotto la gola calda, e che per arrivarci serve una corda che non si tagli. La
            può intrecciare Serha, o la può avere chi scende nel Labirinto.
          pe: { empatia: 5 }
          effetti: { rep.circolo: 0.5 }
          imposta: { circolo.acceso: 1 }
        fallimento:
          titolo: La risposta preparata
          testo: |
            Gli rispondi con una frase che suona bene, e lui sente che l'avevi preparata. Ti guarda a lungo, e
            intanto dalla fenditura passano due sbuffi di vapore. Poi ti dice lo stesso dove sta l'Albero,
            sotto la gola calda, e che serve una corda che non si tagli. Lo dice con la voce di uno che ha
            deciso di fidarsi a metà.
          effetti: { tormento: 1 }
          imposta: { circolo.acceso: 1 }

  - id: circolo-la-corda-di-radici
    presso: circolo-bosco-di-velthar
    immagine: icone/rope-coil
    titolo: La corda di radici vive
    sommario: "Serha sa intrecciare una corda con le radici vive del Bosco, che non si taglia perché ricresce."
    luogo: Il Bosco di Velthar, l'archivio sotto la spirale
    area: superficie-fratturata
    requisiti: [fazione.circolo == 9, circolo.acceso == 1]
    testo: |
      Sul banco di pietra dell'archivio Serha ha già cominciato a intrecciare fasci di radici bianche di
      salice. Sono ancora vive e umide, e quando le tocchi si stringono piano intorno alle dita. Serha le
      prende a tre a tre con la mano buona e tiene ferma la treccia con il braccio di legnoscuro, che pulsa
      contro le radici al ritmo del suo cuore. Ai suoi piedi ci sono già dieci passi di corda avvolti in
      cerchio sulla pietra bagnata.

      «La canapa si taglia perché giù c'è qualcosa che taglia» dice. «Anche le radici si tagliano, e poi
      ricrescono. Ne servono duecento passi, e da sola ci metto un mese.»

      {natura Media} Le radici vanno intrecciate da vive e bagnate di continuo. Se seccano a metà, la corda si
      spezza nel punto secco.

      {resistenza Facile} Duecento passi di treccia sono giorni di mani nell'acqua fredda. Basta toccarla una
      volta perché le dita ti diventino rigide fino alle nocche.
    opzioni:
      - testo: "Intrecciare con Serha"
        descrizione: "Tre radici alla volta, bagnate, senza lasciarle seccare. Giorni di lavoro, e un occhio attento."
        costo: 2
        prova: { attributo: mentale, abilita: natura, difficolta: Difficile }
        successo:
          titolo: Duecento passi
          testo: |
            Intrecciate per cinque giorni seduti uno di fronte all'altra, bagnando le radici con una spugna
            ogni dieci giri. Dal terzo giorno le radici smettono di ritirarsi dalle tue dita. La sera del
            quinto giorno la corda bianca è lunga duecento passi. È tiepida al tatto, e quando la pieghi si
            raddrizza da sola. La notte stessa dalla pianura sale un vento basso che odora di ferro.
          pe: { natura: 10 }
          effetti: { fazione.circolo: 1, rep.circolo: 0.5, oggetto.circolo-corda-della-fenditura: 1 }
        fallimento:
          titolo: Il punto secco
          testo: |
            Al terzo giorno lasci seccare un tratto di treccia mentre mangi, e quando Serha lo tira la corda
            si spezza nel punto secco con un suono di ramo. I due capi sono grigi e duri, e lei li taglia via
            con il coltello. Si ricomincia da quel punto, e le mani ti si screpolano fino a sanguinare.
          effetti: { ferite: 0.5, tormento: 1 }
      - testo: "Bagnare le radici per un mese"
        descrizione: "Se non sai intrecciare, puoi tenere bagnate le radici mentre intreccia Serha per un mese intero, anche di notte."
        costo: 3
        esito:
          titolo: Un mese con la spugna
          testo: |
            Per un mese tieni bagnate le radici con la spugna mentre Serha intreccia, e dormi accanto al banco
            per non lasciarle seccare di notte. Al buio le senti muoversi contro la pietra del banco, con un
            fruscio lento che non si ferma mai. Alla fine la corda è lunga duecento passi, e tu hai le mani
            bianche e grinzose come quelle di una lavandaia. La notte stessa dalla pianura sale un vento basso
            che odora di ferro.
          effetti: { fazione.circolo: 1, oggetto.circolo-corda-della-fenditura: 1, ferite: 0.5, tormento: 1 }

  - id: circolo-la-corda-dei-raschiatori
    presso: grifone-di-ferro
    immagine: personaggi/dragna-gro-malog
    titolo: Una corda dai Raschiatori
    sommario: "I Raschiatori scendono nel Labirinto con corde che reggono dove le altre si tagliano. Dragna Gro-Malog le presta, se le dici dove scendi."
    luogo: Locanda del Grifone di Ferro, il tavolo di Dragna
    area: ponti-sospesi
    requisiti: [fazione.circolo == 9, circolo.acceso == 1]
    testo: |
      Dragna Gro-Malog occupa il suo solito tavolo in fondo alla sala, con un boccale davanti e il gomito
      piantato apposta su una mappa del Labirinto. La mappa è disegnata su una pelle conciata, e nel punto
      dove il gomito si appoggia l'inchiostro è sparito del tutto. Le chiedi una corda per scendere dove le
      corde si tagliano da sole.

      «Le corde dei Raschiatori hanno l'anima di filo di lyssan e reggono dove le altre si tagliano» dice. «Le
      vendo solo alle squadre, e tu non sei una squadra.» Si pulisce la schiuma dal labbro. «Se mi dici dove
      scendi, ne parliamo.»

      {conoscenze-della-strada Media} Dove scende uno che chiede una corda così ci sono cose da raschiare, e
      il prezzo della corda è il posto.

      {origine apprendista-raschiatore} Il primo giorno sulle piattaforme ti hanno dato una corda come questa,
      con l'ordine di riportarla anche se tu non torni, e Dragna se lo ricorda bene.
    opzioni:
      - testo: "Dirle dove scendi"
        descrizione: "Il Bosco di Velthar, sotto la fenditura. Dragna ti darà la corda, e i Raschiatori sapranno dove andare."
        esito:
          titolo: Il posto
          testo: |
            Glielo dici. Dragna non scrive niente, e non serve, perché te lo fa ripetere due volte e lo impara
            a memoria. Ti dà una matassa di duecento passi di corda con l'anima di lyssan. La matassa è unta
            di grasso e pesa più di quanto sembri. Ti dice che i suoi ti aspetteranno al margine, per
            sicurezza. La notte stessa, tornando al Bosco, senti dalla pianura un vento basso che odora di
            ferro.
          effetti: { fazione.circolo: 1, rep.raschiatori: 1, rep.circolo: -0.5, oggetto.circolo-corda-della-fenditura: 1 }
          imposta: { circolo.dragna: 1 }
      - testo: "Convincerla senza dirle dove"
        descrizione: "Una squadra di uno resta una squadra. Bisogna farglielo credere."
        prova: { attributo: sociale, abilita: [persuasione, conoscenze-della-strada], difficolta: Media }
        successo:
          titolo: Una squadra di uno
          testo: |
            Le dici che scendi da sol{o|a} dove i Raschiatori non scendono, e che se torni le racconti che
            cosa c'era. Dragna ride forte una volta sola, e mezza sala si volta. Ti dà duecento passi di corda
            e ti fa pagare soltanto il filo di lyssan, che conta sul tavolo con il pollice senza guardare le
            monete. La notte stessa, tornando al Bosco, senti dalla pianura un vento basso che odora di ferro.
          pe: { persuasione: 5 }
          effetti: { fazione.circolo: 1, rep.circolo: 0.5, monete: -20, oggetto.circolo-corda-della-fenditura: 1 }
        fallimento:
          titolo: Il gomito sulla mappa
          testo: |
            Dragna ti ascolta fino in fondo con il gomito sulla mappa, poi torna al suo boccale. La corda
            resta dov'è, e mezza sala ha sentito che non ti è stata data. Quando ti alzi le voci ai tavoli
            vicini ripartono tutte insieme.
          effetti: { scandalo: 1 }
      - testo: "Chiederla come una volta sulle piattaforme"
        descrizione: "La corda l'hai già riportata una volta, anche quando la squadra non è tornata. Dragna lo sa."
        quando: [origine.apprendista-raschiatore >= 1]
        esito:
          titolo: La corda riportata
          testo: |
            Le ricordi la corda del primo giorno, e Dragna smette di bere. Posa il boccale sulla mappa e va
            nel retro, e torna con una matassa di duecento passi dall'anima di lyssan. Ti fa pagare il filo e
            nient'altro, e ti dice di riportarla anche se tu non torni. La notte stessa, tornando al Bosco,
            senti dalla pianura un vento basso che odora di ferro.
          pe: { conoscenze-della-strada: 5 }
          effetti: { fazione.circolo: 1, rep.circolo: 0.5, monete: -20, oggetto.circolo-corda-della-fenditura: 1 }

  - id: circolo-la-corda-di-oda
    presso: baracca-di-oda
    immagine: ambientazione/orlo-dei-rottami
    titolo: La corda di Oda Krell
    sommario: "Fra i ferrivecchi di Oda Krell c'è una corda precuriana di filo grigio. Lei la vende, e il prezzo è alto."
    luogo: Superficie Fratturata, la baracca di Oda Krell
    area: superficie-fratturata
    requisiti: [fazione.circolo == 9, circolo.acceso == 1]
    testo: |
      Oda Krell ti ascolta seduta al banco da lavoro, con la gamba di legno allungata verso la stufa e una
      tazza calda fra le mani. Il legno della gamba è annerito dal lato della stufa e chiaro dall'altro.
      Quando nomini una corda che non si tagli si alza e zoppica fino a una cassa in fondo alla baracca. Ne
      tira fuori una matassa di filo grigio pesante come una catena, e la posa sul banco con un tonfo sordo.

      «Precuriana» dice. «L'ho trovata in uno scavo e non sono mai riuscita a tagliarla. Ci ho appeso due
      muli, e regge qualunque cosa ci sia sotto il tuo Bosco.» Si rimette a sedere e beve. «Costa cara. Mi
      tiene compagnia da trent'anni.»

      La matassa sta sul banco a un palmo dalla stufa. Quando ci posi la mano il filo è freddo, e resta freddo
      anche dopo che ce l'hai tenuta sopra un po'.

      {ingannare Media} Oda è sola da troppo tempo, e per lei una bella storia vale quanto mezzo prezzo.
    opzioni:
      - testo: "Pagare il prezzo pieno"
        descrizione: "Una borsa pesante. La corda regge due muli, e Oda non tratta."
        requisiti: [monete >= 120]
        esito:
          titolo: Il prezzo pieno
          testo: |
            Conti le monete sul banco, e Oda le guarda senza contarle. Ti mette in mano la matassa, e il peso
            ti tira giù il braccio fino al gomito. Ti chiede di tornare a raccontarle che cosa c'era sotto.
            Tornando al Bosco, la notte stessa, senti dalla pianura un vento basso che odora di ferro.
          effetti: { fazione.circolo: 1, rep.circolo: 0.5, monete: -120, oggetto.circolo-corda-della-fenditura: 1 }
      - testo: "Raccontarle che serve per un pozzo"
        descrizione: "Un pozzo fondo, una famiglia senz'acqua, un bambino malato. Oda ama le storie, e forse fa lo sconto."
        prova: { attributo: sociale, abilita: [ingannare, espressivita], difficolta: Media }
        successo:
          titolo: Il pozzo
          testo: |
            Le racconti del pozzo e della famiglia che ci beve, e Oda ti ascolta con la tazza ferma a metà
            strada finché il tè non si fredda. Alla fine ti dà la corda per metà del prezzo. Mentre conti le
            monete ti dice che la storia era brutta ma raccontata bene. La notte stessa, tornando al Bosco,
            senti dalla pianura un vento basso che odora di ferro.
          pe: { ingannare: 5 }
          effetti: { fazione.circolo: 1, rep.circolo: 0.5, monete: -60, oggetto.circolo-corda-della-fenditura: 1 }
        fallimento:
          titolo: Il bambino di troppo
          testo: |
            Al bambino malato Oda posa la tazza sul banco. Ti dice che i pozzi della Superficie li conosce
            tutti uno per uno, e che il tuo non esiste. Rimette la corda nella cassa e ti offre da bere lo
            stesso, perché la compagnia è compagnia.
          effetti: { scandalo: 1 }
