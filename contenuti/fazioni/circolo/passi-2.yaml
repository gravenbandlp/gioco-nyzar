# La quest del Circolo di Velthar, passi 6-10 (fazione.circolo 5 → 10).
# 6 La radura sigillata (grado 2, pista.corin >= 3): l'eco nella radura della Foresta Strisciante, poi la spirale.
#   Con braska == 2 il puma tiene ferma la forma; il Figlio del Circolo riconosce il cinghiale della porta nord.
# 7 Quello che restituisce la Spina: Voren di notte sulla strada di Velthar, poi la Spina dell'Eco (circolo.parola).
# 8 Il Circolo Ristretto: si sostiene una voce (o si tace), poi si sceglie la via (circolo.via).
# 9 La prova della via (grado 3): due scene per via (Irriducibili la notte col branco, Radicanti la vena e il sangue,
#   Silenti tre notti nel tronco), poi `circolo-il-nome-della-via`, dove Aelion dà il nome e il dono.
# 10 L'Albero si è riacceso (pista.capomozzo >= 7): Aelion racconta (circolo.acceso), poi la corda per la fenditura
#   si trova in tre posti: Serha al Bosco, Dragna al Grifone di Ferro, Oda Krell nella sua baracca.
storylet:
  # ------------------------------------------------------------ 5 → 6 · la radura sigillata
  - id: circolo-la-radura-sigillata
    presso: circolo-bosco-di-velthar
    immagine: ambientazione/foresta-strisciante
    titolo: La radura sigillata
    sommario: "Nella Foresta Strisciante un anello di piante che bevono la Marea chiude una radura, ma metà sono secche, e dentro qualcosa respira."
    luogo: Foresta Strisciante, la radura del cinghiale
    area: superficie-fratturata
    requisiti: [fazione.circolo == 5, pista.corin >= 3]
    testo: |
      Serha ti accompagna alla Foresta Strisciante con un sacco di piantine avvolte nel muschio sulla spalla buona. Alla radura dove Corin Ashdale ha abbattuto il cinghiale il Circolo ha piantato un anello di felci e ortiche largo trenta passi, per
      tenere dentro la Marea che il cinghiale ha lasciato morendo.

      Metà dell'anello è secca, e le felci si sbriciolano come carta bruciata. Nel mezzo la Marea si è rappresa in una forma con il muso e le zanne di un cinghiale, con le vene sotto una pelle di nebbia, e gira lungo l'anello cercando il punto dove le
      piante sono morte.

      {natura Media} La Marea ha imparato la forma dal cinghiale morto qui, e la ripete come un bambino ripete una parola che non capisce.

      {origine figlio-del-circolo} Il respiro spezzato, con il sibilo in fondo, è quello del cinghiale della porta nord il giorno del Festival, che guidavano con il dolore.

      «Se esce dall'anello, impara la Foresta» dice Serha, e apre il sacco delle piantine.
    opzioni:
      - testo: "Combattere l'eco"
        descrizione: "Una forma di Marea che carica e si richiude come acqua, e che l'Esorcismo forse ferisce più del ferro."
        combattimento: circolo-l-eco-della-radura
        vittoria:
          titolo: La forma che si disfa
          testo: |
            L'eco si disfa sotto i colpi dalle zanne al muso, finché resta un soffio che si posa sulla terra come brina. Serha
            pianta le felci nuove nei buchi dell'anello e poi guarda a lungo la terra dove l'eco si è posata.
          effetti: { contaminazione: 1 }
          segue: circolo-sulla-spirale
        sconfitta:
          titolo: La nebbia addosso
          testo: |
            L'eco ti passa attraverso, e per un lungo momento respiri con lei, a scatti. Serha ti trascina fuori per il
            colletto e ti tiene la testa fra le ginocchia finché non tossisci tutto, e per riprovare ci vorrà almeno un
            giorno.
          effetti: { contaminazione: 1.5, tormento: 1 }
      - testo: "Riseminare l'anello mentre l'eco gira"
        descrizione: "Le piantine di Serha vanno messe nei buchi dell'anello mentre la forma passa a due passi."
        prova: { attributo: mentale, abilita: natura, difficolta: Difficile }
        successo:
          titolo: L'anello chiuso
          testo: |
            Pianti le felci contando i passi dell'eco per non trovartela davanti,
            e quando l'ultimo buco si chiude la forma si affloscia come un
            mantice. Le mani ti sono diventate grigie fino al polso.
          pe: { natura: 10 }
          effetti: { contaminazione: 1.5 }
          segue: circolo-sulla-spirale
        fallimento:
          titolo: La zanna
          testo: |
            La quarta felce va al posto sbagliato, e l'eco ti prende di striscio
            con una zanna di nebbia che taglia come una vera. Serha ti tira fuori
            dall'anello e ti dice di riprovare quando avrai smesso di tremare.
          effetti: { contaminazione: 1.5, ferite: 1 }
      - testo: "Lasciare che Braska tenga ferma la forma"
        descrizione: "Il puma ti ha seguito a distanza, e un cinghiale si ferma davanti a un puma anche se è di nebbia."
        quando: [braska == 2]
        prova: { attributo: mentale, abilita: natura, difficolta: Media }
        successo:
          titolo: Il puma e la forma
          testo: |
            Braska si siede davanti all'eco con la coda che batte, e la forma si
            ferma a guardarla come faceva il cinghiale vero. Quando l'anello si
            chiude l'eco si affloscia e Braska se ne va annoiata, lasciandoti le
            mani grigie fino al polso.
          pe: { natura: 10 }
          effetti: { contaminazione: 1.5 }
          segue: circolo-sulla-spirale
        fallimento:
          titolo: Il puma si annoia
          testo: |
            Braska si annoia prima del tempo, e quando se ne va l'eco ti trova con le mani nella terra e ti prende di striscio con una
            zanna di nebbia.
          effetti: { contaminazione: 1.5, ferite: 1 }
      - testo: "Scacciare l'eco con l'Esorcismo"
        descrizione: "Il Velo ha parole per scacciare ciò che dovrebbe andarsene, e a Serha piacciono poco."
        incantesimo: esorcismo
        prova: { attributo: mentale, abilita: magia, difficolta: Difficile }
        successo:
          titolo: Le parole del Velo
          testo: |
            All'Esorcismo la forma si ferma a metà di un passo e si sfilaccia
            dalle zanne in giù. Serha pianta le felci senza commentare, e solo
            alla fine ti dice che le parole del Velo funzionano, ed è proprio
            questo il problema.
          pe: { magia: 5 }
          effetti: { contaminazione: 1 }
          segue: circolo-sulla-spirale
        fallimento:
          titolo: Le parole a metà
          testo: |
            Le parole ti si impastano in bocca, e l'eco ti carica alla seconda
            strofa finché Serha ti tira fuori per il colletto.
          effetti: { contaminazione: 1.5, tormento: 1 }
      - testo: "Rinforzare l'anello un pezzo alla volta, per giorni"
        descrizione: "Si piantano le felci dal di fuori, a braccio teso, finché l'anello non regge."
        costo: 3
        esito:
          titolo: Tre giorni a braccio teso
          testo: |
            Per tre giorni pianti felci a braccio teso, con l'eco che ti passa
            davanti a ogni giro e il suo sibilo nelle orecchie anche la notte. Il
            terzo giorno l'anello si chiude, e la forma si affloscia come un
            mantice vuoto.
          effetti: { contaminazione: 1.5, tormento: 1 }
          segue: circolo-sulla-spirale
      - testo: "Rispondere al respiro del cinghiale"
        descrizione: "Quel sibilo spezzato l'hai già sentito alla porta nord, e al Circolo si risponde alle bestie con il loro respiro."
        quando: [origine.figlio-del-circolo >= 1]
        esito:
          titolo: Piano, poi più piano
          testo: |
            Ti siedi sul bordo dell'anello e respiri come l'eco, a scatti, finché la forma si ferma a guardarti. Poi
            rallenti, e lei rallenta con te fino ad accucciarsi sulla terra. Serha intanto ha chiuso i buchi, e le tue mani
            sono grigie fino al polso senza che tu ti sia accorto di averle messe nella terra.
          pe: { natura: 10 }
          effetti: { contaminazione: 1.5 }
          segue: circolo-sulla-spirale

  - id: circolo-sulla-spirale
    presso: circolo-bosco-di-velthar
    immagine: fazioni/circolo-di-velthar
    titolo: Sulla spirale
    sommario: "Il sigillo regge, Serha ha capito che cosa copia la Marea, e Aelion ti chiama a sedere sulla spirale."
    luogo: Il Bosco di Velthar, il Circolo del Respiro
    area: superficie-fratturata
    tipo: seguito
    requisiti: [fazione.circolo == 5]
    testo: |
      Torni al Circolo con Serha la sera dopo, quando il vapore della
      fenditura sale dritto, e soltanto sulla spirale lei parla, rivolta più
      alle pietre che a te.

      «La Marea copia quello che respira» dice. «Nella radura ha copiato il
      cinghiale. Sotto il Bosco, e sotto la Cicatrice, copia qualcosa che ha
      lo stesso ritmo, ed è per questo che gli impulsi coincidono.» Il
      braccio di legnoscuro le pulsa più forte.

      {magia Media} Due ritmi uguali a una giornata di cammino l'uno
      dall'altro vogliono dire un solo polmone con due bocche.

      Aelion, seduto sulla pietra più bassa, ti indica quella accanto alla
      sua, e i druidi si spostano di un posto per fartene uno.
    opzioni:
      - testo: "Sederti accanto al Maestro"
        descrizione: "Il posto sulla spirale è il grado di Novizio, e lo si prende sedendosi e restando."
        esito:
          titolo: Novizio della Spirale
          testo: |
            Resti accanto ad Aelion finché il vapore non gira verso di te, e lui
            ti fa Novizio della Spirale. Tharn ti mette in mano un arco di tasso
            tagliato da un ramo caduto da solo, e Serha ti insegna come si
            purifica una pianta senza diventare una pianta.
          pe: { natura: 5 }
          effetti: { fazione.circolo: 1, oggetto.circolo-arco-di-tasso: 1 }
          almeno: { rep.circolo: 4 }
      - testo: "Chiedere che cosa respira sotto il Bosco"
        descrizione: "Serha l'ha detto alle pietre, e forse Aelion lo sa."
        prova: { attributo: sociale, abilita: [empatia, espressivita], difficolta: Media }
        successo:
          titolo: Un temporale lontano
          testo: |
            Glielo chiedi per immagini, con una casa che scricchiola di notte, e
            Aelion ti risponde con un temporale che arriva da così lontano che i
            bambini nel frattempo si addormentano. Poi ti fa Novizio della
            Spirale. Tharn ti dà un arco di tasso, e Serha ti insegna come si
            purifica una pianta.

            {empatia Media} Sa che cosa c'è sotto il Bosco, e spera che arrivi
            dopo di lui.
          pe: { empatia: 5 }
          effetti: { fazione.circolo: 1, oggetto.circolo-arco-di-tasso: 1, rep.circolo: 0.5 }
          almeno: { rep.circolo: 4 }
        fallimento:
          titolo: La domanda diretta
          testo: |
            Glielo chiedi dritto e la spirale si irrigidisce tutta insieme. Aelion
            lascia passare tre sbuffi di vapore e ti fa Novizio della Spirale come
            se la domanda non l'avessi fatta. Tharn ti dà un arco di tasso, e
            Serha ti insegna come si purifica una pianta.
          effetti: { fazione.circolo: 1, oggetto.circolo-arco-di-tasso: 1, tormento: 1 }
          almeno: { rep.circolo: 4 }

  # ------------------------------------------------------------ 6 → 7 · quello che restituisce la Spina
  - id: circolo-voren-sulla-strada
    presso: circolo-bosco-di-velthar
    immagine: ambientazione/rovolungo
    titolo: Una parola nella testa
    sommario: "Di notte, sulla strada di Velthar, ti cammina accanto qualcuno che non hai sentito arrivare."
    luogo: La strada di Velthar, di notte
    area: superficie-fratturata
    requisiti: [fazione.circolo == 6]
    testo: |
      Torni dal Bosco di notte, sulla strada di Velthar chiara sotto la luna, e a metà strada ti accorgi di avere qualcuno accanto, al tuo passo, con un
      cappuccio basso e una tunica grigio-verde. Ogni volta che provi a guardargli la faccia gli occhi ti scivolano sulla spalla o sulla strada. È Voren,
      quello che al Circolo chiamano Manto di Nebbia.

      {resilienza Media} Ti preme qualcosa dietro gli occhi, leggero, come un dito su una porta chiusa che si aprirebbe da sola.

      Dentro la testa, senza passare dalle orecchie, ti arriva una parola sola con una voce calda e un poco roca. *Spina.* Poi la stessa parola un'altra volta,
      con un'altra voce sotto, più lontana.

      {accademiche Facile} La Spina dell'Eco sta sulla pianura verso il Rovolungo, e restituisce le voci dopo nove battiti, sbagliate.
    opzioni:
      - testo: "Lasciarlo entrare"
        descrizione: "Il dito sulla porta chiusa aspetta che tu la apra."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Media }
        successo:
          titolo: La strada della Spina
          testo: |
            Smetti di spingere, e la pressione dietro gli occhi si fa un'immagine, un
            pilastro nero sulla pianura con la luna dietro. Voren prende per i campi
            verso nord, e tu lo segui.
          pe: { resilienza: 5 }
          segue: circolo-la-spina-dell-eco
        fallimento:
          titolo: La porta chiusa
          testo: |
            Ti irrigidisci e la pressione diventa un mal di testa che ti piega in
            due. Quando ti rialzi Voren ti aspetta a dieci passi verso nord, e lo
            segui con le tempie che pulsano.
          effetti: { tormento: 1 }
          segue: circolo-la-spina-dell-eco
      - testo: "Chiedergli che cosa vuole"
        descrizione: "A voce, perché tu la voce ce l'hai, e lui risponderà come può."
        prova: { attributo: sociale, abilita: [empatia, galateo], difficolta: Media }
        successo:
          titolo: Il gesto
          testo: |
            Glielo chiedi a voce bassa, come accanto a un malato. Voren ti volta
            la mano verso nord, con il palmo in su, come si porge una cosa, poi
            prende per i campi, e tu lo segui.
          pe: { empatia: 5 }
          segue: circolo-la-spina-dell-eco
        fallimento:
          titolo: Troppo forte
          testo: |
            La domanda ti esce troppo forte nel silenzio, e Voren si ritrae come
            se l'avessi colpito. Quando il dolore dietro gli occhi passa, lui ti
            aspetta a dieci passi verso nord.
          effetti: { tormento: 1 }
          segue: circolo-la-spina-dell-eco
      - testo: "Seguirlo senza fare domande"
        descrizione: "Al Circolo nessuno fa domande ai Silenti, anche se si cammina tutta la notte."
        costo: 2
        esito:
          titolo: Per i campi
          testo: |
            Gli vai dietro per ore fra solchi e muretti, finché la luna scende e
            sulla pianura si alza un pilastro nero.
          effetti: { ferite: 0.5 }
          segue: circolo-la-spina-dell-eco

  - id: circolo-la-spina-dell-eco
    presso: circolo-bosco-di-velthar
    immagine: ambientazione/superficie-fratturata
    titolo: La Spina dell'Eco
    sommario: "Un pilastro di pietra nera sulla pianura, che restituisce le voci dopo nove battiti, sbagliate."
    luogo: La pianura verso il Rovolungo, la Spina dell'Eco
    area: superficie-fratturata
    tipo: seguito
    requisiti: [fazione.circolo == 6]
    testo: |
      La Spina dell'Eco è un pilastro di pietra nera alto quanto tre uomini, ritto in mezzo all'erba come un dito puntato, e la luna
      ci scivola sopra senza riflettersi. Ai piedi qualcuno ha scavato una buca larga un palmo e si è fermato.

      Voren alza la testa e grida un nome di donna, con la voce rauca di chi non parla da anni. Al nono battito dalla Spina torna
      una parola sola, che non è il nome, cantata lenta, con una cadenza che ti fa rizzare i peli sulle braccia.

      {origine accolito-del-velo} Al Velo le testimonianze della Notte dei Sussurri si leggono in cripta, e dicono tutte che le voci
      del suolo cantavano così.

      {percezione Difficile} La parola arriva da sotto la buca, e il pilastro la porta su come un camino porta su il fumo.

      Voren ti indica la Spina con il mento.
    opzioni:
      - testo: "Ascoltare la parola che torna"
        descrizione: "Nove battiti e poi la parola, da ascoltare tutta anche se entra dove non dovrebbe."
        prova: { attributo: mentale, abilita: percezione, difficolta: Media }
        successo:
          titolo: La parola
          testo: |
            Al secondo grido di Voren la parola di quattro sillabe torna lenta e intera. Lui ti appoggia la mano sulla terra accanto alla buca, dove la stessa parola vibra lontana, e con le mani ti fa capire che la devi portare al Circolo Ristretto. Ti pare il nome
            della città su cui il Bosco è cresciuto.
          pe: { percezione: 5 }
          effetti: { fazione.circolo: 1, rep.circolo: 0.5, tormento: 1 }
          imposta: { circolo.parola: 1 }
        fallimento:
          titolo: Il ronzio
          testo: |
            La parola ti arriva mescolata al sangue che batte nelle orecchie, e ne
            afferri solo la cadenza. Voren ti appoggia la mano sulla terra accanto
            alla buca, dove qualcosa vibra lontano, e ti fa capire di portare al
            Circolo quel poco che hai sentito.
          effetti: { fazione.circolo: 1, tormento: 1.5 }
      - testo: "Gridare il tuo nome"
        descrizione: "Se gridi il tuo nome la Spina ti restituirà qualcosa, ed è meglio che sia il tuo."
        prova: { attributo: sociale, abilita: espressivita, difficolta: Difficile }
        successo:
          titolo: Il tuo nome
          testo: |
            Al nono battito la Spina ti restituisce il tuo nome giusto e subito
            dopo la parola di prima, più bassa, come una risposta. Voren ti
            stringe il polso fino a lasciarti il segno e ti appoggia la mano sulla
            terra dove la parola vibra ancora. La devi portare al Circolo
            Ristretto, perché è il nome della città su cui il Bosco è cresciuto.
          pe: { espressivita: 10 }
          effetti: { fazione.circolo: 1, rep.circolo: 1, tormento: 1 }
          imposta: { circolo.parola: 1 }
        fallimento:
          titolo: Il nome sbagliato
          testo: |
            Al nono battito la tua voce torna con il nome di un altro. Voren ti porta via tenendoti per il gomito, e per tutta la strada del
            ritorno ti senti chiamare da dietro con quel nome.
          effetti: { fazione.circolo: 1, tormento: 1.5 }
      - testo: "Leggere il pilastro con il Mana"
        descrizione: "Se la parola passa dal pilastro, il pilastro ha un canale che il Mana sente."
        prova: { attributo: mentale, abilita: magia, difficolta: Media }
        successo:
          titolo: Il camino
          testo: |
            Con il palmo sulla pietra lasci salire il Mana nel braccio, e il
            pilastro si rivela vuoto come un camino e profondo molto più di quanto
            sia alto. Dal fondo sale a ondate la parola di quattro sillabe, il
            nome della città su cui il Bosco è cresciuto, e Voren ti tocca la
            spalla perché la porti al Circolo Ristretto.
          pe: { magia: 5 }
          effetti: { fazione.circolo: 1, rep.circolo: 0.5, tormento: 1 }
          imposta: { circolo.parola: 1 }
        fallimento:
          titolo: La pietra fredda
          testo: |
            La pietra ti risucchia il calore fino al gomito e il Mana ti torna
            indietro come un pugno. Voren aspetta che passi, poi ti fa capire di
            portare al Circolo quello che hai sentito.
          effetti: { fazione.circolo: 1, tormento: 1.5 }
      - testo: "Aspettare l'alba accanto a Voren"
        descrizione: "Lui sa che cosa vuole farti vedere, e basta restare."
        costo: 2
        esito:
          titolo: L'alba sulla pianura
          testo: |
            Voren grida il nome ancora tre volte, a un'ora di distanza, e la parola torna sempre uguale. All'alba ti appoggia la mano sulla terra dove vibra ancora e ti fa capire di portarla al Circolo Ristretto, il nome della città su cui il Bosco è cresciuto.
          effetti: { fazione.circolo: 1, tormento: 1, ferite: 0.5 }
          imposta: { circolo.parola: 1 }

  # ------------------------------------------------------------ 7 → 8 · il Circolo Ristretto
  - id: circolo-il-circolo-ristretto
    presso: circolo-bosco-di-velthar
    immagine: fazioni/circolo-di-velthar
    titolo: Il Circolo Ristretto
    sommario: "Le quattro voci del Circolo si riuniscono sulla spirale, e ognuna vuole una cosa diversa dalla stessa ferita."
    luogo: Il Bosco di Velthar, il Circolo del Respiro, di notte
    area: superficie-fratturata
    requisiti: [fazione.circolo == 7]
    testo: |
      Il Circolo Ristretto si riunisce di notte sulle quattro pietre più basse della spirale. Aelion siede sulla prima, accanto a lui Tharn con i lupi ai piedi, poi Serha. La quarta è vuota, e Voren sta in piedi dietro. Tu siedi sul bordo.

      {origine figlio-del-circolo} Da bambino guardavi il Circolo Ristretto dal punto più alto della spirale, e la quarta pietra era vuota anche allora.

      Si parla a turno, quando il vapore gira. Tharn vuole bruciare il boschetto grigio fino alle radici, prima che il grigio arrivi alla spirale. Serha vuole scavare fino al muro dei Precursori con gli strumenti dell'Accademia, e capire. Voren non apre bocca, e nella testa di tutti arriva la stessa immagine, lasciare che il Bosco beva finché guarisce, o finché muore.

      Aelion ascolta a occhi chiusi, poi il vapore gira verso di te.
    opzioni:
      - testo: "Stare con Tharn"
        descrizione: "Bruciare il grigio prima che cresca, dimostrando a un Irriducibile di saperlo fare."
        prova: { attributo: fisico, abilita: [atletica, armi-da-distanza], difficolta: Media }
        successo:
          titolo: Il fuoco
          testo: |
            Racconti del capobranco e del grigio che saliva dal muro più in fretta di quanto camminassi, poi mostri a
            Tharn come si accende un fuoco controvento con le mani bagnate. Tharn ride, i lupi alzano la testa, e
            sulla prima pietra Aelion ha aperto gli occhi.
          pe: { atletica: 5 }
          effetti: { rep.circolo: 0.5 }
          segue: circolo-con-chi-passerai-la-luna
        fallimento:
          titolo: Il fuoco che non prende
          testo: |
            L'esca non ti prende fra le dita umide di vapore, e Tharn ti guarda con una simpatia che è peggio. Quando torni a sederti, Aelion
            ha aperto gli occhi.
          effetti: { ferite: 0.5 }
          segue: circolo-con-chi-passerai-la-luna
      - testo: "Stare con Serha"
        descrizione: "Scavare e capire, parlando ai Radicanti la lingua dei registri."
        prova: { attributo: mentale, abilita: [accademiche, tecnologia], difficolta: Media }
        successo:
          titolo: La lettera
          testo: |
            Racconti della curva del Velo e delle incisioni che scendono dentro il muro, e Serha ti affida una lettera per Orvald Temmerin con le misure delle sue tavole, chiusa da una ceralacca verde. Orvald, la settimana dopo, la legge tre volte. Sulla spirale, intanto, Aelion ha aperto gli occhi.
          pe: { accademiche: 5 }
          effetti: { rep.circolo: 0.5, rep.accademia: 0.5 }
          segue: circolo-con-chi-passerai-la-luna
        fallimento:
          titolo: Le misure sbagliate
          testo: |
            Citi le misure del muro a memoria e ne sbagli due, e Serha ti corregge con dolcezza davanti a tutti. Quando alzi lo sguardo, Aelion ha aperto gli occhi.
          effetti: { tormento: 1 }
          segue: circolo-con-chi-passerai-la-luna
      - testo: "Stare con Voren"
        descrizione: "Lasciare bere il Bosco, reggendo dentro la testa la voce di un Silente."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Media }
        successo:
          titolo: La pressione
          testo: |
            Lasci entrare la voce di Voren e reggi la pressione a occhi aperti finché lui non la ritira. Qualcuno sulla spirale si schiarisce la gola, e Aelion ha aperto gli occhi.
          pe: { resilienza: 5 }
          effetti: { rep.circolo: 0.5, tormento: 1 }
          segue: circolo-con-chi-passerai-la-luna
        fallimento:
          titolo: Ceduto
          testo: |
            La pressione cresce e cedi, con le mani sulle tempie. Voren la ritira subito, lasciandoti un vuoto che fa più male della voce, e Aelion ha aperto gli
            occhi.
          effetti: { tormento: 1.5 }
          segue: circolo-con-chi-passerai-la-luna
      - testo: "Tacere come Aelion"
        descrizione: "Il Maestro tace, e si può tacere come lui."
        costo: 2
        esito:
          titolo: Il silenzio del Maestro
          testo: |
            Ogni volta che il vapore gira verso di te resti zitto, con le mani
            sulle ginocchia, e alla terza Aelion apre gli occhi e ti guarda.
          segue: circolo-con-chi-passerai-la-luna
      - testo: "Portare tu la lettera per Orvald"
        descrizione: "All'Accademia ti conoscono, e le misure di Serha le sai leggere meglio di chiunque qui."
        quando: [origine.allievo-di-torvessa >= 1]
        esito:
          titolo: La lettera
          testo: |
            Le misure a Orvald le porti tu, e le spieghi come farebbe lui, con i
            numeri dei cristalli. Serha ti affida la lettera con la ceralacca
            verde, e la settimana dopo Orvald la legge tre volte nel suo studio.
            Sulla spirale Aelion apre gli occhi.
          pe: { accademiche: 5 }
          effetti: { rep.circolo: 0.5, rep.accademia: 0.5 }
          segue: circolo-con-chi-passerai-la-luna

  - id: circolo-con-chi-passerai-la-luna
    presso: circolo-bosco-di-velthar
    immagine: fazioni/circolo-di-velthar
    titolo: Con chi passerai la luna
    sommario: "Aelion ti chiede con chi passerai la prossima luna, che al Circolo è il modo di chiedere quale via scegli."
    luogo: Il Bosco di Velthar, il Circolo del Respiro, di notte
    area: superficie-fratturata
    tipo: seguito
    requisiti: [fazione.circolo == 7]
    testo: |
      Aelion ti guarda per la prima volta da quando è cominciata la notte,
      con gli occhi argentei screziati di verde.

      «Con chi passerai la prossima luna?» dice.

      Tharn accarezza la testa di un lupo, Serha guarda un punto vuoto sulla
      fenditura, e Voren è sparito, anche se la pressione dietro gli occhi
      ti dice che è ancora lì. Gli Irriducibili vivono fra le bestie, i
      Radicanti studiano il Mana, i Silenti si sciolgono nel Bosco.

      {origine figlio-del-circolo} Da bambino ti avevano detto che la via si
      sceglie a vent'anni, e qualcuno ha deciso di farti scegliere adesso.
    opzioni:
      - testo: "Con Tharn e i lupi"
        descrizione: "La via degli Irriducibili, una luna fra le bestie del margine, a caccia."
        esito:
          titolo: Irriducibile
          testo: |
            Tharn si alza in piedi senza volerlo, e i lupi con lui. Aelion annuisce e ti dice che la luna comincia domani al
            margine, e che la notte col branco ti insegnerà quello che lui non può.
          effetti: { fazione.circolo: 1, rep.circolo: 0.5 }
          imposta: { circolo.via: 1 }
      - testo: "Con Serha e le tavole"
        descrizione: "La via dei Radicanti, una luna nell'archivio a misurare il Mana."
        esito:
          titolo: Radicante
          testo: |
            Serha smette di guardare il punto vuoto e guarda te, con il braccio di legnoscuro che pulsa forte una volta. Aelion ti dice che
            la luna comincia domani nell'archivio, e che la vena e il sangue ti insegneranno quello che le tavole non dicono.
          effetti: { fazione.circolo: 1, rep.circolo: 0.5 }
          imposta: { circolo.via: 2 }
      - testo: "Con Voren e i Silenti"
        descrizione: "La via dei Silenti, una luna vicino alla fenditura, a dormire in un tronco."
        esito:
          titolo: Silente
          testo: |
            La pressione dietro gli occhi si scioglie in un calore lento, come una mano sulla nuca. Aelion ti dice che la luna comincia
            domani, nel tronco cavo accanto alla fenditura, e che le tre notti ti insegneranno quello che nessuno di loro sa dire.
          effetti: { fazione.circolo: 1, rep.circolo: 0.5 }
          imposta: { circolo.via: 3 }

  # ------------------------------------------------------------ 8 → 9 · Irriducibili, la notte col branco
  - id: circolo-la-notte-col-branco
    presso: circolo-bosco-di-velthar
    immagine: icone/wolf-howl
    titolo: La notte col branco
    sommario: "Una notte di caccia con i lupi di Tharn, dietro un cervo con le corna di metallo che ha smesso di scappare."
    luogo: Il Bosco di Velthar, il margine nord, di notte
    area: superficie-fratturata
    requisiti: [fazione.circolo == 8, circolo.via == 1]
    testo: |
      La caccia comincia al tramonto sul margine nord, dove il Bosco scende in una valle di erba alta, e i sette lupi del branco ti annusano uno
      alla volta, cominciando dalla lupa vecchia.

      «Il cervo ha le corna di metallo da un inverno» dice Tharn. «Non scappa più, e quando lo incontri ti carica. Stanotte il branco lo caccia,
      e tu cacci con il branco. Chi resta indietro passa la notte da solo.»

      {addestrare-animali Media} I lupi corrono in fila, e chi sta in fondo sente dove va il primo dalle orecchie di quello davanti.

      Una lupa giovane, grigia con una macchia bianca sotto la gola, si mette accanto a te invece che nella fila, e Tharn la guarda senza dire
      niente.
    opzioni:
      - testo: "Correre con il branco"
        descrizione: "Una notte intera di corsa fra l'erba alta e il bosco, con i lupi che non aspettano."
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Media }
        successo:
          titolo: In fila
          testo: |
            Corri in fila con il branco finché smetti di sentire le gambe, e alla
            terza ora la lupa con la macchia bianca ti corre accanto spalla a
            spalla. Prima dell'alba il branco si ferma, con le orecchie dritte,
            davanti a una gola di roccia.
          pe: { atletica: 10 }
          segue: circolo-il-cervo-di-metallo
        fallimento:
          titolo: Indietro
          testo: |
            Alla seconda ora le gambe ti mollano e il branco sparisce nell'erba. La lupa con la macchia bianca ti aspetta seduta e ti
            porta lei alla gola di roccia, a passo d'uomo.
          effetti: { ferite: 1 }
          segue: circolo-il-cervo-di-metallo
      - testo: "Seguire le orecchie della lupa"
        descrizione: "La lupa con la macchia bianca ti ha scelto, e dalle sue orecchie sai dove va il branco prima di lui."
        prova: { attributo: sociale, abilita: addestrare-animali, difficolta: Media }
        successo:
          titolo: Le orecchie
          testo: |
            Corri accanto alla lupa con gli occhi sulle sue orecchie, e insieme
            tagliate le curve del branco fino alla gola di roccia, dove Tharn vi
            trova seduti ad aspettarlo.
          pe: { addestrare-animali: 10 }
          segue: circolo-il-cervo-di-metallo
        fallimento:
          titolo: La curva sbagliata
          testo: |
            Guardi le orecchie sbagliate e giri dalla parte opposta, e ci metti
            un'ora a ritrovare la lupa, che ti accoglie con uno sbuffo. Arrivate
            alla gola di roccia per ultimi.
          effetti: { ferite: 0.5, tormento: 1 }
          segue: circolo-il-cervo-di-metallo
      - testo: "Restare indietro e seguire le tracce"
        descrizione: "Il branco lascia tracce che anche un cittadino sa leggere, se ha la notte intera."
        costo: 2
        esito:
          titolo: Le tracce
          testo: |
            Segui al passo l'erba piegata, con la lanterna coperta, per tutta la
            notte, e all'alba trovi la gola di roccia con il branco seduto davanti
            e Tharn che ti guarda arrivare.
          effetti: { ferite: 0.5 }
          segue: circolo-il-cervo-di-metallo

  - id: circolo-il-cervo-di-metallo
    presso: circolo-bosco-di-velthar
    immagine: icone/deer
    titolo: Il cervo dalle corna di metallo
    sommario: "In fondo alla gola il cervo aspetta il branco, con le corna di metallo abbassate."
    luogo: Il Bosco di Velthar, una gola di roccia
    area: superficie-fratturata
    tipo: seguito
    requisiti: [fazione.circolo == 8, circolo.via == 1]
    testo: |
      In fondo alla gola c'è il cervo, con il collo largo come un tronco e le corna diventate rami di metallo grigio, ramificati come una lampada da chiesa, che tintinnano quando muove la
      testa. Ha il muso basso e non accenna a scappare. Il branco si apre a ventaglio e si siede, tutto insieme, a guardare te.

      {armi-da-distanza Media} Il collo è scoperto, e la luce dell'alba gli batte sul fianco sinistro, dove lo prende un tiro buono.

      {natura Difficile} Le corna gli pesano. Tiene la testa bassa perché non riesce più ad alzarla, e carica perché scappare con quel peso è peggio.

      Tharn, con la freccia non incoccata, ti dice a bassa voce che il branco ha fatto la sua parte. Puoi abbatterlo o lasciarlo andare, e si può sbagliare in tutti e due i modi.
    opzioni:
      - testo: "Abbattere il cervo"
        descrizione: "Un cervo con le corna di metallo che carica, con il branco che guarda."
        combattimento: circolo-il-cervo-di-metallo
        vittoria:
          titolo: La carne al branco
          testo: |
            Il cervo cade sulla ghiaia con un ultimo tintinnio. Tharn ti fa dare
            la carne al branco, un pezzo per lupo, cominciando dalla lupa vecchia,
            e la lupa con la macchia bianca prende il suo dalla tua mano. A
            mezzogiorno Aelion vi aspetta sulla spirale.
          pe: { natura: 5 }
          effetti: { fazione.circolo: 1 }
          almeno: { rep.circolo: 6 }
          segue: circolo-il-nome-della-via
        sconfitta:
          titolo: Le corna
          testo: |
            Il cervo ti scaglia contro la parete della gola, e lo abbatte Tharn
            con una freccia sola mentre ti rialzi. La lupa con la macchia bianca
            ti lecca il sangue dalla mano, e a mezzogiorno Aelion vi aspetta sulla
            spirale.
          effetti: { fazione.circolo: 1, tormento: 1 }
          almeno: { rep.circolo: 6 }
          segue: circolo-il-nome-della-via
      - testo: "Lasciarlo andare guidando il branco"
        descrizione: "Un cervo che non scappa più si può rimettere a scappare, se la tua voce sposta sette lupi."
        prova: { attributo: sociale, abilita: addestrare-animali, difficolta: Difficile }
        successo:
          titolo: La strada aperta
          testo: |
            Sposti il branco con la voce bassa, lupo per lupo, finché si apre un
            varco e il cervo se ne va al passo con le corna che tintinnano. Tharn
            ti guarda a lungo e poi ride, e a mezzogiorno Aelion vi aspetta sulla
            spirale.
          pe: { addestrare-animali: 10 }
          effetti: { fazione.circolo: 1, rep.circolo: 0.5 }
          almeno: { rep.circolo: 6 }
          segue: circolo-il-nome-della-via
        fallimento:
          titolo: Il branco non ascolta
          testo: |
            Il branco ti ascolta a metà, e il cervo carica nel varco sbagliato,
            strappandoti il mantello mentre ti butti a terra. Se ne va lo stesso,
            e a mezzogiorno Aelion vi aspetta sulla spirale.
          effetti: { fazione.circolo: 1, ferite: 1 }
          almeno: { rep.circolo: 6 }
          segue: circolo-il-nome-della-via
      - testo: "Lasciarlo andare con Richiamo"
        descrizione: "Un cervo che carica capisce il Richiamo fatto bene, se il branco resta seduto."
        incantesimo: richiamo
        prova: { attributo: mentale, abilita: magia, difficolta: Difficile }
        successo:
          titolo: La strada aperta
          testo: |
            Tieni fermo il cervo con il Richiamo mentre il branco si sposta da
            solo e apre un varco, e lui se ne va al passo con le corna che
            tintinnano. Tharn ride, e a mezzogiorno Aelion vi aspetta sulla
            spirale.
          pe: { magia: 5, addestrare-animali: 5 }
          effetti: { fazione.circolo: 1, rep.circolo: 0.5 }
          almeno: { rep.circolo: 6 }
          segue: circolo-il-nome-della-via
        fallimento:
          titolo: La carica
          testo: |
            Il Richiamo non basta a fermare la carica, e le corna ti strappano il
            mantello a un palmo dal fianco. Il cervo se ne va lo stesso, e a
            mezzogiorno Aelion vi aspetta sulla spirale.
          effetti: { fazione.circolo: 1, ferite: 1 }
          almeno: { rep.circolo: 6 }
          segue: circolo-il-nome-della-via

  # ------------------------------------------------------------ 8 → 9 · Radicanti, la vena e il sangue
  - id: circolo-la-vena-e-il-sangue
    presso: circolo-bosco-di-velthar
    immagine: ambientazione/cristalli-conduttori
    titolo: La vena e il sangue
    sommario: "Serha vuole travasare in una pianta la Marea di un cristallo carico, come nel 140, e serve una mano ferma."
    luogo: Il Bosco di Velthar, l'archivio sotto la spirale
    area: superficie-fratturata
    requisiti: [fazione.circolo == 8, circolo.via == 2]
    testo: |
      Sul banco dell'archivio Serha ha messo un vaso con una piantina di felce e un ago di legnoscuro lungo come un dito, cavo dentro.

      «Nel 140 l'ho fatto la prima volta» dice. «Ci vogliono un cristallo carico e una pianta, con l'ago in mezzo. La Marea passa nella pianta, e la pianta la
      beve e la rende innocua, come fa il Bosco con le radici quando ce la fa.» Si guarda il braccio di legnoscuro. «A volte le mani ci rimettono.»

      {conoscenze-della-strada Facile} Un cristallo carico lo vende Oda Krell nella sua baracca, e al Nodo d'Ossidiana li tengono sotto il bancone.

      {origine apprendista-raschiatore} Sulle piattaforme un cristallo carico si tiene con due dita, mai con il palmo, e Serha ti guarda le mani per vedere se
      lo sai.
    opzioni:
      - testo: "Travasare la Marea del cristallo nella pianta"
        descrizione: "Il cristallo carico si consuma, e la Marea che scappa dall'ago resta a te."
        requisiti: [cristalli.cristallo-carico >= 1]
        prova: { attributo: mentale, abilita: magia, difficolta: Difficile }
        successo:
          titolo: Il travaso
          testo: |
            Pianti l'ago nel cristallo e lo guidi con il Mana, un filo alla volta, e la Marea grigia passa nel legnoscuro come acqua in
            una radice. Le foglie della felce ingrigiscono e poi rinverdiscono dalla punta, sotto gli occhi di Serha che non sbatte le
            palpebre.
          pe: { magia: 10 }
          effetti: { cristalli.cristallo-carico: -1, contaminazione: 1.5 }
          segue: circolo-la-vena
        fallimento:
          titolo: Il travaso storto
          testo: |
            L'ago ti scappa a metà e la Marea esce dalla parte sbagliata, sulle
            tue dita, lasciando il cristallo vuoto. Serha ti fascia la mano e ti
            dice di procurarne un altro.
          effetti: { cristalli.cristallo-carico: -1, contaminazione: 1.5 }
      - testo: "Cercare un cristallo carico nelle rovine con Serha"
        descrizione: "Sotto le radici qualche cristallo è ancora carico, ma ci vogliono giorni, e la Marea delle rovine."
        costo: 3
        esito:
          titolo: Il cristallo delle rovine
          testo: |
            Per tre giorni cerchi con Serha fra i cristalli inghiottiti dal legno,
            finché lei ne sente uno che batte ancora. Il travaso lo fa lei con le
            tue mani sotto le sue, e la Marea che scappa dall'ago la prendete
            tutti e due.
          effetti: { contaminazione: 1.5 }
          segue: circolo-la-vena

  - id: circolo-la-vena
    presso: circolo-bosco-di-velthar
    immagine: ambientazione/cristalli-conduttori
    titolo: La vena
    sommario: "La felce ha bevuto e adesso trema, e nella terra del vaso è comparsa una vena di luce."
    luogo: Il Bosco di Velthar, l'archivio sotto la spirale
    area: superficie-fratturata
    tipo: seguito
    requisiti: [fazione.circolo == 8, circolo.via == 2]
    testo: |
      Le foglie della felce si aprono e si chiudono a scatti, e sulla terra
      del vaso una vena di luce sottile e azzurra gira intorno al gambo e
      scende nella terracotta. Serha la guarda con il braccio di legnoscuro
      stretto al petto.

      «Questa l'ho vista una volta sola» dice piano. «Mana puro, senza
      cristallo. Si è mossa verso di me, e poi è sparita.» Dal taglietto che
      l'ago ti ha fatto sul pollice sta per cadere una goccia di sangue.

      {magia Difficile} La vena si è girata verso la goccia, come la
      limatura di ferro verso una calamita.

      {medicina Media} La felce sta morendo di troppo, come un uomo che beve
      dopo tre giorni di sete, e senza la terra in eccesso forse ce la fa.
    opzioni:
      - testo: "Salvare la felce"
        descrizione: "La pianta ha bevuto troppo, e bisogna toglierle la terra dalle radici prima che si spacchi."
        prova: { attributo: mentale, abilita: [medicina, natura], difficolta: Media }
        successo:
          titolo: La felce quieta
          testo: |
            Togli la terra dalle radici un pizzico alla volta, e la felce rallenta
            finché torna ferma mentre la vena si spegne nella terracotta. Serha ti
            soffia sul pollice ferito, poi ti porta sulla spirale, dove Aelion vi
            aspetta.
          pe: { medicina: 10 }
          effetti: { fazione.circolo: 1 }
          almeno: { rep.circolo: 6 }
          segue: circolo-il-nome-della-via
        fallimento:
          titolo: La foglia spaccata
          testo: |
            Togli troppa terra in una volta e una foglia si spacca per il lungo,
            ma la felce vive. Serha ti porta in silenzio sulla spirale, dove
            Aelion vi aspetta.
          effetti: { fazione.circolo: 1, tormento: 1 }
          almeno: { rep.circolo: 6 }
          segue: circolo-il-nome-della-via
      - testo: "Lasciare che la vena tocchi il tuo sangue"
        descrizione: "La vena si muove verso la goccia, come l'unica volta che Serha l'ha vista."
        prova: { attributo: mentale, abilita: [resilienza, magia], difficolta: Difficile }
        successo:
          titolo: La vena e il sangue
          testo: |
            La goccia cade, e la vena la circonda diventando rossa per un momento. Poi torna azzurra e ti sale calda lungo il dito fino al polso, dove sparisce lasciandoti un calore che non è tuo. Serha ti afferra il polso con la mano di legnoscuro e ti chiede di non dirlo a nessuno, neanche ad Aelion, lei che ha aspettato trent'anni per rivederla.
          pe: { magia: 10 }
          effetti: { fazione.circolo: 1, tormento: 1 }
          imposta: { circolo.vena: 1 }
          almeno: { rep.circolo: 6 }
          segue: circolo-il-nome-della-via
        fallimento:
          titolo: La vena che morde
          testo: |
            La vena si getta sulla goccia come un cane affamato e ti sale fredda
            nel dito, mordendoti dentro fino al gomito prima di spegnersi. Serha
            ti fascia il braccio con le mani che tremano, poi ti porta sulla
            spirale, dove Aelion vi aspetta.
          effetti: { fazione.circolo: 1, contaminazione: 1.5, ferite: 1 }
          almeno: { rep.circolo: 6 }
          segue: circolo-il-nome-della-via
      - testo: "Lasciare fare a Serha"
        descrizione: "Lei l'ha già visto una volta, e le sue mani sanno che cosa fare."
        costo: 2
        esito:
          titolo: Le mani di Serha
          testo: |
            Lasci il vaso a Serha, che toglie la terra in eccesso con il braccio
            di legnoscuro, e la vena si spegne prima di arrivare al tuo sangue. Ti
            guarda il pollice ferito come un'occasione persa, poi ti porta sulla
            spirale, dove Aelion vi aspetta.
          effetti: { fazione.circolo: 1 }
          almeno: { rep.circolo: 6 }
          segue: circolo-il-nome-della-via

  # ------------------------------------------------------------ 8 → 9 · Silenti, tre notti nel tronco
  - id: circolo-tre-notti-nel-tronco
    presso: circolo-bosco-di-velthar
    immagine: fazioni/circolo-di-velthar
    titolo: Tre notti nel tronco
    sommario: "Accanto alla fenditura c'è un tronco cavo dove i Silenti dormono la prima volta, dalla sera fino a tre notti dopo."
    luogo: Il Bosco di Velthar, il tronco cavo accanto alla fenditura
    area: superficie-fratturata
    requisiti: [fazione.circolo == 8, circolo.via == 3]
    testo: |
      Il tronco cavo sta a venti passi dalla spirale, dove il vapore della fenditura scende invece di salire. È un tasso morto da secoli e
      ancora in piedi, con dentro lo spazio per un uomo seduto con le ginocchia al petto, e il legno lucidato da chissà quante schiene è
      caldo come la pelle di un animale.

      Voren tace anche dentro la tua testa. Ti indica l'apertura e si siede a vegliare sulla radice di fronte.

      {resilienza Media} La prima notte è la più lunga, dicono i novizi. La seconda non la ricorda nessuno, e della terza nessuno parla.
    opzioni:
      - testo: "Passare la prima notte senza uscire"
        descrizione: "Il buio e il vapore fino all'alba, qualunque cosa arrivi."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Difficile }
        successo:
          titolo: La prima notte
          testo: |
            Il buio nel tronco si fa così fitto che ti dimentichi dove finiscono
            le mani, e verso mezzanotte il legno comincia a battere piano, come un
            cuore lontano. All'alba Voren è ancora sulla radice nella stessa
            posizione, e le due notti seguenti passano senza che tu riesca a
            contarle.
          pe: { resilienza: 10 }
          effetti: { tormento: 1 }
          segue: circolo-i-ricordi-non-tuoi
        fallimento:
          titolo: Fuori dal tronco
          testo: |
            Quando il legno comincia a battere esci di corsa, e Voren ti indica
            l'apertura un'altra volta. Le tre notti ricominciano da capo, e
            stavolta le passi tutte con le unghie piantate nel legno.
          effetti: { tormento: 1.5 }
          segue: circolo-i-ricordi-non-tuoi
      - testo: "Dormire con una candela accesa"
        descrizione: "Una candela tiene lontano il buio e nessuno l'ha vietata, anche se le notti diventano sei."
        costo: 3
        esito:
          titolo: Sei notti
          testo: |
            Finché la candela fra le ginocchia resta accesa il legno non batte, e
            alla quarta notte la candela finisce e le notti vere cominciano. Esci
            dopo sei notti con la cera sulle dita e la testa vuota.
          effetti: { tormento: 1.5 }
          segue: circolo-i-ricordi-non-tuoi

  - id: circolo-i-ricordi-non-tuoi
    presso: circolo-bosco-di-velthar
    immagine: fazioni/circolo-di-velthar
    titolo: I ricordi non tuoi
    sommario: "La terza notte nel tronco ti arrivano ricordi non tuoi, di qualcuno che è stato qui molto tempo fa."
    luogo: Il Bosco di Velthar, il tronco cavo accanto alla fenditura
    area: superficie-fratturata
    tipo: seguito
    requisiti: [fazione.circolo == 8, circolo.via == 3]
    testo: |
      La terza notte arrivano ricordi che hanno il freddo delle cose successe davvero, e non sono tuoi. Hai le mani piccole e sporche di terra di una bambina, sdraiata ai piedi di un albero di metallo con la corteccia che si muove sotto
      le dita come la pelle di un cavallo. Dai rami sale un vapore azzurro denso come incenso, e tu dormi lì tre notti, con il branco intorno.

      L'ultima notte, nel buio sotto l'albero, ci sono due occhi dorati senza pupille, incastonati in qualcosa che si muove con un rumore di ferro.

      {percezione Media} Uno dei lupi intorno alla bambina ha sulla gola la macchia bianca che hai visto altrove.

      All'alba Voren ti posa la mano sulla fronte, e nella tua testa arriva per la prima volta la sua voce con le parole intere, a dirti che adesso sai parlare come i Silenti.
    opzioni:
      - testo: "Guardare il ricordo fino in fondo"
        descrizione: "Il ricordo dell'albero si può tenere e guardare invece di lasciarlo andare."
        prova: { attributo: mentale, abilita: percezione, difficolta: Media }
        successo:
          titolo: Il ricordo tenuto
          testo: |
            Tieni il ricordo come una lettera sotto la luce, e ti resta il posto,
            una cavità calda sotto la fenditura. Voren lo vede nella tua testa e
            la sua mano sulla fronte si fa pesante, poi ti accompagna sulla
            spirale, dove Aelion ti aspetta.
          pe: { percezione: 10 }
          effetti: { fazione.circolo: 1, tormento: 1 }
          imposta: { circolo.sussurro: 1 }
          almeno: { rep.circolo: 6 }
          segue: circolo-il-nome-della-via
        fallimento:
          titolo: Il ricordo che scappa
          testo: |
            Il ricordo ti scappa come l'acqua dalle mani, lasciandoti gli occhi
            dorati, che non se ne vanno. Voren ti tiene la mano sulla fronte
            finché smetti di tremare, poi ti accompagna sulla spirale, dove Aelion
            ti aspetta.
          effetti: { fazione.circolo: 1, tormento: 1.5 }
          imposta: { circolo.sussurro: 1 }
          almeno: { rep.circolo: 6 }
          segue: circolo-il-nome-della-via
      - testo: "Lasciarlo andare"
        descrizione: "Non è tuo, e i Silenti dicono che i ricordi del Bosco tornano quando servono."
        esito:
          titolo: Il ricordo restituito
          testo: |
            Il ricordo se ne va senza voltarsi, come una persona che esce da una
            stanza, lasciandoti il freddo nelle mani. Voren ti accompagna sulla
            spirale, dove Aelion ti aspetta.
          effetti: { fazione.circolo: 1, tormento: 1 }
          imposta: { circolo.sussurro: 1 }
          almeno: { rep.circolo: 6 }
          segue: circolo-il-nome-della-via

  # ------------------------------------------------------------ 9 · il nome della via e il dono
  - id: circolo-il-nome-della-via
    presso: circolo-bosco-di-velthar
    immagine: fazioni/circolo-di-velthar
    titolo: Il nome della via
    sommario: "Sulla spirale Aelion ti dà il nome della tua via, e la via ti dà il suo dono."
    luogo: Il Bosco di Velthar, il Circolo del Respiro
    area: superficie-fratturata
    tipo: seguito
    requisiti: [fazione.circolo == 9]
    testo: |
      Aelion ti aspetta a un passo dalla fenditura e ti posa le dita sulla fronte, leggere, come si saggia la febbre di un bambino.
      Dice una volta sola il nome della tua via, e i druidi sulla spirale, tutti, anche quelli che di solito non vengono, lo
      ripetono a mezza voce dall'alto in basso. Poi si gira verso sud, dove il grigio non si è ritirato.

      «Il Bosco aspetta un tuono, e prima del tuono non si muove» dice, con la voce di sempre.
    opzioni:
      - testo: "Accogliere la lupa con la macchia bianca"
        descrizione: "La lupa giovane che ti ha scelto la notte della caccia si chiama Fumo, e adesso è tua."
        quando: [circolo.via == 1, braska != 2]
        esito:
          titolo: Fumo
          testo: |
            Tharn ti lascia ai piedi la lupa con la macchia bianca, che si chiama
            Fumo e da oggi corre con te. Lei ti annusa la mano e si siede alla tua
            sinistra, mezzo passo avanti, dove resterà.
          effetti: { oggetto.circolo-lupa-brina: 1 }
      - testo: "Accogliere Braska"
        descrizione: "Il puma della Foresta Strisciante è venuto fino al margine, e i lupi gli hanno fatto spazio."
        quando: [circolo.via == 1, braska == 2]
        esito:
          titolo: Braska
          testo: |
            I lupi di Tharn si fanno da parte, e dall'erba alta esce Braska, nera
            con i fianchi rossi, a sedersi davanti a te come a un appuntamento.
            Tharn dice che il Bosco ha scelto per lui, e da oggi Braska va dove
            vai tu, sempre un poco prima di te.
          effetti: { oggetto.circolo-braska: 1 }
      - testo: "Ricevere l'innesto di legnoscuro"
        descrizione: "Serha ti innesta sotto la pelle dell'avambraccio una vena di legnoscuro che non si toglie più."
        quando: [circolo.via == 2]
        esito:
          titolo: L'innesto
          testo: |
            Serha ti incide l'avambraccio e ci infila una vena di legno scuro
            lunga come un dito, che si attacca alla carne da sola e pulsa con il
            tuo cuore. Fa male per una notte, e il mattino dopo il Mana ti passa
            nel braccio come l'acqua in una radice.
          effetti: { oggetto.circolo-innesto-di-legnoscuro: 1, ferite: 0.5 }
      - testo: "Prendere il cappuccio dei Silenti"
        descrizione: "Sulla pietra accanto alla tua c'è un cappuccio grigio-verde, e nessuno ti dice di chi era."
        quando: [circolo.via == 3]
        esito:
          titolo: Il cappuccio
          testo: |
            Il cappuccio è caldo e sa di vapore, e quando alzi gli occhi i druidi
            ti guardano come qualcuno di cui non ricordano bene la faccia. Voren,
            dietro di tutti, abbassa il mento di un dito.
          effetti: { oggetto.circolo-cappuccio-di-nebbia: 1 }
      - testo: "Prendere il cappuccio, e lasciare che il Bosco ti tenga la mente"
        descrizione: "I Silenti offrono una mente silenziosa, meno esposta al Tormento e meno attenta agli altri, che una volta presa resta."
        quando: [circolo.via == 3, mutazione.mente-silenziosa == 0]
        esito:
          titolo: La mente silenziosa
          testo: |
            Indossi il cappuccio e Voren ti posa la mano sulla nuca. Qualcosa
            nella testa si abbassa, come una fiamma quando chiudi la porta, e i
            pensieri degli altri si fanno lontani, insieme alle paure. I druidi ti
            guardano come qualcuno di cui non ricordano bene la faccia.
          effetti: { oggetto.circolo-cappuccio-di-nebbia: 1 }
          imposta: { mutazione.mente-silenziosa: 1 }

  # ------------------------------------------------------------ 9 → 10 · l'Albero si è riacceso
  - id: circolo-l-albero-si-e-riacceso
    presso: circolo-bosco-di-velthar
    immagine: fazioni/circolo-di-velthar
    titolo: L'Albero si è riacceso
    sommario: "Il giorno in cui è caduto il Costruttore la fenditura ha soffiato vapore azzurro per un'ora, e Aelion ti racconta perché."
    luogo: Il Bosco di Velthar, il Circolo del Respiro
    area: superficie-fratturata
    requisiti: [fazione.circolo == 9, pista.capomozzo >= 7, circolo.acceso == 0]
    testo: |
      Sulla spirale le pietre vicine alla fenditura sono bagnate di una
      rugiada azzurrina che non asciuga. A sud il grigio ha fatto un salto
      di cento passi in una notte, e i lupi di Tharn dormono al margine
      nord.

      Aelion ti porta dietro le pietre e per la prima volta parla senza
      immagini.

      «Il giorno in cui il Costruttore è caduto a Capomozzo» dice, «la
      fenditura ha soffiato vapore azzurro per un'ora. Tanti inverni fa una
      bambina del branco dormì tre notti accanto a un albero di metallo
      vivo, sotto la fenditura. Poi l'albero si chiuse, e lei non lo ritrovò
      più. Era acceso, allora. Adesso lo è di nuovo.» Si guarda le mani. «La
      Madre del Velo ha detto che le rovine si sono ricordate i loro nomi,
      senza sapere quanto aveva ragione.»

      {accademiche Media} Le cronache della Caduta dicono che le macchine
      dei Precursori si parlavano fra loro, e che quando una tace l'altra
      risponde.

      {origine figlio-del-circolo} La storia della bambina del branco te
      l'hanno raccontata da piccolo come una favola per dormire.

      Per scendere nella fenditura, dice Aelion guardando il vapore, serve
      una corda che non si tagli.
    opzioni:
      - testo: "Chiedere dove sta l'Albero"
        descrizione: "Sotto la fenditura, ha detto, ma bisogna sapere quanto sotto."
        esito:
          titolo: Sotto la spirale
          testo: |
            Sotto la fenditura c'è una gola calda, sotto la gola la città su cui il Bosco è cresciuto, e l'Albero sta ancora più giù. Le corde normali si tagliano da sole a metà strada. Serha può intrecciarne una con le radici vive, oppure ce l'hanno i Raschiatori che scendono nel Labirinto, o forse Oda Krell nella sua baracca.
          imposta: { circolo.acceso: 1 }
      - testo: "Indossare la Maschera della Natura"
        descrizione: "La maschera lega la carne alla macchina, e vicino a un albero di metallo che respira forse ti dice qualcosa."
        requisiti: [oggetto.maschera-della-natura >= 1]
        esito:
          titolo: Il Bosco si piega
          testo: |
            Indossi la maschera di corteccia nera, e le cime del Bosco si
            inclinano verso di te mentre dalla fenditura sale un sospiro caldo.
            Aelion fa un passo indietro e ti guarda con paura, per la prima volta.
            Quando te la togli ti tremano le mani, ma sai che l'Albero sta sotto
            la gola calda, e che serve una corda che non si tagli.
          pe: { magia: 5 }
          effetti: { tormento: 1 }
          imposta: { circolo.acceso: 1 }
      - testo: "Rispondere ad Aelion a chi credi quando nessuno guarda"
        descrizione: "Al Velo hai dato molto, e prima di dirti dove scendere Aelion ti fa una domanda sola."
        quando: [rep.velo >= 5]
        prova: { attributo: sociale, abilita: [empatia, persuasione], difficolta: Media }
        successo:
          titolo: Quando nessuno guarda
          testo: |
            Aelion ti chiede a chi credi quando nessuno guarda, e ascolta fino in fondo la tua risposta, senza giri. Poi ti dice che l'Albero
            sta sotto la gola calda, e che serve una corda che non si tagli, intrecciata da Serha oppure presa da chi scende nel Labirinto.
          pe: { empatia: 5 }
          effetti: { rep.circolo: 0.5 }
          imposta: { circolo.acceso: 1 }
        fallimento:
          titolo: La risposta preparata
          testo: |
            Gli rispondi con una frase che suona bene, e lui sente che l'avevi
            preparata. Ti dice lo stesso che l'Albero sta sotto la gola calda e
            che serve una corda che regga, fidandosi di te a metà.
          effetti: { tormento: 1 }
          imposta: { circolo.acceso: 1 }

  - id: circolo-la-corda-di-radici
    presso: circolo-bosco-di-velthar
    immagine: icone/rope-coil
    titolo: La corda di radici vive
    sommario: "Serha sa intrecciare con le radici vive del Bosco una corda che ricresce dove si taglia, in giorni di lavoro."
    luogo: Il Bosco di Velthar, l'archivio sotto la spirale
    area: superficie-fratturata
    requisiti: [fazione.circolo == 9, circolo.acceso == 1]
    testo: |
      Sul banco dell'archivio ci sono fasci di radici bianche di un salice
      vicino alla fenditura, ancora vive, che si muovono piano quando le
      tocchi. Serha le intreccia a tre a tre con la mano buona, e la corda
      arrotolata ai suoi piedi arriva già a dieci passi.

      «Una corda di canapa si taglia perché giù c'è qualcosa che taglia»
      dice. «Le radici si tagliano anche loro, e poi ricrescono. Ne servono
      duecento passi, e da sola ci metto un mese.»

      {natura Media} Le radici vanno intrecciate vive e bagnate di continuo,
      perché se seccano a metà la corda si spezza nel punto secco.
    opzioni:
      - testo: "Intrecciare con Serha"
        descrizione: "Tre radici alla volta, sempre bagnate, per giorni."
        costo: 2
        prova: { attributo: mentale, abilita: natura, difficolta: Difficile }
        successo:
          titolo: Duecento passi
          testo: |
            Intrecciate per cinque giorni bagnando le radici con una spugna ogni dieci giri, finché la corda bianca, tiepida al tatto, è lunga duecento passi e si raddrizza da sola quando la pieghi. La notte stessa dalla pianura sale un vento basso che odora di
            ferro.
          pe: { natura: 10 }
          effetti: { fazione.circolo: 1, rep.circolo: 0.5, oggetto.circolo-corda-della-fenditura: 1 }
        fallimento:
          titolo: Il punto secco
          testo: |
            Al terzo giorno lasci seccare un tratto mentre mangi, e la corda si
            spezza nel punto secco con un suono di ramo. Si ricomincia da lì, con
            le mani screpolate fino a sanguinare.
          effetti: { ferite: 0.5, tormento: 1 }
      - testo: "Bagnare le radici per un mese"
        descrizione: "Se non sai intrecciare, puoi tenere bagnate le radici per un mese, anche di notte."
        costo: 3
        esito:
          titolo: Un mese con la spugna
          testo: |
            Per un mese tieni bagnate le radici mentre Serha intreccia, dormendo
            accanto al banco, finché la corda è lunga duecento passi e le tue mani
            sono grinzose come quelle di una lavandaia. La notte stessa dalla
            pianura sale un vento basso che odora di ferro.
          effetti: { fazione.circolo: 1, oggetto.circolo-corda-della-fenditura: 1, ferite: 0.5, tormento: 1 }

  - id: circolo-la-corda-dei-raschiatori
    presso: grifone-di-ferro
    immagine: personaggi/dragna-gro-malog
    titolo: Una corda dai Raschiatori
    sommario: "I Raschiatori hanno corde che non si tagliano, e Dragna Gro-Malog le presta a chi le dice dove scende."
    luogo: Locanda del Grifone di Ferro, il tavolo di Dragna
    area: ponti-sospesi
    requisiti: [fazione.circolo == 9, circolo.acceso == 1]
    testo: |
      Dragna Gro-Malog occupa il suo tavolo in fondo alla sala, con il
      gomito appoggiato apposta su una mappa del Labirinto. Quando le chiedi
      una corda che non si tagli beve, e posa il boccale con molta calma.

      «Le corde dei Raschiatori hanno l'anima di filo di lyssan» dice.
      «Reggono dove le altre si tagliano, e le vendo solo alle squadre. Tu
      non sei una squadra.» Si pulisce la schiuma dal labbro con il dorso
      della mano. «Se mi dici dove scendi, ne parliamo.»

      {conoscenze-della-strada Media} Dove scende uno che chiede una corda
      così ci sono cose da raschiare, e il prezzo della corda è il posto.

      {origine apprendista-raschiatore} La corda con l'anima di lyssan te
      l'hanno data il primo giorno sulle piattaforme con l'ordine di
      riportarla anche da morto, e Dragna se lo ricorda.
    opzioni:
      - testo: "Dirle dove scendi"
        descrizione: "Il posto sotto la fenditura, che da domani i Raschiatori conosceranno."
        esito:
          titolo: Il posto
          testo: |
            Dragna te lo fa ripetere due volte e lo impara a memoria senza scrivere niente. Ti dà duecento passi di corda con l'anima di lyssan e ti dice che i suoi ti aspetteranno al margine, per
            sicurezza. La notte stessa, tornando al Bosco, senti dalla pianura un vento basso che odora di ferro.
          effetti: { fazione.circolo: 1, rep.raschiatori: 1, rep.circolo: -0.5, oggetto.circolo-corda-della-fenditura: 1 }
          imposta: { circolo.dragna: 1 }
      - testo: "Convincerla senza dirle dove"
        descrizione: "Una squadra di uno resta una squadra, se glielo fai credere."
        prova: { attributo: sociale, abilita: [persuasione, conoscenze-della-strada], difficolta: Media }
        successo:
          titolo: Una squadra di uno
          testo: |
            Le dici che scendi da solo dove i Raschiatori non scendono, e che se torni le racconterai che cosa c'era. Dragna ride forte una volta sola e ti dà la corda facendoti pagare soltanto il
            filo di lyssan. La notte stessa, tornando al Bosco, senti dalla pianura un vento basso che odora di ferro.
          pe: { persuasione: 5 }
          effetti: { fazione.circolo: 1, rep.circolo: 0.5, monete: -20, oggetto.circolo-corda-della-fenditura: 1 }
        fallimento:
          titolo: Il gomito sulla mappa
          testo: |
            Dragna torna al suo boccale, e mezza sala ha sentito che la corda non
            ti è stata data.
          effetti: { scandalo: 1 }
      - testo: "Chiederla come una volta sulle piattaforme"
        descrizione: "La corda l'hai già riportata una volta, anche quando la squadra non è tornata."
        quando: [origine.apprendista-raschiatore >= 1]
        esito:
          titolo: La corda riportata
          testo: |
            Le ricordi la corda del primo giorno, e Dragna smette di bere e va nel retro. Ti porta la corda dall'anima di lyssan facendoti pagare solo il filo, e ti dice di riportarla
            anche se tu non torni. La notte stessa, tornando al Bosco, senti dalla pianura un vento basso che odora di ferro.
          pe: { conoscenze-della-strada: 5 }
          effetti: { fazione.circolo: 1, rep.circolo: 0.5, monete: -20, oggetto.circolo-corda-della-fenditura: 1 }

  - id: circolo-la-corda-di-oda
    presso: baracca-di-oda
    immagine: ambientazione/orlo-dei-rottami
    titolo: La corda di Oda Krell
    sommario: "Fra i ferrivecchi di Oda Krell c'è una corda precuriana di filo grigio, che lei vende a caro prezzo."
    luogo: Superficie Fratturata, la baracca di Oda Krell
    area: superficie-fratturata
    requisiti: [fazione.circolo == 9, circolo.acceso == 1]
    testo: |
      Oda Krell ti ascolta al banco da lavoro, con la gamba di legno allungata verso la stufa, e quando nomini una corda che non si tagli tira fuori da una cassa una matassa di filo grigio, sottile come uno spago e pesante come una catena.

      «Precuriana» dice. «L'ho trovata in uno scavo trent'anni fa, e non sono mai riuscita a tagliarla. Ci ho appeso due muli insieme, e quello che c'è sotto il tuo Bosco lo reggerà lo stesso.» Beve un sorso dalla tazza. «Costa cara, perché mi tiene compagnia da
      trent'anni.»

      {ingannare Media} Oda è sola da troppo tempo, e una storia buona raccontata bene per lei vale mezzo prezzo.
    opzioni:
      - testo: "Pagare il prezzo pieno"
        descrizione: "Una borsa pesante, perché la corda regge due muli e Oda non tratta."
        requisiti: [monete >= 120]
        esito:
          titolo: Il prezzo pieno
          testo: |
            Oda guarda le monete sul banco senza contarle e ti mette in mano la
            matassa, chiedendoti di tornare a raccontarle che cosa c'era sotto. La
            notte stessa, tornando al Bosco, senti dalla pianura un vento basso
            che odora di ferro.
          effetti: { fazione.circolo: 1, rep.circolo: 0.5, monete: -120, oggetto.circolo-corda-della-fenditura: 1 }
      - testo: "Raccontarle che serve per un pozzo"
        descrizione: "Un pozzo fondo e una famiglia senz'acqua, perché Oda ama le storie e forse fa lo sconto."
        prova: { attributo: sociale, abilita: [ingannare, espressivita], difficolta: Media }
        successo:
          titolo: Il pozzo
          testo: |
            Oda ascolta la storia del pozzo con la tazza ferma a metà strada e ti dà la corda per metà del prezzo, perché la storia
            era brutta ma raccontata bene. La notte stessa, tornando al Bosco, senti dalla pianura un vento basso che odora di
            ferro.
          pe: { ingannare: 5 }
          effetti: { fazione.circolo: 1, rep.circolo: 0.5, monete: -60, oggetto.circolo-corda-della-fenditura: 1 }
        fallimento:
          titolo: Il bambino di troppo
          testo: |
            Al bambino malato Oda posa la tazza. I pozzi della Superficie li
            conosce tutti e il tuo è inventato, eppure ti offre da bere lo stesso,
            perché la compagnia è compagnia.
          effetti: { scandalo: 1 }
