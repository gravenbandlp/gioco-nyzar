# I servizi del Circolo di Velthar, nel Bosco di Velthar (luogo circolo-bosco-di-velthar della Superficie).
# Si aprono con i gradi della quest (fazione.circolo):
# - dal passo 3 (Viandante): le lezioni della Via del Respiro di primo livello, i lavori del margine e il baratto.
#   Le lezioni non costano monete: costano rintocchi e, dal secondo livello, la linfa del Bosco interno.
#   La condizione della tradizione resta rep.circolo >= 2 × livello.
# - dal passo 6 (Novizio): la purificazione delle piante (Contaminazione −1, tre rintocchi e un'offerta piccola: più
#   tempo che denaro), la lezione di Radici e l'unguento del Circolo a poco.
# - dal passo 9 (Iniziato): le lezioni di Veleno dell'anima e di Bere la Marea, e il lavoro della propria via.
# - dal passo 12 (Custode del Margine): la branda nella spirale, senza spese, e la lezione di Tempesta.
# - con il titolo di Respiro di Velthar (circolo.respiro, passo 15): la purificazione senza offerta e la parte del
#   margine, una piccola rendita.
storylet:
  # ------------------------------------------------------------ le lezioni della Via del Respiro
  - id: circolo-le-lezioni-del-respiro
    presso: circolo-bosco-di-velthar
    immagine: fazioni/circolo-di-velthar
    titolo: Le lezioni del Respiro
    sommario: "All'alba, sulla spirale, i druidi insegnano la Via del Respiro a chi il Circolo ha accolto."
    luogo: Il Bosco di Velthar, il Circolo del Respiro, all'alba
    area: superficie-fratturata
    ripetibile: true
    requisiti: [fazione.circolo >= 3, magia >= 1]
    testo: |
      All'alba, quando il vapore della fenditura sale dritto, sulle pietre più alte della spirale si tengono le lezioni. Il maestro dice le parole
      una volta sola e poi le ripete con te finché non smetti di sbagliarle. Le prime le insegna un druido giovane con le mani verdi fino al polso,
      le più forti Serha o Aelion, e il Circolo chiede in cambio il tuo tempo e a volte la linfa del Bosco interno.

      {magia Media} Il Respiro si lascia passare come l'acqua in una radice, e chi stringe troppo non ottiene niente.
    opzioni:
      - testo: "Pelle di corteccia"
        descrizione: "La pelle che si indurisce come legno vecchio, la prima difesa che il Circolo insegna."
        requisiti: [magia >= 1, rep.circolo >= 2, incantesimo.pelle-di-corteccia == 0]
        costo: 2
        prova: { attributo: mentale, abilita: magia, difficolta: Facile }
        successo:
          titolo: La corteccia
          testo: |
            Con il palmo su una quercia respiri con lei, finché la pelle della
            mano diventa ruvida e scura per il tempo di una preghiera.
          effetti: { incantesimo.pelle-di-corteccia: 1 }
        fallimento:
          titolo: Non ancora
          testo: |
            Tieni il palmo sulla quercia fino a farti girare la testa, e il druido ti dice di tornare domani e respirare meno forte.
          effetti: {}
      - testo: "Richiamo"
        descrizione: "La lingua che il Circolo insegna ai bambini, per parlare alle bestie."
        requisiti: [magia >= 1, rep.circolo >= 2, incantesimo.richiamo == 0]
        costo: 2
        prova: { attributo: mentale, abilita: magia, difficolta: Facile }
        successo:
          titolo: La lingua dei bambini
          testo: |
            Il lupo di Tharn ascolta le parole con la testa piegata e alla terza
            volta viene a sedersi davanti a te, fra gli applausi di sufficienza
            dei bambini del Circolo.
          effetti: { incantesimo.richiamo: 1 }
        fallimento:
          titolo: Non ancora
          testo: |
            Il lupo sbadiglia e si gira, e il druido ti dice di non parlare alle
            bestie come si parla ai clienti.
          effetti: {}
      - testo: "Radici"
        descrizione: "Il terreno che trattiene i piedi di un nemico, insegnato da Serha in cambio di una fiala di linfa."
        quando: [fazione.circolo >= 6]
        requisiti: [magia >= 2, rep.circolo >= 4, incantesimo.radici == 0, circolo.linfa >= 1]
        costo: 2
        prova: { attributo: mentale, abilita: magia, difficolta: Media }
        successo:
          titolo: Le radici
          testo: |
            Al quarto tentativo radici bianche escono dal terreno e tirano giù il
            ramo secco che guardavi, e Serha versa la tua linfa ai piedi della
            quercia più vicina.
          effetti: { incantesimo.radici: 1, circolo.linfa: -1 }
        fallimento:
          titolo: Non ancora
          testo: |
            Le radici ti si avvolgono alle caviglie invece che al ramo, e Serha ti
            libera con la mano di legnoscuro, lasciandoti la fiala in tasca.
          effetti: {}
      - testo: "Veleno dell'anima"
        descrizione: "Spore e linfa nera, per chi ha scelto la via del Circolo, al prezzo di due fiale di linfa."
        quando: [fazione.circolo >= 9]
        requisiti: [magia >= 3, rep.circolo >= 6, incantesimo.veleno-dell-anima == 0, circolo.linfa >= 2]
        costo: 2
        prova: { attributo: mentale, abilita: magia, difficolta: Difficile }
        successo:
          titolo: La linfa nera
          testo: |
            Dove la linfa delle radici morte cola nera, Aelion ti insegna le
            parole in un sussurro. Dal tronco secco esce una nuvola di spore che
            annerisce l'erba, e Aelion ti raccomanda di usarle poco.
          effetti: { incantesimo.veleno-dell-anima: 1, circolo.linfa: -2 }
        fallimento:
          titolo: Non ancora
          testo: |
            Le spore ti tornano in faccia e tossisci per un'ora, e Aelion ti dice
            di tornare quando avrai più rispetto per il veleno.
          effetti: { tormento: 1 }
      - testo: "Bere la Marea"
        descrizione: "Prendere su di sé la Marea di qualcuno, come le piante, per due fiale di linfa a Serha."
        quando: [fazione.circolo >= 9]
        requisiti: [magia >= 3, rep.circolo >= 6, incantesimo.bere-la-marea == 0, circolo.linfa >= 2]
        costo: 2
        prova: { attributo: mentale, abilita: magia, difficolta: Difficile }
        successo:
          titolo: Il sorso
          testo: |
            Con le mani sul petto di un novizio dalle labbra viola tiri su la
            Marea come l'acqua da un pozzo, e a te resta in bocca il sapore del
            ferro.
          effetti: { incantesimo.bere-la-marea: 1, circolo.linfa: -2, contaminazione: 1 }
        fallimento:
          titolo: Non ancora
          testo: |
            Tiri troppo forte e la Marea ti entra tutta insieme, finché Serha te
            la toglie e ti dice di cominciare da un sorso.
          effetti: { contaminazione: 1 }
      - testo: "Tempesta"
        descrizione: "Grandine e rami spezzati su tutti i nemici, per tre fiale di linfa ad Aelion."
        quando: [fazione.circolo >= 12]
        requisiti: [magia >= 4, rep.circolo >= 8, incantesimo.tempesta == 0, circolo.linfa >= 3]
        costo: 2
        prova: { attributo: mentale, abilita: magia, difficolta: Molto difficile }
        successo:
          titolo: La grandine
          testo: |
            Al margine nord Aelion ti fa dire le parole verso il cielo vuoto,
            finché una nuvola bassa scarica sulla valle una grandine grossa come
            nocciole. La tempesta, ti dice, si chiama soltanto per salvare
            qualcosa.
          effetti: { incantesimo.tempesta: 1, circolo.linfa: -3 }
        fallimento:
          titolo: Non ancora
          testo: |
            La nuvola si forma, ti scarica la grandine addosso e si dissolve, mentre Aelion ti guarda
            asciutto dalla collina.
          effetti: { ferite: 0.5 }

  # ------------------------------------------------------------ la purificazione delle piante
  - id: circolo-la-purificazione-delle-piante
    presso: circolo-bosco-di-velthar
    immagine: fazioni/circolo-di-velthar
    titolo: La purificazione delle piante
    sommario: "Il Circolo toglie la Marea dal corpo con le piante che la bevono, in una giornata intera."
    luogo: Il Bosco di Velthar, l'orto delle felci sotto la spirale
    area: superficie-fratturata
    ripetibile: true
    requisiti: [fazione.circolo >= 6, contaminazione >= 0.5]
    testo: |
      Sotto la spirale c'è un orto di felci in aiuole rotonde, dove Serha fa
      crescere le piante che bevono la Marea. Chi l'ha addosso si sdraia con
      le mani nella terra per una giornata intera, e i druidi gli piantano
      le felci intorno, così vicine che le radici gli toccano la pelle.

      {origine accolito-del-velo} In Cripta l'accolito ti guardava il bianco
      dell'occhio e chiedeva l'offerta, mentre qui l'offerta è un pugno di
      monete per i semi.
    opzioni:
      - testo: "Sdraiarti fra le felci per una giornata"
        descrizione: "Una giornata con le mani nella terra, per qualche moneta per i semi."
        requisiti: [monete >= 5]
        costo: 3
        esito:
          titolo: Le felci grigie
          testo: |
            Passi la giornata a guardare il vapore della spirale mentre le felci
            ingrigiscono una dopo l'altra e vengono cambiate, e la sera ti alzi
            con la bocca che non sa più di ferro.
          effetti: { monete: -5, contaminazione: -1 }
      - testo: "Sdraiarti fra le felci, come uno di casa"
        descrizione: "Al Respiro di Velthar nessuno chiede i semi."
        quando: [circolo.respiro >= 1]
        costo: 2
        esito:
          titolo: Uno di casa
          testo: |
            I novizi ti piantano le felci intorno senza che tu lo chieda, e la
            sera ti alzi con la bocca pulita.
          effetti: { contaminazione: -1 }

  # ------------------------------------------------------------ la branda nella spirale
  - id: circolo-la-branda-nella-spirale
    presso: circolo-bosco-di-velthar
    immagine: fazioni/circolo-di-velthar
    titolo: La branda nella spirale
    sommario: "Sotto le pietre della spirale, accanto all'archivio, c'è una nicchia calda con la tua branda di felci secche."
    luogo: Il Bosco di Velthar, sotto la spirale
    area: superficie-fratturata
    ripetibile: true
    requisiti: [fazione.circolo >= 12]
    testo: |
      La tua branda sta in una nicchia sotto la spirale, accanto all'archivio di Serha, dove il vapore della fenditura arriva tiepido. Ha un
      materasso di felci secche e una coperta di lana grezza con un buco bruciato in un angolo, e di notte si sente lo scalpello di Serha.

      {origine figlio-del-circolo} La coperta era già vecchia quando eri bambino, e il buco l'hai fatto tu con una candela nella notte di
      una febbre.
    opzioni:
      - testo: "Dormire fino all'alba"
        descrizione: "Una notte con la fenditura nelle orecchie, che il Circolo non fa pagare a chi custodisce il margine."
        esito:
          titolo: Il respiro della fenditura
          testo: |
            Ti addormenti contando i respiri della fenditura, e all'alba ti
            sveglia lo scalpello di Serha, con le ferite che tirano meno.
          effetti: { ferite: -1, tormento: -1 }

  # ------------------------------------------------------------ i lavori del margine
  - id: circolo-il-lavoro-del-margine
    presso: circolo-bosco-di-velthar
    immagine: fazioni/circolo-di-velthar
    titolo: Il lavoro del margine
    sommario: "Al margine c'è sempre qualcosa da fare, e il Circolo divide la paga con chi lavora."
    luogo: Il Bosco di Velthar, il margine
    area: superficie-fratturata
    ripetibile: true
    requisiti: [fazione.circolo >= 3]
    testo: |
      Sul tronco con le tre tacche Tharn pianta un bastoncino per ogni
      lavoro da fare, e chi lo prende lo riporta la sera. Ci sono i tronchi
      secchi da segnare per la Segheria e la ronda che la città paga, e il
      Circolo divide quello che entra con chi ha lavorato.

      {politica-ed-economia Media} La città paga il Circolo poco e in
      ritardo, e il Circolo non protesta mai, che è un modo di tenere un
      credito.
    opzioni:
      - testo: "Segnare il secco per la Segheria"
        descrizione: "Tre tacche sui tronchi morti, distinguendo un albero morto da uno che dorme."
        prova: { attributo: mentale, abilita: natura, difficolta: Media }
        successo:
          titolo: Il secco segnato
          testo: |
            Incidi le tacche soltanto sui tronchi che suonano vuoti sotto il
            manico del coltello, e Tharn ne controlla due a caso e annuisce.
          pe: { natura: 2 }
          effetti: { monete: 6 }
        fallimento:
          titolo: L'albero che dormiva
          testo: |
            La sera Tharn trova le gemme sotto la corteccia di un tronco che hai
            segnato, e ti fa cancellare le tacche con la terra bagnata.
          effetti: { tormento: 1 }
      - testo: "Fare la ronda del margine"
        descrizione: "Un giro lungo del margine con l'arco di Tharn, a cercare tracce di bestie grigie e di asce."
        prova: { attributo: fisico, abilita: [armi-da-distanza, atletica], difficolta: Media }
        successo:
          titolo: La ronda
          testo: |
            Abbatti una volpe grigia che correva verso i campi, e Tharn appende la
            coda a un ramo con le altre.
          pe: { armi-da-distanza: 2 }
          effetti: { monete: 6 }
        fallimento:
          titolo: La volpe che scappa
          testo: |
            Manchi la volpe grigia due volte, e Tharn manda un ragazzo ad
            avvertire le fattorie.
          effetti: { ferite: 0.5 }
      - testo: "Cacciare con il branco"
        descrizione: "Una notte di caccia con il branco degli Irriducibili, per la pelle da dare al Circolo."
        quando: [fazione.circolo >= 9, circolo.via == 1]
        prova: { attributo: fisico, abilita: [atletica, armi-da-distanza], difficolta: Media }
        successo:
          titolo: La notte di caccia
          testo: |
            Corri con il branco fino all'alba e abbatti un lupo grigio venuto dal sud. Il Circolo concia la pelle e
            divide la parte con te.
          pe: { atletica: 5 }
          effetti: { monete: 12, circolo.pelle-grigia: 1 }
        fallimento:
          titolo: Il branco va avanti
          testo: |
            A metà notte resti indietro e il branco caccia senza di te, e torni al
            margine con le gambe di legno.
          effetti: { ferite: 0.5 }
      - testo: "Copiare le tavole per Serha"
        descrizione: "Una giornata nell'archivio dei Radicanti a ricopiare respiri del Bosco su tavole nuove."
        quando: [fazione.circolo >= 9, circolo.via == 2]
        prova: { attributo: mentale, abilita: [accademiche, percezione], difficolta: Media }
        successo:
          titolo: Le tavole
          testo: |
            Ricopi tre tavole senza sbagliare una fila, e Serha, dopo averle controllate con il pollice di legnoscuro, ti dà la tua parte e
            una fiala di linfa.
          pe: { accademiche: 5 }
          effetti: { monete: 12, circolo.linfa: 1 }
        fallimento:
          titolo: La fila sbagliata
          testo: |
            Alla terza tavola salti una fila, e Serha se ne accorge con il pollice
            e ti fa ricominciare domani.
          effetti: { tormento: 1 }
      - testo: "Vegliare un Silente"
        descrizione: "Una notte accanto a un Silente che dorme fra le radici, a tenergli aperta la via."
        quando: [fazione.circolo >= 9, circolo.via == 3]
        prova: { attributo: mentale, abilita: resilienza, difficolta: Media }
        successo:
          titolo: La veglia
          testo: |
            Passi la notte con la pressione del Silente dietro gli occhi e
            all'alba ti senti più leggero, e nessuno ti chiede che cosa hai
            sentito.
          pe: { resilienza: 5 }
          effetti: { monete: 12, tormento: -0.5 }
        fallimento:
          titolo: La veglia rotta
          testo: |
            A metà notte la pressione si fa troppo forte e ti alzi, e un altro
            prende il tuo posto senza una parola.
          effetti: { tormento: 1 }
      - testo: "Ricevere la parte del margine"
        descrizione: "Al Respiro di Velthar spetta una parte della paga del margine anche senza lavoro."
        quando: [circolo.respiro >= 1]
        esito:
          titolo: La parte
          testo: |
            Tharn ti mette in mano un sacchetto con la tua parte, perché al
            Circolo dicono che il Respiro di Velthar lavora anche quando dorme.
          effetti: { monete: 10 }

  # ------------------------------------------------------------ il baratto del margine
  - id: circolo-il-baratto-del-margine
    presso: circolo-bosco-di-velthar
    immagine: fazioni/circolo-di-velthar
    titolo: Il baratto del margine
    sommario: "Ogni settimana un carrettiere della Gilda compra al margine quello che il Bosco dà, e il Circolo gli vende l'unguento."
    luogo: Il Bosco di Velthar, il margine
    area: superficie-fratturata
    ripetibile: true
    requisiti: [fazione.circolo >= 3]
    testo: |
      Una volta alla settimana si ferma al margine un carrettiere della
      Gilda, con un mulo che sbuffa ai lupi. Compra pelli grigie e legno di
      lanterna, oltre alla linfa per i guaritori, e paga meno di quanto
      valgano. Accanto al carro un novizio del Circolo vende vasetti di
      unguento di felce.

      {conoscenze-della-strada Media} In città la linfa la rivendono al
      triplo, e il carrettiere sa che lo sai e ti sorride lo stesso.
    opzioni:
      - testo: "Vendere un ciocco di legno di lanterna"
        descrizione: "Nei saloni lo bruciano per la luce, e il carrettiere non chiede da dove viene."
        requisiti: [circolo.legno-di-lanterna >= 1]
        costo: 0
        esito:
          titolo: Il ciocco
          testo: |
            Il carrettiere gira il ciocco verso l'ombra del carro per vederlo
            brillare, e ti conta le monete sul palmo.
          effetti: { circolo.legno-di-lanterna: -1, monete: 6 }
      - testo: "Vendere una pelle grigia"
        descrizione: "I conciatori della Città Bassa ne fanno guanti che non si tagliano."
        requisiti: [circolo.pelle-grigia >= 1]
        costo: 0
        esito:
          titolo: La pelle
          testo: |
            Il carrettiere si punge sul pelo rigido e ti paga succhiandosi il
            dito.
          effetti: { circolo.pelle-grigia: -1, monete: 8 }
      - testo: "Vendere una fiala di linfa luminosa"
        descrizione: "I guaritori di città la mettono sulle ferite che non chiudono."
        requisiti: [circolo.linfa >= 1]
        costo: 0
        esito:
          titolo: La fiala
          testo: |
            Il carrettiere guarda la fiala brillare verde contro la luce, e la
            avvolge nella paglia con più cura di tutto il resto.
          effetti: { circolo.linfa: -1, monete: 10 }
      - testo: "Vendere una scheggia di corteccia di metallo"
        descrizione: "Il carrettiere ne darebbe una borsa intera, e il Circolo verrà a saperlo."
        requisiti: [circolo.corteccia >= 1]
        costo: 0
        esito:
          titolo: La scheggia venduta
          testo: |
            Il carrettiere piega la scheggia sotto il pollice, la guarda tornare
            dritta e la nasconde sotto il sedile pagandoti senza contrattare. Il
            novizio ha visto tutto, e la sera al Circolo lo sanno.
          effetti: { circolo.corteccia: -1, monete: 60, rep.circolo: -0.5 }
      - testo: "Restituire al Bosco una scheggia di corteccia"
        descrizione: "Il Circolo seppellisce le schegge dell'Albero ai piedi della spirale."
        requisiti: [circolo.corteccia >= 1]
        costo: 0
        esito:
          titolo: La scheggia sepolta
          testo: |
            Seppellisci la scheggia fra due pietre della spirale, e un druido che
            passa aspetta a testa china che tu abbia finito.
          effetti: { circolo.corteccia: -1, rep.circolo: 0.5 }
      - testo: "Comprare un vasetto di unguento del Circolo"
        descrizione: "Unguento di felce e grasso di tasso che chiude le ferite, e a chi è del Circolo costa poco."
        quando: [fazione.circolo >= 6]
        requisiti: [monete >= 12]
        costo: 0
        esito:
          titolo: L'unguento
          testo: |
            Il novizio arrossendo ti dà il vasetto con tutte e due le mani, e sotto il tappo
            qualcuno ha disegnato una foglia.
          effetti: { monete: -12, unguento: 1 }
