# La quest del Circolo di Velthar, «Il respiro corto» (fazione.circolo 0 → 15, ottobre 2026).
# Qui: la pista, la voce in `fazioni:` con i cinque gradi, il luogo del Bosco di Velthar sulla Superficie Fratturata
# (nord-ovest, compare dal passo 3), le quality della quest e due frammenti del Codex.
# Gli storylet stanno in passi-1.yaml (1-5), passi-2.yaml (6-10), passi-3.yaml (11-15) e servizi.yaml (lezioni,
# purificazione, branda, lavori e baratto). Le spedizioni in spedizione-bosco.yaml (il Bosco interno, dal passo 4)
# e spedizione-fenditura.yaml (la fenditura del Respiro, dal passo 13).
# Ingresso: rep.circolo >= 1 (il Figlio del Circolo), braska >= 1 (il puma della Foresta Strisciante) o
# pista.tribu >= 2 (la cena con Ilvaena). Dall'8 ottobre 2026 il primo passo chiede pista.capomozzo >= 10, il 6 chiede pista.corin >= 3,
# i passi 10-15 chiedono pista.capomozzo >= 7.
# Flag della quest:
# - circolo.via: la via scelta al passo 8. 1 Irriducibili (Tharn), 2 Radicanti (Serha), 3 Silenti (Voren).
# - circolo.albero: che cosa ne è stato dell'Albero di Metallo Vivo al passo 14. 1 chiuso, 2 accordato al respiro
#   del Bosco, 3 lasciato ai Silenti (Voren si fonde), 4 dato alla città (il Velo o i Raschiatori). La strada 4
#   costa reputazione e cambia le ricompense del passo 15, ma arriva al passo 15.
# - circolo.capobranco 1 se al passo 4 hai portato fuori dal grigio il capobranco invece di abbatterlo.
# - circolo.curva 1 dopo che Serha ti ha mandato a cercare la curva della Marea (passo 5).
# - circolo.parola 1 se porti la parola della Spina (passo 7); 2 se l'hai usata per aprire la porta nella fenditura.
# - circolo.vena 1 se la vena ha risposto al tuo sangue (via Radicante, passo 9).
# - circolo.sussurro 1 se i Silenti ti hanno dato il sussurro (via Silente, passo 9).
# - circolo.acceso 1 quando Aelion ti ha detto dell'Albero riacceso (passo 10), e si cerca la corda.
# - circolo.dragna 1 se al passo 10 hai detto a Dragna dove scendi: i Raschiatori si accampano al margine.
# - circolo.promessa-velo 1 se al passo 12 hai promesso a Padre Vantes un campione della linfa.
# - circolo.orchi: gli orchi profughi del passo 11. 1 accolti nel Bosco, 2 cacciati, 3 consegnati alla Caserma.
# - circolo.custode 1 dopo la prima vittoria sul Custode di linfa; circolo.sentinelle 1 dopo il primo giro delle
#   sentinelle nel Bosco interno (le visite seguenti rendono meno).
# - circolo.respiro: il titolo di Respiro di Velthar (passo 15, strade 1-3).
quality:
  - { id: fazione.circolo, immagine: fazioni/circolo-di-velthar, nome: "Il respiro corto", categoria: pista, descrizione: "Le foglie del margine sud del Bosco di Velthar diventano grigie, e un druido con due lupi è sceso in città a cercare chi taglia gli alberi." }

  # ------------------------------------------------------------ le merci del Bosco
  - { id: circolo.legno-di-lanterna, immagine: icone/log, nome: Ciocco di legno di lanterna, categoria: bene, famiglia: Merci del Bosco, valore: 6, descrizione: "Un pezzo di tronco del margine sud, con le venature che brillano al buio. Nei saloni dei Quartieri Alti lo bruciano per la luce." }
  - { id: circolo.pelle-grigia, immagine: icone/animal-hide, nome: Pelle grigia, categoria: bene, famiglia: Merci del Bosco, valore: 8, descrizione: "La pelle di un lupo del boschetto grigio, con il pelo rigido come fil di ferro. Al Circolo la conciano per farne guanti da lavoro." }
  - { id: circolo.linfa, immagine: icone/drop, nome: Linfa luminosa, categoria: bene, famiglia: Merci del Bosco, valore: 10, descrizione: "Una fiala della linfa che scorre nei ruscelli del Bosco interno. Fa una luce verdina per giorni, e i guaritori la vogliono." }
  - { id: circolo.corteccia, immagine: icone/mineral-heart, nome: Scheggia di corteccia di metallo, categoria: bene, famiglia: Merci del Bosco, valore: 60, descrizione: "Un frammento della corteccia dell'Albero di Metallo Vivo. È tiepido e si piega appena sotto il pollice. Il Circolo non vuole vederlo uscire dal Bosco." }

  # ------------------------------------------------------------ il titolo
  - { id: circolo.respiro, immagine: icone/oak-leaf, nome: Respiro di Velthar, categoria: accesso, descrizione: "Siedi nel Circolo Ristretto come quarta voce. Al margine ti aprono i sentieri, e al Circolo del Respiro non paghi niente." }

  # ------------------------------------------------------------ flag della quest
  - { id: circolo.via, nome: La via del Respiro, categoria: stato, nascosta: true, descrizione: "1 Irriducibili, 2 Radicanti, 3 Silenti." }
  - { id: circolo.albero, nome: L'Albero di Metallo Vivo, categoria: stato, nascosta: true, descrizione: "1 chiuso, 2 accordato al Bosco, 3 lasciato ai Silenti, 4 dato alla città." }
  - { id: circolo.capobranco, nome: Il capobranco grigio, categoria: stato, nascosta: true, descrizione: "1 se l'hai portato fuori dal grigio con la voce." }
  - { id: circolo.curva, nome: La curva della Marea, categoria: stato, nascosta: true, descrizione: "1 quando Serha ti ha chiesto la curva della Marea che il Velo misura." }
  - { id: circolo.parola, nome: La parola della Spina, categoria: stato, nascosta: true, descrizione: "1 se porti la parola della Spina dell'Eco, 2 se l'hai detta alla porta della fenditura." }
  - { id: circolo.vena, nome: La vena e il sangue, categoria: stato, nascosta: true, descrizione: "1 se la vena di Mana ha risposto al tuo sangue." }
  - { id: circolo.sussurro, nome: Il sussurro dei Silenti, categoria: stato, nascosta: true, descrizione: "1 se i Silenti ti hanno insegnato a parlare senza voce." }
  - { id: circolo.acceso, nome: L'Albero si è riacceso, categoria: stato, nascosta: true, descrizione: "1 quando Aelion ti ha detto dell'Albero, e cerchi una corda che non si tagli." }
  - { id: circolo.dragna, nome: I Raschiatori al margine, categoria: stato, nascosta: true, descrizione: "1 se hai detto a Dragna dove scendi." }
  - { id: circolo.promessa-velo, nome: La promessa a Padre Vantes, categoria: stato, nascosta: true, descrizione: "1 se hai promesso al Velo un campione della linfa dell'Albero." }
  - { id: circolo.orchi, nome: Gli orchi profughi al margine, categoria: stato, nascosta: true, descrizione: "1 accolti nel Bosco, 2 cacciati, 3 consegnati alla Caserma." }
  - { id: circolo.custode, nome: Il Custode di linfa, categoria: stato, nascosta: true, descrizione: "1 dopo la prima vittoria sul Custode di linfa." }
  - { id: circolo.sentinelle, nome: Le sentinelle grigie, categoria: stato, nascosta: true, descrizione: "1 dopo il primo giro delle sentinelle nel Bosco interno." }

fazioni:
  - id: circolo
    nome: Circolo di Velthar
    immagine: fazioni/circolo-di-velthar
    reputazione: rep.circolo
    pista: fazione.circolo
    gradi:
      - { passo: 3, nome: Viandante, ricompensa: "Il segno delle tre tacche, la strada del Bosco di Velthar e le lezioni della Via del Respiro di primo livello." }
      - { passo: 6, nome: Novizio della Spirale, ricompensa: "L'arco di tasso del margine, la purificazione delle piante al Circolo, la lezione di Radici e l'unguento a poco." }
      - { passo: 9, nome: Iniziato della via, ricompensa: "Il dono della tua via, le lezioni di Veleno dell'anima e di Bere la Marea, i lavori della via e la fenditura aperta." }
      - { passo: 12, nome: Custode del Margine, ricompensa: "Il mantello di muschio grigio, la branda nella spirale senza spese e la lezione di Tempesta." }
      - { passo: 15, nome: Quarta voce del Circolo Ristretto, ricompensa: "Il ramo di metallo vivo e una borsa pesante. Se l'Albero resta al Bosco, anche la ghianda di metallo vivo e il titolo di Respiro di Velthar." }

luoghi:
  - id: circolo-bosco-di-velthar
    area: superficie-fratturata
    nome: Il Bosco di Velthar
    immagine: fazioni/circolo-di-velthar
    sommario: "Un giorno di cammino a nord-ovest, gli alberi che nessuno ha visto invecchiare e, nel mezzo, la spirale del Circolo del Respiro."
    requisiti: [fazione.circolo >= 2]
    testo: |
      La strada di Velthar esce dalla porta nord, piega a ovest fra le valli scavate dai detriti dei Precursori e
      dopo un giorno di cammino arriva a una linea scura che taglia la pianura da un orizzonte all'altro. Da
      vicino la linea diventa un muro di tronchi grossi come torri, con le cortecce che di notte mandano bagliori
      a intermittenza. Al margine i druidi hanno lasciato tre tacche su un tronco caduto, e chi le ha nel palmo
      può passare.

      Dentro, i sentieri cambiano di stagione in stagione. Nel mezzo del Bosco c'è il Circolo del Respiro, una
      spirale di pietre coperte di muschio intorno a una fenditura del terreno da cui sale un fiato caldo, e lì il
      Circolo si riunisce, e prende la parola chi si trova il vapore in faccia. Dalla spirale si scende verso
      il Bosco interno, e più giù verso la fenditura, per chi ha una corda capace di reggere fino in fondo.

frammenti:
  - id: circolo-le-tre-vie
    titolo: Le tre vie del Respiro
    area: superficie-fratturata
    immagine: fazioni/circolo-di-velthar
    requisiti: [fazione.circolo >= 3]
    testo: |
      Il Circolo di Velthar si divide in tre vie. Gli Irriducibili praticano la simbiosi con le creature e con
      la terra, e passano parte dell'anno fra gli animali e parte fra gli uomini. I Radicanti custodiscono la
      conoscenza del Mana e studiano i cristalli esausti per capire le correnti che attraversano il mondo. I
      Silenti, solitari, hanno scelto di fondersi con il Bosco stesso, in una coscienza diffusa che i nuovi
      iniziati non osano interrogare di petto. Il Maestro del Circolo è l'unico con cui un pellegrino possa
      parlare.

  - id: circolo-il-bosco-che-riconosce
    titolo: Il Bosco che riconosce
    area: superficie-fratturata
    immagine: fazioni/circolo-di-velthar
    requisiti: [fazione.circolo >= 4]
    testo: |
      Il Bosco di Velthar non è ostile a chi ci entra senza ascia, e neppure indifferente. Gli animali si
      avvicinano a chi non ha intenzione di tagliare e stanno alla larga da chi ha maneggiato una lama da poco. I
      sentieri cambiano di stagione in stagione, e nessuno li percorre due volte nello stesso modo. Chi ci è
      cresciuto smette di trovarlo strano, mentre chi viene da fuori, dopo qualche giorno, comincia a parlare a
      bassa voce anche quando è solo.
