# La fenditura del Respiro, spedizione della quest del Circolo di Velthar (dal passo 13, poi ripetibile).
# Ci si entra dal Bosco di Velthar con la corda (chiave «fenditura»): la prima volta con `circolo-la-discesa`
# (passi-3.yaml), dopo la quest con `circolo-fenditura-scendere`. La ritirata riporta alla Superficie Fratturata.
# Le stanze vanno in fasce di profondità, e una stanza superata non ricompare nella stessa visita:
# 0 la gola calda (la corda che si sfilaccia; i getti di vapore, che valgono anche a 1),
# 1 le radici di metallo (le radici che diventano cavi; il guardiano di radici, che vale anche a 2),
# 2 la città sepolta (le case piene di terra; la Salvaguardia che dorme in piazza, che vale anche a 3),
# 3 il sonno dei Silenti (la porta della parola, che con circolo.parola == 1 salta una fascia ma Voren la sente;
#   il bracciale di Selara; i Silenti nelle radici, che valgono anche a 4),
# 4 l'anticamera (il ferro che si sposta; le pozze di linfa azzurra).
# Il cuore a 5: il Custode di linfa (boss, fazione.circolo == 12, porta a 13 e apre subito gli occhi dorati) e, dopo la
# quest, la cavità dell'Albero (fazione.circolo >= 14). Il passo 14, `circolo-occhi-dorati`, sta qui in fondo.
# Ogni stanza ha una via senza prova che costa due rintocchi e un poco di Ferite, Tormento o Contaminazione.
aree:
  - id: circolo-fenditura
    immagine: ambientazione/rovine-dei-precursori
    nome: La fenditura del Respiro
    sommario: "Sotto la spirale del Circolo una gola calda scende fra radici diventate metallo, fino a una città sepolta e più giù ancora."
    spedizione: { ritorno: superficie-fratturata, soglia: 5, stanze: 3 }
    testo: |
      Sotto il Circolo del Respiro la fenditura si allarga in una gola calda di pietra scura, dove il vapore
      sale da crepe che non si vedono. La pietra è fitta e senza strati, e il vapore la tiene sempre bagnata e
      tiepida al tatto. Più giù le radici del Bosco scendono lungo le pareti e a un certo punto smettono di
      essere legno. Da lì in fondo nella roccia non c'è più un insetto né un filo di muffa.

      Ancora più sotto c'è una città di pietra e metallo con le case piene di terra fino al soffitto. Le porte
      sono alte il doppio di un uomo, e la terra le chiude tutte fino all'architrave. In fondo, dove la città
      finisce, il calore viene da un punto solo.

storylet:
  # ------------------------------------------------------------ l'ingresso, dopo la quest
  - id: circolo-fenditura-scendere
    presso: circolo-bosco-di-velthar
    immagine: fazioni/circolo-di-velthar
    titolo: La fenditura del Respiro
    sommario: "La corda è ancora legata alla pietra più bassa della spirale, e sotto aspettano la gola calda e la città sepolta."
    luogo: Il Bosco di Velthar, il bordo della fenditura
    area: superficie-fratturata
    ripetibile: true
    requisiti: [fazione.circolo >= 14]
    testo: |
      La corda è rimasta legata alla pietra più bassa della spirale, e i novizi a turno la bagnano con una
      spugna perché il calore non la secchi. Dove la corda gira intorno alla pietra ha scavato un solco
      lucido. Dalla bocca della fenditura sale un'aria calda che fa ondeggiare la corda anche quando non c'è
      vento. Ogni tanto qualcuno scende fino alla città sepolta a prendere le misure per Serha, e torna con i
      capelli bianchi di polvere e gli occhi rossi. Più giù di così scendono in pochi.

      {atletica Facile} Le braccia ricordano i duecento passi di corda. Si fanno sentire già adesso, solo a
      guardarla.
    opzioni:
      - testo: "Scendere nella fenditura"
        descrizione: "Duecento passi di corda nel buio caldo. La strada fino alla cavità la conosci."
        requisiti: [chiave.fenditura >= 1]
        esito:
          titolo: Di nuovo giù
          testo: |
            Ti infili i guanti e ti cali nel buio, una mano sotto l'altra, finché la spirale sopra la testa
            non è un cerchio di luce e poi niente. A metà discesa l'aria smette di essere fresca e sale
            tiepida lungo la corda. I piedi toccano la roccia calda della gola.
          vai: circolo-fenditura

  # ------------------------------------------------------------ 0 · la gola calda
  - id: circolo-fenditura-la-corda-che-si-sfilaccia
    immagine: ambientazione/rovine-dei-precursori
    titolo: La corda che si sfilaccia
    sommario: "A metà della gola la roccia è così calda che la corda comincia a fumare."
    luogo: La fenditura del Respiro, la gola calda
    area: circolo-fenditura
    ripetibile: true
    requisiti: [profondita.circolo-fenditura == 0]
    testo: |
      La gola scende ripida a lungo, e la corda ci corre sopra appoggiata alla roccia. La roccia è scura e
      porosa, e dove la corda ci passa sopra si è consumata in un canale liscio largo due dita. A metà strada
      la roccia scotta e la corda comincia a fumare, con un odore di canapa bruciata o di radice cotta secondo
      quella che hai. Dal buio sale il fruscio del vapore da cento crepe. Il fruscio si ferma da tutte le
      crepe nello stesso momento e poi riprende.

      {resistenza Media} Il caldo ti asciuga gli occhi e ti bagna di sudore le mani nei guanti, e il corpo ti
      dice di passare in fretta.
    opzioni:
      - testo: "Scendere svelto prima che la corda ceda"
        descrizione: "Mani rapide e piedi sulla parete. Se la corda tiene altri cinquanta passi, sei in fondo."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Media }
        successo:
          titolo: Cinquanta passi
          testo: |
            Scendi a balzi con i piedi sulla parete e le mani che scivolano sulla corda calda. In fondo alla
            gola ti butti a sedere su un sasso, e sopra di te la corda smette di fumare. Sul palmo dei guanti
            la pelle si è cotta in due strisce lucide.
          effetti: { profondita.circolo-fenditura: 1 }
        fallimento:
          titolo: Le mani bruciate
          testo: |
            La corda ti scotta attraverso i guanti, e a metà discesa la molli di colpo e scivoli di tre passi.
            Torni su al pianerottolo fresco con i palmi in fiamme, e per tutta la risalita i guanti sanno di
            corda bruciata.
          effetti: { ferite: 0.5 }
      - testo: "Bagnare la corda e la roccia"
        descrizione: "Con la borraccia e un panno la corda si raffredda. L'acqua finisce presto, e la roccia la beve."
        prova: { attributo: mentale, abilita: [natura, percezione], difficolta: Media }
        successo:
          titolo: Il panno bagnato
          testo: |
            Bagni il panno e lo passi sulla corda dove tocca la roccia, scegliendo i punti in cui fuma di più.
            La corda sfrigola a ogni passata e per qualche passo smette di fumare. Scendi piano dietro il
            vapore del panno, e in fondo alla borraccia restano due sorsi.
          effetti: { profondita.circolo-fenditura: 1 }
        fallimento:
          titolo: L'acqua che sparisce
          testo: |
            L'acqua sparisce sulla roccia con un sibilo prima ancora di toccare la corda, e sulla pietra non
            resta neanche una macchia scura. Resti appes{o|a} a guardare la borraccia vuota, poi torni su a
            cercarne altra.
          effetti: { tormento: 1 }
      - testo: "Scendere piano e sopportare il caldo"
        descrizione: "Un passo alla volta, con la corda che fuma. Il caldo si sopporta, se non si ha fretta."
        costo: 2
        esito:
          titolo: Il caldo
          testo: |
            Scendi un passo alla volta, fermandoti a ogni pianerottolo con la schiena alla roccia. Più scendi
            e meno resisti con la schiena appoggiata, perché la pietra scotta attraverso la camicia. In fondo
            alla gola hai la camicia fradicia e la testa che gira come dopo un bagno troppo caldo.
          effetti: { profondita.circolo-fenditura: 1, ferite: 0.5 }

  - id: circolo-fenditura-i-getti-di-vapore
    immagine: ambientazione/rovine-dei-precursori
    titolo: I getti di vapore
    sommario: "Il fondo della gola è attraversato da getti di vapore che escono dalle crepe a intervalli. Uno ti è passato a un palmo dalla faccia."
    luogo: La fenditura del Respiro, il fondo della gola
    area: circolo-fenditura
    ripetibile: true
    requisiti: [profondita.circolo-fenditura <= 1]
    testo: |
      Il fondo della gola è un corridoio di roccia scura lungo cento passi, con le pareti piene di crepe. Le
      crepe sono tutte alla stessa altezza, un palmo sopra la tua testa, e a distanze uguali l'una dall'altra.
      Forse il vapore ha scavato dove la roccia era più tenera, e la roccia era tenera tutta alla stessa
      altezza. Da ogni crepa esce a tratti un getto di vapore bianco che attraversa il corridoio con un
      fischio corto. Il vapore ha lasciato sul pavimento una crosta di sale, e in mezzo c'è lo scheletro
      pulito di un animale piccolo con le ossa bianche di sale.

      {percezione Media} Ogni crepa fischia dopo quella accanto, e il fischio corre lungo il corridoio come
      un'onda.
    opzioni:
      - testo: "Contare i fischi e passare fra un getto e l'altro"
        descrizione: "I getti corrono in fila come un'onda. Basta stare dietro all'onda."
        prova: { attributo: mentale, abilita: percezione, difficolta: Media }
        successo:
          titolo: Dietro l'onda
          testo: |
            Conti i fischi finché non trovi il ritmo, poi ti metti a camminare dietro all'ultimo getto, al suo
            passo. Il sale scricchiola sotto gli stivali e si spacca in lastre sottili. Arrivi in fondo al
            corridoio con il sale fino alle caviglie e la pelle intatta.
          effetti: { profondita.circolo-fenditura: 1 }
        fallimento:
          titolo: Il getto in faccia
          testo: |
            Sbagli il conto di un fischio, e il getto ti prende sul braccio.
            Torni indietro con la pelle rossa e lucida fino al gomito.
          effetti: { ferite: 0.5 }
      - testo: "Attraversare di corsa a bocca chiusa"
        descrizione: "Cento passi di corsa sul sale, con i getti che ti cercano. I polmoni devono reggere il caldo."
        prova: { attributo: fisico, abilita: [resistenza, atletica], difficolta: Media }
        successo:
          titolo: Cento passi
          testo: |
            Corri a testa bassa con la bocca chiusa contro il vapore, e due getti ti sfiorano la schiena senza
            toccarti. Senti il calore attraverso la camicia e il fischio che ti passa sopra la nuca. In fondo
            ti appoggi alla parete, e l'aria calda ti sembra fresca.
          effetti: { profondita.circolo-fenditura: 1 }
        fallimento:
          titolo: Il sale
          testo: |
            A metà corsa scivoli sul sale e cadi, e un getto ti passa sopra mentre sei a terra. Dove il vapore
            tocca il pavimento il sale si scioglie e torna a indurirsi subito. Torni indietro carponi, con la
            schiena che brucia sotto la camicia.
          effetti: { ferite: 1 }
      - testo: "Passare rasente alla parete"
        descrizione: "I getti partono dalle crepe e si allargano. Rasente alla parete, sotto il getto, il caldo è peggio e il colpo è minore."
        costo: 2
        esito:
          titolo: Rasente al muro
          testo: |
            Passi con la schiena contro la parete, sotto i getti che partono sopra la tua testa. Contro le
            scapole senti la roccia vibrare poco prima di ogni fischio. Il caldo ti cuoce le orecchie, e in
            fondo al corridoio hai le mani piene di vesciche.
          effetti: { profondita.circolo-fenditura: 1, ferite: 0.5 }

  # ------------------------------------------------------------ 1 · le radici di metallo
  - id: circolo-fenditura-le-radici-di-metallo
    immagine: ambientazione/rovine-dei-precursori
    titolo: Le radici di metallo
    sommario: "Le radici del Bosco scendono lungo le pareti, e a un certo punto smettono di essere legno."
    luogo: La fenditura del Respiro, le radici di metallo
    area: circolo-fenditura
    ripetibile: true
    requisiti: [profondita.circolo-fenditura == 1]
    testo: |
      Qui le radici del Bosco scendono a fasci lungo le pareti, ognuna grossa quanto un braccio, e bisogna
      scendere con loro. Più in basso la corteccia si fa liscia e grigia, e sotto le dita è fredda anche se la
      roccia intorno scotta. Poi le radici diventano cavi di metallo che entrano nella roccia senza una
      giuntura. Il passaggio dal legno al metallo non ha un punto preciso, e per un palmo intero le venature
      del legno continuano dentro il lucido del metallo.

      {tecnologia Media} Nessuno ha saldato niente. Il metallo è cresciuto dentro la radice, o la radice
      dentro il metallo.

      {origine allievo-di-torvessa} All'Accademia Orvald teneva sotto una campana di vetro un cristallo con
      dentro una fibra di legno. Lo chiamava l'errore, e adesso sai di che cosa.
    opzioni:
      - testo: "Scendere lungo le radici di legno"
        descrizione: "Finché sono di legno le radici si afferrano. Il metallo è liscio."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Media }
        successo:
          titolo: Il fascio
          testo: |
            Scendi lungo un fascio di radici tenendoti dove il legno è ancora ruvido. Quando diventa metallo
            ti lasci scivolare per l'ultimo tratto con gli stivali puntati, e il metallo resta freddo sotto i
            palmi per tutta la scivolata. Tocchi terra dove comincia una strada lastricata.
          effetti: { profondita.circolo-fenditura: 1 }
        fallimento:
          titolo: La presa liscia
          testo: |
            La mano trova il metallo dove ti aspettavi il legno, e scivoli per un tratto lungo prima di
            fermarti contro un nodo. Il nodo è metà corteccia e metà metallo. Risali a fatica, con un
            ginocchio sbucciato.
          effetti: { ferite: 0.5 }
      - testo: "Seguire la radice che porta più giù"
        descrizione: "Le radici vanno tutte verso un punto. La più grossa ci arriva prima."
        prova: { attributo: mentale, abilita: [natura, tecnologia], difficolta: Media }
        successo:
          titolo: La radice madre
          testo: |
            Cerchi la radice più grossa e la segui, e lei scende in una spaccatura della parete dove si
            cammina quasi dritti. Lungo la spaccatura le radici più piccole convergono tutte verso la sua,
            come affluenti. Esci in fondo, sul lastricato di una strada.
          effetti: { profondita.circolo-fenditura: 1 }
        fallimento:
          titolo: La radice sbagliata
          testo: |
            Segui una radice che sembrava la madre, ed entra nella roccia senza lasciarti passare. La roccia
            intorno al punto in cui entra è liscia e senza una crepa. Torni indietro per un tratto lungo, con
            il caldo che ti schiaccia le spalle.
          effetti: { tormento: 1 }
      - testo: "Calarti con la corda lungo la parete"
        descrizione: "La corda arriva fin qui, a stento. Bisogna slegarla in fondo e lasciarla pendere."
        costo: 2
        esito:
          titolo: In fondo alla corda
          testo: |
            Ti cali lungo la parete fino all'ultimo palmo di corda, e
            l'ultimo tratto lo fai saltando. Atterri male, su una caviglia.
          effetti: { profondita.circolo-fenditura: 1, ferite: 0.5 }

  - id: circolo-fenditura-il-guardiano-di-radici
    immagine: icone/tree-roots
    titolo: Il guardiano di radici
    sommario: "Fra le pareti si tende un groviglio di radici di metallo, con una luce azzurra che pulsa nel mezzo. Quando ti avvicini si stringe."
    luogo: La fenditura del Respiro, il passaggio delle radici
    area: circolo-fenditura
    ripetibile: true
    requisiti: [profondita.circolo-fenditura >= 1, profondita.circolo-fenditura <= 2]
    testo: |
      Il passaggio si stringe, e fra le pareti è tesa una rete fitta di radici diventate cavi con una luce
      azzurra che pulsa nel mezzo. Le maglie sono regolari e si fanno più strette verso il centro, e nessuna
      radice del Bosco cresce così. Quando fai un passo i cavi si tendono con un suono di corde di liuto e la
      rete si stringe verso di te. Se ti fermi la nota continua ancora un poco, e la rete si ferma solo quando
      la nota finisce.

      {armi-da-mischia Media} I cavi sottili si tagliano. Quelli grossi vicino alla luce resistono e tengono
      su il resto.

      {furtivita Difficile} La rete si muove al suono delle corde, e il suono lo fanno i tuoi passi. Un passo
      leggero le lascia ferme.
    opzioni:
      - testo: "Tagliarti la strada fino alla luce"
        descrizione: "Una rete di cavi che si stringe. Nel mezzo c'è la luce, e lì si colpisce."
        combattimento: circolo-il-guardiano-di-radici
        vittoria:
          titolo: La luce spenta
          testo: |
            Colpisci la luce azzurra finché non si spegne, e la rete si affloscia di colpo come una tela
            tagliata. I cavi a terra smettono di vibrare uno dopo l'altro, dai più vicini ai più lontani. Fra
            i cavi trovi un nucleo opaco che si stacca con le dita.
          effetti: { profondita.circolo-fenditura: 1, parte.nucleo-1: 1 }
        sconfitta:
          titolo: La rete
          testo: |
            I cavi ti si stringono intorno al braccio e alla gola, e ti liberi soltanto lasciando dentro la
            rete mezzo mantello. Mentre arretri senti la rete suonare più forte e chiudersi sulla stoffa.
            Risali fino al fondo della gola con il collo segnato.
      - testo: "Passare fra i cavi senza toccarli"
        descrizione: "La rete si muove quando sente le corde vibrare. Un passo che non fa vibrare niente passa."
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Difficile }
        successo:
          titolo: Fra le corde
          testo: |
            Passi fra i cavi un piede alla volta con le braccia strette ai fianchi, e la rete resta tesa e
            immobile. Un cavo ti passa a un dito dalla guancia, e ne senti il freddo sulla pelle. Dall'altra
            parte ti accorgi di avere i muscoli delle gambe duri come legno.
          pe: { furtivita: 5 }
          effetti: { profondita.circolo-fenditura: 1 }
        fallimento:
          titolo: Il cavo che suona
          testo: |
            Il tallone sfiora un cavo, e il cavo suona come una corda di liuto. La rete si stringe di colpo, e
            tu ti butti indietro con un taglio lungo sull'avambraccio. Il taglio è netto e sottile e comincia
            a sanguinare solo dopo qualche passo.
          effetti: { ferite: 1 }
      - testo: "Arrampicarti sopra la rete"
        descrizione: "In alto i cavi sono meno fitti, e la parete ha appigli. Ci vuole tempo."
        costo: 2
        esito:
          titolo: Sopra la rete
          testo: |
            Ti arrampichi lungo la parete fino a dove i cavi si diradano, e passi sopra la rete con la schiena
            contro la roccia calda. Sotto di te la luce azzurra pulsa più in fretta mentre passi. Due cavi ti
            sfiorano le caviglie e lasciano il segno.
          effetti: { profondita.circolo-fenditura: 1, ferite: 1 }

  # ------------------------------------------------------------ 2 · la città sepolta
  - id: circolo-fenditura-le-case-piene-di-terra
    immagine: ambientazione/rovine-dei-precursori
    titolo: Le case piene di terra
    sommario: "Una strada di case di pietra e metallo, con le porte troppo alte. Dentro sono piene di terra fino al soffitto."
    luogo: La fenditura del Respiro, la città sepolta
    area: circolo-fenditura
    ripetibile: true
    requisiti: [profondita.circolo-fenditura == 2]
    testo: |
      La strada è lastricata di pietre esagonali che combaciano senza un filo di malta. Le radici passano
      sotto il lastricato, e non c'è una pietra sollevata o rotta. Ai lati ci sono case di pietra scura e
      metallo con le porte alte il doppio di un uomo e le finestre strette come feritoie. Le porte sono
      aperte, e le case sono piene fino al soffitto di una terra compatta attraversata dalle radici del Bosco.
      La terra arriva a filo della soglia e lì si ferma dritta, e sul lastricato non ce n'è un grano.

      {accademiche Media} Le cronache della Caduta parlano di città dei Precursori sotto la Superficie.
      Nessuna dice che qualcuno le abbia riempite di terra casa per casa.
    opzioni:
      - testo: "Leggere i segni sulle porte"
        descrizione: "Ogni porta ha un segno inciso all'altezza degli occhi di qualcuno molto alto."
        prova: { attributo: mentale, abilita: [accademiche, tecnologia], difficolta: Media }
        successo:
          titolo: I segni
          testo: |
            I segni sulle porte sono numeri, o qualcosa che ci somiglia, e vanno in ordine lungo la strada
            fino a una piazza. Per toccarli devi alzare la mano sopra la testa, e i solchi hanno ancora gli
            spigoli vivi. Sull'ultima porta ne trovi uno inciso su una lastrina che si stacca, e te la metti
            in tasca.
          pe: { accademiche: 2 }
          effetti: { profondita.circolo-fenditura: 1, reliquie.frammento-inciso: 1 }
        fallimento:
          titolo: I segni muti
          testo: |
            I segni ti scivolano sotto gli occhi senza dire niente. Le porte sono tutte uguali e cambia solo
            il segno, e a forza di guardarli ti accorgi di aver fatto il giro dello stesso isolato due volte.
          effetti: { tormento: 1 }
      - testo: "Scavare in una casa per vedere che cosa c'è sotto"
        descrizione: "La terra è compatta, ma una mano decisa la smuove. Qualcosa sotto ci sarà."
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Media }
        successo:
          titolo: Il tavolo
          testo: |
            Scavi per un'ora con le mani e il coltello, finché sotto la terra non trovi un tavolo di metallo
            apparecchiato con le ciotole ancora al loro posto. Il tavolo ti arriva al petto, e le ciotole sono
            larghe e basse e senza manici. In una c'è un guscio chiuso che non si apre con le mani.
          effetti: { profondita.circolo-fenditura: 1, reperto.sigillato: 1 }
        fallimento:
          titolo: La terra che cede
          testo: |
            Scavi, e la terra del soffitto ti cade addosso tutta insieme. Ne esci tossendo, con la bocca piena
            di una terra che sa di ferro. Quando ti volti la casa è di nuovo piena fino al soffitto.
          effetti: { contaminazione: 1 }
      - testo: "Percorrere la strada senza fermarti"
        descrizione: "Una città sepolta non ha fretta di raccontarsi. Si passa e basta, e il silenzio si porta addosso."
        costo: 2
        esito:
          titolo: La strada lunga
          testo: |
            Percorri la strada fino in fondo senza guardare dentro le porte. Non senti una goccia che cade né
            un sasso che rotola, e i tuoi passi sono l'unico suono fra le case. Quando arrivi alla piazza ti
            accorgi di avere camminato in punta di piedi per tutto il tempo.
          effetti: { profondita.circolo-fenditura: 1, tormento: 1 }

  - id: circolo-fenditura-la-salvaguardia-che-dorme
    immagine: bestiario/salvaguardia-precursori
    titolo: La Salvaguardia che dorme
    sommario: "In mezzo alla piazza c'è una macchina con quattro braccia, alta due volte un uomo, ferma. Va lasciata dormire."
    luogo: La fenditura del Respiro, la piazza della città sepolta
    area: circolo-fenditura
    ripetibile: true
    requisiti: [profondita.circolo-fenditura >= 2, profondita.circolo-fenditura <= 3]
    testo: |
      La strada sbocca in una piazza rotonda, e nel mezzo c'è una macchina della Salvaguardia con quattro
      braccia ripiegate contro il corpo e la testa china sul petto. Anche così piegata è alta il doppio di te.
      Le piastre del corpo sono lisce e senza ruggine, e sulle spalle non c'è un granello della polvere che
      copre il resto della piazza. Dietro la grata del petto una luce azzurra pulsa piano, come il respiro di
      uno che dorme.

      {tecnologia Media} Dorme davvero. La luce rallenta quando la piazza è silenziosa e accelera a ogni
      rumore.

      Per andare oltre bisogna attraversare la piazza, e la piazza è piccola.
    opzioni:
      - testo: "Attraversare la piazza in silenzio"
        descrizione: "Un passo alla volta, lungo il bordo. La luce nel petto deve restare lenta."
        prova: { attributo: fisico, abilita: furtivita, difficolta: Media }
        successo:
          titolo: La luce lenta
          testo: |
            Attraversi la piazza lungo il bordo, un passo ogni volta che la luce si spegne, e la macchina
            resta china sul petto. A metà del giro senti dentro di lei un ticchettio regolare che si ferma
            quando ti fermi tu. Quando sei dall'altra parte ti accorgi di avere ancora i pugni chiusi.
          effetti: { profondita.circolo-fenditura: 1 }
        fallimento:
          titolo: La testa che si alza
          testo: |
            Un sasso ti rotola sotto lo stivale, e la luce nel petto si fa veloce. La testa della macchina si
            alza di un dito. Scappi indietro lungo la strada, e dietro di te un braccio si apre con un suono
            di ferro e colpisce il punto dove stavi. Sotto il colpo una pietra esagonale del lastricato si
            spacca in due.
          effetti: { ferite: 1.5 }
      - testo: "Tenerla addormentata con il congegno di Aurenne"
        descrizione: "Il congegno di controllo teneva a bada le macchine della Salvaguardia. Può tenerne una addormentata."
        requisiti: [oggetto.congegno-di-controllo >= 1]
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Media }
        successo:
          titolo: Il pollice nella conca
          testo: |
            Premi il pollice nella conca del congegno, e la luce nel petto della macchina si fa lenta,
            lentissima, come una brace coperta. Nel palmo il congegno vibra allo stesso ritmo della luce.
            Attraversi la piazza camminando, e la macchina non si muove.
          pe: { tecnologia: 2 }
          effetti: { profondita.circolo-fenditura: 1 }
        fallimento:
          titolo: Il congegno sbagliato
          testo: |
            Il congegno manda un ronzio, e la macchina alza la testa per ascoltarlo. Torni indietro di corsa,
            e il congegno ti scalda il palmo fino a bruciarlo. Alle tue spalle senti la testa girarsi con uno
            scatto secco.
          effetti: { ferite: 0.5, tormento: 1 }
      - testo: "Fare il giro per le case"
        descrizione: "Dietro le case c'è una strada stretta, piena di terra. Si passa scavando."
        costo: 2
        esito:
          titolo: Dietro le case
          testo: |
            Giri dietro le case scavando con le mani dove la terra chiude la strada, e ci metti metà della
            giornata. Nella terra che smuovi ci sono radici sottili e nessun verme. Dall'altra parte della
            piazza la macchina dorme ancora, e tu hai la terra fin dentro i denti.
          effetti: { profondita.circolo-fenditura: 1, contaminazione: 1 }

  # ------------------------------------------------------------ 3 · il sonno dei Silenti
  - id: circolo-fenditura-la-porta-della-parola
    immagine: ambientazione/rovine-dei-precursori
    titolo: La porta della parola
    sommario: "In fondo alla città c'è una porta di metallo senza maniglia, con quattro segni incisi al centro."
    luogo: La fenditura del Respiro, la porta in fondo alla città
    area: circolo-fenditura
    ripetibile: true
    requisiti: [profondita.circolo-fenditura == 3]
    testo: |
      Dove la città finisce, un muro di metallo grigio chiude la caverna da parete a parete. Il muro non ha
      bulloni né giunture, e la roccia della caverna gli si è chiusa intorno ai bordi senza lasciare una
      fessura. Nel muro c'è una porta altissima senza maniglia, con quattro segni incisi in fila al centro. Ai
      piedi della porta le radici del Bosco passano sotto per una fessura, e dalla fessura esce un calore
      asciutto. A sinistra una galleria stretta gira intorno al muro e si perde nel buio, e le sue pareti
      portano i colpi di un piccone.

      {accademiche Difficile} Ogni segno è una sillaba della scrittura delle porte di sopra, e qui dicono un
      nome.
    opzioni:
      - testo: "Dire la parola della Spina"
        descrizione: "Quattro sillabe, quelle che la Spina ti ha restituito. La porta forse le aspetta da due secoli, e dalla spirale Voren le sentirà."
        quando: [circolo.parola == 1]
        esito:
          titolo: La porta si apre
          testo: |
            Dici la parola ad alta voce, quattro sillabe, come la cantava la Spina. I segni si accendono uno
            dopo l'altro, e la porta si apre verso l'interno senza un suono. Dietro c'è una scala che scende
            ripida, con gradini di metallo consumati al centro e più alti di quelli fatti per le gambe di un
            uomo. Dal fondo della scala arriva un calore che viene da un punto solo. Mentre scendi senti
            dietro gli occhi una pressione che conosci, e poi più niente, come una porta chiusa piano.
          effetti: { profondita.circolo-fenditura: 2, tormento: 1.5 }
          imposta: { circolo.parola: 2 }
      - testo: "Prendere la galleria intorno al muro"
        descrizione: "Una galleria stretta, scavata a mano nel buio. Chi l'ha scavata sapeva dove andava."
        prova: { attributo: mentale, abilita: [percezione, natura], difficolta: Media }
        successo:
          titolo: La galleria
          testo: |
            Segui la galleria nel buio tenendo una mano sulla parete, e a ogni bivio trovi tre tacche incise,
            il segno del Circolo. Le tacche più vecchie hanno i bordi smussati, e le più recenti sono ancora
            chiare nella roccia scura. Esci dall'altra parte del muro, dove le radici riemergono dal
            pavimento.
          effetti: { profondita.circolo-fenditura: 1 }
        fallimento:
          titolo: Il bivio
          testo: |
            Al terzo bivio non trovi il segno e scegli a caso. La galleria finisce contro la roccia, e sulla
            parete in fondo i colpi di piccone si fermano a metà di un solco. Torni indietro al buio contando
            i passi.
          effetti: { tormento: 1 }
      - testo: "Strisciare sotto la porta con le radici"
        descrizione: "Dove passano le radici passa un corpo magro. Il metallo sopra è caldo."
        costo: 2
        esito:
          titolo: Sotto la porta
          testo: |
            Strisci nella fessura insieme alle radici, con il metallo caldo della porta che ti sfiora la
            schiena per tutta la sua altezza. Sotto la pancia le radici sono lisce e tiepide. Dall'altra parte
            ti rialzi con la camicia bruciata in tre punti.
          effetti: { profondita.circolo-fenditura: 1, ferite: 0.5 }

  - id: circolo-fenditura-il-bracciale-di-selara
    immagine: fazioni/circolo-di-velthar
    titolo: Il bracciale nella radice
    sommario: "Dentro una radice, come una pietra in un frutto, c'è un bracciale di corteccia pietrificata con un nome inciso."
    luogo: La fenditura del Respiro, oltre la porta
    area: circolo-fenditura
    ripetibile: true
    requisiti: [profondita.circolo-fenditura == 3]
    testo: |
      Una radice più grossa delle altre attraversa la galleria all'altezza del petto, e dentro c'è un
      bracciale di corteccia diventata pietra lucida. Il legno gli è cresciuto intorno in un anello gonfio e
      lo ha chiuso quasi tutto, come fa un tronco con un chiodo piantato da giovane. Lo lascia scoperto da una
      parte sola, dove c'è un nome inciso a punta di coltello, *Selara*. Per chiudersi così su qualcosa un
      legno ci mette decenni, e i solchi delle lettere hanno ancora gli orli vivi.

      {accademiche Media} Selara Vyn scese nel Rito e ne tornò con un bracciale di corteccia pietrificata che
      non riusciva a togliersi. Questo è uguale, o è lo stesso.
    opzioni:
      - testo: "Leggere quello che c'è inciso sotto il nome"
        descrizione: "Sotto il nome ci sono altri segni, più piccoli, consumati. Ci vuole luce e pazienza."
        prova: { attributo: mentale, abilita: [accademiche, percezione], difficolta: Media }
        successo:
          titolo: Sotto il nome
          testo: |
            Avvicini la lanterna e leggi i segni piccoli sotto il nome con la luce di taglio, che riempie
            d'ombra i solchi. Sono le tre tacche del Circolo, e accanto c'è una data che non è nel calendario
            della Caduta. Le tacche sono incise con la stessa punta del nome, mentre la data ha i solchi
            larghi e tondi. Le ricopi sul palmo con il carbone, e prosegui.
          effetti: { profondita.circolo-fenditura: 1, informazioni.segreto: 1 }
        fallimento:
          titolo: I segni consumati
          testo: |
            I segni sotto il nome sono troppo consumati, e a forza di sfregarli con il pollice ti accorgi di
            averne cancellato uno. Sul polpastrello ti resta una polvere bianca e fine, e dove c'era il segno
            la pietra adesso è liscia come il resto. Ti senti un ladro, e torni indietro.
          effetti: { tormento: 1 }
      - testo: "Lasciare un'offerta alla radice"
        descrizione: "Al Circolo, davanti a un Silente, si lascia qualcosa. Questa radice somiglia a un Silente."
        prova: { attributo: sociale, abilita: [empatia, galateo], difficolta: Media }
        successo:
          titolo: L'offerta
          testo: |
            Lasci sulla radice un pezzo di pane accanto al bracciale, e ti inchini come fanno i novizi davanti
            ai Silenti. La radice resta ferma. Quando ti rialzi la galleria davanti a te è più larga di come
            la ricordavi, e sul pavimento ci sono trucioli di corteccia ancora umidi.
          effetti: { profondita.circolo-fenditura: 1 }
        fallimento:
          titolo: Il pane che cade
          testo: |
            Il pane ti scivola dalle dita e rotola nel buio della galleria.
            Lo cerchi per un pezzo, poi torni indietro a mani vuote.
          effetti: { tormento: 1 }
      - testo: "Passare sotto la radice senza toccarla"
        descrizione: "La radice taglia la galleria a metà. Sotto si passa piegati."
        costo: 2
        esito:
          titolo: "Piegat{o|a} in due"
          testo: |
            Passi sotto la radice piegat{o|a} in due con il bracciale sopra la testa, e la pietra ti manda
            sulla nuca un freddo che nel caldo della galleria non dovrebbe avere. Per tutto il resto della
            galleria ti senti addosso una mano leggera, quella di un padrone di casa che ti accompagna alla
            porta.
          effetti: { profondita.circolo-fenditura: 1, tormento: 1 }

  - id: circolo-fenditura-i-silenti-nelle-radici
    immagine: fazioni/circolo-di-velthar
    titolo: I Silenti nelle radici
    sommario: "Nelle radici della galleria ci sono forme che sembrano persone sedute. Respirano, piano, tutte insieme."
    luogo: La fenditura del Respiro, il sonno dei Silenti
    area: circolo-fenditura
    ripetibile: true
    requisiti: [profondita.circolo-fenditura >= 3]
    testo: |
      Le pareti della galleria sono di radici intrecciate, e dentro ci sono forme che sembrano persone sedute
      a gambe incrociate, avvolte dal legno fino al collo. Le teste sono chine tutte allo stesso angolo, e le
      radici sono passate fra le dita delle mani posate sulle ginocchia. Respirano tutte insieme una volta
      ogni dieci battiti, e il respiro passa lungo la galleria come vento. A ogni soffio la corteccia intorno
      ai petti si apre di un dito e si richiude. Le forme vicine all'ingresso hanno il legno chiaro e liscio,
      e più avanti il legno si fa nero e coperto da una crosta dura e grigia.

      {resilienza Media} Qualcosa ti preme dietro gli occhi da tutte le parti, e la pressione cresce quando le
      cortecce si aprono. Sono tante voci che dicono la stessa cosa, e non capisci che cosa.
    opzioni:
      - testo: "Ascoltarli senza voce"
        descrizione: "I Silenti ti hanno insegnato a parlare senza voce. Qui ce ne sono tanti, e parlano tutti insieme."
        quando: [circolo.sussurro >= 1]
        esito:
          titolo: Tutte le voci
          testo: |
            Lasci entrare la pressione, e le voci si fanno parole. Dicono tutte a turno lo stesso nome come in
            una preghiera, e il nome è quello della città su cui il Bosco è cresciuto. Il turno passa da una
            forma all'altra lungo la parete, e quando arriva vicino a te ti accorgi che lo stai aspettando. In
            fondo al coro ce n'è una più lontana, che non dice niente e ascolta.
          effetti: { profondita.circolo-fenditura: 1, tormento: 1 }
      - testo: "Passare senza lasciarli entrare"
        descrizione: "La pressione cresce a ogni passo. Bisogna tenere la porta chiusa fino in fondo alla galleria."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Media }
        successo:
          titolo: La porta chiusa
          testo: |
            Cammini con i denti stretti e la testa piena delle loro voci, e per non lasciarle entrare conti i
            passi a mezza voce. Ogni dieci battiti il respiro delle radici ti spinge sulla nuca, e tu
            ricominci a contare da capo. Poi la galleria si allarga e la pressione si fa leggera alle tue
            spalle.
          effetti: { profondita.circolo-fenditura: 1 }
        fallimento:
          titolo: La porta aperta
          testo: |
            A metà galleria la pressione entra, e per un tempo lungo ripeti il loro nome senza voce insieme a
            loro. Quando torni in te sei sedut{o|a} contro la parete con le gambe incrociate come le loro, e
            le radici ti sono salite sulle caviglie. Le strappi a due mani, e sulla pelle ti restano i solchi
            rossi della corteccia.
          effetti: { tormento: 1.5 }
      - testo: "Correre fino in fondo"
        descrizione: "Una galleria si fa anche di corsa. Il respiro dei Silenti ti segue, però."
        costo: 2
        esito:
          titolo: Di corsa
          testo: |
            Corri lungo la galleria senza guardare le forme, e il soffio delle radici ti corre dietro una
            volta ogni dieci battiti fino in fondo. Ti arriva sulla schiena caldo e umido e sa di legno
            bagnato, e ogni volta lo senti più vicino. Ti fermi solo quando non lo senti più, con il cuore che
            batte a modo suo.
          effetti: { profondita.circolo-fenditura: 1, tormento: 1 }

  # ------------------------------------------------------------ 4 · l'anticamera
  - id: circolo-fenditura-il-ferro-che-si-sposta
    immagine: ambientazione/rovine-dei-precursori
    titolo: Il ferro che si sposta
    sommario: "In una sala calda e vuota il pavimento trema, e da sotto arriva un rumore di ferro che si sposta."
    luogo: La fenditura del Respiro, l'anticamera
    area: circolo-fenditura
    ripetibile: true
    requisiti: [profondita.circolo-fenditura == 4]
    testo: |
      La galleria finisce in una sala rotonda e vuota, con il soffitto a cupola e le pareti di metallo grigio
      calde al tatto. Le lastre combaciano senza un chiodo e senza una saldatura, e nella cupola liscia ci
      vedi riflessa la lanterna. Il pavimento trema piano a lunghi intervalli. Da molto più sotto arriva un
      rumore di ferro che si sposta, come una catena da nave tirata su un anello alla volta. A ogni tremito la
      polvere del pavimento si raccoglie in righe sottili e parallele che poi restano.

      {resistenza Media} Il tremito ti sale dalle gambe fino ai denti, che ti battono da soli. Ogni anello
      della catena ti arriva nelle ossa un poco prima che nelle orecchie.

      Sulla parete di fronte un'apertura bassa manda una luce azzurra e un calore secco, e le righe di polvere
      vanno tutte da quella parte.
    opzioni:
      - testo: "Restare fermo finché il tremito passa"
        descrizione: "Il ferro sotto si sposta e si ferma. Bisogna aspettare che si fermi, e non avere paura nel frattempo."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Media }
        successo:
          titolo: L'anello successivo
          testo: |
            Resti in piedi in mezzo alla sala con le mani aperte, e conti gli anelli della catena che non
            vedi. Al dodicesimo il tremito si ferma. Nel silenzio che segue senti il ferro laggiù che oscilla
            ancora a lungo, e attraversi la sala fino all'apertura.
          effetti: { profondita.circolo-fenditura: 1 }
        fallimento:
          titolo: La catena
          testo: |
            Al quinto anello ti siedi per terra senza volerlo, con le mani sulle orecchie, e resti così finché
            il tremito non smette. Con le orecchie chiuse il rumore non cala, perché arriva dal pavimento e ti
            sale nelle ossa. Ti rialzi con le ginocchia molli, e torni nella galleria.
          effetti: { tormento: 1.5 }
      - testo: "Attraversare la sala di corsa fra due tremiti"
        descrizione: "Fra un tremito e l'altro c'è un tempo lungo. Venti passi di corsa bastano."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Media }
        successo:
          titolo: Venti passi
          testo: |
            Aspetti la fine di un tremito e corri, e arrivi all'apertura prima che il pavimento ricominci. Ti
            volti, e la sala è vuota e tranquilla come una cappella. Nella polvere le tue impronte tagliano di
            traverso le righe, e al tremito dopo spariscono sotto le righe nuove.
          effetti: { profondita.circolo-fenditura: 1 }
        fallimento:
          titolo: Il pavimento
          testo: |
            Il tremito ricomincia a metà sala, e il pavimento ti butta a terra
            come la coperta di una nave. Torni indietro gattonando.
          effetti: { ferite: 0.5 }
      - testo: "Camminare lungo la parete"
        descrizione: "Lungo la parete il tremito si sente di meno. La parete però scotta."
        costo: 2
        esito:
          titolo: La parete calda
          testo: |
            Cammini lungo la parete con una mano appoggiata, e il metallo ti scalda il palmo fino al dolore.
            Per tutta la curva la parete non ha una giuntura, e la mano non trova un punto più fresco dove
            riposare. All'apertura arrivi con la mano rossa e il tremito nelle ginocchia.
          effetti: { profondita.circolo-fenditura: 1, ferite: 0.5 }

  - id: circolo-fenditura-le-pozze-di-linfa-azzurra
    immagine: ambientazione/cristalli-conduttori
    titolo: Le pozze di linfa azzurra
    sommario: "Nel pavimento dell'anticamera ci sono pozze di una linfa azzurra che fuma. Il passaggio corre fra le pozze."
    luogo: La fenditura del Respiro, l'anticamera
    area: circolo-fenditura
    ripetibile: true
    requisiti: [profondita.circolo-fenditura == 4]
    testo: |
      Un corridoio basso corre fra due file di pozze piene di una linfa azzurra che fuma piano. Le pozze sono
      scavate nella roccia con i bordi arrotondati e sono tutte della stessa misura, e ognuna è piena fino
      allo stesso segno. La linfa è più densa di quella del Bosco e manda una luce e un ronzio che senti nei
      denti. Il fumo sale dritto fino al soffitto, dove ha lasciato sulla roccia una crosta azzurra spessa un
      dito. Sul bordo di una pozza c'è una vecchia ciotola di legno con il fondo azzurro. Il legno è secco e
      spaccato, e l'azzurro gli è entrato nelle venature fino all'orlo.

      {magia Media} È Mana quasi puro sciolto nella linfa, e sale da più in fondo. Ne senti il flusso che
      passa sotto i piedi e va sempre nella stessa direzione.
    opzioni:
      - testo: "Raccogliere la linfa azzurra"
        descrizione: "Il Mana sciolto si raccoglie con la ciotola, se la mano è ferma. Una goccia sulla pelle brucia."
        prova: { attributo: mentale, abilita: [magia, natura], difficolta: Media }
        successo:
          titolo: La ciotola
          testo: |
            Riempi due fiale con la ciotola di legno, piano, senza toccare la superficie con le dita. La linfa
            scende dal bordo della ciotola in un filo denso che non si spezza, e dove l'hai presa la pozza
            resta incavata a lungo prima di tornare piana. Nelle fiale la linfa ronza, e la luce ti colora le
            mani di azzurro.
          effetti: { profondita.circolo-fenditura: 1, circolo.linfa: 2, contaminazione: 1 }
        fallimento:
          titolo: La goccia
          testo: |
            Una goccia ti cade sul dorso della mano e brucia come un tizzone.
            Ti allontani dalle pozze soffiandoci sopra.
          effetti: { ferite: 0.5, contaminazione: 1 }
      - testo: "Passare fra le pozze senza respirarne il fumo"
        descrizione: "Il corridoio è stretto, e il fumo sale da tutte e due le parti."
        prova: { attributo: fisico, abilita: [resistenza, acrobazia], difficolta: Media }
        successo:
          titolo: Il corridoio
          testo: |
            Passi con le labbra serrate e i piedi sul ciglio fra le pozze, che è largo quanto uno stivale e
            consumato liscio nel mezzo. Arrivi in fondo al corridoio con gli occhi che lacrimano e i polmoni
            puliti.
          effetti: { profondita.circolo-fenditura: 1 }
        fallimento:
          titolo: Il fumo
          testo: |
            Respiri a metà corridoio, e il fumo azzurro ti entra in gola come
            un ago. Torni indietro tossendo.
          effetti: { contaminazione: 1.5 }
      - testo: "Avanzare lentamente con un panno sulla bocca"
        descrizione: "Lentamente, con il fumo che passa dal panno. Ne passa poco, ma passa."
        costo: 2
        esito:
          titolo: Il panno azzurro
          testo: |
            Avanzi piano con il panno sulla bocca, e il fumo ti lascia sulla lingua un sapore di ferro e di
            resina che passa anche dalla stoffa. Quando arrivi in fondo il panno è diventato azzurro. Lo butti
            in una pozza, e il panno va giù senza un suono e senza un'increspatura.
          effetti: { profondita.circolo-fenditura: 1, contaminazione: 1 }

  # ------------------------------------------------------------ il cuore · il Custode di linfa (passo 13)
  - id: circolo-fenditura-il-custode
    immagine: bestiario/salvaguardia-precursori
    titolo: Il Custode di linfa
    sommario: "Davanti alla cavità dell'Albero c'è una macchina cresciuta dentro un tronco, con una camera di linfa azzurra al posto del cuore."
    luogo: La fenditura del Respiro, davanti alla cavità
    area: circolo-fenditura
    requisiti: [profondita.circolo-fenditura >= 5, fazione.circolo == 12]
    testo: |
      L'apertura dà su una caverna calda e alta, e in fondo un'altra apertura manda tutta la luce azzurra del
      mondo. A sbarrare la strada c'è un tronco con la corteccia spaccata dall'alto in basso, e dalla
      spaccatura escono braccia. Lungo i bordi della spaccatura il legno è piegato all'infuori e strappato in
      fibre lunghe, che è il modo in cui si apre un tronco quando dentro qualcosa cresce più in fretta di lui.
      Al centro del tronco, dove avrebbe il cuore, c'è una camera di vetro piena di linfa azzurra che pulsa.
      Intorno alla camera la corteccia si sfalda in scaglie secche, e il vetro è pulito e senza un graffio.

      Quando fai un passo nella caverna le quattro braccia si aprono insieme, e il tronco si stacca dalla
      roccia con un suono di radici strappate. Le giunture delle braccia sono di metallo nudo e lucido di
      linfa, e il legno è cresciuto solo fra una giuntura e l'altra.

      {tecnologia Media} È una macchina della Salvaguardia con un tronco cresciuto addosso come l'edera su un
      muro.

      {natura Difficile} Le radici del tronco scendono ancora nella roccia e da lì bevono. Se le leghi, il
      tronco resta dov'è.

      *Il seme di Serha scalda il palmo attraverso la tasca.* Da quando sei entrat{o|a} nella caverna si
      scalda un poco di più a ogni passo.
    opzioni:
      - testo: "Affrontare il Custode di linfa"
        descrizione: "Una macchina dentro un tronco con quattro braccia, protetta da una corteccia che para i colpi. Il cuore è la camera di linfa."
        combattimento: circolo-il-custode-di-linfa
        vittoria:
          titolo: La camera rotta
          testo: |
            La camera di vetro si spacca con un suono di campana, e la linfa azzurra cola sulla roccia e fuma.
            Le quattro braccia si fermano a mezz'aria e ricadono una dopo l'altra. Dentro il tronco qualcosa
            continua a ticchettare sempre più piano finché tace. Dalla corteccia del tronco stacchi una
            scheggia di metallo che si piega sotto il pollice, e fra le radici trovi un guscio chiuso. Poi
            passi oltre, verso la luce.
          pe: { natura: 5 }
          effetti: { fazione.circolo: 1, rep.circolo: 0.5, circolo.corteccia: 1, reperto.sigillato: 1 }
          imposta: { circolo.custode: 1 }
          segue: circolo-occhi-dorati
        sconfitta:
          titolo: Le braccia
          testo: |
            Dal pavimento, con la testa che gira e il sangue in bocca, vedi Voren uscire dall'ombra delle
            radici dove ti aveva seguito senza farsi sentire. Infila il bastone nella camera di vetro mentre
            le braccia sono ancora girate verso di te. La camera si spacca con un suono di campana, e lui ti
            sta già caricando sulle spalle. L'ultima cosa che vedi è la linfa azzurra che fuma sulla roccia,
            nel punto dove eri stes{o|a}.

            Ti tirano su dalla spirale con la corda quando sei già svenut{o|a}, e Serha ti cuce la spalla alla
            luce del vapore.
          effetti: { fazione.circolo: 1, rep.circolo: -0.5, ferite: 1.5, tormento: 1.5 }
          imposta: { circolo.custode: 2 }
          vai: superficie-fratturata
      - testo: "Legarlo al suo tronco con Radici e la corda"
        descrizione: "Il tronco beve dalle radici. Se le leghi con il Respiro e con la corda, non si stacca dalla roccia."
        requisiti: [incantesimo.radici >= 1]
        costo: 2
        prova: { attributo: mentale, abilita: magia, difficolta: Difficile }
        successo:
          titolo: Legato
          testo: |
            Dici le parole di Radici e passi la corda intorno alle radici del tronco, giro dopo giro, mentre
            le braccia ti cercano nel vuoto. Le radici vive della corda si attaccano a quelle del Custode e le
            tengono, e fra le dita senti la corda tendersi con uno scricchiolio di legno verde. Il tronco si
            piega e resta lì, con le braccia aperte, come un albero sotto la neve, e tu passi accanto alla
            camera di linfa senza toccarla. Prima di passare stacchi una scheggia di corteccia di metallo.
          pe: { magia: 10 }
          effetti: { fazione.circolo: 1, rep.circolo: 1, circolo.corteccia: 1 }
          imposta: { circolo.custode: 1 }
          segue: circolo-occhi-dorati
        fallimento:
          titolo: Il tronco si stacca
          testo: |
            La corda scivola sulle radici di metallo unte di linfa, e il tronco si stacca dalla roccia con le
            braccia aperte. Il braccio più basso ti prende al fianco prima che tu riesca a scappare, e il
            colpo ti butta contro la parete. Risali la fenditura a fatica, e Serha ti cuce alla luce del
            vapore.
          effetti: { ferite: 2.5, tormento: 1 }
          vai: superficie-fratturata
      - testo: "Confonderlo con il congegno di Aurenne"
        descrizione: "Il congegno di controllo parla alle macchine della Salvaguardia. Questa ha un tronco intorno, ma la lingua è la stessa."
        requisiti: [oggetto.congegno-di-controllo >= 1]
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Difficile }
        successo:
          titolo: La lingua delle macchine
          testo: |
            Premi il pollice nella conca del congegno e lo tieni lì, mentre il disco si scalda fino a
            bruciare. Le quattro braccia si fermano a mezz'aria, poi si ripiegano contro il tronco, piano,
            come le zampe di un insetto che dorme. Nella camera di vetro la linfa batte sempre più adagio,
            finché quasi non si muove. Passi accanto alla camera di linfa con il congegno che ti brucia la
            mano, e prima di passare stacchi una scheggia di corteccia di metallo.
          pe: { tecnologia: 10 }
          effetti: { fazione.circolo: 1, rep.circolo: 0.5, circolo.corteccia: 1, tormento: 1.5 }
          imposta: { circolo.custode: 1 }
          segue: circolo-occhi-dorati
        fallimento:
          titolo: Il congegno che urla
          testo: |
            Il congegno manda un ronzio acuto, e il Custode si gira verso di te con tutte e quattro le
            braccia. Nella camera di vetro la linfa comincia a battere più in fretta a tempo con il ronzio, e
            un braccio ti prende al fianco prima che tu riesca a spegnerlo. Risali la fenditura a fatica, con
            il disco che ti ha lasciato un cerchio bruciato sul palmo.
          effetti: { ferite: 2.5, tormento: 1.5 }
          vai: superficie-fratturata
      - testo: "Tornare indietro"
        descrizione: "Il Custode non lascia la caverna. La fenditura, però, ricomincia da capo."
        costo: 0
        esito:
          titolo: Indietro
          testo: |
            Esci dalla caverna camminando all'indietro, e le quattro braccia si richiudono contro il tronco
            con uno scatto di metallo. Il tronco torna a posarsi sulla roccia, e le radici ci rientrano senza
            un rumore. Risali la fenditura con il seme di Serha che ti scalda la tasca.
          vai: superficie-fratturata

  # ------------------------------------------------------------ il cuore · la cavità dell'Albero (dopo la quest)
  - id: circolo-fenditura-la-cavita
    immagine: ambientazione/cristalli-conduttori
    titolo: La cavità dell'Albero
    sommario: "La caverna davanti all'Albero è come l'hai lasciata. Il tronco del Custode ha messo nuove braccia, e la linfa azzurra cola ancora."
    luogo: La fenditura del Respiro, la cavità dell'Albero
    area: circolo-fenditura
    requisiti: [profondita.circolo-fenditura >= 5, fazione.circolo >= 14]
    testo: |
      La caverna davanti alla cavità è calda come l'ultima volta, e la luce dall'apertura in fondo ha il
      colore che le hai lasciato. Dalla spaccatura del Custode sono spuntate due braccia nuove di legno verde
      e metallo che si muovono piano come antenne. Hanno la corteccia sottile e chiara, e dove si piegano il
      metallo delle giunture è già lucido. Dove la linfa azzurra era colata è cresciuto un muschio che
      luccica, e la macchia ripete esatta la forma della colata fino all'ultima goccia.

      {magia Media} Dall'apertura il Mana arriva a ondate lunghe e regolari, e senza volerlo le conti sul
      battito del polso. Laggiù l'Albero respira nel modo che hai scelto tu.
    opzioni:
      - testo: "Potare le braccia nuove del Custode"
        descrizione: "Due braccia giovani, più svelte che forti. Chi le pota per primo prende la linfa che portano."
        combattimento: circolo-il-guardiano-di-radici
        vittoria:
          titolo: La potatura
          testo: |
            Tagli le due braccia giovani alla base, e la linfa che portano cola nelle fiale che hai preparato.
            La lama passa facile nel legno verde e stride quando arriva al metallo di dentro, e l'ultimo
            tratto lo finisci a colpi. Dalla spaccatura del tronco stacchi una scheggia di corteccia di
            metallo, prima che si richiuda.
          effetti: { circolo.linfa: 2, circolo.corteccia: 1, contaminazione: 1 }
          vai: superficie-fratturata
        sconfitta:
          titolo: Le braccia giovani
          testo: |
            Le braccia giovani sono più svelte di quanto sembrasse, e ti cacciano dalla caverna a colpi di
            frusta che arrivano con un sibilo sottile. Sulla soglia si fermano tutte e due nello stesso punto
            e nello stesso momento. Risali la fenditura con la schiena segnata.
          vai: superficie-fratturata
      - testo: "Raccogliere il muschio che luccica"
        descrizione: "Il muschio è cresciuto sulla linfa colata. Serha lo vorrà vedere, e i guaritori lo pagano."
        prova: { attributo: mentale, abilita: [natura, medicina], difficolta: Media }
        successo:
          titolo: Il muschio
          testo: |
            Stacchi il muschio dalla roccia a strisce sottili con la lama del coltello, e lo avvolgi in un
            panno umido. Anche dentro il panno il muschio continua a luccicare attraverso la trama della
            stoffa. In città lo chiameranno linfa, perché non hanno un nome migliore.
          pe: { natura: 5 }
          effetti: { circolo.linfa: 2 }
          vai: superficie-fratturata
        fallimento:
          titolo: Il muschio che si spegne
          testo: |
            Il muschio si spegne appena lo stacchi, e in mano ti resta una
            poltiglia grigia che puzza di ferro.
          effetti: { contaminazione: 1 }
          vai: superficie-fratturata
      - testo: "Restare in ascolto davanti all'Albero"
        descrizione: "Dall'apertura il respiro dell'Albero arriva a ondate. Si può stare ad ascoltarlo, e imparare."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Media }
        successo:
          titolo: Le ondate dell'Albero
          testo: |
            Ti siedi sulla soglia della cavità e ascolti l'Albero, a ondate lunghe, finché non ti accorgi di
            averlo fatto per ore. Quando ti alzi la lanterna è consumata fino in fondo e hai le gambe
            intorpidite dal ginocchio in giù. Risali con la testa leggera, e per qualche giorno le formule del
            Respiro ti vengono più facili.
          pe: { magia: 10 }
          effetti: { tormento: 1 }
          vai: superficie-fratturata
        fallimento:
          titolo: Gli occhi
          testo: |
            Ti siedi sulla soglia e ascolti le ondate. A un certo punto, nella roccia sotto l'Albero, ti
            sembra di vedere due fessure dorate che si aprono, e l'ondata che stava arrivando non arriva.
            Quando guardi meglio non c'è niente, e risali di corsa senza voltarti mentre il Mana riprende a
            salire con il suo ritmo.
          effetti: { tormento: 1.5 }
          vai: superficie-fratturata
      - testo: "Tornare indietro"
        descrizione: "L'Albero resta dov'è. La fenditura, anche."
        costo: 0
        esito:
          titolo: Indietro
          testo: |
            Guardi la luce dell'apertura ancora un poco prima di voltarti e risalire, e il calore dell'Albero ti accompagna fino alla corda.
          vai: superficie-fratturata

  # ------------------------------------------------------------ 13 → 14 · occhi dorati
  - id: circolo-occhi-dorati
    immagine: ambientazione/cristalli-conduttori
    titolo: Occhi dorati
    sommario: "In fondo alla cavità c'è l'Albero di Metallo Vivo, acceso. Sotto di lui la roccia ha due occhi."
    luogo: La fenditura del Respiro, la cavità dell'Albero
    area: circolo-fenditura
    tipo: seguito
    requisiti: [fazione.circolo == 13]
    testo: |
      La cavità è rotonda e calda come un forno spento da poco, e nel mezzo c'è l'Albero con il tronco liscio
      e grigio e i rami allargati contro la volta. Da vicino la corteccia è una lamina di metallo con la grana
      del legno, e dal suolo fino ai rami non ha un nodo né una cicatrice. Dai rami sale un vapore azzurro, e
      dalle radici scende nelle crepe una nebbia grigia che da lì sale verso il Bosco. Intorno al tronco la
      roccia è coperta di radici del Bosco nere e secche, che sono arrivate fin qui e si sono fermate a un
      palmo dalla corteccia.

      Da vicino capisci che l'Albero produce Mana e insieme spinge fuori la Marea, e il Bosco di sopra è
      cresciuto per berla. Quando l'Albero era spento il Bosco respirava, e adesso che è acceso lo soffoca.

      {magia Difficile} Il Mana dei rami è più puro di qualunque cristallo, e con quello si potrebbe accendere
      una città o spegnerla. Già dalla soglia lo senti fitto e asciutto sulla pelle del viso.

      Poi la roccia sotto l'Albero si muove e si aprono due enormi occhi dorati senza pupille, in qualcosa che
      sta sotto e si muove con un rumore di ferro. Ognuno è largo più della tua altezza, e la luce che fanno
      resta ferma anche quando laggiù il ferro si sposta.

      Il Circolo Ristretto ti ha detto che le strade sono quattro, una per ogni voce. Adesso tocca a te.
    opzioni:
      - testo: "Chiuderlo con le radici e il seme di Serha"
        descrizione: "Si soffoca l'Albero con le radici del Bosco e il seme che hai in tasca, e il Mana resta sotto."
        prova: { attributo: mentale, abilita: natura, difficolta: Difficile }
        successo:
          titolo: L'Albero chiuso
          testo: |
            Pianti il seme di Serha fra le radici dell'Albero, e il seme si apre nella terra calda e cresce in
            un'ora quanto in un anno. Le sue radici si avvolgono a quelle di metallo e le stringono, e sotto
            le radici nuove la corteccia si raffredda con uno scricchiolio lungo. L'Albero rallenta e il
            vapore si fa sottile, e la nebbia grigia smette di scendere nelle crepe. Quando risali la cavità è
            buia e fredda, e sotto la roccia il rumore di ferro si è fermato.
          pe: { natura: 15 }
          effetti: { fazione.circolo: 1, rep.circolo: 1 }
          imposta: { circolo.albero: 1 }
          vai: superficie-fratturata
        fallimento:
          titolo: Il seme che brucia
          testo: |
            Il seme si apre e brucia nella terra calda prima di mettere radici, e l'Albero ti scaccia con uno
            sbuffo di vapore che ti ustiona le braccia. Il vapore ha l'odore del ferro caldo e ti lascia sulla
            pelle piccole bolle bianche. Puoi riprovare, o scegliere un'altra strada.
          effetti: { ferite: 2 }
          segue: circolo-occhi-dorati
      - testo: "Dargli un ritmo, accordato al respiro del Bosco"
        descrizione: "La strada di Serha. L'Albero si accorda con il Mana alle ondate lente del Bosco, e il Circolo avrà una sorgente da custodire."
        prova: { attributo: mentale, abilita: magia, difficolta: Difficile }
        successo:
          titolo: Il ritmo
          testo: |
            Appoggi le mani sulla corteccia di metallo e la senti battere, troppo in fretta. La rallenti con
            il Mana, un battito alla volta, finché non respira come il Bosco di sopra, a ondate lunghe. Il
            battito ti sale dai palmi fino ai gomiti, e per un tratto il tuo cuore lo segue. Il vapore si fa
            regolare, e la nebbia grigia scende nelle crepe solo quanto il Bosco ne può bere. Quando risali la
            luce della cavità pulsa lenta dietro di te. Settimane dopo Serha scambierà le misure con Orvald
            Temmerin.
          pe: { magia: 15 }
          effetti: { fazione.circolo: 1, rep.circolo: 1, rep.accademia: 1 }
          imposta: { circolo.albero: 2 }
          vai: superficie-fratturata
        fallimento:
          titolo: Il battito che scappa
          testo: |
            Il battito ti scappa sotto le dita e accelera, e la corteccia ti scotta i palmi. Ti stacchi con le
            mani ustionate, e sotto la roccia il ferro si sposta di un anello. Puoi riprovare, o scegliere
            un'altra strada.
          effetti: { ferite: 2 }
          segue: circolo-occhi-dorati
      - testo: "Dargli un ritmo, con la vena che conosce il tuo sangue"
        descrizione: "La vena ti ha già riconosciuto una volta. Qui il Mana è lo stesso, e il ritmo lo trovi più in fretta."
        quando: [circolo.vena >= 1]
        prova: { attributo: mentale, abilita: magia, difficolta: Media }
        successo:
          titolo: Il ritmo
          testo: |
            Appoggi le mani sulla corteccia, e il calore che ti è rimasto nel polso dalla vena di Serha si
            sveglia e corre incontro al Mana dell'Albero. Lo rallenti insieme a lui, un battito alla volta,
            finché non respira come il Bosco di sopra. Sotto la pelle del polso la vena si gonfia e si vede
            pulsare, e torna piatta solo a metà della salita. Quando risali il vapore sale regolare dietro di
            te. Settimane dopo Serha scambierà le misure con Orvald Temmerin.
          pe: { magia: 15 }
          effetti: { fazione.circolo: 1, rep.circolo: 1, rep.accademia: 1 }
          imposta: { circolo.albero: 2 }
          vai: superficie-fratturata
        fallimento:
          titolo: Il battito che scappa
          testo: |
            La vena nel polso risponde troppo, e il Mana ti risale nel braccio come acqua bollente. Ti stacchi
            con le mani ustionate, e sulla pelle resta a lungo una riga rossa che segue la vena fino al
            gomito. Puoi riprovare, o scegliere un'altra strada.
          effetti: { ferite: 2 }
          segue: circolo-occhi-dorati
      - testo: "Dargli un ritmo con il congegno di Aurenne"
        descrizione: "Il congegno parla alle macchine dei Precursori. L'Albero è una macchina anche lui, e il congegno gli può dare il passo."
        requisiti: [oggetto.congegno-di-controllo >= 1]
        prova: { attributo: mentale, abilita: magia, difficolta: Media }
        successo:
          titolo: Il passo
          testo: |
            Premi il congegno contro la corteccia, e il disco si scalda e comincia a battere, lento. L'Albero
            lo ascolta, e dopo un poco batte con lui, a ondate lunghe, come il Bosco di sopra. Per un tratto i
            due battiti si accavallano e il disco ti trema nel palmo, poi vanno insieme. Quando risali la
            cavità respira dietro di te. Settimane dopo Serha scambierà le misure con Orvald Temmerin.
          pe: { magia: 15 }
          effetti: { fazione.circolo: 1, rep.circolo: 1, rep.accademia: 1 }
          imposta: { circolo.albero: 2 }
          vai: superficie-fratturata
        fallimento:
          titolo: Il disco che brucia
          testo: |
            Il congegno si scalda fino a bruciare, e l'Albero lo respinge con uno sbuffo di vapore. Ti stacchi
            con le mani ustionate, e il disco resta rovente in tasca per tutto il tempo che ci metti a
            riprendere fiato. Puoi riprovare, o scegliere un'altra strada.
          effetti: { ferite: 2 }
          segue: circolo-occhi-dorati
      - testo: "Lasciarlo ai Silenti, e tenere aperta la via a Voren"
        descrizione: "La strada di Voren. Lui scende e si fonde con l'Albero, e da quel giorno l'Albero ascolta con le orecchie dei Silenti."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Difficile }
        successo:
          titolo: La voce di Voren
          testo: |
            Voren arriva alle tue spalle senza che tu l'abbia sentito scendere. Si toglie il cappuccio, e per
            la prima volta gli vedi la faccia, che è una faccia qualunque, stanca. «Grazie» dice, con la voce
            roca di uno che non la usa da tredici anni. Poi entra fra le radici dell'Albero, e tu tieni aperta
            la via nella tua testa mentre le radici lo avvolgono. Lo prendono prima alle caviglie e poi alle
            spalle, e lui si siede a gambe incrociate come i Silenti della galleria. La pressione che
            conoscevi si allarga fino a diventare enorme, e diventa l'Albero. Quando risali la cavità è in
            ascolto.
          pe: { resilienza: 15 }
          effetti: { fazione.circolo: 1, rep.circolo: 1, rep.velo: -1, tormento: 1.5 }
          imposta: { circolo.albero: 3 }
          vai: superficie-fratturata
        fallimento:
          titolo: La via che si chiude
          testo: |
            Voren entra fra le radici, e a metà la via nella tua testa si chiude come una porta sbattuta dal
            vento. Lui si ferma e torna indietro, e le radici che lo avevano preso alle caviglie lo lasciano
            andare con uno strappo. Ti guarda senza rimprovero. Hai il naso che sanguina. Puoi riprovare, o
            scegliere un'altra strada.
          effetti: { ferite: 2, tormento: 1.5 }
          segue: circolo-occhi-dorati
      - testo: "Tagliare un ramo vivo per il Velo"
        descrizione: "Un ramo vivo dell'Albero vale più di una fiala, e il Velo ne farà una reliquia che il Circolo non perdonerà."
        quando: [circolo.promessa-velo == 1]
        prova: { attributo: fisico, abilita: [armi-da-mischia, atletica], difficolta: Difficile }
        successo:
          titolo: Il ramo per il Velo
          testo: |
            Sali sull'Albero fino al primo ramo e lo tagli alla base, con la corteccia che si stringe sulla
            lama come una bocca. Dal taglio cola una linfa azzurra e densa che fuma sul filo. Ne tagli due,
            uno per il Velo e uno per te, e il secondo lo nascondi sotto il mantello. Il primo lo porti in
            Cattedrale avvolto nel lino. Padre Vantes lo prende in ginocchio, e il Velo ti paga come si paga
            una reliquia. Una settimana dopo i carri della Confraternita passano dal margine, e i druidi li
            guardano passare.
          pe: { armi-da-mischia: 15 }
          effetti: { fazione.circolo: 1, rep.velo: 2, rep.circolo: -3, monete: 200 }
          imposta: { circolo.albero: 4 }
          vai: superficie-fratturata
        fallimento:
          titolo: La corteccia che si stringe
          testo: |
            La corteccia si stringe sulla lama e non la lascia, e quando la strappi via l'Albero ti scaccia
            con uno sbuffo di vapore. Sul filo restano due tacche profonde nel punto dove la corteccia l'ha
            stretta. Puoi riprovare, o scegliere un'altra strada.
          effetti: { ferite: 2 }
          segue: circolo-occhi-dorati
      - testo: "Segnare il posto per i Raschiatori"
        descrizione: "La squadra di Dragna è accampata al margine. Basta un segno sulla roccia perché domani scendano, e il Circolo non lo perdonerà a lungo."
        quando: [circolo.dragna == 1]
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Difficile }
        successo:
          titolo: Il segno di gesso
          testo: |
            Segni con il gesso la strada dalla corda all'Albero, un segno a ogni svolta, come fanno i
            Raschiatori. Sulla roccia calda il gesso tiene male, e ogni segno lo ripassi due volte perché
            resti. Prima di risalire tagli un ramo per te e lo nascondi sotto il mantello. Il giorno dopo la
            squadra di Dragna scende con i picconi e le casse. Dragna ti paga al Grifone davanti a tutta la
            sala, e i druidi, al margine, guardano passare le casse.
          pe: { tecnologia: 15 }
          effetti: { fazione.circolo: 1, rep.raschiatori: 2, rep.circolo: -3, monete: 200 }
          imposta: { circolo.albero: 4, circolo.dragna: 2 }
          vai: superficie-fratturata
        fallimento:
          titolo: Il gesso che si scioglie
          testo: |
            Il gesso si scioglie sulla roccia calda prima di asciugare, e i segni colano come lacrime. Le
            gocce bianche arrivano fino alle crepe e ci spariscono dentro insieme alla nebbia che scende. Ti
            accorgi di aver segnato a metà, e l'Albero ti scaccia con uno sbuffo di vapore. Puoi riprovare, o
            scegliere un'altra strada.
          effetti: { ferite: 2 }
          segue: circolo-occhi-dorati
      - testo: "Restare accanto all'Albero finché il Maestro non scende"
        descrizione: "Se nessuna strada è la tua, si aspetta chi sa."
        costo: 3
        esito:
          titolo: Il Maestro scende
          testo: |
            Ti siedi accanto all'Albero e aspetti per tre giorni, con il caldo che ti secca la pelle e gli
            occhi dorati che sogni da svegli{o|a}. L'acqua della borraccia finisce il secondo giorno, e l'olio
            della lanterna ancora prima. Il terzo giorno Aelion scende con la corda, lui che non era mai
            sceso. Insieme piantate il seme di Serha fra le radici, e lui lo fa crescere con le mani, cantando
            a voce bassa, finché l'Albero non rallenta e si chiude. Risalite insieme, e lui non ti dice niente
            per tutta la salita.
          effetti: { fazione.circolo: 1, ferite: 1, tormento: 1.5 }
          imposta: { circolo.albero: 1 }
          vai: superficie-fratturata
