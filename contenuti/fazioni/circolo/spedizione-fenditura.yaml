# La fenditura del Respiro, spedizione della quest del Circolo di Velthar (dal passo 13, poi ripetibile).
# Ci si entra dal Bosco di Velthar con la corda (chiave «fenditura»): la prima volta con `circolo-la-discesa`
# (passi-3.yaml), dopo la quest con `circolo-fenditura-scendere`. La ritirata riporta alla Superficie Fratturata.
# Le stanze vanno in fasce di profondità, e una stanza superata non ricompare nella stessa visita:
# 0 la gola calda (la corda che si sfilaccia; i getti di vapore, che valgono anche a 1),
# 1 le radici di metallo (le radici che diventano cavi; il guardiano di radici, che vale anche a 2),
# 2 la città sepolta (le case piene di terra; la Salvaguardia che dorme in piazza, che vale anche a 3),
# 3 il sonno dei Silenti (la porta della parola, che con circolo.parola == 1 salta una fascia ma Voren la sente;
#   il bracciale di Selara; i Silenti nelle radici, che valgono anche a 4),
# 4 l'anticamera (il ferro che si sposta; le pozze di linfa azzurra).
# Il cuore a 5: il Custode di linfa (boss, fazione.circolo == 12, porta a 13 e apre subito gli occhi dorati) e, dopo la
# quest, la cavità dell'Albero (fazione.circolo >= 14). Il passo 14, `circolo-occhi-dorati`, sta qui in fondo.
# Ogni stanza ha una via senza prova che costa due rintocchi e un poco di Ferite, Tormento o Contaminazione.
aree:
  - id: circolo-fenditura
    immagine: ambientazione/rovine-dei-precursori
    nome: La fenditura del Respiro
    sommario: "Sotto la spirale del Circolo una gola calda scende fino a una città sepolta, e oltre."
    spedizione: { ritorno: superficie-fratturata, soglia: 5, stanze: 3 }
    testo: |
      Sotto il Circolo del Respiro la fenditura si allarga in una gola di pietra scura, calda come un forno, dove il vapore sale da crepe che non si vedono. Più giù le radici del Bosco, grosse come gomene,
      smettono di essere legno e diventano metallo grigio.

      Ancora più sotto c'è una città di pietra e metallo con le case piene di terra fino al soffitto, e in fondo, dove la città finisce, il calore viene da un punto solo.

storylet:
  # ------------------------------------------------------------ l'ingresso, dopo la quest
  - id: circolo-fenditura-scendere
    presso: circolo-bosco-di-velthar
    immagine: fazioni/circolo-di-velthar
    titolo: La fenditura del Respiro
    sommario: "La corda pende ancora dalla pietra più bassa della spirale."
    luogo: Il Bosco di Velthar, il bordo della fenditura
    area: superficie-fratturata
    ripetibile: true
    requisiti: [fazione.circolo >= 14]
    testo: |
      La corda è rimasta legata alla pietra più bassa della spirale, e i
      novizi la bagnano a turno perché il calore non la secchi. Qualcuno
      scende ogni tanto alla città sepolta a prendere le misure per Serha,
      ma più giù scendono in pochi.

      {atletica Facile} Le braccia ricordano i duecento passi di corda, e si
      fanno sentire già adesso, solo a guardarla.
    opzioni:
      - testo: "Scendere nella fenditura"
        descrizione: "Duecento passi di corda nel buio caldo, su una strada che conosci."
        requisiti: [chiave.fenditura >= 1]
        esito:
          titolo: Di nuovo giù
          testo: |
            Ti cali nel buio con i guanti, una mano sotto l'altra, finché i piedi
            toccano la roccia calda della gola.
          vai: circolo-fenditura

  # ------------------------------------------------------------ 0 · la gola calda
  - id: circolo-fenditura-la-corda-che-si-sfilaccia
    immagine: ambientazione/rovine-dei-precursori
    titolo: La corda che si sfilaccia
    sommario: "A metà della gola la roccia è così calda che la corda fuma."
    luogo: La fenditura del Respiro, la gola calda
    area: circolo-fenditura
    ripetibile: true
    requisiti: [profondita.circolo-fenditura == 0]
    testo: |
      La gola scende ripida, con la corda appoggiata alla roccia, e a metà
      strada la roccia è così calda che la corda fuma dove la tocca, con un
      odore di canapa bruciata. Da sotto arriva il fruscio del vapore che
      sale da cento crepe.

      {resistenza Media} Il caldo ti asciuga gli occhi e la bocca, e le mani
      sudano nei guanti. Il corpo dice che di qui si passa una volta sola, e
      in fretta.
    opzioni:
      - testo: "Scendere svelto prima che la corda ceda"
        descrizione: "Mani rapide e piedi sulla parete, finché la corda tiene."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Media }
        successo:
          titolo: Cinquanta passi
          testo: |
            Scendi a balzi con i piedi sulla parete, e in fondo alla gola ti butti
            a sedere su un sasso.
          effetti: { profondita.circolo-fenditura: 1 }
        fallimento:
          titolo: Le mani bruciate
          testo: |
            Quando la corda ti scotta attraverso i guanti la molli e scivoli di
            tre passi. Torni su con i palmi in fiamme.
          effetti: { ferite: 0.5 }
      - testo: "Bagnare la corda e la roccia"
        descrizione: "Con la borraccia e un panno la corda si raffredda, finché dura l'acqua."
        prova: { attributo: mentale, abilita: [natura, percezione], difficolta: Media }
        successo:
          titolo: Il panno bagnato
          testo: |
            Bagni la corda dove fuma di più e scendi piano, e in fondo alla
            borraccia restano due sorsi.
          effetti: { profondita.circolo-fenditura: 1 }
        fallimento:
          titolo: L'acqua che sparisce
          testo: |
            L'acqua sparisce sulla roccia con un sibilo prima di toccare la corda,
            e torni su a cercarne altra.
          effetti: { tormento: 1 }
      - testo: "Scendere piano e sopportare il caldo"
        descrizione: "Un passo alla volta, con la corda che fuma e il caldo che si sopporta."
        costo: 2
        esito:
          titolo: Il caldo
          testo: |
            Scendi un passo alla volta, e in fondo alla gola hai la camicia fradicia
            e la testa che gira.
          effetti: { profondita.circolo-fenditura: 1, ferite: 0.5 }

  - id: circolo-fenditura-i-getti-di-vapore
    immagine: ambientazione/rovine-dei-precursori
    titolo: I getti di vapore
    sommario: "Le crepe in fondo alla gola sputano getti di vapore a intervalli."
    luogo: La fenditura del Respiro, il fondo della gola
    area: circolo-fenditura
    ripetibile: true
    requisiti: [profondita.circolo-fenditura <= 1]
    testo: |
      Il fondo della gola è un corridoio di roccia lungo cento passi, e da
      ogni crepa delle pareti esce a intervalli, con un fischio corto, un
      getto di vapore che lo attraversa. Sul pavimento il vapore ha lasciato
      una crosta di sale.

      {percezione Media} I getti non vengono a caso, perché ogni crepa
      fischia dopo quella accanto e il fischio corre lungo il corridoio come
      un'onda.
    opzioni:
      - testo: "Contare i fischi e passare fra un getto e l'altro"
        descrizione: "I getti corrono in fila come un'onda. Basta stare dietro all'onda."
        prova: { attributo: mentale, abilita: percezione, difficolta: Media }
        successo:
          titolo: Dietro l'onda
          testo: |
            Conti i fischi finché trovi il ritmo e cammini dietro all'ultimo
            getto, arrivando in fondo con il sale alle caviglie e la pelle
            intatta.
          effetti: { profondita.circolo-fenditura: 1 }
        fallimento:
          titolo: Il getto in faccia
          testo: |
            Sbagli il conto di un fischio, e il getto ti prende sul braccio
            lasciandoti la pelle rossa fino al gomito.
          effetti: { ferite: 0.5 }
      - testo: "Attraversare di corsa a bocca chiusa"
        descrizione: "Cento passi di corsa sul sale, con i polmoni che devono reggere il caldo."
        prova: { attributo: fisico, abilita: [resistenza, atletica], difficolta: Media }
        successo:
          titolo: Cento passi
          testo: |
            Corri a testa bassa con la bocca chiusa, e due getti ti sfiorano la
            schiena senza prenderti.
          effetti: { profondita.circolo-fenditura: 1 }
        fallimento:
          titolo: Il sale
          testo: |
            A metà corsa scivoli sul sale, e un getto ti passa sopra e ti brucia
            la schiena prima che tu torni indietro carponi.
          effetti: { ferite: 1 }
      - testo: "Passare rasente alla parete"
        descrizione: "Sotto i getti, rasente alla parete, il caldo è peggio ma il colpo è minore."
        costo: 2
        esito:
          titolo: Rasente al muro
          testo: |
            Passi con la schiena contro la parete e i getti sopra la testa, e in
            fondo hai le orecchie cotte e le mani piene di vesciche.
          effetti: { profondita.circolo-fenditura: 1, ferite: 0.5 }

  # ------------------------------------------------------------ 1 · le radici di metallo
  - id: circolo-fenditura-le-radici-di-metallo
    immagine: ambientazione/rovine-dei-precursori
    titolo: Le radici di metallo
    sommario: "Lungo le pareti le radici del Bosco smettono di essere legno."
    luogo: La fenditura del Respiro, le radici di metallo
    area: circolo-fenditura
    ripetibile: true
    requisiti: [profondita.circolo-fenditura == 1]
    testo: |
      Qui le radici del Bosco scendono a fasci lungo le pareti, e per andare avanti si scende con loro. Più in basso la corteccia si fa liscia e grigia, finché le radici diventano cavi di metallo che entrano nella roccia senza una giuntura.

      {origine allievo-di-torvessa} All'Accademia Orvald teneva sotto una campana di vetro un cristallo con dentro una fibra di legno. Lo chiamava l'errore, e adesso sai di che cosa.
    opzioni:
      - testo: "Scendere lungo le radici di legno"
        descrizione: "Il legno si afferra, il metallo è liscio."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Media }
        successo:
          titolo: Il fascio
          testo: |
            Scendi tenendoti al legno ruvido, e dove diventa metallo ti lasci
            scivolare fino a una strada lastricata.
          effetti: { profondita.circolo-fenditura: 1 }
        fallimento:
          titolo: La presa liscia
          testo: |
            La mano trova il metallo dove ti aspettavi il legno, e scivoli finché
            un nodo ti ferma con un ginocchio sbucciato.
          effetti: { ferite: 0.5 }
      - testo: "Seguire la radice che porta più giù"
        descrizione: "Le radici vanno tutte verso un punto. La più grossa ci arriva prima."
        prova: { attributo: mentale, abilita: [natura, tecnologia], difficolta: Media }
        successo:
          titolo: La radice madre
          testo: |
            La radice più grossa scende in una spaccatura dove si cammina quasi
            dritti, fino al lastricato di una strada.
          effetti: { profondita.circolo-fenditura: 1 }
        fallimento:
          titolo: La radice sbagliata
          testo: |
            La radice che segui entra nella roccia senza lasciarti passare, e
            torni indietro per un tratto lungo.
          effetti: { tormento: 1 }
      - testo: "Calarti con la corda lungo la parete"
        descrizione: "La corda arriva fin qui, a stento. Bisogna slegarla in fondo e lasciarla pendere."
        costo: 2
        esito:
          titolo: In fondo alla corda
          testo: |
            Ti cali fino all'ultimo palmo di corda e fai l'ultimo tratto saltando,
            atterrando male su una caviglia.
          effetti: { profondita.circolo-fenditura: 1, ferite: 0.5 }

  - id: circolo-fenditura-il-guardiano-di-radici
    immagine: icone/tree-roots
    titolo: Il guardiano di radici
    sommario: "Una rete di cavi con una luce azzurra nel mezzo chiude il passaggio."
    luogo: La fenditura del Respiro, il passaggio delle radici
    area: circolo-fenditura
    ripetibile: true
    requisiti: [profondita.circolo-fenditura >= 1, profondita.circolo-fenditura <= 2]
    testo: |
      Il passaggio si stringe, e da parete a parete è tesa una rete di radici diventate cavi, fitta come una tela di ragno, con nel
      mezzo una luce azzurra grande come un pugno. Quando fai un passo i cavi si tendono con un suono di corde di liuto, e la rete
      si stringe verso di te.

      {armi-da-mischia Media} I cavi più sottili si tagliano, mentre quelli grossi vicino alla luce resistono e tengono su tutto il
      resto.
    opzioni:
      - testo: "Tagliarti la strada fino alla luce"
        descrizione: "Una rete di cavi che si stringe, e nel mezzo la luce da colpire."
        combattimento: circolo-il-guardiano-di-radici
        vittoria:
          titolo: La luce spenta
          testo: |
            Colpisci la luce azzurra finché si spegne e la rete si affloscia, e
            fra i cavi trovi un nucleo opaco che si stacca con le dita.
          effetti: { profondita.circolo-fenditura: 1, parte.nucleo-1: 1 }
        sconfitta:
          titolo: La rete
          testo: |
            I cavi ti stringono il braccio e la gola, e ti liberi lasciando nella
            rete mezzo mantello e tornando indietro con il collo segnato.
      - testo: "Passare fra i cavi senza toccarli"
        descrizione: "La rete si muove quando sente vibrare le corde."
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Difficile }
        successo:
          titolo: Fra le corde
          testo: |
            Passi fra i cavi un piede alla volta, con le braccia strette ai fianchi, e
            la rete resta immobile.
          pe: { furtivita: 5 }
          effetti: { profondita.circolo-fenditura: 1 }
        fallimento:
          titolo: Il cavo che suona
          testo: |
            Il tallone sfiora un cavo, la rete si stringe di colpo e ti butti
            indietro con un taglio lungo sull'avambraccio.
          effetti: { ferite: 1 }
      - testo: "Arrampicarti sopra la rete"
        descrizione: "In alto i cavi sono meno fitti, e la parete ha appigli. Ci vuole tempo."
        costo: 2
        esito:
          titolo: Sopra la rete
          testo: |
            Ti arrampichi fino a dove i cavi si diradano e passi sopra la rete,
            con due cavi che ti segnano le caviglie.
          effetti: { profondita.circolo-fenditura: 1, ferite: 1 }

  # ------------------------------------------------------------ 2 · la città sepolta
  - id: circolo-fenditura-le-case-piene-di-terra
    immagine: ambientazione/rovine-dei-precursori
    titolo: Le case piene di terra
    sommario: "Case di pietra e metallo, piene di terra fino al soffitto."
    luogo: La fenditura del Respiro, la città sepolta
    area: circolo-fenditura
    ripetibile: true
    requisiti: [profondita.circolo-fenditura == 2]
    testo: |
      La strada è lastricata di pietre esagonali, fra case di pietra scura e metallo con le porte alte il doppio di un uomo. Dentro sono
      piene fino al soffitto di una terra compatta attraversata dalle radici, e da una finestra spunta lo schienale di una sedia di metallo
      piccola, forse di un bambino.

      {accademiche Media} Le cronache della Caduta parlano di città dei Precursori sotto la Superficie, ma non di qualcuno che le abbia
      riempite di terra casa per casa.
    opzioni:
      - testo: "Leggere i segni sulle porte"
        descrizione: "Ogni porta ha un segno inciso all'altezza degli occhi di qualcuno molto alto."
        prova: { attributo: mentale, abilita: [accademiche, tecnologia], difficolta: Media }
        successo:
          titolo: I segni
          testo: |
            I segni sulle porte sono numeri, o qualcosa di simile, in ordine fino
            a una piazza, e sull'ultima porta ne stacchi uno inciso su una
            lastrina.
          pe: { accademiche: 2 }
          effetti: { profondita.circolo-fenditura: 1, reliquie.frammento-inciso: 1 }
        fallimento:
          titolo: I segni muti
          testo: |
            I segni non ti dicono niente, e a forza di guardarli fai due volte il
            giro dello stesso isolato.
          effetti: { tormento: 1 }
      - testo: "Scavare in una casa per vedere che cosa c'è sotto"
        descrizione: "La terra è compatta, ma sotto qualcosa ci sarà."
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Media }
        successo:
          titolo: Il tavolo
          testo: |
            Scavando per un'ora trovi un tavolo di metallo apparecchiato, e in una
            ciotola un guscio chiuso che non si apre con le mani.
          effetti: { profondita.circolo-fenditura: 1, reperto.sigillato: 1 }
        fallimento:
          titolo: La terra che cede
          testo: |
            La terra del soffitto ti cade addosso, e ne esci tossendo con la bocca
            che sa di ferro.
          effetti: { contaminazione: 1 }
      - testo: "Percorrere la strada senza fermarti"
        descrizione: "Una città sepolta si può anche attraversare e basta."
        costo: 2
        esito:
          titolo: La strada lunga
          testo: |
            Percorri la strada senza guardare dentro le porte, e alla piazza ti
            accorgi di avere camminato in punta di piedi.
          effetti: { profondita.circolo-fenditura: 1, tormento: 1 }

  - id: circolo-fenditura-la-salvaguardia-che-dorme
    immagine: bestiario/salvaguardia-precursori
    titolo: La Salvaguardia che dorme
    sommario: "In mezzo alla piazza dorme una macchina con quattro braccia, alta due volte un uomo."
    luogo: La fenditura del Respiro, la piazza della città sepolta
    area: circolo-fenditura
    ripetibile: true
    requisiti: [profondita.circolo-fenditura >= 2, profondita.circolo-fenditura <= 3]
    testo: |
      La strada sbocca in una piazza rotonda, e nel mezzo c'è una macchina della Salvaguardia alta due volte un uomo, con quattro braccia ripiegate e la testa china sul petto, e le radici del Bosco le sono
      cresciute sulle spalle. Dietro la grata del petto pulsa piano una luce azzurra.

      {tecnologia Media} Dorme davvero, e la luce rallenta quando la piazza tace e accelera a ogni rumore, come l'orecchio di un cane che sogna.

      Per andare oltre bisogna attraversare la piazza, che è piccola.
    opzioni:
      - testo: "Attraversare la piazza in silenzio"
        descrizione: "Un passo alla volta, lungo il bordo. La luce nel petto deve restare lenta."
        prova: { attributo: fisico, abilita: furtivita, difficolta: Media }
        successo:
          titolo: La luce lenta
          testo: |
            Attraversi lungo il bordo, un passo ogni volta che la luce si spegne,
            e dall'altra parte ti accorgi di avere i pugni chiusi.
          effetti: { profondita.circolo-fenditura: 1 }
        fallimento:
          titolo: La testa che si alza
          testo: |
            Un sasso ti rotola sotto lo stivale e la luce accelera. Scappi
            indietro mentre un braccio si apre con un suono di ferro e colpisce il
            punto dove stavi.
          effetti: { ferite: 1.5 }
      - testo: "Tenerla addormentata con il congegno di Aurenne"
        descrizione: "Il congegno di controllo teneva a bada le macchine della Salvaguardia, e può tenerne una addormentata."
        requisiti: [oggetto.congegno-di-controllo >= 1]
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Media }
        successo:
          titolo: Il pollice nella conca
          testo: |
            Premi il pollice nella conca del congegno, la luce nel petto rallenta
            come una brace coperta e attraversi la piazza camminando.
          pe: { tecnologia: 2 }
          effetti: { profondita.circolo-fenditura: 1 }
        fallimento:
          titolo: Il congegno sbagliato
          testo: |
            Il congegno ronza, la macchina alza la testa per ascoltarlo e torni
            indietro di corsa con il palmo bruciato.
          effetti: { ferite: 0.5, tormento: 1 }
      - testo: "Fare il giro per le case"
        descrizione: "Dietro le case c'è una strada stretta, piena di terra. Si passa scavando."
        costo: 2
        esito:
          titolo: Dietro le case
          testo: |
            Giri dietro le case scavando dove la terra chiude la strada, e arrivi
            dall'altra parte a metà giornata, con la terra fin dentro i denti.
          effetti: { profondita.circolo-fenditura: 1, contaminazione: 1 }

  # ------------------------------------------------------------ 3 · il sonno dei Silenti
  - id: circolo-fenditura-la-porta-della-parola
    immagine: ambientazione/rovine-dei-precursori
    titolo: La porta della parola
    sommario: "In fondo alla città c'è una porta di metallo senza maniglia, con quattro segni incisi."
    luogo: La fenditura del Respiro, la porta in fondo alla città
    area: circolo-fenditura
    ripetibile: true
    requisiti: [profondita.circolo-fenditura == 3]
    testo: |
      Dove la città finisce, un muro di metallo grigio chiude la caverna, con una porta alta tre uomini senza maniglia e al centro
      quattro segni incisi in fila, ognuno grande quanto una mano. Ai piedi della porta le radici del Bosco passano sotto per una
      fessura, e a sinistra una galleria stretta gira intorno al muro e si perde nel buio.

      {accademiche Difficile} Ogni segno è una sillaba della scrittura delle porte di sopra, e qui insieme dicono un nome.
    opzioni:
      - testo: "Dire la parola della Spina"
        descrizione: "Le sillabe che la Spina ti ha restituito. La porta forse le aspetta, e dalla spirale Voren le sentirà."
        quando: [circolo.parola == 1]
        esito:
          titolo: La porta si apre
          testo: |
            Dici ad alta voce le quattro sillabe, come le cantava la Spina, e la
            porta si apre senza un suono su una scala ripida che scende verso il
            calore. Mentre scendi senti dietro gli occhi una pressione che
            conosci, poi più niente.

            {resilienza Media} Voren ti ha sentito dalla spirale, e ha sentito il
            nome detto dove non andava detto.
          effetti: { profondita.circolo-fenditura: 2, tormento: 1.5 }
          imposta: { circolo.parola: 2 }
      - testo: "Prendere la galleria intorno al muro"
        descrizione: "Una galleria stretta, scavata a mano da chi sapeva dove andava."
        prova: { attributo: mentale, abilita: [percezione, natura], difficolta: Media }
        successo:
          titolo: La galleria
          testo: |
            Segui la galleria al buio con una mano sulla parete, guidato a ogni
            bivio dalle tre tacche del Circolo incise nella roccia, ed esci oltre
            il muro dove le radici riemergono dal pavimento.
          effetti: { profondita.circolo-fenditura: 1 }
        fallimento:
          titolo: Il bivio
          testo: |
            Al terzo bivio il segno manca, e la galleria che scegli a caso finisce
            contro la roccia.
          effetti: { tormento: 1 }
      - testo: "Strisciare sotto la porta con le radici"
        descrizione: "Dove passano le radici passa un corpo magro. Il metallo sopra è caldo."
        costo: 2
        esito:
          titolo: Sotto la porta
          testo: |
            Strisci sotto la porta insieme alle radici e ti rialzi dall'altra
            parte con la camicia bruciata in tre punti.
          effetti: { profondita.circolo-fenditura: 1, ferite: 0.5 }

  - id: circolo-fenditura-il-bracciale-di-selara
    immagine: fazioni/circolo-di-velthar
    titolo: Il bracciale nella radice
    sommario: "Dentro una radice c'è un bracciale di corteccia pietrificata con un nome inciso."
    luogo: La fenditura del Respiro, oltre la porta
    area: circolo-fenditura
    ripetibile: true
    requisiti: [profondita.circolo-fenditura == 3]
    testo: |
      Una radice più grossa delle altre attraversa la galleria all'altezza del petto, e dentro, come una pietra in un frutto, c'è
      un bracciale di corteccia diventata pietra lucida. Dalla parte rimasta scoperta qualcuno ha inciso a punta di coltello un
      nome, *Selara*.

      {accademiche Media} Selara Vyn scese nel Rito e ne tornò con un bracciale di corteccia pietrificata che non riusciva a
      togliersi. Questo è uguale, o è lo stesso.
    opzioni:
      - testo: "Leggere quello che c'è inciso sotto il nome"
        descrizione: "Sotto il nome ci sono segni più piccoli e consumati."
        prova: { attributo: mentale, abilita: [accademiche, percezione], difficolta: Media }
        successo:
          titolo: Sotto il nome
          testo: |
            Alla luce della lanterna i segni sotto il nome sono le tre tacche del Circolo e una data fuori dal calendario della Caduta, che
            ricopi sul palmo con il carbone.
          effetti: { profondita.circolo-fenditura: 1, informazioni.segreto: 1 }
        fallimento:
          titolo: I segni consumati
          testo: |
            Sfregando i segni consumati con il pollice ne cancelli uno, e torni
            indietro sentendoti un ladro.
          effetti: { tormento: 1 }
      - testo: "Lasciare un'offerta alla radice"
        descrizione: "Al Circolo, davanti a un Silente, si lascia qualcosa. Questa radice somiglia a un Silente."
        prova: { attributo: sociale, abilita: [empatia, galateo], difficolta: Media }
        successo:
          titolo: L'offerta
          testo: |
            Lasci un pezzo di pane accanto al bracciale e ti inchini come i novizi, e la galleria davanti a te sembra più larga di
            prima.
          effetti: { profondita.circolo-fenditura: 1 }
        fallimento:
          titolo: Il pane che cade
          testo: |
            Il pane ti scivola dalle dita e rotola nel buio, e torni indietro a
            mani vuote.
          effetti: { tormento: 1 }
      - testo: "Passare sotto la radice senza toccarla"
        descrizione: "La radice taglia la galleria a metà. Sotto si passa piegati."
        costo: 2
        esito:
          titolo: Piegato in due
          testo: |
            Passi sotto la radice piegato in due, e per il resto della galleria ti senti accompagnato alla porta come da un padrone di casa.
          effetti: { profondita.circolo-fenditura: 1, tormento: 1 }

  - id: circolo-fenditura-i-silenti-nelle-radici
    immagine: fazioni/circolo-di-velthar
    titolo: I Silenti nelle radici
    sommario: "Nelle radici della galleria ci sono forme sedute che respirano tutte insieme."
    luogo: La fenditura del Respiro, il sonno dei Silenti
    area: circolo-fenditura
    ripetibile: true
    requisiti: [profondita.circolo-fenditura >= 3]
    testo: |
      Le pareti della galleria sono radici intrecciate, e dentro ci sono forme che sembrano persone sedute a gambe incrociate,
      avvolte dal legno fino al collo; una ha ancora un lembo di tunica grigio-verde. Respirano tutte insieme, una volta ogni
      dieci battiti, e il soffio passa lungo la galleria come vento.

      {resilienza Media} Ti preme qualcosa dietro gli occhi da tutte le parti, tante voci che dicono la stessa cosa senza che tu
      capisca che cosa.
    opzioni:
      - testo: "Ascoltarli senza voce"
        descrizione: "I Silenti ti hanno insegnato a parlare senza voce, e qui parlano in tanti."
        quando: [circolo.sussurro >= 1]
        esito:
          titolo: Tutte le voci
          testo: |
            Lasci entrare la pressione, e le voci si fanno parole. Ripetono a turno, come in una preghiera, il nome della città su cui il Bosco è cresciuto, e in fondo al coro ce n'è una più
            lontana che non dice niente e ascolta.
          effetti: { profondita.circolo-fenditura: 1, tormento: 1 }
      - testo: "Passare senza lasciarli entrare"
        descrizione: "La pressione cresce a ogni passo, e la porta va tenuta chiusa fino in fondo."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Media }
        successo:
          titolo: La porta chiusa
          testo: |
            Cammini a denti stretti, con le loro voci fuori dalla testa, finché la
            galleria si allarga e la pressione si fa leggera.
          effetti: { profondita.circolo-fenditura: 1 }
        fallimento:
          titolo: La porta aperta
          testo: |
            A metà galleria la pressione entra, e torni in te seduto contro la
            parete, con le radici salite sulle caviglie e il loro nome in bocca.
          effetti: { tormento: 1.5 }
      - testo: "Correre fino in fondo"
        descrizione: "Una galleria si fa anche di corsa, con il soffio dei Silenti alle spalle."
        costo: 2
        esito:
          titolo: Di corsa
          testo: |
            Corri senza guardare le forme, con il soffio delle radici alle spalle,
            finché non lo senti più.
          effetti: { profondita.circolo-fenditura: 1, tormento: 1 }

  # ------------------------------------------------------------ 4 · l'anticamera
  - id: circolo-fenditura-il-ferro-che-si-sposta
    immagine: ambientazione/rovine-dei-precursori
    titolo: Il ferro che si sposta
    sommario: "In una sala calda e vuota il pavimento trema."
    luogo: La fenditura del Respiro, l'anticamera
    area: circolo-fenditura
    ripetibile: true
    requisiti: [profondita.circolo-fenditura == 4]
    testo: |
      La galleria finisce in una sala rotonda e vuota, con le pareti di
      metallo grigio calde al tatto. Il pavimento trema a lunghi intervalli,
      e da molto più sotto arriva un rumore di ferro, come una catena da
      nave tirata su un anello alla volta. Di fronte un'apertura bassa manda
      una luce azzurra e un calore secco.

      {resistenza Media} Il tremito ti sale nelle ossa delle gambe e si
      ferma nei denti, che ti battono da soli.
    opzioni:
      - testo: "Restare fermo finché il tremito passa"
        descrizione: "Il ferro sotto si sposta e si ferma, e bisogna aspettare senza avere paura."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Media }
        successo:
          titolo: L'anello successivo
          testo: |
            Resti fermo a contare gli anelli della catena che non vedi, e al
            dodicesimo il tremito si ferma e attraversi la sala.
          effetti: { profondita.circolo-fenditura: 1 }
        fallimento:
          titolo: La catena
          testo: |
            Al quinto anello ti ritrovi seduto per terra con le mani sulle
            orecchie, e torni nella galleria con le ginocchia molli.
          effetti: { tormento: 1.5 }
      - testo: "Attraversare la sala di corsa fra due tremiti"
        descrizione: "Fra un tremito e l'altro bastano venti passi di corsa."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Media }
        successo:
          titolo: Venti passi
          testo: |
            Aspetti la fine di un tremito e corri, e arrivi all'apertura prima che
            il pavimento ricominci.
          effetti: { profondita.circolo-fenditura: 1 }
        fallimento:
          titolo: Il pavimento
          testo: |
            Il tremito ricomincia a metà sala e ti butta a terra, e torni indietro
            gattonando.
          effetti: { ferite: 0.5 }
      - testo: "Camminare lungo la parete"
        descrizione: "Lungo la parete il tremito si sente meno, ma la parete scotta."
        costo: 2
        esito:
          titolo: La parete calda
          testo: |
            Cammini lungo la parete con una mano appoggiata, e all'apertura arrivi
            con il palmo scottato e il tremito nelle ginocchia.
          effetti: { profondita.circolo-fenditura: 1, ferite: 0.5 }

  - id: circolo-fenditura-le-pozze-di-linfa-azzurra
    immagine: ambientazione/cristalli-conduttori
    titolo: Le pozze di linfa azzurra
    sommario: "Fra pozze di linfa azzurra che fuma corre un passaggio stretto."
    luogo: La fenditura del Respiro, l'anticamera
    area: circolo-fenditura
    ripetibile: true
    requisiti: [profondita.circolo-fenditura == 4]
    testo: |
      Un corridoio basso corre fra due file di pozze scavate nel pavimento di metallo, piene di una linfa azzurra densa che fuma piano e ronza nei denti. Sul bordo di una pozza qualcuno ha lasciato una ciotola di legno con il fondo azzurro.

      {magia Media} È Mana quasi puro, sciolto in qualcosa che somiglia alla linfa, e scorre verso l'alto da più in fondo.
    opzioni:
      - testo: "Raccogliere la linfa azzurra"
        descrizione: "Con la ciotola il Mana sciolto si raccoglie, ma una goccia sulla pelle brucia."
        prova: { attributo: mentale, abilita: [magia, natura], difficolta: Media }
        successo:
          titolo: La ciotola
          testo: |
            Riempi due fiale con la ciotola senza toccare la superficie, e la
            linfa ronza e ti colora le mani di azzurro.
          effetti: { profondita.circolo-fenditura: 1, circolo.linfa: 2, contaminazione: 1 }
        fallimento:
          titolo: La goccia
          testo: |
            Una goccia ti cade sul dorso della mano e brucia come un tizzone.
          effetti: { ferite: 0.5, contaminazione: 1 }
      - testo: "Passare fra le pozze senza respirarne il fumo"
        descrizione: "Il corridoio è stretto, e il fumo sale da tutte e due le parti."
        prova: { attributo: fisico, abilita: [resistenza, acrobazia], difficolta: Media }
        successo:
          titolo: Il corridoio
          testo: |
            Passi a labbra serrate sul ciglio delle pozze, e arrivi in fondo con
            gli occhi che lacrimano e i polmoni puliti.
          effetti: { profondita.circolo-fenditura: 1 }
        fallimento:
          titolo: Il fumo
          testo: |
            Respiri a metà corridoio, e il fumo azzurro ti entra in gola come
            un ago. Torni indietro tossendo.
          effetti: { contaminazione: 1.5 }
      - testo: "Avanzare lentamente con un panno sulla bocca"
        descrizione: "Con un panno sulla bocca il fumo passa, ma poco."
        costo: 2
        esito:
          titolo: Il panno azzurro
          testo: |
            Avanzi piano con il panno sulla bocca, e quando arrivi in fondo il
            panno è diventato azzurro.
          effetti: { profondita.circolo-fenditura: 1, contaminazione: 1 }

  # ------------------------------------------------------------ il cuore · il Custode di linfa (passo 13)
  - id: circolo-fenditura-il-custode
    immagine: bestiario/salvaguardia-precursori
    titolo: Il Custode di linfa
    sommario: "Davanti alla cavità dell'Albero c'è una macchina cresciuta dentro un tronco."
    luogo: La fenditura del Respiro, davanti alla cavità
    area: circolo-fenditura
    requisiti: [profondita.circolo-fenditura >= 5, fazione.circolo == 12]
    testo: |
      L'apertura dà su una caverna calda e alta, e in fondo c'è un'altra apertura da cui viene tutta la luce azzurra del mondo. A sbarrare
      la strada c'è un tronco largo quanto tre uomini, con la corteccia spaccata dall'alto in basso, e dalla spaccatura escono quattro
      braccia di legno intrecciato al metallo, con le dita lunghe come rastrelli. Al centro, dove avrebbe il cuore, c'è una camera di
      vetro piena di linfa azzurra che pulsa.

      Quando fai un passo nella caverna le braccia si aprono tutte insieme, e il tronco si stacca dalla roccia con un suono di radici
      strappate.

      {tecnologia Media} È una macchina della Salvaguardia, e il tronco le è cresciuto addosso finché non si capisce più dove finisca
      l'uno e cominci l'altra.

      {natura Difficile} Le radici del tronco scendono ancora nella roccia, e da lì bevono. Se le leghi, il tronco resta dov'è.

      *Il seme di Serha scalda il palmo attraverso la tasca.* Le dita ti si chiudono sull'arma da sole.
    opzioni:
      - testo: "Affrontare il Custode di linfa"
        descrizione: "Quattro braccia e una corteccia che para i colpi. Il cuore è la camera di linfa."
        combattimento: circolo-il-custode-di-linfa
        vittoria:
          titolo: La camera rotta
          testo: |
            La camera di vetro si spacca con un suono di campana, la linfa azzurra
            cola fumando sulla roccia e le quattro braccia ricadono una dopo
            l'altra. Dalla corteccia stacchi una scheggia di metallo che si piega
            sotto il pollice, fra le radici trovi un guscio chiuso, e passi oltre,
            verso la luce.
          pe: { natura: 5 }
          effetti: { fazione.circolo: 1, rep.circolo: 0.5, circolo.corteccia: 1, reperto.sigillato: 1 }
          imposta: { circolo.custode: 1 }
          segue: circolo-occhi-dorati
        sconfitta:
          titolo: Le braccia
          testo: |
            Le quattro braccia ti scagliano contro la parete. Da terra vedi Voren
            uscire dall'ombra delle radici, dove ti aveva seguito senza farsi
            sentire, e infilare il bastone nella camera di vetro, che si spacca
            con un suono di campana.

            Ti tirano su dalla spirale con la corda già svenuto, e Serha ti cuce
            la spalla. Il Custode è caduto, e al Circolo tutti sanno chi l'ha
            buttato giù.
          effetti: { fazione.circolo: 1, rep.circolo: -0.5, ferite: 1.5, tormento: 1.5 }
          imposta: { circolo.custode: 2 }
          vai: superficie-fratturata
      - testo: "Legarlo al suo tronco con Radici e la corda"
        descrizione: "Se leghi le radici con il Respiro e la corda, il tronco non si stacca dalla roccia. Costa molto Mana."
        requisiti: [incantesimo.radici >= 1]
        costo: 2
        prova: { attributo: mentale, abilita: magia, difficolta: Difficile }
        successo:
          titolo: Legato
          testo: |
            Dici le parole di Radici e passi la corda intorno alle radici del
            tronco, giro dopo giro, mentre le braccia ti cercano nel vuoto. Le
            radici vive della corda si attaccano a quelle del Custode e le
            tengono, e il tronco si piega e resta lì con le braccia aperte. Passi
            accanto alla camera di linfa senza toccarla, staccando una scheggia di
            corteccia di metallo.
          pe: { magia: 10 }
          effetti: { fazione.circolo: 1, rep.circolo: 1, circolo.corteccia: 1 }
          imposta: { circolo.custode: 1 }
          segue: circolo-occhi-dorati
        fallimento:
          titolo: Il tronco si stacca
          testo: |
            La corda scivola sulle radici di metallo, il tronco si stacca dalla
            roccia e ti prende al fianco prima che tu riesca a scappare. Risali la
            fenditura a fatica, e Serha ti cuce alla luce del vapore.
          effetti: { ferite: 2.5, tormento: 1 }
          vai: superficie-fratturata
      - testo: "Confonderlo con il congegno di Aurenne"
        descrizione: "Il congegno di controllo parla alle macchine della Salvaguardia, anche a una dentro un tronco."
        requisiti: [oggetto.congegno-di-controllo >= 1]
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Difficile }
        successo:
          titolo: La lingua delle macchine
          testo: |
            Premi il pollice nella conca del congegno e lo tieni lì mentre il
            disco si scalda fino a bruciare. Le quattro braccia si fermano a
            mezz'aria e si ripiegano piano contro il tronco, come le zampe di un
            insetto che dorme, e tu passi accanto alla camera di linfa staccando
            una scheggia di corteccia di metallo.
          pe: { tecnologia: 10 }
          effetti: { fazione.circolo: 1, rep.circolo: 0.5, circolo.corteccia: 1, tormento: 1.5 }
          imposta: { circolo.custode: 1 }
          segue: circolo-occhi-dorati
        fallimento:
          titolo: Il congegno che urla
          testo: |
            Il congegno manda un ronzio acuto, e il Custode si gira verso di te e
            ti prende al fianco. Risali la fenditura a fatica, con un cerchio
            bruciato sul palmo.
          effetti: { ferite: 2.5, tormento: 1.5 }
          vai: superficie-fratturata
      - testo: "Tornare indietro"
        descrizione: "Il Custode non lascia la caverna. La fenditura, però, ricomincia da capo."
        costo: 0
        esito:
          titolo: Indietro
          testo: |
            Esci dalla caverna camminando all'indietro, e le braccia si richiudono
            contro il tronco. Risali con il seme di Serha che ti scalda la tasca.
          vai: superficie-fratturata

  # ------------------------------------------------------------ il cuore · la cavità dell'Albero (dopo la quest)
  - id: circolo-fenditura-la-cavita
    immagine: ambientazione/cristalli-conduttori
    titolo: La cavità dell'Albero
    sommario: "Il tronco del Custode ha messo nuove braccia, e davanti all'Albero la linfa azzurra cola ancora."
    luogo: La fenditura del Respiro, la cavità dell'Albero
    area: circolo-fenditura
    requisiti: [profondita.circolo-fenditura >= 5, fazione.circolo >= 14]
    testo: |
      La caverna davanti alla cavità è calda come l'ultima volta. Dalla spaccatura del tronco del Custode sono spuntate due braccia nuove
      di legno verde e metallo, che si muovono piano come antenne, e sulla roccia dove la linfa azzurra era colata è cresciuto un muschio
      che luccica.

      {natura Media} Il Custode ricresce come un ramo tagliato, e non ci metterà molto a tornare quello di prima.
    opzioni:
      - testo: "Potare le braccia nuove del Custode"
        descrizione: "Due braccia giovani, più svelte che forti, cariche di linfa."
        combattimento: circolo-il-guardiano-di-radici
        vittoria:
          titolo: La potatura
          testo: |
            Tagli le due braccia giovani alla base e raccogli nelle fiale la linfa
            che portano, poi stacchi una scheggia di corteccia di metallo prima
            che la spaccatura si richiuda.
          effetti: { circolo.linfa: 2, circolo.corteccia: 1, contaminazione: 1 }
          vai: superficie-fratturata
        sconfitta:
          titolo: Le braccia giovani
          testo: |
            Le braccia giovani sono più svelte di quanto sembrasse, e ti cacciano
            dalla caverna a frustate.
          vai: superficie-fratturata
      - testo: "Raccogliere il muschio che luccica"
        descrizione: "Muschio cresciuto sulla linfa colata, che Serha vorrà vedere e i guaritori pagano."
        prova: { attributo: mentale, abilita: [natura, medicina], difficolta: Media }
        successo:
          titolo: Il muschio
          testo: |
            Stacchi il muschio a strisce sottili con la lama e lo avvolgi in un panno umido. In città lo chiameranno linfa, perché
            non hanno un nome migliore.
          pe: { natura: 5 }
          effetti: { circolo.linfa: 2 }
          vai: superficie-fratturata
        fallimento:
          titolo: Il muschio che si spegne
          testo: |
            Il muschio si spegne appena lo stacchi, e in mano ti resta una
            poltiglia grigia che puzza di ferro.
          effetti: { contaminazione: 1 }
          vai: superficie-fratturata
      - testo: "Restare in ascolto davanti all'Albero"
        descrizione: "Il respiro dell'Albero arriva a ondate, e ascoltarlo insegna."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Media }
        successo:
          titolo: Le ondate dell'Albero
          testo: |
            Ti siedi sulla soglia della cavità ad ascoltare le ondate lunghe
            dell'Albero, e ti accorgi di averlo fatto per ore. Per qualche giorno
            le formule del Respiro ti vengono più facili.
          pe: { magia: 10 }
          effetti: { tormento: 1 }
          vai: superficie-fratturata
        fallimento:
          titolo: Gli occhi
          testo: |
            Per un momento, nella roccia sotto l'Albero, ti sembra di vedere
            aprirsi due fessure dorate. Quando guardi meglio non c'è niente, e
            risali di corsa senza voltarti.
          effetti: { tormento: 1.5 }
          vai: superficie-fratturata
      - testo: "Tornare indietro"
        descrizione: "L'Albero resta dov'è. La fenditura, anche."
        costo: 0
        esito:
          titolo: Indietro
          testo: |
            Guardi ancora un poco la luce dell'apertura prima di risalire, e il calore dell'Albero ti accompagna fino alla
            corda.
          vai: superficie-fratturata

  # ------------------------------------------------------------ 13 → 14 · occhi dorati
  - id: circolo-occhi-dorati
    immagine: ambientazione/cristalli-conduttori
    titolo: Occhi dorati
    sommario: "In fondo alla cavità c'è l'Albero di Metallo Vivo, acceso. Sotto di lui la roccia ha due occhi."
    luogo: La fenditura del Respiro, la cavità dell'Albero
    area: circolo-fenditura
    tipo: seguito
    requisiti: [fazione.circolo == 13]
    testo: |
      La cavità è rotonda e calda, e nel mezzo c'è l'Albero, alto quanto un campanile, con il tronco liscio e grigio e i rami che si allargano contro la volta. La corteccia si muove sotto la luce come la pelle di un cavallo quando ci si posa una mosca. Dai rami sale un vapore azzurro e denso, e dalle
      radici una nebbia grigia scende nelle crepe e da lì sale verso il Bosco.

      Da vicino si capisce che l'Albero produce Mana e insieme spinge fuori la Marea, e che il Bosco di sopra è cresciuto per bere quella Marea. Quando l'Albero era spento il Bosco respirava, e adesso che è acceso lo soffoca.

      {magia Difficile} Il Mana che esce dai rami è più puro di qualunque cristallo tu abbia mai toccato. Chi lo avesse in mano potrebbe accendere una città, o spegnerla.

      Poi la roccia sotto l'Albero si muove. Si aprono due occhi dorati senza pupille, grandi come porte, incastonati in qualcosa che sta sotto la roccia e si muove con un rumore di ferro. Ti guardano a lungo e si richiudono piano, mentre il rumore di ferro si allontana.

      Quattro strade, ti ha detto il Circolo Ristretto, una per ogni voce. Adesso tocca a te.
    opzioni:
      - testo: "Chiuderlo con le radici e il seme di Serha"
        descrizione: "La strada di Tharn e del Maestro. Il seme e le radici soffocano l'Albero, e il Mana resta sotto."
        prova: { attributo: mentale, abilita: natura, difficolta: Difficile }
        successo:
          titolo: L'Albero chiuso
          testo: |
            Pianti il seme di Serha fra le radici dell'Albero, e nella terra calda
            cresce in un'ora come in un anno. Le sue radici stringono quelle di
            metallo, il vapore si fa sottile e la nebbia grigia smette di scendere
            nelle crepe. Quando risali la cavità è buia e fredda, e sotto la
            roccia il rumore di ferro si è fermato.
          pe: { natura: 15 }
          effetti: { fazione.circolo: 1, rep.circolo: 1 }
          imposta: { circolo.albero: 1 }
          vai: superficie-fratturata
        fallimento:
          titolo: Il seme che brucia
          testo: |
            Il seme brucia nella terra calda prima di mettere radici, e l'Albero
            ti scaccia con uno sbuffo di vapore che ti ustiona le braccia. Puoi
            riprovare, o scegliere un'altra strada.
          effetti: { ferite: 2 }
          segue: circolo-occhi-dorati
      - testo: "Dargli un ritmo, accordato al respiro del Bosco"
        descrizione: "La strada di Serha. L'Albero si accorda al respiro del Bosco, e il Circolo avrà una sorgente da custodire."
        prova: { attributo: mentale, abilita: magia, difficolta: Difficile }
        successo:
          titolo: Il ritmo
          testo: |
            Appoggi le mani sulla corteccia di metallo e la senti battere troppo in
            fretta. La rallenti con il Mana, un battito alla volta, finché respira a
            ondate lunghe come il Bosco di sopra e la nebbia grigia scende nelle
            crepe solo quanto il Bosco ne può bere. Quando risali la luce pulsa
            lenta dietro di te, e settimane dopo Serha scambierà le misure con
            Orvald Temmerin.
          pe: { magia: 15 }
          effetti: { fazione.circolo: 1, rep.circolo: 1, rep.accademia: 1 }
          imposta: { circolo.albero: 2 }
          vai: superficie-fratturata
        fallimento:
          titolo: Il battito che scappa
          testo: |
            Il battito ti scappa sotto le dita e accelera, e ti stacchi con i
            palmi ustionati dalla corteccia. Puoi riprovare, o scegliere un'altra
            strada.
          effetti: { ferite: 2 }
          segue: circolo-occhi-dorati
      - testo: "Dargli un ritmo, con la vena che conosce il tuo sangue"
        descrizione: "La vena ti ha già riconosciuto una volta. Il Mana è lo stesso, e il ritmo lo trovi prima."
        quando: [circolo.vena >= 1]
        prova: { attributo: mentale, abilita: magia, difficolta: Media }
        successo:
          titolo: Il ritmo
          testo: |
            Appoggi le mani sulla corteccia, e il calore rimasto nel polso dalla
            vena di Serha corre incontro al Mana dell'Albero. Lo rallenti insieme
            a lui, un battito alla volta, finché respira come il Bosco di sopra.
            Quando risali il vapore sale regolare dietro di te, e settimane dopo
            Serha scambierà le misure con Orvald Temmerin.
          pe: { magia: 15 }
          effetti: { fazione.circolo: 1, rep.circolo: 1, rep.accademia: 1 }
          imposta: { circolo.albero: 2 }
          vai: superficie-fratturata
        fallimento:
          titolo: Il battito che scappa
          testo: |
            La vena nel polso risponde troppo, e il Mana ti risale nel braccio
            come acqua bollente. Puoi riprovare, o scegliere un'altra strada.
          effetti: { ferite: 2 }
          segue: circolo-occhi-dorati
      - testo: "Dargli un ritmo con il congegno di Aurenne"
        descrizione: "Il congegno parla alle macchine dei Precursori, e anche l'Albero è una macchina."
        requisiti: [oggetto.congegno-di-controllo >= 1]
        prova: { attributo: mentale, abilita: magia, difficolta: Media }
        successo:
          titolo: Il passo
          testo: |
            Premi il congegno contro la corteccia, e il disco si scalda e comincia
            a battere lento. Dopo un poco l'Albero batte con lui, a ondate lunghe
            come il Bosco di sopra. Settimane dopo Serha scambierà le misure con
            Orvald Temmerin.
          pe: { magia: 15 }
          effetti: { fazione.circolo: 1, rep.circolo: 1, rep.accademia: 1 }
          imposta: { circolo.albero: 2 }
          vai: superficie-fratturata
        fallimento:
          titolo: Il disco che brucia
          testo: |
            Il congegno si scalda fino a bruciare, e l'Albero lo respinge con uno
            sbuffo di vapore. Puoi riprovare, o scegliere un'altra strada.
          effetti: { ferite: 2 }
          segue: circolo-occhi-dorati
      - testo: "Lasciarlo ai Silenti, e tenere aperta la via a Voren"
        descrizione: "La strada di Voren. Lui si fonde con l'Albero, e tu gli tieni aperta la via con la testa."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Difficile }
        successo:
          titolo: La voce di Voren
          testo: |
            Voren arriva alle tue spalle senza che tu l'abbia sentito scendere. Si toglie il cappuccio, e ha una faccia qualunque, stanca.
            «Grazie» dice, con la voce roca di tredici anni di silenzio. Poi entra fra le radici dell'Albero, e mentre lo avvolgono tieni
            aperta la via nella tua testa, finché la pressione che conoscevi si allarga e diventa l'Albero. Quando risali, la cavità è in
            ascolto.
          pe: { resilienza: 15 }
          effetti: { fazione.circolo: 1, rep.circolo: 1, rep.velo: -1, tormento: 1.5 }
          imposta: { circolo.albero: 3 }
          vai: superficie-fratturata
        fallimento:
          titolo: La via che si chiude
          testo: |
            Voren entra fra le radici, e a metà la via nella tua testa si chiude
            come una porta sbattuta. Lui torna indietro e ti guarda senza
            rimprovero, mentre ti sanguina il naso. Puoi riprovare, o scegliere
            un'altra strada.
          effetti: { ferite: 2, tormento: 1.5 }
          segue: circolo-occhi-dorati
      - testo: "Tagliare un ramo vivo per il Velo"
        descrizione: "Il campione promesso a Padre Vantes. Il Velo ne farà una reliquia, e il Circolo non perdonerà."
        quando: [circolo.promessa-velo == 1]
        prova: { attributo: fisico, abilita: [armi-da-mischia, atletica], difficolta: Difficile }
        successo:
          titolo: Il ramo per il Velo
          testo: |
            Sali fino al primo ramo e lo tagli alla base, poi ne tagli un secondo
            per te e lo nascondi sotto il mantello. Il primo lo porti in
            Cattedrale avvolto nel lino, e Padre Vantes lo prende in ginocchio e
            ti paga come si paga una reliquia. Una settimana dopo i carri della
            Confraternita passano dal margine, e i druidi li guardano passare.
          pe: { armi-da-mischia: 15 }
          effetti: { fazione.circolo: 1, rep.velo: 2, rep.circolo: -3, monete: 200 }
          imposta: { circolo.albero: 4 }
          vai: superficie-fratturata
        fallimento:
          titolo: La corteccia che si stringe
          testo: |
            La corteccia si stringe sulla lama e non la lascia, e quando la
            strappi via l'Albero ti scaccia con uno sbuffo di vapore. Puoi
            riprovare, o scegliere un'altra strada.
          effetti: { ferite: 2 }
          segue: circolo-occhi-dorati
      - testo: "Segnare il posto per i Raschiatori"
        descrizione: "La squadra di Dragna è accampata al margine e scenderà al tuo segno. Il Circolo non lo perdonerà."
        quando: [circolo.dragna == 1]
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Difficile }
        successo:
          titolo: Il segno di gesso
          testo: |
            Segni con il gesso la strada dalla corda all'Albero, un segno a ogni
            svolta come fanno i Raschiatori, e prima di risalire tagli un ramo per
            te e lo nascondi sotto il mantello. Il giorno dopo Dragna ti paga al
            Grifone davanti a tutta la sala, mentre la sua squadra scende con
            picconi e casse e al margine i druidi la guardano passare.
          pe: { tecnologia: 15 }
          effetti: { fazione.circolo: 1, rep.raschiatori: 2, rep.circolo: -3, monete: 200 }
          imposta: { circolo.albero: 4, circolo.dragna: 2 }
          vai: superficie-fratturata
        fallimento:
          titolo: Il gesso che si scioglie
          testo: |
            Il gesso si scioglie sulla roccia calda e i segni colano prima di
            asciugare, e l'Albero ti scaccia con uno sbuffo di vapore. Puoi
            riprovare, o scegliere un'altra strada.
          effetti: { ferite: 2 }
          segue: circolo-occhi-dorati
      - testo: "Restare accanto all'Albero finché il Maestro non scende"
        descrizione: "Se nessuna strada è la tua, aspetti Aelion, che non scende mai. Ci vorranno giorni al caldo."
        costo: 3
        esito:
          titolo: Il Maestro scende
          testo: |
            Aspetti accanto all'Albero per tre giorni, con il caldo che ti secca
            la pelle e gli occhi dorati che sogni da sveglio. Il terzo giorno
            Aelion scende con la corda, lui che non era mai sceso, e insieme
            piantate il seme di Serha fra le radici. Lui lo fa crescere cantando a
            voce bassa finché l'Albero si chiude, e per tutta la salita non ti
            dice niente.
          effetti: { fazione.circolo: 1, ferite: 1, tormento: 1.5 }
          imposta: { circolo.albero: 1 }
          vai: superficie-fratturata
