# Gli oggetti della quest del Circolo di Velthar (contenuti/fazioni/circolo/). Punti = grado + difetti
# (docs/regolamento-oggetti.md). Chi li dà:
# - passo 3, grado 1: il segno delle tre tacche (chiave «bosco»: apre i sentieri del margine).
# - passo 6, grado 2: l'arco di tasso del margine.
# - passo 9, grado 3: il dono della via. Irriducibili la lupa Fumo (con braska == 2 arriva Braska), Radicanti
#   l'innesto di legnoscuro, Silenti il cappuccio di nebbia (più il sussurro e, se lo accetti, Mente silenziosa).
# - passo 10: la corda per la fenditura (chiave «fenditura»), da Serha, da Dragna o da Oda Krell.
# - passo 12, grado 4: il mantello di muschio grigio.
# - passo 15, grado 5: il ramo di metallo vivo (grado 4, sempre) e, nelle strade 1-3, la ghianda di metallo vivo.
oggetti:
  - id: circolo-segno-delle-tre-tacche
    nome: Segno delle tre tacche
    immagine: icone/tree-branch
    descrizione: "Un dischetto di corteccia grande come una moneta, con tre tacche incise a coltello e un foro per il cordino. Al margine del Bosco di Velthar vale come un nome."
    slot: accessorio
    grado: 1
    proprieta: { talento: { natura: 1 }, chiave: [bosco] }

  - id: circolo-arco-di-tasso
    nome: Arco di tasso del margine
    immagine: icone/bow-string
    descrizione: "Un arco lungo di tasso del Bosco, tagliato da un ramo caduto da solo e teso con budello. Tharn dice che il legno ha già deciso da che parte tirare."
    slot: arma
    base: arco-lungo
    grado: 2
    dadi: 1
    proprieta: { rapida: 1 }

  - id: circolo-lupa-brina
    nome: Fumo, la lupa grigia
    immagine: icone/wolf-head
    descrizione: "Una giovane lupa del branco di Tharn, grigia come la cenere fredda, con una macchia bianca sulla gola. Ti cammina mezzo passo avanti e sente le bestie prima di te."
    slot: accessorio
    grado: 2
    proprieta: { rapida: 1, talento: { addestrare-animali: 1 }, chiave: [branco] }

  - id: circolo-braska
    nome: Braska, il puma peldifuoco
    immagine: bestiario/braska
    descrizione: "Il puma nero della Foresta Strisciante, con il pelo che ai fianchi si accende di rosso. Va dove vai tu, sempre un poco prima di te, e ti aspetta voltandosi appena."
    slot: accessorio
    grado: 3
    proprieta: { rapida: 1, talento: { natura: 1, addestrare-animali: 1 }, chiave: [branco, braska] }

  - id: circolo-innesto-di-legnoscuro
    nome: Innesto di legnoscuro
    immagine: icone/tree-roots
    descrizione: "Una vena di legnoscuro innestata da Serha sotto la pelle dell'avambraccio, che pulsa al ritmo del cuore. Il Mana ci passa come l'acqua in una radice."
    slot: accessorio
    grado: 2
    proprieta: { riserva: 1, talento: { magia: 1, natura: 1 } }
    difetti: [legata]

  - id: circolo-cappuccio-di-nebbia
    nome: Cappuccio di nebbia
    immagine: icone/hood
    descrizione: "Un cappuccio di lana grigio-verde che un Silente ha lasciato sulla pietra accanto a te. Chi ti guarda in faccia ricorda male i tuoi lineamenti, e la notte i pensieri cattivi ci scivolano sopra."
    slot: accessorio
    grado: 2
    proprieta: { lucida: true }

  - id: circolo-corda-della-fenditura
    nome: Corda per la fenditura
    immagine: icone/rope-coil
    descrizione: "Una corda lunga e pesante, avvolta a matassa, fatta per scendere dove le corde normali si tagliano da sole. Senza, nella fenditura del Respiro non si scende."
    slot: nessuno
    proprieta: { chiave: [fenditura] }

  - id: circolo-mantello-di-muschio
    nome: Mantello di muschio grigio
    immagine: icone/cloak
    descrizione: "Cuoio del margine cucito su uno strato di muschio vivo che beve la Marea al posto tuo. Va bagnato una volta alla settimana, come una pianta."
    slot: armatura
    base: cuoio-rinforzato
    grado: 3
    dadi: 1
    proprieta: { schermata: true }

  - id: circolo-ramo-di-metallo-vivo
    nome: Ramo di metallo vivo
    immagine: icone/tree-growth
    descrizione: "Un ramo dell'Albero di Metallo Vivo dritto come un'asta, con la punta che si è fatta lama da sola. Quando ferisce beve, e la corteccia si chiude sui tagli."
    slot: arma
    base: lancia
    grado: 4
    dadi: 2
    proprieta: { assetata: true, chiave: [albero] }

  - id: circolo-ghianda-di-metallo-vivo
    nome: Ghianda di metallo vivo
    immagine: icone/acorn
    descrizione: "Una ghianda tiepida caduta dall'Albero di Metallo Vivo, legata al collo con un cordino di radice. Aelion dice che un giorno germoglierà, e non dice dove."
    slot: accessorio
    grado: 3
    proprieta: { riserva: 1, schermata: true, talento: { magia: 1 } }
    difetti: [legata]
