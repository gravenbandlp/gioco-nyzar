# La quest del Circolo di Velthar, passi 1-5 (fazione.circolo 0 → 5).
# 1 Un lupo alle Scuderie (Città Bassa): tre ingressi secondo chi manda Tharn (il Maestro per chi ha rep.circolo,
#   il puma per chi ha braska, Ilvaena per chi ha cenato con lei), poi la scena nel cortile.
# 2 Il legno che luccica (Segheria): si scopre chi compra il legno grigio, poi si decide che cosa farne. Prima di
#   pista.pelle 7 trattare con la Segheria costa con i Malgrani, dopo no. Galdrick o, se è a Ghoran, il sergente.
# 3 Il margine (Bosco di Velthar, grado 1): Tharn al margine, poi Aelion sulla spirale.
# 4 Il boschetto grigio: l'ingresso nella spedizione del Bosco interno. Il capobranco sta nel cuore
#   (spedizione-bosco.yaml), che porta a 4.
# 5 Le tavole di Serha: Serha chiede la curva della Marea che il Velo misura (circolo.curva), e la curva si chiede in
#   Cattedrale. Chi non sale ai Quartieri Alti può misurare i respiri con Serha, più a lungo.
storylet:
  # ------------------------------------------------------------ 0 → 1 · tre ingressi
  - id: circolo-tharn-ti-cerca-il-maestro
    presso: scuderie-della-zanna-rotta
    immagine: personaggi/dolovan-stroud
    titolo: Uno del Bosco ti cerca
    sommario: "Nel cortile di Dolovan Stroud un uomo con due lupi dice che lo manda il Maestro, e cerca te."
    luogo: Scuderie della Zanna Rotta, la porta della stalla
    area: citta-bassa
    requisiti: [fazione.circolo == 0, rep.circolo >= 1, pista.capomozzo >= 10]
    testo: |
      Dolovan Stroud ti blocca sulla porta della stalla con il forcone di traverso, come
      si ferma una vacca che ha sbagliato recinto, masticando un filo di paglia da un
      angolo all'altro della bocca.

      «Nel mio cortile c'è uno con due lupi» dice. «La Caserma alla porta nord non l'ha
      fatto entrare con le bestie, e io gli ho prestato il cortile perché i cavalli se
      la facevano addosso nella strada. Adesso se la fanno addosso qui, e almeno la
      paglia è mia.» Sputa il filo di paglia davanti ai tuoi stivali. «Dice che lo manda
      il Maestro, e che cerca proprio te.»

      {origine figlio-del-circolo} Il Maestro manda qualcuno in città una volta ogni
      tanti inverni, e mai per una cosa piccola. Ti ritrovi con le mani dietro la
      schiena, come quando da bambino ti chiamavano alla spirale.

      {addestrare-animali Facile} Dalla stalla non arriva un nitrito, e un cavallo che
      sta zitto ha più paura di uno che scalcia.
    opzioni:
      - testo: "Andare nel cortile"
        descrizione: "Dolovan si fa da parte con il forcone, borbottando che i lupi non li paga nessuno."
        costo: 0
        esito:
          titolo: Il cortile
          testo: |
            Dolovan si scansa quanto basta per farti passare e ti segue a due
            passi, con il forcone basso.
          segue: circolo-un-lupo-alle-scuderie

  - id: circolo-tharn-ti-cerca-il-puma
    presso: scuderie-della-zanna-rotta
    immagine: personaggi/dolovan-stroud
    titolo: Uno del Bosco ti cerca
    sommario: "Nel cortile di Dolovan Stroud un uomo con due lupi dice di aver sentito il tuo odore al margine."
    luogo: Scuderie della Zanna Rotta, la porta della stalla
    area: citta-bassa
    requisiti: [fazione.circolo == 0, rep.circolo < 1, braska >= 1, pista.capomozzo >= 10]
    testo: |
      Dolovan Stroud ti blocca sulla porta della stalla con il forcone di traverso. Da quando siete tornati dalla Foresta Strisciante ti guarda a metà
      fra il socio e il cliente che deve ancora pagare.

      «Nel mio cortile c'è uno con due lupi» dice. «La Caserma alla porta nord non l'ha fatto entrare con le bestie, e io gli ho prestato il cortile
      prima che i cavalli spaccassero le stanghe.» Si gratta la nuca sotto il cappello. «Secondo lui il puma della foresta ha portato il tuo odore
      fino al margine del suo Bosco, e lui l'ha seguito all'indietro fin qui.»

      {natura Media} Un puma porta un odore sul pelo del collo, e per strofinarsi su qualcosa che sa di te deve esserci passato vicino più di una
      volta.

      *Braska ti segue ancora.* Le dita ti vanno da sole alla cicatrice più fresca che hai.
    opzioni:
      - testo: "Andare nel cortile"
        descrizione: "Dolovan si fa da parte con il forcone, borbottando che i lupi non li paga nessuno."
        costo: 0
        esito:
          titolo: Il cortile
          testo: |
            Dolovan si scansa quanto basta per farti passare e ti segue a due
            passi, con il forcone basso.
          segue: circolo-un-lupo-alle-scuderie

  - id: circolo-tharn-ti-cerca-ilvaena
    presso: scuderie-della-zanna-rotta
    immagine: personaggi/dolovan-stroud
    titolo: Uno del Bosco ti cerca
    sommario: "Nel cortile di Dolovan Stroud c'è un uomo con due lupi, e il tuo nome gliel'ha dato Ilvaena Sorathe."
    luogo: Scuderie della Zanna Rotta, la porta della stalla
    area: citta-bassa
    requisiti: [fazione.circolo == 0, rep.circolo < 1, braska == 0, pista.tribu >= 2, pista.capomozzo >= 10]
    testo: |
      Dolovan Stroud ti blocca sulla porta della stalla tenendo il forcone di traverso, e ha la faccia di uno che ha
      appena perso una discussione con qualcuno che parlava piano.

      «Nel mio cortile c'è uno con due lupi» dice. «La Caserma alla porta nord non l'ha fatto entrare con le bestie,
      e io gli ho prestato il cortile. Cerca te. Il nome gliel'ha dato quella donna dei margini, la mezzorca con le
      piume nei capelli che hai portato a cena al Grifone.»

      {conoscenze-della-strada Facile} Dolovan non presta il cortile a uno con i lupi per niente. Il nome di Ilvaena
      in Città Bassa vale ancora qualcosa.
    opzioni:
      - testo: "Andare nel cortile"
        descrizione: "Dolovan si fa da parte con il forcone, borbottando che i lupi non li paga nessuno."
        costo: 0
        esito:
          titolo: Il cortile
          testo: |
            Dolovan si scansa quanto basta per farti passare e ti segue a due
            passi, con il forcone basso.
          segue: circolo-un-lupo-alle-scuderie

  # ------------------------------------------------------------ 0 → 1 · il cortile
  - id: circolo-un-lupo-alle-scuderie
    presso: scuderie-della-zanna-rotta
    immagine: fazioni/circolo-di-velthar
    titolo: Un lupo alle Scuderie
    sommario: "Un cacciatore del Circolo di Velthar aspetta nel cortile delle Scuderie, con due lupi sulla paglia e un ramo grigio in mano."
    luogo: Scuderie della Zanna Rotta, il cortile
    area: citta-bassa
    tipo: seguito
    requisiti: [fazione.circolo == 0]
    testo: |
      Nel cortile delle Scuderie due lupi grigi sono sdraiati sulla paglia
      con le orecchie dritte, e nei box i cavalli tengono la groppa voltata
      verso il muro.

      Sul bordo dell'abbeveratoio siede un uomo robusto vestito di pelli,
      con un arco lungo appoggiato al ginocchio. Prima di parlare guarda i
      lupi, poi te. Si chiama Tharn Koru e viene dal Bosco di Velthar. In
      mano ha un ramo di faggio con le foglie grigie come cenere fredda, e
      quando lo spezza la linfa che esce è scura.

      «Il margine sud del Bosco tossisce» dice. «Beve la Marea da sempre, e
      adesso la sputa. Da settimane troviamo tronchi tagliati da gente di
      città. Il Maestro vuole sapere se è la città che ci manda su il
      grigio, o se il grigio sale da solo e la città se lo porta via.»

      {percezione Media} Il taglio del ramo è netto e più vecchio delle
      foglie grigie, perché Tharn l'ha raccolto da terra.

      {origine figlio-del-circolo} Lo conosci di vista, dal margine, dove
      passava con i lupi senza fermarsi. Anche lui ti riconosce e abbassa il
      mento di un dito, il saluto del Circolo per chi non si vede da tempo.
    opzioni:
      - testo: "Avvicinarti prima ai lupi"
        descrizione: "Tharn guarda i lupi prima di parlare, e forse vuole che li guardi anche tu."
        prova: { attributo: sociale, abilita: addestrare-animali, difficolta: Facile }
        successo:
          titolo: Il naso sul polso
          testo: |
            Ti accucci a tre passi dai lupi con le mani aperte sulle ginocchia,
            finché la lupa più vecchia ti annusa il polso e torna a sdraiarsi.
            Allora Tharn ti chiede di trovare chi taglia al margine con la sega,
            perché lui le seghe in città non le sa cercare. Le tacche per il
            Bosco, aggiunge, le dà a chi ha fatto qualcosa.
          pe: { addestrare-animali: 5 }
          effetti: { fazione.circolo: 1, rep.circolo: 0.5 }
        fallimento:
          titolo: I denti
          testo: |
            Ti accucci troppo in fretta, la lupa giovane ti mostra i denti e
            arretri con il tallone nell'abbeveratoio. Tharn aspetta che ti asciughi
            lo stivale, poi ti chiede di trovare chi taglia al margine, con il tono
            che si usa con un estraneo. Le tacche per il Bosco le dà a chi ha fatto
            qualcosa.
          effetti: { fazione.circolo: 1, tormento: 1 }
      - testo: "Chiamare i lupi con Richiamo"
        descrizione: "La lingua che il Circolo insegna ai bambini la capiscono anche loro."
        requisiti: [incantesimo.richiamo >= 1]
        esito:
          titolo: La lingua dei bambini
          testo: |
            Al Richiamo i due lupi vengono a sedersi ai tuoi piedi, e Tharn
            sorride per la prima volta, con mezza bocca. Ti chiede di trovare in
            città chi taglia al margine con la sega, e ti avverte che le tacche
            per il Bosco si danno a chi ha fatto qualcosa.
          pe: { addestrare-animali: 5 }
          effetti: { fazione.circolo: 1, rep.circolo: 0.5 }
      - testo: "Reggere le domande di Tharn"
        descrizione: "Tharn fa poche domande precise, perché vuole sapere chi sei prima di dirti che cosa vuole."
        prova: { attributo: sociale, abilita: [empatia, persuasione], difficolta: Media }
        successo:
          titolo: Poche domande
          testo: |
            Ti chiede da dove vieni e quando hai ucciso l'ultima volta, con il tono con cui si contano le frecce, e gli rispondi senza girarci intorno.
            Alla fine annuisce verso i lupi e ti dice che cerca un uomo con una sega che taglia al margine sud. Le tacche per il Bosco le avrai quando
            avrai fatto qualcosa.
          pe: { empatia: 5 }
          effetti: { fazione.circolo: 1, rep.circolo: 0.5 }
        fallimento:
          titolo: La risposta sbagliata
          testo: |
            Rispondi alla terza domanda con una battuta, che Tharn lascia cadere
            nella paglia. Guardando i lupi per tutto il tempo ti dice comunque che
            cerca un uomo con una sega al margine sud, e che le tacche per il
            Bosco le avrai quando avrai fatto qualcosa.
          effetti: { fazione.circolo: 1, scandalo: 1 }
      - testo: "Esaminare il ramo"
        descrizione: "Un ramo grigio racconta come ci è diventato, a chi sa leggerlo."
        prova: { attributo: mentale, abilita: natura, difficolta: Facile }
        successo:
          titolo: Il taglio di sega
          testo: |
            Il taglio è dritto e fine, e il grigio è entrato nel legno dalle
            radici, molto prima della sega. Quando lo dici a Tharn ti guarda per
            la prima volta senza passare dai lupi, e ti chiede di trovare chi usa
            quella sega. Le tacche per il Bosco le dà a chi ha fatto qualcosa.
          pe: { natura: 5 }
          effetti: { fazione.circolo: 1, rep.circolo: 0.5 }
        fallimento:
          titolo: Un ramo e basta
          testo: |
            Annusi la linfa e ti macchi il pollice di scuro senza vederci niente
            di nuovo. Tharn ti spiega il taglio di sega come a un bambino, poi ti
            chiede lo stesso di trovare chi taglia, perché in città lui con i lupi
            non entra.
          effetti: { fazione.circolo: 1, tormento: 1 }
      - testo: "Lasciare che parli Dolovan"
        descrizione: "Dolovan è stato cacciatore per metà della vita, e un cacciatore lo ascolta davanti a un boccale."
        costo: 2
        esito:
          titolo: Fra cacciatori
          testo: |
            Dolovan si siede con due boccali accanto a Tharn sull'abbeveratoio, e
            parlano di trappole e di inverni per tutto il pomeriggio, e di orchi
            mai. Al tramonto Dolovan gli dice che di te ci si può fidare
            abbastanza, e Tharn ti spiega che cerca un uomo con una sega al
            margine sud. Le tacche per il Bosco le avrai quando avrai fatto
            qualcosa.
          effetti: { fazione.circolo: 1, rep.circolo: 0.5 }
      - testo: "Salutare come si saluta al margine"
        descrizione: "Il mento basso di un dito e la mano aperta sul petto, come al Circolo."
        quando: [origine.figlio-del-circolo >= 1]
        esito:
          titolo: Il saluto del margine
          testo: |
            Abbassi il mento di un dito con la mano aperta sul petto, e Tharn ti risponde allo stesso modo. Ti racconta del margine sud come a uno di casa e ti
            chiede di trovare in città chi taglia con la sega. Le tacche per il Bosco le hai avute da bambino, adesso te le devi riguadagnare come tutti.
          pe: { natura: 5 }
          effetti: { fazione.circolo: 1, rep.circolo: 0.5 }

  # ------------------------------------------------------------ 1 → 2 · la Segheria
  - id: circolo-il-legno-che-luccica
    presso: segheria-e-mulino-malgrani
    immagine: ambientazione/segheria-di-qir-azel
    titolo: Il legno che luccica
    sommario: "Alla Segheria scaricano tronchi con le venature che brillano al buio, il legno di lanterna dei Quartieri Alti."
    luogo: Segheria di Qir-Azel, la rampa dei tronchi
    area: citta-bassa
    requisiti: [fazione.circolo == 1]
    testo: |
      La polvere chiara della Segheria copre i davanzali di mezzo quartiere. Sulla rampa che scende al canale un ragazzo con un cappuccio troppo grande fa rotolare i tronchi con una leva, e all'ombra del porticato alcuni mandano una luce verdina lungo
      le venature.

      Gualtiero Brenna, un uomo largo con la barba bruciacchiata e un bastone a tacche alla cintura, spiega a un cliente in giacca buona che è legno di lanterna. Nei saloni dei Quartieri Alti lo bruciano per la luce e costa il doppio del faggio, dice,
      battendo la mano sul tronco più luminoso con affetto.

      {natura Media} È la stessa luce delle foglie del ramo di Tharn prima del grigio, la Marea che il legno ha bevuto senza digerirla.

      {origine rampollo-dei-quartieri-alti} Il legno di lanterna l'hai visto bruciare nei camini delle feste, con gli ospiti che spegnevano le candele per ammirarlo, senza chiedere da dove venisse.
    opzioni:
      - testo: "Fare un turno sulla rampa e guardare i tronchi"
        descrizione: "Brenna paga a giornata chi sa tenere una leva, e da vicino un tronco racconta di più."
        prova: { attributo: mentale, abilita: [natura, percezione], difficolta: Media }
        successo:
          titolo: Il marchio del margine
          testo: |
            Passi la mattina a far rotolare tronchi, e sul fondo di tre tronchi
            luminosi trovi lo stesso segno a fuoco, un cerchio spezzato, il
            marchio di una sola concessione. Il ragazzo con il cappuccio ti dice
            dove sta, a nord-ovest oltre l'ultima fattoria, al margine sud del
            Bosco di Velthar.
          pe: { natura: 5 }
          segue: circolo-chi-compra-il-grigio
        fallimento:
          titolo: La leva
          testo: |
            La leva ti scappa al secondo tronco e lo insegui giù per la rampa fino
            al muretto del canale. Brenna ti paga mezza giornata e ti fa capire
            con il bastone che domani può fare a meno di te.
          effetti: { ferite: 0.5 }
      - testo: "Cercare la concessione nei registri della Gilda"
        descrizione: "Ogni tronco che entra in città passa da un registro, e ogni registro ha un nome in cima."
        prova: { attributo: mentale, abilita: [politica-ed-economia, accademiche], difficolta: Media }
        successo:
          titolo: Il cerchio spezzato
          testo: |
            All'ufficio della Gilda sul canale, per il prezzo di un'ora di copista, trovi il marchio del cerchio spezzato su una concessione a nord-ovest firmata da Gualtiero
            Brenna. Il compratore è sempre un intermediario del Mercato delle Ombre che firma con un nome solo.
          pe: { politica-ed-economia: 5 }
          segue: circolo-chi-compra-il-grigio
        fallimento:
          titolo: Il copista
          testo: |
            Il copista della Gilda ti fa aspettare un'ora sulla panca e poi ti
            porta il registro del grano. Esci con la sensazione di aver pagato il
            suo tempo per vederlo mangiare pane e formaggio.
          effetti: { scandalo: 1 }
      - testo: "Seguire il carro fino al compratore"
        descrizione: "Un carro di legno di lanterna parte coperto da un telo, e un carro coperto si fa notare."
        prova: { attributo: fisico, abilita: [furtivita, atletica], difficolta: Media }
        successo:
          titolo: Il magazzino sotto il ponte
          testo: |
            Segui il carro per vicoli sempre più stretti fino a un magazzino sotto
            un ponte del Mercato delle Ombre, dove il legno si paga in contanti a
            un uomo con le scarpe dei Quartieri Alti sotto un mantello da
            facchino. Il carrettiere chiama il carico roba del margine sud.
          pe: { furtivita: 5 }
          segue: circolo-chi-compra-il-grigio
        fallimento:
          titolo: Il carrettiere si volta
          testo: |
            Al terzo vicolo il carrettiere ferma il mulo e aspetta che tu passi, e
            quando ti volti il carro è sparito.
          effetti: { sospetto: 1 }
      - testo: "Offrire da bere ai taglialegna"
        descrizione: "A fine turno i taglialegna parlano volentieri, se qualcuno paga il primo giro."
        costo: 2
        esito:
          titolo: Il terzo giro
          testo: |
            Al terzo giro nella bettola sul canale un taglialegna con un orecchio
            solo ti racconta che al margine sud gli alberi brillano più di tutti,
            e Brenna li fa abbattere per primi. Il legno va a un magazzino sotto
            un ponte del Mercato delle Ombre.
          effetti: { monete: -5 }
          segue: circolo-chi-compra-il-grigio
      - testo: "Chiedere ai ragazzi del canale"
        descrizione: "I ragazzi che pescano sotto la Segheria vedono passare tutti i carri, e per uno spicciolo li ricordano."
        quando: [origine.figlio-della-citta-bassa >= 1]
        esito:
          titolo: I ragazzi del canale
          testo: |
            I ragazzi con le lenze sotto il ponte non ti chiedono lo spicciolo,
            perché ti hanno visto crescere due vicoli più in là. Il carro coperto
            va sempre a un magazzino sotto un ponte del Mercato delle Ombre, e il
            carrettiere bestemmia contro i druidi a ogni buca, perché il legno
            viene dal margine sud.
          pe: { conoscenze-della-strada: 5 }
          segue: circolo-chi-compra-il-grigio
      - testo: "Riconoscere il legno dei saloni"
        descrizione: "Nei saloni il legno di lanterna arriva da un solo fornitore, che i servitori fanno entrare dal retro."
        quando: [origine.rampollo-dei-quartieri-alti >= 1]
        esito:
          titolo: Il fornitore dal retro
          testo: |
            Ti ricordi del fornitore con le scarpe troppo buone e lo nomini a
            Brenna come per caso, e lui, che ama il suo legno, ti dice il resto
            per vanità. Il compratore ha un magazzino sotto un ponte del Mercato
            delle Ombre, e il legno buono viene dal margine sud del Bosco.
          pe: { galateo: 5 }
          segue: circolo-chi-compra-il-grigio
      - testo: "Leggere i registri come al banco"
        descrizione: "Le concessioni della Gilda le hai lette per anni, e sai dove si guarda per prima cosa."
        quando: [origine.mercante-dei-ponti >= 1]
        prova: { attributo: mentale, abilita: politica-ed-economia, difficolta: Facile }
        successo:
          titolo: In calce
          testo: |
            Chiedi subito le ultime pagine, dove stanno le firme fresche. Il legno
            di lanterna entra con il marchio del cerchio spezzato, da una
            concessione a nord-ovest firmata da Gualtiero Brenna, e lo compra in
            contanti un intermediario del Mercato delle Ombre.
          pe: { politica-ed-economia: 5 }
          segue: circolo-chi-compra-il-grigio
        fallimento:
          titolo: Il copista
          testo: |
            Il copista di turno ti riconosce dai Ponti e ti fa aspettare apposta,
            e dopo un'ora esci senza aver visto una pagina.
          effetti: { scandalo: 1 }

  # ------------------------------------------------------------ 1 → 2 · che cosa farne
  - id: circolo-chi-compra-il-grigio
    presso: segheria-e-mulino-malgrani
    immagine: personaggi/marko-thessel
    titolo: Chi compra il grigio
    sommario: "Sai dove taglia la Segheria e chi compra il legno di lanterna, e resta da decidere che cosa farne."
    luogo: Segheria di Qir-Azel, il cortile a fine turno
    area: citta-bassa
    tipo: seguito
    requisiti: [fazione.circolo == 1]
    testo: |
      A fine turno, nel cortile vuoto della Segheria, un tronco di lanterna spaccato a metà luccica come
      un pesce sulla sabbia. Nel cuore del legno il grigio sta a cerchi, come gli anelli dell'età, e i
      cerchi sono più vecchi del taglio di anni. I taglialegna non hanno fatto ammalare gli alberi, li
      hanno scelti perché brillavano di più.

      {medicina Media} Una pianta che si ammala dalle radici si ammala da sotto, e chi ha fatto il
      danno, se qualcuno l'ha fatto, sta più in basso della sega.

      Gualtiero Brenna carica gli ultimi pezzi su una carriola. «Il legno è legno» dice senza alzare gli
      occhi. «La concessione è in regola, e i druidi possono lamentarsi alla Gilda come tutti. Io porto
      a casa la paga della squadra.» Si batte il bastone a tacche sulla coscia, una volta per ogni
      parola.
    opzioni:
      - testo: "Denunciare il traffico a Galdrick"
        descrizione: "Legno malato bruciato nei camini dei Quartieri Alti, che lo sceriffo vorrà fermare prima che si ammali qualcuno."
        quando: [galdrick.via == 0]
        esito:
          titolo: La taglia sul legname
          testo: |
            Alla parola Marea Galdrick manda un sergente al magazzino sotto il
            ponte, e il legno brucia fuori dalle mura in un falò che fa luce verde
            tutta la notte. A te va la taglia del legname di contrabbando, e il
            giorno dopo Brenna ti chiude in faccia il cancello della Segheria.
          effetti: { fazione.circolo: 1, rep.circolo: 0.5, rep.caserma: 0.5, monete: 25 }
      - testo: "Denunciare il traffico al sergente di turno"
        descrizione: "Galdrick è a Ghoran, e il sergente di turno odia le grane, anche se la Marea la odia di più."
        quando: [galdrick.via == 1]
        esito:
          titolo: Il falò verde
          testo: |
            Alla parola Marea il sergente di turno chiama due uomini, e il legno
            del magazzino sotto il ponte brucia fuori dalle mura in un falò verde
            che mezza Città Bassa va a vedere. A te va la taglia del legname di
            contrabbando, e il giorno dopo Brenna ti chiude in faccia il cancello
            della Segheria.
          effetti: { fazione.circolo: 1, rep.circolo: 0.5, rep.caserma: 0.5, monete: 25 }
      - testo: "Convincere Brenna a tagliare solo il secco segnato dal Circolo"
        descrizione: "Il Circolo segna gli alberi morti e la Segheria il legno lo vuole comunque, se Brenna rinuncia alla luce."
        quando: [pista.pelle < 7]
        prova: { attributo: sociale, abilita: [persuasione, politica-ed-economia], difficolta: Media }
        successo:
          titolo: Il secco segnato
          testo: |
            Gli spieghi che un albero grigio bruciato in un salone è un processo che aspetta
            il suo giorno, e che un salone dei Quartieri Alti un processo lo perde di rado.
            Brenna accetta di tagliare solo i tronchi morti segnati dal Circolo e ti paga la
            giornata persa. Ai Malgrani, che hanno la concessione, l'accordo non piacerà.
          pe: { persuasione: 5 }
          effetti: { fazione.circolo: 1, rep.circolo: 1, rep.malgrani: -0.5, monete: 20 }
        fallimento:
          titolo: La paga della squadra
          testo: |
            Ai Malgrani, che mettono la paga della squadra, il legno piace luminoso. Brenna però ti lascia il tronco spaccato, e con quello puoi dire a Tharn
            almeno dove nasce il grigio.
          effetti: { fazione.circolo: 1, circolo.legno-di-lanterna: 1, rep.malgrani: -0.5, contaminazione: 0.5 }
      - testo: "Convincere la cooperativa a tagliare solo il secco segnato dal Circolo"
        descrizione: "La Segheria adesso è della cooperativa, e un accordo con il Circolo conviene anche ai taglialegna."
        quando: [pista.pelle >= 7]
        prova: { attributo: sociale, abilita: [persuasione, politica-ed-economia], difficolta: Media }
        successo:
          titolo: Il secco segnato
          testo: |
            Spieghi a Brenna e ai capisquadra che un albero grigio bruciato in un
            salone è un processo che aspetta il suo giorno, stavolta contro di
            loro. Accettano di tagliare solo i tronchi morti segnati dal Circolo,
            e Brenna ti paga la giornata persa di tasca sua.
          pe: { persuasione: 5 }
          effetti: { fazione.circolo: 1, rep.circolo: 1, monete: 20 }
        fallimento:
          titolo: Il voto rimandato
          testo: |
            I capisquadra decidono di votare un'altra sera, come fanno con tutto
            da quando la Segheria è loro. Brenna ti lascia il tronco spaccato, e
            con quello puoi dire a Tharn almeno dove nasce il grigio.
          effetti: { fazione.circolo: 1, circolo.legno-di-lanterna: 1, contaminazione: 0.5 }
      - testo: "Rovinare le lame della Segheria di notte"
        descrizione: "Una lama senza denti si ferma davanti a qualunque tronco, e se ti prendono la Caserma non farà differenze."
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Media }
        successo:
          titolo: I denti della sega
          testo: |
            Entri dal canale dopo la seconda campana e passi la lima sulle lame
            grandi finché non hanno più un dente sano, poi esci con due ciocchi di
            lanterna in spalla per Tharn. La Segheria resta ferma una settimana, e
            in Città Bassa si parla di druidi armati di lima.
          effetti: { fazione.circolo: 1, rep.circolo: 0.5, sospetto: 1, circolo.legno-di-lanterna: 2 }
        fallimento:
          titolo: Il cane del guardiano
          testo: |
            Il cane del guardiano abbaia alla seconda lama, e scappi con la lima
            in mano e un ciocco sotto il braccio. Il giorno dopo in Caserma
            circola la tua descrizione, quasi giusta, ma le lame sono rovinate
            abbastanza e il ciocco basta per Tharn.
          effetti: { fazione.circolo: 1, sospetto: 1.5, circolo.legno-di-lanterna: 1 }
      - testo: "Prendere un ciocco e tornare dal Maestro"
        descrizione: "La città farà quello che vuole del suo legno, e al Circolo basta sapere che il grigio viene da sotto."
        costo: 2
        esito:
          titolo: Un ciocco in spalla
          testo: |
            Brenna ti vende ridendo un ciocco di lanterna al prezzo dei saloni, e
            lo porti in spalla fino alle Scuderie, dove Tharn ha lasciato detto di
            cercarlo al margine. Il resto del legno finisce nei camini dei
            Quartieri Alti.
          effetti: { fazione.circolo: 1, circolo.legno-di-lanterna: 1, monete: -6 }

  # ------------------------------------------------------------ 2 → 3 · il margine (grado 1)
  - id: circolo-il-margine
    presso: circolo-bosco-di-velthar
    immagine: fazioni/circolo-di-velthar
    titolo: Il margine
    sommario: "A un giorno di cammino il Bosco di Velthar comincia come un muro, e Tharn ti aspetta al margine."
    luogo: Il Bosco di Velthar, il margine
    area: superficie-fratturata
    requisiti: [fazione.circolo == 2]
    testo: |
      Per un giorno la strada di Velthar piega a ovest fra valli di detriti, finché la linea scura all'orizzonte diventa un muro di tronchi
      grossi come torri, con la corteccia che a tratti manda un bagliore verdazzurro, come una brace quando ci soffi sopra. Tharn ti aspetta
      con i lupi, seduto su un albero caduto con tre tacche incise nella corteccia.

      Quando hai finito di raccontargli della Segheria si alza e ti ferma con una mano aperta davanti al petto.

      «Il Bosco riconosce chi entra» dice. «Il sentiero non è più quello di un mese fa, e le bestie misurano le lame che porti. Puoi
      lasciarle qui sul tronco e riprenderle all'uscita. Oppure entri con quello che hai e vedi se ti accettano.»

      {armi-da-mischia Media} Lasciare le armi a un uomo con due lupi e un arco ti sembra una pessima idea, e la mano destra non si stacca
      dall'elsa.

      {origine figlio-del-circolo} Su quel tronco ti sedevi ad aspettare quando tornavi tardi, e il ferro di cavallo inchiodato sopra allora
      non c'era.
    opzioni:
      - testo: "Lasciare le armi sul tronco"
        descrizione: "Al margine non si discute, e le armi le riprendi all'uscita, se il Bosco ti lascia uscire."
        esito:
          titolo: A mani vuote
          testo: |
            Appoggi le armi sul tronco con le tre tacche e ti senti nudo come in un
            bagno pubblico. Tharn ti fa strada, e dopo dieci passi un picchio
            smette di battere per guardarti.
          segue: circolo-la-spirale-di-aelion
      - testo: "Entrare armato e farti accettare dagli animali"
        descrizione: "Le bestie del Bosco misurano chi passa, e bisogna lasciarsi misurare senza muovere un dito."
        prova: { attributo: mentale, abilita: [natura, resilienza], difficolta: Media }
        successo:
          titolo: Le bestie che misurano
          testo: |
            Tieni le mani lontane dalle armi e cammini piano, lasciandoti guardare
            da una volpe e poi da un cervo, finché se ne vanno insieme e Tharn ti
            dice che il Bosco ti lascia passare.
          pe: { natura: 5 }
          segue: circolo-la-spirale-di-aelion
        fallimento:
          titolo: Le cornacchie
          testo: |
            Al primo fruscio la mano ti va all'elsa da sola e le cornacchie si
            alzano gridando. Tharn ti riporta al margine, e con il mento ti fa
            capire di riprovare quando avrai le mani più calme.
          effetti: { tormento: 1 }
      - testo: "Seguire la volpe con Richiamo"
        descrizione: "Una volpe aspetta sul sentiero, e con le parole giuste ti fa da guida."
        requisiti: [incantesimo.richiamo >= 1]
        esito:
          titolo: La guida rossa
          testo: |
            Al Richiamo la volpe si mette a trotterellare davanti a te, voltandosi
            ogni dieci passi. Il sentiero che sceglie è più corto di quello di
            Tharn, e lui finge di non accorgersene.
          pe: { addestrare-animali: 5 }
          segue: circolo-la-spirale-di-aelion
      - testo: "Salutare il margine come da bambino"
        descrizione: "Tre colpi con il palmo sul tronco delle tacche, uno per ogni via, come i bambini del margine."
        quando: [origine.figlio-del-circolo >= 1]
        esito:
          titolo: Tre colpi
          testo: |
            Batti tre volte il palmo sul tronco e il legno ti restituisce un suono
            pieno, come una porta di casa. Tharn ride sotto la barba, e gli
            animali ti guardano passare come si guarda uno che torna.
          pe: { natura: 5 }
          segue: circolo-la-spirale-di-aelion

  - id: circolo-la-spirale-di-aelion
    presso: circolo-bosco-di-velthar
    immagine: fazioni/circolo-di-velthar
    titolo: La spirale
    sommario: "Al Circolo del Respiro il Maestro ascolta la storia del legno grigio, e risponde con un'immagine."
    luogo: Il Bosco di Velthar, il Circolo del Respiro
    area: superficie-fratturata
    tipo: seguito
    requisiti: [fazione.circolo == 2]
    testo: |
      Il Circolo del Respiro è una spirale di pietre coperte di muschio
      intorno a una fenditura, da cui sale un fiato caldo che inumidisce la
      pelle. Sulle pietre siedono in silenzio una decina di druidi, e al
      centro, a un passo dalla fenditura, c'è un elfo con gli occhi argentei
      e strisce di corteccia nelle trecce.

      Racconti della Segheria e del grigio a cerchi nei tronchi con il
      vapore che ti bagna la faccia, mentre il Maestro, Aelion Farethil,
      ascolta a occhi chiusi.

      «Ho visto un cervo grattarsi una piaga contro una roccia» dice alla
      fine, con una voce bassa che va a tempo con il vapore. «Si grattò
      finché non uscì il sangue, e il sangue gli diede sollievo, e allora
      continuò. Tu che cosa hai visto?»

      {accademiche Media} Al Circolo le domande si fanno per immagini, e una
      risposta piana suonerebbe come una porta sbattuta.

      {empatia Facile} Il cervo è il Bosco e la piaga il margine sud. Aelion
      teme che la città l'abbia grattata, e ancora di più che la piaga venga
      da dentro.
    opzioni:
      - testo: "Rispondere con un'immagine"
        descrizione: "Il cervo con la sua piaga vuole accanto un'immagine che gli somigli."
        prova: { attributo: sociale, abilita: [espressivita, empatia], difficolta: Media }
        successo:
          titolo: Il tarlo
          testo: |
            Gli dici che hai visto un tavolo mangiato dal tarlo che buttava fuori
            una polvere fine, venduto lo stesso perché la polvere luccicava.
            Aelion apre gli occhi, un druido ride piano, e il Maestro ti fa
            Viandante, come quelli che vennero qui per primi. Gli alberi grigi
            sono a sud, dove il Bosco poggia sulle rovine più profonde.
          pe: { espressivita: 5 }
          effetti: { fazione.circolo: 1, oggetto.circolo-segno-delle-tre-tacche: 1, monete: 30 }
          almeno: { rep.circolo: 2 }
        fallimento:
          titolo: La risposta piana
          testo: |
            Cominci con un'immagine e finisci con una spiegazione. Aelion ti
            accetta lo stesso come Viandante, perché anche i primi che vennero qui
            avevano le scarpe sporche. Gli alberi grigi sono a sud, dove il Bosco
            poggia sulle rovine più profonde.
          effetti: { fazione.circolo: 1, oggetto.circolo-segno-delle-tre-tacche: 1, monete: 30, tormento: 1 }
          almeno: { rep.circolo: 2 }
      - testo: "Rispondere con quello che hai visto nel legno"
        descrizione: "I cerchi grigi nel cuore del tronco sono un'immagine anche loro, e la sai leggere."
        prova: { attributo: mentale, abilita: natura, difficolta: Media }
        successo:
          titolo: Gli anelli
          testo: |
            Gli descrivi il grigio che sale dal centro del tronco come l'acqua in
            un pozzo, e il Maestro annuisce una volta e ti fa Viandante, come
            quelli che vennero qui per primi. Gli alberi grigi sono a sud, dove il
            Bosco poggia sulle rovine più profonde.
          pe: { natura: 5 }
          effetti: { fazione.circolo: 1, oggetto.circolo-segno-delle-tre-tacche: 1, monete: 30 }
          almeno: { rep.circolo: 2 }
        fallimento:
          titolo: Gli anelli contati
          testo: |
            Conti gli anelli ad alta voce finché sulla spirale ti ascolta soltanto
            Aelion. Contare è un modo di guardare anche quello, dice prima di
            accettarti come Viandante. Gli alberi grigi sono a sud, dove il Bosco
            poggia sulle rovine più profonde.
          effetti: { fazione.circolo: 1, oggetto.circolo-segno-delle-tre-tacche: 1, monete: 30, tormento: 1 }
          almeno: { rep.circolo: 2 }
      - testo: "Aspettare in silenzio"
        descrizione: "Sulla spirale nessuno parla finché il vapore non gira, e si può aspettare con loro."
        costo: 2
        esito:
          titolo: Il vapore gira
          testo: |
            Aspetti due ore sulla pietra, sudando sotto i vestiti, finché il vapore gira verso di te e il Maestro ti
            dice che il silenzio è la risposta più vecchia del Circolo. Da oggi sei un Viandante, e gli alberi grigi
            sono a sud, dove il Bosco poggia sulle rovine più profonde.
          effetti: { fazione.circolo: 1, oggetto.circolo-segno-delle-tre-tacche: 1, monete: 30 }
          almeno: { rep.circolo: 2 }
      - testo: "Rispondere con il cinghiale della porta nord"
        descrizione: "Il giorno del Festival hai visto una bestia guidata con il dolore, un'altra piaga grattata da qualcuno."
        quando: [origine.figlio-del-circolo >= 1]
        esito:
          titolo: La bestia della porta nord
          testo: |
            Gli racconti del cinghiale del Festival, con le vene d'acciaio e
            l'orco che lo spronava dove gli faceva male, e lo sguardo di Aelion si
            fa duro. Ti fa Viandante, anche se da qui non sei mai andato via del
            tutto. Gli alberi grigi sono a sud, dove il Bosco poggia sulle rovine
            più profonde.
          pe: { addestrare-animali: 5 }
          effetti: { fazione.circolo: 1, oggetto.circolo-segno-delle-tre-tacche: 1, monete: 30 }
          almeno: { rep.circolo: 2 }

  # ------------------------------------------------------------ 3 → 4 · il boschetto grigio (spedizione)
  - id: circolo-il-boschetto-grigio
    presso: circolo-bosco-di-velthar
    immagine: ambientazione/marea-grigia
    titolo: Il boschetto grigio
    sommario: "A sud del Circolo gli alberi color cenere respirano a scatti, e lupi grigi hanno cacciato quelli di Tharn."
    luogo: Il Bosco di Velthar, il sentiero del sud
    area: superficie-fratturata
    requisiti: [fazione.circolo == 3]
    testo: |
      Sul sentiero del sud Tharn ha con sé il lupo giovane, mentre la lupa
      vecchia, con una spalla fasciata di foglie, zoppica dietro a distanza,
      per orgoglio.

      «Laggiù gli alberi respirano a scatti» dice, guardando a sud. «Dalle
      crepe della corteccia esce una nebbia che sembra latte, e chi ci passa
      tossisce per tre giorni. Da una luna ci vive un branco di lupi grigi
      con le gengive di metallo, che ha cacciato i miei. Il capobranco è
      grande come un vitello, e si muove a scatti come il boschetto.»

      {addestrare-animali Media} Un branco che si muove insieme al suo capo
      segue il capo e basta, e se il capo cade o cambia idea gli altri si
      sparpagliano.

      Ti accompagnerà fino alle rovine sotto le radici e non oltre, perché i
      suoi lupi laggiù non ci vanno più.
    opzioni:
      - testo: "Entrare nel Bosco interno con Tharn"
        descrizione: "Un giorno di sentieri che cambiano fino alle rovine, con Tharn fino a metà strada."
        esito:
          titolo: Il sentiero del sud
          testo: |
            Tharn va davanti con il lupo giovane in coda. Dopo cento passi il
            sentiero si piega in un modo che non ricordi, e Tharn ti dice di non
            voltarti mai, perché dietro il sentiero non è più lo stesso.
          vai: circolo-bosco-interno
      - testo: "Entrare a cavallo"
        descrizione: "In sella il primo tratto si fa in fretta, fino al margine del grigio."
        requisiti: [chiave.cavalcatura >= 1]
        costo: 0
        esito:
          titolo: In sella fino alle rovine
          testo: |
            Il cavallo entra nel Bosco con le orecchie dritte e la mano di Tharn
            sul collo, e per un tratto i sentieri cambiano più piano, come per non
            spaventarlo.
          vai: circolo-bosco-interno

  # ------------------------------------------------------------ 4 → 5 · le tavole di Serha
  - id: circolo-le-tavole-di-serha
    presso: circolo-bosco-di-velthar
    immagine: fazioni/circolo-di-velthar
    titolo: Le tavole di Serha
    sommario: "L'archivista del Circolo incide su tavole di pietra i respiri del Bosco, e sa a che cosa somigliano gli impulsi del grigio."
    luogo: Il Bosco di Velthar, l'archivio sotto la spirale
    area: superficie-fratturata
    requisiti: [fazione.circolo == 4, circolo.curva == 0]
    testo: |
      Nell'archivio, una grotta bassa sotto la spirale con centinaia di tavole di pietra alle pareti, Serha Duvain ne incide una tenendola ferma con il braccio
      sinistro di legnoscuro.

      Le racconti del muro dei Precursori sotto il boschetto, e lei ti mostra una tavola lunga come un uomo, vent'anni di Bosco in una pietra.

      «Il grigio arriva a impulsi, a distanza di anni» dice, battendo il dito su tre punti. «Il Velo misura la Marea nella Cicatrice e tiene la curva in un
      registro. Se gli impulsi coincidono, il Bosco respira con la Cicatrice, ma a chi nega l'Albero il registro non lo prestano.»

      {accademiche Media} Gli impulsi cadono in autunno, vicino agli anniversari della Caduta.

      {origine accolito-del-velo} Il registro della curva, rilegato in pelle verde, l'hai spolverato sul leggio della sala di Ottilia senza mai aprirlo.
    opzioni:
      - testo: "Andare a chiedere la curva in Cattedrale"
        descrizione: "Il registro sta in Cattedrale, e serve qualcuno che il Velo ascolti, o che non noti."
        costo: 0
        esito:
          titolo: La pelle verde
          testo: |
            Serha ti dà una tavoletta di cera con i suoi impulsi ricopiati in
            piccolo, da non far vedere a nessuno con la veste rossa. La curva del
            Velo la tiene Ottilia Sanvel, che non presta niente e scambia
            volentieri.
          imposta: { circolo.curva: 1 }
      - testo: "Misurare i respiri del Bosco con Serha"
        descrizione: "Senza la curva del Velo si può misurare da sé il prossimo respiro, in tre notti accanto alla fenditura."
        costo: 3
        prova: { attributo: mentale, abilita: [natura, magia], difficolta: Difficile }
        successo:
          titolo: Tre notti
          testo: |
            Per tre notti tieni la mano sulla pietra calda accanto alla fenditura,
            e la terza il respiro arriva, nelle ossa del polso prima che nella
            pietra. Serha lo confronta con le sue tavole, e coincide con l'ultima
            tempesta nella Cicatrice.
          pe: { natura: 10 }
          effetti: { fazione.circolo: 1, rep.circolo: 0.5, informazioni.segreto: 1 }
        fallimento:
          titolo: Il sonno
          testo: |
            La terza notte ti addormenti, e al risveglio Serha ha già inciso il respiro, che coincide con l'ultima tempesta nella Cicatrice. A te resta la mano arrossata
            come dopo una scottatura.
          effetti: { fazione.circolo: 1, tormento: 1.5 }

  - id: circolo-la-curva-del-velo
    presso: cattedrale-del-velo
    immagine: personaggi/ottilia-sanvel
    titolo: La curva del Velo
    sommario: "Ottilia Sanvel custodisce il registro della Marea, rilegato in pelle verde, e lo presta soltanto in cambio di qualcosa."
    luogo: Cattedrale del Velo, la sala delle tavolette
    area: quartieri-alti
    requisiti: [fazione.circolo == 4, circolo.curva == 1]
    testo: |
      La sala di Ottilia Sanvel sta in fondo al chiostro, dietro una porta
      senza maniglia. Sul leggio c'è il registro della Marea, rilegato in
      pelle verde e legato con una catenella, e Ottilia, mentre le chiedi
      della curva, raddrizza una pila di tavolette che era già dritta.

      «Il Circolo nega l'Albero» dice. «Il registro lo hanno scritto uomini
      che l'Albero lo pregavano. Però il Velo ha una domanda a cui il
      Circolo saprebbe rispondere. Il cinghiale della Foresta Strisciante,
      quello che Corin Ashdale ha abbattuto. Vorremmo sapere da dove gli
      veniva il metallo nelle vene.»

      {politica-ed-economia Media} La diagnosi del Circolo in mano al Velo
      diventerebbe una predica, e il Circolo non te lo perdonerebbe subito.

      {origine accolito-del-velo} Ottilia ti riconosce, e la sua schiena si
      fa ancora più dritta. Ti ha insegnato lei a spolverare quel leggio.
    opzioni:
      - testo: "Chiederle la curva con le buone maniere"
        descrizione: "Ottilia apprezza le forme, e il Circolo va nominato il meno possibile."
        prova: { attributo: sociale, abilita: [galateo, persuasione], difficolta: Media }
        successo:
          titolo: Mezz'ora al leggio
          testo: |
            Le parli del Bosco come di un vicino che soffre, senza mai nominare l'Albero, finché Ottilia apre la
            catenella con la chiave che porta al collo e ti concede mezz'ora al leggio. Gli impulsi della
            Cicatrice coincidono con quelli di Serha, uno per uno.
          pe: { accademiche: 5 }
          effetti: { fazione.circolo: 1, rep.circolo: 0.5, informazioni.segreto: 1 }
        fallimento:
          titolo: Le forme sbagliate
          testo: |
            Ti scappa la parola Circolo, e Ottilia richiude la penna nel calamaio
            con un colpo secco, ricordandoti che la sala chiude all'ora di nona.
          effetti: { scandalo: 1 }
      - testo: "Chiederla da laico della Confraternita"
        descrizione: "Al Velo hai già dato abbastanza, e per chi lavora in Cattedrale il registro non è un segreto."
        requisiti: [rep.velo >= 3]
        prova: { attributo: sociale, abilita: [galateo, persuasione], difficolta: Facile }
        successo:
          titolo: Mezz'ora al leggio
          testo: |
            Ottilia apre la catenella prima che tu finisca e ti lascia mezz'ora al
            leggio, chiedendoti soltanto di non ricopiare le date con
            l'inchiostro. Gli impulsi della Cicatrice coincidono con quelli di
            Serha, uno per uno.
          pe: { accademiche: 5 }
          effetti: { fazione.circolo: 1, rep.circolo: 0.5, informazioni.segreto: 1 }
        fallimento:
          titolo: L'ora di nona
          testo: |
            Ottilia ti ricorda che la sala chiude all'ora di nona e che il
            registro non si apre di fretta, e ti chiede di tornare con una domanda
            più corta.
          effetti: { scandalo: 1 }
      - testo: "Dare a Ottilia la diagnosi del cinghiale"
        descrizione: "Uno scambio pulito, anche se il Circolo non sarà contento di sapere a chi l'hai data."
        esito:
          titolo: Il metallo nelle vene
          testo: |
            Le ripeti quello che Serha ti ha detto della Marea che impara le forme
            e del metallo che sale nelle vene delle bestie dal basso. Ottilia
            scrive tutto e poi apre il registro, dove gli impulsi coincidono con
            quelli di Serha, uno per uno. Quando torni al Bosco, Serha capisce
            dove sei stato prima che tu apra bocca.
          pe: { accademiche: 5 }
          effetti: { fazione.circolo: 1, rep.velo: 1, rep.circolo: -0.5, informazioni.segreto: 1 }
      - testo: "Ricostruire la curva in Biblioteca"
        descrizione: "Le cronache delle tempeste stanno sparse in cento volumi della Biblioteca, e con pazienza la curva si rifà a mano."
        costo: 2
        prova: { attributo: mentale, abilita: accademiche, difficolta: Difficile }
        successo:
          titolo: Cento volumi
          testo: |
            In due giorni di Biblioteca ricopi le date delle tempeste dalle
            cronache dei Raschiatori e dai bollettini del Velo, e ne esce una
            curva storta come un sentiero che coincide con gli impulsi di Serha
            dove conta.

            {accademiche Difficile} I bollettini li hanno scritti le stesse mani
            del registro in pelle verde, e il Velo la curva l'ha pubblicata a
            pezzi senza accorgersene.
          pe: { accademiche: 10 }
          effetti: { fazione.circolo: 1, rep.circolo: 0.5 }
        fallimento:
          titolo: Le date sbagliate
          testo: |
            Dopo due giorni ti accorgi di aver mescolato il calendario della Gilda
            con quello del Velo, che contano gli anni in modo diverso, e la curva
            che ne esce non somiglia a niente.
          effetti: { tormento: 1 }
      - testo: "Copiarla di notte negli archivi minori"
        descrizione: "Una copia del registro sta negli archivi minori, dove le guardie del Velo passano ogni ora."
        prova: { attributo: fisico, abilita: furtivita, difficolta: Difficile }
        successo:
          titolo: La copia
          testo: |
            Dopo compieta, con una candela coperta dalla mano, trovi la copia del
            registro sotto il bancone dei novizi e ricopi gli impulsi fra un giro
            di guardie e l'altro. Coincidono con quelli di Serha, uno per uno.
          pe: { furtivita: 5 }
          effetti: { fazione.circolo: 1, rep.circolo: 0.5, informazioni.segreto: 1 }
        fallimento:
          titolo: Il giro di guardia
          testo: |
            La guardia del Velo passa in anticipo, e tu esci da una finestra del
            chiostro con la cera della candela che ti cola sul polso. La mattina
            dopo in Cattedrale si parla di un ladro di candele.
          effetti: { sospetto: 1.5 }
      - testo: "Chiederla come una volta"
        descrizione: "Hai spolverato quel leggio per anni, e Ottilia ti deve almeno di sapere che cosa c'era dentro."
        quando: [origine.accolito-del-velo >= 1]
        prova: { attributo: sociale, abilita: [galateo, empatia], difficolta: Facile }
        successo:
          titolo: Il leggio spolverato
          testo: |
            Le ricordi del leggio e degli anni di polvere, senza rancore. Ottilia
            apre la catenella e si volta verso la finestra per non vederti
            leggere, e gli impulsi coincidono con quelli di Serha, uno per uno.
          pe: { empatia: 5 }
          effetti: { fazione.circolo: 1, rep.circolo: 0.5, informazioni.segreto: 1 }
        fallimento:
          titolo: Le forme sbagliate
          testo: |
            Ottilia ti risponde che la polvere si spolvera e basta, e che la sala
            chiude all'ora di nona. Esci sentendoti di nuovo novizio, uno che ha
            sbagliato salmo.
          effetti: { scandalo: 1 }
