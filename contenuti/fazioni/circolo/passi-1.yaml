# La quest del Circolo di Velthar, passi 1-5 (fazione.circolo 0 → 5).
# 1 Un lupo alle Scuderie (Città Bassa): tre ingressi secondo chi manda Tharn (il Maestro per chi ha rep.circolo,
#   il puma per chi ha braska, Ilvaena per chi ha cenato con lei), poi la scena nel cortile.
# 2 Il legno che luccica (Segheria): si scopre chi compra il legno grigio, poi si decide che cosa farne. Prima di
#   pista.pelle 7 trattare con la Segheria costa con i Malgrani, dopo no. Galdrick o, se è a Ghoran, il sergente.
# 3 Il margine (Bosco di Velthar, grado 1): Tharn al margine, poi Aelion sulla spirale.
# 4 Il boschetto grigio: l'ingresso nella spedizione del Bosco interno. Il capobranco sta nel cuore
#   (spedizione-bosco.yaml), che porta a 4.
# 5 Le tavole di Serha: Serha chiede la curva della Marea che il Velo misura (circolo.curva), e la curva si chiede in
#   Cattedrale. Chi non sale ai Quartieri Alti può misurare i respiri con Serha, più a lungo.
storylet:
  # ------------------------------------------------------------ 0 → 1 · tre ingressi
  - id: circolo-tharn-ti-cerca-il-maestro
    presso: scuderie-della-zanna-rotta
    immagine: personaggi/dolovan-stroud
    titolo: Uno del Bosco ti cerca
    sommario: "Dolovan Stroud ti ferma sulla porta della stalla. Nel cortile c'è un uomo con due lupi, e dice che lo manda il Maestro."
    luogo: Scuderie della Zanna Rotta, la porta della stalla
    area: citta-bassa
    requisiti: [fazione.circolo == 0, rep.circolo >= 1, pista.capomozzo >= 10]
    testo: |
      Dolovan Stroud ti blocca sulla porta della stalla con il forcone di
      traverso, come si ferma una vacca che ha sbagliato recinto. Ha le
      maniche rimboccate fino al gomito e un filo di paglia fra i denti che
      mastica da un angolo all'altro della bocca.

      «Nel mio cortile c'è uno con due lupi» dice. «Due. La Caserma alla
      porta nord non l'ha fatto entrare con le bestie, e io gli ho prestato
      il cortile perché i cavalli se la stavano facendo addosso nella strada.
      Adesso se la fanno addosso qui, e almeno la paglia è mia.» Sputa il
      filo di paglia. «Dice che lo manda il Maestro, e che cerca te.»

      {origine figlio-del-circolo} Il Maestro manda qualcuno in città una
      volta ogni tanti inverni, e mai per una cosa piccola. Ti ritrovi con le
      mani dietro la schiena, come quando da bambino ti chiamavano alla spirale prima di
      cena.

      {addestrare-animali Facile} Dalla stalla non arriva un nitrito. I
      cavalli stanno fermi con le orecchie piatte, e un cavallo che sta
      zitto ha più paura di uno che scalcia.
    opzioni:
      - testo: "Andare nel cortile"
        descrizione: "Dolovan si fa da parte con il forcone, e borbotta che i lupi non li paga nessuno."
        costo: 0
        esito:
          titolo: Il cortile
          testo: |
            Dolovan si scansa quanto basta per farti passare e ti segue a
            due passi, con il forcone tenuto basso.
          segue: circolo-un-lupo-alle-scuderie

  - id: circolo-tharn-ti-cerca-il-puma
    presso: scuderie-della-zanna-rotta
    immagine: personaggi/dolovan-stroud
    titolo: Uno del Bosco ti cerca
    sommario: "Dolovan Stroud ti ferma sulla porta della stalla. Nel cortile c'è un uomo con due lupi, e dice di aver sentito il tuo odore al margine."
    luogo: Scuderie della Zanna Rotta, la porta della stalla
    area: citta-bassa
    requisiti: [fazione.circolo == 0, rep.circolo < 1, braska >= 1, pista.capomozzo >= 10]
    testo: |
      Dolovan Stroud ti blocca sulla porta della stalla con il forcone di
      traverso. Da quando siete tornati dalla Foresta Strisciante ti guarda
      in un modo nuovo, a metà fra il socio e il cliente che deve ancora
      pagare, e oggi la metà del cliente si vede di più.

      «Nel mio cortile c'è uno con due lupi» dice. «La Caserma alla porta
      nord non l'ha fatto entrare con le bestie, e io gli ho prestato il
      cortile prima che i cavalli spaccassero le stanghe.» Si gratta la
      nuca sotto il cappello. «Mi ha detto una cosa che non mi piace. Secondo lui il puma della foresta ha portato il tuo odore fino al margine del suo
      Bosco, e che lui l'ha seguito all'indietro fin qui.»

      {natura Media} Un puma che porta un odore lo porta addosso, sul pelo
      del collo, dove si è strofinato. Per strofinarsi su qualcosa che sa di
      te deve esserci passato vicino, e più di una volta.

      *Braska ti segue ancora.* Il pensiero ti scalda e ti gela insieme, e
      le dita vanno alla cicatrice più fresca che hai.
    opzioni:
      - testo: "Andare nel cortile"
        descrizione: "Dolovan si fa da parte con il forcone, e borbotta che i lupi non li paga nessuno."
        costo: 0
        esito:
          titolo: Il cortile
          testo: |
            Dolovan si scansa quanto basta per farti passare e ti segue a
            due passi, con il forcone tenuto basso.
          segue: circolo-un-lupo-alle-scuderie

  - id: circolo-tharn-ti-cerca-ilvaena
    presso: scuderie-della-zanna-rotta
    immagine: personaggi/dolovan-stroud
    titolo: Uno del Bosco ti cerca
    sommario: "Dolovan Stroud ti ferma sulla porta della stalla. Nel cortile c'è un uomo con due lupi, e il tuo nome gliel'ha dato Ilvaena Sorathe."
    luogo: Scuderie della Zanna Rotta, la porta della stalla
    area: citta-bassa
    requisiti: [fazione.circolo == 0, rep.circolo < 1, braska == 0, pista.tribu >= 2, pista.capomozzo >= 10]
    testo: |
      Dolovan Stroud ti blocca sulla porta della stalla con il forcone di
      traverso, come si ferma una vacca che ha sbagliato recinto. Ha la
      paglia fino ai polpacci e la faccia di uno che ha appena perso una discussione con qualcuno che parlava piano.

      «Nel mio cortile c'è uno con due lupi» dice. «La Caserma alla porta
      nord non l'ha fatto entrare con le bestie, e io gli ho prestato il
      cortile perché i cavalli non si rompessero le gambe nella strada.
      Cerca te. Il nome gliel'ha dato quella donna dei margini, la
      mezzorca con le piume nei capelli che hai portato a cena al Grifone.»

      {conoscenze-della-strada Facile} Dolovan non presta il cortile per
      niente, e di sicuro non a uno con i lupi. Se l'ha fatto, il nome di
      Ilvaena qui in Città Bassa vale ancora qualcosa.

      Sulla porta della stalla, dove Dolovan ha inchiodato la zanna d'orco
      spezzata, qualcuno ha appeso un rametto con tre tacche nella
      corteccia.
    opzioni:
      - testo: "Andare nel cortile"
        descrizione: "Dolovan si fa da parte con il forcone, e borbotta che i lupi non li paga nessuno."
        costo: 0
        esito:
          titolo: Il cortile
          testo: |
            Dolovan si scansa quanto basta per farti passare e ti segue a
            due passi, con il forcone tenuto basso.
          segue: circolo-un-lupo-alle-scuderie

  # ------------------------------------------------------------ 0 → 1 · il cortile
  - id: circolo-un-lupo-alle-scuderie
    presso: scuderie-della-zanna-rotta
    immagine: fazioni/circolo-di-velthar
    titolo: Un lupo alle Scuderie
    sommario: "Un cacciatore del Circolo di Velthar aspetta nel cortile delle Scuderie, con due lupi sulla paglia e un ramo grigio in mano."
    luogo: Scuderie della Zanna Rotta, il cortile
    area: citta-bassa
    tipo: seguito
    requisiti: [fazione.circolo == 0]
    testo: |
      Il cortile delle Scuderie è un rettangolo di terra battuta con
      l'abbeveratoio in mezzo e la paglia sparsa contro i muri. Sulla
      paglia sono sdraiati due lupi grigi, con le zampe davanti incrociate
      e le orecchie dritte. Nei box i cavalli tengono la testa bassa e la
      groppa voltata verso il muro, e uno trema dal garrese fino alla coda.

      Seduto sul bordo dell'abbeveratoio c'è un uomo robusto con la barba
      curata e le pelli addosso, un arco lungo appoggiato al ginocchio e
      due coltelli alla cintura. Prima di parlare guarda i lupi, poi
      guarda te. Dice di chiamarsi Tharn Koru e di venire dal Bosco di
      Velthar. In mano ha un ramo di faggio con le foglie grigie come
      cenere fredda, e quando lo spezza la linfa che esce è scura.

      «Il margine sud del Bosco tossisce» dice. «Beve la Marea da sempre, e
      adesso la sputa. Da settimane troviamo tronchi tagliati da gente di
      città. Il Maestro vuole sapere se è la città che ci manda su il
      grigio, o se il grigio sale da solo e la città se lo porta via.»

      {percezione Media} Il ramo è stato tagliato netto, con un colpo
      solo, e il taglio è più vecchio delle foglie grigie. Tharn l'ha
      raccolto da terra.

      {origine figlio-del-circolo} Lo conosci di vista, Tharn, dal margine,
      dove passava con i lupi senza fermarsi. Ti riconosce anche lui, e
      il mento gli si abbassa di un dito, il saluto che al Circolo si fa
      a chi non si vede da tempo.
    opzioni:
      - testo: "Avvicinarti prima ai lupi"
        descrizione: "Tharn guarda i lupi prima di parlare. Forse vuole che li guardi anche tu."
        prova: { attributo: sociale, abilita: addestrare-animali, difficolta: Facile }
        successo:
          titolo: Il naso sul polso
          testo: |
            Ti accucci a tre passi dai lupi e aspetti, con le mani aperte
            sulle ginocchia e gli occhi bassi. Dopo un po' la lupa più
            vecchia si alza, ti annusa il polso e torna a sdraiarsi. Tharn
            la segue con lo sguardo, poi ti dice che al margine taglia
            qualcuno con la sega, e che lui le seghe in città non le sa
            cercare. Ti chiede di trovare chi taglia. Le tacche per entrare
            nel Bosco, aggiunge, le dà a chi ha fatto qualcosa.
          pe: { addestrare-animali: 5 }
          effetti: { fazione.circolo: 1, rep.circolo: 0.5 }
        fallimento:
          titolo: I denti
          testo: |
            Ti accucci troppo in fretta, e la lupa più giovane ti mostra i
            denti senza alzarsi. Fai un passo indietro e finisci con il
            tallone nell'abbeveratoio. Tharn aspetta che tu ti asciughi lo
            stivale prima di parlare. Ti chiede di trovare chi taglia al
            margine, con il tono che si usa per chiedere un favore a un estraneo, e
            ti avverte che le tacche per il Bosco le dà a chi ha fatto
            qualcosa.

            {resistenza Facile} Lo stivale si asciuga in un'ora. L'orgoglio
            ci mette di più, e per tutta la sera ti si bagna di nuovo.
          effetti: { fazione.circolo: 1, tormento: 1 }
      - testo: "Chiamare i lupi con Richiamo"
        descrizione: "La lingua che il Circolo insegna ai bambini la capiscono anche loro."
        requisiti: [incantesimo.richiamo >= 1]
        esito:
          titolo: La lingua dei bambini
          testo: |
            Dici le parole del Richiamo a voce bassa, muovendo appena le labbra. I
            due lupi alzano la testa insieme e vengono a sedersi ai tuoi
            piedi, uno per lato. Tharn sorride per la prima volta, con mezza
            bocca. Ti dice che al margine taglia qualcuno con la sega e ti
            chiede di trovarlo in città, dove lui con i lupi non entra. Le
            tacche per il Bosco, dice, si danno a chi ha fatto qualcosa.
          pe: { addestrare-animali: 5 }
          effetti: { fazione.circolo: 1, rep.circolo: 0.5 }
      - testo: "Reggere le domande di Tharn"
        descrizione: "Tharn fa poche domande, e sono precise. Vuole sapere chi sei prima di dirti che cosa vuole."
        prova: { attributo: sociale, abilita: [empatia, persuasione], difficolta: Media }
        successo:
          titolo: Poche domande
          testo: |
            Ti chiede da dove vieni e che cosa mangi. Poi ti chiede quando hai ucciso l'ultima volta, con lo stesso tono con cui si contano le frecce. Gli
            rispondi senza girarci intorno. Alla fine annuisce verso i lupi,
            non verso di te, e ti spiega quello che cerca, un uomo con una
            sega che taglia al margine sud. In città lui si perde, e tu forse lo trovi. Le tacche per il Bosco le avrai quando avrai fatto
            qualcosa.

            {empatia Media} Ha paura per il Bosco e non lo dice. Le domande
            precise servono a tenere ferme le mani.
          pe: { empatia: 5 }
          effetti: { fazione.circolo: 1, rep.circolo: 0.5 }
        fallimento:
          titolo: La risposta sbagliata
          testo: |
            Alla terza domanda rispondi con una battuta. Tharn la lascia
            cadere nella paglia senza raccoglierla e passa alla quarta.
            Quando ha finito ti dice comunque che cosa cerca, un uomo con una
            sega che taglia al margine sud, e te lo dice guardando i lupi
            per tutto il tempo. Le tacche per il Bosco, aggiunge, le avrai
            quando avrai fatto qualcosa.
          effetti: { fazione.circolo: 1, scandalo: 1 }
      - testo: "Esaminare il ramo"
        descrizione: "Un ramo che diventa grigio racconta come ci è diventato, a chi sa leggerlo."
        prova: { attributo: mentale, abilita: natura, difficolta: Facile }
        successo:
          titolo: Il taglio di sega
          testo: |
            Giri il ramo fra le dita. Il taglio è dritto e fine, con i segni
            dei denti uno accanto all'altro, e il grigio è entrato nel legno
            dal basso, dalle radici, molto prima della sega. Lo dici a Tharn.
            Lui ti guarda per la prima volta senza passare dai lupi, e ti
            chiede di trovare chi usa quella sega. Le tacche per entrare nel
            Bosco, dice, le dà a chi ha fatto qualcosa.
          pe: { natura: 5 }
          effetti: { fazione.circolo: 1, rep.circolo: 0.5 }
        fallimento:
          titolo: Un ramo e basta
          testo: |
            Giri il ramo fra le dita, ne annusi la linfa e ti macchi il
            pollice di scuro, e non ci vedi niente che non abbia già detto
            Tharn. Lui ti riprende il ramo dalle mani con delicatezza e ti
            spiega il taglio di sega, come a un bambino. Poi ti chiede lo
            stesso di trovare chi taglia, perché in città lui con i lupi non
            ci entra.

            {natura Facile fallita} La macchia sul pollice resta fino a
            sera, e ogni volta che la guardi ti ricorda che ce l'avevi in
            mano.
          effetti: { fazione.circolo: 1, tormento: 1 }
      - testo: "Lasciare che parli Dolovan"
        descrizione: "Dolovan è stato cacciatore per metà della vita, e un cacciatore lo ascolta. Ci vuole tempo, e un boccale."
        costo: 2
        esito:
          titolo: Fra cacciatori
          testo: |
            Dolovan appoggia il forcone al muro, va a prendere due boccali e
            si siede accanto a Tharn sul bordo dell'abbeveratoio. Parlano di
            trappole e di inverni per tutto il pomeriggio, e di orchi mai,
            con grande attenzione da entrambe le parti. Al tramonto Dolovan
            gli dice che di te ci si può fidare abbastanza. Tharn allora ti
            spiega che cosa cerca, un uomo con una sega che taglia al margine
            sud, e ti dice che le tacche per il Bosco le avrai quando avrai
            fatto qualcosa.
          effetti: { fazione.circolo: 1, rep.circolo: 0.5 }
      - testo: "Salutare come si saluta al margine"
        descrizione: "Il mento basso di un dito, la mano aperta sul petto. Al Circolo non serve altro."
        quando: [origine.figlio-del-circolo >= 1]
        esito:
          titolo: Il saluto del margine
          testo: |
            Abbassi il mento di un dito e ti posi la mano aperta sul petto,
            e i lupi si alzano tutti e due a guardarti. Tharn ti risponde
            allo stesso modo. Ti racconta del margine sud senza le domande
            che fa agli altri, come si parla a uno di casa, e ti chiede di
            trovare in città chi taglia con la sega. Ti ricorda che le tacche per il Bosco le hai avute da bambino e che adesso te le devi riguadagnare come tutti.
          pe: { natura: 5 }
          effetti: { fazione.circolo: 1, rep.circolo: 0.5 }

  # ------------------------------------------------------------ 1 → 2 · la Segheria
  - id: circolo-il-legno-che-luccica
    presso: segheria-e-mulino-malgrani
    immagine: ambientazione/segheria-di-qir-azel
    titolo: Il legno che luccica
    sommario: "Alla Segheria scaricano tronchi con le venature che brillano al buio. Ai Quartieri Alti li chiamano legno di lanterna, e li pagano bene."
    luogo: Segheria di Qir-Azel, la rampa dei tronchi
    area: citta-bassa
    requisiti: [fazione.circolo == 1]
    testo: |
      La Segheria lavora dall'alba, e la polvere chiara del legno copre i
      davanzali di mezzo quartiere. Lungo la rampa che scende al canale
      scaricano un carro di tronchi, e un ragazzo con un cappuccio troppo
      grande li fa rotolare uno alla volta con una leva. Nell'ombra sotto
      il porticato alcuni tronchi mandano una luce debole, verdina, che
      corre lungo le venature e si spegne quando ci passa sopra il sole.

      A comandare la squadra della rampa è Gualtiero Brenna, un uomo
      largo con la barba bruciacchiata dalle braci dei bivacchi e un
      bastone a tacche infilato nella cintura. Spiega a un cliente in giacca buona che quello è legno di lanterna. Nei saloni dei Quartieri Alti lo bruciano per la luce, e costa il doppio del faggio. Lo dice battendo la mano sul tronco più luminoso, con
      affetto.

      {natura Media} Quella luce la conosci, perché è la stessa delle
      foglie del ramo di Tharn prima che diventassero grigie. È la Marea
      che il legno ha bevuto e non è riuscito a digerire.

      {origine rampollo-dei-quartieri-alti} Il legno di lanterna l'hai
      visto bruciare nei camini delle feste, con gli ospiti che spegnevano
      le candele per ammirarlo. Nessuno ha mai chiesto da dove venisse, e
      tu tanto meno.

      {politica-ed-economia Facile fallita} Provi a calcolare quanto vale
      un carro di legno che costa il doppio, e il conto ti sfugge al
      terzo tronco, quando il ragazzo con il cappuccio lascia andare la
      leva e grida.
    opzioni:
      - testo: "Fare un turno sulla rampa e guardare i tronchi"
        descrizione: "Brenna paga a giornata chi sa tenere una leva. Da vicino un tronco racconta più che da lontano."
        prova: { attributo: mentale, abilita: [natura, percezione], difficolta: Media }
        successo:
          titolo: Il marchio del margine
          testo: |
            Passi la mattina a far rotolare tronchi, con le braccia che
            bruciano e la polvere fin dentro le orecchie. Sul fondo di tre
            tronchi luminosi trovi la stessa cosa, un segno a fuoco a forma
            di cerchio spezzato che i taglialegna mettono sui legni di una
            sola concessione. Il ragazzo con il cappuccio ti dice dove sta, a
            nord-ovest, mezza giornata oltre l'ultima fattoria. È il margine
            sud del Bosco di Velthar.
          pe: { natura: 5 }
          segue: circolo-chi-compra-il-grigio
        fallimento:
          titolo: La leva
          testo: |
            La leva ti scappa al secondo tronco, e il tronco rotola giù per
            la rampa con te dietro che corri, finché non si ferma contro il
            muretto del canale. Brenna ti paga mezza giornata, perché
            l'altra metà l'hai passata a inseguire il legno, e ti fa capire
            con il bastone a tacche che domani può fare a meno di te.

            {resistenza Media} Il polso destro si gonfia per un giorno. La
            spalla fa male per due, e non ti chiede il permesso.
          effetti: { ferite: 0.5 }
      - testo: "Cercare la concessione nei registri della Gilda"
        descrizione: "Ogni tronco che entra in città passa da un registro, e ogni registro ha un nome in cima."
        prova: { attributo: mentale, abilita: [politica-ed-economia, accademiche], difficolta: Media }
        successo:
          titolo: Il cerchio spezzato
          testo: |
            All'ufficio della Gilda sul canale ti fanno sfogliare il libro
            delle concessioni per il prezzo di un'ora di copista. Il legno di lanterna entra tutto con il marchio del cerchio spezzato, e la concessione è segnata a nord-ovest, oltre
            l'ultima fattoria. La firma in calce è quella di Gualtiero
            Brenna, e il compratore è sempre lo stesso, un intermediario del
            Mercato delle Ombre che firma con un nome solo.
          pe: { politica-ed-economia: 5 }
          segue: circolo-chi-compra-il-grigio
        fallimento:
          titolo: Il copista
          testo: |
            Il copista della Gilda ti fa aspettare un'ora sulla panca e poi
            ti porta il registro sbagliato, quello del grano. Quando glielo
            fai notare se ne porta via anche la panca. Esci con la sensazione
            di aver pagato un'ora del suo tempo per vederlo mangiare un pane
            col formaggio.
          effetti: { scandalo: 1 }
      - testo: "Seguire il carro fino al compratore"
        descrizione: "Un carro di legno di lanterna parte coperto da un telo. Un carro coperto non va mai lontano senza farsi notare."
        prova: { attributo: fisico, abilita: [furtivita, atletica], difficolta: Media }
        successo:
          titolo: Il magazzino sotto il ponte
          testo: |
            Segui il carro per vicoli sempre più stretti, tenendoti dietro i
            muli degli altri, fino a un magazzino con la porta bassa sotto un
            ponte del Mercato delle Ombre. Lì scaricano il legno e lo pagano
            in contanti, e l'uomo che paga ha le scarpe dei Quartieri Alti e
            il mantello di un facchino. Il carrettiere chiama il carico per
            nome, roba del margine sud.
          pe: { furtivita: 5 }
          segue: circolo-chi-compra-il-grigio
        fallimento:
          titolo: Il carrettiere si volta
          testo: |
            Al terzo vicolo il carrettiere si volta e ti guarda, poi ferma
            il mulo e aspetta che tu passi. Passi, con le mani in tasca e lo
            sguardo sulle grondaie, e quando ti volti il carro è sparito. Da
            una finestra una vecchia ti guarda, e ha visto tutto.
          effetti: { sospetto: 1 }
      - testo: "Offrire da bere ai taglialegna"
        descrizione: "A fine turno i taglialegna parlano volentieri, se qualcuno paga il primo giro e ha pazienza per il terzo."
        costo: 2
        esito:
          titolo: Il terzo giro
          testo: |
            Paghi il primo giro alla bettola sul canale e ascolti il
            secondo, e al terzo un taglialegna con un orecchio solo ti
            racconta del margine sud. Gli alberi laggiù brillano più di
            tutti, e Brenna li fa abbattere per primi. Il legno va a un
            magazzino sotto un ponte del Mercato delle Ombre, e da lì nei
            camini dei Quartieri Alti.
          effetti: { monete: -5 }
          segue: circolo-chi-compra-il-grigio
      - testo: "Chiedere ai ragazzi del canale"
        descrizione: "I ragazzi che pescano sotto la Segheria vedono passare tutti i carri, e per uno spicciolo li ricordano anche."
        quando: [origine.figlio-della-citta-bassa >= 1]
        esito:
          titolo: I ragazzi del canale
          testo: |
            Sotto il ponte del canale ci sono i soliti tre ragazzi con le
            lenze, che a te non chiedono nemmeno lo spicciolo perché ti
            hanno visto crescere due vicoli più in là. Il carro coperto lo
            conoscono, va sempre al magazzino sotto un ponte del Mercato
            delle Ombre. Il legno viene dal margine sud del Bosco, e il più
            piccolo lo sa perché il carrettiere bestemmia contro i druidi a
            ogni buca.
          pe: { conoscenze-della-strada: 5 }
          segue: circolo-chi-compra-il-grigio
      - testo: "Riconoscere il legno dei saloni"
        descrizione: "Nei saloni il legno di lanterna arriva sempre da un solo fornitore, quello che i servitori fanno entrare dal retro."
        quando: [origine.rampollo-dei-quartieri-alti >= 1]
        esito:
          titolo: Il fornitore dal retro
          testo: |
            Ti ricordi del fornitore, un uomo con il mantello da facchino e
            le scarpe troppo buone, che i servitori facevano entrare dalla
            cucina. Lo dici a Brenna come per caso, e lui ti dice il resto
            per vanità, perché ama il suo legno. Il compratore ha un
            magazzino sotto un ponte del Mercato delle Ombre, e il legno
            buono viene tutto dal margine sud del Bosco.
          pe: { galateo: 5 }
          segue: circolo-chi-compra-il-grigio
      - testo: "Leggere i registri come al banco"
        descrizione: "Le concessioni della Gilda le hai lette per anni. Sai dove si guarda per prima cosa."
        quando: [origine.mercante-dei-ponti >= 1]
        prova: { attributo: mentale, abilita: politica-ed-economia, difficolta: Facile }
        successo:
          titolo: In calce
          testo: |
            Al banco delle concessioni chiedi direttamente le ultime pagine,
            dove finiscono le firme fresche. Il legno di lanterna entra con
            il marchio del cerchio spezzato, da una concessione a nord-ovest
            firmata da Gualtiero Brenna. Il compratore è un intermediario del
            Mercato delle Ombre, e paga sempre in contanti.
          pe: { politica-ed-economia: 5 }
          segue: circolo-chi-compra-il-grigio
        fallimento:
          titolo: Il copista
          testo: |
            Il copista di turno ti riconosce dai Ponti e ti fa aspettare
            apposta. Esci dopo un'ora senza aver visto una pagina, e con la
            voglia di rifargli i conti a lui.
          effetti: { scandalo: 1 }

  # ------------------------------------------------------------ 1 → 2 · che cosa farne
  - id: circolo-chi-compra-il-grigio
    presso: segheria-e-mulino-malgrani
    immagine: personaggi/marko-thessel
    titolo: Chi compra il grigio
    sommario: "Sai dove taglia la Segheria e chi compra il legno di lanterna. Resta da decidere che cosa farne."
    luogo: Segheria di Qir-Azel, il cortile a fine turno
    area: citta-bassa
    tipo: seguito
    requisiti: [fazione.circolo == 1]
    testo: |
      A fine turno il cortile della Segheria si svuota, e resta il mucchio
      di trucioli con dentro un tronco di lanterna spaccato a metà, che
      nella penombra luccica come un pesce sulla sabbia. Gualtiero Brenna
      ne sta caricando gli ultimi pezzi su una carriola. Ti vede, e la carriola rallenta senza fermarsi.

      Ti avvicini al tronco spaccato e guardi il cuore del legno. Il
      grigio ci sta dentro a cerchi, come gli anelli dell'età, e i cerchi
      grigi sono più vecchi del taglio di anni. I taglialegna gli alberi
      malati non li hanno fatti ammalare, li hanno scelti perché
      brillavano di più.

      {medicina Media} Una pianta che si ammala dalle radici in su si
      ammala da sotto. Chi ha fatto il danno, se qualcuno l'ha fatto, sta
      più in basso della sega.

      «Il legno è legno» dice Brenna senza alzare gli occhi dalla
      carriola. «La concessione è in regola, e i druidi possono
      lamentarsi alla Gilda come tutti. Io porto a casa la paga della
      squadra.» Si batte il bastone a tacche sulla coscia, una volta per
      ogni parola.

      {intimidire Media} Ha paura della Gilda più che della Caserma, e
      dei druidi più che della Gilda. Tiene il bastone in mano per avere
      qualcosa da stringere.
    opzioni:
      - testo: "Denunciare il traffico a Galdrick"
        descrizione: "Legno malato bruciato nei camini dei Quartieri Alti. Lo sceriffo vorrà saperlo prima che si ammali qualcuno."
        quando: [galdrick.via == 0]
        esito:
          titolo: La taglia sul legname
          testo: |
            Galdrick ascolta in piedi, con le braccia incrociate, e alla
            parola Marea manda un sergente al magazzino sotto il ponte prima
            che tu abbia finito. Il legno lo sequestrano e lo bruciano fuori
            dalle mura, in un falò che fa una luce verde per tutta la notte.
            Ti paga la taglia del legname di contrabbando. Alla Segheria,
            il giorno dopo, Brenna ti chiude il cancello in faccia.
          effetti: { fazione.circolo: 1, rep.circolo: 0.5, rep.caserma: 0.5, monete: 25 }
      - testo: "Denunciare il traffico al sergente di turno"
        descrizione: "Galdrick è a Ghoran. Il sergente di turno alla Caserma odia le grane. La Marea la odia di più."
        quando: [galdrick.via == 1]
        esito:
          titolo: Il falò verde
          testo: |
            Il sergente di turno ti ascolta grattandosi il mento, e alla
            parola Marea si alza e chiama due uomini. Il legno del magazzino
            sotto il ponte lo bruciano fuori dalle mura, in un falò che fa
            una luce verde per tutta la notte e che metà della Città Bassa
            va a vedere. Ti pagano la taglia del legname di contrabbando, e
            alla Segheria, il giorno dopo, Brenna ti chiude il cancello in
            faccia.
          effetti: { fazione.circolo: 1, rep.circolo: 0.5, rep.caserma: 0.5, monete: 25 }
      - testo: "Convincere Brenna a tagliare solo il secco segnato dal Circolo"
        descrizione: "Il Circolo segna gli alberi morti, e la Segheria il legno lo vuole comunque. Si può fare un accordo, se Brenna rinuncia alla luce."
        quando: [pista.pelle < 7]
        prova: { attributo: sociale, abilita: [persuasione, politica-ed-economia], difficolta: Media }
        successo:
          titolo: Il secco segnato
          testo: |
            Gli spieghi che un albero grigio bruciato in un salone è un
            processo che aspetta il suo giorno, e che un salone dei Quartieri
            Alti un processo lo perde di rado. Brenna si gratta la barba con il bastone. Alla
            fine accetta di tagliare solo i tronchi morti che il Circolo
            segnerà, e per chiudere ti paga la giornata persa. Ai Malgrani,
            che sulla Segheria hanno la concessione, l'accordo non piacerà.
          pe: { persuasione: 5 }
          effetti: { fazione.circolo: 1, rep.circolo: 1, rep.malgrani: -0.5, monete: 20 }
        fallimento:
          titolo: La paga della squadra
          testo: |
            Brenna ti lascia parlare fino in fondo e poi ti dice che la paga della squadra la mettono i Malgrani, e ai Malgrani il legno piace luminoso. Riprende
            la carriola. Il tronco spaccato però te lo lascia prendere, e
            con quello in spalla puoi tornare da Tharn a dire almeno dove
            nasce il grigio.
          effetti: { fazione.circolo: 1, circolo.legno-di-lanterna: 1, rep.malgrani: -0.5, contaminazione: 0.5 }
      - testo: "Convincere la cooperativa a tagliare solo il secco segnato dal Circolo"
        descrizione: "Adesso la Segheria è della cooperativa, e i taglialegna la loro pelle ci tengono. Un accordo con il Circolo conviene anche a loro."
        quando: [pista.pelle >= 7]
        prova: { attributo: sociale, abilita: [persuasione, politica-ed-economia], difficolta: Media }
        successo:
          titolo: Il secco segnato
          testo: |
            Spieghi a Brenna e ai capisquadra della cooperativa che un albero
            grigio bruciato in un salone è un processo che aspetta il suo
            giorno, e che stavolta il processo sarebbe contro di loro. Si
            consultano sotto il porticato. Alla fine accettano di tagliare
            solo i tronchi morti che il Circolo segnerà, e Brenna ti paga la
            giornata persa di tasca sua, contando le monete sul bastone.
          pe: { persuasione: 5 }
          effetti: { fazione.circolo: 1, rep.circolo: 1, monete: 20 }
        fallimento:
          titolo: Il voto rimandato
          testo: |
            I capisquadra ti ascoltano e poi decidono di votare un'altra
            sera, come fanno con tutto da quando la Segheria è loro. Brenna
            ti lascia prendere il tronco spaccato, e con quello in spalla
            puoi tornare da Tharn a dire almeno dove nasce il grigio.
          effetti: { fazione.circolo: 1, circolo.legno-di-lanterna: 1, contaminazione: 0.5 }
      - testo: "Rovinare le lame della Segheria di notte"
        descrizione: "Una lama senza denti si ferma davanti a qualunque tronco. Se ti prendono, però, la Caserma non farà differenze."
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Media }
        successo:
          titolo: I denti della sega
          testo: |
            Entri dal canale dopo la seconda campana e passi la lima sulle
            lame grandi finché non hanno più un dente sano. Prima di uscire
            ti carichi in spalla due ciocchi di lanterna, per farli vedere a
            Tharn. La Segheria resta ferma una settimana, e in Città Bassa si
            parla di druidi armati di lima.

            {furtivita Facile} Il guardiano dormiva con il cane in braccio.
            Il cane ti ha visto, e ha deciso che non era affar suo.
          effetti: { fazione.circolo: 1, rep.circolo: 0.5, sospetto: 1, circolo.legno-di-lanterna: 2 }
        fallimento:
          titolo: Il cane del guardiano
          testo: |
            Il cane del guardiano ti sente alla seconda lama e abbaia fino a
            svegliare il canale. Scappi con la lima ancora in mano e un ciocco
            sotto il braccio. Il giorno dopo in Caserma circola la tua
            descrizione, quasi giusta. Le lame però sono rovinate abbastanza,
            e il ciocco basta per dire a Tharn dove nasce il grigio.
          effetti: { fazione.circolo: 1, sospetto: 1.5, circolo.legno-di-lanterna: 1 }
      - testo: "Prendere un ciocco e tornare dal Maestro"
        descrizione: "La città farà quello che vuole del suo legno. Al Circolo serve sapere che il grigio viene da sotto."
        costo: 2
        esito:
          titolo: Un ciocco in spalla
          testo: |
            Compri da Brenna un ciocco di lanterna, al prezzo dei saloni, e
            lui te lo vende ridendo. Lo porti in spalla fino alle Scuderie,
            dove Tharn ha lasciato detto di cercarlo al margine. Il resto del
            legno se ne va nei camini dei Quartieri Alti, e per qualche sera
            ti chiedi quanti ospiti lo stanno ammirando.
          effetti: { fazione.circolo: 1, circolo.legno-di-lanterna: 1, monete: -6 }

  # ------------------------------------------------------------ 2 → 3 · il margine (grado 1)
  - id: circolo-il-margine
    presso: circolo-bosco-di-velthar
    immagine: fazioni/circolo-di-velthar
    titolo: Il margine
    sommario: "Un giorno di cammino a nord-ovest, il Bosco di Velthar comincia come un muro. Tharn ti aspetta al margine, e non ti fa passare subito."
    luogo: Il Bosco di Velthar, il margine
    area: superficie-fratturata
    requisiti: [fazione.circolo == 2]
    testo: |
      Per un giorno intero la strada di Velthar piega a ovest fra valli di
      detriti, finché all'orizzonte non compare una linea scura che si fa
      più alta a ogni passo. Da vicino sono tronchi grossi come torri, con
      la corteccia che a tratti manda un bagliore lento e verdazzurro, simile a una brace quando ci soffi sopra. Davanti al primo tronco c'è
      Tharn con i suoi due lupi, seduto su un albero caduto che ha tre
      tacche incise nella corteccia.

      Gli racconti della Segheria e del grigio che sta nel cuore dei
      tronchi. Ascolta fino in fondo senza interromperti. Quando hai finito si alza e ti ferma con una mano aperta davanti al petto.

      «Il Bosco riconosce chi entra» dice. «Il sentiero non è più quello
      di un mese fa, e le bestie misurano le lame che porti. Puoi lasciarle qui sul tronco e riprenderle all'uscita. Oppure entri
      con quello che hai e vedi se ti accettano.»

      {armi-da-mischia Media} Lasciare le armi a un uomo con due lupi e un
      arco ti sembra una pessima idea. La tua mano destra è dello stesso
      parere e non si stacca dall'elsa.

      {origine figlio-del-circolo} Il tronco con le tre tacche è lo stesso
      su cui ti sedevi ad aspettare quando tornavi tardi. Qualcuno ci ha
      inchiodato sopra un ferro di cavallo, e non c'era.

      {natura Facile} Il vento esce dal Bosco invece di entrarci, e porta
      un odore di resina calda con sotto qualcosa di metallico.
    opzioni:
      - testo: "Lasciare le armi sul tronco"
        descrizione: "Al margine non si discute. Le armi le riprendi all'uscita, se il Bosco ti lascia uscire."
        esito:
          titolo: A mani vuote
          testo: |
            Appoggi le armi sul tronco con le tre tacche, una accanto all'altra.
            Ti senti nudo come in un bagno pubblico. Tharn annuisce e ti fa strada,
            e dopo dieci passi un picchio smette di battere per guardarti, poi
            ricomincia.
          segue: circolo-la-spirale-di-aelion
      - testo: "Entrare armato e farti accettare dagli animali"
        descrizione: "Le bestie del Bosco misurano chi passa. Bisogna lasciarsi misurare senza muovere un dito."
        prova: { attributo: mentale, abilita: [natura, resilienza], difficolta: Media }
        successo:
          titolo: Le bestie che misurano
          testo: |
            Tieni le mani lontane dalle armi e cammini piano. Una volpe ti
            attraversa il sentiero, si ferma a guardarti, poi un cervo dal
            folto e due cornacchie su un ramo basso fanno lo stesso. Le lasci
            guardare. Alla fine se ne vanno tutte nello stesso momento, e
            Tharn ti dice che il Bosco ha deciso di lasciarti passare.
          pe: { natura: 5 }
          segue: circolo-la-spirale-di-aelion
        fallimento:
          titolo: Le cornacchie
          testo: |
            Al primo fruscio la mano ti va all'elsa da sola, e dal ramo basso
            le due cornacchie si alzano gridando. Il grido fa il giro del
            Bosco e torna indietro moltiplicato. Tharn ti riporta al margine
            senza una parola, e ti fa capire con il mento che puoi riprovare
            quando avrai le mani più calme.
          effetti: { tormento: 1 }
      - testo: "Seguire la volpe con Richiamo"
        descrizione: "Una volpe aspetta sul sentiero, come se sapesse dove andare. Con le parole giuste ti fa da guida."
        requisiti: [incantesimo.richiamo >= 1]
        esito:
          titolo: La guida rossa
          testo: |
            Dici il Richiamo a mezza voce, e la volpe si gira e si mette a
            trotterellare davanti a te, voltandosi ogni dieci passi per
            controllare che la segui. Tharn la lascia fare. Il sentiero che
            sceglie la volpe è più corto di quello di Tharn, e lui finge di
            non accorgersene.
          pe: { addestrare-animali: 5 }
          segue: circolo-la-spirale-di-aelion
      - testo: "Salutare il margine come da bambino"
        descrizione: "Tre colpi con il palmo sul tronco delle tacche, uno per ogni via. Al margine i bambini lo fanno senza pensarci."
        quando: [origine.figlio-del-circolo >= 1]
        esito:
          titolo: Tre colpi
          testo: |
            Batti tre volte il palmo sul tronco con le tacche, e il legno ti
            restituisce un suono pieno, come una porta di casa. Tharn ride
            sotto la barba e ti lascia andare avanti. Gli animali ti guardano
            passare senza fermarsi, come si guarda uno che torna.
          pe: { natura: 5 }
          segue: circolo-la-spirale-di-aelion

  - id: circolo-la-spirale-di-aelion
    presso: circolo-bosco-di-velthar
    immagine: fazioni/circolo-di-velthar
    titolo: La spirale
    sommario: "Al Circolo del Respiro il Maestro ascolta la storia del legno grigio, e risponde con un'immagine."
    luogo: Il Bosco di Velthar, il Circolo del Respiro
    area: superficie-fratturata
    tipo: seguito
    requisiti: [fazione.circolo == 2]
    testo: |
      Il Circolo del Respiro è una spirale di pietre coperte di muschio
      che gira verso il basso intorno a una fenditura del terreno, e dalla
      fenditura sale un fiato caldo che inumidisce la pelle. Sulle pietre
      sono seduti una decina di druidi, a distanze che sembrano casuali.
      Nessuno parla. Al centro, in piedi a un passo dalla fenditura, c'è un
      elfo con gli occhi argentei e le trecce intrecciate con strisce di
      corteccia.

      Tharn ti spinge avanti con due dita fra le scapole. Racconti della
      Segheria e del grigio a cerchi dentro i tronchi, e il vapore ti
      bagna la faccia. Il Maestro, Aelion Farethil, ascolta con gli occhi
      chiusi.

      «Ho visto un cervo grattarsi una piaga contro una roccia» dice alla
      fine, con una voce bassa che va a tempo con il vapore. «Si grattò
      finché non uscì il sangue, e il sangue gli diede sollievo, e allora
      continuò. Tu che cosa hai visto?»

      {accademiche Media} Al Circolo le domande si fanno per immagini, e
      si risponde allo stesso modo. Una risposta piana suonerebbe come una
      porta sbattuta.

      {empatia Facile} Il cervo è il Bosco, e la piaga è il margine sud.
      Aelion ha paura che la città l'abbia grattata, e paura ancora di
      più che la piaga venga da dentro.
    opzioni:
      - testo: "Rispondere con un'immagine"
        descrizione: "Un cervo, una piaga, il sangue che dà sollievo. Ci vuole un'immagine che gli stia accanto."
        prova: { attributo: sociale, abilita: [espressivita, empatia], difficolta: Media }
        successo:
          titolo: Il tarlo
          testo: |
            Gli dici che hai visto un tavolo mangiato dal tarlo, che dai
            buchi buttava fuori una polvere fine, e che il falegname
            l'aveva venduto lo stesso perché la polvere luccicava. Il Maestro
            apre gli occhi. Sulla spirale un druido ride piano, e Aelion ti
            dice che da oggi sei un Viandante, come si chiamavano quelli che
            vennero qui per primi. Gli alberi grigi sono a sud, dice, dove il
            Bosco poggia sulle rovine più profonde.
          pe: { espressivita: 5 }
          effetti: { fazione.circolo: 1, oggetto.circolo-segno-delle-tre-tacche: 1, monete: 30 }
          almeno: { rep.circolo: 2 }
        fallimento:
          titolo: La risposta piana
          testo: |
            Cominci con un'immagine e finisci con una spiegazione, e te ne
            accorgi a metà. Il vapore gira, e un druido sulla spirale si
            schiarisce la gola. Aelion ti lascia finire. Poi ti dice che le
            risposte piane al Circolo sono come le scarpe in casa, e che ti
            accetta lo stesso come Viandante, perché i primi che vennero qui
            avevano le scarpe sporche anche loro. Gli alberi grigi sono a
            sud, dove il Bosco poggia sulle rovine più profonde.
          effetti: { fazione.circolo: 1, oggetto.circolo-segno-delle-tre-tacche: 1, monete: 30, tormento: 1 }
          almeno: { rep.circolo: 2 }
      - testo: "Rispondere con quello che hai visto nel legno"
        descrizione: "I cerchi grigi nel cuore del tronco sono un'immagine anche loro, e la sai leggere."
        prova: { attributo: mentale, abilita: natura, difficolta: Media }
        successo:
          titolo: Gli anelli
          testo: |
            Gli descrivi gli anelli del tronco spaccato, il grigio che sale
            dal centro come l'acqua sale in un pozzo. Il Maestro apre gli
            occhi e annuisce una volta. Ti dice che da oggi sei un
            Viandante, come si chiamavano quelli che vennero qui per primi,
            e che gli alberi grigi sono a sud, dove il Bosco poggia sulle
            rovine più profonde.
          pe: { natura: 5 }
          effetti: { fazione.circolo: 1, oggetto.circolo-segno-delle-tre-tacche: 1, monete: 30 }
          almeno: { rep.circolo: 2 }
        fallimento:
          titolo: Gli anelli contati
          testo: |
            Cominci a contare gli anelli ad alta voce, e a quaranta ti
            accorgi che sulla spirale non ti ascolta più nessuno. Aelion
            invece sì, fino in fondo. Ti dice che contare è un modo di
            guardare anche quello, e che ti accetta come Viandante. Gli
            alberi grigi sono a sud, dove il Bosco poggia sulle rovine più
            profonde.
          effetti: { fazione.circolo: 1, oggetto.circolo-segno-delle-tre-tacche: 1, monete: 30, tormento: 1 }
          almeno: { rep.circolo: 2 }
      - testo: "Aspettare in silenzio"
        descrizione: "Sulla spirale nessuno parla finché il vapore non gira. Si può aspettare con loro, anche a lungo."
        costo: 2
        esito:
          titolo: Il vapore gira
          testo: |
            Ti siedi sulla pietra più vicina e aspetti. Passano due ore, e il vapore ti fa sudare sotto i vestiti. Quando
            finalmente gira verso di te, il Maestro sorride appena e ti dice
            che il silenzio è la risposta più vecchia del Circolo. Da oggi
            sei un Viandante, come si chiamavano quelli che vennero qui per
            primi. Gli alberi grigi sono a sud, dove il Bosco poggia sulle
            rovine più profonde.
          effetti: { fazione.circolo: 1, oggetto.circolo-segno-delle-tre-tacche: 1, monete: 30 }
          almeno: { rep.circolo: 2 }
      - testo: "Rispondere con il cinghiale della porta nord"
        descrizione: "Il giorno del Festival hai visto una bestia guidata con il dolore. Anche quella era una piaga grattata da qualcuno."
        quando: [origine.figlio-del-circolo >= 1]
        esito:
          titolo: La bestia della porta nord
          testo: |
            Gli racconti del cinghiale del Festival, con le vene d'acciaio e
            l'orco che lo spronava proprio dove gli faceva male. Aelion apre
            gli occhi, e per un momento lo sguardo gli si fa duro. Ti dice
            che da oggi sei un Viandante, come si chiamavano quelli che
            vennero qui per primi, anche se da qui non sei mai andato via
            del tutto. Gli alberi grigi sono a sud, dove il Bosco poggia
            sulle rovine più profonde.
          pe: { addestrare-animali: 5 }
          effetti: { fazione.circolo: 1, oggetto.circolo-segno-delle-tre-tacche: 1, monete: 30 }
          almeno: { rep.circolo: 2 }

  # ------------------------------------------------------------ 3 → 4 · il boschetto grigio (spedizione)
  - id: circolo-il-boschetto-grigio
    presso: circolo-bosco-di-velthar
    immagine: ambientazione/marea-grigia
    titolo: Il boschetto grigio
    sommario: "A sud del Circolo gli alberi hanno la corteccia color cenere e respirano a scatti. Un branco di lupi grigi ha cacciato i lupi di Tharn."
    luogo: Il Bosco di Velthar, il sentiero del sud
    area: superficie-fratturata
    requisiti: [fazione.circolo == 3]
    testo: |
      Tharn ti aspetta sul sentiero del sud con uno solo dei suoi lupi.
      L'altro, la lupa vecchia, ha una spalla fasciata con le foglie e
      zoppica dietro di lui a distanza, per orgoglio. Lui ti racconta
      che cosa è successo senza guardare né te né i lupi, guardando a
      sud.

      «Laggiù gli alberi respirano a scatti» dice. «Dalle crepe della
      corteccia esce una nebbia che sembra latte, e chi ci passa in mezzo
      tossisce per tre giorni. Da una luna ci vive un branco di lupi grigi,
      con le gengive di metallo. Hanno cacciato i miei dal loro territorio.
      Il capobranco è grande come un vitello, e si muove a scatti come il
      boschetto.»

      {addestrare-animali Media} Un branco che si muove tutto insieme al
      suo capo segue il capo e basta. Se il capo cade o cambia idea, gli
      altri si sparpagliano.

      {resistenza Facile fallita} Al solo pensiero di tossire per tre
      giorni ti viene un prurito in fondo alla gola, e il resto del corpo
      si rifiuta di discuterne.

      Ti dice che ti accompagna fino alle rovine sotto le radici, e più
      giù no, perché i suoi lupi laggiù non ci vanno più. Poi aggiusta la
      fasciatura alla lupa vecchia, che lo lascia fare con gli occhi
      chiusi.
    opzioni:
      - testo: "Entrare nel Bosco interno con Tharn"
        descrizione: "Un giorno di sentieri che cambiano fino alle rovine, e oltre le rovine il grigio. Tharn conosce la strada fino a metà."
        esito:
          titolo: Il sentiero del sud
          testo: |
            Tharn si mette davanti e tu dietro, e il lupo giovane chiude la
            fila. Dopo cento passi il sentiero si piega in un modo che non
            ricordi di aver visto entrando, e Tharn ti dice di non voltarti
            mai, perché dietro il sentiero non è più lo stesso.
          vai: circolo-bosco-interno
      - testo: "Entrare a cavallo"
        descrizione: "In sella il primo tratto si fa in fretta. Al margine del grigio il cavallo lo lascerai legato."
        requisiti: [chiave.cavalcatura >= 1]
        costo: 0
        esito:
          titolo: In sella fino alle rovine
          testo: |
            Il cavallo entra nel Bosco con le orecchie dritte e il passo
            corto, e Tharn gli cammina accanto tenendogli una mano sul
            collo. Per un tratto i sentieri cambiano più piano, come se
            facessero attenzione a non spaventarlo.
          vai: circolo-bosco-interno

  # ------------------------------------------------------------ 4 → 5 · le tavole di Serha
  - id: circolo-le-tavole-di-serha
    presso: circolo-bosco-di-velthar
    immagine: fazioni/circolo-di-velthar
    titolo: Le tavole di Serha
    sommario: "L'archivista del Circolo incide su tavole di pietra i respiri del Bosco. Il grigio arriva a impulsi, e lei sa a che cosa somigliano."
    luogo: Il Bosco di Velthar, l'archivio sotto la spirale
    area: superficie-fratturata
    requisiti: [fazione.circolo == 4, circolo.curva == 0]
    testo: |
      L'archivio del Circolo è una grotta bassa scavata sotto la spirale,
      dove il vapore della fenditura arriva tiepido e asciutto. Lungo le
      pareti sono appoggiate centinaia di tavole di pietra, coperte di
      segni incisi in file ordinate. Serha Duvain ne sta incidendo una con
      uno scalpello sottile, tenendo la tavola ferma con il braccio
      sinistro, che è di legnoscuro e pulsa piano, al ritmo del suo cuore.

      Le racconti del muro precuriano sotto il boschetto e della nebbia
      che sale da lì. Lei non smette di incidere. Ti mostra una tavola
      lunga come un uomo, con una fila di segni che salgono e scendono,
      vent'anni di Bosco in una pietra sola.

      «Il grigio non arriva piano» dice, e batte il dito su tre punti della fila. «Arriva a impulsi, a distanza di anni. Il Velo misura la Marea nella Cicatrice da
      quando c'è la Cattedrale, e tiene la curva in un registro. Se gli impulsi coincidono vuol dire che il Bosco respira insieme alla Cicatrice. A
      chi nega l'Albero il registro non lo prestano.»

      {accademiche Media} I segni sono in colonne di dodici come i mesi, e gli impulsi cadono in autunno, vicino agli anniversari della
      Caduta.

      {medicina Facile} Il braccio di legnoscuro ha un innesto al gomito
      cucito come una ferita vera. Chi l'ha fatto conosceva i tendini
      meglio di un cerusico di città.

      {origine accolito-del-velo} Il registro della curva l'hai visto,
      rilegato in pelle verde, sul leggio della sala di Ottilia. Te lo
      facevano spolverare senza aprirlo.
    opzioni:
      - testo: "Andare a chiedere la curva in Cattedrale"
        descrizione: "Il registro sta nei Quartieri Alti, in Cattedrale. Serve qualcuno che il Velo ascolti, o che il Velo non noti."
        costo: 0
        esito:
          titolo: La pelle verde
          testo: |
            Serha ti dà una tavoletta di cera con i suoi impulsi ricopiati
            in piccolo, e ti raccomanda di non farla vedere a nessuno con la
            veste rossa. Ti dice che la curva del Velo la tiene Ottilia Sanvel,
            che non presta niente e scambia volentieri.
          imposta: { circolo.curva: 1 }
      - testo: "Misurare i respiri del Bosco con Serha"
        descrizione: "Senza la curva del Velo, si può aspettare il prossimo respiro e misurarlo da sé. Tre notti nella grotta, accanto alla fenditura."
        costo: 3
        prova: { attributo: mentale, abilita: [natura, magia], difficolta: Difficile }
        successo:
          titolo: Tre notti
          testo: |
            Per tre notti tieni la mano sulla pietra calda accanto alla
            fenditura e conti, mentre Serha incide. La terza notte il
            respiro arriva, e lo senti nelle ossa del polso prima che nella
            pietra. Serha lo confronta con le sue tavole e con i ricordi di
            una vita. Coincide con quello dell'ultima tempesta nella
            Cicatrice, giorno per giorno.
          pe: { natura: 10 }
          effetti: { fazione.circolo: 1, rep.circolo: 0.5, informazioni.segreto: 1 }
        fallimento:
          titolo: Il sonno
          testo: |
            La terza notte ti addormenti con la mano sulla pietra, e il
            respiro arriva mentre sogni. Al risveglio Serha ha già inciso
            tutto. Ti dice che coincide con l'ultima tempesta nella Cicatrice. A te restano un mal di testa che dura fino a sera e la mano arrossata come dopo una scottatura.
          effetti: { fazione.circolo: 1, tormento: 1.5 }

  - id: circolo-la-curva-del-velo
    presso: cattedrale-del-velo
    immagine: personaggi/ottilia-sanvel
    titolo: La curva del Velo
    sommario: "Ottilia Sanvel custodisce il registro della Marea, rilegato in pelle verde. Lo presta soltanto in cambio di qualcosa."
    luogo: Cattedrale del Velo, la sala delle tavolette
    area: quartieri-alti
    requisiti: [fazione.circolo == 4, circolo.curva == 1]
    testo: |
      La sala di Ottilia Sanvel sta in fondo al chiostro, dietro una porta
      senza maniglia che si apre spingendo. Dentro ci sono un leggio e una
      scrivania, e su un ripiano tavolette di cera impilate per data.
      Sul leggio c'è il registro della Marea, rilegato in pelle verde, con
      una catenella che lo lega al leggio. Ottilia scrive seduta con la
      schiena dritta, e alza gli occhi solo quando hai finito di entrare.

      Le chiedi della curva. Lei ascolta senza cambiare faccia e intanto
      raddrizza la pila di tavolette, che era già dritta.

      «Il Circolo nega l'Albero» dice. «Il registro lo hanno scritto
      uomini che l'Albero lo pregavano, e lo hanno pagato con anni di
      notti sulla Cicatrice. Però il Velo ha una domanda che il Circolo
      saprebbe rispondere. Il cinghiale della Foresta Strisciante, quello
      che Corin Ashdale ha abbattuto. Vorremmo sapere da dove gli veniva
      il metallo nelle vene.»

      {politica-ed-economia Media} Uno scambio, dunque. La diagnosi del
      Circolo nelle mani del Velo diventa una predica, e il Circolo non te
      lo perdonerà subito.

      {furtivita Media fallita} Guardi la catenella del registro per
      capire dove si apre, e Ottilia ti guarda guardarla.

      {origine accolito-del-velo} Ottilia ti riconosce, e la sua schiena
      si fa ancora più dritta. Ti ha insegnato lei a spolverare quel
      leggio, e il registro non te l'ha mai fatto aprire.
    opzioni:
      - testo: "Chiederle la curva con le buone maniere"
        descrizione: "Ottilia apprezza le forme. Bisogna chiedere nel modo giusto, e senza nominare il Circolo più del necessario."
        prova: { attributo: sociale, abilita: [galateo, persuasione], difficolta: Media }
        successo:
          titolo: Mezz'ora al leggio
          testo: |
            Le parli del Bosco come di un vicino che soffre, e l'Albero non lo nomini mai. Ottilia alla fine apre
            la catenella con una chiave che porta al collo e ti concede
            mezz'ora al leggio, in piedi, mentre lei ti guarda. Gli impulsi
            della Cicatrice coincidono con quelli di Serha, uno per uno.
          pe: { accademiche: 5 }
          effetti: { fazione.circolo: 1, rep.circolo: 0.5, informazioni.segreto: 1 }
        fallimento:
          titolo: Le forme sbagliate
          testo: |
            Al terzo giro di frase ti scappa la parola Circolo, e Ottilia
            richiude la penna nel calamaio con un piccolo colpo secco. Ti
            dice che la sala chiude all'ora di nona e che sono le otto e
            mezza. Esci con la tavoletta di Serha in tasca e la sensazione di
            aver sbagliato forchetta a un pranzo.
          effetti: { scandalo: 1 }
      - testo: "Chiederla da laico della Confraternita"
        descrizione: "Al Velo hai già dato abbastanza. Ottilia lo sa, e il registro non è un segreto per chi lavora in Cattedrale."
        requisiti: [rep.velo >= 3]
        prova: { attributo: sociale, abilita: [galateo, persuasione], difficolta: Facile }
        successo:
          titolo: Mezz'ora al leggio
          testo: |
            Ottilia annuisce prima che tu finisca, apre la catenella con la
            chiave che porta al collo e ti lascia mezz'ora al leggio. Ti
            chiede soltanto di non ricopiare le date con l'inchiostro. Gli
            impulsi della Cicatrice coincidono con quelli di Serha, uno per
            uno.
          pe: { accademiche: 5 }
          effetti: { fazione.circolo: 1, rep.circolo: 0.5, informazioni.segreto: 1 }
        fallimento:
          titolo: L'ora di nona
          testo: |
            Ottilia ti ascolta, poi ti ricorda che la sala chiude all'ora di
            nona e che il registro non si apre di fretta. Torna un altro
            giorno, dice, con una domanda più corta.
          effetti: { scandalo: 1 }
      - testo: "Dare a Ottilia la diagnosi del cinghiale"
        descrizione: "Uno scambio pulito. Il Velo avrà la sua risposta, e il Circolo non sarà contento di sapere a chi l'hai data."
        esito:
          titolo: Il metallo nelle vene
          testo: |
            Le dici quello che Serha ti ha detto della Marea che impara le
            forme e del metallo che sale nelle vene delle bestie dal basso,
            come il grigio nei tronchi. Ottilia scrive tutto senza fermarti.
            Poi apre la catenella del registro e ti lascia guardare quanto
            vuoi. Gli impulsi della Cicatrice coincidono con quelli di
            Serha, uno per uno. Quando torni al Bosco, Serha capisce dove
            sei stato prima che tu apra bocca.
          pe: { accademiche: 5 }
          effetti: { fazione.circolo: 1, rep.velo: 1, rep.circolo: -0.5, informazioni.segreto: 1 }
      - testo: "Ricostruire la curva in Biblioteca"
        descrizione: "Le cronache delle tempeste stanno in Biblioteca, sparse in cento volumi. Con pazienza la curva si rifà a mano."
        costo: 2
        prova: { attributo: mentale, abilita: accademiche, difficolta: Difficile }
        successo:
          titolo: Cento volumi
          testo: |
            Attraversi la piazza fino alla Biblioteca e passi due giorni fra
            gli scaffali, a ricopiare le date delle tempeste dalle cronache
            dei Raschiatori e dai bollettini d'autunno del Velo. Alla fine
            hai una curva fatta a mano, storta come un sentiero, che
            coincide con gli impulsi di Serha in tutti i punti che contano.

            {accademiche Difficile} I bollettini del Velo li hanno scritti le
            stesse mani del registro in pelle verde. Il Velo la curva l'ha
            pubblicata a pezzi, e poi se n'è dimenticato.
          pe: { accademiche: 10 }
          effetti: { fazione.circolo: 1, rep.circolo: 0.5 }
        fallimento:
          titolo: Le date sbagliate
          testo: |
            Due giorni di cronache, e alla fine ti accorgi di aver mescolato
            il calendario della Gilda con quello del Velo, che contano gli
            anni in modo diverso. La curva che ne esce non somiglia a niente.
            Te ne torni con gli occhi rossi e le dita nere d'inchiostro.
          effetti: { tormento: 1 }
      - testo: "Copiarla di notte negli archivi minori"
        descrizione: "Una copia del registro sta negli archivi minori, dove le guardie del Velo passano ogni ora. Un'ora basta, a chi è svelto."
        prova: { attributo: fisico, abilita: furtivita, difficolta: Difficile }
        successo:
          titolo: La copia
          testo: |
            Entri negli archivi minori dopo compieta, con una candela coperta
            dalla mano, e trovi la copia del registro dove la tenevano i
            novizi, sotto il bancone. Ricopi gli impulsi sulla tavoletta di
            Serha fra un giro di guardie e l'altro, e coincidono, uno per
            uno.
          pe: { furtivita: 5 }
          effetti: { fazione.circolo: 1, rep.circolo: 0.5, informazioni.segreto: 1 }
        fallimento:
          titolo: Il giro di guardia
          testo: |
            La guardia del Velo passa in anticipo, e tu ti ritrovi dietro una
            colonna con la candela spenta fra le dita e la cera che ti cola
            sul polso. Esci da una finestra del chiostro, e la mattina dopo
            in Cattedrale si parla di un ladro di candele.
          effetti: { sospetto: 1.5 }
      - testo: "Chiederla come una volta"
        descrizione: "Hai spolverato quel leggio per anni. Ottilia ti deve almeno di sapere che cosa c'era dentro."
        quando: [origine.accolito-del-velo >= 1]
        prova: { attributo: sociale, abilita: [galateo, empatia], difficolta: Facile }
        successo:
          titolo: Il leggio spolverato
          testo: |
            Le ricordi del leggio e degli anni di polvere, senza rancore.
            Ottilia ti guarda a lungo, poi apre la catenella con la chiave
            che porta al collo e si volta verso la finestra, per non vederti
            leggere. Gli impulsi della Cicatrice coincidono con quelli di
            Serha, uno per uno.
          pe: { empatia: 5 }
          effetti: { fazione.circolo: 1, rep.circolo: 0.5, informazioni.segreto: 1 }
        fallimento:
          titolo: Le forme sbagliate
          testo: |
            Le parli del leggio, e lei ti risponde che la polvere si spolvera
            e basta. La sala chiude all'ora di nona. Esci con la sensazione
            di essere tornato novizio, e di aver sbagliato salmo.
          effetti: { scandalo: 1 }
