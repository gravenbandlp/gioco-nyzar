# La quest del Circolo di Velthar, passi 1-5 (fazione.circolo 0 → 5).
# 1 Un lupo alle Scuderie (Città Bassa): tre ingressi secondo chi manda Tharn (il Maestro per chi ha rep.circolo,
#   il puma per chi ha braska, Ilvaena per chi ha cenato con lei), poi la scena nel cortile.
# 2 Il legno che luccica (Segheria): si scopre chi compra il legno grigio, poi si decide che cosa farne. Prima di
#   pista.pelle 7 trattare con la Segheria costa con i Malgrani, dopo no. Galdrick o, se è a Ghoran, il sergente.
# 3 Il margine (Bosco di Velthar, grado 1): Tharn al margine, poi Aelion sulla spirale.
# 4 Il boschetto grigio: l'ingresso nella spedizione del Bosco interno. Il capobranco sta nel cuore
#   (spedizione-bosco.yaml), che porta a 4.
# 5 Le tavole di Serha: Serha chiede la curva della Marea che il Velo misura (circolo.curva), e la curva si chiede in
#   Cattedrale. Chi non sale ai Quartieri Alti può misurare i respiri con Serha, più a lungo.
storylet:
  # ------------------------------------------------------------ 0 → 1 · tre ingressi
  - id: circolo-tharn-ti-cerca-il-maestro
    presso: scuderie-della-zanna-rotta
    immagine: personaggi/dolovan-stroud
    titolo: Uno del Bosco ti cerca
    sommario: "Dolovan Stroud ti ferma sulla porta della stalla. Nel cortile c'è un uomo con due lupi, e dice che lo manda il Maestro."
    luogo: Scuderie della Zanna Rotta, la porta della stalla
    area: citta-bassa
    requisiti: [fazione.circolo == 0, rep.circolo >= 1, pista.capomozzo >= 10]
    testo: |
      Dolovan Stroud ti blocca sulla porta della stalla con il forcone di traverso, come si ferma una vacca
      che ha sbagliato recinto. Il manico del forcone è lucido nei due punti dove lo tengono le sue mani.

      «Nel mio cortile c'è uno con due lupi» dice. «La Caserma alla porta nord non l'ha fatto entrare con le
      bestie, e io gli ho prestato il cortile perché i cavalli se la facevano addosso nella strada. Adesso se
      la fanno addosso qui.» Sputa un filo di paglia. «Dice che lo manda il Maestro, e che cerca te.»

      {origine figlio-del-circolo} Il Maestro manda qualcuno in città una volta ogni tanti inverni, e mai per
      poco. Ti ritrovi con le mani dietro la schiena come da bambin{o|a}, quando ti chiamavano alla spirale.
    opzioni:
      - testo: "Andare nel cortile"
        descrizione: "Dolovan si fa da parte con il forcone, e borbotta che i lupi non li paga nessuno."
        costo: 0
        esito:
          titolo: Il cortile
          testo: |
            Dolovan si scansa quanto basta per farti passare e ti segue a
            due passi, con il forcone tenuto basso.
          segue: circolo-un-lupo-alle-scuderie

  - id: circolo-tharn-ti-cerca-il-puma
    presso: scuderie-della-zanna-rotta
    immagine: personaggi/dolovan-stroud
    titolo: Uno del Bosco ti cerca
    sommario: "Nel cortile c'è un uomo con due lupi, e dice di aver sentito il tuo odore al margine."
    luogo: Scuderie della Zanna Rotta, la porta della stalla
    area: citta-bassa
    requisiti: [fazione.circolo == 0, rep.circolo < 1, braska >= 1, pista.capomozzo >= 10]
    testo: |
      Dolovan Stroud ti blocca sulla porta della stalla con il forcone di traverso. Dietro di lui, nei box, i
      cavalli battono gli zoccoli sulle assi e non si calmano.

      «Nel mio cortile c'è uno con due lupi» dice. «La Caserma alla porta nord non l'ha fatto entrare con le
      bestie, e io gli ho prestato il cortile prima che i cavalli spaccassero le stanghe. Mi ha detto una cosa
      che non mi piace.» Si gratta la nuca. «Secondo lui il puma della foresta ha portato il tuo odore fino al
      margine del suo Bosco, e lui l'ha seguito fin qui.»

      {natura Media} Un puma porta un odore sul pelo del collo. Per prendere il tuo deve esserti passato
      vicino più di una volta.

      *Braska ti segue ancora.* Le dita ti vanno alla cicatrice più fresca.
    opzioni:
      - testo: "Andare nel cortile"
        descrizione: "Dolovan si fa da parte con il forcone, e borbotta che i lupi non li paga nessuno."
        costo: 0
        esito:
          titolo: Il cortile
          testo: |
            Dolovan si scansa quanto basta per farti passare e ti segue a
            due passi, con il forcone tenuto basso.
          segue: circolo-un-lupo-alle-scuderie

  - id: circolo-tharn-ti-cerca-ilvaena
    presso: scuderie-della-zanna-rotta
    immagine: personaggi/dolovan-stroud
    titolo: Uno del Bosco ti cerca
    sommario: "Dolovan Stroud ti ferma sulla porta della stalla. Nel cortile c'è un uomo con due lupi, e il tuo nome gliel'ha dato Ilvaena Sorathe."
    luogo: Scuderie della Zanna Rotta, la porta della stalla
    area: citta-bassa
    requisiti: [fazione.circolo == 0, rep.circolo < 1, braska == 0, pista.tribu >= 2, pista.capomozzo >= 10]
    testo: |
      Dolovan Stroud ti blocca sulla porta della stalla con il forcone di traverso, e dalla stalla esce
      l'odore caldo del letame e del cuoio delle selle.

      «Nel mio cortile c'è uno con due lupi» dice. «La Caserma alla porta nord non l'ha fatto entrare con le
      bestie, e io gli ho prestato il cortile prima che i cavalli si rompessero le gambe nella strada. Cerca
      te. Gliel'ha detto quella mezzorca con le piume nei capelli che hai portato a cena al Grifone.»

      Accanto alla zanna d'orco spezzata che Dolovan ha inchiodato sulla porta, qualcuno ha appeso un rametto
      con tre tacche nella corteccia. Le tacche sono fresche, e il legno sotto è ancora chiaro.
    opzioni:
      - testo: "Andare nel cortile"
        descrizione: "Dolovan si fa da parte con il forcone, e borbotta che i lupi non li paga nessuno."
        costo: 0
        esito:
          titolo: Il cortile
          testo: |
            Dolovan si scansa quanto basta per farti passare e ti segue a
            due passi, con il forcone tenuto basso.
          segue: circolo-un-lupo-alle-scuderie

  # ------------------------------------------------------------ 0 → 1 · il cortile
  - id: circolo-un-lupo-alle-scuderie
    presso: scuderie-della-zanna-rotta
    immagine: fazioni/circolo-di-velthar
    titolo: Un lupo alle Scuderie
    sommario: "Un cacciatore del Circolo di Velthar aspetta nel cortile delle Scuderie, con due lupi sulla paglia e un ramo grigio in mano."
    luogo: Scuderie della Zanna Rotta, il cortile
    area: citta-bassa
    tipo: seguito
    requisiti: [fazione.circolo == 0]
    testo: |
      Sulla paglia sono sdraiati due lupi grigi con le orecchie dritte. Tengono il muso sulle zampe e seguono
      con gli occhi ogni cavallo che si muove nei box.

      Sul bordo dell'abbeveratoio siede un uomo robusto vestito di pelli, con un arco lungo sul ginocchio.
      Prima di parlare guarda i lupi. Dice di chiamarsi Tharn Koru e di venire dal Bosco di Velthar, e spezza
      un ramo di faggio dalle foglie grigie da cui esce una linfa scura.

      «Al margine sud del Bosco gli alberi diventano grigi» dice. «Hanno sempre bevuto la Marea, e adesso non
      la reggono più. Da settimane troviamo tronchi tagliati da gente di città. Il Maestro vuole sapere se il
      grigio ce lo manda la città, o se sale da solo e la città se lo porta via.»

      {percezione Media} Il ramo è tagliato netto, e il legno del taglio è già scuro e asciutto, più vecchio
      delle foglie grigie. È stato raccolto da terra.

      {origine figlio-del-circolo} Lo conosci di vista dal margine, dove passava con i lupi. Ti riconosce e
      abbassa il mento di un dito, il saluto del Circolo per chi non si vede da tempo. Con te non ha bisogno
      di fare domande, e i lupi lo capiscono prima di lui.
    opzioni:
      - testo: "Avvicinarti prima ai lupi"
        descrizione: "Tharn guarda i lupi prima di parlare. Forse vuole che li guardi anche tu."
        quando: [origine.figlio-del-circolo == 0]
        prova: { attributo: sociale, abilita: addestrare-animali, difficolta: Facile }
        successo:
          titolo: Il naso sul polso
          testo: |
            Ti accucci a tre passi dai lupi e aspetti, con le mani aperte sulle ginocchia e gli occhi bassi.
            Dopo un po' la lupa più vecchia si alza, ti annusa il polso con il naso freddo e torna a
            sdraiarsi. Tharn la segue con lo sguardo, poi ti dice che al margine taglia qualcuno con la sega,
            e che lui le seghe in città non le sa cercare. Ti chiede di trovare chi taglia. Le tacche per
            entrare nel Bosco, aggiunge, le dà a chi ha fatto qualcosa.
          pe: { addestrare-animali: 5 }
          effetti: { fazione.circolo: 1, rep.circolo: 0.5 }
        fallimento:
          titolo: I denti
          testo: |
            Ti accucci troppo in fretta, e la lupa più giovane ti mostra i denti senza alzarsi. Fai un passo
            indietro e finisci con il tallone nell'abbeveratoio, e l'acqua gelata ti entra nello stivale.
            Tharn aspetta che tu ti asciughi lo stivale prima di parlare. Ti chiede di trovare chi taglia al
            margine, con il tono che si usa per chiedere un favore a un estraneo, e ti avverte che le tacche
            per il Bosco le dà a chi ha fatto qualcosa.
          effetti: { fazione.circolo: 1, tormento: 1 }
      - testo: "Chiamare i lupi con Richiamo"
        descrizione: "La lingua che il Circolo insegna ai bambini la capiscono anche loro."
        requisiti: [incantesimo.richiamo >= 1]
        esito:
          titolo: La lingua dei bambini
          testo: |
            Dici le parole del Richiamo a voce bassa, muovendo appena le labbra. I due lupi alzano la testa
            insieme e vengono a sedersi ai tuoi piedi uno per lato. Contro le gambe senti il calore del loro
            pelo. Tharn sorride per la prima volta, con mezza bocca. Ti dice che al margine taglia qualcuno
            con la sega e ti chiede di trovarlo in città, dove lui con i lupi non entra. Le tacche per il
            Bosco, dice, si danno a chi ha fatto qualcosa.
          pe: { addestrare-animali: 5 }
          effetti: { fazione.circolo: 1, rep.circolo: 0.5 }
      - testo: "Reggere le domande di Tharn"
        descrizione: "Tharn fa poche domande, e sono precise. Vuole sapere chi sei prima di dirti che cosa vuole."
        quando: [origine.figlio-del-circolo == 0]
        prova: { attributo: sociale, abilita: [empatia, persuasione], difficolta: Media }
        successo:
          titolo: Poche domande
          testo: |
            Ti chiede da dove vieni e che cosa mangi. Poi ti chiede quando hai ucciso l'ultima volta, con lo
            stesso tono con cui si contano le frecce. Gli rispondi senza girarci intorno, e lui ascolta con le
            mani ferme sull'arco. Alla fine annuisce verso i lupi, non verso di te, e ti spiega quello che
            cerca, un uomo con una sega che taglia al margine sud. In città lui si perde, e tu forse lo trovi.
            Le tacche per il Bosco le avrai quando avrai fatto qualcosa.
          pe: { empatia: 5 }
          effetti: { fazione.circolo: 1, rep.circolo: 0.5 }
        fallimento:
          titolo: La risposta sbagliata
          testo: |
            Alla terza domanda rispondi con una battuta. Tharn la lascia cadere nella paglia senza
            raccoglierla e passa alla quarta, e uno dei lupi sbadiglia. Quando ha finito ti dice comunque che
            cosa cerca, un uomo con una sega che taglia al margine sud, e te lo dice guardando i lupi per
            tutto il tempo. Le tacche per il Bosco, aggiunge, le avrai quando avrai fatto qualcosa.
          effetti: { fazione.circolo: 1, scandalo: 1 }
      - testo: "Esaminare il ramo"
        descrizione: "Un ramo che diventa grigio racconta come ci è diventato, a chi sa leggerlo."
        prova: { attributo: mentale, abilita: natura, difficolta: Facile }
        successo:
          titolo: Il taglio di sega
          testo: |
            Giri il ramo fra le dita alla luce della porta. Il taglio è dritto e fine, con i segni dei denti
            uno accanto all'altro, e il grigio è entrato nel legno dal basso, dalle radici, molto prima della
            sega. Lo dici a Tharn. Lui ti guarda per la prima volta senza passare dai lupi, e ti chiede di
            trovare chi usa quella sega. Le tacche per entrare nel Bosco, dice, le dà a chi ha fatto qualcosa.
          pe: { natura: 5 }
          effetti: { fazione.circolo: 1, rep.circolo: 0.5 }
        fallimento:
          titolo: Un ramo e basta
          testo: |
            Giri il ramo fra le dita, ne annusi la linfa e ti macchi il pollice di scuro, e non ci vedi niente
            che non abbia già detto Tharn. Lui ti riprende il ramo dalle mani con delicatezza e ti spiega il
            taglio di sega come a un bambino, indicando con l'unghia i segni dei denti. Poi ti chiede lo
            stesso di trovare chi taglia, perché in città lui con i lupi non ci entra.
          effetti: { fazione.circolo: 1, tormento: 1 }
      - testo: "Lasciare che parli Dolovan"
        descrizione: "Dolovan è stato cacciatore per metà della vita, e un cacciatore lo ascolta. Ci vuole tempo, e un boccale."
        quando: [origine.figlio-del-circolo == 0]
        costo: 2
        esito:
          titolo: Fra cacciatori
          testo: |
            Dolovan appoggia il forcone al muro, va a prendere due boccali e si siede accanto a Tharn sul
            bordo dell'abbeveratoio. Parlano piano per tutto il pomeriggio, e i lupi non alzano la testa
            nemmeno quando Dolovan ride. Al tramonto Dolovan gli dice che di te ci si può fidare abbastanza.
            Tharn allora ti spiega che cosa cerca, un uomo con una sega che taglia al margine sud, e ti dice
            che le tacche per il Bosco le avrai quando avrai fatto qualcosa.
          effetti: { fazione.circolo: 1, rep.circolo: 0.5 }
      - testo: "Salutare come si saluta al margine"
        descrizione: "Il mento basso di un dito, la mano aperta sul petto. Al Circolo non serve altro."
        quando: [origine.figlio-del-circolo >= 1]
        esito:
          titolo: Il saluto del margine
          testo: |
            Abbassi il mento di un dito e ti posi la mano aperta sul petto, e i lupi si alzano tutti e due a
            guardarti con le orecchie in avanti. Tharn ti risponde allo stesso modo. Ti racconta del margine
            sud senza le domande che fa agli altri, come si parla a uno di casa, e ti chiede di trovare in
            città chi taglia con la sega. Ti ricorda che le tacche per il Bosco le hai avute da bambin{o|a} e
            che adesso te le devi riguadagnare come tutti.
          pe: { natura: 5 }
          effetti: { fazione.circolo: 1, rep.circolo: 0.5 }

  # ------------------------------------------------------------ 1 → 2 · la Segheria
  - id: circolo-il-legno-che-luccica
    presso: segheria-e-mulino-malgrani
    immagine: ambientazione/segheria-di-qir-azel
    titolo: Il legno che luccica
    sommario: "Alla Segheria scaricano tronchi con le venature che brillano al buio. Ai Quartieri Alti li chiamano legno di lanterna, e li pagano bene."
    luogo: Segheria di Qir-Azel, la rampa dei tronchi
    area: citta-bassa
    requisiti: [fazione.circolo == 1]
    testo: |
      La Segheria lavora dall'alba, e la polvere del legno copre i davanzali di mezzo quartiere. Le lame
      grandi girano sotto una tettoia di travi annerite, e il loro stridio arriva fino al canale ogni volta
      che mordono un tronco. Sulla rampa che scende al canale scaricano un carro, e un ragazzo con un
      cappuccio troppo grande fa rotolare i tronchi con una leva di frassino consumata lucida nei due punti
      dove tiene le mani.

      Sotto il porticato alcuni tronchi mandano una luce verdina che corre lungo le venature e si spegne al
      sole. Dove la corteccia è saltata la luce segue gli anelli del legno. Le mosche della segatura girano su
      tutta la catasta e sui tronchi che luccicano non si posano.

      La squadra la comanda Gualtiero Brenna, un uomo largo con un bastone a tacche alla cintura. Sta
      spiegando a un cliente in giacca buona che nei saloni dei Quartieri Alti il legno di lanterna lo
      bruciano per la luce.

      {natura Media} È la stessa luce che avevano le foglie del ramo di Tharn prima di diventare grigie. È la
      Marea che il legno ha bevuto senza digerirla, e sta nelle venature perché è lì che passava la linfa.

      {origine rampollo-dei-quartieri-alti} Il legno di lanterna l'hai visto bruciare nei camini delle feste,
      con gli ospiti che spegnevano le candele per ammirarlo. Faceva una fiamma bassa e quasi senza fumo.
      Nessuno ha mai chiesto da dove venisse.
    opzioni:
      - testo: "Fare un turno sulla rampa e guardare i tronchi"
        descrizione: "Brenna paga a giornata chi sa tenere una leva. Da vicino un tronco racconta più che da lontano."
        prova: { attributo: mentale, abilita: [natura, percezione], difficolta: Media }
        successo:
          titolo: Il marchio del margine
          testo: |
            Passi la mattina a far rotolare tronchi, con le braccia che bruciano e la polvere fin dentro le
            orecchie. Sul fondo di tre tronchi luminosi trovi la stessa cosa, un segno a fuoco a forma di
            cerchio spezzato che i taglialegna mettono sui legni di una sola concessione. Il marchio è
            bruciato a fondo, e nel legno carbonizzato la luce verde non arriva. Il ragazzo con il cappuccio
            ti dice dove sta la concessione, a nord-ovest, mezza giornata oltre l'ultima fattoria. È il
            margine sud del Bosco di Velthar.
          pe: { natura: 5 }
          segue: circolo-chi-compra-il-grigio
        fallimento:
          titolo: La leva
          testo: |
            La leva ti scappa al secondo tronco, e il tronco rotola giù per la rampa con te dietro che corri.
            Si ferma contro il muretto del canale e ne stacca un pezzo di intonaco grande come una mano.
            Brenna ti paga mezza giornata, perché l'altra metà l'hai passata a inseguire il legno, e ti fa
            capire con il bastone a tacche che domani può fare a meno di te.
          effetti: { ferite: 0.5 }
      - testo: "Cercare la concessione nei registri della Gilda"
        descrizione: "Ogni tronco che entra in città passa da un registro, e ogni registro ha un nome in cima."
        prova: { attributo: mentale, abilita: [politica-ed-economia, accademiche], difficolta: Media }
        successo:
          titolo: Il cerchio spezzato
          testo: |
            All'ufficio della Gilda sul canale ti fanno sfogliare il libro delle concessioni per il prezzo di
            un'ora di copista. Le pagine sono di carta spessa e hanno gli angoli neri di dita. Il legno di
            lanterna entra tutto con il marchio del cerchio spezzato, e la concessione è segnata a nord-ovest,
            oltre l'ultima fattoria. La firma in calce è quella di Gualtiero Brenna, e il compratore è sempre
            lo stesso, un intermediario del Mercato delle Ombre che firma con un nome solo.
          pe: { politica-ed-economia: 5 }
          segue: circolo-chi-compra-il-grigio
        fallimento:
          titolo: Il copista
          testo: |
            Il copista della Gilda ti fa aspettare un'ora sulla panca e poi ti porta il registro sbagliato,
            quello del grano, con la farina ancora fra le pagine. Quando glielo fai notare se ne porta via
            anche la panca. Esci con la sensazione di aver pagato un'ora del suo tempo per vederlo mangiare un
            pane col formaggio.
          effetti: { scandalo: 1 }
      - testo: "Seguire il carro fino al compratore"
        descrizione: "Un carro di legno di lanterna parte coperto da un telo. Un carro coperto non va mai lontano senza farsi notare."
        prova: { attributo: fisico, abilita: [furtivita, atletica], difficolta: Media }
        successo:
          titolo: Il magazzino sotto il ponte
          testo: |
            Segui il carro per vicoli sempre più stretti e ti tieni dietro i muli degli altri. Dove il telo è
            più liso il carico manda una luce verde, e nei vicoli in ombra la vedi da lontano. Il carro si
            ferma a un magazzino con la porta bassa sotto un ponte del Mercato delle Ombre. Lì scaricano il
            legno e lo pagano in contanti, e l'uomo che paga ha le scarpe dei Quartieri Alti e il mantello di
            un facchino. Il carrettiere chiama il carico per nome, roba del margine sud.
          pe: { furtivita: 5 }
          segue: circolo-chi-compra-il-grigio
        fallimento:
          titolo: Il carrettiere si volta
          testo: |
            Al terzo vicolo il carrettiere si volta e ti guarda, poi ferma il mulo e aspetta che tu passi.
            Passi con le mani in tasca e lo sguardo sulle grondaie, e quando ti volti il carro è sparito. Da
            una finestra una vecchia con i gomiti sul davanzale ti guarda, e ha visto tutto.
          effetti: { sospetto: 1 }
      - testo: "Offrire da bere ai taglialegna"
        descrizione: "A fine turno i taglialegna parlano volentieri, se qualcuno paga il primo giro e ha pazienza per il terzo."
        costo: 2
        esito:
          titolo: Il terzo giro
          testo: |
            Paghi il primo giro alla bettola sul canale e ascolti il secondo. La bettola ha i tavoli fatti con
            gli scarti della Segheria, e il vino sa di resina. Al terzo giro un taglialegna con un orecchio
            solo ti racconta del margine sud. Gli alberi laggiù brillano più di tutti, e Brenna li fa
            abbattere per primi. Il legno va a un magazzino sotto un ponte del Mercato delle Ombre, e da lì
            nei camini dei Quartieri Alti.
          effetti: { monete: -5 }
          segue: circolo-chi-compra-il-grigio
      - testo: "Chiedere ai ragazzi del canale"
        descrizione: "I ragazzi che pescano sotto la Segheria vedono passare tutti i carri, e per uno spicciolo li ricordano anche."
        quando: [origine.figlio-della-citta-bassa >= 1]
        esito:
          titolo: I ragazzi del canale
          testo: |
            Sotto il ponte del canale ci sono i soliti tre ragazzi con le lenze di spago e i piedi nell'acqua.
            A te non chiedono nemmeno lo spicciolo, perché ti hanno visto crescere due vicoli più in là. Il
            carro coperto lo conoscono, va sempre al magazzino sotto un ponte del Mercato delle Ombre. Il
            legno viene dal margine sud del Bosco, e il più piccolo lo sa perché il carrettiere bestemmia
            contro i druidi a ogni buca.
          pe: { conoscenze-della-strada: 5 }
          segue: circolo-chi-compra-il-grigio
      - testo: "Riconoscere il legno dei saloni"
        descrizione: "Nei saloni il legno di lanterna arriva sempre da un solo fornitore, quello che i servitori fanno entrare dal retro."
        quando: [origine.rampollo-dei-quartieri-alti >= 1]
        esito:
          titolo: Il fornitore dal retro
          testo: |
            Ti ricordi del fornitore, un uomo con il mantello da facchino e le scarpe troppo buone, che i
            servitori facevano entrare dalla cucina. Il legno lo portava in una cassa foderata di panno scuro,
            perché la luce non si vedesse dalla strada. Lo dici a Brenna come per caso, e lui ti dice il resto
            per vanità, perché ama il suo legno. Il compratore ha un magazzino sotto un ponte del Mercato
            delle Ombre, e il legno buono viene tutto dal margine sud del Bosco.
          pe: { galateo: 5 }
          segue: circolo-chi-compra-il-grigio
      - testo: "Leggere i registri come al banco"
        descrizione: "Le concessioni della Gilda le hai lette per anni. Sai dove si guarda per prima cosa."
        quando: [origine.mercante-dei-ponti >= 1]
        prova: { attributo: mentale, abilita: politica-ed-economia, difficolta: Facile }
        successo:
          titolo: In calce
          testo: |
            Al banco delle concessioni chiedi direttamente le ultime pagine, dove finiscono le firme fresche e
            l'inchiostro è ancora lucido. Il legno di lanterna entra con il marchio del cerchio spezzato, da
            una concessione a nord-ovest firmata da Gualtiero Brenna. Il compratore è un intermediario del
            Mercato delle Ombre, e paga sempre in contanti.
          pe: { politica-ed-economia: 5 }
          segue: circolo-chi-compra-il-grigio
        fallimento:
          titolo: Il copista
          testo: |
            Il copista di turno ti riconosce dai Ponti e ti fa aspettare apposta, mentre tempera la stessa
            penna per la terza volta. Esci dopo un'ora senza aver visto una pagina, e con la voglia di
            rifargli i conti a lui.
          effetti: { scandalo: 1 }

  # ------------------------------------------------------------ 1 → 2 · che cosa farne
  - id: circolo-chi-compra-il-grigio
    presso: segheria-e-mulino-malgrani
    immagine: personaggi/marko-thessel
    titolo: Chi compra il grigio
    sommario: "Sai dove taglia la Segheria e chi compra il legno di lanterna. Resta da decidere che cosa farne."
    luogo: Segheria di Qir-Azel, il cortile a fine turno
    area: citta-bassa
    tipo: seguito
    requisiti: [fazione.circolo == 1]
    testo: |
      A fine turno il cortile della Segheria si svuota, e fra i trucioli resta un tronco di lanterna spaccato
      a metà che luccica nella penombra. Le lame sono ferme e ancora calde, e sotto la tettoia ristagna
      l'odore della resina bruciata. Gualtiero Brenna ne sta caricando gli ultimi pezzi su una carriola, e
      quando ti vede rallenta senza fermarsi.

      Nel cuore del tronco spaccato il grigio sta a cerchi come gli anelli dell'età, e i cerchi grigi sono più
      vecchi del taglio di anni. Il grigio comincia vicino al midollo e si allarga verso la corteccia. Dove
      passa il grigio la lama ha strappato le fibre invece di tagliarle. I taglialegna hanno scelto gli alberi
      malati perché brillavano di più.

      {medicina Media} Una pianta che si ammala dalle radici si ammala da sotto, e la malattia sale con la
      linfa dal centro verso fuori. Se qualcuno ha fatto il danno, sta più in basso della sega.

      «Il legno è legno» dice Brenna senza alzare gli occhi dalla carriola. «La concessione è in regola, e i
      druidi possono lamentarsi alla Gilda come tutti. Io porto a casa la paga della squadra.»
    opzioni:
      - testo: "Denunciare il traffico a Galdrick"
        descrizione: "Legno malato bruciato nei camini dei Quartieri Alti. Lo sceriffo vorrà saperlo prima che si ammali qualcuno."
        quando: [galdrick.via == 0]
        esito:
          titolo: La taglia sul legname
          testo: |
            Galdrick ascolta in piedi con le braccia incrociate, e alla parola Marea manda un sergente al
            magazzino sotto il ponte prima che tu abbia finito. Il legno lo sequestrano e lo bruciano fuori
            dalle mura, in un falò che fa una luce verde per tutta la notte. Le guardie sulle mura lo guardano
            bruciare, e nessuna si mette sottovento. Ti paga la taglia del legname di contrabbando. Alla
            Segheria, il giorno dopo, Brenna ti chiude il cancello in faccia.
          effetti: { fazione.circolo: 1, rep.circolo: 0.5, rep.caserma: 0.5, monete: 25 }
      - testo: "Denunciare il traffico al sergente di turno"
        descrizione: "Galdrick è a Ghoran. Il sergente di turno alla Caserma odia le grane. La Marea la odia di più."
        quando: [galdrick.via == 1]
        esito:
          titolo: Il falò verde
          testo: |
            Il sergente di turno ti ascolta grattandosi il mento, e alla parola Marea si alza e chiama due
            uomini. Il legno del magazzino sotto il ponte lo caricano con i guanti e lo bruciano fuori dalle
            mura, in un falò che fa una luce verde per tutta la notte e che metà della Città Bassa va a
            vedere. Ti pagano la taglia del legname di contrabbando, e alla Segheria, il giorno dopo, Brenna
            ti chiude il cancello in faccia.
          effetti: { fazione.circolo: 1, rep.circolo: 0.5, rep.caserma: 0.5, monete: 25 }
      - testo: "Convincere Brenna a tagliare solo il secco segnato dal Circolo"
        descrizione: "Il Circolo segna gli alberi morti, e la Segheria il legno lo vuole comunque. Si può fare un accordo, se Brenna rinuncia alla luce."
        quando: [pista.pelle < 7]
        prova: { attributo: sociale, abilita: [persuasione, politica-ed-economia], difficolta: Media }
        successo:
          titolo: Il secco segnato
          testo: |
            Gli spieghi che un albero grigio bruciato in un salone è un processo che aspetta il suo giorno, e
            che un salone dei Quartieri Alti un processo lo perde di rado. Brenna si gratta la barba con il
            bastone, e le tacche ci si impigliano. Alla fine accetta di tagliare solo i tronchi morti che il
            Circolo segnerà, e per chiudere ti paga la giornata persa. Ai Malgrani, che sulla Segheria hanno
            la concessione, l'accordo non piacerà.
          pe: { persuasione: 5 }
          effetti: { fazione.circolo: 1, rep.circolo: 1, rep.malgrani: -0.5, monete: 20 }
        fallimento:
          titolo: La paga della squadra
          testo: |
            Brenna ti lascia parlare fino in fondo e poi ti dice che la paga della squadra la mettono i
            Malgrani, e ai Malgrani il legno piace luminoso. Riprende la carriola. Il tronco spaccato però te
            lo lascia prendere. Pesa più di quanto sembra, e con quello in spalla puoi tornare da Tharn a dire
            almeno dove nasce il grigio.
          effetti: { fazione.circolo: 1, circolo.legno-di-lanterna: 1, rep.malgrani: -0.5, contaminazione: 0.5 }
      - testo: "Convincere la cooperativa a tagliare solo il secco segnato dal Circolo"
        descrizione: "Adesso la Segheria è della cooperativa, e i taglialegna la loro pelle ci tengono. Un accordo con il Circolo conviene anche a loro."
        quando: [pista.pelle >= 7]
        prova: { attributo: sociale, abilita: [persuasione, politica-ed-economia], difficolta: Media }
        successo:
          titolo: Il secco segnato
          testo: |
            Spieghi a Brenna e ai capisquadra della cooperativa che un albero grigio bruciato in un salone è
            un processo che aspetta il suo giorno, e che stavolta il processo sarebbe contro di loro. Si
            consultano sotto il porticato, fra i tronchi che ancora luccicano. Alla fine accettano di tagliare
            solo i tronchi morti che il Circolo segnerà, e Brenna ti paga la giornata persa di tasca sua,
            contando le monete sul bastone.
          pe: { persuasione: 5 }
          effetti: { fazione.circolo: 1, rep.circolo: 1, monete: 20 }
        fallimento:
          titolo: Il voto rimandato
          testo: |
            I capisquadra ti ascoltano con le braccia incrociate e poi decidono di votare un'altra sera, come
            fanno con tutto da quando la Segheria è loro. Brenna ti lascia prendere il tronco spaccato, e con
            quello in spalla puoi tornare da Tharn a dire almeno dove nasce il grigio.
          effetti: { fazione.circolo: 1, circolo.legno-di-lanterna: 1, contaminazione: 0.5 }
      - testo: "Rovinare le lame della Segheria di notte"
        descrizione: "Una lama senza denti si ferma davanti a qualunque tronco. Se ti prendono, però, la Caserma non farà differenze."
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Media }
        successo:
          titolo: I denti della sega
          testo: |
            Entri dal canale dopo la seconda campana e passi la lima sulle lame grandi finché non hanno più un
            dente sano. La lima stride sull'acciaio, e ogni dieci colpi ti fermi ad ascoltare il cortile.
            Prima di uscire ti carichi in spalla due ciocchi di lanterna, per farli vedere a Tharn. La
            Segheria resta ferma una settimana, e in Città Bassa si parla di druidi armati di lima.
          effetti: { fazione.circolo: 1, rep.circolo: 0.5, sospetto: 1, circolo.legno-di-lanterna: 2 }
        fallimento:
          titolo: Il cane del guardiano
          testo: |
            Il cane del guardiano ti sente alla seconda lama, quando la lima stride sul primo dente, e abbaia
            fino a svegliare il canale. Scappi con la lima ancora in mano e un ciocco sotto il braccio. Il
            giorno dopo in Caserma circola la tua descrizione, quasi giusta. Le lame però sono rovinate
            abbastanza, e il ciocco basta per dire a Tharn dove nasce il grigio.
          effetti: { fazione.circolo: 1, sospetto: 1.5, circolo.legno-di-lanterna: 1 }
      - testo: "Prendere un ciocco e tornare dal Maestro"
        descrizione: "La città farà quello che vuole del suo legno. Al Circolo serve sapere che il grigio viene da sotto."
        costo: 2
        esito:
          titolo: Un ciocco in spalla
          testo: |
            Compri da Brenna un ciocco di lanterna al prezzo dei saloni, e lui te lo vende ridendo. Lo porti
            in spalla fino alle Scuderie, dove Tharn ha lasciato detto di cercarlo al margine, e per strada la
            gente si volta a guardare la luce che ti sta sulla spalla. Il resto del legno se ne va nei camini
            dei Quartieri Alti, e per qualche sera ti chiedi quanti ospiti lo stanno ammirando.
          effetti: { fazione.circolo: 1, circolo.legno-di-lanterna: 1, monete: -6 }

  # ------------------------------------------------------------ 2 → 3 · il margine (grado 1)
  - id: circolo-il-margine
    presso: circolo-bosco-di-velthar
    immagine: fazioni/circolo-di-velthar
    titolo: Il margine
    sommario: "Un giorno di cammino a nord-ovest, il Bosco di Velthar comincia come un muro."
    luogo: Il Bosco di Velthar, il margine
    area: superficie-fratturata
    requisiti: [fazione.circolo == 2]
    testo: |
      Per un giorno intero la strada di Velthar piega a ovest fra valli di detriti, finché all'orizzonte
      compare una linea scura. I detriti sono lastre di roccia spaccate di netto e accatastate, e fra le
      lastre non cresce niente. A cento passi dal Bosco l'erba ricomincia tutta insieme, su una linea dritta.
      Davanti al primo tronco ti aspetta Tharn con i due lupi, seduto su un albero caduto con tre tacche nella
      corteccia. Gli uccelli cantano dal lato del Bosco, e alle tue spalle la valle resta muta.

      Gli racconti della Segheria, e quando hai finito ti ferma con una mano aperta davanti al petto.

      «Da qui in avanti i sentieri cambiano, e le bestie guardano chi entra armato» dice. «Le lame puoi
      lasciarle qui sul tronco e riprenderle all'uscita. Oppure entri con quello che hai, e vediamo se ti
      lasciano passare.»

      {armi-da-mischia Media} Tharn ha l'arco a tracolla e i lupi a tre passi, e anche da seduto ci metterebbe
      meno di te a muoversi. Lasciargli le armi ti sembra una pessima idea, e la mano non si stacca dall'elsa.

      {origine figlio-del-circolo} Sul tronco con le tre tacche ti sedevi ad aspettare quando tornavi tardi.
      Adesso qualcuno ci ha inchiodato sopra un ferro di cavallo. Tharn guarda le tue armi e poi scuote la
      testa, perché quelle parole erano per i forestieri e le bestie del margine ti conoscono da quando eri
      bambin{o|a}.
    opzioni:
      - testo: "Lasciare le armi sul tronco"
        descrizione: "Al margine non si discute. Le armi le riprendi all'uscita, se il Bosco ti lascia uscire."
        quando: [origine.figlio-del-circolo == 0]
        esito:
          titolo: A mani vuote
          testo: |
            Appoggi le armi sul tronco con le tre tacche, una accanto all'altra. La corteccia è umida e
            fredda, e il metallo ci lascia sopra un'impronta scura. Ti senti nud{o|a} come in un bagno
            pubblico. Tharn annuisce e ti fa strada, e dopo dieci passi un picchio smette di battere per
            guardarti, poi ricomincia.
          segue: circolo-la-spirale-di-aelion
      - testo: "Entrare armato e farti accettare dagli animali"
        descrizione: "Le bestie del Bosco misurano chi passa. Bisogna lasciarsi misurare senza muovere un dito."
        quando: [origine.figlio-del-circolo == 0]
        prova: { attributo: mentale, abilita: [natura, resilienza], difficolta: Media }
        successo:
          titolo: Le bestie che misurano
          testo: |
            Tieni le mani lontane dalle armi e cammini piano. Una volpe ti attraversa il sentiero e si ferma a
            guardarti, poi un cervo dal folto e due cornacchie su un ramo basso fanno lo stesso. Le lasci
            guardare, e per tutto quel tempo nel Bosco non si muove una foglia. Alla fine se ne vanno tutte
            nello stesso momento, e Tharn ti dice che il Bosco ha deciso di lasciarti passare.
          pe: { natura: 5 }
          segue: circolo-la-spirale-di-aelion
        fallimento:
          titolo: Le cornacchie
          testo: |
            Al primo fruscio la mano ti va all'elsa da sola, e dal ramo basso le due cornacchie si alzano
            gridando. Il grido fa il giro del Bosco e torna indietro moltiplicato, anche da alberi dove non
            hai visto nessun uccello. Tharn ti riporta al margine senza una parola, e ti fa capire con il
            mento che puoi riprovare quando avrai le mani più calme.
          effetti: { tormento: 1 }
      - testo: "Seguire la volpe con Richiamo"
        descrizione: "Una volpe aspetta sul sentiero, come se sapesse dove andare. Con le parole giuste ti fa da guida."
        requisiti: [incantesimo.richiamo >= 1]
        esito:
          titolo: La guida rossa
          testo: |
            Dici il Richiamo a mezza voce, e la volpe si gira e si mette a trotterellare davanti a te. Ogni
            dieci passi si volta per controllare che la segui, e la coda bagnata di rugiada lascia una riga
            scura sull'erba. Tharn la lascia fare. Il sentiero che sceglie la volpe è più corto di quello di
            Tharn, e lui finge di non accorgersene.
          pe: { addestrare-animali: 5 }
          segue: circolo-la-spirale-di-aelion
      - testo: "Salutare il margine come da bambin{o|a}"
        descrizione: "Tre colpi con il palmo sul tronco delle tacche, uno per ogni via. Al margine i bambini lo fanno senza pensarci."
        quando: [origine.figlio-del-circolo >= 1]
        esito:
          titolo: Tre colpi
          testo: |
            Batti tre volte il palmo sul tronco con le tacche, e il legno ti restituisce un suono pieno, come
            una porta di casa. Il terzo colpo ti risale fino al gomito. Tharn ride sotto la barba e ti lascia
            andare avanti. Gli animali ti guardano passare senza fermarsi, come si guarda uno che torna.
          pe: { natura: 5 }
          segue: circolo-la-spirale-di-aelion

  - id: circolo-la-spirale-di-aelion
    presso: circolo-bosco-di-velthar
    immagine: fazioni/circolo-di-velthar
    titolo: La spirale
    sommario: "Al Circolo del Respiro il Maestro ascolta la storia del legno grigio, e risponde con un'immagine."
    luogo: Il Bosco di Velthar, il Circolo del Respiro
    area: superficie-fratturata
    tipo: seguito
    requisiti: [fazione.circolo == 2]
    testo: |
      Il Circolo del Respiro è una spirale di pietre coperte di muschio che scende intorno a una fenditura del
      terreno, da cui sale un vapore caldo. Il vapore esce a soffi regolari e sa di terra bagnata e di ferro.
      Sulle pietre siedono una decina di druidi, e le pietre sono consumate lisce dove si siedono. Al centro,
      a un passo dalla fenditura, sta in piedi un elfo con gli occhi argentei e strisce di corteccia nelle
      trecce. Il vapore gli passa sulla faccia a ogni soffio, e lui non si sposta.

      Racconti della Segheria e del grigio a cerchi dentro i tronchi, e il Maestro, Aelion Farethil, ascolta
      con gli occhi chiusi.

      «Una volta ho visto un cervo grattarsi una piaga contro una roccia» dice alla fine. «Si grattava finché
      usciva il sangue. Il sangue gli dava sollievo, e allora continuava. Tu che cosa hai visto?»

      {empatia Facile} Il cervo è il Bosco e la piaga è il margine sud. Aelion teme che la città l'abbia
      grattata, e ancora di più che la piaga venga da dentro.
    opzioni:
      - testo: "Rispondere con un'immagine"
        descrizione: "Un cervo, una piaga, il sangue che dà sollievo. Ci vuole un'immagine che gli stia accanto."
        prova: { attributo: sociale, abilita: [espressivita, empatia], difficolta: Media }
        successo:
          titolo: Il tarlo
          testo: |
            Gli dici che hai visto un tavolo mangiato dal tarlo, che dai buchi buttava fuori una polvere fine,
            e che il falegname l'aveva venduto lo stesso perché la polvere luccicava. Il Maestro apre gli
            occhi. Sulla spirale un druido ride piano, e il vapore gira verso di te. Aelion ti dice che da
            oggi sei un Viandante, come si chiamavano quelli che vennero qui per primi. Gli alberi grigi sono
            a sud, dice, dove il Bosco poggia sulle rovine più profonde.
          pe: { espressivita: 5 }
          effetti: { fazione.circolo: 1, oggetto.circolo-segno-delle-tre-tacche: 1, monete: 30 }
          almeno: { rep.circolo: 2 }
        fallimento:
          titolo: La risposta piana
          testo: |
            Cominci con un'immagine e finisci con una spiegazione, e te ne accorgi a metà. Il vapore gira e ti
            bagna la faccia mentre parli, e un druido sulla spirale si schiarisce la gola. Aelion ti lascia
            finire. Poi ti dice che al Circolo a una domanda così si risponde con un'immagine, e che ti
            accetta lo stesso come Viandante, perché nemmeno i primi che vennero qui sapevano rispondere come
            si deve. Gli alberi grigi sono a sud, dove il Bosco poggia sulle rovine più profonde.
          effetti: { fazione.circolo: 1, oggetto.circolo-segno-delle-tre-tacche: 1, monete: 30, tormento: 1 }
          almeno: { rep.circolo: 2 }
      - testo: "Rispondere con quello che hai visto nel legno"
        descrizione: "I cerchi grigi nel cuore del tronco sono un'immagine anche loro, e la sai leggere."
        prova: { attributo: mentale, abilita: natura, difficolta: Media }
        successo:
          titolo: Gli anelli
          testo: |
            Gli descrivi gli anelli del tronco spaccato, il grigio che sale dal centro come l'acqua sale in un
            pozzo. Mentre parli la fenditura manda un soffio più lungo degli altri, e un paio di druidi alzano
            la testa. Il Maestro apre gli occhi e annuisce una volta. Ti dice che da oggi sei un Viandante,
            come si chiamavano quelli che vennero qui per primi, e che gli alberi grigi sono a sud, dove il
            Bosco poggia sulle rovine più profonde.
          pe: { natura: 5 }
          effetti: { fazione.circolo: 1, oggetto.circolo-segno-delle-tre-tacche: 1, monete: 30 }
          almeno: { rep.circolo: 2 }
        fallimento:
          titolo: Gli anelli contati
          testo: |
            Cominci a contare gli anelli ad alta voce, e a quaranta ti accorgi che sulla spirale non ti
            ascolta più nessuno. Un druido si è addormentato con la testa sul muschio. Aelion invece ascolta
            fino in fondo. Ti dice che contare è un modo di guardare anche quello, e che ti accetta come
            Viandante. Gli alberi grigi sono a sud, dove il Bosco poggia sulle rovine più profonde.
          effetti: { fazione.circolo: 1, oggetto.circolo-segno-delle-tre-tacche: 1, monete: 30, tormento: 1 }
          almeno: { rep.circolo: 2 }
      - testo: "Aspettare in silenzio"
        descrizione: "Sulla spirale nessuno parla finché il vapore non gira. Si può aspettare con loro, anche a lungo."
        costo: 2
        esito:
          titolo: Il vapore gira
          testo: |
            Ti siedi sulla pietra più vicina e aspetti. Passano due ore, e il vapore ti fa sudare sotto i
            vestiti. La pietra sotto di te è tiepida, e quando la fenditura soffia la senti vibrare piano.
            Quando finalmente il vapore gira verso di te, il Maestro sorride appena e ti dice che sulla
            spirale si aspetta così, e che hai aspettato bene. Da oggi sei un Viandante, come si chiamavano
            quelli che vennero qui per primi. Gli alberi grigi sono a sud, dove il Bosco poggia sulle rovine
            più profonde.
          effetti: { fazione.circolo: 1, oggetto.circolo-segno-delle-tre-tacche: 1, monete: 30 }
          almeno: { rep.circolo: 2 }
      - testo: "Rispondere con il cinghiale della porta nord"
        descrizione: "Il giorno del Festival hai visto una bestia guidata con il dolore. Anche quella era una piaga grattata da qualcuno."
        quando: [origine.figlio-del-circolo >= 1]
        esito:
          titolo: La bestia della porta nord
          testo: |
            Gli racconti del cinghiale del Festival, con le vene d'acciaio e l'orco che lo spronava proprio
            dove gli faceva male. Aelion apre gli occhi, e per un momento lo sguardo gli si fa duro. Sulla
            spirale nessuno si muove. Ti dice che da oggi sei un Viandante, come si chiamavano quelli che
            vennero qui per primi, anche se da qui non sei mai andat{o|a} via del tutto. Gli alberi grigi sono
            a sud, dove il Bosco poggia sulle rovine più profonde.
          pe: { addestrare-animali: 5 }
          effetti: { fazione.circolo: 1, oggetto.circolo-segno-delle-tre-tacche: 1, monete: 30 }
          almeno: { rep.circolo: 2 }

  # ------------------------------------------------------------ 3 → 4 · il boschetto grigio (spedizione)
  - id: circolo-il-boschetto-grigio
    presso: circolo-bosco-di-velthar
    immagine: ambientazione/marea-grigia
    titolo: Il boschetto grigio
    sommario: "A sud del Circolo gli alberi hanno la corteccia color cenere e respirano a scatti."
    luogo: Il Bosco di Velthar, il sentiero del sud
    area: superficie-fratturata
    requisiti: [fazione.circolo == 3]
    testo: |
      Tharn ti aspetta sul sentiero del sud con uno solo dei suoi lupi. La lupa vecchia ha una spalla fasciata
      con le foglie e zoppica dietro per orgoglio, a distanza. Le foglie sono legate con un filo d'erba, e
      sotto si vede l'orlo del morso, liscio come un taglio di coltello. Tharn ti racconta tutto guardando a
      sud. Da quella parte il vento porta un odore di ferro bagnato, e la lupa lo annusa e si siede.

      «Laggiù gli alberi respirano a scatti» dice. «Dalle crepe della corteccia esce una nebbia come latte, e
      chi ci passa tossisce per tre giorni. Da una luna ci vive un branco di lupi grigi con le gengive di
      metallo, che hanno cacciato i miei. Il capobranco è grande come un vitello e si muove a scatti come il
      boschetto.»

      {addestrare-animali Media} La lupa vecchia tiene le orecchie piatte quando guarda a sud. Un branco segue
      il capo, e se il capo cade o cambia idea gli altri si sparpagliano.

      Tharn ti accompagnerà fino alle rovine sotto le radici, perché i suoi lupi più giù non ci vanno.
    opzioni:
      - testo: "Entrare nel Bosco interno con Tharn"
        descrizione: "Un giorno di sentieri che cambiano fino alle rovine, e oltre le rovine il grigio. Tharn conosce la strada fino a metà."
        esito:
          titolo: Il sentiero del sud
          testo: |
            Tharn si mette davanti e tu dietro, e il lupo giovane chiude la fila. Sui tronchi il muschio
            cresce da tutti i lati, e non serve a trovare il nord. Dopo cento passi il sentiero si piega in un
            modo che non ricordi di aver visto entrando, e Tharn ti dice di non voltarti mai, perché dietro il
            sentiero non è più lo stesso.
          vai: circolo-bosco-interno
      - testo: "Entrare a cavallo"
        descrizione: "In sella il primo tratto si fa in fretta. Al margine del grigio il cavallo lo lascerai legato."
        requisiti: [chiave.cavalcatura >= 1]
        costo: 0
        esito:
          titolo: In sella fino alle rovine
          testo: |
            Il cavallo entra nel Bosco con le orecchie dritte e il passo corto, e Tharn gli cammina accanto
            tenendogli una mano sul collo. Per un tratto i sentieri cambiano più piano, come se facessero
            attenzione a non spaventarlo. Ogni volta che il sentiero si sposta il cavallo si ferma e soffia
            dalle narici, prima che tu veda cambiare qualcosa.
          vai: circolo-bosco-interno

  # ------------------------------------------------------------ 4 → 5 · le tavole di Serha
  - id: circolo-le-tavole-di-serha
    presso: circolo-bosco-di-velthar
    immagine: fazioni/circolo-di-velthar
    titolo: Le tavole di Serha
    sommario: "L'archivista del Circolo incide su tavole di pietra i respiri del Bosco. Il grigio arriva a impulsi, e lei sa a che cosa somigliano."
    luogo: Il Bosco di Velthar, l'archivio sotto la spirale
    area: superficie-fratturata
    requisiti: [fazione.circolo == 4, circolo.curva == 0]
    testo: |
      L'archivio è una grotta bassa sotto la spirale, con centinaia di tavole di pietra incise appoggiate alle
      pareti. Le tavole vicino all'ingresso hanno i segni netti e chiari. Quelle in fondo sono così consumate
      che i segni si leggono meglio con le dita. Da un lato della grotta passa la fenditura, e la pietra
      intorno è calda al tatto. Serha Duvain sta incidendo una tavola e la tiene ferma con il braccio sinistro
      di legnoscuro, che pulsa al ritmo del suo cuore.

      Le racconti del muro precuriano sotto il boschetto, e lei ti mostra una tavola lunga come un uomo con
      vent'anni di Bosco in una fila di segni.

      «Il grigio arriva a impulsi a distanza di anni» dice, e batte il dito sulla tavola. «Il Velo misura la
      Marea nella Cicatrice da quando c'è la Cattedrale, e tiene la curva in un registro. Se gli impulsi
      coincidono, il Bosco respira insieme alla Cicatrice. A chi nega l'Albero il registro non lo prestano.»

      {accademiche Media} I segni sono in colonne di dodici come i mesi, e gli impulsi cadono tutti in
      autunno, vicino agli anniversari della Caduta. In vent'anni di colonne non ce n'è uno fuori stagione.

      {origine accolito-del-velo} Il registro in pelle verde stava sul leggio della sala di Ottilia, e te lo
      facevano spolverare senza aprirlo. La catenella aveva lasciato sulla pelle una striscia più chiara.
    opzioni:
      - testo: "Andare a chiedere la curva in Cattedrale"
        descrizione: "Il registro sta nei Quartieri Alti, in Cattedrale. Serve qualcuno che il Velo ascolti, o che il Velo non noti."
        costo: 0
        esito:
          titolo: La pelle verde
          testo: |
            Serha ti dà una tavoletta di cera con i suoi impulsi ricopiati in piccolo, e la cera è ancora
            morbida dove l'ha tenuta in mano. Ti raccomanda di non farla vedere a nessuno con la veste rossa.
            Ti dice che la curva del Velo la tiene Ottilia Sanvel, che non presta niente e scambia volentieri.
          imposta: { circolo.curva: 1 }
      - testo: "Misurare i respiri del Bosco con Serha"
        descrizione: "Senza la curva del Velo, si può aspettare il prossimo respiro e misurarlo da sé. Tre notti nella grotta, accanto alla fenditura."
        costo: 3
        prova: { attributo: mentale, abilita: [natura, magia], difficolta: Difficile }
        successo:
          titolo: Tre notti
          testo: |
            Per tre notti tieni la mano sulla pietra calda accanto alla fenditura e conti, mentre Serha
            incide. La terza notte il respiro arriva, e lo senti nelle ossa del polso prima che nella pietra.
            Il vapore sale tutto insieme e riempie la grotta fino alla volta, poi la fenditura torna asciutta.
            Serha lo confronta con le sue tavole e con i ricordi di una vita. Coincide con quello dell'ultima
            tempesta nella Cicatrice, giorno per giorno.
          pe: { natura: 10 }
          effetti: { fazione.circolo: 1, rep.circolo: 0.5, informazioni.segreto: 1 }
        fallimento:
          titolo: Il sonno
          testo: |
            La terza notte ti addormenti con la mano sulla pietra, e il respiro arriva mentre sogni. Al
            risveglio Serha ha già inciso tutto, e sulla tavola c'è ancora la polvere di pietra. Ti dice che
            coincide con l'ultima tempesta nella Cicatrice. A te restano un mal di testa che dura fino a sera
            e la mano arrossata come dopo una scottatura.
          effetti: { fazione.circolo: 1, tormento: 1.5 }

  - id: circolo-la-curva-del-velo
    presso: cattedrale-del-velo
    immagine: personaggi/ottilia-sanvel
    titolo: La curva del Velo
    sommario: "Ottilia Sanvel custodisce il registro della Marea, rilegato in pelle verde. Lo presta soltanto in cambio di qualcosa."
    luogo: Cattedrale del Velo, la sala delle tavolette
    area: quartieri-alti
    requisiti: [fazione.circolo == 4, circolo.curva == 1]
    testo: |
      La sala di Ottilia Sanvel sta in fondo al chiostro. Ha le pareti imbiancate e una sola finestra alta, e
      la luce cade dritta sul leggio. Sul leggio c'è il registro della Marea, rilegato in pelle verde e legato
      con una catenella. La pelle è lucida agli angoli, e la catenella è d'ottone sottile e chiusa da un
      lucchetto piccolo come un'unghia. Ottilia scrive seduta con la schiena dritta e alza gli occhi solo
      quando hai finito di entrare.

      Le chiedi della curva, e lei ascolta senza cambiare faccia mentre raddrizza una pila di tavolette già
      dritta.

      «Il registro non si presta a chi nega l'Albero» dice. «Lo hanno scritto confratelli che hanno passato
      anni di notti sulla Cicatrice. Si può fare uno scambio, però. Il Velo vuole sapere da dove veniva il
      metallo nelle vene del cinghiale della Foresta Strisciante, quello che ha abbattuto Corin Ashdale. Il
      Circolo lo sa.»

      {origine accolito-del-velo} Ottilia ti riconosce e raddrizza ancora di più la schiena. Ti ha insegnato
      lei a spolverare quel leggio, senza mai fartelo aprire.
    opzioni:
      - testo: "Chiederle la curva con le buone maniere"
        descrizione: "Ottilia apprezza le forme. Bisogna chiedere nel modo giusto, e senza nominare il Circolo più del necessario."
        prova: { attributo: sociale, abilita: [galateo, persuasione], difficolta: Media }
        successo:
          titolo: Mezz'ora al leggio
          testo: |
            Le parli del Bosco come di un vicino che soffre, e l'Albero non lo nomini mai. Ottilia alla fine
            apre la catenella con una chiave che porta al collo e ti concede mezz'ora al leggio, in piedi,
            mentre lei ti guarda. Le colonne di date sono scritte in inchiostro bruno da molte mani diverse,
            una dopo l'altra per generazioni. Gli impulsi della Cicatrice coincidono con quelli di Serha, uno
            per uno.
          pe: { accademiche: 5 }
          effetti: { fazione.circolo: 1, rep.circolo: 0.5, informazioni.segreto: 1 }
        fallimento:
          titolo: Le forme sbagliate
          testo: |
            Al terzo giro di frase ti scappa la parola Circolo, e Ottilia richiude la penna nel calamaio con
            un piccolo colpo secco. Ti dice che la sala chiude all'ora di nona e che sono le otto e mezza.
            Esci con la tavoletta di Serha in tasca e la sensazione di aver sbagliato forchetta a un pranzo.
          effetti: { scandalo: 1 }
      - testo: "Chiederla da laico della Confraternita"
        descrizione: "Al Velo hai già dato abbastanza. Ottilia lo sa, e il registro non è un segreto per chi lavora in Cattedrale."
        requisiti: [rep.velo >= 3]
        prova: { attributo: sociale, abilita: [galateo, persuasione], difficolta: Facile }
        successo:
          titolo: Mezz'ora al leggio
          testo: |
            Ottilia annuisce prima che tu finisca, apre la catenella con la chiave che porta al collo e ti
            lascia mezz'ora al leggio. Il registro si apre da solo alle ultime pagine, dove la rilegatura ha
            ceduto a forza di consultarlo. Ti chiede soltanto di non ricopiare le date con l'inchiostro. Gli
            impulsi della Cicatrice coincidono con quelli di Serha, uno per uno.
          pe: { accademiche: 5 }
          effetti: { fazione.circolo: 1, rep.circolo: 0.5, informazioni.segreto: 1 }
        fallimento:
          titolo: L'ora di nona
          testo: |
            Ottilia ti ascolta senza posare la penna, poi ti ricorda che la sala chiude all'ora di nona e che
            il registro non si apre di fretta. Torna un altro giorno, dice, con una domanda più corta.
          effetti: { scandalo: 1 }
      - testo: "Dare a Ottilia la diagnosi del cinghiale"
        descrizione: "Uno scambio pulito. Il Velo avrà la sua risposta, e il Circolo non sarà contento di sapere a chi l'hai data."
        esito:
          titolo: Il metallo nelle vene
          testo: |
            Le dici quello che Serha ti ha detto della Marea che impara le forme e del metallo che sale nelle
            vene delle bestie dal basso, come il grigio nei tronchi. Ottilia scrive tutto senza fermarti, e la
            penna non si alza dalla carta nemmeno alla parola Marea. Poi apre la catenella del registro e ti
            lascia guardare quanto vuoi. Gli impulsi della Cicatrice coincidono con quelli di Serha, uno per
            uno. Quando torni al Bosco, Serha capisce dove sei stat{o|a} prima che tu apra bocca.
          pe: { accademiche: 5 }
          effetti: { fazione.circolo: 1, rep.velo: 1, rep.circolo: -0.5, informazioni.segreto: 1 }
      - testo: "Ricostruire la curva in Biblioteca"
        descrizione: "Le cronache delle tempeste stanno in Biblioteca, sparse in cento volumi. Con pazienza la curva si rifà a mano."
        costo: 2
        prova: { attributo: mentale, abilita: accademiche, difficolta: Difficile }
        successo:
          titolo: Cento volumi
          testo: |
            Attraversi la piazza fino alla Biblioteca e passi due giorni fra gli scaffali, a ricopiare le date
            delle tempeste dalle cronache dei Raschiatori e dai bollettini d'autunno del Velo. Le cronache più
            vecchie hanno la carta gonfia d'umido e l'inchiostro sbiadito al colore della ruggine. Alla fine
            hai una curva fatta a mano, storta come un sentiero, che coincide con gli impulsi di Serha in
            tutti i punti che contano.
          pe: { accademiche: 10 }
          effetti: { fazione.circolo: 1, rep.circolo: 0.5 }
        fallimento:
          titolo: Le date sbagliate
          testo: |
            Due giorni di cronache, e alla fine ti accorgi di aver mescolato il calendario della Gilda con
            quello del Velo, che contano gli anni in modo diverso. La curva che ne esce non somiglia a niente.
            Te ne torni con gli occhi rossi e le dita nere d'inchiostro fino alle nocche.
          effetti: { tormento: 1 }
      - testo: "Copiarla di notte negli archivi minori"
        descrizione: "Una copia del registro sta negli archivi minori, dove le guardie del Velo passano ogni ora. Un'ora basta, a chi è svelto."
        prova: { attributo: fisico, abilita: furtivita, difficolta: Difficile }
        successo:
          titolo: La copia
          testo: |
            Entri negli archivi minori dopo compieta, con una candela coperta dalla mano. Trovi la copia del
            registro dove la tenevano i novizi, sotto il bancone, che ha il legno consumato dove si appoggiano
            i gomiti. Ricopi gli impulsi sulla tavoletta di Serha fra un giro di guardie e l'altro, e
            coincidono, uno per uno.
          pe: { furtivita: 5 }
          effetti: { fazione.circolo: 1, rep.circolo: 0.5, informazioni.segreto: 1 }
        fallimento:
          titolo: Il giro di guardia
          testo: |
            La guardia del Velo passa in anticipo, e tu ti ritrovi dietro una colonna con la candela spenta
            fra le dita e la cera che ti cola sul polso. Esci da una finestra del chiostro, e la mattina dopo
            in Cattedrale si parla di un ladro di candele.
          effetti: { sospetto: 1.5 }
      - testo: "Chiederla come una volta"
        descrizione: "Hai spolverato quel leggio per anni. Ottilia ti deve almeno di sapere che cosa c'era dentro."
        quando: [origine.accolito-del-velo >= 1]
        prova: { attributo: sociale, abilita: [galateo, empatia], difficolta: Facile }
        successo:
          titolo: Il leggio spolverato
          testo: |
            Le ricordi del leggio e degli anni di polvere, senza rancore. Ottilia ti guarda a lungo, poi apre
            la catenella con la chiave che porta al collo e si volta verso la finestra, per non vederti
            leggere. Le pagine fanno un rumore secco quando le giri, e lei non si volta nemmeno a quello. Gli
            impulsi della Cicatrice coincidono con quelli di Serha, uno per uno.
          pe: { empatia: 5 }
          effetti: { fazione.circolo: 1, rep.circolo: 0.5, informazioni.segreto: 1 }
        fallimento:
          titolo: Le forme sbagliate
          testo: |
            Le parli del leggio, e lei ti risponde che la polvere si spolvera e basta. La sala chiude all'ora
            di nona. Esci con la sensazione di essere tornat{o|a} novizi{o|a}, e di aver sbagliato salmo.
          effetti: { scandalo: 1 }
