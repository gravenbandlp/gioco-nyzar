# Glossario della quest del Circolo di Velthar: i personaggi che entrano nei testi del gioco con questa quest.
# Aelion, Tharn, Serha e Voren vengono dal Codex (personaggi/); Gualtiero Brenna è nuovo (il caposquadra della
# Segheria al passo 2). Presentazioni generali, senza i segreti della quest.
glossario:
  - id: aelion-farethil
    nome: Aelion Farethil
    alias: [Aelion]
    tipo: personaggio
    sottotitolo: "Maestro del Circolo di Velthar"
    testo: "Maestro del Circolo di Velthar, un elfo di almeno cent'anni con gli occhi argentei e strisce di corteccia nelle trecce. Presiede il Circolo Ristretto senza alzare la voce e parla per immagini. Considera una leggenda il Grande Albero Rosso."

  - id: tharn-koru
    nome: Tharn Koru
    alias: [Tharn]
    tipo: personaggio
    sottotitolo: "Cacciatore degli Irriducibili, al margine del Bosco"
    testo: "Cacciatore druidico degli Irriducibili, con l'arco lungo a tracolla e due lupi grigi al fianco. Ha lasciato Qir-Azel dopo la tempesta di Marea del 133, e al margine del Bosco di Velthar è quasi sempre il primo a incontrare chi arriva."

  - id: serha-duvain
    nome: Serha Duvain
    alias: [Serha]
    tipo: personaggio
    sottotitolo: "Archivista del Circolo, voce dei Radicanti"
    testo: "Archivista del Circolo di Velthar e voce dei Radicanti, mezzelfa anziana con il braccio sinistro di legnoscuro che pulsa col cuore. Incide la storia del Circolo su tavole di pietra, e sua è la tecnica che fa bere la Marea alle piante."

  - id: voren-manto-di-nebbia
    nome: Voren
    alias: [Manto di Nebbia]
    tipo: personaggio
    sottotitolo: "Druido dei Silenti"
    testo: "Druido dei Silenti detto Manto di Nebbia, una figura incappucciata che pochi sanno descrivere due volte allo stesso modo e che anche i druidi temono. Non parla, e quando serve manda un sussurro che arriva nella testa prima che nell'aria."

  - id: gualtiero-brenna
    nome: Gualtiero Brenna
    alias: [Brenna]
    tipo: personaggio
    sottotitolo: "Caposquadra dei taglialegna della Segheria"
    testo: "Caposquadra dei taglialegna della Segheria di Qir-Azel, un uomo largo con la barba bruciacchiata dalle braci. Conosce i boschi a nord della città e tiene il conto delle partite su un bastone a tacche che non presta a nessuno."

  - id: selara-vyn
    nome: Selara Vyn
    alias: [Selara]
    tipo: personaggio
    sottotitolo: "Guaritrice del Circolo di Velthar, una dei Quattro del Rito"
    testo: "Guaritrice del Circolo di Velthar dai capelli bianco-latte, una dei quattro che scesero nel Rito. Ne tornò con un bracciale di corteccia pietrificata che fa appassire quello che tocca, e nei villaggi la accolgono come una santa perché attenua le mutazioni leggere."
    requisiti: []
