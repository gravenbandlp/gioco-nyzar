# Glossario della quest del Circolo di Velthar: i personaggi che entrano nei testi del gioco con questa quest.
# Aelion, Tharn, Serha e Voren vengono dal Codex (personaggi/); Gualtiero Brenna è nuovo (il caposquadra della
# Segheria al passo 2). Presentazioni generali, senza i segreti della quest.
glossario:
  - id: aelion-farethil
    nome: Aelion Farethil
    alias: [Aelion]
    tipo: personaggio
    sottotitolo: "Maestro del Circolo di Velthar"
    testo: "Maestro del Circolo di Velthar, un elfo di almeno cent'anni con gli occhi argentei e le trecce intrecciate con strisce di corteccia. Presiede il Circolo Ristretto senza alzare la voce, e parla raramente, per immagini. Considera il Grande Albero Rosso una leggenda e rispetta la Madre del Velo come si rispetta un avversario capace."

  - id: tharn-koru
    nome: Tharn Koru
    alias: [Tharn]
    tipo: personaggio
    sottotitolo: "Cacciatore degli Irriducibili, al margine del Bosco"
    testo: "Cacciatore druidico degli Irriducibili dalla pelle cotta dal sole, con l'arco lungo a tracolla e due lupi grigi sempre al fianco. Era un cacciatore di Qir-Azel e ha lasciato la città dopo la tempesta di Marea del 133. Al margine del Bosco di Velthar è quasi sempre il primo a incontrare chi arriva, e prima di parlare guarda i lupi."

  - id: serha-duvain
    nome: Serha Duvain
    alias: [Serha]
    tipo: personaggio
    sottotitolo: "Archivista del Circolo, voce dei Radicanti"
    testo: "Archivista del Circolo di Velthar e voce dei Radicanti nel Circolo Ristretto. È una mezzelfa anziana che sta ancora dritta, con il braccio sinistro di legnoscuro, che pulsa al ritmo del cuore. Incide la storia del Circolo su tavole di pietra. Si deve a lei la tecnica che fa bere la Marea alle piante, e crede che il Mana vada capito come l'acqua."

  - id: voren-manto-di-nebbia
    nome: Voren
    alias: [Manto di Nebbia]
    tipo: personaggio
    sottotitolo: "Druido dei Silenti"
    testo: "Druido dei Silenti, chiamato Manto di Nebbia, una figura incappucciata che pochi sanno descrivere due volte allo stesso modo. Un tempo studiava il Mana con i Radicanti. Non parla, e quando è necessario manda un sussurro che arriva nella testa prima che nell'aria. Appare e scompare senza preavviso, e anche i druidi lo temono."

  - id: gualtiero-brenna
    nome: Gualtiero Brenna
    alias: [Brenna]
    tipo: personaggio
    sottotitolo: "Caposquadra dei taglialegna della Segheria"
    testo: "Caposquadra dei taglialegna della Segheria di Qir-Azel, un uomo largo con la barba bruciacchiata dalle braci dei bivacchi. Conosce i boschi del circondario a nord della città meglio delle sue tasche, e tiene il conto delle partite su un bastone a tacche che non presta a nessuno."

  - id: selara-vyn
    nome: Selara Vyn
    alias: [Selara]
    tipo: personaggio
    sottotitolo: "Guaritrice del Circolo di Velthar, una dei Quattro del Rito"
    testo: "Guaritrice del Circolo di Velthar dai capelli bianco-latte, una dei quattro che scesero nel Rito. Ne tornò con un bracciale di corteccia pietrificata che non si toglie più, e da allora fa appassire quello che tocca. Nei villaggi la accolgono come una santa, perché la sua presenza attenua le mutazioni leggere."
    requisiti: []
