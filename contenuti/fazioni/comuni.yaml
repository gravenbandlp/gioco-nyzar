# Le quest di fazione (ottobre 2026): le quality condivise fra più fazioni.
# Ogni fazione ha la sua cartella (contenuti/fazioni/<id>/) con la quest (pista fazione.<id>, 15 passi),
# la voce in `fazioni:` con i cinque gradi, le spedizioni, i nemici, gli oggetti e i personaggi nuovi.
# - bivio.legge: Caserma e Scuri si possono seguire insieme fino all'ottavo passo; al nono si sceglie.
#   1 = la Caserma, 2 = gli Scuri. Chi sceglie una delle due non va oltre l'ottavo passo dell'altra.
# - crepuscolo.indizi: quante tracce del Crepuscolo hai trovato (Velo, Caserma, Consiglio). Il nome non si dice mai
#   nel Capitolo I; il segno comune è la moneta con l'occhio chiuso.
# - segreto.ettore: sai dove passa le notti Ettore Castaldi (la Maison lo scopre al passo 4, il Consiglio lo usa).
# - seggio.malgrani: a chi va il seggio dei Malgrani dopo la caduta di Ottone (il Consiglio lo decide al passo 14):
#   1 alle cooperative, 2 alla Gilda, 3 all'erede in cambio del debito cancellato.
quality:
  - { id: bivio.legge, immagine: icone/crossroad, nome: La legge o la strada, categoria: stato, nascosta: true }
  - { id: crepuscolo.indizi, immagine: icone/semi-closed-eye, nome: L'occhio chiuso, categoria: stato, nascosta: true }
  - { id: segreto.ettore, nome: Le notti di Ettore Castaldi, categoria: stato, nascosta: true }
  - { id: seggio.malgrani, nome: Il seggio dei Malgrani, categoria: stato, nascosta: true }
