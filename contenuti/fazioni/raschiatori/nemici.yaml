# I nemici e gli scontri della quest dei Raschiatori, tarati sulla fase della storia in cui compaiono.
# - Atto I e II (passi 1-6, senza cancelli di trama): la sentinella del terzo pianerottolo e i sorveglianti della
#   Compagnia del Gancio come i nemici del prologo e della Città Bassa; le copie di corda e il custode delle file
#   della Gradinata Cieca un poco sopra.
# - Atto III (passi 7-9, dopo Acciaio e Ira): lo sciame di brina e il custode del Pozzo Senzanome come le macchine
#   delle rovine; Valdo Merlach al giudizio del Ferro come Galdrick nel duello (boss).
# - Atto IV e V (passi 10-15, dopo Capomozzo): le sonde e il pilota delle Carcasse di Korith come il Costruttore;
#   i nidi, le luci viandanti e le tre forme della Salvaguardia nel primo strato del Labirinto (boss finale).
nemici:
  - id: raschiatori-sentinella
    immagine: bestiario/salvaguardia-precursori
    nome: Sentinella del terzo pianerottolo
    descrizione: "Un guscio di metallo grande come un cane accucciato, incassato nella parete accanto a una vena di cristalli. Una luce gli gira sul dorso, e quando gira in fretta sputa scintille."
    attacco: 3
    difesa: 3
    difesaMentale: 4
    pf: 11
    danno: 3
    riduzione: 1
    iniziativa: 1

  - id: raschiatori-sorvegliante
    immagine: ambientazione/ghoran
    nome: Sorvegliante del Gancio
    descrizione: "Un uomo della Compagnia del Gancio, con il randello alla cintura e un gancio di ferro dipinto sulla manica. Picchia per abitudine, e smette quando conviene."
    attacco: 3
    difesa: 2
    difesaMentale: 2
    pf: 9
    danno: 2
    iniziativa: 2

  - id: raschiatori-copia-di-corda
    immagine: ambientazione/rovine-dei-precursori
    nome: Copia di corda e piombo
    descrizione: "Una figura alta come un Raschiatore, fatta di corde annodate e di pesi di piombo, con un gancio al posto di ogni mano. Ripete i gesti di chi è sceso prima di te."
    attacco: 3
    difesa: 3
    difesaMentale: 4
    pf: 8
    danno: 2
    riduzione: 2
    iniziativa: 2
    tratti: [eco]

  - id: raschiatori-custode-delle-file
    immagine: ambientazione/rovine-dei-precursori
    nome: Il custode delle file
    descrizione: "Una macchina lunga e sottile che cammina fra gli scaffali di tutto quello che è stato calato oltre l'ottavo gradino. Restituisce quello che gli chiedi a chi paga, e a chi non paga si prende lo stesso qualcosa."
    attacco: 4
    difesa: 3
    difesaMentale: 4
    pf: 12
    danno: 2
    riduzione: 3
    iniziativa: 2

  - id: raschiatori-sciame-di-brina
    immagine: ambientazione/marea-grigia
    nome: Sciame di brina
    descrizione: "Una nuvola di aghi di ghiaccio che si muove contro il vento e si posa dove c'è caldo. Dove si posa, la pelle diventa bianca."
    attacco: 4
    difesa: 3
    difesaMentale: 4
    pf: 12
    danno: 3
    riduzione: 3
    iniziativa: 3
    tratti: [eco]

  - id: raschiatori-custode-del-pozzo
    immagine: bestiario/salvaguardia-precursori
    nome: Il custode del Pozzo
    descrizione: "Una forma della Salvaguardia che nessuno aveva mai visto prima, piatta contro la roccia, con le zampe ripiegate sotto il ventre come una cicala. Tiene la cordata nella brina e la difende."
    attacco: 4
    difesa: 3
    difesaMentale: 5
    pf: 15
    danno: 3
    riduzione: 1
    iniziativa: 2

  - id: raschiatori-valdo-merlach
    immagine: fazioni/raschiatori
    nome: Valdo Merlach
    descrizione: "L'ex caposquadra di Dragna è un uomo asciutto con le mani di chi ha tirato corde per vent'anni. Combatte con l'ascia corta dei tunnel e non spreca un colpo."
    attacco: 5
    difesa: 4
    difesaMentale: 3
    pf: 15
    danno: 3
    riduzione: 4
    iniziativa: 3

  - id: raschiatori-sonda
    immagine: bestiario/salvaguardia-precursori
    nome: Sonda della stiva
    descrizione: "Un fuso di metallo che galleggia a mezz'aria con tre pale ripiegate. Si sveglia quando qualcuno tocca lo scafo, e misura chi lo ha toccato."
    attacco: 4
    difesa: 4
    difesaMentale: 5
    pf: 6
    danno: 3
    riduzione: 2
    iniziativa: 3

  - id: raschiatori-pilota
    immagine: bestiario/salvaguardia-precursori
    nome: Il pilota dello scafo
    descrizione: "Un corpo di metallo alto il doppio di un uomo, seduto al timone da prima che ci fosse Qir-Azel. Quando la Carta si accende si alza, e vuole riportare la nave dove andava."
    attacco: 5
    difesa: 4
    difesaMentale: 5
    pf: 14
    danno: 4
    riduzione: 4
    iniziativa: 2

  - id: raschiatori-macchina-dei-nidi
    immagine: bestiario/salvaguardia-precursori
    nome: Macchina dei nidi
    descrizione: "Una macchina della Salvaguardia nata in un nido del primo strato, più piccola di quelle delle rovine e più svelta. Si chiude sugli intrusi prima che abbiano finito di entrare."
    attacco: 5
    difesa: 4
    difesaMentale: 5
    pf: 8
    danno: 2
    riduzione: 1
    iniziativa: 3

  - id: raschiatori-luce-viandante
    immagine: ambientazione/regno-profondo
    nome: Luce viandante
    descrizione: "Una luce che imita il passo di chi cammina, un poco più avanti di te nel corridoio. Da vicino ha il freddo del vetro, e il bordo taglia come il vetro."
    attacco: 4
    difesa: 5
    difesaMentale: 3
    pf: 5
    danno: 3
    iniziativa: 4
    tratti: [eco]

  - id: raschiatori-ragno
    immagine: bestiario/salvaguardia-precursori
    nome: Il ragno della camera
    descrizione: "La prima forma della Salvaguardia nella camera dei quattro, sei zampe di metallo e un corpo basso come una cassa. Corre sui muri quanto sul pavimento."
    attacco: 5
    difesa: 4
    difesaMentale: 5
    pf: 8
    danno: 2
    riduzione: 1
    iniziativa: 3

  - id: raschiatori-busto-di-spine
    immagine: bestiario/salvaguardia-precursori
    nome: Il busto di spine
    descrizione: "La seconda forma, un torso senza gambe che si trascina sulle braccia, coperto di spine che si allungano quando colpisce. È lento, e quello che prende non lo lascia."
    attacco: 5
    difesa: 3
    difesaMentale: 5
    pf: 10
    danno: 3
    riduzione: 1
    iniziativa: 1

  - id: raschiatori-figura-ruotata
    immagine: bestiario/salvaguardia-precursori
    nome: La figura ruotata
    descrizione: "La terza forma è sottile come un'asta, con la testa girata all'indietro e le ginocchia piegate al contrario. Ti viene incontro di schiena, e colpisce prima che tu capisca da che parte."
    attacco: 5
    difesa: 5
    difesaMentale: 6
    pf: 7
    danno: 2
    iniziativa: 4

scontri:
  - { id: raschiatori-sentinella, nome: "La sentinella del terzo pianerottolo", nemici: [raschiatori-sentinella], feriteSconfitta: 2 }
  - { id: raschiatori-sorveglianti, nome: "I sorveglianti del Gancio", nemici: [raschiatori-sorvegliante, raschiatori-sorvegliante], feriteSconfitta: 2 }
  - { id: raschiatori-un-sorvegliante, nome: "Il sorvegliante della corda", nemici: [raschiatori-sorvegliante], feriteSconfitta: 2 }
  - { id: raschiatori-copie-di-corda, nome: "Le copie di corda e piombo", nemici: [raschiatori-copia-di-corda, raschiatori-copia-di-corda], feriteSconfitta: 2 }
  - { id: raschiatori-custode-delle-file, nome: "Il custode delle file", nemici: [raschiatori-custode-delle-file], feriteSconfitta: 3 }
  - { id: raschiatori-sciame-di-brina, nome: "Lo sciame di brina", nemici: [raschiatori-sciame-di-brina], feriteSconfitta: 2 }
  - { id: raschiatori-camera-del-gelo, nome: "La camera del gelo", nemici: [raschiatori-custode-del-pozzo, raschiatori-sciame-di-brina], feriteSconfitta: 3 }
  - { id: raschiatori-merlach, nome: "Il giudizio del Ferro", nemici: [raschiatori-valdo-merlach], feriteSconfitta: 3 }
  - { id: raschiatori-sonde, nome: "Le sonde della stiva", nemici: [raschiatori-sonda, raschiatori-sonda], feriteSconfitta: 2 }
  - { id: raschiatori-timone, nome: "Il pilota dello scafo", nemici: [raschiatori-pilota], feriteSconfitta: 4 }
  - { id: raschiatori-nidi, nome: "I nidi del primo strato", nemici: [raschiatori-macchina-dei-nidi, raschiatori-macchina-dei-nidi], feriteSconfitta: 3 }
  - { id: raschiatori-luci-viandanti, nome: "Le luci viandanti", nemici: [raschiatori-luce-viandante, raschiatori-luce-viandante], feriteSconfitta: 2 }
  - { id: raschiatori-camera-dei-quattro, nome: "La camera dei quattro", nemici: [raschiatori-ragno, raschiatori-busto-di-spine, raschiatori-figura-ruotata], feriteSconfitta: 4 }
