# Gli oggetti della quest dei Raschiatori e la formula precuriana che Argento ricava dalla Carta di Korith.
# Ricompense dei gradi: il bracciale dei turni (grado 1, passo 3), lo Scandaglio di cristallo (grado 2, passo 6),
# l'ascia da tunnel (grado 3, passo 9), la giubba del primo strato (grado 4, passo 12), il piccone della Fiamma
# (grado 5, oggetto unico di grado 4) e il bracciale di rame dei Quattro (grado 5, a chi prende il titolo).
# Reperti della trama: il Disco dei quattro segni (Gradinata Cieca) e la Carta di Korith (Carcasse di Korith),
# che si portano dietro e aprono opzioni come chiavi.
# La formula del Filo di ritorno (Formule precuriane, livello 2) si impara da Argento dal grado 4
# (ripetibili.yaml): cura il compagno più malconcio, la prima regola dei Raschiatori fatta incantesimo.
oggetti:
  - id: raschiatori-bracciale-dei-turni
    nome: Bracciale dei turni
    immagine: icone/bracer
    descrizione: "Cuoio grosso e una piastra di rame con un cristallo di campo, quello che ronza quando sale una folata dal fondo. Dragna lo dà a chi ha il nome a inchiostro sulla bacheca, e sui Ponti tutti sanno che cosa vuol dire."
    slot: accessorio
    grado: 1
    proprieta: { schermata: true }
    difetti: [riconoscibile]

  - id: raschiatori-scandaglio
    nome: Scandaglio di cristallo
    immagine: icone/crystal-eye
    descrizione: "Un cristallo lungo un dito, appeso a una catenella, che vibra quando sotto c'è un vuoto. Chi scende per primo lo porta al collo, e con lui davanti la squadra perde meno tempo all'ingresso."
    slot: accessorio
    grado: 2
    proprieta: { talento: { percezione: 1, atletica: 1 }, chiave: [scandaglio] }

  - id: raschiatori-ascia-da-tunnel
    nome: Ascia da tunnel
    immagine: icone/battered-axe
    descrizione: "Un'ascia da lavoro con il manico accorciato per i passaggi stretti, come quella di Dragna. Più ti fanno male, più la tieni corta, e più morde."
    slot: arma
    base: ascia-da-battaglia
    grado: 2
    dadi: 1
    proprieta: { ostinata: true }

  - id: raschiatori-giubba-del-primo-strato
    nome: Giubba del primo strato
    immagine: icone/leather-vest
    descrizione: "Cuoio cerato a doppio strato, con la fodera cucita di filo di rame contro la Marea. I veterani la ereditano più spesso di quanto la comprino."
    slot: armatura
    base: cuoio-rinforzato
    grado: 3
    dadi: 1
    proprieta: { schermata: true }

  - id: raschiatori-piccone-della-fiamma
    nome: Piccone della Fiamma
    immagine: icone/war-pick
    descrizione: "Un piccone da scavo con la testa di metallo dei Precursori, che non si è mai arrugginito. Le Fiamme se lo passano da una all'altra, e chi lo porta non lo vende e non lo presta."
    slot: arma
    base: martello-da-guerra
    grado: 4
    dadi: 2
    proprieta: { affilata: 1, penetrante: 1, ostinata: true }
    difetti: [legata]

  - id: raschiatori-bracciale-di-rame
    nome: Bracciale di rame dei Quattro
    immagine: icone/bracers
    descrizione: "Un bracciale di rame annerito con la fibbia di ferro, uguale a quelli che gli altri tre dei Quattro portano al polso. Si chiude al polso una volta, e da quel momento la testa resta fredda anche in fondo."
    slot: accessorio
    grado: 3
    proprieta: { lucida: true, talento: { resilienza: 1, atletica: 1 } }
    difetti: [legata]

  - id: raschiatori-disco-dei-quattro-segni
    nome: Disco dei quattro segni
    immagine: icone/metal-disc
    descrizione: "Un disco di metallo grigio grande come un palmo, tirato su da oltre l'ottavo gradino della Gradinata Cieca. Sopra è incisa una ruota di quattro figure in cerchio. Il buio sta in cima, poi vengono il ferro e l'argento, e in fondo c'è una fiamma."
    slot: nessuno
    proprieta: { chiave: [quattro-segni] }

  - id: raschiatori-carta-di-korith
    nome: Carta di Korith
    immagine: icone/treasure-map
    descrizione: "Una lastra sottile di vetro scuro, presa dalla sala delle carte di uno scafo sepolto. Quando la scaldi in mano mostra il primo strato del Labirinto in quattro disposizioni che si danno il cambio."
    slot: nessuno
    proprieta: { chiave: [korith] }

incantesimi:
  - id: raschiatori-filo-di-ritorno
    nome: Filo di ritorno
    tradizione: precuriane
    livello: 2
    uso: [combattimento, storie]
    immagine: icone/rope-coil
    descrizione: "Argento l'ha letta in un angolo della Carta di Korith, accanto alle quattro disposizioni. Tira verso di te il compagno più malconcio e gli rende tanti PF quanti successi fai. Nelle storie apre la via per riportare su chi è rimasto indietro. Ogni lancio costa mezza tacca di Tormento."
    tipo: cura
    alleati: true
    prezzo: { tormento: 0.5 }
