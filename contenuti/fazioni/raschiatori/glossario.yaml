# Le voci del glossario per i personaggi nuovi della quest dei Raschiatori, nel formato di
# contenuti/glossario/personaggi.yaml: presentazioni stabili, senza segreti. Le varianti dello stesso nome si
# distinguono per i requisiti (vale la prima soddisfatta).
# - Argento è un nome del Codex, nuovo nel gioco; la voce si accende dal terzo passo, perché la parola compare
#   anche come metallo a inizio frase in altri testi.
# - Nella si cerca nella forma «Nella di Ghoran»: «Nella» da sola è anche una preposizione.
# - Gerardo Crine si cerca per nome intero o per cognome («Gerardo» c'è già, Gerardo Vennari); Mirta Sorrin solo per
#   nome intero (una Mirta compare nel villaggio storto).
glossario:
  - id: gerardo-crine
    nome: Gerardo Crine
    alias: [Crine]
    tipo: personaggio
    sottotitolo: "Caposquadra dei Raschiatori"
    testo: "Caposquadra veterano dei Raschiatori, sui cinquant'anni, con la barba tagliata a colpi di coltello e un pollice sempre fasciato nella tela cerata. Dopo la razzia la sua squadra è scesa a quattro. Prima di ogni cosa dice a tutti di respirare col naso, sacche di Marea comprese, e prova una stretta di mano come si prova un nodo."
    requisiti: []

  - id: valdo-merlach
    nome: Valdo Merlach
    alias: [Merlach]
    tipo: personaggio
    sottotitolo: "Capo della Compagnia del Gancio"
    testo: "Ex caposquadra di Dragna Gro-Malog, che lo buttò fuori dal Grifone di Ferro il giorno in cui ci entrò con uno schiavo al seguito. Adesso guida la Compagnia del Gancio. È alto e asciutto, parla a voce bassa e piana, e tiene i conti a matita su un quaderno che non lascia mai."
    requisiti: [raschiatori.merlach == 0]

  - id: valdo-merlach-nel-registro
    nome: Valdo Merlach
    alias: [Merlach]
    tipo: personaggio
    sottotitolo: "Ex capo della Compagnia del Gancio"
    testo: "Ex caposquadra di Dragna Gro-Malog e capo della Compagnia del Gancio. Al giudizio del Ferro, nel cortile della Caserma, lo sceriffo Galdrick ha scritto il suo nome nel registro dei mercanti di schiavi, e a Qir-Azel non può più comprare né vendere niente."
    requisiti: [raschiatori.merlach == 1]

  - id: valdo-merlach-libero
    nome: Valdo Merlach
    alias: [Merlach]
    tipo: personaggio
    sottotitolo: "Capo della Compagnia del Gancio"
    testo: "Ex caposquadra di Dragna Gro-Malog e capo della Compagnia del Gancio. Dal giudizio del Ferro è uscito libero, con la paga dei salvati del Pozzo in tasca, e ha ripreso la strada per Ghoran. Parla a voce bassa e piana, e i suoi conti li tiene a matita."
    requisiti: [raschiatori.merlach == 2]

  - id: compagnia-del-gancio
    nome: Compagnia del Gancio
    alias: [Gancio]
    tipo: fazione
    sottotitolo: "Compagnia di scavo a contratto"
    testo: "Compagnia di scavo di Valdo Merlach, con un contratto della Gilda dei Mercanti per la cartografia del sottosuolo. I suoi uomini portano un gancio di ferro dipinto sulla manica. Scende dove i turni dei Raschiatori non arrivano, e per farlo cala nei pozzi schiavi comprati a Ghoran, legati in cordata."
    requisiti: []

  - id: nella-di-ghoran
    nome: Nella di Ghoran
    tipo: personaggio
    sottotitolo: "Legata della Compagnia del Gancio"
    testo: "Ragazza di Ghoran comprata dalla Compagnia del Gancio e tenuta legata nel campo sopra il Pozzo Senzanome, con i capelli rasati e le mani screpolate. Ha un fratello nella cordata che il Gancio ha calato nel pozzo. Parla con le mani, nella lingua dei legati del mercato di Ghoran."
    requisiti: [raschiatori.nella <= 1]

  - id: nella-di-ghoran-raschiatrice
    nome: Nella di Ghoran
    tipo: personaggio
    sottotitolo: "Raschiatrice, della tua squadra"
    testo: "Ragazza di Ghoran che la Compagnia del Gancio teneva legata sopra il Pozzo Senzanome. Dopo il giudizio del Ferro è entrata nei Raschiatori da libera, e ha scelto la tua squadra. Scende seconda nella fila, ripete le regole del turno a mezza voce e conta le teste due volte."
    requisiti: [raschiatori.nella >= 2]

  - id: mirta-sorrin
    nome: Mirta Sorrin
    tipo: personaggio
    sottotitolo: "La Fiamma dei Raschiatori"
    testo: "L'ultima a portare il titolo di Fiamma fra i Quattro dei Raschiatori. In primavera è scesa nel primo strato del Labirinto senza risalire, e la sua lanterna è la più nuova del Ponte dei Morti. Al tavolo dei Quattro, al Grifone di Ferro, nessuno si siede sulla sua sedia."
    requisiti: []

  - id: argento
    nome: Argento
    tipo: personaggio
    sottotitolo: "Il tesoriere dei Raschiatori"
    testo: "Uno dei Quattro dei Raschiatori, che tiene i conti della corporazione e i rapporti con la Gilda dei Mercanti. È un nano anziano con la barba argentata intrecciata di schegge di vetro e una gamba di legno, e cammina con un bastone di cristallo che si accende quando lo posa. Un tempo combatteva; adesso conta, e i suoi conti non hanno mai truffato un Raschiatore."
    requisiti: [fazione.raschiatori >= 3]
