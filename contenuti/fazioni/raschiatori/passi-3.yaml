# La quest dei Raschiatori, fine dell'Atto IV e Atto V (fazione.raschiatori 11 → 15).
# - 11 → 12 `raschiatori-la-cripta-e-la-chiave` (Cattedrale, grado 4, Veterano): Ottilia Sanvel e il registro
#   dell'accesso del 130, firmato dai Raschiatori. Il Quarto del Rito non ha nome ma ha un titolo, Fiamma.
#   raschiatori.velo: 1 copia della Carta ceduta al Velo (rep.velo +1), 2 registro copiato di nascosto
#   (Sospetto), 3 Ottilia convinta. La formula del Filo di ritorno e la branda dei Quattro stanno in
#   ripetibili.yaml e si aprono con questo grado.
# - 12 → 13 `raschiatori-la-lanterna-nera` (Ponte dei Morti, pista.capomozzo >= 10, l'Arena non in corso perché
#   Dragna combatte nella finale): la lanterna nera che si accende da sola, la data 130 e il titolo. I Quattro
#   scendono nel primo strato, e il passo 14 è la spedizione (spedizione-primo-strato.yaml).
# - 14 → 15 `raschiatori-fiamma` (Grifone) e il seguito `raschiatori-una-lanterna-per-nome` (Ponte dei Morti,
#   grado 5, Fiamma): accettare il titolo (raschiatori.fiamma 1: piccone della Fiamma, bracciale di rame dei
#   Quattro, la borsa) o rifiutarlo proponendo Nella o Pio Varre (raschiatori.fiamma 2, Lanterna dei Quattro: il
#   piccone, una borsa più pesante e la gente dei Ponti). La lanterna nera si spegne, e nessuno sa se è un saluto
#   o una sostituzione.
storylet:
  # ------------------------------------------------------------ 11 → 12 · la Cripta e la chiave (grado 4)
  - id: raschiatori-la-cripta-e-la-chiave
    presso: cattedrale-del-velo
    immagine: personaggi/ottilia-sanvel
    titolo: La Cripta e la chiave
    sommario: "Per scendere dove indica la Carta di Korith serve il permesso del Velo. Ottilia Sanvel sa che negli archivi minori c'è un registro firmato dai Raschiatori nel 130."
    luogo: Cattedrale del Velo, gli archivi minori sopra la Cripta
    area: quartieri-alti
    requisiti: [fazione.raschiatori == 11]
    testo: |
      Gli archivi minori della Cattedrale stanno in un corridoio basso sopra
      la Cripta, con le scansie di legno nero che arrivano al soffitto e
      l'odore di cera vecchia e di carta umida. Ottilia Sanvel ti aspetta
      alla porta. È bassa e robusta, con i capelli corti e gli occhi grigi
      che tendono al verde, e tiene le mani incrociate davanti al grembiule
      come se le avesse appena lavate.

      Tenebra è rimasto sulla scala, tre gradini più su, con la bruciatura
      che luccica alla luce delle candele. Del Velo diffida da sempre, e lo
      dice senza dirlo, restando dove sta.

      «Vuoi il permesso di scendere dove indica la vostra carta» dice
      Ottilia. Parla in frasi brevi e senza aggettivi grandi. «E vuoi il
      registro del 130. È qui. Lo firmarono i Raschiatori che tenevano
      l'accesso alla Strada Antica la notte del Rito.» Si volta appena verso
      la terza scansia, poi torna a guardarti.

      {empatia Media} Il registro lo conosce bene. Ha passato più di una
      notte a leggerlo da sola, e non ha mai detto a nessuno che cosa ci ha
      trovato.

      {accademiche Facile} Nel 130 i Portatori scesero al Santuario delle
      Maschere per il Rito, e uno di loro non tornò. Le cronache lo chiamano
      il Quarto, perché il nome non l'hanno mai scritto.

      Ottilia portava l'acqua a Mirn il Sordo, nella sua cella, quando
      ripeteva frasi in una lingua che nessuno capiva. Lo racconta lei, senza
      che tu glielo chieda, e ti guarda per vedere che faccia fai. *Vuole
      sapere se sono venuto a prendere o a dare.*

      {origine accolito-del-velo} La terza scansia la conosci, perché da
      novizio ci spolveravi i registri che non ti era permesso aprire. Le
      dita ti ricordano anche il cassetto basso, quello che si apre tirando
      verso l'alto.
    opzioni:
      - testo: "Cedere al Velo una copia della Carta"
        descrizione: "Il Velo vuole sapere dove porta la Carta. Una copia in cambio del permesso e del registro, e Tenebra sulla scala lo vedrà."
        esito:
          titolo: La copia
          testo: |
            Ricopi la Carta di Korith su una lastra di cera che Ottilia ti
            porge, linea per linea, mentre Tenebra guarda dalla scala senza
            dire niente. Ottilia ti dà il permesso scritto e il registro. Il Ferro di allora ha scritto su quella pagina i nomi dei Raschiatori di guardia all'accesso, e sotto *il Quarto*, e accanto, al posto del nome, un titolo nella stessa grafia, *Fiamma*.

            Sulla scala incroci la Madre del Velo che scende verso la Cripta.
            Si ferma un momento, guarda il registro che hai in mano e ti dice
            soltanto che i nomi passano e le fasi restano. Al Grifone Tenebra ti
            passa accanto senza guardarti, e Argento ti mette sulle spalle una
            giubba di cuoio cerato con la fodera di rame.
          pe: { resilienza: 5 }
          almeno: { rep.raschiatori: 8 }
          imposta: { raschiatori.velo: 1 }
          effetti: { fazione.raschiatori: 1, monete: 120, oggetto.raschiatori-giubba-del-primo-strato: 1, rep.velo: 1 }
      - testo: "Copiare il registro di nascosto"
        descrizione: "Ottilia deve scendere in Cripta per l'ufficio della sera. La terza scansia resta sola per il tempo di una preghiera."
        prova: { attributo: mentale, abilita: furtivita, difficolta: Difficile }
        successo:
          titolo: Il tempo di una preghiera
          testo: |
            Quando Ottilia scende per l'ufficio della sera apri il registro alla
            pagina del 130 e la ricopi in fretta, con la mano che ti suda. Il
            Ferro di allora ha scritto i nomi dei Raschiatori di guardia
            all'accesso e, sotto, *il Quarto*, e accanto, al posto del nome, un titolo, *Fiamma*. Rimetti il registro al suo posto un momento prima
            che la porta si riapra.

            Sulla scala incroci la Madre del Velo, che ti guarda le mani sporche
            d'inchiostro e ti dice soltanto che i nomi passano e le fasi
            restano. Il permesso di scendere lo scrive lei, senza chiederti
            niente. Al Grifone Argento ti mette sulle spalle una giubba di cuoio
            cerato con la fodera di rame.
          pe: { resilienza: 5 }
          almeno: { rep.raschiatori: 8 }
          imposta: { raschiatori.velo: 2 }
          effetti: { fazione.raschiatori: 1, monete: 120, oggetto.raschiatori-giubba-del-primo-strato: 1, sospetto: 1.5 }
        fallimento:
          titolo: La mano sulla pagina
          testo: |
            Stai ricopiando la pagina del 130 quando una mano ti si posa sul
            foglio. Ottilia non alza la voce. Ti legge lei la riga che cercavi,
            perché è meglio che tu la sappia da lei, dice, che da un furto. Il
            Ferro di allora ha scritto *il Quarto*, e accanto, al posto del nome, un titolo, *Fiamma*.

            Sulla scala incroci la Madre del Velo, che ti dice soltanto che i
            nomi passano e le fasi restano, e ti firma il permesso con una
            freddezza nuova. Al Grifone Argento ti mette sulle spalle una giubba
            di cuoio cerato con la fodera di rame.
          pe: { resilienza: 5 }
          almeno: { rep.raschiatori: 8 }
          imposta: { raschiatori.velo: 3 }
          effetti: { fazione.raschiatori: 1, monete: 120, oggetto.raschiatori-giubba-del-primo-strato: 1, sospetto: 1.5, rep.velo: -1 }
      - testo: "Convincere Ottilia a leggerti la pagina"
        descrizione: "Ha portato l'acqua a Mirn il Sordo. Sa che cosa succede ai Raschiatori che scendono troppo, e forse vuole che qualcuno lo sappia prima."
        prova: { attributo: sociale, abilita: empatia, difficolta: Media }
        successo:
          titolo: L'acqua di Mirn
          testo: |
            Le chiedi di Mirn invece che del registro, e lei te ne parla a
            lungo, in frasi brevi, guardando la scansia. Poi la apre da sola e ti
            legge la pagina del 130. Il Ferro di allora ha scritto i nomi dei
            Raschiatori di guardia all'accesso e, sotto, *il Quarto*, e accanto, al posto del nome, un titolo, *Fiamma*. Ti firma il permesso senza
            chiederti niente in cambio.

            Sulla scala incroci la Madre del Velo, che ti dice soltanto che i
            nomi passano e le fasi restano. Al Grifone Argento ti mette sulle
            spalle una giubba di cuoio cerato con la fodera di rame.
          pe: { empatia: 3, resilienza: 5 }
          almeno: { rep.raschiatori: 8 }
          imposta: { raschiatori.velo: 3 }
          effetti: { fazione.raschiatori: 1, monete: 120, oggetto.raschiatori-giubba-del-primo-strato: 1, rep.velo: 0.5 }
        fallimento:
          titolo: Il prezzo del Velo
          testo: |
            Le parli di Mirn, e lei ti ascolta con le mani incrociate senza
            cambiare faccia. Alla fine ti dice che il Velo il registro lo
            mostra, ma in cambio di una copia della carta. Gliela fai su una
            lastra di cera, con Tenebra che guarda dalla scala. Il Ferro di allora ha scritto *il Quarto*, e accanto, al posto del nome, un titolo, *Fiamma*.

            Sulla scala incroci la Madre del Velo, che ti dice soltanto che i
            nomi passano e le fasi restano. Al Grifone Tenebra ti passa accanto
            senza guardarti, e Argento ti mette sulle spalle una giubba di cuoio
            cerato con la fodera di rame.
          pe: { resilienza: 5 }
          almeno: { rep.raschiatori: 8 }
          imposta: { raschiatori.velo: 1 }
          effetti: { fazione.raschiatori: 1, monete: 120, oggetto.raschiatori-giubba-del-primo-strato: 1, rep.velo: 1, scandalo: 0.5 }
      - testo: "Leggere la memoria della scansia con l'Eco"
        descrizione: "La scansia ricorda chi ha aperto quel registro, e quante volte. La formula precuriana lo chiede alla scansia invece che a Ottilia."
        incantesimo: eco
        prova: { attributo: mentale, abilita: magia, difficolta: Media }
        successo:
          titolo: Le mani sulla scansia
          testo: |
            Dici la formula con la mano sul legno, e la scansia ti restituisce
            le mani che l'hanno aperta, una sopra l'altra come fogli. Le ultime
            sono quelle di Ottilia, molte volte, di notte. La più vecchia è una
            mano con otto dita, che ha scritto sul registro *il Quarto* e
            accanto, invece di un nome, *Fiamma*. Ottilia ti guarda togliere la
            mano dal legno, e ti firma il permesso.

            Sulla scala incroci la Madre del Velo, che ti dice soltanto che i
            nomi passano e le fasi restano. Al Grifone Argento ti mette sulle
            spalle una giubba di cuoio cerato con la fodera di rame.
          pe: { magia: 5 }
          almeno: { rep.raschiatori: 8 }
          imposta: { raschiatori.velo: 3 }
          effetti: { fazione.raschiatori: 1, monete: 120, oggetto.raschiatori-giubba-del-primo-strato: 1, rep.velo: 0.5 }
        fallimento:
          titolo: Troppe mani
          testo: |
            La scansia ti restituisce cento mani insieme, e ti si chiudono tutte
            sul polso. Quando riesci a staccarti Ottilia ti tiene per la spalla,
            e ti legge lei la pagina del 130. Il Ferro di allora ha scritto *il
            Quarto*, e accanto, al posto del nome, un titolo, *Fiamma*. Il permesso
            te lo firma in cambio di una copia della carta.

            Sulla scala incroci la Madre del Velo, che ti dice soltanto che i
            nomi passano e le fasi restano. Al Grifone Argento ti mette sulle
            spalle una giubba di cuoio cerato con la fodera di rame.
          pe: { resilienza: 5 }
          almeno: { rep.raschiatori: 8 }
          imposta: { raschiatori.velo: 1 }
          effetti: { fazione.raschiatori: 1, monete: 120, oggetto.raschiatori-giubba-del-primo-strato: 1, rep.velo: 1, tormento: 0.5 }
      - testo: "Aprire il cassetto basso della terza scansia"
        descrizione: "Da novizio ci spolveravi i registri che non ti era permesso aprire. Il cassetto si apre tirando verso l'alto, e Ottilia lo sa che lo sai."
        quando: [origine.accolito-del-velo >= 1]
        esito:
          titolo: Il cassetto basso
          testo: |
            Ti inginocchi davanti alla terza scansia e apri il cassetto basso
            tirando verso l'alto, come ti hanno insegnato a non fare. Ottilia
            non ti ferma. Il registro del 130 è lì, e sulla pagina il Ferro di
            allora ha scritto *il Quarto*, e accanto, al posto del nome, un titolo, *Fiamma*. Ottilia ti firma il permesso dicendo che un novizio che
            ricorda i cassetti è un novizio che ha fatto bene il suo lavoro.

            Sulla scala incroci la Madre del Velo, che ti dice soltanto che i
            nomi passano e le fasi restano. Al Grifone Argento ti mette sulle
            spalle una giubba di cuoio cerato con la fodera di rame.
          pe: { accademiche: 3, resilienza: 5 }
          almeno: { rep.raschiatori: 8 }
          imposta: { raschiatori.velo: 3 }
          effetti: { fazione.raschiatori: 1, monete: 120, oggetto.raschiatori-giubba-del-primo-strato: 1, rep.velo: 0.5 }

  # ------------------------------------------------------------ 12 → 13 · la lanterna nera
  - id: raschiatori-la-lanterna-nera
    presso: ponte-dei-morti
    immagine: ambientazione/ponte-dei-morti
    titolo: La lanterna nera
    sommario: "Dalla caduta del Costruttore la lanterna nera in fondo al Ponte dei Morti batte più in fretta. Da qualche sera quella di Mirta Sorrin batte allo stesso tempo."
    luogo: Ponte dei Morti, in fondo, dopo la seconda campana
    area: ponti-sospesi
    requisiti: [fazione.raschiatori == 12, pista.capomozzo >= 10, pista.arena != 1, pista.arena != 2, pista.arena != 3, pista.arena != 4]
    testo: |
      In fondo al Ponte dei Morti, dopo la seconda campana, c'è una lanterna
      di ferro nero quasi senza vetro, l'ultima della fila. Nessuna squadra
      la cura, e si accende da sola. Da quando il Costruttore è caduto sotto
      Capomozzo la sua luce batte più in fretta, a colpi, come un polso. E
      da qualche sera la lanterna di Mirta Sorrin, la più nuova del Ponte,
      quella della Fiamma rimasta di sotto in primavera, batte allo stesso tempo.

      Dragna è venuta con la scala a pioli e con Argento, che si appoggia al
      parapetto per riposare la gamba. Sale tre pioli, slaccia la lanterna
      nera dal suo gancio e la porta giù tenendola lontana dal corpo, con le
      otto dita. Argento ti dice a mezza voce, guardando lei, che in nove anni quella lanterna Dragna non l'ha mai toccata.

      {acrobazia Facile} La scala balla sulle assi bagnate a ogni folata.
      Dragna ci sale come sulle scale di casa, con il peso tutto sulle punte
      e l'ascia sulla schiena che non sbatte nemmeno.

      {percezione Media} Sotto la ruggine, sulla porticina della lanterna,
      ci sono segni incisi con la punta di un coltello. Sono vecchi, e la
      ruggine li ha mangiati a metà.

      {empatia Media} Dragna ha le mani ferme e la mascella dura. Della
      lanterna non ha paura, ha paura di quello che ci leggerai sopra, e di
      quello che vorrai fare dopo.

      La posa sulle assi in mezzo a voi e resta accucciata accanto.
      Sopra di voi le lanterne dei dispersi dondolano al vento della
      Cicatrice. *Il Quarto del 130, e una lanterna che si accende da sola.*
      La luce nera ti batte negli occhi allo stesso tempo del cuore.

      {origine apprendista-raschiatore} Le lanterne del tratto in fondo le hai contate tante volte alle veglie, e quella nera l'hai sempre
      saltata nel conto senza sapere perché. Adesso che è sulle assi ti
      accorgi di averla sempre contata lo stesso, in silenzio, per ultima.
    opzioni:
      - testo: "Leggere quello che c'è sotto la ruggine"
        descrizione: "I segni sono mangiati a metà. Con la Carta in tasca e le dita leggere, la porticina dice ancora qualcosa."
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Media }
        successo:
          titolo: La porticina
          testo: |
            Gratti la ruggine con l'unghia, un segno alla volta, e la porticina
            ti restituisce una data e una parola. C'è scritto *130*, e sotto,
            con la stessa mano, *Fiamma*. Dragna chiude gli occhi per un momento.
            Poi riappende la lanterna al suo gancio e dice che i Quattro
            scenderanno nel primo strato, al punto della Carta dove si apre la
            fase della Fiamma.

            In tre più te, dice, come si è sempre fatto. Argento resterà all'argano, perché con la gamba non scende più, mentre Tenebra scenderà con voi fino in fondo.
          pe: { tecnologia: 3, empatia: 3 }
          effetti: { fazione.raschiatori: 1, rep.raschiatori: 1 }
        fallimento:
          titolo: La ruggine
          testo: |
            Gratti la ruggine, e la ruggine si porta via con sé metà dei segni.
            Restano una data, *130*, e l'inizio di una parola che Dragna finisce per te senza guardarla, perché la sa già. Dice *Fiamma*. Poi
            riappende la lanterna e dice che i Quattro scenderanno nel primo strato, al punto della Carta dove si apre la fase della Fiamma.

            In tre più te, dice, come si è sempre fatto. Argento resterà all'argano, perché con la gamba non scende più, mentre Tenebra scenderà con voi fino in fondo.
          pe: { empatia: 3 }
          effetti: { fazione.raschiatori: 1, tormento: 1 }
      - testo: "Leggerla con lo Scandaglio"
        descrizione: "Il cristallo vibra dove sotto c'è un vuoto, e i segni incisi sono vuoti sotto la ruggine."
        requisiti: [chiave.scandaglio >= 1]
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Facile }
        successo:
          titolo: Il vuoto dei segni
          testo: |
            Passi lo Scandaglio sulla porticina, e il cristallo vibra dove la
            ruggine copre i solchi. Li segui con il dito, e leggi una data e una
            parola, *130* e sotto *Fiamma*, con la stessa mano. Dragna riappende
            la lanterna e dice che i Quattro scenderanno nel primo strato, al punto della Carta dove si apre la fase della Fiamma.

            In tre più te, dice, come si è sempre fatto. Argento resterà all'argano, perché con la gamba non scende più, mentre Tenebra scenderà con voi fino in fondo.
          pe: { tecnologia: 3, empatia: 3 }
          effetti: { fazione.raschiatori: 1, rep.raschiatori: 1 }
        fallimento:
          titolo: Il cristallo muto
          testo: |
            Lo Scandaglio vibra su tutta la porticina allo stesso modo, e i
            segni restano sotto la ruggine. Dragna te lo toglie di mano e te lo
            rimette al collo. La parola la dice lei, *Fiamma*, insieme alla
            data, *130*, e poi riappende la lanterna e dice che i Quattro
            scenderanno nel primo strato, là dove si apre la fase della Fiamma.

            In tre più te, dice, come si è sempre fatto. Argento resterà all'argano, perché con la gamba non scende più, mentre Tenebra scenderà con voi fino in fondo.
          pe: { empatia: 3 }
          effetti: { fazione.raschiatori: 1, tormento: 1 }
      - testo: "Chiedere a Dragna perché non vuole che tu scenda dove sono scese le Fiamme"
        descrizione: "Ti ha tenuto fuori da quel posto da quando sei arrivato. Adesso la lanterna è sulle assi, e una risposta forse c'è."
        prova: { attributo: sociale, abilita: empatia, difficolta: Media }
        successo:
          titolo: Vent'anni fa
          testo: |
            Glielo chiedi piano, e lei per un poco non risponde. Poi ti dice che
            vent'anni fa, quando ancora non portava il titolo di Ferro, qualcuno
            ha tenuto lei lontana da un posto come questo senza spiegarle
            perché, e che lei non ha mai capito se doveva essergli grata.
            Riappende la lanterna. Sulla porticina, sotto la ruggine, ci sono una
            data, *130*, e un titolo, *Fiamma*, e lei lo sa da nove anni.

            I Quattro scenderanno nel primo strato, al punto della Carta dove
            si apre la fase della Fiamma, in tre più te. Argento resterà all'argano, mentre Tenebra scenderà con voi.
          pe: { empatia: 5 }
          effetti: { fazione.raschiatori: 1, rep.raschiatori: 1 }
        fallimento:
          titolo: Il muro
          testo: |
            Glielo chiedi, e Dragna ti risponde con un'occhiata che chiude il
            discorso. Riappende la lanterna. Argento sospira e ti dice lui
            quello che c'è sulla porticina sotto la ruggine, una data, *130*, e
            un titolo, *Fiamma*. Poi Dragna dice che i Quattro scenderanno nel primo strato, al punto della Carta dove si apre la fase della
            Fiamma.

            In tre più te, dice, come si è sempre fatto. Argento resterà all'argano, perché con la gamba non scende più, mentre Tenebra scenderà con voi fino in fondo.
          pe: { empatia: 3 }
          effetti: { fazione.raschiatori: 1, tormento: 1 }
      - testo: "Contare la lanterna nera come la contavi alle veglie"
        descrizione: "Alle veglie l'hai sempre contata per ultima, in silenzio. Le dita sanno dove sta il vetro che manca, e dove la ruggine è più sottile."
        quando: [origine.apprendista-raschiatore >= 1]
        esito:
          titolo: L'ultima del conto
          testo: |
            Passi le dita sulla porticina come quando alle veglie contavi le
            lanterne della fila al buio, e la ruggine sotto i polpastrelli si
            stacca dove è più sottile. Sotto ci sono una data, *130*, e un
            titolo, *Fiamma*. Dragna ti guarda le mani e poi riappende la
            lanterna, e dice che i Quattro scenderanno nel primo strato, al
            punto della Carta dove si apre la fase della Fiamma.

            In tre più te, dice, come si è sempre fatto. Argento resterà
            all'argano, perché con la gamba non scende più, mentre Tenebra
            scenderà con voi fino in fondo.
          pe: { percezione: 3, empatia: 3 }
          effetti: { fazione.raschiatori: 1, rep.raschiatori: 1 }
      - testo: "Lasciare che la porticina la legga Argento"
        descrizione: "Argento ha letto più registri di chiunque al Grifone, e la ruggine non lo spaventa. Ci mette tutta la notte."
        costo: 2
        esito:
          titolo: La notte di Argento
          testo: |
            Argento si siede sulle assi con la lanterna in grembo e la gratta
            con la punta di un chiodo, piano, per tutta la notte, mentre tu gli
            tieni la lampada e Dragna fuma sul parapetto senza voltarsi. All'alba
            ti fa vedere quello che c'è sotto la ruggine, una data, *130*, e un
            titolo, *Fiamma*. Dragna riappende la lanterna e dice che i Quattro
            scenderanno nel primo strato, al punto della Carta dove si apre la
            fase della Fiamma.

            In tre più te, dice, come si è sempre fatto. Argento resterà
            all'argano, perché con la gamba non scende più, mentre Tenebra
            scenderà con voi fino in fondo.
          pe: { empatia: 3 }
          effetti: { fazione.raschiatori: 1, tormento: 1 }
      - testo: "Ricordarle la sera della piastrina di Dorr"
        descrizione: "Le hai riportato la piastrina di Arelan Dorr, e lei ha scritto l'ora del suo rientro sul registro, dopo quarant'anni. Quella sera ha parlato."
        quando: [rovine.dorr == 2]
        esito:
          titolo: L'ora del rientro
          testo: |
            Le ricordi la sera in cui ha scritto sul registro l'ora del rientro di Arelan Dorr con quarant'anni di ritardo, e lei si siede sulle assi accanto
            alla lanterna. Ti dice che le lanterne dei dispersi si accendono da
            sole quando qualcuno è risalito senza dirlo, e che quella nera si è
            accesa da sola la prima volta nel 130. Sulla porticina ci sono la
            data e un titolo, *Fiamma*.

            I Quattro scenderanno nel primo strato, al punto della Carta dove
            si apre la fase della Fiamma, in tre più te. Argento resterà all'argano, mentre Tenebra scenderà con voi.
          pe: { empatia: 5 }
          effetti: { fazione.raschiatori: 1, rep.raschiatori: 1 }
      - testo: "Chiedere a Stoppino che cosa ha visto dentro"
        descrizione: "Il bambino che accende le lanterne in fondo al ponte ci ha guardato dentro una volta, e da allora ci passa alla larga."
        quando: [origine.figlio-della-citta-bassa >= 1, ponti.lanterne >= 1]
        esito:
          titolo: Quello che ha visto Stoppino
          testo: |
            Stoppino è seduto sul parapetto con le gambe sopra il vuoto, e
            quando lo chiami viene, piano. Dice che dentro la lanterna nera non
            c'è un cristallo, c'è una luce senza niente intorno, e che una volta
            lo ha guardato. Dragna gli mette una mano sulla testa. Sulla
            porticina ci sono una data, *130*, e un titolo, *Fiamma*.

            I Quattro scenderanno nel primo strato, al punto della Carta dove
            si apre la fase della Fiamma, in tre più te. Argento resterà all'argano, mentre Tenebra scenderà con voi.
          pe: { empatia: 5 }
          effetti: { fazione.raschiatori: 1, rep.raschiatori: 1 }

  # ------------------------------------------------------------ 14 → 15 · Fiamma (grado 5)
  - id: raschiatori-fiamma
    presso: grifone-di-ferro
    immagine: personaggi/tenebra
    titolo: Fiamma
    sommario: "I Quattro sono tre, e in fondo si scende in quattro. Al Grifone Tenebra ti offre il titolo davanti a tutta la sala."
    luogo: Locanda del Grifone di Ferro, la sala piena
    area: ponti-sospesi
    requisiti: [fazione.raschiatori == 14, raschiatori.fiamma == 0]
    testo: |
      Il Grifone è pieno come la sera del Festival, e nessuno beve. Le squadre
      stanno in piedi fra i tavoli con i boccali pieni in mano, e Brunella ha
      smesso di girare con la zuppa e sta appoggiata al bancone con lo
      straccio sulla spalla. Al tavolo dei Quattro, vicino alla finestra, la
      sedia di Fiamma è stata tirata fuori dal tavolo di un palmo.

      Tenebra si alza. Parla a voce bassa come sempre, e la sala si fa zitta per sentirlo. Dice che i Quattro sono tre dalla primavera, e che
      in fondo si scende in quattro, e che c'è chi è sceso con loro nel primo
      strato ed è tornato su con il bracciale di Mirta Sorrin. Poi indica la
      sedia, a te, davanti a tutti.

      {intimidire Media} Tenebra non ti sta chiedendo niente. Ti sta dando una cosa che poi nessuno potrà riprendersi, e lo sa.

      Dragna non si muove. Ha il boccale fra le mani e guarda il legno del
      tavolo, la mascella stretta. Argento invece guarda te, con il bastone
      di cristallo acceso appoggiato al tavolo, e aspetta di sentire se dirai
      quello che hai capito nella Cripta e sulla Carta.

      {politica-ed-economia Difficile} Un titolo che passa da uno all'altro
      senza mai restare vuoto non è un titolo di mestiere. Argento l'ha
      capito sulla Carta, e Tenebra forse l'ha sempre saputo.

      {resistenza Media fallita} Le gambe ti tremano un poco, come in cima
      alla prima corda il giorno del tuo primo turno, e le pieghi sotto il
      tavolo perché nessuno se ne accorga.

      *La sedia è tirata fuori di un palmo, e il palmo è per me.* Nella è in
      prima fila con la squadra, e ti guarda come ti guardava dal recinto del
      Gancio.

      {origine apprendista-raschiatore} Ti ricordi la prima volta che hai
      visto il tuo nome a matita sulla bacheca, scritto più grande degli
      altri, o così ti pareva. Adesso la sala intera aspetta di sentirti
      dire una parola sola.
    opzioni:
      - testo: "Accettare il titolo"
        descrizione: "La sedia, il bracciale, il turno in fondo. Fiamma dura finché chi la porta torna su."
        esito:
          titolo: Fiamma
          testo: |
            Dici di sì, e la sala batte i boccali sul legno tutta insieme, con
            un rumore che fa tremare le finestre inchiodate. Ti siedi sulla
            sedia di Fiamma. Tenebra si risiede mentre Argento annuisce piano, e Dragna finalmente alza la testa e ti guarda senza dire niente.

            Più tardi, quando la sala si svuota, Dragna prende il bracciale di
            Mirta Sorrin dal tavolo e ti fa cenno di seguirla. Andate al Ponte
            dei Morti.
          imposta: { raschiatori.fiamma: 1 }
          segue: raschiatori-una-lanterna-per-nome
      - testo: "Accettare, e dire alla sala quello che hai capito"
        descrizione: "Nella Cripta e sulla Carta hai letto che i titoli sono le fasi di un ciclo. Tenebra voleva tenerlo per sé, Argento aspetta che tu lo dica."
        prova: { attributo: sociale, abilita: persuasione, difficolta: Media }
        successo:
          titolo: Le fasi
          testo: |
            Dici di sì, e poi dici alla sala del Quarto del 130 che aveva un
            titolo e non un nome, e delle quattro disposizioni della Carta.
            Lo dici piano come lo direbbe Tenebra, e le squadre ascoltano fino in fondo.
            Tenebra ti guarda a lungo e poi annuisce una volta, che da lui vale
            un discorso. Argento batte il bastone sul pavimento, e la sala batte
            i boccali.

            Più tardi, quando la sala si svuota, Dragna prende il bracciale di
            Mirta Sorrin dal tavolo e ti fa cenno di seguirla. Andate al Ponte
            dei Morti.
          pe: { persuasione: 5 }
          imposta: { raschiatori.fiamma: 1 }
          effetti: { rep.ponti: 1 }
          segue: raschiatori-una-lanterna-per-nome
        fallimento:
          titolo: Troppo presto
          testo: |
            Dici di sì, e poi cominci a parlare del Quarto e delle fasi, e la
            sala non capisce. Qualcuno ride, a disagio. Tenebra ti interrompe alzando una mano con gentilezza, e dice che di certe cose i Quattro
            parlano fra loro. La sala batte i boccali lo stesso, ma più piano.

            Più tardi, quando la sala si svuota, Dragna prende il bracciale di
            Mirta Sorrin dal tavolo e ti fa cenno di seguirla. Andate al Ponte
            dei Morti.
          imposta: { raschiatori.fiamma: 1 }
          effetti: { scandalo: 1 }
          segue: raschiatori-una-lanterna-per-nome
      - testo: "Chiedere a Dragna, davanti a tutti, se è d'accordo"
        descrizione: "Dragna non ha detto una parola. Prima di sederti su quella sedia vuoi sentire la sua voce, e vuoi che la senta la sala."
        prova: { attributo: sociale, abilita: empatia, difficolta: Media }
        successo:
          titolo: La voce del Ferro
          testo: |
            Ti giri verso Dragna e le chiedi se è d'accordo, davanti a tutti. Nella
            sala nessuno alza più il boccale. Dragna alza la testa dal boccale e ti
            guarda a lungo, poi batte i monconi sul tavolo due volte, il *vieni
            qui* dei Raschiatori, e indica la sedia con il mento. Ti siedi, e la
            sala batte i boccali sul legno fino a far tremare le finestre.

            Più tardi, quando la sala si svuota, Dragna prende il bracciale di
            Mirta Sorrin dal tavolo e ti fa cenno di seguirla. Andate al Ponte
            dei Morti.
          pe: { empatia: 5 }
          imposta: { raschiatori.fiamma: 1 }
          effetti: { rep.raschiatori: 0.5 }
          segue: raschiatori-una-lanterna-per-nome
        fallimento:
          titolo: Il silenzio del Ferro
          testo: |
            Le chiedi se è d'accordo, e Dragna non risponde. Guarda il boccale
            finché la sala comincia a mormorare, e alla fine è Tenebra a dirti
            di sederti. Ti siedi sulla sedia di Fiamma con le orecchie che
            scottano, e la sala batte i boccali con un poco di ritardo.

            Più tardi, quando la sala si svuota, Dragna prende il bracciale di
            Mirta Sorrin dal tavolo e ti fa cenno di seguirla, senza una parola.
            Andate al Ponte dei Morti.
          imposta: { raschiatori.fiamma: 1 }
          effetti: { tormento: 1 }
          segue: raschiatori-una-lanterna-per-nome
      - testo: "Rifiutare e proporre Nella"
        descrizione: "È scesa con te nel Pozzo e nel primo strato, e ha scelto i Raschiatori da libera. Il titolo forse è suo."
        quando: [raschiatori.nella >= 2]
        esito:
          titolo: Nella
          testo: |
            Dici di no, e prima che la sala capisca dici il nome di Nella. Lei
            diventa bianca e poi rossa, e la sala resta zitta finché Dragna non
            batte i monconi sul tavolo, una volta. Tenebra guarda Nella a lungo
            e le chiede se vuole. Lei dice di sì con la voce che le trema, e la
            sala batte i boccali.

            A te la sala dà un nome nuovo, Lanterna dei Quattro, che non è un
            titolo e lo diventerà. Più tardi Dragna prende il bracciale di
            Mirta Sorrin e fa cenno a tutti e due di seguirla fino al Ponte dei Morti.
          imposta: { raschiatori.fiamma: 2 }
          segue: raschiatori-una-lanterna-per-nome
      - testo: "Rifiutare e proporre Pio Varre"
        descrizione: "Il ragazzo delle orecchie a sventola è sceso con te alla Gradinata, e da allora non ha saltato un turno. Ha una lanterna sul Ponte da onorare."
        esito:
          titolo: Pio Varre
          testo: |
            Dici di no, e dici il nome di Pio Varre. La sala ride, poi smette di
            ridere quando vede la faccia di Dragna. Pio sta in fondo alla sala
            con le orecchie rosse. Tenebra lo chiama con un dito, e gli chiede
            se vuole. Pio risponde che suo padre ha la lanterna sul Ponte, e che
            vorrebbe tornarci con un titolo, e la sala batte i boccali.

            A te la sala dà un nome nuovo, Lanterna dei Quattro, che non è un
            titolo e lo diventerà. Più tardi Dragna prende il bracciale di
            Mirta Sorrin e fa cenno a tutti e due di seguirla fino al Ponte dei Morti.
          imposta: { raschiatori.fiamma: 2 }
          segue: raschiatori-una-lanterna-per-nome

  - id: raschiatori-una-lanterna-per-nome
    presso: ponte-dei-morti
    immagine: ambientazione/ponte-dei-morti
    titolo: Una lanterna per nome
    tipo: seguito
    luogo: Ponte dei Morti, a notte fonda
    area: ponti-sospesi
    requisiti: [fazione.raschiatori == 14, raschiatori.fiamma >= 1]
    testo: |
      Sul Ponte dei Morti, a notte fonda, ci siete soltanto voi e la nebbia.
      Dragna porta il bracciale di Mirta Sorrin in una mano e una lanterna
      nuova nell'altra, con un cristallo buono dentro. Argento vi ha seguito
      da lontano, con il bastone acceso, e si ferma al gabbiotto. Tenebra non
      è venuto, perché queste cose le fa il Ferro.

      In fondo al ponte la lanterna nera batte a colpi, più in fretta che
      mai. Accanto, quella di Mirta batte allo stesso tempo. Dragna si ferma
      davanti alle due e ti mette in mano la lanterna nuova.

      {empatia Media} Ha le mani ferme. Le ha tenute ferme per tutta la sera,
      a costo di stringere il boccale fino a farsi male, e adesso che è
      finita non sa più che cosa farne.

      C'è una formula, per appendere una lanterna al Ponte dei Morti. La dicono a mezza voce le squadre, sia chi appende sia chi guarda, e Dragna te
      l'ha insegnata il primo giorno senza dirti che un giorno ti sarebbe
      servita. *Una lanterna per nome. Una lanterna per quello che pensavi di sapere di lui.* La nebbia sale dalla Cicatrice e si ferma all'altezza
      del parapetto.
    opzioni:
      - testo: "Appendere la lanterna di Mirta e dire la formula"
        descrizione: "Il bracciale di Mirta nella lanterna nuova, e la lanterna al gancio accanto a quella nera. Poi le parole."
        quando: [raschiatori.fiamma == 1]
        esito:
          titolo: Una lanterna per nome
          testo: |
            Metti il bracciale di Mirta nella lanterna nuova accanto al cristallo, e la appendi al gancio vicino a quella nera. Dici la
            formula a mezza voce, e Dragna la dice con te. La lanterna di Mirta smette di battere e resta accesa, mentre quella nera, accanto, si spegne del tutto.

            Nessuno dei tre sa dire se è un saluto o una sostituzione, e nessuno
            lo chiede. Dragna ti prende il polso sinistro e ci chiude un
            bracciale di rame annerito, stringendo la fibbia con le otto dita, e
            ti chiama per nome per la prima volta. Argento, dal gabbiotto, ti
            porta la borsa dei Quattro e il piccone delle Fiamme, con la testa
            di metallo che non arrugginisce.

            Al Grifone, da domani, i cristalli della Fiamma la bacheca li paga
            al prezzo migliore. Nel Capitolo II, quando si scenderà dalla Strada
            Antica, i Quattro scenderanno con te.
          pe: { resilienza: 10, empatia: 5 }
          almeno: { rep.raschiatori: 10 }
          effetti: { fazione.raschiatori: 1, monete: 350, oggetto.raschiatori-piccone-della-fiamma: 1, oggetto.raschiatori-bracciale-di-rame: 1 }
      - testo: "Lasciare che la appenda Dragna"
        descrizione: "Mirta era della sua tavola prima che della tua. Il gancio lo sceglie lei, e la formula la dici tu."
        quando: [raschiatori.fiamma == 1]
        esito:
          titolo: Il gancio di Dragna
          testo: |
            Le restituisci la lanterna, e Dragna ci mette il bracciale di Mirta
            con una cura che non le hai mai visto. La appende al gancio accanto
            a quella nera, e tu dici la formula. La lanterna di Mirta smette di battere e resta accesa, mentre quella nera, accanto, si spegne del tutto.

            Nessuno dei tre sa dire se è un saluto o una sostituzione. Dragna ti
            prende il polso sinistro e ci chiude un bracciale di rame annerito,
            stringendo la fibbia con le otto dita, e ti chiama per nome per la prima volta. Argento ti porta la borsa dei Quattro e il piccone
            delle Fiamme, con la testa di metallo che non arrugginisce.

            Al Grifone, da domani, i cristalli della Fiamma la bacheca li paga
            al prezzo migliore. Nel Capitolo II, quando si scenderà dalla Strada
            Antica, i Quattro scenderanno con te.
          pe: { resilienza: 10, empatia: 5 }
          almeno: { rep.raschiatori: 10 }
          effetti: { fazione.raschiatori: 1, monete: 350, oggetto.raschiatori-piccone-della-fiamma: 1, oggetto.raschiatori-bracciale-di-rame: 1 }
      - testo: "Appendere la lanterna con la nuova Fiamma"
        descrizione: "Il titolo l'hai dato via. La lanterna di Mirta la appendete insieme, e la formula la dite in due."
        quando: [raschiatori.fiamma == 2]
        esito:
          titolo: La Lanterna dei Quattro
          testo: |
            La nuova Fiamma e tu appendete insieme la lanterna di Mirta, e dite
            la formula in due, con Dragna che la sussurra dietro di voi. La lanterna di Mirta smette di battere e resta accesa, mentre quella nera, accanto, si spegne del tutto. Dragna chiude il bracciale di rame al polso della
            nuova Fiamma e la chiama per nome per la prima volta.

            A te Argento porta il piccone delle Fiamme, perché nessuno sa
            scegliere una Fiamma meglio di chi ha detto di no, e la borsa più
            pesante che la bacheca abbia mai pagato. Sui Ponti, da domani, ti
            chiamano Lanterna dei Quattro, e nel Capitolo II, quando si scenderà
            dalla Strada Antica, i Quattro vorranno anche te.
          pe: { resilienza: 10, empatia: 5 }
          almeno: { rep.raschiatori: 10 }
          effetti: { fazione.raschiatori: 1, monete: 400, oggetto.raschiatori-piccone-della-fiamma: 1, rep.ponti: 1 }
