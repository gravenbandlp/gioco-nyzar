# La quest dei Raschiatori, fine dell'Atto IV e Atto V (fazione.raschiatori 11 → 15).
# - 11 → 12 `raschiatori-la-cripta-e-la-chiave` (Cattedrale, grado 4, Veterano): Ottilia Sanvel e il registro
#   dell'accesso del 130, firmato dai Raschiatori. Il Quarto del Rito non ha nome ma ha un titolo, Fiamma.
#   raschiatori.velo: 1 copia della Carta ceduta al Velo (rep.velo +1), 2 registro copiato di nascosto
#   (Sospetto), 3 Ottilia convinta. La formula del Filo di ritorno e la branda dei Quattro stanno in
#   ripetibili.yaml e si aprono con questo grado.
# - 12 → 13 `raschiatori-la-lanterna-nera` (Ponte dei Morti, pista.capomozzo >= 10, l'Arena non in corso perché
#   Dragna combatte nella finale): la lanterna nera che si accende da sola, la data 130 e il titolo. I Quattro
#   scendono nel primo strato, e il passo 14 è la spedizione (spedizione-primo-strato.yaml).
# - 14 → 15 `raschiatori-fiamma` (Grifone) e il seguito `raschiatori-una-lanterna-per-nome` (Ponte dei Morti,
#   grado 5, Fiamma): accettare il titolo (raschiatori.fiamma 1: piccone della Fiamma, bracciale di rame dei
#   Quattro, la borsa) o rifiutarlo proponendo Nella o Pio Varre (raschiatori.fiamma 2, Lanterna dei Quattro: il
#   piccone, una borsa più pesante e la gente dei Ponti). La lanterna nera si spegne, e nessuno sa se è un saluto
#   o una sostituzione.
storylet:
  # ------------------------------------------------------------ 11 → 12 · la Cripta e la chiave (grado 4)
  - id: raschiatori-la-cripta-e-la-chiave
    presso: cattedrale-del-velo
    immagine: personaggi/ottilia-sanvel
    titolo: La Cripta e la chiave
    sommario: "Il Velo custodisce un registro dei Raschiatori del 130, e il suo permesso serve per scendere dove indica la Carta."
    luogo: Cattedrale del Velo, gli archivi minori sopra la Cripta
    area: quartieri-alti
    requisiti: [fazione.raschiatori == 11]
    testo: |
      Gli archivi minori stanno in un corridoio basso sopra la Cripta, fra
      scansie di legno nero che arrivano al soffitto. Ottilia Sanvel ti
      aspetta alla porta con le mani incrociate sul grembiule. Tenebra è
      rimasto sulla scala, tre gradini più su, perché del Velo diffida da
      sempre.

      «Vuoi il permesso di scendere dove indica la vostra carta, e vuoi il
      registro del 130» dice Ottilia. «È qui. Lo firmarono i Raschiatori che
      tenevano l'accesso alla Strada Antica la notte del Rito.» Guarda appena
      la terza scansia.

      {empatia Media} Il registro l'ha letto da sola per più di una notte,
      senza mai dire a nessuno che cosa ci ha trovato.

      {accademiche Facile} Nel 130 i Portatori scesero al Santuario delle
      Maschere per il Rito, e uno di loro non tornò. Le cronache lo chiamano
      il Quarto, perché il nome non l'hanno mai scritto.

      Senza che tu glielo chieda racconta che portava l'acqua a Mirn il Sordo
      quando ripeteva frasi in una lingua che nessuno capiva, e ti guarda per
      vedere che faccia fai. *Vuole sapere se sono venuto a prendere o a
      dare.*

      {origine accolito-del-velo} La terza scansia la conosci, perché da
      novizio ci spolveravi i registri che non potevi aprire, e le dita
      ricordano ancora il cassetto basso che si apre tirando verso l'alto.
    opzioni:
      - testo: "Cedere al Velo una copia della Carta"
        descrizione: "Una copia della Carta in cambio del permesso e del registro, sotto gli occhi di Tenebra."
        esito:
          titolo: La copia
          testo: |
            Ricopi la Carta su una lastra di cera, e Ottilia ti dà il permesso e il registro. Il Ferro di allora ha scritto *il Quarto* e accanto, al posto del nome, un titolo, *Fiamma*.

            Sulla scala la Madre del Velo ti dice soltanto che i nomi passano e le fasi restano. Al Grifone Tenebra non ti guarda, e Argento ti dà una giubba cerata foderata di rame.
          pe: { resilienza: 5 }
          almeno: { rep.raschiatori: 8 }
          imposta: { raschiatori.velo: 1 }
          effetti: { fazione.raschiatori: 1, monete: 120, oggetto.raschiatori-giubba-del-primo-strato: 1, rep.velo: 1 }
      - testo: "Copiare il registro di nascosto"
        descrizione: "Ottilia scende in Cripta per l'ufficio della sera, e la terza scansia resta sola per il tempo di una preghiera."
        prova: { attributo: mentale, abilita: furtivita, difficolta: Difficile }
        successo:
          titolo: Il tempo di una preghiera
          testo: |
            Mentre Ottilia è all'ufficio della sera ricopi in fretta la pagina del 130. Il Ferro di allora ha scritto *il Quarto* e accanto, al
            posto del nome, un titolo, *Fiamma*.

            Sulla scala la Madre del Velo ti guarda le dita macchiate d'inchiostro, ti scrive il permesso e ti dice soltanto che i nomi passano e
            le fasi restano. Al Grifone Argento ti dà una giubba cerata foderata di rame.
          pe: { resilienza: 5 }
          almeno: { rep.raschiatori: 8 }
          imposta: { raschiatori.velo: 2 }
          effetti: { fazione.raschiatori: 1, monete: 120, oggetto.raschiatori-giubba-del-primo-strato: 1, sospetto: 1.5 }
        fallimento:
          titolo: La mano sulla pagina
          testo: |
            Stai ricopiando la pagina quando la mano di Ottilia si posa sul foglio, e te la legge
            lei. Il Ferro di allora ha scritto *il Quarto* e accanto, al posto del nome, un titolo,
            *Fiamma*.

            Sulla scala la Madre del Velo ti firma il permesso con una freddezza nuova, dicendo che i
            nomi passano e le fasi restano. Al Grifone Argento ti dà una giubba cerata foderata di
            rame.
          pe: { resilienza: 5 }
          almeno: { rep.raschiatori: 8 }
          imposta: { raschiatori.velo: 3 }
          effetti: { fazione.raschiatori: 1, monete: 120, oggetto.raschiatori-giubba-del-primo-strato: 1, sospetto: 1.5, rep.velo: -1 }
      - testo: "Convincere Ottilia a leggerti la pagina"
        descrizione: "Ha portato l'acqua a Mirn il Sordo e sa cosa succede a chi scende troppo, e forse vuole che qualcuno lo sappia."
        prova: { attributo: sociale, abilita: empatia, difficolta: Media }
        successo:
          titolo: L'acqua di Mirn
          testo: |
            Le chiedi di Mirn invece che del registro, e lei ne parla prima di leggerti la pagina del 130. Il Ferro di allora ha scritto *il
            Quarto* e accanto, al posto del nome, *Fiamma*. Ti firma il permesso senza chiederti niente.

            Sulla scala la Madre del Velo ti dice che i nomi passano e le fasi restano. Al Grifone Argento ti dà una giubba cerata foderata di
            rame.
          pe: { empatia: 3, resilienza: 5 }
          almeno: { rep.raschiatori: 8 }
          imposta: { raschiatori.velo: 3 }
          effetti: { fazione.raschiatori: 1, monete: 120, oggetto.raschiatori-giubba-del-primo-strato: 1, rep.velo: 0.5 }
        fallimento:
          titolo: Il prezzo del Velo
          testo: |
            Ottilia ti chiede in cambio una copia della carta, che le fai su una lastra di cera sotto gli occhi di Tenebra. Il Ferro di allora ha scritto *il
            Quarto* e accanto, al posto del nome, *Fiamma*.

            Sulla scala la Madre del Velo ti dice che i nomi passano e le fasi restano. Al Grifone Tenebra non ti guarda, e Argento ti dà una giubba cerata
            foderata di rame.
          pe: { resilienza: 5 }
          almeno: { rep.raschiatori: 8 }
          imposta: { raschiatori.velo: 1 }
          effetti: { fazione.raschiatori: 1, monete: 120, oggetto.raschiatori-giubba-del-primo-strato: 1, rep.velo: 1, scandalo: 0.5 }
      - testo: "Leggere la memoria della scansia con l'Eco"
        descrizione: "La scansia ricorda chi ha aperto quel registro, e la formula precuriana glielo chiede."
        incantesimo: eco
        prova: { attributo: mentale, abilita: magia, difficolta: Media }
        successo:
          titolo: Le mani sulla scansia
          testo: |
            Dici la formula con la mano sul legno, e la scansia ti restituisce le
            mani che l'hanno aperta. La più vecchia ha otto dita e ha scritto *il
            Quarto* e, invece di un nome, *Fiamma*. Poi Ottilia ti firma il
            permesso.

            Sulla scala la Madre del Velo ti dice che i nomi passano e le fasi
            restano. Al Grifone Argento ti dà una giubba cerata foderata di rame.
          pe: { magia: 5 }
          almeno: { rep.raschiatori: 8 }
          imposta: { raschiatori.velo: 3 }
          effetti: { fazione.raschiatori: 1, monete: 120, oggetto.raschiatori-giubba-del-primo-strato: 1, rep.velo: 0.5 }
        fallimento:
          titolo: Troppe mani
          testo: |
            La scansia ti restituisce cento mani insieme. Poi Ottilia ti legge la
            pagina del 130, dove il Ferro di allora ha scritto *il Quarto* e, al
            posto del nome, *Fiamma*, e ti firma il permesso in cambio di una
            copia della carta.

            Sulla scala la Madre del Velo ti dice che i nomi passano e le fasi
            restano. Al Grifone Argento ti dà una giubba cerata foderata di rame.
          pe: { resilienza: 5 }
          almeno: { rep.raschiatori: 8 }
          imposta: { raschiatori.velo: 1 }
          effetti: { fazione.raschiatori: 1, monete: 120, oggetto.raschiatori-giubba-del-primo-strato: 1, rep.velo: 1, tormento: 0.5 }
      - testo: "Aprire il cassetto basso della terza scansia"
        descrizione: "Da novizio ci spolveravi i registri proibiti, e il cassetto si apre tirando verso l'alto."
        quando: [origine.accolito-del-velo >= 1]
        esito:
          titolo: Il cassetto basso
          testo: |
            Apri il cassetto basso tirando verso l'alto, come da novizio. Sulla pagina il Ferro di allora ha scritto *il Quarto* e, al posto del
            nome, *Fiamma*. Ottilia ti firma il permesso dicendo che un novizio che ricorda i cassetti ha lavorato bene.

            Sulla scala la Madre del Velo ti dice che i nomi passano e le fasi restano. Al Grifone Argento ti dà una giubba cerata foderata di rame.
          pe: { accademiche: 3, resilienza: 5 }
          almeno: { rep.raschiatori: 8 }
          imposta: { raschiatori.velo: 3 }
          effetti: { fazione.raschiatori: 1, monete: 120, oggetto.raschiatori-giubba-del-primo-strato: 1, rep.velo: 0.5 }

  # ------------------------------------------------------------ 12 → 13 · la lanterna nera
  - id: raschiatori-la-lanterna-nera
    presso: ponte-dei-morti
    immagine: ambientazione/ponte-dei-morti
    titolo: La lanterna nera
    sommario: "Dalla caduta del Costruttore la lanterna nera del Ponte dei Morti batte più in fretta, a tempo con quella di Mirta Sorrin."
    luogo: Ponte dei Morti, in fondo, dopo la seconda campana
    area: ponti-sospesi
    requisiti: [fazione.raschiatori == 12, pista.capomozzo >= 10, pista.arena != 1, pista.arena != 2, pista.arena != 3, pista.arena != 4]
    testo: |
      In fondo al Ponte dei Morti l'ultima lanterna è di ferro nero, e nessuna squadra la cura perché si accende da sola. Da quando il
      Costruttore è caduto sotto Capomozzo la sua luce batte a colpi come un polso, e da qualche sera la lanterna di Mirta Sorrin, la
      Fiamma rimasta di sotto in primavera, batte allo stesso tempo.

      Dragna è venuta con Argento e una scala. La stacca e la porta giù con le otto dita tenendola lontana dal corpo. In nove anni, ti
      dice Argento, non l'ha mai toccata. Sulla porticina, sotto la ruggine, ci sono segni incisi a coltello e mangiati a metà.

      {empatia Media} Dragna ha le mani ferme e la mascella dura, e ha paura di quello che ci leggerai sopra.

      {origine apprendista-raschiatore} Alle veglie la lanterna nera l'hai sempre saltata, e adesso ti accorgi di averla contata lo
      stesso, per ultima.
    opzioni:
      - testo: "Leggere quello che c'è sotto la ruggine"
        descrizione: "I segni sono mangiati a metà, ma con le dita leggere la porticina dice ancora qualcosa."
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Media }
        successo:
          titolo: La porticina
          testo: |
            Gratti la ruggine con l'unghia, un segno alla volta, e leggi una data, *130*, e sotto, della stessa mano, *Fiamma*. Dragna chiude gli occhi un momento, poi
            riappende la lanterna e dice che i Quattro scenderanno nel primo strato, dove si apre la fase della Fiamma, in tre più te e con Argento all'argano per via
            della gamba.
          pe: { tecnologia: 3, empatia: 3 }
          effetti: { fazione.raschiatori: 1, rep.raschiatori: 1 }
        fallimento:
          titolo: La ruggine
          testo: |
            La ruggine si porta via metà dei segni. Restano una data, *130*, e l'inizio di una parola che Dragna finisce per te senza guardarla, *Fiamma*. Poi
            riappende la lanterna e dice che i Quattro scenderanno nel primo strato, dove si apre la fase della Fiamma, in tre più te e con Argento all'argano per via
            della gamba.
          pe: { empatia: 3 }
          effetti: { fazione.raschiatori: 1, tormento: 1 }
      - testo: "Leggerla con lo Scandaglio"
        descrizione: "Il cristallo vibra dove sotto c'è un vuoto, e i segni incisi sono vuoti sotto la ruggine."
        requisiti: [chiave.scandaglio >= 1]
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Facile }
        successo:
          titolo: Il vuoto dei segni
          testo: |
            Il cristallo dello Scandaglio vibra dove la ruggine copre i solchi, e seguendoli con il dito leggi *130* e sotto, della stessa mano, *Fiamma*. Dragna
            riappende la lanterna e dice che i Quattro scenderanno nel primo strato, dove si apre la fase della Fiamma, in tre più te e con Argento all'argano per via
            della gamba.
          pe: { tecnologia: 3, empatia: 3 }
          effetti: { fazione.raschiatori: 1, rep.raschiatori: 1 }
        fallimento:
          titolo: Il cristallo muto
          testo: |
            Lo Scandaglio vibra uguale su tutta la porticina. Dragna te lo rimette al collo e la parola la dice lei, *Fiamma*, con la data, *130*. Poi riappende la
            lanterna e dice che i Quattro scenderanno nel primo strato, dove si apre la fase della Fiamma, in tre più te e con Argento all'argano per via della
            gamba.
          pe: { empatia: 3 }
          effetti: { fazione.raschiatori: 1, tormento: 1 }
      - testo: "Chiedere a Dragna perché non vuole che tu scenda dove sono scese le Fiamme"
        descrizione: "Ti ha sempre tenuto lontano da quel posto, e adesso, con la lanterna sulle assi, forse risponde."
        prova: { attributo: sociale, abilita: empatia, difficolta: Media }
        successo:
          titolo: Vent'anni fa
          testo: |
            Dragna tace, poi dice che vent'anni fa qualcuno ha tenuto lei lontana da un posto come questo senza
            spiegarle perché, e che non ha mai capito se doveva essergli grata. Sulla porticina, e lei lo sa da nove
            anni, ci sono una data, *130*, e un titolo, *Fiamma*. I Quattro scenderanno nel primo strato, dove si
            apre la fase della Fiamma, in tre più te e con Argento all'argano.
          pe: { empatia: 5 }
          effetti: { fazione.raschiatori: 1, rep.raschiatori: 1 }
        fallimento:
          titolo: Il muro
          testo: |
            Dragna ti risponde con un'occhiata che chiude il discorso e riappende la lanterna. Argento sospira e ti dice lui cosa c'è sotto la ruggine, una data,
            *130*, e un titolo, *Fiamma*. Poi Dragna dice che i Quattro scenderanno nel primo strato, dove si apre la fase della Fiamma, in tre più te e con Argento
            all'argano per via della gamba.
          pe: { empatia: 3 }
          effetti: { fazione.raschiatori: 1, tormento: 1 }
      - testo: "Contare la lanterna nera come la contavi alle veglie"
        descrizione: "Alle veglie l'hai sempre contata per ultima, e le dita sanno dove la ruggine è più sottile."
        quando: [origine.apprendista-raschiatore >= 1]
        esito:
          titolo: L'ultima del conto
          testo: |
            Passi le dita sulla porticina come quando contavi le lanterne al buio,
            e la ruggine si stacca dove è più sottile, su una data, *130*, e un
            titolo, *Fiamma*. Dragna ti guarda le mani prima di riappendere la
            lanterna, poi dice che i Quattro scenderanno nel primo strato, dove si
            apre la fase della Fiamma, in tre più te e con Argento all'argano per
            via della gamba.
          pe: { percezione: 3, empatia: 3 }
          effetti: { fazione.raschiatori: 1, rep.raschiatori: 1 }
      - testo: "Lasciare che la porticina la legga Argento"
        descrizione: "Argento ha letto più registri di chiunque al Grifone, ma ci mette tutta la notte."
        costo: 2
        esito:
          titolo: La notte di Argento
          testo: |
            Argento gratta la porticina con la punta di un chiodo per tutta la
            notte, la lanterna in grembo, mentre tu gli tieni la lampada e Dragna
            fuma sul parapetto. All'alba sotto la ruggine compaiono una data,
            *130*, e un titolo, *Fiamma*. Dragna riappende la lanterna e dice che
            i Quattro scenderanno nel primo strato, dove si apre la fase della
            Fiamma, in tre più te e con Argento all'argano.
          pe: { empatia: 3 }
          effetti: { fazione.raschiatori: 1, tormento: 1 }
      - testo: "Ricordarle la sera della piastrina di Dorr"
        descrizione: "Le hai riportato la piastrina di Arelan Dorr, e quella sera, dopo quarant'anni, lei ha parlato."
        quando: [rovine.dorr == 2]
        esito:
          titolo: L'ora del rientro
          testo: |
            Le ricordi Arelan Dorr, e lei si siede sulle assi accanto alla lanterna. Dice che le lanterne dei dispersi si accendono da sole quando qualcuno è
            risalito senza dirlo, e che quella nera si è accesa la prima volta nel 130; sulla porticina c'è un titolo, *Fiamma*. I Quattro scenderanno nel
            primo strato, dove si apre la fase della Fiamma, in tre più te e con Argento all'argano.
          pe: { empatia: 5 }
          effetti: { fazione.raschiatori: 1, rep.raschiatori: 1 }
      - testo: "Chiedere a Stoppino che cosa ha visto dentro"
        descrizione: "Il bambino delle lanterne ci ha guardato dentro una volta, e da allora ci passa alla larga."
        quando: [origine.figlio-della-citta-bassa >= 1, ponti.lanterne >= 1]
        esito:
          titolo: Quello che ha visto Stoppino
          testo: |
            Stoppino viene piano dal parapetto, dove stava con le gambe sopra il vuoto. Dice che dentro la lanterna
            nera c'è una luce senza cristallo e senza niente intorno, e Dragna gli mette una mano sulla testa. Sulla
            porticina ci sono una data, *130*, e un titolo, *Fiamma*. I Quattro scenderanno nel primo strato, dove si
            apre la fase della Fiamma, in tre più te e con Argento all'argano.
          pe: { empatia: 5 }
          effetti: { fazione.raschiatori: 1, rep.raschiatori: 1 }

  # ------------------------------------------------------------ 14 → 15 · Fiamma (grado 5)
  - id: raschiatori-fiamma
    presso: grifone-di-ferro
    immagine: personaggi/tenebra
    titolo: Fiamma
    sommario: "In fondo si scende in quattro, e al Grifone Tenebra ti offre il titolo di Fiamma davanti a tutti."
    luogo: Locanda del Grifone di Ferro, la sala piena
    area: ponti-sospesi
    requisiti: [fazione.raschiatori == 14, raschiatori.fiamma == 0]
    testo: |
      Il Grifone è pieno come la sera del Festival, e nessuno beve. Le squadre stanno in piedi fra i tavoli con i boccali in mano, e al
      tavolo dei Quattro la sedia di Fiamma è stata tirata fuori di un palmo.

      Tenebra si alza e la sala si zittisce per sentirlo. Dice che i Quattro sono tre dalla primavera, che in fondo si scende in quattro, e
      che qualcuno è sceso con loro nel primo strato ed è tornato con il bracciale di Mirta Sorrin. Poi, davanti a tutti, indica a te la
      sedia.

      Dragna guarda il legno del tavolo con la mascella stretta. Argento, il bastone di cristallo acceso appoggiato al tavolo, aspetta di
      sentire se dirai quello che hai capito nella Cripta e sulla Carta.

      {politica-ed-economia Difficile} Un titolo che passa di mano senza mai restare vuoto non è un titolo di mestiere, e Argento l'ha capito
      sulla Carta.

      *La sedia è tirata fuori di un palmo, e il palmo è per me.* Nella, in prima fila con la squadra, ti guarda come ti guardava dal recinto
      del Gancio.

      {origine apprendista-raschiatore} Ti ricordi il tuo nome a matita sulla bacheca, la prima volta, scritto più grande degli altri o così
      ti pareva.
    opzioni:
      - testo: "Accettare il titolo"
        descrizione: "Prendi la sedia e il turno in fondo, e Fiamma dura finché chi la porta torna su."
        esito:
          titolo: Fiamma
          testo: |
            Dici di sì, e la sala batte i boccali sul legno tutta insieme, fino a far tremare le finestre inchiodate. Ti siedi sulla sedia di
            Fiamma; Argento annuisce piano, e Dragna finalmente alza la testa e ti guarda.

            Quando la sala si svuota, Dragna prende il bracciale di Mirta Sorrin e ti fa cenno di seguirla al Ponte dei Morti.
          imposta: { raschiatori.fiamma: 1 }
          segue: raschiatori-una-lanterna-per-nome
      - testo: "Accettare, e dire alla sala quello che hai capito"
        descrizione: "I titoli sono le fasi di un ciclo, e Argento aspetta che tu lo dica alla sala."
        prova: { attributo: sociale, abilita: persuasione, difficolta: Media }
        successo:
          titolo: Le fasi
          testo: |
            Dici di sì, e racconti piano alla sala del Quarto del 130 e delle quattro
            disposizioni della Carta. Tenebra annuisce una volta, che da lui vale un
            discorso, Argento batte il bastone sul pavimento e la sala batte i boccali.

            Quando la sala si svuota, Dragna prende il bracciale di Mirta Sorrin e ti fa
            cenno di seguirla al Ponte dei Morti.
          pe: { persuasione: 5 }
          imposta: { raschiatori.fiamma: 1 }
          effetti: { rep.ponti: 1 }
          segue: raschiatori-una-lanterna-per-nome
        fallimento:
          titolo: Troppo presto
          testo: |
            Dici di sì e cominci a parlare del Quarto e delle fasi, finché qualcuno ride a disagio. Tenebra ti interrompe alzando una mano con
            gentilezza e dice che di certe cose i Quattro parlano fra loro. La sala batte i boccali lo stesso, più piano.

            Quando la sala si svuota, Dragna prende il bracciale di Mirta Sorrin e ti fa cenno di seguirla al Ponte dei Morti.
          imposta: { raschiatori.fiamma: 1 }
          effetti: { scandalo: 1 }
          segue: raschiatori-una-lanterna-per-nome
      - testo: "Chiedere a Dragna, davanti a tutti, se è d'accordo"
        descrizione: "Prima di sederti vuoi sentire la voce di Dragna, e vuoi che la senta la sala."
        prova: { attributo: sociale, abilita: empatia, difficolta: Media }
        successo:
          titolo: La voce del Ferro
          testo: |
            Ti giri verso Dragna e le chiedi se è d'accordo. Lei ti guarda a lungo,
            poi batte i monconi sul tavolo due volte, il *vieni qui* dei
            Raschiatori, e indica la sedia con il mento. Ti siedi, e la sala batte
            i boccali fino a far tremare le finestre.

            Più tardi Dragna prende il bracciale di Mirta Sorrin e ti fa cenno di
            seguirla al Ponte dei Morti.
          pe: { empatia: 5 }
          imposta: { raschiatori.fiamma: 1 }
          effetti: { rep.raschiatori: 0.5 }
          segue: raschiatori-una-lanterna-per-nome
        fallimento:
          titolo: Il silenzio del Ferro
          testo: |
            Dragna non risponde e guarda il boccale finché la sala comincia a
            mormorare, e alla fine è Tenebra a dirti di sederti. Ti siedi con le
            orecchie che scottano, e i boccali battono con un poco di ritardo.

            Quando la sala si svuota, Dragna prende il bracciale di Mirta Sorrin e
            ti fa cenno di seguirla al Ponte dei Morti, senza una parola.
          imposta: { raschiatori.fiamma: 1 }
          effetti: { tormento: 1 }
          segue: raschiatori-una-lanterna-per-nome
      - testo: "Rifiutare e proporre Nella"
        descrizione: "È scesa con te nel Pozzo e nel primo strato, e ha scelto i Raschiatori da libera."
        quando: [raschiatori.nella >= 2]
        esito:
          titolo: Nella
          testo: |
            Dici di no e fai il nome di Nella, che diventa rossa. Dragna batte i
            monconi sul tavolo e Tenebra chiede a Nella se vuole; lei dice di sì, e
            la sala batte i boccali.

            A te la sala dà un nome nuovo, Lanterna dei Quattro, che non è ancora un
            titolo. Più tardi Dragna fa cenno a tutti e due di seguirla al Ponte dei
            Morti.
          imposta: { raschiatori.fiamma: 2 }
          segue: raschiatori-una-lanterna-per-nome
      - testo: "Rifiutare e proporre Pio Varre"
        descrizione: "Sceso con te alla Gradinata, non ha più saltato un turno, e suo padre ha una lanterna sul Ponte."
        esito:
          titolo: Pio Varre
          testo: |
            Dici di no e fai il nome di Pio Varre. La sala ride finché non vede la
            faccia di Dragna, e Pio dice che vorrebbe tornare con un titolo alla
            lanterna di suo padre.

            La sala batte i boccali e a te dà un nome nuovo, Lanterna dei Quattro,
            che non è ancora un titolo. Più tardi Dragna fa cenno a tutti e due di
            seguirla al Ponte dei Morti.
          imposta: { raschiatori.fiamma: 2 }
          segue: raschiatori-una-lanterna-per-nome

  - id: raschiatori-una-lanterna-per-nome
    presso: ponte-dei-morti
    immagine: ambientazione/ponte-dei-morti
    titolo: Una lanterna per nome
    tipo: seguito
    luogo: Ponte dei Morti, a notte fonda
    area: ponti-sospesi
    requisiti: [fazione.raschiatori == 14, raschiatori.fiamma >= 1]
    testo: |
      Sul Ponte dei Morti, a notte fonda, ci siete soltanto voi e la nebbia. Dragna porta il bracciale di Mirta e una lanterna nuova con un
      cristallo buono dentro; Argento si ferma al gabbiotto con il bastone acceso, e Tenebra non è venuto, perché queste cose le fa il Ferro.

      In fondo al ponte la lanterna nera batte a colpi, più in fretta che mai, e quella di Mirta batte allo stesso tempo. Dragna si ferma davanti
      alle due e ti mette in mano la lanterna nuova.

      {empatia Media} Ha tenuto le mani ferme per tutta la sera, a costo di stringere il boccale fino a farsi male, e adesso che è finita non sa più
      che cosa farne.

      Per appendere una lanterna al Ponte dei Morti le squadre dicono a mezza voce una formula, e Dragna te l'ha insegnata il primo giorno senza
      dirti che ti sarebbe servita. *Una lanterna per nome. Una lanterna per quello che pensavi di sapere di lui.* La nebbia sale dalla Cicatrice
      fino all'altezza del parapetto.
    opzioni:
      - testo: "Appendere la lanterna di Mirta e dire la formula"
        descrizione: "Il bracciale di Mirta nella lanterna nuova, e la lanterna al gancio accanto a quella nera. Poi le parole."
        quando: [raschiatori.fiamma == 1]
        esito:
          titolo: Una lanterna per nome
          testo: |
            Metti il bracciale di Mirta nella lanterna nuova e la appendi accanto alla nera, dicendo la formula con Dragna. Quella di Mirta smette di battere, e
            la nera si spegne.

            Dragna ti chiude al polso un bracciale di rame e per la prima volta ti chiama per nome; Argento ti dà la borsa dei Quattro e il piccone delle Fiamme.
            Nel Capitolo II scenderai con i Quattro.
          pe: { resilienza: 10, empatia: 5 }
          almeno: { rep.raschiatori: 10 }
          effetti: { fazione.raschiatori: 1, monete: 350, oggetto.raschiatori-piccone-della-fiamma: 1, oggetto.raschiatori-bracciale-di-rame: 1 }
      - testo: "Lasciare che la appenda Dragna"
        descrizione: "Mirta era della sua tavola prima che della tua, quindi il gancio lo sceglie lei."
        quando: [raschiatori.fiamma == 1]
        esito:
          titolo: Il gancio di Dragna
          testo: |
            Dragna mette il bracciale di Mirta nella lanterna nuova e la appende accanto alla nera, mentre tu dici la formula. Quella di Mirta smette di
            battere, e la nera si spegne.

            Dragna ti chiude al polso un bracciale di rame e per la prima volta ti chiama per nome; Argento ti dà la borsa dei Quattro e il piccone delle
            Fiamme. Nel Capitolo II scenderai con i Quattro.
          pe: { resilienza: 10, empatia: 5 }
          almeno: { rep.raschiatori: 10 }
          effetti: { fazione.raschiatori: 1, monete: 350, oggetto.raschiatori-piccone-della-fiamma: 1, oggetto.raschiatori-bracciale-di-rame: 1 }
      - testo: "Appendere la lanterna con la nuova Fiamma"
        descrizione: "Il titolo l'hai dato via. La lanterna di Mirta la appendete insieme, e la formula la dite in due."
        quando: [raschiatori.fiamma == 2]
        esito:
          titolo: La Lanterna dei Quattro
          testo: |
            Tu e la nuova Fiamma appendete la lanterna di Mirta. Quella di Mirta smette di battere, e la nera si spegne. Dragna le chiude il bracciale al polso e per la prima volta la chiama per nome.

            Argento ti porta il piccone delle Fiamme e una borsa, perché nessuno sceglie una Fiamma meglio di chi ha detto di no, e nel Capitolo II i Quattro vorranno anche te.
          pe: { resilienza: 10, empatia: 5 }
          almeno: { rep.raschiatori: 10 }
          effetti: { fazione.raschiatori: 1, monete: 400, oggetto.raschiatori-piccone-della-fiamma: 1, rep.ponti: 1 }
