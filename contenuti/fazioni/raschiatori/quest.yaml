# La quest dei Raschiatori, «Una lanterna per nome» (fazione.raschiatori 0 → 15): dal nome a matita sulla bacheca
# del Grifone al quarto posto vuoto al tavolo dei Quattro. Qui la pista, la voce della fazione con i cinque gradi e
# le quality della quest. Gli storylet stanno in passi-1/2/3.yaml, le quattro spedizioni in spedizione-*.yaml, i
# lavori e i servizi della fazione in ripetibili.yaml.
# - Atto I (passi 1-3, raschiatore >= 1; chi non è nei turni entra con la garanzia di Gerardo Crine): il turno al
#   terzo pianerottolo, le corde della Compagnia del Gancio, Valdo Merlach al Grifone (grado 1).
# - Atto II (4-6): Argento e il diritto di prima mappa, la Gradinata Cieca, il consiglio della Gilda (grado 2).
# - Atto III (7-9, pista.acciaio >= 8): il campo della Compagnia, il Pozzo Senzanome, il giudizio del Ferro (grado 3).
# - Atto IV (10-12, pista.capomozzo >= 7): le Stele, le Carcasse di Korith, la Cripta del Velo (grado 4).
# - Atto V (13-15, pista.capomozzo >= 10, Arena non in corso): la lanterna nera, il primo strato, Fiamma (grado 5).
# Il doppio gioco con Merlach (passo 3) non chiude la quest: al passo 9 chi resta con lui paga reputazione, perde
# l'ascia del grado e fa una penitenza prima del passo 10.
quality:
  - { id: fazione.raschiatori, immagine: fazioni/raschiatori, nome: "Una lanterna per nome", categoria: pista, descrizione: "Dragna Gro-Malog ti ha scritto sulla bacheca del Grifone di Ferro a matita. Fra i Raschiatori un nome passa all'inchiostro quando chi lo porta torna su abbastanza volte." }
  - { id: raschiatori.grusk, nome: Le corde dell'Orlo, categoria: stato, nascosta: true, descrizione: "1 se hai già chiesto a Grusk dei ganci della Compagnia." }
  - { id: raschiatori.doppio, nome: La paga del Gancio, categoria: stato, nascosta: true, descrizione: "1 se hai finto di accettare la paga di Valdo Merlach; 2 se al giudizio del Ferro hai consegnato contratto e ricevute; 3 se sei rimasto con lui." }
  - { id: raschiatori.penitenza, nome: La penitenza, categoria: stato, descrizione: "Sei rimasto con Valdo Merlach davanti al Ferro. Prima di tornare a scendere con i Quattro devi fare un turno da solo e appendere una lanterna a tue spese." }
  - { id: raschiatori.cordata, nome: La cordata della Gradinata, categoria: stato, nascosta: true, descrizione: "1 se alla Gradinata Cieca hai tirato su la cordata della Compagnia." }
  - { id: raschiatori.mappa, immagine: icone/treasure-map, nome: La mappa della Gradinata, categoria: stato, descrizione: "La mappa dell'interno della Gradinata Cieca, oltre l'ottavo gradino. Con il diritto di prima mappa vale dieci anni di scavo." }
  - { id: raschiatori.nella, nome: Nella di Ghoran, categoria: stato, nascosta: true, descrizione: "1 se Nella è scesa con te nel Pozzo Senzanome; 2 se ha scelto la tua squadra." }
  - { id: raschiatori.salvati, nome: I salvati del Pozzo, categoria: stato, nascosta: true, descrizione: "Quanti della cordata ferma nel Pozzo Senzanome hai riportato su. Vale 1 se è risalito soltanto il fratello di Nella, 2 se ne sono risaliti tre, 3 se quattro." }
  - { id: raschiatori.merlach, nome: Valdo Merlach, categoria: stato, nascosta: true, descrizione: "1 scritto da Galdrick nel registro dei mercanti di schiavi; 2 libero, tornato verso Ghoran." }
  - { id: raschiatori.squadra, immagine: icone/rope-coil, nome: La tua squadra, categoria: accesso, descrizione: "Sei caposquadra fra i Raschiatori. Hai una squadra da guidare nei turni e le sue lanterne da curare sul Ponte dei Morti." }
  - { id: raschiatori.velo, nome: Il registro della Cripta, categoria: stato, nascosta: true, descrizione: "1 hai ceduto al Velo una copia della Carta di Korith; 2 hai copiato il registro di nascosto; 3 Ottilia te l'ha letto." }
  - { id: raschiatori.bracciale-mirta, immagine: icone/bracer, nome: Il bracciale di Mirta Sorrin, categoria: stato, descrizione: "Un bracciale di rame annerito, trovato nella quarta nicchia della camera dei quattro. Era della Fiamma rimasta di sotto in primavera, ed è ancora tiepido." }
  - { id: raschiatori.piastrine, immagine: icone/metal-disc, nome: Le piastrine della squadra dei cinque, categoria: stato, descrizione: "Cinque piastrine di Raschiatori trovate nel primo strato. Una è del padre di Stoppino." }
  - { id: raschiatori.fiamma, immagine: icone/lantern-flame, nome: Fra i Quattro, categoria: stato, descrizione: "1 porti il titolo di Fiamma dei Raschiatori; 2 l'hai rifiutato, e la sala ti chiama Lanterna dei Quattro." }

fazioni:
  - id: raschiatori
    nome: Raschiatori
    immagine: fazioni/raschiatori
    reputazione: rep.raschiatori
    pista: fazione.raschiatori
    gradi:
      - { passo: 3, nome: Mano di corda, ricompensa: "Il nome sulla bacheca passa all'inchiostro. Il bracciale dei turni, il Magazzino della bacheca e una manciata di monete." }
      - { passo: 6, nome: Scandaglio, ricompensa: "Scendi per primo nei siti nuovi. Lo Scandaglio di cristallo, che fa risparmiare un rintocco all'ingresso delle spedizioni dei Raschiatori, e un turno tuo alla Gradinata Cieca." }
      - { passo: 9, nome: Caposquadra, ricompensa: "Una squadra da guidare, con la sua rendita in cristalli e le sue lanterne. L'ascia da tunnel e i prezzi di casa al Magazzino." }
      - { passo: 12, nome: Veterano, ricompensa: "Un posto al tavolo dei Quattro quando si parla di scavi. La giubba del primo strato, la branda dei Quattro, la formula del Filo di ritorno e il Respiratore al Magazzino." }
      - { passo: 15, nome: Fiamma, ricompensa: "Il piccone della Fiamma e una borsa pesante. A chi prende il titolo il bracciale di rame dei Quattro e il prezzo della Fiamma per i cristalli; a chi lo rifiuta una borsa più pesante e il nome di Lanterna dei Quattro." }
