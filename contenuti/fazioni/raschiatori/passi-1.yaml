# La quest dei Raschiatori, Atto I e II (fazione.raschiatori 0 → 6, senza cancelli di trama tranne il prologo).
# - 0 → 1 `raschiatori-due-posti-vuoti` (Grifone, raschiatore >= 1): il turno al terzo pianerottolo con Gerardo
#   Crine, la sentinella e le corde con il gancio sconosciuto. Chi non è nei turni passa prima da
#   `raschiatori-la-garanzia-di-crine` (raschiatore == 0): Gerardo garantisce per chi ha un racconto, un poco di
#   reputazione o tre frammenti esausti, oppure dopo una prova Media, e dà raschiatore 1 senza far salire la pista.
# - 1 → 2 `raschiatori-corde-che-non-sono-nostre` (Orlo dei Rottami, Grusk; raschiatori.grusk 1) e il seguito
#   `raschiatori-le-lampade-di-notte` (il margine dei Ponti): la cordata e la Compagnia del Gancio di Valdo Merlach.
# - 2 → 3 `raschiatori-la-regola-della-casa` (Grifone, grado 1, Mano di corda): Merlach offre la paga doppia.
#   Fingere di accettare apre il doppio gioco (raschiatori.doppio 1), che si scopre al passo 9.
# - 3 → 4 `raschiatori-argento-torna-dai-conti` (Grifone): il diritto di prima mappa e la registrazione per la
#   Gradinata Cieca. Il passo 5 è la spedizione (spedizione-gradinata.yaml).
# - 5 → 6 `raschiatori-il-diritto-di-prima-mappa` (Casa dei Nodi, grado 2, Scandaglio): la Gradinata va ai
#   Raschiatori; la via dell'accordo conserva la reputazione con la Gilda, le altre la fanno scendere.
# Nomi nuovi: Gerardo Crine (il caposquadra di «respirate col naso»), Valdo Merlach e la Compagnia del Gancio,
# Mirta Sorrin (la Fiamma dispersa in primavera), Argento (dal Codex, nuovo nel gioco).
storylet:
  # ------------------------------------------------------------ la porta, per chi non è nei turni
  - id: raschiatori-la-garanzia-di-crine
    presso: grifone-di-ferro
    immagine: ambientazione/locanda-del-grifone-di-ferro
    titolo: Due righe vuote
    sommario: "Alla bacheca del Grifone ci sono due posti liberi nella squadra di Gerardo Crine, ma serve qualcuno che garantisca."
    luogo: Locanda del Grifone di Ferro, la bacheca
    area: ponti-sospesi
    requisiti: [fazione.raschiatori == 0, raschiatore == 0, prologo == 0, pista.capomozzo >= 10]
    testo: |
      Alla bacheca del Grifone, sotto la lampada che fuma, è appeso un foglio
      nuovo nella grafia larga di Dragna. In cima c'è scritto *due posti
      nella squadra di Gerardo Crine*, e sotto ci sono due righe vuote.
      Gerardo siede al tavolo accanto, un uomo sui cinquant'anni con la barba
      tagliata a colpi di coltello e un pollice fasciato nella tela cerata.
      Dopo la razzia la sua squadra è scesa a quattro, e Dragna non scrive un
      nome nuovo sui turni senza qualcuno che garantisca. Stasera garantisce
      lui, e prima di parlare ti guarda le mani.

      {conoscenze-della-strada Facile} Un caposquadra che garantisce per uno
      sconosciuto ci mette il proprio nome accanto, e se resti di sotto la
      lanterna sul Ponte la paga lui.

      «Respirate col naso» dice, che è la prima cosa che dice a tutti. «Mi
      servono due mani che reggono la corda senza tremare. Chi me le
      garantisce?»

      {resistenza Media fallita} Le tue mani, appena lui le guarda, decidono
      di avere freddo, e le infili sotto il tavolo.
    opzioni:
      - testo: "Raccontargli la notte della razzia"
        descrizione: "Quando sono arrivati gli orchi eri sui Ponti anche tu, e al Grifone qualcuno se lo ricorda."
        requisiti: [racconto >= 1]
        esito:
          titolo: Quella notte
          testo: |
            Gli racconti senza abbellirla la notte del Festival, quando tagliavano
            le corde e la gente correva sulle assi. A metà Gerardo ti ferma con la
            mano fasciata, perché un Raschiatore al tavolo accanto si è girato a
            dire che c'era anche lui. Scrive il tuo nome a matita sulla prima riga
            e ti aspetta domattina al terzo pianerottolo, con il bracciale carico
            e le mani vuote.
          effetti: { raschiatore: 1, rep.raschiatori: 0.5 }
      - testo: "Fargli dire dai Raschiatori chi sei"
        descrizione: "Fra i Raschiatori qualcuno ti conosce già, e la sua parola vale più delle tue."
        requisiti: [rep.raschiatori >= 1]
        esito:
          titolo: Una parola dal bancone
          testo: |
            Al bancone un Raschiatore della veglia ti riconosce e alza il boccale
            di due dita, il saluto della gente dei turni. Gerardo lo vede e va a
            scrivere il tuo nome a matita sulla prima riga. Domattina ti aspetta
            al terzo pianerottolo con il bracciale carico e le mani vuote.
          effetti: { raschiatore: 1, rep.raschiatori: 0.5 }
      - testo: "Posargli sul tavolo tre frammenti esausti"
        descrizione: "Fra i Raschiatori chi porta su i frammenti dalle rovine ha già fatto metà del mestiere."
        requisiti: [cristalli.frammento-esausto >= 3]
        esito:
          titolo: Tre frammenti
          testo: |
            Gerardo prende uno dei tre frammenti grigi, lo gira contro la lampada
            e lo annusa. Ti chiede se li hai staccati tu o comprati, e prima che
            tu risponda se li mette in tasca tutti e tre. Poi scrive il tuo nome a
            matita sulla prima riga, e ti aspetta domattina al terzo pianerottolo.
          effetti: { raschiatore: 1, cristalli.frammento-esausto: -3 }
      - testo: "Convincerlo che la corda la reggi"
        descrizione: "Gerardo vuole sapere che cosa fai quando la corda gira e sotto c'è il buio."
        prova: { attributo: sociale, abilita: [persuasione, conoscenze-della-strada], difficolta: Media }
        successo:
          titolo: La prima riga
          testo: |
            Gli dici quello che faresti con la corda che gira e quello che non
            faresti, e la seconda parte gli interessa di più. Gerardo si gratta la
            barba con il pollice fasciato e scrive il tuo nome a matita sulla
            prima riga. Domattina ti aspetta al terzo pianerottolo, e se arrivi
            tardi la riga la cancella lui.
          effetti: { raschiatore: 1, rep.raschiatori: 0.5 }
        fallimento:
          titolo: Torna con qualcuno
          testo: |
            Gli parli troppo e troppo in fretta, e Gerardo ti ascolta per
            educazione guardando la porta, dove è appena entrato un ragazzo con le
            spalle larghe. Ti dice di tornare con qualcuno che garantisca per te e
            va incontro al ragazzo.
          effetti: { scandalo: 0.5 }

  # ------------------------------------------------------------ 0 → 1 · due posti vuoti
  - id: raschiatori-due-posti-vuoti
    presso: grifone-di-ferro
    immagine: ambientazione/cicatrice-del-mondo
    titolo: Due posti vuoti
    sommario: "Al terzo pianerottolo c'è una vena buona, e una sentinella accanto."
    luogo: Locanda del Grifone di Ferro, poi il terzo pianerottolo della Cicatrice
    area: ponti-sospesi
    requisiti: [fazione.raschiatori == 0, raschiatore >= 1, prologo == 0, pista.capomozzo >= 10]
    testo: |
      Dragna Gro-Malog ti vede entrare e batte due volte i monconi della mano
      sinistra sul tavolo, il *vieni qui* dei Raschiatori. Accanto a lei
      siede Gerardo Crine, la barba tagliata a colpi di coltello e un pollice
      fasciato nella tela cerata, che ti stringe la mano tirandola appena
      verso di sé, come si prova un nodo prima di fidarsene. Dopo la razzia
      la sua squadra è scesa a quattro.

      Al tavolo dei Quattro la sedia di Fiamma è vuota dalla primavera, da
      quando Mirta Sorrin è scesa nel primo strato senza risalire, e nessuno
      ci appoggia nemmeno il cappello.

      Il giorno dopo scendete al terzo pianerottolo, dove la parete della
      Cicatrice ha una vena buona che nessuno ha finito di staccare. Accanto
      alla vena, incassata nella roccia, c'è una sentinella della
      Salvaguardia grande come un cane accucciato, e sul suo dorso gira una
      luce sempre più svelta.

      {tecnologia Media} Si sta svegliando, e quando la luce smetterà di
      accelerare avrà finito di decidere che cosa sei.

      «Respirate col naso» dice Gerardo, che lo dice di ogni cosa. «E
      decidete in fretta.»

      {origine apprendista-raschiatore} I nodi di Gerardo sono quelli che ti
      hanno insegnato sulle piattaforme, con il giro in più per le corde
      bagnate, e le mani li rifanno da sole dentro la tasca.
    opzioni:
      - testo: "Spegnerla prima che finisca di svegliarsi"
        descrizione: "Sotto il guscio c'è una piastra che le fa dormire, da trovare prima che la luce si fermi."
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Media }
        successo:
          titolo: La piastra
          testo: |
            Premi con il pollice la piastra più fredda del guscio, e la luce
            rallenta fino a fermarsi mentre Gerardo fischia piano. Sotto i
            cristalli trovate due corde fresche di nessuna squadra dei turni e un
            gancio di forgia sconosciuta, e al Grifone Dragna, rigirandolo fra le
            dita buone, ti chiede di scoprire chi lavora la parete di notte.
          pe: { tecnologia: 3 }
          effetti: { cristalli.frammento-esausto: 2, cristalli.cristallo-sterile: 1, rep.raschiatori: 0.5, fazione.raschiatori: 1 }
        fallimento:
          titolo: La scintilla
          testo: |
            La luce si ferma proprio mentre trovi la piastra, e una scintilla ti
            brucia il dorso della mano prima che Gerardo spacchi la sentinella col
            piccone. Della vena portate su poco, ma sotto i cristalli ci sono due
            corde fresche di nessuna squadra dei turni e un gancio di forgia
            sconosciuta. Al Grifone Dragna ti chiede di scoprire chi lavora la
            parete di notte.
          effetti: { cristalli.frammento-esausto: 1, ferite: 1, fazione.raschiatori: 1 }
      - testo: "Staccare la vena e risalire in fretta"
        descrizione: "Tre colpi di piccone per cristallo, e se la sentinella si sveglia siete già sopra."
        prova: { attributo: fisico, abilita: atletica, difficolta: Media }
        successo:
          titolo: In fretta
          testo: |
            Tu stacchi i cristalli e Gerardo tiene la corda, e quando la luce
            smette di girare sei già a mezza corda con il sacco legato in vita.
            Sotto i cristalli sono rimaste due corde fresche di nessuna squadra
            dei turni e un gancio di forgia sconosciuta, e al Grifone Dragna ti
            chiede di scoprire chi lavora la parete di notte.
          pe: { atletica: 3 }
          effetti: { cristalli.frammento-esausto: 2, cristalli.cristallo-sterile: 1, rep.raschiatori: 0.5, fazione.raschiatori: 1 }
        fallimento:
          titolo: La folata
          testo: |
            Il piccone ti scivola di mano e sparisce nel buio, e quando la
            sentinella sbuffa una folata grigia il campo del bracciale regge a
            stento. Risali con il sacco quasi vuoto, ma sotto la vena avete visto
            due corde fresche di nessuna squadra dei turni e un gancio di forgia
            sconosciuta. Al Grifone Dragna ti chiede di scoprire chi lavora la
            parete di notte.
          effetti: { cristalli.frammento-esausto: 1, contaminazione: 1, ferite: 0.5, fazione.raschiatori: 1 }
      - testo: "Affrontarla con il piccone"
        descrizione: "È una macchina piccola, e il pianerottolo è stretto per tutti e due."
        combattimento: raschiatori-sentinella
        vittoria:
          titolo: Il guscio aperto
          testo: |
            La sentinella ti viene addosso a scatti, e la colpisci sul guscio
            finché il metallo cede con un rumore di pentola. Sotto i cristalli
            trovate due corde fresche di nessuna squadra dei turni e un gancio di
            forgia sconosciuta, e al Grifone Dragna ti chiede di scoprire chi
            lavora la parete di notte.
          effetti: { cristalli.frammento-esausto: 2, cristalli.cristallo-sterile: 1, rep.raschiatori: 0.5, fazione.raschiatori: 1 }
        sconfitta:
          titolo: Il pianerottolo stretto
          testo: |
            La sentinella ti spinge con mezza schiena sopra il vuoto, finché
            Gerardo te la stacca di dosso a colpi di piccone e la butta di sotto.
            Dove stava incassata ci sono due corde fresche di nessuna squadra dei
            turni e un gancio di forgia sconosciuta, e al Grifone Dragna ti chiede
            di scoprire chi lavora la parete di notte.
          effetti: { cristalli.frammento-esausto: 1, fazione.raschiatori: 1 }
      - testo: "Chiedere a Gerardo come fanno i vecchi"
        descrizione: "Il modo lento e sicuro dei veterani, che Gerardo spiega malvolentieri."
        costo: 2
        esito:
          titolo: Il modo dei vecchi
          testo: |
            Coprite le lampade con la giubba e aspettate al buio finché la luce
            della sentinella si ferma da sola. Ci vuole quasi tutto il turno, e
            della vena portate su poco. Sotto i cristalli trovate due corde
            fresche di nessuna squadra dei turni e un gancio di forgia
            sconosciuta, e al Grifone Dragna ti chiede di scoprire chi lavora la
            parete di notte.
          pe: { resilienza: 3 }
          effetti: { cristalli.frammento-esausto: 2, rep.raschiatori: 0.5, fazione.raschiatori: 1 }
      - testo: "Ricordare a Gerardo la sporgenza di Nilo"
        descrizione: "Dalla sporgenza dove aspettava Nilo, la sera in cui mancava, si lavora sopra la sentinella."
        quando: [visto.carta-un-raschiatore-disperso >= 1]
        esito:
          titolo: La sporgenza del ragazzo
          testo: |
            Gerardo la chiama la sporgenza del ragazzo, e sorride storto per la
            prima volta da stamattina. Da lassù staccate la vena senza che la luce
            cambi passo, e sotto i cristalli trovate due corde fresche di nessuna
            squadra dei turni e un gancio di forgia sconosciuta. Al Grifone Dragna
            ti chiede di scoprire chi lavora la parete di notte.
          effetti: { cristalli.frammento-esausto: 2, cristalli.cristallo-sterile: 1, rep.raschiatori: 0.5, fazione.raschiatori: 1 }
      - testo: "Fare i nodi di Gerardo e calarti sopra la sentinella"
        descrizione: "Un giro in più per la corda bagnata, e si lavora appesi sopra la macchina."
        quando: [origine.apprendista-raschiatore >= 1]
        esito:
          titolo: I nodi giusti
          testo: |
            Gerardo controlla il tuo nodo con due dita senza dire niente, che da
            lui vale una lode. Lavori appeso sopra la sentinella, e sotto la vena
            trovi due corde fresche di nessuna squadra dei turni e un gancio di
            forgia sconosciuta. Al Grifone Dragna ti chiede di scoprire chi lavora
            la parete di notte.
          pe: { atletica: 3 }
          effetti: { cristalli.frammento-esausto: 2, cristalli.cristallo-sterile: 1, rep.raschiatori: 0.5, fazione.raschiatori: 1 }

  # ------------------------------------------------------------ 1 → 2 · corde che non sono nostre
  - id: raschiatori-corde-che-non-sono-nostre
    presso: orlo-dei-rottami
    immagine: personaggi/grusk
    titolo: Corde che non sono nostre
    sommario: "Grusk tiene in un cesto a parte una ventina di ganci che nessuna forgia della città ha battuto."
    luogo: Orlo dei Rottami, accanto alla carriola rossa
    area: citta-bassa
    requisiti: [fazione.raschiatori == 1, raschiatori.grusk == 0]
    testo: |
      L'Orlo dei Rottami è la spiaggia di ghiaia e ferro dove la Città Bassa
      finisce contro la Cicatrice, e dove i Raschiatori buttano quello che
      non vale la fatica di portare al Mercato. Grusk siede sul bordo della
      sua carriola rossa, con la bilancia storta appesa a un palo. Accanto,
      in un cesto a parte, ci sono una ventina di ganci con la stessa curva e
      lo stesso occhiello schiacciato a martello.

      {conoscenze-della-strada Media} All'Orlo un cesto a parte è merce
      portata di notte e pagata bene, che Grusk non vuole pesare con il
      resto.

      «Comprati a peso» dice Grusk, battendo la mano sulla bilancia. «Il
      ferro è ferro, e io non chiedo da dove viene.»

      {origine fuggiasco-di-ghoran} Il nodo che pende ancora da un occhiello
      è quello dei collari di Ghoran, che si stringe quando chi lo porta
      tira, e le dita ti vanno al collo.
    opzioni:
      - testo: "Farlo parlare del fornitore"
        descrizione: "Grusk parla volentieri di tutto, tranne che di chi gli vende la merce."
        prova: { attributo: sociale, abilita: conoscenze-della-strada, difficolta: Media }
        successo:
          titolo: Le lampade dal fondo
          testo: |
            Gli parli del prezzo del ferro, e la bottiglia passa due volte da lui
            a te. Alla terza Grusk ti dice che i ganci glieli porta di notte un
            tale con la giubba cerata, che risale dalla Cicatrice dove non c'è
            nessun turno, e che le loro lampade si vedono dal margine dei Ponti
            dopo la seconda campana.
          imposta: { raschiatori.grusk: 1 }
          effetti: { informazioni.voce: 1 }
          segue: raschiatori-le-lampade-di-notte
        fallimento:
          titolo: La regola di Grusk
          testo: |
            Grusk ti punta contro il collo della bottiglia per ripeterti la sua
            regola. A stare zitto però si annoia, e mentre te ne vai ti dice di
            guardare giù dal margine dei Ponti dopo la seconda campana.
          imposta: { raschiatori.grusk: 1 }
          segue: raschiatori-le-lampade-di-notte
          effetti: { sospetto: 0.5 }
      - testo: "Comprargli un gancio, e il nome con il gancio"
        descrizione: "Qualche moneta in più della bilancia, e Grusk si ricorda chi gliel'ha venduto."
        requisiti: [monete >= 5]
        esito:
          titolo: Il peso giusto
          testo: |
            Grusk pesa prima il gancio e poi le monete, che gli piacciono di più.
            Il tale con la giubba cerata gli porta i ganci di notte, risalendo
            dalla Cicatrice dove non c'è nessun turno, e le sue lampade si vedono
            dal margine dei Ponti dopo la seconda campana.
          imposta: { raschiatori.grusk: 1 }
          effetti: { monete: -5, informazioni.voce: 1 }
          segue: raschiatori-le-lampade-di-notte
      - testo: "Aspettare che finisca la bottiglia"
        descrizione: "Quando la bottiglia è vuota Grusk parla da solo, ma ci vuole un pomeriggio."
        costo: 2
        esito:
          titolo: A bottiglia vuota
          testo: |
            Aspetti sulla ghiaia mentre Grusk beve e attacca una canzone degli
            orchi che dimentica a metà, finché si mette a parlare con la bilancia.
            Le racconta del tale con la giubba cerata che gli porta i ganci di
            notte dalla Cicatrice, e di lampade che scendono in fila dopo la
            seconda campana.
          imposta: { raschiatori.grusk: 1 }
          effetti: { informazioni.voce: 1 }
          segue: raschiatori-le-lampade-di-notte
      - testo: "Dirgli di chi è quel nodo"
        descrizione: "Quel nodo l'hai portato al collo, e Grusk sa che cosa vuol dire."
        quando: [origine.fuggiasco-di-ghoran >= 1]
        esito:
          titolo: Il nodo dei collari
          testo: |
            Sciogli il nodo dall'occhiello e lo rifai davanti a lui, stretto come
            a Ghoran. Grusk borbotta che lui compra ferro e basta, poi ti parla
            del tale con la giubba cerata che gli porta i ganci di notte dalla
            Cicatrice, e delle lampade che si vedono dal margine dei Ponti dopo la
            seconda campana. Il ferro, aggiunge senza guardarti, te lo regala.
          imposta: { raschiatori.grusk: 1 }
          effetti: { informazioni.voce: 1 }
          segue: raschiatori-le-lampade-di-notte

  - id: raschiatori-le-lampade-di-notte
    presso: ponte-delle-mille-corde
    immagine: ambientazione/cicatrice-del-mondo
    titolo: Le lampade di notte
    tipo: seguito
    luogo: Il margine dei Ponti, dopo la seconda campana
    area: ponti-sospesi
    requisiti: [fazione.raschiatori == 1]
    testo: |
      Dopo la seconda campana il margine dei Ponti è un'asse lunga e bagnata
      fra il parapetto e la Cicatrice, e le lanterne di Mana stanno
      abbastanza lontane perché gli occhi si abituino al buio. Ti siedi con
      le gambe sopra il vuoto e aspetti con il bavero alzato.

      Verso mezzanotte, più a levante dei turni di Dragna, si accendono sette
      lampade da scavo, che scendono in fila lungo la parete dove sulle mappe
      dei Raschiatori non c'è nessun pianerottolo.

      {percezione Media} Cinque lampade scendono a strattoni, tutte insieme,
      mentre le altre due stanno ferme sopra di loro e si muovono soltanto
      quando le prime si fermano.

      {origine figlio-della-citta-bassa} Sotto quel tratto di parete, dicono
      nei vicoli, c'è un pozzo cieco che sbuca dietro le concerie, per chi
      preferisce evitare l'argano.
    opzioni:
      - testo: "Seguire le lampade giù per le corde"
        descrizione: "Una corda di servizio scende fino a una sporgenza, da dove li vedresti da vicino, e loro te."
        prova: { attributo: fisico, abilita: furtivita, difficolta: Media }
        successo:
          titolo: La cordata
          testo: |
            Dalla sporgenza vedi cinque legati in cordata, scalzi, con un collare
            di corda al collo. Sopra di loro due uomini armati tengono la corda
            madre, con un gancio di ferro dipinto sulla manica.

            Al Grifone Dragna ti dice il nome, Valdo Merlach della Compagnia del
            Gancio, il caposquadra che lei cacciò quando entrò al Grifone con uno
            schiavo. Adesso lavora per la Gilda con carne comprata a Ghoran.
          pe: { furtivita: 3 }
          effetti: { fazione.raschiatori: 1, informazioni.voce: 1, rep.raschiatori: 0.5 }
        fallimento:
          titolo: Il dardo
          testo: |
            A metà corda ti scappa il piede, e un dardo si pianta nella roccia a
            un palmo dalla tua mano, tirato da uno con un gancio di ferro dipinto
            sulla manica.

            Al Grifone Dragna ti dice il nome, Valdo Merlach della Compagnia del
            Gancio, il caposquadra che lei cacciò quando entrò al Grifone con uno
            schiavo. Adesso lavora per la Gilda con carne comprata a Ghoran.
          effetti: { fazione.raschiatori: 1, informazioni.voce: 1, ferite: 1 }
      - testo: "Contare le lampade dall'alto fino all'alba"
        descrizione: "Chi scende di notte deve risalire prima dell'alba."
        prova: { attributo: mentale, abilita: percezione, difficolta: Media }
        successo:
          titolo: Il carro all'alba
          testo: |
            All'alba le lampade risalgono e spariscono dietro una sporgenza, e
            poco dopo sulla strada delle concerie passa un carro coperto con un
            gancio di ferro dipinto sulla tela.

            Al Grifone Dragna ti dice il nome, Valdo Merlach della Compagnia del
            Gancio, il caposquadra che lei cacciò quando entrò al Grifone con uno
