          testo: |
            Il custode conta le monete alla luce della stufa e ti dice che quelle
            lampade sono del Gancio, che scende dove vuole con un contratto della
            Gilda dal timbro buono.

            Al Grifone Dragna ti spiega che il Gancio è di Valdo Merlach, il
            caposquadra che lei cacciò quando entrò al Grifone con uno schiavo, e
            che adesso lavora per la Gilda con carne comprata a Ghoran.
          effetti: { monete: -5, fazione.raschiatori: 1, informazioni.voce: 1 }
      - testo: "Aspettarli all'uscita del pozzo cieco"
