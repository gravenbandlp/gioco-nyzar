  # ------------------------------------------------------------ 2 → 3 · la regola della casa (grado 1)
  - id: raschiatori-la-regola-della-casa
    presso: grifone-di-ferro
    immagine: ambientazione/locanda-del-grifone-di-ferro
    titolo: La regola della casa
    sommario: "Valdo Merlach entra al Grifone a mani vuote e offre la paga doppia a chi scende per lui."
    luogo: Locanda del Grifone di Ferro, la sala, di sera
    area: ponti-sospesi
    requisiti: [fazione.raschiatori == 2]
    testo: |
      La sera, nel Grifone pieno fino alle scale, entra un uomo solo con la
      barba fatta di fresco e una giubba cerata che sotto le piattaforme non
      è mai scesa. Si ferma sulla soglia per far vedere che ha le mani vuote,
      e la sala abbassa la voce un tavolo alla volta. Valdo Merlach ordina da
      bere per tutti, e Brunella guarda Dragna, che non fa il cenno, così la
      birra resta nella botte.

      «Paga doppia a chi scende per la Compagnia del Gancio» dice Merlach
      alla sala con la sua voce bassa. «Corde e lampade le metto io, e c'è un
      contratto della Gilda con il timbro buono.» Poi si volta verso di te,
      davanti a tutti. «E tu, che hai trovato i miei ganci. Uno che sa
      guardare mi serve, e ti pago meglio di Dragna.»

      *Davanti a tutti, così un no diventa un affronto.* Dragna ha posato la
      penna di traverso e tiene la mano buona sul manico dell'ascia.

      {origine apprendista-raschiatore} Ai primi turni ti hanno raccontato
      del caposquadra cacciato dal Grifone, senza dirti il nome, e adesso ha
      anche una faccia.

      {origine mercante-dei-ponti} Il contratto alla sua cintura ha la cera
      verde e la piega dei contratti del consiglio interno, e qualcuno al
      terzo piano della Casa dei Nodi paga questa compagnia.
    opzioni:
      - testo: "Rifiutare e dire perché, davanti a tutti"
        descrizione: "In questa sala gli schiavi non entrano, e va detto in modo che la sala lo ripeta."
        prova: { attributo: sociale, abilita: [persuasione, intimidire], difficolta: Media }
        successo:
          titolo: La regola della casa
          testo: |
            Gli dici senza alzare la voce che da qui chi scende sulla schiena
            degli altri esce in strada come lui, e i boccali battono sul legno
            finché Merlach se ne va.

            Dragna ripassa il tuo nome a inchiostro, premendo fino a bucare la
            carta, e ti allaccia al polso un bracciale dei turni. Da domani al
            Magazzino della bacheca sei di casa, e Argento ti vuole al suo tavolo.
          pe: { persuasione: 3, atletica: 5 }
          almeno: { rep.raschiatori: 2 }
          effetti: { fazione.raschiatori: 1, monete: 30, oggetto.raschiatori-bracciale-dei-turni: 1 }
        fallimento:
          titolo: Le parole storte
          testo: |
            La frase sugli schiavi ti esce storta e fa ridere un tavolo in fondo, e
            Merlach, uscendo, dice alla sala che sul tuo nome c'è ancora la matita.

            Dragna ripassa lo stesso il tuo nome a inchiostro, perché il no era
            giusto, e ti allaccia al polso un bracciale dei turni. Da domani al
            Magazzino della bacheca sei di casa, e Argento ti vuole al suo tavolo.
          pe: { atletica: 5 }
          almeno: { rep.raschiatori: 2 }
          effetti: { fazione.raschiatori: 1, monete: 30, oggetto.raschiatori-bracciale-dei-turni: 1, scandalo: 1 }
      - testo: "Dirgli che ci pensi"
        descrizione: "In questa sala un ci penso è già un no, ma Merlach non lo sa e paga lo stesso."
        prova: { attributo: sociale, abilita: ingannare, difficolta: Difficile }
        successo:
          titolo: Ci penso
          testo: |
            Gli dici che ci pensi. Merlach ti guarda un momento di troppo, e
            un'ora dopo, sul ponte, uno dei suoi ti mette in mano una borsa e ti
            dice dove trovarlo.

            Dragna ripassa il tuo nome a inchiostro e ti allaccia al polso un
            bracciale dei turni. Da domani al Magazzino della bacheca sei di casa,
            e Argento ti vuole al suo tavolo.
          pe: { ingannare: 3, atletica: 5 }
          almeno: { rep.raschiatori: 2 }
          imposta: { raschiatori.doppio: 1 }
          effetti: { fazione.raschiatori: 1, monete: 50, oggetto.raschiatori-bracciale-dei-turni: 1 }
        fallimento:
          titolo: Uno di Dragna
          testo: |
            Merlach scoppia a ridere e ti dice che sei di Dragna fino alle unghie,
            poi se ne va mentre la sala ride di te.

            Dragna ripassa lo stesso il tuo nome a inchiostro, perché il no era
            giusto, e ti allaccia al polso un bracciale dei turni. Da domani al
            Magazzino della bacheca sei di casa, e Argento ti vuole al suo tavolo.
          pe: { atletica: 5 }
          almeno: { rep.raschiatori: 2 }
          effetti: { fazione.raschiatori: 1, monete: 30, oggetto.raschiatori-bracciale-dei-turni: 1, scandalo: 1 }
      - testo: "Togliergli la mano dal bancone"
        descrizione: "Merlach si appoggia al bancone di Brunella come a casa sua."
        prova: { attributo: fisico, abilita: rissa, difficolta: Media }
        successo:
          titolo: Il bancone di Brunella
          testo: |
            Gli sollevi il polso dal bancone come si toglie un gatto da una sedia,
            e per qualche secondo nessuno dei due molla, finché Dragna vi separa e
            Merlach se ne va.

            Dragna ripassa il tuo nome a inchiostro e ti allaccia al polso un
            bracciale dei turni, ricordandoti che qui si picchia fuori. Da domani
            al Magazzino della bacheca sei di casa, e Argento ti vuole al suo
            tavolo.
          pe: { rissa: 3, atletica: 5 }
          almeno: { rep.raschiatori: 2 }
          effetti: { fazione.raschiatori: 1, monete: 30, oggetto.raschiatori-bracciale-dei-turni: 1 }
        fallimento:
          titolo: Il gomito di Merlach
          testo: |
            Merlach gira il polso prima che tu stringa, e il suo gomito ti arriva
            sotto lo zigomo. Se ne va massaggiandosi le nocche.

            Dragna ripassa il tuo nome a inchiostro e ti allaccia al polso un
            bracciale dei turni, ricordandoti che qui si picchia fuori. Domani
            torna Argento, e ti consiglia del ghiaccio per presentarti al suo
            tavolo con tutti e due gli occhi aperti.
          pe: { atletica: 5 }
          almeno: { rep.raschiatori: 2 }
          effetti: { fazione.raschiatori: 1, monete: 30, oggetto.raschiatori-bracciale-dei-turni: 1, ferite: 1 }
      - testo: "Lasciare che risponda Dragna"
        descrizione: "Al Grifone la regola della casa la fa rispettare lei, da nove anni."
        esito:
          titolo: Otto dita sul tavolo
          testo: |
            Dragna si alza, attraversa la sala senza fretta e batte i monconi sul
            bancone una volta sola. Merlach paga la birra e se ne va augurandoti
            buona caccia.

            Poi Dragna ripassa il tuo nome a inchiostro e ti allaccia al polso un
            bracciale dei turni, dicendoti che la prossima volta rispondi tu. Da
            domani al Magazzino della bacheca sei di casa, e Argento ti vuole al
            suo tavolo.
          almeno: { rep.raschiatori: 2 }
          effetti: { fazione.raschiatori: 1, monete: 30, oggetto.raschiatori-bracciale-dei-turni: 1 }
      - testo: "Leggere il suo contratto ad alta voce"
        descrizione: "Letto davanti alla sala, il contratto di Merlach dice chi lo paga."
        quando: [origine.mercante-dei-ponti >= 1]
        esito:
          titolo: La cera verde
          testo: |
            Merlach ti dà il contratto per mostrare che non ha niente da
            nascondere, e tu lo leggi ad alta voce fino al timbro del consiglio
            interno e alle due sigle accanto, che tutti si segnano a mente.

            Dragna ripassa il tuo nome a inchiostro e ti allaccia al polso un
            bracciale dei turni. Da domani al Magazzino della bacheca sei di casa,
            e Argento ti vuole al suo tavolo.
          pe: { politica-ed-economia: 3, atletica: 5 }
          almeno: { rep.raschiatori: 2 }
          effetti: { fazione.raschiatori: 1, monete: 30, oggetto.raschiatori-bracciale-dei-turni: 1 }

  # ------------------------------------------------------------ 3 → 4 · Argento torna dai conti
  - id: raschiatori-argento-torna-dai-conti
    presso: grifone-di-ferro
    immagine: fazioni/raschiatori
    titolo: Argento torna dai conti
    sommario: "Argento rientra al Grifone dopo due settimane, e la Gilda ha appena riaperto la cartografia del sottosuolo."
    luogo: Locanda del Grifone di Ferro, il tavolo dei Quattro
    area: ponti-sospesi
    requisiti: [fazione.raschiatori == 3]
    testo: |
      Argento, un nano anziano con la barba intrecciata di schegge di vetro,
      rientra al Grifone con il bastone di cristallo che batte sulle assi
      alternato alla gamba di legno. Si siede davanti a Dragna, apre un libro
      dei conti e ti fa cenno di sederti.

      «In due settimane la Gilda ha riaperto la cartografia del sottosuolo»
      dice, con un accento che non sai collocare. Con il diritto di prima
      mappa, chi consegna per primo alla Casa dei Nodi la mappa di un sito
      censito e mai esplorato ne ha lo scavo per dieci anni.

      «Valdo Merlach ha uomini per correre dappertutto, e noi abbiamo i
      turni» dice Dragna. Argento si dà un colpetto sulla gamba di legno con
      il bastone. «I conti dicono che ci mancano le gambe.»

      {origine rampollo-dei-quartieri-alti} Conosci almeno due famiglie di
      consiglieri che l'hanno votato, e sugli scavi scommettono come sui
      cavalli.
    opzioni:
      - testo: "Leggere le clausole con Argento"
        descrizione: "Un regolamento scritto in fretta ha sempre una clausola che chi l'ha scritto non ha riletto."
        prova: { attributo: mentale, abilita: politica-ed-economia, difficolta: Media }
        successo:
          titolo: La clausola dodici
          testo: |
            Alla dodicesima clausola ti fermi, perché per registrare un sito basta
            una persona sul posto e non una squadra intera. Argento grugnisce, che
            da lui è un applauso, e ti registra per la Gradinata Cieca, tre giorni
            a ovest vicino al Bosco della Forca, l'unico sito che Merlach non ha
            ancora segnato. Ti manda alla Superficie Fratturata a riportare una
            mappa e anche te stesso.
          pe: { politica-ed-economia: 3 }
          effetti: { fazione.raschiatori: 1, monete: 10, rep.raschiatori: 0.5 }
        fallimento:
          titolo: L'accento di Argento
          testo: |
            Alla quinta clausola ti perdi, e Argento trova da solo la dodicesima,
            dove basta una persona sul posto per registrare un sito. Ti registra per
            la Gradinata Cieca, tre giorni a ovest vicino al Bosco della Forca,
            l'unico sito che Merlach non ha ancora segnato, e ti manda alla
            Superficie Fratturata.
          effetti: { fazione.raschiatori: 1, monete: 10, scandalo: 0.5 }
      - testo: "Andare a sentire Tarquin Cordani alla Casa dei Nodi"
        descrizione: "Il Sovrintendente vorrebbe un concorso pulito, ma forse non ha i voti."
        prova: { attributo: sociale, abilita: [galateo, persuasione], difficolta: Media }
        successo:
          titolo: Il Sovrintendente
          testo: |
            Tarquin Cordani ti riceve in piedi, con la parrucca storta e l'aria di
            chi ha dormito in ufficio. Per un concorso pulito gli mancano i voti,
            però ti mostra il registro dei siti segnati dalla Compagnia, dove ne
            manca uno solo. Al Grifone Argento ti registra per quello, la
            Gradinata Cieca, tre giorni a ovest vicino al Bosco della Forca, e ti
            manda alla Superficie Fratturata.
          pe: { galateo: 3 }
          effetti: { fazione.raschiatori: 1, monete: 10, rep.raschiatori: 0.5 }
        fallimento:
          titolo: L'anticamera
          testo: |
            Passi la mattina nell'anticamera di Cordani su una panca più bassa
            delle altre, finché uno scrivano ti lascia dare un'occhiata al registro
            dei siti segnati, dove ne manca uno. Argento ti registra per la
            Gradinata Cieca, tre giorni a ovest vicino al Bosco della Forca, e ti
            manda alla Superficie Fratturata.
          effetti: { fazione.raschiatori: 1, monete: 10, scandalo: 1 }
      - testo: "Rimettere in ordine la cassa della bacheca"
        descrizione: "Dopo due settimane senza Argento la cassa della bacheca è un sacco di monete e biglietti."
        costo: 2
        esito:
          titolo: La cassa della bacheca
          testo: |
            Passi il pomeriggio a contare monete e stirare biglietti sotto lo
            sguardo di Argento. Quando la cassa torna ti registra per la Gradinata
            Cieca, tre giorni a ovest vicino al Bosco della Forca, l'unico sito
            che Merlach non ha ancora segnato, e ti manda alla Superficie
            Fratturata a vedere come tieni una mappa.
          pe: { resilienza: 2 }
          effetti: { fazione.raschiatori: 1, monete: 10 }
      - testo: "Dirgli quali famiglie votano con Merlach"
        descrizione: "Ai tavoli dei Quartieri Alti si sa chi scommette sugli scavi."
        quando: [origine.rampollo-dei-quartieri-alti >= 1]
        esito:
          titolo: Le scommesse delle cene
          testo: |
            Argento segna a matita i nomi che gli dici accanto ai siti già presi
            dalla Compagnia, e ne resta uno senza niente accanto. Ti registra per
            la Gradinata Cieca, tre giorni a ovest vicino al Bosco della Forca, e
            ti manda alla Superficie Fratturata a riportare una mappa.
          pe: { politica-ed-economia: 3 }
          effetti: { fazione.raschiatori: 1, monete: 10, rep.raschiatori: 0.5 }
      - testo: "Cercare nel registro della Gilda i siti già segnati"
        descrizione: "Con la licenza della Gilda il registro della Casa dei Nodi si consulta allo sportello."
        quando: [origine.mercante-dei-ponti >= 1]
        esito:
          titolo: Allo sportello
          testo: |
            Allo sportello della Casa dei Nodi la licenza parla per te, e nel
            registro la Compagnia del Gancio ha segnato tutti i siti vicini tranne
            uno. Argento ti registra per la Gradinata Cieca, tre giorni a ovest
            vicino al Bosco della Forca, e ti manda alla Superficie Fratturata a
            riportare una mappa.
          pe: { politica-ed-economia: 3 }
          effetti: { fazione.raschiatori: 1, monete: 10, rep.raschiatori: 0.5 }

  # ------------------------------------------------------------ 5 → 6 · il diritto di prima mappa (grado 2)
  - id: raschiatori-il-diritto-di-prima-mappa
    immagine: ambientazione/quartieri-alti
    titolo: Il diritto di prima mappa
    sommario: "Il consiglio della Gilda decide a chi va la Gradinata Cieca, e Merlach giura di esserci arrivato prima."
    luogo: Casa dei Nodi, la sala con le due porte
    area: quartieri-alti
    requisiti: [fazione.raschiatori == 5]
    testo: |
      Il consiglio interno della Gilda si riunisce al terzo piano della Casa
      dei Nodi, nella sala con le due porte che si chiudono da dentro. Al
      tavolo lungo siede Tarquin Cordani, il Sovrintendente, con la parrucca
      un poco storta, e accanto a lui Irsa Valbrun con il grembiule da
      bottega, mentre altri quattro consiglieri evitano di guardarti. Argento
      sta in piedi vicino a te, appoggiato al bastone, con la tua mappa della
      Gradinata arrotolata in una tela cerata.

      Dall'altra parte siede Valdo Merlach con il contratto aperto davanti, e
      giura sul timbro della Gilda di aver mandato uomini suoi oltre l'ottavo
      gradino un giorno prima di te.

      «Uomini suoi» ripete Argento piano. «Nei registri della Gilda questi
      uomini mancano, e anche nei ruoli della Compagnia.» Chi cala gli
      schiavi in cordata non li scrive da nessuna parte.

      {politica-ed-economia Difficile} Due consiglieri guardano Merlach ogni
      volta che parla Cordani, perché il diritto di prima mappa l'hanno
      votato loro.

      {origine fuggiasco-di-ghoran} Quando Argento dice *carne* nessuno al
      tavolo alza la testa, e tu ti accorgi di avere i pugni chiusi sotto il
      legno. A Ghoran la parola la usavano i compratori, davanti a te.
    opzioni:
      - testo: "Provare la mappa davanti al consiglio"
        descrizione: "Le misure dei sette gradini e quello che si trova oltre l'ottavo, dettagli che nessuno inventerebbe."
        prova: { attributo: mentale, abilita: accademiche, difficolta: Media }
        successo:
          titolo: I dettagli
          testo: |
            Racconti la mappa gradino per gradino, e Irsa Valbrun, sentito da che
            parte si vede il riflesso dello specchio d'uscita, annuisce. La
            Gradinata va ai Raschiatori, e alla porta Merlach dice a nessuno in
            particolare che gli resta il pozzo verso Ghoran.

            Sulle scale Argento ti mette al collo lo Scandaglio, un cristallo
            lungo un dito, perché da oggi scendi per primo nei siti nuovi, a
            cominciare dalla Gradinata.
          pe: { accademiche: 3 }
          almeno: { rep.raschiatori: 4 }
          effetti: { fazione.raschiatori: 1, monete: 50, oggetto.raschiatori-scandaglio: 1, rep.gilda: -0.5 }
        fallimento:
          titolo: La mappa storta
          testo: |
            Racconti la mappa con le misure in disordine ed esiti sullo specchio
            d'uscita, finché Argento la racconta lui battendo il bastone. La
            Gradinata va ai Raschiatori per due voti soli, e alla porta Merlach
            dice che gli resta il pozzo verso Ghoran.

            Sulle scale Argento ti mette al collo lo Scandaglio, un cristallo
            lungo un dito, e ti consiglia di imparare le misure.
          almeno: { rep.raschiatori: 4 }
          effetti: { fazione.raschiatori: 1, monete: 50, oggetto.raschiatori-scandaglio: 1, rep.gilda: -1, scandalo: 1 }
      - testo: "Far parlare uno dei legati che hai tirato su"
        descrizione: "Qualcuno della cordata è risalito con te dalla Gradinata, e quello che ha da dire vale più della mappa."
        quando: [raschiatori.cordata >= 1]
        prova: { attributo: sociale, abilita: empatia, difficolta: Media }
        successo:
          titolo: Una voce dalla cordata
          testo: |
            Il ragazzo della cordata, scalzo sul marmo, racconta piano chi lo ha
            calato il giorno prima di te e chi è rimasto sotto. La Gradinata va ai
            Raschiatori, e alla porta Merlach dice che gli resta il pozzo verso
            Ghoran.

            Sulle scale Argento ti mette al collo lo Scandaglio, un cristallo
            lungo un dito, perché da oggi scendi per primo nei siti nuovi, a
            cominciare dalla Gradinata.
          pe: { empatia: 3 }
          almeno: { rep.raschiatori: 4 }
          effetti: { fazione.raschiatori: 1, monete: 50, oggetto.raschiatori-scandaglio: 1, rep.gilda: -0.5 }
        fallimento:
          titolo: Il ragazzo sulla soglia
          testo: |
            Il ragazzo della cordata guarda Merlach e smette di parlare, e Argento
            finisce il racconto per lui con i numeri. La Gradinata va ai
            Raschiatori per due voti, e alla porta Merlach dice che gli resta il
            pozzo verso Ghoran.

            Sulle scale Argento ti mette al collo lo Scandaglio, un cristallo
            lungo un dito, e ti chiede di pensare tu al ragazzo, che stanotte avrà
            paura di dormire.
          almeno: { rep.raschiatori: 4 }
          effetti: { fazione.raschiatori: 1, monete: 50, oggetto.raschiatori-scandaglio: 1, rep.gilda: -1, scandalo: 1 }
      - testo: "Mettere in imbarazzo chi garantisce per Merlach"
        descrizione: "Basta chiedere a chi ha votato il diritto di prima mappa, davanti a tutti, chi paga la carne."
        prova: { attributo: sociale, abilita: politica-ed-economia, difficolta: Difficile }
        successo:
          titolo: Chi paga la carne
          testo: |
            Chiedi ai due consiglieri, con tutta la cortesia della sala, chi paga
            le corde della Compagnia e chi ci sta legato. Si astengono, la
            Gradinata va ai Raschiatori, e alla porta Merlach dice che gli resta
            il pozzo verso Ghoran.

            Sulle scale Argento ti mette al collo lo Scandaglio, un cristallo
            lungo un dito, perché da oggi scendi per primo nei siti nuovi, a
            cominciare dalla Gradinata.
          pe: { politica-ed-economia: 3 }
          almeno: { rep.raschiatori: 4 }
          effetti: { fazione.raschiatori: 1, monete: 50, oggetto.raschiatori-scandaglio: 1, rep.malgrani: -1 }
        fallimento:
          titolo: La cortesia della sala
          testo: |
            I due consiglieri ti rispondono citando tre regolamenti che non
            conosci, finché Argento srotola la mappa sotto il naso di Cordani. La
            Gradinata va ai Raschiatori per due voti, e alla porta Merlach dice
            che gli resta il pozzo verso Ghoran.

            Sulle scale Argento ti mette al collo lo Scandaglio, un cristallo
            lungo un dito, e ti dice di lasciare a lui i consiglieri.
          almeno: { rep.raschiatori: 4 }
          effetti: { fazione.raschiatori: 1, monete: 50, oggetto.raschiatori-scandaglio: 1, rep.gilda: -1, scandalo: 1 }
      - testo: "Mostrare il registro dei pagamenti dei Malgrani"
        descrizione: "Nel registro di Ottone qualche somma porta a questa sala, e sul tavolo la domanda si fa da sola."
        requisiti: [oggetto.registro-dei-malgrani >= 1]
        prova: { attributo: sociale, abilita: politica-ed-economia, difficolta: Media }
        successo:
          titolo: L'alloro impresso
          testo: |
            Posi sul tavolo il registro con l'alloro dei Malgrani, aperto alla
            pagina segnata, e i due consiglieri si astengono senza leggere la
            cifra. La Gradinata va ai Raschiatori, e alla porta Merlach dice che
            gli resta il pozzo verso Ghoran.

            Sulle scale Argento ti mette al collo lo Scandaglio, un cristallo
            lungo un dito, perché da oggi scendi per primo nei siti nuovi, a
            cominciare dalla Gradinata.
          pe: { politica-ed-economia: 3 }
          almeno: { rep.raschiatori: 4 }
          effetti: { fazione.raschiatori: 1, monete: 50, oggetto.raschiatori-scandaglio: 1, rep.malgrani: -1 }
        fallimento:
          titolo: La pagina sbagliata
          testo: |
            Apri il registro alla pagina sbagliata, e i due consiglieri hanno il
            tempo di indignarsi prima che Argento lo chiuda sotto il palmo e
            srotoli la mappa. La Gradinata va ai Raschiatori per due voti, e alla
            porta Merlach dice che gli resta il pozzo verso Ghoran.

            Sulle scale Argento ti mette al collo lo Scandaglio, un cristallo
            lungo un dito, e ti consiglia di tenere quel registro più stretto.
          almeno: { rep.raschiatori: 4 }
          effetti: { fazione.raschiatori: 1, monete: 50, oggetto.raschiatori-scandaglio: 1, rep.gilda: -1, scandalo: 1 }
      - testo: "Proporre a Cordani di dividere le spese della mappa"
        descrizione: "Una mappa pagata a metà dalla Gilda resta dei Raschiatori, e la Gilda ne ha una copia."
        prova: { attributo: sociale, abilita: persuasione, difficolta: Difficile }
        successo:
          titolo: L'accordo
          testo: |
            Proponi che la Gilda paghi metà della mappa per una copia d'archivio,
            e che lo scavo resti ai Raschiatori. Perfino i due consiglieri votano
            a favore senza perdere la faccia, e alla porta Merlach dice che gli
            resta il pozzo verso Ghoran.

            Sulle scale Argento ti mette al collo lo Scandaglio, un cristallo
            lungo un dito, contento che tu abbia venduto metà mappa a chi voleva
            rubarla tutta.
          pe: { persuasione: 3 }
          almeno: { rep.raschiatori: 4 }
          effetti: { fazione.raschiatori: 1, monete: 50, oggetto.raschiatori-scandaglio: 1, rep.gilda: 0.5 }
        fallimento:
          titolo: Mezza mappa
          testo: |
            Un consigliere chiede se la Gilda pagherebbe la metà con le misure o
            quella con il buio, e Argento chiede il voto sul regolamento. La
            Gradinata va ai Raschiatori per due voti, e alla porta Merlach dice
            che gli resta il pozzo verso Ghoran.

            Sulle scale Argento ti mette al collo lo Scandaglio, un cristallo
            lungo un dito, e ti consiglia di scrivere gli accordi prima di
            proporli.
          almeno: { rep.raschiatori: 4 }
          effetti: { fazione.raschiatori: 1, monete: 50, oggetto.raschiatori-scandaglio: 1, rep.gilda: -1, scandalo: 1 }
      - testo: "Lasciar parlare Argento"
        descrizione: "Argento parla bene, però parla da Raschiatore e la Gilda se lo ricorderà."
        esito:
          titolo: Il bastone sul pavimento
          testo: |
            Argento parla per tutti e due, battendo il bastone a ogni numero, e
            quando arriva ai legati che nessuno registra l'accento gli esce tutto.
            La Gradinata va ai Raschiatori, e alla porta Merlach dice che gli
            resta il pozzo verso Ghoran.

            Sulle scale Argento ti mette al collo lo Scandaglio, un cristallo
            lungo un dito, e ti avverte che domani la Gilda ce l'avrà con te.
          almeno: { rep.raschiatori: 4 }
          effetti: { fazione.raschiatori: 1, monete: 50, oggetto.raschiatori-scandaglio: 1, rep.gilda: -1 }
      - testo: "Proporre l'accordo da mercante a mercante"
        descrizione: "Detto da uno con la licenza, dividere una spesa suona come una cosa della Gilda."
        quando: [origine.mercante-dei-ponti >= 1]
        prova: { attributo: sociale, abilita: persuasione, difficolta: Facile }
        successo:
          titolo: Da mercante a mercante
          testo: |
            Posi la licenza accanto alla mappa e proponi l'accordo, metà del
            prezzo alla Gilda e una copia per l'archivio. I due consiglieri votano
            a favore per non sembrare meno mercanti di te, e alla porta Merlach
            dice che gli resta il pozzo verso Ghoran.

            Sulle scale Argento ti mette al collo lo Scandaglio, un cristallo
            lungo un dito, contento che tu abbia venduto metà mappa a chi voleva
            rubarla tutta.
          pe: { persuasione: 3 }
          almeno: { rep.raschiatori: 4 }
          effetti: { fazione.raschiatori: 1, monete: 50, oggetto.raschiatori-scandaglio: 1, rep.gilda: 0.5 }
        fallimento:
          titolo: Il prezzo sbagliato
          testo: |
            Sbagli il prezzo di mezza mappa di un tanto che al banco ti
            riderebbero dietro, e qui ridono davanti, finché Argento chiede il
            voto sul regolamento. La Gradinata va ai Raschiatori per due voti, e
            alla porta Merlach dice che gli resta il pozzo verso Ghoran.

            Sulle scale Argento ti mette al collo lo Scandaglio e ti consiglia di
            scrivere gli accordi prima di proporli.
          almeno: { rep.raschiatori: 4 }
          effetti: { fazione.raschiatori: 1, monete: 50, oggetto.raschiatori-scandaglio: 1, rep.gilda: -1, scandalo: 1 }
      - testo: "Raccontare al consiglio la bilancia di Ghoran"
        descrizione: "A Ghoran ti hanno pesato, e in questa sala la bilancia diventa una cifra."
        quando: [origine.fuggiasco-di-ghoran >= 1]
        esito:
          titolo: La bilancia
          testo: |
            Racconti della bilancia di Ghoran con le parole più semplici, e alla
            fine Irsa Valbrun tiene in grembo il grembiule che si è tolta. La
            Gradinata va ai Raschiatori, e alla porta Merlach dice che gli resta
            il pozzo verso Ghoran.

            Sulle scale Argento ti mette al collo lo Scandaglio, un cristallo
            lungo un dito, perché da oggi scendi per primo nei siti nuovi, a
            cominciare dalla Gradinata.
          pe: { empatia: 3 }
          almeno: { rep.raschiatori: 4 }
          effetti: { fazione.raschiatori: 1, monete: 50, oggetto.raschiatori-scandaglio: 1, rep.gilda: -0.5 }
