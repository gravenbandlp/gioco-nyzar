          testo: |
            Dietro le concerie, fra due barili di concia, vedi uscire dal pozzo
            cinque legati in cordata e due armati con un gancio dipinto sulla
            manica.

            Al Grifone Dragna ti dice il nome, Valdo Merlach della Compagnia del
            Gancio, il caposquadra che lei cacciò quando entrò al Grifone con uno
            schiavo. Adesso lavora per la Gilda con carne comprata a Ghoran.
