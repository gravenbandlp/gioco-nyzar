            sveglia un Raschiatore della veglia, e quando gli chiedi delle lampade
            sputa nel vuoto e ti dice che sono quelli del Gancio.

            Al Grifone Dragna ti spiega che il Gancio è di Valdo Merlach, il
            caposquadra che lei cacciò quando entrò al Grifone con uno schiavo, e
            che adesso lavora per la Gilda con carne comprata a Ghoran.
          effetti: { fazione.raschiatori: 1, informazioni.voce: 1, tormento: 1 }
      - testo: "Pagare il custode del gabbiotto perché parli"
