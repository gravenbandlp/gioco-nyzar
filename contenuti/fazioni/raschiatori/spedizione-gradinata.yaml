# La quest dei Raschiatori, passo 5 (fazione.raschiatori 4 → 5): la spedizione alla Gradinata Cieca, tre giorni a
# ovest di Qir-Azel vicino al Bosco della Forca (codex sf-gradinata-cieca). Ci si entra dalla Superficie con
# `raschiatori-l-ottavo-gradino`, al campo della Compagnia del Gancio, che cala gli schiavi in cordata nel buio
# dell'ottavo gradino. Tagliare le corde dà raschiatori.cordata 1, che al passo 6 apre un'opzione.
# Le stanze vanno in fasce di profondità (una stanza superata non ricompare nella stessa visita):
# 0 i sette gradini o il campo della Compagnia, 1 il buio che non risponde o la corda senza piombo,
# 2 le file degli oggetti calati o lo specchio d'uscita, 3 la rampa che sale scendendo o le copie di corda e
# piombo; il gesso dei Raschiatori vale da 1 a 3. Il cuore a 4 è il custode delle file: dà la mappa
# (raschiatori.mappa), il Disco dei quattro segni e il passo; perdere lo scontro riporta in Superficie senza passo.
# La ritirata riporta alla Superficie Fratturata. Il turno ripetibile alla Gradinata (grado 2) sta in
# ripetibili.yaml ed è una scena sola, senza stanze.
aree:
  - id: raschiatori-gradinata
    immagine: ambientazione/rovine-dei-precursori
    nome: La Gradinata Cieca
    sommario: "Sette gradini di pietra grigia che scendono nella terra vicino al Bosco della Forca. L'ottavo non c'è, e al suo posto c'è un buio che la luce delle torce non attraversa."
    spedizione: { ritorno: superficie-fratturata, soglia: 4, stanze: 3 }
    testo: |
      La Gradinata Cieca comincia in mezzo a un prato di erba rada senza
      un muro né un arco a segnarla, come una scala di cantina di cui
      qualcuno si è portato via la casa. I gradini sono sette, di pietra
      grigia levigata come da un piede d'acqua, e hanno tutti la stessa
      altezza al dito. Al settimo la rampa finisce. Il vano della discesa
      prosegue dritto come il resto della rampa, e dove dovrebbe esserci l'ottavo
      gradino c'è un buio fermo e compatto che la luce delle torce non
      attraversa.

      Sul bordo del settimo gradino i Raschiatori di altri anni hanno
      piantato dei chiodi da corda, uno accanto all'altro. Alcuni sono
      lucidi di mani, altri arrugginiti fino al gambo, e a uno è ancora
      legato un pezzo di spago con un nodo fatto per non sciogliersi.

storylet:
  # ------------------------------------------------------------ l'ingresso, nella Superficie
  - id: raschiatori-l-ottavo-gradino
    immagine: ambientazione/rovine-dei-precursori
    titolo: L'ottavo gradino
    sommario: "Alla Gradinata Cieca la Compagnia del Gancio è arrivata un giorno prima di te, e cala gli schiavi nel buio dell'ottavo gradino uno alla volta."
    luogo: Superficie Fratturata, la Gradinata Cieca vicino al Bosco della Forca
    area: superficie-fratturata
    requisiti: [fazione.raschiatori == 4]
    testo: |
      Tre giorni di strada verso ovest, con il Bosco della Forca che ti
      resta sulla destra come un muro scuro e le gambe che a ogni sera ti
      presentano il conto. Argento ti ha dato un ragazzo per le corde, Pio
      Varre, che ha sedici anni e le orecchie a sventola e cammina due passi
      dietro di te e di notte dorme abbracciato al sacco del piombo.

      Alla Gradinata c'è già qualcuno. La Compagnia del Gancio ha piantato
      un campo di tre tende accanto ai sette gradini, con un argano di legno
      sopra il buio dell'ottavo, e un giorno di vantaggio. Due sorveglianti
      con il gancio dipinto sulla manica calano nel buio un uomo legato alla
      corda, scalzo, con il collare al collo e una lampada spenta in mano.
      La corda scende per un tratto lungo, poi si ferma. Quando la tirano su
      arriva asciutta, e in fondo mancano tanto l'uomo quanto il piombo.

      {resilienza Media fallita} Ti accorgi di avere le unghie piantate nei
      palmi mentre la corda saliva. Le stacchi soltanto quando Pio ti tira
      per la manica.

      Vicino alle tende altri tre aspettano il loro turno, seduti sull'erba
      con le ginocchia al petto, e non guardano il buio. Guardano te.

      {empatia Facile} L'ultimo della fila, un ragazzo più giovane di Pio, ha
      visto il bracciale dei turni che porti al polso. Che cosa voglia dire
      non lo sa, però ha capito che dal Gancio non vieni.

      *Uno alla volta, e chi non torna non costa niente.* Pio ti chiede a
      bassa voce che cosa facciamo, e il plurale gli trema un poco.
    opzioni:
      - testo: "Tagliare le corde e tirare su la cordata"
        descrizione: "I tre che aspettano sono legati alla stessa corda madre. Basta un coltello, e un paio di braccia buone per tirarli via dall'argano prima che i sorveglianti capiscano."
        prova: { attributo: fisico, abilita: atletica, difficolta: Media }
        successo:
          titolo: La corda madre
          testo: |
            Tagli la corda madre a due palmi dall'argano, e mentre i
            sorveglianti si girano tiri via i tre sull'erba, con Pio che si
            appende alla corda come a una campana. I sorveglianti guardano il tuo
            coltello e il bracciale dei turni, e decidono che
            la paga non vale la discesa. Si chiudono nelle tende. Lasci i tre
            con Pio e con il pane del sacco, e ti cali oltre il settimo gradino
            con la tua corda e il tuo piombo.
          pe: { atletica: 3 }
          imposta: { raschiatori.cordata: 1 }
          vai: raschiatori-gradinata
        fallimento:
          titolo: Il randello
          testo: |
            Tagli la corda madre, ma il sorvegliante più vicino è più svelto di
            quanto sembrava e ti arriva addosso con il randello prima che tu
            abbia finito di tirare. Il colpo ti prende la spalla. I tre però
            sono già sull'erba, e Pio li trascina dietro le tende mentre tu e il
            sorvegliante restate a guardarvi in cagnesco. Alla fine lui
            sputa per terra e torna all'argano. Ti cali oltre il settimo gradino
            con un braccio che non vuole saperne.
          imposta: { raschiatori.cordata: 1 }
          effetti: { ferite: 1 }
          vai: raschiatori-gradinata
      - testo: "Scendere prima di loro, di notte"
        descrizione: "La Compagnia di notte non cala nessuno. Se scendi tu nel buio mentre dormono, il sito è registrato prima che si sveglino."
        prova: { attributo: fisico, abilita: furtivita, difficolta: Media }
        successo:
          titolo: Il chiodo arrugginito
          testo: |
            Aspetti che nelle tende si spengano le lampade, e intanto Pio ti
            racconta a bisbigli tutto quello che sa sugli argani. Poi leghi la
            tua corda a un chiodo arrugginito del settimo gradino, uno di quelli
            che la Compagnia non ha toccato, e ti cali nel buio senza far
            rumore. Dalla tenda più vicina qualcuno russa per tutto il tempo.
          pe: { furtivita: 3 }
          vai: raschiatori-gradinata
        fallimento:
          titolo: La lampada che si accende
          testo: |
            Aspetti che nelle tende si spengano le lampade, ma sul settimo
            gradino ti scivola di mano il piombo, che rotola giù battendo contro
            la pietra. Si accende una lampada, poi un'altra. Ti cali nel buio troppo in
            fretta, con la corda che ti brucia fra le mani, e arrivi giù
            con le ginocchia che hanno preso tutto il colpo.
          effetti: { ferite: 0.5 }
          vai: raschiatori-gradinata
      - testo: "Mandare via i sorveglianti"
        descrizione: "Sono due, e la paga del Gancio non comprende i Raschiatori arrabbiati."
        combattimento: raschiatori-sorveglianti
        vittoria:
          titolo: Il campo vuoto
          testo: |
            Il primo sorvegliante finisce sull'erba, e il secondo guarda il
            compagno a terra prima di guardare il buio dell'ottavo gradino. Poi
            sceglie la strada per il bosco. Tagli le corde dei tre che aspettavano e li
            lasci a Pio con il pane del sacco. Ti cali oltre il settimo gradino
            con la tua corda e il tuo piombo, e il campo alle tue spalle è
            silenzioso.
          imposta: { raschiatori.cordata: 1 }
          vai: raschiatori-gradinata
        sconfitta:
          titolo: Fuori dal campo
          testo: |
            I due sorveglianti sanno lavorare in coppia meglio di quanto sappiano
            calare una corda. Ti ritrovi sull'erba fuori dal campo, con la bocca
            che sa di terra e Pio che ti tampona la fronte con il fazzoletto
            della madre. Ci vorrà un altro tentativo, e più prudenza.
      - testo: "Pagare un sorvegliante per un turno all'argano"
        descrizione: "Un sorvegliante del Gancio è pagato per calare corde. Qualche moneta in più, e cala anche la tua."
        requisiti: [monete >= 15]
        esito:
          titolo: Il turno all'argano
          testo: |
            Il sorvegliante conta le monete due volte, la seconda guardando il
            campo per vedere se qualcuno lo vede. Poi lega la tua corda al suo
            argano e ti cala nel buio senza una parola, come cala gli altri.
            L'ultima cosa che vedi dall'alto è il ragazzo più giovane della fila
            che ti guarda scendere.
          effetti: { monete: -15 }
          vai: raschiatori-gradinata

  # ------------------------------------------------------------ 0 · l'arrivo
  - id: raschiatori-gradinata-i-sette-gradini
    immagine: ambientazione/rovine-dei-precursori
    titolo: I sette gradini
    sommario: "Oltre il buio i gradini ricominciano, sempre alti uguali. Dopo il settimo non sai più se stai salendo o scendendo."
    luogo: La Gradinata Cieca, oltre il buio dell'ottavo gradino
    area: raschiatori-gradinata
    ripetibile: true
    requisiti: [fazione.raschiatori == 4, profondita.raschiatori-gradinata == 0]
    testo: |
      Oltre il buio dell'ottavo gradino ci sono altri gradini. Li senti con
      la punta dello stivale prima di vederli, alla luce della lampada che
      qui arriva a un braccio e non oltre, e sono della stessa pietra grigia
      e della stessa altezza di quelli di sopra. Ne conti sette, e al
      settimo la rampa finisce contro un altro buio uguale al primo.

      {percezione Media} I gradini di sopra erano consumati al centro. Questi
      sono consumati sui bordi, come se chi li percorre camminasse lontano
      dal mezzo.

      L'aria è ferma e asciutta, e sa di pietra appena spaccata. La corda che
      hai legato in vita pende alle tue spalle tesa verso l'alto, e a ogni
      gradino ti sembra un poco più corta.
    opzioni:
      - testo: "Scendere contando ad alta voce"
        descrizione: "Se i gradini si ripetono, almeno il conto lo tieni tu."
        prova: { attributo: mentale, abilita: percezione, difficolta: Media }
        successo:
          titolo: Quattordici
          testo: |
            Conti ad alta voce, e la voce ti torna indietro dal buio con un
            ritardo regolare. Al quattordicesimo gradino la pietra si fa
            più scura sotto la lampada, e ti fermi. Lì, fra due
            gradini, c'è incastrata una scheggia di metallo che qualcuno ha
            perso scendendo, e la prendi.
          effetti: { profondita.raschiatori-gradinata: 1, reliquie.scheggia: 1 }
        fallimento:
          titolo: Il conto che ricomincia
          testo: |
            Arrivato a nove ti accorgi di aver detto sette due volte, e
            ricominci. Alla terza volta che ricominci la voce che torna dal buio
            conta un numero avanti a te. Ti siedi sul gradino finché le gambe
            non smettono di formicolare, e per prudenza smetti di contare qualunque cosa.
          effetti: { tormento: 0.5 }
      - testo: "Calarsi lungo il vano con la corda"
        descrizione: "I gradini si possono saltare. Basta fidarsi della corda e del chiodo di sopra."
        prova: { attributo: fisico, abilita: atletica, difficolta: Media }
        successo:
          titolo: A corda tesa
          testo: |
            Ti cali di schiena lungo il vano, puntando i piedi sui bordi dei
            gradini senza appoggiarti, e la corda tiene. Dopo un tratto lungo
            tocchi un fondo piano, e la corda smette di tirare all'insù come se
            di sopra qualcuno l'avesse lasciata andare. Sei più giù di quanto i
            gradini avrebbero voluto.
          pe: { atletica: 2 }
          effetti: { profondita.raschiatori-gradinata: 1 }
        fallimento:
          titolo: Il bordo
          testo: |
            A metà del vano un piede scivola sul bordo levigato di un gradino, e
            sbatti il fianco contro lo spigolo con tutto il tuo peso. La corda
            tiene. Resti appeso a guardare la lampada che dondola, poi risali
            fino al primo gradino e ti siedi a massaggiarti le costole.
          effetti: { ferite: 0.5 }
      - testo: "Scendere seduto, un gradino alla volta"
        descrizione: "Lento, con la schiena alla parete. Il buio aspetta da secoli, e può aspettare anche te."
        costo: 2
        esito:
          titolo: Seduto
          testo: |
            Scendi seduto, un gradino alla volta, con le mani sulla pietra e la
            schiena alla parete. Ci metti un tempo che non sapresti dire, e a un
            certo punto ti sembra di sentire qualcuno che scende con lo stesso
            passo un poco dietro di te. Quando arrivi in fondo ti giri, e dietro
            ci sono soltanto i gradini, consumati sui bordi.
          effetti: { profondita.raschiatori-gradinata: 1, tormento: 0.5 }

  - id: raschiatori-gradinata-il-campo-della-compagnia
    immagine: ambientazione/rovine-dei-precursori
    titolo: Le lampade della Compagnia
    sommario: "Subito sotto il buio la Compagnia ha lasciato le sue lampade e un sorvegliante di guardia, che non si aspetta visite dall'alto."
    luogo: La Gradinata Cieca, il primo pianerottolo
    area: raschiatori-gradinata
    ripetibile: true
    requisiti: [fazione.raschiatori == 4, profondita.raschiatori-gradinata == 0]
    testo: |
      Sotto il buio c'è un pianerottolo largo, e qualcuno l'ha già preso per
      un magazzino. Ci sono tre lampade della Compagnia appese a chiodi nuovi
      e un rotolo di corda con il gancio di ferro, e seduto su una cassa un
      sorvegliante mangia una cipolla cruda a morsi, come una mela. Dà le
      spalle alla parete e guarda il vano che scende, perché da quella parte
      aspetta guai.

      {armi-da-mischia Facile} Ha il randello appoggiato alla cassa,
      dall'altra parte rispetto alla mano con cui mangia. Gli serve un
      momento per cambiare mano, e un momento qui sotto è tanto.

      {conoscenze-della-strada Media} Un sorvegliante lasciato di guardia
      da solo, a metà di una discesa, è uno che la Compagnia può permettersi
      di perdere. Lui lo sa, e infatti mangia cipolle.
    opzioni:
      - testo: "Toglierlo di mezzo"
        descrizione: "È solo, e ha la bocca piena."
        combattimento: raschiatori-un-sorvegliante
        vittoria:
          titolo: La cipolla
          testo: |
            Il sorvegliante fa in tempo a lasciar cadere la cipolla e a cercare
            il randello con la mano sbagliata. Lo lasci legato alla sua cassa
            con la sua stessa corda, e prendi una delle lampade del Gancio, che
            fa più luce della tua. Il vano scende davanti a te, e da qui in poi
            nessuno ha ancora piantato chiodi.
          effetti: { profondita.raschiatori-gradinata: 1 }
        sconfitta:
          titolo: Il randello
          testo: |
            Il sorvegliante cambia mano più in fretta di quanto avevi previsto,
            e il randello ti trova la tempia. Quando ti riprendi lui sta
            seduto sulla cassa a mangiare un'altra cipolla, e ti guarda come si
            guarda un problema che si risolverà da solo. Risali di qualche
            gradino per pensarci meglio.
      - testo: "Passargli alle spalle"
        descrizione: "Guarda il vano che scende, e il pianerottolo è largo. Basta restare dalla parte del buio."
        prova: { attributo: fisico, abilita: furtivita, difficolta: Media }
        successo:
          titolo: Dalla parte del buio
          testo: |
            Passi rasente al bordo del buio, dove la sua lampada non arriva, e
            lui continua a mangiare la cipolla guardando dall'altra parte.
            Prendendo il vano che scende stacchi anche un chiodo nuovo dalla
            parete, così la sua lampada si inclina e lui impreca contro il
            chiodo invece che contro di te.
          pe: { furtivita: 2 }
          effetti: { profondita.raschiatori-gradinata: 1 }
        fallimento:
          titolo: Il morso a metà
          testo: |
            Sei a metà del pianerottolo quando lui smette di masticare. Ti guarda
            con il morso ancora in bocca, e tu guardi lui, e per il tempo di un
            boccone nessuno dei due sa che cosa fare. Poi lui fischia, e da
            sotto risponde un altro fischio. Torni nel buio di sopra prima di
            sapere chi l'ha fatto.
          effetti: { sospetto: 0.5 }
      - testo: "Aspettare che cambi il turno di guardia"
        descrizione: "Prima o poi qualcuno sale a dargli il cambio, e per un po' il pianerottolo resta vuoto."
        costo: 2
        esito:
          titolo: Il cambio
          testo: |
            Aspetti seduto sull'ultimo gradino, con il freddo della pietra che
            ti sale nelle ossa un poco alla volta. Dopo un tempo lungo da sotto
            sale un altro sorvegliante, e i due risalgono insieme per mangiare.
            Il pianerottolo resta vuoto quanto basta. Attraversi con le gambe
            rigide e la schiena che si lamenta.
          effetti: { profondita.raschiatori-gradinata: 1, ferite: 0.5 }

  # ------------------------------------------------------------ 1 · il buio che non risponde
  - id: raschiatori-gradinata-il-buio-che-non-risponde
    immagine: ambientazione/regno-profondo
    titolo: Il buio che non risponde
    sommario: "Il vano si riempie di un buio che la lampada non attraversa. Dentro si cammina a memoria, e la memoria qui non è tua."
    luogo: La Gradinata Cieca, il secondo buio
    area: raschiatori-gradinata
    ripetibile: true
    requisiti: [fazione.raschiatori == 4, profondita.raschiatori-gradinata == 1]
    testo: |
      Il secondo buio arriva senza preavviso. Fai un passo e la lampada ti
      illumina la mano e basta, come se avessi infilato il braccio in un
      sacco di velluto. Dietro, il vano da cui vieni è ancora chiaro. Davanti
      c'è soltanto il nero, compatto, senza un'eco.

      {magia Media} Il buio non è assenza di luce. È qualcosa che la luce la
      prende e non la restituisce, con la stessa calma con cui un pozzo
      prende le monete.

      {resistenza Facile fallita} Le gambe hanno deciso che il pavimento
      potrebbe finire al prossimo passo, e ogni passo te lo fanno pagare con
      un crampo al polpaccio.

      In terra, al limite della luce, c'è una candela da scavo consumata a
      metà, con lo stoppino rivolto verso il basso.
    opzioni:
      - testo: "Seguire il bordo della candela"
        descrizione: "Chi l'ha lasciata lì l'ha lasciata per qualcuno. Lo stoppino indica una direzione."
        prova: { attributo: mentale, abilita: [percezione, magia], difficolta: Media }
        successo:
          titolo: Lo stoppino
          testo: |
            Accendi la candela, e la fiamma pende all'ingiù verso il pavimento,
            come se il basso fosse da un'altra parte. La segui piegato in due,
            con la candela davanti alle ginocchia, e il nero si apre di un palmo
            alla volta intorno alla fiamma. Quando arrivi dall'altra parte la
            candela si spegne da sola, e la lampada torna a fare luce.
          pe: { percezione: 2 }
          effetti: { profondita.raschiatori-gradinata: 1 }
        fallimento:
          titolo: La fiamma al contrario
          testo: |
            Accendi la candela, e la fiamma pende all'ingiù. La guardi troppo a
            lungo, e la testa decide che il pavimento è il soffitto. Ti ritrovi
            in ginocchio con le mani piatte sulla pietra, aggrappato a qualcosa
            che non si muove, e torni indietro a carponi fino al vano chiaro.
          effetti: { tormento: 0.5 }
      - testo: "Camminare a occhi chiusi"
        descrizione: "Se il buio prende la luce, la luce non serve. Restano i piedi, e i nervi."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Media }
        successo:
          titolo: A occhi chiusi
          testo: |
            Chiudi gli occhi e cammini con una mano sulla parete, contando i
            passi a mezza voce. Il buio a occhi chiusi è soltanto il tuo, e
            quello lo conosci. Dopo cinquanta passi la mano trova uno spigolo, e
            quando riapri gli occhi la lampada illumina di nuovo un vano di
            pietra grigia.
          pe: { resilienza: 2 }
          effetti: { profondita.raschiatori-gradinata: 1 }
        fallimento:
          titolo: La mano sulla parete
          testo: |
            Chiudi gli occhi e cammini con una mano sulla parete, e a un certo
            punto la parete smette di esserci. La mano trova aria, e poi qualcosa
            di tiepido che si ritira. Riapri gli occhi nel nero, e ci metti molto
            a ritrovare il vano chiaro alle tue spalle.
          effetti: { tormento: 0.5 }
      - testo: "Legarsi alla corda e procedere a tentoni"
        descrizione: "Una corda legata in vita e l'altro capo al chiodo. Lento, e la corda ogni tanto tira dalla parte sbagliata."
        costo: 2
        esito:
          titolo: A tentoni
          testo: |
            Leghi il capo della corda a un chiodo e procedi a tentoni, un palmo
            alla volta, con la corda che ti segue nel nero. Due volte la senti
            tirare indietro, piano, come una mano che ti trattiene per la
            giubba, e due volte ti fermi ad aspettare che smetta. Dall'altra
            parte la lampada torna a fare luce, e tu hai la nuca fradicia.
          effetti: { profondita.raschiatori-gradinata: 1, tormento: 0.5 }

  - id: raschiatori-gradinata-la-corda-senza-piombo
    immagine: ambientazione/rovine-dei-precursori
    titolo: La corda senza piombo
    sommario: "Una corda del Gancio pende nel vano, tagliata netta. In fondo, seduto contro la parete, c'è l'uomo che hai visto calare dall'argano."
    luogo: La Gradinata Cieca, il vano della corda
    area: raschiatori-gradinata
    ripetibile: true
    requisiti: [fazione.raschiatori == 4, profondita.raschiatori-gradinata == 1]
    testo: |
      Nel vano pende una corda del Gancio, e finisce a un braccio da terra
      con un taglio netto. Sotto, seduto contro la parete con la lampada
      spenta in grembo, c'è l'uomo che hai visto calare dall'argano. Ha gli
      occhi aperti e respira. Quando gli punti addosso la luce non sbatte le
      palpebre.

      {medicina Media} Il petto gli si alza lento e profondo, come a chi
      dorme con la febbre alta. Le mani sono fredde, e il collare gli ha segnato il collo fino a
      farlo sanguinare.

      {origine fuggiasco-di-ghoran} Il collare è di quelli che si stringono
      tirando. Lo conosci dalle notti in cui lo tenevi allentato con due dita
      per riuscire a dormire.

      Accanto a lui, in terra, c'è il piombo che mancava alla corda. È
      lucido come una moneta nuova, e quando lo tocchi è freddo come
      l'acqua di un pozzo.
    opzioni:
      - testo: "Tirarlo su e farlo camminare"
        descrizione: "Pesa come un uomo, e non ti aiuta. Bisogna tirarlo su e reggerlo finché le gambe si ricordano."
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Media }
        successo:
          titolo: Le gambe che si ricordano
          testo: |
            Lo tiri su per le ascelle e gli passi il suo braccio intorno al
            collo, e per un tratto lo trascini. Poi le sue gambe cominciano a
            fare i passi da sole, uno ogni tre dei tuoi, e lui ti dice un nome
            che non è il suo e nemmeno il tuo. Lo lasci in fondo al vano, dove
            l'aria è meno ferma, con la tua borraccia, e prosegui.
          pe: { resistenza: 2 }
          effetti: { profondita.raschiatori-gradinata: 1, rep.raschiatori: 0.5 }
        fallimento:
          titolo: Il peso morto
          testo: |
            Provi a tirarlo su, e lui si lascia andare con tutto il peso. Cadete
            insieme sul pavimento di pietra, e il piombo rotola via nel buio
            senza fare rumore. Resti seduto accanto a lui con un ginocchio che
            pulsa, finché lui non chiude gli occhi e si addormenta davvero.
          effetti: { ferite: 0.5 }
      - testo: "Parlargli finché ti guarda"
        descrizione: "Gli occhi sono aperti, e dentro c'è ancora qualcuno. Basta trovare la parola che lo fa tornare."
        prova: { attributo: sociale, abilita: empatia, difficolta: Media }
        successo:
          titolo: Il nome
          testo: |
            Gli parli piano, del sole sopra la Gradinata e del pane che Pio ha
            nel sacco, finché gli occhi si spostano su di te. Allora ti dice il
            suo nome, due volte, la seconda con stupore, come se l'avesse
            ritrovato in tasca. Lo aiuti ad alzarsi e gli indichi la corda. Ci
            si arrampica da solo, adagio, mentre tu prosegui verso il basso.
          pe: { empatia: 2 }
          effetti: { profondita.raschiatori-gradinata: 1, rep.raschiatori: 0.5 }
        fallimento:
          titolo: Gli occhi aperti
          testo: |
            Gli parli a lungo, e lui continua a guardare il punto dove eri
            prima di sederti accanto a lui. A un certo punto ti accorgi che stai
            parlando con la voce che usava tua madre per farti addormentare. Ti
            fermi, e il silenzio del vano ti torna addosso tutto insieme.
          effetti: { tormento: 0.5 }
      - testo: "Lasciargli la lampada accesa e proseguire"
        descrizione: "Non puoi portarlo con te. Gli lasci la luce, e al ritorno ci ripensi."
        costo: 2
        esito:
          titolo: La lampada accesa
          testo: |
            Gli accendi la lampada con la tua e gliela rimetti in grembo, con
            le sue mani sopra. Lui la stringe, e per un momento sembra sorridere.
            Prosegui verso il basso voltandoti ogni dieci passi, finché la
            piccola luce resta indietro e scompare dietro una curva che il vano
            prima non faceva.
          effetti: { profondita.raschiatori-gradinata: 1, tormento: 0.5 }

  # ------------------------------------------------------------ 1–3 · il gesso dei Raschiatori
  - id: raschiatori-gradinata-il-gesso
    immagine: ambientazione/rovine-dei-precursori
    titolo: Il gesso dei Raschiatori
    sommario: "Sulla parete del vano ci sono segni di gesso lasciati da squadre di altri anni. Alcuni indicano la strada, altri l'hanno sbagliata."
    luogo: La Gradinata Cieca, una parete segnata
    area: raschiatori-gradinata
    ripetibile: true
    requisiti: [fazione.raschiatori == 4, profondita.raschiatori-gradinata >= 1, profondita.raschiatori-gradinata <= 3]
    testo: |
      Su un tratto di parete i Raschiatori di altri anni hanno lasciato i
      loro segni di gesso, le frecce accanto alle croci e il cerchio con il
      punto che vuol dire *acqua*, uno sopra l'altro come le firme su un muro di
      taverna. Alcuni sono così vecchi che il gesso è entrato nella pietra.
      Accanto a una freccia qualcuno ha disegnato una lanterna piccola, con
      la fiamma storta.

      {accademiche Media} I segni più vecchi usano il cerchio con due punti
      per *pericolo*, quello che le squadre di adesso hanno smesso di usare
      da una generazione. Chi li ha fatti scendeva qui prima che nascesse la
      Compagnia, e anche prima che nascessi tu.

      Due frecce indicano strade opposte, e sono state fatte dalla stessa
      mano.
    opzioni:
      - testo: "Leggere i segni come li legge Dragna"
        descrizione: "Il gesso dei Raschiatori ha la sua grammatica. Chi la conosce sa quale freccia è stata scritta da chi tornava."
        prova: { attributo: mentale, abilita: accademiche, difficolta: Media }
        successo:
          titolo: La freccia di chi tornava
          testo: |
            Una delle due frecce ha la punta ripassata, e il gesso della seconda
            mano è più fresco. Chi l'ha ripassata tornava, e voleva che chi
            scendeva dopo di lui non sbagliasse. Prendi quella strada, e dopo un
            tratto trovi un altro segno, una croce piccola, dove qualcuno si è
            fermato a riposare.
          pe: { accademiche: 2 }
          effetti: { profondita.raschiatori-gradinata: 1 }
        fallimento:
          titolo: L'altra freccia
          testo: |
            Scegli la freccia più chiara, e dopo un tratto il vano si stringe
            fino a costringerti a passare di fianco. In fondo trovi una croce di
            gesso sola sul pavimento, e decidi di non sapere che cosa voleva dire.
            Torni ai segni con la camicia strappata su una spalla.
          effetti: { ferite: 0.5 }
      - testo: "Aggiungere il tuo segno e seguire l'istinto"
        descrizione: "Un segno in più sulla parete non fa male a nessuno, e l'istinto, qualche volta, è quello di chi ti ha preceduto."
        costo: 2
        esito:
          titolo: Il tuo segno
          testo: |
            Fai una freccia con il gesso del sacco, piccola, accanto alla
            lanterna con la fiamma storta, e prendi la strada che ti dice la
            pancia. Ci metti il doppio, perché a ogni bivio torni indietro a
            controllare, ma arrivi. Il gesso ti resta sulle dita per tutto il
            giorno, e ti viene da annusarlo come una cosa di casa.
          effetti: { profondita.raschiatori-gradinata: 1, tormento: 0.5 }
      - testo: "Seguire la lanterna con la fiamma storta"
        descrizione: "Un Raschiatore ha disegnato una lanterna e non una freccia. Fra i Raschiatori una lanterna si disegna per qualcuno."
        prova: { attributo: sociale, abilita: empatia, difficolta: Facile }
        successo:
          titolo: Per qualcuno
          testo: |
            Accanto alla lanterna, più in basso, c'è un nome scritto piccolo
            che il gesso ha quasi cancellato. Ti viene da salutarlo, e lo fai, a
            mezza voce. Poi segui la direzione in cui pende la fiamma, e la
            strada è buona.
          effetti: { profondita.raschiatori-gradinata: 1 }
        fallimento:
          titolo: Il nome cancellato
          testo: |
            Cerchi un nome accanto alla lanterna e non lo trovi, e ti resta
            addosso la sensazione di aver mancato di rispetto a qualcuno. Ti
            siedi un momento davanti ai segni senza sapere quale prendere.
          effetti: { tormento: 0.5 }

  # ------------------------------------------------------------ 2 · le file e lo specchio
  - id: raschiatori-gradinata-le-file
    immagine: ambientazione/rovine-dei-precursori
    titolo: Le file degli oggetti calati
    sommario: "Una sala lunga con scaffali di pietra, e sopra, in file ordinate, tutto quello che è stato calato oltre l'ottavo gradino in decenni."
    luogo: La Gradinata Cieca, la sala degli scaffali
    area: raschiatori-gradinata
    ripetibile: true
    requisiti: [fazione.raschiatori == 4, profondita.raschiatori-gradinata == 2]
    testo: |
      Il vano sbocca in una sala lunga, con scaffali di pietra scavati nelle
      pareti da un capo all'altro. Sopra, in file ordinate, c'è tutto quello
      che dalla Gradinata è stato calato in decenni. Ci sono corde arrotolate
      accanto ai pesi di piombo, file di candele da scavo e di lampade, e
      perfino un cappello, ognuno con la sua etichetta di metallo che non sai leggere.

      {percezione Facile} Sono tutti un poco sbagliati. Le corde hanno i
      nodi fatti al contrario, e le candele hanno lo stoppino dalla parte
      della base.

      Su uno scaffale in basso c'è una lampada da scavo identica alla tua,
      con la stessa ammaccatura sul fondo. Sull'etichetta di metallo
      accanto c'è un segno inciso di fresco, e la superficie è ancora calda.

      {tecnologia Media fallita} Ti chiedi come facciano le etichette a
      essere incise da sole. Le guardi a lungo, e la risposta non arriva.
    opzioni:
      - testo: "Studiare le etichette"
        descrizione: "Gli scaffali sono un archivio, e un archivio ha un ordine. Capirlo vuol dire capire dove porta la sala."
        prova: { attributo: mentale, abilita: [accademiche, tecnologia], difficolta: Media }
        successo:
          titolo: L'ordine delle file
          testo: |
            Le etichette sono in ordine di arrivo, dalle più vecchie verso il
            fondo della sala alle più nuove verso l'ingresso. Le più vecchie
            hanno un segno diverso, un cerchio diviso in quattro, e accanto a
            una di quelle stacchi un frammento inciso caduto dallo scaffale.
            Prosegui verso il fondo, dove le cose sono state calate per prime.
          pe: { accademiche: 2 }
          effetti: { profondita.raschiatori-gradinata: 1, reliquie.frammento-inciso: 1 }
        fallimento:
          titolo: La tua lampada
          testo: |
            Mentre leggi le etichette la lampada sullo scaffale si accende da
            sola, e la tua si spegne. Resti al buio con la luce dell'altra
            davanti, che illumina lo scaffale e non te. Quando la tua si
            riaccende hai le mani che tremano, e quella sullo scaffale è spenta
            con il vetro appannato, come dopo un respiro.
          effetti: { tormento: 0.5 }
      - testo: "Prendere la lampada che è uguale alla tua"
        descrizione: "È tua, o lo sarà. Un Raschiatore non lascia la sua lampada in un posto così."
        prova: { attributo: fisico, abilita: furtivita, difficolta: Media }
        successo:
          titolo: Le due lampade
          testo: |
            La prendi in fretta, come si prende una moneta dal piatto di un
            mendicante, e la metti nel sacco. Per un lungo momento la sala resta
            ferma, e allora prosegui con due lampade uguali, una che fa luce e una
            che non pesa niente.
          effetti: { profondita.raschiatori-gradinata: 1, reliquie.scheggia: 2 }
        fallimento:
          titolo: L'etichetta calda
          testo: |
            Allunghi la mano, e l'etichetta accanto alla lampada diventa
            rovente e ti segna le dita. Ritiri la mano con un sibilo, e dal
            fondo della sala arriva un rumore di passi lunghi e lenti che si
            avvicinano e poi si fermano.
          effetti: { ferite: 0.5, tormento: 0.5 }
      - testo: "Attraversare la sala senza toccare niente"
        descrizione: "Gli scaffali sono pieni di cose di altri. Le lasci dove sono, e cammini nel mezzo."
        costo: 2
        esito:
          titolo: Nel mezzo
          testo: |
            Attraversi la sala camminando nel mezzo, con le mani in tasca come
            al mercato quando non hai soldi. Ci metti molto, perché la sala è
            più lunga di quanto sembrava dall'ingresso. Dai due lati gli oggetti
            calati ti guardano passare, e dopo un po' smetti di chiederti chi
            li ha messi in fila.
          effetti: { profondita.raschiatori-gradinata: 1, tormento: 0.5 }

  - id: raschiatori-gradinata-lo-specchio
    immagine: ambientazione/regno-profondo
    titolo: Lo specchio d'uscita
    sommario: "In fondo a un corridoio una lastra lucida rimanda l'immagine della Gradinata vista da fuori, con il prato al sole e le tende della Compagnia."
    luogo: La Gradinata Cieca, il corridoio dello specchio
    area: raschiatori-gradinata
    ripetibile: true
    requisiti: [fazione.raschiatori == 4, profondita.raschiatori-gradinata == 2]
    testo: |
      In fondo a un corridoio c'è una lastra lucida alta come una porta. Ci
      aspetti di vedere te stesso con la lampada in mano, e invece ci vedi la
      Gradinata da fuori, nel pomeriggio, con il prato di erba rada e le
      tende della Compagnia. Pio è seduto sull'erba accanto ai tre che hai
      tirato su, o accanto al posto dove li avresti lasciati, e mangia il
      pane del sacco.

      {resilienza Media} È un'uscita, o vuole sembrarlo. Chi è stanco la
      prende senza farsi domande, e i Raschiatori stanchi muoiono così.

      La lastra è tiepida al tatto, e la tua mano non ci si riflette.
    opzioni:
      - testo: "Voltare le spalle allo specchio"
        descrizione: "Il prato è là sopra, e ci tornerai con le tue gambe. Adesso bisogna trovare la strada che scende."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Media }
        successo:
          titolo: Le spalle al sole
          testo: |
            Ti volti e cammini, e senti il sole dello specchio sulla nuca per
            un lungo tratto, con l'odore dell'erba tagliata che non c'è. Lo
            lasci dov'è. Più avanti il corridoio piega verso il basso, e il
            calore sulla nuca si spegne come una candela soffiata.
          pe: { resilienza: 2 }
          effetti: { profondita.raschiatori-gradinata: 1 }
        fallimento:
          titolo: Un passo verso il prato
          testo: |
            Fai un passo verso lo specchio prima di deciderlo, poi un altro. Ti
            ferma il freddo della lastra sulla fronte. Resti lì appoggiato con
            gli occhi chiusi finché il prato smette di chiamarti, e quando li
            riapri lo specchio riflette di nuovo il corridoio, e te.
          effetti: { tormento: 1 }
      - testo: "Cercare nello specchio la strada che scende"
        descrizione: "Se lo specchio fa vedere la Gradinata da fuori, nel riflesso ci sono anche i gradini. Basta guardare bene da quale parte vanno."
        prova: { attributo: mentale, abilita: percezione, difficolta: Media }
        successo:
          titolo: I gradini nello specchio
          testo: |
            Nello specchio i sette gradini scendono da sinistra a destra, e
            quelli veri da destra a sinistra. La strada buona è quella dello
            specchio. Prendi il corridoio di sinistra, quello che non avresti
            mai preso, e dopo un tratto la pietra sotto i piedi comincia a
            scendere.
          pe: { percezione: 2 }
          effetti: { profondita.raschiatori-gradinata: 1 }
        fallimento:
          titolo: Pio nello specchio
          testo: |
            Guardi bene, e nello specchio Pio alza la testa e ti guarda. Ti
            fa un cenno con la mano, e tu glielo ricambi prima di pensarci. Il
            corridoio alle tue spalle si fa più freddo, e decidi che per adesso
            hai guardato abbastanza.
          effetti: { tormento: 0.5 }
      - testo: "Coprire lo specchio con la giubba e passare"
        descrizione: "Quello che non vedi non ti chiama. Si passa a tentoni lungo la parete, con la giubba appesa alla lastra."
        costo: 2
        esito:
          titolo: La giubba sulla lastra
          testo: |
            Appendi la giubba a un angolo della lastra e passi rasente al muro,
            senza guardare. La pietra del corridoio è più fredda senza la
            giubba, e quando torni a riprenderla è bagnata come se fosse rimasta
            sotto la pioggia. Te la rimetti lo stesso e prosegui battendo i
            denti.
          effetti: { profondita.raschiatori-gradinata: 1, ferite: 0.5 }

  # ------------------------------------------------------------ 3 · la rampa e le copie
  - id: raschiatori-gradinata-la-rampa
    immagine: ambientazione/rovine-dei-precursori
    titolo: La rampa che sale scendendo
    sommario: "Una rampa di pietra liscia porta in basso. A metà ti accorgi che stai salendo, e che la corda alle tue spalle tira verso il basso."
    luogo: La Gradinata Cieca, la rampa
    area: raschiatori-gradinata
    ripetibile: true
    requisiti: [fazione.raschiatori == 4, profondita.raschiatori-gradinata == 3]
    testo: |
      Il corridoio diventa una rampa di pietra liscia senza gradini, che
      scende in curva verso il basso. La prendi con le ginocchia piegate e i
      talloni puntati, e a metà ti accorgi che le cosce ti fanno male come in
      salita. La corda legata in vita, che fino a qui tirava verso l'alto,
      adesso tira verso il basso.

      {acrobazia Media} Il peso del corpo è finito nel posto sbagliato. Se
      ti fidi dei piedi e smetti di fidarti degli occhi, la rampa si lascia
      fare.

      {atletica Media fallita} Le gambe protestano con la fatica di una
      salita lunga. Hanno ragione loro, e torto la pietra.

      In fondo alla curva una luce verdognola sale dal pavimento.
    opzioni:
      - testo: "Fidarsi dei piedi"
        descrizione: "Gli occhi dicono una cosa, il corpo un'altra. Si cammina come dice il corpo."
        prova: { attributo: fisico, abilita: acrobazia, difficolta: Media }
        successo:
          titolo: In equilibrio
          testo: |
            Chiudi gli occhi per metà e cammini come se salissi, con il busto in
            avanti e il peso sulle punte. La rampa ti porta giù senza una
            scivolata, e in fondo alla curva arrivi alla luce verdognola con il
            fiato di una salita e le ginocchia di una discesa.
          pe: { acrobazia: 2 }
          effetti: { profondita.raschiatori-gradinata: 1 }
        fallimento:
          titolo: La scivolata
          testo: |
            Il piede decide da solo che stai scendendo, e il resto del corpo non
            è d'accordo. Scivoli sulla schiena per un lungo tratto in salita
            e ti fermi contro la parete dove la rampa comincia. Ti rialzi con i
            gomiti sbucciati e nessuna voglia di ricominciare.
          effetti: { ferite: 0.5 }
      - testo: "Non guardare la rampa e contare i respiri"
        descrizione: "La testa vuole capire, e capire qui fa cadere. Basta tenerla occupata con altro."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Media }
        successo:
          titolo: Centotrenta
          testo: |
            Conti i respiri e guardi soltanto la punta dei tuoi stivali, e la
            rampa sotto di te smette di avere un verso. Al centotrentesimo
            la luce verdognola ti illumina le punte. Alzi la testa e
            sei in fondo.
          pe: { resilienza: 2 }
          effetti: { profondita.raschiatori-gradinata: 1 }
        fallimento:
          titolo: Il conto sbagliato
          testo: |
            Conti i respiri, e a un certo punto ne conti uno che non hai fatto
            tu. Ti fermi. Quello in più continua, a un passo dietro le tue
            spalle, e quando ti volti la rampa è vuota. Torni su di corsa, in
            discesa.
          effetti: { tormento: 1 }
      - testo: "Scendere legato al chiodo, un palmo alla volta"
        descrizione: "Un chiodo piantato in cima, la corda in mano, e si scende all'indietro come da una parete."
        costo: 2
        esito:
          titolo: All'indietro
          testo: |
            Pianti un chiodo in cima alla rampa e scendi all'indietro, un palmo
            alla volta, come da una parete di roccia. La corda ti brucia i palmi
            anche attraverso i guanti, e due volte il chiodo cede un poco. In
            fondo lasci la corda appesa per il ritorno, e ti succhi le mani.
          effetti: { profondita.raschiatori-gradinata: 1, ferite: 0.5 }

  - id: raschiatori-gradinata-le-copie
    immagine: ambientazione/rovine-dei-precursori
    titolo: Le copie di corda e piombo
    sommario: "Nella luce verdognola due figure fatte di corde annodate e pesi di piombo ripetono i gesti di Raschiatori scesi tanto tempo fa."
    luogo: La Gradinata Cieca, la sala della luce verde
    area: raschiatori-gradinata
    ripetibile: true
    requisiti: [fazione.raschiatori == 4, profondita.raschiatori-gradinata == 3]
    testo: |
      Nella luce verdognola che sale dal pavimento ci sono due figure alte
      come uomini, fatte di corde annodate strette e di pesi di piombo al
      posto delle giunture. Hanno un gancio di ferro al posto di ogni mano.
      Stanno ripetendo i gesti di uno scavo. La prima pianta un chiodo e
      l'altra fila la corda, sempre uguali, senza niente fra le mani.

      {armi-da-mischia Media} Le giunture di piombo sono la parte pesante, e
      quella lenta. Fra due nodi la corda è sottile, e un colpo dritto la
      apre.

      Quando entri nella luce la figura che piantava il chiodo si ferma con
      il gancio alzato, e si gira verso di te. Ha la stessa altezza della
      tua, e la stessa piega delle spalle.
    opzioni:
      - testo: "Spezzare le corde fra i nodi"
        descrizione: "Sono due, e copiano. Chi copia arriva sempre dopo."
        combattimento: raschiatori-copie-di-corda
        vittoria:
          titolo: I nodi sciolti
          testo: |
            Le figure si disfano a pezzi, un nodo alla volta, e i pesi di piombo
            rotolano sul pavimento come monete. Quando l'ultima è a terra la
            luce verdognola si abbassa, e in fondo alla sala si vede un'apertura
            bassa, con il bordo levigato dalle mani.
          effetti: { profondita.raschiatori-gradinata: 1, reliquie.scheggia: 1 }
        sconfitta:
          titolo: Il tuo gesto
          testo: |
            La figura ti colpisce con il gancio esattamente come avresti fatto
            tu, dal basso verso l'alto, e finisci a terra con la corda in vita
            che tira verso l'uscita. Ti trascini via. Le figure riprendono lo
            scavo che non finisce mai.
      - testo: "Rifare il loro gesto e passare in mezzo"
        descrizione: "Se ripetono uno scavo, chi scava con loro non è un intruso. Bisogna fare il gesto giusto, al momento giusto."
        prova: { attributo: sociale, abilita: [ingannare, espressivita], difficolta: Media }
        successo:
          titolo: Il terzo della squadra
          testo: |
            Ti metti fra le due figure e fai il gesto del terzo della squadra,
            quello che tiene la lampada alta per gli altri. Le figure riprendono
            a lavorare al loro chiodo e alla loro corda, e tu cammini in mezzo a loro con
            la lampada alzata fino all'apertura in fondo alla sala.
          pe: { espressivita: 2 }
          effetti: { profondita.raschiatori-gradinata: 1 }
        fallimento:
          titolo: Il gesto sbagliato
          testo: |
            Fai il gesto, ma con la mano sbagliata. La figura con la corda si
            ferma e ti guarda il polso, e il gancio ti sfiora la guancia con un
            rumore di ferro. Esci dalla luce all'indietro, e loro tornano allo
            scavo.
          effetti: { ferite: 0.5, tormento: 0.5 }
      - testo: "Girare largo lungo il bordo della luce"
        descrizione: "La luce non arriva ai muri. Si passa al buio, lontano dalle figure, con le spalle alla pietra."
        costo: 2
        esito:
          titolo: Il bordo
          testo: |
            Passi lungo il muro, dove la luce non arriva, e le figure ti seguono
            con la testa senza smettere di lavorare. Ci metti molto. A metà
            strada ti accorgi che la figura con il chiodo ha cambiato gesto e
            adesso fa il tuo, una mano sul muro e l'altra alta con la lampada.
          effetti: { profondita.raschiatori-gradinata: 1, tormento: 0.5 }

  # ------------------------------------------------------------ il cuore · il custode delle file
  - id: raschiatori-il-custode-delle-file
    immagine: ambientazione/rovine-dei-precursori
    titolo: Il custode delle file
    sommario: "In fondo alla Gradinata c'è una sala rotonda, e una macchina lunga e sottile che restituisce quello che le chiedi in cambio di qualcosa di tuo."
    luogo: La Gradinata Cieca, la sala rotonda
    area: raschiatori-gradinata
    requisiti: [fazione.raschiatori == 4, profondita.raschiatori-gradinata >= 4]
    testo: |
      L'apertura dà su una sala rotonda con il soffitto basso, piena di una
      luce grigia che non viene da nessuna parte. Al centro c'è un leggio di
      pietra con un disco di metallo grande come un palmo, e intorno al
      leggio cammina una macchina lunga e sottile, con le gambe come aste di
      compasso e le mani a pinza. Si ferma davanti a te e tende una pinza,
      aperta, nella posa di chi aspetta il pagamento.

      {tecnologia Media} È un archivista. Le etichette delle file le incide
      lui, e quello che prende lo cataloga. Le pinze sono fatte per
      prendere cose piccole senza romperle.

      Sul disco è incisa una ruota di quattro figure in cerchio. Il buio sta
      in cima, poi vengono il ferro e l'argento, e in fondo c'è una fiamma.
      Ti si stringe la gola senza un motivo che sapresti dire.

      {origine apprendista-raschiatore} Sono i quattro titoli dei Raschiatori,
      nell'ordine in cui li elencano i vecchi. Al Grifone la sedia della
      Fiamma è vuota dalla primavera, e qui sotto qualcuno li ha incisi prima
      che ci fosse la città.

      Alle pareti, tutto intorno, la sala è la tua mappa. Ci sono i sette
      gradini e i due bui, la sala delle file e la rampa, incisi nella pietra a rilievo
      come per un cieco. *Basta ricopiarla, e la Gradinata è nostra.* La
      pinza resta tesa.
    opzioni:
      - testo: "Dargli un ricordo"
        descrizione: "Un archivista cataloga anche quello che non pesa. Un ricordo tuo per il disco e il tempo di ricopiare la mappa."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Media }
        successo:
          titolo: Un ricordo piccolo
          testo: |
            Pensi a una cosa piccola, la prima volta che hai visto il sole
            dall'alto dei Ponti, e la metti nella pinza come si posa una moneta.
            La macchina la porta via verso le file. Ricopi la mappa dalle pareti
            sul rotolo di tela, prendi il disco dal leggio e risali. Del sole
            dai Ponti, la sera, al campo, ti resta soltanto la sensazione che ci
            fosse qualcosa di bello, una volta.

            Sopra la Gradinata un uomo del Gancio ti aspetta per dirti che
            Merlach contesterà la registrazione davanti alla Gilda.
          pe: { resilienza: 3 }
          effetti: { fazione.raschiatori: 1, oggetto.raschiatori-disco-dei-quattro-segni: 1, raschiatori.mappa: 1, reliquie.frammento-inciso: 1, tormento: 0.5 }
          vai: superficie-fratturata
        fallimento:
          titolo: Un ricordo grande
          testo: |
            Pensi a una cosa piccola, ma la pinza si chiude su un'altra, più
            grande, che non avevi offerto. La macchina la porta via verso le
            file, e tu resti in ginocchio con un vuoto dietro gli occhi. Ricopi
            la mappa dalle pareti con le mani che tremano, prendi il disco dal
            leggio e risali, e per tutta la strada cerchi di ricordarti che cosa ti
            manca.

            Sopra la Gradinata un uomo del Gancio ti aspetta per dirti che
            Merlach contesterà la registrazione davanti alla Gilda.
          effetti: { fazione.raschiatori: 1, oggetto.raschiatori-disco-dei-quattro-segni: 1, raschiatori.mappa: 1, reliquie.frammento-inciso: 1, tormento: 1.5 }
          vai: superficie-fratturata
      - testo: "Dargli un oggetto delle file al posto di uno tuo"
        descrizione: "Nel sacco hai qualcosa che viene dagli scaffali di sopra. Bisogna farglielo passare per tuo."
        prova: { attributo: sociale, abilita: ingannare, difficolta: Difficile }
        successo:
          titolo: Il pagamento falso
          testo: |
            Gli metti nella pinza una scheggia raccolta sulla strada e la
            presenti come una cosa tua, sospirando come si sospira per un
            ricordo di famiglia. La macchina la gira due volte prima di catalogarla e
            di portarla verso le file. Ricopi la mappa dalle pareti con calma,
            prendi il disco dal leggio e risali con tutto quello che avevi
            portato giù.

            Sopra la Gradinata un uomo del Gancio ti aspetta per dirti che
            Merlach contesterà la registrazione davanti alla Gilda.
          pe: { ingannare: 3 }
          effetti: { fazione.raschiatori: 1, oggetto.raschiatori-disco-dei-quattro-segni: 1, raschiatori.mappa: 1, reliquie.frammento-inciso: 2 }
          vai: superficie-fratturata
        fallimento:
          titolo: Il conto pagato due volte
          testo: |
            La macchina gira la scheggia una volta sola e la lascia cadere. Poi
            la pinza ti prende il polso, e ti sfila qualcosa che non sapevi di
            avere, con un dolore sottile che ti sale fino alla spalla. Quando ti
            lascia andare hai il disco in mano e la mappa sulle pareti davanti.
            La ricopi a fatica e risali tenendo il braccio stretto al petto.

            Sopra la Gradinata un uomo del Gancio ti aspetta per dirti che
            Merlach contesterà la registrazione davanti alla Gilda.
          effetti: { fazione.raschiatori: 1, oggetto.raschiatori-disco-dei-quattro-segni: 1, raschiatori.mappa: 1, reliquie.frammento-inciso: 1, ferite: 1, tormento: 1 }
          vai: superficie-fratturata
      - testo: "Prendere il disco senza pagare"
        descrizione: "È una macchina, e tu sei un Raschiatore. Le macchine si raschiano."
        combattimento: raschiatori-custode-delle-file
        vittoria:
          titolo: Le pinze spezzate
          testo: |
            La macchina si piega su se stessa come un compasso chiuso, e le
            pinze ti cadono ai piedi. Ricopi la mappa dalle pareti senza fretta,
            prendi il disco dal leggio e, già che ci sei, stacchi una pinza
            intera da portare su. Mentre risali ti sembra di sentire, dalle
            file, un rumore di etichette che si incidono da sole.

            Sopra la Gradinata un uomo del Gancio ti aspetta per dirti che
            Merlach contesterà la registrazione davanti alla Gilda.
          effetti: { fazione.raschiatori: 1, oggetto.raschiatori-disco-dei-quattro-segni: 1, raschiatori.mappa: 1, reliquie.frammento-inciso: 1, parte.impugnatura-2: 1 }
          vai: superficie-fratturata
        sconfitta:
          titolo: Catalogato
          testo: |
            Le pinze della macchina sono più svelte delle tue mani. Ti
            prendono la lampada e poi la corda, e alla fine ti lasciano sulla
            soglia della sala con quello che hai addosso e niente altro. Risali
            a tentoni nel buio, e quando sbuchi sul prato Pio ti corre incontro.
            Il disco è rimasto sul leggio, e la mappa sulle pareti.
          vai: superficie-fratturata
      - testo: "Pagarlo con le monete che hai in tasca"
        descrizione: "Le monete sono cose tue, e si separano da te senza dolore. Forse."
        requisiti: [monete >= 20]
        esito:
          titolo: Le monete nelle file
          testo: |
            Gli metti nella pinza le monete una alla volta, e la macchina le
            cataloga una alla volta, con calma, prima di portarle verso le file.
            Ricopi la mappa dalle pareti mentre lei lavora, prendi il disco dal
            leggio e risali. Da qualche parte là sotto adesso c'è uno scaffale
            con le tue monete in fila, ognuna con la sua etichetta.

            Sopra la Gradinata un uomo del Gancio ti aspetta per dirti che
            Merlach contesterà la registrazione davanti alla Gilda.
          effetti: { fazione.raschiatori: 1, oggetto.raschiatori-disco-dei-quattro-segni: 1, raschiatori.mappa: 1, reliquie.frammento-inciso: 1, monete: -20 }
          vai: superficie-fratturata
