# La quest dei Raschiatori, passo 5 (fazione.raschiatori 4 → 5): la spedizione alla Gradinata Cieca, tre giorni a
# ovest di Qir-Azel vicino al Bosco della Forca (codex sf-gradinata-cieca). Ci si entra dalla Superficie con
# `raschiatori-l-ottavo-gradino`, al campo della Compagnia del Gancio, che cala gli schiavi in cordata nel buio
# dell'ottavo gradino. Tagliare le corde dà raschiatori.cordata 1, che al passo 6 apre un'opzione.
# Le stanze vanno in fasce di profondità (una stanza superata non ricompare nella stessa visita):
# 0 i sette gradini o il campo della Compagnia, 1 il buio che non risponde o la corda senza piombo,
# 2 le file degli oggetti calati o lo specchio d'uscita, 3 la rampa che sale scendendo o le copie di corda e
# piombo; il gesso dei Raschiatori vale da 1 a 3. Il cuore a 4 è il custode delle file: dà la mappa
# (raschiatori.mappa), il Disco dei quattro segni e il passo; perdere lo scontro riporta in Superficie senza passo.
# La ritirata riporta alla Superficie Fratturata. Il turno ripetibile alla Gradinata (grado 2) sta in
# ripetibili.yaml ed è una scena sola, senza stanze.
aree:
  - id: raschiatori-gradinata
    immagine: ambientazione/rovine-dei-precursori
    nome: La Gradinata Cieca
    sommario: "Sette gradini di pietra grigia che scendono nella terra vicino al Bosco della Forca."
    spedizione: { ritorno: superficie-fratturata, soglia: 4, stanze: 3 }
    testo: |
      La Gradinata Cieca comincia in mezzo a un prato di erba rada senza un muro né un arco a segnarla, come
      una scala di cantina a cui hanno portato via la casa. I sette gradini sono di pietra grigia levigata e
      hanno tutti la stessa altezza fino al filo di un'unghia. Sulla pietra non c'è un lichene, e la pioggia
      di chissà quanti inverni non ci ha lasciato un segno. Al settimo la rampa finisce, e dove dovrebbe
      esserci l'ottavo gradino c'è un buio fermo che la luce delle torce non attraversa.

      Sul bordo del settimo gradino i Raschiatori di altri anni hanno piantato dei chiodi da corda, uno
      accanto all'altro. I più vecchi sono gonfi di ruggine e si sbriciolano se li tocchi. In mezzo a loro il
      bordo della pietra ha ancora lo spigolo vivo.

storylet:
  # ------------------------------------------------------------ l'ingresso, nella Superficie
  - id: raschiatori-l-ottavo-gradino
    immagine: ambientazione/rovine-dei-precursori
    titolo: L'ottavo gradino
    sommario: "Alla Gradinata Cieca la Compagnia del Gancio è arrivata un giorno prima di te, e cala gli schiavi nel buio dell'ottavo gradino uno alla volta."
    luogo: Superficie Fratturata, la Gradinata Cieca vicino al Bosco della Forca
    area: superficie-fratturata
    requisiti: [fazione.raschiatori == 4]
    testo: |
      Argento ti ha dato per le corde Pio Varre, un ragazzo di sedici anni con le orecchie a sventola che
      dorme abbracciato al sacco del piombo.

      Alla Gradinata la Compagnia del Gancio è arrivata un giorno prima e ha piantato tre tende accanto ai
      sette gradini, con un argano di legno sopra il buio dell'ottavo. L'argano è nuovo e sa ancora di resina,
      e sta piantato fra i chiodi da corda che i Raschiatori di altri anni hanno lasciato sul bordo del
      settimo gradino. Due sorveglianti con il gancio dipinto sulla manica calano nel buio un uomo scalzo con
      il collare al collo e una lampada spenta in mano. La corda scende a lungo e poi si ferma. Dal buio non
      sale nessun rumore, nemmeno quello della corda che sfrega sulla pietra. Quando la tirano su non ci sono
      più né l'uomo né il piombo, e il capo della corda è tagliato di netto.

      Altri tre legati aspettano il loro turno seduti sull'erba senza guardare il buio. Sui rami bassi del
      Bosco della Forca stanno appollaiate le cornacchie, e nessuna scende sul prato intorno ai gradini.

      {empatia Facile} L'ultimo della fila è un ragazzo più giovane di Pio e ha visto il bracciale dei turni
      al tuo polso. Da allora tiene gli occhi sul bracciale, e le mani legate gli tremano in grembo.

      Pio ti chiede a bassa voce che cosa facciamo, e il plurale gli trema un poco.
    opzioni:
      - testo: "Tagliare le corde e tirare su la cordata"
        descrizione: "I tre che aspettano sono legati alla stessa corda madre."
        prova: { attributo: fisico, abilita: atletica, difficolta: Media }
        successo:
          titolo: La corda madre
          testo: |
            Tagli la corda madre a due palmi dall'argano, e mentre i sorveglianti si girano tiri via i tre
            sull'erba, con Pio che si appende alla corda come a una campana. I tre hanno ancora il collare, e
            il collare non è più legato a niente. I sorveglianti guardano il tuo coltello e il bracciale dei
            turni, e decidono che la paga non vale la discesa. Si chiudono nelle tende. Lasci i tre con Pio e
            con il pane del sacco, e ti cali oltre il settimo gradino con la tua corda e il tuo piombo.
          pe: { atletica: 3 }
          imposta: { raschiatori.cordata: 1 }
          vai: raschiatori-gradinata
        fallimento:
          titolo: Il randello
          testo: |
            Tagli la corda madre, ma il sorvegliante più vicino è più svelto di quanto sembrava e ti arriva
            addosso con il randello prima che tu abbia finito di tirare. Il colpo ti prende la spalla, e la
            senti gonfiarsi calda sotto la camicia. I tre però sono già sull'erba, e Pio li trascina dietro le
            tende mentre tu e il sorvegliante restate a guardarvi in cagnesco. Alla fine lui sputa per terra e
            torna all'argano. Ti cali oltre il settimo gradino con un braccio che non vuole saperne.
          imposta: { raschiatori.cordata: 1 }
          effetti: { ferite: 1 }
          vai: raschiatori-gradinata
      - testo: "Scendere prima di loro, di notte"
        descrizione: "La Compagnia di notte non cala nessuno. Se scendi tu nel buio mentre dormono, il sito è registrato prima che si sveglino."
        prova: { attributo: fisico, abilita: furtivita, difficolta: Media }
        successo:
          titolo: Il chiodo arrugginito
          testo: |
            Aspetti che nelle tende si spengano le lampade, e intanto Pio ti racconta a bisbigli tutto quello
            che sa sugli argani. Poi leghi la tua corda a un chiodo arrugginito del settimo gradino, uno di
            quelli che la Compagnia non ha toccato. È di ferro battuto a mano e la ruggine se l'è mangiato
            fino a metà, e regge lo stesso quando ci appendi tutto il tuo peso. Ti cali nel buio senza far
            rumore. Dalla tenda più vicina qualcuno russa per tutto il tempo.
          pe: { furtivita: 3 }
          vai: raschiatori-gradinata
        fallimento:
          titolo: La lampada che si accende
          testo: |
            Aspetti che nelle tende si spengano le lampade, ma sul settimo gradino ti scivola di mano il
            piombo, che rotola giù battendo contro la pietra. Il rumore si sente per tre colpi e smette di
            netto dove comincia il buio. Si accende una lampada, poi un'altra. Ti cali nel buio troppo in
            fretta, con la corda che ti brucia fra le mani, e arrivi giù con le ginocchia che hanno preso
            tutto il colpo.
          effetti: { ferite: 0.5 }
          vai: raschiatori-gradinata
      - testo: "Mandare via i sorveglianti"
        descrizione: "Sono due, e la paga del Gancio non comprende i Raschiatori arrabbiati."
        combattimento: raschiatori-sorveglianti
        vittoria:
          titolo: Il campo vuoto
          testo: |
            Il primo sorvegliante finisce sull'erba, e il secondo guarda il compagno a terra prima di guardare
            il buio dell'ottavo gradino. Poi sceglie la strada per il bosco. Tagli le corde dei tre che
            aspettavano, e il più giovane tiene il collo teso perché la lama non lo tocchi. Li lasci a Pio con
            il pane del sacco. Ti cali oltre il settimo gradino con la tua corda e il tuo piombo, e il campo
            alle tue spalle è silenzioso.
          imposta: { raschiatori.cordata: 1 }
          vai: raschiatori-gradinata
        sconfitta:
          titolo: Fuori dal campo
          testo: |
            I due sorveglianti sanno lavorare in coppia meglio di quanto sappiano calare una corda. Ti ritrovi
            sull'erba fuori dal campo, con la bocca che sa di terra e Pio che ti tampona la fronte con il
            fazzoletto della madre. Sotto il fazzoletto la fronte ti pulsa, e la stoffa si macchia in fretta.
            Ci vorrà un altro tentativo, e più prudenza.
      - testo: "Pagare un sorvegliante per un turno all'argano"
        descrizione: "Un sorvegliante del Gancio è pagato per calare corde. Qualche moneta in più, e cala anche la tua."
        requisiti: [monete >= 15]
        esito:
          titolo: Il turno all'argano
          testo: |
            Il sorvegliante conta le monete due volte, la seconda guardando il campo per vedere se qualcuno lo
            vede. Poi lega la tua corda al suo argano e ti cala nel buio senza una parola, come cala gli
            altri. La manovella cigola a ogni giro, e dopo pochi giri il cigolio non ti arriva più anche se la
            corda continua a scendere. L'ultima cosa che vedi dall'alto è il ragazzo più giovane della fila
            che ti guarda scendere.
          effetti: { monete: -15 }
          vai: raschiatori-gradinata

  # ------------------------------------------------------------ 0 · l'arrivo
  - id: raschiatori-gradinata-i-sette-gradini
    immagine: ambientazione/rovine-dei-precursori
    titolo: I sette gradini
    sommario: "Oltre il buio i gradini ricominciano, sempre alti uguali. Dopo il settimo non sai più se stai salendo o scendendo."
    luogo: La Gradinata Cieca, oltre il buio dell'ottavo gradino
    area: raschiatori-gradinata
    ripetibile: true
    requisiti: [fazione.raschiatori == 4, profondita.raschiatori-gradinata == 0]
    testo: |
      Oltre il buio dell'ottavo gradino ci sono altri gradini. Li senti con la punta dello stivale prima di
      vederli, perché qui la lampada arriva a un braccio e non oltre. Sono di pietra grigia come quelli di
      sopra e hanno tutti la stessa altezza, senza una scheggia sugli spigoli. L'aria che sale dal basso è
      asciutta e non sa di niente. Ne conti sette, e al settimo la rampa finisce contro un altro buio uguale
      al primo.

      {percezione Media} I gradini di sopra erano consumati al centro e questi sui bordi, come se chi li
      percorre camminasse lontano dal mezzo. Il solco sui bordi è largo quanto un piede e profondo un dito.

      La corda legata in vita pende tesa verso l'alto, e a ogni gradino ti sembra più corta.
    opzioni:
      - testo: "Scendere contando ad alta voce"
        descrizione: "Se i gradini si ripetono, almeno il conto lo tieni tu."
        prova: { attributo: mentale, abilita: percezione, difficolta: Media }
        successo:
          titolo: Quattordici
          testo: |
            Conti ad alta voce, e la voce ti torna indietro dal buio con un ritardo regolare. Ti dici che il
            vano è stretto e dritto, e che per questo l'eco torna sempre uguale. Al quattordicesimo gradino la
            pietra si fa più scura sotto la lampada, e ti fermi. Lì fra due gradini c'è incastrata una
            scheggia di metallo che qualcuno ha perso scendendo, e la prendi.
          effetti: { profondita.raschiatori-gradinata: 1, reliquie.scheggia: 1 }
        fallimento:
          titolo: Il conto che ricomincia
          testo: |
            Arrivat{o|a} a nove ti accorgi di aver detto sette due volte, e ricominci. Alla terza volta che
            ricominci la voce che torna dal buio conta un numero avanti a te. Dice otto quando tu hai appena
            detto sette, con la tua stessa voce e senza il fiato corto che hai tu. Ti siedi sul gradino finché
            le gambe non smettono di formicolare, e per prudenza smetti di contare qualunque cosa.
          effetti: { tormento: 1 }
      - testo: "Calarsi lungo il vano con la corda"
        descrizione: "I gradini si possono saltare. Basta fidarsi della corda e del chiodo di sopra."
        prova: { attributo: fisico, abilita: atletica, difficolta: Media }
        successo:
          titolo: A corda tesa
          testo: |
            Ti cali di schiena lungo il vano puntando i piedi sui bordi dei gradini senza appoggiarti, e la
            corda tiene. Gli stivali trovano presa soltanto sulla pietra intatta accanto al solco, che è
            liscia come l'interno di una conchiglia. Dopo un tratto lungo tocchi un fondo piano, e la corda
            smette di tirare all'insù come se di sopra qualcuno l'avesse lasciata andare. Sei più giù di
            quanto i gradini avrebbero voluto.
          pe: { atletica: 2 }
          effetti: { profondita.raschiatori-gradinata: 1 }
        fallimento:
          titolo: Il bordo
          testo: |
            A metà del vano un piede scivola sul bordo levigato di un gradino, e sbatti il fianco contro lo
            spigolo con tutto il tuo peso. La corda tiene. Lo spigolo è vivo e senza un'ammaccatura, e ti ha
            aperto la giubba sul fianco. Resti appes{o|a} a guardare la lampada che dondola, poi risali fino
            al primo gradino e ti siedi a massaggiarti le costole.
          effetti: { ferite: 0.5 }
      - testo: "Scendere seduto, un gradino alla volta"
        descrizione: "Lento, con la schiena alla parete. Il buio aspetta da secoli, e può aspettare anche te."
        costo: 2
        esito:
          titolo: "Sedut{o|a}"
          testo: |
            Scendi sedut{o|a}, un gradino alla volta, con le mani sulla pietra e la schiena alla parete. Ci
            metti un tempo che non sapresti dire, e a un certo punto ti sembra di sentire qualcuno che scende
            con lo stesso passo un poco dietro di te. Ti fermi, e quel passo si ferma un gradino dopo il tuo.
            Ti dici che è l'eco del vano e riprendi a scendere. Quando arrivi in fondo ti giri, e dietro ci
            sono soltanto i gradini, consumati sui bordi.
          effetti: { profondita.raschiatori-gradinata: 1, tormento: 1 }

  - id: raschiatori-gradinata-il-campo-della-compagnia
    immagine: ambientazione/rovine-dei-precursori
    titolo: Le lampade della Compagnia
    sommario: "Subito sotto il buio la Compagnia ha lasciato le sue lampade e un sorvegliante di guardia, che non si aspetta visite dall'alto."
    luogo: La Gradinata Cieca, il primo pianerottolo
    area: raschiatori-gradinata
    ripetibile: true
    requisiti: [fazione.raschiatori == 4, profondita.raschiatori-gradinata == 0]
    testo: |
      Sotto il buio c'è un pianerottolo largo che la Compagnia ha già preso per magazzino, con tre lampade
      appese a chiodi nuovi e un rotolo di corda con il gancio di ferro. I chiodi sono piantati a colpi di
      mazza nelle giunture della parete, e intorno a nessuno di loro la pietra si è scheggiata. Su una cassa
      siede un sorvegliante che mangia a morsi una cipolla cruda, e l'odore arriva fino all'ultimo gradino.
      Guarda il vano che scende, perché i guai li aspetta da lì.

      {armi-da-mischia Facile} Ha il randello appoggiato alla cassa dalla parte opposta alla mano con cui
      mangia, e qui sotto il tempo di cambiare mano è tanto.

      Le lampade della Compagnia fanno più luce della tua, e il vano dietro il sorvegliante è nero lo stesso
      già al terzo gradino.
    opzioni:
      - testo: "Toglierlo di mezzo"
        descrizione: "È solo, e ha la bocca piena."
        combattimento: raschiatori-un-sorvegliante
        vittoria:
          titolo: La cipolla
          testo: |
            Il sorvegliante fa in tempo a lasciar cadere la cipolla e a cercare il randello con la mano
            sbagliata. La cipolla rotola fino al bordo del vano e ci cade dentro, e non la senti arrivare in
            fondo. Lo lasci legato alla sua cassa con la sua stessa corda, e prendi una delle lampade del
            Gancio, che fa più luce della tua. Il vano scende davanti a te, e da qui in poi nessuno ha ancora
            piantato chiodi.
          effetti: { profondita.raschiatori-gradinata: 1 }
        sconfitta:
          titolo: Il randello
          testo: |
            Il sorvegliante cambia mano più in fretta di quanto avevi previsto, e il randello ti trova la
            tempia. Quando ti riprendi hai il sangue secco sulla guancia e un ronzio nell'orecchio da quella
            parte. Lui sta seduto sulla cassa a mangiare un'altra cipolla, e ti guarda come si guarda un
            problema che si risolverà da solo. Risali di qualche gradino per pensarci meglio.
      - testo: "Passargli alle spalle"
        descrizione: "Guarda il vano che scende, e il pianerottolo è largo. Basta restare dalla parte del buio."
        prova: { attributo: fisico, abilita: furtivita, difficolta: Media }
        successo:
          titolo: Dalla parte del buio
          testo: |
            Passi rasente al bordo del buio, dove la sua lampada non arriva, e lui continua a mangiare la
            cipolla guardando dall'altra parte. Il bordo è così netto che il braccio sinistro ti sparisce nel
            nero e il destro resta nella luce. Prendendo il vano che scende stacchi anche un chiodo nuovo
            dalla parete, così la sua lampada si inclina e lui impreca contro il chiodo invece che contro di
            te.
          pe: { furtivita: 2 }
          effetti: { profondita.raschiatori-gradinata: 1 }
        fallimento:
          titolo: Il morso a metà
          testo: |
            Sei a metà del pianerottolo quando lui smette di masticare. Ti guarda con il morso ancora in
            bocca, e tu guardi lui, e per il tempo di un boccone nessuno dei due sa che cosa fare. Poi lui
            fischia, e da sotto risponde un altro fischio sulla stessa nota e lungo uguale. Torni nel buio di
            sopra prima di sapere chi l'ha fatto.
          effetti: { sospetto: 1 }
      - testo: "Aspettare che cambi il turno di guardia"
        descrizione: "Prima o poi qualcuno sale a dargli il cambio, e per un po' il pianerottolo resta vuoto."
        costo: 2
        esito:
          titolo: Il cambio
          testo: |
            Aspetti sedut{o|a} sull'ultimo gradino, con il freddo della pietra che ti sale nelle ossa un poco
            alla volta. Dopo un tempo lungo da sotto sale un altro sorvegliante, con la polvere grigia fino
            alle ginocchia, e i due risalgono insieme per mangiare. Il nuovo arrivato non dice una parola al
            compagno per tutta la salita. Il pianerottolo resta vuoto quanto basta. Attraversi con le gambe
            rigide e la schiena che si lamenta.
          effetti: { profondita.raschiatori-gradinata: 1, ferite: 0.5 }

  # ------------------------------------------------------------ 1 · il buio che non risponde
  - id: raschiatori-gradinata-il-buio-che-non-risponde
    immagine: ambientazione/regno-profondo
    titolo: Il buio che non risponde
    sommario: "Il vano si riempie di un buio che la lampada non attraversa. Dentro si cammina a memoria, e la memoria qui non è tua."
    luogo: La Gradinata Cieca, il secondo buio
    area: raschiatori-gradinata
    ripetibile: true
    requisiti: [fazione.raschiatori == 4, profondita.raschiatori-gradinata == 1]
    testo: |
      Il secondo buio arriva senza preavviso. Fai un passo e la lampada ti illumina la mano e basta, come se
      avessi infilato il braccio in un sacco di velluto. Il vano da cui vieni è ancora chiaro e davanti c'è
      soltanto il nero. Il confine fra i due passa sul pavimento in una linea dritta, e anche il rumore dei
      passi cambia quando la superi. Dall'altra parte lo stivale sulla pietra fa un suono sordo e piatto,
      senza eco.

      {magia Media} Questo buio prende la luce e non la restituisce. Il Mana qui è teso e fermo, e si chiude
      intorno alla fiamma a un palmo di distanza.

      Al limite della luce c'è in terra una candela da scavo consumata a metà, con lo stoppino rivolto verso
      il basso. Ti dici che chi l'ha lasciata l'ha capovolta per spegnerla. Le colature di cera sul fusto sono
      indurite verso l'alto, in gocce che puntano al soffitto.
    opzioni:
      - testo: "Seguire il bordo della candela"
        descrizione: "Chi l'ha lasciata lì l'ha lasciata per qualcuno. Lo stoppino indica una direzione."
        prova: { attributo: mentale, abilita: [percezione, magia], difficolta: Media }
        successo:
          titolo: Lo stoppino
          testo: |
            Accendi la candela, e la fiamma pende all'ingiù verso il pavimento, come se il basso fosse da
            un'altra parte. Quando ti chini a guardarla non ti scalda il viso. La segui piegat{o|a} in due,
            con la candela davanti alle ginocchia, e il nero si apre di un palmo alla volta intorno alla
            fiamma. Quando arrivi dall'altra parte la candela si spegne da sola, e la lampada torna a fare
            luce.
          pe: { percezione: 2 }
          effetti: { profondita.raschiatori-gradinata: 1 }
        fallimento:
          titolo: La fiamma al contrario
          testo: |
            Accendi la candela, e la fiamma pende all'ingiù. La guardi troppo a lungo, e la testa decide che
            il pavimento è il soffitto. Ti ritrovi in ginocchio con le mani piatte sulla pietra,
            aggrappat{o|a} a qualcosa che non si muove, e devi deglutire più volte per non vomitare. Torni
            indietro a carponi fino al vano chiaro.
          effetti: { tormento: 1 }
      - testo: "Camminare a occhi chiusi"
        descrizione: "Se il buio prende la luce, la luce non serve. Restano i piedi, e i nervi."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Media }
        successo:
          titolo: A occhi chiusi
          testo: |
            Chiudi gli occhi e cammini con una mano sulla parete, contando i passi a mezza voce. Il buio a
            occhi chiusi è soltanto il tuo, e quello lo conosci. Sotto le dita la parete è liscia e senza una
            giuntura per tutto il tratto, e non cambia mai temperatura. Dopo cinquanta passi la mano trova uno
            spigolo, e quando riapri gli occhi la lampada illumina di nuovo un vano di pietra grigia.
          pe: { resilienza: 2 }
          effetti: { profondita.raschiatori-gradinata: 1 }
        fallimento:
          titolo: La mano sulla parete
          testo: |
            Chiudi gli occhi e cammini con una mano sulla parete, e a un certo punto la parete smette di
            esserci. Dove finisce non c'è uno spigolo, e sotto il polpastrello resta soltanto un bordo sottile
            e liscio. La mano trova aria, e poi qualcosa di tiepido che si ritira. Riapri gli occhi nel nero,
            e ci metti molto a ritrovare il vano chiaro alle tue spalle.
          effetti: { tormento: 1 }
      - testo: "Legarsi alla corda e procedere a tentoni"
        descrizione: "Una corda legata in vita e l'altro capo al chiodo. Lento, e la corda ogni tanto tira dalla parte sbagliata."
        costo: 2
        esito:
          titolo: A tentoni
          testo: |
            Leghi il capo della corda a un chiodo e procedi a tentoni, un palmo alla volta, con la corda che
            ti segue nel nero. Due volte la senti tirare indietro piano, come una mano che ti trattiene per la
            giubba, e due volte ti fermi ad aspettare che smetta. Ti dici che si è impigliata in uno spigolo.
            Dall'altra parte la lampada torna a fare luce, e tu hai la nuca fradicia. Quando riavvolgi la
            corda non trovi un filo tirato per tutta la sua lunghezza.
          effetti: { profondita.raschiatori-gradinata: 1, tormento: 1 }

  - id: raschiatori-gradinata-la-corda-senza-piombo
    immagine: ambientazione/rovine-dei-precursori
    titolo: La corda senza piombo
    sommario: "Una corda del Gancio pende nel vano, tagliata netta. In fondo, seduto contro la parete, c'è l'uomo che hai visto calare dall'argano."
    luogo: La Gradinata Cieca, il vano della corda
    area: raschiatori-gradinata
    ripetibile: true
    requisiti: [fazione.raschiatori == 4, profondita.raschiatori-gradinata == 1]
    testo: |
      Nel vano pende una corda del Gancio tagliata di netto, e sul taglio non c'è un filo sfilacciato. Sotto
      siede contro la parete l'uomo che hai visto calare dall'argano, con la lampada spenta in grembo. Ha gli
      occhi aperti e respira, ma non sbatte le palpebre quando gli punti addosso la luce. È ancora scalzo, e
      le piante dei piedi sono pulite e senza la polvere grigia del vano.

      {medicina Media} Ha la febbre alta e le mani fredde, e il collare gli ha fatto sanguinare il collo.
      Sotto le dita il polso è rapido e leggero.

      {origine fuggiasco-di-ghoran} Il collare è di quelli che si stringono tirando, e lo conosci dalle notti
      in cui lo tenevi allentato con due dita per dormire.

      Accanto a lui c'è il piombo che mancava alla corda, posato dritto sulla base e con un pezzo di corda
      ancora annodato all'occhiello.
    opzioni:
      - testo: "Tirarlo su e farlo camminare"
        descrizione: "Pesa come un uomo, e non ti aiuta. Bisogna tirarlo su e reggerlo finché le gambe si ricordano."
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Media }
        successo:
          titolo: Le gambe che si ricordano
          testo: |
            Lo tiri su per le ascelle e gli passi il suo braccio intorno al collo, e per un tratto lo
            trascini. È leggero per la sua statura e attraverso la camicia scotta. Poi le sue gambe cominciano
            a fare i passi da sole, uno ogni tre dei tuoi, e lui ti dice un nome che non è il suo e nemmeno il
            tuo. Lo lasci con la tua borraccia in fondo al vano dove l'aria è meno ferma, e prosegui.
          pe: { resistenza: 2 }
          effetti: { profondita.raschiatori-gradinata: 1, rep.raschiatori: 0.5 }
        fallimento:
          titolo: Il peso morto
          testo: |
            Provi a tirarlo su, e lui si lascia andare con tutto il peso. Cadete insieme sul pavimento di
            pietra, e il piombo rotola via nel buio senza fare rumore. Il suo respiro ti arriva sul collo
            lento e regolare, e non cambia nemmeno nella caduta. Resti sedut{o|a} accanto a lui con un
            ginocchio che pulsa, finché lui non chiude gli occhi e si addormenta davvero.
          effetti: { ferite: 0.5 }
      - testo: "Parlargli finché ti guarda"
        descrizione: "Gli occhi sono aperti, e dentro c'è ancora qualcuno. Basta trovare la parola che lo fa tornare."
        prova: { attributo: sociale, abilita: empatia, difficolta: Media }
        successo:
          titolo: Il nome
          testo: |
            Gli parli piano, del sole sopra la Gradinata e del pane che Pio ha nel sacco, finché gli occhi si
            spostano su di te. Le pupille si stringono alla luce della lampada. Allora ti dice il suo nome due
            volte, la seconda con stupore, come se l'avesse ritrovato in tasca. Lo aiuti ad alzarsi e gli
            indichi la corda. Ci si arrampica da solo e adagio mentre tu prosegui verso il basso.
          pe: { empatia: 2 }
          effetti: { profondita.raschiatori-gradinata: 1, rep.raschiatori: 0.5 }
        fallimento:
          titolo: Gli occhi aperti
          testo: |
            Gli parli a lungo, e lui continua a guardare il punto dove eri prima di sederti accanto a lui. In
            quel punto c'è soltanto la pietra grigia, e sulla polvere non ci sono impronte. A un certo punto
            ti accorgi che stai parlando con la voce che usava tua madre per farti addormentare. Ti fermi, e
            il silenzio del vano ti torna addosso tutto insieme.
          effetti: { tormento: 1 }
      - testo: "Lasciargli la lampada accesa e proseguire"
        descrizione: "Non puoi portarlo con te. Gli lasci la luce, e al ritorno ci ripensi."
        costo: 2
        esito:
          titolo: La lampada accesa
          testo: |
            Gli accendi la lampada con la tua e gliela rimetti in grembo, con le sue mani sopra. Le sue dita
            sono fredde sul vetro caldo. Lui la stringe, e per un momento sembra sorridere. Prosegui verso il
            basso voltandoti ogni dieci passi, finché la piccola luce resta indietro e scompare dietro una
            curva che il vano prima non faceva.
          effetti: { profondita.raschiatori-gradinata: 1, tormento: 1 }

  # ------------------------------------------------------------ 1–3 · il gesso dei Raschiatori
  - id: raschiatori-gradinata-il-gesso
    immagine: ambientazione/rovine-dei-precursori
    titolo: Il gesso dei Raschiatori
    sommario: "Sulla parete del vano ci sono segni di gesso lasciati da squadre di altri anni. Alcuni indicano la strada, altri l'hanno sbagliata."
    luogo: La Gradinata Cieca, una parete segnata
    area: raschiatori-gradinata
    ripetibile: true
    requisiti: [fazione.raschiatori == 4, profondita.raschiatori-gradinata >= 1, profondita.raschiatori-gradinata <= 3]
    testo: |
      Su un tratto di parete i Raschiatori di altri anni hanno lasciato i loro segni di gesso uno sopra
      l'altro, come le firme su un muro di taverna. I più vecchi sono sbiaditi fin quasi al colore della
      pietra, e chi è venuto dopo ha scritto negli spazi liberi senza cancellarne uno. Accanto a una freccia
      qualcuno ha disegnato una piccola lanterna con la fiamma storta.

      {accademiche Media} I segni più vecchi usano per *pericolo* il cerchio con due punti, che le squadre
      hanno smesso di usare da una generazione. Chi li ha fatti scendeva qui prima che nascesse la Compagnia.

      Il gesso è asciutto e polveroso, e ti resta sui polpastrelli quando passi le dita sui segni. Due frecce
      indicano strade opposte, e le ha fatte la stessa mano.
    opzioni:
      - testo: "Leggere i segni come li legge Dragna"
        descrizione: "Il gesso dei Raschiatori ha la sua grammatica. Chi la conosce sa quale freccia è stata scritta da chi tornava."
        prova: { attributo: mentale, abilita: accademiche, difficolta: Media }
        successo:
          titolo: La freccia di chi tornava
          testo: |
            Una delle due frecce ha la punta ripassata, e il gesso della seconda mano è più fresco. Il tratto
            nuovo è più grasso e calcato, e sotto si vede ancora quello vecchio. Chi l'ha ripassata tornava, e
            voleva che chi scendeva dopo di lui non sbagliasse. Prendi quella strada, e dopo un tratto trovi
            una piccola croce dove qualcuno si è fermato a riposare.
          pe: { accademiche: 2 }
          effetti: { profondita.raschiatori-gradinata: 1 }
        fallimento:
          titolo: L'altra freccia
          testo: |
            Scegli la freccia più chiara, e dopo un tratto il vano si stringe fino a costringerti a passare di
            fianco. La pietra ti preme sul petto e sulla schiena insieme, e per passare devi buttare fuori
            tutta l'aria. In fondo trovi una croce di gesso sola sul pavimento, e decidi di non sapere che
            cosa voleva dire. Torni ai segni con la camicia strappata su una spalla.
          effetti: { ferite: 0.5 }
      - testo: "Aggiungere il tuo segno e seguire l'istinto"
        descrizione: "Un segno in più sulla parete non fa male a nessuno, e l'istinto, qualche volta, è quello di chi ti ha preceduto."
        costo: 2
        esito:
          titolo: Il tuo segno
          testo: |
            Fai una piccola freccia con il gesso del sacco accanto alla lanterna con la fiamma storta, e
            prendi la strada che ti dice la pancia. Il tuo segno è il più bianco della parete, e anche il più
            piccolo. Ci metti il doppio, perché a ogni bivio torni indietro a controllare, ma arrivi. Il gesso
            ti resta sulle dita per tutto il giorno, e ti viene da annusarlo come una cosa di casa.
          effetti: { profondita.raschiatori-gradinata: 1, tormento: 1 }
      - testo: "Seguire la lanterna con la fiamma storta"
        descrizione: "Un Raschiatore ha disegnato una lanterna e non una freccia. Fra i Raschiatori una lanterna si disegna per qualcuno."
        prova: { attributo: sociale, abilita: empatia, difficolta: Facile }
        successo:
          titolo: Per qualcuno
          testo: |
            Accanto alla lanterna, più in basso, c'è un nome scritto piccolo che il gesso ha quasi cancellato.
            Le lettere sono strette e tutte inclinate dalla stessa parte, e si leggono meglio al tatto che
            alla luce. Ti viene da salutarlo, e lo fai a mezza voce. Poi segui la direzione in cui pende la
            fiamma, e la strada è buona.
          effetti: { profondita.raschiatori-gradinata: 1 }
        fallimento:
          titolo: Il nome cancellato
          testo: |
            Cerchi un nome accanto alla lanterna e non lo trovi. Passi le dita sulla pietra intorno al disegno
            e trovi soltanto la grana ruvida e la polvere. Ti resta addosso la sensazione di aver mancato di
            rispetto a qualcuno, e ti siedi un momento davanti ai segni senza sapere quale prendere.
          effetti: { tormento: 1 }

  # ------------------------------------------------------------ 2 · le file e lo specchio
  - id: raschiatori-gradinata-le-file
    immagine: ambientazione/rovine-dei-precursori
    titolo: Le file degli oggetti calati
    sommario: "Una sala lunga con scaffali di pietra, e sopra, in file ordinate, tutto quello che è stato calato oltre l'ottavo gradino in decenni."
    luogo: La Gradinata Cieca, la sala degli scaffali
    area: raschiatori-gradinata
    ripetibile: true
    requisiti: [fazione.raschiatori == 4, profondita.raschiatori-gradinata == 2]
    testo: |
      Il vano sbocca in una sala lunga con scaffali di pietra scavati nelle pareti. Sono tagliati nella roccia
      viva senza un segno di scalpello, con gli spigoli dritti e i ripiani tutti alla stessa distanza. Sugli
      scaffali c'è in file ordinate tutto quello che in decenni è stato calato dalla Gradinata, perfino un
      cappello. Sui ripiani non c'è polvere. Ti dici che qualche squadra prima di te ha messo in ordine per
      fare l'inventario. Ogni cosa ha un'etichetta di metallo che non sai leggere, incisa a segni fitti e
      senza un filo di ossido.

      {percezione Facile} Sono tutti un poco sbagliati. Le corde hanno i nodi al contrario e le candele lo
      stoppino dalla parte della base.

      Su uno scaffale in basso c'è una lampada da scavo identica alla tua, con la stessa ammaccatura sul
      fondo. L'etichetta accanto ha un segno inciso di fresco ed è ancora calda.
    opzioni:
      - testo: "Studiare le etichette"
        descrizione: "Gli scaffali sono un archivio, e un archivio ha un ordine. Capirlo vuol dire capire dove porta la sala."
        prova: { attributo: mentale, abilita: [accademiche, tecnologia], difficolta: Media }
        successo:
          titolo: L'ordine delle file
          testo: |
            Le etichette sono in ordine di arrivo, dalle più vecchie verso il fondo della sala alle più nuove
            verso l'ingresso. Vicino all'ingresso il solco delle incisioni ha ancora il bordo lucido. Le più
            vecchie hanno un segno diverso, un cerchio diviso in quattro, e accanto a una di quelle stacchi un
            frammento inciso caduto dallo scaffale. Prosegui verso il fondo, dove le cose sono state calate
            per prime.
          pe: { accademiche: 2 }
          effetti: { profondita.raschiatori-gradinata: 1, reliquie.frammento-inciso: 1 }
        fallimento:
          titolo: La tua lampada
          testo: |
            Mentre leggi le etichette la lampada sullo scaffale si accende da sola, e la tua si spegne. Senti
            il vetro della tua lampada raffreddarsi sotto le dita. Resti al buio con la luce dell'altra
            davanti, che illumina lo scaffale e non te. Quando la tua si riaccende hai le mani che tremano, e
            quella sullo scaffale è spenta con il vetro appannato, come dopo un respiro.
          effetti: { tormento: 1 }
      - testo: "Prendere la lampada che è uguale alla tua"
        descrizione: "È tua, o lo sarà. Un Raschiatore non lascia la sua lampada in un posto così."
        prova: { attributo: fisico, abilita: furtivita, difficolta: Media }
        successo:
          titolo: Le due lampade
          testo: |
            La prendi in fretta come si prende una moneta dal piatto di un mendicante, e la metti nel sacco.
            Sullo scaffale resta l'etichetta, e il segno fresco è già freddo. Per un lungo momento la sala
            resta ferma, e allora prosegui con due lampade uguali, una che fa luce e una che non pesa niente.
          effetti: { profondita.raschiatori-gradinata: 1, reliquie.scheggia: 2 }
        fallimento:
          titolo: L'etichetta calda
          testo: |
            Allunghi la mano, e l'etichetta accanto alla lampada diventa rovente e ti segna le dita. Il rosso
            sui polpastrelli ha la forma del segno inciso, rovesciato. Ritiri la mano con un sibilo, e dal
            fondo della sala arriva un rumore di passi lunghi e lenti che si avvicinano e poi si fermano.
          effetti: { ferite: 0.5, tormento: 1 }
      - testo: "Attraversare la sala senza toccare niente"
        descrizione: "Gli scaffali sono pieni di cose di altri. Le lasci dove sono, e cammini nel mezzo."
        costo: 2
        esito:
          titolo: Nel mezzo
          testo: |
            Attraversi la sala camminando nel mezzo, con le mani in tasca come al mercato quando non hai
            soldi. Ci metti molto, perché la sala è più lunga di quanto sembrava dall'ingresso. A metà passi
            accanto al cappello, e il feltro ha ancora la piega di una testa. Le file degli oggetti calati
            scorrono dai due lati, e dopo un po' smetti di chiederti chi li ha messi in fila.
          effetti: { profondita.raschiatori-gradinata: 1, tormento: 1 }

  - id: raschiatori-gradinata-lo-specchio
    immagine: ambientazione/regno-profondo
    titolo: Lo specchio d'uscita
    sommario: "In fondo a un corridoio una lastra lucida rimanda l'immagine della Gradinata vista da fuori, con il prato al sole e le tende della Compagnia."
    luogo: La Gradinata Cieca, il corridoio dello specchio
    area: raschiatori-gradinata
    ripetibile: true
    requisiti: [fazione.raschiatori == 4, profondita.raschiatori-gradinata == 2]
    testo: |
      In fondo a un corridoio c'è una lastra lucida alta come una porta. È incassata nella pietra senza
      cornice e senza giunture, e sulla superficie non c'è un velo di polvere. Invece di te stess{o|a} ci vedi
      la Gradinata da fuori, con le tende della Compagnia e il sole alto sul prato. L'erba si piega al vento,
      e nel corridoio l'aria non si muove. Pio mangia il pane del sacco seduto sull'erba accanto ai tre che
      hai tirato su, o al posto dove li avresti lasciati.

      {resilienza Media} È un'uscita, o vuole sembrarlo. Chi è stanco la prende senza farsi domande, e i
      Raschiatori stanchi muoiono così.

      Ti dici che è un vetro dei Precursori, e che ne hai già visti di strani. La lastra è tiepida sotto il
      palmo, e la tua mano non ci si riflette.
    opzioni:
      - testo: "Voltare le spalle allo specchio"
        descrizione: "Il prato è là sopra, e ci tornerai con le tue gambe. Adesso bisogna trovare la strada che scende."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Media }
        successo:
          titolo: Le spalle al sole
          testo: |
            Ti volti e cammini, e senti il sole dello specchio sulla nuca per un lungo tratto, con l'odore
            dell'erba tagliata che non c'è. Lo lasci dov'è. Per qualche passo dietro di te ronza un'ape. Più
            avanti il corridoio piega verso il basso, e il calore sulla nuca si spegne come una candela
            soffiata.
          pe: { resilienza: 2 }
          effetti: { profondita.raschiatori-gradinata: 1 }
        fallimento:
          titolo: Un passo verso il prato
          testo: |
            Fai un passo verso lo specchio prima di deciderlo, poi un altro. Ti ferma il freddo della lastra
            sulla fronte. Hai la pelle del viso calda e tirata, come dopo una giornata nei campi. Resti lì
            appoggiat{o|a} con gli occhi chiusi finché il prato smette di chiamarti, e quando li riapri lo
            specchio riflette di nuovo il corridoio, e te.
          effetti: { tormento: 1.5 }
      - testo: "Cercare nello specchio la strada che scende"
        descrizione: "Se lo specchio fa vedere la Gradinata da fuori, nel riflesso ci sono anche i gradini. Basta guardare bene da quale parte vanno."
        prova: { attributo: mentale, abilita: percezione, difficolta: Media }
        successo:
          titolo: I gradini nello specchio
          testo: |
            Nello specchio i sette gradini scendono da sinistra a destra, e quelli veri da destra a sinistra.
            Lo controlli due volte contando i gradini nel riflesso, e sono sempre sette. La strada buona è
            quella dello specchio. Prendi il corridoio di sinistra, quello che non avresti mai preso, e dopo
            un tratto la pietra sotto i piedi comincia a scendere.
          pe: { percezione: 2 }
          effetti: { profondita.raschiatori-gradinata: 1 }
        fallimento:
          titolo: Pio nello specchio
          testo: |
            Guardi bene, e nello specchio Pio alza la testa e ti guarda. Ha le briciole del pane sul mento e
            non smette di masticare. Ti fa un cenno con la mano, e tu glielo ricambi prima di pensarci. Il
            corridoio alle tue spalle si fa più freddo, e decidi che per adesso hai guardato abbastanza.
          effetti: { tormento: 1 }
      - testo: "Coprire lo specchio con la giubba e passare"
        descrizione: "Quello che non vedi non ti chiama. Si passa a tentoni lungo la parete, con la giubba appesa alla lastra."
        costo: 2
        esito:
          titolo: La giubba sulla lastra
          testo: |
            Appendi la giubba a un angolo della lastra e passi rasente al muro, senza guardare. Dietro la
            stoffa senti il vento che muove l'erba, e la stoffa resta ferma. La pietra del corridoio è più
            fredda senza la giubba, e quando torni a riprenderla è bagnata come se fosse rimasta sotto la
            pioggia. Te la rimetti lo stesso e prosegui battendo i denti.
          effetti: { profondita.raschiatori-gradinata: 1, ferite: 0.5 }

  # ------------------------------------------------------------ 3 · la rampa e le copie
  - id: raschiatori-gradinata-la-rampa
    immagine: ambientazione/rovine-dei-precursori
    titolo: La rampa che sale scendendo
    sommario: "Una rampa di pietra liscia porta in basso."
    luogo: La Gradinata Cieca, la rampa
    area: raschiatori-gradinata
    ripetibile: true
    requisiti: [fazione.raschiatori == 4, profondita.raschiatori-gradinata == 3]
    testo: |
      Il corridoio diventa una rampa di pietra liscia che scende in curva. La pietra è tutta di un pezzo per
      quanto arriva la lampada, e la curva tiene lo stesso raggio dal primo passo all'ultimo. La prendi con le
      ginocchia piegate e i talloni puntati, e a metà le cosce ti fanno male come in salita. Il sudore della
      fronte ti cola all'indietro verso i capelli. La corda legata in vita, che fino a qui tirava verso
      l'alto, adesso tira verso il basso.

      {acrobazia Media} Il peso del corpo è finito nel posto sbagliato, e i piedi cercano da soli l'appoggio
      sulle punte. Se ti fidi soltanto di loro la rampa si lascia fare.

      In fondo alla curva una luce verdognola sale dal pavimento e non trema.
    opzioni:
      - testo: "Fidarsi dei piedi"
        descrizione: "Gli occhi dicono una cosa, il corpo un'altra. Si cammina come dice il corpo."
        prova: { attributo: fisico, abilita: acrobazia, difficolta: Media }
        successo:
          titolo: In equilibrio
          testo: |
            Chiudi gli occhi per metà e cammini come se salissi, con il busto in avanti e il peso sulle punte.
            La rampa ti porta giù senza una scivolata, e in fondo alla curva arrivi alla luce verdognola con
            il fiato di una salita e le ginocchia di una discesa. Qui in fondo l'aria è più fredda e sa di
            pietra bagnata.
          pe: { acrobazia: 2 }
          effetti: { profondita.raschiatori-gradinata: 1 }
        fallimento:
          titolo: La scivolata
          testo: |
            Il piede decide da solo che stai scendendo, e il resto del corpo non è d'accordo. Scivoli sulla
            schiena per un lungo tratto in salita e ti fermi contro la parete dove la rampa comincia. Ti
            rialzi con i gomiti sbucciati e nessuna voglia di ricominciare, e sulla pietra liscia non è
            rimasto il segno della scivolata.
          effetti: { ferite: 0.5 }
      - testo: "Non guardare la rampa e contare i respiri"
        descrizione: "La testa vuole capire, e capire qui fa cadere. Basta tenerla occupata con altro."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Media }
        successo:
          titolo: Centotrenta
          testo: |
            Conti i respiri e guardi soltanto la punta dei tuoi stivali, e la rampa sotto di te smette di
            avere un verso. Verso l'ottantesimo la corda in vita smette di tirare da una parte o dall'altra.
            Al centotrentesimo la luce verdognola ti illumina le punte. Alzi la testa e sei in fondo.
          pe: { resilienza: 2 }
          effetti: { profondita.raschiatori-gradinata: 1 }
        fallimento:
          titolo: Il conto sbagliato
          testo: |
            Conti i respiri, e a un certo punto ne conti uno che non hai fatto tu. Ti fermi. Quello in più
            continua a un passo dietro le tue spalle e ti arriva tiepido sulla nuca, con il ritmo che avevi tu
            prima di fermarti. Quando ti volti la rampa è vuota. Torni su di corsa, in discesa.
          effetti: { tormento: 1.5 }
      - testo: "Scendere legato al chiodo, un palmo alla volta"
        descrizione: "Un chiodo piantato in cima, la corda in mano, e si scende all'indietro come da una parete."
        costo: 2
        esito:
          titolo: All'indietro
          testo: |
            Pianti un chiodo in cima alla rampa e scendi all'indietro, un palmo alla volta, come da una parete
            di roccia. La pietra è dura e il chiodo ci entra a fatica, con un suono acuto che la rampa non
            rimanda indietro. La corda ti brucia i palmi anche attraverso i guanti, e due volte il chiodo cede
            un poco. In fondo lasci la corda appesa per il ritorno, e ti succhi le mani.
          effetti: { profondita.raschiatori-gradinata: 1, ferite: 0.5 }

  - id: raschiatori-gradinata-le-copie
    immagine: ambientazione/rovine-dei-precursori
    titolo: Le copie di corda e piombo
    sommario: "Nella luce verdognola due figure fatte di corde annodate e pesi di piombo ripetono i gesti di Raschiatori scesi tanto tempo fa."
    luogo: La Gradinata Cieca, la sala della luce verde
    area: raschiatori-gradinata
    ripetibile: true
    requisiti: [fazione.raschiatori == 4, profondita.raschiatori-gradinata == 3]
    testo: |
      Nella luce verdognola ci sono due figure alte come uomini, fatte di corde annodate con pesi di piombo
      per giunture e ganci di ferro per mani. Le corde sono di canapa vecchia scura di grasso, e ogni piombo
      ha ancora l'occhiello dove passava la corda dell'argano. Ripetono a vuoto i gesti di uno scavo, e la
      prima pianta un chiodo mentre l'altra fila la corda. Il gancio batte sempre nello stesso punto del
      pavimento, dove non c'è nessun chiodo, e lì la pietra è scavata a coppa.

      {armi-da-mischia Media} Le giunture di piombo sono pesanti e lente a tornare indietro dopo ogni gesto.
      Fra due nodi la canapa vecchia si apre con un colpo dritto.

      Quando entri nella luce la figura del chiodo si ferma con il gancio alzato e si gira verso di te. Ha la
      tua altezza e la tua piega delle spalle.
    opzioni:
      - testo: "Spezzare le corde fra i nodi"
        descrizione: "Sono due, e copiano. Chi copia arriva sempre dopo."
        combattimento: raschiatori-copie-di-corda
        vittoria:
          titolo: I nodi sciolti
          testo: |
            Le figure si disfano a pezzi, un nodo alla volta, e i pesi di piombo rotolano sul pavimento come
            monete. Nella coppa scavata dal gancio c'è un velo di polvere di pietra fresca. Quando l'ultima
            figura è a terra la luce verdognola si abbassa, e in fondo alla sala si vede un'apertura bassa con
            il bordo levigato dalle mani.
          effetti: { profondita.raschiatori-gradinata: 1, reliquie.scheggia: 1 }
        sconfitta:
          titolo: Il tuo gesto
          testo: |
            La figura ti colpisce con il gancio esattamente come avresti fatto tu, dal basso verso l'alto, e
            finisci a terra con la corda in vita che tira verso l'uscita. Ti trascini via sui gomiti. Alle tue
            spalle le figure riprendono lo scavo che non finisce mai, e il gancio torna a battere nella sua
            coppa di pietra con lo stesso intervallo di prima.
      - testo: "Rifare il loro gesto e passare in mezzo"
        descrizione: "Se ripetono uno scavo, chi scava con loro non è un intruso. Bisogna fare il gesto giusto, al momento giusto."
        prova: { attributo: sociale, abilita: [ingannare, espressivita], difficolta: Media }
        successo:
          titolo: Il terzo della squadra
          testo: |
            Ti metti fra le due figure e fai il gesto del terzo della squadra, quello che tiene la lampada
            alta per gli altri. Le figure riprendono a lavorare al loro chiodo e alla loro corda. Da vicino la
            canapa sa di grasso vecchio e di acqua di pozzo, e tu cammini in mezzo a loro con la lampada
            alzata fino all'apertura in fondo alla sala.
          pe: { espressivita: 2 }
          effetti: { profondita.raschiatori-gradinata: 1 }
        fallimento:
          titolo: Il gesto sbagliato
          testo: |
            Fai il gesto, ma con la mano sbagliata. La figura con la corda si ferma e ti guarda il polso, e il
            gancio ti sfiora la guancia con un rumore di ferro. Esci dalla luce all'indietro con il freddo del
            metallo ancora sulla pelle, e loro tornano allo scavo.
          effetti: { ferite: 0.5, tormento: 1 }
      - testo: "Girare largo lungo il bordo della luce"
        descrizione: "La luce non arriva ai muri. Si passa al buio, lontano dalle figure, con le spalle alla pietra."
        costo: 2
        esito:
          titolo: Il bordo
          testo: |
            Passi lungo il muro, dove la luce non arriva, e le figure ti seguono con la testa senza smettere
            di lavorare. Il muro è umido sotto il palmo e lavorato a filari così fini che le dita non trovano
            le giunture. Ci metti molto. A metà strada ti accorgi che la figura con il chiodo ha cambiato
            gesto e adesso fa il tuo, una mano sul muro e l'altra alta con la lampada.
          effetti: { profondita.raschiatori-gradinata: 1, tormento: 1 }

  # ------------------------------------------------------------ il cuore · il custode delle file
  - id: raschiatori-il-custode-delle-file
    immagine: ambientazione/rovine-dei-precursori
    titolo: Il custode delle file
    sommario: "In fondo alla Gradinata c'è una sala rotonda, e una macchina lunga e sottile che restituisce quello che le chiedi in cambio di qualcosa di tuo."
    luogo: La Gradinata Cieca, la sala rotonda
    area: raschiatori-gradinata
    requisiti: [fazione.raschiatori == 4, profondita.raschiatori-gradinata >= 4]
    testo: |
      L'apertura dà su una sala rotonda dal soffitto basso, piena di una luce grigia che non viene da nessuna
      parte e non lascia ombre. Al centro c'è un leggio di pietra con un disco di metallo. Intorno cammina una
      macchina lunga e sottile con le gambe come aste di compasso e le mani a pinza. Le punte delle gambe
      battono sulla pietra con un ticchettio secco, e il pavimento intorno al leggio è segnato da un anello di
      piccoli fori consumati. Si ferma davanti a te e tende una pinza aperta in attesa del pagamento.

      {tecnologia Media} È un archivista, che incide le etichette delle file e cataloga quello che prende. Le
      ganasce sono di un metallo chiaro senza un graffio, e sul bordo interno hanno una punta da incisore.

      Sul disco è incisa una ruota di quattro figure che va dal buio in cima alla fiamma in fondo, passando
      per il ferro e l'argento.

      {origine apprendista-raschiatore} Sono i quattro titoli dei Raschiatori nell'ordine dei vecchi, incisi
      qui sotto prima che ci fosse la città.

      Le pareti intorno sono la tua mappa. Ci riconosci incisi i sette gradini e il vano che scende, e le sale
      che hai attraversato insieme ad altre che non hai visto. In mezzo alla sala rotonda c'è un segno piccolo
      e inciso di fresco, nel punto del pavimento dove sei in piedi. *Basta ricopiarla, e la Gradinata è
      nostra.* La pinza resta tesa.
    opzioni:
      - testo: "Dargli un ricordo"
        descrizione: "Un archivista cataloga anche quello che non pesa. Un ricordo tuo per il disco e il tempo di ricopiare la mappa."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Media }
        successo:
          titolo: Un ricordo piccolo
          testo: |
            Pensi a una cosa piccola, la prima volta che hai visto il sole dall'alto dei Ponti, e la metti
            nella pinza come si posa una moneta. Le ganasce si chiudono a un dito dalla tua mano, e alla
            tempia senti un freddo leggero che passa subito. Ricopi la mappa dalle pareti sul rotolo di tela,
            prendi il disco dal leggio e risali. La sera al campo del sole dai Ponti ti resta soltanto la
            sensazione che ci fosse qualcosa di bello, una volta.

            Sopra la Gradinata un uomo del Gancio ti aspetta per dirti che Merlach contesterà la registrazione
            davanti alla Gilda.
          pe: { resilienza: 3 }
          effetti: { fazione.raschiatori: 1, oggetto.raschiatori-disco-dei-quattro-segni: 1, raschiatori.mappa: 1, reliquie.frammento-inciso: 1, tormento: 1 }
          vai: superficie-fratturata
        fallimento:
          titolo: Un ricordo grande
          testo: |
            Pensi a una cosa piccola, ma la pinza si chiude su un'altra, più grande, che non avevi offerto. La
            macchina la porta via verso le file, e tu resti in ginocchio con un vuoto dietro gli occhi. Dalle
            file arriva il graffio di un'etichetta incisa, più lungo degli altri. Ricopi la mappa dalle pareti
            con le mani che tremano, prendi il disco dal leggio e risali, e per tutta la strada cerchi di
            ricordarti che cosa ti manca.

            Sopra la Gradinata un uomo del Gancio ti aspetta per dirti che Merlach contesterà la registrazione
            davanti alla Gilda.
          effetti: { fazione.raschiatori: 1, oggetto.raschiatori-disco-dei-quattro-segni: 1, raschiatori.mappa: 1, reliquie.frammento-inciso: 1, tormento: 1.5 }
          vai: superficie-fratturata
      - testo: "Dargli un oggetto delle file al posto di uno tuo"
        descrizione: "Nel sacco hai qualcosa che viene dagli scaffali di sopra. Bisogna farglielo passare per tuo."
        prova: { attributo: sociale, abilita: ingannare, difficolta: Difficile }
        successo:
          titolo: Il pagamento falso
          testo: |
            Gli metti nella pinza una scheggia raccolta sulla strada e la presenti come una cosa tua,
            sospirando come si sospira per un ricordo di famiglia. La macchina la gira due volte prima di
            catalogarla e di portarla verso le file. Per tutto il tempo le gambe smettono di ticchettare, e
            nella sala si sente soltanto il tuo fiato. Ricopi la mappa dalle pareti con calma, prendi il disco
            dal leggio e risali con tutto quello che avevi portato giù.

            Sopra la Gradinata un uomo del Gancio ti aspetta per dirti che Merlach contesterà la registrazione
            davanti alla Gilda.
          pe: { ingannare: 3 }
          effetti: { fazione.raschiatori: 1, oggetto.raschiatori-disco-dei-quattro-segni: 1, raschiatori.mappa: 1, reliquie.frammento-inciso: 2 }
          vai: superficie-fratturata
        fallimento:
          titolo: Il conto pagato due volte
          testo: |
            La macchina gira la scheggia una volta sola e la lascia cadere. Poi la pinza ti prende il polso, e
            ti sfila qualcosa che non sapevi di avere, con un dolore sottile che ti sale fino alla spalla.
            Quando ti lascia andare hai il disco in mano e la mappa sulle pareti davanti. Sul polso ti restano
            due righe sottili e dritte che non sanguinano. La ricopi a fatica e risali tenendo il braccio
            stretto al petto.

            Sopra la Gradinata un uomo del Gancio ti aspetta per dirti che Merlach contesterà la registrazione
            davanti alla Gilda.
          effetti: { fazione.raschiatori: 1, oggetto.raschiatori-disco-dei-quattro-segni: 1, raschiatori.mappa: 1, reliquie.frammento-inciso: 1, ferite: 1, tormento: 1.5 }
          vai: superficie-fratturata
      - testo: "Prendere il disco senza pagare"
        descrizione: "È una macchina, e tu sei un Raschiatore. Le macchine si raschiano."
        combattimento: raschiatori-custode-delle-file
        vittoria:
          titolo: Le pinze spezzate
          testo: |
            La macchina si piega su se stessa come un compasso chiuso, e le pinze ti cadono ai piedi. Ricopi
            la mappa dalle pareti senza fretta, prendi il disco dal leggio e, già che ci sei, stacchi una
            pinza intera da portare su. Il metallo è leggero e non si scalda nemmeno dopo un'ora nel pugno.
            Mentre risali ti sembra di sentire, dalle file, un rumore di etichette che si incidono da sole.

            Sopra la Gradinata un uomo del Gancio ti aspetta per dirti che Merlach contesterà la registrazione
            davanti alla Gilda.
          effetti: { fazione.raschiatori: 1, oggetto.raschiatori-disco-dei-quattro-segni: 1, raschiatori.mappa: 1, reliquie.frammento-inciso: 1, parte.impugnatura-2: 1 }
          vai: superficie-fratturata
        sconfitta:
          titolo: Catalogato
          testo: |
            Le pinze della macchina sono più svelte delle tue mani. Ti prendono la lampada e poi la corda, e
            alla fine ti lasciano sulla soglia della sala con quello che hai addosso e niente altro. Prima di
            lasciarti la macchina incide due etichette, una per la lampada e una per la corda. Risali a
            tentoni nel buio, e quando sbuchi sul prato Pio ti corre incontro. Il disco è rimasto sul leggio,
            e la mappa sulle pareti.
          vai: superficie-fratturata
      - testo: "Pagarlo con le monete che hai in tasca"
        descrizione: "Le monete sono cose tue, e si separano da te senza dolore. Forse."
        requisiti: [monete >= 20]
        esito:
          titolo: Le monete nelle file
          testo: |
            Gli metti nella pinza le monete una alla volta, e la macchina le cataloga una alla volta, con
            calma, prima di portarle verso le file. Su ogni moneta la punta da incisore lascia un graffio
            sottile. Ricopi la mappa dalle pareti mentre lei lavora, prendi il disco dal leggio e risali. Da
            qualche parte là sotto adesso c'è uno scaffale con le tue monete in fila, ognuna con la sua
            etichetta.

            Sopra la Gradinata un uomo del Gancio ti aspetta per dirti che Merlach contesterà la registrazione
            davanti alla Gilda.
          effetti: { fazione.raschiatori: 1, oggetto.raschiatori-disco-dei-quattro-segni: 1, raschiatori.mappa: 1, reliquie.frammento-inciso: 1, monete: -20 }
          vai: superficie-fratturata
