# La quest dei Raschiatori, passo 5 (fazione.raschiatori 4 → 5): la spedizione alla Gradinata Cieca, tre giorni a
# ovest di Qir-Azel vicino al Bosco della Forca (codex sf-gradinata-cieca). Ci si entra dalla Superficie con
# `raschiatori-l-ottavo-gradino`, al campo della Compagnia del Gancio, che cala gli schiavi in cordata nel buio
# dell'ottavo gradino. Tagliare le corde dà raschiatori.cordata 1, che al passo 6 apre un'opzione.
# Le stanze vanno in fasce di profondità (una stanza superata non ricompare nella stessa visita):
# 0 i sette gradini o il campo della Compagnia, 1 il buio che non risponde o la corda senza piombo,
# 2 le file degli oggetti calati o lo specchio d'uscita, 3 la rampa che sale scendendo o le copie di corda e
# piombo; il gesso dei Raschiatori vale da 1 a 3. Il cuore a 4 è il custode delle file: dà la mappa
# (raschiatori.mappa), il Disco dei quattro segni e il passo; perdere lo scontro riporta in Superficie senza passo.
# La ritirata riporta alla Superficie Fratturata. Il turno ripetibile alla Gradinata (grado 2) sta in
# ripetibili.yaml ed è una scena sola, senza stanze.
aree:
  - id: raschiatori-gradinata
    immagine: ambientazione/rovine-dei-precursori
    nome: La Gradinata Cieca
    sommario: "Vicino al Bosco della Forca sette gradini di pietra scendono in un buio che le torce non attraversano."
    spedizione: { ritorno: superficie-fratturata, soglia: 4, stanze: 3 }
    testo: |
      La Gradinata Cieca comincia in mezzo a un prato di erba rada come una scala
      di cantina di cui qualcuno si è portato via la casa. Sette gradini di
      pietra grigia scendono fino a un buio fermo che le torce non attraversano,
      dove dovrebbe esserci l'ottavo, e sul bordo del settimo i Raschiatori di
      altri anni hanno piantato i loro chiodi da corda.

storylet:
  # ------------------------------------------------------------ l'ingresso, nella Superficie
  - id: raschiatori-l-ottavo-gradino
    immagine: ambientazione/rovine-dei-precursori
    titolo: L'ottavo gradino
    sommario: "La Compagnia del Gancio è arrivata alla Gradinata prima di te, e cala schiavi nel buio uno alla volta."
    luogo: Superficie Fratturata, la Gradinata Cieca vicino al Bosco della Forca
    area: superficie-fratturata
    requisiti: [fazione.raschiatori == 4]
    testo: |
      Dopo tre giorni di strada, con il Bosco della Forca sulla destra,
      arrivi alla Gradinata con Pio Varre, il sedicenne che Argento ti ha
      dato per le corde. La Compagnia del Gancio è arrivata un giorno prima e
      ha montato un argano sopra il buio dell'ottavo gradino. Due
      sorveglianti calano uno schiavo scalzo con una lampada, e quando tirano
      su la corda dell'uomo non c'è più traccia. Altri tre aspettano il loro
      turno sull'erba.

      *Uno alla volta, e chi non torna non costa niente.* Pio ti chiede piano
      che cosa facciamo, e il plurale gli trema un poco.
    opzioni:
      - testo: "Tagliare le corde e tirare su la cordata"
        descrizione: "Basta un coltello sulla corda madre dei tre, prima che i sorveglianti capiscano."
        prova: { attributo: fisico, abilita: atletica, difficolta: Media }
        successo:
          titolo: La corda madre
          testo: |
            Tagli la corda madre e tiri via i tre sull'erba, con Pio appeso alla
            corda come a una campana. I sorveglianti guardano il coltello e il
            bracciale dei turni e si chiudono nelle tende, e tu ti cali oltre il
            settimo gradino.
          pe: { atletica: 3 }
          imposta: { raschiatori.cordata: 1 }
          vai: raschiatori-gradinata
        fallimento:
          titolo: Il randello
          testo: |
            Il sorvegliante più vicino ti prende la spalla con il randello, ma i
            tre sono già sull'erba e Pio li trascina dietro le tende. Ti cali
            oltre il settimo gradino con un braccio che non vuole saperne.
          imposta: { raschiatori.cordata: 1 }
          effetti: { ferite: 1 }
          vai: raschiatori-gradinata
      - testo: "Scendere prima di loro, di notte"
        descrizione: "Di notte la Compagnia non cala nessuno, e il sito sarebbe tuo prima dell'alba."
        prova: { attributo: fisico, abilita: furtivita, difficolta: Media }
        successo:
          titolo: Il chiodo arrugginito
          testo: |
            Quando nelle tende si spengono le lampade leghi la corda a un chiodo
            arrugginito del settimo gradino e ti cali nel buio, mentre dalla tenda
            più vicina qualcuno russa.
          pe: { furtivita: 3 }
          vai: raschiatori-gradinata
        fallimento:
          titolo: La lampada che si accende
          testo: |
            Ti scivola di mano il piombo, che rotola giù battendo sulla pietra, e
            nelle tende si accende una lampada. Ti cali troppo in fretta e le
            ginocchia prendono tutto il colpo.
          effetti: { ferite: 0.5 }
          vai: raschiatori-gradinata
      - testo: "Mandare via i sorveglianti"
        descrizione: "Sono due, e la paga del Gancio non comprende i Raschiatori arrabbiati."
        combattimento: raschiatori-sorveglianti
        vittoria:
          titolo: Il campo vuoto
          testo: |
            Il primo sorvegliante finisce sull'erba, e il secondo sceglie la strada
            per il bosco. Lasci i tre a Pio con il pane del sacco e ti cali oltre il
            settimo gradino.
          imposta: { raschiatori.cordata: 1 }
          vai: raschiatori-gradinata
        sconfitta:
          titolo: Fuori dal campo
          testo: |
            I due sorveglianti lavorano in coppia meglio di quanto calino una
            corda, e ti ritrovi fuori dal campo con Pio che ti tampona la fronte
            con il fazzoletto della madre.
      - testo: "Pagare un sorvegliante per un turno all'argano"
        descrizione: "Un sorvegliante del Gancio è pagato per calare corde. Qualche moneta in più, e cala anche la tua."
        requisiti: [monete >= 15]
        esito:
          titolo: Il turno all'argano
          testo: |
            Il sorvegliante conta le monete due volte e ti cala come cala gli
            altri, e dall'alto ti guarda scendere il ragazzo più giovane della
            fila.
          effetti: { monete: -15 }
          vai: raschiatori-gradinata

  # ------------------------------------------------------------ 0 · l'arrivo
  - id: raschiatori-gradinata-i-sette-gradini
    immagine: ambientazione/rovine-dei-precursori
    titolo: I sette gradini
    sommario: "Oltre il buio i gradini ricominciano, alti uguali, finché non sai più se sali o scendi."
    luogo: La Gradinata Cieca, oltre il buio dell'ottavo gradino
    area: raschiatori-gradinata
    ripetibile: true
    requisiti: [fazione.raschiatori == 4, profondita.raschiatori-gradinata == 0]
    testo: |
      Oltre il buio dell'ottavo gradino ricominciano i gradini, uguali a
      quelli di sopra, e la lampada arriva a un braccio e non oltre. Al
      settimo la rampa finisce contro un altro buio uguale al primo.

      {percezione Media} Questi gradini sono consumati sui bordi, come se chi
      li percorre camminasse lontano dal mezzo.
    opzioni:
      - testo: "Scendere contando ad alta voce"
        descrizione: "Se i gradini si ripetono, almeno il conto lo tieni tu."
        prova: { attributo: mentale, abilita: percezione, difficolta: Media }
        successo:
          titolo: Quattordici
          testo: |
            La voce ti torna dal buio con un ritardo regolare, e al
            quattordicesimo gradino trovi incastrata una scheggia di metallo persa
            da qualcuno.
          effetti: { profondita.raschiatori-gradinata: 1, reliquie.scheggia: 1 }
        fallimento:
          titolo: Il conto che ricomincia
          testo: |
            A nove ti accorgi di aver detto sette due volte, e alla terza volta che
            ricominci la voce dal buio conta un numero avanti a te.
          effetti: { tormento: 1 }
      - testo: "Calarsi lungo il vano con la corda"
        descrizione: "I gradini si possono saltare. Basta fidarsi della corda e del chiodo di sopra."
        prova: { attributo: fisico, abilita: atletica, difficolta: Media }
        successo:
          titolo: A corda tesa
          testo: |
            Ti cali di schiena lungo il vano con i piedi sui bordi dei gradini, e
            tocchi un fondo piano molto più giù di quanto i gradini avrebbero
            voluto.
          pe: { atletica: 2 }
          effetti: { profondita.raschiatori-gradinata: 1 }
        fallimento:
          titolo: Il bordo
          testo: |
            Un piede scivola sul bordo levigato e sbatti il fianco contro lo
            spigolo. La corda tiene, e risali a massaggiarti le costole.
          effetti: { ferite: 0.5 }
      - testo: "Scendere seduto, un gradino alla volta"
        descrizione: "Lento, con la schiena alla parete. Il buio aspetta da secoli, e può aspettare anche te."
        costo: 2
        esito:
          titolo: Seduto
          testo: |
            Scendi seduto con la schiena alla parete, e a un certo punto senti
            qualcuno che scende con il tuo passo dietro di te. In fondo ti giri, e
            dietro ci sono soltanto i gradini.
          effetti: { profondita.raschiatori-gradinata: 1, tormento: 1 }

  - id: raschiatori-gradinata-il-campo-della-compagnia
    immagine: ambientazione/rovine-dei-precursori
    titolo: Le lampade della Compagnia
    sommario: "Sotto il buio la Compagnia ha lasciato le sue lampade e un sorvegliante, che non aspetta visite dall'alto."
    luogo: La Gradinata Cieca, il primo pianerottolo
    area: raschiatori-gradinata
    ripetibile: true
    requisiti: [fazione.raschiatori == 4, profondita.raschiatori-gradinata == 0]
    testo: |
      Sotto il buio la Compagnia usa un pianerottolo largo da magazzino, con
      tre lampade appese a chiodi nuovi. Seduto su una cassa un sorvegliante
      mangia una cipolla cruda a morsi e guarda il vano che scende, da dove
      aspetta guai.

      {armi-da-mischia Facile} Il randello sta dalla parte opposta alla mano
      con cui mangia, e gli serve un momento per cambiare mano.
    opzioni:
      - testo: "Toglierlo di mezzo"
        descrizione: "È solo, e ha la bocca piena."
        combattimento: raschiatori-un-sorvegliante
        vittoria:
          titolo: La cipolla
          testo: |
            Il sorvegliante cerca il randello con la mano sbagliata. Lo leghi alla
            cassa con la sua corda e prendi una delle lampade del Gancio, che fa
            più luce della tua.
          effetti: { profondita.raschiatori-gradinata: 1 }
        sconfitta:
          titolo: Il randello
          testo: |
            Il sorvegliante cambia mano più in fretta del previsto, e il randello
            ti trova la tempia.
      - testo: "Passargli alle spalle"
        descrizione: "Guarda il vano che scende, e dalla parte del buio il pianerottolo è largo."
        prova: { attributo: fisico, abilita: furtivita, difficolta: Media }
        successo:
          titolo: Dalla parte del buio
          testo: |
            Passi rasente al bordo del buio, fuori dalla sua lampada, mentre lui
            mastica guardando dall'altra parte.
          pe: { furtivita: 2 }
          effetti: { profondita.raschiatori-gradinata: 1 }
        fallimento:
          titolo: Il morso a metà
          testo: |
            A metà del pianerottolo lui smette di masticare e fischia, e da sotto
            risponde un altro fischio che ti rimanda nel buio di sopra.
          effetti: { sospetto: 1 }
      - testo: "Aspettare che cambi il turno di guardia"
        descrizione: "Prima o poi qualcuno gli dà il cambio e il pianerottolo resta vuoto."
        costo: 2
        esito:
          titolo: Il cambio
          testo: |
            Aspetti sull'ultimo gradino finché arriva il cambio e i due risalgono
            insieme a mangiare, poi attraversi con le gambe rigide di freddo.
          effetti: { profondita.raschiatori-gradinata: 1, ferite: 0.5 }

  # ------------------------------------------------------------ 1 · il buio che non risponde
  - id: raschiatori-gradinata-il-buio-che-non-risponde
    immagine: ambientazione/regno-profondo
    titolo: Il buio che non risponde
    sommario: "Nel secondo buio la lampada non serve, e si cammina con una memoria che non è tua."
    luogo: La Gradinata Cieca, il secondo buio
    area: raschiatori-gradinata
    ripetibile: true
    requisiti: [fazione.raschiatori == 4, profondita.raschiatori-gradinata == 1]
    testo: |
      Il secondo buio arriva senza preavviso, e la lampada ti illumina la
      mano e basta, come se avessi infilato il braccio in un sacco di
      velluto. In terra, al limite della luce, c'è una candela da scavo
      consumata a metà, con lo stoppino rivolto verso il basso.

      {magia Media} Questo buio prende la luce e se la tiene.
    opzioni:
      - testo: "Seguire il bordo della candela"
        descrizione: "Chi l'ha lasciata lì l'ha lasciata per qualcuno. Lo stoppino indica una direzione."
        prova: { attributo: mentale, abilita: [percezione, magia], difficolta: Media }
        successo:
          titolo: Lo stoppino
          testo: |
            La fiamma della candela pende all'ingiù, e la segui piegato in due
            mentre il nero si apre di un palmo alla volta. Dall'altra parte la
            candela si spegne da sola e la lampada torna a fare luce.
          pe: { percezione: 2 }
          effetti: { profondita.raschiatori-gradinata: 1 }
        fallimento:
          titolo: La fiamma al contrario
          testo: |
            Guardi troppo a lungo la fiamma che pende all'ingiù, finché la testa
            decide che il pavimento è il soffitto, e torni a carponi fino al vano
            chiaro.
          effetti: { tormento: 1 }
      - testo: "Camminare a occhi chiusi"
        descrizione: "Se il buio prende la luce, restano i piedi."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Media }
        successo:
          titolo: A occhi chiusi
          testo: |
            Cammini a occhi chiusi con una mano sulla parete, perché il buio
            dietro le palpebre almeno è il tuo, e dopo cinquanta passi la lampada
            illumina di nuovo la pietra.
          pe: { resilienza: 2 }
          effetti: { profondita.raschiatori-gradinata: 1 }
        fallimento:
          titolo: La mano sulla parete
          testo: |
            La parete smette di esserci e la mano trova qualcosa di tiepido che si
            ritira. Ci metti molto a ritrovare il vano chiaro.
          effetti: { tormento: 1 }
      - testo: "Legarsi alla corda e procedere a tentoni"
        descrizione: "Una corda dalla vita al chiodo, che ogni tanto tira dalla parte sbagliata."
        costo: 2
        esito:
          titolo: A tentoni
          testo: |
            Due volte la corda tira indietro, piano, come una mano che ti
            trattiene per la giubba, e dall'altra parte arrivi con la nuca
            fradicia.
          effetti: { profondita.raschiatori-gradinata: 1, tormento: 1 }

  - id: raschiatori-gradinata-la-corda-senza-piombo
    immagine: ambientazione/rovine-dei-precursori
    titolo: La corda senza piombo
    sommario: "Nel vano pende una corda del Gancio tagliata netta, e sotto c'è l'uomo che hai visto calare."
    luogo: La Gradinata Cieca, il vano della corda
    area: raschiatori-gradinata
    ripetibile: true
    requisiti: [fazione.raschiatori == 4, profondita.raschiatori-gradinata == 1]
    testo: |
      Nel vano pende una corda del Gancio tagliata netta a un braccio da terra. Sotto, seduto
      contro la parete con la lampada spenta in grembo, c'è l'uomo che hai visto calare, con gli
      occhi aperti che non sbattono alla luce, e accanto a lui il piombo che mancava alla corda.

      {medicina Media} Ha la febbre alta, e il collare gli ha segnato il collo fino a farlo
      sanguinare.

      {origine fuggiasco-di-ghoran} Il collare è di quelli che si stringono tirando, e lo
      conosci dalle notti in cui lo tenevi allentato con due dita per dormire.
    opzioni:
      - testo: "Tirarlo su e farlo camminare"
        descrizione: "Pesa come un uomo e non ti aiuta, finché le gambe non si ricordano."
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Media }
        successo:
          titolo: Le gambe che si ricordano
          testo: |
            Lo tiri su per le ascelle finché le sue gambe fanno i passi da sole e
            lui ti dice un nome che non è il suo. Lo lasci in fondo al vano, dove
            l'aria è meno ferma, con la tua borraccia.
          pe: { resistenza: 2 }
          effetti: { profondita.raschiatori-gradinata: 1, rep.raschiatori: 0.5 }
        fallimento:
          titolo: Il peso morto
          testo: |
            Lui si lascia andare con tutto il peso e cadete insieme sulla pietra,
            mentre il piombo rotola via nel buio.
          effetti: { ferite: 0.5 }
      - testo: "Parlargli finché ti guarda"
        descrizione: "Negli occhi aperti c'è ancora qualcuno, se trovi la parola che lo fa tornare."
        prova: { attributo: sociale, abilita: empatia, difficolta: Media }
        successo:
          titolo: Il nome
          testo: |
            Gli parli del sole sopra la Gradinata finché gli occhi si spostano su
            di te e ti dice il suo nome due volte, con stupore. Poi si arrampica
            sulla corda da solo, adagio.
          pe: { empatia: 2 }
          effetti: { profondita.raschiatori-gradinata: 1, rep.raschiatori: 0.5 }
        fallimento:
          titolo: Gli occhi aperti
          testo: |
            Lui continua a guardare il punto dove eri prima, e ti accorgi che gli
            stai parlando con la voce che usava tua madre per farti addormentare.
          effetti: { tormento: 1 }
      - testo: "Lasciargli la lampada accesa e proseguire"
        descrizione: "Gli lasci la luce, e al ritorno ci ripensi."
        costo: 2
        esito:
          titolo: La lampada accesa
          testo: |
            Gli accendi la lampada e gliela rimetti in grembo, e ti volti ogni
            dieci passi finché la piccola luce scompare dietro una curva che il
            vano prima non faceva.
          effetti: { profondita.raschiatori-gradinata: 1, tormento: 1 }

  # ------------------------------------------------------------ 1–3 · il gesso dei Raschiatori
  - id: raschiatori-gradinata-il-gesso
    immagine: ambientazione/rovine-dei-precursori
    titolo: Il gesso dei Raschiatori
    sommario: "Sulla parete del vano le squadre di altri anni hanno lasciato segni di gesso, e non tutti giusti."
    luogo: La Gradinata Cieca, una parete segnata
    area: raschiatori-gradinata
    ripetibile: true
    requisiti: [fazione.raschiatori == 4, profondita.raschiatori-gradinata >= 1, profondita.raschiatori-gradinata <= 3]
    testo: |
      Su un tratto di parete i Raschiatori di altri anni hanno lasciato segni di
      gesso uno sopra l'altro, come le firme su un muro di taverna. Accanto a
      una freccia c'è una lanterna piccola con la fiamma storta, e due frecce
      della stessa mano indicano strade opposte.

      {accademiche Media} I segni più vecchi usano il cerchio con due punti per
      *pericolo*, che le squadre hanno smesso di usare da una generazione.
    opzioni:
      - testo: "Leggere i segni come li legge Dragna"
        descrizione: "Il gesso dei Raschiatori ha la sua grammatica, e dice quale freccia ha scritto chi tornava."
        prova: { attributo: mentale, abilita: accademiche, difficolta: Media }
        successo:
          titolo: La freccia di chi tornava
          testo: |
            Una delle due frecce ha la punta ripassata con un gesso più fresco, da
            qualcuno che tornava. La segui, e dopo un tratto trovi la croce
            piccola di chi si è fermato a riposare.
          pe: { accademiche: 2 }
          effetti: { profondita.raschiatori-gradinata: 1 }
        fallimento:
          titolo: L'altra freccia
          testo: |
            La freccia più chiara ti porta in un vano che si stringe fino a farti
            passare di fianco, e torni ai segni con la camicia strappata.
          effetti: { ferite: 0.5 }
      - testo: "Aggiungere il tuo segno e seguire l'istinto"
        descrizione: "L'istinto, a volte, è quello di chi ti ha preceduto."
        costo: 2
        esito:
          titolo: Il tuo segno
          testo: |
            Fai una freccia piccola accanto alla lanterna e segui la pancia, e ci
            metti il doppio, ma arrivi con il gesso sulle dita che sa di casa.
          effetti: { profondita.raschiatori-gradinata: 1, tormento: 1 }
      - testo: "Seguire la lanterna con la fiamma storta"
        descrizione: "Fra i Raschiatori una lanterna si disegna per qualcuno."
        prova: { attributo: sociale, abilita: empatia, difficolta: Facile }
        successo:
          titolo: Per qualcuno
          testo: |
            Accanto alla lanterna c'è un nome quasi cancellato, e lo saluti a
            mezza voce prima di seguire la direzione in cui pende la fiamma.
          effetti: { profondita.raschiatori-gradinata: 1 }
        fallimento:
          titolo: Il nome cancellato
          testo: |
            Accanto alla lanterna non trovi nessun nome, e resti davanti ai segni
            con l'impressione di aver mancato di rispetto a qualcuno.
          effetti: { tormento: 1 }

  # ------------------------------------------------------------ 2 · le file e lo specchio
  - id: raschiatori-gradinata-le-file
    immagine: ambientazione/rovine-dei-precursori
    titolo: Le file degli oggetti calati
    sommario: "Una sala lunga di scaffali di pietra, con tutto quello che è stato calato oltre l'ottavo gradino."
    luogo: La Gradinata Cieca, la sala degli scaffali
    area: raschiatori-gradinata
    ripetibile: true
    requisiti: [fazione.raschiatori == 4, profondita.raschiatori-gradinata == 2]
    testo: |
      Il vano sbocca in una sala lunga con scaffali di pietra da un capo all'altro, e
      sopra, in file ordinate, c'è tutto quello che dalla Gradinata è stato calato in
      decenni, ognuno con un'etichetta di metallo che non sai leggere. Su uno scaffale
      in basso c'è una lampada da scavo identica alla tua, con la stessa ammaccatura
      sul fondo.

      {percezione Facile} Sono tutti un poco sbagliati, le corde con i nodi al
      contrario e le candele con lo stoppino dalla parte della base.
    opzioni:
      - testo: "Studiare le etichette"
        descrizione: "Un archivio ha un ordine, e l'ordine dice dove porta la sala."
        prova: { attributo: mentale, abilita: [accademiche, tecnologia], difficolta: Media }
        successo:
          titolo: L'ordine delle file
          testo: |
            Le etichette vanno in ordine di arrivo, le più vecchie in fondo, e
            accanto a una di quelle raccogli un frammento inciso caduto dallo
            scaffale.
          pe: { accademiche: 2 }
          effetti: { profondita.raschiatori-gradinata: 1, reliquie.frammento-inciso: 1 }
        fallimento:
          titolo: La tua lampada
          testo: |
            Mentre leggi, la lampada sullo scaffale si accende da sola e la tua si
            spegne, e quando la tua si riaccende hai le mani che tremano.
          effetti: { tormento: 1 }
      - testo: "Prendere la lampada che è uguale alla tua"
        descrizione: "È tua, o lo sarà. Un Raschiatore non lascia la sua lampada in un posto così."
        prova: { attributo: fisico, abilita: furtivita, difficolta: Media }
        successo:
          titolo: Le due lampade
          testo: |
            La prendi in fretta e prosegui con due lampade uguali, una che fa luce
            e una che non pesa niente.
          effetti: { profondita.raschiatori-gradinata: 1, reliquie.scheggia: 2 }
        fallimento:
          titolo: L'etichetta calda
          testo: |
            L'etichetta accanto alla lampada diventa rovente e ti segna le dita, e
            dal fondo della sala arrivano passi lunghi e lenti.
          effetti: { ferite: 0.5, tormento: 1 }
      - testo: "Attraversare la sala senza toccare niente"
        descrizione: "Le cose di altri restano dove sono, e tu cammini nel mezzo."
        costo: 2
        esito:
          titolo: Nel mezzo
          testo: |
            Attraversi la sala nel mezzo con le mani in tasca, come al mercato
            quando non hai soldi, e la sala è più lunga di quanto sembrava.
          effetti: { profondita.raschiatori-gradinata: 1, tormento: 1 }

  - id: raschiatori-gradinata-lo-specchio
    immagine: ambientazione/regno-profondo
    titolo: Lo specchio d'uscita
    sommario: "In fondo a un corridoio una lastra lucida mostra la Gradinata vista da fuori, con il prato al sole."
    luogo: La Gradinata Cieca, il corridoio dello specchio
    area: raschiatori-gradinata
    ripetibile: true
    requisiti: [fazione.raschiatori == 4, profondita.raschiatori-gradinata == 2]
    testo: |
      In fondo a un corridoio, in una lastra lucida alta come una porta,
      vedi la Gradinata da fuori, nel pomeriggio, con Pio seduto sull'erba
      che mangia il pane del sacco. La tua mano sulla lastra tiepida non si
      riflette.

      {resilienza Media} È un'uscita o vuole sembrarlo, e i Raschiatori
      stanchi la prendono senza farsi domande.
    opzioni:
      - testo: "Voltare le spalle allo specchio"
        descrizione: "Al prato tornerai con le tue gambe."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Media }
        successo:
          titolo: Le spalle al sole
          testo: |
            Ti volti e cammini con il sole dello specchio sulla nuca, finché il
            corridoio piega verso il basso e il calore si spegne come una candela
            soffiata.
          pe: { resilienza: 2 }
          effetti: { profondita.raschiatori-gradinata: 1 }
        fallimento:
          titolo: Un passo verso il prato
          testo: |
            Fai due passi verso lo specchio prima di deciderlo, e ti ferma il
            freddo della lastra sulla fronte. Resti appoggiato finché il prato
            smette di chiamarti.
          effetti: { tormento: 1.5 }
      - testo: "Cercare nello specchio la strada che scende"
        descrizione: "Nel riflesso ci sono anche i gradini, e si vede da che parte vanno."
        prova: { attributo: mentale, abilita: percezione, difficolta: Media }
        successo:
          titolo: I gradini nello specchio
          testo: |
            Nello specchio i gradini scendono da sinistra a destra, e quelli veri
            al contrario, così prendi il corridoio di sinistra, che non avresti
            mai preso, e la pietra comincia a scendere.
          pe: { percezione: 2 }
          effetti: { profondita.raschiatori-gradinata: 1 }
        fallimento:
          titolo: Pio nello specchio
          testo: |
            Nello specchio Pio alza la testa e ti fa un cenno, e tu glielo ricambi
            prima di pensarci mentre il corridoio alle tue spalle si fa più
            freddo.
          effetti: { tormento: 1 }
      - testo: "Coprire lo specchio con la giubba e passare"
        descrizione: "Quello che non vedi non ti chiama."
        costo: 2
        esito:
          titolo: La giubba sulla lastra
          testo: |
            Appendi la giubba alla lastra e passi rasente al muro senza guardare,
            e quando torni a riprenderla è bagnata come dopo la pioggia.
          effetti: { profondita.raschiatori-gradinata: 1, ferite: 0.5 }

  # ------------------------------------------------------------ 3 · la rampa e le copie
  - id: raschiatori-gradinata-la-rampa
    immagine: ambientazione/rovine-dei-precursori
    titolo: La rampa che sale scendendo
    sommario: "Una rampa di pietra liscia porta in basso, ma a metà le gambe ti dicono che stai salendo."
    luogo: La Gradinata Cieca, la rampa
    area: raschiatori-gradinata
    ripetibile: true
    requisiti: [fazione.raschiatori == 4, profondita.raschiatori-gradinata == 3]
    testo: |
      Il corridoio diventa una rampa di pietra liscia che scende in curva, ma
      a metà le cosce ti fanno male come in salita e la corda legata in vita
      adesso tira verso il basso. In fondo alla curva una luce verdognola
      sale dal pavimento.

      {acrobazia Media} Se ti fidi dei piedi e smetti di fidarti degli occhi,
      la rampa si lascia fare.
    opzioni:
      - testo: "Fidarsi dei piedi"
        descrizione: "Gli occhi dicono una cosa, il corpo un'altra. Si cammina come dice il corpo."
        prova: { attributo: fisico, abilita: acrobazia, difficolta: Media }
        successo:
          titolo: In equilibrio
          testo: |
            Cammini come se salissi, con il busto in avanti e il peso sulle punte,
            e arrivi alla luce verdognola senza una scivolata.
          pe: { acrobazia: 2 }
          effetti: { profondita.raschiatori-gradinata: 1 }
        fallimento:
          titolo: La scivolata
          testo: |
            Il piede decide che stai scendendo e il resto del corpo no, e scivoli
            sulla schiena per un lungo tratto in salita, fino all'inizio della
            rampa.
          effetti: { ferite: 0.5 }
      - testo: "Non guardare la rampa e contare i respiri"
        descrizione: "La testa vuole capire, e capire qui fa cadere. Basta tenerla occupata con altro."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Media }
        successo:
          titolo: Centotrenta
          testo: |
            Conti i respiri guardando soltanto la punta degli stivali, e al
            centotrentesimo la luce verdognola te le illumina.
          pe: { resilienza: 2 }
          effetti: { profondita.raschiatori-gradinata: 1 }
        fallimento:
          titolo: Il conto sbagliato
          testo: |
            A un certo punto conti un respiro che non hai fatto tu, a un passo
            dietro le tue spalle, e torni su di corsa, in discesa.
          effetti: { tormento: 1.5 }
      - testo: "Scendere legato al chiodo, un palmo alla volta"
        descrizione: "Un chiodo piantato in cima, la corda in mano, e si scende all'indietro come da una parete."
        costo: 2
        esito:
          titolo: All'indietro
          testo: |
            Scendi all'indietro un palmo alla volta, legato a un chiodo in cima,
            con la corda che brucia i palmi attraverso i guanti, e in fondo la
            lasci appesa per il ritorno.
          effetti: { profondita.raschiatori-gradinata: 1, ferite: 0.5 }

  - id: raschiatori-gradinata-le-copie
    immagine: ambientazione/rovine-dei-precursori
    titolo: Le copie di corda e piombo
    sommario: "Nella luce verdognola due figure di corda e piombo ripetono i gesti di Raschiatori scesi tanto tempo fa."
    luogo: La Gradinata Cieca, la sala della luce verde
    area: raschiatori-gradinata
    ripetibile: true
    requisiti: [fazione.raschiatori == 4, profondita.raschiatori-gradinata == 3]
    testo: |
      Nella luce verdognola due figure di corde annodate e pesi di piombo,
      alte come uomini, ripetono a mani vuote i gesti di uno scavo. Quando
      entri nella luce quella che pianta il chiodo si ferma con il gancio
      alzato e si gira verso di te, con la tua altezza e la stessa piega
      delle spalle.

      {armi-da-mischia Media} Le giunture di piombo sono lente, e fra due
      nodi la corda è sottile.
    opzioni:
      - testo: "Spezzare le corde fra i nodi"
        descrizione: "Sono due, e copiano. Chi copia arriva sempre dopo."
        combattimento: raschiatori-copie-di-corda
        vittoria:
          titolo: I nodi sciolti
          testo: |
            Le figure si disfano un nodo alla volta, e quando la luce si abbassa
            in fondo alla sala compare un'apertura bassa con il bordo levigato
            dalle mani.
          effetti: { profondita.raschiatori-gradinata: 1, reliquie.scheggia: 1 }
        sconfitta:
          titolo: Il tuo gesto
          testo: |
            La figura ti colpisce con il gancio dal basso verso l'alto,
            esattamente come avresti fatto tu, e ti trascini via.
      - testo: "Rifare il loro gesto e passare in mezzo"
        descrizione: "Chi fa il gesto giusto scava con loro."
        prova: { attributo: sociale, abilita: [ingannare, espressivita], difficolta: Media }
        successo:
          titolo: Il terzo della squadra
          testo: |
            Fai il gesto del terzo della squadra, quello che tiene la lampada alta, e
            cammini fra le figure fino all'apertura in fondo.
          pe: { espressivita: 2 }
          effetti: { profondita.raschiatori-gradinata: 1 }
        fallimento:
          titolo: Il gesto sbagliato
          testo: |
            Fai il gesto con la mano sbagliata, e il gancio della figura ti sfiora
            la guancia mentre esci dalla luce all'indietro.
          effetti: { ferite: 0.5, tormento: 1 }
      - testo: "Girare largo lungo il bordo della luce"
        descrizione: "La luce non arriva ai muri. Si passa al buio, lontano dalle figure, con le spalle alla pietra."
        costo: 2
        esito:
          titolo: Il bordo
          testo: |
            Passi nel buio rasente al muro. A metà strada la figura del chiodo ha
            smesso il suo gesto per fare il tuo, una mano sul muro e l'altra alta
            con la lampada.
          effetti: { profondita.raschiatori-gradinata: 1, tormento: 1 }

  # ------------------------------------------------------------ il cuore · il custode delle file
  - id: raschiatori-il-custode-delle-file
    immagine: ambientazione/rovine-dei-precursori
    titolo: Il custode delle file
    sommario: "In fondo alla Gradinata una macchina restituisce quello che le chiedi in cambio di qualcosa di tuo."
    luogo: La Gradinata Cieca, la sala rotonda
    area: raschiatori-gradinata
    requisiti: [fazione.raschiatori == 4, profondita.raschiatori-gradinata >= 4]
    testo: |
      L'apertura dà su una sala rotonda dal soffitto basso, piena di una luce grigia
      che non viene da nessuna parte. Intorno a un leggio di pietra con sopra un disco
      di metallo cammina una macchina lunga e sottile, con le gambe come aste di
      compasso e le mani a pinza, che si ferma davanti a te e tende una pinza aperta in
      attesa del pagamento.

      {tecnologia Media} È un archivista. Le etichette delle file le incide lui, e
      quello che prende lo cataloga.

      Sul disco è incisa una ruota di quattro figure, che dal buio in cima scende fino
      a una fiamma.

      {origine apprendista-raschiatore} Sono i quattro titoli dei Raschiatori
      nell'ordine dei vecchi, incisi qui sotto prima che ci fosse la città, e al
      Grifone la sedia della Fiamma è vuota dalla primavera.

      Le pareti tutto intorno sono la tua mappa, incisa a rilievo come per un cieco dai
      sette gradini fino alla rampa. *Basta ricopiarla, e la Gradinata è nostra.* La
      pinza resta tesa.
    opzioni:
      - testo: "Dargli un ricordo"
        descrizione: "Un ricordo tuo, in cambio del disco e della mappa."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Media }
        successo:
          titolo: Un ricordo piccolo
          testo: |
            Gli dai la prima volta che hai visto il sole dall'alto dei Ponti, e la
            macchina lo porta verso le file mentre ricopi la mappa. La sera, al
            campo, con il disco nel sacco, ti resta soltanto la sensazione che ci
            fosse qualcosa di bello.

            Sopra, un uomo del Gancio ti avverte che Merlach contesterà la
            registrazione davanti alla Gilda.
          pe: { resilienza: 3 }
          effetti: { fazione.raschiatori: 1, oggetto.raschiatori-disco-dei-quattro-segni: 1, raschiatori.mappa: 1, reliquie.frammento-inciso: 1, tormento: 1 }
          vai: superficie-fratturata
        fallimento:
          titolo: Un ricordo grande
          testo: |
            La pinza si chiude su un ricordo più grande di quello che avevi
            offerto. Ricopi la mappa con le mani che tremano e risali con il
            disco, cercando di ricordarti che cosa ti manca.

            Sopra, un uomo del Gancio ti avverte che Merlach contesterà la
            registrazione davanti alla Gilda.
          effetti: { fazione.raschiatori: 1, oggetto.raschiatori-disco-dei-quattro-segni: 1, raschiatori.mappa: 1, reliquie.frammento-inciso: 1, tormento: 1.5 }
          vai: superficie-fratturata
      - testo: "Dargli un oggetto delle file al posto di uno tuo"
        descrizione: "Nel sacco hai qualcosa che viene dagli scaffali di sopra. Bisogna farglielo passare per tuo."
        prova: { attributo: sociale, abilita: ingannare, difficolta: Difficile }
        successo:
          titolo: Il pagamento falso
          testo: |
            La macchina gira due volte la scheggia che le presenti come un ricordo
            di famiglia, poi la cataloga. Ricopi la mappa con calma e risali con
            il disco, senza aver lasciato niente di tuo.

            Sopra, un uomo del Gancio ti avverte che Merlach contesterà la
            registrazione davanti alla Gilda.
          pe: { ingannare: 3 }
          effetti: { fazione.raschiatori: 1, oggetto.raschiatori-disco-dei-quattro-segni: 1, raschiatori.mappa: 1, reliquie.frammento-inciso: 2 }
          vai: superficie-fratturata
        fallimento:
          titolo: Il conto pagato due volte
          testo: |
            La macchina lascia cadere la scheggia e ti sfila dal polso qualcosa
            che non sapevi di avere, con un dolore sottile fino alla spalla.
            Ricopi la mappa a fatica e risali con il disco, il braccio stretto al
            petto.

            Sopra, un uomo del Gancio ti avverte che Merlach contesterà la
            registrazione davanti alla Gilda.
          effetti: { fazione.raschiatori: 1, oggetto.raschiatori-disco-dei-quattro-segni: 1, raschiatori.mappa: 1, reliquie.frammento-inciso: 1, ferite: 1, tormento: 1.5 }
          vai: superficie-fratturata
      - testo: "Prendere il disco senza pagare"
        descrizione: "È una macchina, e tu sei un Raschiatore. Le macchine si raschiano."
        combattimento: raschiatori-custode-delle-file
        vittoria:
          titolo: Le pinze spezzate
          testo: |
            La macchina si piega su se stessa come un compasso chiuso. Ricopi la
            mappa senza fretta e risali con il disco e con una delle sue pinze,
            mentre dalle file arriva un rumore di etichette che si incidono da
            sole.

            Sopra, un uomo del Gancio ti avverte che Merlach contesterà la
            registrazione davanti alla Gilda.
          effetti: { fazione.raschiatori: 1, oggetto.raschiatori-disco-dei-quattro-segni: 1, raschiatori.mappa: 1, reliquie.frammento-inciso: 1, parte.impugnatura-2: 1 }
          vai: superficie-fratturata
        sconfitta:
          titolo: Catalogato
          testo: |
            Le pinze ti prendono la lampada e poi la corda. Il disco resta sul
            leggio, e risali a tentoni fino al prato, dove Pio ti corre incontro.
          vai: superficie-fratturata
      - testo: "Pagarlo con le monete che hai in tasca"
        descrizione: "Le monete sono cose tue, e si separano da te senza dolore. Forse."
        requisiti: [monete >= 20]
        esito:
          titolo: Le monete nelle file
          testo: |
            La macchina cataloga le monete una alla volta mentre ricopi la mappa e
            prendi il disco, e da qualche parte là sotto adesso c'è uno scaffale
            con le tue monete in fila, ognuna con la sua etichetta.

            Sopra, un uomo del Gancio ti avverte che Merlach contesterà la
            registrazione davanti alla Gilda.
          effetti: { fazione.raschiatori: 1, oggetto.raschiatori-disco-dei-quattro-segni: 1, raschiatori.mappa: 1, reliquie.frammento-inciso: 1, monete: -20 }
          vai: superficie-fratturata
