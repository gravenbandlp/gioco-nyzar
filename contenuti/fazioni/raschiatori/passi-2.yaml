# La quest dei Raschiatori, Atto III e inizio dell'Atto IV (fazione.raschiatori 6 → 10).
# - 6 → 7 `raschiatori-un-giorno-di-marcia-fuori` (Superficie, pista.acciaio >= 8): il campo della Compagnia del
#   Gancio sopra il Pozzo Senzanome, la carne comprata a Ghoran dagli uomini del Pesatore, Nella di Ghoran
#   (raschiatori.nella 1). Il passo 8 è la spedizione nel Pozzo (spedizione-pozzo.yaml).
# - 8 → 9 il giudizio del Ferro (Caserma, grado 3, Caposquadra). Due scene secondo il doppio gioco del passo 3:
#   `raschiatori-il-giudizio-del-ferro` (raschiatori.doppio != 1): il duello con Merlach (boss), il contratto
#   smontato davanti a Galdrick, il riscatto; `raschiatori-il-giudizio-del-ferro-doppio` (raschiatori.doppio == 1):
#   Dragna sa della paga del Gancio. Chi consegna contratto e ricevute prende il grado senza l'ascia e con mezzo
#   punto di reputazione in meno; chi resta con Merlach perde due punti, non prende né l'ascia né la squadra e
#   deve fare `raschiatori-la-penitenza` prima del passo 10 (raschiatori.penitenza 1 → 2). Nessun ramo chiude la
#   quest. raschiatori.merlach: 1 scritto nel registro dei mercanti di schiavi, 2 libero.
# - 9 → 10 `raschiatori-le-ombre-che-indicano` (Biblioteca, pista.capomozzo >= 7): le due ruote dei quattro segni
#   e le ombre delle Stele dei Naviganti, che puntano alle Carcasse di Korith (spedizione-korith.yaml).
storylet:
  # ------------------------------------------------------------ 6 → 7 · un giorno di marcia fuori
  - id: raschiatori-un-giorno-di-marcia-fuori
    immagine: ambientazione/ghoran
    titolo: Un giorno di marcia fuori
    sommario: "Oltre il Gradone Rosso, sulla strada per Ghoran, la Compagnia del Gancio ha piantato un recinto sopra il Pozzo Senzanome."
    luogo: Superficie Fratturata, oltre il Gradone Rosso sulla strada per Ghoran
    area: superficie-fratturata
    requisiti: [fazione.raschiatori == 6, pista.acciaio >= 8]
    testo: |
      Oltre il Gradone Rosso la Superficie si fa piatta e gialla, e la strada per Ghoran è un solco di ruote
      nella polvere. A un giorno di marcia dalla città la Compagnia del Gancio ha piantato il suo campo, un
      recinto di pali con tre carri e un argano di legno sopra un buco nel terreno. È il Pozzo Senzanome, con
      le pareti lisce come il vetro e un freddo che a mezzogiorno non ha senso. Il bordo è tagliato netto
      nella roccia e non ha una crepa in tutto il giro. Per una spanna intorno la polvere è bianca di brina, e
      un passo più in là il sole la scalda come nel resto della piana. Ti dici che in fondo ci sarà acqua, e
      che l'acqua sotto terra tiene il freddo per mesi.

      Nel recinto siedono una dozzina di legati con il collare di corda e le caviglie unite da una catena. La
      Compagnia li ha comprati a Ghoran dagli uomini del Pesatore, che riprendono gli schiavi fuggiti e li
      rivendono. Due giorni fa una cordata di cinque è scesa nel pozzo senza risalire, e la sua corda è ancora
      tesa sull'argano. È bianca di brina fin dove si vede, e sul rullo la brina resta anche dove lo batte il
      sole.

      Merlach non manda nessuno a prenderli. Siede su una cassa davanti al carro più grande e fa i conti a
      matita su un quaderno. Dietro il carro i muli tirano la cavezza dalla parte opposta al pozzo, e il palo
      a cui sono legati è piegato da quella parte.

      Una ragazza con i capelli rasati, legata al palo più vicino, ti guarda da quando sei arrivat{o|a}.
      Quando passi accanto al recinto ti dice a bassa voce che si chiama Nella di Ghoran e che suo fratello è
      nella cordata.

      {empatia Media} Ti ha detto il suo nome come si mette una cosa in mano a qualcuno perché la tenga.

      {origine fuggiasco-di-ghoran} Il collare di corda lo riconosci, e le caviglie ricordano prima della
      testa la catena che obbliga al passo corto.
    opzioni:
      - testo: "Entrare nel campo come compratore"
        descrizione: "Uno che vuole comprare può girare fra i legati e scegliere, anche una ragazza che scenda nel pozzo con lui."
        prova: { attributo: sociale, abilita: ingannare, difficolta: Media }
        successo:
          titolo: Il compratore di Laresh
          testo: |
            Ti presenti al caposquadra del campo come il compratore di una bottega di Laresh, con il tono
            annoiato di chi ne ha viste di meglio, e lui ti lascia girare fra i legati. Scegli Nella per
            scendere nel pozzo con te, e il caposquadra te la affida con una ricevuta a matita che al posto
            della firma ha un gancio disegnato. Merlach alza gli occhi dal quaderno quando passi davanti
            all'argano e ti augura buona caccia.

            Sono le stesse due parole di Tenebra, dette con la stessa voce bassa, e ti torna in mente dove
            l'avevi già sentita. Quei due devono aver tirato le stesse corde per anni, e l'argano, fino
            all'alba, è tuo.
          pe: { ingannare: 3 }
          imposta: { raschiatori.nella: 1 }
          effetti: { fazione.raschiatori: 1, rep.raschiatori: 0.5 }
        fallimento:
          titolo: La faccia del Grifone
          testo: |
            Ti presenti come un compratore di Laresh, e Merlach ti riconosce prima che il caposquadra abbia
            finito di salutarti. Ride e chiude il quaderno, e ti dice che puoi scendere lo stesso, se ci
            tieni, perché un Raschiatore costa meno di una corda nuova. Con te scende anche la ragazza, che
            lui ti regala con un gesto della matita.

            Quando passi davanti all'argano il freddo del pozzo ti arriva in faccia, e Merlach ti augura buona
            caccia con le stesse due parole di Tenebra e la stessa voce bassa. Quei due devono aver tirato le
            stesse corde per anni. Intanto al campo tutti hanno visto la tua faccia.
          imposta: { raschiatori.nella: 1 }
          effetti: { fazione.raschiatori: 1, sospetto: 1 }
      - testo: "Chiedere a Merlach l'argano per andare a prenderli"
        descrizione: "Cinque legati in fondo al pozzo sono una perdita per la Compagnia, e un Raschiatore che li riporta su gratis è un affare che Merlach deve vedere da solo."
        prova: { attributo: sociale, abilita: persuasione, difficolta: Difficile }
        successo:
          titolo: Costa meno di te
          testo: |
            Glielo chiedi davanti ai suoi uomini, e Merlach fa il conto sul quaderno a voce alta. Conta le
            teste della cordata e il prezzo di una corda nuova, e il totale gli conviene. Ti presta l'argano
            fino all'alba, e quando Nella chiede di scendere con te scrive anche lei sul quaderno, a matita,
            come una spesa.

            Ti augura buona caccia con le stesse due parole di Tenebra e la stessa voce bassa, e ti torna in
            mente dove l'avevi già sentita. Quei due devono aver tirato le stesse corde per anni.
          pe: { persuasione: 3 }
          imposta: { raschiatori.nella: 1 }
          effetti: { fazione.raschiatori: 1, rep.raschiatori: 0.5 }
        fallimento:
          titolo: Il nolo
          testo: |
            Merlach ti ascolta fino in fondo e poi ti fa il conto del nolo dell'argano al prezzo di Ghoran,
            freno compreso. Il freno è un ceppo di legno su una leva, e dove morde il rullo il legno è lucido
            di brina. Quando Nella chiede di scendere con te lui alza le spalle e la scrive sul quaderno come
            una spesa.

            Ti augura buona caccia con le stesse due parole di Tenebra e la stessa voce bassa. Quei due devono
            aver tirato le stesse corde per anni, e ciascuno dei due ti ha guardato le mani prima di parlarti.
          imposta: { raschiatori.nella: 1 }
          effetti: { fazione.raschiatori: 1, monete: -20, sospetto: 0.5 }
      - testo: "Liberare Nella di notte"
        descrizione: "Di notte ci sono due sorveglianti, e la carne del Gancio è merce registrata."
        prova: { attributo: fisico, abilita: furtivita, difficolta: Media }
        successo:
          titolo: Il palo
          testo: |
            Tagli il collare di Nella e la porti fuori dal recinto per la parte dove i sorveglianti non
            guardano, perché da quella parte c'è soltanto il pozzo. Sul bordo la brina vi scricchiola sotto i
            piedi, e il freddo sale dal buco come da una cantina aperta. All'alba Merlach trova il collare
            tagliato e la ragazza seduta accanto a te sull'argano, e ti augura buona caccia con le stesse due
            parole di Tenebra e la stessa voce bassa.

            Quei due devono aver tirato le stesse corde per anni. Merlach intanto segna la ragazza sul
            quaderno come merce rubata, e lo fa senza fretta, perché a chi mandare il conto l'ha già deciso.
          pe: { furtivita: 3 }
          imposta: { raschiatori.nella: 1 }
          effetti: { fazione.raschiatori: 1, sospetto: 1.5 }
        fallimento:
          titolo: La catena
          testo: |
            Tagli il collare di Nella, ma la catena delle caviglie si muove e sveglia l'uomo accanto, che
            grida. Un sorvegliante ti è addosso prima che tu riesca a girarti. All'alba Merlach vi trova tutti
            e due seduti accanto all'argano, tu con la schiena livida, e invece di chiamare i suoi ti augura
            buona caccia.

            Sono le stesse due parole di Tenebra, dette con la stessa voce bassa. Quei due devono aver tirato
            le stesse corde per anni. Merlach segna la ragazza sul quaderno come merce rubata.
          imposta: { raschiatori.nella: 1 }
          effetti: { fazione.raschiatori: 1, sospetto: 1.5, ferite: 1 }
      - testo: "Far notare ai sorveglianti che da Ghoran arrivano soltanto lettere"
        descrizione: "Dopo la caduta dei Malgrani il campo lo paga Ghoran per lettera, e i sorveglianti sono pochi e nervosi."
        quando: [pista.pelle >= 7]
        prova: { attributo: sociale, abilita: intimidire, difficolta: Media }
        successo:
          titolo: Le lettere di Ghoran
          testo: |
            Dici ai sorveglianti che da quando i Malgrani sono caduti la paga arriva da Ghoran per lettera, e
            che le lettere non tirano su le corde. Si guardano fra loro e uno sputa nella brina vicino
            all'argano, dove lo sputo si rapprende in una crosta bianca. Quando chiedi l'argano e la ragazza
            nessuno si mette in mezzo, e Merlach, dal suo carro, ti augura buona caccia.

            Sono le stesse due parole di Tenebra, dette con la stessa voce bassa, e ti torna in mente dove
            l'avevi già sentita. Quei due devono aver tirato le stesse corde per anni.
          pe: { intimidire: 3 }
          imposta: { raschiatori.nella: 1 }
          effetti: { fazione.raschiatori: 1, rep.raschiatori: 0.5 }
        fallimento:
          titolo: I sorveglianti nervosi
          testo: |
            Dici ai sorveglianti della paga che arriva per lettera, e uno di loro è più nervoso di quanto
            pensavi. Ti spinge contro un carro, e Merlach gli dice di smettere senza alzare la voce e senza
            alzare gli occhi dal quaderno. L'uomo smette subito. Poi Merlach ti presta l'argano e la ragazza,
            e ti augura buona caccia con le stesse due parole di Tenebra e la stessa voce bassa.

            Quei due devono aver tirato le stesse corde per anni, e ciascuno dei due ti ha guardato le mani
            prima di parlarti.
          imposta: { raschiatori.nella: 1 }
          effetti: { fazione.raschiatori: 1, ferite: 0.5 }
      - testo: "Pagare a Merlach il nolo dell'argano"
        descrizione: "Merlach fa i conti, e i conti si possono pagare. Costa, e almeno è veloce."
        requisiti: [monete >= 25]
        esito:
          titolo: Il prezzo di Ghoran
          testo: |
            Merlach conta le monete senza toccarle, spostandole sul coperchio della cassa con la punta della
            matita. Le mette in piccole file ordinate, e una moneta tosata la spinge di nuovo verso di te
            senza dire niente. Ti dà l'argano fino all'alba e, quando Nella chiede di scendere con te, la
            scrive sul quaderno come un regalo. Ti augura buona caccia con le stesse due parole di Tenebra e
            la stessa voce bassa.

            Ti torna in mente dove l'avevi già sentita. Quei due devono aver tirato le stesse corde per anni.
          imposta: { raschiatori.nella: 1 }
          effetti: { fazione.raschiatori: 1, monete: -25 }
      - testo: "Parlare ai legati nella lingua del mercato"
        descrizione: "A Ghoran i legati si parlano con una lingua fatta di mezze parole e di dita. I sorveglianti del Gancio non la capiscono."
        quando: [origine.fuggiasco-di-ghoran >= 1]
        esito:
          titolo: La lingua del mercato
          testo: |
            Ti accucci accanto al recinto come per allacciarti uno scarpone e parli a Nella con le dita e le
            mezze parole del mercato di Ghoran. Lei risponde allo stesso modo, con le mani screpolate tenute
            basse contro il ginocchio dove i sorveglianti non le vedono. In poco ti dice quanti sorveglianti
            ci sono di notte, quale palo è marcio e quale sorvegliante si vende. All'alba sei all'argano con
            lei, e Merlach ti augura buona caccia con le stesse due parole di Tenebra e la stessa voce bassa.

            Quei due devono aver tirato le stesse corde per anni.
          pe: { empatia: 3 }
          imposta: { raschiatori.nella: 1 }
          effetti: { fazione.raschiatori: 1, rep.raschiatori: 0.5 }

  # ------------------------------------------------------------ 8 → 9 · il giudizio del Ferro (grado 3)
  - id: raschiatori-il-giudizio-del-ferro
    presso: guarnigione-di-qir-azel
    immagine: personaggi/dragna-gro-malog
    titolo: Il giudizio del Ferro
    sommario: "All'alba, nel cortile della Caserma, Valdo Merlach reclama i salvati del Pozzo con il contratto e la ricevuta."
    luogo: Caserma, il cortile all'alba
    area: quartieri-alti
    requisiti: [fazione.raschiatori == 8, raschiatori.doppio != 1]
    testo: |
      Il cortile della Caserma all'alba è freddo e pulito, e la sabbia è rastrellata in righe dritte fino al
      muro della scuderia. Le reclute sono in fila per l'appello, e davanti alla scuderia aspettano quelli che
      hai tirato su dal Pozzo Senzanome, con le coperte sulle spalle e le caviglie segnate dalla catena. Nella
      sta accanto al fratello e non gli lascia la mano.

      Valdo Merlach è arrivato con due uomini che hanno il gancio dipinto sulla manica e con un notaio della
      Gilda. Con il contratto della Compagnia e una ricevuta di Ghoran chiede indietro la sua merce davanti
      allo sceriffo, e Toren Galdrick lo ascolta a braccia conserte come testimone. Merlach parla con la
      stessa voce bassa e piana del campo, e il quaderno ce l'ha sotto il braccio anche qui.

      Poi Dragna fa un passo avanti sulla sabbia.

      «Chi accusa un Raschiatore davanti al Ferro si batte con il Ferro, o con chi il Ferro sceglie» dice. «È
      la regola, e Merlach la conosce.» E si gira verso di te.

      {politica-ed-economia Media} Una ricevuta di Ghoran a Qir-Azel vale quanto il timbro che c'è sopra, e
      quella casata in Consiglio ha perso la voce.
    opzioni:
      - testo: "Accettare il duello"
        descrizione: "Merlach ha tirato corde per vent'anni e combatte con l'ascia corta dei tunnel. Il Ferro ha scelto te, e davanti a tutti."
        combattimento: raschiatori-merlach
        vittoria:
          titolo: Il Ferro ha scelto
          testo: |
            Merlach si batte bene, senza sprecare un colpo, e alla fine è in ginocchio sulla sabbia con
            l'ascia a tre passi. La sua ascia corta ha il filo consumato da un lato solo, a forza di tagliare
            corde contro la roccia. Galdrick gli chiede se rinuncia ai salvati, e lui rinuncia senza alzare la
            testa.

            Dragna ti mette in mano un'ascia da tunnel con il manico accorciato come la sua. I salvati entrano
            in Caserma come reclute, e Nella sceglie la tua squadra prima che qualcuno glielo chieda. Al
            Grifone, la sera, i Quattro ti danno le lanterne della squadra da curare, e Argento apre il
            quaderno dei titoli accanto al Disco e smette di parlare a metà frase.
          almeno: { rep.raschiatori: 6 }
          imposta: { raschiatori.merlach: 1, raschiatori.nella: 2 }
          effetti: { fazione.raschiatori: 1, monete: 80, oggetto.raschiatori-ascia-da-tunnel: 1, raschiatori.squadra: 1 }
        sconfitta:
          titolo: La sabbia del cortile
          testo: |
            Merlach ti batte senza fretta, un colpo pulito dopo l'altro, e ti lascia a terra con la bocca
            piena di sabbia ancora fredda della notte. Argento allora apre la cassa della bacheca davanti al
            notaio e ricompra i salvati uno per uno, al prezzo di Ghoran. Merlach prende le monete e se ne va
            libero, con il mantello sul braccio.

            Dragna ti mette lo stesso in mano un'ascia da tunnel. Nella sceglie la tua squadra, e al Grifone,
            la sera, i Quattro ti danno le lanterne da curare. Argento apre il quaderno dei titoli accanto al
            Disco e smette di parlare a metà frase.
          almeno: { rep.raschiatori: 6 }
          imposta: { raschiatori.merlach: 2, raschiatori.nella: 2 }
          effetti: { fazione.raschiatori: 1, monete: 80, oggetto.raschiatori-ascia-da-tunnel: 1, raschiatori.squadra: 1, rep.gilda: -0.5 }
      - testo: "Smontare il contratto davanti allo sceriffo"
        descrizione: "Un contratto della Gilda per la cartografia e una ricevuta di Ghoran per la carne non stanno nella stessa borsa."
        prova: { attributo: mentale, abilita: politica-ed-economia, difficolta: Difficile }
        successo:
          titolo: Riga per riga
          testo: |
            Chiedi al notaio il contratto e la ricevuta, e li leggi a Galdrick uno accanto all'altro. Il
            contratto parla di cartografia del sottosuolo e di misure, e la ricevuta parla di teste e di peso.
            Galdrick prende la ricevuta, la piega in quattro e scrive il nome di Merlach nel registro dei
            mercanti di schiavi.

            Dragna ti mette in mano un'ascia da tunnel con il manico accorciato come la sua. I salvati entrano
            in Caserma come reclute, e Nella sceglie la tua squadra prima che qualcuno glielo chieda. Al
            Grifone, la sera, i Quattro ti danno le lanterne della squadra da curare, e Argento apre il
            quaderno dei titoli accanto al Disco e smette di parlare a metà frase.
          pe: { politica-ed-economia: 5 }
          almeno: { rep.raschiatori: 6 }
          imposta: { raschiatori.merlach: 1, raschiatori.nella: 2 }
          effetti: { fazione.raschiatori: 1, monete: 80, oggetto.raschiatori-ascia-da-tunnel: 1, raschiatori.squadra: 1, rep.gilda: -0.5 }
        fallimento:
          titolo: Il notaio
          testo: |
            Leggi il contratto e la ricevuta, e il notaio della Gilda ti corregge a ogni riga, citando
            clausole che non hai mai visto. Tiene il dito sul foglio e lo sposta sempre una riga avanti a te.
            Argento intanto ha già aperto la cassa della bacheca, e i salvati li ricompra lui al prezzo di
            Ghoran, mentre Merlach se ne va libero.

            Dragna ti mette in mano un'ascia da tunnel. Nella sceglie la tua squadra, e al Grifone, la sera, i
            Quattro ti danno le lanterne della squadra da curare. Argento apre il quaderno dei titoli accanto
            al Disco e smette di parlare a metà frase.
          almeno: { rep.raschiatori: 6 }
          imposta: { raschiatori.merlach: 2, raschiatori.nella: 2 }
          effetti: { fazione.raschiatori: 1, monete: 80, oggetto.raschiatori-ascia-da-tunnel: 1, raschiatori.squadra: 1, rep.gilda: -0.5, scandalo: 1 }
      - testo: "Far raccontare ai salvati come sono scesi"
        descrizione: "Hai riportato su abbastanza gente da avere testimoni. Il contratto parla di mappe, loro parlano di corde e di collari."
        requisiti: [raschiatori.salvati >= 2]
        prova: { attributo: mentale, abilita: politica-ed-economia, difficolta: Media }
        successo:
          titolo: I testimoni
          testo: |
            Fai parlare i salvati uno alla volta davanti al notaio, e tu metti le loro parole accanto alle
            righe del contratto. Uno di loro si scopre la caviglia per mostrare dove la catena ha tolto la
            pelle, e il notaio smette di prendere appunti. Galdrick ascolta fino all'ultimo, poi prende la
            ricevuta e scrive il nome di Merlach nel registro dei mercanti di schiavi.

            Dragna ti mette in mano un'ascia da tunnel con il manico accorciato come la sua. I salvati entrano
            in Caserma come reclute, e Nella sceglie la tua squadra prima che qualcuno glielo chieda. Al
            Grifone, la sera, i Quattro ti danno le lanterne della squadra da curare, e Argento apre il
            quaderno dei titoli accanto al Disco e smette di parlare a metà frase.
          pe: { politica-ed-economia: 3 }
          almeno: { rep.raschiatori: 6 }
          imposta: { raschiatori.merlach: 1, raschiatori.nella: 2 }
          effetti: { fazione.raschiatori: 1, monete: 80, oggetto.raschiatori-ascia-da-tunnel: 1, raschiatori.squadra: 1, rep.gilda: -0.5 }
        fallimento:
          titolo: Le parole dei salvati
          testo: |
            I salvati parlano, ma davanti al notaio si confondono, e il notaio li fa confondere di più con
            domande gentili. A ognuno chiede il giorno preciso della discesa, e nessuno di loro nel buio ha
            mai contato i giorni. Argento apre la cassa della bacheca e ricompra i salvati uno per uno, al
            prezzo di Ghoran, e Merlach se ne va libero con il mantello sul braccio.

            Dragna ti mette in mano un'ascia da tunnel. Nella sceglie la tua squadra, e al Grifone, la sera, i
            Quattro ti danno le lanterne della squadra da curare. Argento apre il quaderno dei titoli accanto
            al Disco e smette di parlare a metà frase.
          almeno: { rep.raschiatori: 6 }
          imposta: { raschiatori.merlach: 2, raschiatori.nella: 2 }
          effetti: { fazione.raschiatori: 1, monete: 80, oggetto.raschiatori-ascia-da-tunnel: 1, raschiatori.squadra: 1, rep.gilda: -0.5, scandalo: 1 }
      - testo: "Ricomprarli subito con le tue monete"
        descrizione: "Nessun duello e nessun processo. Paghi il prezzo di Ghoran, e Merlach resta libero di tornare a Ghoran a comprare altra carne."
        requisiti: [monete >= 100]
        esito:
          titolo: Il prezzo di Ghoran
          testo: |
            Conti le monete sul tavolo del notaio una per una, al prezzo di Ghoran, e il notaio le scrive sul
            suo libro con una grafia elegante. Accanto a ogni somma scrive un nome, e per chi il nome non lo
            dice scrive *un capo*.

            Dragna ti mette in mano un'ascia da tunnel con il manico accorciato come la sua. I salvati entrano
            in Caserma come reclute, e Nella sceglie la tua squadra prima che qualcuno glielo chieda. Al
            Grifone, la sera, i Quattro ti danno le lanterne della squadra da curare, e Argento apre il
            quaderno dei titoli accanto al Disco e smette di parlare a metà frase.
          almeno: { rep.raschiatori: 6 }
          imposta: { raschiatori.merlach: 2, raschiatori.nella: 2 }
          effetti: { fazione.raschiatori: 1, monete: -100, oggetto.raschiatori-ascia-da-tunnel: 1, raschiatori.squadra: 1, rep.gilda: 0.5 }
      - testo: "Chiedere a Galdrick il registro dei mercanti di schiavi"
        descrizione: "A Ghoran ti hanno venduto. Qui c'è uno sceriffo con un registro, e un uomo che compra carne davanti a lui."
        quando: [origine.fuggiasco-di-ghoran >= 1]
        esito:
          titolo: Il registro dello sceriffo
          testo: |
            Ti sbottoni il colletto davanti a Galdrick e gli mostri il segno che il collare ti ha lasciato al
            collo, poi indichi le caviglie dei salvati. Il segno è una riga di pelle più chiara e più liscia
            che fa tutto il giro. Galdrick guarda il segno e la ricevuta, e senza dire niente si fa portare il
            registro dei mercanti di schiavi. Ci scrive il nome di Merlach con la sua grafia piccola e dritta.

            Dragna ti mette in mano un'ascia da tunnel con il manico accorciato come la sua. I salvati entrano
            in Caserma come reclute, e Nella sceglie la tua squadra prima che qualcuno glielo chieda. Al
            Grifone, la sera, i Quattro ti danno le lanterne della squadra da curare, e Argento apre il
            quaderno dei titoli accanto al Disco e smette di parlare a metà frase.
          pe: { intimidire: 3 }
          almeno: { rep.raschiatori: 6 }
          imposta: { raschiatori.merlach: 1, raschiatori.nella: 2 }
          effetti: { fazione.raschiatori: 1, monete: 80, oggetto.raschiatori-ascia-da-tunnel: 1, raschiatori.squadra: 1, rep.gilda: -0.5 }

  - id: raschiatori-il-giudizio-del-ferro-doppio
    presso: guarnigione-di-qir-azel
    immagine: personaggi/dragna-gro-malog
    titolo: Il giudizio del Ferro
    sommario: "Prima del giudizio Dragna ti prende da parte, e sa della paga del Gancio."
    luogo: Caserma, dietro la scuderia all'alba
    area: quartieri-alti
    requisiti: [fazione.raschiatori == 8, raschiatori.doppio == 1]
    testo: |
      Nel cortile della Caserma, all'alba, ci sono le reclute in fila e i salvati del Pozzo Senzanome con le
      coperte sulle spalle. Valdo Merlach è arrivato con due uomini e un notaio della Gilda, e Toren Galdrick
      lo ascolta come testimone.

      Prima che cominci Dragna ti porta dietro la scuderia e ti mette davanti alla faccia un foglietto piegato
      in quattro. Dentro ci sono le date delle borse che hai preso dal Gancio, nella grafia ordinata di
      Merlach. Sono scritte a matita una sotto l'altra, come lui tiene i suoi conti.

      «Me l'ha mandato lui ieri sera» dice. «Per farmi sapere chi tengo in squadra.»

      {conoscenze-della-strada Facile} Merlach ti ha venduto per non perdere i salvati, perché una spia
      smascherata davanti al Ferro gli vale più di un duello. Ha mandato il foglietto la sera prima, quando a
      te non restava il tempo di preparare una risposta.

      Dal cortile arriva la sua voce che chiede indietro la merce. Anche da qui è bassa e piana, e si capisce
      ogni parola. Dragna aspetta con il foglietto ancora aperto fra le dita.
    opzioni:
      - testo: "Consegnare a Galdrick il contratto e le ricevute"
        descrizione: "Le borse del Gancio sono arrivate con un contratto e con ricevute. Davanti allo sceriffo diventano prove contro chi le ha pagate."
        esito:
          titolo: Le ricevute
          testo: |
            Torni nel cortile e consegni a Galdrick le ricevute delle borse, con il contratto che Merlach ti
            aveva fatto firmare. Sono ancora piegate come le tenevi in tasca, e Galdrick le stira con il palmo
            sul tavolo del notaio. Il nome di Merlach finisce nel registro dei mercanti di schiavi, e il tuo
            nel rapporto, come testimone che ha preso la paga.

            I salvati entrano in Caserma come reclute, e Nella sceglie la tua squadra. Dragna ti dà le
            lanterne della squadra da curare, e l'ascia da tunnel che teneva per te la appende di nuovo al suo
            schienale. Argento apre il quaderno dei titoli accanto al Disco e smette di parlare a metà frase.
          almeno: { rep.raschiatori: 5.5 }
          imposta: { raschiatori.doppio: 2, raschiatori.merlach: 1, raschiatori.nella: 2 }
          effetti: { fazione.raschiatori: 1, monete: 80, raschiatori.squadra: 1, rep.raschiatori: -0.5 }
      - testo: "Dirle che la paga la prendevi per i Raschiatori"
        descrizione: "Le borse del Gancio ti hanno portato dentro il campo e fino al pozzo. Se Dragna ti crede, la spia era sua."
        prova: { attributo: sociale, abilita: persuasione, difficolta: Difficile }
        successo:
          titolo: La spia del Ferro
          testo: |
            Le dici che senza le borse del Gancio non saresti mai entrat{o|a} nel campo, e che senza il campo
            i salvati sarebbero ancora nella brina. Dragna ti guarda a lungo, e il fiato le fa una nuvola
            bianca nell'aria fredda dell'alba. Poi strappa il foglietto in due e se lo mette in tasca, e nel
            cortile, davanti a Galdrick, sei tu a leggere la ricevuta di Ghoran accanto al contratto. Il nome
            di Merlach finisce nel registro dei mercanti di schiavi.

            Dragna ti mette in mano un'ascia da tunnel. Nella sceglie la tua squadra, e la sera i Quattro ti
            danno le lanterne della squadra da curare. Argento apre il quaderno dei titoli accanto al Disco e
            smette di parlare a metà frase.
          pe: { persuasione: 5 }
          almeno: { rep.raschiatori: 6 }
          imposta: { raschiatori.doppio: 2, raschiatori.merlach: 1, raschiatori.nella: 2 }
          effetti: { fazione.raschiatori: 1, monete: 80, oggetto.raschiatori-ascia-da-tunnel: 1, raschiatori.squadra: 1 }
        fallimento:
          titolo: Il foglietto
          testo: |
            Le spieghi che la paga la prendevi per i Raschiatori, e a metà ti accorgi che non ci credi nemmeno
            tu. Te ne accorgi dalla tua voce, che si fa più svelta a ogni frase. Dragna ripiega il foglietto e
            ti porta nel cortile, dove consegni a Galdrick le ricevute delle borse. Il nome di Merlach finisce
            nel registro dei mercanti di schiavi, e il tuo nel rapporto, come testimone che ha preso la paga.

            Nella sceglie la tua squadra, e Dragna ti dà le lanterne della squadra da curare. L'ascia da
            tunnel resta appesa al suo schienale. Argento apre il quaderno dei titoli accanto al Disco e
            smette di parlare a metà frase.
          almeno: { rep.raschiatori: 5.5 }
          imposta: { raschiatori.doppio: 2, raschiatori.merlach: 1, raschiatori.nella: 2 }
          effetti: { fazione.raschiatori: 1, monete: 80, raschiatori.squadra: 1, rep.raschiatori: -0.5, scandalo: 1 }
      - testo: "Chiedere il duello con Merlach come penitenza"
        descrizione: "Il Ferro sceglie chi si misura con chi accusa. Se scegli tu di misurarti, Dragna lo leggerà come una risposta."
        combattimento: raschiatori-merlach
        vittoria:
          titolo: La risposta
          testo: |
            Nel cortile chiedi a Dragna di scegliere te, e lei lo fa senza una parola. Merlach si batte bene,
            e alla fine è in ginocchio sulla sabbia, con le nocche bianche sul manico dell'ascia finché
            Galdrick non gli dice di lasciarla. Rinuncia ai salvati davanti allo sceriffo, e Galdrick scrive
            il suo nome nel registro dei mercanti di schiavi.

            Dragna ti mette in mano un'ascia da tunnel, come a chi ha risposto bene. Nella sceglie la tua
            squadra, e la sera i Quattro ti danno le lanterne della squadra da curare. Argento apre il
            quaderno dei titoli accanto al Disco e smette di parlare a metà frase.
          almeno: { rep.raschiatori: 6 }
          imposta: { raschiatori.doppio: 2, raschiatori.merlach: 1, raschiatori.nella: 2 }
          effetti: { fazione.raschiatori: 1, monete: 80, oggetto.raschiatori-ascia-da-tunnel: 1, raschiatori.squadra: 1 }
        sconfitta:
          titolo: Due volte
          testo: |
            Merlach ti batte davanti alla Caserma, e prima di andarsene libero legge ad alta voce le date
            delle borse, una per una. Le legge con la voce bassa e piana di sempre, e le reclute in fila le
            sentono tutte. Argento ricompra i salvati con la cassa della bacheca. Tu consegni a Galdrick le
            ricevute, perché almeno quelle servano a qualcosa, e il tuo nome finisce nel rapporto come
            testimone che ha preso la paga.

            Nella sceglie la tua squadra lo stesso, e Dragna ti dà le lanterne da curare senza guardarti.
            L'ascia da tunnel resta appesa al suo schienale. Argento apre il quaderno dei titoli accanto al
            Disco e smette di parlare a metà frase.
          almeno: { rep.raschiatori: 5.5 }
          imposta: { raschiatori.doppio: 2, raschiatori.merlach: 2, raschiatori.nella: 2 }
          effetti: { fazione.raschiatori: 1, monete: 80, raschiatori.squadra: 1, rep.raschiatori: -0.5 }
      - testo: "Restare con Merlach"
        descrizione: "La paga del Gancio è doppia, e lui la mantiene. Dragna invece ti chiederà di ricominciare da una corda sola."
        esito:
          titolo: Matita
          testo: |
            Torni nel cortile e ti metti accanto a Merlach, e il notaio ti guarda come si guarda un errore di
            conto. Merlach lascia i salvati alla Caserma senza discutere, ti mette in mano una borsa e se ne
            va libero verso la strada di Ghoran. La borsa è pesante e ancora tiepida, perché l'ha tenuta sotto
            il mantello fino a quel momento.

            Al Grifone, la sera, Dragna cancella il tuo nome dalla bacheca e lo riscrive a matita. Prima di
            tornare al tavolo dei Quattro dovrai fare un turno da sol{o|a} e appendere una lanterna a tue
            spese, dice, come facevano i vecchi con chi aveva preso la paga sbagliata.
          imposta: { raschiatori.doppio: 3, raschiatori.merlach: 2, raschiatori.penitenza: 1 }
          effetti: { fazione.raschiatori: 1, monete: 60, rep.raschiatori: -2 }

  # ------------------------------------------------------------ dopo il doppio gioco · la penitenza
  - id: raschiatori-la-penitenza
    presso: grifone-di-ferro
    immagine: ambientazione/cicatrice-del-mondo
    titolo: La penitenza
    sommario: "Il tuo nome sulla bacheca è tornato a matita. Per ripassarlo a inchiostro serve un turno da sol{o|a} e una lanterna appesa a tue spese."
    luogo: Locanda del Grifone di Ferro, poi la Vena Storta
    area: ponti-sospesi
    requisiti: [fazione.raschiatori == 9, raschiatori.penitenza == 1]
    testo: |
      Sulla bacheca del Grifone il tuo nome è scritto a matita in fondo, sotto quelli delle reclute. Gli altri
      nomi della squadra sono ripassati a inchiostro, e il tuo è così leggero che basterebbe il pollice per
      cancellarlo. Dragna batte due volte i monconi sul tavolo e ti spinge davanti un foglio con una riga
      sola, *Vena Storta, turno di notte*.

      È la penitenza dei vecchi Raschiatori. Chi ha preso la paga sbagliata scende da solo dove si scende in
      squadra. Prima di tornare al tavolo appende sul Ponte dei Morti una lanterna per qualcuno che non ha
      conosciuto, con un cristallo pagato di tasca sua.

      Nella si alza dal tavolo delle reclute e viene a mettersi in piedi accanto a te. Ci resta finché Dragna
      non le fa segno con il mento di tornare al suo posto, e lei ci torna voltandosi due volte.
    opzioni:
      - testo: "Fare il turno alla Vena Storta da sol{o|a}"
        descrizione: "Alla Vena Storta si lavora appesi alla corda con un piede contro la roccia. Di solito si è in cinque."
        prova: { attributo: fisico, abilita: [resistenza, atletica], difficolta: Media }
        successo:
          titolo: La Vena Storta, di notte
          testo: |
            Lavori appes{o|a} alla corda per tutta la notte con la guancia contro la roccia fredda e il
            piccone corto nella mano libera. All'alba risali con il sacco pieno e le dita che non vogliono
            aprirsi, e per staccarle dalla corda le apri una alla volta con l'altra mano. Con il primo
            cristallo buono paghi la lanterna, e la appendi sul Ponte dei Morti accanto a una che nessuno
            curava più.

            Al Grifone Dragna ripassa il tuo nome a inchiostro e ti restituisce la squadra.
          pe: { resistenza: 5 }
          imposta: { raschiatori.penitenza: 2, raschiatori.nella: 2 }
          effetti: { raschiatori.squadra: 1, rep.raschiatori: 1, cristalli.cristallo-sterile: 1 }
        fallimento:
          titolo: La seconda ora
          testo: |
            Alla seconda ora il piede ti scivola sulla roccia, e resti appes{o|a} a girare sopra il buio
            finché non riesci a puntare di nuovo lo stivale. Un sasso smosso dallo stivale cade nella
            fenditura, e non lo senti arrivare in fondo. All'alba risali con poco nel sacco e una spalla che
            non si alza, e con quel poco paghi la lanterna e la appendi sul Ponte dei Morti.

            Al Grifone Dragna ripassa il tuo nome a inchiostro e ti restituisce la squadra. Nella ti porta il
            ghiaccio per la spalla senza che nessuno glielo chieda.
          imposta: { raschiatori.penitenza: 2, raschiatori.nella: 2 }
          effetti: { raschiatori.squadra: 1, rep.raschiatori: 0.5, ferite: 1 }
      - testo: "Restare sveglio sul Ponte dei Morti una notte intera"
        descrizione: "La veglia è l'altra metà della penitenza. Una notte intera senza dormire accanto a una lanterna di qualcun altro."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Media }
        successo:
          titolo: La veglia
          testo: |
            Passi la notte sul Ponte dei Morti accanto a una lanterna senza nome, di quelle che nessuna
            squadra cura più. Ha il vetro opaco di fumo vecchio, e il gancio è consumato fino al lucido da
            anni di vento. A ogni campana dici a mezza voce i nomi dei salvati del Pozzo. All'alba ci metti
            dentro un cristallo pagato di tasca tua e la lasci accesa per chi verrà.

            Al Grifone Dragna ripassa il tuo nome a inchiostro e ti restituisce la squadra. Nella si siede di
            nuovo accanto a te, e stavolta nessuno le dice di tornare al suo posto.
          pe: { resilienza: 5 }
          imposta: { raschiatori.penitenza: 2, raschiatori.nella: 2 }
          effetti: { raschiatori.squadra: 1, rep.raschiatori: 1, monete: -10 }
        fallimento:
          titolo: Il sonno sul ponte
          testo: |
            Verso la terza campana il sonno ti prende sedut{o|a} con la schiena al parapetto. Ti svegli
            all'alba con la lanterna spenta accanto e la nebbia nei vestiti, e le assi sotto di te sono
            asciutte soltanto dove eri sedut{o|a}. Un vecchio della veglia ti guarda senza dire niente. Ci
            metti dentro un cristallo pagato di tasca tua e la riaccendi, e torni al Grifone con la vergogna
            sulla faccia.

            Dragna ripassa il tuo nome a inchiostro lo stesso e ti restituisce la squadra, e Nella ti porta
            una tazza di brodo caldo.
          imposta: { raschiatori.penitenza: 2, raschiatori.nella: 2 }
          effetti: { raschiatori.squadra: 1, rep.raschiatori: 0.5, monete: -10, tormento: 1 }
      - testo: "Pagare la lanterna e un cristallo buono per un anno"
        descrizione: "Un cristallo buono in una lanterna del Ponte dura un anno. Dragna accetta anche questa penitenza, se il cristallo è caro."
        requisiti: [monete >= 30]
        esito:
          titolo: Un anno di luce
          testo: |
            Compri al Mercato dei Nodi il cristallo migliore che trovi, limpido fino al centro e senza una
            vena grigia. La sera lo metti in una lanterna nuova sul Ponte dei Morti accanto a una che nessuno
            curava più. Il turno da sol{o|a} alla Vena Storta lo fai lo stesso, e lo fai male e lo finisci.
            All'alba Dragna ripassa il tuo nome a inchiostro e ti restituisce la squadra.
          imposta: { raschiatori.penitenza: 2, raschiatori.nella: 2 }
          effetti: { raschiatori.squadra: 1, rep.raschiatori: 1, monete: -30 }

  # ------------------------------------------------------------ 9 → 10 · le ombre che indicano
  - id: raschiatori-le-ombre-che-indicano
    presso: biblioteca-di-qir-azel
    immagine: personaggi/mattias-crenn
    titolo: Le ombre che indicano
    sommario: "Alla Biblioteca Mattias Crenn ha il rapporto del 142 sulle Stele dei Naviganti."
    luogo: Biblioteca di Qir-Azel, il primo piano
    area: quartieri-alti
    requisiti: [fazione.raschiatori == 9, pista.capomozzo >= 7, raschiatori.penitenza != 1]
    testo: |
      Mattias Crenn ha steso per te e per Argento le mappe della Superficie fino al Gradone Rosso, e le tiene
      ferme agli angoli con quattro pesi di piombo. Sopra ci sono il Disco della Gradinata e il tuo disegno
      della parete del Pozzo, con la stessa ruota di quattro segni. Le mappe sono consumate lungo le pieghe, e
      il metallo grigio del Disco non ha un graffio.

      «Due rovine che non c'entrano niente» dice Argento. «Quella a ovest prende le cose e quella a est le
      gela. La ruota è la stessa.» Tenebra avrebbe preferito lasciarle sottoterra, e lui invece vuole sapere.

      Crenn apre il rapporto della campagna del 142 alle Stele dei Naviganti, sette colonne basse oltre la
      Foresta Strisciante. Le cifre sono incolonnate a righello e gli angoli delle pagine sono neri delle dita
      di chi le ha sfogliate. Sull'ultima pagina c'è la riga famosa sulle ombre che cadono sempre nella stessa
      direzione, ostinate come dita puntate. Le misure ci sono tutte, e la linea non l'ha tirata nessuno.

      {accademiche Media} Nel 142 la Biblioteca misurava le ombre per sapere perché erano storte. Le tabelle
      segnano con cura l'ora e la stagione di ogni misura, e a nessuno venne in mente di chiedersi dove
      puntassero.

      {origine figlio-del-circolo} Al Circolo un'ombra che cade dalla parte sbagliata vuol dire che sotto c'è
      qualcosa che tira, e le colonne del disegno ti ricordano una radice storta.

      Crenn ti porge il compasso con la delicatezza con cui porgerebbe un bambino. È d'ottone, con la ghiera
      stretta a mano e le punte affilate da poco.
    opzioni:
      - testo: "Tirare la linea sulle mappe"
        descrizione: "Le misure del 142, il sole della stagione, le mappe della Gilda. Una linea tirata bene finisce da qualche parte."
        prova: { attributo: mentale, abilita: [accademiche, natura], difficolta: Media }
        successo:
          titolo: Verso est
          testo: |
            Riporti le misure del 142 sulla mappa con il compasso di Crenn e correggi per il sole della
            stagione. La linea parte dalle Stele e passa a un dito dalla città, e finisce due giorni a est
            nell'ultima conca prima della scarpata del Gradone Rosso. Le punte del compasso lasciano sulla
            carta una fila di forellini, e l'ultimo cade dove le mappe dei Raschiatori segnano tre archi neri
            in fila, le Carcasse di Korith. Argento resta a guardare la linea finché Crenn non chiude le
            finestre.
          pe: { accademiche: 5 }
          effetti: { fazione.raschiatori: 1, informazioni.segreto: 1, rep.raschiatori: 0.5 }
        fallimento:
          titolo: Due notti
          testo: |
            La prima linea ti porta nel mezzo della Cicatrice e la seconda in un campo di cavoli. Crenn ti
            corregge i conti a matita senza dire una parola, e i margini della mappa si riempiono di cifre
            cancellate. Ci vogliono due notti prima che la linea vada a finire due giorni a est, nell'ultima
            conca prima della scarpata del Gradone Rosso. Lì le mappe dei Raschiatori segnano le Carcasse di
            Korith.
          effetti: { fazione.raschiatori: 1, informazioni.segreto: 1, tormento: 1 }
      - testo: "Andare alle Stele a misurare le ombre"
        descrizione: "Sul posto la linea si tira con un filo e due paletti."
        costo: 2
        prova: { attributo: fisico, abilita: resistenza, difficolta: Media }
        successo:
          titolo: Il filo e i paletti
          testo: |
            Arrivi alle Stele con i piedi gonfi e il collo bruciato dal sole. Per un giorno intero pianti
            paletti sulla punta delle ombre una alla volta, e la tua ombra intanto si sposta con il sole molto
            più in fretta delle loro. A sera tendi il filo, e il filo punta a est dritto sopra la città. Al
            ritorno Argento ci mette sopra la mappa, e la linea finisce sulle Carcasse di Korith, tre archi
            neri nell'ultima conca prima del Gradone Rosso.
          pe: { resistenza: 5 }
          effetti: { fazione.raschiatori: 1, informazioni.segreto: 1, rep.raschiatori: 0.5 }
        fallimento:
          titolo: Il margine della Foresta
          testo: |
            Il sentiero lungo la Foresta Strisciante ti costa una caviglia storta e una notte su un albero,
            con qualcosa che passeggia di sotto fino all'alba senza spezzare un ramo. Alle Stele ci arrivi
            zopp{o|a} e il filo lo tendi lo stesso, e punta a est. Argento ci mette sopra la mappa, e la linea
            finisce sulle Carcasse di Korith nell'ultima conca prima del Gradone Rosso.
          effetti: { fazione.raschiatori: 1, informazioni.segreto: 1, ferite: 1 }
      - testo: "Pagare un copista che tiri la linea per te"
        descrizione: "La Biblioteca ha copisti che sanno usare un compasso meglio di te. Costano, e ci mettono una settimana."
        requisiti: [monete >= 20]
        costo: 2
        esito:
          titolo: Il copista
          testo: |
            Il copista è un ragazzo con le dita macchiate e gli occhiali legati con lo spago. Ci mette una
            settimana, e intanto ti manda due biglietti per chiedere più carta. Alla fine ti porta la mappa
            con una linea sottile e dritta tirata a inchiostro senza una sbavatura. La linea finisce sulle
            Carcasse di Korith, tre archi neri nell'ultima conca prima del Gradone Rosso.
          effetti: { fazione.raschiatori: 1, informazioni.segreto: 1, monete: -20 }
      - testo: "Leggere le ombre come si leggono nel Bosco"
        descrizione: "Al Circolo le ombre storte vogliono dire che sotto c'è qualcosa che tira. Basta seguirle all'indietro."
        quando: [origine.figlio-del-circolo >= 1]
        esito:
          titolo: La radice storta
          testo: |
            Il compasso lo lasci sul tavolo. Segui le ombre del disegno all'indietro come al Circolo segui una
            radice che affiora, fino al punto dove tira, e il dito ti si ferma due giorni a est della città.
            Crenn verifica con le misure del 142 e il conto torna alla prima prova. Lì le mappe dei
            Raschiatori segnano le Carcasse di Korith, tre archi neri nell'ultima conca prima del Gradone
            Rosso.
          pe: { natura: 5 }
          effetti: { fazione.raschiatori: 1, informazioni.segreto: 1, rep.raschiatori: 0.5 }
      - testo: "Riconoscere nel Disco una notazione di fasi"
        descrizione: "All'Accademia i calcoli delle stagioni si scrivono in cerchio, con i segni che si danno il cambio. Il Disco ha la stessa forma."
        quando: [origine.allievo-di-torvessa >= 1]
        esito:
          titolo: Le fasi
          testo: |
            Guardi il Disco e ti torna in mente una lavagna dell'Accademia piena di cerchi divisi in quattro,
            dove i segni si davano il cambio con le stagioni. Anche sulla ruota del Disco nessun segno fa da
            inizio, e allora la ruota segna un turno come quei cerchi. Con questa idea in testa le ombre del
            142 tornano da sole. La linea finisce due giorni a est sulle Carcasse di Korith, nell'ultima conca
            prima del Gradone Rosso.
          pe: { accademiche: 5 }
          effetti: { fazione.raschiatori: 1, informazioni.segreto: 1, rep.raschiatori: 0.5 }
