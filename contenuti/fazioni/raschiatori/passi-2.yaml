# La quest dei Raschiatori, Atto III e inizio dell'Atto IV (fazione.raschiatori 6 → 10).
# - 6 → 7 `raschiatori-un-giorno-di-marcia-fuori` (Superficie, pista.acciaio >= 8): il campo della Compagnia del
#   Gancio sopra il Pozzo Senzanome, la carne comprata a Ghoran dagli uomini del Pesatore, Nella di Ghoran
#   (raschiatori.nella 1). Il passo 8 è la spedizione nel Pozzo (spedizione-pozzo.yaml).
# - 8 → 9 il giudizio del Ferro (Caserma, grado 3, Caposquadra). Due scene secondo il doppio gioco del passo 3:
#   `raschiatori-il-giudizio-del-ferro` (raschiatori.doppio != 1): il duello con Merlach (boss), il contratto
#   smontato davanti a Galdrick, il riscatto; `raschiatori-il-giudizio-del-ferro-doppio` (raschiatori.doppio == 1):
#   Dragna sa della paga del Gancio. Chi consegna contratto e ricevute prende il grado senza l'ascia e con mezzo
#   punto di reputazione in meno; chi resta con Merlach perde due punti, non prende né l'ascia né la squadra e
#   deve fare `raschiatori-la-penitenza` prima del passo 10 (raschiatori.penitenza 1 → 2). Nessun ramo chiude la
#   quest. raschiatori.merlach: 1 scritto nel registro dei mercanti di schiavi, 2 libero.
# - 9 → 10 `raschiatori-le-ombre-che-indicano` (Biblioteca, pista.capomozzo >= 7): le due ruote dei quattro segni
#   e le ombre delle Stele dei Naviganti, che puntano alle Carcasse di Korith (spedizione-korith.yaml).
storylet:
  # ------------------------------------------------------------ 6 → 7 · un giorno di marcia fuori
  - id: raschiatori-un-giorno-di-marcia-fuori
    immagine: ambientazione/ghoran
    titolo: Un giorno di marcia fuori
    sommario: "Sopra il Pozzo Senzanome il Gancio ha calato una cordata due giorni fa, e la corda è ancora ferma."
    luogo: Superficie Fratturata, oltre il Gradone Rosso sulla strada per Ghoran
    area: superficie-fratturata
    requisiti: [fazione.raschiatori == 6, pista.acciaio >= 8]
    testo: |
      Oltre il Gradone Rosso, a un giorno di marcia dalla città sulla strada per Ghoran, la Compagnia del Gancio ha piantato il suo campo, un
      recinto di pali con tre carri e un argano sopra il Pozzo Senzanome, dalle pareti lisce come il vetro.

      Nel recinto siedono una dozzina di legati con il collare di corda e la catena alle caviglie, comprati a Ghoran dagli uomini del Pesatore.
      Due giorni fa una cordata di cinque è scesa nel pozzo, e la sua corda è ancora tesa e immobile sull'argano, mentre Merlach fa i conti su un
      quaderno senza mandare nessuno a prenderli.

      Una ragazza legata al palo vicino, con i capelli rasati, ti sussurra che si chiama Nella di Ghoran e che suo fratello è nella cordata.

      {origine fuggiasco-di-ghoran} Riconosci il collare di corda e la catena da passo corto, e le caviglie se ne ricordano prima della testa.
    opzioni:
      - testo: "Entrare nel campo come compratore"
        descrizione: "Uno che compra può girare fra i legati e sceglierne una che scenda nel pozzo con lui."
        prova: { attributo: sociale, abilita: ingannare, difficolta: Media }
        successo:
          titolo: Il compratore di Laresh
          testo: |
            Ti presenti al caposquadra del campo come il compratore annoiato di
            una bottega di Laresh, e scegli Nella per scendere nel pozzo con te.
            Quando passi davanti all'argano, che fino all'alba è tuo, Merlach ti
            augura buona caccia con le stesse due parole e la stessa voce bassa di
            Tenebra. Quei due devono aver tirato le stesse corde per anni.
          pe: { ingannare: 3 }
          imposta: { raschiatori.nella: 1 }
          effetti: { fazione.raschiatori: 1, rep.raschiatori: 0.5 }
        fallimento:
          titolo: La faccia del Grifone
          testo: |
            Merlach ti riconosce prima che il caposquadra abbia finito di
            salutarti, e ride. Puoi scendere lo stesso, ti dice, perché un
            Raschiatore costa meno di una corda nuova, e ti regala la ragazza con
            un gesto della matita. Ti augura buona caccia con le stesse due parole
            e la stessa voce bassa di Tenebra, mentre tutto il campo ha visto la
            tua faccia.
          imposta: { raschiatori.nella: 1 }
          effetti: { fazione.raschiatori: 1, sospetto: 1 }
      - testo: "Chiedere a Merlach l'argano per andare a prenderli"
        descrizione: "Cinque legati persi sono una perdita, e un Raschiatore che li riporta su gratis è un affare."
        prova: { attributo: sociale, abilita: persuasione, difficolta: Difficile }
        successo:
          titolo: Costa meno di te
          testo: |
            Merlach fa il conto sul quaderno a voce alta, davanti ai suoi uomini,
            e cinque legati persi pesano più di un Raschiatore in prestito. Ti
            presta l'argano fino all'alba e, quando Nella chiede di scendere con
            te, la scrive sul quaderno come una spesa. Ti augura buona caccia con
            le stesse due parole e la stessa voce bassa di Tenebra.
          pe: { persuasione: 3 }
          imposta: { raschiatori.nella: 1 }
          effetti: { fazione.raschiatori: 1, rep.raschiatori: 0.5 }
        fallimento:
          titolo: Il nolo
          testo: |
            Merlach ti fa il conto del nolo dell'argano al prezzo di Ghoran con il
            freno compreso. Paghi perché sotto ci sono cinque persone, e lui
            scrive Nella sul quaderno come una spesa. Ti augura buona caccia con
            le stesse due parole e la stessa voce bassa di Tenebra, che come lui
            ti ha guardato le mani prima di parlarti.
          imposta: { raschiatori.nella: 1 }
          effetti: { fazione.raschiatori: 1, monete: -20, sospetto: 0.5 }
      - testo: "Liberare Nella di notte"
        descrizione: "Di notte ci sono due sorveglianti, e la carne del Gancio è merce registrata."
        prova: { attributo: fisico, abilita: furtivita, difficolta: Media }
        successo:
          titolo: Il palo
          testo: |
            Dopo la seconda ronda tagli il collare di Nella e la porti fuori dal
            recinto dalla parte del pozzo, dove nessuno guarda. All'alba Merlach
            vi trova seduti sull'argano e ti augura buona caccia con le stesse due
            parole e la stessa voce bassa di Tenebra. Poi, senza fretta, segna la
            ragazza sul quaderno come merce rubata.
          pe: { furtivita: 3 }
          imposta: { raschiatori.nella: 1 }
          effetti: { fazione.raschiatori: 1, sospetto: 1.5 }
        fallimento:
          titolo: La catena
          testo: |
            La catena si muove e sveglia l'uomo accanto, e il randello di un
            sorvegliante ti trova la schiena mentre porti fuori Nella. All'alba
            Merlach vi trova all'argano e invece di chiamare i suoi ti augura
            buona caccia, con le stesse due parole e la stessa voce bassa di
            Tenebra. Poi segna la ragazza come merce rubata.
          imposta: { raschiatori.nella: 1 }
          effetti: { fazione.raschiatori: 1, sospetto: 1.5, ferite: 1 }
      - testo: "Far notare ai sorveglianti che da Ghoran arrivano soltanto lettere"
        descrizione: "Dalla caduta dei Malgrani Ghoran paga il campo per lettera, e i sorveglianti sono pochi e nervosi."
        quando: [pista.pelle >= 7]
        prova: { attributo: sociale, abilita: intimidire, difficolta: Media }
        successo:
          titolo: Le lettere di Ghoran
          testo: |
            Dici ai sorveglianti che da quando la paga arriva per lettera nessuno
            tira su le corde, e uno sputa. Quando chiedi l'argano e la ragazza
            nessuno si mette in mezzo, e Merlach, dal suo carro, ti augura buona
            caccia con le stesse due parole e la stessa voce bassa di Tenebra.
            Quei due devono aver tirato le stesse corde per anni.
          pe: { intimidire: 3 }
          imposta: { raschiatori.nella: 1 }
          effetti: { fazione.raschiatori: 1, rep.raschiatori: 0.5 }
        fallimento:
          titolo: I sorveglianti nervosi
          testo: |
            Uno dei sorveglianti è più nervoso di quanto pensavi e ti spinge
            contro un carro, finché Merlach lo ferma e ti presta l'argano e la
            ragazza. Ti augura buona caccia con le stesse due parole e la stessa
            voce bassa di Tenebra.
          imposta: { raschiatori.nella: 1 }
          effetti: { fazione.raschiatori: 1, ferite: 0.5 }
      - testo: "Pagare a Merlach il nolo dell'argano"
        descrizione: "Merlach fa i conti, e i conti si possono pagare."
        requisiti: [monete >= 25]
        esito:
          titolo: Il prezzo di Ghoran
          testo: |
            Merlach sposta le monete sul coperchio della cassa con la punta della
            matita e ti dà l'argano fino all'alba. Nella la scrive sul quaderno
            come un regalo, e ti augura buona caccia con le stesse due parole e la
            stessa voce bassa di Tenebra.
          imposta: { raschiatori.nella: 1 }
          effetti: { fazione.raschiatori: 1, monete: -25 }
      - testo: "Parlare ai legati nella lingua del mercato"
        descrizione: "A Ghoran i legati si parlano con mezze parole e con le dita, e i sorveglianti non capiscono."
        quando: [origine.fuggiasco-di-ghoran >= 1]
        esito:
          titolo: La lingua del mercato
          testo: |
            Accucciato accanto al recinto parli a Nella con le dita e le mezze
            parole del mercato, e lei ti dice quanti sorveglianti ci sono di notte
            e quale di loro si vende. All'alba sei all'argano con lei, e Merlach
            ti augura buona caccia con le stesse due parole e la stessa voce bassa
            di Tenebra.
          pe: { empatia: 3 }
          imposta: { raschiatori.nella: 1 }
          effetti: { fazione.raschiatori: 1, rep.raschiatori: 0.5 }

  # ------------------------------------------------------------ 8 → 9 · il giudizio del Ferro (grado 3)
  - id: raschiatori-il-giudizio-del-ferro
    presso: guarnigione-di-qir-azel
    immagine: personaggi/dragna-gro-malog
    titolo: Il giudizio del Ferro
    sommario: "Merlach reclama i salvati del Pozzo nel cortile della Caserma, e Dragna risponde con l'usanza più vecchia."
    luogo: Caserma, il cortile all'alba
    area: quartieri-alti
    requisiti: [fazione.raschiatori == 8, raschiatori.doppio != 1]
    testo: |
      Il cortile della Caserma all'alba è freddo, con la sabbia rastrellata e le
      reclute in fila per l'appello. Davanti alla scuderia ci sono quelli che hai
      tirato su dal Pozzo Senzanome, con le coperte sulle spalle e le caviglie
      segnate dalla catena, e Nella non lascia la mano del fratello.

      Valdo Merlach è arrivato con due uomini e un notaio della Gilda, e con il
      contratto e una ricevuta di Ghoran chiede indietro la sua merce. Toren Galdrick
      ascolta a braccia conserte, e dice soltanto che lo ascolterà come testimone.

      Al muro della scuderia ci sono i Quattro, che sono tre, con Tenebra un passo
      indietro e Argento appoggiato al bastone. Poi Dragna fa un passo avanti sulla
      sabbia.

      «Chi accusa un Raschiatore davanti al Ferro si misura con il Ferro» dice nella
      voce che usa per i turni. «Oppure con chi il Ferro sceglie.» E si gira verso di
      te.

      {politica-ed-economia Media} Una ricevuta di Ghoran a Qir-Azel vale quanto il
      timbro che c'è sopra, e il timbro è di una casata che in Consiglio ha perso la
      voce.

      {intimidire Media} Merlach resta dov'è, si slaccia il mantello con calma e lo
      piega sul braccio del notaio, che non sa dove metterlo.
    opzioni:
      - testo: "Accettare il duello"
        descrizione: "Merlach ha tirato corde per vent'anni e combatte con l'ascia corta dei tunnel."
        combattimento: raschiatori-merlach
        vittoria:
          titolo: Il Ferro ha scelto
          testo: |
            Merlach si batte bene, ma finisce in ginocchio sulla sabbia e rinuncia
            ai salvati, che entrano in Caserma come reclute, mentre Galdrick
            scrive il suo nome nel registro dei mercanti di schiavi. Dragna ti dà
            un'ascia da tunnel come la sua e i Quattro le lanterne della squadra,
            dove Nella entra per prima. Argento apre il quaderno dei titoli
            accanto al Disco e si ferma a metà frase.
          almeno: { rep.raschiatori: 6 }
          imposta: { raschiatori.merlach: 1, raschiatori.nella: 2 }
          effetti: { fazione.raschiatori: 1, monete: 80, oggetto.raschiatori-ascia-da-tunnel: 1, raschiatori.squadra: 1 }
        sconfitta:
          titolo: La sabbia del cortile
          testo: |
            Merlach ti batte senza fretta e se ne va libero, dopo che Argento gli
            ha ricomprato i salvati con la cassa della bacheca al prezzo di
            Ghoran. Per il Ferro conta anche chi ha combattuto, e Dragna ti dà lo
            stesso un'ascia da tunnel e i Quattro le lanterne della squadra, dove
            Nella entra per prima. Argento apre il quaderno dei titoli e si ferma
            a metà frase.
          almeno: { rep.raschiatori: 6 }
          imposta: { raschiatori.merlach: 2, raschiatori.nella: 2 }
          effetti: { fazione.raschiatori: 1, monete: 80, oggetto.raschiatori-ascia-da-tunnel: 1, raschiatori.squadra: 1, rep.gilda: -0.5 }
      - testo: "Smontare il contratto davanti allo sceriffo"
        descrizione: "Un contratto per le mappe e una ricevuta per la carne non stanno nella stessa borsa."
        prova: { attributo: mentale, abilita: politica-ed-economia, difficolta: Difficile }
        successo:
          titolo: Riga per riga
          testo: |
            Letti uno accanto all'altro, il contratto paga mappe e la ricevuta
            compra persone, e Galdrick scrive il nome di Merlach nel registro dei
            mercanti di schiavi. I salvati entrano in Caserma come reclute. Dragna
            ti dà un'ascia da tunnel come la sua e i Quattro le lanterne della
            squadra, dove Nella entra per prima, mentre Argento apre il quaderno
            dei titoli accanto al Disco e si ferma a metà frase.
          pe: { politica-ed-economia: 5 }
          almeno: { rep.raschiatori: 6 }
          imposta: { raschiatori.merlach: 1, raschiatori.nella: 2 }
          effetti: { fazione.raschiatori: 1, monete: 80, oggetto.raschiatori-ascia-da-tunnel: 1, raschiatori.squadra: 1, rep.gilda: -0.5 }
        fallimento:
          titolo: Il notaio
          testo: |
            Il notaio ti corregge a ogni riga, e Galdrick conclude che a Qir-Azel
            la ricevuta resta valida. Argento ricompra i salvati dalla cassa della
            bacheca, e Merlach se ne va libero. Dragna ti dà un'ascia da tunnel e
            i Quattro le lanterne della squadra, dove Nella entra per prima,
            mentre Argento apre il quaderno dei titoli e si ferma a metà frase.
          almeno: { rep.raschiatori: 6 }
          imposta: { raschiatori.merlach: 2, raschiatori.nella: 2 }
          effetti: { fazione.raschiatori: 1, monete: 80, oggetto.raschiatori-ascia-da-tunnel: 1, raschiatori.squadra: 1, rep.gilda: -0.5, scandalo: 1 }
      - testo: "Far raccontare ai salvati come sono scesi"
        descrizione: "I salvati parlano di corde e di collari, mentre il contratto parla di mappe."
        requisiti: [raschiatori.salvati >= 2]
        prova: { attributo: mentale, abilita: politica-ed-economia, difficolta: Media }
        successo:
          titolo: I testimoni
          testo: |
            I salvati raccontano uno alla volta i collari, accanto alle righe del
            contratto che paga mappe, e Galdrick scrive il nome di Merlach nel
            registro dei mercanti di schiavi. Loro entrano in Caserma come
            reclute. Dragna ti dà un'ascia da tunnel come la sua e i Quattro le
            lanterne della squadra, dove Nella entra per prima, mentre Argento
            apre il quaderno dei titoli e si ferma a metà frase.
          pe: { politica-ed-economia: 3 }
          almeno: { rep.raschiatori: 6 }
          imposta: { raschiatori.merlach: 1, raschiatori.nella: 2 }
          effetti: { fazione.raschiatori: 1, monete: 80, oggetto.raschiatori-ascia-da-tunnel: 1, raschiatori.squadra: 1, rep.gilda: -0.5 }
        fallimento:
          titolo: Le parole dei salvati
          testo: |
            Davanti al notaio i salvati si confondono, e Galdrick dice che la
            ricevuta resta valida. Argento li ricompra uno per uno dalla cassa
            della bacheca, e Merlach se ne va libero. Dragna ti dà un'ascia da
            tunnel e i Quattro le lanterne della squadra, dove Nella entra per
            prima, mentre Argento apre il quaderno dei titoli e si ferma a metà
            frase.
          almeno: { rep.raschiatori: 6 }
          imposta: { raschiatori.merlach: 2, raschiatori.nella: 2 }
          effetti: { fazione.raschiatori: 1, monete: 80, oggetto.raschiatori-ascia-da-tunnel: 1, raschiatori.squadra: 1, rep.gilda: -0.5, scandalo: 1 }
      - testo: "Ricomprarli subito con le tue monete"
        descrizione: "Nessun duello e nessun processo, e Merlach resta libero di tornare a comprare carne."
        requisiti: [monete >= 100]
        esito:
          titolo: Il prezzo di Ghoran
          testo: |
            Conti le monete sul tavolo del notaio al prezzo di Ghoran, e Merlach
            le prende senza contarle, con un cenno quasi di stima. Se ne va
            libero, e i salvati entrano in Caserma come reclute. Dragna ti dà
            un'ascia da tunnel come la sua e i Quattro le lanterne della squadra,
            dove Nella entra per prima, mentre Argento apre il quaderno dei titoli
            e si ferma a metà frase.
          almeno: { rep.raschiatori: 6 }
          imposta: { raschiatori.merlach: 2, raschiatori.nella: 2 }
          effetti: { fazione.raschiatori: 1, monete: -20, oggetto.raschiatori-ascia-da-tunnel: 1, raschiatori.squadra: 1, rep.gilda: 0.5 }
      - testo: "Chiedere a Galdrick il registro dei mercanti di schiavi"
        descrizione: "A Ghoran ti hanno venduto, e qui uno sceriffo con un registro guarda un uomo comprare carne."
        quando: [origine.fuggiasco-di-ghoran >= 1]
        esito:
          titolo: Il registro dello sceriffo
          testo: |
            Mostri a Galdrick il segno che il collare ti ha lasciato al collo, e
            lui senza dire niente scrive il nome di Merlach nel registro dei
            mercanti di schiavi. I salvati entrano in Caserma come reclute. Dragna
            ti dà un'ascia da tunnel come la sua e i Quattro le lanterne della
            squadra, dove Nella entra per prima, mentre Argento apre il quaderno
            dei titoli e si ferma a metà frase.
          pe: { intimidire: 3 }
          almeno: { rep.raschiatori: 6 }
          imposta: { raschiatori.merlach: 1, raschiatori.nella: 2 }
          effetti: { fazione.raschiatori: 1, monete: 80, oggetto.raschiatori-ascia-da-tunnel: 1, raschiatori.squadra: 1, rep.gilda: -0.5 }

  - id: raschiatori-il-giudizio-del-ferro-doppio
    presso: guarnigione-di-qir-azel
    immagine: personaggi/dragna-gro-malog
    titolo: Il giudizio del Ferro
    sommario: "Prima del giudizio del Ferro Dragna ti prende da parte, e sa della paga del Gancio."
    luogo: Caserma, dietro la scuderia all'alba
    area: quartieri-alti
    requisiti: [fazione.raschiatori == 8, raschiatori.doppio == 1]
    testo: |
      Nel cortile della Caserma, all'alba, Valdo Merlach è arrivato con un
      notaio della Gilda a reclamare i salvati del Pozzo, e Toren Galdrick lo
      ascolta a braccia conserte.

      Prima che cominci Dragna ti porta per il gomito dietro la scuderia e ti
      mette davanti alla faccia un foglietto piegato in quattro. Dentro ci
      sono le date delle borse che hai preso dal Gancio, nella grafia
      ordinata di Merlach.

      «Me l'ha mandato lui ieri sera» dice. «Per farmi sapere chi tengo in
      squadra.» Non alza la voce, e i monconi della mano sinistra battono
      piano sul legno della scuderia, sempre nello stesso punto.

      {empatia Media} Rabbia ce n'è poca. Ha fatto i conti tutta la notte, e
      hanno dato sempre lo stesso risultato.

      {conoscenze-della-strada Facile} Merlach ti ha venduto per non perdere
      i salvati, perché una spia smascherata davanti al Ferro gli vale più di
      un duello.
    opzioni:
      - testo: "Consegnare a Galdrick il contratto e le ricevute"
        descrizione: "Davanti allo sceriffo le ricevute delle borse diventano prove contro chi le ha pagate."
        esito:
          titolo: Le ricevute
          testo: |
            Consegni a Galdrick le ricevute delle borse e il contratto firmato, e
            il nome di Merlach finisce nel registro dei mercanti di schiavi, il
            tuo nel rapporto come testimone che ha preso la paga. Nella sceglie la
            tua squadra e Dragna te ne affida le lanterne, ma l'ascia da tunnel
            resta appesa al suo schienale. Argento apre il quaderno dei titoli
            accanto al Disco e si ferma a metà frase.
          almeno: { rep.raschiatori: 5.5 }
          imposta: { raschiatori.doppio: 2, raschiatori.merlach: 1, raschiatori.nella: 2 }
          effetti: { fazione.raschiatori: 1, monete: 80, raschiatori.squadra: 1, rep.raschiatori: -0.5 }
      - testo: "Dirle che la paga la prendevi per i Raschiatori"
        descrizione: "Le borse del Gancio ti hanno portato fino al pozzo, e se Dragna ti crede la spia era sua."
        prova: { attributo: sociale, abilita: persuasione, difficolta: Difficile }
        successo:
          titolo: La spia del Ferro
          testo: |
            Le dici che senza le borse del Gancio i salvati sarebbero ancora nella
            brina. Dragna ti guarda a lungo e strappa il foglietto, e nel cortile
            sei tu a far finire Merlach nel registro dei mercanti di schiavi. Ti
            dà un'ascia da tunnel, e la sera i Quattro ti affidano le lanterne
            della squadra che Nella ha scelto. Argento apre il quaderno dei titoli
            e si ferma a metà frase.
          pe: { persuasione: 5 }
          almeno: { rep.raschiatori: 6 }
          imposta: { raschiatori.doppio: 2, raschiatori.merlach: 1, raschiatori.nella: 2 }
          effetti: { fazione.raschiatori: 1, monete: 80, oggetto.raschiatori-ascia-da-tunnel: 1, raschiatori.squadra: 1 }
        fallimento:
          titolo: Il foglietto
          testo: |
            A metà spiegazione ti accorgi che non ci credi nemmeno tu. Dragna
            ripiega il foglietto, e le ricevute che consegni a Galdrick mandano
            Merlach nel registro dei mercanti di schiavi e te nel rapporto, come
            testimone che ha preso la paga. Nella sceglie la tua squadra e Dragna
            te ne affida le lanterne, ma l'ascia da tunnel resta appesa al suo
            schienale.
          almeno: { rep.raschiatori: 5.5 }
          imposta: { raschiatori.doppio: 2, raschiatori.merlach: 1, raschiatori.nella: 2 }
          effetti: { fazione.raschiatori: 1, monete: 80, raschiatori.squadra: 1, rep.raschiatori: -0.5, scandalo: 1 }
      - testo: "Chiedere il duello con Merlach come penitenza"
        descrizione: "Se scegli tu di misurarti con chi accusa, Dragna lo leggerà come una risposta."
        combattimento: raschiatori-merlach
        vittoria:
          titolo: La risposta
          testo: |
            Dragna ti sceglie senza una parola. Alla fine Merlach è in ginocchio
            sulla sabbia e rinuncia ai salvati, mentre Galdrick scrive il suo nome
            nel registro dei mercanti di schiavi. Il foglietto finisce nel pozzo
            del cortile, tu ricevi un'ascia da tunnel, e la sera i Quattro ti
            affidano le lanterne della squadra che Nella ha scelto. Argento apre
            il quaderno dei titoli e si ferma a metà frase.
          almeno: { rep.raschiatori: 6 }
          imposta: { raschiatori.doppio: 2, raschiatori.merlach: 1, raschiatori.nella: 2 }
          effetti: { fazione.raschiatori: 1, monete: 80, oggetto.raschiatori-ascia-da-tunnel: 1, raschiatori.squadra: 1 }
        sconfitta:
          titolo: Due volte
          testo: |
            Merlach ti batte davanti alla Caserma e, prima di andarsene libero,
            legge ad alta voce le date delle borse. Argento ricompra i salvati, e
            le ricevute che consegni a Galdrick mettono il tuo nome nel rapporto
            come testimone che ha preso la paga. Nella sceglie lo stesso la tua
            squadra e Dragna te ne dà le lanterne senza guardarti, ma l'ascia
            resta appesa al suo schienale.
          almeno: { rep.raschiatori: 5.5 }
          imposta: { raschiatori.doppio: 2, raschiatori.merlach: 2, raschiatori.nella: 2 }
          effetti: { fazione.raschiatori: 1, monete: 80, raschiatori.squadra: 1, rep.raschiatori: -0.5 }
      - testo: "Restare con Merlach"
        descrizione: "La paga del Gancio è doppia e lui la mantiene, mentre Dragna ti farà ricominciare da una corda sola."
        esito:
          titolo: Matita
          testo: |
            Ti metti accanto a Merlach, ma Galdrick decide che a Qir-Azel la
            ricevuta di Ghoran non vale. Merlach lascia i salvati alla Caserma e
            se ne va verso Ghoran, dopo averti messo in mano una borsa.

            La sera Dragna riscrive il tuo nome a matita, e per tornare al tavolo
            dei Quattro dovrai fare un turno da solo e appendere una lanterna a
            tue spese.
          imposta: { raschiatori.doppio: 3, raschiatori.merlach: 2, raschiatori.penitenza: 1 }
          effetti: { fazione.raschiatori: 1, monete: 60, rep.raschiatori: -2 }

  # ------------------------------------------------------------ dopo il doppio gioco · la penitenza
  - id: raschiatori-la-penitenza
    presso: grifone-di-ferro
    immagine: ambientazione/cicatrice-del-mondo
    titolo: La penitenza
    sommario: "Il tuo nome sulla bacheca è tornato a matita, e per ripassarlo a inchiostro serve la penitenza dei vecchi."
    luogo: Locanda del Grifone di Ferro, poi la Vena Storta
    area: ponti-sospesi
    requisiti: [fazione.raschiatori == 9, raschiatori.penitenza == 1]
    testo: |
      Sulla bacheca del Grifone il tuo nome è scritto a matita, in fondo,
      sotto quelli delle reclute. Dragna ti spinge davanti un foglio con una
      riga sola, *Vena Storta, turno di notte*, e accanto lo spazio per un
      nome.

      Secondo l'usanza dei vecchi Raschiatori, chi ha preso la paga sbagliata
      scende da solo dove si scende in squadra, e prima di tornare al tavolo
      appende sul Ponte dei Morti una lanterna per qualcuno che non ha mai
      conosciuto, con un cristallo pagato di tasca sua.

      Nella viene a mettersi accanto a te, finché Dragna non le fa segno con
      il mento di tornare al tavolo delle reclute.

      {empatia Media} Dragna ha scritto la riga con più cura del solito,
      perché vuole che tu ce la faccia.

      {resistenza Media fallita} Le spalle ricordano la seconda ora alla Vena
      Storta, quando decidono i polsi.
    opzioni:
      - testo: "Fare il turno alla Vena Storta da solo"
        descrizione: "Alla Vena Storta si lavora appesi alla corda, e di solito si è in cinque."
        prova: { attributo: fisico, abilita: [resistenza, atletica], difficolta: Media }
        successo:
          titolo: La Vena Storta, di notte
          testo: |
            Lavori appeso per tutta la notte con la guancia contro la roccia, e
            all'alba risali con il sacco pieno. Con il primo cristallo buono paghi
            la lanterna e la appendi sul Ponte dei Morti, accanto a una che
            nessuno curava più.

            Dragna ripassa il tuo nome a inchiostro e ti restituisce la squadra, e
            stavolta nessuno dice a Nella di tornare al suo posto.
          pe: { resistenza: 5 }
          imposta: { raschiatori.penitenza: 2, raschiatori.nella: 2 }
          effetti: { raschiatori.squadra: 1, rep.raschiatori: 1, cristalli.cristallo-sterile: 1 }
        fallimento:
          titolo: La seconda ora
          testo: |
            Alla seconda ora il piede ti scivola e resti appeso a girare sopra il
            buio, e il resto della notte lavori con una mano sola. Con il poco che
            porti su paghi la lanterna e la appendi sul Ponte dei Morti.

            Dragna ripassa il tuo nome a inchiostro e ti restituisce la squadra, e
            Nella ti porta il ghiaccio per la spalla.
          imposta: { raschiatori.penitenza: 2, raschiatori.nella: 2 }
          effetti: { raschiatori.squadra: 1, rep.raschiatori: 0.5, ferite: 1 }
      - testo: "Restare sveglio sul Ponte dei Morti una notte intera"
        descrizione: "Una notte intera senza dormire, accanto alla lanterna di qualcun altro."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Media }
        successo:
          titolo: La veglia
          testo: |
            Passi la notte sul Ponte dei Morti accanto a una lanterna senza nome,
            dicendo a ogni campana i nomi dei salvati del Pozzo, e all'alba ci
            metti dentro un cristallo pagato di tasca tua.

            Dragna ripassa il tuo nome a inchiostro e ti restituisce la squadra, e
            stavolta nessuno dice a Nella di tornare al suo posto.
          pe: { resilienza: 5 }
          imposta: { raschiatori.penitenza: 2, raschiatori.nella: 2 }
          effetti: { raschiatori.squadra: 1, rep.raschiatori: 1, monete: -10 }
        fallimento:
          titolo: Il sonno sul ponte
          testo: |
            Verso la terza campana il sonno ti prende seduto contro il parapetto,
            e all'alba la lanterna accanto a te è spenta. La riaccendi con un
            cristallo pagato di tasca tua e torni al Grifone con la vergogna sulla
            faccia.

            Dragna ripassa lo stesso il tuo nome a inchiostro e ti restituisce la
            squadra, e Nella ti porta una tazza di brodo caldo.
          imposta: { raschiatori.penitenza: 2, raschiatori.nella: 2 }
          effetti: { raschiatori.squadra: 1, rep.raschiatori: 0.5, monete: -10, tormento: 1 }
      - testo: "Pagare la lanterna e un cristallo buono per un anno"
        descrizione: "Un cristallo buono in una lanterna del Ponte dura un anno, e Dragna accetta anche questo."
        requisiti: [monete >= 30]
        esito:
          titolo: Un anno di luce
          testo: |
            Metti il cristallo migliore del Mercato dei Nodi in una lanterna nuova
            sul Ponte dei Morti. Il turno da solo alla Vena Storta lo fai lo
            stesso, male ma fino in fondo, e all'alba Dragna ripassa il tuo nome a
            inchiostro e ti restituisce la squadra.
          imposta: { raschiatori.penitenza: 2, raschiatori.nella: 2 }
          effetti: { raschiatori.squadra: 1, rep.raschiatori: 1, monete: -30 }

  # ------------------------------------------------------------ 9 → 10 · le ombre che indicano
  - id: raschiatori-le-ombre-che-indicano
    presso: biblioteca-di-qir-azel
    immagine: personaggi/mattias-crenn
    titolo: Le ombre che indicano
    sommario: "La stessa ruota di quattro segni compare in due rovine, e la Biblioteca ha il rapporto del 142."
    luogo: Biblioteca di Qir-Azel, il primo piano
    area: quartieri-alti
    requisiti: [fazione.raschiatori == 9, pista.capomozzo >= 7, raschiatori.penitenza != 1]
    testo: |
      Al primo piano della Biblioteca la luce entra di sbieco dalle finestre
      alte. Mattias Crenn ha steso su un tavolo le mappe della Superficie
      fino al Gradone Rosso, e sopra ci sono il Disco della Gradinata e il
      tuo disegno della parete del Pozzo, con la stessa ruota di quattro
      segni.

      «Due rovine che non c'entrano niente, quella a ovest prende le cose e
      quella a est le gela, eppure la ruota è la stessa» dice Argento,
      battendo il bastone sul pavimento.

      Crenn apre il rapporto della campagna del 142 alle Stele dei Naviganti,
      sette colonne basse oltre la Foresta Strisciante. Sull'ultima pagina
      c'è la riga famosa sulle ombre che cadono sempre nella stessa
      direzione, ostinate come dita puntate, con tutte le misure, e la linea
      nessuno l'ha mai tirata.

      {origine figlio-del-circolo} Al Circolo le ombre che cadono nella
      direzione sbagliata vogliono dire che sotto c'è qualcosa che tira.
    opzioni:
      - testo: "Tirare la linea sulle mappe"
        descrizione: "Le misure del 142 e il sole della stagione, e una linea tirata bene finisce da qualche parte."
        prova: { attributo: mentale, abilita: [accademiche, natura], difficolta: Media }
        successo:
          titolo: Verso est
          testo: |
            Riporti le misure del 142 con il compasso di Crenn, correggendo per il
            sole della stagione. La linea parte dalle Stele, passa a un dito dalla
            città e finisce due giorni a est, nell'ultima conca prima della
            scarpata del Gradone Rosso, dove le mappe dei Raschiatori segnano tre
            archi neri in fila, le Carcasse di Korith.
          pe: { accademiche: 5 }
          effetti: { fazione.raschiatori: 1, informazioni.segreto: 1, rep.raschiatori: 0.5 }
        fallimento:
          titolo: Due notti
          testo: |
            La prima linea ti porta nella Cicatrice e la seconda in un campo di
            cavoli. Dopo due notti, con Crenn che ti corregge i conti a matita, la
            linea finisce due giorni a est, nell'ultima conca prima del Gradone
            Rosso, dove le mappe dei Raschiatori segnano le Carcasse di Korith.
          effetti: { fazione.raschiatori: 1, informazioni.segreto: 1, tormento: 1 }
      - testo: "Andare alle Stele a misurare le ombre"
        descrizione: "Due giorni e mezzo lungo la Foresta Strisciante, per tirare la linea con un filo e due paletti."
        costo: 2
        prova: { attributo: fisico, abilita: resistenza, difficolta: Media }
        successo:
          titolo: Il filo e i paletti
          testo: |
            Alle Stele passi un giorno intero a piantare paletti sulla punta delle
            ombre, e a sera il filo teso punta a est, dritto sopra la città. Al
            ritorno Argento ci mette sopra la mappa, e la linea finisce sulle
            Carcasse di Korith, tre archi neri nell'ultima conca prima del Gradone
            Rosso.
          pe: { resistenza: 5 }
          effetti: { fazione.raschiatori: 1, informazioni.segreto: 1, rep.raschiatori: 0.5 }
        fallimento:
          titolo: Il margine della Foresta
          testo: |
            Il sentiero lungo la Foresta Strisciante ti costa una caviglia storta
            e una notte su un albero, ma alle Stele tendi lo stesso il filo, e
            punta a est. Sulla mappa di Argento la linea finisce sulle Carcasse di
            Korith, nell'ultima conca prima del Gradone Rosso.
          effetti: { fazione.raschiatori: 1, informazioni.segreto: 1, ferite: 1 }
      - testo: "Pagare un copista che tiri la linea per te"
        descrizione: "I copisti della Biblioteca usano il compasso meglio di te, e si fanno pagare una settimana di lavoro."
        requisiti: [monete >= 20]
        costo: 2
        esito:
          titolo: Il copista
          testo: |
            Il copista, un ragazzo con le dita macchiate, ci mette una settimana e
            ti chiede due volte altra carta. Alla fine ti porta la mappa con una
            linea sottile che finisce sulle Carcasse di Korith, tre archi neri
            nell'ultima conca prima del Gradone Rosso.
          effetti: { fazione.raschiatori: 1, informazioni.segreto: 1, monete: -20 }
      - testo: "Leggere le ombre come si leggono nel Bosco"
        descrizione: "Al Circolo le ombre storte vogliono dire che sotto c'è qualcosa che tira. Basta seguirle all'indietro."
        quando: [origine.figlio-del-circolo >= 1]
        esito:
          titolo: La radice storta
          testo: |
            Segui le ombre del disegno all'indietro, come al Circolo una radice
            che affiora, fino al punto dove tirano, e il dito ti si ferma due
            giorni a est della città. Crenn verifica con le misure del 142, e lì
            le mappe segnano le Carcasse di Korith, tre archi neri nell'ultima
            conca prima del Gradone Rosso.
          pe: { natura: 5 }
          effetti: { fazione.raschiatori: 1, informazioni.segreto: 1, rep.raschiatori: 0.5 }
      - testo: "Riconoscere nel Disco una notazione di fasi"
        descrizione: "All'Accademia i calcoli delle stagioni si scrivono in cerchio, e il Disco ha la stessa forma."
        quando: [origine.allievo-di-torvessa >= 1]
        esito:
          titolo: Le fasi
          testo: |
            Il Disco ti ricorda una lavagna dell'Accademia piena di cerchi divisi
            in quattro, dove i segni si davano il cambio con le stagioni, e
            capisci che la ruota indica un turno. Con questa idea le ombre del 142
            tornano da sole, e la linea finisce due giorni a est, sulle Carcasse
            di Korith, nell'ultima conca prima del Gradone Rosso.
          pe: { accademiche: 5 }
          effetti: { fazione.raschiatori: 1, informazioni.segreto: 1, rep.raschiatori: 0.5 }
