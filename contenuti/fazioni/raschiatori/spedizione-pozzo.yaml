# La quest dei Raschiatori, passo 8 (fazione.raschiatori 7 → 8): la spedizione nel Pozzo Senzanome, oltre il
# Gradone Rosso sulla strada per Ghoran (codex sf-pozzo-senzanome), con Nella di Ghoran. Ci si entra
# dall'argano della Compagnia (`raschiatori-l-argano-sul-pozzo`, nella Superficie); con lo Scandaglio l'ingresso
# costa un rintocco in meno.
# Le stanze vanno in fasce di profondità (una stanza superata non ricompare nella stessa visita):
# 0 le pareti vetrificate o la corda della cordata, 1 il sasso che non tocca o la brina che si muove,
# 2 il silenzio fitto (dove si parla a segni) o il sorvegliante con il coltello, 3 la pancia tiepida (i condotti
# che portano il freddo verso sud-ovest) o le impronte nella brina; Nella sulla corda vale da 1 a 3.
# Il cuore a 4 è la camera del gelo: la cordata ferma nella brina, il custode del Pozzo e sulla parete la ruota dei
# quattro segni con la fiamma accesa. Ogni ramo chiude il passo e riporta in Superficie; cambia quanti della
# cordata risalgono (raschiatori.salvati da 1 a 3), che al passo 9 apre un'opzione.
aree:
  - id: raschiatori-pozzo
    immagine: ambientazione/ghoran
    nome: Il Pozzo Senzanome
    sommario: "Un pozzo dalle pareti vetrificate da cui ogni cosa calata torna su più fredda."
    spedizione: { ritorno: superficie-fratturata, soglia: 4, stanze: 3 }
    testo: |
      Il Pozzo Senzanome scende dritto nella terra con pareti nere e lisce
      come uno specchio, dove non c'è una sola lettera dei Precursori. Ogni
      cosa che ci si cala torna su più fredda di quando è scesa, e dopo dieci
      palmi la corda ti gela le mani attraverso i guanti. Nella scende
      accanto a te, legata alla tua corda con un nodo che le hai fatto tu.

storylet:
  # ------------------------------------------------------------ l'ingresso, nella Superficie
  - id: raschiatori-l-argano-sul-pozzo
    immagine: ambientazione/ghoran
    titolo: L'argano sul Pozzo
    sommario: "All'alba l'argano della Compagnia è tuo, e Nella ti aspetta accanto al buco con la corda in vita."
    luogo: Superficie Fratturata, il campo del Gancio sopra il Pozzo Senzanome
    area: superficie-fratturata
    requisiti: [fazione.raschiatori == 7]
    testo: |
      All'alba il campo del Gancio dorme ancora, tranne il caposquadra, che ti
      guarda. Nella aspetta accanto all'argano con una corda in vita e una
      lampada spenta.

      La corda della cordata, bianca di brina, pende ancora dal tamburo e vibra
      appena sotto la mano, come un filo da pesca. *Cinque là sotto da tre
      giorni, e una sola corda per tornare su.* Il freddo che sale dal pozzo ti
      fa lacrimare gli occhi.

      {tecnologia Media} Il freno di ferro è stato allentato di un dente,
      perché l'argano regga una persona sola e ceda quando sulla corda sono in
      due.
    opzioni:
      - testo: "Scendere lungo la corda della cordata"
        descrizione: "La corda gelata dei cinque porta dritta a loro."
        prova: { attributo: fisico, abilita: atletica, difficolta: Media }
        successo:
          titolo: La corda bianca
          testo: |
            Scendi a mani strette sulla corda della cordata, con Nella sopra di
            te, finché il cielo diventa un cerchio e poi un punto.
          pe: { atletica: 2 }
          vai: raschiatori-pozzo
        fallimento:
          titolo: La corda che scivola
          testo: |
            La brina è più liscia del vetro, e scivoli giù finché il nodo di sicurezza ti
            ferma con uno strattone, appeso come un sacco. Riprendete a scendere più
            adagio.
          effetti: { ferite: 0.5 }
          vai: raschiatori-pozzo
      - testo: "Rimettere a posto il freno e farti calare"
        descrizione: "Un freno allentato di un dente è una trappola per chi scende in due."
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Media }
        successo:
          titolo: Un dente
          testo: |
            Stringi il freno di un dente e lo provi con il tuo peso come fa
            Dragna. Il caposquadra se ne va senza salutare, e l'argano vi cala
            insieme senza scosse.
          pe: { tecnologia: 2 }
          vai: raschiatori-pozzo
        fallimento:
          titolo: Il dente sbagliato
          testo: |
            Stringi il dente sbagliato, e a metà discesa l'argano vi lascia cadere
            per un tratto. Lo strattone ti torce la spalla e sbatte Nella contro
            la parete, mentre dal campo arriva una risata.
          effetti: { ferite: 1 }
          vai: raschiatori-pozzo
      - testo: "Mandare avanti lo Scandaglio"
        descrizione: "Il cristallo sa prima di te che cosa c'è sotto il pozzo."
        requisiti: [chiave.scandaglio >= 1]
        costo: 0
        esito:
          titolo: Il cristallo che vibra
          testo: |
            Lo Scandaglio vibra sempre più piano finché si ferma su una nota sola,
            e seguendola arrivi in fondo al primo tratto prima di quanto credevi.
          vai: raschiatori-pozzo
      - testo: "Pagare il caposquadra perché manovri l'argano lui"
        descrizione: "Per qualche moneta il caposquadra vi cala lui, e magari il freno tiene."
        requisiti: [monete >= 10]
        esito:
          titolo: Le mani del caposquadra
          testo: |
            Il caposquadra si sputa sulle mani e vi cala piano tutti e due con una
            delicatezza inattesa, e dall'alto ti grida di salutargli la cordata, se è
            ancora viva.
          effetti: { monete: -10 }
          vai: raschiatori-pozzo

  # ------------------------------------------------------------ 0 · le pareti
  - id: raschiatori-pozzo-le-pareti-vetrificate
    immagine: ambientazione/ghoran
    titolo: Le pareti vetrificate
    sommario: "Le pareti sono vetro gelato senza un appiglio, e il freddo passa i guanti."
    luogo: Il Pozzo Senzanome, il primo tratto
    area: raschiatori-pozzo
    ripetibile: true
    requisiti: [fazione.raschiatori == 7, profondita.raschiatori-pozzo == 0]
    testo: |
      Le pareti del primo tratto sono vetro nero, lisce come uno stagno
      gelato. Il freddo sale dal basso a ondate, e poco più in basso Nella
      ti indica una crepa sottile con dentro qualcosa di bianco che si
      muove.

      {resistenza Media} Le dita vanno tenute in movimento, e quando
      smettono di farti male è il momento di preoccuparsi.
    opzioni:
      - testo: "Tenere duro e scendere nel freddo"
        descrizione: "Il freddo si sopporta finché ci si muove."
        prova: { attributo: fisico, abilita: resistenza, difficolta: Media }
        successo:
          titolo: Le dita
          testo: |
            Scendi aprendo e chiudendo le dita a ogni palmo, come da bambino
            d'inverno, finché oltre la crepa il vetro diventa grigio e il freddo
            cala di colpo.
          pe: { resistenza: 2 }
          effetti: { profondita.raschiatori-pozzo: 1 }
        fallimento:
          titolo: Il bianco sulle nocche
          testo: |
            Ti accorgi che non senti più le dita, e Nella te le strofina fra le
            sue finché il dolore torna.
          effetti: { ferite: 0.5 }
      - testo: "Puntare gli stivali sulla crepa e calarsi a scatti"
        descrizione: "La crepa è l'unico appiglio del tratto, se regge."
        prova: { attributo: fisico, abilita: atletica, difficolta: Media }
        successo:
          titolo: La crepa
          testo: |
            La cosa bianca nella crepa si ritira come una lumaca, e ti cali a
            scatti con Nella dietro finché il vetro diventa grigio e il freddo
            cala.
          pe: { atletica: 2 }
          effetti: { profondita.raschiatori-pozzo: 1 }
        fallimento:
          titolo: La cosa bianca
          testo: |
            La cosa bianca ti si attacca alla suola come una ventosa gelata, e
            scalciando perdi l'appoggio e sbatti contro il vetro, con la caviglia
            che pulsa.
          effetti: { ferite: 0.5 }
      - testo: "Fasciarsi le mani con le bende e scendere piano"
        descrizione: "Le bende servono per dopo, ma il dopo comincia adesso."
        costo: 2
        esito:
          titolo: Le bende
          testo: |
            Ti fasci le mani e fasci quelle di Nella, che si lascia fare guardando
            altrove, e scendete piano. Il freddo entra lo stesso dai polsi, e in
            fondo ti fanno male anche i denti.
          effetti: { profondita.raschiatori-pozzo: 1, ferite: 0.5 }

  - id: raschiatori-pozzo-la-corda-della-cordata
    immagine: ambientazione/ghoran
    titolo: La corda della cordata
    sommario: "La corda dei cinque scende accanto alla tua, bianca di brina, finché la brina finisce di colpo."
    luogo: Il Pozzo Senzanome, accanto alla corda della cordata
    area: raschiatori-pozzo
    ripetibile: true
    requisiti: [fazione.raschiatori == 7, profondita.raschiatori-pozzo == 0]
    testo: |
      La corda della cordata scende accanto alla tua coperta di brina,
      finché poco più sotto la brina finisce di colpo e la corda è pulita e
      asciutta come appena uscita dalla bottega del cordaio. Nella allunga
      la mano verso la corda e poi la ritira.

      {percezione Media} Il punto dove finisce la brina è dritto come un
      taglio.
    opzioni:
      - testo: "Esaminare il punto dove finisce la brina"
        descrizione: "Una corda che cambia così ha incontrato qualcosa."
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Media }
        successo:
          titolo: Il segno sulla corda
          testo: |
            Sotto il bordo della brina la corda ha un anello di fibre bruciate dal
            freddo, dove qualcosa l'ha stretta a lungo. Lo dici a Nella con le
            dita, e scendete tenendovi lontani dalla corda dei cinque.
          pe: { tecnologia: 2 }
          effetti: { profondita.raschiatori-pozzo: 1, informazioni.voce: 1 }
        fallimento:
          titolo: La corda calda
          testo: |
            Sotto la brina la corda è tiepida come un braccio, e quando ritiri la
            mano qualcosa dall'altra parte ritira la sua. Risali di qualche palmo
            con Nella che ti tiene per la cintura.
          effetti: { tormento: 1 }
      - testo: "Agganciarsi alla corda dei cinque e scendere svelti"
        descrizione: "Una corda che tiene cinque persone terrà anche te."
        prova: { attributo: fisico, abilita: atletica, difficolta: Media }
        successo:
          titolo: Dritti a loro
          testo: |
            Ti agganci alla corda della cordata e scendi svelto, e sotto la brina
            la corda è asciutta e scorre bene fino in fondo al primo tratto.
          pe: { atletica: 2 }
          effetti: { profondita.raschiatori-pozzo: 1 }
        fallimento:
          titolo: La corda che tira
          testo: |
            La corda dei cinque tira dal basso, piano, come una mano che chiama.
            Ti sganci con le dita che tremano e la guardi muoversi ancora un poco.
          effetti: { tormento: 1, ferite: 0.5 }
      - testo: "Lasciarla stare e scendere sulla tua"
        descrizione: "Tu scendi sulla tua lontano dalla loro."
        costo: 2
        esito:
          titolo: Lontano dalla corda
          testo: |
            Scendete lontano dalla corda dei cinque, in un tempo doppio che lascia
            al freddo il modo di entrarti nelle ossa.
          effetti: { profondita.raschiatori-pozzo: 1, ferite: 0.5 }

  # ------------------------------------------------------------ 1 · il sasso e la brina
  - id: raschiatori-pozzo-il-sasso
    immagine: ambientazione/regno-profondo
    titolo: Il sasso che non tocca
    sommario: "Su una cengia Nella lascia cadere un sasso nel buio, e il sasso non tocca il fondo."
    luogo: Il Pozzo Senzanome, la prima cengia
    area: raschiatori-pozzo
    ripetibile: true
    requisiti: [fazione.raschiatori == 7, profondita.raschiatori-pozzo == 1]
    testo: |
      Il pozzo si allarga in una cengia di vetro grigio dove si sta in due
      spalla a spalla. Nella lascia cadere un sasso nel buio, come fanno i
      pastori di Ghoran con i pozzi da acqua, e contate insieme a bassa voce
      fino a cento senza sentire niente.

      Dal buio sale un soffio leggero e regolare, che ti muove i capelli
      sulla fronte e poi si ritira.
    opzioni:
      - testo: "Misurare il soffio invece del sasso"
        descrizione: "Il soffio va e viene, e un soffio così ha una sorgente."
        prova: { attributo: mentale, abilita: percezione, difficolta: Media }
        successo:
          titolo: Il soffio
          testo: |
            I soffi arrivano ogni sette battiti e sanno di pietra bagnata e ferro
            freddo. Vengono da sotto e un poco di lato, dove la lampada trova la
            bocca di un cunicolo inclinato nel vetro.
          pe: { percezione: 2 }
          effetti: { profondita.raschiatori-pozzo: 1 }
        fallimento:
          titolo: Il conto di Nella
          testo: |
            A un certo punto il soffio prende il tuo passo e ti tira i capelli
            verso il buio, e risalite di un tratto senza parlare finché smette di
            seguirti.
          effetti: { tormento: 1 }
      - testo: "Smettere di contare e scendere"
        descrizione: "Il fondo non si sente, e allora si scende finché si scende."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Media }
        successo:
          titolo: Finché si scende
          testo: |
            Fai smettere Nella di contare con una mano sulla spalla e scendete,
            finché dopo un tratto il vetro della parete si apre nella bocca di un
            cunicolo inclinato.
          pe: { resilienza: 2 }
          effetti: { profondita.raschiatori-pozzo: 1 }
        fallimento:
          titolo: Il secondo sasso
          testo: |
            Dall'alto cade un secondo sasso che ti sfiora la spalla, e nessuno dei
            due l'ha lanciato.
          effetti: { tormento: 1 }
      - testo: "Calare la lampada con la cordicella"
        descrizione: "Una lampada calata su una cordicella illumina quello che c'è sotto, e torna su gelata."
        costo: 2
        esito:
          titolo: La lampada gelata
          testo: |
            La lampada di riserva si ferma su una bocca di cunicolo qualche braccio più sotto, e torna
            su coperta di brina.
          effetti: { profondita.raschiatori-pozzo: 1, ferite: 0.5 }

  - id: raschiatori-pozzo-la-brina
    immagine: ambientazione/marea-grigia
    titolo: La brina che si muove
    sommario: "Una nuvola di aghi di ghiaccio sale dal cunicolo, e dove si posa la pelle diventa bianca."
    luogo: Il Pozzo Senzanome, la bocca del cunicolo
    area: raschiatori-pozzo
    ripetibile: true
    requisiti: [fazione.raschiatori == 7, profondita.raschiatori-pozzo == 1]
    testo: |
      Dalla bocca del cunicolo esce una nuvola bassa di aghi di ghiaccio che risale la
      parete contro la corrente dell'aria e imbianca la corda dove si posa. Vicino alla
      lampada si ferma a mezz'aria, con tutti gli aghi girati dalla stessa parte, e Nella
      ha già smesso di muoversi.

      {natura Media} Cerca il caldo della lampada e del fiato, e chi resta immobile
      diventa freddo come la parete.
    opzioni:
      - testo: "Spegnere la lampada e coprirsi la bocca"
        descrizione: "Se cerca il caldo, bisogna smettere di averne. Per un poco."
        prova: { attributo: mentale, abilita: natura, difficolta: Media }
        successo:
          titolo: Freddo come la parete
          testo: |
            Spegni la lampada e stringi Nella contro la parete con la bocca nella
            manica, e la nuvola vi passa accanto con un fruscio di sabbia.
          pe: { natura: 2 }
          effetti: { profondita.raschiatori-pozzo: 1 }
        fallimento:
          titolo: Il fiato
          testo: |
            Dopo un poco devi prendere aria, e la nuvola ti trova la bocca. Risali
            tossendo, con gli aghi nel naso e Nella che ti tiene la testa mentre sputi
            acqua gelata.
          effetti: { ferite: 0.5, contaminazione: 1 }
      - testo: "Disperderla a colpi di lampada"
        descrizione: "È una nuvola. Le nuvole si spezzano."
        combattimento: raschiatori-sciame-di-brina
        vittoria:
          titolo: Gli aghi sciolti
          testo: |
            La nuvola si spezza sotto i colpi della lampada e del piccone e cade
            nel buio come nevischio, e quello che resta si scioglie in gocce che
            scorrono verso l'alto.
          effetti: { profondita.raschiatori-pozzo: 1 }
        sconfitta:
          titolo: Bianco
          testo: |
            La nuvola ti si posa sulla faccia e vedi soltanto bianco, finché Nella
            ti tira su fino alla cengia e ti strofina le guance per ridare colore
            alla pelle.
      - testo: "Lasciarle la lampada di riserva come esca"
        descrizione: "Una lampada accesa sulla cengia tiene ferma la nuvola, e poi non la rivedi più."
        costo: 2
        esito:
          titolo: L'esca
          testo: |
            La nuvola si posa sulla lampada di riserva come le mosche sul miele, e
            quando ti volti è un blocco di ghiaccio con una luce piccola dentro.
          effetti: { profondita.raschiatori-pozzo: 1, contaminazione: 1 }

  # ------------------------------------------------------------ 1–3 · Nella sulla corda
  - id: raschiatori-pozzo-nella-sulla-corda
    immagine: ambientazione/regno-profondo
    titolo: Nella sulla corda
    sommario: "Nella scivola, e resta appesa alla corda che vi lega, sotto di te, a girare nel buio."
    luogo: Il Pozzo Senzanome, a mezza corda
    area: raschiatori-pozzo
    ripetibile: true
    requisiti: [fazione.raschiatori == 7, profondita.raschiatori-pozzo >= 1, profondita.raschiatori-pozzo <= 3]
    testo: |
      Nella è scivolata su un tratto di vetro bagnato, e il nodo che le hai
      fatto tiene. Adesso gira appesa nel buio sotto di te e il suo peso ti
      tira giù di un palmo alla volta, mentre lei ti guarda dal basso senza
      gridare.

      {atletica Media} Se ti pianti con tutti e due i piedi la tiri su in tre
      bracciate, con uno solo scendete insieme.
    opzioni:
      - testo: "Tirarla su a forza di braccia"
        descrizione: "Due piedi sul vetro e la corda sulla spalla."
        prova: { attributo: fisico, abilita: atletica, difficolta: Media }
        successo:
          titolo: Tre bracciate
          testo: |
            Ti pianti con tutti e due i piedi, e alla terza bracciata la mano di
            Nella ti trova la cintura. Poi lei ti fa il cenno dei Raschiatori per
            *avanti*, imparato guardando te.
          pe: { atletica: 2 }
          effetti: { profondita.raschiatori-pozzo: 1, rep.raschiatori: 0.5 }
        fallimento:
          titolo: Insieme
          testo: |
            Il piede ti scivola a tua volta, e scendete insieme sfregando contro
            il vetro finché la tua corda si tende sull'argano e vi sbatte contro
            la parete.
          effetti: { ferite: 1 }
      - testo: "Dirle a segni come rimettersi in piedi"
        descrizione: "La paura fa sbagliare i piedi, e le servono due gesti chiari."
        prova: { attributo: sociale, abilita: empatia, difficolta: Facile }
        successo:
          titolo: Due gesti
          testo: |
            Le indichi la punta del piede e poi la parete, e lei gira adagio
            finché lo stivale trova il vetro e si rimette in piedi da sola, con le
            guance rosse non soltanto di freddo.
          pe: { empatia: 2 }
          effetti: { profondita.raschiatori-pozzo: 1 }
        fallimento:
          titolo: Il gesto sbagliato
          testo: |
            Lei capisce il contrario e si spinge via dalla parete. Dopo due giri
            sopra il buio sbatte sul vetro e resta aggrappata finché le passa il
            tremito.
          effetti: { tormento: 1 }
      - testo: "Fissare la corda a un chiodo e calarla piano"
        descrizione: "Un chiodo nel vetro regge la corda mentre Nella scende al prossimo appoggio, se tiene."
        costo: 2
        esito:
          titolo: Il chiodo nel vetro
          testo: |
            Fissi la corda a un chiodo in una crepa e cali Nella fino a una
            sporgenza più sotto, mentre il chiodo geme. Quando la raggiungi hai le
            palme scorticate, e lei te le guarda come se fossero sue.
          effetti: { profondita.raschiatori-pozzo: 1, ferite: 0.5 }

  # ------------------------------------------------------------ 2 · il silenzio fitto e il coltello
  - id: raschiatori-pozzo-il-silenzio-fitto
    immagine: ambientazione/regno-profondo
    titolo: Il silenzio fitto
    sommario: "Più giù il suono smette di esistere, e Nella muove la bocca senza voce."
    luogo: Il Pozzo Senzanome, il cunicolo muto
    area: raschiatori-pozzo
    ripetibile: true
    requisiti: [fazione.raschiatori == 7, profondita.raschiatori-pozzo == 2]
    testo: |
      Il cunicolo scende inclinato nel vetro, e a un certo punto il suono
      finisce come tagliato con un coltello. Nella si gira a dirti qualcosa
      e dalla bocca non esce niente. Più avanti il cunicolo si divide in
      due, e sul vetro di uno dei rami c'è l'impronta di una mano, bianca di
      brina.

      {empatia Media} Nella però parla con le mani come al mercato di
      Ghoran, e le mani si vedono benissimo.
    opzioni:
      - testo: "Parlare a segni con Nella"
        descrizione: "Lei conosce le mani del mercato di Ghoran, tu quelle dei Raschiatori."
        prova: { attributo: sociale, abilita: empatia, difficolta: Media }
        successo:
          titolo: Le mani
          testo: |
            Le indichi i due rami, e lei risponde con il pugno chiuso contro il
            petto e poi aperto, il segno di Ghoran per *fratello*. Poi indica
            l'impronta di brina, grande come la sua mano, e prendete quel ramo.
          pe: { empatia: 2 }
          effetti: { profondita.raschiatori-pozzo: 1 }
        fallimento:
          titolo: Il segno sbagliato
          testo: |
            Il tuo segno per *a sinistra* lei lo prende per qualcos'altro, e si
            irrigidisce tutta. Restate a chiedervi scusa con gli occhi finché il
            freddo vi rimanda indietro.
          effetti: { tormento: 1 }
      - testo: "Seguire l'impronta di brina"
        descrizione: "Chi ha lasciato quella mano sul vetro è passato di qui."
        prova: { attributo: mentale, abilita: percezione, difficolta: Media }
        successo:
          titolo: Le impronte
          testo: |
            Dopo la prima impronta ce n'è un'altra, sempre alla stessa altezza,
            dove si appoggia chi cerca equilibrio, e Nella le tocca una per una
            con la punta delle dita.
          pe: { percezione: 2 }
          effetti: { profondita.raschiatori-pozzo: 1 }
        fallimento:
          titolo: L'impronta tua
          testo: |
            A un certo punto trovi un'impronta con la forma della tua mano, il
            guanto rotto al pollice come il tuo, e torni al bivio sentendo per la
            prima volta il tuo cuore nel silenzio.
          effetti: { tormento: 1.5 }
      - testo: "Legarsi stretti e procedere a tentoni"
        descrizione: "Senza suono l'unica cosa sicura è la corda che ti lega a Nella, accorciata a un braccio."
        costo: 2
        esito:
          titolo: Corta
          testo: |
            Provate a tentoni il ramo di destra e poi quello di sinistra, e quando il
            suono torna tutto insieme ti fanno male le orecchie.
          effetti: { profondita.raschiatori-pozzo: 1, tormento: 1 }

  - id: raschiatori-pozzo-il-sorvegliante-con-il-coltello
    immagine: ambientazione/ghoran
    titolo: Il sorvegliante con il coltello
    sommario: "Un uomo del Gancio, appeso a una corda di servizio, sta tagliando la corda della cordata."
    luogo: Il Pozzo Senzanome, la seconda cengia
    area: raschiatori-pozzo
    ripetibile: true
    requisiti: [fazione.raschiatori == 7, profondita.raschiatori-pozzo == 2]
    testo: |
      Sulla seconda cengia un uomo del Gancio, appeso a una corda di
      servizio, sega la corda della cordata con un coltello lungo e la
      pazienza di un garzone che taglia la legna. Il caposquadra del campo
      l'ha mandato a recuperare un capo di corda nuova, che vale più di
      cinque legati che non tornano.

      {armi-da-mischia Facile} È appeso e ha una mano sola libera, e chi
      combatte appeso combatte male.
    opzioni:
      - testo: "Fermarlo"
        descrizione: "È appeso e ha un coltello, e tu non hai tempo."
        combattimento: raschiatori-un-sorvegliante
        vittoria:
          titolo: La corda salva
          testo: |
            La colluttazione sopra il buio dura poco, e il sorvegliante risale
            tenendosi il braccio. La corda della cordata resta tesa, con un taglio
            a metà che Nella fascia stretto con la sua cintura.
          effetti: { profondita.raschiatori-pozzo: 1 }
        sconfitta:
          titolo: Il coltello lungo
          testo: |
            Un calcio sul petto ti fa girare appeso sopra il vuoto. Quando torni
            alla cengia lui è risalito, ma nella colluttazione ha perso il
            coltello e la corda è ancora intera.
      - testo: "Dirgli che cosa gli fa Dragna, se lo sa"
        descrizione: "Chi taglia la corda di una cordata perde il Grifone, e lui lo sa."
        prova: { attributo: sociale, abilita: intimidire, difficolta: Media }
        successo:
          titolo: Il nome di Dragna
          testo: |
            Gli dici che cosa fa il Ferro a chi taglia una cordata, con le parole
            che userebbe lei, e l'uomo rinfodera il coltello. Prima di sparire
            sopra la cengia ti dice che il pozzo non l'ha mai visto.
          pe: { intimidire: 2 }
          effetti: { profondita.raschiatori-pozzo: 1 }
        fallimento:
          titolo: Non lavoro per Dragna
          testo: |
            Lui ride e dice che lavora per chi paga. Il coltello che ti lancia ti
            apre la manica, e mentre risale Nella fascia con la sua cintura la
            corda tagliata a metà.
          effetti: { ferite: 1 }
      - testo: "Tenere la corda della cordata finché lui si stanca"
        descrizione: "Se tieni tu il peso il taglio resta com'è, finché lui deve risalire."
        costo: 2
        esito:
          titolo: Il peso
          testo: |
            Tieni la corda sopra il taglio con le gambe puntate sul vetro finché
            il sorvegliante si stanca e risale. Ti fanno male le spalle fino al
            collo, e Nella fascia il taglio con la sua cintura.
          effetti: { profondita.raschiatori-pozzo: 1, ferite: 0.5 }

  # ------------------------------------------------------------ 3 · la pancia e le impronte
  - id: raschiatori-pozzo-la-pancia
    immagine: ambientazione/regno-profondo
    titolo: La pancia tiepida
    sommario: "In fondo al cunicolo una sala tonda e tiepida, con condotti che portano il freddo verso sud-ovest."
    luogo: Il Pozzo Senzanome, la pancia
    area: raschiatori-pozzo
    ripetibile: true
    requisiti: [fazione.raschiatori == 7, profondita.raschiatori-pozzo == 3]
    testo: |
      Il cunicolo sbocca in una sala tonda, tiepida come una stalla
      d'inverno. Nelle pareti corrono condotti di vetro grossi come un
      braccio, pieni di una nebbia bianca che scorre piano nella stessa
      direzione, e dal più basso arriva un rumore regolare di nocche contro
      il vetro.

      {natura Difficile} I condotti puntano a sud-ovest, dove a molti giorni
      di cammino c'è Mahr-Kel con le sue vasche.
    opzioni:
      - testo: "Seguire i condotti fino alla camera"
        descrizione: "La cordata è dove il freddo è più forte."
        prova: { attributo: mentale, abilita: [tecnologia, natura], difficolta: Media }
        successo:
          titolo: Contro corrente
          testo: |
            Segui i condotti contro corrente annotando la direzione per Argento,
            finché la brina copre ogni cosa e il bussare si fa più forte.
          pe: { tecnologia: 2 }
          effetti: { profondita.raschiatori-pozzo: 1, informazioni.voce: 1 }
        fallimento:
          titolo: Il condotto rotto
          testo: |
            Un condotto incrinato ti soffia addosso la nebbia bianca e ti gela il
            braccio fino al gomito, e torni nella sala tiepida a scaldarti contro
            la parete.
          effetti: { ferite: 0.5, contaminazione: 1 }
      - testo: "Rispondere al bussare"
        descrizione: "Tre colpi, una pausa, tre colpi. I Raschiatori bussano così quando sono chiusi da qualche parte."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Media }
        successo:
          titolo: Tre colpi
          testo: |
            Bussi tre volte con il manico del coltello e dopo una pausa ti
            rispondono tre colpi più deboli, da più avanti. Nella ti stringe il
            polso mentre seguite il bussare fino al corridoio di brina.
          pe: { resilienza: 2 }
          effetti: { profondita.raschiatori-pozzo: 1 }
        fallimento:
          titolo: Il bussare dentro
          testo: |
            Ti rispondono tre colpi da dentro la parete, sotto la tua mano, e poi
            da tutte le pareti insieme, finché Nella ti trascina fuori dalla sala.
          effetti: { tormento: 1.5 }
      - testo: "Riposare al tiepido e poi proseguire"
        descrizione: "È il primo posto caldo da quando siete scesi."
        costo: 2
        esito:
          titolo: Mezz'ora
          testo: |
            Vi sedete schiena contro schiena alla parete tiepida e Nella si
            addormenta subito, mentre tu guardi la nebbia nei condotti. Quando la
            svegli ha le guance segnate dal vetro.
          effetti: { profondita.raschiatori-pozzo: 1, contaminazione: 1 }

  - id: raschiatori-pozzo-le-impronte
    immagine: ambientazione/marea-grigia
    titolo: Le impronte nella brina
    sommario: "Nella brina ci sono impronte di piedi scalzi in fila, e nessuna torna indietro."
    luogo: Il Pozzo Senzanome, il corridoio di brina
    area: raschiatori-pozzo
    ripetibile: true
    requisiti: [fazione.raschiatori == 7, profondita.raschiatori-pozzo == 3]
    testo: |
      Il corridoio è coperto di brina dal pavimento al soffitto, e ogni passo fa un
      rumore di zucchero calpestato. Sul pavimento ci sono le impronte di cinque paia di
      piedi scalzi in fila, come cammina una cordata, e vanno tutte avanti. Nella si
      inginocchia accanto alla terza impronta e ci appoggia sopra la mano aperta, senza
      toccarla.

      {origine fuggiasco-di-ghoran} A Ghoran i legati camminano scalzi perché scappare
      costi di più, e le scarpe le danno soltanto ai sorveglianti.
    opzioni:
      - testo: "Seguire le impronte"
        descrizione: "Vanno avanti, dritte. Basta seguirle prima che la brina le copra."
        prova: { attributo: mentale, abilita: percezione, difficolta: Media }
        successo:
          titolo: La fila
          testo: |
            Le impronte si accorciano nei passi di gente che non ce la fa più e si
            fermano davanti a una porta di vetro appannato, con sopra una mano di
            brina grande come quella di Nella.
          pe: { percezione: 2 }
          effetti: { profondita.raschiatori-pozzo: 1 }
        fallimento:
          titolo: La brina nuova
          testo: |
            La brina cade dal soffitto come neve fine e cancella le impronte una
            alla volta, finché il freddo vi rimanda indietro.
          effetti: { tormento: 1 }
      - testo: "Lasciare che sia Nella a guidare"
        descrizione: "La terza impronta della fila è di suo fratello. Lei lo sa senza misurarla."
        prova: { attributo: sociale, abilita: empatia, difficolta: Facile }
        successo:
          titolo: Il passo del fratello
          testo: |
            Nella cammina davanti a te mettendo i piedi nelle impronte del
            fratello, come si gioca da bambini, e ti porta senza esitare fino a
            una porta di vetro appannato.
          pe: { empatia: 2 }
          effetti: { profondita.raschiatori-pozzo: 1, rep.raschiatori: 0.5 }
        fallimento:
          titolo: La fretta
          testo: |
            Nella parte di corsa e la corda ti tira giù sulla brina, e la ritrovi in ginocchio
            davanti a un muro dove le impronte finiscono senza una porta.
          effetti: { ferite: 0.5 }
      - testo: "Camminare sulle impronte, piano"
        descrizione: "Se loro sono passati di lì, di lì si passa, con i piedi che gelano."
        costo: 2
        esito:
          titolo: Nei loro passi
          testo: |
            Mettete gli stivali dove loro hanno messo i piedi nudi e arrivate con
            le ginocchia gelate a una porta di vetro appannato, con sopra una mano
            di brina.
          effetti: { profondita.raschiatori-pozzo: 1, ferite: 0.5 }

  # ------------------------------------------------------------ il cuore · la camera del gelo
  - id: raschiatori-la-camera-del-gelo
    immagine: bestiario/salvaguardia-precursori
    titolo: La camera del gelo
    sommario: "Dietro la porta di vetro la cordata è ferma in piedi nella brina, e intorno cammina una macchina."
    luogo: Il Pozzo Senzanome, la camera del gelo
    area: raschiatori-pozzo
    requisiti: [fazione.raschiatori == 7, profondita.raschiatori-pozzo >= 4]
    testo: |
      Dietro la porta di vetro, in una camera rotonda, ci sono i cinque
      della cordata in piedi, ancora legati alla loro corda. La brina li
      copre come un lenzuolo. Hanno gli occhi aperti e respirano piano, una
      nuvola piccola alla volta, e il terzo della fila ha la stessa bocca di
      Nella.

      Intorno a loro cammina una macchina piatta contro il pavimento, con le
      zampe ripiegate sotto il ventre come una cicala, e dalle sue giunture
      esce la nebbia bianca dei condotti. Sopra la cordata, piantati nel
      soffitto, ci sono dei cristalli che la macchina cura come un
      giardiniere le sue piante.

      Sulla parete di fondo, incisa nel vetro, c'è la ruota dei quattro
      segni, uguale a quella del Disco della Gradinata. Tre segni sono
      spenti, e la fiamma in basso è accesa di una luce azzurra che non
      scalda.

      {resilienza Media} Ogni nuvola che esce dalla cordata è più piccola
      della precedente. Hai il tempo di fare una cosa sola.

      Nella guarda il fratello, e ha già il coltello in mano.
    opzioni:
      - testo: "Affrontare il custode e tirarli fuori tutti"
        descrizione: "La macchina e la brina insieme, e se vinci in fretta li porti su quasi tutti."
        combattimento: raschiatori-camera-del-gelo
        vittoria:
          titolo: Tutti
          testo: |
            Il custode si accascia e la nebbia gli esce tutta insieme dalle
            giunture. Stacchi i cristalli e la fiamma della ruota si spegne, e ne
            porti su quattro, perché il quinto era morto da prima che tu
            arrivassi.

            All'argano Nella non lascia la mano del fratello nemmeno quando il
            caposquadra viene a reclamarli.
          pe: { resistenza: 5 }
          imposta: { raschiatori.salvati: 3 }
          effetti: { fazione.raschiatori: 1, cristalli.cristallo-carico: 2, cella: 1, rep.raschiatori: 1 }
          vai: superficie-fratturata
        sconfitta:
          titolo: Uno
          testo: |
            Il custode ti butta contro la parete mentre Nella taglia la corda del
            fratello e se lo trascina verso la porta, e risalite in tre. Gli altri
            restano in piedi nella camera con gli occhi aperti, sotto la fiamma
            accesa della ruota.

            All'argano Nella non lascia la mano del fratello nemmeno quando il
            caposquadra viene a reclamarlo.
          imposta: { raschiatori.salvati: 1 }
          effetti: { fazione.raschiatori: 1, cristalli.cristallo-carico: 1, contaminazione: 1.5 }
          vai: superficie-fratturata
      - testo: "Staccare i cristalli dal soffitto senza svegliarlo"
        descrizione: "I cristalli tengono il freddo sulla cordata, e si staccano mentre la macchina gira dall'altra parte."
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Difficile }
        successo:
          titolo: I cristalli del soffitto
          testo: |
            Stacchi quattro cristalli con le dita fasciate prima che il custode si
            giri, e mentre Nella taglia le corde la fiamma della ruota si
            affievolisce senza spegnersi. Tre della cordata sono abbastanza vivi
            da risalire.

            All'argano Nella non lascia la mano del fratello nemmeno quando il
            caposquadra viene a reclamarli.
          pe: { tecnologia: 5 }
          imposta: { raschiatori.salvati: 2 }
          effetti: { fazione.raschiatori: 1, cristalli.cristallo-carico: 3, cella: 1, rep.raschiatori: 0.5 }
          vai: superficie-fratturata
        fallimento:
          titolo: Il cristallo che canta
          testo: |
            Il primo cristallo si stacca con un suono di bicchiere incrinato e il
            custode si gira. Tieni lontana la macchina con la lampada mentre Nella
            taglia la corda del fratello, e risalite in tre con la brina sotto la
            pelle delle mani, lasciando accesa la fiamma della ruota.

            All'argano Nella non lascia la mano del fratello nemmeno quando il
            caposquadra viene a reclamarlo.
          imposta: { raschiatori.salvati: 1 }
          effetti: { fazione.raschiatori: 1, cristalli.cristallo-carico: 1, contaminazione: 1.5, ferite: 1 }
          vai: superficie-fratturata
      - testo: "Fermare il custode con il congegno di Capomozzo"
        descrizione: "Il disco di Aurenne parla alla Salvaguardia, e forse anche a questa macchina."
        requisiti: [oggetto.congegno-di-controllo >= 1]
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Media }
        successo:
          titolo: La lingua delle macchine
          testo: |
            Davanti al congegno il custode si ferma a metà passo con una zampa
            sollevata, come un cane al fischio del padrone. Stacchi i cristalli
            con calma e la fiamma della ruota si spegne, e ne porti su quattro,
            perché il quinto era morto da prima che tu arrivassi.

            All'argano Nella non lascia la mano del fratello nemmeno quando il
            caposquadra viene a reclamarli.
          pe: { tecnologia: 5 }
          imposta: { raschiatori.salvati: 3 }
          effetti: { fazione.raschiatori: 1, cristalli.cristallo-carico: 2, cella: 1, rep.raschiatori: 1 }
          vai: superficie-fratturata
        fallimento:
          titolo: La lingua storpiata
          testo: |
            Il custode si ferma, ma per poco, poi si muove a scatti come un servo che ha
            capito metà di un ordine e ti gira intorno mentre lavori. Ne portate su tre,
            con la brina sulle mani e la fiamma della ruota affievolita.

            All'argano Nella non lascia la mano del fratello nemmeno quando il
            caposquadra viene a reclamarli.
          imposta: { raschiatori.salvati: 2 }
          effetti: { fazione.raschiatori: 1, cristalli.cristallo-carico: 1, cella: 1, tormento: 1 }
          vai: superficie-fratturata
      - testo: "Tagliare la corda del fratello e andare via subito"
        descrizione: "Uno lo porti su di sicuro, se non perdi tempo. Gli altri restano, e lo sai."
        costo: 2
        esito:
          titolo: Uno di sicuro
          testo: |
            Tagli la corda del fratello di Nella sopra il nodo e lei se lo carica
            in spalla prima che tu possa aiutarla. Il custode non vi insegue, e
            gli altri restano nella camera con gli occhi aperti sotto la fiamma
            accesa.

            All'argano Nella non lascia la mano del fratello nemmeno quando il
            caposquadra viene a reclamarlo.
          imposta: { raschiatori.salvati: 1 }
          effetti: { fazione.raschiatori: 1, cristalli.cristallo-carico: 1, tormento: 1.5 }
          vai: superficie-fratturata
