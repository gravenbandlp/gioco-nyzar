# La quest dei Raschiatori, passo 14 (fazione.raschiatori 13 → 14): la discesa dei Quattro nel primo strato del
# Labirinto di Darn-Morakh, dalle piattaforme dei Raschiatori e non dalla Strada Antica. Scendono Tenebra, Dragna,
# la tua squadra e tu; Argento resta all'argano. L'ingresso (`raschiatori-le-piattaforme-della-cicatrice`, ai
# Ponti) costa un rintocco in meno con lo Scandaglio. La ritirata riporta ai Ponti Sospesi.
# Le stanze vanno in fasce di profondità (una stanza superata non ricompare nella stessa visita):
# 0 la galleria raschiata (il gesso di tre generazioni) o le corde dei turni, 1 i corridoi che respirano (le luci
# viandanti) o la riorganizzazione, 2 i nidi di macchine o la sacca di Marea quasi solida (chi ha Contaminazione 6
# o più può prendere la Gola roca come i veterani), 3 il punto della Carta (Facile con la Carta) o il battito;
# la squadra dei cinque vale da 2 a 3 (le piastrine del padre di Stoppino, con ponti.lanterne).
# Il cuore a 4 è la camera dei quattro: le tre forme della Salvaguardia (boss). Le vie sono Difficili; chi perde
# viene trascinato fuori da Dragna mentre la fase si richiude, senza passo. Chi vince trova le quattro nicchie e il
# bracciale di Mirta Sorrin, ancora tiepido (raschiatori.bracciale-mirta).
aree:
  - id: raschiatori-primo-strato
    immagine: ambientazione/regno-profondo
    nome: Il primo strato
    sommario: "Il primo strato del Labirinto di Darn-Morakh, raschiato fino all'osso da tre generazioni di Raschiatori."
    spedizione: { ritorno: ponti-sospesi, soglia: 4, stanze: 3 }
    testo: |
      Il primo strato è una rete di gallerie di metallo fuso e cristallizzato dal Mana, raschiate fino all'osso dai picconi di tre
      generazioni. Tenebra cammina davanti con la lampada bassa e Dragna chiude la fila con l'ascia, mentre la Carta di Korith ti scalda la
      tasca.

storylet:
  # ------------------------------------------------------------ l'ingresso, ai Ponti
  - id: raschiatori-le-piattaforme-della-cicatrice
    presso: ponte-delle-mille-corde
    immagine: ambientazione/cicatrice-del-mondo
    titolo: Le piattaforme della Cicatrice
    sommario: "I Quattro scendono nel primo strato dalle piattaforme, in tre più te, con Argento all'argano."
    luogo: Ponti Sospesi, le piattaforme di scavo sull'orlo della Cicatrice
    area: ponti-sospesi
    requisiti: [fazione.raschiatori == 13]
    testo: |
      Le piattaforme dei Raschiatori pendono sull'orlo della Cicatrice come nidi di rondine, legate ai piloni con le catene, e da qui
      scendete con il permesso del Velo piegato nel panciotto di Argento. Lui siede sullo sgabello del freno con il bastone di cristallo
      acceso contro la ringhiera, mentre Tenebra controlla le lampade della squadra guardando a ognuno le mani prima della faccia.

      Nella ha il bracciale dei turni stretto al polso e ti guarda come guardava il pozzo. *In tre più me, come si è sempre fatto.* Dragna
      ti batte due volte i monconi sulla spalla.
    opzioni:
      - testo: "Scendere per primo lungo la corda"
        descrizione: "Chi porta lo Scandaglio scende per primo nei siti nuovi, e la fase della Fiamma nessuno la conosce."
        prova: { attributo: fisico, abilita: atletica, difficolta: Media }
        successo:
          titolo: Trenta braccia
          testo: |
            Le trenta braccia della prima corda passano sotto i guanti, e dal
            pianerottolo guardi la luce del bastone di Argento farsi piccola come
            una stella.
          pe: { atletica: 3 }
          vai: raschiatori-primo-strato
        fallimento:
          titolo: Il moschettone
          testo: |
            A metà della prima corda il moschettone si apre da solo, e resti
            appeso con una mano sola finché Dragna ferma la corda con lo stivale.
            Al pianerottolo te lo richiude senza dire niente.
          effetti: { ferite: 0.5 }
          vai: raschiatori-primo-strato
      - testo: "Rifare con Argento il controllo dell'argano"
        descrizione: "La sera prima l'ha fatto Dragna, e la mattina lo rifà chi resta di sopra."
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Media }
        successo:
          titolo: La catena
          testo: |
            Alla quarantesima maglia ne trovi una incrinata, sottile come un
            capello, e Argento la cambia borbottando prima di liberare il freno.
          pe: { tecnologia: 3 }
          vai: raschiatori-primo-strato
        fallimento:
          titolo: Tutto a posto
          testo: |
            Le catene ti sembrano tutte buone, ma a metà discesa una maglia cede e
            la piattaforma scende di un braccio con uno strattone che vi butta
            contro la ringhiera, prima di tenere.
          effetti: { ferite: 0.5 }
          vai: raschiatori-primo-strato
      - testo: "Mandare avanti lo Scandaglio"
        descrizione: "Nel Labirinto il vuoto è dappertutto, ma quello buono fa vibrare il cristallo più forte."
        requisiti: [chiave.scandaglio >= 1]
        costo: 0
        esito:
          titolo: La nota buona
          testo: |
            Lo Scandaglio canta una nota sola dritta verso il basso e la segui
            senza fermarti, e Tenebra alza un sopracciglio, che da lui vale un
            applauso.
          vai: raschiatori-primo-strato
      - testo: "Lasciar scendere per primi Tenebra e Dragna"
        descrizione: "Sono scesi più volte di tutti voi messi insieme, e dietro di loro si impara."
        costo: 2
        esito:
          titolo: Dietro di loro
          testo: |
            Tenebra e Dragna si fermano a ogni pianerottolo a contare le teste e
            ripartono senza fretta, e in fondo hai le spalle dure come legno.
          effetti: { tormento: 1 }
          vai: raschiatori-primo-strato

  # ------------------------------------------------------------ 0 · la galleria e le corde
  - id: raschiatori-strato-la-galleria-raschiata
    immagine: ambientazione/regno-profondo
    titolo: La galleria raschiata
    sommario: "Una galleria raschiata fino all'osso, con i segni di gesso di tre generazioni di Raschiatori sulle pareti."
    luogo: Il primo strato, la galleria dei turni
    area: raschiatori-primo-strato
    ripetibile: true
    requisiti: [fazione.raschiatori == 13, profondita.raschiatori-primo-strato == 0]
    testo: |
      Sulle pareti della galleria dei turni ci sono i segni di gesso di tre
      generazioni di Raschiatori, le frecce dei vecchi entrate nel metallo e
      quelle di adesso ancora bianche. Tenebra passa il dito su un nome con
      una data, sotto cui qualcuno ha scritto *tornato*.

      {accademiche Media} Le frecce più vecchie puntano tutte verso il basso,
      quelle recenti verso l'uscita.
    opzioni:
      - testo: "Leggere le frecce dei vecchi"
        descrizione: "Le frecce entrate nel metallo sono di quando si scendeva più in basso."
        prova: { attributo: mentale, abilita: [accademiche, percezione], difficolta: Media }
        successo:
          titolo: Le frecce entrate nel metallo
          testo: |
            Le frecce dei vecchi portano a un passaggio che le squadre di adesso non usano, e Tenebra ti dice a voce bassa che quella freccia
            l'ha fatta lui trent'anni fa.
          pe: { accademiche: 3 }
          effetti: { profondita.raschiatori-primo-strato: 1 }
        fallimento:
          titolo: Le frecce sbagliate
          testo: |
            Le frecce più bianche finiscono in un cerchio su un muro, e Dragna ti
            riporta indietro per la giubba senza dire niente.
          effetti: { tormento: 1 }
      - testo: "Aggiungere il tuo segno sulla parete"
        descrizione: "Il tuo nome con la data, e sotto lo spazio per chi scriverà *tornato*."
        prova: { attributo: sociale, abilita: espressivita, difficolta: Facile }
        successo:
          titolo: Lo spazio sotto il nome
          testo: |
            Scrivi il tuo nome e la data, e Dragna ci disegna accanto una lanterna piccola con la fiamma dritta. La squadra fa lo stesso, e Nella
            scrive il suo nome con le lettere che le hai insegnato tu.
          pe: { espressivita: 2 }
          effetti: { profondita.raschiatori-primo-strato: 1, rep.raschiatori: 0.5 }
        fallimento:
          titolo: Il gesso che si spezza
          testo: |
            Il gesso ti si spezza in mano alla seconda lettera e sparisce in una
            crepa, e il nome resta a metà mentre Dragna ti guarda.
          effetti: { tormento: 1 }
      - testo: "Seguire Dragna senza guardare le pareti"
        descrizione: "Dragna conosce la galleria a memoria, e tu le stai dietro."
        costo: 2
        esito:
          titolo: La schiena di Dragna
          testo: |
            Segui la schiena di Dragna senza guardare le pareti, e arrivi in fondo senza sapere bene da dove sei passato.
          effetti: { profondita.raschiatori-primo-strato: 1, tormento: 1 }

  - id: raschiatori-strato-le-corde-dei-turni
    immagine: ambientazione/cicatrice-del-mondo
    titolo: Le corde dei turni
    sommario: "Un pozzo verticale con le corde dei turni di altri anni, alcune marce dentro."
    luogo: Il primo strato, il pozzo delle corde
    area: raschiatori-primo-strato
    ripetibile: true
    requisiti: [fazione.raschiatori == 13, profondita.raschiatori-primo-strato == 0]
    testo: |
      Dall'orlo di un pozzo verticale pendono nel buio decine di corde dei turni di
      altri anni, alcune con i nodi dei vecchi e altre con il gancio della Compagnia,
      e Dragna ne prova una con la mano prima di sceglierne un'altra.

      {tecnologia Media} La Marea mangia le corde nuove dal cuore, e quelle vecchie
      si riconoscono dal colore.
    opzioni:
      - testo: "Scegliere la corda buona"
        descrizione: "Una corda si legge come una faccia."
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Media }
        successo:
          titolo: La corda vecchia
          testo: |
            La corda vecchia e scura che scegli tiene tutti, e in fondo Dragna ti
            dice che quel nodo lo faceva la Fiamma prima di Mirta.
          pe: { tecnologia: 3 }
          effetti: { profondita.raschiatori-primo-strato: 1 }
        fallimento:
          titolo: La corda marcia
          testo: |
            A metà discesa senti le fibre della corda nuova cedere sotto i guanti,
            e risali a forza di braccia un momento prima che si spezzi e sparisca
            nel buio.
          effetti: { ferite: 0.5, tormento: 1 }
      - testo: "Scendere con la tua corda, piantando i chiodi"
        descrizione: "La tua corda la conosci, e i chiodi li pianti tu."
        prova: { attributo: fisico, abilita: atletica, difficolta: Media }
        successo:
          titolo: I chiodi
          testo: |
            Ti cali con la tua corda piantando chiodi per chi viene dopo, e in
            fondo hai le braccia che tremano mentre la squadra scende sui tuoi
            chiodi.
          pe: { atletica: 3 }
          effetti: { profondita.raschiatori-primo-strato: 1 }
        fallimento:
          titolo: Il chiodo che salta
          testo: |
            Il secondo chiodo salta con un rumore di frusta, e Tenebra ti rimette sull'orlo tirandoti per la cinghia senza
            sforzo.
          effetti: { ferite: 0.5 }
      - testo: "Aspettare che scenda Tenebra e seguirlo"
        descrizione: "Tenebra sceglie la corda senza toccarla, e dietro di lui si scende lenti."
        costo: 2
        esito:
          titolo: La corda di Tenebra
          testo: |
            Tenebra scende per primo su una corda scelta con gli occhi e si ferma a ogni nodo, e in fondo il ronzio ti è entrato nei denti.
          effetti: { profondita.raschiatori-primo-strato: 1, tormento: 1 }

  # ------------------------------------------------------------ 1 · i corridoi che respirano e la riorganizzazione
  - id: raschiatori-strato-le-luci-viandanti
    immagine: ambientazione/regno-profondo
    titolo: I corridoi che respirano
    sommario: "Due luci camminano davanti a voi con il vostro passo, e si fermano quando vi fermate."
    luogo: Il primo strato, i corridoi che respirano
    area: raschiatori-primo-strato
    ripetibile: true
    requisiti: [fazione.raschiatori == 13, profondita.raschiatori-primo-strato == 1]
    testo: |
      Le pareti di questo tratto si gonfiano appena, come il fianco di una bestia addormentata. A dieci passi camminano due luci con il vostro
      passo, e quando Tenebra alza la mano per fermarvi la alzano anche loro.

      {magia Difficile} Le luci sono buchi nel Mana del corridoio, a forma di passo.
    opzioni:
      - testo: "Spegnerle"
        descrizione: "Due luci che tagliano, ma voi siete di più."
        combattimento: raschiatori-luci-viandanti
        vittoria:
          titolo: Il buio giusto
          testo: |
            Le luci si spengono una dopo l'altra con un rumore di vetro incrinato, e le pareti smettono di
            gonfiarsi.
          effetti: { profondita.raschiatori-primo-strato: 1 }
        sconfitta:
          titolo: Il taglio
          testo: |
            Una luce ti passa attraverso il braccio e lo apre in un taglio lungo
            che non sanguina subito, e la squadra si ritira fino alle corde.
      - testo: "Camminare con un altro passo"
        descrizione: "Se imitano il passo, si cambia passo tutti insieme."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Media }
        successo:
          titolo: Un altro passo
          testo: |
            La squadra ti segue con tre passi lenti e uno svelto, come sui Ponti quando c'è vento, e le luci sbagliano il passo finché restano indietro.
          pe: { resilienza: 3 }
          effetti: { profondita.raschiatori-primo-strato: 1 }
        fallimento:
          titolo: Il passo che torna
          testo: |
            Dopo un poco cammini di nuovo con il passo delle luci senza averlo
            deciso, finché Tenebra ti ferma per la spalla. Hai la gola secca e un
            ricordo in meno.
          effetti: { tormento: 1.5 }
      - testo: "Spegnere le lampade e aspettare"
        descrizione: "Al buio le luci non hanno niente da imitare, se si stancano prima di voi."
        costo: 2
        esito:
          titolo: Al buio
          testo: |
            Restate fermi al buio a lungo, finché le luci si spengono. Quando riaccendi
            la lampada hai le mani fredde e la sensazione che qualcuno ti abbia guardato
            da vicino.
          effetti: { profondita.raschiatori-primo-strato: 1, tormento: 1 }

  - id: raschiatori-strato-la-riorganizzazione
    immagine: ambientazione/rovine-dei-precursori
    titolo: La riorganizzazione
    sommario: "Il Labirinto si muove, e i corridoi scorrono come cassetti."
    luogo: Il primo strato, una giunzione
    area: raschiatori-primo-strato
    ripetibile: true
    requisiti: [fazione.raschiatori == 13, profondita.raschiatori-primo-strato == 1]
    testo: |
      A una giunzione il pavimento si muove e i corridoi scivolano uno sull'altro come i cassetti di un mobile, finché dove c'era un passaggio c'è
      un muro. Tenebra grida di tenervi per la cintura, alzando la voce per la prima volta da quando lo conosci.

      {resilienza Difficile} Chi esce vivo da una riorganizzazione di solito non se la ricorda, e conviene tenere a mente una cosa sola.
    opzioni:
      - testo: "Tenere a mente una cosa sola e attraversare"
        descrizione: "Il nome di Mirta, o quello di Nella, ripetuto finché il Labirinto si ferma."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Difficile }
        successo:
          titolo: Un nome
          testo: |
            Ripeti a mezza voce il nome di Mirta Sorrin mentre il corridoio ti scorre intorno, e quando il pavimento si ferma siete tutti dall'altra parte e ricordi ogni cosa.
          pe: { resilienza: 5 }
          effetti: { profondita.raschiatori-primo-strato: 1, rep.raschiatori: 0.5 }
        fallimento:
          titolo: Dall'altra parte
          testo: |
            Il nome ti scappa a metà, e ti ritrovi seduto in un corridoio che non
            conosci con Dragna che ti dà schiaffi leggeri. La squadra è con te, e
            Nella piange senza far rumore.
          effetti: { tormento: 1.5 }
      - testo: "Leggere il movimento dei corridoi"
        descrizione: "I cassetti scorrono in un ordine, e c'è un momento giusto per passare."
        prova: { attributo: mentale, abilita: percezione, difficolta: Media }
        successo:
          titolo: Il vuoto giusto
          testo: |
            I corridoi si fermano uno dopo l'altro per il tempo di contare fino a due,
            e al terzo arresto gridi e passate nel vuoto prima che si richiuda.
          pe: { percezione: 3 }
          effetti: { profondita.raschiatori-primo-strato: 1 }
        fallimento:
          titolo: Il cassetto che si chiude
          testo: |
            Gridi troppo presto e il vuoto si chiude davanti a te, a un dito dallo
            stivale, e aspettate che il Labirinto si fermi per tornare alle corde.
          effetti: { ferite: 0.5, tormento: 1 }
      - testo: "Tenersi tutti per la cintura e aspettare che finisca"
        descrizione: "Ci si tiene stretti senza muoversi, e il Labirinto fa quello che vuole."
        costo: 2
        esito:
          titolo: La catena
          testo: |
            Vi tenete per la cintura a occhi chiusi, e quando il pavimento si ferma siete in un corridoio più in basso. Nessuno ricorda il mezzo, ma il conto delle teste torna.
          effetti: { profondita.raschiatori-primo-strato: 1, tormento: 1.5 }

  # ------------------------------------------------------------ 2 · i nidi e la sacca di Marea
  - id: raschiatori-strato-i-nidi
    immagine: bestiario/salvaguardia-precursori
    titolo: I nidi di macchine
    sommario: "Le macchine della Salvaguardia hanno fatto il nido in una sala bassa, e due sono sveglie."
    luogo: Il primo strato, la sala dei nidi
    area: raschiatori-primo-strato
    ripetibile: true
    requisiti: [fazione.raschiatori == 13, profondita.raschiatori-primo-strato == 2]
    testo: |
      Sulle pareti della sala bassa ci sono i nidi, grumi di metallo fuso
      grandi come botti, e da due escono due macchine della Salvaguardia
      dalle zampe sottili, con una luce sola al posto della testa. Dragna
      alza l'ascia e aspetta il tuo cenno.

      {armi-da-mischia Media} Sono svelte, e conviene entrare tutti insieme.
    opzioni:
      - testo: "Entrare tutti insieme e colpire per primi"
        descrizione: "Due macchine svelte, e una squadra che entra al tuo cenno."
        combattimento: raschiatori-nidi
        vittoria:
          titolo: I nidi vuoti
          testo: |
            Le due macchine finiscono a terra, e nei nidi che Dragna rompe con l'ascia trovate due cristalli carichi.
          effetti: { profondita.raschiatori-primo-strato: 1, cristalli.cristallo-carico: 1 }
        sconfitta:
          titolo: Fuori dalla sala
          testo: |
            Le macchine ti si chiudono addosso prima che tu abbia finito di
            entrare, e la squadra ti trascina fuori per la giubba.
      - testo: "Passare lungo la parete senza svegliare gli altri nidi"
        descrizione: "Le due sveglie sono lente a girarsi, e la parete opposta è libera."
        prova: { attributo: fisico, abilita: furtivita, difficolta: Media }
        successo:
          titolo: Lungo la parete
          testo: |
            Passate lungo la parete opposta con le lampade coperte mentre le
            macchine guardano dove eravate prima, e Tenebra ti fa un cenno piccolo
            con il mento.
          pe: { furtivita: 3 }
          effetti: { profondita.raschiatori-primo-strato: 1 }
        fallimento:
          titolo: Il nido sveglio
          testo: |
            Qualcuno urta un nido che si sveglia con un ronzio, e tornate indietro
            di corsa con la manica di Dragna aperta da una zampa.
          effetti: { ferite: 0.5 }
      - testo: "Aspettare che le macchine tornino nei nidi"
        descrizione: "Escono a guardare e poi rientrano, e si aspetta al buio."
        costo: 2
        esito:
          titolo: Il ritorno nei nidi
          testo: |
            Quando le macchine rientrano nei nidi passate piano in fila, con il ronzio che vi accompagna come una pentola lasciata sul
            fuoco.
          effetti: { profondita.raschiatori-primo-strato: 1, tormento: 1 }

  - id: raschiatori-strato-la-sacca-di-marea
    immagine: ambientazione/marea-grigia
    titolo: La sacca di Marea
    sommario: "In un avvallamento la Marea Grigia è fitta come acqua, e si muove contro corrente."
    luogo: Il primo strato, un avvallamento
    area: raschiatori-primo-strato
    ripetibile: true
    requisiti: [fazione.raschiatori == 13, profondita.raschiatori-primo-strato == 2]
    testo: |
      Nell'avvallamento la Marea Grigia forma una pozza lattiginosa alta fino alle ginocchia, che si increspa verso di te quando ti avvicini. Dragna si tocca la gola senza accorgersene, con la voce
      roca che il Labirinto lascia ai veterani.

      {natura Media} Qui la Marea è quasi solida, e il campo del bracciale ronza già a vuoto.
    opzioni:
      - testo: "Attraversare svelti con il campo del bracciale acceso"
        descrizione: "Il bracciale regge, se non ci si ferma."
        prova: { attributo: fisico, abilita: resistenza, difficolta: Media }
        successo:
          titolo: La corsa
          testo: |
            Attraversate di corsa con il campo dei bracciali che ronza forte, e
            dall'altra parte il grigio ti resta sui calzoni come fango secco.
          pe: { resistenza: 3 }
          effetti: { profondita.raschiatori-primo-strato: 1, contaminazione: 1 }
        fallimento:
          titolo: Il bracciale che cede
          testo: |
            A metà il campo del bracciale cede e la Marea ti sale alla vita, e
            quando Nella ti tira fuori hai sotto la lingua il sapore di ferro che
            i veterani chiamano il saluto.
          effetti: { contaminazione: 1.5 }
      - testo: "Trovare il guado dove la Marea è più bassa"
        descrizione: "Una pozza si legge come un fiume."
        prova: { attributo: mentale, abilita: natura, difficolta: Media }
        successo:
          titolo: Il guado
          testo: |
            Dove la superficie si increspa di meno la Marea è più bassa, e passate
            con la Marea alle caviglie.
          pe: { natura: 3 }
          effetti: { profondita.raschiatori-primo-strato: 1 }
        fallimento:
          titolo: Il punto fondo
          testo: |
            Il punto che hai scelto è il più fondo, e ti tirano fuori in due con
            la Marea al petto.
          effetti: { contaminazione: 1.5, tormento: 1 }
      - testo: "Lasciare che la Marea ti prenda la voce"
        descrizione: "Chi ha già tanta Marea addosso può pagare il passaggio con la voce, come i veterani."
        quando: [contaminazione >= 6]
        esito:
          titolo: La voce dei veterani
          testo: |
            Lasci che la Marea ti entri in bocca, con il sapore del ferro e della
            pioggia, e dall'altra parte la Contaminazione ti è scivolata via dalla
            pelle. La voce ti esce roca per sempre, e Dragna ride davvero per la
            prima volta.
          imposta: { contaminazione: 3 }
          effetti: { profondita.raschiatori-primo-strato: 1, mutazione.gola-roca: 1 }
      - testo: "Ascoltare la Marea come si ascolta il Bosco"
        descrizione: "Al Circolo ti hanno insegnato ad ascoltare la Marea, che dove è bassa si muove più piano."
        quando: [origine.figlio-del-circolo >= 1]
        esito:
          titolo: Il punto basso
          testo: |
            Ascolti accucciato sull'orlo, come al Circolo prima di entrare in una
            radura, e trovi il punto dove la Marea respira più piano. Passate lì
            con la Marea alle caviglie, e Tenebra ti guarda le mani.
          pe: { natura: 3 }
          effetti: { profondita.raschiatori-primo-strato: 1 }
      - testo: "Fare il giro per il corridoio di sopra"
        descrizione: "Il corridoio di sopra è più lungo e più stretto, e scende dall'altra parte."
        costo: 2
        esito:
          titolo: Il giro di sopra
          testo: |
            Il corridoio di sopra si piega più volte su se stesso, e quando passa sopra la pozza senti il freddo della Marea salire dalle grate.
          effetti: { profondita.raschiatori-primo-strato: 1, contaminazione: 1 }

  # ------------------------------------------------------------ 2–3 · la squadra dei cinque
  - id: raschiatori-strato-la-squadra-dei-cinque
    immagine: ambientazione/regno-profondo
    titolo: La squadra dei cinque
    sommario: "In un corridoio laterale ci sono cinque Raschiatori seduti contro la parete, legati alla stessa corda, da quattro inverni."
    luogo: Il primo strato, un corridoio laterale
    area: raschiatori-primo-strato
    ripetibile: true
    requisiti: [fazione.raschiatori == 13, profondita.raschiatori-primo-strato >= 2, profondita.raschiatori-primo-strato <= 3]
    testo: |
      Cinque Raschiatori siedono contro la parete, ancora legati alla stessa
      corda, con le piastrine di latta appese al collo. Dragna si toglie il
      berretto, e Tenebra dice a mezza voce cinque nomi senza sbagliarne uno.

      {empatia Media} Si sono seduti insieme, legati, per non perdersi.
    opzioni:
      - testo: "Prendere le piastrine e portarle su"
        descrizione: "Le piastrine si riportano su, perché al Ponte dei Morti qualcuno smetta di aspettare."
        prova: { attributo: sociale, abilita: empatia, difficolta: Media }
        successo:
          titolo: Cinque piastrine
          testo: |
            Sfili le piastrine una per una con le scuse che si fanno ai morti e le
            metti in un fazzoletto sopra il cuore, mentre Tenebra annuisce.
          pe: { empatia: 3 }
          imposta: { raschiatori.piastrine: 1 }
          effetti: { profondita.raschiatori-primo-strato: 1, rep.raschiatori: 0.5 }
        fallimento:
          titolo: Lo spago
          testo: |
            Lo spago della prima piastrina si rompe, e le mani ti tremano tanto
            che Nella deve aiutarti a cercarla nella polvere. Le altre quattro le
            lasci prendere a lei.
          imposta: { raschiatori.piastrine: 1 }
          effetti: { profondita.raschiatori-primo-strato: 1, tormento: 1 }
      - testo: "Cercare la piastrina del padre di Stoppino"
        descrizione: "Il bambino del Ponte dei Morti ha appeso una lanterna per uno di quei cinque."
        quando: [ponti.lanterne >= 1]
        esito:
          titolo: La lanterna del bambino
          testo: |
            Sulla terza piastrina c'è il nome che Stoppino ti ha detto una notte
            sul Ponte, e quella la tieni in un fazzoletto a sé.
          pe: { empatia: 3 }
          imposta: { raschiatori.piastrine: 1 }
          effetti: { profondita.raschiatori-primo-strato: 1, rep.raschiatori: 0.5, rep.ponti: 1 }
      - testo: "Lasciarli dove sono e proseguire"
        descrizione: "Sono insieme, e stanno bene così. Le piastrine resteranno con loro."
        costo: 2
        esito:
          titolo: Insieme
          testo: |
            Li lasciate insieme, e Nella mette accanto al primo la sua lampada di riserva accesa, che vedi brillare alle vostre spalle finché
            la curva la nasconde.
          effetti: { profondita.raschiatori-primo-strato: 1, tormento: 1 }

  # ------------------------------------------------------------ 3 · il punto della Carta e il battito
  - id: raschiatori-strato-il-punto-della-carta
    immagine: ambientazione/rovine-dei-precursori
    titolo: Il punto della Carta
    sommario: "La Carta di Korith si scalda in tasca, vicino al punto dove si apre la fase della Fiamma."
    luogo: Il primo strato, una sala a otto lati
    area: raschiatori-primo-strato
    ripetibile: true
    requisiti: [fazione.raschiatori == 13, profondita.raschiatori-primo-strato == 3]
    testo: |
      Nella sala a otto lati, con otto porte uguali, la Carta di Korith ti
      scalda la tasca. Sotto il vetro le quattro disposizioni si danno il
      cambio, e quella sotto il segno della fiamma resta accesa più a lungo,
      mentre Tenebra la guarda sopra la tua spalla, sorpreso per la prima
      volta.

      {tecnologia Media} Quando la disposizione della fiamma si accende, una
      delle otto porte si accende con lei.
    opzioni:
      - testo: "Leggere la Carta e trovare la porta"
        descrizione: "Con la Carta in mano, la porta giusta si accende. Bisogna esserci quando succede."
        requisiti: [chiave.korith >= 1]
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Facile }
        successo:
          titolo: La porta accesa
          testo: |
            Quando la disposizione della fiamma si accende una delle porte si
            illumina appena sul bordo, e la squadra passa prima che si spenga.
          pe: { tecnologia: 3 }
          effetti: { profondita.raschiatori-primo-strato: 1 }
        fallimento:
          titolo: La porta spenta
          testo: |
            Quando alzi gli occhi dalla Carta la porta si è già spenta, e
            aspettate un altro giro con il ronzio nelle ossa.
          effetti: { tormento: 1 }
      - testo: "Provare le porte una per una"
        descrizione: "Otto porte, e una è quella giusta. Le altre sette portano altrove."
        prova: { attributo: mentale, abilita: percezione, difficolta: Media }
        successo:
          titolo: La quinta porta
          testo: |
            Guardi dentro ogni porta senza entrare, e la quinta ha l'aria più
            calda, con un corridoio che scende.
          pe: { percezione: 3 }
          effetti: { profondita.raschiatori-primo-strato: 1 }
        fallimento:
          titolo: La terza porta
          testo: |
            Entri nella terza porta e il corridoio si richiude alle tue spalle, e ti ritrovi nella sala dalla parte opposta, con la squadra
            che ti guarda arrivare.
          effetti: { tormento: 1.5 }
      - testo: "Lasciare che sia Tenebra a scegliere"
        descrizione: "Tenebra è sceso qui più volte di chiunque. Sceglie lui, e tu lo segui."
        costo: 2
        esito:
          titolo: La scelta di Tenebra
          testo: |
            Tenebra guarda a lungo le otto porte e ne sceglie una senza dire perché, e nel corridoio che scende il cuore ti batte allo stesso
            tempo del ronzio.
          effetti: { profondita.raschiatori-primo-strato: 1, tormento: 1 }

  - id: raschiatori-strato-il-battito
    immagine: ambientazione/regno-profondo
    titolo: Il battito
    sommario: "Più giù il ronzio diventa un battito lento che si sente nelle ossa, e le lampade pulsano con lui."
    luogo: Il primo strato, il corridoio che scende
    area: raschiatori-primo-strato
    ripetibile: true
    requisiti: [fazione.raschiatori == 13, profondita.raschiatori-primo-strato == 3]
    testo: |
      Più giù il ronzio diventa un battito lento e irregolare, e le lampade pulsano con lui insieme alla corda di segnale che sale
      all'argano. Tenebra si ferma e tende l'orecchio, e Dragna gli mette una mano sul braccio.

      {resilienza Media} Il cuore vuole andargli dietro, e va lasciato battere per conto suo.
    opzioni:
      - testo: "Tenere il proprio battito"
        descrizione: "Il cuore è tuo, e lo si tiene contando finché il corridoio finisce."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Media }
        successo:
          titolo: Il tuo cuore
          testo: |
            Conti fino a quattro, a mezza voce con la squadra, e il cuore torna tuo. In fondo al corridoio c'è una porta bassa,
            e dietro la porta il battito si ferma.
          pe: { resilienza: 3 }
          effetti: { profondita.raschiatori-primo-strato: 1 }
        fallimento:
          titolo: Il cuore che va dietro
          testo: |
            Il cuore ti scappa dietro al battito, e Dragna ti fa sedere con la
            testa fra le ginocchia finché torna a battere per conto suo.
          effetti: { tormento: 1.5 }
      - testo: "Seguire il battito fino alla sorgente"
        descrizione: "Il battito viene da qualche parte, e lì c'è la camera dei quattro."
        prova: { attributo: mentale, abilita: [magia, percezione], difficolta: Media }
        successo:
          titolo: La sorgente
          testo: |
            Segui con le dita il metallo che vibra più forte fino a una porta
            bassa, e dietro la porta il battito si ferma di colpo.
          pe: { magia: 3 }
          effetti: { profondita.raschiatori-primo-strato: 1 }
        fallimento:
          titolo: Più giù
          testo: |
            Il battito ti porta più giù del dovuto, finché Tenebra ti ferma con
            una mano sul petto, e per il resto della discesa lo senti dietro lo
            sterno.
          effetti: { tormento: 1.5 }
      - testo: "Tapparsi le orecchie e camminare"
        descrizione: "Con le orecchie tappate il battito si sente lo stesso, ma meno."
        costo: 2
        esito:
          titolo: Le orecchie tappate
          testo: |
            Il battito ti arriva lo stesso, dalle ossa dei piedi, e quando passi
            la porta bassa in fondo ti accorgi che stai piangendo senza motivo.
          effetti: { profondita.raschiatori-primo-strato: 1, tormento: 1 }

  # ------------------------------------------------------------ il cuore · la camera dei quattro
  - id: raschiatori-la-camera-dei-quattro
    immagine: bestiario/salvaguardia-precursori
    titolo: La camera dei quattro
    sommario: "Una camera rotonda con quattro nicchie, e davanti tre forme della Salvaguardia che si svegliano."
    luogo: Il primo strato, la camera dei quattro
    area: raschiatori-primo-strato
    requisiti: [fazione.raschiatori == 13, profondita.raschiatori-primo-strato >= 4]
    testo: |
      Dietro la porta bassa c'è una camera rotonda con quattro nicchie nella parete di fondo, ognuna sotto uno dei segni della ruota. Tre segni sono spenti, e sopra la quarta nicchia la fiamma è accesa
      della luce azzurra e fredda del Pozzo.

      Davanti alle nicchie stanno tre forme della Salvaguardia, che si svegliano insieme quando entri. La prima, un ragno a sei zampe, ha il corpo basso di una cassa. La seconda è un torso senza gambe
      coperto di spine, la terza una figura alta con la testa girata all'indietro e le ginocchia piegate al contrario.

      {rissa Media} La figura ruotata colpisce prima che tu capisca da dove arriva, e va presa per prima.

      {resilienza Difficile} Si sono svegliate con la fase della fiamma, e torneranno a dormire quando la luce azzurra si spegne.

      Dragna si mette alla tua sinistra con l'ascia e Tenebra alla tua destra. *Tre titoli intorno a me, e il quarto posto oggi è il mio.* Nella, dietro di te, ha già acceso la lampada di riserva.
    opzioni:
      - testo: "Affrontare le tre forme con i Quattro"
        descrizione: "Dragna e Tenebra ai tuoi fianchi, mentre la luce azzurra si consuma."
        combattimento: raschiatori-camera-dei-quattro
        vittoria:
          titolo: Le quattro nicchie
          testo: |
            L'ultima forma cade davanti alla quarta nicchia. Nelle prime tre ci sono tre
            bracciali di rame anneriti come quelli dei Quattro, nella quarta quello di
            Mirta Sorrin, ancora tiepido, con il nome sulla fibbia. Oltre la camera la
            Strada Antica scende verso il battito.

            Dragna ti tiene per la giubba finché la luce azzurra si spegne, poi risalite
            contando le teste a ogni pianerottolo.
          pe: { resilienza: 5, armi-da-mischia: 5 }
          imposta: { raschiatori.bracciale-mirta: 1 }
          effetti: { fazione.raschiatori: 1, cristalli.cristallo-carico: 3, rep.raschiatori: 1 }
          vai: ponti-sospesi
        sconfitta:
          titolo: La fase che si chiude
          testo: |
            La figura ruotata ti colpisce alle spalle mentre guardi il ragno, e
            Dragna ti trascina fuori mentre Tenebra copre la ritirata. Risalite
            senza il bracciale di Mirta.
          vai: ponti-sospesi
      - testo: "Chiudere la fase con la Carta di Korith"
        descrizione: "Se fai girare la Carta prima del tempo la fase si chiude e le forme si fermano, purché le dita restino ferme."
        requisiti: [chiave.korith >= 1]
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Difficile }
        successo:
          titolo: La disposizione girata
          testo: |
            Giri la disposizione della Carta con il pollice, una tacca alla volta,
            finché la fiamma sotto il vetro si spegne e le tre forme si
            accucciano. Nelle prime tre nicchie ci sono tre bracciali di rame
            anneriti, nella quarta quello di Mirta Sorrin, ancora tiepido.

            Dragna ti tiene per la giubba finché la luce azzurra si spegne, poi
            risalite contando le teste a ogni pianerottolo.
          pe: { tecnologia: 5, resilienza: 5 }
          imposta: { raschiatori.bracciale-mirta: 1 }
          effetti: { fazione.raschiatori: 1, cristalli.cristallo-carico: 2, rep.raschiatori: 1 }
          vai: ponti-sospesi
        fallimento:
          titolo: La disposizione che scappa
          testo: |
            La disposizione gira troppo e salta la fiamma, e le tre forme ti
            vengono addosso. Dragna ti trascina fuori, e risalite senza il
            bracciale di Mirta.
          effetti: { ferite: 2, tormento: 1.5 }
          vai: ponti-sospesi
      - testo: "Ordinare alle forme di fermarsi"
        descrizione: "La formula del Comando parla alla Salvaguardia nella sua lingua, con una sola voce per tre."
        incantesimo: comando
        prova: { attributo: mentale, abilita: magia, difficolta: Difficile }
        successo:
          titolo: Una sola voce
          testo: |
            La formula ti esce di bocca in una lingua straniera, e le tre forme si accucciano davanti alle nicchie ad aspettare un altro
            ordine. Nelle prime tre nicchie ci sono tre bracciali di rame anneriti, e nella quarta quello di Mirta Sorrin, con il nome
            sulla fibbia, ancora tiepido.

            Dragna ti tiene per la giubba finché la luce azzurra si spegne, poi risalite contando le teste a ogni pianerottolo.
          pe: { magia: 5, resilienza: 5 }
          imposta: { raschiatori.bracciale-mirta: 1 }
          effetti: { fazione.raschiatori: 1, cristalli.cristallo-carico: 2, rep.raschiatori: 1 }
          vai: ponti-sospesi
        fallimento:
          titolo: Tre voci
          testo: |
            Le tre forme ti rispondono con tre voci che ti entrano nella testa, e
            Dragna ti trascina fuori in ginocchio mentre la luce azzurra si
            spegne. Risalite senza il bracciale di Mirta, e per giorni senti
            quelle voci a occhi chiusi.
          effetti: { tormento: 1.5, ferite: 1 }
          vai: ponti-sospesi
