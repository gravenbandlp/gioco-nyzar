# I lavori e i servizi dei Raschiatori che si aprono con i gradi della quest (fazione.raschiatori), tutti al Grifone
# di Ferro tranne la paga del Gancio. Requisiti con >=, così la pista resta a 15 passi.
# - `raschiatori-il-magazzino-della-bacheca` (grado 1, passo 3): bende, unguento e celle; dal grado 3 al prezzo di
#   casa, dal grado 4 anche il Respiratore; al grado 5, a chi porta il titolo di Fiamma, la bacheca compra i
#   cristalli carichi al prezzo migliore. È uno storylet d'acquisto, come le reliquie: un negozio nuovo andrebbe
#   aggiunto all'area dei Ponti Sospesi, che è un file condiviso.
# - `raschiatori-un-turno-alla-gradinata` (grado 2, passo 6): il turno ripetibile alla Gradinata Cieca, una scena
#   sola senza stanze.
# - `raschiatori-guidare-la-squadra` (grado 3, passo 9, con raschiatori.squadra): la rendita in cristalli carichi.
# - `raschiatori-la-branda-dei-quattro` (grado 4, passo 12): l'alloggio gratuito al piano di sopra del Grifone.
# - `raschiatori-la-formula-del-filo` (grado 4, passo 12): Argento insegna il Filo di ritorno, letto sulla Carta di
#   Korith (Formule precuriane, livello 2: Magia 2, prova Media, due rintocchi, senza prezzo in monete).
# - `raschiatori-la-paga-del-gancio` (doppio gioco, passi 3-8, al Mercato dei Nodi): la paga di Merlach per chi ha
#   finto di accettarla, a prezzo della reputazione con i Raschiatori.
storylet:
  # ------------------------------------------------------------ grado 1 · il Magazzino della bacheca
  - id: raschiatori-il-magazzino-della-bacheca
    presso: grifone-di-ferro
    immagine: ambientazione/locanda-del-grifone-di-ferro
    titolo: Il Magazzino della bacheca
    sommario: "Dietro la bacheca chi ha il nome a inchiostro compra le scorte della corporazione."
    luogo: Locanda del Grifone di Ferro, lo sgabuzzino dietro la bacheca
    area: ponti-sospesi
    ripetibile: true
    requisiti: [fazione.raschiatori >= 3]
    testo: |
      Sugli scaffali dello sgabuzzino dietro la bacheca ci sono bende e
      unguenti in un ordine che conosce soltanto Argento, e in basso una
      cassetta di celle cariche. Brunella ti dà la chiave senza alzare gli
      occhi dalla zuppa.

      {conoscenze-della-strada Facile} Qui i prezzi Argento li fa per i
      suoi, e al Mercato dei Nodi le stesse cose costano di più.
    opzioni:
      - testo: "Comprare un rotolo di bende"
        descrizione: "Le bende della corporazione, tagliate a misura di braccio."
        requisiti: [fazione.raschiatori < 9, monete >= 8]
        costo: 0
        esito:
          titolo: Le bende
          testo: |
            Firmi il registro e lasci le monete nella scodella di latta accanto
            alla porta.
          effetti: { bende: 1, monete: -8 }
      - testo: "Comprare un rotolo di bende al prezzo di casa"
        descrizione: "Un caposquadra paga le bende quanto le paga la bacheca."
        requisiti: [fazione.raschiatori >= 9, monete >= 5]
        costo: 0
        esito:
          titolo: Il prezzo di casa
          testo: |
            Firmi nella colonna dei caposquadra, dove le cifre sono più piccole.
          effetti: { bende: 1, monete: -5 }
      - testo: "Comprare un vasetto di unguento"
        descrizione: "L'unguento di Brunella, che odora di menta e chiude i tagli in una notte."
        requisiti: [fazione.raschiatori < 9, monete >= 20]
        costo: 0
        esito:
          titolo: L'unguento
          testo: |
            Sul tappo di cera c'è la B storta di Brunella, e le monete finiscono
            nella scodella.
          effetti: { unguento: 1, monete: -20 }
      - testo: "Comprare un vasetto di unguento al prezzo di casa"
        descrizione: "Un caposquadra paga l'unguento quanto lo paga la bacheca."
        requisiti: [fazione.raschiatori >= 9, monete >= 14]
        costo: 0
        esito:
          titolo: L'unguento di casa
          testo: |
            Firmi nella colonna dei caposquadra, e Brunella dalla cucina ti grida
            di non sprecarlo sui graffi.
          effetti: { unguento: 1, monete: -14 }
      - testo: "Comprare una cella carica"
        descrizione: "Un piccolo cristallo carico, per i reperti che si scaricano proprio quando servono."
        requisiti: [fazione.raschiatori < 9, monete >= 30]
        costo: 0
        esito:
          titolo: La cella
          testo: |
            La cella ti ronza nel palmo come un'ape chiusa nel pugno, e la avvolgi
            in un fazzoletto.
          effetti: { cella: 1, monete: -30 }
      - testo: "Comprare una cella carica al prezzo di casa"
        descrizione: "Un caposquadra paga le celle quanto le paga la bacheca."
        requisiti: [fazione.raschiatori >= 9, monete >= 20]
        costo: 0
        esito:
          titolo: La cella di casa
          testo: |
            Firmi nella colonna dei caposquadra mentre la cella ti ronza nel
            palmo, e Argento dalla sala ti fa un cenno.
          effetti: { cella: 1, monete: -20 }
      - testo: "Comprare il Respiratore della bacheca"
        descrizione: "Una maschera di lega grigia che Argento vende soltanto ai veterani."
        requisiti: [fazione.raschiatori >= 12, oggetto.respiratore == 0, monete >= 120]
        costo: 0
        esito:
          titolo: La maschera grigia
          testo: |
            Argento tira giù la maschera con il bastone senza alzarsi, e ti avverte che va decifrata come le altre e
            che non ne ha un'altra.
          effetti: { oggetto.respiratore: 1, monete: -120 }
      - testo: "Vendere un cristallo carico al prezzo della Fiamma"
        descrizione: "I cristalli della Fiamma la bacheca li paga meglio di chiunque in città."
        requisiti: [fazione.raschiatori >= 15, raschiatori.fiamma == 1, cristalli.cristallo-carico >= 1]
        costo: 0
        esito:
          titolo: Il prezzo della Fiamma
          testo: |
            Argento te lo paga senza contrattare e sul registro scrive il tuo titolo al posto del nome.
          effetti: { cristalli.cristallo-carico: -1, monete: 35 }

  # ------------------------------------------------------------ grado 2 · il turno alla Gradinata
  - id: raschiatori-un-turno-alla-gradinata
    presso: grifone-di-ferro
    immagine: ambientazione/rovine-dei-precursori
    titolo: Un turno alla Gradinata
    sommario: "La Gradinata Cieca è dei Raschiatori per dieci anni, e il turno alle file è tuo."
    luogo: Locanda del Grifone di Ferro, poi la Gradinata Cieca
    area: ponti-sospesi
    ripetibile: true
    requisiti: [fazione.raschiatori >= 6]
    testo: |
      Sulla bacheca c'è un foglio con la grafia di Dragna, *Gradinata Cieca*
      in cima e sotto il tuo nome. Per dieci anni le file oltre l'ottavo
      gradino sono dei Raschiatori, finché il custode lo permette, e Pio
      Varre ti aspetta al bancone con il sacco del piombo in spalla.
    opzioni:
      - testo: "Scendere oltre l'ottavo gradino e lavorare alle file"
        descrizione: "Tre giorni di strada, e oltre l'ottavo gradino quello che il custode lascia prendere."
        costo: 2
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Media }
        successo:
          titolo: Le file
          testo: |
            Il custode vi lascia lavorare in cambio di una lampada vecchia, e Pio
            porta su fischiando due cristalli sterili e un frammento inciso.
          effetti: { cristalli.cristallo-sterile: 2, reliquie.frammento-inciso: 1, monete: 6, rep.raschiatori: 0.5 }
        fallimento:
          titolo: La rampa
          testo: |
            Sulla rampa ti si piega una caviglia, e Pio ti fa da stampella per
            tutto il ritorno.
          effetti: { cristalli.frammento-esausto: 2, ferite: 0.5, tormento: 1 }
      - testo: "Ricopiare le etichette delle file per Argento"
        descrizione: "Le etichette di metallo delle file sono un archivio, e Argento paga chi le ricopia."
        costo: 2
        prova: { attributo: mentale, abilita: [accademiche, percezione], difficolta: Media }
        successo:
          titolo: Le etichette
          testo: |
            Argento paga le pagine una per una, e una la tiene da parte senza
            dirti perché.
          effetti: { informazioni.segreto: 1, monete: 10, rep.raschiatori: 0.5 }
        fallimento:
          titolo: Le etichette che cambiano
          testo: |
            Le etichette cambiano mentre le ricopi, e Argento ti paga soltanto la
            carta.
          effetti: { monete: 3, tormento: 1 }
      - testo: "Mandare avanti lo Scandaglio"
        descrizione: "Con il cristallo davanti il turno costa meno fatica."
        requisiti: [chiave.scandaglio >= 1]
        prova: { attributo: mentale, abilita: percezione, difficolta: Facile }
        successo:
          titolo: La strada svelta
          testo: |
            Lo Scandaglio ti porta dritto alle file, e torni mezza giornata prima
            con un cristallo sterile e qualche scheggia.
          effetti: { cristalli.cristallo-sterile: 1, reliquie.scheggia: 2, monete: 4 }
        fallimento:
          titolo: Il cristallo confuso
          testo: |
            Lo Scandaglio vibra dappertutto allo stesso modo, e dopo la strada
            lunga torni con poco.
          effetti: { cristalli.frammento-esausto: 2 }

  # ------------------------------------------------------------ grado 3 · guidare la squadra
  - id: raschiatori-guidare-la-squadra
    presso: grifone-di-ferro
    immagine: fazioni/raschiatori
    titolo: Guidare la squadra
    sommario: "La tua squadra aspetta al tavolo lungo, e da te dipende chi scende e chi risale."
    luogo: Locanda del Grifone di Ferro, il tavolo lungo
    area: ponti-sospesi
    ripetibile: true
    requisiti: [fazione.raschiatori >= 9, raschiatori.squadra >= 1]
    testo: |
      La tua squadra ti aspetta al tavolo lungo vicino al camino. Nella ha già steso il foglio dei turni e tiene la penna senza
      intingerla, perché il turno lo decidi tu, e uno dei ragazzi tiene sotto il tavolo le mani fasciate da ieri.

      {empatia Media} Le nasconde perché ha paura che tu lo lasci a casa.
    opzioni:
      - testo: "Portarli alla Vena Storta e farli lavorare bene"
        descrizione: "Una vena buona e una squadra che sa il fatto suo, se dai gli ordini giusti."
        costo: 2
        prova: { attributo: sociale, abilita: [persuasione, intimidire], difficolta: Media }
        successo:
          titolo: Un turno buono
          testo: |
            Dai i turni alla corda come te li dava Gerardo e risalite dalla Vena Storta con un cristallo carico, contando le teste due volte,
            la seconda a voce alta.
          effetti: { cristalli.cristallo-carico: 1, cristalli.cristallo-sterile: 1, monete: 8, rep.raschiatori: 0.5 }
        fallimento:
          titolo: Il ragazzo con le mani fasciate
          testo: |
            Alla seconda ora le mani fasciate del ragazzo non lo reggono più, e il
            turno finisce presto, con poco nei sacchi e nessuna lanterna da
            comprare.
          effetti: { cristalli.cristallo-sterile: 1, tormento: 1 }
      - testo: "Scendere con loro e lavorare in prima fila"
        descrizione: "Un caposquadra che scava davanti agli altri non ha bisogno di dare ordini."
        costo: 2
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Media }
        successo:
          titolo: In prima fila
          testo: |
            La squadra ti tiene dietro senza ordini, e al Grifone Nella ti mette
            in mano davanti a tutti il cristallo carico che hai staccato tu.
          effetti: { cristalli.cristallo-carico: 1, monete: 6, rep.raschiatori: 0.5 }
        fallimento:
          titolo: Le braccia
          testo: |
            Alla terza ora le braccia ti mollano a mezza corda, e la squadra
            finisce il turno senza di te.
          effetti: { cristalli.cristallo-sterile: 1, ferite: 0.5 }
      - testo: "Lasciare la squadra a Nella per un turno"
        descrizione: "Un turno da sola fa bene a Nella, e a te dà una giornata di riposo."
        quando: [raschiatori.nella >= 2]
        costo: 1
        esito:
          titolo: Il turno di Nella
          testo: |
            Nella si stringe al petto il foglio dei turni, e la sera torna con la
            squadra intera e un cristallo sterile.
          effetti: { cristalli.cristallo-sterile: 1, monete: 4, tormento: -0.5 }

  # ------------------------------------------------------------ grado 4 · la branda dei Quattro
  - id: raschiatori-la-branda-dei-quattro
    presso: grifone-di-ferro
    immagine: ambientazione/locanda-del-grifone-di-ferro
    titolo: La branda dei Quattro
    sommario: "I Quattro pagano tutto l'anno una stanza al Grifone, e chi siede al loro tavolo ci dorme."
    luogo: Locanda del Grifone di Ferro, la stanza dei Quattro
    area: ponti-sospesi
    ripetibile: true
    requisiti: [fazione.raschiatori >= 12]
    testo: |
      La stanza dei Quattro ha quattro brande e una finestra sulla
      Cicatrice. Sulla porta c'è una lanterna disegnata col gesso al posto
      del nome di un animale, e sotto ogni branda una cassetta chiusa con un
      nome.

      {resistenza Facile} La branda è dura, e le ossa la ringraziano lo
      stesso, una alla volta.
    opzioni:
      - testo: "Dormire nella stanza dei Quattro"
        descrizione: "Una notte intera, senza turni. La mattina Brunella lascia il pane sul davanzale."
        esito:
          titolo: Il pane sul davanzale
          testo: |
            Dormi senza sogni fino a giorno fatto e ti svegli con le ferite che
            tirano meno, il pane di Brunella e una mela sul davanzale.
          effetti: { ferite: -1, tormento: -0.5 }
      - testo: "Restare sveglio ad ascoltare Argento che fa i conti"
        descrizione: "Argento non dorme mai prima di aver chiuso il libro. Ogni tanto, contando, racconta."
        esito:
          titolo: I conti della notte
          testo: |
            Argento conta le uscite alla luce del bastone e ogni tanto si ferma su un nome per raccontarti chi era, finché ti
            addormenti sulla sedia.
          pe: { accademiche: 3 }
          effetti: { tormento: -0.5 }

  # ------------------------------------------------------------ grado 4 · la formula del Filo di ritorno
  - id: raschiatori-la-formula-del-filo
    presso: grifone-di-ferro
    immagine: icone/rope-coil
    titolo: Il Filo di ritorno
    sommario: "Accanto alle quattro disposizioni della Carta di Korith c'è una formula che tira verso di te chi resta indietro."
    luogo: Locanda del Grifone di Ferro, la stanza dei Quattro
    area: ponti-sospesi
    ripetibile: true
    requisiti: [fazione.raschiatori >= 12, incantesimo.raschiatori-filo-di-ritorno == 0]
    testo: |
      Argento tiene ferma la Carta di Korith con il bastone di cristallo.
      Accanto alle quattro disposizioni c'è una riga più piccola che ha
      imparato a dire in tre notti, la prima regola dei Raschiatori,
      trascinare fuori chi resta indietro.

      {magia Media} La formula ha la forma di un nodo che tira verso di te, e
      il prezzo lo paga la testa di chi la dice.
    opzioni:
      - testo: "Imparare la formula"
        descrizione: "Ci vuole Magia 2, e la testa sgombra. Argento la dice una volta sola."
        requisiti: [magia >= 2]
        costo: 2
        prova: { attributo: mentale, abilita: magia, difficolta: Media }
        successo:
          titolo: Il nodo
          testo: |
            Alla terza volta la riga ti si stringe nel petto come un nodo, e il bastone di Argento scivola da solo verso di te.
            Argento ride per la prima volta da quando lo conosci.
          effetti: { incantesimo.raschiatori-filo-di-ritorno: 1, tormento: 1 }
        fallimento:
          titolo: Il nodo che scivola
          testo: |
            La riga ti scivola via a metà, e Argento ti dice di riprovarci quando
            avrai la testa meno piena di gradini.
          effetti: {}
      - testo: "Chiedere ad Argento chi l'ha scritta"
        descrizione: "Una formula dei Precursori che dice la regola dei Raschiatori. Qualcuno l'ha scritta per qualcun altro."
        costo: 0
        esito:
          titolo: Chi l'ha scritta
          testo: |
            Argento si gratta la barba intrecciata facendo tintinnare i vetri, e
            risponde che in ottant'anni ha imparato a non chiedere a una rovina
            perché sa le cose.

  # ------------------------------------------------------------ il doppio gioco · la paga del Gancio
  - id: raschiatori-la-paga-del-gancio
    presso: mercato-dei-nodi
    immagine: ambientazione/mercato-dei-nodi
    titolo: La paga del Gancio
    sommario: "Al Mercato dei Nodi un ragazzo del Gancio ti aspetta ogni tanto con una borsa per te."
    luogo: Mercato dei Nodi, il banco del sale
    area: ponti-sospesi
    ripetibile: true
    requisiti: [raschiatori.doppio == 1, fazione.raschiatori >= 3, fazione.raschiatori <= 8]
    testo: |
      Al banco del sale il ragazzo del Gancio, con il cappuccio tirato su anche quando non piove, ti chiede che cosa si dice al Grifone, e
      ogni volta la borsa passa dalla sua cintura alla tua.

      {conoscenze-della-strada Media} Merlach compra l'orario dei turni, e chi compra gli orari prima o poi compra anche i posti.
    opzioni:
      - testo: "Riferire quello che si dice al Grifone"
        descrizione: "Turni e siti in cambio della paga del Gancio, che è buona."
        esito:
          titolo: La borsa
          testo: |
            Il ragazzo ripete a mezza voce i turni della settimana e la borsa
            passa alla tua cintura. Al Grifone ti sembra che Dragna alzi gli occhi
            dal foglio un momento prima del solito.
          effetti: { monete: 12, rep.gilda: 0.5, rep.raschiatori: -0.5 }
      - testo: "Riferirgli una mezza verità"
        descrizione: "Turni sbagliati e siti già vuoti, per la stessa borsa, se lui ci crede."
        prova: { attributo: sociale, abilita: ingannare, difficolta: Media }
        successo:
          titolo: La mezza verità
          testo: |
            La borsa passa alla tua cintura, e la Compagnia manderà i suoi a
            scavare in un sito vuoto da un anno.
          effetti: { monete: 12 }
        fallimento:
          titolo: Il ragazzo che conta
          testo: |
            Il ragazzo si accorge che i turni non tornano, ti dà mezza borsa e se
            ne va senza salutare.
          effetti: { monete: 6, sospetto: 1 }
      - testo: "Lasciarlo ad aspettare"
        descrizione: "Oggi no. Il ragazzo aspetterà, e la borsa con lui."
        costo: 0
        esito:
          titolo: Il banco del sale
          testo: |
            Passi davanti al banco del sale senza fermarti, e il ragazzo ti segue
            con gli occhi.
