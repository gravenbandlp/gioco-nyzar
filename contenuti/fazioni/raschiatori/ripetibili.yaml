# I lavori e i servizi dei Raschiatori che si aprono con i gradi della quest (fazione.raschiatori), tutti al Grifone
# di Ferro tranne la paga del Gancio. Requisiti con >=, così la pista resta a 15 passi.
# - `raschiatori-il-magazzino-della-bacheca` (grado 1, passo 3): bende, unguento e celle; dal grado 3 al prezzo di
#   casa, dal grado 4 anche il Respiratore; al grado 5, a chi porta il titolo di Fiamma, la bacheca compra i
#   cristalli carichi al prezzo migliore. È uno storylet d'acquisto, come le reliquie: un negozio nuovo andrebbe
#   aggiunto all'area dei Ponti Sospesi, che è un file condiviso.
# - `raschiatori-un-turno-alla-gradinata` (grado 2, passo 6): il turno ripetibile alla Gradinata Cieca, una scena
#   sola senza stanze.
# - `raschiatori-guidare-la-squadra` (grado 3, passo 9, con raschiatori.squadra): la rendita in cristalli carichi.
# - `raschiatori-la-branda-dei-quattro` (grado 4, passo 12): l'alloggio gratuito al piano di sopra del Grifone.
# - `raschiatori-la-formula-del-filo` (grado 4, passo 12): Argento insegna il Filo di ritorno, letto sulla Carta di
#   Korith (Formule precuriane, livello 2: Magia 2, prova Media, due rintocchi, senza prezzo in monete).
# - `raschiatori-la-paga-del-gancio` (doppio gioco, passi 3-8, al Mercato dei Nodi): la paga di Merlach per chi ha
#   finto di accettarla, a prezzo della reputazione con i Raschiatori.
storylet:
  # ------------------------------------------------------------ grado 1 · il Magazzino della bacheca
  - id: raschiatori-il-magazzino-della-bacheca
    presso: grifone-di-ferro
    immagine: ambientazione/locanda-del-grifone-di-ferro
    titolo: Il Magazzino della bacheca
    sommario: "Dietro la bacheca dei Raschiatori c'è uno sgabuzzino con le scorte della corporazione."
    luogo: Locanda del Grifone di Ferro, lo sgabuzzino dietro la bacheca
    area: ponti-sospesi
    ripetibile: true
    requisiti: [fazione.raschiatori >= 3]
    testo: |
      Lo sgabuzzino dietro la bacheca ha una porta bassa che obbliga a chinare la testa e una finestrella sul
      vuoto. Sugli scaffali di tavole grezze ci sono le scorte della corporazione in un ordine che conosce
      soltanto Argento. Le bende sono arrotolate strette e legate con lo spago, e i vasetti di unguento hanno
      il tappo di cera. In un angolo c'è una cassetta di celle cariche che ronzano piano sotto il coperchio.
      Il registro delle uscite è appeso a un chiodo con un laccio di cuoio, e chi prende qualcosa ci firma. Le
      pagine hanno gli angoli gonfi e scuri delle dita che le hanno sfogliate.

      Brunella ti dà la chiave senza alzare gli occhi dalla zuppa.
    opzioni:
      - testo: "Comprare un rotolo di bende"
        descrizione: "Le bende della corporazione, tagliate a misura di braccio."
        requisiti: [fazione.raschiatori < 9, monete >= 8, bende < 5]
        costo: 0
        esito:
          titolo: Le bende
          testo: |
            Prendi un rotolo dallo scaffale, scrivi il tuo nome sul registro e
            lasci le monete nella scodella di latta accanto alla porta.
          effetti: { bende: 1, monete: -8 }
      - testo: "Comprare un rotolo di bende al prezzo di casa"
        descrizione: "Un caposquadra paga le bende quanto le paga la bacheca."
        requisiti: [fazione.raschiatori >= 9, monete >= 5, bende < 5]
        costo: 0
        esito:
          titolo: Il prezzo di casa
          testo: |
            Prendi un rotolo dallo scaffale e scrivi il tuo nome sul registro,
            nella colonna dei caposquadra, dove le cifre sono più piccole.
          effetti: { bende: 1, monete: -5 }
      - testo: "Comprare un vasetto di unguento"
        descrizione: "L'unguento di Brunella, che odora di menta e chiude i tagli in una notte."
        requisiti: [fazione.raschiatori < 9, monete >= 20, unguento < 5]
        costo: 0
        esito:
          titolo: L'unguento
          testo: |
            Il vasetto è di terracotta e ti sta tutto nel palmo, e sul tappo di cera c'è il segno di Brunella,
            una B storta. Anche chiuso manda un odore di menta. Scrivi il tuo nome sul registro e lasci le
            monete nella scodella.
          effetti: { unguento: 1, monete: -20 }
      - testo: "Comprare un vasetto di unguento al prezzo di casa"
        descrizione: "Un caposquadra paga l'unguento quanto lo paga la bacheca."
        requisiti: [fazione.raschiatori >= 9, monete >= 14, unguento < 5]
        costo: 0
        esito:
          titolo: L'unguento di casa
          testo: |
            Scrivi il tuo nome sul registro, nella colonna dei caposquadra, e
            Brunella dalla cucina ti grida di non sprecarlo sui graffi.
          effetti: { unguento: 1, monete: -14 }
      - testo: "Comprare una cella carica"
        descrizione: "Un piccolo cristallo carico, per i reperti che si scaricano proprio quando servono."
        requisiti: [fazione.raschiatori < 9, monete >= 30, cella < 5]
        costo: 0
        esito:
          titolo: La cella
          testo: |
            La cella ti ronza nel palmo come un'ape chiusa nel pugno. La avvolgi
            in un fazzoletto e scrivi il tuo nome sul registro.
          effetti: { cella: 1, monete: -30 }
      - testo: "Comprare una cella carica al prezzo di casa"
        descrizione: "Un caposquadra paga le celle quanto le paga la bacheca."
        requisiti: [fazione.raschiatori >= 9, monete >= 20, cella < 5]
        costo: 0
        esito:
          titolo: La cella di casa
          testo: |
            La cella ti ronza nel palmo. Scrivi il tuo nome sul registro, nella
            colonna dei caposquadra, e Argento dalla sala ti fa un cenno.
          effetti: { cella: 1, monete: -20 }
      - testo: "Comprare il Respiratore della bacheca"
        descrizione: "Una maschera di lega grigia, presa da un turno di anni fa. Argento la vende soltanto ai veterani, e a un prezzo da veterani."
        requisiti: [fazione.raschiatori >= 12, oggetto.respiratore == 0, monete >= 120]
        costo: 0
        esito:
          titolo: La maschera grigia
          testo: |
            Argento tira giù la maschera dallo scaffale più alto con la punta del bastone e te la porge senza
            alzarsi. La lega grigia è liscia e senza un graffio dopo anni di turni, e resta fredda anche
            quando l'hai tenuta in mano per un pezzo. Argento ti dice che va decifrata come tutte le altre, e
            che se la rompi non ne ha un'altra.
          effetti: { oggetto.respiratore: 1, monete: -120 }
      - testo: "Vendere un cristallo carico al prezzo della Fiamma"
        descrizione: "I cristalli della Fiamma la bacheca li paga meglio di chiunque in città."
        requisiti: [fazione.raschiatori >= 15, raschiatori.fiamma == 1, cristalli.cristallo-carico >= 1]
        costo: 0
        esito:
          titolo: Il prezzo della Fiamma
          testo: |
            Argento soppesa il cristallo sul palmo e lo gira una volta davanti alla luce del bastone. Te lo
            paga dalla cassa della bacheca senza contrattare, poi scrive il tuo titolo sul registro al posto
            del nome.
          effetti: { cristalli.cristallo-carico: -1, monete: 35 }

  # ------------------------------------------------------------ grado 2 · il turno alla Gradinata
  - id: raschiatori-un-turno-alla-gradinata
    presso: grifone-di-ferro
    immagine: ambientazione/rovine-dei-precursori
    titolo: Un turno alla Gradinata
    sommario: "Il sito della Gradinata Cieca è dei Raschiatori per dieci anni, e il turno è tuo."
    luogo: Locanda del Grifone di Ferro, poi la Gradinata Cieca
    area: ponti-sospesi
    ripetibile: true
    requisiti: [fazione.raschiatori >= 6]
    testo: |
      Sulla bacheca c'è un foglio con *Gradinata Cieca* in cima e sotto il tuo nome a inchiostro. Il foglio è
      fermato al legno da quattro chiodi, mentre gli altri avvisi ne hanno uno solo. Il diritto di prima mappa
      dura dieci anni, e in dieci anni le file oltre l'ottavo gradino si possono svuotare con calma finché il
      custode lo permette.

      {percezione Media} Accanto al tuo nome qualcuno ha disegnato col gesso l'ottavo gradino tutto nero, ed è
      lo scherzo della sala per dire che il sito adesso è tuo. Chi l'ha fatto ha premuto tanto che il gesso si
      è spezzato a metà del tratto.

      Pio Varre ti aspetta al bancone con il sacco del piombo in spalla, e il peso gli tira giù la spalla da
      una parte.
    opzioni:
      - testo: "Scendere oltre l'ottavo gradino e lavorare alle file"
        descrizione: "Tre giorni di strada fino ai sette gradini, e oltre il buio le file degli oggetti calati."
        costo: 2
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Media }
        successo:
          titolo: Le file
          testo: |
            Scendi con Pio oltre il buio dell'ottavo gradino, e il custode delle file vi lascia lavorare in
            cambio di una lampada vecchia. La lampada finisce in fondo a una fila, e quando vi voltate ha già
            la sua etichetta di metallo. Risalite con due cristalli sterili e un frammento inciso, e Pio li
            porta su in spalla per tutta la strada fischiando.
          effetti: { cristalli.cristallo-sterile: 2, reliquie.frammento-inciso: 1, monete: 6, rep.raschiatori: 0.5 }
        fallimento:
          titolo: La rampa
          testo: |
            Sulla rampa che sale scendendo il piede trova il gradino più in alto di dove l'occhio lo
            aspettava, e la caviglia ti si piega sotto. Il turno finisce lì. Risalite con poco, e Pio ti fa da
            stampella per tutta la strada del ritorno.
          effetti: { cristalli.frammento-esausto: 2, ferite: 0.5, tormento: 1 }
      - testo: "Ricopiare le etichette delle file per Argento"
        descrizione: "Le etichette di metallo delle file sono un archivio. Argento paga chi le ricopia bene."
        costo: 2
        prova: { attributo: mentale, abilita: [accademiche, percezione], difficolta: Media }
        successo:
          titolo: Le etichette
          testo: |
            Passi il turno a ricopiare etichette alla luce della lampada, con Pio che ti tiene il calamaio.
            Sono lamine sottili incise a punta, e dopo decenni sotto terra il metallo non ha un filo di
            ossido. Argento paga le pagine una per una, e una pagina la tiene da parte senza dirti perché.
          effetti: { informazioni.segreto: 1, monete: 10, rep.raschiatori: 0.5 }
        fallimento:
          titolo: Le etichette che cambiano
          testo: |
            Le etichette cambiano mentre le ricopi. Il segno che hai appena trascritto non è più lo stesso
            quando torni a guardare la lamina, e alla fine del turno hai un quaderno di segni che non tornano.
            Argento sfoglia le pagine e scuote la testa, e ti paga lo stesso la carta.
          effetti: { monete: 3, tormento: 1 }
      - testo: "Mandare avanti lo Scandaglio"
        descrizione: "Con il cristallo davanti si trova la strada più svelta, e il turno costa meno fatica."
        requisiti: [chiave.scandaglio >= 1]
        prova: { attributo: mentale, abilita: percezione, difficolta: Facile }
        successo:
          titolo: La strada svelta
          testo: |
            Lo Scandaglio vibra sul buio dell'ottavo gradino, e la vibrazione ti sale fino al gomito quando lo
            punti dalla parte giusta. Ti porta dritto alle file senza passare dallo specchio. Torni con un
            cristallo sterile e qualche scheggia, e con mezza giornata di vantaggio.
          effetti: { cristalli.cristallo-sterile: 1, reliquie.scheggia: 2, monete: 4 }
        fallimento:
          titolo: Il cristallo confuso
          testo: |
            Nel buio dell'ottavo gradino lo Scandaglio vibra dappertutto allo
            stesso modo, e ti tocca fare la strada lunga. Torni con poco.
          effetti: { cristalli.frammento-esausto: 2 }

  # ------------------------------------------------------------ grado 3 · guidare la squadra
  - id: raschiatori-guidare-la-squadra
    presso: grifone-di-ferro
    immagine: fazioni/raschiatori
    titolo: Guidare la squadra
    sommario: "La tua squadra aspetta al tavolo lungo del Grifone, con i bracciali carichi e le mani vuote. Da te dipende chi scende e chi risale."
    luogo: Locanda del Grifone di Ferro, il tavolo lungo
    area: ponti-sospesi
    ripetibile: true
    requisiti: [fazione.raschiatori >= 9, raschiatori.squadra >= 1]
    testo: |
      La tua squadra ti aspetta al tavolo lungo vicino al camino, e quando arrivi si fa zitta. Sul legno ci
      sono i cerchi dei boccali di molte sere e le tacche dei coltelli. Nella ha già steso il foglio dei turni
      con il tuo nome in cima e i loro sotto, e tiene in mano la penna con la punta già intinta. Il turno lo
      decidi tu, e anche il conto delle teste a fine turno.

      {empatia Media} Uno dei ragazzi ha le mani fasciate da ieri e le tiene sotto il tavolo perché tu non lo
      lasci a casa. La fasciatura gli arriva al polso, e dove le dita si piegano la tela ha una macchia scura.
    opzioni:
      - testo: "Portarli alla Vena Storta e farli lavorare bene"
        descrizione: "Una vena buona e una squadra che sa quello che fa. Bisogna dare gli ordini giusti, e farli ascoltare."
        costo: 2
        prova: { attributo: sociale, abilita: [persuasione, intimidire], difficolta: Media }
        successo:
          titolo: Un turno buono
          testo: |
            Dai i turni alla corda uno per uno e senza fretta come te li dava Gerardo, e la squadra lavora
            alla Vena Storta come un solo braccio. Le corde scorrono senza strappi e nessuno deve gridare per
            farsi sentire sopra il vento della fenditura. A fine turno risalite con un cristallo carico e il
            sacco pieno, e conti le teste due volte, la seconda a voce alta.
          effetti: { cristalli.cristallo-carico: 1, cristalli.cristallo-sterile: 1, monete: 8, rep.raschiatori: 0.5 }
        fallimento:
          titolo: Il ragazzo con le mani fasciate
          testo: |
            Lasci scendere il ragazzo con le mani fasciate, e alla seconda ora le mani non lo reggono più. Lo
            capisci dalla corda prima che lui lo dica, perché scende a strappi di un palmo alla volta. Lo
            tirate su in due, e quando gli sciogli le bende la tela è rossa fino al polso. Il turno finisce
            presto con poco nei sacchi e una lanterna in meno da comprare, per fortuna.
          effetti: { cristalli.cristallo-sterile: 1, tormento: 1 }
      - testo: "Scendere con loro e lavorare in prima fila"
        descrizione: "Un caposquadra che scava davanti agli altri non ha bisogno di dare ordini. Ha bisogno di braccia."
        costo: 2
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Media }
        successo:
          titolo: In prima fila
          testo: |
            Scendi per primo e lavori per primo, e la squadra ti tiene dietro senza che tu dica una parola. Il
            cristallo carico lo stacchi tu, con tre colpi di scalpello alla base e la mano sinistra sotto per
            prenderlo. Risalite, e al Grifone Nella te lo mette in mano davanti a tutti.
          effetti: { cristalli.cristallo-carico: 1, monete: 6, rep.raschiatori: 0.5 }
        fallimento:
          titolo: Le braccia
          testo: |
            Lavori troppo e troppo in fretta, e alla terza ora le braccia ti mollano a mezza corda. Le dita
            restano chiuse sul manico dello scalpello e non vogliono riaprirsi. La squadra ti tira su e
            finisce il turno senza di te, e dal bordo senti i colpi degli scalpelli andare avanti al ritmo che
            avevi dato tu.
          effetti: { cristalli.cristallo-sterile: 1, ferite: 0.5 }
      - testo: "Lasciare la squadra a Nella per un turno"
        descrizione: "Nella sa tenere una corda e contare le teste. Un turno da sola le fa bene, e a te dà una giornata di riposo."
        quando: [raschiatori.nella >= 2]
        costo: 1
        esito:
          titolo: Il turno di Nella
          testo: |
            Le dai la penna e il foglio dei turni, e lei se li stringe al petto. Passi la giornata al Grifone
            con le gambe sotto il tavolo e le orecchie verso la porta. La sera torna con la squadra intera e
            un cristallo sterile, e ti racconta il turno parola per parola, contando le teste due volte.
          effetti: { cristalli.cristallo-sterile: 1, monete: 4, tormento: -0.5 }

  # ------------------------------------------------------------ grado 4 · la branda dei Quattro
  - id: raschiatori-la-branda-dei-quattro
    presso: grifone-di-ferro
    immagine: ambientazione/locanda-del-grifone-di-ferro
    titolo: La branda dei Quattro
    sommario: "Al piano di sopra del Grifone c'è una stanza che i Quattro pagano tutto l'anno. Chi siede al loro tavolo ci dorme senza pagare."
    luogo: Locanda del Grifone di Ferro, la stanza dei Quattro
    area: ponti-sospesi
    ripetibile: true
    requisiti: [fazione.raschiatori >= 12]
    testo: |
      In fondo al corridoio del piano di sopra c'è una stanza con quattro brande e una finestra sulla
      Cicatrice, che i Quattro pagano tutto l'anno a Liaren e a Brunella. Le brande sono telai di legno con la
      tela tesa da corde, e il legno è lucido nel punto dove si appoggia la mano per alzarsi. Sulla porta è
      disegnata col gesso una lanterna, e sotto ogni branda c'è una cassetta chiusa con un nome.

      {resistenza Facile} La branda è dura, e le ossa la ringraziano lo stesso. Dopo tante notti sulla pietra
      la schiena si distende sulla tela un poco alla volta.

      Dalla finestra arriva a intervalli la luce del Ponte dei Morti, e ogni volta passa sulle quattro brande
      nello stesso ordine.
    opzioni:
      - testo: "Dormire nella stanza dei Quattro"
        descrizione: "Una notte intera, senza turni. La mattina Brunella lascia il pane sul davanzale."
        esito:
          titolo: Il pane sul davanzale
          testo: |
            Dormi senza sogni fino a giorno fatto, con la finestra socchiusa e il vento della Cicatrice che ti
            passa sopra la coperta. La coperta è di lana grossa e sa di fumo di camino. Sul davanzale trovi il
            pane di Brunella con la crosta ancora tiepida e una mela, e le ferite tirano meno.
          effetti: { ferite: -1, tormento: -0.5 }
      - testo: "Restare sveglio ad ascoltare Argento che fa i conti"
        descrizione: "Argento non dorme mai prima di aver chiuso il libro. Ogni tanto, contando, racconta."
        esito:
          titolo: I conti della notte
          testo: |
            Argento conta le uscite della bacheca alla luce del bastone, che posato sul tavolo fa una luce
            fredda e ferma. Ogni tanto si interrompe su un nome e ci batte sopra l'unghia prima di raccontarti
            chi era. Quando scuote la testa le schegge di vetro nella barba tintinnano. Ti addormenti verso
            l'alba sulla sedia, con la testa piena di turni di quarant'anni fa.
          pe: { accademiche: 3 }
          effetti: { tormento: -0.5 }

  # ------------------------------------------------------------ grado 4 · la formula del Filo di ritorno
  - id: raschiatori-la-formula-del-filo
    presso: grifone-di-ferro
    immagine: icone/rope-coil
    titolo: Il Filo di ritorno
    sommario: "In un angolo della Carta di Korith, accanto alle quattro disposizioni, c'è una riga che Argento ha imparato a leggere."
    luogo: Locanda del Grifone di Ferro, la stanza dei Quattro
    area: ponti-sospesi
    ripetibile: true
    requisiti: [fazione.raschiatori >= 12, incantesimo.raschiatori-filo-di-ritorno == 0]
    testo: |
      Argento ha steso la Carta di Korith sul tavolo e la tiene ferma con il bastone di cristallo, che posato
      si accende. In un angolo c'è una riga incisa più piccola delle altre. I suoi segni sono fitti, e la
      polvere non li riempie. Dopo tre notti Argento la sa dire.

      {magia Media} La formula è fatta come un nodo che tira verso di te, e il prezzo lo paga la testa di chi
      la dice. Il Mana della riga scorre in una direzione sola anche con la Carta ferma sul tavolo.

      Argento dice che è la prima regola dei Raschiatori, trascinare fuori chi resta indietro, scritta da
      qualcuno che la conosceva prima di loro.
    opzioni:
      - testo: "Imparare la formula"
        descrizione: "Ci vuole Magia 2, e la testa sgombra. Argento la dice una volta sola."
        requisiti: [magia >= 2]
        costo: 2
        prova: { attributo: mentale, abilita: magia, difficolta: Media }
        successo:
          titolo: Il nodo
          testo: |
            Ripeti piano la riga dopo Argento, e alla terza volta la senti stringersi nel petto come un nodo
            che tiene. Ti lascia in bocca un sapore di ferro e un dolore leggero dietro gli occhi. Dall'altra
            parte del tavolo il bastone di Argento scivola da solo verso di te di un palmo, e lui ride per la
            prima volta da quando lo conosci.
          effetti: { incantesimo.raschiatori-filo-di-ritorno: 1, tormento: 1 }
        fallimento:
          titolo: Il nodo che scivola
          testo: |
            La riga ti scivola via a metà, come una corda bagnata fra le dita. Ti resta alle tempie un ronzio
            sordo, e ti accorgi di avere i pugni chiusi sul tavolo. Argento rimette via la Carta e ti dice di
            riprovarci un'altra sera, quando avrai la testa meno piena di gradini.
          effetti: {}
      - testo: "Chiedere ad Argento chi l'ha scritta"
        descrizione: "Una formula dei Precursori che dice la regola dei Raschiatori. Qualcuno l'ha scritta per qualcun altro."
        costo: 0
        esito:
          titolo: Chi l'ha scritta
          testo: |
            Argento si gratta la barba intrecciata, e i vetri tintinnano. Dice che non lo sa, e che in
            ottant'anni ha imparato a non chiedere a una rovina perché sa le cose. Prima di riporla passa il
            pollice sulla riga piccola, e poi se lo guarda a lungo alla luce del bastone. Si mette la Carta sotto il braccio, come un libro di conti.

  # ------------------------------------------------------------ il doppio gioco · la paga del Gancio
  - id: raschiatori-la-paga-del-gancio
    presso: mercato-dei-nodi
    immagine: ambientazione/mercato-dei-nodi
    titolo: La paga del Gancio
    sommario: "Al Mercato dei Nodi un ragazzo con il gancio dipinto sulla manica ti aspetta ogni tanto vicino al banco del sale, con una borsa per te."
    luogo: Mercato dei Nodi, il banco del sale
    area: ponti-sospesi
    ripetibile: true
    requisiti: [raschiatori.doppio == 1, fazione.raschiatori >= 3, fazione.raschiatori <= 8]
    testo: |
      Al banco del sale del Mercato dei Nodi ti aspetta il ragazzo del Gancio con il cappuccio tirato su. Il
      banco ha i sacchi di tela aperti in fila con una paletta di legno in ognuno, e il sale grosso
      scricchiola sotto le scarpe di chi passa. Ogni volta il ragazzo ti chiede che cosa si dice al Grifone e
      chi scende dove, e ogni volta la borsa passa dalla sua cintura alla tua.

      {conoscenze-della-strada Media} Una borsa così per notizie di bacheca vuol dire che Merlach compra
      l'orario dei turni, e chi compra gli orari prima o poi compra anche i posti.

      Il ragazzo si guarda intorno due volte, e tiene una mano sulla borsa finché non sei a un passo da lui.
    opzioni:
      - testo: "Riferire quello che si dice al Grifone"
        descrizione: "I turni, i nomi, i siti. È la paga del Gancio, e la paga è buona."
        esito:
          titolo: La borsa
          testo: |
            Gli dici dei turni della settimana e di chi scende dove, e lui li ripete a mezza voce per tenerli
            a mente. La borsa è di cuoio buono e passa alla tua cintura, con le monete avvolte in un panno che
            ne smorza il suono. Tornando al Grifone ti sembra che Dragna alzi gli occhi dal foglio un momento
            prima del solito.
          effetti: { monete: 12, rep.gilda: 0.5, rep.raschiatori: -0.5 }
      - testo: "Riferirgli una mezza verità"
        descrizione: "Turni sbagliati, siti già vuoti. La borsa è la stessa, se lui ci crede."
        prova: { attributo: sociale, abilita: ingannare, difficolta: Media }
        successo:
          titolo: La mezza verità
          testo: |
            Gli dici di un turno alla Vena Storta che non c'è e di un sito vuoto da un anno, e lui li ripete a
            mezza voce contandoli sulle dita, senza sbagliare una parola. La borsa passa alla tua cintura, e
            la Compagnia manderà i suoi a scavare dove non c'è niente.
          effetti: { monete: 12 }
        fallimento:
          titolo: Il ragazzo che conta
          testo: |
            Il ragazzo ripete i tuoi turni contandoli sulle dita, e al terzo si ferma con il dito a mezz'aria.
            Non tornano con quelli che ha sentito dire alla bacheca. Ti dà mezza borsa e se ne va senza
            salutare, e il suo cappuccio sparisce in fretta fra i sacchi di sale.
          effetti: { monete: 6, sospetto: 1 }
      - testo: "Lasciarlo ad aspettare"
        descrizione: "Oggi no. Il ragazzo aspetterà, e la borsa con lui."
        costo: 0
        esito:
          titolo: Il banco del sale
          testo: |
            Passi davanti al banco del sale senza fermarti, e il ragazzo ti
            segue con gli occhi finché non sparisci fra la folla del Mercato.
