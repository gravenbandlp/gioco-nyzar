# La quest dei Raschiatori, passo 11 (fazione.raschiatori 10 → 11): la spedizione alle Carcasse di Korith, due
# giorni a est di Qir-Azel nell'ultima conca prima della scarpata del Gradone Rosso (codex sf-carcasse-di-korith).
# Si scende con la propria squadra nello scafo sepolto sotto i tre archi neri. L'ingresso
# (`raschiatori-le-costole-nella-conca`, nella Superficie) costa un rintocco in meno con lo Scandaglio o a cavallo.
# Le stanze vanno in fasce di profondità (una stanza superata non ricompare nella stessa visita):
# 0 lo scavo dei venti palmi o il portello, 1 le costole che cantano o l'eco del cartografo (innocuo, ripete i
# gesti), 2 le cuccette fatte per corpi molto più alti o la stiva con le sonde, 3 la sala delle carte o il
# corridoio delle sonde; la squadra nel buio vale da 1 a 3.
# Il cuore a 4 è il timone: la Carta di Korith infilata nella ruota, e il pilota che si sveglia quando la Carta si
# accende (boss). Le vie sono Difficili; chi fallisce o perde torna in Superficie senza la Carta e senza passo.
aree:
  - id: raschiatori-korith
    immagine: ambientazione/gradone-rosso
    nome: Le Carcasse di Korith
    sommario: "Tre archi di metallo nero affiorano nell'ultima conca prima del Gradone Rosso, sopra lo scafo di una nave sepolta."
    spedizione: { ritorno: superficie-fratturata, soglia: 4, stanze: 3 }
    testo: |
      Sotto i tre archi neri, a venti palmi di terra, c'è uno scafo di
      metallo lucido che la ruggine non ha mai toccato, con le pareti curve
      come le costole di una bestia. Nella scende seconda della fila, come
      le hai insegnato, e ripete a mezza voce le regole del turno.

storylet:
  # ------------------------------------------------------------ l'ingresso, nella Superficie
  - id: raschiatori-le-costole-nella-conca
    immagine: ambientazione/gradone-rosso
    titolo: Le costole nella conca
    sommario: "Due giorni a est, nell'ultima conca prima della scarpata, escono dal terreno i tre archi neri dove puntavano le Stele."
    luogo: Superficie Fratturata, l'ultima conca prima del Gradone Rosso
    area: superficie-fratturata
    requisiti: [fazione.raschiatori == 10]
    testo: |
      L'ultima conca prima del Gradone Rosso è un catino di terra rossa da
      cui escono tre archi di metallo nero, ciascuno più piccolo del
      precedente, curvi verso un centro che non si vede.

      Gerardo Crine diceva che chi ha scavato qui ha smesso quando le pale,
      a venti palmi, hanno cominciato a vibrare nelle mani. La tua squadra
      ha le pale in spalla e aspetta che tu dica dove.

      {origine apprendista-raschiatore} È la prima volta che dei Raschiatori
      aspettano un tuo cenno, e tieni la pala come la teneva Gerardo.

      Nella ti porge la lampada già accesa.
    opzioni:
      - testo: "Scavare dove le pale vibrano"
        descrizione: "A venti palmi le pale vibrano, ed è lì che bisogna scavare."
        prova: { attributo: fisico, abilita: atletica, difficolta: Media }
        successo:
          titolo: Venti palmi
          testo: |
            A venti palmi la pala ti ronza nelle mani come un'ape chiusa nel
            pugno, e a ventidue batte su un portello di metallo lucido che si apre
            verso l'interno da solo.
          pe: { atletica: 2 }
          vai: raschiatori-korith
        fallimento:
          titolo: Le mani che ronzano
          testo: |
            La pala vibra tanto da sfuggirti e batterti sullo stinco, e scavate a
            mani nude finché il portello si apre verso l'interno da solo.
          effetti: { ferite: 0.5 }
          vai: raschiatori-korith
      - testo: "Cercare l'ingresso seguendo la curva degli archi"
        descrizione: "Se gli archi sono costole, dove si incontrano c'è la schiena, e un'apertura."
        prova: { attributo: mentale, abilita: [percezione, tecnologia], difficolta: Media }
        successo:
          titolo: La schiena
          testo: |
            Dove le linee degli archi si incontrerebbero, a poco più di un
            braccio, la pala tocca un portello che si apre appena lo liberi.
          pe: { percezione: 2 }
          vai: raschiatori-korith
        fallimento:
          titolo: Le buche vecchie
          testo: |
            Trovate soltanto vecchie buche, e ci vuole il pomeriggio prima che
            Nella inciampi nel portello per caso.
          effetti: { tormento: 1 }
          vai: raschiatori-korith
      - testo: "Mandare avanti lo Scandaglio"
        descrizione: "Il cristallo vibra dove sotto c'è un vuoto, e sotto una nave il vuoto è grande."
        requisiti: [chiave.scandaglio >= 1]
        costo: 0
        esito:
          titolo: La nota
          testo: |
            Lo Scandaglio vibra forte a tre passi dall'arco più piccolo, e lì
            sotto c'è il portello, che si apre appena lo liberate.
          vai: raschiatori-korith
      - testo: "Arrivare a cavallo prima della squadra"
        descrizione: "A cavallo arrivi un giorno prima e cerchi il portello con calma."
        requisiti: [chiave.cavalcatura >= 1]
        costo: 0
        esito:
          titolo: Un giorno prima
          testo: |
            Scavi dove il cavallo si rifiuta di passare, e quando la squadra
            arriva il portello è già scoperto.
          vai: raschiatori-korith
      - testo: "Far scavare la squadra a turni"
        descrizione: "Una squadra che scava a turni ci mette di più, ma nessuno si fa male."
        requisiti: [raschiatori.squadra >= 1]
        costo: 2
        esito:
          titolo: A turni
          testo: |
            Cambi i turni sempre più spesso man mano che le pale vibrano, finché a
            ventidue palmi Nella grida e il portello si apre da solo.
          effetti: { tormento: 1 }
          vai: raschiatori-korith

  # ------------------------------------------------------------ 0 · lo scavo e il portello
  - id: raschiatori-korith-lo-scavo
    immagine: ambientazione/gradone-rosso
    titolo: Il ronzio nelle pareti
    sommario: "Dentro lo scafo le pareti ronzano come le pale fuori, fino a entrarti nei denti."
    luogo: Le Carcasse di Korith, il primo corridoio
    area: raschiatori-korith
    ripetibile: true
    requisiti: [fazione.raschiatori == 10, profondita.raschiatori-korith == 0]
    testo: |
      Il primo corridoio è alto due volte un uomo e stretto quanto le spalle
      di uno solo, e il metallo ronza piano fin dentro le ossa delle mani.
      Nella polvere c'è una fila di impronte vecchie, più lunghe di un piede
      umano e più strette.

      {resistenza Media} Il ronzio stanca come una salita, e le gambe ti
      tremano senza aver fatto niente.
    opzioni:
      - testo: "Resistere al ronzio e avanzare"
        descrizione: "È soltanto un rumore, anche se ti arriva dentro le ossa."
        prova: { attributo: fisico, abilita: resistenza, difficolta: Media }
        successo:
          titolo: Dentro le ossa
          testo: |
            Avanzi a denti stretti, e a metà corridoio il ronzio diventa una cosa
            a cui ci si abitua, come il vento sui Ponti.
          pe: { resistenza: 2 }
          effetti: { profondita.raschiatori-korith: 1 }
        fallimento:
          titolo: Il sangue dal naso
          testo: |
            Ti cola sangue dal naso, e tornate al portello ad aspettare che
            smetta.
          effetti: { ferite: 0.5 }
      - testo: "Seguire le impronte vecchie"
        descrizione: "Chi le ha lasciate conosceva lo scafo."
        prova: { attributo: mentale, abilita: percezione, difficolta: Media }
        successo:
          titolo: I piedi lunghi
          testo: |
            Le impronte vanno rasente alla parete sinistra, lungo una fascia scura
            del metallo che non ronza, e la squadra ti segue in fila con la mano
            sulla spalla di chi sta davanti.
          pe: { percezione: 2 }
          effetti: { profondita.raschiatori-korith: 1 }
        fallimento:
          titolo: Le impronte che girano
          testo: |
            Le impronte girano in cerchio, e ci giri dietro due volte prima di
            accorgertene sotto gli occhi della squadra.
          effetti: { tormento: 1 }
      - testo: "Fasciarsi le orecchie e passare in fretta"
        descrizione: "Bende sulle orecchie e di corsa, anche se qualcosa ti resta nella testa."
        costo: 2
        esito:
          titolo: Le bende sulle orecchie
          testo: |
            Passate di corsa con la testa fasciata come feriti di guerra, e per tutto
            il giorno ti resta dietro gli occhi una nota sola.
          effetti: { profondita.raschiatori-korith: 1, tormento: 1 }

  - id: raschiatori-korith-il-portello-interno
    immagine: ambientazione/rovine-dei-precursori
    titolo: Il portello interno
    sommario: "Un secondo portello chiude il corridoio, con un pannello di placche che si accendono quando ti avvicini."
    luogo: Le Carcasse di Korith, il portello interno
    area: raschiatori-korith
    ripetibile: true
    requisiti: [fazione.raschiatori == 10, profondita.raschiatori-korith == 0]
    testo: |
      Il corridoio finisce contro un portello rotondo, accanto a un pannello
      di placche quadrate che si accendono di luce bianca quando ti avvicini
      e si spengono quando ti allontani.

      {tecnologia Media} Le placche si accendono nell'ordine in cui cammini,
      e la risposta forse è il modo in cui ci si arriva.
    opzioni:
      - testo: "Rispondere al pannello"
        descrizione: "Le placche seguono i passi. Bisogna trovare il passo giusto."
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Media }
        successo:
          titolo: Il passo giusto
          testo: |
            Cammini davanti al pannello in diagonale finché le placche si accendono tutte
            insieme, e il portello ruota con un sospiro su una sala dal soffitto di costole.
          pe: { tecnologia: 2 }
          effetti: { profondita.raschiatori-korith: 1 }
        fallimento:
          titolo: La luce rossa
          testo: |
            Le placche diventano rosse, e il portello manda una scossa che butta
            per terra chi ci stava appoggiato.
          effetti: { ferite: 0.5 }
      - testo: "Forzarlo con le leve della squadra"
        descrizione: "Le leve di ferro della squadra contro il portello, e si vedrà chi cede per primo."
        prova: { attributo: fisico, abilita: atletica, difficolta: Media }
        successo:
          titolo: Le leve
          testo: |
            Alla terza spinta il portello cede di un palmo, quanto basta per
            passarci di fianco.
          pe: { atletica: 2 }
          effetti: { profondita.raschiatori-korith: 1 }
        fallimento:
          titolo: La leva spezzata
          testo: |
            Una leva si spezza con un rumore di sparo e il ferro vola a un dito dalla
            faccia di Nella, e tu ti siedi con la testa fra le ginocchia finché ti
            smette il tremito.
          effetti: { tormento: 1 }
      - testo: "Aspettare che si apra da solo"
        descrizione: "Quello di fuori si è aperto da solo, e forse anche questo, con pazienza."
        costo: 2
        esito:
          titolo: Il sospiro
          testo: |
            Mangiate il pane del sacco seduti davanti al portello, finché lo vedete
            ruotare da solo con un sospiro, come un vecchio stanco di aspettare.
          effetti: { profondita.raschiatori-korith: 1, ferite: 0.5 }

  # ------------------------------------------------------------ 1 · le costole e l'eco
  - id: raschiatori-korith-le-costole-che-cantano
    immagine: ambientazione/rovine-dei-precursori
    titolo: Le costole che cantano
    sommario: "Le costole di metallo del soffitto cantano ognuna la sua nota quando le tocchi con il ferro."
    luogo: Le Carcasse di Korith, la sala delle costole
    area: raschiatori-korith
    ripetibile: true
    requisiti: [fazione.raschiatori == 10, profondita.raschiatori-korith == 1]
    testo: |
      Nella sala lunga e curva le costole di metallo scendono dal soffitto al
      pavimento, e quando uno della squadra ne urta una con la pala la
      costola canta una nota pulita a cui le altre rispondono piano. In fondo
      c'è un passaggio chiuso da una lastra.

      {espressivita Media} È una scala che sale da prua a poppa, e la nota
      che manca è una porta.
    opzioni:
      - testo: "Suonare la nota che manca"
        descrizione: "Una scala con un buco, e il buco si canta."
        prova: { attributo: sociale, abilita: espressivita, difficolta: Media }
        successo:
          titolo: La nota
          testo: |
            Suoni le costole una per una con il manico del piccone e dove la scala
            si interrompe canti tu, con la voce che trema, finché la lastra in
            fondo scivola di lato.
          pe: { espressivita: 2 }
          effetti: { profondita.raschiatori-korith: 1 }
        fallimento:
          titolo: La nota stonata
          testo: |
            Stoni la nota, e tutte le costole te la restituiscono stonata e più
            forte.
          effetti: { tormento: 1 }
      - testo: "Contare le costole e trovare quella diversa"
        descrizione: "Dietro una delle costole c'è la porta."
        prova: { attributo: mentale, abilita: percezione, difficolta: Media }
        successo:
          titolo: La costola cava
          testo: |
            La diciassettesima è più opaca e alle nocche suona cava, e la leva
            dietro fa scivolare di lato la lastra in fondo.
          pe: { percezione: 2 }
          effetti: { profondita.raschiatori-korith: 1 }
        fallimento:
          titolo: Il conto delle costole
          testo: |
            Ti tornano due numeri diversi, finché Nella ti fa notare che hai
            contato anche le ombre.
          effetti: { tormento: 1 }
      - testo: "Forzare la lastra senza toccare le costole"
        descrizione: "Niente musica stavolta, soltanto leve. Le costole è meglio lasciarle stare."
        costo: 2
        esito:
          titolo: La lastra forzata
          testo: |
            Forzate la lastra senza toccare le costole. Quando cede qualcuno si
            appoggia per sbaglio a una costola, e la nota ti resta nelle orecchie
            fino a sera.
          effetti: { profondita.raschiatori-korith: 1, tormento: 1 }

  - id: raschiatori-korith-l-eco-del-cartografo
    immagine: ambientazione/regno-profondo
    titolo: L'eco del cartografo
    sommario: "In una cabina stretta una figura di luce misura da secoli una mappa che non c'è."
    luogo: Le Carcasse di Korith, la cabina del cartografo
    area: raschiatori-korith
    ripetibile: true
    requisiti: [fazione.raschiatori == 10, profondita.raschiatori-korith == 1]
    testo: |
      In una cabina stretta una figura di luce sottile come un palo, china su un
      tavolo vuoto, misura una mappa che non c'è con un compasso fatto d'aria.
      Ogni tanto alza la testa verso il muro come verso un oblò. Quando le passi
      davanti ti attraversa con lo sguardo.

      {accademiche Media} I cartografi dei Precursori segnavano le distanze in
      tempi di cammino, e questo misura le ore come un guardiano.
    opzioni:
      - testo: "Guardare dove guarda lui"
        descrizione: "Alza la testa sempre verso lo stesso punto della parete."
        prova: { attributo: mentale, abilita: accademiche, difficolta: Media }
        successo:
          titolo: L'oblò
          testo: |
            Nel punto che guarda c'è un cerchio graffiato con quattro tacche, e
            quando ne tocchi una e si illumina la figura annuisce e sparisce per
            la prima volta in secoli. Dietro il tavolo si apre un passaggio.
          pe: { accademiche: 2 }
          effetti: { profondita.raschiatori-korith: 1, informazioni.voce: 1 }
        fallimento:
          titolo: Il compasso
          testo: |
            Non vedi niente, e quando ti volti la figura sta misurando te, dalla
            testa ai piedi. Esci dalla cabina all'indietro, senza voltarle le
            spalle.
          effetti: { tormento: 1 }
      - testo: "Fare il suo gesto accanto a lui"
        descrizione: "Un eco che ripete i gesti forse aspetta un compagno di misura."
        prova: { attributo: sociale, abilita: empatia, difficolta: Media }
        successo:
          titolo: Il compagno di misura
          testo: |
            Tieni l'altra punta del compasso, e la figura si gira verso di te con
            qualcosa che somiglia a un sorriso prima di sparire, lasciando aperto
            un passaggio basso.
          pe: { empatia: 2 }
          effetti: { profondita.raschiatori-korith: 1 }
        fallimento:
          titolo: Il gesto a metà
          testo: |
            Ti fermi a metà del gesto, e la figura si blocca con il compasso
            alzato mentre la luce si fa più fredda.
          effetti: { tormento: 1 }
      - testo: "Passargli dietro e cercare un'altra uscita"
        descrizione: "È innocuo, e ha il suo lavoro. Lo lasci lavorare e giri intorno."
        costo: 2
        esito:
          titolo: Alle sue spalle
          testo: |
            Gli passi dietro piano come dietro uno scrivano chino sul registro,
            fino a una porticina bassa dietro una tenda di polvere.
          effetti: { profondita.raschiatori-korith: 1, tormento: 1 }

  # ------------------------------------------------------------ 1–3 · la squadra nel buio
  - id: raschiatori-korith-la-squadra
    immagine: fazioni/raschiatori
    titolo: La squadra nel buio
    sommario: "La lampada di uno della squadra si spegne, e lui resta fermo con gli occhi aperti."
    luogo: Le Carcasse di Korith, un corridoio curvo
    area: raschiatori-korith
    ripetibile: true
    requisiti: [fazione.raschiatori == 10, profondita.raschiatori-korith >= 1, profondita.raschiatori-korith <= 3]
    testo: |
      In un corridoio curvo la lampada del più giovane della squadra si
      spegne, e lui resta fermo con gli occhi aperti, muto al suo nome.
      Nella gli tiene una mano sulla spalla e ti guarda.

      {medicina Media} Il polso è regolare. È la paura, o quello che lo
      scafo fa alla testa di chi ci entra per la prima volta.
    opzioni:
      - testo: "Dargli un ordine chiaro"
        descrizione: "Un caposquadra parla e la squadra fa, anche con la testa altrove."
        prova: { attributo: sociale, abilita: [persuasione, intimidire], difficolta: Media }
        successo:
          titolo: La voce del caposquadra
          testo: |
            Gli dici di guardarti le mani con la voce di Gerardo, e lui si sveglia
            e torna al suo posto nella fila.
          pe: { persuasione: 2 }
          effetti: { profondita.raschiatori-korith: 1, rep.raschiatori: 0.5 }
        fallimento:
          titolo: La voce sbagliata
          testo: |
            Alzi la voce e il ragazzo si accuccia con le mani sulla testa, e la
            squadra torna indietro fin dove lo scafo ronza meno, a lasciargli il
            tempo di tornare.
          effetti: { tormento: 1 }
      - testo: "Portarlo avanti a braccia"
        descrizione: "Quando la testa è altrove si porta il resto, e la testa arriva dopo."
        prova: { attributo: fisico, abilita: atletica, difficolta: Media }
        successo:
          titolo: A braccia
          testo: |
            Te lo carichi in spalla come un sacco di cristalli finché comincia a
            protestare e ti chiede di rimetterlo giù.
          pe: { atletica: 2 }
          effetti: { profondita.raschiatori-korith: 1 }
        fallimento:
          titolo: Il peso
          testo: |
            La schiena ti avvisa con una fitta fino al collo, e aspettate seduti
            che il ragazzo torni da solo.
          effetti: { ferite: 0.5 }
      - testo: "Fermare tutta la squadra e aspettare"
        descrizione: "Si aspetta insieme. Si perde tempo, e nessuno resta indietro."
        costo: 2
        esito:
          titolo: Chi resta indietro si trascina
          testo: |
            Aspettate un'ora seduti in cerchio con le lampade basse. Quando torna
            piange un poco, e nessuno lo guarda perché fra i Raschiatori si fa
            così.
          effetti: { profondita.raschiatori-korith: 1, tormento: 1 }

  # ------------------------------------------------------------ 2 · le cuccette e la stiva
  - id: raschiatori-korith-le-cuccette
    immagine: ambientazione/rovine-dei-precursori
    titolo: Le cuccette lunghe
    sommario: "Una cabina di cuccette scavate nelle pareti, lunghe il doppio di un uomo e strette."
    luogo: Le Carcasse di Korith, il dormitorio
    area: raschiatori-korith
    ripetibile: true
    requisiti: [fazione.raschiatori == 10, profondita.raschiatori-korith == 2]
    testo: |
      Il dormitorio ha cuccette scavate nelle pareti fino al soffitto,
      lunghe il doppio di un uomo e strette quanto una spalla. Su una in
      basso c'è ancora una coperta grigia piegata, e in fondo una scaletta
      scende.

      {origine allievo-di-torvessa} Le relazioni dell'Accademia dicono che a
      Mahr-Kel le impronte sul pavimento erano lunghe così, e chi dormiva
      qui camminava anche là.
    opzioni:
      - testo: "Misurare le cuccette e capire chi ci dormiva"
        descrizione: "Un letto dice molto di chi lo usa."
        prova: { attributo: mentale, abilita: [accademiche, percezione], difficolta: Media }
        successo:
          titolo: Il doppio di un uomo
          testo: |
            Chi dormiva qui era alto il doppio di te, e le misure finiscono sul
            quaderno accanto a quelle della Gradinata. Sotto una coperta trovi un
            frammento inciso che qualcuno aveva nascosto.
          pe: { accademiche: 2 }
          effetti: { profondita.raschiatori-korith: 1, reliquie.frammento-inciso: 1 }
        fallimento:
          titolo: La coperta
          testo: |
            La coperta si sbriciola in una nuvola grigia che ti fa tossire a
            lungo, piegato in due.
          effetti: { contaminazione: 1 }
      - testo: "Scendere subito dalla scaletta"
        descrizione: "Le cuccette sono di qualcun altro. La scaletta invece porta dove bisogna andare."
        prova: { attributo: fisico, abilita: acrobazia, difficolta: Media }
        successo:
          titolo: Gradini lunghi
          testo: |
            Scendi saltando da un gradino all'altro, distanti il doppio dei tuoi,
            e in fondo l'aria è più fredda e sa di olio vecchio.
          pe: { acrobazia: 2 }
          effetti: { profondita.raschiatori-korith: 1 }
        fallimento:
          titolo: Il salto lungo
          testo: |
            Manchi un gradino e finisci in fondo sulla schiena, con un fianco che
            duole.
          effetti: { ferite: 0.5 }
      - testo: "Calare la corda dalla scaletta e scendere uno alla volta"
        descrizione: "Una corda lungo la scaletta, e si scende appesi uno alla volta."
        costo: 2
        esito:
          titolo: Uno alla volta
          testo: |
            Scendete appesi uno alla volta e l'ultimo pezzo lo fai al buio, con la
            lampada impigliata, finché in fondo Nella ti porge la sua.
          effetti: { profondita.raschiatori-korith: 1, ferite: 0.5 }

  - id: raschiatori-korith-la-stiva
    immagine: bestiario/salvaguardia-precursori
    titolo: La stiva
    sommario: "Nella stiva le casse aperte sono piene di celle, e sopra galleggiano due fusi di metallo."
    luogo: Le Carcasse di Korith, la stiva
    area: raschiatori-korith
    ripetibile: true
    requisiti: [fazione.raschiatori == 10, profondita.raschiatori-korith == 2]
    testo: |
      La stiva è piena di casse di metallo aperte, con celle di cristallo
      ancora cariche e pale ripiegate come ali di pipistrello. Sopra
      galleggiano due fusi di metallo con tre pale ciascuno, che si girano
      verso di voi appena uno della squadra tocca una cassa con il piede.

      {armi-da-distanza Media} Prima di ogni scatto le pale si fermano un
      momento, ed è lì che si colpiscono.
    opzioni:
      - testo: "Abbattere le sonde"
        descrizione: "Sono due, e le pale si fermano prima di ogni scatto."
        combattimento: raschiatori-sonde
        vittoria:
          titolo: Le pale ferme
          testo: |
            La seconda sonda cade sulle casse con un rumore di pentole, e la
            squadra riempie i sacchi di celle e di pale ripiegate.
          effetti: { profondita.raschiatori-korith: 1, cella: 1, bottino.parti-di-drone: 1 }
        sconfitta:
          titolo: La stiva chiusa
          testo: |
            Le sonde vi spingono fuori a colpi di pale, e nel corridoio Nella
            conta le teste due volte.
      - testo: "Passare sotto le casse senza farle muovere"
        descrizione: "Le sonde si svegliano quando qualcuno tocca le casse."
        prova: { attributo: fisico, abilita: furtivita, difficolta: Media }
        successo:
          titolo: Sotto le casse
          testo: |
            Strisciate sotto le casse con le lampade coperte, e dall'altra parte
            prendi piano una cella senza che le sonde si girino.
          pe: { furtivita: 2 }
          effetti: { profondita.raschiatori-korith: 1, cella: 1 }
        fallimento:
          titolo: Il piede
          testo: |
            Un piede tocca una cassa, e una pala ti apre la giubba sulla schiena
            prima che la porta della stiva si chiuda.
          effetti: { ferite: 0.5 }
      - testo: "Lasciare la stiva e prendere il corridoio di servizio"
        descrizione: "Il corridoio di servizio è più lungo e più buio, ma senza sonde."
        costo: 2
        esito:
          titolo: Il corridoio di servizio
          testo: |
            Il corridoio di servizio è un budello intorno alla stiva, e quando ne
            uscite a tutti fa male il collo.
          effetti: { profondita.raschiatori-korith: 1, ferite: 0.5 }

  # ------------------------------------------------------------ 3 · la sala delle carte e il corridoio delle sonde
  - id: raschiatori-korith-la-sala-delle-carte
    immagine: ambientazione/rovine-dei-precursori
    titolo: La sala delle carte
    sommario: "Le pareti della sala sono lastre di vetro scuro incise, e una mostra la Cicatrice."
    luogo: Le Carcasse di Korith, la sala delle carte
    area: raschiatori-korith
    ripetibile: true
    requisiti: [fazione.raschiatori == 10, profondita.raschiatori-korith == 3]
    testo: |
      Le pareti della sala rotonda sono lastre di vetro scuro incise di coste
      mai viste e di cieli con stelle in quattro colori. La più grande mostra
      una spaccatura lunga con dentro qualcosa di intricato e sospeso, e
      capisci che è la Cicatrice prima di capire perché lo sai. Al centro ha
      un incavo vuoto, della forma di una lastra più piccola.

      {accademiche Media} I frammenti della Biblioteca chiamano Korith il
      cartografo, e questa sala era il suo laboratorio.
    opzioni:
      - testo: "Leggere la carta grande"
        descrizione: "Una carta della Cicatrice fatta prima della città."
        prova: { attributo: mentale, abilita: [accademiche, tecnologia], difficolta: Media }
        successo:
          titolo: La carta della Cicatrice
          testo: |
            Le linee si accendono sotto il dito e il Labirinto compare disegnato
            quattro volte, in quattro colori. Ricopi quello che puoi, e ti ricordi
            la forma dell'incavo, perché la lastra che manca è più avanti.
          pe: { accademiche: 2 }
          effetti: { profondita.raschiatori-korith: 1, informazioni.segreto: 1 }
        fallimento:
          titolo: Le linee che si accendono
          testo: |
            Le linee si accendono tutte insieme, e per un'ora vedi la Cicatrice
            sovrapposta alle facce della squadra.
          effetti: { tormento: 1 }
      - testo: "Cercare da dove è stata tolta la lastra piccola"
        descrizione: "Qualcuno ha tolto la lastra dall'incavo, e le tracce dicono dove."
        prova: { attributo: mentale, abilita: percezione, difficolta: Media }
        successo:
          titolo: Le tracce nella polvere
          testo: |
            Davanti all'incavo una sola fila di impronte lunghe e strette esce
            dalla sala in direzione del timone, e la segui.
          pe: { percezione: 2 }
          effetti: { profondita.raschiatori-korith: 1 }
        fallimento:
          titolo: Le tracce tue
          testo: |
            Nella polvere conti una fila di impronte in più di quante siete.
          effetti: { tormento: 1 }
      - testo: "Ricopiare tutto e pensarci dopo"
        descrizione: "Per copiare basta la pazienza, e forse il tempo c'è."
        costo: 2
        esito:
          titolo: Il quaderno pieno
          testo: |
            Ricopi le carte fino all'ultima pagina del quaderno senza capirci
            quasi niente, perché tanto Argento capirà, e uscendo segui le impronte
            lunghe verso prua.
          effetti: { profondita.raschiatori-korith: 1, tormento: 1 }

  - id: raschiatori-korith-il-corridoio-di-prua
    immagine: bestiario/salvaguardia-precursori
    titolo: Il corridoio di prua
    sommario: "Il corridoio verso prua è pieno di fili tesi all'altezza della gola, e toccarne uno sveglia qualcosa."
    luogo: Le Carcasse di Korith, il corridoio di prua
    area: raschiatori-korith
    ripetibile: true
    requisiti: [fazione.raschiatori == 10, profondita.raschiatori-korith == 3]
    testo: |
      Il corridoio verso prua è attraversato da decine di fili sottili tesi
      all'altezza della gola, che brillano appena alla luce della lampada.
      In fondo c'è una porta con un cerchio inciso sopra, diviso in quattro.

      {furtivita Media} Sono tesi a intervalli regolari, perché chi li ha
      messi voleva che si passasse piegati.
    opzioni:
      - testo: "Passare piegati fra i fili"
        descrizione: "A schiena curva, un passo alla volta, senza sfiorarli."
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Media }
        successo:
          titolo: Piegati
          testo: |
            Passi piegato con la squadra che mette i piedi dove li metti tu, e in
            fondo vi raddrizzate con le schiene che scricchiolano.
          pe: { furtivita: 2 }
          effetti: { profondita.raschiatori-korith: 1 }
        fallimento:
          titolo: Il filo
          testo: |
            Un filo ti tocca la spalla e dal soffitto scende una scossa che ti
            butta in ginocchio.
          effetti: { ferite: 0.5 }
      - testo: "Staccare i fili dal loro attacco"
        descrizione: "Ogni filo ha un attacco nella parete. Un attacco si svita."
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Media }
        successo:
          titolo: Gli attacchi
          testo: |
            Sviti gli attacchi con la punta del coltello, e i fili si arrotolano
            su se stessi come capelli.
          pe: { tecnologia: 2 }
          effetti: { profondita.raschiatori-korith: 1 }
        fallimento:
          titolo: L'attacco che morde
          testo: |
            Il filo ti scatta sul dorso della mano come una frusta, e ti lascia
            una riga rossa che brucia.
          effetti: { ferite: 0.5 }
      - testo: "Mandare avanti la lampada su un bastone"
        descrizione: "Una lampada su un bastone trova i fili prima delle gole, ma rischia."
        costo: 2
        esito:
          titolo: La lampada sul bastone
          testo: |
            La lampada sul manico di pala ti mostra ogni filo finché uno tocca il
            vetro e la spegne, e il resto lo fate al buio, a memoria.
          effetti: { profondita.raschiatori-korith: 1, tormento: 1 }

  # ------------------------------------------------------------ il cuore · il timone
  - id: raschiatori-il-timone
    immagine: bestiario/salvaguardia-precursori
    titolo: Il timone
    sommario: "A prua il pilota dello scafo siede davanti a una ruota, con infilata la carta che manca alla sala."
    luogo: Le Carcasse di Korith, la plancia
    area: raschiatori-korith
    requisiti: [fazione.raschiatori == 10, profondita.raschiatori-korith >= 4]
    testo: |
      La plancia è a prua, sotto il più piccolo dei tre archi, una stanza a
      mezzaluna con al centro una ruota di metallo grande come una macina.
      Davanti alla ruota è seduto il pilota, un corpo di metallo alto il
      doppio di un uomo, con le mani posate sulle razze e la testa china in
      avanti come un timoniere addormentato al suo turno.

      Nel mozzo della ruota è infilata una lastra di vetro scuro della forma
      dell'incavo della sala delle carte. Quando entri con la lampada la
      lastra si scalda di una luce debole, e sopra si muovono delle linee.

      {tecnologia Difficile} La lastra è la carta, e quando si accende
      sveglia anche il pilota. Toglierla in fretta vuol dire spegnerla prima
      che lui alzi la testa.

      Le dita del pilota si muovono appena sulla ruota, una alla volta. *Il
      cartografo, o quello che ha portato la nave fin qui.* La squadra ha le
      pale in mano e ti guarda.
    opzioni:
      - testo: "Prendere la carta e affrontare il pilota"
        descrizione: "Quando la lastra esce dal mozzo lui si alza, ed è stato fatto per tenere una nave."
        combattimento: raschiatori-timone
        vittoria:
          titolo: La Carta di Korith
          testo: |
            Il pilota cade sulla ruota con un rumore di campana spezzata. Contro
            la luce la lastra mostra il primo strato del Labirinto in quattro
            disposizioni, ognuna sotto uno dei quattro segni, e in un angolo una
            riga che non sai leggere.

            Al Grifone Argento ci passa sopra le dita, poi dice che per scendere
            dove indica la Carta serve il permesso del Velo, e forse la chiave sta
            nella Cripta.
          pe: { armi-da-mischia: 5 }
          effetti: { fazione.raschiatori: 1, oggetto.raschiatori-carta-di-korith: 1, reliquie.frammento-inciso: 2, bottino.parti-di-drone: 1 }
          vai: superficie-fratturata
        sconfitta:
          titolo: La ruota che gira
          testo: |
            Il pilota ti butta contro la parete e la squadra ti trascina fuori
            mentre la nave sussulta. Risalite senza la Carta, e nella conca i tre
            archi si sono spostati di un palmo.
          vai: superficie-fratturata
      - testo: "Sfilare la carta senza svegliarlo"
        descrizione: "Se la lastra si spegne prima che lui alzi la testa, il pilota resta a dormire."
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Difficile }
        successo:
          titolo: Le dita ferme
          testo: |
            Fai scattare la lastra con il pollice e la sfili mentre la luce si
            spegne, e il pilota resta con la testa china. Dentro c'è il primo
            strato del Labirinto in quattro disposizioni, ognuna sotto uno dei
            quattro segni.

            Al Grifone Argento ci passa sopra le dita, poi dice che per scendere
            dove indica la Carta serve il permesso del Velo, e forse la chiave sta
            nella Cripta.
          pe: { tecnologia: 5 }
          effetti: { fazione.raschiatori: 1, oggetto.raschiatori-carta-di-korith: 1, reliquie.frammento-inciso: 2 }
          vai: superficie-fratturata
        fallimento:
          titolo: La testa che si alza
          testo: |
            La lastra si incastra e la luce si fa più forte, e prima che usciate
            una mano di metallo ti stringe il braccio finché qualcosa cede, e
            risalite senza la Carta.
          effetti: { ferite: 2, tormento: 1 }
          vai: superficie-fratturata
      - testo: "Ordinargli di restare seduto"
        descrizione: "La formula del Comando parla alle macchine dei Precursori, e questa aspetta ordini da secoli."
        incantesimo: comando
        prova: { attributo: mentale, abilita: magia, difficolta: Difficile }
        successo:
          titolo: Resta
          testo: |
            La formula ti esce in una lingua che non è tua, e il pilota alza la
            testa prima di rimetterla giù. Sfili la lastra, e dentro c'è il primo
            strato del Labirinto in quattro disposizioni, ognuna sotto uno dei
            quattro segni.

            Al Grifone Argento ci passa sopra le dita, poi dice che per scendere
            dove indica la Carta serve il permesso del Velo, e forse la chiave sta
            nella Cripta.
          pe: { magia: 5 }
          effetti: { fazione.raschiatori: 1, oggetto.raschiatori-carta-di-korith: 1, reliquie.frammento-inciso: 2 }
          vai: superficie-fratturata
        fallimento:
          titolo: La parola sbagliata
          testo: |
            La formula ti si spezza in bocca e il pilota si alza, e la squadra ti
            trascina fuori mentre la nave intera sussulta. Risalite senza la
            Carta, con la testa che pulsa.
          effetti: { tormento: 1.5, ferite: 1 }
          vai: superficie-fratturata
      - testo: "Far tenere ferme le sue mani alla squadra"
        descrizione: "Tre leve sulle dita del pilota mentre sfili la lastra, se la squadra si fida di te."
        requisiti: [raschiatori.squadra >= 1]
        prova: { attributo: sociale, abilita: persuasione, difficolta: Difficile }
        successo:
          titolo: Tre leve
          testo: |
            Tre della squadra tengono ferme con le leve le dita del pilota mentre
            sfili la lastra, e la luce si spegne su quattro disposizioni del primo
            strato del Labirinto, ognuna sotto uno dei quattro segni.

            Al Grifone Argento ci passa sopra le dita per un'ora, poi dice che per
            scendere dove indica la Carta serve il permesso del Velo, e la chiave
            forse sta nella Cripta.
          pe: { persuasione: 5 }
          effetti: { fazione.raschiatori: 1, oggetto.raschiatori-carta-di-korith: 1, reliquie.frammento-inciso: 2, rep.raschiatori: 0.5 }
          vai: superficie-fratturata
        fallimento:
          titolo: La leva che scivola
          testo: |
            Una leva scivola e il pilota libera una mano, e risalite senza la
            Carta contando le teste due volte. Il ragazzo che ha esitato non ti
            guarda per tutto il viaggio.
          effetti: { ferite: 1, tormento: 1.5 }
          vai: superficie-fratturata
