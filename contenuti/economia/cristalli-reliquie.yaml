# L'economia della città, strato 1: le conversioni di Cristalli e Reliquie (quality e luoghi in economia.yaml).
# Cristalli: il crogiolo di Bram alla Fucina dei Due Mastini (frammenti esausti → cristalli sterili), il banco del
# retro di Ambrin al Nodo d'Ossidiana (sterili → carichi; con rep.nodo >= 7 la cella tagliata dai carichi) e il
# banco di prova dell'Accademia (sterili → carico con una prova di magia, oppure PE di Magia da assistente).
# Reliquie: la cernita dei ragazzi dell'Orlo (schegge → frammenti incisi, più una via che raccoglie schegge), la
# stanza dei congegni della Biblioteca (frammenti incisi → meccanismo spento) e la consegna al Velo, la via di lato
# che paga poco e toglie Tormento e Contaminazione.
# Tutti ripetibili. I numeri stanno solo negli effetti (docs/stile-dei-testi.md, regola 11).
storylet:
  # ------------------------------------------------------------ B1 · frammenti esausti → cristalli sterili
  - id: il-crogiolo-di-bram
    presso: fucina-dei-due-mastini
    immagine: ambientazione/fucina-dei-due-mastini
    titolo: Il crogiolo di Bram
    sommario: "Accanto alla forgia Bram Halgast tiene un crogiolo dove i frammenti di cristallo esausti tornano limpidi."
    luogo: Fucina dei Due Mastini, il crogiolo
    area: citta-bassa
    ripetibile: true
    requisiti: []
    testo: |
      Accanto alla forgia Bram Halgast tiene un crogiolo di terra refrattaria
      dove fonde i frammenti di cristallo esausti che all'Orlo si vendono a
      peso, e dalla forma escono cristalli sterili e limpidi.

      Gliel'ha insegnato un Raschiatore rimasto poi nel Labirinto. «I maghi ci
      mettono la luce e se ne fanno il vanto» dice Bram, sputando nella
      cenere.

      {origine figlio-della-citta-bassa} Da bambino giravi al largo dalla
      soglia di Bram per via dei mastini, e lo fai ancora di mezzo passo.

      {origine apprendista-raschiatore} Sul Ponte dei Morti c'è una lanterna
      accesa per quel Raschiatore, e ti chiedi quale sia.
    opzioni:
      - testo: "Lasciare a Bram i frammenti e aspettare"
        descrizione: "Bram li fonde quando il crogiolo è libero, e per il disturbo si tiene una parte della pasta."
        requisiti: [cristalli.frammento-esausto >= 6]
        esito:
          titolo: La forma di ferro
          testo: |
            Rovesci i frammenti su un'asse e Bram li conta con un dito nero di
            carbone, poi li butta nel crogiolo e torna all'incudine. Passi il
            pomeriggio sulla soglia, con i mastini che ti annusano le tasche a
            turno. Verso sera Bram rompe la forma e ti mette in mano i cristalli
            sterili ancora caldi. Il resto della pasta lo versa in un secchio suo,
            senza prendersi la briga di nasconderlo.
          effetti: { cristalli.frammento-esausto: -6, cristalli.cristallo-sterile: 2 }

      - testo: "Una giornata al crogiolo"
        descrizione: "Con una scorta grossa Bram accende il crogiolo all'alba, e tu resti a dargli una mano fino a sera."
        costo: 2
        requisiti: [cristalli.frammento-esausto >= 15]
        esito:
          titolo: Dall'alba al tramonto
          testo: |
            Arrivi che la Città Bassa dorme ancora e Bram sta già attizzando il
            crogiolo. Fino a sera lui pensa alla pasta e tu alle forme, che vanno
            scaldate prima e raffreddate piano nella sabbia. Al tramonto hai le
            sopracciglia bruciacchiate e una fila di cristalli sterili sull'asse,
            e Bram ammette che con il fuoco acceso dall'alba se ne perdono meno.
          effetti: { cristalli.frammento-esausto: -15, cristalli.cristallo-sterile: 6 }

      - testo: "Tenere tu il mantice"
        descrizione: "Il crogiolo vuole un calore che non cali mai, e Bram dice che al mantice piccolo basta avere fiato."
        requisiti: [cristalli.frammento-esausto >= 5]
        prova: { attributo: fisico, abilita: [resistenza, atletica], difficolta: Media }
        successo:
          titolo: Il calore bianco
          testo: |
            Pompi il mantice piccolo con un ritmo lento e uguale, contando i colpi
            a mezza voce, e il fuoco passa dal giallo al bianco e ci resta. Dopo
            un'ora le braccia ti bruciano fino alle ascelle. La pasta gira nel
            crogiolo senza grumi, e Bram ti consegna i cristalli sterili tenendosi
            una parte più piccola del solito.
          effetti: { cristalli.frammento-esausto: -5, cristalli.cristallo-sterile: 2 }
        fallimento:
          titolo: La fiammata
          testo: |
            A metà lavoro perdi il ritmo e per recuperare spingi troppo forte. La
            fiammata ti lecca il dorso della mano e la pasta si riempie di bolle.
            Bram ti toglie la leva, ti infila la mano nel secchio dell'acqua e ti
            dice cosa pensa di te. Dalla forma escono meno cristalli buoni del
            solito, e quello venuto storto finisce sulla mensola con gli altri.
          effetti: { cristalli.frammento-esausto: -5, cristalli.cristallo-sterile: 1, ferite: 0.5 }

  # ------------------------------------------------------------ B2 · cristalli sterili → carichi, e la cella
  - id: ricaricare-al-nodo
    presso: mercato-dei-nodi
    immagine: personaggi/ambrin-qell
    titolo: Il banco del retro
    sommario: "Di sera, nel retrobottega del Nodo d'Ossidiana, Ambrin Qell mette il Mana nei cristalli sterili."
    luogo: Il Nodo d'Ossidiana, il retrobottega
    area: ponti-sospesi
    ripetibile: true
    requisiti: [rep.nodo >= 3]
    testo: |
      Nel retrobottega del Nodo d'Ossidiana, su un banco di feltro scuro, c'è
      un anello d'ottone. La sera, a bottega chiusa, Ambrin Qell ci dispone
      dentro i cristalli sterili e ci scrive sopra una formula, poi tiene le
      mani aperte su di loro finché gli si sbiancano le dita.

      «La carica non entra in tutti» dice sorridendo. «Su una manciata uno la
      prende e gli altri si incrinano, ma la polvere la tengo io per gli
      inchiostri.»

      {origine mercante-dei-ponti} Al Mercato dei Nodi i suoi inchiostri si
      vendono a peso d'oro, e adesso sai da dove viene la polvere.
    opzioni:
      - testo: "Lasciare i cristalli ad Ambrin"
        descrizione: "Glieli lasci la sera e torni la mattina dopo. Quelli che si incrinano finiscono nei suoi inchiostri."
        requisiti: [cristalli.cristallo-sterile >= 4]
        esito:
          titolo: Quello che pulsa
          testo: |
            Torni la mattina dopo, quando il Mercato riapre. Ambrin ti aspetta al
            bancone con una scatolina foderata di lana e la apre adagio davanti a te.
            Dentro pulsa un cristallo carico, di una luce azzurra che ti si riflette
            sulle unghie, mentre gli altri sono polvere luccicante in un barattolo già
            etichettato. «Uno su una manciata, come ti avevo detto. Il corvo aveva
            scommesso su meno.»
          effetti: { cristalli.cristallo-sterile: -4, cristalli.cristallo-carico: 1 }

      - testo: "Una notte intera al banco del retro"
        descrizione: "Se qualcuno gira i cristalli nell'anello al momento giusto se ne incrinano meno. Ci vuole tutta la notte."
        costo: 2
        requisiti: [cristalli.cristallo-sterile >= 9]
        esito:
          titolo: Il corvo che annuisce
          testo: |
            Ambrin scrive la formula e tiene le mani sopra l'anello, e a te tocca
            girare ogni cristallo di un poco quando lui annuisce. Andate avanti
            per ore, e a un certo punto ti accorgi che il corvo annuisce un
            momento prima di lui. All'alba i cristalli carichi sul feltro sono più
            di quanti ti aspettassi, e Ambrin dice che da solo non gliene vengono
            mai così tanti.
          effetti: { cristalli.cristallo-sterile: -9, cristalli.cristallo-carico: 3 }

      - testo: "Far tagliare una cella"
        descrizione: "Al Nodo una cella costa quanto una casa sui Ponti. A te Ambrin la taglia dai tuoi cristalli carichi."
        quando: [rep.nodo >= 7]
        costo: 2
        requisiti: [cristalli.cristallo-carico >= 5]
        esito:
          titolo: La cella
          testo: |
            Ambrin stringe i tuoi cristalli carichi l'uno contro l'altro
            nell'anello, e per tutta la notte la luce passa dall'uno all'altro fino
            a raccogliersi in quello al centro. All'alba lo taglia e ti consegna una
            cella grande come un'unghia che ti fa formicolare il palmo. «Fa
            ripartire un reperto che dorme da secoli, ma tienila in una scatola e
            non dormirci accanto» dice chiudendoti le dita sopra.
          effetti: { cristalli.cristallo-carico: -5, cella: 1 }

  # ------------------------------------------------------------ B3 · caricare a mano, all'Accademia
  - id: il-banco-di-prova
    presso: accademia-di-torvessa
    immagine: ambientazione/cristalli-conduttori
    titolo: Il banco di prova
    sommario: "Nel laboratorio dell'Accademia gli allievi caricano i cristalli delle lanterne, e chi sa farlo ne carica uno per sé."
    luogo: Accademia di Torvessa, il laboratorio
    area: quartieri-alti
    ripetibile: true
    requisiti: [rep.accademia >= 3]
    testo: |
      In fondo al corridoio delle aule, nel laboratorio, c'è il banco di
      prova, un piano di pietra nera solcato da canaline di rame dove gli
      allievi del terzo anno caricano i cristalli delle lanterne.

      Quando un cristallo prende male la carica, il Mana torna indietro lungo
      le braccia di chi lo tiene, e i ragazzi lavorano con i guanti di pelle,
      in silenzio. Pett, sulla trave sopra il banco, gracchia piano quando
      qualcuno sbaglia, prima ancora che se ne accorga.

      {origine allievo-di-torvessa} Dalla trave Pett ti guarda con un occhio e
      poi con l'altro, come a lezione.
    opzioni:
      - testo: "Caricare un cristallo al banco"
        descrizione: "Posi i cristalli sterili nelle canaline, metti i palmi sul rame e spingi dentro il Mana, piano."
        requisiti: [cristalli.cristallo-sterile >= 3]
        prova: { attributo: mentale, abilita: [magia, tecnologia], difficolta: Difficile }
        successo:
          titolo: La venatura azzurra
          testo: |
            Infili i guanti, posi i cristalli nelle canaline e appoggi i palmi sul
            rame. Il Mana comincia a scorrere dalle tue mani verso la pietra, e lo
            spingi avanti un poco alla volta. I primi cristalli si incrinano con
            un rumore da ghiaccio sottile, mentre l'ultimo si accende di una
            venatura azzurra. Pett scende a guardarlo da vicino e torna sulla
            trave senza gracchiare.
          effetti: { cristalli.cristallo-sterile: -3, cristalli.cristallo-carico: 1 }
        fallimento:
          titolo: Il ritorno
          testo: |
            Spingi il Mana troppo in fretta, e il primo cristallo te lo rimanda
            indietro tutto insieme. La scossa ti risale le braccia fino ai denti e
            i cristalli sul banco si incrinano. Un allievo del terzo anno ti sfila
            i guanti e ti fa sedere con la testa fra le ginocchia. Per molte notti
            sogni il banco di prova con le canaline piene d'acqua nera.
          effetti: { cristalli.cristallo-sterile: -3, ferite: 0.5, tormento: 1 }

      - testo: "Fare da assistente a chi carica"
        descrizione: "Un'allieva del terzo anno cerca qualcuno che le tenga fermi i cristalli. Il cristallo per provare lo porti tu."
        requisiti: [cristalli.cristallo-sterile >= 1]
        esito:
          titolo: Le mani ferme
          testo: |
            L'allieva porta la treccia infilata sotto il colletto, perché le punte
            le ha già bruciate una volta. Tieni fermi i cristalli mentre lei
            spinge il Mana, e senti la carica passarti sotto le dita come acqua
            tiepida. Alla fine ti lascia provare con il tuo, che si incrina subito
            con un suono piccolo, e lei ti mostra dove hai sbagliato tenendoti il
            polso.
          effetti: { cristalli.cristallo-sterile: -1 }
          pe: { magia: 4 }

  # ------------------------------------------------------------ B4 · schegge → frammenti incisi
  - id: la-cernita-dell-orlo
    presso: orlo-dei-rottami
    immagine: ambientazione/orlo-dei-rottami
    titolo: La cernita dell'Orlo
    sommario: "I ragazzi dell'Orlo sanno quali schegge vengono dallo stesso pezzo, e ricomposte valgono molto di più."
    luogo: Orlo dei Rottami, dietro le baracche
    area: citta-bassa
    ripetibile: true
    requisiti: []
    testo: |
      Dietro le baracche dell'Orlo dei Rottami i ragazzi fanno la cernita su un
      telo cerato. Dividono le schegge precuriane secondo il verso delle
      incisioni e incollano quelle dello stesso pezzo, finché diventano un
      frammento inciso che vale molto di più.

      Il capo, quello con l'ingranaggio al collo, dirige da un bidone
      rovesciato, e dalla tettoia Grusk vi guarda con una bottiglia sul
      ginocchio. «I segni li leggono i ragazzi, e Grusk non chiede» dice quando
      ti vede arrivare.

      {origine apprendista-raschiatore} Sulle piattaforme i ragazzi dell'Orlo
      arrivano così, con le mani già svelte e la paura tutta da imparare.
    opzioni:
      - testo: "Pagare i ragazzi per la cernita"
        descrizione: "I ragazzi fanno la cernita e si tengono come paga le schegge che avanzano."
        requisiti: [reliquie.scheggia >= 6]
        esito:
          titolo: Il telo cerato
          testo: |
            Rovesci le tue schegge sul telo e i ragazzi ci si chinano sopra tutti
            insieme. In un'ora i pezzi che combaciano sono incollati e messi ad
            asciugare su una lamiera. Le schegge avanzate finiscono nella tasca
            del capo, che prima te le mostra a una a una, così vedi che non sono
            quelle buone.
          effetti: { reliquie.scheggia: -6, reliquie.frammento-inciso: 2 }

      - testo: "Un giorno intero sulle lamiere"
        descrizione: "Con un mucchio grosso i pezzi che combaciano si trovano più facilmente, però ci va la giornata."
        costo: 2
        requisiti: [reliquie.scheggia >= 15]
        esito:
          titolo: Sotto il sole dell'Orlo
          testo: |
            Passi la giornata in ginocchio sul telo con i ragazzi, a girare
            schegge fra le dita finché i bordi combaciano. Con un mucchio così
            grosso i pezzi si ritrovano quasi da soli, e il capo si mette a
            incollare anche lui. Verso sera una fila di frammenti incisi asciuga
            sulla lamiera, e Grusk li conta più volte ottenendo ogni volta un
            numero diverso.
          effetti: { reliquie.scheggia: -15, reliquie.frammento-inciso: 6 }

      - testo: "Ricomporre tu i pezzi"
        descrizione: "Se i bordi li trovi da solo, ai ragazzi non devi niente. Il capo ti guarda lavorare a braccia incrociate."
        requisiti: [reliquie.scheggia >= 4]
        prova: { attributo: mentale, abilita: [percezione, accademiche], difficolta: Media }
        successo:
          titolo: Il verso delle incisioni
          testo: |
            Ti accorgi presto che le incisioni girano tutte nello stesso senso, come i
            solchi di un pollice, e basta seguirle per trovare il pezzo accanto. Le
            schegge combaciano una dopo l'altra e non ne butti quasi nessuna. Il capo
            scioglie le braccia e ti chiede chi te l'ha insegnato, e quando gli dici
            che l'hai capito adesso torna sul suo bidone a tenerti d'occhio.
          effetti: { reliquie.scheggia: -4, reliquie.frammento-inciso: 2 }
        fallimento:
          titolo: I bordi sbagliati
          testo: |
            Dopo un'ora ti accorgi che hai incollato insieme pezzi di oggetti
            diversi, e quando provi a staccarli alcuni si spezzano lungo
            l'incisione. Il capo ti guarda senza ridere, con le braccia ancora
            incrociate. Dal mucchio salvi poco, e il resto lo raccoglie lui per la
            cernita di domani.
          effetti: { reliquie.scheggia: -4, reliquie.frammento-inciso: 1 }

      - testo: "Frugare con i ragazzi fra gli scarti"
        descrizione: "I ragazzi sanno dove i Raschiatori scaricano la roba migliore, e se li segui qualche scheggia la trovi."
        esito:
          titolo: Il carro dei Raschiatori
          testo: |
            Il capo ti porta al punto della riva dove i Raschiatori rovesciano i
            carri e ti fa stendere dietro una lamiera finché l'ultimo non riparte.
            Poi i ragazzi corrono giù tutti insieme, e tu dietro. Nel mucchio
            ancora tiepido trovi qualche scheggia incisa prima che arrivi la
            carriola rossa a prendersi il resto, e il capo te la lascia con l'aria
            di farti un regalo.
          effetti: { reliquie.scheggia: 2 }

  # ------------------------------------------------------------ B5 · frammenti incisi → meccanismo spento
  - id: rimontare-un-meccanismo
    presso: biblioteca-di-qir-azel
    immagine: ambientazione/rovine-dei-precursori
    titolo: La stanza dei congegni
    sommario: "Al primo piano della Biblioteca i frammenti incisi delle spedizioni si rimontano in congegni interi, che non si muovono."
    luogo: Biblioteca di Qir-Azel, la stanza dei congegni
    area: quartieri-alti
    ripetibile: true
    requisiti: [rep.biblioteca >= 3]
    testo: |
      Al primo piano della Biblioteca, accanto allo studio di Mattias Crenn,
      c'è la stanza dove finisce quello che le spedizioni riportano dalle
      rovine. Sugli scaffali stanno le tavole di montaggio di un secolo fa,
      con le parti disegnate una per una e i nomi lasciati in bianco, e
      seguendole i frammenti incisi diventano un congegno intero che non si
      muove.

      Mattias passa ogni mezz'ora, si pulisce le lenti sulla manica e guarda
      il lavoro da sopra la tua spalla. «Si fa, si fa» dice, anche quando non
      si fa.
    opzioni:
      - testo: "Rimontare un meccanismo con i manuali"
        descrizione: "Le tavole di montaggio sono lente da seguire, e qualche pezzo avanza sempre. Il congegno però viene intero."
        requisiti: [reliquie.frammento-inciso >= 4]
        esito:
          titolo: Con le tavole
          testo: |
            Apri la tavola giusta sul panno verde e segui le parti una per una,
            girando i frammenti finché le incisioni proseguono senza salti. A sera
            il congegno è intero, grande come un pane, e quando lo scuoti non
            tintinna. Qualche frammento resta fuori perché sulla tavola non c'era
            posto, e Mattias lo mette nel cassetto con l'etichetta *avanzi*, già
            pieno fino all'orlo.
          effetti: { reliquie.frammento-inciso: -4, reliquie.meccanismo-spento: 1 }

      - testo: "Lavorare a occhio, senza manuali"
        descrizione: "Chi conosce i congegni ci mette meno pezzi e meno tempo. Gli altri ci rimettono le dita."
        requisiti: [reliquie.frammento-inciso >= 3]
        prova: { attributo: mentale, abilita: [tecnologia, accademiche], difficolta: Difficile }
        successo:
          titolo: Senza avanzi
          testo: |
            Lasci le tavole sullo scaffale e guardi i frammenti finché ti sembrano
            le parti di un oggetto solo. Quando l'ultimo entra al suo posto senti
            uno scatto leggero, come una serratura che si chiude, e non è avanzato
            niente. Mattias va a cercare la tavola corrispondente per controllare
            e, quando non la trova, torna con un quaderno vuoto e una penna.
          effetti: { reliquie.frammento-inciso: -3, reliquie.meccanismo-spento: 1 }
        fallimento:
          titolo: Lo scatto
          testo: |
            Per un po' sembra funzionare, poi un pezzo entra nel posto sbagliato e
            il congegno si chiude sulle tue dita come una tagliola. Quando le
            liberi hai le unghie nere e i frammenti incrinati lungo le incisioni.
            Mattias ti fascia la mano con un fazzoletto, parlando di un collega
            che ci aveva lasciato un mignolo, e mette i pezzi rotti nel cassetto
            degli avanzi.
          effetti: { reliquie.frammento-inciso: -3, ferite: 0.5 }

  # ------------------------------------------------------------ B6 · la via di lato, il Velo
  - id: consegnare-al-velo
    presso: cattedrale-del-velo
    immagine: ambientazione/cattedrale-del-velo
    titolo: Consegnare al Velo
    sommario: "Il Velo ritira i congegni dei Precursori per sigillarli nella Cripta, e a chi li consegna offre la purificazione."
    luogo: Cattedrale del Velo, la porta della sagrestia
    area: quartieri-alti
    ripetibile: true
    requisiti: []
    testo: |
      Accanto alla porta della sagrestia c'è una cassa di legno chiaro per i
      congegni dei Precursori che il Velo ritira e mura nella Cripta, e
      Ottilia Sanvel li registra su una tavoletta di cera.

      «La Madre li vuole sotto terra» dice Ottilia senza alzare gli occhi.
      «Chi li tiene in casa viene da noi lo stesso, con i sogni.»

      {origine accolito-del-velo} Ottilia non ti guarda in faccia nemmeno
      adesso, e tu giungi le mani come da novizio.

      Più in là Sorella Arva tiene sulle ginocchia la cassetta delle offerte
      e il registro dei prestiti.
    opzioni:
      - testo: "Consegnare un meccanismo da sigillare"
        descrizione: "Il Velo paga un'offerta piccola, e in cambio un accolito ti impone le mani prima che tu esca."
        requisiti: [reliquie.meccanismo-spento >= 1]
        esito:
          titolo: Nella tela cerata
          testo: |
            Ottilia avvolge il congegno nella tela cerata senza guardarlo e lo
            posa nella cassa. Sul primo gradino della Cripta un accolito velato ti
            tiene le mani sulle tempie recitando la Preghiera del Battito, e il
            ronzio che ti porti dietro da giorni si spegne. All'uscita Sorella
            Arva ti conta qualche moneta sul palmo e ti ricorda che il registro
            dei prestiti è sempre aperto.
          effetti: { reliquie.meccanismo-spento: -1, monete: 5, tormento: -1, contaminazione: -1 }

      - testo: "Consegnare i frammenti incisi"
        descrizione: "Il Velo prende anche i pezzi sciolti, e per quelli non paga. La benedizione te la danno lo stesso."
        requisiti: [reliquie.frammento-inciso >= 3]
        esito:
          titolo: I pezzi sciolti
          testo: |
            Ottilia fa cadere i frammenti nella cassa con una paletta di legno senza
            toccarli, e sulla tavoletta scrive soltanto *frammenti* e la data. Poi ti
            traccia sulla fronte il segno dell'Albero con il pollice bagnato d'olio,
            che sa vagamente di cucina. Sulla scala del ritorno ti accorgi che hai le
            spalle più leggere.
          effetti: { reliquie.frammento-inciso: -3, tormento: -0.5 }
