# L'economia della città, strato 1: le conversioni di Cristalli e Reliquie (quality e luoghi in economia.yaml).
# Cristalli: il crogiolo di Bram alla Fucina dei Due Mastini (frammenti esausti → cristalli sterili), il banco del
# retro di Ambrin al Nodo d'Ossidiana (sterili → carichi; con rep.nodo >= 7 la cella tagliata dai carichi) e il
# banco di prova dell'Accademia (sterili → carico con una prova di magia, oppure PE di Magia da assistente).
# Reliquie: la cernita dei ragazzi dell'Orlo (schegge → frammenti incisi, più una via che raccoglie schegge), la
# stanza dei congegni della Biblioteca (frammenti incisi → meccanismo spento) e la consegna al Velo, la via di lato
# che paga poco e toglie Tormento e Contaminazione.
# Tutti ripetibili. I numeri stanno solo negli effetti (docs/stile-dei-testi.md, regola 11).
storylet:
  # ------------------------------------------------------------ B1 · frammenti esausti → cristalli sterili
  - id: il-crogiolo-di-bram
    presso: fucina-dei-due-mastini
    immagine: ambientazione/fucina-dei-due-mastini
    titolo: Il crogiolo di Bram
    sommario: "Accanto alla forgia Bram Halgast tiene un crogiolo dove i frammenti di cristallo esausti tornano limpidi."
    luogo: Fucina dei Due Mastini, il crogiolo
    area: citta-bassa
    ripetibile: true
    requisiti: []
    testo: |
      A sinistra della forgia, su un fuoco tutto suo, Bram Halgast tiene un
      crogiolo di terra refrattaria grande come un secchio, e il calore ti
      secca gli occhi da tre passi. Ci butta dentro i frammenti di cristallo
      esausti, quelli opachi che all'Orlo si vendono a peso, e li lascia sul
      calore bianco finché diventano una pasta lattiginosa. Dalla forma di
      ferro esce un cristallo sterile limpido, che però di Mana non ne ha.

      {magia Media} Lo senti anche da qui, quel vuoto pulito. Le dita ti
      prudono dalla voglia di riempirlo.

      Il sistema glielo ha insegnato anni fa un vecchio Raschiatore che non
      poteva pagargli un piccone. «Lui è rimasto nel Labirinto. Il piccone
      invece l'hanno riportato su, perché roba mia non si rompe» dice Bram, e
      sputa nella cenere. «I maghi ci mettono dentro la luce e poi lo
      rivendono come se l'avessero fatto loro.»

      {conoscenze-della-strada Facile} Bram vende a peso e i maghi rivendono
      a pezzo. Fra i due prezzi ci sta comodo un palazzo dei Quartieri Alti.

      Sulla mensola sopra il crogiolo c'è una fila di cristalli venuti storti,
      che tiene lì per ricordarsi come non si fa. *Uno ha la forma di un cane
      accucciato.* Quello Bram l'ha girato verso il muro, e non lo spolvera
      mai.
    opzioni:
      - testo: "Lasciare a Bram i frammenti e aspettare"
        descrizione: "Bram li fonde quando il crogiolo è libero, e per il disturbo si tiene una parte della pasta."
        requisiti: [cristalli.frammento-esausto >= 6]
        esito:
          titolo: La forma di ferro
          testo: |
            Rovesci il sacchetto dei frammenti su un'asse, e Bram li conta con
            un dito nero di carbone, muovendo le labbra. Poi li butta nel
            crogiolo e torna all'incudine senza pensarci più. Passi il
            pomeriggio sulla soglia accanto ai mastini, che ti lasciano un
            angolo di pietra tiepida e in cambio ti annusano le tasche a
            turno. Verso sera Bram rompe la forma con un colpo secco e ti
            mette in mano i cristalli sterili ancora caldi, così limpidi che ci
            vedi attraverso le linee del palmo. Il resto della pasta lo versa
            in un secchio suo, e non si prende la briga di nasconderlo, il che
            in fondo è una forma di onestà.
          effetti: { cristalli.frammento-esausto: -6, cristalli.cristallo-sterile: 2 }

      - testo: "Una giornata al crogiolo"
        descrizione: "Con una scorta grossa Bram accende il crogiolo all'alba, e tu resti a dargli una mano fino a sera."
        costo: 2
        requisiti: [cristalli.frammento-esausto >= 15]
        esito:
          titolo: Dall'alba al tramonto
          testo: |
            Arrivi che la Città Bassa dorme ancora, con il sacco dei frammenti
            sulla spalla, e Bram è già lì ad attizzare il crogiolo con lo
            smanicato aperto sul petto. Lavorate a turni fino a sera. Lui
            pensa alla pasta, e a te tocca preparare le forme, che vanno
            scaldate prima e raffreddate piano nella sabbia. A mezzogiorno
            dividete una pagnotta seduti sulle casse del grezzo, senza
            parlare. Quando il sole cala sulla Cicatrice hai le sopracciglia
            bruciacchiate e una fila di cristalli sterili allineati sull'asse.

            {resistenza Facile} Le mani ti tremano un poco quando posi l'ultima
            forma, e domattina ti ricorderanno ogni ora passata qui.

            Bram li guarda a lungo e ammette che con il fuoco acceso dall'alba
            se ne perdono meno.
          effetti: { cristalli.frammento-esausto: -15, cristalli.cristallo-sterile: 6 }

      - testo: "Tenere tu il mantice"
        descrizione: "Il crogiolo ha un mantice piccolo tutto suo e vuole un calore che non cali mai. Bram dice che basta avere fiato."
        requisiti: [cristalli.frammento-esausto >= 5]
        prova: { attributo: fisico, abilita: [resistenza, atletica], difficolta: Media }
        successo:
          titolo: Il calore bianco
          testo: |
            Pompi il mantice piccolo con un ritmo lento e uguale, contando i
            colpi a mezza voce, e il fuoco sotto il crogiolo passa dal giallo
            al bianco e ci resta. Dopo un'ora le braccia ti bruciano fino alle
            ascelle e il sudore ti cola negli occhi, ma i conti non li perdi.
            Bram guarda la pasta girare nel crogiolo senza grumi, e per una
            volta non bestemmia. Ti consegna i cristalli sterili e si
            tiene una parte più piccola del solito, visto che al mantice c'eri
            tu.
          effetti: { cristalli.frammento-esausto: -5, cristalli.cristallo-sterile: 2 }
        fallimento:
          titolo: La fiammata
          testo: |
            A metà lavoro perdi il ritmo, e per recuperare spingi il mantice
            troppo forte. Il fuoco sputa una fiammata che ti lecca il dorso
            della mano, e la mano si ritira da sola prima che tu senta il
            dolore. La pasta nel crogiolo si riempie di bolle. Bram ti
            toglie la leva, ti infila la mano nel secchio dell'acqua e ti dice
            cosa pensa di te con parole che i mastini conoscono già. Dalla
            forma escono meno cristalli buoni del solito, e quello venuto
            storto finisce sulla mensola insieme agli altri.
          effetti: { cristalli.frammento-esausto: -5, cristalli.cristallo-sterile: 1, ferite: 0.5 }

  # ------------------------------------------------------------ B2 · cristalli sterili → carichi, e la cella
  - id: ricaricare-al-nodo
    presso: mercato-dei-nodi
    immagine: personaggi/ambrin-qell
    titolo: Il banco del retro
    sommario: "Di sera, nel retrobottega del Nodo d'Ossidiana, Ambrin Qell mette il Mana nei cristalli sterili."
    luogo: Il Nodo d'Ossidiana, il retrobottega
    area: ponti-sospesi
    ripetibile: true
    requisiti: [rep.nodo >= 3]
    testo: |
      Nel retrobottega del Nodo d'Ossidiana, oltre il mobile a cento cassetti,
      c'è un banco basso coperto di feltro scuro, con un anello d'ottone
      inchiodato nel mezzo e intorno le bruciature delle scintille. Ambrin
      Qell ci carica i cristalli sterili la sera a bottega chiusa, quando i
      carri non fanno più tremare il pavimento. Li dispone dentro l'anello, ci
      scrive sopra una formula e tiene le mani aperte sopra di loro finché gli
      si sbiancano le dita. A te, che guardi, si rizzano i peli delle braccia.

      {magia Difficile fallita} Riconosci la formula, quasi. Poi ti accorgi
      che stai riconoscendo soltanto la grafia inclinata di Ambrin.

      «La carica non entra in tutti» dice, e sorride come se fosse una buona
      notizia. «Su una manciata di cristalli uno la prende e gli altri si
      incrinano. La polvere la tengo io per gli inchiostri, così nessuno ci
      perde.» Si scosta la ciocca rossa con il dorso della mano, perché ha le
      dita sporche d'inchiostro.

      {ingannare Media} Nessuno ci perde, a parte chi porta i cristalli. Lo
      dice con tanta grazia che quasi lo ringrazieresti.

      Ogni volta che Ambrin intinge la penna, il corvo batte il becco
      sull'anello d'ottone, piano. *Gli tiene il tempo, o gli mette fretta.*
      Dal ponte arriva soltanto il cigolio delle corde.
    opzioni:
      - testo: "Lasciare i cristalli ad Ambrin"
        descrizione: "Glieli lasci la sera e torni la mattina dopo. Quelli che si incrinano finiscono nei suoi inchiostri."
        requisiti: [cristalli.cristallo-sterile >= 4]
        esito:
          titolo: Quello che pulsa
          testo: |
            Lasci i cristalli sul feltro e torni la mattina dopo, quando il Mercato
            riapre e l'aria sa ancora di pane e di corde bagnate. Ambrin ti aspetta al
            bancone con una scatolina di legno foderata di lana e la apre davanti a
            te, adagio, perché la cosa vale la scena. Dentro c'è un cristallo carico
            che pulsa piano, di una luce azzurra che ti si riflette sulle unghie. Gli
            altri sono diventati polvere luccicante in un barattolo, già etichettato
            con la sua grafia inclinata. «Uno su una manciata, come ti avevo detto. Il
            corvo aveva scommesso su meno» dice, e richiude la scatolina con due dita.
          effetti: { cristalli.cristallo-sterile: -4, cristalli.cristallo-carico: 1 }

      - testo: "Una notte intera al banco del retro"
        descrizione: "Se qualcuno gira i cristalli nell'anello al momento giusto se ne incrinano meno. Ci vuole tutta la notte."
        costo: 2
        requisiti: [cristalli.cristallo-sterile >= 9]
        esito:
          titolo: Il corvo che annuisce
          testo: |
            Ambrin scrive la formula e tiene le mani sopra l'anello, e a te
            tocca girare ogni cristallo di un poco quando lui annuisce. Andate
            avanti per ore con le lanterne abbassate, e a un certo punto ti
            accorgi che il corvo annuisce un momento prima di lui.

            {percezione Media} E Ambrin lo guarda di sbieco ogni volta, prima di
            annuire. Chi comandi davvero al banco del retro è una questione
            aperta.

            Verso
            l'alba i cristalli che hanno preso la carica pulsano tutti insieme
            sul feltro, e sono più di quanti ti aspettassi. Ambrin si
            stiracchia finché gli scrocchia la schiena. Ti dice che da solo
            non gliene vengono mai così tanti, e che la colazione la offre
            lui.
          effetti: { cristalli.cristallo-sterile: -9, cristalli.cristallo-carico: 3 }

      - testo: "Far tagliare una cella"
        descrizione: "Al Nodo una cella costa quanto una casa sui Ponti. A te Ambrin la taglia dai tuoi cristalli carichi."
        quando: [rep.nodo >= 7]
        costo: 2
        requisiti: [cristalli.cristallo-carico >= 5]
        esito:
          titolo: La cella
          testo: |
            Ambrin mette i tuoi cristalli carichi nell'anello così vicini che
            si toccano, e ci scrive sopra una formula lunga e fitta, diversa
            da quelle solite. Per tutta la notte la luce
            passa da un cristallo all'altro e si raccoglie in quello al
            centro, mentre gli altri si spengono e diventano grigi. All'alba
            Ambrin lo taglia con una lama sottile e ti consegna un cristallo
            grande come un'unghia, così pieno che ti formicola il palmo e il
            formicolio sale fino al gomito.

            {resistenza Media} Finché la tieni in mano il cuore ti batte un poco più
            in fretta, e l'emozione c'entra poco.

            «Questa fa ripartire un reperto che dorme da secoli» dice, e te la
            chiude nel pugno con le sue dita. «Tienila in una scatola, e non
            dormirci accanto.»
          effetti: { cristalli.cristallo-carico: -5, cella: 1 }

  # ------------------------------------------------------------ B3 · caricare a mano, all'Accademia
  - id: il-banco-di-prova
    presso: accademia-di-torvessa
    immagine: ambientazione/cristalli-conduttori
    titolo: Il banco di prova
    sommario: "Nel laboratorio dell'Accademia gli allievi più grandi caricano i cristalli delle lanterne, e chi sa farlo può caricarne uno per sé."
    luogo: Accademia di Torvessa, il laboratorio
    area: quartieri-alti
    ripetibile: true
    requisiti: [rep.accademia >= 3]
    testo: |
      Il laboratorio è l'ultima stanza del corridoio delle aule, con i muri
      così spessi che la porta sembra in fondo a un cunicolo e una finestra
      stretta sulla Cicatrice. Al centro c'è il banco di prova, un piano di
      pietra nera solcato da canaline di rame, dove gli allievi del terzo anno
      caricano i cristalli per le lanterne della scuola. Sulla porta Orvald ha
      scritto *chi trema esce*, e qualcuno ci ha disegnato accanto una mano
      dalle dita storte, disegnata in tre colori d'inchiostro.

      {resistenza Media} Qui dentro la pietra tiene il freddo dell'inverno
      passato. Gli allievi hanno le nocche rosse e soffiano nei guanti fra un
      cristallo e l'altro.

      Quando un cristallo prende male la carica, il Mana torna indietro lungo
      le braccia di chi lo tiene, e per settimane si sogna sempre la stessa
      stanza. Per questo i ragazzi lavorano con i guanti di pelle e senza
      parlare. Pett sta sulla trave sopra il banco e gracchia piano quando
      qualcuno sbaglia, prima ancora che chi ha sbagliato se ne accorga.
      *Questo corvo ha visto più cristalli rotti di qualunque maestro.* Il
      rame delle canaline è verde di ossido dappertutto, tranne dove si
      appoggiano le dita.

      {resilienza Media fallita} La stessa stanza, per settimane. Ti chiedi
      quale, e la domanda ti resta addosso più a lungo di quanto vorresti.
    opzioni:
      - testo: "Caricare un cristallo al banco"
        descrizione: "Si posano i cristalli sterili nelle canaline, si mettono i palmi sul rame e si spinge il Mana dentro piano, se sai farlo."
        requisiti: [cristalli.cristallo-sterile >= 3]
        prova: { attributo: mentale, abilita: [magia, tecnologia], difficolta: Difficile }
        successo:
          titolo: La venatura azzurra
          testo: |
            Infili i guanti, posi i cristalli nelle canaline e appoggi i palmi
            sul rame. Per un po' senti solo il freddo del metallo e il tuo
            respiro, troppo rumoroso in quella stanza zitta. Poi il Mana
            comincia a scorrere dalle tue mani verso la pietra, e lo spingi
            avanti un poco alla volta. I primi cristalli si incrinano con un
            rumore da ghiaccio sottile. L'ultimo si accende di una venatura
            azzurra e comincia a pulsare. Pett scende dalla trave, lo guarda
            da vicino con un occhio solo e torna su senza gracchiare.
          effetti: { cristalli.cristallo-sterile: -3, cristalli.cristallo-carico: 1 }
        fallimento:
          titolo: Il ritorno
          testo: |
            Spingi il Mana troppo in fretta, e il primo cristallo te lo
            rimanda indietro tutto in una volta. La scossa ti risale lungo le
            braccia fino ai denti, e per qualche momento non ti viene la
            parola per dire rame. I cristalli sul banco sono incrinati da
            parte a parte. Un allievo del terzo anno ti sfila i guanti e ti fa
            sedere con la testa fra le ginocchia, svelto come uno che l'ha
            già fatto molte volte, mentre Pett gracchia dalla trave come un
            maestro che aveva ragione. Quella notte, e per molte
            altre, sogni il banco di prova con le canaline piene d'acqua nera.
          effetti: { cristalli.cristallo-sterile: -3, ferite: 0.5, tormento: 0.5 }

      - testo: "Fare da assistente a chi carica"
        descrizione: "Un'allieva del terzo anno carica i cristalli delle lanterne e le serve qualcuno che li tenga fermi. Il cristallo per provare lo porti tu."
        requisiti: [cristalli.cristallo-sterile >= 1]
        esito:
          titolo: Le mani ferme
          testo: |
            L'allieva porta la treccia infilata sotto il colletto, perché le
            punte, ti spiega, le ha già bruciate una volta. Tu tieni fermi i
            cristalli nelle canaline mentre lei spinge il Mana, e senti la
            carica passarti sotto le dita come acqua tiepida in un tubo. Alla
            fine ti lascia provare con il cristallo che hai portato, solo per
            sentire come risponde, e quello si incrina subito con un suono
            piccolo che ti dispiace più del dovuto. Lei ti racconta che al
            primo anno ne ha rotti una cassa intera, e ti mostra dove hai
            sbagliato tenendoti il polso.
          effetti: { cristalli.cristallo-sterile: -1 }
          pe: { magia: 4 }

  # ------------------------------------------------------------ B4 · schegge → frammenti incisi
  - id: la-cernita-dell-orlo
    presso: orlo-dei-rottami
    immagine: ambientazione/orlo-dei-rottami
    titolo: La cernita dell'Orlo
    sommario: "I ragazzi dell'Orlo sanno quali schegge vengono dallo stesso pezzo, e ricomposte valgono molto di più."
    luogo: Orlo dei Rottami, dietro le baracche
    area: citta-bassa
    ripetibile: true
    requisiti: []
    testo: |
      Dietro le baracche dell'Orlo dei Rottami i ragazzi hanno steso a terra
      un telo cerato e ci fanno la cernita. Rovesciano le schegge precuriane
      in un mucchio e le dividono a occhio in mucchietti più piccoli, secondo
      il verso delle incisioni. Le schegge che vengono dallo stesso pezzo
      combaciano lungo i bordi, e i ragazzi le tengono insieme con la colla
      d'ossa finché diventano un frammento inciso, che i compratori pagano
      molto meglio delle schegge sciolte. La colla puzza di stalla.

      {conoscenze-della-strada Media} La differenza di prezzo la fa la
      pazienza, che all'Orlo è l'unica merce che i ragazzi hanno in
      abbondanza.

      Il capo, quello con l'ingranaggio al collo, dirige il lavoro seduto su un
      bidone rovesciato. Dalla tettoia Grusk vi guarda con una bottiglia sul
      ginocchio e canta la solita strofa. «Grusk non sa leggere i segni» dice
      quando ti vede arrivare. «I ragazzi sì. Nessuno gliel'ha insegnato, e
      Grusk non chiede.» *Il capo conta più in fretta di me, e lo sa.* In un
      angolo del telo c'è un sasso dipinto di rosso, e il capo ti spiega che è
      il posto di un ragazzo che adesso scende con i Raschiatori.

      {empatia Facile} Accanto al sasso non si siede nessuno. Quando un ragazzo
      lo urta con il gomito, lo rimette dritto senza smettere di lavorare.
    opzioni:
      - testo: "Pagare i ragazzi per la cernita"
        descrizione: "I ragazzi fanno la cernita e si tengono le schegge che avanzano. È la loro paga, e la contano davanti a te."
        requisiti: [reliquie.scheggia >= 6]
        esito:
          titolo: Il telo cerato
          testo: |
            Rovesci le tue schegge sul telo, e i ragazzi ci si chinano sopra
            tutti insieme, con le teste che si toccano. In un'ora i pezzi che
            combaciano sono incollati e messi ad asciugare al sole su una
            lamiera. Le schegge che restano finiscono nella tasca del capo,
            che prima te le mostra a una a una, così vedi che non sono quelle
            buone. È più scrupoloso di metà dei mercanti del Mercato dei Nodi.
            Dalla tettoia Grusk applaude con la bottiglia in mano e ne versa
            metà sulla carriola.
          effetti: { reliquie.scheggia: -6, reliquie.frammento-inciso: 2 }

      - testo: "Un giorno intero sulle lamiere"
        descrizione: "Con un mucchio grosso di schegge i pezzi che combaciano si trovano più facilmente, e ne avanzano meno. Però ci va la giornata."
        costo: 2
        requisiti: [reliquie.scheggia >= 15]
        esito:
          titolo: Sotto il sole dell'Orlo
          testo: |
            Passi la giornata in ginocchio sul telo insieme ai ragazzi, a
            girare schegge fra le dita finché i bordi combaciano.

            {resistenza Facile fallita} A metà mattina le ginocchia ti
            presentano il conto, e i ragazzi, che stanno accucciati da ore
            senza un lamento, fingono di non sentirti sbuffare.

            Con un mucchio così grosso i pezzi si ritrovano quasi da soli, e il
            capo smette di dare ordini per mettersi a incollare anche lui.
            Verso sera hai i polpastrelli lucidi di colla e una fila di frammenti
            incisi che asciugano sulla lamiera. Grusk scende dalla tettoia per
            vederli da vicino e li conta più volte, e ogni volta gli torna un
            numero diverso.
          effetti: { reliquie.scheggia: -15, reliquie.frammento-inciso: 6 }

      - testo: "Ricomporre tu i pezzi"
        descrizione: "Se i bordi li trovi da solo, ai ragazzi non devi niente. Il capo ti guarda lavorare con le braccia incrociate."
        requisiti: [reliquie.scheggia >= 4]
        prova: { attributo: mentale, abilita: [percezione, accademiche], difficolta: Media }
        successo:
          titolo: Il verso delle incisioni
          testo: |
            Ti accorgi presto che le incisioni girano tutte nello stesso senso, come i
            solchi di un pollice, e basta seguirle per trovare il pezzo accanto. Le
            mani lo capiscono un momento prima della testa, e la testa le lascia fare.
            Le schegge combaciano una dopo l'altra sotto le tue dita, e non ne butti
            quasi nessuna. Il capo scioglie le braccia, si china a guardare e ti
            chiede chi te l'ha insegnato. Quando gli dici che l'hai capito adesso
            scrolla le spalle e torna sul suo bidone, e da lì ti tiene d'occhio fino a
            sera.
          effetti: { reliquie.scheggia: -4, reliquie.frammento-inciso: 2 }
        fallimento:
          titolo: I bordi sbagliati
          testo: |
            Le schegge sembrano combaciare tutte, e dopo un'ora ti accorgi che
            hai incollato insieme pezzi di oggetti diversi. Quando provi a
            staccarli alcuni si spezzano lungo l'incisione, con un rumore
            secco che ti arriva ai denti. Il capo ti guarda senza ridere, con
            le braccia ancora incrociate, ed è peggio. Alla fine dal
            mucchio salvi poco, e il resto lo raccoglie lui per la cernita di
            domani.
          effetti: { reliquie.scheggia: -4, reliquie.frammento-inciso: 1 }

      - testo: "Frugare con i ragazzi fra gli scarti"
        descrizione: "I ragazzi sanno dove i Raschiatori scaricano la roba migliore. Se li segui senza farti notare, qualche scheggia la trovi anche tu."
        esito:
          titolo: Il carro dei Raschiatori
          testo: |
            Il capo ti porta fino al punto della riva dove i Raschiatori
            rovesciano i carri, e ti fa stendere dietro una lamiera finché
            l'ultimo carro non riparte.

            {furtivita Facile} I ragazzi respirano con la bocca aperta, e
            nessuno sporge un gomito oltre il bordo della lamiera.

            Poi i ragazzi corrono giù tutti insieme, e tu dietro di loro. Frughi nel
            mucchio ancora tiepido di polvere e trovi qualche scheggia incisa fra i
            cavi, prima che arrivi la carriola rossa a prendersi il resto. Il capo
            controlla quello che hai in mano e ti lascia tenere tutto, con l'aria di
            farti un regalo.
          effetti: { reliquie.scheggia: 2 }

  # ------------------------------------------------------------ B5 · frammenti incisi → meccanismo spento
  - id: rimontare-un-meccanismo
    presso: biblioteca-di-qir-azel
    immagine: ambientazione/rovine-dei-precursori
    titolo: La stanza dei congegni
    sommario: "Al primo piano della Biblioteca i frammenti incisi delle spedizioni si rimontano in congegni interi, che non si muovono."
    luogo: Biblioteca di Qir-Azel, la stanza dei congegni
    area: quartieri-alti
    ripetibile: true
    requisiti: [rep.biblioteca >= 3]
    testo: |
      La Biblioteca manda ogni stagione una spedizione nelle rovine, e quello
      che torna, quando torna, finisce al primo piano, in una stanza accanto
      allo studio di Mattias Crenn. Ci sono due tavoli di quercia coperti di
      panno verde, e su uno è avvitata una morsa da orologiaio. Sugli
      scaffali stanno le tavole di montaggio ricopiate dagli studiosi di un
      secolo fa, con le parti disegnate una per una e i nomi lasciati in
      bianco perché nessuno li conosceva. Seguendo le tavole, i frammenti
      incisi si rimettono insieme in un congegno intero. Il congegno resta
      fermo, e nessuno sa dire a cosa servisse.

      {accademiche Media} Un secolo di studiosi ha disegnato ogni vite con
      amore, e non ha dato un nome a niente. Ti sembra una forma di rispetto,
      oppure di prudenza.

      Mattias passa dalla porta aperta ogni mezz'ora, si pulisce le lenti
      sulla manica e guarda il lavoro da sopra la tua spalla. «Si fa, si fa»
      dice, anche quando non si fa. Sulla parete di fondo è appeso un congegno
      che qualcuno ha rimontato al contrario anni fa, e Mattias lo ha lasciato
      lì apposta, con un'etichetta attaccata sotto, *esempio*.

      {tecnologia Difficile} Rimontato al contrario, eppure gli ingranaggi si
      toccano tutti. Chi l'ha fatto aveva un'altra idea, e ci ha creduto
      fino all'ultima vite.
    opzioni:
      - testo: "Rimontare un meccanismo con i manuali"
        descrizione: "Le tavole di montaggio sono lente da seguire, e qualche pezzo avanza sempre. Il congegno però viene intero."
        requisiti: [reliquie.frammento-inciso >= 4]
        esito:
          titolo: Con le tavole
          testo: |
            Apri la tavola giusta sul panno verde e segui le parti una per
            una, girando i frammenti finché le incisioni proseguono da un
            pezzo all'altro senza salti. Ti fa male il collo a furia di stare
            chino. A sera il congegno è intero, grande come un pane, e quando
            lo scuoti non tintinna, il che ti dà una soddisfazione
            sproporzionata. Qualche frammento
            è rimasto fuori, perché sulla tavola non c'era posto.
            Mattias li mette in un cassetto con l'etichetta *avanzi*, già
            pieno fino all'orlo, e ti dice che un giorno qualcuno capirà a
            cosa servono gli avanzi.
          effetti: { reliquie.frammento-inciso: -4, reliquie.meccanismo-spento: 1 }

      - testo: "Lavorare a occhio, senza manuali"
        descrizione: "Chi conosce i congegni ci mette meno pezzi e meno tempo. Gli altri ci rimettono le dita."
        requisiti: [reliquie.frammento-inciso >= 3]
        prova: { attributo: mentale, abilita: [tecnologia, accademiche], difficolta: Difficile }
        successo:
          titolo: Senza avanzi
          testo: |
            Lasci le tavole sullo scaffale e guardi i frammenti finché ti
            sembrano le parti di un oggetto solo. Li incastri seguendo le
            incisioni, e quando l'ultimo entra al suo posto senti uno scatto
            leggero, come una serratura che si chiude. Il congegno è intero e
            non è avanzato niente. Mattias si ferma sulla porta con le lenti
            in mano, lo guarda a lungo e poi va a prendere la tavola
            corrispondente per controllare. Non la trova, e torna con un
            quaderno vuoto e una penna.

            {espressivita Media} Si siede di fronte a te con il quaderno
            aperto, e ti guarda come si guarda un attore che ha appena
            improvvisato la scena migliore della serata.
          effetti: { reliquie.frammento-inciso: -3, reliquie.meccanismo-spento: 1 }
        fallimento:
          titolo: Lo scatto
          testo: |
            Incastri i frammenti a occhio e per un po' sembra funzionare. Poi
            un pezzo entra nel posto sbagliato con uno scatto, e il congegno
            si chiude di colpo sulle tue dita come una tagliola. Quando riesci
            a liberarle hai le unghie nere e i frammenti incrinati lungo le
            incisioni. Il dolore arriva dopo e si mette comodo. Mattias
            ti fascia la mano con un fazzoletto pulito, parlando a raffica di
            un collega che ci aveva lasciato un mignolo, cosa che in quel
            momento non ti consola, e mette i pezzi rotti nel cassetto degli
            avanzi.
          effetti: { reliquie.frammento-inciso: -3, ferite: 0.5 }

  # ------------------------------------------------------------ B6 · la via di lato, il Velo
  - id: consegnare-al-velo
    presso: cattedrale-del-velo
    immagine: ambientazione/cattedrale-del-velo
    titolo: Consegnare al Velo
    sommario: "Il Velo ritira i congegni dei Precursori per sigillarli nella Cripta, e a chi li consegna offre la purificazione."
    luogo: Cattedrale del Velo, la porta della sagrestia
    area: quartieri-alti
    ripetibile: true
    requisiti: []
    testo: |
      Accanto alla porta della sagrestia c'è una cassa di legno chiaro, e
      sopra una tavoletta di cera dove Ottilia Sanvel registra quello che ci
      finisce dentro. Il Velo ritira i congegni dei Precursori che girano per
      la città, li avvolge nella tela cerata e li porta nella Cripta, dove
      vengono murati in nicchie sigillate con il segno dell'Albero. A chi li
      consegna non chiede da dove vengano. Dalla sagrestia esce odore di
      cera, e ti viene da abbassare la voce anche se stai zitto.

      «La Madre vuole che restino sotto terra» dice Ottilia, senza alzare gli
      occhi dalla tavoletta. «A chi li porta diamo la purificazione e
      un'offerta piccola. Chi li tiene in casa poi viene da noi lo stesso, con
      i sogni.» Scrive mentre parla, una riga per ogni oggetto con la data
      accanto e nient'altro.

      {galateo Facile} Non ti ha guardato in faccia una volta. Nella casa
      della Madre la cortesia è riservata alle reliquie.

      Più in là Sorella Arva aspetta con la cassetta delle offerte aperta
      sulle ginocchia. *Paga poco, e sa benissimo quanto ci darebbe la Gilda.*
      Accanto alla cassetta tiene il registro dei prestiti, nel caso tu ne
      avessi bisogno, con un nastro rosso a segnare la pagina.
    opzioni:
      - testo: "Consegnare un meccanismo da sigillare"
        descrizione: "Il Velo paga un'offerta piccola, e in cambio un accolito ti impone le mani prima che tu esca."
        requisiti: [reliquie.meccanismo-spento >= 1]
        esito:
          titolo: Nella tela cerata
          testo: |
            Ottilia avvolge il congegno nella tela cerata con gesti rapidi e
            senza guardarlo, poi lo posa nella cassa insieme agli altri. Un
            accolito velato ti accompagna fino al primo gradino della Cripta e
            ti tiene le mani sulle tempie mentre recita la Preghiera del
            Battito. Senti il freddo delle sue dita scendere lungo il collo, e
            il ronzio che ti porti dietro da giorni si abbassa fino a sparire.

            {resilienza Facile} Le spalle ti scendono di un dito. Non sapevi di
            tenerle così alte.
            All'uscita Sorella Arva ti conta qualche moneta sul palmo una alla
            volta. Prima di lasciarti andare ti ricorda che il registro dei
            prestiti è sempre aperto.
          effetti: { reliquie.meccanismo-spento: -1, monete: 5, tormento: -1, contaminazione: -1 }

      - testo: "Consegnare i frammenti incisi"
        descrizione: "Il Velo prende anche i pezzi sciolti, e per quelli non paga. La benedizione te la danno lo stesso."
        requisiti: [reliquie.frammento-inciso >= 3]
        esito:
          titolo: I pezzi sciolti
          testo: |
            Ottilia guarda i frammenti incisi nel tuo palmo e li fa cadere nella cassa
            senza toccarli, con una paletta di legno. Sulla tavoletta di cera scrive
            soltanto *frammenti*, e la data. Poi ti fa segno di chinare la testa e ti
            traccia sulla fronte il segno dell'Albero con il pollice bagnato d'olio,
            che sa vagamente di cucina, e ti viene in mente una minestra che non mangi
            da anni. Sulla scala del ritorno ti accorgi che hai le spalle più leggere,
            e che per tutto il giorno non hai pensato alle incisioni.
          effetti: { reliquie.frammento-inciso: -3, tormento: -0.5 }
