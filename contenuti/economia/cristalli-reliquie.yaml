# L'economia della città, strato 1: le conversioni di Cristalli e Reliquie (quality e luoghi in economia.yaml).
# Cristalli: il crogiolo di Bram alla Fucina dei Due Mastini (frammenti esausti → cristalli sterili), il banco del
# retro di Ambrin al Nodo d'Ossidiana (sterili → carichi; con rep.nodo >= 7 la cella tagliata dai carichi) e il
# banco di prova dell'Accademia (sterili → carico con una prova di magia, oppure PE di Magia da assistente).
# Reliquie: la cernita dei ragazzi dell'Orlo (schegge → frammenti incisi, più una via che raccoglie schegge), la
# stanza dei congegni della Biblioteca (frammenti incisi → meccanismo spento) e la consegna al Velo, la via di lato
# che paga poco e toglie Tormento e Contaminazione.
# Tutti ripetibili. I numeri stanno solo negli effetti (docs/stile-dei-testi.md, regola 11).
storylet:
  # ------------------------------------------------------------ B1 · frammenti esausti → cristalli sterili
  - id: il-crogiolo-di-bram
    presso: fucina-dei-due-mastini
    immagine: ambientazione/fucina-dei-due-mastini
    titolo: Il crogiolo di Bram
    sommario: "Accanto alla forgia Bram Halgast tiene un crogiolo dove i frammenti di cristallo esausti tornano limpidi."
    luogo: Fucina dei Due Mastini, il crogiolo
    area: citta-bassa
    ripetibile: true
    requisiti: []
    testo: |
      A sinistra della forgia Bram Halgast tiene un crogiolo di terra refrattaria, e il calore ti secca gli
      occhi da tre passi. Ha le pareti spesse quattro dita e crepate in superficie, e le tiene insieme un
      cerchio di ferro battuto. Ci butta i frammenti di cristallo esausti che all'Orlo si vendono a peso e li
      lascia sul calore bianco finché diventano una pasta lattiginosa. Dalla forma di ferro esce un cristallo
      sterile limpido, senza Mana.

      {origine figlio-della-citta-bassa} In Città Bassa i mastini di Bram li conoscono anche i bambini, e da
      bambin{o|a} giravi al largo dalla sua soglia. Ti accorgi che lo fai ancora.

      Il sistema glielo ha insegnato un vecchio Raschiatore che non poteva pagargli un piccone. «Lui è rimasto
      nel Labirinto. Il piccone invece l'hanno riportato su, perché roba mia non si rompe» dice Bram, e sputa
      nella cenere.

      {origine apprendista-raschiatore} Un Raschiatore rimasto nel Labirinto vuol dire una lanterna accesa sul
      Ponte dei Morti, e ti chiedi quale sia la sua.

      Sulla mensola sopra il crogiolo tiene una fila di cristalli venuti storti, chi con una bolla nel mezzo e
      chi piegato da una parte, per ricordarsi come non si fa.
    opzioni:
      - testo: "Lasciare a Bram i frammenti e aspettare"
        descrizione: "Bram li fonde quando il crogiolo è libero, e per il disturbo si tiene una parte della pasta."
        requisiti: [cristalli.frammento-esausto >= 6]
        esito:
          titolo: La forma di ferro
          testo: |
            Rovesci il sacchetto dei frammenti su un'asse, e cadendo fanno un rumore di ghiaia asciutta. Bram
            li conta con un dito nero di carbone e muove le labbra mentre conta. Poi li butta nel crogiolo e
            torna all'incudine senza pensarci più. Verso sera rompe la forma con un colpo secco e ti mette in
            mano i cristalli sterili ancora caldi, così limpidi che ci vedi attraverso le linee del palmo.
          effetti: { cristalli.frammento-esausto: -6, cristalli.cristallo-sterile: 2 }

      - testo: "Una giornata al crogiolo"
        descrizione: "Con una scorta grossa Bram accende il crogiolo all'alba, e tu resti a dargli una mano fino a sera."
        costo: 2
        requisiti: [cristalli.frammento-esausto >= 15]
        esito:
          titolo: Dall'alba al tramonto
          testo: |
            Arrivi con il sacco dei frammenti sulla spalla che la Città Bassa dorme ancora, e Bram è già lì ad
            attizzare il crogiolo con lo smanicato aperto sul petto. Lavorate a turni fino a sera. Verso
            mezzogiorno i mastini si alzano dalla cenere dove dormivano e vanno a sdraiarsi sulla soglia,
            lontano dal calore. Quando il sole cala sulla Cicatrice hai le sopracciglia bruciacchiate e una
            fila di cristalli sterili allineati sull'asse.

            Bram li guarda a lungo e ammette che con il fuoco acceso dall'alba se ne perdono meno.
          effetti: { cristalli.frammento-esausto: -15, cristalli.cristallo-sterile: 6 }

      - testo: "Tenere tu il mantice"
        descrizione: "Il crogiolo ha un mantice piccolo tutto suo e vuole un calore che non cali mai. Bram dice che basta avere fiato."
        requisiti: [cristalli.frammento-esausto >= 5]
        prova: { attributo: fisico, abilita: [resistenza, atletica], difficolta: Media }
        successo:
          titolo: Il calore bianco
          testo: |
            Pompi il mantice piccolo con un ritmo lento e uguale e conti i colpi a mezza voce, e il fuoco
            sotto il crogiolo passa dal giallo al bianco e ci resta. Dopo un'ora le spalle ti bruciano, e il
            manico di legno è scuro del sudore delle tue mani. Bram guarda la pasta girare nel crogiolo senza
            grumi, e per una volta non bestemmia. Ti consegna i cristalli sterili e si tiene una parte più
            piccola del solito, visto che al mantice c'eri tu.
          effetti: { cristalli.frammento-esausto: -5, cristalli.cristallo-sterile: 2 }
        fallimento:
          titolo: La fiammata
          testo: |
            A metà lavoro perdi il ritmo, e per recuperare spingi il mantice troppo forte. Il fuoco sputa una
            fiammata che ti lecca il dorso della mano, e la mano si ritira da sola prima che tu senta il
            dolore. Bram ti toglie la leva e ti infila la mano nel secchio dell'acqua, poi ti dice cosa pensa
            di te con parole che i mastini conoscono già. Quando la tiri fuori il dorso è lucido e senza più
            un pelo. Dalla forma escono meno cristalli buoni del solito, e quello venuto storto finisce sulla
            mensola insieme agli altri.
          effetti: { cristalli.frammento-esausto: -5, cristalli.cristallo-sterile: 1, ferite: 0.5 }

  # ------------------------------------------------------------ B2 · cristalli sterili → carichi, e la cella
  - id: ricaricare-al-nodo
    presso: mercato-dei-nodi
    immagine: personaggi/ambrin-qell
    titolo: Il banco del retro
    sommario: "Di sera, nel retrobottega del Nodo d'Ossidiana, Ambrin Qell mette il Mana nei cristalli sterili."
    luogo: Il Nodo d'Ossidiana, il retrobottega
    area: ponti-sospesi
    ripetibile: true
    requisiti: [rep.nodo >= 3]
    testo: |
      Nel retrobottega del Nodo d'Ossidiana, oltre il mobile a cento cassetti, c'è un banco basso coperto di
      feltro scuro con un anello d'ottone nel mezzo. Dentro l'anello il feltro è consumato fino alla trama.
      Ambrin Qell ci carica i cristalli sterili la sera a bottega chiusa. Li dispone dentro l'anello e ci
      scrive sopra una formula, poi tiene le mani aperte su di loro finché gli si sbiancano le dita.

      «La carica non entra in tutti» dice sorridendo. «Su una manciata di cristalli uno la prende e gli altri
      si incrinano. La polvere la tengo io per gli inchiostri, così nessuno ci perde.»

      {origine mercante-dei-ponti} Al Mercato dei Nodi gli inchiostri di Ambrin si vendono a peso d'oro, e
      adesso sai da dove viene la polvere.
    opzioni:
      - testo: "Lasciare i cristalli ad Ambrin"
        descrizione: "Glieli lasci la sera e torni la mattina dopo. Quelli che si incrinano finiscono nei suoi inchiostri."
        requisiti: [cristalli.cristallo-sterile >= 4]
        esito:
          titolo: Quello che pulsa
          testo: |
            Ambrin ti aspetta al bancone con una scatolina di legno foderata di lana e la apre adagio davanti
            a te, perché la cosa vale la scena. Dentro c'è un cristallo carico che pulsa piano, di una luce
            azzurra che ti si riflette sulle unghie. Il corvo allunga il collo per guardarlo e lo ritira a
            ogni battito di luce. «Uno su una manciata, come ti avevo detto. Il corvo aveva scommesso su meno»
            dice, e richiude la scatolina con due dita.
          effetti: { cristalli.cristallo-sterile: -4, cristalli.cristallo-carico: 1 }

      - testo: "Una notte intera al banco del retro"
        descrizione: "Se qualcuno gira i cristalli nell'anello al momento giusto se ne incrinano meno. Ci vuole tutta la notte."
        costo: 2
        requisiti: [cristalli.cristallo-sterile >= 9]
        esito:
          titolo: Il corvo che annuisce
          testo: |
            Ambrin scrive la formula e tiene le mani sopra l'anello, e a te tocca girare ogni cristallo di un
            poco quando lui annuisce. Il corvo sulla sua spalla annuisce con lui, sempre un momento dopo.

            Verso l'alba i cristalli che hanno preso la carica pulsano tutti insieme sul feltro, e sono più di
            quanti ti aspettassi. Ambrin si stiracchia finché gli scrocchia la schiena. Ti dice che da solo
            non gliene vengono mai così tanti, e che la colazione la offre lui.
          effetti: { cristalli.cristallo-sterile: -9, cristalli.cristallo-carico: 3 }

      - testo: "Far tagliare una cella"
        descrizione: "Al Nodo una cella costa quanto una casa sui Ponti. A te Ambrin la taglia dai tuoi cristalli carichi."
        quando: [rep.nodo >= 7]
        costo: 2
        requisiti: [cristalli.cristallo-carico >= 5]
        esito:
          titolo: La cella
          testo: |
            Per tutta la notte la luce passa da un cristallo all'altro e si raccoglie in quello al centro,
            mentre gli altri si spengono e diventano grigi. All'alba Ambrin lo taglia con una lama sottile che
            ci entra con un sibilo acuto. Poi ti consegna un cristallo grande come un'unghia, così pieno che
            ti formicola il palmo e il formicolio sale fino al gomito.

            «Questa fa ripartire un reperto che dorme da secoli» dice, e te la chiude nel pugno con le sue
            dita.
          effetti: { cristalli.cristallo-carico: -5, cella: 1 }

  # ------------------------------------------------------------ B3 · caricare a mano, all'Accademia
  - id: il-banco-di-prova
    presso: accademia-di-torvessa
    immagine: ambientazione/cristalli-conduttori
    titolo: Il banco di prova
    sommario: "Nel laboratorio dell'Accademia gli allievi più grandi caricano i cristalli delle lanterne, e chi sa farlo può caricarne uno per sé."
    luogo: Accademia di Torvessa, il laboratorio
    area: quartieri-alti
    ripetibile: true
    requisiti: [rep.accademia >= 3]
    testo: |
      Il laboratorio è l'ultima stanza del corridoio delle aule, con una finestra stretta sulla Cicatrice. Al
      centro c'è il banco di prova, un piano di pietra nera solcato da canaline di rame dove gli allievi del
      terzo anno caricano i cristalli per le lanterne della scuola. Il rame è lucido nei punti dove si posano
      i palmi, e negli angoli dove nessuno lo tocca è verde di ossido.

      Quando un cristallo prende male la carica il Mana torna indietro lungo le braccia di chi lo tiene, e per
      settimane si sogna sempre la stessa stanza. Pett sta sulla trave sopra il banco e gracchia piano quando
      qualcuno sbaglia, prima ancora che se ne accorga.

      {origine allievo-di-torvessa} Il corvo ti guarda dalla trave con un occhio e poi con l'altro, come a
      lezione quando non ha ancora deciso se sei preparat{o|a}.
    opzioni:
      - testo: "Caricare un cristallo al banco"
        descrizione: "Si posano i cristalli sterili nelle canaline, si mettono i palmi sul rame e si spinge il Mana dentro piano, se sai farlo."
        requisiti: [cristalli.cristallo-sterile >= 3]
        prova: { attributo: mentale, abilita: [magia, tecnologia], difficolta: Difficile }
        successo:
          titolo: La venatura azzurra
          testo: |
            Infili i guanti e posi i cristalli nelle canaline, poi appoggi i palmi sul rame. Il Mana comincia
            a scorrere dalle tue mani verso la pietra e tu lo spingi avanti un poco alla volta, finché il rame
            sotto i guanti si fa caldo mentre la pietra intorno resta fredda. I primi cristalli si incrinano
            con un rumore da ghiaccio sottile. L'ultimo si accende di una venatura azzurra e comincia a
            pulsare. Pett scende dalla trave, lo guarda da vicino con un occhio solo e torna su senza
            gracchiare.
          effetti: { cristalli.cristallo-sterile: -3, cristalli.cristallo-carico: 1 }
        fallimento:
          titolo: Il ritorno
          testo: |
            Spingi il Mana troppo in fretta, e Pett gracchia dalla trave prima che tu capisca di avere
            sbagliato. Il primo cristallo te lo rimanda indietro tutto in una volta. La scossa ti risale lungo
            le braccia fino ai denti, e per qualche momento non ti viene la parola per dire rame. Quella
            notte, e per molte altre, sogni il banco di prova con le canaline piene d'acqua nera.
          effetti: { cristalli.cristallo-sterile: -3, ferite: 0.5, tormento: 1 }

      - testo: "Fare da assistente a chi carica"
        descrizione: "Un'allieva del terzo anno carica i cristalli delle lanterne e le serve qualcuno che li tenga fermi. Il cristallo per provare lo porti tu."
        requisiti: [cristalli.cristallo-sterile >= 1]
        esito:
          titolo: Le mani ferme
          testo: |
            Tu tieni fermi i cristalli nelle canaline mentre lei spinge il Mana, e senti la carica passarti
            sotto le dita come acqua tiepida in un tubo. Alla fine ti lascia provare con il cristallo che hai
            portato, solo per sentire come risponde. Quello si incrina subito con un suono piccolo che ti
            dispiace più del dovuto, e la crepa lo attraversa storta da un capo all'altro. Lei ti racconta che
            al primo anno ne ha rotti una cassa intera, e ti mostra dove hai sbagliato tenendoti il polso.
          effetti: { cristalli.cristallo-sterile: -1 }
          pe: { magia: 4 }

  # ------------------------------------------------------------ B4 · schegge → frammenti incisi
  - id: la-cernita-dell-orlo
    presso: orlo-dei-rottami
    immagine: ambientazione/orlo-dei-rottami
    titolo: La cernita dell'Orlo
    sommario: "I ragazzi dell'Orlo sanno quali schegge vengono dallo stesso pezzo, e ricomposte valgono molto di più."
    luogo: Orlo dei Rottami, dietro le baracche
    area: citta-bassa
    ripetibile: true
    requisiti: []
    testo: |
      Dietro le baracche dell'Orlo dei Rottami i ragazzi hanno steso a terra un telo cerato e ci fanno la
      cernita. Le schegge che vengono dallo stesso pezzo combaciano lungo i bordi, e incollate con la colla
      d'ossa diventano un frammento inciso che si vende molto meglio. La colla la tengono tiepida in una latta
      al sole, e sa di brodo vecchio.

      Il capo, quello con l'ingranaggio al collo, dirige il lavoro seduto su un bidone rovesciato. Dalla
      tettoia Grusk vi guarda con una bottiglia sul ginocchio e canta la solita strofa. In un angolo del telo
      un sasso dipinto di rosso tiene il posto di un ragazzo che adesso scende con i Raschiatori.

      {origine apprendista-raschiatore} Ti chiedi se quello del sasso rosso l'hai già incrociato sulle
      piattaforme.
    opzioni:
      - testo: "Pagare i ragazzi per la cernita"
        descrizione: "I ragazzi fanno la cernita e si tengono le schegge che avanzano. È la loro paga, e la contano davanti a te."
        requisiti: [reliquie.scheggia >= 6]
        esito:
          titolo: Il telo cerato
          testo: |
            Rovesci le tue schegge sul telo, e i ragazzi ci si chinano sopra tutti insieme con le teste che si
            toccano. In un'ora i pezzi che combaciano sono incollati e messi ad asciugare al sole su una
            lamiera, così calda che la colla fa la pelle in pochi minuti. Le schegge che restano finiscono
            nella tasca del capo, che prima te le mostra a una a una perché tu veda che non sono quelle buone.
            Dalla tettoia Grusk applaude con la bottiglia in mano e ne versa metà sulla carriola.
          effetti: { reliquie.scheggia: -6, reliquie.frammento-inciso: 2 }

      - testo: "Un giorno intero sulle lamiere"
        descrizione: "Con un mucchio grosso di schegge i pezzi che combaciano si trovano più facilmente, e ne avanzano meno. Però ci va la giornata."
        costo: 2
        requisiti: [reliquie.scheggia >= 15]
        esito:
          titolo: Sotto il sole dell'Orlo
          testo: |
            Passi la giornata in ginocchio sul telo insieme ai ragazzi, a girare schegge fra le dita finché i
            bordi combaciano. A mezzogiorno le ginocchia hanno già preso la trama del telo.

            Con un mucchio così grosso i pezzi si ritrovano quasi da soli, e il capo smette di dare ordini per
            mettersi a incollare anche lui. Verso sera hai i polpastrelli lucidi di colla e una fila di
            frammenti incisi che asciugano sulla lamiera. Grusk scende dalla tettoia per vederli da vicino e
            li conta più volte, e ogni volta gli torna un numero diverso.
          effetti: { reliquie.scheggia: -15, reliquie.frammento-inciso: 6 }

      - testo: "Ricomporre tu i pezzi"
        descrizione: "Se i bordi li trovi da sol{o|a}, ai ragazzi non devi niente. Il capo ti guarda lavorare con le braccia incrociate."
        requisiti: [reliquie.scheggia >= 4]
        prova: { attributo: mentale, abilita: [percezione, accademiche], difficolta: Media }
        successo:
          titolo: Il verso delle incisioni
          testo: |
            Ti accorgi presto che le incisioni girano tutte nello stesso senso, come i solchi di un pollice, e
            basta seguirle per trovare il pezzo accanto. Sono profonde quanto un capello e hanno il fondo
            liscio, senza il segno di uno scalpello. Le schegge combaciano una dopo l'altra sotto le tue dita,
            e non ne butti quasi nessuna. Il capo scioglie le braccia, si china a guardare e ti chiede chi te
            l'ha insegnato. Quando gli dici che l'hai capito adesso scrolla le spalle e torna sul suo bidone,
            e da lì ti tiene d'occhio fino a sera.
          effetti: { reliquie.scheggia: -4, reliquie.frammento-inciso: 2 }
        fallimento:
          titolo: I bordi sbagliati
          testo: |
            Le schegge sembrano combaciare tutte, e dopo un'ora ti accorgi che hai incollato insieme pezzi di
            oggetti diversi, perché lungo i giunti le incisioni girano in due sensi opposti. Quando provi a
            staccarli alcuni si spezzano lungo l'incisione con un rumore secco che ti arriva ai denti. Il capo
            ti guarda senza ridere, con le braccia ancora incrociate, ed è peggio. Alla fine dal mucchio salvi
            poco, e il resto lo raccoglie lui per la cernita di domani.
          effetti: { reliquie.scheggia: -4, reliquie.frammento-inciso: 1 }

      - testo: "Frugare con i ragazzi fra gli scarti"
        descrizione: "I ragazzi sanno dove i Raschiatori scaricano la roba migliore. Se li segui senza farti notare, qualche scheggia la trovi anche tu."
        esito:
          titolo: Il carro dei Raschiatori
          testo: |
            Il capo ti porta fino al punto della riva dove i Raschiatori rovesciano i carri, e ti fa stendere
            dietro una lamiera finché l'ultimo carro non riparte. Da lì senti i carri scaricare con un rumore
            lungo di ghiaia e di ferro.

            Poi i ragazzi corrono giù tutti insieme, e tu dietro di loro. Frughi nel mucchio ancora tiepido di
            polvere e trovi qualche scheggia incisa fra i cavi, prima che arrivi la carriola rossa a prendersi
            il resto. Il capo controlla quello che hai in mano e ti lascia tenere tutto, con l'aria di farti
            un regalo.
          effetti: { reliquie.scheggia: 2 }

  # ------------------------------------------------------------ B5 · frammenti incisi → meccanismo spento
  - id: rimontare-un-meccanismo
    presso: biblioteca-di-qir-azel
    immagine: ambientazione/rovine-dei-precursori
    titolo: La stanza dei congegni
    sommario: "Al primo piano della Biblioteca i frammenti incisi delle spedizioni si rimontano in congegni interi, che non si muovono."
    luogo: Biblioteca di Qir-Azel, la stanza dei congegni
    area: quartieri-alti
    ripetibile: true
    requisiti: [rep.biblioteca >= 3]
    testo: |
      La Biblioteca manda ogni stagione una spedizione nelle rovine, e quello che torna finisce in una stanza
      accanto allo studio di Mattias Crenn. Sugli scaffali stanno le tavole di montaggio ricopiate dagli
      studiosi di un secolo fa, con le parti disegnate una per una e i nomi lasciati in bianco. La carta è
      ingiallita e si è fatta morbida agli angoli, dove la girano i pollici. Seguendo le tavole i frammenti
      incisi diventano un congegno intero, che però resta fermo.

      Mattias passa dalla porta ogni mezz'ora e guarda il lavoro da sopra la tua spalla. «Si fa, si fa» dice,
      anche quando non si fa.
    opzioni:
      - testo: "Rimontare un meccanismo con i manuali"
        descrizione: "Le tavole di montaggio sono lente da seguire, e qualche pezzo avanza sempre. Il congegno però viene intero."
        requisiti: [reliquie.frammento-inciso >= 4]
        esito:
          titolo: Con le tavole
          testo: |
            Apri la tavola giusta sul panno verde e segui le parti una per una, girando i frammenti finché le
            incisioni proseguono da un pezzo all'altro senza salti. A sera il congegno è intero e grande come
            un pane, e quando lo scuoti non tintinna, cosa che ti dà una soddisfazione sproporzionata. Lo
            tieni in mano a lungo, e la superficie non prende il calore delle dita. Qualche frammento è
            rimasto fuori, perché sulla tavola non c'era posto.
          effetti: { reliquie.frammento-inciso: -4, reliquie.meccanismo-spento: 1 }

      - testo: "Lavorare a occhio, senza manuali"
        descrizione: "Chi conosce i congegni ci mette meno pezzi e meno tempo. Gli altri ci rimettono le dita."
        requisiti: [reliquie.frammento-inciso >= 3]
        prova: { attributo: mentale, abilita: [tecnologia, accademiche], difficolta: Difficile }
        successo:
          titolo: Senza avanzi
          testo: |
            Lasci le tavole sullo scaffale e guardi i frammenti finché ti sembrano le parti di un oggetto
            solo. Li incastri seguendo le incisioni, e i bordi si chiudono così stretti che la linea del
            giunto si vede solo controluce. Quando l'ultimo entra al suo posto senti uno scatto leggero, come
            una serratura che si chiude. Il congegno è intero e non è avanzato niente. Mattias si ferma sulla
            porta con le lenti in mano, lo guarda a lungo e poi va a prendere la tavola corrispondente per
            controllare. Non la trova, e torna con un quaderno vuoto e una penna.
          effetti: { reliquie.frammento-inciso: -3, reliquie.meccanismo-spento: 1 }
        fallimento:
          titolo: Lo scatto
          testo: |
            Incastri i frammenti a occhio e per un po' sembra funzionare. Poi un pezzo entra nel posto
            sbagliato con uno scatto, e il congegno si chiude di colpo sulle tue dita come una tagliola. Per
            riaprirlo Mattias deve fare leva con un tagliacarte, e la lama si piega prima del congegno. Poi ti
            fascia la mano con un fazzoletto pulito e intanto parla a raffica di un collega che ci aveva
            lasciato un mignolo, cosa che in quel momento non ti consola. Alla fine mette i pezzi rotti nel
            cassetto degli avanzi.
          effetti: { reliquie.frammento-inciso: -3, ferite: 0.5 }

  # ------------------------------------------------------------ B6 · la via di lato, il Velo
  - id: consegnare-al-velo
    presso: cattedrale-del-velo
    immagine: ambientazione/cattedrale-del-velo
    titolo: Consegnare al Velo
    sommario: "Il Velo ritira i congegni dei Precursori per sigillarli nella Cripta, e a chi li consegna offre la purificazione."
    luogo: Cattedrale del Velo, la porta della sagrestia
    area: quartieri-alti
    ripetibile: true
    requisiti: []
    testo: |
      Accanto alla porta della sagrestia c'è una cassa di legno chiaro, e sopra una tavoletta di cera dove
      Ottilia Sanvel registra quello che ci finisce dentro. Il Velo avvolge nella tela cerata i congegni dei
      Precursori e li mura nella Cripta sotto il segno dell'Albero. A chi li consegna non chiede da dove
      vengano.

      Vicino alla cassa senti nelle orecchie un ronzio basso, e ti dici che è il sangue dopo la salita. Quando
      fai un passo indietro il ronzio resta dov'era.

      «La Madre vuole che restino sotto terra» dice Ottilia senza alzare gli occhi. «A chi li porta diamo la
      purificazione e un'offerta piccola. Chi li tiene in casa torna qui dopo qualche mese, perché la notte
      non dorme più.»

      {origine accolito-del-velo} Ottilia non ti guarda in faccia nemmeno adesso che ti conosce, e tu ti
      ritrovi con le mani giunte come nel corridoio dei novizi.
    opzioni:
      - testo: "Consegnare un meccanismo da sigillare"
        descrizione: "Il Velo paga un'offerta piccola, e in cambio un accolito ti impone le mani prima che tu esca."
        requisiti: [reliquie.meccanismo-spento >= 1]
        esito:
          titolo: Nella tela cerata
          testo: |
            Ottilia avvolge il congegno nella tela cerata con gesti rapidi e senza guardarlo, poi lo posa
            nella cassa insieme agli altri. Un accolito velato ti accompagna fino al primo gradino della
            Cripta, e dal basso sale un'aria ferma e fredda che odora di calce. Lì ti tiene le mani sulle
            tempie mentre recita la Preghiera del Battito. Senti il freddo delle sue dita scendere lungo il
            collo, e il ronzio che ti porti dietro da giorni si abbassa fino a sparire. All'uscita Sorella
            Arva ti conta qualche moneta sul palmo una alla volta.
          effetti: { reliquie.meccanismo-spento: -1, monete: 5, tormento: -1, contaminazione: -1 }

      - testo: "Consegnare i frammenti incisi"
        descrizione: "Il Velo prende anche i pezzi sciolti, e per quelli non paga. La benedizione te la danno lo stesso."
        requisiti: [reliquie.frammento-inciso >= 3]
        esito:
          titolo: I pezzi sciolti
          testo: |
            Ottilia guarda i frammenti incisi nel tuo palmo e li fa cadere nella cassa con una paletta di
            legno dal bordo consumato, senza toccarli. Poi ti fa segno di chinare la testa e ti traccia sulla
            fronte il segno dell'Albero con il pollice bagnato d'olio. L'olio sa vagamente di cucina, e ti
            viene in mente una minestra che non mangi da anni. Sulla scala del ritorno ti accorgi che hai le
            spalle più leggere, e che per tutto il giorno non hai pensato alle incisioni.
          effetti: { reliquie.frammento-inciso: -3, tormento: -0.5 }
