# L'economia della città, la famiglia delle Informazioni (strato 1, ottobre 2026).
# Le conversioni ripetibili, ognuna in un luogo preciso e migliore di `cucire-voci` (Città Bassa, ovunque):
#   A1 le-voci-della-sala (Grifone di Ferro): voci → pettegolezzi; con pista.acciaio >= 6 la via di Liaren.
#   A2 gli-archivi-incrociati (Biblioteca, rep.biblioteca >= 3): pettegolezzi → segreti; con rep 7 gli
#      scaffali chiusi.
#   A3 i-verbali-della-cancelleria (Municipio): pettegolezzi → segreti, con il copista o con una prova
#      (sociale o fisica) che costa Sospetto se fallisce.
#   A4 un-nome-per-la-guarnigione (Guarnigione): la via di lato, poco denaro e Sospetto che scende. Il
#      sergente è Livio Mastrel (contenuti/citta/guarnigione.yaml).
# Il Mercato delle Ombre:
#   A5 chi-sa-dove-si-e-spostato (Città Bassa, fisso, contatto-ombra == 0): come trovare l'ingresso. Torna
#      da sola se la crisi del Sospetto brucia il contatto.
#   A6 i-banchi-senza-timbro (presso mercato-delle-ombre): lo scalino più alto di ogni famiglia al prezzo
#      migliore, con il Sospetto. Nessuno Scuro con nome, così vale anche dopo pista.pelle >= 6.
# I prezzi stanno negli effetti, mai nella prosa (docs/stile-dei-testi.md, regola 11).
storylet:
  # ------------------------------------------------------------ A1 · voci → pettegolezzi
  - id: le-voci-della-sala
    presso: grifone-di-ferro
    immagine: ambientazione/locanda-del-grifone-di-ferro
    titolo: Le voci della sala
    sommario: "A fine serata la sala del Grifone ha sentito tutto quello che è passato sui Ponti, e il tavolo d'angolo resta libero per metterlo in fila."
    luogo: Locanda del Grifone di Ferro, il tavolo d'angolo, a fine serata
    area: ponti-sospesi
    ripetibile: true
    testo: |
      Quando l'ultima partita di Zekar finisce e i Raschiatori del turno lungo
      si trascinano verso le brande, nella sala del Grifone restano le
      chiacchiere della serata, sparse fra i boccali vuoti. Brunella spazza
      le faville dalle assi. Il tavolo d'angolo vicino al camino, quello con
      la gamba zeppata da un tappo di sughero, resta libero fino alla
      chiusura, e ti ci siedi con il boccale in mano a rifare la serata da
      capo, un tavolo alla volta.

      Un mercante di stoffe giurava che la Gilda alzerà il dazio sul Ponte
      delle Mille Corde, e un Raschiatore gli rispondeva che il dazio, a
      conti fatti, lo pagano sempre quelli come lui. Due vedette hanno visto
      una lanterna accesa in fondo alla Cicatrice, dove di lanterne non ce ne
      dovrebbero essere.

      {origine apprendista-raschiatore} Sulle piattaforme hai imparato per
      chi si accendono le lanterne, e laggiù in fondo non c'è nessuno per cui
      accenderne una. Le dita ti si stringono intorno al boccale finché le
      nocche non diventano bianche.

      {conoscenze-della-strada Facile} Quello che si ripete da due tavoli che
      non si parlano di solito ha un fondo, e il fondo si vende. Il resto è
      birra che ha trovato le parole.

      {resistenza Media fallita} Il camino ti scalda la schiena e il boccale
      ti pesa nella mano. Le tue palpebre hanno deciso di chiudere prima di
      Brunella.

      *Metà di queste cose domani saranno false, e l'altra metà le sapranno
      tutti.* Le metti in fila lo stesso, con il dito che segue le venature
      del tavolo come se fossero le strade dei Ponti.
    opzioni:
      - testo: "Mettere in fila le voci della settimana"
        descrizione: "Un mucchio di voci raccolte in giro, confrontate al tavolo d'angolo finché qualcuna regge."
        requisiti: [informazioni.voce >= 6]
        esito:
          titolo: Due tavoli che non si parlano
          testo: |
            Stendi le voci sul tavolo come le carte di un solitario e cominci a
            scartare quelle che hanno un testimone solo. Il dazio sul Ponte
            regge, perché lo raccontano un mercante e un Custode di Passaggio
            che si odiano da anni e non si metterebbero d'accordo nemmeno sul
            colore della birra. Regge anche la lanterna in fondo alla
            Cicatrice, e a pensarci ti si raffreddano le mani intorno al
            boccale. Quando Brunella spegne l'ultima lampada ti restano poche
            cose vere e una gran voglia di dormire.
          effetti: { informazioni.voce: -6, informazioni.pettegolezzo: 2 }

      - testo: "Una serata intera ad ascoltare"
        descrizione: "Dall'apertura alla chiusura, da un tavolo all'altro, con un boccale che non si vuota mai."
        costo: 2
        requisiti: [informazioni.voce >= 15]
        esito:
          titolo: Fino all'ultima brace
          testo: |
            Arrivi quando Brunella accende il camino e te ne vai quando lo copre
            di cenere. In mezzo cambi tavolo a ogni giro, e il boccale resta
            pieno per tutta la sera, perché sei lì per ascoltare e la birra
            serve soltanto a giustificare la sedia. Sentite tutte nella stessa
            notte, le voci si lasciano confrontare meglio, dato che chi inventa
            ripete la sua storia sempre con le stesse parole. A notte fonda sul
            tuo foglio ci sono più fatti di quanti ne raccolga un cronista del
            Velo in una settimana, e nelle orecchie ti ronzano ancora le voci
            degli altri.
          effetti: { informazioni.voce: -15, informazioni.pettegolezzo: 6 }

      - testo: "Chiedere a Liaren cosa ha sentito dal palco"
        descrizione: "Dallo sgabello alto Liaren vede tutta la sala, e mentre suona sente anche quello che si dice sottovoce."
        immagine: personaggi/liaren-tarvelin
        quando: [pista.acciaio >= 6]
        requisiti: [informazioni.voce >= 4]
        prova: { attributo: sociale, abilita: [empatia, conoscenze-della-strada], difficolta: Media }
        successo:
          titolo: Dal palco
          testo: |
            Aspetti che Liaren posi il samisen e le porti un boccale di quello
            buono, che Brunella tiene sotto il bancone. Lei si sistema sullo
            sgabello con una mano sul fianco e ti ascolta mentre le racconti le
            tue voci, battendo il tempo sul ginocchio. «Questa è vera, l'ho
            sentita da tre tavoli» dice, e con il plettro ne batte un'altra.
            «Quest'altra l'ha messa in giro Orazio Belcanto per far parlare del
            Teatro, e ogni stagione ne inventa una nuova.»

            {espressivita Media} Una voce messa in giro da un impresario ha
            sempre un bel finale e nessun testimone. Chi fa spettacolo la
            riconosce al primo ascolto.

            Quando finisce il boccale ti restano meno voci di prima, e quelle che
            restano le ha controllate lei.
          effetti: { informazioni.voce: -4, informazioni.pettegolezzo: 2 }
        fallimento:
          titolo: Le stesse cose
          testo: |
            Liaren ascolta le tue voci con il mento appoggiato al manico del
            samisen, annuendo a ognuna con troppa pazienza. Poi ride e ti dice
            che le ha sentite anche lei dagli stessi tavoli, con le stesse
            parole, perché stasera la sala ha raccontato a tutti la medesima
            storia. Ti offre il boccale per consolarti, e lo accetti senza
            fare storie. Le voci più deboli le butti nel camino prima
            di andartene, perché ripetute da lei ti sono sembrate ancora più
            deboli.
          effetti: { informazioni.voce: -2 }

  # ------------------------------------------------------------ A2 · pettegolezzi → segreti
  - id: gli-archivi-incrociati
    presso: biblioteca-di-qir-azel
    immagine: ambientazione/biblioteca-di-qir-azel
    titolo: Gli archivi incrociati
    sommario: "Nella sala di lettura ci sono i registri della città, e un pettegolezzo che ci passa sopra senza strapparsi diventa un segreto."
    luogo: Biblioteca di Qir-Azel, la sala di lettura, nel pomeriggio
    area: quartieri-alti
    ripetibile: true
    requisiti: [rep.biblioteca >= 3]
    testo: |
      Nel pomeriggio la sala di lettura si svuota, e al tavolo lungo restano
      gli studiosi che non hanno un altro posto dove andare, o che a casa
      hanno qualcuno da evitare. Ulric Stanne ti ha dato un angolo del tavolo
      e il permesso di chiedere i registri, purché tu li chieda uno alla volta
      e li riporti con i nastri annodati come li hai trovati. Sono i registri
      delle spedizioni e le copie dei dazi che la Gilda manda alla Biblioteca
      per abitudine.

      {politica-ed-economia Media} Per abitudine, e perché una copia in
      Biblioteca è una copia che nessun socio può bruciare. La Gilda si fida
      dei suoi archivi più che dei suoi mercanti.

      {origine mercante-dei-ponti} Il registro dei dazi lo hai sempre visto
      dall'altra parte del banco, mentre l'esattore ci scriveva quello che
      pagavi. Letto da qui, senza nessuno in fila dietro di te, sembra un
      altro libro, e ti mette addosso un buonumore un po' vendicativo.

      Due sedie più in là Mattias Crenn studia una pietra precuriana con la
      lente, e ogni tanto la rimprovera sottovoce per una riga storta. Hai
      portato i tuoi pettegolezzi scritti su foglietti, e il lavoro è
      semplice da spiegare. Se un mercante giura che la Casa dei Nodi ha
      venduto un carico di cristalli a Pannion, da qualche parte in questi
      registri c'è un dazio pagato, oppure c'è il buco dove dovrebbe stare.

      {accademiche Facile fallita} Sulla pietra di Mattias c'è un segno che
      dovresti saper leggere, almeno quello in alto. Ti ricorda soltanto la
      forma di un biscotto.

      *Se sbaglio un nodo, Ulric se ne accorge prima di me.* Sfili il primo
      registro e ti resta la polvere sui polpastrelli.
    opzioni:
      - testo: "Confrontare i pettegolezzi con i registri"
        descrizione: "Un foglietto alla volta, accanto alla colonna giusta del registro giusto."
        requisiti: [informazioni.pettegolezzo >= 4]
        esito:
          titolo: Il dazio pagato due volte
          testo: |
            Il registro dei dazi è scritto in una grafia fitta e uguale da un
            capo all'altro, e ci metti un'ora a capire che le colonne vanno
            lette dal basso. Da lì in poi il lavoro scorre, e il collo comincia
            a farti male. Quasi tutti i tuoi foglietti restano senza riscontro,
            e li accartocci in tasca. Uno combacia con un dazio pagato due volte
            dallo stesso mercante, in due mesi diversi, per lo stesso carico.
            Ulric riprende il registro, controlla il nodo del nastro e non ti
            chiede che cosa hai trovato, perché lo ha già letto sulla tua
            faccia.
          effetti: { informazioni.pettegolezzo: -4, informazioni.segreto: 1 }

      - testo: "Una settimana in sala di lettura"
        descrizione: "Ogni pomeriggio della settimana allo stesso angolo del tavolo lungo, finché Ulric comincia a tenerti la sedia."
        costo: 2
        requisiti: [informazioni.pettegolezzo >= 9]
        esito:
          titolo: La sedia tenuta
          testo: |
            Per una settimana arrivi alla stessa ora e trovi i registri già sul
            tavolo, perché Ulric ha cominciato a prepararteli, ogni volta con un
            sospiro più lungo del giorno prima. Mattias ti presta la lente per
            le grafie più strette e ti insegna a riconoscere le correzioni fatte
            a posteriori, che hanno l'inchiostro più fresco e la mano più
            sicura. I pettegolezzi che avevi portato li confronti con tutto quello che
            la Biblioteca conserva, e a fine settimana ne restano pochi, solidi
            da ogni lato. Li ricopi in bella su un foglio piegato, e Ulric ti fa
            pagare la carta.
          effetti: { informazioni.pettegolezzo: -9, informazioni.segreto: 3 }

      - testo: "Chiedere le chiavi degli scaffali chiusi"
        descrizione: "Il tuo nome è sul registro delle chiavi, e dietro la cera nera ci sono i conti che la città ha preferito sigillare."
        immagine: personaggi/ulric-stanne
        quando: [rep.biblioteca >= 7]
        requisiti: [informazioni.pettegolezzo >= 3]
        prova: { attributo: mentale, abilita: [accademiche, politica-ed-economia], difficolta: Difficile }
        successo:
          titolo: I mastri sigillati
          testo: |
            Ulric rompe il sigillo davanti a te e scrive l'ora sul registro,
            come sempre, con la punta della lingua fra i denti. Dietro le ante
            ci sono i libri mastri della Gilda di trent'anni fa, chiusi dal Velo
            con una nota sulla copertina che dice soltanto *in custodia*. Li
            apri accanto ai tuoi foglietti e segui una famiglia di mercanti da
            un mastro all'altro.

            {politica-ed-economia Difficile} Ogni volta che un mastro si chiude
            in pari, quello dopo si apre con un prestito nuovo. A Qir-Azel i
            debiti grossi passano da un libro all'altro, e lì dentro invecchiano
            bene.

            A sera sai
            dove è finito il denaro di un debito che a Qir-Azel tutti credono
            saldato, e lo scrivi in fretta, prima di pentirti di saperlo. Ulric
            rifà il sigillo senza guardarti.
          effetti: { informazioni.pettegolezzo: -3, informazioni.segreto: 2 }
        fallimento:
          titolo: Le colonne a rovescio
          testo: |
            Ulric rompe il sigillo e scrive l'ora sul registro. I libri mastri
            dietro la cera nera seguono una contabilità che non hai mai visto,
            con le colonne a rovescio e i numeri segnati in caratteri
            precuriani. Passi il pomeriggio a cercare un nome che conosci, e
            quando lo trovi resti a fissare la riga senza capire se paga o
            riscuote, mentre la candela si accorcia. Accanto a quei conti i tuoi
            foglietti sembrano chiacchiere da fontana. Li lasci sul tavolo, e
            Ulric li usa per segnare le pagine, con una certa cura.
          effetti: { informazioni.pettegolezzo: -3 }

  # ------------------------------------------------------------ A3 · pettegolezzi → segreti, in Municipio
  - id: i-verbali-della-cancelleria
    presso: municipio
    immagine: ambientazione/quartieri-alti
    titolo: I verbali della cancelleria
    sommario: "In Municipio i verbali del Consiglio passano per troppe mani, e chi sa dove guardare ci trova la prova di un pettegolezzo."
    luogo: Municipio, la cancelleria al pianterreno
    area: quartieri-alti
    ripetibile: true
    testo: |
      La cancelleria del Municipio sta al pianterreno, in fondo a un corridoio
      dove l'intonaco si sfoglia ogni volta che una porta sbatte. Dopo ogni
      seduta del Consiglio i verbali scendono qui per essere ricopiati, e
      passano per tante mani che a fine settimana nessuno saprebbe dire quante
      copie ne girino. I copisti lavorano a un tavolo lungo sotto una finestra
      alta, con la schiena curva e le maniche infilate in manicotti di tela
      nera. Il più anziano tiene accanto al calamaio un vaso di gerani, e lo
      annaffia con l'acqua che avanza dall'inchiostro.

      {furtivita Media} La finestra alta sopra il tavolo non ha sbarre. Te
      lo segni senza volerlo, come ti segni sempre dove sono le uscite.

      Tullio Merga scende due volte al giorno a ritirare le copie finite, con
      gli occhiali appesi alla cordicella, e non conta mai i fogli.

      {origine rampollo-dei-quartieri-alti} Nei salotti dei Quartieri Alti dei
      verbali del Consiglio si parla come di una cosa che arriva già
      rilegata, e nessuno si chiede chi la ricopia. Ti viene da raddrizzare
      la schiena, come se il copista dei gerani potesse riconoscerti dal nome
      di famiglia.

      {conoscenze-della-strada Media} Chi non conta i fogli non sa quanti ne
      escono. In un posto così una riga in più costa poco a chi la scrive,
      e qualcosa a chi la vuole.

      *Un pettegolezzo diventa una prova se trovi la riga dove qualcuno l'ha
      detto ad alta voce.* Sulla porta un cartello scritto a mano avverte che
      i verbali non si consultano, e sotto un'altra mano ha aggiunto *senza
      permesso*, in caratteri più piccoli.
    opzioni:
      - testo: "Pagare un copista per un estratto"
        descrizione: "Il copista dei gerani ricopia una riga in più per chi paga, e non chiede a cosa serva."
        requisiti: [informazioni.pettegolezzo >= 2, monete >= 10]
        esito:
          titolo: La riga in più
          testo: |
            Al copista dei gerani basta sentire l'argomento per sapere in quale
            seduta cercarlo. Mentre ricopia il verbale per la Gilda, una riga la
            scrive due volte, e la seconda finisce su un foglietto che ti passa
            sotto il vaso. È la frase di un consigliere che conferma quello che
            in Città Bassa si diceva sottovoce, con la data della seduta in
            margine e una goccia d'acqua dei gerani che ha fatto sbavare
            l'inchiostro. Gli lasci le monete accanto al calamaio, e lui ci
            appoggia sopra la carta assorbente senza alzare gli occhi.
          effetti: { informazioni.pettegolezzo: -2, monete: -10, informazioni.segreto: 1 }

      - testo: "Farti mostrare i verbali con una scusa"
        descrizione: "Un incarico della casata inventato al momento, detto con abbastanza sicurezza da sembrare vero."
        requisiti: [informazioni.pettegolezzo >= 3]
        prova: { attributo: sociale, abilita: [ingannare, galateo], difficolta: Difficile }
        successo:
          titolo: Per conto della segreteria
          testo: |
            Ti presenti al tavolo dei copisti come se ti mandasse la segreteria
            della Rappresentante, e chiedi i verbali dell'ultima stagione
            sbuffando, perché li hai già chiesti due volte e di sopra non sono
            mai arrivati. Il copista anziano li tira fuori senza discutere,
            contento di togliersi un fastidio e di tornare ai suoi gerani.

            {ingannare Media} Lo sbuffo ha fatto metà del lavoro. Chi sembra
            seccato di essere in un posto difficilmente ci è entrato di
            nascosto.

            Li sfogli in piedi sotto la finestra alta e trovi la seduta giusta
            prima che a qualcuno venga in mente di chiederti un nome. Impari la riga a memoria e la ripeti fra
            i denti fino al portone.
          effetti: { informazioni.pettegolezzo: -3, informazioni.segreto: 1 }
        fallimento:
          titolo: Un nome a caso
          testo: |
            Ti presenti come se ti mandasse la segreteria della Rappresentante,
            e il copista anziano ti chiede con molta gentilezza il nome di chi
            ti manda. Ne dici uno a caso, e ti suona sbagliato già mentre ti
            esce di bocca. Lui lo scrive su un foglietto e lo
            manda di sopra con un garzone, e intanto ti offre una sedia. Te ne
            vai prima che il garzone torni, ma sulle scale incroci Tullio Merga,
            che inforca gli occhiali per guardarti bene in faccia. I foglietti
            con i tuoi pettegolezzi sono rimasti sul tavolo dei copisti.
          effetti: { informazioni.pettegolezzo: -3, sospetto: 1.5 }

      - testo: "Entrare in cancelleria dopo la chiusura"
        descrizione: "La finestra alta sopra il tavolo dei copisti non ha sbarre, perché a nessuno è mai venuto in mente di rubare un verbale."
        requisiti: [informazioni.pettegolezzo >= 3]
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Difficile }
        successo:
          titolo: La finestra alta
          testo: |
            Aspetti che Nino, il garzone che affigge i bandi, abbia chiuso il
            portone, e lo senti allontanarsi fischiando una canzone stonata. La
            finestra alta si apre con una spinta, e scendi sul tavolo dei
            copisti senza rovesciare i gerani, con il cuore che fa più rumore
            dei tuoi stivali. L'armadio dei verbali ha una serratura che cede alla punta
            di un coltello. Al buio, con una candela riparata nel palmo, scorri
            le sedute finché trovi la riga che ti serve, e la ricopi sul retro
            di un tuo foglietto. Esci dalla stessa finestra prima che passi la
            ronda.
          effetti: { informazioni.pettegolezzo: -3, informazioni.segreto: 1 }
        fallimento:
          titolo: I gerani
          testo: |
            La finestra si apre con una spinta, ma scendendo metti il piede nel
            vaso dei gerani, e il vaso va in pezzi con un rumore che rimbomba
            per tutto il corridoio. Dalla strada una lanterna si ferma davanti al
            portone. Risali sul davanzale con la terra nello stivale e ti cali
            nel vicolo mentre qualcuno prova la serratura, e intanto qualche
            foglietto ti scivola di tasca. Ti dispiace per i gerani più di
            quanto avresti pensato. La mattina dopo, in Città Bassa, si
            dice che la Caserma cerca uno bravo ad arrampicarsi.
          effetti: { informazioni.pettegolezzo: -1, sospetto: 2 }

  # ------------------------------------------------------------ A4 · la via di lato
  - id: un-nome-per-la-guarnigione
    presso: guarnigione-di-qir-azel
    immagine: ambientazione/guarnigione-di-qir-azel
    titolo: Un nome per la Guarnigione
    sommario: "La Caserma paga poco quello che sai, ma chi le porta un nome utile esce dai suoi registri un po' più leggero."
    luogo: Guarnigione di Qir-Azel, la stanza della ronda di notte
    area: quartieri-alti
    ripetibile: true
    testo: |
      Livio Mastrel riceve prima di uscire con la ronda di notte, in una stanza
      stretta sotto la scala dove la stufa fa più fumo che caldo. Sul tavolo
      tiene il registro dei turni e un barattolo di radici di liquirizia, e ne
      offre una a chi entra prima ancora di chiedergli il nome.

      {intimidire Facile fallita} La liquirizia ti fa abbassare la guardia.
      È difficile avere paura di un uomo che mastica radici dolci come un
      nonno sulla panca della piazza.

      {origine figlio-della-citta-bassa} Nei vicoli dove sei cresciuto la
      Caserma la si guarda passare dall'altro lato della strada. Seduto nella
      stanza della ronda con una liquirizia in bocca ti senti un ospite e un
      traditore nello stesso momento.

      «Quello che si sente in giro alla Caserma interessa sempre» dice,
      masticando. «Paghiamo poco, perché il furiere i conti li rifà due volte.
      Però chi ci dà una mano, sui registri, lo scriviamo a matita.» Con il
      pollice indica lo scaffale alle sue spalle, dove i fascicoli stanno in
      fila per quartiere. Alcuni sono sottili, altri gonfi di fogli ripiegati
      e legati con lo spago.

      {percezione Media} Su ogni dorso c'è un nome a matita e, sotto, una
      colonna di segni, a matita anche quelli. I fascicoli più gonfi hanno lo
      spago annodato due volte.

      *Chissà quanto è gonfio il mio.* Ti siedi sullo sgabello, e mentre
      decidi che cosa dire il fumo della stufa ti entra nei vestiti, e ti ci
      resterà fino a domani.
    opzioni:
      - testo: "Consegnare un segreto al sergente di turno"
        descrizione: "Livio scrive quello che gli dici con la sua grafia tonda, e paga con gli spiccioli della cassa della ronda."
        requisiti: [informazioni.segreto >= 1]
        esito:
          titolo: La grafia tonda
          testo: |
            Racconti a Livio quello che sai con tutti i nomi e le strade, e lui lo
            scrive sul registro con una grafia tonda da scolaro, fermandosi a
            succhiare la liquirizia quando un nome è difficile. Alla fine soffia
            sull'inchiostro e ti conta qualche moneta dalla cassa della ronda.
            È una cassetta di latta ammaccata, e a scuoterla suona appena. Poi prende il tuo fascicolo
            dallo scaffale e ci scrive qualcosa in fondo, a matita, senza
            fartelo leggere. Quando esci, la guardia al portone guarda da
            un'altra parte, e per una volta ti sembra una gentilezza.
          effetti: { informazioni.segreto: -1, monete: 12, sospetto: -2 }

      - testo: "Pagare in segreti, e il tuo fascicolo torna nel cassetto"
        descrizione: "Senza paga. Livio ha un cassetto in fondo allo scaffale da cui i fascicoli non escono più."
        requisiti: [informazioni.segreto >= 2, sospetto >= 1]
        esito:
          titolo: Il cassetto in fondo
          testo: |
            Livio ascolta tutto senza scrivere, con la liquirizia ferma fra i
            denti. Quando hai finito resta zitto a lungo, poi sfila il tuo
            fascicolo dallo scaffale e lo apre sul tavolo per fartelo vedere. È
            più gonfio di quanto pensassi, e ti ritrovi a grattarti il polso
            quando riconosci certe date. Lo richiude, ci gira intorno lo spago
            e lo infila nel cassetto in fondo, quello dei fascicoli che la
            Caserma ha deciso di dimenticare. «Da lì non è mai uscito niente»
            dice, e ti allunga il barattolo della liquirizia.
          effetti: { informazioni.segreto: -2, sospetto: -5 }

      - testo: "Vendere un pettegolezzo di poco conto"
        descrizione: "Un pettegolezzo verificato, buono per la ronda di stanotte e per una riga a matita."
        requisiti: [informazioni.pettegolezzo >= 1]
        esito:
          titolo: Per la ronda di stanotte
          testo: |
            Gli dici dove si giocherà a dadi stanotte sui Ponti e chi terrà il
            banco. Livio lo annota in un angolo del registro dei turni, accanto
            al giro della ronda, e ti allunga qualche spicciolo dalla cassa.
            «Se li troviamo, la prossima liquirizia la offri tu» dice, e ride da
            solo, perché le radici nel barattolo le compra lui e non le ha mai
            fatte pagare a nessuno. Ti accorgi di aver riso anche tu, e un po'
            ti dispiace per quelli che terranno il banco.
          effetti: { informazioni.pettegolezzo: -1, monete: 3, sospetto: -0.5 }

  # ------------------------------------------------------------ A5 · l'ingresso del Mercato delle Ombre
  - id: chi-sa-dove-si-e-spostato
    immagine: ambientazione/citta-bassa
    titolo: Chi sa dove si è spostato
    sommario: "Il Mercato delle Ombre ha cambiato stanza un'altra volta, e per scendere serve qualcuno che sappia dove."
    luogo: Città Bassa, alla fontana
    area: citta-bassa
    tipo: fisso
    requisiti: [contatto-ombra == 0]
    testo: |
      In Città Bassa del Mercato delle Ombre parlano tutti, dai facchini alle
      lavandaie, e nessuno ti sa dire dove sia. Ogni due o tre mesi la piazza
      sotterranea cambia stanza, e gli ingressi vecchi si ritrovano murati
      con mattoni freschi, oppure danno su una cantina vuota. Quelli nuovi li
      conoscono in pochi, e chi li conosce li dice solo a chi gli conviene.

      {conoscenze-della-strada Media} Se tutti ne parlano, nessuno ci è
      sceso di recente. Chi lo sa davvero di solito siede in un posto dove
      si paga anche la sedia.

      Alla fontana una donna strizza i panni nel secchio e ti racconta, senza
      aspettare domande, che suo cognato ci è sceso una volta ed è tornato
      con un anello che gli ha annerito il dito. Da quale porta fosse sceso lei
      non se lo ricorda, e lui beveva troppo per ricordarselo.

      {empatia Media} Del cognato parla con un fastidio vecchio, quasi
      affettuoso. L'anello nero, a sentirla, è la cosa più interessante che
      lui abbia mai portato a casa.

      *Mi serve uno che ci scenda tutte le settimane.* Ringrazi, e intanto
      guardi la strada cercando chi abbia l'aria di saperlo e di fartelo
      pagare.
    opzioni:
      - testo: "Chiedere agli Scuri"
        descrizione: "Alla Pignatta Grassa sanno sempre dov'è il Mercato. Un favore degli Scuri si paga con un altro favore."
        immagine: fazioni/scuri
        quando: [pista.pelle < 6]
        requisiti: [rep.scuri >= 1]
        esito:
          titolo: Il colpo giusto
          testo: |
            Al bancone della Pignatta Grassa chiedi del Mercato a mezza voce, e
            il garzone ti fa aspettare finché arriva un uomo con il cappuccio
            abbassato e una cicatrice sul labbro. Ti guarda a lungo, abbastanza
            perché tu cominci a chiederti se sei nel posto giusto. Poi ti
            descrive la porta di una cantina in fondo a un vicolo, con il colpo
            da battere e la parola da dire, e te li fa ripetere finché li sai.
            «Gli Scuri si ricordano di chi aiutano» dice, mentre si rialza il
            cappuccio. «Un giorno ti chiederanno qualcosa, e tu lo farai senza
            domande.»
          imposta: { contatto-ombra: 1 }
          effetti: { rep.scuri: -0.5 }

      - testo: "Pagare un ragazzo dell'Orlo dei Rottami"
        descrizione: "I ragazzi dell'Orlo frugano anche sottoterra, e una notizia buona la scambiano volentieri con una strada."
        immagine: ambientazione/orlo-dei-rottami
        requisiti: [informazioni.pettegolezzo >= 2]
        esito:
          titolo: L'ingranaggio al collo
          testo: |
            Il capo dei ragazzi dell'Orlo, quello con l'ingranaggio appeso al
            collo, ascolta i tuoi pettegolezzi seduto su una ruota spaccata, e
            alla fine fa sì con la testa, serio come un notaio. Li avrà
            rivenduti prima di sera. In
            cambio ti porta fino a un tombino dietro le baracche e scosta la
            grata con il piede. Sotto c'è una scala di ferro che scende nel buio,
            e da lì sale un odore di muffa e di cera bruciata. «Al terzo
            pianerottolo bussi due volte» dice, rigirandosi l'ingranaggio fra le
            dita. «Se ti chiedono chi ti manda, io
            non ti ho mai visto.»
          imposta: { contatto-ombra: 1 }
          effetti: { informazioni.pettegolezzo: -2 }

      - testo: "Seguire i cristalli non registrati"
        descrizione: "I cristalli senza timbro mandano una luce più verde degli altri, e chi sa vederla può seguirne le casse fino a una porta."
        immagine: ambientazione/cristalli-conduttori
        prova: { attributo: mentale, abilita: [percezione, magia], difficolta: Media }
        successo:
          titolo: La luce verde
          testo: |
            Per due sere stai seduto sul bordo della fontana a guardare le gerle
            che passano, finché la pietra non ti lascia il segno sulle cosce. La
            terza sera vedi un facchino con una gerla coperta, e dalla trama
            della tela filtra una luce più verde di quella delle lanterne della
            Gilda.

            {magia Media} Il Mana senza timbro ha un colore più crudo, quello
            delle foglie appena aperte. Nessuno l'ha ancora tirato a lucido per
            venderlo.

            Lo segui a distanza per una serie di vicoli,
            finché scende i gradini di una cantina e bussa in un modo che ti
            stampi in testa. Aspetti che risalga a mani vuote, e poi te ne vai
            anche tu, sapendo dove bussare.
          imposta: { contatto-ombra: 1 }
        fallimento:
          titolo: Il facchino si volta
          testo: |
            Segui per mezza notte un facchino con una gerla che manda una luce
            verdognola dalla tela, e lui ti porta in giro per la Città Bassa
            senza fretta, da un vicolo all'altro, e a un angolo si compra
            perfino una castagna. Alla fine si ferma sotto un
            lampione e ti chiede, voltandosi appena, se hai perso qualcosa.
            Nella gerla ci sono cristalli con il timbro della Gilda bene in
            vista, e sopra una lanterna da carrettiere con il vetro verde. Il
            giorno dopo un miliziano vuole sapere perché ti piace tanto
            passeggiare di notte.
          effetti: { sospetto: 1 }

      - testo: "Lasciar perdere, per ora"
        descrizione: "Prima o poi qualcuno ti dirà dove scendere, e il Mercato intanto avrà già cambiato stanza."
        costo: 0
        esito:
          titolo: Per ora
          testo: |
            Lasci la lavandaia ai suoi panni, che ormai sgocciolano sul
            selciato, e torni sui tuoi passi. Il Mercato
            delle Ombre resta dov'è, sotto i tuoi piedi o sotto quelli di
            qualcun altro, e fra un paio di mesi sarà comunque da un'altra
            parte. Ti segni a mente le facce di questa strada che potrebbero
            saperne qualcosa, per quando avrai qualcosa da dare in cambio.

  # ------------------------------------------------------------ A6 · il Mercato delle Ombre
  - id: i-banchi-senza-timbro
    presso: mercato-delle-ombre
    immagine: ambientazione/mercato-delle-ombre
    titolo: I banchi senza timbro
    sommario: "Sotto la Città Bassa si paga meglio che in qualunque bottega della città, e qualcuno ti guarda sempre mentre incassi."
    luogo: Mercato delle Ombre, la piazza sotterranea
    area: citta-bassa
    ripetibile: true
    testo: |
      In fondo alla scala ti trovi in una piazza scavata sotto la Città Bassa,
      con il soffitto a volta annerito dal fumo delle torce. La luce
      verdognola viene dai cristalli non registrati appesi ai pilastri, e dà a tutte le facce un colorito da
      convalescenti. I banchi sono assi su cavalletti coperte di reliquie
      senza il timbro della Gilda, e su uno si vende anche formaggio, perché
      anche i contrabbandieri hanno fame.

      {resistenza Media fallita} L'aria è ferma e calda, e ti gratta la gola
      a ogni respiro. Tossisci una volta sola, e mezza piazza si volta a
      guardarti.

      Gli ingressi sono parecchi, e ognuno ha i suoi uomini sulla soglia.
      Quelli della Confraternita del Velo tengono il cappuccio alzato, gli
      altri giocano a dadi su una cassa e alzano gli occhi solo
      quando scende qualcuno. Su una colonna qualcuno ha inciso il detto del
      posto, *il primo prezzo è sempre una domanda*, e sotto le lettere la
      pietra è lucida all'altezza di una spalla, dove si appoggia chi aspetta.

      {armi-da-mischia Media} Quelli dei dadi tengono i coltelli in vista,
      sulla cassa accanto alle poste. Gli uomini del Velo non ne mostrano
      nessuno, e sono loro da tenere d'occhio.

      {origine accolito-del-velo} I cappucci del Velo li riconosci dal
      taglio, e ti chiedi se in Cattedrale qualcuno sappia che scendono fin
      qui. Tieni la faccia girata dall'altra parte, per non dover rispondere
      tu a quella domanda.

      *Qui sotto ognuno si ricorda la faccia di chi vende.* La borsa ti pesa
      sul fianco, e ti accorgi di tenerci sopra la mano anche se nessuno ti si
      avvicina.
    opzioni:
      - testo: "Vendere un segreto"
        descrizione: "Al banco del fondo comprano quello che sai, e lo pagano meglio di qualunque salotto dei Quartieri Alti."
        requisiti: [informazioni.segreto >= 1]
        esito:
          titolo: Il banco del fondo
          testo: |
            L'uomo del banco del fondo ascolta il tuo segreto con gli occhi
            chiusi e la testa inclinata da una parte, come un accordatore.
            Quando hai finito resta così ancora un poco, poi apre gli occhi e fa
            un prezzo che non discuti. Ti paga con monete di conî diversi,
            compresa una straniera consumata fino al rame, impilate sull'asse
            in colonne ordinate. Mentre le raccogli, all'ingresso accanto un uomo
            con il cappuccio ti guarda le mani, e quando alzi la testa lui
            abbassa la sua.
          effetti: { informazioni.segreto: -1, monete: 38, sospetto: 1.5 }

      - testo: "Vendere un cristallo carico"
        descrizione: "Un cristallo pieno di Mana e senza timbro qui vale più che alla Casa dei Nodi, e nessuno chiede da quale pozzo venga."
        requisiti: [cristalli.cristallo-carico >= 1]
        esito:
          titolo: Il ronzio
          testo: |
            La donna del banco dei cristalli prende il tuo a mani nude e se lo
            avvicina all'orecchio per sentirne il ronzio, come si fa con le
            conchiglie. Annuisce e lo fa
            sparire sotto il banco, avvolto in uno straccio. Ti conta le monete
            con le dita annerite dal lavoro, senza sbagliare un colpo. Accanto
            a lei un ragazzino ti fissa con molta attenzione, e quando gli
            chiedi se ti conosce risponde che adesso sì, e torna a sbucciare
            una mela.
          effetti: { cristalli.cristallo-carico: -1, monete: 38, sospetto: 1.5 }

      - testo: "Vendere un meccanismo dei Precursori"
        descrizione: "Un congegno intero, anche spento, qui trova sempre qualcuno che sa a cosa serviva, o finge di saperlo."
        requisiti: [reliquie.meccanismo-spento >= 1]
        esito:
          titolo: Le dita sugli ingranaggi
          testo: |
            Il compratore dei congegni è un vecchio Raschiatore con le dita
            storte, e passa i polpastrelli sugli ingranaggi del tuo meccanismo
            come un cieco sul viso di un parente. Lo gira e lo rigira senza
            aprirlo, poi ti paga senza contrattare e ti dice che di congegni
            interi ne arrivano sempre meno.

            {tecnologia Difficile} Si è fermato più a lungo sul terzo
            ingranaggio, quello con i denti consumati da una parte sola. Prima
            di spegnersi, il congegno ha girato per anni nello stesso verso.

            Quando te ne vai, i due uomini
            all'ingresso del Velo smettono di parlare fra loro per guardarti
            passare.
          effetti: { reliquie.meccanismo-spento: -1, monete: 38, sospetto: 1.5 }

      - testo: "Contrattare a lungo, con la merce sotto il mantello"
        descrizione: "Il primo prezzo è sempre una domanda, e due banchi che si contendono lo stesso segreto alzano l'offerta da soli."
        requisiti: [informazioni.segreto >= 1]
        prova: { attributo: sociale, abilita: [persuasione, conoscenze-della-strada], difficolta: Difficile }
        successo:
          titolo: Da un banco all'altro
          testo: |
            Fai sentire a un banco solo l'inizio del tuo segreto, e poi vai a
            chiedere che cosa ne pensa il banco di fronte. Dopo qualche giro i
            due compratori hanno smesso di guardare te e si guardano fra loro,
            con l'odio cordiale dei vicini di bottega, e il prezzo sale a ogni passo che fai verso l'altro banco. Chiudi
            quando l'uomo del banco del fondo si alza in piedi per stringerti la
            mano. Fino alla scala ti segue lo sguardo di un uomo del Velo, che
            stavolta ti perde di vista presto.
          effetti: { informazioni.segreto: -1, monete: 45, sospetto: 1 }
        fallimento:
          titolo: Il prezzo che scende
          testo: |
            Fai sentire a un banco l'inizio del tuo segreto e vai a chiedere che
            cosa ne pensa il banco di fronte. Quando torni, il primo compratore
            sa già il resto, perché il banco di fronte gliel'ha rivenduto mentre
            tu facevi il giro, e il prezzo è sceso. Vendi lo stesso, a meno di
            quanto avresti preso subito, e il sorriso del compratore ti resta
            addosso fino alla scala. Lì ti accorgi che l'uomo con
            il cappuccio ti ha seguito con gli occhi da un banco all'altro, per
            tutta la sera.
          effetti: { informazioni.segreto: -1, monete: 25, sospetto: 1.5 }

      - testo: "Girare fra i banchi senza comprare"
        descrizione: "Ascoltare costa poco, finché tieni le mani lontane dalla merce."
        esito:
          titolo: Le orecchie aperte
          testo: |
            Fai il giro dei banchi con le mani dietro la schiena, fermandoti a
            guardare senza toccare niente. Il venditore di formaggio racconta a
            una cliente di una partita di cristalli fermata ai Ponti, e due
            Raschiatori discutono a voce troppo alta di un pozzo cieco che
            qualcuno ha richiuso. Alla fine compri un pezzo di formaggio, per
            avere un motivo di restare al banco ad ascoltare. È più stagionato
            dei segreti che girano qui sotto, e ti porti via quello che hai
            sentito insieme alla crosta.
          effetti: { informazioni.voce: 2 }
