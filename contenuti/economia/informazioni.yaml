# L'economia della città, la famiglia delle Informazioni (strato 1, ottobre 2026).
# Le conversioni ripetibili, ognuna in un luogo preciso e migliore di `cucire-voci` (Città Bassa, ovunque):
#   A1 le-voci-della-sala (Grifone di Ferro): voci → pettegolezzi; con pista.acciaio >= 6 la via di Liaren.
#   A2 gli-archivi-incrociati (Biblioteca, rep.biblioteca >= 3): pettegolezzi → segreti; con rep 7 gli
#      scaffali chiusi.
#   A3 i-verbali-della-cancelleria (Municipio): pettegolezzi → segreti, con il copista o con una prova
#      (sociale o fisica) che costa Sospetto se fallisce.
#   A4 un-nome-per-la-guarnigione (Guarnigione): la via di lato, poco denaro e Sospetto che scende. Il
#      sergente è Livio Mastrel (contenuti/citta/guarnigione.yaml).
# Il Mercato delle Ombre:
#   A5 chi-sa-dove-si-e-spostato (Città Bassa, fisso, contatto-ombra == 0): come trovare l'ingresso. Torna
#      da sola se la crisi del Sospetto brucia il contatto.
#   A6 i-banchi-senza-timbro (presso mercato-delle-ombre): lo scalino più alto di ogni famiglia al prezzo
#      migliore, con il Sospetto. Nessuno Scuro con nome, così vale anche dopo pista.pelle >= 6.
# I prezzi stanno negli effetti, mai nella prosa (docs/stile-dei-testi.md, regola 11).
storylet:
  # ------------------------------------------------------------ A1 · voci → pettegolezzi
  - id: le-voci-della-sala
    presso: grifone-di-ferro
    immagine: ambientazione/locanda-del-grifone-di-ferro
    titolo: Le voci della sala
    sommario: "A fine serata il Grifone ha sentito tutto quello che passa sui Ponti, e il tavolo d'angolo resta libero."
    luogo: Locanda del Grifone di Ferro, il tavolo d'angolo, a fine serata
    area: ponti-sospesi
    ripetibile: true
    testo: |
      A fine serata, quando i Raschiatori del turno lungo vanno alle brande,
      nella sala del Grifone restano le chiacchiere. Il tavolo d'angolo vicino
      al camino, con la gamba zeppata da un tappo di sughero, resta libero
      fino alla chiusura, e ti ci siedi con il boccale.

      Un mercante di stoffe giurava che la Gilda alzerà il dazio sul Ponte
      delle Mille Corde, e due vedette hanno visto una lanterna accesa in
      fondo alla Cicatrice.

      {origine apprendista-raschiatore} Sulle piattaforme hai imparato per chi
      si accendono le lanterne, e laggiù in fondo non c'è nessuno per cui
      accenderne una.
    opzioni:
      - testo: "Mettere in fila le voci della settimana"
        descrizione: "Un mucchio di voci raccolte in giro, confrontate al tavolo d'angolo finché qualcuna regge."
        requisiti: [informazioni.voce >= 6]
        esito:
          titolo: Due tavoli che non si parlano
          testo: |
            Stendi le voci sul tavolo come le carte di un solitario e scarti
            quelle che hanno un testimone solo. Il dazio sul Ponte regge, perché
            lo raccontano un mercante e un Custode di Passaggio che si odiano da
            anni. Regge anche la lanterna in fondo alla Cicatrice. Quando Brunella
            spegne l'ultima lampada ti restano poche cose vere e una gran voglia
            di dormire.
          effetti: { informazioni.voce: -6, informazioni.pettegolezzo: 2 }

      - testo: "Una serata intera ad ascoltare"
        descrizione: "Dall'apertura alla chiusura, da un tavolo all'altro, con un boccale che non si vuota mai."
        costo: 2
        requisiti: [informazioni.voce >= 15]
        esito:
          titolo: Fino all'ultima brace
          testo: |
            Arrivi quando Brunella accende il camino e te ne vai quando lo copre
            di cenere, con un boccale che serve solo a giustificare la sedia.
            Sentite nella stessa notte le voci si confrontano meglio, perché chi
            inventa ripete la storia sempre con le stesse parole. A notte fonda
            sul tuo foglio ci sono più fatti di quanti ne raccolga in una
            settimana un cronista del Velo.
          effetti: { informazioni.voce: -15, informazioni.pettegolezzo: 6 }

      - testo: "Chiedere a Liaren cosa ha sentito dal palco"
        descrizione: "Dallo sgabello alto Liaren vede tutta la sala, e mentre suona sente anche quello che si dice sottovoce."
        immagine: personaggi/liaren-tarvelin
        quando: [pista.acciaio >= 6]
        requisiti: [informazioni.voce >= 4]
        prova: { attributo: sociale, abilita: [empatia, conoscenze-della-strada], difficolta: Media }
        successo:
          titolo: Dal palco
          testo: |
            Aspetti che Liaren posi il samisen e le porti un boccale di quello
            buono che Brunella tiene sotto il bancone. Lei ascolta le tue voci
            battendo il tempo sul ginocchio. «Questa è vera, l'ho sentita da tre
            tavoli» dice, e con il plettro ne batte un'altra. «Quest'altra l'ha
            messa in giro Orazio Belcanto per far parlare del Teatro.» Alla fine
            ti restano meno voci, controllate da lei.
          effetti: { informazioni.voce: -4, informazioni.pettegolezzo: 2 }
        fallimento:
          titolo: Le stesse cose
          testo: |
            Liaren ascolta le tue voci con il mento appoggiato al manico del
            samisen, annuendo con troppa pazienza. Poi ride e ti dice che le ha
            sentite anche lei dagli stessi tavoli, con le stesse parole, perché
            stasera la sala ha raccontato a tutti la medesima storia. Ti offre il
            boccale per consolarti, e le voci più deboli finiscono nel camino.
          effetti: { informazioni.voce: -2 }

  # ------------------------------------------------------------ A2 · pettegolezzi → segreti
  - id: gli-archivi-incrociati
    presso: biblioteca-di-qir-azel
    immagine: ambientazione/biblioteca-di-qir-azel
    titolo: Gli archivi incrociati
    sommario: "Nella sala di lettura ci sono i registri della città, e un pettegolezzo che ci regge sopra diventa un segreto."
    luogo: Biblioteca di Qir-Azel, la sala di lettura, nel pomeriggio
    area: quartieri-alti
    ripetibile: true
    requisiti: [rep.biblioteca >= 3]
    testo: |
      Ulric Stanne ti ha dato un angolo del tavolo lungo e il permesso di
      chiedere i registri uno alla volta, purché li riporti con i nastri
      annodati com'erano. Sono i registri delle spedizioni e le copie dei dazi
      della Gilda.

      {origine mercante-dei-ponti} Il registro dei dazi l'hai sempre visto
      dall'altra parte del banco, e da qui ti mette un buonumore un po'
      vendicativo.

      Se un mercante giura che la Casa dei Nodi ha venduto cristalli a
      Pannion, in questi registri c'è un dazio pagato, oppure il buco dove
      dovrebbe stare.
    opzioni:
      - testo: "Confrontare i pettegolezzi con i registri"
        descrizione: "Un foglietto alla volta, accanto alla colonna giusta del registro giusto."
        requisiti: [informazioni.pettegolezzo >= 4]
        esito:
          titolo: Il dazio pagato due volte
          testo: |
            Il registro dei dazi è scritto in una grafia fitta e uguale, e ci
            metti un'ora a capire che le colonne vanno lette dal basso. Quasi
            tutti i tuoi foglietti restano senza riscontro. Uno combacia con un
            dazio pagato due volte dallo stesso mercante per lo stesso carico, in
            due mesi diversi. Ulric riprende il registro, controlla il nodo del
            nastro e non ti chiede che cosa hai trovato.
          effetti: { informazioni.pettegolezzo: -4, informazioni.segreto: 1 }

      - testo: "Una settimana in sala di lettura"
        descrizione: "Ogni pomeriggio della settimana allo stesso angolo del tavolo lungo, finché Ulric comincia a tenerti la sedia."
        costo: 2
        requisiti: [informazioni.pettegolezzo >= 9]
        esito:
          titolo: La sedia tenuta
          testo: |
            Per una settimana arrivi alla stessa ora e trovi i registri già sul
            tavolo, perché Ulric ha cominciato a prepararteli, ogni volta con un
            sospiro più lungo. Mattias ti presta la lente e ti insegna a riconoscere
            le correzioni fatte a posteriori, che hanno l'inchiostro più fresco. A
            fine settimana dei tuoi pettegolezzi ne restano pochi, solidi da ogni
            lato, e Ulric ti fa pagare la carta per ricopiarli.
          effetti: { informazioni.pettegolezzo: -9, informazioni.segreto: 3 }

      - testo: "Chiedere le chiavi degli scaffali chiusi"
        descrizione: "Il tuo nome è sul registro delle chiavi, e dietro la cera nera stanno i conti sigillati della città."
        immagine: personaggi/ulric-stanne
        quando: [rep.biblioteca >= 7]
        requisiti: [informazioni.pettegolezzo >= 3]
        prova: { attributo: mentale, abilita: [accademiche, politica-ed-economia], difficolta: Difficile }
        successo:
          titolo: I mastri sigillati
          testo: |
            Ulric rompe il sigillo davanti a te e scrive l'ora sul registro.
            Dietro le ante ci sono i libri mastri della Gilda di trent'anni fa,
            chiusi dal Velo con la nota *in custodia*. Seguendo una famiglia di
            mercanti da un mastro all'altro, a sera sai dove è finito il denaro di
            un debito che a Qir-Azel tutti credono saldato.
          effetti: { informazioni.pettegolezzo: -3, informazioni.segreto: 2 }
        fallimento:
          titolo: Le colonne a rovescio
          testo: |
            Ulric rompe il sigillo e scrive l'ora sul registro. I libri mastri
            dietro la cera nera hanno le colonne a rovescio e i numeri in
            caratteri precuriani, e quando trovi un nome che conosci resti a
            fissare la riga senza capire se paga o riscuote. Accanto a quei conti
            i tuoi foglietti sembrano chiacchiere da fontana. Li lasci sul tavolo,
            e Ulric li usa per segnare le pagine.
          effetti: { informazioni.pettegolezzo: -3 }

  # ------------------------------------------------------------ A3 · pettegolezzi → segreti, in Municipio
  - id: i-verbali-della-cancelleria
    presso: municipio
    immagine: ambientazione/quartieri-alti
    titolo: I verbali della cancelleria
    sommario: "In Municipio i verbali del Consiglio passano per troppe mani, e lì un pettegolezzo trova la sua prova."
    luogo: Municipio, la cancelleria al pianterreno
    area: quartieri-alti
    ripetibile: true
    testo: |
      La cancelleria sta al pianterreno, e dopo ogni seduta del Consiglio i
      verbali scendono qui per essere ricopiati, tanto che a fine settimana ne
      girano più copie di quante se ne possano contare. I copisti lavorano a
      un tavolo lungo sotto una finestra alta, e il più anziano annaffia il
      vaso di gerani accanto al calamaio con l'acqua che avanza
      dall'inchiostro.

      Tullio Merga scende due volte al giorno a ritirare le copie e non conta
      mai i fogli.

      {origine rampollo-dei-quartieri-alti} Nei salotti i verbali arrivano già
      rilegati, e nessuno si chiede chi li ricopia.
    opzioni:
      - testo: "Pagare un copista per un estratto"
        descrizione: "Il copista dei gerani ricopia una riga in più per chi paga, e non chiede a cosa serva."
        requisiti: [informazioni.pettegolezzo >= 2, monete >= 10]
        esito:
          titolo: La riga in più
          testo: |
            Al copista dei gerani basta sentire l'argomento per sapere in quale
            seduta cercarlo. Ricopiando il verbale per la Gilda scrive una riga
            due volte, e la seconda finisce su un foglietto che ti passa sotto il
            vaso, con la data in margine. È la frase di un consigliere che
            conferma quello che in Città Bassa si diceva sottovoce. Gli lasci le
            monete accanto al calamaio.
          effetti: { informazioni.pettegolezzo: -2, monete: -10, informazioni.segreto: 1 }

      - testo: "Farti mostrare i verbali con una scusa"
        descrizione: "Un incarico della casata inventato al momento, detto con abbastanza sicurezza da sembrare vero."
        requisiti: [informazioni.pettegolezzo >= 3]
        prova: { attributo: sociale, abilita: [ingannare, galateo], difficolta: Difficile }
        successo:
          titolo: Per conto della segreteria
          testo: |
            Ti presenti al tavolo dei copisti come se ti mandasse la segreteria della Rappresentante e chiedi
            sbuffando i verbali dell'ultima stagione, che di sopra non sono mai arrivati. Il copista anziano
            li tira fuori senza discutere. Li sfogli in piedi sotto la finestra alta, trovi la seduta giusta
            prima che qualcuno ti chieda un nome e ripeti la riga fra i denti fino al portone.
          effetti: { informazioni.pettegolezzo: -3, informazioni.segreto: 1 }
        fallimento:
          titolo: Un nome a caso
          testo: |
            Il copista anziano ti chiede gentilmente chi ti manda, e il nome che
            dici suona sbagliato già mentre ti esce di bocca. Lui lo manda di
            sopra con un garzone e ti offre una sedia. Te ne vai prima che il
            garzone torni, ma sulle scale Tullio Merga inforca gli occhiali per
            guardarti bene in faccia, e i foglietti con i tuoi pettegolezzi
            restano sul tavolo dei copisti.
          effetti: { informazioni.pettegolezzo: -3, sospetto: 1.5 }

      - testo: "Entrare in cancelleria dopo la chiusura"
        descrizione: "La finestra alta sopra il tavolo dei copisti non ha sbarre, perché nessuno ruba verbali."
        requisiti: [informazioni.pettegolezzo >= 3]
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Difficile }
        successo:
          titolo: La finestra alta
          testo: |
            Aspetti che Nino, il garzone che affigge i bandi, chiuda il portone. La
            finestra alta si apre con una spinta e scendi sul tavolo dei copisti senza
            rovesciare i gerani, poi l'armadio dei verbali cede alla punta di un
            coltello. Alla luce di una candela riparata nel palmo ricopi su un
            foglietto la riga che ti serve, ed esci dalla stessa finestra prima che
            passi la ronda.
          effetti: { informazioni.pettegolezzo: -3, informazioni.segreto: 1 }
        fallimento:
          titolo: I gerani
          testo: |
            Scendendo metti il piede nel vaso dei gerani, che va in pezzi con un
            rumore che rimbomba per tutto il corridoio, e una lanterna si ferma
            davanti al portone. Risali sul davanzale con la terra nello stivale e
            ti cali nel vicolo mentre qualcuno prova la serratura, perdendo
            qualche foglietto. La mattina dopo, in Città Bassa, si dice che la
            Caserma cerca uno bravo ad arrampicarsi.
          effetti: { informazioni.pettegolezzo: -1, sospetto: 2 }

  # ------------------------------------------------------------ A4 · la via di lato
  - id: un-nome-per-la-guarnigione
    presso: guarnigione-di-qir-azel
    immagine: ambientazione/guarnigione-di-qir-azel
    titolo: Un nome per la Guarnigione
    sommario: "La Caserma paga poco quello che sai, ma chi le porta un nome esce più leggero dai suoi registri."
    luogo: Guarnigione di Qir-Azel, la stanza della ronda di notte
    area: quartieri-alti
    ripetibile: true
    testo: |
      Livio Mastrel riceve prima della ronda di notte in una stanza stretta
      sotto la scala, piena del fumo della stufa, e a chi entra offre una
      radice di liquirizia prima ancora di chiedergli il nome.

      {origine figlio-della-citta-bassa} Nei tuoi vicoli la Caserma la si
      guarda dall'altro lato della strada, e qui con una liquirizia in bocca ti
      senti ospite e traditore insieme.

      «Paghiamo poco, ma chi ci dà una mano sui registri lo scriviamo a matita»
      dice masticando, e con il pollice indica lo scaffale alle sue spalle,
      dove i fascicoli stanno in fila per quartiere.
    opzioni:
      - testo: "Consegnare un segreto al sergente di turno"
        descrizione: "Livio scrive quello che gli dici con la sua grafia tonda e paga dalla cassa della ronda."
        requisiti: [informazioni.segreto >= 1]
        esito:
          titolo: La grafia tonda
          testo: |
            Racconti a Livio tutto quello che sai, e lui lo scrive sul registro con una grafia tonda
            da scolaro, fermandosi a succhiare la liquirizia quando un nome è difficile. Poi ti conta
            qualche moneta da una cassetta di latta ammaccata che a scuoterla suona appena. Prima che
            tu esca prende il tuo fascicolo dallo scaffale e ci scrive qualcosa in fondo, a matita,
            senza fartelo leggere.
          effetti: { informazioni.segreto: -1, monete: 12, sospetto: -2 }

      - testo: "Pagare in segreti, e il tuo fascicolo torna nel cassetto"
        descrizione: "Senza paga. Livio ha un cassetto in fondo allo scaffale da cui i fascicoli non escono più."
        requisiti: [informazioni.segreto >= 2, sospetto >= 1]
        esito:
          titolo: Il cassetto in fondo
          testo: |
            Livio ascolta tutto senza scrivere, con la liquirizia ferma fra i
            denti. Poi sfila il tuo fascicolo dallo scaffale e lo apre sul tavolo
            per fartelo vedere, più gonfio di quanto pensassi. Lo richiude, ci
            gira intorno lo spago e lo infila nel cassetto in fondo, quello dei
            fascicoli che la Caserma ha deciso di dimenticare. «Da lì non è mai
            uscito niente» dice, e ti allunga il barattolo.
          effetti: { informazioni.segreto: -2, sospetto: -5 }

      - testo: "Vendere un pettegolezzo di poco conto"
        descrizione: "Un pettegolezzo verificato, buono per la ronda di stanotte e per una riga a matita."
        requisiti: [informazioni.pettegolezzo >= 1]
        esito:
          titolo: Per la ronda di stanotte
          testo: |
            Gli dici dove si giocherà a dadi stanotte sui Ponti e chi terrà il
            banco. Livio lo annota in un angolo del registro dei turni e ti
            allunga qualche spicciolo dalla cassa. «Se li troviamo, la prossima
            liquirizia la offri tu» dice, e ride da solo, perché le radici le
            compra lui e non le ha mai fatte pagare a nessuno.
          effetti: { informazioni.pettegolezzo: -1, monete: 3, sospetto: -0.5 }

  # ------------------------------------------------------------ A5 · l'ingresso del Mercato delle Ombre
  - id: chi-sa-dove-si-e-spostato
    immagine: ambientazione/citta-bassa
    titolo: Chi sa dove si è spostato
    sommario: "Il Mercato delle Ombre ha cambiato stanza un'altra volta, e per scendere serve qualcuno che sappia dove."
    luogo: Città Bassa, alla fontana
    area: citta-bassa
    tipo: fisso
    requisiti: [contatto-ombra == 0]
    testo: |
      In Città Bassa del Mercato delle Ombre parlano tutti, e nessuno ti sa
      dire dove sia. Ogni due o tre mesi la piazza sotterranea cambia stanza e
      mura gli ingressi vecchi, e quelli nuovi li conosce poca gente.

      {conoscenze-della-strada Media} Se tutti ne parlano, nessuno ci è sceso
      di recente, e chi lo sa davvero siede in un posto dove si paga anche la
      sedia.

      Alla fontana una lavandaia ti racconta che suo cognato ci è sceso una
      volta, ma beveva troppo per ricordarsi da quale porta.
    opzioni:
      - testo: "Chiedere agli Scuri"
        descrizione: "Alla Pignatta Grassa sanno sempre dov'è il Mercato. Un favore degli Scuri si paga con un altro favore."
        immagine: fazioni/scuri
        quando: [pista.pelle < 6]
        requisiti: [rep.scuri >= 1]
        esito:
          titolo: Il colpo giusto
          testo: |
            Al bancone della Pignatta Grassa chiedi del Mercato, e il garzone ti
            fa aspettare finché arriva un uomo con il cappuccio abbassato e una
            cicatrice sul labbro. Ti descrive la porta di una cantina, il colpo da
            battere e la parola da dire, e te li fa ripetere finché li sai. «Gli
            Scuri si ricordano di chi aiutano» dice, «e un giorno ti chiederanno
            qualcosa che farai senza domande.»
          imposta: { contatto-ombra: 1 }
          effetti: { rep.scuri: -0.5 }

      - testo: "Pagare un ragazzo dell'Orlo dei Rottami"
        descrizione: "I ragazzi dell'Orlo frugano anche sottoterra, e una notizia buona la scambiano volentieri con una strada."
        immagine: ambientazione/orlo-dei-rottami
        requisiti: [informazioni.pettegolezzo >= 2]
        esito:
          titolo: L'ingranaggio al collo
          testo: |
            Il capo dei ragazzi dell'Orlo, quello con l'ingranaggio al collo,
            ascolta i tuoi pettegolezzi e alla fine annuisce, serio come un
            notaio. Ti porta a un tombino dietro le baracche e scosta la grata con
            il piede, scoprendo una scala di ferro che scende nel buio. «Al terzo
            pianerottolo bussi due volte, e se ti chiedono chi ti manda, io non ti
            ho mai visto» dice.
          imposta: { contatto-ombra: 1 }
          effetti: { informazioni.pettegolezzo: -2 }

      - testo: "Seguire i cristalli non registrati"
        descrizione: "I cristalli senza timbro fanno una luce più verde, che si può seguire fino a una porta."
        immagine: ambientazione/cristalli-conduttori
        prova: { attributo: mentale, abilita: [percezione, magia], difficolta: Media }
        successo:
          titolo: La luce verde
          testo: |
            Per due sere stai seduto sul bordo della fontana a guardare le gerle
            che passano. La terza sera vedi un facchino con una gerla coperta, e
            dalla trama della tela filtra una luce più verde di quella delle
            lanterne della Gilda. Lo segui a distanza per una serie di vicoli
            finché scende i gradini di una cantina e bussa in un modo che ti
            stampi in testa.
          imposta: { contatto-ombra: 1 }
        fallimento:
          titolo: Il facchino si volta
          testo: |
            Segui per mezza notte un facchino con una gerla che manda una luce
            verdognola, e lui ti porta in giro senza fretta, fermandosi a comprare
            una castagna. Sotto un lampione si volta e ti chiede se hai perso
            qualcosa. Nella gerla ci sono cristalli con il timbro della Gilda e
            una lanterna dal vetro verde. Il giorno dopo un miliziano vuole sapere
            perché ti piace tanto passeggiare di notte.
          effetti: { sospetto: 1 }

      - testo: "Lasciar perdere, per ora"
        descrizione: "Prima o poi qualcuno ti dirà dove scendere, e il Mercato intanto avrà già cambiato stanza."
        costo: 0
        esito:
          titolo: Per ora
          testo: |
            Lasci la lavandaia ai suoi panni e torni sui tuoi passi. Il Mercato
            delle Ombre resta sotto i piedi di qualcun altro, e fra un paio di
            mesi sarà comunque da un'altra parte. Ti segni a mente le facce di
            questa strada che potrebbero saperne qualcosa, per quando avrai
            qualcosa da dare in cambio.

  # ------------------------------------------------------------ A6 · il Mercato delle Ombre
  - id: i-banchi-senza-timbro
    presso: mercato-delle-ombre
    immagine: ambientazione/mercato-delle-ombre
    titolo: I banchi senza timbro
    sommario: "Sotto la Città Bassa si paga meglio che in qualunque bottega, e qualcuno ti guarda sempre mentre incassi."
    luogo: Mercato delle Ombre, la piazza sotterranea
    area: citta-bassa
    ripetibile: true
    testo: |
      In fondo alla scala c'è una piazza scavata sotto la Città Bassa, nella luce verdognola dei cristalli
      non registrati. I banchi sono assi su cavalletti coperte di reliquie senza il timbro della Gilda, e
      su uno si vende anche formaggio.

      Ogni ingresso ha i suoi uomini sulla soglia, quelli della Confraternita del Velo con il cappuccio
      alzato e gli altri che giocano a dadi su una cassa.

      {origine accolito-del-velo} I cappucci del Velo li riconosci dal taglio, e ti chiedi se in Cattedrale
      qualcuno sappia che scendono fin qui.
    opzioni:
      - testo: "Vendere un segreto"
        descrizione: "Al banco del fondo comprano quello che sai, e lo pagano meglio di qualunque salotto dei Quartieri Alti."
        requisiti: [informazioni.segreto >= 1]
        esito:
          titolo: Il banco del fondo
          testo: |
            L'uomo del banco del fondo ascolta il tuo segreto con gli occhi chiusi
            e la testa inclinata, come un accordatore. Poi fa un prezzo che non
            discuti e ti paga con monete di conî diversi, impilate sull'asse in
            colonne ordinate. Mentre le raccogli, all'ingresso accanto un uomo con
            il cappuccio ti guarda le mani, e quando alzi la testa lui abbassa la
            sua.
          effetti: { informazioni.segreto: -1, monete: 38, sospetto: 1.5 }

      - testo: "Vendere un cristallo carico"
        descrizione: "Un cristallo carico senza timbro qui vale più che alla Casa dei Nodi, e nessuno chiede da dove venga."
        requisiti: [cristalli.cristallo-carico >= 1]
        esito:
          titolo: Il ronzio
          testo: |
            La donna del banco dei cristalli prende il tuo a mani nude e se lo
            avvicina all'orecchio per sentirne il ronzio, come si fa con le
            conchiglie, poi lo fa sparire sotto il banco e ti conta le monete.
            Accanto a lei un ragazzino ti fissa, e quando gli chiedi se ti conosce
            risponde che adesso sì.
          effetti: { cristalli.cristallo-carico: -1, monete: 38, sospetto: 1.5 }

      - testo: "Vendere un meccanismo dei Precursori"
        descrizione: "Un congegno intero, anche spento, qui trova sempre qualcuno che sa a cosa serviva, o finge di saperlo."
        requisiti: [reliquie.meccanismo-spento >= 1]
        esito:
          titolo: Le dita sugli ingranaggi
          testo: |
            Il compratore dei congegni è un vecchio Raschiatore con le dita
            storte, che passa i polpastrelli sugli ingranaggi del tuo meccanismo
            come un cieco sul viso di un parente. Ti paga senza contrattare e ti
            dice che di congegni interi ne arrivano sempre meno. Quando te ne vai,
            i due uomini del Velo all'ingresso smettono di parlare fra loro per
            guardarti passare.
          effetti: { reliquie.meccanismo-spento: -1, monete: 38, sospetto: 1.5 }

      - testo: "Contrattare a lungo, con la merce sotto il mantello"
        descrizione: "Il primo prezzo è sempre una domanda, e due banchi che si contendono un segreto alzano l'offerta da soli."
        requisiti: [informazioni.segreto >= 1]
        prova: { attributo: sociale, abilita: [persuasione, conoscenze-della-strada], difficolta: Difficile }
        successo:
          titolo: Da un banco all'altro
          testo: |
            Fai sentire a un banco solo l'inizio del tuo segreto, poi vai a chiedere che cosa ne pensa il banco di
            fronte. Dopo qualche giro i due compratori si guardano fra loro con l'odio cordiale dei vicini di bottega, e
            il prezzo sale a ogni passo. Chiudi quando l'uomo del banco del fondo si alza in piedi per stringerti la
            mano.
          effetti: { informazioni.segreto: -1, monete: 45, sospetto: 1 }
        fallimento:
          titolo: Il prezzo che scende
          testo: |
            Quando torni dal banco di fronte, il primo compratore sa già il resto
            del tuo segreto, perché l'altro gliel'ha rivenduto mentre facevi il
            giro, e il prezzo è sceso. Vendi lo stesso, a meno di quanto avresti
            preso subito. Sulla scala ti accorgi che l'uomo con il cappuccio ti ha
            seguito con gli occhi da un banco all'altro, per tutta la sera.
          effetti: { informazioni.segreto: -1, monete: 25, sospetto: 1.5 }

      - testo: "Girare fra i banchi senza comprare"
        descrizione: "Ascoltare costa poco, finché tieni le mani lontane dalla merce."
        esito:
          titolo: Le orecchie aperte
          testo: |
            Fai il giro dei banchi con le mani dietro la schiena. Il venditore di
            formaggio racconta a una cliente di una partita di cristalli fermata
            ai Ponti, e due Raschiatori discutono a voce troppo alta di un pozzo
            cieco che qualcuno ha richiuso. Alla fine compri un pezzo di
            formaggio, per avere un motivo di restare, e te ne vai con quello che
            hai sentito e con la crosta.
          effetti: { informazioni.voce: 2 }
