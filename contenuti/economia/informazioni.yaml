# L'economia della città, la famiglia delle Informazioni (strato 1, ottobre 2026).
# Le conversioni ripetibili, ognuna in un luogo preciso e migliore di `cucire-voci` (Città Bassa, ovunque):
#   A1 le-voci-della-sala (Grifone di Ferro): voci → pettegolezzi; con pista.acciaio >= 6 la via di Liaren.
#   A2 gli-archivi-incrociati (Biblioteca, rep.biblioteca >= 3): pettegolezzi → segreti; con rep 7 gli
#      scaffali chiusi.
#   A3 i-verbali-della-cancelleria (Municipio): pettegolezzi → segreti, con il copista o con una prova
#      (sociale o fisica) che costa Sospetto se fallisce.
#   A4 un-nome-per-la-guarnigione (Guarnigione): la via di lato, poco denaro e Sospetto che scende. Il
#      sergente è Livio Mastrel (contenuti/citta/guarnigione.yaml).
# Il Mercato delle Ombre:
#   A5 chi-sa-dove-si-e-spostato (Città Bassa, fisso, contatto-ombra == 0): come trovare l'ingresso. Torna
#      da sola se la crisi del Sospetto brucia il contatto.
#   A6 i-banchi-senza-timbro (presso mercato-delle-ombre): lo scalino più alto di ogni famiglia al prezzo
#      migliore, con il Sospetto. Nessuno Scuro con nome, così vale anche dopo pista.pelle >= 6.
# I prezzi stanno negli effetti, mai nella prosa (docs/stile-dei-testi.md, regola 11).
storylet:
  # ------------------------------------------------------------ A1 · voci → pettegolezzi
  - id: le-voci-della-sala
    presso: grifone-di-ferro
    immagine: ambientazione/locanda-del-grifone-di-ferro
    titolo: Le voci della sala
    sommario: "A fine serata la sala del Grifone ha sentito tutto quello che è passato sui Ponti, e il tavolo d'angolo resta libero per metterlo in fila."
    luogo: Locanda del Grifone di Ferro, il tavolo d'angolo, a fine serata
    area: ponti-sospesi
    ripetibile: true
    testo: |
      Il tavolo d'angolo vicino al camino resta libero fino alla chiusura. Ti ci siedi con il boccale in mano
      a rifare la serata da capo, un tavolo alla volta, mentre sul piano di quercia si asciugano gli anelli
      lasciati dai boccali degli altri.

      Un mercante di stoffe giurava che la Gilda alzerà il dazio sul Ponte delle Mille Corde, e un Raschiatore
      gli rispondeva che il dazio lo pagano sempre quelli come lui. Due vedette hanno visto una lanterna
      accesa in fondo alla Cicatrice, dove di lanterne non ce ne dovrebbero essere. Lo raccontavano a voce
      bassa, e al tavolo vicino hanno smesso di bere per ascoltarle.

      {origine apprendista-raschiatore} Sulle piattaforme hai imparato per chi si accendono le lanterne, e
      laggiù in fondo non c'è nessuno per cui accenderne una. Le dita ti si stringono intorno al boccale.

      {conoscenze-della-strada Facile} Quello che si ripete da due tavoli che non si parlano di solito ha un
      fondo, e il fondo si vende.
    opzioni:
      - testo: "Mettere in fila le voci della settimana"
        descrizione: "Un mucchio di voci raccolte in giro, confrontate al tavolo d'angolo finché qualcuna regge."
        requisiti: [informazioni.voce >= 6]
        esito:
          titolo: Due tavoli che non si parlano
          testo: |
            Il dazio sul Ponte regge, perché lo raccontano un mercante e un Custode di Passaggio che si odiano
            da anni e non si metterebbero d'accordo nemmeno sul colore della birra. Le altre voci le scarti
            una a una, perché ciascuna si sfalda appena la metti accanto a quella del tavolo vicino. Regge
            anche la lanterna in fondo alla Cicatrice, e a pensarci ti si raffreddano le mani intorno al
            boccale. Quando Brunella spegne l'ultima lampada ti restano poche cose vere e una gran voglia di
            dormire.
          effetti: { informazioni.voce: -6, informazioni.pettegolezzo: 2 }

      - testo: "Una serata intera ad ascoltare"
        descrizione: "Dall'apertura alla chiusura, da un tavolo all'altro, con un boccale che non si vuota mai."
        costo: 2
        requisiti: [informazioni.voce >= 15]
        esito:
          titolo: Fino all'ultima brace
          testo: |
            Arrivi quando Brunella accende il camino e te ne vai quando lo copre di cenere. Sentite tutte
            nella stessa notte, le voci si lasciano confrontare meglio, dato che chi inventa ripete la sua
            storia sempre con le stesse parole. Chi ha visto davvero qualcosa la racconta ogni volta in un
            modo un po' diverso, e cambia soltanto i dettagli che non contano. A notte fonda sul tuo foglio ci
            sono più fatti di quanti ne raccolga un cronista del Velo in una settimana, e nelle orecchie ti
            ronzano ancora le voci degli altri.
          effetti: { informazioni.voce: -15, informazioni.pettegolezzo: 6 }

      - testo: "Chiedere a Liaren cosa ha sentito dal palco"
        descrizione: "Dallo sgabello alto Liaren vede tutta la sala, e mentre suona sente anche quello che si dice sottovoce."
        immagine: personaggi/liaren-tarvelin
        quando: [pista.acciaio >= 6]
        requisiti: [informazioni.voce >= 4]
        prova: { attributo: sociale, abilita: [empatia, conoscenze-della-strada], difficolta: Media }
        successo:
          titolo: Dal palco
          testo: |
            Aspetti che Liaren posi il samisen e le porti un boccale di quello buono, che Brunella tiene sotto
            il bancone. Lei beve un sorso e poi tocca i tuoi foglietti uno dopo l'altro con il plettro.
            «Questa è vera, l'ho sentita da tre tavoli» dice, e con il plettro ne batte un'altra. «Quest'altra
            l'ha messa in giro Orazio Belcanto per far parlare del Teatro, e ogni stagione ne inventa una
            nuova.»

            Quando finisce il boccale ti restano meno voci di prima, e quelle che restano le ha controllate
            lei.
          effetti: { informazioni.voce: -4, informazioni.pettegolezzo: 2 }
        fallimento:
          titolo: Le stesse cose
          testo: |
            Liaren ascolta le tue voci con il mento appoggiato al manico del samisen, e annuisce a ognuna con
            troppa pazienza. Poi ride e ti dice che le ha sentite anche lei dagli stessi tavoli e con le
            stesse parole, perché stasera la sala ha raccontato a tutti la medesima storia. Ti offre il
            boccale per consolarti, e lo accetti senza fare storie. Prima di andartene butti nel camino i
            foglietti delle voci più deboli, e la carta si accartoccia sulla brace e annerisce prima di
            prendere fuoco. Ripetute da lei ti sono sembrate ancora più deboli.
          effetti: { informazioni.voce: -2 }

  # ------------------------------------------------------------ A2 · pettegolezzi → segreti
  - id: gli-archivi-incrociati
    presso: biblioteca-di-qir-azel
    immagine: ambientazione/biblioteca-di-qir-azel
    titolo: Gli archivi incrociati
    sommario: "Nella sala di lettura ci sono i registri della città, e un pettegolezzo che ci passa sopra senza strapparsi diventa un segreto."
    luogo: Biblioteca di Qir-Azel, la sala di lettura, nel pomeriggio
    area: quartieri-alti
    ripetibile: true
    requisiti: [rep.biblioteca >= 3]
    testo: |
      Ulric Stanne ti ha dato un angolo del tavolo e il permesso di chiedere i registri, purché li riporti uno
      alla volta con i nastri annodati come li hai trovati. Sono i registri delle spedizioni e le copie dei
      dazi che la Gilda manda alla Biblioteca. Hanno le coperte di cartone telato con i dorsi scoloriti dalla
      finestra, e dentro le pagine dei dazi sono divise in colonne tirate a righello.

      {origine mercante-dei-ponti} Il registro dei dazi lo hai sempre visto dall'altra parte del banco, mentre
      l'esattore ci scriveva quello che pagavi. Letto da qui ti mette addosso un buonumore un po' vendicativo.

      Due sedie più in là Mattias Crenn studia una pietra precuriana con la lente, e nella sala si sentono
      solo le pagine che girano e il vetro della lente che tocca la pietra. Hai portato i tuoi pettegolezzi
      scritti su foglietti. Se un mercante giura che la Casa dei Nodi ha venduto un carico di cristalli a
      Pannion, in questi registri c'è un dazio pagato oppure il buco dove dovrebbe stare.
    opzioni:
      - testo: "Confrontare i pettegolezzi con i registri"
        descrizione: "Un foglietto alla volta, accanto alla colonna giusta del registro giusto."
        requisiti: [informazioni.pettegolezzo >= 4]
        esito:
          titolo: Il dazio pagato due volte
          testo: |
            Quasi tutti i tuoi foglietti restano senza riscontro, e li accartocci in tasca uno dopo l'altro.
            Uno combacia con un dazio pagato due volte dallo stesso mercante per lo stesso carico, in due mesi
            diversi e con lo stesso peso segnato fino all'ultima libbra. Ulric riprende il registro, controlla
            il nodo del nastro e non ti chiede che cosa hai trovato, perché lo ha già letto sulla tua faccia.
          effetti: { informazioni.pettegolezzo: -4, informazioni.segreto: 1 }

      - testo: "Una settimana in sala di lettura"
        descrizione: "Ogni pomeriggio della settimana allo stesso angolo del tavolo lungo, finché Ulric comincia a tenerti la sedia."
        costo: 2
        requisiti: [informazioni.pettegolezzo >= 9]
        esito:
          titolo: La sedia tenuta
          testo: |
            Per una settimana arrivi alla stessa ora e trovi i registri già sul tavolo, perché Ulric ha
            cominciato a prepararteli, ogni volta con un sospiro più lungo del giorno prima. I pettegolezzi
            che avevi portato li confronti con tutto quello che la Biblioteca conserva. A fine settimana hai i
            polpastrelli grigi di polvere e un callo nuovo dove tieni la penna, e dei pettegolezzi ne restano
            pochi, solidi da ogni lato. Li ricopi in bella su un foglio piegato, e Ulric ti fa pagare la
            carta.
          effetti: { informazioni.pettegolezzo: -9, informazioni.segreto: 3 }

      - testo: "Chiedere le chiavi degli scaffali chiusi"
        descrizione: "Il tuo nome è sul registro delle chiavi, e dietro la cera nera ci sono i conti che la città ha preferito sigillare."
        immagine: personaggi/ulric-stanne
        quando: [rep.biblioteca >= 7]
        requisiti: [informazioni.pettegolezzo >= 3]
        prova: { attributo: mentale, abilita: [accademiche, politica-ed-economia], difficolta: Difficile }
        successo:
          titolo: I mastri sigillati
          testo: |
            Dietro le ante ci sono i libri mastri della Gilda di trent'anni fa, chiusi dal Velo con una nota
            sulla copertina che dice soltanto *in custodia*. Li apri accanto ai tuoi foglietti, e le pagine si
            staccano una dall'altra con un piccolo schiocco perché nessuno le separa da allora. Segui una
            famiglia di mercanti da un mastro all'altro.

            A sera sai dove è finito il denaro di un debito che a Qir-Azel tutti credono saldato, e lo scrivi
            in fretta, prima di pentirti di saperlo.
          effetti: { informazioni.pettegolezzo: -3, informazioni.segreto: 2 }
        fallimento:
          titolo: Le colonne a rovescio
          testo: |
            Ulric rompe il sigillo e scrive l'ora sul registro. I libri mastri dietro la cera nera seguono una
            contabilità che non hai mai visto, con le colonne a rovescio e i numeri segnati in caratteri
            precuriani. Passi il pomeriggio a cercare un nome che conosci, con il dito che scorre le righe da
            destra a sinistra. Quando lo trovi resti a fissare la riga senza capire se paga o riscuote, mentre
            la candela si accorcia.
          effetti: { informazioni.pettegolezzo: -3 }

  # ------------------------------------------------------------ A3 · pettegolezzi → segreti, in Municipio
  - id: i-verbali-della-cancelleria
    presso: municipio
    immagine: ambientazione/quartieri-alti
    titolo: I verbali della cancelleria
    sommario: "In Municipio i verbali del Consiglio passano per troppe mani, e chi sa dove guardare ci trova la prova di un pettegolezzo."
    luogo: Municipio, la cancelleria al pianterreno
    area: quartieri-alti
    ripetibile: true
    testo: |
      Dopo ogni seduta del Consiglio i verbali scendono qui per essere ricopiati, e ne girano più copie di
      quante se ne possano contare. I copisti lavorano curvi a un tavolo lungo sotto una finestra alta.
      Davanti a ogni posto il legno è macchiato da una spruzzata di gocce secche, dove ciascuno scuote la
      penna da anni. Il più anziano tiene accanto al calamaio un vaso di gerani e lo annaffia con l'acqua che
      avanza dall'inchiostro.

      {furtivita Media} La finestra alta sopra il tavolo non ha sbarre e il gancio del telaio è allentato. Te
      lo segni come ti segni sempre le uscite.

      {origine rampollo-dei-quartieri-alti} Nei salotti dei Quartieri Alti i verbali del Consiglio arrivano
      già rilegati, e nessuno si chiede chi li ricopia. Ti viene da raddrizzare la schiena davanti al copista
      dei gerani.
    opzioni:
      - testo: "Pagare un copista per un estratto"
        descrizione: "Il copista dei gerani ricopia una riga in più per chi paga, e non chiede a cosa serva."
        requisiti: [informazioni.pettegolezzo >= 2, monete >= 10]
        esito:
          titolo: La riga in più
          testo: |
            Al copista dei gerani basta sentire l'argomento per sapere in quale seduta cercarlo. Mentre
            ricopia il verbale per la Gilda scrive una riga due volte, senza alzare la testa e senza cambiare
            ritmo, e la seconda finisce su un foglietto che ti passa sotto il vaso. È la frase di un
            consigliere che conferma quello che in Città Bassa si diceva sottovoce, con la data della seduta
            in margine e una goccia d'acqua dei gerani che ha fatto sbavare l'inchiostro.
          effetti: { informazioni.pettegolezzo: -2, monete: -10, informazioni.segreto: 1 }

      - testo: "Farti mostrare i verbali con una scusa"
        descrizione: "Un incarico della casata inventato al momento, detto con abbastanza sicurezza da sembrare vero."
        requisiti: [informazioni.pettegolezzo >= 3]
        prova: { attributo: sociale, abilita: [ingannare, galateo], difficolta: Difficile }
        successo:
          titolo: Per conto della segreteria
          testo: |
            Ti presenti al tavolo dei copisti come se ti mandasse la segreteria della Rappresentante, e chiedi
            i verbali dell'ultima stagione sbuffando, perché li hai già chiesti due volte e di sopra non sono
            mai arrivati. Te li danno legati con lo spago, e la carta odora ancora di colla.

            Li sfogli in piedi sotto la finestra alta e trovi la seduta giusta prima che a qualcuno venga in
            mente di chiederti un nome. Impari la riga a memoria e la ripeti fra i denti fino al portone.
          effetti: { informazioni.pettegolezzo: -3, informazioni.segreto: 1 }
        fallimento:
          titolo: Un nome a caso
          testo: |
            Ti presenti come se ti mandasse la segreteria della Rappresentante, e il copista anziano ti chiede
            con molta gentilezza il nome di chi ti manda. Ne dici uno a caso, e ti suona sbagliato già mentre
            ti esce di bocca. Lui lo scrive su un foglietto con la stessa grafia ordinata dei verbali e lo
            manda di sopra con un garzone, e intanto ti offre una sedia. Te ne vai prima che il garzone torni,
            ma sulle scale incroci Tullio Merga, che inforca gli occhiali per guardarti bene in faccia. I
            foglietti con i tuoi pettegolezzi sono rimasti sul tavolo dei copisti.
          effetti: { informazioni.pettegolezzo: -3, sospetto: 1.5 }

      - testo: "Entrare in cancelleria dopo la chiusura"
        descrizione: "La finestra alta sopra il tavolo dei copisti non ha sbarre, perché a nessuno è mai venuto in mente di rubare un verbale."
        requisiti: [informazioni.pettegolezzo >= 3]
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Difficile }
        successo:
          titolo: La finestra alta
          testo: |
            La finestra alta si apre con una spinta, e scendi sul tavolo dei copisti senza rovesciare i
            gerani, con il cuore che fa più rumore dei tuoi stivali. L'armadio dei verbali ha una serratura
            d'ottone con la molla stanca, che cede alla punta di un coltello. Al buio, con una candela
            riparata nel palmo, scorri le sedute finché trovi la riga che ti serve, e la ricopi sul retro di
            un tuo foglietto. La cera ti cola calda fra le dita e non puoi scuoterla via. Esci dalla stessa
            finestra prima che passi la ronda.
          effetti: { informazioni.pettegolezzo: -3, informazioni.segreto: 1 }
        fallimento:
          titolo: I gerani
          testo: |
            La finestra si apre con una spinta, ma scendendo metti il piede nel vaso dei gerani, e il vaso va
            in pezzi sulle lastre con un rumore che rimbomba per tutto il corridoio. Dalla strada una lanterna
            si ferma davanti al portone. Risali sul davanzale con la terra umida nello stivale e ti cali nel
            vicolo mentre qualcuno prova la serratura, e intanto qualche foglietto ti scivola di tasca. La
            mattina dopo, in Città Bassa, si dice che la Caserma cerca uno bravo ad arrampicarsi.
          effetti: { informazioni.pettegolezzo: -1, sospetto: 2 }

  # ------------------------------------------------------------ A4 · la via di lato
  - id: un-nome-per-la-guarnigione
    presso: guarnigione-di-qir-azel
    immagine: ambientazione/guarnigione-di-qir-azel
    titolo: Un nome per la Guarnigione
    sommario: "La Caserma paga poco quello che sai, ma chi le porta un nome utile esce dai suoi registri un po' più leggero."
    luogo: Guarnigione di Qir-Azel, la stanza della ronda di notte
    area: quartieri-alti
    ripetibile: true
    testo: |
      Livio Mastrel riceve prima di uscire con la ronda di notte, in una stanza stretta sotto la scala dove la
      stufa fa più fumo che caldo. Il soffitto scende con la pendenza dei gradini, e quando qualcuno passa di
      sopra cade un velo di polvere sul tavolo. Sul tavolo Livio tiene il registro dei turni e un barattolo di
      radici di liquirizia, e ne offre una a chi entra.

      {origine figlio-della-citta-bassa} Nei vicoli dove sei cresciut{o|a} la Caserma la si guarda passare
      dall'altro lato della strada. Con una liquirizia in bocca ti senti ospite e traditore insieme.

      «Quello che si sente in giro alla Caserma interessa sempre» dice. «Paghiamo poco, perché il furiere i
      conti li rifà due volte. In compenso chi ci dà una mano ha un fascicolo più leggero.» Indica lo scaffale
      dei fascicoli alle sue spalle, e alcuni sono gonfi di fogli legati con lo spago.

      *Chissà quanto è gonfio il mio.*
    opzioni:
      - testo: "Consegnare un segreto al sergente di turno"
        descrizione: "Livio scrive quello che gli dici con la sua grafia tonda, e paga con gli spiccioli della cassa della ronda."
        requisiti: [informazioni.segreto >= 1]
        esito:
          titolo: La grafia tonda
          testo: |
            Racconti a Livio quello che sai con tutti i nomi e le strade, e lui lo scrive sul registro con una
            grafia tonda da scolaro, fermandosi a succhiare la liquirizia quando un nome è difficile. Alla
            fine soffia sull'inchiostro e ti conta qualche moneta dalla cassa della ronda, una cassetta di
            latta con il coperchio ammaccato. Poi prende il tuo fascicolo dallo scaffale e ci scrive qualcosa
            in fondo, a matita, senza fartelo leggere. Quando esci la guardia al portone guarda da un'altra
            parte, e per una volta ti sembra una gentilezza.
          effetti: { informazioni.segreto: -1, monete: 12, sospetto: -2 }

      - testo: "Pagare in segreti, e il tuo fascicolo torna nel cassetto"
        descrizione: "Senza paga. Livio ha un cassetto in fondo allo scaffale da cui i fascicoli non escono più."
        requisiti: [informazioni.segreto >= 2, sospetto >= 1]
        esito:
          titolo: Il cassetto in fondo
          testo: |
            Livio ascolta tutto senza scrivere, con la liquirizia ferma fra i denti. Quando hai finito resta
            zitto a lungo, e intanto la stufa sbuffa fumo dalle giunture del tubo. Poi sfila il tuo fascicolo
            dallo scaffale e lo apre sul tavolo per fartelo vedere. Lo richiude, ci gira intorno lo spago e lo
            infila nel cassetto in fondo, quello dei fascicoli che la Caserma ha deciso di dimenticare. Il
            cassetto è gonfio di umido e si chiude solo con un colpo di ginocchio. «Da lì non è mai uscito
            niente» dice, e ti allunga il barattolo della liquirizia.
          effetti: { informazioni.segreto: -2, sospetto: -5 }

      - testo: "Vendere un pettegolezzo di poco conto"
        descrizione: "Un pettegolezzo verificato, buono per la ronda di stanotte e per una riga a matita."
        requisiti: [informazioni.pettegolezzo >= 1]
        esito:
          titolo: Per la ronda di stanotte
          testo: |
            Gli dici dove si giocherà a dadi stanotte sui Ponti e chi terrà il banco. Livio lo annota in un
            angolo del registro dei turni, accanto al giro della ronda, e ti allunga qualche spicciolo dalla
            cassa. Le monete sono tiepide, perché la cassa sta sulla mensola sopra la stufa. «Se li troviamo,
            la prossima liquirizia la offri tu» dice, e ride da solo, perché le radici nel barattolo le compra
            lui e non le ha mai fatte pagare a nessuno.
          effetti: { informazioni.pettegolezzo: -1, monete: 3, sospetto: -0.5 }

  # ------------------------------------------------------------ A5 · l'ingresso del Mercato delle Ombre
  - id: chi-sa-dove-si-e-spostato
    immagine: ambientazione/citta-bassa
    titolo: Chi sa dove si è spostato
    sommario: "Il Mercato delle Ombre ha cambiato stanza un'altra volta, e per scendere serve qualcuno che sappia dove."
    luogo: Città Bassa, alla fontana
    area: citta-bassa
    tipo: fisso
    requisiti: [contatto-ombra == 0]
    testo: |
      In Città Bassa del Mercato delle Ombre parlano tutti, e nessuno ti sa dire dove sia. Ogni due o tre mesi
      la piazza sotterranea cambia stanza e gli ingressi vecchi si ritrovano murati. Quelli nuovi li conoscono
      in pochi, e chi li conosce li dice solo a chi gli conviene.

      Alla fontana una lavandaia strizza i panni sulla pietra scanalata del lavatoio, con le mani rosse di
      acqua fredda fino ai polsi. Ti racconta che suo cognato ci è sceso una volta ed è tornato con un anello
      che gli ha annerito il dito, e il nero non gli è più andato via. Da quale porta lei non se lo ricorda, e
      lui beveva troppo per ricordarselo.

      Ringrazi e intanto cerchi per strada chi abbia l'aria di saperlo e di fartelo pagare.
    opzioni:
      - testo: "Chiedere agli Scuri"
        descrizione: "Alla Pignatta Grassa sanno sempre dov'è il Mercato. Un favore degli Scuri si paga con un altro favore."
        immagine: fazioni/scuri
        quando: [pista.pelle < 6]
        requisiti: [rep.scuri >= 1]
        esito:
          titolo: Il colpo giusto
          testo: |
            Al bancone della Pignatta Grassa chiedi del Mercato a mezza voce, e il garzone ti fa aspettare
            finché arriva un uomo con il cappuccio abbassato e una cicatrice sul labbro. Si siede accanto a te
            senza ordinare, e il garzone gli mette davanti un boccale lo stesso. Ti descrive la porta di una
            cantina in fondo a un vicolo, con il colpo da battere e la parola da dire, e te li fa ripetere
            finché li sai. «Adesso hai un debito con gli Scuri, amico mio» dice, mentre si rialza il
            cappuccio. «Quando ti chiediamo un lavoretto, lo fai senza domande.»
          imposta: { contatto-ombra: 1 }
          effetti: { rep.scuri: -0.5 }

      - testo: "Pagare un ragazzo dell'Orlo dei Rottami"
        descrizione: "I ragazzi dell'Orlo frugano anche sottoterra, e una notizia buona la scambiano volentieri con una strada."
        immagine: ambientazione/orlo-dei-rottami
        requisiti: [informazioni.pettegolezzo >= 2]
        esito:
          titolo: L'ingranaggio al collo
          testo: |
            Il capo dei ragazzi dell'Orlo, quello con l'ingranaggio appeso al collo, ascolta i tuoi
            pettegolezzi seduto su una ruota spaccata, e alla fine fa sì con la testa, serio come un notaio.
            In cambio ti porta fino a un tombino dietro le baracche e scosta la grata con il piede. Dal buco
            sale un'aria più tiepida della strada che porta su l'odore del sego bruciato. «Al terzo
            pianerottolo bussi due volte» dice, rigirandosi l'ingranaggio fra le dita. «Se ti chiedono chi ti
            manda, io non ti ho mai visto.»
          imposta: { contatto-ombra: 1 }
          effetti: { informazioni.pettegolezzo: -2 }

      - testo: "Seguire i cristalli non registrati"
        descrizione: "I cristalli senza timbro mandano una luce più verde degli altri, e chi sa vederla può seguirne le casse fino a una porta."
        immagine: ambientazione/cristalli-conduttori
        prova: { attributo: mentale, abilita: [percezione, magia], difficolta: Media }
        successo:
          titolo: La luce verde
          testo: |
            Per due sere stai sedut{o|a} sul bordo della fontana a guardare le gerle che passano, finché la
            pietra non ti lascia il segno sulle cosce. La terza sera vedi un facchino con una gerla coperta, e
            dalla trama della tela filtra una luce più verde di quella delle lanterne della Gilda. Il facchino
            tiene le cinghie strette con tutte e due le mani e non le lascia nemmeno per asciugarsi la fronte.

            Lo segui a distanza per una serie di vicoli, finché scende i gradini di una cantina e bussa in un
            modo che ti stampi in testa.
          imposta: { contatto-ombra: 1 }
        fallimento:
          titolo: Il facchino si volta
          testo: |
            Segui per mezza notte un facchino con una gerla che manda una luce verdognola dalla tela, e lui ti
            porta in giro per la Città Bassa senza fretta. Va da un vicolo all'altro, e a un angolo si compra
            perfino una castagna e la sbuccia con le unghie mentre cammina. Alla fine si ferma sotto un
            lampione e ti chiede, voltandosi appena, se hai perso qualcosa. Il giorno dopo un miliziano vuole
            sapere perché ti piace tanto passeggiare di notte.
          effetti: { sospetto: 1 }

      - testo: "Lasciar perdere, per ora"
        descrizione: "Prima o poi qualcuno ti dirà dove scendere, e il Mercato intanto avrà già cambiato stanza."
        costo: 0
        esito:
          titolo: Per ora
          testo: |
            Lasci la lavandaia ai suoi panni, che ormai sgocciolano sul selciato, e torni sui tuoi passi. Il
            Mercato delle Ombre resta dov'è, sotto i tuoi piedi o sotto quelli di qualcun altro, e fra un paio
            di mesi sarà comunque da un'altra parte. Passando sopra una grata di scolo ti fermi ad ascoltare,
            e da sotto sale soltanto il rumore dell'acqua. Ti segni a mente le facce di questa strada che
            potrebbero saperne qualcosa, per quando avrai qualcosa da dare in cambio.

  # ------------------------------------------------------------ A6 · il Mercato delle Ombre
  - id: i-banchi-senza-timbro
    presso: mercato-delle-ombre
    immagine: ambientazione/mercato-delle-ombre
    titolo: I banchi senza timbro
    sommario: "Sotto la Città Bassa si paga meglio che in qualunque bottega della città, e qualcuno ti guarda sempre mentre incassi."
    luogo: Mercato delle Ombre, la piazza sotterranea
    area: citta-bassa
    ripetibile: true
    testo: |
      In fondo alla scala c'è una piazza scavata sotto la Città Bassa, con la volta annerita dal fumo delle
      torce. Il pavimento è di lastre squadrate più vecchie della scala, e le giunture sono così strette che
      non ci passa la lama di un coltello. Ti dici che sarà stato un magazzino e che chi l'ha costruito ci
      teneva. Sui banchi di assi ci sono reliquie senza il timbro della Gilda, e su uno si vende anche
      formaggio, perché anche i contrabbandieri hanno fame. Intorno a quel banco non gira nemmeno un topo.

      Ogni ingresso ha i suoi uomini sulla soglia. Quelli della Confraternita del Velo tengono il cappuccio
      alzato, e gli altri giocano a dadi su una cassa. Su una colonna qualcuno ha inciso il detto del posto,
      *il primo prezzo è sempre una domanda*, e sotto la pietra è lucida dove si appoggia chi aspetta.

      {origine accolito-del-velo} I cappucci del Velo li riconosci dal taglio, e ti chiedi se in Cattedrale
      qualcuno sappia che scendono fin qui. Tieni la faccia girata dall'altra parte.
    opzioni:
      - testo: "Vendere un segreto"
        descrizione: "Al banco del fondo comprano quello che sai, e lo pagano meglio di qualunque salotto dei Quartieri Alti."
        requisiti: [informazioni.segreto >= 1]
        esito:
          titolo: Il banco del fondo
          testo: |
            L'uomo del banco del fondo ascolta il tuo segreto con gli occhi chiusi e la testa inclinata da una
            parte, come un accordatore. Quando hai finito resta così ancora un poco, poi apre gli occhi e fa
            un prezzo che non discuti. Ti paga con monete di conî diversi, compresa una straniera consumata
            fino al rame, e le impila sull'asse in colonne ordinate. Sono fredde e un po' umide, perché la
            cassetta da cui le prende sta per terra contro la roccia. Mentre le raccogli, all'ingresso accanto
            un uomo con il cappuccio ti guarda le mani, e quando alzi la testa lui abbassa la sua.
          effetti: { informazioni.segreto: -1, monete: 38, sospetto: 1.5 }

      - testo: "Vendere un cristallo carico"
        descrizione: "Un cristallo pieno di Mana e senza timbro qui vale più che alla Casa dei Nodi, e nessuno chiede da quale pozzo venga."
        requisiti: [cristalli.cristallo-carico >= 1]
        esito:
          titolo: Il ronzio
          testo: |
            La donna del banco dei cristalli prende il tuo a mani nude e se lo avvicina all'orecchio per
            sentirne il ronzio, come si fa con le conchiglie. Annuisce e lo fa sparire sotto il banco, avvolto
            in uno straccio. Ti conta le monete senza sbagliare un colpo, con le dita annerite dal lavoro fino
            alla seconda falange. Accanto a lei un ragazzino ti fissa con molta attenzione, e quando gli
            chiedi se ti conosce dice di no, ma che adesso la tua faccia se la ricorda, e torna a sbucciare
            una mela.
          effetti: { cristalli.cristallo-carico: -1, monete: 38, sospetto: 1.5 }

      - testo: "Vendere un meccanismo dei Precursori"
        descrizione: "Un congegno intero, anche spento, qui trova sempre qualcuno che sa a cosa serviva, o finge di saperlo."
        requisiti: [reliquie.meccanismo-spento >= 1]
        esito:
          titolo: Le dita sugli ingranaggi
          testo: |
            Il compratore dei congegni è un vecchio Raschiatore con le dita storte, e passa i polpastrelli
            sugli ingranaggi del tuo meccanismo come un cieco sul viso di un parente. Lo gira e lo rigira
            senza aprirlo, poi ti paga senza contrattare e ti dice che di congegni interi ne arrivano sempre
            meno. Mentre lo avvolge in un panno noti che il metallo è ancora freddo anche se lui l'ha tenuto
            fra le mani tutto quel tempo.

            Quando te ne vai, i due uomini all'ingresso del Velo smettono di parlare fra loro per guardarti
            passare.
          effetti: { reliquie.meccanismo-spento: -1, monete: 38, sospetto: 1.5 }

      - testo: "Contrattare a lungo, con la merce sotto il mantello"
        descrizione: "Il primo prezzo è sempre una domanda, e due banchi che si contendono lo stesso segreto alzano l'offerta da soli."
        requisiti: [informazioni.segreto >= 1]
        prova: { attributo: sociale, abilita: [persuasione, conoscenze-della-strada], difficolta: Difficile }
        successo:
          titolo: Da un banco all'altro
          testo: |
            Fai sentire a un banco solo l'inizio del tuo segreto, e poi vai a chiedere che cosa ne pensa il
            banco di fronte. Fra i due banchi ci sono dodici passi, e dopo qualche giro li conti senza
            volerlo. I due compratori hanno smesso di guardare te e si guardano fra loro, con l'odio cordiale
            dei vicini di bottega, e il prezzo sale a ogni passo che fai verso l'altro banco. Chiudi quando
            l'uomo del banco del fondo si alza in piedi per stringerti la mano.
          effetti: { informazioni.segreto: -1, monete: 45, sospetto: 1 }
        fallimento:
          titolo: Il prezzo che scende
          testo: |
            Fai sentire a un banco l'inizio del tuo segreto e vai a chiedere che cosa ne pensa il banco di
            fronte. Quando torni il primo compratore sa già il resto, perché il banco di fronte gliel'ha
            rivenduto mentre tu facevi il giro, e il prezzo è sceso. Sull'asse del banco di fronte c'è una
            moneta in più, quella che il primo ha pagato per saperlo. Vendi lo stesso, a meno di quanto
            avresti preso subito, e il sorriso del compratore ti resta addosso fino alla scala.
          effetti: { informazioni.segreto: -1, monete: 25, sospetto: 1.5 }

      - testo: "Girare fra i banchi senza comprare"
        descrizione: "Ascoltare costa poco, finché tieni le mani lontane dalla merce."
        esito:
          titolo: Le orecchie aperte
          testo: |
            Fai il giro dei banchi con le mani dietro la schiena, fermandoti a guardare senza toccare niente.
            Il venditore di formaggio racconta a una cliente di una partita di cristalli fermata ai Ponti, e
            due Raschiatori discutono a voce troppo alta di un pozzo cieco che qualcuno ha richiuso. Le loro
            voci battono sulla volta e arrivano a tutti i banchi. Alla fine compri un pezzo di formaggio dalla
            crosta grigia, per avere un motivo di restare al banco ad ascoltare.
          effetti: { informazioni.voce: 2 }
