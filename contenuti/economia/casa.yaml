# La casa nel Vicolo dei Cardatori (economia, strato 2; quality, luogo e bottega in economia.yaml).
# C1 la soffitta in affitto (casa 0 → 1); C2 i cinque lavori, uno storylet fisso per livello (casa 1 → 6),
# ognuno con il suo prezzo nei requisiti e un "Non ancora"; C3 la sera a casa (riposo, opzioni con `quando`
# sugli arredi); C4 gli otto arredi (`arredo.*`); C5 il banco della bottega (casa >= 4); C6 il tavolo da
# lavoro e il banco della cantina, le conversioni migliori della città; C7 gli ospiti, il Lustro senza tetto;
# C8 i quattro ospiti di riguardo (Lustro 10, 30, 60, 100), chiusi ciascuno dal proprio flag `ospite.*`.
# Nomi nuovi, che il Codex non dà: Edda (la vedova che affitta la soffitta e poi vende la casa; dopo casa 3
# si tiene la stanza sul cortile), Arrigo (l'ultimo cardatore del vicolo, intercalare «Mah»), Tecla (la
# dirimpettaia che fa candele di sego alla finestra). Mastro Fenzi, il pittore, viene da municipio.yaml.
# Il Lustro sale solo da casa 3 in su (cene, tappeto, ritratto, cannocchiale): gli ospiti di riguardo
# trovano sempre la stanza degli ospiti, ma non per forza la bottega o l'altana.
# I prezzi stanno negli effetti e nei requisiti, mai nella prosa (docs/stile-dei-testi.md, regola 11).
storylet:
  # ------------------------------------------------------------ C1 · la soffitta
  - id: una-stanza-nel-vicolo
    immagine: icone/hanging-sign
    titolo: Una stanza nel vicolo
    sommario: "Alla finestra di una casa nel Vicolo dei Cardatori un cartello dice che la soffitta si affitta."
    luogo: Città Bassa, il Vicolo dei Cardatori
    area: citta-bassa
    tipo: fisso
    requisiti: [casa == 0]
    testo: |
      Il Vicolo dei Cardatori sale verso i Ponti. Alla terza casa un cartello
      dice *si affitta soffitta a persona seria, chiedere di Edda*, con
      *seria* ripassata più volte.

      Ti apre una vedova minuta, in un nero ingrigito. «Edda. La soffitta ha
      un tetto buono e la finestra chiude» dice. «L'affitto si paga prima, e
      sulle scale piano, che sotto dormo io.»

      {origine fuggiasco-di-ghoran} A Ghoran chi ti squadrava così calcolava
      quanto pesavi, mentre lei controlla le tue scarpe.

      {origine rampollo-dei-quartieri-alti} Ti scappa il mezzo inchino che si
      fa alle zie, e lei lo nota prima di te.
    opzioni:
      - testo: "Prendere la soffitta"
        descrizione: "Edda vuole l'affitto in anticipo, contato sul tavolo di cucina."
        requisiti: [monete >= 40]
        esito:
          titolo: La chiave grande
          testo: |
            Conti le monete sul tavolo di cucina, ed Edda le fa sparire nel
            grembiule e ti dà una chiave lunga quanto una mano. La soffitta ha il
            soffitto in pendenza e una finestrella sul vicolo, con il pagliericcio
            sotto la trave. La sera Edda batte il manico della scopa contro il
            soffitto, ed è il suo modo di dire buonanotte.
          effetti: { monete: -40 }
          imposta: { casa: 1 }

      - testo: "Tornare quando avrai il denaro"
        descrizione: "La soffitta resta lì, e il cartello alla finestra pure."
        costo: 0
        esito:
          titolo: Il cartello
          testo: |
            Dici a Edda che tornerai. Lei annuisce senza smettere di arrotolare il
            gomitolo e richiude la porta piano, e il cartello resta fra il vetro e
            la tendina.

  # ------------------------------------------------------------ C2 · i lavori, uno per livello
  - id: le-stanze-accanto
    presso: casa-nel-vicolo
    immagine: icone/wooden-door
    titolo: Le stanze accanto
    sommario: "Accanto alla soffitta ci sono due stanze chiuse da anni, ed Edda le affitta soltanto a un inquilino serio."
    luogo: La tua casa, l'ultimo piano
    area: citta-bassa
    tipo: fisso
    requisiti: [casa == 1]
    testo: |
      Accanto alla soffitta ci sono due stanze chiuse a chiave che odorano di
      canfora. Era il laboratorio del marito di Edda, e il tavolo da lavoro
      ha il piano bucherellato dai denti dei pettini da cardare.

      «Le affitto a un inquilino serio» dice lei. «Uno che sa chi abita in
      questa strada e chi ci vorrebbe abitare, perché di gente che bussa ne
      viene parecchia.»

      {conoscenze-della-strada Media} Tradotto, Edda vuole sapere chi le ha
      già bussato alla porta e perché.

      Dalla finestra di fronte la dirimpettaia, che fa candele di sego sul
      davanzale, ascolta senza fingere il contrario.
    opzioni:
      - testo: "Prendere le stanze"
        descrizione: "Edda vuole l'affitto e qualche notizia verificata su chi le ha chiesto le stanze prima di te."
        requisiti: [monete >= 100, informazioni.pettegolezzo >= 2]
        esito:
          titolo: Il tavolo dei pettini
          testo: |
            Le racconti di chi ha bussato prima di te, l'uomo con i debiti al
            Mercato dei Nodi e la coppia che subaffitta le brande ai Raschiatori,
            ed Edda ascolta con il gomitolo fermo. Poi prende le monete e ti dà la
            seconda chiave. Dalla finestra di fronte Tecla, la dirimpettaia, ti
            saluta alzando una candela ancora tiepida.
          effetti: { monete: -100, informazioni.pettegolezzo: -2 }
          imposta: { casa: 2 }

      - testo: "Non ancora"
        descrizione: "Le stanze restano chiuse, con la loro canfora."
        costo: 0
        esito:
          titolo: La porta chiusa
          testo: |
            Dici a Edda che ci devi pensare, e lei richiude le stanze con due giri
            di chiave ben rumorosi. Dall'altra parte del vicolo la dirimpettaia
            spegne una candela con le dita, delusa dal finale.

  - id: la-casa-e-tua
    presso: casa-nel-vicolo
    immagine: icone/house-keys
    titolo: La casa è tua
    sommario: "Edda vorrebbe venderti la casa, e il notaio ha già scritto l'atto. Il nipote però non vuole firmare."
    luogo: La tua casa, la cucina di Edda
    area: citta-bassa
    tipo: fisso
    requisiti: [casa == 2]
    testo: |
      Una sera Edda ti serve una zuppa d'orzo che non hai chiesto e ti offre
      la casa, tenendosi la stanza sul cortile finché campa. Il notaio ha già
      scritto l'atto, ma manca la firma del nipote, che ha un banco di
      pesatore sui Ponti e conta di ereditare.

      «È testardo come suo nonno» dice. «Al banco dei pesi ha qualche conto
      che non torna, e tu di queste cose ne sai. Io non voglio sapere quale.»

      {origine mercante-dei-ponti} Il nipote lo conosci di vista, quello che
      pulisce la bilancia con la manica quando passa un esattore della Gilda.
    opzioni:
      - testo: "Comprare la casa"
        descrizione: "Il notaio vuole il suo prezzo, e del nipote conosci un segreto che non vorrebbe sentire in giro."
        requisiti: [monete >= 250, informazioni.segreto >= 1]
        esito:
          titolo: La firma del nipote
          testo: |
            Al banco dei pesi dici piano al nipote di Edda che cosa sai della sua bilancia. Il giorno dopo firma l'atto
            davanti al notaio, calcando tanto da bucare il foglio. Edda scende nella stanza sul cortile con il ritratto
            del marito e la stanza buona del primo piano resta per gli ospiti. La sera stessa Tecla attraversa il vicolo
            con una candela per la casa nuova.
          effetti: { monete: -250, informazioni.segreto: -1 }
          imposta: { casa: 3 }

      - testo: "Non ancora"
        descrizione: "Il nipote può aspettare, e la zuppa anche."
        costo: 0
        esito:
          titolo: La zuppa d'orzo
          testo: |
            Dici a Edda che ci devi pensare. Lei ti riempie di nuovo il piatto e
            ti parla del marito e dei pettini da cardare finché la candela non si
            consuma, e del nipote non dice più niente.

  - id: la-bottega-al-pianterreno
    presso: casa-nel-vicolo
    immagine: icone/shop
    titolo: La bottega al pianterreno
    sommario: "Al pianterreno c'è la vecchia bottega del marito di Edda, chiusa. Per riaprirla servono luce e un bancone."
    luogo: La tua casa, il pianterreno
    area: citta-bassa
    tipo: fisso
    requisiti: [casa == 3]
    testo: |
      Al pianterreno c'è la bottega del marito di Edda, chiusa da quando è
      morto, con le imposte inchiodate e del vecchio bancone soltanto il segno
      sulle piastrelle.

      Arrigo, il cardatore in fondo al vicolo, si ferma sulla soglia. «Mah. Qui
      una volta c'era la fila» dice. «Adesso la lana la comprano già cardata,
      giù a Laresh. Con un po' di luce come si deve, però, la gente torna.»

      {empatia Facile} Edda, sentiti i tuoi piani, sembra quasi delusa. Una
      bottega di lana sotto casa le avrebbe riportato il rumore dei pettini, e
      un po' di suo marito.
    opzioni:
      - testo: "Riaprire la bottega"
        descrizione: "Un bancone di noce dai falegnami, e lampade a cristalli sterili che portano la luce fino alla strada."
        requisiti: [monete >= 450, cristalli.cristallo-sterile >= 4]
        esito:
          titolo: Le imposte aperte
          testo: |
            Per una settimana in casa ci sono falegnami che fischiano. Poi togli i chiodi alle
            imposte, e la luce delle lampade a cristallo arriva fino ai gradini del vicolo. Il
            primo cliente è Tecla, che compra una cosa qualsiasi per vedere com'è dentro.
            Sull'insegna hai fatto ridipingere i pettini, perché a Edda piacevano, e sotto hai
            aggiunto il tuo nome.
          effetti: { monete: -450, cristalli.cristallo-sterile: -4 }
          imposta: { casa: 4 }

      - testo: "Non ancora"
        descrizione: "Le imposte restano inchiodate, e Arrigo resta sulla soglia."
        costo: 0
        esito:
          titolo: La polvere di lana
          testo: |
            Richiudi la porta della bottega e rimetti il chiavistello. Arrigo alza
            le spalle, dice «Mah» e torna in fondo al vicolo ai suoi pettini, che
            a quest'ora cardano più polvere che lana.

  - id: la-cantina
    presso: casa-nel-vicolo
    immagine: icone/cellar-barrels
    titolo: La cantina
    sommario: "Sotto la bottega c'è una cantina con una parete che nessuno ha costruito."
    luogo: La tua casa, la cantina
    area: citta-bassa
    tipo: fisso
    requisiti: [casa == 4]
    testo: |
      Sotto le assi del bancone i falegnami hanno trovato una botola e una
      ripida scala di pietra. In fondo la parete è di pietra grigia senza
      giunti, con un incavo all'altezza del petto sopra un ripiano rigato da
      solchi regolari. Accanto all'incavo c'è l'alone annerito di un vecchio
      cristallo.

      Edda si ferma al terzo gradino. «Quella parete c'era già quando abbiamo
      comprato» dice.

      {origine allievo-di-torvessa} L'alone è di un cristallo conduttore
      rimasto acceso per anni.

      *La casa di Edda è appoggiata a un muro dei Precursori.* Con un
      meccanismo nell'incavo, il ripiano sarebbe il banco migliore della
      città.
    opzioni:
      - testo: "Rimettere in funzione il banco"
        descrizione: "Nell'incavo va un meccanismo dei Precursori con un cristallo carico, e servono muratori che non facciano domande."
        requisiti: [monete >= 700, reliquie.meccanismo-spento >= 1, cristalli.cristallo-carico >= 1]
        esito:
          titolo: La parete che ronza
          testo: |
            I muratori puntellano la volta e si fanno pagare anche il silenzio. Quando incastri il
            meccanismo nell'incavo con il cristallo carico accanto, la pietra comincia a ronzare
            piano e lungo i solchi corre una luce del colore dell'acqua. Edda dice che il ronzio le
            ricorda il marito quando russava, e da quella sera dorme meglio.
          effetti: { monete: -700, reliquie.meccanismo-spento: -1, cristalli.cristallo-carico: -1 }
          imposta: { casa: 5 }

      - testo: "Non ancora"
        descrizione: "La botola si richiude, e l'aria fredda resta di sotto."
        costo: 0
        esito:
          titolo: La botola
          testo: |
            Rimetti le assi sopra la botola e ci spingi contro il bancone. Per
            qualche notte ti sembra di sentire l'aria fredda salire dalle fessure
            del pavimento, anche se Edda dice che è soltanto il vicolo.

  - id: l-altana
    presso: casa-nel-vicolo
    immagine: ambientazione/cicatrice-del-mondo
    titolo: L'altana
    sommario: "Sul tetto ci starebbe un'altana sulla Cicatrice, ma in Municipio nessuno firma il permesso."
    luogo: La tua casa, il tetto
    area: citta-bassa
    tipo: fisso
    requisiti: [casa == 5]
    testo: |
      Dalla finestrella della soffitta, sporgendoti più del prudente, si vede
      il bordo della Cicatrice. Un falegname dei Ponti ti ha disegnato
      un'altana di legno sul tetto, con una scaletta dalla soffitta e un
      parapetto di corda.

      Il guaio è il permesso, perché l'ispettore dei tetti non firma niente
      che superi la linea delle grondaie, a meno che qualcuno non lo convinca.

      {politica-ed-economia Media} L'ispettore ha parecchi nemici, e una firma
      da lui si ottiene con carte che preferisce non veder circolare.

      Tecla, dalla finestra di fronte, dice che sull'altana verrà a stendere i
      panni.
    opzioni:
      - testo: "Costruire l'altana"
        descrizione: "Il falegname vuole il suo prezzo, e l'ispettore dei tetti qualche ragione che non si dice ad alta voce."
        requisiti: [monete >= 1000, informazioni.segreto >= 2]
        esito:
          titolo: Sopra le grondaie
          testo: |
            L'ispettore legge i biglietti che gli lasci, li brucia nella candela e
            firma senza alzare gli occhi. In un mese l'altana è su, con il
            parapetto di corda che scricchiola, e da lassù la Cicatrice taglia la
            città da una parte all'altra sotto i Ponti tesi. La prima sera ci sali
            con una tazza in mano e resti fino a tardi.
          effetti: { monete: -1000, informazioni.segreto: -2 }
          imposta: { casa: 6 }

      - testo: "Non ancora"
        descrizione: "Il disegno resta arrotolato sul tavolo, e il permesso in un cassetto del Municipio."
        costo: 0
        esito:
          titolo: Il disegno arrotolato
          testo: |
            Arrotoli il disegno e lo leghi con lo spago. Quella notte ti sporgi
            dalla finestrella più di quanto sia prudente e resti a guardare il
            bordo della Cicatrice fra due comignoli, finché una tegola, sotto la
            tua mano, si muove di un dito.

  # ------------------------------------------------------------ C3 · la sera a casa
  - id: una-sera-a-casa
    presso: casa-nel-vicolo
    immagine: icone/fireplace
    titolo: Una sera a casa
    sommario: "La sera torni nel Vicolo dei Cardatori e decidi come passare la notte."
    luogo: La tua casa
    area: citta-bassa
    ripetibile: true
    requisiti: [casa >= 1]
    testo: |
      A sera il vicolo si svuota dal basso verso l'alto, e la tua chiave entra
      nella serratura con il solito scatto storto. Dentro trovi le cose dove
      le avevi lasciate, che in Città Bassa è già un lusso. Edda batte il
      manico della scopa contro il soffitto e tu rispondi con un colpo di
      tacco sul pavimento, per dirvi che anche oggi siete tornati tutti e due.

      {empatia Media} Stasera Edda ha aspettato il tuo passo sulle scale prima
      di spegnere la candela.
    opzioni:
      - testo: "Dormire nella soffitta"
        descrizione: "Il pagliericcio sotto la trave, e la trave sopra la fronte."
        quando: [arredo.letto == 0]
        esito:
          titolo: Il pagliericcio
          testo: |
            Ti stendi sul pagliericcio sotto la trave, attento a non alzare la
            testa di colpo, e guardi consumarsi una candela che Tecla ha
            dimenticato sul davanzale. Dormi a pezzi, eppure la mattina le ossa ti
            fanno un po' meno male.
          effetti: { ferite: -0.5 }

      - testo: "Dormire nel letto vero"
        descrizione: "Un materasso riempito da Arrigo con la lana migliore, e lenzuola pulite."
        quando: [arredo.letto >= 1]
        esito:
          titolo: Il letto vero
          testo: |
            Il materasso di Arrigo è pieno della lana migliore, e la schiena si
            arrende prima della testa. Ti addormenti senza accorgertene, e la
            mattina i pensieri di ieri sono lontani come un altro quartiere.
          effetti: { ferite: -1, tormento: -0.5 }

      - testo: "Un bagno caldo nella vasca di rame"
        descrizione: "Il cristallo murato sotto il fondo scalda l'acqua da solo."
        quando: [arredo.vasca >= 1]
        esito:
          titolo: L'acqua nel rame
          testo: |
            Il cristallo murato sotto il fondo scalda l'acqua in poco tempo, e ti
            ci cali fino al mento. Le immagini della giornata galleggiano per un
            po' davanti agli occhi chiusi, poi vanno a fondo una dopo l'altra, e
            lasci l'acqua a raffreddarsi per il gusto di sprecarla.
          effetti: { tormento: -1, ferite: -0.5 }

      - testo: "Rileggere i tuoi appunti"
        descrizione: "Sulla libreria i quaderni si sono accumulati in pile storte, pieni dei tuoi conti con la città."
        quando: [arredo.libreria >= 1]
        esito:
          titolo: Le pile storte
          testo: |
            Rileggi i quaderni più vecchi alla luce della candela. Certi nomi
            importanti adesso non ti dicono niente, e altri, scritti in fretta a
            margine, sono diventati gente che saluti per strada. A mezzanotte, con
            i collegamenti nuovi segnati in rosso, hai un'idea più chiara di come
            gira il denaro in città.
          pe: { accademiche: 3, politica-ed-economia: 2 }

      - testo: "Allenarti in cortile"
        descrizione: "Nel cortile c'è la rastrelliera, con il palo piantato fra le pietre."
        quando: [arredo.rastrelliera >= 1]
        prova: { attributo: fisico, abilita: [armi-da-mischia, atletica], difficolta: Facile }
        successo:
          titolo: Il palo del cortile
          testo: |
            Lavori sul palo finché la camicia non ti si incolla alla schiena, con
            i piedi che trovano da soli il posto giusto sulle pietre sconnesse.
            Dalla finestra Edda conta i colpi, e quando smetti ti fa sapere che
            suo marito, alla tua età, cardava più in fretta, che da lei è un
            complimento.
        fallimento:
          titolo: Le pietre sconnesse
          testo: |
            Il piede destro trova una pietra sconnessa e ti ritrovi per terra con
            il gomito sbucciato. Riprovi, e i colpi arrivano storti finché Edda
            apre la finestra per dirti di fare rumore almeno a tempo.

      - testo: "Guardare la città dall'altana"
        descrizione: "Sali la scaletta della soffitta e ti appoggi al parapetto di corda, con tutta Qir-Azel sotto di te."
        quando: [casa >= 6]
        esito:
          titolo: I tetti
          testo: |
            Dal parapetto di corda guardi la città accendersi un pezzo alla volta,
            con le lanterne di Mana dei Ponti sempre accese e le finestre della
            Città Bassa che si spengono presto. Da quassù vedi anche chi si ferma
            a parlare sotto i portici, e un paio di facce te le segni a mente.
          pe: { percezione: 2, conoscenze-della-strada: 2 }
          effetti: { tormento: -1 }

      - testo: "Puntare il cannocchiale sulla Cicatrice"
        descrizione: "La lente fatta con i meccanismi dei Precursori arriva più giù di qualunque lente della Biblioteca."
        quando: [arredo.cannocchiale >= 1]
        esito:
          titolo: La parete di fronte
          testo: |
            La lente del cannocchiale si mette a fuoco da sola, con un ticchettio
            sottile, sulla parete opposta della Cicatrice. Molto in basso, fra le
            radici, c'è una cengia con i resti di una scala scavata nella pietra,
            che scende verso il buio e si interrompe di colpo. Quando scendi hai
            il quaderno pieno di schizzi.
          pe: { percezione: 3, natura: 2 }
          effetti: { tormento: -0.5 }

  # ------------------------------------------------------------ C4 · gli arredi
  - id: arredare-la-casa
    presso: casa-nel-vicolo
    immagine: icone/table
    titolo: Arredare la casa
    sommario: "Le stanze sono più grandi dei mobili che hai, e in Città Bassa i mobili si trovano."
    luogo: La tua casa
    area: citta-bassa
    ripetibile: true
    requisiti: [casa >= 1]
    testo: |
      La casa ha più spazio che mobili, e i passi rimbombano nelle stanze
      vuote. In Città Bassa il mercato vero si fa il giovedì sulla piazzetta
      in fondo alla discesa, dove i carretti dei traslochi vendono quello che
      nella casa nuova non entra, e per le cose buone bisogna salire dai
      falegnami dei Ponti. Tecla dice di avere un cugino per ogni cosa che ti
      serve.

      {conoscenze-della-strada Facile} Il cugino è sempre lo stesso, e il suo
      prezzo da amico è il più alto.

      {origine figlio-della-citta-bassa} Al mercato del giovedì da ragazzo
      frugavi sotto i carretti in cerca di chiodi.
    opzioni:
      - testo: "Comprare un letto vero"
        descrizione: "Un letto di legno con il materasso di lana. Arrigo dice che il materasso lo riempie lui."
        quando: [casa >= 1, arredo.letto == 0]
        requisiti: [monete >= 30]
        esito:
          titolo: Il materasso di Arrigo
          testo: |
            Il letto lo trovi al mercato dei traslochi già smontato, e lo porti su
            un pezzo alla volta. Arrigo ti riempie il materasso con la lana
            migliore e non vuole niente, perché la lana buona, dice, ormai la
            compra soltanto chi deve imbottire una bara.
          effetti: { monete: -30 }
          imposta: { arredo.letto: 1 }

      - testo: "Far montare una stufa a cristalli"
        descrizione: "Una stufa di ghisa con i cristalli sterili nella griglia, che tengono la brace calda tutta la notte."
        quando: [casa >= 2, arredo.stufa == 0]
        requisiti: [monete >= 40, cristalli.cristallo-sterile >= 2]
        esito:
          titolo: Il calore della notte
          testo: |
            Il fumista monta la stufa nella stanza dove dormi, e la sera i
            cristalli nella griglia tengono calda la brace fino al mattino. Edda
            sale a vedere, ci tiene sopra le mani a lungo e torna giù senza
            commentare. La sera dopo risale con una scusa che non regge.
          effetti: { monete: -40, cristalli.cristallo-sterile: -2 }
          imposta: { arredo.stufa: 1 }

      - testo: "Comprare una libreria"
        descrizione: "Il rigattiere che vende gli scaffali li cede per poco a chi gli porta notizie verificate sul suo isolato."
        quando: [casa >= 2, arredo.libreria == 0]
        requisiti: [monete >= 80, informazioni.pettegolezzo >= 3]
        esito:
          titolo: Gli scaffali di noce
          testo: |
            Il rigattiere ti cede la libreria per poco, in cambio di quello che
            sai sulle case vuote del suo isolato. Con gli scaffali arriva una
            cassa di almanacchi vecchi, e la stanza comincia a somigliare allo
            studio di un notaio, a parte l'odore di muffa e il notaio.
          effetti: { monete: -80, informazioni.pettegolezzo: -3 }
          imposta: { arredo.libreria: 1 }

      - testo: "Far montare una rastrelliera in cortile"
        descrizione: "Una rastrelliera di quercia e un palo piantato fra le pietre, per allenarti senza uscire di casa."
        quando: [casa >= 3, arredo.rastrelliera == 0]
        requisiti: [monete >= 100]
        esito:
          titolo: Il palo fra le pietre
          testo: |
            Due garzoni piantano il palo fra le pietre del cortile, e la
            rastrelliera di quercia ha perfino il posto per una lancia che non
            hai. Edda ti fa notare che il palo è storto di poco, e d'ora in poi te
            ne accorgerai a ogni colpo.
          effetti: { monete: -100 }
          imposta: { arredo.rastrelliera: 1 }

      - testo: "Comprare un tappeto di Pannion"
        descrizione: "Lana tinta con le cortecce del Bosco di Velthar e annodata a mano a Pannion. Chi entra lo nota."
        quando: [casa >= 3, arredo.tappeto == 0]
        requisiti: [monete >= 180]
        esito:
          titolo: I nodi di Pannion
          testo: |
            Il tappeto arriva arrotolato sulla groppa di un mulo, e nella stanza
            degli ospiti il rosso delle cortecce si prende tutta la luce della
            finestra. Arrigo ne conta i nodi con il pollice e per una volta non
            comincia con «Mah».

            {origine figlio-del-circolo} Il rosso delle cortecce lo riconosci
            dall'odore, e per un momento la stanza sa di Bosco di Velthar.
          effetti: { monete: -180, lustro: 1 }
          imposta: { arredo.tappeto: 1 }

      - testo: "Farti ritrarre da Mastro Fenzi"
        descrizione: "Il pittore dei Quartieri Alti scende fin qui per il suo prezzo e per una storia vera da raccontare."
        quando: [casa >= 4, arredo.ritratto == 0]
        requisiti: [monete >= 300, informazioni.segreto >= 1]
        esito:
          titolo: Le sedute
          testo: |
            Mastro Fenzi si lamenta delle scale a ogni seduta, e mentre dipinge
            ascolta il segreto che gli hai promesso, con la pennellata che
            rallenta a ogni frase. Il ritratto ti somiglia più di quanto vorresti,
            con un'ombra di stanchezza sotto gli occhi che lui si rifiuta di
            togliere.
          effetti: { monete: -300, informazioni.segreto: -1, lustro: 2 }
          imposta: { arredo.ritratto: 1 }

      - testo: "Comprare una vasca di rame"
        descrizione: "Una vasca di rame battuto, con un cristallo carico murato sotto il fondo che scalda l'acqua."
        quando: [casa >= 5, arredo.vasca == 0]
        requisiti: [monete >= 350, cristalli.cristallo-carico >= 1]
        esito:
          titolo: Il rame battuto
          testo: |
            Ci vogliono quattro uomini e parecchie bestemmie per far girare la
            vasca sul pianerottolo, e il calderaio mura il cristallo carico sotto
            il fondo con una malta che puzza di uova marce. La prima volta che
            l'acqua si scalda da sola Tecla ci infila un dito piano, come se
            toccasse un animale che dorme.
          effetti: { monete: -350, cristalli.cristallo-carico: -1 }
          imposta: { arredo.vasca: 1 }

      - testo: "Montare un cannocchiale sull'altana"
        descrizione: "Con i meccanismi dei Precursori rimontati a dovere si ottiene la lente più potente della città."
        quando: [casa >= 6, arredo.cannocchiale == 0]
        requisiti: [monete >= 400, reliquie.meccanismo-spento >= 2]
        esito:
          titolo: La lente che si mette a fuoco
          testo: |
            Lo costruisce un ottico dei Ponti che non ha mai finito l'Accademia,
            smontando i meccanismi sul tavolo della tua cucina per tre notti. La
            lente si mette a fuoco da sola con un ticchettio sottile, e il giorno
            dopo mezzo vicolo chiede di guardarci dentro. Arrigo, al suo turno, lo
            punta sulla finestra di Tecla.
          effetti: { monete: -400, reliquie.meccanismo-spento: -2, lustro: 3 }
          imposta: { arredo.cannocchiale: 1 }

      - testo: "Guardarti intorno"
        descrizione: "Fare il giro delle stanze e vedere che cosa manca."
        costo: 0
        esito:
          titolo: Il giro delle stanze
          testo: |
            Fai il giro della casa con le mani in tasca, e manca più di quanto
            pensassi. Edda ti incrocia sul pianerottolo e ti racconta che anche a
            lei e al marito ci sono voluti anni, e che il primo mobile era stato
            un letto.

  # ------------------------------------------------------------ C5 · la bottega
  - id: il-banco-della-bottega
    presso: casa-nel-vicolo
    immagine: icone/receive-money
    titolo: Il banco della bottega
    sommario: "Al pianterreno c'è la tua bottega, e qualcuno deve pur stare dietro al bancone."
    luogo: La tua casa, la bottega
    area: citta-bassa
    ripetibile: true
    requisiti: [casa >= 4]
    testo: |
      Le lampade a cristallo della bottega spargono una luce bianca fino ai
      gradini, dove la sera i ragazzi della strada giocano a dadi. Sul bancone
      di noce ci sono la bilancia e un piattino di caramelle d'orzo per tenere
      buoni i clienti, che vengono per curiosità più che per bisogno. Arrigo
      passa ogni pomeriggio a chiederti se hai della lana, per sentirti
      rispondere di no.

      {conoscenze-della-strada Media} Dove la sera i ragazzi giocano a dadi,
      di notte i ladri non si avvicinano.
    opzioni:
      - testo: "Stare al banco un pomeriggio"
        descrizione: "Un pomeriggio dietro il bancone a pesare e incartare per i clienti del vicolo."
        esito:
          titolo: Il pomeriggio al banco
          testo: |
            Il pomeriggio passa fra la bilancia e il registro, e il piattino delle
            caramelle si svuota più in fretta della cassa. Vendi le candele di
            Tecla e, a un orafo dei Ponti che ha sbagliato strada, una lente
            rimasta nel cassetto da mesi.
          effetti: { monete: 20 }

      - testo: "Convincere un cliente difficile"
        descrizione: "Una signora dei Quartieri Alti è scesa fin qui per lamentarsi, e se si calma potrebbe comprare parecchio."
        prova: { attributo: sociale, abilita: [persuasione, galateo], difficolta: Media }
        successo:
          titolo: La signora del cappello
          testo: |
            La signora dal cappello piumato è convinta di essere stata truffata,
            perché la lente comprata ieri ingrandisce troppo. Le fai notare che
            così si leggono i registri dei dazi dall'altra parte del tavolo, e lei
            esce con una seconda lente per il marito.
          effetti: { monete: 30 }
        fallimento:
          titolo: Il cappello piumato
          testo: |
            La signora dal cappello piumato si lamenta della lente comprata ieri,
            e più le spieghi che ingrandire è un pregio, più si convince di avere
            ragione. Alla fine le rendi una parte del prezzo, e lei prende anche
            una caramella dal piattino, per principio.
          effetti: { monete: 10 }

  # ------------------------------------------------------------ C6 · il tavolo da lavoro
  - id: il-tavolo-da-lavoro
    presso: casa-nel-vicolo
    immagine: icone/toolbox
    titolo: Il tavolo da lavoro
    sommario: "Il vecchio tavolo dei pettini e, più tardi, il banco della cantina. A casa tua si lavora meglio."
    luogo: La tua casa, il laboratorio
    area: citta-bassa
    ripetibile: true
    requisiti: [casa >= 2]
    testo: |
      Sul tavolo dei pettini del vecchio laboratorio stendi quello che porti a
      casa dalla città, mettendo in fila le voci nei forellini come una volta
      la lana. Sotto il piano c'è un cassetto con la serratura, che Edda giura
      di non aver mai aperto, dove tieni le carte da non lasciare in giro.

      {ingannare Media} Edda lo giura un po' troppo in fretta, come si giura
      su una cosa fatta una volta sola.

      Quando la cantina è aperta scendi anche al banco di pietra, che ronza
      piano sotto le fondamenta.
    opzioni:
      - testo: "Riordinare le voci sul tavolo"
        descrizione: "Stendere le voci raccolte in città e vedere quali stanno in piedi da sole."
        quando: [casa >= 2]
        requisiti: [informazioni.voce >= 5]
        esito:
          titolo: Le voci in fila
          testo: |
            Scrivi ogni voce su un foglietto e li infili nei forellini del tavolo.
            Alcune parlano dello stesso carico sparito ai Ponti, raccontato da
            persone che non si conoscono, e vicine si confermano a vicenda, mentre
            le altre finiscono nel fuoco.
          effetti: { informazioni.voce: -5, informazioni.pettegolezzo: 2 }

      - testo: "Tirare le fila dei pettegolezzi"
        descrizione: "Incrociare i pettegolezzi verificati finché uno non diventa una cosa che si vende cara."
        quando: [casa >= 3]
        requisiti: [informazioni.pettegolezzo >= 4]
        esito:
          titolo: Il filo rosso
          testo: |
            Incroci i pettegolezzi della settimana con le date e i nomi, e storie
            lontane cominciano a puntare allo stesso magazzino sotto i Ponti e
            allo stesso uomo che ci entra di notte. Quando richiudi il cassetto,
            dentro c'è un segreto vero con tanto di nome e di data.
          effetti: { informazioni.pettegolezzo: -4, informazioni.segreto: 1 }

      - testo: "Ricaricare un cristallo al banco della cantina"
        descrizione: "Sui solchi del ripiano i cristalli sterili tornano a prendere luce, uno alla volta."
        quando: [casa >= 5]
        requisiti: [cristalli.cristallo-sterile >= 3]
        esito:
          titolo: La luce del colore dell'acqua
          testo: |
            Appoggi i cristalli sterili sui solchi del ripiano, e per un'ora la
            luce del banco li attraversa e si raccoglie in uno solo, mentre gli
            altri si opacizzano e si sbriciolano. Quello che resta è caldo e pulsa
            appena, e lo tieni con il braccio teso, come un neonato che non è tuo.
          effetti: { cristalli.cristallo-sterile: -3, cristalli.cristallo-carico: 1 }

      - testo: "Rimontare un meccanismo al banco della cantina"
        descrizione: "Sul ripiano di pietra i frammenti incisi trovano il loro posto, se sai dove guardare."
        quando: [casa >= 5]
        requisiti: [reliquie.frammento-inciso >= 3]
        esito:
          titolo: I solchi del ripiano
          testo: |
            Stendi i frammenti incisi sul ripiano e provi gli incastri, e ogni
            pezzo che trova il suo posto ravviva per un momento la luce
            nell'incavo. Alla fine sul ripiano c'è un congegno intero e senza
            vita, ed Edda dall'alto della scala ti domanda se hai finito di far
            ronzare la casa.
          effetti: { reliquie.frammento-inciso: -3, reliquie.meccanismo-spento: 1 }

  # ------------------------------------------------------------ C7 · gli ospiti
  - id: ricevere-ospiti
    presso: casa-nel-vicolo
    immagine: icone/wine-glass
    titolo: Ricevere ospiti
    sommario: "La stanza buona del primo piano è fatta per gli ospiti, e a Qir-Azel chi riceve si fa un nome."
    luogo: La tua casa, la stanza degli ospiti
    area: citta-bassa
    ripetibile: true
    requisiti: [casa >= 3]
    testo: |
      La stanza buona del primo piano ha la finestra più grande della casa e un tavolo che si allunga con due assi. A
      Qir-Azel ci si conosce a tavola, e Tecla ti ha già spiegato chi si offende se lo metti vicino alla porta. Edda
      ti presta le tovaglie del suo matrimonio, con le iniziali ricamate in un angolo, e ti fa promettere che nessuno
      ci verserà sopra il vino.

      {empatia Media} Quelle tovaglie non escono dal baule da anni, ed Edda te le ha prestate senza cerimonie.
    opzioni:
      - testo: "Una cena semplice"
        descrizione: "La zuppa d'orzo di Edda e il vino dell'oste in fondo alla discesa, per i vicini di casa."
        requisiti: [monete >= 30]
        esito:
          titolo: La zuppa di Edda
          testo: |
            Edda cucina la zuppa d'orzo e non permette a nessuno di toccare il
            sale. Vengono Arrigo con la camicia della domenica e Tecla con il
            marito, e si parla del prezzo della legna fino a tardi. Il giorno dopo
            il marito di Tecla ti saluta per strada, cosa che non aveva mai fatto.
          effetti: { monete: -30, lustro: 1, informazioni.voce: 2 }

      - testo: "Una cena con il vino di Pannion"
        descrizione: "Il vino rosso di Pannion e una lampada a cristallo sulla tavola, per ospiti che scendono dai Ponti."
        quando: [casa >= 4]
        requisiti: [monete >= 80, cristalli.cristallo-sterile >= 1]
        esito:
          titolo: Il vino di Pannion
          testo: |
            Il vino di Pannion sa di resina, e la lampada a cristallo lo fa sembrare
            più caro. Vengono un mercante della Gilda con la moglie e una cantante
            del Teatro delle Meraviglie che fuma alla finestra. Quando il mercante
            scopre che la casa è tua ti stringe la mano più a lungo, e sulla porta la
            cantante ti racconta, ridendo, una cosa vera su Orazio Belcanto.
          effetti: { monete: -80, cristalli.cristallo-sterile: -1, lustro: 3, informazioni.pettegolezzo: 1 }

      - testo: "Una serata per i notabili"
        descrizione: "Gente dei Quartieri Alti sull'altana, sotto una lanterna a cristallo carico, con la Cicatrice per sfondo."
        quando: [casa >= 6]
        requisiti: [monete >= 200, cristalli.cristallo-carico >= 1]
        esito:
          titolo: La serata sull'altana
          testo: |
            Per una sera il Vicolo dei Cardatori si riempie di portantine, e
            sull'altana la lanterna a cristallo si vede dai Ponti. Salgono un
            notabile della Gilda e la vedova di un armatore, che da trent'anni non
            si salutano, e a mezzanotte il notabile ti racconta a bassa voce il
            perché. Il giorno dopo il tuo nome gira nelle case dei Quartieri Alti,
            e Tecla vende tutte le candele.
          effetti: { monete: -200, cristalli.cristallo-carico: -1, lustro: 8, informazioni.segreto: 1 }

  # ------------------------------------------------------------ C8 · gli ospiti di riguardo
  - id: ospite-primo
    presso: casa-nel-vicolo
    immagine: personaggi/tobol-aspern
    titolo: La fontana secca
    sommario: "Il preside dell'Accademia di Torvessa e un cartografo gnomo bussano alla tua porta, già nel mezzo di una lite."
    luogo: La tua casa, la stanza degli ospiti
    area: citta-bassa
    tipo: fisso
    requisiti: [lustro >= 10, ospite.primo == 0]
    testo: |
      Sulla soglia ci sono due vecchi che litigano. Il più alto tiene un corvo
      sul braccio, l'altro è uno gnomo con gli occhiali tondi.

      «Io sono Orvald Temmerin, lui è Tobol Aspern e ha torto» dice l'alto,
      puntando il dito.

      Secondo Tobol, Orvald scambia la vostra fontana secca per un pozzo dei
      Precursori, mentre sulla mappa del centodieci risulta pagata dai
      cardatori. Sono venuti a vedere, e già che c'erano a cena.

      Il corvo Pett si serve del tuo pane mentre loro aspettano che decida tu.

      {origine allievo-di-torvessa} Il preside non ti riconosce, e ti siedi
      dritto come in aula.
    opzioni:
      - testo: "Scendere con loro alla fontana"
        descrizione: "Con una lanterna e una corda, a guardare che cosa c'è davvero in fondo alla fontana secca."
        esito:
          titolo: Il fondo della fontana
          testo: |
            Ti cali nella fontana con la lanterna, mentre Orvald tiene la corda e
            Tobol sbaglia la tua destra con la sua. Sotto il fango trovi un
            pettine da cardare arrugginito e un canale di pietra grigia senza
            giunti che sparisce nella roccia verso le fondamenta. Litigano fino a
            mezzanotte su chi debba correggere la mappa, e il pettine se lo porta
            via Tobol.
          pe: { percezione: 6 }
          imposta: { ospite.primo: 1 }

      - testo: "Versare ancora vino e lasciarli litigare"
        descrizione: "Due vecchi che hanno girato le rovine per trent'anni, alla tua tavola. Basta ascoltare."
        esito:
          titolo: Trent'anni di rovine
          testo: |
            Per tutta la sera i due si contraddicono su ogni scavo fatto insieme,
            e a forza di correggersi raccontano più di quanto direbbero in
            un'aula. Verso mezzanotte Orvald ti lascia sotto il bicchiere un
            foglietto per una Raschiatrice che scava con lui da vent'anni. «Le
            scrivo che sai ascoltare, e fra le rovine è una dote rara» dice.
          effetti: { rep.raschiatori: 0.5 }
          imposta: { ospite.primo: 1 }

  - id: ospite-secondo
    presso: casa-nel-vicolo
    immagine: personaggi/ambrin-qell
    titolo: Il mercante del Nodo
    sommario: "Ambrin Qell lascia per una sera il Nodo d'Ossidiana e scende nel Vicolo dei Cardatori con un pacchetto."
    luogo: La tua casa, la stanza degli ospiti
    area: citta-bassa
    tipo: fisso
    requisiti: [lustro >= 30, ospite.secondo == 0]
    testo: |
      Ambrin Qell arriva al tramonto con il corvo sulla spalla e un pacchetto
      avvolto nella lana, e Tecla, di fronte, si lascia sfuggire una candela.

      «Eccoti» dice con il suo sorriso largo. «Al Mercato dei Nodi si parla
      delle tue cene, e volevo vedere la casa prima che diventasse cara.»

      {origine mercante-dei-ponti} Sai che il sorriso gli si allarga ad affare
      fatto, e stasera è largo come non l'hai mai visto.

      Prima del dolce scosta il pacchetto verso di te. «Un regalo per la casa.
      E se ti interessa, una presentazione alla Gilda, a compratori che
      vorrebbero conoscerti.»
    opzioni:
      - testo: "Farti spiegare il regalo"
        descrizione: "Nel panno di lana c'è qualcosa di piccolo e tiepido, che Ambrin ha fatto con le sue mani."
        esito:
          titolo: Il nodo di seta
          testo: |
            Nel panno c'è un cordone di seta nera stretto in un nodo intorno a una
            scheggia d'ossidiana, tiepida come una mano. Il nodo l'ha stretto
            Ambrin, e dentro ci ha chiuso un filo di Mana da tirare quando le
            forze ti mancano. Te lo allaccia al collo e dalla porta ti raccomanda
            di non venderlo al primo che te lo chiede, e dal tono capisci che il
            primo sarebbe lui.
          pe: { magia: 4 }
          effetti: { oggetto.ciondolo-del-nodo: 1 }
          imposta: { ospite.secondo: 1 }

      - testo: "Chiedere anche la presentazione"
        descrizione: "Il regalo lo prendi comunque. Un nome detto da Ambrin alla Gilda vale molto, a lungo andare."
        esito:
          titolo: Una parola alla Gilda
          testo: |
            Ambrin ride piano, come se avessi superato un esame, e ti allaccia al
            collo il suo regalo, un cordone di seta nera annodato intorno a una
            scheggia d'ossidiana. Una settimana dopo un mercante della Gilda bussa
            alla tua porta e ti dice che lo manda il Nodo, e da allora alla Casa
            dei Nodi qualcuno ti saluta per primo.
          effetti: { oggetto.ciondolo-del-nodo: 1, rep.gilda: 1 }
          imposta: { ospite.secondo: 1 }

  - id: ospite-terzo
    presso: casa-nel-vicolo
    immagine: personaggi/nerissa-dalvane
    titolo: Una visita dalla Maison
    sommario: "Nerissa Dalvane, padrona della Maison des Lunes, chiede di prendere il tè a casa tua."
    luogo: La tua casa, la stanza degli ospiti
    area: citta-bassa
    tipo: fisso
    requisiti: [lustro >= 60, ospite.terzo == 0]
    testo: |
      Un biglietto senza firma chiede se la padrona della Maison des Lunes può
      prendere il tè da te, a porta accostata.

      Nerissa Dalvane arriva puntuale in abito scuro, mentre Churl Bra'aak
      resta fuori appoggiato al muro accanto alla fontana secca e Arrigo
      smette di cardare.

      Beve il tè di Edda con la schiena dritta e ti dice piano che il tuo nome
      comincia a girare nelle case dove gira il suo, mentre la mano sfiora una
      volta il medaglione sotto la stoffa.

      {percezione Difficile} Lo tocca come una ferita che tira, per
      controllare che sia ancora al suo posto.
    opzioni:
      - testo: "Raccontarle del vicolo"
        descrizione: "Le cose del Vicolo dei Cardatori che sai solo tu. Lei paga le notizie con altre notizie."
        esito:
          titolo: Uno scambio
          testo: |
            Le racconti del nipote di Edda e della sua bilancia, e di chi entra di notte nel magazzino sotto i
            Ponti. Nerissa ricambia con il nome di un cliente della Gilda che sta per perdere tutto e di chi
            glielo sta prendendo. Accanto alla tua tazza posa uno spillone d'argento brunito, temperato come uno
            stiletto. «Dove si parla di queste cose serve qualcosa a portata di mano» dice.
          effetti: { informazioni.segreto: 1, oggetto.spillone-di-nerissa: 1 }
          imposta: { ospite.terzo: 1 }

      - testo: "Chiederle come si tiene una casa"
        descrizione: "Nerissa ne tiene una dove decidono gli altri, e nessuno ha mai trovato la porta sbarrata."
        esito:
          titolo: Le regole della casa
          testo: |
            Nerissa ti spiega dove si mette chi arriva per ultimo e come si fa
            capire a un ospite che è ora di andare, e che chi tiene la porta
            accostata deve avere qualcosa a portata di mano. Quando se ne va
            lascia accanto alla tazza lo spillone d'argento che si è sfilata dai
            capelli, temperato come uno stiletto, e capisci che è un modo di dire
            che tornerà.
          pe: { galateo: 7 }
          effetti: { oggetto.spillone-di-nerissa: 1 }
          imposta: { ospite.terzo: 1 }

  - id: ospite-quarto
    presso: casa-nel-vicolo
    immagine: personaggi/marella-castaldi
    titolo: La padrona di casa dei Castaldi
    sommario: "Marella Castaldi decide chi siede alla tavola del Maniero, e prima di decidere va a vedere di persona."
    luogo: La tua casa, la stanza degli ospiti
    area: citta-bassa
    tipo: fisso
    requisiti: [lustro >= 100, ospite.quarto == 0]
    testo: |
      Dalla carrozza con il sigillo delle bilance scende Quintus Vael, la
      spada al fianco, a guardare le finestre.

      Poi scende Marella Castaldi, vestita con sobrietà. «Mia cognata riceve
      in Municipio e mai a casa» dice. «Io le case le guardo, prima di
      invitare chi ci abita.»

      Nella stanza buona tocca la tovaglia, e quando Edda dalla cucina dice di
      averla ricamata per le nozze le fa un piccolo inchino, poi aspetta che
      sia tu a parlare.

      {origine rampollo-dei-quartieri-alti} Nella tua famiglia un invito al
      Maniero si aspetta per anni, e adesso una Castaldi siede sotto il tuo
      soffitto.
    opzioni:
      - testo: "Parlarle di come si riceve nel vicolo"
        descrizione: "Della zuppa di Edda e dei vicini che spazzano i gradini prima di una cena. Lei se ne intende."
        esito:
          titolo: I posti a tavola
          testo: |
            Le racconti come si riceve nel vicolo, con la zuppa di Edda e Tecla
            che sa già chi si offenderà. Marella ascolta con attenzione vera e due
            volte ti corregge l'ordine dei posti, spostando i bicchieri sul
            tavolo. Prima di andarsene ammette che alla sua tavola la gente del
            vicolo manca, e che ci penserà.
          pe: { galateo: 8 }
          imposta: { ospite.quarto: 1 }

      - testo: "Parlarle di Stato, come si fa alla sua tavola"
        descrizione: "Al Maniero si parla di Stato e mai dei Castaldi. Si può cominciare anche qui."
        esito:
          titolo: Di Stato e mai di noi
          testo: |
            Le parli dei dazi sui Ponti e delle case vuote della Città Bassa, che
            qualcuno compra a una a una con denaro di fuori. Quando provi a
            chiederle della Rappresentante ti ferma con un gesto. «Si parla di
            Stato a tavola, e mai di noi» dice. Poi, per ricambiare, ti dice quale
            consigliere non sarà più invitato al Maniero, e perché.
          effetti: { informazioni.segreto: 1 }
          imposta: { ospite.quarto: 1 }
