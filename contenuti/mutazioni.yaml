# Regolamento 5.5 e docs/regolamento-crisi.md. A 8 di Contaminazione chi accetta muta:
# un tratto permanente con un vantaggio e uno svantaggio. I modificatori valgono sempre.
mutazioni:
  - id: occhi-luminescenti
    nome: Occhi luminescenti
    immagine: ambientazione/marea-grigia
    descrizione: "Al buio le iridi mandano una luce grigia e fredda, come quella della Marea."
    vantaggio: "+1 Percezione"
    svantaggio: "−1 Furtività"
    abilita: { percezione: 1, furtivita: -1 }

  - id: vene-di-luce
    nome: Vene di luce
    immagine: ambientazione/marea-grigia
    descrizione: "Sotto la pelle dei polsi e del collo le vene brillano quando sei agitato."
    vantaggio: "+2 Energia"
    svantaggio: "−1 Galateo"
    energia: 2
    abilita: { galateo: -1 }

  - id: pelle-increspata
    nome: Pelle increspata
    immagine: ambientazione/marea-grigia
    descrizione: "Sulle spalle e sulle braccia la pelle si è fatta spessa e rugosa, come corteccia bagnata."
    vantaggio: "+1 riduzione"
    svantaggio: "−1 Acrobazia"
    riduzione: 1
    abilita: { acrobazia: -1 }

  - id: gola-roca
    nome: Gola roca
    immagine: ambientazione/marea-grigia
    descrizione: "La voce è diventata bassa e graffiata, e chi la sente la prima volta si volta a guardarti."
    vantaggio: "+1 Intimidire"
    svantaggio: "−1 Persuasione"
    abilita: { intimidire: 1, persuasione: -1 }

  - id: sangue-grigio
    nome: Sangue grigio
    immagine: ambientazione/marea-grigia
    descrizione: "Quando ti tagli, il sangue esce più scuro e si rapprende subito. La Marea lo riconosce come suo."
    vantaggio: "Contaminazione per esposizione dimezzata"
    svantaggio: "−1 PF"
    schermata: true
    pf: -1

  - id: mente-silenziosa
    nome: Mente silenziosa
    immagine: ambientazione/marea-grigia
    descrizione: "Una parte dei pensieri si è spenta. Hai meno paura, e fai più fatica a capire quella degli altri."
    vantaggio: "+1 Resilienza"
    svantaggio: "−1 Empatia"
    abilita: { resilienza: 1, empatia: -1 }

  - id: unghie-di-metallo
    nome: Unghie di metallo
    immagine: ambientazione/marea-grigia
    descrizione: "Le unghie sono diventate dure e grigie, con un riflesso di lega precuriana."
    vantaggio: "+1 danno a mani nude"
    svantaggio: "−1 Galateo"
    dannoManiNude: 1
    abilita: { galateo: -1 }

  - id: orecchio-per-il-mana
    nome: Orecchio per il Mana
    immagine: ambientazione/marea-grigia
    descrizione: "Senti i cristalli ronzare anche attraverso i muri, e non smetti mai di sentirli."
    vantaggio: "+1 Magia fuori dal combattimento"
    svantaggio: "la Dissonanza dà 1 Tormento invece di ½"
    magiaFuori: 1
    dissonanza: 0.5
