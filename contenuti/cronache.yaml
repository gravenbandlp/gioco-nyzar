      - raccolta.mercante
      - raccolta.bambino
      - raccolta.cavaliere
      - raccolta.frattura
      - raccolta.carovana
      - raccolta.cartografo
      - raccolta.corriere
      - raccolta.cane
      - raccolta.voce

  - id: luoghi
    nome: I luoghi della città
    serie:
      - raccolta.casa
      - raccolta.fosco
      - raccolta.lusardi
      - raccolta.ilde
      - raccolta.bottega
      - raccolta.governante
      - raccolta.pontiere
      - raccolta.lettere
      - luogo.rep.grifone
      - luogo.rep.nodo
      - luogo.rep.ponti
      - luogo.rep.botteghe
      - luogo.nomea.citta-bassa
      - luogo.rep.cimitero
      - luogo.rep.biblioteca
