# Le Cronache: la scheda che raccoglie le storie lunghe cominciate e non ancora chiuse (src/ui/viste.ts, cronache).
# - `sezioni`: i quattro gruppi della scheda e, in ordine, le serie che contengono. Gli id sono quelli di
#   src/motore/serie.ts: `pista.x` e `fazione.x` per le piste, `luogo.<reputazione>` per le storie dei luoghi,
#   `raccolta.x` per le raccolte qui sotto. Ogni serie sta in una sezione sola (test/cronache.test.ts).
# - `raccolte`: le storie lunghe che non hanno una pista e che il motore non sa ricavare da solo. Appartengono a una
#   raccolta gli storylet che chiedono o cambiano una quality con uno dei prefissi di `chiavi`; ogni requisito di
#   `passi` soddisfatto è un passo fatto, e la storia è chiusa quando vale `conclusa` o quando sono fatti tutti.
raccolte:
  - id: luoghi-neri
    nome: I luoghi neri e la Campana Sepolta
    immagine: icone/ringing-bell
    descrizione: "Nove luoghi dei Precursori sparsi per la Superficie, ognuno con la sua misura. Messe insieme, le nove misure portano alla Campana sotto la Ripamuta."
    chiavi: [traccia., misura., campana.]
    passi:
      - misura.costola >= 1
      - misura.tamburi >= 1
      - misura.aculeo >= 1
      - misura.anello >= 1
      - misura.forno >= 1
      - misura.stele >= 1
      - misura.sornione >= 1
      - misura.mara >= 1
      - misura.spina >= 1
      - campana.annuncio >= 1
      - campana.strato >= 1
      - campana.strato >= 2
      - campana.strato >= 3
      - campana.scelta >= 1
      - campana.epilogo >= 1

  # il campanile rovescio (contenuti/torre/, docs/piano-torre.md): la botola, i quattro anelli, il sigillo del 41
  - id: torre
    nome: Il campanile rovescio
    immagine: icone/stairs
    descrizione: "Sotto la Campana Sepolta un campanile scende nella roccia per quaranta piani, e ogni dieci un sigillo legge la Maschera del Portatore."
    chiavi: [torre.]
    passi: [torre.botola >= 1, torre.anello >= 1, torre.anello >= 2, torre.anello >= 3, torre.anello >= 4, torre.sigillo >= 1]
    conclusa: torre.sigillo >= 1

  - id: mercante
    nome: Il Mercante della Memoria Residua
    immagine: icone/wooden-crate
    genere: luogo
    descrizione: "Un uomo seduto su una cassa in mezzo a un pianoro senza strade, con davanti delle cose che dice tue."
    chiavi: [mercante.]
    passi: [mercante.incontri >= 1, mercante.incontri >= 2, mercante.incontri >= 3, mercante.incontri >= 4, mercante.scatola >= 1]

  - id: bambino
    nome: Il bambino senza impronte
    immagine: icone/barefoot
    genere: luogo
    descrizione: "Un bambino seduto sul bordo del sentiero, che dice di essersi perso e non lascia impronte."
    chiavi: [bambino.]
    passi: [bambino.stadio >= 1, bambino.stadio >= 2, bambino.stadio >= 3, bambino.fine >= 1]
    conclusa: bambino.fine >= 1

  - id: cavaliere
    nome: Il Cavaliere della Marea
    immagine: icone/black-knight-helm
    genere: luogo
    descrizione: "Un'armatura completa con le crepe piene di luce, che si ferma sul sentiero e non ricorda il suo nome."
    chiavi: [cavaliere.]
    passi: [cavaliere.incontri >= 1, cavaliere.memoria >= 1, cavaliere.memoria >= 2, cavaliere.memoria >= 3, cavaliere.fine >= 1]
    conclusa: cavaliere.fine >= 1

  - id: frattura
    nome: La Frattura che respira
    immagine: ambientazione/rovine-dei-precursori
    genere: luogo
    descrizione: "Un anello dei Precursori spezzato in due, su un gradone delle terrazze di basalto, che respira."
    chiavi: [frattura.]
    passi: [frattura.respiro >= 1, frattura.respiro >= 2, frattura.respiro >= 3, frattura.respiro >= 4, frattura.premio >= 1]
    conclusa: frattura.spenta >= 1

  - id: casa
    nome: La casa nel vicolo
    immagine: icone/family-house
    genere: luogo
    descrizione: "La casa nel Vicolo dei Cardatori, dalla soffitta in affitto all'altana sui tetti, e gli ospiti di riguardo."
    chiavi: [casa, ospite.]
    passi: [casa >= 1, casa >= 2, casa >= 3, casa >= 4, casa >= 5, casa >= 6, ospite.primo >= 1, ospite.secondo >= 1, ospite.terzo >= 1, ospite.quarto >= 1]

  # Le mini-Cronache del mazzo delle occasioni (17 ottobre 2026): catene di carte che chiudono con un premio in lyssan
  # (test/occasioni-cronache.test.ts).
  - id: fosco
    nome: Fosco e la casa che manca
    immagine: icone/house
    genere: luogo
    descrizione: "Un vecchio della Città Bassa che conta i numeri civici e non trova la casa quattordici."
    chiavi: [fosco]
    passi: [fosco >= 1, fosco >= 2, fosco >= 3]
    conclusa: fosco >= 3

  - id: lusardi
    nome: L'argento dei Lusardi
    immagine: icone/candlestick-phone
    genere: luogo
    descrizione: "Un nobile decaduto dei Quartieri Alti che vuole indietro il suo candelabro d'argento."
    chiavi: [lusardi.]
    passi: [lusardi.passo >= 1, lusardi.passo >= 2, lusardi.passo >= 3]

  - id: ilde
    nome: Ilde e la Mula
    immagine: icone/cargo-crate
    genere: luogo
    descrizione: "Una chiattaiola dei Ponti Sospesi, la sua chiatta a fune e il privilegio che tutti le vogliono comprare."
    chiavi: [chiatta.]
    passi: [chiatta.ilde >= 1, chiatta.ilde >= 2, chiatta.ilde >= 3, chiatta.ilde >= 4]
    conclusa: chiatta.fine >= 1

  - id: bottega
    nome: La bottega che ticchetta
    immagine: icone/pocket-watch
    genere: luogo
    descrizione: "L'orologiaio della discesa è morto da una settimana, e la sua bottega chiusa ticchetta ancora."
    chiavi: [bottega.]
    passi: [bottega.passo >= 1, bottega.passo >= 2, bottega.passo >= 3, bottega.passo >= 4]
    conclusa: bottega.fine >= 1

  - id: governante
    nome: Il registro della governante
    immagine: icone/notebook
    genere: luogo
    descrizione: "Una governante licenziata da una grande casa dei Quartieri Alti, con il registro delle visite notturne."
    chiavi: [governante.]
    passi: [governante.passo >= 1, governante.passo >= 2, governante.passo >= 3, governante.passo >= 4]
    conclusa: governante.fine >= 1

  - id: pontiere
    nome: L'ultimo pontiere
    immagine: icone/rope-bridge
    genere: luogo
    descrizione: "L'ultimo pontiere che conosce i nodi originali delle funi sta morendo, e nessuno li ha mai scritti."
    chiavi: [pontiere.]
    passi: [pontiere.passo >= 1, pontiere.passo >= 2, pontiere.passo >= 3, pontiere.passo >= 4]
    conclusa: pontiere.fine >= 1

  - id: lettere
    nome: Le lettere senza mittente
    immagine: icone/envelope
    genere: luogo
    descrizione: "Lettere senza firma, scritte da qualcuno che sa da dove vieni."
    chiavi: [lettere.]
    passi: [lettere.passo >= 1, lettere.passo >= 2, lettere.passo >= 3, lettere.passo >= 4]
    conclusa: lettere.fine >= 1

  - id: carovana
    nome: La carovana dei muti
    immagine: icone/caravan
    genere: luogo
    descrizione: "Una carovana di gente che non parla attraversa la Superficie verso un posto che nessuna mappa segna."
    chiavi: [carovana.]
    passi: [carovana.passo >= 1, carovana.passo >= 2, carovana.passo >= 3, carovana.passo >= 4, carovana.passo >= 5]
    conclusa: carovana.fine >= 1

  - id: cartografo
    nome: Il cartografo cieco
    immagine: icone/treasure-map
    genere: luogo
    descrizione: "Un cartografo che ha perso la vista vuole finire la sua mappa della Superficie e ti chiede di essere i suoi occhi."
    chiavi: [cartografo.]
    passi: [cartografo.passo >= 1, cartografo.passo >= 2, cartografo.passo >= 3, cartografo.passo >= 4]
    conclusa: cartografo.fine >= 1

  - id: corriere
    nome: Il corriere della Caserma
    immagine: icone/scroll-unfurled
    genere: luogo
    descrizione: "Un corriere della Caserma che ha perso la strada per Laresh sulla Superficie."
    chiavi: [sup3.messaggero]
    passi: [sup3.messaggero >= 1, sup3.messaggero >= 2]
    conclusa: sup3.messaggero >= 2

  - id: cane
    nome: Il cane che aspetta
    immagine: icone/sitting-dog
    genere: luogo
    descrizione: "Un cane che aspetta accanto al suo padrone, sulla Superficie, da più tempo di quanto dovrebbe."
    chiavi: [sup3.cane]
    passi: [sup3.cane >= 1, sup3.cane >= 4]
    conclusa: sup3.cane >= 4

  - id: voce
    nome: La voce nel metallo
    immagine: icone/sound-waves
    genere: luogo
    descrizione: "Un pezzo di metallo raccolto sulla Superficie che ogni tanto parla con una voce che non è la tua."
    chiavi: [sup3.voce]
    passi: [sup3.voce >= 1, sup3.voce >= 2, sup3.voce >= 3, sup3.voce >= 99]
    conclusa: sup3.voce >= 99

sezioni:
  - id: qir-azel
    nome: Le storie di Qir-Azel
    serie:
      - pista.dama-argento
      - pista.sepolcro
      - pista.corin
      - pista.teatro
      - pista.registro
      - pista.tribu
      - pista.acciaio
      - pista.capomozzo
      - pista.arena
      - pista.pelle

  - id: fazioni
    nome: Le fazioni della città
    serie:
      - fazione.velo
      - fazione.gilda
      - fazione.caserma
      - fazione.consiglio
      - fazione.accademia
      - fazione.maison
      - fazione.raschiatori
      - fazione.scuri
      - fazione.circolo

  - id: superficie
    nome: La Superficie
    serie:
      - fazione.ghoran
      - fazione.laresh
      - fazione.tuarmir
      - fazione.pannion
      - raccolta.luoghi-neri
