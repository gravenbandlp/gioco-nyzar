  - id: avventure
    nome: Le Avventure
    serie:
      - avventura.zanna-rotta
      - avventura.puliti
      - avventura.stazione-gelo
      - avventura.prove-guado
      - avventura.ponte-pesce
      - avventura.rosicaossa
      - avventura.signora-gole
      - avventura.divoratore
      - avventura.libro-regina
      - avventura.buche-laresh
      - avventura.sogno-serpente
      - avventura.investitura
      - avventura.torchio
      - avventura.radura-spenta
