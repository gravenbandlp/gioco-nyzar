# Le voci del glossario per i nomi nuovi della notte della Zanna Rotta, nel formato di contenuti/glossario/
# personaggi.yaml: presentazioni stabili, senza i segreti dell'Avventura (che Rinaldo sia la bestia resta fuori).
# Dolovan Stroud, Kharb, Ilka e Besk Dravec, Serha Duvain, Fulvio Saldo e Gunter Kasselt c'erano già.
glossario:
  - id: rinaldo-gessi
    nome: Rinaldo Gessi
    alias: [Rinaldo]
    tipo: personaggio
    sottotitolo: "Mercante di lana"
    testo: "Mercante di lana che compra i velli dai pastori di Laresh e li rivende ai tessitori di Qir-Azel. È rotondo e ben rasato. Parla piano, e davanti a ogni cosa sgradevole mette un «con rispetto parlando». Quando è in città dorme in una delle camere sul cortile della Locanda di Ilka."
    requisiti: []

  - id: folco-ardizzi
    nome: Folco Ardizzi
    alias: [Folco]
    tipo: personaggio
    sottotitolo: "Mulattiere olvaro"
    testo: "Mulattiere olvaro che porta merci fra Qir-Azel e i villaggi con una fila di mule e un mastino che non abbaia. È grosso e rosso in faccia, e giura sulla testa delle sue mule. Noleggia le bestie più a buon mercato della Zanna Rotta, e Dolovan Stroud non gliel'ha mai perdonato."
    requisiti: []

  - id: ornella-marangon
    nome: Ornella Marangon
    alias: [Ornella]
    tipo: personaggio
    sottotitolo: "Sellaia ambulante"
    testo: "Sellaia che gira i villaggi con un carretto di selle e di finimenti cuciti da lei. È magra e precisa, ha i pollici pieni dei calli della lesina e dice quello che pensa del cuoio degli altri. In città dorme alla Locanda di Ilka e cerca botteghe che le comprino il lavoro."
    requisiti: []

  - id: mezzaluna
    nome: Mezzaluna
    tipo: creatura
    sottotitolo: "L'orso della Foresta Strisciante"
    testo: "Un orso vecchio e grande che i boscaioli della Foresta Strisciante conoscono da vent'anni, chiamato così per la macchia bianca a mezzaluna che ha sul petto. Vive sotto la scarpata del Gradone Rosso e nessun cacciatore l'ha mai preso, nemmeno Dolovan Stroud, che gli è andato dietro tre inverni."
    requisiti: []

  - id: radura-dei-vetri
    nome: radura dei vetri
    tipo: luogo
    sottotitolo: "Una radura della Foresta Strisciante"
    testo: "Una radura della Foresta Strisciante, a mezza strada fra la strada di Laresh e la scarpata del Gradone Rosso, dove una vena di cristallo affiora fra le radici e copre la terra di schegge grigie. I boscaioli ci passano lontano, perché le schegge tagliano gli zoccoli dei muli."
    requisiti: []
