# La notte della Zanna Rotta, la spedizione (avventura.zanna-rotta == 6 → 7): la pista grigia nella Foresta Strisciante,
# la strada di Rinaldo Gessi fatta all'indietro fino alla tana sotto la scarpata del Gradone Rosso. Si entra dal
# cancello delle Scuderie della Zanna Rotta (`avv-zanna-rotta-la-strada-di-laresh`): una prova Media, la strada di
# Rinaldo (avv-zanna-rotta.itinerario) a un rintocco, a cavallo senza rintocchi, o con un carrettiere per due. La
# ritirata riporta in Città Bassa e azzera la profondità.
# Le stanze vanno in fasce di profondità (una stanza superata non ricompare nella stessa visita):
# - 0-3, la strada di Rinaldo all'indietro, prove Medie e Difficili: il bivacco sotto la sequoia, il mulo dei vermi,
#   le croci sui tronchi (con la strada di Rinaldo una via Media), il torrente rosso. Servono tutte e quattro, quindi
#   valgono tutte da 0 a 3.
# - 4-6, verso la radura, prove Difficili e Contaminazione: le felci di ferro (4-5), la vena che affiora (4-6, con il
#   cristallo di Rinaldo una via Media), il cervo che non scappa (4-6, o lo scontro), la nebbia bassa (5-6). A 5 la
#   svolta, non ripetibile: la radura dei vetri, dove gli animali toccati dalla sacca vanno verso la scarpata
#   (avv-zanna-rotta.svolta).
# - 7-9, la tana dei contaminati, prove Difficili e in ogni stanza una Molto difficile o uno scontro: i lupi della
#   scarpata (7-8, con lo spiedo di Dolovan una via Difficile), il tasso nella galleria (7-9), il nido di pelo (8-9),
#   la cengia sopra la tana (8-9).
# Ogni stanza ha una via senza prova da 2 rintocchi (3 nelle stanze 7-9) con mezza negativa; chi fallisce prende
# mezza negativa e non scende.
# - 10, il cuore: Mezzaluna, l'orso grigio che dorme sulla sacca (boss). Lo scontro, la cresta da spezzare sulla
#   spalla (Difficile) o lo spiedo piantato (Difficile, avv-zanna-rotta.spiedo). Chi vince torna in Città Bassa con
#   la pelle (avventura.zanna-rotta 7); chi perde torna con una negativa intera.
aree:
  - id: avv-zanna-rotta
    immagine: ambientazione/foresta-strisciante
    nome: La pista grigia
    sommario: "La strada di Rinaldo Gessi nella Foresta Strisciante, fatta all'indietro, dal margine fino alla scarpata del Gradone Rosso."
    spedizione: { ritorno: citta-bassa, soglia: 10, stanze: 3 }
    testo: |
      La Foresta Strisciante comincia oltre il Ponte del Conciatore, una striscia di sequoie e di abeti fra la
      riva sud del Torvessa e la scarpata rossa del Gradone. La strada di Laresh le corre accanto per un
      tratto, e da lì entri nel bosco sulla strada di Rinaldo, all'indietro.

      Sotto le sequoie la luce arriva verde e scarsa, e il suolo è un letto di aghi così spesso che i passi
      non fanno rumore. I tronchi sono larghi quanto una stanza, con una corteccia rossa e fibrosa che si
      stacca a strisce sotto le dita. Ci sono rimasti impigliati peli grigi all'altezza di un uomo, e quando
      il vento cala dal suolo sale l'odore dell'aria dopo un fulmine.

colonna:
  - { contesto: area, id: avv-zanna-rotta, musica: uncharted-dreams, ambiente: forest-creepy }

storylet:
  # ------------------------------------------------------------ l'ingresso, dal cancello delle Scuderie
  - id: avv-zanna-rotta-la-strada-di-laresh
    presso: scuderie-della-zanna-rotta
    immagine: ambientazione/foresta-strisciante
    titolo: La strada di Laresh
    sommario: "Dalla Zanna Rotta alla Foresta Strisciante ci sono il Ponte del Conciatore e due chilometri di strada. Rinaldo resta nel box, e Dolovan ti accompagna fino al cancello."
    luogo: Scuderie della Zanna Rotta, il cancello
    area: citta-bassa
    requisiti: [avventura.zanna-rotta == 6]
    testo: |
      Rinaldo resta nel box, dietro un secondo chiavistello. Dietro le assi non si sente niente, e i cavalli
      dei box accanto stanno tutti contro la parete opposta. Dolovan ti accompagna al cancello e lì si ferma a
      guardare la strada che scende verso il Ponte del Conciatore.

      «Nella Foresta, sotto la scarpata, ci stava un orso che i boscaioli chiamavano Mezzaluna» dice. «Gli
      sono andato dietro tre inverni senza mai vederlo da vicino.» Sputa il filo di paglia. «Se la nebbia si è
      presa un uomo in una notte, l'orso che ci dorme accanto se l'è preso da un pezzo. Guarda in alto, ogni
      tanto.»

      Oltre il ponte la strada di Laresh corre a ovest fra i solchi dei carri, e dopo due chilometri le si
      accosta la Foresta Strisciante con la scarpata rossa del Gradone alle spalle. Da lontano gli alberi del
      margine sono più alti di qualunque cosa ci sia in Città Bassa.

      {origine figlio-del-circolo} Al Circolo un orso vecchio si lascia stare, perché conosce il bosco meglio
      di chi lo abita.
    opzioni:
      - testo: "Cercare il punto dove Rinaldo è entrato nel bosco"
        descrizione: "Un mulo che scarta e un uomo che gli corre dietro lasciano un segno sul ciglio della strada, anche dopo dieci giorni."
        prova: { attributo: mentale, abilita: [natura, percezione], difficolta: Media }
        successo:
          titolo: Il ciglio della strada
          testo: |
            Dove la Foresta si accosta alla strada trovi gli zoccoli di un mulo che scarta di lato e infila il
            bosco al galoppo, e accanto le impronte di un uomo pesante che gli corre dietro. Le segui fra gli
            alberi, dove dopo dieci giorni l'erba piegata non si è ancora rialzata.
          pe: { natura: 2 }
          vai: avv-zanna-rotta
        fallimento:
          titolo: I rovi
          testo: |
            Batti il margine per mezza giornata prima di trovare il punto giusto, e il punto giusto sta dietro
            un muro di rovi. Lo attraversi lo stesso, e dall'altra parte ti togli le spine dalle mani. Sulle
            spine più alte sono rimasti impigliati peli grigi all'altezza di un uomo.
          effetti: { ferite: 0.5 }
          vai: avv-zanna-rotta
      - testo: "Andare dritto dove ha detto Rinaldo"
        descrizione: "Nel box Rinaldo ti ha raccontato la strada, a cominciare dal pino spaccato dove il mulo ha scartato."
        requisiti: [avv-zanna-rotta.itinerario >= 1]
        costo: 1
        esito:
          titolo: Il pino spaccato
          testo: |
            Il pino spaccato dal fulmine sta sul ciglio della strada, proprio dove Rinaldo ha detto, con il
            legno dello spacco annerito fino a terra. Lo trovi senza cercarlo, e da lì entri nel bosco sulle
            sue orme.
          vai: avv-zanna-rotta
      - testo: "Andare a cavallo fino al margine"
        descrizione: "Due chilometri di strada battuta. Al margine lasci la bestia legata a un pino e prosegui a piedi."
        requisiti: [chiave.cavalcatura >= 1]
        costo: 0
        esito:
          titolo: Al trotto
          testo: |
            Fai la strada di Laresh al trotto, e al margine della Foresta il tuo cavallo si ferma da solo e
            non vuole andare oltre. Lo leghi a un pino lontano dagli alberi grigi e prosegui a piedi. Mentre
            ti allontani lo senti tirare la corda verso la strada.
          vai: avv-zanna-rotta
      - testo: "Farti portare da un carrettiere di Laresh"
        descrizione: "I carri che tornano a Laresh passano accanto alla Foresta. Il carrettiere ti porta, e parla."
        costo: 2
        esito:
          titolo: Il carrettiere
          testo: |
            Il carrettiere ti lascia al margine della Foresta dopo averti chiesto per tutta la strada della
            bestia della Zanna Rotta. Gira il carro prima che tu sia sceso del tutto. Gliene hai detto poco, e
            stasera a Laresh lo racconteranno lo stesso come l'hai detto tu.
          effetti: { scandalo: 0.5 }
          vai: avv-zanna-rotta

  # ------------------------------------------------------------ 0-3 · la strada di Rinaldo all'indietro
  - id: avv-zanna-rotta-il-bivacco-sotto-la-sequoia
    immagine: icone/campfire
    titolo: Il bivacco sotto la sequoia
    sommario: "Sotto una sequoia del margine c'è il bivacco dove Rinaldo ha passato la notte. La coperta è ancora lì, strappata da dentro."
    luogo: La pista grigia, il bivacco
    area: avv-zanna-rotta
    ripetibile: true
    requisiti: [avventura.zanna-rotta == 6, profondita.avv-zanna-rotta <= 3]
    testo: |
      Sotto una sequoia c'è un cerchio di sassi anneriti, e la cenere in mezzo è fredda e impastata dalla
      pioggia. Accanto c'è una coperta da carro di lana grezza. È strappata in strisce lunghe dall'interno
      verso l'esterno, con peli grigi impigliati nei fili, e i fili rotti puntano tutti in fuori. Dal bivacco
      i piedi scalzi vanno verso la strada, e le zampe si infilano nel fitto verso sud. Sulla sequoia non
      canta nessun uccello.

      {natura Media fallita} Studi le zampe a lungo e con grande serietà, finché concludi che sono proprio
      zampe di bestia.
    opzioni:
      - testo: "Seguire le zampe nel fitto"
        descrizione: "Sugli aghi le zampe si vedono poco. Sulla terra molle si vedono benissimo, se sai come cammina chi le ha lasciate."
        prova: { attributo: mentale, abilita: [natura, percezione], difficolta: Media }
        successo:
          titolo: Le zampe
          testo: |
            Segui le zampe fra gli abeti, chinat{o|a}, finché il terreno diventa troppo duro per tenerle. A
            quel punto hai capito come cammina, perché appoggia il peso sul lato esterno e trascina un poco le
            unghie. La ritrovi a ogni chiazza di terra molle.
          pe: { natura: 2 }
          effetti: { profondita.avv-zanna-rotta: 1 }
        fallimento:
          titolo: In tondo
          testo: |
            Le zampe girano tre volte intorno al bivacco prima di partire, e tu le segui tutte e tre finché i
            tuoi stivali hanno coperto quelle del primo giro. Quando te ne accorgi è passata un'ora e la
            sequoia è ancora lì.
          effetti: { tormento: 0.5 }
      - testo: "Salire sulla sequoia a guardare"
        descrizione: "Da lassù la Foresta si vede come un tetto. Dove la Marea è passata, il tetto ha un altro colore."
        prova: { attributo: fisico, abilita: atletica, difficolta: Difficile }
        successo:
          titolo: Il tetto della Foresta
          testo: |
            Ti arrampichi sui rami bassi fino a dove il tronco si stringe. Da lassù la Foresta è un tetto
            verde, e verso sud, a mezza strada dalla scarpata, c'è una chiazza dove gli alberi sono grigi. Le
            cime verdi si piegano al vento, e quelle grigie restano ferme. Scendi con la direzione in testa.
          pe: { atletica: 3 }
          effetti: { profondita.avv-zanna-rotta: 1 }
        fallimento:
          titolo: Il ramo secco
          testo: |
            A metà salita un ramo secco ti si spezza sotto il piede, e gli ultimi rami li fai cadendo, uno
            dopo l'altro, fino agli aghi. Resti a terra sulla schiena con la corteccia nelle mani e il ramo
            spezzato accanto.
          effetti: { ferite: 0.5 }
      - testo: "Battere il sottobosco finché la pista ricompare"
        descrizione: "Si gira intorno al bivacco in cerchi sempre più larghi fra i rovi e le ortiche. Prima o poi le zampe tornano fuori."
        costo: 2
        esito:
          titolo: I rovi
          testo: |
            Giri intorno al bivacco in cerchi sempre più larghi finché le zampe ricompaiono su una chiazza di
            fango, verso sud. Nel fango l'impronta è più profonda davanti che dietro, da bestia che corre. Hai
            le mani piene di spine e le caviglie piene di ortiche.
          effetti: { profondita.avv-zanna-rotta: 1, ferite: 0.5 }

  - id: avv-zanna-rotta-il-mulo-dei-vermi
    immagine: bestiario/verme-carogna
    titolo: Il mulo dei vermi
    sommario: "In una conca fra le radici c'è quello che resta del mulo di Rinaldo. Sotto la carcassa la terra si muove."
    luogo: La pista grigia, la conca del mulo
    area: avv-zanna-rotta
    ripetibile: true
    requisiti: [avventura.zanna-rotta == 6, profondita.avv-zanna-rotta <= 3]
    testo: |
      In una conca fra le radici delle sequoie c'è il mulo di Rinaldo, ancora con il basto e con le cinghie
      tese. Ha il collo spezzato e il ventre aperto come la giumenta di Dolovan. Dopo dieci giorni sulla
      carcassa non c'è una mosca, e l'odore è poco più di quello della terra smossa. Sotto la carcassa la
      terra si solleva a ondate lente, e ogni tanto spunta la corona di tentacoli bianchi di un verme carogna.
      Il sentiero passa sul bordo della conca.

      {medicina Media} Il collo l'ha spezzato una zampa sola con un colpo di traverso, e le vertebre sono
      scivolate di lato tutte insieme. Quella notte Rinaldo una forza così non l'aveva ancora.
    opzioni:
      - testo: "Passare sul bordo senza far tremare la terra"
        descrizione: "I vermi carogna sentono i passi attraverso il terreno. Un piede alla volta, sulle punte."
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Media }
        successo:
          titolo: Sulle punte
          testo: |
            Passi sul bordo della conca un piede alla volta, con il peso sulle punte, e la terra sotto il mulo
            resta ferma. Dall'altra parte il sentiero continua verso sud. Quando ti volti, sulla carcassa una
            corona bianca si è aperta verso il punto dove sei passat{o|a}.
          pe: { furtivita: 2 }
          effetti: { profondita.avv-zanna-rotta: 1 }
        fallimento:
          titolo: Il tentacolo
          testo: |
            A metà bordo la terra si gonfia sotto lo stivale e un tentacolo ti sfiora la caviglia. La gamba ti
            diventa di legno fino al ginocchio, e torni indietro trascinandola. Il punto toccato non lo senti
            nemmeno quando ci premi il pollice.
          effetti: { ferite: 0.5 }
      - testo: "Guardare da vicino il collo del mulo"
        descrizione: "Chi ha spezzato quel collo ha lasciato il segno della zampa. Per vederlo bisogna scendere nella conca."
        prova: { attributo: mentale, abilita: [medicina, natura], difficolta: Difficile }
        successo:
          titolo: La zampa larga
          testo: |
            Scendi nella conca quanto basta per vedere il collo del mulo. L'ha spezzato una zampa larga come
            uno scudo, che ha lasciato quattro solchi nella terra accanto. Sono distanti un palmo l'uno
            dall'altro e fondi quanto un dito. I solchi vanno a sud, e tu ci vai dietro.
          pe: { medicina: 3 }
          effetti: { profondita.avv-zanna-rotta: 1 }
        fallimento:
          titolo: Il sangue grigio
          testo: |
            Ti chini troppo, e dalla ferita del mulo ti cola sulla mano un sangue grigio e denso. Sulla pelle
            è ancora tiepido, e in un animale morto da dieci giorni non dovrebbe esserci.
          effetti: { contaminazione: 0.5 }
      - testo: "Girare largo intorno alla conca"
        descrizione: "A cinquanta passi i vermi non sentono niente. Fra le radici e i rovi, però, si va piano."
        costo: 2
        esito:
          titolo: Il giro largo
          testo: |
            Fai il giro della conca a cinquanta passi di distanza in mezzo ai rovi, e ritrovi il sentiero
            dall'altra parte quando la luce è già cambiata. Da quella distanza del mulo vedi solo il basto,
            che ogni tanto si alza e si abbassa con la terra.
          effetti: { profondita.avv-zanna-rotta: 1, ferite: 0.5 }

  - id: avv-zanna-rotta-le-croci-sui-tronchi
    immagine: icone/tree-branch
    titolo: Le croci sui tronchi
    sommario: "Rinaldo ha segnato i tronchi con il coltello per ritrovare la strada. Le croci ci sono, e sono troppe."
    luogo: La pista grigia, le croci
    area: avv-zanna-rotta
    ripetibile: true
    requisiti: [avventura.zanna-rotta == 6, profondita.avv-zanna-rotta <= 3]
    testo: |
      Su ogni tronco qui intorno è incisa una croce storta che ha un braccio più lungo dell'altro. I tagli
      sono di coltello all'altezza del petto, e la resina ci è colata dentro e si è indurita. Sono decine,
      perché quella notte Rinaldo ha girato in tondo e ha segnato gli stessi alberi due volte. Su alcune la
      corteccia è stata grattata via da unghie larghe. I graffi cominciano più in alto della croce, dove un
      uomo arriva solo con il braccio teso.

      {percezione Difficile} Le croci della prima volta hanno i bordi già rimarginati, mentre quelle della
      seconda sono più fonde e le ha fatte una mano che tremava.
    opzioni:
      - testo: "Trovare le croci giuste"
        descrizione: "Fra decine di croci ce n'è una fila che porta da qualche parte. Le altre girano in tondo."
        prova: { attributo: mentale, abilita: percezione, difficolta: Difficile }
        successo:
          titolo: Le croci fonde
          testo: |
            Segui le croci più fonde, quelle della mano che tremava, e ti portano fuori dal cerchio in linea dritta
            verso sud.
          pe: { percezione: 3 }
          effetti: { profondita.avv-zanna-rotta: 1 }
        fallimento:
          titolo: Il cerchio
          testo: |
            Segui le croci per un'ora e ti ritrovi davanti alla prima, quella con la corteccia grattata. Nei
            graffi la resina è ancora molle, e ti dici che con l'umidità del bosco non indurisce mai. Ti siedi
            su una radice e aspetti che il bosco smetta di girarti intorno.
          effetti: { tormento: 0.5 }
      - testo: "Seguire il braccio lungo, come ha detto Rinaldo"
        descrizione: "Rinaldo te l'ha detto nel box. Ogni croce ha il braccio lungo verso il punto dove è andato dopo."
        requisiti: [avv-zanna-rotta.itinerario >= 1]
        prova: { attributo: mentale, abilita: [percezione, accademiche], difficolta: Media }
        successo:
          titolo: Il braccio lungo
          testo: |
            Leggi le croci una dopo l'altra come i segni di una strada, guardando soltanto il braccio lungo, e in
            poco tempo esci dal cerchio.
          pe: { percezione: 2 }
          effetti: { profondita.avv-zanna-rotta: 1 }
        fallimento:
          titolo: I bracci grattati
          testo: |
            Le unghie hanno grattato proprio i bracci lunghi, e su ogni croce il braccio corto è rimasto
            intatto. A metà strada perdi il filo. Torni indietro con la corteccia sotto le unghie anche tu.
          effetti: { tormento: 0.5 }
      - testo: "Seguire una fila di croci finché finisce"
        descrizione: "Si segue una fila fino all'ultima croce e si torna indietro. Prima o poi una fila porta fuori."
        costo: 2
        esito:
          titolo: Una fila alla volta
          testo: |
            Prendi una fila di croci e la segui fino all'ultima, e quando finisce torni indietro a prenderne
            un'altra. Ogni fila finisce su un tronco segnato due volte, con una croce sopra l'altra. Alla
            quarta fila esci dal cerchio, con la testa che ti gira.
          effetti: { profondita.avv-zanna-rotta: 1, tormento: 0.5 }

  - id: avv-zanna-rotta-il-torrente-rosso
    immagine: ambientazione/gradone-rosso
    titolo: Il torrente rosso
    sommario: "Un torrente color ruggine scende dalla scarpata del Gradone Rosso e taglia la Foresta. Sull'altra riva c'è una striscia di camicia impigliata a un ramo."
    luogo: La pista grigia, il torrente
    area: avv-zanna-rotta
    ripetibile: true
    requisiti: [avventura.zanna-rotta == 6, profondita.avv-zanna-rotta <= 3]
    testo: |
      Un torrente scende veloce dalla scarpata del Gradone Rosso e taglia la Foresta con un'acqua color
      ruggine. Sulle rive la ruggine si è posata sui sassi e sulle radici, e nei gorghi la schiuma è rosa. Il
      guado è una fila di sassi coperti di muschio. Sull'altra riva, impigliata a un ramo basso, c'è una
      striscia di camicia bianca, e più a monte un abete caduto fa da ponte fra le due sponde. Nell'acqua non
      si vede un pesce.

      {acrobazia Media} I sassi più scuri stanno fermi. Quelli chiari, lucidi d'acqua, si girano sotto il
      piede.
    opzioni:
      - testo: "Passare sui sassi"
        descrizione: "Una fila di sassi e il muschio sopra. Da una riva all'altra sono dodici passi."
        prova: { attributo: fisico, abilita: acrobazia, difficolta: Media }
        successo:
          titolo: I sassi scuri
          testo: |
            Passi sui sassi scuri uno dopo l'altro con le braccia larghe, e dall'altra parte stacchi dal ramo
            la striscia di camicia. È lino buono da mercante, e l'acqua della riva l'ha tinto di ruggine fino
            a metà. Sul fango della riva ricominciano le zampe.
          pe: { acrobazia: 2 }
          effetti: { profondita.avv-zanna-rotta: 1 }
        fallimento:
          titolo: Il sasso chiaro
          testo: |
            Metti il piede su un sasso chiaro, e il sasso si gira. Finisci in acqua fino alla cintura e risali
            sulla riva da cui eri partit{o|a}, con un ginocchio sbucciato. L'acqua ti lascia sulla pelle una
            patina rossa che non va via strofinando.
          effetti: { ferite: 0.5 }
      - testo: "Passare sull'abete caduto"
        descrizione: "Il tronco è largo e viscido, e i rami si allungano sull'acqua. Sotto la corrente è forte."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Difficile }
        successo:
          titolo: Il ponte di abete
          testo: |
            Lo passi in piedi fino a metà e a cavalcioni nell'ultimo tratto, dove i rami ti graffiano la
            faccia. Sotto di te la corrente batte contro il tronco e lo fa vibrare fino alle ginocchia.
            Dall'altra parte ritrovi le zampe nel fango della riva.
          pe: { atletica: 3 }
          effetti: { profondita.avv-zanna-rotta: 1 }
        fallimento:
          titolo: I rami
          testo: |
            A metà tronco un ramo ti prende per la cintura e ti fa perdere l'equilibrio. Cadi nell'acqua color
            ruggine, e sotto la superficie senti i sassi del fondo che rotolano con la corrente. Ne esci
            tossendo, dalla parte sbagliata.
          effetti: { ferite: 0.5 }
      - testo: "Guadare dove l'acqua è larga e lenta"
        descrizione: "Più a valle il torrente si allarga. L'acqua arriva alla cintura, ed è fredda."
        costo: 2
        esito:
          titolo: Fino alla cintura
          testo: |
            Entri nel torrente più a valle e lo attraversi con l'acqua alla cintura e la corrente che ti
            spinge di lato. Il fondo è di ghiaia fine che scappa sotto gli stivali. Esci dall'altra parte con
            i denti che battono, e risali la riva fino alle zampe.
          effetti: { profondita.avv-zanna-rotta: 1, ferite: 0.5 }

  # ------------------------------------------------------------ 4-6 · verso la radura
  - id: avv-zanna-rotta-le-felci-di-ferro
    immagine: icone/tree-growth
    titolo: Le felci di ferro
    sommario: "Più avanti le felci sono grigie e rigide, con i bordi taglienti. Quando le tocchi tintinnano."
    luogo: La pista grigia, le felci di ferro
    area: avv-zanna-rotta
    ripetibile: true
    requisiti: [avventura.zanna-rotta == 6, profondita.avv-zanna-rotta >= 4, profondita.avv-zanna-rotta <= 5]
    testo: |
      Più avanti il sottobosco cambia colore. Le felci sono grigie e rigide fino al ginocchio, con i bordi
      affilati come lamine, e quando le tocchi tintinnano. Una foglia che pieghi con il dito resta piegata.
      L'aria ha l'odore di un temporale che non arriva. In mezzo alle felci c'è un sentiero largo, calpestato
      da una bestia pesante, che va dritto verso sud. È largo il doppio delle tue spalle, e le felci
      schiacciate sono ancora piatte nella terra.

      {natura Difficile} Le felci hanno bevuto la Marea dalla terra, e sono più grigie dove ce n'è di più. Le
      radici che affiorano hanno lo stesso grigio delle foglie, e il sentiero calpestato passa proprio lì.
    opzioni:
      - testo: "Aprirti la strada con la lama"
        descrizione: "Trenta passi di felci che tagliano. Si tagliano anche loro, e ogni colpo suona."
        prova: { attributo: fisico, abilita: [armi-da-mischia, resistenza], difficolta: Difficile }
        successo:
          titolo: Le lamine
          testo: |
            Tagli le felci a colpi bassi, e ogni colpo suona come una pentola. Ti ci vuole un'ora per aprire
            un varco lungo trenta passi, con le braccia che bruciano, e il varco che apri è pulito. Alla fine
            il filo della lama ha una fila di tacche fini.
          pe: { armi-da-mischia: 3 }
          effetti: { profondita.avv-zanna-rotta: 1 }
        fallimento:
          titolo: Le schegge
          testo: |
            Le felci tagliate si spezzano in schegge, e una ti apre il dorso della mano. Torni indietro a fasciarti
            con una striscia della manica.
          effetti: { ferite: 0.5 }
      - testo: "Seguire le felci ancora verdi"
        descrizione: "Dove le felci sono verdi la Marea non è arrivata. La strada è più lunga, e passa a chiazze."
        prova: { attributo: mentale, abilita: natura, difficolta: Difficile }
        successo:
          titolo: Le chiazze verdi
          testo: |
            Da una chiazza verde all'altra disegni una strada più lunga e più pulita, e la percorri saltando
            fra le chiazze come sui sassi di un guado. Dove le felci sono verdi l'aria non sa di temporale, e
            la differenza la senti a ogni salto.
          pe: { natura: 3 }
          effetti: { profondita.avv-zanna-rotta: 1 }
        fallimento:
          titolo: La chiazza grigia
          testo: |
            Una chiazza che sembrava verde è grigia sotto la luce, e ci affondi fino alle ginocchia. Per tutto il
            giorno le gambe ti formicolano.
          effetti: { contaminazione: 0.5 }
      - testo: "Prendere il sentiero calpestato"
        descrizione: "La bestia ha schiacciato le felci nella terra, e lì non tagliano più. Lì, però, la Marea è più fitta."
        costo: 2
        esito:
          titolo: Il sentiero della bestia
          testo: |
            Prendi il sentiero calpestato, dove le felci sono schiacciate nella terra e non tagliano più.
            Sotto gli stivali crocchiano come vetro sottile. In fondo hai i calzoni grigi fino alla cintura e
            una tosse secca che non passa.
          effetti: { profondita.avv-zanna-rotta: 1, contaminazione: 0.5 }

  - id: avv-zanna-rotta-la-vena-che-affiora
    immagine: icone/crystal-growth
    titolo: La vena che affiora
    sommario: "Lungo il pendio una fila di cristalli grigi esce dalla terra e corre verso sud. Ronzano, e la loro luce batte tutta insieme."
    luogo: La pista grigia, la vena
    area: avv-zanna-rotta
    ripetibile: true
    requisiti: [avventura.zanna-rotta == 6, profondita.avv-zanna-rotta >= 4, profondita.avv-zanna-rotta <= 6]
    testo: |
      Lungo il pendio affiora una fila di cristalli grigi che corre verso sud come la spina dorsale di un
      animale sepolto. Spuntano dalla terra di sbieco e sono tutti inclinati verso sud. La luce che hanno
      dentro sale e scende tutta insieme con un ronzio che senti nei denti, e dove la fila passa le radici
      degli alberi sono nere. A un passo dalla vena non cresce erba, e gli aghi caduti sono secchi e chiari.
      Per andare avanti bisogna passarle accanto oppure sopra.

      {magia Difficile} Il Mana corre nella vena verso sud, sempre nello stesso verso, fino a un punto solo
      che la tira a sé.
    opzioni:
      - testo: "Scavalcare la vena senza toccarla"
        descrizione: "Dove i cristalli sono più bassi si salta. Toccarli, anche con lo stivale, è un'altra faccenda."
        prova: { attributo: fisico, abilita: acrobazia, difficolta: Difficile }
        successo:
          titolo: Sopra la vena
          testo: |
            Trovi un punto dove i cristalli sono più bassi e la scavalchi con un salto lungo, le ginocchia al
            petto. Il ronzio ti passa sotto, e atterri dall'altra parte con i capelli dritti sulla nuca. Ci
            vogliono venti passi perché tornino giù.
          pe: { acrobazia: 3 }
          effetti: { profondita.avv-zanna-rotta: 1 }
        fallimento:
          titolo: Lo stivale
          testo: |
            Lo stivale sfiora un cristallo nel salto, e la scossa ti sale fino all'anca. Ti ritrovi sedut{o|a}
            per terra con una gamba che non ti ubbidisce. Sulla punta dello stivale il cuoio è diventato
            grigio e duro.
          effetti: { contaminazione: 0.5 }
      - testo: "Seguire il battito della vena"
        descrizione: "La luce sale e scende. Fra un battito e l'altro la vena si assottiglia, e da qualche parte si passa."
        prova: { attributo: mentale, abilita: [magia, tecnologia], difficolta: Difficile }
        successo:
          titolo: Fra un battito e l'altro
          testo: |
            Conti i battiti della luce finché li senti nelle dita, e allora capisci dove la vena si
            assottiglia. Ogni dodici battiti ce n'è uno più debole degli altri. Passi lì, nel momento in cui
            la luce è bassa.
          pe: { magia: 3 }
          effetti: { profondita.avv-zanna-rotta: 1 }
        fallimento:
          titolo: Il ronzio
          testo: |
            Ascolti la vena troppo a lungo, e il ronzio ti resta in testa anche quando te ne allontani. Per
            un'ora i tuoi passi li senti appena, e il ronzio sale e scende con il ritmo della luce che hai
            lasciato indietro.
          effetti: { tormento: 0.5 }
      - testo: "Tenere davanti il cristallo di Rinaldo"
        descrizione: "Il cristallo nel piombo viene da qui. Forse sa dove la vena lascia passare."
        requisiti: [avv-zanna-rotta.cristallo >= 1]
        prova: { attributo: mentale, abilita: [magia, percezione], difficolta: Media }
        successo:
          titolo: Il cristallo risponde
          testo: |
            Svolgi il piombo e tieni il cristallo davanti a te. La sua luce batte insieme a quella della vena,
            e dove la vena si interrompe per un passo diventa più fioca. È lì che passi, con il cristallo
            stretto contro il petto. Quando lo riavvolgi nel piombo lo senti battere ancora per un po' contro
            il palmo.
          pe: { magia: 2 }
          effetti: { profondita.avv-zanna-rotta: 1 }
        fallimento:
          titolo: Il palmo
          testo: |
            Il cristallo batte più forte della vena e ti scalda il palmo attraverso il piombo. Lo riavvolgi con le
            dita che tremano.
          effetti: { contaminazione: 0.5 }
      - testo: "Fare il giro lungo, per il fondo del vallone"
        descrizione: "In fondo al vallone la vena non arriva. Ci si arriva per i sassi, e si risale dall'altra parte."
        costo: 2
        esito:
          titolo: Il vallone
          testo: |
            Scendi nel vallone dove la vena non arriva e lo risali dall'altra parte arrampicandoti sulle
            radici nere. In fondo al vallone scorre un rigagnolo d'acqua chiara, e lì il ronzio non si sente.
            Ci metti mezza giornata, e ne esci con una caviglia gonfia.
          effetti: { profondita.avv-zanna-rotta: 1, ferite: 0.5 }

  - id: avv-zanna-rotta-il-cervo-che-non-scappa
    immagine: icone/deer
    titolo: Il cervo che non scappa
    sommario: "In mezzo al sentiero c'è un cervo con le corna di vetro grigio. Ti guarda, e non scappa."
    luogo: La pista grigia, il sentiero
    area: avv-zanna-rotta
    ripetibile: true
    requisiti: [avventura.zanna-rotta == 6, profondita.avv-zanna-rotta >= 4, profondita.avv-zanna-rotta <= 6]
    testo: |
      In mezzo al sentiero c'è un cervo rosso, un maschio adulto, fermo. Le corna gli sono diventate di vetro
      grigio trasparente, con dentro la stessa luce della vena, e il vetro comincia con un bordo netto dove
      finisce l'osso della fronte. Il pelo del collo è grigio fino alle spalle. Le mosche gli girano intorno
      ai fianchi e sul grigio non si posano. Ti guarda con la testa bassa senza scappare, e tu ti dici che è
      vecchio o ferito, perché un cervo sano a quest'ora sarebbe già fra gli abeti. Dietro di lui il sentiero
      continua verso sud.

      {addestrare-animali Difficile} Un cervo che non scappa ha già deciso di caricare. Ha il collo teso e le
      zampe davanti piantate nella terra.
    opzioni:
      - testo: "Affrontare il cervo"
        descrizione: "Un cervo adulto con le corna di vetro. Carica basso, e il vetro taglia."
        combattimento: avv-zanna-rotta-il-cervo
        vittoria:
          titolo: Le corna di vetro
          testo: |
            Il cervo cade su un fianco e le corna si spezzano contro un sasso, con un rumore di bicchieri.
            Dentro le schegge il vetro è pieno di righe sottili e concentriche, fitte come gli anelli di un
            tronco. Gli passi accanto, e la luce dentro i pezzi si spegne mentre li guardi.
          effetti: { profondita.avv-zanna-rotta: 1 }
        sconfitta:
          titolo: La carica
          testo: |
            Il cervo ti carica di fianco e ti butta fra le felci, poi resta a guardarti con la testa bassa finché
            non torni indietro.
          effetti: { tormento: 0.5 }
      - testo: "Farlo andare via"
        descrizione: "Un animale che carica si può convincere che non ne vale la pena. Bisogna essere più grossi di lui, per un momento."
        prova: { attributo: sociale, abilita: addestrare-animali, difficolta: Difficile }
        successo:
          titolo: Il passo avanti
          testo: |
            Alzi le braccia lentamente e fai un passo avanti, poi un altro, con la voce bassa e dura che si
            usa con i tori. Al terzo passo il cervo gira la testa e se ne va nel bosco al trotto. Fra gli
            abeti la luce delle corna si vede ancora a lungo, e va a sud come il sentiero.
          pe: { addestrare-animali: 3 }
          effetti: { profondita.avv-zanna-rotta: 1 }
        fallimento:
          titolo: La punta di vetro
          testo: |
            Al primo passo il cervo abbassa le corna e ti viene addosso. Ti butti di lato, e una punta di
            vetro ti apre la giubba e la pelle sotto. Il taglio brucia di freddo invece che di caldo, e per
            un'ora i bordi ti formicolano.
          effetti: { ferite: 0.5 }
      - testo: "Girargli intorno nel sottobosco"
        descrizione: "Il cervo guarda il sentiero. A venti passi, fra gli abeti, forse non guarda te."
        prova: { attributo: fisico, abilita: furtivita, difficolta: Difficile }
        successo:
          titolo: Fra gli abeti
          testo: |
            Esci dal sentiero e gli giri intorno piano a venti passi, fra gli abeti. Il cervo continua a
            guardare il punto dove eri prima con la testa bassa, e lo sta ancora guardando quando lo perdi di
            vista fra i tronchi.
          pe: { furtivita: 3 }
          effetti: { profondita.avv-zanna-rotta: 1 }
        fallimento:
          titolo: Il ramo spezzato
          testo: |
            Spezzi un ramo a metà del giro, e il cervo si gira verso di te con le corna basse. Il ramo è
            grigio fino al midollo e si è rotto secco, con il rumore di un osso. Torni sul sentiero
            all'indietro, senza dargli le spalle.
          effetti: { tormento: 0.5 }
      - testo: "Aspettare che se ne vada"
        descrizione: "Prima o poi anche un cervo mutato ha fame. Ci si siede dietro un tronco, e si aspetta."
        costo: 2
        esito:
          titolo: L'attesa
          testo: |
            Ti siedi dietro un tronco e aspetti. Il cervo resta fermo per ore, e in tutto quel tempo non bruca
            mai e tiene il muso girato verso sud. Quando finalmente se ne va hai le gambe addormentate e
            l'odore del fulmine nei vestiti.
          effetti: { profondita.avv-zanna-rotta: 1, contaminazione: 0.5 }

  - id: avv-zanna-rotta-la-nebbia-bassa
    immagine: ambientazione/marea-grigia
    titolo: La nebbia bassa
    sommario: "Il sentiero scende in un avvallamento pieno di nebbia grigia all'altezza del ginocchio. Dall'altra parte gli alberi si diradano."
    luogo: La pista grigia, l'avvallamento
    area: avv-zanna-rotta
    ripetibile: true
    requisiti: [avventura.zanna-rotta == 6, profondita.avv-zanna-rotta >= 5, profondita.avv-zanna-rotta <= 6]
    testo: |
      Il sentiero scende in un avvallamento pieno fino al ginocchio di una nebbia grigia e ferma, con un
      riflesso di metallo. La superficie è piatta come quella di uno stagno, e una foglia che ci cade sopra
      resta a galla. Bisogna attraversarla per una cinquantina di passi fino all'altro bordo, dove gli alberi
      si diradano in una luce bianca. Dove la nebbia li tocca i tronchi sono lisci e grigi. Sopra la nebbia la
      corteccia ricomincia a un'altezza sola, uguale su tutti i tronchi.

      {resistenza Difficile} Cinquanta passi senza respirare si fanno, se a metà le gambe continuano ad
      andare.

      {origine apprendista-raschiatore} Sulle piattaforme della Cicatrice i vecchi ti hanno insegnato a
      passare la nebbia bassa dalla parte più alta del terreno.
    opzioni:
      - testo: "Attraversarla a bocca chiusa"
        descrizione: "Cinquanta passi con l'aria nel petto, senza fermarsi mai."
        prova: { attributo: fisico, abilita: [resistenza, atletica], difficolta: Difficile }
        successo:
          titolo: Cinquanta passi
          testo: |
            Riempi il petto d'aria e attraversi a passi lunghi, con le ginocchia alte, contando. Al
            quarantesimo passo ti brucia la gola, e al cinquantesimo sei sull'altro bordo a tossire nella luce
            bianca. Dietro di te la nebbia si è già richiusa, e non resta il segno di dove sei passat{o|a}.
          pe: { resistenza: 3 }
          effetti: { profondita.avv-zanna-rotta: 1 }
        fallimento:
          titolo: A metà strada
          testo: |
            A metà strada la gola ti cede e ingoi una boccata di nebbia che sa di ferro. È fredda in bocca e
            calda quando arriva nel petto. Torni indietro piegat{o|a} in due, e per un'ora sputi grigio.
          effetti: { contaminazione: 0.5 }
      - testo: "Cercare il dosso dove la nebbia è più rada"
        descrizione: "La nebbia sta nel basso. Dove il terreno sale, arriva appena alle caviglie."
        prova: { attributo: mentale, abilita: [percezione, natura], difficolta: Difficile }
        successo:
          titolo: Il dosso
          testo: |
            Sul lato destro dell'avvallamento c'è un dosso coperto di radici dove la nebbia arriva appena alle
            caviglie. Le radici sono nere fino al punto dove la nebbia le tocca. Lo percorri piano, con il
            fazzoletto sulla bocca, e arrivi al bordo con gli stivali grigi e il resto pulito.
          pe: { percezione: 3 }
          effetti: { profondita.avv-zanna-rotta: 1 }
        fallimento:
          titolo: La buca
          testo: |
            Il dosso che hai scelto finisce a metà, in una buca dove la nebbia ti arriva alla vita. Dentro la
            buca è più fredda, e senti la pelle tirare sotto i calzoni. Ne esci di corsa con gli occhi che
            lacrimano.
          effetti: { contaminazione: 0.5 }
      - testo: "Passare di corsa con il fazzoletto sulla bocca"
        descrizione: "Il fazzoletto ferma un po' di nebbia, e la corsa fa il resto. Quello che passa lo stesso te lo porti addosso."
        costo: 2
        esito:
          titolo: Di corsa
          testo: |
            Ti leghi il fazzoletto sulla bocca e attraversi di corsa, con la nebbia che si apre davanti alle
            ginocchia e si richiude dietro. Dall'altra parte il fazzoletto è grigio e rigido, e lo butti.
          effetti: { profondita.avv-zanna-rotta: 1, contaminazione: 0.5 }

  # ------------------------------------------------------------ 5 · la svolta, la radura dei vetri
  - id: avv-zanna-rotta-la-radura-dei-vetri
    immagine: ambientazione/marea-grigia
    titolo: La radura dei vetri
    sommario: "La radura dove Rinaldo ha raccolto il cristallo è coperta di schegge grigie. Intorno, sul bordo, gli animali aspettano con il muso rivolto a sud."
    luogo: La pista grigia, la radura dei vetri
    area: avv-zanna-rotta
    requisiti: [avventura.zanna-rotta == 6, profondita.avv-zanna-rotta == 5, avv-zanna-rotta.svolta == 0]
    testo: |
      La radura dei vetri è un cerchio di terra nuda coperto di schegge sottili di cristallo grigio. Al centro
      c'è la buca fresca dove Rinaldo ha scavato il suo, con la terra di riporto ancora ammucchiata da un
      lato. Accanto la terra è spaccata, e dalla crepa esce una nebbia grigia che scivola rasoterra verso sud
      in un filo sottile, fino agli alberi. Il filo non si allarga nemmeno dove l'aria si muove.

      Sul bordo della radura stanno seduti sui vetri una volpe e tre lepri, e più in là un tasso giovane
      accanto a un cinghialetto. Hanno il muso a sud e il pelo grigio a chiazze. La volpe è a un salto dalle
      lepri e non le guarda. Ogni tanto uno si alza e segue il filo fra gli alberi.

      Sui vetri accanto al filo ci sono le impronte di una zampa larga come uno scudo, che vanno a sud e
      tornano. Dove la zampa ha pestato le schegge sono ridotte in polvere.

      {natura Difficile} La nebbia chiama gli animali che ha toccato, e loro la seguono verso una sorgente più
      a sud.

      *La sacca è ancora aperta.* Ti torna in mente la mano fasciata di Rinaldo e il cristallo grande come un
      uovo.
    opzioni:
      - testo: "Seguire gli animali verso sud"
        descrizione: "Gli animali vanno dove va la nebbia. Se ti vedono si fermano, e ti guardano tutti insieme."
        prova: { attributo: fisico, abilita: furtivita, difficolta: Difficile }
        successo:
          titolo: Dietro la volpe
          testo: |
            Aspetti che la volpe si alzi e le vai dietro a dieci passi, chinat{o|a}, lungo il filo di nebbia.
            La volpe non si volta mai, e sui vetri le sue zampe non fanno rumore. Fra gli alberi il filo
            scende verso la scarpata, e da laggiù arriva il rumore basso e lento di una bestia grande che
            dorme.
          pe: { furtivita: 3 }
          effetti: { profondita.avv-zanna-rotta: 1 }
          imposta: { avv-zanna-rotta.svolta: 1 }
        fallimento:
          titolo: Il vetro sotto lo stivale
          testo: |
            Una scheggia ti si spezza sotto lo stivale, e gli animali della radura girano la testa verso di te
            tutti nello stesso momento. Nessuno si alza e nessuno scappa. Arretri fra gli alberi finché non
            tornano a guardare a sud.
          effetti: { tormento: 0.5 }
      - testo: "Capire da dove viene la nebbia"
        descrizione: "La crepa è accanto alla buca di Rinaldo. Per capire bisogna inginocchiarsi lì, con il fazzoletto sulla bocca."
        prova: { attributo: mentale, abilita: [natura, magia], difficolta: Difficile }
        successo:
          titolo: La crepa
          testo: |
            Ti inginocchi accanto alla crepa con il fazzoletto sulla bocca. Dal bordo sale un calore leggero,
            e le schegge intorno sono tiepide sotto le dita. La vena passa qui sotto venendo da sud, e la
            crepa è soltanto il punto dove si è rotta. La nebbia che ne esce torna indietro lungo la vena fino
            alla sorgente, che sta sotto la scarpata, dove vanno gli animali.
          pe: { natura: 3 }
          effetti: { profondita.avv-zanna-rotta: 1 }
          imposta: { avv-zanna-rotta.svolta: 1 }
        fallimento:
          titolo: La boccata
          testo: |
            Ti avvicini troppo, e dalla crepa ti sale in faccia una boccata di nebbia. Ti allontani tossendo,
            con gli occhi che bruciano e il sapore del ferro sulla lingua. Sul bordo della radura nessun
            animale ha girato la testa.
          effetti: { contaminazione: 0.5 }
      - testo: "Ascoltare il cristallo di Rinaldo"
        descrizione: "Il cristallo è nato qui. Vicino alla sua buca, forse, dice da che parte sta il resto."
        requisiti: [avv-zanna-rotta.cristallo >= 1]
        prova: { attributo: mentale, abilita: [magia, percezione], difficolta: Media }
        successo:
          titolo: Il battito doppio
          testo: |
            Svolgi il piombo, e il cristallo ti batte nel palmo come un cuore piccolo. Vicino alla buca dove è
            nato resta uguale. Lo giri piano con il braccio teso verso ogni lato della radura. Verso sud, dove
            vanno gli animali, batte il doppio.
          pe: { magia: 2 }
          effetti: { profondita.avv-zanna-rotta: 1 }
          imposta: { avv-zanna-rotta.svolta: 1 }
        fallimento:
          titolo: Le dita grigie
          testo: |
            Il cristallo batte tanto forte che ti brucia il palmo, e lo lasci cadere sui vetri. Lo ritrovi a
            tentoni fra le schegge che tintinnano sotto la mano, e quando lo riavvolgi hai le dita grigie fino
            alla seconda falange.
          effetti: { contaminazione: 0.5 }
      - testo: "Guardare da lontano, nascosto fra gli alberi"
        descrizione: "Gli animali prima o poi se ne vanno tutti. Basta aspettare abbastanza, e guardare dove."
        costo: 2
        esito:
          titolo: Fra gli abeti
          testo: |
            Resti nascost{o|a} fra gli abeti fino a sera, a guardare gli animali che si alzano uno alla volta
            e se ne vanno a sud. Nessuno di quelli che partono torna indietro. L'ultima è la volpe. Le vai
            dietro con la testa piena di quello che hai visto.
          effetti: { profondita.avv-zanna-rotta: 1, tormento: 0.5 }
          imposta: { avv-zanna-rotta.svolta: 1 }

  # ------------------------------------------------------------ 7-9 · la tana dei contaminati
  - id: avv-zanna-rotta-i-lupi-della-scarpata
    immagine: icone/wolf-howl
    titolo: I lupi della scarpata
    sommario: "Ai piedi della scarpata del Gradone Rosso c'è una spaccatura, e davanti alla spaccatura ci sono i lupi."
    luogo: La pista grigia, la scarpata
    area: avv-zanna-rotta
    ripetibile: true
    requisiti: [avventura.zanna-rotta == 6, profondita.avv-zanna-rotta >= 7, profondita.avv-zanna-rotta <= 8]
    testo: |
      La Foresta finisce contro la parete color mattone del Gradone Rosso, un'arenaria che si sfoglia a lastre
      sottili e lascia ai suoi piedi un ghiaione di schegge rosse. Il filo di nebbia entra in una spaccatura
      alla base, e davanti sono sdraiati fra i sassi sei o sette lupi grigi. Nessuno ansima e nessuno si
      gratta, e la nebbia gli passa fra le zampe senza che muovano un orecchio. Ti dici che sono sazi, perché
      un branco sazio di giorno resta sdraiato. In mezzo a loro si alza una lupa grande quanto un vitello che
      ti guarda.

      {intimidire Difficile} Decide soltanto la lupa, e se lei arretra arretrano tutti. Gli altri tengono gli
      occhi su di lei e aspettano un suo segno.
    opzioni:
      - testo: "Affrontare la lupa"
        descrizione: "Una lupa grande quanto un vitello, con il branco intorno. Se cade lei, il branco si apre."
        combattimento: avv-zanna-rotta-la-lupa
        vittoria:
          titolo: Il branco si apre
          testo: |
            Quando la lupa cade il branco si sparpaglia fra i sassi senza un verso. Passi in mezzo ai lupi
            fino alla spaccatura con la lama alzata, e nessuno di loro torna ad annusare il corpo della lupa.
          effetti: { profondita.avv-zanna-rotta: 1 }
        sconfitta:
          titolo: Il branco
          testo: |
            La lupa ti prende la coscia e ti trascina sul ghiaione, e il branco si stringe intorno. Te ne
            liberi a colpi e scappi fra gli alberi, finché smettono di seguirti. Si fermano tutti nello stesso
            punto al margine del bosco e tornano verso la scarpata senza voltarsi.
          effetti: { tormento: 0.5 }
      - testo: "Farla arretrare"
        descrizione: "Si avanza dritti senza fretta e senza abbassare gli occhi. Con una lupa così, basta sbagliare il passo una volta."
        prova: { attributo: sociale, abilita: intimidire, difficolta: Molto difficile }
        successo:
          titolo: Lo sguardo della lupa
          testo: |
            Avanzi verso la lupa con le braccia larghe e gli occhi nei suoi, che da vicino sono chiari e
            asciutti e non sbattono mai. A tre passi lei abbassa le orecchie e si sposta di lato, e il branco
            si sposta con lei.
          pe: { intimidire: 4 }
          effetti: { profondita.avv-zanna-rotta: 1 }
        fallimento:
          titolo: Il salto
          testo: |
            A tre passi la lupa resta dov'è. Ti salta al braccio e ci chiude sopra i denti senza un ringhio, e
            prima che arrivi il branco riesci a scrollartela di dosso e a buttarti fra gli alberi.
          effetti: { ferite: 0.5 }
      - testo: "Tenerli a distanza con lo spiedo"
        descrizione: "Lo spiedo di Dolovan ha la punta larga e la traversa. Un lupo che salta trova la punta prima di te."
        requisiti: [avv-zanna-rotta.spiedo >= 1]
        prova: { attributo: fisico, abilita: armi-da-mischia, difficolta: Difficile }
        successo:
          titolo: La punta larga
          testo: |
            Punti lo spiedo basso, con il calcio stretto sotto il braccio, e avanzi sul ghiaione. La lupa
            prova due volte a saltarti addosso e due volte trova la punta, e ogni volta il colpo ti arriva
            fino alla spalla attraverso il manico. Alla fine si ritira con una spalla rossa e il branco la
            segue.
          pe: { armi-da-mischia: 3 }
          effetti: { profondita.avv-zanna-rotta: 1 }
        fallimento:
          titolo: Da dietro
          testo: |
            La lupa ti gira intorno più in fretta di quanto tu riesca a girare lo spiedo e ti morde il
            polpaccio da dietro. Ti ritiri fra gli alberi trascinando la gamba, con lo spiedo che si impiglia
            nei rami bassi a ogni passo.
          effetti: { ferite: 0.5 }
      - testo: "Aspettare che il branco vada a caccia"
        descrizione: "Di notte i lupi cacciano. Si aspetta fra gli alberi senza accendere fuochi, e si passa al buio."
        costo: 3
        esito:
          titolo: La notte sui sassi
          testo: |
            Aspetti fra gli alberi fino a notte, senza accendere fuochi, finché il branco si alza e se ne va
            in fila lungo la scarpata senza un ululato. Passi al buio, intirizzit{o|a}, con le orecchie dietro
            a ogni sasso che rotola.
          effetti: { profondita.avv-zanna-rotta: 1, tormento: 0.5 }

  - id: avv-zanna-rotta-il-tasso-nella-galleria
    immagine: icone/sniffing-dog
    titolo: Il tasso nella galleria
    sommario: "Dentro la spaccatura la roccia si stringe in una galleria. A metà c'è un tasso grande quanto un maiale, e scava."
    luogo: La pista grigia, la galleria
    area: avv-zanna-rotta
    ripetibile: true
    requisiti: [avventura.zanna-rotta == 6, profondita.avv-zanna-rotta >= 7, profondita.avv-zanna-rotta <= 9]
    testo: |
      Dentro la spaccatura la roccia si stringe in una galleria bassa, dove si va piegati con la schiena che
      sfrega sul soffitto. Qui l'arenaria è tenera, e all'altezza del ginocchio le pareti sono rigate di
      solchi paralleli a cinque a cinque. A metà la chiude un tasso grosso come un maiale, con le unghie
      lunghe e il muso a strisce grigie. Sta scavando nella parete, e dalla buca che ha già aperto esce un
      filo di nebbia. Quando ti sente si gira e soffia.

      {rissa Media} In una galleria stretta un tasso prende quello che gli arriva davanti e non lo molla. Per
      girarsi deve piegarsi in due contro la roccia, e gli costa più che a te.
    opzioni:
      - testo: "Affrontare il tasso"
        descrizione: "Basso, largo, con unghie da scavatore e una pelle che la lama fatica a passare."
        combattimento: avv-zanna-rotta-il-tasso
        vittoria:
          titolo: La galleria libera
          testo: |
            Il tasso muore con i denti ancora chiusi sul tuo stivale, e devi aprirglieli facendo leva con la
            lama. Il corpo che sposti con il piede è già freddo, come se fosse morto da ore. Oltre di lui la
            galleria scende verso una luce grigia.
          effetti: { profondita.avv-zanna-rotta: 1 }
        sconfitta:
          titolo: Le unghie
          testo: |
            Il tasso ti apre la manica e la pelle sotto, e tu esci dalla galleria all'indietro, sulle ginocchia,
            mentre lui torna a scavare.
          effetti: { tormento: 0.5 }
      - testo: "Strisciargli accanto mentre scava"
        descrizione: "Quando scava ha il muso nella parete. Fra lui e l'altra parete c'è spazio per uno che striscia."
        prova: { attributo: fisico, abilita: furtivita, difficolta: Difficile }
        successo:
          titolo: Mentre scava
          testo: |
            Aspetti che torni a scavare con il muso nella parete, poi gli strisci accanto sulla pancia, tanto
            vicino che senti le sue unghie lavorare nella pietra e il suo pelo umido sfiorarti la guancia. Il
            tasso continua a scavare.
          pe: { furtivita: 3 }
          effetti: { profondita.avv-zanna-rotta: 1 }
        fallimento:
          titolo: Il gomito
          testo: |
            Gli tocchi la coda con il gomito, e il tasso si gira in un lampo. Ti morde la spalla e ti ricaccia
            fuori dalla galleria a unghiate. Fuori ti accorgi che la giubba sulla spalla è tagliata in strisce
            pulite, una per unghia.
          effetti: { ferite: 0.5 }
      - testo: "Farlo uscire con il fumo"
        descrizione: "Una tana ha sempre due uscite. Con il fumo giusto il tasso sceglie l'altra."
        prova: { attributo: mentale, abilita: natura, difficolta: Difficile }
        successo:
          titolo: Il fumo di aghi
          testo: |
            Accendi un fuoco di aghi verdi all'imbocco, che fa un fumo bianco e denso di resina, e lo spingi
            dentro sventolando la giubba. Il tasso esce tossendo da un'altra buca più in alto e se ne va. La
            galleria puzza di fumo, ed è libera.
          pe: { natura: 3 }
          effetti: { profondita.avv-zanna-rotta: 1 }
        fallimento:
          titolo: Il fumo che torna
          testo: |
            La galleria tira dalla parte sbagliata, e il fumo ti torna addosso. Tossisci finché vedi le stelle, e il
            tasso è ancora lì.
          effetti: { ferite: 0.5 }
      - testo: "Allargare un'altra strada a mani nude"
        descrizione: "Accanto alla galleria c'è una fessura. Con il coltello e le unghie, in qualche ora, ci si passa di fianco."
        costo: 3
        esito:
          titolo: A mani nude
          testo: |
            Allarghi la fessura accanto alla galleria con il coltello e con le mani, per ore, finché ci passi
            di fianco. L'arenaria si sgretola in una sabbia rossa che ti entra negli occhi e nel colletto. Ne
            esci con le unghie rotte e le dita che sanguinano.
          effetti: { profondita.avv-zanna-rotta: 1, ferite: 0.5 }

  - id: avv-zanna-rotta-il-nido-di-pelo
    immagine: icone/animal-hide
    titolo: Il nido di pelo
    sommario: "Il pavimento della caverna è coperto di pelo grigio, alto fino al ginocchio e tiepido. Ci dormono dentro le volpi."
    luogo: La pista grigia, la caverna del pelo
    area: avv-zanna-rotta
    ripetibile: true
    requisiti: [avventura.zanna-rotta == 6, profondita.avv-zanna-rotta >= 8, profondita.avv-zanna-rotta <= 9]
    testo: |
      La galleria si apre in una caverna bassa coperta di pelo grigio, quello che gli animali della radura
      hanno perso qui strato su strato. Gli strati di sotto sono pressati e scuri come feltro, e quelli di
      sopra sono ancora sciolti. Il pelo è tiepido e alto fino al ginocchio, e ci dormono dentro due volpi e
      una lepre, con la lepre che tiene il muso contro il fianco di una volpe. Ti dici che il caldo le ha
      addormentate tutte e tre prima che pensassero alla fame. Da sotto sale lentissima la nebbia, e
      dall'altra parte un passaggio scende.

      {resilienza Molto difficile} Il pelo tiepido ti fa venire voglia di sdraiarti. Te lo chiede la Marea,
      con la tua voce.
    opzioni:
      - testo: "Attraversarlo senza svegliare le volpi"
        descrizione: "Il pelo attutisce i passi. Le volpi, però, dormono con un orecchio solo."
        prova: { attributo: fisico, abilita: furtivita, difficolta: Difficile }
        successo:
          titolo: Fra le volpi
          testo: |
            Passi nel pelo fino al ginocchio, un piede alla volta, fra le volpi che dormono, e gli strati
            cedono sotto la suola senza un fruscio. Una apre un occhio e ti guarda, poi lo richiude.
          pe: { furtivita: 3 }
          effetti: { profondita.avv-zanna-rotta: 1 }
        fallimento:
          titolo: La volpe sveglia
          testo: |
            Una volpe si sveglia sotto il tuo piede e ti morde la caviglia, e le altre bestie si svegliano
            tutte insieme e senza un verso. Torni nella galleria con i loro occhi addosso.
          effetti: { ferite: 0.5 }
      - testo: "Attraversarlo a occhi aperti, senza fermarti"
        descrizione: "Il pelo tiepido chiede di sdraiarsi. Si passa dritti con gli occhi sul passaggio dall'altra parte."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Molto difficile }
        successo:
          titolo: Gli occhi aperti
          testo: |
            Attraversi la caverna dritto, guardando il passaggio dall'altra parte, e ogni volta che le
            ginocchia vogliono piegarsi ti mordi la lingua. Il tepore ti sale dalle gambe fino ai fianchi come
            un bagno caldo. Arrivi al passaggio con il sapore del sangue in bocca e la testa lucida.
          pe: { resilienza: 4 }
          effetti: { profondita.avv-zanna-rotta: 1 }
        fallimento:
          titolo: Il sonno
          testo: |
            A metà caverna ti siedi senza aver deciso di farlo. Ti svegli dopo un tempo che non sai, con il
            pelo grigio addosso fino al collo e una volpe che dorme contro il tuo fianco, e scappi nella
            galleria.
          effetti: { tormento: 0.5, contaminazione: 0.5 }
      - testo: "Bruciarti un passaggio nel pelo"
        descrizione: "Il pelo brucia, e la nebbia si ritira dal fuoco. Bisogna saper tenere piccola la fiamma."
        prova: { attributo: mentale, abilita: natura, difficolta: Difficile }
        successo:
          titolo: La striscia bruciata
          testo: |
            Il pelo brucia piano e puzza di corno, e la nebbia sotto si ritira dalla fiamma. Passi sulla
            striscia bruciata con il fazzoletto sulla bocca e la roccia nuda e tiepida sotto le suole, mentre
            le volpi scappano dall'altra parte.
          pe: { natura: 3 }
          effetti: { profondita.avv-zanna-rotta: 1 }
        fallimento:
          titolo: La fiammata
          testo: |
            Il pelo prende fuoco tutto insieme, con una fiammata che arriva al soffitto e ci lascia una
            macchia nera. Torni nella galleria con le sopracciglia bruciate e le mani piene di vesciche.
          effetti: { ferite: 0.5 }
      - testo: "Passarci in mezzo carponi, in fretta"
        descrizione: "Il pelo ti entrerà dappertutto. Non c'è altro modo di farlo in fretta."
        costo: 3
        esito:
          titolo: Carponi
          testo: |
            Lo attraversi carponi, in fretta, con il pelo tiepido che ti entra nelle maniche e nel colletto.
            Sotto i palmi gli strati di fondo sono umidi e cedono come muschio. Dall'altra parte te lo togli
            di dosso a manciate, e qualcosa ti resta lo stesso nelle pieghe dei vestiti.
          effetti: { profondita.avv-zanna-rotta: 1, contaminazione: 0.5 }

  - id: avv-zanna-rotta-la-cengia-sopra-la-tana
    immagine: ambientazione/gradone-rosso
    titolo: La cengia sopra la tana
    sommario: "Il passaggio finisce su una cengia, a mezza altezza di una grotta grande come una piazza. In fondo, fra le ossa, dorme un orso."
    luogo: La pista grigia, la cengia
    area: avv-zanna-rotta
    ripetibile: true
    requisiti: [avventura.zanna-rotta == 6, profondita.avv-zanna-rotta >= 8, profondita.avv-zanna-rotta <= 9]
    testo: |
      Il passaggio finisce su una cengia stretta a mezza parete di una grotta grande come una piazza. La
      cengia è larga due palmi, e l'arenaria del bordo si sbriciola in scaglie rosse appena ci posi le dita.
      Sul fondo la nebbia sale da una spaccatura del pavimento e riempie la grotta di una luce grigia che non
      fa ombre. Intorno ci sono ossa di cervi e cinghiali, sparse in un cerchio che resta alla stessa distanza
      dalla spaccatura. In mezzo alle ossa dorme un orso con una cresta di cristalli che gli esce dal pelo
      grigio lungo la schiena.

      {acrobazia Difficile fallita} Guardi giù e le ginocchia ti diventano di ricotta, così ti siedi un
      momento per guardare meglio.
    opzioni:
      - testo: "Calarti sulla parete"
        descrizione: "Dritto giù, con le dita nelle fessure. La roccia del Gradone si sbriciola, e sotto ci sono le ossa."
        prova: { attributo: fisico, abilita: acrobazia, difficolta: Molto difficile }
        successo:
          titolo: La parete
          testo: |
            Ti cali sulla parete con le dita nelle fessure, un appiglio alla volta, e l'ultimo tratto lo fai
            lasciandoti scivolare. Tocchi il fondo senza un rumore, dietro un mucchio di ossa. Da qui il
            respiro dell'orso lo senti anche nei piedi, attraverso la roccia.
          pe: { acrobazia: 4 }
          effetti: { profondita.avv-zanna-rotta: 1 }
        fallimento:
          titolo: L'appiglio
          testo: |
            Un appiglio ti si sbriciola in mano e cadi per due volte la tua altezza sulla roccia della cengia.
            Il colpo rimbomba nella grotta e la volta lo rimanda indietro. L'orso continua a dormire. Tu
            risali con un braccio che fatica ad alzarsi.
          effetti: { ferite: 0.5 }
      - testo: "Scendere per la frana di sassi"
        descrizione: "In fondo alla cengia una frana scende fino al pavimento. I sassi rotolano, e rotolando fanno rumore."
        prova: { attributo: fisico, abilita: atletica, difficolta: Difficile }
        successo:
          titolo: La frana
          testo: |
            Scendi la frana di sbieco, con i piedi larghi. I sassi sono schegge piatte di arenaria che
            scivolano più che rotolare, e quelli più piccoli ti corrono davanti e si fermano contro le ossa
            senza svegliare niente.
          pe: { atletica: 3 }
          effetti: { profondita.avv-zanna-rotta: 1 }
        fallimento:
          titolo: I sassi
          testo: |
            La frana parte con te sopra, e arrivi in fondo sedut{o|a} in mezzo a un rumore che fa tremare la
            nebbia, con le mani scorticate dalle schegge. L'orso alza la testa, e tu risali di corsa sulla
            cengia prima che si alzi anche il resto.
          effetti: { ferite: 0.5 }
      - testo: "Trovare la strada delle volpi"
        descrizione: "Gli animali della radura scendono da qualche parte. Le loro impronte lo dicono a chi le sa cercare."
        prova: { attributo: mentale, abilita: [natura, percezione], difficolta: Difficile }
        successo:
          titolo: La cornice delle volpi
          testo: |
            Trovi le impronte delle volpi su una cornice laterale, nascosta da uno sperone di roccia. Sono
            tante e hanno tutte le punte rivolte verso il basso, e segui la cornice fino al fondo della grotta
            un passo dopo l'altro.
          pe: { natura: 3 }
          effetti: { profondita.avv-zanna-rotta: 1 }
        fallimento:
          titolo: Mezzo piede
          testo: |
            La cornice delle volpi è fatta per le volpi. A metà si stringe tanto che resti appes{o|a} con
            mezzo piede sulla roccia, e un sasso che ti scivola da sotto il tallone cade nella luce grigia
            senza che tu lo senta arrivare in fondo. Torni indietro con la schiena contro la parete.
          effetti: { tormento: 0.5 }
      - testo: "Scendere un appiglio alla volta, con calma"
        descrizione: "Senza fretta la parete si scende. Il tempo, però, lo paghi con le braccia."
        costo: 3
        esito:
          titolo: Con calma
          testo: |
            Scendi la parete con tanta calma che quando arrivi in fondo hai perso il conto delle ore, perché
            la luce grigia della grotta è rimasta uguale dal primo appiglio all'ultimo. Le braccia ti tremano
            fino alle spalle.
          effetti: { profondita.avv-zanna-rotta: 1, ferite: 0.5 }

  # ------------------------------------------------------------ 10 · il cuore, Mezzaluna
  - id: avv-zanna-rotta-mezzaluna
    immagine: icone/fangs
    titolo: Mezzaluna
    sommario: "Sul fondo della grotta sotto la scarpata dorme un orso grigio enorme, con una cresta di cristalli sulla schiena. Ha una mezzaluna del colore del ferro sul petto."
    luogo: La pista grigia, la tana sotto la scarpata
    area: avv-zanna-rotta
    requisiti: [avventura.zanna-rotta == 6, profondita.avv-zanna-rotta >= 10]
    testo: |
      Da vicino l'orso è lungo quanto un carro. Dorme sul fianco, raggomitolato intorno alla spaccatura, e la
      nebbia gli passa nel pelo prima di riempire la grotta. Dalla schiena gli esce una cresta di punte
      grigie, e altre punte gli scendono dalla pancia nella spaccatura come radici. Dove le punte bucano la
      pelle il pelo è caduto in un cerchio netto, e la pelle intorno è liscia e senza una cicatrice. La luce
      delle punte batte piano come il cristallo di Rinaldo, più lenta del respiro dell'orso.

      L'orso apre gli occhi e si alza sulle zampe di dietro fino a sfiorare la volta. Le punte della pancia
      restano piantate nella spaccatura e si tendono fino a scricchiolare. Sul petto ha una macchia a forma di
      mezzaluna che una volta era bianca e adesso è color ferro.

      *Mezzaluna.* Ti torna in mente Dolovan che ti diceva di guardare in alto ogni tanto.

      {natura Difficile} L'orso e la sacca sono una cosa sola, e le radici di cristallo lo tengono attaccato
      alla spaccatura. Dove la cresta esce dalla spalla destra i cristalli sono più sottili, quasi
      trasparenti.

      {armi-da-mischia Media} Un orso in piedi si colpisce dal basso, sotto la zampa. Su uno spiedo con la
      traversa la bestia si infila da sola, e la traversa la ferma prima che arrivi a te.
    opzioni:
      - testo: "Affrontare Mezzaluna"
        descrizione: "Un orso grande come un carro, con la Marea nel sangue e una cresta di cristalli sulla schiena. È lento a girarsi, e quando colpisce lo fa una volta sola."
        combattimento: avv-zanna-rotta-mezzaluna
        vittoria:
          titolo: La cresta spenta
          testo: |
            Mezzaluna cade in avanti sulla spaccatura, e la cresta si spegne punta dopo punta, dalla spalla ai
            fianchi. La nebbia smette di salire. Resta ferma a mezz'aria per un pezzo, poi scende nella crepa
            come l'acqua in uno scolo.

            Ci metti metà del giorno a scuoiarlo con il coltello, e fra le ossa raccogli le punte di cristallo
            che si sono staccate. Sono spente e pesano meno del vetro. Quando esci dalla spaccatura con la
            pelle sulle spalle il branco della scarpata è sparito, e la Foresta Strisciante ha di nuovo
            l'odore della resina.
          effetti: { avventura.zanna-rotta: 1, cristalli.frammento-esausto: 3 }
          vai: citta-bassa
        sconfitta:
          titolo: La zampa di traverso
          testo: |
            Mezzaluna ti prende con una zampa di traverso, come ha preso il mulo, e ti butta contro la parete
            della grotta. Risali la frana a quattro zampe e scappi per la galleria, con l'orso che ti soffia
            dietro senza seguirti. Le costole dalla parte della zampata ti fanno male a ogni respiro. Alla
            strada di Laresh arrivi a notte fonda, e alla Zanna Rotta all'alba.
          effetti: { tormento: 1 }
          vai: citta-bassa
      - testo: "Spezzare la cresta sulla spalla"
        descrizione: "Dove la cresta esce dalla spalla destra i cristalli sono sottili. Se si spezzano lì, l'orso perde la sacca, e la sacca perde l'orso."
        prova: { attributo: mentale, abilita: [tecnologia, magia], difficolta: Difficile }
        successo:
          titolo: La spalla destra
          testo: |
            Aspetti che si giri verso di te e gli passi sotto la zampa, fino alla spalla destra. Colpisci la
            base della cresta con il pomo, dove i cristalli sono sottili come il vetro di una finestra, e al
            terzo colpo si spezzano tutti insieme con una nota acuta che ti resta nei denti. Mezzaluna si
            siede sulle zampe di dietro come un cane stanco, poi si corica sulla spaccatura e non si rialza.
            Intorno a lui la nebbia scende nella crepa e non sale più.

            Ci metti metà del giorno a scuoiarlo, e fra le ossa raccogli le punte di cristallo spente. Quando
            esci con la pelle sulle spalle, la Foresta Strisciante ha di nuovo l'odore della resina.
          pe: { tecnologia: 5 }
          effetti: { avventura.zanna-rotta: 1, cristalli.frammento-esausto: 3 }
          vai: citta-bassa
        fallimento:
          titolo: La cresta tiene
          testo: |
            Colpisci la cresta, e la cresta tiene. Mezzaluna si gira con tutto il corpo e ti prende di
            striscio con la zampa, e la scossa dei cristalli ti attraversa da parte a parte. Scappi su per la
            frana e per la galleria con una mano che non riesce più a chiudersi, e alla Zanna Rotta arrivi
            all'alba.
          effetti: { ferite: 2, contaminazione: 1 }
          vai: citta-bassa
      - testo: "Piantare lo spiedo e aspettare la carica"
        descrizione: "Lo spiedo di Dolovan è fatto per questo. Il calcio nella terra, la punta sotto il petto, e la bestia fa il resto, se le gambe ti tengono."
        requisiti: [avv-zanna-rotta.spiedo >= 1]
        prova: { attributo: fisico, abilita: [armi-da-mischia, atletica], difficolta: Difficile }
        successo:
          titolo: La traversa
          testo: |
            Pianti il calcio dello spiedo fra due sassi e lo tieni con tutte e due le mani, la punta
            all'altezza della mezzaluna. Mezzaluna ti viene addosso in piedi, e la punta gli entra sotto il
            petto fino alla traversa. Il manico si piega senza spezzarsi e ti scricchiola fra le mani. Resti
            sotto di lui con il suo fiato in faccia, che sa di aria dopo un fulmine, finché smette di muoversi
            e la cresta si spegne punta dopo punta.

            Ci metti metà del giorno a scuoiarlo. Quando esci dalla spaccatura con la pelle e lo spiedo sulle
            spalle, la Foresta Strisciante ha di nuovo l'odore della resina.
          pe: { armi-da-mischia: 5 }
          effetti: { avventura.zanna-rotta: 1, cristalli.frammento-esausto: 3 }
          vai: citta-bassa
        fallimento:
          titolo: Lo spiedo perso
          testo: |
            Lo spiedo scivola sul sasso nel momento in cui Mezzaluna arriva, e la punta gli entra nella spalla
            invece che nel petto. Lui ti strappa il manico dalle mani con una zampata e ti butta lontano, in
            mezzo alle ossa. Mentre risali la frana senti il manico che sbatte contro la roccia a ogni passo
            dell'orso. Scappi senza lo spiedo, e alla Zanna Rotta arrivi all'alba a dirlo a Dolovan.
          effetti: { ferite: 2, tormento: 0.5 }
          imposta: { avv-zanna-rotta.spiedo: 0 }
          vai: citta-bassa
