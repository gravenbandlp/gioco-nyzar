# L'oggetto di grado 4 della notte della Zanna Rotta: la pelliccia di Mezzaluna, che Dolovan Stroud fa conciare alla
# Conceria Kasselt (epilogo, storia.yaml). Budget: dadi 2 + Schermata 2 + Ostinata 1 = 5 punti, su grado 4 più un
# difetto (Inquieta: il pelo si alza da solo, e dopo ogni scontro lascia mezzo Tormento).
oggetti:
  - id: avv-zanna-rotta-pelliccia-di-mezzaluna
    nome: Pelliccia di Mezzaluna
    immagine: icone/animal-hide
    descrizione: "Una giubba lunga di cuoio con il pelo grigio di Mezzaluna rivoltato fuori, cucita da Gunter Kasselt in persona. La Marea che l'orso ha bevuto per anni ci gira ancora dentro, e quella che arriva da fuori si ferma sul pelo. Di notte, e quando il sangue si scalda, il pelo si drizza da solo."
    slot: armatura
    base: cuoio-rinforzato
    grado: 4
    dadi: 2
    proprieta: { schermata: true, ostinata: true }
    difetti: [inquieta]
