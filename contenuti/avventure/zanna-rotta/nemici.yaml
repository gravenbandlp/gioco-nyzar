# I nemici e gli scontri della notte della Zanna Rotta. Tarati con `npx tsx scripts/simula-fine.ts avv-zanna-rotta-`
# sul profilo «fine contenuti» (docs/piano-avventure.md): la bestia 83%, il cervo 76%, la lupa 74%, il tasso 76%,
# Mezzaluna 44% (contro «fine capitolo» i gregari stanno fra il 17 e il 30%, Mezzaluna al 3%).
# - La bestia della Zanna Rotta: Rinaldo Gessi di notte, nella stalla (passo 4 → 5). Va battuta, non uccisa.
# - Nella spedizione: il cervo dalle corna di vetro (4-6), la lupa della scarpata (7-8), il tasso della galleria (7-9).
# - Il cuore: Mezzaluna, l'orso grigio che dorme sulla sacca (boss, una fase).
nemici:
  - id: avv-zanna-rotta-la-bestia
    immagine: icone/wolf-head
    nome: La bestia della Zanna Rotta
    descrizione: "Grigia e irsuta, grande come un vitello, con il muso lungo e le mani ancora mezze mani. Ha la forza di un orso giovane e non sa di averla, e la camicia da notte le pende strappata da una spalla."
    attacco: 5
    difesa: 5
    difesaMentale: 3
    pf: 12
    danno: 5
    riduzione: 3
    iniziativa: 3

  - id: avv-zanna-rotta-cervo
    immagine: icone/deer
    nome: Cervo dalle corna di vetro
    descrizione: "Un cervo rosso adulto toccato dalla sacca, con il pelo del collo grigio e le corna diventate di vetro, che dentro hanno la luce della vena. Carica basso, e il vetro taglia come una lama."
    attacco: 6
    difesa: 4
    difesaMentale: 3
    pf: 13
    danno: 5
    riduzione: 3
    iniziativa: 3
    tratti: [animale]

  - id: avv-zanna-rotta-lupa
    immagine: icone/wolf-howl
    nome: La lupa della scarpata
    descrizione: "La capobranco dei lupi che dormono davanti alla spaccatura, grande quanto un vitello, con il pelo grigio come la nebbia. Gira intorno a chi le sta davanti e morde da dietro."
    attacco: 6
    difesa: 4
    difesaMentale: 3
    pf: 13
    danno: 5
    riduzione: 3
    iniziativa: 4
    tratti: [animale]

  - id: avv-zanna-rotta-tasso
    immagine: icone/sniffing-dog
    nome: Tasso della galleria
    descrizione: "Un tasso grande quanto un maiale, con le strisce del muso grigie come il ferro e le unghie lunghe un dito. Quello che prende con i denti non lo lascia più."
    attacco: 6
    difesa: 4
    difesaMentale: 3
    pf: 14
    danno: 5
    riduzione: 3
    iniziativa: 2
    tratti: [animale]

  - id: avv-zanna-rotta-mezzaluna
    immagine: icone/fangs
    nome: Mezzaluna
    descrizione: "Un orso vecchio ed enorme, lungo quanto un carro, che la Marea ha fatto grigio. Dalla schiena gli esce una cresta di cristalli che scende nella sacca come una radice, e sul petto ha una mezzaluna del colore del ferro."
    attacco: 6
    difesa: 3
    difesaMentale: 4
    pf: 24
    danno: 4
    riduzione: 5
    iniziativa: 2
    tratti: [animale]

scontri:
  - { id: avv-zanna-rotta-la-bestia, nome: "La bestia nella stalla", nemici: [avv-zanna-rotta-la-bestia], feriteSconfitta: 2 }
  - { id: avv-zanna-rotta-il-cervo, nome: "Il cervo dalle corna di vetro", nemici: [avv-zanna-rotta-cervo], feriteSconfitta: 2 }
  - { id: avv-zanna-rotta-la-lupa, nome: "La lupa della scarpata", nemici: [avv-zanna-rotta-lupa], feriteSconfitta: 2 }
  - { id: avv-zanna-rotta-il-tasso, nome: "Il tasso della galleria", nemici: [avv-zanna-rotta-tasso], feriteSconfitta: 2 }
  - { id: avv-zanna-rotta-mezzaluna, nome: "Mezzaluna", nemici: [avv-zanna-rotta-mezzaluna], feriteSconfitta: 3 }
