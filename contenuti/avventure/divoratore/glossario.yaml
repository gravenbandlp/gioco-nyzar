# Le voci del glossario dell'Avventura del Divoratore: i nomi nuovi, da approvare con Luca. Presentazioni stabili,
# senza i fatti della storia. Restano senza voce i luoghi minori (la grotta dei letti, la tana, la campana delle ore)
# e le figure di Tuarmir che c'erano già (il fabbro, Tamme e Dilla).
glossario:
  - id: divoratore
    nome: Divoratore
    tipo: creatura
    sottotitolo: "Il verme delle storie di Tuarmir"
    testo: "Il verme delle storie dei vecchi di Tuarmir, largo quanto la scala grande e cieco, che mangia la roccia da sotto e lascia gallerie rotonde con le pareti di vetro. A Tuarmir il suo nome non si dice a voce alta. Secondo Dilla ha mangiato le case più basse del villaggio quando sua nonna era bambina."

  - id: strozza
    nome: Strozza
    tipo: luogo
    sottotitolo: "La strettoia della gola di Tuarmir"
    testo: "Il punto, sotto le ultime case di Tuarmir, dove le due pareti della gola quasi si toccano e il sentiero per la gola di sotto passa fra due piloni di roccia nera. I vecchi del villaggio ci accesero fuochi per sette giorni, al tempo della nonna di Dilla, e la roccia spaccata chiuse le tane del Divoratore."

  - id: rodipietra
    nome: rodipietra
    tipo: creatura
    sottotitolo: "Vermi delle gallerie sotto Tuarmir"
    testo: "Vermi grigi grandi come un cane da pastore, con la bocca rotonda piena di dentini piatti. Seguono il Divoratore nelle sue gallerie e mangiano la roccia mezza digerita che lui si lascia dietro, e quando la roccia finisce assaggiano quello che trovano. Sono lenti a voltarsi e testardi a inseguire."

  - id: velia-stracca
    nome: Velia Stracca
    alias: [Velia]
    tipo: personaggio
    sottotitolo: "Raschiatrice delle cariche"
    testo: "Raschiatrice magra della squadra di Dragna Gro-Malog, che prepara le cariche da frana con cui i Raschiatori si chiudono alle spalle i cunicoli che cedono. Alla mano sinistra le restano tre dita, e ci conta le cariche una per una. Annoda la miccia in un modo suo, che fa bruciare la fiamma in due direzioni."
