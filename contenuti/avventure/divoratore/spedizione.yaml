# La spedizione dell'Avventura del Divoratore (avventura.divoratore == 5): le gallerie del verme sotto Tuarmir. Si
# entra dalla tana in fondo alla grotta grande (`avv-divoratore-la-tana`, presso Tuarmir); la ritirata riporta in
# Superficie. La profondità conta le cariche piazzate: una stanza superata è una carica legata alla miccia maestra, e
# al cuore ce ne sono dieci. Una stanza superata non ricompare nella stessa visita. Le fasce:
# - 0-2 (le cariche 1-3), le gallerie vecchie, prove Medie e Difficili: la casa mangiata (la via di Tamme, con
#   avv-divoratore.tane), la cisterna, le pareti di vetro, lo sciame nelle crepe.
# - 3-4 (le cariche 4-5), le gallerie fresche e calde, prove Difficili: il caldo, la bava, i rodipietra, il bivio
#   caldo (la lancia del Pettine apre una via Media).
# - 5 (la sesta carica), la svolta, non ripetibile e unica a quella profondità: il Divoratore passa a pochi palmi
#   (la campana di Maela, con avv-divoratore.campana, apre una via Media).
# - 6-9 (le cariche 7-10), la Strozza, prove Difficili con una Molto difficile o uno scontro per stanza: i piloni (i
#   cunei del fabbro, con avv-divoratore.ferri, aprono una via Media), il soffitto sottile, la pozza calda, la frana
#   dei vecchi, la fuga dello sciame. La fascia ha una stanza in più perché copre quattro profondità.
# Ogni stanza ha una via senza prova da 2 rintocchi con ½ negativa (3 rintocchi nella Strozza); chi fallisce prende
# almeno ½ negativa e non scende.
# Il cuore a 10 è la Strozza, tre prove Difficili di fila: `avv-divoratore-la-strozza` (accendere la miccia quando la
# testa è sotto i piloni; una via in più secondo avv-divoratore.cariche), il seguito `avv-divoratore-la-bocca` (la
# testa sfonda la galleria fra te e il camino: lo scontro con la bocca o una via Difficile) e il seguito
# `avv-divoratore-il-camino` (uscire prima che la Strozza crolli). Chi fallisce una qualunque delle tre torna in
# Superficie con Ferite e Tormento, e le cariche sono da rifare; chi vince porta la pista a 6.
aree:
  - id: avv-divoratore
    immagine: ambientazione/regno-profondo
    nome: Le gallerie del Divoratore
    sommario: "Sotto Tuarmir la roccia è piena di gallerie rotonde. Quelle scavate ai tempi della nonna di Dilla sono fredde da generazioni, e le nuove scottano ancora."
    spedizione: { ritorno: superficie-fratturata, soglia: 10, stanze: 3 }
    testo: |
      Dietro la tana la roccia di Tuarmir è bucata come una forma di formaggio.
      Le gallerie sono rotonde e larghe quanto la scala grande, con le pareti
      lisce, e scendono in curve lente verso il fondo della gola. Quelle vecchie
      sono fredde e asciutte, piene della polvere di generazioni. Le nuove
      invece sono calde al tatto, e lucide come l'interno di una brocca.

      Ogni tanto il pavimento trema, e il colpo arriva sempre da più in basso di
      dove sei. Sulla schiena porti la gerla delle cariche, e la miccia maestra
      si srotola dietro di te dalla cintura, un passo alla volta.

colonna:
  - { contesto: area, id: avv-divoratore, musica: desolate-march, ambiente: mines }

storylet:
  # ------------------------------------------------------------ l'ingresso, in fondo alla grotta grande
  - id: avv-divoratore-la-tana
    presso: tuarmir
    immagine: icone/cave-entrance
    titolo: La tana
    sommario: "In fondo alla grotta grande, dietro le ceste vuote, un muro a secco chiude un buco rotondo nella roccia. Da lì si scende con le cariche."
    luogo: Tuarmir, la grotta grande, dietro le ceste
    area: superficie-fratturata
    requisiti: [avventura.divoratore == 5]
    testo: |
      La grotta grande è vuota, con le ceste impilate contro le pareti e le
      lanterne spente. In fondo, dietro l'ultima pila, c'è la tana. È un buco
      rotondo nella roccia, alto due volte un uomo, chiuso da un muro a secco
      che nessuno ricorda di aver visto costruire, con le pietre più basse
      annerite dal fuoco. Dalle fessure esce l'aria tiepida della crepa sulla
      scala grande. Il villaggio lo rimura ogni volta che qualcuno ci passa,
      perché il verme non salga da lì.

      Hai le dieci cariche in una gerla sulla schiena e il rotolo della miccia
      alla cintura. Una carica va dove le gallerie vecchie incontrano le nuove,
      le altre lungo la strada, e le ultime sotto la Strozza, tutte legate alla
      stessa miccia. Stanotte le scosse si sono allontanate verso il fondo, e
      Maela, che le conta, dice che il verme è sceso a mangiare. Le cariche
      devono essere tutte al loro posto prima che risalga.

      {natura Media} L'aria che esce dal muro sa di pietra scaldata, con un
      fondo acido da botte di aceto.

      Ilenia ti stringe la maschera dietro la nuca con due giri di nodo e resta
      sulla soglia della grotta grande, con la lanterna alzata sopra la testa.
    opzioni:
      - testo: "Smontare il muro dall'alto, pietra per pietra"
        descrizione: "Un muro a secco si smonta come si è fatto, dall'ultima pietra messa. Se si sbaglia l'ordine, viene giù tutto."
        prova: { attributo: mentale, abilita: [percezione, tecnologia], difficolta: Media }
        successo:
          titolo: L'ultima pietra
          testo: |
            Togli le pietre dall'alto una alla volta e le passi a Ilenia, che le
            impila contro la parete senza un rumore. Quando il varco è largo
            quanto le tue spalle ci scavalchi dentro con la gerla. Dall'altra
            parte la galleria scende, e l'aria è più calda.
          pe: { percezione: 2 }
          vai: avv-divoratore
        fallimento:
          titolo: Il muro sui piedi
          testo: |
            Sfili la pietra sbagliata, e metà del muro ti viene giù sugli
            stivali. Ilenia ti aiuta a liberare i piedi senza dire una parola.
            Scavalchi le macerie zoppicando, con la gerla che ti tira
            all'indietro.
          effetti: { ferite: 0.5 }
          vai: avv-divoratore
      - testo: "Sfondare il muro con la spalla"
        descrizione: "Le pietre sono vecchie e la malta non c'è. Basta colpire nel punto giusto, e colpire forte."
        prova: { attributo: fisico, abilita: [atletica, rissa], difficolta: Media }
        successo:
          titolo: La spalla
          testo: |
            Al secondo colpo il muro si apre al centro e le pietre rotolano
            dentro la tana, giù per la galleria, finché smetti di sentirle.
            Ilenia alza la lanterna e guarda il buco. Tu ti sistemi la gerla e
            scendi.
          pe: { atletica: 2 }
          vai: avv-divoratore
        fallimento:
          titolo: La pietra che rimbalza
          testo: |
            Il muro cede al terzo colpo, e una pietra ti rimbalza sulla
            clavicola. Entri nella tana con il braccio che formicola fino alle
            dita, e per un pezzo la gerla la porti su una spalla sola.
          effetti: { ferite: 0.5 }
          vai: avv-divoratore
      - testo: "Togliere la pietra che diceva Tamme"
        descrizione: "Sua nonna raccontava che nel muro della tana c'è una pietra con una tacca, messa per ultima, che regge tutte le altre."
        requisiti: [avv-divoratore.tane >= 1]
        costo: 0
        esito:
          titolo: La pietra con la tacca
          testo: |
            Trovi la pietra con la tacca all'altezza del ginocchio, dove diceva
            Tamme. La sfili con le due mani, e il muro si apre in mezzo da solo,
            con le pietre che scivolano ai lati e lasciano un varco pulito.
            Scendi nella tana senza aver fatto rumore.
          vai: avv-divoratore
      - testo: "Aspettare il fabbro con il palanchino"
        descrizione: "Il fabbro ha un palanchino lungo quanto lui. Dalla piana alla grotta grande però ci vuole mezza giornata."
        costo: 2
        esito:
          titolo: Il palanchino
          testo: |
            Aspetti seduto sulle ceste, con l'aria tiepida della tana sulla
            faccia e le scosse che vanno e vengono sotto i piedi. Il fabbro
            arriva a metà pomeriggio e apre il muro in tre colpi di palanchino.
            Quando entri, hai addosso la stanchezza di una giornata intera.
          effetti: { tormento: 0.5 }
          vai: avv-divoratore

  # ------------------------------------------------------------ 0-2 · la casa mangiata
  - id: avv-divoratore-la-casa-mangiata
    immagine: ambientazione/tuarmir
    titolo: La casa mangiata
    sommario: "Nella parete della galleria si apre mezza casa-grotta, tagliata in due dal verme ai tempi della nonna di Dilla."
    luogo: Le gallerie del Divoratore, la casa mangiata
    area: avv-divoratore
    ripetibile: true
    requisiti: [avventura.divoratore == 5, profondita.avv-divoratore <= 2]
    testo: |
      Nella parete di sinistra della galleria si apre mezza stanza. È una
      casa-grotta tagliata in due dal verme, con il focolare annerito, una
      nicchia con tre scodelle di legno impilate e un letto di pietra di cui
      resta la testata. L'altra metà della casa non c'è più. Sopra il focolare,
      in alto, la galleria si divide in due bocche, e la carica va proprio lì,
      dove si separano.

      {accademiche Media} Sono le case più basse del villaggio vecchio, quelle
      che la nonna di Dilla ha visto mangiare. Chi ci abitava è scappato senza
      portarsi via le scodelle.
    opzioni:
      - testo: "Arrampicarti sulla cappa del focolare"
        descrizione: "La cappa è di pietra e sale fino alle due bocche. È vecchia, e la fuliggine scivola."
        prova: { attributo: fisico, abilita: atletica, difficolta: Media }
        successo:
          titolo: Sopra il focolare
          testo: |
            Sali sulla cappa con le mani nere di fuliggine e incastri la carica
            nella forcella, dove le due bocche si separano. Leghi la miccia con
            due giri e un nodo, e scendi dal letto di pietra.
          pe: { atletica: 2 }
          effetti: { profondita.avv-divoratore: 1 }
        fallimento:
          titolo: La cappa
          testo: |
            A metà salita la cappa si sbriciola sotto le dita, e cadi nel
            focolare in una nuvola di cenere vecchia. Ti rialzi tossendo, nero
            dalla testa ai piedi, con un ginocchio sbucciato.
          effetti: { ferite: 0.5 }
      - testo: "Cercare la scala della casa"
        descrizione: "Le case-grotta hanno sempre una stanza di sopra. Se c'era una scala, adesso porta alle bocche."
        prova: { attributo: mentale, abilita: [percezione, accademiche], difficolta: Difficile }
        successo:
          titolo: I gradini dietro il letto
          testo: |
            Dietro la testata del letto trovi dei gradini scavati nella parete,
            consumati al centro da piedi di altri tempi. Portano a un buco che
            una volta era una porta, e il buco si apre sulla forcella. Leghi la
            carica alla miccia stando seduto sulla soglia.
          pe: { percezione: 2 }
          effetti: { profondita.avv-divoratore: 1 }
        fallimento:
          titolo: La nicchia vuota
          testo: |
            Cerchi la scala per tutte e due le pareti e trovi soltanto la
            nicchia delle scodelle, e dietro le scodelle un pupazzo di paglia
            annerito. Lo rimetti dov'era, con una cura che non ti aspettavi.
          effetti: { tormento: 0.5 }
      - testo: "Prendere il passaggio che diceva Tamme"
        descrizione: "Nella casa della nonna, diceva Tamme, dietro la nicchia c'era un buco per le galline che portava di sopra."
        requisiti: [avv-divoratore.tane >= 1]
        costo: 1
        esito:
          titolo: Il buco delle galline
          testo: |
            Sposti le scodelle e dietro la nicchia c'è il buco, stretto, che
            sale di sbieco nella roccia. Ci passi strisciando con la gerla
            davanti a te e sbuchi sulla forcella. La carica la leghi con calma.
          effetti: { profondita.avv-divoratore: 1 }
      - testo: "Fare una scala con le pietre del letto"
        descrizione: "Il letto di pietra è a pezzi, e i pezzi si impilano. Pesano, e ci vuole tempo."
        costo: 2
        esito:
          titolo: La scala di pietre
          testo: |
            Impili i pezzi del letto contro la cappa finché arrivi alla
            forcella, e quando ci sali sopra la pila si sposta di un dito a ogni
            carica che leghi. Scendi con le mani spellate dalla pietra.
          effetti: { profondita.avv-divoratore: 1, ferite: 0.5 }

  # ------------------------------------------------------------ 0-2 · la cisterna
  - id: avv-divoratore-la-cisterna
    immagine: ambientazione/regno-profondo
    titolo: La cisterna
    sommario: "La galleria vecchia attraversa la cisterna del villaggio di una volta. Dalla volta l'acqua gocciola sulle cariche."
    luogo: Le gallerie del Divoratore, la cisterna
    area: avv-divoratore
    ripetibile: true
    requisiti: [avventura.divoratore == 5, profondita.avv-divoratore <= 2]
    testo: |
      La galleria passa nel mezzo di una cisterna scavata nella roccia dal
      villaggio vecchio, e il verme ci ha lasciato mezzo muro e una pozza nera
      che occupa tutto il pavimento. Dalla volta l'acqua gocciola piano, e dove
      cade fa cerchi che arrivano fino al muro. Dall'altra parte, sull'orlo
      della cisterna, c'è una mensola di pietra asciutta, e lì va la carica.

      {tecnologia Media} Una carica bagnata non scoppia, e una miccia bagnata si
      spegne a metà. Sulla mensola le gocce non arrivano.
    opzioni:
      - testo: "Fasciare la carica e appenderla alla volta"
        descrizione: "Nella gerla c'è la tela cerata. Una carica appesa in alto resta asciutta anche sotto le gocce."
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Media }
        successo:
          titolo: La carica appesa
          testo: |
            Avvolgi il coccio nella tela cerata, lo leghi a un chiodo piantato
            in una crepa della volta e fai passare la miccia lungo la parete,
            dove le gocce non arrivano. Quando te ne vai la carica dondola
            appena.
          pe: { tecnologia: 2 }
          effetti: { profondita.avv-divoratore: 1 }
        fallimento:
          titolo: La miccia nell'acqua
          testo: |
            Il nodo scivola, e la carica finisce nella pozza con mezzo braccio
            di miccia. La ripeschi, e la miccia è da buttare. La tagli e la
            rifai, con le mani che ti tremano per il freddo.
          effetti: { tormento: 0.5 }
      - testo: "Passare sull'orlo della cisterna fino alla mensola"
        descrizione: "L'orlo è largo un piede e coperto di muschio bagnato. Sotto, la pozza non si sa quanto è profonda."
        prova: { attributo: fisico, abilita: acrobazia, difficolta: Difficile }
        successo:
          titolo: L'orlo
          testo: |
            Passi sull'orlo con la gerla stretta al petto e la schiena contro il
            muro, un piede alla volta, e arrivi alla mensola con gli stivali
            asciutti. La carica resta lì, in un angolo dove la pietra è secca da
            generazioni.
          pe: { acrobazia: 2 }
          effetti: { profondita.avv-divoratore: 1 }
        fallimento:
          titolo: Nella pozza
          testo: |
            A metà dell'orlo il muschio ti scivola sotto il piede e finisci
            nella pozza fino al petto, con la gerla alzata sopra la testa.
            L'acqua è gelata. Torni indietro e strizzi i vestiti battendo i
            denti.
          effetti: { ferite: 0.5 }
      - testo: "Attraversare la pozza con la gerla sopra la testa"
        descrizione: "Non è profonda dappertutto. Si va piano, saggiando il fondo con il piede."
        costo: 2
        esito:
          titolo: L'acqua fino al petto
          testo: |
            Attraversi la pozza con l'acqua che sale fino al petto e la gerla
            sopra la testa. Arrivi alla mensola con le gambe che non senti più e
            la leghi lì, la carica, con le dita che non vogliono chiudersi.
          effetti: { profondita.avv-divoratore: 1, ferite: 0.5 }

  # ------------------------------------------------------------ 0-2 · le pareti di vetro
  - id: avv-divoratore-le-pareti-di-vetro
    immagine: icone/underground-cave
    titolo: Le pareti di vetro
    sommario: "La galleria scende ripida, e le pareti sono lisce e lucide come il vetro di una bottiglia."
    luogo: Le gallerie del Divoratore, la discesa di vetro
    area: avv-divoratore
    ripetibile: true
    requisiti: [avventura.divoratore == 5, profondita.avv-divoratore <= 2]
    testo: |
      Qui la galleria vecchia scende ripida verso il basso, e le pareti
      cambiano. La roccia è lucida e verdastra, liscia come il vetro di una
      bottiglia, e la lanterna ci si specchia dentro in cento punti. Il
      pavimento è dello stesso vetro e non ha un appiglio. In fondo, dove la
      discesa fa un gomito, la galleria vecchia ne incontra una più stretta, e
      la carica va nel gomito.

      {tecnologia Media} La roccia è stata fusa e poi si è raffreddata, come la
      scoria delle fornaci. Dove si è raffreddata in fretta è crepata a scaglie,
      e le scaglie fanno presa.
    opzioni:
      - testo: "Scendere di schiena, frenando con i talloni"
        descrizione: "Sul vetro si scivola comunque. Tanto vale scegliere come."
        prova: { attributo: fisico, abilita: acrobazia, difficolta: Media }
        successo:
          titolo: Di schiena
          testo: |
            Ti siedi con la gerla sul petto e scendi di schiena, frenando con i
            talloni e con i palmi, e ti fermi nel gomito con un piede contro la
            parete. Leghi la carica alla miccia ancora seduto.
          pe: { acrobazia: 2 }
          effetti: { profondita.avv-divoratore: 1 }
        fallimento:
          titolo: In fondo al gomito
          testo: |
            Il tallone ti scappa a metà discesa e arrivi nel gomito di spalle,
            sbattendo contro la parete. La carica nella gerla è intera. Per
            risalire a cercare un'altra strada, invece, ci metti un'ora.
          effetti: { ferite: 0.5 }
      - testo: "Rompere le scaglie e farti gli appigli"
        descrizione: "Dove il vetro è crepato si spacca con il pomo della lama. Un appiglio alla volta, fino al gomito."
        prova: { attributo: mentale, abilita: [tecnologia, natura], difficolta: Difficile }
        successo:
          titolo: Gli appigli
          testo: |
            Batti il pomo della lama dove le scaglie sono più fitte, e il vetro
            si apre in buchi grandi quanto un pugno. Scendi come su una scala, e
            nel gomito incastri la carica in uno dei buchi più fondi.
          pe: { tecnologia: 2 }
          effetti: { profondita.avv-divoratore: 1 }
        fallimento:
          titolo: Le schegge
          testo: |
            Batti dove il vetro è sano, e una scheggia ti salta in faccia e ti
            apre il sopracciglio. Il sangue ti cola nell'occhio, e per un pezzo
            vedi la galleria rossa.
          effetti: { ferite: 0.5 }
      - testo: "Calarti con la miccia di scorta"
        descrizione: "Nella gerla c'è un rotolo di miccia in più. Regge una persona, se la persona si muove piano."
        costo: 2
        esito:
          titolo: La miccia di scorta
          testo: |
            Leghi la miccia di scorta a uno spuntone in cima alla discesa e ti
            cali piano, mano dopo mano, mentre la corda incatramata scricchiola.
            Nel gomito leghi la carica, e la miccia di scorta la lasci lì,
            appesa, con le palme che bruciano.
          effetti: { profondita.avv-divoratore: 1, ferite: 0.5 }

  # ------------------------------------------------------------ 0-2 · lo sciame nelle crepe
  - id: avv-divoratore-lo-sciame-nelle-crepe
    immagine: icone/centipede
    titolo: Lo sciame nelle crepe
    sommario: "Le pareti della galleria vecchia sono piene di crepe, e dalle crepe esce un fiume di scolopendre bianche."
    luogo: Le gallerie del Divoratore, il tratto delle crepe
    area: avv-divoratore
    ripetibile: true
    requisiti: [avventura.divoratore == 5, profondita.avv-divoratore <= 2]
    testo: |
      In questo tratto la galleria vecchia è crepata dappertutto, e le crepe si
      muovono. Ne escono scolopendre bianche a centinaia, che salgono lungo le
      pareti verso la tana tutte nella stessa direzione, con un rumore di aghi
      sulla pietra. La crepa più larga, in basso, scende verso le gallerie
      nuove, e la carica va lì dentro. Davanti alla crepa ce ne sono due grandi
      come un braccio, ferme, con le antenne che cercano.

      {natura Media} Salgono verso il caldo e verso la luce. La lanterna, per
      loro, è un sole.
    opzioni:
      - testo: "Togliere di mezzo le due più grosse"
        descrizione: "Le piccole passano. Le grosse fanno la guardia alla crepa, e mordono."
        combattimento: avv-divoratore-lo-sciame
        vittoria:
          titolo: La crepa libera
          testo: |
            Le due grosse cadono una sull'altra davanti alla crepa, e le piccole
            ci passano sopra senza fermarsi. Infili la carica nella crepa con il
            braccio fino alla spalla e ne tiri fuori soltanto la miccia.
          pe: { armi-da-mischia: 2 }
          effetti: { profondita.avv-divoratore: 1 }
        sconfitta:
          titolo: Le antenne
          testo: |
            Le due grosse ti vengono addosso insieme, e lo sciame segue loro.
            Torni indietro di corsa scrollandoti le scolopendre dalle maniche,
            con i morsi che ti gonfiano le mani.
          effetti: { ferite: 0.5 }
      - testo: "Posare la lanterna e girare al buio"
        descrizione: "Se la luce le chiama, una lanterna posata lontano dalla crepa le porta via tutte."
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Media }
        successo:
          titolo: Il sole posato
          testo: |
            Posi la lanterna dieci passi più su, e lo sciame ci si ammucchia
            intorno come mosche sul miele, le due grosse per prime. Arrivi alla
            crepa al buio, con la mano sulla parete, e ci infili la carica. Poi
            torni a riprendere la lanterna con un bastone, piano.
          pe: { furtivita: 2 }
          effetti: { profondita.avv-divoratore: 1 }
        fallimento:
          titolo: Al buio
          testo: |
            Al buio metti la mano su una scolopendra invece che sulla parete, e
            lei ti morde il pollice. Riprendi la lanterna e torni indietro con
            la mano che si gonfia a vista d'occhio.
          effetti: { ferite: 0.5 }
      - testo: "Aspettare che lo sciame sia passato"
        descrizione: "Prima o poi finiscono. Nel frattempo passano anche sopra di te."
        costo: 2
        esito:
          titolo: Il fiume bianco
          testo: |
            Ti siedi contro la parete con le mani sotto le ascelle e lasci che
            lo sciame ti passi sopra le gambe e le spalle finché la galleria è
            vuota. Poi infili la carica nella crepa, e per un'ora ti senti le
            zampe addosso anche dove non ce ne sono.
          effetti: { profondita.avv-divoratore: 1, tormento: 0.5 }

  # ------------------------------------------------------------ 3-4 · il caldo
  - id: avv-divoratore-il-caldo
    immagine: ambientazione/regno-profondo
    titolo: Il caldo
    sommario: "Le gallerie nuove sono calde come il fianco di un forno, e la cera della miccia comincia a colare."
    luogo: Le gallerie del Divoratore, le gallerie fresche
    area: avv-divoratore
    ripetibile: true
    requisiti: [avventura.divoratore == 5, profondita.avv-divoratore >= 3, profondita.avv-divoratore <= 4]
    testo: |
      Qui comincia la roccia di questa stagione. Le pareti sono ancora lucide di
      qualcosa che si sta asciugando, e calde come il fianco di un forno. Dal
      pavimento sale un vapore sottile. Il sudore ti cola negli occhi da sotto
      la maschera, e la cera della miccia, sul rotolo, comincia a farsi molle.
      Tre passi dentro la parete, in una crepa dove il caldo è più forte, c'è il
      punto in cui la galleria nuova taglia quella vecchia.

      {medicina Media} Il caldo secco ti asciuga la bocca prima di farti sudare.
      Chi resta qui senza bere, fra un'ora sbaglia i nodi.
    opzioni:
      - testo: "Restare nella crepa finché la carica è legata"
        descrizione: "Tre passi nel punto più caldo. Il resto è sopportare."
        prova: { attributo: fisico, abilita: resistenza, difficolta: Difficile }
        successo:
          titolo: Nel forno
          testo: |
            Entri nella crepa con la faccia girata dall'altra parte e leghi la
            carica alla miccia senza fretta, un nodo alla volta, con le dita che
            scottano. Quando esci la maschera ti si è incollata alla faccia, e
            la stacchi piano.
          pe: { resistenza: 2 }
          effetti: { profondita.avv-divoratore: 1 }
        fallimento:
          titolo: La pelle delle mani
          testo: |
            Al secondo nodo le dita non ti obbediscono più, e la carica ti
            scivola di mano. La riprendi al volo e scappi fuori dalla crepa con
            le palme arrossate, e la carica è ancora nella gerla.
          effetti: { ferite: 0.5 }
      - testo: "Avvolgere la miccia nel muschio bagnato"
        descrizione: "Il muschio di gola tiene l'acqua per giorni. Hai la maschera piena di muschio, e una borraccia."
        prova: { attributo: mentale, abilita: [natura, tecnologia], difficolta: Difficile }
        successo:
          titolo: Il muschio di Tuarmir
          testo: |
            Bagni il muschio con mezza borraccia e lo avvolgi intorno alla
            miccia per tutto il tratto della crepa. La cera smette di colare, e
            la carica la leghi con calma. Del villaggio, quaggiù, hai addosso
            l'odore.
          pe: { natura: 2 }
          effetti: { profondita.avv-divoratore: 1 }
        fallimento:
          titolo: Il muschio secco
          testo: |
            Il muschio si asciuga prima che tu abbia finito di avvolgerlo, e la
            miccia cola lo stesso. Torni indietro a rifarla con la borraccia
            vuota, e la gola ti brucia per tutto il tempo.
          effetti: { ferite: 0.5 }
      - testo: "Tornare alla cisterna a bagnarti e riprovare"
        descrizione: "La cisterna è più su, e l'acqua è fredda. Andare e tornare costa tempo."
        costo: 2
        esito:
          titolo: Avanti e indietro
          testo: |
            Risali fino alla cisterna, ti bagni da capo a piedi e torni giù di
            corsa, finché la carica è legata. Al terzo viaggio hai le gambe di
            legno e i vestiti che fumano.
          effetti: { profondita.avv-divoratore: 1, ferite: 0.5 }

  # ------------------------------------------------------------ 3-4 · la bava
  - id: avv-divoratore-la-bava
    immagine: ambientazione/marea-grigia
    titolo: La bava
    sommario: "Il pavimento della galleria nuova è coperto da una bava grigia che fuma dove tocca il cuoio."
    luogo: Le gallerie del Divoratore, il tratto della bava
    area: avv-divoratore
    ripetibile: true
    requisiti: [avventura.divoratore == 5, profondita.avv-divoratore >= 3, profondita.avv-divoratore <= 4]
    testo: |
      Il pavimento è coperto da una bava grigia alta fino alla caviglia, che il
      verme si è lasciato dietro passando. L'aria pizzica gli occhi e sa di
      aceto. La prima volta che ci metti il piede la suola dello stivale fuma, e
      quando lo tiri fuori il cuoio è diventato molle come carta bagnata. La
      roccia delle pareti, qui, si lascia graffiare con un'unghia, e la carica
      ci entra come in una forma di cacio. Il punto giusto è venti passi più
      avanti.

      {natura Difficile} Il verme la sputa per ammorbidire la roccia prima di
      mangiarla. La bava lavora piano sulla pietra e in fretta sulla pelle.
    opzioni:
      - testo: "Camminare sul gradino lungo la parete"
        descrizione: "Dove la parete incontra il pavimento la bava è più sottile. Si cammina di traverso, su un dito di pietra."
        prova: { attributo: fisico, abilita: acrobazia, difficolta: Difficile }
        successo:
          titolo: Di traverso
          testo: |
            Cammini di traverso sul gradino con le mani piatte contro la parete,
            e la bava ti passa a un dito dalle suole per venti passi. Spingi la
            carica nella roccia molle fino al gomito e torni indietro allo
            stesso modo.
          pe: { acrobazia: 2 }
          effetti: { profondita.avv-divoratore: 1 }
        fallimento:
          titolo: La caviglia nella bava
          testo: |
            Al decimo passo il piede ti scivola giù dal gradino, e la bava ti
            entra nello stivale. Torni indietro saltellando e ti strappi lo
            stivale di dosso. Sotto, la pelle è rossa e lucida.
          effetti: { ferite: 1 }
      - testo: "Spegnere la bava con la sabbia delle cariche"
        descrizione: "Le cariche sono chiuse nella sabbia. La sabbia beve, e quello che beve smette di mangiare."
        prova: { attributo: mentale, abilita: [natura, medicina], difficolta: Difficile }
        successo:
          titolo: La sabbia
          testo: |
            Svuoti nella bava la sabbia di riserva della gerla, una manciata
            davanti all'altra, e la bava si rapprende in una crosta su cui si
            cammina. Arrivi al punto giusto e pianti la carica, poi torni
            indietro sulla tua stessa crosta.
          pe: { natura: 2 }
          effetti: { profondita.avv-divoratore: 1 }
        fallimento:
          titolo: La sabbia che affonda
          testo: |
            La sabbia affonda nella bava senza fermarla, e quando te ne accorgi
            sei già con un piede dentro. Torni indietro di corsa, con la gamba
            dei calzoni che si sfilaccia mentre cammini.
          effetti: { ferite: 1 }
      - testo: "Passare dritto, e pazienza per gli stivali"
        descrizione: "Venti passi nella bava, e poi venti per tornare. Gli stivali non arrivano alla fine."
        costo: 2
        esito:
          titolo: Senza stivali
          testo: |
            Passi dritto nella bava più in fretta che puoi e pianti la carica. A
            metà del ritorno le suole ti si staccano, e fai il resto della
            galleria con i piedi fasciati negli stracci.
          effetti: { profondita.avv-divoratore: 1, ferite: 0.5 }

  # ------------------------------------------------------------ 3-4 · i rodipietra
  - id: avv-divoratore-i-rodipietra
    immagine: icone/earth-worm
    titolo: I rodipietra
    sommario: "In uno slargo della galleria fresca due vermi grandi come cani mangiano la roccia che il Divoratore ha lasciato."
    luogo: Le gallerie del Divoratore, lo slargo dei rodipietra
    area: avv-divoratore
    ripetibile: true
    requisiti: [avventura.divoratore == 5, profondita.avv-divoratore >= 3, profondita.avv-divoratore <= 4]
    testo: |
      La galleria si allarga in uno slargo dove il pavimento è coperto di mucchi
      di pasta grigia, la roccia che il Divoratore ha mezzo digerito e lasciato
      indietro. Due vermi grigi grandi come cani da pastore ci affondano la
      bocca rotonda e mangiano con un rumore di macina piccola. Quando la
      lanterna li tocca alzano la testa tutti e due, insieme. La carica va
      dietro di loro, dove lo slargo si stringe di nuovo.

      {rissa Media} Sono lenti a voltarsi e la testa la tengono bassa. Il punto
      morbido è dietro la bocca, dove il collo si piega.
    opzioni:
      - testo: "Affrontarli prima che si muovano"
        descrizione: "Due rodipietra, con i dentini piatti e la pelle dura come cuoio vecchio."
        combattimento: avv-divoratore-i-rodipietra
        vittoria:
          titolo: Lo slargo vuoto
          testo: |
            Il secondo rodipietra si arrotola su se stesso e smette di muoversi
            sopra il suo mucchio di pasta grigia. Passi in mezzo ai due e pianti
            la carica dove lo slargo si stringe, con le braccia che ancora ti
            tremano.
          pe: { armi-da-mischia: 2 }
          effetti: { profondita.avv-divoratore: 1 }
        sconfitta:
          titolo: I dentini
          testo: |
            Uno ti prende il polpaccio con la bocca rotonda e stringe, e i
            dentini piatti ti macinano lo stivale. Te lo scrolli di dosso e
            torni indietro fino al caldo della galleria, con la gamba che
            sanguina.
          effetti: { ferite: 0.5 }
      - testo: "Passare lungo la parete mentre mangiano"
        descrizione: "Hanno la testa nella pasta grigia. Finché mangiano, sentono soltanto la loro bocca."
        prova: { attributo: fisico, abilita: furtivita, difficolta: Difficile }
        successo:
          titolo: Mentre mangiano
          testo: |
            Aspetti che riabbassino la testa e passi lungo la parete con la
            lanterna coperta dal mantello, a due passi dalle loro code. Pianti
            la carica dove lo slargo si stringe e prosegui senza voltarti.
          pe: { furtivita: 2 }
          effetti: { profondita.avv-divoratore: 1 }
        fallimento:
          titolo: La gerla che sbatte
          testo: |
            A metà dello slargo la gerla ti sbatte contro la parete, e i due
            rodipietra alzano la testa e ti vengono dietro con la loro lentezza
            testarda. Ti ritiri fino al caldo, finché smettono di seguirti.
          effetti: { tormento: 0.5 }
      - testo: "Aspettare che abbiano finito di mangiare"
        descrizione: "Quando i mucchi finiscono, se ne vanno a cercarne altri. Ci vuole tempo, e l'odore è forte."
        costo: 2
        esito:
          titolo: Il pasto lungo
          testo: |
            Aspetti nella galleria, seduto sui talloni, mentre i rodipietra
            finiscono i mucchi uno alla volta e poi si infilano in un cunicolo
            laterale. Pianti la carica con l'odore di roccia digerita nei
            vestiti, e ti resta addosso fino alla Strozza.
          effetti: { profondita.avv-divoratore: 1, tormento: 0.5 }

  # ------------------------------------------------------------ 3-4 · il bivio caldo
  - id: avv-divoratore-il-bivio-caldo
    immagine: icone/earth-crack
    titolo: Il bivio caldo
    sommario: "Tre gallerie fresche si aprono nella stessa parete, tutte calde. Soltanto una sale verso la Strozza."
    luogo: Le gallerie del Divoratore, il bivio
    area: avv-divoratore
    ripetibile: true
    requisiti: [avventura.divoratore == 5, profondita.avv-divoratore >= 3, profondita.avv-divoratore <= 4]
    testo: |
      Nella stessa parete si aprono tre gallerie fresche una accanto all'altra.
      Sono rotonde e calde allo stesso modo, e il verme le ha percorse tutte
      avanti e indietro, ma soltanto una sale verso la Strozza. Le altre due
      girano sotto la montagna e non tornano. La carica va all'imbocco di quella
      giusta, perché il crollo la chiuda.

      {natura Difficile} L'aria della gola scende sempre verso il fondo, anche
      quaggiù. Una delle tre bocche la tira piano, e la fiamma della lanterna si
      piega dalla sua parte.
    opzioni:
      - testo: "Seguire l'aria della gola"
        descrizione: "Cerya dice che gli occhi si ingannano e il naso no. Qui l'aria di Tuarmir si riconosce."
        prova: { attributo: mentale, abilita: [natura, percezione], difficolta: Difficile }
        successo:
          titolo: L'odore di salvia
          testo: |
            Ti fermi davanti a ogni bocca con la maschera abbassata. Dalla terza
            arriva un filo d'aria fresca che sa di salvia, quella dei terrazzi
            di sotto. Pianti la carica all'imbocco e la leghi alla miccia.
          pe: { natura: 2 }
          effetti: { profondita.avv-divoratore: 1 }
        fallimento:
          titolo: La bocca sbagliata
          testo: |
            Scegli la bocca di sinistra, e dopo cento passi la galleria gira e
            scende invece di salire. Torni indietro sudat{o|a} fino al bivio, con le
            tre bocche uguali che ti aspettano.
          effetti: { tormento: 0.5 }
      - testo: "Fare il conto dei passi dalla tana"
        descrizione: "Dalla tana alla Strozza ci sono le case del villaggio sopra la testa. I passi contati dicono quanto manca, e in che direzione."
        prova: { attributo: mentale, abilita: [accademiche, percezione], difficolta: Difficile }
        successo:
          titolo: Il conto
          testo: |
            Rifai il conto dei passi dalla tana e delle curve, girando a ogni
            curva come gira la scala grande sopra di te. La Strozza sta a
            sinistra e più in basso, e la bocca di mezzo ci va. Pianti la carica
            e la leghi.
          pe: { accademiche: 2 }
          effetti: { profondita.avv-divoratore: 1 }
        fallimento:
          titolo: Il conto sbagliato
          testo: |
            Perdi il conto a una curva che non ricordavi, e quando lo rifai
            torna diverso. Lo rifai una terza volta, con la gola secca, e il
            bivio intanto è diventato più caldo.
          effetti: { tormento: 0.5 }
      - testo: "Ascoltare il fischio del dente"
        descrizione: "La lancia del Pettine fischia nel vento una nota sola. Quaggiù il vento è poco, e passa da una bocca sola."
        requisiti: [oggetto.tuarmir-lancia-del-pettine >= 1]
        prova: { attributo: mentale, abilita: [natura, percezione], difficolta: Media }
        successo:
          titolo: La nota
          testo: |
            Alzi la lancia davanti a ogni bocca. Davanti alla terza il dente
            comincia a fischiare la sua nota sola, piano, poi più forte. Pianti
            la carica all'imbocco, e il fischio ti accompagna per un pezzo.
          pe: { natura: 2 }
          effetti: { profondita.avv-divoratore: 1 }
        fallimento:
          titolo: Il silenzio
          testo: |
            Il dente resta muto davanti a tutte e tre le bocche, e quando
            finalmente fischia fischia dalla parte sbagliata, per una raffica
            che torna indietro. Abbassi la lancia e ricominci da capo.
          effetti: { tormento: 0.5 }
      - testo: "Mettere una carica in tutte e tre"
        descrizione: "Nel dubbio si chiudono tutte e tre. Le cariche però sono contate."
        costo: 2
        esito:
          titolo: Tre imbocchi
          testo: |
            Pianti una carica all'imbocco di ogni bocca e le leghi tutte alla
            miccia, e poi prendi le due di troppo dalle bocche che non salgono,
            una volta capito quale sale. Ci vuole tempo, e il caldo non aiuta.
          effetti: { profondita.avv-divoratore: 1, ferite: 0.5 }

  # ------------------------------------------------------------ 5 · la svolta: il Divoratore passa
  - id: avv-divoratore-il-divoratore-passa
    immagine: icone/worm-mouth
    titolo: Il Divoratore passa
    sommario: "Mentre leghi la sesta carica, la parete della galleria comincia a scaldarti le mani. Dall'altra parte passa qualcosa."
    luogo: Le gallerie del Divoratore, accanto alla galleria grande
    area: avv-divoratore
    requisiti: [avventura.divoratore == 5, profondita.avv-divoratore == 5]
    testo: |
      La galleria che hai preso corre accanto a un'altra più grande, separata da
      una parete spessa un braccio. Sei in ginocchio con la sesta carica fra le
      mani e la miccia legata a metà, quando la parete comincia a scaldarsi
      sotto le dita.

      Poi arriva un rumore lungo e basso di pietra macinata, che sale dal fondo
      e ti fa vibrare il pavimento sotto le ginocchia fino ai denti. Da una
      crepa nella parete, all'altezza della faccia, entra un'aria calda che sa
      di aceto. Avvicini l'occhio alla crepa, e dall'altra parte passa una
      parete di carne grigia e lucida, a pochi palmi da te. Continua a passare
      per un tempo lunghissimo.

      Più avanti la galleria grande si apre in un incrocio, e la testa si ferma
      lì e si gira. Vedi la bocca. È un anello di placche di dente grandi come
      scudi, che girano piano una contro l'altra, e una delle placche è crepata
      e pende di traverso.

      {natura Difficile} Il verme è cieco, e sente quello che trema. Adesso la
      parete fra voi trema a ogni colpo del tuo cuore.

      {origine figlio-del-circolo} Nel Bosco ti hanno insegnato che davanti a
      una bestia troppo grande si diventa un sasso, e si aspetta che decida di
      avere fame da un'altra parte.

      La testa resta ferma all'incrocio, girata dalla tua parte.
    opzioni:
      - testo: "Restare immobile finché passa"
        descrizione: "Stare fermo come la roccia finché la coda è passata. Può volerci molto."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Difficile }
        successo:
          titolo: Il sasso
          testo: |
            Resti in ginocchio senza muovere un dito, con la carica fra le mani,
            mentre la testa ti cerca e poi si volta. La coda passa per un tempo
            che non sai contare. Quando la parete torna fredda finisci il nodo,
            e ti accorgi di avere le mani bagnate.
          pe: { resilienza: 3 }
          effetti: { profondita.avv-divoratore: 1 }
        fallimento:
          titolo: La mano che si muove
          testo: |
            La mano ti scatta da sola verso la lanterna, e la testa colpisce la
            parete dall'altra parte. La crepa si allarga fino al soffitto.
            Scappi indietro carponi con la carica stretta al petto, e la
            galleria ti trema dietro finché il verme non va via.
          effetti: { ferite: 0.5, tormento: 0.5 }
      - testo: "Finire il nodo mentre passa, senza un rumore"
        descrizione: "Mezzo nodo e un giro di miccia. Le dita devono stare ferme anche se il resto di te non lo è."
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Difficile }
        successo:
          titolo: Mezzo nodo
          testo: |
            Finisci il nodo con le dita lente, un giro di miccia alla volta,
            mentre dall'altra parte la carne grigia continua a passare. La testa
            si volta verso il fondo. Quando la coda è passata la carica è legata
            da un pezzo.
          pe: { furtivita: 3 }
          effetti: { profondita.avv-divoratore: 1 }
        fallimento:
          titolo: Il coccio sulla pietra
          testo: |
            Il coccio della carica tocca la pietra con un tic leggero, e la
            parete si spacca dove la testa la colpisce. Torni indietro di corsa
            con le schegge nei capelli e aspetti, accucciato, che il rumore si
            allontani.
          effetti: { ferite: 0.5, tormento: 0.5 }
      - testo: "Aspettare i colpi della campana di Maela"
        descrizione: "Maela suona a ogni ora, e il verme va verso il suono anche se quaggiù tu non lo senti."
        requisiti: [avv-divoratore.campana >= 1]
        prova: { attributo: mentale, abilita: resilienza, difficolta: Media }
        successo:
          titolo: L'ora
          testo: |
            Aspetti contando i battiti, finché la testa all'incrocio si alza
            verso la volta come un cane che sente il padrone. Poi si gira e se
            ne va su, dalla parte dello slargo e della campana, trascinandosi
            dietro il resto del corpo. Finisci il nodo con calma, e per un
            momento ti viene da ridere.
          pe: { resilienza: 3 }
          effetti: { profondita.avv-divoratore: 1 }
        fallimento:
          titolo: L'ora che non arriva
          testo: |
            L'ora tarda ad arrivare. La testa intanto si avvicina alla parete, e
            tu scappi indietro carponi prima che la sfondi, con la carica in
            mano e la miccia che ti si srotola dietro.
          effetti: { tormento: 0.5 }
      - testo: "Tornare indietro carponi e aspettare che sia lontano"
        descrizione: "Lontano dalla parete il verme non ti sente. Poi però bisogna tornare, e ricominciare il nodo."
        costo: 2
        esito:
          titolo: Lontano dalla parete
          testo: |
            Torni indietro carponi fino al bivio e aspetti nel caldo, finché il
            pavimento smette di vibrare. Quando torni a finire il nodo la crepa
            è larga il doppio, e dall'altra parte la galleria grande è vuota.
          effetti: { profondita.avv-divoratore: 1, tormento: 0.5 }

  # ------------------------------------------------------------ 6-9 · i piloni
  - id: avv-divoratore-i-piloni
    immagine: ambientazione/regno-profondo
    titolo: I piloni
    sommario: "Sotto la Strozza la galleria passa fra i piedi delle due pareti della gola. Le cariche vanno in alto, nella roccia nera."
    luogo: Le gallerie del Divoratore, sotto la Strozza
    area: avv-divoratore
    ripetibile: true
    requisiti: [avventura.divoratore == 5, profondita.avv-divoratore >= 6, profondita.avv-divoratore <= 9]
    testo: |
      Sotto la Strozza la galleria del verme passa fra i piedi delle due pareti
      della gola, che quaggiù quasi si toccano. Sono due piloni di roccia nera,
      più dura di tutto quello che hai attraversato, e il verme ci è passato in
      mezzo senza scalfirli. Per far crollare la Strozza le cariche vanno in
      alto, nelle crepe dove i piloni si staccano dalla volta, quattro braccia
      sopra la tua testa.

      {tecnologia Difficile} Ogni roccia ha una vena dove si apre. In questa le
      crepe vecchie corrono tutte nello stesso verso, e quelle giuste sono
      annerite.
    opzioni:
      - testo: "Arrampicarti sul pilone fino alla crepa alta"
        descrizione: "Quattro braccia di roccia nera senza un appiglio vero, con la gerla sulla schiena."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Molto difficile }
        successo:
          titolo: La crepa alta
          testo: |
            Sali con le dita nelle fessure e le punte degli stivali sulle
            sporgenze, e quando arrivi alla crepa ci entri con il braccio fino
            alla spalla. Incastri la carica in fondo, ci leghi la miccia e
            scendi con le gambe che tremano.
          pe: { atletica: 2 }
          effetti: { profondita.avv-divoratore: 1 }
        fallimento:
          titolo: Quattro braccia
          testo: |
            A tre braccia una sporgenza ti si stacca sotto il piede, e torni giù
            sul pavimento della galleria di fianco, sulla gerla. Le cariche sono
            intere, e le costole a sentirle un po' meno.
          effetti: { ferite: 1 }
      - testo: "Trovare la vena dove la roccia si apre"
        descrizione: "Le crepe annerite sono quelle giuste. Basta trovare quella che si raggiunge da terra."
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Difficile }
        successo:
          titolo: La vena
          testo: |
            Segui le crepe annerite con la lanterna finché ne trovi una che
            scende fino all'altezza della spalla, e che corre su nel pilone come
            una radice. Ci spingi la carica con un bastone fino in fondo e lasci
            uscire la miccia.
          pe: { tecnologia: 2 }
          effetti: { profondita.avv-divoratore: 1 }
        fallimento:
          titolo: La crepa cieca
          testo: |
            La crepa che scegli finisce dopo un braccio contro la roccia sana, e
            la carica lì non farebbe niente. La tiri fuori e ricominci, mentre
            il pilone ti guarda dall'alto senza un graffio.
          effetti: { tormento: 1 }
      - testo: "Piantare la carica con i cunei del fabbro"
        descrizione: "I cunei di ferro del fabbro entrano nella roccia nera a martellate, e fanno da scala e da sostegno."
        requisiti: [avv-divoratore.ferri >= 1]
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Media }
        successo:
          titolo: I cunei
          testo: |
            Pianti i cunei uno sopra l'altro a colpi di pomo, e ci sali come su
            una scala a pioli. L'ultimo lo pianti nella crepa alta, e la carica
            la leghi al cuneo con la miccia. Il fabbro sarebbe contento del
            suono che fanno.
          pe: { atletica: 2 }
          effetti: { profondita.avv-divoratore: 1 }
        fallimento:
          titolo: Il cuneo che salta
          testo: |
            Il terzo cuneo salta fuori dalla roccia sotto il tuo peso, e scendi
            più in fretta di quanto eri salit{o|a}. I cunei restano piantati storti
            nella roccia, e tu ti massaggi un polso.
          effetti: { ferite: 0.5 }
      - testo: "Accatastare sassi fino alla crepa"
        descrizione: "Sassi ce ne sono, e il tempo si trova. Ogni scossa però butta giù la catasta."
        costo: 3
        esito:
          titolo: La catasta
          testo: |
            Accatasti sassi contro il pilone fino all'altezza della crepa, e la
            scossa te la butta giù due volte. Alla terza ci sali sopra e leghi
            la carica, e scendi con le mani spaccate.
          effetti: { profondita.avv-divoratore: 1, ferite: 0.5 }

  # ------------------------------------------------------------ 6-9 · il soffitto sottile
  - id: avv-divoratore-il-soffitto-sottile
    immagine: icone/earth-crack
    titolo: Il soffitto sottile
    sommario: "Qui la galleria passa appena sotto il fondo della gola, e dalle crepe del soffitto si vede una striscia di cielo grigio."
    luogo: Le gallerie del Divoratore, sotto il fondo della gola
    area: avv-divoratore
    ripetibile: true
    requisiti: [avventura.divoratore == 5, profondita.avv-divoratore >= 6, profondita.avv-divoratore <= 9]
    testo: |
      Qui la galleria sale fin quasi al fondo della gola, e il soffitto è
      sottile. Dalle crepe filtra una luce grigia, e in una crepa più larga
      delle altre si vede una striscia di cielo con il bordo di una parete
      contro. A ogni scossa dal soffitto cade una pioggia di sassi, e qualcuno è
      grosso come una testa. La carica va nel mezzo, dove la volta è più debole.

      {percezione Molto difficile} I sassi cadono sempre dagli stessi punti,
      quelli dove la luce passa più larga. Dove la crepa è scura, la volta regge
      ancora.
    opzioni:
      - testo: "Lavorare fra una scossa e l'altra"
        descrizione: "Fra due scosse c'è il tempo di correre in mezzo e tornare con la carica piantata. Bisogna essere svelti a scansarsi."
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Difficile }
        successo:
          titolo: Fra due scosse
          testo: |
            Corri nel mezzo appena finisce una scossa e pianti la carica. Sei di
            nuovo al riparo quando il sasso più grosso cade dove eri un momento
            prima. Leghi la miccia dal bordo, tirandola con calma.
          pe: { acrobazia: 2 }
          effetti: { profondita.avv-divoratore: 1 }
        fallimento:
          titolo: La pioggia
          testo: |
            La scossa arriva prima di quanto pensavi, e un sasso ti prende sulla
            spalla. Torni al riparo con la carica in mano e il braccio che non
            si alza più sopra la testa.
          effetti: { ferite: 1 }
      - testo: "Leggere il soffitto e scegliere il punto che regge"
        descrizione: "La luce dice dove la volta è aperta. Basta saperla leggere, e restarci sotto."
        prova: { attributo: mentale, abilita: percezione, difficolta: Molto difficile }
        successo:
          titolo: La crepa scura
          testo: |
            Ti metti sotto la crepa più scura, dove non passa luce, e lavori lì
            mentre i sassi cadono tutti intorno senza toccarti. La carica la
            pianti accanto ai tuoi piedi, dove la volta si appoggia.
          pe: { percezione: 2 }
          effetti: { profondita.avv-divoratore: 1 }
        fallimento:
          titolo: La luce sbagliata
          testo: |
            Scegli una crepa che sembrava scura ed era soltanto in ombra, e alla
            prima scossa ti piove addosso mezzo soffitto. Ne esci con la testa
            che gira e la polvere in bocca.
          effetti: { ferite: 1 }
      - testo: "Puntellare la volta con le assi della gerla"
        descrizione: "La gerla è di assicelle e vimini. Smontata, regge un pezzo di volta per il tempo di un nodo."
        costo: 3
        esito:
          titolo: La gerla smontata
          testo: |
            Smonti la gerla e ne fai un puntello sotto la volta, e lavori sotto
            il puntello mentre i sassi ci battono sopra. Le cariche che restano
            te le porti in un fagotto, e il fagotto ti sega la spalla.
          effetti: { profondita.avv-divoratore: 1, ferite: 0.5 }

  # ------------------------------------------------------------ 6-9 · la pozza calda
  - id: avv-divoratore-la-pozza-calda
    immagine: icone/earth-worm
    titolo: La pozza calda
    sommario: "Il verme ha sfondato una vena d'acqua calda, e nella pozza che fuma si muovono i rodipietra."
    luogo: Le gallerie del Divoratore, la pozza calda
    area: avv-divoratore
    ripetibile: true
    requisiti: [avventura.divoratore == 5, profondita.avv-divoratore >= 6, profondita.avv-divoratore <= 9]
    testo: |
      Il verme ha sfondato una vena d'acqua, e l'acqua esce dalla roccia calda
      come brodo e riempie una pozza che fuma da parete a parete. Sul bordo ci
      sono mucchi di pasta grigia, e nell'acqua si muovono le schiene di due
      rodipietra, che ci stanno come vecchi alle terme. La carica va dall'altra
      parte, nella spaccatura da cui esce l'acqua.

      {resistenza Media fallita} Il vapore ti fa sudare anche le ginocchia, e il
      corpo ti chiede soltanto di sederti sul bordo e chiudere gli occhi.
    opzioni:
      - testo: "Tirarli fuori dall'acqua e finirli sul bordo"
        descrizione: "In acqua sono svelti. Sul bordo sono due vermi grandi come cani, e basta."
        combattimento: avv-divoratore-i-rodipietra
        vittoria:
          titolo: Il bordo
          testo: |
            Li tiri fuori dall'acqua a colpi di lama uno dopo l'altro, e li
            finisci sul bordo fra i mucchi grigi. Poi attraversi la pozza con
            l'acqua alla cintola e pianti la carica nella spaccatura, sopra la
            vena.
          pe: { armi-da-mischia: 2 }
          effetti: { profondita.avv-divoratore: 1 }
        sconfitta:
          titolo: Sott'acqua
          testo: |
            Uno ti tira sott'acqua per una caviglia, e quando riemergi l'altro
            ti morde la spalla. Ti trascini fuori dalla pozza tossendo acqua
            calda e ti ritiri nel corridoio, rosso come un gambero.
          effetti: { ferite: 0.5 }
      - testo: "Passare lungo il bordo mentre stanno a mollo"
        descrizione: "Quando sono nell'acqua tengono gli occhi chiusi, o quello che hanno al posto degli occhi."
        prova: { attributo: fisico, abilita: furtivita, difficolta: Difficile }
        successo:
          titolo: Le terme
          testo: |
            Passi lungo il bordo senza smuovere un sasso, e i rodipietra restano
            a mollo con le teste mezze sommerse. Nella spaccatura la roccia è
            bollente. Infili la carica e leghi la miccia, poi torni indietro con
            le dita rosse.
          pe: { furtivita: 2 }
          effetti: { profondita.avv-divoratore: 1 }
        fallimento:
          titolo: Il sasso nella pozza
          testo: |
            Un sasso ti rotola sotto il piede e finisce nella pozza con un
            tonfo. Le due teste escono dall'acqua insieme e vengono verso il
            bordo. Ti ritiri nel corridoio camminando all'indietro.
          effetti: { ferite: 0.5, tormento: 0.5 }
      - testo: "Aspettare che escano dall'acqua da soli"
        descrizione: "Prima o poi avranno fame e torneranno ai mucchi. La pozza intanto fuma, e il caldo sale."
        costo: 3
        esito:
          titolo: Il vapore
          testo: |
            Aspetti nel corridoio pieno di vapore finché i rodipietra escono a
            mangiare dall'altra parte, e allora attraversi con l'acqua alla
            cintola e pianti la carica. Quando esci hai la pelle delle gambe che
            tira come dopo una scottatura.
          effetti: { profondita.avv-divoratore: 1, ferite: 0.5 }

  # ------------------------------------------------------------ 6-9 · la frana dei vecchi
  - id: avv-divoratore-la-frana-dei-vecchi
    immagine: ambientazione/regno-profondo
    titolo: La frana dei vecchi
    sommario: "Qui i vecchi di Tuarmir accesero i loro sette giorni di fuoco. Il verme è passato in mezzo alla loro frana."
    luogo: Le gallerie del Divoratore, la frana dei vecchi
    area: avv-divoratore
    ripetibile: true
    requisiti: [avventura.divoratore == 5, profondita.avv-divoratore >= 6, profondita.avv-divoratore <= 9]
    testo: |
      La galleria attraversa una frana di massi neri, e il verme ci è passato in
      mezzo come un ago in una pagnotta. Le pareti della frana sono annerite dal
      fuoco, e fra i massi ci sono cunei di legno carbonizzati, secchi di cuoio
      induriti e una zucca spaccata. Contro un masso, seduto, c'è un morto
      vestito di stracci, con le ossa delle mani ancora intorno al manico di un
      secchio.

      {accademiche Difficile} I vecchi non accendevano i fuochi a caso. Le crepe
      che hanno aperto con il fuoco e l'acqua seguono la frana fino al pilone, e
      sono ancora lì, pronte.

      {resilienza Media fallita} Il morto è girato verso di te. È seduto così da
      generazioni, e la tua lanterna è la prima luce che vede.
    opzioni:
      - testo: "Seguire le crepe del fuoco fino al pilone"
        descrizione: "Dove i vecchi hanno spaccato la roccia una volta, si spacca di nuovo con poco."
        prova: { attributo: mentale, abilita: [accademiche, tecnologia], difficolta: Difficile }
        successo:
          titolo: Le crepe dei vecchi
          testo: |
            Segui le crepe annerite da un masso all'altro fino al pilone, dove
            si aprono in una fessura larga quanto un braccio. La carica ci entra
            come in un fodero. Passando, giri il morto verso la parete.
          pe: { accademiche: 2 }
          effetti: { profondita.avv-divoratore: 1 }
        fallimento:
          titolo: Il masso che si sposta
          testo: |
            Segui una crepa che non porta da nessuna parte, e quando ti appoggi
            a un masso per guardare meglio il masso si sposta. La frana
            scricchiola fino al soffitto, e tu torni indietro senza voltarti.
          effetti: { tormento: 1 }
      - testo: "Scavare fra i massi accanto al morto"
        descrizione: "Il passaggio più corto per il pilone è sotto il morto, fra i massi che si muovono. Bisogna lavorarci con le mani, e con calma."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Molto difficile }
        successo:
          titolo: Accanto a lui
          testo: |
            Scavi fra i massi con le mani, sasso dopo sasso, con la spalla
            contro la spalla del morto e la frana che geme sopra di voi. Quando
            arrivi al pilone pianti la carica, e al morto lasci la tua
            borraccia, che di acqua ne aveva bisogno.
          pe: { resilienza: 2 }
          effetti: { profondita.avv-divoratore: 1 }
        fallimento:
          titolo: La frana che geme
          testo: |
            A metà dello scavo la frana geme più forte, e ti sembra che il morto
            si sia girato. Ti ritrovi nella galleria senza ricordare di essere
            uscito, con le mani piene di terra.
          effetti: { tormento: 1 }
      - testo: "Portare il morto fuori dalla frana e scavare con calma"
        descrizione: "Un morto non pesa niente. Spostarlo, però, pesa lo stesso."
        costo: 3
        esito:
          titolo: Il morto nella galleria
          testo: |
            Porti il morto fuori dalla frana e lo stendi nella galleria con il
            secchio accanto. Poi scavi fino al pilone con calma, e pianti la
            carica. Quando torni a guardarlo ha la faccia girata verso il
            villaggio.
          effetti: { profondita.avv-divoratore: 1, tormento: 0.5 }

  # ------------------------------------------------------------ 6-9 · la fuga dello sciame
  - id: avv-divoratore-la-fuga-dello-sciame
    immagine: icone/centipede
    titolo: La fuga dello sciame
    sommario: "Dal fondo della galleria sale un fiume di scolopendre in fuga. Qualcosa, più in basso, sta tornando."
    luogo: Le gallerie del Divoratore, la galleria della fuga
    area: avv-divoratore
    ripetibile: true
    requisiti: [avventura.divoratore == 5, profondita.avv-divoratore >= 6, profondita.avv-divoratore <= 9]
    testo: |
      Il pavimento trema a lungo, e dal fondo della galleria sale un rumore di
      aghi sulla pietra che diventa un fruscio e poi un fiume. Sono scolopendre
      bianche, migliaia, che salgono in fuga coprendo il pavimento e le pareti,
      e in mezzo alle piccole ce ne sono di grandi come un braccio. Escono tutte
      dalla stessa spaccatura nel pavimento, e la carica va proprio lì dentro.

      {natura Media} Scappano dal verme. Se salgono così, il verme è sotto e sta
      tornando.
    opzioni:
      - testo: "Aprirti la strada fino alla spaccatura"
        descrizione: "Le piccole passano. Le grandi si fermano a mordere quello che trovano."
        combattimento: avv-divoratore-lo-sciame
        vittoria:
          titolo: Contro corrente
          testo: |
            Ti apri la strada contro corrente, a colpi di lama, finché le grandi
            restano indietro. Infili la carica nella spaccatura con le
            scolopendre che ti scorrono sulle braccia, e la leghi senza
            guardare.
          pe: { armi-da-mischia: 2 }
          effetti: { profondita.avv-divoratore: 1 }
        sconfitta:
          titolo: Il fiume
          testo: |
            Il fiume ti prende alle gambe e ti porta indietro, e le grandi ti
            mordono dove trovano pelle. Ti ritrovi più su nella galleria, con le
            mani gonfie e la carica ancora nella gerla.
          effetti: { ferite: 0.5 }
      - testo: "Stenderti a faccia in giù e lasciarle passare"
        descrizione: "Per loro una persona stesa a terra è un sasso come un altro. Bisogna restare un sasso a lungo."
        prova: { attributo: fisico, abilita: resistenza, difficolta: Difficile }
        successo:
          titolo: Il sasso nel fiume
          testo: |
            Ti stendi con la faccia nel gomito e la gerla sotto la pancia, e lo
            sciame ti passa sopra per un tempo lungo. Quando è passato strisci
            fino alla spaccatura e ci infili la carica, con le mani che ancora
            formicolano.
          pe: { resistenza: 2 }
          effetti: { profondita.avv-divoratore: 1 }
        fallimento:
          titolo: In piedi
          testo: |
            Resisti finché una ti entra nel colletto, e allora salti in piedi
            senza volerlo. Le grandi ti saltano addosso tutte insieme. Scappi
            verso l'alto in mezzo a loro, mordendoti il labbro per non gridare.
          effetti: { ferite: 1 }
      - testo: "Risalire e aspettare che il fiume finisca"
        descrizione: "Prima o poi lo sciame finisce di passare. Il verme però intanto si avvicina."
        costo: 3
        esito:
          titolo: Il fiume finito
          testo: |
            Risali fino a una nicchia e aspetti che il fiume finisca, e finisce
            quando il pavimento comincia a scaldarsi. Scendi di corsa, pianti la
            carica nella spaccatura che fuma e torni su prima che la roccia
            diventi troppo calda per le ginocchia.
          effetti: { profondita.avv-divoratore: 1, tormento: 0.5 }

  # ------------------------------------------------------------ 10 · il cuore: la Strozza, prima prova (le micce)
  - id: avv-divoratore-la-strozza
    immagine: ambientazione/regno-profondo
    titolo: La Strozza
    sommario: "La decima carica è legata sotto il pilone più stretto. Dal fondo della galleria il Divoratore torna, e torna per la Strozza."
    luogo: Le gallerie del Divoratore, sotto la Strozza
    area: avv-divoratore
    requisiti: [avventura.divoratore == 5, profondita.avv-divoratore >= 10]
    testo: |
      La decima carica è al suo posto, nella crepa sotto il pilone più stretto,
      e la miccia maestra corre indietro lungo la galleria, legata a tutte le
      altre fino alla tana. Sopra di te, a dieci braccia, c'è il fondo della
      gola. Ci si arriva per un camino di roccia rotta che il verme ha aperto
      passando, con una striscia di luce in cima. La miccia va accesa qui, e poi
      si sale.

      Il pavimento trema. Dal fondo della galleria sale il rumore di pietra
      macinata, poi l'aria calda con l'odore di aceto. Due rodipietra ti passano
      accanto di corsa verso l'alto, senza guardarti. Il Divoratore torna, e per
      salire al villaggio deve passare di qui.

      {natura Difficile} Se accendi troppo presto, la Strozza crolla sul vuoto e
      lui trova un'altra strada. Bisogna che la testa sia sotto i piloni quando
      scoppiano.

      {tecnologia Media} La miccia maestra ha preso l'umido delle gallerie per
      tutta la strada. Si accende, ma brucia piano.

      {origine apprendista-raschiatore} Sulle piattaforme la miccia la accendeva
      il più anziano, e gli altri erano già sulla scala.

      Hai l'acciarino in mano, e la luce in cima al camino è lontana.
    opzioni:
      - testo: "Contare i colpi e accendere quando è sotto i piloni"
        descrizione: "Il rumore della pietra macinata cambia quando la testa entra nella strettoia. Bisogna sentirlo, e non scappare prima."
        prova: { attributo: mentale, abilita: [natura, percezione], difficolta: Difficile }
        successo:
          titolo: Il colpo giusto
          testo: |
            Conti i colpi con l'acciarino stretto in mano, e il rumore cambia,
            più chiuso, come una macina che morde il sasso. Batti l'acciarino.
            La miccia prende con un sibilo e la fiamma corre via lungo la
            galleria, nel buio, mentre tu ti giri verso il camino.
          pe: { natura: 3 }
          segue: avv-divoratore-la-bocca
        fallimento:
          titolo: Troppo presto
          testo: |
            Accendi troppo presto, e te ne accorgi dal rumore, ancora lontano.
            Strappi la miccia con le mani prima che arrivi alla prima carica e
            ti bruci le dita. Il verme intanto ha sentito. Risali il camino con
            la galleria che trema sotto di te, e alla Strozza le cariche sono
            tutte da rilegare.
          effetti: { ferite: 1.5, tormento: 0.5 }
          vai: superficie-fratturata
      - testo: "Correre lungo la miccia e accenderla in tre punti"
        descrizione: "La miccia bagnata brucia piano. Accesa in tre punti, arriva in tempo anche alle cariche lontane."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Difficile }
        successo:
          titolo: Tre fiamme
          testo: |
            Accendi la miccia sotto il pilone e corri indietro lungo la galleria
            fino alla seconda carica, e poi alla terza, con l'acciarino che ti
            scotta in mano. Tre fiamme corrono nel buio. Quando torni sotto il
            camino il rumore della pietra macinata è vicinissimo.
          pe: { atletica: 3 }
          segue: avv-divoratore-la-bocca
        fallimento:
          titolo: L'acciarino
          testo: |
            Inciampi nella miccia correndo, e l'acciarino ti vola di mano nel
            buio. Lo cerchi a tentoni mentre la galleria si scalda. Quando lo
            ritrovi il verme è troppo vicino, e risali il camino senza aver
            acceso niente, con le cariche tutte da rilegare.
          effetti: { ferite: 1.5, tormento: 0.5 }
          vai: superficie-fratturata
      - testo: "Fare il nodo doppio che ti ha insegnato Velia"
        descrizione: "Velia Stracca annoda la miccia in modo che bruci dal mezzo verso tutte e due le parti. Si accende presto, e arriva in tempo."
        quando: [avv-divoratore.cariche == 1]
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Difficile }
        successo:
          titolo: Il nodo doppio
          testo: |
            Fai il nodo doppio come te l'ha fatto vedere Velia, con le tre dita
            che le restavano, e lo accendi. La fiamma si divide e corre nelle
            due direzioni. Adesso il tempo lo decide la miccia, e tu ti giri
            verso il camino.
          pe: { tecnologia: 3 }
          segue: avv-divoratore-la-bocca
        fallimento:
          titolo: Il nodo sciolto
          testo: |
            Il nodo ti si scioglie fra le dita sudate, e lo rifai due volte
            mentre la galleria si scalda. Alla terza il verme è già
            all'incrocio. Risali il camino con la miccia spenta in mano, e le
            cariche sono da rilegare.
          effetti: { ferite: 1.5, tormento: 0.5 }
          vai: superficie-fratturata
      - testo: "Accendere subito la miccia lenta della fornace"
        descrizione: "La miccia di Abele Torsi brucia piano come la colata quando si raffredda. Accesa adesso, arriva alle cariche insieme a lui, purché tu resti ad aspettare accanto."
        quando: [avv-divoratore.cariche == 2]
        prova: { attributo: mentale, abilita: resilienza, difficolta: Difficile }
        successo:
          titolo: La miccia lenta
          testo: |
            Accendi la miccia lenta e resti a guardarla, mentre la fiamma
            striscia via di un palmo alla volta e il rumore della pietra
            macinata sale. Resti ferm{o|a} a guardarla finché sparisce nel buio,
            come ti ha detto Abele, e soltanto allora ti giri verso il camino.
          pe: { resilienza: 3 }
          segue: avv-divoratore-la-bocca
        fallimento:
          titolo: La pazienza
          testo: |
            La miccia lenta è troppo lenta per i tuoi nervi, e la tagli per
            riaccenderla più avanti. Così si spegne. Il verme è all'incrocio
            quando te ne accorgi. Risali il camino a mani nude, con le cariche
            tutte da rilegare.
          effetti: { ferite: 1.5, tormento: 0.5 }
          vai: superficie-fratturata

  # ------------------------------------------------------------ il cuore, seconda prova: la bocca
  - id: avv-divoratore-la-bocca
    tipo: seguito
    immagine: icone/worm-mouth
    titolo: La bocca
    sommario: "La parete della galleria si apre, e la testa del Divoratore entra fra te e il camino."
    luogo: Le gallerie del Divoratore, sotto la Strozza
    area: avv-divoratore
    requisiti: [avventura.divoratore == 5]
    testo: |
      Fai due passi verso il camino, e la parete alla tua sinistra si gonfia e
      si apre. La testa del Divoratore entra nella galleria fra te e il camino,
      e la riempie da pavimento a soffitto. Le placche della bocca, piantate in
      una gengiva grigia e molle, girano piano una contro l'altra e macinano la
      roccia della parete come grano, con la placca crepata che sbatte di
      traverso a ogni giro. Il caldo ti asciuga gli occhi.

      Dietro di te la fiamma della miccia è sparita nel buio. Fra poco arriva
      alle cariche, e tu sei sotto i piloni.

      {rissa Difficile} La gengiva è l'unico punto molle di tutta la testa. Lì
      il verme sente il ferro, e lì si ritira.

      {furtivita Media} È cieco, e sente quello che trema. Un sasso lanciato
      lontano trema più di te.
    opzioni:
      - testo: "Colpire la gengiva finché la bocca si ritira"
        descrizione: "Non si ammazza con una lama. Si può fargli abbastanza male da farlo arretrare di dieci passi, che sono quelli che servono."
        combattimento: avv-divoratore-la-bocca
        vittoria:
          titolo: La gengiva
          testo: |
            Colpisci più volte dove le placche entrano nella carne grigia,
            finché la bocca si contrae e la testa arretra nella parete con un
            rumore di macina che si inceppa. La placca crepata si stacca e resta
            sul pavimento, e davanti a te il camino è libero.
          pe: { armi-da-mischia: 5 }
          segue: avv-divoratore-il-camino
        sconfitta:
          titolo: Le placche
          testo: |
            Una placca ti prende di piatto sul fianco e ti butta contro il
            pilone, e la bocca ti passa a un palmo dalla testa. Strisci fino al
            camino e sali con un braccio solo, mentre sotto di te i sassi
            tranciano la miccia e lasciano le cariche tutte da rilegare.
          effetti: { tormento: 0.5 }
          vai: superficie-fratturata
      - testo: "Restare immobile contro il pilone"
        descrizione: "Il verme sente quello che trema. Contro la roccia nera sei roccia anche tu, finché non ti trema niente."
        prova: { attributo: fisico, abilita: furtivita, difficolta: Difficile }
        successo:
          titolo: Contro il pilone
          testo: |
            Ti schiacci contro il pilone senza muovere un dito, e la testa ti
            passa davanti a mezzo braccio, cercando, con il caldo che ti scotta
            la faccia. Poi si gira verso il rumore della miccia nel buio e se ne
            va da quella parte, lasciandoti libero il camino.
          pe: { furtivita: 5 }
          segue: avv-divoratore-il-camino
        fallimento:
          titolo: Il ginocchio
          testo: |
            Il ginocchio ti trema per uno scatto solo, e la testa si gira verso
            di te. Ti butti di lato e la bocca morde il pilone. Risali il camino
            con le placche che macinano la roccia sotto i tuoi stivali, e i
            sassi tranciano la miccia e lasciano le cariche tutte da rilegare.
          effetti: { ferite: 2, tormento: 0.5 }
          vai: superficie-fratturata
      - testo: "Lanciare un sasso contro la parete lontana"
        descrizione: "Un sasso che batte in fondo alla galleria è un passo di qualcun altro. Va tirato forte, e lontano."
        prova: { attributo: fisico, abilita: [armi-da-distanza, atletica], difficolta: Difficile }
        successo:
          titolo: Il passo di qualcun altro
          testo: |
            Tiri il sasso più grosso che hai sotto mano contro la parete in
            fondo alla galleria, e batte due volte e rotola. La testa si gira di
            colpo verso il rumore e ci va, trascinandosi dietro la carne grigia
            e lasciandoti libero il camino.
          pe: { armi-da-distanza: 5 }
          segue: avv-divoratore-il-camino
        fallimento:
          titolo: Il sasso corto
          testo: |
            Il sasso batte troppo vicino, e la testa viene dritta verso di te.
            Salti nel camino e sali con la bocca che ti morde la suola dello
            stivale, mentre sotto i sassi tranciano la miccia e lasciano le
            cariche tutte da rilegare.
          effetti: { ferite: 2, tormento: 0.5 }
          vai: superficie-fratturata
      - testo: "Aspettare il tocco della campana di Maela"
        descrizione: "Maela suona a ogni ora, e il verme va verso il suono. Se l'ora arriva prima della miccia, la testa se ne va da sola."
        requisiti: [avv-divoratore.campana >= 1]
        prova: { attributo: mentale, abilita: resilienza, difficolta: Difficile }
        successo:
          titolo: La campana delle ore
          testo: |
            Conti, con la testa del verme davanti e la miccia che brucia alle
            spalle, finché la bocca si ferma e si alza verso la volta. Lassù,
            sullo sperone, Maela ha suonato l'ora. La testa arretra nella parete
            e sale verso il suono, e il camino davanti a te è libero.
          pe: { resilienza: 5 }
          segue: avv-divoratore-il-camino
        fallimento:
          titolo: L'ora sbagliata
          testo: |
            L'ora non arriva, e quando non ne puoi più ti muovi. La testa ti è
            addosso in un momento. Risali il camino con un braccio sanguinante,
            mentre sotto i sassi tranciano la miccia e lasciano le cariche tutte
            da rilegare.
          effetti: { ferite: 2, tormento: 0.5 }
          vai: superficie-fratturata

  # ------------------------------------------------------------ il cuore, terza prova: il camino
  - id: avv-divoratore-il-camino
    tipo: seguito
    immagine: icone/mine-explosion
    titolo: Il camino
    sommario: "La miccia brucia verso le cariche, e il camino è dieci braccia di roccia rotta fino alla luce."
    luogo: Le gallerie del Divoratore, il camino della Strozza
    area: avv-divoratore
    requisiti: [avventura.divoratore == 5]
    testo: |
      Il camino sale per dieci braccia fra sassi rotti, storto, largo quanto le
      tue spalle, e in cima c'è la striscia di luce grigia del fondo della gola.
      Dal buio della galleria arriva il primo colpo, quello lontano delle
      gallerie vecchie, e la montagna sussulta tutta insieme. La polvere scende
      dal camino come farina da un setaccio.

      Il secondo colpo è più vicino. Le cariche scoppiano una dopo l'altra
      venendo verso di te, e l'ultima è sotto i tuoi piedi.

      Ai piedi del camino, nella roccia nera del pilone, il verme ha lasciato
      una nicchia stretta, dove ci sta una persona rannicchiata.

      {atletica Media fallita} Le braccia ti ricordano una per una tutte le
      cariche che hanno portato fin qui, e chiedono se dieci braccia di roccia
      siano proprio necessarie.

      {resistenza Difficile} Il pilone, quando la Strozza crolla, resta in
      piedi. Chi ci sta dentro deve soltanto reggere il colpo.
    opzioni:
      - testo: "Salire il camino a forza di braccia"
        descrizione: "Dieci braccia, presa dopo presa, con la montagna che salta sotto di te."
        prova: { attributo: fisico, abilita: atletica, difficolta: Difficile }
        successo:
          titolo: La luce
          testo: |
            Sali presa dopo presa con i colpi che arrivano da sotto sempre più
            vicini, e quando metti la mano fuori sul fondo della gola l'ultima
            carica scoppia sotto di te. La spinta ti butta fuori dal camino come
            un tappo. Rotoli sui sassi mentre la Strozza si siede su se stessa
            con un rumore lunghissimo, e la gola si riempie di polvere.

            Quando la polvere si posa, la terra è ferma. Più su, sullo sperone
            sopra lo slargo, la campana delle ore suona da sola tre tocchi.
          pe: { atletica: 5 }
          effetti: { avventura.divoratore: 1 }
          vai: superficie-fratturata
        fallimento:
          titolo: Il sasso che cede
          testo: |
            A metà del camino un sasso ti cede sotto la mano e torni in fondo,
            sul pilone. Il sasso trancia la miccia, e le cariche vicine restano
            mute. Esci dalle gallerie dalla parte della tana, molte ore dopo,
            con il verme sceso di nuovo verso il fondo e le cariche tutte da
            rilegare.
          effetti: { ferite: 2, tormento: 0.5 }
          vai: superficie-fratturata
      - testo: "Salire di schiena e di piedi"
        descrizione: "Il camino è stretto. Con la schiena contro una parete e i piedi contro l'altra si sale senza cadere, a patto di non avere fretta."
        prova: { attributo: fisico, abilita: acrobazia, difficolta: Difficile }
        successo:
          titolo: Di schiena
          testo: |
            Sali con la schiena contro una parete e i piedi contro l'altra, a
            spinte corte, mentre le cariche scoppiano sempre più vicine e il
            camino ti trema intorno. Esci sul fondo della gola un momento prima
            dell'ultima. Dietro di te la Strozza si siede su se stessa con un
            rumore lunghissimo, e la gola si riempie di polvere.

            Quando la polvere si posa, la terra è ferma. Più su, sullo sperone
            sopra lo slargo, la campana delle ore suona da sola tre tocchi.
          pe: { acrobazia: 5 }
          effetti: { avventura.divoratore: 1 }
          vai: superficie-fratturata
        fallimento:
          titolo: La schiena che scivola
          testo: |
            Una scossa ti fa scivolare la schiena e torni in fondo al camino in
            mezzo ai sassi, che tranciano la miccia. Le cariche vicine restano
            mute. Esci dalle gallerie dalla parte della tana molte ore dopo, con
            il verme sceso verso il fondo e le cariche tutte da rilegare.
          effetti: { ferite: 2, tormento: 0.5 }
          vai: superficie-fratturata
      - testo: "Rintanarti nella nicchia del pilone e aspettare"
        descrizione: "Il pilone resta in piedi, e la nicchia è stretta. Bisogna reggere il colpo che arriva, e poi uscire da sotto la frana."
        prova: { attributo: fisico, abilita: resistenza, difficolta: Difficile }
        successo:
          titolo: Nella nicchia
          testo: |
            Ti infili nella nicchia con le braccia sopra la testa, e l'ultima
            carica scoppia a dieci passi. Il pilone tiene. Intorno a te la
            Strozza crolla per un tempo lunghissimo, e quando smette risali il
            camino mezzo chiuso con le mani, verso la luce. Fuori, la terra è
            ferma, e sullo sperone sopra lo slargo la campana delle ore suona da
            sola tre tocchi.
          pe: { resistenza: 5 }
          effetti: { avventura.divoratore: 1 }
          vai: superficie-fratturata
        fallimento:
          titolo: Il colpo nella nicchia
          testo: |
            La prima carica vicina scoppia, e il colpo nella nicchia ti toglie i
            sensi. Quando ti svegli la miccia è tranciata, le altre cariche sono
            mute e il verme è sceso verso il fondo. Esci dalla tana a sera, e le
            cariche sono tutte da rilegare.
          effetti: { ferite: 2, tormento: 0.5 }
          vai: superficie-fratturata
