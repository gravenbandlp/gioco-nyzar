# L'oggetto di grado 4 dell'Avventura del Divoratore, dato dall'epilogo (`avv-divoratore-la-placca`, storia.yaml).
# La placca crepata della bocca del verme, che il colpo della Strozza ha sputato sui terrazzi di sotto: il fabbro di
# Tuarmir ci ha ribattuto un bordo di ferro e una croce di frassino. Scudo su base `scudo`, grado 4 con un difetto
# (Pesante: pesa come una porta), quindi 5 punti: due dadi in difesa, Ultimo respiro (regge anche quando crolla
# tutto) e un Talento in Resistenza. Il modello di riferimento per uno scudo è la Sordina della Campana (grado 5:
# tre dadi e Ultimo respiro, senza difetti).
oggetti:
  - id: avv-divoratore-placca-del-divoratore
    nome: Placca del Divoratore
    immagine: icone/tooth
    descrizione: "Una placca del dente del Divoratore grande quanto uno scudo. Ha il colore di un'unghia vecchia, ed è liscia da una parte e rigata dall'altra dalla roccia che ha macinato. Il fabbro di Tuarmir ci ha ribattuto intorno un bordo di ferro e dietro una croce di frassino. Pesa come una porta, e regge come una montagna."
    slot: scudo
    base: scudo
    grado: 4
    dadi: 2
    proprieta: { ultimoRespiro: true, talento: { resistenza: 1 } }
    difetti: [pesante]
