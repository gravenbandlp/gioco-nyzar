# I nemici dell'Avventura del Divoratore, tarati con `npx tsx scripts/simula-fine.ts avv-divoratore-` sul profilo
# «fine contenuti» (docs/piano-avventure.md: gregari fra il 70 e l'85%, il boss fra il 40 e il 55%).
# - Lo sciame: le scolopendre di grotta che il verme spinge fuori dalla roccia (la grotta dei letti, le gallerie
#   vecchie, la fuga nella Strozza). Gregari.
# - I rodipietra: vermi grandi come un cane che seguono il Divoratore e mangiano quello che lascia (le gallerie
#   fresche, la Strozza). Gregari.
# - La bocca del Divoratore: la testa del verme che sfonda la galleria al cuore. Non si uccide: lo scontro dura finché
#   la bocca si ritira abbastanza da lasciarti accendere le micce (boss, seconda prova del cuore).
nemici:
  - id: avv-divoratore-scolopendra
    immagine: icone/centipede
    nome: Scolopendra di grotta
    descrizione: "Una scolopendra bianca lunga come un braccio, cieca, con le zampe che tintinnano sulla pietra come aghi. Vive nelle crepe sotto Tuarmir e non esce mai alla luce, finché una bestia più grossa non la caccia fuori."
    attacco: 5
    difesa: 4
    difesaMentale: 3
    pf: 11
    danno: 3
    riduzione: 3
    iniziativa: 4
    tratti: [animale]

  - id: avv-divoratore-rodipietra
    immagine: icone/earth-worm
    nome: Rodipietra
    descrizione: "Un verme grigio grande come un cane da pastore, con una bocca rotonda piena di dentini piatti. Segue il Divoratore nelle sue gallerie e mangia la roccia mezza digerita che si lascia dietro, e quando la roccia finisce assaggia il resto."
    attacco: 6
    difesa: 3
    difesaMentale: 3
    pf: 11
    danno: 3
    riduzione: 3
    iniziativa: 2
    tratti: [animale]

  - id: avv-divoratore-bocca
    immagine: icone/worm-mouth
    nome: La bocca del Divoratore
    descrizione: "La testa del Divoratore, larga quanto la galleria, senza occhi. La bocca è un anello di placche di dente grandi come scudi, che girano piano una contro l'altra e macinano la roccia come grano."
    attacco: 6
    difesa: 3
    difesaMentale: 6
    pf: 24
    danno: 4
    riduzione: 5
    iniziativa: 2
    tratti: [animale]

scontri:
  - { id: avv-divoratore-lo-sciame, nome: "Lo sciame di scolopendre", nemici: [avv-divoratore-scolopendra, avv-divoratore-scolopendra], feriteSconfitta: 2 }
  - { id: avv-divoratore-i-rodipietra, nome: "I rodipietra", nemici: [avv-divoratore-rodipietra, avv-divoratore-rodipietra], feriteSconfitta: 2 }
  - { id: avv-divoratore-la-bocca, nome: "La bocca del Divoratore", nemici: [avv-divoratore-bocca], feriteSconfitta: 3 }
