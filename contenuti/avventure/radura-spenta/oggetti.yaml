# L'oggetto dell'Avventura «La radura spenta»: il mantello della Culla, armatura di grado 4 che Tharn Koru dà
# nell'epilogo (storia.yaml), con o senza le foglia-rossa. Punti = grado + difetti (src/motore/contenuto.ts):
# 2 dadi in difesa + Schermata (2) + Silenziosa (1) = 5, su grado 4 più il difetto Riconoscibile (il collo di pelo
# bianco: al margine del Bosco di Velthar tutti sanno da dove viene). Modelli: la cappa delle mille corde della
# Gilda e il mantello di muschio del Circolo, di grado 3.
oggetti:
  - id: avv-radura-spenta-mantello-della-culla
    nome: Mantello della Culla
    immagine: icone/cloak
    descrizione: "Cuoio del margine conciato nella corteccia dei faggi, con un collo di pelo bianco che Arvel ha lasciato sulla riva della fonte. Il Maestro del Circolo ci ha soffiato sopra prima che lo cucissero, e la Marea ci scivola come la pioggia sulla cera. Non fa rumore fra i rami, e al margine tutti sanno da dove viene."
    slot: armatura
    base: cuoio-rinforzato
    grado: 4
    dadi: 2
    proprieta: { schermata: true, silenziosa: true }
    difetti: [riconoscibile]
