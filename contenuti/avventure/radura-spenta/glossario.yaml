# Le voci del glossario per i nomi nuovi dell'Avventura «La radura spenta», nel formato di
# contenuti/glossario/personaggi.yaml: presentazioni stabili, senza i segreti della storia (il vetro perso da Edo,
# il legame fra la luce della lanterna e il fuoco nero). Tharn Koru, il Circolo, il Bosco di Velthar, la Marea Grigia
# e le farfalle foglia-rossa hanno già la loro voce.
glossario:
  - id: edo-fiorani
    nome: Edo Fiorani
    alias: [Edo]
    tipo: personaggio
    sottotitolo: "Novizio del Circolo di Velthar, custode della lanterna di Ponente"
    testo: "Novizio del Circolo di Velthar di quindici o sedici anni, con la tunica grigioverde sempre sporca ai gomiti. Da un anno il Circolo gli ha affidato la lanterna di Ponente, al margine ovest del Bosco, e lui la accende ogni sera. Quando è nervoso dice «cioè» e si corregge da solo."
    requisiti: []

  - id: arvel
    nome: Arvel
    tipo: creatura
    sottotitolo: "Il cervo bianco della Culla delle Foglie"
    testo: "Un cervo bianco più alto di un cavallo da tiro, con le corna larghe come i rami di un albero d'inverno. Veglia la Culla delle Foglie nel cuore del Bosco di Velthar, e il Circolo dice che c'era già quando arrivarono i primi druidi. Si lascia avvicinare da pochissimi, e toccare da meno ancora."
    requisiti: []

  - id: culla-delle-foglie
    nome: Culla delle Foglie
    tipo: luogo
    sottotitolo: "La radura sacra del Bosco di Velthar"
    testo: "Un prato tondo nel cuore del Bosco di Velthar, chiuso da un anello di betulle incise con i segni più antichi del Circolo. Al centro c'è una quercia bassa con i rami che toccano terra, e sotto la quercia nascono le farfalle foglia-rossa. Il Circolo ci entra di rado e da ospite, e ai novizi è proibita."
    requisiti: []

  - id: lanterna-di-ponente
    nome: lanterna di Ponente
    alias: [cippo di Ponente]
    tipo: cosa
    sottotitolo: "La lanterna del margine ovest del Bosco di Velthar"
    testo: "Una lanterna di ferro appesa a un cippo di pietra al margine ovest del Bosco di Velthar, mezza giornata a ovest della strada. Brucia legno di lanterna dietro un disco di vetro verde, e i carovanieri la usano per orientarsi di notte. Un novizio del Circolo la accende ogni sera."
    requisiti: []

  - id: cavalli-di-fuoco-nero
    nome: cavalli di fuoco nero
    tipo: creatura
    sottotitolo: "Le bestie delle notti di Marea"
    testo: "Cavalli fatti di un fuoco nero senza luce né calore, che i carovanieri vedono correre sulla pianura nelle notti in cui sale la Marea Grigia. Dove passano il muschio diventa grigio e la corteccia si sfa. Si dice che bevano la Marea come gli altri cavalli bevono l'acqua."
    requisiti: []
