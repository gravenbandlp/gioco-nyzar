# I nemici e gli scontri dell'Avventura «La radura spenta» (docs/piano-avventure.md, n. 14).
# Tarati con `npx tsx scripts/simula-fine.ts avv-radura-spenta-` sul profilo «fine contenuti» (Fisico 4, Armi da
# mischia 4, Spadone di Uzgreth, cotta di maglia). Un gregario da solo, con i valori del capitolato, cade quasi
# sempre (99%): per stare fra il 70 e l'85% i gregari vengono in coppia, come i pulitori della Campana.
# - Il bosco corrotto (stanze 1-3): i rovi marci, 79%.
# - La fossa delle serpi (stanze 4-6): le serpi di cenere, 79%.
# - La notte al cippo (sviluppo) e l'anello di betulle (stanze 7-9): due giumente di fuoco nero, 71%.
# - Il cuore, in due fasi brevi (feriteSconfitta 3, riduzione 5): le quattro giumente che corrono legate, una bestia
#   sola (69%), poi lo stallone con Arvel che torna e carica insieme a te (72%); le due insieme fanno circa il 50%.
#   Il motore non ha alleati in combattimento: la carica di Arvel sta nella difesa più bassa dello stallone e nella
#   via in più della seconda fase (avv-radura-spenta.cervo).
nemici:
  - id: avv-radura-spenta-giumenta-nera
    immagine: icone/horse-head
    nome: Giumenta di fuoco nero
    descrizione: "Una cavalla fatta di un fuoco che non fa luce, nero come la pece e freddo al tatto. Dove passa il muschio diventa grigio e la corteccia si sfa, e nel petto le batte un grumo di cristallo spento."
    attacco: 6
    difesa: 3
    difesaMentale: 5
    pf: 10
    danno: 3
    riduzione: 3
    iniziativa: 3
    tratti: [eco]

  - id: avv-radura-spenta-rovo-marcio
    immagine: icone/thorny-vine
    nome: Rovo marcio
    descrizione: "Un rovo del margine che il fuoco nero ha fatto marcire senza ucciderlo. Le spine sono diventate molli e lunghe come aghi da materasso, e si piegano verso il caldo di chi passa."
    attacco: 6
    difesa: 2
    difesaMentale: 6
    pf: 12
    danno: 3
    riduzione: 3
    iniziativa: 2

  - id: avv-radura-spenta-serpe-di-cenere
    immagine: icone/snake
    nome: Serpe di cenere
    descrizione: "Una serpe della radura che ha fatto il nido sotto le foglie bruciate e ci è rimasta al caldo del fuoco nero. Le squame le sono diventate grigie e porose come la cenere, e morde senza sibilare."
    attacco: 5
    difesa: 4
    difesaMentale: 3
    pf: 12
    danno: 3
    riduzione: 3
    iniziativa: 4
    tratti: [animale]

  - id: avv-radura-spenta-branco-nero
    immagine: icone/horse-head
    nome: Le quattro giumente
    descrizione: "Quattro giumente di fuoco nero che corrono in cerchio così strette da sembrare una bestia sola, con il fuoco che passa dall'una all'altra. Colpirne una è colpirle tutte, e lo stesso vale per i loro zoccoli."
    attacco: 6
    difesa: 4
    difesaMentale: 5
    pf: 22
    danno: 3
    riduzione: 5
    iniziativa: 4
    tratti: [eco]

  - id: avv-radura-spenta-stallone-nero
    immagine: icone/horse-head
    nome: Lo stallone di fuoco nero
    descrizione: "Il più grande dei cinque, con uno zoccolo spaccato e la criniera che si alza dritta come il fumo di un camino. Le giumente corrono dietro a lui, e il grumo di cristallo che ha nel petto è grosso come un pugno."
    attacco: 6
    difesa: 3
    difesaMentale: 5
    pf: 16
    danno: 4
    riduzione: 5
    iniziativa: 3
    tratti: [eco]

scontri:
  - { id: avv-radura-spenta-le-giumente, nome: "Due giumente di fuoco nero", nemici: [avv-radura-spenta-giumenta-nera, avv-radura-spenta-giumenta-nera], feriteSconfitta: 2 }
  - { id: avv-radura-spenta-i-rovi, nome: "I rovi marci", nemici: [avv-radura-spenta-rovo-marcio, avv-radura-spenta-rovo-marcio], feriteSconfitta: 2 }
  - { id: avv-radura-spenta-le-serpi, nome: "Le serpi di cenere", nemici: [avv-radura-spenta-serpe-di-cenere, avv-radura-spenta-serpe-di-cenere], feriteSconfitta: 2 }
  - { id: avv-radura-spenta-il-branco-nero, nome: "Le quattro giumente", nemici: [avv-radura-spenta-branco-nero], feriteSconfitta: 3 }
  - { id: avv-radura-spenta-lo-stallone-nero, nome: "Lo stallone di fuoco nero", nemici: [avv-radura-spenta-stallone-nero], feriteSconfitta: 3 }
