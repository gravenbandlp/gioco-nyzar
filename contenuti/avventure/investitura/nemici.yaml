# I nemici e gli scontri dell'Avventura dell'investitura (docs/piano-avventure.md, n. 12). Tarati con
# `npx tsx scripts/simula-fine.ts avv-investitura-` sul profilo «fine contenuti» (Fisico 4, Armi da mischia 4,
# Spadone di Uzgreth, cotta di maglia): gregari fra il 70 e l'85%, Severina fra il 40 e il 55% (al 12 ottobre 2026:
# sciami 79%, mantelli 71%, fondatori 75%, il nonno con un fondatore 76%, Severina 50%). Quando Marella e Quintus
# salgono con gli ospiti (avv-investitura.ospiti >= 4) Severina ha perso metà delle sue ombre, e lo scontro è più
# facile (79%). Contro «fine capitolo» quasi tutto è Molto difficile o Impossibile.
# - Le prime ore (profondità 0-2): gli sciami delle travi, i pipistrelli che vivono sotto il tetto di rame.
# - Le ore di mezzo (3-4): i mantelli del guardaroba, riempiti dal buio dello Spegnitoio (tratto eco).
# - Le ultime ore (6-9): i fondatori di pietra della Galleria (in coppia) e la statua del nonno di Julia con un
#   fondatore dietro, mossi dai cristalli che Severina ha incastrato nelle orbite.
# - Il cuore: Severina Castaldi con lo Spegnitoio, che le stringe addosso le ombre della sala.
nemici:
  - id: avv-investitura-sciame
    immagine: icone/crow-dive
    nome: Sciame delle travi
    descrizione: "Un grappolo di pipistrelli staccato dalle travi della Sala delle Promesse. Vivono da sempre sotto il tetto di rame del Maniero, e stanotte il buio e il fumo dolce li hanno svegliati tutti insieme."
    attacco: 5
    difesa: 4
    difesaMentale: 2
    pf: 12
    danno: 3
    riduzione: 3
    iniziativa: 4
    tratti: [animale]

  - id: avv-investitura-mantello-d-ombra
    immagine: icone/cloak
    nome: Mantello d'ombra
    descrizione: "Il mantello di un ospite, preso dal guardaroba dell'atrio e riempito di buio fino al cappuccio. Cammina senza piedi e colpisce con le maniche, che sono fredde come la pietra di una cantina."
    attacco: 6
    difesa: 3
    difesaMentale: 5
    pf: 10
    danno: 3
    riduzione: 3
    iniziativa: 3
    tratti: [eco]

  - id: avv-investitura-fondatore-di-pietra
    immagine: icone/black-knight-helm
    nome: Fondatore di pietra
    descrizione: "Una statua della Galleria dei Fondatori, un Castaldi dei primi anni della città scolpito a grandezza d'uomo, con un cristallo incastrato in ogni orbita. Si muove a scatti, e quando colpisce lo fa con tutto il suo peso."
    attacco: 5
    difesa: 2
    difesaMentale: 6
    pf: 13
    danno: 4
    riduzione: 3
    iniziativa: 1

  - id: avv-investitura-statua-del-nonno
    immagine: icone/family-tree
    nome: La statua del nonno
    descrizione: "La statua del nonno di Julia, quello del detto della casata, con una bilancia di pietra in una mano e un rotolo nell'altra. Fa un passo ogni volta che la candela della veglia tremola, e la bilancia la usa come una mazza."
    attacco: 6
    difesa: 3
    difesaMentale: 6
    pf: 12
    danno: 3
    riduzione: 3
    iniziativa: 1

  - id: avv-investitura-severina
    immagine: icone/hooded-figure
    nome: Severina Castaldi
    descrizione: "La cugina del ramo di Laresh, con le dita gialle di cera e lo Spegnitoio fra le mani. Le ombre della sala le stanno addosso come una cappa, prendono i colpi per lei e colpiscono dove lei guarda."
    attacco: 6
    difesa: 4
    difesaMentale: 4
    pf: 28
    danno: 3
    riduzione: 5
    iniziativa: 3

  - id: avv-investitura-severina-alle-strette
    immagine: icone/hooded-figure
    nome: Severina Castaldi, alle strette
    descrizione: "Severina con lo Spegnitoio, nella luce delle lampade a olio che gli ospiti hanno portato su dal magazzino. Le ombre le si sono staccate di dosso per metà, e Quintus Vael le sbarra la strada delle scale."
    attacco: 6
    difesa: 4
    difesaMentale: 4
    pf: 24
    danno: 3
    riduzione: 4
    iniziativa: 3

scontri:
  - { id: avv-investitura-lo-sciame, nome: "Gli sciami delle travi", nemici: [avv-investitura-sciame, avv-investitura-sciame], feriteSconfitta: 2 }
  - { id: avv-investitura-i-mantelli, nome: "I mantelli d'ombra", nemici: [avv-investitura-mantello-d-ombra, avv-investitura-mantello-d-ombra], feriteSconfitta: 2 }
  - { id: avv-investitura-i-fondatori, nome: "I fondatori di pietra", nemici: [avv-investitura-fondatore-di-pietra, avv-investitura-fondatore-di-pietra], feriteSconfitta: 2 }
  - { id: avv-investitura-il-nonno, nome: "La statua del nonno", nemici: [avv-investitura-statua-del-nonno, avv-investitura-fondatore-di-pietra], feriteSconfitta: 2 }
  - { id: avv-investitura-severina, nome: "Severina Castaldi", nemici: [avv-investitura-severina], feriteSconfitta: 3 }
  - { id: avv-investitura-severina-alle-strette, nome: "Severina Castaldi, alle strette", nemici: [avv-investitura-severina-alle-strette], feriteSconfitta: 3 }
