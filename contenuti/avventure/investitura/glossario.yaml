# Glossario dell'Avventura dell'investitura: i nomi nuovi, da approvare in blocco (Luca). Personaggi: Severina
# Castaldi (la cugina del ramo di Laresh) e Lamberto Pellegra (il precettore), ognuno con la voce di prima e quella
# di dopo la notte della veglia. Luoghi e cose del Maniero Castaldi: la Sala delle Promesse, la Galleria dei
# Fondatori, il Libro delle Promesse, lo Spegnitoio. Dal canone: Mira, Aldous, Marella, Vesper, Julia ed Ettore
# Castaldi, Eolio Drest, Quintus Vael, Brem Anthos.
glossario:
  - id: severina-castaldi
    nome: Severina Castaldi
    alias: [Severina]
    tipo: personaggio
    sottotitolo: "Cugina dei Castaldi, del ramo di Laresh"
    testo: "Cugina lontana dei Castaldi, del ramo che vive a Laresh, dove tiene gli alveari dietro casa e fa candele per mezza valle. Veste di lana grezza e ha le dita gialle di cera. Al Maniero viene di rado, e quando entra in una sala qualcuno smette di parlare."
    requisiti: [avventura.investitura < 6]

  - id: severina-castaldi-dopo-la-veglia
    nome: Severina Castaldi
    alias: [Severina]
    tipo: personaggio
    sottotitolo: "Cugina dei Castaldi, del ramo di Laresh"
    testo: "Cugina lontana dei Castaldi, ceraia a Laresh, con le dita gialle di cera. Da ragazza il padre di Aldous le aveva promesso il Libro delle Promesse, e la notte dell'investitura di Mira ha provato a prenderselo con uno Spegnitoio comprato al Mercato delle Ombre. Che cosa ne è stato di lei l'ha deciso il testimone."
    requisiti: [avventura.investitura >= 6]

  - id: lamberto-pellegra
    nome: Lamberto Pellegra
    alias: [Lamberto]
    tipo: personaggio
    sottotitolo: "Precettore al Maniero Castaldi"
    testo: "Uno dei precettori di Vesper e Mira Castaldi, a cui insegna lettere e poesia. È un uomo magro con il colletto liso e le mani che sudano, e per le feste regala libri di poesie. Nei Quartieri Alti si dice che giochi a carte, e che perda più spesso di quanto possa permettersi."
    requisiti: [avventura.investitura < 6]

  - id: lamberto-pellegra-dopo-la-veglia
    nome: Lamberto Pellegra
    alias: [Lamberto]
    tipo: personaggio
    sottotitolo: "L'ex precettore del Maniero Castaldi"
    testo: "Era uno dei precettori di Vesper e Mira Castaldi, magro, con il colletto liso e i debiti di gioco. La notte dell'investitura ha provato ad aprire la porta del magazzino del grano per fare da testimone a Severina Castaldi, che in cambio gli pagava i debiti, e da allora al Maniero non insegna più."
    requisiti: [avventura.investitura >= 6]

  - id: sala-delle-promesse
    nome: Sala delle Promesse
    tipo: luogo
    sottotitolo: "Maniero Castaldi, secondo piano"
    testo: "La sala lunga del secondo piano del Maniero Castaldi, sotto un soffitto di travi scure dove vivono i pipistrelli. In fondo c'è l'altare di pietra chiara con il Libro delle Promesse, e le finestre della loggia danno sui tetti di rame. Ci si arriva dalla Galleria dei Fondatori."
    requisiti: []

  - id: galleria-dei-fondatori
    nome: Galleria dei Fondatori
    tipo: luogo
    sottotitolo: "Maniero Castaldi, secondo piano"
    testo: "Il corridoio del Maniero Castaldi che porta alla Sala delle Promesse. Ha dodici nicchie, e in ognuna c'è una statua. Sono i Castaldi dei primi anni della città, scolpiti in pietra chiara a grandezza d'uomo, con il libro sotto il braccio o la mano sull'elsa."
    requisiti: []

  - id: libro-delle-promesse
    nome: Libro delle Promesse
    tipo: cosa
    sottotitolo: "Il libro della casata Castaldi"
    testo: "Il libro dei Castaldi, incatenato all'altare della Sala delle Promesse. Ci sono scritte a mano le promesse della casata dai primi anni della città, e la firma di ogni erede, fatta all'alba dopo una notte di veglia e davanti a un testimone che non porta il nome dei Castaldi."
    requisiti: []

  - id: spegnitoio
    nome: Spegnitoio
    tipo: cosa
    sottotitolo: "Un reperto dei Precursori"
    testo: "Un reperto dei Precursori di metallo nero, della forma di una campana da tavola, con il manico ad anello e il bordo inciso di segni. Scoperto, beve la luce che ha intorno e dà corpo alle ombre, che vanno a riempire le cose vuote. Severina Castaldi l'ha comprato al Mercato delle Ombre."
    requisiti: [avventura.investitura >= 5]
