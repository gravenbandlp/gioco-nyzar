# La ricompensa dell'Avventura dell'investitura: la lama dell'investitura, che Mira Castaldi dà al testimone
# nell'ultimo passo (avv-investitura-la-lama-dell-investitura). Grado 4 come i gradi 5 delle quest di fazione:
# 2 dadi, Affilata 1 e Lucida (5 punti) con il difetto Riconoscibile, perché sul piatto della lama c'è il sigillo
# delle bilance e nei Quartieri Alti tutti sanno da dove viene.
oggetti:
  - id: avv-investitura-lama-dell-investitura
    nome: Lama dell'investitura
    immagine: icone/rune-sword
    descrizione: "La spada lunga che sta sull'altare della Sala delle Promesse durante la veglia, per tagliare il nastro della pagina dopo la firma dell'erede. Ha l'elsa di ferro brunito e il sigillo delle bilance inciso sul piatto, e la lama non manda riflessi nemmeno al sole. Chi la porta dorme senza sogni."
    slot: arma
    base: spada-lunga
    grado: 4
    dadi: 2
    proprieta: { affilata: 1, lucida: true }
    difetti: [riconoscibile]
