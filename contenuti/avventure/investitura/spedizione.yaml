# L'Avventura dell'investitura, la spedizione: l'assedio della Sala delle Promesse, dalla mezzanotte all'alba
# (avventura.investitura == 5). È la stessa macchina delle altre spedizioni, raccontata come un assedio: la profondità
# conta le tacche della candela della veglia, che brucia sull'altare dalla mezzanotte all'alba in dieci tacche, e le
# stanze sono i punti della casa dove il buio dello Spegnitoio attacca. La famiglia e gli ospiti sono chiusi nel
# magazzino del grano con Quintus Vael; tu tieni il libro. La ritirata riporta ai Quartieri Alti, e la veglia si rifà
# da capo la notte dopo.
# L'ingresso `avv-investitura-la-sala-al-buio` sta fuori dall'area (Quartieri Alti) e si apre subito dopo i voti:
# una prova Media, la via di Brem sveglio (avv-investitura.cera) o due rintocchi.
# Le stanze vanno in fasce di profondità (una stanza superata non ricompare nella stessa visita):
# - 0-2, le prime ore: le travi (gli sciami), il fumo dolce, gli ultimi sulla scala (+1 ospite), la loggia.
#   Prove Medie e Difficili.
# - 3-4, le ore di mezzo: i mantelli d'ombra, le lampade della casa svuotate (avv-investitura.dono == 1, la
#   lanterna), il montavivande, la porta di ferro (+1 ospite; avv-investitura.casa). Prove Difficili.
# - 5, la svolta: `avv-investitura-il-precettore`, non ripetibile, finché avv-investitura.precettore == 0 (il
#   precettore apre la porta del magazzino; avv-investitura.sospetto apre la via di Eolio, la via lunga costa un
#   ospite). Nelle notti seguenti a profondità 5 c'è `avv-investitura-la-quinta-tacca`, la tregua.
# - 6-9, le ultime ore: la Galleria dei Fondatori (scontro; avv-investitura.dono == 3, i nomi), il busto sulla scala
#   (Molto difficile), la statua del nonno (scontro), la candela della veglia (Molto difficile). Prove Difficili.
# Ogni stanza ha una via senza prova da 2 rintocchi più ½ negativa (3 rintocchi da 6 a 9); chi fallisce prende ½
# negativa e non scende.
# Il cuore a 10 è `avv-investitura-l-ultima-tacca`: Severina Castaldi con lo Spegnitoio. Lo scontro, due prove
# Difficili (strapparle lo Spegnitoio, girarle contro il bordo), la promessa mancata (avv-investitura.storia,
# Difficile) e gli ospiti che salgono con Marella e Quintus (avv-investitura.ospiti >= 4, scontro più facile).
# Chi vince porta la pista a 6; chi perde prende una negativa piena e torna ai Quartieri Alti.
aree:
  - id: avv-investitura
    immagine: fazioni/famiglia-castaldi
    nome: La notte della veglia
    sommario: "Il Maniero Castaldi al buio, dalla mezzanotte all'alba. Gli ospiti sono chiusi nel magazzino del grano, e il libro resta sull'altare con te."
    spedizione: { ritorno: quartieri-alti, soglia: 10, stanze: 3 }
    testo: |
      Il Maniero Castaldi è al buio dal tetto di rame al seminterrato. L'unica
      luce è la candela della veglia, sull'altare della Sala delle Promesse, che
      brucia sotto la sua campana di vetro dalla mezzanotte all'alba e conta la
      notte in dieci tacche.

      La famiglia e gli ospiti sono chiusi nel magazzino del grano, dietro la
      porta di ferro, con Quintus Vael. Di sopra ci sei tu, con il libro aperto
      alla pagina di Mira. Il resto della casa è del buio, e nel buio camminano
      cose che a cena stavano ferme.

colonna:
  - { contesto: area, id: avv-investitura, musica: a-hundred-deaths, ambiente: temple-quiet }

storylet:
  # ------------------------------------------------------------ l'ingresso, ai Quartieri Alti
  - id: avv-investitura-la-sala-al-buio
    immagine: icone/candle-holder
    titolo: La sala al buio
    sommario: "La porta di ferro del magazzino si è chiusa. Nella Sala delle Promesse restano il libro, la candela della veglia e te."
    luogo: Il Maniero Castaldi, la Sala delle Promesse
    area: quartieri-alti
    requisiti: [avventura.investitura == 5]
    testo: |
      Senti la porta di ferro chiudersi tre piani più sotto, e poi la spranga
      che cade nei ganci. Nella Sala delle Promesse restano l'altare, il libro
      aperto alla pagina di Mira e la candela della veglia sotto la campana di
      vetro, con la fiamma dritta. Intorno, le guardie dormono dove sono cadute.

      La candela ha dieci tacche e brucia dalla mezzanotte all'alba. Quando
      arriverà all'ultima Mira salirà a firmare, e fino ad allora il libro resta
      sull'altare, con te accanto. Se la veglia si rompe, la casata la rifà la
      notte dopo, da capo.

      Il buio comincia appena fuori dal cerchio della candela. Dalla galleria
      arriva un rumore di passi leggeri, che si fermano quando ti volti.

      {intimidire Media} Chi sta nel buio vuole che tu scappi nella prima ora.
      Se arrivi alla seconda, la paura comincia a cambiare lato.
    opzioni:
      - testo: "Metterti con le spalle all'altare e lasciare che gli occhi si abituino"
        descrizione: "Il buio della sala ha una forma. Bisogna guardarlo abbastanza a lungo da conoscerla."
        prova: { attributo: mentale, abilita: [resilienza, percezione], difficolta: Media }
        successo:
          titolo: Le spalle all'altare
          testo: |
            Ti appoggi all'altare con la catena del libro contro la schiena, e
            guardi il buio finché non riconosci le sagome dei candelabri e delle
            guardie a terra. La galleria resta più nera del resto. Ci tieni gli
            occhi sopra, e aspetti la prima tacca.
          pe: { resilienza: 2 }
          vai: avv-investitura
        fallimento:
          titolo: Le forme
          testo: |
            Guardi il buio, e il buio comincia a mostrarti cose che non ci sono,
            una mano sulla balaustra e poi una faccia nella porta della
            galleria. Chiudi gli occhi e conti fino a cento prima di riaprirli.
          effetti: { tormento: 0.5 }
      - testo: "Svegliare Brem, che hai tenuto alla finestra"
        descrizione: "Brem ha passato la sera all'aria fresca della loggia. Forse è l'unico della guardia che si sveglia, se lo scuoti."
        requisiti: [avv-investitura.cera >= 1]
        esito:
          titolo: Brem Anthos
          testo: |
            Brem è seduto sotto la finestra della loggia, con gli occhi
            socchiusi e la mano sull'elsa. Lo scuoti due volte, e alla seconda
            si alza con un grugnito e la spalla che scricchiola. Si mette
            all'imbocco della scala, dove nessuno sale senza passargli accanto.
            «Tu il libro, io la scala» dice, e per un poco il buio sembra più
            piccolo.
          vai: avv-investitura
      - testo: "Aspettare in piedi con la mano sulla catena del libro"
        descrizione: "Si sta fermi, e si lascia che la notte cominci. Ci vogliono tempo e nervi saldi."
        costo: 2
        esito:
          titolo: La catena
          testo: |
            Resti in piedi accanto al libro con la mano sulla catena, finché il
            ferro non diventa caldo quanto la mano. Dalla galleria i passi
            leggeri si avvicinano e si allontanano molte volte. Quando la
            candela arriva alla prima tacca hai le dita indolenzite, e ancora
            non hai visto niente.
          effetti: { tormento: 0.5 }
          vai: avv-investitura

  # ------------------------------------------------------------ 0-2 · le travi
  - id: avv-investitura-le-travi
    immagine: icone/crow-dive
    titolo: Le travi
    sommario: "Sotto il soffitto della sala le travi sono nere di pipistrelli, e il buio li ha svegliati tutti."
    luogo: La Sala delle Promesse, sotto le travi
    area: avv-investitura
    ripetibile: true
    requisiti: [avventura.investitura == 5, profondita.avv-investitura <= 2]
    testo: |
      Il fruscio viene dalle travi. Alla luce della candela della veglia vedi
      appena il soffitto, e le travi sono coperte di pipistrelli appesi a
      grappoli, con le ali chiuse come ombrelli bagnati. Vivono da sempre sotto
      il tetto di rame del Maniero, e nessuno ci aveva mai fatto caso. Adesso si
      staccano a decine e girano sopra l'altare, ogni volta più bassi, verso
      l'unica fiamma accesa.

      {natura Media} Cercano il caldo, e le falene che la fiamma attira. Una
      luce più grande, lontano dall'altare, se li porterebbe via.
    opzioni:
      - testo: "Riaccendere un candelabro in fondo alla sala"
        descrizione: "I pipistrelli vanno alla luce più grande. Un candelabro acceso lontano dall'altare li tira via quasi tutti."
        prova: { attributo: mentale, abilita: [natura, percezione], difficolta: Media }
        successo:
          titolo: Il candelabro
          testo: |
            Accendi con l'acciarino tre candele del candelabro più lontano
            dall'altare. Lo sciame si stacca dalla campana di vetro e si
            raccoglie sopra le fiammelle nuove, e tu torni al libro senza che
            un'ala ti sfiori.
          pe: { natura: 2 }
          effetti: { profondita.avv-investitura: 1 }
        fallimento:
          titolo: Il fumo
          testo: |
            Accendi le candele, e il fumo dolce ti arriva in faccia prima che i
            pipistrelli si muovano. Ti ritrovi seduto sul pavimento senza averlo
            deciso, e quando ti rialzi lo sciame è ancora sopra l'altare.
          effetti: { tormento: 0.5 }
      - testo: "Difendere la fiamma con la lama"
        descrizione: "Sono centinaia, e vengono giù tutti insieme verso la fiamma."
        combattimento: avv-investitura-lo-sciame
        vittoria:
          titolo: Le ali a terra
          testo: |
            Colpisci lo sciame a ogni passaggio finché il pavimento intorno
            all'altare non è coperto di ali. I pipistrelli rimasti tornano sulle
            travi, e da lì ti guardano appesi a testa in giù.
          effetti: { profondita.avv-investitura: 1 }
        sconfitta:
          titolo: Le unghie
          testo: |
            Lo sciame ti si chiude addosso e ti graffia le mani e il collo,
            finché non ti butti sotto l'altare con le braccia sulla testa.
            Quando se ne va, sanguini da dieci graffi.
          effetti: { ferite: 0.5 }
      - testo: "Lasciare che si posino su di te"
        descrizione: "Cercano il caldo, e una persona è calda quanto una fiamma. Se non ti muovi, si posano su di te e lasciano stare la candela."
        prova: { attributo: fisico, abilita: [resistenza, furtivita], difficolta: Difficile }
        successo:
          titolo: Il mantello vivo
          testo: |
            Ti metti davanti alla campana con le braccia aperte e lasci che si
            posino. Ti coprono le spalle e le maniche, e sono caldi. Non ti
            muovi nemmeno quando uno ti si aggrappa al collo. Dopo un tempo
            lunghissimo si staccano tutti insieme e tornano alle travi.
          pe: { resistenza: 2 }
          effetti: { profondita.avv-investitura: 1 }
        fallimento:
          titolo: Il colletto
          testo: |
            Un pipistrello ti entra nel colletto e ti scuoti senza volerlo. Lo
            sciame si alza di colpo, e prima di tornare sulla fiamma ti morde le
            mani.
          effetti: { ferite: 0.5 }
      - testo: "Coprire la campana con il mantello e restare immobile"
        descrizione: "La fiamma la cercano, e la fiamma è sotto il vetro. Se non la vedono, alla lunga tornano sulle travi."
        costo: 2
        esito:
          titolo: Il mantello sul vetro
          testo: |
            Getti il mantello sulla campana di vetro e ci resti chino sopra, al
            buio, mentre i pipistrelli ti sbattono contro la schiena. Ci vuole
            molto prima che si stanchino. Quando li senti risalire alle travi
            hai le mani piene di graffi.
          effetti: { profondita.avv-investitura: 1, ferite: 0.5 }

  # ------------------------------------------------------------ 0-2 · il fumo dolce
  - id: avv-investitura-il-fumo-dolce
    immagine: icone/steam
    titolo: Il fumo dolce
    sommario: "Dagli stoppini spenti sale ancora un filo di fumo che sa di miele, e scende verso il pavimento invece di salire."
    luogo: La Sala delle Promesse, fra i candelabri
    area: avv-investitura
    ripetibile: true
    requisiti: [avventura.investitura == 5, profondita.avv-investitura <= 2]
    testo: |
      Dagli stoppini spenti dei candelabri sale ancora un filo di fumo, e il
      fumo non va verso il soffitto. Scende, e si stende sul pavimento della
      sala fino alle guardie addormentate, alto un palmo, con l'odore del miele
      e l'amaro sotto. Ogni volta che ti chini sul libro le righe si allontanano
      un poco, e devi strizzare gli occhi per rimetterle a posto.

      {medicina Media} Papavero, sciolto nella cera calda. Chi lo respira a
      lungo dorme fino a mezzogiorno, e chi ha già sonno ci mette meno.
    opzioni:
      - testo: "Spegnere gli stoppini uno per uno con le dita bagnate"
        descrizione: "Uno stoppino stretto fra due dita bagnate smette di fumare. I candelabri sono dodici."
        prova: { attributo: fisico, abilita: resistenza, difficolta: Media }
        successo:
          titolo: Le dita nere
          testo: |
            Ti bagni le dita nella brocca dell'altare e fai il giro dei
            candelabri, stoppino per stoppino, con il fazzoletto sulla bocca.
            All'ultimo hai le dita nere e la testa leggera, e il fumo sul
            pavimento si sta già diradando.
          pe: { resistenza: 2 }
          effetti: { profondita.avv-investitura: 1 }
        fallimento:
          titolo: Il sonno
          testo: |
            Al quinto candelabro ti accorgi di essere seduto per terra, e non ti
            ricordi di esserti seduto. Ti rialzi aggrappandoti al candelabro,
            con il miele in gola e la paura di aver dormito.
          effetti: { tormento: 0.5 }
      - testo: "Aprire le bocchette dell'aria sotto le finestre"
        descrizione: "Le case vecchie dei Quartieri Alti hanno bocchette sotto le finestre, per il fumo dei camini. Bisogna trovarle, e ricordarsi come si aprono."
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Difficile }
        successo:
          titolo: Le bocchette
          testo: |
            Sotto il davanzale di ogni finestra c'è una grata d'ottone nascosta
            da una tenda, con una levetta incrostata. Le apri tutte e quattro, e
            l'aria della notte comincia a tirare il fumo verso fuori, basso sul
            pavimento, come acqua che trova lo scolo.
          pe: { tecnologia: 2 }
          effetti: { profondita.avv-investitura: 1 }
        fallimento:
          titolo: La levetta
          testo: |
            Trovi la prima grata e la levetta ti si spezza fra le dita. Mentre
            cerchi le altre a gattoni il fumo ti arriva agli occhi, e devi
            tornare all'altare a schiarirti la testa.
          effetti: { tormento: 0.5 }
      - testo: "Legarti un fazzoletto bagnato sulla faccia e resistere"
        descrizione: "Il fumo prima o poi finisce. Basta essere svegli quando finisce."
        costo: 2
        esito:
          titolo: Il fazzoletto
          testo: |
            Ti leghi sulla bocca un fazzoletto bagnato e resti in piedi accanto
            al libro, pizzicandoti il dorso della mano ogni volta che le
            palpebre si fanno pesanti. Il fumo si dirada dopo un'ora. Hai il
            dorso della mano pieno di lividi e la testa che ronza.
          effetti: { profondita.avv-investitura: 1, tormento: 0.5 }

  # ------------------------------------------------------------ 0-2 · gli ultimi sulla scala
  - id: avv-investitura-gli-ultimi-sulla-scala
    immagine: icone/stairs
    titolo: Gli ultimi sulla scala
    sommario: "Sul pianerottolo è rimasto un vecchio fattore di Laresh, caduto nella calca. Il buio gli sta salendo intorno al bastone."
    luogo: Il Maniero Castaldi, la scala principale
    area: avv-investitura
    ripetibile: true
    requisiti: [avventura.investitura == 5, profondita.avv-investitura <= 2]
    testo: |
      Dalla scala che scende al primo piano arriva una voce che chiama Marella,
      a bassa voce. Sul pianerottolo, seduto sul primo gradino con una gamba
      distesa, c'è un vecchio fattore di Laresh venuto con la moglie per
      l'investitura. Nella calca è caduto, e gli altri sono scesi senza di lui.
      Intorno al suo bastone il buio sui gradini si muove come acqua bassa.

      {empatia Facile} Ha paura di muoversi più che di restare. Se qualcuno gli
      dà un buon motivo, scende.
    opzioni:
      - testo: "Portarlo giù a braccia fino alla porta di ferro"
        descrizione: "Tre piani di scale al buio, con un uomo in braccio. Di sotto c'è sua moglie."
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Media }
        successo:
          titolo: La moglie
          testo: |
            Lo prendi in braccio con il bastone e tutto e scendi i tre piani
            contando i gradini. Alla porta di ferro bussi tre volte. La porta si
            apre di un palmo, una donna anziana tira dentro il marito per la
            giacca, e la porta si richiude prima che tu abbia finito di dire il
            suo nome.
          pe: { atletica: 2 }
          effetti: { profondita.avv-investitura: 1, avv-investitura.ospiti: 1 }
        fallimento:
          titolo: Il bastone
          testo: |
            A metà della seconda rampa il bastone ti si infila fra le gambe e
            andate giù tutti e due per sei gradini. Lui si aggrappa alla
            balaustra e non vuole più lasciarla, e tu lo lasci lì promettendo di
            tornare.
          effetti: { ferite: 0.5 }
      - testo: "Convincerlo a scendere con le sue gambe"
        descrizione: "Ha paura del buio, e il buio è dappertutto. Bisogna dargli una ragione più grande della paura."
        prova: { attributo: sociale, abilita: [empatia, persuasione], difficolta: Difficile }
        successo:
          titolo: Un gradino alla volta
          testo: |
            Ti siedi accanto a lui e gli chiedi della moglie e di come si sono
            conosciuti. Si mette a raccontare. Quando arriva al giorno delle
            nozze è già in piedi, e scende con la mano sulla tua spalla, un
            gradino alla volta, senza smettere di parlare fino alla porta di
            ferro.
          pe: { empatia: 2 }
          effetti: { profondita.avv-investitura: 1, avv-investitura.ospiti: 1 }
        fallimento:
          titolo: Il pianto
          testo: |
            Gli parli, e lui si mette a piangere. Dice che resta lì finché non
            torna la luce, e si stringe al bastone con tutte e due le mani. Lo
            lasci sul pianerottolo con la tua giubba sulle spalle.
          effetti: { tormento: 0.5 }
      - testo: "Nasconderlo nell'armadio del pianerottolo"
        descrizione: "C'è un armadio a muro pieno di lenzuola. Al buio, chiuso in un armadio, un uomo sta più tranquillo che su una scala."
        costo: 2
        esito:
          titolo: L'armadio
          testo: |
            Lo aiuti a sedersi fra le lenzuola dell'armadio a muro e gli dici di
            non aprire a nessuno che non sia tu. Quando chiudi l'anta lo senti
            pregare, e la preghiera ti segue fino alla sala.
          effetti: { profondita.avv-investitura: 1, tormento: 0.5 }

  # ------------------------------------------------------------ 0-2 · la loggia
  - id: avv-investitura-la-loggia
    immagine: icone/night-sky
    titolo: La loggia
    sommario: "In fondo alla sala le imposte della loggia sbattono, e dai tetti di rame entrano altri pipistrelli."
    luogo: La Sala delle Promesse, la loggia
    area: avv-investitura
    ripetibile: true
    requisiti: [avventura.investitura == 5, profondita.avv-investitura <= 2]
    testo: |
      In fondo alla sala le finestre della loggia danno sulle terrazze e sui
      tetti di rame dei Quartieri Alti. Qualcuno le ha aperte durante la cena
      per far uscire il caldo delle candele, e adesso le imposte sbattono contro
      il muro a ogni folata. Dal buio di fuori entrano altri pipistrelli, a
      decine, attirati dalla fiamma della candela della veglia.

      {atletica Media} Le imposte si chiudono da fuori, con il gancio sulla
      balaustra. Bisogna sporgersi parecchio, e la balaustra è bassa.
    opzioni:
      - testo: "Sporgerti dalla balaustra e agganciare le imposte"
        descrizione: "Mezzo corpo fuori, sopra i tetti, con i pipistrelli che passano. Il gancio è lontano un braccio."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Difficile }
        successo:
          titolo: Il gancio
          testo: |
            Ti sporgi sopra le terrazze con una mano sulla balaustra e l'altra
            tesa, mentre i pipistrelli ti passano accanto alla faccia. Il gancio
            entra nell'occhiello al secondo tentativo. Chiudi anche l'altra
            imposta, e nella sala il fruscio cala di colpo.
          pe: { atletica: 2 }
          effetti: { profondita.avv-investitura: 1 }
        fallimento:
          titolo: La balaustra
          testo: |
            La balaustra ti scivola sotto il palmo, e per un momento sei fuori
            fino alla cintura con i tetti di rame sotto di te. Torni dentro a
            forza di gomiti, con il cuore in gola e le imposte ancora aperte.
          effetti: { ferite: 0.5 }
      - testo: "Cercare il fermo delle imposte dalla parte di dentro"
        descrizione: "Le imposte buone hanno un fermo anche da dentro, nascosto nello stipite. Chi ha fatto queste era un falegname serio."
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Media }
        successo:
          titolo: Il fermo
          testo: |
            Passi le dita lungo lo stipite finché non trovi una levetta di ferro
            sotto la vernice. La tiri, e una barra scende dall'alto e blocca le
            due imposte insieme con un colpo secco. I pipistrelli rimasti fuori
            sbattono contro il legno e se ne vanno.
          pe: { tecnologia: 2 }
          effetti: { profondita.avv-investitura: 1 }
        fallimento:
          titolo: La scheggia
          testo: |
            Cerchi il fermo sotto la vernice e trovi soltanto una scheggia, che
            ti entra sotto l'unghia. Le imposte continuano a sbattere.
          effetti: { ferite: 0.5 }
      - testo: "Tenere chiuse le imposte con la schiena"
        descrizione: "Due imposte e una schiena, finché il vento non gira."
        costo: 2
        esito:
          titolo: Il vento
          testo: |
            Chiudi le imposte a mano e ci resti appoggiato con la schiena e i
            talloni puntati sul pavimento, mentre il vento le spinge e i
            pipistrelli ci sbattono contro da fuori. Ci vuole un'ora perché il
            vento giri. Quando ti stacchi dal legno hai la schiena dura come una
            tavola.
          effetti: { profondita.avv-investitura: 1, ferite: 0.5 }

  # ------------------------------------------------------------ 3-4 · i mantelli d'ombra
  - id: avv-investitura-i-mantelli
    immagine: icone/cloak
    titolo: I mantelli d'ombra
    sommario: "Dal guardaroba dell'atrio salgono le scale i mantelli degli ospiti, con il cappuccio alzato e nessuno dentro."
    luogo: Il Maniero Castaldi, in cima alla scala
    area: avv-investitura
    ripetibile: true
    requisiti: [avventura.investitura == 5, profondita.avv-investitura >= 3, profondita.avv-investitura <= 4]
    testo: |
      Dalla scala dell'atrio salgono i mantelli degli ospiti. Erano appesi nel
      guardaroba uno accanto all'altro, e adesso camminano su per i gradini
      senza nessuno dentro, con il cappuccio alzato e le maniche gonfie di buio.
      Uno ha ancora una spilla d'argento sul bavero. Quando arrivano in cima si
      fermano tutti insieme e girano il cappuccio verso l'altare.

      {magia Media} Il buio che li riempie è lo stesso che ha bevuto le candele.
      Si tiene insieme finché ha una forma da riempire, e un mantello strappato
      è soltanto stoffa.

      {origine figlio-della-citta-bassa} Nei vicoli si dice che chi ruba un
      mantello si porta via anche la sfortuna del padrone. Questi i padroni li
      hanno lasciati al guardaroba.
    opzioni:
      - testo: "Affrontarli in cima alla scala"
        descrizione: "Sono stoffa e buio, e colpiscono con le maniche. La stoffa però si taglia."
        combattimento: avv-investitura-i-mantelli
        vittoria:
          titolo: Gli stracci
          testo: |
            Tagli il primo dal cappuccio all'orlo, e il buio ne esce come acqua
            da un secchio bucato. Il secondo crolla poco dopo. Sulla scala
            restano due mantelli strappati, e uno ha la spilla d'argento.
          effetti: { profondita.avv-investitura: 1 }
        sconfitta:
          titolo: Le maniche
          testo: |
            Le maniche ti si avvolgono intorno alle braccia, fredde come la
            pietra di una cantina, e ti spingono indietro fino all'altare.
            Quando i mantelli tornano giù per la scala hai i polsi lividi.
          effetti: { ferite: 0.5 }
      - testo: "Strappare le spille dai baveri"
        descrizione: "Un mantello senza spilla si apre e cade. Bisogna arrivare al bavero, in mezzo alle maniche."
        prova: { attributo: fisico, abilita: [acrobazia, rissa], difficolta: Difficile }
        successo:
          titolo: La spilla d'argento
          testo: |
            Ti infili fra i due mantelli e strappi la spilla d'argento dal
            bavero del primo. Il mantello si apre e scivola a terra vuoto, e
            l'altro esita abbastanza perché tu gli tiri via il cappuccio. La
            spilla te la metti in tasca, per restituirla all'alba.
          pe: { acrobazia: 2 }
          effetti: { profondita.avv-investitura: 1 }
        fallimento:
          titolo: Il bavero
          testo: |
            La mano ti si chiude sul bavero, e il bavero è freddo come il ferro
            d'inverno. Lo lasci andare senza volerlo, e il mantello ti spinge
            giù di tre gradini.
          effetti: { ferite: 0.5 }
      - testo: "Lasciarli passare, immobile accanto all'altare"
        descrizione: "Cercano qualcosa. Forse cercano qualcun altro."
        costo: 2
        esito:
          titolo: Il freddo da cantina
          testo: |
            Resti immobile con la mano sulla catena del libro, e i mantelli ti
            passano accanto uno per volta, così vicini che le maniche ti
            sfiorano la faccia. Girano due volte intorno all'altare, poi
            scendono di nuovo verso l'atrio. Ti lasciano addosso un freddo che
            non se ne va.
          effetti: { profondita.avv-investitura: 1, tormento: 0.5 }

  # ------------------------------------------------------------ 3-4 · le lampade della casa
  - id: avv-investitura-le-lampade-della-casa
    immagine: icone/old-lantern
    titolo: Le lampade della casa
    sommario: "Le lampade a cristallo del corridoio non si accendono. Qualcuno ha tolto i cristalli prima di cena, con calma."
    luogo: Il Maniero Castaldi, il corridoio della galleria
    area: avv-investitura
    ripetibile: true
    requisiti: [avventura.investitura == 5, profondita.avv-investitura >= 3, profondita.avv-investitura <= 4]
    testo: |
      Nel corridoio che porta alla galleria il Maniero ha le sue lampade a
      cristallo, quelle che si accendono girando una vite e non hanno bisogno di
      fuoco. Le giri una per una, e restano spente. Dentro ogni gabbia d'ottone
      il posto del cristallo è vuoto, e le viti le ha allentate prima della cena
      qualcuno che aveva un attrezzo da orologiaio e tutto il tempo che voleva.

      Ai piedi dell'altare, fra i doni dell'erede, ci sono ancora le scatole
      aperte e la carta velina.

      {tecnologia Media} Chi le ha svuotate sapeva dove mettere le mani. Nella
      cassa delle scorte, in fondo al corridoio, di cristalli ce ne sono sempre.

      {origine allievo-di-torvessa} All'Accademia ti hanno insegnato che un
      cristallo tolto dalla sua gabbia si scarica in poche ore. Chi li ha tolti
      contava di non doverli rimettere.
    opzioni:
      - testo: "Accendere la lanterna di vetro soffiato"
        descrizione: "Il tuo dono è ancora ai piedi dell'altare, nella sua scatola, con il cristallo carico sul fondo."
        requisiti: [avv-investitura.dono == 1]
        esito:
          titolo: Il dono dell'erede
          testo: |
            Tiri fuori dalla scatola la lanterna che hai regalato a Mira e giri
            la vite. La luce si accende chiara e ferma, e il buio del corridoio
            si ritira fino alla galleria. Appendi la lanterna al gancio di una
            lampada vuota, e per un'ora nessuna ombra passa di lì.
          effetti: { profondita.avv-investitura: 1 }
      - testo: "Rimontare le lampade con i cristalli della cassa"
        descrizione: "Ci vogliono i cristalli della cassa delle scorte e le dita giuste, al buio."
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Difficile }
        successo:
          titolo: La luce azzurrina
          testo: |
            Trovi la cassa delle scorte a tentoni e monti i cristalli nelle
            gabbie uno alla volta, stringendo le viti con l'unghia del pollice.
            Alla terza lampada il corridoio si accende di una luce azzurrina, e
            il buio si ritira fino alla soglia della galleria.
          pe: { tecnologia: 2 }
          effetti: { profondita.avv-investitura: 1 }
        fallimento:
          titolo: La scossa
          testo: |
            Monti il primo cristallo storto, e la gabbia d'ottone ti dà una
            scossa che ti fa sbattere il gomito contro il muro. Per un po' non
            senti più le dita.
          effetti: { ferite: 0.5 }
      - testo: "Cercare i cristalli che mancano"
        descrizione: "Chi li ha tolti voleva il buio, e i cristalli non gli servivano. Da qualche parte, in casa, ci sono ancora."
        prova: { attributo: mentale, abilita: percezione, difficolta: Difficile }
        successo:
          titolo: Il vaso
          testo: |
            Li trovi dentro un vaso di porcellana sul pianerottolo, avvolti in
            un tovagliolo con le bilance ricamate. Rimetti i primi tre nelle
            gabbie, e il corridoio si accende di una luce azzurrina che il buio
            non riesce a bere.
          pe: { percezione: 2 }
          effetti: { profondita.avv-investitura: 1 }
        fallimento:
          titolo: Il buio nel vaso
          testo: |
            Infili la mano in un vaso del pianerottolo, e dentro c'è un buio
            freddo e denso che ti arriva fino al gomito. Ritiri il braccio con
            la pelle d'oca e la manica bagnata di niente.
          effetti: { tormento: 0.5 }
      - testo: "Andare avanti al buio, con la mano sul muro"
        descrizione: "Il corridoio lo conosci abbastanza."
        costo: 2
        esito:
          titolo: La tappezzeria
          testo: |
            Percorri il corridoio con la mano sulla tappezzeria, contando le
            porte come faceva Quintus. Due volte la mano incontra qualcosa che
            non è il muro e si ritira da sola, e tu arrivi in fondo senza
            voltarti.
          effetti: { profondita.avv-investitura: 1, tormento: 0.5 }

  # ------------------------------------------------------------ 3-4 · il montavivande
  - id: avv-investitura-il-montavivande
    immagine: icone/pulley-hook
    titolo: Il montavivande
    sommario: "Nell'angolo della sala la corda del montavivande si muove. La cassa sale dalla cucina, e nessuno la tira."
    luogo: La Sala delle Promesse, lo sportello del montavivande
    area: avv-investitura
    ripetibile: true
    requisiti: [avventura.investitura == 5, profondita.avv-investitura >= 3, profondita.avv-investitura <= 4]
    testo: |
      In un angolo della sala c'è lo sportello del montavivande, la cassa che
      porta su i piatti caldi dalla cucina tirata da una corda su una ruota. La
      corda si muove. La cassa sta salendo dal pianterreno un palmo alla volta,
      e dalle fessure dello sportello esce un buio più fitto del resto.

      {furtivita Media} La ruota gira senza il cigolio che fa quando qualcuno
      tira la manovella. Di sotto non c'è nessuno, e la cassa sale da sola, più
      pesante di un pranzo.
    opzioni:
      - testo: "Tagliare la corda"
        descrizione: "Senza corda la cassa torna giù con tutto quello che ha dentro. La corda però è di canapa buona, spessa un dito."
        prova: { attributo: fisico, abilita: [armi-da-mischia, atletica], difficolta: Difficile }
        successo:
          titolo: La canapa
          testo: |
            Apri lo sportello e tagli la corda con tre colpi, tenendola tesa
            contro il bordo. Al terzo la cassa precipita nel pozzo e si schianta
            in fondo con un rumore di stoviglie, e dalla cucina sale un soffio
            freddo, poi più niente.
          pe: { armi-da-mischia: 2 }
          effetti: { profondita.avv-investitura: 1 }
        fallimento:
          titolo: La frustata
          testo: |
            La corda si spezza a metà del secondo colpo e ti frusta il dorso
            della mano. La cassa intanto è salita di un altro palmo.
          effetti: { ferite: 0.5 }
      - testo: "Incastrare la ruota con un candelabro"
        descrizione: "La ruota del montavivande ha i raggi larghi. Un candelabro infilato fra un raggio e l'altro la ferma."
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Difficile }
        successo:
          titolo: Il candelabro fra i raggi
          testo: |
            Stacchi un candelabro dal muro e lo infili fra i raggi della ruota,
            di traverso. La ruota si ferma con uno strattone, e la cassa resta
            sospesa nel pozzo a metà fra la cucina e la sala, dove il buio può
            aspettare fino all'alba.
          pe: { tecnologia: 2 }
          effetti: { profondita.avv-investitura: 1 }
        fallimento:
          titolo: I raggi
          testo: |
            Infili il candelabro fra i raggi, e la ruota lo piega come un
            fuscello. Lo ritiri appena in tempo per non lasciarci le dita.
          effetti: { ferite: 0.5 }
      - testo: "Bloccare lo sportello con la schiena"
        descrizione: "Lo sportello è di legno, e la cassa dovrà aprirlo da dentro. Basta tenerlo finché non si stanca."
        costo: 2
        esito:
          titolo: Lo sportello
          testo: |
            Chiudi lo sportello e ci metti contro la schiena, con i piedi
            puntati contro l'altare. La cassa arriva in cima e spinge, a colpi,
            per un tempo lunghissimo. Poi scende piano com'era salita, e dalle
            fessure dello sportello ti resta addosso un freddo di cantina.
          effetti: { profondita.avv-investitura: 1, tormento: 0.5 }

  # ------------------------------------------------------------ 3-4 · la porta di ferro
  - id: avv-investitura-la-porta-di-ferro
    immagine: icone/key-lock
    titolo: La porta di ferro
    sommario: "Da sotto la porta del magazzino del grano il buio entra a fili sottili. Di là un bambino piange."
    luogo: Il Maniero Castaldi, il seminterrato
    area: avv-investitura
    ripetibile: true
    requisiti: [avventura.investitura == 5, profondita.avv-investitura >= 3, profondita.avv-investitura <= 4]
    testo: |
      Scendi i tre piani fino al seminterrato con il buio che ti segue giù per
      le scale. La porta di ferro del magazzino del grano è chiusa, e da sotto
      la fessura escono fili d'ombra sottili come capelli, che strisciano verso
      l'interno e tornano indietro. Di là senti la voce di Quintus che dà ordini
      a mezza voce, e quella di un bambino che piange.

      {empatia Media} Dentro hanno più paura del buio che entra dalla fessura
      che di quello di fuori. Se qualcuno apre per scappare, il buio entra
      tutto.
    opzioni:
      - testo: "Parlare agli ospiti attraverso la porta"
        descrizione: "Una voce da fuori che dice che fuori c'è qualcuno. A volte basta."
        prova: { attributo: sociale, abilita: [persuasione, galateo], difficolta: Difficile }
        successo:
          titolo: La voce da fuori
          testo: |
            Appoggi la bocca alla fessura e dici chi sei, e che il libro è al
            suo posto. Lo dici forte e piano, come si parla ai cavalli. Di là il
            pianto smette. Quintus ti risponde con due colpi sul ferro, e senti
            qualcuno che aiuta un ospite svenuto a rialzarsi.
          pe: { persuasione: 2 }
          effetti: { profondita.avv-investitura: 1, avv-investitura.ospiti: 1 }
        fallimento:
          titolo: Il ferro
          testo: |
            Parli attraverso la porta, e il ferro ti rimanda la voce storta e
            cupa. Di là qualcuno grida che c'è una cosa fuori. Quintus fa tacere
            tutti, e tu torni di sopra con la tua stessa voce che ti rimbomba in
            testa.
          effetti: { tormento: 0.5 }
      - testo: "Tappare la fessura con i sacchi della dispensa"
        descrizione: "Quintus ti ha mostrato la dispensa accanto, piena di sacchi. Un sacco di farina contro una fessura chiude meglio di una porta."
        requisiti: [avv-investitura.casa >= 1]
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Media }
        successo:
          titolo: I sacchi
          testo: |
            Trascini fuori dalla dispensa quattro sacchi di farina e li appoggi
            contro la porta di ferro, uno sull'altro, finché la fessura
            sparisce. I fili d'ombra ci girano intorno e non trovano più la
            strada. Dall'altra parte Quintus batte due colpi sul ferro, e il
            bambino smette di piangere.
          pe: { atletica: 2 }
          effetti: { profondita.avv-investitura: 1, avv-investitura.ospiti: 1 }
        fallimento:
          titolo: Il sacco rotto
          testo: |
            Il primo sacco ti si strappa fra le braccia e la farina ti copre
            fino ai capelli. Quando smetti di tossire il buio sta già passando
            sopra il mucchio.
          effetti: { tormento: 0.5 }
      - testo: "Stenderti contro la porta con il mantello sulla fessura"
        descrizione: "Il tuo corpo a fare da argine, e il mantello a tappare. Finché il buio non si stanca."
        costo: 2
        esito:
          titolo: Contro il ferro
          testo: |
            Ti stendi sul pavimento con il mantello premuto contro la fessura e
            il corpo a fare da argine. Il buio ti passa addosso a ondate, fredde
            come l'acqua di un pozzo, e per un'ora non entra. Quando ti alzi hai
            il fianco intorpidito e i denti che battono.
          effetti: { profondita.avv-investitura: 1, tormento: 0.5 }

  # ------------------------------------------------------------ 5 · la svolta: il precettore
  - id: avv-investitura-il-precettore
    immagine: icone/book-cover
    titolo: Il precettore
    sommario: "Dal magazzino del grano arriva il rumore della spranga che si alza. Qualcuno sta aprendo la porta di ferro da dentro."
    luogo: Il Maniero Castaldi, il seminterrato
    area: avv-investitura
    requisiti: [avventura.investitura == 5, profondita.avv-investitura == 5, avv-investitura.precettore == 0]
    testo: |
      Quando la candela della veglia arriva alla quinta tacca, dal fondo della
      casa sale un rumore che conosci, il ferro che striscia sul ferro. Qualcuno
      sta alzando la spranga della porta del magazzino, e la sta alzando da
      dentro.

      Scendi le scale di corsa, con il buio che si apre davanti a te e si
      richiude alle spalle. La porta di ferro è socchiusa di un palmo, e nello
      spiraglio c'è Lamberto Pellegra, il precettore, con la faccia bianca e le
      mani sulla spranga. Dietro di lui gli ospiti dormono o pregano, e Quintus
      è in fondo al magazzino con Mira e non l'ha visto.

      «Mi aspetta» dice Lamberto, e non capisci se parla a te. «All'alba le
      serve un testimone di fuori, e io non sono un Castaldi. È soltanto una
      firma. Lei mi paga i debiti, e io guardo.»

      Dallo spiraglio il buio delle scale comincia a entrare nel magazzino,
      piano, come fumo sotto una porta.

      {conoscenze-della-strada Media} Ne hai visti tanti così, ai tavoli da
      gioco della città. Chi ha paura dei suoi debiti si ferma, se qualcuno gli
      mostra una paura più grande o una via d'uscita.

      {origine fuggiasco-di-ghoran} A Ghoran gli uomini con i debiti finivano
      sulla bilancia del mercato. Questo ci è salito da solo, e per meno.
    opzioni:
      - testo: "Buttarti sulla porta prima che la apra"
        descrizione: "Un palmo di spiraglio, e la spranga ancora in mano a lui. Se arrivi prima che la alzi del tutto, la porta si richiude."
        prova: { attributo: fisico, abilita: [atletica, rissa], difficolta: Difficile }
        successo:
          titolo: La spranga
          testo: |
            Ti butti contro la porta con la spalla, e il battente si richiude
            sulle dita di Lamberto, che lascia la spranga con un grido.
            Dall'altra parte Quintus arriva di corsa e lo stende sul pavimento
            con un ginocchio sulla schiena. Il buio che era entrato si ritira
            sotto la porta come un gatto bagnato.
          pe: { atletica: 3 }
          imposta: { avv-investitura.precettore: 1 }
          effetti: { profondita.avv-investitura: 1 }
        fallimento:
          titolo: Il battente
          testo: |
            Arrivi sulla porta un attimo tardi, e Lamberto la tira verso di sé
            con tutto il peso. Il battente ti prende in faccia. Quando ti rialzi
            lui è ancora lì, con la spranga in mano e la porta socchiusa, e ti
            chiede scusa.
          effetti: { ferite: 0.5 }
      - testo: "Convincerlo a rimettere giù la spranga"
        descrizione: "Un uomo che chiede scusa mentre tradisce è ancora indeciso. Bisogna trovare la frase che lo fa decidere dall'altra parte."
        prova: { attributo: sociale, abilita: [persuasione, empatia], difficolta: Difficile }
        successo:
          titolo: I debiti
          testo: |
            Gli dici che i debiti si pagano anche dopo, e che una firma come
            quella non si finisce mai di pagare. Lamberto ti guarda a lungo, poi
            rimette giù la spranga da solo. «È nascosta dietro l'altare» dice
            piano. «Nel passaggio della vecchia cappella. Esce all'ultima
            tacca.» Quintus, arrivato alle sue spalle, gli lega le mani con la
            cintura.
          pe: { persuasione: 3 }
          imposta: { avv-investitura.precettore: 2 }
          effetti: { profondita.avv-investitura: 1 }
        fallimento:
          titolo: La paura
          testo: |
            Gli parli, e più parli più lui stringe la spranga. «Lei mi aveva
            detto che avreste detto così» risponde, e la spranga sale di un
            dito.
          effetti: { tormento: 0.5 }
      - testo: "Fare un cenno a Eolio"
        descrizione: "Hai chiesto a Eolio di tenere d'occhio il precettore. Eolio fa sempre quello che gli si chiede."
        requisiti: [avv-investitura.sospetto >= 1]
        esito:
          titolo: Il segnale muto
          testo: |
            Alzi la mano nello spiraglio, e alle spalle di Lamberto compare
            Eolio Drest, che gli è rimasto a due passi per tutta la notte. Gli
            posa tre dita sul polso, e Lamberto lascia la spranga come se
            scottasse. Eolio richiude la porta con la cura di sempre, e prima
            che il battente si chiuda ti fa un piccolo inchino.
          imposta: { avv-investitura.precettore: 1 }
          effetti: { profondita.avv-investitura: 1 }
      - testo: "Tenere la porta con la spalla finché non arriva Quintus"
        descrizione: "Lui tira da dentro e tu spingi da fuori. Intanto il buio passa dallo spiraglio."
        costo: 2
        esito:
          titolo: Lo spiraglio
          testo: |
            Spingi la porta con la spalla mentre lui tira, e il buio passa dallo
            spiraglio come acqua da una diga. Quando Quintus arriva e lo
            trascina via, nel magazzino una lanterna a olio cade a terra e una
            donna grida. La porta si richiude, e di là un servitore resta
            disteso con il viso grigio mentre Marella, in ginocchio, gli tiene
            la testa.
          imposta: { avv-investitura.precettore: 3 }
          effetti: { profondita.avv-investitura: 1, avv-investitura.ospiti: -1, tormento: 0.5 }

  # ------------------------------------------------------------ 5 · le notti seguenti: la tregua
  - id: avv-investitura-la-quinta-tacca
    immagine: icone/hourglass
    titolo: La quinta tacca
    sommario: "A metà della notte il buio si ritira dall'altare fino ai muri. Lamberto Pellegra stavolta è sotto chiave."
    luogo: La Sala delle Promesse, a metà della notte
    area: avv-investitura
    requisiti: [avventura.investitura == 5, profondita.avv-investitura == 5, avv-investitura.precettore >= 1]
    testo: |
      La candela della veglia arriva alla quinta tacca, e dal fondo della casa
      non sale nessun rumore. Lamberto Pellegra è legato a una colonna del
      magazzino del grano, e la spranga della porta di ferro l'hai messa anche
      dalla parte di fuori. Nella Sala delle Promesse il buio si ritira
      dall'altare fino ai muri, come il mare prima di un'onda, e per un poco non
      succede niente.

      {resistenza Media} Le gambe ti fanno male dalla terza tacca, e la schiena
      dalla seconda. Una tregua adesso vale più di un pasto.
    opzioni:
      - testo: "Riposare con la schiena contro l'altare"
        descrizione: "Una tregua va usata. Si chiude un occhio alla volta."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Media }
        successo:
          titolo: La tregua
          testo: |
            Ti siedi contro l'altare con la catena del libro fra le dita e
            chiudi un occhio alla volta, a turno, come fanno le guardie vecchie.
            Quando il buio torna ad avvicinarsi, le gambe ti rispondono di
            nuovo.
          pe: { resilienza: 2 }
          effetti: { profondita.avv-investitura: 1 }
        fallimento:
          titolo: Il sonno vero
          testo: |
            Chiudi gli occhi un momento e li riapri con la testa sul libro.
            Quanto hai dormito, non lo sai. La fiamma della candela è china da
            una parte, e intorno all'altare il buio è tornato vicinissimo.
          effetti: { tormento: 0.5 }
      - testo: "Girare sul fianco le guardie addormentate"
        descrizione: "Dormono dove sono cadute, alcune a faccia in giù. È una cosa utile da fare, finché dura la tregua."
        costo: 2
        esito:
          titolo: Le guardie
          testo: |
            Fai il giro della sala e giri sul fianco le guardie addormentate,
            una per una, perché non soffochino nel sonno. Una ti afferra il
            polso senza svegliarsi e chiama sua madre. Quando hai finito, anche
            la tregua è finita.
          effetti: { profondita.avv-investitura: 1, tormento: 0.5 }

  # ------------------------------------------------------------ 6-9 · la Galleria dei Fondatori
  - id: avv-investitura-la-galleria-dei-fondatori
    immagine: icone/black-knight-helm
    titolo: La Galleria dei Fondatori
    sommario: "Le statue dei primi Castaldi sono scese dalle nicchie, e negli occhi di pietra hanno due cristalli accesi di grigio."
    luogo: Il Maniero Castaldi, la Galleria dei Fondatori
    area: avv-investitura
    ripetibile: true
    requisiti: [avventura.investitura == 5, profondita.avv-investitura >= 6, profondita.avv-investitura <= 9]
    testo: |
      La Galleria dei Fondatori collega la sala alla scala, un corridoio lungo
      con dodici nicchie, sei per parte. In ogni nicchia c'era un Castaldi dei
      primi anni della città, scolpito in pietra chiara a grandezza d'uomo, con
      il libro sotto il braccio o la mano sull'elsa. Adesso metà delle nicchie
      sono vuote. Le statue sono scese dai piedistalli e stanno in mezzo al
      corridoio, voltate verso la sala, e negli occhi di pietra hanno due
      cristalli che mandano una luce grigia.

      {armi-da-mischia Media} Le spade di pietra sono scolpite contro il fianco
      e non si sfilano. Colpiranno con le mani e con il peso, e la pietra si
      scheggia meglio sulle giunture del collo.
    opzioni:
      - testo: "Affrontare le prime due"
        descrizione: "Sono lente, e colpiscono con tutto il peso della pietra."
        combattimento: avv-investitura-i-fondatori
        vittoria:
          titolo: La pietra a terra
          testo: |
            Le prime due statue cadono una dopo l'altra, e quando battono sul
            pavimento i cristalli schizzano fuori dalle orbite e rotolano lungo
            il corridoio. Le altre si fermano a mezzo passo e lì restano.
          effetti: { profondita.avv-investitura: 1 }
        sconfitta:
          titolo: Il peso
          testo: |
            Una statua ti prende di striscio con il libro di pietra, e basta
            quello per mandarti contro il muro. Torni nella sala camminando
            all'indietro, con la spalla che non si alza.
          effetti: { ferite: 0.5 }
      - testo: "Strappare i cristalli dalle orbite"
        descrizione: "Due cristalli per statua, incastrati a forza. Chi sa dove fanno presa li toglie con un dito."
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Difficile }
        successo:
          titolo: Gli occhi grigi
          testo: |
            Ti infili fra le statue e premi con il pollice sotto ogni orbita,
            dove il cristallo fa presa contro la pietra. I cristalli saltano
            fuori uno dopo l'altro, e le statue si irrigidiscono dove sono, una
            con un piede ancora alzato.
          pe: { tecnologia: 2 }
          effetti: { profondita.avv-investitura: 1 }
        fallimento:
          titolo: La mano di pietra
          testo: |
            Premi sotto l'orbita sbagliata, e la statua ti chiude la mano di
            pietra intorno al polso. Ti lascia andare soltanto quando il
            cristallo, da solo, si spegne per un attimo.
          effetti: { ferite: 0.5 }
      - testo: "Chiamarle per nome, come nella carta dei fondatori"
        descrizione: "I dodici nomi li hai copiati per Mira. Le ombre prendono la forma che trovano, e la forma ricorda."
        requisiti: [avv-investitura.dono == 3]
        prova: { attributo: mentale, abilita: accademiche, difficolta: Media }
        successo:
          titolo: I nomi
          testo: |
            Dici il primo nome della carta, piano, guardando la statua più
            vicina, e la statua gira la testa verso la sua nicchia. Poi il
            secondo, e il terzo. Le statue tornano ai piedistalli una per una,
            lente, ognuna al suo nome, e restano lì con la luce grigia negli
            occhi.
          pe: { accademiche: 2 }
          effetti: { profondita.avv-investitura: 1 }
        fallimento:
          titolo: Il nome sbagliato
          testo: |
            Al terzo nome sbagli, e la statua che hai chiamato resta ferma
            mentre si voltano tutte le altre. Torni nella sala senza dare loro
            la schiena.
          effetti: { tormento: 0.5 }
      - testo: "Chiudere la porta della galleria e puntellarla"
        descrizione: "La porta della galleria è di quercia. Le statue sono di pietra, e ci metteranno molto."
        costo: 3
        esito:
          titolo: La quercia
          testo: |
            Chiudi la porta della galleria e la puntelli con una panca e due
            candelabri. Le statue arrivano e battono a lungo, una dopo l'altra,
            finché il legno non si incrina. Poi si fermano, e quando riapri le
            trovi tornate nelle nicchie, con i cristalli spenti e la polvere
            della quercia sulle mani di pietra.
          effetti: { profondita.avv-investitura: 1, tormento: 0.5 }

  # ------------------------------------------------------------ 6-9 · il busto sulla scala
  - id: avv-investitura-il-busto-sulla-scala
    immagine: icone/iron-mask
    titolo: Il busto sulla scala
    sommario: "Il busto di bronzo del pianerottolo sale la scala rotolando, un gradino alla volta, con un cristallo fra i denti."
    luogo: Il Maniero Castaldi, la scala principale
    area: avv-investitura
    ripetibile: true
    requisiti: [avventura.investitura == 5, profondita.avv-investitura >= 6, profondita.avv-investitura <= 9]
    testo: |
      Sulla scala principale sta salendo il busto di bronzo che stava sul
      pianerottolo del primo piano, un Castaldi barbuto senza braccia e senza
      gambe. Sale rotolando su se stesso e rimettendosi dritto, un gradino alla
      volta, con un colpo sordo a ogni scalino. Il cristallo che gli hanno messo
      fra i denti illumina di grigio i gradini davanti a lui.

      {atletica Difficile} Pesa quanto tre uomini. Preso di lato sul gradino
      giusto, scende molto più in fretta di come è salito.
    opzioni:
      - testo: "Spingerlo giù per la scala"
        descrizione: "Tre uomini di bronzo contro uno di carne. Servono il gradino giusto e tutta la spinta che hai."
        prova: { attributo: fisico, abilita: atletica, difficolta: Molto difficile }
        successo:
          titolo: Giù
          testo: |
            Aspetti che si rimetta dritto sul gradino sotto il tuo, e lo prendi
            di lato con la spalla e tutto il peso. Il busto si inclina, resta
            sospeso sul bordo del gradino, e poi va. Scende la scala rimbalzando
            fino al pianterreno, e il cristallo gli schizza via dai denti a metà
            strada.
          pe: { atletica: 3 }
          effetti: { profondita.avv-investitura: 1 }
        fallimento:
          titolo: Il bronzo
          testo: |
            Lo spingi, e il busto resta dov'è. Poi si rimette dritto, e il colpo
            successivo te lo prendi sul piede.
          effetti: { ferite: 0.5 }
      - testo: "Togliergli il cristallo dai denti quando si raddrizza"
        descrizione: "Quando si rimette dritto, per un attimo ha la bocca all'altezza della tua mano."
        prova: { attributo: fisico, abilita: acrobazia, difficolta: Difficile }
        successo:
          titolo: Fra i denti
          testo: |
            Ti abbassi quando il busto si raddrizza, infili due dita fra i denti
            di bronzo e tiri. Il cristallo viene via tiepido come un uovo appena
            deposto, e il busto si ferma di traverso sul gradino, con la bocca
            aperta.
          pe: { acrobazia: 2 }
          effetti: { profondita.avv-investitura: 1 }
        fallimento:
          titolo: I denti
          testo: |
            Infili le dita fra i denti, e i denti si chiudono. Le tiri fuori
            lasciando un po' di pelle sul bronzo.
          effetti: { ferite: 0.5 }
      - testo: "Tirargli via la passatoia da sotto"
        descrizione: "La scala ha una passatoia di lana. Ogni volta che il busto ci mette sopra il suo peso, si può tirare."
        costo: 3
        esito:
          titolo: La passatoia
          testo: |
            Tiri la passatoia della scala con tutte e due le mani ogni volta che
            il busto ci mette sopra il suo peso. Lo riporti giù di tre gradini,
            poi di altri tre. Quando arriva al pianerottolo da cui era partito
            hai le braccia che tremano e le palme spellate.
          effetti: { profondita.avv-investitura: 1, ferite: 0.5 }

  # ------------------------------------------------------------ 6-9 · la statua del nonno
  - id: avv-investitura-la-statua-del-nonno
    immagine: icone/family-tree
    titolo: La statua del nonno
    sommario: "La statua del nonno di Julia, quella del detto della casata, si è voltata verso l'altare con la bilancia alzata."
    luogo: La Sala delle Promesse, la soglia
    area: avv-investitura
    ripetibile: true
    requisiti: [avventura.investitura == 5, profondita.avv-investitura >= 6, profondita.avv-investitura <= 9]
    testo: |
      Accanto alla porta della sala c'è sempre stata la statua del nonno di
      Julia, quello del detto della casata, in piedi con una bilancia in una
      mano e un rotolo nell'altra. Adesso si è voltata verso l'interno. Fa un
      passo ogni volta che la fiamma della candela tremola, e la bilancia di
      pietra le pende dalla mano come una mazza. Dietro di lei, dalla galleria,
      arriva un fondatore con la mano sull'elsa.

      {accademiche Media} Sul piedistallo c'è inciso il detto, *la nostra casata
      firma promesse, e le mantiene*. A quanto si racconta il nonno di Julia
      l'ha detto una volta sola, e la casata lo ripete da allora.
    opzioni:
      - testo: "Fermarli sulla soglia"
        descrizione: "La statua del nonno e un fondatore. Sulla soglia passano uno alla volta."
        combattimento: avv-investitura-il-nonno
        vittoria:
          titolo: Sulla soglia
          testo: |
            La statua del nonno cade per prima e si schianta sul pavimento, e la
            bilancia di pietra le si stacca dalla mano e rotola fino all'altare.
            Il fondatore inciampa nel suo corpo e non si rialza. Il detto sul
            piedistallo resta dov'è, intatto.
          effetti: { profondita.avv-investitura: 1 }
        sconfitta:
          titolo: La bilancia
          testo: |
            La bilancia di pietra ti prende di piatto sul fianco e ti manda a
            sbattere contro lo stipite. Ti ritiri verso l'altare tenendoti le
            costole.
          effetti: { ferite: 0.5 }
      - testo: "Farle perdere l'equilibrio con la sua bilancia"
        descrizione: "Una statua che tiene un peso da una parte sola sta in piedi per miracolo. Basta aggiungere un dito di peso."
        prova: { attributo: fisico, abilita: [rissa, acrobazia], difficolta: Difficile }
        successo:
          titolo: Il peso giusto
          testo: |
            Aspetti che alzi la bilancia, e quando è in alto ci appendi tutto il
            tuo peso. La statua si piega da quella parte e cade di fianco sul
            fondatore che la seguiva, e restano a terra tutti e due, incastrati
            come due ubriachi.
          pe: { rissa: 2 }
          effetti: { profondita.avv-investitura: 1 }
        fallimento:
          titolo: Il contrappeso
          testo: |
            Ti appendi alla bilancia, e la statua ti solleva da terra come un
            sacco e ti lascia andare contro il muro.
          effetti: { ferite: 0.5 }
      - testo: "Riparare la fiamma con il corpo"
        descrizione: "Fa un passo quando la fiamma trema. Se la fiamma resta ferma, anche lei."
        costo: 3
        esito:
          titolo: La fiamma ferma
          testo: |
            Ti metti fra la statua e la candela, con il corpo a riparare la
            fiamma da ogni spiffero, e la statua fa sempre meno passi. Si ferma
            a tre braccia dall'altare con la bilancia alzata, e ci resta. Quando
            ti muovi di nuovo hai le ginocchia di legno.
          effetti: { profondita.avv-investitura: 1, tormento: 0.5 }

  # ------------------------------------------------------------ 6-9 · la candela della veglia
  - id: avv-investitura-la-candela-della-veglia
    immagine: icone/candle-holder
    titolo: La candela della veglia
    sommario: "Verso la fine della notte il buio si stringe intorno alla campana di vetro, e la fiamma comincia a piegarsi."
    luogo: La Sala delle Promesse, l'altare
    area: avv-investitura
    ripetibile: true
    requisiti: [avventura.investitura == 5, profondita.avv-investitura >= 6, profondita.avv-investitura <= 9]
    testo: |
      Verso la fine della notte il buio si stringe intorno all'altare. Adesso ha
      smesso di cercare te. Si accalca intorno alla campana di vetro, e la
      fiamma della candela della veglia si piega da una parte e dall'altra, come
      se qualcuno ci soffiasse sopra da dentro il vetro. Sulla cera mancano
      poche tacche all'alba.

      {magia Difficile} La campana tiene fuori quello che ha bevuto le candele.
      Il vetro però è sottile, e da sotto il bordo il buio entra un filo alla
      volta.
    opzioni:
      - testo: "Chiudere le mani intorno alla campana e scaldarla"
        descrizione: "Il buio è freddo, e il vetro freddo si lascia attraversare. Due mani calde lo tengono fuori, se resistono."
        prova: { attributo: fisico, abilita: resistenza, difficolta: Molto difficile }
        successo:
          titolo: Le mani sul vetro
          testo: |
            Chiudi le mani intorno alla campana di vetro e ci resti, con il buio
            che ti morde le dita come l'acqua di un pozzo d'inverno. La fiamma
            si raddrizza poco a poco. Quando il buio si ritira hai le mani
            bianche fino ai polsi, e per un pezzo non le senti.
          pe: { resistenza: 3 }
          effetti: { profondita.avv-investitura: 1 }
        fallimento:
          titolo: Le dita
          testo: |
            Le dita cedono prima della fiamma. Ritiri le mani dal vetro senza
            volerlo, con le nocche viola, e la fiamma si piega fin quasi a
            toccare la cera.
          effetti: { ferite: 0.5 }
      - testo: "Sigillare il bordo della campana con la cera calda"
        descrizione: "Il buio entra da sotto il bordo. La cera delle candele di Severina, scaldata, chiude anche le fessure più sottili."
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Difficile }
        successo:
          titolo: Il sigillo
          testo: |
            Scaldi un mozzicone di candela con l'acciarino e fai colare la cera
            lungo il bordo della campana, goccia per goccia, finché non resta
            una sola fessura aperta. Dentro, la fiamma si raddrizza. È la cera
            di Severina a chiuderle la porta, e la cosa ti piace più di quanto
            dovrebbe.
          pe: { tecnologia: 2 }
          effetti: { profondita.avv-investitura: 1 }
        fallimento:
          titolo: La goccia
          testo: |
            La cera ti cola sulle dita invece che sul vetro. Mentre scuoti la
            mano bruciata il buio entra da sotto il bordo, e la fiamma si
            abbassa fino a diventare un punto blu.
          effetti: { ferite: 0.5 }
      - testo: "Leggere ad alta voce le promesse del libro"
        descrizione: "Quarant'anni di promesse della casa, una per riga. Leggerle ad alta voce tiene sveglio te, e forse anche la fiamma."
        costo: 3
        esito:
          titolo: Le promesse
          testo: |
            Leggi il libro dalla prima pagina, ad alta voce, una promessa dopo
            l'altra. Un pozzo per Laresh, il grano per un inverno di carestia.
            Il buio intorno alla campana resta dov'è, e la fiamma smette di
            piegarsi. Arrivi alla pagina di Mira con la voce rauca.
          effetti: { profondita.avv-investitura: 1, tormento: 0.5 }

  # ------------------------------------------------------------ il cuore · l'ultima tacca
  - id: avv-investitura-l-ultima-tacca
    immagine: icone/hooded-figure
    titolo: L'ultima tacca
    sommario: "La candela della veglia arriva all'ultima tacca, e Severina Castaldi esce dal buio davanti all'altare."
    luogo: La Sala delle Promesse, l'altare
    area: avv-investitura
    requisiti: [avventura.investitura == 5, profondita.avv-investitura >= 10]
    testo: |
      La candela della veglia arriva all'ultima tacca, e dalle finestre della
      loggia entra un grigio appena più chiaro del buio. Allora il buio dietro
      l'altare si apre come una tenda, e ne esce Severina Castaldi.

      Ha ancora il vestito di lana grezza e le dita gialle di cera. Fra le mani
      tiene un oggetto di metallo nero della forma di una campana da tavola, con
      il manico ad anello e il bordo inciso di segni che non sono lettere. Dove
      lo punta la luce si ritira, e le ombre della sala le si stringono addosso
      fino a coprirle le spalle.

      «Lo Spegnitoio» dice, e lo solleva un poco perché tu lo veda. «L'ho pagato
      con tutti i miei alveari, al Mercato delle Ombre.» Si avvicina al libro
      senza fretta. «Trent'anni fa il padre di Aldous mi ha promesso questo
      libro davanti a tutta la casa. È morto prima della firma, e Aldous se l'è
      preso, e quella promessa non l'ha mai scritta nessuno.» Si sfila una penna
      dalla manica. «All'ultima tacca firma chi sta davanti all'altare con un
      testimone di fuori. Il testimone sei tu. Ti basta guardare.»

      {politica-ed-economia Media} Una firma così non reggerebbe un giorno
      davanti al Consiglio. Davanti alla casata, che crede alla regola più che
      ai tribunali, potrebbe reggere per sempre.

      {origine apprendista-raschiatore allievo-di-torvessa} Il metallo nero e i
      segni sul bordo sono dei Precursori. Una cosa del genere non dovrebbe
      stare in una casa, e nemmeno nelle mani di chi non sa da dove viene.
    opzioni:
      - testo: "Affrontarla davanti all'altare"
        descrizione: "Le ombre della sala le stanno addosso e prendono i colpi per lei. Sotto le ombre c'è una donna di cinquant'anni con un vestito di lana."
        combattimento: avv-investitura-severina
        vittoria:
          titolo: L'alba
          testo: |
            Le ombre le si staccano di dosso a ogni colpo, e alla fine Severina
            resta in mezzo alla sala con lo Spegnitoio fra le mani e
            nient'altro. Glielo strappi, e quando batte sul pavimento il metallo
            nero si spacca in due. Dalle finestre della loggia entra il grigio
            dell'alba.

            Dalla scala salgono i passi della famiglia. Quintus arriva per primo
            e prende Severina per un braccio, senza strattoni. Mira ti passa
            accanto, prende la penna dall'altare e firma il libro alla luce del
            giorno, con il naso quasi sulla pagina.
          effetti: { avventura.investitura: 1, reliquie.frammento-inciso: 2 }
          vai: quartieri-alti
        sconfitta:
          titolo: La campana in pezzi
          testo: |
            Le ombre ti si chiudono addosso, e l'ultima cosa che vedi è la
            campana di vetro che va in pezzi. Ti risvegli sul pavimento con la
            luce del giorno sulla faccia. Severina se n'è andata senza un
            testimone, e il libro non ha firme nuove. La veglia si rifà la notte
            dopo, da capo, ed Eolio ti porta un brodo senza dire niente.
          effetti: { ferite: 1 }
          vai: quartieri-alti
      - testo: "Strapparle di mano lo Spegnitoio"
        descrizione: "Le ombre vengono da lì, e lei lo tiene con due dita per il manico ad anello, come un campanello da tavola."
        prova: { attributo: fisico, abilita: [rissa, acrobazia], difficolta: Difficile }
        successo:
          titolo: Il manico ad anello
          testo: |
            Ti butti in avanti in mezzo alle ombre, che ti graffiano la faccia,
            e afferri lo Spegnitoio per il bordo. Severina tira, poi molla. Il
            metallo ti brucia il palmo di freddo, e lo scagli contro l'altare,
            dove si spacca in due. Le ombre cadono sul pavimento e restano lì,
            piatte. Dalle finestre entra il grigio dell'alba.

            Quintus sale per primo e prende Severina per un braccio. Mira ti
            passa accanto per prendere la penna, e firma il libro alla luce del
            giorno con il naso quasi sulla pagina.
          pe: { rissa: 5 }
          effetti: { avventura.investitura: 1, reliquie.frammento-inciso: 2 }
          vai: quartieri-alti
        fallimento:
          titolo: Il bordo nero
          testo: |
            Le tue dita arrivano al bordo, e il bordo beve il calore della mano
            in un colpo solo. Mentre ritiri il braccio le ombre ti prendono in
            pieno e ti sbattono contro i candelabri. Ti risvegli con la luce del
            giorno sulla faccia, il libro senza firme nuove e la veglia da
            rifare la notte dopo.
          effetti: { ferite: 1.5, tormento: 0.5 }
          vai: quartieri-alti
      - testo: "Girarle contro il bordo dello Spegnitoio"
        descrizione: "I segni sul bordo indicano da che parte beve. Chi sa leggere il Mana lo può far bere dalla parte sbagliata."
        prova: { attributo: mentale, abilita: [magia, tecnologia], difficolta: Difficile }
        successo:
          titolo: Il bordo girato
          testo: |
            Guardi i segni sul bordo e capisci da che parte beve. Quando
            Severina lo solleva verso di te gli dai un colpo secco sul manico, e
            il bordo si gira verso di lei. Lo Spegnitoio le beve di dosso le
            ombre in un sorso solo, e le scivola dalle dita già spento. Severina
            resta in mezzo alla sala con le mani vuote, mentre dalle finestre
            entra il grigio dell'alba.

            Quintus sale per primo e la prende per un braccio. Mira firma il
            libro alla luce del giorno, con il naso quasi sulla pagina.
          pe: { magia: 5 }
          effetti: { avventura.investitura: 1, reliquie.frammento-inciso: 2 }
          vai: quartieri-alti
        fallimento:
          titolo: La bocca nera
          testo: |
            Giri il bordo dalla parte sbagliata, e lo Spegnitoio beve da te
            invece che da lei. Ti senti svuotare dalle dita fino alle spalle e
            cadi in ginocchio. Ti risvegli con la luce del giorno sulla faccia,
            il libro senza firme nuove e la veglia da rifare la notte dopo.
          effetti: { ferite: 1, contaminazione: 1 }
          vai: quartieri-alti
      - testo: "Prometterle che il libro scriverà la promessa mancata"
        descrizione: "Ti ha raccontato della promessa del vecchio. Il testimone può chiedere che venga scritta, e lei lo sa."
        requisiti: [avv-investitura.storia >= 1]
        prova: { attributo: sociale, abilita: [persuasione, empatia], difficolta: Difficile }
        successo:
          titolo: Trent'anni
          testo: |
            Le dici che sei il testimone, e che all'alba chiederai davanti a
            tutta la casa che il libro scriva la promessa che le hanno fatto.
            Severina ti guarda a lungo. Poi abbassa piano lo Spegnitoio, e le
            ombre le scivolano di dosso come uno scialle. «Trent'anni» dice, e
            lo posa sull'altare con tanta forza che il metallo si spacca.

            Quintus sale per primo e la prende per un braccio, e lei lo lascia
            fare. Mira firma il libro alla luce del giorno, con il naso quasi
            sulla pagina.
          pe: { persuasione: 5 }
          effetti: { avventura.investitura: 1, reliquie.frammento-inciso: 2 }
          vai: quartieri-alti
        fallimento:
          titolo: Le promesse dei Castaldi
          testo: |
            «Le promesse dei Castaldi» dice Severina, e ride. Le ombre ti
            arrivano addosso tutte insieme. Ti risvegli con la luce del giorno
            sulla faccia, il libro senza firme nuove e la veglia da rifare la
            notte dopo.
          effetti: { tormento: 1, ferite: 0.5 }
          vai: quartieri-alti
      - testo: "Chiamare di sopra gli ospiti"
        descrizione: "Nel magazzino ci sono abbastanza ospiti in forze per tenere la porta senza Quintus. Se li chiami, salgono con le lampade a olio."
        requisiti: [avv-investitura.ospiti >= 4]
        combattimento: avv-investitura-severina-alle-strette
        vittoria:
          titolo: Le lampade a olio
          testo: |
            Gridi verso la scala, e la casa ti risponde. Marella sale per prima
            con una lampada a olio alzata sopra la testa, e dietro di lei
            vengono gli ospiti, ognuno con la sua luce, e Quintus con la spada.
            La luce stacca a Severina metà delle ombre di dosso, Quintus le
            taglia la strada delle scale, e tu le strappi lo Spegnitoio. Si
            spacca in due sul pavimento.

            Dalle finestre entra il grigio dell'alba. Mira passa in mezzo agli
            ospiti e firma il libro con la lampada di sua madre accanto.
          effetti: { avventura.investitura: 1, reliquie.frammento-inciso: 2 }
          vai: quartieri-alti
        sconfitta:
          titolo: Prima delle lampade
          testo: |
            Le ombre si chiudono su di te prima che le lampade arrivino in cima
            alla scala. Ti risvegli con la luce del giorno sulla faccia e
            Marella che ti tampona la fronte. Severina è sparita, il libro non
            ha firme nuove, e la veglia si rifà la notte dopo, da capo.
          effetti: { ferite: 1 }
          vai: quartieri-alti
