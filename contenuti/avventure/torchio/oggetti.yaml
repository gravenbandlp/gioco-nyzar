# L'oggetto dell'Avventura «Il torchio che non si ferma»: la corazza che Lapo Calandri ricava dalle piastre del
# portabotti, consegnata nell'ultima scena (avv-torchio-la-corazza-del-portabotti, avventura.torchio 6 → 7).
# Grado 4 su base armatura a piastre: 2 dadi, Robusta 1 (2 punti) e Ostinata (1), cinque punti con il difetto
# Pesante, come le Piastre della Caserma con una proprietà in più pagata dal peso.
oggetti:
  - id: avv-torchio-corazza-del-portabotti
    nome: Corazza del portabotti
    immagine: icone/chest-armor
    descrizione: "Le piastre del portabotti del Torchio Dossena, ribattute da Lapo Calandri su un giaco di cuoio e lucidate con la cenere del forno. Sono di un metallo che i Precursori fondevano per alzare botti piene, e pesano come una botte vuota. Quando sei ferit{o|a} e stringi i denti, le piastre si scaldano sotto le mani."
    slot: armatura
    base: armatura-a-piastre
    grado: 4
    dadi: 2
    proprieta: { robusta: 1, ostinata: true }
    difetti: [pesante]
