# I nemici dell'Avventura «Il torchio che non si ferma» (avventura.torchio), tarati con
# `npx tsx scripts/simula-fine.ts avv-torchio-` sul profilo «fine contenuti» (docs/piano-avventure.md):
# gregari fra il 70 e l'85%, il portabotti fra il 40 e il 55%.
# Sono gli automi del Torchio Dossena, carcasse di macchine dei Precursori comprate all'Orlo dei Rottami e rimesse in
# piedi da Lapo Calandri con i cristalli conduttori. Dopo il fulmine il pannello centrale li carica di Mana senza
# fermarsi, e lavorano più in fretta di quanto siano stati costruiti per fare.
# - le cesoie volanti (i cortili e i cancelli, profondità 0-3): i potatori appesi ai fili tesi sopra il torchio;
# - il raccoglitore di rame (il frutteto, 4-6): la macchina sui trampoli che coglie le mele;
# - il tappatore (il reparto, 7-9): la macchina che batte i tappi nelle botti;
# - il portabotti (il cuore): l'automa grande che porta le botti piene in cantina, accelerato dal pannello.
nemici:
  - id: avv-torchio-cesoia-volante
    immagine: icone/saw-claw
    nome: Cesoia volante
    descrizione: "Un corpo di ottone grande come un'anguria, appeso con due ruote a un filo teso fra i tetti, con un braccio che finisce in un paio di cesoie da potatura. Corre lungo il filo più veloce di un uomo, e taglia quello che trova all'altezza dei rami."
    attacco: 5
    difesa: 4
    difesaMentale: 5
    pf: 11
    danno: 3
    riduzione: 3
    iniziativa: 4

  - id: avv-torchio-raccoglitore-di-rame
    immagine: icone/robot-grab
    nome: Raccoglitore di rame
    descrizione: "Una macchina alta due uomini su tre gambe sottili, con le braccia di rame snodate e le dita imbottite di feltro per non ammaccare le mele. Dopo il fulmine il feltro è venuto via, e le dita stringono come morse."
    attacco: 6
    difesa: 3
    difesaMentale: 5
    pf: 12
    danno: 3
    riduzione: 3
    iniziativa: 2

  - id: avv-torchio-tappatore
    immagine: icone/clockwork
    nome: Tappatore
    descrizione: "Un automa basso e tozzo con un mazzuolo di legno al posto della mano destra, fatto per piantare i tappi nelle botti con un colpo solo. Adesso pianta il mazzuolo in tutto quello che ha la forma di un tappo, e anche nel resto."
    attacco: 6
    difesa: 3
    difesaMentale: 5
    pf: 11
    danno: 3
    riduzione: 3
    iniziativa: 2

  - id: avv-torchio-portabotti
    immagine: bestiario/salvaguardia-precursori
    nome: Il portabotti
    descrizione: "L'automa più grande del Torchio Dossena, largo come un carro, con quattro braccia a tenaglia fatte per alzare una botte piena e un corpo di piastre ribattute. Lapo lo chiama il Mulo. Dopo il fulmine corre per il reparto due volte più svelto di come l'hanno costruito, e le piastre fumano."
    attacco: 6
    difesa: 4
    difesaMentale: 6
    pf: 28
    danno: 3
    riduzione: 5
    iniziativa: 3

scontri:
  - { id: avv-torchio-le-cesoie, nome: "Le cesoie volanti", nemici: [avv-torchio-cesoia-volante, avv-torchio-cesoia-volante], feriteSconfitta: 2 }
  - { id: avv-torchio-i-raccoglitori, nome: "I raccoglitori di rame", nemici: [avv-torchio-raccoglitore-di-rame, avv-torchio-raccoglitore-di-rame], feriteSconfitta: 2 }
  - { id: avv-torchio-i-tappatori, nome: "I tappatori", nemici: [avv-torchio-tappatore, avv-torchio-tappatore], feriteSconfitta: 2 }
  - { id: avv-torchio-il-portabotti, nome: "Il portabotti", nemici: [avv-torchio-portabotti], feriteSconfitta: 3 }
