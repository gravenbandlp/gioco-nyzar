# Le voci del glossario per i nomi nuovi dell'Avventura «Il torchio che non si ferma» (approvazione di Luca in blocco).
# - Amerigo Dossena, l'investitore di Qir-Azel che ha comprato il mulino del rio basso di Laresh;
# - Lapo Calandri, il meccanico che ha rimesso in piedi gli automi comprati all'Orlo dei Rottami;
# - Ottavia Rendina, socia della Gilda dei Mercanti, che compra il torchio dopo il fulmine (dall'epilogo);
# - Rufo Pandolfi e Gemma Siroli, due degli ospiti della visita;
# - il Torchio Dossena (luogo) e il portabotti (creatura).
glossario:
  - id: amerigo-dossena
    nome: Amerigo Dossena
    alias: [Dossena]
    tipo: personaggio
    sottotitolo: "Investitore di Qir-Azel, padrone del Torchio Dossena"
    testo: "Uomo d'affari dei Ponti Sospesi che ha comprato il mulino del rio basso di Laresh e il meleto dietro, e ci ha costruito un torchio e una distilleria mossi dal Mana. Porta tre anelli sulla stessa mano e li gira quando parla di guadagni, cioè quasi sempre. Ripete che le cose vanno giudicate quando sono a regime."
    requisiti: []

  - id: lapo-calandri
    nome: Lapo Calandri
    alias: [Lapo]
    tipo: personaggio
    sottotitolo: "Il meccanico del Torchio Dossena"
    testo: "Meccanico cresciuto in Città Bassa, che per anni ha comprato all'Orlo dei Rottami i pezzi delle macchine dei Precursori buttati dai Raschiatori e li ha rimessi in piedi. Ha costruito gli automi del Torchio Dossena e li chiama ragazzi, uno per uno, con un nome. Ha le dita piene di bruciature vecchie e non si siede mai."
    requisiti: []

  - id: ottavia-rendina
    nome: Ottavia Rendina
    alias: [Rendina]
    tipo: personaggio
    sottotitolo: "Socia della Gilda dei Mercanti"
    testo: "Socia della Gilda dei Mercanti che compra per la Casa dei Nodi le imprese finite male, a un prezzo che chi vende non dimentica. Veste di verde scuro, scrive in piedi su una tavoletta appoggiata all'avambraccio e comincia le frasi importanti con conveniamo. Ha comprato il Torchio Dossena il mattino dopo il fulmine."
    requisiti: [avventura.torchio >= 5]

  - id: rufo-pandolfi
    nome: Rufo Pandolfi
    alias: [Pandolfi]
    tipo: personaggio
    sottotitolo: "Oste dei Ponti Sospesi"
    testo: "Oste di una taverna dei Ponti Sospesi, un uomo grosso dalla faccia rossa che compra liquori da chiunque li porti fino al suo bancone. Era fra gli ospiti della visita al Torchio Dossena per assaggiare la prima acquavite di mele di Laresh, e ha un debole per i cappelli piumati."
    requisiti: []

  - id: gemma-siroli
    nome: Gemma Siroli
    alias: [Siroli]
    tipo: personaggio
    sottotitolo: "Vedova di un cambiavalute dei Ponti"
    testo: "Vedova di un cambiavalute dei Ponti Sospesi che presta il denaro del marito a chi ha un'impresa e una buona storia da raccontare. Ha più di settant'anni, un bastone di ebano col pomo d'argento e la vista di un falco. Era fra gli ospiti della visita al Torchio Dossena."
    requisiti: []

  - id: torchio-dossena
    nome: Torchio Dossena
    tipo: luogo
    sottotitolo: "Il torchio e la distilleria sul rio basso di Laresh"
    testo: "Il vecchio mulino del rio basso di Laresh, comprato da Amerigo Dossena e allargato con un reparto di mattoni nuovi e un camino di rame. Il torchio spreme le mele del meleto dietro il mulino e gli alambicchi ne fanno acquavite per le osterie di Qir-Azel. Il lavoro lo fanno gli automi, e il Mana dei cristalli conduttori li muove."
    requisiti: []

  - id: portabotti
    nome: portabotti
    tipo: creatura
    sottotitolo: "L'automa più grande del Torchio Dossena"
    testo: "Un automa largo come un carro, con quattro braccia a tenaglia e un corpo di piastre ribattute, fatto per portare le botti piene dal reparto alla cantina del Torchio Dossena. Lapo Calandri l'ha rimesso in piedi da una carcassa dei Precursori comprata all'Orlo dei Rottami, e lo chiama il Mulo."
    requisiti: []
