# Avventura n. 13, «Il torchio che non si ferma» (docs/piano-avventure.md), da Trouble Brewing. Si apre a Laresh
# dopo la quest del villaggio (fazione.laresh >= 15). La pista è avventura.torchio, da 0 a 7.
# Un investitore di Qir-Azel, Amerigo Dossena, ha comprato il mulino del rio basso e il meleto vecchio e ne ha fatto
# un torchio e una distilleria d'acquavite di mele mossi dal Mana, con automi rimessi in piedi da carcasse dei
# Precursori comprate all'Orlo dei Rottami. Ha risparmiato il parafulmine e le leve d'arresto che il meccanico gli
# chiedeva; il giorno della visita un fulmine carica il pannello dei cristalli e gli automi non si fermano più.
# - 0 → 1 `avv-torchio-l-invito` (Casa Velar): il biglietto di Dossena, che ha sentito della tua borsa.
# - 1 → 2 `avv-torchio-la-visita` (il torchio sul rio basso) e il seguito `avv-torchio-il-fulmine`. La visita può
#   lasciare un vantaggio: avv-torchio.pannello (Tecnologia), avv-torchio.sportelli (Lapo e i suoi automi) o
#   avv-torchio.contratto (Dossena racconta che cosa ha risparmiato).
# - 2 → 3 `avv-torchio-oltre-il-cancello` (l'osteria sul rio): Dossena in fuga; le sue chiavi (avv-torchio.chiavi).
# - 3 → 4 `avv-torchio-il-meccanico` e il seguito `avv-torchio-quello-che-sa-lapo`: Lapo esce dalla gora e spiega che il
#   pannello va rotto; ti dà una cosa sola fra la chiave a T (sportelli), il disegno del reparto (pannello) e la
#   valvola delle caldaie (avv-torchio.valvola).
# - 4: `avv-torchio-il-cancello` porta nella spedizione `avv-torchio` (spedizione.yaml); il cuore porta la pista a 5.
# - 5 → 6 `avv-torchio-il-torchio-fermo`: Ottavia Rendina compra il torchio per la Gilda e fa capo officina Lapo; la
#   scelta (avv-torchio.scelta 1 il rio basso pagato a Laresh, 2 Dossena alla Caserma, 3 una quota per te).
# - 6 → 7 `avv-torchio-la-corazza-del-portabotti`: Lapo ti dà la corazza fatta con le piastre del Mulo.
# Origini: mercante-dei-ponti (l'invito, Dossena, Ottavia), allievo-di-torvessa (il pannello), figlio-della-citta-bassa
# (Lapo e l'Orlo dei Rottami), apprendista-raschiatore (Lapo fuori dalla gora), rampollo-dei-quartieri-alti (Dossena).
# Nomi nuovi in glossario.yaml. Il mugnaio del rio basso che vende il mulino è quello delle letture di Old Marrek
# (`laresh-il-grano-bruciato`), senza nome.
quality:
  - { id: avventura.torchio, immagine: ambientazione/mulino-malgrani, nome: "Il torchio che non si ferma", categoria: pista, descrizione: "Amerigo Dossena ti ha invitato a vedere il suo torchio a Mana sul rio basso di Laresh, prima dell'inaugurazione." }
  - { id: avv-torchio.pannello, immagine: icone/circuitry, nome: Il pannello dei cristalli, categoria: stato, descrizione: "Sai dove sta il pannello centrale del Torchio Dossena e dove i cavi entrano nella tavola d'ottone." }
  - { id: avv-torchio.sportelli, immagine: icone/spanner, nome: Gli sportelli degli automi, categoria: stato, descrizione: "Sai aprire lo sportello che ogni automa del Torchio Dossena ha sul dorso, dietro una vite a farfalla, e togliergli il cristallo." }
  - { id: avv-torchio.contratto, immagine: icone/quill-ink, nome: I risparmi di Dossena, categoria: stato, descrizione: "Davanti agli ospiti, e al notaio di Gemma Siroli, Dossena si è vantato di aver risparmiato il parafulmine e le leve d'arresto." }
  - { id: avv-torchio.chiavi, immagine: icone/house-keys, nome: Le chiavi di Dossena, categoria: stato, descrizione: "Il mazzo di chiavi del Torchio Dossena, con quella del cancello grande." }
  - { id: avv-torchio.valvola, immagine: icone/steam, nome: La valvola delle caldaie, categoria: stato, descrizione: "Lapo ti ha detto dove sta la valvola grande delle caldaie del reparto, e di quanto girarla." }
  - { id: avv-torchio.ospiti, nome: Gli ospiti del melo, categoria: stato, nascosta: true, descrizione: "1 se hai tirato giù dal melo grande gli ospiti di Dossena." }
  - { id: avv-torchio.scelta, nome: Il prezzo del torchio, categoria: stato, nascosta: true, descrizione: "1 se il torchio paga il rio basso a Laresh; 2 se Dossena è andato alla Caserma; 3 se hai preso una quota della Gilda." }

storylet:
  # ------------------------------------------------------------ 0 → 1 · l'invito
  - id: avv-torchio-l-invito
    presso: laresh
    immagine: icone/wax-seal
    titolo: Un biglietto con il sigillo
    sommario: "Tano ti porta una busta color crema, chiusa da un sigillo di ceralacca rossa. Viene dal mulino del rio basso, che ha un padrone nuovo."
    luogo: Laresh, l'aia di Casa Velar
    area: superficie-fratturata
    requisiti: [fazione.laresh >= 15, avventura.torchio == 0]
    testo: |
      Tano ti trova sull'aia di Casa Velar con una busta color crema chiusa da un sigillo di ceralacca rossa,
      che tiene per un angolo lontano dalla camicia. La carta è spessa e liscia, di quella che a Laresh non
      vende nessuno.

      Amerigo Dossena ti invita al Torchio Dossena sul rio basso per una visita privata il giorno prima
      dell'inaugurazione. *In città si dice che la vostra borsa sia cresciuta insieme alla vostra fama*
      scrive, *e io ho un'impresa che cresce più in fretta di entrambe*.

      «Il nonno l'aveva detto che il mugnaio del rio basso vendeva» dice Tano. «L'ha comprato uno di città, e
      ci fa l'acquavite con le mele del meleto vecchio. Le colgono le macchine, anche di notte.»

      Dal portico la Dama guarda la busta senza toccarla, con la penna ferma sopra il libro.

      {politica-ed-economia Media} Un invito prima dell'inaugurazione si manda a chi ha denaro da mettere,
      quando una quota costa quello che dice lui.

      {origine mercante-dei-ponti} Alla Casa dei Nodi il nome Dossena l'hai letto spesso in fondo ai registri
      dei prestiti, accanto alla parola *proroga*.
    opzioni:
      - testo: "Rispondere che ci sarai"
        descrizione: "Il biglietto dice che una visita è gratuita. Il biglietto l'ha scritto lui."
        esito:
          titolo: La risposta
          testo: |
            Scrivi due righe sul retro di un conto della Dama, con la penna che gratta sulla carta ruvida, e
            le dai a Tano, che parte di corsa verso il rio basso tenendole per un angolo. La Dama torna ai
            suoi conti. Prima di chinarsi sul libro ti fa sapere che il mugnaio del rio basso ha venduto senza
            passare dal suo portico, e che a Laresh prima di lui non l'aveva fatto nessuno.
          effetti: { avventura.torchio: 1 }
      - testo: "Chiedere alla Dama che cosa ne pensa"
        descrizione: "Del rio basso la Dama sa tutto, anche quello che nel libro non scrive."
        esito:
          titolo: Chi ha fretta
          testo: |
            La Dama chiude il libro su un dito per tenere il segno. «Allora. Uno che compra un mulino a Laresh
            senza passare prima dalla mia tavola ha fretta» dice la Dama, «e di solito è perché ha dei
            debiti.» Ti chiede di andarci e di guardare bene le sue macchine, perché a Laresh le macchine di
            quelli di prima si sono già bevute tre raccolti. Tano parte di corsa con la tua risposta.
          effetti: { avventura.torchio: 1 }
      - testo: "Rispondere con la formula della Casa dei Nodi"
        descrizione: "Alla Gilda un invito a investire si accetta in un modo solo, e chi lo riceve capisce."
        quando: [origine.mercante-dei-ponti >= 1]
        esito:
          titolo: Salvo verifica dei libri
          testo: |
            Scrivi sul retro del biglietto che accetti la visita salvo verifica dei libri, come si fa alla
            Casa dei Nodi, e lo richiudi premendo la tua cera con il pollice accanto al sigillo rosso. Dossena
            capirà che arriva un mercante. Tano corre via con il biglietto, e la Dama, dal portico, ti guarda
            con un poco più di rispetto.
          effetti: { avventura.torchio: 1 }

  # ------------------------------------------------------------ 1 · la visita
  - id: avv-torchio-la-visita
    presso: laresh
    immagine: ambientazione/mulino-malgrani
    titolo: La visita al Torchio Dossena
    sommario: "Il mulino del rio basso ha un camino di rame nuovo, un muro di cinta e automi che lavorano da soli. Amerigo Dossena ti aspetta al cancello."
    luogo: Laresh, il Torchio Dossena sul rio basso
    area: superficie-fratturata
    requisiti: [avventura.torchio == 1]
    testo: |
      Il mulino del rio basso non lo riconosci più. Accanto alla ruota è sorto un reparto di mattoni con un
      camino di rame alto come un campanile, e intorno corre un muro di cinta. Fra i tetti sono tesi fili
      d'ottone su cui scorrono le cesoie volanti, con il loro braccio da potatore, e sui fili non si posa un
      passero. Nel meleto lavorano i raccoglitori di rame su tre gambe, che lasciano nell'erba tre file di
      buchi dritte e alla stessa distanza.

      Amerigo Dossena, un uomo morbido in panciotto color prugna, ti viene incontro a braccia aperte e mentre
      parla si gira gli anelli. «{Socio mio|Socia mia}» dice, anche se non lo sei. «Il primo torchio a Mana
      della Superficie. Lavora giorno e notte senza chiedere la paga.»

      Nel cortile aspettano gli altri ospiti. Rufo Pandolfi è un oste dei Ponti Sospesi con un cappello
      piumato, e Gemma Siroli è una vedova con un bastone d'ebano e un notaio giovane al seguito. Dietro a
      tutti cammina il meccanico Lapo Calandri, con una chiave a T alla cintura e le dita piene di bruciature
      vecchie.

      {tecnologia Media} Gli automi sono carcasse dei Precursori rattoppate con ottone e pezzi di carro, e le
      giunture vecchie non girano come le nuove. Il metallo dei Precursori non ha un punto di ruggine, mentre
      i bulloni di Lapo sono già rossi.

      A ovest il cielo si fa scuro.
    opzioni:
      - testo: "Farti mostrare il pannello centrale"
        descrizione: "Il reparto è il cuore del torchio, dice Dossena. A guardare dove vanno i cavi, il cuore del reparto è il muro in fondo."
        prova: { attributo: mentale, abilita: [tecnologia, magia], difficolta: Media }
        successo:
          titolo: Il muro dei cristalli
          testo: |
            Lapo ti porta in fondo al reparto, oltre la rotaia del portabotti. Sul muro c'è una tavola
            d'ottone con dodici cristalli conduttori in file, accesi di un azzurro tranquillo, e da ogni
            cristallo parte un cavo di rame che sale al camino. La tavola ronza piano, e a un palmo
            dall'ottone l'aria è tiepida. Ti indica il punto, sotto la tavola, dove i cavi entrano tutti
            insieme. «Li carica un mago di Torvessa, una volta al mese» dice, «e questo mese il signor Dossena
            non l'ha fatto venire.»
          pe: { tecnologia: 3 }
          effetti: { avv-torchio.pannello: 1 }
          segue: avv-torchio-il-fulmine
        fallimento:
          titolo: Il cristallo che punge
          testo: |
            Allunghi un dito verso un cristallo per guardare da vicino la montatura, e la scossa ti sale fino
            al gomito e ti lascia il dito bianco e senza sensibilità. Dossena ride forte e ti trascina via
            verso l'acquavite con un braccio intorno alle spalle, che non riesci a scrollarti di dosso.
          effetti: { ferite: 0.5 }
          segue: avv-torchio-il-fulmine
      - testo: "Parlare d'affari con Dossena"
        descrizione: "Vuole un socio, e un socio ha il diritto di sapere dove sono finiti i soldi."
        prova: { attributo: mentale, abilita: politica-ed-economia, difficolta: Media }
        successo:
          titolo: I risparmi del signor Dossena
          testo: |
            Gli chiedi delle spese, e lui te le elenca con orgoglio girando gli anelli, un anello per ogni
            voce. Lapo voleva un'asta di ferro sul camino, con una corda fino a terra per i fulmini, e una
            leva d'arresto su ogni automa. «Roba da vecchie zitelle» dice Dossena, «e il risparmio è il primo
            guadagno.» Accanto a te il notaio di Gemma Siroli scrive qualcosa sul suo taccuino.
          pe: { politica-ed-economia: 3 }
          effetti: { avv-torchio.contratto: 1 }
          segue: avv-torchio-il-fulmine
        fallimento:
          titolo: Il socio
          testo: |
            Dossena ti prende sottobraccio e ti parla di quote, con il fiato che sa già di acquavite, finché
            senza accorgertene gli hai detto di sì davanti a tutti gli ospiti. Rufo Pandolfi ti batte sulla
            spalla e si congratula con il nuovo socio, e ci vorrà del bello e del buono per spiegargli come
            stanno le cose.
          effetti: { scandalo: 0.5 }
          segue: avv-torchio-il-fulmine
      - testo: "Stare dietro a Lapo e ai suoi automi"
        descrizione: "Il meccanico parla poco con gli ospiti. Alle sue macchine, invece, parla a voce bassa."
        prova: { attributo: sociale, abilita: [empatia, conoscenze-della-strada], difficolta: Media }
        successo:
          titolo: Le Rondini e gli Aironi
          testo: |
            Resti indietro con Lapo, e dopo un po' lui comincia a presentarti gli automi per nome. Le cesoie
            sui fili sono le Rondini, i raccoglitori sono gli Aironi, e il portabotti del reparto è il Mulo.
            Ti fa vedere lo sportello che ognuno ha sul dorso, dietro una vite a farfalla, con il cristallo
            che lo muove e che manda luce azzurra dalle fessure. «Tolto quello, dormono» dice, e batte il
            palmo sul fianco di un Airone come si fa con un cavallo. «Il signor Dossena dice che le leve
            d'arresto rallentano il lavoro.»
          pe: { empatia: 3 }
          effetti: { avv-torchio.sportelli: 1 }
          segue: avv-torchio-il-fulmine
        fallimento:
          titolo: Il meccanico che non si siede
          testo: |
            Gli fai domande su domande, e Lapo ti chiede se ti manda il signor Dossena a controllare quanto
            lavora. Da quel momento ti risponde a monosillabi, senza smettere di camminare, e ti lascia
            indietro davanti a un raccoglitore fermo. Anche da fermo il raccoglitore ronza, e le tre gambe gli
            tremano appena nell'erba.
          effetti: { sospetto: 0.5 }
          segue: avv-torchio-il-fulmine
      - testo: "Leggere la montatura dei cristalli da alliev{o|a} dell'Accademia"
        descrizione: "Una tavola di cristalli conduttori la sai leggere. Ti basta vederla."
        quando: [origine.allievo-di-torvessa >= 1]
        esito:
          titolo: Senza un filo di terra
          testo: |
            In fondo al reparto c'è una tavola d'ottone con dodici cristalli conduttori in file, e tu la leggi
            come un esercizio di Temmerin. I cristalli sono quasi scarichi, con l'azzurro che si vede appena
            in fondo alla pietra. I cavi che salgono al camino sono di rame da carro, senza un filo che scenda
            a terra. «Glielo dicevo io» mormora Lapo, che ti ha guardato leggere, e ti indica il punto dove i
            cavi entrano nella tavola.
          pe: { magia: 3 }
          effetti: { avv-torchio.pannello: 1 }
          segue: avv-torchio-il-fulmine
      - testo: "Chiedere a Lapo da quale mucchio dell'Orlo vengono"
        descrizione: "Pezzi come quelli li hai visti tirar fuori dal fango sotto il margine della Città Bassa."
        quando: [origine.figlio-della-citta-bassa >= 1]
        esito:
          titolo: Dal fango dell'Orlo
          testo: |
            Glielo chiedi, e Lapo si ferma per la prima volta da quando sei arrivat{o|a}. Ti racconta del
            mucchio dietro la baracca di Grusk, dove ha comprato le carcasse a peso di ferro vecchio, e
            intanto si pulisce le mani sui calzoni. Poi ti fa vedere lo sportello che ogni automa ha sul
            dorso, dietro una vite a farfalla, con il cristallo che lo muove. «Tolto quello, dormono» dice, e
            batte il palmo sul fianco di un Airone come si fa con un cavallo.
          pe: { tecnologia: 3 }
          effetti: { avv-torchio.sportelli: 1 }
          segue: avv-torchio-il-fulmine

  - id: avv-torchio-il-fulmine
    presso: laresh
    immagine: icone/lightning-tree
    titolo: Il fulmine sul camino
    tipo: seguito
    luogo: Laresh, il Torchio Dossena, il cortile del brindisi
    area: superficie-fratturata
    requisiti: [avventura.torchio == 1]
    testo: |
      Il brindisi si fa nel cortile sotto i fili, con la prima acquavite del torchio in bicchierini di vetro
      verde. Sa di mele cotte e ti brucia in gola fino in fondo. Dossena alza il suo verso il camino proprio
      mentre arrivano il vento e le prime gocce tiepide.

      Il fulmine cade sul camino, e il torchio si accende tutto d'azzurro prima di spegnersi. Senti i capelli
      alzarsi sulla nuca e in bocca un sapore di ferro, e il tuono arriva insieme alla luce. Quando le Rondini
      ripartono vanno al doppio della velocità e tagliano quello che incontrano, dai rami dei meli al cappello
      piumato di Rufo Pandolfi. Nel meleto un Airone strappa un ramo intero, e dal reparto esce il Mulo che
      scaglia una botte contro il muro.

      Dossena arriva primo al cancello e tira il chiavistello da fuori. Gli ospiti scappano verso il meleto,
      mentre Lapo corre verso il reparto gridando i nomi dei suoi automi.

      {acrobazia Media} Le Rondini tagliano sempre all'altezza dei rami, e piegati in due si passa sotto.
    opzioni:
      - testo: "Scavalcare il muro dietro a Dossena"
        descrizione: "Il muro di cinta è alto due uomini, e dall'altra parte c'è la strada dell'osteria."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Media }
        successo:
          titolo: Il panciotto color prugna
          testo: |
            Corri piegat{o|a} sotto i fili fino al muro, ti arrampichi sulle botti accatastate e viscide di
            pioggia e ti butti dall'altra parte, nel fango della strada. Laggiù, verso l'osteria sul rio, vedi
            il panciotto color prugna di Dossena che corre con le mani sopra la testa. Dietro il muro il
            torchio continua a battere.
          pe: { atletica: 3 }
          effetti: { avventura.torchio: 1 }
        fallimento:
          titolo: La giubba aperta
          testo: |
            Una Rondine ti passa sopra mentre sei in cima al muro e ti apre la giubba sulla spalla con un
            rumore di forbici. Cadi di schiena dall'altra parte, nel fango della strada. Quando ti rialzi
            Dossena è già lontano, verso l'osteria sul rio, e dietro il muro il torchio continua a battere.
          effetti: { avventura.torchio: 1, ferite: 0.5 }
      - testo: "Portare gli ospiti fino al meleto"
        descrizione: "Gemma Siroli ha più di settant'anni e un bastone, e Rufo Pandolfi corre come una botte che rotola."
        prova: { attributo: fisico, abilita: [armi-da-mischia, rissa], difficolta: Media }
        successo:
          titolo: Il palo del gazebo
          testo: |
            Stacchi un palo del gazebo e lo tieni alto sopra le teste degli ospiti, e le Rondini ci sbattono
            contro mentre li spingi verso il meleto. A ogni colpo il palo ti vibra fra le mani fino ai gomiti.
            Rufo issa Gemma su un melo vecchio e grande e ci sale dietro di lei con il notaio. Tu esci dal
            cancelletto della gora, sotto la ruota del mulino, con l'acqua fino al petto.
          pe: { armi-da-mischia: 3 }
          effetti: { avventura.torchio: 1 }
        fallimento:
          titolo: Il palo tagliato
          testo: |
            A metà cortile una Rondine ti taglia il palo fra le mani, e il colpo ti arriva sul braccio con un
            taglio dritto e pulito. Gli ospiti raggiungono il meleto da soli e salgono su un melo vecchio e
            grande. Tu esci dal cancelletto della gora con l'acqua fino al petto e il braccio che sanguina.
          effetti: { avventura.torchio: 1, ferite: 0.5 }
      - testo: "Correre dietro a Lapo verso il reparto"
        descrizione: "Il meccanico va dalla parte da cui scappano tutti gli altri. Forse sa una cosa che gli altri non sanno."
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Media }
        successo:
          titolo: La porticina della gora
          testo: |
            Raggiungi Lapo sulla porta del reparto. Dentro, i cristalli del pannello sono bianchi come la
            brace, e l'aria sa di rame bruciato. Il Mulo corre lungo la sua rotaia più veloce di un cavallo.
            Lapo ti spinge fuori per la porticina che dà sulla gora. «Qui ci penso io» grida. «Tu vai fuori!»
            La porticina ti si chiude alle spalle, e senti girare la chiave dall'interno.
          pe: { tecnologia: 3 }
          effetti: { avventura.torchio: 1 }
        fallimento:
          titolo: Fra i trucioli
          testo: |
            Raggiungi Lapo sulla porta del reparto proprio mentre il Mulo passa sulla rotaia, e lo spostamento
            d'aria ti butta a terra fra i trucioli e ti svuota il petto. Lapo ti trascina fino alla porticina
            della gora e ti spinge fuori. Mentre cadi nell'acqua lo senti girare la chiave dall'interno.
          effetti: { avventura.torchio: 1, ferite: 0.5 }

  # ------------------------------------------------------------ 2 → 3 · oltre il cancello
  - id: avv-torchio-oltre-il-cancello
    presso: laresh
    immagine: icone/coins
    titolo: Oltre il cancello
    sommario: "All'osteria sul rio Amerigo Dossena grida al cocchiere di attaccare i cavalli. Ha in mano le chiavi del torchio, e non se n'è accorto."
    luogo: Laresh, l'osteria sul rio
    area: superficie-fratturata
    requisiti: [avventura.torchio == 2]
    testo: |
      All'osteria sul rio Amerigo Dossena è seduto sul predellino della carrozza, bagnato fino agli anelli, e
      grida al cocchiere di attaccare i cavalli. Il panciotto color prugna gli si è incollato alla pancia, e
      dalle maniche gli cola acqua nel fango. Stringe in mano un grosso mazzo di chiavi senza essersene
      accorto, e mezza osteria lo guarda senza aiutarlo.

      Dal rio basso arriva il battito del torchio, più svelto di prima. I cavalli lo sentono prima della gente
      e scartano sotto le stanghe a ogni colpo.

      «Un guasto» dice Dossena quando ti vede. «Un incidente della natura. Torno a Qir-Azel a parlare con chi
      di dovere...» Si interrompe, perché dal meleto qualcuno grida aiuto.

      {intimidire Media} Ha più paura del torchio che di te, e a questo si può rimediare.

      {origine rampollo-dei-quartieri-alti} Uomini come Dossena li hai visti ai ricevimenti dei Quartieri
      Alti, vicino al tavolo dei dolci e lontano dalla porta quando entra un creditore.
    opzioni:
      - testo: "Fargli capire che le chiavi ti servono"
        descrizione: "Il cancello l'ha chiuso lui, e il chiavistello si apre con una di quelle chiavi."
        prova: { attributo: sociale, abilita: [intimidire, persuasione], difficolta: Media }
        successo:
          titolo: Il mazzo di chiavi
          testo: |
            Gli prendi il polso, quello con le chiavi, e lo tieni fermo finché lui capisce. Il polso è molle e
            bagnato, e sotto le dita gli senti il battito di corsa. Dossena apre la mano. Ti indica la chiave
            del cancello grande, con la voce che gli trema, poi sale in carrozza, e il cocchiere frusta i
            cavalli verso il bivio.
          pe: { intimidire: 3 }
          effetti: { avventura.torchio: 1, avv-torchio.chiavi: 1 }
        fallimento:
          titolo: La ruota nel fango
          testo: |
            Gli parli, e lui ti guarda come si guarda un creditore, poi si infila le chiavi nel panciotto
            bagnato e sale in carrozza con il bozzo del mazzo sotto la stoffa. Il cocchiere frusta i cavalli
            verso il bivio, e la ruota ti schizza di fango davanti a tutta l'osteria.
          effetti: { avventura.torchio: 1, scandalo: 0.5 }
      - testo: "Ripetergli davanti a tutti che cosa ha risparmiato"
        descrizione: "Il parafulmine e le leve d'arresto. Il notaio di Gemma Siroli quelle parole le ha scritte."
        quando: [avv-torchio.contratto >= 1]
        esito:
          titolo: Il parafulmine risparmiato
          testo: |
            Davanti all'osteria gli ripeti parola per parola quello che ti ha detto lui del parafulmine e
            delle leve d'arresto, e aggiungi che il notaio di Gemma Siroli l'ha scritto. Dossena diventa
            grigio, e gli anelli gli si fermano fra le dita. Ti mette in mano il mazzo di chiavi senza che tu
            lo chieda e si chiude in carrozza con le tendine tirate.
          effetti: { avventura.torchio: 1, avv-torchio.chiavi: 1 }
      - testo: "Lasciarlo andare e tornare al torchio"
        descrizione: "Un uomo che scappa non serve a niente. Le grida, invece, vengono dal meleto."
        esito:
          titolo: Le chiavi in carrozza
          testo: |
            La carrozza parte verso il bivio, e le chiavi partono con lei. Torni verso il rio basso a piedi,
            con l'osteria che ti segue a distanza e il battito del torchio che si fa più forte a ogni passo,
            finché lo senti salire dal fango negli stivali.
          effetti: { avventura.torchio: 1 }
      - testo: "Ricordargli le proroghe della Casa dei Nodi"
        descrizione: "Il suo nome sta in fondo ai registri dei prestiti. Chi gli ha prestato il denaro, lo sai."
        quando: [origine.mercante-dei-ponti >= 1]
        esito:
          titolo: Le proroghe
          testo: |
            Gli dici a voce bassa il nome di chi gli ha prestato il denaro per il torchio, e quante volte gli
            ha già concesso una proroga. Dossena si guarda intorno per vedere chi ha sentito e si asciuga la
            fronte con il dorso della mano, anche se è già bagnato di pioggia. Ti dà le chiavi perché tu stia
            zitt{o|a}, e sale in carrozza senza salutare.
          pe: { politica-ed-economia: 3 }
          effetti: { avventura.torchio: 1, avv-torchio.chiavi: 1 }

  # ------------------------------------------------------------ 3 → 4 · il meccanico
  - id: avv-torchio-il-meccanico
    presso: laresh
    immagine: icone/spanner
    titolo: Il meccanico nella gora
    sommario: "Al tramonto mezzo villaggio aspetta davanti al cancello del torchio. Dalla grata della gora esce Lapo Calandri, con una mano nera di bruciature."
    luogo: Laresh, il muro del Torchio Dossena, al tramonto
    area: superficie-fratturata
    requisiti: [avventura.torchio == 3]
    testo: |
      Al tramonto mezzo villaggio aspetta con forche e lanterne a dieci passi dal muro del torchio. Sopra il
      muro le Rondini corrono sui fili d'ottone, e ogni volta che una passa il filo vibra fino al palo con una
      nota sottile. Dal meleto arriva ogni tanto la voce di Rufo Pandolfi che chiede aiuto. Il rio basso corre
      torbido e caldo, e l'acqua sa di mele cotte fin dall'argine.

      Tano ti porta fino alla grata della gora. È di ferro vecchio, e fra le sbarre e il fondo resta lo spazio
      di un uomo sdraiato. Sull'argine c'è Lapo Calandri, appena strisciato fuori dalle sbarre, con una mano
      nera di bruciature fino al polso. Cerca di rialzarsi per tornare dentro.

      La Dama arriva con il libro sotto il braccio e guarda l'acqua. «A conti fatti, se il torchio va avanti
      fino a domani il rio basso non lo beve più nemmeno una capra» dice.

      {medicina Media} Bruciature così vengono da un cristallo tenuto in mano troppo a lungo. La pelle è cotta
      a chiazze sul palmo e sui polpastrelli, dove la presa era più stretta, e Lapo ha provato a strapparne
      uno dalla tavola.

      {origine figlio-della-citta-bassa} Lapo ha la cadenza dei vicoli sotto l'Orlo, quella che si perde solo
      a vivere altrove.
    opzioni:
      - testo: "Fermarlo prima che torni nella gora"
        descrizione: "Non si regge in piedi, e vuole tornare dai suoi automi."
        prova: { attributo: fisico, abilita: [rissa, atletica], difficolta: Media }
        successo:
          titolo: Sull'argine
          testo: |
            Lo prendi per la cintura quando ha già un piede nell'acqua e lo rimetti a sedere sull'argine. Lapo
            prova a divincolarsi due volte prima di arrendersi. Resta lì a tossire acqua del rio che sa di
            mele, con la mano bruciata tenuta in alto e lontana dall'erba.
          pe: { rissa: 3 }
          segue: avv-torchio-quello-che-sa-lapo
        fallimento:
          titolo: Tutti e due nella gora
          testo: |
            Lo afferri per la cintura mentre si divincola, e finite insieme nella gora calda e dolciastra.
            Sott'acqua la ruota del mulino gira a pochi passi, e il battito del torchio ti arriva dal fondo
            fin dentro le costole. Ne uscite aggrappati alla stessa sbarra, con la mezza Laresh dell'argine
            che vi tira fuori per le braccia.
          effetti: { scandalo: 0.5 }
          segue: avv-torchio-quello-che-sa-lapo
      - testo: "Medicargli la mano"
        descrizione: "Una mano bruciata così, se nessuno la fascia, domani non si chiude più."
        prova: { attributo: mentale, abilita: medicina, difficolta: Media }
        successo:
          titolo: La tela bagnata
          testo: |
            Gli fai stendere la mano sull'erba e la avvolgi in strisce di tela bagnate nell'acqua del pozzo.
            La tela si scalda subito dove tocca il palmo, e la cambi due volte prima che lui smetta di
            tremare. Ti dice grazie due volte, la seconda guardando il muro del torchio.
          pe: { medicina: 3 }
          segue: avv-torchio-quello-che-sa-lapo
        fallimento:
          titolo: Il grido
          testo: |
            Gli prendi la mano bruciata per vedere fin dove arriva la ferita, e Lapo urla tanto forte che sul
            muro una Rondine si ferma di colpo sul filo. Resta immobile con le lame aperte finché non hai
            finito. Gliela fasci lo stesso, male, mentre lui stringe i denti.
          effetti: { tormento: 0.5 }
          segue: avv-torchio-quello-che-sa-lapo
      - testo: "Parlargli come a uno che esce da un turno andato male"
        descrizione: "Sulle piattaforme si sa che cosa dire a chi torna su senza la sua squadra."
        quando: [origine.apprendista-raschiatore >= 1]
        esito:
          titolo: Dopo il turno
          testo: |
            Ti siedi accanto a lui sull'argine e gli dici quello che si dice sulle piattaforme a chi risale da
            solo, che la corda l'ha tirata bene e che adesso tocca a un altro. Lapo ti guarda come se ti
            conoscesse da anni, e smette di cercare di alzarsi. Dietro di voi il torchio continua a battere, e
            lui non si volta più a guardarlo.
          pe: { empatia: 3 }
          segue: avv-torchio-quello-che-sa-lapo

  - id: avv-torchio-quello-che-sa-lapo
    presso: laresh
    immagine: icone/circuitry
    titolo: Quello che sa Lapo
    tipo: seguito
    luogo: Laresh, l'argine della gora, al tramonto
    area: superficie-fratturata
    requisiti: [avventura.torchio == 3]
    testo: |
      Lapo si siede contro il muro del torchio, e il villaggio gli si stringe intorno con le lanterne. Parla
      piano, rivolto alla mano fasciata. Quando il torchio batte alza gli occhi verso il muro, e poi li
      riabbassa.

      «Il fulmine ha caricato i cristalli del pannello fino all'orlo, e adesso manda Mana ai ragazzi senza
      fermarsi. Leve d'arresto non ce ne sono, e il mago che li scaricava non è venuto.» Guarda il camino di
      rame, che sputa nel cielo scuro il suo fumo azzurro. «Il pannello va rotto. Sta sul muro in fondo al
      reparto, e davanti passa la rotaia del Mulo, che adesso corre.»

      Ti dice delle Rondini nei cortili e degli Aironi nel meleto, dove gli ospiti sono ancora sul melo
      grande. Li conta sulle dita della mano sana. Nel reparto le caldaie sfiatano e il mosto è uscito dalle
      vasche.

      «Ti do quello che ho» dice, e si fruga nelle tasche con la mano sana.

      {tecnologia Difficile} Dodici cristalli carichi su una tavola d'ottone senza terra, e il calore che
      accumulano non ha dove scaricarsi. Se il torchio va avanti un altro giorno la tavola si fonde, e il
      reparto con lei.
    opzioni:
      - testo: "Prendere la chiave a T"
        descrizione: "Con la chiave si apre lo sportello sul dorso di un automa, e dietro lo sportello c'è il cristallo che lo muove."
        quando: [avv-torchio.sportelli == 0]
        esito:
          titolo: La chiave a T
          testo: |
            Lapo si sfila dalla cintura la chiave a T e te la mette in mano. È di ferro nero, e il manico è
            consumato fino al lucido nel punto dove la tiene lui. «La vite a farfalla gira a sinistra, sempre»
            dice, «e quando li prendi da dietro loro dormono.»
          effetti: { avventura.torchio: 1, avv-torchio.sportelli: 1 }
      - testo: "Farti disegnare il reparto"
        descrizione: "Chi l'ha montato sa dove passano i cavi, e dove sono più deboli."
        quando: [avv-torchio.pannello == 0]
        esito:
          titolo: La croce nel fango
          testo: |
            Lapo traccia il reparto nel fango dell'argine con un dito, la rotaia del Mulo che fa il giro della
            sala e il muro del pannello in fondo. Le misure te le dà in passi, e quando le ripete non ne
            cambia una. Segna con una croce il punto dove i cavi entrano nella tavola d'ottone. «Lì sotto c'è
            la giunzione» dice, «e con un colpo ben dato la tavola si spegne.»
          effetti: { avventura.torchio: 1, avv-torchio.pannello: 1 }
      - testo: "Farti dire delle caldaie"
        descrizione: "Nel reparto il vapore esce da ogni giuntura. Chi le ha montate sa dove si chiudono."
        esito:
          titolo: Un quarto di giro
          testo: |
            Lapo ti racconta il reparto caldaia per caldaia, e di ognuna sa dire che fischio fa quando è
            troppo carica. Dietro un pannello di legno della terza c'è la valvola grande, quella che il signor
            Dossena voleva togliere perché rallentava gli alambicchi. «Un quarto di giro e smettono di
            fischiare» dice, «mezzo giro e ti cuoci.»
          effetti: { avventura.torchio: 1, avv-torchio.valvola: 1 }

  # ------------------------------------------------------------ 4 · l'ingresso della spedizione
  - id: avv-torchio-il-cancello
    presso: laresh
    immagine: ambientazione/mulino-malgrani
    titolo: Il cancello del torchio
    sommario: "Il cancello del Torchio Dossena è chiuso con il chiavistello. Dentro, il torchio batte a colpi doppi."
    luogo: Laresh, il cancello del Torchio Dossena
    area: superficie-fratturata
    requisiti: [avventura.torchio == 4]
    testo: |
      Il cancello del Torchio Dossena è chiuso con il chiavistello. Il catenaccio è nuovo e lucido d'olio su
      sbarre di ferro vecchio. Fra le sbarre si vede il primo cortile con i bicchierini verdi del brindisi sui
      tavoli rovesciati. In qualcuno è rimasto un dito d'acquavite, e una vespa ci gira intorno senza posarsi.
      Sopra il cortile le Rondini corrono sui fili d'ottone, e i loro passaggi tornano regolari come i colpi
      di un pendolo. Il torchio batte, e dal camino di rame esce un fumo azzurro.

      Il villaggio aspetta a distanza con le lanterne, e nessuno fa un passo più avanti degli altri. Lapo è
      seduto sull'argine con la mano fasciata.

      {atletica Media} I ghirigori di ferro battuto salgono fino alle punte in cima e reggono un piede, perché
      sono saldati alle sbarre a ogni giro.
    opzioni:
      - testo: "Scavalcare il cancello"
        descrizione: "Fra un passaggio delle Rondini e l'altro c'è il tempo di arrivare in cima. Per scendere, meno."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Media }
        successo:
          titolo: Fra un passaggio e l'altro
          testo: |
            Aspetti che le Rondini passino e sali sui ghirigori, un piede dopo l'altro. Il ferro battuto è
            freddo e ruvido di ruggine sotto le dita. Scavalchi le punte quando i fili sono vuoti e ti lasci
            cadere nel cortile, fra i bicchierini verdi.
          pe: { atletica: 2 }
          vai: avv-torchio
        fallimento:
          titolo: Le punte
          testo: |
            In cima la giubba ti si impiglia nelle punte, e una Rondine ti passa così vicino che senti il
            vento delle lame sull'orecchio. Torni giù dalla parte della strada con un taglio sul collo. Sul
            filo la Rondine non ha rallentato, e al passaggio dopo è già di nuovo sopra il cancello.
          effetti: { ferite: 0.5 }
      - testo: "Aprire con le chiavi di Dossena"
        descrizione: "La chiave grande del mazzo è quella del chiavistello."
        requisiti: [avv-torchio.chiavi >= 1]
        costo: 1
        esito:
          titolo: La chiave grande
          testo: |
            Giri la chiave grande nel chiavistello, che si apre con uno scatto ben oliato. Entri e ti richiudi
            il cancello alle spalle, perché nessuno del villaggio ti venga dietro. Da questa parte delle
            sbarre il battito del torchio ti sale dalla terra nelle suole.
          vai: avv-torchio
      - testo: "Passare dalla gora, come è uscito Lapo"
        descrizione: "Sotto la grata della gora si passa, con l'acqua del mulino fino al mento."
        costo: 2
        esito:
          titolo: Sotto la ruota
          testo: |
            Ti cali nel rio basso e passi sotto la grata della gora con l'acqua tiepida fino al mento, mentre
            la ruota del mulino ti gira accanto più svelta di quanto una ruota dovrebbe. Le pale battono
            l'acqua a un palmo dalla tua spalla e non perdono mai il ritmo. Esci nel primo cortile da un
            tombino, bagnat{o|a} di mosto fino ai capelli.
          effetti: { tormento: 0.5 }
          vai: avv-torchio

  # ------------------------------------------------------------ 5 → 6 · il torchio fermo
  - id: avv-torchio-il-torchio-fermo
    presso: laresh
    immagine: fazioni/gilda-dei-mercanti
    titolo: Il torchio fermo
    sommario: "Il mattino dopo il Torchio Dossena è fermo. Davanti al cancello c'è una carrozza verde con il sigillo della Gilda."
    luogo: Laresh, il Torchio Dossena, il mattino dopo
    area: superficie-fratturata
    requisiti: [avventura.torchio == 5]
    testo: |
      Il mattino dopo il Torchio Dossena è fermo, con le Rondini appese ai fili e gli Aironi immobili fra i
      meli spogli. Dal camino di rame non esce più fumo. Il rio basso corre ancora torbido.

      Davanti al cancello c'è una carrozza della Gilda dei Mercanti. Ottavia Rendina, alta in un mantello
      verde scuro, scrive su una tavoletta mentre Amerigo Dossena firma una carta dopo l'altra sul coperchio
      di una botte. Gli anelli non li ha più, e sulle dita gli sono rimaste le strisce di pelle chiara dove li
      portava. Lapo è seduto sul predellino con la mano fasciata.

      «Conveniamo che il torchio è un buon torchio con un cattivo padrone» dice Ottavia quando arrivi. «La
      Gilda lo compra oggi e lo rimette in moto in primavera. Ci vuole un parafulmine sul camino, e un capo
      officina che sa quello che fa.» Guarda Lapo, che non alza la testa. «E conveniamo che chi l'ha fermato
      ha diritto a dire la sua.»

      La Dama aspetta al bordo della strada con il libro sotto il braccio.

      {politica-ed-economia Media} La Gilda compra al prezzo di un'impresa fallita una cosa che fra un anno
      renderà quanto tre mulini, e Dossena firma lo stesso senza rileggere.

      {origine mercante-dei-ponti} Alla Casa dei Nodi Ottavia Rendina la chiamano la vedova delle imprese,
      perché arriva sempre il giorno dopo.
    opzioni:
      - testo: "Chiedere che il torchio paghi il rio basso"
        descrizione: "Il mosto è finito nel rio basso, e il rio basso passa per i campi della Dama."
        esito:
          titolo: Il conto del rio basso
          testo: |
            Dici a Ottavia che il rio basso l'ha sporcato il torchio, e che a pulirlo devono pensarci i
            padroni del torchio. Ottavia scrive una riga in più sulla tavoletta senza alzare la penna.
            «Conveniamo» dice. La Gilda pagerà la pulizia del rio e comprerà le mele di Laresh al prezzo del
            mercato di Qir-Azel. La Dama apre il libro sul coperchio della botte, accanto alle carte di
            Dossena, e ci scrive il patto con la sua grafia lenta. Prima di chiuderlo aspetta che l'inchiostro
            si asciughi.
          imposta: { avv-torchio.scelta: 1 }
          effetti: { avventura.torchio: 1, rep.laresh: 1 }
      - testo: "Mandare Dossena alla Caserma"
        descrizione: "Ha tirato il chiavistello da fuori con i suoi ospiti dentro. In città, per meno, si finisce in cella."
        esito:
          titolo: Il chiavistello
          testo: |
            Racconti a Ottavia, davanti a tutti, del chiavistello tirato da fuori con gli ospiti dentro.
            Ottavia smette di scrivere, e Dossena comincia a parlare di incidenti della natura passandosi il
            pollice sulle dita senza anelli, finché lei gli toglie la penna di mano. «Conveniamo che la Gilda
            non compra da un uomo che va in Caserma» dice. «Comprerà all'asta, dopo.» La sera stessa salgono
            da Qir-Azel due guardie, e Dossena riparte con loro nella carrozza di un altro.
          imposta: { avv-torchio.scelta: 2 }
          effetti: { avventura.torchio: 1, rep.caserma: 0.5 }
      - testo: "Chiedere una quota del torchio"
        descrizione: "Il torchio l'hai fermato tu. Una parte di quello che renderà in primavera, a rigore, ti spetta."
        esito:
          titolo: La quota
          testo: |
            Chiedi una quota, e Ottavia non fa una piega. Scrive il tuo nome sulla tavoletta con una cifra
            accanto che non ti mostra, e ti fa avere subito una borsa di monete come anticipo. Al bordo della
            strada la Dama chiude il libro con un colpo secco e torna verso Casa Velar senza salutare.
          imposta: { avv-torchio.scelta: 3 }
          effetti: { avventura.torchio: 1, monete: 80, rep.gilda: 0.5, rep.laresh: -0.5 }
      - testo: "Far leggere al notaio le parole di Dossena"
        descrizione: "Il giorno della visita il notaio di Gemma Siroli ha scritto tutto quello che Dossena si vantava di aver risparmiato."
        quando: [avv-torchio.contratto >= 1]
        esito:
          titolo: Il taccuino del notaio
          testo: |
            Fai chiamare il notaio di Gemma Siroli, che legge ad alta voce dal suo taccuino le parole di
            Dossena sul parafulmine e sulle leve d'arresto. Legge piano e con il dito che segue le righe, e
            non salta una parola. Ottavia ascolta fino in fondo. «Conveniamo che questa è una cosa da Caserma»
            dice, e Dossena posa la penna da solo. La sera stessa salgono da Qir-Azel due guardie e lo portano
            via, e la Gilda comprerà il torchio all'asta.
          imposta: { avv-torchio.scelta: 2 }
          effetti: { avventura.torchio: 1, rep.caserma: 0.5 }
      - testo: "Trattare la quota alla maniera della Casa dei Nodi"
        descrizione: "Una quota si chiede con la formula giusta, e con il diritto di guardare i libri."
        quando: [origine.mercante-dei-ponti >= 1]
        esito:
          titolo: Il diritto ai libri
          testo: |
            Chiedi a Ottavia la quota con la formula della Casa dei Nodi, e il diritto di guardare i libri del
            torchio una volta all'anno. Lei alza gli occhi dalla tavoletta per la prima volta e ti fa avere
            una borsa di monete come anticipo. Poi scrive la formula parola per parola, come l'hai detta tu.
            Al bordo della strada la Dama chiude il libro e torna verso Casa Velar senza salutare.
          pe: { politica-ed-economia: 3 }
          imposta: { avv-torchio.scelta: 3 }
          effetti: { avventura.torchio: 1, monete: 80, rep.gilda: 0.5, rep.laresh: -0.5 }

  # ------------------------------------------------------------ 6 → 7 · la corazza del portabotti
  - id: avv-torchio-la-corazza-del-portabotti
    presso: laresh
    immagine: icone/chest-armor
    titolo: La corazza del portabotti
    sommario: "Sul camino del torchio c'è un parafulmine nuovo. Lapo Calandri, capo officina della Gilda, ti aspetta al banco con le piastre del Mulo."
    luogo: Laresh, il Torchio Dossena, l'officina
    area: superficie-fratturata
    requisiti: [avventura.torchio == 6]
    testo: |
      Dieci giorni dopo, sul camino del torchio c'è un'asta di ferro con una corda di rame intrecciato che
      scende fino a terra, e sulla porta del reparto è appesa l'insegna della Gilda. Dentro, Lapo Calandri ha
      un banco accanto alla rotaia del Mulo. Ha una giubba verde che non gli sta bene e la mano ancora
      fasciata.

      Il Mulo è nell'angolo con le tenaglie aperte. Senza le piastre si vede il telaio, di un metallo grigio
      che dieci giorni di fermo non hanno macchiato. Le sue piastre sono sul banco, ribattute su un giaco di
      cuoio e lucidate con la cenere del forno.

      «Il Mulo le botti le portava e basta, senza cattiveria» dice Lapo. «Così almeno porta te.» Passa il
      pollice sul segno di una tenaglia. «Ogni leva d'arresto che chiedevo, la signora Rendina l'ha pagata il
      giorno dopo.»

      {tecnologia Media} I ribattini sono del rame degli Aironi, e il cuoio viene dalla cinghia della ruota
      del mulino. I fori delle piastre sono svasati a mano perché il bordo non seghi il cuoio.
    opzioni:
      - testo: "Indossare la corazza"
        descrizione: "Le piastre di una macchina che alzava botti piene. Lapo te la allaccia."
        esito:
          titolo: Le piastre del Mulo
          testo: |
            Lapo te la allaccia sui fianchi con le dita della mano buona, stringendo le cinghie una dopo
            l'altra, e poi fa un passo indietro a guardare. Le piastre sono tiepide, come se il Mulo non si
            fosse ancora raffreddato del tutto. Restano tiepide anche quando esci nell'aria del cortile.
            «Pesa» dice Lapo, «ma in una settimana non te ne accorgi più.»
          effetti: { avventura.torchio: 1, oggetto.avv-torchio-corazza-del-portabotti: 1 }
      - testo: "Chiedergli che cosa farà dei suoi ragazzi"
        descrizione: "Le Rondini sono ancora sui fili, e gli Aironi in mezzo al meleto."
        esito:
          titolo: In primavera
          testo: |
            Lapo ti porta nel cortile, dove le Rondini sono tornate sui fili, ferme, ognuna con lo sportello
            aperto. Sotto i fili i tavoli del brindisi sono di nuovo in piedi. «In primavera si riparte, con
            calma» dice. «Il mago viene ogni settimana, e le leve le tiro io.» Poi ti mette in mano la corazza
            avvolta in una coperta da cavallo, e torna al banco.
          effetti: { avventura.torchio: 1, oggetto.avv-torchio-corazza-del-portabotti: 1 }
      - testo: "Leggere il biglietto di Gemma Siroli"
        descrizione: "Sul banco, accanto alle piastre, c'è un biglietto con il tuo nome, chiuso con la ceralacca nera."
        quando: [avv-torchio.ospiti >= 1]
        esito:
          titolo: La ceralacca nera
          testo: |
            Gemma Siroli ti ringrazia in poche righe senza svolazzi per averla tirata giù da un melo alla sua
            età, e ti avverte che il suo denaro l'ha messo nell'officina di Lapo. Nella busta c'è una borsa di
            monete per il disturbo. Intanto Lapo ti allaccia la corazza, una cinghia dopo l'altra, e tira ogni
            fibbia fino al buco che ha già segnato con il gesso.
          effetti: { avventura.torchio: 1, oggetto.avv-torchio-corazza-del-portabotti: 1, monete: 40 }
