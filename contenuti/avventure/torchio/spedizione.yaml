# La spedizione dell'Avventura «Il torchio che non si ferma» (avventura.torchio == 4): dentro il Torchio Dossena,
# dal cancello al pannello centrale. Ci si entra da `avv-torchio-il-cancello` (storia.yaml, presso Laresh); la ritirata
# riporta alla Superficie e azzera la profondità.
# Le stanze vanno in fasce di profondità (una stanza superata non ricompare nella stessa visita):
#   0-1 il cortile del brindisi, il secondo cancello;
#   2-3 la ruota del mulino, la rimessa delle Rondini (prove Medie e Difficili, uno scontro con le cesoie volanti);
#   4-6 il meleto: i filari, il carro delle ceste, le arnie, la vasca del lavaggio (prove Difficili, uno scontro
#       con i raccoglitori), e a profondità 5 la svolta non ripetibile, il melo grande con gli ospiti di Dossena
#       (avv-torchio.ospiti, che l'epilogo ricorda);
#   7-9 il reparto: le caldaie, il pavimento di mosto, la galleria delle botti, gli alambicchi (prove Difficili, in
#       ogni stanza una Molto difficile o uno scontro con i tappatori).
# Ogni stanza ha una via senza prova da 2 rintocchi con ½ di Ferite o Tormento (3 rintocchi nel reparto). Chi
# fallisce prende almeno ½ negativa e non scende.
# I vantaggi della storia aprono vie più facili: avv-torchio.sportelli (la rimessa delle Rondini, il carro delle ceste),
# avv-torchio.valvola (le caldaie), avv-torchio.pannello (gli alambicchi e il cuore).
# Il cuore a profondità 10 è il pannello centrale, con il portabotti accelerato (boss): combattimento, o tre vie
# Difficili per rompere il pannello alle sue spalle (una chiede avv-torchio.pannello). Chi vince ferma il torchio e
# porta la pista a 5; chi perde o fallisce torna in Superficie con una negativa e può rientrare.
aree:
  - id: avv-torchio
    immagine: ambientazione/mulino-malgrani
    nome: Il Torchio Dossena
    sommario: "Il vecchio mulino del rio basso, con un reparto di mattoni nuovi, un camino di rame e gli automi che non si fermano più."
    spedizione: { ritorno: superficie-fratturata, soglia: 10, stanze: 3 }
    testo: |
      Il Torchio Dossena è il vecchio mulino del rio basso, con un reparto di mattoni nuovi sul fianco e un
      camino di rame più alto di qualunque tetto di Laresh. I mattoni del reparto hanno ancora gli spigoli
      vivi, mentre le pietre del mulino sono verdi di muschio fino alla ruota. Dentro il muro di cinta ci sono
      i due cortili sotto i fili d'ottone delle Rondini, poi il meleto degli Aironi e in fondo il reparto con
      il torchio e gli alambicchi.

      Da quando è caduto il fulmine niente si ferma, e dal camino esce un fumo azzurro che odora di mele
      cotte. A valle della ruota il rio basso corre torbido e caldo.

colonna:
  - { contesto: area, id: avv-torchio, musica: a-hundred-deaths, ambiente: mines }

storylet:
  # ------------------------------------------------------------ 0-1 · il cortile del brindisi
  - id: avv-torchio-il-cortile-del-brindisi
    immagine: icone/saw-claw
    titolo: Il cortile del brindisi
    sommario: "I tavoli del brindisi sono ancora rovesciati, e sopra il cortile le Rondini corrono sui fili d'ottone."
    luogo: Il Torchio Dossena, il primo cortile
    area: avv-torchio
    ripetibile: true
    requisiti: [avventura.torchio == 4, profondita.avv-torchio <= 1]
    testo: |
      Il primo cortile è come l'hai lasciato, con i tavoli del brindisi rovesciati e i bicchierini verdi
      sparsi sul selciato. Dove il liquore si è versato le pietre sono appiccicose, e le vespe ci camminano
      sopra. Sopra corrono i fili d'ottone, e sui fili le Rondini vanno e vengono da un tetto all'altro
      tagliando i lembi delle tovaglie. A ogni passaggio il filo vibra con una nota acuta che si abbassa
      quando la Rondine si allontana. Dall'altra parte del cortile si apre il passaggio verso il secondo
      cancello.

      {percezione Media} Ogni Rondine fa sempre lo stesso filo, e fra due passaggi c'è il tempo di contare
      fino a sei. Le ruote hanno lucidato l'ottone in un tratto preciso, e il tratto lucido finisce sempre
      nello stesso punto.

      {mezzanotte} In fondo al cortile un tavolo è ancora in piedi, apparecchiato per uno, con un bicchierino
      verde pieno fino all'orlo. Le Rondini ci passano sopra come sugli altri, e la sua tovaglia è l'unica
      senza un taglio. Ogni volta che ti volti a controllare le Rondini e torni a guardarlo, nel bicchierino
      c'è un dito di liquore in meno.
    opzioni:
      - testo: "Attraversare contando i passaggi"
        descrizione: "Fra un passaggio e l'altro c'è il tempo di contare fino a sei. Bisogna partire al numero giusto."
        inquieta: "Fra un passaggio e l'altro c'è il tempo di contare fino a sei. Bisogna partire al numero giusto, e ogni volta che conti senti un'altra voce contare con te, un numero più avanti."
        prova: { attributo: fisico, abilita: [acrobazia, furtivita], difficolta: Media }
        successo:
          titolo: Al cinque
          testo: |
            Conti i passaggi della Rondine più vicina e parti al cinque, piegat{o|a} in due. Arrivi dall'altra
            parte del cortile mentre lei ti passa sopra la nuca e taglia l'aria dove un attimo prima c'era la
            tua testa. Senti lo scatto delle cesoie e un odore di olio caldo.
          pe: { acrobazia: 2 }
          effetti: { profondita.avv-torchio: 1 }
        fallimento:
          titolo: Al tre
          testo: |
            Parti al tre invece che al cinque, e la Rondine ti prende di striscio sulla spalla. La manica si
            apre con un taglio netto e dritto da sarto. Torni a ripararti sotto un tavolo rovesciato, con la
            manica aperta e il conto da rifare.
          effetti: { ferite: 0.5 }
      - testo: "Far saltare una Rondine dal suo filo"
        descrizione: "Le ruote di una Rondine stanno su un filo solo. Un colpo dal basso al momento giusto la fa volare via."
        prova: { attributo: fisico, abilita: [armi-da-mischia, rissa], difficolta: Difficile }
        successo:
          titolo: Il filo vuoto
          testo: |
            Aspetti la Rondine sotto il filo con una gamba di tavolo in mano e la colpisci sulle ruote quando
            ti passa sopra. Salta via dal filo e si schianta sul selciato, dove agita le cesoie a vuoto. Da
            vicino vedi le due ruote scanalate e lo sportello sul dorso chiuso dalla vite a farfalla.
            Attraversi il cortile sotto il suo filo, che adesso è libero.
          pe: { armi-da-mischia: 2 }
          effetti: { profondita.avv-torchio: 1 }
        fallimento:
          titolo: La gamba di tavolo
          testo: |
            Colpisci troppo tardi, e la gamba di tavolo ti resta in mano tagliata a metà. Il legno tagliato è
            caldo e odora di bruciato. La Rondine torna indietro sul filo, e tu ti butti di nuovo sotto i
            tavoli.
          effetti: { ferite: 0.5 }
      - testo: "Ripararti sotto un piano di tavolo"
        descrizione: "Un piano di tavolo sopra la testa regge qualche colpo di cesoie. Si cammina adagio, e le braccia si stancano."
        costo: 2
        esito:
          titolo: Mezzo tavolo
          testo: |
            Ti metti sopra la testa un piano di tavolo e attraversi il cortile a piccoli passi, con le Rondini
            che ci sbattono contro a ogni passaggio. Ogni colpo ti arriva fino ai gomiti, e dal piano piovono
            schegge. Dall'altra parte arrivi con mezzo tavolo sopra la testa e un taglio sul dorso della mano.
          effetti: { profondita.avv-torchio: 1, ferite: 0.5 }

  # ------------------------------------------------------------ 0-1 · il secondo cancello
  - id: avv-torchio-il-secondo-cancello
    immagine: icone/big-gear
    titolo: Il secondo cancello
    sommario: "Fra il primo cortile e quello del torchio c'è un cancello che si apre da solo, e adesso sbatte al ritmo del torchio."
    luogo: Il Torchio Dossena, il secondo cancello
    area: avv-torchio
    ripetibile: true
    requisiti: [avventura.torchio == 4, profondita.avv-torchio <= 1]
    testo: |
      Fra il primo cortile e quello del torchio c'è un secondo cancello di ferro. Lapo l'ha montato perché si
      aprisse da solo agli Aironi carichi di ceste, con un contrappeso appeso a una catena. Il contrappeso è
      un blocco di ghisa, e a ogni salita la catena stride sulla carrucola. Adesso il contrappeso va su e giù
      al ritmo del torchio, e a ogni colpo il cancello si spalanca e sbatte di nuovo. I battenti hanno già
      scavato due solchi chiari nel pilastro.

      {tecnologia Media} La catena passa su una carrucola in cima al pilastro. Un ferro infilato fra catena e
      carrucola quando il cancello è aperto lo tiene aperto, e la gola della carrucola è larga abbastanza per
      farcelo entrare.
    opzioni:
      - testo: "Passare quando si apre"
        descrizione: "Il cancello resta aperto per il tempo di un colpo del torchio. Si passa di corsa, senza esitare."
        prova: { attributo: fisico, abilita: atletica, difficolta: Media }
        successo:
          titolo: Fra due colpi
          testo: |
            Ti metti accanto al pilastro e aspetti il colpo del torchio, che ti sale dal selciato attraverso
            le suole. Il cancello si spalanca, e tu ci passi in mezzo di corsa prima che ti sbatta sui
            talloni.
          pe: { atletica: 2 }
          effetti: { profondita.avv-torchio: 1 }
        fallimento:
          titolo: L'anca
          testo: |
            Parti un colpo in ritardo, e il cancello ti prende di striscio
            sull'anca e ti ributta nel primo cortile, lung{o|a} distes{o|a} sul
            selciato.
          effetti: { ferite: 0.5 }
      - testo: "Bloccare la catena del contrappeso"
        descrizione: "In cima al pilastro c'è la carrucola. Basta un ferro infilato al momento giusto perché il cancello resti aperto."
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Difficile }
        successo:
          titolo: Il ferro nella carrucola
          testo: |
            Sali sul pilastro e infili un ferro del gazebo fra la catena e la carrucola quando il cancello è
            aperto. La catena si tende con un gemito della carrucola, e il ferro comincia a piegarsi nella
            gola. Il cancello resta spalancato abbastanza a lungo da passare senza correre.
          pe: { tecnologia: 2 }
          effetti: { profondita.avv-torchio: 1 }
        fallimento:
          titolo: Le nocche
          testo: |
            Infili il ferro nel momento sbagliato, e la catena te lo strappa di mano e te lo rimanda sulle
            dita. Il ferro rimbalza due volte sul selciato, e il cancello continua a sbattere. Scendi dal
            pilastro succhiandoti le nocche.
          effetti: { ferite: 0.5 }
      - testo: "Arrampicarti sul muro accanto al pilastro"
        descrizione: "Il muro è di mattoni nuovi, e i mattoni nuovi si sbriciolano. Si sale lo stesso, adagio."
        costo: 2
        esito:
          titolo: I mattoni nuovi
          testo: |
            Sali sul muro di fianco al pilastro, aggrappat{o|a} ai mattoni nuovi che si sbriciolano sotto le
            dita, e salti giù dall'altra parte. La malta è ancora chiara e fresca, e te ne resta un po' sotto
            le unghie. Atterri su un ginocchio nel cortile del torchio, e il ginocchio te lo ricorderà fino a
            sera.
          effetti: { profondita.avv-torchio: 1, ferite: 0.5 }

  # ------------------------------------------------------------ 2-3 · la ruota del mulino
  - id: avv-torchio-la-ruota-del-mulino
    immagine: icone/cog
    titolo: La ruota del mulino
    sommario: "La vecchia ruota del mulino gira come in piena, legata al torchio con una cinghia. Per arrivare al meleto si passa accanto."
    luogo: Il Torchio Dossena, la gora
    area: avv-torchio
    ripetibile: true
    requisiti: [avventura.torchio == 4, profondita.avv-torchio >= 2, profondita.avv-torchio <= 3]
    testo: |
      Il cortile del torchio finisce sulla gora, dove gira la ruota del vecchio mulino. Le pale sono di legno
      nero e consumato, e i cerchi di ferro che le tengono sono nuovi e ancora grigi. Lapo l'ha collegata al
      torchio con una cinghia di cuoio, e adesso la ruota gira come in piena e butta acqua sul selciato. La
      cinghia schiocca sulla puleggia a ogni giro, e lo schiocco è più forte quando passa la cucitura. Per
      arrivare al meleto bisogna passare sulla passerella di legno che scavalca la gora a un braccio dalla
      ruota.

      {natura Media} L'acqua della gora è tiepida e dolciastra, e sulle assi della passerella sono rimaste
      attaccate bucce di mele che fanno scivolare il piede. Sulla riva le vespe hanno bevuto tanto che
      camminano invece di volare.
    opzioni:
      - testo: "Passare sulla passerella"
        descrizione: "Le assi sono bagnate e la ruota spruzza. Si passa con le braccia larghe, guardando dove si mettono i piedi."
        prova: { attributo: fisico, abilita: acrobazia, difficolta: Media }
        successo:
          titolo: Fra le bucce
          testo: |
            Attraversi la passerella con le braccia larghe, mettendo i piedi fra le bucce, mentre la ruota ti
            bagna di lato a ogni pala. L'acqua che ti arriva in faccia è tiepida e ti lascia le labbra dolci.
            Dall'altra parte senti l'odore del meleto.
          pe: { acrobazia: 2 }
          effetti: { profondita.avv-torchio: 1 }
        fallimento:
          titolo: Una gamba nella gora
          testo: |
            A metà passerella pesti una buccia e finisci con una gamba nella gora, a una spanna dalla ruota.
            Le pale ti passano così vicine che senti l'acqua spingerti contro il ginocchio. Ti tiri su per la
            ringhiera e torni indietro bagnat{o|a} fino all'anca.
          effetti: { ferite: 0.5 }
      - testo: "Far saltare la cinghia dalla puleggia"
        descrizione: "La cinghia che lega la ruota al torchio è tesa come una corda d'arco. Se salta, la ruota rallenta."
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Difficile }
        successo:
          titolo: La cinghia
          testo: |
            Ti avvicini alla cinghia di fianco e la spingi fuori dalla puleggia con una pertica, nel momento
            in cui passa la cucitura. La cinghia salta e frusta il selciato, e la ruota rallenta fino al passo
            di una ruota qualunque. Sulle pietre la cinghia si contorce ancora un poco e poi resta ferma.
            Attraversi la passerella con gli stivali quasi asciutti.
          pe: { tecnologia: 2 }
          effetti: { profondita.avv-torchio: 1 }
        fallimento:
          titolo: La pertica
          testo: |
            La cinghia ti strappa la pertica di mano e te la rimanda contro le costole. La pertica finisce
            nella gora, e la ruota la spezza al primo giro con uno schiocco secco. Ti siedi sul selciato con
            una mano sul fianco, finché il cortile smette di girare.
          effetti: { ferite: 0.5 }
      - testo: "Risalire la gora a valle della ruota"
        descrizione: "A valle della ruota l'acqua arriva alla vita. È tiepida, ed è più mosto che acqua."
        costo: 2
        esito:
          titolo: Nella gora
          testo: |
            Scendi nella gora a valle della ruota, dove l'acqua è più bassa, e la risali tenendoti al muro con
            l'acqua dolciastra fino alla vita. Sul fondo i piedi affondano in una poltiglia di mele che cede a
            ogni passo. Esci dalla parte del meleto appiccicos{o|a} di mosto fino ai fianchi, con le vespe che
            ti seguono.
          effetti: { profondita.avv-torchio: 1, tormento: 0.5 }

  # ------------------------------------------------------------ 2-3 · la rimessa delle Rondini
  - id: avv-torchio-la-rimessa-delle-gazze
    immagine: icone/energy-tank
    titolo: La rimessa delle Rondini
    sommario: "In fondo al cortile del torchio c'è la rimessa dove le Rondini tornano a ricaricarsi. Per uscire verso il meleto la si attraversa."
    luogo: Il Torchio Dossena, la rimessa delle Rondini
    area: avv-torchio
    ripetibile: true
    requisiti: [avventura.torchio == 4, profondita.avv-torchio >= 2, profondita.avv-torchio <= 3]
    testo: |
      In fondo al cortile del torchio c'è una rimessa di tavole dove finiscono tutti i fili d'ottone. Lì le
      Rondini tornano a ricaricarsi appese in fila a un'asta di rame, come prosciutti in una dispensa, ma
      adesso toccano l'asta con un lampo azzurro e ripartono subito. Appena passi la porta l'aria sa di
      temporale, e i peli delle braccia ti si alzano. La porta sul retro della rimessa è l'unica uscita del
      cortile verso il meleto.

      {magia Media} L'asta di rame è così carica di Mana che chi la tocca ci resta attaccato. Il Mana ci passa
      a scatti, uno per ogni Rondine che la tocca. Se la stacchi dal muro, le Rondini appese si spengono tutte
      insieme.
    opzioni:
      - testo: "Affrontare le Rondini nella rimessa"
        descrizione: "Due Rondini si staccano dall'asta e ti scendono addosso con le cesoie aperte."
        combattimento: avv-torchio-le-cesoie
        vittoria:
          titolo: Le Rondini a terra
          testo: |
            Ne rompi una contro il pavimento della rimessa, e l'altra ti passa sopra la testa e si incastra
            fra le tavole del tetto, dove resta a tagliare il legno. Dal tetto ti cade addosso una segatura
            fine che si attacca al sudore. Esci dalla porta sul retro, verso il meleto.
          effetti: { profondita.avv-torchio: 1 }
        sconfitta:
          titolo: La giubba a strisce
          testo: |
            Le cesoie ti aprono la giubba in più punti prima che tu riesca a tornare nel cortile, dove ti
            butti dietro una botte finché le Rondini non tornano all'asta. Le senti rientrare una alla volta,
            e ogni volta un lampo azzurro passa dalle fessure delle tavole.
          effetti: { tormento: 0.5 }
      - testo: "Aprire lo sportello di una Rondine"
        descrizione: "La vite a farfalla gira a sinistra. Senza il cristallo la Rondine dorme, e quelle dietro restano ferme sul filo."
        requisiti: [avv-torchio.sportelli >= 1]
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Media }
        successo:
          titolo: Il cristallo sfilato
          testo: |
            Afferri una Rondine per il corpo mentre tocca l'asta, giri la vite a farfalla verso sinistra e le
            sfili il cristallo dal dorso. Nel palmo il cristallo è tiepido e ronza ancora per qualche momento.
            La Rondine si affloscia sull'asta, e le altre le si ammucchiano dietro sullo stesso filo,
            bloccate. Passi sotto di loro fino alla porta sul retro.
          pe: { tecnologia: 2 }
          effetti: { profondita.avv-torchio: 1 }
        fallimento:
          titolo: La vite al contrario
          testo: |
            Giri la vite dalla parte sbagliata, e la Rondine ti morde la manica con le cesoie e ti trascina
            contro l'asta. La scossa ti arriva fino ai denti, e in bocca ti resta un sapore di rame.
          effetti: { ferite: 0.5 }
      - testo: "Staccare l'asta di rame dal muro"
        descrizione: "Senza asta, le Rondini appese si spengono. L'asta però è carica, e le mani sono le tue."
        prova: { attributo: mentale, abilita: [magia, tecnologia], difficolta: Difficile }
        successo:
          titolo: L'asta staccata
          testo: |
            Prendi l'asta con due stracci arrotolati intorno alle mani e la tiri via dalle staffe. Le Rondini
            appese si spengono tutte insieme con un ultimo scatto delle cesoie, e restano lì senza un
            movimento. Da fuori arriva il colpo del torchio, e nella rimessa non si muove più niente.
            Attraversi la rimessa fra le lame ferme.
          pe: { magia: 2 }
          effetti: { profondita.avv-torchio: 1 }
        fallimento:
          titolo: I palmi rossi
          testo: |
            Gli stracci non bastano, e cominciano a fumare appena stringi. L'asta ti tiene le mani incollate
            per tre battiti, e quando ti lascia andare hai i palmi rossi e un ronzio in testa che non se ne
            va.
          effetti: { ferite: 0.5 }
      - testo: "Strisciare sotto l'asta, nella segatura"
        descrizione: "Sotto l'asta, a terra, le cesoie arrivano di rado. Di rado non vuol dire mai."
        costo: 2
        esito:
          titolo: La segatura
          testo: |
            Ti butti a terra nella segatura e passi sotto l'asta strisciando, mentre sopra di te le Rondini
            vanno e vengono. Ogni volta che una tocca l'asta la segatura intorno alle tue mani si solleva e
            ricade. Arrivi alla porta sul retro con la segatura in bocca e un taglio sul polpaccio, dove una
            cesoia è scesa troppo.
          effetti: { profondita.avv-torchio: 1, ferite: 0.5 }

  # ------------------------------------------------------------ 4-6 · i filari
  - id: avv-torchio-i-filari-del-meleto
    immagine: icone/fruit-tree
    titolo: I filari del meleto
    sommario: "Fra i filari del meleto camminano gli Aironi su tre gambe sottili, e colgono tutto quello che è tondo e rosso."
    luogo: Il Torchio Dossena, il meleto
    area: avv-torchio
    ripetibile: true
    requisiti: [avventura.torchio == 4, profondita.avv-torchio >= 4, profondita.avv-torchio <= 6]
    testo: |
      Il meleto vecchio del rio basso è fatto di filari lunghi con l'erba alta in mezzo. Fra i filari
      camminano gli Aironi su tre gambe sottili e colgono tutto quello che è tondo e rosso. Finite le mele
      mature strappano le acerbe insieme ai rami, e i meli più vicini al cortile sono già spogli. Sui tronchi
      gli strappi sono bianchi e freschi, e la linfa cola fino all'erba. A terra le mele sono tante che si
      cammina su un tappeto che rotola, e nell'erba alta non si sente un grillo.

      {percezione Difficile} In fondo al filare ogni Airone gira sempre a destra, e per tre passi ha la
      schiena verso il filare. L'erba in fondo ai filari è schiacciata a mezzo cerchio, e sempre dalla stessa
      parte.
    opzioni:
      - testo: "Passare fra i filari alle loro spalle"
        descrizione: "Quando girano in fondo al filare, per tre passi gli Aironi non guardano. Bisogna essere lì in quel momento."
        prova: { attributo: fisico, abilita: furtivita, difficolta: Difficile }
        successo:
          titolo: Tre passi
          testo: |
            Ti muovi da un filare all'altro nei tre passi in cui gli Aironi girano, rannicchiat{o|a} nell'erba
            alta fra un passaggio e l'altro. Una volta un Airone ti passa tanto vicino che senti ticchettare
            le giunture delle sue gambe. Esci dal meleto sul lato del reparto con le ginocchia verdi d'erba.
          pe: { furtivita: 2 }
          effetti: { profondita.avv-torchio: 1 }
        fallimento:
          titolo: Come una mela
          testo: |
            Un Airone gira prima del previsto e ti trova a metà filare. Ti afferra per la cintura e ti alza
            fino all'altezza dei rami. Ti rigira davanti a sé come una mela da guardare, e dentro il suo corpo
            un ingranaggio gira a vuoto finché non ti lascia cadere nell'erba.
          effetti: { ferite: 0.5 }
      - testo: "Tirare le mele lontano per distrarli"
        descrizione: "Gli Aironi colgono quello che è tondo e rosso. Una mela lanciata lontano è una mela da cogliere."
        prova: { attributo: mentale, abilita: [natura, percezione], difficolta: Difficile }
        successo:
          titolo: Le mele in fondo al filare
          testo: |
            Raccogli una bracciata di mele dal tappeto e le tiri una dopo l'altra in fondo al filare di
            sinistra. A ogni tonfo nell'erba gli Aironi si voltano insieme verso il rumore. Ci vanno tutti a
            passi lunghi, e tu attraversi il filare di destra con le tasche piene di mele.
          pe: { natura: 2 }
          effetti: { profondita.avv-torchio: 1 }
        fallimento:
          titolo: La mela al volo
          testo: |
            Tiri la prima mela, e un Airone la coglie al volo e si volta dalla parte da cui è arrivata, cioè
            verso di te. Ti butti nell'erba alta e ci resti immobile. L'Airone guarda il filare con la mela
            fra le dita di rame e la stringe fino a farle colare il succo sul polso, e dopo un pezzo torna ai
            suoi rami.
          effetti: { tormento: 0.5 }
      - testo: "Fare il giro lungo il muro di cinta"
        descrizione: "Lungo il muro gli Aironi non vanno, perché lì non ci sono meli. Ci sono le ortiche."
        costo: 2
        esito:
          titolo: Le ortiche
          testo: |
            Cammini lungo il muro di cinta fino in fondo al meleto, fra ortiche alte fino alla vita e rovi che
            nessuno taglia dai tempi del mugnaio. Dai filari arriva il rumore dei rami strappati, e ti
            accompagna per tutto il tratto. Quando sbuchi dall'altra parte hai le gambe in fiamme.
          effetti: { profondita.avv-torchio: 1, ferite: 0.5 }

  # ------------------------------------------------------------ 4-6 · il carro delle ceste
  - id: avv-torchio-il-carro-delle-ceste
    immagine: icone/robot-grab
    titolo: Il carro delle ceste
    sommario: "Sul viottolo fra il meleto e il reparto c'è un carro rovesciato, e due Aironi lo stanno smontando tavola per tavola."
    luogo: Il Torchio Dossena, il viottolo del reparto
    area: avv-torchio
    ripetibile: true
    requisiti: [avventura.torchio == 4, profondita.avv-torchio >= 4, profondita.avv-torchio <= 6]
    testo: |
      Sul viottolo che dal meleto porta al reparto c'è un carro rovesciato, con le ceste di mele sparse
      intorno. Due Aironi lo smontano tavola per tavola, perché le ruote sono tonde e il legno è dipinto di
      rosso. Lavorano senza fretta e mettono le tavole in un mucchio ordinato, con i chiodi raddrizzati in
      fila sopra. Il viottolo è l'unica strada asciutta verso il reparto, e il carro la chiude tutta.

      {armi-da-mischia Difficile} Alle giunture delle gambe degli Aironi il rame nuovo è saldato al metallo
      vecchio, ed è più tenero. Le saldature sono grosse e fatte in fretta, e intorno hanno ancora i riflessi
      bluastri del calore.
    opzioni:
      - testo: "Affrontare i due Aironi sul carro"
        descrizione: "Alti due uomini, con le dita di rame che stringono come morse. Le giunture delle gambe sono il loro punto tenero."
        combattimento: avv-torchio-i-raccoglitori
        vittoria:
          titolo: Gli Aironi seduti
          testo: |
            Pieghi una gamba al primo Airone sulla giuntura, e quello si siede sul carro come un vecchio sulla
            panca. Il rame nuovo cede sotto il colpo senza spezzarsi. Il secondo lo segue a terra per un colpo
            nello stesso punto. Scavalchi il carro mentre le loro braccia cercano ancora le mele.
          effetti: { profondita.avv-torchio: 1 }
        sconfitta:
          titolo: Da dividere in due
          testo: |
            Un Airone ti prende per il braccio e l'altro per la gamba, e per un momento sei una mela da
            dividere. Ti liberi lasciandogli la manica e ti rifugi sotto il carro, dove le loro dita non
            arrivano. Da lì le senti tastare le tavole sopra di te, una per una.
          effetti: { tormento: 0.5 }
      - testo: "Aprire lo sportello di un Airone"
        descrizione: "Si arriva al dorso da dietro, mentre è chino sul carro. La vite gira a sinistra."
        requisiti: [avv-torchio.sportelli >= 1]
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Media }
        successo:
          titolo: La ruota fra le dita
          testo: |
            Ti avvicini al primo Airone da dietro mentre stacca una ruota, e la vite a farfalla gira a
            sinistra come diceva Lapo. Sfili il cristallo, e dentro la luce azzurra si spegne piano. L'Airone
            si ferma con la ruota fra le dita. L'altro si mette a smontare lui, e tu passi.
          pe: { tecnologia: 2 }
          effetti: { profondita.avv-torchio: 1 }
        fallimento:
          titolo: Lo sportello arrugginito
          testo: |
            La vite gira, e lo sportello resta incastrato dalla ruggine mentre l'Airone si volta. La ruggine
            sta solo sul metallo vecchio, e il rame nuovo intorno è lucido. Ti prende per il collo della
            giubba e ti appende al ramo del melo più vicino, dove resti finché non riesci a sfilarti.
          effetti: { tormento: 0.5 }
      - testo: "Raddrizzare il carro con una stanga"
        descrizione: "Un carro rovesciato si raddrizza con una stanga e tutto il peso del corpo. Chi ci sta sopra cade."
        prova: { attributo: fisico, abilita: atletica, difficolta: Difficile }
        successo:
          titolo: Il carro raddrizzato
          testo: |
            Infili una stanga sotto la sponda del carro e lo raddrizzi di colpo, e i due Aironi rotolano giù
            nell'erba con le ceste. Prima che si rialzino sei già sul viottolo. Quando ti volti stanno già
            tornando al carro, e il primo ha in mano la ruota di prima.
          pe: { atletica: 2 }
          effetti: { profondita.avv-torchio: 1 }
        fallimento:
          titolo: La stanga
          testo: |
            Il carro resta dov'è, e gli Aironi si accorgono della stanga, che per loro è legno da smontare. Te
            la strappano di mano con tutte e due le braccia, e la spalla segue la stanga per un buon tratto
            prima di tornare al suo posto con uno schiocco.
          effetti: { ferite: 0.5 }
      - testo: "Passare per il fosso accanto al viottolo"
        descrizione: "Accanto al viottolo corre un fosso di scolo, pieno di mele marce e di acqua che non si sa da dove venga."
        costo: 2
        esito:
          titolo: Il fosso
          testo: |
            Ti cali nel fosso di scolo, che è pieno d'acqua scura e di mele marce, e lo percorri a quattro
            zampe fino al reparto, con gli Aironi che smontano il carro sopra la tua testa. L'acqua è tiepida
            e sa di mosto andato a male, e le mani affondano nella melma fino ai polsi.
          effetti: { profondita.avv-torchio: 1, tormento: 0.5 }

  # ------------------------------------------------------------ 4-6 · le arnie
  - id: avv-torchio-le-arnie
    immagine: icone/beehive
    titolo: Le arnie
    sommario: "Gli Aironi hanno colto anche le arnie del vecchio mugnaio. L'aria in fondo al meleto è piena di api."
    luogo: Il Torchio Dossena, le arnie in fondo al meleto
    area: avv-torchio
    ripetibile: true
    requisiti: [avventura.torchio == 4, profondita.avv-torchio >= 4, profondita.avv-torchio <= 6]
    testo: |
      In fondo al meleto, sotto una tettoia di paglia, c'erano le arnie del vecchio mugnaio. Gli Aironi le
      hanno colte come ceste piene, e adesso le cassette sono per terra, sfondate. Il miele cola dalle crepe
      nell'erba, e i favi rotti sono neri di api. Fra gli ultimi meli le api ronzano in nuvole basse e si
      posano su tutto quello che si muove. Dall'altra parte delle arnie, a venti passi, c'è la porta
      posteriore del reparto.

      {natura Difficile} Il fumo bianco calma le api, e la paglia bagnata della tettoia ne fa abbastanza.
      Sotto la tettoia c'è ancora il secchio dell'acqua.

      {origine figlio-del-circolo} Al Circolo un vecchio ti ha insegnato ad avvicinarti a uno sciame
      camminando di fianco, con le mani basse.
    opzioni:
      - testo: "Calmarle con il fumo della paglia bagnata"
        descrizione: "Una scintilla nella paglia bagnata, e davanti a te sale un fumo da incensiere."
        prova: { attributo: mentale, abilita: natura, difficolta: Difficile }
        successo:
          titolo: Il fumo bianco
          testo: |
            Bagni una manciata di paglia nel secchio del meleto, la accendi con l'acciarino e la fai fumare
            davanti a te. Il fumo è denso e ti fa lacrimare. Le api si posano sulle cassette sfondate e
            smettono di cercarti, e tu passi fra le arnie a passi lenti fino alla porta del reparto.
          pe: { natura: 2 }
          effetti: { profondita.avv-torchio: 1 }
        fallimento:
          titolo: La paglia che brucia
          testo: |
            La paglia prende fuoco invece di fumare, e le api capiscono benissimo da dove viene la fiamma. Il
            ronzio sale di tono alle tue spalle. Torni indietro di corsa fra i meli, con uno sciame che ti
            insegue fino al viottolo.
          effetti: { ferite: 0.5 }
      - testo: "Attraversare lo sciame di corsa"
        descrizione: "Venti passi sono pochi. Con la giubba sopra la testa, sono pochi lo stesso."
        prova: { attributo: fisico, abilita: resistenza, difficolta: Difficile }
        successo:
          titolo: Le punture
          testo: |
            Ti tiri la giubba sopra la testa e attraversi le arnie di corsa, con le api che ti si aggrappano
            alle mani e al collo. Sotto la giubba senti soltanto il ronzio e il tuo fiato, e i venti passi li
            conti a memoria. Arrivi alla porta del reparto con le mani gonfie e la richiudi alle spalle, e le
            punture le senti soltanto dopo.
          pe: { resistenza: 2 }
          effetti: { profondita.avv-torchio: 1 }
        fallimento:
          titolo: La faccia gonfia
          testo: |
            A metà strada le punture sulle mani diventano troppe, e la giubba ti scivola dalla testa. Una
            puntura ti prende la palpebra, e l'occhio da quella parte si chiude. Torni indietro alla cieca fra
            i meli, con la faccia che si gonfia.
          effetti: { ferite: 1 }
      - testo: "Avvicinarti di fianco, con le mani basse"
        descrizione: "Così ti hanno insegnato al Circolo. Le api lasciano passare chi cammina come un ramo."
        quando: [origine.figlio-del-circolo >= 1]
        esito:
          titolo: Come un ramo
          testo: |
            Cammini di fianco fra le arnie con le mani basse e lente, e le api ti si posano sulle spalle e
            sulle braccia senza pungere. Il loro peso è leggero e tiepido, e lo senti spostarsi a ogni passo.
            Arrivi alla porta del reparto con un mantello d'api che se ne va da solo, una alla volta.
          pe: { natura: 2 }
          effetti: { profondita.avv-torchio: 1 }
      - testo: "Aspettare che lo sciame si posi"
        descrizione: "Prima o poi le api tornano alle cassette. Bisogna stare fermi, e lasciarle fare."
        costo: 2
        esito:
          titolo: L'attesa
          testo: |
            Ti nascondi dietro l'ultimo melo e aspetti immobile, mentre le api ti esplorano le mani e il
            collo. Intanto dal reparto arrivano i colpi del torchio, e a ogni colpo lo sciame si alza di un
            palmo. Ci vuole fino a sera perché si posino sulle cassette, e qualcuna, prima di andare, ti punge
            per scrupolo.
          effetti: { profondita.avv-torchio: 1, ferite: 0.5 }

  # ------------------------------------------------------------ 4-6 · la vasca del lavaggio
  - id: avv-torchio-la-vasca-del-lavaggio
    immagine: icone/droplet-splash
    titolo: La vasca del lavaggio
    sommario: "Le mele si lavano in una vasca lunga quanto una stalla, e un nastro di tela le porta dentro il reparto. Il nastro corre al doppio."
    luogo: Il Torchio Dossena, la vasca del lavaggio
    area: avv-torchio
    ripetibile: true
    requisiti: [avventura.torchio == 4, profondita.avv-torchio >= 4, profondita.avv-torchio <= 6]
    testo: |
      Fra il meleto e il reparto c'è la vasca dove le mele si lavano prima del torchio. È di pietra, e il
      bordo è consumato e liscio dove per anni si sono appoggiate le ceste. Un nastro di tela la attraversa e
      porta le mele dentro il reparto per un'apertura nel muro, l'unico ingresso che non sia sbarrato. Adesso
      il nastro corre al doppio della velocità, e la vasca trabocca di mele che galleggiano. La tela fischia
      sui rulli e fuma appena dove li tocca.

      {tecnologia Difficile} Il rullo d'uscita del nastro ha un freno a ganascia, ma le ganasce sono legate
      aperte con il filo di ferro. Il filo è uno solo e fa tre giri intorno alle ganasce.
    opzioni:
      - testo: "Salire sul nastro e farti portare dentro"
        descrizione: "Il nastro va dove devi andare tu. Bisogna saltarci sopra, e restarci."
        prova: { attributo: fisico, abilita: acrobazia, difficolta: Difficile }
        successo:
          titolo: Fra due ceste
          testo: |
            Salti sul nastro fra due ceste di mele e ti accucci, e il nastro ti porta attraverso la vasca e
            dentro il muro, nel buio caldo del reparto. Nel buio l'odore di mele cotte è così forte che ti si
            attacca alla gola. Ne scendi rotolando un momento prima del torchio.
          pe: { acrobazia: 2 }
          effetti: { profondita.avv-torchio: 1 }
        fallimento:
          titolo: Fra le mele
          testo: |
            Il nastro ti butta giù a metà vasca, e finisci in acqua fra le mele. Sott'acqua le mele ti urtano
            la testa da tutte le parti, e la luce arriva verde e a chiazze. Ne esci fradici{o|a} dal bordo da
            cui eri partit{o|a}, con una mela in tasca che non ricordi di aver preso.
          effetti: { tormento: 0.5 }
      - testo: "Liberare il freno del rullo"
        descrizione: "Un filo di ferro tiene aperte le ganasce. Tagliato quello, il nastro si ferma."
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Difficile }
        successo:
          titolo: Le ganasce
          testo: |
            Tagli il filo di ferro che tiene aperte le ganasce, e le ganasce si chiudono sul rullo con un
            fischio. Il nastro rallenta fino a fermarsi, e le mele sopra rotolano avanti tutte insieme contro
            la cesta davanti. Lo percorri a piedi fino all'apertura nel muro.
          pe: { tecnologia: 2 }
          effetti: { profondita.avv-torchio: 1 }
        fallimento:
          titolo: La mano nelle ganasce
          testo: |
            Tagli il filo, e le ganasce si chiudono sulla tua mano prima che sul rullo. Sono calde di attrito,
            e la mano ci resta presa fino al polso. Ci vuole un pezzo per liberarla, e intanto il nastro
            continua a correre.
          effetti: { ferite: 0.5 }
      - testo: "Passare a nuoto sotto le mele"
        descrizione: "La vasca è profonda quanto un uomo, e sopra galleggia uno strato di mele. Sotto, si nuota."
        costo: 2
        esito:
          titolo: Sotto le mele
          testo: |
            Scendi nella vasca e la attraversi a nuoto sotto lo strato di mele, con le mani avanti per non
            sbattere la testa. Sopra di te le mele chiudono la luce, e l'acqua in bocca è dolce. Esci sotto
            l'apertura del nastro e ti tiri dentro il muro per il bordo, con l'acqua del lavaggio nelle
            orecchie.
          effetti: { profondita.avv-torchio: 1, tormento: 0.5 }

  # ------------------------------------------------------------ 5 · la svolta: il melo grande
  - id: avv-torchio-il-melo-grande
    immagine: icone/tree-growth
    titolo: Il melo grande
    sommario: "In mezzo al meleto, sul melo più vecchio, ci sono ancora gli ospiti di Dossena. Un Airone scuote il tronco."
    luogo: Il Torchio Dossena, il melo grande
    area: avv-torchio
    requisiti: [avventura.torchio == 4, profondita.avv-torchio == 5, avv-torchio.ospiti == 0]
    testo: |
      Il melo più vecchio sta in mezzo al meleto, con un tronco che due persone non abbracciano e la corteccia
      spaccata in placche grigie. Sui suoi rami ci sono gli ospiti di Dossena. Rufo Pandolfi sta a cavalcioni
      del ramo più grosso, senza cappello. Più in alto Gemma Siroli stringe al petto il bastone d'ebano, e il
      suo notaio è aggrappato alla punta di un ramo che si piega.

      Ai piedi dell'albero un Airone ha preso il tronco fra le braccia e lo scuote senza fretta, e un altro
      arriva dal filare accanto sulle sue tre gambe sottili. Le braccia sono di rame nuovo, saldate a un corpo
      di metallo scuro che non ha un graffio, e dove le dita stringono la corteccia è venuta via fino al legno
      chiaro. A ogni scossa il ramo di Rufo scricchiola e una pioggia di mele acerbe batte sull'erba.

      «Era ora!» grida Gemma quando ti vede. «Smettila di piangere, Rufo, che è arrivato qualcuno.»

      {empatia Media} Rufo piange davvero, con la guancia premuta contro la corteccia. Gemma guarda il notaio
      più spesso di quanto guardi te, perché ha paura soprattutto per lui.

      {origine rampollo-dei-quartieri-alti} Ai balli dei Quartieri Alti Gemma Siroli stava sempre seduta
      accanto alla porta, con lo stesso bastone.
    opzioni:
      - testo: "Staccare gli Aironi dall'albero"
        descrizione: "Finché scuotono, nessuno scende. Sono due, e il melo scricchiola."
        combattimento: avv-torchio-i-raccoglitori
        vittoria:
          titolo: Il tronco fermo
          testo: |
            Il primo Airone crolla contro il tronco con le tre gambe piegate sotto il corpo, e il secondo si
            ferma a coglierne i pezzi. Gli ospiti scendono uno alla volta, Gemma per prima, con il bastone
            stretto fra i denti. Li porti fino al muro di cinta dalla parte del rio, dove il villaggio li tira
            su con le corde e i mattoni nuovi si sbriciolano sotto gli stivali di Rufo.
          effetti: { profondita.avv-torchio: 1, avv-torchio.ospiti: 1 }
        sconfitta:
          titolo: Contro il tronco
          testo: |
            I due Aironi ti spingono contro il tronco con le braccia di rame, e contro la schiena senti il
            loro corpo di metallo vecchio, freddo come una pietra di cantina. Sopra di te il ramo del notaio
            si piega fino a sfiorarti i capelli. Torni al riparo dei filari, e gli Aironi tornano all'albero.
          effetti: { tormento: 0.5 }
      - testo: "Farli scendere dalla parte opposta"
        descrizione: "Mentre l'Airone scuote da una parte, si scende dall'altra. Bisogna che scendano quando lo dici tu, e Rufo non vuole."
        prova: { attributo: sociale, abilita: [persuasione, intimidire], difficolta: Difficile }
        successo:
          titolo: Una scossa per uno
          testo: |
            Ti metti dalla parte del tronco dove l'Airone non arriva e dai gli ordini come a una ciurma, un
            ospite per ogni scossa che il tronco ti batte contro la spalla. Il notaio scende per primo, poi
            Gemma, che arriva a terra con il bastone in mano. Rufo lo devi convincere tre volte, e alla terza
            scivola giù lungo il tronco a sedere, con la giubba piena di corteccia. Li porti fino al muro di
            cinta dalla parte del rio, dove il villaggio li tira su con le corde.
          pe: { persuasione: 2 }
          effetti: { profondita.avv-torchio: 1, avv-torchio.ospiti: 1 }
        fallimento:
          titolo: Il bastone sulle dita
          testo: |
            Rufo si rifiuta di muoversi, e Gemma lo prende a colpi di bastone sulle dita finché lui si
            aggrappa ancora più forte. L'Airone sente le grida e si volta verso di te. Il corpo gli gira sopra
            le tre gambe senza che le gambe si spostino, e devi ritirarti fra i filari.
          effetti: { scandalo: 0.5 }
      - testo: "Puntellare il ramo con una scala da raccolta"
        descrizione: "In ogni meleto c'è una scala da raccolta. Si pianta contro il ramo grosso, e si sale mentre il tronco trema."
        prova: { attributo: fisico, abilita: atletica, difficolta: Difficile }
        successo:
          titolo: La scala da raccolta
          testo: |
            Trascini sotto il melo una scala da raccolta, di quelle a un montante solo che si allargano in
            basso, la pianti contro il ramo grosso e ci sali mentre l'Airone scuote. Prendi gli ospiti uno per
            volta e te li porti sulle spalle fino a terra, con i pioli che ti tremano sotto i piedi a ogni
            scossa. Rufo arriva per ultimo, che pesa come due. Li accompagni fino al muro di cinta dalla parte
            del rio, dove il villaggio li tira su con le corde.
          pe: { atletica: 2 }
          effetti: { profondita.avv-torchio: 1, avv-torchio.ospiti: 1 }
        fallimento:
          titolo: La scala che scivola
          testo: |
            Alla prima scossa i piedi della scala scivolano sulle mele dell'erba, e tu con lei. Atterri fra le
            radici con la scala addosso e un piolo che ti preme sul petto, e dal ramo più alto Gemma ti
            raccomanda di fare piano.
          effetti: { ferite: 0.5 }
      - testo: "Distrarre gli Aironi con una cesta di mele"
        descrizione: "Una cesta rovesciata nel filare accanto vale più di un albero da scuotere. Poi, però, le mele finiscono."
        costo: 2
        esito:
          titolo: La cesta rovesciata
          testo: |
            Riempi una cesta di mele dal tappeto e la rovesci nel filare accanto, e gli Aironi lasciano il
            tronco per andare a coglierle una per una. Ogni mela la rigirano fra le dita di rame prima di
            passare alla prossima. Gli ospiti scendono di corsa, e li porti fino al muro di cinta, dove il
            villaggio li tira su con le corde. Quando torni indietro le mele sono finite, e un Airone ti
            prende di striscio con le dita di rame.
          effetti: { profondita.avv-torchio: 1, avv-torchio.ospiti: 1, ferite: 0.5 }

  # ------------------------------------------------------------ 7-9 · le caldaie
  - id: avv-torchio-le-caldaie
    immagine: icone/steam
    titolo: Le caldaie
    sommario: "Il reparto comincia con tre caldaie di rame che sfiatano vapore da ogni giuntura."
    luogo: Il Torchio Dossena, la sala delle caldaie
    area: avv-torchio
    ripetibile: true
    requisiti: [avventura.torchio == 4, profondita.avv-torchio >= 7, profondita.avv-torchio <= 9]
    testo: |
      Il reparto comincia con la sala delle caldaie, tre pance di rame alte come un uomo che scaldano l'acqua
      per gli alambicchi. Il rame è nuovo e ribattuto con chiodi dalla testa larga un pollice, e le giunture
      sono state stagnate in fretta. Da lì escono getti di vapore bianco che fischiano da una parete
      all'altra, e il pavimento è coperto di gocce bollenti. I getti si aprono tutti insieme a ogni colpo del
      torchio e tacciono fra un colpo e l'altro, e ti dici che è la pressione che va dietro alla vite. La
      porta per il reparto grande sta in fondo, oltre la terza caldaia.

      {resistenza Difficile} Due passi nel vapore li regge chiunque, mentre al terzo la pelle si gonfia in
      vesciche che ti porti dietro per un mese.
    opzioni:
      - testo: "Correre fra un getto e l'altro"
        descrizione: "I getti vanno e vengono. Si corre piegati, con le maniche sulle mani."
        prova: { attributo: fisico, abilita: [resistenza, acrobazia], difficolta: Difficile }
        successo:
          titolo: La porta in fondo
          testo: |
            Corri piegat{o|a} fra i getti con le maniche tirate sulle mani e il conto dei colpi del torchio in
            testa. Due ti prendono di striscio senza riuscire a fermarti. Sbatti contro la porta in fondo e la
            apri con la spalla, e la maniglia di ferro ti scotta anche attraverso la stoffa.
          pe: { resistenza: 2 }
          effetti: { profondita.avv-torchio: 1 }
        fallimento:
          titolo: Il braccio rosso
          testo: |
            Un getto ti prende in pieno sul braccio, e torni indietro di corsa fino al muro, con la manica che
            fuma e la pelle rossa sotto. Ti appoggi ai mattoni, che sono l'unica cosa fresca della sala.
          effetti: { ferite: 1 }
      - testo: "Chiudere la valvola grande dietro la terza caldaia"
        descrizione: "Un quarto di giro, ha detto Lapo. Mezzo giro e ti cuoci."
        requisiti: [avv-torchio.valvola >= 1]
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Media }
        successo:
          titolo: Un quarto di giro
          testo: |
            Dietro il pannello di legno della terza caldaia c'è la valvola, come diceva Lapo, con il volantino
            fasciato di stracci. Lo giri di un quarto, e il ferro stride nel filetto prima di cedere. I getti
            si abbassano fino a un sibilo, e attraversi la sala in una nebbia tiepida che ti lascia le ciglia
            bagnate.
          pe: { tecnologia: 2 }
          effetti: { profondita.avv-torchio: 1 }
        fallimento:
          titolo: Mezzo giro
          testo: |
            Il volantino scivola fra gli stracci e gira di mezzo giro invece che di un quarto. Il vapore ti
            esplode in faccia da tutte le giunture insieme, con un fischio che copre i colpi del torchio, e lo
            richiudi a tentoni con gli occhi che lacrimano.
          effetti: { ferite: 1 }
      - testo: "Chiudere gli sfoghi delle caldaie uno a uno"
        descrizione: "Ogni caldaia ha il suo rubinetto di sfogo. Bisogna trovarli nel vapore, e chiuderli nell'ordine giusto."
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Molto difficile }
        successo:
          titolo: L'ordine giusto
          testo: |
            Trovi a tentoni il rubinetto di sfogo di ogni caldaia e li chiudi partendo dalla più lontana,
            perché la pressione non ti torni addosso. Le manopole sono d'ottone e così calde che le giri con
            il bordo della giubba. All'ultimo i getti si spengono uno dopo l'altro, e la sala resta piena di
            una nebbia che gocciola.
          pe: { tecnologia: 3 }
          effetti: { profondita.avv-torchio: 1 }
        fallimento:
          titolo: La caldaia accanto
          testo: |
            Chiudi il primo rubinetto, e il vapore che non esce più da lì esce dalla caldaia accanto, tutto
            insieme, a un palmo dalla tua faccia. Ti butti a terra sulle gocce bollenti e strisci indietro
            fino al muro mentre sopra di te il fischio sale di tono.
          effetti: { ferite: 1 }
      - testo: "Passare sotto un sacco bagnato"
        descrizione: "Un sacco di juta bagnato regge il vapore per qualche passo. Le mani restano fuori."
        costo: 3
        esito:
          titolo: Il sacco di juta
          testo: |
            Bagni un sacco di juta nella vasca dell'acqua fredda e te lo tiri sopra la testa, con l'acqua che
            ti cola giù per il collo. Attraversi la sala a passi lunghi, con il vapore che fischia sul sacco,
            e arrivi alla porta con le mani scottate.
          effetti: { profondita.avv-torchio: 1, ferite: 0.5 }

  # ------------------------------------------------------------ 7-9 · il pavimento di mosto
  - id: avv-torchio-il-pavimento-di-mosto
    immagine: icone/barrel
    titolo: Il pavimento di mosto
    sommario: "Nel reparto grande il torchio batte a colpi doppi, e il mosto traboccato dalle vasche ha fatto del pavimento una lastra."
    luogo: Il Torchio Dossena, il reparto grande
    area: avv-torchio
    ripetibile: true
    requisiti: [avventura.torchio == 4, profondita.avv-torchio >= 7, profondita.avv-torchio <= 9]
    testo: |
      Il reparto grande è una sala lunga con il torchio nel mezzo, una vite di legno che scende sulla polpa di
      mele e risale a colpi doppi. La polpa sotto la vite è già spremuta fino a diventare una crosta bruna, e
      la vite continua a scenderci sopra. Le vasche di raccolta sono traboccate, e il mosto ha coperto il
      pavimento con uno strato appiccicoso dove il piede scivola e, se resti ferm{o|a}, si incolla. Ci sono
      rimaste prese le vespe a centinaia, e quelle ancora vive camminano verso i muri senza riuscire ad
      alzarsi. Sopra le vasche passano basse le travi del soffitto.

      {atletica Media} Le travi sono a un salto dal bordo delle vasche, che è largo un palmo, e fra una trave
      e l'altra c'è la distanza di un braccio teso.
    opzioni:
      - testo: "Camminare sul bordo delle vasche"
        descrizione: "Un palmo di legno bagnato, da una vasca all'altra, con il torchio che fa tremare tutto."
        prova: { attributo: fisico, abilita: acrobazia, difficolta: Difficile }
        successo:
          titolo: Sul bordo
          testo: |
            Sali sul bordo della prima vasca e lo percorri a piccoli passi con le braccia larghe, saltando da
            una vasca all'altra dove si toccano. Il legno trema sotto i piedi a ogni colpo del torchio, e
            impari a muoverti fra un colpo e l'altro. Arrivi in fondo alla sala senza aver toccato il
            pavimento.
          pe: { acrobazia: 2 }
          effetti: { profondita.avv-torchio: 1 }
        fallimento:
          titolo: Nella polpa
          testo: |
            Al terzo salto il bordo è bagnato di mosto e il piede va per conto suo. Batti il ginocchio sullo
            spigolo e finisci fino alla vita nella polpa calda della vasca, che ti tiene come il fango di una
            palude. Ne esci dalla parte da cui eri venut{o|a}, con le vespe morte attaccate alla giubba.
          effetti: { ferite: 1 }
      - testo: "Saltare alle travi e passare di sopra"
        descrizione: "Dalle travi il mosto non arriva. Ci si arriva con un salto, e ci si resta con le braccia."
        prova: { attributo: fisico, abilita: atletica, difficolta: Molto difficile }
        successo:
          titolo: A cavalcioni delle travi
          testo: |
            Prendi la rincorsa sul bordo della vasca e salti alla trave, ci resti appes{o|a} per le mani e ti
            tiri su. Attraversi la sala a cavalcioni, una trave dopo l'altra, con il torchio che batte sotto
            di te e ti fa tremare il legno fra le ginocchia. In fondo ti lasci cadere sul pavimento asciutto.
          pe: { atletica: 3 }
          effetti: { profondita.avv-torchio: 1 }
        fallimento:
          titolo: Di schiena
          testo: |
            Prendi la trave con una mano sola e ci resti appes{o|a} un momento, poi la mano scivola sul legno
            unto di vapore. Atterri di schiena nel mosto, e ci resti incollat{o|a} finché non ti strappi via
            lasciando un pezzo di giubba. Dietro di te il mosto si richiude adagio sul segno della tua
            schiena.
          effetti: { ferite: 1 }
      - testo: "Spargere la segatura e passare"
        descrizione: "Accanto alla porta ci sono i sacchi di segatura per le perdite. Un passo di segatura alla volta, il pavimento tiene."
        costo: 3
        esito:
          titolo: La segatura
          testo: |
            Trascini dentro due sacchi di segatura e li spargi sul mosto davanti a te, un passo alla volta,
            finché il pavimento non tiene. La segatura beve il mosto e diventa una pasta scura che si attacca
            agli stivali. Ci metti fino a notte, con il torchio che batte a un braccio dalla tua testa, e
            arrivi in fondo con le mani piene di schegge.
          effetti: { profondita.avv-torchio: 1, ferite: 0.5 }

  # ------------------------------------------------------------ 7-9 · la galleria delle botti
  - id: avv-torchio-la-galleria-delle-botti
    immagine: icone/cellar-barrels
    titolo: La galleria delle botti
    sommario: "Dietro il torchio le botti stanno in fila su due piani. Fra le file lavorano i Picchi, con il mazzuolo al posto della mano."
    luogo: Il Torchio Dossena, la galleria delle botti
    area: avv-torchio
    ripetibile: true
    requisiti: [avventura.torchio == 4, profondita.avv-torchio >= 7, profondita.avv-torchio <= 9]
    testo: |
      Dietro il torchio si apre la galleria delle botti, in fila su due piani. Fra le file lavorano i
      tappatori che Lapo chiama Picchi, automi tozzi con un mazzuolo di legno al posto della mano destra. Il
      mazzuolo è di faggio nuovo, legato con fascette di ferro a un braccio di metallo vecchio che non ha un
      punto di ruggine. Finiti i tappi continuano a battere il mazzuolo nelle doghe, e dalle botti sfondate
      cola il mosto. Battono tutti nello stesso momento, anche quelli che le file di botti nascondono l'uno
      all'altro, e ti dici che li regola lo stesso pannello.

      {furtivita Media} I Picchi si voltano verso i rumori di legno, e a piedi nudi sulle pietre del pavimento
      non ti sentono.
    opzioni:
      - testo: "Affrontare i Picchi"
        descrizione: "Due tappatori bassi e tozzi, che piantano il mazzuolo in tutto quello che ha la forma di un tappo."
        combattimento: avv-torchio-i-tappatori
        vittoria:
          titolo: I mazzuoli fermi
          testo: |
            Spacchi il manico del mazzuolo al primo Picchio, e il moncone continua a battere l'aria con lo
            stesso ritmo. Il secondo lo finisci contro una botte che gli crolla addosso. La galleria resta
            piena di mosto e di tappi sparsi, e tu la attraversi.
          effetti: { profondita.avv-torchio: 1 }
        sconfitta:
          titolo: Fra le doghe
          testo: |
            Il mazzuolo di un Picchio ti prende sul ginocchio, e mentre cadi l'altro ti cerca la testa e
            scheggia la pietra accanto al tuo orecchio. Rotoli sotto la fila delle botti e torni indietro
            strisciando fra le doghe, con il mosto che ti gocciola sulla schiena.
          effetti: { tormento: 0.5 }
      - testo: "Passare scalzo sulle pietre"
        descrizione: "I Picchi sentono il legno. Le pietre del pavimento no, se ci cammini a piedi nudi e lontano dalle doghe."
        prova: { attributo: fisico, abilita: furtivita, difficolta: Difficile }
        successo:
          titolo: Gli stivali al collo
          testo: |
            Ti togli gli stivali, te li leghi al collo e attraversi la galleria sulle pietre, tenendoti
            lontano dalle doghe. I Picchi battono a un braccio da te senza voltarsi, e senti i loro colpi
            salire dalla pietra nelle piante dei piedi.
          pe: { furtivita: 2 }
          effetti: { profondita.avv-torchio: 1 }
        fallimento:
          titolo: Il tappo
          testo: |
            A metà galleria pesti un tappo di legno, e i due Picchi più vicini si voltano insieme con lo
            stesso scatto. Uno ti prende di striscio sul piede nudo con il mazzuolo, e scappi indietro
            zoppicando.
          effetti: { ferite: 1 }
      - testo: "Far rotolare una botte vuota in mezzo a loro"
        descrizione: "Una botte vuota è tutta legno. I Picchi ci si butterebbero sopra."
        prova: { attributo: fisico, abilita: atletica, difficolta: Difficile }
        successo:
          titolo: La botte vuota
          testo: |
            Spingi una botte vuota giù per la galleria, e lei rotola sulle pietre con un rombo cavo. I Picchi
            le si buttano addosso a colpi di mazzuolo da tutte e due le file. Mentre la riducono in doghe,
            passi dall'altra parte.
          pe: { atletica: 2 }
          effetti: { profondita.avv-torchio: 1 }
        fallimento:
          titolo: La botte incastrata
          testo: |
            La botte si incastra a metà galleria contro un cerchio caduto, e i Picchi, finita quella, cercano
            altro legno. Lo trovano nel manico della tua arma, e nelle tue nocche intorno al manico.
          effetti: { ferite: 1 }
      - testo: "Strisciare sopra il secondo piano di botti"
        descrizione: "Fra le botti di sopra e il soffitto c'è lo spazio di un corpo sdraiato. I Picchi battono sotto."
        costo: 3
        esito:
          titolo: Sopra le botti
          testo: |
            Sali sul secondo piano delle botti e lo attraversi sdraiat{o|a} nello spazio che resta sotto il
            soffitto, con le travi a una spanna dal naso. I Picchi battono sotto di te per tutta la strada, e
            ogni colpo ti arriva nelle ossa attraverso il legno.
          effetti: { profondita.avv-torchio: 1, tormento: 0.5 }

  # ------------------------------------------------------------ 7-9 · gli alambicchi
  - id: avv-torchio-gli-alambicchi
    immagine: icone/fizzing-flask
    titolo: Gli alambicchi
    sommario: "Sei alambicchi di rame bollono sopra fornelli che nessuno ha spento, e l'aria brucia di liquore."
    luogo: Il Torchio Dossena, la sala degli alambicchi
    area: avv-torchio
    ripetibile: true
    requisiti: [avventura.torchio == 4, profondita.avv-torchio >= 7, profondita.avv-torchio <= 9]
    testo: |
      In fondo alla galleria c'è la sala degli alambicchi, sei bocce di rame sopra sei fornelli che nessuno ha
      spento. Le bocce bollono troppo, e l'acquavite gocciola dalle serpentine sul pavimento. Il rame delle
      serpentine è annerito in alto e verde più in basso, dove gocciola. I vapori di liquore bruciano gli
      occhi, e una fiammella azzurra salta da una pozza all'altra. Oltre una porta a due battenti, dall'altra
      parte della sala, senti correre il Mulo. I battenti vibrano nei cardini ogni volta che passa, e fra un
      passaggio e l'altro conti meno di quanto ti servirebbe per attraversare la sala.

      {medicina Difficile} Quei vapori, respirati troppo a lungo, ti mettono a dormire in piedi. Il primo
      segno è la lingua che si impasta, e poi vengono le dita che formicolano.
    opzioni:
      - testo: "Spegnere i fornelli uno a uno"
        descrizione: "Ogni fornello ha la sua presa d'aria. Chiuse quelle, le bocce smettono di bollire."
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Difficile }
        successo:
          titolo: Le prese d'aria
          testo: |
            Chiudi le prese d'aria dei fornelli una dopo l'altra con il fazzoletto sulla bocca, e le bocce
            smettono di bollire. Il rame ticchetta mentre si raffredda, e la fiammella azzurra si spegne
            contro la parete. Attraversi la sala fino alla porta a due battenti con gli occhi che bruciano.
          pe: { tecnologia: 2 }
          effetti: { profondita.avv-torchio: 1 }
        fallimento:
          titolo: "Sedut{o|a} contro il muro"
          testo: |
            Al quarto fornello la testa ti gira, e ti ritrovi sedut{o|a} contro il muro da cui eri
            partit{o|a}, senza ricordare di aver fatto la strada all'indietro. Hai la bocca impastata, e la
            fiammella balla nella pozza accanto al tuo stivale.
          effetti: { ferite: 0.5, tormento: 0.5 }
      - testo: "Attraversare la sala senza prendere aria"
        descrizione: "Quaranta passi fra sei alambicchi, con i polmoni pieni fin dalla soglia."
        prova: { attributo: fisico, abilita: resistenza, difficolta: Molto difficile }
        successo:
          titolo: Quaranta passi
          testo: |
            Riempi i polmoni sulla soglia e attraversi la sala a passi lunghi girando intorno alle pozze.
            Conti i passi per non pensare all'aria, e al trentesimo il cuore ti batte nelle orecchie più forte
            del Mulo. Arrivi alla porta a due battenti con la vista che si stringe, e la apri con tutto il
            corpo.
          pe: { resistenza: 3 }
          effetti: { profondita.avv-torchio: 1 }
        fallimento:
          titolo: I vapori
          testo: |
            A metà sala i polmoni cedono, e i vapori dolci di mele ti entrano in testa tutti insieme. Torni
            indietro a tentoni lungo il muro e ti siedi fuori dalla sala, finché il pavimento smette di
            muoversi.
          effetti: { ferite: 0.5, tormento: 0.5 }
      - testo: "Seguire la fossa dei cavi"
        descrizione: "I cavi del pannello passano sotto gli alambicchi, in una fossa coperta da assi. Sai dove."
        requisiti: [avv-torchio.pannello >= 1]
        prova: { attributo: mentale, abilita: percezione, difficolta: Media }
        successo:
          titolo: La fossa dei cavi
          testo: |
            Trovi le assi della fossa dei cavi accanto al terzo fornello, dove ti aspettavi. Sotto c'è un
            cunicolo basso e fresco, con i cavi di rame che ronzano lungo la parete, e lo percorri a quattro
            zampe fin sotto la porta a due battenti. Più ti avvicini e più il ronzio sale, finché lo senti nei
            denti.
          pe: { percezione: 2 }
          effetti: { profondita.avv-torchio: 1 }
        fallimento:
          titolo: Le assi sbagliate
          testo: |
            Sollevi le assi sbagliate, sopra la fossa dello scolo, e l'acquavite calda ti arriva fino ai
            polsi. Le rimetti a posto prima che la fiammella se ne accorga, e torni indietro con le mani che
            bruciano dove la pelle era screpolata.
          effetti: { tormento: 0.5 }
      - testo: "Bagnarti da capo a piedi e passare in fretta"
        descrizione: "Un secchio d'acqua addosso e il fazzoletto sulla bocca. La fiammella, se ti trova, trova {un uomo bagnato|una donna bagnata}."
        costo: 3
        esito:
          titolo: La manica bagnata
          testo: |
            Ti rovesci addosso un secchio d'acqua e passi in fretta lungo il muro, con il fazzoletto sulla
            bocca e i vestiti incollati addosso. Quando la fiammella salta nella pozza accanto a te e ti
            prende la manica, la spegni con la mano nuda, e sul palmo ti resta una bolla bianca.
          effetti: { profondita.avv-torchio: 1, ferite: 0.5 }

  # ------------------------------------------------------------ il cuore · il pannello centrale
  - id: avv-torchio-il-pannello-centrale
    immagine: bestiario/salvaguardia-precursori
    titolo: Il pannello centrale
    sommario: "Nella sala delle botti piene il Mulo corre sulla sua rotaia, e sul muro in fondo il pannello dei cristalli è bianco come la brace."
    luogo: Il Torchio Dossena, la sala del pannello
    area: avv-torchio
    requisiti: [avventura.torchio == 4, profondita.avv-torchio >= 10]
    testo: |
      Oltre la porta a due battenti c'è una stanza alta con le botti piene lungo i muri e una rotaia di ferro
      che ne fa il giro. La rotaia è consumata e lucida dove corrono le ruote, e nelle curve il ferro si è
      piegato verso l'esterno. In fondo al muro ronza il pannello, la tavola d'ottone con i dodici cristalli
      conduttori bianchi come brace sotto la cenere. Intorno alla tavola l'aria è così calda che le doghe
      delle botti più vicine si sono aperte.

      Sulla rotaia corre il Mulo, largo come un carro, con quattro braccia a tenaglia che reggono una botte
      piena. Il corpo è fatto di piastre ribattute, e dove una piastra manca si vede sotto un metallo scuro
      che le scintille non anneriscono. A ogni giro passa davanti al pannello e va più forte, con le piastre
      che fumano e le ruote che sprizzano scintille. Le tenaglie tengono la botte dritta anche nelle curve, e
      dalla botte non cade una goccia.

      Quando ti vede, il Mulo posa la botte.

      {tecnologia Difficile} Il Mulo prende il Mana dal pannello attraverso la rotaia, e se il pannello si
      rompe si ferma. Il Mulo a terra invece lascia il pannello a scaldarsi finché il reparto prende fuoco.

      {origine allievo-di-torvessa} All'Accademia una tavola carica così si scarica da lontano con una pertica
      di legno, e chi la tocca con le mani diventa un esempio a lezione.
    opzioni:
      - testo: "Affrontare il Mulo sulla rotaia"
        descrizione: "Quattro tenaglie che alzano una botte piena, e un corpo di piastre che il fulmine ha reso più svelto. Poi, a Mulo fermo, il pannello."
        combattimento: avv-torchio-il-portabotti
        vittoria:
          titolo: Il Mulo rovesciato
          testo: |
            Colpisci il Mulo sulle ruote finché una salta via dalla rotaia, e la macchina si rovescia di
            traverso con le tenaglie che si aprono e si chiudono sul vuoto. Le passi sopra e spacchi il
            pannello con quello che hai in mano, un cristallo dopo l'altro. Ogni cristallo che si rompe passa
            dal bianco al grigio, e dalla tavola sale un odore di rame bruciato. Nel reparto il torchio batte
            un ultimo colpo, e poi più niente.

            Adesso senti il rio basso, e da fuori il villaggio che grida. Stacchi dalla tavola due cristalli
            bruciati e dal Mulo una piastra ancora calda, e ti avvii verso il cancello.
          effetti: { avventura.torchio: 1, cristalli.cristallo-sterile: 2, parte.involucro-2: 1 }
          vai: superficie-fratturata
        sconfitta:
          titolo: Le tenaglie
          testo: |
            Il Mulo ti prende con due tenaglie e ti porta per un giro intero della sala come una botte, poi ti
            posa contro la porta a due battenti con una cura che fa più paura dei colpi. Per tutto il giro le
            tenaglie ti tengono dritt{o|a} nelle curve e non ti stringono più di quanto stringerebbero una
            doga. Esci dal reparto a carponi e non ti fermi fino al cancello.
          effetti: { tormento: 1 }
          vai: superficie-fratturata
      - testo: "Correre sulla rotaia alle sue spalle"
        descrizione: "Il Mulo fa il giro della sala. Se gli corri dietro nella sua scia, arrivi al pannello un passo prima che ci torni lui."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Difficile }
        successo:
          titolo: Un passo prima
          testo: |
            Aspetti che il Mulo passi davanti al pannello e gli corri dietro sulla rotaia, nella sua scia di
            scintille che ti pungono la faccia. Arrivi al muro un passo prima che ci torni lui e spacchi la
            tavola d'ottone nel mezzo, con un colpo solo. L'ottone si apre con un suono di campana incrinata.
            I cristalli si spengono a file, e il Mulo fa ancora due passi e si ferma con la botte alzata. Nel
            reparto il torchio batte un ultimo colpo, e poi più niente.

            Adesso senti il rio basso, e da fuori il villaggio che grida. Stacchi dalla tavola due cristalli
            bruciati e dal Mulo una piastra ancora calda, e ti avvii verso il cancello.
          pe: { atletica: 5 }
          effetti: { avventura.torchio: 1, cristalli.cristallo-sterile: 2, parte.involucro-2: 1 }
          vai: superficie-fratturata
        fallimento:
          titolo: Contro le botti
          testo: |
            Il Mulo finisce il giro prima di te, più svelto di quanto l'avevi visto andare. Ti prende di
            fianco con una tenaglia e ti scaraventa contro le botti, che ti piovono addosso piene e ti
            inzuppano di mosto. Dalla sala esci trascinandoti fino al cancello.
          effetti: { ferite: 2, tormento: 0.5 }
          vai: superficie-fratturata
      - testo: "Sfilare i cristalli dalla tavola"
        descrizione: "Uno alla volta, dall'alto in basso, fra un passaggio del Mulo e l'altro. Toccati con le mani, bruciano."
        prova: { attributo: mentale, abilita: [tecnologia, magia], difficolta: Difficile }
        successo:
          titolo: Dodici cristalli
          testo: |
            Ti schiacci fra le botti accanto al pannello, e fra un passaggio e l'altro del Mulo sfili i
            cristalli dalle griffe con la punta della lama, dall'alto in basso, perché la carica non ti torni
            addosso. Ogni cristallo esce con un piccolo schiocco e diventa grigio sulla punta della lama. Al
            dodicesimo il Mulo rallenta a metà giro e si ferma, e la botte gli scivola dalle tenaglie e si
            sfascia sul pavimento. Nel reparto il torchio batte un ultimo colpo, e poi più niente.

            Adesso senti il rio basso, e da fuori il villaggio che grida. Ti metti in tasca due cristalli
            bruciati, stacchi dal Mulo una piastra ancora calda e ti avvii verso il cancello.
          pe: { tecnologia: 5 }
          effetti: { avventura.torchio: 1, cristalli.cristallo-sterile: 2, parte.involucro-2: 1 }
          vai: superficie-fratturata
        fallimento:
          titolo: La carica sulla lama
          testo: |
            Al terzo cristallo la carica ti salta sulla lama e dalla lama al braccio, e ti butta a terra sulla
            rotaia. Il ferro sotto la schiena vibra già del Mulo che arriva. Ti tiri via da sotto le ruote
            appena in tempo, ed esci dal reparto con il braccio che non risponde e un ronzio in testa che non
            smette.
          effetti: { ferite: 1.5, tormento: 0.5 }
          vai: superficie-fratturata
      - testo: "Colpire la giunzione sotto la tavola"
        descrizione: "Dove i cavi entrano nella tavola c'è la giunzione. Un colpo solo, ben dato, da lontano, mentre il Mulo è dall'altra parte."
        requisiti: [avv-torchio.pannello >= 1]
        prova: { attributo: fisico, abilita: [armi-da-distanza, armi-da-mischia], difficolta: Difficile }
        successo:
          titolo: La giunzione
          testo: |
            Raccogli il mazzuolo di un Picchio, aspetti che il Mulo sia dall'altra parte della sala e lo
            scagli contro la giunzione, nel punto dove i cavi di rame entrano nell'ottone. La giunzione si
            apre con uno schiocco secco. Il pannello sputa una fiammata azzurra e si spegne tutto insieme, e
            il Mulo si blocca a metà rotaia con la botte sopra la testa. Per un poco senti solo le sue piastre
            che ticchettano raffreddandosi. Nel reparto il torchio batte un ultimo colpo, e poi più niente.

            Adesso senti il rio basso, e da fuori il villaggio che grida. Stacchi dalla tavola due cristalli
            bruciati e dal Mulo una piastra ancora calda, e ti avvii verso il cancello.
          pe: { armi-da-distanza: 5 }
          effetti: { avventura.torchio: 1, cristalli.cristallo-sterile: 2, parte.involucro-2: 1 }
          vai: superficie-fratturata
        fallimento:
          titolo: Una spanna sopra
          testo: |
            Il mazzuolo prende l'ottone una spanna sopra la giunzione e rimbalza con un suono di campana. Il
            Mulo si gira verso il rumore senza rallentare, e prima che tu trovi un'altra cosa da tirare ti è
            addosso. Esci dal reparto a carponi, con le botti che rotolano dietro di te.
          effetti: { ferite: 2, tormento: 0.5 }
          vai: superficie-fratturata
