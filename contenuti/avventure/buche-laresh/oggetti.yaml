# L'oggetto di grado 4 dell'Avventura «Le buche di Laresh», dato dall'epilogo (`avv-buche-laresh-il-solco-del-pero`).
# Una mandibola della regina delle zuccaiole, affilata da Bice Gaddi con la cote delle falci: la base è la spada lunga
# (una mano), e il taglio che rode la terra cotta passa le armature (Penetrante 2). Quando si muove in fretta trilla
# come le zuccaiole sotto i campi (Rumorosa). Punti: 2 dadi + Penetrante 2 + Rapida 1 = 5, su grado 4 più un difetto.
oggetti:
  - id: avv-buche-laresh-roncola-della-regina
    nome: Roncola della regina
    immagine: icone/sickle
    descrizione: "Una mandibola della regina delle zuccaiole, lucida come il guscio di una castagna, che Bice Gaddi ha affilato con la cote delle falci e montato su un manico di frassino. Morde il ferro e la terra cotta come la falce morde il grano. Quando la muovi in fretta trilla piano, con il verso che si sente sotto i campi del rio basso."
    slot: arma
    base: spada-lunga
    grado: 4
    dadi: 2
    proprieta: { penetrante: 2, rapida: 1 }
    difetti: [rumorosa]
