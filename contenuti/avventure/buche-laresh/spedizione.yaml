# Avventura 10, «Le buche di Laresh»: la spedizione nelle gallerie delle zuccaiole (avventura.buche-laresh 5 → 6).
# Si entra dalla buca grande sotto il pero del confine (`avv-buche-laresh-la-buca-del-pero`, presso Laresh), e la bocca
# frana alle spalle di chi scende: la ritirata è una risalita da uno sfiatatoio, e riporta alla Superficie.
# Fasce di profondità (una stanza superata non ricompare nella stessa visita):
#   0-2 (passi 1-3), la saliva: la galleria lucida, il pozzo colato, le spighe trascinate, la pozza grande. Prove Medie
#       e Difficili; la cenere della striscia (avv-buche-laresh.cenere) spegne le pozze in due stanze.
#   3-5 (passi 4-6), le larve che mangiano il ferro: la camera delle larve, la catena del pozzo, la galleria delle uova,
#       le mute. Prove Difficili; la ferraglia di Ercole (avv-buche-laresh.ferraglia) in due stanze; la via senza prova
#       costa due rintocchi, mezza negativa e un rotolo di bende (le larve mangiano le fibbie della bisaccia).
#       La svolta a profondità 4 (il quinto passo, non ripetibile, avv-buche-laresh.svolta): il canto della colonia,
#       con una fila di zuccaiole che scava verso il granaio di Casa Velar.
#   6-9 (passi 7-10), le dispense: il grano, le bestie murate vive, la strettoia delle guardiane, il ferro. Prove
#       Difficili e una Molto difficile o uno scontro per stanza; la via senza prova costa tre rintocchi. Il mazzuolo
#       (avv-buche-laresh.mazzuolo) richiama le guardiane altrove. Nella stessa fascia, non ripetibile, Bice Gaddi
#       murata viva in una dispensa (avv-buche-laresh.bice 1): libera, risale da uno sfiatatoio e ti lascia il verso
#       della cote.
#   10, il cuore: il nido sotto il pero, in due fasi (la regina nel nido con le larve, poi la regina che scava verso
#       il campo). Combattimento o vie Difficili; chi perde o fallisce prende una negativa piena e torna alla Superficie.
aree:
  - id: avv-buche-laresh
    immagine: ambientazione/regno-profondo
    nome: Le gallerie del rio basso
    sommario: "Sotto i due campi in fondo al rio basso le zuccaiole hanno scavato gallerie lucide di saliva, che scendono verso il nido sotto il pero."
    spedizione: { ritorno: superficie-fratturata, soglia: 10, stanze: 3 }
    testo: |
      Le gallerie delle zuccaiole sono larghe quanto un vitello, e ci si cammina piegati con la lanterna
      bassa. Le pareti luccicano di saliva seccata stesa a strati, che tiene su la terra meglio di un muro.
      Dove una zampa l'ha graffiata si contano decine di strati sottili come carta. Dal soffitto pendono gambi
      di grano spezzati, e sotto i piedi scricchiolano i chicchi.

      Ogni tanto più in basso comincia il canto, un trillo lungo che fa vibrare la malta. Lo senti salire
      dalle suole, e sul pavimento i chicchi sobbalzano. Da dove sei sces{o|a} c'è soltanto terra franata.

colonna:
  - { contesto: area, id: avv-buche-laresh, musica: unsettling-paths, ambiente: mines }

storylet:
  # ------------------------------------------------------------ l'ingresso, sotto il pero del confine
  - id: avv-buche-laresh-la-buca-del-pero
    presso: laresh
    immagine: icone/dig-hole
    titolo: La buca del pero
    sommario: "Sotto il pero del confine si apre la buca più larga di tutte. Mezza Laresh è venuta a guardarti scendere."
    luogo: Laresh, il pero del confine
    area: superficie-fratturata
    requisiti: [avventura.buche-laresh == 5]
    testo: |
      Sotto il pero del confine la buca grande scende di sbieco fra le radici, e dal fondo sale un'aria che sa
      di cantina. Le radici che attraversano la bocca sono tranciate di netto, e il taglio è bianco e ancora
      umido. Gisella ha fatto portare la corda del pozzo e le braci per le lanterne, ed Ercole ne tiene il
      capo. Cahir dice che Cenere più vicino di dieci passi non ci viene, e infatti il cane tira il guinzaglio
      all'indietro ogni volta che il vento porta su l'aria della buca.

      {tecnologia Media} La bocca è tenuta insieme dalla saliva seccata come da una malta, stesa a strati
      sottili uno sull'altro. Sotto il primo braccio però la malta finisce, e c'è terra sciolta che sotto il
      peso viene giù.

      «Se frana, scavo» dice Ercole. «Ho scavato pozzi più fondi di questo.» Gisella tiene la corda dietro di
      lui.
    opzioni:
      - testo: "Calarti con la corda del pozzo"
        descrizione: "La buca scende di sbieco, poi a picco. La terra sciolta è sotto la malta, e la malta finisce presto."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Media }
        successo:
          titolo: La bocca che si chiude
          testo: |
            Scendi con la corda fra le mani e i piedi contro la malta, finché tocchi il fondo. Un attimo dopo
            la bocca della buca ti frana alle spalle con un rumore morbido, come un sacco che si siede. La
            voce di Ercole arriva attutita e poi più niente. Sotto le suole la malta è liscia e incavata verso
            il centro, consumata da qualcosa di largo che è passato di qui molte volte. Davanti a te la
            galleria scende.
          pe: { atletica: 2 }
          vai: avv-buche-laresh
        fallimento:
          titolo: Sotto la frana
          testo: |
            A metà discesa la terra sciolta cede tutta insieme e ti porta giù con sé. Arrivi in fondo
            copert{o|a} di terra fino al collo, e ti scavi fuori con le mani, al buio. Mentre scavi senti più
            in basso un trillo lungo che fa vibrare la terra intorno a te, e poi smette. Quando ritrovi la
            lanterna la bocca sopra di te non c'è più.
          effetti: { ferite: 0.5 }
          vai: avv-buche-laresh
      - testo: "Prendere il ramo buono della buca"
        descrizione: "La buca del pero ha due rami. Quello che scende verso il rio è il più vecchio, e la malta lo tiene."
        requisiti: [avv-buche-laresh.galleria >= 1]
        esito:
          titolo: Il ramo verso il rio
          testo: |
            Scivoli nel ramo vecchio, quello che punta verso il rio, e la malta regge sotto di te fino in
            fondo. Qui è scura e spessa, stesa a strati che si contano come gli anelli di un tronco. Alle tue
            spalle la bocca frana lo stesso, ma tu sei già nella galleria grande, asciutt{o|a}, con la
            lanterna accesa e la corda arrotolata in spalla.
          vai: avv-buche-laresh
      - testo: "Puntellare la bocca e scendere piano"
        descrizione: "Con le tavole del fienile di Ercole e una mattinata di lavoro. Nessuno garantisce che le tavole bastino."
        costo: 2
        esito:
          titolo: Le tavole del fienile
          testo: |
            Passi la mattina a puntellare la bocca con Ercole, tavola dopo tavola, mentre Gisella vi passa i
            chiodi e vi dà dei lumaconi. La malta tiene i chiodi meglio del castagno, e la terra sciolta che
            c'è sotto non tiene niente. A mezzogiorno scendi piano, e quando tocchi il fondo le tavole cedono
            lo stesso e la bocca frana. Hai una scheggia sotto l'unghia e la terra nei capelli.
          effetti: { tormento: 0.5 }
          vai: avv-buche-laresh
      - testo: "Ascoltare la buca come un pozzo della Cicatrice"
        descrizione: "In Cicatrice ti hanno insegnato a sentire una galleria prima di entrarci, e a non fidarti della terra che fa polvere."
        quando: [origine.apprendista-raschiatore >= 1]
        esito:
          titolo: La terra che fa polvere
          testo: |
            Butti un sasso nella buca e conti finché tocca il fondo, e poi lo senti rotolare ancora a lungo
            più in basso. Passi la mano sulla malta finché la senti fredda, e dove la terra fa polvere non ti
            appoggi. Scendi lungo la parete fredda, e la bocca ti frana alle spalle quando hai già i piedi sul
            fondo, come avevi previsto.
          pe: { atletica: 2 }
          vai: avv-buche-laresh

  # ------------------------------------------------------------ 0-2 · la galleria lucida
  - id: avv-buche-laresh-la-galleria-lucida
    immagine: icone/acid
    titolo: La galleria lucida
    sommario: "La galleria scende a spirale, con le pareti lucide di saliva. Sul fondo la saliva fresca fa pozze che fumano."
    luogo: Le gallerie del rio basso, la spirale
    area: avv-buche-laresh
    ripetibile: true
    requisiti: [avventura.buche-laresh == 5, profondita.avv-buche-laresh <= 2]
    testo: |
      La galleria scende a spirale larga, e alla luce della lanterna le pareti luccicano come una tazza
      smaltata. Nella malta corrono fasci di solchi paralleli che girano con la spirale, e ogni fascio è più
      largo delle tue due mani aperte. Sul fondo la saliva fresca fa pozze grigie che fumano e sanno d'aceto.
      Fra una pozza e l'altra la malta vecchia forma gradini stretti e inclinati, che nessuno ha tagliato e
      sono colate indurite una sopra l'altra.

      {acrobazia Media} Sui gradini ci sta mezzo piede. La malta è ruvida sul bordo e liscia verso la parete,
      e se tieni il peso sulla punta non scivola.
    opzioni:
      - testo: "Scendere sui gradini di malta"
        descrizione: "Gradini stretti e inclinati, con le pozze in mezzo."
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Media }
        successo:
          titolo: Mezzo piede
          testo: |
            Scendi sulle punte da un gradino all'altro, con la lanterna alta e la mano libera aperta contro la
            parete. Sotto il palmo la malta è tiepida, più di quanto dovrebbe esserlo la terra a questa
            profondità. Le pozze fumano sotto di te senza toccarti, e in fondo alla spirale la galleria torna
            dritta.
          pe: { acrobazia: 2 }
          effetti: { profondita.avv-buche-laresh: 1 }
        fallimento:
          titolo: Lo stivale che fuma
          testo: |
            Un gradino ti si sbriciola sotto il tallone e metti il piede in una pozza fino alla caviglia. Il
            cuoio sfrigola e lo stivale comincia a fumare, con un odore d'aceto che ti sale fino agli occhi.
            Lo togli risalendo la spirale, e la pelle sotto è rossa e lucida come una cipolla sbucciata.
          effetti: { ferite: 0.5 }
      - testo: "Capire quali pozze sono vecchie"
        descrizione: "La saliva vecchia fa la crosta e regge il peso. Quella fresca no, e da lontano si somigliano."
        prova: { attributo: mentale, abilita: [natura, medicina], difficolta: Difficile }
        successo:
          titolo: Le croste
          testo: |
            Le pozze vecchie hanno la superficie opaca, con le grinze come la panna sul latte, e non fumano
            più. Quelle fresche sono lisce e tremano appena quando ci passi accanto. Scendi la spirale
            camminando soltanto sulle croste vecchie, che scricchiolano sotto gli stivali senza rompersi.
          pe: { natura: 3 }
          effetti: { profondita.avv-buche-laresh: 1 }
        fallimento:
          titolo: La crosta giovane
          testo: |
            Scegli una crosta che sembra vecchia, e sotto è fresca. La crosta cede senza rumore e ci affondi
            fino al polpaccio, in una saliva calda che si richiude intorno alla gamba. L'aceto ti morde
            attraverso il cuoio finché non sei di nuovo in cima alla spirale.
          effetti: { ferite: 0.5 }
      - testo: "Spargere la cenere sulle pozze"
        descrizione: "La cenere della striscia spegne la saliva. Basta averne abbastanza."
        requisiti: [avv-buche-laresh.cenere >= 1]
        esito:
          titolo: Il selciato grigio
          testo: |
            Versi la cenere pozza dopo pozza, e la saliva sfrigola e si copre di una schiuma grigia che
            indurisce in pochi momenti. Il fumo cala presto e resta un odore d'aceto bruciato. Scendi la
            spirale sulla schiuma come su un selciato, con gli stivali puliti.
          effetti: { profondita.avv-buche-laresh: 1 }
      - testo: "Passare dritto nelle pozze"
        descrizione: "Gli stivali reggono un poco. Si va svelti, e si spera che bastino."
        costo: 2
        esito:
          titolo: Di corsa
          testo: |
            Scendi la spirale di corsa, mettendo i piedi dove capita, e a ogni pozza gli stivali fumano un po'
            di più. Le suole escono da ogni pozza con un risucchio, e dietro di te la saliva si richiude
            liscia. In fondo strofini gli stivali nella terra asciutta finché smettono di fumare, e le dita
            dei piedi ti bruciano per un pezzo.
          effetti: { profondita.avv-buche-laresh: 1, ferite: 0.5 }

  # ------------------------------------------------------------ 0-2 · il pozzo colato
  - id: avv-buche-laresh-il-pozzo-colato
    immagine: icone/dripping-goo
    titolo: Il pozzo colato
    sommario: "Un pozzo scende dritto per tre altezze d'uomo. Dal bordo cola la saliva in fili lunghi."
    luogo: Le gallerie del rio basso, il pozzo
    area: avv-buche-laresh
    ripetibile: true
    requisiti: [avventura.buche-laresh == 5, profondita.avv-buche-laresh <= 2]
    testo: |
      La galleria finisce sul bordo di un pozzo che scende dritto per tre altezze d'uomo. Le zuccaiole ci
      scendono a testa in giù, e sulle pareti hanno lasciato due file di buchi per le zampe come i pioli di
      una scala storta. I buchi sono larghi quattro dita e fondi quanto una mano. Dall'alto fino in fondo li
      separa sempre la stessa distanza. Dal bordo la saliva cola in fili lunghi che si allungano piano e si
      staccano senza rumore, e sul fondo fa una pozza larga.

      {tecnologia Facile} La malta di saliva secca tiene un chiodo meglio del castagno. È stesa a strati
      sottili, e ogni strato ha fatto presa prima che arrivasse quello sopra.

      Dal fondo il canto arriva più forte, e quando ti sporgi senti la malta del bordo vibrare appena sotto il
      palmo.
    opzioni:
      - testo: "Scendere per i buchi delle zampe"
        descrizione: "Due file di buchi, abbastanza fondi per le dita. I fili di saliva cadono dove vogliono."
        prova: { attributo: fisico, abilita: atletica, difficolta: Difficile }
        successo:
          titolo: I pioli storti
          testo: |
            Scendi con le dita nei buchi e la punta degli stivali in quelli sotto, un piolo alla volta. A metà
            un filo ti cade sul collo e brucia, e tu non molli. In fondo la pozza sa d'aceto e fa le bolle
            piano nel mezzo. Ci giri intorno e trovi la galleria che riparte.
          pe: { atletica: 3 }
          effetti: { profondita.avv-buche-laresh: 1 }
        fallimento:
          titolo: I palmi
          testo: |
            A metà un buco si sbriciola, e scivoli giù per l'ultimo tratto con i palmi aperti contro la
            parete. Dove il buco ha ceduto si vede la terra nera e sciolta che sta dietro la malta. Ti fermi
            sull'orlo della pozza con le mani scorticate, e risali piano, perché di là non sai ancora passare.
          effetti: { ferite: 0.5 }
      - testo: "Piantare il coltello nella malta e calarti"
        descrizione: "Un coltello piantato, una cintura legata, un tratto di discesa. Poi si stacca il coltello e si ricomincia."
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Media }
        successo:
          titolo: La cintura
          testo: |
            Pianti il coltello in un buco, ci leghi la cintura e ti cali per un tratto. Poi lo stacchi e lo
            pianti più in basso, e la malta lo tiene ogni volta come un ceppo. La lama entra con uno scricchio
            secco ed esce pulita, senza un filo di saliva. Arrivi in fondo con la cintura in mano e i calzoni
            tenuti su da un pezzo di spago.
          pe: { tecnologia: 2 }
          effetti: { profondita.avv-buche-laresh: 1 }
        fallimento:
          titolo: La fibbia
          testo: |
            Il coltello tiene, e la fibbia della cintura si apre a metà discesa. Fai l'ultimo tratto
            aggrappat{o|a} alla parete, con la saliva che ti cola fra le dita. Quando alzi la testa la cintura
            è ancora appesa al coltello e dondola sopra di te, e risali per ricominciare da capo.
          effetti: { ferite: 0.5 }
      - testo: "Aspettare che i fili smettano di colare"
        descrizione: "Prima o poi forse rallentano. Intanto si aspetta seduti sull'orlo, al buio."
        costo: 2
        esito:
          titolo: Sotto la giacca
          testo: |
            Al buio senti i fili cadere sul fondo uno ogni tanto, con un tocco molle. Rallentano e basta, e
            dopo un'ora scendi lo stesso, con la testa sotto la giacca e le mani nei buchi. Arrivi in fondo
            con la giacca bucata in tre punti e il canto nelle orecchie, che non ti lascia più.
          effetti: { profondita.avv-buche-laresh: 1, tormento: 0.5 }

  # ------------------------------------------------------------ 0-2 · le spighe trascinate
  - id: avv-buche-laresh-le-spighe-trascinate
    immagine: icone/grain-bundle
    titolo: Le spighe trascinate
    sommario: "Una galleria coperta di paglia pestata, dove passano le zuccaiole con il grano. Una sta arrivando."
    luogo: Le gallerie del rio basso, la strada del grano
    area: avv-buche-laresh
    ripetibile: true
    requisiti: [avventura.buche-laresh == 5, profondita.avv-buche-laresh <= 2]
    testo: |
      Il pavimento è coperto di paglia pestata e di chicchi, la scia del grano rubato ai campi. Le spighe sono
      coricate tutte nello stesso verso, perché le hanno trascinate sempre di qui. Sotto la paglia c'è una
      poltiglia di saliva che si attacca agli stivali e si stacca a fili quando alzi il piede. Da una galleria
      laterale sbuca una zuccaiola che riempie la galleria da una parete all'altra, con una fascina di spighe
      stretta fra le zampe davanti. A dieci passi da te si ferma, e le antenne le scorrono basse sulla paglia
      avanti e indietro.

      {furtivita Media} Ogni venti passi c'è una nicchia dove le zuccaiole posano il carico, e una è alla tua
      sinistra. Ha il fondo liscio e consumato all'altezza delle zampe.

      {natura Difficile} Seguono la paglia come le formiche la loro strada, e fuori dalla scia per loro non
      c'è niente.
    opzioni:
      - testo: "Infilarti nella nicchia e lasciarla passare"
        descrizione: "Una nicchia stretta, alla tua sinistra. La zuccaiola passerà a un palmo."
        prova: { attributo: fisico, abilita: furtivita, difficolta: Media }
        successo:
          titolo: A un palmo
          testo: |
            Ti schiacci nella nicchia con la lanterna sotto la giacca. La zuccaiola passa trascinando le
            spighe, così vicina che la paglia ti striscia sugli stivali, e sparisce in fondo. Al buio la senti
            allontanarsi da un raschio regolare di zampe, e quando non lo senti più prendi la galleria da cui
            è venuta.
          pe: { furtivita: 2 }
          effetti: { profondita.avv-buche-laresh: 1 }
        fallimento:
          titolo: La zampa nella nicchia
          testo: |
            Si ferma proprio davanti alla nicchia e ci infila una zampa, per posare il carico. I denti della
            zampa ti graffiano la coscia attraverso i calzoni prima che tu riesca a sgusciare fuori e a
            scappare dalla parte da cui eri venut{o|a}. Alle tue spalle la senti posare le spighe nella
            nicchia con cura.
          effetti: { ferite: 0.5 }
      - testo: "Uscire dalla scia della paglia"
        descrizione: "Lungo la parete di destra la paglia non c'è. Bisogna anche togliersi la poltiglia dagli stivali."
        prova: { attributo: mentale, abilita: natura, difficolta: Difficile }
        successo:
          titolo: Fuori dalla strada
          testo: |
            Ti raschi gli stivali con il coltello e passi lungo la parete di destra, sulla terra nuda. È
            asciutta e fredda e non ha un'impronta. La zuccaiola ti passa accanto con le antenne basse sulla
            paglia, e per lei sei un sasso come gli altri.
          pe: { natura: 3 }
          effetti: { profondita.avv-buche-laresh: 1 }
        fallimento:
          titolo: La poltiglia
          testo: |
            Esci dalla scia, ma un po' di poltiglia sugli stivali ce l'hai ancora, e la zuccaiola la segue
            fino a te. Le antenne lasciano la paglia e vengono a toccarti la punta dello stivale. Torni
            indietro di corsa, con la paglia che ti vola intorno.
          effetti: { tormento: 0.5 }
      - testo: "Affrontarla in mezzo alla paglia"
        descrizione: "Ha le zampe occupate dal grano. Per poco."
        combattimento: avv-buche-laresh-la-zuccaiola
        vittoria:
          titolo: Il grano per terra
          testo: |
            La zuccaiola molla le spighe e si gira, e la colpisci prima che finisca di girarsi. Il guscio cede
            sotto la lama con un rumore di zucca secca. Quando smette di muoversi scavalchi lei e la fascina,
            e prosegui sulla paglia sparsa.
          pe: { armi-da-mischia: 3 }
          effetti: { profondita.avv-buche-laresh: 1 }
        sconfitta:
          titolo: Le pale
          testo: |
            Le zampe dentate ti rovesciano nella paglia, e la zuccaiola riprende la sua fascina e se ne va
            senza fretta e senza voltarsi. Torni indietro zoppicando, con la poltiglia fin dentro le maniche.
          effetti: { tormento: 0.5 }
      - testo: "Aspettare che passi tutto il grano"
        descrizione: "Dietro la prima ne arrivano altre. Prima o poi la fila finisce."
        costo: 2
        esito:
          titolo: Le fascine
          testo: |
            Resti ferm{o|a} nella nicchia mentre passano le fascine, una zuccaiola dopo l'altra, finché la
            paglia smette di frusciare. Passano tutte alla stessa distanza l'una dall'altra, e il fruscio non
            cambia mai passo. Quando esci hai le gambe addormentate e gli stivali mangiati in punta.
          effetti: { profondita.avv-buche-laresh: 1, tormento: 0.5 }

  # ------------------------------------------------------------ 0-2 · la pozza grande
  - id: avv-buche-laresh-la-pozza-grande
    immagine: icone/acid-blob
    titolo: La pozza grande
    sommario: "Una sala bassa che una pozza di saliva occupa quasi tutta. Sull'altra sponda c'è una lanterna con il fondo mangiato."
    luogo: Le gallerie del rio basso, la pozza grande
    area: avv-buche-laresh
    ripetibile: true
    requisiti: [avventura.buche-laresh == 5, profondita.avv-buche-laresh <= 2]
    testo: |
      La galleria si allarga in una sala bassa occupata quasi tutta da una pozza di saliva grigia. La copre
      una crosta sottile che fa le grinze come il latte bollito, e l'aria sopra sa d'aceto e pizzica gli
      occhi. A metà affiorano le ossa di una lepre, pulite fino all'ultima giuntura delle zampe. Lungo la
      parete corre una cengia di malta larga un palmo. Sull'altra sponda c'è una lanterna da campo rovesciata,
      e il fondo d'ottone è mangiato fino a lasciare un orlo sfrangiato.

      {percezione Media} Al manico è legato un nastro rosso, di quelli che le caposquadra mettono sugli
      attrezzi della squadra. Il nodo è doppio e tirato stretto, il nodo di chi lega gli attrezzi tutte le
      sere.
    opzioni:
      - testo: "Passare sulla cengia"
        descrizione: "Un palmo di malta lungo la parete, e la pozza sotto."
        prova: { attributo: fisico, abilita: acrobazia, difficolta: Difficile }
        successo:
          titolo: Un palmo
          testo: |
            Passi sulla cengia con la schiena contro la parete e i talloni sul vuoto. A ogni passo qualche
            briciola di malta cade sulla crosta e ci resta sopra a fumare. Dall'altra parte raddrizzi la
            lanterna di Bice prima di proseguire, e il nastro rosso te lo leghi al polso.
          pe: { acrobazia: 3 }
          effetti: { profondita.avv-buche-laresh: 1 }
        fallimento:
          titolo: Fino alla vita
          testo: |
            A metà la cengia si spacca sotto i tuoi piedi, e finisci nella pozza fino alla vita. La saliva è
            tiepida e densa e ti si chiude intorno alle gambe senza fare un'onda. Ne esci arrancando dalla
            parte da cui eri entrat{o|a}, con i calzoni che fumano e la pelle che tira.
          effetti: { ferite: 0.5 }
      - testo: "Camminare sulla crosta dove è più spessa"
        descrizione: "Le grinze sono più larghe dove la crosta è vecchia. Bisogna leggerle alla luce della lanterna."
        prova: { attributo: mentale, abilita: [percezione, medicina], difficolta: Media }
        successo:
          titolo: Le grinze larghe
          testo: |
            Tieni la lanterna bassa e segui le grinze più larghe, che fanno una strada storta fino all'altra
            sponda. La crosta cede di un dito a ogni passo e poi regge. Passi accanto alle ossa della lepre, e
            da vicino vedi che la crosta le ha già coperte fino a metà. Dall'altra parte trovi la lanterna di
            Bice, e ti leghi il suo nastro al polso.
          pe: { percezione: 2 }
          effetti: { profondita.avv-buche-laresh: 1 }
        fallimento:
          titolo: Il piede nell'aceto
          testo: |
            Al quarto passo la crosta si apre sotto lo stivale, e ritiri il piede appena in tempo per non
            lasciarci la suola. Dal buco sale un fiato d'aceto caldo, e il cuoio fuma. Torni indietro a
            ritroso, con la crosta che si crepa dietro di te.
          effetti: { ferite: 0.5 }
      - testo: "Gettare la cenere sulla crosta"
        descrizione: "Un sacco di cenere della striscia, buttato a manciate davanti ai piedi."
        requisiti: [avv-buche-laresh.cenere >= 1]
        esito:
          titolo: La strada di cenere
          testo: |
            Butti la cenere a manciate davanti a te, e la crosta sfrigola e si indurisce in una strada grigia.
            Sotto le suole la strada è ancora tiepida e scricchiola a ogni passo. Arrivi all'altra sponda
            senza bagnarti le suole, e raccogli la lanterna di Bice con il suo nastro rosso.
          effetti: { profondita.avv-buche-laresh: 1 }
      - testo: "Fare il giro scavando nella parete"
        descrizione: "La terra della parete è morbida. Con il coltello e con le mani si fa il giro della pozza, in molto tempo."
        costo: 2
        esito:
          titolo: Il giro lungo
          testo: |
            Scavi una nicchia dopo l'altra nella parete, e ci passi appiattit{o|a}, con le unghie piene di
            terra. Dietro la malta la terra è umida e piena di radichette bianche. Ci metti tutto il tempo di
            una mietitura, e arrivi dall'altra parte con le dita spaccate e la lanterna di Bice da
            raccogliere.
          effetti: { profondita.avv-buche-laresh: 1, ferite: 0.5 }

  # ------------------------------------------------------------ 3-5 · la camera delle larve
  - id: avv-buche-laresh-la-camera-delle-larve
    immagine: icone/maggot
    titolo: La camera delle larve
    sommario: "Una camera tiepida piena di larve grosse come maialini. Alzano tutte la testa verso la lama che porti al fianco."
    luogo: Le gallerie del rio basso, la camera delle larve
    area: avv-buche-laresh
    ripetibile: true
    requisiti: [avventura.buche-laresh == 5, profondita.avv-buche-laresh >= 3, profondita.avv-buche-laresh <= 5]
    testo: |
      La camera è tiepida e il pavimento si muove. Sono larve bianche grosse come maialini, con la testa scura
      e la bocca sempre in moto, e la pelle è così sottile che alla lanterna lascia vedere un'ombra scura
      nella pancia. L'aria sa di terra bagnata e di ruggine. Quando entri le più vicine alzano la testa verso
      la lama che porti al fianco, e la tengono puntata lì mentre ti muovi. L'uscita è dall'altra parte,
      dietro di loro.

      {natura Difficile} Sono cieche e sentono il ferro come un cane sente la carne. Per un chiodo si
      arrampicano su una gamba. L'ombra che hanno nella pancia è il ferro che hanno già mangiato.
    opzioni:
      - testo: "Passare in mezzo, piano"
        descrizione: "Un passo alla volta, con la lama alta sopra la testa. Le larve sentono il ferro, e i chiodi degli stivali sono di ferro."
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Difficile }
        successo:
          titolo: La lama alta
          testo: |
            Ti muovi un passo per volta con la lama sopra la testa, e le larve la seguono con il muso senza
            capire dove sia. Intorno a te le teste si alzano tutte insieme e tutte insieme si abbassano.
            Arrivi all'uscita con due larve aggrappate agli stivali, che ti scrolli di dosso nella galleria.
          pe: { furtivita: 3 }
          effetti: { profondita.avv-buche-laresh: 1 }
        fallimento:
          titolo: I chiodi della suola
          testo: |
            Una larva ti si attacca allo stivale e comincia a mangiare i chiodi della suola, e un'altra le
            sale sopra. Senti i chiodi schioccare uno dopo l'altro sotto i loro denti. Torni indietro
            trascinandole, e le stacchi con il coltello una alla volta.
          effetti: { ferite: 0.5 }
      - testo: "Lasciare il ferro in un angolo e passare a mani vuote"
        descrizione: "Tutto il ferro in un mucchio, lontano dall'uscita. Poi si attraversa la camera senza niente."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Difficile }
        successo:
          titolo: A mani vuote
          testo: |
            Posi il ferro nell'angolo più lontano, e le larve ci si ammucchiano sopra. Passi in mezzo alle
            altre, che ti strusciano molli e tiepide sulle caviglie e ti urtano senza alzare la testa. Quando
            torni a riprenderti la lama, sul taglio ci sono i segni dei denti.
          pe: { resilienza: 3 }
          effetti: { profondita.avv-buche-laresh: 1 }
        fallimento:
          titolo: Le gambe
          testo: |
            A metà camera le larve ti salgono sulle gambe per i chiodi degli stivali, e smetti di contare i
            passi. Dall'angolo arriva il rumore dei denti sul ferro. Torni indietro di corsa a riprenderti la
            lama, prima che se la finiscano, e il filo è già smangiato.
          effetti: { tormento: 0.5 }
      - testo: "Buttare la ferraglia di Ercole in fondo alla camera"
        descrizione: "Chiodi storti e ferri di cavallo, tutti in un angolo. Le larve vanno al ferro."
        requisiti: [avv-buche-laresh.ferraglia >= 1]
        esito:
          titolo: Ghiaia masticata
          testo: |
            Rovesci il sacco di Ercole nell'angolo più lontano, e la camera si svuota verso il rumore. Il
            pavimento dove stavano è liscio e lucido e ancora tiepido sotto le suole. Mentre passi, dal
            mucchio di larve arriva un rumore fitto e allegro, come di ghiaia masticata.
          effetti: { profondita.avv-buche-laresh: 1 }
      - testo: "Lasciare che si prendano la bisaccia"
        descrizione: "Le larve mangiano le fibbie, e una bisaccia senza fibbie si apre. Le bende, se ne hai, restano per terra."
        costo: 2
        esito:
          titolo: La bisaccia aperta
          testo: |
            Attraversi la camera e lasci che le larve ti salgano addosso. Pesano poco e sono tiepide, e ti
            risalgono la schiena senza fretta in cerca del metallo. Ti mangiano le fibbie della bisaccia
            finché si apre, e quello che porti per medicarti finisce nella poltiglia del pavimento. Arrivi
            all'uscita con la bisaccia che penzola e la pelle d'oca fino al collo.
          effetti: { profondita.avv-buche-laresh: 1, bende: -1, tormento: 0.5 }

  # ------------------------------------------------------------ 3-5 · la catena del pozzo
  - id: avv-buche-laresh-la-catena-del-pozzo
    immagine: icone/crossed-chains
    titolo: La catena del pozzo
    sommario: "In mezzo alla galleria c'è la catena del pozzo di Ercole, mezza mangiata. Le larve ci stanno sopra a grappoli."
    luogo: Le gallerie del rio basso, la galleria della catena
    area: avv-buche-laresh
    ripetibile: true
    requisiti: [avventura.buche-laresh == 5, profondita.avv-buche-laresh >= 3, profondita.avv-buche-laresh <= 5]
    testo: |
      In mezzo alla galleria è stesa la catena da pozzo di Ercole, dieci braccia di ferro con il secchio
      ancora attaccato. Le larve ci stanno sopra a grappoli e mangiano gli anelli con un rumore fitto di denti
      sul ferro, che riempie la galleria e copre anche i tuoi passi. Dove il grappolo è più fitto gli anelli
      sono già sottili la metà e brillano, perché i denti hanno tolto la ruggine. Il grappolo chiude la
      galleria da una parete all'altra.

      {atletica Difficile} Il capo del secchio è libero, e se tiri la catena il grappolo le viene dietro
      mangiando.
    opzioni:
      - testo: "Tirare la catena e portarti dietro le larve"
        descrizione: "Dieci braccia di catena, con sopra un grappolo di larve che non la vuole mollare. Si tira all'indietro, verso la galleria laterale."
        prova: { attributo: fisico, abilita: atletica, difficolta: Difficile }
        successo:
          titolo: Il grappolo che segue
          testo: |
            Afferri il secchio e tiri all'indietro, un passo alla volta, e il grappolo segue la catena senza
            smettere di mangiare. Gli anelli ti arrivano fra le mani tiepidi e unti di saliva. Quando la
            catena è tutta nella galleria laterale la lasci andare, e torni di corsa per la strada rimasta
            libera.
          pe: { atletica: 3 }
          effetti: { profondita.avv-buche-laresh: 1 }
        fallimento:
          titolo: Gli anelli mangiati
          testo: |
            La catena pesa più di quanto credevi, e il grappolo non si sposta di un palmo. Le larve tengono
            gli anelli stretti con la bocca e si lasciano tirare senza mollarli. Gli anelli mangiati tagliano
            come lame, e ti aprono la pelle delle mani prima che tu molli.
          effetti: { ferite: 0.5 }
      - testo: "Passare sopra il grappolo, appeso al soffitto"
        descrizione: "Il soffitto è basso e la malta ha i buchi delle zampe. Le larve sentono il ferro anche dall'alto."
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Difficile }
        successo:
          titolo: Sopra
          testo: |
            Ti appendi al soffitto con le dita nei buchi della malta e passi sopra il grappolo a forza di
            braccia, con le ginocchia raccolte. La malta lassù è più dura di quella delle pareti, levigata
            dalle zampe. Sotto di te le larve alzano la testa tutte insieme e poi tornano alla catena.
          pe: { acrobazia: 3 }
          effetti: { profondita.avv-buche-laresh: 1 }
        fallimento:
          titolo: In mezzo
          testo: |
            A metà ti cede la presa e cadi in mezzo al grappolo. Le larve ti si attaccano alla fibbia e agli
            stivali, e senti i denti lavorare sul ferro a un dito dalla pelle. Ci vuole un pezzo prima che tu
            riesca a strappartele di dosso e a tornare indietro.
          effetti: { tormento: 0.5 }
      - testo: "Spargere la ferraglia nella galleria da cui sei venut{o|a}"
        descrizione: "Chiodi e ferri di cavallo dietro di te. Le larve li sentono, e la catena è già mezza mangiata."
        requisiti: [avv-buche-laresh.ferraglia >= 1]
        esito:
          titolo: Il ferro nuovo
          testo: |
            Spargi la ferraglia di Ercole a manciate nella galleria alle tue spalle, e il grappolo lascia la
            catena per il ferro nuovo. Lo aspetti appiattit{o|a} in una nicchia mentre il rumore dei denti ti
            passa davanti e si sposta dietro di te. Quando è passato riprendi la strada sopra la catena.
          effetti: { profondita.avv-buche-laresh: 1 }
      - testo: "Lasciare che si prendano la bisaccia"
        descrizione: "Una bisaccia con le fibbie di ferro, buttata in mezzo al grappolo per aprirsi un varco. Le bende che ci tieni andranno perse."
        costo: 2
        esito:
          titolo: Il varco
          testo: |
            Butti la bisaccia in mezzo al grappolo, e le larve ci si avventano sopra per le fibbie. Passi nel
            varco che si apre, e dall'altra parte riprendi la bisaccia masticata, vuota a metà. Intorno alle
            fibbie il cuoio è bucato in tondo, dove i denti l'hanno passato per arrivare al ferro. Le bende,
            se ne avevi, sono rimaste nella poltiglia.
          effetti: { profondita.avv-buche-laresh: 1, bende: -1, tormento: 0.5 }

  # ------------------------------------------------------------ 3-5 · la galleria delle uova
  - id: avv-buche-laresh-la-galleria-delle-uova
    immagine: icone/egg-clutch
    titolo: La galleria delle uova
    sommario: "Nelle pareti ci sono nicchie, e in ogni nicchia un uovo grande come un pugno. Due nutrici le leccano una per una."
    luogo: Le gallerie del rio basso, la galleria delle uova
    area: avv-buche-laresh
    ripetibile: true
    requisiti: [avventura.buche-laresh == 5, profondita.avv-buche-laresh >= 3, profondita.avv-buche-laresh <= 5]
    testo: |
      La galleria corre fra due pareti di nicchie, e in ognuna c'è un uovo bianco grande come un pugno sulla
      paglia masticata. Qui l'aria è più calda e umida che nel resto del nido. Due zuccaiole più piccole e
      chiare delle altre passano da una nicchia all'altra e leccano le uova una per una, senza saltarne
      nessuna. Qualche uovo si muove da solo. Il guscio è molle e opaco, e dove la lanterna lo prende in pieno
      lascia vedere un'ombra raccolta che si gira.

      {medicina Difficile} Le nutrici riconoscono le uova dall'odore, e chi non sa di nido per loro è venuto a
      rubare.

      {origine accolito-del-velo} Le nutrici le leccano con lo stesso gesto con cui al Velo si pulivano i vasi
      dell'altare.
    opzioni:
      - testo: "Passare quando le nutrici sono girate"
        descrizione: "Ogni tanto infilano la testa nelle nicchie della stessa parete. La galleria è stretta, e le uova sporgono."
        prova: { attributo: fisico, abilita: furtivita, difficolta: Difficile }
        successo:
          titolo: Il gomito
          testo: |
            Aspetti che le nutrici infilino la testa in due nicchie della stessa parete e passi radente
            all'altra, con il gomito a un dito dalle uova. Senti il loro calore attraverso la manica. In fondo
            alla galleria ti volti, e loro stanno ancora leccando.
          pe: { furtivita: 3 }
          effetti: { profondita.avv-buche-laresh: 1 }
        fallimento:
          titolo: L'uovo per terra
          testo: |
            Il gomito urta un uovo, che rotola fuori dalla nicchia e si spacca sul pavimento. Dentro c'è una
            larva lunga un dito che si torce nel liquido chiaro. Le nutrici si girano tutte e due con un
            fischio acuto e ti rincorrono fino alla galleria da cui eri entrat{o|a}.
          effetti: { ferite: 0.5 }
      - testo: "Sporcarti con la paglia delle nicchie"
        descrizione: "La paglia masticata sa di nido. Strofinata su mani e collo, forse basta a confondere le nutrici."
        prova: { attributo: mentale, abilita: [natura, medicina], difficolta: Difficile }
        successo:
          titolo: L'odore del nido
          testo: |
            Prendi una manciata di paglia da una nicchia vuota e te la strofini sulle mani e sul collo, e la
            paglia puzza di latte inacidito. Le nutrici ti annusano al passaggio con le antenne che ti toccano
            la faccia. Una ti lecca il dorso della mano con la stessa cura che mette sulle uova, e poi tornano
            tutte e due al loro lavoro.
          pe: { natura: 3 }
          effetti: { profondita.avv-buche-laresh: 1 }
        fallimento:
          titolo: L'uovo marcio
          testo: |
            La paglia che prendi viene da una nicchia dove un uovo è marcito, e le nutrici ti scacciano come
            si scaccia una cosa morta dal nido. Te ne accorgi dal colore grigio della paglia quando ce l'hai
            già sul collo. Torni indietro con la puzza addosso, e non se ne va.
          effetti: { tormento: 0.5 }
      - testo: "Lasciare che la covata si prenda la bisaccia"
        descrizione: "Una fila di uova si sta aprendo. Le larvine appena nate cercano ferro, e la bisaccia ne ha. Le bende che ci tieni andranno perse."
        costo: 2
        esito:
          titolo: La covata
          testo: |
            Mentre passi una fila di uova si schiude, e le larvine ti salgono addosso, piccole come dita, in
            cerca di ferro. Hanno la pelle ancora trasparente e i denti già duri. Ti mangiano le fibbie della
            bisaccia, e le bende, se ne avevi, cadono nelle nicchie. Le nutrici sono troppo occupate con la
            covata per guardarti.
          effetti: { profondita.avv-buche-laresh: 1, bende: -1, tormento: 0.5 }

  # ------------------------------------------------------------ 3-5 · le mute
  - id: avv-buche-laresh-le-mute
    immagine: icone/beetle-shell
    titolo: Le mute
    sommario: "Dal soffitto pendono le pelli vuote delle larve diventate adulte. Una è ancora piena, e si sta aprendo sulla schiena."
    luogo: Le gallerie del rio basso, la galleria delle mute
    area: avv-buche-laresh
    ripetibile: true
    requisiti: [avventura.buche-laresh == 5, profondita.avv-buche-laresh >= 3, profondita.avv-buche-laresh <= 5]
    testo: |
      Dal soffitto pendono le mute delle larve diventate zuccaiole, appese per le zampe come giacche ad
      asciugare. Sono decine in file dritte a una spanna l'una dall'altra, e ognuna ha tenuto la forma esatta
      della bestia fino alle antenne e ai denti delle zampe. Le pelli secche frusciano al passaggio della
      lanterna. A metà galleria ce n'è una ancora piena, e dalla fessura sulla schiena sta uscendo una
      zuccaiola nuova. È molle e bianca con le zampe ripiegate sulla pancia. Il guscio le si scurisce a vista
      d'occhio a partire dalla testa.

      {armi-da-mischia Media} Così molle una lama la passa da parte a parte, ma fra un'ora avrà il guscio duro
      e una fame da muta.
    opzioni:
      - testo: "Colpirla prima che il guscio si indurisca"
        descrizione: "È molle, ma è grande come le altre, e appena nata."
        combattimento: avv-buche-laresh-la-zuccaiola
        vittoria:
          titolo: La muta vuota
          testo: |
            La colpisci mentre ha ancora le zampe ripiegate, e la zuccaiola nuova ricade dentro la sua muta.
            La lama entra senza trovare resistenza e ne esce coperta di un liquido chiaro e tiepido. Passi
            sotto le pelli appese, che frusciano tutte insieme, e prosegui.
          pe: { armi-da-mischia: 3 }
          effetti: { profondita.avv-buche-laresh: 1 }
        sconfitta:
          titolo: La prima fame
          testo: |
            Il guscio le si indurisce mentre combattete, e lo senti cambiare sotto la lama colpo dopo colpo,
            finché il filo scivola via senza entrare. Alla fine la zuccaiola nuova ti caccia indietro a colpi
            di zampa. Torni da dove sei venut{o|a}, con le mute che ti si attaccano ai capelli.
          effetti: { tormento: 0.5 }
      - testo: "Passarle accanto in mezzo alle mute"
        descrizione: "Le pelli appese nascondono chi ci cammina in mezzo, finché frusciano."
        prova: { attributo: fisico, abilita: [acrobazia, furtivita], difficolta: Difficile }
        successo:
          titolo: Fra le giacche
          testo: |
            Passi fra le mute di sbieco, scostandole con il dorso della mano una alla volta come tende. Sono
            leggere e fredde, e dove le tocchi si sbriciolano un poco. La zuccaiola nuova gira la testa molle
            verso il fruscio, e intanto tu sei già oltre.
          pe: { acrobazia: 3 }
          effetti: { profondita.avv-buche-laresh: 1 }
        fallimento:
          titolo: Le mute addosso
          testo: |
            Una fila di mute si stacca dal soffitto e ti cade addosso, e ci resti impigliat{o|a} come in una
            rete. I denti secchi delle zampe ti si agganciano ai vestiti e ai capelli. La zuccaiola nuova si
            libera dalla sua pelle in quel momento, e tu torni indietro strappandoti le mute di dosso.
          effetti: { tormento: 0.5 }
      - testo: "Lasciarle la bisaccia da masticare"
        descrizione: "Una zuccaiola appena nata ha fame di tutto. La bisaccia ha le fibbie, e dentro le bende."
        costo: 2
        esito:
          titolo: La prima cena
          testo: |
            Le getti la bisaccia sotto il muso, e la zuccaiola nuova ci affonda le mandibole ancora molli.
            Sulle fibbie le mandibole si piegano, e lei ci riprova. Passi mentre mastica. Dall'altra parte
            riprendi la bisaccia senza più fibbie, e senza le bende, se ce n'erano.
          effetti: { profondita.avv-buche-laresh: 1, bende: -1, tormento: 0.5 }

  # ------------------------------------------------------------ svolta a profondità 4 · il canto
  - id: avv-buche-laresh-il-canto
    immagine: icone/sound-waves
    titolo: Il canto
    sommario: "Tutta la colonia comincia a cantare insieme. Le gallerie si riempiono di zuccaiole che scendono in fila verso il nido."
    luogo: Le gallerie del rio basso, l'incrocio
    area: avv-buche-laresh
    requisiti: [avventura.buche-laresh == 5, profondita.avv-buche-laresh == 4, avv-buche-laresh.svolta == 0]
    testo: |
      Sei a un incrocio di quattro gallerie quando comincia. Il trillo parte da molto lontano sotto di te con
      una nota sola e lunga, e subito lo riprendono tutte le zuccaiole del nido finché non capisci più da dove
      venga. La malta ti vibra sotto le mani, e dal vetro della lanterna la fuliggine si stacca a scaglie.
      Dalle gallerie in alto scendono le zuccaiole in file ordinate, ognuna con le antenne sulla coda di
      quella davanti, e vanno tutte giù. Nessuna esce dalla fila e nessuna si ferma a guardare la luce.

      Una fila sola sale per una galleria fresca verso ovest, sotto il filare dei gelsi. Da lassù scende un
      filo d'aria che porta l'odore della terra arata.

      {politica-ed-economia Media} Oltre i gelsi c'è il granaio di Casa Velar, e fra un mese una colonia
      cresciuta con il grano di due campi ha bisogno di un granaio.

      Le prime file ti arrivano addosso. *Il canto è per la regina, e il nido le va incontro.* Hai pochi passi
      di vantaggio.
    opzioni:
      - testo: "Infilarti in una nicchia e lasciarle passare"
        descrizione: "Le file sono fitte, e le nicchie sono fatte per una zuccaiola. Bisogna starci dentro senza farsi toccare."
        prova: { attributo: fisico, abilita: furtivita, difficolta: Difficile }
        successo:
          titolo: Le file
          testo: |
            Ti schiacci in una nicchia con la lanterna spenta sotto la giacca, e le file ti passano davanti
            per un tempo lunghissimo, antenne su coda. Al buio le senti dal fruscio, che tiene sempre lo
            stesso passo. Quando il canto si ferma riaccendi la lanterna e segui l'ultima, a distanza, giù
            verso il nido.
          pe: { furtivita: 3 }
          effetti: { profondita.avv-buche-laresh: 1, avv-buche-laresh.svolta: 1 }
        fallimento:
          titolo: La zampa nella nicchia
          testo: |
            Una zuccaiola della fila ti sfiora con un'antenna, e si ferma. Dietro di lei si ferma tutta la
            fila. Ti colpisce di zampa dentro la nicchia, alla cieca, finché non scappi per la galleria da cui
            eri venut{o|a}, con il canto che ti insegue.
          effetti: { ferite: 0.5 }
      - testo: "Contare le file e capire dove vanno"
        descrizione: "Tante file e quattro gallerie. La regina sta dove vanno quasi tutte, e il guaio dove va l'ultima."
        prova: { attributo: mentale, abilita: percezione, difficolta: Difficile }
        successo:
          titolo: Il pero e i gelsi
          testo: |
            Le conti con le labbra, galleria per galleria. Tutte le file scendono verso il pero del confine,
            tranne quella dei gelsi, che sale ogni volta più lunga. Quando il canto tace le file si fermano
            tutte nello stesso momento, a metà passo. La regina è sotto il pero, e il granaio della Dama ha
            ancora qualche settimana. Segui le file verso il basso.
          pe: { percezione: 3 }
          effetti: { profondita.avv-buche-laresh: 1, avv-buche-laresh.svolta: 1 }
        fallimento:
          titolo: Il canto in testa
          testo: |
            Perdi il conto alla terza fila, e il canto ti entra nella testa e ci resta. Lo senti nei denti e
            dietro gli occhi. Ti ritrovi a battere il piede a tempo con le zuccaiole e torni indietro prima di
            metterti in fila anche tu.
          effetti: { tormento: 0.5 }
      - testo: "Battere il mazzuolo contro la parete dei gelsi"
        descrizione: "Le zuccaiole vanno dove la terra trema. Tre colpi nella galleria che sale, e la fila dei gelsi torna indietro."
        requisiti: [avv-buche-laresh.mazzuolo >= 1]
        esito:
          titolo: Tre colpi
          testo: |
            Batti tre colpi di mazzuolo nella galleria dei gelsi, e la fila che saliva si ferma con le antenne
            puntate sulla parete. Poi torna indietro, giù dietro alle altre. Ne batti altri tre più in basso,
            per buona misura. Poi segui il canto verso il nido, e la galleria dei gelsi resta vuota alle tue
            spalle.
          effetti: { profondita.avv-buche-laresh: 1, avv-buche-laresh.svolta: 1 }
      - testo: "Buttarti a terra e lasciarle passare sopra"
        descrizione: "Una zuccaiola cammina su tutto quello che è per terra. Anche su di te, se stai ferm{o|a}."
        costo: 2
        esito:
          titolo: Sotto le zampe
          testo: |
            Ti stendi a faccia in giù contro la parete, e le file ti passano sopra la schiena, zampa dopo
            zampa, per tutta la durata del canto. Le zampe sono leggere e si posano tutte nello stesso punto
            delle scapole. Quando finisce ti alzi con la giacca a brandelli, e segui l'ultima fila verso il
            basso.
          effetti: { profondita.avv-buche-laresh: 1, avv-buche-laresh.svolta: 1, tormento: 0.5 }

  # ------------------------------------------------------------ 6-9 · la dispensa del grano
  - id: avv-buche-laresh-la-dispensa-del-grano
    immagine: icone/wheat
    titolo: La dispensa del grano
    sommario: "Una sala con le pareti fatte di covoni, murati nella saliva. Fra le file passano due guardiane."
    luogo: Le gallerie del rio basso, la dispensa del grano
    area: avv-buche-laresh
    ripetibile: true
    requisiti: [avventura.buche-laresh == 5, profondita.avv-buche-laresh >= 6, profondita.avv-buche-laresh <= 9]
    testo: |
      La dispensa è una sala lunga e bassa con le pareti di covoni murati con la saliva. Sono messi di testa a
      corsi sfalsati, e nelle giunture la saliva si è seccata gialla e dura. Qui c'è il grano di tutte le
      notti del rio basso e dei campi della Dama più vicini. È tutto asciutto, e in tanto grano non c'è un
      chicco che abbia germogliato. Fra i covoni passano avanti e indietro due guardiane più grosse delle
      altre, con la testa larga e due mandibole che sporgono come cesoie. Fanno sempre lo stesso giro, e lungo
      il loro percorso la paglia del pavimento è consumata fino alla terra.

      {percezione Difficile} Le guardiane si incrociano sempre a metà sala, e per il tempo di due passi si
      danno le spalle.
    opzioni:
      - testo: "Affrontare le guardiane"
        descrizione: "Sono due, con mandibole come cesoie. Fra i covoni non c'è spazio per girare intorno."
        combattimento: avv-buche-laresh-le-guardiane
        vittoria:
          titolo: Le cesoie ferme
          testo: |
            La seconda guardiana cade contro una parete di covoni e ci resta appoggiata, con le mandibole
            aperte. Dal guscio rotto esce un liquido verde che sa di erba falciata. Attraversi la dispensa con
            la lama ancora alzata e il grano di Gisella che ti piove addosso dalle pareti.
          pe: { armi-da-mischia: 3 }
          effetti: { profondita.avv-buche-laresh: 1 }
        sconfitta:
          titolo: Le cesoie
          testo: |
            Le mandibole ti prendono la gamba e stringono quanto basta a tenerti. Ti trascinano fuori dalla
            dispensa, e la guardiana ti lascia andare sulla soglia come si lascia un sacco vuoto, e tu torni
            indietro zoppicando.
          effetti: { tormento: 0.5 }
      - testo: "Passare quando si danno le spalle"
        descrizione: "Due passi di tempo, a metà sala. Poi bisogna essere già dall'altra parte dei covoni."
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Difficile }
        successo:
          titolo: Due passi
          testo: |
            Aspetti l'incrocio in un varco fra i covoni, e quando si danno le spalle attraversi la sala in due
            passi lunghi. La terra battuta del loro giro è liscia e non fa rumore sotto le suole. Ti infili
            nel varco di fronte con il cuore che batte fin dentro le orecchie, e le guardiane riprendono il
            giro.
          pe: { furtivita: 3 }
          effetti: { profondita.avv-buche-laresh: 1 }
        fallimento:
          titolo: Il covone che cade
          testo: |
            Al secondo passo urti un covone, che si stacca dalla parete e cade. Il grano si sparge sul
            pavimento con un fruscio lungo, e le guardiane si girano insieme. Scappi indietro con una
            mandibola che ti strappa la giacca e un pezzo della spalla.
          effetti: { ferite: 1 }
      - testo: "Battere il mazzuolo in fondo alla sala"
        descrizione: "Le guardiane vanno dove la terra trema. Basta battere da una parte e passare dall'altra."
        requisiti: [avv-buche-laresh.mazzuolo >= 1]
        esito:
          titolo: Il richiamo
          testo: |
            Batti il mazzuolo contro una parete di covoni in fondo alla sala, e le guardiane ci corrono
            incontro con le mandibole aperte. Quando arrivano tu sei già dall'altra parte, e loro stanno
            ancora tagliando la paglia dove battevi. Il rumore delle mandibole nella paglia ti segue fino alla
            galleria, fitto come quello delle forbici da tosa.
          effetti: { profondita.avv-buche-laresh: 1 }
      - testo: "Scavarti un passaggio dentro i covoni"
        descrizione: "Le pareti sono di grano. Con le mani e con il coltello ci si passa dentro, in molto tempo."
        costo: 3
        esito:
          titolo: Dentro il grano
          testo: |
            Scavi nei covoni a forza di mani, sfilando le spighe una manciata alla volta, e passi dentro la
            parete mentre le guardiane fanno il loro giro dall'altra parte della paglia. Dentro il grano è
            caldo e fermo, e il loro passo ti arriva attraverso i covoni. Esci con le mani tagliate dalle
            reste e il grano fin dentro le orecchie.
          effetti: { profondita.avv-buche-laresh: 1, ferite: 0.5 }

  # ------------------------------------------------------------ 6-9 · la dispensa delle bestie
  - id: avv-buche-laresh-la-dispensa-delle-bestie
    immagine: icone/spider-web
    titolo: La dispensa delle bestie
    sommario: "Contro le pareti stanno le bestie prese nei campi, murate nella saliva fino al collo. Sono vive."
    luogo: Le gallerie del rio basso, la dispensa delle bestie
    area: avv-buche-laresh
    ripetibile: true
    requisiti: [avventura.buche-laresh == 5, profondita.avv-buche-laresh >= 6, profondita.avv-buche-laresh <= 9]
    testo: |
      In questa dispensa le zuccaiole tengono le bestie. Contro le pareti stanno una capra e un vitello
      rossiccio murati nella saliva fino al collo, e più in là un cane da pastore. Intorno ai colli la saliva
      è liscia e senza una crepa, e l'aria sa di stalla chiusa. Sono vivi e seguono la lanterna con gli occhi.
      Il cane ha il muso libero e non abbaia. Il pavimento è una crosta sottile che scricchiola, e sotto si
      muove qualcosa.

      {medicina Media} Sono svegli e non possono muoversi. La saliva li tiene fermi e vivi come la cantina
      tiene il latte.

      {origine fuggiasco-di-ghoran} Nei recinti di Ghoran le bestie da combattimento guardavano con gli stessi
      occhi.
    opzioni:
      - testo: "Attraversare la crosta senza sfondarla"
        descrizione: "È sottile come il ghiaccio di una pozzanghera. Sotto, qualcosa aspetta che si rompa."
        prova: { attributo: fisico, abilita: acrobazia, difficolta: Molto difficile }
        successo:
          titolo: La crosta che regge
          testo: |
            Attraversi la dispensa sulle punte dei piedi allargando il peso, e la crosta scricchiola sotto
            ogni passo senza aprirsi. Sotto la crosta qualcosa ti segue con un palmo di ritardo. Il vitello ti
            guarda andare fino all'ultimo, e tu dall'altra parte non ti volti.
          pe: { acrobazia: 4 }
          effetti: { profondita.avv-buche-laresh: 1 }
        fallimento:
          titolo: La fossa sotto
          testo: |
            La crosta si sfonda sotto il tallone, e sotto c'è una fossa piena di larve ammucchiate le une
            sulle altre. Ti si attaccano alla gamba fino al ginocchio prima che tu riesca a tirarla fuori, e
            le stacchi una a una, tornando indietro.
          effetti: { ferite: 1 }
      - testo: "Camminare sul bordo dei bozzoli, lungo la parete"
        descrizione: "La saliva che tiene le bestie è dura e spessa. Ci si cammina sopra, accanto alle loro teste."
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Difficile }
        successo:
          titolo: Accanto alle teste
          testo: |
            Sali sul bordo dei bozzoli e cammini lungo la parete, con i piedi a un palmo dalle teste delle
            bestie. La capra ti annusa la caviglia, e ha il fiato caldo e il muso secco. Scendi dall'altra
            parte senza aver toccato la crosta.
          pe: { atletica: 3 }
          effetti: { profondita.avv-buche-laresh: 1 }
        fallimento:
          titolo: Il cane
          testo: |
            Metti il piede sul bozzolo del cane. Il cane guaisce, e al guaito la crosta sotto di te si muove e
            si solleva in più punti verso di lui. Torni indietro saltando da un bozzolo all'altro, e il cane
            continua a guaire dopo che sei uscit{o|a}.
          effetti: { tormento: 1 }
      - testo: "Rompere la crosta un passo alla volta"
        descrizione: "Con il tacco, piano, guardando che cosa c'è sotto prima di mettere il piede. Ci vuole molto."
        costo: 3
        esito:
          titolo: Un passo alla volta
          testo: |
            Rompi la crosta con il tacco, guardi sotto, schiacci le larve che vengono su e fai un passo. Poi
            ricominci. Sotto la crosta le larve sono così fitte che il tacco non arriva mai alla terra. Ci
            metti ore, e il vitello muggisce ogni volta che la crosta si rompe.
          effetti: { profondita.avv-buche-laresh: 1, tormento: 0.5 }

  # ------------------------------------------------------------ 6-9 · la strettoia delle guardiane
  - id: avv-buche-laresh-la-strettoia-delle-guardiane
    immagine: icone/pincers
    titolo: La strettoia delle guardiane
    sommario: "Una galleria stretta, con due guardiane ferme a fare da tappo. Dietro di loro arriva il canto del nido."
    luogo: Le gallerie del rio basso, la strettoia
    area: avv-buche-laresh
    ripetibile: true
    requisiti: [avventura.buche-laresh == 5, profondita.avv-buche-laresh >= 6, profondita.avv-buche-laresh <= 9]
    testo: |
      La galleria si stringe fino a lasciar passare una zuccaiola sola, e lì ce ne sono due ferme una dietro
      l'altra con le mandibole aperte verso di te. Sono guardiane e tengono il passaggio come un tappo tiene
      una botte. Le pareti della strettoia sono lucide all'altezza dei loro fianchi, e per terra la malta ha
      le conche dove da sempre poggiano le zampe. Da dietro arriva il canto del nido.

      {intimidire Media fallita} Le fissi come i buttafuori del Grifone, e i loro occhi d'insetto non hanno
      niente da risponderti.

      {atletica Difficile} Sopra di loro il soffitto sale, e la malta ha i buchi delle zampe fino in cima.
    opzioni:
      - testo: "Affrontare le guardiane nella strettoia"
        descrizione: "Due mandibole a cesoia, una dietro l'altra. Nella strettoia si combatte con una sola, finché cade."
        combattimento: avv-buche-laresh-le-guardiane
        vittoria:
          titolo: Il tappo saltato
          testo: |
            La prima guardiana cade di traverso nella strettoia, e la seconda deve scavalcarla per arrivarti
            addosso. È lì che la prendi. Passi sopra tutte e due, e i gusci scricchiolano sotto le suole
            mentre vai verso il canto.
          pe: { armi-da-mischia: 3 }
          effetti: { profondita.avv-buche-laresh: 1 }
        sconfitta:
          titolo: Fuori dalla strettoia
          testo: |
            Le cesoie ti prendono il braccio della lama e ti spingono indietro fino all'incrocio. Lì le
            guardiane si fermano, poi tornano al loro posto senza fretta e rimettono le zampe nelle stesse
            conche della malta.
          effetti: { tormento: 0.5 }
      - testo: "Passare sopra di loro, lungo il soffitto"
        descrizione: "I buchi delle zampe salgono fino in cima. Dall'alto le guardiane hanno le teste girate dall'altra parte."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Molto difficile }
        successo:
          titolo: Sopra le cesoie
          testo: |
            Sali per i buchi fino al soffitto e passi sopra le guardiane a forza di dita, con la pancia contro
            la malta. Sotto di te le mandibole si aprono e si chiudono piano, a vuoto. Una alza le antenne
            verso di te e le riabbassa. Ti lasci cadere dall'altra parte, già lontano dalle mandibole.
          pe: { atletica: 4 }
          effetti: { profondita.avv-buche-laresh: 1 }
        fallimento:
          titolo: Fra le mandibole
          testo: |
            Un buco cede proprio sopra la seconda guardiana, e le cadi davanti. Le mandibole si chiudono un
            attimo dopo che hai rotolato via con un colpo secco da tagliola, e quello che prendono è soltanto
            la tua manica. Scappi indietro con il braccio sanguinante.
          effetti: { ferite: 1 }
      - testo: "Battere il mazzuolo in una galleria laterale"
        descrizione: "Una guardiana lascia il posto per controllare. Due, se il colpo è quello giusto."
        requisiti: [avv-buche-laresh.mazzuolo >= 1]
        esito:
          titolo: Il posto vuoto
          testo: |
            Batti il mazzuolo in fondo a una galleria laterale e torni di corsa alla strettoia. Senti le
            guardiane passarti dietro con un raschio svelto di zampe. Sono andate tutte e due a vedere, e
            passi dove stavano loro.
          effetti: { profondita.avv-buche-laresh: 1 }
      - testo: "Aspettare il cambio della guardia"
        descrizione: "Prima o poi qualcuno le sostituisce. Bisogna stare fermi al buio finché succede."
        costo: 3
        esito:
          titolo: Il cambio
          testo: |
            Aspetti al buio, sedut{o|a} contro la parete, finché arrivano due guardiane nuove e le vecchie se
            ne vanno. Le nuove salgono dal basso senza un suono. Nel momento in cui si incrociano la strettoia
            resta libera per un battito, e ci passi con le gambe che non senti più.
          effetti: { profondita.avv-buche-laresh: 1, tormento: 0.5 }

  # ------------------------------------------------------------ 6-9 · la dispensa del ferro
  - id: avv-buche-laresh-la-dispensa-del-ferro
    immagine: icone/pitchfork
    titolo: La dispensa del ferro
    sommario: "Il ferro rubato ai campi, ammucchiato per le larve. Sul mucchio dorme una zuccaiola grossa come un bue."
    luogo: Le gallerie del rio basso, la dispensa del ferro
    area: avv-buche-laresh
    ripetibile: true
    requisiti: [avventura.buche-laresh == 5, profondita.avv-buche-laresh >= 6, profondita.avv-buche-laresh <= 9]
    testo: |
      In fondo a una galleria laterale c'è la dispensa del ferro. In mezzo c'è un mucchio di vomeri e zappe
      alto quanto un uomo, e in cima c'è mezzo vomere mangiato a mezzelune, quello di Ercole. I morsi sono
      tutti della stessa misura e corrono lungo il bordo in fila. Sul mucchio dorme una zuccaiola grossa come
      un bue con le zampe strette intorno al ferro, e a ogni suo respiro il mucchio si assesta con un
      tintinnio leggero. L'uscita è dietro di lei.

      {tecnologia Media} Fra le zappe c'è un guscio di metallo liscio grande come un pane, di quelli che gli
      aratri di Laresh trovano a volte nei campi. Le larve non l'hanno nemmeno graffiato. Non ha una giuntura
      né un colpo di martello, e dove gli altri ferri sono rossi di ruggine lui è pulito.
    opzioni:
      - testo: "Svegliarla e affrontarla"
        descrizione: "È più grossa delle altre e difende il suo mucchio. Una volta sveglia, non lo lascia."
        combattimento: avv-buche-laresh-la-zuccaiola-del-ferro
        vittoria:
          titolo: Il mucchio
          testo: |
            La zuccaiola rotola giù dal mucchio con un rumore di pentole, e non si rialza. Prima di proseguire
            frughi fra le zappe e tiri fuori il guscio di metallo liscio, che pesa come un sasso di fiume. Te
            lo tieni in mano per un pezzo, e resta freddo.
          pe: { armi-da-mischia: 3 }
          effetti: { profondita.avv-buche-laresh: 1, reperto.sigillato: 1 }
        sconfitta:
          titolo: Il ferro che suona
          testo: |
            La zuccaiola ti scaraventa contro il mucchio, e il ferro ti crolla addosso con un fracasso che si
            sente in tutto il nido. Ti tiri fuori dalle zappe e scappi da dove sei venut{o|a}, e il fracasso
            ti arriva ancora dalle gallerie quando sei già lontan{o|a}.
          effetti: { tormento: 0.5 }
      - testo: "Girare intorno al mucchio senza farlo suonare"
        descrizione: "Un vomere che scivola basta a svegliarla. La strada passa fra il mucchio e la parete."
        prova: { attributo: fisico, abilita: furtivita, difficolta: Molto difficile }
        successo:
          titolo: Senza un suono
          testo: |
            Passi fra il mucchio e la parete di fianco, con la lanterna chiusa e una mano sul ferro per
            tenerlo fermo. Il ferro sotto la mano è freddo e unto di saliva. La zuccaiola si muove nel sonno,
            stringendo le zampe. Quando arrivi all'uscita il ferro non ha fatto un suono.
          pe: { furtivita: 4 }
          effetti: { profondita.avv-buche-laresh: 1 }
        fallimento:
          titolo: La zappa
          testo: |
            Una zappa scivola giù dal mucchio e batte sulla pietra, e la zuccaiola apre gli occhi. Scappi da
            dove sei venut{o|a} con lei che ti insegue per un pezzo. Poi torna a dormire sul suo ferro e lo
            stringe con tutte le zampe.
          effetti: { ferite: 1 }
      - testo: "Strisciare sotto il mucchio, fra le zappe"
        descrizione: "Sotto il mucchio c'è uno spazio, fra i manici. È stretto e il ferro sopra pesa."
        costo: 3
        esito:
          titolo: Sotto il ferro
          testo: |
            Strisci sotto il mucchio sulla pancia, fra i manici delle zappe, con il ferro che scricchiola
            sopra la tua schiena. Sopra la faccia hai le lame delle zappe, mangiate fino a lasciar passare la
            luce della lanterna. Ci metti un'ora per dieci passi. Esci dall'altra parte con i gomiti
            scorticati e il sudore freddo.
          effetti: { profondita.avv-buche-laresh: 1, ferite: 0.5 }

  # ------------------------------------------------------------ 6-9 · la caposquadra (una volta sola)
  - id: avv-buche-laresh-la-caposquadra
    immagine: icone/leather-boot
    titolo: La caposquadra
    sommario: "In una dispensa piccola, murata nella saliva fino al petto, Bice Gaddi canta la canzone della spiga con la voce che le resta."
    luogo: Le gallerie del rio basso, la dispensa piccola
    area: avv-buche-laresh
    requisiti: [avventura.buche-laresh == 5, profondita.avv-buche-laresh >= 6, profondita.avv-buche-laresh <= 9, avv-buche-laresh.bice == 0]
    testo: |
      La voce la senti prima della luce. È rauca e stonata e ricomincia sempre dalla stessa strofa della
      canzone della spiga. In una dispensa piccola c'è Bice Gaddi, murata nella saliva seccata fino al petto.
      Dalla crosta escono le spalle strette e la testa con i capelli grigi tagliati corti, impastati di terra.
      La crosta è stesa intorno a lei a strati, e quelli in basso sono già gialli e duri. Quando la lanterna
      le arriva in faccia smette di cantare.

      «Uno stivale l'ho perso sopra» dice. «L'altro me l'hanno mangiato addosso, e il piede c'è ancora.» Ha le
      labbra spaccate. «Quando cantano tutte passano a guardarmi. Fate presto.»

      {medicina Difficile} La crosta le stringe le costole, e se si rompe storta i pezzi le entrano nella
      carne.

      {empatia Media} Ha cantato tre giorni per non addormentarsi, e adesso ha paura di smettere.
    opzioni:
      - testo: "Romperle la crosta con l'impugnatura della lama"
        descrizione: "Colpi brevi, sempre nello stesso punto, finché si apre una crepa. Troppo forte, e la crosta le entra nel fianco."
        prova: { attributo: fisico, abilita: [armi-da-mischia, atletica], difficolta: Difficile }
        successo:
          titolo: Il guscio rotto
          testo: |
            Batti la crosta con l'impugnatura, piano, sempre nello stesso punto, finché si apre in una crepa e
            Bice ne esce come da un guscio d'uovo. Ha le gambe bianche e gonfie, e il piede senza stivale è
            intero. Mentre le dai da bere ti racconta che nel fosso affilava la falce, e la bestia si è
            fermata ad ascoltare la cote. «Fa lo stesso verso loro, la cote» dice. Poi s'infila in uno
            sfiatatoio troppo stretto per te, e sale verso la luce.
          pe: { armi-da-mischia: 3 }
          effetti: { profondita.avv-buche-laresh: 1, avv-buche-laresh.bice: 1 }
        fallimento:
          titolo: La crepa storta
          testo: |
            La crosta si spacca storta, e un pezzo le entra nel fianco. Il sangue sparisce nella crosta senza
            colare. Bice stringe i denti e ti dice di andare a cercare qualcosa di meglio di quella lama e di
            tornare. Quando esci dalla dispensa ricomincia a cantare.
          effetti: { tormento: 0.5 }
      - testo: "Ammorbidire la crosta con l'acqua della borraccia"
        descrizione: "La saliva seccata con l'acqua torna molle, piano. Bisogna sapere dove versarla."
        prova: { attributo: mentale, abilita: [medicina, natura], difficolta: Difficile }
        successo:
          titolo: La crosta molle
          testo: |
            Versi l'acqua a filo lungo le spalle di Bice, e la crosta torna molle come pane bagnato. La tiri
            via a pezzi, e sotto la camicia le è rimasta incollata alla pelle. Lei esce da sola. Beve l'ultima
            acqua, ti racconta della cote e della bestia che si è fermata ad ascoltarla, e sale per uno
            sfiatatoio dove tu non passi.
          pe: { medicina: 3 }
          effetti: { profondita.avv-buche-laresh: 1, avv-buche-laresh.bice: 1 }
        fallimento:
          titolo: L'acqua sbagliata
          testo: |
            L'acqua scioglie la crosta dalla parte sbagliata, e la saliva molle le cola sul collo e brucia.
            Dove cola la pelle le si arrossa a chiazze. Bice ti manda via con un'occhiata, e tu esci con la
            borraccia vuota e la sua voce che ricomincia la strofa.
          effetti: { tormento: 0.5 }
      - testo: "Sciogliere la crosta con la cenere"
        descrizione: "La cenere della striscia spegne la saliva. Seccata o no, la crosta è sempre saliva."
        requisiti: [avv-buche-laresh.cenere >= 1]
        esito:
          titolo: La cenere sulle spalle
          testo: |
            Le spargi la cenere sulle spalle e sul petto, e la crosta sfrigola e si sbriciola come gesso
            vecchio. Bice ne esce tossendo, con la cenere nei capelli grigi. Ti racconta della cote e della
            bestia che si è fermata ad ascoltarla, poi sale per uno sfiatatoio dove tu non passi.
          effetti: { profondita.avv-buche-laresh: 1, avv-buche-laresh.bice: 1 }
      - testo: "Scavarla fuori con le mani"
        descrizione: "Un'unghia di crosta alla volta, senza attrezzi. Le mani le perdi tu."
        costo: 3
        esito:
          titolo: Le unghie
          testo: |
            Gratti la crosta con le unghie e con la punta del coltello, un pezzetto alla volta, mentre Bice
            canta per tenerti compagnia e sbaglia sempre la stessa strofa. Ci metti ore, e le unghie ti si
            spaccano una dopo l'altra. Lei esce, ti dice della cote e della bestia che si è fermata ad
            ascoltarla, e sale per uno sfiatatoio.
          effetti: { profondita.avv-buche-laresh: 1, avv-buche-laresh.bice: 1, ferite: 0.5 }

  # ------------------------------------------------------------ il cuore, prima fase · il nido
  - id: avv-buche-laresh-il-nido
    immagine: icone/insect-jaws
    titolo: Il nido
    sommario: "Sotto il pero del confine le gallerie finiscono in una camera a cupola, e al centro della camera c'è la regina."
    luogo: Le gallerie del rio basso, il nido sotto il pero
    area: avv-buche-laresh
    requisiti: [avventura.buche-laresh == 5, profondita.avv-buche-laresh >= 10]
    testo: |
      L'ultima galleria sbuca in una camera a cupola grande quanto l'aia di Casa Velar. Dal soffitto scendono
      le radici del pero, grosse quanto un braccio e lucide di saliva. Le pareti sono un favo di celle scavate
      nella malta, tutte della stessa misura e in file sfalsate, ognuna con un uovo o una larva.

      Al centro c'è la regina. È una zuccaiola tre volte più grande delle altre, e si trascina dietro un
      addome gonfio e pallido che pulsa piano. A ogni pulsazione ne esce un uovo che una nutrice porta via.
      Davanti alla bocca ha due mandibole nere e curve, lunghe come un avambraccio. Da lei viene un calore che
      senti sulla faccia a dieci passi.

      Le uova si schiudono e le larve appena nate strisciano verso la lanterna.

      {armi-da-mischia Difficile} Fra la testa e il dorso c'è una piega di pelle chiara che si apre quando lei
      gira la testa, e lì la lama non trova guscio.

      Quando entri il canto si ferma. Nel silenzio senti soltanto i gusci delle uova che si aprono, e la
      regina gira la testa verso di te.

      {origine allievo-di-torvessa} All'Accademia hai sentito dire che una colonia senza la madre si disfa in
      una stagione. Della sua misura non parlava nessuno.
    opzioni:
      - testo: "Affrontare la regina nel nido"
        descrizione: "Due mandibole come falci, e da ogni cella che si apre una larva in più. È la prima di due volte."
        combattimento: avv-buche-laresh-il-nido
        vittoria:
          titolo: La regina ferita
          testo: |
            La prendi nella piega sotto la testa, e la regina si stacca dalle celle con un fischio che fa
            tremare la cupola. Dalla piega esce un liquido chiaro e caldo che fuma sulla lama. Le larve
            intorno si fermano tutte. Lei si gira verso le radici del pero e comincia a scavare verso l'alto,
            trascinandosi dietro l'addome.
          pe: { armi-da-mischia: 5 }
          segue: avv-buche-laresh-la-regina
        sconfitta:
          titolo: Le mandibole
          testo: |
            Le mandibole ti prendono di traverso e ti scagliano contro il favo, e le celle ti si rompono sotto
            la schiena. Le larve ti salgono addosso prima che tu riesca ad alzarti. Fuggi per la prima
            galleria che trovi e risali da uno sfiatatoio a forza di gomiti. Quando sbuchi in un campo della
            Dama, le gallerie sono tutte da rifare.
          effetti: { tormento: 1 }
          vai: superficie-fratturata
      - testo: "Tirare giù le radici del pero sopra di lei"
        descrizione: "Le radici reggono il soffitto della cupola. Se ne cedono due, la terra sopra cade sulla regina e sul favo."
        prova: { attributo: fisico, abilita: atletica, difficolta: Difficile }
        successo:
          titolo: La cupola che cade
          testo: |
            Ti appendi con tutto il peso alla radice più grossa finché si stacca dalla malta, e mezza cupola
            viene giù sulla regina e sulle celle. Sotto la terra le celle schiacciate scricchiolano a lungo.
            Lei ne esce scrollandosi la terra di dosso, con una zampa storta, e si mette a scavare verso
            l'alto fra le radici.
          pe: { atletica: 5 }
          segue: avv-buche-laresh-la-regina
        fallimento:
          titolo: La terra addosso
          testo: |
            La radice cede, e la terra cade addosso a te invece che a lei. Ti scavi fuori mezzo soffocato con
            la bocca piena di terra che sa di radici, mentre la regina ti guarda dal centro della camera.
            Scappi per uno sfiatatoio, e quando sbuchi in un campo della Dama le gallerie sono tutte da
            rifare.
          effetti: { ferite: 1.5, tormento: 0.5 }
          vai: superficie-fratturata
      - testo: "Dare fuoco alle celle con l'olio della lanterna"
        descrizione: "Il favo è di malta e paglia masticata. Se brucia, la regina lascia le uova per salvarle, o lascia te."
        prova: { attributo: mentale, abilita: [natura, tecnologia], difficolta: Difficile }
        successo:
          titolo: Il favo che brucia
          testo: |
            Rovesci l'olio della lanterna su una fila di celle e ci butti lo stoppino. La paglia masticata
            prende fuoco subito con un odore di latte bruciato, e la regina si getta sulle celle che bruciano.
            Quando ne esce ha le antenne bruciate e il dorso nero, e si mette a scavare verso l'alto.
          pe: { natura: 5 }
          segue: avv-buche-laresh-la-regina
        fallimento:
          titolo: Il fumo
          testo: |
            La paglia fa più fumo che fiamma, e il fumo giallo e acido riempie la cupola. Scappi tossendo per
            la prima galleria che trovi, con le larve dietro, e risali da uno sfiatatoio. Quando sbuchi in un
            campo della Dama, le gallerie sono tutte da rifare.
          effetti: { ferite: 1, tormento: 1 }
          vai: superficie-fratturata
      - testo: "Fare il verso della cote, come diceva Bice"
        descrizione: "La cote sulla lama fa il loro verso, e la bestia si è girata ad ascoltarla. Girata, ha la piega della pelle scoperta."
        requisiti: [avv-buche-laresh.bice >= 1]
        prova: { attributo: fisico, abilita: armi-da-mischia, difficolta: Difficile }
        successo:
          titolo: La cote
          testo: |
            Passi un sasso piatto sul taglio della lama, lungo, come si affila una falce, e la regina gira la
            testa verso il suono. Lo ascolta immobile, con le antenne tese in avanti. La piega di pelle chiara
            si apre. Ci entri con tutta la lama, e lei si strappa via fischiando e si mette a scavare verso
            l'alto fra le radici.
          pe: { armi-da-mischia: 5 }
          segue: avv-buche-laresh-la-regina
        fallimento:
          titolo: Il verso sbagliato
          testo: |
            Il sasso stride sul filo, e il verso non è quello giusto. Intorno a te le larve si fermano tutte
            insieme. La regina ti viene incontro invece di girarsi, e le mandibole ti prendono la spalla.
            Scappi per uno sfiatatoio fino a un campo della Dama, e le gallerie sono da rifare.
          effetti: { ferite: 1.5, tormento: 0.5 }
          vai: superficie-fratturata

  # ------------------------------------------------------------ il cuore, seconda fase · la regina che scava
  - id: avv-buche-laresh-la-regina
    tipo: seguito
    immagine: icone/insect-jaws
    titolo: La regina che scava
    sommario: "Ferita, la regina lascia il nido e scava verso il campo fra le radici del pero. Le ultime larve le vanno dietro."
    luogo: Le gallerie del rio basso, fra le radici del pero
    area: avv-buche-laresh
    requisiti: [avventura.buche-laresh == 5]
    testo: |
      La regina scava verso l'alto fra le radici del pero con l'addome che le si trascina dietro come un
      sacco. Dalla ferita le cola un umore chiaro che lascia sulle radici una scia lucida. Le ultime larve le
      vanno dietro con le zampe ancora molli, e tu dietro a loro arrampicandoti sulle radici.

      Poche braccia sopra c'è il campo. Lo capisci dalla terra fra le radici, che a ogni bracciata si fa più
      chiara e più asciutta. Se ci arriva scava un nido nuovo, e l'anno prossimo le buche saranno nei campi
      della Dama.

      {natura Media} Qui le radici sono fitte come una rete, e per passarci la regina deve girarsi di fianco.
      Ogni volta che si gira le si apre la piega di pelle chiara fra la testa e il dorso.

      Dall'alto arrivano colpi sordi e regolari di qualcuno che pianta pali nel campo. Fra un colpo e l'altro
      le larve si fermano tutte insieme e ripartono quando arriva il colpo dopo. La regina scava verso i
      colpi.
    opzioni:
      - testo: "Affrontarla fra le radici"
        descrizione: "È ferita e ha fretta, e le larve nuove le coprono le spalle. Fra le radici si combatte a un braccio di distanza."
        combattimento: avv-buche-laresh-la-regina
        vittoria:
          titolo: La mandibola
          testo: |
            La colpisci nella piega sotto la testa mentre è girata di fianco fra le radici, e la regina si
            ferma con le zampe ancora piantate nella terra. Le larve che le stavano dietro mollano le radici e
            cadono nel buio una dopo l'altra. Le stacchi una mandibola con tre colpi. Poi scavi verso i colpi,
            finché la vanga di Ercole sfonda la terra sopra di te e la luce del giorno ti arriva in faccia
            insieme alla sua voce.
          pe: { armi-da-mischia: 5 }
          effetti: { avventura.buche-laresh: 1, rep.laresh: 1, racconto: 1 }
          vai: superficie-fratturata
        sconfitta:
          titolo: Le radici
          testo: |
            Le larve ti si attaccano alle gambe e mordono la stoffa delle brache, e la regina ti scalcia giù
            dalle radici. Quando ti rialzi è sparita verso l'alto, e dalla sua parte scende soltanto un filo
            di terra. Risali da uno sfiatatoio fino al campo. La notte dopo il canto ricomincia sotto il pero,
            e le gallerie sono da rifare.
          effetti: { tormento: 1 }
          vai: superficie-fratturata
      - testo: "Tirarla giù per le zampe"
        descrizione: "Le zampe di dietro sono fuori dalla terra, e scalciano. Se la stacchi dalle radici, cade nel nido sotto di te."
        prova: { attributo: fisico, abilita: atletica, difficolta: Difficile }
        successo:
          titolo: Giù nel nido
          testo: |
            Afferri le zampe di dietro e ti lasci cadere con tutto il peso. I peli corti delle zampe ti
            pungono i palmi, e la regina si stacca dalle radici e precipita nel nido con un tonfo che scuote
            le celle del favo. Le salti addosso prima che si raddrizzi e le stacchi una mandibola. Poi scavi
            verso i colpi, finché la vanga di Ercole sfonda la terra sopra di te.
          pe: { atletica: 5 }
          effetti: { avventura.buche-laresh: 1, rep.laresh: 1, racconto: 1 }
          vai: superficie-fratturata
        fallimento:
          titolo: Il calcio
          testo: |
            Una zampa ti prende in pieno petto e ti stacca dalle radici. Cadi nel nido sulla schiena in mezzo
            alle celle rotte, e per un poco non riesci a respirare. Quando ti rialzi la regina è sparita verso
            l'alto. Risali da uno sfiatatoio, e la notte dopo il canto ricomincia sotto il pero.
          effetti: { ferite: 1.5, tormento: 0.5 }
          vai: superficie-fratturata
      - testo: "Chiuderla fra le radici del pero"
        descrizione: "Se tagli le radici giuste, quelle sopra si abbassano come una grata. Bisogna sapere quali reggono le altre."
        prova: { attributo: mentale, abilita: natura, difficolta: Difficile }
        successo:
          titolo: La grata di radici
          testo: |
            Tagli due radici alla base, e quelle sopra si abbassano tutte insieme e la chiudono di fianco come
            una grata. La regina si dibatte senza potersi girare, e le radici scricchiolano contro il guscio e
            tengono. Le stacchi una mandibola e la lasci lì. Poi scavi verso i colpi, finché la vanga di
            Ercole sfonda la terra.
          pe: { natura: 5 }
          effetti: { avventura.buche-laresh: 1, rep.laresh: 1, racconto: 1 }
          vai: superficie-fratturata
        fallimento:
          titolo: La radice sbagliata
          testo: |
            Tagli la radice sbagliata, e invece di chiudersi su di lei la grata si apre con uno schiocco di
            legno bagnato. La regina passa e sparisce verso l'alto. Risali da uno sfiatatoio con una radice
            che ti ha frustato la faccia, e la notte dopo il canto ricomincia sotto il pero.
          effetti: { ferite: 1, tormento: 1 }
          vai: superficie-fratturata
      - testo: "Battere il mazzuolo sotto di lei, più forte di Ercole"
        descrizione: "Va verso i colpi di sopra. Se i colpi più forti arrivano da sotto, scende verso di te con la testa avanti."
        requisiti: [avv-buche-laresh.mazzuolo >= 1]
        prova: { attributo: mentale, abilita: [percezione, natura], difficolta: Difficile }
        successo:
          titolo: I colpi da sotto
          testo: |
            Batti il mazzuolo sulla radice più grossa sotto di lei, più forte dei pali di Ercole e più svelto,
            e la radice ti rimanda ogni colpo nei polsi. La regina si ferma e torna giù verso di te a testa
            avanti, con la piega del collo scoperta. La lama ci entra fino all'elsa, e una mandibola la
            stacchi dopo. Poi la vanga di Ercole sfonda la terra sopra di te.
          pe: { percezione: 5 }
          effetti: { avventura.buche-laresh: 1, rep.laresh: 1, racconto: 1 }
          vai: superficie-fratturata
        fallimento:
          titolo: Il colpo fuori tempo
          testo: |
            Batti fuori tempo, e il tuo colpo arriva insieme a quello di Ercole. La regina ti viene addosso
            dall'alto con tutto il suo peso. Ti ritrovi nel nido sotto di lei, e ne esci solo perché lei ha
            più fretta di te. Risali da uno sfiatatoio, e la notte dopo il canto ricomincia sotto il pero.
          effetti: { ferite: 1.5, tormento: 0.5 }
          vai: superficie-fratturata
