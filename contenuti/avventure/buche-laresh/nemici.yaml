# I nemici dell'Avventura «Le buche di Laresh», tarati con `npx tsx scripts/simula-fine.ts avv-buche-laresh-` sul
# profilo «fine contenuti» (docs/piano-avventure.md): gregari fra il 70 e l'85%, la regina in due fasi brevi con la
# vittoria complessiva fra il 40 e il 55% (ogni fase intorno al 70%).
# - la zuccaiola: la bestia della notte sul confine, delle spighe trascinate e delle mute (gregario, da sola);
# - le guardiane: le zuccaiole delle dispense, con le mandibole a cesoia (gregari, in coppia);
# - la zuccaiola del ferro: quella che dorme sul mucchio della dispensa del ferro (gregario grosso, da sola);
# - la regina del nido, con le larve che escono dalle celle (prima fase), e la regina che scava fra le radici del
#   pero con le ultime larve (seconda fase).
nemici:
  - id: avv-buche-laresh-zuccaiola
    immagine: icone/cricket
    nome: Zuccaiola
    descrizione: "Una zuccaiola grande come un vitello, con il guscio marrone e lucido e le zampe davanti larghe e dentate come pale da forno. Taglia il grano alla base con due colpi e lo trascina sotto terra, e prima di uscire canta."
    attacco: 6
    difesa: 5
    difesaMentale: 3
    pf: 14
    danno: 4
    riduzione: 3
    iniziativa: 3
    tratti: [animale]

  - id: avv-buche-laresh-guardiana
    immagine: icone/pincers
    nome: Guardiana
    descrizione: "Una zuccaiola delle dispense, più grossa delle altre, con la testa larga e due mandibole che sporgono come cesoie. Cammina avanti e indietro con lo stesso passo, e taglia quello che trova sulla strada."
    attacco: 5
    difesa: 5
    difesaMentale: 3
    pf: 11
    danno: 3
    riduzione: 3
    iniziativa: 3
    tratti: [animale]

  - id: avv-buche-laresh-zuccaiola-del-ferro
    immagine: icone/cricket
    nome: Zuccaiola del ferro
    descrizione: "Una zuccaiola grossa come un bue che dorme arrotolata sul mucchio del ferro rubato, con le zampe strette intorno ai vomeri. Il guscio le è diventato scuro e duro come la ghisa."
    attacco: 6
    difesa: 4
    difesaMentale: 3
    pf: 14
    danno: 5
    riduzione: 3
    iniziativa: 2
    tratti: [animale]

  - id: avv-buche-laresh-larva
    immagine: icone/maggot
    nome: Larva del nido
    descrizione: "Una larva bianca e molle grossa come un maialino da latte, con la testa scura e la bocca sempre in moto. È cieca, e va al ferro come un cane va alla carne."
    attacco: 4
    difesa: 2
    difesaMentale: 2
    pf: 4
    danno: 2
    riduzione: 1
    iniziativa: 2
    tratti: [animale]

  - id: avv-buche-laresh-regina
    immagine: icone/insect-jaws
    nome: La regina del nido
    descrizione: "La madre delle zuccaiole del rio basso, grande tre volte le altre, con un addome gonfio e pallido che depone un uovo a ogni pulsazione. Davanti alla bocca ha due mandibole nere e curve, lunghe come un avambraccio."
    attacco: 6
    difesa: 4
    difesaMentale: 4
    pf: 14
    danno: 3
    riduzione: 5
    iniziativa: 1
    tratti: [animale]

  - id: avv-buche-laresh-regina-che-scava
    immagine: icone/insect-jaws
    nome: La regina che scava
    descrizione: "La regina ferita, che ha lasciato il nido e scava verso il campo fra le radici del pero. Ha fretta, e le mandibole lavorano la terra e chi le sta davanti con la stessa forza."
    attacco: 6
    difesa: 4
    difesaMentale: 4
    pf: 12
    danno: 4
    riduzione: 5
    iniziativa: 2
    tratti: [animale]

scontri:
  - { id: avv-buche-laresh-la-zuccaiola, nome: "La zuccaiola", nemici: [avv-buche-laresh-zuccaiola], feriteSconfitta: 2 }
  - { id: avv-buche-laresh-le-guardiane, nome: "Le guardiane", nemici: [avv-buche-laresh-guardiana, avv-buche-laresh-guardiana], feriteSconfitta: 3 }
  - { id: avv-buche-laresh-la-zuccaiola-del-ferro, nome: "La zuccaiola del ferro", nemici: [avv-buche-laresh-zuccaiola-del-ferro], feriteSconfitta: 3 }
  - { id: avv-buche-laresh-il-nido, nome: "La regina nel nido", nemici: [avv-buche-laresh-regina, avv-buche-laresh-larva, avv-buche-laresh-larva], feriteSconfitta: 3 }
  - { id: avv-buche-laresh-la-regina, nome: "La regina che scava", nemici: [avv-buche-laresh-regina-che-scava, avv-buche-laresh-larva], feriteSconfitta: 3 }
