# I nomi nuovi dell'Avventura «Le buche di Laresh», nel formato di contenuti/glossario/personaggi.yaml: presentazioni
# stabili, senza segreti. Gli altri nomi (Dama Ryn Velar, Old Marrek, Tano, Cahir, Cenere, Oreste Ruffo, il Seminatore)
# vengono dalla quest di Laresh e hanno già la loro voce.
glossario:
  - id: gisella-pavoli
    nome: Gisella Pavoli
    alias: [Gisella, Pavoli]
    tipo: personaggio
    sottotitolo: "La padrona di un campo in fondo al rio basso, a Laresh"
    testo: "Vedova sulla sessantina, padrona di uno dei due campi in fondo al rio basso che non stanno nel libro di Casa Velar. Porta il fazzoletto annodato sotto il mento e le maniche arrotolate, tiene una squadra di mietitori sua e un forcone sempre a portata di mano. Litiga da tutta la vita con il vicino, Ercole Ferlini."
    requisiti: [avventura.buche-laresh >= 1]

  - id: ercole-ferlini
    nome: Ercole Ferlini
    alias: [Ercole, Ferlini]
    tipo: personaggio
    sottotitolo: "Il vicino di Gisella Pavoli, oltre il solco"
    testo: "Padrone del campo accanto a quello di Gisella Pavoli, dall'altra parte del solco. Ha le spalle di un bue e una voce piccola, che non gli somiglia, beve la sera all'osteria sul rio e di notte giura di vederci benissimo. È nato nella stessa settimana di Gisella, e con lei litiga da allora."
    requisiti: [avventura.buche-laresh >= 1]

  - id: bice-gaddi
    nome: Bice Gaddi
    alias: [Bice]
    tipo: personaggio
    sottotitolo: "Caposquadra dei mietitori di Gisella Pavoli"
    testo: "Caposquadra dei mietitori di Gisella Pavoli. È piccola e asciutta, con i capelli grigi tagliati corti come un ragazzo. Affila le falci di tutta la squadra con la stessa cote da vent'anni, e lega un nastro rosso agli attrezzi per riconoscerli la sera. Canta la canzone della spiga sbagliando sempre la stessa strofa."
    requisiti: [avventura.buche-laresh >= 3]

  - id: zuccaiole
    nome: zuccaiole
    alias: [zuccaiola, Zuccaiola, Zuccaiole]
    tipo: creatura
    sottotitolo: "Le grillotalpe dei campi, a Laresh"
    testo: "A Laresh chiamano zuccaiole le grillotalpe, gli insetti lunghi un dito che di sera cantano sotto gli orti con un trillo basso e rosicchiano le radici. Hanno le zampe davanti larghe come pale e dentate. Il nonno di Old Marrek raccontava di un anno in cui erano grandi come vitelli, e in casa ridevano tutti."
    requisiti: []

  - id: pero-del-confine
    nome: pero del confine
    tipo: luogo
    sottotitolo: "Il pero fra i campi di Gisella Pavoli e di Ercole Ferlini"
    testo: "Un pero vecchio piantato a metà del solco che divide i campi di Gisella Pavoli e di Ercole Ferlini, in fondo al rio basso di Laresh. Sotto c'è una panca di legno dove i due vicini, ogni sera, si siedono uno a ogni capo a litigare. Nessuno dei due si ricorda chi l'abbia messa lì."
    requisiti: []
