# I nemici delle Prove del Guado, tarati sul combattente di fine contenuti di scripts/simula-fine.ts
# (npx tsx scripts/simula-fine.ts avv-prove-guado-): gregari fra il 70 e l'85%, Ozzra fra il 40 e il 55%.
# - Al guado (avv-prove-guado-la-gigantessa): la retroguardia, due ragazzi della banda.
# - Sulle terrazze: le sentinelle del campo (due ragazzi), il cavaliere con il suo cinghiale corazzato.
# - Alle grotte: il cinghiale di Ozzra alla catena, le due guardie dell'arco.
# - Il cuore: Ozzra, una fase sola, feriteSconfitta 3.
nemici:
  - id: avv-prove-guado-ragazzo-della-banda
    immagine: bestiario/orco
    nome: Ragazzo della banda
    descrizione: "Uno dei ragazzi degli Spacca-ossa che hanno seguito Ozzra fuori dalla palude, con una collana di lische sul petto e una lancia di canna con la punta di ferro rubato. Ha paura di lei più che di te, e combatte per non doverglielo spiegare."
    attacco: 6
    difesa: 3
    difesaMentale: 3
    pf: 10
    danno: 3
    riduzione: 3
    iniziativa: 2

  - id: avv-prove-guado-cavaliere
    immagine: bestiario/orco
    nome: Cavaliere della banda
    descrizione: "Il più vecchio dei ragazzi di Ozzra, in groppa a un cinghiale corazzato rubato ai recinti, con una lancia lunga il doppio del tuo braccio e un corno di capra appeso al collo."
    attacco: 6
    difesa: 3
    difesaMentale: 3
    pf: 12
    danno: 3
    riduzione: 3
    iniziativa: 2

  - id: avv-prove-guado-cinghiale-corazzato
    immagine: bestiario/cinghiale-crudele-mutato
    nome: Cinghiale corazzato
    descrizione: "Un cinghiale mutato dalla Marea, alto quanto un uomo al garrese, con la pelle nera e lucida e le vene color acciaio sotto la cotenna. Carica dritto e non sa girare."
    attacco: 6
    difesa: 2
    difesaMentale: 2
    pf: 12
    danno: 3
    riduzione: 3
    iniziativa: 2
    tratti: [animale]

  - id: avv-prove-guado-cinghiale-di-ozzra
    immagine: bestiario/cinghiale-mutato-gigante
    nome: Il cinghiale di Ozzra
    descrizione: "La cavalcatura di Ozzra, grossa il doppio delle bestie delle Prove, con le placche della schiena saldate in una corazza sola e le zanne cerchiate di ferro. Sta alla catena davanti alla grotta grande, e ha sempre fame."
    attacco: 6
    difesa: 4
    difesaMentale: 2
    pf: 14
    danno: 5
    riduzione: 3
    iniziativa: 2
    tratti: [animale]

  - id: avv-prove-guado-guardia-dell-arco
    immagine: bestiario/orco
    nome: Guardia dell'arco
    descrizione: "Uno dei due più grossi della banda, messo davanti all'arco della grotta con una scure da boscaiolo presa al guado. La tiene come una lancia, perché non ha mai tagliato un albero."
    attacco: 6
    difesa: 3
    difesaMentale: 3
    pf: 12
    danno: 3
    riduzione: 3
    iniziativa: 2

  - id: avv-prove-guado-ozzra
    immagine: fazioni/tribu-spacca-ossa
    nome: Ozzra
    descrizione: "La gigantessa degli Spacca-ossa, alta quasi il doppio di un uomo, con il sangue degli ogre nelle spalle e nella mascella. Combatte con un pestello di pietra grosso quanto un'incudine, fatto per spaccare le ossa e bere il midollo."
    attacco: 6
    difesa: 3
    difesaMentale: 4
    pf: 26
    danno: 4
    riduzione: 5
    iniziativa: 1

scontri:
  - { id: avv-prove-guado-la-retroguardia, nome: "La retroguardia di Ozzra", nemici: [avv-prove-guado-ragazzo-della-banda, avv-prove-guado-ragazzo-della-banda], feriteSconfitta: 2 }
  - { id: avv-prove-guado-le-sentinelle, nome: "I due di guardia al campo", nemici: [avv-prove-guado-ragazzo-della-banda, avv-prove-guado-ragazzo-della-banda], feriteSconfitta: 2 }
  - { id: avv-prove-guado-il-cavaliere, nome: "Il cavaliere della banda", nemici: [avv-prove-guado-cavaliere, avv-prove-guado-cinghiale-corazzato], feriteSconfitta: 2 }
  - { id: avv-prove-guado-il-cinghiale, nome: "Il cinghiale di Ozzra", nemici: [avv-prove-guado-cinghiale-di-ozzra], feriteSconfitta: 2 }
  - { id: avv-prove-guado-la-guardia, nome: "Le guardie dell'arco", nemici: [avv-prove-guado-guardia-dell-arco, avv-prove-guado-guardia-dell-arco], feriteSconfitta: 2 }
  - { id: avv-prove-guado-ozzra, nome: "Ozzra", nemici: [avv-prove-guado-ozzra], feriteSconfitta: 3 }
