# Le voci del glossario per i nomi nuovi delle Prove del Guado, senza segreti. Ozzra e Ruk compaiono solo quando la
# storia li ha nominati (avventura.prove-guado >= 6 e >= 7).
glossario:
  - id: dunja
    nome: Dunja
    tipo: personaggio
    sottotitolo: "La ragazza delle Prove del Guado"
    testo: "Una ragazza di diciassette anni del clan del Guado, con il sigillo di cera verde cucito sulla spalla e le dita sempre sporche di cera. Tiene la tavoletta delle Prove del Guado come la teneva suo nonno, tende da sola le corde dei nastri sulle rapide e parla in fretta, contando sulle dita."
    requisiti: []

  - id: branko-della-pece
    nome: Branko della Pece
    alias: [Branko]
    tipo: personaggio
    sottotitolo: "Il campione delle Prove del Guado"
    testo: "Un uomo della Pece largo come una porta, con la barba intrecciata nel filo di rame e un maglio da cunei sempre a portata di mano. Ha vinto le Prove del Guado nove anni di fila. La sera prima delle Prove beve acquavite di resina sulla riva e chiama parente chiunque si sieda accanto a lui."
    requisiti: []

  - id: ozzra
    nome: Ozzra
    tipo: personaggio
    sottotitolo: "La gigantessa degli Spacca-ossa"
    testo: "Una Spacca-ossa con il sangue degli ogre, alta quasi il doppio di un uomo, che la tribù ha mandato via dalla Palude Acquanera con un gruppo di ragazzi. Vive nelle grotte in cima al Gradone Rosso sopra Ghoran, e combatte con un pestello di pietra grosso quanto un'incudine."
    requisiti: [avventura.prove-guado >= 6]

  - id: ruk
    nome: Ruk
    tipo: personaggio
    sottotitolo: "Un ragazzo della banda di Ozzra"
    testo: "Un orco giovane degli Spacca-ossa, con la faccia larga dei ragazzi e una collana di lische sul petto. Ha seguito Ozzra fuori dalla palude, e parla un comune storto, una parola alla volta, aiutandosi con le mani."
    requisiti: [avventura.prove-guado >= 7]

  - id: acquarossa
    nome: Acquarossa
    tipo: luogo
    sottotitolo: "Il torrente del Gradone Rosso"
    testo: "Il torrente che scende dal Gradone Rosso verso le pozze di Ghoran, con l'acqua color ruggine per l'arenaria che si porta dietro. Esce dal Gradone per una gola stretta e fa le sue rapide fra due pareti di pietra, poi si allarga sui sassi del guado, a mezz'ora dal villaggio, prima di perdersi nel fango."
    requisiti: []

  - id: prove-del-guado
    nome: Prove del Guado
    tipo: cosa
    sottotitolo: "La gara dei clan di Ghoran"
    testo: "La gara che i clan di Ghoran corrono ogni anno al guado dell'Acquarossa, più vecchia del clan del Guado, che ne ha preso il nome. Sono tre prove, i cinghiali corazzati da portare nel recinto, la discesa delle rapide afferrando i nastri e il pino da abbattere sul torrente. Per tenerle servono almeno due nomi sulla tavoletta."
    requisiti: []
