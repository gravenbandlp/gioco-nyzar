# Avventura n. 4, «Le Prove del Guado» (docs/piano-avventure.md, da Ice Trials). Si apre dopo la quest di Ghoran
# (fazione.ghoran >= 15) e tutte le scene fuori dalla spedizione stanno presso il luogo `ghoran`.
# La pista avventura.prove-guado (0 → 10):
# - 0 → 1 `avv-prove-guado-due-nomi` (aggancio): Dunja del Guado cerca il secondo nome per le Prove del Guado.
# - 1 → 2 `avv-prove-guado-la-sera-prima`: la vigilia al guado con Branko della Pece. Il trucco della scrofa
#   (avv-prove-guado.trucco) apre una via più facile nella prima prova.
# - 2 → 3 `avv-prove-guado-i-cinghiali`: prima prova, i cinghiali corazzati nel recinto (vinta: .cinghiali).
# - 3 → 4 `avv-prove-guado-le-rapide`: seconda prova, la discesa delle rapide afferrando i nastri (vinta: .nastri).
# - 4 → 5 `avv-prove-guado-il-pino-rosso`: terza prova, l'abbattimento del pino (vinta: .albero).
# - 5 → 6 `avv-prove-guado-la-gigantessa`: Ozzra scende dal Gradone Rosso e porta via Branko ferito. La scure nella
#   spalla (.segno) apre una via al cuore, lo sguardo sulla gola (.tracce) una via all'ingresso.
# - 6 → 7 `avv-prove-guado-la-notte-alla-bilancia`: i clan sotto la bilancia, il nome di Ozzra, la strada (.tracce).
# - 7 → 8: la spedizione sulle terrazze del Gradone fino alla grotta di Ozzra (spedizione.yaml).
# - 8 → 9 `avv-prove-guado-giu-dal-gradone`: i ragazzi della banda presi dai clan (.orchi 1 liberi, 2 venduti al
#   Guado, 3 un anno di lavoro per la Pece).
# - 9 → 10 `avv-prove-guado-il-banchetto`: Branko ti dichiara vincitore e ti cede il maglio; la regola del nastro
#   (.regola 1 lo difendi tu, 2 corre chiunque, 3 il nastro a Dunja).
# Vantaggi in spedizione: .tracce (ingresso), .nastri (la gola), .cinghiali (il recinto di rovi e il cinghiale di
# Ozzra), .albero (la spaccatura), .ruk (l'arco della grotta, dalla svolta), .segno (il cuore).
# Canone: gli Spacca-ossa restano nella Palude Acquanera come vuole pista.tribu; Ozzra è una di loro, con sangue di
# ogre, mandata via dalla palude due inverni fa con sei ragazzi. Il Guado (il clan di Ostrav) prende il nome dal guado
# dell'Acquarossa, il torrente che scende dal Gradone Rosso verso le pozze, e le Prove sono più vecchie del clan.
# Nomi nuovi (glossario.yaml): Dunja, Branko della Pece, Ozzra, Ruk, l'Acquarossa, le Prove del Guado.
quality:
  - { id: avventura.prove-guado, immagine: icone/laurels-trophy, nome: "Le Prove del Guado", categoria: pista, descrizione: "A Ghoran i clan corrono ogni anno le Prove del Guado, e da nove anni le vince Branko della Pece. Quest'anno sulla tavoletta di Dunja c'è anche il tuo nome." }
  - { id: avv-prove-guado.trucco, nome: Il trucco della scrofa, categoria: stato, nascosta: true, descrizione: "Sai che i cinghiali delle Prove vanno dietro alla scrofa vecchia, e la scrofa dietro al fumo." }
  - { id: avv-prove-guado.cinghiali, nome: Hai vinto la prova dei cinghiali, categoria: stato, nascosta: true }
  - { id: avv-prove-guado.nastri, nome: Hai vinto la prova delle rapide, categoria: stato, nascosta: true }
  - { id: avv-prove-guado.albero, nome: Hai vinto la prova del pino, categoria: stato, nascosta: true }
  - { id: avv-prove-guado.segno, nome: La scure nella spalla di Ozzra, categoria: stato, nascosta: true }
  - { id: avv-prove-guado.tracce, nome: La strada di Ozzra, categoria: stato, nascosta: true, descrizione: "Sai da che parte è salita Ozzra, per il canalone di destra sopra la gola." }
  - { id: avv-prove-guado.svolta, nome: Hai incontrato Ruk, categoria: stato, nascosta: true }
  - { id: avv-prove-guado.ruk, nome: La fessura del fumo, categoria: stato, nascosta: true, descrizione: "Ruk ti ha detto della fessura da cui esce il fumo della grotta grande." }
  - { id: avv-prove-guado.orchi, nome: I ragazzi della banda, categoria: stato, nascosta: true, descrizione: "Che cosa è stato dei ragazzi della banda di Ozzra. 1 tornati alla palude, 2 venduti alla bilancia, 3 un anno di lavoro per la Pece." }
  - { id: avv-prove-guado.regola, nome: La regola del nastro, categoria: stato, nascosta: true, descrizione: "Che cosa hai deciso del nastro delle Prove. 1 lo difendi tu l'anno dopo, 2 corre chiunque scriva il suo nome, 3 il nastro e le Prove a Dunja." }

storylet:
  # ------------------------------------------------------------ 0 → 1 · l'aggancio
  - id: avv-prove-guado-due-nomi
    presso: ghoran
    immagine: ambientazione/ghoran
    titolo: Due nomi sulla tavoletta
    sommario: "Una ragazza del Guado cerca un secondo nome per le Prove. Il primo è lo stesso da nove anni."
    luogo: Ghoran, il mercato dei recinti
    area: superficie-fratturata
    requisiti: [avventura.prove-guado == 0, fazione.ghoran >= 15]
    testo: |
      Al mercato dei recinti, sotto la bilancia grande, una ragazza di diciassette anni ti sbarra la strada
      con una tavoletta di cera. Porta il sigillo verde del Guado cucito sulla spalla, e ha le dita sporche di
      cera fino alle nocche. Sopra di voi la bilancia pende da una trave annerita, e i suoi due piatti vuoti
      girano piano nel vento.

      «Sei l'occhio di Ragh, vero?» dice. «Io sono Dunja. Domani al guado dell'Acquarossa ci sono le Prove, e
      la regola vuole due nomi. Il primo è lo stesso da nove anni, il secondo non lo trovo e ho chiesto a
      tutti!»

      Sulla cera c'è inciso il nome di Branko della Pece, e sotto c'è il posto vuoto. Le lettere di Branko
      sono incise fondo e con cura, e sotto la cera è stata lisciata con il pollice per fare spazio.
      Appoggiato al palo della bilancia, Ostrav si gira l'anello di cera verde fra le dita e guarda le nuvole
      sopra il Gradone Rosso.

      «Il Guado ha tenuto le Prove finché pagava il premio» dice. «Quest'anno non lo paga, e le tiene questa
      ragazza a sue spese.»

      {conoscenze-della-strada Media} Ostrav non vuole pagare un premio che finisce sempre alla Pece, e se le
      Prove muoiono quest'anno nessuno potrà dargli la colpa.

      {origine fuggiasco-di-ghoran} Le Prove le guardavi dal recinto dei comprati. Correva chi aveva un clan,
      e dopo il fango del guado lo pulivi tu.
    opzioni:
      - testo: "Scrivere il tuo nome sotto quello di Branko"
        descrizione: "Lo stilo è legato alla tavoletta con uno spago. Dunja non molla la tavoletta nemmeno mentre scrivi."
        esito:
          titolo: Il secondo nome
          testo: |
            Incidi il tuo nome nella cera sotto quello di Branko, e lo stilo ci entra morbido perché la
            tavoletta è tiepida delle mani di Dunja. Dunja lo legge a voce alta due volte, la seconda per il
            mercato. Alla bilancia qualcuno ride e qualcun altro smette di ridere. Dunja ti dice che stasera
            la Pece accende il fuoco al guado, e che Branko ci sarà, perché c'è sempre.
          effetti: { avventura.prove-guado: 1 }
      - testo: "Chiedere a Ostrav, davanti a tutti, perché il Guado non paga più"
        descrizione: "Al mercato dei recinti un clan che non paga quello che deve si fa notare. Bisogna dirlo forte, e senza offendere."
        prova: { attributo: sociale, abilita: [persuasione, intimidire], difficolta: Media }
        successo:
          titolo: Il premio del Guado
          testo: |
            Lo chiedi forte, con la tavoletta di Dunja in mano, e intorno alla bilancia si fanno tutti
            attenti. Ostrav sorride come al mercato, poi si stacca dal palo e dice che quest'anno il premio lo
            paga il Guado, come una volta. Mentre lo dice l'anello di cera gli resta fermo fra le dita. Dunja
            ti guarda come se avessi spostato il Gradone. Scrivi il tuo nome sotto quello di Branko.
          pe: { persuasione: 3 }
          effetti: { avventura.prove-guado: 1, rep.ghoran: 0.5 }
        fallimento:
          titolo: Il mercante
          testo: |
            Lo chiedi forte, e Ostrav risponde più forte di te che il Guado paga quello che compra, e le Prove
            non le compra nessuno. Il mercato ride con lui. Dunja ti mette in mano lo stilo lo stesso, legato
            alla tavoletta con uno spago così corto che devi chinarti su di lei, e il tuo nome sotto quello di
            Branko lo scrivi con le orecchie calde.
          effetti: { avventura.prove-guado: 1, scandalo: 0.5 }
      - testo: "Scrivere il tuo nome intero, senza il segno dei comprati"
        descrizione: "Nei recinti i comprati firmano con un segno, sempre lo stesso. Chi l'ha visto fare lo riconosce."
        quando: [origine.fuggiasco-di-ghoran >= 1]
        esito:
          titolo: Il nome intero
          testo: |
            Prendi lo stilo e scrivi piano il tuo nome per intero sotto quello di Branko, e alla fine non
            aggiungi il segno dei comprati. La mano si ferma da sola dove di solito c'era il segno, e la devi
            spostare. Dunja non capisce perché ci metti tanto. Ostrav sì, e smette di girare l'anello.
          pe: { resilienza: 3 }
          effetti: { avventura.prove-guado: 1 }

  # ------------------------------------------------------------ 1 → 2 · la sera prima
  - id: avv-prove-guado-la-sera-prima
    presso: ghoran
    immagine: icone/campfire
    titolo: La sera prima
    sommario: "Al guado dell'Acquarossa la Pece accende il fuoco della vigilia. Branko della Pece beve da solo, come ogni anno."
    luogo: Ghoran, il guado dell'Acquarossa
    area: superficie-fratturata
    requisiti: [avventura.prove-guado == 1]
    testo: |
      Il guado dell'Acquarossa sta a mezz'ora dalle pozze, dove il torrente color ruggine scende dal Gradone
      Rosso e si allarga sui sassi. Il colore glielo dà l'arenaria che l'acqua si porta dietro, e i sassi
      della riva ne hanno una patina rossa fino al segno della piena. Sulla riva la Pece ha acceso un fuoco
      che fa il fumo nero della resina, e più in là c'è il recinto delle Prove con sei cinghiali corazzati che
      sbuffano contro le sbarre. Le sbarre sono pali di pino legati con la corda, e dove i cinghiali ci
      strofinano la corazza il legno è diventato liscio e chiaro.

      Davanti alle fiamme siede Branko della Pece con un maglio da cunei sul ginocchio. È largo come una porta
      e ha la barba intrecciata nel filo di rame. Il manico del maglio è nero di resina e consumato in due
      punti, dove le sue mani lo tengono da anni.

      «Parente» dice, e batte la mano sul sasso accanto al suo. «La sera prima di solito bevo da solo.
      Siediti, che stanotte non porta male.»

      Più su, sulle rapide, Dunja tende le corde dei nastri e conta i nodi a voce alta. Fino al fuoco la sua
      voce arriva a pezzi, coperta dal rumore dell'acqua.

      {addestrare-animali Media} Nel recinto i cinghiali non si muovono a caso. Quando si sposta la scrofa
      vecchia con l'orecchio tagliato gli altri le vanno dietro, e si fermano quando si ferma lei.
    opzioni:
      - testo: "Bere con Branko la sua acquavite di resina"
        descrizione: "La Pece la distilla con la resina delle torce. Brucia, e Branko la beve come acqua."
        prova: { attributo: fisico, abilita: resistenza, difficolta: Media }
        successo:
          titolo: La borraccia della Pece
          testo: |
            Bevete finché il fuoco si abbassa. L'acquavite sa di resina bruciata e ti lascia sulle labbra una
            pellicola che appiccica, e a un certo punto Branko ti racconta ridendo nella barba che i cinghiali
            vanno dietro alla scrofa vecchia e la scrofa va dietro al fumo della pece, sempre. «Domani usalo»
            dice, e ti passa la borraccia. «Nove volte ho vinto, e sempre contro dei ragazzi. Quest'anno
            voglio una gara vera, anche a costo di perderla.»
          pe: { resistenza: 3 }
          effetti: { avventura.prove-guado: 1, avv-prove-guado.trucco: 1 }
        fallimento:
          titolo: La riva che gira
          testo: |
            Alla terza sorsata la riva comincia a girare piano, e alla quinta non ti ricordi più come ti
            chiami. Ti svegli all'alba con la faccia sui sassi freddi e il sapore della resina ancora in gola.
            Del fuoco resta un cerchio di cenere grigia, e i ragazzi della Pece ti scavalcano per andare a
            prendere l'acqua.
          effetti: { avventura.prove-guado: 1, scandalo: 0.5 }
      - testo: "Restare al recinto a guardare i cinghiali"
        descrizione: "Sei bestie corazzate dalla Marea, che domani vanno portate dove non vogliono andare. Conviene sapere prima come ragionano."
        prova: { attributo: mentale, abilita: [natura, percezione], difficolta: Media }
        successo:
          titolo: La scrofa vecchia
          testo: |
            Li guardi fino a tardi con il mento sulle sbarre. Una ti passa a un palmo dalla faccia, e dalla
            sua corazza non viene il caldo che viene da una bestia viva. Quando il vento porta il fumo del
            fuoco nel recinto la scrofa vecchia alza il muso e ci va incontro, e gli altri cinque le vanno
            dietro senza pensarci. Dal fuoco lo vede anche Branko, che alza la borraccia verso di te.
          pe: { natura: 3 }
          effetti: { avventura.prove-guado: 1, avv-prove-guado.trucco: 1 }
        fallimento:
          titolo: La zanna fra le sbarre
          testo: |
            Ti avvicini troppo, e un cinghiale ti passa la zanna fra le sbarre e ti apre la manica con la
            pelle sotto. Il taglio sanguina meno di quanto dovrebbe, e prima di mattina fa la crosta grigia
            delle ferite della Marea.
          effetti: { avventura.prove-guado: 1, contaminazione: 0.5 }
      - testo: "Aiutare Dunja a tendere le corde delle rapide"
        descrizione: "Sei corde da una riva all'altra, sopra l'acqua che corre. Dunja le tende da sola da quando suo nonno non c'è più."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Media }
        successo:
          titolo: I conti del nonno
          testo: |
            Tieni le corde mentre Dunja fa i nodi, con l'acqua alle ginocchia, e lei parla tutto il tempo. La
            corda bagnata ti scivola fra le dita finché non impari a girartela intorno al polso. Il nonno
            teneva le Prove per il Guado, e nei suoi conti c'è scritto che i cinghiali seguono la scrofa
            vecchia, e la scrofa il fumo. «Non dirlo a Branko» dice, mentre stringe l'ultimo nodo. «Tanto lo
            sa già.»
          pe: { atletica: 3 }
          effetti: { avventura.prove-guado: 1, avv-prove-guado.trucco: 1 }
        fallimento:
          titolo: Il sasso liscio
          testo: |
            A metà torrente il piede ti scivola su un sasso liscio e vai sotto con la corda in mano. L'acqua
            dell'Acquarossa ti entra in bocca e sa di ferro. Dunja ti tira fuori ridendo, e il ginocchio ti fa
            male fino al mattino.
          effetti: { avventura.prove-guado: 1, ferite: 0.5 }
      - testo: "Andare a dormire sotto le gradinate del campo"
        descrizione: "Domani la giornata è lunga. C'è chi la sera prima dorme, e Branko non lo prende per un insulto."
        esito:
          titolo: Il sonno della vigilia
          testo: |
            Torni alle palafitte con la luna alta e dormi sotto le gradinate del campo, dove le torce sono
            spente. La terra lì sotto è battuta e asciutta, e le assi sopra di te scricchiolano quando passa
            il vento. Dal guado, nel sonno, ti arriva la voce di Branko che canta da solo una canzone della
            Pece.
          effetti: { avventura.prove-guado: 1 }
      - testo: "Riconoscere il taglio nell'orecchio della scrofa"
        descrizione: "Nei recinti di Ghoran l'orecchio si taglia alla bestia che guida la fila. Lo sa chi è stato in fila."
        quando: [origine.fuggiasco-di-ghoran >= 1]
        esito:
          titolo: La bestia che guida
          testo: |
            Il taglio a tacca nell'orecchio della scrofa è quello dei recinti, che si fa alla bestia che guida
            la fila. È vecchio e ha i bordi lisci della cicatrice, e l'hanno fatto con un colpo solo. Quando
            il vento porta dentro il fumo del fuoco lei ci va incontro, e gli altri le vanno dietro. Branko,
            dal fuoco, ti vede annuire da sol{o|a} e ride.
          pe: { addestrare-animali: 3 }
          effetti: { avventura.prove-guado: 1, avv-prove-guado.trucco: 1 }

  # ------------------------------------------------------------ 2 → 3 · la prima prova
  - id: avv-prove-guado-i-cinghiali
    presso: ghoran
    immagine: bestiario/cinghiale-crudele-mutato
    titolo: I cinghiali corazzati
    sommario: "La prima delle Prove è la più vecchia. Tre cinghiali corazzati da portare nel tuo recinto prima che Branko porti i suoi."
    luogo: Ghoran, la piana di fango del guado
    area: superficie-fratturata
    requisiti: [avventura.prove-guado == 2]
    testo: |
      All'alba tutti i clan sono sui sassi del guado, ognuno sulla sua riva con il suo segno cucito sul petto.
      Ragh siede su uno sgabello piantato nel fango, e accanto a lui Dunja tiene alta la tavoletta. Alle Prove
      non si portano armi, e la gente è venuta con le borracce e i bambini sulle spalle.

      La prima prova è la più vecchia. I sei cinghiali corazzati vengono sparsi sulla piana di fango, e ognuno
      dei due ne deve portare tre nel suo recinto. Hanno la pelle nera e le vene color acciaio sotto la
      cotenna. Sul dorso la cotenna si chiude in placche larghe una mano, e dove una placca sfrega sull'altra
      il bordo è consumato e lucido. Le mosche della piana girano intorno alla gente e ai bambini, e sui
      cinghiali non si posano.

      Branko si sputa nelle mani e parte per primo, senza fretta. Il fango gli fa un risucchio a ogni passo, e
      lui ci cammina sopra come sul selciato.

      {atletica Difficile} Un cinghiale corazzato pesa quanto un carro, e si può soltanto fargli credere che
      entrare nel recinto sia un'idea sua.
    opzioni:
      - testo: "Prenderli a spinte e a urla, uno alla volta"
        descrizione: "Un cinghiale si gira se gli urli davanti al muso e lo spingi sulla spalla. Bisogna farlo tre volte, e ogni volta con tutto il corpo."
        prova: { attributo: fisico, abilita: [atletica, rissa], difficolta: Difficile }
        successo:
          titolo: A spallate
          testo: |
            Ci metti tutta la mattina a forza di urla e di spallate, e il terzo cinghiale entra nel tuo
            recinto quando Branko ne ha ancora uno fuori. Hai la spalla indolenzita fino al collo e la camicia
            segnata dai bordi delle placche. Branko ride e ti alza il pollice nero di resina. Sulla riva della
            Pece fischiano, e il resto dei clan batte i piedi sui sassi.
          pe: { atletica: 3 }
          effetti: { avventura.prove-guado: 1, avv-prove-guado.cinghiali: 1 }
        fallimento:
          titolo: Sotto il cinghiale
          testo: |
            Il secondo cinghiale si gira quando non deve e ti passa sopra come sopra un'asse. Gli zoccoli ti
            spingono giù nel fango, e il fango che ti entra nelle orecchie copre le urla della riva. Quando ti
            rialzi Branko chiude il suo cancello, e Dunja incide una tacca sotto il suo nome.
          effetti: { avventura.prove-guado: 1, ferite: 0.5 }
      - testo: "Guidarli da pastore, senza toccarli"
        descrizione: "Una mandria va dove capisce di dover andare. Basta mettersi dalla parte giusta, e restarci."
        prova: { attributo: sociale, abilita: addestrare-animali, difficolta: Difficile }
        successo:
          titolo: Il pastore
          testo: |
            Ti metti sempre dalla parte da cui non devono andare, con le braccia larghe, e i cinghiali
            scivolano verso il tuo recinto come acqua in un canale. Non ne tocchi nemmeno uno, e alla fine hai
            le mani pulite e gli stivali neri di fango fino al ginocchio. Chiudi il cancello prima di Branko,
            che si ferma a guardarti con il terzo cinghiale ancora per l'orecchio.
          pe: { addestrare-animali: 3 }
          effetti: { avventura.prove-guado: 1, avv-prove-guado.cinghiali: 1 }
        fallimento:
          titolo: Dall'altra parte
          testo: |
            I cinghiali capiscono benissimo dove vuoi portarli, e vanno dall'altra parte. Uno si ferma in
            mezzo alla piana e si rotola nel fango con le zampe all'aria, e la corazza gli sbatte sui sassi.
            Branko chiude il cancello mentre tu ne hai ancora due a spasso sulla piana, e i ragazzi della Pece
            te li riportano ridendo.
          effetti: { avventura.prove-guado: 1, scandalo: 0.5 }
      - testo: "Portare la scrofa vecchia verso il fumo della Pece"
        descrizione: "La scrofa con l'orecchio tagliato va dove c'è fumo, e gli altri vanno dietro a lei. Sulla riva le torce della Pece fumano."
        requisiti: [avv-prove-guado.trucco >= 1]
        prova: { attributo: sociale, abilita: addestrare-animali, difficolta: Media }
        successo:
          titolo: La torcia bassa
          testo: |
            Prendi dal mucchio della Pece una torcia di stracci intrisi di pece e la tieni bassa davanti al
            muso della scrofa vecchia. Lei ti segue fino al tuo recinto con il naso nel fumo nero, e due
            cinghiali le vanno dietro. Branko, a metà piana, si ferma a guardare la torcia e ride così forte
            che deve appoggiarsi al suo cinghiale.
          pe: { addestrare-animali: 3 }
          effetti: { avventura.prove-guado: 1, avv-prove-guado.cinghiali: 1 }
        fallimento:
          titolo: Il vento che gira
          testo: |
            La scrofa segue il fumo, e il vento gira proprio allora. Il fumo della torcia si piega di colpo e
            scivola basso sul fango verso il recinto di Branko. I cinghiali ci entrano da soli in fila, e
            Branko chiude il cancello senza aver fatto niente e ti ringrazia con un inchino.
          effetti: { avventura.prove-guado: 1, scandalo: 0.5 }

  # ------------------------------------------------------------ 3 → 4 · la seconda prova
  - id: avv-prove-guado-le-rapide
    presso: ghoran
    immagine: ambientazione/gradone-rosso
    titolo: Le rapide dei nastri
    sommario: "Sei corde tese sopra le rapide dell'Acquarossa, e a ogni corda un nastro rosso. Si scende sull'otre e si prendono passando."
    luogo: Ghoran, le rapide dell'Acquarossa
    area: superficie-fratturata
    requisiti: [avventura.prove-guado == 3]
    testo: |
      A metà mattina i clan risalgono la riva fino alle rapide, dove l'Acquarossa scende a salti fra due
      pareti di arenaria. La pietra è rossa e tenera, e l'acqua ci ha scavato conche lisce dove la schiuma
      gira prima di ripartire. Dunja ha teso sei corde da una riva all'altra, e da ognuna pende un nastro
      rosso. Si scende sull'otre, una pelle di capra gonfia, e vince chi porta più nastri al guado.

      Branko si siede sul suo otre come su una panca e parte per primo. A ogni corda alza la mano senza
      guardare e prende il nastro.

      Dunja ti porge un otre che puzza di capra e ti dice che le corde basse stanno sopra l'acqua profonda e
      quelle alte sopra i sassi. L'otre è cucito alle zampe con lo spago incatramato, e quando lo stringi la
      pelle cede appena e torna su.

      {natura Media} Dove l'acqua fa la schiena liscia sotto c'è un sasso, e dove fa la schiuma c'è il fondo.
    opzioni:
      - testo: "Scendere in piedi sull'otre"
        descrizione: "In piedi si arriva alle corde alte. Si cade anche più facilmente."
        prova: { attributo: fisico, abilita: acrobazia, difficolta: Difficile }
        successo:
          titolo: In piedi
          testo: |
            Ti tiri in piedi sull'otre al primo salto e ci resti, con le ginocchia molli e le braccia larghe,
            e le corde alte ti passano davanti alla faccia una dopo l'altra. Fra le pareti l'acqua fa un
            rumore tale che sulla riva vedi i clan gridare senza sentirli. Arrivi al guado con sei nastri
            stretti nel pugno. Branko ne ha cinque, e te lo dice prima ancora di uscire dall'acqua.
          pe: { acrobazia: 3 }
          effetti: { avventura.prove-guado: 1, avv-prove-guado.nastri: 1 }
        fallimento:
          titolo: Il sasso con la spalla
          testo: |
            Al terzo salto l'otre ti scappa da sotto i piedi e prendi il sasso con la spalla. L'arenaria è più
            dura di come sembra, e il braccio da quella parte non si alza più sopra la testa. Arrivi al guado
            a nuoto con due nastri soltanto, mentre l'otre ti galleggia davanti come un cane morto.
          effetti: { avventura.prove-guado: 1, ferite: 0.5 }
      - testo: "Leggere l'acqua e scegliere ogni salto"
        descrizione: "Le rapide sono sempre le stesse. Chi le guarda prima di scendere sa dove l'acqua porta l'otre sotto le corde."
        prova: { attributo: mentale, abilita: [natura, percezione], difficolta: Difficile }
        successo:
          titolo: La schiena liscia
          testo: |
            Prima di scendere guardi l'acqua a lungo, finché Dunja tossisce. La schiuma si apre e si richiude
            sempre negli stessi punti, salto dopo salto. Poi ti lasci portare, e l'otre passa sotto ogni corda
            proprio dove pende il nastro. Arrivi al guado con sei nastri, e Branko, che ne ha cinque, ti
            chiede chi ti ha insegnato a leggere l'Acquarossa.
          pe: { natura: 3 }
          effetti: { avventura.prove-guado: 1, avv-prove-guado.nastri: 1 }
        fallimento:
          titolo: L'otre che gira
          testo: |
            Scegli la corrente sbagliata al secondo salto, e l'otre gira su se stesso per tutto il resto della
            discesa. Le pareti rosse ti passano davanti una volta a ogni giro, e il cielo con loro. Arrivi al
            guado con un nastro solo, e con la testa che continua a girare anche dopo.
          effetti: { avventura.prove-guado: 1, tormento: 0.5 }
      - testo: "Restare sull'acqua profonda e prendere le corde basse"
        descrizione: "Le corde basse sono facili. Sotto l'ultima però c'è il salto grande, e il nastro pende proprio sopra."
        prova: { attributo: fisico, abilita: atletica, difficolta: Media }
        successo:
          titolo: L'ultimo nastro
          testo: |
            Prendi le corde basse una dopo l'altra, con l'acqua fonda sotto la pancia, e all'ultimo salto ti
            butti in avanti e prendi il nastro insieme a un sasso sul ginocchio. Arrivi al guado con sei
            nastri, zoppicando. Branko ne ha cinque, e viene a guardarti il ginocchio. Il sasso ti ha aperto
            la pelle sopra la rotula, e finché resti nell'acqua rossa del torrente non si vede quanto sangue
            perdi.
          pe: { atletica: 3 }
          effetti: { avventura.prove-guado: 1, avv-prove-guado.nastri: 1, ferite: 0.5 }
        fallimento:
          titolo: Il salto grande
          testo: |
            Il salto grande ti prende di traverso e ti porta sotto. Sott'acqua il torrente fa un rombo basso e
            i sassi del fondo ti rotolano contro le gambe, e quando riemergi la corda è già passata. Arrivi al
            guado con quattro nastri e l'acqua nelle orecchie, mentre Branko ne alza cinque.
          effetti: { avventura.prove-guado: 1, ferite: 0.5 }

  # ------------------------------------------------------------ 4 → 5 · la terza prova
  - id: avv-prove-guado-il-pino-rosso
    presso: ghoran
    immagine: icone/wood-axe
    titolo: Il pino rosso
    sommario: "La terza prova è un albero morto sulla riva. Va fatto cadere sul torrente, perché diventi la passerella del guado per un anno."
    luogo: Ghoran, la riva del guado
    area: superficie-fratturata
    requisiti: [avventura.prove-guado == 4]
    testo: |
      Il terzo albero delle Prove è un pino rosso morto in piedi sulla riva del guado, e la corteccia gli si
      stacca a placche che lasciano vedere il legno secco e chiaro. Chi lo abbatte lo deve far cadere di
      traverso sul torrente, perché farà da passerella fino alle Prove dell'anno dopo al posto di quella
      marcita. La passerella vecchia è ancora lì poco più in basso, un tronco grigio spaccato a metà e verde
      di muschio dove tocca l'acqua.

      Davanti a Ragh due scuri da boscaiolo sono piantate in un ceppo. Branko ne prende una e va dal lato del
      pino che guarda il torrente, e a te resta l'altro.

      «Vince chi lo butta giù di traverso sul torrente» dice Ragh, e batte due volte le nocche sul ginocchio.

      {armi-da-mischia Facile} La scure da boscaiolo ha il manico lungo e la testa stretta. Si tira dall'anca
      e si lascia cadere da sola, e il filo rifatto da poco con la cote brilla per un dito lungo il bordo.
    opzioni:
      - testo: "Tagliare più in fretta di lui"
        descrizione: "Due scuri sullo stesso tronco. Chi arriva prima al cuore del legno decide da che parte cade."
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Difficile }
        successo:
          titolo: Il tonfo
          testo: |
            Tagli senza alzare la testa, con il manico che ti scotta nelle mani, e dall'altra parte senti il
            colpo di Branko rallentare prima del tuo. Le schegge ti saltano contro la faccia e sanno di resina
            vecchia. Il pino si piega dalla tua parte e cade di traverso sul torrente, con un tonfo che bagna
            mezza riva. La Pece urla, e Branko si siede sul ceppo ridendo.
          pe: { atletica: 3 }
          effetti: { avventura.prove-guado: 1, avv-prove-guado.albero: 1 }
        fallimento:
          titolo: Le vesciche
          testo: |
            A metà lavoro le mani ti si riempiono di vesciche e il colpo si fa corto. Le vesciche si rompono
            sul manico, e il manico ti gira nelle mani a ogni colpo. Il pino cade dalla parte di Branko, di
            traverso sul torrente come vuole la regola, e lui ci sale sopra per primo e ti tende la mano.
          effetti: { avventura.prove-guado: 1, ferite: 0.5 }
      - testo: "Fare la tacca giusta e lasciar lavorare il pino"
        descrizione: "Un albero morto cade dalla parte dove pende. Se la tacca è giusta, basta poco."
        prova: { attributo: mentale, abilita: [natura, percezione], difficolta: Difficile }
        successo:
          titolo: La tacca bassa
          testo: |
            Giri intorno al pino due volte prima di toccarlo, e lo trovi già piegato verso l'acqua di un
            palmo. Dal lato del torrente le radici sono scoperte e marce, e il peso del tronco tira da quella
            parte. Fai lì la tacca bassa e tagli piano dall'altra parte. Quando Branko alza la scure per il
            colpo buono il pino è già in aria, e cade dritto sul torrente.
          pe: { natura: 3 }
          effetti: { avventura.prove-guado: 1, avv-prove-guado.albero: 1 }
        fallimento:
          titolo: Lungo la riva
          testo: |
            Leggi il pino al contrario e fai la tacca dalla parte sbagliata. Il pino gira su se stesso e cade
            lungo la riva, sopra il recinto delle Prove, con un rumore di pali spezzati. I clan ridono per
            tutto il tempo che serve a Branko per spostarlo con le funi e farlo rotolare in acqua.
          effetti: { avventura.prove-guado: 1, scandalo: 0.5 }
      - testo: "Tagliare con calma, un colpo alla volta"
        descrizione: "Colpi lenti e precisi, come si spacca la legna d'inverno. Ci vuole il doppio del tempo, e tutto il pomeriggio di braccia."
        costo: 2
        prova: { attributo: fisico, abilita: armi-da-mischia, difficolta: Media }
        successo:
          titolo: Un colpo nel colpo
          testo: |
            Tagli con calma, ogni colpo nel solco di quello prima, mentre dall'altra parte Branko si stanca a
            forza di correre. La scure stacca ogni volta una scheggia pulita larga un palmo. Il tuo ultimo
            colpo arriva quando lui si ferma ad asciugarsi la fronte, e il pino cade sul torrente dalla tua
            parte.
          pe: { armi-da-mischia: 3 }
          effetti: { avventura.prove-guado: 1, avv-prove-guado.albero: 1 }
        fallimento:
          titolo: Mezzo palmo
          testo: |
            Tagli con calma, e Branko taglia più in fretta. Il pino cade sul torrente dalla sua parte mentre a
            te manca ancora mezzo palmo, e una scheggia ti è entrata nel palmo della mano. È lunga quanto
            un'unghia e ha il rosso scuro del legno vecchio.
          effetti: { avventura.prove-guado: 1, ferite: 0.5 }

  # ------------------------------------------------------------ 5 → 6 · la gigantessa al guado
  - id: avv-prove-guado-la-gigantessa
    presso: ghoran
    immagine: fazioni/tribu-spacca-ossa
    titolo: La gigantessa al guado
    sommario: "Al tramonto, mentre Dunja legge i conti delle Prove, dal Gradone Rosso scende una gigantessa degli Spacca-ossa."
    luogo: Ghoran, il guado dell'Acquarossa al tramonto
    area: superficie-fratturata
    requisiti: [avventura.prove-guado == 5]
    testo: |
      Al tramonto i clan sono scesi sui sassi per sentire chi ha vinto. Dunja è in piedi sul tronco nuovo con
      la tavoletta, e Branko le sta accanto con la giubba slacciata per il nastro. Come vuole la regola, le
      armi sono ammucchiate sotto una pelle accanto al fuoco della Pece.

      Il primo a sentirla è un cane, che si mette a guaire. Poco dopo i sassi piccoli della riva battono fra
      loro a colpi lenti. Poi dalla gola dell'Acquarossa scendono cinque cinghiali corazzati con un orco
      giovane in groppa a ognuno. Dietro di loro, a piedi nel torrente, viene una donna alta quasi il doppio
      di un uomo con un pestello di pietra grosso quanto un'incudine. L'acqua che a te arriverebbe al
      ginocchio a lei bagna appena le caviglie.

      Sfonda il recinto delle Prove con un colpo solo, e i cinghiali della prima prova le corrono dietro.
      Branko le va incontro a mani nude per tenerla lontana da Dunja, e il pestello gli piega la gamba dalla
      parte sbagliata. Il rumore dell'osso si sente fino all'altra riva. Lei si carica Branko sulla spalla e
      risale verso il Gradone, mentre due orchi fanno muro sul guado con i cinghiali.

      {intimidire Media} Gli orchi della banda sono ragazzi e hanno più paura di lei che di te. Quello più
      vicino si tiene alla cotenna del cinghiale con tutte e due le mani e continua a voltarsi verso la gola.
    opzioni:
      - testo: "Prendere l'arma dal mucchio e fare muro anche tu"
        descrizione: "Due ragazzi su due cinghiali corazzati tengono il guado. Gli altri salgono dietro a lei."
        combattimento: avv-prove-guado-la-retroguardia
        vittoria:
          titolo: Il guado tenuto
          testo: |
            Il secondo orco cade dal cinghiale nell'acqua e risale la riva a quattro zampe, e il cinghiale
            scappa senza di lui. Sul guado nessun altro è stato preso. La gigantessa però è già in cima alla
            gola con Branko sulla spalla, e non si volta. Contro il cielo del tramonto la gamba di Branko le
            pende sulla schiena con un angolo che una gamba non fa.
          effetti: { avventura.prove-guado: 1, rep.ghoran: 0.5 }
        sconfitta:
          titolo: Gli zoccoli
          testo: |
            Un cinghiale ti passa sopra nel torrente e ti tiene sott'acqua. Con la faccia sul fondo senti i
            sassi battere fra loro a ogni passo di lei, sempre più lontano. Quando riemergi la retroguardia è
            già sparita su per la gola dietro alla gigantessa, e Gedda ti tira fuori per il bavero.
          effetti: { avventura.prove-guado: 1, tormento: 0.5 }
      - testo: "Tirarle dietro la scure del pino"
        descrizione: "La scure da boscaiolo è ancora piantata nel ceppo. Lei sale lenta, con Branko sulla spalla, e ti volta la schiena."
        prova: { attributo: fisico, abilita: [armi-da-distanza, armi-da-mischia], difficolta: Difficile }
        successo:
          titolo: La scure nella spalla
          testo: |
            Strappi la scure dal ceppo e la tiri con tutte e due le mani. La scure le entra nella spalla
            sinistra proprio sotto Branko, e lei barcolla di un passo. Si volta a guardarti. Con la mano
            libera si strappa la scure dalla spalla e la butta nel torrente, senza fermarsi. La lama che cade
            in acqua è sporca di sangue fino all'occhio.
          pe: { armi-da-distanza: 3 }
          effetti: { avventura.prove-guado: 1, avv-prove-guado.segno: 1 }
        fallimento:
          titolo: La scure nel torrente
          testo: |
            La scure ti scivola dalle mani bagnate e gira in aria, e finisce nel torrente a due passi da te.
            Il manico è ancora viscido della resina del pino. Dalla riva qualcuno del Guado ride, poi smette,
            perché la gigantessa è già in cima alla gola.
          effetti: { avventura.prove-guado: 1, scandalo: 0.5 }
      - testo: "Portare via dal guado Dunja e i bambini"
        descrizione: "I cinghiali scendono sul guado di corsa, e sul tronco ci sono Dunja e i figli della Pece venuti a vedere il nastro."
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Media }
        successo:
          titolo: Oltre il fuoco
          testo: |
            Prendi Dunja per la cintura e due bambini per il collo della giubba, e li porti oltre il fuoco
            della Pece mentre i cinghiali sfondano il tronco dove stavano. Alle tue spalle senti la corteccia
            schiantarsi sotto gli zoccoli. Quando ti volti la gigantessa è in cima alla gola, e Dunja tiene
            ancora stretta la tavoletta.
          pe: { atletica: 3 }
          effetti: { avventura.prove-guado: 1, rep.ghoran: 0.5 }
        fallimento:
          titolo: Fra i sassi
          testo: |
            Prendi Dunja per la cintura, e un cinghiale ti prende di fianco mentre la tiri giù dal tronco. La
            placca della sua spalla ti batte sulle costole con un colpo sordo. Rotolate tutti e due fra i
            sassi. Quando ti rialzi la gigantessa è già in cima alla gola.
          effetti: { avventura.prove-guado: 1, ferite: 0.5 }
      - testo: "Guardare dove sale, e da che parte"
        descrizione: "La gola dell'Acquarossa ha più di un'uscita verso le terrazze. Chi vede quale prende sa da dove salire domani."
        prova: { attributo: mentale, abilita: percezione, difficolta: Media }
        successo:
          titolo: Il canalone di destra
          testo: |
            Non la perdi d'occhio un momento, e contro il cielo del tramonto la sua sagoma ha sulla spalla la
            gobba in più di Branko. In cima alla gola lascia il torrente e prende a destra, per un canalone di
            sabbia rossa, e la vedi ricomparire sulla seconda terrazza, piccola, prima che il buio la copra.
            Ti segni il canalone con un sasso sul bordo del tronco.
          pe: { percezione: 3 }
          effetti: { avventura.prove-guado: 1, avv-prove-guado.tracce: 1 }
        fallimento:
          titolo: La polvere
          testo: |
            La segui con gli occhi finché la polvere dei cinghiali non copre tutta la gola. La polvere è rossa
            come l'acqua del torrente e resta sospesa nella luce del tramonto anche quando gli zoccoli non si
            sentono più. Quando si posa lei non c'è più, e sai soltanto che è salita.
          effetti: { avventura.prove-guado: 1, tormento: 0.5 }

  # ------------------------------------------------------------ 6 → 7 · la notte alla bilancia
  - id: avv-prove-guado-la-notte-alla-bilancia
    presso: ghoran
    immagine: ambientazione/ghoran
    titolo: La notte alla bilancia
    sommario: "I clan si riuniscono sotto la bilancia con le torce. Ostrav dà un nome alla gigantessa, e Ragh guarda il suo occhio."
    luogo: Ghoran, la bilancia del mercato dei recinti
    area: superficie-fratturata
    requisiti: [avventura.prove-guado == 6]
    testo: |
      Di notte i clan si riuniscono con le torce sotto la bilancia del mercato, e nessuno si siede. I due
      piatti pendono dalla trave con le loro catene, e il fondo è consumato al centro dai piedi della merce
      che ci è salita. Gedda della Pece mastica resina e vuole salire al Gradone subito con tutta la Pece.
      Ostrav le risponde che sulle terrazze i sentieri sono larghi un piede e cento torce si vedono da
      lontano.

      È lui a dare un nome alla gigantessa. «Si chiama Ozzra. Malvo l'anguillaio dice che gli Spacca-ossa
      l'hanno cacciata dalla palude due inverni fa con sei ragazzi della tribù. Da allora ai recinti
      spariscono capre e maiali, e ogni clan ha dato la colpa a quello accanto.»

      Ragh batte due volte le nocche sulla trave. «Al Gradone sale uno solo, e poi torna a dirci che cosa ha
      visto» dice, e guarda te.

      Dunja è seduta sul piatto vuoto con la tavoletta in grembo e passa il dito sui due nomi. Il piatto
      oscilla appena sotto di lei, e la catena cigola piano.

      {empatia Media} La ragazza si dà la colpa di quello che è successo a Branko, perché le Prove le ha
      volute lei. Il dito si ferma ogni volta sul nome di lui.
    opzioni:
      - testo: "Farti dire dai cacciatori del Guado dove sparivano le bestie"
        descrizione: "Il Guado tiene i cani da presa e conosce ogni sentiero dei fuggiaschi. Le capre sparite, se le contavano, sanno anche da dove."
        prova: { attributo: sociale, abilita: [conoscenze-della-strada, persuasione], difficolta: Media }
        successo:
          titolo: La fila di sassi
          testo: |
            Il capo dei cacciatori ci pensa a lungo, poi stende sul fango una corda e ci mette sopra un sasso
            per ogni recinto rimasto vuoto. Posa i sassi senza fermarsi a contare, perché quelle bestie le ha
            contate per due inverni. I sassi fanno una fila, e la fila sale lungo l'Acquarossa fino a un
            canalone di sabbia rossa sopra la gola.
          pe: { conoscenze-della-strada: 3 }
          effetti: { avventura.prove-guado: 1, avv-prove-guado.tracce: 1 }
        fallimento:
          titolo: La domanda storta
          testo: |
            I cacciatori ti guardano storto, perché a chiedere dove sparivano le capre sembra che tu chieda
            chi le ha rubate. Il più vecchio smette di masticare e non ti toglie gli occhi di dosso. Ostrav li
            manda a dormire prima che rispondano.
          effetti: { avventura.prove-guado: 1, scandalo: 0.5 }
      - testo: "Tornare al guado con una torcia e leggere le impronte"
        descrizione: "Le orme dei cinghiali sono ancora fresche nel fango, e quelle di lei sono profonde un palmo."
        prova: { attributo: mentale, abilita: [natura, percezione], difficolta: Media }
        successo:
          titolo: Il piede sinistro
          testo: |
            Al guado le impronte di Ozzra sono buche nel fango, una ogni due passi tuoi, e quella del piede
            sinistro è più profonda, perché Branko lo porta da quella parte. Ci si è raccolta l'acqua del
            torrente, e alla luce della torcia ogni buca è una pozza rossa lunga quanto il tuo braccio. Segui
            le impronte fino all'imbocco della gola, dove lasciano il torrente e prendono a destra, per un
            canalone di sabbia rossa.
          pe: { natura: 3 }
          effetti: { avventura.prove-guado: 1, avv-prove-guado.tracce: 1 }
        fallimento:
          titolo: La torcia spenta
          testo: |
            Nel buio scivoli sui sassi del guado e finisci nel torrente con la torcia. La pece sfrigola
            nell'acqua e manda un fumo che ti brucia gli occhi. Quando riesci a riaccenderla, l'acqua ha già
            cancellato le impronte della riva.
          effetti: { avventura.prove-guado: 1, ferite: 0.5 }
      - testo: "Farti preparare da Oska per la salita"
        descrizione: "Oska stasera ha già fasciato tre gambe. Per quella che sale ha un vasetto di grasso e un rotolo di tela."
        esito:
          titolo: Il vasetto di Oska
          testo: |
            Senza chiederti niente, nemmeno le monete, Oska ti mette in mano un rotolo di bende di vela e un
            vasetto di coccio con un grasso che odora di sego e di erbe amare. «Branko lo ricucio io» dice.
            «Tu riportalo giù intero, che la gamba è già abbastanza.»
          effetti: { avventura.prove-guado: 1, unguento: 1, bende: 1 }
      - testo: "Dire ai clan da che parte salivano i fuggiaschi"
        descrizione: "Nei recinti si sapeva da che parte salivano quelli che scappavano, e dove i cani del Guado li perdevano."
        quando: [origine.fuggiasco-di-ghoran >= 1]
        esito:
          titolo: La strada dei fuggiaschi
          testo: |
            Lo dici davanti a tutti, sotto la bilancia. Chi scappava da Ghoran saliva per l'Acquarossa, perché
            l'acqua confonde i cani, e in cima alla gola prendeva il canalone di destra, l'unico che porta
            alle terrazze senza passare dal torrente. Mentre parli nessuno ti interrompe, e si sente soltanto
            la pece delle torce che crepita. Ostrav ti guarda il polso, e il capo dei cacciatori annuisce
            piano.
          pe: { resilienza: 3 }
          effetti: { avventura.prove-guado: 1, avv-prove-guado.tracce: 1 }

  # ------------------------------------------------------------ 8 → 9 · giù dal Gradone
  - id: avv-prove-guado-giu-dal-gradone
    presso: ghoran
    immagine: ambientazione/ghoran
    titolo: Giù dal Gradone
    sommario: "Al guado Oska rimette a posto la gamba di Branko. I cacciatori del Guado scendono con quattro ragazzi della banda legati alla stessa corda."
    luogo: Ghoran, il guado dell'Acquarossa
    area: superficie-fratturata
    requisiti: [avventura.prove-guado == 8]
    testo: |
      Al guado Oska rimette a posto la gamba di Branko sul tronco nuovo, e Branko urla una volta sola prima di
      chiedere da bere. Oska gli lega la gamba fra due stecche di pino con le bende di vela tirate strette.
      Dunja gli tiene la mano e non molla la tavoletta.

      Dietro di voi scendono i cacciatori del Guado con quattro ragazzi della banda legati per il collo alla
      stessa corda, presi mentre scappavano verso la palude. La corda è di canapa grossa con un nodo a ogni
      collo che si stringe se qualcuno tira, e i ragazzi piegano la testa verso il compagno per lasciarla
      lenta. Li fanno inginocchiare sui sassi. Ostrav arriva dalla passerella e li guarda uno per uno come
      guarda i comprati al mercato.

      «Ci hanno mangiato capre e maiali per due inverni» dice. «Quattro ragazzi sani valgono di più, e li
      hanno presi i miei cacciatori.»

      Gedda sputa la resina sui sassi. Ragh batte due volte le nocche sul ginocchio e aspetta che parli il suo
      occhio.

      {politica-ed-economia Media} Al mercato dei recinti quattro orchi giovani ripagano tutte le capre
      sparite, e lo sanno sia il Guado che la Pece.

      {origine fuggiasco-di-ghoran} Il più piccolo tiene gli occhi bassi e le spalle curve come insegnano nei
      recinti, e le tue spalle stanno facendo lo stesso.
    opzioni:
      - testo: "Lasciarli tornare alla palude"
        descrizione: "Sono ragazzi, e la gigantessa li ha portati via da casa. A Ghoran però le capre si pagano, e i clan se ne ricorderanno."
        esito:
          titolo: La corda tagliata
          testo: |
            Dici che i ragazzi tornano alla palude e tagli tu la corda, nodo per nodo. La canapa è bagnata e
            dura, e il coltello ci mette tre colpi per ogni nodo. Ostrav ride senza allegria. Ragh batte le
            nocche una volta sola, che a Ghoran vuol dire *così sia*, e i quattro risalgono la riva di corsa
            senza voltarsi. Per qualche giorno, sulle passerelle, chi ha perso una capra non ti saluta.
          imposta: { avv-prove-guado.orchi: 1 }
          effetti: { avventura.prove-guado: 1, rep.ghoran: -0.5 }
      - testo: "Lasciare che il Guado li porti alla bilancia"
        descrizione: "A Ghoran la merce si pesa. I clan riavranno le loro capre, e tu una parte del prezzo."
        esito:
          titolo: Sul piatto
          testo: |
            Fai un cenno a Ostrav, e lui lo fa ai cacciatori. La sera dopo i quattro salgono sulla bilancia
            del mercato uno alla volta, e il vecchio della porta scrive il loro peso sulla cera. Sotto ognuno
            la catena del piatto cigola, e sotto l'ultimo quasi non si sente. Ostrav ti manda la tua parte in
            una borsa con il sigillo verde. Il più piccolo, sul piatto, cercava te con gli occhi.
          imposta: { avv-prove-guado.orchi: 2 }
          effetti: { avventura.prove-guado: 1, monete: 40, rep.ghoran: 0.5, tormento: 0.5 }
      - testo: "Farli lavorare per la Pece fino alle Prove dell'anno prossimo"
        descrizione: "È la legge vecchia di Ghoran. Chi toglie qualcosa a un clan lo rende con le mani, e quando ha reso se ne va."
        esito:
          titolo: Un anno di torce
          testo: |
            Dici che lavoreranno per la Pece fino alle Prove dell'anno prossimo per ripagare le capre, e che
            poi saranno liberi. Gedda ci pensa masticando, poi annuisce. Ostrav dice che un anno di lavoro
            vale meno del prezzo, e Ragh batte le nocche due volte sopra la sua voce. I cacciatori sciolgono
            la corda, e sul collo dei quattro resta un segno rosso largo un dito.
          imposta: { avv-prove-guado.orchi: 3 }
          effetti: { avventura.prove-guado: 1, rep.ghoran: 0.5 }
      - testo: "Dire ai clan che cosa costa una corda al collo"
        descrizione: "Su una corda così ci sei stat{o|a} anche tu, e i clan lo sanno. Puoi dirlo con meno parole di chiunque altro."
        quando: [origine.fuggiasco-di-ghoran >= 1]
        esito:
          titolo: Il polso in vista
          testo: |
            Ti metti accanto al più piccolo, con il polso in vista, e dici soltanto che la corda la tagli tu.
            Tutti guardano la riga chiara sul tuo polso, e poi il segno rosso che la corda ha lasciato sul
            collo del ragazzo. Nessuno ti ferma. Ragh batte le nocche una volta sola, che a Ghoran vuol dire
            *così sia*, e i quattro risalgono la riva di corsa. Per qualche giorno chi ha perso una capra non
            ti saluta, e Tibbo, dalla riva della Pece, sì.
          pe: { resilienza: 3 }
          imposta: { avv-prove-guado.orchi: 1 }
          effetti: { avventura.prove-guado: 1, rep.ghoran: -0.5 }

  # ------------------------------------------------------------ 9 → 10 · il banchetto
  - id: avv-prove-guado-il-banchetto
    presso: ghoran
    immagine: icone/laurels-trophy
    titolo: Il banchetto del Guado
    sommario: "Sul guado si fa il banchetto delle Prove, e Branko si fa tirare in piedi per dire chi ha vinto."
    luogo: Ghoran, il guado dell'Acquarossa di sera
    area: superficie-fratturata
    requisiti: [avventura.prove-guado == 9]
    testo: |
      Il banchetto si fa la sera dopo sul guado, con i fuochi sulle due rive e il pino delle Prove in mezzo
      come una tavola. La Pece ha arrostito il cinghiale corazzato che non è tornato giù dal Gradone, e il
      Guado ha portato l'acquavite. La corazza l'hanno staccata a colpi di cuneo e ammucchiata accanto al
      fuoco, e i bambini ci battono sopra con i bastoni per sentirla suonare. I clan siedono mescolati sui
      sassi. Accanto a Dunja c'è la borsa del premio, riempita quest'anno da tutti i clan.

      A metà sera Branko si fa tirare in piedi da due della Pece, con la gamba steccata e il maglio in mano.

      «Nove volte ho vinto io, contro dei ragazzi» dice. «Quest'anno vince chi è tornato giù dal Gradone.» Ti
      mette in mano il maglio. «E questo lo tieni tu, che io per un anno corro con le stampelle.»

      Dunja incide il tuo nome sulla tavoletta sopra quello di Branko e resta con lo stilo alzato. Il nastro
      delle Prove ha una regola sola e la decide chi vince.

      {galateo Media} Ragh non beve e tace da tutta la sera. Aspetta di sapere che cosa farai del nastro,
      perché i clan copiano per un anno quello che fa il campione.

      {origine fuggiasco-di-ghoran} Una volta i comprati versavano l'acquavite e bevevano gli avanzi. Stasera
      la tazza te la riempie fino all'orlo Gedda della Pece.
    opzioni:
      - testo: "Tenere il nastro e difenderlo l'anno prossimo"
        descrizione: "Il campione delle Prove si iscrive per primo l'anno dopo, e tutti sanno contro chi correre."
        esito:
          titolo: Il primo nome
          testo: |
            Dici che l'anno prossimo il primo nome sulla tavoletta sarà il tuo, e che chi lo vuole può venire
            a prenderlo. Branko ride così forte che i due della Pece devono tenerlo in piedi. Prima di
            mezzanotte sulla tavoletta di Dunja ci sono già tre nomi di ragazzi per l'anno dopo. Lei li ha
            incisi storti, perché glieli gridavano tutti insieme.
          imposta: { avv-prove-guado.regola: 1 }
          effetti: { avventura.prove-guado: 1, oggetto.avv-prove-guado-maglio-di-branko: 1, monete: 50, rep.ghoran: 1 }
      - testo: "Dire che l'anno prossimo corre chiunque scriva il suo nome"
        descrizione: "Un comprato, un forestiero, una gigantessa della palude. Dunja dice che le Prove sono nate prima dei clan, quando il nastro non chiedeva a nessuno da dove veniva."
        esito:
          titolo: Chiunque
          testo: |
            Lo dici forte, perché lo sentano tutte e due le rive. Per un po' si sentono soltanto i fuochi che
            scoppiettano. Ostrav si alza e chiede se allora può correre anche la sua merce, e tu gli rispondi
            di sì, la sua per prima. Ragh lo guarda a lungo, poi batte le nocche due volte. Dunja scrive la
            regola sulla cera, sotto il tuo nome, con le lettere più grandi che le riescono.
          imposta: { avv-prove-guado.regola: 2 }
          effetti: { avventura.prove-guado: 1, oggetto.avv-prove-guado-maglio-di-branko: 1, monete: 50, rep.ghoran: 0.5 }
      - testo: "Legare il nastro al polso di Dunja"
        descrizione: "Quest'anno le Prove le ha tenute in vita lei con la sua cera e le sue corde. Il nastro può andare anche a chi le fa correre."
        esito:
          titolo: La padrona delle Prove
          testo: |
            Ti levi il nastro dal collo e lo leghi al polso di Dunja, davanti alle due rive, e lei diventa
            rossa fino alla radice dei capelli. Il nastro è stinto dall'acqua delle rapide e le fa tre giri
            intorno al polso. Ragh batte le nocche due volte e dice che da stasera le Prove sono sue e di
            nessun clan. Ostrav, per una volta, non trova niente da dire.
          imposta: { avv-prove-guado.regola: 3 }
          effetti: { avventura.prove-guado: 1, oggetto.avv-prove-guado-maglio-di-branko: 1, monete: 50, rep.ghoran: 0.5 }
      - testo: "Chiedere che l'anno prossimo corrano anche i comprati"
        descrizione: "Nessuno l'ha mai chiesto, perché chi poteva chiederlo stava dietro le sbarre del recinto. Adesso stai sul tronco con il maglio in mano."
        quando: [origine.fuggiasco-di-ghoran >= 1]
        esito:
          titolo: Anche i comprati
          testo: |
            Lo chiedi con il polso in vista e il maglio di Branko nell'altra mano. Alla luce dei fuochi si
            vede bene la riga chiara che hai sul polso. Sulla riva della Pece Tibbo alza la testa. Ostrav
            chiede se allora può correre anche la sua merce, e tu gli rispondi di sì, la sua per prima. Ragh
            batte le nocche due volte, e Dunja scrive la regola sulla cera con le lettere più grandi che le
            riescono.
          pe: { resilienza: 3 }
          imposta: { avv-prove-guado.regola: 2 }
          effetti: { avventura.prove-guado: 1, oggetto.avv-prove-guado-maglio-di-branko: 1, monete: 50, rep.ghoran: 0.5 }
