# (avv-prove-guado-il-banchetto). Budget: 2 dadi, Affilata 1, Ostinata e Talento (Intimidire) 1 fanno 5 punti, su
# grado 4 più il difetto Riconoscibile.
oggetti:
  - id: avv-prove-guado-maglio-di-branko
    nome: Maglio di Branko
    immagine: icone/warhammer
    descrizione: "Il maglio da cunei con cui Branko della Pece ha vinto nove volte le Prove del Guado, con la testa piatta da una parte e un cuneo affilato dall'altra per aprire i tronchi. Il manico è nero di resina, e a Ghoran chi lo vede sa da dove viene."
    slot: arma
    base: martello-da-guerra
    grado: 4
    dadi: 2
    proprieta: { affilata: 1, ostinata: true, talento: { intimidire: 1 } }
    difetti: [riconoscibile]
