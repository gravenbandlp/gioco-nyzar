# L'oggetto dell'Avventura «Il libro della regina»: il bracciale di Tamsira, accessorio di grado 4 (docs/piano-avventure.md).
# Budget: schermata (2) + ultimo respiro (2) + talento accademiche 1 = 5 punti, su grado 4 + un difetto (legata).
# Lo dà l'epilogo (`avv-libro-regina-quello-che-teneva-radek`): Radek l'aveva preso dalla bisaccia di Nevio.
oggetti:
  - id: avv-libro-regina-bracciale
    nome: Bracciale di Tamsira
    immagine: icone/bracer
    descrizione: "Una fascia di bronzo scuro con sei placchette d'arenaria rossa, una per ancella. Al polso della regina è rimasto per più di settant'anni, e al tuo si è chiuso da solo. Il giallo della pelle si ferma dove comincia il bronzo."
    slot: accessorio
    grado: 4
    proprieta: { schermata: true, ultimoRespiro: true, talento: { accademiche: 1 } }
    difetti: [legata]
