# Le voci del glossario per i nomi nuovi dell'Avventura «Il libro della regina», nel formato di
# contenuti/glossario/personaggi.yaml: presentazioni stabili, senza segreti (il bracciale preso da Radek e la fine
# delle ancelle restano fuori). Ghoran, Ragh, Oska, Ostrav e Gedda hanno già la loro voce.
glossario:
  - id: tamsira
    nome: Tamsira
    tipo: personaggio
    sottotitolo: "Regina del Gradone Rosso, prima della Guerra del Cristallo"
    testo: "Regina di una comunità del Gradone Rosso, incoronata nel cinquantunesimo anno dopo la Caduta e morta prima della Guerra del Cristallo. Teneva acceso il cristallo della sua gente. Nessun archivio di Qir-Azel conserva il suo nome, e il suo regno è scritto soltanto nel libro che le hanno messo sul petto."
    requisiti: []

  - id: porta-delle-sei
    nome: Porta delle Sei
    tipo: luogo
    sottotitolo: "Il mausoleo di una regina, nel Gradone Rosso"
    testo: "Una porta scolpita nell'arenaria alla base del Gradone Rosso, sul fianco che guarda Ghoran, con sei donne in rilievo sopra l'architrave. I pastori di Ghoran la chiamano così e ci passano al largo con le capre. Dietro c'è una galleria di sepolture che scende dentro la scarpata."
    requisiti: []

  - id: radek
    nome: Radek
    tipo: personaggio
    sottotitolo: "Lo stalliere del recinto dei muli di Ghoran"
    testo: "Uno stalliere magro con le dita storte dai morsi, che tiene il recinto dei muli accanto alla palizzata di Ghoran, dove le carovane lasciano le bestie prima di salire sulle passerelle. Ha una canzone per ogni mulo, e le canta tutte stonate allo stesso modo."
    requisiti: []

  - id: nevio-calo
    nome: Nevio Calò
    alias: [Nevio]
    tipo: personaggio
    sottotitolo: "Predatore di rovine della Città Bassa"
    testo: "Un uomo magro della Città Bassa che ha fatto i turni sulle piattaforme della Cicatrice e poi ha cominciato a lavorare le rovine per conto suo. Porta ancora il gancio alla cintura. Ha debiti in città, e un collezionista dei Quartieri Alti che compra quello che trova."
    requisiti: []
