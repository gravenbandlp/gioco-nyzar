# I nemici e gli scontri dell'Avventura «Il libro della regina» (avv-libro-regina). Tarati sul combattente di fine
# contenuti di scripts/simula-fine.ts (npx tsx scripts/simula-fine.ts avv-libro-regina-), come chiede
# docs/piano-avventure.md: gregari fra il 70 e l'85%, la regina fra il 40 e il 55%.
# - Le ombre delle nicchie: i morti della gente di Tamsira, sepolti lungo la galleria, che si alzano quando qualcuno
#   cerca fra le loro cose (fasce 1-6: la galleria delle nicchie e la processione).
# - Le ancelle di pietra: due delle sei statue dell'anticamera, che scendono dal piedistallo (fascia 7-9).
# - Le ombre della sala dei doni: tre ombre più deboli, intorno al corredo della regina (fascia 7-9).
# - Tamsira, la regina che si alza (il cuore): un'avversaria sola, non morta, che l'Esorcismo colpisce il doppio.
nemici:
  - id: avv-libro-regina-ombra
    immagine: bestiario/wight
    nome: Ombra delle nicchie
    descrizione: "Un morto del Gradone avvolto in bende ingiallite, alzato dalla sua nicchia. Ha le dita lunghe e secche, e le punta verso il libro prima di puntarle verso di te."
    attacco: 5
    difesa: 3
    difesaMentale: 4
    pf: 13
    danno: 3
    riduzione: 3
    iniziativa: 3
    tratti: [non-morto]

  - id: avv-libro-regina-ancella-di-pietra
    immagine: icone/stone-bust
    nome: Ancella di pietra
    descrizione: "Una statua d'arenaria rossa alta quanto una donna, con le mani aperte davanti al petto. Scende dal piedistallo senza piegare le ginocchia, e colpisce con le mani di pietra."
    attacco: 6
    difesa: 3
    difesaMentale: 6
    pf: 12
    danno: 3
    riduzione: 3
    iniziativa: 1

  - id: avv-libro-regina-ombra-del-corredo
    immagine: bestiario/wight
    nome: Ombra del corredo
    descrizione: "Un servitore sepolto ai piedi del corredo della regina. È più svelto delle ombre della galleria, e si muove fra i vasi senza toccarne uno."
    attacco: 5
    difesa: 3
    difesaMentale: 4
    pf: 10
    danno: 2
    riduzione: 3
    iniziativa: 4
    tratti: [non-morto]

  - id: avv-libro-regina-tamsira
    immagine: ambientazione/cripta-di-idrian-sollen
    nome: Tamsira, la regina che si alza
    descrizione: "La regina del Gradone, secca come una foglia sotto le bende di lino, con il libro fra le mani. Si muove adagio e colpisce con il dorso della mano, e ogni colpo ti lascia la pelle gialla."
    attacco: 6
    difesa: 4
    difesaMentale: 6
    pf: 28
    danno: 3
    riduzione: 5
    iniziativa: 3
    tratti: [non-morto]

scontri:
  - { id: avv-libro-regina-le-ombre, nome: "Le ombre delle nicchie", nemici: [avv-libro-regina-ombra, avv-libro-regina-ombra], feriteSconfitta: 2 }
  - { id: avv-libro-regina-le-ancelle, nome: "Le ancelle di pietra", nemici: [avv-libro-regina-ancella-di-pietra, avv-libro-regina-ancella-di-pietra], feriteSconfitta: 2 }
  - { id: avv-libro-regina-il-corredo, nome: "Le ombre del corredo", nemici: [avv-libro-regina-ombra-del-corredo, avv-libro-regina-ombra-del-corredo, avv-libro-regina-ombra-del-corredo], feriteSconfitta: 2 }
  - { id: avv-libro-regina-la-regina, nome: "Tamsira, la regina che si alza", nemici: [avv-libro-regina-tamsira], feriteSconfitta: 3 }
