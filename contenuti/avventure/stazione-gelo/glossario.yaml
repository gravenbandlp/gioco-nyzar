# Le voci del glossario per i nomi nuovi della stazione del gelo, nel formato di contenuti/glossario/personaggi.yaml:
# presentazioni stabili, senza segreti. Il Ghiro ha due voci: prima e dopo che si toglie le pelli di capra.
# Il ragazzo degli Spiumatori compare senza nome e resta senza voce.
glossario:
  - id: brinaia
    nome: Brinaia
    tipo: luogo
    sottotitolo: "Una stazione dei Precursori sul Gradone Rosso"
    testo: "Una cupola di metallo scuro mezza affondata nello sperone di pietra nera dove finisce il ciglio sud del Gradone Rosso. I pastori la chiamano così perché d'estate le pietre intorno si coprono di brina. Dal camino scende una nebbia bianca che sta bassa sull'arenaria, e le capre ci girano al largo."
    requisiti: []

  - id: gelatrice
    nome: Gelatrice
    tipo: cosa
    sottotitolo: "La macchina della Brinaia"
    testo: "Una ruota di metallo nero larga quanto una piazza, con i cristalli conduttori incastonati lungo il bordo, nel mezzo della Brinaia. Gira piano, e a ogni giro prende il caldo dalle stanze e da chi ci sta dentro e lo manda via per i tubi. Il nome non è dei Precursori, gliel'ha dato chi l'ha rimessa in moto."
    requisiti: []

  - id: lamberto-vaire
    nome: Lamberto Vaire
    alias: [Vaire]
    tipo: personaggio
    sottotitolo: "Maestro di conservazione dell'Accademia di Torvessa"
    testo: "Il maestro che all'Accademia di Torvessa insegnava conservazione, cioè le ghiacciaie a cristalli dove si tengono i campioni e le medicine. Dodici anni fa è salito sul Gradone Rosso a studiare la Brinaia e non è più tornato. A ogni cambio di stagione il suo stipendio esce ancora dalla cassa, e qualcuno lo firma con la sua mano."
    requisiti: []

  - id: ghiro
    nome: Ghiro
    tipo: personaggio
    sottotitolo: "Il custode della Brinaia"
    testo: "Il custode della Brinaia, come lo chiamano i prigionieri. È un vecchio gobbo così avvolto nelle pelli di capra che non gli si vede la faccia. Porta il brodo nelle celle, ride di ogni cosa con una risata secca e dorme nella stanza del forziere, con le chiavi alla cintura. Dice sempre che il padrone decide, e che intanto si dorme."
    requisiti: [avv-stazione-gelo.svelato == 0]

  - id: ghiro-svelato
    nome: Ghiro
    tipo: personaggio
    sottotitolo: "Il custode della Brinaia"
    testo: "Il nome che i prigionieri della Brinaia davano al custode gobbo che portava il brodo nelle celle e rideva di ogni cosa. Sotto le pelli di capra c'era Lamberto Vaire, dritto, con la tonaca blu dei maestri dell'Accademia. Un padrone, alla Brinaia, non c'è mai stato."
    requisiti: [avv-stazione-gelo.svelato >= 1]

  - id: sveva-morsani
    nome: Sveva Morsani
    alias: [Sveva]
    tipo: personaggio
    sottotitolo: "Raschiatrice sparita sul Gradone Rosso"
    testo: "Raschiatrice che sei anni fa è salita da sola sul Gradone Rosso a cercare una rovina dei Precursori, ed è sparita. Portava la giacca di tela cerata dei turni e una corda arrotolata a tracolla. La sua squadra le ha appeso una lanterna sul Ponte dei Morti, e da allora non è più scesa nel Labirinto."
    requisiti: []
