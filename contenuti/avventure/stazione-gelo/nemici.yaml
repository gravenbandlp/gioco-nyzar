# I nemici della stazione del gelo. L'Avventura sta fra l'Atto IV dei villaggi e la Campana, più vicina alla Campana:
# tarati con `npx tsx scripts/simula-fine.ts avv-stazione-gelo-` sul profilo «fine contenuti» (Fisico 4, Armi da
# mischia 4, Spadone di Uzgreth, cotta di maglia). Gregari fra il 70 e l'85%, il boss fra il 40 e il 55%.
# - 0-3: il lupo bianco della ghiacciaia.
# - 4-6: la sentinella di brina, una macchina dei Precursori che guarda le cose calde.
# - 7-8: i congelati della sala da ballo (in coppia) e il giardiniere della serra (un congelato rinforzato).
# - Il cuore: Lamberto Vaire, con il Morso della brina (incantesimo dei soli nemici, qui sotto).
nemici:
  - id: avv-stazione-gelo-lupo-bianco
    immagine: icone/wolf-head
    nome: Lupo bianco della Brinaia
    descrizione: "Un lupo del Gradone Rosso cresciuto nel freddo della Brinaia, con un pelo bianco e fitto che lo fa sembrare grande il doppio. Il Ghiro lo nutre con le capre, e lui ha imparato a non sprecare un morso."
    attacco: 6
    difesa: 5
    difesaMentale: 3
    pf: 13
    danno: 4
    riduzione: 3
    iniziativa: 4
    tratti: [animale]

  - id: avv-stazione-gelo-sentinella
    immagine: bestiario/salvaguardia-precursori
    nome: Sentinella di brina
    descrizione: "Una macchina dei Precursori alta due volte un uomo, su quattro zampe sottili, con il corpo a forma di lanterna. Dorme sotto la brina e si sveglia per tutto quello che è più caldo di lei."
    attacco: 6
    difesa: 5
    difesaMentale: 7
    pf: 14
    danno: 4
    riduzione: 3
    iniziativa: 3

  - id: avv-stazione-gelo-congelato
    immagine: bestiario/wight
    nome: Congelato della Brinaia
    descrizione: "Un prigioniero di anni fa, morto nel sonno delle celle e messo in posa nelle sale. La Gelatrice lo tiene caldo quanto basta per muoversi, e si muove a scatti, al ritmo della ruota."
    attacco: 6
    difesa: 4
    difesaMentale: 5
    pf: 10
    danno: 3
    riduzione: 3
    iniziativa: 1
    tratti: [non-morto]

  - id: avv-stazione-gelo-lamberto-vaire
    immagine: icone/frozen-orb
    nome: Lamberto Vaire
    descrizione: "Il maestro di conservazione dell'Accademia di Torvessa, con la tonaca blu rammendata ai gomiti e le mani bianche di brina fino ai polsi. La Gelatrice gli passa dentro dalle dita, e il freddo che ti manda addosso viene da dodici anni di stanze svuotate."
    attacco: 6
    difesa: 4
    difesaMentale: 6
    pf: 26
    danno: 3
    riduzione: 5
    iniziativa: 3
    magia: 6
    energia: 6
    incantesimi: [avv-stazione-gelo-il-morso-della-brina]

scontri:
  - { id: avv-stazione-gelo-il-lupo-bianco, nome: "Il lupo bianco", nemici: [avv-stazione-gelo-lupo-bianco], feriteSconfitta: 2 }
  - { id: avv-stazione-gelo-la-sentinella, nome: "La sentinella di brina", nemici: [avv-stazione-gelo-sentinella], feriteSconfitta: 2 }
  - { id: avv-stazione-gelo-i-congelati, nome: "I congelati della sala da ballo", nemici: [avv-stazione-gelo-congelato, avv-stazione-gelo-congelato], feriteSconfitta: 3 }
  - { id: avv-stazione-gelo-il-giardiniere, nome: "Il giardiniere della serra", nemici: [avv-stazione-gelo-congelato], feriteSconfitta: 3, rinforzo: { difesa: 1, pf: 3, danno: 2 } }
  - { id: avv-stazione-gelo-il-magister, nome: "Lamberto Vaire", nemici: [avv-stazione-gelo-lamberto-vaire], feriteSconfitta: 3 }

incantesimi:
  - id: avv-stazione-gelo-il-morso-della-brina
    nome: Il morso della brina
    tradizione: precuriane
    livello: 2
    uso: [combattimento]
    immagine: icone/frozen-orb
    soloNemici: true
    descrizione: "Il freddo della Gelatrice, mandato fuori dalle dita tutto in un colpo. Un tiro contro la Resistenza, danno pari al margine più 1."
    tipo: attacco
    difesa: resistenza
    danno: 1
