# La ricompensa della stazione del gelo: lo scudo rotondo appeso nella sala del tesoro della Brinaia, che si stacca
# dalla parete nel cuore e si riceve nell'epilogo al Grifone di Ferro. Grado 4 con un difetto (budget 5): due dadi
# in difesa (2), Lucida (2), Talento in Resilienza (1); Riconoscibile, perché all'Accademia lo conoscono.
oggetti:
  - id: avv-stazione-gelo-specchio-da-braccio
    nome: Specchio da braccio
    immagine: icone/mirror-mirror
    descrizione: "Un disco di metallo dei Precursori lucido come uno specchio, con le cinghie di cuoio che Lamberto Vaire ci ha messo per appenderlo nella sala del tesoro. La brina non ci attacca, e chi ci si guarda dentro vede la propria faccia ferma anche quando ha paura. All'Accademia lo riconoscono al primo sguardo."
    slot: scudo
    base: scudo
    grado: 4
    dadi: 2
    proprieta: { lucida: true, talento: { resilienza: 1 } }
    difetti: [riconoscibile]
