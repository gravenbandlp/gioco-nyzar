# La ricompensa della signora delle gole: la lama della Signora, arma di grado 4 (Nerina Sabbi la ripesca dalla pozza,
# storia.yaml, passo 7 → 8). Base spada lunga; punti 2 dadi + rapida 1 + penetrante 1 + talento 1 = 5, su 4 + 1 difetto
# (riconoscibile: i cristalli dell'elsa hanno ancora i sigilli della Gilda).
oggetti:
  - id: avv-signora-gole-lama-della-signora
    nome: Lama della Signora
    immagine: icone/curvy-knife
    descrizione: "Una lama lunga e curva, con il dorso tempestato di cristalli conduttori piccoli come unghie e l'elsa fasciata di una pelle verde che non viene da nessun animale. È leggera e svelta, e trova le giunture delle armature. Quando chi la impugna alza la voce i cristalli si accendono appena, e chi ascolta tende a dargli ragione. Alla Casa dei Nodi riconoscerebbero i sigilli dei cristalli."
    slot: arma
    base: spada-lunga
    grado: 4
    dadi: 2
    proprieta: { rapida: 1, penetrante: 1, talento: { persuasione: 1 } }
    difetti: [riconoscibile]
