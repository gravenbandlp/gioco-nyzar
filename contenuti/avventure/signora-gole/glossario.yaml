# I nomi nuovi della signora delle gole, senza segreti: la voce di Corrado Zenni cambia quando l'Avventura è chiusa
# (avventura.signora-gole >= 7), come quelle di Gaspare Tenca a Pannion. La Signora si cerca solo per nome intero,
# perché «Signora» da sola apre troppe frasi.
glossario:
  - id: calanchi-rossi
    nome: Calanchi Rossi
    tipo: luogo
    sottotitolo: "Le gole d'argilla sulla strada di Pannion"
    testo: "Colline d'argilla rossa fra il bivio del gelso storto e l'altura di Pannion, che la pioggia ha scavato in gole strette e profonde. La strada dei carri ci passa sul fondo, dove la polvere arriva alla caviglia. Di giorno fa caldo come in un forno, e i carrettieri ci passano in fretta."
    requisiti: [avventura.signora-gole >= 1]

  - id: corrado-zenni
    nome: Corrado Zenni
    alias: [Zenni]
    tipo: personaggio
    sottotitolo: "Capitano della scorta della Gilda sulla strada del nord"
    testo: "Il capitano che tiene la strada del nord per le carovane della Gilda dei Mercanti, un uomo sui quarant'anni rasato con cura, che porta la cotta di maglia sotto la giubba. Mentre parla batte il pollice sul pomo della spada, e ogni conto lo chiude con «a conti fatti»."
    requisiti: [avventura.signora-gole <= 6]

  - id: corrado-zenni-dopo
    nome: Corrado Zenni
    alias: [Zenni]
    tipo: personaggio
    sottotitolo: "Già capitano della scorta della Gilda"
    testo: "Era il capitano della scorta della Gilda sulla strada del nord, finché nei Calanchi Rossi non si è scoperto per chi portava i carri. I carrettieri della strada del nord il suo nome lo dicono sputando, e alla Casa dei Nodi non lo dicono affatto."
    requisiti: [avventura.signora-gole >= 7]

  - id: nerina-sabbi
    nome: Nerina Sabbi
    alias: [Nerina]
    tipo: personaggio
    sottotitolo: "Carovaniera della scorta della Gilda"
    testo: "Carovaniera della scorta della Gilda sulla strada del nord, con la faccia cotta dal sole e una fila di anelli d'ottone all'orecchio, uno per ogni viaggio arrivato a destinazione. A primavera è sparita nei Calanchi Rossi insieme a una cassa, e dopo un'estate è tornata a Pannion legata su un carro di carbone."
    requisiti: [avventura.signora-gole >= 1]

  - id: signora-delle-gole
    nome: Signora delle gole
    tipo: creatura
    sottotitolo: "Una storia dei carrettieri del nord"
    testo: "Nei canti dei carrettieri della strada del nord è una donna che canta di notte nelle gole d'argilla e chiama i viandanti per nome, con la voce di qualcuno che hanno amato. Dalla vita in giù, dicono, è una serpe. Chi la segue torna con gli occhi bianchi, oppure non torna."
    requisiti: [avventura.signora-gole >= 1]
