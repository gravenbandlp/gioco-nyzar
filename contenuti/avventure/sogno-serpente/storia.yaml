# Avventura 11, «La bambina che sognava il serpente» (docs/piano-avventure.md). Avventura di villaggio: si apre a
# Tuarmir dopo la fine della quest del villaggio (fazione.tuarmir >= 15). Tutte le scene stanno presso il luogo di
# Tuarmir; la spedizione dentro la roccia rossa è in spedizione.yaml.
# La pista `avventura.sogno-serpente` va da 0 a 6:
# - 0 → 1 `avv-sogno-serpente-gli-avvisi-al-pozzo` (aggancio): Garro lo scalpellino appende al pozzo dello slargo i
#   ritratti della figlia Isel, sparita da due notti; le lettere sotto i ritratti le ha scritte Maela.
# - 1 → 2 `avv-sogno-serpente-la-stanza-di-isel`: la stanza con la finestra sulla roccia rossa e i disegni a carbone,
#   che in fila sono le prove del tempio. Chi riesce prende il vantaggio `avv-sogno-serpente.disegni`.
# - 2 → 3 `avv-sogno-serpente-la-canzone-dei-punti`: nel seccatoio Madre Cerya ricorda la strofa della roccia, che le
#   cucitrici non cantano più, e la parte della roccia, il primo mazzo di salvia che le vecchie portavano a Ulvessa
#   prima che il Velo salisse la gola a comprare le erbe. Vantaggio `avv-sogno-serpente.canto`.
# - 3 → 4 `avv-sogno-serpente-la-crepa-del-serpente`: le impronte di Isel sul ghiaione fino alla crepa con il serpente
#   alato scolpito. Vantaggio `avv-sogno-serpente.segno` (l'incavo della fronte, che apre la crepa).
# - 4: l'ingresso e la spedizione (spedizione.yaml). Il cuore protegge il rito (`avv-sogno-serpente.rito` 1) o lo
#   rompe combattendo Ulvessa (rito 2), e porta la pista a 5.
# - 5 → 6, l'epilogo, in due scene secondo il rito: `avv-sogno-serpente-la-parte-della-roccia` (rito 1: che cosa
#   sapranno il villaggio e il Velo, `avv-sogno-serpente.scelta` 1, 2 o 3) e `avv-sogno-serpente-il-silenzio-di-isel`
#   (rito 2: il prezzo dello scontro). Tutte e due danno la penna della guardiana (oggetti.yaml).
# Varianti: velo.alenna == 2 (Alenna vive con Cerya) con `quando`; opzioni d'origine per l'accolito del Velo, il figlio
# del Circolo e l'allievo di Torvessa (anche in spedizione.yaml). Nomi nuovi in glossario.yaml.
quality:
  - { id: avventura.sogno-serpente, immagine: icone/feather, nome: "La bambina che sognava il serpente", categoria: pista, descrizione: "Isel, la figlia dello scalpellino di Tuarmir, è salita da sola alla roccia rossa dietro un sogno. La pista si chiude a 6." }
  - { id: avv-sogno-serpente.disegni, immagine: icone/paint-brush, nome: I disegni di Isel, categoria: stato, descrizione: "Hai copiato su un foglio i disegni a carbone della stanza di Isel. In fila sono una strada, dal serpente di pietra al cinghiale con la fascia sulla zampa." }
  - { id: avv-sogno-serpente.canto, immagine: icone/sewing-needle, nome: La strofa della roccia, categoria: stato, descrizione: "La strofa che nomina Ulvessa, l'ultima della canzone dei punti. Le cucitrici di Tuarmir l'hanno dimenticata, e tu la sai a memoria." }
  - { id: avv-sogno-serpente.segno, immagine: icone/snake-totem, nome: L'incavo della fronte, categoria: stato, descrizione: "Sotto il serpente scolpito sulla crepa c'è un incavo all'altezza della fronte di un bambino. Hai capito a che cosa serve." }
  - { id: avv-sogno-serpente.svolta, nome: La parete dei chiamati, categoria: stato, nascosta: true, descrizione: "1 dopo aver visto la parete dipinta a metà del tempio." }
  - { id: avv-sogno-serpente.rito, nome: Il rito di Ulvessa, categoria: stato, nascosta: true, descrizione: "1 se hai protetto il rito fino all'ultima strofa, 2 se hai combattuto la guardiana." }
  - { id: avv-sogno-serpente.scelta, nome: La roccia rossa, categoria: stato, nascosta: true, descrizione: "1 il villaggio sa di Ulvessa, 2 lo sanno solo Cerya e Isel, 3 lo sa anche il Velo." }

storylet:
  # ------------------------------------------------------------ 0 → 1 · gli avvisi al pozzo (aggancio)
  - id: avv-sogno-serpente-gli-avvisi-al-pozzo
    presso: tuarmir
    immagine: ambientazione/tuarmir
    titolo: Gli avvisi al pozzo
    sommario: "Nello slargo lo scalpellino di Tuarmir pianta chiodi nella pietra intorno al pozzo. A ogni chiodo appende la faccia di una bambina."
    luogo: Tuarmir, il pozzo dello slargo
    area: superficie-fratturata
    requisiti: [fazione.tuarmir >= 15, avventura.sogno-serpente == 0]
    testo: |
      Nello slargo in fondo alla scala grande un uomo grosso pianta chiodi nella pietra intorno al pozzo con
      un martello da scalpellino. Ogni chiodo entra in due colpi in una fessura che lui trova senza cercarla,
      e la pietra intorno non si scheggia. A ogni chiodo appende una lavagnetta di ardesia con incisa la
      faccia di una bambina con i capelli corti e un neo sul mento. Le facce sono incise a punta di scalpello
      con un tratto solo e sicuro. Sotto ogni faccia c'è il nome ISEL in grandi lettere di gesso, tracciate da
      Maela che siede sul bordo del pozzo con le dita bianche.

      L'uomo è Garro, che ha scavato quasi tutte le porte di Tuarmir. Sua figlia manca da due notti, e il
      villaggio gli ha portato pane e coperte e gli ha detto di aspettare. Il pane è ancora sul bordo del
      pozzo, piegato nel suo panno.

      Quando ti vede si ferma con il martello alzato. Era fra le soglie quando lo slargo ti ha chiamato
      Orecchio del vento.

      «Tu sei salit{o|a} alla Sella» dice. «Allora puoi salire anche dove è andata lei.»

      {percezione Media} In tutti i ritratti la bambina guarda verso sinistra, perché Garro a memoria la
      ricorda girata verso la parete di ponente.

      {origine figlio-della-citta-bassa} In Città Bassa la faccia di un bambino sparito non si appende ai
      muri. Si chiede in giro a chi conviene, sperando che nessuno l'abbia venduto.
    opzioni:
      - testo: "Chiedergli di sua figlia"
        descrizione: "Ha le nocche spaccate dal martello. Parlare di lei forse gliele ferma."
        prova: { attributo: sociale, abilita: empatia, difficolta: Media }
        successo:
          titolo: Il serpente con le ali
          testo: |
            Garro posa il martello sul bordo del pozzo, e senza il manico le mani non sa dove metterle. Isel,
            dice, da una luna sogna un serpente con le ali, e la mattina lo disegna con il carbone su tutti i
            muri di casa. Due notti fa il letto era vuoto e la finestra aperta. Ti chiede di venire a vedere
            la stanza, perché lui da allora non ci riesce a entrare.
          pe: { empatia: 3 }
          effetti: { avventura.sogno-serpente: 1, rep.tuarmir: 0.5 }
        fallimento:
          titolo: Il martello
          testo: |
            Glielo chiedi, e Garro ricomincia a piantare chiodi, più forte, finché mezzo slargo si volta a
            guardare. Un chiodo gli si piega sotto il colpo, e lui lo pianta lo stesso, storto. Quando si
            ferma ti racconta tutto in una volta. Isel sogna un serpente con le ali da una luna, e due notti
            fa la sua finestra era aperta. Ti chiede di venire a vedere la stanza.
          effetti: { avventura.sogno-serpente: 1, scandalo: 0.5 }
      - testo: "Studiare i ritratti sulle lavagnette"
        descrizione: "Una dozzina di facce incise in fretta, da un uomo che sa scolpire la pietra meglio di chiunque."
        prova: { attributo: mentale, abilita: percezione, difficolta: Media }
        successo:
          titolo: La parete di ponente
          testo: |
            Le facce guardano tutte dalla stessa parte. Quando glielo fai notare Garro si gira verso la parete
            di ponente, dove sopra le ultime case la gola fa il gomito e c'è lo sperone color ruggine della
            roccia rossa. Nella luce del mattino ha il colore del ferro lasciato sotto la pioggia. «Da una
            luna guarda solo là» dice. Ti chiede di venire a vedere la stanza di Isel.
          pe: { percezione: 3 }
          effetti: { avventura.sogno-serpente: 1, rep.tuarmir: 0.5 }
        fallimento:
          titolo: La lavagnetta nel pozzo
          testo: |
            Ne stacchi una dal chiodo per guardarla meglio, e ti scivola di mano e finisce nel pozzo. Il tonfo
            arriva tardi e lungo, e per tutto quel tempo Maela tiene il gesso fermo a un dito dalla
            lavagnetta. Garro chiude gli occhi. Poi ne incide un'altra senza dire niente, e alla fine ti
            chiede di venire a vedere la stanza della bambina.
          effetti: { avventura.sogno-serpente: 1, scandalo: 0.5 }
      - testo: "Chiedere a Maela che cosa sa"
        descrizione: "Maela ha insegnato a Isel qualche lettera. Le bambine si dicono cose che ai padri non dicono."
        prova: { attributo: sociale, abilita: [empatia, persuasione], difficolta: Media }
        successo:
          titolo: La fine della canzone
          testo: |
            Maela si pulisce le dita sul grembiule, e il gesso ci lascia due strisce bianche. Isel le ha
            chiesto di insegnarle una parola sola, *serpe*, e poi le ha chiesto come finiva la canzone dei
            punti, quella che le donne cantano cucendo. Maela non lo sapeva. Garro, dal pozzo, ti chiede di
            venire a vedere la stanza.
          pe: { empatia: 3 }
          effetti: { avventura.sogno-serpente: 1, rep.tuarmir: 0.5 }
        fallimento:
          titolo: Il gesso spezzato
          testo: |
            Glielo chiedi con troppa fretta, e Maela spezza il gesso fra le dita e ti risponde che le cose di
            Isel sono di Isel. Più tardi però ti raggiunge, con la polvere del gesso ancora sulle dita, e ti
            dice che la bambina voleva sapere come finisce la canzone dei punti. Garro ti aspetta per
            mostrarti la stanza.
          effetti: { avventura.sogno-serpente: 1, tormento: 0.5 }
      - testo: "Aiutarlo ad appendere le lavagnette"
        descrizione: "Ne ha ancora una cesta piena. Uno che tiene i chiodi gli lascia le mani libere per parlare."
        costo: 2
        esito:
          titolo: I chiodi
          testo: |
            Gli passi i chiodi uno alla volta per tutta la mattina, finché le facce di Isel fanno il giro del
            pozzo due volte. Impari presto a porgerli con la punta verso la pietra, perché lui allunga la mano
            senza voltarsi. Lui parla senza guardarti, del serpente con le ali che la bambina sogna da una
            luna e della finestra aperta. A mezzogiorno ti chiede di venire a vedere la stanza.
          effetti: { avventura.sogno-serpente: 1, rep.tuarmir: 0.5 }

  # ------------------------------------------------------------ 1 → 2 · la stanza di Isel
  - id: avv-sogno-serpente-la-stanza-di-isel
    presso: tuarmir
    immagine: icone/paint-brush
    titolo: La stanza di Isel
    sommario: "Garro ha scavato per la figlia l'unica finestra vera di Tuarmir. I muri della stanza sono coperti di disegni a carbone."
    luogo: Tuarmir, la casa dello scalpellino
    area: superficie-fratturata
    requisiti: [avventura.sogno-serpente == 1]
    testo: |
      La casa di Garro sta sulla parete di levante ed è l'unica di Tuarmir con una finestra vera. È un tondo
      nella pietra chiuso da un'imposta di legno, che lui ha scavato nella stanza della figlia perché avesse
      luce anche fuori dall'ora di sole. Il bordo del tondo è lisciato a mano fino a sembrare tornito, e sotto
      il davanzale la pietra porta ancora i segni fitti e paralleli della subbia. Dalla finestra si vede lo
      sperone della roccia rossa.

      I muri sono coperti di disegni a carbone fin dove arriva il braccio di una bambina, e il serpente con le
      ali c'è dappertutto. Isel gli disegna le penne una per una anche sui serpenti più piccoli, e in quei
      punti il carbone è ripassato tante volte che fa crosta. In un angolo ci sono figure in fila come le
      tappe di una strada. Dopo un serpente di pietra e una porta con una mano sopra vengono due mani aperte,
      e poi un cinghiale con la zampa fasciata. In fondo alla fila il serpente con le ali sta arrotolato
      intorno a una bambina seduta.

      Garro resta sulla soglia.

      {natura Media} Sul davanzale c'è un velo di terra rossa più fine di quella dei terrazzi, e ha la forma
      di mezza suola. Isel è passata dalla finestra con le scarpe sporche della roccia.

      {tecnologia Facile fallita} Ti chiedi quale attrezzo scavi un tondo così preciso nella pietra viva, e ti
      viene in mente soltanto un compasso grande come un carro. Ai segni della subbia sotto il davanzale non
      pensi nemmeno.
    opzioni:
      - testo: "Leggere i disegni in fila, dal primo all'ultimo"
        descrizione: "Una bambina che disegna la stessa cosa per una luna sta raccontando qualcosa."
        prova: { attributo: mentale, abilita: [percezione, accademiche], difficolta: Media }
        successo:
          titolo: La strada
          testo: |
            Li leggi da sinistra a destra, come si legge una riga. Il serpente di pietra ha la bocca chiusa e
            la bambina gli passa davanti dritta. Alla porta la mano bussa, e le mani aperte danno. Il
            cinghiale ha la fascia perché qualcuno l'ha curato, e i giri della fascia sono stretti e ordinati
            come quelli che si fanno a una caviglia slogata. Copi la fila su un foglio, e Garro te lo guarda
            fare dalla soglia.
          pe: { percezione: 3 }
          imposta: { avv-sogno-serpente.disegni: 1 }
          effetti: { avventura.sogno-serpente: 1, rep.tuarmir: 0.5 }
        fallimento:
          titolo: Il carbone
          testo: |
            Ti avvicini troppo al muro e ci passi sopra la manica, e mezzo serpente di pietra diventa una
            macchia grigia. Garro fa un passo nella stanza, per la prima volta in due notti. Guarda la macchia
            con la mano aperta a mezz'aria, e poi torna sulla soglia.
          effetti: { avventura.sogno-serpente: 1, scandalo: 0.5 }
      - testo: "Chiedere a Garro che cosa gli raccontava Isel dei disegni"
        descrizione: "Una bambina di nove anni spiega i suoi disegni a chiunque, prima di tutti al padre."
        prova: { attributo: sociale, abilita: empatia, difficolta: Media }
        successo:
          titolo: Le regole di Isel
          testo: |
            Garro entra e si siede sul letto della figlia, e le assi scricchiolano sotto il suo peso. Isel gli
            diceva che il serpente di pietra non morde chi non ha paura e che la porta si apre a chi chiede.
            Gli diceva anche che bisogna lasciare qualcosa e curare chi è ferito. Lui pensava che fossero
            regole da bambina. Mentre parla copi la fila di disegni su un foglio, e lui intanto si guarda le
            mani grigie di polvere di pietra.
          pe: { empatia: 3 }
          imposta: { avv-sogno-serpente.disegni: 1 }
          effetti: { avventura.sogno-serpente: 1, rep.tuarmir: 0.5 }
        fallimento:
          titolo: La soglia
          testo: |
            Glielo chiedi, e Garro scuote la testa e non entra. Dice che Isel parlava sempre, e lui lavorava.
            Torna allo slargo a piantare chiodi, e tu resti sol{o|a} nella stanza con il carbone sui muri. I
            colpi del martello salgono fino alla finestra, uno ogni pochi respiri.
          effetti: { avventura.sogno-serpente: 1, tormento: 0.5 }
      - testo: "Guardare dalla finestra con gli occhi di lei"
        descrizione: "La finestra è all'altezza della faccia di una bambina. Per guardare fuori come lei bisogna mettersi in ginocchio."
        prova: { attributo: mentale, abilita: [natura, percezione], difficolta: Media }
        successo:
          titolo: In ginocchio
          testo: |
            Ti metti in ginocchio sul letto, e dalla finestra la roccia rossa sta esattamente nel tondo, come
            in una cornice. Ai suoi piedi c'è il ghiaione, e sul ghiaione una riga più scura che sale. È
            sottile come la traccia di un passo solo e sale dritta, senza le curve che fanno le capre. Poi ti
            giri, e dal letto i disegni si leggono in fila, così li copi su un foglio.
          pe: { natura: 3 }
          imposta: { avv-sogno-serpente.disegni: 1 }
          effetti: { avventura.sogno-serpente: 1, rep.tuarmir: 0.5 }
        fallimento:
          titolo: Le ginocchia
          testo: |
            Ti inginocchi sul letto, che cede con un crack di assi vecchie. Garro sulla soglia non dice niente
            e guarda l'asse spaccata, che dovrà rifare lui. Dalla finestra vedi la roccia rossa, e non ci
            trovi niente che non sapessi già.
          effetti: { avventura.sogno-serpente: 1, scandalo: 0.5 }
      - testo: "Sederti sul letto e aspettare che Garro parli"
        descrizione: "Sulla soglia di quella stanza è fermo da due notti. Prima o poi parlerà."
        costo: 2
        esito:
          titolo: Il pomeriggio
          testo: |
            Ti siedi sul letto di Isel e aspetti, mentre la luce nel tondo della finestra si sposta sul muro e
            passa sopra i serpenti uno alla volta. Quando Garro parla è quasi sera, e parla della moglie
            morta, del carbone che Isel rubava al fabbro e di un serpente con le ali che lui non ha mai preso
            sul serio.
          effetti: { avventura.sogno-serpente: 1, rep.tuarmir: 0.5 }

  # ------------------------------------------------------------ 2 → 3 · la canzone dei punti
  - id: avv-sogno-serpente-la-canzone-dei-punti
    presso: tuarmir
    immagine: ambientazione/le-maschere
    titolo: La canzone dei punti
    sommario: "La sera, nel seccatoio, le donne cuciono cantando. Isel voleva sapere come finisce la canzone, e Madre Cerya se lo ricorda."
    luogo: Tuarmir, il seccatoio, di sera
    area: superficie-fratturata
    requisiti: [avventura.sogno-serpente == 2]
    testo: |
      La sera nel seccatoio le donne cuciono le maschere nuove e cantano la canzone dei punti. Sotto la volta
      corrono travi annerite dal fumo, e dalle travi pendono a testa in giù i mazzi di salvia. La canzone va a
      tempo con l'ago, una sillaba per ogni punto. Quando dici che Isel voleva sapere come finisce, la canzone
      si ferma a metà di una strofa e Madre Cerya smette di sgranare la salvia.

      «Finisce con la strofa della roccia» dice. Quando lei era piccola le vecchie la cantavano ancora, e ogni
      primavera portavano ai piedi della roccia rossa il primo mazzo di salvia, che chiamavano la parte della
      roccia. La canzone dice che lassù dorme Ulvessa, la serpe con le ali, e che finché lei dorme le erbe
      della gola crescono buone. Poi sono arrivate a comprare le erbe le sorelle del Velo, che il primo mazzo
      lo volevano per l'Albero.

      «La preghiera dell'Albero io la dico storta» dice Cerya. «Quella della roccia non la dice più nessuno.»
      Nessuna delle donne ricorda la strofa intera.

      {accademiche Difficile} Una canzone da lavoro che tiene un nome per tre generazioni lo tiene perché
      qualcuno aveva paura di perderlo. Il ritmo dei punti lo custodisce meglio di un registro, perché chi
      cuce non può saltare una sillaba senza sbagliare il punto.

      {origine accolito-del-velo} In Cattedrale le offerte vanno all'Albero e a nessun altro. Cerya dice
      *Albero* con la stessa voce con cui dice *salvia*, e la cosa non ti scandalizza quanto dovrebbe.
    opzioni:
      - testo: "Ricostruire la strofa con le cucitrici"
        descrizione: "Nessuna la ricorda intera. Ognuna però ne ricorda un pezzo, cucito a un punto diverso."
        prova: { attributo: sociale, abilita: espressivita, difficolta: Media }
        successo:
          titolo: Un verso per ago
          testo: |
            Canti la canzone dall'inizio, e quando arrivi alla fine aspetti con l'ago fermo. Una vecchia
            ricorda un verso, e la sua vicina quello dopo, finché la strofa torna intera. Ognuna ritrova il
            suo verso solo quando la mano arriva al punto giusto, e lo canta senza alzare gli occhi dalla
            stoffa. *Sale sola chi la sogna, e le conta le penne piano*. Gli ultimi versi li dice Cerya a
            occhi chiusi, e tu li ripeti finché ti restano in bocca.
          pe: { espressivita: 3 }
          imposta: { avv-sogno-serpente.canto: 1 }
          effetti: { avventura.sogno-serpente: 1, rep.tuarmir: 0.5 }
        fallimento:
          titolo: La strofa a pezzi
          testo: |
            Canti, e la voce ti esce troppo alta per il seccatoio, dove si parla piano. Le donne ridono dietro
            le maschere e ognuna canta un verso diverso, finché la strofa è un mucchio di pezzi che non stanno
            insieme. Ti resta solo che Ulvessa dorme nella roccia e che chi la sveglia canta.
          effetti: { avventura.sogno-serpente: 1, scandalo: 0.5 }
      - testo: "Chiedere a Cerya che cosa fa la serpe quando si sveglia"
        descrizione: "Se le erbe crescono buone finché dorme, le vecchie sapevano anche che cosa succede quando apre gli occhi."
        prova: { attributo: sociale, abilita: [empatia, galateo], difficolta: Media }
        successo:
          titolo: La muta
          testo: |
            Cerya ci pensa a lungo, e intanto rigira fra le dita verdi un rametto di salvia. Ogni tanto, dice,
            la serpe si sveglia per cambiarsi le penne come le galline in autunno. Allora chiama un bambino in
            sogno perché le canti la strofa mentre se le cambia. Poi te la canta lei a mezza voce, e la voce
            le si incrina sui versi alti. Tu la impari al secondo giro.
          pe: { empatia: 3 }
          imposta: { avv-sogno-serpente.canto: 1 }
          effetti: { avventura.sogno-serpente: 1, rep.tuarmir: 0.5 }
        fallimento:
          titolo: La domanda storta
          testo: |
            Le chiedi se la serpe mangia i bambini, e nel seccatoio cala un silenzio da adunanza. Gli aghi si
            fermano tutti a metà del punto. Cerya risponde soltanto che le vecchie non lo dicevano, e torna a
            sgranare la salvia.
          effetti: { avventura.sogno-serpente: 1, scandalo: 0.5 }
      - testo: "Cucire con loro fino a tardi, e ascoltare"
        descrizione: "Le donne di Tuarmir raccontano mentre cuciono. Ci vuole la sera intera."
        costo: 2
        esito:
          titolo: Fino a tardi
          testo: |
            Cuci il bordo di una maschera con l'ago che ti dà Ilenia, e ascolti. La stoffa è doppia e
            impregnata d'erbe, e l'ago ci passa a fatica. Le donne parlano di Ulvessa come si parla di una
            vicina che non esce più di casa. Della strofa ricordano un verso a testa, e la strofa intera non
            la ricorda nessuna.
          effetti: { avventura.sogno-serpente: 1, rep.tuarmir: 0.5 }
      - testo: "Chiedere ad Alenna se l'ha scritta nel quaderno"
        descrizione: "Alenna scrive tutto quello che si dice a Tuarmir, anche le cose a cui non crede."
        quando: [velo.alenna == 2]
        esito:
          titolo: Superstizioni locali
          testo: |
            Alenna sfoglia il quaderno delle foglie fino alle ultime pagine, dove sotto il titolo
            *superstizioni locali* ha scritto la strofa della roccia parola per parola, come gliel'ha cantata
            una vecchia l'inverno scorso. La grafia è dritta e ogni verso ha la sua riga. Te la legge a voce
            bassa, e Cerya la canta dietro di lei.
          pe: { accademiche: 3 }
          imposta: { avv-sogno-serpente.canto: 1 }
          effetti: { avventura.sogno-serpente: 1, rep.tuarmir: 0.5 }
      - testo: "Dire per Isel la Preghiera del Battito"
        descrizione: "La formula del Velo per chi è lontano. A Tuarmir la conoscono, e Cerya la dice storta."
        quando: [origine.accolito-del-velo >= 1]
        esito:
          titolo: La risposta di Cerya
          testo: |
            Dici la Preghiera del Battito per Isel a mezza voce, come si dice nelle veglie. Quando arrivi in
            fondo, al posto della formula del Velo Cerya ti risponde con la strofa della roccia, tutta. La
            strofa ha la stessa cadenza della preghiera battuta per battuta, e le donne la riprendono dietro
            di lei senza fermare gli aghi.
          pe: { accademiche: 3 }
          imposta: { avv-sogno-serpente.canto: 1 }
          effetti: { avventura.sogno-serpente: 1, rep.tuarmir: 0.5 }

  # ------------------------------------------------------------ 3 → 4 · la crepa del serpente
  - id: avv-sogno-serpente-la-crepa-del-serpente
    presso: tuarmir
    immagine: ambientazione/gradone-rosso
    titolo: La crepa del serpente
    sommario: "Sopra i terrazzi di ponente comincia il ghiaione della roccia rossa. Sui sassi più fini ci sono le impronte di una bambina."
    luogo: Tuarmir, il ghiaione sotto la roccia rossa
    area: superficie-fratturata
    requisiti: [avventura.sogno-serpente == 3]
    testo: |
      All'alba Garro ti porta ai terrazzi di ponente con una corda sulla spalla e la mazza alla cintura. Sopra
      l'ultimo terrazzo comincia il ghiaione, una colata di sassi rossi dove a Tuarmir nessuno mette piede, e
      sui sassi più fini ci sono le piccole impronte degli zoccoli di Isel. Sul ghiaione non c'è nessun'altra
      traccia, e i sassi hanno gli spigoli vivi delle pietre che nessuno calpesta.

      Le impronte salgono fino a una crepa stretta alla base della roccia. Sopra è scolpito un serpente alato
      consumato dal vento che china la testa verso chi entra. Il vento ha arrotondato il muso e le ali, mentre
      le penne si contano ancora una per una e hanno gli orli netti. Ti dici che stanno al riparo, sotto la
      curva dell'ala. Garro ci passa sopra le dita. «Questo non l'ha fatto uno scalpello» dice.

      {resistenza Media} Il ghiaione si muove a ogni passo e ti brucia nei polpacci, e Garro sale senza
      fermarsi nemmeno dove i sassi scivolano.

      Dal buio della crepa sale un'aria tiepida che odora di pietra scaldata. Lui vuole entrare per primo, ma
      la crepa è troppo stretta per le sue spalle.
    opzioni:
      - testo: "Seguire le impronte senza sciuparle"
        descrizione: "Le impronte dicono come ha camminato, e dove si è fermata."
        prova: { attributo: mentale, abilita: [natura, percezione], difficolta: Media }
        successo:
          titolo: Dove si è fermata
          testo: |
            Le impronte salgono dritte e a passi uguali, e davanti alla crepa si fermano. Ci sono due segni
            tondi di ginocchia nella polvere. Sotto la testa del serpente scolpito, all'altezza della fronte
            di un bambino, c'è un incavo liscio e lucido come un gradino consumato. Isel ci ha appoggiato la
            fronte prima di entrare.
          pe: { natura: 3 }
          imposta: { avv-sogno-serpente.segno: 1 }
          effetti: { avventura.sogno-serpente: 1, rep.tuarmir: 0.5 }
        fallimento:
          titolo: Il ghiaione che scende
          testo: |
            A metà ghiaione i sassi ti partono sotto i piedi e scendi per un tratto sedut{o|a}, portandoti
            dietro mezze impronte. Il rumore dei sassi arriva fino ai terrazzi e torna indietro dalla parete.
            Garro ti aspetta alla crepa, e sotto il serpente scolpito non trovi niente che valga la strada.
          effetti: { avventura.sogno-serpente: 1, ferite: 0.5 }
      - testo: "Convincere Garro ad aspettarti fuori"
        descrizione: "Un padre con una mazza in un posto sconosciuto è un pericolo per tutti. Fuori può tenere la corda."
        prova: { attributo: sociale, abilita: [persuasione, empatia], difficolta: Media }
        successo:
          titolo: La corda
          testo: |
            Gli dici che la corda va tenuta da qualcuno che non la molla mai. Garro ci pensa con la mascella
            stretta, poi si siede su un sasso e si avvolge la corda intorno al braccio in tre giri stretti
            fino al gomito. Mentre ti leghi ti mostra l'incavo lucido sotto la testa del serpente. Un sasso,
            dice, lo consuma così soltanto la gente, a forza di fronti.
          pe: { persuasione: 3 }
          imposta: { avv-sogno-serpente.segno: 1 }
          effetti: { avventura.sogno-serpente: 1, rep.tuarmir: 0.5 }
        fallimento:
          titolo: La mazza
          testo: |
            Garro ti risponde alzando la voce, e la sua voce torna giù dal ghiaione fino ai terrazzi, dove le
            raccoglitrici si fermano a guardare. Alla fine si siede con la corda in mano, perché nella crepa
            non ci passa. Tiene la mazza sulle ginocchia e stringe il manico con l'altra mano.
          effetti: { avventura.sogno-serpente: 1, scandalo: 0.5 }
      - testo: "Salire per la via più corta, dritto per il ghiaione"
        descrizione: "Dritto si arriva prima, se i sassi tengono."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Media }
        successo:
          titolo: Prima di Garro
          testo: |
            Sali a quattro zampe dove il ghiaione è più ripido, e arrivi alla crepa con un buon tratto di
            vantaggio su Garro. Hai il tempo di guardare il serpente scolpito da vicino, e sotto la sua testa
            trovi un incavo lucido all'altezza della fronte di un bambino. Il resto della pietra è ruvido e
            pieno di polvere rossa, e nell'incavo la polvere non c'è.
          pe: { atletica: 3 }
          imposta: { avv-sogno-serpente.segno: 1 }
          effetti: { avventura.sogno-serpente: 1, rep.tuarmir: 0.5 }
        fallimento:
          titolo: I sassi rossi
          testo: |
            Il ghiaione ti scivola via da sotto le mani e ti lascia le palme piene di schegge rosse. Arrivi
            alla crepa dopo Garro, che ti tira su per il polso. Ha una mano abituata a sollevare lastre di
            pietra, e il polso te lo senti fino a sera.
          effetti: { avventura.sogno-serpente: 1, ferite: 0.5 }
      - testo: "Salire piano con Garro, un passo alla volta"
        descrizione: "Lui non vuole fermarsi. Tenergli il passo, su quei sassi, vuol dire salire per mezza mattina."
        costo: 2
        esito:
          titolo: Mezza mattina
          testo: |
            Salite insieme, fermandovi ogni volta che il ghiaione scende sotto i piedi di Garro. Lui pianta i
            piedi di traverso, come si fa nelle cave, e a ogni scivolata alza gli occhi verso la crepa.
            Arrivate alla crepa a metà mattina. Lui si siede con la corda in mano e guarda la fessura buia
            come si guarda una porta chiusa in faccia.
          effetti: { avventura.sogno-serpente: 1, rep.tuarmir: 0.5 }
      - testo: "Leggere le impronte come ti hanno insegnato al Circolo"
        descrizione: "Al Circolo si impara a capire dal piede se chi cammina ha paura."
        quando: [origine.figlio-del-circolo >= 1]
        esito:
          titolo: Il piede tranquillo
          testo: |
            Il piede di Isel non ha mai paura. Appoggia tutta la pianta anche dove il ghiaione scivola, e il
            tallone non affonda mai più della punta. Davanti alla crepa si ferma in ginocchio. Sotto la testa
            del serpente c'è l'incavo dove ha posato la fronte, lucido come le pietre del Bosco dove il
            Circolo si inginocchia.
          pe: { natura: 3 }
          imposta: { avv-sogno-serpente.segno: 1 }
          effetti: { avventura.sogno-serpente: 1, rep.tuarmir: 0.5 }

  # ------------------------------------------------------------ 5 → 6 · l'epilogo, se hai protetto il rito
  - id: avv-sogno-serpente-la-parte-della-roccia
    presso: tuarmir
    immagine: ambientazione/tuarmir
    titolo: La parte della roccia
    sommario: "Nell'ora di sole Isel siede sul bordo del pozzo con una penna rossa in grembo, e il villaggio le sta intorno."
    luogo: Tuarmir, lo slargo, nell'ora di sole
    area: superficie-fratturata
    requisiti: [avventura.sogno-serpente == 5, avv-sogno-serpente.rito == 1]
    testo: |
      Nell'ora di sole Isel siede sul bordo del pozzo fra le lavagnette con la sua faccia, e Garro le sta
      dietro con le mani sulle sue spalle. In grembo ha una penna rossa lunga un avambraccio, con il calamo
      duro come osso, e contro la luce la penna diventa oro. Sotto le facce di ardesia il gesso di Maela si è
      sbiadito, e il nome si legge appena. Il villaggio è uscito sulle soglie, e le donne del seccatoio sono
      scese allo slargo.

      Madre Cerya si fa portare da Ilenia fino al pozzo e con le dita verdi tocca la faccia di Isel e la
      penna, e dopo la tua mano. Sulla penna le dita si fermano più a lungo, e ne seguono il bordo fino alla
      punta.

      {empatia Media} Isel non ha paura e ha soltanto sonno. Guarda la roccia rossa come la casa di una nonna
      appena salutata, e sbadiglia senza coprirsi la bocca.

      La bambina ti porge la penna con tutte e due le mani. «Lei ha detto che è tua» dice. Poi guarda Cerya, e
      il villaggio aspetta di sapere quanto della roccia si potrà raccontare.

      {origine accolito-del-velo} In Cattedrale le piume di uccelli sconosciuti stanno chiuse sotto vetro con
      il loro cartellino, e questa nessuno l'ha chiusa da nessuna parte.
    opzioni:
      - testo: "Lasciare che Isel racconti tutto, a tutti"
        descrizione: "Il villaggio ha cantato la canzone dei punti per generazioni senza sapere come finiva."
        esito:
          titolo: La strofa intera
          testo: |
            Isel racconta, e la sua voce arriva a tutte le soglie. Quando dice della strofa le donne la
            cantano intera, per la prima volta da quando Cerya era bambina. In primavera, decidono, la parte
            della roccia si porterà di nuovo, e la porterà Isel. Garro ti stringe la mano con tutte e due le
            sue, ruvide di polvere di pietra, e tu ti ritrovi con la penna rossa.
          pe: { empatia: 5 }
          imposta: { avv-sogno-serpente.scelta: 1, avv-sogno-serpente.disegni: 0, avv-sogno-serpente.canto: 0, avv-sogno-serpente.segno: 0 }
          effetti: { avventura.sogno-serpente: 1, oggetto.avv-sogno-serpente-penna-della-guardiana: 1, rep.tuarmir: 1 }
      - testo: "Chiedere a Cerya di tenere la roccia fra voi"
        descrizione: "Una cosa che a Tuarmir sanno tutti, la sanno anche Lonn Var e i suoi compratori."
        esito:
          titolo: In pace
          testo: |
            Glielo chiedi piano, e Cerya annuisce. «La roccia va lasciata in pace» dice allo slargo, e il
            villaggio obbedisce come obbedisce sempre. Le soglie si svuotano una alla volta, e le donne
            risalgono al seccatoio senza voltarsi. La strofa resta una strofa da cucito. Isel però la sa
            intera, e la sai tu. Garro ti stringe la mano, e la penna rossa resta a te.
          pe: { resilienza: 5 }
          imposta: { avv-sogno-serpente.scelta: 2, avv-sogno-serpente.disegni: 0, avv-sogno-serpente.canto: 0, avv-sogno-serpente.segno: 0 }
          effetti: { avventura.sogno-serpente: 1, oggetto.avv-sogno-serpente-penna-della-guardiana: 1, rep.tuarmir: 0.5 }
      - testo: "Scrivere a Padre Vantes della roccia rossa"
        descrizione: "Il Velo compra le erbe di Tuarmir e ha voluto per sé il primo mazzo. Forse deve sapere a chi lo ha tolto."
        esito:
          titolo: La lettera al Velo
          testo: |
            Scrivi a Padre Vantes quello che hai visto nella roccia, e affidi la lettera al mulo di Lonn Var.
            Il villaggio ti guarda scrivere senza dire niente, e Cerya ti chiede soltanto di non mettere il
            nome della bambina. Lonn Var infila la lettera nella bisaccia, fra i mazzi di erbe che porta giù
            per il Velo. Garro ti stringe la mano con meno forza di quanto pensavi. La penna rossa resta a te.
          pe: { accademiche: 5 }
          imposta: { avv-sogno-serpente.scelta: 3, avv-sogno-serpente.disegni: 0, avv-sogno-serpente.canto: 0, avv-sogno-serpente.segno: 0 }
          effetti: { avventura.sogno-serpente: 1, oggetto.avv-sogno-serpente-penna-della-guardiana: 1, rep.velo: 1, rep.tuarmir: -0.5 }
      - testo: "Dettare ad Alenna la storia per il quaderno delle foglie"
        descrizione: "Alenna scrive a Padre Vantes, e scrive giusto. Se il Velo deve sapere, meglio che lo sappia da lei."
        quando: [velo.alenna == 2]
        esito:
          titolo: Sotto la strofa
          testo: |
            Alenna apre il quaderno alla pagina della strofa e cancella con una riga sola le parole
            *superstizioni locali*. La riga è dritta e calcata, e alla fine il pennino buca la carta. Sotto
            scrive quello che le detti, con la grafia dritta, e dice che lo manderà a Padre Vantes. Il
            villaggio vi guarda senza dire niente. Garro ti stringe la mano, e la penna rossa resta a te.
          pe: { accademiche: 5 }
          imposta: { avv-sogno-serpente.scelta: 3, avv-sogno-serpente.disegni: 0, avv-sogno-serpente.canto: 0, avv-sogno-serpente.segno: 0 }
          effetti: { avventura.sogno-serpente: 1, oggetto.avv-sogno-serpente-penna-della-guardiana: 1, rep.velo: 1, rep.tuarmir: -0.5 }

  # ------------------------------------------------------------ 5 → 6 · l'epilogo, se hai combattuto Ulvessa
  - id: avv-sogno-serpente-il-silenzio-di-isel
    presso: tuarmir
    immagine: ambientazione/tuarmir
    titolo: Il silenzio di Isel
    sommario: "Isel è tornata a casa e non parla. Sulla roccia rossa c'è una crepa nuova, e il villaggio l'ha sentita aprirsi di notte."
    luogo: Tuarmir, lo slargo
    area: superficie-fratturata
    requisiti: [avventura.sogno-serpente == 5, avv-sogno-serpente.rito == 2]
    testo: |
      Isel è a casa nel suo letto sotto la finestra tonda, e da quando Garro l'ha portata giù non ha detto una
      parola. Ha sulle braccia i graffi paralleli delle penne e si gira verso il muro quando qualcuno nomina
      la roccia. Lo sperone ha una crepa nuova fino a metà, e la notte scorsa il villaggio l'ha sentita
      aprirsi con un rumore che ha svegliato i cani. Ti dici che la roccia viva si spacca così anche nelle
      cave, quando il freddo della notte entra nelle vene della pietra. Stamattina nessun cane è salito ai
      terrazzi di ponente.

      Nello slargo nessuno ha tolto le lavagnette con la faccia di Isel. Garro ti passa accanto con un secchio
      d'acqua e non alza gli occhi.

      In mano hai la penna rossa che hai strappato dall'ala della guardiana mentre si ritirava nella roccia,
      con una goccia scura in fondo al calamo. La goccia si è rappresa e ha il colore della ruggine.

      {resilienza Media fallita} Ti ripeti che la bambina è viva e che l'hai riportata giù tu, finché ti
      accorgi che ti serve ripeterlo.

      Madre Cerya ti aspetta sulla soglia del seccatoio.
    opzioni:
      - testo: "Andare da Isel a chiederle perdono"
        descrizione: "È una bambina di nove anni, e ascoltarti non è un suo dovere."
        prova: { attributo: sociale, abilita: empatia, difficolta: Difficile }
        successo:
          titolo: La mano
          testo: |
            Ti siedi per terra accanto al letto e le dici che ti dispiace, senza aggiungere scuse. La pietra
            del pavimento è fredda, e la luce della finestra tonda si sposta di un palmo sul muro prima che
            Isel tiri fuori una mano da sotto la coperta. Te la posa sul polso un momento solo, e poi si gira
            verso il muro. Quando esci, Garro si scosta dalla soglia per lasciarti passare, e stavolta ti
            guarda.
          pe: { empatia: 5 }
          imposta: { avv-sogno-serpente.disegni: 0, avv-sogno-serpente.canto: 0, avv-sogno-serpente.segno: 0 }
          effetti: { avventura.sogno-serpente: 1, oggetto.avv-sogno-serpente-penna-della-guardiana: 1, rep.tuarmir: -0.5 }
        fallimento:
          titolo: Il muro
          testo: |
            Le parli, e Isel tira la coperta sopra la testa e comincia a cantare piano la strofa della roccia,
            per non sentirti. Sotto la coperta la voce è sottile e non sbaglia una parola. Garro ti accompagna
            alla porta tenendoti per il braccio.
          imposta: { avv-sogno-serpente.disegni: 0, avv-sogno-serpente.canto: 0, avv-sogno-serpente.segno: 0 }
          effetti: { avventura.sogno-serpente: 1, oggetto.avv-sogno-serpente-penna-della-guardiana: 1, rep.tuarmir: -1, scandalo: 0.5 }
      - testo: "Spiegare a Cerya perché hai combattuto"
        descrizione: "La serpe stringeva la bambina, la roccia si apriva. Da fuori poteva sembrare un'altra cosa."
        prova: { attributo: sociale, abilita: [persuasione, empatia], difficolta: Difficile }
        successo:
          titolo: Le dita verdi
          testo: |
            Cerya ti ascolta fino in fondo con la testa piegata. Poi ti prende la mano che tiene la penna e ci
            passa sopra le dita verdi, piano, fino alla goccia scura sul calamo. Lì si ferma e la sfrega una
            volta con il pollice. Le vecchie, dice, non raccontavano che cosa succede se nessuno canta, e
            adesso il villaggio lo saprà.
          pe: { persuasione: 5 }
          imposta: { avv-sogno-serpente.disegni: 0, avv-sogno-serpente.canto: 0, avv-sogno-serpente.segno: 0 }
          effetti: { avventura.sogno-serpente: 1, oggetto.avv-sogno-serpente-penna-della-guardiana: 1, rep.tuarmir: -0.5 }
        fallimento:
          titolo: La soglia del seccatoio
          testo: |
            Parli troppo, e a metà ti accorgi che stai parlando a voce alta, nel villaggio dove si parla
            piano. Sulle soglie vicine due donne rientrano in casa. Cerya non risponde. Si fa riaccompagnare
            dentro da Ilenia, e la porta del seccatoio si chiude.
          imposta: { avv-sogno-serpente.disegni: 0, avv-sogno-serpente.canto: 0, avv-sogno-serpente.segno: 0 }
          effetti: { avventura.sogno-serpente: 1, oggetto.avv-sogno-serpente-penna-della-guardiana: 1, rep.tuarmir: -1, scandalo: 0.5 }
      - testo: "Andartene da Tuarmir senza dire niente"
        descrizione: "Il villaggio ha già deciso che cosa pensare. Si può lasciarglielo pensare."
        esito:
          titolo: La scala grande
          testo: |
            Scendi la scala grande con la penna sotto il mantello, e le soglie si svuotano una alla volta
            mentre passi. A ogni gradino il calamo ti preme contro le costole. Dall'imbocco della gola ti
            volti una volta sola. Lo sperone rosso con la crepa nuova si vede anche da lì.
          imposta: { avv-sogno-serpente.disegni: 0, avv-sogno-serpente.canto: 0, avv-sogno-serpente.segno: 0 }
          effetti: { avventura.sogno-serpente: 1, oggetto.avv-sogno-serpente-penna-della-guardiana: 1, rep.tuarmir: -1 }
