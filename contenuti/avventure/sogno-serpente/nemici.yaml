# I nemici e gli scontri dell'Avventura «La bambina che sognava il serpente», tarati con
# `npx tsx scripts/simula-fine.ts avv-sogno-serpente-` sul profilo «fine contenuti» (docs/piano-avventure.md).
# - Il coraggio (profondità 0-1): il guardiano di pietra, una statua di serpente alato che si svolge dal muro e
#   sbarra il passo a chi mette mano all'arma (gregario, 77% a fine contenuti). Lo stesso scontro serve per il
#   guardiano caduto della gentilezza, che si può finire: si vince, e la porta resta chiusa.
# - La gentilezza (profondità 6-9): i corvi della roccia che beccano una capra caduta (gregari in coppia, 80%), e il
#   cinghiale ferito, che si può abbattere: lo scontro si vince, ma la porta resta chiusa (gregario, 76%).
# - Il cuore: Ulvessa, la guardiana della roccia rossa. La via giusta è proteggere il rito con tre prove Difficili
#   non di combattimento; combatterla resta possibile, ma è più dura di un boss delle Avventure (16% a fine
#   contenuti, Molto difficile, feriteSconfitta 4) e la vittoria costa cara anche dopo (spedizione.yaml, storia.yaml).
nemici:
  - id: avv-sogno-serpente-guardiano-di-pietra
    immagine: icone/snake-totem
    nome: Guardiano di pietra rossa
    descrizione: "Una statua di serpente alato scolpita nella roccia rossa, lunga quanto un carro, con le ali chiuse contro i fianchi. Si stacca dal muro solo davanti a chi ha la mano sull'arma, e colpisce con la testa come un ariete."
    attacco: 6
    difesa: 5
    difesaMentale: 6
    pf: 13
    danno: 5
    riduzione: 3
    iniziativa: 1

  - id: avv-sogno-serpente-corvo-della-roccia
    immagine: icone/crow-dive
    nome: Corvo della roccia
    descrizione: "Un corvo grande quanto un cane, con il becco grigio e le penne arruffate dal vento della gola. I corvi della roccia rossa aspettano che le bestie cadute smettano di muoversi, e a volte non aspettano."
    attacco: 6
    difesa: 5
    difesaMentale: 3
    pf: 10
    danno: 2
    riduzione: 3
    iniziativa: 4
    tratti: [animale]

  - id: avv-sogno-serpente-cinghiale-ferito
    immagine: bestiario/cinghiale-crudele-mutato
    nome: Cinghiale ferito
    descrizione: "Un cinghiale di montagna con una zampa davanti spezzata, che si regge su tre e tiene le zanne basse. Ha paura, e un cinghiale che ha paura carica."
    attacco: 6
    difesa: 4
    difesaMentale: 3
    pf: 14
    danno: 5
    riduzione: 3
    iniziativa: 2
    tratti: [animale]

  - id: avv-sogno-serpente-ulvessa
    immagine: icone/wyvern
    nome: Ulvessa
    descrizione: "La guardiana della roccia rossa, un serpente lungo quanto la scala grande di Tuarmir, con le scaglie rosse che sul collo diventano penne e due ali che aperte coprono la sala. È vecchia, durante la muta perde le penne a ogni verso del canto, e di solito aspetta che sia l'altro ad attaccare."
    attacco: 6
    difesa: 5
    difesaMentale: 6
    pf: 25
    danno: 4
    riduzione: 5
    iniziativa: 3
    tratti: [animale]

scontri:
  - { id: avv-sogno-serpente-il-guardiano, nome: "Il guardiano di pietra rossa", nemici: [avv-sogno-serpente-guardiano-di-pietra], feriteSconfitta: 2 }
  - { id: avv-sogno-serpente-i-corvi, nome: "I corvi della roccia", nemici: [avv-sogno-serpente-corvo-della-roccia, avv-sogno-serpente-corvo-della-roccia], feriteSconfitta: 2 }
  - { id: avv-sogno-serpente-il-cinghiale, nome: "Il cinghiale ferito", nemici: [avv-sogno-serpente-cinghiale-ferito], feriteSconfitta: 2 }
  - { id: avv-sogno-serpente-la-guardiana, nome: "Ulvessa, la guardiana della roccia rossa", nemici: [avv-sogno-serpente-ulvessa], feriteSconfitta: 4 }
