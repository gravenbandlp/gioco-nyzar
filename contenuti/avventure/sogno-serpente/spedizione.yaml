# Avventura 11, «La bambina che sognava il serpente»: la spedizione dentro la roccia rossa (avventura.sogno-serpente
# == 4). Si entra dalla crepa sotto il serpente scolpito (`avv-sogno-serpente-dentro-la-roccia`, presso Tuarmir) con
# una prova Media, con il vantaggio dell'incavo (`avv-sogno-serpente.segno`) o con una via da 2 rintocchi. La ritirata
# riporta in Superficie e azzera la profondità. Il tempio è una prova per fascia, quelle che Isel ha già passato
# davanti a te, e che lei aveva disegnato sui muri della sua stanza. Le stanze sono ripetibili, chiedono tutte
# avventura.sogno-serpente == 4 e valgono per tutta la loro fascia (una stanza superata non ricompare nella stessa
# visita, quindi a ogni profondità ne resta almeno una):
# - profondità 0-1, il coraggio (passi 1-2, prove Medie e Difficili): i guardiani di pietra (scontro), il ponte della
#   lingua, la sala delle ali;
# - profondità 2-3, il rispetto (passi 3-4, prove Difficili, una Media con un vantaggio): la porta che chiede (forzarla
#   costa Tormento), la coda che dorme, le maschere dei chiamati;
# - profondità 4-5, la generosità (passi 5-6, prove Difficili): i piedistalli e la mano di pietra chiedono un'offerta
#   vera (un consumabile, una reliquia, un reperto, o la tua mano), l'eco chiede una cosa detta;
# - profondità 5, la svolta non ripetibile `avv-sogno-serpente-la-parete-dei-chiamati` (avv-sogno-serpente.svolta):
#   la parete dipinta mostra il rito e chi lo protegge, e da sopra si sente cantare Isel;
# - profondità 6-9, la gentilezza (passi 7-10, prove Difficili e una Molto difficile o uno scontro per stanza, via
#   senza prova da 3 rintocchi): il cinghiale ferito (abbatterlo vince lo scontro e lascia chiusa la porta), la capra e
#   i corvi (scontro), la volpe nella crepa, il nido caduto, il guardiano caduto (anche lui si può abbattere, e la
#   porta resta chiusa).
# Ogni stanza ha una via senza prova da 2 rintocchi (3 nella gentilezza) con ½ di una negativa; chi fallisce prende
# ½ negativa e non sale.
# Il cuore a 10, `avv-sogno-serpente-ulvessa`: la guardiana fa la muta intorno a Isel, che canta la strofa della
# roccia. Eccezione approvata alla regola delle boss battle: si vince proteggendo il rito con tre prove Difficili non
# di combattimento, in tre scene di fila (la roccia che si apre, poi i seguiti `avv-sogno-serpente-il-padre` e
# `avv-sogno-serpente-l-ultima-strofa`), con vie in più per chi ha i disegni o la strofa. Combattere Ulvessa resta
# possibile, è Molto difficile (scontro avv-sogno-serpente-la-guardiana, nemici.yaml) e rompe il rito
# (avv-sogno-serpente.rito 2), con Tormento subito e la reputazione di Tuarmir dopo. Chi fallisce una prova o perde lo
# scontro torna in Superficie con una negativa e la spedizione da rifare.
# Origini: apprendista-raschiatore (la coda che dorme), allievo-di-torvessa (la parete dei chiamati).
aree:
  - id: avv-sogno-serpente
    immagine: ambientazione/gradone-rosso
    nome: Dentro la roccia rossa
    sommario: "Dietro la crepa sotto il serpente scolpito, la roccia rossa sopra Tuarmir è cava, e una galleria sale a spirale verso la cima."
    spedizione: { ritorno: superficie-fratturata, soglia: 10, stanze: 3 }
    testo: |
      La roccia rossa è vuota come una zucca seccata. Dalla crepa parte una galleria che sale a spirale nello
      sperone, scavata in una pietra color ruggine liscia e tiepida senza il segno di un attrezzo. Ogni tanto
      si allarga in una sala, e ogni sala ha una porta sola sempre più in alto.

      Sui muri ci sono serpenti alati in rilievo consumati all'altezza delle mani di un bambino. A tratti
      dall'alto scende la cadenza di una voce lontana che canta.

colonna:
  - { contesto: area, id: avv-sogno-serpente, musica: uncharted-dreams, ambiente: temple-mystical }

storylet:
  # ------------------------------------------------------------ l'ingresso, la crepa sotto il serpente
  - id: avv-sogno-serpente-dentro-la-roccia
    presso: tuarmir
    immagine: icone/cave-entrance
    titolo: Dentro la roccia
    sommario: "Garro tiene la corda sul ghiaione. La crepa sotto il serpente scolpito è larga una spalla, e dentro sale un'aria tiepida."
    luogo: Tuarmir, la crepa sotto la roccia rossa
    area: superficie-fratturata
    requisiti: [avventura.sogno-serpente == 4]
    testo: |
      Garro è seduto su un sasso davanti alla crepa e ti lega alla cintura un capo della corda con un nodo da
      scalpellino. La crepa è alta un uomo e larga una spalla, e dal buio sale un'aria tiepida che odora di
      pietra scaldata.

      Sopra la crepa il serpente con le ali china la testa verso di te, e sotto la testa c'è un incavo lucido
      all'altezza della fronte di un bambino.

      «Se la corda smette di tirare vengo su io e apro la roccia con la mazza» dice Garro.
    opzioni:
      - testo: "Infilarti nella crepa di fianco"
        descrizione: "Una spalla avanti e una dietro, la faccia contro la pietra, finché si allarga."
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Media }
        successo:
          titolo: Di fianco
          testo: |
            Entri di fianco, con la guancia contro la pietra tiepida, e dopo
            dieci passi la crepa si allarga in una galleria che sale. La corda
            dietro di te tira piano, come una mano sulla spalla.
          pe: { acrobazia: 2 }
          vai: avv-sogno-serpente
        fallimento:
          titolo: La spalla
          testo: |
            A metà la crepa si stringe, e ci resti incastrat{o|a} con una spalla
            dentro e l'altra fuori finché non togli il mantello. Passi lasciando
            la pelle del gomito sulla pietra rossa.
          effetti: { ferite: 0.5 }
          vai: avv-sogno-serpente
      - testo: "Posare la fronte nell'incavo, come ha fatto Isel"
        descrizione: "L'incavo è lucido di fronti. Chi è entrato prima di te ha chiesto così."
        requisiti: [avv-sogno-serpente.segno >= 1]
        esito:
          titolo: La pietra che si scosta
          testo: |
            Ti inginocchi e appoggi la fronte nell'incavo, che è tiepido come la
            fronte di un altro. Quando ti rialzi la crepa è più larga di un
            palmo. Garro si alza in piedi dietro di te senza dire niente, e tu
            entri senza toccare le pareti.
          pe: { resilienza: 2 }
          vai: avv-sogno-serpente
      - testo: "Farti allargare la crepa da Garro"
        descrizione: "È lo scalpellino migliore della gola, ma questa pietra la conosce poco, e ci vuole tempo."
        costo: 2
        esito:
          titolo: Lo scalpello
          testo: |
            Garro lavora sulla crepa per mezza mattina, imprecando contro una
            pietra che non si lascia segnare. Alla fine stacca una scheggia lunga
            dal bordo, abbastanza per farti passare, e sopra di voi il serpente
            scolpito perde la punta di un'ala.
          effetti: { tormento: 0.5 }
          vai: avv-sogno-serpente

  # ============================================================ 0-1 · il coraggio
  - id: avv-sogno-serpente-i-guardiani-di-pietra
    immagine: icone/snake-totem
    titolo: I guardiani di pietra
    sommario: "Il corridoio passa fra due serpenti di pietra rossa con le ali chiuse. Quando ti avvicini girano la testa."
    luogo: Dentro la roccia rossa, il corridoio dei guardiani
    area: avv-sogno-serpente
    ripetibile: true
    requisiti: [avventura.sogno-serpente == 4, profondita.avv-sogno-serpente >= 0, profondita.avv-sogno-serpente <= 1]
    testo: |
      Il corridoio passa fra due serpenti scolpiti nel muro con le ali chiuse e la testa appoggiata a terra.
      Al tuo primo passo fra loro le teste si alzano con un rumore di macina e si girano finché ti guardano
      con gli occhi vuoti.

      Fra le due teste le impronte di Isel vanno dritte nel mezzo della polvere.

      {intimidire Media} Le teste si sono alzate quando hai portato la mano alla cintura, e una cosa di pietra
      che risponde a un gesto sa leggerlo.
    opzioni:
      - testo: "Passare in mezzo a mani vuote, senza abbassare gli occhi"
        descrizione: "Isel è passata dritta. Una bambina di nove anni può farlo, e tu dovresti riuscirci."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Difficile }
        successo:
          titolo: In mezzo
          testo: |
            Cammini fra le teste con le mani aperte lungo i fianchi, e le guardi
            una alla volta finché non le hai passate. Alle tue spalle si
            riabbassano sul pavimento con lo stesso rumore di macina.
          pe: { resilienza: 3 }
          effetti: { profondita.avv-sogno-serpente: 1 }
        fallimento:
          titolo: Gli occhi bassi
          testo: |
            A metà strada abbassi gli occhi, e una testa ti arriva contro il
            petto come un sacco di sabbia. Ti ritrovi sedut{o|a} all'inizio del
            corridoio, e le teste ti guardano ancora.
          effetti: { tormento: 0.5 }
      - testo: "Mettere i piedi nelle impronte di Isel"
        descrizione: "Dove è passata lei, i guardiani l'hanno lasciata passare."
        prova: { attributo: fisico, abilita: [acrobazia, furtivita], difficolta: Media }
        successo:
          titolo: I piedi piccoli
          testo: |
            Metti la punta dello stivale in ogni impronta, a passi corti da
            bambina, e le teste ti seguono senza muoversi oltre. Arrivi in fondo
            al corridoio con i polpacci che bruciano.
          pe: { acrobazia: 2 }
          effetti: { profondita.avv-sogno-serpente: 1 }
        fallimento:
          titolo: Il passo lungo
          testo: |
            Al quinto passo il piede ti va lungo e manca l'impronta. Una testa ti
            colpisce di lato sulla coscia, e torni indietro zoppicando.
          effetti: { ferite: 0.5 }
      - testo: "Mettere mano all'arma"
        descrizione: "Se rispondono al gesto, almeno lo fanno per primi."
        combattimento: avv-sogno-serpente-il-guardiano
        vittoria:
          titolo: La pietra spaccata
          testo: |
            Il guardiano si stacca dal muro e ti viene addosso, e lo colpisci
            finché la testa non si spacca in due pezzi rossi. L'altro torna giù
            sul pavimento da solo. Passi fra le schegge, e ti accorgi che le
            impronte di Isel non le hai più guardate.
          effetti: { profondita.avv-sogno-serpente: 1 }
        sconfitta:
          titolo: La testa di pietra
          testo: |
            La testa di pietra ti colpisce al petto e ti butta fuori dal
            corridoio. I guardiani tornano a posare la testa a terra.
          effetti: { tormento: 0.5 }
      - testo: "Chinare la fronte davanti ai guardiani, come davanti alla crepa"
        descrizione: "Il serpente sopra la crepa chinava la testa verso chi entrava. Questi la alzano."
        requisiti: [avv-sogno-serpente.segno >= 1]
        esito:
          titolo: Il saluto
          testo: |
            Ti inginocchi all'inizio del corridoio e posi la fronte sul pavimento.
            Quando ti rialzi le due teste sono di nuovo a terra, e passi fra loro
            senza che si muovano.
          pe: { resilienza: 2 }
          effetti: { profondita.avv-sogno-serpente: 1 }
      - testo: "Passare a occhi chiusi, contando i passi"
        descrizione: "Quello che non vedi non ti guarda. Ci vuole molto, e lo senti lo stesso."
        costo: 2
        esito:
          titolo: Quaranta passi
          testo: |
            Chiudi gli occhi e conti i passi a voce bassa. Al ventesimo senti
            l'aria che si sposta davanti alla faccia, e al trentesimo un'altra
            volta. Al quarantesimo apri gli occhi, e il corridoio è finito.
          effetti: { profondita.avv-sogno-serpente: 1, tormento: 0.5 }

  - id: avv-sogno-serpente-il-ponte-della-lingua
    immagine: ambientazione/gradone-rosso
    titolo: Il ponte della lingua
    sommario: "La galleria finisce sopra un pozzo. Dall'altra parte la si raggiunge per un ponte di pietra lungo e stretto, biforcuto in punta."
    luogo: Dentro la roccia rossa, il pozzo
    area: avv-sogno-serpente
    ripetibile: true
    requisiti: [avventura.sogno-serpente == 4, profondita.avv-sogno-serpente >= 0, profondita.avv-sogno-serpente <= 1]
    testo: |
      La galleria finisce sull'orlo di un pozzo buio e riprende dall'altra parte. Per arrivarci c'è soltanto
      uno stretto ponte di pietra rossa scolpito come la lingua di un serpente, che verso la fine si biforca e
      lascia un salto di un passo e mezzo fino all'orlo.

      Dal pozzo sale un soffio tiepido e regolare che fa ondeggiare la fiamma della lanterna.

      {atletica Media} Un passo e mezzo si salta anche da fermi, e il difficile è arrivare sulla punta con il
      soffio che ti spinge di lato.
    opzioni:
      - testo: "Camminare sulla lingua e saltare dalla punta"
        descrizione: "Un piede davanti all'altro, e poi il salto, senza fermarsi a guardare giù."
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Media }
        successo:
          titolo: La punta
          testo: |
            Cammini sulla lingua con le braccia larghe, e arrivato alla punta
            salti senza pensarci. Atterri sull'altro orlo in ginocchio, con la
            lanterna ancora accesa.
          pe: { acrobazia: 2 }
          effetti: { profondita.avv-sogno-serpente: 1 }
        fallimento:
          titolo: Il soffio
          testo: |
            A metà ponte il soffio ti prende di lato e ti butti a cavalcioni
            sulla pietra per non cadere. Torni indietro così, strisciando, con le
            cosce graffiate.
          effetti: { ferite: 0.5 }
      - testo: "Aspettare fra un soffio e l'altro e passare al momento giusto"
        descrizione: "Il soffio sale e cala come il fiato di qualcuno che dorme. Fra un soffio e l'altro c'è calma."
        prova: { attributo: mentale, abilita: [percezione, resilienza], difficolta: Difficile }
        successo:
          titolo: Fra due soffi
          testo: |
            Conti i soffi seduto sull'orlo finché li senti arrivare prima che
            arrivino. Poi parti appena ne finisce uno, e sei dall'altra parte
            prima che cominci il successivo.
          pe: { percezione: 3 }
          effetti: { profondita.avv-sogno-serpente: 1 }
        fallimento:
          titolo: Il conto sbagliato
          testo: |
            Parti al momento sbagliato, e il soffio ti trova sulla punta. Ti
            aggrappi alla lingua con le dita e resti appes{o|a} finché passa. Poi
            torni indietro, e ti siedi lontano dall'orlo.
          effetti: { tormento: 0.5 }
      - testo: "Legarti la corda alla vita e passare a cavalcioni"
        descrizione: "Seduti sulla pietra non si cade. Si va avanti con le mani, e si arriva in fondo con le gambe a pezzi."
        costo: 2
        esito:
          titolo: A cavalcioni
          testo: |
            Passi a cavalcioni, spingendoti avanti con le mani, e alla punta ti
            alzi in piedi soltanto per il salto. Arrivi dall'altra parte con
            l'interno delle cosce scorticato dalla pietra.
          effetti: { profondita.avv-sogno-serpente: 1, ferite: 0.5 }

  - id: avv-sogno-serpente-la-sala-delle-ali
    immagine: icone/feathered-wing
    titolo: La sala delle ali
    sommario: "Una sala buia dove qualcosa di grande si muove sopra la testa. Ogni volta che passa, la lanterna si spegne."
    luogo: Dentro la roccia rossa, la sala buia
    area: avv-sogno-serpente
    ripetibile: true
    requisiti: [avventura.sogno-serpente == 4, profondita.avv-sogno-serpente >= 0, profondita.avv-sogno-serpente <= 1]
    testo: |
      La sala è più alta di quanto la lanterna riesca a illuminare. Appena entri qualcosa ti passa sopra la
      testa con un rumore di panni stesi al vento, e la fiamma si piega e si spegne. Quando la riaccendi ci
      sono tre penne rosse sul pavimento intorno ai tuoi piedi.

      La porta dall'altra parte la intravedi appena, a una trentina di passi.

      {natura Media fallita} Provi a capire che uccello faccia un rumore così, e la memoria ti offre soltanto
      il pollaio di una zia che non hai mai avuto.
    opzioni:
      - testo: "Attraversare la sala al buio, con la lanterna spenta"
        descrizione: "Se la luce la disturba, si passa senza luce. Trenta passi."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Media }
        successo:
          titolo: Al buio
          testo: |
            Spegni tu la lanterna e cammini nel buio con le mani avanti. Il
            rumore d'ali ti passa sopra altre due volte, sempre più in alto.
            Alla terza le tue mani toccano la pietra della porta.
          pe: { resilienza: 2 }
          effetti: { profondita.avv-sogno-serpente: 1 }
        fallimento:
          titolo: Le mani nel buio
          testo: |
            Al buio perdi la direzione, e quando il rumore d'ali ti passa sopra
            ti butti a terra. Ti rialzi con le ginocchia sbucciate e la porta
            alle spalle, quella da cui sei entrat{o|a}.
          effetti: { tormento: 0.5 }
      - testo: "Seguire il filo d'aria che esce dalla porta"
        descrizione: "Una porta aperta tira l'aria. Al buio si sente sulla faccia, se si sta attenti."
        prova: { attributo: fisico, abilita: [furtivita, percezione], difficolta: Difficile }
        successo:
          titolo: Il filo d'aria
          testo: |
            Ti fermi finché senti sulla guancia un filo d'aria più fresca, e lo
            segui a passi lenti, con la faccia girata. Ti porta dritto alla
            porta, mentre sopra di te le ali passano senza fermarsi.
          pe: { furtivita: 3 }
          effetti: { profondita.avv-sogno-serpente: 1 }
        fallimento:
          titolo: Il muro
          testo: |
            Segui il filo sbagliato e finisci con il naso contro il muro, in un
            angolo dove il rumore d'ali rimbomba. Torni indietro tastando la
            pietra.
          effetti: { tormento: 0.5 }
      - testo: "Riaccendere la lanterna ogni volta che si spegne"
        descrizione: "Si va avanti tre passi alla volta. Ci vuole tempo, e la pazienza di non guardare in su."
        costo: 2
        esito:
          titolo: Tre passi alla volta
          testo: |
            Riaccendi la lanterna otto volte, e otto volte qualcosa te la spegne
            passando. All'ultima sei davanti alla porta, con le dita annerite
            dall'acciarino e una penna rossa infilata nel colletto senza sapere
            come.
          effetti: { profondita.avv-sogno-serpente: 1, tormento: 0.5 }

  # ============================================================ 2-3 · il rispetto
  - id: avv-sogno-serpente-la-porta-che-chiede
    immagine: icone/door-ring-handle
    titolo: La porta che chiede
    sommario: "Una porta di pietra senza maniglia, con una mano scolpita in rilievo all'altezza di un bambino."
    luogo: Dentro la roccia rossa, la porta della mano
    area: avv-sogno-serpente
    ripetibile: true
    requisiti: [avventura.sogno-serpente == 4, profondita.avv-sogno-serpente >= 2, profondita.avv-sogno-serpente <= 3]
    testo: |
      La galleria finisce contro una porta di pietra rossa senza maniglia. All'altezza della mano di un
      bambino c'è una mano scolpita in rilievo, ferma nel gesto di bussare, e sotto la pietra è consumata in
      tre punti uno sopra l'altro.

      {galateo Difficile} Una porta che si apre a chi bussa non si apre a chi bussa e basta. Dopo aver bussato
      si dice chi si è e si aspetta la risposta senza mettere il piede avanti.
    opzioni:
      - testo: "Bussare, dire il tuo nome e chiedere permesso"
        descrizione: "Come si fa sulla soglia di una casa dove non si è mai stati."
        prova: { attributo: sociale, abilita: [galateo, empatia], difficolta: Difficile }
        successo:
          titolo: Il permesso
          testo: |
            Bussi tre volte, dici il tuo nome e chiedi di passare, a voce bassa
            come a Tuarmir. Poi aspetti con le mani in vista. Dopo un tempo lungo
            la porta scorre di lato dentro la parete, senza un rumore.
          pe: { galateo: 3 }
          effetti: { profondita.avv-sogno-serpente: 1 }
        fallimento:
          titolo: La porta muta
          testo: |
            Bussi e chiedi di passare, ma la porta resta ferma. Allora batti
            più forte, e capisci da sol{o|a} che è peggio. Ti siedi contro il muro
            con le nocche che ti fanno male.
          effetti: { tormento: 0.5 }
      - testo: "Bussare come nei disegni di Isel"
        descrizione: "Nella stanza di Isel la mano sopra la porta era disegnata tre volte, sempre più in basso."
        requisiti: [avv-sogno-serpente.disegni >= 1]
        prova: { attributo: sociale, abilita: [galateo, empatia], difficolta: Media }
        successo:
          titolo: Tre colpi, sempre più in basso
          testo: |
            Bussi tre volte, ogni colpo più in basso del precedente, nei tre
            punti consumati, e poi chiedi di passare. La porta scorre di lato
            prima che tu abbia finito di chiedere.
          pe: { galateo: 2 }
          effetti: { profondita.avv-sogno-serpente: 1 }
        fallimento:
          titolo: Il colpo di troppo
          testo: |
            Bussi tre volte, e per scrupolo ne aggiungi un quarto. La porta resta
            chiusa, e il disegno di Isel, sul foglio, adesso ti sembra fatto
            apposta per prenderti in giro.
          effetti: { tormento: 0.5 }
      - testo: "Forzarla con la spalla"
        descrizione: "È pietra, e la pietra scorre. Chi entra in una casa senza essere invitato però se lo porta dietro."
        prova: { attributo: fisico, abilita: atletica, difficolta: Difficile }
        successo:
          titolo: La porta forzata
          testo: |
            Pianti la spalla contro la pietra e spingi finché la porta scorre di
            un palmo, e poi di un braccio. Passi. Dall'altra parte ti accorgi che
            stai camminando in punta di piedi, e non riesci a smettere.
          pe: { atletica: 3 }
          effetti: { profondita.avv-sogno-serpente: 1, tormento: 1 }
        fallimento:
          titolo: La spalla contro la pietra
          testo: |
            Spingi finché la spalla ti manda una fitta fino al gomito. La porta
            non si muove di un dito, e dall'alto la voce che canta si interrompe
            per un momento.
          effetti: { ferite: 0.5, tormento: 0.5 }
      - testo: "Sederti davanti alla porta e aspettare"
        descrizione: "A Tuarmir, quando una porta non si apre, si aspetta sulla soglia finché qualcuno si ricorda di te."
        costo: 2
        esito:
          titolo: Sulla soglia
          testo: |
            Ti siedi davanti alla porta con la schiena contro il muro e aspetti
            per un tempo che la lanterna misura in olio. Quando la porta scorre
            di lato ti sei quasi addormentat{o|a}, e ti alzi con le gambe rigide.
          effetti: { profondita.avv-sogno-serpente: 1, tormento: 0.5 }

  - id: avv-sogno-serpente-la-coda-che-dorme
    immagine: icone/snake-spiral
    titolo: La coda che dorme
    sommario: "Attraverso la sala passa un corpo enorme coperto di scaglie rosse, che entra da un muro ed esce dall'altro. Si alza e si abbassa piano."
    luogo: Dentro la roccia rossa, la sala della coda
    area: avv-sogno-serpente
    ripetibile: true
    requisiti: [avventura.sogno-serpente == 4, profondita.avv-sogno-serpente >= 2, profondita.avv-sogno-serpente <= 3]
    testo: |
      In mezzo alla sala passa da un muro all'altro un corpo grosso come un tronco di quercia e coperto di
      scaglie rosse. Si alza e si abbassa piano, e le scaglie fanno un rumore di foglie secche. La porta è
      dall'altra parte oltre la coda.

      Dove la coda passa più bassa c'è un'impronta di zoccolo nella polvere e poi più niente.

      {natura Difficile} Le scaglie vicine al muro di destra sono più piccole e lisce, perché verso la punta
      la coda è giovane e sente di più.
    opzioni:
      - testo: "Scavalcarla senza toccarla"
        descrizione: "Nel punto più basso è alta come un tavolo. Si salta, e non si appoggia la mano."
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Difficile }
        successo:
          titolo: Senza toccare
          testo: |
            Aspetti che la coda si abbassi e la salti con le mani strette al
            petto. Ti passa sotto con un fruscio, e atterri dall'altra parte su
            un piede solo. La coda continua a salire e a scendere come prima.
          pe: { acrobazia: 3 }
          effetti: { profondita.avv-sogno-serpente: 1 }
        fallimento:
          titolo: La mano sulle scaglie
          testo: |
            A metà salto la coda si alza, e ci appoggi la mano per non cadere. Le
            scaglie sono calde. Tutta la coda si contrae una volta, da un muro
            all'altro, e tu torni indietro con il cuore in gola.
          effetti: { tormento: 0.5 }
      - testo: "Passarle sotto dove si inarca"
        descrizione: "Dove esce dal muro di destra la coda fa un arco. Sotto ci passa un uomo carponi, se non ha fretta."
        prova: { attributo: fisico, abilita: furtivita, difficolta: Difficile }
        successo:
          titolo: Sotto l'arco
          testo: |
            Passi sotto l'arco carponi, con la schiena a un palmo dalle scaglie,
            e senti il caldo che ne scende come da una stufa. Dall'altra parte ti
            rialzi piano, e la coda non ha cambiato ritmo.
          pe: { furtivita: 3 }
          effetti: { profondita.avv-sogno-serpente: 1 }
        fallimento:
          titolo: L'arco che scende
          testo: |
            A metà dell'arco la coda si abbassa e ti schiaccia contro il
            pavimento con tutto il suo calore, finché non si rialza. Torni
            indietro carponi da dove eri venut{o|a}, con le costole che ti fanno
            male a ogni movimento.
          effetti: { ferite: 0.5 }
      - testo: "Seguirla lungo il muro fino al punto dove si assottiglia"
        descrizione: "Verso la punta è più stretta, ma per arrivarci bisogna camminarle accanto per tutta la sala, e lì sente di più."
        costo: 2
        esito:
          titolo: Il punto stretto
          testo: |
            Cammini lungo la coda fino al muro di destra, dove è grossa quanto
            una gamba, e la scavalchi con un passo lungo. Ci metti molto, e per
            tutto il tempo hai la sensazione che la coda sappia dove sei.
          effetti: { profondita.avv-sogno-serpente: 1, tormento: 0.5 }
      - testo: "Passarle sopra appeso alla volta, come sulle piattaforme"
        descrizione: "Sulle piattaforme della Cicatrice si passa sopra quello che non si deve toccare, appesi a una corda e a due appigli."
        quando: [origine.apprendista-raschiatore >= 1]
        prova: { attributo: fisico, abilita: atletica, difficolta: Media }
        successo:
          titolo: "Appes{o|a}"
          testo: |
            Lanci la corda a un rilievo della volta e passi sopra la coda appeso
            a braccia, con le gambe raccolte, come sopra un nastro di macchina
            acceso. La coda ti scorre sotto senza accorgersi di te.
          pe: { atletica: 3 }
          effetti: { profondita.avv-sogno-serpente: 1 }
        fallimento:
          titolo: Il rilievo che si sbriciola
          testo: |
            Il rilievo della volta si sbriciola sotto il peso, e cadi di
            schiena accanto alla coda, che si ferma per un battito. Torni
            indietro piano, senza voltarti.
          effetti: { ferite: 0.5 }

  - id: avv-sogno-serpente-le-maschere-dei-chiamati
    immagine: ambientazione/le-maschere
    titolo: Le maschere dei chiamati
    sommario: "In una fila di nicchie sono appese maschere di stoffa grigia, piccole, per facce di bambini. Una è caduta."
    luogo: Dentro la roccia rossa, la galleria delle nicchie
    area: avv-sogno-serpente
    ripetibile: true
    requisiti: [avventura.sogno-serpente == 4, profondita.avv-sogno-serpente >= 2, profondita.avv-sogno-serpente <= 3]
    testo: |
      La galleria sale fra due file di nicchie, e in ognuna è appesa una maschera da bambino di stoffa grigia
      come quelle di Tuarmir. Le prime sono così vecchie che la stoffa è dura come cuoio, e le ultime sono
      quasi nuove. A metà fila una è caduta dal chiodo ed è a terra.

      La porta in fondo è aperta, e per arrivarci si passa davanti a tutte le nicchie.

      {accademiche Difficile} Le più vecchie sono cucite a punto lungo e le più nuove a punto piccolo come la
      tua. La maschera caduta ha un punto di mezzo, e c'è un chiodo vuoto per ogni stile.
    opzioni:
      - testo: "Rimettere la maschera caduta al suo chiodo"
        descrizione: "Bisogna capire qual è il suo. Appenderla al chiodo sbagliato è peggio che lasciarla a terra."
        prova: { attributo: mentale, abilita: [accademiche, percezione], difficolta: Difficile }
        successo:
          titolo: Il chiodo giusto
          testo: |
            Confronti il punto della maschera con quello delle vicine finché
            trovi il chiodo vuoto fra due maschere cucite nello stesso modo. La
            appendi, e la galleria ti sembra più dritta. Passi davanti alle
            altre senza toccarle.
          pe: { accademiche: 3 }
          effetti: { profondita.avv-sogno-serpente: 1 }
        fallimento:
          titolo: Il chiodo sbagliato
          testo: |
            La appendi al chiodo sbagliato, e la maschera vicina cade a terra a
            faccia in giù. Rimetti tutte e due dove le hai trovate e torni
            indietro, con la sensazione di aver fatto un torto a qualcuno.
          effetti: { tormento: 0.5 }
      - testo: "Passare davanti a tutte, salutandole una per una"
        descrizione: "A Tuarmir si saluta chiunque si incontri sulla scala grande, anche chi non risponde."
        prova: { attributo: sociale, abilita: [galateo, empatia], difficolta: Difficile }
        successo:
          titolo: Il saluto a ognuna
          testo: |
            Ti fermi davanti a ogni nicchia e chini la testa, a voce bassissima,
            come sulla scala grande di Tuarmir. Arrivato alla maschera caduta
            la raccogli e la posi nella nicchia vuota senza appenderla. Quando
            arrivi alla porta le hai salutate tutte, una per una.
          pe: { empatia: 3 }
          effetti: { profondita.avv-sogno-serpente: 1 }
        fallimento:
          titolo: Il saluto dimenticato
          testo: |
            Saluti le prime dieci e poi ti distrai, e ne salti una. Torni
            indietro a salutarla, e alla fine non sai più quali hai salutato e
            quali no, e devi ricominciare dal fondo della galleria.
          effetti: { tormento: 0.5 }
      - testo: "Contare le maschere con la strofa della roccia"
        descrizione: "La canzone dei punti conta i punti come si contano le pecore. Le maschere sono cucite a punti."
        requisiti: [avv-sogno-serpente.canto >= 1]
        esito:
          titolo: La strofa contata
          testo: |
            Canti la strofa della roccia sottovoce, una maschera per verso, e
            alla fine della strofa sei alla maschera caduta. La rimetti al
            chiodo vuoto senza pensarci. La porta in fondo è più vicina di come
            sembrava.
          pe: { espressivita: 2 }
          effetti: { profondita.avv-sogno-serpente: 1 }
      - testo: "Passare in silenzio, rasente al muro, senza toccare niente"
        descrizione: "Le maschere non si toccano e non si guardano. Si passa piano, e la galleria è lunga."
        costo: 2
        esito:
          titolo: Rasente al muro
          testo: |
            Passi rasente al muro opposto, senza guardare le nicchie. La
            maschera caduta resta a terra, e quando sei alla porta ti accorgi
            che hai contato i tuoi passi per non contare le maschere.
          effetti: { profondita.avv-sogno-serpente: 1, tormento: 0.5 }

  # ============================================================ 4-5 · la generosità
  - id: avv-sogno-serpente-i-piedistalli
    immagine: icone/star-altar
    titolo: I piedistalli
    sommario: "Una fila di piedistalli di pietra, ognuno con un'offerta vecchia sopra. L'ultimo è vuoto, e la porta dietro è chiusa."
    luogo: Dentro la roccia rossa, la sala dei piedistalli
    area: avv-sogno-serpente
    ripetibile: true
    requisiti: [avventura.sogno-serpente == 4, profondita.avv-sogno-serpente >= 4, profondita.avv-sogno-serpente <= 5]
    testo: |
      Lungo il muro della sala ci sono otto piedistalli di pietra rossa con un'offerta ciascuno. Ci sono una
      trottola di legno e un pettine d'osso, e un mazzo di salvia di cento primavere che non si è mai
      sbriciolato. Sul settimo c'è un nastro da capelli annodato a fiocco. L'ottavo è vuoto, e dietro la porta
      è chiusa.

      {empatia Media} Il nastro è annodato con cura da una mano piccola, perché Isel ha lasciato la cosa a cui
      teneva di più.

      {politica-ed-economia Media fallita} Calcoli quanto varrebbe in città quella salvia, e la cifra ti mette
      di buon umore.
    opzioni:
      - testo: "Posare sul piedistallo un vasetto d'unguento"
        descrizione: "Chiude i tagli in una notte. In un posto come questo, è una cosa che servirà."
        requisiti: [unguento >= 1]
        esito:
          titolo: L'unguento
          testo: |
            Posi il vasetto al centro del piedistallo vuoto, con la cera verde
            ancora intatta, e lo lasci andare. La porta dietro scorre di lato
            prima che tu abbia ritirato la mano.
          effetti: { profondita.avv-sogno-serpente: 1, unguento: -1 }
      - testo: "Posare sul piedistallo le tue bende"
        descrizione: "Il rotolo buono, quello che tieni per quando la cosa va male."
        requisiti: [bende >= 1]
        esito:
          titolo: Le bende
          testo: |
            Posi il rotolo sul piedistallo, e ti accorgi che te ne pentirai
            prima di stasera. La porta scorre di lato lo stesso, e forse
            proprio per questo.
          effetti: { profondita.avv-sogno-serpente: 1, bende: -1 }
      - testo: "Posare sul piedistallo un frammento inciso"
        descrizione: "Un pezzo di metallo dei Precursori con un segno sopra. In città lo pagherebbero."
        requisiti: [reliquie.frammento-inciso >= 1]
        esito:
          titolo: Il frammento
          testo: |
            Il frammento sta sul piedistallo accanto al nastro di Isel come
            una moneta su una tomba, e dopo un momento la porta scorre di
            lato.
          effetti: { profondita.avv-sogno-serpente: 1, reliquie.frammento-inciso: -1 }
      - testo: "Capire che cosa chiede davvero il piedistallo"
        descrizione: "Una trottola, un pettine, un nastro. Nessuna di queste cose vale qualcosa per qualcun altro."
        prova: { attributo: sociale, abilita: [empatia, percezione], difficolta: Difficile }
        successo:
          titolo: La cosa tua
          testo: |
            Guardi le offerte una per una, e capisci che sono le cose a cui
            teneva chi le ha portate. Ti frughi addosso finché trovi la tua,
            una cosa piccola che non vale niente per nessun altro. Quando la
            posi sull'ottavo piedistallo, la porta dietro si apre.
          pe: { empatia: 3 }
          effetti: { profondita.avv-sogno-serpente: 1 }
        fallimento:
          titolo: Le monete
          testo: |
            Posi sul piedistallo una manciata di monete. Scivolano giù una per
            una e rotolano sul pavimento, come se la pietra fosse inclinata. Le
            raccogli, con la faccia che scotta.
          effetti: { tormento: 0.5 }
      - testo: "Lasciarci il pane e l'acqua che avevi per la salita"
        descrizione: "Non è molto, ed è tutto quello che hai da mangiare quassù."
        costo: 2
        esito:
          titolo: Il pane
          testo: |
            Posi sul piedistallo il fagotto con il pane e la borraccia, e la
            porta si apre. Per il resto della salita la pancia ti brontola così
            forte che la senti rimbombare nelle gallerie.
          effetti: { profondita.avv-sogno-serpente: 1, ferite: 0.5 }

  - id: avv-sogno-serpente-la-mano-di-pietra
    immagine: icone/open-palm
    titolo: La mano di pietra
    sommario: "Dal muro esce una mano di pietra grande come una botte, con il palmo in su, e chiude il passaggio."
    luogo: Dentro la roccia rossa, la mano
    area: avv-sogno-serpente
    ripetibile: true
    requisiti: [avventura.sogno-serpente == 4, profondita.avv-sogno-serpente >= 4, profondita.avv-sogno-serpente <= 5]
    testo: |
      Dove la galleria si stringe, dal muro di sinistra esce una mano di pietra rossa grande come una botte
      che chiude il passaggio. Il palmo vuoto è aperto verso l'alto, e fra le dita e la volta resta soltanto
      uno spazio stretto.

      {medicina Media} Le dita sono piegate al punto giusto per chiudersi su qualcosa. Una mano che aspetta di
      prendere ha la stessa forma di una che aspetta di stringerne un'altra.
    opzioni:
      - testo: "Mettere nel palmo una fiala di tonico"
        descrizione: "Quella che tieni per la ferita brutta."
        requisiti: [tonico >= 1]
        esito:
          titolo: La fiala
          testo: |
            Posi la fiala al centro del palmo. Le dita di pietra si chiudono
            piano sopra di lei senza romperla. Poi la mano si ritira nel muro
            con un rumore di macina, e il passaggio è libero.
          effetti: { profondita.avv-sogno-serpente: 1, tonico: -1 }
      - testo: "Mettere nel palmo un reperto sigillato"
        descrizione: "Un guscio dei Precursori che non hai ancora aperto. Chissà che cosa c'era dentro."
        requisiti: [reperto.sigillato >= 1]
        esito:
          titolo: Il guscio
          testo: |
            Il reperto rotola nel palmo e si ferma nel mezzo. Le dita si
            chiudono sopra, e la mano si ritira nel muro. Non saprai mai che
            cosa c'era dentro, e ti accorgi che ti dispiace più del previsto.
          effetti: { profondita.avv-sogno-serpente: 1, reperto.sigillato: -1 }
      - testo: "Mettere nel palmo la tua mano"
        descrizione: "Un palmo aperto si può riempire anche così. Se le dita si chiudono, però, sono di pietra."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Difficile }
        successo:
          titolo: La stretta
          testo: |
            Posi la mano nel palmo di pietra e lasci che le dita si chiudano.
            Stringono quanto basta e poi si riaprono, tiepide come una mano
            vera. La mano si ritira nel muro, e tu hai le dita intere e un
            formicolio fino al gomito.
          pe: { resilienza: 3 }
          effetti: { profondita.avv-sogno-serpente: 1 }
        fallimento:
          titolo: La mano ritirata
          testo: |
            Quando le dita di pietra cominciano a chiudersi ritiri la mano di
            scatto, e le dita si fermano a metà. La mano resta lì chiusa a
            pugno, e il passaggio con lei.
          effetti: { tormento: 0.5 }
      - testo: "Mettere nel palmo una cella carica"
        descrizione: "Un cristallo piccolo, pieno, per il giorno in cui un reperto si spegne nel momento sbagliato."
        requisiti: [cella >= 1]
        esito:
          titolo: La cella
          testo: |
            Posi la cella nel palmo, e la sua luce azzurra si specchia sulla
            pietra rossa. Le dita si chiudono sopra di lei come su un uccellino,
            e la mano si ritira nel muro con la luce che filtra fra le nocche.
          effetti: { profondita.avv-sogno-serpente: 1, cella: -1 }
      - testo: "Arrampicarti fra le dita e la volta"
        descrizione: "Lo spazio è stretto, e le dita sono lisce. Ci si passa lasciando qualcosa di sé sulla pietra."
        costo: 2
        esito:
          titolo: Fra le dita
          testo: |
            Ti infili fra le dita di pietra e la volta con il mantello in mano,
            e ci metti tanto che la lanterna si consuma di un dito. Dall'altra
            parte hai le costole scorticate e un bottone in meno.
          effetti: { profondita.avv-sogno-serpente: 1, ferite: 0.5 }

  - id: avv-sogno-serpente-l-eco-che-chiede
    immagine: icone/echo-ripples
    titolo: L'eco che chiede
    sommario: "In una sala rotonda l'eco non ripete quello che dici. Risponde, e chiede qualcosa in cambio."
    luogo: Dentro la roccia rossa, la sala dell'eco
    area: avv-sogno-serpente
    ripetibile: true
    requisiti: [avventura.sogno-serpente == 4, profondita.avv-sogno-serpente >= 4, profondita.avv-sogno-serpente <= 5]
    testo: |
      La sala è rotonda e ha la volta a cupola. Entrando ti scappa un colpo di tosse, e invece dell'eco dalla
      cupola scende una voce simile alla tua.

      «E a me?» chiede, e da lì in poi risponde con la stessa domanda a qualunque cosa dici. La porta sul lato
      opposto non si vede finché non ci sei davanti.

      {espressivita Media} In un teatro una sala così non la vorrebbe nessuno, perché il pubblico è uno solo e
      vuole essere pagato.
    opzioni:
      - testo: "Cantarle qualcosa che ti piace"
        descrizione: "Una canzone tua, non una per la gente. La voce che hai, non quella che vorresti."
        prova: { attributo: sociale, abilita: espressivita, difficolta: Difficile }
        successo:
          titolo: La canzone tua
          testo: |
            Canti una canzone che ti cantavano da piccol{o|a}, o che hai imparato
            dopo e ti sembra la stessa cosa. La cupola la tiene per sé senza
            restituirne una nota, e intanto la porta dall'altra parte si apre.
          pe: { espressivita: 3 }
          effetti: { profondita.avv-sogno-serpente: 1 }
        fallimento:
          titolo: La canzone degli altri
          testo: |
            Canti la canzone delle osterie, quella che piace a tutti. L'eco te
            la restituisce intera e più forte, finché ti tappi le orecchie. «E a
            me?» chiede alla fine.
          effetti: { tormento: 0.5 }
      - testo: "Raccontarle un ricordo vero"
        descrizione: "Uno di quelli che non racconti. La cupola li tiene, e non li restituisce."
        prova: { attributo: sociale, abilita: empatia, difficolta: Difficile }
        successo:
          titolo: Il ricordo
          testo: |
            Racconti a voce bassa un ricordo che non hai mai raccontato a
            nessuno, dall'inizio alla fine. La cupola non lo ripete. Quando hai
            finito la porta è aperta, e ti accorgi che di quel ricordo ti è
            rimasto il fatto, ma non più il dolore.
          pe: { empatia: 3 }
          effetti: { profondita.avv-sogno-serpente: 1 }
        fallimento:
          titolo: Il ricordo aggiustato
          testo: |
            Racconti un ricordo, e senza volerlo lo aggiusti dove ti fa comodo.
            L'eco te lo ripete tutto, con le parti aggiustate più forti delle
            altre.
          effetti: { tormento: 0.5 }
      - testo: "Cantarle la strofa della roccia"
        descrizione: "La voce che scende dall'alto canta quella. Forse anche la cupola la conosce."
        requisiti: [avv-sogno-serpente.canto >= 1]
        esito:
          titolo: La strofa
          testo: |
            Canti la strofa della roccia, e dalla cupola, invece dell'eco, ti
            arriva la voce sottile di una bambina che la canta insieme a te,
            lontana. La porta si apre prima della fine.
          pe: { espressivita: 2 }
          effetti: { profondita.avv-sogno-serpente: 1 }
      - testo: "Attraversare la sala senza dire una parola"
        descrizione: "Se non dici niente, l'eco non ha niente da chiedere. Ripeterà i tuoi passi."
        costo: 2
        esito:
          titolo: I passi
          testo: |
            Cammini in silenzio lungo il muro, e l'eco ripete i tuoi passi uno
            per uno, sempre un passo dietro di te, finché alla porta ti sembra
            di essere in due. Ti volti, e non c'è nessuno.
          effetti: { profondita.avv-sogno-serpente: 1, tormento: 0.5 }

  # ------------------------------------------------------------ 5 · la svolta: la parete dei chiamati
  - id: avv-sogno-serpente-la-parete-dei-chiamati
    immagine: icone/wyvern
    titolo: La parete dei chiamati
    sommario: "A metà del tempio c'è una parete dipinta con la terra rossa, lunga quanto la sala. Da sopra si sente cantare."
    luogo: Dentro la roccia rossa, la parete dipinta
    area: avv-sogno-serpente
    requisiti: [avventura.sogno-serpente == 4, profondita.avv-sogno-serpente == 5, avv-sogno-serpente.svolta == 0]
    testo: |
      La parete di sinistra della sala è dipinta con terra rossa e carbone fino alla volta. È una fila di
      decine di bambini con i vestiti della loro epoca e quasi tutti con una maschera di stoffa al collo. In
      fondo alla fila un bambino siede in un cerchio, e intorno a lui è arrotolata una serpe alata che perde
      le penne.

      Intorno al cerchio stanno tre figure girate verso l'esterno. Una tiene ferma la roccia che si spacca e
      un'altra sta davanti a un uomo con un martello alzato. La terza tiene la mano del bambino. Sotto la
      serpe c'è un nome in segni che non conosci.

      Da una fessura nella volta scende la voce di Isel che canta piano la strofa della roccia.

      {resilienza Difficile} Le tre figure danno la schiena alla serpe, perché da lei non c'è niente da cui
      difendere il bambino.

      {origine allievo-di-torvessa} All'Accademia ti hanno insegnato a leggere una parete dipinta da sinistra
      a destra come un trattato, mentre questa va letta dalla fine.
    opzioni:
      - testo: "Leggere la parete dall'inizio alla fine"
        descrizione: "È una storia lunga cento generazioni. La fine è quella che stai per vedere."
        prova: { attributo: mentale, abilita: accademiche, difficolta: Difficile }
        successo:
          titolo: La muta
          testo: |
            La leggi tutta. La serpe dorme nella roccia, e ogni tanto si
            sveglia per cambiare le penne. Chiama un bambino che le canti la
            strofa mentre le perde, e qualcuno deve stare in piedi intorno al
            cerchio finché la strofa è finita. Isel non è in pericolo. Il
            pericolo per il rito è chi sale dopo la bambina, e stavolta quello
            sei tu. In fondo alla sala una scala sale verso la voce.
          pe: { accademiche: 3 }
          imposta: { avv-sogno-serpente.svolta: 1 }
          effetti: { profondita.avv-sogno-serpente: 1 }
        fallimento:
          titolo: Le figure
          testo: |
            Ti perdi nei vestiti dei bambini, che cambiano di epoca in epoca, e
            quando arrivi in fondo non ricordi più l'inizio. La voce di Isel si
            interrompe, e riprende da capo.
          effetti: { tormento: 0.5 }
      - testo: "Seguire la voce di Isel su per la fessura"
        descrizione: "La voce scende da una fessura nella volta. Dove passa una voce, a volte passa anche una persona."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Difficile }
        successo:
          titolo: La fessura
          testo: |
            Ti arrampichi fino alla volta e ti infili nella fessura, che sale
            dritta come una canna fumaria. Più sali, più la voce è vicina. Da
            lassù, prima di entrare, vedi la parete intera, con il cerchio in
            fondo e le tre figure in piedi che danno la schiena alla serpe.
          pe: { atletica: 3 }
          imposta: { avv-sogno-serpente.svolta: 1 }
          effetti: { profondita.avv-sogno-serpente: 1 }
        fallimento:
          titolo: La volta
          testo: |
            A due braccia dalla volta la parete dipinta ti si sfarina sotto le
            dita, e scivoli giù con la terra rossa nelle unghie. Sul muro resta
            la tua strisciata, in mezzo ai bambini.
          effetti: { ferite: 0.5 }
      - testo: "Copiare la parete su un foglio, pezzo per pezzo"
        descrizione: "Quello che non capisci adesso lo capirai copiandolo. Ci vuole tutta la lanterna."
        costo: 2
        esito:
          titolo: La copia
          testo: |
            Copi la parete pezzo per pezzo, e il disegno ti spiega quello che non
            avevi visto guardandolo. La serpe chiama un bambino perché le canti
            mentre perde le penne, e tre persone devono proteggere il rito da
            fuori. In fondo alla sala c'è una scala che sale verso la voce.
          imposta: { avv-sogno-serpente.svolta: 1 }
          effetti: { profondita.avv-sogno-serpente: 1, tormento: 0.5 }
      - testo: "Leggerla dalla fine, come una parete a rovescio"
        descrizione: "All'Accademia si insegna che le pareti votive si leggono da dove finiscono."
        quando: [origine.allievo-di-torvessa >= 1]
        prova: { attributo: mentale, abilita: accademiche, difficolta: Media }
        successo:
          titolo: Dalla fine
          testo: |
            Parti dal cerchio e torni indietro, e la parete diventa chiara. Ogni
            bambino della fila è stato chiamato per una muta, e ognuno aveva
            intorno tre persone in piedi. Il pericolo per il rito viene da fuori.
            In fondo alla sala una scala sale verso la voce di Isel.
          pe: { accademiche: 3 }
          imposta: { avv-sogno-serpente.svolta: 1 }
          effetti: { profondita.avv-sogno-serpente: 1 }
        fallimento:
          titolo: Il trattato
          testo: |
            La leggi dalla fine e poi dall'inizio, e i due racconti non tornano.
            Te ne vai con una nota mentale per Orvald Temmerin, che non te la
            leggerà mai.
          effetti: { tormento: 0.5 }

  # ============================================================ 6-9 · la gentilezza
  - id: avv-sogno-serpente-il-cinghiale-ferito
    immagine: bestiario/cinghiale-crudele-mutato
    titolo: Il cinghiale ferito
    sommario: "Davanti a una porta chiusa c'è un cinghiale con una zampa spezzata. Sulla porta è scolpito un cinghiale con la zampa fasciata."
    luogo: Dentro la roccia rossa, la porta del cinghiale
    area: avv-sogno-serpente
    ripetibile: true
    requisiti: [avventura.sogno-serpente == 4, profondita.avv-sogno-serpente >= 6, profondita.avv-sogno-serpente <= 9]
    testo: |
      Davanti alla porta è steso un cinghiale di montagna con la zampa davanti spezzata sotto il ginocchio.
      Quando entri si tira su sulle tre zampe buone e abbassa le zanne verso di te. Sulla porta alle sue
      spalle è scolpito un cinghiale identico con la zampa fasciata.

      {medicina Difficile} L'osso è spezzato netto, e se la bestia sta ferma il tempo di steccarlo guarisce in
      una luna.

      {armi-da-mischia Media} Su tre zampe non carica dritto, e un colpo sotto la spalla destra lo metterebbe
      giù in fretta.
    opzioni:
      - testo: "Steccargli la zampa"
        descrizione: "Basta il fodero della lama e una cinghia. Le mani però restano vicino alle zanne per tutto il tempo."
        prova: { attributo: mentale, abilita: medicina, difficolta: Difficile }
        successo:
          titolo: La stecca
          testo: |
            Lo lasci sfogare finché si sdraia stanco, poi gli stecchi la zampa
            con il fodero vuoto della tua lama e una cinghia, tenendo il
            ginocchio sulla sua spalla. Quando lo lasci si alza zoppicando e
            va a sdraiarsi lontano dalla porta, che si apre senza un rumore.
          pe: { medicina: 3 }
          effetti: { profondita.avv-sogno-serpente: 1 }
        fallimento:
          titolo: La zanna
          testo: |
            A metà della legatura il cinghiale si gira, e la zanna ti apre la
            manica e la pelle sotto. Lo lasci andare, e lui si rintana contro la
            porta, con la cinghia mezza legata.
          effetti: { ferite: 0.5 }
      - testo: "Calmarlo con la voce e le mani, finché si lascia toccare"
        descrizione: "Un cinghiale che ha paura si calma solo se smette di averne. Ci vuole qualcuno che non ne abbia."
        prova: { attributo: sociale, abilita: addestrare-animali, difficolta: Molto difficile }
        successo:
          titolo: La voce bassa
          testo: |
            Ti accucci a tre passi da lui e gli parli a voce bassa, come a
            Tuarmir, finché il pelo sulla schiena si abbassa. Poi gli posi la
            mano sul muso, e lui ti lascia legare la zampa senza un grugnito.
            Mentre stringi l'ultimo nodo, la porta si apre.
          pe: { addestrare-animali: 5 }
          effetti: { profondita.avv-sogno-serpente: 1 }
        fallimento:
          titolo: La carica
          testo: |
            Al primo passo verso di lui il cinghiale carica su tre zampe, e ti
            prende alla coscia con il muso. Ti ritiri contro il muro, e lui
            torna davanti alla porta.
          effetti: { ferite: 0.5 }
      - testo: "Abbatterlo"
        descrizione: "È ferito e spaventato, e sta fra te e la porta."
        combattimento: avv-sogno-serpente-il-cinghiale
        vittoria:
          titolo: La porta chiusa
          testo: |
            Il cinghiale va giù sotto la tua lama e non si rialza. Spingi la
            porta, e la porta non si muove. Sopra di lei il cinghiale scolpito ha
            ancora la zampa fasciata, e tu hai le mani sporche.
          effetti: { tormento: 1 }
        sconfitta:
          titolo: Le zanne
          testo: |
            Su tre zampe è più svelto di quanto pensavi. Le zanne ti trovano due
            volte, e ti trascini fuori dalla sala tenendoti il fianco.
          effetti: { tormento: 0.5 }
      - testo: "Fasciarlo come nel disegno di Isel"
        descrizione: "Nel disegno la fascia è legata sopra il ginocchio, e il cinghiale ha gli occhi chiusi."
        requisiti: [avv-sogno-serpente.disegni >= 1]
        prova: { attributo: mentale, abilita: [medicina, natura], difficolta: Media }
        successo:
          titolo: Gli occhi chiusi
          testo: |
            Gli copri gli occhi con il mantello come nel disegno, e il
            cinghiale si ferma di colpo. Gli leghi la zampa sopra il ginocchio
            mentre sta immobile. La porta si apre prima che tu gli abbia tolto il
            mantello.
          pe: { natura: 2 }
          effetti: { profondita.avv-sogno-serpente: 1 }
        fallimento:
          titolo: Il mantello
          testo: |
            Gli butti il mantello sulla testa, e il cinghiale se lo scuote via
            con un colpo di zanna che lo strappa in due. Ti ritiri con quello
            che ne resta.
          effetti: { ferite: 0.5 }
      - testo: "Restare con lui finché si fida"
        descrizione: "Ci si siede a terra lontano da lui e si aspetta. Lui ha tempo, e tu dovrai trovarne."
        costo: 3
        esito:
          titolo: Il tempo
          testo: |
            Ti siedi a terra a dieci passi e aspetti, avvicinandoti di un palmo
            ogni volta che lui chiude gli occhi. Quando arrivi a toccarlo hai
            una zannata sul braccio e la lanterna quasi vuota. Gli leghi la
            zampa, e la porta si apre.
          effetti: { profondita.avv-sogno-serpente: 1, ferite: 0.5 }

  - id: avv-sogno-serpente-la-capra-e-i-corvi
    immagine: icone/crow-dive
    titolo: La capra e i corvi
    sommario: "Su una cengia sotto un'apertura nella roccia c'è un capretto caduto. Due corvi grandi come cani gli si avvicinano a salti."
    luogo: Dentro la roccia rossa, la cengia dei corvi
    area: avv-sogno-serpente
    ripetibile: true
    requisiti: [avventura.sogno-serpente == 4, profondita.avv-sogno-serpente >= 6, profondita.avv-sogno-serpente <= 9]
    testo: |
      Qui una lunga spaccatura apre la roccia sul cielo e lascia entrare il vento. Su una cengia due braccia
      sotto la galleria c'è un capretto con una zampa piegata male che bela senza voce. Due corvi grandi come
      cani gli si avvicinano a salti con il becco aperto.

      La galleria prosegue oltre la cengia, e per passare bisogna scendere e risalire dall'altra parte.

      {addestrare-animali Media} Il capretto ha il pelo lungo e chiaro delle capre selvatiche che vivono
      dall'altra parte della roccia, dove i pastori di Tuarmir non portano mai il gregge.
    opzioni:
      - testo: "Scacciare i corvi"
        descrizione: "Sono due, e grossi. Ma sono corvi."
        combattimento: avv-sogno-serpente-i-corvi
        vittoria:
          titolo: Le penne nere
          testo: |
            I corvi se ne vanno dalla spaccatura. Uno zoppica nell'aria,
            all'altro manca una penna della coda. Prendi il capretto sotto il
            braccio e lo porti dall'altra parte della cengia, dove lo lasci
            all'asciutto.
          effetti: { profondita.avv-sogno-serpente: 1 }
        sconfitta:
          titolo: I becchi
          testo: |
            I corvi ti vengono in faccia insieme, e ti ritiri nella galleria con
            le braccia sopra la testa. Dalla cengia il capretto smette di belare.
          effetti: { tormento: 0.5 }
      - testo: "Calarti sulla cengia e portarlo via sotto il naso dei corvi"
        descrizione: "Due braccia di salto, un capretto sotto il braccio, e risalire dall'altra parte con una mano sola."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Molto difficile }
        successo:
          titolo: Con una mano sola
          testo: |
            Salti sulla cengia, prendi il capretto prima dei corvi e risali
            dall'altra parte con una mano sola, mentre i becchi ti picchiano sul
            cappuccio. In cima lo posi a terra, e i corvi se ne vanno senza
            niente.
          pe: { atletica: 5 }
          effetti: { profondita.avv-sogno-serpente: 1 }
        fallimento:
          titolo: La cengia
          testo: |
            Atterri male sulla cengia, e per non cadere più giù molli il
            capretto. Risali da dove sei sces{o|a}, con i corvi che ti beccano le
            mani a ogni appiglio.
          effetti: { ferite: 0.5 }
      - testo: "Tenerli lontani con la lanterna e la voce"
        descrizione: "I corvi della roccia non conoscono il fuoco. Un uomo che grida con una fiamma in mano è una cosa nuova."
        prova: { attributo: mentale, abilita: natura, difficolta: Difficile }
        successo:
          titolo: La fiamma
          testo: |
            Scendi sulla cengia con la lanterna alta e la scuoti verso i corvi,
            gridando. Arretrano fino al bordo e poi volano via. Porti il capretto
            dall'altra parte, e lui ti segue zoppicando.
          pe: { natura: 3 }
          effetti: { profondita.avv-sogno-serpente: 1 }
        fallimento:
          titolo: La fiamma spenta
          testo: |
            Il vento della spaccatura ti spegne la lanterna al primo passo, e i
            corvi ti saltano addosso al buio. Torni su con un taglio sopra
            l'occhio.
          effetti: { ferite: 0.5 }
      - testo: "Metterti fra i corvi e il capretto, e restarci"
        descrizione: "Ti beccheranno finché si stancano. È lunga, e fa male."
        costo: 3
        esito:
          titolo: Fino a sera
          testo: |
            Ti siedi sulla cengia davanti al capretto con il cappuccio tirato
            sulla faccia, e i corvi ti beccano le spalle finché la luce della
            spaccatura diventa rossa. Poi se ne vanno. Porti il capretto
            dall'altra parte, con la giubba a brandelli.
          effetti: { profondita.avv-sogno-serpente: 1, ferite: 0.5 }

  - id: avv-sogno-serpente-la-volpe-nella-crepa
    immagine: icone/fox
    titolo: La volpe nella crepa
    sommario: "Una volpe ha la zampa presa sotto un sasso caduto. Da una crepa vicina escono i guaiti dei suoi piccoli."
    luogo: Dentro la roccia rossa, la frana
    area: avv-sogno-serpente
    ripetibile: true
    requisiti: [avventura.sogno-serpente == 4, profondita.avv-sogno-serpente >= 6, profondita.avv-sogno-serpente <= 9]
    testo: |
      Una parte della volta è venuta giù da poco e i sassi coprono mezza galleria. Sotto il blocco più grosso
      è presa la zampa di una volpe magra con il muso bianco di polvere, che ti mostra i denti senza un verso.
      Da una crepa accanto escono i guaiti dei piccoli.

      Il passaggio libero è oltre il blocco.

      {resistenza Media} Il blocco pesa quanto due uomini, e lo alzi di un palmo per il tempo di contare fino
      a cinque se la volpe non ti morde le mani.
    opzioni:
      - testo: "Sollevare il blocco quanto basta"
        descrizione: "Due uomini di peso, un palmo di altezza, e la volpe che morde la prima cosa che le passa vicino."
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Molto difficile }
        successo:
          titolo: Un palmo
          testo: |
            Pianti i piedi e sollevi il blocco di un palmo, con le vene del
            collo che ti battono. La volpe tira fuori la zampa e sparisce nella
            crepa dei piccoli senza voltarsi. Lasci andare il blocco, che si
            assesta di traverso, e il passaggio è libero.
          pe: { atletica: 5 }
          effetti: { profondita.avv-sogno-serpente: 1 }
        fallimento:
          titolo: Le mani
          testo: |
            Il blocco si alza di un dito e ti ricade sulle mani, e la volpe ti
            morde il polso per buona misura. Ti siedi a guardarla, con le dita
            che pulsano.
          effetti: { ferite: 0.5 }
      - testo: "Calmarla prima di toccare il sasso"
        descrizione: "Una volpe presa ha paura di tutto. Se ha meno paura di te, ti lascia lavorare."
        prova: { attributo: sociale, abilita: addestrare-animali, difficolta: Difficile }
        successo:
          titolo: Il muso bianco
          testo: |
            Le parli sottovoce, accucciato, finché smette di mostrare i denti.
            Poi infili la lama sotto il blocco e fai leva piano, e lei tira
            fuori la zampa da sola. Ti guarda un momento prima di sparire nella
            crepa.
          pe: { addestrare-animali: 3 }
          effetti: { profondita.avv-sogno-serpente: 1 }
        fallimento:
          titolo: I denti
          testo: |
            Ti avvicini troppo presto, e la volpe ti apre il dorso della mano con
            un morso solo. Arretri, e i guaiti nella crepa si fanno più forti.
          effetti: { ferite: 0.5 }
      - testo: "Fasciarti il braccio con il mantello e scavare sotto la zampa"
        descrizione: "Si scava la ghiaia sotto la zampa a mani nude. Lei morde il mantello, e a volte non il mantello."
        costo: 3
        esito:
          titolo: La ghiaia
          testo: |
            Scavi la ghiaia sotto la zampa con una mano sola. L'altro braccio
            lo tieni fasciato nel mantello, e la volpe lo morde e rimorde.
            Quando la zampa è libera lei scappa, e il mantello ha più buchi
            che stoffa.
          effetti: { profondita.avv-sogno-serpente: 1, ferite: 0.5 }

  - id: avv-sogno-serpente-il-nido-caduto
    immagine: icone/nest-birds
    titolo: Il nido caduto
    sommario: "Sul pavimento c'è un nido di rondoni caduto da una fessura alta. Dentro i piccoli sono vivi, e i genitori girano sotto la volta."
    luogo: Dentro la roccia rossa, la sala del pozzo di luce
    area: avv-sogno-serpente
    ripetibile: true
    requisiti: [avventura.sogno-serpente == 4, profondita.avv-sogno-serpente >= 6, profondita.avv-sogno-serpente <= 9]
    testo: |
      In questa sala un pozzo di luce scende dalla cima della roccia fino al pavimento. Sotto c'è un nido di
      fango spaccato a metà con tre piccoli di rondone, e due rondoni adulti girano sotto la volta senza
      posarsi. La fessura da cui è caduto si vede sulla parete liscia a sei braccia d'altezza.

      La porta della sala è chiusa, e sopra è scolpito un uccello con le ali aperte.

      {percezione Difficile} Sotto la fessura la parete ha tre appigli in tutto, che qualcuno ha usato
      apposta.
    opzioni:
      - testo: "Riportare il nido nella fessura, arrampicandoti"
        descrizione: "Sei braccia di parete liscia con tre appigli in tutto, e un nido rotto da tenere in una mano."
        prova: { attributo: fisico, abilita: acrobazia, difficolta: Molto difficile }
        successo:
          titolo: La fessura
          testo: |
            Sali con il nido infilato nel cappuccio, un appiglio alla volta, e
            lo spingi nella fessura con due dita. I rondoni ci entrano prima che
            tu sia sceso. Quando tocchi terra la porta è aperta.
          pe: { acrobazia: 5 }
          effetti: { profondita.avv-sogno-serpente: 1 }
        fallimento:
          titolo: Il terzo appiglio
          testo: |
            Al terzo appiglio la mano ti scivola, e scendi molto più in fretta
            di come sei salit{o|a}. Il nido lo salvi tenendolo alto sopra la testa,
            e ti fai male tu.
          effetti: { ferite: 0.5 }
      - testo: "Rifare il nido in basso, dove i rondoni possano trovarlo"
        descrizione: "Un nido di fango si rifà con il fango. I genitori però devono accettarlo."
        prova: { attributo: mentale, abilita: natura, difficolta: Difficile }
        successo:
          titolo: Il nido nuovo
          testo: |
            Impasti la polvere con l'acqua della borraccia e richiudi il nido,
            poi lo posi in una nicchia sotto il pozzo di luce, al riparo. Il
            primo rondone ci si posa al terzo giro, e mentre imbecca i piccoli
            la porta si apre.
          pe: { natura: 3 }
          effetti: { profondita.avv-sogno-serpente: 1 }
        fallimento:
          titolo: Il fango
          testo: |
            Il fango non tiene, e il nido ti si sfascia fra le mani mentre i
            piccoli gridano. I rondoni adulti ti passano a un palmo dalla faccia,
            e tu rimetti tutto com'era.
          effetti: { tormento: 0.5 }
      - testo: "Tenere il nido in alto, finché i genitori lo riprendono"
        descrizione: "In piedi sotto il pozzo di luce, con le braccia alzate. Per tutto il tempo che serve."
        costo: 3
        esito:
          titolo: Le braccia alzate
          testo: |
            Stai in piedi sotto il pozzo di luce con il nido sopra la testa, e
            le braccia ti tremano molto prima che il primo rondone si posi.
            Quando li hai nutriti tutti e tre la porta si apre, e le spalle ti
            fanno male per il resto della salita.
          effetti: { profondita.avv-sogno-serpente: 1, ferite: 0.5 }

  - id: avv-sogno-serpente-il-guardiano-caduto
    immagine: icone/snake-totem
    titolo: Il guardiano caduto
    sommario: "Un guardiano di pietra è caduto dal suo muro e si è spaccato un'ala. Cerca di rialzarsi davanti alla porta, e non ci riesce."
    luogo: Dentro la roccia rossa, la porta del guardiano
    area: avv-sogno-serpente
    ripetibile: true
    requisiti: [avventura.sogno-serpente == 4, profondita.avv-sogno-serpente >= 6, profondita.avv-sogno-serpente <= 9]
    testo: |
      Davanti alla porta c'è un guardiano di pietra come quelli del corridoio in basso, caduto dal muro. Nella
      caduta gli si è spaccata un'ala e il pezzo è a terra a due passi. Il guardiano punta la testa sul
      pavimento per alzarsi e ricade sul fianco con un rumore di macina, e ogni volta la porta trema nei
      cardini.

      {tecnologia Media} Sull'ala rotta e sul pezzo a terra ci sono due perni che combaciano, perché chi l'ha
      scolpito ha fatto l'ala per smontarla.
    opzioni:
      - testo: "Rimettergli l'ala al suo posto"
        descrizione: "Il pezzo pesa quanto un uomo, e i perni vanno infilati dritti mentre lui si agita."
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Molto difficile }
        successo:
          titolo: L'ala
          testo: |
            Sollevi il pezzo dell'ala contro il petto e lo infili sui perni con
            una spinta sola. Il guardiano si alza piano e apre l'ala due
            volte, per provarla. Quando torna a posarsi contro il muro, la
            porta si apre.
          pe: { atletica: 5 }
          effetti: { profondita.avv-sogno-serpente: 1 }
        fallimento:
          titolo: Il pezzo
          testo: |
            Il pezzo ti scivola a metà strada e ti cade sul piede. Il guardiano
            ricade sul fianco, e la porta trema.
          effetti: { ferite: 0.5 }
      - testo: "Trovare l'incastro e guidarlo mentre si rialza"
        descrizione: "Se si alza al momento giusto, l'ala si rimette da sola. Bisogna dirgli quando."
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Difficile }
        successo:
          titolo: Il momento giusto
          testo: |
            Appoggi il pezzo dell'ala contro il fianco del guardiano, con i
            perni allineati, e aspetti che punti la testa. Quando si alza l'ala
            entra al suo posto con uno scatto. Il guardiano torna sul suo muro,
            e la porta si apre.
          pe: { tecnologia: 3 }
          effetti: { profondita.avv-sogno-serpente: 1 }
        fallimento:
          titolo: Lo scatto storto
          testo: |
            L'ala entra storta, e il guardiano ricade addosso al pezzo e lo
            spacca ancora. Ti tiri indietro con le mani piene di schegge.
          effetti: { ferite: 0.5 }
      - testo: "Finirlo, e passare"
        descrizione: "È una cosa di pietra rotta, e sta fra te e la porta."
        combattimento: avv-sogno-serpente-il-guardiano
        vittoria:
          titolo: I pezzi
          testo: |
            Lo colpisci finché smette di provare ad alzarsi, e la sua testa si
            stacca dal collo. La porta smette di tremare, e resta chiusa anche
            quando la spingi con tutta la spalla.
          effetti: { tormento: 1 }
        sconfitta:
          titolo: La testa di pietra
          testo: |
            Il guardiano si gira sul fianco e ti prende di testa sulle gambe. Ti
            trascini lontano dalla porta, e lui ricomincia a provare ad alzarsi.
          effetti: { tormento: 0.5 }
      - testo: "Sorreggerlo con la schiena finché trova l'equilibrio"
        descrizione: "Senza un'ala pende da una parte. Basta qualcuno che gli faccia da ala, per il tempo che serve."
        costo: 3
        esito:
          titolo: L'ala che manca
          testo: |
            Ti metti sotto il fianco rotto e lo sorreggi con la schiena, e il
            guardiano si alza un palmo alla volta. Quando è in piedi contro il
            muro hai la schiena a pezzi, e la porta è aperta.
          effetti: { profondita.avv-sogno-serpente: 1, ferite: 0.5 }

  # ============================================================ 10 · il cuore: Ulvessa
  - id: avv-sogno-serpente-ulvessa
    immagine: icone/wyvern
    titolo: Ulvessa
    sommario: "In cima alla roccia rossa, nella sala aperta sul cielo, una bambina canta seduta in un cerchio. Intorno a lei è arrotolata la guardiana."
    luogo: Dentro la roccia rossa, la sala in cima
    area: avv-sogno-serpente
    requisiti: [avventura.sogno-serpente == 4, profondita.avv-sogno-serpente >= 10]
    testo: |
      La cima della roccia rossa è un catino aperto sul cielo. In mezzo, dentro un cerchio scolpito nel
      pavimento, Isel siede a gambe incrociate con gli occhi chiusi e canta la strofa della roccia. Ha i
      capelli corti e il neo sul mento dei ritratti di Garro.

      Intorno a lei è arrotolata Ulvessa, con il corpo grosso come un tronco e coperto di scaglie rosse che
      sul collo diventano penne. Tiene le ali chiuse e la testa posata a terra davanti alla bambina. A ogni
      verso dalle ali cade una penna, e il pavimento ne è coperto.

      {magia Media} Il Mana gira lento intorno al cerchio, e la voce di Isel lo tiene in moto.

      Poi la roccia geme. Una crepa corre dal bordo del catino verso il cerchio, e la lastra su cui siede Isel
      si inclina di un dito. La bambina continua a cantare, e Ulvessa apre un occhio d'oro e lo posa su di te.

      {origine accolito-del-velo} In Cattedrale nessuna vetrata ha un serpente. Questo è dipinto sulle pareti
      del tempio con le ali aperte sopra un tronco rosso.
    opzioni:
      - testo: "Reggere la lastra con la schiena finché la strofa continua"
        descrizione: "La lastra si inclina verso la crepa, e Isel ci sta seduta sopra. Finché la tieni dritta, lei può continuare a cantare."
        prova: { attributo: fisico, abilita: [resistenza, atletica], difficolta: Difficile }
        successo:
          titolo: La lastra dritta
          testo: |
            Ti infili sotto il bordo della lastra e la reggi di schiena,
            puntando le ginocchia nella pietra. La crepa si ferma a un palmo dal
            cerchio. Isel non ha smesso di cantare, e l'occhio d'oro si richiude.
          pe: { resistenza: 5 }
          segue: avv-sogno-serpente-il-padre
        fallimento:
          titolo: La lastra che cede
          testo: |
            La lastra ti scivola dalla schiena, e Isel smette di cantare. La
            coda di Ulvessa ti spazza via dal cerchio e giù per la spirale
            delle gallerie, e rotoli fino alla crepa in basso. Garro ti tira
            fuori per la corda mentre da lassù la voce ricomincia da capo.
          effetti: { ferite: 1, tormento: 1 }
          vai: superficie-fratturata
      - testo: "Leggere dove corre la crepa e fermarla con i cunei"
        descrizione: "Ogni crepa segue una vena della pietra. Un cuneo nel punto giusto la ferma."
        prova: { attributo: mentale, abilita: [percezione, tecnologia], difficolta: Difficile }
        successo:
          titolo: Il cuneo
          testo: |
            Segui la vena della pietra con gli occhi fino al punto dove si
            biforca, e ci pianti di taglio la lama del coltello con un colpo
            solo. La crepa si ferma lì. Isel continua a cantare, e l'occhio d'oro
            si richiude.
          pe: { percezione: 5 }
          segue: avv-sogno-serpente-il-padre
        fallimento:
          titolo: La vena sbagliata
          testo: |
            Pianti il cuneo nella vena sbagliata, e la crepa si apre di colpo in
            due rami. Isel smette di cantare, e le ali di Ulvessa si aprono. Il
            vento delle ali ti butta giù per le gallerie, fino alla crepa in
            basso.
          effetti: { ferite: 1, tormento: 1 }
          vai: superficie-fratturata
      - testo: "Affrontare Ulvessa"
        descrizione: "È vecchia, e sta perdendo le penne. Ma è lunga quanto la scala grande di Tuarmir, e il rito si romperà."
        combattimento: avv-sogno-serpente-la-guardiana
        vittoria:
          titolo: Il rito rotto
          testo: |
            Le ali si aprono e si chiudono su di te finché la colpisci sotto
            l'ala, dove le penne sono già cadute. Ulvessa grida con una voce da
            bambina. Si ritira nella roccia, e la roccia le si richiude intorno
            con un rumore lungo, mentre una penna ti resta in mano.

            Isel si sveglia urlando. La porti giù in braccio, e alla crepa la
            prende Garro.
          pe: { armi-da-mischia: 5 }
          imposta: { avv-sogno-serpente.rito: 2 }
          effetti: { avventura.sogno-serpente: 1, tormento: 2 }
          vai: superficie-fratturata
        sconfitta:
          titolo: Le ali
          testo: |
            Le ali ti si chiudono addosso, e il resto lo ricordi a pezzi. Ti
            svegli alla crepa in basso, con Garro che ti tiene la testa, e da
            lassù la voce di Isel canta ancora.
          effetti: { tormento: 1 }
          vai: superficie-fratturata

  # ------------------------------------------------------------ il cuore, seconda prova: il padre
  - id: avv-sogno-serpente-il-padre
    tipo: seguito
    immagine: icone/chisel
    titolo: Il padre
    sommario: "Dalla scala sale Garro con la mazza in mano e due scalpellini con le torce. Vede la serpe intorno alla figlia."
    luogo: Dentro la roccia rossa, la sala in cima
    area: avv-sogno-serpente
    requisiti: [avventura.sogno-serpente == 4]
    testo: |
      Dalla scala arrivano passi pesanti e luce di torce. Garro ha allargato la crepa a colpi di mazza ed è
      salito con due scalpellini del villaggio, che hanno la faccia bianca. Appena vede la serpe arrotolata
      intorno alla figlia alza la mazza sopra la spalla e fa un passo verso la testa di Ulvessa.

      Isel continua a cantare, e Ulvessa tiene l'occhio aperto sulla mazza.

      {intimidire Difficile} Uno dei due scalpellini ha già fatto un passo indietro e aspetta solo che
      qualcuno gli dica che può farne un altro.

      Garro grida il nome della figlia, e la voce gli si rompe a metà.
    opzioni:
      - testo: "Fermarlo con le parole"
        descrizione: "Isel non ha paura. Bisogna che lo veda anche lui, prima che la mazza scenda."
        prova: { attributo: sociale, abilita: [persuasione, empatia], difficolta: Difficile }
        successo:
          titolo: Guardala
          testo: |
            Gli dici soltanto di guardarla. Garro guarda, e vede la figlia che
            canta con gli occhi chiusi, tranquilla come nel suo letto. La mazza
            gli scende lungo la gamba. Si siede sul bordo del catino, e i due
            scalpellini abbassano le torce.
          pe: { persuasione: 5 }
          segue: avv-sogno-serpente-l-ultima-strofa
        fallimento:
          titolo: La mazza
          testo: |
            Le parole ti escono troppo forti, e Garro ti spinge di lato. La mazza
            scende sulla roccia accanto alla testa di Ulvessa, e Isel smette di
            cantare. Le ali si aprono, e il vento delle ali butta giù per le
            gallerie te e i tre uomini, fino alla crepa in basso.
          effetti: { ferite: 1, tormento: 1 }
          vai: superficie-fratturata
      - testo: "Metterti fra la mazza e la serpe"
        descrizione: "Se la mazza scende, scende su di te. Garro è uno scalpellino, e sa quanto fa male."
        prova: { attributo: fisico, abilita: [resistenza, atletica], difficolta: Difficile }
        successo:
          titolo: Il colpo fermato
          testo: |
            Ti pianti davanti alla testa di Ulvessa a braccia larghe, e la mazza
            si ferma a un palmo dalla tua spalla. Garro resta così, con il
            braccio alzato, finché sente cantare la figlia. Poi lascia cadere la
            mazza sulle penne.
          pe: { resistenza: 5 }
          segue: avv-sogno-serpente-l-ultima-strofa
        fallimento:
          titolo: La spalla
          testo: |
            La mazza ti prende di striscio sulla spalla e finisce sulla roccia.
            Isel smette di cantare, e le ali di Ulvessa si aprono. Ti ritrovi
            alla crepa in basso, con un braccio che non si alza e Garro che
            piange.
          effetti: { ferite: 1.5, tormento: 0.5 }
          vai: superficie-fratturata
      - testo: "Ordinare agli scalpellini di tenerlo"
        descrizione: "Sono due, e uno ha già paura. Bisogna dargli un ordine che si possa eseguire."
        prova: { attributo: sociale, abilita: intimidire, difficolta: Difficile }
        successo:
          titolo: L'ordine
          testo: |
            «Tenetelo» dici, con la voce che si usa per le bestie. I due
            scalpellini mollano le torce e prendono Garro per le braccia prima
            ancora di averci pensato. Lui si divincola una volta, poi sente la
            figlia cantare e smette.
          pe: { intimidire: 5 }
          segue: avv-sogno-serpente-l-ultima-strofa
        fallimento:
          titolo: Le torce
          testo: |
            Gli scalpellini ti guardano come si guarda un forestiero che dà
            ordini, e Garro fa il suo passo. La mazza tocca la roccia, e Isel
            smette di cantare. Il vento delle ali vi butta giù tutti e quattro
            fino alla crepa in basso.
          effetti: { ferite: 1, tormento: 1 }
          vai: superficie-fratturata

  # ------------------------------------------------------------ il cuore, terza prova: l'ultima strofa
  - id: avv-sogno-serpente-l-ultima-strofa
    tipo: seguito
    immagine: icone/feather
    titolo: L'ultima strofa
    sommario: "Alla fine della strofa Isel perde le parole. Ulvessa alza la testa, e le ultime penne non cadono."
    luogo: Dentro la roccia rossa, la sala in cima
    area: avv-sogno-serpente
    requisiti: [avventura.sogno-serpente == 4]
    testo: |
      La strofa è quasi finita. Isel arriva all'ultimo verso e si ferma con la bocca aperta, poi ricomincia la
      riga e si ferma di nuovo nello stesso punto perché ha perso le parole.

      Ulvessa alza la testa da terra per la prima volta. Le poche penne che le restano si gonfiano, e dalla
      gola le sale un suono basso che fa vibrare le lastre. Sul bordo del catino Garro si copre la faccia con
      le mani.

      {empatia Difficile} Isel non ha paura nemmeno adesso. Cerca una cosa che sapeva, e le viene da piangere.

      {accademiche Media fallita} Provi a ricordare come finiva la strofa, e la memoria ti offre con sicurezza
      il ritornello di una canzone da osteria.
    opzioni:
      - testo: "Cantarle tu l'ultimo verso"
        descrizione: "Te l'hanno insegnato le cucitrici di Tuarmir. Bisogna cantarlo intonato, quassù, davanti a lei."
        requisiti: [avv-sogno-serpente.canto >= 1]
        prova: { attributo: sociale, abilita: espressivita, difficolta: Difficile }
        successo:
          titolo: Le penne contate
          testo: |
            Canti l'ultimo verso piano, come lo cantava Cerya, e Isel lo prende
            dalla tua voce e lo finisce con la sua. Le ultime penne cadono tutte
            insieme. Ulvessa ne posa una in grembo alla bambina con la punta del
            muso, poi si ritira nella roccia come acqua in un secchio bucato, e
            la roccia si richiude. Isel apre gli occhi e ti chiede dov'è suo
            padre.
          pe: { espressivita: 5 }
          imposta: { avv-sogno-serpente.rito: 1 }
          effetti: { avventura.sogno-serpente: 1, reliquie.frammento-inciso: 1 }
          vai: superficie-fratturata
        fallimento:
          titolo: La nota storta
          testo: |
            La voce ti si incrina sulla nota alta, e Isel ripete la tua nota
            storta. Il suono di Ulvessa diventa un grido. Le ali si aprono, e il
            vento ti butta giù per le gallerie fino alla crepa in basso. Da
            lassù la bambina ricomincia la strofa da capo.
          effetti: { ferite: 1, tormento: 1 }
          vai: superficie-fratturata
      - testo: "Ricordarle la strofa con i suoi disegni"
        descrizione: "I disegni della sua stanza sono la strofa messa in fila. Basta mostrarle il punto dove si è fermata."
        requisiti: [avv-sogno-serpente.disegni >= 1]
        prova: { attributo: mentale, abilita: [accademiche, percezione], difficolta: Difficile }
        successo:
          titolo: Il cinghiale con la fascia
          testo: |
            Le metti fra le mani il foglio dei disegni, aperto sull'ultimo, il
            cinghiale con la fascia. Isel apre gli occhi e lo guarda, e il
            verso le torna in bocca intero. Le ultime penne cadono. Ulvessa ne
            posa una in grembo alla bambina e si ritira nella roccia, che le
            si richiude intorno. Isel ti chiede dov'è suo padre.
          pe: { accademiche: 5 }
          imposta: { avv-sogno-serpente.rito: 1 }
          effetti: { avventura.sogno-serpente: 1, reliquie.frammento-inciso: 1 }
          vai: superficie-fratturata
        fallimento:
          titolo: Il foglio
          testo: |
            Le metti fra le mani il foglio aperto sul disegno sbagliato. Isel lo
            guarda, e il verso le si allontana del tutto. Il suono di Ulvessa
            diventa un grido, e il vento delle ali ti butta giù per le gallerie
            fino alla crepa in basso.
          effetti: { ferite: 1, tormento: 1 }
          vai: superficie-fratturata
      - testo: "Prenderle la mano e lasciarle il tempo di ritrovarlo"
        descrizione: "Le parole tornano da sole, a chi non ha fretta. Ma lei non deve sentirsi sola."
        prova: { attributo: sociale, abilita: empatia, difficolta: Difficile }
        successo:
          titolo: La mano
          testo: |
            Entri nel cerchio e le prendi la mano, senza dire niente. Isel te
            la stringe forte. Ricomincia la riga piano, e stavolta arriva in
            fondo. Le ultime penne cadono. Ulvessa ne posa una in grembo alla
            bambina e si ritira nella roccia, che le si richiude intorno. Isel ti
            chiede dov'è suo padre.
          pe: { empatia: 5 }
          imposta: { avv-sogno-serpente.rito: 1 }
          effetti: { avventura.sogno-serpente: 1, reliquie.frammento-inciso: 1 }
          vai: superficie-fratturata
        fallimento:
          titolo: Il cerchio
          testo: |
            Entri nel cerchio, e la lastra si inclina sotto il tuo peso. Isel
            apre gli occhi, spaventata per la prima volta. Il suono di Ulvessa
            diventa un grido, e il vento delle ali ti butta giù per le gallerie
            fino alla crepa in basso.
          effetti: { ferite: 1, tormento: 1 }
          vai: superficie-fratturata
