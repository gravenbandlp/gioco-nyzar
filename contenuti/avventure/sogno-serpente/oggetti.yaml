# L'oggetto di grado 4 dell'Avventura «La bambina che sognava il serpente», dato dall'epilogo (storia.yaml): una
# penna caduta dalle ali di Ulvessa durante la muta, o strappata dalla sua ala se l'hai combattuta. Accessorio, quindi
# senza dadi (contenuto.ts: fino a +4). Budget 4 + 1 difetto = 5 punti: Lucida (2), Ultimo respiro (2), Talento in
# Empatia (1). Riconoscibile: a Tuarmir, e fra chi conosce la canzone dei punti, una penna rossa lunga un avambraccio
# la riconoscono tutti.
oggetti:
  - id: avv-sogno-serpente-penna-della-guardiana
    nome: Penna della guardiana
    immagine: icone/feather
    descrizione: "Una penna rossa lunga un avambraccio, con il calamo duro come osso e il bordo che a guardarlo contro luce diventa oro. Viene dalle ali di Ulvessa, la guardiana della roccia rossa sopra Tuarmir. Chi la porta fa sogni quieti, e una volta per scontro, quando dovrebbe cadere, resta in piedi."
    slot: accessorio
    grado: 4
    proprieta: { lucida: true, ultimoRespiro: true, talento: { empatia: 1 } }
    difetti: [riconoscibile]
