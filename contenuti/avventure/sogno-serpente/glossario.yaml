# Le voci del glossario dell'Avventura «La bambina che sognava il serpente», nel formato di
# contenuti/glossario/personaggi.yaml: presentazioni stabili, senza segreti. Nomi nuovi: Garro lo scalpellino, sua
# figlia Isel, Ulvessa (la guardiana alata, lore nuova approvata) e la roccia rossa sopra la gola di Tuarmir.
# I due scalpellini che salgono con Garro al cuore restano senza nome.
glossario:
  - id: garro
    nome: Garro
    tipo: personaggio
    sottotitolo: "Scalpellino di Tuarmir"
    testo: "Lo scalpellino di Tuarmir, un uomo grosso con la polvere di pietra nelle pieghe delle mani, che scava le porte e i gradini delle case-grotta. Vive da solo con la figlia Isel da quando la moglie è morta, e le ha scavato con le sue mani una stanza con la finestra sulla gola."

  - id: isel
    nome: Isel
    tipo: personaggio
    sottotitolo: "Figlia di Garro"
    testo: "Bambina di Tuarmir di nove anni, figlia dello scalpellino Garro. Disegna con il carbone su tutti i muri che trova, e da quando ha cominciato a sognare un serpente con le ali disegna soltanto quello. Chiede a tutti come finisce la canzone dei punti, quella che le donne cantano cucendo le maschere."

  - id: ulvessa
    nome: Ulvessa
    tipo: creatura
    sottotitolo: "La guardiana della roccia rossa"
    testo: "Il nome che la canzone dei punti dà alla serpe con le ali che dorme nella roccia rossa sopra Tuarmir. Le vecchie del villaggio dicevano che le erbe della gola crescono buone finché lei dorme, e un tempo le portavano ogni primavera il primo mazzo di salvia, la parte della roccia."

  - id: roccia-rossa
    nome: roccia rossa
    tipo: luogo
    sottotitolo: "Lo sperone sopra la gola di Tuarmir"
    testo: "Uno sperone di roccia color ruggine sulla parete di ponente della gola di Tuarmir, sopra le case più alte, dove la gola fa il gomito. Ai suoi piedi c'è un ghiaione dove non sale mai nessuno, e a Tuarmir lo si guarda dalle soglie nell'ora di sole senza indicarlo con il dito."
