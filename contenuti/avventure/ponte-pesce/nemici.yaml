# I nemici dell'Avventura 5, «Il debito del Ponte del Pesce». Tarati con `npx tsx scripts/simula-fine.ts
# avv-ponte-pesce-` sul profilo «fine contenuti» (Fisico 4, Armi da mischia 4, Spadone di Uzgreth, cotta di maglia):
# gregari fra il 70 e l'85%, la capo delle guardie fra il 40 e il 55% (docs/piano-avventure.md, Difficoltà).
# - Il fiume (stanze 0-2): i granchi del fondo (in coppia), il polpo che ha affondato la barca di Ciro, una bestia
#   che i Sommersi tengono a guardia delle barche.
# Valori al 12 ottobre 2026, fine contenuti: granchi 78%, polpo 85%, guardia 80%, Ilske 50%. Contro «fine capitolo»
# i gregari stanno fra il 7 e il 28% e Ilske al 2%: l'Avventura si apre dopo Capomozzo e conta su un personaggio fatto.
# - Le grotte (stanze 7-9): le guardie dei Sommersi, una per scontro.
# - Il cuore: Ilske, la capo delle guardie, nel pozzo delle acque profonde.
nemici:
  - id: avv-ponte-pesce-granchio
    immagine: icone/crab-claw
    nome: Granchio del fondo
    descrizione: "Un granchio largo come uno scudo, con il guscio coperto d'alga e le chele consumate fino al bianco. Lento a voltarsi, e quando chiude non molla."
    attacco: 5
    difesa: 4
    difesaMentale: 2
    pf: 13
    danno: 3
    riduzione: 3
    iniziativa: 2
    tratti: [animale]

  - id: avv-ponte-pesce-polpo
    immagine: icone/brain-tentacle
    nome: Il polpo del relitto
    descrizione: "Un polpo grigio lungo quanto una barca, che in un fiume non ci dovrebbe stare. Ha sulle braccia gli anelli chiari di una corda, e ha fatto casa nella barca che ha affondato."
    attacco: 6
    difesa: 4
    difesaMentale: 3
    pf: 14
    danno: 4
    riduzione: 3
    iniziativa: 4
    tratti: [animale]

  - id: avv-ponte-pesce-guardia
    immagine: icone/spear-feather
    nome: Guardia dei Sommersi
    descrizione: "Una guardia della gente d'acqua, alta più di un uomo, con la pelle chiara e le branchie sotto la mascella. Porta un arpione di ferro nero legato al polso da una corda d'alga. Nel buio delle grotte vede meglio di te."
    attacco: 6
    difesa: 5
    difesaMentale: 4
    pf: 13
    danno: 4
    riduzione: 3
    iniziativa: 4

  - id: avv-ponte-pesce-ilske
    immagine: ambientazione/regno-profondo
    nome: Ilske, capo delle guardie
    descrizione: "La capo delle guardie dei Sommersi, con un occhio solo e un anello di catena al collo. Nuota senza fretta, e il suo arpione nero torna sempre indietro sulla corda."
    attacco: 6
    difesa: 4
    difesaMentale: 5
    pf: 28
    danno: 3
    riduzione: 5
    iniziativa: 3

scontri:
  - { id: avv-ponte-pesce-i-granchi, nome: "I granchi del fondo", nemici: [avv-ponte-pesce-granchio, avv-ponte-pesce-granchio], feriteSconfitta: 2 }
  - { id: avv-ponte-pesce-il-polpo, nome: "Il polpo del relitto", nemici: [avv-ponte-pesce-polpo], feriteSconfitta: 2 }
  - { id: avv-ponte-pesce-una-guardia, nome: "Una guardia dei Sommersi", nemici: [avv-ponte-pesce-guardia], feriteSconfitta: 2 }
  - { id: avv-ponte-pesce-ilske, nome: "Ilske, capo delle guardie", nemici: [avv-ponte-pesce-ilske], feriteSconfitta: 3 }
