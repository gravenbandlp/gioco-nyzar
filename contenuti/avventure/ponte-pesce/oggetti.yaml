# L'oggetto dell'Avventura 5: l'arpione di guardia di Olm, che lui ti lascia sotto l'arco del Ponte del Pesce
# (avventura.ponte-pesce 7 → 8). Grado 4 su base lancia: 2 dadi, Affilata 1, Penetrante 1 e un dado di Atletica fuori
# dal combattimento (nuotare), 5 punti su 4 + 1 difetto (Riconoscibile: al Ponte e allo Scoglio tutti sanno di chi è).
oggetti:
  - id: avv-ponte-pesce-arpione-del-sommerso
    nome: Arpione del Sommerso
    immagine: icone/barbed-spear
    descrizione: "L'arpione di guardia di Olm, con il fusto di un legno nero che sul Torvessa non cresce e la punta di ferro vecchio battuto a freddo, a tre denti. Chi lo porta nuota come se l'acqua lo conoscesse, e al Ponte del Pesce tutti sanno da dove viene."
    slot: arma
    base: lancia
    grado: 4
    dadi: 2
    proprieta: { affilata: 1, penetrante: 1, talento: { atletica: 1 } }
    difetti: [riconoscibile]
