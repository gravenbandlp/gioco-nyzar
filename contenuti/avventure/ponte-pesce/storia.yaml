# Avventura 5, «Il debito del Ponte del Pesce» (avventura.ponte-pesce 0 → 8). Docs/piano-avventure.md, scheda 5.
# Ciro Scardola, pescatore del Ponte del Pesce, è affondato sotto la Roccia di Wren e l'ha tirato fuori Olm, una
# guardia dei Sommersi, la gente d'acqua delle grotte allagate sotto la Roccia (lore nuova approvata). I Sommersi
# hanno una legge sola che conti, non toccare chi vive di sopra, e Olm adesso sta incatenato a un'ancora del Ponte.
# Qui l'aggancio, lo sviluppo e l'epilogo; la spedizione sta in spedizione.yaml.
# - 0 → 1 l'uomo fradicio sui gradini del Ponte (pista.capomozzo >= 10), con il seguito del racconto.
# - 1 → 2 la riva deserta: Tersilla spiega perché sotto lo Scoglio non pesca nessuno (vantaggio: lo scalo dei vecchi,
#   che apre la via d'ingresso senza prova).
# - 2 → 3 il boccaglio del nonno di Ciro e il cristallo conduttore da comprare, da prendere o da svegliare.
# - 3 → 4 la prova nel canale sotto il Ponte (vantaggio: l'acqua del canale, una via Media nella stanza del
#   cristallo che si spegne).
# - 4 → 5 i turni delle guardie contati dai giunchi (vantaggio: i turni, una via Media in due stanze delle guardie),
#   con il seguito della guardia che sale.
# - 5 → 6 la spedizione `avv-ponte-pesce` (spedizione.yaml).
# - 6 → 7 sotto l'arco: dove resta Olm (al Ponte, nei giunchi, o di nuovo fra i suoi con il patto di Ciro).
# - 7 → 8 l'arpione del Sommerso, l'oggetto di grado 4.
# Tutto si gioca in Città Bassa, al Ponte del Pesce e sul Torvessa sotto lo Scoglio.
quality:
  - { id: avventura.ponte-pesce, immagine: ambientazione/roccia-di-wren, nome: "Il debito del Ponte del Pesce", categoria: pista, descrizione: "Ciro Scardola deve la vita a uno della gente d'acqua che vive sotto la Roccia di Wren. Adesso quello sta incatenato a un'ancora sul fondo, e il debito è passato anche a te." }
  - { id: avv-ponte-pesce.approdo, immagine: icone/stairs, nome: Lo scalo dei vecchi, categoria: stato, descrizione: "Tersilla ti ha detto dove stanno i gradini che i pescatori di una volta avevano scavato sul lato est dello Scoglio. Scendono sott'acqua senza che nessuno ti veda tuffarti." }
  - { id: avv-ponte-pesce.boccaglio, immagine: icone/gas-mask, nome: Il boccaglio di Ciro, categoria: stato, descrizione: "Un boccaglio d'ottone del nonno di Ciro, con un cristallo conduttore carico nel castone. Con quello in bocca l'acqua del Torvessa dà aria, e sa di rame." }
  - { id: avv-ponte-pesce.acqua, immagine: icone/drowning, nome: L'acqua del canale, categoria: stato, descrizione: "Hai passato abbastanza tempo nel canale sotto il Ponte del Pesce da sapere come si tira dal boccaglio quando il cristallo stenta." }
  - { id: avv-ponte-pesce.turni, immagine: icone/hourglass, nome: I turni delle guardie, categoria: stato, descrizione: "Dai giunchi davanti allo Scoglio hai contato i cambi delle guardie dei Sommersi. Sai quando una sale e l'altra scende." }
  - { id: avv-ponte-pesce.allarme, nome: Le guardie ti cercano, categoria: stato, nascosta: true, descrizione: "1 se in questa discesa le guardie dei Sommersi ti hanno visto. L'ingresso lo riporta a 0." }
  - { id: avv-ponte-pesce.olm, nome: Dove sta Olm, categoria: stato, nascosta: true, descrizione: "1 sotto l'arco del Ponte del Pesce, e lo sanno tutti; 2 nei giunchi dello scalo, e lo sapete tu e Ciro; 3 di nuovo fra i Sommersi, con il patto di Ciro." }

storylet:
  # ------------------------------------------------------------ 0 → 1 · l'aggancio
  - id: avv-ponte-pesce-l-uomo-fradicio
    immagine: ambientazione/ponti-sospesi
    titolo: L'uomo fradicio
    sommario: "Sui gradini del Ponte del Pesce un pescatore bagnato fino alle ossa ferma chi passa con una domanda sola."
    luogo: Città Bassa, il Ponte del Pesce
    area: citta-bassa
    requisiti: [pista.capomozzo >= 10, avventura.ponte-pesce == 0]
    testo: |
      Sotto l'arco di pietra rossa del Ponte del Pesce, sui gradini dove la mattina si vende il pescato, c'è
      un uomo seduto in una pozza d'acqua che gli cola dai vestiti. Ha una cinquantina d'anni, le mani gonfie
      di chi tira reti da sempre e un giro di tela al polso sinistro annodato con i denti.

      Ferma chi passa sempre con la stessa domanda. I facchini allungano il passo, e una donna con la cesta
      delle anguille gli dice di andare a casa a cambiarsi. Quando tocca a te si alza in piedi.

      «Tu hai paura dell'acqua?» dice. «Di quella che va giù fino al buio, dico. Mi chiamo Ciro Scardola e
      pesco dal Ponte da trent'anni. Mi serve uno che scenda dove io non arrivo, e a quelli del Ponte non lo
      posso chiedere.»

      {empatia Media} Il giro al polso è tela da vela stretta troppo, come si stringe una cosa per avere
      qualcosa da sentire.

      {origine mercante-dei-ponti} Il Ponte del Pesce lo conosci dai banchi del mattino. Uno che sta seduto
      qui a metà mattina senza ceste ha perso più del pescato.
    opzioni:
      - testo: "Sederti accanto a lui sui gradini"
        descrizione: "Ha l'aria di uno che racconta meglio da seduto, con l'acqua del canale davanti."
        esito:
          titolo: I gradini
          testo: |
            Ti siedi sul gradino bagnato, e Ciro si rimette giù accanto a te
            senza badare alla pozza. Guarda il canale nero che passa sotto
            l'arco per un bel pezzo prima di cominciare.
          effetti: { avventura.ponte-pesce: 1 }
          segue: avv-ponte-pesce-il-racconto-di-ciro
      - testo: "Portarlo all'osteria sotto l'arco e offrirgli da bere"
        descrizione: "Un bicchiere di grappa di bacche e una sedia vicino al fuoco. Così bagnato, stasera ha la febbre."
        requisiti: [monete >= 1]
        esito:
          titolo: La grappa
          testo: |
            All'osteria sotto l'arco lo metti vicino al fuoco, e l'oste gli
            butta una coperta sulle spalle senza chiedere niente. Ciro beve la
            grappa in un sorso, si asciuga la bocca con il dorso della mano e
            comincia a raccontare.
          effetti: { avventura.ponte-pesce: 1, monete: -1 }
          segue: avv-ponte-pesce-il-racconto-di-ciro

  - id: avv-ponte-pesce-il-racconto-di-ciro
    tipo: seguito
    immagine: icone/brain-tentacle
    titolo: Il racconto di Ciro
    sommario: "Sei giorni fa Ciro è andato a pescare sotto lo Scoglio, e qualcosa gli ha affondato la barca."
    luogo: Città Bassa, il Ponte del Pesce
    area: citta-bassa
    requisiti: [avventura.ponte-pesce == 1]
    testo: |
      Sei giorni fa Ciro è andato a calare le reti sotto lo Scoglio, la Roccia di Wren, dove dal Ponte non va
      nessuno da anni. Al terzo lancio dall'acqua è uscito un braccio grigio pieno di ventose e si è avvolto
      alla sponda. Poi ne è uscito un altro, e la barca è andata giù con lui dentro.

      «Sotto era buio, e io ero già morto» dice. «Poi una mano mi ha preso per la cintura. Bianca e fredda,
      con la pelle fra le dita come le anatre. Mi ha lasciato fra i giunchi a sputare fiume.»

      La mattina dopo è tornato con un secchio di pesce per chi l'aveva salvato. All'alba, dove l'acqua si fa
      chiara, l'ha visto seduto sul fondo con una catena al collo legata a un'ancora del Ponte. Sull'ancora
      c'era la marca di un barcaiolo morto da vent'anni.

      {intimidire Media fallita} Ti accorgi di aver smesso di guardarlo in faccia, e Ciro lo vede.
    opzioni:
      - testo: "Chiedergli com'era fatto"
        descrizione: "Una mano bianca con la pelle fra le dita. Il resto, se l'ha visto, lo sa solo lui."
        costo: 0
        esito:
          titolo: Olm
          testo: |
            «Lungo e secco, bianco come la pancia di una tinca» dice Ciro.
            «Sotto la mascella ha dei tagli che si aprono e si chiudono, tre
            per parte. Prima di tornare giù ha detto una parola sola, con la
            gola. Suonava tipo Olm, e io lo chiamo così.»
          segue: avv-ponte-pesce-il-racconto-di-ciro
      - testo: "Chiedergli perché pensa che l'abbiano legato"
        descrizione: "Un'ancora del Ponte, una catena, uno della sua gente. Ciro un'idea se l'è fatta."
        costo: 0
        esito:
          titolo: La legge
          testo: |
            Ciro si gratta il giro di tela al polso. «Le vecchie del Ponte ci
            raccontavano che sotto lo Scoglio c'è gente d'acqua, e che chi li
            tocca porta male a tutti e due. Credevo fossero storie per non
            farci andare là. L'hanno legato perché mi ha tirato su, questo lo
            so come so il mio nome.»
          segue: avv-ponte-pesce-il-racconto-di-ciro
      - testo: "Dirgli che scenderai a prenderlo"
        descrizione: "Una catena legata a un'ancora sul fondo del Torvessa. Ci vorrà più di un coltello."
        costo: 0
        esito:
          titolo: Da dove si comincia
          testo: |
            Ciro ti stringe la mano fra le sue, ancora umide di fiume. «Prima
            parla con Tersilla, all'osteria» dice. «È la più vecchia del
            Ponte, e lo Scoglio se lo ricorda da prima che ci andasse a stare
            l'intagliatore. Io intanto ci penso, a come si va giù senza
            annegare.»

  # ------------------------------------------------------------ 1 → 2 · la riva deserta
  - id: avv-ponte-pesce-la-riva-deserta
    immagine: icone/fishing-hook
    titolo: La riva deserta
    sommario: "All'osteria sotto l'arco la vecchia Tersilla ricuce le reti a occhi chiusi. Sa perché sotto lo Scoglio non pesca nessuno."
    luogo: Città Bassa, l'osteria sotto l'arco del Ponte del Pesce
    area: citta-bassa
    requisiti: [avventura.ponte-pesce == 1]
    testo: |
      L'osteria del Ponte del Pesce è una stanza bassa ricavata nel pilone dell'arco, con il fumo della brace
      che esce da una finestrella sul canale e le reti appese alle travi. Al banco i pescatori bevono in piedi
      con le mani ancora lucide di squame.

      Tersilla sta nell'angolo vicino alla finestra, su una sedia che nessuno le contende. È piccola e curva,
      con gli occhi bianchi di cataratta, e ricuce una rete al tatto con un ago d'osso stringendo ogni nodo
      con i denti che le restano. A chi le parla risponde sempre cominciando con «senti a me».

      Secondo Ciro sotto lo Scoglio non pesca nessuno per via del Cucitore, che ci abitava. Al Ponte però lo
      Scoglio lo evitavano già prima che Wren ci costruisse la capanna, e Tersilla se lo ricorda.

      {origine figlio-della-citta-bassa} In Città Bassa donne come lei ce ne sono a ogni angolo, sedute sempre
      nello stesso posto, e raccontano tutto a chi ha la pazienza di sentire anche il resto.
    opzioni:
      - testo: "Sederti accanto a lei e lasciarla parlare"
        descrizione: "Una vecchia cieca che ricuce reti ha molte cose da dire, e la più utile di solito arriva per ultima."
        prova: { attributo: sociale, abilita: [empatia, galateo], difficolta: Media }
        successo:
          titolo: Senti a me
          testo: |
            «Senti a me» dice Tersilla. «Mio nonno le reti sotto lo Scoglio le
            tirava su tagliate pulite come col rasoio, e le ancore restavano
            giù con la cima tagliata. Lui però sapeva dello scalo, sul lato
            est, dove si scendeva a lavare le reti. Gradini nella pietra,
            sotto l'acqua. Di lì scendi senza che ti vedano tuffarti.»
          pe: { empatia: 2 }
          effetti: { avventura.ponte-pesce: 1, avv-ponte-pesce.approdo: 1 }
        fallimento:
          titolo: L'ago d'osso
          testo: |
            Le fai una domanda di troppo mentre conta i nodi, e Tersilla perde
            il conto. Ti punta contro l'ago d'osso e ti dice di andare a
            chiedere ai pesci, così forte che al banco si voltano tutti.
          effetti: { scandalo: 0.5 }
      - testo: "Offrire da bere al banco e lasciar parlare i pescatori"
        descrizione: "Al banco ognuno ha la sua storia dello Scoglio. Tersilla le sente tutte, e quelle sbagliate le corregge."
        prova: { attributo: sociale, abilita: [conoscenze-della-strada, persuasione], difficolta: Media }
        successo:
          titolo: La storia giusta
          testo: |
            Al terzo giro i pescatori raccontano dello Scoglio tutti insieme,
            e ognuno sbaglia qualcosa. Tersilla li corregge dal suo angolo,
            uno alla volta, finché alla fine racconta lei delle reti tagliate
            e dello scalo dei vecchi, sul lato est, con i gradini sotto
            l'acqua.
          pe: { conoscenze-della-strada: 2 }
          effetti: { avventura.ponte-pesce: 1, avv-ponte-pesce.approdo: 1, monete: -1 }
        fallimento:
          titolo: Il giro pagato
          testo: |
            Bevono tutti alla tua salute e raccontano dello Scoglio cose che
            sono successe a cugini di cugini. Quando Tersilla apre bocca,
            l'oste ha già cominciato a spegnere la brace e ti chiede di
            pagare.
          effetti: { monete: -1, scandalo: 0.5 }
      - testo: "Aiutarla con le reti per tutta la sera"
        descrizione: "Tenere la rete tesa mentre lei cuce. È un lavoro facile, e lei parla mentre lavora."
        costo: 2
        esito:
          titolo: La rete tesa
          testo: |
            Le tieni la rete tesa fino a notte una maglia dopo l'altra, mentre
            Tersilla ti racconta delle reti tagliate sotto lo Scoglio ai tempi
            di suo nonno. Di come si scendesse là sotto non dice niente.
            Quando l'oste chiude hai le dita segnate dallo spago.
          effetti: { avventura.ponte-pesce: 1 }

  # ------------------------------------------------------------ 2 → 3 · il boccaglio
  - id: avv-ponte-pesce-il-boccaglio
    immagine: icone/gas-mask
    titolo: Il boccaglio del nonno
    sommario: "Ciro ha trovato in fondo a una cassa il boccaglio d'ottone di suo nonno. Gli manca soltanto un cristallo carico."
    luogo: Città Bassa, la baracca di Ciro sotto la seconda arcata
    area: citta-bassa
    requisiti: [avventura.ponte-pesce == 2]
    testo: |
      La baracca di Ciro è appoggiata a un pilone sotto la seconda arcata del Ponte. Sul tavolo c'è una cassa
      aperta, e Ciro ne ha tirato fuori un boccaglio d'ottone annerito con le cinghie per la nuca e un castone
      vuoto all'altezza della bocca.

      «Era di mio nonno» dice. «La Gilda pagava i pescatori per ripescare le casse delle chiatte affondate, e
      lui scendeva con questo. Ci va un cristallo conduttore carico, e il suo si è spento prima che nascessi
      io.»

      Accanto alla cassa c'è il cristallo vecchio, opaco come un dente morto.

      {tecnologia Media} Due linguette di rame toccano il cristallo ai lati. Il cristallo scalda l'acqua del
      beccuccio e ne tira fuori l'aria, ma deve essere pieno.
    opzioni:
      - testo: "Comprare un cristallo al Mercato dei Nodi"
        descrizione: "Al banco dei cristalli ce ne sono di carichi, registrati dalla Gilda. Costano quello che costano."
        requisiti: [monete >= 30]
        esito:
          titolo: Il cristallo del Mercato
          testo: |
            Al Mercato dei Nodi la donna del banco dei cristalli ti fa
            scegliere fra tre, e ti scrive il numero di registro su un
            foglietto. Ciro lo monta nel castone con le mani che tremano, e il
            cristallo si accende di un azzurro pulito appena tocca il rame.
          effetti: { avventura.ponte-pesce: 1, avv-ponte-pesce.boccaglio: 1, monete: -30 }
      - testo: "Montare uno dei tuoi cristalli carichi"
        descrizione: "Ne hai uno nella sacca. Starà meglio in un boccaglio che in fondo a un baule."
        requisiti: [cristalli.cristallo-carico >= 1]
        esito:
          titolo: Dalla sacca
          testo: |
            Tiri fuori dalla sacca il cristallo e lo dai a Ciro, che lo guarda
            controluce prima di montarlo. Nel castone si accende subito, e
            l'ottone vecchio comincia a ronzare piano sul tavolo.
          effetti: { avventura.ponte-pesce: 1, avv-ponte-pesce.boccaglio: 1, cristalli.cristallo-carico: -1 }
      - testo: "Svitare il cristallo della lanterna dell'arco"
        descrizione: "In cima al Ponte c'è una lanterna con un cristallo carico, e di notte i Custodi dormono. Al Ponte se ne accorgeranno."
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Media }
        successo:
          titolo: La lanterna spenta
          testo: |
            Sali sul palo della lanterna a notte fonda e sviti il cristallo
            con la manica intorno alla mano, perché scotta. Al suo posto lasci
            il cristallo morto del nonno. La mattina il Ponte del Pesce è al
            buio, e i Custodi se la prendono con i ragazzi delle esche.
          pe: { furtivita: 2 }
          effetti: { avventura.ponte-pesce: 1, avv-ponte-pesce.boccaglio: 1, sospetto: 0.5 }
        fallimento:
          titolo: Il Custode sveglio
          testo: |
            A metà palo una finestra si apre e un Custode di Passaggio ti
            grida di scendere. Scendi, e scappi lungo il canale con la
            lanterna che dondola sopra di te ancora accesa.
          effetti: { sospetto: 1 }
      - testo: "Svegliare il cristallo morto con le formule dell'Accademia"
        descrizione: "A Torvessa si dice che un cristallo spento non è sempre un cristallo morto. Temmerin lo diceva, almeno."
        quando: [origine.allievo-di-torvessa >= 1]
        prova: { attributo: mentale, abilita: magia, difficolta: Media }
        successo:
          titolo: Il dente che si accende
          testo: |
            Tieni il cristallo vecchio fra pollice e indice e gli parli con le
            prime formule, quelle che Temmerin vi faceva ripetere a memoria.
            Dentro il grigio si accende un filo azzurro, poi un altro, finché
            il cristallo torna pieno e ti scalda le dita.
          pe: { magia: 2 }
          effetti: { avventura.ponte-pesce: 1, avv-ponte-pesce.boccaglio: 1 }
        fallimento:
          titolo: La formula storta
          testo: |
            Sbagli una formula a metà, e il cristallo ti restituisce una
            scossa che ti arriva fino ai denti. Resta grigio, e tu hai un
            ronzio nelle orecchie fino a sera.
          effetti: { tormento: 0.5 }
      - testo: "Farti vendere un cristallo dalla Gilda a prezzo di licenza"
        descrizione: "Con la licenza della Gilda i cristalli registrati si comprano al magazzino, senza il ricarico del banco."
        quando: [origine.mercante-dei-ponti >= 1]
        requisiti: [monete >= 15]
        esito:
          titolo: Il prezzo di licenza
          testo: |
            Al magazzino della Gilda mostri la licenza, e il commesso ti dà un
            cristallo carico con il registro già compilato, senza nemmeno
            alzare gli occhi. Ciro lo monta nel castone e lo guarda accendersi
            come si guarda un fuoco d'inverno.
          effetti: { avventura.ponte-pesce: 1, avv-ponte-pesce.boccaglio: 1, monete: -15 }

  # ------------------------------------------------------------ 3 → 4 · la prova nel canale
  - id: avv-ponte-pesce-l-acqua-del-canale
    immagine: icone/drowning
    titolo: L'acqua del canale
    sommario: "Prima del Torvessa, il canale sotto il Ponte. Ciro tiene la cima, e tu provi il boccaglio nell'acqua nera."
    luogo: Città Bassa, il canale sotto il Ponte del Pesce
    area: citta-bassa
    requisiti: [avventura.ponte-pesce == 3]
    testo: |
      A notte fonda il canale sotto il Ponte del Pesce è nero e lento. Ciro ti lega una cima alla vita e se ne
      avvolge l'altro capo al polso. Un colpo vuol dire che va tutto bene, due vogliono dire tirami su.

      Il boccaglio ti chiude la bocca con l'ottone freddo. Prima di scendere bisogna fare quello che il corpo
      non vuole, aprire la bocca sott'acqua e tirare.

      {resistenza Media} Il canale è più freddo del fiume perché il sole non ci arriva mai. Quando le mani non
      sentono più la cima conviene contare i colpi.

      *Il nonno di Ciro ci scendeva ogni giorno, ed è morto nel letto.* Ti siedi sul bordo con i piedi
      nell'acqua.
    opzioni:
      - testo: "Restare giù finché Ciro non conta fino a cento"
        descrizione: "Cento colpi di cuore nel buio, con l'ottone in bocca. Poi Ciro tira."
        prova: { attributo: fisico, abilita: [resistenza, atletica], difficolta: Media }
        successo:
          titolo: Cento
          testo: |
            Scendi fino al fondo del canale fra le pietre e le ossa di pesce,
            e il cristallo ti dà un'aria fredda che sa di rame. Al centesimo
            colpo Ciro tira, e tu rispondi con un colpo solo. Restate così
            fino all'alba, a provare.
          pe: { resistenza: 2 }
          effetti: { avventura.ponte-pesce: 1, avv-ponte-pesce.acqua: 1 }
        fallimento:
          titolo: Due colpi
          testo: |
            Al trentesimo colpo il freddo ti chiude le dita e dai due
            strattoni senza averlo deciso. Ciro ti tira su, e tu resti sui
            gradini a battere i denti con la coperta dell'osteria sulle
            spalle.
          effetti: { ferite: 0.5 }
      - testo: "Fidarti del boccaglio e aprire la bocca"
        descrizione: "Il corpo dice di non farlo. Il nonno di Ciro lo faceva tutti i giorni."
        prova: { attributo: mentale, abilita: [resilienza, tecnologia], difficolta: Media }
        successo:
          titolo: L'aria nell'acqua
          testo: |
            Apri la bocca e tiri. Per un momento hai il canale in gola. Poi
            l'ottone ronza, e l'aria arriva a bollicine, fredda come il
            metallo. Resti giù finché smetti di stringere i denti sul
            beccuccio. Quando risali Ciro ride per la prima volta da quando lo
            conosci.
          pe: { resilienza: 2 }
          effetti: { avventura.ponte-pesce: 1, avv-ponte-pesce.acqua: 1 }
        fallimento:
          titolo: Il canale in gola
          testo: |
            Apri la bocca e tiri, e ti arriva acqua. Risali tossendo canale,
            aggrappato alla cima. Per il resto della notte non riesci a
            rimetterti l'ottone fra i denti.
          effetti: { tormento: 0.5 }
      - testo: "Scendere ogni sera un po' di più"
        descrizione: "Olm aspetta, ma una settimana in più la regge. Un pezzo alla volta, finché il corpo si abitua."
        costo: 2
        esito:
          titolo: Un pezzo alla volta
          testo: |
            Ci torni per cinque sere, scendendo ogni volta un poco più a
            lungo, con Ciro che tiene la cima e non dice niente. Alla quinta
            sera ci stai abbastanza da toccare il fondo. Il resto lo imparerai
            nel fiume.
          effetti: { avventura.ponte-pesce: 1 }

  # ------------------------------------------------------------ 4 → 5 · i turni delle guardie
  - id: avv-ponte-pesce-i-turni-delle-guardie
    immagine: ambientazione/roccia-di-wren
    titolo: I turni delle guardie
    sommario: "Di notte Ciro e tu guardate l'acqua dai giunchi davanti allo Scoglio. Ogni tanto una testa bianca sale a controllare le reti."
    luogo: Il Torvessa, i giunchi davanti alla Roccia di Wren
    area: citta-bassa
    requisiti: [avventura.ponte-pesce == 4]
    testo: |
      Ciro ha preso in prestito una barca piatta e ha avvolto le pale nella tela. La sera la porta fra i
      giunchi dell'ansa a un tiro di sasso dallo Scoglio, e vi fermate lì sotto una vela vecchia.

      In cima alla Roccia di Wren la capanna bruciata è una macchia contro le stelle. Intorno alla base ci
      sono reti tese appena sotto il pelo dell'acqua, con i galleggianti immobili.

      Verso mezzanotte una testa bianca sale vicino ai galleggianti e torna giù. Più tardi ne sale un'altra da
      un altro lato.

      {natura Media} È troppo grande per una lontra e troppo lenta per un pesce. Va lungo le reti come un
      guardiano lungo le mura e controlla i nodi uno per uno.
    opzioni:
      - testo: "Contare i turni sulle dita"
        descrizione: "L'ora in cui le guardie si danno il cambio, e quanto resta vuota l'acqua fra un cambio e l'altro."
        prova: { attributo: mentale, abilita: [percezione, accademiche], difficolta: Media }
        successo:
          titolo: Il conto
          testo: |
            Conti tutta la notte con le dita e con i nodi di una cima. Le
            guardie salgono in coppia e si danno il cambio sotto i
            galleggianti, e fra un cambio e l'altro c'è il tempo di una
            preghiera lunga. Verso l'alba ne sale una da sola, vicino alla
            barca.
          pe: { percezione: 2 }
          effetti: { avventura.ponte-pesce: 1, avv-ponte-pesce.turni: 1 }
          segue: avv-ponte-pesce-la-guardia-che-sale
        fallimento:
          titolo: Il sonno
          testo: |
            Il freddo e lo sciacquio dei giunchi ti chiudono gli occhi a metà
            del conto. Ti sveglia Ciro all'alba con una mano sulla bocca, e
            sulla riva, sul fango, ci sono impronte di piedi lunghi con la
            pelle fra le dita.
          effetti: { tormento: 0.5 }
      - testo: "Andare a nuoto fino ai giunchi dello Scoglio"
        descrizione: "Da vicino si vede meglio da dove salgono. Col boccaglio in bocca, e piano."
        prova: { attributo: fisico, abilita: [furtivita, atletica], difficolta: Media }
        successo:
          titolo: Da vicino
          testo: |
            Ti lasci andare in acqua dalla poppa e nuoti fino ai giunchi dello
            Scoglio con il boccaglio coperto dalla mano. Da lì vedi la bocca
            della grotta da cui salgono le guardie, e conti i cambi finché
            l'acqua non comincia a schiarire.
          pe: { furtivita: 2 }
          effetti: { avventura.ponte-pesce: 1, avv-ponte-pesce.turni: 1 }
          segue: avv-ponte-pesce-la-guardia-che-sale
        fallimento:
          titolo: La rete sotto il pelo
          testo: |
            A metà strada nuoti dentro una rete tesa sotto il pelo dell'acqua,
            e ci metti un'eternità a uscirne senza muovere i galleggianti.
            Torni alla barca con le braccia tagliate dallo spago.
          effetti: { ferite: 0.5 }
      - testo: "Restare nei giunchi tre notti di fila"
        descrizione: "Senza contare niente. Guardando, finché le cose si ripetono da sole."
        costo: 2
        esito:
          titolo: Tre notti
          testo: |
            Restate nei giunchi tre notti di fila, e di giorno dormite nella
            baracca di Ciro con le reti sulla faccia per il buio. Alla terza
            notte sai da che lato salgono le guardie. Quante siano e quando si
            danno il cambio non l'hai capito.
          effetti: { avventura.ponte-pesce: 1 }

  - id: avv-ponte-pesce-la-guardia-che-sale
    tipo: seguito
    immagine: icone/barbed-spear
    titolo: La guardia che sale
    sommario: "Verso l'alba una guardia sale da sola accanto alla barca. Ha un arpione nero, e guarda la vela."
    luogo: Il Torvessa, i giunchi davanti alla Roccia di Wren
    area: citta-bassa
    requisiti: [avventura.ponte-pesce == 5]
    testo: |
      La guardia sale a due braccia dalla barca, così vicina che senti l'acqua scenderle dalla testa. È una
      donna alta con la pelle segnata da cicatrici chiare e un arpione di ferro nero. Sotto la mascella le
      branchie si aprono e si chiudono. Gira la testa verso la vela che vi copre e resta a guardarla.

      Accanto a te Ciro ha chiuso gli occhi e muove le labbra senza voce.

      {intimidire Difficile} Comanda lei. Le altre guardie si guardano intorno, mentre questa guarda una cosa
      sola e aspetta che si muova.
    opzioni:
      - testo: "Restare immobile sotto la vela"
        descrizione: "Una vela vecchia sopra una barca vuota, finché sotto non si muove niente."
        prova: { attributo: fisico, abilita: [furtivita, resistenza], difficolta: Media }
        successo:
          titolo: La vela vecchia
          testo: |
            Resti ferm{o|a} con una gamba che ti si addormenta sotto il corpo. La
            guardia guarda la vela a lungo. Poi gira l'arpione e torna giù
            senza un'increspatura. Ciro apre gli occhi solo quando il sole
            tocca lo Scoglio.
          pe: { furtivita: 2 }
        fallimento:
          titolo: Il colpo nella sponda
          testo: |
            Ti scappa un movimento, uno solo. L'arpione nero passa la sponda
            della barca a un palmo dalla tua gamba e torna indietro tirato da
            una corda. La guardia sparisce, e Ciro rema verso casa senza dire
            una parola.
          effetti: { tormento: 0.5 }
      - testo: "Guardarla in faccia attraverso un buco della vela"
        descrizione: "Se è lei che comanda, conviene ricordarsela."
        prova: { attributo: mentale, abilita: [percezione, resilienza], difficolta: Media }
        successo:
          titolo: La faccia
          testo: |
            Da un buco della tela le guardi la faccia mentre lei guarda la
            vela. Ha un occhio solo che si copre con la seconda palpebra, e
            l'altro chiuso da una cicatrice. Al collo porta un anello di
            catena, come un ciondolo. Poi torna giù, e tu la faccia te la
            porti a casa.
          pe: { percezione: 2 }
        fallimento:
          titolo: L'occhio
          testo: |
            Accosti l'occhio al buco della tela proprio mentre lei ci guarda
            dentro. Per un tempo lungo vi guardate attraverso lo stesso buco,
            poi lei torna giù. Quella notte la rivedi in sogno.
          effetti: { tormento: 0.5 }

  # ------------------------------------------------------------ 6 → 7 · sotto l'arco
  - id: avv-ponte-pesce-sotto-l-arco
    immagine: ambientazione/ponti-sospesi
    titolo: Sotto l'arco
    sommario: "Olm è libero, e passa le giornate sotto l'arco del Ponte, con la testa appena fuori dall'acqua. Ciro deve decidere dove tenerlo, e chiede a te."
    luogo: Città Bassa, sotto l'arco del Ponte del Pesce
    area: citta-bassa
    requisiti: [avventura.ponte-pesce == 6]
    testo: |
      Tre giorni dopo, sotto l'arco del Ponte del Pesce, Ciro ti aspetta seduto sul primo gradino con i piedi
      nell'acqua. Accanto a lui, sotto il pelo dell'acqua, c'è una testa chiara con due occhi scuri. Olm sta
      lì da stamattina, e i ragazzi delle esche hanno cominciato a fare domande.

      «Dai suoi non ci torna» dice Ciro. «Me l'ha spiegato a gesti. Allora resta qua al Ponte, che lo vedono
      tutti? Nei giunchi dello scalo, dove vado solo io? Oppure gli porto alla Roccia la mia proposta, e
      vediamo se la sua gente la sente.»

      Ciro propone che quelli del Ponte non calino più reti sotto lo Scoglio, e che in cambio i Sommersi
      lascino Olm libero di andare e venire dalla sua gente.

      {politica-ed-economia Media} È un patto fra due popoli scritto da un pescatore e sigillato da una
      stretta di mano bagnata. Al Municipio ne firmano di peggiori.

      {origine figlio-della-citta-bassa} In Città Bassa un segreto dura finché qualcuno ha fame, e al Ponte
      del Pesce la fame non manca mai.
    opzioni:
      - testo: "Dirlo a tutto il Ponte del Pesce"
        descrizione: "All'osteria, a voce alta, con Tersilla presente. Se lo sanno tutti, nessuno può venderlo."
        esito:
          titolo: Davanti a tutti
          testo: |
            Lo dite a tutti all'osteria sotto l'arco, e Tersilla annuisce dal
            suo angolo come se lo sapesse da sempre. La mattina dopo i
            pescatori lasciano un secchio di pesce sul primo gradino, e Olm
            impara in fretta i loro nomi. In Città Bassa se ne parla per una
            settimana, e in Caserma qualcuno prende nota.
          effetti: { avventura.ponte-pesce: 1, nomea.citta-bassa: 1, sospetto: 0.5 }
          imposta: { avv-ponte-pesce.olm: 1 }
      - testo: "Tenerlo fra te e Ciro"
        descrizione: "Nei giunchi dello scalo, dove nessuno va. Ciro gli porta il pesce, e il Ponte non sa niente."
        esito:
          titolo: I giunchi dello scalo
          testo: |
            Ciro accompagna Olm di notte fino ai giunchi dello scalo, sul lato
            est dello Scoglio, dove le guardie non salgono mai. Gli porta il
            pesce ogni due giorni, e al Ponte dice che va a calare le nasse.
            Tu ti porti dietro un segreto che a qualcuno, in città, varrebbe
            parecchio.
          effetti: { avventura.ponte-pesce: 1, informazioni.segreto: 1 }
          imposta: { avv-ponte-pesce.olm: 2 }
      - testo: "Portare la proposta di Ciro alla Roccia"
        descrizione: "Ciro rema, Olm fa da voce, e tu parli. Dall'altra parte ci sarà la capo delle guardie."
        costo: 0
        esito:
          titolo: Verso lo Scoglio
          testo: |
            Ciro rema fino all'ansa in pieno giorno, con la vela alzata perché
            vi vedano arrivare. Olm nuota accanto alla barca, e quando siete
            davanti allo Scoglio batte tre volte la mano aperta sull'acqua.
          segue: avv-ponte-pesce-la-parola-di-ilske

  - id: avv-ponte-pesce-la-parola-di-ilske
    tipo: seguito
    immagine: icone/barbed-spear
    titolo: La parola di Ilske
    sommario: "Davanti allo Scoglio, in pieno giorno, Ilske sale dall'acqua con un arpione nuovo e ascolta la proposta di un pescatore."
    luogo: Il Torvessa, davanti alla Roccia di Wren
    area: citta-bassa
    requisiti: [avventura.ponte-pesce == 6]
    testo: |
      Ilske sale dall'acqua fino alla vita davanti alla prua, e dietro di lei salgono altre quattro teste. Ha
      l'occhio buono coperto dalla seconda palpebra e tiene l'arpione nero basso. Guarda Ciro e Olm, poi si
      ferma su di te.

      Olm parla per primo con la gola, a colpi brevi. Ilske lo lascia finire senza guardarlo e poi ti fa un
      cenno con il mento. Tocca a te dire la proposta, e a Olm tradurla.

      {empatia Media} Le guardie guardano Olm con una rabbia che ha dentro un po' d'invidia.
    opzioni:
      - testo: "Dirle che il debito si paga con un debito"
        descrizione: "Olm ha salvato uno di sopra, e quelli di sopra lasciano lo Scoglio ai Sommersi. Un conto che torna."
        prova: { attributo: sociale, abilita: [persuasione, politica-ed-economia], difficolta: Difficile }
        successo:
          titolo: Il conto che torna
          testo: |
            Parli piano, e Olm traduce a colpi di gola. Ilske ascolta fino
            alla fine, poi tende la mano aperta sopra l'acqua verso Ciro. Lui
            la stringe. Quando Ilske torna giù Olm va con lei, e prima di
            sparire si volta a guardarvi.
          pe: { persuasione: 5 }
          effetti: { avventura.ponte-pesce: 1, rep.ponti: 1 }
          imposta: { avv-ponte-pesce.olm: 3 }
        fallimento:
          titolo: L'arpione nell'acqua
          testo: |
            A metà della proposta Ilske pianta l'arpione nell'acqua davanti
            alla prua e se ne va, con le altre dietro. Olm resta accanto alla
            barca. Tornate al Ponte senza parlare, e la proposta resta a Ciro.
          effetti: { tormento: 0.5 }
      - testo: "Offrirle il pesce del Ponte come si fa con un capo"
        descrizione: "Una cesta del pescato migliore, posata sull'acqua con le due mani, e gli occhi bassi."
        prova: { attributo: sociale, abilita: [galateo, empatia], difficolta: Difficile }
        successo:
          titolo: La cesta
          testo: |
            Posi la cesta sull'acqua con le due mani e abbassi la testa. Ilske
            prende un pesce e lo annusa a lungo prima di passarlo alla guardia
            accanto. Poi tende la mano aperta verso Ciro, che la stringe. Olm
            torna giù con lei, e la cesta va a fondo vuota.
          pe: { galateo: 5 }
          effetti: { avventura.ponte-pesce: 1, rep.ponti: 1 }
          imposta: { avv-ponte-pesce.olm: 3 }
        fallimento:
          titolo: La cesta rovesciata
          testo: |
            Ilske rovescia la cesta con la punta dell'arpione, e il pesce del
            Ponte va giù fra le gambe delle guardie. Se ne vanno senza una
            parola. Olm resta accanto alla barca, e Ciro tira su i remi.
          effetti: { scandalo: 0.5 }

  # ------------------------------------------------------------ 7 → 8 · l'arpione
  - id: avv-ponte-pesce-l-arpione
    immagine: icone/barbed-spear
    titolo: L'arpione del Sommerso
    sommario: "Sul primo gradino del Ponte del Pesce c'è un fagotto di tela da vela lungo quanto un uomo. Ciro non lo vuole toccare."
    luogo: Città Bassa, sotto l'arco del Ponte del Pesce
    area: citta-bassa
    requisiti: [avventura.ponte-pesce == 7]
    testo: |
      Qualche sera dopo il ragazzo delle esche ti viene a cercare da parte di Ciro. Sul primo gradino sotto
      l'arco del Ponte c'è un fagotto di tela da vela legato con lo spago, e Ciro ci sta seduto accanto senza
      toccarlo.

      «È roba sua, e l'ha lasciata per te» dice. «Me l'ha messa in mano e ha fatto il gesto che vuol dire te,
      con il dito sul petto. Gli ho detto che a me non serve e lui ha rifatto il gesto.»

      Dentro la tela c'è un arpione. Il fusto è di un legno nero che sul Torvessa non cresce, e la punta di
      ferro vecchio ha tre denti piegati all'indietro. L'alga intrecciata dell'impugnatura è consumata da anni
      di guardia.

      {armi-da-mischia Media} È fatto per spingere più che per lanciare. La corda all'occhiello serve a
      riprenderlo, e i denti a non farlo uscire dalla carne.
    opzioni:
      - testo: "Prenderlo davanti a tutto il Ponte"
        descrizione: "Al Ponte lo sanno tutti, e stasera i pescatori sono sui gradini a guardare."
        quando: [avv-ponte-pesce.olm == 1]
        esito:
          titolo: Il Ponte che guarda
          testo: |
            Sciogli lo spago davanti ai pescatori, e quando alzi l'arpione
            qualcuno batte le mani e qualcun altro si fa il segno dell'Albero.
            Sotto il gradino Olm tira fuori la testa dall'acqua, guarda
            l'arpione nelle tue mani e torna giù contento.
          effetti: { avventura.ponte-pesce: 1, oggetto.avv-ponte-pesce-arpione-del-sommerso: 1 }
      - testo: "Prenderlo e andare a ringraziarlo nei giunchi"
        descrizione: "Ciro rema, e allo scalo c'è chi aspetta."
        quando: [avv-ponte-pesce.olm == 2]
        esito:
          titolo: Allo scalo
          testo: |
            Ciro ti porta allo scalo con l'arpione di traverso sulle
            ginocchia. Olm sale fra i giunchi, tocca la punta con un dito e
            poi tocca il tuo petto, come aveva fatto con Ciro. Torna giù senza
            aspettare un grazie, e tu lo dici lo stesso all'acqua.
          effetti: { avventura.ponte-pesce: 1, oggetto.avv-ponte-pesce-arpione-del-sommerso: 1 }
      - testo: "Prenderlo e portarlo allo Scoglio a farti vedere"
        descrizione: "Olm è tornato fra i suoi. Un arpione di guardia in mano a uno di sopra, le guardie lo devono sapere."
        quando: [avv-ponte-pesce.olm == 3]
        esito:
          titolo: L'arpione di sopra
          testo: |
            All'ansa alzi l'arpione sopra la barca. Salgono due teste, poi una
            terza con un occhio solo, e Ilske guarda l'arpione a lungo prima
            di tornare giù. Olm resta su ancora un momento, e batte la mano
            aperta sull'acqua per salutare.
          effetti: { avventura.ponte-pesce: 1, oggetto.avv-ponte-pesce-arpione-del-sommerso: 1 }
      - testo: "Prendere l'arpione"
        descrizione: "È tuo. Olm l'ha detto con il dito sul petto."
        quando: [avv-ponte-pesce.olm == 0]
        esito:
          titolo: Il gesto
          testo: |
            Sciogli lo spago e prendi l'arpione con le due mani. Pesa meno di
            quanto sembra, e l'alga dell'impugnatura è ancora umida. Ciro
            guarda il canale e dice che adesso il debito è pagato, e non si
            capisce se parla di sé o di Olm.
          effetti: { avventura.ponte-pesce: 1, oggetto.avv-ponte-pesce-arpione-del-sommerso: 1 }
