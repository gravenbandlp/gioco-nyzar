# I nomi nuovi dell'Avventura 5, nel formato di contenuti/glossario/personaggi.yaml: presentazioni stabili, senza
# segreti. Ciro Scardola e Tersilla sono del Ponte del Pesce; i Sommersi, Olm e Ilske vengono dalle grotte allagate
# sotto la Roccia di Wren (lore nuova approvata) e si vedono solo dopo l'aggancio.
# - «Sommersi» ha le forme al singolare con la maiuscola: nei testi l'aggettivo («la scala sommersa») resta minuscolo.
glossario:
  - id: ciro-scardola
    nome: Ciro Scardola
    alias: [Ciro]
    tipo: personaggio
    sottotitolo: "Pescatore del Ponte del Pesce"
    testo: "Pescatore del Torvessa che vende sui gradini del Ponte del Pesce da trent'anni e vive in una baracca sotto la seconda arcata. Ha le mani gonfie di chi tira reti da sempre, prega sgranando una cima piena di nodi e i debiti li paga, anche quelli che nessuno gli chiede."
    requisiti: []

  - id: tersilla
    nome: Tersilla
    tipo: personaggio
    sottotitolo: "La più vecchia del Ponte del Pesce"
    testo: "Una vecchia pescatrice quasi cieca che passa le giornate nell'angolo dell'osteria sotto l'arco del Ponte del Pesce, a ricucire reti con un ago d'osso al tatto. Comincia ogni frase con «senti a me» e si ricorda lo Scoglio da prima che ci andasse a vivere l'intagliatore."
    requisiti: []

  - id: sommersi
    nome: Sommersi
    alias: [Sommerso, Sommersa]
    tipo: creatura
    sottotitolo: "La gente d'acqua sotto la Roccia di Wren"
    testo: "Un popolo piccolo e chiuso che vive nelle grotte allagate sotto la Roccia di Wren. Hanno la pelle chiara, le branchie sotto la mascella e una seconda palpebra sugli occhi, e salgono di rado. Tagliano le reti di chi pesca sotto lo Scoglio, e la loro legge vieta di toccare chi vive di sopra."
    requisiti: [avventura.ponte-pesce >= 1]

  - id: olm
    nome: Olm
    tipo: personaggio
    sottotitolo: "Guardia dei Sommersi"
    testo: "Una guardia dei Sommersi lunga e magra, con la pelle del colore della pancia di un pesce. Il nome gliel'ha dato Ciro Scardola, da una parola detta con la gola. Della lingua di sopra conosce poche parole, imparate ascoltando i pescatori da sotto le barche."
    requisiti: [avventura.ponte-pesce >= 1]

  - id: ilske
    nome: Ilske
    tipo: personaggio
    sottotitolo: "Capo delle guardie dei Sommersi"
    testo: "La capo delle guardie dei Sommersi, alta, con un occhio solo e un anello di catena portato al collo come un ciondolo. Nuota senza fretta e tiene un arpione di ferro nero legato al polso con una corda d'alga. Per lei la legge è la legge, e un debito è un debito."
    requisiti: [avventura.ponte-pesce >= 5]
