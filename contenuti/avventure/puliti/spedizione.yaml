# I Puliti di Pannion, la spedizione (avventura.puliti == 6): le acque sotto la vecchia Pannion. Si scende dalla
# cisterna del forno vecchio (`avv-puliti-la-bocca-della-cisterna`, presso Pannion): per la scala con una prova Media,
# dietro Delek con avv-puliti.delek, o calati da Nerio con la corda a 2 rintocchi. La ritirata riporta alla Superficie
# e azzera la profondità. Soglia 10, tre stanze alla volta; una stanza superata non ricompare nella stessa visita.
# Le fasce di profondità:
# - 0-2, la cisterna allagata (prove Medie e Difficili, vie senza prova da 2 rintocchi e ½ negativa): la scala sotto
#   l'acqua (avv-puliti.goccia apre la via delle gocce), i pesci ciechi (l'anguilla), le cose lasciate (il carbone
#   di Darrin, avv-puliti.carbone), il sifone.
# - 3, 4 e 6, le rovine dell'antico dominio (prove Difficili): la via dei gradini bassi, le nicchie dei servi (un
#   servo), l'acqua in piedi (avv-puliti.pelle toglie la Contaminazione), la vasca dei tributi.
# - 5, la svolta: i murali del sovrano, che un tempo regnava su un impero sotto il mare e lo ha perso quando i suoi
#   hanno alzato la testa verso una balena-spirito (avv-puliti.murali). Non è ripetibile: è l'unica stanza a 5, e si
#   rigioca a ogni visita.
# - 7-9, la soglia del Regno Profondo, dove le visioni chiedono di arrendersi (prove Difficili, una Molto difficile o
#   uno scontro per stanza, vie senza prova da 3 rintocchi e ½ negativa): la luce che sale, la voce di Darrin
#   (avv-puliti.coro e chiave.vecchio), gli annegati in piedi (due servi), la porta di casa.
# - 10, il cuore `avv-puliti-l-offerta`: Ossaleth offre di pulirti (accettare è la sconfitta, una negativa e fuori),
#   poi il seguito `avv-puliti-lo-scontro-nell-acqua` con lo scontro e le vie Difficili (avv-puliti.pagine,
#   avv-puliti.murali, l'opzione d'origine dell'Accolito del Velo). Chi vince porta la pista a 7 e torna in
#   Superficie; chi perde o fallisce torna in Superficie con Ferite e Tormento, e il cuore è da rifare.
# Origini: apprendista-raschiatore (la porta di casa), allievo-di-torvessa (i murali).
aree:
  - id: avv-puliti
    immagine: ambientazione/regno-profondo
    nome: Le acque sotto la vecchia Pannion
    sommario: "Sotto il forno della vecchia Pannion una cisterna allagata scende verso rovine più vecchie del bosco, e più in basso ancora c'è il Regno Profondo."
    spedizione: { ritorno: superficie-fratturata, soglia: 10, stanze: 3 }
    testo: |
      La cisterna del forno vecchio è una sala di pietra grigia allagata fino al petto, con una scala che gira
      lungo le pareti. I blocchi sono squadrati e murati a calce, e sotto la bava si vedono ancora i colpi
      dello scalpello. Le gallerie oltre la cisterna non le ha scavate la gente di Pannion. Dove comincia la
      prima le giunture finiscono, e le pareti scendono lisce e senza un taglio verso rovine fatte per corpi
      che nuotavano.

      Qui sotto l'acqua è tiepida e ha una bava chiara che si attacca a tutto. I pesci ciechi ti seguono a
      banchi, e più scendi più la luce della lanterna si accorcia.

colonna:
  - { contesto: area, id: avv-puliti, musica: the-light-that-failed, ambiente: cave }

storylet:
  # ------------------------------------------------------------ l'ingresso, dal forno vecchio
  - id: avv-puliti-la-bocca-della-cisterna
    presso: pannion
    immagine: icone/well
    titolo: La bocca della cisterna
    sommario: "Sotto il forno della vecchia Pannion l'acqua nera si muove dal fondo, e in piazza i Puliti aspettano ancora."
    luogo: La vecchia Pannion, il forno vecchio
    area: superficie-fratturata
    requisiti: [avventura.puliti == 6]
    testo: |
      Lumelli sta legato a una panca della cappella di Frate Koln, con i guanti infilati e gli occhi sul
      pavimento. Da quando l'hai portato su ripete una parola sola. «Ossaleth» dice. «Ossaleth è sveglio.» In
      piazza i Puliti sono ancora in piedi davanti alla valle, con Darrin in prima fila.

      Nella vecchia Pannion, al posto del forno, l'acqua della cisterna sale e scende in cerchi. Del forno
      restano tre pareti di mattoni neri di fuliggine, e il resto è crollato dentro l'acqua. L'acqua sale di
      un dito lungo la pietra e poi riscende. Fra un'onda e l'altra conti sempre fino a dodici.

      Una scala di pietra scende a spirale lungo la parete fin sotto il pelo dell'acqua. La pietra della scala
      è grigia e liscia fin dal primo gradino, e sui gradini non c'è la fuliggine che copre i mattoni. Ti dici
      che sarà l'acqua a lavarli, quando sale. Nerio lega la corda del suo pozzo al tronco della sequoia che
      ha sfondato il tetto. Le falene che girano intorno alla lanterna arrivano fino al bordo del forno, e più
      giù non scendono.

      {natura Media} L'acqua è più calda dell'aria della notte, e da sotto un bosco non dovrebbe salire niente
      di caldo.
    opzioni:
      - testo: "Scendere per la scala della cisterna"
        descrizione: "I gradini sono coperti da una bava trasparente. Nerio tiene la corda, se serve."
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Media }
        successo:
          titolo: La scala
          testo: |
            Scendi i gradini con una mano sulla parete, girando con la scala, e la bava ti si attacca alle
            suole come colla fresca. Quando l'acqua ti arriva alle ginocchia alzi la lanterna. L'acqua che ti
            entra negli stivali è tiepida, e a ogni gradino è un poco più calda. Sopra di te Nerio è un'ombra
            piccola contro il cielo senza luna.
          pe: { acrobazia: 2 }
          vai: avv-puliti
        fallimento:
          titolo: Gli ultimi gradini
          testo: |
            A metà scala la suola scivola sulla bava e fai gli ultimi gradini sedut{o|a}, fino a finire
            nell'acqua alla cintura. È tiepida e densa. Quando ti tiri su la bava ti resta sulle mani in fili
            lunghi che non si spezzano. Nerio ti grida dall'alto se sei viv{o|a}, e tu gli rispondi sputando.
          effetti: { contaminazione: 0.5 }
          vai: avv-puliti
      - testo: "Scendere dietro Delek, che conosce la cisterna"
        descrizione: "Delek ci ha portato Lumelli. Sa dove i fornai di una volta scendevano a prendere l'acqua."
        requisiti: [avv-puliti.delek >= 1]
        esito:
          titolo: La scala dei fornai
          testo: |
            Delek infila il braccio nella bocca del forno crollato e tira fuori una scala di ferro murata
            nella parete, nascosta dalla fuliggine di settant'anni. I pioli sono mangiati dalla ruggine e un
            paio si piegano sotto il peso. La scendete uno dietro l'altro, all'asciutto fino al pelo
            dell'acqua, dove il ferro finisce sulla pietra grigia della cisterna e la pietra non ha un
            graffio. In fondo Delek ti batte una mano sulla spalla e risale senza voltarsi.
          vai: avv-puliti
      - testo: "Farti calare da Nerio con la corda del pozzo"
        descrizione: "Nerio batte castagni da quarant'anni e ha le braccia per farlo. Ci vuole tempo, e la corda dondola."
        costo: 2
        esito:
          titolo: La corda che dondola
          testo: |
            Nerio ti cala piano, un palmo alla volta, contando ad alta voce per farsi coraggio. La corda gira
            su se stessa e ti porta a sbattere contro la parete bagnata a ogni giro. Più scendi più la sua
            voce arriva piccola, e il conto si fa veloce. Arrivi in fondo con la nausea e le mani impastate di
            bava.
          effetti: { contaminazione: 0.5 }
          vai: avv-puliti

  # ------------------------------------------------------------ 0-2 · la cisterna allagata
  - id: avv-puliti-la-scala-sotto-l-acqua
    immagine: icone/stairs
    titolo: La scala sotto l'acqua
    sommario: "La scala della cisterna continua sott'acqua, e su ogni gradino c'è una goccia incisa."
    luogo: Le acque sotto la vecchia Pannion, la scala
    area: avv-puliti
    ripetibile: true
    requisiti: [avventura.puliti == 6, profondita.avv-puliti <= 2]
    testo: |
      Sotto il pelo dell'acqua la scala continua a scendere oltre la luce della lanterna, e l'acqua ti sale
      fino alla vita. Su ogni gradino è incisa una goccia come quelle degli stipiti, e sopra le gocce c'è una
      bava trasparente che trattiene la luce come una gelatina. I gradini sono larghi il doppio di un passo e
      bassi la metà, e dopo i primi dieci le tue gambe non trovano più il ritmo per scenderli.

      {acrobazia Media} I gradini sono consumati al centro e intatti sui bordi. Chi li usava ci passava sopra
      con il ventre e sempre nello stesso punto, finché la pietra ha preso la forma di un corpo che scivola.

      Dove la luce arriva appena la bava al centro dei gradini ondeggia ancora, e intorno l'acqua è ferma.
    opzioni:
      - testo: "Scendere tenendoti alla parete"
        descrizione: "Una mano sulla pietra, un gradino alla volta, con l'acqua che sale."
        prova: { attributo: fisico, abilita: acrobazia, difficolta: Media }
        successo:
          titolo: Il fondo della scala
          testo: |
            Scendi con il petto contro la parete e la lanterna alta, finché l'acqua ti arriva alle ascelle e
            il gradino dopo non c'è più. La scala finisce su un pavimento piano, e intorno a te la cisterna si
            apre in una sala. Le pareti salgono curve e senza un angolo. All'altezza della tua testa corre una
            fila di nicchie così profonde che la lanterna non ne illumina il fondo.
          pe: { acrobazia: 2 }
          effetti: { profondita.avv-puliti: 1 }
        fallimento:
          titolo: Sotto
          testo: |
            Il piede scivola sulla bava e vai sotto con tutta la testa. L'acqua è tiepida e densa, e
            sott'acqua senti una nota lunga e bassa che sale dal fondo della scala. Ne esci tossendo e
            aggrappat{o|a} al gradino di prima, e la lanterna è ancora accesa. Fuori dall'acqua la nota non si
            sente più.
          effetti: { contaminazione: 0.5 }
      - testo: "Seguire le gocce dove puntano"
        descrizione: "Le gocce dei Puliti indicano l'acqua. Qui sotto, forse, indicano anche la strada."
        requisiti: [avv-puliti.goccia >= 1]
        esito:
          titolo: Le punte storte
          testo: |
            Le punte delle gocce pendono tutte a sinistra, gradino dopo gradino. A metà discesa trovi a
            sinistra un arco basso sott'acqua che porta dritto in fondo alla cisterna, senza girare. L'arco è
            largo tre volte la sua altezza, e la volta è un blocco solo senza una giuntura. Ci passi
            chinat{o|a}, con la lanterna sopra la testa e la pietra che ti sfiora i capelli.
          effetti: { profondita.avv-puliti: 1 }
      - testo: "Cercare dove la scala lascia la parete"
        descrizione: "Una scala così lunga ha un pianerottolo, o una porta, da qualche parte sotto l'acqua."
        prova: { attributo: mentale, abilita: [percezione, tecnologia], difficolta: Difficile }
        successo:
          titolo: Il pianerottolo
          testo: |
            Tasti la parete con il piede a ogni gradino finché senti il vuoto. È un pianerottolo, e dal
            pianerottolo parte un passaggio in piano che taglia la cisterna. Il fondo è consumato al centro
            come i gradini, in una conca liscia larga quanto le tue spalle. Così ti risparmi metà della
            discesa a spirale.
          pe: { percezione: 2 }
          effetti: { profondita.avv-puliti: 1 }
        fallimento:
          titolo: Il vuoto
          testo: |
            Il vuoto che senti con il piede è la fine del gradino, e ci cadi dentro fino al mento. Le gambe ti
            penzolano nell'acqua e i piedi il fondo non lo trovano. Torni su per tre gradini a forza di
            braccia, e ti siedi con l'acqua alla vita a guardare la lanterna che trema.
          effetti: { tormento: 0.5 }
      - testo: "Scendere un gradino alla volta, legato alla corda"
        descrizione: "La corda di Nerio arriva fin qui. È lenta, e la corda tira."
        costo: 2
        esito:
          titolo: La corda tesa
          testo: |
            Scendi con la corda legata in vita, fermandoti dopo ogni gradino, finché la corda finisce e devi
            slegarla. Il nodo è gonfio d'acqua, e ci metti a lungo a scioglierlo con le dita intorpidite. Sei
            in fondo, con la pelle delle mani bianca e grinzosa e la bava fino ai gomiti.
          effetti: { profondita.avv-puliti: 1, contaminazione: 0.5 }

  - id: avv-puliti-i-pesci-ciechi
    immagine: icone/eel
    titolo: I pesci ciechi
    sommario: "In fondo alla cisterna l'acqua è piena di pesci bianchi senza occhi. Fra loro nuota una forma lunga come una barca."
    luogo: Le acque sotto la vecchia Pannion, il fondo della cisterna
    area: avv-puliti
    ripetibile: true
    requisiti: [avventura.puliti == 6, profondita.avv-puliti <= 2]
    testo: |
      Il fondo della cisterna è una sala dalle volte basse, allagata fino al petto, e la lanterna alzata
      sfiora la pietra bagnata del soffitto. Ci nuotano a centinaia i pesci bianchi e ciechi che i Puliti
      mangiano crudi, e ti mordicchiano le dita. Dove dovrebbero avere gli occhi hanno due chiazze di pelle
      liscia, e la luce della lanterna li attraversa fino alla spina.

      Più in là, dove l'acqua è più scura, si muove una forma lunga quanto una barca. Ti dici che in un'acqua
      chiusa da tanti anni un'anguilla può crescere quanto vuole. Quando passa, la superficie si alza di un
      palmo da un capo all'altro della sala.

      {natura Media} I pesci si allontanano dalla forma lunga e tornano quando è passata. Dove sono fitti, lei
      non c'è.
    opzioni:
      - testo: "Muoverti dove i pesci sono fitti"
        descrizione: "I pesci sanno dove sta la forma lunga. Basta stare in mezzo a loro."
        prova: { attributo: mentale, abilita: natura, difficolta: Media }
        successo:
          titolo: In mezzo al banco
          testo: |
            Attraversi la sala in mezzo al banco più fitto e ti sposti insieme a lui, e i pesci ti battono
            contro le gambe come pioggia. La forma lunga ti gira intorno due volte. Al secondo giro l'acqua
            che sposta ti tira i calzoni verso di lei, e poi la forma se ne va a cercare altrove.
          pe: { natura: 2 }
          effetti: { profondita.avv-puliti: 1 }
        fallimento:
          titolo: Il banco che si apre
          testo: |
            Il banco si apre davanti a te tutto in una volta, e nel vuoto c'è la forma lunga con la bocca
            aperta. Dentro ha denti piccoli e fitti che puntano tutti verso la gola. Torni indietro a
            bracciate fino alla scala, con un morso sul polpaccio che sanguina nell'acqua in fili scuri.
          effetti: { ferite: 0.5 }
      - testo: "Affrontare l'anguilla cieca"
        descrizione: "È lunga quanto una barca e non ha occhi. Sente l'acqua che sposti, e tu ne sposti molta."
        combattimento: avv-puliti-l-anguilla
        vittoria:
          titolo: L'anguilla
          testo: |
            L'anguilla si gira sulla schiena e affonda lenta, con la pancia bianca verso la volta. I pesci
            ciechi le si buttano addosso tutti insieme, e l'acqua intorno a lei ribolle. Attraversi la sala
            mentre mangiano, e per tutta la traversata nessun pesce ti tocca le dita.
          effetti: { profondita.avv-puliti: 1 }
        sconfitta:
          titolo: La coda
          testo: |
            L'anguilla ti avvolge le gambe con la coda e ti tira sotto due volte. Laggiù la sua pelle è fredda
            contro le tue gambe, e l'acqua che ti entra in bocca è tiepida. La seconda volta ti lascia, e tu
            risali la scala con l'acqua che ti esce dal naso.
          effetti: { tormento: 0.5 }
      - testo: "Attraversare a nuoto, in fretta"
        descrizione: "La sala è lunga venti bracciate. Si possono fare prima che la forma lunga torni."
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Difficile }
        successo:
          titolo: Venti bracciate
          testo: |
            Nuoti con la lanterna stretta fra i denti per il manico, e senti la forma lunga passarti sotto
            quando sei già a metà. La sua scia ti solleva le gambe e poi le lascia ricadere. Arrivi dall'altra
            parte con le braccia di piombo, e sei già fuori dall'acqua alta.
          pe: { atletica: 2 }
          effetti: { profondita.avv-puliti: 1 }
        fallimento:
          titolo: Il morso
          testo: |
            A metà sala la forma lunga ti prende per lo stivale e ti trascina indietro per tutta la strada
            fatta. Lo fa senza fretta e a pelo d'acqua, e non tira mai verso il fondo. Ti lascia andare vicino
            alla scala, con lo stivale bucato e la caviglia che sanguina.
          effetti: { ferite: 0.5 }
      - testo: "Stare fermo finché la forma va lontano"
        descrizione: "Immobile nell'acqua, come i Puliti in piazza. Ci vuole il tempo che ci vuole."
        costo: 2
        esito:
          titolo: "Ferm{o|a}"
          testo: |
            Resti immobile con l'acqua al petto per un tempo lunghissimo, mentre i pesci ti mordicchiano le
            dita. Dopo un po' l'acqua non ti sembra più tiepida, perché ha la stessa temperatura della tua
            pelle. A un certo punto ti accorgi che stare ferm{o|a} ti piace, e quella è la cosa che ti fa
            muovere.
          effetti: { profondita.avv-puliti: 1, tormento: 0.5 }

  - id: avv-puliti-le-cose-lasciate
    immagine: icone/basket
    titolo: Le cose lasciate
    sommario: "Su una cengia sopra l'acqua i Puliti hanno lasciato le loro cose, piegate con cura una accanto all'altra."
    luogo: Le acque sotto la vecchia Pannion, la cengia
    area: avv-puliti
    ripetibile: true
    requisiti: [avventura.puliti == 6, profondita.avv-puliti <= 2]
    testo: |
      Dove la cisterna si stringe in una galleria c'è una cengia di pietra a un palmo dal pelo dell'acqua, e
      lì i Puliti hanno lasciato le loro cose piegate e messe in fila contro la parete. Ci sono zoccoli e
      cinture, una bambola di stracci e una pipa ancora carica. Le cinture sono arrotolate tutte nello stesso
      verso con la fibbia in fuori, e gli zoccoli stanno appaiati con le punte verso l'acqua. Sulla cengia la
      bava non c'è, e il tabacco nella pipa è ancora secco. In cima al mucchio c'è un cappello di feltro
      bruciacchiato, e dentro il cappello il pezzo di carbone con cui Darrin segna i turni sull'asse della
      segheria.

      {resilienza Media} Ti viene voglia di posarci anche la cintura, e la voglia arriva da sola. Hai già le
      dita sulla fibbia quando te ne accorgi.

      {mezzanotte} In fondo alla fila c'è un paio di stivali uguali ai tuoi, con la stringa sinistra rifatta
      con lo spago. Sono asciutti, e la suola è consumata più della tua, come dopo una strada più lunga.
    opzioni:
      - testo: "Passare oltre senza toccare niente"
        descrizione: "La galleria è dall'altra parte del mucchio. Si passa sul bordo della cengia."
        inquieta: "La galleria è dall'altra parte del mucchio. Si passa sul bordo della cengia, dove il mucchio ha già fatto posto per le tue cose."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Media }
        successo:
          titolo: Le mani in tasca
          testo: |
            Passi sul bordo della cengia con le mani in tasca e gli occhi sulla galleria. Quando sei
            dall'altra parte ti accorgi di avere ancora tutto addosso, e ti viene da ridere. L'eco della
            risata ti torna dalla galleria più bassa della tua voce.
          pe: { resilienza: 2 }
          effetti: { profondita.avv-puliti: 1 }
        fallimento:
          titolo: La cintura
          testo: |
            Ti ritrovi in ginocchio davanti al mucchio con la cintura piegata in quattro fra le mani, e non
            sai da quanto. L'hai piegata come le altre, con la fibbia in fuori. Te la rimetti con le dita che
            tremano e torni indietro.
          effetti: { tormento: 0.5 }
      - testo: "Riprendere il carbone di Darrin"
        descrizione: "È una cosa piccola. Toccarla vuol dire mettere le mani nel mucchio."
        prova: { attributo: mentale, abilita: [resilienza, empatia], difficolta: Difficile }
        successo:
          titolo: Il carbone in tasca
          testo: |
            Infili la mano nel cappello e prendi il carbone senza guardare il resto, e il mucchio ti lascia
            andare. Il feltro dentro è freddo e bagnato, anche se la cengia è asciutta. Metti il carbone in
            tasca. Pesa quanto un sasso, e tutto il tempo che cammini nella galleria ti sembra caldo.
          pe: { empatia: 2 }
          imposta: { avv-puliti.carbone: 1 }
          effetti: { profondita.avv-puliti: 1 }
        fallimento:
          titolo: Il cappello
          testo: |
            Prendi il carbone, e quando ritiri la mano ti accorgi di averci lasciato dentro in cambio un
            anello che avevi al dito. Non hai sentito il metallo scivolare oltre la nocca. Riprendi l'anello,
            e il carbone resta nel cappello.
          effetti: { tormento: 0.5 }
      - testo: "Cercare il passaggio dietro il mucchio"
        descrizione: "Un mucchio così ordinato sta contro una parete per una ragione."
        prova: { attributo: mentale, abilita: [percezione, tecnologia], difficolta: Difficile }
        successo:
          titolo: La fessura
          testo: |
            Dietro il mucchio la parete ha una fessura larga una spalla, da cui esce aria più fredda. La
            corrente è abbastanza forte da piegare la fiamma della lanterna verso il mucchio. Ci passi di
            fianco senza spostare niente, e dall'altra parte la galleria scende.
          pe: { percezione: 2 }
          effetti: { profondita.avv-puliti: 1 }
        fallimento:
          titolo: La bambola
          testo: |
            Sposti la bambola per guardare dietro, e il resto del mucchio scivola nell'acqua senza rumore,
            pezzo dopo pezzo. Resti a guardare gli zoccoli che affondano dritti con le punte in avanti, anche
            se sono di legno.
          effetti: { tormento: 0.5 }
      - testo: "Lasciare anche tu una cosa, come loro"
        descrizione: "Una cosa piccola, e il mucchio ti lascia passare. Dopo però ci pensi."
        inquieta: "Una cosa piccola, e il mucchio ti lascia passare. Quale, l'hai già deciso entrando nella cisterna, senza dirlo nemmeno a te."
        costo: 2
        esito:
          titolo: Il bottone
          testo: |
            Ti strappi un bottone dalla giubba e lo posi in fila accanto alla bambola, con cura. La galleria
            si fa facile. Per tutto il resto della discesa ti tocchi il punto dove c'era il bottone, e i fili
            rotti ti pungono il pollice.
          effetti: { profondita.avv-puliti: 1, tormento: 0.5 }

  - id: avv-puliti-il-sifone
    immagine: icone/drowning
    titolo: Il sifone
    sommario: "La galleria scende sotto il pelo dell'acqua e si riempie fino al soffitto. Una corda marcia entra nel buio."
    luogo: Le acque sotto la vecchia Pannion, il sifone
    area: avv-puliti
    ripetibile: true
    requisiti: [avventura.puliti == 6, profondita.avv-puliti <= 2]
    testo: |
      La galleria in fondo alla cisterna scende con una pendenza regolare e si riempie d'acqua fino al
      soffitto. Oltre il tratto allagato dev'esserci aria, perché a ogni onda l'acqua fa un risucchio lento e
      poi rende una bolla grande come un pugno. Una corda di canapa gonfia d'acqua, legata a un anello di
      ferro, entra nel buio. L'anello è mangiato dalla ruggine fino a metà spessore, e la pietra in cui è
      murato non ha un graffio.

      {atletica Difficile} Ci vogliono venti bracciate, forse trenta, da fare al buio e con i vestiti addosso.
      Con gli stivali pieni d'acqua ogni bracciata ti porta avanti la metà.
    opzioni:
      - testo: "Passare sott'acqua tirandoti con la corda"
        descrizione: "La corda arriva dall'altra parte. Se tiene, ci si tira come su una scala."
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Difficile }
        successo:
          titolo: L'altra parte
          testo: |
            Ti tiri lungo la corda una mano dopo l'altra con gli occhi chiusi e il petto che brucia, e la
            canapa sotto le dita si sfilaccia in ciuffi molli. Riemergi in una galleria asciutta per metà. La
            lanterna l'hai portata spenta in alto, e la riaccendi al terzo colpo.
          pe: { atletica: 2 }
          effetti: { profondita.avv-puliti: 1 }
        fallimento:
          titolo: La corda marcia
          testo: |
            A metà la corda ti resta in mano, e torni indietro a tentoni lungo il soffitto. La pietra sopra di
            te è liscia per tutto il tratto e non offre un appiglio alle dita. Riemergi dalla parte da cui eri
            partit{o|a}, e per un pezzo l'aria non ti basta mai.
          effetti: { ferite: 0.5 }
      - testo: "Capire quanto è lungo il tratto"
        descrizione: "L'acqua tira e lascia. Contando il risucchio si capisce quanta galleria c'è sott'acqua."
        prova: { attributo: mentale, abilita: [tecnologia, natura], difficolta: Media }
        successo:
          titolo: Il conto del risucchio
          testo: |
            Conti i risucchi sedut{o|a} sul bordo. Fra uno e l'altro passano sempre dodici battiti del tuo
            cuore. Quando hai capito il ritmo ti butti con l'acqua che tira dall'altra parte, e ti porta lei
            per metà del tratto. Riemergi senza fretta con la lanterna intera.
          pe: { tecnologia: 2 }
          effetti: { profondita.avv-puliti: 1 }
        fallimento:
          titolo: Il risucchio contrario
          testo: |
            Ti butti quando l'acqua torna indietro, e l'acqua ti risputa contro il bordo con la lanterna. Il
            bordo ha lo spigolo vivo, come se l'acqua non ci fosse mai passata sopra. Ti rialzi con un taglio
            sulla fronte e la lanterna da riaccendere.
          effetti: { ferite: 0.5 }
      - testo: "Aspettare l'onda che tira dall'altra parte"
        descrizione: "Prima o poi arriva un'onda più lunga delle altre. Bisogna aspettarla nell'acqua."
        costo: 2
        esito:
          titolo: L'onda lunga
          testo: |
            Aspetti con l'acqua alle spalle per ore, e in tutte quelle ore i pesci ciechi non ti vengono
            vicino. Poi arriva un'onda più lunga delle altre e ti porta dall'altra parte come un ramo. Esci
            coperto di bava, e la pelle delle braccia ti pizzica fino ai gomiti.
          effetti: { profondita.avv-puliti: 1, contaminazione: 0.5 }

  # ------------------------------------------------------------ 3, 4 e 6 · le rovine dell'antico dominio
  - id: avv-puliti-la-via-dei-gradini-bassi
    immagine: icone/ancient-columns
    titolo: La via dei gradini bassi
    sommario: "Oltre la cisterna comincia una strada scavata per gente che non camminava. I gradini sono larghi come letti."
    luogo: Le acque sotto la vecchia Pannion, la via dei gradini bassi
    area: avv-puliti
    ripetibile: true
    requisiti: [avventura.puliti == 6, profondita.avv-puliti >= 3, profondita.avv-puliti <= 6, profondita.avv-puliti != 5]
    testo: |
      Oltre la cisterna la galleria diventa una strada. Scende in gradini troppo bassi per un passo e troppo
      larghi per due, fra pilastri scolpiti ad alghe che si intrecciano in cima. I pilastri sono di una pietra
      verde e dura che sotto Pannion non c'è, e le alghe scolpite hanno ancora gli spigoli netti. L'acqua
      scorre lenta giù per la pietra liscia in un velo sottile che non fa rumore, e da molto in basso arriva
      lo sciacquio di un'acqua più grande.

      {accademiche Difficile} Chi ha scavato questi gradini ci scendeva strisciando, o nuotando in un'acqua
      che allora arrivava fin qui. Sulla pietra non c'è un segno di scalpello, e la superficie ha la
      levigatura uniforme che la sabbia lascia sul letto di un fiume.
    opzioni:
      - testo: "Scendere sulle mani e sui piedi"
        descrizione: "I gradini sono scivolosi e storti. A quattro zampe si scende come scendevano loro."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Difficile }
        successo:
          titolo: A quattro zampe
          testo: |
            Scendi a quattro zampe con l'acqua che ti scorre fra le dita, e i gradini sotto le mani e le
            ginocchia hanno improvvisamente senso. Ogni gradino è lungo quanto il tuo corpo disteso, e dopo
            una ventina ti muovi senza pensarci. In fondo alla strada i pilastri si allargano su una sala.
          pe: { atletica: 2 }
          effetti: { profondita.avv-puliti: 1 }
        fallimento:
          titolo: Lo scivolo
          testo: |
            Al quinto gradino il ginocchio scivola e scendi i dieci successivi sulla schiena, sbattendo contro
            i bordi. Ti fermi contro un pilastro e torni su a fatica. Sui bordi dei gradini restano strisce
            chiare dove la giubba ha raschiato via la bava.
          effetti: { ferite: 0.5 }
      - testo: "Seguire la corsia delle processioni"
        descrizione: "Su una strada così ci si muoveva in processione. Il passaggio di molti consuma la pietra in un punto solo."
        prova: { attributo: mentale, abilita: [accademiche, percezione], difficolta: Difficile }
        successo:
          titolo: La corsia
          testo: |
            Al centro dei gradini la pietra è appena più scura e più bassa, larga quanto due corpi affiancati.
            Ci cammini sopra, e i gradini sotto i piedi diventano una rampa leggera. La corsia è scesa di un
            dito buono in una pietra così dura, e provi a contare quanti passaggi ci vogliono finché smetti.
          pe: { accademiche: 2 }
          effetti: { profondita.avv-puliti: 1 }
        fallimento:
          titolo: La corsia sbagliata
          testo: |
            Segui una striscia scura che finisce contro un pilastro, e dietro il pilastro non c'è niente. Alla
            base il pilastro è consumato come la striscia fino all'altezza del ginocchio. Quando ti volti, la
            strada ti sembra più lunga di prima.
          effetti: { tormento: 0.5 }
      - testo: "Scendere seduto, un gradino alla volta"
        descrizione: "Lento, e scomodo. Si arriva in fondo."
        costo: 2
        esito:
          titolo: "Sedut{o|a}"
          testo: |
            Scendi sedut{o|a}, un gradino alla volta, con l'acqua che ti passa sotto e i calzoni che si
            consumano sulla pietra. Ogni gradino è così largo che devi spingerti avanti con le mani prima di
            calare al successivo. In fondo hai le gambe intorpidite e un livido per ogni gradino.
          effetti: { profondita.avv-puliti: 1, ferite: 0.5 }

  - id: avv-puliti-le-nicchie-dei-servi
    immagine: icone/fish-monster
    titolo: Le nicchie dei servi
    sommario: "Nelle nicchie ai lati della strada stanno in piedi servi antichi dalla pelle pallida. Uno ha gli occhi aperti."
    luogo: Le acque sotto la vecchia Pannion, le nicchie
    area: avv-puliti
    ripetibile: true
    requisiti: [avventura.puliti == 6, profondita.avv-puliti >= 3, profondita.avv-puliti <= 6, profondita.avv-puliti != 5]
    testo: |
      Nelle nicchie ai lati della strada stanno in piedi figure pallide con la pelle lucida come quella di
      Ansgar. Hanno le dita palmate e le braccia lungo i fianchi. Davanti alla prima nicchia ti dici che sono
      statue, perché la bava delle pareti le copre dai piedi alle spalle in uno strato liscio e intero. Poi
      vedi che sul collo hanno fessure che si aprono e si chiudono piano, e che lì la bava non c'è. Sono lì da
      sempre, e sono vivi.

      Quello della quarta nicchia a sinistra ha gli occhi aperti e li gira verso la tua lanterna. Sulle sue
      palpebre la bava si è rotta in due archi sottili, con i bordi ancora freschi.

      {furtivita Difficile} Si muovono soltanto quando la luce li tocca, e con la lanterna coperta si passa
      fra le nicchie al buio.
    opzioni:
      - testo: "Passare al buio con la lanterna coperta"
        descrizione: "Sono trenta passi di strada fra le nicchie, senza vedere dove metti i piedi."
        prova: { attributo: fisico, abilita: furtivita, difficolta: Difficile }
        successo:
          titolo: Trenta passi
          testo: |
            Copri la lanterna con la giubba e conti trenta passi nel buio, con le fessure dei colli che
            respirano intorno a te. Verso il ventesimo passo il risucchio alla tua destra si ferma, e riprende
            soltanto quando l'hai superato. Al trentunesimo scopri la lanterna, e le nicchie sono alle tue
            spalle.
          pe: { furtivita: 2 }
          effetti: { profondita.avv-puliti: 1 }
        fallimento:
          titolo: La giubba che scivola
          testo: |
            A metà strada la giubba scivola dalla lanterna, e la luce prende in pieno una nicchia. Il servo
            dentro fa un passo avanti, e la bava che lo copriva gli si stacca dal petto in un foglio solo. Tu
            corri indietro fino al primo pilastro e ci sbatti contro con la spalla.
          effetti: { ferite: 0.5 }
      - testo: "Affrontare il servo che si è svegliato"
        descrizione: "Uno solo ha gli occhi aperti. Meglio lui adesso che tutti dopo."
        combattimento: avv-puliti-il-servo
        vittoria:
          titolo: Il servo a terra
          testo: |
            Il servo cade sul fianco e le fessure del collo si fermano aperte. Dalle ferite esce un liquido
            chiaro e denso che galleggia sull'acqua senza mescolarsi. Nelle altre nicchie nessuno ha mosso un
            dito. Passi in mezzo a loro con la lanterna bassa.
          effetti: { profondita.avv-puliti: 1 }
        sconfitta:
          titolo: Le dita palmate
          testo: |
            Il servo ti prende per la gola con le dita palmate e ti spinge indietro lungo la strada, gradino
            dopo gradino, poi torna nella sua nicchia e chiude gli occhi. Quando si rimette al suo posto la
            bava gli si richiude sul petto.
          effetti: { tormento: 0.5 }
      - testo: "Strisciare sotto le nicchie, nell'acqua"
        descrizione: "Sotto il bordo delle nicchie corre un canale d'acqua bassa e piena di bava, dove la luce delle lanterne non arriva."
        costo: 2
        esito:
          titolo: Il canale
          testo: |
            Strisci nel canale sulla pancia, con la lanterna spenta e la faccia a un dito dall'acqua. Sopra la
            testa senti le fessure aprirsi e chiudersi, una nicchia dopo l'altra e tutte con lo stesso ritmo.
            La bava ti entra nel colletto e nelle maniche, e dall'altra parte te la togli a manciate.
          effetti: { profondita.avv-puliti: 1, contaminazione: 0.5 }

  - id: avv-puliti-l-acqua-in-piedi
    immagine: icone/transparent-slime
    titolo: L'acqua in piedi
    sommario: "Un arco della strada è chiuso da una parete d'acqua che sta in piedi da sola."
    luogo: Le acque sotto la vecchia Pannion, l'arco dell'acqua
    area: avv-puliti
    ripetibile: true
    requisiti: [avventura.puliti == 6, profondita.avv-puliti >= 3, profondita.avv-puliti <= 6, profondita.avv-puliti != 5]
    testo: |
      La strada passa sotto un arco chiuso da una parete d'acqua che sta in piedi da sola, dal pavimento alla
      volta. La superficie è liscia e dritta a piombo, e dove tocca la pietra dell'arco non cola una goccia.
      Dall'altra parte si vedono altri gradini che scendono, deformati. Dentro la parete un filo di bava sale
      piano dal pavimento verso la volta. Quando ci avvicini la mano la parete si incurva verso le dita.

      {magia Difficile} Nell'acqua il Mana non si sente. La tiene su una volontà stretta come un pugno, che
      viene dal basso e non allenta mai la presa.
    opzioni:
      - testo: "Attraversarla a occhi chiusi"
        descrizione: "Sono tre passi d'acqua. Bisogna farli tutti e tre senza respirare."
        prova: { attributo: fisico, abilita: resistenza, difficolta: Difficile }
        successo:
          titolo: Tre passi
          testo: |
            Chiudi gli occhi ed entri nell'acqua, e l'acqua ti stringe da tutte le parti come una mano. Fai il
            primo passo, poi gli altri due. Dentro la parete l'acqua è più calda del tuo corpo, e il cuore ti
            batte contro le orecchie. Quando esci dall'altra parte l'acqua ti scivola via di dosso tutta
            insieme.
          pe: { resistenza: 2 }
          effetti: { profondita.avv-puliti: 1 }
        fallimento:
          titolo: La mano d'acqua
          testo: |
            Al secondo passo l'acqua ti tiene ferm{o|a}. Quando ti lascia esci in ginocchio dalla parte da cui
            eri entrat{o|a}, e tossisci bava. Ce l'hai nella gola per un'ora, e ha il sapore del sale.
          effetti: { contaminazione: 0.5 }
      - testo: "Spalmarti la linfa di Koln e passare"
        descrizione: "La linfa del Vecchio tiene chiusa la pelle contro l'acqua di quaggiù. Koln te ne ha dato un vasetto."
        requisiti: [avv-puliti.pelle >= 1]
        esito:
          titolo: La pelle chiusa
          testo: |
            Ti spalmi la linfa rossa sulla faccia e sulle mani, e quando entri nella parete l'acqua ti scivola
            addosso senza attaccarsi. Sulla pelle unta si raccoglie in gocce tonde che rotolano giù dai polsi.
            Esci dall'altra parte asciutt{o|a} come se fossi passat{o|a} sotto una tettoia, e l'unguento ti
            puzza di montone fino all'ultima galleria.
          effetti: { profondita.avv-puliti: 1 }
      - testo: "Spingerla con la volontà"
        descrizione: "Se la tiene su una volontà, la si può spingere da parte con un'altra, per il tempo di passare."
        prova: { attributo: mentale, abilita: [magia, resilienza], difficolta: Difficile }
        successo:
          titolo: Il varco
          testo: |
            Appoggi le mani sulla parete e la spingi con la testa più che con le braccia. L'acqua si apre in
            un varco stretto quanto te, e si richiude alle tue spalle appena sei passat{o|a}. Per tutto il
            passaggio senti dietro gli occhi una spinta uguale alla tua.
          pe: { resilienza: 2 }
          effetti: { profondita.avv-puliti: 1 }
        fallimento:
          titolo: L'altra volontà
          testo: |
            Spingi, e dall'altra parte della parete qualcosa spinge indietro con calma, finché ti siedi per
            terra con il mal di testa. Ti sanguina il naso, e le gocce che cadono contro la parete salgono
            dentro l'acqua verso la volta. La parete non si è mossa di un dito.
          effetti: { tormento: 0.5 }
      - testo: "Passare piano, lasciandola entrare nei vestiti"
        descrizione: "Lentamente l'acqua si lascia attraversare. Lentamente, però, entra dappertutto."
        costo: 2
        esito:
          titolo: "Fradici{o|a}"
          testo: |
            Attraversi la parete un dito alla volta, e l'acqua ti entra nei vestiti e nelle orecchie fin sotto
            le unghie. Dall'altra parte ti strizzi la giubba e non viene fuori niente, perché la bava è
            rimasta tutta su di te. La stoffa è asciutta e pesa il doppio.
          effetti: { profondita.avv-puliti: 1, contaminazione: 0.5 }

  - id: avv-puliti-la-vasca-dei-tributi
    immagine: icone/spiral-shell
    titolo: La vasca dei tributi
    sommario: "Una vasca larga come una piazza, piena di doni posati in cerchi da gente di cui non resta il nome."
    luogo: Le acque sotto la vecchia Pannion, la vasca dei tributi
    area: avv-puliti
    ripetibile: true
    requisiti: [avventura.puliti == 6, profondita.avv-puliti >= 3, profondita.avv-puliti <= 6, profondita.avv-puliti != 5]
    testo: |
      La strada finisce sul bordo di una grande vasca d'acqua bassa e limpida, così ferma che la luce della
      lanterna arriva fino al fondo senza tremare. Chi scendeva qui prima ha posato i suoi doni sul fondo, in
      cerchi intorno al centro. Ci sono conchiglie grandi come scudi, ossa di animali sconosciuti, anelli di
      metallo verde e collane di denti. Le conchiglie hanno ancora la madreperla intatta, e le ossa più vicine
      al centro sono diventate pietra. Per arrivare dall'altra parte bisogna camminarci sopra.

      {percezione Difficile} I cerchi più vecchi stanno in mezzo e i più nuovi verso il bordo. Fra un cerchio
      e l'altro resta sempre una striscia libera larga un piede, e la pietra lì sotto non ha un filo di bava.
    opzioni:
      - testo: "Camminare sulle strisce libere"
        descrizione: "Un piede di pietra fra un cerchio e l'altro, sott'acqua. Basta non sbagliare un passo."
        prova: { attributo: fisico, abilita: acrobazia, difficolta: Difficile }
        successo:
          titolo: Le strisce
          testo: |
            Attraversi la vasca a passi stretti, un piede dietro l'altro sulle strisce di pietra, senza
            toccare un dono. L'acqua ti arriva alle caviglie e sotto le suole la pietra è liscia come un
            pavimento di casa. Dall'altra parte l'acqua è più fredda, e il pavimento scende di nuovo.
          pe: { acrobazia: 2 }
          effetti: { profondita.avv-puliti: 1 }
        fallimento:
          titolo: L'osso rotto
          testo: |
            Il piede scivola su un osso, che si rompe con un rumore secco. Il rumore ti torna dalla volta
            molte volte e sempre più basso. Tutta l'acqua della vasca diventa fredda in un momento, e tu torni
            indietro con i piedi che non senti più.
          effetti: { tormento: 0.5 }
      - testo: "Leggere l'ordine dei doni"
        descrizione: "Chi porta un dono lo mette in un posto preciso. I posti, insieme, fanno una strada."
        prova: { attributo: mentale, abilita: [percezione, accademiche], difficolta: Difficile }
        successo:
          titolo: La strada dei doni
          testo: |
            I cerchi hanno un'apertura ciascuno, sempre nello stesso punto, come le porte di una città. Passi
            da una porta all'altra fino al centro, e dal centro all'uscita. In mezzo alla vasca raccogli un
            anello verde che l'acqua ha staccato dal suo cerchio. È pesante e freddo, e resta freddo anche
            dopo che l'hai tenuto a lungo nel pugno.
          pe: { percezione: 2 }
          effetti: { profondita.avv-puliti: 1, reliquie.frammento-inciso: 1 }
        fallimento:
          titolo: La porta chiusa
          testo: |
            Segui un'apertura che non porta da nessuna parte, e ti trovi in mezzo ai doni senza una strada per
            uscire. Torni indietro sui tuoi passi uno per uno, con le ossa che scricchiolano sotto le suole e
            l'acqua che si intorbida di quello che hai rotto.
          effetti: { tormento: 0.5 }
      - testo: "Attraversare nell'acqua, scostando i doni con i piedi"
        descrizione: "È la strada più corta, ed è anche la più scortese."
        costo: 2
        esito:
          titolo: Scortese
          testo: |
            Attraversi la vasca dritto, spostando con i piedi conchiglie e collane, e tutto quello che sposti
            torna al suo posto appena sei passat{o|a}. Quando ti volti lo vedi tornare una collana alla volta
            sul fondo immobile. Ti senti guardat{o|a} fino all'uscita, e anche dopo.
          effetti: { profondita.avv-puliti: 1, tormento: 0.5 }

  # ------------------------------------------------------------ 5 · la svolta: i murali del sovrano
  - id: avv-puliti-i-murali-del-sovrano
    immagine: ambientazione/regno-profondo
    titolo: I murali del sovrano
    sommario: "Una sala rotonda dipinta dal pavimento alla volta. Racconta di un impero sotto il mare, e del suo sovrano."
    luogo: Le acque sotto la vecchia Pannion, la sala dei murali
    area: avv-puliti
    requisiti: [avventura.puliti == 6, profondita.avv-puliti == 5]
    testo: |
      Oltre la strada si apre una sala rotonda con la volta alta, dipinta in verde scuro e bianco di
      madreperla. Il colore non si è sfaldato da nessuna parte, e dove la lanterna passa vicino la madreperla
      rimanda la luce in piccole scaglie. Le figure girano tutt'intorno, e la lanterna le prende una dopo
      l'altra.

      C'è un mare senza fondo con foreste di alghe e una luce stanca che scende dall'alto. Su un trono di
      conchiglie siede una creatura pallida con tre occhi in fila sulla fronte e un ventaglio di tentacoli
      intorno alla bocca. Davanti al trono migliaia di figure stanno in ginocchio, dipinte una per una con lo
      stesso tratto sottile. Sotto il trono torna la fila di gocce che Lumelli leggeva sul bordo della
      cisterna.

      Più avanti una balena trasparente grande come una cattedrale passa sopra il trono, e quelli in ginocchio
      alzano la testa a guardarla. Nell'ultimo pezzo di parete il trono è vuoto e la creatura sale da sola
      verso un buco nero in cima al mare. Il buco nero è dipinto proprio sopra l'arco da cui sei entrat{o|a}.

      {accademiche Media} Chi ha letto in Biblioteca le bottiglie spiaggiate conosce le balene-spirito del
      Regno Profondo. Di un sovrano venuto prima di loro non parla nessun libro.

      {origine allievo-di-torvessa} All'Accademia si discute da anni se il Regno Profondo abbia una storia.
      Orvald Temmerin darebbe la sua biblioteca per vedere questa parete.
    opzioni:
      - testo: "Leggere i murali dall'inizio alla fine"
        descrizione: "Una parete dipinta si legge come un libro, da dove comincia a dove finisce."
        prova: { attributo: mentale, abilita: [accademiche, percezione], difficolta: Media }
        successo:
          titolo: Il trono vuoto
          testo: |
            Fai il giro della sala due volte, con la lanterna vicino alla pietra. Era un sovrano, e i suoi
            stavano fermi davanti a lui per tutta la vita, finché una balena è passata sopra il trono e hanno
            guardato lei. Allora è salito quassù, da solo, ad aspettare qualcuno che leggesse di nuovo il suo
            nome. Nell'ultima figura i tentacoli intorno alla bocca sono dipinti aperti e tesi verso l'alto.
            Dietro l'ultimo pezzo di parete una porta bassa scende ancora.
          pe: { accademiche: 3 }
          imposta: { avv-puliti.murali: 1 }
          effetti: { profondita.avv-puliti: 1 }
        fallimento:
          titolo: Le figure che girano
          testo: |
            Giri intorno alla sala seguendo le figure, e dopo il terzo giro non sai più dove cominciano. La
            parete rotonda non ha uno spigolo o una giuntura da cui ripartire. Ti fermi in mezzo alla sala con
            migliaia di occhi dipinti addosso, finché ritrovi la porta da cui sei entrat{o|a}.
          effetti: { tormento: 0.5 }
      - testo: "Guardare le facce di quelli in ginocchio"
        descrizione: "Sono migliaia, dipinte una per una. Qualcuno, dipingendole, ha voluto dire com'erano."
        prova: { attributo: sociale, abilita: [empatia, espressivita], difficolta: Difficile }
        successo:
          titolo: Le facce
          testo: |
            Davanti al trono le facce sono lisce e uguali, e non hanno un'espressione. Quando alzano la testa
            verso la balena hanno gli occhi spalancati, e qualcuno ride. Lì il pennello cambia da una faccia
            all'altra, e ogni bocca è aperta in un modo diverso. Il sovrano li ha persi così, perché hanno
            trovato un'altra cosa da guardare. Oltre l'ultimo pezzo di parete una porta bassa scende ancora.
          pe: { empatia: 3 }
          imposta: { avv-puliti.murali: 1 }
          effetti: { profondita.avv-puliti: 1 }
        fallimento:
          titolo: Le facce uguali
          testo: |
            Le facce dipinte sono tutte uguali, e a forza di guardarle ti sembrano tutte la tua. Esci dalla sala
            camminando all'indietro.
          effetti: { tormento: 0.5 }
      - testo: "Passare oltre senza guardare le pareti"
        descrizione: "La porta bassa è dall'altra parte della sala. Ci si arriva con gli occhi sul pavimento."
        costo: 2
        esito:
          titolo: Gli occhi bassi
          testo: |
            Attraversi la sala con gli occhi sul pavimento e la lanterna bassa, e lo stesso, ai margini dello
            sguardo, le figure ti girano intorno. Sotto la volta rotonda ogni tuo passo ti torna indietro un
            poco dopo. Arrivi alla porta bassa con il collo indolenzito.
          effetti: { profondita.avv-puliti: 1, tormento: 0.5 }

  # ------------------------------------------------------------ 7-9 · la soglia del Regno Profondo
  - id: avv-puliti-la-luce-che-sale
    immagine: ambientazione/regno-profondo
    titolo: La luce che sale
    sommario: "L'acqua cade in un pozzo senza fondo, e dal pozzo sale una colonna di luce pallida."
    luogo: Le acque sotto la vecchia Pannion, il pozzo della luce
    area: avv-puliti
    ripetibile: true
    requisiti: [avventura.puliti == 6, profondita.avv-puliti >= 7, profondita.avv-puliti <= 9]
    testo: |
      La strada si ferma sul bordo di un pozzo enorme, dove l'acqua dei gradini cade senza rumore. Ascolti a
      lungo, e dal fondo non arriva il colpo dell'acqua che tocca qualcosa. Dal fondo invisibile sale una
      colonna di luce pallida che fa verde la pietra delle pareti, e sul viso è tiepida. Una cengia gira
      intorno al pozzo fino a un'apertura dall'altra parte.

      Se guardi troppo a lungo la luce, una voce dentro le orecchie ti dice che puoi smettere di camminare.
      Parla piano e senza fretta, e quando distogli gli occhi si interrompe a metà di una parola.

      {resilienza Difficile} Laggiù c'è il Regno Profondo da cui nessuno è mai tornato, e la voce lo sa.
    opzioni:
      - testo: "Girare sulla cengia senza guardare giù"
        descrizione: "La cengia è larga mezzo passo, e la luce sale proprio accanto."
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Difficile }
        successo:
          titolo: Mezzo passo
          testo: |
            Giri intorno al pozzo con la guancia contro la parete e gli occhi sulla pietra, un mezzo passo
            alla volta. La parete contro la faccia è fredda e bagnata, e la luce invece ti scalda il fianco
            per tutto il giro. Tu non la guardi nemmeno una volta.
          pe: { acrobazia: 2 }
          effetti: { profondita.avv-puliti: 1 }
        fallimento:
          titolo: Lo sguardo
          testo: |
            A metà cengia guardi giù. La luce ti riempie gli occhi, e ti ritrovi sedut{o|a} sul bordo con le
            gambe nel vuoto, senza ricordare di esserti sedut{o|a}. Accanto a te c'è la lanterna posata in
            ordine sulla pietra, con la fiamma abbassata. Torni indietro a carponi fino all'imbocco della
            strada.
          effetti: { tormento: 0.5 }
      - testo: "Guardare la luce e continuare a camminare"
        descrizione: "La voce dice che puoi fermarti. Si può ascoltarla fino in fondo, e camminare lo stesso."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Molto difficile }
        successo:
          titolo: Fino in fondo
          testo: |
            Guardi la luce e lasci parlare la voce, e intanto metti un piede davanti all'altro. Conti i passi
            ad alta voce per tenere il ritmo, finché ti accorgi che la voce conta insieme a te. Nella colonna,
            molto in basso, passa una sagoma trasparente grande come una cattedrale. Quando arrivi
            all'apertura la voce ha smesso, e tu hai visto quello che i murali dipingevano.
          pe: { resilienza: 3 }
          effetti: { profondita.avv-puliti: 1, informazioni.segreto: 1 }
        fallimento:
          titolo: "Ferm{o|a} sulla cengia"
          testo: |
            La voce ha ragione, e ti fermi. Torni in te molto tempo dopo, in piedi sulla cengia, con le gambe
            addormentate e la lanterna quasi vuota. Intorno agli stivali la bava è salita fino alla caviglia.
          effetti: { tormento: 0.5 }
      - testo: "Strisciare sulla cengia a occhi chiusi"
        descrizione: "Al buio la voce è più debole. Anche la cengia, però, è più stretta."
        costo: 3
        esito:
          titolo: A occhi chiusi
          testo: |
            Fai il giro del pozzo strisciando a occhi chiusi, con le mani avanti a cercare il bordo.
            Attraverso le palpebre la luce resta verde, e dal calore sulla guancia capisci da che parte è il
            vuoto. Ci metti un tempo lunghissimo, e la voce ti accompagna fino all'apertura.
          effetti: { profondita.avv-puliti: 1, tormento: 0.5 }

  - id: avv-puliti-la-voce-di-darrin
    immagine: icone/echo-ripples
    titolo: La voce di Darrin
    sommario: "In una galleria buia la voce di Darrin Huld ti chiama per nome e ti chiede di restare."
    luogo: Le acque sotto la vecchia Pannion, la galleria buia
    area: avv-puliti
    ripetibile: true
    requisiti: [avventura.puliti == 6, profondita.avv-puliti >= 7, profondita.avv-puliti <= 9]
    testo: |
      Nella galleria il buio è così fitto che la lanterna illumina soltanto le tue mani. A pochi passi davanti
      a te Darrin Huld ti chiama con la sua voce bassa e corta, e la erre si impunta.

      «Resti» dice piano. «Resti, Radice.»

      La voce viene da dove stai andando e lo ripete a ogni passo, calma come la sera in cui ti ha dato il
      posto sulla panca. La distanza non cambia nemmeno quando ti fermi. Sul pavimento davanti a te la bava è
      liscia e non ha un'impronta. Le gambe ti diventano pesanti.

      {empatia Difficile} Darrin le cose le dice una volta sola.
    opzioni:
      - testo: "Rispondere come rispondono i Puliti"
        descrizione: "Sai la risposta del coro. Chi la dice, quaggiù, è uno di casa."
        requisiti: [avv-puliti.coro >= 1]
        prova: { attributo: sociale, abilita: [ingannare, espressivita], difficolta: Media }
        successo:
          titolo: "Un{o|a} di casa"
          testo: |
            «E ferma a chi resta» rispondi, con la voce piatta della mensa. La voce di Darrin tace contenta e
            ti lascia passare come si lascia passare uno dei propri. Nel punto da cui parlava l'aria è tiepida
            e sa di segatura.
          pe: { ingannare: 2 }
          effetti: { profondita.avv-puliti: 1 }
        fallimento:
          titolo: La voce che aspetta
          testo: |
            La risposta ti esce con la tua voce, e la voce di Darrin la sente. Ripete «Resti» ogni volta più
            vicina, e l'ultima volta la senti all'altezza della tua spalla. Torni indietro fino all'imbocco
            della galleria.
          effetti: { tormento: 0.5 }
      - testo: "Stringere la scheggia del Vecchio"
        descrizione: "La scheggia che Darrin ti ha messo al collo con le sue mani. Quella era la sua voce vera."
        requisiti: [chiave.vecchio >= 1]
        prova: { attributo: mentale, abilita: resilienza, difficolta: Media }
        successo:
          titolo: La mano vera
          testo: |
            Stringi la scheggia nel pugno, e ricordi la mano di Darrin che stringeva il laccio un poco più del
            necessario. La scheggia ti punge il palmo dove la stringi. Questa voce non ha mani. Le passi
            accanto, e lei resta indietro.
          pe: { resilienza: 2 }
          effetti: { profondita.avv-puliti: 1 }
        fallimento:
          titolo: Il laccio
          testo: |
            Stringi la scheggia, e la voce dice «Guardia del Vecchio» proprio come lui, con la erre che si
            impunta nello stesso punto. Ti siedi nel buio con la scheggia in mano finché la lanterna comincia
            a calare.
          effetti: { tormento: 0.5 }
      - testo: "Camminare contro la voce"
        descrizione: "È soltanto una voce. Le gambe però le danno ragione."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Difficile }
        successo:
          titolo: Contro
          testo: |
            Cammini con la voce in faccia come contro il vento, passo dopo passo, finché la superi. Nel punto
            in cui la superi non c'è niente, e la fiamma della lanterna resta dritta. Dietro di te continua a
            dire il tuo nome, sempre più piano.
          pe: { resilienza: 2 }
          effetti: { profondita.avv-puliti: 1 }
        fallimento:
          titolo: Il posto sulla panca
          testo: |
            A dieci passi la voce ti dice che c'è ancora il tuo posto sulla panca, e ti siedi per terra con le
            mani sulle ginocchia. Ti rialzi molto dopo al buio, e torni indietro tastando la parete. Sotto le
            dita la pietra ha graffi bassi e paralleli, all'altezza di chi sta seduto.
          effetti: { tormento: 0.5 }
      - testo: "Rispondergli come ti risponderebbe lui"
        descrizione: "Darrin, a una domanda, risponde con una parola e un gesto. Chi lo imita non sa quale."
        prova: { attributo: sociale, abilita: empatia, difficolta: Molto difficile }
        successo:
          titolo: I turni di domani
          testo: |
            Chiedi alla voce quali sono i turni di domani alla segheria. Darrin risponderebbe con tre nomi e
            un gesto del carbone. La voce dice «Resti» con la erre che si impunta uguale a prima, e tu sai che
            non è lui. La galleria torna una galleria qualunque, con la bava sulle pareti e il tuo passo che
            rimbomba.
          pe: { empatia: 3 }
          effetti: { profondita.avv-puliti: 1 }
        fallimento:
          titolo: Tre nomi
          testo: |
            La voce ti risponde con i nomi giusti di tre della squadra, e tu ci credi. Pronuncia ogni nome con
            la erre che si impunta, anche quelli che la erre non ce l'hanno. Quando te ne accorgi sei
            sedut{o|a} contro la parete, e hai perso il conto del tempo.
          effetti: { tormento: 0.5 }
      - testo: "Tapparti le orecchie e andare a tentoni"
        descrizione: "Con le orecchie tappate la voce si sente lo stesso, ma lontana. E non vedi dove vai."
        costo: 3
        esito:
          titolo: A tentoni
          testo: |
            Ti tappi le orecchie con la cera di una candela e cammini con una spalla contro la parete, senza
            lanterna, per tutta la galleria. La cera si scalda e si ammorbidisce, e ogni tanto devi premerla
            di nuovo con il pollice. Quando ne esci la voce di Darrin ce l'hai ancora in testa, e ci resta.
          effetti: { profondita.avv-puliti: 1, tormento: 0.5 }

  - id: avv-puliti-gli-annegati-in-piedi
    immagine: icone/fish-monster
    titolo: Gli annegati in piedi
    sommario: "Una sala allagata piena di servi in piedi nell'acqua. Girano la testa tutti insieme verso chi si muove."
    luogo: Le acque sotto la vecchia Pannion, la sala degli annegati
    area: avv-puliti
    ripetibile: true
    requisiti: [avventura.puliti == 6, profondita.avv-puliti >= 7, profondita.avv-puliti <= 9]
    testo: |
      La galleria sbocca in una sala allagata fino alla vita, piena di decine di servi in piedi. Stanno in
      file regolari a un braccio uno dall'altro, e l'acqua intorno a loro è ferma. Le fessure dei loro colli
      si aprono e si chiudono tutte insieme, e il risucchio fa un rumore unico e basso. Quando entri girano la
      testa verso di te come alla mensa dei carbonai.

      Due si staccano dagli altri e vengono avanti spingendo l'acqua con il petto. Nella fila restano due
      posti vuoti, e nessuno li chiude.

      {armi-da-mischia Media} Nell'acqua alta sono lenti e il collo è la parte molle. Sul bordo, dove l'acqua
      è bassa, sarebbero più veloci di te.
    opzioni:
      - testo: "Affrontare i due servi nell'acqua alta"
        descrizione: "Due servi del sovrano, con le dita palmate e la pazienza di chi è stato fermo mille anni."
        combattimento: avv-puliti-i-servi
        vittoria:
          titolo: I due servi
          testo: |
            Il secondo servo va sotto e non torna su. Gli altri restano dove sono con le teste girate verso di
            te, e le fessure dei loro colli non perdono il ritmo nemmeno una volta. Ti guardano attraversare
            la sala fino all'uscita senza muovere un dito.
          effetti: { profondita.avv-puliti: 1 }
        sconfitta:
          titolo: Indietro
          testo: |
            I servi ti tengono sott'acqua a turno e senza fretta. Ogni volta ti lasciano risalire per un
            respiro solo, e sempre dopo lo stesso tempo. Quando ti lasciano risali a fatica verso la galleria
            da cui sei venut{o|a}, e nessuno ti segue.
          effetti: { tormento: 0.5 }
      - testo: "Stare fermo finché smettono di guardarti"
        descrizione: "Guardano chi si muove. Chi non si muove, per loro, è uno di loro."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Difficile }
        successo:
          titolo: "Un{o|a} di loro"
          testo: |
            Ti fermi con l'acqua alla vita e smetti di muoverti, anche con gli occhi. Dopo un'ora le teste si
            girano altrove una alla volta, e i due servi tornano in fila. In quell'ora il tuo respiro ha preso
            il ritmo delle fessure, e non sai da quando. Attraversi la sala un passo ogni volta che le fessure
            si chiudono.
          pe: { resilienza: 2 }
          effetti: { profondita.avv-puliti: 1 }
        fallimento:
          titolo: Il prurito
          testo: |
            Ti prude il naso, e ti gratti. Tutte le teste si girano nello stesso momento e con lo stesso
            scatto, e i due servi ti sono addosso prima che tu arrivi alla galleria.
          effetti: { ferite: 0.5 }
      - testo: "Passare sul bordo, dove l'acqua è bassa"
        descrizione: "Sul bordo sono veloci, ma il bordo è stretto e loro stanno in mezzo alla sala."
        prova: { attributo: fisico, abilita: [atletica, furtivita], difficolta: Difficile }
        successo:
          titolo: Il bordo
          testo: |
            Corri sul bordo della sala con l'acqua alle caviglie, e i servi si voltano tutti a seguirti, ma tu
            sei già all'uscita prima che il primo arrivi al bordo. Dietro di te l'acqua alta si muove in
            un'onda sola, fatta da tutti loro insieme.
          pe: { atletica: 2 }
          effetti: { profondita.avv-puliti: 1 }
        fallimento:
          titolo: Le dita palmate
          testo: |
            A metà bordo una mano palmata ti prende la caviglia e ti tira nell'acqua alta. La presa è fredda,
            e la pelle fra le dita è sottile come carta bagnata. Ti liberi con un calcio e torni indietro con
            il segno delle dita sulla pelle.
          effetti: { ferite: 0.5 }
      - testo: "Tornare indietro e aspettare che si rimettano in fila"
        descrizione: "Prima o poi tornano al loro posto. Bisogna aspettare quaggiù, e l'aspettare quaggiù costa."
        costo: 3
        esito:
          titolo: L'attesa
          testo: |
            Aspetti nella galleria finché le fessure dei colli tornano tutte allo stesso ritmo, e poi
            attraversi la sala in punta di piedi. Durante l'attesa ti sei addormentat{o|a} due volte in piedi
            con le braccia lungo i fianchi, e hai sognato di essere in fila.
          effetti: { profondita.avv-puliti: 1, tormento: 0.5 }

  - id: avv-puliti-la-porta-di-casa
    immagine: icone/wooden-door
    titolo: La porta di casa
    sommario: "Nell'acqua nera della galleria c'è una porta che conosci, socchiusa, con la luce accesa dietro."
    luogo: Le acque sotto la vecchia Pannion, l'ultima galleria
    area: avv-puliti
    ripetibile: true
    requisiti: [avventura.puliti == 6, profondita.avv-puliti >= 7, profondita.avv-puliti <= 9]
    testo: |
      In fondo all'ultima galleria, nell'acqua nera, c'è la porta di casa tua. Ha la maniglia storta e la luce
      accesa dietro, e da sotto arriva l'odore della cena. Il legno è asciutto fino alla soglia, e l'acqua si
      ferma a un dito dallo stipite senza bagnarlo. Sai che dietro c'è un letto asciutto in una stanza dove
      non entra nessuno.

      Intorno l'acqua è calma, e basterebbe aprire per entrare. La luce che passa sotto la porta non si
      riflette sull'acqua.

      {percezione Molto difficile} Sullo stipite c'è una goccia incisa con la punta in alto che la tua porta
      non ha mai avuto. L'incisione ha i bordi smussati dal tempo, e il legno intorno è nuovo.

      {origine apprendista-raschiatore} Sulle piattaforme della Cicatrice i vecchi dicono ridendo che nel
      Labirinto la cosa più pericolosa è una porta che riconosci.
    opzioni:
      - testo: "Passare oltre la porta"
        descrizione: "La galleria continua oltre la porta. Basta non fermarsi."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Difficile }
        successo:
          titolo: Oltre
          testo: |
            Passi accanto alla porta con gli occhi avanti, e l'odore della cena ti segue per dieci passi e poi
            resta indietro. Quando ti volti la porta non c'è più. Sulla superficie si allargano dei cerchi
            lenti, e quando spariscono l'acqua è soltanto acqua.
          pe: { resilienza: 2 }
          effetti: { profondita.avv-puliti: 1 }
        fallimento:
          titolo: La maniglia
          testo: |
            Ti ritrovi con la mano sulla maniglia e la porta mezza aperta, e la maniglia sotto il palmo è
            tiepida. La lasci andare, e la porta si richiude con il rumore che fa sempre. Torni indietro con
            quel rumore nelle orecchie.
          effetti: { tormento: 0.5 }
      - testo: "Aprirla e guardare che cosa c'è davvero"
        descrizione: "Una porta finta ha un dietro vero. Bisogna guardarlo senza crederci."
        prova: { attributo: mentale, abilita: percezione, difficolta: Molto difficile }
        successo:
          titolo: Il dietro
          testo: |
            Apri la porta e dietro non c'è una stanza. C'è un occhio pallido grande come una ruota di carro,
            molto lontano nell'acqua, che si chiude piano quando capisce che l'hai visto. L'odore della cena
            c'è ancora, e viene da laggiù. La porta sparisce, e la galleria davanti a te scende verso
            quell'occhio.
          pe: { percezione: 3 }
          effetti: { profondita.avv-puliti: 1 }
        fallimento:
          titolo: La cena
          testo: |
            Apri, e c'è davvero la cena in tavola. Ti siedi e mangi, e la minestra ha il sapore che ricordi.
            Quando ti alzi hai la bocca piena di acqua salata e sei in ginocchio nella galleria, molto più
            indietro di prima.
          effetti: { tormento: 0.5 }
      - testo: "Chiudere gli occhi e nuotare alla cieca"
        descrizione: "Se non la vedi, la porta non può chiamarti. L'acqua però è nera, e lunga."
        costo: 3
        esito:
          titolo: Alla cieca
          testo: |
            Nuoti a occhi chiusi lungo la galleria, sbattendo le mani contro le pareti, finché l'odore della
            cena sparisce. A un certo punto la mano urta del legno liscio, e tu non ti fermi. Quando apri gli
            occhi hai la bava fin dentro le orecchie.
          effetti: { profondita.avv-puliti: 1, contaminazione: 0.5 }

  # ------------------------------------------------------------ 10 · il cuore: l'offerta e lo scontro nell'acqua
  - id: avv-puliti-l-offerta
    immagine: ambientazione/regno-profondo
    titolo: L'offerta
    sommario: "Dal lago sotto la valle si alza il sovrano dei murali, e ti offre di pulirti."
    luogo: Le acque sotto la vecchia Pannion, il lago del sovrano
    area: avv-puliti
    requisiti: [avventura.puliti == 6, profondita.avv-puliti >= 10]
    testo: |
      L'ultima galleria si apre su un lago sotterraneo così grande che la lanterna non ne trova le pareti.
      L'acqua è tiepida e liscia, tanto che la fiamma ci si specchia senza tremare, e dal fondo sale la stessa
      luce pallida del pozzo. In fondo al buio l'acqua si gonfia piano, e dal lago si alza la creatura dei
      murali.

      È enorme e pallida, con la pelle coperta di una bava che cola in fili. I fili ricadono nel lago senza
      lasciare cerchi. Sulla fronte ha tre occhi in fila grandi come ruote di carro, che si aprono uno alla
      volta. Intorno alla bocca i tentacoli si muovono lenti. Il banco di pesci ciechi che ti ha seguito dalla
      cisterna si gira tutto insieme verso il centro del lago e resta fermo. È Ossaleth, e ti sta guardando.

      La voce non viene dalla bocca. Ti arriva dentro la testa con la voce di Darrin, poi con quella di
      Liduina e alla fine con la tua. La tua la riconosci per ultima, perché non l'hai mai sentita da fuori.

      «Sei stanc{o|a}, e ti porti dietro ferite che non guariscono» dice. «Io ti pulisco. Entri nell'acqua e
      l'acqua ti tiene, e non devi più decidere niente.»

      {resilienza Difficile} Mentre parlava hai fatto un passo verso l'acqua senza volerlo, e adesso l'acqua
      tiepida ti copre la punta degli stivali.
    opzioni:
      - testo: "Lasciarti pulire"
        descrizione: "Entrare nell'acqua e smettere di decidere. È quello che ti chiede, ed è facile."
        esito:
          titolo: Pulito
          testo: |
            Entri nell'acqua fino al petto, e l'acqua ti tiene. Per un tempo che non misuri non hai fame e non
            hai paura. Ti risvegli all'alba sul bordo della cisterna del forno, con le braccia bagnate fino ai
            gomiti e Nerio che ti tira fuori per il colletto bestemmiando. Di come sei risalit{o|a} non
            ricordi niente, e sotto le unghie hai una sabbia chiara e fine che nella cisterna del forno non
            c'è.
          effetti: { tormento: 1 }
          vai: superficie-fratturata
      - testo: "Rifiutare e scendere in acqua contro di lui"
        descrizione: "Il sovrano dei murali ha già perso un impero. Puoi provare a fargli perdere anche Pannion."
        esito:
          titolo: Il rifiuto
          testo: |
            Gli dici di no ad alta voce, e la parola rimbomba sul lago come un sasso in un pozzo. L'eco torna
            indietro dal buio tre volte, e alla terza ha la voce di Darrin. I tre occhi si chiudono e si
            riaprono insieme. Poi Ossaleth scende nell'acqua, e l'acqua comincia a muoversi verso di te.
          segue: avv-puliti-lo-scontro-nell-acqua

  - id: avv-puliti-lo-scontro-nell-acqua
    tipo: seguito
    immagine: icone/kraken-tentacle
    titolo: Lo scontro nell'acqua
    sommario: "Ossaleth scende nel lago, e il lago si alza con lui."
    luogo: Le acque sotto la vecchia Pannion, il lago del sovrano
    area: avv-puliti
    requisiti: [avventura.puliti == 6]
    testo: |
      Ossaleth scende nel lago e il lago si alza con lui fino alle tue spalle. I tentacoli salgono lenti da
      sotto a cercarti le caviglie, e la bava rende l'acqua densa come brodo. Alla radice ogni tentacolo è
      grosso quanto la tua coscia, e dove ti sfiora la pelle si intorpidisce. Sopra la bocca i tre occhi ti
      seguono senza sbattere.

      Dalla riva la lanterna che hai lasciato manda fin qui una luce gialla e bassa, e sotto di te dal fondo
      sale quella pallida del pozzo.

      {armi-da-mischia Difficile} I tentacoli si piegano verso l'esterno e sotto la bocca, contro il petto,
      non arrivano. Il petto lo tiene sempre sott'acqua, e da lì gli occhi sono a portata di lama.
    opzioni:
      - testo: "Affrontare Ossaleth"
        descrizione: "Un sovrano del Regno Profondo, nell'acqua che comanda. Ha tre occhi, e nessuna fretta."
        combattimento: avv-puliti-ossaleth
        vittoria:
          titolo: Il trono vuoto
          testo: |
            Il terzo occhio si spacca sotto la lama, e Ossaleth affonda nel lago piano e senza un suono,
            finché la luce della lanterna non lo trova più. L'acqua si fa chiara, e la bava ti si stacca dalle
            braccia in fili lunghi che vanno a fondo dietro di lui. Sulla riva da cui è salito trovi ossa che
            nessuno ha mai classificato e anelli di metallo verde come quelli della vasca.

            Risali per tutta la notte, e a ogni gradino basso le gambe devono ritrovare il passo. All'alba,
            sul bordo della cisterna del forno, Nerio ti aspetta con la lanterna accesa e una castagna arrosto
            in mano.
          effetti: { avventura.puliti: 1, informazioni.segreto: 1, reliquie.frammento-inciso: 2 }
          vai: superficie-fratturata
        sconfitta:
          titolo: Il fondo
          testo: |
            I tentacoli ti tirano sotto, e sotto è buio e tiepido. Sott'acqua senti un battito lento e grande
            che non è il tuo. Ti risvegli sulla riva con l'acqua nei polmoni e la lanterna spenta accanto.
            Risali senza voltarti, e sul bordo della cisterna Nerio ti tira fuori senza fare domande.
          effetti: { tormento: 1 }
          vai: superficie-fratturata
      - testo: "Colpire gli occhi da sotto la bocca"
        descrizione: "Sotto la bocca i tentacoli non arrivano. Bisogna arrivarci, e restarci."
        prova: { attributo: fisico, abilita: [armi-da-mischia, atletica], difficolta: Difficile }
        successo:
          titolo: Sotto la bocca
          testo: |
            Ti tuffi sotto i tentacoli e risali contro il petto della creatura, dove la pelle è molle e calda.
            Lì l'acqua è ferma, e i tentacoli ti passano sopra la testa senza trovarti. Colpisci in alto un
            occhio dopo l'altro, e Ossaleth affonda nel lago senza un suono, finché la luce non lo trova più.
            Sulla riva trovi ossa mai classificate e anelli di metallo verde.

            Risali per tutta la notte. All'alba Nerio ti aspetta sul bordo della cisterna con la lanterna
            accesa.
          pe: { armi-da-mischia: 5 }
          effetti: { avventura.puliti: 1, informazioni.segreto: 1, reliquie.frammento-inciso: 2 }
          vai: superficie-fratturata
        fallimento:
          titolo: I tentacoli
          testo: |
            A metà strada un tentacolo ti prende alla vita e ti sbatte contro la riva tre volte. Fra un colpo
            e l'altro aspetta con calma che tu riprenda fiato. Ti trascini su per le gallerie con le costole
            che scricchiolano, e all'alba Nerio ti tira fuori dalla cisterna.
          effetti: { ferite: 2, tormento: 0.5 }
          vai: superficie-fratturata
      - testo: "Leggere al contrario le ultime pagine di Lumelli"
        descrizione: "Le pagine strappate al rito sono la fine del libro. Lette dall'ultima riga alla prima, forse disfano quello che il libro ha fatto."
        requisiti: [avv-puliti.pagine >= 1]
        prova: { attributo: mentale, abilita: [accademiche, magia], difficolta: Difficile }
        successo:
          titolo: All'indietro
          testo: |
            Tieni le pagine sopra l'acqua e leggi le file di gocce dal basso in alto con la voce che ti trema,
            schioccando la lingua come faceva Lumelli. Al terzo rigo i tentacoli si fermano a mezz'acqua e
            restano tesi mentre leggi. All'ultimo Ossaleth chiude gli occhi uno alla volta e affonda, e le
            pagine ti si sciolgono fra le dita. Sulla riva trovi ossa mai classificate e anelli di metallo
            verde.

            All'alba Nerio ti aspetta sul bordo della cisterna con la lanterna accesa.
          pe: { accademiche: 5 }
          effetti: { avventura.puliti: 1, informazioni.segreto: 1, reliquie.frammento-inciso: 2 }
          vai: superficie-fratturata
        fallimento:
          titolo: Il rigo saltato
          testo: |
            Salti un rigo, e Ossaleth sente la differenza. I tre occhi si aprono del tutto, uno dopo l'altro.
            Un tentacolo ti strappa le pagine di mano e un altro ti prende al petto. Ti risvegli sulla riva, e
            risali fino alla cisterna con la testa che ronza.
          effetti: { ferite: 1.5, tormento: 1 }
          vai: superficie-fratturata
      - testo: "Ricordargli il trono vuoto"
        descrizione: "Quelli in ginocchio, un giorno, hanno alzato la testa verso una balena. Lui se lo ricorda."
        requisiti: [avv-puliti.murali >= 1]
        prova: { attributo: sociale, abilita: [intimidire, espressivita], difficolta: Difficile }
        successo:
          titolo: La balena
          testo: |
            Gli gridi della balena che è passata sopra il trono, e di quelli che hanno alzato la testa a
            guardarla. La tua voce rimbomba sul lago e torna indietro dalle pareti che la lanterna non trova.
            Ossaleth si alza fuori dall'acqua con tutti e tre gli occhi aperti, e scopre il petto. Lo colpisci
            lì, e lui affonda nel lago finché la luce non lo trova più. Sulla riva trovi ossa mai classificate
            e anelli di metallo verde.

            All'alba Nerio ti aspetta sul bordo della cisterna con la lanterna accesa.
          pe: { intimidire: 5 }
          effetti: { avventura.puliti: 1, informazioni.segreto: 1, reliquie.frammento-inciso: 2 }
          vai: superficie-fratturata
        fallimento:
          titolo: La voce che si spezza
          testo: |
            La voce ti si spezza a metà, e Ossaleth ti risponde con la tua, finendo la frase al posto tuo con
            le parole che stavi per dire. Poi i tentacoli ti trovano. Risali fino alla cisterna all'alba, e
            per giorni ti senti finire le frasi da sol{o|a}.
          effetti: { ferite: 1.5, tormento: 1 }
          vai: superficie-fratturata
      - testo: "Dire nell'acqua la Preghiera del Battito"
        descrizione: "La formula dei riti di purificazione dice che anche noi ricorderemo. È quello che lui vuole toglierti."
        quando: [origine.accolito-del-velo >= 1]
        prova: { attributo: mentale, abilita: [resilienza, magia], difficolta: Difficile }
        successo:
          titolo: Finché il cuore batterà
          testo: |
            Dici la Preghiera del Battito ad alta voce, con l'acqua alla gola, e la ripeti finché Ossaleth
            smette di parlarti dentro la testa. Alla decima volta le parole ti escono con il ritmo del cuore.
            Senza la sua voce i tentacoli si muovono a caso, e tu arrivi agli occhi. Lui affonda nel lago
            finché la luce non lo trova più. Sulla riva trovi ossa mai classificate e anelli di metallo verde.

            All'alba Nerio ti aspetta sul bordo della cisterna con la lanterna accesa.
          pe: { resilienza: 5 }
          effetti: { avventura.puliti: 1, informazioni.segreto: 1, reliquie.frammento-inciso: 2 }
          vai: superficie-fratturata
        fallimento:
          titolo: La preghiera dimenticata
          testo: |
            A metà preghiera non ricordi più come continua, e Ossaleth te la recita lui con la tua voce.
            Arriva fino in fondo senza sbagliare una parola. I tentacoli ti trovano mentre ascolti. Risali
            fino alla cisterna all'alba, e la preghiera ti torna in mente soltanto sulla scala.
          effetti: { ferite: 1.5, tormento: 1 }
          vai: superficie-fratturata
