# La ricompensa dei Puliti di Pannion: la piastrina fredda di Nerio Arpesi, accessorio di grado 4 (piano-avventure:
# un accessorio che scherma la mente). Budget: lucida 2 + schermata 2 + talento resilienza 1 = 5 punti, su grado 4
# più un difetto. Riconoscibile: a Pannion tutti sanno di chi era, e i Puliti l'hanno sempre girata alla larga.
oggetti:
  - id: avv-puliti-piastrina-fredda
    nome: Piastrina fredda
    immagine: icone/tribal-pendant
    descrizione: "Una piastrina liscia di metallo nero dei Precursori, con un foro nel mezzo per lo spago da collo. La nonna di Nerio Arpesi l'ha trovata nel torrente della vecchia Pannion, e resta fredda anche vicino al fuoco. Chi la porta non sente le voci che vengono dall'acqua, e le cose storte gli scivolano addosso."
    slot: accessorio
    grado: 4
    proprieta: { lucida: true, schermata: true, talento: { resilienza: 1 } }
    difetti: [riconoscibile]
