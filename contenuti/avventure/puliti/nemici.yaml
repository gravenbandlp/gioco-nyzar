# I nemici e gli scontri dei Puliti di Pannion, tarati con `npx tsx scripts/simula-fine.ts avv-puliti-` sul profilo
# «fine contenuti» (Fisico 4, Armi da mischia 4, Spadone di Uzgreth, cotta di maglia), fra l'Atto IV dei villaggi e
# la Campana: gregari fra il 70 e l'85%, Ossaleth fra il 40 e il 55%.
# - Il rito (seguito `avv-puliti-le-bocche-informi`): le bocche informi, i due facchini di Lumelli disfatti.
# - La cisterna (0-2): l'anguilla cieca.
# - Le rovine (3-6): un servo del sovrano sveglio nella sua nicchia, rinforzato perché combatte da solo.
# - La soglia (7-9): due servi nella sala degli annegati.
# - Il cuore: Ossaleth, una fase sola, con il sussurro che svuota (incantesimi.yaml) al posto della voce.
nemici:
  - id: avv-puliti-bocca-informe
    immagine: icone/lamprey-mouth
    nome: Bocca informe
    descrizione: "Quello che resta di un facchino della Città Bassa dopo un mese nell'acqua della cisterna. È un mucchio di bocche dalle labbra bianche che striscia sulla pietra e morde tutto quello che tocca."
    attacco: 6
    difesa: 3
    difesaMentale: 4
    pf: 11
    danno: 3
    riduzione: 3
    iniziativa: 2

  - id: avv-puliti-anguilla-cieca
    immagine: icone/eel
    nome: Anguilla cieca
    descrizione: "Un'anguilla bianca lunga quanto una barca, senza occhi, che caccia nel fondo della cisterna sentendo l'acqua che sposti. Morde e poi si avvolge, e tira sotto."
    attacco: 6
    difesa: 5
    difesaMentale: 3
    pf: 14
    danno: 4
    riduzione: 3
    iniziativa: 4
    tratti: [animale]

  - id: avv-puliti-servo-del-sovrano
    immagine: icone/fish-monster
    nome: Servo del sovrano
    descrizione: "Una figura pallida più alta di un uomo, con le dita palmate e le fessure delle branchie sul collo. È rimasta in piedi in una nicchia per mille anni ad aspettare un ordine, e adesso l'ordine è arrivato."
    attacco: 5
    difesa: 4
    difesaMentale: 5
    pf: 12
    danno: 3
    riduzione: 3
    iniziativa: 2

  - id: avv-puliti-ossaleth
    immagine: ambientazione/regno-profondo
    nome: Ossaleth
    descrizione: "Il sovrano dei murali, lungo più di tre barche, pallido, con tre occhi in fila sulla fronte e un ventaglio di tentacoli intorno alla bocca. Parla dentro la testa con le voci della gente che conosci, e ti chiede di stare fermo."
    attacco: 6
    difesa: 4
    difesaMentale: 7
    pf: 28
    danno: 3
    riduzione: 5
    iniziativa: 3
    magia: 4
    energia: 4
    incantesimi: [sussurro-che-svuota]

scontri:
  - { id: avv-puliti-le-bocche, nome: "Le bocche informi", nemici: [avv-puliti-bocca-informe, avv-puliti-bocca-informe], feriteSconfitta: 2 }
  - { id: avv-puliti-l-anguilla, nome: "L'anguilla cieca", nemici: [avv-puliti-anguilla-cieca], feriteSconfitta: 2 }
  - { id: avv-puliti-il-servo, nome: "Il servo sveglio", nemici: [avv-puliti-servo-del-sovrano], feriteSconfitta: 2, rinforzo: { difesa: 1, pf: 2, danno: 2 } }
  - { id: avv-puliti-i-servi, nome: "I servi nell'acqua alta", nemici: [avv-puliti-servo-del-sovrano, avv-puliti-servo-del-sovrano], feriteSconfitta: 2 }
  - { id: avv-puliti-ossaleth, nome: "Ossaleth", nemici: [avv-puliti-ossaleth], feriteSconfitta: 3 }
