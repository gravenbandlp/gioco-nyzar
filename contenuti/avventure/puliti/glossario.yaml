# Le voci del glossario per i Puliti di Pannion: i nomi nuovi dell'Avventura (Nerio Arpesi, Nazario Lumelli,
# Ossaleth, il Libro dell'Acqua Ferma, i Puliti, la cisterna del forno). Presentazioni senza segreti; Ossaleth e i
# Puliti si sottolineano soltanto da quando il gioco li ha nominati.
# - «cisterna del forno» si cerca con la minuscola, come sta nei testi.
glossario:
  - id: nerio-arpesi
    nome: Nerio Arpesi
    alias: [Nerio]
    tipo: personaggio
    sottotitolo: "Castagnaro di Pannion"
    testo: "Il castagnaro di Pannion è un uomo basso e largo, con la barba grigia tagliata a colpi di forbice e le tasche sempre piene di castagne. Ha il castagneto sulla costa nord dell'altura e paga i raccoglitori come in città. Parla molto, dice «eh» a ogni frase e porta al collo una piastrina della nonna."
    requisiti: []

  - id: nazario-lumelli
    nome: Nazario Lumelli
    alias: [Lumelli]
    tipo: personaggio
    sottotitolo: "Collezionista di curiosità dei Quartieri Alti"
    testo: "Un collezionista di curiosità dei Quartieri Alti, magro, che porta sempre i guanti e un panciotto di seta. Nei salotti lo conoscono come quello che compra le cose che gli altri hanno paura di tenere in casa, e le paga bene. È salito a Pannion con due facchini della Città Bassa per vedere la vecchia Pannion."
    requisiti: []

  - id: ossaleth
    nome: Ossaleth
    tipo: creatura
    sottotitolo: "Il sovrano dei murali, sotto la vecchia Pannion"
    testo: "Una creatura del Regno Profondo lunga più di tre barche, pallida, con tre occhi in fila sulla fronte e un ventaglio di tentacoli intorno alla bocca. I murali sotto la vecchia Pannion la mostrano su un trono di conchiglie, davanti a migliaia di servi in ginocchio. Parla dentro la testa, con le voci di chi conosci."
    requisiti: [avventura.puliti >= 6]

  - id: libro-dell-acqua-ferma
    nome: Libro dell'Acqua Ferma
    tipo: cosa
    sottotitolo: "Il libro di Nazario Lumelli"
    testo: "Un libro di pagine di pelle di pesce cucite con le lische, scritto in file di gocce che scendono dall'alto in basso. Nazario Lumelli lo ha comprato al Mercato delle Ombre e lo leggeva ad alta voce, in una lingua di schiocchi e di vocali lunghe che nessun alfabeto della Biblioteca conosce."
    requisiti: []

  - id: puliti
    nome: Puliti
    tipo: fazione
    sottotitolo: "La gente di Pannion che si dice pulita"
    testo: "Così si chiamano a Pannion quelli che hanno sentito la voce dell'acqua. Mangiano crudo il pesce cieco, incidono una goccia rovesciata sugli stipiti, si bagnano le braccia fino ai gomiti e stanno fermi per ore a guardare la valle. Si salutano in coro con «Buona acqua a chi entra»."
    requisiti: [avventura.puliti >= 1]

  - id: cisterna-del-forno
    nome: cisterna del forno
    tipo: luogo
    sottotitolo: "Sotto il forno della vecchia Pannion"
    testo: "La cisterna di pietra sotto il forno della vecchia Pannion, da cui un tempo i fornai tiravano su l'acqua con una scala di ferro murata nella parete. Il pavimento del forno ci è crollato dentro, e adesso al suo posto c'è un pozzo d'acqua nera con il bordo inciso di gocce."
    requisiti: []
