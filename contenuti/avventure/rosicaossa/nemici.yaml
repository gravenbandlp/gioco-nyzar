# I nemici dell'Avventura «Il Rosicaossa» (docs/piano-avventure.md, n. 6). Tarati con
# `npx tsx scripts/simula-fine.ts avv-rosicaossa-` sul profilo «fine contenuti» (Fisico 4, Armi da mischia 4,
# Spadone di Uzgreth, cotta di maglia): gregari fra il 70 e l'85%, il cuore fra il 40 e il 55%.
# - 1-3, i condotti: i granchi del ranno, che vivono nell'acqua calda e grassa che scende dalle fucine.
# - 5, la svolta: i due svuotati, Ennio Sterza e Vanna Ghedi, quando smettono di fingere.
# - 7-9, la galleria dei glifi: le zecche d'osso, i piccoli del Rosicaossa.
# - Il cuore: il Rosicaossa nel nido, con i due svuotati al suo fianco (indeboliti dal rinforzo negativo: dopo la
#   svolta sono stanchi, e combattono per lui senza volerlo).
nemici:
  - id: avv-rosicaossa-granchio-del-ranno
    immagine: icone/crab-claw
    nome: Granchio del ranno
    descrizione: "Un granchio pallido largo quanto uno scudo, cresciuto nell'acqua saponosa che le fucine e le lavandaie buttano nei condotti. Ha il guscio molle ai bordi e una chela sola grande, che chiude come una cesoia."
    attacco: 6
    difesa: 3
    difesaMentale: 3
    pf: 11
    danno: 3
    riduzione: 3
    iniziativa: 2
    tratti: [animale]

  - id: avv-rosicaossa-svuotato
    immagine: bestiario/wight
    nome: Svuotato
    descrizione: "Una persona a cui il Rosicaossa ha bevuto il midollo. Pesa quanto un bambino, cammina sulle pareti senza far rumore e ha un forellino rotondo in ogni giuntura. Parla volentieri, e quasi sempre per mentire."
    attacco: 5
    difesa: 4
    difesaMentale: 2
    pf: 12
    danno: 3
    riduzione: 3
    iniziativa: 4

  - id: avv-rosicaossa-zecca-d-osso
    immagine: icone/fangs
    nome: Zecca d'osso
    descrizione: "Un piccolo del Rosicaossa grande come un braccio, con molte zampe bianche. Ha la bocca piena di denti piccoli, perché l'ago gli cresce più tardi. Le zecche girano a coppie e tornano al nido con quello che trovano."
    attacco: 5
    difesa: 4
    difesaMentale: 4
    pf: 12
    danno: 3
    riduzione: 3
    iniziativa: 4

  - id: avv-rosicaossa-rosicaossa
    immagine: bestiario/verme-carogna
    nome: Il Rosicaossa
    descrizione: "Una bestia lunga come un carro, pallida, fatta di anelli duri come l'osso e di zampe che finiscono in uncini. Ha la testa di un cavallo scarnito e sotto la testa un ago cavo ripiegato, lungo un braccio, con cui beve il midollo ai vivi."
    attacco: 6
    difesa: 3
    difesaMentale: 6
    pf: 24
    danno: 3
    riduzione: 5
    iniziativa: 2

scontri:
  - { id: avv-rosicaossa-i-granchi, nome: "I granchi del ranno", nemici: [avv-rosicaossa-granchio-del-ranno, avv-rosicaossa-granchio-del-ranno], feriteSconfitta: 2 }
  - { id: avv-rosicaossa-gli-svuotati, nome: "I due svuotati", nemici: [avv-rosicaossa-svuotato, avv-rosicaossa-svuotato], feriteSconfitta: 2 }
  - { id: avv-rosicaossa-le-zecche, nome: "Le zecche d'osso", nemici: [avv-rosicaossa-zecca-d-osso, avv-rosicaossa-zecca-d-osso], feriteSconfitta: 2 }
  - id: avv-rosicaossa-il-nido
    nome: "Il Rosicaossa nel nido"
    nemici: [avv-rosicaossa-rosicaossa, avv-rosicaossa-svuotato, avv-rosicaossa-svuotato]
    feriteSconfitta: 3
    rinforzo: { attacco: -2, difesa: -1, pf: -7, danno: -1, riduzione: -2, solo: [avv-rosicaossa-svuotato] }
