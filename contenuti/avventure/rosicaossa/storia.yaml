# Avventura n. 6, «Il Rosicaossa» (docs/piano-avventure.md). Pista `avventura.rosicaossa`, da 0 a 8, aperta da
# `pista.capomozzo >= 10`. I ragazzi dell'Orlo dei Rottami si sfidano a scendere sotto il Ponte dei Morti, nella tana
# del Rosicaossa della filastrocca, e Ninetta Ravasco non è tornata su. Il Rosicaossa esiste: è una bestia antica che
# vive in una galleria dei Precursori aperta nella parete della Cicatrice, sotto il ponte, e beve il midollo ai vivi.
# Chi è stato svuotato resta vivo, leggero e obbediente: due di loro sono Raschiatori spariti sulla parete anni fa, Ennio
# Sterza e Vanna Ghedi, con le lanterne ancora accese sul ponte.
# - 0 → 1 · la mano sul ponte (presso ponte-dei-morti): Rosetta Lanza ti afferra il braccio. Il seguito è la filastrocca.
# - 1 → 2 · il gioco degli obblighi (presso orlo-dei-rottami): vantaggio `avv-rosicaossa.gesso`, i segni dei ragazzi
#   sulla parete (via dell'ingresso senza prova, una via facile nello scivolo).
# - 2 → 3 · il punto della calata (presso ponte-dei-morti): vantaggio `avv-rosicaossa.osso`, l'osso di gatto svuotato
#   (una via Media alla svolta).
# - 3 → 4 · lo scolatore (presso orlo-dei-rottami): Nazzaro Ceppi, la paratia dei condotti e l'ultima strofa della
#   filastrocca; vantaggio `avv-rosicaossa.paratia` (due vie Medie nelle stanze 7-9, dove l'acqua è più alta).
# - 4 → 5 · i dispersi della parete (presso grifone-di-ferro): Dragna e il registro dei turni; vantaggio
#   `avv-rosicaossa.lanterne`, le lanterne dei due Raschiatori (una via alla svolta e una al cuore).
# - 5 · l'acqua che sale (presso ponte-dei-morti): l'ingresso della spedizione `avv-rosicaossa` (spedizione.yaml).
#   Il cuore vinto porta la pista a 6 e apre la risalita.
# - 6 → 7 · la ragazzina che non ricorda (presso ponte-dei-morti): la scelta su a chi lasciare la storia
#   (`avv-rosicaossa.fine` 1 i Raschiatori della veglia, rep.raschiatori; 2 i ragazzi dell'Orlo, nomea.citta-bassa).
# - 7 → 8 · ossa e ferro (presso fucina-dei-due-mastini): Bram Halgast batte lo scudo con la piastra della muta del
#   Rosicaossa e la piastra del parapetto. Ricompensa: `oggetto.avv-rosicaossa-scudo-di-ossa-e-ferro`.
# Origini: figlio-della-citta-bassa (la filastrocca, l'Orlo), apprendista-raschiatore (le lanterne, Dragna).
quality:
  - { id: avventura.rosicaossa, immagine: ambientazione/ponte-dei-morti, nome: "Il Rosicaossa", categoria: pista, descrizione: "Sotto il Ponte dei Morti i ragazzi della Città Bassa si sfidano a scendere nella tana del Rosicaossa della filastrocca. Una ragazzina non è tornata su." }
  - { id: avv-rosicaossa.gesso, immagine: icone/footprint, nome: I segni di gesso, categoria: stato, descrizione: "I ragazzi dell'Orlo segnano con il gesso il punto della parete a cui arrivano negli obblighi. Quelli di Ninetta scendono più in basso di tutti, e adesso sai leggerli." }
  - { id: avv-rosicaossa.osso, immagine: icone/stoned-skull, nome: L'osso vuoto, categoria: stato, descrizione: "Sulla trave sotto il Ponte dei Morti c'era l'osso di un gatto svuotato da un forellino rotondo. Adesso sai che aspetto ha quello che il Rosicaossa ha già rosicato." }
  - { id: avv-rosicaossa.paratia, immagine: icone/pipes, nome: La paratia di Nazzaro, categoria: stato, descrizione: "Al terzo rintocco della notte Nazzaro Ceppi chiuderà la paratia dei condotti per il tempo di una pipa. Nel tratto più basso l'acqua calerà." }
  - { id: avv-rosicaossa.lanterne, immagine: icone/old-lantern, nome: Le due lanterne, categoria: stato, descrizione: "Dragna ti ha lasciato staccare dal Ponte dei Morti le lanterne di Ennio Sterza e Vanna Ghedi, due Raschiatori spariti sulla parete della Cicatrice." }
  - { id: avv-rosicaossa.svolta, nome: Senza peso, categoria: stato, nascosta: true, descrizione: "Hai capito chi sono i due che ti hanno parlato sulla parete." }
  - { id: avv-rosicaossa.fine, nome: La storia del Rosicaossa, categoria: stato, nascosta: true, descrizione: "A chi hai lasciato la storia. 1 ai Raschiatori della veglia; 2 ai ragazzi dell'Orlo." }

storylet:
  # ------------------------------------------------------------ 0 → 1 · l'aggancio, sul Ponte dei Morti
  - id: avv-rosicaossa-la-mano-sul-ponte
    presso: ponte-dei-morti
    immagine: ambientazione/ponte-dei-morti
    titolo: La mano sul ponte
    sommario: "Sul Ponte dei Morti una ragazzina della Città Bassa ti prende per il braccio e non lo molla più."
    luogo: Ponte dei Morti, quando sale la nebbia
    area: ponti-sospesi
    requisiti: [pista.capomozzo >= 10, avventura.rosicaossa == 0]
    testo: |
      Quando la nebbia sale dalla Cicatrice il Ponte dei Morti si svuota in fretta, e restano solo le lanterne
      dei Raschiatori a dondolare sul vuoto. Al terzo pilone una mano ti afferra il braccio e stringe con le
      unghie.

      È una ragazzina scalza di dodici anni al massimo, con un berretto da Raschiatore calato sugli occhi e
      una ciocca di capelli fra i denti. Quando ti volti stringe più forte.

      «Tu sei grande» dice. «Tu puoi scendere. Ninetta è giù da ieri sera, e la corda l'abbiamo tirata su
      vuota.» Indica con il mento una corda annodata al parapetto che pende nella nebbia. «È colpa mia, che
      l'obbligo gliel'ho dato io. Giù fino alla tana del Rosicaossa e su con un sasso della tana in bocca.
      Tutti tornano su prima di metà corda, e lei è andata fino in fondo, te lo giuro sulla lanterna.»

      {empatia Facile} Ha pianto tutta la notte e ha finito le lacrime. Ti tiene il braccio perché sei la
      prima cosa ferma che ha trovato.

      {origine figlio-della-citta-bassa} All'Orlo il Rosicaossa te lo cantavano per tenerti lontano dal bordo,
      e a dieci anni una sera ci sei andat{o|a} apposta per vedere se saliva a prenderti.
    opzioni:
      - testo: "Farla calmare e farti raccontare tutto"
        descrizione: "Ha fretta e mescola le cose. Se si calma, ti dice chi è Ninetta e da dove è scesa."
        prova: { attributo: sociale, abilita: [empatia, persuasione], difficolta: Media }
        successo:
          titolo: Rosetta
          testo: |
            La fai sedere sulla cassa dei Raschiatori della veglia e aspetti
            che smetta di tremare. Si chiama Rosetta Lanza. Ninetta Ravasco ha
            undici anni, una madre che lava i panni all'Orlo e la testa più
            dura del quartiere. È scesa alla seconda campana con un lumino e
            un pezzo di gesso, e la corda è tornata su bagnata e senza nodo.
          pe: { empatia: 2 }
          effetti: { avventura.rosicaossa: 1 }
          segue: avv-rosicaossa-la-filastrocca
        fallimento:
          titolo: La voce di Rosetta
          testo: |
            Le dici di calmarsi, e lei si mette a gridare che nessuno la
            ascolta, così forte che i Custodi in fondo al ponte si voltano.
            Poi se ne vergogna. Ti dice il nome di Ninetta e quello del
            posto dove abita, l'Orlo dei Rottami. Scappa via nella nebbia
            prima che tu possa chiederle altro.
          effetti: { avventura.rosicaossa: 1, scandalo: 0.5 }
      - testo: "Prometterle che vai a cercarla"
        descrizione: "Una promessa fatta su un ponte pieno di lanterne. Rosetta la prenderà sul serio."
        esito:
          titolo: La promessa
          testo: |
            Le dici che la cerchi tu, e solo allora ti lascia il braccio. Ti
            restano quattro segni di unghie sopra il polso. Rosetta si siede
            sulla cassa della veglia con le gambe strette al petto e comincia
            a dirti chi è Ninetta, da capo, piano.
          effetti: { avventura.rosicaossa: 1 }
          segue: avv-rosicaossa-la-filastrocca
      - testo: "Cantarle la filastrocca fino in fondo"
        descrizione: "All'Orlo la sapevi meglio di tutti. Una ragazzina dell'Orlo riconosce chi viene da lì al secondo verso."
        quando: [origine.figlio-della-citta-bassa >= 1]
        esito:
          titolo: "Un{o|a} dell'Orlo"
          testo: |
            Le canti piano i primi due versi, e lei li finisce con te, per
            abitudine, con la voce che le trema. Poi ti guarda meglio la
            faccia e le mani. «Tu sei dell'Orlo» dice, e si siede sulla cassa
            della veglia senza lasciarti il braccio.
          effetti: { avventura.rosicaossa: 1 }
          segue: avv-rosicaossa-la-filastrocca

  - id: avv-rosicaossa-la-filastrocca
    tipo: seguito
    immagine: ambientazione/ponte-dei-morti
    titolo: La filastrocca
    sommario: "Rosetta ti canta la filastrocca del Rosicaossa, come la cantano all'Orlo."
    luogo: Ponte dei Morti, sulla cassa della veglia
    area: ponti-sospesi
    testo: |
      Rosetta si soffia il naso nella manica e ti canta la filastrocca battendo il tempo sulla cassa, come
      all'Orlo quando si salta la corda.

      «Rosicaossa, Rosicaossa, sotto il ponte c'è la fossa. Chi ci scende col lumino torna su come un
      uccellino.»

      «Poi c'è un pezzo che non si ricorda nessuno» dice. «Lo sa il vecchio dei condotti, ma puzza di sapone e
      morde.»

      {accademiche Media fallita} Con la stessa musica da piccol{o|a} ti cantavano una filastrocca sul pane.
      Dell'osso non ti viene in mente niente.
    opzioni:
      - testo: "Chiederle che cosa si è portata giù Ninetta"
        costo: 0
        esito:
          titolo: Il lumino e il gesso
          testo: |
            «Il lumino è un cristallo da scarto dell'Orlo, che fa luce per
            una notte se lo scaldi in mano» dice Rosetta. «Il gesso è per il
            segno. Chi fa l'obbligo segna dove è arrivato, e gli altri vanno a
            vedere. Domani alla seconda campana giochiamo di nuovo, se vuoi
            venire.»
          segue: avv-rosicaossa-la-filastrocca
      - testo: "Chiederle perché proprio sotto il Ponte dei Morti"
        costo: 0
        esito:
          titolo: Le lanterne
          testo: |
            Rosetta ti guarda come se non sapessi le cose più semplici, e ti
            spiega che il Rosicaossa si mangia i Raschiatori. «Per questo
            gli appendono le lanterne, così lui le vede e sa che gli altri
            si ricordano.» Indica la fila in fondo al ponte, verso la Città
            Bassa, e abbassa la voce. «Quelle là sono le sue.»
          segue: avv-rosicaossa-la-filastrocca
      - testo: "Mandarla a casa"
        costo: 0
        esito:
          titolo: Verso il Ponte del Pesce
          testo: |
            Rosetta salta giù dalla cassa e ti fa promettere un'altra volta,
            con la mano sul cuore come i grandi. Poi corre verso il Ponte del
            Pesce con il berretto in mano, e in fondo al ponte si ferma a
            guardare la corda che pende nella nebbia.

  # ------------------------------------------------------------ 1 → 2 · il gioco degli obblighi
  - id: avv-rosicaossa-il-gioco-degli-obblighi
    presso: orlo-dei-rottami
    immagine: ambientazione/orlo-dei-rottami
    titolo: Il gioco degli obblighi
    sommario: "Dietro l'ultima baracca dell'Orlo i ragazzi giocano agli obblighi sul bordo della Cicatrice. Sanno dove è scesa Ninetta."
    luogo: Orlo dei Rottami, dietro l'ultima baracca
    area: citta-bassa
    requisiti: [avventura.rosicaossa == 1]
    testo: |
      Dietro l'ultima baracca dell'Orlo, a tre passi dal bordo, c'è una lastra di ferro dei Precursori
      piantata storta nella terra. Sopra ci siedono in cerchio una decina di ragazzi, e in mezzo gira un
      coccio di bottiglia. Chi è indicato sceglie fra verità e obbligo, e all'Orlo la verità costa di più.

      Rosetta è in piedi dietro il cerchio. Quando arrivi il coccio si ferma e i più piccoli si stringono ai
      grandi.

      Sotto il bordo la parete è piena di croci di gesso con le iniziali, sempre più rade verso il basso.

      {conoscenze-della-strada Media} Qui sei {un adulto|un'adulta} che arriva senza invito, e per questi
      ragazzi vuol dire la Guardia o qualcuno che cerca braccia per le fucine.
    opzioni:
      - testo: "Sederti nel cerchio e giocare un giro"
        descrizione: "Chi gioca è dei loro. Se il coccio indica te, però, l'obbligo lo devi fare davvero."
        prova: { attributo: sociale, abilita: [espressivita, persuasione], difficolta: Media }
        successo:
          titolo: L'obbligo dei grandi
          testo: |
            Il coccio si ferma su di te al secondo giro, e i ragazzi ti
            danno l'obbligo di camminare sul bordo con gli occhi chiusi. Lo
            fai, e quando li riapri hai tutto il cerchio intorno. Il più
            piccolo ti porta per mano a vedere i segni, e le croci di
            Ninetta le riconosci subito dalla forma tonda. Scendono più in
            basso di tutte le altre.
          pe: { espressivita: 2 }
          effetti: { avventura.rosicaossa: 1, avv-rosicaossa.gesso: 1 }
        fallimento:
          titolo: Il cerchio che si rompe
          testo: |
            Ti siedi nel cerchio e il coccio non gira più. I ragazzi si
            alzano uno alla volta e spariscono fra le lamiere, e dalla prima
            baracca una donna con le braccia nude ti chiede che cosa vuoi dai
            suoi figli, a voce alta.
          effetti: { scandalo: 0.5 }
      - testo: "Leggere da sol{o|a} i segni sulla parete"
        descrizione: "Croci e iniziali, ognuna più giù dell'altra. Chi le ha fatte aveva un metodo."
        prova: { attributo: mentale, abilita: [percezione, accademiche], difficolta: Media }
        successo:
          titolo: Le iniziali
          testo: |
            Ti sdrai sul bordo e guardi i segni finché non li capisci. Ogni
            ragazzo ha la sua mano e la sua lettera, e accanto alla lettera
            c'è una croce per ogni appiglio buono. Le enne sono le più basse e
            le più fitte, e scendono verso il ponte, finché la nebbia non le
            copre.
          pe: { percezione: 2 }
          effetti: { avventura.rosicaossa: 1, avv-rosicaossa.gesso: 1 }
        fallimento:
          titolo: "{Uno sdraiato|Una sdraiata} sul bordo"
          testo: |
            Resti sdraiat{o|a} sul bordo un'ora a guardare croci che non ti dicono
            niente. Quando ti rialzi hai addosso gli occhi di mezzo Orlo, e
            qualcuno ha già deciso che sei un{o|a} che cerca bambini da vendere.
          effetti: { sospetto: 0.5 }
      - testo: "Aspettare che Rosetta venga a parlarti"
        descrizione: "Rosetta ha bisogno di te più di quanto gli altri lo sappiano. Prima o poi si stacca dal gruppo."
        costo: 2
        esito:
          titolo: Rosetta da sola
          testo: |
            Ti siedi su un bidone rovesciato a qualche passo, e aspetti fino
            al buio. Quando i ragazzi se ne vanno Rosetta resta, e ti dice
            sottovoce che Ninetta è scesa dalla fine del Ponte dei Morti,
            dove il parapetto ha la piastra che si muove.
          effetti: { avventura.rosicaossa: 1 }
      - testo: "Fare un obbligo dei tuoi tempi"
        descrizione: "Gli obblighi dell'Orlo li conosci. Ce n'è uno che nessuno di questi ragazzi ha mai visto fare."
        quando: [origine.figlio-della-citta-bassa >= 1]
        esito:
          titolo: Il salto della lamiera
          testo: |
            Prendi la rincorsa e salti dalla lastra alla lamiera della prima
            baracca, sopra il vuoto, come si faceva ai tuoi tempi. I ragazzi
            urlano tutti insieme. Dopo, ti fanno vedere i segni sulla parete
            come si mostrano le cose a uno di casa.
          effetti: { avventura.rosicaossa: 1, avv-rosicaossa.gesso: 1 }

  # ------------------------------------------------------------ 2 → 3 · il punto della calata
  - id: avv-rosicaossa-il-punto-della-calata
    presso: ponte-dei-morti
    immagine: ambientazione/cicatrice-del-mondo
    titolo: Il punto della calata
    sommario: "In fondo al Ponte dei Morti la corda dei ragazzi scende su una trave. Sulla trave ci sono ossa piccole e leggere."
    luogo: Ponte dei Morti, la testata verso la Città Bassa
    area: ponti-sospesi
    requisiti: [avventura.rosicaossa == 2]
    testo: |
      In fondo al Ponte dei Morti, verso la Città Bassa, una piastra del parapetto è allentata e i ragazzi ci
      legano la corda. Sei braccia più giù una trave di ferro nero va dal primo pilone alla parete, dove si
      apre la bocca rotonda di un condotto che butta un filo d'acqua fumante.

      Ieri sulla trave Rosetta ha trovato il nastro rosso di Ninetta, che adesso porta al polso, e un osso
      piccolo che ti mette in mano. Pesa quanto una piuma.

      {medicina Media} È l'osso della zampa di un gatto, vuoto da un capo all'altro e con un forellino rotondo
      e liscio a un'estremità.

      {origine apprendista-raschiatore} Le lanterne qui in fondo sono di squadre vecchie e durante i turni le
      passavi in fretta. Sulla trave sotto non avevi mai guardato.
    opzioni:
      - testo: "Calarti sulla trave e guardare da vicino"
        descrizione: "Sei braccia di corda e una trave larga un piede. Sotto c'è la nebbia."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Media }
        successo:
          titolo: La trave
          testo: |
            Scendi sulla trave e ci cammini sopra a gattoni fino alla parete.
            Nell'angolo contro la roccia c'è un mucchietto di ossa piccole
            di piccioni e di gatti, tutte con lo stesso forellino e tutte
            leggere. Accanto, sulla roccia, c'è una croce di gesso tonda.
          pe: { atletica: 2 }
          effetti: { avventura.rosicaossa: 1, avv-rosicaossa.osso: 1 }
        fallimento:
          titolo: La trave bagnata
          testo: |
            La trave è bagnata dall'acqua del condotto, e il piede ti scivola
            al secondo passo. Resti appes{o|a} alla corda con le ginocchia contro
            il ferro, e Rosetta ti tira su con tutti e due i piedi puntati sulla
            piastra.
          effetti: { ferite: 0.5 }
      - testo: "Studiare l'osso che ti ha dato Rosetta"
        descrizione: "Un osso vuoto, con un buco solo. Qualcosa l'ha bevuto da dentro."
        prova: { attributo: mentale, abilita: [medicina, natura], difficolta: Media }
        successo:
          titolo: Il forellino
          testo: |
            Lo giri alla luce di una lanterna. Il gatto era vivo quando gli è
            stato fatto il buco, perché l'osso intorno si è richiuso in un
            orlo sottile, come una ferita che guarisce. Gli hanno bevuto il
            midollo un poco alla volta, per giorni, mentre il gatto
            camminava ancora.
          pe: { medicina: 2 }
          effetti: { avventura.rosicaossa: 1, avv-rosicaossa.osso: 1 }
        fallimento:
          titolo: Leggero
          testo: |
            Lo rigiri fra le dita finché non te ne accorgi più per quanto è
            leggero, e per un po' ti sembra di avere vuote anche le dita.
            Rosetta ti guarda strano, e tu glielo rendi in fretta.
          effetti: { tormento: 0.5 }
      - testo: "Guardare giù dal parapetto con una lanterna"
        descrizione: "Dal parapetto si vede la bocca del condotto, e poco altro. Ci vuole pazienza perché la nebbia si apra."
        costo: 2
        esito:
          titolo: La bocca del condotto
          testo: |
            Tieni la lanterna fuori dal parapetto finché ti fa male il
            braccio. Quando la nebbia si apre vedi la bocca del condotto, e
            sul bordo una croce di gesso tonda. Il resto lo copre di nuovo la
            nebbia.
          effetti: { avventura.rosicaossa: 1 }

  # ------------------------------------------------------------ 3 → 4 · lo scolatore
  - id: avv-rosicaossa-lo-scolatore
    presso: orlo-dei-rottami
    immagine: icone/pipes
    titolo: Lo scolatore
    sommario: "Il vecchio che pulisce le grate dei condotti sa dove va a finire l'acqua delle fucine, e l'ultima strofa della filastrocca."
    luogo: Orlo dei Rottami, la grata dei condotti
    area: citta-bassa
    requisiti: [avventura.rosicaossa == 3]
    testo: |
      Sotto la discesa di Grusk, dove l'Orlo scende verso il bordo, l'acqua calda delle fucine passa sotto una
      grata di ferro e va giù per i condotti. Accanto alla grata, seduto su una ruota con la catena, c'è un
      vecchio con un uncino in mano e le braccia rosse fino al gomito. È Nazzaro Ceppi, lo scolatore. Odora di
      sapone per il ranno delle lavandaie che finisce nei condotti.

      «La ragazzina del Ravasco» dice prima che tu apra bocca. «A regola di condotti, alla terza campana le
      fucine vuotano le vasche di tempra e l'acqua scende tutta dove è scesa lei. E là sotto l'acqua è il
      guaio più piccolo.» Sputa nella grata. «L'ultima strofa la cantava mia nonna. Ferro nero e lume acceso,
      torna su con tutto il peso.»

      {tecnologia Media} La ruota comanda una paratia. Chiusa, manda l'acqua delle fucine nel canale di
      sinistra e lascia asciutti gli altri.
    opzioni:
      - testo: "Convincerlo a chiudere la paratia quando sarai giù"
        descrizione: "La paratia chiusa allaga il canale di sinistra, e le fucine se ne accorgono. Nazzaro rischia il posto."
        prova: { attributo: sociale, abilita: [persuasione, conoscenze-della-strada], difficolta: Media }
        successo:
          titolo: Il tempo di una pipa
          testo: |
            Gli parli della madre di Ninetta, che lava i panni dell'Orlo in
            quell'acqua da vent'anni. Nazzaro si gratta le braccia rosse e
            alla fine dice che alla terza campana chiuderà la paratia per il
            tempo di una pipa sola, prima di riaprire. «A regola di
            condotti» aggiunge, e ti stringe la mano con la sua, ruvida come
            la pietra.
          pe: { persuasione: 2 }
          effetti: { avventura.rosicaossa: 1, avv-rosicaossa.paratia: 1 }
        fallimento:
          titolo: Il rame dei condotti
          testo: |
            Nazzaro ti ascolta con gli occhi stretti e poi dice che sotto i
            condotti c'è il rame dei tubi vecchi, e che ogni tanto arriva uno
            con una storia triste per andarselo a prendere. Ti punta contro
            l'uncino finché non te ne vai.
          effetti: { sospetto: 0.5 }
      - testo: "Aiutarlo a rimettere in sesto la ruota della paratia"
        descrizione: "La catena è mangiata dal ranno e la ruota gira a scatti. Un favore si ricambia con un favore."
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Media }
        successo:
          titolo: La catena nuova
          testo: |
            Trovi l'anello che si incastra, lo apri con la pinza di Nazzaro e
            lo rimetti dritto. La ruota adesso gira liscia, e la paratia
            scende fino in fondo senza scatti. Nazzaro la prova due volte e poi
            ti dice che alla terza campana chiuderà per te il tempo di una pipa.
          pe: { tecnologia: 2 }
          effetti: { avventura.rosicaossa: 1, avv-rosicaossa.paratia: 1 }
        fallimento:
          titolo: Il ranno
          testo: |
            Metti le mani nella catena bagnata, e l'acqua delle fucine ti
            morde la pelle fra le dita. Te le lavi nel secchio di Nazzaro.
            Lui ride, e ti spiega che il ranno va rispettato.
          effetti: { ferite: 0.5 }
      - testo: "Lasciarti spiegare i condotti e basta"
        descrizione: "Nazzaro parla volentieri dei condotti, se nessuno gli chiede niente. Ci vuole la sera intera."
        costo: 2
        esito:
          titolo: La sera dei condotti
          testo: |
            Nazzaro ti racconta i condotti uno per uno, da quello delle
            concerie a quello dell'Acciaieria, con l'uncino che disegna nel
            fango. Quando ha finito è buio. Di quello che c'è sotto la parete
            non dice più niente.
          effetti: { avventura.rosicaossa: 1 }

  # ------------------------------------------------------------ 4 → 5 · i dispersi della parete
  - id: avv-rosicaossa-i-dispersi-della-parete
    presso: grifone-di-ferro
    immagine: personaggi/dragna-gro-malog
    titolo: I dispersi della parete
    sommario: "Al Grifone Dragna tiene il registro dei turni. Le lanterne in fondo al Ponte dei Morti hanno un nome, e quei nomi sono nel registro."
    luogo: Locanda del Grifone di Ferro, il tavolo di Dragna
    area: ponti-sospesi
    requisiti: [avventura.rosicaossa == 4]
    testo: |
      Dragna Gro-Malog è al suo tavolo con il registro dei turni aperto. Quando le chiedi delle lanterne in
      fondo al ponte verso la Città Bassa, chiude il registro con la mano a cui mancano due dita.

      «Lì appendiamo quelli che spariscono sulla parete» dice, e beve un sorso. «Ennio Sterza è sparito undici
      anni fa sotto la testata, e il nodo della corda l'aveva sciolto lui a mano. Vanna Ghedi sei anni fa, e
      il turno gliel'avevo dato io. Era scesa a riprendere una cassa caduta sotto il ponte, e la corda è
      tornata su vuota e bagnata.»

      {empatia Media} L'ultima frase l'ha detta più piano, e il nome di Vanna nel registro l'ha scritto lei.

      {origine apprendista-raschiatore} Le lanterne della parete non le tocca nessuno finché non si trova il
      corpo, e allora il Ferro la stacca e la spegne con due dita.
    opzioni:
      - testo: "Chiederle di lasciarti portare giù le loro lanterne"
        descrizione: "Una lanterna non si stacca senza un corpo. Ma là sotto, forse, c'è qualcuno che le aspetta."
        prova: { attributo: sociale, abilita: [persuasione, empatia], difficolta: Media }
        successo:
          titolo: Il permesso del Ferro
          testo: |
            Le racconti della corda di Ninetta, che è tornata su bagnata con
            il nodo sciolto. Dragna resta zitta a lungo, poi batte i monconi
            sul tavolo.
            «Le stacchi tu e me le riporti tu» dice, e beve un sorso lungo.
            «Accese, oppure insieme a quei due, se li trovi.»
          pe: { persuasione: 2 }
          effetti: { avventura.rosicaossa: 1, avv-rosicaossa.lanterne: 1 }
        fallimento:
          titolo: Le lanterne non si toccano
          testo: |
            Dragna ti ascolta fino in fondo e poi dice di no, con una voce che
            fa voltare i tavoli vicini. Le lanterne della parete non si
            toccano, e chi lo fa non scende più con i Raschiatori. Torni al
            bancone con mezzo Grifone che ti guarda.
          effetti: { scandalo: 0.5 }
      - testo: "Leggere con lei il registro dei turni"
        descrizione: "Due sparizioni sotto lo stesso ponte, a cinque anni di distanza. Nel registro, forse, c'è altro."
        prova: { attributo: mentale, abilita: [accademiche, percezione], difficolta: Media }
        successo:
          titolo: Sotto lo stesso ponte
          testo: |
            Sfogli il registro con lei, una pagina d'inverno dopo l'altra.
            Prima di Ennio ci sono altri tre nomi, in grafie vecchie, tutti
            spariti sotto la testata verso la Città Bassa. Dragna li conta con
            il dito e ti dice di prendere le due lanterne.
          pe: { accademiche: 2 }
          effetti: { avventura.rosicaossa: 1, avv-rosicaossa.lanterne: 1 }
        fallimento:
          titolo: La birra sulla carta
          testo: |
            Il registro ha le pagine incollate dalla birra, e ne strappi una
            girandola. Dragna te lo toglie di mano senza una parola, e la
            pagina strappata la liscia con il palmo per un pezzo.
          effetti: { tormento: 0.5 }
      - testo: "Aspettare che finisca i turni"
        descrizione: "Dragna risponde alle domande quando i turni sono fatti, mai prima. La sera è lunga."
        costo: 2
        esito:
          titolo: A turni fatti
          testo: |
            Aspetti al bancone fino a mezzanotte, quando Dragna chiude il
            registro. Ti ripete i nomi di Ennio Sterza e Vanna Ghedi e ti
            dice di stare lontano dalla testata del ponte, perché le
            lanterne della parete restano dove sono.
          effetti: { avventura.rosicaossa: 1 }
      - testo: "Chiederle le lanterne con le parole della veglia"
        descrizione: "C'è una formula per chiedere una lanterna, e la conosce chi ha fatto i turni sulle piattaforme."
        quando: [origine.apprendista-raschiatore >= 1]
        esito:
          titolo: Una lanterna per nome
          testo: |
            Dici le parole della veglia, una lanterna per nome e una per ciò
            che pensavi di sapere di lui. Dragna alza gli occhi dal registro
            e ti guarda come si guarda una recluta che ha imparato qualcosa.
            «Prendile» dice, e riapre il registro alla pagina di Vanna.
            «Riportamele tu.»
          effetti: { avventura.rosicaossa: 1, avv-rosicaossa.lanterne: 1 }

  # ------------------------------------------------------------ 5 · l'ingresso della spedizione
  - id: avv-rosicaossa-l-acqua-che-sale
    presso: ponte-dei-morti
    immagine: ambientazione/ponte-dei-morti
    titolo: L'acqua che sale
    sommario: "Alla terza campana le fucine vuotano le vasche, e l'acqua scende nei condotti sotto il ponte. Ninetta è là sotto."
    luogo: Ponte dei Morti, prima della terza campana
    area: ponti-sospesi
    requisiti: [avventura.rosicaossa == 5]
    testo: |
      Manca poco alla terza campana. Dalla Città Bassa sale il vapore delle fucine pronte a vuotare le vasche,
      e sotto la testata la bocca del condotto butta già più acqua calda.

      Rosetta ti aspetta in fondo al ponte con la corda dei ragazzi su una spalla e il nastro di Ninetta al
      polso. Sotto il parapetto le croci di gesso scendono verso il condotto. Più in là due Lunghi fumano su
      una piattaforma di servizio accanto a un argano da carico.

      {atletica Media} La corda è buona e i nodi un po' meno. Fino alla trave sono sei braccia, poi c'è roccia
      bagnata.
    opzioni:
      - testo: "Calarti con la corda dei ragazzi"
        descrizione: "La corda alla piastra del parapetto, i piedi sulla roccia bagnata, e poi dentro la bocca del condotto."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Media }
        successo:
          titolo: Dentro la bocca
          testo: |
            Scendi fino alla trave, ci cammini sopra fino alla parete e ti
            infili nella bocca del condotto con l'acqua calda che ti scorre
            fra le gambe. Da sopra Rosetta ti grida qualcosa che non capisci.
          pe: { atletica: 2 }
          vai: avv-rosicaossa
        fallimento:
          titolo: Il nodo
          testo: |
            Un nodo della corda si scioglie a metà, e gli ultimi passi li fai
            cadendo sulla trave. Ti rialzi con il ginocchio aperto e
            raggiungi il condotto zoppicando.
          effetti: { ferite: 0.5 }
          vai: avv-rosicaossa
      - testo: "Scendere sui segni di gesso"
        descrizione: "Ogni croce dei ragazzi è un appiglio buono. Quelle di Ninetta portano dritte alla bocca del condotto."
        requisiti: [avv-rosicaossa.gesso >= 1]
        esito:
          titolo: Le croci tonde
          testo: |
            Scendi dalla parete senza corda. Metti i piedi soltanto sulle
            croci dei ragazzi, e le croci tengono tutte. Le ultime sono
            quelle tonde di Ninetta, e finiscono sul bordo della bocca del
            condotto, dove
            l'acqua ha già cancellato mezzo segno.
          vai: avv-rosicaossa
      - testo: "Pagare i Lunghi perché ti calino con l'argano"
        descrizione: "L'argano dei Lunghi porta giù le casse fino alla trave. Ti calano come una cassa, e ci mettono il loro tempo."
        costo: 2
        esito:
          titolo: Come una cassa
          testo: |
            I Lunghi ti fanno sedere nella rete da carico e ti calano piano,
            discutendo fra loro di chi ha vinto a dadi ieri sera. Arrivi
            sulla trave con la rete che dondola sul vuoto e la testa che gira,
            e il condotto ti aspetta lì accanto.
          effetti: { tormento: 0.5 }
          vai: avv-rosicaossa
      - testo: "Scendere con il nodo delle piattaforme"
        descrizione: "Sulle piattaforme della Cicatrice si scende con un nodo che tiene il peso e si scioglie dall'alto. Te l'hanno insegnato il primo giorno."
        quando: [origine.apprendista-raschiatore >= 1]
        esito:
          titolo: Il nodo dei turni
          testo: |
            Rifai la corda con il nodo delle piattaforme e scendi come in un
            turno, con il peso sulle gambe e una mano sola sulla corda. Rosetta
            ti guarda dal parapetto con la bocca aperta, e tu sei già dentro
            il condotto.
          vai: avv-rosicaossa

  # ------------------------------------------------------------ 6 → 7 · la ragazzina che non ricorda
  - id: avv-rosicaossa-la-ragazzina-che-non-ricorda
    presso: ponte-dei-morti
    immagine: ambientazione/ponte-dei-morti
    titolo: La ragazzina che non ricorda
    sommario: "All'alba Ninetta mangia pane sulla cassa della veglia, e non ricorda niente. In fondo al ponte due lanterne aspettano."
    luogo: Ponte dei Morti, all'alba
    area: ponti-sospesi
    requisiti: [avventura.rosicaossa == 6]
    testo: |
      All'alba la nebbia scende di nuovo nella Cicatrice. Ninetta è seduta sulla cassa della veglia nel
      giaccone di un vecchio Raschiatore, e mangia a morsi grandi il pane di sua madre. Ha un forellino rosso
      nella piega del gomito e non ricorda niente dopo il parapetto, solo di aver sognato di essere leggera.

      Rosetta le sta accanto e non le lascia la mano. Ha staccato la piastra allentata del parapetto e te la
      porge. «Così nessuno ci lega più la corda» dice.

      In fondo al ponte le lanterne di Ennio Sterza e Vanna Ghedi bruciano come da anni, e i Raschiatori della
      veglia aspettano che tu dica qualcosa.

      {resilienza Media} Hai ancora addosso la parete. La parte di te che è rimasta giù vorrebbe che qualcuno
      ti chiedesse com'è andata.
    opzioni:
      - testo: "Raccontare ai Raschiatori della veglia come sono finiti"
        descrizione: "Due nomi del registro di Dragna. Le loro squadre hanno diritto di saperlo, e le lanterne di spegnersi."
        esito:
          titolo: Due lanterne spente
          testo: |
            Racconti tutto, piano, al vecchio della veglia e alla donna della
            sua squadra. Quando hai finito il vecchio va in fondo al ponte,
            stacca le due lanterne e le spegne con due dita, come fa il Ferro.
            Stasera al Grifone Dragna scriverà due righe nuove nel registro, e
            i Raschiatori ti offriranno da bere senza dire perché.
          effetti: { avventura.rosicaossa: 1, avv-rosicaossa.fine: 1, rep.raschiatori: 1 }
      - testo: "Lasciare le lanterne accese e dare la storia ai ragazzi"
        descrizione: "All'Orlo vogliono sapere com'è finita. Una filastrocca nuova tiene i ragazzi lontani dal bordo meglio di una lanterna spenta."
        esito:
          titolo: La strofa nuova
          testo: |
            Le lanterne le lasci accese. Ai ragazzi dell'Orlo che arrivano
            sul ponte per vedere Ninetta racconti la storia del nido e del
            ferro nero, senza fare i nomi dei due. Prima di sera Rosetta ha già
            messo
            una strofa nuova in fondo alla filastrocca, e dentro ci sei tu.
          effetti: { avventura.rosicaossa: 1, avv-rosicaossa.fine: 2, nomea.citta-bassa: 1 }
      - testo: "Spegnere tu le lanterne, con il gesto dei turni"
        descrizione: "Hai fatto la veglia anche tu. Una lanterna si spegne con due dita e una parola, e la parola la sai."
        quando: [origine.apprendista-raschiatore >= 1]
        esito:
          titolo: Il gesto dei turni
          testo: |
            Vai in fondo al ponte, stacchi le due lanterne e le spegni con due
            dita, dicendo i nomi a voce bassa. Il vecchio della veglia annuisce
            e ti chiede di raccontare. Stasera al Grifone Dragna scriverà due
            righe nuove nel registro, e saprà da chi.
          effetti: { avventura.rosicaossa: 1, avv-rosicaossa.fine: 1, rep.raschiatori: 1 }

  # ------------------------------------------------------------ 7 → 8 · ossa e ferro
  - id: avv-rosicaossa-ossa-e-ferro
    presso: fucina-dei-due-mastini
    immagine: personaggi/bram-halgast
    titolo: Ossa e ferro
    sommario: "Bram Halgast guarda la piastra della muta e la piastra del parapetto, e dice che ci si può fare uno scudo."
    luogo: Fucina dei Due Mastini
    area: citta-bassa
    requisiti: [avventura.rosicaossa == 7]
    testo: |
      Bram Halgast mette sull'incudine le due piastre che gli hai portato. La prima è un pezzo curvo della
      muta del Rosicaossa che pesa come il legno. La seconda è la piastra nera del parapetto che ti ha dato
      Rosetta.

      Bram batte su tutte e due con il martello piccolo e ascolta. I due mastini rossi annusano l'osso da
      lontano con il pelo dritto.

      «Il ferro dei ponti vecchi è dei Precursori e nella mia forgia non fonde» dice. «Si piega a caldo e si
      inchioda. Quest'altra roba invece è nuova anche per me, e mi piace.» Si pulisce le mani sul grembiule.
      «Domattina hai uno scudo.»

      {armi-da-mischia Media} L'osso davanti e il ferro dietro, inchiodati a caldo. Chi ci picchia sopra sente
      cedere l'osso e trova il ferro.
    opzioni:
      - testo: "Tornare la mattina a prendere lo scudo"
        descrizione: "Bram ci lavora tutta la notte, e la Città Bassa sente battere il martello fino all'alba."
        esito:
          titolo: Lo scudo di ossa e ferro
          testo: |
            La mattina lo scudo è appeso al gancio della porta, ancora tiepido.
            È tondo, con la muta bianca davanti e il ferro nero che sporge sul
            bordo, e sul dietro Bram ci ha inciso il suo martello di pietra.
            Quando lo imbracci ti sembra più leggero di quanto dovrebbe. Fuori,
            due ragazzi dell'Orlo lo riconoscono e attaccano la filastrocca.
          effetti: { avventura.rosicaossa: 1, oggetto.avv-rosicaossa-scudo-di-ossa-e-ferro: 1 }
