# La ricompensa dell'Avventura «Il Rosicaossa»: lo scudo che Bram Halgast batte con la piastra della muta del
# Rosicaossa e la piastra del parapetto del Ponte dei Morti (storia.yaml, passo 7 → 8). Grado 4 su base `scudo`:
# 2 dadi in difesa, Ultimo respiro (2) e un dado di Intimidire fuori dal combattimento (1), cinque punti con il
# difetto Riconoscibile (all'Orlo i ragazzi lo riconoscono e attaccano la filastrocca).
oggetti:
  - id: avv-rosicaossa-scudo-di-ossa-e-ferro
    nome: Scudo di ossa e ferro
    immagine: icone/round-shield
    descrizione: "Uno scudo tondo con davanti una piastra della muta del Rosicaossa inchiodata a caldo sul ferro nero del parapetto del Ponte dei Morti. Chi ci picchia sopra sente cedere l'osso e trova il ferro. All'Orlo dei Rottami i ragazzi lo riconoscono da lontano e attaccano la filastrocca."
    slot: scudo
    base: scudo
    grado: 4
    dadi: 2
    proprieta: { ultimoRespiro: true, talento: { intimidire: 1 } }
    difetti: [riconoscibile]
