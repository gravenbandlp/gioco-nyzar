# Le voci del glossario per i nomi nuovi dell'Avventura «Il Rosicaossa», nel formato di
# contenuti/glossario/personaggi.yaml: presentazioni stabili, senza segreti (che Ennio e Vanna siano svuotati
# resta fuori). Ponte dei Morti, Orlo dei Rottami, Dragna Gro-Malog e Bram Halgast hanno già la loro voce.
# - «svuotato», «zecca d'osso» e «granchio del ranno» restano senza voce: sono parole comuni, e la voce
#   sottolineerebbe anche gli usi che non c'entrano («hai svuotato la cassa»).
glossario:
  - id: rosicaossa
    nome: Rosicaossa
    tipo: creatura
    sottotitolo: "La bestia della filastrocca"
    testo: "La bestia della filastrocca che all'Orlo dei Rottami si canta ai bambini per tenerli lontani dal bordo. Dicono che viva sotto il Ponte dei Morti e beva le ossa a chi scende nella sua tana. I ragazzi della Città Bassa si sfidano a scendere a cercarla, e tornano su prima di metà corda."
    requisiti: []

  - id: ninetta-ravasco
    nome: Ninetta Ravasco
    alias: [Ninetta]
    tipo: personaggio
    sottotitolo: "Ragazzina dell'Orlo dei Rottami"
    testo: "Una ragazzina di undici anni dell'Orlo dei Rottami, figlia di una lavandaia, con un nastro rosso nei capelli e la testa più dura del quartiere. Negli obblighi dei ragazzi segna con il gesso croci tonde, sempre più in basso di quelle degli altri."
    requisiti: []

  - id: rosetta-lanza
    nome: Rosetta Lanza
    alias: [Rosetta]
    tipo: personaggio
    sottotitolo: "Capobanda dei ragazzi dell'Orlo"
    testo: "Dodici anni, scalza, con un berretto da Raschiatore troppo grande e una ciocca di capelli sempre fra i denti. All'Orlo dei Rottami decide lei gli obblighi del gioco, e giura sulla lanterna quando vuole essere creduta."
    requisiti: []

  - id: nazzaro-ceppi
    nome: Nazzaro Ceppi
    alias: [Nazzaro]
    tipo: personaggio
    sottotitolo: "Lo scolatore dell'Orlo dei Rottami"
    testo: "Il vecchio che da cinquant'anni tiene pulite le grate dei condotti dove l'acqua delle fucine scende verso la Cicatrice. Ha le braccia rosse di ranno fino al gomito e un uncino lungo in mano. Odora di sapone e misura ogni cosa a regola di condotti, ed è lui a comandare la ruota della paratia."
    requisiti: []

  - id: ennio-sterza
    nome: Ennio Sterza
    alias: [Ennio]
    tipo: personaggio
    sottotitolo: "Raschiatore disperso sulla parete"
    testo: "Un Raschiatore sparito undici anni fa durante un turno sulla parete della Cicatrice, sotto il Ponte dei Morti. La corda tornò su con il nodo sciolto a mano. La sua lanterna è appesa in fondo al ponte, dalla parte della Città Bassa."
    requisiti: []

  - id: vanna-ghedi
    nome: Vanna Ghedi
    alias: [Vanna]
    tipo: personaggio
    sottotitolo: "Raschiatrice dispersa sulla parete"
    testo: "Una Raschiatrice sparita sei anni fa sotto il Ponte dei Morti, mentre scendeva a riprendere una cassa caduta sulla parete. Il turno gliel'aveva dato Dragna Gro-Malog. La corda tornò su vuota e bagnata, e la sua lanterna è appesa in fondo al ponte accanto a quella di Ennio Sterza."
    requisiti: []
