# Glossario: i personaggi con un nome proprio che compaiono nei testi del gioco.
# Presentazioni generali e stabili (chi è, ruolo, luogo, un tratto riconoscibile): niente segreti né cose che
# il giocatore scopre giocando. Quando un fatto della trama cambia il PNG (morto, fuggito, in catene, partito),
# la voce ha una variante con lo stesso nome, un id nuovo e requisiti complementari: vale la prima voce i cui
# requisiti sono soddisfatti, quindi l'ordine conta.
# I cognomi di famiglia condivisi (Castaldi, Malgrani, Tarvelin, Dravec) non sono forme di queste voci.
glossario:
  # --- Segheria ---
  - id: rennick-dole
    nome: Rennick Dole
    alias: [Rennick, Dole]
    tipo: personaggio
    sottotitolo: "Responsabile della Segheria"
    testo: "Giovane responsabile della Segheria di Qir-Azel, che manda avanti con il socio Marko Thessel sotto la concessione dei Malgrani. Tiene per sé i registri e le lame, e contratta su ogni quattrino. In città ha fama di tirchio e lo ricordano ancora come il bullo della scuola, una reputazione che i garzoni della Segheria non smentiscono."
    requisiti: [pista.pelle < 7]

  - id: rennick-dole-dopo-i-malgrani
    nome: Rennick Dole
    alias: [Rennick, Dole]
    tipo: personaggio
    sottotitolo: "Responsabile della Segheria, ai tempi dei Malgrani"
    testo: "Giovane responsabile della Segheria di Qir-Azel finché la Segheria ha lavorato per i Malgrani, con il socio Marko Thessel. Teneva per sé i registri e le lame, e contrattava su ogni quattrino. In città ha fama di tirchio e lo ricordano ancora come il bullo della scuola. Adesso la Segheria è della cooperativa dei taglialegna."
    requisiti: [pista.pelle >= 7]

  - id: marko-thessel
    nome: Marko Thessel
    alias: [Marko, Thessel]
    tipo: personaggio
    sottotitolo: "Socio di Rennick Dole alla Segheria"
    testo: "Cofondatore della Segheria di Qir-Azel e socio alla pari di Rennick Dole. Sa leggere una venatura meglio di qualunque artigiano della città, e tratta di persona con i mercanti di Laresh che salgono due volte l'anno. Cambia la camicia di lino chiaro a fine turno. Ai clienti sorride sempre, mentre dei sottoposti non ricorda mai il nome."
    requisiti: [pista.pelle < 7]

  - id: marko-thessel-dopo-i-malgrani
    nome: Marko Thessel
    alias: [Marko, Thessel]
    tipo: personaggio
    sottotitolo: "Cofondatore della Segheria"
    testo: "Cofondatore della Segheria di Qir-Azel e socio di Rennick Dole finché la Segheria ha lavorato per i Malgrani, poi l'ha rilevata la cooperativa dei taglialegna. Sa leggere una venatura meglio di qualunque artigiano della città, e i mercanti di Laresh vogliono trattare soltanto con lui. Cambia la camicia di lino chiaro a fine turno, e ai clienti sorride sempre."
    requisiti: [pista.pelle >= 7]

  # --- Caserma ---
  - id: toren-galdrick
    nome: Toren Galdrick
    alias: [Galdrick]
    tipo: personaggio
    sottotitolo: "Sceriffo di Qir-Azel"
    testo: "Sceriffo di Qir-Azel e membro del Consiglio, un uomo imponente con la pelle scura e la testa rasata. Lo si trova alla Caserma o in Municipio, e non si lascia comprare. Per la città resta l'uomo che fermò il Cucitore durante le Notti Cucite, e lui non lo conferma né lo smentisce. Considera gli Scuri il problema più urgente e sconsiglia apertamente la Pignatta Grassa ai forestieri."
    requisiti: [pista.pelle < 6, galdrick.via == 0]

  - id: toren-galdrick-a-ghoran
    nome: Toren Galdrick
    alias: [Galdrick]
    tipo: personaggio
    sottotitolo: "Sceriffo di Qir-Azel"
    testo: "Sceriffo di Qir-Azel e membro del Consiglio, un uomo imponente con la pelle scura e la testa rasata. Dopo la spedizione nella Palude Acquanera è partito per Ghoran a prendere uomini per la Caserma, e nessuno sa dire quando torna. In sua assenza le carte per lui si lasciano al furiere o al sergente di turno. Per la città resta l'uomo che fermò il Cucitore durante le Notti Cucite, e lui non lo conferma né lo smentisce."
    requisiti: [galdrick.via == 1]

  - id: toren-galdrick-dopo-vesh
    nome: Toren Galdrick
    alias: [Galdrick]
    tipo: personaggio
    sottotitolo: "Sceriffo di Qir-Azel"
    testo: "Sceriffo di Qir-Azel e membro del Consiglio, un uomo imponente con la pelle scura e la testa rasata. Lo si trova alla Caserma o in Municipio, e non si lascia comprare. Per la città resta l'uomo che fermò il Cucitore, e lui non lo conferma né lo smentisce. In Città Bassa adesso è anche l'uomo che ha ucciso Mirko Vesh, la notte in cui la Pignatta Grassa è bruciata."
    requisiti: [pista.pelle >= 6]

  - id: borso
    nome: Borso
    tipo: personaggio
    sottotitolo: "Carceriere della Caserma"
    testo: "Carceriere della Caserma di Qir-Azel, un uomo massiccio con il naso rotto più volte. Porta alla cintura una clava corta, che usa soprattutto per battere sulle porte delle celle, e alza la voce di rado. Della condotta di ogni detenuto prende nota in un registro, con una matita che nella sua mano sembra minuscola."
    requisiti: [pista.pelle < 4]

  - id: borso-fuggito
    nome: Borso
    tipo: personaggio
    sottotitolo: "Il carceriere fuggito dalla Caserma"
    testo: "Era il carceriere della Caserma di Qir-Azel, un uomo massiccio con il naso rotto più volte e una clava corta alla cintura. Una notte ha attraversato il cortile con l'anello delle chiavi di tutta la Caserma e non è più tornato. Da allora si sa che prendeva anche la paga degli Scuri, e le guardie lo cercano in Città Bassa."
    requisiti: [pista.pelle >= 4, pista.pelle < 6]

  - id: borso-in-catene
    nome: Borso
    tipo: personaggio
    sottotitolo: "L'ex carceriere della Caserma"
    testo: "Era il carceriere della Caserma di Qir-Azel, un uomo massiccio con il naso rotto più volte. Per anni ha preso anche la paga degli Scuri, e una notte è fuggito con le chiavi di tutte le celle. L'hanno ripreso la notte dell'assalto alla Pignatta Grassa, e adesso sta in catene in fondo alle celle che custodiva."
    requisiti: [pista.pelle >= 6]

  - id: karn
    nome: Karn
    tipo: personaggio
    sottotitolo: "Tagliagole degli Scuri"
    testo: "Tagliagole della banda degli Scuri, uno degli uomini che la banda piazza sui tetti della Città Bassa quando c'è da tenere d'occhio una strada dall'alto. Ha l'abitudine di fischiare a mezza voce sempre la stessa canzone, e chi l'ha sentita una volta la riconosce anche senza vederlo."
    requisiti: []

  # --- Maison des Lunes ---
  - id: nerissa-dalvane
    nome: Nerissa Dalvane
    alias: [Nerissa, Dalvane]
    tipo: personaggio
    sottotitolo: "Padrona della Maison des Lunes"
    testo: "Dirige la Maison des Lunes, all'angolo fra Via del Salmone e Via dei Rasoi, e non alza mai la voce. Veste abiti scuri di buona fattura e porta un piccolo medaglione sotto la stoffa. Protegge le sue ragazze con fermezza, e nella sua casa decidono loro, anche quando la regola le costa un cliente."
    requisiti: []

  - id: sara-beck
    nome: Sara Beck
    alias: [Sara, Beck]
    tipo: personaggio
    sottotitolo: "All'ingresso della Maison des Lunes"
    testo: "Halfling allegra e cordiale che siede al bancone d'ingresso della Maison des Lunes. Spiega ai visitatori le regole della casa, poi ritira le armi e le chiude a chiave in un armadio fino all'uscita. Chiama per nome ogni cliente abituale, anche chi preferirebbe restare anonimo, e di chi ha violato le regole si ricorda per anni."
    requisiti: []

  - id: gretchen
    nome: Gretchen
    tipo: personaggio
    sottotitolo: "La più anziana delle ragazze della Maison"
    testo: "La più anziana delle ragazze della Maison des Lunes. È sempre truccata con cura e ha una risata profonda e musicale. È amica di lunga data di Nerissa Dalvane e manda avanti la casa quando la padrona è altrove. Del perché abbia lasciato Ghoran dice soltanto che in viaggio si è liberi di reinventarsi."
    requisiti: []

  - id: jass
    nome: Jass
    tipo: personaggio
    sottotitolo: "Una delle ragazze della Maison des Lunes"
    testo: "Giovane donna della Maison des Lunes, con i capelli rossi mossi e le lentiggini sul naso. È spiritosa e mette a proprio agio chi entra per la prima volta. Gira per il salone a seno nudo, passando le dita fra i capelli degli ospiti come per gioco, e molti clienti chiedono di lei per nome."
    requisiti: [jass < 2]

  - id: jass-fuori-dalla-maison
    nome: Jass
    tipo: personaggio
    sottotitolo: "Ex ragazza della Maison des Lunes"
    testo: "Giovane donna con i capelli rossi mossi e le lentiggini sul naso, che mette a proprio agio chiunque abbia davanti. Ha lavorato alla Maison des Lunes finché una notte non se n'è andata con una borsa e il mantello, prima dell'alba. Alla Maison il suo nome non lo pronuncia più nessuno, e i clienti che chiedevano di lei hanno smesso di chiedere."
    requisiti: [jass >= 2]

  - id: churl-braak
    nome: Churl Bra'aak
    alias: [Churl]
    tipo: personaggio
    sottotitolo: "Buttafuori principale della Maison des Lunes"
    testo: "Mezzorco che presidia la porta della Maison des Lunes come buttafuori principale. Parla a parole singole e grugniti, ed è leale a Nerissa Dalvane fino in fondo. Ricorda il volto di ogni cliente regolare, e quelli molesti di solito se ne vanno prima che si arrivi alle mani."
    requisiti: []

  - id: tachek
    nome: Tachek
    tipo: personaggio
    sottotitolo: "Buttafuori della Maison des Lunes"
    testo: "Uno dei buttafuori della Maison des Lunes. Veste un abito scuro per non dare nell'occhio e si muove nel salone con l'aria di un ospite tranquillo, una mazza imbottita alla cintura. Le ragazze leggono i suoi segnali a colpo d'occhio, due dita sulla cintura quando è allertato e il pugno chiuso lungo la coscia quando ha già deciso."
    requisiti: []

  - id: kanat
    nome: Kanat
    tipo: personaggio
    sottotitolo: "Buttafuori della Maison des Lunes"
    testo: "Buttafuori della Maison des Lunes, alto più di due metri e coperto di tatuaggi tribali. Tiene il torso nudo anche d'inverno e una mazza alla cintura. Fa rispettare le regole della casa in modo più rumoroso del collega Tachek, e qualche cliente abituale aspetta i suoi turni per il gusto di vederlo lavorare."
    requisiti: []

  # --- Pignatta Grassa e Scuri ---
  - id: mirko-vesh
    nome: Mirko Vesh
    alias: [Mirko, Vesh]
    tipo: personaggio
    sottotitolo: "Capo degli Scuri"
    testo: "Guida la banda degli Scuri di Qir-Azel e passa le serate alla Pignatta Grassa. È un olvaro magro dallo sguardo tagliente, con un anello a ogni dito, e secondo le voci quasi tutti vengono da clienti che non hanno pagato in tempo. Parla con un garbo sarcastico e tiene un profilo basso."
    requisiti: [pista.pelle < 6]

  - id: mirko-vesh-morto
    nome: Mirko Vesh
    alias: [Mirko, Vesh]
    tipo: personaggio
    sottotitolo: "Il capo degli Scuri, morto"
    testo: "Ha guidato per anni la banda degli Scuri di Qir-Azel, un olvaro magro dallo sguardo tagliente con un anello a ogni dito, quasi tutti tolti ai debitori. È morto nel cortile delle risse della Pignatta Grassa, per mano di Toren Galdrick, la notte in cui la taverna è bruciata. Senza di lui gli Scuri di città si sono sbandati."
    requisiti: [pista.pelle >= 6]

  - id: mauro-scrocco
    nome: Mauro Scrocco
    alias: [Mauro, Scrocco]
    tipo: personaggio
    sottotitolo: "Oste della Pignatta Grassa"
    testo: "Oste della Pignatta Grassa, in Città Bassa. Ha una pancia che entra nelle stanze prima di lui e veste colori sgargianti come lo zafferano. Abbraccia i clienti al primo incontro, e il suo alito arriva un momento prima delle braccia. Presta denaro e mette in contatto chi ne ha bisogno, e per molti è lui il volto degli Scuri."
    requisiti: [pista.pelle < 6]

  - id: mauro-scrocco-dopo-la-pignatta
    nome: Mauro Scrocco
    alias: [Mauro, Scrocco]
    tipo: personaggio
    sottotitolo: "L'oste della Pignatta Grassa"
    testo: "Era l'oste della Pignatta Grassa, in Città Bassa, con una pancia che entrava nelle stanze prima di lui e i colori dello zafferano addosso. Prestava denaro e metteva in contatto chi ne aveva bisogno, e per molti era il volto degli Scuri. La notte dell'assalto alla Pignatta le guardie l'hanno preso sullo spiazzo, prima che la taverna bruciasse. Adesso aspetta il processo nelle celle della Caserma."
    requisiti: [pista.pelle >= 6, mauro <= 1]

  - id: mauro-scrocco-morto
    nome: Mauro Scrocco
    alias: [Mauro, Scrocco]
    tipo: personaggio
    sottotitolo: "L'oste della Pignatta Grassa"
    testo: "Era l'oste della Pignatta Grassa, in Città Bassa, con una pancia che entrava nelle stanze prima di lui e i colori dello zafferano addosso. Prestava denaro e metteva in contatto chi ne aveva bisogno, e per molti era il volto degli Scuri. È morto la notte dell'assalto alla Pignatta, sullo spiazzo davanti alle porte chiuse della taverna, prima che la Pignatta bruciasse."
    requisiti: [pista.pelle >= 6, mauro == 2]

  - id: rozalia-marga
    nome: Rozalia Marga
    alias: [Rozalia]
    tipo: personaggio
    sottotitolo: "Falsaria degli Scuri"
    testo: "Falsaria degli Scuri, lavora nel retrobottega della Pignatta Grassa copiando firme e contratti, e si vanta di non essere mai stata smascherata. È una donna snella con i capelli scuri raccolti sulla nuca e una piuma d'oca dietro l'orecchio. Ha le dita macchiate d'inchiostro fino alla seconda falange e la lingua tagliente con chi pretende troppo."
    requisiti: [pista.pelle < 6]

  - id: rozalia-marga-dopo-la-pignatta
    nome: Rozalia Marga
    alias: [Rozalia]
    tipo: personaggio
    sottotitolo: "Falsaria degli Scuri"
    testo: "Falsaria degli Scuri. Copiava firme e contratti nel retrobottega della Pignatta Grassa, e si vanta di non essere mai stata smascherata. È una donna snella con i capelli scuri raccolti sulla nuca e una piuma d'oca dietro l'orecchio. La notte dell'assalto alla Pignatta è sparita in una nuvola di fumo, prima che le guardie riuscissero a toccarla."
    requisiti: [pista.pelle >= 6]

  - id: squiggor-ironfist
    nome: Squiggor Ironfist
    alias: [Squiggor]
    tipo: personaggio
    sottotitolo: "Picchiatore degli Scuri"
    testo: "Picchiatore di fiducia degli Scuri, massiccio, con l'occhio sinistro coperto da una benda nera consunta. Riscuote i prestiti scaduti e accompagna i capi quando serve una presenza fisica. Parla poco e con voce gutturale, e da ubriaco canticchia ritornelli olvari che non ricorda mai per intero."
    requisiti: [squiggor < 2]

  - id: squiggor-ironfist-morto
    nome: Squiggor Ironfist
    alias: [Squiggor]
    tipo: personaggio
    sottotitolo: "Picchiatore degli Scuri, morto"
    testo: "Era il picchiatore di fiducia degli Scuri, massiccio, con l'occhio sinistro coperto da una benda nera consunta. Riscuoteva i prestiti scaduti e accompagnava i capi quando serviva una presenza fisica. È morto in una rissa in Via dei Rasoi, al gomito della strada, sotto il vecchio cristallo spento."
    requisiti: [squiggor >= 2]

  - id: nihali-cuzan
    nome: Nihali Cuzan
    tipo: personaggio
    sottotitolo: "Baro della Pignatta Grassa"
    testo: "Mezzelfo alto e magro che organizza le partite di carte alla Pignatta Grassa. Fuma di continuo e sputa catarro nero senza vergognarsene. Porta vestiti di seconda mano sempre stirati e ha le mani curate al millimetro. Si dice che bari, con abbastanza giudizio da lasciar vincere qualcuno ogni tanto, così che le perdite degli altri sembrino sfortuna."
    requisiti: [pista.pelle < 6]

  - id: nihali-cuzan-dopo-la-pignatta
    nome: Nihali Cuzan
    tipo: personaggio
    sottotitolo: "Baro degli Scuri"
    testo: "Mezzelfo alto e magro che organizzava le partite di carte degli Scuri alla Pignatta Grassa. Fuma di continuo e ha le mani curate al millimetro, anche quando perde. Dalla notte in cui la Pignatta è bruciata nessuno l'ha più visto tenere banco in Città Bassa."
    requisiti: [pista.pelle >= 6]

  - id: gaia-acari
    nome: Gaia Acari
    alias: [Gaia, Acari]
    tipo: personaggio
    sottotitolo: "Ragazzina della Città Bassa"
    testo: "Ragazzina della Città Bassa con le lentiggini e un cappuccio blu scuro che le copre mezzo viso. Conosce ogni passaggio sotto i ponti e ha la lingua svelta. Passa le serate fra la Locanda di Ilka e il Grifone di Ferro, dove Brunella le porta il latte caldo senza farla pagare e lei ricambia imitando le voci degli avventori."
    requisiti: []

  - id: nestor-gramm
    nome: Nestor Gramm
    alias: [Nestor]
    tipo: personaggio
    sottotitolo: "Erborista della Dispensa di Gramm"
    testo: "Erborista e alchimista, tiene la Dispensa di Gramm. È basso e tozzo, con un grembiule grigio macchiato e uno straccio sempre nella tasca destra. Dal banco vende tisane e balsami, mentre nel retro prepara rimedi più cari, come una pasta nera che chiude le ferite in una notte. Diffida di tutti e non fa credito a nessuno."
    requisiti: [colpo.dispensa == 0, pista.pelle < 4]

  - id: nestor-gramm-in-fuga
    nome: Nestor Gramm
    alias: [Nestor]
    tipo: personaggio
    sottotitolo: "Erborista della Dispensa di Gramm"
    testo: "Erborista e alchimista, teneva la Dispensa di Gramm. È basso e tozzo, con un grembiule grigio macchiato e uno straccio sempre nella tasca destra. Nel retro, oltre alla pasta nera per le ferite, preparava i veleni degli Scuri. Da quando la Caserma gli ha messo gli occhi addosso al banco c'è un garzone, e lui non si fa più vedere."
    requisiti: [pista.pelle < 6]

  - id: nestor-gramm-in-catene
    nome: Nestor Gramm
    alias: [Nestor]
    tipo: personaggio
    sottotitolo: "L'erborista degli Scuri"
    testo: "Teneva la Dispensa di Gramm sul Mercato dei Nodi. È basso e tozzo, con un grembiule grigio macchiato. Nel retro preparava la pasta nera per le ferite e i veleni degli Scuri, e beveva le sue stesse pozioni. La notte dell'assalto alla Pignatta Grassa si è arreso alle guardie, e adesso sta in catene alla Caserma."
    requisiti: [pista.pelle >= 6]

  # --- Grifone di Ferro e Raschiatori ---
  - id: liaren-tarvelin
    nome: Liaren Tarvelin
    alias: [Liaren]
    tipo: personaggio
    sottotitolo: "Padrona della Locanda del Grifone di Ferro"
    testo: "Barda e locandiera, tiene la Locanda del Grifone di Ferro, che ha aperto dopo aver rotto con la sua famiglia. È figlia di Ondrel Tarvelin ed erede dell'Acciaieria. Dà del tu ai clienti prima ancora di sapere come si chiamano e suona il samisen quando ne ha voglia. Nella sua locanda i Raschiatori sono i benvenuti, gli schiavi no."
    requisiti: [pista.acciaio < 4]

  - id: liaren-tarvelin-erede
    nome: Liaren Tarvelin
    alias: [Liaren]
    tipo: personaggio
    sottotitolo: "Padrona della Locanda del Grifone di Ferro"
    testo: "Barda e locandiera, tiene la Locanda del Grifone di Ferro, che ha aperto dopo aver rotto con la sua famiglia. Dalla morte del padre, Ondrel Tarvelin, l'Acciaieria spetta a lei. Dà del tu ai clienti prima ancora di sapere come si chiamano e suona il samisen quando ne ha voglia. Nella sua locanda i Raschiatori sono i benvenuti, gli schiavi no."
    requisiti: [pista.acciaio >= 4]

  - id: brunella-fennick
    nome: Brunella Fennick
    alias: [Brunella]
    tipo: personaggio
    sottotitolo: "Cuoca del Grifone di Ferro"
    testo: "Anziana halfling che comanda la cucina della Locanda del Grifone di Ferro e ne è la vicedirettrice. Conosce Liaren Tarvelin da quando era bambina e l'ha seguita quando ha lasciato il Maniero. Porta i capelli bianchi raccolti in un nodo basso. Ha una memoria eccezionale per i volti, e agli abituali mette davanti il piatto giusto prima che lo chiedano."
    requisiti: []

  - id: dragna-gro-malog
    nome: Dragna Gro-Malog
    alias: [Dragna]
    tipo: personaggio
    sottotitolo: "Il Ferro dei Raschiatori"
    testo: "Mezzorca massiccia con la testa rasata ai lati, porta da nove anni il titolo di Ferro dei Raschiatori. Addestra le reclute in Caserma e decide chi scende nei tunnel. Compila i turni ogni sera al suo tavolo del Grifone di Ferro, davanti a un boccale che quasi mai finisce. Della mano sinistra le mancano l'indice e il medio."
    requisiti: []

  - id: mirn-il-sordo
    nome: Mirn il Sordo
    tipo: personaggio
    sottotitolo: "Raschiatore di un tempo"
    testo: "Raschiatore di cui i compagni parlano ancora. Anni fa cominciò a ripetere frasi in una lingua sconosciuta, e la Confraternita del Velo lo prese in custodia. Morì in una cella della Cattedrale. Fra i Raschiatori il suo nome torna fuori ogni volta che uno di loro, risalito dai tunnel, sente voci che non smettono."
    requisiti: []

  # --- Confraternita del Velo ---
  - id: madre-del-velo
    nome: Madre del Velo
    tipo: personaggio
    sottotitolo: "Guida della Confraternita del Velo"
    testo: "Guida della Confraternita del Velo, officia nella Cripta sotto l'altare della Cattedrale e nessuno dichiara di averla vista in volto. Appare in pubblico di rado, per i riti più solenni, avvolta in veli di seta nera e grigia che le scendono fino ai piedi. Chi l'ha sentita parlare ricorda una voce bassa, quasi priva di inflessioni."
    requisiti: []

  - id: padre-aurelio-vantes
    nome: Padre Aurelio Vantes
    alias: [Padre Vantes, Vantes]
    tipo: personaggio
    sottotitolo: "Sommo sacerdote della Cattedrale del Velo"
    testo: "Sommo sacerdote della Cattedrale del Velo, siede anche nel Consiglio di Qir-Azel. È il volto pubblico della Confraternita, quello che la folla applaude dopo i sermoni, e dirige di persona le cure dei feriti. Ha occhi grigio chiaro che pochi sostengono a lungo, e mentre parla posa sempre una mano sul braccio o sulla spalla di chi ha davanti."
    requisiti: []

  - id: ottilia-sanvel
    nome: Ottilia Sanvel
    alias: [Ottilia]
    tipo: personaggio
    sottotitolo: "Monaca responsabile della Confraternita del Velo"
    testo: "Monaca responsabile della Confraternita del Velo. È bassa e robusta, con i capelli corti e gli occhi grigio-verdi. Sovrintende alla disciplina interna e agli archivi minori della Cattedrale, e decide da sola quando un ricoverato può andarsene. All'alba fa esercitare i novizi nel corridoio. Parla con calma, in frasi brevi che non ammettono superlativi."
    requisiti: []

  - id: sorella-giulia
    nome: Sorella Giulia
    tipo: personaggio
    sottotitolo: "Chierica del Velo, cura i Giardini della Linfa"
    testo: "Chierica della Confraternita del Velo che cura i Giardini della Linfa. Porta i capelli biondo cenere tagliati corti per non impigliarsi nei rami, e ha le maniche macchiate di linfa. Si dice che parli la lingua degli uccelli, e quando cammina fra le aiuole con il palmo aperto i passeri le si posano sulla mano."
    requisiti: []

  - id: sorella-celia
    nome: Sorella Celia
    alias: [Celia]
    tipo: personaggio
    sottotitolo: "Chierica del Velo, suona il liuto"
    testo: "Chierica della Confraternita del Velo, nota per il liuto con cui accompagna le funzioni. Molti fedeli vengono a messa per lei più che per la preghiera. Ha i capelli castani raccolti sotto il velo e si concede un piccolo vezzo, come un nastro al polso, che Ottilia Sanvel le fa togliere. La sera, qualche volta, suona per i ricoverati."
    requisiti: []

  - id: nadja-oresca
    nome: Nadja Oresca
    alias: [Nadja]
    tipo: personaggio
    sottotitolo: "Accolita della Cattedrale del Velo"
    testo: "Accolita della Cattedrale del Velo da circa otto anni. È figlia della nota Madame Oresca, con cui non va d'accordo quasi su niente, a cominciare dai tre matrimoni che ha rifiutato. Porta vesti sempre spiegazzate e capelli raccolti senza cura. Quando vuole chiudere una conversazione cita un proverbio in lingua antica che nessuno capisce."
    requisiti: []

  - id: idrian-sollen
    nome: Idrian Sollen
    alias: [Sollen]
    tipo: personaggio
    sottotitolo: "Cappellano del vecchio Santuario"
    testo: "Cappellano del vecchio Santuario per quasi vent'anni, paziente con i fedeli e severo con gli accoliti, nelle vesti bianche del sommo sacerdozio. Sotto di lui la fede del Grande Albero Rosso visse una delle sue stagioni più popolari. Il suo nome resta legato all'incendio che distrusse il Santuario nel 145 D.C., e la carica è passata a Padre Aurelio Vantes."
    requisiti: []

  - id: gundo-marl
    nome: Gundo Marl
    alias: [Gundo]
    tipo: personaggio
    sottotitolo: "Becchino di Qir-Azel"
    testo: "Becchino di Qir-Azel da venticinque anni. Ha la schiena curva e cammina zoppicando. Tiene i registri funebri con una scrittura minuta e una precisione che pochi sacerdoti eguagliano, e conosce a memoria ogni lapide del cimitero. La notte della razzia è sparito dalla sua casetta, e da allora le fosse le scava il suo garzone."
    requisiti: [cimitero.lapide == 0]

  - id: gundo-marl-nascosto
    nome: Gundo Marl
    alias: [Gundo]
    tipo: personaggio
    sottotitolo: "Becchino di Qir-Azel"
    testo: "Becchino di Qir-Azel da venticinque anni, con la schiena curva e un passo zoppo. Tiene i registri funebri con una scrittura minuta e conosce a memoria ogni lapide del cimitero. Per la città è sparito la notte della razzia. In realtà è vivo, e di notte lavora nascosto nella cappella dei Vardesi."
    requisiti: [cimitero.lapide >= 1]

  # --- Castaldi e Consiglio ---
  - id: julia-castaldi
    nome: Julia Castaldi
    alias: [Julia]
    tipo: personaggio
    sottotitolo: "Rappresentante del Consiglio di Qir-Azel"
    testo: "Rappresentante eletta del Consiglio di Qir-Azel, di famiglia Castaldi. Porta i capelli tagliati corti sopra le orecchie e si presenta come una funzionaria più che come una nobile. Riceve in Municipio e mai a casa propria, e arriva alle sedute con le pratiche già lette. Il suo programma di licenze sul grano l'ha messa in rivalità aperta con Ottone Malgrani."
    requisiti: [pista.pelle < 7]

  - id: julia-castaldi-dopo-i-malgrani
    nome: Julia Castaldi
    alias: [Julia]
    tipo: personaggio
    sottotitolo: "Rappresentante del Consiglio di Qir-Azel"
    testo: "Rappresentante eletta del Consiglio di Qir-Azel, di famiglia Castaldi. Porta i capelli tagliati corti sopra le orecchie e si presenta come una funzionaria più che come una nobile. Riceve in Municipio e mai a casa propria. Dopo la condanna di Ottone Malgrani le sue licenze sul grano sono passate, e le cooperative hanno rilevato i mulini dei Malgrani."
    requisiti: [pista.pelle >= 7]

  - id: marella-castaldi
    nome: Marella Castaldi
    alias: [Marella]
    tipo: personaggio
    sottotitolo: "Padrona di casa al Maniero Castaldi"
    testo: "Cognata della Rappresentante Julia Castaldi, conduce la vita sociale del Maniero. Organizza le cene nei giorni di consiglio e decide chi viene invitato e dove siede. Veste con sobrietà raffinata e in pubblico parla con un'eleganza che fa sembrare caute anche le sue battute. A quella tavola, ripete agli ospiti, si parla di Stato e mai dei Castaldi."
    requisiti: []

  - id: quintus-vael
    nome: Quintus Vael
    alias: [Quintus]
    tipo: personaggio
    sottotitolo: "Comandante della guardia dei Castaldi"
    testo: "Comandante della guardia dei Castaldi, ex militare con i capelli grigi corti e una cicatrice sotto il mento lasciata da un orco vent'anni fa. Porta l'armatura di cuoio anche ai ricevimenti del Maniero. Quando la Rappresentante Julia Castaldi va in Municipio è lui a decidere il percorso e il numero della scorta."
    requisiti: []

  # --- Malgrani e Tarvelin ---
  - id: ottone-malgrani
    nome: Ottone Malgrani
    alias: [Ottone]
    tipo: personaggio
    sottotitolo: "Capofamiglia dei Malgrani"
    testo: "Capofamiglia dei Malgrani, siede in Consiglio per la Gilda e possiede gli unici mulini della regione. Porta i baffi biondi e i panciotti ricamati di una volta. Vorrebbe far chiudere la Maison des Lunes per decoro e comprare l'Acciaieria dei Tarvelin. I più anziani non hanno dimenticato l'assalto che suo padre Brandano tentò contro Qir-Azel quarant'anni fa."
    requisiti: [pista.pelle < 5]

  - id: ottone-malgrani-ricercato
    nome: Ottone Malgrani
    alias: [Ottone]
    tipo: personaggio
    sottotitolo: "Capofamiglia dei Malgrani"
    testo: "Capofamiglia dei Malgrani, siede in Consiglio per la Gilda e possiede gli unici mulini della regione. Porta i baffi biondi e i panciotti ricamati di una volta. Nei suoi registri ci sono nove anni di pagamenti agli Scuri, e il Consiglio ha firmato un mandato contro di lui. In Municipio, a porte chiuse, la Rappresentante dice che è finito."
    requisiti: [pista.pelle < 7]

  - id: ottone-malgrani-condannato
    nome: Ottone Malgrani
    alias: [Ottone]
    tipo: personaggio
    sottotitolo: "L'ultimo capofamiglia dei Malgrani"
    testo: "Era il capofamiglia dei Malgrani e sedeva in Consiglio per la Gilda, padrone degli unici mulini della regione, con i baffi biondi e i panciotti ricamati di una volta. Per i suoi conti con gli Scuri è stato condannato a morte dopo un processo breve. I suoi mulini e le sue segherie sono passati alle cooperative, e il Maniero è stato venduto."
    requisiti: [pista.pelle >= 7]

  - id: ondrel-tarvelin
    nome: Ondrel Tarvelin
    tipo: personaggio
    sottotitolo: "Padrone dell'Acciaieria"
    testo: "Patriarca dei Tarvelin e uomo più ricco di Qir-Azel. Dirige di persona l'Acciaieria, dove si raffina il lyssan dei Precursori, e nel consiglio della Gilda parla poco ma viene ascoltato. È pallido e cammina lento, in abiti scuri sempre uguali. Con la figlia Liaren non si parla da anni."
    requisiti: [pista.acciaio < 4]

  - id: ondrel-tarvelin-morto
    nome: Ondrel Tarvelin
    tipo: personaggio
    sottotitolo: "Il padrone dell'Acciaieria, morto"
    testo: "Era il patriarca dei Tarvelin e l'uomo più ricco di Qir-Azel. Dirigeva di persona l'Acciaieria, dove si raffina il lyssan dei Precursori, e nel consiglio della Gilda parlava poco ma veniva ascoltato. Pallido, in abiti scuri sempre uguali, con la figlia Liaren non si parlava da anni. È morto nella sala della fornace della sua Acciaieria."
    requisiti: [pista.acciaio >= 4]

  # --- Accademia e Locanda di Ilka ---
  - id: orvald-temmerin
    nome: Orvald Temmerin
    alias: [Orvald, Temmerin]
    tipo: personaggio
    sottotitolo: "Preside dell'Accademia di Torvessa"
    testo: "Preside dell'Accademia di Torvessa, ex avventuriero con trent'anni di scavi alle spalle. Ha accettato la carica in cambio del seminterrato, dove conserva le armi e i trofei mostruosi delle sue spedizioni. Dà lezioni private di magia fra pile di mappe e un teschio di cinghiale mutato, e di rado risponde due volte alla stessa domanda."
    requisiti: []

  - id: pett
    nome: Pett
    tipo: personaggio
    sottotitolo: "Il corvo di Orvald Temmerin"
    testo: "Corvo familiare di Orvald Temmerin, preside dell'Accademia di Torvessa. Di solito sta sulla spalla del padrone o su una trave dello studio, da dove segue le lezioni e interviene quando gli pare. Chi frequenta l'Accademia sa che partecipa davvero alle conversazioni, e che si zittisce di colpo quando Orvald perde la pazienza."
    requisiti: []

  - id: ilka-dravec
    nome: Ilka Dravec
    alias: [Ilka]
    tipo: personaggio
    sottotitolo: "Cantastorie della Locanda di Ilka"
    testo: "Matriarca dei Dravec. Quasi cieca, siede accanto al fuoco della sua locanda con gli occhi lattiginosi rivolti alla porta e racconta i miti antichi con voce roca, a cominciare dal falò dei primi carri. Conosce qualche parola della lingua dei Precursori, e molti avventori olvari vengono soltanto per sentirla. La locanda la gestisce la figlia Besk."
    requisiti: []

  - id: besk-dravec
    nome: Besk Dravec
    alias: [Besk]
    tipo: personaggio
    sottotitolo: "Figlia di Ilka, allieva di magia"
    testo: "Figlia minore di Ilka Dravec, manda avanti la Locanda di Ilka e serve al banco sidro e patate speziate. Studia magia con Orvald Temmerin all'Accademia di Torvessa, e la sera apre i suoi quaderni sul tavolo di cucina per chi vuole imparare. Con chi tratta la madre come una curiosità da fiera diventa scortese in fretta."
    requisiti: []

  # --- Botteghe e Gilda ---
  - id: bram-halgast
    nome: Bram Halgast
    alias: [Bram]
    tipo: personaggio
    sottotitolo: "Fabbro della Fucina dei Due Mastini"
    testo: "Fabbro della Fucina dei Due Mastini. Lavora a torso nudo con due grossi mastini rossi sdraiati vicino all'incudine, e firma ogni pezzo con un martello di pietra inciso. È volgare e beve fino a tardi, ma la città lo sopporta perché le sue armi sono le migliori di Qir-Azel. Irsa Valbrun rifinisce i suoi pezzi grezzi."
    requisiti: []

  - id: irsa-valbrun
    nome: Irsa Valbrun
    alias: [Irsa]
    tipo: personaggio
    sottotitolo: "Fabbra dell'Armeria di Irsa"
    testo: "Fabbra e titolare dell'Armeria di Irsa, unica donna nel consiglio interno della Gilda dei Mercanti. Non ha una forgia e rifinisce i pezzi grezzi che le fornisce Bram Halgast. Ha una cicatrice obliqua sulla guancia destra e porta il grembiule da bottega anche alla Casa dei Nodi. Quando valuta un cliente gli guarda prima le mani, poi gli occhi."
    requisiti: []

  - id: ambrin-qell
    nome: Ambrin Qell
    alias: [Ambrin]
    tipo: personaggio
    sottotitolo: "Mercante del Nodo d'Ossidiana"
    testo: "Mercante di oggetti magici, tiene Il Nodo d'Ossidiana al Mercato dei Nodi. Ha lunghi capelli rossi e occhi azzurri, e i clienti non riescono mai a stabilire quanti anni abbia. Conosce la storia di ogni pezzo in bottega e scrive pergamene magiche su commissione. Dal bancone lo osserva un corvo familiare che in pubblico non parla."
    requisiti: []

  - id: varn-kett
    nome: Varn Kett
    alias: [Varn]
    tipo: personaggio
    sottotitolo: "Ispettore dei dazi della Gilda"
    testo: "Ispettore dei dazi della Gilda dopo vent'anni nella milizia di Qir-Azel, e sui Ponti Sospesi lo conoscono tutti. Porta un cappotto color tabacco e gli stivali da pioggia anche col sole. Quando sente una cosa che vale la pena tenere muove le dita come se scrivesse su una pergamena invisibile, e si dice che non abbia mai sbagliato una riga."
    requisiti: []

  - id: corin-ashdale
    nome: Corin Ashdale
    tipo: personaggio
    sottotitolo: "Mercante della Gilda"
    testo: "Mercante della Gilda, lo si incontra alla Casa dei Nodi o, più spesso, al Grifone di Ferro, dove paga da bere a chiunque. Veste panciotti ricamati e tiene un fazzoletto al taschino. Presta piccole somme senza contare il rientro, e in città tutti sanno quanto desideri farsi degli amici veri. È la migliore fonte di pettegolezzi di Qir-Azel."
    requisiti: [pista.corin < 6]

  - id: corin-ashdale-a-laresh
    nome: Corin Ashdale
    tipo: personaggio
    sottotitolo: "Mercante della Gilda, in viaggio"
    testo: "Mercante della Gilda, di solito lo si incontra alla Casa dei Nodi o al Grifone di Ferro, dove paga da bere a chiunque. Veste panciotti ricamati e tiene un fazzoletto al taschino. È partito per Laresh all'alba, con una carovana di sale diretta al Ponte del Conciatore, e ha promesso di tornare prima dell'inverno o subito dopo."
    requisiti: [pista.corin >= 6, pista.arena == 0]

  - id: corin-ashdale-tornato
    nome: Corin Ashdale
    tipo: personaggio
    sottotitolo: "Mercante della Gilda"
    testo: "Mercante della Gilda, lo si incontra alla Casa dei Nodi o, più spesso, al Grifone di Ferro, dove paga da bere a chiunque. Veste panciotti ricamati e tiene un fazzoletto al taschino. Era partito per Laresh con una carovana di sale, e quando ha sentito che l'Arena riapriva ha lasciato la carovana a metà strada ed è tornato indietro."
    requisiti: [pista.corin >= 6, pista.arena >= 1]

  - id: orazio-belcanto
    nome: Orazio Belcanto
    alias: [Orazio]
    tipo: personaggio
    sottotitolo: "Impresario del Teatro delle Meraviglie"
    testo: "Proprietario e primo attore del Teatro delle Meraviglie. Veste abiti vistosi cuciti su misura, porta un anello a ogni dito e parla un tono sopra la sua voce naturale. Recluta di continuo nuovi bardi e passa le sere nelle taverne a caccia di storie. Con Liaren Tarvelin ha una vecchia rivalità di palco di cui nessuno dei due ricorda l'origine."
    requisiti: []

  - id: grusk
    nome: Grusk
    tipo: personaggio
    sottotitolo: "Spazzino di Qir-Azel"
    testo: "Mezzorco, uno degli spazzini ufficiali di Qir-Azel, lavora soprattutto sulla spiaggia dell'Orlo dei Rottami, dove finiscono gli scarti dei Raschiatori. È tatuato dalla testa ai piedi e spinge una carriola rossa sgargiante che la gente riconosce da lontano, di solito per cambiare strada. Beve molto e finisce spesso nei guai con la legge."
    requisiti: []

  # --- Sottoponti ---
  - id: mamma-tesh
    nome: Mamma Tesh
    alias: [Tesh]
    tipo: personaggio
    sottotitolo: "Il braciere dei sottoponti"
    testo: "Donna piccola dalle mani annerite, vive sotto le travi del Ponte delle Mille Corde da più tempo di chiunque altro. Sulla piattaforma più larga dei sottoponti tiene acceso un braciere ricavato da un elmo rovesciato, che chiama il Capitano e rimprovera quando fa troppo fumo. Intorno al suo fuoco ognuno paga il posto con una storia o con un favore."
    requisiti: []

  # --- La razzia ---
