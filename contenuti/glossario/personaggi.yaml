# Glossario: i personaggi con un nome proprio che compaiono nei testi del gioco.
# Quello che ne sa un abitante informato di Qir-Azel nei giorni dopo la razzia del Festival.
# I cognomi di famiglia condivisi (Castaldi, Malgrani, Tarvelin, Dravec) non sono forme di queste voci.
glossario:
  # --- Segheria ---
  - id: rennick-dole
    nome: Rennick Dole
    alias: [Rennick, Dole]
    tipo: personaggio
    sottotitolo: "Responsabile della Segheria"
    testo: "Giovane responsabile della Segheria di Qir-Azel, che manda avanti insieme al socio Marko Thessel sotto la concessione dei Malgrani. Tiene i registri e le lame, contratta su ogni quattrino e in osteria non offre mai da bere. In città lo ricordano come il bullo della scuola, e alla Segheria dicono che parli l'orchesco meglio di chiunque altro."
    requisiti: []

  - id: marko-thessel
    nome: Marko Thessel
    alias: [Marko, Thessel]
    tipo: personaggio
    sottotitolo: "Socio di Rennick Dole alla Segheria"
    testo: "Cofondatore della Segheria di Qir-Azel e socio alla pari di Rennick Dole. Sa leggere una venatura meglio di qualunque artigiano della città, e tratta di persona con i mercanti di Laresh che salgono due volte l'anno. Cambia la camicia di lino chiaro a fine turno. Ai clienti sorride sempre, mentre dei sottoposti non ricorda mai il nome."
    requisiti: []

  # --- Caserma ---
  - id: toren-galdrick
    nome: Toren Galdrick
    alias: [Galdrick]
    tipo: personaggio
    sottotitolo: "Sceriffo di Qir-Azel"
    testo: "Sceriffo di Qir-Azel e membro del Consiglio, un uomo imponente con la pelle scura e la testa rasata. Per la città è quello che fermò il Cucitore durante le Notti Cucite. Considera gli Scuri il problema più urgente e sconsiglia apertamente la Pignatta Grassa ai forestieri. Dopo la razzia è partito per Ghoran a cercare mercenari."
    requisiti: []

  - id: borso
    nome: Borso
    tipo: personaggio
    sottotitolo: "Carceriere della Caserma"
    testo: "Carceriere della Caserma di Qir-Azel, un uomo massiccio con il naso rotto più volte. Porta alla cintura una clava corta, che usa soprattutto per battere sulle porte delle celle, e alza la voce di rado. Della condotta di ogni detenuto prende nota in un registro, con una matita che nella sua mano sembra minuscola."
    requisiti: []

  - id: karn
    nome: Karn
    tipo: personaggio
    sottotitolo: "Tagliagole degli Scuri, detenuto in Caserma"
    testo: "Tagliagole degli Scuri, preso sui tetti di Via dei Rasoi e rinchiuso nella cella in fondo al corridoio della Caserma. Ogni sera fischia sempre la stessa canzone, finché il carceriere Borso non viene a battere la clava contro la sua porta."
    requisiti: []

  # --- Maison des Lunes ---
  - id: nerissa-dalvane
    nome: Nerissa Dalvane
    alias: [Nerissa, Dalvane]
    tipo: personaggio
    sottotitolo: "Padrona della Maison des Lunes"
    testo: "Dirige la Maison des Lunes, all'angolo fra Via del Salmone e Via dei Rasoi, e non alza mai la voce. Veste abiti scuri di buona fattura e porta un piccolo medaglione sotto la stoffa. Nella sua casa decidono le ragazze, anche quando la regola le costa un cliente. Che lo sceriffo Galdrick le sia molto vicino, in città, è un segreto di Pulcinella."
    requisiti: []

  - id: sara-beck
    nome: Sara Beck
    alias: [Sara, Beck]
    tipo: personaggio
    sottotitolo: "All'ingresso della Maison des Lunes"
    testo: "Halfling allegra e cordiale che siede al bancone d'ingresso della Maison des Lunes. Spiega ai visitatori le regole della casa, poi ritira le armi e le chiude a chiave in un armadio fino all'uscita. Chiama per nome ogni cliente abituale, anche chi preferirebbe restare anonimo, e di chi ha violato le regole si ricorda per anni."
    requisiti: []

  - id: gretchen
    nome: Gretchen
    tipo: personaggio
    sottotitolo: "La più anziana delle ragazze della Maison"
    testo: "La più anziana delle ragazze della Maison des Lunes. È sempre truccata con cura e ha una risata profonda e musicale. È amica di lunga data di Nerissa Dalvane e manda avanti la casa quando la padrona è altrove. Del perché abbia lasciato Ghoran dice soltanto che in viaggio si è liberi di reinventarsi."
    requisiti: []

  - id: jass
    nome: Jass
    tipo: personaggio
    sottotitolo: "Una delle ragazze della Maison des Lunes"
    testo: "Giovane donna della Maison des Lunes, con i capelli rossi mossi e le lentiggini sul naso. È spiritosa e mette a proprio agio chi entra per la prima volta. Gira per il salone a seno nudo, passando le dita fra i capelli degli ospiti come per gioco, e molti clienti chiedono di lei per nome."
    requisiti: []

  - id: churl-braak
    nome: Churl Bra'aak
    alias: [Churl]
    tipo: personaggio
    sottotitolo: "Buttafuori principale della Maison des Lunes"
    testo: "Mezzorco che presidia la porta della Maison des Lunes come buttafuori principale. Parla a parole singole e grugniti, ed è leale a Nerissa Dalvane fino in fondo. Ricorda il volto di ogni cliente regolare, e quelli molesti di solito se ne vanno prima che si arrivi alle mani."
    requisiti: []

  - id: tachek
    nome: Tachek
    tipo: personaggio
    sottotitolo: "Buttafuori della Maison des Lunes"
    testo: "Uno dei buttafuori della Maison des Lunes. Veste un abito scuro per non dare nell'occhio e si muove nel salone con l'aria di un ospite tranquillo, una mazza imbottita alla cintura. Le ragazze leggono i suoi segnali a colpo d'occhio, due dita sulla cintura quando è allertato e il pugno chiuso lungo la coscia quando ha già deciso."
    requisiti: []

  - id: kanat
    nome: Kanat
    tipo: personaggio
    sottotitolo: "Buttafuori della Maison des Lunes"
    testo: "Buttafuori della Maison des Lunes, alto più di due metri e coperto di tatuaggi tribali. Tiene il torso nudo anche d'inverno e una mazza alla cintura. Fa rispettare le regole della casa in modo più rumoroso del collega Tachek, e qualche cliente abituale aspetta i suoi turni per il gusto di vederlo lavorare."
    requisiti: []

  # --- Pignatta Grassa e Scuri ---
  - id: mirko-vesh
    nome: Mirko Vesh
    alias: [Mirko, Vesh]
    tipo: personaggio
    sottotitolo: "Capo degli Scuri"
    testo: "Passa per il capo della banda degli Scuri di Qir-Azel, anche se in Città Bassa molti danno quel posto all'oste Mauro Scrocco. È un olvaro magro dallo sguardo tagliente, con un anello a ogni dito, e secondo le voci quasi tutti vengono da clienti che non hanno pagato in tempo. Tiene un profilo basso, e lo sceriffo Galdrick lavora su di lui da anni."
    requisiti: []

  - id: mauro-scrocco
    nome: Mauro Scrocco
    alias: [Mauro, Scrocco]
    tipo: personaggio
    sottotitolo: "Oste della Pignatta Grassa"
    testo: "Oste della Pignatta Grassa, in Città Bassa. Ha una pancia che entra nelle stanze prima di lui e veste colori sgargianti come lo zafferano. Abbraccia i clienti al primo incontro, e il suo alito arriva un momento prima delle braccia. Presta denaro e mette in contatto chi ne ha bisogno, e per molti in città è lui il volto degli Scuri."
    requisiti: []

  - id: rozalia-marga
    nome: Rozalia Marga
    alias: [Rozalia]
    tipo: personaggio
    sottotitolo: "Falsaria degli Scuri"
    testo: "Donna snella con i capelli scuri raccolti sulla nuca e una piuma d'oca sempre dietro l'orecchio. Lavora per gli Scuri copiando firme e contratti, e si vanta di non essere mai stata smascherata. Ha le dita macchiate d'inchiostro fino alla seconda falange e una lingua tagliente con chi le chiede troppo per poche monete."
    requisiti: []

  - id: squiggor-ironfist
    nome: Squiggor Ironfist
    alias: [Squiggor]
    tipo: personaggio
    sottotitolo: "Picchiatore degli Scuri"
    testo: "Picchiatore di fiducia degli Scuri, massiccio, con l'occhio sinistro coperto da una benda nera consunta. Riscuote i prestiti scaduti e accompagna i capi quando serve una presenza fisica. Parla poco e con voce gutturale. Quando le mani non gli servono le tiene in tasca, e da ubriaco canticchia ritornelli olvari che non ricorda mai per intero."
    requisiti: []

  - id: nihali-cuzan
    nome: Nihali Cuzan
    tipo: personaggio
    sottotitolo: "Baro della Pignatta Grassa"
    testo: "Mezzelfo alto e magro che organizza le partite di carte alla Pignatta Grassa. Fuma di continuo e sputa catarro nero senza vergognarsene. Porta vestiti di seconda mano sempre stirati e ha le mani curate al millimetro. Si dice che bari, con abbastanza giudizio da lasciar vincere qualcuno ogni tanto, così che le perdite degli altri sembrino sfortuna."
    requisiti: []

  - id: gaia-acari
    nome: Gaia Acari
    alias: [Gaia, Acari]
    tipo: personaggio
    sottotitolo: "Ragazzina della Città Bassa"
    testo: "Ragazzina della Città Bassa con le lentiggini e un cappuccio blu scuro che le copre mezzo viso. Secondo Liaren Tarvelin corre fra i tavoli della Pignatta Grassa per conto di gente con cui è meglio non avere debiti. Al Grifone di Ferro Brunella le porta il latte caldo senza farla pagare, e lei ricambia imitando le voci degli avventori."
    requisiti: []

  - id: nestor-gramm
    nome: Nestor Gramm
    alias: [Nestor]
    tipo: personaggio
    sottotitolo: "Erborista della Dispensa di Gramm"
    testo: "Erborista e alchimista, tiene la Dispensa di Gramm. È basso e tozzo, con un grembiule grigio macchiato e uno straccio sempre nella tasca destra. Dal banco vende tisane e balsami, mentre nel retro prepara rimedi più cari, come una pasta nera che chiude le ferite in una notte. Diffida di tutti e non fa credito a nessuno."
    requisiti: []

  # --- Grifone di Ferro e Raschiatori ---
  - id: liaren-tarvelin
    nome: Liaren Tarvelin
    alias: [Liaren]
    tipo: personaggio
    sottotitolo: "Padrona della Locanda del Grifone di Ferro"
    testo: "Barda e locandiera, ha aperto il Grifone di Ferro dopo aver rotto con la sua famiglia, e suona il samisen quando ne ha voglia. È figlia di Ondrel Tarvelin ed erede dell'Acciaieria. Nella sua locanda i Raschiatori sono i benvenuti, gli schiavi no. La mattina del Festival ha rovesciato un pentolone di stufato in testa al padre davanti alla sala piena."
    requisiti: []

  - id: brunella-fennick
    nome: Brunella Fennick
    alias: [Brunella]
    tipo: personaggio
    sottotitolo: "Cuoca del Grifone di Ferro"
    testo: "Anziana halfling che comanda la cucina della Locanda del Grifone di Ferro e ne è la vicedirettrice. Conosce Liaren Tarvelin da quando era bambina e l'ha seguita quando ha lasciato il Maniero. Porta i capelli bianchi raccolti in un nodo basso. Ha una memoria eccezionale per i volti, e agli abituali mette davanti il piatto giusto prima che lo chiedano."
    requisiti: []

  - id: dragna-gro-malog
    nome: Dragna Gro-Malog
    alias: [Dragna]
    tipo: personaggio
    sottotitolo: "Il Ferro dei Raschiatori"
    testo: "Mezzorca massiccia con la testa rasata ai lati, porta da nove anni il titolo di Ferro dei Raschiatori. Addestra le reclute in Caserma e decide chi scende nei tunnel. Compila i turni ogni sera al suo tavolo del Grifone di Ferro, davanti a un boccale che quasi mai finisce. Della mano sinistra le mancano l'indice e il medio."
    requisiti: []

  - id: mirn-il-sordo
    nome: Mirn il Sordo
    tipo: personaggio
    sottotitolo: "Raschiatore di un tempo"
    testo: "Raschiatore di cui i compagni parlano ancora. Anni fa cominciò a ripetere frasi in una lingua sconosciuta, e la Confraternita del Velo lo prese in custodia. Morì in una cella della Cattedrale. Fra i Raschiatori il suo nome torna fuori ogni volta che uno di loro, risalito dai tunnel, sente voci che non smettono."
    requisiti: []

  # --- Confraternita del Velo ---
  - id: madre-del-velo
    nome: Madre del Velo
    tipo: personaggio
    sottotitolo: "Guida della Confraternita del Velo"
    testo: "Guida della Confraternita del Velo, officia nella Cripta sotto l'altare della Cattedrale e nessuno dichiara di averla vista in volto. Appare in pubblico di rado, per i riti più solenni, avvolta in veli di seta nera e grigia che le scendono fino ai piedi. Chi l'ha sentita parlare ricorda una voce bassa, quasi priva di inflessioni."
    requisiti: []

  - id: padre-aurelio-vantes
    nome: Padre Aurelio Vantes
    alias: [Padre Vantes, Vantes]
    tipo: personaggio
    sottotitolo: "Sommo sacerdote della Cattedrale del Velo"
    testo: "Sommo sacerdote della Cattedrale del Velo, siede anche nel Consiglio di Qir-Azel. È il volto pubblico della Confraternita e dirige le cure dei feriti. Mentre parla posa sempre una mano sul braccio o sulla spalla di chi ha davanti. Il giorno del Festival ha liberato le farfalle foglia-rossa a mezzogiorno, e dopo la razzia ha curato i feriti fino a notte."
    requisiti: []

  - id: ottilia-sanvel
    nome: Ottilia Sanvel
    alias: [Ottilia]
    tipo: personaggio
    sottotitolo: "Monaca responsabile della Confraternita del Velo"
    testo: "Monaca responsabile della Confraternita del Velo. È bassa e robusta, con i capelli corti e gli occhi grigio-verdi. Sovrintende alla disciplina interna e agli archivi minori della Cattedrale, e decide da sola quando un ricoverato può andarsene. All'alba fa esercitare i novizi nel corridoio. Parla con calma, in frasi brevi che non ammettono superlativi."
    requisiti: []

  - id: sorella-giulia
    nome: Sorella Giulia
    tipo: personaggio
    sottotitolo: "Chierica del Velo, cura i Giardini della Linfa"
    testo: "Chierica della Confraternita del Velo che cura i Giardini della Linfa. Porta i capelli biondo cenere tagliati corti per non impigliarsi nei rami, e ha le maniche macchiate di linfa. Si dice che parli la lingua degli uccelli, e quando cammina fra le aiuole con il palmo aperto i passeri le si posano sulla mano."
    requisiti: []

  - id: sorella-celia
    nome: Sorella Celia
    alias: [Celia]
    tipo: personaggio
    sottotitolo: "Chierica del Velo, suona il liuto"
    testo: "Chierica della Confraternita del Velo, nota in città per il liuto con cui accompagna le funzioni. Molti fedeli vengono a messa per lei più che per la preghiera. Ha i capelli castani raccolti sotto il velo e si concede sempre un piccolo vezzo, come un nastro al polso, che Ottilia Sanvel le fa togliere. La sera, qualche volta, suona per i ricoverati."
    requisiti: []

  - id: nadja-oresca
    nome: Nadja Oresca
    alias: [Nadja]
    tipo: personaggio
    sottotitolo: "Accolita della Cattedrale del Velo"
    testo: "Accolita della Cattedrale del Velo da circa otto anni. È figlia della nota Madame Oresca, con cui non va d'accordo quasi su niente, a cominciare dai tre matrimoni che ha rifiutato. Porta vesti sempre spiegazzate e capelli raccolti senza cura. Quando vuole chiudere una conversazione cita un proverbio in lingua antica che nessuno capisce."
    requisiti: []

  - id: idrian-sollen
    nome: Idrian Sollen
    alias: [Sollen]
    tipo: personaggio
    sottotitolo: "Cappellano del vecchio Santuario"
    testo: "Cappellano del vecchio Santuario di Qir-Azel per quasi vent'anni, paziente con i fedeli e severo con gli accoliti. Morì nell'incendio del Santuario nel 145 D.C., un incendio la cui causa non è mai stata chiarita, e le sue ceneri furono sigillate in una cripta del cimitero. Padre Vantes, suo successore, vi celebra ogni anno una messa privata."
    requisiti: []

  - id: gundo-marl
    nome: Gundo Marl
    alias: [Gundo]
    tipo: personaggio
    sottotitolo: "Becchino di Qir-Azel"
    testo: "Becchino di Qir-Azel da venticinque anni. Ha la schiena curva e cammina zoppicando. Tiene i registri funebri con una scrittura minuta e una precisione che pochi sacerdoti eguagliano, e conosce a memoria ogni lapide del cimitero. Al collo porta un amuleto dell'Albero Rosso che non si toglie nemmeno per dormire."
    requisiti: []

  # --- Castaldi e Consiglio ---
  - id: julia-castaldi
    nome: Julia Castaldi
    alias: [Julia]
    tipo: personaggio
    sottotitolo: "Rappresentante del Consiglio di Qir-Azel"
    testo: "Rappresentante eletta del Consiglio di Qir-Azel, di famiglia Castaldi. Porta i capelli tagliati corti sopra le orecchie e si presenta come una funzionaria più che come una nobile. Riceve in Municipio e mai a casa propria, e arriva alle sedute con le pratiche già lette. Il suo programma di licenze sul grano l'ha messa in rivalità aperta con Ottone Malgrani."
    requisiti: []

  - id: marella-castaldi
    nome: Marella Castaldi
    alias: [Marella]
    tipo: personaggio
    sottotitolo: "Padrona di casa al Maniero Castaldi"
    testo: "Cognata della Rappresentante Julia Castaldi, conduce la vita sociale del Maniero. Organizza le cene nei giorni di consiglio e decide chi viene invitato e dove siede. Veste con sobrietà raffinata e in pubblico parla con un'eleganza che fa sembrare caute anche le sue battute. A quella tavola, ripete agli ospiti, si parla di Stato e mai dei Castaldi."
    requisiti: []

  - id: quintus-vael
    nome: Quintus Vael
    alias: [Quintus]
    tipo: personaggio
    sottotitolo: "Comandante della guardia dei Castaldi"
    testo: "Comandante della guardia dei Castaldi, ex militare con i capelli grigi corti e una cicatrice sotto il mento lasciata da un orco vent'anni fa. Porta l'armatura di cuoio anche ai ricevimenti del Maniero. Quando la Rappresentante Julia Castaldi va in Municipio è lui a decidere il percorso e il numero della scorta."
    requisiti: []

  # --- Malgrani e Tarvelin ---
  - id: ottone-malgrani
    nome: Ottone Malgrani
    alias: [Ottone]
    tipo: personaggio
    sottotitolo: "Capofamiglia dei Malgrani"
    testo: "Capofamiglia dei Malgrani, siede in Consiglio per la Gilda e possiede gli unici mulini della regione. Porta i baffi biondi e i panciotti ricamati di una volta. Vorrebbe far chiudere la Maison des Lunes per decoro e comprare l'Acciaieria dei Tarvelin. I più anziani non hanno dimenticato l'assalto che suo padre Brandano tentò contro Qir-Azel quarant'anni fa."
    requisiti: []

  - id: ondrel-tarvelin
    nome: Ondrel Tarvelin
    tipo: personaggio
    sottotitolo: "Padrone dell'Acciaieria"
    testo: "Patriarca dei Tarvelin e uomo più ricco di Qir-Azel. Dirige di persona l'Acciaieria, dove si raffina il lyssan dei Precursori, e nel consiglio della Gilda parla poco ma viene ascoltato. Veste abiti scuri sempre uguali. Con la figlia Liaren ha chiuso da anni, e la mattina del Festival lo si è visto uscire dal Grifone di Ferro coperto di stufato."
    requisiti: []

  # --- Accademia e Locanda di Ilka ---
  - id: orvald-temmerin
    nome: Orvald Temmerin
    alias: [Orvald, Temmerin]
    tipo: personaggio
    sottotitolo: "Preside dell'Accademia di Torvessa"
    testo: "Preside dell'Accademia di Torvessa, ex avventuriero con trent'anni di scavi alle spalle. Ha accettato la carica in cambio del seminterrato, dove conserva le armi e i trofei mostruosi delle sue spedizioni. Dà lezioni private di magia fra pile di mappe e un teschio di cinghiale mutato, e di rado risponde due volte alla stessa domanda."
    requisiti: []

  - id: pett
    nome: Pett
    tipo: personaggio
    sottotitolo: "Il corvo di Orvald Temmerin"
    testo: "Corvo familiare di Orvald Temmerin, preside dell'Accademia di Torvessa. Di solito sta sulla spalla del padrone o su una trave dello studio, da dove segue le lezioni e interviene quando gli pare. Chi frequenta l'Accademia sa che partecipa davvero alle conversazioni, e che si zittisce di colpo quando Orvald perde la pazienza."
    requisiti: []

  - id: ilka-dravec
    nome: Ilka Dravec
    alias: [Ilka]
    tipo: personaggio
    sottotitolo: "Cantastorie della Locanda di Ilka"
    testo: "Matriarca dei Dravec. Quasi cieca, siede accanto al fuoco della sua locanda con gli occhi lattiginosi rivolti alla porta e racconta i miti antichi con voce roca, a cominciare dal falò dei primi carri. Conosce qualche parola della lingua dei Precursori, e molti avventori olvari vengono soltanto per sentirla. La locanda la gestisce la figlia Besk."
    requisiti: []

  - id: besk-dravec
    nome: Besk Dravec
    alias: [Besk]
    tipo: personaggio
    sottotitolo: "Figlia di Ilka, allieva di magia"
    testo: "Figlia minore di Ilka Dravec, manda avanti la Locanda di Ilka e serve al banco sidro e patate speziate. Studia magia con Orvald Temmerin all'Accademia di Torvessa, e la sera apre i suoi quaderni sul tavolo di cucina per chi vuole imparare. Con chi tratta la madre come una curiosità da fiera diventa scortese in fretta."
    requisiti: []

  # --- Botteghe e Gilda ---
  - id: bram-halgast
    nome: Bram Halgast
    alias: [Bram]
    tipo: personaggio
    sottotitolo: "Fabbro della Fucina dei Due Mastini"
    testo: "Fabbro della Fucina dei Due Mastini. Lavora a torso nudo con due grossi mastini rossi sdraiati vicino all'incudine, e firma ogni pezzo con un martello di pietra inciso. È volgare e beve fino a tardi, ma la città lo sopporta perché le sue armi sono le migliori di Qir-Azel. Irsa Valbrun rifinisce i suoi pezzi grezzi."
    requisiti: []

  - id: irsa-valbrun
    nome: Irsa Valbrun
    alias: [Irsa]
    tipo: personaggio
    sottotitolo: "Fabbra dell'Armeria di Irsa"
    testo: "Fabbra e titolare dell'Armeria di Irsa, unica donna nel consiglio interno della Gilda dei Mercanti. Non ha una forgia e rifinisce i pezzi grezzi che le fornisce Bram Halgast. Ha una cicatrice obliqua sulla guancia destra e porta il grembiule da bottega anche alla Casa dei Nodi. Quando valuta un cliente gli guarda prima le mani, poi gli occhi."
    requisiti: []

  - id: ambrin-qell
    nome: Ambrin Qell
    alias: [Ambrin]
    tipo: personaggio
    sottotitolo: "Mercante del Nodo d'Ossidiana"
    testo: "Mercante di oggetti magici, tiene Il Nodo d'Ossidiana al Mercato dei Nodi. Ha lunghi capelli rossi e occhi azzurri, e i clienti non riescono mai a stabilire quanti anni abbia. Conosce la storia di ogni pezzo in bottega e scrive pergamene magiche su commissione. Dal bancone lo osserva un corvo familiare che in pubblico non parla."
    requisiti: []

  - id: varn-kett
    nome: Varn Kett
    alias: [Varn]
    tipo: personaggio
    sottotitolo: "Ispettore dei dazi della Gilda"
    testo: "Ispettore dei dazi della Gilda dei Mercanti, dopo vent'anni nella milizia di Qir-Azel. È alto e porta un cappotto color tabacco, con gli stivali da pioggia anche quando c'è il sole. Quando sente una cosa che vale la pena tenere muove le dita come se scrivesse su una pergamena invisibile, e fra i riscossori si dice che non abbia mai sbagliato una riga."
    requisiti: []

  - id: corin-ashdale
    nome: Corin Ashdale
    tipo: personaggio
    sottotitolo: "Mercante della Gilda"
    testo: "Mercante della Gilda dei Mercanti che veste panciotti ricamati e tiene un fazzoletto al taschino. Offre da bere a chiunque, presta piccole somme senza contare il rientro, e che cerchi disperatamente amici veri è il segreto peggio custodito della Gilda. Durante la razzia del Festival un capoguerra orco lo ha aggredito vicino alla Locanda del Daino Zoppo."
    requisiti: []

  - id: orazio-belcanto
    nome: Orazio Belcanto
    alias: [Orazio]
    tipo: personaggio
    sottotitolo: "Impresario del Teatro delle Meraviglie"
    testo: "Proprietario e primo attore del Teatro delle Meraviglie. Veste abiti vistosi cuciti su misura, porta un anello a ogni dito e parla un tono sopra la sua voce naturale. Recluta di continuo nuovi bardi e passa le sere nelle taverne a caccia di storie. Con Liaren Tarvelin ha una vecchia rivalità di palco di cui nessuno dei due ricorda l'origine."
    requisiti: []

  - id: grusk
    nome: Grusk
    tipo: personaggio
    sottotitolo: "Spazzino di Qir-Azel"
    testo: "Mezzorco, uno degli spazzini ufficiali di Qir-Azel, lavora soprattutto sulla spiaggia dell'Orlo dei Rottami, dove finiscono gli scarti dei Raschiatori. È tatuato dalla testa ai piedi e spinge una carriola rossa sgargiante che la gente riconosce da lontano, di solito per cambiare strada. Beve molto e finisce spesso nei guai con la legge."
    requisiti: []

