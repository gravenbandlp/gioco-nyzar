  - id: mamma-tesh
    nome: Mamma Tesh
    alias: [Tesh]
    tipo: personaggio
    sottotitolo: "Il braciere dei sottoponti"
    testo: "Donna piccola dalle mani annerite, vive sotto le travi del Ponte delle Mille Corde da più tempo di chiunque altro. Sulla piattaforma più larga dei sottoponti tiene acceso un braciere ricavato da un vecchio elmo rovesciato, che chiama il Capitano e rimprovera quando fa troppo fumo. Intorno al suo fuoco ognuno paga il posto con una storia o con un favore."
