# Glossario: i personaggi con un nome proprio che compaiono nei testi del gioco.
# Presentazioni generali e stabili (chi è, ruolo, luogo, un tratto riconoscibile): niente segreti né cose che
# il giocatore scopre giocando. Quando un fatto della trama cambia il PNG (morto, fuggito, in catene, partito),
# la voce ha una variante con lo stesso nome, un id nuovo e requisiti complementari: vale la prima voce i cui
# requisiti sono soddisfatti, quindi l'ordine conta.
# I cognomi di famiglia condivisi (Castaldi, Malgrani, Tarvelin, Dravec) non sono forme di queste voci.
glossario:
  # --- Segheria ---
  - id: rennick-dole
    nome: Rennick Dole
    alias: [Rennick, Dole]
    tipo: personaggio
    sottotitolo: "Responsabile della Segheria"
    testo: "Giovane responsabile della Segheria di Qir-Azel, che manda avanti con il socio Marko Thessel sotto concessione dei Malgrani. Tiene per sé i registri e contratta su ogni quattrino. In città lo ricordano ancora come il bullo della scuola."
    requisiti: [pista.pelle < 7]

  - id: rennick-dole-dopo-i-malgrani
    nome: Rennick Dole
    alias: [Rennick, Dole]
    tipo: personaggio
    sottotitolo: "Responsabile della Segheria, ai tempi dei Malgrani"
    testo: "Giovane responsabile della Segheria di Qir-Azel finché ha lavorato per i Malgrani, con il socio Marko Thessel. Contrattava su ogni quattrino, e in città lo ricordano ancora come il bullo della scuola. Adesso la Segheria è della cooperativa dei taglialegna."
    requisiti: [pista.pelle >= 7]

  - id: marko-thessel
    nome: Marko Thessel
    alias: [Marko, Thessel]
    tipo: personaggio
    sottotitolo: "Socio di Rennick Dole alla Segheria"
    testo: "Cofondatore della Segheria di Qir-Azel e socio alla pari di Rennick Dole. Sa leggere una venatura meglio di qualunque artigiano e tratta di persona con i mercanti di Laresh. Ai clienti sorride sempre, mentre dei sottoposti non ricorda mai il nome."
    requisiti: [pista.pelle < 7]

  - id: marko-thessel-dopo-i-malgrani
    nome: Marko Thessel
    alias: [Marko, Thessel]
    tipo: personaggio
    sottotitolo: "Cofondatore della Segheria"
    testo: "Cofondatore della Segheria di Qir-Azel e socio di Rennick Dole finché la Segheria ha lavorato per i Malgrani; poi l'ha rilevata la cooperativa dei taglialegna. Sa leggere una venatura meglio di chiunque, e i mercanti di Laresh vogliono trattare solo con lui."
    requisiti: [pista.pelle >= 7]

  # --- Caserma ---
  - id: toren-galdrick
    nome: Toren Galdrick
    alias: [Galdrick]
    tipo: personaggio
    sottotitolo: "Sceriffo di Qir-Azel"
    testo: "Sceriffo di Qir-Azel e membro del Consiglio, con la pelle scura e la testa rasata, e non si lascia comprare. Per la città è l'uomo che fermò il Cucitore nelle Notti Cucite, e lui non lo smentisce. Sconsiglia la Pignatta Grassa ai forestieri."
    requisiti: [pista.pelle < 6, galdrick.via == 0]

  - id: toren-galdrick-a-ghoran
    nome: Toren Galdrick
    alias: [Galdrick]
    tipo: personaggio
    sottotitolo: "Sceriffo di Qir-Azel"
    testo: "Sceriffo di Qir-Azel e membro del Consiglio, con la pelle scura e la testa rasata. Dopo la spedizione nella Palude Acquanera è partito per Ghoran a reclutare uomini per la Caserma; in sua assenza le carte vanno al furiere o al sergente di turno."
    requisiti: [galdrick.via == 1]

  - id: toren-galdrick-dopo-vesh
    nome: Toren Galdrick
    alias: [Galdrick]
    tipo: personaggio
    sottotitolo: "Sceriffo di Qir-Azel"
    testo: "Sceriffo di Qir-Azel e membro del Consiglio, con la pelle scura e la testa rasata. Per la città è l'uomo che fermò il Cucitore; in Città Bassa adesso anche quello che ha ucciso Mirko Vesh, la notte in cui la Pignatta Grassa è bruciata."
    requisiti: [pista.pelle >= 6]

  - id: borso
    nome: Borso
    tipo: personaggio
    sottotitolo: "Carceriere della Caserma"
    testo: "Carceriere della Caserma di Qir-Azel, massiccio, con il naso rotto più volte e una clava corta che usa soprattutto per battere sulle porte delle celle. Prende nota della condotta di ogni detenuto con una matita che nella sua mano sembra minuscola."
    requisiti: [pista.pelle < 4]

  - id: borso-fuggito
    nome: Borso
    tipo: personaggio
    sottotitolo: "Il carceriere fuggito dalla Caserma"
    testo: "Era il carceriere della Caserma di Qir-Azel, massiccio, con il naso rotto più volte. Una notte ha attraversato il cortile con le chiavi di tutta la Caserma e non è più tornato. Prendeva anche la paga degli Scuri; le guardie lo cercano in Città Bassa."
    requisiti: [pista.pelle >= 4, pista.pelle < 6]

  - id: borso-in-catene
    nome: Borso
    tipo: personaggio
    sottotitolo: "L'ex carceriere della Caserma"
    testo: "Era il carceriere della Caserma di Qir-Azel, e per anni ha preso anche la paga degli Scuri, finché una notte è fuggito con le chiavi delle celle. L'hanno ripreso durante l'assalto alla Pignatta Grassa, e adesso sta in catene nelle celle che custodiva."
    requisiti: [pista.pelle >= 6]

  - id: karn
    nome: Karn
    tipo: personaggio
    sottotitolo: "Tagliagole degli Scuri"
    testo: "Tagliagole degli Scuri, uno di quelli che la banda piazza sui tetti della Città Bassa per tenere d'occhio una strada dall'alto. Fischia a mezza voce sempre la stessa canzone, e chi l'ha sentita una volta la riconosce anche senza vederlo."
    requisiti: []

  # --- Maison des Lunes ---
  - id: nerissa-dalvane
    nome: Nerissa Dalvane
    alias: [Nerissa, Dalvane]
    tipo: personaggio
    sottotitolo: "Padrona della Maison des Lunes"
    testo: "Dirige la Maison des Lunes, all'angolo fra Via del Salmone e Via dei Rasoi, e non alza mai la voce. Veste abiti scuri, con un medaglione sotto la stoffa. Nella sua casa decidono le ragazze, anche quando la regola le costa un cliente."
    requisiti: []

  - id: sara-beck
    nome: Sara Beck
    alias: [Sara, Beck]
    tipo: personaggio
    sottotitolo: "All'ingresso della Maison des Lunes"
    testo: "Halfling cordiale che siede al bancone d'ingresso della Maison des Lunes. Spiega le regole della casa e chiude a chiave le armi dei visitatori in un armadio. Chiama per nome ogni cliente abituale, anche chi preferirebbe restare anonimo."
    requisiti: []

  - id: gretchen
    nome: Gretchen
    tipo: personaggio
    sottotitolo: "La più anziana delle ragazze della Maison"
    testo: "La più anziana delle ragazze della Maison des Lunes, sempre truccata, con una risata profonda. È amica di lunga data di Nerissa Dalvane e manda avanti la casa quando lei è altrove. Del perché abbia lasciato Ghoran dice soltanto che in viaggio ci si reinventa."
    requisiti: []

  - id: jass
    nome: Jass
    tipo: personaggio
    sottotitolo: "Una delle ragazze della Maison des Lunes"
    testo: "Giovane donna della Maison des Lunes, con i capelli rossi mossi e le lentiggini, spiritosa con chi entra per la prima volta. Gira per il salone passando le dita fra i capelli degli ospiti, e molti clienti chiedono di lei per nome."
    requisiti: [jass < 2]

  - id: jass-fuori-dalla-maison
    nome: Jass
    tipo: personaggio
    sottotitolo: "Ex ragazza della Maison des Lunes"
    testo: "Giovane donna con i capelli rossi mossi e le lentiggini sul naso. Ha lavorato alla Maison des Lunes finché una notte, prima dell'alba, non se n'è andata con la sua borsa. Alla Maison il suo nome non lo pronuncia più nessuno."
    requisiti: [jass >= 2]

  - id: churl-braak
    nome: Churl Bra'aak
    alias: [Churl]
    tipo: personaggio
    sottotitolo: "Buttafuori principale della Maison des Lunes"
    testo: "Mezzorco, buttafuori principale alla porta della Maison des Lunes. Parla a parole singole e grugniti ed è leale a Nerissa Dalvane fino in fondo. Ricorda il volto di ogni cliente, e quelli molesti di solito se ne vanno prima che si arrivi alle mani."
    requisiti: []

  - id: tachek
    nome: Tachek
    tipo: personaggio
    sottotitolo: "Buttafuori della Maison des Lunes"
    testo: "Buttafuori della Maison des Lunes che si muove nel salone come un ospite tranquillo, con una mazza imbottita alla cintura. Le ragazze leggono i suoi segnali a colpo d'occhio, come il pugno chiuso lungo la coscia quando ha già deciso."
    requisiti: []

  - id: kanat
    nome: Kanat
    tipo: personaggio
    sottotitolo: "Buttafuori della Maison des Lunes"
    testo: "Buttafuori della Maison des Lunes, alto più di due metri e coperto di tatuaggi tribali, a torso nudo anche d'inverno. Fa rispettare le regole in modo più rumoroso del collega Tachek, e qualche cliente aspetta i suoi turni per vederlo lavorare."
    requisiti: []

  # --- Pignatta Grassa e Scuri ---
  - id: mirko-vesh
    nome: Mirko Vesh
    alias: [Mirko, Vesh]
    tipo: personaggio
    sottotitolo: "Capo degli Scuri"
    testo: "Guida gli Scuri di Qir-Azel e passa le serate alla Pignatta Grassa. È un olvaro magro dallo sguardo tagliente, con un anello a ogni dito, quasi tutti tolti a clienti che non hanno pagato. Parla con garbo sarcastico e tiene un profilo basso."
    requisiti: [pista.pelle < 6]

  - id: mirko-vesh-morto
    nome: Mirko Vesh
    alias: [Mirko, Vesh]
    tipo: personaggio
    sottotitolo: "Il capo degli Scuri, morto"
    testo: "Ha guidato per anni gli Scuri di Qir-Azel, un olvaro magro con un anello a ogni dito, quasi tutti tolti ai debitori. È morto nel cortile delle risse della Pignatta Grassa, per mano di Toren Galdrick, la notte in cui la taverna è bruciata."
    requisiti: [pista.pelle >= 6]

  - id: mauro-scrocco
    nome: Mauro Scrocco
    alias: [Mauro, Scrocco]
    tipo: personaggio
    sottotitolo: "Oste della Pignatta Grassa"
    testo: "Oste della Pignatta Grassa, in Città Bassa, con una pancia che entra nelle stanze prima di lui e addosso i colori dello zafferano. Abbraccia i clienti al primo incontro. Presta denaro e procura contatti, e per molti è lui il volto degli Scuri."
    requisiti: [pista.pelle < 6]

  - id: mauro-scrocco-dopo-la-pignatta
    nome: Mauro Scrocco
    alias: [Mauro, Scrocco]
    tipo: personaggio
    sottotitolo: "L'oste della Pignatta Grassa"
    testo: "Era l'oste della Pignatta Grassa e per molti il volto degli Scuri. La notte dell'assalto alla Pignatta le guardie l'hanno preso sullo spiazzo, prima che la taverna bruciasse, e adesso aspetta il processo nelle celle della Caserma."
    requisiti: [pista.pelle >= 6, mauro <= 1]

  - id: mauro-scrocco-morto
    nome: Mauro Scrocco
    alias: [Mauro, Scrocco]
    tipo: personaggio
    sottotitolo: "L'oste della Pignatta Grassa"
    testo: "Era l'oste della Pignatta Grassa, con una pancia che entrava nelle stanze prima di lui; prestava denaro e per molti era il volto degli Scuri. È morto la notte dell'assalto, sullo spiazzo davanti alle porte chiuse della taverna, prima che la Pignatta bruciasse."
    requisiti: [pista.pelle >= 6, mauro == 2]

  - id: rozalia-marga
    nome: Rozalia Marga
    alias: [Rozalia]
    tipo: personaggio
    sottotitolo: "Falsaria degli Scuri"
    testo: "Falsaria degli Scuri che lavora nel retrobottega della Pignatta Grassa e si vanta di non essere mai stata smascherata. È snella, con una piuma d'oca dietro l'orecchio e le dita macchiate d'inchiostro fino alla seconda falange."
    requisiti: [pista.pelle < 6]

  - id: rozalia-marga-dopo-la-pignatta
    nome: Rozalia Marga
    alias: [Rozalia]
    tipo: personaggio
    sottotitolo: "Falsaria degli Scuri"
    testo: "Falsaria degli Scuri che lavorava nel retrobottega della Pignatta Grassa, snella, con una piuma d'oca dietro l'orecchio. La notte dell'assalto alla Pignatta è sparita in una nuvola di fumo, prima che le guardie riuscissero a toccarla."
    requisiti: [pista.pelle >= 6]

  - id: squiggor-ironfist
    nome: Squiggor Ironfist
    alias: [Squiggor]
    tipo: personaggio
    sottotitolo: "Picchiatore degli Scuri"
    testo: "Picchiatore di fiducia degli Scuri, massiccio, con l'occhio sinistro coperto da una benda nera. Riscuote i prestiti scaduti e accompagna i capi quando serve una presenza fisica. Da ubriaco canticchia ritornelli olvari che non ricorda mai per intero."
    requisiti: [squiggor < 2]

  - id: squiggor-ironfist-morto
    nome: Squiggor Ironfist
    alias: [Squiggor]
    tipo: personaggio
    sottotitolo: "Picchiatore degli Scuri, morto"
    testo: "Era il picchiatore di fiducia degli Scuri, massiccio, con una benda nera sull'occhio sinistro, e riscuoteva i prestiti scaduti. È morto in una rissa in Via dei Rasoi, al gomito della strada, sotto il vecchio cristallo spento."
    requisiti: [squiggor >= 2]

  - id: nihali-cuzan
    nome: Nihali Cuzan
    tipo: personaggio
    sottotitolo: "Baro della Pignatta Grassa"
    testo: "Mezzelfo alto e magro che organizza le partite di carte alla Pignatta Grassa, con vestiti di seconda mano sempre stirati e le mani curate al millimetro. Si dice che bari con giudizio, lasciando vincere qualcuno ogni tanto perché le perdite degli altri sembrino sfortuna."
    requisiti: [pista.pelle < 6]

  - id: nihali-cuzan-dopo-la-pignatta
    nome: Nihali Cuzan
    tipo: personaggio
    sottotitolo: "Baro degli Scuri"
    testo: "Mezzelfo alto e magro che organizzava le partite di carte degli Scuri alla Pignatta Grassa, con le mani curate al millimetro. Dalla notte in cui la Pignatta è bruciata nessuno l'ha più visto tenere banco in Città Bassa."
    requisiti: [pista.pelle >= 6]

  - id: gaia-acari
    nome: Gaia Acari
    alias: [Gaia, Acari]
    tipo: personaggio
    sottotitolo: "Ragazzina della Città Bassa"
    testo: "Ragazzina della Città Bassa con un cappuccio blu scuro, che conosce ogni passaggio sotto i ponti. Passa le serate fra la Locanda di Ilka e il Grifone di Ferro, dove Brunella le porta il latte caldo e lei imita le voci degli avventori."
    requisiti: []

  - id: nestor-gramm
    nome: Nestor Gramm
    alias: [Nestor]
    tipo: personaggio
    sottotitolo: "Erborista della Dispensa di Gramm"
    testo: "Erborista e alchimista della Dispensa di Gramm, tozzo, con un grembiule grigio macchiato e niente credito per nessuno. Dal banco vende tisane e balsami, e nel retro prepara rimedi più cari, come una pasta nera che chiude le ferite in una notte."
    requisiti: [colpo.dispensa == 0, pista.pelle < 4]

  - id: nestor-gramm-in-fuga
    nome: Nestor Gramm
    alias: [Nestor]
    tipo: personaggio
    sottotitolo: "Erborista della Dispensa di Gramm"
    testo: "Erborista e alchimista, teneva la Dispensa di Gramm. Nel retro, oltre alla pasta nera per le ferite, preparava i veleni degli Scuri. Da quando la Caserma gli ha messo gli occhi addosso al banco c'è un garzone, e lui non si fa più vedere."
    requisiti: [pista.pelle < 6]

  - id: nestor-gramm-in-catene
    nome: Nestor Gramm
    alias: [Nestor]
    tipo: personaggio
    sottotitolo: "L'erborista degli Scuri"
    testo: "Teneva la Dispensa di Gramm sul Mercato dei Nodi, e nel retro preparava la pasta nera per le ferite e i veleni degli Scuri. La notte dell'assalto alla Pignatta Grassa si è arreso alle guardie, e adesso sta in catene alla Caserma."
    requisiti: [pista.pelle >= 6]

  # --- Grifone di Ferro e Raschiatori ---
  - id: liaren-tarvelin
    nome: Liaren Tarvelin
    alias: [Liaren]
    tipo: personaggio
    sottotitolo: "Padrona della Locanda del Grifone di Ferro"
    testo: "Barda e locandiera, figlia di Ondrel Tarvelin ed erede dell'Acciaieria, ha aperto il Grifone di Ferro dopo aver rotto con la famiglia. Dà del tu ai clienti prima di saperne il nome e suona il samisen. Nella sua locanda gli schiavi non entrano."
    requisiti: [pista.acciaio < 4]

  - id: liaren-tarvelin-erede
    nome: Liaren Tarvelin
    alias: [Liaren]
    tipo: personaggio
    sottotitolo: "Padrona della Locanda del Grifone di Ferro"
    testo: "Barda e locandiera, ha aperto la Locanda del Grifone di Ferro dopo aver rotto con la famiglia. Dalla morte del padre, Ondrel Tarvelin, l'Acciaieria spetta a lei. Dà del tu ai clienti prima di sapere come si chiamano e suona il samisen."
    requisiti: [pista.acciaio >= 4]

  - id: brunella-fennick
    nome: Brunella Fennick
    alias: [Brunella]
    tipo: personaggio
    sottotitolo: "Cuoca del Grifone di Ferro"
    testo: "Anziana halfling dai capelli bianchi che comanda la cucina del Grifone di Ferro e ne è la vicedirettrice. Conosce Liaren Tarvelin da bambina e l'ha seguita quando ha lasciato il Maniero. Agli abituali mette davanti il piatto giusto prima che lo chiedano."
    requisiti: []

  - id: dragna-gro-malog
    nome: Dragna Gro-Malog
    alias: [Dragna]
    tipo: personaggio
    sottotitolo: "Il Ferro dei Raschiatori"
    testo: "Mezzorca con la testa rasata ai lati, da nove anni Ferro dei Raschiatori. Addestra le reclute in Caserma, decide chi scende nei tunnel e compila i turni al suo tavolo del Grifone di Ferro. Della mano sinistra le mancano l'indice e il medio."
    requisiti: []

  - id: mirn-il-sordo
    nome: Mirn il Sordo
    tipo: personaggio
    sottotitolo: "Raschiatore di un tempo"
    testo: "Raschiatore che anni fa cominciò a ripetere frasi in una lingua sconosciuta e fu preso in custodia dal Velo; morì in una cella della Cattedrale. Il suo nome torna fuori ogni volta che uno dei Raschiatori, risalito dai tunnel, sente voci che non smettono."
    requisiti: []

  # --- Confraternita del Velo ---
  - id: madre-del-velo
    nome: Madre del Velo
    tipo: personaggio
    sottotitolo: "Guida della Confraternita del Velo"
    testo: "Guida della Confraternita del Velo, officia nella Cripta sotto l'altare della Cattedrale e nessuno dichiara di averla vista in volto. Appare di rado, per i riti più solenni, avvolta in veli di seta nera e grigia, e parla con una voce bassa, quasi senza inflessioni."
    requisiti: []

  - id: padre-aurelio-vantes
    nome: Padre Aurelio Vantes
    alias: [Padre Vantes, Vantes]
    tipo: personaggio
    sottotitolo: "Sommo sacerdote della Cattedrale del Velo"
    testo: "Sommo sacerdote della Cattedrale del Velo e membro del Consiglio di Qir-Azel, il volto pubblico della Confraternita, e dirige di persona le cure dei feriti. Ha occhi grigio chiaro, e mentre parla posa sempre una mano sul braccio di chi ha davanti."
    requisiti: []

  - id: ottilia-sanvel
    nome: Ottilia Sanvel
    alias: [Ottilia]
    tipo: personaggio
    sottotitolo: "Monaca responsabile della Confraternita del Velo"
    testo: "Monaca responsabile della Confraternita del Velo, robusta, con i capelli corti. Sovrintende alla disciplina interna e agli archivi minori della Cattedrale e decide da sola quando un ricoverato può andarsene. Parla con calma, in frasi che non ammettono superlativi."
    requisiti: []

  - id: sorella-giulia
    nome: Sorella Giulia
    tipo: personaggio
    sottotitolo: "Chierica del Velo, cura i Giardini della Linfa"
    testo: "Chierica del Velo che cura i Giardini della Linfa, con i capelli biondo cenere tagliati corti e le maniche macchiate di linfa. Si dice che parli la lingua degli uccelli, e quando cammina fra le aiuole i passeri le si posano sul palmo."
    requisiti: []

  - id: sorella-celia
    nome: Sorella Celia
    alias: [Celia]
    tipo: personaggio
    sottotitolo: "Chierica del Velo, suona il liuto"
    testo: "Chierica del Velo nota per il liuto con cui accompagna le funzioni, e molti fedeli vengono a messa per lei. Si concede un piccolo vezzo, come un nastro al polso, che Ottilia Sanvel le fa togliere. La sera, qualche volta, suona per i ricoverati."
    requisiti: []

  - id: nadja-oresca
    nome: Nadja Oresca
    alias: [Nadja]
    tipo: personaggio
    sottotitolo: "Accolita della Cattedrale del Velo"
    testo: "Accolita della Cattedrale del Velo da circa otto anni, figlia della nota Madame Oresca, con cui non va d'accordo quasi su niente, a cominciare dai matrimoni che ha rifiutato. Per chiudere una conversazione cita un proverbio in lingua antica che nessuno capisce."
    requisiti: []

  - id: idrian-sollen
    nome: Idrian Sollen
    alias: [Sollen]
    tipo: personaggio
    sottotitolo: "Cappellano del vecchio Santuario"
    testo: "Cappellano del vecchio Santuario per quasi vent'anni, severo con gli accoliti, guidò la fede del Grande Albero Rosso nella sua stagione più felice. Il suo nome resta legato all'incendio del Santuario nel 145 D.C.; la carica è passata a Padre Aurelio Vantes."
    requisiti: []

  - id: gundo-marl
    nome: Gundo Marl
    alias: [Gundo]
    tipo: personaggio
    sottotitolo: "Becchino di Qir-Azel"
    testo: "Becchino di Qir-Azel da venticinque anni, zoppo, che tiene i registri funebri con una scrittura minuta e conosce a memoria ogni lapide. La notte della razzia è sparito dalla sua casetta, e da allora le fosse le scava il suo garzone."
    requisiti: [cimitero.lapide == 0]

  - id: gundo-marl-nascosto
    nome: Gundo Marl
    alias: [Gundo]
    tipo: personaggio
    sottotitolo: "Becchino di Qir-Azel"
    testo: "Becchino di Qir-Azel da venticinque anni, zoppo, che conosce a memoria ogni lapide del cimitero. Per la città è sparito la notte della razzia. In realtà è vivo, e di notte lavora nascosto nella cappella dei Vardesi."
    requisiti: [cimitero.lapide >= 1]

  # --- Castaldi e Consiglio ---
  - id: julia-castaldi
    nome: Julia Castaldi
    alias: [Julia]
    tipo: personaggio
    sottotitolo: "Rappresentante del Consiglio di Qir-Azel"
    testo: "Rappresentante eletta del Consiglio di Qir-Azel, di famiglia Castaldi, con i capelli corti e i modi di una funzionaria. Riceve soltanto in Municipio e arriva alle sedute con le pratiche già lette. Le sue licenze sul grano la mettono contro Ottone Malgrani."
    requisiti: [pista.pelle < 7]

  - id: julia-castaldi-dopo-i-malgrani
    nome: Julia Castaldi
    alias: [Julia]
    tipo: personaggio
    sottotitolo: "Rappresentante del Consiglio di Qir-Azel"
    testo: "Rappresentante eletta del Consiglio di Qir-Azel, di famiglia Castaldi, con i capelli corti sopra le orecchie e i modi di una funzionaria. Dopo la condanna di Ottone Malgrani le sue licenze sul grano sono passate, e le cooperative hanno rilevato i mulini dei Malgrani."
    requisiti: [pista.pelle >= 7]

  - id: marella-castaldi
    nome: Marella Castaldi
    alias: [Marella]
    tipo: personaggio
    sottotitolo: "Padrona di casa al Maniero Castaldi"
    testo: "Cognata della Rappresentante Julia Castaldi, conduce la vita sociale del Maniero e organizza le cene nei giorni di consiglio, decidendo chi viene invitato e dove siede. A quella tavola, ripete agli ospiti, si parla di Stato e mai dei Castaldi."
    requisiti: []

  - id: quintus-vael
    nome: Quintus Vael
    alias: [Quintus]
    tipo: personaggio
    sottotitolo: "Comandante della guardia dei Castaldi"
    testo: "Comandante della guardia dei Castaldi, ex militare con i capelli grigi corti e una cicatrice sotto il mento lasciata da un orco vent'anni fa. Porta l'armatura di cuoio anche ai ricevimenti, e decide lui il percorso della Rappresentante quando va in Municipio."
    requisiti: []

  # --- Malgrani e Tarvelin ---
  - id: ottone-malgrani
    nome: Ottone Malgrani
    alias: [Ottone]
    tipo: personaggio
    sottotitolo: "Capofamiglia dei Malgrani"
    testo: "Capofamiglia dei Malgrani e consigliere, padrone degli unici mulini della regione, con i baffi biondi e i panciotti ricamati. Vorrebbe chiudere la Maison des Lunes e comprare l'Acciaieria dei Tarvelin. Gli anziani ricordano l'assalto che suo padre Brandano tentò contro Qir-Azel quarant'anni fa."
    requisiti: [pista.pelle < 5]

  - id: ottone-malgrani-ricercato
    nome: Ottone Malgrani
    alias: [Ottone]
    tipo: personaggio
    sottotitolo: "Capofamiglia dei Malgrani"
    testo: "Capofamiglia dei Malgrani e consigliere, padrone degli unici mulini della regione, con i baffi biondi e i panciotti ricamati. Nei suoi registri ci sono nove anni di pagamenti agli Scuri, e il Consiglio ha firmato un mandato contro di lui."
    requisiti: [pista.pelle < 7]

  - id: ottone-malgrani-condannato
    nome: Ottone Malgrani
    alias: [Ottone]
    tipo: personaggio
    sottotitolo: "L'ultimo capofamiglia dei Malgrani"
    testo: "Era il capofamiglia dei Malgrani e sedeva in Consiglio, padrone degli unici mulini della regione. Per i suoi conti con gli Scuri è stato condannato a morte dopo un processo breve; mulini e segherie sono passati alle cooperative, e il Maniero è stato venduto."
    requisiti: [pista.pelle >= 7]

  - id: ondrel-tarvelin
    nome: Ondrel Tarvelin
    tipo: personaggio
    sottotitolo: "Padrone dell'Acciaieria"
    testo: "Patriarca dei Tarvelin e uomo più ricco di Qir-Azel, dirige di persona l'Acciaieria del lyssan, e nel consiglio della Gilda parla poco ma viene ascoltato. È pallido e cammina lento. Con la figlia Liaren non si parla da anni."
    requisiti: [pista.acciaio < 4]

  - id: ondrel-tarvelin-morto
    nome: Ondrel Tarvelin
    tipo: personaggio
    sottotitolo: "Il padrone dell'Acciaieria, morto"
    testo: "Era il patriarca dei Tarvelin e l'uomo più ricco di Qir-Azel, e dirigeva di persona l'Acciaieria del lyssan. Pallido, in abiti scuri sempre uguali, con la figlia Liaren non si parlava da anni. È morto nella sala della fornace."
    requisiti: [pista.acciaio >= 4]

  # --- Accademia e Locanda di Ilka ---
  - id: orvald-temmerin
    nome: Orvald Temmerin
    alias: [Orvald, Temmerin]
    tipo: personaggio
    sottotitolo: "Preside dell'Accademia di Torvessa"
    testo: "Preside dell'Accademia di Torvessa, ex avventuriero con trent'anni di scavi alle spalle, che tiene nel seminterrato le armi e i trofei delle sue spedizioni. Dà lezioni private di magia fra pile di mappe, e di rado risponde due volte alla stessa domanda."
    requisiti: []

  - id: pett
    nome: Pett
    tipo: personaggio
    sottotitolo: "Il corvo di Orvald Temmerin"
    testo: "Corvo familiare di Orvald Temmerin, preside dell'Accademia di Torvessa. Sta sulla spalla del padrone o su una trave dello studio, partecipa davvero alle conversazioni e si zittisce di colpo quando Orvald perde la pazienza."
    requisiti: []

  - id: ilka-dravec
    nome: Ilka Dravec
    alias: [Ilka]
    tipo: personaggio
    sottotitolo: "Cantastorie della Locanda di Ilka"
    testo: "Matriarca dei Dravec, quasi cieca, siede accanto al fuoco della sua locanda e racconta con voce roca i miti antichi degli olvari. Conosce qualche parola della lingua dei Precursori. La locanda la gestisce la figlia Besk."
    requisiti: []

  - id: besk-dravec
    nome: Besk Dravec
    alias: [Besk]
    tipo: personaggio
    sottotitolo: "Figlia di Ilka, allieva di magia"
    testo: "Figlia minore di Ilka Dravec, manda avanti la Locanda di Ilka. Studia magia con Orvald Temmerin all'Accademia di Torvessa e la sera apre i quaderni in cucina per chi vuole imparare. Con chi tratta la madre come una curiosità diventa scortese in fretta."
    requisiti: []

  # --- Botteghe e Gilda ---
  - id: bram-halgast
    nome: Bram Halgast
    alias: [Bram]
    tipo: personaggio
    sottotitolo: "Fabbro della Fucina dei Due Mastini"
    testo: "Fabbro della Fucina dei Due Mastini, che lavora a torso nudo con due mastini rossi sdraiati vicino all'incudine. È volgare e beve fino a tardi, ma le sue armi sono le migliori di Qir-Azel. Irsa Valbrun rifinisce i suoi pezzi grezzi."
    requisiti: []

  - id: irsa-valbrun
    nome: Irsa Valbrun
    alias: [Irsa]
    tipo: personaggio
    sottotitolo: "Fabbra dell'Armeria di Irsa"
    testo: "Titolare dell'Armeria di Irsa e unica donna nel consiglio interno della Gilda dei Mercanti. Non ha una forgia e rifinisce i pezzi grezzi di Bram Halgast. Ha una cicatrice obliqua sulla guancia, e di un cliente guarda prima le mani, poi gli occhi."
    requisiti: []

  - id: ambrin-qell
    nome: Ambrin Qell
    alias: [Ambrin]
    tipo: personaggio
    sottotitolo: "Mercante del Nodo d'Ossidiana"
    testo: "Mercante di oggetti magici, tiene il Nodo d'Ossidiana al Mercato dei Nodi. Ha lunghi capelli rossi e un'età che nessuno indovina. Conosce la storia di ogni pezzo in bottega e scrive pergamene magiche su commissione, sotto lo sguardo di un corvo familiare."
    requisiti: []

  - id: varn-kett
    nome: Varn Kett
    alias: [Varn]
    tipo: personaggio
    sottotitolo: "Ispettore dei dazi della Gilda"
    testo: "Ispettore dei dazi della Gilda dopo vent'anni nella milizia, conosciuto da tutti sui Ponti Sospesi, con un cappotto color tabacco. Quando sente una cosa da tenere muove le dita come se scrivesse su una pergamena invisibile, e non ha mai sbagliato una riga."
    requisiti: []

  - id: corin-ashdale
    nome: Corin Ashdale
    tipo: personaggio
    sottotitolo: "Mercante della Gilda"
    testo: "Mercante della Gilda che si incontra alla Casa dei Nodi o, più spesso, al Grifone di Ferro, dove paga da bere a chiunque. Presta piccole somme senza contare il rientro e desidera farsi degli amici veri. È la migliore fonte di pettegolezzi di Qir-Azel."
    requisiti: [pista.corin < 6]

  - id: corin-ashdale-a-laresh
    nome: Corin Ashdale
    tipo: personaggio
    sottotitolo: "Mercante della Gilda, in viaggio"
    testo: "Mercante della Gilda, di solito al Grifone di Ferro a pagare da bere a chiunque, con un fazzoletto al taschino. È partito per Laresh all'alba con una carovana di sale, e ha promesso di tornare prima dell'inverno o subito dopo."
    requisiti: [pista.corin >= 6, pista.arena == 0]

  - id: corin-ashdale-tornato
    nome: Corin Ashdale
    tipo: personaggio
    sottotitolo: "Mercante della Gilda"
    testo: "Mercante della Gilda che si incontra alla Casa dei Nodi o al Grifone di Ferro, dove paga da bere a chiunque. Era partito per Laresh con una carovana di sale, e quando ha sentito che l'Arena riapriva l'ha lasciata a metà strada ed è tornato."
    requisiti: [pista.corin >= 6, pista.arena >= 1]

  - id: orazio-belcanto
    nome: Orazio Belcanto
    alias: [Orazio]
    tipo: personaggio
    sottotitolo: "Impresario del Teatro delle Meraviglie"
    testo: "Proprietario e primo attore del Teatro delle Meraviglie, carico di anelli, che parla un tono sopra la sua voce naturale. Passa le sere nelle taverne a caccia di storie e di bardi nuovi. Con Liaren Tarvelin ha una vecchia rivalità di palco."
    requisiti: []

  - id: grusk
    nome: Grusk
    tipo: personaggio
    sottotitolo: "Spazzino di Qir-Azel"
    testo: "Mezzorco, spazzino ufficiale di Qir-Azel sulla spiaggia dell'Orlo dei Rottami, tatuato dalla testa ai piedi. Spinge una carriola rossa che la gente riconosce da lontano, di solito per cambiare strada, e finisce spesso nei guai con la legge."
    requisiti: []

  # --- Sottoponti ---
  - id: mamma-tesh
    nome: Mamma Tesh
    alias: [Tesh]
    tipo: personaggio
    sottotitolo: "Il braciere dei sottoponti"
    testo: "Donna dalle mani annerite che vive sotto il Ponte delle Mille Corde da più tempo di chiunque. Tiene un braciere ricavato da un elmo rovesciato, che chiama il Capitano, e al suo fuoco il posto si paga con una storia o un favore."
    requisiti: []

  # --- La razzia ---
