# Glossario del blocco 8: l'Arena, Sotto la pelle di Qir-Azel, le rovine dei Raschiatori e Topi in cantina.
# Presentazioni generali, senza i fatti delle piste; le voci che sarebbero spoiler compaiono solo quando il
# giocatore ci è arrivato. Dove la trama cambia un PNG o un luogo (Sotto la pelle, l'Arena, Arelan Dorr) c'è una
# variante con lo stesso nome e requisiti complementari: vale la prima voce i cui requisiti sono soddisfatti.
# Orvald, Orazio, Besk, Nestor, Borso, Mauro, Mirko, Ottone, Julia, Galdrick e Dragna stanno già in personaggi.yaml.
glossario:
  # ------------------------------------------------------------ i Tamberlo
  - id: rilla-tamberlo
    nome: Rilla Tamberlo
    alias: [Rilla]
    tipo: personaggio
    sottotitolo: "La figlia minore di Oddo Tamberlo"
    testo: "Figlia minore di Oddo Tamberlo, ventidue anni, con i capelli rossi. Lavora al bancone dell'Emporio e ogni tanto recita nelle compagnie di Orazio Belcanto. Le sue storie fanno il giro della Città Bassa prima di quelle dei banditori."
    requisiti: []

  - id: oddo-tamberlo
    nome: Oddo Tamberlo
    alias: [Oddo]
    tipo: personaggio
    sottotitolo: "Il padrone dell'Emporio Tamberlo"
    testo: "Proprietario dell'Emporio Tamberlo, la bottega più antica della Città Bassa. È un uomo grosso con i baffi curati, che conta il resto due volte e protegge le figlie fino al ridicolo. La sera beve al Grifone di Ferro e racconta sempre gli stessi aneddoti."
    requisiti: []

  - id: berta-tamberlo
    nome: Berta Tamberlo
    alias: [Berta]
    tipo: personaggio
    sottotitolo: "La moglie di Oddo Tamberlo"
    testo: "Moglie di Oddo Tamberlo. Passa le giornate nella cucina sul retro dell'Emporio, dove sforna il pane e le torte di mele che a Qir-Azel conoscono tutti. Fra le due figlie fa da paciera senza smettere di impastare."
    requisiti: []

  - id: elsa-tamberlo
    nome: Elsa Tamberlo
    alias: [Elsa]
    tipo: personaggio
    sottotitolo: "La figlia maggiore di Oddo Tamberlo"
    testo: "Figlia maggiore di Oddo Tamberlo, bruna, sempre con la battuta pronta. Manda avanti il bancone dell'Emporio con il padre e tiene i conti meglio di lui. Da qualche tempo in città la si nomina insieme a Rennick Dole, quello della Segheria."
    requisiti: []

  - id: emporio-tamberlo
    nome: Emporio Tamberlo
    alias: [Emporio]
    tipo: luogo
    sottotitolo: "La bottega più antica della Città Bassa"
    testo: "Bottega della famiglia Tamberlo sulla strada per i Ponti, con le zappe fuori. Dentro c'è di tutto, dalle cinghie per i muli ai chiodi a peso, e sul bancone una torta di Berta che non è in vendita, mentre sotto il pavimento c'è una cantina."
    requisiti: []

  # ------------------------------------------------------------ l'Arena
  - id: arena-di-qir-azel
    nome: Arena di Qir-Azel
    alias: [Arena]
    tipo: luogo
    sottotitolo: "Le mura più vecchie dei Quartieri Alti"
    testo: "Anfiteatro al limitare nord-ovest dei Quartieri Alti, più antico dei palazzi intorno, con le mura rinforzate dal metallo dei Precursori e una cintura di cristalli conduttori che protegge la folla. È rimasta chiusa per anni, e ogni volta che riapre la città scommette su tutto."
    requisiti: [pista.arena < 5]

  - id: arena-di-qir-azel-riaperta
    nome: Arena di Qir-Azel
    alias: [Arena]
    tipo: luogo
    sottotitolo: "Le mura più vecchie dei Quartieri Alti"
    testo: "Anfiteatro al limitare nord-ovest dei Quartieri Alti, più antico dei palazzi intorno, con le mura rinforzate dal metallo dei Precursori e una cintura di cristalli conduttori che protegge la folla. Chiusa per anni, dopo il torneo delle Tre Prove non ha più chiuso."
    requisiti: [pista.arena >= 5]

  - id: durgan
    nome: Durgan
    tipo: personaggio
    sottotitolo: "Mercenario della Città Bassa"
    testo: "Nano massiccio con il volto coperto di cicatrici e una grande ascia da battaglia portata in spalla come un attrezzo. Lo si vede spesso alla Pignatta Grassa, al tavolo di Mauro Scrocco. Durante un combattimento non apre mai bocca."
    requisiti: [pista.arena >= 1, pista.pelle < 6]

  - id: durgan-dopo-la-pignatta
    nome: Durgan
    tipo: personaggio
    sottotitolo: "Mercenario della Città Bassa"
    testo: "Nano massiccio con il volto coperto di cicatrici e una grande ascia da battaglia portata in spalla come un attrezzo. Sedeva al tavolo di Mauro Scrocco alla Pignatta Grassa, finché la taverna non è bruciata. Durante un combattimento non apre mai bocca."
    requisiti: [pista.arena >= 1, pista.pelle >= 6]

  - id: ilvaena-sorathe
    nome: Ilvaena Sorathe
    alias: [Ilvaena]
    tipo: personaggio
    sottotitolo: "Cacciatrice di orchi"
    testo: "Elfa dai capelli color rame, cacciatrice di taglie, la più esperta di Qir-Azel in fatto di orchi. Vive ai margini del Bosco di Velthar e torna in città per riferire allo sceriffo, alloggiando al Grifone di Ferro dalla sua amica Liaren Tarvelin."
    requisiti: []

  - id: dolovan-stroud
    nome: Dolovan Stroud
    alias: [Dolovan]
    tipo: personaggio
    sottotitolo: "Lo stalliere della Zanna Rotta"
    testo: "Ex cacciatore, proprietario delle Scuderie della Zanna Rotta in Città Bassa, più giovane d'aspetto per una lontana ascendenza elfica. Odia gli orchi e passa allo sceriffo quello che sa delle tribù. Il suo cavallo da guerra si chiama Squash."
    requisiti: []

  - id: ettore-castaldi
    nome: Ettore Castaldi
    alias: [Ettore]
    tipo: personaggio
    sottotitolo: "Il padrone della Birreria del Paladino Stanco"
    testo: "Cugino della Rappresentante Julia Castaldi, paladino del Grande Albero Rosso finché l'incendio del Santuario, nel 145 D.C., non gli ha fatto vacillare la fede. Ha appeso l'armatura al muro e ha aperto la Birreria del Paladino Stanco, dove ascolta i clienti senza giudicarli."
    requisiti: []

  - id: tenebra
    nome: Tenebra
    tipo: personaggio
    sottotitolo: "Il capo dei Raschiatori"
    testo: "Capo dei Raschiatori, anche se ufficialmente i Quattro Scavatori non ne hanno, e loro voce nel Consiglio di Qir-Azel. Ha il volto in parte bruciato dal Mana corrotto e parla sempre piano. Insegna alle reclute che la paura le riporta in superficie."
    requisiti: []

  # ------------------------------------------------------------ i Malgrani
  - id: lucia-malgrani
    nome: Lucia Malgrani
    alias: [Lucia]
    tipo: personaggio
    sottotitolo: "La moglie di Ottone Malgrani"
    testo: "Moglie di Ottone Malgrani, più giovane di lui e attaccata alle tradizioni quanto lui, madre di tre figli piccoli. Vive quasi sempre chiusa nel Maniero e si concede solo il Teatro delle Meraviglie. Chi la conosceva da ragazza la ricorda più allegra."
    requisiti: [pista.pelle < 7]

  - id: lucia-malgrani-a-ghoran
    nome: Lucia Malgrani
    alias: [Lucia]
    tipo: personaggio
    sottotitolo: "La moglie di Ottone Malgrani"
    testo: "Moglie di Ottone Malgrani e madre di tre figli piccoli. Per anni è vissuta chiusa nel Maniero, uscendo solo per il Teatro delle Meraviglie. Dopo la condanna del marito ha lasciato Qir-Azel per Ghoran, dove i figli stavano già con la zia Urtilia."
    requisiti: [pista.pelle >= 7]

  - id: urtilia-mendion
    nome: Urtilia Mendion
    alias: [Urtilia]
    tipo: personaggio
    sottotitolo: "La zia di Ottone Malgrani"
    testo: "Sorella minore di Brandano Malgrani e zia di Ottone; ha il busto nell'atrio del Maniero accanto a quelli di Brandano e della moglie Vermilia. Da decenni amministra da Ghoran gli affari della casata, schiavi compresi. Si dice che sia una maga potente."
    requisiti: []

  - id: roldan-kael
    nome: Roldan Kael
    alias: [Roldan]
    tipo: personaggio
    sottotitolo: "Il caposquadra delle guardie dei Malgrani"
    testo: "Caposquadra delle guardie del Maniero Malgrani, un veterano con la barba tagliata a filo e un fischietto d'osso al collo. Di notte resta nel salone e ogni ora sale a controllare lo studio del padrone. Le sue guardie temono più lui dei ladri."
    requisiti: [pista.pelle >= 1, pista.pelle < 7]

  - id: roldan-kael-senza-padrone
    nome: Roldan Kael
    alias: [Roldan]
    tipo: personaggio
    sottotitolo: "L'ex caposquadra delle guardie dei Malgrani"
    testo: "Era il caposquadra delle guardie del Maniero Malgrani, un veterano con la barba tagliata a filo e un fischietto d'osso al collo. Dopo la condanna di Ottone il Maniero è stato venduto, e le guardie in livrea verde hanno perso il posto."
    requisiti: [pista.pelle >= 7]

  - id: maniero-malgrani
    nome: Maniero Malgrani
    alias: [Maniero dei Malgrani]
    tipo: luogo
    sottotitolo: "La residenza dei Malgrani nei Quartieri Alti"
    testo: "Residenza dei Malgrani nell'area settentrionale dei Quartieri Alti, oltre le ronde, fra pini contorti, con un alloro dorato sul cancello di ferro battuto. Ottone vi riceve molto e mai gli stessi ospiti due volte, e la finestra del suo studio resta accesa fino a tardi."
    requisiti: [pista.pelle < 7]

  - id: maniero-malgrani-venduto
    nome: Maniero Malgrani
    alias: [Maniero dei Malgrani]
    tipo: luogo
    sottotitolo: "L'ex residenza dei Malgrani nei Quartieri Alti"
    testo: "Residenza dei Malgrani nell'area settentrionale dei Quartieri Alti, oltre le ronde, fra pini contorti, con un alloro dorato sul cancello di ferro battuto. Dopo la condanna di Ottone è stato venduto, e il Consiglio vuole farne un istituto di studi."
    requisiti: [pista.pelle >= 7]

  # ------------------------------------------------------------ le rovine
  - id: vhar-ul
    nome: Vhar'Ul
    alias: [Vhar-Ul]
    tipo: luogo
    sottotitolo: "Una rovina sigillata a sud della città"
    testo: "Ingresso alle rovine dei Precursori mezza giornata a sud degli ultimi ponti, in fondo a una conca di basalto. Quarant'anni fa una squadra di Raschiatori pagata dalla Gilda arrivò al terzo livello e perse tre uomini; da allora il portale porta il sigillo della Gilda."
    requisiti: []

  - id: laboratorio-di-calibrazione
    nome: Laboratorio di Calibrazione
    tipo: luogo
    sottotitolo: "Una rovina dei Precursori a sud-est"
    testo: "Rovina dei Precursori dentro una collina di roccia vetrosa, due giorni a sud-est di Qir-Azel, fatta di camere di metallo liscio attraversate da linee di luce. Serviva a tarare macchine perdute. I suoi sistemi misurano ancora chiunque passi."
    requisiti: []

  - id: mahr-kel
    nome: Mahr-Kel
    alias: [Sito Mahr-Kel]
    tipo: luogo
    sottotitolo: "Un complesso sigillato a sud-ovest"
    testo: "Complesso dei Precursori nelle terre basse di sud-ovest. I Raschiatori lo abbandonarono trentacinque anni fa, dopo i vapori tossici e un uomo schiacciato da una porta. La Gilda lo ha dichiarato instabile, e i suoi condotti di raffreddamento non si sono mai spenti."
    requisiti: []

  - id: arelan-dorr
    nome: Arelan Dorr
    alias: [Dorr]
    tipo: personaggio
    sottotitolo: "Il supervisore della spedizione a Vhar'Ul"
    testo: "Raschiatore che quarant'anni fa guidò la spedizione della Gilda a Vhar'Ul fino al terzo livello, fra strutture di metallo che pulsavano. Nel rapporto scrisse di tre uomini persi senza urla né sangue e di rumori dentro le pareti, e poi la rovina fu sigillata."
    requisiti: [rovine.dorr == 0]

  - id: arelan-dorr-ritrovato
    nome: Arelan Dorr
    alias: [Dorr]
    tipo: personaggio
    sottotitolo: "Il supervisore della spedizione a Vhar'Ul"
    testo: "Raschiatore che quarant'anni fa guidò la spedizione a Vhar'Ul e perse tre uomini al terzo livello. Il vecchio Ferro diceva che se n'era andato a Ghoran con la paga; invece è tornato giù ed è morto dietro una paratia saldata, con la piastrina al collo."
    requisiti: [rovine.dorr >= 1]

  - id: nhar-kael
    nome: Nhar'Kael
    tipo: creatura
    sottotitolo: "La Regina delle Ali Spezzate"
    testo: "Entità che i culti chiamano la Regina delle Ali Spezzate. Nelle statue è una donna gravida con la testa d'uccello e le zampe artigliate, e due ali spezzate di piuma che a metà diventa metallo. Chi la serve fonde la propria carne con la macchina."
    requisiti: [pista.capomozzo >= 5]
