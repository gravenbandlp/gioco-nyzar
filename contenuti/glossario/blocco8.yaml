# Glossario del blocco 8: l'Arena, Sotto la pelle di Qir-Azel, le rovine dei Raschiatori e Topi in cantina.
# Presentazioni generali, senza i fatti delle piste; le voci che sarebbero spoiler compaiono solo quando il
# giocatore ci è arrivato. Dove la trama cambia un PNG o un luogo (Sotto la pelle, l'Arena, Arelan Dorr) c'è una
# variante con lo stesso nome e requisiti complementari: vale la prima voce i cui requisiti sono soddisfatti.
# Orvald, Orazio, Besk, Nestor, Borso, Mauro, Mirko, Ottone, Julia, Galdrick e Dragna stanno già in personaggi.yaml.
glossario:
  # ------------------------------------------------------------ i Tamberlo
  - id: rilla-tamberlo
    nome: Rilla Tamberlo
    alias: [Rilla]
    tipo: personaggio
    sottotitolo: "La figlia minore di Oddo Tamberlo"
    testo: "Figlia minore di Oddo e Berta Tamberlo. Ha ventidue anni e i capelli rossi, e lavora al bancone dell'Emporio quando la sorella non la manda nel retro, e ogni tanto recita nelle compagnie di Orazio Belcanto. Porta sempre un nastro o un fiocco più del necessario, e le sue storie fanno il giro della Città Bassa prima di quelle dei banditori."
    requisiti: []

  - id: oddo-tamberlo
    nome: Oddo Tamberlo
    alias: [Oddo]
    tipo: personaggio
    sottotitolo: "Il padrone dell'Emporio Tamberlo"
    testo: "Proprietario dell'Emporio Tamberlo, la bottega più antica della Città Bassa. È un uomo grosso, con i baffi curati e il panciotto scuro, che conta il resto due volte e protegge le figlie fino al ridicolo. Si arrabbia in fretta e si calma in cinque minuti. La sera beve al Grifone di Ferro e racconta sempre gli stessi aneddoti."
    requisiti: []

  - id: berta-tamberlo
    nome: Berta Tamberlo
    alias: [Berta]
    tipo: personaggio
    sottotitolo: "La moglie di Oddo Tamberlo"
    testo: "Moglie di Oddo Tamberlo. Passa le giornate nella cucina sul retro dell'Emporio, dove sforna il pane e le torte di mele che a Qir-Azel conoscono tutti, e in bottega si vede poco. Fra le due figlie fa da paciera senza mai alzare la voce, e mentre parla non smette di impastare."
    requisiti: []

  - id: elsa-tamberlo
    nome: Elsa Tamberlo
    alias: [Elsa]
    tipo: personaggio
    sottotitolo: "La figlia maggiore di Oddo Tamberlo"
    testo: "Figlia maggiore di Oddo. È bruna e ha sempre la battuta pronta. Manda avanti il bancone dell'Emporio insieme al padre e tiene i conti meglio di lui, con un grembiule rosso che la sorella le ruba un giorno sì e uno no, e che lei si riprende ogni volta. Da qualche tempo in città la si nomina insieme a Rennick Dole, quello della Segheria."
    requisiti: []

  - id: emporio-tamberlo
    nome: Emporio Tamberlo
    alias: [Emporio]
    tipo: luogo
    sottotitolo: "La bottega più antica della Città Bassa"
    testo: "Bottega della famiglia Tamberlo sulla strada che sale verso i Ponti, con le zappe appese fuori dalla porta. Dentro si trova quasi di tutto, dalle cinghie per i muli ai chiodi venduti a peso. Sul bancone c'è sempre una torta di Berta sotto una campana di vetro, che non è in vendita, e sotto il pavimento c'è una cantina."
    requisiti: []

  # ------------------------------------------------------------ l'Arena
  - id: arena-di-qir-azel
    nome: Arena di Qir-Azel
    alias: [Arena]
    tipo: luogo
    sottotitolo: "Le mura più vecchie dei Quartieri Alti"
    testo: "Anfiteatro al limitare nord-ovest dei Quartieri Alti, più antico dei palazzi che gli sono cresciuti intorno. Le mura di pietra sono rinforzate con archi e nervature di metallo prese dalle rovine dei Precursori, e una cintura di cristalli conduttori protegge la folla e i combattenti. È rimasta chiusa per anni, e ogni volta che riapre la città scommette su tutto."
    requisiti: [pista.arena < 5]

  - id: arena-di-qir-azel-riaperta
    nome: Arena di Qir-Azel
    alias: [Arena]
    tipo: luogo
    sottotitolo: "Le mura più vecchie dei Quartieri Alti"
    testo: "Anfiteatro al limitare nord-ovest dei Quartieri Alti, più antico dei palazzi che gli sono cresciuti intorno. Le mura di pietra sono rinforzate con archi e nervature di metallo prese dalle rovine dei Precursori, e una cintura di cristalli conduttori protegge la folla e i combattenti. È rimasta chiusa per anni, e dopo il torneo delle Tre Prove non ha più chiuso."
    requisiti: [pista.arena >= 5]

  - id: durgan
    nome: Durgan
    tipo: personaggio
    sottotitolo: "Mercenario della Città Bassa"
    testo: "Nano massiccio con il volto coperto di cicatrici e una grande ascia da battaglia, che si porta sulla spalla come un attrezzo da lavoro. Lo si vede spesso alla Pignatta Grassa, al tavolo di Mauro Scrocco. Chi ci ha avuto a che fare racconta che durante un combattimento non apre mai bocca."
    requisiti: [pista.arena >= 1, pista.pelle < 6]

  - id: durgan-dopo-la-pignatta
    nome: Durgan
    tipo: personaggio
    sottotitolo: "Mercenario della Città Bassa"
    testo: "Nano massiccio con il volto coperto di cicatrici e una grande ascia da battaglia, che si porta sulla spalla come un attrezzo da lavoro. Lo si vedeva spesso alla Pignatta Grassa, al tavolo di Mauro Scrocco, finché la taverna non è bruciata. Chi ci ha avuto a che fare racconta che durante un combattimento non apre mai bocca."
    requisiti: [pista.arena >= 1, pista.pelle >= 6]

  - id: ilvaena-sorathe
    nome: Ilvaena Sorathe
    alias: [Ilvaena]
    tipo: personaggio
    sottotitolo: "Cacciatrice di orchi"
    testo: "Elfa, cacciatrice di taglie, la più esperta di Qir-Azel quando si tratta di orchi. Vive ai margini occidentali del Bosco di Velthar e torna in città per riferire allo sceriffo sui movimenti delle tribù, alloggiando al Grifone di Ferro dalla sua amica Liaren Tarvelin. Ha i capelli color rame, e in viaggio non posa mai l'arco lungo."
    requisiti: []

  - id: dolovan-stroud
    nome: Dolovan Stroud
    alias: [Dolovan]
    tipo: personaggio
    sottotitolo: "Lo stalliere della Zanna Rotta"
    testo: "Proprietario delle Scuderie della Zanna Rotta, in Città Bassa, ed ex cacciatore. Una lontana ascendenza elfica lo fa sembrare più giovane dei suoi anni. Odia gli orchi più di qualunque altra cosa al mondo e passa allo sceriffo quello che sa delle tribù. Con i cavalli è gentile, e il suo cavallo da guerra si chiama Squash."
    requisiti: []

  - id: ettore-castaldi
    nome: Ettore Castaldi
    alias: [Ettore]
    tipo: personaggio
    sottotitolo: "Il padrone della Birreria del Paladino Stanco"
    testo: "Cugino della Rappresentante Julia Castaldi. Era un paladino del Grande Albero Rosso di belle speranze, finché l'incendio del Santuario, nel 145 D.C., non gli ha fatto vacillare la fede. Ha appeso l'armatura al muro e ha aperto la Birreria del Paladino Stanco. Lì produce birra e idromele, e ascolta i clienti senza giudicarli."
    requisiti: []

  - id: tenebra
    nome: Tenebra
    tipo: personaggio
    sottotitolo: "Il capo dei Raschiatori"
    testo: "Capo dei Raschiatori, anche se ufficialmente i Quattro Scavatori non hanno un capo, e loro voce nel Consiglio di Qir-Azel. Ha il volto in parte bruciato dal Mana corrotto, con vene che gli brillano piano sotto la pelle. Parla poco e sempre a voce bassa. Insegna alle reclute a riconoscere la paura, perché è quella che le riporta in superficie."
    requisiti: []

  # ------------------------------------------------------------ i Malgrani
  - id: lucia-malgrani
    nome: Lucia Malgrani
    alias: [Lucia]
    tipo: personaggio
    sottotitolo: "La moglie di Ottone Malgrani"
    testo: "Moglie di Ottone Malgrani, più giovane di lui e attaccata alle tradizioni quanto lui, e madre di tre figli piccoli. Vive quasi sempre chiusa nel Maniero, e con gli ospiti parla solo per dovere. L'unica uscita che si concede con regolarità è il Teatro delle Meraviglie. Chi la conosceva da ragazza la ricorda più allegra."
    requisiti: [pista.pelle < 7]

  - id: lucia-malgrani-a-ghoran
    nome: Lucia Malgrani
    alias: [Lucia]
    tipo: personaggio
    sottotitolo: "La moglie di Ottone Malgrani"
    testo: "Moglie di Ottone Malgrani, più giovane di lui e attaccata alle tradizioni quanto lui, e madre di tre figli piccoli. Per anni è vissuta chiusa nel Maniero, uscendo soltanto per il Teatro delle Meraviglie. Dopo la condanna del marito ha lasciato Qir-Azel per Ghoran, dove i suoi figli stavano già con la zia Urtilia."
    requisiti: [pista.pelle >= 7]

  - id: urtilia-mendion
    nome: Urtilia Mendion
    alias: [Urtilia]
    tipo: personaggio
    sottotitolo: "La zia di Ottone Malgrani"
    testo: "Sorella minore del vecchio Brandano Malgrani e zia di Ottone. Il suo busto sta nell'atrio del Maniero, accanto a quelli di Brandano e della moglie Vermilia, che la casata ricorda fra i fondatori di Qir-Azel. Da decenni vive a Ghoran, dove amministra gli affari della casata, mercato degli schiavi compreso. In città la nominano a bassa voce, e si dice che sia una maga potente."
    requisiti: []

  - id: roldan-kael
    nome: Roldan Kael
    alias: [Roldan]
    tipo: personaggio
    sottotitolo: "Il caposquadra delle guardie dei Malgrani"
    testo: "Caposquadra delle guardie del Maniero Malgrani, un veterano con la barba tagliata a filo e un fischietto d'osso appeso al collo. Di notte resta nel salone e risponde a ogni allarme, e ogni ora sale a controllare lo studio del padrone. Le sue guardie hanno più paura di lui che dei ladri."
    requisiti: [pista.pelle >= 1, pista.pelle < 7]

  - id: roldan-kael-senza-padrone
    nome: Roldan Kael
    alias: [Roldan]
    tipo: personaggio
    sottotitolo: "L'ex caposquadra delle guardie dei Malgrani"
    testo: "Era il caposquadra delle guardie del Maniero Malgrani, un veterano con la barba tagliata a filo e un fischietto d'osso appeso al collo. Di notte restava nel salone e ogni ora saliva a controllare lo studio del padrone. Dopo la condanna di Ottone il Maniero è stato venduto, e le guardie in livrea verde hanno perso il loro posto."
    requisiti: [pista.pelle >= 7]

  - id: maniero-malgrani
    nome: Maniero Malgrani
    alias: [Maniero dei Malgrani]
    tipo: luogo
    sottotitolo: "La residenza dei Malgrani nei Quartieri Alti"
    testo: "Residenza della famiglia Malgrani nell'area settentrionale dei Quartieri Alti, oltre le ronde, fra pini contorti. Il cancello di ferro battuto porta un alloro dorato, e nel cortile le statue degli antenati sono consumate dalla pioggia. Ottone vi riceve molto e mai gli stessi ospiti due volte, e di notte la finestra del suo studio resta accesa fino a tardi."
    requisiti: [pista.pelle < 7]

  - id: maniero-malgrani-venduto
    nome: Maniero Malgrani
    alias: [Maniero dei Malgrani]
    tipo: luogo
    sottotitolo: "L'ex residenza dei Malgrani nei Quartieri Alti"
    testo: "Residenza della famiglia Malgrani nell'area settentrionale dei Quartieri Alti, oltre le ronde, fra pini contorti. Il cancello di ferro battuto porta un alloro dorato, e nel cortile le statue degli antenati sono consumate dalla pioggia. Dopo la condanna di Ottone il Maniero è stato venduto, e il Consiglio vuole farne un istituto di studi."
    requisiti: [pista.pelle >= 7]

  # ------------------------------------------------------------ le rovine
  - id: vhar-ul
    nome: Vhar'Ul
    alias: [Vhar-Ul]
    tipo: luogo
    sottotitolo: "Una rovina sigillata a sud della città"
    testo: "Ingresso secondario alle rovine dei Precursori, mezza giornata a sud oltre gli ultimi ponti, in fondo a una conca di basalto. Il nome viene dall'iscrizione incisa nel metallo del portale. Quarant'anni fa una squadra di Raschiatori pagata dalla Gilda arrivò al terzo livello e perse tre uomini, e da allora l'ingresso porta il sigillo della Gilda."
    requisiti: []

  - id: laboratorio-di-calibrazione
    nome: Laboratorio di Calibrazione
    tipo: luogo
    sottotitolo: "Una rovina dei Precursori a sud-est"
    testo: "Rovina dei Precursori dentro una collina di roccia vetrosa, a due giorni di cammino a sud-est di Qir-Azel, fatta di corridoi stretti e di camere di metallo liscio attraversate da linee di luce. Serviva a tarare macchine che oggi nessuno sa costruire. I suoi sistemi funzionano ancora e misurano chiunque passi, e certi Raschiatori ne sono tornati con le vertebre allineate al millimetro."
    requisiti: []

  - id: mahr-kel
    nome: Mahr-Kel
    alias: [Sito Mahr-Kel]
    tipo: luogo
    sottotitolo: "Un complesso sigillato a sud-ovest"
    testo: "Complesso sotterraneo dei Precursori a un giorno e mezzo di cammino da Qir-Azel, giù nelle terre basse di sud-ovest, con il nome inciso più volte sulle paratie. I Raschiatori lo scoprirono trentacinque anni fa e lo abbandonarono dopo i vapori tossici e un uomo morto per il braccio rimasto preso in una porta. La Gilda lo ha dichiarato instabile, e i suoi condotti di raffreddamento non si sono mai spenti."
    requisiti: []

  - id: arelan-dorr
    nome: Arelan Dorr
    alias: [Dorr]
    tipo: personaggio
    sottotitolo: "Il supervisore della spedizione a Vhar'Ul"
    testo: "Raschiatore che quarant'anni fa guidò come supervisore la spedizione a Vhar'Ul, durante la cartografia del sottosuolo pagata dalla Gilda. Arrivò fino al terzo livello, dove trovò strutture di metallo che pulsavano. Nel suo rapporto scrisse di tre uomini persi senza urla né sangue e di rumori che si muovevano dentro le pareti, e dopo di lui la rovina fu sigillata."
    requisiti: [rovine.dorr == 0]

  - id: arelan-dorr-ritrovato
    nome: Arelan Dorr
    alias: [Dorr]
    tipo: personaggio
    sottotitolo: "Il supervisore della spedizione a Vhar'Ul"
    testo: "Raschiatore che quarant'anni fa guidò come supervisore la spedizione a Vhar'Ul, durante la cartografia del sottosuolo pagata dalla Gilda, e perse tre uomini al terzo livello. Il vecchio Ferro diceva che se n'era andato a Ghoran con la paga. Invece è tornato giù da solo, si è chiuso dietro una paratia saldata ed è morto lì, con la piastrina al collo."
    requisiti: [rovine.dorr >= 1]

  - id: nhar-kael
    nome: Nhar'Kael
    tipo: creatura
    sottotitolo: "La Regina delle Ali Spezzate"
    testo: "Entità che i suoi culti chiamano la Regina delle Ali Spezzate. Le sue statue la mostrano come una donna gravida con la testa d'uccello dal becco lungo e le zampe artigliate. Dalle scapole le escono due ali spezzate, di piuma che a metà diventa metallo. Chi la serve cerca di somigliarle e fonde la propria carne con la macchina, finché la differenza si perde."
    requisiti: [pista.capomozzo >= 5]
