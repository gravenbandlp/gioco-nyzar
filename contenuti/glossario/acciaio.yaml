# Glossario del blocco 6, Acciaio e Ira: i Tarvelin che il giocatore conosce dalla storia di Brunella
# e quello che si trova sotto l'Acciaieria. Presentazioni generali, senza i fatti della pista; le voci
# che sarebbero spoiler compaiono solo quando il giocatore ci è arrivato (requisiti sulla pista).
# Chi muore nella pista (Isvaro, Yoggoth) e il Pozzo dei Sigilli, che si distrugge, hanno una variante con lo
# stesso nome: vale la prima voce i cui requisiti sono soddisfatti. Il nome del Pozzo si legge solo sul foglio
# della Madre (pista.acciaio 7 → 8).
# Brunella Fennick sta già in personaggi.yaml.
glossario:
  - id: isvaro-tarvelin
    nome: Isvaro Tarvelin
    alias: [Isvaro]
    tipo: personaggio
    sottotitolo: "Il figlio mezzelfo di Maerith Tarvelin"
    testo: "Mezzelfo nato da Maerith un anno prima di Liaren Tarvelin. Ondrel non l'ha mai considerato suo e lo ha cresciuto all'Accademia di Torvessa, dove vinceva tutte le gare d'arco. Al funerale della madre ha maledetto il padre ed è sparito da Qir-Azel."
    requisiti: [pista.acciaio >= 2, isvaro == 0]

  - id: isvaro-tarvelin-fuggito
    nome: Isvaro Tarvelin
    alias: [Isvaro]
    tipo: personaggio
    sottotitolo: "Il figlio mezzelfo di Maerith Tarvelin"
    testo: "Mezzelfo nato da Maerith un anno prima di Liaren Tarvelin, cresciuto all'Accademia di Torvessa. Al funerale della madre ha maledetto il padre ed è sparito. È tornato con gli orchi, ed è fuggito con loro dall'Acciaieria oltre il muro abbattuto dei magazzini."
    requisiti: [isvaro == 1]

  - id: isvaro-tarvelin-prigioniero
    nome: Isvaro Tarvelin
    alias: [Isvaro]
    tipo: personaggio
    sottotitolo: "Il figlio mezzelfo di Maerith Tarvelin"
    testo: "Mezzelfo nato da Maerith un anno prima di Liaren Tarvelin, cresciuto all'Accademia di Torvessa. Al funerale della madre ha maledetto il padre ed è sparito. È tornato con gli orchi, l'hanno preso vivo nell'Acciaieria e adesso sta in una cella della Caserma."
    requisiti: [isvaro == 2]

  - id: isvaro-tarvelin-morto
    nome: Isvaro Tarvelin
    alias: [Isvaro]
    tipo: personaggio
    sottotitolo: "Il figlio mezzelfo di Maerith Tarvelin"
    testo: "Mezzelfo nato da Maerith un anno prima di Liaren Tarvelin, arciere dell'Accademia di Torvessa. Al funerale della madre ha maledetto il padre ed è sparito. È tornato con gli orchi ed è morto nell'Acciaieria, cadendo dalla scala dei magazzini."
    requisiti: [isvaro == 3]

  - id: maerith-tarvelin
    nome: Maerith Tarvelin
    alias: [Maerith]
    tipo: personaggio
    sottotitolo: "La moglie di Ondrel Tarvelin"
    testo: "Moglie di Ondrel Tarvelin e madre di Liaren e di Isvaro, morta dieci anni fa, secondo la famiglia di febbre. Del padre di Isvaro non disse mai il nome. Dopo la sua morte Ondrel ha incatenato il cancello del suo giardino al Maniero."
    requisiti: [pista.acciaio >= 2]

  - id: segrete-dell-ira
    nome: Segrete dell'Ira
    alias: [Segrete]
    tipo: luogo
    sottotitolo: "Le prigioni dei Precursori sotto la Città Bassa"
    testo: "Prigioni e sale scavate dai Precursori nella roccia sotto la Città Bassa, raggiunte da un vecchio tunnel di contrabbandieri murato che passa sotto l'Acciaieria. Al centro c'è l'Aula dell'Ira, grande come una cattedrale e fredda come una cantina d'inverno."
    requisiti: [pista.acciaio >= 6]

  - id: colata-dell-ira
    nome: Colata dell'Ira
    alias: [Colate dell'Ira, Colata, Colate]
    tipo: creatura
    sottotitolo: "La creatura della vasca dell'Aula dell'Ira"
    testo: "Creatura distillata dalla rabbia dei morti nella vasca dell'Aula dell'Ira. Ha un corpo glabro e magro, le gambe piegate all'indietro e una bocca piena di piccole mani a tre dita al posto dei denti. Attacca chiunque trovi, e morendo si sfa in una pozza grigia."
    requisiti: [pista.acciaio >= 6]

  - id: yoggoth
    nome: Yoggoth
    tipo: creatura
    sottotitolo: "Il demone delle Segrete dell'Ira"
    testo: "Il demone che custodisce le Segrete dell'Ira dalla caduta dei Precursori. Alto più di tre metri, ha quattro braccia, le due superiori chiuse in chele, e una testa da coccodrillo. Parla di sé come del possente Yoggoth e ha perso il senno da molto tempo."
    requisiti: [pista.acciaio == 6]

  - id: yoggoth-morto
    nome: Yoggoth
    tipo: creatura
    sottotitolo: "Il demone delle Segrete dell'Ira, morto"
    testo: "Il demone con quattro braccia e la testa da coccodrillo che custodiva le Segrete dell'Ira dalla caduta dei Precursori. Parlava di sé come del possente Yoggoth e aveva perso il senno da tempo. È morto nell'Aula dell'Ira, accanto alla vasca che custodiva."
    requisiti: [pista.acciaio >= 7]

  - id: pozzo-dei-sigilli
    nome: Pozzo dei Sigilli
    tipo: cosa
    sottotitolo: "La vasca triangolare dell'Aula dell'Ira"
    testo: "Vasca triangolare dei Precursori su un pulpito di pietra nell'Aula dell'Ira. Conserva la rabbia dei morti in un liquido arancione che ribolle senza scaldare. Bagnata di sangue apre una crepa nell'aria da cui escono le Colate dell'Ira, e ogni Colata la svuota un poco."
    requisiti: [pista.acciaio == 7]

  - id: pozzo-dei-sigilli-spaccato
    nome: Pozzo dei Sigilli
    tipo: cosa
    sottotitolo: "La vasca triangolare dell'Aula dell'Ira"
    testo: "Vasca triangolare dei Precursori nell'Aula dell'Ira, che faceva Colate dalla rabbia dei morti; il nome si legge su un foglio della Madre del Velo. Svuotata una Colata alla volta, riempita di acqua benedetta e fatta bollire per un giorno intero, all'alba si è spaccata."
    requisiti: [pista.acciaio >= 8]
