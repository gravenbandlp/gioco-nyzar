# Glossario del blocco 6, Acciaio e Ira: i Tarvelin che il giocatore conosce dalla storia di Brunella
# e quello che si trova sotto l'Acciaieria. Presentazioni generali, senza i fatti della pista; le voci
# che sarebbero spoiler compaiono solo quando il giocatore ci è arrivato (requisiti sulla pista).
# Brunella Fennick sta già in personaggi.yaml.
glossario:
  - id: isvaro-tarvelin
    nome: Isvaro Tarvelin
    alias: [Isvaro]
    tipo: personaggio
    sottotitolo: "Il figlio mezzelfo di Maerith Tarvelin"
    testo: "Mezzelfo, nato un anno prima di Liaren Tarvelin dalla madre Maerith. Ondrel non l'ha mai considerato suo figlio e lo ha fatto crescere all'Accademia di Torvessa, lontano dal Maniero. Al funerale della madre ha maledetto il padre davanti a tutti e se n'è andato da Qir-Azel. Tira con l'arco meglio di chiunque in città."
    requisiti: [pista.acciaio >= 2]

  - id: maerith-tarvelin
    nome: Maerith Tarvelin
    alias: [Maerith]
    tipo: personaggio
    sottotitolo: "La moglie di Ondrel Tarvelin"
    testo: "Moglie di Ondrel Tarvelin e madre di Liaren e di Isvaro, morta una decina d'anni fa. Del padre di Isvaro non disse mai il nome, nemmeno al marito, che restò sposato con lei lo stesso. Il giardino del Maniero Tarvelin era il suo vanto, e dopo la sua morte Ondrel ne ha fatto chiudere il cancello con le catene."
    requisiti: [pista.acciaio >= 2]

  - id: segrete-dell-ira
    nome: Segrete dell'Ira
    alias: [Segrete]
    tipo: luogo
    sottotitolo: "Le prigioni dei Precursori sotto la Città Bassa"
    testo: "Prigioni e sale scavate dai Precursori nella roccia sotto la Città Bassa. Ci si arriva da un vecchio tunnel di contrabbandieri che passa sotto l'Acciaieria, chiuso per decenni da un muro di mattoni. Al centro c'è l'Aula dell'Ira, grande come una cattedrale e più fredda di una cantina d'inverno."
    requisiti: [pista.acciaio >= 6]

  - id: colata-dell-ira
    nome: Colata dell'Ira
    alias: [Colate dell'Ira, Colata, Colate]
    tipo: creatura
    sottotitolo: "La creatura del Pozzo dei Sigilli"
    testo: "Creatura distillata dalla rabbia dei morti nel Pozzo dei Sigilli delle Segrete dell'Ira. Ha un corpo glabro e magro, le gambe piegate all'indietro e, al posto dei denti, una bocca piena di piccole mani a tre dita. Si muove a scatti, a volte su quattro zampe, e attacca chiunque trovi davanti. Quando muore si sfa in una pozza grigia."
    requisiti: [pista.acciaio >= 6]

  - id: yoggoth
    nome: Yoggoth
    tipo: creatura
    sottotitolo: "Il demone delle Segrete dell'Ira"
    testo: "Il demone che custodisce le Segrete dell'Ira da quando i Precursori sono caduti. È alto più di tre metri, ha quattro braccia, le due superiori chiuse in chele enormi, e una testa da coccodrillo con le zanne ricurve. Parla una lingua che quasi nessuno capisce, e da molto tempo ha perso il senno."
    requisiti: [pista.acciaio >= 6]

  - id: pozzo-dei-sigilli
    nome: Pozzo dei Sigilli
    tipo: cosa
    sottotitolo: "La vasca triangolare dell'Aula dell'Ira"
    testo: "Vasca triangolare dei Precursori, in cima a un pulpito di pietra nell'Aula dell'Ira. Raccoglie la rabbia delle anime dei morti e la conserva in un liquido arancione che ribolle senza scaldare. Bagnata di sangue apre una crepa nell'aria da cui escono le Colate dell'Ira, e ogni Colata la svuota un poco."
    requisiti: [pista.acciaio >= 6]
