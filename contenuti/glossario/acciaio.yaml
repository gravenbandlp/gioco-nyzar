# Glossario del blocco 6, Acciaio e Ira: i Tarvelin che il giocatore conosce dalla storia di Brunella
# e quello che si trova sotto l'Acciaieria. Presentazioni generali, senza i fatti della pista; le voci
# che sarebbero spoiler compaiono solo quando il giocatore ci è arrivato (requisiti sulla pista).
# Chi muore nella pista (Isvaro, Yoggoth) e il Pozzo dei Sigilli, che si distrugge, hanno una variante con lo
# stesso nome: vale la prima voce i cui requisiti sono soddisfatti. Il nome del Pozzo si legge solo sul foglio
# della Madre (pista.acciaio 7 → 8).
# Brunella Fennick sta già in personaggi.yaml.
glossario:
  - id: isvaro-tarvelin
    nome: Isvaro Tarvelin
    alias: [Isvaro]
    tipo: personaggio
    sottotitolo: "Il figlio mezzelfo di Maerith Tarvelin"
    testo: "Mezzelfo, nato un anno prima di Liaren Tarvelin dalla madre Maerith. Ondrel non l'ha mai considerato suo figlio e lo ha fatto crescere all'Accademia di Torvessa, lontano dal Maniero. Al funerale della madre ha maledetto il padre davanti a tutti e se n'è andato da Qir-Azel. All'Accademia vinceva tutte le gare d'arco."
    requisiti: [pista.acciaio >= 2, isvaro == 0]

  - id: isvaro-tarvelin-fuggito
    nome: Isvaro Tarvelin
    alias: [Isvaro]
    tipo: personaggio
    sottotitolo: "Il figlio mezzelfo di Maerith Tarvelin"
    testo: "Mezzelfo, nato un anno prima di Liaren Tarvelin dalla madre Maerith, cresciuto all'Accademia di Torvessa lontano dal Maniero. Al funerale della madre ha maledetto il padre davanti a tutti e se n'è andato da Qir-Azel. È tornato con gli orchi, e dall'Acciaieria del padre è scappato con loro oltre il muro abbattuto dei magazzini."
    requisiti: [isvaro == 1]

  - id: isvaro-tarvelin-prigioniero
    nome: Isvaro Tarvelin
    alias: [Isvaro]
    tipo: personaggio
    sottotitolo: "Il figlio mezzelfo di Maerith Tarvelin"
    testo: "Mezzelfo, nato un anno prima di Liaren Tarvelin dalla madre Maerith, cresciuto all'Accademia di Torvessa lontano dal Maniero. Al funerale della madre ha maledetto il padre davanti a tutti e se n'è andato da Qir-Azel. È tornato con gli orchi, e l'hanno preso vivo nell'Acciaieria del padre. Adesso sta in una cella della Caserma, con le mani legate."
    requisiti: [isvaro == 2]

  - id: isvaro-tarvelin-morto
    nome: Isvaro Tarvelin
    alias: [Isvaro]
    tipo: personaggio
    sottotitolo: "Il figlio mezzelfo di Maerith Tarvelin"
    testo: "Mezzelfo, nato un anno prima di Liaren Tarvelin dalla madre Maerith, cresciuto all'Accademia di Torvessa lontano dal Maniero, dove vinceva tutte le gare d'arco. Al funerale della madre ha maledetto il padre davanti a tutti e se n'è andato da Qir-Azel. È tornato con gli orchi, ed è morto nell'Acciaieria del padre, cadendo dalla scala dei magazzini."
    requisiti: [isvaro == 3]

  - id: maerith-tarvelin
    nome: Maerith Tarvelin
    alias: [Maerith]
    tipo: personaggio
    sottotitolo: "La moglie di Ondrel Tarvelin"
    testo: "Moglie di Ondrel Tarvelin e madre di Liaren e di Isvaro, morta una decina d'anni fa, secondo la famiglia di una febbre. Del padre di Isvaro non disse mai il nome, nemmeno al marito, che restò sposato con lei lo stesso. Il giardino del Maniero Tarvelin era il suo vanto, e dopo la sua morte Ondrel ne ha fatto chiudere il cancello con le catene."
    requisiti: [pista.acciaio >= 2]

  - id: segrete-dell-ira
    nome: Segrete dell'Ira
    alias: [Segrete]
    tipo: luogo
    sottotitolo: "Le prigioni dei Precursori sotto la Città Bassa"
    testo: "Prigioni e sale scavate dai Precursori nella roccia sotto la Città Bassa. Ci si arriva da un vecchio tunnel di contrabbandieri che passa sotto l'Acciaieria, murato per decenni. Al centro c'è l'Aula dell'Ira, grande come una cattedrale e più fredda di una cantina d'inverno."
    requisiti: [pista.acciaio >= 6]

  - id: colata-dell-ira
    nome: Colata dell'Ira
    alias: [Colate dell'Ira, Colata, Colate]
    tipo: creatura
    sottotitolo: "La creatura della vasca dell'Aula dell'Ira"
    testo: "Creatura distillata dalla rabbia dei morti nella vasca triangolare dell'Aula dell'Ira, nelle Segrete. Ha un corpo glabro e magro, le gambe piegate all'indietro e, al posto dei denti, una bocca piena di piccole mani a tre dita. Si muove a scatti, a volte su quattro zampe, e attacca chiunque trovi davanti. Quando muore si sfa in una pozza grigia."
    requisiti: [pista.acciaio >= 6]

  - id: yoggoth
    nome: Yoggoth
    tipo: creatura
    sottotitolo: "Il demone delle Segrete dell'Ira"
    testo: "Il demone che custodisce le Segrete dell'Ira da quando i Precursori sono caduti. È alto più di tre metri, ha quattro braccia, le due superiori chiuse in chele enormi, e una testa da coccodrillo con le zanne ricurve. Parla di sé come del possente Yoggoth, con una voce che vibra nello sterno, e da molto tempo ha perso il senno."
    requisiti: [pista.acciaio == 6]

  - id: yoggoth-morto
    nome: Yoggoth
    tipo: creatura
    sottotitolo: "Il demone delle Segrete dell'Ira, morto"
    testo: "Il demone che ha custodito le Segrete dell'Ira da quando i Precursori sono caduti. Era alto più di tre metri, aveva quattro braccia, le due superiori chiuse in chele enormi, e una testa da coccodrillo con le zanne ricurve. Parlava di sé come del possente Yoggoth e aveva perso il senno da molto tempo. È morto nell'Aula dell'Ira, accanto alla vasca che custodiva."
    requisiti: [pista.acciaio >= 7]

  - id: pozzo-dei-sigilli
    nome: Pozzo dei Sigilli
    tipo: cosa
    sottotitolo: "La vasca triangolare dell'Aula dell'Ira"
    testo: "Vasca triangolare dei Precursori, in cima a un pulpito di pietra nell'Aula dell'Ira. Raccoglie la rabbia delle anime dei morti e la conserva in un liquido arancione che ribolle senza scaldare. Bagnata di sangue apre una crepa nell'aria da cui escono le Colate dell'Ira, e ogni Colata la svuota un poco."
    requisiti: [pista.acciaio == 7]

  - id: pozzo-dei-sigilli-spaccato
    nome: Pozzo dei Sigilli
    tipo: cosa
    sottotitolo: "La vasca triangolare dell'Aula dell'Ira"
    testo: "Vasca triangolare dei Precursori, in cima a un pulpito di pietra nell'Aula dell'Ira, che raccoglieva la rabbia delle anime dei morti e ne faceva Colate dell'Ira. Il nome si legge su un foglio della Madre del Velo. Svuotata una Colata alla volta, l'hanno riempita di acqua benedetta e fatta bollire per un giorno intero, finché all'alba si è spaccata."
    requisiti: [pista.acciaio >= 8]
