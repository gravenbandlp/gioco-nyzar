# Glossario del blocco 7, Capomozzo: i luoghi e i personaggi della pista e quello che il giocatore trova
# sotto la fortezza. Presentazioni generali, senza i fatti della pista; le voci che sarebbero spoiler
# compaiono solo quando il giocatore ci è arrivato (requisiti sulla pista). Chi muore o cambia stato nella
# pista (Balthog, Borgoth, Aurenne) ha una variante con lo stesso nome: vale la prima voce i cui requisiti
# sono soddisfatti.
# La Madre del Velo sta già in personaggi.yaml, il Labirinto di Darn-Morakh in luoghi.yaml.
glossario:
  - id: capomozzo
    nome: Capomozzo
    tipo: luogo
    sottotitolo: "L'isola della tribù di Balthog"
    testo: "Piccola isola tonda davanti alla costa di Rovolungo, che dalla terraferma ha il profilo di una testa mozzata. Scogliere e correnti impediscono lo sbarco, e solo la tribù orchesca che ci vive sa come arrivarci da terra. Le altre tribù ci girano alla larga."
    requisiti: []

  - id: rovolungo
    nome: Rovolungo
    tipo: luogo
    sottotitolo: "La macchia della costa settentrionale"
    testo: "Fascia di rovi e di cardi alti come una casa sulla costa settentrionale, lontana da Qir-Azel più di due giorni di cammino. Pochi cacciatori ci si avventurano. Lo attraversano soprattutto bande di orchi in transito e il predone Zagrath."
    requisiti: []

  - id: balthog-il-prescelto
    nome: Balthog il Prescelto
    alias: [Balthog]
    tipo: personaggio
    sottotitolo: "Capo della tribù di Capomozzo"
    testo: "Capo della tribù orchesca di Capomozzo, che lo segue come il Prescelto di un'entità che gli orchi non nominano, e lui porta il titolo con la compostezza di un sacerdote. Il suo braccio destro era Dorbak, il capoguerra ucciso durante la razzia delle Foglie Alate."
    requisiti: [balthog == 0]

  - id: balthog-il-prescelto-morto
    nome: Balthog il Prescelto
    alias: [Balthog]
    tipo: personaggio
    sottotitolo: "Capo della tribù di Capomozzo, morto"
    testo: "Capo degli orchi di Capomozzo, che lo seguivano come il Prescelto di un'entità senza nome. Combatteva a mani nude e non aveva cicatrici in faccia. È morto nella sala del trono, sugli spuntoni di un pilastro. Il suo braccio destro, Dorbak, morì nella razzia."
    requisiti: [balthog == 1]

  - id: balthog-il-prescelto-battuto
    nome: Balthog il Prescelto
    alias: [Balthog]
    tipo: personaggio
    sottotitolo: "Capo della tribù di Capomozzo"
    testo: "Capo della tribù orchesca di Capomozzo, che lo segue come il Prescelto di un'entità senza nome. Combatte a mani nude e non aveva mai perso, finché non è stato battuto nella sua sala e lasciato vivo davanti al trono, con un ginocchio spezzato."
    requisiti: [balthog == 2]

  - id: borgoth-il-gigante
    nome: Borgoth il Gigante
    alias: [Borgoth]
    tipo: personaggio
    sottotitolo: "Eroe della tribù di Fondobosco"
    testo: "Eroe della tribù orchesca di Fondobosco, figlio di un orco e di una ogre, di una stirpe quasi scomparsa. È più alto di qualunque orco, preferisce la caccia al potere, e alle assemblee della tribù parla per ultimo; di solito dopo di lui nessuno ribatte."
    requisiti: [borgoth != 1]

  - id: borgoth-il-gigante-morto
    nome: Borgoth il Gigante
    alias: [Borgoth]
    tipo: personaggio
    sottotitolo: "Eroe della tribù di Fondobosco, morto"
    testo: "Eroe degli orchi di Fondobosco, figlio di un orco e di una ogre, più alto di qualunque orco e più interessato alla caccia che al potere. Cacciato da Balthog, viveva in una tana fra i rovi di Rovolungo, dove è morto accanto al suo puma."
    requisiti: [borgoth == 1]

  - id: zagrath
    nome: Zagrath
    tipo: personaggio
    sottotitolo: "Predone di Rovolungo"
    testo: "Mezzo orco e mezzo ogre, vive nel nord di Rovolungo e gira fra le cinque tribù orchesche barattando la merce rubata alle carovane con alcol e notizie. Porta un arco lungo più alto di un uomo e odia gli elfi, Ilvaena Sorathe prima di tutti."
    requisiti: []

  - id: aurenne
    nome: Aurenne
    tipo: personaggio
    sottotitolo: "La figlia adottiva di Idrian Sollen"
    testo: "Figlia adottiva del cappellano Idrian Sollen, che la trovò piccola e la chiamava il suo angelo. Aveva capelli d'argento e occhi viola, e passò dall'Accademia di Torvessa. Per il Velo morì con il padre nell'incendio del Santuario nel 145, ma il corpo non fu trovato."
    requisiti: [pista.acciaio >= 6, pista.capomozzo < 6]

  - id: aurenne-viva
    nome: Aurenne
    tipo: personaggio
    sottotitolo: "La figlia adottiva di Idrian Sollen"
    testo: "Figlia adottiva del cappellano Idrian Sollen, con i capelli d'argento e la mano destra diventata un artiglio nero. Il Velo la dava per morta nell'incendio del Santuario, nel 145 D.C., invece era viva sotto Capomozzo, e adesso dorme in Cattedrale."
    requisiti: [pista.capomozzo == 6]

  - id: aurenne-la-dama
    nome: Aurenne
    tipo: personaggio
    sottotitolo: "La figlia adottiva di Idrian Sollen"
    testo: "Figlia adottiva del cappellano Idrian Sollen, con i capelli d'argento e la mano destra diventata un artiglio nero. Il Velo la dava per morta nell'incendio del Santuario. Era lei la Dama d'Argento degli orchi, e adesso vive in Cattedrale sotto la custodia del Velo."
    requisiti: [pista.capomozzo >= 7]

  - id: costruttore
    nome: Costruttore
    alias: [Costruttori, Costruttore di Capomozzo]
    tipo: creatura
    sottotitolo: "I colossi dei Precursori"
    testo: "Colosso di metallo e pietra con cui i Precursori edificavano e custodivano le opere, alto quanto quattro case e con un nucleo rosso nel torace. Dopo la Caduta alcuni ripetono ancora il proprio lavoro; uno giaceva sotto Capomozzo, in una rovina sommersa dalla Marea Grigia."
    requisiti: [pista.capomozzo >= 5]

  - id: strada-antica
    nome: Strada Antica
    tipo: luogo
    sottotitolo: "Il cammino che scende nella Cicatrice"
    testo: "Cammino che dalle sponde della Cicatrice del Mondo scende alle prime profondità del Labirinto di Darn-Morakh, raggiunto dai ponti-ascensore che il Velo sorveglia. Lungo il percorso stanno obelischi incisi e firmati col nome del Labirinto, e i Raschiatori giurano che i graffi sono sempre freschi."
    requisiti: []

  - id: portatori-dell-alba
    nome: Portatori dell'Alba
    alias: [Portatore dell'Alba]
    tipo: cosa
    sottotitolo: "I chiamati delle storie del Velo"
    testo: "Per la Confraternita del Velo i Portatori sono coloro che il Mana segna con una Maschera, come i Tre tornati dal Labirinto di Darn-Morakh dopo il Rito del 130. Le storie di città, che il Velo non conferma, chiamano Portatori dell'Alba quelli che verranno dopo."
    requisiti: [pista.capomozzo >= 7]
