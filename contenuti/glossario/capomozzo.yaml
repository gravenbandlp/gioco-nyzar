# Glossario del blocco 7, Capomozzo: i luoghi e i personaggi della pista e quello che il giocatore trova
# sotto la fortezza. Presentazioni generali, senza i fatti della pista; le voci che sarebbero spoiler
# compaiono solo quando il giocatore ci è arrivato (requisiti sulla pista). Chi muore o cambia stato nella
# pista (Balthog, Borgoth, Aurenne) ha una variante con lo stesso nome: vale la prima voce i cui requisiti
# sono soddisfatti.
# La Madre del Velo sta già in personaggi.yaml, il Labirinto di Darn-Morakh in luoghi.yaml.
glossario:
  - id: capomozzo
    nome: Capomozzo
    tipo: luogo
    sottotitolo: "L'isola della tribù di Balthog"
    testo: "Piccola isola tonda davanti alla costa di Rovolungo, separata dalla scogliera da un braccio di mare stretto e profondo. Dalla terraferma ha il profilo di una testa mozzata. Scogliere e correnti forti rendono impossibile lo sbarco dalle barche, e la tribù orchesca che ci vive sa come arrivarci da terra. Le altre tribù la considerano il covo migliore della regione, e ci girano alla larga."
    requisiti: []

  - id: rovolungo
    nome: Rovolungo
    tipo: luogo
    sottotitolo: "La macchia della costa settentrionale"
    testo: "Fascia di rovi e di cardi alti come una casa sulla costa settentrionale, con gli alberi intorno piegati dal vento di mare e le spine che al mattino gocciolano di nebbia. Da Qir-Azel ci vogliono due giorni e mezzo di cammino. Pochi cacciatori ci si avventurano, e le loro storie non coincidono mai. Lo attraversano soprattutto bande di orchi in transito e il predone Zagrath."
    requisiti: []

  - id: balthog-il-prescelto
    nome: Balthog il Prescelto
    alias: [Balthog]
    tipo: personaggio
    sottotitolo: "Capo della tribù di Capomozzo"
    testo: "Capo della tribù orchesca di Capomozzo, che lo segue come il Prescelto di un'entità di cui gli orchi non pronunciano il nome. È un titolo più religioso che politico, e Balthog lo porta con la compostezza di un sacerdote. Il suo braccio destro era Dorbak, il capoguerra ucciso a Qir-Azel durante la razzia del Festival delle Foglie Alate."
    requisiti: [balthog == 0]

  - id: balthog-il-prescelto-morto
    nome: Balthog il Prescelto
    alias: [Balthog]
    tipo: personaggio
    sottotitolo: "Capo della tribù di Capomozzo, morto"
    testo: "Capo della tribù orchesca di Capomozzo, che lo seguiva come il Prescelto di un'entità di cui gli orchi non pronunciano il nome. Combatteva a mani nude e non aveva mai perso, tanto che in faccia non aveva una sola cicatrice. È morto nella sua sala del trono, contro gli spuntoni di un pilastro. Il suo braccio destro era Dorbak, ucciso a Qir-Azel durante la razzia."
    requisiti: [balthog == 1]

  - id: balthog-il-prescelto-battuto
    nome: Balthog il Prescelto
    alias: [Balthog]
    tipo: personaggio
    sottotitolo: "Capo della tribù di Capomozzo"
    testo: "Capo della tribù orchesca di Capomozzo, che lo segue come il Prescelto di un'entità di cui gli orchi non pronunciano il nome. Combatte a mani nude, e prima di quel giorno non aveva mai perso. È stato battuto nella sua sala e lasciato a terra vivo davanti al trono, con un ginocchio spezzato."
    requisiti: [balthog == 2]

  - id: borgoth-il-gigante
    nome: Borgoth il Gigante
    alias: [Borgoth]
    tipo: personaggio
    sottotitolo: "Eroe della tribù di Fondobosco"
    testo: "Eroe della tribù orchesca di Fondobosco, figlio di un orco e di una ogre, di una stirpe ormai quasi scomparsa dalla regione. È più alto di qualunque orco e più selvaggio di quasi tutti, e del potere gli importa poco, perché preferisce cacciare. Alle assemblee della tribù parla per ultimo, e di solito dopo di lui nessuno ribatte."
    requisiti: [borgoth != 1]

  - id: borgoth-il-gigante-morto
    nome: Borgoth il Gigante
    alias: [Borgoth]
    tipo: personaggio
    sottotitolo: "Eroe della tribù di Fondobosco, morto"
    testo: "Eroe della tribù orchesca di Fondobosco, figlio di un orco e di una ogre, di una stirpe ormai quasi scomparsa dalla regione. Era più alto di qualunque orco e del potere gli importava poco, perché preferiva cacciare. Cacciato da Balthog, viveva in una tana fra i rovi di Rovolungo, ed è morto lì, con il suo puma accanto."
    requisiti: [borgoth == 1]

  - id: zagrath
    nome: Zagrath
    tipo: personaggio
    sottotitolo: "Predone di Rovolungo"
    testo: "Mezzo orco e mezzo ogre, vive nel nord di Rovolungo e gira fra le cinque tribù orchesche con la merce rubata alle carovane, che baratta con alcol e notizie. Lo accolgono dappertutto e non si fidano di lui da nessuna parte. Porta un arco lungo enorme, più alto di un uomo, e odia gli elfi più di qualunque altra cosa, Ilvaena Sorathe prima di tutti."
    requisiti: []

  - id: aurenne
    nome: Aurenne
    tipo: personaggio
    sottotitolo: "La figlia adottiva di Idrian Sollen"
    testo: "Figlia adottiva del cappellano Idrian Sollen, che la trovò molto piccola senza mai dire dove e la chiamava il suo angelo. Aveva i capelli d'argento e gli occhi viola, e frequentò per poco e con poca fortuna l'Accademia di Torvessa. Per le cronache del Velo morì con il padre nell'incendio del Santuario, nel 145 D.C., anche se il corpo non fu mai ritrovato."
    requisiti: [pista.acciaio >= 6, pista.capomozzo < 6]

  - id: aurenne-viva
    nome: Aurenne
    tipo: personaggio
    sottotitolo: "La figlia adottiva di Idrian Sollen"
    testo: "Figlia adottiva del cappellano Idrian Sollen, che la trovò molto piccola e la chiamava il suo angelo. Ha i capelli d'argento e gli occhi viola, e la mano destra è diventata un artiglio nero. Per le cronache del Velo morì con il padre nell'incendio del Santuario, nel 145 D.C. Invece era viva sotto Capomozzo, e adesso dorme in Cattedrale."
    requisiti: [pista.capomozzo == 6]

  - id: aurenne-la-dama
    nome: Aurenne
    tipo: personaggio
    sottotitolo: "La figlia adottiva di Idrian Sollen"
    testo: "Figlia adottiva del cappellano Idrian Sollen, che la trovò molto piccola e la chiamava il suo angelo. Ha i capelli d'argento e gli occhi viola, e la mano destra è diventata un artiglio nero. Le cronache del Velo la davano per morta nell'incendio del Santuario. Era lei la Dama d'Argento degli orchi, e adesso vive in Cattedrale sotto la custodia del Velo."
    requisiti: [pista.capomozzo >= 7]

  - id: costruttore
    nome: Costruttore
    alias: [Costruttori, Costruttore di Capomozzo]
    tipo: creatura
    sottotitolo: "I colossi dei Precursori"
    testo: "Colosso di metallo e di pietra che i Precursori usavano per edificare e custodire le loro opere, alto quanto quattro case una sopra l'altra e con un nucleo rosso nel torace. Dopo la Caduta alcuni Costruttori sono rimasti nelle rovine a ripetere il proprio lavoro, senza più nessuno a cui obbedire. Uno di loro giaceva sotto Capomozzo, in una rovina sommersa dalla Marea Grigia."
    requisiti: [pista.capomozzo >= 5]

  - id: strada-antica
    nome: Strada Antica
    tipo: luogo
    sottotitolo: "Il cammino che scende nella Cicatrice"
    testo: "Il lungo cammino che dalle sponde della Cicatrice del Mondo scende fino alle prime profondità del Labirinto di Darn-Morakh. Ci si arriva con i ponti-ascensore dei Ponti Sospesi, i cui accessi sono sorvegliati dalla Confraternita del Velo. Lungo il percorso si incontrano obelischi con frasi incise e firmate col nome del Labirinto, e i Raschiatori giurano che i graffi sono sempre freschi."
    requisiti: []

  - id: portatori-dell-alba
    nome: Portatori dell'Alba
    alias: [Portatore dell'Alba]
    tipo: cosa
    sottotitolo: "I chiamati delle storie del Velo"
    testo: "Per la Confraternita del Velo i Portatori sono coloro che il Mana segna con una Maschera, come i Tre Portatori tornati dal Labirinto di Darn-Morakh dopo il Rito del 130 D.C. Le storie che girano in città, e che il Velo non conferma, chiamano Portatori dell'Alba quelli che verranno dopo di loro."
    requisiti: [pista.capomozzo >= 7]
