# Glossario: luoghi, fazioni, creature e cose del mondo che compaiono nei testi del gioco.
# Le voci dei personaggi stanno in personaggi.yaml. Presentazioni brevi e stabili (25-60 parole),
# quello che sa un abitante qualunque di Qir-Azel: niente segreti, niente cose che il giocatore scopre
# giocando. Quando la trama cambia un luogo (bruciato, venduto, passato di mano) la voce ha una variante con lo
# stesso nome e requisiti complementari: vale la prima voce i cui requisiti sono soddisfatti.
glossario:
  # ------------------------------------------------------------------ la città e i distretti
  - id: qir-azel
    nome: Qir-Azel
    tipo: luogo
    sottotitolo: "Città sul bordo della Cicatrice del Mondo"
    testo: "Città fondata nel 110 D.C. sul bordo della Cicatrice del Mondo, dove le rovine dei Precursori restituivano più cristalli che altrove. Sale a terrazze, con i Quartieri Alti in cima, la Città Bassa sull'altopiano a est e i Ponti Sospesi sopra il centro."

  - id: citta-bassa
    nome: Città Bassa
    tipo: luogo
    sottotitolo: "Il distretto del lavoro, a est"
    testo: "Il distretto del lavoro, su un altopiano di rocce bluastre a est di Qir-Azel. Ci vivono i Raschiatori e gli artigiani che riforniscono il mercato dei Ponti, in case basse di pietra grezza e lamiera, e le fucine battono giorno e notte."

  - id: quartieri-alti
    nome: Quartieri Alti
    tipo: luogo
    sottotitolo: "La terrazza più alta di Qir-Azel"
    testo: "La terrazza più alta di Qir-Azel, con strade di pietra chiara e tetti di rame, dove abitano le famiglie che contano e hanno sede la Cattedrale del Velo e la Casa dei Nodi. La sera i suoi obelischi di cristallo ronzano."

  - id: ponti-sospesi
    nome: Ponti Sospesi
    alias: [Ponti]
    tipo: luogo
    sottotitolo: "Il reticolo di ponti sopra il centro"
    testo: "Reticolo di travi e piattaforme appese sopra il centro, fra le due sponde della Cicatrice, cuore commerciale di Qir-Azel e territorio della Gilda dei Mercanti, che riscuote una gabella a ogni passaggio."

  - id: cicatrice-del-mondo
    nome: Cicatrice del Mondo
    alias: [Cicatrice]
    tipo: luogo
    sottotitolo: "La voragine su cui sorge Qir-Azel"
    testo: "L'immensa voragine sul cui bordo sorge Qir-Azel. Nessuna corda ne ha mai toccato il fondo. Di notte ne salgono bagliori simili ad aurore, e a volte un suono basso che annuncia i tremori della città. Nel suo cuore si apre il Labirinto di Darn-Morakh."

  # ------------------------------------------------------------------ ponti e strade
  - id: ponte-delle-mille-corde
    nome: Ponte delle Mille Corde
    tipo: luogo
    sottotitolo: "La via principale dei Ponti Sospesi"
    testo: "La via principale dei Ponti Sospesi, che vibra di continuo sotto carri e gente. All'imbocco i Custodi di Passaggio riscuotono la gabella dal loro gabbiotto; sulle piattaforme si stende il Mercato dei Nodi, e a metà sorge la Locanda del Grifone di Ferro."

  - id: ponte-dei-morti
    nome: Ponte dei Morti
    tipo: luogo
    sottotitolo: "Ponte delle lanterne, nei Ponti Sospesi"
    testo: "Uno dei primi ponti della città, in metallo annerito. Ai parapetti i Raschiatori appendono una lanterna con un piccolo cristallo per ogni compagno disperso nel Labirinto, e alcune lanterne hanno ormai un nome proprio."

  - id: ponte-del-pesce
    nome: Ponte del Pesce
    tipo: luogo
    sottotitolo: "Dalla Città Bassa ai Ponti Sospesi"
    testo: "Arco di pietra rossa che porta dalla Città Bassa ai Ponti Sospesi, consumato al centro dalle ruote dei carretti. Il parapetto basso trattiene fino a sera il calore del giorno, e da metà ponte si vedono accendersi le luci della Cattedrale del Velo."

  - id: ponte-del-conciatore
    nome: Ponte del Conciatore
    tipo: luogo
    sottotitolo: "Ponte di legno sul Torvessa, verso ovest"
    testo: "Ponte di legno spesso che attraversa il Torvessa al margine occidentale di Qir-Azel e prende il nome dalle vecchie concerie. Da qui passa chi parte per Laresh o per la Foresta Strisciante."

  - id: via-dei-rasoi
    nome: Via dei Rasoi
    tipo: luogo
    sottotitolo: "Strada della Città Bassa"
    testo: "Strada della Città Bassa che sale dall'Orlo dei Rottami senza mai correre dritta, e a metà fa un gomito attorno a un vecchio cristallo conduttore spento, alto come due uomini. All'angolo con Via del Salmone sorge la Maison des Lunes."

  - id: via-del-salmone
    nome: Via del Salmone
    tipo: luogo
    sottotitolo: "Strada della Città Bassa"
    testo: "Strada della Città Bassa che scende fino al Ponte del Pesce, verso i Ponti Sospesi. All'angolo con Via dei Rasoi sorge la Maison des Lunes. La sera metà delle sue lanterne resta spenta, con lo stoppino bruciato da tempo."

  # ------------------------------------------------------------------ locande e botteghe
  - id: pignatta-grassa
    nome: Pignatta Grassa
    alias: [Pignatta]
    tipo: luogo
    sottotitolo: "Taverna della Città Bassa"
    testo: "Taverna della Città Bassa dell'oste Mauro Scrocco, che tratta tutti come parenti. Lo sceriffo la sconsiglia ai forestieri, e per questo è sempre piena; in città la considerano il ritrovo degli Scuri."
    requisiti: [pista.pelle < 6]

  - id: pignatta-grassa-bruciata
    nome: Pignatta Grassa
    alias: [Pignatta]
    tipo: luogo
    sottotitolo: "La taverna bruciata della Città Bassa"
    testo: "Era la taverna di Mauro Scrocco in Città Bassa, ritrovo degli Scuri. È bruciata la notte in cui la Caserma ha preso d'assalto la banda, e nel suo cortile delle risse è morto Mirko Vesh."
    requisiti: [pista.pelle >= 6]

  - id: locanda-del-grifone-di-ferro
    nome: Locanda del Grifone di Ferro
    alias: [Grifone di Ferro, Locanda del Grifone, Grifone]
    tipo: luogo
    sottotitolo: "Locanda sul Ponte delle Mille Corde"
    testo: "Locanda a metà del Ponte delle Mille Corde, con un grifone arrugginito sul tetto, dove i Raschiatori bevono senza occhiate storte. La proprietaria, Liaren Tarvelin, ha una sola regola, e chi entra con uno schiavo ne esce con un occhio nero."

  - id: locanda-del-daino-zoppo
    nome: Locanda del Daino Zoppo
    alias: [Daino Zoppo]
    tipo: luogo
    sottotitolo: "Locanda dei Quartieri Alti, vicino alla porta nord"
    testo: "Locanda ben tenuta nei Quartieri Alti, a pochi passi dalla porta nord, con un cerbiatto bianco sull'insegna. È il primo riparo per i mercanti di Laresh e per i pellegrini, con piatti caldi a ogni ora."

  - id: locanda-di-ilka
    nome: Locanda di Ilka
    tipo: luogo
    sottotitolo: "Taverna della Città Bassa"
    testo: "Uno degli edifici più vecchi di Qir-Azel, in una strada appartata della Città Bassa, a un piano solo e dipinto con i motivi dei carri olvari. Serve sidro e patate speziate, e l'ostessa Ilka Dravec racconta le antiche leggende olvare."

  - id: maison-des-lunes
    nome: Maison des Lunes
    alias: [Maison]
    tipo: luogo
    sottotitolo: "Casa di piacere della Città Bassa"
    testo: "Casa di piacere in legno a tre piani all'angolo tra Via del Salmone e Via dei Rasoi, con le tende sempre chiuse e una catena di bronzo accanto alla porta, *Ospiti Benvenuti*. La dirige Nerissa Dalvane, che ne ha fatto una casa discreta."

  - id: nodo-d-ossidiana
    nome: Nodo d'Ossidiana
    tipo: luogo
    sottotitolo: "Bottega di oggetti magici sul Mercato dei Nodi"
    testo: "Bottega di oggetti magici sul Mercato dei Nodi, con una facciata stretta di pietra chiara venata di verde e un serpente alato intagliato sull'insegna. Dentro il rumore del mercato si attenua di colpo. La tiene Ambrin Qell, con un corvo nero sul bancone."

  - id: fucina-dei-due-mastini
    nome: Fucina dei Due Mastini
    tipo: luogo
    sottotitolo: "La bottega del fabbro Bram Halgast"
    testo: "La bottega del fabbro Bram Halgast in Città Bassa, un edificio basso di pietra annerita con un mastino inciso sull'insegna. All'ingresso stanno distesi due grossi cani dal pelo rosso scuro, che non abbaiano mai."

  - id: conceria-kasselt
    nome: Conceria Kasselt
    alias: [Conceria]
    tipo: luogo
    sottotitolo: "Bottega del cuoio in Città Bassa"
    testo: "Bottega di cuoio della Città Bassa, fra le migliori della regione. Il padrone, Gunter Kasselt, lavora più di qualunque operaio e caccia chi sbaglia al primo errore. Rifornisce l'Armeria di Irsa e prepara a volte lavori speciali per la Cattedrale del Velo."

  - id: dispensa-di-gramm
    nome: Dispensa di Gramm
    alias: [Dispensa]
    tipo: luogo
    sottotitolo: "Erboristeria di Nestor Gramm"
    testo: "L'erboristeria di Nestor Gramm sul Mercato dei Nodi. Nestor è basso, diffidente, metodico fino a complicare le cose semplici, e dal suo laboratorio escono anche alcune pozioni rare che il Velo tiene in scorta."
    requisiti: [colpo.dispensa == 0, pista.pelle < 4]

  - id: dispensa-di-gramm-col-garzone
    nome: Dispensa di Gramm
    alias: [Dispensa]
    tipo: luogo
    sottotitolo: "Erboristeria sul Mercato dei Nodi"
    testo: "L'erboristeria di Nestor Gramm sul Mercato dei Nodi. Da quando la Caserma ha messo gli occhi sul retrobottega, dove Nestor preparava i veleni degli Scuri, al banco c'è un garzone che vende le stesse erbe e non risponde alle domande."
    requisiti: []

  - id: segheria-di-qir-azel
    nome: Segheria di Qir-Azel
    alias: [Segheria Malgrani, Segheria]
    tipo: luogo
    sottotitolo: "La segheria su concessione dei Malgrani"
    testo: "Uno dei primi edifici della città, che lavora il legname del circondario su concessione dei Malgrani, e per questo tutti la chiamano Segheria Malgrani. Un grosso cristallo conduttore romboidale muove l'acqua del canale e le lame fino a notte."
    requisiti: [pista.pelle < 7]

  - id: segheria-della-cooperativa
    nome: Segheria di Qir-Azel
    alias: [Segheria Malgrani, Segheria]
    tipo: luogo
    sottotitolo: "La segheria della cooperativa dei taglialegna"
    testo: "Uno dei primi edifici della città, per decenni sotto concessione dei Malgrani, e in città la chiamano ancora Segheria Malgrani. Dopo la condanna di Ottone l'ha rilevata la cooperativa dei taglialegna, e il cristallo romboidale muove ancora le lame fino a notte."
    requisiti: [pista.pelle >= 7]

  - id: acciaieria-dei-tarvelin
    nome: Acciaieria dei Tarvelin
    alias: [Acciaieria]
    tipo: luogo
    sottotitolo: "L'unica raffineria di lyssan della regione"
    testo: "L'unico impianto della regione dove si raffina il lyssan, il metallo dei Precursori, in Città Bassa. Lo dirige di persona Ondrel Tarvelin. Il turno di notte comincia quando la colata diventa azzurra."
    requisiti: [pista.acciaio < 4]

  - id: acciaieria-dei-tarvelin-ferma
    nome: Acciaieria dei Tarvelin
    alias: [Acciaieria]
    tipo: luogo
    sottotitolo: "La raffineria di lyssan, ferma"
    testo: "L'unico impianto della regione dove si raffina il lyssan, in Città Bassa. Ondrel Tarvelin la dirigeva di persona ed è morto nella sala della fornace insieme a otto operai. Da allora la ciminiera più alta della città non fuma più."
    requisiti: [acciaieria.futuro == 0]

  - id: acciaieria-dei-tarvelin-riaccesa
    nome: Acciaieria dei Tarvelin
    alias: [Acciaieria]
    tipo: luogo
    sottotitolo: "L'unica raffineria di lyssan della regione"
    testo: "L'unico impianto della regione dove si raffina il lyssan, in Città Bassa. Ondrel Tarvelin, che la dirigeva, è morto nella sala della fornace. Dopo settimane di ciminiera spenta la fornace è stata riaccesa."
    requisiti: []

  # ------------------------------------------------------------------ luoghi della Città Bassa
  - id: orlo-dei-rottami
    nome: Orlo dei Rottami
    alias: [Orlo]
    tipo: luogo
    sottotitolo: "La spiaggia dei rottami, in Città Bassa"
    testo: "Lingua di terra battuta sotto il margine ovest della Città Bassa, sul bordo della Cicatrice. Ci finiscono i pezzi precuriani sfregiati e i cristalli sterili dei Raschiatori, che gli spazzini della Gilda smistano e rivendono."

  - id: mercato-delle-ombre
    nome: Mercato delle Ombre
    tipo: luogo
    sottotitolo: "La piazza sotterranea della Città Bassa"
    testo: "Piazza sotterranea sotto la Città Bassa, il segreto peggio custodito di Qir-Azel, dove si vendono reliquie proibite e Cristalli Conduttori non registrati. Cambia stanza ogni pochi mesi, e chi cerca qualcosa deve prima trovare chi sa dove si è spostata."

  - id: cimitero-di-qir-azel
    nome: Cimitero di Qir-Azel
    tipo: luogo
    sottotitolo: "Il cimitero della città"
    testo: "Il cimitero della città, in Città Bassa, con le tombe dei poveri contro il muro di cinta. Il becchino tiene i registri funebri, e in fondo c'è la cripta del cappellano Idrian Sollen, morto nell'incendio del Santuario nel 145 D.C."
    requisiti: [pista.sepolcro == 0]

  - id: cimitero-di-qir-azel-violato
    nome: Cimitero di Qir-Azel
    tipo: luogo
    sottotitolo: "Il cimitero della città"
    testo: "Il cimitero della città, in Città Bassa, dove riposa il cappellano Idrian Sollen, morto nell'incendio del Santuario nel 145 D.C. La notte della razzia qualcuno ne ha forzato la cripta, e lo sceriffo cerca i colpevoli."
    requisiti: []

  # ------------------------------------------------------------------ Quartieri Alti
  - id: cattedrale-del-velo
    nome: Cattedrale del Velo
    alias: [Cattedrale]
    tipo: luogo
    sottotitolo: "La chiesa maggiore di Qir-Azel"
    testo: "La chiesa maggiore di Qir-Azel e sede del Velo, eretta sulle ceneri del Santuario bruciato nel 145 D.C., con pareti in parte organiche fuse a metallo dei Precursori. L'altare è un cristallo rosso che pulsa con le ore canoniche."

  - id: cripta-della-cattedrale
    nome: Cripta della Cattedrale
    alias: [Cripta]
    tipo: luogo
    sottotitolo: "La sala sotto l'altare della Cattedrale del Velo"
    testo: "La sala sotto l'altare della Cattedrale del Velo, dove la Madre del Velo officia i riti più solenni e dove chi torna dalle profondità passa per la purificazione. Qui si conservano le testimonianze raccolte dopo la Notte dei Sussurri."

  - id: giardini-della-linfa
    nome: Giardini della Linfa
    tipo: luogo
    sottotitolo: "I giardini della Cattedrale del Velo"
    testo: "I giardini dietro la navata della Cattedrale del Velo, dove la Confraternita coltiva piante bioluminescenti per i riti e gli unguenti. Li cura Sorella Giulia, che lascia passeggiare i convalescenti fra le aiuole purché tengano le mani in tasca."

  - id: caserma
    nome: Caserma
    alias: [Guarnigione]
    tipo: luogo
    sottotitolo: "La guarnigione di Qir-Azel, sede dello sceriffo"
    testo: "La guarnigione di Qir-Azel nei Quartieri Alti, sede dello sceriffo Toren Galdrick, con le celle al piano interrato. Nel cortile si addestrano Guardia e Raschiatori. In Città Bassa tiene un posto di guardia in una casa di pietra blu."

  - id: municipio
    nome: Municipio
    tipo: luogo
    sottotitolo: "La sede del Consiglio di Qir-Azel"
    testo: "La sede del Consiglio di Qir-Azel nei Quartieri Alti, con le porte più grandi della città, dove la Rappresentante Julia Castaldi tiene le udienze. Si dice che in Municipio si discuta e che le decisioni vere si prendano in Cattedrale."

  - id: casa-dei-nodi
    nome: Casa dei Nodi
    tipo: luogo
    sottotitolo: "Sede della Gilda dei Mercanti"
    testo: "Sede della Gilda dei Mercanti nei Quartieri Alti, un intrico di catene e terrazze. Ospita i Custodi di Passaggio e l'archivio dei dazi, e nel 118 D.C. vi fu firmato il Patto delle Corde. Le riunioni riservate si tengono al terzo piano."

  - id: biblioteca
    nome: Biblioteca
    tipo: luogo
    sottotitolo: "L'archivio di Qir-Azel, nei Quartieri Alti"
    testo: "L'archivio di Qir-Azel nei Quartieri Alti, custodito dal Velo. I piani bassi sono aperti al pubblico, mentre interi corridoi di sopra sono chiusi con cera nera e nastro rosso."

  - id: accademia-di-torvessa
    nome: Accademia di Torvessa
    alias: [Accademia]
    tipo: luogo
    sottotitolo: "La scuola della città"
    testo: "La scuola di Qir-Azel, nei Quartieri Alti, dove si insegna anche la magia. Il preside, Orvald Temmerin, ha passato trent'anni negli scavi e tiene nel seminterrato la sua collezione di armi e di trofei."

  - id: teatro-delle-meraviglie
    nome: Teatro delle Meraviglie
    tipo: luogo
    sottotitolo: "La sala di Orazio Belcanto"
    testo: "La sala di spettacolo dei Quartieri Alti, dell'impresario Orazio Belcanto, che ne è anche il primo attore. Sul palco si ride di cose che in strada sarebbero condanne. La sua rivalità con Liaren Tarvelin alimenta i pettegolezzi da anni."

  # ------------------------------------------------------------------ fuori città
  - id: labirinto-di-darn-morakh
    nome: Labirinto di Darn-Morakh
    alias: [Labirinto, Darn-Morakh]
    tipo: luogo
    sottotitolo: "La rovina nel cuore della Cicatrice"
    testo: "La più grande rovina dei Precursori mai scoperta, nel cuore della Cicatrice del Mondo, con architetture concentriche sospese nel vuoto che ogni tanto si riorganizzano. I Raschiatori ci scendono a cercare cristalli."

  - id: bosco-della-forca
    nome: Bosco della Forca
    tipo: luogo
    sottotitolo: "Foresta a ovest di Qir-Azel"
    testo: "Foresta fitta a ovest di Qir-Azel, lungo le rotte per Laresh. È il territorio della tribù orchesca dei Nove Chiodi, che da generazioni assalta le carovane. I pochi mercanti che vi hanno trafficato a lungo hanno imparato l'orchesco per contrattare."

  - id: bosco-di-velthar
    nome: Bosco di Velthar
    tipo: luogo
    sottotitolo: "Foresta antica a nord-ovest"
    testo: "Foresta antichissima a un giorno di cammino a nord-ovest di Qir-Azel, con le radici fra rovine sepolte e cortecce che pulsano di bagliori. Ci vivono i druidi del Circolo di Velthar, e dalle sue radure vengono le farfalle foglia-rossa dei racconti per bambini."

  - id: laresh
    nome: Laresh
    tipo: luogo
    sottotitolo: "Villaggio agricolo del circondario"
    testo: "Villaggio agricolo a ovest di Qir-Azel, il cui grano dà alla città gran parte del pane. Di notte sui campi galleggiano fiamme azzurrastre, che i contadini chiamano gli spiriti dei morti venuti a custodire il raccolto."

  - id: ghoran
    nome: Ghoran
    tipo: luogo
    sottotitolo: "Insediamento dei clan e dei mercati di schiavi"
    testo: "Insediamento dei clan su palafitte annerite sopra pozze di fango, dove le leggi di Qir-Azel valgono solo sulla carta. Vive di mercenariato e di mercati di schiavi, che riforniscono anche la Gilda, e ogni notte dall'arena dei gladiatori risuonano i tamburi."

  - id: tuarmir
    nome: Tuarmir
    tipo: luogo
    sottotitolo: "Villaggio di erboristi in una gola"
    testo: "Villaggio scavato nella pietra lungo una gola di roccia scura, dove il sole arriva poche ore al giorno. Vive delle erbe e dei muschi rituali che compra il Velo, e a guidare la raccolta è l'erborista cieca Madre Cerya."

  # ------------------------------------------------------------------ fazioni
  - id: raschiatori
    nome: Raschiatori
    alias: [Raschiatore, Raschiatrice]
    tipo: fazione
    sottotitolo: "La corporazione di chi scende nelle rovine"
    testo: "La corporazione di chi scende nelle rovine e nel Labirinto a recuperare cristalli e reliquie. Invece di una gerarchia hanno quattro titoli, che si guadagnano per merito e durano quanto chi li porta. Si ritrovano al Grifone di Ferro."

  - id: scuri
    nome: Scuri
    alias: [Scuro]
    tipo: fazione
    sottotitolo: "Rete criminale di Qir-Azel e del circondario"
    testo: "Rete di bande criminali di Qir-Azel e del circondario, che collaborano solo quando conviene. Preferiscono il ricatto al sangue e vivono di partite truccate e cristalli non registrati. In città si ritrovano alla Pignatta Grassa, e lo sceriffo aspetta un loro passo falso."
    requisiti: [pista.pelle < 6]

  - id: scuri-dopo-vesh
    nome: Scuri
    alias: [Scuro]
    tipo: fazione
    sottotitolo: "La rete criminale di Qir-Azel, sbandata"
    testo: "Rete di bande criminali che si ritrovavano alla Pignatta Grassa. La notte in cui la Caserma ha preso d'assalto la taverna è morto Mirko Vesh, e in città la rete non esiste più; nei villaggi ne restano piccole bande senza padrone."
    requisiti: [pista.pelle >= 6]

  - id: confraternita-del-velo
    nome: Confraternita del Velo
    alias: [Confraternita, Velo]
    tipo: fazione
    sottotitolo: "L'ordine religioso del Grande Albero Rosso"
    testo: "L'ordine religioso del Grande Albero Rosso, con sede nella Cattedrale del Velo. Controlla gli accessi al Labirinto e impone i riti di purificazione a chi torna dalle profondità. La guida la Madre del Velo, che nessuno ha mai visto in volto."

  - id: gilda-dei-mercanti
    nome: Gilda dei Mercanti
    alias: [Gilda]
    tipo: fazione
    sottotitolo: "Padrona dei ponti e dei dazi"
    testo: "L'organismo economico più potente di Qir-Azel, nato nel 118 D.C. dal Patto delle Corde fra le famiglie dei ponti. Controlla ponti e passerelle, fa pagare una gabella a ogni passaggio e una commissione mensile a ogni mercante. Ha sede nella Casa dei Nodi."

  - id: custodi-di-passaggio
    nome: Custodi di Passaggio
    alias: [Custode di Passaggio, Custodi]
    tipo: fazione
    sottotitolo: "I funzionari della Gilda sui ponti"
    testo: "I funzionari della Gilda dei Mercanti che riscuotono i dazi sui ponti e ne curano la manutenzione, dal gabbiotto all'imbocco del Ponte delle Mille Corde. Chi commercia senza licenza viene multato e poi bandito."

  - id: consiglio-di-qir-azel
    nome: Consiglio di Qir-Azel
    alias: [Consiglio]
    tipo: fazione
    sottotitolo: "L'assemblea che governa la città"
    testo: "L'assemblea che governa Qir-Azel dal Municipio, presieduta dalla Rappresentante Julia Castaldi. Ha sette seggi, fra cui quelli dello sceriffo e delle fazioni maggiori, e le rivalità fra le parti bloccano quasi ogni decisione."

  - id: famiglia-castaldi
    nome: Famiglia Castaldi
    alias: [Castaldi]
    tipo: fazione
    sottotitolo: "Casata dei Quartieri Alti"
    testo: "Casata dei Quartieri Alti fra le fondatrici di Qir-Azel, nota per la sobrietà. Non ha mai preso parte alle faide della Gilda, e per questo Julia Castaldi ha potuto farsi eleggere Rappresentante. La guardia del maniero la comanda Quintus Vael."

  - id: famiglia-malgrani
    nome: Famiglia Malgrani
    alias: [Malgrani]
    tipo: fazione
    sottotitolo: "Casata dei mulini e delle segherie"
    testo: "Casata della prima ondata di coloni, guidata da Ottone Malgrani. Con i mulini e le segherie di Qir-Azel pesa nella Gilda, e in città la considerano spietata con i concorrenti. Lo stemma è un albero trafitto da una lama."
    requisiti: [pista.pelle < 7]

  - id: famiglia-malgrani-caduta
    nome: Famiglia Malgrani
    alias: [Malgrani]
    tipo: fazione
    sottotitolo: "Casata dei mulini e delle segherie, caduta"
    testo: "Casata dei primi coloni che possedeva i mulini e le segherie. Dopo la condanna a morte di Ottone Malgrani per i conti con gli Scuri, le sue attività sono passate alle cooperative e il Maniero è stato venduto. A Ghoran resta la zia Urtilia."
    requisiti: [pista.pelle >= 7]

  - id: famiglia-tarvelin
    nome: Famiglia Tarvelin
    alias: [Casato Tarvelin, Tarvelin]
    tipo: fazione
    sottotitolo: "Casata dell'Acciaieria"
    testo: "Casata dei Quartieri Alti fra le firmatarie del Patto delle Corde, ricca dell'Acciaieria che sola sa raffinare il lyssan, diretta da Ondrel Tarvelin. L'erede, Liaren, ha lasciato il casato da giovane per andare all'avventura."
    requisiti: [pista.acciaio < 4]

  - id: famiglia-tarvelin-dopo-ondrel
    nome: Famiglia Tarvelin
    alias: [Casato Tarvelin, Tarvelin]
    tipo: fazione
    sottotitolo: "Casata dell'Acciaieria"
    testo: "Casata dei Quartieri Alti fra le firmatarie del Patto delle Corde, ricca dell'Acciaieria che sola sa raffinare il lyssan, diretta da Ondrel Tarvelin fino alla sua morte. L'erede, Liaren, ha lasciato il casato da giovane e tiene una locanda sui Ponti."
    requisiti: [pista.acciaio >= 4]

  - id: circolo-di-velthar
    nome: Circolo di Velthar
    alias: [Circolo]
    tipo: fazione
    sottotitolo: "I druidi del Bosco di Velthar"
    testo: "Il circolo druidico del Bosco di Velthar, diviso in tre vie, dalla vita fra gli animali allo studio del Mana. I druidi rispettano il Velo senza condividerne la fede, e la città li teme perché il loro Bosco la ripara dalle tempeste di Marea."

  - id: tribu-dei-nove-chiodi
    nome: Tribù dei Nove Chiodi
    alias: [Nove Chiodi]
    tipo: fazione
    sottotitolo: "Tribù orchesca del Bosco della Forca"
    testo: "Tribù orchesca del Bosco della Forca, la più metodica delle cinque del circondario. Tiene vedette fisse sulle rotte fra Qir-Azel e Laresh per conoscere le ore dei convogli, e con il metallo rubato alle carovane si fabbrica armi e palizzate."

  # ------------------------------------------------------------------ creature
  - id: salvaguardia-dei-precursori
    nome: Salvaguardia dei Precursori
    alias: [Salvaguardia]
    tipo: creatura
    sottotitolo: "Le macchine che sorvegliano le rovine"
    testo: "Il nome che i Raschiatori danno alle macchine dei Precursori che sorvegliano le rovine dall'interno, come il ragno a quattro braccia con la maschera bianca senza bocca. La regola di mestiere è chiudere la spedizione prima di incontrarne una."

  - id: cinghiale-corazzato
    nome: cinghiale corazzato
    tipo: creatura
    sottotitolo: "Bestia mutata dalla Marea Grigia"
    testo: "Cinghiale mutato dalla Marea Grigia, alto al garrese quanto un uomo, con la pelle nera e lucida e vene color acciaio sotto la cotenna. Ha gli occhi rossi e senza pupilla ed è abbastanza forte da portare in sella un orco in armatura."

  - id: farfalle-foglia-rossa
    nome: farfalle foglia-rossa
    tipo: creatura
    sottotitolo: "Le farfalle del Festival delle Foglie Alate"
    testo: "Farfalle dalle ali rosse a forma di foglia, che nei racconti per bambini abitano il Bosco di Velthar. Ogni anno, a mezzogiorno del Festival delle Foglie Alate, gli accoliti del Velo ne liberano uno sciame da un carro coperto da un drappo cremisi."

  # ------------------------------------------------------------------ cose
  - id: marea-grigia
    nome: Marea Grigia
    alias: [Marea]
    tipo: cosa
    sottotitolo: "La nebbia che uccide o muta"
    testo: "Nebbia lattiginosa dal riflesso metallico e dall'odore di ozono, che risale dalle rovine e dalla Cicatrice. Colpisce prima la mente e poi il corpo, e chi la respira muore in fretta oppure muta. I cristalli conduttori proteggono per un tratto."

  - id: mana
    nome: Mana
    tipo: cosa
    sottotitolo: "L'energia dei Cristalli Conduttori"
    testo: "L'energia arcana che i Cristalli Conduttori immagazzinano, e che a Qir-Azel dà luce e calore alle case e muove l'acqua della condotta. Solo i maghi sanno infonderla. Il nome risale al 70 D.C., quando i maghi superstiti cominciarono a manipolare i cristalli."

  - id: cristalli-conduttori
    nome: Cristalli Conduttori
    alias: [Cristallo Conduttore, cristalli conduttori, cristallo conduttore]
    tipo: cosa
    sottotitolo: "I cristalli che tengono accesa la città"
    testo: "Cristalli traslucidi recuperati dalle rovine dei Precursori, che immagazzinano il Mana e su cui gira l'economia di Qir-Azel. Con l'uso si incrinano e si esauriscono. Quelli registrati passano dalla Gilda, gli altri finiscono al Mercato delle Ombre."

  - id: lyssan
    nome: lyssan
    tipo: cosa
    sottotitolo: "Il metallo dei Precursori"
    testo: "Metallo dei Precursori che reagisce al Mana e, lavorato con i riti sbagliati, si spegne in un grigio senza valore. Lo raffina solo l'Acciaieria dei Tarvelin, dove gli operai lavorano in silenzio perché dicono che il lyssan ascolti."

  - id: precursori
    nome: Precursori
    tipo: cosa
    sottotitolo: "La civiltà scomparsa con la Caduta"
    testo: "La civiltà scomparsa con la Caduta, tanto avanzata da piegare la realtà. Ne restano le rovine, con le macchine che vi dormono ancora, e i cristalli conduttori su cui vive Qir-Azel."

  # La Dama d'Argento si scopre con la pista (pista.dama-argento 0 → 1): prima nessuno traduce Mawrak'Thur.
  # Chi sia lo dice la Madre del Velo a pista.capomozzo 7.
  - id: dama-d-argento
    nome: Dama d'Argento
    alias: [Dama]
    tipo: cosa
    sottotitolo: "Il nome gridato dagli orchi durante la razzia"
    testo: "Il nome che gli orchi gridavano durante la razzia del Festival delle Foglie Alate, *Mawrak'Thur* nella loro lingua. In città nessuno sa a chi si riferisca, né se si tratti di una persona in carne e ossa."
    requisiti: [pista.dama-argento >= 1, pista.capomozzo < 7]

  - id: dama-d-argento-aurenne
    nome: Dama d'Argento
    alias: [Dama]
    tipo: cosa
    sottotitolo: "Il nome gridato dagli orchi durante la razzia"
    testo: "Il nome che gli orchi gridavano durante la razzia delle Foglie Alate, *Mawrak'Thur*. Era Aurenne, la figlia adottiva del cappellano Idrian Sollen, che il Velo dava per morta nell'incendio del Santuario. In città lo sanno in pochi, Madre del Velo compresa."
    requisiti: [pista.capomozzo >= 7]

  - id: mawrak-thur
    nome: Mawrak'Thur
    alias: [Mawrak-Thur]
    tipo: cosa
    sottotitolo: "La parola orchesca della razzia"
    testo: "Parola orchesca che gli orchi cantavano come una preghiera durante la razzia del Festival delle Foglie Alate. A Qir-Azel l'orchesco lo parlano solo qualche ranger e i mercanti che hanno trafficato con i Nove Chiodi."
    requisiti: [pista.dama-argento == 0]

  - id: mawrak-thur-tradotta
    nome: Mawrak'Thur
    alias: [Mawrak-Thur]
    tipo: cosa
    sottotitolo: "La parola orchesca della razzia"
    testo: "Parola orchesca che gli orchi cantavano come una preghiera durante la razzia del Festival delle Foglie Alate, e che vuol dire Dama d'Argento. A Qir-Azel l'orchesco lo parlano solo qualche ranger e i mercanti che hanno trafficato con i Nove Chiodi."
    requisiti: [pista.capomozzo < 7]

  - id: mawrak-thur-aurenne
    nome: Mawrak'Thur
    alias: [Mawrak-Thur]
    tipo: cosa
    sottotitolo: "La parola orchesca della razzia"
    testo: "Parola orchesca che gli orchi cantavano come una preghiera durante la razzia del Festival delle Foglie Alate. Vuol dire Dama d'Argento, ed era il nome con cui salutavano Aurenne, la figlia adottiva di Idrian Sollen."
    requisiti: []

  - id: festival-delle-foglie-alate
    nome: Festival delle Foglie Alate
    alias: [Foglie Alate, Festival]
    tipo: cosa
    sottotitolo: "La festa del primo giorno d'autunno"
    testo: "La festa del primo giorno d'autunno, legata al culto del Grande Albero Rosso. A mezzogiorno si narra la parabola della Prima Foglia, e gli accoliti del Velo liberano uno sciame di farfalle foglia-rossa che i bambini inseguono per tutto il pomeriggio."

  - id: preghiera-del-battito
    nome: Preghiera del Battito
    tipo: cosa
    sottotitolo: "La formula dei riti di purificazione"
    testo: "Breve formula che gli accoliti del Velo recitano nei riti di purificazione e nelle veglie, «Finché il cuore del mondo batterà, anche noi ricorderemo». La tradizione la attribuisce al Veggente del Ferro, che per primo interpretò il battito salito dal terreno."

  - id: notte-dei-sussurri
    nome: Notte dei Sussurri
    tipo: cosa
    sottotitolo: "La notte del 137 D.C."
    testo: "La notte di tempesta del 137 D.C. in cui la Marea Grigia salì fino a lambire il vecchio Santuario, senza fare vittime. Nei giorni seguenti molti nei Quartieri Alti raccontarono di voci metalliche salite dal suolo in una lingua sconosciuta."
