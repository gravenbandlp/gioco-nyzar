# Glossario: luoghi, fazioni, creature e cose del mondo che compaiono nei testi del gioco.
# Le voci dei personaggi stanno in personaggi.yaml. Quello che sa un abitante informato
# di Qir-Azel nei giorni dopo la razzia del Festival, senza segreti.
glossario:
  # ------------------------------------------------------------------ la città e i distretti
  - id: qir-azel
    nome: Qir-Azel
    tipo: luogo
    sottotitolo: "Città sul bordo della Cicatrice del Mondo"
    testo: "Città fondata nel 110 D.C. sul bordo della Cicatrice del Mondo, dove le rovine dei Precursori restituivano più cristalli che altrove. Sale a terrazze, con i Quartieri Alti in cima e la Città Bassa sull'altopiano a est, mentre i Ponti Sospesi attraversano il centro da una sponda all'altra. Chi arriva dalla strada vede prima il chiarore della voragine e poi i tetti."

  - id: citta-bassa
    nome: Città Bassa
    tipo: luogo
    sottotitolo: "Il distretto del lavoro, a est"
    testo: "Il distretto del lavoro, su un altopiano di rocce bluastre a est di Qir-Azel. Ci vivono i Raschiatori insieme a fabbri e alchimisti, e gran parte di chi rifornisce il mercato dei Ponti, in case basse di pietra grezza e lamiera. Dalle fenditure del terreno sale un calore costante, e in quartiere si dice che quando il martello delle fucine smette di battere è morto qualcuno."

  - id: quartieri-alti
    nome: Quartieri Alti
    tipo: luogo
    sottotitolo: "La terrazza più alta di Qir-Azel"
    testo: "La terrazza più alta di Qir-Azel, affacciata a ovest sulla Cicatrice. Ha strade di pietra chiara e tetti di rame, illuminati da lanterne a cristalli conduttori che non fanno fumo. Vi abitano le famiglie che contano, e vi hanno sede la Cattedrale del Velo e la Casa dei Nodi. La sera gli obelischi di cristallo ronzano e tengono lontane dai ponti le creature della Marea."

  - id: ponti-sospesi
    nome: Ponti Sospesi
    alias: [Ponti]
    tipo: luogo
    sottotitolo: "Il reticolo di ponti sopra il centro"
    testo: "Reticolo di travi e piattaforme tenute dalle corde, gettato sopra il centro di Qir-Azel da una sponda all'altra della Cicatrice. È il cuore commerciale della città e il territorio della Gilda dei Mercanti, che riscuote una gabella a ogni passaggio. Le lanterne di Mana restano accese giorno e notte, e molte famiglie vivono in case di legno appese sopra il vuoto."

  - id: cicatrice-del-mondo
    nome: Cicatrice del Mondo
    alias: [Cicatrice]
    tipo: luogo
    sottotitolo: "La voragine su cui sorge Qir-Azel"
    testo: "L'immensa voragine sul cui bordo sorge Qir-Azel. Nessuna corda ne ha mai toccato il fondo, e le pietre lanciate dentro non restituiscono l'eco. Di notte ne salgono bagliori simili ad aurore, visibili a miglia di distanza, e ogni tanto un suono basso che precede di pochi minuti i tremori della città. Nelle sue profondità si apre il Labirinto di Darn-Morakh."

  # ------------------------------------------------------------------ ponti e strade
  - id: ponte-delle-mille-corde
    nome: Ponte delle Mille Corde
    tipo: luogo
    sottotitolo: "La via principale dei Ponti Sospesi"
    testo: "La via principale dei Ponti Sospesi, che vibra di continuo sotto il passaggio di mercanti e Raschiatori. All'imbocco i Custodi di Passaggio riscuotono la gabella dal loro gabbiotto. Sulle sue piattaforme si stende il bazaar del Mercato dei Nodi, e a metà strada c'è la Locanda del Grifone di Ferro. Da sotto lo si riconosce per il rumore delle ruote sulle assi."

  - id: ponte-dei-morti
    nome: Ponte dei Morti
    tipo: luogo
    sottotitolo: "Ponte delle lanterne, nei Ponti Sospesi"
    testo: "Uno dei primi ponti di Qir-Azel, in metallo annerito tenuto insieme da bulloni ribattuti a mano. Ai parapetti i Raschiatori appendono una lanterna per ogni compagno disperso nel Labirinto, con dentro un piccolo cristallo che brucia per anni, finché regge. Ogni squadra cura le proprie, e alcune lanterne hanno ormai un nome anche se il compagno è scomparso da decenni."

  - id: ponte-del-pesce
    nome: Ponte del Pesce
    tipo: luogo
    sottotitolo: "Dalla Città Bassa ai Ponti Sospesi"
    testo: "Arco di pietra rossa che porta dalla Città Bassa ai Ponti Sospesi, consumato al centro dalle ruote dei carretti. Il parapetto è basso e trattiene fino a sera il calore del giorno, e chi ci si appoggia sente scorrere dell'acqua molto più in basso. All'alba da lì si vedono spegnersi a una a una le lanterne dei custodi di notte."

  - id: ponte-del-conciatore
    nome: Ponte del Conciatore
    tipo: luogo
    sottotitolo: "Ponte di legno sul Torvessa, verso ovest"
    testo: "Ponte di legno spesso, rinforzato con pietre alla base, che attraversa il Torvessa al margine occidentale di Qir-Azel. Il nome viene dalle vecchie concerie, che fino a una sessantina d'anni fa ci scaricavano gli scarti delle vasche. Oggi è la via di transito principale verso ovest, e chi parte per Laresh lo attraversa al mattino."

  - id: via-dei-rasoi
    nome: Via dei Rasoi
    tipo: luogo
    sottotitolo: "Strada della Città Bassa"
    testo: "Strada della Città Bassa che sale dal margine dell'Orlo dei Rottami e non corre mai dritta. A metà fa un gomito ad angolo retto attorno a un vecchio cristallo conduttore spento, una scheggia opaca alta come due uomini. All'angolo con Via del Salmone sorge la Maison des Lunes. La sera ci passa poca gente, e i rumori scendono dalle finestre socchiuse."

  - id: via-del-salmone
    nome: Via del Salmone
    tipo: luogo
    sottotitolo: "Strada della Città Bassa"
    testo: "Strada della Città Bassa che incrocia Via dei Rasoi all'altezza della Maison des Lunes, una casa di legno a tre piani con le tende sempre chiuse. Di sera metà delle sue lanterne resta spenta. I vicini dell'angolo tengono d'occhio la porta della Maison fingendo di discutere del prezzo del sale."

  # ------------------------------------------------------------------ locande e botteghe
  - id: pignatta-grassa
    nome: Pignatta Grassa
    alias: [Pignatta]
    tipo: luogo
    sottotitolo: "Taverna della Città Bassa"
    testo: "Taverna della Città Bassa, gestita dall'oste Mauro Scrocco, che tratta tutti come parenti e alza la voce per abitudine. Lo sceriffo la sconsiglia ai forestieri, e per questo è sempre piena. Il fumo è così denso che le lanterne si vedono appena, al tavolo verde si gioca a carte, e in città si dice che sia il ritrovo degli Scuri."

  - id: locanda-del-grifone-di-ferro
    nome: Locanda del Grifone di Ferro
    alias: [Grifone di Ferro, Locanda del Grifone, Grifone]
    tipo: luogo
    sottotitolo: "Locanda sul Ponte delle Mille Corde"
    testo: "La locanda più antica di Qir-Azel, su una piattaforma larga quanto una piazza a metà del Ponte delle Mille Corde, con un grifone arrugginito sul tetto. È il punto fermo dei Raschiatori, l'unica dove possono bere senza occhiate storte. La proprietaria, Liaren Tarvelin, ha una sola regola, e chi entra con uno schiavo al seguito ne esce con un occhio nero."

  - id: locanda-del-daino-zoppo
    nome: Locanda del Daino Zoppo
    alias: [Daino Zoppo]
    tipo: luogo
    sottotitolo: "Locanda dei Quartieri Alti, vicino alla porta nord"
    testo: "Locanda solida e ben tenuta nei Quartieri Alti, a pochi passi dalla porta nord. È il primo riparo per i mercanti e i pellegrini che entrano in città da quel lato, e la sala al piano terra serve piatti caldi a ogni ora. Il capoguerra della razzia è stato abbattuto poco lontano, sulla strada della porta."

  - id: locanda-di-ilka
    nome: Locanda di Ilka
    tipo: luogo
    sottotitolo: "Taverna della Città Bassa"
    testo: "Uno degli edifici più vecchi di Qir-Azel, in una strada appartata della Città Bassa. Ha un solo piano dipinto a colori vivaci con i motivi dei carri olvari, e sull'insegna c'è la Vecchia Luce fra tende e carri attorno a un falò. Serve sidro e patate speziate, e ci vengono quasi solo quelli del quartiere."

  - id: maison-des-lunes
    nome: Maison des Lunes
    alias: [Maison]
    tipo: luogo
    sottotitolo: "Casa di piacere della Città Bassa"
    testo: "Casa di piacere in legno a tre piani, all'angolo tra Via del Salmone e Via dei Rasoi. Non ha insegna e tiene le tende sempre chiuse, e accanto alla porta pende una catena di bronzo con la scritta «Ospiti Benvenuti». La dirige Nerissa Dalvane, che riceve solo su appuntamento e ha costruito la reputazione della casa sulla discrezione verso i clienti."

  - id: nodo-d-ossidiana
    nome: Nodo d'Ossidiana
    tipo: luogo
    sottotitolo: "Bottega di oggetti magici sul Mercato dei Nodi"
    testo: "Bottega di oggetti magici sul Mercato dei Nodi, con una facciata stretta e alta di pietra chiara venata di verde. L'insegna è un serpente alato intagliato, con due gemme opache al posto degli occhi. Dentro gli scaffali arrivano al soffitto e il rumore del mercato si attenua di colpo. La tiene Ambrin Qell, che saluta i clienti senza alzarsi."

  - id: fucina-dei-due-mastini
    nome: Fucina dei Due Mastini
    tipo: luogo
    sottotitolo: "La bottega del fabbro Bram Halgast"
    testo: "La bottega del fabbro Bram Halgast in Città Bassa, lontana dal frastuono del bazaar. È un edificio basso di pietra annerita dal fumo, dove si suda anche d'inverno. All'ingresso stanno distesi due grossi cani dal pelo rosso scuro che non abbaiano mai. Bram firma ogni pezzo che esce dalla sua incudine con un martello di pietra inciso."

  - id: conceria-kasselt
    nome: Conceria Kasselt
    alias: [Conceria]
    tipo: luogo
    sottotitolo: "Bottega del cuoio in Città Bassa"
    testo: "Bottega di cuoio della Città Bassa, fra le migliori della regione. Il padrone Gunter Kasselt lavora più ore di qualunque suo operaio e caccia chi sbaglia al primo errore. Quelli che resistono li paga bene. La conceria rifornisce l'Armeria di Irsa e, ogni tanto, la Cattedrale del Velo."

  - id: dispensa-di-gramm
    nome: Dispensa di Gramm
    alias: [Dispensa]
    tipo: luogo
    sottotitolo: "Erboristeria di Nestor Gramm"
    testo: "L'erboristeria di Nestor Gramm in Città Bassa. Dalla porta principale si entra per comprare tisane e infusi, dal vicolo per tutto il resto. Nestor è basso e tozzo, diffidente con i clienti e metodico fino a complicare le cose semplici, e nel retro tiene una pasta nera che chiude le ferite gravi."

  - id: segheria-di-qir-azel
    nome: Segheria di Qir-Azel
    alias: [Segheria Malgrani, Segheria]
    tipo: luogo
    sottotitolo: "La segheria su concessione dei Malgrani"
    testo: "Uno dei primi edifici sorti dopo la fondazione della città. Lavora il legname dei boschi del circondario su concessione della famiglia Malgrani, e per questo tutti la chiamano Segheria Malgrani. Un grosso cristallo conduttore romboidale muove l'acqua del canale e le lame fino a notte, e i vicini si lamentano del rumore senza mai portare la causa davanti a un giudice."

  - id: acciaieria-dei-tarvelin
    nome: Acciaieria dei Tarvelin
    alias: [Acciaieria]
    tipo: luogo
    sottotitolo: "L'unica raffineria di lyssan della regione"
    testo: "L'unico impianto della regione dove si raffina il lyssan, il metallo dei Precursori. Appartiene alla famiglia Tarvelin, e Ondrel Tarvelin lo dirige di persona. Il turno di notte comincia quando la colata diventa azzurra, e gli operai lavorano in silenzio sotto maschere di cuoio con le lenti affumicate. Ottone Malgrani vorrebbe comprarlo da anni."

  # ------------------------------------------------------------------ luoghi della Città Bassa
  - id: orlo-dei-rottami
    nome: Orlo dei Rottami
    alias: [Orlo]
    tipo: luogo
    sottotitolo: "La spiaggia dei rottami, in Città Bassa"
    testo: "Lingua di terra battuta sotto il margine ovest della Città Bassa, fra l'ultima fila di baracche e il bordo della Cicatrice. Ci finiscono, venduti a peso, i pezzi precuriani sfregiati e i cristalli sterili che i Raschiatori scartano, e una decina di spazzini autorizzati dalla Gilda li smista e li rivende. Di giorno è solo sporco, e di notte le baracche cambiano padrone."

  - id: mercato-delle-ombre
    nome: Mercato delle Ombre
    tipo: luogo
    sottotitolo: "La piazza sotterranea della Città Bassa"
    testo: "Piazza sotterranea sotto la Città Bassa, il segreto peggio custodito di Qir-Azel. Ci si vendono reliquie proibite e Cristalli Conduttori non registrati, a prezzi più alti e con meno domande. Ha più di un ingresso e ogni due o tre mesi cambia stanza, così chi cerca qualcosa deve prima trovare chi sa dove si è spostato."

  - id: cimitero-di-qir-azel
    nome: Cimitero di Qir-Azel
    tipo: luogo
    sottotitolo: "Il cimitero della città"
    testo: "Il cimitero della città, affidato al becchino Gundo Marl, che tiene i registri funebri con una scrittura minuta e una puntualità che pochi sacerdoti eguagliano. Conosce a memoria ogni lapide, e anche le tombe che una lapide non ce l'hanno. Addossata al muro perimetrale c'è la cripta del cappellano Idrian Sollen, morto nell'incendio del Santuario nel 145 D.C."

  # ------------------------------------------------------------------ Quartieri Alti
  - id: cattedrale-del-velo
    nome: Cattedrale del Velo
    alias: [Cattedrale]
    tipo: luogo
    sottotitolo: "La chiesa maggiore di Qir-Azel"
    testo: "La chiesa maggiore di Qir-Azel e sede della Confraternita del Velo, nei Quartieri Alti. È stata eretta in cinque anni sulle ceneri del Santuario bruciato nel 145 D.C. e inaugurata il primo giorno d'autunno del 150, durante il Festival delle Foglie Alate. Le pareti sono in parte organiche, fuse a segmenti di metallo dei Precursori, e l'altare è un cristallo rosso che pulsa."

  - id: cripta-della-cattedrale
    nome: Cripta della Cattedrale
    alias: [Cripta]
    tipo: luogo
    sottotitolo: "La sala sotto l'altare della Cattedrale del Velo"
    testo: "La sala sotto l'altare della Cattedrale del Velo, dove la Madre del Velo officia i riti più solenni. La regola della Confraternita vuole che chi torna dalle profondità passi di qui per la purificazione, e la città la rispetta più di molte leggi. Un accolito velato guarda gli occhi di chi scende e poi la mano sinistra, per vedere se trema."

  - id: giardini-della-linfa
    nome: Giardini della Linfa
    tipo: luogo
    sottotitolo: "I giardini della Cattedrale del Velo"
    testo: "Il giardino che si apre dietro la navata della Cattedrale del Velo, dove la Confraternita coltiva piante bioluminescenti per i riti e per gli unguenti. Le foglie mandano una luce tenue anche a mezzogiorno. Li cura Sorella Giulia, che lascia passeggiare i convalescenti fra le aiuole purché tengano le mani in tasca."

  - id: caserma
    nome: Caserma
    alias: [Guarnigione]
    tipo: luogo
    sottotitolo: "La guarnigione di Qir-Azel, sede dello sceriffo"
    testo: "La guarnigione di Qir-Azel nei Quartieri Alti, sede dello sceriffo Toren Galdrick. Nel cortile la Guardia cittadina e i Raschiatori si addestrano insieme, per un accordo che dura da anni, e al piano interrato ci sono le celle. In Città Bassa la Caserma tiene un posto di guardia in una casa di pietra blu con le inferriate alle finestre."

  - id: municipio
    nome: Municipio
    tipo: luogo
    sottotitolo: "La sede del Consiglio di Qir-Azel"
    testo: "La sede del Consiglio di Qir-Azel nei Quartieri Alti, con le porte più grandi della città. La Rappresentante Julia Castaldi vi tiene le udienze, e chi ha affari con la sua casata deve trattarli qui e mai al maniero. Nei Quartieri Alti si dice che in Municipio si discuta e che le decisioni vere si prendano in Cattedrale."

  - id: casa-dei-nodi
    nome: Casa dei Nodi
    tipo: luogo
    sottotitolo: "Sede della Gilda dei Mercanti"
    testo: "Sede della Gilda dei Mercanti nei Quartieri Alti, un intrico di catene e terrazze che sembrano reggersi a vicenda. Qui lavorano i Custodi di Passaggio e si conserva l'archivio dei dazi. Nel 118 D.C., appena terminata, vi fu firmato il Patto delle Corde. La Casa registra con cura ogni favore che concede, e chi lo riceve se ne ricorda."

  - id: biblioteca
    nome: Biblioteca
    tipo: luogo
    sottotitolo: "L'archivio di Qir-Azel, nei Quartieri Alti"
    testo: "L'archivio di Qir-Azel nei Quartieri Alti, custodito dalla Confraternita del Velo. I piani bassi sono aperti al pubblico, mentre interi corridoi dei piani superiori sono chiusi con cera nera e nastro rosso e non hanno un catalogo consultabile. I suoi cronisti misurano da generazioni i bagliori e i tremori della Cicatrice."

  - id: accademia-di-torvessa
    nome: Accademia di Torvessa
    alias: [Accademia]
    tipo: luogo
    sottotitolo: "La scuola della città"
    testo: "La scuola di Qir-Azel, nei Quartieri Alti, dove si insegna anche la magia. Il preside, Orvald Temmerin, ha passato trent'anni negli scavi e ha accettato la carica a una condizione, che il seminterrato restasse suo. Laggiù tiene la sua collezione di armi e di trofei, e la mostra solo a chi lo tratta con rispetto."

  - id: teatro-delle-meraviglie
    nome: Teatro delle Meraviglie
    tipo: luogo
    sottotitolo: "La sala di Orazio Belcanto"
    testo: "La sala di spettacolo dei Quartieri Alti, di proprietà dell'impresario Orazio Belcanto, che ne è anche il primo attore. I cartelloni eccentrici e gli abiti vistosi sono il suo marchio, e sul palco si ride di cose che in strada sarebbero condanne. La rivalità pubblica fra Orazio e Liaren Tarvelin alimenta i pettegolezzi da anni."

  # ------------------------------------------------------------------ fuori città
  - id: labirinto-di-darn-morakh
    nome: Labirinto di Darn-Morakh
    alias: [Labirinto]
    tipo: luogo
    sottotitolo: "La rovina nel cuore della Cicatrice"
    testo: "La più grande rovina dei Precursori mai scoperta, nascosta nel cuore della Cicatrice del Mondo. È un intreccio di architetture concentriche sospese nel vuoto, e ogni tanto intere porzioni si riorganizzano e cambiano la disposizione dei corridoi. I Raschiatori ci scendono a cercare cristalli, e ai compagni che non tornano dedicano una lanterna sul Ponte dei Morti."

  - id: bosco-della-forca
    nome: Bosco della Forca
    tipo: luogo
    sottotitolo: "Foresta a ovest di Qir-Azel"
    testo: "Foresta di alberi alti e sottobosco fitto a ovest di Qir-Azel, lungo le rotte per Laresh. È il territorio della tribù dei Nove Chiodi, che assalta le carovane da almeno due generazioni e con il metallo rubato si fabbrica armi e palizzate. I pochi mercanti che vi hanno trafficato a lungo hanno imparato l'orchesco per contrattare."

  - id: bosco-di-velthar
    nome: Bosco di Velthar
    tipo: luogo
    sottotitolo: "Foresta antica a nord-ovest"
    testo: "Foresta antichissima a un giorno di cammino a nord-ovest di Qir-Azel. Le sue radici affondano fra rovine sepolte e vene di cristalli esausti, e le cortecce pulsano di bagliori intermittenti. Ci vivono i druidi del Circolo di Velthar, e dalle sue radure vengono le farfalle foglia-rossa che si raccontano ai bambini."

  - id: laresh
    nome: Laresh
    tipo: luogo
    sottotitolo: "Villaggio agricolo del circondario"
    testo: "Villaggio agricolo a ovest di Qir-Azel, fatto di campi a perdita d'occhio punteggiati di mulini e di stalle lungo i rii. Il suo grano resistente è la principale fonte di pane della città. Di notte sui campi galleggiano piccole fiamme azzurrastre, che i contadini chiamano gli spiriti dei morti venuti a custodire il raccolto."

  - id: ghoran
    nome: Ghoran
    tipo: luogo
    sottotitolo: "Insediamento dei clan e dei mercati di schiavi"
    testo: "Insediamento dei clan costruito su pozze di fango, dove le passerelle fra le palafitte annerite cedono di un dito sotto chi non le conosce. Le leggi di Qir-Azel ci valgono solo sulla carta. Vive di mercenariato e di mercati di schiavi, che riforniscono anche la Gilda e i Raschiatori meno scrupolosi. Nei suoi recinti tengono anche orchi prigionieri."

  - id: tuarmir
    nome: Tuarmir
    tipo: luogo
    sottotitolo: "Villaggio di erboristi in una gola"
    testo: "Villaggio scavato nella pietra lungo una gola di roccia scura, dove il sole arriva poche ore al giorno. Vive di erbe medicinali e di muschi rituali, che la Confraternita del Velo compra per le sue preparazioni. Per uscire a raccogliere gli abitanti indossano maschere di stoffa impregnate d'erbe, che a Qir-Azel si usano anche per ripararsi dalla Marea."

  # ------------------------------------------------------------------ fazioni
  - id: raschiatori
    nome: Raschiatori
    alias: [Raschiatore, Raschiatrice]
    tipo: fazione
    sottotitolo: "La corporazione di chi scende nelle rovine"
    testo: "La corporazione di chi scende nelle rovine e nel Labirinto a recuperare cristalli e reliquie, senza i quali la città morirebbe di freddo e di buio. Invece di una gerarchia hanno quattro titoli, che si tramandano per merito e durano finché chi li porta resta vivo. Molti portano mutazioni leggere, come occhi che brillano al buio. Si addestrano in Caserma con la Guardia e si ritrovano al Grifone di Ferro."

  - id: scuri
    nome: Scuri
    alias: [Scuro]
    tipo: fazione
    sottotitolo: "Rete criminale di Qir-Azel e del circondario"
    testo: "Rete di bande criminali attive a Qir-Azel e nei villaggi del circondario, che collaborano fra loro solo quando conviene. Preferiscono il ricatto e il furto al sangue, e vivono di partite truccate e del contrabbando di cristalli non registrati. In città si ritrovano alla Pignatta Grassa, e lo sceriffo lo sa e aspetta un loro passo falso."

  - id: confraternita-del-velo
    nome: Confraternita del Velo
    alias: [Confraternita, Velo]
    tipo: fazione
    sottotitolo: "L'ordine religioso del Grande Albero Rosso"
    testo: "L'ordine religioso che custodisce a Qir-Azel la fede nel Grande Albero Rosso, con sede nella Cattedrale del Velo. Controlla gli accessi al Labirinto e impone i riti di purificazione a chi torna dalle profondità. Ogni autunno affigge i bollettini delle sacche di Marea risalite in superficie. La guida la Madre del Velo, che nessuno ha mai visto in volto."

  - id: gilda-dei-mercanti
    nome: Gilda dei Mercanti
    alias: [Gilda]
    tipo: fazione
    sottotitolo: "Padrona dei ponti e dei dazi"
    testo: "L'organismo economico più potente di Qir-Azel, nato nel 118 D.C. dal Patto delle Corde fra le famiglie dei ponti. Controlla ponti e passerelle e fa pagare una gabella a ogni passaggio fra i distretti, e ogni mercante deve essere registrato e versare una commissione mensile. Ha sede nella Casa dei Nodi. Tra la gente comune passa per un male necessario."

  - id: custodi-di-passaggio
    nome: Custodi di Passaggio
    alias: [Custode di Passaggio, Custodi]
    tipo: fazione
    sottotitolo: "I funzionari della Gilda sui ponti"
    testo: "I funzionari della Gilda dei Mercanti che riscuotono i dazi sui ponti e ne curano la manutenzione. Ognuno ha ai suoi ordini un piccolo contingente di guardie, e il loro gabbiotto sta all'imbocco del Ponte delle Mille Corde. Chi commercia senza licenza viene multato e poi bandito, e chi insiste, come si dice sui ponti, viene perso di vista."

  - id: consiglio-di-qir-azel
    nome: Consiglio di Qir-Azel
    alias: [Consiglio]
    tipo: fazione
    sottotitolo: "L'assemblea che governa la città"
    testo: "L'assemblea che governa Qir-Azel dal Municipio, presieduta dalla Rappresentante eletta Julia Castaldi. Ha sette seggi, fra cui quelli dello sceriffo, del sommo sacerdote del Velo, della Gilda dei Mercanti e dei Raschiatori, e le rivalità fra le parti bloccano quasi ogni decisione. La riforma più contestata è il programma di licenze sul grano voluto da Julia."

  - id: famiglia-castaldi
    nome: Famiglia Castaldi
    alias: [Castaldi]
    tipo: fazione
    sottotitolo: "Casata dei Quartieri Alti"
    testo: "Casata dei Quartieri Alti fra le fondatrici di Qir-Azel, nota per la sobrietà più che per la ricchezza. In quarant'anni non ha mai cambiato bandiera né preso parte alle faide della Gilda, ed è per questo che Julia Castaldi ha potuto farsi eleggere Rappresentante. Il maniero apre le porte solo nei giorni di consiglio, e la guardia di casa la comanda Quintus Vael."

  - id: famiglia-malgrani
    nome: Famiglia Malgrani
    alias: [Malgrani]
    tipo: fazione
    sottotitolo: "Casata dei mulini e delle segherie"
    testo: "Casata della prima ondata di coloni, guidata da Ottone Malgrani. Controlla tutti i mulini e le segherie di Qir-Azel, e con la filiera del grano e del legname si è fatta un peso decisivo nella Gilda dei Mercanti. Negli ultimi anni sono bruciati tre mulini concorrenti, e in molti ne accusano la famiglia senza prove. Lo stemma è un albero trafitto da una lama."

  - id: famiglia-tarvelin
    nome: Famiglia Tarvelin
    alias: [Casato Tarvelin, Tarvelin]
    tipo: fazione
    sottotitolo: "Casata dell'Acciaieria"
    testo: "Casata dei Quartieri Alti fra le firmatarie del Patto delle Corde. La sua ricchezza è l'Acciaieria, l'unica della regione che sappia raffinare il lyssan, diretta di persona da Ondrel Tarvelin. Il maniero di famiglia è il più silenzioso del quartiere, e il suo giardino è chiuso da dieci anni. L'erede, Liaren, ha lasciato il casato da giovane per andare all'avventura."

  - id: circolo-di-velthar
    nome: Circolo di Velthar
    alias: [Circolo]
    tipo: fazione
    sottotitolo: "I druidi del Bosco di Velthar"
    testo: "Il circolo druidico del Bosco di Velthar, diviso in tre vie che vanno dalla vita fra gli animali allo studio del Mana. I druidi rispettano la Confraternita senza condividerne la fede, e molti considerano il Grande Albero Rosso una leggenda. A chi cresce con loro insegnano ad ascoltare una bestia prima di toccarla e a calmare i cavalli con la voce."

  - id: tribu-dei-nove-chiodi
    nome: Tribù dei Nove Chiodi
    alias: [Nove Chiodi]
    tipo: fazione
    sottotitolo: "Tribù orchesca del Bosco della Forca"
    testo: "Tribù orchesca del Bosco della Forca, nota per gli assalti alle carovane fra Qir-Azel e Laresh. Fra le cinque tribù del circondario è la più metodica, tiene vedette fisse sulle rotte e ricicla il metallo rubato in armi e palizzate. È senza un capotribù riconosciuto da quando il suo campione Uzgreth è sparito in una caverna del bosco, mesi fa."

  # ------------------------------------------------------------------ creature
  - id: salvaguardia-dei-precursori
    nome: Salvaguardia dei Precursori
    alias: [Salvaguardia]
    tipo: creatura
    sottotitolo: "Le macchine che sorvegliano le rovine"
    testo: "Il nome con cui i Raschiatori veterani chiamano le macchine dei Precursori che sorvegliano le rovine dall'interno. Ce ne sono di forme diverse, come il ragno a quattro braccia con la maschera bianca senza bocca. La regola di mestiere è chiudere la spedizione prima di incontrarne una. La sera del Festival tre di queste macchine sono comparse per le vie di Qir-Azel."

  - id: cinghiale-corazzato
    nome: cinghiale corazzato
    tipo: creatura
    sottotitolo: "La cavalcatura del capoguerra della razzia"
    testo: "La cavalcatura del capoguerra orco che ha guidato la razzia del Festival, un cinghiale alto al garrese quanto un uomo e mutato dalla Marea Grigia. Aveva la pelle nera e lucida, e sotto la cotenna gli pulsavano vene color acciaio. È stato abbattuto con il suo cavaliere presso la porta nord, e in città nessuno ne aveva mai visto uno simile."

  - id: farfalle-foglia-rossa
    nome: farfalle foglia-rossa
    tipo: creatura
    sottotitolo: "Le farfalle del Festival delle Foglie Alate"
    testo: "Farfalle dalle ali rosse a forma di foglia, che nei racconti per bambini abitano il Bosco di Velthar. Al Festival delle Foglie Alate di quest'anno Padre Vantes ne ha liberato uno sciame a mezzogiorno, da un carro coperto da un drappo cremisi, davanti alla Cattedrale nuova. Nel pomeriggio, prima della razzia, volavano ancora sopra i tetti della piazza."

  # ------------------------------------------------------------------ cose
  - id: marea-grigia
    nome: Marea Grigia
    alias: [Marea]
    tipo: cosa
    sottotitolo: "La nebbia che uccide o muta"
    testo: "Nebbia lattiginosa dal riflesso metallico, con un odore di ozono e di ferro, che risale dalle rovine e dalla Cicatrice. Colpisce prima la mente e poi il corpo, e chi la respira muore in fretta oppure muta. I cristalli conduttori portati in bracciali o amuleti proteggono per un tratto, e ogni autunno la Confraternita del Velo affigge i bollettini delle sacche risalite."

  - id: mana
    nome: Mana
    tipo: cosa
    sottotitolo: "L'energia dei Cristalli Conduttori"
    testo: "L'energia arcana che i Cristalli Conduttori immagazzinano e trasmettono, e che a Qir-Azel dà luce e calore alle case e muove l'acqua della condotta. Solo i maghi sanno infonderla e regolarla, e per questo sono temuti quanto venerati. Il nome risale al 70 D.C., quando i maghi superstiti cominciarono a manipolare i cristalli."

  - id: cristalli-conduttori
    nome: Cristalli Conduttori
    alias: [Cristallo Conduttore, cristalli conduttori, cristallo conduttore]
    tipo: cosa
    sottotitolo: "I cristalli che tengono accesa la città"
    testo: "Cristalli traslucidi recuperati dalle rovine dei Precursori, capaci di immagazzinare il Mana. Regolati dai maghi danno luce alle lanterne e muovono l'acqua dei canali, e l'intera economia di Qir-Azel gira intorno a loro. Con l'uso si incrinano e si esauriscono. Quelli registrati passano dalla Gilda, gli altri finiscono al Mercato delle Ombre."

  - id: lyssan
    nome: lyssan
    tipo: cosa
    sottotitolo: "Il metallo dei Precursori"
    testo: "Metallo dei Precursori che reagisce al Mana e cambia colore se viene lavorato con i riti sbagliati, fino a un grigio spento che non vale più niente. In tutta la regione lo raffina soltanto l'Acciaieria dei Tarvelin, dove gli operai lavorano in silenzio perché dicono che il lyssan ascolti. All'Accademia di Torvessa se ne usano le placche come bersaglio per gli incantesimi."

  - id: precursori
    nome: Precursori
    tipo: cosa
    sottotitolo: "La civiltà scomparsa con la Caduta"
    testo: "La civiltà scomparsa con la Caduta, tanto avanzata da piegare la realtà alla propria volontà. Ne restano le rovine, con le macchine che vi dormono ancora, e i cristalli conduttori su cui vive Qir-Azel. I Raschiatori dicono che le loro cose vanno lasciate dove sono. Il Labirinto di Darn-Morakh è la più grande delle loro opere mai scoperte."

  - id: dama-d-argento
    nome: Dama d'Argento
    alias: [Dama]
    tipo: cosa
    sottotitolo: "Il nome gridato dagli orchi durante la razzia"
    testo: "Il nome che gli orchi gridavano nei loro canti durante la razzia del Festival delle Foglie Alate, salutandola come colei che domina le macchine. In città nessuno sa a chi si riferisca, né se si tratti di una persona in carne e ossa. Da allora il nome gira nelle code alla fontana e nelle taverne, sempre a voce bassa."

  - id: mawrak-thur
    nome: Mawrak-Thur
    alias: [Mawrak'Thur]
    tipo: cosa
    sottotitolo: "La parola orchesca della razzia"
    testo: "Parola orchesca che gli orchi cantavano a gran voce durante la razzia del Festival, quasi fosse una preghiera. Da allora in Città Bassa la si sente ripetere nelle code alla fontana, di solito a mezza voce. In città l'orchesco lo parlano solo qualche ranger e i mercanti che hanno trafficato con i Nove Chiodi, e chi lo capisce tende a non vantarsene."

  - id: festival-delle-foglie-alate
    nome: Festival delle Foglie Alate
    alias: [Foglie Alate, Festival]
    tipo: cosa
    sottotitolo: "La festa del primo giorno d'autunno"
    testo: "La festa del primo giorno d'autunno, con la parabola della Prima Foglia e lo sciame di farfalle foglia-rossa liberato a mezzogiorno. Quest'anno ha coinciso con l'inaugurazione della nuova Cattedrale del Velo. Al tramonto cinque tribù orchesche hanno assaltato insieme la città, cosa mai accaduta a memoria d'uomo, e i morti sono stati circa cinquanta."

  - id: preghiera-del-battito
    nome: Preghiera del Battito
    tipo: cosa
    sottotitolo: "La formula dei riti di purificazione"
    testo: "Breve formula che gli accoliti della Confraternita del Velo recitano a turno nei riti di purificazione e nelle veglie. Dice «Finché il cuore del mondo batterà, anche noi ricorderemo». La tradizione la attribuisce al Veggente del Ferro, che ai tempi dei primi coloni interpretò per primo il battito salito dal terreno, e nelle vecchie guerre si diceva che curasse alcune mutazioni."

  - id: notte-dei-sussurri
    nome: Notte dei Sussurri
    tipo: cosa
    sottotitolo: "La notte del 137 D.C."
    testo: "La notte di tempesta del 137 D.C. in cui la Marea Grigia salì oltre ogni livello conosciuto, superò i Ponti Sospesi e arrivò a lambire la Cattedrale, senza fare vittime. Nei giorni seguenti molti abitanti dei Quartieri Alti raccontarono di aver udito voci metalliche salire dal suolo, in una lingua sconosciuta, e alcuni giurarono di aver sentito il proprio nome."
