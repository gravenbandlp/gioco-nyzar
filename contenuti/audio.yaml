# Audio del gioco. Due canali che suonano insieme, ciascuno in loop e con il suo volume:
# la musica (la colonna sonora) e l'ambiente (rumori di fondo).
#
# Le tracce originali stanno fuori dal repository, in ../audio-nyzar/musica e ../audio-nyzar/ambienti, perché
# il repository è pubblico e le licenze non permettono di ridistribuire i file sciolti. `npm run audio` le
# importa in public/audio/<tipo>/<id>.mp3 (cartella ignorata da git) e le include nel gioco pubblicato.
#
# `volume` livella le tracce fra loro: la musica è portata a circa -20 LUFS. Gli ambienti li livella già
# `npm run audio` (a -30 LUFS), quindi il loro volume si tocca solo per correggere a orecchio.
#
# La colonna sonora dice cosa suona dove. Vince la voce più specifica:
#   combattimento > crisi > prologo > luogo > area > predefinita (e creazione, prima di avere un personaggio).
# Una voce può dare solo la musica o solo l'ambiente: il resto si eredita dal livello sotto.
# `ambiente: nessuno` spegne l'ambiente ereditato.

tracce:
  # ------------------------------------------------------------ musica (Lisette Amago, colonna sonora dark fantasy in due volumi)
  - { id: elkmire-keep, tipo: musica, titolo: Elkmire Keep, autore: Lisette Amago, sorgente: "Elkmire Keep (LOOP).mp3", volume: 0.52 }
  - { id: distant-journey, tipo: musica, titolo: Distant Journey, autore: Lisette Amago, sorgente: "Distant Journey (LOOP).mp3", volume: 0.72 }
