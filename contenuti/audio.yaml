  - { id: hellish-dungeon, tipo: ambiente, titolo: Hellish Dungeon I, autore: Andrea Baroni, sorgente: HellishDungeonI }
  - { id: mines, tipo: ambiente, titolo: Mines, autore: Andrea Baroni, sorgente: Mines }
