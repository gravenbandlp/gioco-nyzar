  - { id: kingdom-of-branevil, tipo: musica, titolo: Kingdom of Branevil, autore: Lisette Amago, sorgente: "Kingdom of Branevil - (LOOP).mp3", volume: 0.79 }
  - { id: chapel-of-nyx, tipo: musica, titolo: Chapel of Nyx, autore: Lisette Amago, sorgente: "Chapel of Nyx (LOOP).mp3", volume: 1 }
  - { id: library-of-veles, tipo: musica, titolo: Library of Veles, autore: Lisette Amago, sorgente: "Library of Veles (LOOP).mp3", volume: 0.62 }
  - { id: nefarious-schemes, tipo: musica, titolo: Nefarious Schemes, autore: Lisette Amago, sorgente: "Nefarious Schemes (LOOP).mp3", volume: 0.58 }
  - { id: goblin-ritual, tipo: musica, titolo: Goblin Ritual, autore: Lisette Amago, sorgente: "Goblin Ritual (LOOP).mp3", volume: 0.74 }

  # ------------------------------------------------------------ musica delle spedizioni (Graven, il progetto black metal di Luca Pasini)
  # Uncharted Dreams per le partenze nell'ignoto, The Light That Failed per le discese fra i Precursori,
  # A Hundred Deaths per le spedizioni più feroci, Our Wounds, Our Crown per quelle più quiete e malinconiche.
  # Le spedizioni delle fazioni hanno la colonna nei loro file (contenuti/fazioni). Ricompressi a 160 kbps,
  # volume portato a circa -20 LUFS (gli originali stanno fra -8 e -11).
  - { id: uncharted-dreams, tipo: musica, titolo: Uncharted Dreams, autore: Graven, sorgente: "Graven - Uncharted Dreams.mp3", volume: 0.36 }
  - { id: the-light-that-failed, tipo: musica, titolo: The Light That Failed, autore: Graven, sorgente: "Graven - The Light That Failed.mp3", volume: 0.3 }
  - { id: a-hundred-deaths, tipo: musica, titolo: A Hundred Deaths, autore: Graven, sorgente: "Graven - A Hundred Deaths.mp3", volume: 0.25 }
  - { id: our-wounds-our-crown, tipo: musica, titolo: "Our Wounds, Our Crown", autore: Graven, sorgente: "Graven - Our Wounds, Our Crown.mp3", volume: 0.34 }

