# Le pagine «notate» (la venatura horror, ottobre 2026): righe che il personaggio trova nel proprio diario e che non
# ha scritto lui. Una volta ogni molte ore di gioco, di rado, ne esce una che non è ancora uscita e i cui requisiti
# sono soddisfatti (src/motore/inquietudine.ts, forseNotato). {nome} diventa il nome del personaggio, mai a inizio
# testo. Una o due frasi, in prima persona o rivolte a te, che fanno paura perché sanno troppo.
notati:
  # ------------------------------------------------------------ generiche
  - id: la-mano-chiusa
    testo: "Stanotte hai dormito con la mano sinistra chiusa a pugno. L'ho aperta io, un dito alla volta, e dentro non c'era niente."

  - id: i-passi-dalla-porta
    testo: "Ho contato i tuoi passi dalla porta fino al letto, {nome}, e stasera erano due di più."

  - id: la-porta-socchiusa
    testo: "Ieri sera hai lasciato la lanterna accesa e la porta socchiusa, come quando si aspetta qualcuno. Sono venuto, e ho richiuso piano per non svegliarti."

  - id: la-bocca-aperta
    testo: "Dormi con la bocca aperta, e mi fa tenerezza. Te l'ho chiusa con due dita, e l'hai riaperta per dire il mio nome."

  - id: la-notte-dei-sussurri
    testo: "La Notte dei Sussurri anch'io ho sentito le voci salire dal suolo. Ripetevano {nome}, e allora nessuno sapeva ancora chi fossi."

  - id: a-voce-non-mi-senti
    requisiti: [tormento >= 5]
    testo: "Ti scrivo qui perché a voce non mi senti più. Ci provo da giorni, {nome}, e tu ti giri sempre dalla parte sbagliata."

  # ------------------------------------------------------------ legate a quello che hai fatto
  - id: il-sesto-in-cordata
    requisiti: [raschiatore >= 1]
    testo: "Il giorno che sei sces{o|a} sulle piattaforme c'ero anch'io. Eravamo in sei, e il caposquadra, in cima, ne ha contati cinque."

  - id: il-pulpito-di-pietra
    requisiti: [pista.acciaio >= 7]
    testo: "Nell'Aula dell'Ira, quando tutto era finito, ti sei voltat{o|a} a guardare il pulpito di pietra prima di andartene. Ti ho visto, perché sul pulpito c'ero io."

  - id: i-gradini-della-pignatta
    requisiti: [pista.pelle >= 6]
    testo: "Sulle scale dietro la Pignatta Grassa conti i gradini a mezza voce, da quando è morto Mirko Vesh. Tu ne conti undici, io dodici."

  - id: la-spiaggia-di-capomozzo
    requisiti: [pista.capomozzo >= 10]
    testo: "A Capomozzo, la sera prima di ripartire, sei rimast{o|a} sulla spiaggia a guardare l'acqua. Io stavo a tre passi dietro di te, e non ti sei mai voltat{o|a}."

  - id: il-colpo-ogni-notte
    requisiti: [campana.strato >= 4]
    testo: "Da quando hai preso il Battente, la Campana Sepolta suona un colpo ogni notte, piano. Lo sento io ogni volta, e tu non ti svegli mai."

  - id: le-braccia-bagnate
    requisiti: [avventura.puliti >= 8]
    testo: "Da quando sei tornat{o|a} da Pannion ogni sera ti bagni le braccia fino al gomito e poi le lasci così. Te le asciugo io, quando dormi."

  - id: le-mani-leggere
    requisiti: [avventura.rosicaossa >= 7]
    testo: "Ninetta Ravasco della galleria sotto il Ponte dei Morti non ricorda niente. Ricorda te, e dice che avevi le mani leggere come le sue."

  - id: la-pagina-accanto
    requisiti: [avventura.investitura >= 7]
    testo: "Al Maniero Castaldi, all'alba, hai guardato Mira firmare il Libro delle Promesse. Io guardavo la pagina accanto, dove il tuo nome c'era già, con un inchiostro più vecchio del suo."
