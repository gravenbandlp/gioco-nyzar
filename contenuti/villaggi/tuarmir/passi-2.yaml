# La quest di Tuarmir, Atto III e la parte dell'Atto IV fuori dalla spedizione (fazione.tuarmir 6 → 10, 11 → 12).
# - 6 → 7 il quaderno delle foglie di Sorella Alenna, in due scene secondo velo.alenna:
#   `tuarmir-il-quaderno-delle-foglie` (velo.alenna != 2): Maela lo custodisce. Con velo.alenna 0 Alenna sta al riparo
#   sotto la porta, nella gola di sotto, e Maela scende da lei ogni due giorni; con velo.alenna 1 è tornata in città e
#   scrive a Maela dalla Cattedrale. Le due varianti sono opzioni con `quando`.
#   `tuarmir-alenna-e-le-misure` (velo.alenna == 2): Alenna vive con Cerya e ti riconosce dalla porta.
#   In tutte e due le minute delle lettere a Padre Aurelio Vantes e lo schizzo dei nastri, che finisce alla croce.
# - 7 → 8 `tuarmir-la-polvere-grigia` (Quartieri Alti): il giovedì di casa Brenn, dove si fuma la polvere dei funghi
#   grigi. Gli ospiti sentono il mare e girano la faccia a nord-est; Lonn Var ha promesso un carico dalla Sella.
# - 8 → 9 `tuarmir-la-notte-che-il-vento-gira` (grado 3, Coltello della gola): il segno della Campana. Il vento soffia
#   da dove prima non soffiava, e Cerya non sa nominare da dove. La roncola della raccolta.
# - 9 → 10 `tuarmir-maela-e-salita`: Maela sale da sola alla Sella con i nastri. Poi l'ingresso della spedizione
#   (spedizione-gola-alta.yaml), che chiude il passo 11.
# - 11 → 12 `tuarmir-la-mappa-dei-nastri` (grado 4, Custode della Sella): la mappa di Maela, il consiglio che vuole
#   riempire la grata di sassi, e Cerya che la lascia com'è. Il mantello di muschio. Ruvo Gessan ascolta dalla porta.
storylet:
  # ------------------------------------------------------------ 6 → 7 · il quaderno delle foglie (Alenna non è a Tuarmir)
  - id: tuarmir-il-quaderno-delle-foglie
    presso: tuarmir
    immagine: ambientazione/tuarmir
    titolo: Il quaderno delle foglie
    sommario: "Maela custodisce il quaderno delle foglie di Sorella Alenna, con le minute delle lettere a Padre Vantes."
    luogo: Tuarmir, il seccatoio, di sera
    area: superficie-fratturata
    requisiti: [fazione.tuarmir == 6, velo.alenna != 2]
    testo: |
      La sera, nel seccatoio, Maela siede sotto i mazzi di cardo con il
      quaderno delle foglie di Sorella Alenna sulle ginocchia. Ogni
      settimana c'è una foglia seccata e incollata, e di pagina in pagina la
      riga grigioblu sul bordo si allarga fino a toccare la nervatura. In
      fondo, piegate in quattro, le minute delle lettere a Padre Aurelio
      Vantes dicono che le erbe di Tuarmir cambiano di una sfumatura e che
      il vento ha girato.

      {empatia Media} Maela tiene il quaderno stretto al petto anche quando
      non legge, come una cosa lasciata da chi ci manca.

      *Le misure finiscono dove finisce il permesso.* Sull'ultima pagina c'è
      uno schizzo della gola con i paletti dei nastri segnati a crocette
      fino al sasso con la croce, e oltre la croce non c'è più niente.
    opzioni:
      - testo: "Leggere con Maela le misure dei nastri"
        descrizione: "Ogni mattina una riga, con la direzione dei nastri, e messe in fila le righe raccontano qualcosa."
        prova: { attributo: mentale, abilita: accademiche, difficolta: Media }
        successo:
          titolo: Entrare
          testo: |
            Messe in fila, le misure dicono che i nastri puntano tutti verso la
            cima e tirano più forte di mese in mese, quindi il vento sale alla
            Sella e lassù entra. Maela scrive *entra* in fondo alla pagina e ti fa
            promettere che i suoi nastri saliranno alla Sella il giorno che Cerya
            lo permetterà.
          pe: { accademiche: 3 }
          effetti: { fazione.tuarmir: 1, rep.tuarmir: 0.5 }
        fallimento:
          titolo: Le colonne
          testo: |
            Ti perdi fra le colonne dei numeri, e il conto lo fa Maela ad alta
            voce. Il vento sale alla Sella, e lei ti fa promettere che i suoi
            nastri ci arriveranno il giorno che Cerya lo permetterà.
          effetti: { fazione.tuarmir: 1, scandalo: 0.5 }
      - testo: "Confrontare le foglie del quaderno con quelle di oggi"
        descrizione: "Una foglia di oggi accanto a quella di un anno fa, a guardare il bordo."
        prova: { attributo: mentale, abilita: natura, difficolta: Media }
        successo:
          titolo: Due foglie
          testo: |
            La riga grigia di una salvia di oggi è larga il doppio di quella della
            prima pagina, e dalla parte esposta al vento. Maela ti fa promettere
            che i suoi nastri saliranno alla Sella il giorno che Cerya lo
            permetterà.
          pe: { natura: 3 }
          effetti: { fazione.tuarmir: 1, rep.tuarmir: 0.5 }
        fallimento:
          titolo: La foglia sbriciolata
          testo: |
            La foglia della prima pagina ti si sbriciola fra le dita, e Maela
            incolla le briciole una per una, bianca in faccia. Poi ti fa
            promettere lo stesso che i suoi nastri saliranno alla Sella.
          effetti: { fazione.tuarmir: 1, scandalo: 0.5 }
      - testo: "Aiutarla a scrivere la misura di stasera"
        descrizione: "La misura di stasera tocca a Maela, che sta imparando a scrivere, e bisogna aiutarla senza fare al posto suo."
        prova: { attributo: sociale, abilita: [empatia, persuasione], difficolta: Media }
        successo:
          titolo: Lettera per lettera
          testo: |
            Le detti la misura lettera per lettera, e lei la scrive con la lingua
            fra i denti e la rilegge due volte. Poi ti fa promettere che i suoi
            nastri saliranno alla Sella il giorno che Cerya lo permetterà.
          pe: { empatia: 3 }
          effetti: { fazione.tuarmir: 1, rep.tuarmir: 0.5 }
        fallimento:
          titolo: La penna
          testo: |
            Le prendi la penna di mano per farle vedere, e Maela la riprende con
            uno strattone che macchia la pagina. Offesa, ti fa promettere lo
            stesso che i suoi nastri saliranno alla Sella.
          effetti: { fazione.tuarmir: 1, tormento: 0.5 }
      - testo: "Ascoltarla leggere tutto il quaderno"
        descrizione: "Maela legge piano, e il quaderno è lungo quanto una sera e una candela."
        costo: 2
        esito:
          titolo: La sera intera
          testo: |
            Maela legge tutto il quaderno a voce bassa, inciampando nelle parole
            lunghe, e a candela finita sai quello che sa lei. Le prometti che i
            suoi nastri saliranno alla Sella il giorno che Cerya lo permetterà.
          pe: { resilienza: 3 }
          effetti: { fazione.tuarmir: 1, rep.tuarmir: 0.5 }
      - testo: "Leggere la lettera che Alenna le ha mandato dalla città"
        descrizione: "Sorella Alenna è tornata in Cattedrale e scrive a Maela con il mulo di Lonn Var."
        quando: [velo.alenna == 1]
        esito:
          titolo: Dalla Cattedrale
          testo: |
            Alenna chiede a Maela di misurare i nastri ogni mattina e di scrivere
            i numeri grandi, e se Cerya ha ancora le mani fredde la sera. In fondo
            c'è una riga sola, *salgono*, con un punto di domanda grande come una
            lettera. Maela ti fa promettere che i suoi nastri saliranno alla
            Sella.
          pe: { empatia: 3 }
          effetti: { fazione.tuarmir: 1, rep.tuarmir: 0.5 }
      - testo: "Chiederle perché la sorella non sale più al villaggio"
        descrizione: "Sorella Alenna vive giù nella gola, e il villaggio la vede di rado, Maela invece sì."
        quando: [velo.alenna == 0]
        esito:
          titolo: Il riparo
          testo: |
            La sorella sta al riparo sotto la parete liscia, in fondo alla gola di
            sotto, e da mesi non sale nemmeno per l'ora di sole. Maela le porta il
            pane ogni due giorni e tiene il quaderno, perché giù l'umido rovina la
            carta, e ti fa promettere che i suoi nastri saliranno alla Sella.
          pe: { empatia: 3 }
          effetti: { fazione.tuarmir: 1, rep.tuarmir: 0.5 }

  # ------------------------------------------------------------ 6 → 7 · Alenna e le misure (Alenna rimasta con Cerya)
  - id: tuarmir-alenna-e-le-misure
    presso: tuarmir
    immagine: ambientazione/tuarmir
    titolo: Alenna e le misure
    sommario: "Sorella Alenna vive adesso nella casa di Madre Cerya, e la sera lavora al quaderno delle foglie con Maela accanto."
    luogo: Tuarmir, il seccatoio, di sera
    area: superficie-fratturata
    requisiti: [fazione.tuarmir == 6, velo.alenna == 2]
    testo: |
      Sorella Alenna vive adesso in una stanza dietro il seccatoio di Madre
      Cerya, con la tonaca del Velo rattoppata alle ginocchia con la tela
      delle maschere, e la sera lavora sotto i mazzi di cardo con Maela
      accanto. «Quello della porta» dice quando entri, e sposta la candela
      verso il quaderno delle foglie.

      Di pagina in pagina la riga grigioblu sul bordo delle foglie si allarga
      fino alla nervatura, e in fondo ci sono le minute delle lettere a Padre
      Aurelio Vantes. «Cerya il vento lo sente» dice Alenna. «Io lo conto.»

      {empatia Media} Dorme ancora poco, ma adesso ha la faccia di chi ha
      deciso dove dormire.

      Sull'ultima pagina c'è la gola disegnata a matita, con i paletti dei
      nastri segnati a crocette fino al sasso con la croce, e dopo il bianco.
    opzioni:
      - testo: "Leggere con lei le misure dei nastri"
        descrizione: "Ogni mattina una riga, con la direzione dei nastri."
        prova: { attributo: mentale, abilita: accademiche, difficolta: Media }
        successo:
          titolo: Il conto
          testo: |
            Alenna ti lascia fare il conto da solo. I nastri puntano tutti verso
            la cima e tirano più forte di mese in mese. «Lassù entra» dici, e lei
            annuisce come una maestra soddisfatta. Ti chiede di portare i nastri
            di Maela alla Sella quando Cerya lascerà salire qualcuno, permesso che
            loro due non hanno.
          pe: { accademiche: 3 }
          effetti: { fazione.tuarmir: 1, rep.tuarmir: 0.5 }
        fallimento:
          titolo: Le colonne
          testo: |
            Ti perdi fra i numeri, e Alenna ti corregge con la pazienza fredda
            delle maestre del Velo. Il vento sale alla Sella, e lei ti chiede di
            portarci i nastri quando Cerya lo permetterà.
          effetti: { fazione.tuarmir: 1, scandalo: 0.5 }
      - testo: "Confrontare le foglie del quaderno con quelle di oggi"
        descrizione: "Una foglia di oggi accanto a quella di un anno fa, a guardare il bordo."
        prova: { attributo: mentale, abilita: natura, difficolta: Media }
        successo:
          titolo: Due foglie
          testo: |
            La riga grigia della foglia di oggi è larga il doppio, e soltanto
            dalla parte del vento. Alenna la incolla con la data e il tuo nome in
            piccolo, poi ti chiede di portare i nastri di Maela alla Sella quando
            Cerya lo permetterà.
          pe: { natura: 3 }
          effetti: { fazione.tuarmir: 1, rep.tuarmir: 0.5 }
        fallimento:
          titolo: La foglia sbriciolata
          testo: |
            La foglia della prima pagina ti si sbriciola fra le dita, e Alenna la
            ricompone senza rimproverarti. Ti chiede lo stesso di portare i nastri
            di Maela alla Sella quando Cerya lo permetterà.
          effetti: { fazione.tuarmir: 1, scandalo: 0.5 }
      - testo: "Chiederle di Cerya e del vento"
        descrizione: "Alenna vive con Cerya da mesi e sa come pensa meglio di chiunque, anche se lo dice a fatica."
        prova: { attributo: sociale, abilita: [empatia, galateo], difficolta: Media }
        successo:
          titolo: Il naso e i numeri
          testo: |
            Cerya, dice Alenna, è la prima persona che le abbia dato ragione e
            torto nella stessa frase. Lei il vento lo annusa e Alenna lo misura, e
            nessuna delle due sa da dove venga. Ti chiede di portare i nastri di
            Maela alla Sella quando Cerya lo permetterà.
          pe: { empatia: 3 }
          effetti: { fazione.tuarmir: 1, rep.tuarmir: 0.5 }
        fallimento:
          titolo: Una domanda di troppo
          testo: |
            Alenna torna al quaderno senza rispondere. Dopo un poco, senza alzare
            la testa, ti chiede di portare i nastri alla Sella quando Cerya lo
            permetterà.
          effetti: { fazione.tuarmir: 1, tormento: 0.5 }
      - testo: "Restare a lavorare con loro fino a tardi"
        descrizione: "Le foglie da incollare sono tante, e si lavora in tre a voce bassa."
        costo: 2
        esito:
          titolo: In tre
          testo: |
            Incolli foglie con loro finché la candela arriva al piattino, e Maela
            si addormenta sul tavolo con la tonaca di Alenna sulle spalle. Prima
            di spegnere Alenna ti chiede di portare i nastri alla Sella quando
            Cerya lo permetterà.
          pe: { natura: 3 }
          effetti: { fazione.tuarmir: 1, rep.tuarmir: 0.5 }
      - testo: "Dire con lei l'ora di vespro, come in Cattedrale"
        descrizione: "Il vespro si dice a voce bassa, in Cattedrale come in una grotta di Tuarmir."
        quando: [origine.accolito-del-velo >= 1]
        esito:
          titolo: Il vespro
          testo: |
            Dite il vespro a mezza voce, e Maela lo segue muovendo le labbra. Alla
            fine Alenna ti chiede di portare i nastri di Maela alla Sella quando
            Cerya lascerà salire qualcuno.
          pe: { resilienza: 3 }
          effetti: { fazione.tuarmir: 1, rep.tuarmir: 0.5 }

  # ------------------------------------------------------------ 7 → 8 · la polvere grigia (Quartieri Alti)
  - id: tuarmir-la-polvere-grigia
    immagine: ambientazione/quartieri-alti
    titolo: La polvere grigia
    sommario: "Il giovedì sera, dietro una porta verde dei Quartieri Alti, si fuma la polvere dei funghi della Sella."
    luogo: Quartieri Alti, la casa con la porta verde
    area: quartieri-alti
    requisiti: [fazione.tuarmir == 7]
    testo: |
      Ilenia ha saputo da un mulattiere che Ruvo Gessan consegna i funghi
      della Sella il giovedì, in una casa con la porta verde dietro il
      Municipio. Quella sera la porta è socchiusa, e la scala porta a un
      salotto di seta grigia dove una dozzina di ospiti sta sdraiata intorno
      a un braciere, nel fumo dolciastro. La padrona di casa, Ottavia Brenn,
      ha i capelli tinti di rame e un ventaglio che non apre mai.

      {percezione Media} Gli ospiti hanno tutti la faccia girata verso
      l'angolo senza finestre, che da qui guarda a nord-est.

      Un uomo con il panciotto slacciato mormora che sente il mare, come il
      vecchio Tamme. Vicino alla finestra un ragazzo dalle labbra grigie non
      si muove da quando sei entrato.

      {origine rampollo-dei-quartieri-alti} Dei giovedì di casa Brenn alle
      cene si parla abbassando la voce, che nei Quartieri Alti vuol dire che
      ci vanno tutti.
    opzioni:
      - testo: "Sdraiarti fra gli ospiti senza respirare il fumo"
        descrizione: "Un ospite in più su un cuscino passa inosservato, se finge di respirare."
        prova: { attributo: sociale, abilita: [galateo, ingannare], difficolta: Media }
        successo:
          titolo: Fra i cuscini
          testo: |
            Respiri attraverso la maschera di Tuarmir nascosta sotto il colletto,
            e Ottavia si ferma a chiacchierare con un'amica proprio sopra di te.
            Lonn Var le ha promesso un carico intero dalla Sella per la luna
            nuova, appena trova chi gli apre la strada per la cima.
          pe: { galateo: 3 }
          effetti: { fazione.tuarmir: 1, rep.tuarmir: 0.5 }
        fallimento:
          titolo: Il mare in salotto
          testo: |
            Alla seconda boccata respiri il fumo e vedi anche tu l'acqua grigia
            salire fra i cuscini. Quando ti riprendi Ottavia sta dicendo che Lonn
            Var le porta un carico intero dalla Sella per la luna nuova, appena
            trova la strada per la cima.
          effetti: { fazione.tuarmir: 1, tormento: 0.5 }
      - testo: "Curare il ragazzo dalle labbra grigie"
        descrizione: "Nessuno si accorge di lui, e un ospite che muore sul cuscino rovinerebbe la serata."
        prova: { attributo: mentale, abilita: medicina, difficolta: Media }
        successo:
          titolo: Le labbra grigie
          testo: |
            Porti il ragazzo alla finestra e gli fai bere acqua con l'aceto, e si
            riprende tossendo. Ottavia, più infastidita che grata, ti dice che
            Lonn Var le ha promesso un carico intero dalla Sella per la luna
            nuova, appena trova la strada per la cima.
          pe: { medicina: 3 }
          effetti: { fazione.tuarmir: 1, rep.tuarmir: 0.5 }
        fallimento:
          titolo: La seta
          testo: |
            Il ragazzo si riprende e vomita sulla seta grigia del divano. Ottavia
            ti fa accompagnare alla porta, e la senti dire che con il carico della
            Sella, alla luna nuova, la seta la cambia comunque.
          effetti: { fazione.tuarmir: 1, scandalo: 0.5 }
      - testo: "Scendere in cucina a parlare con la servitù"
        descrizione: "Chi pulisce il braciere sa che cosa ci si brucia, e chi lo porta su."
        prova: { attributo: sociale, abilita: [conoscenze-della-strada, empatia], difficolta: Media }
        successo:
          titolo: La cuoca
          testo: |
            La cuoca, pelando patate, si lamenta del fumo che sale per le scale.
            Il mulattiere grande del giovedì le ha detto che alla luna nuova
            arriva un carico intero dalla Sella, appena il suo padrone trova la
            strada per la cima.
          pe: { conoscenze-della-strada: 3 }
          effetti: { fazione.tuarmir: 1, rep.tuarmir: 0.5 }
        fallimento:
          titolo: Il maggiordomo
          testo: |
            Il maggiordomo ti porta fuori per la manica, e dalla cucina la cuoca
            ti grida dietro che il carico grosso della Sella arriva alla luna
            nuova, e che speriamo che soffochino tutti.
          effetti: { fazione.tuarmir: 1, sospetto: 0.5 }
      - testo: "Aspettare in strada la consegna del giovedì"
        descrizione: "Ruvo Gessan porta i sacchi a mezzanotte, e basta aspettarlo in un portone."
        costo: 2
        esito:
          titolo: Il portone
          testo: |
            A mezzanotte Ruvo Gessan consegna due sacchi alla porta verde e dice a
            Ottavia che il carico grosso arriva dalla Sella alla luna nuova,
            appena il padrone trova la strada. Poi sputa la resina sul gradino.
          pe: { furtivita: 3 }
          effetti: { fazione.tuarmir: 1, rep.tuarmir: 0.5 }
      - testo: "Farti annunciare con il tuo nome"
        descrizione: "Un nome dei Quartieri Alti apre la porta verde e la bocca della padrona di casa."
        quando: [origine.rampollo-dei-quartieri-alti >= 1]
        esito:
          titolo: Il tuo nome
          testo: |
            Ottavia ti viene incontro con il ventaglio aperto e ti offre il
            cuscino migliore e la polvere migliore. La rifiuti con garbo, e lei
            per farsi perdonare ti racconta che alla luna nuova Lonn Var le porta
            un carico intero dalla Sella, appena trova la strada per la cima.
          pe: { galateo: 3 }
          effetti: { fazione.tuarmir: 1, rep.tuarmir: 0.5 }

  # ------------------------------------------------------------ 8 → 9 · la notte che il vento gira (grado 3, il segno)
  - id: tuarmir-la-notte-che-il-vento-gira
    presso: tuarmir
    immagine: ambientazione/tuarmir
    titolo: La notte che il vento gira
    sommario: "Una notte i cani di Tuarmir guaiscono tutti insieme, e il fumo dei focolari sale verso la Sella."
    luogo: Tuarmir, le soglie, di notte
    area: superficie-fratturata
    requisiti: [fazione.tuarmir == 8]
    testo: |
      Racconti a Madre Cerya del salotto con la porta verde, e lei ti manda a
      dormire senza rispondere.

      Ti svegliano i cani, che guaiscono tutti insieme da una porta all'altra
      della gola. Il villaggio è già fuori in silenzio, con le lanterne basse.
      Le maschere sulle corde stanno tese verso la cima come panni in una
      tramontana, e il fumo dei focolari corre su per la parete verso la
      Sella.

      {natura Media} Di notte il vento di una gola scende sempre verso valle,
      perché l'aria fredda pesa. Questo sale.

      {magia Media} Nel vento c'è un filo di Mana sottile e lontano, diverso
      da tutto quello che conosci.

      Madre Cerya è sulla soglia del seccatoio con Ilenia accanto, e alza il
      mento verso nord-est, dove dietro il crinale ci sono soltanto roccia e
      cielo. «Prima veniva dalla Cicatrice» dice. «Adesso viene da là, e là
      non c'è niente che io sappia nominare.» *È la prima volta che non sa una
      cosa.*

      {origine allievo-di-torvessa} All'Accademia ti hanno insegnato che i
      venti seguono il caldo e il freddo, e questo sfugge alle lenti di Orvald
      Temmerin.
    opzioni:
      - testo: "Leggere il vento sul muschio dei muri"
        descrizione: "Da quanto il muschio è schiacciato si capisce da quanto soffia il vento, e quanto forte."
        prova: { attributo: mentale, abilita: natura, difficolta: Media }
        successo:
          titolo: Il muschio pettinato
          testo: |
            Il muschio dei muri è schiacciato verso la cima dappertutto, anche
            dove il vento di solito arriva appena. All'alba Cerya ti consegna la
            roncola di chi sale alla Sella, perché qualcuno di fuori deve andare a
            vedere dove va il vento.
          pe: { natura: 5 }
          almeno: { rep.tuarmir: 6 }
          effetti: { fazione.tuarmir: 1, oggetto.tuarmir-roncola-della-raccolta: 1 }
        fallimento:
          titolo: La mano nel muschio
          testo: |
            Appoggi la mano al muschio di un muro, e il vento ti tira il braccio
            verso la cima come per mostrarti la strada. All'alba Cerya ti consegna
            la roncola di chi sale alla Sella, perché qualcuno di fuori deve
            andare a vedere dove va il vento.
          pe: { natura: 3 }
          almeno: { rep.tuarmir: 6 }
          effetti: { fazione.tuarmir: 1, oggetto.tuarmir-roncola-della-raccolta: 1, tormento: 0.5 }
      - testo: "Contare le raffiche come fa Maela"
        descrizione: "Il quaderno di Alenna misura il vento a battiti, e stanotte si può misurare anche questo."
        prova: { attributo: mentale, abilita: percezione, difficolta: Media }
        successo:
          titolo: Dodici battiti
          testo: |
            Con Maela che li segna sulla tavoletta conti i battiti fra una raffica
            e l'altra, che sono sempre dodici nella stessa direzione. All'alba
            Cerya ti consegna la roncola di chi sale alla Sella, perché qualcuno
            di fuori deve andare a vedere dove va il vento.
          pe: { percezione: 5 }
          almeno: { rep.tuarmir: 6 }
          effetti: { fazione.tuarmir: 1, oggetto.tuarmir-roncola-della-raccolta: 1 }
        fallimento:
          titolo: Il conto perso
          testo: |
            A ogni raffica i cani guaiscono e tu ti volti, e il conto lo tiene
            Maela. All'alba Cerya ti consegna la roncola di chi sale alla Sella,
            perché qualcuno di fuori deve andare a vedere dove va il vento.
          pe: { percezione: 3 }
          almeno: { rep.tuarmir: 6 }
          effetti: { fazione.tuarmir: 1, oggetto.tuarmir-roncola-della-raccolta: 1, tormento: 0.5 }
      - testo: "Stare accanto a Cerya sulla soglia"
        descrizione: "Ha la faccia rivolta al crinale e le mani strette sullo stipite."
        prova: { attributo: sociale, abilita: empatia, difficolta: Media }
        successo:
          titolo: Le mani sullo stipite
          testo: |
            Ti metti accanto a lei, e Cerya ti trova il braccio e ci appoggia la
            mano, che trema appena. All'alba ti consegna la roncola di chi sale
            alla Sella, perché lassù deve andare qualcuno di fuori, uno che il
            vento lo sente.
          pe: { empatia: 5 }
          almeno: { rep.tuarmir: 6 }
          effetti: { fazione.tuarmir: 1, oggetto.tuarmir-roncola-della-raccolta: 1 }
        fallimento:
          titolo: La domanda
          testo: |
            Le chiedi che cosa c'è dietro il crinale, e ti accorgi troppo tardi
            che la domanda l'ha ferita. All'alba Cerya ti consegna lo stesso la
            roncola di chi sale alla Sella, perché qualcuno di fuori deve andare a
            vedere dove va il vento.
          pe: { empatia: 3 }
          almeno: { rep.tuarmir: 6 }
          effetti: { fazione.tuarmir: 1, oggetto.tuarmir-roncola-della-raccolta: 1, scandalo: 0.5 }
      - testo: "Restare sulla soglia fino all'alba con il villaggio"
        descrizione: "Nessuno torna a dormire, e si resta fuori insieme con le lanterne basse."
        costo: 2
        esito:
          titolo: Fino all'alba
          testo: |
            Il vento cala all'alba di colpo, come una porta che si chiude. Cerya
            ti consegna la roncola di chi sale alla Sella, perché qualcuno di
            fuori deve andare a vedere dove va il vento.
          pe: { resilienza: 3 }
          almeno: { rep.tuarmir: 6 }
          effetti: { fazione.tuarmir: 1, oggetto.tuarmir-roncola-della-raccolta: 1 }
      - testo: "Dire per il villaggio la veglia del Velo"
        descrizione: "La veglia si dice per chi ha paura di notte, e detta sulla soglia la sentono tutte le case."
        quando: [origine.accolito-del-velo >= 1]
        esito:
          titolo: La veglia
          testo: |
            Dalle case vicine qualcuno dice la veglia con te, sbagliando le parole
            come Cerya, e i cani si calmano prima del vento. All'alba Cerya ti
            consegna la roncola di chi sale alla Sella, perché qualcuno di fuori
            deve andare a vedere dove va il vento.
          pe: { resilienza: 5 }
          almeno: { rep.tuarmir: 6 }
          effetti: { fazione.tuarmir: 1, oggetto.tuarmir-roncola-della-raccolta: 1 }

  # ------------------------------------------------------------ 9 → 10 · Maela è salita
  - id: tuarmir-maela-e-salita
    presso: tuarmir
    immagine: icone/windsock
    titolo: Maela è salita
    sommario: "La mattina dopo la notte del vento il letto di Maela è vuoto, e sul tavolo c'è la sua tavoletta."
    luogo: Tuarmir, il seccatoio
    area: superficie-fratturata
    requisiti: [fazione.tuarmir == 9]
    testo: |
      La mattina dopo la notte del vento il letto di Maela è vuoto. Mancano
      il cesto dei nastri e i paletti, e sul tavolo c'è la sua tavoletta con
      quattro parole in lettere enormi, SALGO A METTERE I NASTRI. Ilenia ha
      già trovato le sue impronte nel muschio sopra il sasso con la croce.

      Madre Cerya passa le dita sulla tavoletta come se potesse leggerla al
      tatto. La ragazza è salita dove il vento la chiamava, e stanotte lassù
      gela.

      {empatia Media} Cerya tiene la tavoletta come una cosa che si può
      rompere. Quella ragazza gliel'hanno affidata, e adesso la Sella è anche
      colpa sua.

      Ilenia arrotola già la corda del seccatoio.
    opzioni:
      - testo: "Preparare il sacco per la Sella"
        descrizione: "Lassù bisogna portarsi tutto, e per due."
        prova: { attributo: mentale, abilita: [natura, medicina], difficolta: Media }
        successo:
          titolo: Il sacco per due
          testo: |
            Prepari il sacco per due con la coperta più pesante e il muschio amaro
            per la testa, e Cerya ci aggiunge un vasetto di grasso di capra per le
            mani della ragazza. Ilenia ti aspetta al sasso con la croce.
          pe: { natura: 3 }
          effetti: { fazione.tuarmir: 1, rep.tuarmir: 0.5 }
        fallimento:
          titolo: Il sacco sbagliato
          testo: |
            Riempi il sacco in fretta, e Cerya ci trova due cose inutili e nessuna
            coperta. Lo rifate insieme mentre la mattina se ne va.
          effetti: { fazione.tuarmir: 1, tormento: 0.5 }
      - testo: "Farti dire da Ilenia dove salgono le capre"
        descrizione: "Ilenia è cresciuta guardando le capre salire oltre la croce, che lei non ha mai passato."
        prova: { attributo: sociale, abilita: [empatia, persuasione], difficolta: Media }
        successo:
          titolo: Le capre
          testo: |
            Ilenia ti disegna nella polvere la strada delle capre, la conca dei
            pascoli e la cengia del vento, dove c'è un pastore che non scende mai.
            Ti aspetta al sasso con la croce.
          pe: { empatia: 3 }
          effetti: { fazione.tuarmir: 1, rep.tuarmir: 0.5 }
        fallimento:
          titolo: Il dito che trema
          testo: |
            Ilenia cancella due volte la strada disegnata nella polvere, perché sa
            soltanto dove si comincia. Ti aspetta al sasso con la croce.
          effetti: { fazione.tuarmir: 1, tormento: 0.5 }
      - testo: "Partire subito, senza aspettare"
        descrizione: "Ogni ora conta, e il sacco si prepara strada facendo."
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Media }
        successo:
          titolo: Subito
          testo: |
            Corri su per la scala grande con la corda di Ilenia, e lei ti viene
            dietro con il pane e il muschio. Al sasso con la croce ti lega la
            maschera.
          pe: { atletica: 3 }
          effetti: { fazione.tuarmir: 1, rep.tuarmir: 0.5 }
        fallimento:
          titolo: I gradini
          testo: |
            Al centesimo gradino il muschio bagnato ti manda giù sul ginocchio, e
            arrivi al sasso con la croce zoppicando.
          effetti: { fazione.tuarmir: 1, ferite: 0.5 }
      - testo: "Aspettare che Cerya prepari il muschio da masticare"
        descrizione: "Il muschio amaro per la testa va pestato e seccato sulla brace, e ci vuole la mattina."
        costo: 2
        esito:
          titolo: Il muschio pestato
          testo: |
            Cerya pesta il muschio e lo secca sulla brace mentre la gola si
            schiarisce, poi te lo chiude in mano in un sacchetto. Ilenia ti
            aspetta al sasso con la croce.
          pe: { resilienza: 3 }
          effetti: { fazione.tuarmir: 1, rep.tuarmir: 0.5 }
      - testo: "Promettere ad Alenna che la riporti giù"
        descrizione: "Alenna vuole salire con te e Cerya glielo vieta, e solo una promessa la tiene qui."
        quando: [velo.alenna == 2]
        esito:
          titolo: La promessa
          testo: |
            Alenna ha già la tonaca legata in vita, e Cerya le tiene il polso. Le
            prometti di riportare giù Maela, e lei ti dà la corda e il quaderno
            delle foglie, perché tu veda dove finiscono i nastri.
          pe: { empatia: 3 }
          effetti: { fazione.tuarmir: 1, rep.tuarmir: 0.5 }

  # ------------------------------------------------------------ 11 → 12 · la mappa dei nastri (grado 4)
  - id: tuarmir-la-mappa-dei-nastri
    presso: tuarmir
    immagine: icone/windsock
    titolo: La mappa dei nastri
    sommario: "Maela disegna la mappa dei suoi nastri, e in grotta grande i vecchi vogliono riempire la grata di sassi."
    luogo: Tuarmir, il seccatoio e la grotta grande
    area: superficie-fratturata
    requisiti: [fazione.tuarmir == 11]
    testo: |
      Maela ha le dita fasciate nella tela delle maschere, e la febbre le è
      passata da due giorni. Al tavolo del seccatoio disegna sul quaderno
      delle foglie la mappa dei suoi nastri, e ogni nastro è una freccia che
      dal sasso con la croce sale a puntare la grata della Sella. Oltre la
      grata, dal crinale, arriva una freccia sola e lunga, da nord-est. Il
      dente spezzato del Pettine è appoggiato al muro dietro di lei, e nessuno
      lo tocca.

      La sera la grotta grande è piena. I vecchi vogliono riempire la grata di
      sassi e di terra, perché il vento torni a scendere dalla Cicatrice come
      una volta. Maela dice che prima bisogna misurare, e un vecchio le
      risponde che le misure non hanno mai fermato il vento.

      {tecnologia Difficile} Una grata fatta per farci entrare il vento non si
      tappa con i sassi. Chi l'ha costruita sapeva che cosa voleva.

      Contro lo stipite Ruvo Gessan mastica resina e ascolta tutto. *Maela ha
      piantato i paletti per tornare, e adesso la strada la conoscono tutti.*
      Madre Cerya alza la testa verso di te.

      {origine apprendista-raschiatore} Sulle piattaforme ti hanno insegnato a
      lasciare stare quello che i Precursori hanno lasciato acceso, e a
      segnarlo sulla carta per chi viene dopo.
    opzioni:
      - testo: "Dire al consiglio di lasciare la grata com'è"
        descrizione: "I sassi li porterebbero su i vecchi, uno alla volta, passando accanto al Pettine."
        prova: { attributo: sociale, abilita: [persuasione, empatia], difficolta: Media }
        successo:
          titolo: I sassi
          testo: |
            Racconti del Pettine che pettina via dalla grata ogni sasso e chiedi
            chi vuole portare i primi, e nella grotta non si alza una mano. Cerya
            dice di lasciare i sassi dove sono, perché quella grata l'ha fatta
            qualcuno che sapeva il fatto suo. Ti mette sulle spalle il mantello di
            muschio vivo che si cuce per chi sale sopra le case, e Ilenia ti dà la
            paga.
          pe: { persuasione: 5 }
          almeno: { rep.tuarmir: 8 }
          effetti: { fazione.tuarmir: 1, oggetto.tuarmir-mantello-di-muschio: 1, monete: 80 }
        fallimento:
          titolo: I vecchi
          testo: |
            I vecchi si convincono che la grata va chiusa ancora di più. Cerya
            alza la mano. «I sassi lasciateli dove sono. Quella grata l'ha fatta
            qualcuno che sapeva il fatto suo.» Ti mette sulle spalle il mantello
            di muschio, e Ilenia ti dà la paga della raccolta.
          pe: { persuasione: 3 }
          almeno: { rep.tuarmir: 8 }
          effetti: { fazione.tuarmir: 1, oggetto.tuarmir-mantello-di-muschio: 1, monete: 80, scandalo: 0.5 }
      - testo: "Aiutare Maela a finire la mappa"
        descrizione: "Le frecce vanno messe in scala, e con le dita fasciate Maela ci mette il doppio."
        prova: { attributo: mentale, abilita: accademiche, difficolta: Media }
        successo:
          titolo: La mappa in scala
          testo: |
            I vecchi guardano a lungo la mappa finita, con le frecce che vanno
            tutte nello stesso buco. Cerya ci passa sopra le dita e dice di
            lasciare i sassi dove sono, perché quella grata l'ha fatta qualcuno
            che sapeva il fatto suo. Ti mette sulle spalle il mantello di muschio,
            e Ilenia ti dà la paga della raccolta.
          pe: { accademiche: 5 }
          almeno: { rep.tuarmir: 8 }
          effetti: { fazione.tuarmir: 1, oggetto.tuarmir-mantello-di-muschio: 1, monete: 80 }
        fallimento:
          titolo: La scala sbagliata
          testo: |
            Sbagli la scala, e la grata sulla mappa viene grande come il
            villaggio. Cerya alza la mano. «I sassi lasciateli dove sono. Quella
            grata l'ha fatta qualcuno che sapeva il fatto suo.» Ti mette sulle
            spalle il mantello di muschio, e Ilenia ti dà la paga della raccolta.
          pe: { accademiche: 3 }
          almeno: { rep.tuarmir: 8 }
          effetti: { fazione.tuarmir: 1, oggetto.tuarmir-mantello-di-muschio: 1, monete: 80, scandalo: 0.5 }
      - testo: "Raccontare la Sella come l'hai vista"
        descrizione: "Chi non c'è stato deve vedere la Sella con le tue parole."
        prova: { attributo: sociale, abilita: espressivita, difficolta: Media }
        successo:
          titolo: La Sella
          testo: |
            Racconti la Sella dai terrazzi grigi alla grata che ronza, e quando
            finisci nessuno parla più di sassi. Cerya dice soltanto di lasciarli
            dove sono, ti mette sulle spalle il mantello di muschio, e Ilenia ti
            dà la paga della raccolta.
          pe: { espressivita: 5 }
          almeno: { rep.tuarmir: 8 }
          effetti: { fazione.tuarmir: 1, oggetto.tuarmir-mantello-di-muschio: 1, monete: 80 }
        fallimento:
          titolo: Il ronzio
          testo: |
            Arrivato al ronzio della grata ti accorgi di imitarlo con la gola, e
            due bambini scoppiano a piangere. Cerya alza la mano. «I sassi
            lasciateli dove sono. Quella grata l'ha fatta qualcuno che sapeva il
            fatto suo.» Ti mette sulle spalle il mantello di muschio, e Ilenia ti
            dà la paga della raccolta.
          pe: { espressivita: 3 }
          almeno: { rep.tuarmir: 8 }
          effetti: { fazione.tuarmir: 1, oggetto.tuarmir-mantello-di-muschio: 1, monete: 80, tormento: 0.5 }
      - testo: "Lasciare che decida Cerya"
        descrizione: "Sulla Sella ci sei stato tu, ma l'ultima parola qui è sempre sua."
        esito:
          titolo: L'ultima parola
          testo: |
            La discussione va avanti fino a tardi, finché Cerya dice di lasciare i
            sassi dove sono, perché quella grata l'ha fatta qualcuno che sapeva il
            fatto suo. Ti mette sulle spalle il mantello di muschio che si cuce
            per chi sale sopra le case, e Ilenia ti dà la paga della raccolta.
          almeno: { rep.tuarmir: 8 }
          effetti: { fazione.tuarmir: 1, oggetto.tuarmir-mantello-di-muschio: 1, monete: 80 }
      - testo: "Lasciare la parola ad Alenna"
        descrizione: "Alenna ha misurato il vento per un anno, e stasera ha il quaderno in mano."
        quando: [velo.alenna == 2]
        esito:
          titolo: Il quaderno
          testo: |
            Alenna legge a voce bassa i numeri di un anno, e i vecchi non hanno
            più niente da dire. «I sassi lasciateli dove sono» dice Cerya. «Quella
            grata l'ha fatta qualcuno che sapeva il fatto suo.» Ti mette sulle
            spalle il mantello di muschio, e Ilenia ti dà la paga della raccolta.
          pe: { empatia: 5 }
          almeno: { rep.tuarmir: 8 }
          effetti: { fazione.tuarmir: 1, oggetto.tuarmir-mantello-di-muschio: 1, monete: 80 }
      - testo: "Disegnare la grata come si disegnano le macchine all'Accademia"
        descrizione: "La pianta e la sezione, con le misure a margine, perché la grata smetta di sembrare una bocca."
        quando: [origine.allievo-di-torvessa >= 1]
        esito:
          titolo: Pianta e sezione
          testo: |
            Disegni la grata in pianta e in sezione come all'Accademia, e i vecchi
            smettono di chiamarla bocca. «I sassi lasciateli dove sono» dice
            Cerya. «Quella grata l'ha fatta qualcuno che sapeva il fatto suo.» Ti
            mette sulle spalle il mantello di muschio, e Ilenia ti dà la paga
            della raccolta.
          pe: { tecnologia: 5 }
          almeno: { rep.tuarmir: 8 }
          effetti: { fazione.tuarmir: 1, oggetto.tuarmir-mantello-di-muschio: 1, monete: 80 }
