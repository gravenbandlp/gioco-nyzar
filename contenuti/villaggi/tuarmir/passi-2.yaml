# La quest di Tuarmir, Atto III e la parte dell'Atto IV fuori dalla spedizione (fazione.tuarmir 6 → 10, 11 → 12).
# - 6 → 7 il quaderno delle foglie di Sorella Alenna, in due scene secondo velo.alenna:
#   `tuarmir-il-quaderno-delle-foglie` (velo.alenna != 2): Maela lo custodisce. Con velo.alenna 0 Alenna sta al riparo
#   sotto la porta, nella gola di sotto, e Maela scende da lei ogni due giorni; con velo.alenna 1 è tornata in città e
#   scrive a Maela dalla Cattedrale. Le due varianti sono opzioni con `quando`.
#   `tuarmir-alenna-e-le-misure` (velo.alenna == 2): Alenna vive con Cerya e ti riconosce dalla porta.
#   In tutte e due le minute delle lettere a Padre Aurelio Vantes e lo schizzo dei nastri, che finisce alla croce.
# - 7 → 8 `tuarmir-la-polvere-grigia` (Quartieri Alti): il giovedì di casa Brenn, dove si fuma la polvere dei funghi
#   grigi. Gli ospiti sentono il mare e girano la faccia a nord-est; Lonn Var ha promesso un carico dalla Sella.
# - 8 → 9 `tuarmir-la-notte-che-il-vento-gira` (grado 3, Coltello della gola): il segno della Campana. Il vento soffia
#   da dove prima non soffiava, e Cerya non sa nominare da dove. La roncola della raccolta.
# - 9 → 10 `tuarmir-maela-e-salita`: Maela sale da sola alla Sella con i nastri. Poi l'ingresso della spedizione
#   (spedizione-gola-alta.yaml), che chiude il passo 11.
# - 11 → 12 `tuarmir-la-mappa-dei-nastri` (grado 4, Custode della Sella): la mappa di Maela, il consiglio che vuole
#   riempire la grata di sassi, e Cerya che la lascia com'è. Il mantello di muschio. Ruvo Gessan ascolta dalla porta.
storylet:
  # ------------------------------------------------------------ 6 → 7 · il quaderno delle foglie (Alenna non è a Tuarmir)
  - id: tuarmir-il-quaderno-delle-foglie
    presso: tuarmir
    immagine: ambientazione/tuarmir
    titolo: Il quaderno delle foglie
    sommario: "Maela custodisce il quaderno di Sorella Alenna, con una foglia seccata per settimana e le minute delle lettere a Padre Vantes."
    luogo: Tuarmir, il seccatoio, di sera
    area: superficie-fratturata
    requisiti: [fazione.tuarmir == 6, velo.alenna != 2]
    testo: |
      La sera, nel seccatoio, Maela siede su uno sgabello sotto i mazzi di
      cardo con un quaderno grosso aperto sulle ginocchia. È il quaderno
      delle foglie di Sorella Alenna, che l'ha lasciato in custodia a lei.
      Fra le pagine ci sono foglie seccate e incollate, una per settimana,
      con la data scritta sotto in una grafia dritta e piccola. Sfogliandolo
      si vede la riga grigioblu sul bordo delle foglie farsi più larga di
      pagina in pagina, fino a toccare la nervatura.

      In fondo al quaderno, piegate in quattro, ci sono le minute delle
      lettere a Padre Aurelio Vantes. Alenna gli scriveva che le erbe di
      Tuarmir stanno cambiando di una sfumatura, di una nota sul fondo del
      gusto, e che il vento ha girato. Maela legge piano, con il dito sotto
      la riga e le labbra che si muovono.

      {accademiche Media} Le minute hanno la forma delle relazioni del Velo,
      con la data in alto e l'Albero in fondo. Ogni lettera ripete i numeri
      della precedente, perché chi la legge possa controllarli.

      {empatia Media} Maela tiene il quaderno stretto anche quando non
      legge. Le manca chi gliel'ha lasciato, e lo tiene vicino al petto.

      Sull'ultima pagina c'è uno schizzo della gola con i paletti dei nastri
      segnati a crocette, dal fondo fino al sasso con la croce. Oltre la
      croce non c'è niente. *Le misure finiscono dove finisce il permesso.*
      Maela gira il quaderno verso di te.

      {origine accolito-del-velo} La grafia delle minute è quella che in
      Cattedrale insegnano ai novizi, con le aste tirate al righello. Anche
      la tua era così, prima della Superficie.
    opzioni:
      - testo: "Leggere con Maela le misure dei nastri"
        descrizione: "Ogni mattina una riga, e ogni riga dice da che parte puntavano i nastri. Messe in fila, le righe raccontano qualcosa."
        prova: { attributo: mentale, abilita: accademiche, difficolta: Media }
        successo:
          titolo: Entrare
          testo: |
            Leggete le misure insieme, una mattina per riga. I nastri lungo la
            gola puntano tutti verso la cima, e mese dopo mese tirano più
            forte. Fai il conto con lei sulle dita. Il vento che passa dal
            villaggio sale verso la Sella, e lassù da qualche parte deve
            entrare. Maela scrive *entra* in fondo alla pagina con lettere
            enormi, poi ti fa promettere che i suoi nastri saliranno alla
            Sella il giorno che Cerya lascerà salire qualcuno.
          pe: { accademiche: 3 }
          effetti: { fazione.tuarmir: 1, rep.tuarmir: 0.5 }
        fallimento:
          titolo: Le colonne
          testo: |
            Ti perdi fra le colonne dei numeri, e Maela ti corregge tre volte
            con una pazienza che le ha insegnato qualcun altro. Alla fine il
            conto lo fa lei, ad alta voce, finché due raccoglitrici sulla
            soglia la zittiscono. Il vento va su, verso la Sella. Ti fa
            promettere che i suoi nastri saliranno lassù il giorno che Cerya
            lascerà salire qualcuno.
          effetti: { fazione.tuarmir: 1, scandalo: 0.5 }
      - testo: "Confrontare le foglie del quaderno con quelle di oggi"
        descrizione: "Una foglia di oggi accanto a quella di un anno fa. La differenza si vede, a chi sa guardare il bordo."
        prova: { attributo: mentale, abilita: natura, difficolta: Media }
        successo:
          titolo: Due foglie
          testo: |
            Stacchi una foglia di salvia dal mazzo più fresco e la posi
            accanto a quella della prima pagina. La riga grigia di oggi è
            larga il doppio, e dalla parte del bordo esposta al vento. Maela
            annuisce seria e ti mostra lo schizzo. Il vento sale fino alla
            Sella e lassù entra da qualche parte. Ti fa promettere che i suoi
            nastri saliranno lassù il giorno che Cerya lo permetterà.
          pe: { natura: 3 }
          effetti: { fazione.tuarmir: 1, rep.tuarmir: 0.5 }
        fallimento:
          titolo: La foglia sbriciolata
          testo: |
            Prendi in mano la foglia della prima pagina per guardarla meglio, e
            si sbriciola fra le dita. Maela diventa bianca e non dice niente.
            Raccoglie le briciole con la punta del coltello e le incolla sulla
            pagina una per una. Poi, a fatica, ti mostra lo schizzo, e ti fa
            promettere che i suoi nastri saliranno alla Sella.
          effetti: { fazione.tuarmir: 1, scandalo: 0.5 }
      - testo: "Aiutarla a scrivere la misura di stasera"
        descrizione: "Maela sta imparando a scrivere, e la misura di stasera le tocca da sola. Bisogna aiutarla senza fare al posto suo."
        prova: { attributo: sociale, abilita: [empatia, persuasione], difficolta: Media }
        successo:
          titolo: Lettera per lettera
          testo: |
            Le detti la misura di stasera lettera per lettera, senza prenderle
            la penna, e lei la scrive con la lingua fra i denti. Quando ha
            finito la rilegge due volte, e poi ti mostra lo schizzo della gola
            con i paletti che finiscono alla croce. Il vento sale fino alla
            Sella. Ti fa promettere che i suoi nastri saliranno lassù il giorno
            che Cerya lo permetterà.
          pe: { empatia: 3 }
          effetti: { fazione.tuarmir: 1, rep.tuarmir: 0.5 }
        fallimento:
          titolo: La penna
          testo: |
            Alla terza lettera le prendi la penna di mano per farle vedere, e
            Maela la riprende con uno strattone che fa una macchia sulla
            pagina. Scrive da sola, con la faccia offesa, e ci mette il
            doppio. Poi ti mostra lo schizzo senza guardarti, e ti fa
            promettere lo stesso che i suoi nastri saliranno alla Sella.
          effetti: { fazione.tuarmir: 1, tormento: 0.5 }
      - testo: "Ascoltarla leggere tutto il quaderno"
        descrizione: "Maela legge piano, e il quaderno è lungo. Ci vuole la sera intera, e una candela."
        costo: 2
        esito:
          titolo: La sera intera
          testo: |
            Maela legge tutto il quaderno a voce bassa, una pagina dopo
            l'altra, inciampando nelle parole lunghe, e tu non la correggi.
            Quando la candela è finita sai quello che sa lei. Il vento sale fino
            alla Sella e lassù entra da qualche parte. Le prometti che i suoi
            nastri saliranno lassù il giorno che Cerya lo permetterà.
          pe: { resilienza: 3 }
          effetti: { fazione.tuarmir: 1, rep.tuarmir: 0.5 }
      - testo: "Leggere la lettera che Alenna le ha mandato dalla città"
        descrizione: "Sorella Alenna è tornata in Cattedrale, e scrive a Maela con il mulo di Lonn Var. Le lettere Maela le tiene dentro il quaderno."
        quando: [velo.alenna == 1]
        esito:
          titolo: Dalla Cattedrale
          testo: |
            La lettera è corta, nella stessa grafia dritta delle minute.
            Alenna le chiede di misurare i nastri ogni mattina e di scrivere i
            numeri grandi, e le domanda se Cerya ha ancora le mani fredde la
            sera. In fondo alla lettera c'è una riga sola con scritto
            *salgono*, e accanto un punto di domanda grande come una lettera.
            Maela ti mostra lo schizzo, e ti fa promettere che i suoi nastri
            saliranno alla Sella.
          pe: { empatia: 3 }
          effetti: { fazione.tuarmir: 1, rep.tuarmir: 0.5 }
      - testo: "Chiederle perché la sorella non sale più al villaggio"
        descrizione: "Sorella Alenna vive giù nella gola, e il villaggio la vede di rado. Maela invece la vede."
        quando: [velo.alenna == 0]
        esito:
          titolo: Il riparo
          testo: |
            Maela ti dice che la sorella sta al riparo sotto la parete liscia,
            in fondo alla gola di sotto, e che da mesi non sale nemmeno per
            l'ora di sole. Lei scende ogni due giorni con il pane e torna su con
            le erbe da seccare. Il quaderno glielo ha affidato perché giù
            l'umido rovina la carta. Poi ti mostra lo schizzo, e ti fa
            promettere che i suoi nastri saliranno alla Sella.
          pe: { empatia: 3 }
          effetti: { fazione.tuarmir: 1, rep.tuarmir: 0.5 }

  # ------------------------------------------------------------ 6 → 7 · Alenna e le misure (Alenna rimasta con Cerya)
  - id: tuarmir-alenna-e-le-misure
    presso: tuarmir
    immagine: ambientazione/tuarmir
    titolo: Alenna e le misure
    sommario: "Sorella Alenna vive adesso nella casa di Madre Cerya. La sera lavora al suo quaderno delle foglie, con Maela accanto."
    luogo: Tuarmir, il seccatoio, di sera
    area: superficie-fratturata
    requisiti: [fazione.tuarmir == 6, velo.alenna == 2]
    testo: |
      Sorella Alenna vive adesso nella casa-grotta di Madre Cerya, in una
      stanza ricavata dietro il seccatoio, e la sera lavora al tavolo sotto i
      mazzi di cardo con Maela accanto. Ha lavato la tonaca del Velo e l'ha
      rattoppata alle ginocchia con la tela delle maschere. Quando entri alza
      la testa e ti riconosce. «Quello della porta» dice, e sposta la candela
      perché tu veda il quaderno.

      È il quaderno delle foglie, con una foglia seccata per settimana e la
      data sotto in grafia dritta e piccola. Di pagina in pagina la riga
      grigioblu sul bordo delle foglie si allarga, fino a toccare la
      nervatura. In fondo ci sono le minute delle lettere a Padre Aurelio
      Vantes, quelle in cui scriveva che le erbe cambiano di una sfumatura.
      «Cerya il vento lo sente» dice Alenna. «Io lo conto.»

      {empatia Media} Dorme ancora poco, ma adesso ha la faccia di chi ha
      deciso dove dormire. Maela le passa le foglie prima che le chieda.

      {accademiche Media} Le minute hanno la forma delle relazioni del Velo,
      con la data in alto e l'Albero in fondo. Ogni lettera ripete i numeri
      della precedente.

      Sull'ultima pagina c'è la gola disegnata a matita, con i paletti dei
      nastri segnati a crocette fino al sasso con la croce. *Oltre la croce,
      neanche una crocetta.* Alenna ci batte sopra il dito, piano.

      {origine accolito-del-velo} Alenna ti guarda le mani prima della
      faccia, alla maniera delle anziane del Velo, e capisce da dove vieni.
      Ti fa posto sulla panca senza dire niente.
    opzioni:
      - testo: "Leggere con lei le misure dei nastri"
        descrizione: "Ogni mattina una riga, e ogni riga dice da che parte puntavano i nastri."
        prova: { attributo: mentale, abilita: accademiche, difficolta: Media }
        successo:
          titolo: Il conto
          testo: |
            Leggete le misure insieme, e Alenna ti lascia fare il conto senza
            aiutarti. I nastri puntano tutti verso la cima, e mese dopo mese
            tirano più forte. «Lassù entra» dici, e lei annuisce come una
            maestra soddisfatta. Ti chiede di portare i nastri di Maela fino
            alla Sella il giorno che Cerya lascerà salire qualcuno. Lei e
            Maela quel permesso non lo hanno.
          pe: { accademiche: 3 }
          effetti: { fazione.tuarmir: 1, rep.tuarmir: 0.5 }
        fallimento:
          titolo: Le colonne
          testo: |
            Ti perdi fra le colonne dei numeri, e Alenna ti corregge con la
            pazienza delle maestre del Velo, che è una pazienza fredda. Il
            conto alla fine lo fa Maela, a voce troppo alta. Il vento va su,
            verso la Sella. Alenna ti chiede di portare lassù i nastri, il
            giorno che Cerya lo permetterà.
          effetti: { fazione.tuarmir: 1, scandalo: 0.5 }
      - testo: "Confrontare le foglie del quaderno con quelle di oggi"
        descrizione: "Una foglia di oggi accanto a quella di un anno fa. La differenza si vede sul bordo."
        prova: { attributo: mentale, abilita: natura, difficolta: Media }
        successo:
          titolo: Due foglie
          testo: |
            Posi una foglia di oggi accanto a quella della prima pagina. La riga
            grigia è larga il doppio, e soltanto dalla parte del vento. Alenna
            la incolla nel quaderno con la data di stasera e il tuo nome
            accanto, piccolo. Poi ti chiede di portare i nastri di Maela fino
            alla Sella il giorno che Cerya lo permetterà.
          pe: { natura: 3 }
          effetti: { fazione.tuarmir: 1, rep.tuarmir: 0.5 }
        fallimento:
          titolo: La foglia sbriciolata
          testo: |
            La foglia della prima pagina ti si sbriciola fra le dita. Alenna
            chiude gli occhi un momento e poi la ricompone con la punta del
            coltello, senza rimproverarti. Ti chiede lo stesso di portare
            lassù i nastri di Maela, il giorno che Cerya lo permetterà.
          effetti: { fazione.tuarmir: 1, scandalo: 0.5 }
      - testo: "Chiederle di Cerya e del vento"
        descrizione: "Alenna vive con lei da mesi. Sa come pensa Cerya meglio di chiunque al villaggio, e lo dice a fatica."
        prova: { attributo: sociale, abilita: [empatia, galateo], difficolta: Media }
        successo:
          titolo: Il naso e i numeri
          testo: |
            Alenna ci pensa a lungo. Cerya, dice, è la prima persona che le
            abbia mai dato ragione e torto nella stessa frase. Il vento per lei
            ha un odore, e per Alenna ha una direzione, e nessuna delle due
            sa da dove venga. Ti chiede di portare i nastri di Maela fino alla
            Sella, il giorno che Cerya lo permetterà.
          pe: { empatia: 3 }
          effetti: { fazione.tuarmir: 1, rep.tuarmir: 0.5 }
        fallimento:
          titolo: Una domanda di troppo
          testo: |
            Le chiedi di Cerya con troppa curiosità, e Alenna torna al
            quaderno senza rispondere. Maela ti guarda storto. Dopo un poco,
            senza alzare la testa, Alenna ti chiede di portare i nastri alla
            Sella, il giorno che Cerya lo permetterà.
          effetti: { fazione.tuarmir: 1, tormento: 0.5 }
      - testo: "Restare a lavorare con loro fino a tardi"
        descrizione: "Le foglie da incollare sono tante, e la sera è lunga. Si lavora in tre, a voce bassa."
        costo: 2
        esito:
          titolo: In tre
          testo: |
            Incolli foglie con loro fino a tardi, e la candela si consuma fino
            al piattino. A un certo punto Maela si addormenta sul tavolo, e
            Alenna le mette sulle spalle la sua tonaca. Prima di spegnere ti
            chiede di portare i nastri fino alla Sella, il giorno che Cerya lo
            permetterà.
          pe: { natura: 3 }
          effetti: { fazione.tuarmir: 1, rep.tuarmir: 0.5 }
      - testo: "Dire con lei l'ora di vespro, come in Cattedrale"
        descrizione: "L'ora di vespro si dice a voce bassa, ed è la stessa in Cattedrale e in una grotta di Tuarmir."
        quando: [origine.accolito-del-velo >= 1]
        esito:
          titolo: Il vespro
          testo: |
            Dite il vespro insieme a mezza voce, e Maela lo segue muovendo le
            labbra. Alla fine Alenna resta un momento con gli occhi chiusi.
            Poi ti chiede di portare i nastri di Maela fino alla Sella, il
            giorno che Cerya lascerà salire qualcuno.
          pe: { resilienza: 3 }
          effetti: { fazione.tuarmir: 1, rep.tuarmir: 0.5 }

  # ------------------------------------------------------------ 7 → 8 · la polvere grigia (Quartieri Alti)
  - id: tuarmir-la-polvere-grigia
    immagine: ambientazione/quartieri-alti
    titolo: La polvere grigia
    sommario: "Il giovedì sera, dietro una porta verde dei Quartieri Alti, si fuma la polvere dei funghi della Sella. Madre Cerya vuole sapere chi la respira."
    luogo: Quartieri Alti, la casa con la porta verde
    area: quartieri-alti
    requisiti: [fazione.tuarmir == 7]
    testo: |
      Madre Cerya vuole sapere chi respira i funghi della Sella. Ilenia l'ha
      saputo da un mulattiere della piana in cambio di una maschera nuova.
      Ruvo Gessan li consegna il giovedì in una casa con la porta verde,
      dietro il Municipio. Il giovedì sera la porta resta socchiusa, e una
      scala con il corrimano di ottone porta a un salotto drappeggiato di
      seta grigia. Su cuscini bassi sono sdraiati una dozzina di ospiti, e in
      mezzo a loro un braciere di bronzo manda un fumo chiaro e dolciastro.
      La padrona di casa, Ottavia Brenn, ha i capelli tinti di rame e un
      ventaglio che non apre mai, e passa fra i cuscini a sistemare le teste.

      {percezione Media} Gli ospiti hanno tutti la faccia girata verso lo
      stesso angolo, quello senza finestre. Dalla parte della città dove
      sta, quell'angolo guarda a nord-est.

      Un uomo con il panciotto slacciato mormora che sente il mare, e la donna
      accanto annuisce senza aprire gli occhi. *Le parole del vecchio Tamme,
      nel solco di un terrazzo.* Vicino alla finestra un ragazzo ha le labbra
      grigie e non si muove da quando sei entrato. Ottavia ti vede sulla
      soglia e ti fa cenno di entrare con il ventaglio chiuso.

      {medicina Media} Il ragazzo alla finestra ha il polso lento e le unghie
      bluastre. Il fumo l'ha preso più degli altri, e nessuno se n'è accorto.

      {origine rampollo-dei-quartieri-alti} I giovedì di casa Brenn li
      conosci di fama. Alle cene se ne parla abbassando la voce, che nei
      Quartieri Alti vuol dire che ci vanno tutti.
    opzioni:
      - testo: "Sdraiarti fra gli ospiti senza respirare il fumo"
        descrizione: "Un ospite in più su un cuscino non lo nota nessuno. Bisogna fingere di respirare, e ascoltare."
        prova: { attributo: sociale, abilita: [galateo, ingannare], difficolta: Media }
        successo:
          titolo: Fra i cuscini
          testo: |
            Ti sdrai su un cuscino libero con la maschera di Tuarmir nascosta
            sotto il colletto e respiri attraverso la stoffa. Ottavia passa e ti
            sistema la testa, e poi si ferma a chiacchierare con un'amica sopra
            di te. Lonn Var le ha promesso un carico intero dalla Sella per la
            luna nuova, appena trova chi gli apre la strada per la cima. Esci
            prima della fine, con il vestito che sa di dolciastro, e prendi la
            strada di Tuarmir.
          pe: { galateo: 3 }
          effetti: { fazione.tuarmir: 1, rep.tuarmir: 0.5 }
        fallimento:
          titolo: Il mare in salotto
          testo: |
            Respiri il fumo per sbaglio alla seconda boccata, e per un poco
            vedi anche tu l'acqua grigia salire fra i cuscini. Quando ti
            riprendi Ottavia sta dicendo a un'amica che Lonn Var le ha
            promesso un carico intero dalla Sella per la luna nuova, appena
            trova la strada per la cima. Esci con la testa pesante e il sapore
            di sale in bocca.
          effetti: { fazione.tuarmir: 1, tormento: 0.5 }
      - testo: "Curare il ragazzo dalle labbra grigie"
        descrizione: "Nessuno si accorge di lui. Un ospite che muore sul cuscino rovinerebbe la serata, e Ottavia lo sa."
        prova: { attributo: mentale, abilita: medicina, difficolta: Media }
        successo:
          titolo: Le labbra grigie
          testo: |
            Porti il ragazzo alla finestra e gli apri il colletto, e gli fai
            bere acqua con l'aceto dalla brocca dei fiori. Si riprende
            tossendo. Ottavia è grata e infastidita in parti uguali. Ti
            racconta che i funghi della Sella sono i migliori mai fumati in
            casa sua, e che Lonn Var gliene ha promesso un carico intero per
            la luna nuova, appena trova la strada per la cima.
          pe: { medicina: 3 }
          effetti: { fazione.tuarmir: 1, rep.tuarmir: 0.5 }
        fallimento:
          titolo: La seta
          testo: |
            Il ragazzo si riprende tutto insieme e vomita sulla seta grigia del
            divano. Gli ospiti più svegli ridono. Ottavia ti fa accompagnare
            alla porta, e mentre scendi la senti dire che con il carico della
            Sella, alla luna nuova, la seta la cambia comunque.
          effetti: { fazione.tuarmir: 1, scandalo: 0.5 }
      - testo: "Scendere in cucina a parlare con la servitù"
        descrizione: "Chi pulisce il braciere sa che cosa ci si brucia, e chi lo porta su."
        prova: { attributo: sociale, abilita: [conoscenze-della-strada, empatia], difficolta: Media }
        successo:
          titolo: La cuoca
          testo: |
            In cucina la cuoca pela patate e si lamenta del fumo che sale per
            le scale. Secondo lei gli ospiti si girano tutti dalla stessa
            parte, e lei ha smesso di guardarli. Il mulattiere grande che
            porta i sacchi il giovedì le ha detto che alla luna nuova ne
            arriva un carico intero, dalla Sella, appena il suo padrone trova
            la strada per la cima.
          pe: { conoscenze-della-strada: 3 }
          effetti: { fazione.tuarmir: 1, rep.tuarmir: 0.5 }
        fallimento:
          titolo: Il maggiordomo
          testo: |
            In cucina ti trova il maggiordomo, che ti accompagna fuori dalla
            porta di servizio tenendoti per la manica. Sulla soglia però la
            cuoca ti grida dietro che il carico grosso della Sella arriva alla
            luna nuova, e che speriamo che soffochino tutti.
          effetti: { fazione.tuarmir: 1, sospetto: 0.5 }
      - testo: "Aspettare in strada la consegna del giovedì"
        descrizione: "Ruvo Gessan porta i sacchi a mezzanotte. Basta aspettare al freddo in un portone, e ascoltare."
        costo: 2
        esito:
          titolo: Il portone
          testo: |
            Aspetti in un portone di fronte fino a mezzanotte, con il freddo che
            sale dalle pietre chiare. Ruvo Gessan arriva con due sacchi in spalla
            e li consegna alla porta verde. A Ottavia, sulla soglia, dice che il
            carico grosso arriva dalla Sella alla luna nuova, appena il padrone
            trova la strada. Poi sputa la resina sul gradino.
          pe: { furtivita: 3 }
          effetti: { fazione.tuarmir: 1, rep.tuarmir: 0.5 }
      - testo: "Farti annunciare con il tuo nome"
        descrizione: "Un nome dei Quartieri Alti alla porta verde apre la porta e la bocca della padrona di casa."
        quando: [origine.rampollo-dei-quartieri-alti >= 1]
        esito:
          titolo: Il tuo nome
          testo: |
            Il servo ripete il tuo nome sulla soglia, e Ottavia ti viene incontro
            con il ventaglio aperto, per la prima volta. Ti offre il cuscino
            migliore e la polvere migliore. La rifiuti con garbo, e lei, per
            farsi perdonare di averla offerta, ti racconta che alla luna nuova
            Lonn Var le porta un carico intero dalla Sella, appena trova la
            strada per la cima.
          pe: { galateo: 3 }
          effetti: { fazione.tuarmir: 1, rep.tuarmir: 0.5 }

  # ------------------------------------------------------------ 8 → 9 · la notte che il vento gira (grado 3, il segno)
  - id: tuarmir-la-notte-che-il-vento-gira
    presso: tuarmir
    immagine: ambientazione/tuarmir
    titolo: La notte che il vento gira
    sommario: "Una notte i cani di Tuarmir guaiscono tutti insieme. Le maschere sulle corde si tendono verso la cima, e il fumo dei focolari sale verso la Sella."
    luogo: Tuarmir, le soglie, di notte
    area: superficie-fratturata
    requisiti: [fazione.tuarmir == 8]
    testo: |
      Racconti a Madre Cerya del salotto con la porta verde, delle facce
      girate verso l'angolo e del mare che sentono tutti. Lei ascolta con le
      mani in grembo, e alla fine ti manda a dormire senza rispondere.

      Ti svegliano i cani. Guaiscono tutti insieme da una porta all'altra
      della gola, e quando esci sulla soglia il villaggio è già fuori, in
      silenzio, con le lanterne basse. Le maschere sulle corde stanno tese
      verso la cima della gola come panni stesi in una tramontana. Il fumo dei
      focolari invece di salire dritto si piega e corre su per la parete verso
      la Sella. Sui muri il muschio è schiacciato tutto da una parte.

      {natura Media} Di notte il vento di una gola scende sempre verso valle,
      perché l'aria fredda pesa. Questo vento sale.

      {magia Media} Nel vento c'è un filo di Mana sottile e lontano, che non
      somiglia a nessuna cosa che conosci.

      Madre Cerya è sulla soglia del seccatoio con la faccia rivolta verso il
      crinale, e Ilenia accanto le dice piano quello che vede. Cerya alza il
      mento verso nord-est, dove dietro il crinale ci sono soltanto roccia e
      cielo. «Prima veniva dalla Cicatrice» dice. «Adesso viene da là, e là
      non c'è niente che io sappia nominare.» *È la prima volta che non sa
      una cosa.* Il villaggio resta sulle soglie fino all'alba.

      {origine allievo-di-torvessa} All'Accademia ti hanno insegnato che i
      venti seguono il caldo e il freddo. Questo non segue niente che si
      possa misurare con le lenti di Orvald Temmerin.
    opzioni:
      - testo: "Leggere il vento sul muschio dei muri"
        descrizione: "Il muschio si piega come il vento lo pettina. Da quanto è schiacciato si capisce da quanto soffia, e quanto forte."
        prova: { attributo: mentale, abilita: natura, difficolta: Media }
        successo:
          titolo: Il muschio pettinato
          testo: |
            Passi le dita sul muschio dei muri da una casa all'altra. È
            schiacciato verso la cima dappertutto, anche dove di solito il
            vento non arriva, e sotto il muschio la pietra è asciutta.
            All'alba il vento cala, e Cerya ti chiama nel seccatoio. Ti mette
            in mano la roncola della raccolta, quella che si dà a chi sale
            alla Sella. Ti dice che la Sella non si lascia più in pace, e che
            qualcuno di fuori deve salire a vedere dove va il vento.
          pe: { natura: 5 }
          almeno: { rep.tuarmir: 6 }
          effetti: { fazione.tuarmir: 1, oggetto.tuarmir-roncola-della-raccolta: 1 }
        fallimento:
          titolo: La mano nel muschio
          testo: |
            Appoggi la mano al muschio di un muro, e il vento ti prende il
            braccio e lo tira verso la cima, piano, come per mostrarti la
            strada. Ritiri la mano con un brivido. All'alba Cerya ti chiama
            nel seccatoio e ti mette in mano la roncola della raccolta. Ti
            dice che la Sella non si lascia più in pace, e che qualcuno di
            fuori deve salire a vedere dove va il vento.
          pe: { natura: 3 }
          almeno: { rep.tuarmir: 6 }
          effetti: { fazione.tuarmir: 1, oggetto.tuarmir-roncola-della-raccolta: 1, tormento: 0.5 }
      - testo: "Contare le raffiche come fa Maela"
        descrizione: "Il quaderno di Alenna misura il vento a battiti. Stanotte si può misurare anche questo."
        prova: { attributo: mentale, abilita: percezione, difficolta: Media }
        successo:
          titolo: Dodici battiti
          testo: |
            Conti i battiti fra una raffica e l'altra con Maela accanto, che
            li segna sulla tavoletta. I battiti sono sempre dodici, e la
            direzione non cambia mai. All'alba il vento cala, e Cerya ti
            chiama nel seccatoio. Ti mette in mano la roncola della raccolta,
            quella che si dà a chi sale alla Sella. Ti dice che la Sella non
            si lascia più in pace, e che qualcuno di fuori deve salire a
            vedere dove va il vento.
          pe: { percezione: 5 }
          almeno: { rep.tuarmir: 6 }
          effetti: { fazione.tuarmir: 1, oggetto.tuarmir-roncola-della-raccolta: 1 }
        fallimento:
          titolo: Il conto perso
          testo: |
            Perdi il conto alla terza raffica, perché a ogni raffica i cani
            guaiscono e tu ti volti. Maela il conto lo tiene da sola. All'alba
            Cerya ti chiama nel seccatoio e ti mette in mano la roncola della
            raccolta. Ti dice che la Sella non si lascia più in pace, e che
            qualcuno di fuori deve salire a vedere dove va il vento.
          pe: { percezione: 3 }
          almeno: { rep.tuarmir: 6 }
          effetti: { fazione.tuarmir: 1, oggetto.tuarmir-roncola-della-raccolta: 1, tormento: 0.5 }
      - testo: "Stare accanto a Cerya sulla soglia"
        descrizione: "Ha la faccia rivolta al crinale e le mani strette sullo stipite. Magari vuole qualcuno accanto."
        prova: { attributo: sociale, abilita: empatia, difficolta: Media }
        successo:
          titolo: Le mani sullo stipite
          testo: |
            Ti metti accanto a lei senza parlare, e dopo un poco Cerya ti
            trova il braccio e ci appoggia la mano. Trema appena. All'alba,
            quando il vento cala, ti porta nel seccatoio e ti mette in mano la
            roncola della raccolta, quella che si dà a chi sale alla Sella. Ti
            dice che la Sella non si lascia più in pace, e che deve salire
            qualcuno di fuori, uno che il vento lo sente.
          pe: { empatia: 5 }
          almeno: { rep.tuarmir: 6 }
          effetti: { fazione.tuarmir: 1, oggetto.tuarmir-roncola-della-raccolta: 1 }
        fallimento:
          titolo: La domanda
          testo: |
            Le chiedi che cosa c'è dietro il crinale, e Cerya non risponde, e
            tu ti accorgi troppo tardi che la domanda l'ha ferita. Ilenia ti
            guarda storto. All'alba Cerya ti chiama lo stesso nel seccatoio e
            ti mette in mano la roncola della raccolta. Ti dice che la Sella
            non si lascia più in pace, e che qualcuno di fuori deve salire a
            vedere dove va il vento.
          pe: { empatia: 3 }
          almeno: { rep.tuarmir: 6 }
          effetti: { fazione.tuarmir: 1, oggetto.tuarmir-roncola-della-raccolta: 1, scandalo: 0.5 }
      - testo: "Restare sulla soglia fino all'alba con il villaggio"
        descrizione: "Nessuno torna a dormire. Si resta fuori insieme, con le lanterne basse e i cani che guaiscono."
        costo: 2
        esito:
          titolo: Fino all'alba
          testo: |
            Resti sulla soglia con il villaggio finché il cielo sopra la gola
            si fa grigio e il vento cala di colpo, come quando si chiude una
            porta. Cerya ti chiama nel seccatoio e ti mette in mano la roncola
            della raccolta, quella che si dà a chi sale alla Sella. Ti dice
            che la Sella non si lascia più in pace, e che qualcuno di fuori
            deve salire a vedere dove va il vento.
          pe: { resilienza: 3 }
          almeno: { rep.tuarmir: 6 }
          effetti: { fazione.tuarmir: 1, oggetto.tuarmir-roncola-della-raccolta: 1 }
      - testo: "Dire per il villaggio la veglia del Velo"
        descrizione: "La veglia si dice per chi ha paura di notte. Detta a mezza voce sulla soglia, la sentono tutte le case."
        quando: [origine.accolito-del-velo >= 1]
        esito:
          titolo: La veglia
          testo: |
            Dici la veglia a mezza voce sulla soglia, e dalle case vicine
            qualcuno la dice con te, sbagliando le parole come Cerya. I cani
            smettono di guaire prima del vento. All'alba Cerya ti chiama nel
            seccatoio e ti mette in mano la roncola della raccolta, quella che
            si dà a chi sale alla Sella. Ti dice che la Sella non si lascia
            più in pace, e che qualcuno di fuori deve salire a vedere dove va
            il vento.
          pe: { resilienza: 5 }
          almeno: { rep.tuarmir: 6 }
          effetti: { fazione.tuarmir: 1, oggetto.tuarmir-roncola-della-raccolta: 1 }

  # ------------------------------------------------------------ 9 → 10 · Maela è salita
  - id: tuarmir-maela-e-salita
    presso: tuarmir
    immagine: icone/windsock
    titolo: Maela è salita
    sommario: "La mattina dopo la notte del vento il letto di Maela è vuoto. Sul tavolo del seccatoio ha lasciato la sua tavoletta."
    luogo: Tuarmir, il seccatoio
    area: superficie-fratturata
    requisiti: [fazione.tuarmir == 9]
    testo: |
      La mattina dopo la notte del vento il letto di Maela nella stanza dietro
      il seccatoio è vuoto e freddo. Mancano il cesto dei nastri e i paletti
      che teneva dietro la porta, e sul tavolo c'è la sua tavoletta con
      quattro parole in lettere enormi. SALGO A METTERE I NASTRI. Ilenia ha
      già trovato nel muschio sopra il sasso con la croce le sue impronte
      piccole e dritte.

      Madre Cerya sta seduta sullo sgabello con la tavoletta in grembo e ci
      passa sopra le dita, come se potesse leggerla al tatto. Ti dice che la
      ragazza è salita dove il vento la chiamava, e che stanotte lassù gela.

      {natura Media} Sulla Sella, di notte, il vento gela le mani in un'ora.
      Una ragazza che ci resta ferma rischia le dita.

      {empatia Media} Cerya tiene la tavoletta come una cosa che si può
      rompere. Quella ragazza gliel'hanno affidata, e adesso la Sella è
      anche colpa sua.

      *Ha seguito il quaderno fino all'ultima pagina, e poi oltre.* Ilenia
      arrotola già la corda del seccatoio.
    opzioni:
      - testo: "Preparare il sacco per la Sella"
        descrizione: "Corda, coperta, acqua, il muschio da masticare. Lassù bisogna portarsi tutto, e per due."
        prova: { attributo: mentale, abilita: [natura, medicina], difficolta: Media }
        successo:
          titolo: Il sacco per due
          testo: |
            Prepari il sacco per due, con la coperta più pesante del seccatoio
            e il muschio amaro per la testa. Cerya lo tasta da fuori e ci
            aggiunge un vasetto di grasso di capra per le mani della ragazza.
            Ilenia ti aspetta al sasso con la croce.
          pe: { natura: 3 }
          effetti: { fazione.tuarmir: 1, rep.tuarmir: 0.5 }
        fallimento:
          titolo: Il sacco sbagliato
          testo: |
            Riempi il sacco in fretta, e Cerya lo tasta e ci trova due cose
            inutili e nessuna coperta. Lo rifate insieme, e intanto la mattina
            se ne va. Ilenia ti aspetta al sasso con la croce e ha la faccia
            tirata.
          effetti: { fazione.tuarmir: 1, tormento: 0.5 }
      - testo: "Farti dire da Ilenia dove salgono le capre"
        descrizione: "Ilenia la croce non l'ha mai passata. È cresciuta però guardando le capre salire, e sa da dove si comincia."
        prova: { attributo: sociale, abilita: [empatia, persuasione], difficolta: Media }
        successo:
          titolo: Le capre
          testo: |
            Con il dito Ilenia ti disegna nella polvere la strada delle capre,
            poi la conca dei pascoli e la cengia del vento. Lassù, dice, c'è
            un pastore che non scende mai. Ti aspetta al sasso con la croce, e
            intanto prepara la corda.
          pe: { empatia: 3 }
          effetti: { fazione.tuarmir: 1, rep.tuarmir: 0.5 }
        fallimento:
          titolo: Il dito che trema
          testo: |
            Ilenia prova a disegnarti la strada nella polvere, e il dito le
            trema. Cancella e ricomincia due volte, e alla fine ti dice che sa
            soltanto dove si comincia. Ti aspetta al sasso con la croce.
          effetti: { fazione.tuarmir: 1, tormento: 0.5 }
      - testo: "Partire subito, senza aspettare"
        descrizione: "Ogni ora conta. Il sacco si prepara strada facendo."
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Media }
        successo:
          titolo: Subito
          testo: |
            Prendi la corda dalle mani di Ilenia e corri su per la scala
            grande, e lei ti viene dietro con il pane e il muschio. Al sasso con
            la croce ti ferma e ti lega la maschera.
          pe: { atletica: 3 }
          effetti: { fazione.tuarmir: 1, rep.tuarmir: 0.5 }
        fallimento:
          titolo: I gradini
          testo: |
            Corri su per la scala grande, e al centesimo gradino il muschio
            bagnato ti manda giù sul ginocchio. Arrivi al sasso con la croce
            zoppicando, e Ilenia ti lega la maschera senza dire niente.
          effetti: { fazione.tuarmir: 1, ferite: 0.5 }
      - testo: "Aspettare che Cerya prepari il muschio da masticare"
        descrizione: "Il muschio amaro per la testa va pestato e seccato sulla brace. Ci vuole la mattina."
        costo: 2
        esito:
          titolo: Il muschio pestato
          testo: |
            Cerya pesta il muschio nel mortaio e lo secca sulla brace, e tu
            aspetti guardando la gola che si schiarisce. Te lo mette in un
            sacchetto e ti chiude la mano intorno. Ilenia ti aspetta al sasso
            con la croce.
          pe: { resilienza: 3 }
          effetti: { fazione.tuarmir: 1, rep.tuarmir: 0.5 }
      - testo: "Promettere ad Alenna che la riporti giù"
        descrizione: "Alenna vuole salire con te, e Cerya glielo vieta. Una promessa la tiene qui."
        quando: [velo.alenna == 2]
        esito:
          titolo: La promessa
          testo: |
            Alenna ha già la tonaca legata in vita e la corda in mano, e Cerya
            le tiene il polso. Le prometti che riporti giù Maela, e Alenna ti
            dà la corda, e insieme il quaderno delle foglie, perché tu veda dove
            finiscono i nastri. Ilenia ti aspetta al sasso con la croce.
          pe: { empatia: 3 }
          effetti: { fazione.tuarmir: 1, rep.tuarmir: 0.5 }

  # ------------------------------------------------------------ 11 → 12 · la mappa dei nastri (grado 4)
  - id: tuarmir-la-mappa-dei-nastri
    presso: tuarmir
    immagine: icone/windsock
    titolo: La mappa dei nastri
    sommario: "Maela disegna la mappa dei suoi nastri con le dita fasciate. In grotta grande i vecchi vogliono riempire la grata di sassi."
    luogo: Tuarmir, il seccatoio e la grotta grande
    area: superficie-fratturata
    requisiti: [fazione.tuarmir == 11]
    testo: |
      Maela ha le dita fasciate nella tela delle maschere, e la febbre le è
      passata da due giorni. Seduta al tavolo del seccatoio disegna sul
      quaderno delle foglie la mappa dei suoi nastri, con la lingua fra i
      denti. I paletti salgono dal sasso con la croce fino alla Sella, e ogni
      nastro è una freccia. Puntano tutti alla grata. Oltre la grata, dal
      crinale, arriva una freccia sola e lunga, da nord-est. Il dente
      spezzato del Pettine è appoggiato al muro dietro di lei, e nessuno lo
      tocca.

      La sera la grotta grande è piena. I vecchi vogliono riempire la grata
      di sassi e di terra, perché il vento torni a scendere dalla Cicatrice
      come una volta. Maela dice che prima bisogna misurare, e un vecchio le
      risponde che le misure non hanno mai fermato il vento. Madre Cerya
      ascolta tutti con la testa piegata.

      {tecnologia Difficile} Una grata fatta per farci entrare il vento non si
      tappa con i sassi. Chi l'ha costruita sapeva che cosa voleva, e i sassi
      non erano nei suoi conti.

      {resilienza Media fallita} Ti torna in mente il ronzio della grata, e
      senti di nuovo quella nota bassa sotto le altre.

      In fondo alla grotta, contro lo stipite, Ruvo Gessan mastica resina e
      ascolta tutto. *Maela ha piantato i paletti per tornare, e adesso la
      strada la conoscono tutti.* Cerya alza la testa verso di te.

      {origine apprendista-raschiatore} Sulle piattaforme ti hanno insegnato
      a non toccare quello che i Precursori hanno lasciato acceso, e a
      segnarlo sulla carta per chi viene dopo.
    opzioni:
      - testo: "Dire al consiglio di lasciare la grata com'è"
        descrizione: "I sassi li porterebbero su i vecchi, uno alla volta, passando accanto al Pettine. Bisogna dirlo in modo che lo capiscano."
        prova: { attributo: sociale, abilita: [persuasione, empatia], difficolta: Media }
        successo:
          titolo: I sassi
          testo: |
            Racconti del Pettine che pettina via dalla grata ogni sasso, e
            chiedi chi vuole portare i primi. In tutta la grotta non si alza
            nemmeno una mano. Allora Cerya dice di lasciare i sassi dove sono,
            perché quella grata l'ha fatta qualcuno che sapeva il fatto suo, e
            la grata resta com'è. Uscendo ti mette sulle spalle un mantello di
            cuoio coperto di muschio vivo, quello che si cuce per chi sale
            sopra le case, e Ilenia ti dà una borsa con la paga della
            raccolta.
          pe: { persuasione: 5 }
          almeno: { rep.tuarmir: 8 }
          effetti: { fazione.tuarmir: 1, oggetto.tuarmir-mantello-di-muschio: 1, monete: 80 }
        fallimento:
          titolo: I vecchi
          testo: |
            Parli troppo del Pettine, e i vecchi si convincono che la grata va
            chiusa ancora di più. Cerya alza la mano. «I sassi lasciateli dove
            sono. Quella grata l'ha fatta qualcuno che sapeva il fatto suo.»
            La grata resta com'è, ma i vecchi escono borbottando. Cerya ti
            mette sulle spalle il mantello di muschio, e Ilenia ti dà la paga
            della raccolta.
          pe: { persuasione: 3 }
          almeno: { rep.tuarmir: 8 }
          effetti: { fazione.tuarmir: 1, oggetto.tuarmir-mantello-di-muschio: 1, monete: 80, scandalo: 0.5 }
      - testo: "Aiutare Maela a finire la mappa"
        descrizione: "Le frecce vanno messe in scala, e la grata disegnata grande quanto è. Con le dita fasciate Maela ci mette il doppio."
        prova: { attributo: mentale, abilita: accademiche, difficolta: Media }
        successo:
          titolo: La mappa in scala
          testo: |
            Finite la mappa insieme e la portate in grotta grande. I vecchi la
            guardano a lungo, le frecce che vanno tutte nello stesso buco, e
            uno si fa il segno dell'Albero. Cerya ci passa sopra le dita. Dice
            di lasciare i sassi dove sono, perché quella grata l'ha fatta
            qualcuno che sapeva il fatto suo. La grata resta com'è. Ti mette
            sulle spalle il mantello di muschio, e Ilenia ti dà la paga della
            raccolta.
          pe: { accademiche: 5 }
          almeno: { rep.tuarmir: 8 }
          effetti: { fazione.tuarmir: 1, oggetto.tuarmir-mantello-di-muschio: 1, monete: 80 }
        fallimento:
          titolo: La scala sbagliata
          testo: |
            Sbagli la scala, e la grata sulla mappa viene grande come il
            villaggio. In grotta grande i vecchi si spaventano ancora di più.
            Cerya alza la mano. «I sassi lasciateli dove sono. Quella grata
            l'ha fatta qualcuno che sapeva il fatto suo.» La grata resta
            com'è. Ti mette sulle spalle il mantello di muschio, e Ilenia ti
            dà la paga della raccolta.
          pe: { accademiche: 3 }
          almeno: { rep.tuarmir: 8 }
          effetti: { fazione.tuarmir: 1, oggetto.tuarmir-mantello-di-muschio: 1, monete: 80, scandalo: 0.5 }
      - testo: "Raccontare la Sella come l'hai vista"
        descrizione: "Il sale sulle pietre, i braccianti seduti, la grata che ronza. Chi non c'è stato deve vederla con le tue parole."
        prova: { attributo: sociale, abilita: espressivita, difficolta: Media }
        successo:
          titolo: La Sella
          testo: |
            Racconti la Sella dall'inizio, dai terrazzi grigi alla grata che
            ronza, senza alzare la voce, e la grotta ti ascolta come si
            ascolta una storia d'inverno. Quando finisci nessuno parla di
            sassi. Cerya dice soltanto di lasciare i sassi dove sono. Ti mette
            sulle spalle il mantello di muschio, e Ilenia ti dà la paga della
            raccolta.
          pe: { espressivita: 5 }
          almeno: { rep.tuarmir: 8 }
          effetti: { fazione.tuarmir: 1, oggetto.tuarmir-mantello-di-muschio: 1, monete: 80 }
        fallimento:
          titolo: Il ronzio
          testo: |
            Racconti la Sella, e quando arrivi al ronzio della grata ti
            accorgi di imitarlo con la gola, senza volerlo. Due bambini
            scoppiano a piangere. Cerya alza la mano. «I sassi lasciateli dove
            sono. Quella grata l'ha fatta qualcuno che sapeva il fatto suo.»
            Ti mette sulle spalle il mantello di muschio, e Ilenia ti dà la
            paga della raccolta.
          pe: { espressivita: 3 }
          almeno: { rep.tuarmir: 8 }
          effetti: { fazione.tuarmir: 1, oggetto.tuarmir-mantello-di-muschio: 1, monete: 80, tormento: 0.5 }
      - testo: "Lasciare che decida Cerya"
        descrizione: "Sulla Sella ci sei stato tu, ma l'ultima parola qui è sempre sua."
        esito:
          titolo: L'ultima parola
          testo: |
            Taci, e la discussione va avanti fino a tardi. Alla fine Cerya
            alza la mano. Dice di lasciare i sassi dove sono, perché quella
            grata l'ha fatta qualcuno che sapeva il fatto suo. La grata resta
            com'è. Ti mette sulle spalle il mantello di muschio, quello che si
            cuce per chi sale sopra le case, e Ilenia ti dà la paga della
            raccolta.
          almeno: { rep.tuarmir: 8 }
          effetti: { fazione.tuarmir: 1, oggetto.tuarmir-mantello-di-muschio: 1, monete: 80 }
      - testo: "Lasciare la parola ad Alenna"
        descrizione: "Alenna ha misurato il vento per un anno. In grotta grande è sempre stata zitta. Stasera però ha il quaderno in mano."
        quando: [velo.alenna == 2]
        esito:
          titolo: Il quaderno
          testo: |
            Alenna si alza con il quaderno delle foglie aperto e legge i
            numeri di un anno, a voce bassa, senza commentarli. Quando finisce
            i vecchi non hanno più niente da dire. Cerya annuisce. «I sassi
            lasciateli dove sono. Quella grata l'ha fatta qualcuno che sapeva
            il fatto suo.» Ti mette sulle spalle il mantello di muschio, e
            Ilenia ti dà la paga della raccolta.
          pe: { empatia: 5 }
          almeno: { rep.tuarmir: 8 }
          effetti: { fazione.tuarmir: 1, oggetto.tuarmir-mantello-di-muschio: 1, monete: 80 }
      - testo: "Disegnare la grata come si disegnano le macchine all'Accademia"
        descrizione: "La pianta e la sezione, con le misure a margine. Una macchina disegnata così smette di sembrare una bocca."
        quando: [origine.allievo-di-torvessa >= 1]
        esito:
          titolo: Pianta e sezione
          testo: |
            Disegni la grata in pianta e in sezione sul retro della mappa di
            Maela, con le misure a margine come ti hanno insegnato
            all'Accademia. In grotta grande i vecchi la guardano e smettono di
            chiamarla bocca. Cerya ci passa sopra le dita. «I sassi lasciateli
            dove sono. Quella grata l'ha fatta qualcuno che sapeva il fatto
            suo.» Ti mette sulle spalle il mantello di muschio, e Ilenia ti dà
            la paga della raccolta.
          pe: { tecnologia: 5 }
          almeno: { rep.tuarmir: 8 }
          effetti: { fazione.tuarmir: 1, oggetto.tuarmir-mantello-di-muschio: 1, monete: 80 }
