# La quest di Tuarmir, Atto V (fazione.tuarmir 12 → 15).
# - 12 → 13 `tuarmir-le-lettere-nel-cassetto` (Cattedrale del Velo): Padre Aurelio Vantes tira fuori dal cassetto le
#   lettere di Sorella Alenna (fazioni/velo/passi-2.yaml: «le ho messe in un cassetto») e scrive per Tuarmir la
#   lettera che rifiuta tutto quello che cresce sulla Sella (tuarmir.lettera). Con velo.alenna 1 Alenna è in
#   Cattedrale, e un'opzione la fa chiamare.
# - 13 → 14 `tuarmir-la-raccolta-di-ruvo` (boss): Ruvo Gessan e sei braccianti raschiano i funghi grigi intorno alla
#   grata, saliti seguendo i nastri di Maela. Combattimento o vie Difficili; chi fallisce resta al passo 13 e paga.
#   Lonn Var resta il mercante delle erbe di Tuarmir (la gola di sotto del Velo lo mostra ancora con il mulo).
# - 14 → 15 `tuarmir-il-dono-del-vento` (grado 5, Orecchio del vento): nell'ora di sole Cerya dà la lancia del Pettine
#   e il muschio sordo, che cresce dove la grata ronza (dono.tuarmir). Il vento viene ancora da nord-est, e nessuno sa
#   che cosa sia.
storylet:
  # ------------------------------------------------------------ 12 → 13 · le lettere nel cassetto
  - id: tuarmir-le-lettere-nel-cassetto
    presso: cattedrale-del-velo
    immagine: personaggi/padre-vantes
    titolo: Le lettere nel cassetto
    sommario: "Con la mappa di Maela e un fungo grigio in un vasetto vai da Padre Aurelio Vantes. Il Velo compra quasi tutte le erbe di Tuarmir."
    luogo: Cattedrale del Velo, la sagrestia
    area: quartieri-alti
    requisiti: [fazione.tuarmir == 12]
    testo: |
      Madre Cerya ti ha mandato in città con la mappa di Maela arrotolata in
      una tela cerata e un fungo grigio chiuso in un vasetto di coccio. Il
      Velo compra quasi tutte le erbe di Tuarmir, e quello che il Velo
      rifiuta a Tuarmir smettono di raccoglierlo. Padre Aurelio Vantes ti
      riceve in sagrestia fra gli armadi dei paramenti, e mentre parli ti
      tiene due dita sul polso.

      Gli racconti della Sella e della grata, del giovedì di casa Brenn e del
      carico che Lonn Var ha promesso per la luna nuova. Vantes ascolta senza
      interromperti. Poi apre un cassetto dell'armadio più vecchio e tira
      fuori un pacco di lettere legate con lo spago. Sono di Sorella Alenna,
      nella grafia dritta del quaderno delle foglie, e le ultime hanno le
      righe storte. «Le avevo messe qui» dice, e non aggiunge il perché.

      {empatia Media} Tiene le lettere con tutte e due le mani, come una cosa
      di cui vergognarsi. Quel cassetto l'ha chiuso lui, e lo sa.

      {politica-ed-economia Media} Una lettera della Cattedrale che rifiuta
      le erbe della Sella vale più di qualunque guardia. Lonn Var vende al
      Velo per vivere, e ai salotti per arricchirsi.

      *Nel quaderno le minute, e qui le lettere vere.* Vantes scioglie lo
      spago con le dita lente.

      {origine accolito-del-velo} La sagrestia odora di cera vergine e di
      naftalina, come quando ci entravi da novizio a portare i ceri. Il
      cassetto dell'armadio vecchio non l'avevi mai visto aperto.
    opzioni:
      - testo: "Mettergli la mappa di Maela accanto alle lettere"
        descrizione: "Le misure di Alenna e i nastri di Maela dicono la stessa cosa in due modi. Messi insieme, si leggono da soli."
        prova: { attributo: mentale, abilita: accademiche, difficolta: Media }
        successo:
          titolo: Le misure
          testo: |
            Srotoli la mappa sul tavolo dei paramenti e ci metti accanto le
            lettere, una per mese. I numeri di Alenna e le frecce di Maela
            tornano fino all'ultima riga. Vantes li confronta con il dito,
            poi prende la penna e scrive per la gente di Tuarmir che la
            Cattedrale non compra niente che sia cresciuto sulla Sella, e
            nemmeno da chi lo vende ad altri. Ci mette il sigillo del Velo e te
            la consegna.
          pe: { accademiche: 3 }
          effetti: { fazione.tuarmir: 1, tuarmir.lettera: 1, rep.tuarmir: 0.5 }
        fallimento:
          titolo: La mappa al contrario
          testo: |
            Srotoli la mappa al contrario, con la Sella in basso, e ci metti
            un poco a capirlo mentre il sagrestano ride dalla porta. Vantes la
            gira con pazienza e confronta lui i numeri. Poi scrive per la gente
            di Tuarmir che la Cattedrale non compra niente che sia cresciuto
            sulla Sella, e nemmeno da chi lo vende ad altri, e ci mette il
            sigillo.
          effetti: { fazione.tuarmir: 1, tuarmir.lettera: 1, scandalo: 0.5 }
      - testo: "Chiedergli di leggerle adesso, davanti a te"
        descrizione: "Le lettere sono rimaste chiuse in un cassetto per mesi. Leggerle davanti a qualcuno è più difficile, e più utile."
        prova: { attributo: sociale, abilita: [empatia, persuasione], difficolta: Media }
        successo:
          titolo: Le righe storte
          testo: |
            Vantes legge le lettere in piedi, una per una, finché arriva a
            quelle con le righe storte e si siede. Alla fine resta a lungo con
            le mani sulle ginocchia. Poi scrive per la gente di Tuarmir che la
            Cattedrale non compra niente che sia cresciuto sulla Sella, e
            nemmeno da chi lo vende ad altri. Ci mette il sigillo del Velo e
            te la consegna senza guardarti.
          pe: { empatia: 3 }
          effetti: { fazione.tuarmir: 1, tuarmir.lettera: 1, rep.tuarmir: 0.5 }
        fallimento:
          titolo: Il cassetto
          testo: |
            Glielo chiedi con troppa durezza, e Vantes rimette le lettere nel
            cassetto. Però ti ascolta ancora, e alla fine scrive per la gente
            di Tuarmir che la Cattedrale non compra niente che sia cresciuto
            sulla Sella. Ti consegna la lettera sigillata con la mano che gli
            trema appena.
          effetti: { fazione.tuarmir: 1, tuarmir.lettera: 1, tormento: 0.5 }
      - testo: "Convincerlo che il Velo deve rifiutare i funghi della Sella"
        descrizione: "Se il Velo non li compra, Lonn Var li vende soltanto ai salotti, e i salotti non bastano a pagare sei braccianti."
        prova: { attributo: sociale, abilita: [persuasione, politica-ed-economia], difficolta: Media }
        successo:
          titolo: Il rifiuto
          testo: |
            Gli spieghi il conto di Lonn Var, quello che vende al Velo e quello
            che vende ai salotti, e Vantes lo capisce al primo giro. Prende la
            penna e scrive per la gente di Tuarmir che la Cattedrale non compra
            niente che sia cresciuto sulla Sella, e nemmeno da chi lo vende ad
            altri. Ci mette il sigillo del Velo e ti benedice sulla porta.
          pe: { persuasione: 3 }
          effetti: { fazione.tuarmir: 1, tuarmir.lettera: 1, rep.tuarmir: 0.5 }
        fallimento:
          titolo: Il cronista
          testo: |
            Ti perdi nei conti, e Vantes ti interrompe per chiamare il
            cronista che segue le forniture. Il cronista ti fa ripetere tutto
            due volte, con gli occhi al soffitto. Alla fine Vantes scrive lo
            stesso la lettera con il sigillo del Velo, e la Cattedrale non
            comprerà niente che sia cresciuto sulla Sella.
          effetti: { fazione.tuarmir: 1, tuarmir.lettera: 1, scandalo: 0.5 }
      - testo: "Aspettare che finisca il vespro"
        descrizione: "Vantes ha il vespro, e dopo il vespro le confessioni. Ci si siede su una panca della sagrestia e si aspetta."
        costo: 2
        esito:
          titolo: Dopo il vespro
          testo: |
            Aspetti su una panca della sagrestia per tutto il vespro e per le
            confessioni, finché i ceri sono consumati a metà. Quando Vantes
            torna ha letto le lettere, perché ha gli occhi rossi. Scrive per la
            gente di Tuarmir che la Cattedrale non compra niente che sia
            cresciuto sulla Sella, e ci mette il sigillo del Velo.
          pe: { resilienza: 3 }
          effetti: { fazione.tuarmir: 1, tuarmir.lettera: 1, rep.tuarmir: 0.5 }
      - testo: "Presentargli la cosa nella forma delle suppliche"
        descrizione: "In Cattedrale le richieste al sommo sacerdote si fanno nella forma della supplica, che comincia invocando l'Albero e mette in fondo la cosa chiesta. Vantes risponde meglio a quella."
        quando: [origine.accolito-del-velo >= 1]
        esito:
          titolo: La supplica
          testo: |
            Gli presenti la cosa a voce bassa nella forma della supplica, che
            comincia invocando l'Albero e mette in fondo la richiesta. Vantes
            la riconosce e risponde nella forma, che è un sì. Scrive per la
            gente di Tuarmir che la Cattedrale non compra niente che sia
            cresciuto sulla Sella, ci mette il sigillo del Velo e ti posa la
            mano sulla testa.
          pe: { accademiche: 3 }
          effetti: { fazione.tuarmir: 1, tuarmir.lettera: 1, rep.tuarmir: 0.5 }
      - testo: "Far chiamare Sorella Alenna dal chiostro"
        descrizione: "Alenna è tornata in Cattedrale. Le lettere le ha scritte lei, e le spiega meglio di chiunque."
        quando: [velo.alenna == 1]
        esito:
          titolo: Sorella Alenna
          testo: |
            Alenna arriva dal chiostro con le maniche rimboccate, vede il pacco
            sul tavolo e si ferma sulla soglia. Poi si siede accanto a Vantes e
            gli legge le sue lettere a voce bassa, una per mese, con la mappa di
            Maela davanti. Vantes non dice niente. Scrive per la gente di
            Tuarmir che la Cattedrale non compra niente che sia cresciuto sulla
            Sella, e la sigilla con Alenna che guarda.
          pe: { empatia: 3 }
          effetti: { fazione.tuarmir: 1, tuarmir.lettera: 1, rep.tuarmir: 0.5 }

  # ------------------------------------------------------------ 13 → 14 · la raccolta di Ruvo (boss)
  - id: tuarmir-la-raccolta-di-ruvo
    presso: tuarmir
    immagine: ambientazione/tuarmir
    titolo: La raccolta di Ruvo
    sommario: "Ruvo Gessan è salito alla Sella con sei braccianti, seguendo i nastri di Maela. Raschiano i funghi grigi intorno alla grata."
    luogo: Tuarmir, poi la Sella
    area: superficie-fratturata
    requisiti: [fazione.tuarmir == 13]
    testo: |
      Quando torni a Tuarmir con la lettera di Vantes, nello slargo in fondo
      alla scala grande c'è il mulo di Lonn Var carico di sacchi vuoti, e
      Lonn Var ti saluta con tutti i denti. Ilenia ti viene incontro di
      corsa, e a Tuarmir nessuno corre. Ruvo Gessan è salito alla Sella
      stanotte con sei braccianti della piana, seguendo i nastri di Maela.

      Sali per la strada dei nastri, che adesso conosci a memoria, e arrivi
      alla Sella a metà mattina. Intorno alla grata i braccianti raschiano i
      funghi grigi dalla crosta di sale e li buttano nei sacchi con il nastro
      viola. Il Pettine è ribaltato fuori dalla rotaia con i denti al cielo,
      tirato giù con le leve. Ruvo sta in piedi in mezzo a loro con un pungolo
      ferrato da mulattiere, e alla cintura ha una fila di fiale. Ti vede
      arrivare e sputa la resina di lato. «Il padrone ha pagato la giornata»
      dice. «La giornata finisce quando è sera.»

      {intimidire Media} I braccianti guardano te e poi Ruvo. Sono pagati a
      giornata, e nessuno di loro vuole morire per un sacco di funghi.

      {armi-da-mischia Difficile} Ruvo tiene il pungolo come una lancia corta,
      con la mano dietro bassa. Ha fatto la scorta alle carovane, e il
      mestiere l'ha imparato bene.

      La grata ronza sotto i piedi dei braccianti. *I nastri di Maela, seguiti
      dalle persone sbagliate.* Ruvo fa un passo verso di te.

      {origine fuggiasco-di-ghoran} Sei braccianti in fila e un uomo con il
      pungolo. A Ghoran il pungolo si usava sulle bestie e su quelli come te.
    opzioni:
      - testo: "Affrontare Ruvo Gessan"
        descrizione: "È grande e sa usare il pungolo, e le fiale alla cintura non sono per bellezza. I braccianti staranno a guardare."
        combattimento: tuarmir-ruvo
        vittoria:
          titolo: Il pungolo spezzato
          testo: |
            Ruvo va giù sulla crosta di sale con il pungolo spezzato sotto di
            sé, e quando prova a rialzarsi gli metti il piede sul petto. I
            braccianti lasciano cadere i sacchi e scendono per la strada dei
            nastri senza voltarsi. In fondo alla scala grande Lonn Var legge la
            lettera di Vantes due volte e la terza a voce alta, perché la
            sentano tutti. Ride meno del solito. La Sella, dice, è di Madre
            Cerya, e lui le erbe le ha sempre comprate in basso.
          pe: { armi-da-mischia: 5 }
          effetti: { fazione.tuarmir: 1, rep.tuarmir: 1 }
        sconfitta:
          titolo: Le fiale
          testo: |
            Una fiala ti si rompe sul petto, e il fumo dolciastro ti appesantisce
            le braccia finché il pungolo di Ruvo ti trova sotto le costole. Ti
            ritrovi seduto sulla crosta di sale, mentre i braccianti riprendono
            a raschiare. Scendi a Tuarmir tenendoti il fianco.
          effetti: { tormento: 0.5 }
      - testo: "Leggere ai braccianti la lettera di Vantes"
        descrizione: "Se il Velo non compra i funghi della Sella, chi li raccoglie lavora per niente. Bisogna farglielo capire prima che Ruvo li faccia tornare al lavoro."
        prova: { attributo: sociale, abilita: persuasione, difficolta: Difficile }
        successo:
          titolo: Il sigillo
          testo: |
            Rompi il sigillo e leggi la lettera ad alta voce sopra il ronzio
            della grata. Alla parola *Cattedrale* due braccianti si tolgono la
            maschera, e alla fine i sacchi sono per terra. Scendono tutti, uno
            dietro l'altro. Ruvo resta solo per un poco. Poi sputa la resina e
            li segue. In fondo alla scala grande Lonn Var legge la lettera e
            ride meno del solito. Secondo lui la Sella è di Madre Cerya, e le
            erbe le ha sempre comprate in basso.
          pe: { persuasione: 5 }
          effetti: { fazione.tuarmir: 1, rep.tuarmir: 1 }
        fallimento:
          titolo: Le risate
          testo: |
            Leggi la lettera, e il vento ti porta via metà delle parole. I
            braccianti ridono, perché il sigillo non lo sanno leggere. Ruvo ti
            spinge fuori dalla grata con il pungolo davanti a tutti, e ti
            consiglia di tornare quando avrai imparato a gridare.
          effetti: { scandalo: 1, ferite: 0.5 }
      - testo: "Trascinarlo sulla grata, dove il ronzio è più forte"
        descrizione: "Ruvo non ha mai messo piede sulle sbarre. Chi non c'è abituato, sulla grata perde l'equilibrio e la voglia di combattere."
        prova: { attributo: fisico, abilita: rissa, difficolta: Difficile }
        successo:
          titolo: Il ronzio
          testo: |
            Gli entri sotto il pungolo e lo trascini sulle sbarre, dove il
            ronzio sale dai piedi fino ai denti. Ruvo si piega e lascia il
            pungolo, con la faccia grigia, e i braccianti fanno un passo
            indietro tutti insieme. Scendono con lui, senza i sacchi. In fondo
            alla scala grande Lonn Var legge la lettera di Vantes e ride meno
            del solito. La Sella, dice, è di Madre Cerya.
          pe: { rissa: 5 }
          effetti: { fazione.tuarmir: 1, rep.tuarmir: 1 }
        fallimento:
          titolo: Il gomito
          testo: |
            Gli entri sotto il pungolo, e Ruvo ti aspetta con il gomito. Finisci
            sulla grata tu, con il ronzio nelle ossa e il naso che sanguina, e
            ti trascini fuori a quattro zampe mentre i braccianti riprendono a
            raschiare.
          effetti: { ferite: 1 }
      - testo: "Leggere la lettera con la voce del pulpito"
        descrizione: "In Cattedrale ti hanno insegnato a leggere gli interdetti in modo che li senta anche l'ultima fila. Sulla Sella l'ultima fila è il vento."
        quando: [origine.accolito-del-velo >= 1]
        prova: { attributo: mentale, abilita: accademiche, difficolta: Difficile }
        successo:
          titolo: L'interdetto
          testo: |
            Leggi la lettera come si leggono gli interdetti dal pulpito, con le
            pause dove vanno, e la tua voce passa sopra il ronzio della grata.
            I braccianti si fanno il segno dell'Albero e posano i sacchi. Ruvo
            li guarda scendere e li segue senza dire una parola. In fondo alla
            scala grande Lonn Var legge la lettera e ride meno del solito. La
            Sella, dice, è di Madre Cerya.
          pe: { accademiche: 5 }
          effetti: { fazione.tuarmir: 1, rep.tuarmir: 1 }
        fallimento:
          titolo: Il pulpito
          testo: |
            La voce del pulpito sulla Sella suona ridicola, e lo senti anche tu
            alla seconda riga. I braccianti ridono. Ruvo ti spinge fuori dalla
            grata con il pungolo, piano, come si scosta un mulo.
          effetti: { scandalo: 1, ferite: 0.5 }

  # ------------------------------------------------------------ 14 → 15 · il dono del vento (grado 5)
  - id: tuarmir-il-dono-del-vento
    presso: tuarmir
    immagine: ambientazione/tuarmir
    titolo: Il dono del vento
    sommario: "Nell'ora di sole il villaggio esce sulle soglie tutto insieme. Il fabbro ha montato il dente del Pettine su un'asta, e Madre Cerya ha qualcosa per te."
    luogo: Tuarmir, lo slargo, nell'ora di sole
    area: superficie-fratturata
    requisiti: [fazione.tuarmir == 14]
    testo: |
      Nell'ora di sole il villaggio esce sulle soglie tutto insieme, e stavolta
      nessuno chiacchiera. Nello slargo in fondo alla scala grande il fabbro
      che ferra i muli di Lonn Var ha montato il dente del Pettine su un'asta
      di frassino, e Maela la tiene in piedi con le dita ancora fasciate.
      Madre Cerya sta in mezzo allo slargo con Ilenia accanto. In mano ha un
      sacchetto di tela con dentro un muschio grigioverde, fine come capelli.

      «Cresce soltanto intorno alla grata, dove il ronzio non smette mai»
      dice. «Chi raccoglie lassù se lo mette nelle orecchie, e il ronzio non
      lo sente più.» Te lo posa sul palmo e ti chiude le dita sopra. Il vento
      sale ancora dalla gola verso la Sella, e viene ancora da nord-est. Che
      cosa sia Cerya non lo sa, e lo dice davanti a tutto il villaggio.

      {natura Difficile} Un muschio che cresce dove il suono non si ferma mai,
      e che chiude le orecchie meglio della cera. Le piante di Tuarmir
      imparano in fretta quello che serve.

      {empatia Media} È stanca. Ha retto il villaggio per tutta la stagione con
      una frase sola, e adesso quella frase può riposare.

      «Tienilo per quando sentirai la stessa nota da un'altra parte» ti dice
      a voce bassissima. *Lo dice come se sapesse che succederà.* Maela ti
      porge la lancia.

      {origine accolito-del-velo} In Cattedrale le vestizioni si fanno davanti
      all'altare con il coro. Qui ci sono un fabbro e una ragazza con le dita
      fasciate, e ti sembra una cerimonia più seria.
    opzioni:
      - testo: "Prendere la lancia dalle mani di Maela"
        descrizione: "Il dente fischia nel vento, una nota sola. Maela lo ha tenuto per una notte, e adesso lo dà a te."
        esito:
          titolo: Orecchio del vento
          testo: |
            Prendi la lancia dalle mani di Maela, e il dente fischia nel vento
            della gola una nota sola, sempre la stessa. Il villaggio batte piano
            il palmo sul ginocchio, tutte le soglie insieme. Cerya ti chiama
            Orecchio del vento, che a Tuarmir è un nome da raccoglitore vecchio,
            e Ilenia ti mette in mano la borsa della Sella, pesante.
          pe: { armi-da-mischia: 5 }
          almeno: { rep.tuarmir: 10 }
          imposta: { tuarmir.dente: 0, tuarmir.lettera: 0 }
          effetti: { fazione.tuarmir: 1, oggetto.tuarmir-lancia-del-pettine: 1, dono.tuarmir: 1, monete: 250 }
      - testo: "Chiederle che cosa pensa che sia il vento"
        descrizione: "Ha detto che non lo sa. Ma una cieca che sente i venti da sessant'anni qualcosa pensa, anche quando non sa."
        prova: { attributo: sociale, abilita: empatia, difficolta: Media }
        successo:
          titolo: Il mare
          testo: |
            Cerya ci pensa a lungo, con la faccia verso il crinale. Di quel
            vento sa soltanto che porta odore di sale e fa sognare il mare, e
            il resto lo dirà chi ci va. Poi Maela ti porge la lancia, e il
            dente fischia nel vento della gola. Cerya ti chiama Orecchio del
            vento, e Ilenia ti mette in mano la borsa della Sella, pesante.
          pe: { empatia: 5 }
          almeno: { rep.tuarmir: 10 }
          imposta: { tuarmir.dente: 0, tuarmir.lettera: 0 }
          effetti: { fazione.tuarmir: 1, oggetto.tuarmir-lancia-del-pettine: 1, dono.tuarmir: 1, monete: 250 }
        fallimento:
          titolo: La domanda davanti a tutti
          testo: |
            La domanda ti esce troppo alta, davanti a tutto il villaggio, e
            Cerya gira la faccia verso il crinale senza rispondere. Maela ti
            porge la lancia, e il dente fischia. Cerya ti chiama Orecchio del
            vento lo stesso, e Ilenia ti mette in mano la borsa della Sella.
          pe: { empatia: 3 }
          almeno: { rep.tuarmir: 10 }
          imposta: { tuarmir.dente: 0, tuarmir.lettera: 0 }
          effetti: { fazione.tuarmir: 1, oggetto.tuarmir-lancia-del-pettine: 1, dono.tuarmir: 1, monete: 250, scandalo: 0.5 }
      - testo: "Provare la lancia nel vento della gola"
        descrizione: "Una lancia nuova si prova. Il dente del Pettine è più pesante in punta di quanto sembri."
        prova: { attributo: fisico, abilita: armi-da-mischia, difficolta: Media }
        successo:
          titolo: La nota
          testo: |
            Fai roteare piano la lancia nello slargo, e il dente fischia nel
            vento una nota che rimbalza da una parete all'altra della gola. I
            bambini sulle soglie la imitano. Cerya ti chiama Orecchio del
            vento, che a Tuarmir è un nome da raccoglitore vecchio, e Ilenia
            ti mette in mano la borsa della Sella, pesante.
          pe: { armi-da-mischia: 5 }
          almeno: { rep.tuarmir: 10 }
          imposta: { tuarmir.dente: 0, tuarmir.lettera: 0 }
          effetti: { fazione.tuarmir: 1, oggetto.tuarmir-lancia-del-pettine: 1, dono.tuarmir: 1, monete: 250 }
        fallimento:
          titolo: La punta pesante
          testo: |
            La punta è più pesante di quanto pensavi, e alla prima rotazione la
            lancia ti tira il braccio e si pianta nel muschio di una soglia. Il
            villaggio finge di non vedere. Cerya ti chiama Orecchio del vento lo
            stesso, e Ilenia ti mette in mano la borsa della Sella.
          pe: { armi-da-mischia: 3 }
          almeno: { rep.tuarmir: 10 }
          imposta: { tuarmir.dente: 0, tuarmir.lettera: 0 }
          effetti: { fazione.tuarmir: 1, oggetto.tuarmir-lancia-del-pettine: 1, dono.tuarmir: 1, monete: 250, scandalo: 0.5 }
      - testo: "Lasciare che Alenna scriva il tuo nome nel quaderno"
        descrizione: "Nel quaderno delle foglie ci sono le date e le misure. Alenna ha lasciato una riga in fondo."
        quando: [velo.alenna == 2]
        esito:
          titolo: La riga in fondo
          testo: |
            Alenna apre il quaderno delle foglie all'ultima pagina e scrive il
            tuo nome sotto la mappa di Maela, nella sua grafia dritta. Accanto
            mette la data, e incolla una foglia di salvia grigia. Maela ti
            porge la lancia, e il dente fischia. Cerya ti chiama Orecchio del
            vento, e Ilenia ti mette in mano la borsa della Sella, pesante.
          pe: { resilienza: 5 }
          almeno: { rep.tuarmir: 10 }
          imposta: { tuarmir.dente: 0, tuarmir.lettera: 0 }
          effetti: { fazione.tuarmir: 1, oggetto.tuarmir-lancia-del-pettine: 1, dono.tuarmir: 1, monete: 250 }
      - testo: "Chiederle se la nota è la stessa della porta di sotto"
        descrizione: "Nella gola di sotto, dalla porta nella parete liscia, il vento esce con un fischio sottile. Lei li ha sentiti tutti e due."
        quando: [fazione.velo >= 11]
        esito:
          titolo: Due fischi
          testo: |
            Cerya sorride appena. Secondo lei il fischio della porta di sotto
            è più alto e quello della grata più basso, e fra i due c'è tutta
            la montagna. Poi Maela ti porge la lancia, e il dente fischia una
            terza nota. Cerya ti chiama Orecchio del vento, e Ilenia ti mette
            in mano la borsa della Sella, pesante.
          pe: { natura: 5 }
          almeno: { rep.tuarmir: 10 }
          imposta: { tuarmir.dente: 0, tuarmir.lettera: 0 }
          effetti: { fazione.tuarmir: 1, oggetto.tuarmir-lancia-del-pettine: 1, dono.tuarmir: 1, monete: 250 }
