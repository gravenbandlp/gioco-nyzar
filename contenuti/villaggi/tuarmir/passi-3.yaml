# La quest di Tuarmir, Atto V (fazione.tuarmir 12 → 15).
# - 12 → 13 `tuarmir-le-lettere-nel-cassetto` (Cattedrale del Velo): Padre Aurelio Vantes tira fuori dal cassetto le
#   lettere di Sorella Alenna (fazioni/velo/passi-2.yaml: «le ho messe in un cassetto») e scrive per Tuarmir la
#   lettera che rifiuta tutto quello che cresce sulla Sella (tuarmir.lettera). Con velo.alenna 1 Alenna è in
#   Cattedrale, e un'opzione la fa chiamare.
# - 13 → 14 `tuarmir-la-raccolta-di-ruvo` (boss): Ruvo Gessan e sei braccianti raschiano i funghi grigi intorno alla
#   grata, saliti seguendo i nastri di Maela. Combattimento o vie Difficili; chi fallisce resta al passo 13 e paga.
#   Lonn Var resta il mercante delle erbe di Tuarmir (la gola di sotto del Velo lo mostra ancora con il mulo).
# - 14 → 15 `tuarmir-il-dono-del-vento` (grado 5, Orecchio del vento): nell'ora di sole Cerya dà la lancia del Pettine
#   e il muschio sordo, che cresce dove la grata ronza (dono.tuarmir). Il vento viene ancora da nord-est, e nessuno sa
#   che cosa sia.
storylet:
  # ------------------------------------------------------------ 12 → 13 · le lettere nel cassetto
  - id: tuarmir-le-lettere-nel-cassetto
    presso: cattedrale-del-velo
    immagine: personaggi/padre-vantes
    titolo: Le lettere nel cassetto
    sommario: "Con la mappa di Maela e un fungo grigio vai da Padre Aurelio Vantes, perché il Velo compra le erbe di Tuarmir."
    luogo: Cattedrale del Velo, la sagrestia
    area: quartieri-alti
    requisiti: [fazione.tuarmir == 12]
    testo: |
      Madre Cerya ti ha mandato in città con la mappa di Maela e un fungo
      grigio in un vasetto, perché quello che il Velo rifiuta a Tuarmir
      smettono di raccoglierlo. Padre Aurelio Vantes ti riceve in sagrestia e
      ascolta senza interromperti la storia della Sella, del giovedì di casa
      Brenn e del carico promesso da Lonn Var.

      Poi apre un cassetto dell'armadio più vecchio e tira fuori un pacco di
      lettere di Sorella Alenna legate con lo spago, e le ultime hanno le
      righe storte. «Le avevo messe qui» dice, e non aggiunge il perché.

      {empatia Media} Tiene le lettere con tutte e due le mani, come una cosa
      di cui vergognarsi. Quel cassetto l'ha chiuso lui, e lo sa.

      {origine accolito-del-velo} La sagrestia odora di cera vergine come
      quando ci portavi i ceri da novizio, ma quel cassetto non l'avevi mai
      visto aperto.
    opzioni:
      - testo: "Mettergli la mappa di Maela accanto alle lettere"
        descrizione: "Le misure di Alenna e i nastri di Maela dicono la stessa cosa in due modi."
        prova: { attributo: mentale, abilita: accademiche, difficolta: Media }
        successo:
          titolo: Le misure
          testo: |
            Con le lettere accanto alla mappa, mese per mese, i numeri di Alenna e
            le frecce di Maela tornano fino all'ultima riga. Vantes scrive per la
            gente di Tuarmir che la Cattedrale non compra niente che sia cresciuto
            sulla Sella, nemmeno da chi lo vende ad altri, e ci mette il sigillo
            del Velo.
          pe: { accademiche: 3 }
          effetti: { fazione.tuarmir: 1, tuarmir.lettera: 1, rep.tuarmir: 0.5 }
        fallimento:
          titolo: La mappa al contrario
          testo: |
            Srotoli la mappa al contrario, con la Sella in basso, e Vantes la gira
            e confronta lui i numeri. Poi scrive per la gente di Tuarmir che la
            Cattedrale non compra niente che sia cresciuto sulla Sella, e ci mette
            il sigillo.
          effetti: { fazione.tuarmir: 1, tuarmir.lettera: 1, scandalo: 0.5 }
      - testo: "Chiedergli di leggerle adesso, davanti a te"
        descrizione: "Le lettere sono rimaste chiuse in un cassetto per mesi, e leggerle davanti a qualcuno è più difficile."
        prova: { attributo: sociale, abilita: [empatia, persuasione], difficolta: Media }
        successo:
          titolo: Le righe storte
          testo: |
            Vantes legge le lettere in piedi e si siede quando arriva a quelle con
            le righe storte. Poi scrive che la Cattedrale non compra niente che
            sia cresciuto sulla Sella, nemmeno da chi lo vende ad altri, e ti
            consegna la lettera sigillata senza guardarti.
          pe: { empatia: 3 }
          effetti: { fazione.tuarmir: 1, tuarmir.lettera: 1, rep.tuarmir: 0.5 }
        fallimento:
          titolo: Il cassetto
          testo: |
            Vantes rimette le lettere nel cassetto, offeso dal tuo tono, ma alla
            fine scrive che la Cattedrale non compra niente che sia cresciuto
            sulla Sella e ti consegna la lettera sigillata.
          effetti: { fazione.tuarmir: 1, tuarmir.lettera: 1, tormento: 0.5 }
      - testo: "Convincerlo che il Velo deve rifiutare i funghi della Sella"
        descrizione: "Senza il Velo, a Lonn Var restano soltanto i salotti, che da soli non pagano sei braccianti."
        prova: { attributo: sociale, abilita: [persuasione, politica-ed-economia], difficolta: Media }
        successo:
          titolo: Il rifiuto
          testo: |
            Vantes capisce al primo giro il conto di Lonn Var, quello che vende al
            Velo e quello che vende ai salotti. Scrive che la Cattedrale non
            compra niente che sia cresciuto sulla Sella, nemmeno da chi lo vende
            ad altri, e ti benedice sulla porta.
          pe: { persuasione: 3 }
          effetti: { fazione.tuarmir: 1, tuarmir.lettera: 1, rep.tuarmir: 0.5 }
        fallimento:
          titolo: Il cronista
          testo: |
            Ti perdi nei conti, e il cronista delle forniture te li fa ripetere
            due volte con gli occhi al soffitto. Alla fine la lettera sigillata
            arriva lo stesso, e la Cattedrale non comprerà niente che sia
            cresciuto sulla Sella.
          effetti: { fazione.tuarmir: 1, tuarmir.lettera: 1, scandalo: 0.5 }
      - testo: "Aspettare che finisca il vespro"
        descrizione: "Vantes ha il vespro, e dopo il vespro le confessioni."
        costo: 2
        esito:
          titolo: Dopo il vespro
          testo: |
            Aspetti finché i ceri sono consumati a metà, e Vantes torna con gli
            occhi rossi, perché le lettere le ha lette. Scrive che la Cattedrale
            non compra niente che sia cresciuto sulla Sella, e ci mette il sigillo
            del Velo.
          pe: { resilienza: 3 }
          effetti: { fazione.tuarmir: 1, tuarmir.lettera: 1, rep.tuarmir: 0.5 }
      - testo: "Presentargli la cosa nella forma delle suppliche"
        descrizione: "In Cattedrale le richieste al sommo sacerdote si fanno nella forma della supplica, e Vantes risponde meglio a quella."
        quando: [origine.accolito-del-velo >= 1]
        esito:
          titolo: La supplica
          testo: |
            Vantes riconosce la supplica e risponde nella forma, che è un sì.
            Scrive che la Cattedrale non compra niente che sia cresciuto sulla
            Sella e ti posa la mano sulla testa.
          pe: { accademiche: 3 }
          effetti: { fazione.tuarmir: 1, tuarmir.lettera: 1, rep.tuarmir: 0.5 }
      - testo: "Far chiamare Sorella Alenna dal chiostro"
        descrizione: "Alenna è tornata in Cattedrale, e le lettere le spiega meglio di chiunque."
        quando: [velo.alenna == 1]
        esito:
          titolo: Sorella Alenna
          testo: |
            Alenna arriva dal chiostro, vede il pacco sul tavolo e si ferma sulla
            soglia. Poi legge a Vantes le sue lettere a voce bassa, con la mappa
            di Maela davanti, e Vantes scrive che la Cattedrale non compra niente
            che sia cresciuto sulla Sella.
          pe: { empatia: 3 }
          effetti: { fazione.tuarmir: 1, tuarmir.lettera: 1, rep.tuarmir: 0.5 }

  # ------------------------------------------------------------ 13 → 14 · la raccolta di Ruvo (boss)
  - id: tuarmir-la-raccolta-di-ruvo
    presso: tuarmir
    immagine: ambientazione/tuarmir
    titolo: La raccolta di Ruvo
    sommario: "Ruvo Gessan è salito alla Sella con sei braccianti, seguendo i nastri di Maela, a raschiare i funghi grigi."
    luogo: Tuarmir, poi la Sella
    area: superficie-fratturata
    requisiti: [fazione.tuarmir == 13]
    testo: |
      Quando torni a Tuarmir con la lettera di Vantes, nello slargo c'è il
      mulo di Lonn Var carico di sacchi vuoti, e Lonn Var ti saluta con tutti
      i denti. Ilenia ti viene incontro di corsa, e a Tuarmir nessuno corre.
      Ruvo Gessan è salito alla Sella stanotte con sei braccianti della piana,
      seguendo i nastri di Maela.

      Arrivi alla Sella a metà mattina. Intorno alla grata i braccianti
      raschiano i funghi grigi dalla crosta di sale e li buttano nei sacchi
      con il nastro viola, e il Pettine è ribaltato fuori dalla rotaia con i
      denti al cielo. In mezzo a loro Ruvo tiene un pungolo ferrato da
      mulattiere, con una fila di fiale alla cintura. Ti vede e sputa la
      resina di lato. «Il padrone ha pagato la giornata» dice. «La giornata
      finisce quando è sera.»

      {intimidire Media} I braccianti guardano te e poi Ruvo. Sono pagati a
      giornata, e nessuno di loro vuole morire per un sacco di funghi.

      {armi-da-mischia Difficile} Ruvo tiene il pungolo come una lancia corta,
      con la mano dietro bassa. Ha fatto la scorta alle carovane, e il
      mestiere l'ha imparato bene.

      La grata ronza sotto i piedi dei braccianti. *I nastri di Maela, seguiti
      dalle persone sbagliate.*

      {origine fuggiasco-di-ghoran} A Ghoran il pungolo si usava sulle bestie
      e su quelli come te.
    opzioni:
      - testo: "Affrontare Ruvo Gessan"
        descrizione: "È grande e sa usare il pungolo, e le fiale alla cintura servono a qualcosa."
        combattimento: tuarmir-ruvo
        vittoria:
          titolo: Il pungolo spezzato
          testo: |
            Ruvo va giù sulla crosta di sale con il pungolo spezzato, e i
            braccianti lasciano i sacchi e scendono senza voltarsi. In fondo alla
            scala grande Lonn Var legge la lettera di Vantes a voce alta, ridendo
            meno del solito. La Sella, dice, è di Madre Cerya, e lui le erbe le ha
            sempre comprate in basso.
          pe: { armi-da-mischia: 5 }
          effetti: { fazione.tuarmir: 1, rep.tuarmir: 1 }
        sconfitta:
          titolo: Le fiale
          testo: |
            Una fiala ti si rompe sul petto, e il fumo dolciastro ti appesantisce
            le braccia finché il pungolo di Ruvo ti trova sotto le costole. Scendi
            a Tuarmir tenendoti il fianco.
          effetti: { tormento: 0.5 }
      - testo: "Leggere ai braccianti la lettera di Vantes"
        descrizione: "Se il Velo non compra i funghi della Sella, chi li raccoglie lavora per niente."
        prova: { attributo: sociale, abilita: persuasione, difficolta: Difficile }
        successo:
          titolo: Il sigillo
          testo: |
            Alla parola *Cattedrale* due braccianti si tolgono la maschera, e
            scendono tutti senza i sacchi. Ruvo, rimasto solo, li segue sputando
            la resina. In fondo alla scala grande Lonn Var legge la lettera e ride
            meno del solito. La Sella, dice, è di Madre Cerya.
          pe: { persuasione: 5 }
          effetti: { fazione.tuarmir: 1, rep.tuarmir: 1 }
        fallimento:
          titolo: Le risate
          testo: |
            Il vento ti porta via metà delle parole, e i braccianti il sigillo non
            lo sanno leggere. Ruvo ti spinge fuori dalla grata con il pungolo e ti
            consiglia di tornare quando avrai imparato a gridare.
          effetti: { scandalo: 1, ferite: 0.5 }
      - testo: "Trascinarlo sulla grata, dove il ronzio è più forte"
        descrizione: "Chi non è abituato alle sbarre, sulla grata perde l'equilibrio e la voglia di combattere."
        prova: { attributo: fisico, abilita: rissa, difficolta: Difficile }
        successo:
          titolo: Il ronzio
          testo: |
            Sulle sbarre il ronzio sale dai piedi fino ai denti, e Ruvo si piega e
            lascia il pungolo con la faccia grigia. I braccianti scendono con lui,
            senza i sacchi. In fondo alla scala grande Lonn Var legge la lettera
            di Vantes e ride meno del solito. La Sella, dice, è di Madre Cerya.
          pe: { rissa: 5 }
          effetti: { fazione.tuarmir: 1, rep.tuarmir: 1 }
        fallimento:
          titolo: Il gomito
          testo: |
            Ruvo ti aspetta con il gomito, e sulla grata finisci tu, con il ronzio
            nelle ossa e il naso che sanguina.
          effetti: { ferite: 1 }
      - testo: "Leggere la lettera con la voce del pulpito"
        descrizione: "In Cattedrale ti hanno insegnato a leggere gli interdetti in modo che li senta anche l'ultima fila."
        quando: [origine.accolito-del-velo >= 1]
        prova: { attributo: mentale, abilita: accademiche, difficolta: Difficile }
        successo:
          titolo: L'interdetto
          testo: |
            La tua voce da pulpito passa sopra il ronzio, e i braccianti si fanno
            il segno dell'Albero e posano i sacchi, con Ruvo che li segue giù in
            silenzio. In fondo alla scala grande Lonn Var legge la lettera e ride
            meno del solito. La Sella, dice, è di Madre Cerya.
          pe: { accademiche: 5 }
          effetti: { fazione.tuarmir: 1, rep.tuarmir: 1 }
        fallimento:
          titolo: Il pulpito
          testo: |
            Alla seconda riga senti anche tu quanto suona ridicola la voce del
            pulpito sulla Sella. Ruvo ti scosta dalla grata con il pungolo, come
            si scosta un mulo.
          effetti: { scandalo: 1, ferite: 0.5 }

  # ------------------------------------------------------------ 14 → 15 · il dono del vento (grado 5)
  - id: tuarmir-il-dono-del-vento
    presso: tuarmir
    immagine: ambientazione/tuarmir
    titolo: Il dono del vento
    sommario: "Nell'ora di sole il villaggio esce sulle soglie tutto insieme, e Madre Cerya ha qualcosa per te."
    luogo: Tuarmir, lo slargo, nell'ora di sole
    area: superficie-fratturata
    requisiti: [fazione.tuarmir == 14]
    testo: |
      Nell'ora di sole il villaggio esce sulle soglie tutto insieme, e stavolta
      nessuno chiacchiera. Nello slargo il fabbro che ferra i muli di Lonn Var
      ha montato il dente del Pettine su un'asta di frassino, e Maela la tiene
      in piedi con le dita ancora fasciate. Madre Cerya ha in mano un sacchetto
      di tela con dentro un muschio grigioverde, fine come capelli.

      «Cresce soltanto intorno alla grata, dove il ronzio non smette mai» dice.
      «Chi raccoglie lassù se lo mette nelle orecchie, e il ronzio non lo sente
      più.» Te lo posa sul palmo e ti chiude le dita sopra. Il vento sale
      ancora verso la Sella da nord-est, e Cerya dice davanti a tutto il
      villaggio che non sa che cosa sia.

      {empatia Media} È stanca. Ha retto il villaggio per tutta la stagione con
      una frase sola, e adesso quella frase può riposare.

      «Tienilo per quando sentirai la stessa nota da un'altra parte» ti dice a
      voce bassissima. *Lo dice come se sapesse che succederà.*

      {origine accolito-del-velo} In Cattedrale le vestizioni si fanno
      all'altare con il coro, eppure questa, davanti a un fabbro, ti sembra più
      seria.
    opzioni:
      - testo: "Prendere la lancia dalle mani di Maela"
        descrizione: "Il dente fischia nel vento una nota sola, e Maela adesso lo dà a te."
        esito:
          titolo: Orecchio del vento
          testo: |
            Il dente fischia nel vento della gola, e il villaggio batte piano il
            palmo sul ginocchio. Cerya ti chiama Orecchio del vento, che a Tuarmir
            è un nome da raccoglitore vecchio, e Ilenia ti mette in mano la borsa
            della Sella, pesante.
          pe: { armi-da-mischia: 5 }
          almeno: { rep.tuarmir: 10 }
          imposta: { tuarmir.dente: 0, tuarmir.lettera: 0 }
          effetti: { fazione.tuarmir: 1, oggetto.tuarmir-lancia-del-pettine: 1, dono.tuarmir: 1, monete: 250 }
      - testo: "Chiederle che cosa pensa che sia il vento"
        descrizione: "Una cieca che sente i venti da sessant'anni qualcosa pensa, anche quando non sa."
        prova: { attributo: sociale, abilita: empatia, difficolta: Media }
        successo:
          titolo: Il mare
          testo: |
            Di quel vento Cerya sa soltanto che porta odore di sale e fa sognare
            il mare, e il resto lo dirà chi ci va. Maela ti porge la lancia, Cerya
            ti chiama Orecchio del vento, e Ilenia ti mette in mano la borsa della
            Sella.
          pe: { empatia: 5 }
          almeno: { rep.tuarmir: 10 }
          imposta: { tuarmir.dente: 0, tuarmir.lettera: 0 }
          effetti: { fazione.tuarmir: 1, oggetto.tuarmir-lancia-del-pettine: 1, dono.tuarmir: 1, monete: 250 }
        fallimento:
          titolo: La domanda davanti a tutti
          testo: |
            La domanda ti esce troppo alta, e Cerya gira la faccia verso il
            crinale senza rispondere. Maela ti porge la lancia, Cerya ti chiama
            Orecchio del vento lo stesso, e Ilenia ti mette in mano la borsa della
            Sella.
          pe: { empatia: 3 }
          almeno: { rep.tuarmir: 10 }
          imposta: { tuarmir.dente: 0, tuarmir.lettera: 0 }
          effetti: { fazione.tuarmir: 1, oggetto.tuarmir-lancia-del-pettine: 1, dono.tuarmir: 1, monete: 250, scandalo: 0.5 }
      - testo: "Provare la lancia nel vento della gola"
        descrizione: "Il dente del Pettine è più pesante in punta di quanto sembri."
        prova: { attributo: fisico, abilita: armi-da-mischia, difficolta: Media }
        successo:
          titolo: La nota
          testo: |
            Il dente fischia una nota che rimbalza da una parete all'altra della
            gola, e i bambini sulle soglie la imitano. Cerya ti chiama Orecchio
            del vento, un nome da raccoglitore vecchio, e Ilenia ti mette in mano
            la borsa della Sella.
          pe: { armi-da-mischia: 5 }
          almeno: { rep.tuarmir: 10 }
          imposta: { tuarmir.dente: 0, tuarmir.lettera: 0 }
          effetti: { fazione.tuarmir: 1, oggetto.tuarmir-lancia-del-pettine: 1, dono.tuarmir: 1, monete: 250 }
        fallimento:
          titolo: La punta pesante
          testo: |
            Alla prima rotazione la lancia ti tira il braccio e si pianta nel
            muschio di una soglia, e il villaggio finge di non vedere. Cerya ti
            chiama Orecchio del vento lo stesso, e Ilenia ti mette in mano la
            borsa della Sella.
          pe: { armi-da-mischia: 3 }
          almeno: { rep.tuarmir: 10 }
          imposta: { tuarmir.dente: 0, tuarmir.lettera: 0 }
          effetti: { fazione.tuarmir: 1, oggetto.tuarmir-lancia-del-pettine: 1, dono.tuarmir: 1, monete: 250, scandalo: 0.5 }
      - testo: "Lasciare che Alenna scriva il tuo nome nel quaderno"
        descrizione: "Nel quaderno delle foglie Alenna ha lasciato una riga in fondo."
        quando: [velo.alenna == 2]
        esito:
          titolo: La riga in fondo
          testo: |
            Alenna scrive il tuo nome sotto la mappa di Maela, nella sua grafia
            dritta, e incolla accanto una foglia di salvia grigia. Maela ti porge
            la lancia, Cerya ti chiama Orecchio del vento, e Ilenia ti mette in
            mano la borsa della Sella.
          pe: { resilienza: 5 }
          almeno: { rep.tuarmir: 10 }
          imposta: { tuarmir.dente: 0, tuarmir.lettera: 0 }
          effetti: { fazione.tuarmir: 1, oggetto.tuarmir-lancia-del-pettine: 1, dono.tuarmir: 1, monete: 250 }
      - testo: "Chiederle se la nota è la stessa della porta di sotto"
        descrizione: "Nella gola di sotto, dalla porta nella parete liscia, il vento esce con un fischio sottile."
        quando: [fazione.velo >= 11]
        esito:
          titolo: Due fischi
          testo: |
            Il fischio della porta di sotto è più alto e quello della grata più
            basso, ti spiega Cerya sorridendo appena, e in mezzo c'è tutta la
            montagna. Maela ti porge la lancia, Cerya ti chiama Orecchio del
            vento, e Ilenia ti mette in mano la borsa della Sella.
          pe: { natura: 5 }
          almeno: { rep.tuarmir: 10 }
          imposta: { tuarmir.dente: 0, tuarmir.lettera: 0 }
          effetti: { fazione.tuarmir: 1, oggetto.tuarmir-lancia-del-pettine: 1, dono.tuarmir: 1, monete: 250 }
