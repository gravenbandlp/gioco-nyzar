# Gli oggetti della quest di Tuarmir, uno per grado (il grado 2 è un servizio: il seccatoio al prezzo di casa).
# - Grado 1 (passo 3): la maschera d'erbe, cucita da Cerya con le erbe scelte per te (accessorio +1, Schermata,
#   Riconoscibile: a Tuarmir e fra chi compra le erbe la riconoscono tutti).
# - Grado 3 (passo 9): la roncola della raccolta (pugnale +2: un dado e un Talento in Natura).
# - Grado 4 (passo 12): il mantello di muschio di chi sale alla Sella (cuoio rinforzato +3: un dado, Lucida).
# - Grado 5 (passo 15): la lancia del Pettine, oggetto unico di grado 4. Il fabbro del villaggio ha montato su un'asta
#   di frassino il dente di metallo che Maela ha portato giù dalla grata (tuarmir.dente). Fischia nel vento, quindi è
#   Rumorosa.
oggetti:
  - id: tuarmir-maschera-d-erbe
    nome: Maschera d'erbe di Tuarmir
    immagine: icone/gas-mask
    descrizione: "Due strati di tela grigia cuciti a punti piccoli come chicchi di riso, con la tua miscela d'erbe in mezzo. Fa lacrimare il primo giorno, poi trattiene le spore e un poco della Marea. Chi compra erbe la riconosce a dieci passi."
    slot: accessorio
    grado: 1
    proprieta: { schermata: true }
    difetti: [riconoscibile]

  - id: tuarmir-roncola-della-raccolta
    nome: Roncola della raccolta
    immagine: icone/sickle
    descrizione: "Un coltello ricurvo con il manico di corno e la lama affilata sulla parte interna, quello con cui a Tuarmir si taglia sopra il primo nodo dello stelo. Cerya lo dà a chi ha il permesso di salire alla Sella."
    slot: arma
    base: pugnale
    grado: 2
    dadi: 1
    proprieta: { talento: { natura: 1 } }

  - id: tuarmir-mantello-di-muschio
    nome: Mantello di muschio
    immagine: icone/cloak
    descrizione: "Cuoio grosso coperto di muschio di gola cucito a ciuffi, che resta vivo finché lo bagni. Nel vento della Sella tiene caldo, e chi lo porta fa sogni più quieti degli altri."
    slot: armatura
    base: cuoio-rinforzato
    grado: 3
    dadi: 1
    proprieta: { lucida: true }

  - id: tuarmir-lancia-del-pettine
    nome: Lancia del Pettine
    immagine: icone/barbed-spear
    descrizione: "Un dente di metallo dei Precursori, lungo come un avambraccio, montato su un'asta di frassino dal fabbro di Tuarmir. Non si arrugginisce e non si smussa, taglia le corazze come la tela, e nel vento fischia una nota sola, sempre la stessa."
    slot: arma
    base: lancia
    grado: 4
    dadi: 2
    proprieta: { affilata: 1, penetrante: 1, rapida: 1 }
    difetti: [rumorosa]
