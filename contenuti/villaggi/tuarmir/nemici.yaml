# I nemici e gli scontri della quest di Tuarmir, tarati con `npx tsx scripts/simula-fine.ts tuarmir-`.
# - La gola alta (passo 11): le cesoie della Sella, macchinette che tagliano il muschio intorno alla grata (gregari,
#   sopra l'80% per il combattente di fine capitolo), e il Pettine al cuore, la macchina lunga che pettina la grata e
#   tratta come detrito tutto quello che ci sta sopra (boss, fra il 40 e il 60%).
# - La raccolta di Ruvo (passo 14): Ruvo Gessan, il capocarovana di Lonn Var, con il pungolo da mulattiere e le fiale
#   dei fumi d'erbe (boss finale della quest: fra il 40 e il 60% a fine capitolo, sopra l'80% a fine contenuti).
nemici:
  - id: tuarmir-cesoia
    immagine: bestiario/salvaguardia-precursori
    nome: Cesoia della Sella
    descrizione: "Una macchinetta dei Precursori bassa come un granchio, con due lame a forbice al posto delle chele. Corre sulle rocce intorno alla grata e taglia il muschio a filo della pietra, e anche le caviglie di chi ci cammina sopra."
    attacco: 4
    difesa: 4
    difesaMentale: 5
    pf: 6
    danno: 3
    riduzione: 2
    iniziativa: 3

  - id: tuarmir-pettine
    immagine: bestiario/salvaguardia-precursori
    nome: Il Pettine
    descrizione: "Una macchina lunga quanto la grata è larga, che corre su una rotaia nascosta nella roccia. Ha una fila di denti di metallo lunghi come un avambraccio, e con quelli pettina via dalla grata tutto quello che ci trova sopra."
    attacco: 5
    difesa: 4
    difesaMentale: 5
    pf: 14
    danno: 4
    riduzione: 3
    iniziativa: 2

  - id: tuarmir-ruvo-gessan
    immagine: icone/swap-bag
    nome: Ruvo Gessan
    descrizione: "Il capocarovana di Lonn Var, un uomo grande con la giubba da mulattiere che mastica resina e sputa di lato. Combatte con il pungolo ferrato come con una lancia, e alla cintura porta le fiale dei fumi d'erbe che Lonn Var vende ai salotti."
    attacco: 5
    difesa: 4
    difesaMentale: 3
    pf: 16
    danno: 4
    riduzione: 4
    iniziativa: 3
    magia: 4
    energia: 2
    incantesimi: [fumi-dell-erborista]

scontri:
  - { id: tuarmir-cesoie, nome: "Le cesoie della Sella", nemici: [tuarmir-cesoia, tuarmir-cesoia], feriteSconfitta: 2 }
  - { id: tuarmir-il-pettine, nome: "Il Pettine della grata", nemici: [tuarmir-pettine], feriteSconfitta: 4 }
  - { id: tuarmir-ruvo, nome: "La raccolta di Ruvo", nemici: [tuarmir-ruvo-gessan], feriteSconfitta: 3 }
