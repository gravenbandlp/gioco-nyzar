# La quest di Tuarmir, «Il vento nuovo» (fazione.tuarmir 0 → 15), blocco 4 di docs/piano-superficie.md. Qui la pista,
# la reputazione del villaggio, la voce della fazione con i cinque gradi e gli stati che le scene si passano.
# Il villaggio è un luogo della Superficie (luogo.yaml, con l'attività della raccolta e il servizio del seccatoio);
# gli storylet stanno in passi-1/2/3.yaml, la spedizione dell'Atto IV in spedizione-gola-alta.yaml.
# - Atto I «Voce bassa» (1-3, il primo passo chiede pista.arena >= 5): Ilenia e Madre Cerya, il vecchio Tamme e le due
#   spiegazioni delle visioni, la maschera cucita (grado 1, con le voci sul Forno della Nonna e sulle Stele).
# - Atto II «Il raccolto proibito» (4-6): il libro dei conti di Lonn Var e Fenno sparito, Fenno seduto sotto la Sella,
#   l'adunanza nella grotta grande dove Cerya lascia in pace la Sella (grado 2).
# - Atto III «Le lettere» (7-9): il quaderno delle foglie di Sorella Alenna (tre varianti secondo velo.alenna), la
#   polvere grigia in un salotto dei Quartieri Alti, la notte in cui il vento gira (il segno della Campana, grado 3).
# - Atto IV «La gola alta» (10-12): Maela sale da sola con i nastri, la spedizione fino alla grata della Sella
#   (passo 11), la mappa dei nastri e il consiglio sulla grata (grado 4).
# - Atto V «Il dono» (13-15): Padre Vantes e le lettere nel cassetto, Ruvo Gessan alla grata (boss), il dono di Cerya
#   (grado 5: la lancia del Pettine e dono.tuarmir).
# Varianti: velo.alenna (0 Alenna al riparo sotto la porta, 1 tornata in città, 2 rimasta con Cerya) con scene e
# opzioni separate; fazione.velo >= 11 (sei già sceso nella gola di sotto) e l'origine accolito-del-velo con `quando`.
# Nessun passo chiede uno stato che il giocatore può non avere.
# Nomi nuovi (in glossario.yaml quelli che tornano): Maela, la novizia che Cerya ha messo accanto ad Alenna; Fenno, il
# ragazzo pagato da Lonn Var; Ruvo Gessan, il capocarovana di Lonn Var. Minori, detti in una scena sola: il vecchio Tamme
# e sua moglie Dilla, la madre di Fenno, Ottavia Brenn padrona del salotto dei Quartieri Alti, il pastore della conca.
quality:
  - { id: fazione.tuarmir, immagine: ambientazione/tuarmir, nome: "Il vento nuovo", categoria: pista, descrizione: "Madre Cerya dice che il vento di Tuarmir ha cambiato strada, e che un forestiero con il naso pulito può capire da dove arriva. La pista si chiude a 15." }
  - { id: rep.tuarmir, immagine: icone/gas-mask, nome: Tuarmir, categoria: reputazione, famiglia: Luoghi, descrizione: "Quanto ti considerano di casa nelle case-grotta di Tuarmir, dove si parla a voce bassa e la raccolta la guida Madre Cerya." }
  - { id: tuarmir.cesto, nome: Il cesto di Fenno, categoria: stato, nascosta: true, descrizione: "1 se hai portato giù dalla Sella il cesto di funghi grigi che Fenno aveva raccolto per Lonn Var." }
  - { id: tuarmir.dente, immagine: icone/saw-claw, nome: Il dente del Pettine, categoria: stato, descrizione: "Un dente di metallo dei Precursori lungo come un avambraccio, spezzato dalla macchina che pettina la grata della Sella. Maela ci si è tenuta stretta per una notte intera." }
  - { id: tuarmir.lettera, immagine: icone/envelope, nome: La lettera di Padre Vantes, categoria: stato, descrizione: "Una lettera con il sigillo del Velo, scritta da Padre Aurelio Vantes per la gente di Tuarmir. Dice che la Cattedrale non compra niente che sia cresciuto sulla Sella." }

fazioni:
  - id: tuarmir
    nome: Tuarmir
    immagine: ambientazione/tuarmir
    reputazione: rep.tuarmir
    pista: fazione.tuarmir
    gradi:
      - { passo: 3, nome: Mano mascherata, ricompensa: "La maschera d'erbe cucita da Madre Cerya, una manciata di monete e le voci dei raccoglitori sul Forno della Nonna e sulle Stele dei Naviganti." }
      - { passo: 6, nome: Raccoglitore, ricompensa: "Il seccatoio ti tratta come uno di casa: i fumi di Cerya e gli unguenti della raccolta al prezzo del villaggio." }
      - { passo: 9, nome: Coltello della gola, ricompensa: "La roncola ricurva della raccolta e il permesso di salire alla Sella." }
      - { passo: 12, nome: Custode della Sella, ricompensa: "Il mantello di muschio che si cuce per chi sale sopra le case, e una borsa di monete." }
      - { passo: 15, nome: Orecchio del vento, ricompensa: "La lancia del Pettine, montata dal fabbro sul dente della grata, una borsa pesante e il muschio sordo di Madre Cerya, che servirà dove il vento porta." }
