# La gola alta di Tuarmir, spedizione del passo 11 della quest del villaggio (fazione.tuarmir == 10): sopra le case la
# gola sale fino alla Sella, dove il vento nuovo entra nella montagna da una grata dei Precursori. Non è la gola di
# sotto della quest del Velo (fazioni/velo/spedizione-gola.yaml), dove lo stesso vento esce dalle fenditure e dalla
# porta di Serad: qui si va in alto, dove entra. Maela è salita da sola a piantare i nastri di Sorella Alenna.
# L'ingresso (`tuarmir-sopra-la-croce`, presso Tuarmir) costa un rintocco in meno a cavallo. La ritirata riporta in
# Superficie. Le stanze chiedono tutte fazione.tuarmir == 10 e vanno in fasce di profondità; una stanza superata non
# ricompare nella stessa visita:
# 0 sopra la croce (le case vuote con le maschere vecchie; la scala delle capre), 1 i terrazzi abbandonati (le erbe
# grigie; le raffiche sulla cengia, che valgono anche a 2), 2 la conca dei pascoli (il pastore con le capre che non
# salgono; i due braccianti seduti con la faccia a nord-est; i nastri di Maela, che valgono anche a 3), 3 sotto la
# Sella (la crosta di sale con i funghi grigi; le cesoie che tagliano il muschio).
# Il cuore a 4 è la grata della Sella: il Pettine la pettina, e Maela ci si tiene incastrata con un dente spezzato.
# Batterlo, passargli sotto, fermarlo sulla rotaia o comandargli di fermarsi (vie Difficili) dà il passo,
# tuarmir.dente e qualche parte dei Precursori; chi fallisce torna in Superficie senza passo e con le Ferite.
aree:
  - id: tuarmir-gola-alta
    immagine: ambientazione/tuarmir
    nome: La gola alta
    sommario: "Sopra le ultime case di Tuarmir la gola sale stretta fino alla Sella, dove il vento nuovo entra nella montagna."
    spedizione: { ritorno: superficie-fratturata, soglia: 4, stanze: 3 }
    testo: |
      Sopra il sasso con la croce di calce la gola sale sempre più stretta,
      fra pareti che il muschio copre fino a metà, per un sentiero fatto dalle
      capre. Il vento sale con te senza fermarsi mai e a ogni svolta sa meno
      di muschio e più di sale, finché sulle pietre compare una crosta bianca.
      In cima, nella conca fra due cime, c'è la Sella.

storylet:
  # ------------------------------------------------------------ l'ingresso, sopra il villaggio
  - id: tuarmir-sopra-la-croce
    presso: tuarmir
    immagine: ambientazione/tuarmir
    titolo: Sopra la croce
    sommario: "Le impronte di Maela passano il sasso con la croce e salgono verso la Sella, e Ilenia si ferma lì."
    luogo: Tuarmir, il sasso con la croce sopra le case
    area: superficie-fratturata
    requisiti: [fazione.tuarmir == 10]
    testo: |
      Al sasso con la croce di calce Ilenia ti lega alla cintura la corda del
      seccatoio e ti mette in mano un fagotto con il pane e il muschio da
      masticare. «Riportala giù» dice, e si ferma lì. Nel muschio oltre il
      sasso ci sono le impronte piccole di Maela.

      {natura Media} Le impronte vanno dritte dove il sentiero gira largo. La
      ragazza ha camminato con il vento alle spalle, lasciandosi spingere
      verso la cima.

      {origine figlio-del-circolo} Al Circolo si dice che chi segue il vento
      arriva sempre da qualche parte, e di rado dove voleva.
    opzioni:
      - testo: "Seguire le impronte di Maela"
        descrizione: "Dove il muschio è schiacciato verso la cima, è passata lei."
        prova: { attributo: mentale, abilita: [percezione, natura], difficolta: Media }
        successo:
          titolo: Le impronte piccole
          testo: |
            Dove il muschio finisce trovi i buchi dei paletti di Maela, e dopo
            un'ora le case di Tuarmir sotto di te sono una fila di porte grigie.
          pe: { percezione: 2 }
          vai: tuarmir-gola-alta
        fallimento:
          titolo: Il muschio
          testo: |
            Perdi le impronte dove il muschio è più fitto e ci metti mezza mattina
            a ritrovarle.
          effetti: { tormento: 0.5 }
          vai: tuarmir-gola-alta
      - testo: "Salire di corsa finché c'è luce"
        descrizione: "Se la ragazza ha passato la notte lassù, ogni ora conta."
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Media }
        successo:
          titolo: Di corsa
          testo: |
            Sali due gradini alla volta, e quando ti volti il villaggio è già
            lontano.
          pe: { atletica: 2 }
          vai: tuarmir-gola-alta
        fallimento:
          titolo: La caviglia
          testo: |
            Una pietra coperta di muschio ti gira sotto il piede, e continui
            zoppicando, con meno fretta.
          effetti: { ferite: 0.5 }
          vai: tuarmir-gola-alta
      - testo: "Salire a cavallo per il sentiero delle capre"
        descrizione: "Il sentiero delle capre basta a una bestia da sella che non ha paura dei sassi."
        requisiti: [chiave.cavalcatura >= 1]
        costo: 0
        esito:
          titolo: Il sentiero delle capre
          testo: |
            La tua bestia sale con le orecchie basse, e dove il sentiero si
            stringe troppo la leghi a un pino storto e prosegui a piedi.
          vai: tuarmir-gola-alta
      - testo: "Salire piano, legato alla corda di Ilenia"
        descrizione: "Ilenia fa scorrere la corda dal sasso un tratto alla volta, e il vento ti entra nelle ossa."
        costo: 2
        esito:
          titolo: Un tratto alla volta
          testo: |
            Sali con la corda di Ilenia finché finisce, e ci hai messo il doppio,
            con il freddo nelle ossa.
          effetti: { ferite: 0.5 }
          vai: tuarmir-gola-alta

  # ------------------------------------------------------------ 0 · sopra la croce
  - id: tuarmir-gola-alta-le-maschere-vecchie
    immagine: ambientazione/tuarmir
    titolo: Le maschere vecchie
    sommario: "Sopra la croce ci sono le case-grotta di quando la Sella si raccoglieva, con le maschere di allora appese alle porte."
    luogo: La gola alta, le case vuote
    area: tuarmir-gola-alta
    ripetibile: true
    requisiti: [fazione.tuarmir == 10, profondita.tuarmir-gola-alta == 0]
    testo: |
      Sopra la croce ci sono sei case-grotta vuote, di quando la Sella si
      raccoglieva. A ogni porta è rimasta appesa una maschera grigia di
      muffa, che il vento fa battere contro il legno con un rumore di nocche,
      e una sola ha il nodo rifatto con uno spago nuovo.

      {percezione Media} Lo spago nuovo è rosso, tirato a due giri, lo stesso
      dei nastri che Maela tiene nel cesto.
    opzioni:
      - testo: "Guardare la maschera rifatta"
        descrizione: "Maela si è fermata qui, e forse ha lasciato qualcosa."
        prova: { attributo: mentale, abilita: percezione, difficolta: Media }
        successo:
          titolo: Il nastro rosso
          testo: |
            Dentro la maschera rifatta c'è il primo dei nastri rossi di Maela,
            teso dal vento verso la cima.
          pe: { percezione: 2 }
          effetti: { profondita.tuarmir-gola-alta: 1 }
        fallimento:
          titolo: La muffa
          testo: |
            Tiri giù la maschera sbagliata, e la muffa ti esplode in faccia in una
            nuvola grigia che ti fa tossire a lungo.
          effetti: { contaminazione: 0.5 }
      - testo: "Passare in fretta davanti alle porte"
        descrizione: "Le case sono vuote da anni, e basta non fermarsi ad ascoltare le maschere."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Media }
        successo:
          titolo: Sei porte
          testo: |
            Passi davanti alle sei porte contando i passi invece dei colpi, finché
            il rumore resta indietro.
          pe: { resilienza: 2 }
          effetti: { profondita.tuarmir-gola-alta: 1 }
        fallimento:
          titolo: I colpi
          testo: |
            Alla terza porta ti sembra che dentro qualcuno abbia bussato davvero,
            e aspetti per niente finché il vento cala.
          effetti: { tormento: 0.5 }
      - testo: "Staccare le maschere e lasciarle a terra"
        descrizione: "Senza le maschere le porte smettono di battere, ma la muffa vola."
        costo: 2
        esito:
          titolo: Le maschere a terra
          testo: |
            Stacchi le maschere una per una e le posi a terra sotto un sasso, e la
            gola ti raschia per tutta la salita.
          effetti: { profondita.tuarmir-gola-alta: 1, contaminazione: 0.5 }

  - id: tuarmir-gola-alta-la-scala-delle-capre
    immagine: ambientazione/tuarmir
    titolo: La scala delle capre
    sommario: "Il sentiero sale per una spaccatura nella parete, a gradini bagnati alti come un ginocchio."
    luogo: La gola alta, la spaccatura
    area: tuarmir-gola-alta
    ripetibile: true
    requisiti: [fazione.tuarmir == 10, profondita.tuarmir-gola-alta == 0]
    testo: |
      Il sentiero entra in una spaccatura della parete e sale a gradini alti
      come un ginocchio, consumati dalle capre, con l'acqua che scende lungo
      la roccia e il vento che le sale contro.

      {atletica Media} Si sale con le mani e con i piedi, fermandosi dove la
      spaccatura si allarga, o si arriva su senza forze.
    opzioni:
      - testo: "Salire con le mani e con i piedi"
        descrizione: "Gradino per gradino, con le dita nelle fessure."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Media }
        successo:
          titolo: Il ritaglio di cielo
          testo: |
            Sali con le dita nelle fessure, e in cima la spaccatura sbuca in una
            valletta di sassi dove il vento ti viene addosso intero.
          pe: { atletica: 2 }
          effetti: { profondita.tuarmir-gola-alta: 1 }
        fallimento:
          titolo: Il gradino bagnato
          testo: |
            Un gradino bagnato ti manda giù di tre, e riparti dal fondo della
            spaccatura con il gomito sbucciato.
          effetti: { ferite: 0.5 }
      - testo: "Cercare il passaggio delle capre"
        descrizione: "Dove sono passate le capre, la roccia è lucida."
        prova: { attributo: mentale, abilita: [natura, percezione], difficolta: Media }
        successo:
          titolo: La roccia lucida
          testo: |
            Il passaggio delle capre è una cengia lucida di zoccoli, più lunga ma
            asciutta.
          pe: { natura: 2 }
          effetti: { profondita.tuarmir-gola-alta: 1 }
        fallimento:
          titolo: Il vicolo delle capre
          testo: |
            La cengia che segui finisce in un buco dove le capre, a giudicare
            dall'odore, dormono. Torni indietro con gli stivali sporchi.
          effetti: { tormento: 0.5 }
      - testo: "Fissare la corda e tirarti su"
        descrizione: "Un nodo su uno spuntone in alto, e su a forza di braccia, a spese delle mani."
        costo: 2
        esito:
          titolo: A forza di braccia
          testo: |
            Lanci la corda su uno spuntone al terzo tentativo e ti tiri su, e in
            cima hai le mani spellate.
          effetti: { profondita.tuarmir-gola-alta: 1, ferite: 0.5 }

  # ------------------------------------------------------------ 1 · i terrazzi abbandonati
  - id: tuarmir-gola-alta-i-terrazzi-grigi
    immagine: ambientazione/tuarmir
    titolo: I terrazzi grigi
    sommario: "I terrazzi della vecchia raccolta sono ancora lì, con le erbe grigie piegate tutte verso la cima."
    luogo: La gola alta, i terrazzi abbandonati
    area: tuarmir-gola-alta
    ripetibile: true
    requisiti: [fazione.tuarmir == 10, profondita.tuarmir-gola-alta == 1]
    testo: |
      Dove la gola si allarga ci sono i terrazzi della vecchia raccolta, con i
      muretti mezzo crollati. La salvia e il cardo qui sono grigi fino alla
      nervatura e si piegano tutti verso la cima come grano sotto una mano, e
      il passaggio fra i muretti è stretto.

      {medicina Media} Sotto le foglie c'è la stessa polvere chiara che ha
      mandato in visione il vecchio Tamme, e qui ce n'è dieci volte tanto.
    opzioni:
      - testo: "Passare sul bordo dei muretti"
        descrizione: "Con un po' di equilibrio le erbe restano sotto i piedi, lontane dal naso."
        prova: { attributo: fisico, abilita: acrobazia, difficolta: Media }
        successo:
          titolo: Sul bordo
          testo: |
            Cammini sul bordo dei muretti con le braccia larghe, e le erbe grigie
            ti sfiorano appena gli stivali.
          pe: { acrobazia: 2 }
          effetti: { profondita.tuarmir-gola-alta: 1 }
        fallimento:
          titolo: In mezzo alla salvia
          testo: |
            Un sasso del muretto si muove e finisci nella salvia grigia, e per un
            poco vedi il terrazzo pieno d'acqua.
          effetti: { tormento: 0.5 }
      - testo: "Bagnare la maschera e attraversare dritto"
        descrizione: "La maschera bagnata trattiene la polvere, se si passa in fretta."
        prova: { attributo: fisico, abilita: resistenza, difficolta: Media }
        successo:
          titolo: La maschera bagnata
          testo: |
            Con la maschera bagnata nel rivolo attraversi a testa bassa, e
            dall'altra parte sputi l'erba amara insieme alla polvere.
          pe: { resistenza: 2 }
          effetti: { profondita.tuarmir-gola-alta: 1 }
        fallimento:
          titolo: La maschera asciutta
          testo: |
            A metà dei terrazzi la maschera si asciuga e la polvere passa la
            stoffa. Torni indietro con un sapore di sale in gola.
          effetti: { contaminazione: 0.5 }
      - testo: "Fare il giro lungo, per il ghiaione"
        descrizione: "Accanto ai terrazzi scende un ghiaione lento e scivoloso, lontano dalle erbe."
        costo: 2
        esito:
          titolo: Il ghiaione
          testo: |
            Risali il ghiaione di traverso per più di un'ora, e in cima hai le
            ginocchia sbucciate.
          effetti: { profondita.tuarmir-gola-alta: 1, ferite: 0.5 }

  - id: tuarmir-gola-alta-le-raffiche
    immagine: ambientazione/tuarmir
    titolo: Le raffiche
    sommario: "Una cengia corre a mezza parete, e il vento arriva a raffiche che tirano verso la montagna."
    luogo: La gola alta, la cengia
    area: tuarmir-gola-alta
    ripetibile: true
    requisiti: [fazione.tuarmir == 10, profondita.tuarmir-gola-alta >= 1, profondita.tuarmir-gola-alta <= 2]
    testo: |
      Il sentiero diventa una cengia a mezza parete, larga quanto due piedi
      messi di traverso. Il vento arriva a raffiche, ognuna più forte della
      precedente, e ti tira verso il vuoto e poi su per la gola, come una mano
      che ti prende per la manica.

      {percezione Media} Fra una raffica e l'altra passano sempre dodici
      battiti, e negli intervalli si può camminare.
    opzioni:
      - testo: "Camminare negli intervalli"
        descrizione: "Dodici battiti di calma e poi la raffica, da contare."
        prova: { attributo: mentale, abilita: percezione, difficolta: Media }
        successo:
          titolo: Dodici battiti
          testo: |
            Conti i battiti e cammini, e alla raffica ti schiacci contro la
            roccia. Alla decima la cengia si allarga in una conca d'erba.
          pe: { percezione: 2 }
          effetti: { profondita.tuarmir-gola-alta: 1 }
        fallimento:
          titolo: Il tredicesimo battito
          testo: |
            Una raffica arriva all'undicesimo battito e ti prende a metà del
            passo. Resti appeso al muschio con una mano e poi torni indietro.
          effetti: { ferite: 0.5 }
      - testo: "Passare con la schiena alla parete"
        descrizione: "Con i talloni sul vuoto e le spalle alla roccia, mentre il vento tira."
        prova: { attributo: fisico, abilita: [acrobazia, resistenza], difficolta: Media }
        successo:
          titolo: La schiena alla roccia
          testo: |
            Le raffiche ti tirano la maschera senza riuscire a staccarti dalla
            roccia, e la cengia si allarga in una conca.
          pe: { acrobazia: 2 }
          effetti: { profondita.tuarmir-gola-alta: 1 }
        fallimento:
          titolo: La manica
          testo: |
            Una raffica ti gira verso il vuoto, e ti salvi abbracciando uno
            spuntone. Torni indietro con le ginocchia molli.
          effetti: { tormento: 0.5 }
      - testo: "Legarti alla parete con la corda, a tratti"
        descrizione: "Un chiodo e un nodo per ogni tratto di cengia, e poi si ricomincia."
        costo: 2
        esito:
          titolo: A tratti
          testo: |
            Ti leghi alla parete tratto per tratto, e le raffiche ti sbattono
            contro la roccia per un pomeriggio intero.
          effetti: { profondita.tuarmir-gola-alta: 1, ferite: 0.5 }

  # ------------------------------------------------------------ 2 · la conca dei pascoli
  - id: tuarmir-gola-alta-il-pastore
    immagine: ambientazione/tuarmir
    titolo: Le capre che non salgono
    sommario: "In una conca d'erba un pastore tiene il gregge, e ha visto passare una ragazza con un cesto."
    luogo: La gola alta, la conca dei pascoli
    area: tuarmir-gola-alta
    ripetibile: true
    requisiti: [fazione.tuarmir == 10, profondita.tuarmir-gola-alta == 2]
    testo: |
      In una conca d'erba un pastore vecchio tiene con il bastone il gregge,
      che sta con il muso verso valle e ogni tanto prova a scendere. Il
      pastore guarda la tua maschera e sputa da una parte. Una ragazza con un
      cesto, dice, è passata ieri sera, e non è ancora scesa.

      {addestrare-animali Media} Le capre sono nervose per il vento. Una
      capra calma che va avanti se ne tira dietro altre dieci, e anche chi la
      segue.
    opzioni:
      - testo: "Farti prestare la capra più calma"
        descrizione: "Una capra che non ha paura sa dove si mettono i piedi lassù."
        prova: { attributo: sociale, abilita: addestrare-animali, difficolta: Media }
        successo:
          titolo: La capra con il campanaccio
          testo: |
            La capra con il campanaccio ti porta su per un sentiero nascosto fra i
            sassi, e poi torna giù dal pastore da sola.
          pe: { addestrare-animali: 2 }
          effetti: { profondita.tuarmir-gola-alta: 1 }
        fallimento:
          titolo: La capra testarda
          testo: |
            La capra ti trascina per tre passi e poi si pianta, e quando tiri ti
            dà una testata nel ginocchio.
          effetti: { ferite: 0.5 }
      - testo: "Farti dire da dove è salita"
        descrizione: "Bisogna convincere il pastore che non sei di Lonn Var."
        prova: { attributo: sociale, abilita: [empatia, persuasione], difficolta: Media }
        successo:
          titolo: La pietra con il buco
          testo: |
            Gli dici di Maela e di Cerya, e lui ti indica con il bastone una
            pietra con un buco in mezzo, in cima alla conca. Ti dà un pezzo di
            formaggio duro per lei.
          pe: { empatia: 2 }
          effetti: { profondita.tuarmir-gola-alta: 1 }
        fallimento:
          titolo: Quelli di Lonn Var
          testo: |
            Il pastore ti prende per uno di Lonn Var e ti gira le spalle. Dopo
            un'ora ti dice soltanto di guardare in alto.
          effetti: { tormento: 0.5 }
      - testo: "Salire da solo per il pendio"
        descrizione: "La conca ha un'uscita sola, in cima al pendio d'erba."
        costo: 2
        esito:
          titolo: Il pendio
          testo: |
            Sali il pendio con le mani sulle ginocchia fino alla pietra con il
            buco, e il gregge laggiù è una manciata di sassi bianchi.
          effetti: { profondita.tuarmir-gola-alta: 1, ferite: 0.5 }

  - id: tuarmir-gola-alta-i-seduti
    immagine: ambientazione/tuarmir
    titolo: I seduti
    sommario: "Due uomini con i sacchi di Lonn Var sono seduti nell'erba, con la faccia verso nord-est."
    luogo: La gola alta, la conca dei pascoli
    area: tuarmir-gola-alta
    ripetibile: true
    requisiti: [fazione.tuarmir == 10, profondita.tuarmir-gola-alta == 2]
    testo: |
      Sul bordo della conca due uomini sono seduti nell'erba con la maschera
      in grembo e la faccia verso nord-est. Hanno i sacchi vuoti con il
      nastro viola di Lonn Var e le labbra bianche di sale, braccianti della
      piana che nessuno è venuto a riprendere.

      {origine fuggiasco-di-ghoran} Gente comprata a giornata e lasciata dove
      si siede. A Ghoran li chiamavano i sacchi vuoti.
    opzioni:
      - testo: "Svegliarli e mandarli giù"
        descrizione: "Acqua, maschera, una mano sulla spalla, e la strada la sanno."
        prova: { attributo: mentale, abilita: medicina, difficolta: Media }
        successo:
          titolo: I sacchi vuoti
          testo: |
            Con l'acqua e le maschere il primo si sveglia e sveglia l'altro, e
            scendono tenendosi per mano, lasciando nell'erba i sacchi di Lonn Var.
          pe: { medicina: 2 }
          effetti: { profondita.tuarmir-gola-alta: 1 }
        fallimento:
          titolo: Il mare
          testo: |
            Il secondo ti tira giù accanto a lui, e per un poco guardi anche tu
            verso la cima prima di liberarti.
          effetti: { tormento: 0.5 }
      - testo: "Passare oltre senza guardare dove guardano"
        descrizione: "Hanno visto qualcosa, e conviene non vederla anche tu."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Media }
        successo:
          titolo: Gli occhi sui piedi
          testo: |
            Passi accanto ai due uomini con gli occhi sui piedi e ti prometti di
            mandarli a prendere.
          pe: { resilienza: 2 }
          effetti: { profondita.tuarmir-gola-alta: 1 }
        fallimento:
          titolo: Un'occhiata
          testo: |
            All'ultimo passo ti volti a guardare dove guardano loro, e quando ti
            riscuoti sei seduto nell'erba anche tu.
          effetti: { tormento: 0.5 }
      - testo: "Legarli insieme e trascinarli al riparo"
        descrizione: "Al riparo di una roccia il vento non arriva, e forse si svegliano da soli."
        costo: 2
        esito:
          titolo: Dietro la roccia
          testo: |
            Li trascini dietro una roccia e li leghi insieme perché non tornino a
            sedersi, e riparti con la schiena a pezzi.
          effetti: { profondita.tuarmir-gola-alta: 1, ferite: 0.5 }

  - id: tuarmir-gola-alta-i-nastri
    immagine: icone/windsock
    titolo: I nastri di Maela
    sommario: "Sul pendio sopra la conca c'è una fila di paletti con un nastro colorato in cima, tutti tesi dalla stessa parte."
    luogo: La gola alta, il pendio sotto la Sella
    area: tuarmir-gola-alta
    ripetibile: true
    requisiti: [fazione.tuarmir == 10, profondita.tuarmir-gola-alta >= 2, profondita.tuarmir-gola-alta <= 3]
    testo: |
      Sul pendio sopra la conca ci sono paletti piantati in fila, uno ogni
      cinquanta passi, con un nastro colorato in cima. È il metodo del
      quaderno di Sorella Alenna, piantato da una mano piccola e decisa, e i
      nastri sono tutti tesi verso la cima, a nord-est.

      {accademiche Media} Ogni paletto tiene la misura di quello di prima.
      Maela, oltre al vento, ha segnato la strada per tornare.
    opzioni:
      - testo: "Seguire i nastri fino all'ultimo"
        descrizione: "Dove finiscono i nastri, c'è la ragazza."
        prova: { attributo: mentale, abilita: [percezione, accademiche], difficolta: Media }
        successo:
          titolo: L'ultimo paletto
          testo: |
            All'ultimo paletto, piantato storto, trovi il cesto vuoto di Maela
            rovesciato nell'erba. Più su il terreno diventa crosta bianca.
          pe: { accademiche: 2 }
          effetti: { profondita.tuarmir-gola-alta: 1 }
        fallimento:
          titolo: Il nastro strappato
          testo: |
            Segui il nastro di un paletto sbagliato fino al bordo di un salto di
            roccia, e torni indietro a contare.
          effetti: { tormento: 0.5 }
      - testo: "Tagliare dritto per il pendio"
        descrizione: "Tanto puntano tutti nello stesso posto, e il vento spinge alle spalle."
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Media }
        successo:
          titolo: Dritto per il pendio
          testo: |
            Sali dritto con il vento alle spalle, e in cima al pendio trovi il
            cesto di Maela rovesciato nell'erba.
          pe: { atletica: 2 }
          effetti: { profondita.tuarmir-gola-alta: 1 }
        fallimento:
          titolo: La pendenza
          testo: |
            A metà pendio ti ritrovi seduto contro un paletto con le gambe di
            pietra, e riparti dal basso, più piano.
          effetti: { ferite: 0.5 }
      - testo: "Ripiantare i paletti caduti e salire con loro"
        descrizione: "Se Maela torna, deve trovare la strada."
        costo: 2
        esito:
          titolo: I paletti dritti
          testo: |
            Ripianti i paletti caduti e rifai i nodi con le dita gelate, fino al
            cesto di Maela rovesciato nell'erba.
          effetti: { profondita.tuarmir-gola-alta: 1, ferite: 0.5 }

  # ------------------------------------------------------------ 3 · sotto la Sella
  - id: tuarmir-gola-alta-la-crosta-di-sale
    immagine: ambientazione/marea-grigia
    titolo: La crosta di sale
    sommario: "Sotto la Sella le pietre sono coperte da una crosta bianca dove crescono i funghi grigi di Lonn Var."
    luogo: La gola alta, sotto la Sella
    area: tuarmir-gola-alta
    ripetibile: true
    requisiti: [fazione.tuarmir == 10, profondita.tuarmir-gola-alta == 3]
    testo: |
      Sotto la Sella il terreno è una crosta bianca che scricchiola come neve
      vecchia, e ci crescono a cerchi i funghi grigi che Lonn Var paga come
      argento. Quando il vento passa i cappelli si piegano insieme e liberano
      una polvere chiara, e l'aria sa di mare, su una montagna dove il mare
      nessuno l'ha mai visto.

      {natura Difficile} Il sale lo porta il vento, e lo lascia sulle pietre
      come la marea lascia la riga sugli scogli.
    opzioni:
      - testo: "Passare fra i cerchi senza calpestarli"
        descrizione: "I funghi liberano la polvere quando qualcosa li tocca, e fra i cerchi c'è crosta nuda."
        prova: { attributo: fisico, abilita: [acrobazia, furtivita], difficolta: Media }
        successo:
          titolo: Fra i cerchi
          testo: |
            Passi fra i cerchi sulla crosta nuda e i funghi restano chiusi. Dietro
            una lastra di roccia liscia, in cima, il vento è un ronzio basso.
          pe: { acrobazia: 2 }
          effetti: { profondita.tuarmir-gola-alta: 1 }
        fallimento:
          titolo: La polvere
          testo: |
            Calpesti un cerchio, e la polvere ti sale addosso. Ti allontani
            tossendo, con il sale sulle labbra.
          effetti: { contaminazione: 0.5 }
      - testo: "Masticare il muschio di Ilenia e attraversare"
        descrizione: "Il muschio amaro tiene la testa pulita, a denti stretti."
        prova: { attributo: mentale, abilita: [resilienza, medicina], difficolta: Media }
        successo:
          titolo: Il muschio amaro
          testo: |
            Mastichi il muschio di Ilenia finché la bocca ti diventa amara fino
            alle orecchie, e attraversi in fretta senza sentire il mare.
          pe: { resilienza: 2 }
          effetti: { profondita.tuarmir-gola-alta: 1 }
        fallimento:
          titolo: Il mare in testa
          testo: |
            A metà del campo vedi l'acqua grigia salire fra le pietre, e torni
            indietro con le mani sulla maschera.
          effetti: { tormento: 0.5 }
      - testo: "Girare largo, sulla roccia nuda"
        descrizione: "Sul bordo del campo c'è roccia nuda, ripida."
        costo: 2
        esito:
          titolo: La roccia nuda
          testo: |
            Giri largo sulla roccia nuda e arrivi sotto la lastra liscia con i
            palmi graffiati.
          effetti: { profondita.tuarmir-gola-alta: 1, ferite: 0.5 }

  - id: tuarmir-gola-alta-le-cesoie
    immagine: bestiario/salvaguardia-precursori
    titolo: Le cesoie
    sommario: "Fra le rocce sotto la Sella corrono due macchinette basse come granchi, che tagliano il muschio a filo della pietra."
    luogo: La gola alta, le rocce sotto la Sella
    area: tuarmir-gola-alta
    ripetibile: true
    requisiti: [fazione.tuarmir == 10, profondita.tuarmir-gola-alta == 3]
    testo: |
      Fra le rocce corrono due macchinette di metallo scuro, basse come
      granchi, con lame a forbice al posto delle chele, che tagliano il
      muschio a filo della pietra e ogni tanto si fermano insieme.

      {tecnologia Media} Lavorano a strisce, e si fermano quando sentono
      qualcosa muoversi. Una cosa che sta ferma, per loro, è roccia.
    opzioni:
      - testo: "Spaccare le cesoie"
        descrizione: "Sono due, e il guscio è sottile."
        combattimento: tuarmir-cesoie
        vittoria:
          titolo: I gusci spaccati
          testo: |
            La seconda cesoia si gira sulla schiena e si ferma. Dentro il guscio
            c'è una camera di cristallo ancora tiepida, che ti metti in tasca.
          effetti: { profondita.tuarmir-gola-alta: 1, parte.camera-1: 1 }
        sconfitta:
          titolo: Le caviglie
          testo: |
            Le cesoie ti tagliano stivali e caviglie, e ti ritiri sulle rocce alte
            dove non arrivano.
          effetti: { tormento: 0.5 }
      - testo: "Restare immobile e passare a strisce"
        descrizione: "Ti fermi quando si fermano loro e cammini mentre tagliano."
        prova: { attributo: fisico, abilita: furtivita, difficolta: Media }
        successo:
          titolo: Roccia
          testo: |
            Cammini quando tagliano e ti fermi quando si fermano, e le cesoie ti
            passano accanto senza accorgersi di te.
          pe: { furtivita: 2 }
          effetti: { profondita.tuarmir-gola-alta: 1 }
        fallimento:
          titolo: Il passo di troppo
          testo: |
            Fai un passo mentre si fermano, e scappi sulle rocce alte con il
            calzone aperto fino al ginocchio.
          effetti: { ferite: 0.5 }
      - testo: "Aspettare che finiscano la striscia"
        descrizione: "Finita una striscia si spostano più in là, e bisogna resistere al freddo."
        costo: 2
        esito:
          titolo: La striscia finita
          testo: |
            Aspetti al freddo su una roccia alta finché le cesoie finiscono la
            striscia, e passi dietro di loro intirizzito.
          effetti: { profondita.tuarmir-gola-alta: 1, ferite: 0.5 }

  # ------------------------------------------------------------ il cuore · la grata della Sella
  - id: tuarmir-la-grata
    immagine: bestiario/salvaguardia-precursori
    titolo: La grata
    sommario: "In mezzo alla Sella il vento entra nella montagna da una grata grande come un'aia, e Maela è lì in mezzo."
    luogo: La gola alta, la Sella
    area: tuarmir-gola-alta
    requisiti: [fazione.tuarmir == 10, profondita.tuarmir-gola-alta >= 4]
    testo: |
      La Sella è una conca fra due cime dove il vento salato arriva da
      nord-est. In mezzo c'è una grata di metallo grande come un'aia, e il
      vento ci entra con un ronzio basso.

      Lungo il bordo, su una rotaia nascosta, corre il Pettine, una macchina
      lunga quanto la grata, con una fila di denti che pettinano via dalle
      sbarre muschio e sassi. Al centro Maela sta rannicchiata, aggrappata a un
      dente spezzato che ha incastrato fra due sbarre, e il Pettine torna verso
      di lei.

      «Sono qui» dice Maela senza alzare la testa. «Non ho lasciato andare il
      dente.»
    opzioni:
      - testo: "Affrontare il Pettine"
        descrizione: "È lunga e lenta a girarsi, e va fermata prima che arrivi alla ragazza."
        combattimento: tuarmir-il-pettine
        vittoria:
          titolo: Il Pettine fermo
          testo: |
            Il Pettine si blocca sulla rotaia con un rumore di campana incrinata.
            Stacchi le dita di Maela dal dente una alla volta, e lei lo porta giù
            stretto al petto, mentre tu ti prendi due pezzi della macchina.
          pe: { armi-da-mischia: 5 }
          effetti: { fazione.tuarmir: 1, tuarmir.dente: 1, parte.impugnatura-2: 1, reliquie.frammento-inciso: 1 }
          vai: superficie-fratturata
        sconfitta:
          titolo: I denti
          testo: |
            I denti del Pettine ti buttano contro la roccia, e ti trascini giù con
            le costole che bruciano, mentre Maela è ancora lassù.
          effetti: { tormento: 1 }
          vai: superficie-fratturata
      - testo: "Passare sotto i denti mentre pettina"
        descrizione: "Fra un dente e l'altro c'è lo spazio di un corpo steso, se ci si butta al momento giusto."
        prova: { attributo: fisico, abilita: acrobazia, difficolta: Difficile }
        successo:
          titolo: Fra i denti
          testo: |
            Ti butti piatto sulla grata e i denti ti passano sopra a un palmo
            dalla schiena. Prima che la macchina torni porti fuori Maela con il
            suo dente spezzato.
          pe: { acrobazia: 5 }
          effetti: { fazione.tuarmir: 1, tuarmir.dente: 1, reliquie.frammento-inciso: 1 }
          vai: superficie-fratturata
        fallimento:
          titolo: Il dente sulla schiena
          testo: |
            Ti butti un attimo troppo tardi, e un dente ti apre la schiena dalla
            spalla al fianco. Torni giù da solo, tenendoti alle rocce.
          effetti: { ferite: 2, tormento: 0.5 }
          vai: superficie-fratturata
      - testo: "Fermare il Pettine sulla rotaia"
        descrizione: "Sotto il bordo la rotaia ha le giunture scoperte, e una leva nel punto giusto pianta la macchina."
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Difficile }
        successo:
          titolo: La giuntura
          testo: |
            Infili la lama nella giuntura dove il metallo è più chiaro, e il
            Pettine si pianta tremando. Porti fuori Maela con il suo dente
            spezzato, e dalla giuntura stacchi un pezzo di metallo.
          pe: { tecnologia: 5 }
          effetti: { fazione.tuarmir: 1, tuarmir.dente: 1, parte.impugnatura-2: 1 }
          vai: superficie-fratturata
        fallimento:
          titolo: La leva
          testo: |
            Sbagli giuntura, e il Pettine passa lo stesso strappandoti l'arma di
            mano. Ti ritiri dalla Sella con la mano fasciata nella maschera.
          effetti: { ferite: 2, tormento: 0.5 }
          vai: superficie-fratturata
      - testo: "Ordinargli di fermarsi"
        descrizione: "La formula del Comando parla alle macchine dei Precursori, e il Pettine ha sempre obbedito a qualcuno."
        incantesimo: comando
        prova: { attributo: mentale, abilita: magia, difficolta: Difficile }
        successo:
          titolo: Fermo
          testo: |
            La parola ti esce in una lingua che non è la tua, e il Pettine si
            ferma a un braccio da Maela. Lei non lascia il dente spezzato nemmeno
            quando la tiri su.
          pe: { magia: 5 }
          effetti: { fazione.tuarmir: 1, tuarmir.dente: 1, reliquie.frammento-inciso: 1 }
          vai: superficie-fratturata
        fallimento:
          titolo: La parola spezzata
          testo: |
            La formula ti si spezza in bocca a metà, e il Pettine accelera. Un
            dente ti prende il braccio, e scendi con Maela ancora lassù.
          effetti: { ferite: 1, tormento: 1 }
          vai: superficie-fratturata
      - testo: "Calarti sulla grata con la corda, come dalle piattaforme"
        descrizione: "Sulle piattaforme della Cicatrice si lavora appesi sopra le macchine."
        quando: [origine.apprendista-raschiatore >= 1]
        prova: { attributo: fisico, abilita: atletica, difficolta: Difficile }
        successo:
          titolo: Appeso
          testo: |
            Ti cali da uno spuntone sopra la grata come sulle piattaforme, e il
            Pettine ti scorre sotto i piedi. Tiri su Maela per la cintura, con il
            dente spezzato.
          pe: { atletica: 5 }
          effetti: { fazione.tuarmir: 1, tuarmir.dente: 1, reliquie.frammento-inciso: 1 }
          vai: superficie-fratturata
        fallimento:
          titolo: Il nodo
          testo: |
            Il nodo scorre sullo spuntone coperto di sale, e ti salvi dai denti
            rotolando, con una gamba aperta. Scendi dalla Sella da solo.
          effetti: { ferite: 2, tormento: 0.5 }
          vai: superficie-fratturata

colonna:
  - { contesto: area, id: tuarmir-gola-alta, musica: our-wounds-our-crown, ambiente: forest-creepy }
