# Le voci del glossario della quest di Tuarmir, nel formato di contenuti/glossario/personaggi.yaml: presentazioni
# stabili, senza segreti. Madre Cerya c'era già nei testi (la gola del Velo, il Codex del mondo) ma non aveva una voce;
# Ilenia viene da contenuti/scoperte/tracce.yaml (la gente di fuori all'Arena) e qui torna. Sorella Alenna, Lonn Var e
# Serad hanno già la loro voce in contenuti/fazioni/velo/glossario.yaml. Le figure di una scena sola (il vecchio Tamme
# e Dilla, la madre di Fenno, Ottavia Brenn, il pastore della conca) restano senza voce.
glossario:
  - id: madre-cerya
    nome: Madre Cerya
    alias: [Cerya]
    tipo: personaggio
    sottotitolo: "Erborista di Tuarmir"
    testo: "L'erborista cieca che guida la raccolta di Tuarmir. Secondo i vecchi perse la vista a nove anni, per aver guardato un fungo che era meglio lasciar stare, e da allora riconosce le erbe al tatto e all'odore. Cammina nella gola senza inciampare mai. Quando dice che un raccolto va lasciato in pace, il villaggio obbedisce."

  - id: ilenia
    nome: Ilenia
    tipo: personaggio
    sottotitolo: "Raccoglitrice di Tuarmir"
    testo: "Raccoglitrice di Tuarmir, minuta, che si rigira sempre fra le dita la sua maschera di stoffa e ci conta sopra i nomi, un nodo per nome. Distribuisce i lavori della raccolta e accompagna Madre Cerya, a cui descrive a mezza voce quello che vede. Cerya l'ha mandata fino all'Arena di Qir-Azel a cercare un forestiero."

  - id: maela
    nome: Maela
    tipo: personaggio
    sottotitolo: "Novizia della raccolta di Tuarmir"
    testo: "Ragazza di Tuarmir di quindici anni, con le mani verdi fino ai polsi, che Madre Cerya ha messo accanto a Sorella Alenna perché imparasse a riconoscere le erbe. Da Alenna ha imparato anche a leggere e a misurare il vento con i nastri, e scrive i numeri con lettere enormi."

  - id: fenno
    nome: Fenno
    tipo: personaggio
    sottotitolo: "Ragazzo di Tuarmir"
    testo: "Ragazzo di Tuarmir di sedici anni che sogna di andare a vivere in città. Lonn Var gli ha anticipato qualche moneta per un cesto di funghi grigi della Sella, la conca in cima alla gola dove Madre Cerya non vuole che si raccolga."

  - id: ruvo-gessan
    nome: Ruvo Gessan
    alias: [Ruvo]
    tipo: personaggio
    sottotitolo: "Capocarovana di Lonn Var"
    testo: "Il capocarovana del mercante Lonn Var, un uomo grande con la giubba da mulattiere che mastica resina e sputa di lato. Accompagna il mulo fra Tuarmir e la città, e quando Lonn Var deve sembrare ragionevole sta sulla porta a braccia conserte."
