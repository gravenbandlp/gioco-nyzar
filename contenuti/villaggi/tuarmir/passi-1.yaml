# La quest di Tuarmir, Atti I e II (fazione.tuarmir 0 → 6). Tutte le scene stanno presso il luogo di Tuarmir.
# - 0 → 1 `tuarmir-la-voce-bassa` (pista.arena >= 5): Ilenia all'imbocco della gola, Madre Cerya nel seccatoio, che ti
#   annusa e ti chiede che vento c'era quando sei partito.
# - 1 → 2 `tuarmir-le-due-spiegazioni`: il vecchio Tamme ha una visione sui terrazzi di sopra. Sua moglie Dilla dice
#   che il vento gli ha parlato, Maela (la novizia di Sorella Alenna) che sono le spore. Tamme ha sentito odore di sale.
# - 2 → 3 `tuarmir-la-maschera-cucita` (grado 1, Mano mascherata): Cerya ti misura la faccia con le dita e le donne ti
#   cuciono la maschera; mentre cuciono parlano del Forno della Nonna e delle Stele (traccia.forno e traccia.stele).
# - 3 → 4 `tuarmir-il-libro-di-lonn-var`: Fenno manca da due notti, e nel libro dei conti di Lonn Var c'è un anticipo
#   per un cesto della Sella.
# - 4 → 5 `tuarmir-fenno-sotto-la-sella`: Fenno seduto nel muschio, con la faccia a nord-est e il cesto di funghi grigi
#   (tuarmir.cesto 1 se lo porti giù).
# - 5 → 6 `tuarmir-il-raccolto-lasciato-in-pace` (grado 2, Raccoglitore): l'adunanza nella grotta grande, Lonn Var
#   e Ruvo Gessan, e la parola di Cerya sulla Sella.
storylet:
  # ------------------------------------------------------------ 0 → 1 · la voce bassa
  - id: tuarmir-la-voce-bassa
    presso: tuarmir
    immagine: ambientazione/tuarmir
    titolo: La voce bassa
    sommario: "Ilenia ti aspetta all'imbocco della gola, e Madre Cerya vuole sapere che vento c'era quando sei partito."
    luogo: Tuarmir, il seccatoio in cima al villaggio
    area: superficie-fratturata
    requisiti: [fazione.tuarmir == 0, pista.arena >= 5]
    testo: |
      All'imbocco della gola ti aspetta Ilenia, la donna minuta che sedeva
      sulla panca dell'Arena, e ti lega dietro la nuca una maschera prima
      ancora di salutarti. L'erba amara di cui è impregnata ti fa lacrimare.
      Scendete fra le case scavate nelle pareti e le corde di maschere stese,
      dove tutti parlano piano, e Ilenia ti spiega che è per rispetto alle
      erbe, senza che tu capisca se scherza.

      {percezione Media} Le maschere sulle corde ondeggiano tutte verso la
      cima della gola, anche quelle riparate sotto gli architravi.

      Nel seccatoio, l'ultima grotta in cima, siede sotto le erbe appese una
      vecchia piccola con un fazzoletto sui capelli bianchi e gli occhi chiusi
      da pieghe di pelle. Madre Cerya annusa l'aria due volte, come si
      assaggia un brodo per sapere quanto sale manca.

      «Vieni dall'Arena» dice. «Hai addosso sabbia e sudore di altri. Dimmi
      che vento c'era quando sei partito.» *Mi ha annusato meglio di un cane
      da guardia.*

      {origine accolito-del-velo} In Cattedrale ti hanno insegnato a parlare
      con questa voce bassa davanti all'altare, e qui la usano davanti a un
      mazzo di salvia.
    opzioni:
      - testo: "Dirle che odore aveva il vento della piana"
        descrizione: "Stamattina, sul basalto, il vento ti è venuto in faccia per mezza giornata."
        prova: { attributo: mentale, abilita: [natura, percezione], difficolta: Media }
        successo:
          titolo: Ferro e polvere
          testo: |
            Le dici che il vento della piana veniva da levante e sapeva di ferro.
            «Dalla Cicatrice, come deve» dice Cerya. «Qui scendeva così fino a
            qualche luna fa.» Sopra la Sella, in cima alla gola, adesso ne soffia
            un altro. Domani raccogli con Ilenia, che ti troverà un letto.
          pe: { natura: 3 }
          effetti: { fazione.tuarmir: 1, rep.tuarmir: 0.5 }
        fallimento:
          titolo: Il naso tappato
          testo: |
            Durante il cammino il vento ti è passato addosso senza che tu ci
            badassi, e te lo inventi. «Imparerai» dice Cerya a voce bassissima.
            Sopra la Sella soffia un vento nuovo, che non viene dalla Cicatrice, e
            domani raccogli con Ilenia.
          effetti: { fazione.tuarmir: 1, scandalo: 0.5 }
      - testo: "Porgerle le mani"
        descrizione: "Una cieca che annusa le persone forse le legge anche al tatto."
        prova: { attributo: sociale, abilita: empatia, difficolta: Media }
        successo:
          titolo: Le mani
          testo: |
            Cerya prende le tue mani fra le sue, verdi fino alla seconda falange,
            e si ferma sulla cicatrice più fresca. «Mani che hanno stretto un'arma
            per difendersi» dice. Il vento della gola veniva dalla Cicatrice e
            adesso viene da un'altra parte, e domani raccogli con Ilenia.
          pe: { empatia: 3 }
          effetti: { fazione.tuarmir: 1, rep.tuarmir: 0.5 }
        fallimento:
          titolo: Mani che scappano
          testo: |
            Quando le sue dita ti toccano i calli ritiri le mani di scatto. Cerya
            ti dice soltanto che il vento della gola ha cambiato strada e che
            domani raccogli con Ilenia, e sarà lei a guardarti le mani.
          effetti: { fazione.tuarmir: 1, scandalo: 0.5 }
      - testo: "Chiederle perché ha mandato a cercare proprio te"
        descrizione: "Ilenia ha fatto la strada fino all'Arena per una persona sola."
        prova: { attributo: sociale, abilita: [galateo, persuasione], difficolta: Media }
        successo:
          titolo: Chi viene da fuori
          testo: |
            «Chi è nato qui il vento non lo sente più, come non sente il suo
            odore» dice Cerya. Le serve un naso di fuori, perché il vento della
            gola veniva dalla Cicatrice e adesso viene da un'altra parte. Domani
            raccogli con Ilenia, e la sera le dici che cosa hai sentito.
          pe: { persuasione: 3 }
          effetti: { fazione.tuarmir: 1, rep.tuarmir: 0.5 }
        fallimento:
          titolo: La voce alta
          testo: |
            La domanda ti esce troppo forte e nel seccatoio tutti si voltano. «Qui
            si parla così» dice Cerya, senza rispondere. Il vento della gola ha
            cambiato strada, e domani raccogli con Ilenia.
          effetti: { fazione.tuarmir: 1, scandalo: 0.5 }
      - testo: "Aspettare in silenzio che parli lei"
        descrizione: "Nel seccatoio il tempo lo decide Cerya, e ci si siede fra le erbe ad aspettare."
        costo: 2
        esito:
          titolo: Fra le erbe
          testo: |
            Aspetti finché la luce sulla soglia si fa grigia, e Cerya parla come
            se la domanda gliel'avessi fatta tu. Il vento della gola veniva dalla
            Cicatrice, e da qualche luna sopra la Sella ne soffia un altro. Domani
            raccogli con Ilenia sui terrazzi.
          pe: { resilienza: 3 }
          effetti: { fazione.tuarmir: 1, rep.tuarmir: 0.5 }
      - testo: "Dirle che sei già sceso nella gola di sotto"
        descrizione: "Sei salito fino alla porta nella parete liscia, e lei ti ha accompagnato alla scala dei raccoglitori."
        quando: [fazione.velo >= 11]
        esito:
          titolo: Quello della porta
          testo: |
            «Quello del Velo che è salito alla porta» dice Cerya. Il vento che
            esce dalla porta lo conosci già, e adesso le serve chi vada a vedere
            da dove entra quello nuovo sopra la Sella, che non viene dalla
            Cicatrice. Domani raccogli con Ilenia sui terrazzi.
          pe: { natura: 3 }
          effetti: { fazione.tuarmir: 1, rep.tuarmir: 0.5 }
      - testo: "Salutarla con il saluto del Velo, a mezza voce"
        descrizione: "Il saluto dei novizi alle anziane della Cattedrale, con la mano sul petto e la voce che quasi non si sente."
        quando: [origine.accolito-del-velo >= 1]
        esito:
          titolo: Il saluto dei novizi
          testo: |
            Cerya risponde con la stessa formula, sbagliando una parola apposta.
            «Me l'ha insegnata la sorella del Velo» dice, «e io gliel'ho insegnata
            storta.» Il vento della gola veniva dalla Cicatrice e adesso viene da
            un'altra parte, e domani raccogli con Ilenia.
          pe: { empatia: 3 }
          effetti: { fazione.tuarmir: 1, rep.tuarmir: 0.5 }

  # ------------------------------------------------------------ 1 → 2 · le due spiegazioni
  - id: tuarmir-le-due-spiegazioni
    presso: tuarmir
    immagine: ambientazione/tuarmir
    titolo: Le due spiegazioni
    sommario: "Sui terrazzi il vecchio Tamme dice di vedere il mare, e nessuno è d'accordo sul perché."
    luogo: Tuarmir, i terrazzi sopra le case
    area: superficie-fratturata
    requisiti: [fazione.tuarmir == 1]
    testo: |
      Sui terrazzi di sopra, dove la gola si stringe, le raccoglitrici
      lavorano in fila con le maschere tirate fino agli occhi. A metà della
      fila il vecchio Tamme posa la falce, si toglie la maschera e si siede
      nel solco con la faccia verso la cima, dove dice di vedere il mare.

      Sua moglie Dilla gli strofina le tempie con un amuleto di steli
      intrecciati, perché secondo lei il vento gli ha parlato. Maela, la
      novizia di quindici anni che Madre Cerya ha messo accanto a Sorella
      Alenna, scuote la testa. «La sorella dice che sono le spore» dice a
      voce troppo alta, e tre maschere si voltano a zittirla.

      {medicina Media} Ha le pupille larghe come monete. Qualunque cosa abbia
      respirato, adesso gli sta lavorando dietro gli occhi.

      {natura Media} Le foglie del suo filare hanno il bordo grigioblu,
      soltanto dalla parte esposta al vento.
    opzioni:
      - testo: "Curarlo come dice Maela"
        descrizione: "Maschera, acqua fredda sulla faccia, lontano dal filare, per togliergli di dosso le spore."
        prova: { attributo: mentale, abilita: medicina, difficolta: Media }
        successo:
          titolo: L'acqua fredda
          testo: |
            Lo porti lontano dal filare, gli bagni la faccia e gli rimetti la
            maschera, e dopo un poco Tamme ti chiede chi sei. Del mare ricorda
            soltanto l'odore, che era di sale. Maela lo scrive sulla tavoletta, e
            Dilla gli lega lo stesso l'amuleto al polso.
          pe: { medicina: 3 }
          effetti: { fazione.tuarmir: 1, rep.tuarmir: 0.5 }
        fallimento:
          titolo: Il mare in faccia
          testo: |
            Tamme ti tira giù accanto a sé a guardare la cima della gola, e per un
            attimo ti sembra di sentire il mare anche tu. Quando si calma, ricorda
            soltanto che sapeva di sale.
          effetti: { fazione.tuarmir: 1, tormento: 0.5 }
      - testo: "Ascoltare la sua visione come dice Dilla"
        descrizione: "Se il vento gli ha parlato, ci si siede accanto e lo si lascia finire."
        prova: { attributo: sociale, abilita: empatia, difficolta: Media }
        successo:
          titolo: Il mare grigio
          testo: |
            Tamme racconta di un mare grigio che non ha mai visto, piatto come una
            lastra, e di un odore di sale che gli resta in gola, poi si rimette la
            maschera da solo. Maela scrive *sale* sulla tavoletta.
          pe: { empatia: 3 }
          effetti: { fazione.tuarmir: 1, rep.tuarmir: 0.5 }
        fallimento:
          titolo: Le onde
          testo: |
            Tamme si agita sempre di più finché si alza per andare a vedere le
            onde da vicino, e lo tenete in tre. A sera ricorda soltanto un odore
            di sale.
          effetti: { fazione.tuarmir: 1, tormento: 0.5 }
      - testo: "Cercare il filare che ha respirato"
        descrizione: "Se sono le spore, vengono da qualche pianta, da trovare senza toccarla con le mani."
        prova: { attributo: mentale, abilita: [natura, percezione], difficolta: Media }
        successo:
          titolo: Il bordo grigio
          testo: |
            Dove Tamme tagliava, sotto le foglie più grigie c'è una polvere
            chiara. Ne porti un poco a Maela, che la annusa da lontano e dice che
            sa di sale, lo stesso odore che Tamme ricorda quando torna in sé.
          pe: { natura: 3 }
          effetti: { fazione.tuarmir: 1, rep.tuarmir: 0.5 }
        fallimento:
          titolo: La peluria
          testo: |
            Tocchi le foglie per guardarle meglio, e la peluria ti si attacca alle
            dita e comincia a bruciare. Tamme intanto si riprende da solo e
            ricorda un odore di sale.
          effetti: { fazione.tuarmir: 1, ferite: 0.5 }
      - testo: "Fare tutte e due le cose, come si fa a Tuarmir"
        descrizione: "La maschera di Maela insieme all'amuleto di Dilla, con la falce per terra tutta la mattina."
        costo: 2
        esito:
          titolo: La maschera e l'amuleto
          testo: |
            Gli rimetti la maschera mentre Dilla gli lega l'amuleto, e restate con
            lui nel solco tutta la mattina. Verso mezzogiorno Tamme torna in sé e
            dice soltanto che il mare sapeva di sale.
          effetti: { fazione.tuarmir: 1, rep.tuarmir: 0.5 }
      - testo: "Dirgli la preghiera del Velo per chi vede"
        descrizione: "In Cattedrale c'è una preghiera breve per chi ha le visioni, da dire tenendogli la testa fra le mani."
        quando: [origine.accolito-del-velo >= 1]
        esito:
          titolo: La preghiera breve
          testo: |
            Dici la preghiera breve che in Cattedrale si dice ai pellegrini con
            gli occhi sbarrati, e Dilla la dice con te. Alla terza ripetizione
            Tamme si calma, e del mare ricorda l'odore di sale.
          pe: { medicina: 3 }
          effetti: { fazione.tuarmir: 1, rep.tuarmir: 0.5 }

  # ------------------------------------------------------------ 2 → 3 · la maschera cucita (grado 1)
  - id: tuarmir-la-maschera-cucita
    presso: tuarmir
    immagine: ambientazione/le-maschere
    titolo: La maschera cucita
    sommario: "La sera, nel seccatoio, le donne di Tuarmir cuciono le maschere nuove, e Madre Cerya ti misura la faccia con le dita."
    luogo: Tuarmir, il seccatoio, di sera
    area: superficie-fratturata
    requisiti: [fazione.tuarmir == 2]
    testo: |
      La sera il seccatoio si riempie di donne con il cesto da cucito in
      grembo. Si cuciono le maschere nuove, con una miscela d'erbe fra i due
      strati di stoffa, e quella di stasera è la tua. Madre Cerya ti fa
      sedere davanti a sé e ti passa i polpastrelli sulla fronte e lungo il
      naso, fino agli zigomi.

      Mentre cuciono le donne parlano piano. Una racconta del Forno della
      Nonna, la stanza tiepida sulla strada, dove i carbonai sognano un
      bambino seduto a un tavolo che ogni notte cambia faccia. Una vecchia
      che va a cercare l'erba d'ombra oltre la Foresta Strisciante, a
      sud-ovest, dice di sette colonne in fila dove a mezzogiorno le ombre
      sono lunghe come a sera e puntano tutte da una parte.

      {accademiche Media} La Biblioteca le chiama Stele dei Naviganti. I
      rilevatori ci andavano con il bastone delle ombre, e ne tornavano con
      misure che non tornavano mai.

      «Che erbe ci mettiamo?» chiede Cerya. *Una maschera è una faccia che si
      sceglie.*

      {origine figlio-del-circolo} Al Circolo le maschere per le spore si
      fanno con la corteccia e le cuciono gli uomini, mentre qui le cuciono
      le donne, cantando.
    opzioni:
      - testo: "Scegliere le erbe da te"
        descrizione: "Salvia, cardo, menta di roccia, muschio di gola, ognuna per una cosa diversa."
        prova: { attributo: mentale, abilita: [natura, medicina], difficolta: Media }
        successo:
          titolo: La tua miscela
          testo: |
            Scegli la salvia per il naso, il muschio per la Marea e la menta per
            restare sveglio, e Cerya annuisce. Quando te la legano dietro la nuca
            le donne battono piano il palmo sul ginocchio, che qui è un applauso,
            e Cerya ti paga la raccolta fatta.
          pe: { natura: 5 }
          almeno: { rep.tuarmir: 2 }
          effetti: { fazione.tuarmir: 1, oggetto.tuarmir-maschera-d-erbe: 1, monete: 15, traccia.forno: 1, traccia.stele: 1 }
        fallimento:
          titolo: Gli starnuti
          testo: |
            Al primo sorso d'aria attraverso la stoffa starnutisci tre volte.
            Cerya toglie una foglia dalla miscela senza dire quale e ti ricuce la
            maschera lei, poi ti paga la raccolta fatta.
          pe: { natura: 3 }
          almeno: { rep.tuarmir: 2 }
          effetti: { fazione.tuarmir: 1, oggetto.tuarmir-maschera-d-erbe: 1, monete: 15, traccia.forno: 1, traccia.stele: 1, scandalo: 0.5 }
      - testo: "Lasciare che Cerya ti annusi e decida lei"
        descrizione: "Cerya sceglie le erbe dall'odore di chi le porterà, e bisogna stare fermi mentre ti annusa."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Media }
        successo:
          titolo: L'odore giusto
          testo: |
            Cerya ti annusa dalle tempie fino alle mani, e nella tua maschera
            finisce un'erba che sa di pane bruciato. «Per chi dorme poco» dice, e
            quando te la legano dietro la nuca ti paga la raccolta fatta.
          pe: { resilienza: 5 }
          almeno: { rep.tuarmir: 2 }
          effetti: { fazione.tuarmir: 1, oggetto.tuarmir-maschera-d-erbe: 1, monete: 15, traccia.forno: 1, traccia.stele: 1 }
        fallimento:
          titolo: Il collo
          testo: |
            Al naso di Cerya sul collo ti scappa una risata nervosa. Lei sceglie
            lo stesso, e quando la maschera è pronta ti paga la raccolta fatta.
          pe: { resilienza: 3 }
          almeno: { rep.tuarmir: 2 }
          effetti: { fazione.tuarmir: 1, oggetto.tuarmir-maschera-d-erbe: 1, monete: 15, traccia.forno: 1, traccia.stele: 1, scandalo: 0.5 }
      - testo: "Cucire con loro, a tempo con la canzone"
        descrizione: "Le donne cuciono cantando una canzone che conta i punti, e chi perde il tempo sbaglia il punto."
        prova: { attributo: sociale, abilita: espressivita, difficolta: Media }
        successo:
          titolo: La canzone dei punti
          testo: |
            Cuci il bordo della tua maschera a tempo con la canzone, che conta i
            punti come si contano le pecore, e alla terza strofa la canti anche
            tu. Cerya chiude l'ultimo punto e ti paga la raccolta fatta.
          pe: { espressivita: 5 }
          almeno: { rep.tuarmir: 2 }
          effetti: { fazione.tuarmir: 1, oggetto.tuarmir-maschera-d-erbe: 1, monete: 15, traccia.forno: 1, traccia.stele: 1 }
        fallimento:
          titolo: Il dito
          testo: |
            Alla seconda strofa perdi il tempo e ti pianti l'ago nel polpastrello,
            e una vecchia dice che la goccia sulla stoffa porta bene. Ilenia
            finisce la cucitura, e Cerya ti paga la raccolta fatta.
          pe: { espressivita: 3 }
          almeno: { rep.tuarmir: 2 }
          effetti: { fazione.tuarmir: 1, oggetto.tuarmir-maschera-d-erbe: 1, monete: 15, traccia.forno: 1, traccia.stele: 1, ferite: 0.5 }
      - testo: "Aspettare che la cuciano per te"
        descrizione: "Ci si siede fra le donne di Tuarmir e si ascoltano le storie fino a notte."
        costo: 2
        esito:
          titolo: Fino a notte
          testo: |
            Resti fra le donne fino a notte, mentre la tua maschera passa di mano
            in mano e ognuna ci aggiunge un punto e una storia. Quando è pronta,
            Cerya ti paga la raccolta fatta.
          pe: { natura: 3 }
          almeno: { rep.tuarmir: 2 }
          effetti: { fazione.tuarmir: 1, oggetto.tuarmir-maschera-d-erbe: 1, monete: 15, traccia.forno: 1, traccia.stele: 1 }
      - testo: "Mettere fra le erbe una foglia del Bosco"
        descrizione: "Hai ancora in tasca la foglia di quercia nera che il Circolo dà ai suoi."
        quando: [origine.figlio-del-circolo >= 1]
        esito:
          titolo: La quercia nera
          testo: |
            Cerya riconosce la foglia di quercia nera al tatto. «Il Bosco» dice, e
            la mette al centro della miscela, con le erbe di Tuarmir intorno. Poi
            ti paga la raccolta fatta.
          pe: { natura: 5 }
          almeno: { rep.tuarmir: 2 }
          effetti: { fazione.tuarmir: 1, oggetto.tuarmir-maschera-d-erbe: 1, monete: 15, traccia.forno: 1, traccia.stele: 1 }

  # ------------------------------------------------------------ 3 → 4 · il libro di Lonn Var
  - id: tuarmir-il-libro-di-lonn-var
    presso: tuarmir
    immagine: icone/swap-bag
    titolo: Il libro di Lonn Var
    sommario: "Nell'ora di sole arriva il mulo di Lonn Var, e un ragazzo del villaggio manca da due notti."
    luogo: Tuarmir, lo slargo in fondo alla scala grande
    area: superficie-fratturata
    requisiti: [fazione.tuarmir == 3]
    testo: |
      Nell'ora di sole arriva nello slargo in fondo alla scala grande il mulo
      di Lonn Var. Il mercante ha un panciotto di velluto liso e un libro dei
      conti aperto sul basto, e a Tuarmir è l'unico che parla forte.

      Madre Cerya scende dal seccatoio al braccio della madre di Fenno, un
      ragazzo che manca da due notti. Alla Sella Cerya non manderà nessuno,
      perché va lasciata in pace, e la donna adesso guarda il mercante.

      {conoscenze-della-strada Media} Un ragazzo che sparisce con qualche
      moneta nuova cucita nel colletto ha preso un anticipo, e Lonn Var fa gli
      anticipi soltanto a chi gli serve.

      {percezione Media} L'ultima riga di una pagina del libro è scritta a
      matita, più fresca delle altre, e Lonn Var la tiene coperta con il
      palmo.

      {origine mercante-dei-ponti} Le colonne del libro sono quelle della
      Gilda, con gli anticipi a destra in inchiostro rosso.
    opzioni:
      - testo: "Leggere il libro da sopra la sua spalla"
        descrizione: "Lonn Var parla gesticolando, e prima della fine il palmo si sposterà dalla pagina."
        prova: { attributo: mentale, abilita: percezione, difficolta: Media }
        successo:
          titolo: L'ultima riga
          testo: |
            Quando Lonn Var alza la mano per salutare un cliente leggi l'ultima
            riga, *F., un cesto dalla Sella, anticipo*, di tre giorni fa. Lonn Var
            si stringe nelle spalle e ammette di aver anticipato al ragazzo
            qualche moneta per un cesto di funghi grigi, che crescono lassù da
            qualche luna e in città pagano bene.
          pe: { percezione: 3 }
          effetti: { fazione.tuarmir: 1, rep.tuarmir: 0.5 }
        fallimento:
          titolo: Il libro chiuso
          testo: |
            Lonn Var chiude il libro con un colpo secco, a un dito dalle tue mani,
            e ride forte. Poi, siccome il ragazzo non torna, ammette di avergli
            anticipato qualche moneta per un cesto di funghi grigi della Sella,
            che in città pagano bene.
          effetti: { fazione.tuarmir: 1, sospetto: 0.5 }
      - testo: "Fargli alzare la voce davanti al villaggio"
        descrizione: "A Tuarmir chi grida si vergogna, e Lonn Var grida per mestiere."
        prova: { attributo: sociale, abilita: [ingannare, intimidire], difficolta: Media }
        successo:
          titolo: La voce del mercante
          testo: |
            Gli dici a mezza voce che in città i funghi grigi li compra la
            Caserma, per le prove. Lonn Var risponde gridando che li compra gente
            che paga, e che il ragazzo l'ha pagato in anticipo per un cesto della
            Sella, e la madre di Fenno si copre la faccia con la maschera.
          pe: { ingannare: 3 }
          effetti: { fazione.tuarmir: 1, rep.tuarmir: 0.5 }
        fallimento:
          titolo: Il sorriso
          testo: |
            Lonn Var ti risponde a voce bassissima, imitando la gente del
            villaggio, e due ragazzi ridono di te. Poi la madre di Fenno gli si
            pianta davanti, e lui ammette l'anticipo per un cesto di funghi grigi
            della Sella.
          effetti: { fazione.tuarmir: 1, scandalo: 0.5 }
      - testo: "Chiedere agli amici di Fenno"
        descrizione: "Sulla scala grande ci sono tre ragazzi dell'età di Fenno, che fingono di non ascoltare."
        prova: { attributo: sociale, abilita: [conoscenze-della-strada, empatia], difficolta: Media }
        successo:
          titolo: La città
          testo: |
            Il più piccolo dei ragazzi ti racconta che Fenno voleva andare a
            vivere in città, e Lonn Var gli aveva promesso il viaggio sul mulo in
            cambio di un cesto di funghi grigi della Sella. È salito tre giorni
            fa, prima dell'alba.
          pe: { conoscenze-della-strada: 3 }
          effetti: { fazione.tuarmir: 1, rep.tuarmir: 0.5 }
        fallimento:
          titolo: I ragazzi
          testo: |
            I ragazzi se ne vanno su per la scala, e l'ultimo ti dice di chiedere
            al mercante del cesto di Fenno. Lonn Var, messo alle strette, ammette
            l'anticipo per i funghi grigi della Sella.
          effetti: { fazione.tuarmir: 1, sospetto: 0.5 }
      - testo: "Comprargli un sacchetto e una risposta"
        descrizione: "Lonn Var a un cliente risponde volentieri, e il sacchetto col nastro viola costa caro."
        requisiti: [monete >= 15]
        esito:
          titolo: Il nastro viola
          testo: |
            Lonn Var ti dà il sacchetto con il nastro viola e la risposta insieme,
            come un omaggio. Il ragazzo è salito alla Sella con un suo anticipo,
            per i funghi grigi che crescono lassù da qualche luna e che in città
            pagano come argento.
          effetti: { fazione.tuarmir: 1, monete: -15, informazioni.pettegolezzo: 1 }
      - testo: "Chiedergli il libro come si chiede al banco"
        descrizione: "Fra gente con la licenza della Gilda il libro dei conti si mostra, se lo si chiede con le parole giuste."
        quando: [origine.mercante-dei-ponti >= 1]
        esito:
          titolo: Fra colleghi
          testo: |
            Lonn Var ride e ti passa il libro, perché davanti a un collega
            rifiutare sarebbe peggio. In rosso c'è *F., un cesto dalla Sella*, per
            i funghi grigi che in città pagano come argento.
          pe: { politica-ed-economia: 3 }
          effetti: { fazione.tuarmir: 1, rep.tuarmir: 0.5 }

  # ------------------------------------------------------------ 4 → 5 · Fenno sotto la Sella
  - id: tuarmir-fenno-sotto-la-sella
    presso: tuarmir
    immagine: ambientazione/tuarmir
    titolo: Fenno sotto la Sella
    sommario: "Sopra le ultime case la gola si stringe, e più su, seduto nel muschio, c'è un ragazzo con un cesto accanto."
    luogo: Tuarmir, sopra le ultime case
    area: superficie-fratturata
    requisiti: [fazione.tuarmir == 4]
    testo: |
      Sopra i terrazzi la scala finisce contro un sasso piatto con una croce
      di calce, e lì finisce anche la raccolta di Tuarmir. Ilenia si ferma
      accanto al sasso, perché la Sella va lasciata in pace e lei è del
      villaggio.

      Più su il vento ti spinge alle spalle freddo come acqua di pozzo, e una
      crosta bianca scricchiola sotto gli stivali. Dopo un'ora trovi Fenno
      seduto in una conca d'erba, con la maschera in grembo e la faccia verso
      nord-est, e accanto un cesto pieno di funghi grigi. Ha le labbra
      spaccate, e sorride senza voltarsi. «Lo senti, il mare?»

      {natura Difficile} I funghi grigi crescono sulla crosta bianca, e la
      crosta è sale. Su questa montagna il sale non c'era.

      {origine fuggiasco-di-ghoran} Le monete cucite nel colletto le vedi da
      qui, e a Ghoran le cucivano così quelli che volevano scappare.
    opzioni:
      - testo: "Svegliarlo con l'acqua e la maschera"
        descrizione: "Acqua sulle labbra e la maschera sul naso, lontano da quell'odore."
        prova: { attributo: mentale, abilita: medicina, difficolta: Media }
        successo:
          titolo: L'acqua
          testo: |
            Gli bagni le labbra e gli leghi la maschera, e Fenno si mette a
            piangere e si lascia portare giù per mano, con il cesto che porti tu.
            Al sasso con la croce Ilenia lo abbraccia e gli dà uno scappellotto,
            in quest'ordine.
          pe: { medicina: 3 }
          imposta: { tuarmir.cesto: 1 }
          effetti: { fazione.tuarmir: 1, rep.tuarmir: 0.5 }
        fallimento:
          titolo: Il morso
          testo: |
            Fenno ti morde la mano e urla che vuole guardare il mare. Lo trascini
            giù mezzo di peso con il cesto sottobraccio, e al sasso Ilenia ti
            aiuta a tenerlo.
          imposta: { tuarmir.cesto: 1 }
          effetti: { fazione.tuarmir: 1, ferite: 0.5 }
      - testo: "Caricartelo in spalla e scendere"
        descrizione: "Un ragazzo di sedici anni pesa quanto un sacco di grano, e la crosta di sale scivola."
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Media }
        successo:
          titolo: Il sacco di grano
          testo: |
            Te lo carichi in spalla con il cesto al braccio e scendi un passo alla
            volta. A metà strada Fenno protesta che sa camminare, e tu lo rimetti
            giù soltanto al sasso con la croce.
          pe: { atletica: 3 }
          imposta: { tuarmir.cesto: 1 }
          effetti: { fazione.tuarmir: 1, rep.tuarmir: 0.5 }
        fallimento:
          titolo: La crosta
          testo: |
            Sulla crosta di sale scivolate per un tratto, e il cesto rotola fino a
            un sasso. Recuperi tutto e arrivi giù zoppicando.
          imposta: { tuarmir.cesto: 1 }
          effetti: { fazione.tuarmir: 1, ferite: 0.5 }
      - testo: "Parlargli del mare finché non ti segue"
        descrizione: "Gli si può promettere un mare più in basso, dove c'è da bere."
        prova: { attributo: sociale, abilita: [empatia, persuasione], difficolta: Media }
        successo:
          titolo: Il mare più in basso
          testo: |
            Gli dici che il mare si vede meglio dal villaggio, con una tazza in
            mano. Ci pensa a lungo, poi prende il cesto e scende davanti a te fino
            al sasso con la croce, voltandosi ogni tanto verso la cima.
          pe: { empatia: 3 }
          imposta: { tuarmir.cesto: 1 }
          effetti: { fazione.tuarmir: 1, rep.tuarmir: 0.5 }
        fallimento:
          titolo: Seduti in due
          testo: |
            A un certo punto ti accorgi di essere seduto accanto a lui con la
            faccia verso la cima. Ti scuoti e lo porti giù insieme al cesto, con
            la testa che gira a te quanto a lui.
          imposta: { tuarmir.cesto: 1 }
          effetti: { fazione.tuarmir: 1, tormento: 0.5 }
      - testo: "Tornare a chiamare Ilenia e portarlo giù legato"
        descrizione: "Ilenia il sasso con la croce non lo passa, eppure la sua corda arriva fin lassù. Il cesto resterà in cima."
        costo: 2
        esito:
          titolo: La corda
          testo: |
            Leghi Fenno alla vita con la corda di Ilenia, e lei lo tira dal basso
            mentre tu lo guidi da sopra, per tutto il pomeriggio. Il cesto dei
            funghi grigi resta lassù nella conca.
          imposta: { tuarmir.cesto: 0 }
          effetti: { fazione.tuarmir: 1, rep.tuarmir: 0.5 }
      - testo: "Svegliarlo con la corteccia amara del Bosco"
        descrizione: "Al Circolo chi si perde fra le spore si sveglia masticando la corteccia amara, e ne hai sempre un pezzo in tasca."
        quando: [origine.figlio-del-circolo >= 1]
        esito:
          titolo: La corteccia
          testo: |
            Gli metti fra i denti un pezzo di corteccia amara. Fenno fa una
            smorfia e sputa, poi ti guarda con gli occhi suoi e scende da solo,
            con il cesto, fino al sasso con la croce.
          pe: { natura: 3 }
          imposta: { tuarmir.cesto: 1 }
          effetti: { fazione.tuarmir: 1, rep.tuarmir: 0.5 }
      - testo: "Fargli contare i sassi, come davanti al fungo della gola di sotto"
        descrizione: "Nella gola di sotto sei passato accanto a un fungo da non guardare contando le pietre del sentiero."
        quando: [fazione.velo >= 11]
        esito:
          titolo: Le pietre
          testo: |
            Gli fai contare ad alta voce le pietre del sentiero finché non siete
            al sasso con la croce, e il cesto lo porti tu.
          pe: { resilienza: 3 }
          imposta: { tuarmir.cesto: 1 }
          effetti: { fazione.tuarmir: 1, rep.tuarmir: 0.5 }

  # ------------------------------------------------------------ 5 → 6 · il raccolto lasciato in pace (grado 2)
  - id: tuarmir-il-raccolto-lasciato-in-pace
    presso: tuarmir
    immagine: ambientazione/tuarmir
    titolo: Il raccolto lasciato in pace
    sommario: "Nella grotta grande il villaggio si riunisce. Lonn Var vuole i funghi della Sella, e Madre Cerya non ha ancora parlato."
    luogo: Tuarmir, la grotta grande sotto il villaggio
    area: superficie-fratturata
    requisiti: [fazione.tuarmir == 5]
    testo: |
      La grotta grande sta sotto il villaggio, e stasera ci sono tutti, seduti
      per terra con le lanterne accanto. Fenno sta in fondo con una coperta
      sulle spalle e sua madre che non gli lascia la mano. Madre Cerya siede
      su uno sgabello contro la parete e non ha ancora detto una parola.

      Lonn Var invece parla in piedi, a voce piena. In città i funghi grigi
      della Sella valgono più di un anno di salvia, e lui ne compra quanti ne
      portano, pagando in anticipo. Contro lo stipite un uomo grande con la
      giubba da mulattiere mastica resina senza guardare nessuno, e Ilenia ti
      dice all'orecchio che è Ruvo Gessan, il capocarovana.

      {politica-ed-economia Media} Se in città li pagano come argento, lui li
      rivende a dieci volte tanto. I ragazzi in prima fila il conto lo
      lasciano perdere e guardano la sua borsa.

      Cerya alza appena la testa verso di te. *Vuole che parli il forestiero,
      perché qui non ha debiti con nessuno.*

      {origine fuggiasco-di-ghoran} I ragazzi guardano la borsa del mercante
      come a Ghoran si guardava il pane del sorvegliante.
    opzioni:
      - testo: "Parlare ai ragazzi di Fenno e della Sella"
        descrizione: "Fenno è lì, con le labbra ancora spaccate, e basta raccontare com'era seduto lassù."
        prova: { attributo: sociale, abilita: [persuasione, empatia], difficolta: Media }
        successo:
          titolo: Com'era lassù
          testo: |
            Racconti di Fenno seduto nella conca con la faccia verso la cima, e i
            ragazzi guardano Fenno, che guarda per terra. Allora Cerya parla.
            «Quel raccolto va lasciato in pace.» Lonn Var dice che aspetterà.
            Uscendo, Cerya ti dice che da stasera il seccatoio per te è come casa,
            e Ilenia ti dà la tua parte della raccolta.
          pe: { persuasione: 5 }
          almeno: { rep.tuarmir: 4 }
          effetti: { fazione.tuarmir: 1, monete: 20 }
        fallimento:
          titolo: Il mare di Fenno
          testo: |
            Alla parola mare un ragazzo ride, e Fenno si alza ed esce. Cerya alza
            la mano, e basta quello. «Quel raccolto va lasciato in pace.» Lonn Var
            dice che aspetterà. Uscendo, Cerya ti dice che hai parlato male ma che
            il seccatoio per te è come casa, e Ilenia ti dà la tua parte.
          pe: { persuasione: 3 }
          almeno: { rep.tuarmir: 4 }
          effetti: { fazione.tuarmir: 1, monete: 20, scandalo: 0.5 }
      - testo: "Far vedere il cesto di Fenno"
        descrizione: "I funghi grigi sono cresciuti sul sale, e basta passarne uno di mano in mano."
        quando: [tuarmir.cesto >= 1]
        prova: { attributo: mentale, abilita: [natura, medicina], difficolta: Media }
        successo:
          titolo: Il sale
          testo: |
            Passi un fungo grigio alla prima fila, e in tre si leccano il dito e
            sputano il sale. «Quel raccolto va lasciato in pace» dice Cerya, e
            Lonn Var dice che aspetterà. Uscendo, Cerya ti dice che da stasera il
            seccatoio per te è come casa, e Ilenia ti dà la tua parte della
            raccolta.
          pe: { natura: 5 }
          almeno: { rep.tuarmir: 4 }
          effetti: { fazione.tuarmir: 1, monete: 20 }
        fallimento:
          titolo: Il fungo che gira
          testo: |
            Nessuno capisce che cosa dovrebbe vedere, finché un ragazzo annusa il
            fungo troppo a lungo e si siede. «Quel raccolto va lasciato in pace»
            dice Cerya, e Lonn Var dice che aspetterà. Uscendo, Cerya ti dice che
            il seccatoio per te è come casa, e Ilenia ti dà la tua parte.
          pe: { natura: 3 }
          almeno: { rep.tuarmir: 4 }
          effetti: { fazione.tuarmir: 1, monete: 20, tormento: 0.5 }
      - testo: "Mettere Lonn Var davanti ai suoi conti"
        descrizione: "Quanto paga un cesto e quanto lo rivende, detto ad alta voce perché il conto lo facciano anche i ragazzi."
        prova: { attributo: mentale, abilita: politica-ed-economia, difficolta: Media }
        successo:
          titolo: Il conto
          testo: |
            Fai il conto dell'anticipo e del prezzo in città scandendo le parole,
            e Lonn Var ride, perché il mestiere è quello. «Quel raccolto va
            lasciato in pace» dice Cerya, e Lonn Var dice che aspetterà. Uscendo,
            Cerya ti dice che il seccatoio per te è come casa, e Ilenia ti dà la
            tua parte.
          pe: { politica-ed-economia: 5 }
          almeno: { rep.tuarmir: 4 }
          effetti: { fazione.tuarmir: 1, monete: 20 }
        fallimento:
          titolo: Il conto sbagliato
          testo: |
            Sbagli il prezzo della città, e Lonn Var ti corregge al rialzo,
            ridendo. «Quel raccolto va lasciato in pace» dice Cerya, e Lonn Var
            dice che aspetterà. Uscendo, Cerya ti dice che il seccatoio per te è
            come casa, e Ilenia ti dà la tua parte.
          pe: { politica-ed-economia: 3 }
          almeno: { rep.tuarmir: 4 }
          effetti: { fazione.tuarmir: 1, monete: 20, scandalo: 0.5 }
      - testo: "Lasciare che parli soltanto Cerya"
        descrizione: "A Tuarmir l'ultima parola è sua, e il forestiero può tacere."
        esito:
          titolo: Una frase sola
          testo: |
            Stai zitto, e Cerya dice una frase sola. «Quel raccolto va lasciato in
            pace.» Il villaggio obbedisce, ma i ragazzi guardano te. Lonn Var dice
            che aspetterà. Uscendo, Cerya ti dice che il seccatoio per te è come
            casa, e Ilenia ti dà la tua parte.
          almeno: { rep.tuarmir: 4 }
          effetti: { fazione.tuarmir: 1, monete: 20 }
      - testo: "Dire ai ragazzi che cosa costa un anticipo"
        descrizione: "Un anticipo si restituisce con quello che chiede chi l'ha dato, e a Ghoran lo hai imparato sulla tua pelle."
        quando: [origine.fuggiasco-di-ghoran >= 1]
        esito:
          titolo: Il prezzo dell'anticipo
          testo: |
            Racconti ai ragazzi di come a Ghoran un debito diventa una corda e la
            corda un collare, e Ruvo Gessan smette di masticare. «Quel raccolto va
            lasciato in pace» dice Cerya, e Lonn Var dice che aspetterà. Uscendo,
            Cerya ti dice che il seccatoio per te è come casa, e Ilenia ti dà la
            tua parte.
          pe: { intimidire: 5 }
          almeno: { rep.tuarmir: 4 }
          effetti: { fazione.tuarmir: 1, monete: 20 }
