# La quest di Tuarmir, Atti I e II (fazione.tuarmir 0 → 6). Tutte le scene stanno presso il luogo di Tuarmir.
# - 0 → 1 `tuarmir-la-voce-bassa` (pista.arena >= 5): Ilenia all'imbocco della gola, Madre Cerya nel seccatoio, che ti
#   annusa e ti chiede che vento c'era quando sei partito.
# - 1 → 2 `tuarmir-le-due-spiegazioni`: il vecchio Tamme ha una visione sui terrazzi di sopra. Sua moglie Dilla dice
#   che il vento gli ha parlato, Maela (la novizia di Sorella Alenna) che sono le spore. Tamme ha sentito odore di sale.
# - 2 → 3 `tuarmir-la-maschera-cucita` (grado 1, Mano mascherata): Cerya ti misura la faccia con le dita e le donne ti
#   cuciono la maschera; mentre cuciono parlano del Forno della Nonna e delle Stele (traccia.forno e traccia.stele).
# - 3 → 4 `tuarmir-il-libro-di-lonn-var`: Fenno manca da due notti, e nel libro dei conti di Lonn Var c'è un anticipo
#   per un cesto della Sella.
# - 4 → 5 `tuarmir-fenno-sotto-la-sella`: Fenno seduto nel muschio, con la faccia a nord-est e il cesto di funghi grigi
#   (tuarmir.cesto 1 se lo porti giù).
# - 5 → 6 `tuarmir-il-raccolto-lasciato-in-pace` (grado 2, Raccoglitore): l'adunanza nella grotta grande, Lonn Var
#   e Ruvo Gessan, e la parola di Cerya sulla Sella.
storylet:
  # ------------------------------------------------------------ 0 → 1 · la voce bassa
  - id: tuarmir-la-voce-bassa
    presso: tuarmir
    immagine: ambientazione/tuarmir
    titolo: La voce bassa
    sommario: "Ilenia ti aspetta all'imbocco della gola con una maschera in mano. Madre Cerya vuole sapere che vento c'era quando sei partito."
    luogo: Tuarmir, il seccatoio in cima al villaggio
    area: superficie-fratturata
    requisiti: [fazione.tuarmir == 0, pista.arena >= 5]
    testo: |
      All'imbocco della gola, dove la piana di basalto finisce e il
      sentiero comincia a scendere, ti aspetta Ilenia. È la donna minuta
      che sedeva sulla panca dell'Arena con la maschera in grembo, e adesso
      ne ha una al collo e un'altra in mano, per te. Te la lega dietro la
      nuca prima ancora di salutarti, e l'erba amara di cui è impregnata ti
      fa lacrimare subito.

      Scendete senza parlare. Le case di Tuarmir stanno dentro le pareti
      della gola, porte di legno grigio sotto architravi di muschio, e fra
      un uscio e l'altro pendono corde di maschere stese. Chi incontrate vi
      saluta con un cenno, e chi parla lo fa piano. Ilenia ti spiega a
      mezza voce che qui si fa così per rispetto alle erbe, e che la gola ha
      orecchie fini, e non capisci se scherza.

      {percezione Media} Le maschere sulle corde ondeggiano tutte dalla
      stessa parte, anche sotto gli architravi dove il vento non dovrebbe
      arrivare. Il muschio degli usci è pettinato all'insù, verso la cima
      della gola.

      Il seccatoio è l'ultima grotta in cima al villaggio. Sotto le erbe
      appese a testa in giù siede una vecchia piccola, con un fazzoletto sui
      capelli bianchi e gli occhi chiusi da pieghe di pelle. Madre Cerya non
      si volta. Annusa l'aria due volte, piano, nel modo in cui si assaggia un
      brodo per sapere quanto sale manca.

      {accademiche Media} A Tuarmir raccontano che perse la vista a nove
      anni, per aver guardato un fungo che era meglio lasciar stare. I
      vecchi lo dicono con rispetto, e i ragazzi con un poco di paura.

      «Vieni dall'Arena» dice. «Hai addosso sabbia e sudore di altri.» Gira
      la testa verso di te, con gli occhi chiusi. «Dimmi che vento c'era
      quando sei partito.» *Mi ha annusato meglio di un cane da guardia.*
      Ilenia ti spinge avanti con due dita sulla schiena.

      {origine accolito-del-velo} La voce bassa la conosci bene. In
      Cattedrale ti hanno insegnato a parlare così davanti all'altare, e qui
      la usano davanti a un mazzo di salvia.
    opzioni:
      - testo: "Dirle che odore aveva il vento della piana"
        descrizione: "Stamattina, sul basalto, il vento ti è venuto in faccia per mezza giornata. Bisogna ricordarsi com'era."
        prova: { attributo: mentale, abilita: [natura, percezione], difficolta: Media }
        successo:
          titolo: Ferro e polvere
          testo: |
            Le dici che il vento della piana veniva da levante e sapeva di
            ferro e di pietra calda. Cerya annuisce piano. «Dalla Cicatrice,
            come deve. Qui scendeva così fino a qualche luna fa.» Poi ti dice
            che sopra la Sella, in cima alla gola, adesso ne soffia un altro,
            che non viene da levante e non sa di ferro. Domani raccogli con
            Ilenia, e lei ti troverà un letto in una casa vuota.
          pe: { natura: 3 }
          effetti: { fazione.tuarmir: 1, rep.tuarmir: 0.5 }
        fallimento:
          titolo: Il naso tappato
          testo: |
            Ci provi, e ti accorgi di non aver fatto caso al vento per tutto
            il cammino. Lo descrivi a caso, e due raccoglitrici sulla soglia
            si coprono la bocca con la maschera per non ridere. Cerya ride
            con loro, a voce bassissima. «Imparerai.» Ti dice che sopra la
            Sella soffia un vento nuovo, che non viene dalla Cicatrice, e che
            domani raccogli con Ilenia.
          effetti: { fazione.tuarmir: 1, scandalo: 0.5 }
      - testo: "Porgerle le mani"
        descrizione: "Una cieca che annusa le persone forse le legge anche al tatto. Le mani dicono molto, a chi sa leggerle."
        prova: { attributo: sociale, abilita: empatia, difficolta: Media }
        successo:
          titolo: Le mani
          testo: |
            Le porgi le mani aperte, e Cerya le prende fra le sue, verdi fino
            alla seconda falange. Ti passa i pollici sui calli, si ferma sulla
            cicatrice più fresca e ci resta un momento. «Mani che hanno
            stretto un'arma per difendersi» dice. Poi ti racconta che il vento
            della gola veniva dalla Cicatrice e adesso viene da un'altra parte,
            e che domani raccogli con Ilenia.
          pe: { empatia: 3 }
          effetti: { fazione.tuarmir: 1, rep.tuarmir: 0.5 }
        fallimento:
          titolo: Mani che scappano
          testo: |
            Quando le sue dita ti toccano i calli ritiri le mani di scatto,
            senza volerlo. Sulla soglia qualcuno sospira. Cerya resta con le
            mani a mezz'aria e poi le posa in grembo. Ti dice soltanto che il
            vento della gola ha cambiato strada, e che domani raccogli con
            Ilenia. Sarà lei a guardarti le mani al posto suo.
          effetti: { fazione.tuarmir: 1, scandalo: 0.5 }
      - testo: "Chiederle perché ha mandato a cercare proprio te"
        descrizione: "Ilenia ha fatto la strada fino all'Arena per una persona sola. Prima di rispondere conviene sapere perché."
        prova: { attributo: sociale, abilita: [galateo, persuasione], difficolta: Media }
        successo:
          titolo: Chi viene da fuori
          testo: |
            Glielo chiedi con la voce più bassa che hai. Cerya sorride. «Chi
            è nato qui il vento non lo sente più, come non sente il suo
            odore.» Le serve un naso di fuori, e uno che abbia sentito altri
            venti. Quello della gola veniva dalla Cicatrice e adesso viene da
            un'altra parte. Domani raccogli con Ilenia, e la sera le dici che
            cosa hai sentito.
          pe: { persuasione: 3 }
          effetti: { fazione.tuarmir: 1, rep.tuarmir: 0.5 }
        fallimento:
          titolo: La voce alta
          testo: |
            La domanda ti esce più forte di quanto volevi, e nel seccatoio
            tutti si voltano. Cerya aspetta che l'eco si spenga sotto le
            travi. «Qui si parla così» ti dice a voce bassissima, senza
            rispondere alla domanda. Dice soltanto che il vento della gola ha
            cambiato strada, e che domani raccogli con Ilenia.
          effetti: { fazione.tuarmir: 1, scandalo: 0.5 }
      - testo: "Aspettare in silenzio che parli lei"
        descrizione: "Nel seccatoio il tempo lo decide Cerya. Ci si siede fra le erbe e si aspetta."
        costo: 2
        esito:
          titolo: Fra le erbe
          testo: |
            Ti siedi su uno sgabello fra i mazzi appesi e aspetti, mentre la
            luce sulla soglia si fa grigia. Dopo molto tempo Cerya parla, come
            se la domanda gliel'avessi fatta tu. Il vento della gola veniva
            dalla Cicatrice, e da qualche luna, sopra la Sella, ne soffia un
            altro. Domani raccogli con Ilenia, che ti aspetta all'alba sui
            terrazzi.
          pe: { resilienza: 3 }
          effetti: { fazione.tuarmir: 1, rep.tuarmir: 0.5 }
      - testo: "Dirle che sei già sceso nella gola di sotto"
        descrizione: "Sei salito fino alla porta nella parete liscia, e lei ti ha accompagnato alla scala dei raccoglitori. Forse se lo ricorda."
        quando: [fazione.velo >= 11]
        esito:
          titolo: Quello della porta
          testo: |
            Cerya annusa l'aria un'altra volta e annuisce. «Quello del Velo
            che è salito alla porta.» Ti fa sedere accanto a lei. Il vento che
            esce dalla porta lo conosci già. Adesso le serve chi vada a vedere
            da dove entra, perché sopra la Sella ne soffia uno che non viene
            dalla Cicatrice. Domani raccogli con Ilenia, che ti aspetta
            all'alba sui terrazzi.
          pe: { natura: 3 }
          effetti: { fazione.tuarmir: 1, rep.tuarmir: 0.5 }
      - testo: "Salutarla con il saluto del Velo, a mezza voce"
        descrizione: "Il saluto dei novizi alle anziane della Cattedrale, con la mano sul petto e la voce che quasi non si sente."
        quando: [origine.accolito-del-velo >= 1]
        esito:
          titolo: Il saluto dei novizi
          testo: |
            Le dici il saluto dei novizi con la mano sul petto, e Cerya
            risponde con la stessa formula, sbagliando una parola apposta. «Me
            l'ha insegnata la sorella del Velo» dice, «e io gliel'ho insegnata
            storta.» Poi ti racconta che il vento della gola veniva dalla
            Cicatrice e adesso viene da un'altra parte. Domani raccogli con
            Ilenia, che ti aspetta all'alba sui terrazzi.
          pe: { empatia: 3 }
          effetti: { fazione.tuarmir: 1, rep.tuarmir: 0.5 }

  # ------------------------------------------------------------ 1 → 2 · le due spiegazioni
  - id: tuarmir-le-due-spiegazioni
    presso: tuarmir
    immagine: ambientazione/tuarmir
    titolo: Le due spiegazioni
    sommario: "Sui terrazzi di sopra il vecchio Tamme si siede in mezzo alla fila e dice di vedere il mare. Sua moglie dice che è il vento, la novizia che sono le spore."
    luogo: Tuarmir, i terrazzi sopra le case
    area: superficie-fratturata
    requisiti: [fazione.tuarmir == 1]
    testo: |
      I terrazzi di sopra stanno fra le ultime case e il punto in cui la gola
      si stringe, e ci si arriva per una scala di gradini scavati. La mattina
      il vento sale dal fondo della gola freddo e regolare e passa fra i
      filari verso la cima, e le raccoglitrici lavorano in fila con le
      maschere tirate fino agli occhi. A metà della fila il vecchio Tamme posa
      la falce, si toglie la maschera e si siede nel solco, con la faccia
      rivolta verso la cima della gola. Dice che da lì si vede il mare, e lo
      indica con il mento.

      Sua moglie Dilla gli si inginocchia subito accanto e gli strofina le
      tempie con un amuleto di steli intrecciati. Secondo lei il vento gli ha
      parlato, e bisogna lasciargli finire il discorso. Una ragazza di
      quindici anni, con le mani verdi fino ai polsi, scuote la testa. È
      Maela, la novizia che Madre Cerya ha messo accanto a Sorella Alenna. «La
      sorella dice che sono le spore» dice a voce troppo alta, e tre maschere
      si voltano a zittirla.

      {medicina Media} Ha le pupille larghe come monete, e le labbra secche.
      Qualunque cosa abbia respirato, adesso gli sta lavorando dietro gli
      occhi.

      {natura Media} Le foglie del suo filare hanno il bordo grigioblu, e
      soltanto dalla parte esposta al vento. Le altre file, più riparate,
      sono verdi.

      Ilenia guarda te. *Le due spiegazioni, e nessuno che scelga.*
      Stasera Cerya vorrà sapere che cosa è successo.
    opzioni:
      - testo: "Curarlo come dice Maela"
        descrizione: "Maschera, acqua fredda sulla faccia, lontano dal filare. Se sono le spore, bisogna togliergliele di dosso."
        prova: { attributo: mentale, abilita: medicina, difficolta: Media }
        successo:
          titolo: L'acqua fredda
          testo: |
            Lo porti lontano dal filare, gli bagni la faccia con l'acqua della
            zucca e gli rimetti la maschera, stretta. Dopo un poco Tamme sbatte
            le palpebre e ti chiede chi sei. Del mare si ricorda soltanto
            l'odore, che era di sale. Maela lo scrive sulla tavoletta con
            lettere enormi, e Dilla gli lega lo stesso l'amuleto al polso.
          pe: { medicina: 3 }
          effetti: { fazione.tuarmir: 1, rep.tuarmir: 0.5 }
        fallimento:
          titolo: Il mare in faccia
          testo: |
            Gli bagni la faccia, e Tamme ti prende per il bavero e ti tira giù
            accanto a sé, a guardare la cima della gola, ripetendo che il mare
            è lì. Per un attimo ti sembra di sentirne l'odore anche tu. Quando
            si calma, ricorda soltanto che sapeva di sale.
          effetti: { fazione.tuarmir: 1, tormento: 0.5 }
      - testo: "Ascoltare la sua visione come dice Dilla"
        descrizione: "Se il vento gli ha parlato, bisogna lasciarlo finire. Ci si siede accanto e si ascolta."
        prova: { attributo: sociale, abilita: empatia, difficolta: Media }
        successo:
          titolo: Il mare grigio
          testo: |
            Ti siedi nel solco accanto a lui e lo lasci parlare. Racconta di
            un mare grigio che non ha mai visto, piatto come una lastra, e di
            un odore di sale che gli resta in gola. Quando ha finito si rimette
            la maschera da solo. Dilla ti stringe il braccio, e Maela, a voce
            più bassa, scrive *sale* sulla tavoletta.
          pe: { empatia: 3 }
          effetti: { fazione.tuarmir: 1, rep.tuarmir: 0.5 }
        fallimento:
          titolo: Le onde
          testo: |
            Lo lasci parlare, e lui si agita sempre di più finché si alza per
            andare verso la cima della gola a vedere le onde da vicino. Lo
            tenete in tre. Dilla piange senza rumore, e a sera Tamme ricorda
            soltanto un odore di sale.
          effetti: { fazione.tuarmir: 1, tormento: 0.5 }
      - testo: "Cercare il filare che ha respirato"
        descrizione: "Se sono le spore, vengono da qualche pianta. Basta trovare quale, e non toccarla con le mani."
        prova: { attributo: mentale, abilita: [natura, percezione], difficolta: Media }
        successo:
          titolo: Il bordo grigio
          testo: |
            Segui il filare di Tamme fino al punto dove lui tagliava, e lì le
            foglie di salvia hanno il bordo più grigio di tutte, e sotto le
            foglie una polvere chiara. Ne raccogli un poco su una foglia larga
            e la porti a Maela, che la annusa da lontano e dice che sa di
            sale. Tamme intanto è tornato in sé, e ricorda lo stesso odore.
          pe: { natura: 3 }
          effetti: { fazione.tuarmir: 1, rep.tuarmir: 0.5 }
        fallimento:
          titolo: La peluria
          testo: |
            Tocchi le foglie del filare per guardarle meglio, e la peluria ti
            si attacca alle dita e comincia a bruciare. Passi il resto della
            mattina con le mani nel rivolo. Tamme intanto si riprende da solo
            e ricorda un odore di sale.
          effetti: { fazione.tuarmir: 1, ferite: 0.5 }
      - testo: "Fare tutte e due le cose, come si fa a Tuarmir"
        descrizione: "La maschera di Maela insieme all'amuleto di Dilla. Ci vuole tutta la mattina, e la falce resta per terra."
        costo: 2
        esito:
          titolo: La maschera e l'amuleto
          testo: |
            Gli rimetti la maschera mentre Dilla gli lega l'amuleto, e restate
            con lui nel solco tutta la mattina, Maela con la tavoletta e Dilla
            con le sue parole. Quando torna in sé, verso mezzogiorno, Tamme
            dice soltanto che il mare sapeva di sale. Le raccoglitrici hanno
            finito il filare per lui.
          effetti: { fazione.tuarmir: 1, rep.tuarmir: 0.5 }
      - testo: "Dirgli la preghiera del Velo per chi vede"
        descrizione: "In Cattedrale c'è una preghiera breve per chi ha le visioni, da dire tenendogli la testa fra le mani."
        quando: [origine.accolito-del-velo >= 1]
        esito:
          titolo: La preghiera breve
          testo: |
            Gli prendi la testa fra le mani e dici la preghiera breve, quella
            che in Cattedrale si dice ai pellegrini con gli occhi sbarrati.
            Dilla la riconosce e la dice con te, e anche Maela muove le labbra.
            Tamme si calma alla terza ripetizione. Del mare ricorda l'odore,
            che era di sale.
          pe: { medicina: 3 }
          effetti: { fazione.tuarmir: 1, rep.tuarmir: 0.5 }

  # ------------------------------------------------------------ 2 → 3 · la maschera cucita (grado 1)
  - id: tuarmir-la-maschera-cucita
    presso: tuarmir
    immagine: ambientazione/le-maschere
    titolo: La maschera cucita
    sommario: "La sera, nel seccatoio, le donne di Tuarmir cuciono le maschere nuove. Madre Cerya ti misura la faccia con le dita."
    luogo: Tuarmir, il seccatoio, di sera
    area: superficie-fratturata
    requisiti: [fazione.tuarmir == 2]
    testo: |
      La sera il seccatoio si riempie di donne con il cesto da cucito in
      grembo. Si cuciono le maschere nuove, ognuna con la sua miscela d'erbe
      fra i due strati di stoffa, e quella di stasera è la tua. Ilenia taglia
      la tela grigia sul ginocchio, e Madre Cerya ti fa sedere davanti a sé e
      ti misura la faccia con le dita. Ti passa lentamente i polpastrelli
      lisci sulla fronte e poi lungo il naso, fino agli zigomi.

      {resistenza Facile fallita} Ti viene da starnutire proprio mentre
      il suo pollice ti passa sul naso. Lo trattieni, e ti lacrimano gli
      occhi.

      Mentre cuciono le donne parlano piano. Una racconta del Forno della
      Nonna, la stanza tiepida sulla strada, dove i carbonai sognano un
      bambino seduto a un tavolo che ogni notte cambia faccia. Una vecchia
      che va a cercare l'erba d'ombra fino a sud-ovest, oltre la Foresta
      Strisciante, dice di sette colonne in fila, dove a mezzogiorno le
      ombre sono lunghe come a sera e puntano tutte da una parte.

      {accademiche Media} Le sette colonne la Biblioteca le chiama Stele dei
      Naviganti. I rilevatori ci andavano con il bastone delle ombre, e ne
      tornavano con misure che non tornavano mai.

      Cerya ha finito di misurarti. «Che erbe ci mettiamo?» chiede. *Una
      maschera è una faccia che si sceglie.* Il fuoco del braciere fa
      ondeggiare le ombre dei mazzi sulle pareti.

      {origine figlio-del-circolo} Al Circolo le maschere per le spore si
      fanno con la corteccia, e le cuciono gli uomini. Qui le cuciono le
      donne, e cantano.
    opzioni:
      - testo: "Scegliere le erbe da te"
        descrizione: "Salvia, cardo, menta di roccia, muschio di gola. Ogni erba fa una cosa, e insieme ne fanno un'altra."
        prova: { attributo: mentale, abilita: [natura, medicina], difficolta: Media }
        successo:
          titolo: La tua miscela
          testo: |
            Scegli la salvia per il naso e il muschio per la Marea, e una
            foglia di menta per non addormentarti sotto la stoffa. Cerya annusa
            la miscela e annuisce. Ilenia cuce gli strati con punti piccoli
            come chicchi di riso, e quando te la legano dietro la nuca le donne
            battono piano il palmo sul ginocchio, che qui è un applauso. Cerya
            ti mette in mano una manciata di monete per la raccolta fatta.
          pe: { natura: 5 }
          almeno: { rep.tuarmir: 2 }
          effetti: { fazione.tuarmir: 1, oggetto.tuarmir-maschera-d-erbe: 1, monete: 15, traccia.forno: 1, traccia.stele: 1 }
        fallimento:
          titolo: Gli starnuti
          testo: |
            Scegli le erbe con sicurezza, e al primo sorso d'aria attraverso la
            stoffa starnutisci tre volte di fila. Le donne ridono dietro le
            maschere. Cerya toglie una foglia dalla miscela senza dire quale e
            ti ricuce la maschera lei. Quando te la legano dietro la nuca ti
            mette in mano una manciata di monete per la raccolta fatta.
          pe: { natura: 3 }
          almeno: { rep.tuarmir: 2 }
          effetti: { fazione.tuarmir: 1, oggetto.tuarmir-maschera-d-erbe: 1, monete: 15, traccia.forno: 1, traccia.stele: 1, scandalo: 0.5 }
      - testo: "Lasciare che Cerya ti annusi e decida lei"
        descrizione: "Cerya sceglie le erbe dall'odore di chi le porterà. Bisogna stare fermi mentre ti annusa la faccia da vicino."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Media }
        successo:
          titolo: L'odore giusto
          testo: |
            Stai fermo mentre Cerya ti annusa dalle tempie fino alle mani, e
            poi sceglie dai mazzi senza esitare. Nella tua maschera finisce
            un'erba che non conosci, dall'odore di pane bruciato. «Per chi
            dorme poco» dice. Le donne cuciono, e quando te la legano dietro
            la nuca Cerya ti mette in mano una manciata di monete per la
            raccolta fatta.
          pe: { resilienza: 5 }
          almeno: { rep.tuarmir: 2 }
          effetti: { fazione.tuarmir: 1, oggetto.tuarmir-maschera-d-erbe: 1, monete: 15, traccia.forno: 1, traccia.stele: 1 }
        fallimento:
          titolo: Il collo
          testo: |
            Quando il naso di Cerya ti arriva sul collo ti scappa una risata
            nervosa, e poi un'altra. Lei aspetta con pazienza che passi, poi
            sceglie lo stesso. Le donne cuciono scuotendo la testa. Quando la
            maschera è pronta te la legano dietro la nuca, e Cerya ti mette in
            mano una manciata di monete per la raccolta fatta.
          pe: { resilienza: 3 }
          almeno: { rep.tuarmir: 2 }
