# La quest di Tuarmir, Atti I e II (fazione.tuarmir 0 → 6). Tutte le scene stanno presso il luogo di Tuarmir.
# - 0 → 1 `tuarmir-la-voce-bassa` (pista.arena >= 5): Ilenia all'imbocco della gola, Madre Cerya nel seccatoio, che ti
#   annusa e ti chiede che vento c'era quando sei partito.
# - 1 → 2 `tuarmir-le-due-spiegazioni`: il vecchio Tamme ha una visione sui terrazzi di sopra. Sua moglie Dilla dice
#   che il vento gli ha parlato, Maela (la novizia di Sorella Alenna) che sono le spore. Tamme ha sentito odore di sale.
# - 2 → 3 `tuarmir-la-maschera-cucita` (grado 1, Mano mascherata): Cerya ti misura la faccia con le dita e le donne ti
#   cuciono la maschera; mentre cuciono parlano del Forno della Nonna e delle Stele (traccia.forno e traccia.stele).
# - 3 → 4 `tuarmir-il-libro-di-lonn-var`: Fenno manca da due notti, e nel libro dei conti di Lonn Var c'è un anticipo
#   per un cesto della Sella.
# - 4 → 5 `tuarmir-fenno-sotto-la-sella`: Fenno seduto nel muschio, con la faccia a nord-est e il cesto di funghi grigi
#   (tuarmir.cesto 1 se lo porti giù).
# - 5 → 6 `tuarmir-il-raccolto-lasciato-in-pace` (grado 2, Raccoglitore): l'adunanza nella grotta grande, Lonn Var
#   e Ruvo Gessan, e la parola di Cerya sulla Sella.
storylet:
  # ------------------------------------------------------------ 0 → 1 · la voce bassa
  - id: tuarmir-la-voce-bassa
    presso: tuarmir
    immagine: ambientazione/tuarmir
    titolo: La voce bassa
    sommario: "Ilenia ti aspetta all'imbocco della gola con una maschera in mano. Madre Cerya vuole sapere che vento c'era quando sei partit{o|a}."
    luogo: Tuarmir, il seccatoio in cima al villaggio
    area: superficie-fratturata
    requisiti: [fazione.tuarmir == 0, pista.arena >= 5]
    testo: |
      All'imbocco della gola, dove finisce la piana di basalto, ti aspetta Ilenia. È la donna minuta che
      sedeva sulla panca dell'Arena con la maschera in grembo. Te ne lega una dietro la nuca prima ancora di
      salutarti, e l'erba amara della stoffa ti fa lacrimare.

      Le case di Tuarmir stanno dentro le pareti della gola, e fra un uscio e l'altro pendono corde di
      maschere stese.

      {percezione Media} Le maschere ondeggiano tutte dalla stessa parte anche dove il vento non dovrebbe
      arrivare. Il muschio degli usci è pettinato verso la cima.

      Il seccatoio è l'ultima grotta in cima al villaggio. Sotto le erbe appese siede una vecchia piccola con
      un fazzoletto sui capelli bianchi e gli occhi chiusi da pieghe di pelle. Madre Cerya non si volta e
      annusa l'aria due volte, come si assaggia un brodo.

      «Vieni dall'Arena» dice. «Hai addosso sabbia e sudore di altri. Dimmi che vento c'era quando sei
      partit{o|a}.»

      {origine accolito-del-velo} In Cattedrale ti hanno insegnato a parlare con questa voce bassa davanti
      all'altare, e qui la usano davanti a un mazzo di salvia.
    opzioni:
      - testo: "Dirle che odore aveva il vento della piana"
        descrizione: "Stamattina, sul basalto, il vento ti è venuto in faccia per mezza giornata."
        prova: { attributo: mentale, abilita: [natura, percezione], difficolta: Media }
        successo:
          titolo: Ferro e polvere
          testo: |
            Le dici che il vento della piana veniva da levante e sapeva di
            ferro e di pietra calda. Cerya annuisce piano. «Dalla Cicatrice,
            come deve. Qui scendeva così fino a qualche luna fa.» Poi ti dice
            che sopra la Sella, in cima alla gola, adesso ne soffia un altro,
            che non viene da levante e non sa di ferro. Domani raccogli con
            Ilenia, e lei ti troverà un letto in una casa vuota.
          pe: { natura: 3 }
          effetti: { fazione.tuarmir: 1, rep.tuarmir: 0.5 }
        fallimento:
          titolo: Il naso tappato
          testo: |
            Ci provi, e ti accorgi di non aver fatto caso al vento per tutto
            il cammino. Lo descrivi a caso, e due raccoglitrici sulla soglia
            si coprono la bocca con la maschera per non ridere. Cerya ride
            con loro, a voce bassissima. «Imparerai.» Ti dice che sopra la
            Sella soffia un vento nuovo, che non viene dalla Cicatrice, e che
            domani raccogli con Ilenia.
          effetti: { fazione.tuarmir: 1, scandalo: 0.5 }
      - testo: "Porgerle le mani"
        descrizione: "Una cieca che annusa le persone forse le legge anche al tatto."
        prova: { attributo: sociale, abilita: empatia, difficolta: Media }
        successo:
          titolo: Le mani
          testo: |
            Le porgi le mani aperte, e Cerya le prende fra le sue, verdi fino alla
            seconda falange. «Mani che hanno stretto un'arma per difendersi» dice.
            Poi ti racconta che il vento della gola veniva dalla Cicatrice e
            adesso viene da un'altra parte, e che domani raccogli con Ilenia.
          pe: { empatia: 3 }
          effetti: { fazione.tuarmir: 1, rep.tuarmir: 0.5 }
        fallimento:
          titolo: Mani che scappano
          testo: |
            Quando le sue dita ti toccano i calli ritiri le mani di scatto, senza
            volerlo. Cerya resta con le mani a mezz'aria e poi le posa in grembo.
            Ti dice soltanto che il vento della gola ha cambiato strada, e che
            domani raccogli con Ilenia. Sarà lei a guardarti le mani al posto suo.
          effetti: { fazione.tuarmir: 1, scandalo: 0.5 }
      - testo: "Chiederle perché ha mandato a cercare proprio te"
        descrizione: "Ilenia ha fatto la strada fino all'Arena per una persona sola."
        prova: { attributo: sociale, abilita: [galateo, persuasione], difficolta: Media }
        successo:
          titolo: Chi viene da fuori
          testo: |
            Glielo chiedi con la voce più bassa che hai. Cerya sorride. «Noi
            che siamo nati qui il vento non lo sentiamo più. È come il nostro
            odore.» Le serve un naso di fuori, e uno che abbia sentito altri
            venti. Quello della gola veniva dalla Cicatrice e adesso viene da
            un'altra parte. Domani raccogli con Ilenia, e la sera le dici che
            cosa hai sentito.
          pe: { persuasione: 3 }
          effetti: { fazione.tuarmir: 1, rep.tuarmir: 0.5 }
        fallimento:
          titolo: La voce alta
          testo: |
            La domanda ti esce più forte di quanto volevi, e nel seccatoio
            tutti si voltano. Cerya aspetta che l'eco si spenga sotto le
            travi. «Qui si parla così» ti dice a voce bassissima, senza
            rispondere alla domanda. Dice soltanto che il vento della gola ha
            cambiato strada, e che domani raccogli con Ilenia.
          effetti: { fazione.tuarmir: 1, scandalo: 0.5 }
      - testo: "Aspettare in silenzio che parli lei"
        descrizione: "Nel seccatoio il tempo lo decide Cerya."
        costo: 2
        esito:
          titolo: Fra le erbe
          testo: |
            Ti siedi su uno sgabello fra i mazzi appesi e aspetti, mentre la
            luce sulla soglia si fa grigia. Dopo molto tempo Cerya parla, come
            se la domanda gliel'avessi fatta tu. Il vento della gola veniva
            dalla Cicatrice, e da qualche luna, sopra la Sella, ne soffia un
            altro. Domani raccogli con Ilenia, che ti aspetta all'alba sui
            terrazzi.
          pe: { resilienza: 3 }
          effetti: { fazione.tuarmir: 1, rep.tuarmir: 0.5 }
      - testo: "Dirle che sei già sces{o|a} nella gola di sotto"
        descrizione: "Sei salit{o|a} fino alla porta nella parete liscia, e lei ti ha accompagnato alla scala dei raccoglitori."
        quando: [fazione.velo >= 11]
        esito:
          titolo: Quello della porta
          testo: |
            Cerya annusa l'aria un'altra volta e annuisce. «{Quello|Quella} del Velo che è
            salit{o|a} alla porta.» Il vento che esce dalla porta lo conosci già.
            Adesso le serve chi vada a vedere da dove entra, perché sopra la Sella
            ne soffia uno che non viene dalla Cicatrice. Domani raccogli con
            Ilenia, che ti aspetta all'alba sui terrazzi.
          pe: { natura: 3 }
          effetti: { fazione.tuarmir: 1, rep.tuarmir: 0.5 }
      - testo: "Salutarla con il saluto del Velo, a mezza voce"
        descrizione: "Il saluto dei novizi alle anziane della Cattedrale, con la mano sul petto e la voce che quasi non si sente."
        quando: [origine.accolito-del-velo >= 1]
        esito:
          titolo: Il saluto dei novizi
          testo: |
            Le dici il saluto dei novizi con la mano sul petto, e Cerya
            risponde con la stessa formula, sbagliando una parola apposta. «Me
            l'ha insegnata la sorella del Velo» dice, «e io gliel'ho insegnata
            storta.» Poi ti racconta che il vento della gola veniva dalla
            Cicatrice e adesso viene da un'altra parte. Domani raccogli con
            Ilenia, che ti aspetta all'alba sui terrazzi.
          pe: { empatia: 3 }
          effetti: { fazione.tuarmir: 1, rep.tuarmir: 0.5 }

  # ------------------------------------------------------------ 1 → 2 · le due spiegazioni
  - id: tuarmir-le-due-spiegazioni
    presso: tuarmir
    immagine: ambientazione/tuarmir
    titolo: Le due spiegazioni
    sommario: "Sui terrazzi di sopra il vecchio Tamme si siede in mezzo alla fila e dice di vedere il mare."
    luogo: Tuarmir, i terrazzi sopra le case
    area: superficie-fratturata
    requisiti: [fazione.tuarmir == 1]
    testo: |
      La mattina il vento sale freddo dal fondo della gola, e le raccoglitrici lavorano in fila fra i filari.
      A metà della fila il vecchio Tamme si toglie la maschera e si siede nel solco con la faccia verso la
      cima. Dice che da lì si vede il mare.

      Sua moglie Dilla gli strofina le tempie con un amuleto di steli intrecciati, perché secondo lei il vento
      gli ha parlato e bisogna lasciarlo finire. Maela scuote la testa. È la novizia di quindici anni che
      Madre Cerya ha messo accanto a Sorella Alenna. «La sorella dice che sono le spore» dice a voce troppo
      alta, e tre maschere si voltano a zittirla.

      {natura Media} Le foglie del suo filare hanno il bordo grigioblu soltanto dalla parte del vento.
    opzioni:
      - testo: "Curarlo come dice Maela"
        descrizione: "Maschera, acqua fredda sulla faccia, lontano dal filare."
        prova: { attributo: mentale, abilita: medicina, difficolta: Media }
        successo:
          titolo: L'acqua fredda
          testo: |
            Lo porti lontano dal filare, gli bagni la faccia con l'acqua della
            zucca e gli rimetti la maschera, stretta. Dopo un poco Tamme sbatte
            le palpebre e ti chiede chi sei. Del mare si ricorda soltanto
            l'odore, che era di sale. Maela lo scrive sulla tavoletta con
            lettere enormi, e Dilla gli lega lo stesso l'amuleto al polso.
          pe: { medicina: 3 }
          effetti: { fazione.tuarmir: 1, rep.tuarmir: 0.5 }
        fallimento:
          titolo: Il mare in faccia
          testo: |
            Gli bagni la faccia, e Tamme ti prende per il bavero e ti tira giù
            accanto a sé, a guardare la cima della gola, ripetendo che il mare
            è lì. Per un attimo ti sembra di sentirne l'odore anche tu. Quando
            si calma, ricorda soltanto che sapeva di sale.
          effetti: { fazione.tuarmir: 1, tormento: 0.5 }
      - testo: "Ascoltare la sua visione come dice Dilla"
        descrizione: "Se il vento gli ha parlato, bisogna lasciarlo finire."
        prova: { attributo: sociale, abilita: empatia, difficolta: Media }
        successo:
          titolo: Il mare grigio
          testo: |
            Ti siedi nel solco accanto a lui e lo lasci parlare. Racconta di un
            mare grigio che non ha mai visto, piatto come una lastra, e di un
            odore di sale che gli resta in gola. Dilla ti stringe il braccio, e
            Maela, a voce più bassa, scrive *sale* sulla tavoletta.
          pe: { empatia: 3 }
          effetti: { fazione.tuarmir: 1, rep.tuarmir: 0.5 }
        fallimento:
          titolo: Le onde
          testo: |
            Lo lasci parlare, e lui si agita sempre di più finché si alza per
            andare verso la cima della gola a vedere le onde da vicino. Lo
            tenete in tre. Dilla piange senza rumore, e a sera Tamme ricorda
            soltanto un odore di sale.
          effetti: { fazione.tuarmir: 1, tormento: 0.5 }
      - testo: "Cercare il filare che ha respirato"
        descrizione: "Se sono le spore, vengono da qualche pianta. Basta trovare quale, e non toccarla con le mani."
        prova: { attributo: mentale, abilita: [natura, percezione], difficolta: Media }
        successo:
          titolo: Il bordo grigio
          testo: |
            Segui il filare di Tamme fino al punto dove lui tagliava, e lì le
            foglie di salvia hanno il bordo più grigio di tutte, e sotto le
            foglie una polvere chiara. Ne raccogli un poco su una foglia larga
            e la porti a Maela, che la annusa da lontano e dice che sa di
            sale. Tamme intanto è tornato in sé, e ricorda lo stesso odore.
          pe: { natura: 3 }
          effetti: { fazione.tuarmir: 1, rep.tuarmir: 0.5 }
        fallimento:
          titolo: La peluria
          testo: |
            Tocchi le foglie del filare per guardarle meglio, e la peluria ti
            si attacca alle dita e comincia a bruciare. Passi il resto della
            mattina con le mani nel rivolo. Tamme intanto si riprende da solo
            e ricorda un odore di sale.
          effetti: { fazione.tuarmir: 1, ferite: 0.5 }
      - testo: "Fare tutte e due le cose, come si fa a Tuarmir"
        descrizione: "La maschera di Maela insieme all'amuleto di Dilla."
        costo: 2
        esito:
          titolo: La maschera e l'amuleto
          testo: |
            Gli rimetti la maschera mentre Dilla gli lega l'amuleto, e restate
            con lui nel solco tutta la mattina, Maela con la tavoletta e Dilla
            con le sue parole. Quando torna in sé, verso mezzogiorno, Tamme
            dice soltanto che il mare sapeva di sale. Le raccoglitrici hanno
            finito il filare per lui.
          effetti: { fazione.tuarmir: 1, rep.tuarmir: 0.5 }
      - testo: "Dirgli la preghiera del Velo per chi vede"
        descrizione: "In Cattedrale c'è una preghiera breve per chi ha le visioni, da dire tenendogli la testa fra le mani."
        quando: [origine.accolito-del-velo >= 1]
        esito:
          titolo: La preghiera breve
          testo: |
            Gli prendi la testa fra le mani e dici la preghiera breve, quella
            che in Cattedrale si dice ai pellegrini con gli occhi sbarrati.
            Dilla la riconosce e la dice con te, e anche Maela muove le labbra.
            Tamme si calma alla terza ripetizione. Del mare ricorda l'odore,
            che era di sale.
          pe: { medicina: 3 }
          effetti: { fazione.tuarmir: 1, rep.tuarmir: 0.5 }

  # ------------------------------------------------------------ 2 → 3 · la maschera cucita (grado 1)
  - id: tuarmir-la-maschera-cucita
    presso: tuarmir
    immagine: ambientazione/le-maschere
    titolo: La maschera cucita
    sommario: "La sera, nel seccatoio, le donne di Tuarmir cuciono le maschere nuove. Madre Cerya ti misura la faccia con le dita."
    luogo: Tuarmir, il seccatoio, di sera
    area: superficie-fratturata
    requisiti: [fazione.tuarmir == 2]
    testo: |
      La sera il seccatoio si riempie di donne che cuciono le maschere nuove, con una miscela d'erbe fra i due
      strati di stoffa. Stasera tocca alla tua. Ilenia taglia la tela grigia sul ginocchio, e Madre Cerya ti
      misura la faccia con le dita.

      Mentre cuciono, una racconta del Forno della Nonna, la stanza tiepida sulla strada dove i carbonai
      sognano un bambino seduto a un tavolo che ogni notte cambia faccia. Una vecchia che va per erba d'ombra
      oltre la Foresta Strisciante parla di sette colonne in fila a sud-ovest, dove a mezzogiorno le ombre
      sono lunghe come a sera e puntano tutte da una parte.

      {accademiche Media} La Biblioteca le chiama Stele dei Naviganti.

      Cerya ha finito di misurarti. «Che erbe ci mettiamo?» chiede.

      {origine figlio-del-circolo} Al Circolo le maschere sono di corteccia e le cuciono gli uomini. Qui le
      cuciono le donne, cantando.
    opzioni:
      - testo: "Scegliere le erbe da te"
        descrizione: "Salvia, cardo, menta di roccia, muschio di gola."
        prova: { attributo: mentale, abilita: [natura, medicina], difficolta: Media }
        successo:
          titolo: La tua miscela
          testo: |
            Scegli la salvia per il naso e il muschio per la Marea, e una foglia
            di menta per non addormentarti sotto la stoffa. Ilenia cuce gli strati
            con punti piccoli come chicchi di riso, e quando te la legano dietro
            la nuca le donne battono piano il palmo sul ginocchio, che qui è un
            applauso. Cerya ti mette in mano una manciata di monete per la
            raccolta fatta.
          pe: { natura: 5 }
          almeno: { rep.tuarmir: 2 }
          effetti: { fazione.tuarmir: 1, oggetto.tuarmir-maschera-d-erbe: 1, monete: 15, traccia.forno: 1, traccia.stele: 1 }
        fallimento:
          titolo: Gli starnuti
          testo: |
            Scegli le erbe con sicurezza, e al primo sorso d'aria attraverso la
            stoffa starnutisci tre volte di fila. Le donne ridono dietro le
            maschere. Cerya toglie una foglia dalla miscela senza dire quale e
            ti ricuce la maschera lei. Quando te la legano dietro la nuca ti
            mette in mano una manciata di monete per la raccolta fatta.
          pe: { natura: 3 }
          almeno: { rep.tuarmir: 2 }
          effetti: { fazione.tuarmir: 1, oggetto.tuarmir-maschera-d-erbe: 1, monete: 15, traccia.forno: 1, traccia.stele: 1, scandalo: 0.5 }
      - testo: "Lasciare che Cerya ti annusi e decida lei"
        descrizione: "Cerya sceglie le erbe dall'odore di chi le porterà."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Media }
        successo:
          titolo: L'odore giusto
          testo: |
            Stai ferm{o|a} mentre Cerya ti annusa dalle tempie fino alle mani, e
            poi sceglie dai mazzi senza esitare. Nella tua maschera finisce
            un'erba che non conosci, dall'odore di pane bruciato. «Per chi
            dorme poco» dice. Le donne cuciono, e quando te la legano dietro
            la nuca Cerya ti mette in mano una manciata di monete per la
            raccolta fatta.
          pe: { resilienza: 5 }
          almeno: { rep.tuarmir: 2 }
          effetti: { fazione.tuarmir: 1, oggetto.tuarmir-maschera-d-erbe: 1, monete: 15, traccia.forno: 1, traccia.stele: 1 }
        fallimento:
          titolo: Il collo
          testo: |
            Quando il naso di Cerya ti arriva sul collo ti scappa una risata
            nervosa, e poi un'altra. Lei aspetta con pazienza che passi, poi
            sceglie lo stesso. Quando la maschera è pronta te la legano dietro la
            nuca, e Cerya ti mette in mano una manciata di monete per la raccolta
            fatta.
          pe: { resilienza: 3 }
          almeno: { rep.tuarmir: 2 }
          effetti: { fazione.tuarmir: 1, oggetto.tuarmir-maschera-d-erbe: 1, monete: 15, traccia.forno: 1, traccia.stele: 1, scandalo: 0.5 }
      - testo: "Cucire con loro, a tempo con la canzone"
        descrizione: "Le donne cuciono cantando una canzone che conta i punti."
        prova: { attributo: sociale, abilita: espressivita, difficolta: Media }
        successo:
          titolo: La canzone dei punti
          testo: |
            Ilenia ti dà un ago, e tu cuci il bordo della tua maschera a tempo con
            la canzone, che conta i punti come si contano le pecore. Cerya ci
            mette dentro le erbe e chiude l'ultimo punto, e quando te la legano
            dietro la nuca ti mette in mano una manciata di monete per la raccolta
            fatta.
          pe: { espressivita: 5 }
          almeno: { rep.tuarmir: 2 }
          effetti: { fazione.tuarmir: 1, oggetto.tuarmir-maschera-d-erbe: 1, monete: 15, traccia.forno: 1, traccia.stele: 1 }
        fallimento:
          titolo: Il dito
          testo: |
            Perdi il tempo alla seconda strofa e ti pianti l'ago nel polpastrello.
            Ilenia finisce la cucitura, e quando la maschera è pronta Cerya te la
            lega dietro la nuca e ti mette in mano una manciata di monete per la
            raccolta fatta.
          pe: { espressivita: 3 }
          almeno: { rep.tuarmir: 2 }
          effetti: { fazione.tuarmir: 1, oggetto.tuarmir-maschera-d-erbe: 1, monete: 15, traccia.forno: 1, traccia.stele: 1, ferite: 0.5 }
      - testo: "Aspettare che la cuciano per te"
        descrizione: "Le donne di Tuarmir sanno quello che fanno."
        costo: 2
        esito:
          titolo: Fino a notte
          testo: |
            Resti sedut{o|a} fra le donne fino a notte, mentre la tua maschera
            passa di mano in mano, e ognuna ci aggiunge un punto e una storia.
            Quando è pronta Cerya te la lega dietro la nuca, e ti mette in mano
            una manciata di monete per la raccolta fatta.
          pe: { natura: 3 }
          almeno: { rep.tuarmir: 2 }
          effetti: { fazione.tuarmir: 1, oggetto.tuarmir-maschera-d-erbe: 1, monete: 15, traccia.forno: 1, traccia.stele: 1 }
      - testo: "Mettere fra le erbe una foglia del Bosco"
        descrizione: "Hai ancora in tasca la foglia di quercia nera che il Circolo dà ai suoi."
        quando: [origine.figlio-del-circolo >= 1]
        esito:
          titolo: La quercia nera
          testo: |
            Posi la foglia di quercia nera sulla stoffa, e Cerya la riconosce
            al tatto prima che tu dica che cos'è. «Il Bosco» dice, e la mette
            al centro della miscela, con le erbe di Tuarmir intorno. Quando te
            la legano dietro la nuca, Cerya ti mette in mano una manciata di
            monete per la raccolta fatta.
          pe: { natura: 5 }
          almeno: { rep.tuarmir: 2 }
          effetti: { fazione.tuarmir: 1, oggetto.tuarmir-maschera-d-erbe: 1, monete: 15, traccia.forno: 1, traccia.stele: 1 }

  # ------------------------------------------------------------ 3 → 4 · il libro di Lonn Var
  - id: tuarmir-il-libro-di-lonn-var
    presso: tuarmir
    immagine: icone/swap-bag
    titolo: Il libro di Lonn Var
    sommario: "Nell'ora di sole arriva il mulo di Lonn Var. Fenno, un ragazzo del villaggio, manca da due notti, e sua madre guarda il mercante."
    luogo: Tuarmir, lo slargo in fondo alla scala grande
    area: superficie-fratturata
    requisiti: [fazione.tuarmir == 3]
    testo: |
      Nell'ora di sole arriva nello slargo in fondo alla scala grande il mulo di Lonn Var. Il mercante ha un
      panciotto di velluto liso e il libro dei conti aperto sul basto, e a Tuarmir è l'unico che parla forte.
      «Lonn Var, per servirti» dice a chiunque passi, e conta le ceste con la matita.

      Dal seccatoio scende Madre Cerya al braccio di una donna. È la madre di Fenno, un ragazzo del villaggio
      che manca da due notti. Ha chiesto a Cerya di mandare qualcuno a cercarlo, e Cerya le ha risposto che la
      Sella in cima alla gola va lasciata in pace. Adesso la donna guarda il mercante, e il mercante guarda le
      ceste.

      {percezione Media} Nel libro c'è una pagina con l'ultima riga scritta a matita più fresca delle altre, e
      Lonn Var la copre con il palmo mentre parla.

      {origine mercante-dei-ponti} Il libro ha le colonne della Gilda, con gli anticipi in rosso a destra.
    opzioni:
      - testo: "Leggere il libro da sopra la sua spalla"
        descrizione: "Lonn Var parla molto e muove le mani."
        prova: { attributo: mentale, abilita: percezione, difficolta: Media }
        successo:
          titolo: L'ultima riga
          testo: |
            Quando Lonn Var alza la mano per salutare un cliente leggi l'ultima
            riga della pagina. C'è scritto *F., un cesto dalla Sella,
            anticipo*, con la data di tre giorni fa. Lo dici a Cerya piano, e
            Lonn Var sente lo stesso. Si stringe nelle spalle e ammette di
            aver anticipato al ragazzo qualche moneta per un cesto di funghi
            grigi, di quelli che crescono lassù da qualche luna e che in città
            pagano bene.
          pe: { percezione: 3 }
          effetti: { fazione.tuarmir: 1, rep.tuarmir: 0.5 }
        fallimento:
          titolo: Il libro chiuso
          testo: |
            Ti avvicini troppo, e Lonn Var chiude il libro con un colpo secco,
            così vicino alle tue dita da sentirne l'aria. Ride forte, e tutto lo
            slargo si volta. Poi, siccome il ragazzo comunque non torna,
            ammette di avergli anticipato qualche moneta per un cesto di funghi
            grigi della Sella, quelli che in città pagano bene.
          effetti: { fazione.tuarmir: 1, sospetto: 0.5 }
      - testo: "Fargli alzare la voce davanti al villaggio"
        descrizione: "Lonn Var grida per mestiere, e se grida la cosa sbagliata la sentono tutti."
        prova: { attributo: sociale, abilita: [ingannare, intimidire], difficolta: Media }
        successo:
          titolo: La voce del mercante
          testo: |
            Gli dici a mezza voce che in città i funghi grigi li compra la
            Caserma, per le prove. Lonn Var ti risponde gridando che i suoi
            funghi li compra gente che paga, e che il ragazzo l'ha pagato in
            anticipo per un cesto della Sella. Lo sente tutto lo slargo, e la
            madre di Fenno si copre la faccia con la maschera.
          pe: { ingannare: 3 }
          effetti: { fazione.tuarmir: 1, rep.tuarmir: 0.5 }
        fallimento:
          titolo: Il sorriso
          testo: |
            Lonn Var ti ascolta sorridendo e ti risponde a voce bassissima,
            imitando la gente del villaggio, finché due ragazzi ridono di te.
            Poi però la madre di Fenno gli si pianta davanti, e lui ammette
            l'anticipo per un cesto di funghi grigi della Sella.
          effetti: { fazione.tuarmir: 1, scandalo: 0.5 }
      - testo: "Chiedere agli amici di Fenno"
        descrizione: "Sulla scala grande ci sono tre ragazzi dell'età di Fenno, che guardano il mulo e fingono di non ascoltare."
        prova: { attributo: sociale, abilita: [conoscenze-della-strada, empatia], difficolta: Media }
        successo:
          titolo: La città
          testo: |
            Ti siedi sulla scala con i ragazzi e racconti della città e dei
            Ponti, finché il più piccolo ti dice che Fenno voleva andarci a
            vivere. Lonn Var gli aveva promesso il viaggio sul mulo in cambio
            di un cesto di funghi grigi della Sella. È salito tre giorni fa,
            prima dell'alba.
          pe: { conoscenze-della-strada: 3 }
          effetti: { fazione.tuarmir: 1, rep.tuarmir: 0.5 }
        fallimento:
          titolo: I ragazzi
          testo: |
            I ragazzi ti ascoltano con la faccia chiusa e poi se ne vanno su
            per la scala uno alla volta. L'ultimo, voltandosi, ti dice di
            chiedere al mercante del cesto di Fenno, e scappa prima che tu
            possa chiedergli quale cesto. Lonn Var, messo alle strette, ammette
            l'anticipo per i funghi grigi della Sella.
          effetti: { fazione.tuarmir: 1, sospetto: 0.5 }
      - testo: "Comprargli un sacchetto e una risposta"
        descrizione: "Lonn Var è un mercante, e a un cliente risponde volentieri. Il sacchetto col nastro viola costa caro."
        requisiti: [monete >= 15]
        esito:
          titolo: Il nastro viola
          testo: |
            Gli conti le monete in mano, e lui ti dà il sacchetto con il nastro
            viola e la risposta insieme, come un omaggio. Il ragazzo è salito
            alla Sella con un suo anticipo, per un cesto di funghi grigi che
            crescono lassù da qualche luna. In città li fumano nei salotti
            buoni, e li pagano come argento.
          effetti: { fazione.tuarmir: 1, monete: -15, informazioni.pettegolezzo: 1 }
      - testo: "Chiedergli il libro come si chiede al banco"
        descrizione: "Fra gente con la licenza della Gilda il libro dei conti si mostra, quando l'altro lo chiede con le parole giuste."
        quando: [origine.mercante-dei-ponti >= 1]
        esito:
          titolo: Fra colleghi
          testo: |
            Gli chiedi di vedere la colonna degli anticipi con la formula del
            banco, e Lonn Var ride e ti passa il libro, perché davanti a un
            collega rifiutare sarebbe peggio. In rosso c'è *F., un cesto dalla
            Sella*. Il ragazzo è salito tre giorni fa per i funghi grigi che in
            città pagano come argento.
          pe: { politica-ed-economia: 3 }
          effetti: { fazione.tuarmir: 1, rep.tuarmir: 0.5 }

  # ------------------------------------------------------------ 4 → 5 · Fenno sotto la Sella
  - id: tuarmir-fenno-sotto-la-sella
    presso: tuarmir
    immagine: ambientazione/tuarmir
    titolo: Fenno sotto la Sella
    sommario: "Più su, seduto nel muschio, c'è un ragazzo con un cesto accanto."
    luogo: Tuarmir, sopra le ultime case
    area: superficie-fratturata
    requisiti: [fazione.tuarmir == 4]
    testo: |
      Sopra gli ultimi terrazzi la scala finisce contro un sasso piatto con una croce di calce, dove finisce
      anche la raccolta di Tuarmir. Ilenia si ferma lì.

      Più su ci sono soltanto muschio e roccia, e il vento freddo ti spinge verso la cima. Sulle pietre c'è
      una crosta bianca che scricchiola sotto gli stivali. Dopo un'ora trovi Fenno seduto in una conca d'erba
      con la maschera in grembo e la faccia rivolta a nord-est. Accanto ha un cesto pieno di funghi grigi. Ha
      le labbra spaccate e sorride senza voltarsi. «Lo senti, il mare?»

      {natura Difficile} I funghi grigi crescono sulla crosta bianca, che è sale. Su questa montagna il sale
      non c'era.

      {origine fuggiasco-di-ghoran} Ha delle monete cucite nel colletto, come facevano a Ghoran quelli che
      volevano scappare.
    opzioni:
      - testo: "Svegliarlo con l'acqua e la maschera"
        descrizione: "Acqua sulle labbra, la maschera sul naso, e lontano da quell'odore."
        prova: { attributo: mentale, abilita: medicina, difficolta: Media }
        successo:
          titolo: L'acqua
          testo: |
            Gli bagni le labbra goccia a goccia e gli leghi la maschera sulla
            faccia. Dopo un poco Fenno si mette a piangere senza sapere
            perché, e si lascia portare giù per mano, con il cesto dei funghi
            grigi che porti tu. Al sasso con la croce Ilenia lo abbraccia e
            gli dà uno scappellotto, in quest'ordine.
          pe: { medicina: 3 }
          imposta: { tuarmir.cesto: 1 }
          effetti: { fazione.tuarmir: 1, rep.tuarmir: 0.5 }
        fallimento:
          titolo: Il morso
          testo: |
            Quando gli avvicini la maschera Fenno ti morde la mano e si mette a
            urlare che vuole restare a guardare il mare. Lo trascini giù mezzo di
            peso, con il cesto sottobraccio, e al sasso con la croce Ilenia ti
            aiuta a tenerlo.
          imposta: { tuarmir.cesto: 1 }
          effetti: { fazione.tuarmir: 1, ferite: 0.5 }
      - testo: "Caricartelo in spalla e scendere"
        descrizione: "Un ragazzo di sedici anni pesa quanto un sacco di grano."
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Media }
        successo:
          titolo: Il sacco di grano
          testo: |
            Te lo carichi in spalla con il cesto infilato al braccio, e scendi
            un passo alla volta sulla crosta bianca. A metà strada Fenno
            comincia a protestare che sa camminare da solo, e tu lo rimetti
            giù solo al sasso con la croce, dove Ilenia lo aspetta con
            l'acqua.
          pe: { atletica: 3 }
          imposta: { tuarmir.cesto: 1 }
          effetti: { fazione.tuarmir: 1, rep.tuarmir: 0.5 }
        fallimento:
          titolo: La crosta
          testo: |
            Sulla crosta di sale il piede ti parte e scivolate per un tratto
            con il ragazzo addosso. Il cesto rotola e si ferma contro un
            sasso. Recuperi il ragazzo e i funghi e arrivi al sasso con la
            croce zoppicando.
          imposta: { tuarmir.cesto: 1 }
          effetti: { fazione.tuarmir: 1, ferite: 0.5 }
      - testo: "Parlargli del mare finché non ti segue"
        descrizione: "Vuole guardare il mare. Gli si può promettere un mare più in basso, dove c'è da bere."
        prova: { attributo: sociale, abilita: [empatia, persuasione], difficolta: Media }
        successo:
          titolo: Il mare più in basso
          testo: |
            Ti siedi accanto a lui e gli dici che il mare si vede meglio dal
            villaggio, nell'ora di sole, con una tazza in mano. Poi si alza da
            solo, si mette il cesto sotto il braccio e scende davanti a te,
            voltandosi ogni tanto verso la cima. Al sasso con la croce si ferma e
            si lascia abbracciare da Ilenia.
          pe: { empatia: 3 }
          imposta: { tuarmir.cesto: 1 }
          effetti: { fazione.tuarmir: 1, rep.tuarmir: 0.5 }
        fallimento:
          titolo: Seduti in due
          testo: |
            Gli parli del mare e del villaggio, e a un certo punto ti accorgi
            di essere sedut{o|a} accanto a lui con la faccia verso la cima, da un
            tempo che non sai dire. Ti scuoti, lo prendi per il braccio e lo
            porti giù insieme al cesto, con la testa che gira a te quanto a
            lui.
          imposta: { tuarmir.cesto: 1 }
          effetti: { fazione.tuarmir: 1, tormento: 0.5 }
      - testo: "Tornare a chiamare Ilenia e portarlo giù legato"
        descrizione: "Ilenia il sasso con la croce non lo passa, però la sua corda arriva fin lassù. Ci vuole tempo, e il cesto resta in cima."
        costo: 2
        esito:
          titolo: La corda
          testo: |
            Scendi fino al sasso, torni su con la corda di Ilenia e leghi Fenno
            alla vita, e lei lo tira dal basso mentre tu lo guidi da sopra. Ci
            vuole tutto il pomeriggio. Il cesto dei funghi grigi lo lasciate
            lassù, nella conca, con la faccia verso nord-est anche lui.
          imposta: { tuarmir.cesto: 0 }
          effetti: { fazione.tuarmir: 1, rep.tuarmir: 0.5 }
      - testo: "Svegliarlo con la corteccia amara del Bosco"
        descrizione: "Al Circolo chi si perde fra le spore del Bosco si sveglia masticando la corteccia amara."
        quando: [origine.figlio-del-circolo >= 1]
        esito:
          titolo: La corteccia
          testo: |
            Gli metti fra i denti un pezzo di corteccia amara e gli chiudi la
            bocca con la mano. Fenno fa una smorfia e sputa. Poi ti guarda per
            la prima volta con gli occhi suoi, e scende da solo con il cesto
            in mano. Al sasso con la croce Ilenia ti chiede che cosa gli hai
            dato.
          pe: { natura: 3 }
          imposta: { tuarmir.cesto: 1 }
          effetti: { fazione.tuarmir: 1, rep.tuarmir: 0.5 }
      - testo: "Fargli contare i sassi, come davanti al fungo della gola di sotto"
        descrizione: "Nella gola di sotto sei passat{o|a} accanto a un fungo da non guardare contando le pietre del sentiero."
        quando: [fazione.velo >= 11]
        esito:
          titolo: Le pietre
          testo: |
            Gli giri la faccia verso il sentiero e gli fai contare le pietre
            ad alta voce, una per passo. Alla trentesima Fenno conta da solo,
            e alla sessantesima siete al sasso con la croce. Il cesto dei
            funghi grigi lo porti tu, sottobraccio.
          pe: { resilienza: 3 }
          imposta: { tuarmir.cesto: 1 }
          effetti: { fazione.tuarmir: 1, rep.tuarmir: 0.5 }

  # ------------------------------------------------------------ 5 → 6 · il raccolto lasciato in pace (grado 2)
  - id: tuarmir-il-raccolto-lasciato-in-pace
    presso: tuarmir
    immagine: ambientazione/tuarmir
    titolo: Il raccolto lasciato in pace
    sommario: "Nella grotta grande il villaggio si riunisce. Lonn Var vuole i funghi della Sella, Madre Cerya non ha ancora parlato."
    luogo: Tuarmir, la grotta grande sotto il villaggio
    area: superficie-fratturata
    requisiti: [fazione.tuarmir == 5]
    testo: |
      Nella grotta grande sotto il villaggio si tengono le adunanze, e stasera ci sono tutti con le lanterne
      accanto. Fenno sta in fondo con una coperta sulle spalle, e sua madre non gli lascia la mano. Madre
      Cerya siede contro la parete e non ha ancora detto una parola.

      Lonn Var invece parla in piedi a voce piena. Secondo lui nei salotti dei Quartieri Alti i funghi grigi
      della Sella valgono più di un anno di salvia, e lui ne compra quanti ne portano pagando in anticipo.
      Alle sue spalle un uomo grande con la giubba da mulattiere mastica resina. Ilenia ti dice all'orecchio
      che è Ruvo Gessan, il capocarovana.

      {politica-ed-economia Media} Se in città li pagano come argento, lui li rivende a dieci volte tanto.

      Cerya alza appena la testa verso di te. *Vuole sentire il forestiero, perché qui non ha debiti con
      nessuno.*

      {origine fuggiasco-di-ghoran} I ragazzi in prima fila guardano la borsa del mercante come a Ghoran si
      guardava il pane del sorvegliante.
    opzioni:
      - testo: "Parlare ai ragazzi di Fenno e della Sella"
        descrizione: "Fenno è lì, con le labbra ancora spaccate. Basta raccontare com'era seduto lassù."
        prova: { attributo: sociale, abilita: [persuasione, empatia], difficolta: Media }
        successo:
          titolo: Com'era lassù
          testo: |
            Racconti di Fenno seduto nella conca con la faccia verso la cima,
            senza aggiungere niente. Quando arrivi al mare i ragazzi in prima fila
            guardano Fenno, e Fenno guarda per terra. Allora Cerya parla, per la
            prima volta. «Quel raccolto va lasciato in pace.» Lonn Var sorride e
            dice che aspetterà, tanto i funghi non scappano. Uscendo, Cerya ti
            dice che da stasera il seccatoio per te è come casa, e Ilenia ti dà la
            tua parte della raccolta.
          pe: { persuasione: 5 }
          almeno: { rep.tuarmir: 4 }
          effetti: { fazione.tuarmir: 1, monete: 20 }
        fallimento:
          titolo: Il mare di Fenno
          testo: |
            Racconti di Fenno, e alla parola mare un ragazzo ride, e dopo di lui
            un altro. Fenno si alza ed esce. Cerya allora alza la mano, e basta
            quello. «Quel raccolto va lasciato in pace.» Lonn Var dice che
            aspetterà. Uscendo, Cerya ti dice che hai parlato male e che il
            seccatoio per te da stasera è come casa lo stesso, e Ilenia ti dà la
            tua parte della raccolta.
          pe: { persuasione: 3 }
          almeno: { rep.tuarmir: 4 }
          effetti: { fazione.tuarmir: 1, monete: 20, scandalo: 0.5 }
      - testo: "Far vedere il cesto di Fenno"
        descrizione: "I funghi grigi sono cresciuti sul sale, e il sale si vede. Basta passarne uno di mano in mano."
        quando: [tuarmir.cesto >= 1]
        prova: { attributo: mentale, abilita: [natura, medicina], difficolta: Media }
        successo:
          titolo: Il sale
          testo: |
            Passi un fungo grigio alla prima fila e chiedi di leccarsi il dito
            dopo averlo toccato. Lo fanno in tre, e sputano. La grotta mormora, e
            Cerya parla. «Quel raccolto va lasciato in pace.» Lonn Var dice che
            aspetterà. Uscendo, Cerya ti dice che da stasera il seccatoio per te è
            come casa, e Ilenia ti dà la tua parte della raccolta.
          pe: { natura: 5 }
          almeno: { rep.tuarmir: 4 }
          effetti: { fazione.tuarmir: 1, monete: 20 }
        fallimento:
          titolo: Il fungo che gira
          testo: |
            Il fungo passa di mano in mano e nessuno capisce che cosa dovrebbe
            vedere, finché un ragazzo lo annusa troppo a lungo e si siede.
            Cerya alza la mano. «Quel raccolto va lasciato in pace.» Lonn Var
            dice che aspetterà. Uscendo Cerya ti dice che il seccatoio per te
            da stasera è come casa, e Ilenia ti dà la tua parte della raccolta.
          pe: { natura: 3 }
          almeno: { rep.tuarmir: 4 }
          effetti: { fazione.tuarmir: 1, monete: 20, tormento: 0.5 }
      - testo: "Mettere Lonn Var davanti ai suoi conti"
        descrizione: "Quanto paga un cesto e quanto lo rivende. Detto ad alta voce, il conto lo fanno anche i ragazzi."
        prova: { attributo: mentale, abilita: politica-ed-economia, difficolta: Media }
        successo:
          titolo: Il conto
          testo: |
            Fai a voce bassa il conto dell'anticipo e del prezzo in città
            scandendo bene le parole, e la grotta lo ripete in un mormorio.
            Lonn Var non lo nega e ride, perché il mestiere è quello. Cerya
            parla. «Quel raccolto va lasciato in pace.» Lonn Var dice che
            aspetterà. Uscendo, Cerya ti dice che da stasera il seccatoio per
            te è come casa, e Ilenia ti dà la tua parte della raccolta.
          pe: { politica-ed-economia: 5 }
          almeno: { rep.tuarmir: 4 }
          effetti: { fazione.tuarmir: 1, monete: 20 }
        fallimento:
          titolo: Il conto sbagliato
          testo: |
            Sbagli il prezzo della città, e Lonn Var ti corregge al rialzo,
            ridendo, così i ragazzi sentono il numero giusto, che è anche
            peggio. Cerya alza la mano. «Quel raccolto va lasciato in pace.»
            Lonn Var dice che aspetterà. Uscendo, Cerya ti dice che il seccatoio
            per te è come casa, e Ilenia ti dà la tua parte della raccolta.
          pe: { politica-ed-economia: 3 }
          almeno: { rep.tuarmir: 4 }
          effetti: { fazione.tuarmir: 1, monete: 20, scandalo: 0.5 }
      - testo: "Lasciare che parli soltanto Cerya"
        descrizione: "A Tuarmir l'ultima parola è sua, e forse anche la prima. Il forestiero può tacere."
        esito:
          titolo: Una frase sola
          testo: |
            Stai zitt{o|a}, e Cerya aspetta ancora un poco. Poi dice una frase sola.
            «Quel raccolto va lasciato in pace.» Il villaggio obbedisce, perché
            è lei, ma i ragazzi in prima fila guardano te, che non hai detto
            niente. Lonn Var dice che aspetterà. Uscendo Cerya ti dice che il
            seccatoio per te è come casa, e Ilenia ti dà la tua parte.
          almeno: { rep.tuarmir: 4 }
          effetti: { fazione.tuarmir: 1, monete: 20 }
      - testo: "Dire ai ragazzi che cosa costa un anticipo"
        descrizione: "Un anticipo si restituisce con quello che chiede chi l'ha dato. A Ghoran lo hai imparato sulla tua pelle."
        quando: [origine.fuggiasco-di-ghoran >= 1]
        esito:
          titolo: Il prezzo dell'anticipo
          testo: |
            Racconti ai ragazzi di come a Ghoran un debito diventa una corda,
            e la corda un collare, con le parole più semplici che hai. Ruvo
            Gessan smette di masticare. Cerya parla. «Quel raccolto va
            lasciato in pace.» Lonn Var dice che aspetterà. Uscendo, Cerya ti
            dice che il seccatoio per te è come casa, e Ilenia ti dà la tua
            parte della raccolta.
          pe: { intimidire: 5 }
          almeno: { rep.tuarmir: 4 }
          effetti: { fazione.tuarmir: 1, monete: 20 }
