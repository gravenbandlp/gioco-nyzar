# Tuarmir come luogo della Superficie Fratturata (piano-superficie.md, «I villaggi»): si vede dopo la fine dell'Arena.
# - `tuarmir-la-raccolta`: l'attività ripetibile, a fasce di rep.tuarmir (< 2, 2-4, 4-6, >= 6). Rende poco (qualche
#   moneta, voci, un unguento, ogni tanto un reperto trovato sotto il muschio) e alza la reputazione di ½ fino a 6; sopra
#   il 6 la alzano solo i gradi della quest. Le ripetibili non danno negative quando falliscono.
# - `tuarmir-il-seccatoio`: il servizio. I fumi di Madre Cerya contro la Marea e contro il Tormento, e gli unguenti
#   della raccolta; dal grado 2 della quest (fazione.tuarmir >= 6) al prezzo del villaggio.
luoghi:
  - id: tuarmir
    area: superficie-fratturata
    nome: Tuarmir
    immagine: ambientazione/tuarmir
    requisiti: [pista.arena >= 5]
    sommario: "Il villaggio delle erbe, scavato nelle pareti di una gola dove il sole arriva poche ore al giorno."
    testo: |
      La strada scende fra due pareti di roccia scura che si stringono a ogni curva, finché il cielo diventa una
      striscia sopra la testa. Tuarmir sta nelle pareti stesse, case-grotta con le porte di legno grigio e il
      muschio sopra gli architravi, e sotto le case la gola scende per terrazzi di erbe fino a dove la luce non
      arriva. La gente parla piano, e senza accorgertene abbassi la voce anche tu.

storylet:
  # ------------------------------------------------------------ l'attività ripetibile
  - id: tuarmir-la-raccolta
    presso: tuarmir
    immagine: ambientazione/tuarmir
    titolo: La raccolta
    sommario: "Fra i terrazzi e il seccatoio c'è sempre un lavoro da fare, pagato poco."
    luogo: Tuarmir, i terrazzi sotto le case
    area: superficie-fratturata
    ripetibile: true
    requisiti: [pista.arena >= 5]
    testo: |
      La mattina le raccoglitrici scendono ai terrazzi con le ceste sulla
      schiena. Ilenia distribuisce i lavori contando i nomi sui nodi della
      sua maschera, e chi è nuovo prende quello che resta.

      {natura Facile} Le erbe si tagliano sopra il primo nodo dello stelo,
      così ricrescono. Qui lo sanno anche i bambini, e ti guardano le mani
      per vedere se lo sai anche tu.
    opzioni:
      - testo: "Tagliare muschio con le raccoglitrici"
        descrizione: "Il muschio della parete va tagliato a strisce senza strapparlo, sotto gli occhi delle raccoglitrici vecchie."
        requisiti: [rep.tuarmir < 2]
        prova: { attributo: mentale, abilita: natura, difficolta: Facile }
        successo:
          titolo: Le strisce verdi
          testo: |
            Tagli il muschio a strisce lunghe un braccio senza strappare le
            radici, e la vecchia accanto a te smette presto di guardarti le mani.
            A mezzogiorno Ilenia ti mette in tasca uno spicciolo.
          effetti: { monete: 1, rep.tuarmir: 0.5 }
        fallimento:
          titolo: Le radici
          testo: |
            Al primo taglio strappi un ciuffo con tutte le radici, e la vecchia
            accanto a te lo rimette contro la parete. Per oggi Ilenia ti manda a
            portare l'acqua.
      - testo: "Portare le ceste su per le scale"
        descrizione: "Dai terrazzi al seccatoio ci sono centoventi gradini scavati nella roccia e coperti di muschio bagnato."
        requisiti: [rep.tuarmir < 2]
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Media }
        successo:
          titolo: Centoventi gradini
          testo: |
            Porti su le ceste con la cinghia sulla fronte come fanno qui, e sulla
            porta del seccatoio un ragazzo ti dà una moneta ogni due ceste.
          effetti: { monete: 2, rep.tuarmir: 0.5 }
        fallimento:
          titolo: Il gradino bagnato
          testo: |
            Al terzo viaggio un gradino bagnato ti manda giù sul ginocchio, e
            mezza cesta di salvia finisce sui terrazzi di sotto, da raccogliere
            foglia per foglia.
      - testo: "Legare i mazzi nel seccatoio"
        descrizione: "Le erbe si legano a mazzi uguali con lo spago lento, e Cerya li controlla al tatto uno per uno."
        requisiti: [rep.tuarmir >= 2, rep.tuarmir < 4]
        prova: { attributo: mentale, abilita: [medicina, natura], difficolta: Media }
        successo:
          titolo: I mazzi giusti
          testo: |
            Leghi mazzi di cardo del sonno tutti della stessa grandezza, con lo
            spago a due giri. Madre Cerya li passa con le dita e dice che va bene,
            e Ilenia ti paga la giornata.
          effetti: { monete: 3, rep.tuarmir: 0.5 }
        fallimento:
          titolo: Lo spago stretto
          testo: |
            Stringi lo spago troppo e i gambi si piegano. Cerya scioglie i tuoi
            nodi e li rifà senza una parola, poi ti lascia lo spago in mano.
      - testo: "Accompagnare il mulo fino alla piana"
        descrizione: "Le ceste dei funghi partono sul mulo di Lonn Var per un sentiero stretto, e il mulo va convinto."
        requisiti: [rep.tuarmir >= 2, rep.tuarmir < 4]
        prova: { attributo: sociale, abilita: [addestrare-animali, persuasione], difficolta: Media }
        successo:
          titolo: Il mulo testardo
          testo: |
            Il mulo si muove soltanto se gli cammini davanti senza guardarlo. Alla
            piana il mulattiere di Lonn Var conta le ceste e ti allunga qualche
            moneta e una notizia della città.
          effetti: { monete: 2, informazioni.voce: 1, rep.tuarmir: 0.5 }
        fallimento:
          titolo: Mezza giornata
          testo: |
            Il mulo si siede a metà sentiero, e ci vuole mezza giornata per
            convincerlo a rialzarsi. Alla piana il mulattiere ti guarda arrivare
            senza dire niente.
      - testo: "Cercare il fungo di mezzogiorno"
        descrizione: "Cresce soltanto dove il sole tocca la gola nell'ora di luce, e appassisce prima di sera."
        requisiti: [rep.tuarmir >= 4, rep.tuarmir < 6]
        prova: { attributo: mentale, abilita: [percezione, natura], difficolta: Media }
        successo:
          titolo: L'ora di luce
          testo: |
            Cammini sotto la parete nell'ora di sole e trovi i funghi gialli dove
            la luce batte da più tempo. Cerya ne prende sette e te ne regala un
            vasetto di unguento.
          effetti: { unguento: 1, rep.tuarmir: 0.5 }
        fallimento:
          titolo: L'ora persa
          testo: |
            Cerchi dalla parte sbagliata della gola, e quando te ne accorgi la
            luce è già risalita sulla parete di fronte.
      - testo: "Riconoscere le erbe al tatto, a occhi chiusi"
        descrizione: "Madre Cerya insegna così ai novizi, bendandoli con la loro maschera e mettendogli in mano un mazzo misto."
        requisiti: [rep.tuarmir >= 4, rep.tuarmir < 6]
        prova: { attributo: mentale, abilita: [natura, medicina], difficolta: Difficile }
        successo:
          titolo: Al tatto
          testo: |
            A occhi bendati riconosci la salvia d'argento dalla peluria e il cardo
            dalla spina sotto la foglia. Cerya ti tocca la fronte con le dita
            verdi, che a Tuarmir vale quanto un nome scritto.
          pe: { natura: 2 }
          effetti: { rep.tuarmir: 0.5, monete: 2 }
        fallimento:
          titolo: La menta e l'ortica
          testo: |
            Scambi l'ortica di roccia per la menta e ti ritrovi con le dita che
            bruciano. Cerya ride piano e ti dice di annusare prima di toccare.
      - testo: "Fare la guardia ai seccatoi di notte"
        descrizione: "Di notte qualcuno sale a rubare i funghi dai seccatoi, e chi fa la guardia a volte trova cose."
        requisiti: [rep.tuarmir >= 6]
        prova: { attributo: fisico, abilita: [furtivita, percezione], difficolta: Media }
        successo:
          titolo: La notte sulle scale
          testo: |
            Passi la notte sulle scale del seccatoio, e verso l'alba un ragazzo di
            un altro villaggio scappa lasciandoti il sacco. Dentro ci sono funghi
            rubati e un guscio di metallo scuro, e Cerya si tiene i funghi e
            lascia a te il guscio.
          effetti: { reperto.sigillato: 1, monete: 2 }
        fallimento:
          titolo: Il sonno
          testo: |
            Ti addormenti sulle scale prima della seconda campana e ti svegli con
            il muschio stampato sulla guancia. Dal seccatoio, per fortuna,
            stanotte non è sparito niente.
      - testo: "Sedersi sulla soglia nell'ora di sole"
        descrizione: "Quando il sole entra nella gola il villaggio esce sulle soglie, e ci si siede ad ascoltare."
        esito:
          titolo: L'ora di sole
          testo: |
            Ti siedi su una soglia con la schiena contro il muschio tiepido, e per
            un'ora la gola chiacchiera piano fra le maschere stese. Una vecchia ti
            insegna a leggere la pioggia nel colore del muschio.
          pe: { natura: 2 }

  # ------------------------------------------------------------ il servizio · il seccatoio di Madre Cerya
  - id: tuarmir-il-seccatoio
    presso: tuarmir
    immagine: ambientazione/marea-grigia
    titolo: Il seccatoio di Madre Cerya
    sommario: "In cima al villaggio Madre Cerya brucia i muschi per chi ha addosso la Marea o le visioni."
    luogo: Tuarmir, il seccatoio in cima al villaggio
    area: superficie-fratturata
    ripetibile: true
    requisiti: [pista.arena >= 5]
    testo: |
      Il seccatoio è la grotta più alta del villaggio, con le erbe appese alle
      travi e un braciere di coccio in fondo. Chi sale con la Marea addosso o le
      notti piene di visioni si siede con la testa sotto un telo, e Madre Cerya
      gli tiene una mano sulla nuca finché il fumo non ha fatto il suo lavoro.
      Il prezzo lo dice Ilenia, perché Cerya di monete non parla.

      {origine accolito-del-velo} I muschi che in Cattedrale si bruciano per la
      purificazione vengono da questa grotta, dove li bruciano senza preghiere.
    opzioni:
      - testo: "Farti fare i fumi per la Marea"
        descrizione: "Mezz'ora sotto il telo con il muschio di gola, e la Marea si ritira di un passo."
        quando: [contaminazione >= 0.5]
        requisiti: [fazione.tuarmir < 6, monete >= 20]
        esito:
          titolo: Sotto il telo
          testo: |
            Respiri il fumo amaro sotto il telo finché gli occhi non ti lacrimano,
            e il sapore di ferro sotto la lingua si allontana.
          effetti: { contaminazione: -1, monete: -20 }
      - testo: "Farti fare i fumi per la Marea, come uno di casa"
        descrizione: "Chi raccoglie con il villaggio paga i fumi quanto li paga il villaggio."
        quando: [contaminazione >= 0.5]
        requisiti: [fazione.tuarmir >= 6, monete >= 10]
        esito:
          titolo: Il prezzo di casa
          testo: |
            Cerya ti fa sedere sullo sgabello buono, quello con lo schienale, e
            Ilenia prende soltanto metà del solito.
          effetti: { contaminazione: -1, monete: -10 }
      - testo: "Farti fare i fumi per la testa"
        descrizione: "Un'erba più dolce sulla brace, per chi dorme male e vede cose, e il Tormento cala."
        quando: [tormento >= 0.5]
        requisiti: [fazione.tuarmir < 6, monete >= 15]
        esito:
          titolo: Il cardo del sonno
          testo: |
            Sulla brace Cerya mette il cardo del sonno, e sotto il telo il fumo
            bianco scioglie le immagini delle ultime notti.
          effetti: { tormento: -1, monete: -15 }
      - testo: "Farti fare i fumi per la testa, come uno di casa"
        descrizione: "Il cardo del sonno al prezzo del villaggio."
        quando: [tormento >= 0.5]
        requisiti: [fazione.tuarmir >= 6, monete >= 8]
        esito:
          titolo: Il fumo bianco
          testo: |
            Il fumo del cardo ti scioglie le spalle prima della testa. Cerya ti
            chiede se hai sognato, e tu le dici di no, che qui è il complimento
            migliore.
          effetti: { tormento: -1, monete: -8 }
      - testo: "Comprare un vasetto di unguento della raccolta"
        descrizione: "Unguento di salvia d'argento e grasso di capra, che chiude i tagli in una notte."
        requisiti: [fazione.tuarmir < 6, monete >= 18]
        costo: 0
        esito:
          titolo: L'unguento
          testo: |
            Ilenia ti dà un vasetto di coccio chiuso con la cera verde e conta le
            monete nel piattino.
          effetti: { unguento: 1, monete: -18 }
      - testo: "Comprare un vasetto di unguento al prezzo di casa"
        descrizione: "Lo stesso vasetto, a chi raccoglie con il villaggio."
        requisiti: [fazione.tuarmir >= 6, monete >= 11]
        costo: 0
        esito:
          titolo: La cera verde
          testo: |
            Ilenia ti mette in mano il vasetto prima che tu lo chieda, e il
            piattino lo guarda appena.
          effetti: { unguento: 1, monete: -11 }
      - testo: "Restare a sentire Cerya che parla del vento"
        descrizione: "Mentre il muschio brucia Cerya parla, a chi ha la pazienza di sedersi."
        esito:
          titolo: Il naso di Cerya
          testo: |
            Cerya ti racconta del vento della sera, che sale dai terrazzi e sa di
            salvia, e di quello delle piogge, che arriva dalla piana. Dice di
            imparare i venti dal naso, perché gli occhi si ingannano.
          pe: { natura: 2 }

colonna:
  - { contesto: luogo, id: tuarmir, musica: unsettling-paths, ambiente: village }
