# La quest di Laresh, fine dell'Atto IV e Atto V (fazione.laresh 11 → 15). Il passo 11 è la spedizione
# (spedizione-campo.yaml).
# - 11 → 12 `laresh-l-acqua-nel-rio-di-mezzo` (grado 4, Guardiano del rio): il rio torna a scorrere, il secondo
#   battito tace. La botola si mura (laresh.camera 1) o la camera va ai Raschiatori di Oreste Ruffo (2). La giubba
#   delle spigolatrici.
# - 12 → 13 `laresh-le-impronte-nel-grano-nuovo`: buche fonde un braccio a tre passi l'una dall'altra, ogni notte più
#   vicine al mulino. È il Seminatore, la macchina che lasciava le impronte sulle rotaie del campo pallido (una
#   stanza della spedizione, che il giocatore può non aver visto: le scene non la danno per scontata).
#   Con laresh.ilio 2 Ilio è tornato per la mietitura, come diceva il contratto.
# - 13 → 14 `laresh-la-notte-della-mietitura`: il boss finale. Il Seminatore entra nei campi la notte della
#   mietitura delle lanterne; combattimento o tre vie Difficili (il rio, la muta di Cahir, la piastra sul dorso).
# - 14 → 15 `laresh-il-primo-pane` (grado 5, Primo pane): la festa del primo pane, l'ultima lettura di Marrek, la
#   carovana di Cahir che parte. La Falce della chiusa e dono.laresh. Varianti con pista.pelle (Anselmo Brey alla
#   festa, o la pagnotta per Ugolino Carrà) e per il Mercante dei Ponti.
storylet:
  # ------------------------------------------------------------ 11 → 12 · l'acqua nel rio di mezzo (grado 4)
  - id: laresh-l-acqua-nel-rio-di-mezzo
    presso: laresh
    immagine: ambientazione/laresh
    titolo: L'acqua nel rio di mezzo
    sommario: "Dopo la chiusa il rio di mezzo corre più alto e più chiaro, e sotto la macina il secondo battito tace."
    luogo: Laresh, il mulino centrale e il rio di mezzo
    area: superficie-fratturata
    requisiti: [fazione.laresh == 11]
    testo: |
      Il mattino dopo il rio di mezzo corre più alto di un palmo, così chiaro
      che dal ponticello si vedono i sassi del fondo. Nella striscia bruciata
      Tano trova un filo d'erba verde, e la sera i fuochi azzurri sopra i
      campi sono pochi e galleggiano ognuno per conto suo, come lucciole
      stanche.

      Marrek ha fatto ripartire la macina all'alba, e quando arrivi non si
      volta. «Adesso sento soltanto lei» dice. «Avevo dimenticato com'era.»

      Sull'aia ti aspetta Oreste Ruffo con due Raschiatori e un carro vuoto.
      La voce della camera sotto la macina è arrivata fino al Grifone, e i
      Raschiatori pagano il villaggio per portare su il metallo e le ossa del
      custode. La Dama non vuole più sentir parlare di quel buco, e ti guarda
      come si guarda chi ci è sceso.

      {politica-ed-economia Media} Quello che i Raschiatori pagano basta a
      ricomprare la semente dei campi a nord. La Dama lo sa, e le costa
      saperlo.

      Sotto il portico le spigolatrici ti aspettano con qualcosa piegato
      sulle ginocchia.
    opzioni:
      - testo: "Murare la botola sotto la macina"
        descrizione: "Un muro di pietra e calce sopra la scala dei mugnai, e il mulino gira sopra."
        esito:
          titolo: Il muro sotto la macina
          testo: |
            Ruffo alza le spalle e riparte con il carro vuoto, e nel pomeriggio tu
            e Tano murate la botola con le pietre del rio, e l'ultima la mette
            Marrek. La sera le spigolatrici ti danno una giubba di cuoio cucita
            doppio, con un punto di ognuna, e la Dama scrive il tuo nome accanto
            al rio di mezzo e ti paga bene.
          imposta: { laresh.camera: 1 }
          almeno: { rep.laresh: 8 }
          effetti: { fazione.laresh: 1, monete: 120, oggetto.laresh-giubba-delle-spigolatrici: 1 }
      - testo: "Dare la camera ai Raschiatori di Ruffo"
        descrizione: "I Raschiatori pagano la semente dei campi a nord, e il metallo sotto terra non serve a nessuno."
        esito:
          titolo: Il carro dei Raschiatori
          testo: |
            Ruffo accetta di pagare la semente dei campi a nord e stringe la mano
            alla Dama, che la ritira in fretta, e per tre giorni i Raschiatori
            salgono dalla botola con i sacchi pieni. La sera le spigolatrici ti
            danno una giubba di cuoio cucita doppio, e la Dama scrive il tuo nome
            accanto al rio di mezzo e ti paga bene.
          imposta: { laresh.camera: 2 }
          almeno: { rep.laresh: 8 }
          effetti: { fazione.laresh: 1, monete: 120, oggetto.laresh-giubba-delle-spigolatrici: 1, rep.raschiatori: 0.5 }
      - testo: "Lasciare la scelta a Marrek"
        descrizione: "Il mulino è suo da quarant'anni, e la botola sta sotto la sua macina."
        esito:
          titolo: Il mugnaio decide
          testo: |
            Marrek ascolta Ruffo con la mano sulla macina, poi dice che sotto il
            suo mulino da oggi non scende più nessuno, e Ruffo riparte con il
            carro vuoto. Murate la botola tu e Tano, e la sera le spigolatrici ti
            danno una giubba di cuoio cucita doppio, mentre la Dama scrive il tuo
            nome accanto al rio di mezzo e ti paga bene.
          imposta: { laresh.camera: 1 }
          almeno: { rep.laresh: 8 }
          effetti: { fazione.laresh: 1, monete: 120, oggetto.laresh-giubba-delle-spigolatrici: 1 }

  # ------------------------------------------------------------ 12 → 13 · le impronte nel grano nuovo
  - id: laresh-le-impronte-nel-grano-nuovo
    presso: laresh
    immagine: icone/footprint
    titolo: Le impronte nel grano nuovo
    sommario: "Ai margini dei campi a nord la terra è bucata da fori tondi, e ogni notte sono più vicini al mulino."
    luogo: Laresh, i campi a nord, all'alba
    area: superficie-fratturata
    requisiti: [fazione.laresh == 12]
    testo: |
      Il grano dei campi a nord è tornato giallo. Una mattina il fattore ti
      mostra dei fori tondi nella terra, larghi quanto un piatto e profondi
      quanto un braccio, a coppie ogni tre passi, con il fondo secco come
      cenere. Vengono da nord in fila dritta, e ogni notte arrivano più
      avanti, puntati sul mulino centrale.

      I cani di Cahir hanno ricominciato a ululare con un verso corto e
      rabbioso, come contro un lupo, e un bracciante di guardia giura di aver
      visto una cosa alta come un fienile che beveva dalla terra su quattro
      pali.

      «Fra tre notti c'è la mietitura delle lanterne» dice la Dama. «A Laresh
      il primo grano si miete di notte da sempre, e quest'anno non cambio.»

      {origine figlio-del-circolo} Nel Bosco una pista si legge dal fondo
      dell'impronta, e qui il fondo è cotto, come se la cosa avesse bevuto
      anche l'umido.
    opzioni:
      - testo: "Fare la posta di notte al margine dei campi"
        descrizione: "Una notte nel fosso, con la lanterna spenta. Se la cosa viene, la vedi da vicino."
        prova: { attributo: fisico, abilita: furtivita, difficolta: Media }
        successo:
          titolo: Il Seminatore
          testo: |
            Dopo mezzanotte arriva da nord un corpo di metallo grande come una
            tramoggia su quattro trampoli lunghi tre uomini, che pianta nella
            terra per bere. È il metallo del custode della chiusa. Tano la chiama
            il Seminatore, e il nome resta.
          pe: { furtivita: 3 }
          effetti: { fazione.laresh: 1, rep.laresh: 0.5 }
        fallimento:
          titolo: Il trampolo
          testo: |
            Un trampolo si pianta a un passo dal tuo fosso e scappi a quattro
            zampe nel grano, e da lontano la vedi bere, lenta, su quattro pali
            alti come alberi. Tano la chiama il Seminatore, e il nome resta.
          effetti: { fazione.laresh: 1, tormento: 0.5 }
      - testo: "Misurare i fori e il passo"
        descrizione: "Contando i fori si sa quando la cosa arriva al mulino."
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Media }
        successo:
          titolo: Tre notti
          testo: |
            La cosa fa ogni notte lo stesso numero di passi, e a quel conto arriva
            al mulino fra tre notti, quella della mietitura. Tano la chiama il
            Seminatore, e il nome resta.
          pe: { tecnologia: 3 }
          effetti: { fazione.laresh: 1, rep.laresh: 0.5 }
        fallimento:
          titolo: Lo spago
          testo: |
            Il conto ti torna diverso ogni volta, finché un bracciante te lo rifà
            con le dita davanti a mezzo villaggio e arriva alla notte della
            mietitura. Tano chiama la cosa il Seminatore, e il nome resta.
          effetti: { fazione.laresh: 1, scandalo: 0.5 }
      - testo: "Mettere i cani di Cahir sulla pista"
        descrizione: "La muta trova le bestie al buio, e Cenere va dove gli si dice."
        prova: { attributo: sociale, abilita: addestrare-animali, difficolta: Media }
        successo:
          titolo: Cenere si ferma
          testo: |
            Cenere segue la fila dei fori fino a dove la cosa sta bevendo, e lì si
            ferma con il pelo ritto. Nella luce della lanterna vedi quattro trampoli
            lunghi tre uomini e un corpo come una tramoggia, e Tano, quando glielo
            racconti, la chiama il Seminatore.
          pe: { addestrare-animali: 3 }
          effetti: { fazione.laresh: 1, rep.laresh: 0.5 }
        fallimento:
          titolo: Il cane ferito
          testo: |
            Un trampolo scalcia Cenere nel grano, e lo riporti alle stalle in
            braccio mentre Cahir te lo prende senza una parola. Della cosa hai
            visto soltanto l'ombra, e Tano la chiama il Seminatore.
          effetti: { fazione.laresh: 1, tormento: 0.5 }
      - testo: "Chiedere a Ilio come si ferma una macchina di quelli di prima"
        descrizione: "Ilio Vardo è tornato per la mietitura, come diceva il contratto, e al Grifone ha imparato qualcosa."
        quando: [laresh.ilio == 2]
        esito:
          titolo: Dietro, alla piastra
          testo: |
            Ilio è tornato con un taglio nuovo sul sopracciglio, e ti dice che in
            Cicatrice le macchine si fermano premendo la piastra più fredda che
            hanno dietro. Quella notte la vedete insieme bere dalla terra, e Tano
            la chiama il Seminatore.
          effetti: { fazione.laresh: 1, rep.laresh: 0.5 }

  # ------------------------------------------------------------ 13 → 14 · la notte della mietitura (boss finale)
  - id: laresh-la-notte-della-mietitura
    presso: laresh
    immagine: bestiario/salvaguardia-precursori
    titolo: La notte della mietitura
    sommario: "Laresh miete il primo grano di notte, e a mezzanotte il Seminatore entra nei campi."
    luogo: Laresh, i campi a nord, la notte della mietitura delle lanterne
    area: superficie-fratturata
    requisiti: [fazione.laresh == 13]
    testo: |
      La notte della mietitura i campi a nord sono pieni di lanterne appese ai
      pali, e il villaggio intero miete in fila cantando piano la canzone
      della spiga. La Dama cammina dietro la fila contando i covoni, e Cahir
      tiene la muta legata al margine del campo.

      A mezzanotte i cani tacciono tutti insieme. Dal buio a nord arriva un
      rumore di pali piantati nella terra, uno ogni tre passi, e la canzone si
      ferma a metà di una strofa. Il Seminatore entra nella luce delle
      lanterne alto come un fienile, scavalca la fila dei mietitori e pianta
      un trampolo nel grano tagliato per bere, poi riparte verso il mulino
      centrale.

      {armi-da-mischia Media} Le giunture dei trampoli sono sottili, mentre il
      corpo sta troppo in alto per una falce.

      {resilienza Media fallita} La falce che hai in mano ti sembra
      all'improvviso un attrezzo da cucina, e le gambe ti chiedono il permesso
      di andarsene.

      *Se arriva al mulino sfonda il muro e riapre la chiusa.* La Dama manda
      le donne e i bambini verso l'aia, e la fila dei mietitori ti guarda.

      {origine fuggiasco-di-ghoran} Hai già visto una fila di gente ferma a
      guardare uno solo, con gli attrezzi in mano, e a Ghoran, quella volta,
      nessuno si è mosso.
    opzioni:
      - testo: "Affrontare il Seminatore fra i covoni"
        descrizione: "Quattro trampoli e un corpo di metallo grande come una tramoggia. Si colpiscono le giunture, finché qualcuna cede."
        combattimento: laresh-il-seminatore
        vittoria:
          titolo: Il fienile caduto
          testo: |
            Colpisci le giunture di un trampolo finché si piega, e il Seminatore
            cade di traverso sui covoni con un rumore di campana rotta. Dal corpo
            esce un filo di fango scuro che la terra non beve più, e i mietitori
            ricominciano a cantare dalla strofa dove si erano fermati.
          pe: { armi-da-mischia: 5 }
          effetti: { fazione.laresh: 1, rep.laresh: 1, racconto: 1, parte.impugnatura-2: 1 }
        sconfitta:
          titolo: Fino al mulino
          testo: |
            Un trampolo ti getta fra i covoni, e il Seminatore batte due volte
            contro il muro della botola, come se aspettasse una risposta. All'alba
            torna verso nord, e tornerà la notte dopo.
          effetti: { tormento: 0.5 }
      - testo: "Farlo entrare nel rio di mezzo con le lanterne"
        descrizione: "Il Seminatore va dove c'è da bere, e il fondo del rio è fango molle."
        prova: { attributo: mentale, abilita: natura, difficolta: Difficile }
        successo:
          titolo: Il fango del rio
          testo: |
            Metti le lanterne in fila lungo il rio e il Seminatore devia verso
            l'acqua, pianta un trampolo nel fango del fondo e affonda fino alla
            giuntura. Al secondo si inclina piano e cade di traverso nel rio con
            uno schianto che bagna mezzo villaggio.
          pe: { natura: 5 }
          effetti: { fazione.laresh: 1, rep.laresh: 1, racconto: 1, parte.impugnatura-2: 1 }
        fallimento:
          titolo: La riva
          testo: |
            Il Seminatore segue le lanterne fino alla riva, ma pianta un trampolo
            sull'argine e le scalcia nell'acqua, e una ti scoppia accanto alla
            faccia. All'alba torna verso nord, e tornerà la notte dopo.
          effetti: { ferite: 1, tormento: 1 }
      - testo: "Mandargli contro la muta di Cahir con le corde"
        descrizione: "Trenta cani da soma con le corde dei finimenti fra i denti, da guidare tutti insieme intorno ai trampoli."
        prova: { attributo: sociale, abilita: addestrare-animali, difficolta: Difficile }
        successo:
          titolo: Le corde dei finimenti
          testo: |
            Mandi la muta con il fischio, e i cani girano intorno ai trampoli con
            le corde fra i denti finché al terzo giro si stringono. Il Seminatore
            ondeggia a lungo e cade di traverso sui covoni.
          pe: { addestrare-animali: 5 }
          effetti: { fazione.laresh: 1, rep.laresh: 1, racconto: 1, parte.impugnatura-2: 1 }
        fallimento:
          titolo: I cani scalciati
          testo: |
            Le corde si attorcigliano al primo giro e il Seminatore scalcia via
            tre cani, e mentre Cahir richiama la muta con la voce rotta corri a
            raccogliere un cane che non si alza. All'alba la cosa torna verso
            nord, e tornerà la notte dopo.
          effetti: { ferite: 1, tormento: 1, scandalo: 0.5 }
      - testo: "Arrampicarti su un trampolo fino alla piastra"
        descrizione: "Le macchine di quelli di prima hanno una piastra più fredda del resto, dietro. Bisogna salirci mentre cammina."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Difficile }
        successo:
          titolo: La piastra fredda
          testo: |
            Ti arrampichi su un trampolo piantato come su un palo della cuccagna e
            premi a due mani la piastra fredda dietro il corpo. I trampoli si
            piegano uno alla volta, e la macchina si accuccia fra i covoni come
            una vacca che si corica.
          pe: { atletica: 5 }
          effetti: { fazione.laresh: 1, rep.laresh: 1, racconto: 1, parte.impugnatura-2: 1 }
        fallimento:
          titolo: Dall'alto
          testo: |
            A metà trampolo il Seminatore fa un passo e tu voli giù sui covoni,
            che ti salvano le ossa e non la spalla. All'alba la cosa torna verso
            nord, e tornerà la notte dopo.
          effetti: { ferite: 2, tormento: 0.5 }

  # ------------------------------------------------------------ 14 → 15 · il primo pane (grado 5)
  - id: laresh-il-primo-pane
    presso: laresh
    immagine: ambientazione/laresh
    titolo: Il primo pane
    sommario: "Il forno di Laresh sforna il primo pane del grano salvato, e la carovana di Cahir è pronta a partire."
    luogo: Laresh, l'aia grande, la festa del primo pane
    area: superficie-fratturata
    requisiti: [fazione.laresh == 14]
    testo: |
      Una settimana dopo il forno comune sforna il primo pane del grano salvato,
      e l'aia grande si riempie di tavole lunghe e di brocche. Il Seminatore è
      rimasto dove è caduto, e i ragazzi ci si arrampicano sopra a turno. In
      fondo all'aia aspettano tre carri carichi di sacchi, con la muta di Cahir
      attaccata alle stanghe.

      Per una volta la Dama siede a capotavola con il libro dei conti chiuso, e
      Old Marrek ha davanti la sua scodella di chicchi e una brocca. Il fabbro
      del villaggio ti aspetta vicino al forno con una falce da guerra avvolta
      in una tela, battuta con il metallo della chiusa che hai portato su.

      {empatia Media} La Dama ride a una battuta del fattore, piano, con la mano
      davanti alla bocca, e al villaggio nessuno se la ricorda così.

      «A conti fatti» dice la Dama quando ti siedi. Lascia la frase a metà e ti
      passa il primo pane.

      {origine mercante-dei-ponti} Sui sacchi della carovana c'è il sigillo
      della licenza del Comune, con il tuo nome di garante scritto in piccolo,
      ed è la prima volta che il tuo nome viaggia senza di te.
    opzioni:
      - testo: "Spezzare il primo pane con la Dama"
        descrizione: "A Laresh il primo pane lo spezza chi ha salvato il raccolto, insieme a chi ne tiene il conto."
        esito:
          titolo: Primo pane
          testo: |
            Spezzi il pane con la Dama sopra il libro chiuso, e la crosta
            scrocchia così forte che l'aia applaude. Il fabbro ti porta la falce e
            lei ti mette in mano una borsa pesante, poi riapre il libro e scrive
            il tuo nome in cima alla pagina dei campi a nord, dove prima c'era la
            croce.
          almeno: { rep.laresh: 10 }
          effetti: { fazione.laresh: 1, monete: 300, oggetto.laresh-falce-della-chiusa: 1, dono.laresh: 1 }
      - testo: "Farti leggere il grano nuovo da Marrek"
        descrizione: "Marrek ha messo da parte una manciata del grano salvato, apposta per te. La brocca è già piena."
        esito:
          titolo: Sette raccolti
          testo: |
            «Sette raccolti senza fame» dice Marrek dopo aver ascoltato il grano
            nuovo sul tuo palmo, e poi annuncia con grande serietà che sposerai una
            persona di Laresh, o di un altro posto. Tano incide l'ultima tacca. Il
            fabbro ti porta la falce, e la Dama ti mette in mano una borsa pesante.
          almeno: { rep.laresh: 10 }
          effetti: { fazione.laresh: 1, monete: 300, oggetto.laresh-falce-della-chiusa: 1, dono.laresh: 1 }
      - testo: "Accompagnare la carovana di Cahir fino al bivio"
        descrizione: "Il primo viaggio della carovana di Laresh, con il garante davanti ai carri e la falce in spalla."
        esito:
          titolo: Il primo viaggio
          testo: |
            Con la falce in spalla e la borsa della Dama nella bisaccia cammini
            accanto a Cahir alla testa della carovana, dietro a Cenere. Al bivio
            Cahir ti stringe la mano e ti dice che il primo nolo è tuo, gratis,
            quando vuoi.
          almeno: { rep.laresh: 10 }
          effetti: { fazione.laresh: 1, monete: 300, oggetto.laresh-falce-della-chiusa: 1, dono.laresh: 1 }
      - testo: "Brindare con Anselmo Brey alla quota nuova"
        descrizione: "Il capo della cooperativa del grano è venuto da Qir-Azel per la festa, con il quaderno in tasca."
        quando: [pista.pelle >= 7]
        esito:
          titolo: La quota nuova
          testo: |
            Anselmo Brey starnutisce sopra il pane e ti mostra la quota nuova di
            Laresh, più bassa, con una colonna a parte per la carovana di Cahir, e
            la Dama la firma. Il fabbro ti porta la falce, e la Dama ti mette in
            mano una borsa pesante.
          almeno: { rep.laresh: 10 }
          effetti: { fazione.laresh: 1, monete: 300, oggetto.laresh-falce-della-chiusa: 1, dono.laresh: 1 }
      - testo: "Mandare il primo pane a Ugolino Carrà"
        descrizione: "Il fattore della concessione guarda la festa dalla strada, e una pagnotta pesata bene gli spetta."
        quando: [pista.pelle < 7]
        esito:
          titolo: Una pagnotta per contratto
          testo: |
            Fai pesare una pagnotta con i pesi della Dama e la mandi a Carrà con
            Tano, che gliela consegna dicendo «per contratto», e l'aia ride fino
            al tramonto. Il fabbro ti porta la falce, e la Dama ti mette in mano
            una borsa pesante.
          almeno: { rep.laresh: 10 }
          effetti: { fazione.laresh: 1, monete: 300, oggetto.laresh-falce-della-chiusa: 1, dono.laresh: 1 }
      - testo: "Fare con Cahir il conto del primo viaggio"
        descrizione: "Un conto fatto bene il primo giorno, con i noli fino ai granai, vale tre viaggi."
        quando: [origine.mercante-dei-ponti >= 1]
        esito:
          titolo: Il primo conto
          testo: |
            Seduto con Cahir su una stanga fai il conto del primo viaggio alla
            maniera della Gilda, e ne avanza abbastanza per tre cani. Cahir piega
            il foglio in quattro e se lo mette in tasca, con l'altro. Il fabbro ti
            porta la falce, e la Dama ti mette in mano una borsa pesante.
          pe: { politica-ed-economia: 3 }
          almeno: { rep.laresh: 10 }
          effetti: { fazione.laresh: 1, monete: 300, oggetto.laresh-falce-della-chiusa: 1, dono.laresh: 1 }
