# La quest di Laresh, fine dell'Atto IV e Atto V (fazione.laresh 11 → 15). Il passo 11 è la spedizione
# (spedizione-campo.yaml).
# - 11 → 12 `laresh-l-acqua-nel-rio-di-mezzo` (grado 4, Guardiano del rio): il rio torna a scorrere, il secondo
#   battito tace. La botola si mura (laresh.camera 1) o la camera va ai Raschiatori di Oreste Ruffo (2). La giubba
#   delle spigolatrici.
# - 12 → 13 `laresh-le-impronte-nel-grano-nuovo`: buche fonde un braccio a tre passi l'una dall'altra, ogni notte più
#   vicine al mulino. È il Seminatore, la macchina che lasciava le impronte sulle rotaie del campo pallido (una
#   stanza della spedizione, che il giocatore può non aver visto: le scene non la danno per scontata).
#   Con laresh.ilio 2 Ilio è tornato per la mietitura, come diceva il contratto.
# - 13 → 14 `laresh-la-notte-della-mietitura`: il boss finale. Il Seminatore entra nei campi la notte della
#   mietitura delle lanterne; combattimento o tre vie Difficili (il rio, la muta di Cahir, la piastra sul dorso).
# - 14 → 15 `laresh-il-primo-pane` (grado 5, Primo pane): la festa del primo pane, l'ultima lettura di Marrek, la
#   carovana di Cahir che parte. La Falce della chiusa e dono.laresh. Varianti con pista.pelle (Anselmo Brey alla
#   festa, o la pagnotta per Ugolino Carrà) e per il Mercante dei Ponti.
storylet:
  # ------------------------------------------------------------ 11 → 12 · l'acqua nel rio di mezzo (grado 4)
  - id: laresh-l-acqua-nel-rio-di-mezzo
    presso: laresh
    immagine: ambientazione/laresh
    titolo: L'acqua nel rio di mezzo
    sommario: "Il mattino dopo la chiusa il rio di mezzo corre più alto e più chiaro, e sotto la macina di Marrek il secondo battito tace."
    luogo: Laresh, il mulino centrale e il rio di mezzo
    area: superficie-fratturata
    requisiti: [fazione.laresh == 11]
    testo: |
      Il mattino dopo il rio di mezzo corre più alto di un palmo, e l'acqua
      è così chiara che dal ponticello si vedono i sassi del fondo. Nella
      striscia bruciata la terra è scura e umida, e a metà mattina Tano ci
      trova un filo d'erba verde che fa vedere a tutto il villaggio. La sera
      i fuochi azzurri sopra i campi sono pochi, e galleggiano ognuno per
      conto suo, come lucciole stanche.

      Marrek ha fatto ripartire la macina all'alba. Siede sul suo sgabello
      con la mano sull'incastellatura, e quando arrivi non si volta.
      «Adesso sento soltanto lei» dice. «Avevo dimenticato com'era.»

      Sull'aia, davanti al portico, ti aspetta Oreste Ruffo con due
      Raschiatori e un carro vuoto. La voce della camera sotto la macina è
      arrivata fino al Grifone, e i Raschiatori la vogliono. Pagano il
      villaggio, portano su il metallo e le ossa del custode, e la Dama non
      vuole più sentir parlare di quel buco. Ti guarda come si guarda chi ci
      è sceso.

      {politica-ed-economia Media} Quello che i Raschiatori pagano per la
      camera basta a ricomprare la semente dei campi a nord. La Dama lo sa, e
      le costa saperlo.

      {natura Facile} L'acqua del rio sa di sasso, come l'acqua di montagna.
      Ieri sapeva di ferro, e nessuno se ne accorgeva più.

      *La camera è vuota, e il battito non c'è più.* Le spigolatrici, sotto
      il portico, ti aspettano con qualcosa piegato sulle ginocchia.
    opzioni:
      - testo: "Murare la botola sotto la macina"
        descrizione: "Un muro di pietra e calce sopra la scala dei mugnai. Quello che c'è sotto resta sotto, e il mulino gira sopra."
        esito:
          titolo: Il muro sotto la macina
          testo: |
            Dici a Ruffo che la camera resta a Laresh, e lui alza le spalle e
            riparte con il carro vuoto. Nel pomeriggio tu e Tano murate la
            botola con le pietre del rio, e Marrek mette l'ultima con le sue
            mani. La sera le spigolatrici ti danno una giubba di cuoio cucita
            doppio, con un punto di ognuna, e la Dama scrive il tuo nome nel
            libro accanto al rio di mezzo. Sotto il tavolo ti passa una borsa
            pesante.
          imposta: { laresh.camera: 1 }
          almeno: { rep.laresh: 8 }
          effetti: { fazione.laresh: 1, monete: 120, oggetto.laresh-giubba-delle-spigolatrici: 1 }
      - testo: "Dare la camera ai Raschiatori di Ruffo"
        descrizione: "I Raschiatori pagano, e la semente dei campi a nord costa. Il metallo del custode sotto terra non serve a nessuno."
        esito:
          titolo: Il carro dei Raschiatori
          testo: |
            Dici a Ruffo che la camera è sua, a patto che la semente dei campi
            a nord la paghino i Raschiatori. Ruffo stringe la mano alla Dama,
            che la ritira in fretta. Per tre giorni i Raschiatori scendono e
            salgono dalla botola con i sacchi pieni. La sera le spigolatrici ti
            danno una giubba di cuoio cucita doppio, con un punto di ognuna, e
            la Dama scrive il tuo nome nel libro accanto al rio di mezzo e ti
            passa una borsa pesante.
          imposta: { laresh.camera: 2 }
          almeno: { rep.laresh: 8 }
          effetti: { fazione.laresh: 1, monete: 120, oggetto.laresh-giubba-delle-spigolatrici: 1, rep.raschiatori: 0.5 }
      - testo: "Lasciare la scelta a Marrek"
        descrizione: "Il mulino è suo da quarant'anni, e la botola sta sotto la sua macina. Il vecchio ha diritto di dire la sua."
        esito:
          titolo: Il mugnaio decide
          testo: |
            Porti Ruffo al mulino, e Marrek lo ascolta fino in fondo con la
            mano sulla macina. Poi dice che sotto il suo mulino da oggi non
            scende più nessuno, e il pane i mugnai lo porteranno all'osteria.
            Ruffo riparte con il carro vuoto. Nel pomeriggio murate la botola
            tu e Tano, e la sera le spigolatrici ti
            danno una giubba di cuoio cucita doppio, e la Dama scrive il tuo
            nome nel libro accanto al rio di mezzo e ti passa una borsa pesante.
          imposta: { laresh.camera: 1 }
          almeno: { rep.laresh: 8 }
          effetti: { fazione.laresh: 1, monete: 120, oggetto.laresh-giubba-delle-spigolatrici: 1 }

  # ------------------------------------------------------------ 12 → 13 · le impronte nel grano nuovo
  - id: laresh-le-impronte-nel-grano-nuovo
    presso: laresh
    immagine: icone/footprint
    titolo: Le impronte nel grano nuovo
    sommario: "Ai margini dei campi a nord, all'alba, la terra è bucata da fori tondi a tre passi l'uno dall'altro. Ogni notte sono più vicini al mulino."
    luogo: Laresh, i campi a nord, all'alba
    area: superficie-fratturata
    requisiti: [fazione.laresh == 12]
    testo: |
      Nei campi a nord il grano che non era ancora nero è tornato giallo, e
      dove era nero spuntano già i ricacci, verdi come l'erba di aprile. A
      Laresh se ne parla in ogni casa. Poi una mattina il fattore viene a
      chiamarti all'alba e ti porta al margine dei campi.

      Nella terra ci sono fori tondi, larghi quanto un piatto e profondi
      quanto un braccio, a coppie, uno ogni tre passi. Arrivano da nord in
      una fila dritta e si fermano a metà del campo più vicino al rio. In
      fondo a ogni foro la terra è secca come la cenere. La notte dopo la
      fila arriva più avanti, e quella dopo ancora di più, sempre puntata sul
      mulino centrale.

      I cani di Cahir hanno ricominciato a ululare con un verso corto e
      rabbioso, come contro un lupo. Un bracciante che ha fatto la guardia
      giura di aver visto una cosa alta come un fienile che camminava piano
      su quattro pali e ogni tanto si fermava a bere dalla terra.

      {percezione Media} Le coppie di fori sono tutte alla stessa distanza,
      al dito, come le tacche di un righello.

      {natura Facile} Nessuna bestia lascia un'impronta così, e nessuna beve
      dalla terra asciutta.

      «Fra tre notti c'è la mietitura delle lanterne» dice la Dama, con il
      libro sotto il braccio. «A Laresh il primo grano si miete di notte, da
      sempre. Quest'anno non lo cambio.»

      {origine figlio-del-circolo} Nel Bosco ti hanno insegnato a leggere una
      pista dal fondo dell'impronta. Qui il fondo è cotto, come se la cosa che
      l'ha fatta avesse succhiato via anche l'umido della notte.
    opzioni:
      - testo: "Fare la posta di notte al margine dei campi"
        descrizione: "Una notte nel fosso, con la lanterna spenta. Se la cosa viene, la vedi da vicino."
        prova: { attributo: fisico, abilita: furtivita, difficolta: Media }
        successo:
          titolo: Il Seminatore
          testo: |
            Passi la notte nel fosso con la lanterna spenta, e dopo mezzanotte
            la cosa arriva da nord. È un corpo di metallo grande come una
            tramoggia, su quattro trampoli lunghi tre uomini, che pianta uno
            alla volta nella terra come pali e ci resta fermo a bere. Il metallo
            è quello del custode della chiusa. Quando la racconti alla Dama, Tano
            le dà il nome di Seminatore, e il nome resta. Arriverà al mulino la
            notte della mietitura.
          pe: { furtivita: 3 }
          effetti: { fazione.laresh: 1, rep.laresh: 0.5 }
        fallimento:
          titolo: Il trampolo
          testo: |
            Dopo mezzanotte la cosa arriva da nord, e un trampolo si pianta
            nella terra a un passo dal tuo fosso. Scappi a quattro zampe nel
            grano, e da lontano la vedi bere, lenta, su quattro pali alti come
            alberi. Quando la racconti alla Dama, Tano le dà il nome di
            Seminatore, e il nome resta. Arriverà al mulino la notte della
            mietitura.
          effetti: { fazione.laresh: 1, tormento: 0.5 }
      - testo: "Misurare i fori e il passo"
        descrizione: "Un passo è un passo, anche su quattro pali. Contando i fori si sa quando la cosa arriva al mulino."
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Media }
        successo:
          titolo: Tre notti
          testo: |
            Misuri i fori con uno spago e conti le coppie notte per notte. La
            cosa fa ogni notte lo stesso numero di passi, né uno di più né uno
            di meno, e a quel conto arriva al mulino centrale fra tre notti,
            proprio quella della mietitura. È una macchina di quelli di prima.
            Tano, quando glielo dici, la chiama il Seminatore, e il nome
            resta.
          pe: { tecnologia: 3 }
          effetti: { fazione.laresh: 1, rep.laresh: 0.5 }
        fallimento:
          titolo: Lo spago
          testo: |
            Misuri i fori con uno spago e il conto ti torna diverso ogni volta,
            finché un bracciante te lo rifà con le dita davanti a mezzo
            villaggio. Arriva al mulino fra tre notti, quella della mietitura.
            Tano chiama la cosa il Seminatore, e il nome resta.
          effetti: { fazione.laresh: 1, scandalo: 0.5 }
      - testo: "Mettere i cani di Cahir sulla pista"
        descrizione: "La muta trova le bestie al buio, e Cenere va dove gli si dice. Con una cosa così, forse."
        prova: { attributo: sociale, abilita: addestrare-animali, difficolta: Media }
        successo:
          titolo: Cenere si ferma
          testo: |
            Di notte metti Cenere sulla fila dei fori, e il cane la segue fino
            a dove la cosa sta bevendo. Lì si ferma con il pelo ritto e non va oltre, e
            nella luce della tua lanterna vedi quattro trampoli lunghi tre
            uomini e un corpo come una tramoggia. Tano, quando glielo racconti,
            la chiama il Seminatore, e il nome resta. Arriverà al mulino la
            notte della mietitura.
          pe: { addestrare-animali: 3 }
          effetti: { fazione.laresh: 1, rep.laresh: 0.5 }
        fallimento:
          titolo: Il cane ferito
          testo: |
            Cenere segue la fila dei fori fino a dove la cosa sta bevendo, e un
            trampolo lo scalcia nel grano. Lo riporti alle stalle in braccio, e
            Cahir te lo prende senza una parola. Della cosa hai visto soltanto
            l'ombra. Tano la chiama il Seminatore, e il nome resta.
          effetti: { fazione.laresh: 1, tormento: 0.5 }
      - testo: "Chiedere a Ilio come si ferma una macchina di quelli di prima"
        descrizione: "Ilio Vardo è tornato da Qir-Azel per la mietitura, come diceva il contratto. Al Grifone ha imparato qualcosa sulle macchine."
        quando: [laresh.ilio == 2]
        esito:
          titolo: Dietro, alla piastra
          testo: |
            Ilio è tornato con le spalle più larghe e un taglio nuovo sul
            sopracciglio. Guarda i fori e ti dice che in Cicatrice le macchine
            si fermano toccandole dietro, dove hanno una piastra più fredda del
            resto. Quella notte la vedete insieme, alta su quattro pali, che
            beve dalla terra. Tano la chiama il Seminatore, e il nome resta.
            Arriverà al mulino la notte della mietitura.
          effetti: { fazione.laresh: 1, rep.laresh: 0.5 }

  # ------------------------------------------------------------ 13 → 14 · la notte della mietitura (boss finale)
  - id: laresh-la-notte-della-mietitura
    presso: laresh
    immagine: bestiario/salvaguardia-precursori
    titolo: La notte della mietitura
    sommario: "Laresh miete il primo grano di notte, con le lanterne. A mezzanotte il Seminatore entra nei campi e cammina verso il mulino centrale."
    luogo: Laresh, i campi a nord, la notte della mietitura delle lanterne
    area: superficie-fratturata
    requisiti: [fazione.laresh == 13]
    testo: |
      La notte della mietitura i campi a nord sono pieni di lanterne appese
      ai pali, una ogni dieci passi, e il villaggio intero miete in fila
      cantando piano la canzone della spiga. La Dama cammina dietro la fila
      con il libro sotto il braccio e conta i covoni. Cahir tiene la muta
      legata al margine del campo, e Old Marrek è rimasto al mulino, con la
      mano sulla macina e Tano accanto.

      A mezzanotte i cani tacciono tutti insieme. Dal buio a nord arriva un
      rumore di pali piantati nella terra, uno ogni tre passi, e la canzone si
      ferma a metà di una strofa. Il Seminatore entra nella luce delle
      lanterne alto come un fienile, scavalca la fila dei mietitori come se
      non ci fosse e pianta un trampolo nel grano tagliato. Si ferma a bere.
      Poi riparte verso il mulino centrale.

      {armi-da-mischia Media} I trampoli sono sottili alle giunture, dove si
      piegano. Il corpo sta troppo in alto per una falce.

      {resilienza Media fallita} La falce che hai in mano ti sembra
      all'improvviso un attrezzo da cucina, e le gambe ti chiedono il
      permesso di andarsene.

      *Se arriva al mulino sfonda il muro e riapre la chiusa.* La Dama manda
      a passo svelto le donne e i bambini verso l'aia, e la fila dei
      mietitori ti guarda.

      {origine fuggiasco-di-ghoran} Hai già visto una fila di gente ferma a
      guardare uno solo, con gli attrezzi in mano e la paura negli occhi. A
      Ghoran, quella volta, nessuno si è mosso.
    opzioni:
      - testo: "Affrontare il Seminatore fra i covoni"
        descrizione: "Quattro trampoli e un corpo di metallo grande come una tramoggia. Si colpiscono le giunture, finché qualcuna cede."
        combattimento: laresh-il-seminatore
        vittoria:
          titolo: Il fienile caduto
          testo: |
            Colpisci le giunture di un trampolo finché si piega, e il Seminatore
            si inclina ondeggiando e cade di traverso sui covoni con un rumore di
            campana rotta. Resta lì, con tre trampoli all'aria, e dal corpo
            esce un filo di fango scuro che la terra non beve più. I mietitori
            ricominciano a cantare dalla strofa dove si erano fermati.
          pe: { armi-da-mischia: 5 }
          effetti: { fazione.laresh: 1, rep.laresh: 1, racconto: 1, parte.impugnatura-2: 1 }
        sconfitta:
          titolo: Fino al mulino
          testo: |
            Un trampolo ti prende al fianco e ti getta fra i covoni, e il
            Seminatore passa oltre. Arriva al mulino, batte due volte contro il
            muro della botola e si ferma, come se aspettasse una risposta. Poi,
            all'alba, torna verso nord con il suo passo da tre. Il muro ha
            retto, e tornerà la notte dopo.
          effetti: { tormento: 0.5 }
      - testo: "Farlo entrare nel rio di mezzo con le lanterne"
        descrizione: "Il Seminatore va dove c'è da bere. Una fila di lanterne lungo il rio, e i trampoli piantati nel fango molle del fondo."
        prova: { attributo: mentale, abilita: natura, difficolta: Difficile }
        successo:
          titolo: Il fango del rio
          testo: |
            Stacchi le lanterne dai pali e le metti in fila lungo il rio, e il
            Seminatore devia verso l'acqua. Pianta il primo trampolo nel fango
            del fondo, e il fango lo prende fino alla giuntura. Il secondo
            affonda ancora di più. Si inclina piano, poi cade di traverso nel
            rio con uno schianto che bagna mezzo villaggio, e la corrente gli
            passa sopra.
          pe: { natura: 5 }
          effetti: { fazione.laresh: 1, rep.laresh: 1, racconto: 1, parte.impugnatura-2: 1 }
        fallimento:
          titolo: La riva
          testo: |
            Metti le lanterne in fila lungo il rio, e il Seminatore le segue
            fino alla riva. Lì si ferma, pianta un trampolo sull'argine invece
            che nel fango e scalcia le lanterne nell'acqua. Una ti scoppia
            accanto alla faccia. All'alba la cosa torna verso nord, e tornerà
            la notte dopo.
          effetti: { ferite: 1, tormento: 1 }
      - testo: "Mandargli contro la muta di Cahir con le corde"
        descrizione: "Trenta cani da soma con le corde dei finimenti fra i denti, intorno a quattro trampoli. Serve qualcuno che li guidi tutti insieme."
        prova: { attributo: sociale, abilita: addestrare-animali, difficolta: Difficile }
        successo:
          titolo: Le corde dei finimenti
          testo: |
            Cahir slega la muta e tu la mandi con il fischio, e i cani corrono
            in cerchio intorno ai trampoli con le corde dei finimenti fra i
            denti. Al terzo giro le corde si stringono. Il Seminatore fa un
            passo e non riesce a fare il secondo. Ondeggia a lungo, poi cade di
            traverso sui covoni, e la muta gli abbaia intorno finché Cahir non
            la richiama.
          pe: { addestrare-animali: 5 }
          effetti: { fazione.laresh: 1, rep.laresh: 1, racconto: 1, parte.impugnatura-2: 1 }
        fallimento:
          titolo: I cani scalciati
          testo: |
            I cani partono, ma le corde si attorcigliano al primo giro e il
            Seminatore ne scalcia via tre con un trampolo. Cahir richiama la
            muta con la voce rotta, e tu corri a raccogliere un cane che non si
            alza. All'alba la cosa torna verso nord, e tornerà la notte dopo.
          effetti: { ferite: 1, tormento: 1, scandalo: 0.5 }
      - testo: "Arrampicarti su un trampolo fino alla piastra"
        descrizione: "Le macchine di quelli di prima hanno una piastra più fredda del resto, dietro. Bisogna salirci mentre cammina."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Difficile }
        successo:
          titolo: La piastra fredda
          testo: |
            Aspetti che il Seminatore pianti un trampolo e ti ci arrampichi
            sopra con le ginocchia, come su un palo della cuccagna. In cima,
            dietro il corpo, c'è una piastra più fredda del resto, e la premi
            con tutte e due le mani. I trampoli si piegano uno alla volta, e la
            macchina si accuccia fra i covoni come una vacca che si corica.
          pe: { atletica: 5 }
          effetti: { fazione.laresh: 1, rep.laresh: 1, racconto: 1, parte.impugnatura-2: 1 }
        fallimento:
          titolo: Dall'alto
          testo: |
            A metà del trampolo il Seminatore fa un passo, e tu voli giù da
            un'altezza che ti toglie i pensieri. Atterri sui covoni, che ti
            salvano le ossa e non la spalla. All'alba la cosa torna verso nord,
            e tornerà la notte dopo.
          effetti: { ferite: 2, tormento: 0.5 }

  # ------------------------------------------------------------ 14 → 15 · il primo pane (grado 5)
  - id: laresh-il-primo-pane
    presso: laresh
    immagine: ambientazione/laresh
    titolo: Il primo pane
    sommario: "Il forno comune di Laresh sforna il primo pane del grano salvato. Sull'aia ci sono le tavole lunghe, e la carovana di Cahir è pronta a partire."
    luogo: Laresh, l'aia grande, la festa del primo pane
    area: superficie-fratturata
    requisiti: [fazione.laresh == 14]
    testo: |
      Una settimana dopo il forno comune di Laresh sforna il primo pane del
      grano salvato, e l'aia grande si riempie di tavole lunghe e di brocche,
      con i bambini che corrono fra le gambe dei grandi. Il Seminatore è rimasto
      dove è caduto, e i ragazzi ci si arrampicano sopra a turno. In fondo
      all'aia aspettano tre carri carichi di sacchi, con la muta di Cahir
      attaccata alle stanghe.

      La Dama siede a capotavola con il libro dei conti chiuso, per una volta,
      sotto il gomito. Old Marrek ha la sua scodella di chicchi davanti e una
      brocca accanto, e Tano incide tacche sul bordo della tavola. Il fabbro
      del villaggio ti aspetta vicino al forno con una falce da guerra avvolta
      in una tela. La lama l'ha battuta con il metallo della chiusa che hai
      portato su.

      {empatia Media} La Dama ride a una battuta del fattore, piano, con la
      mano davanti alla bocca. Al villaggio nessuno se la ricorda così.

      {conoscenze-della-strada Media} Cahir ha attaccato ventidue cani, e il
      foglio dice trenta. Gli altri otto li comprerà con il primo viaggio,
      e lo sa tutta l'aia.

      «A conti fatti» dice la Dama quando ti siedi. Lascia la frase a metà e
      ti passa il primo pane.

      {origine mercante-dei-ponti} Sui sacchi della carovana c'è il sigillo
      della licenza del Comune, e accanto il tuo nome di garante, scritto in
      piccolo. È la prima volta che il tuo nome viaggia senza di te.
    opzioni:
      - testo: "Spezzare il primo pane con la Dama"
        descrizione: "A Laresh il primo pane lo spezza chi ha salvato il raccolto, insieme a chi ne tiene il conto."
        esito:
          titolo: Primo pane
          testo: |
            Spezzi il pane con la Dama sopra il libro chiuso, e la crosta
            scrocchia così forte che l'aia applaude. La Dama ti dà la sua metà
            e tiene l'altra. Il fabbro ti porta la falce, e lei ti mette in mano
            una borsa pesante. Poi riapre il libro e scrive il tuo nome in cima
            alla pagina dei campi a nord, dove prima c'era la croce.
          almeno: { rep.laresh: 10 }
          effetti: { fazione.laresh: 1, monete: 300, oggetto.laresh-falce-della-chiusa: 1, dono.laresh: 1 }
      - testo: "Farti leggere il grano nuovo da Marrek"
        descrizione: "Marrek ha messo da parte una manciata del grano salvato, apposta per te. La brocca è già piena."
        esito:
          titolo: Sette raccolti
          testo: |
            Marrek ti versa sul palmo una manciata di grano nuovo giallo e sano,
            e lo ascolta a lungo. «Sette raccolti senza fame» dice, piano. «Lo dice
            il grano, e sulle carestie il grano non sbaglia.» Poi annuncia con
            grande serietà che sposerai una persona di Laresh, o di un altro
            posto, e Tano incide l'ultima tacca. Il fabbro ti porta la falce, e
            la Dama ti mette in mano una borsa pesante.
          almeno: { rep.laresh: 10 }
          effetti: { fazione.laresh: 1, monete: 300, oggetto.laresh-falce-della-chiusa: 1, dono.laresh: 1 }
      - testo: "Accompagnare la carovana di Cahir fino al bivio"
        descrizione: "Il primo viaggio della carovana di Laresh. Il garante deve arrivare prima dei carri, e con la falce in spalla."
        esito:
          titolo: Il primo viaggio
          testo: |
            Il fabbro ti mette in spalla la falce, e la Dama ti infila nella
            bisaccia una borsa pesante e due pani. Cammini accanto a Cahir alla
            testa della carovana fino al bivio, con la muta che tira contenta e
            Cenere che apre la strada. Al bivio Cahir si ferma, ti stringe la
            mano con una presa da stalliere e ti dice che il primo nolo è tuo,
            gratis, quando vuoi.
          almeno: { rep.laresh: 10 }
          effetti: { fazione.laresh: 1, monete: 300, oggetto.laresh-falce-della-chiusa: 1, dono.laresh: 1 }
      - testo: "Brindare con Anselmo Brey alla quota nuova"
        descrizione: "Il capo della cooperativa del grano è venuto da Qir-Azel per la festa, con il quaderno in tasca e il cappello in mano."
        quando: [pista.pelle >= 7]
        esito:
          titolo: La quota nuova
          testo: |
            Anselmo Brey starnutisce sopra il pane e ti stringe la mano
            infarinata. Ha scritto sul quaderno una quota nuova per Laresh, più
            bassa, con una colonna a parte per la carovana di Cahir, e la Dama
            la firma con la sua grafia lenta. Brindate con il sidro torbido
            dell'osteria. Il fabbro ti porta la falce, e la Dama ti mette in
            mano una borsa pesante.
          almeno: { rep.laresh: 10 }
          effetti: { fazione.laresh: 1, monete: 300, oggetto.laresh-falce-della-chiusa: 1, dono.laresh: 1 }
      - testo: "Mandare il primo pane a Ugolino Carrà"
        descrizione: "Il fattore della concessione guarda la festa dalla strada, con il cappello in testa. Una pagnotta pesata bene gli spetta."
        quando: [pista.pelle < 7]
        esito:
          titolo: Una pagnotta per contratto
          testo: |
            Fai pesare una pagnotta sulla bilancia del mulino, con i pesi della
            Dama, e la mandi a Carrà con Tano, che la consegna dicendo «per
            contratto». Carrà la prende e se ne va senza voltarsi, e l'aia ride
            fino al tramonto. Il fabbro ti porta la falce, e la Dama ti mette in
            mano una borsa pesante.
          almeno: { rep.laresh: 10 }
          effetti: { fazione.laresh: 1, monete: 300, oggetto.laresh-falce-della-chiusa: 1, dono.laresh: 1 }
      - testo: "Fare con Cahir il conto del primo viaggio"
        descrizione: "Ventidue cani per tre carri e i noli fino ai granai del Comune. Un conto fatto bene il primo giorno vale tre viaggi."
        quando: [origine.mercante-dei-ponti >= 1]
        esito:
          titolo: Il primo conto
          testo: |
            Ti siedi con Cahir su una stanga e fai il conto del primo viaggio
            alla maniera della Gilda, con il dare a sinistra e l'avere a destra.
            Ne avanza abbastanza per tre cani. Cahir piega il foglio in quattro
            e se lo mette nella tasca della camicia, con l'altro. Il fabbro ti
            porta la falce, e la Dama ti mette in mano una borsa pesante.
          pe: { politica-ed-economia: 3 }
          almeno: { rep.laresh: 10 }
          effetti: { fazione.laresh: 1, monete: 300, oggetto.laresh-falce-della-chiusa: 1, dono.laresh: 1 }
