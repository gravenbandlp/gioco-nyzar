# Laresh, il villaggio dei campi e dei mulini a ovest della città: un luogo della Superficie Fratturata, aperto dopo
# l'Arena (pista.arena >= 5), con la reputazione del villaggio, l'attività e i servizi.
# - `laresh-la-giornata-nei-campi`: l'attività ripetibile all'aia di Casa Velar, a fasce di rep.laresh (< 2, 2-4,
#   4-6, >= 6). Le prime tre fasce alzano la reputazione di ½ fino a 6; poi la portano i gradi della quest.
# - `laresh-il-grano-bruciato` (dal passo 2): il servizio del villaggio, le letture di Old Marrek pagate in idromele.
#   Una voce sul raccolto, una profezia d'amore che non ci prende, e con la reputazione la prossima carestia.
# - `laresh-la-stanza-del-grano` (grado 3, passo 9): si dorme a Casa Velar senza pagare.
quality:
  - { id: rep.laresh, immagine: icone/wheat, nome: Laresh, categoria: reputazione, famiglia: Luoghi, descrizione: "Quanto si fidano di te Dama Ryn Velar e la gente dei campi e dei mulini di Laresh." }

luoghi:
  - id: laresh
    area: superficie-fratturata
    nome: Laresh
    immagine: ambientazione/laresh
    sommario: "Campi e mulini a ovest della città, da cui viene quasi tutto il pane di Qir-Azel."
    requisiti: [pista.arena >= 5]
    testo: |
      Laresh comincia dove la pista dei carri lascia la ghiaia e la terra si fa scura e grassa. I campi arrivano
      all'orizzonte divisi dai rii, ognuno con la ruota di un mulino, e le case sono basse e fatte di fango. Sul
      rio di mezzo macina il mugnaio cieco del mulino centrale, e poco più in là Casa Velar ha il portico
      sull'aia. Di notte sopra i campi galleggiano fiammelle azzurre, gli spiriti dei morti che custodiscono il
      raccolto.

colonna:
  - { contesto: luogo, id: laresh, musica: distant-journey, ambiente: village }

storylet:
  # ------------------------------------------------------------ l'attività ripetibile
  - id: laresh-la-giornata-nei-campi
    presso: laresh
    immagine: ambientazione/laresh
    titolo: La giornata nei campi
    sommario: "All'alba, sull'aia di Casa Velar, il fattore assegna i lavori del giorno e la sera li paga."
    luogo: Laresh, l'aia di Casa Velar
    area: superficie-fratturata
    ripetibile: true
    requisiti: [pista.arena >= 5]
    testo: |
      All'alba l'aia di Casa Velar si riempie di gente che aspetta di sapere
      dove si lavora. Il fattore della Dama, un uomo largo con un cappello
      di paglia sfondato, legge i lavori da una tavoletta di cera e li
      assegna puntando il dito, mentre dal mulino centrale arriva il battito
      lento della macina.

      {conoscenze-della-strada Facile} Chi chiede la paga in farina invece
      che in monete, qui, lo guardano con più rispetto.
    opzioni:
      - testo: "Spigolare dietro i mietitori"
        descrizione: "Si raccoglie quello che la falce lascia cadere, ed è lavoro da bambini e da vecchie."
        requisiti: [rep.laresh < 2]
        prova: { attributo: fisico, abilita: resistenza, difficolta: Facile }
        successo:
          titolo: Le spighe cadute
          testo: |
            Spighi fino al tramonto dietro i mietitori, accanto a una vecchia che
            raccoglie il doppio e ti racconta chi si sposa quest'anno. La sera il
            fattore soppesa il sacco con una mano e ti paga.
          effetti: { monete: 1, rep.laresh: 0.5 }
        fallimento:
          titolo: La schiena
          testo: |
            A metà mattina la schiena decide al posto tuo, e la sera il fattore il
            tuo sacco non lo pesa nemmeno.

      - testo: "Portare i sacchi al mulino"
        descrizione: "Dall'aia al mulino centrale c'è il sentiero del rio, e un sacco pieno pesa quanto un ragazzo."
        requisiti: [rep.laresh < 2]
        prova: { attributo: fisico, abilita: atletica, difficolta: Media }
        successo:
          titolo: Il sentiero del rio
          testo: |
            Fai il sentiero del rio tutto il giorno, e a sera le tacche che il
            ragazzino del mulino ha fatto per te sono più di quelle degli altri.
          pe: { atletica: 2 }
          effetti: { monete: 2, rep.laresh: 0.5 }
        fallimento:
          titolo: Il sacco nel rio
          testo: |
            Al terzo viaggio il sacco ti scivola nel rio, e il fattore ti paga
            solo i sacchi asciutti.
          effetti: { monete: 1 }

      - testo: "Tenere il conto dei sacchi per il fattore"
        descrizione: "Il fattore conta fino a cento, poi gli serve qualcuno che segni i sacchi mentre litiga con i carrettieri."
        requisiti: [rep.laresh < 2]
        prova: { attributo: mentale, abilita: [percezione, politica-ed-economia], difficolta: Facile }
        successo:
          titolo: La tavoletta di cera
          testo: |
            Segni ogni sacco sulla tavoletta e verso sera scopri che un
            carrettiere ha contato due volte lo stesso carro. Il fattore va a
            gridarglielo, poi ti paga.
          effetti: { monete: 1, rep.laresh: 0.5 }
        fallimento:
          titolo: I segni sulla cera
          testo: |
            I sacchi passano più in fretta dei tuoi segni, e il fattore liscia la
            tavoletta con il pollice e ricomincia a memoria.

      - testo: "Aiutare Cahir a ferrare i cavalli"
        descrizione: "Alle stalle a est i cavalli da tiro vanno ferrati prima del raccolto, e qualcuno deve tenergli la zampa."
        requisiti: [rep.laresh >= 2, rep.laresh < 4]
        prova: { attributo: sociale, abilita: addestrare-animali, difficolta: Media }
        successo:
          titolo: La zampa ferma
          testo: |
            Tieni la zampa del cavallo fra le ginocchia parlandogli piano mentre
            Cahir batte i chiodi. Alla fine Cahir ti passa la sua pipa, che da lui
            è un ringraziamento.
          pe: { addestrare-animali: 2 }
          effetti: { monete: 2, rep.laresh: 0.5 }
        fallimento:
          titolo: Lo zoccolo
          testo: |
            Il cavallo sente la tua mano incerta e ti manda seduto nella paglia, e
            Cahir ti lascia da strigliare i cani.

      - testo: "Rimettere in sesto la ruota di un mulino"
        descrizione: "Un mulino sul rio basso ha due pale spezzate, e il mugnaio non si fida dei falegnami della città."
        requisiti: [rep.laresh >= 2, rep.laresh < 4]
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Media }
        successo:
          titolo: Le pale nuove
          testo: |
            Con l'acqua alle ginocchia tagli due pale nuove dal castagno del
            mugnaio, e quando la ruota riparte dritta lui ci appoggia l'orecchio
            per un po' prima di pagarti.
          pe: { tecnologia: 2 }
          effetti: { monete: 3, rep.laresh: 0.5 }
        fallimento:
          titolo: La ruota storta
          testo: |
            Le pale nuove ti vengono di due misure e la ruota riparte con un tonfo
            a ogni giro, e il mugnaio ti paga mezza giornata.
          effetti: { monete: 1 }

      - testo: "Arare il campo vecchio dietro le stalle"
        descrizione: "Un campo a riposo da anni, dove il vomere a volte trova qualcosa che sasso non è."
        requisiti: [rep.laresh >= 2, rep.laresh < 4]
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Media }
        successo:
          titolo: Il guscio nel solco
          testo: |
            Al quarto solco il vomere si ferma con un rumore di campana contro un
            guscio di metallo grande come un pane, chiuso da ogni lato. Il fattore
            ti dice di tenerlo, perché sulla Superficie c'è una vecchia che queste
            cose le apre.
          pe: { atletica: 2 }
          effetti: { reperto.sigillato: 1, rep.laresh: 0.5 }
        fallimento:
          titolo: I sassi
          testo: |
            Il vomere trova un sasso a ogni passo. A sera hai arato mezzo campo,
            con le mani piene di vesciche, e sotto la terra non c'era niente.

      - testo: "Scortare il carro del grano fino al bivio"
        descrizione: "Il carro della settimana parte all'alba per il bivio, e sulla strada ci sono i mugnai senza mulino."
        requisiti: [rep.laresh >= 4, rep.laresh < 6]
        prova: { attributo: fisico, abilita: [armi-da-mischia, armi-da-distanza], difficolta: Media }
        successo:
          titolo: Il bivio
          testo: |
            Cammini accanto al carro con l'arma in vista, e sotto le terrazze tre
            uomini con le mani bianche di farina vecchia, incrociati i tuoi occhi,
            tornano a sedersi dietro un muretto. Al ritorno la Dama ti paga la
            scorta.
          pe: { armi-da-mischia: 2 }
          effetti: { monete: 4, rep.laresh: 0.5 }
        fallimento:
          titolo: Un sacco per il passaggio
          testo: |
            Sotto le terrazze tre uomini sbarrano la strada con un tronco, e il
            carrettiere getta loro un sacco prima che tu capisca dove guardare. La
            Dama toglie il sacco dalla tua paga.
          effetti: { monete: 1 }

      - testo: "Mettere pace in una lite di confini"
        descrizione: "Due fittavoli si contendono un solco da tre generazioni, e quest'anno sono arrivati alle falci."
        requisiti: [rep.laresh >= 4, rep.laresh < 6]
        prova: { attributo: sociale, abilita: [persuasione, empatia], difficolta: Media }
        successo:
          titolo: Il solco di mezzo
          testo: |
            Lasci parlare i due fittavoli finché si accorgono di raccontare la
            stessa storia del nonno con i nomi invertiti, e il solco resta di
            nessuno. Uno dei due ti offre da bere e ti dice chi ruba il grano alla
            Dama.
          pe: { persuasione: 2 }
          effetti: { informazioni.voce: 1, monete: 2, rep.laresh: 0.5 }
        fallimento:
          titolo: Le falci
          testo: |
            Dai ragione al primo che parla e il secondo ti punta contro la falce,
            finché il fattore non rovescia un secchio d'acqua addosso a tutti e
            tre.

      - testo: "Insegnare i conti ai figli dei fittavoli"
        descrizione: "La Dama vuole che i ragazzi sappiano leggere una bolla, e il maestro è morto in primavera."
        requisiti: [rep.laresh >= 4, rep.laresh < 6]
        prova: { attributo: mentale, abilita: accademiche, difficolta: Media }
        successo:
          titolo: La bolla del carrettiere
          testo: |
            Fai lezione nel fienile con una bolla vera, e i ragazzi trovano da
            soli il sacco contato due volte. Il più piccolo chiede se in città
            imbrogliano tutti così, e gli rispondi che imbrogliano meglio.
          pe: { accademiche: 2 }
          effetti: { monete: 2, rep.laresh: 0.5 }
        fallimento:
          titolo: Il fienile
          testo: |
            Un ragazzo trova un nido di topi nel fieno, e finisci la lezione
            davanti a un vitello affacciato alla porta, l'unico che ti ascolta.

      - testo: "Guidare una squadra di mietitori"
        descrizione: "Il fattore ti dà dieci braccianti e un campo, e la sera vuole il campo mietuto."
        requisiti: [rep.laresh >= 6]
        prova: { attributo: sociale, abilita: [persuasione, intimidire], difficolta: Media }
        successo:
          titolo: Il campo mietuto
          testo: |
            Metti in testa i più svelti e in coda i lenti, e a mezzogiorno porti
            il pane sul campo invece di mandarli all'aia. Al tramonto il campo è
            giù tutto, e il fattore ti paga come un caposquadra.
          pe: { persuasione: 2 }
          effetti: { monete: 5 }
        fallimento:
          titolo: La pausa lunga
          testo: |
            Mandi la squadra a mangiare all'aia e dopo nessuno torna volentieri al
            sole, così il fattore ti paga metà.
          effetti: { monete: 2 }

      - testo: "Andare con i pastori ai margini dei campi neri"
        descrizione: "Le capre dei pastori girano dove il grano nero finisce, e trovano cose che poi i pastori vendono."
        requisiti: [rep.laresh >= 6]
        prova: { attributo: mentale, abilita: natura, difficolta: Media }
        successo:
          titolo: La capra che raspa
          testo: |
            Verso sera una capra raspa in un fosso al margine del grano nero, e
            sotto la terra trovi un guscio di metallo chiuso. I pastori te lo
            lasciano per un pezzo di formaggio e la promessa di non dire alla Dama
            dove l'hai trovato.
          pe: { natura: 2 }
          effetti: { reperto.sigillato: 1 }
        fallimento:
          titolo: Le capre girano al largo
          testo: |
            Giri tutto il giorno con le capre, e a sera i pastori ti offrono il
            formaggio e un'opinione sui forestieri stagionata quanto lui.

      - testo: "Restare all'osteria sul rio dopo il lavoro"
        descrizione: "A Laresh la sera si beve sidro torbido e si cantano le canzoni della mietitura."
        esito:
          titolo: La canzone della spiga
          testo: |
            Dopo il secondo boccale di sidro il fattore si alza a cantare la
            canzone della spiga, con una voce intonata che da un uomo così largo
            non ti aspettavi, e alla terza strofa la canta mezza osteria battendo
            il tempo con le tazze.
          pe: { espressivita: 2 }

  # ------------------------------------------------------------ il servizio del villaggio · le letture di Marrek
  - id: laresh-il-grano-bruciato
    presso: laresh
    immagine: ambientazione/mulino-malgrani
    titolo: Il grano bruciato
    sommario: "Old Marrek legge il futuro nelle crepe del grano bruciato, in cambio di idromele."
    luogo: Laresh, il mulino centrale
    area: superficie-fratturata
    ripetibile: true
    requisiti: [fazione.laresh >= 2]
    testo: |
      Old Marrek tiene il grano bruciato in una scodella di coccio accanto
      alla macina. A chi si siede sul suo sgabello versa una manciata di
      chicchi sul palmo e la fa rotolare con il pollice, ascoltando le crepe
      come se facessero rumore, mentre Tano segna le brocche d'idromele su una
      trave.

      {empatia Facile} Marrek si diverte più di chi lo paga, e l'amore lo dice
      forte perché sbagliare lì non fa danni.
    opzioni:
      - testo: "Portargli una brocca e farti dire del raccolto"
        descrizione: "Una brocca d'idromele, e Marrek ti dice che cosa succederà ai campi e alla farina in città."
        requisiti: [monete >= 6]
        esito:
          titolo: Le crepe
          testo: |
            Marrek ti rigira i chicchi sul palmo e ti dice quale mugnaio del rio basso
            venderà il mulino prima dell'inverno, a chi lo venderà e quanto pagherà la
            farina in città il mese dopo. Lo dice come si dice che domani piove.
          effetti: { monete: -6, informazioni.pettegolezzo: 1, tormento: -0.5 }
      - testo: "Portargli una brocca e farti dire dell'amore"
        descrizione: "Sull'amore Marrek sbaglia sempre, e lo sa. Per questo lo fa volentieri."
        requisiti: [monete >= 6]
        esito:
          titolo: Una persona con i capelli
          testo: |
            Marrek annuncia con grande serietà che incontrerai una persona con i
            capelli, o forse senza. Tano scuote la testa dalla trave, e tu ridi
            più di quanto valesse la brocca.
          effetti: { monete: -6, tormento: -1 }
      - testo: "Chiedergli della prossima carestia"
        descrizione: "Sulle carestie Marrek non sbaglia. Lo dice soltanto a chi conosce bene, e per tre brocche del migliore."
        requisiti: [rep.laresh >= 4, monete >= 30]
        esito:
          titolo: Tre sacchi su dieci
          testo: |
            A porta chiusa Marrek ti dice in quale valle mancherà il grano e in
            quale stagione, e quale casato in città lo sa già e sta comprando. Poi
            beve la seconda brocca e non ne parla più.

            {politica-ed-economia Media} Chi sa dove mancherà il pane sa anche
            dove salirà, e in città c'è chi pagherebbe per saperlo prima.
          effetti: { monete: -30, informazioni.segreto: 1 }

  # ------------------------------------------------------------ grado 3 · la stanza del grano
  - id: laresh-la-stanza-del-grano
    presso: laresh
    immagine: ambientazione/laresh
    titolo: La stanza del grano
    sommario: "Sopra il granaio di Casa Velar la Dama tiene una stanza con un letto vero per chi parla all'aia."
    luogo: Laresh, Casa Velar, la stanza sopra il granaio
    area: superficie-fratturata
    ripetibile: true
    requisiti: [fazione.laresh >= 9]
    testo: |
      La stanza sopra il granaio è bassa, con le travi a vista e un letto
      dal materasso di foglie di granturco, e d'inverno il calore del grano
      sale dalle assi. Ogni sera la Dama fa lasciare sul davanzale una
      brocca d'acqua e un pane, che la stanza sia occupata o no.
    opzioni:
      - testo: "Dormire nella stanza del grano"
        descrizione: "Una notte intera senza turni né carri. La mattina il pane è ancora sul davanzale."
        esito:
          titolo: Il pane sul davanzale
          testo: |
            Dormi fino a giorno fatto nell'odore della farina, e la mattina mangi
            il pane del davanzale con le ferite che tirano meno.
          effetti: { ferite: -1, tormento: -0.5 }
      - testo: "Restare a tavola con la Dama a fare i conti"
        descrizione: "Dopo cena la Dama chiude i conti, e a chi le fa compagnia racconta del marito."
        esito:
          titolo: I conti della sera
          testo: |
            Leggi le cifre ad alta voce mentre la Dama somma le colonne. Intanto
            lei racconta di quando il marito comprò il campo del rio basso con un
            cavallo zoppo e una promessa.
          pe: { politica-ed-economia: 3 }
          effetti: { tormento: -0.5 }
