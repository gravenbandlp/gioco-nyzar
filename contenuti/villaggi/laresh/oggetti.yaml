# Gli oggetti della quest di Laresh, uno per grado (il grado 3 è un servizio, la stanza del grano in luogo.yaml).
# - grado 1, passo 3: il fischietto d'osso di Cahir (accessorio, Addestrare animali);
# - grado 2, passo 6: la puledra grigia delle stalle (cavalcatura, accessorio di grado 2 con la chiave cavalcatura);
# - grado 4, passo 12: la giubba delle spigolatrici (armatura di grado 3);
# - grado 5, passo 15: la Falce della chiusa, oggetto unico di grado 4 (Assetata, come la terra sotto il mulino).
oggetti:
  - id: laresh-fischietto-d-osso
    nome: Fischietto d'osso
    immagine: icone/whistle
    descrizione: "Un fischietto ricavato da un osso di capra, lucido di tasca, con due fori per due note. Cahir ci richiama la muta da un campo all'altro, e i suoi cani lo sentono anche quando il vento tira contro."
    slot: accessorio
    grado: 1
    proprieta: { talento: { addestrare-animali: 1 } }

  - id: laresh-puledra-grigia
    nome: Puledra grigia
    immagine: icone/horse-head
    descrizione: "Una puledra grigia delle stalle di Laresh, nata nell'anno della prima spiga nera. Ha il passo lungo dei cavalli da tiro e la pazienza dei cani da soma con cui è cresciuta, e non si spaventa del buio."
    slot: accessorio
    grado: 2
    proprieta: { talento: { cavalcare: 1, resistenza: 1 }, chiave: [cavalcatura] }

  - id: laresh-giubba-delle-spigolatrici
    nome: Giubba delle spigolatrici
    immagine: icone/leather-vest
    descrizione: "Cuoio di vacca cucito doppio dalle donne che spigolano dietro i mietitori, con le cuciture fitte sulle spalle dove si porta il sacco. Ogni spigolatrice ci ha messo un punto suo, e chi la porta lo sa."
    slot: armatura
    base: cuoio-rinforzato
    grado: 3
    dadi: 1
    proprieta: { robusta: 1 }

  - id: laresh-falce-della-chiusa
    nome: Falce della chiusa
    immagine: icone/scythe
    descrizione: "Il fabbro di Laresh l'ha battuta con il metallo della chiusa che hai portato su dal campo che beve, e l'ha montata su un manico di frassino come le falci da guerra dei nonni. La lama è rimasta lucida come il giorno della forgia, e quando morde beve il sangue di chi colpisce."
    slot: arma
    base: ascia-bipenne
    grado: 4
    dadi: 2
    proprieta: { affilata: 1, assetata: true }
    difetti: [legata]
