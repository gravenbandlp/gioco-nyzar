# I nemici e gli scontri della quest di Laresh, tarati con scripts/simula-fine.ts (profilo «fine capitolo»: boss fra
# il 40 e il 60%, gregari sopra l'80%; il Seminatore, boss finale, anche sopra l'80% contro «fine contenuti»).
# - Il campo che beve (Atto IV): i fuochi azzurri nel nido (gregari, eco) e il custode della chiusa (boss del cuore).
# - La notte della mietitura (Atto V): il Seminatore, la macchina sui trampoli che lasciava le impronte nei campi.
nemici:
  - id: laresh-fuoco-azzurro
    immagine: ambientazione/cristalli-conduttori
    nome: Fuoco azzurro
    descrizione: "Una fiammella azzurra grande come un pugno, fredda come l'acqua di fonte. Sotto i campi i fuochi stanno in sciami, e chi entra nello sciame se li sente addosso come brina."
    attacco: 4
    difesa: 4
    difesaMentale: 3
    pf: 4
    danno: 2
    iniziativa: 4
    tratti: [eco]

  - id: laresh-custode-della-chiusa
    immagine: bestiario/salvaguardia-precursori
    nome: Il custode della chiusa
    descrizione: "Una macchina bassa e larga come un carro, con sei braccia snodate che finiscono in rastrelli di metallo. Tiene pulita la chiusa da prima che ci fosse Laresh, e tratta chi la tocca come un ramo caduto nel canale."
    attacco: 5
    difesa: 4
    difesaMentale: 5
    pf: 14
    danno: 3
    riduzione: 4
    iniziativa: 2

  - id: laresh-seminatore
    immagine: bestiario/salvaguardia-precursori
    nome: Il Seminatore
    descrizione: "Un corpo di metallo grande come una tramoggia, in cima a quattro trampoli lunghi tre uomini. Pianta le zampe nella terra come pali e beve da lì, e da quando la chiusa è ferma cammina verso il mulino."
    attacco: 5
    difesa: 4
    difesaMentale: 5
    pf: 16
    danno: 3
    riduzione: 4
    iniziativa: 1

scontri:
  - { id: laresh-fuochi-azzurri, nome: "Lo sciame dei fuochi azzurri", nemici: [laresh-fuoco-azzurro, laresh-fuoco-azzurro], feriteSconfitta: 2 }
  - { id: laresh-la-chiusa, nome: "Il custode della chiusa", nemici: [laresh-custode-della-chiusa], feriteSconfitta: 4 }
  - { id: laresh-il-seminatore, nome: "Il Seminatore", nemici: [laresh-seminatore], feriteSconfitta: 4 }
