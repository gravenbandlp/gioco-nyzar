# La quest di Laresh, «La terra che beve» (fazione.laresh 0 → 15), blocco 3 di docs/piano-superficie.md: dalla vedova
# con il libro dei conti al primo pane del raccolto salvato. Qui la pista, la voce della fazione con i cinque gradi e
# le quality della quest. Gli storylet stanno in passi-1/2/3.yaml, la spedizione dell'Atto IV in
# spedizione-campo.yaml, il luogo, l'attività, il servizio e la reputazione in luogo.yaml.
# - Atto I (passi 1-3, pista.arena >= 5): Dama Ryn Velar e i campi a nord, Old Marrek e l'idromele, i cani di Cahir
#   che ululano verso nord fra mezzanotte e le tre (grado 1, con una traccia sulla Volta dell'Aculeo e una
#   sull'Anello del Camminatore).
# - Atto II (4-6): il giorno della pesa (prima della caduta di Ottone il fattore dei Malgrani, dopo Anselmo Brey e la
#   cooperativa del grano), il reclutatore dei Raschiatori e Ilio Vardo, la licenza di Cahir dal Municipio (grado 2).
# - Atto III (7-9): il nero passa il rio e i campi bruciati, il tubo sotto la cenere da Oda Krell, l'assemblea
#   dell'aia che ferma la macina (grado 3).
# - Atto IV (10-12): la notte dei fuochi (il segno della Campana, mostrato e non spiegato), il campo che beve sotto
#   il mulino centrale (spedizione-campo.yaml), l'acqua che torna nel rio e la camera sotto la macina (grado 4).
# - Atto V (13-15): le impronte nel grano nuovo, il Seminatore nella notte della mietitura (boss finale), il primo
#   pane (grado 5, la Falce della chiusa e dono.laresh).
# Nomi nuovi: Tano (il nipote di Marrek, il «figlio del mugnaio» della lettera di Corin), Ilio Vardo (figlio di un
# fittavolo della Dama), Oreste Ruffo (reclutatore dei Raschiatori), Ugolino Carrà (fattore della concessione dei
# Malgrani), Cenere (il capobranco dei cani di Cahir), il Seminatore e il custode della chiusa (macchine di quelli di
# prima). Dal Codex: Dama Ryn Velar, Old Marrek, Cahir. Tobiolo Mirri viene da contenuti/scoperte/tracce.yaml.
# Varianti di stato: pista.pelle (Malgrani in piedi o caduti, passo 4 e il primo pane), pista.corin >= 6 (Corin è
# stato a Laresh), fazione.gilda >= 4 e gilda.cahir (Cahir ti conosce dalla pista), raschiatore >= 1, fazione.consiglio
# >= 8 (i carri del guado). Nessuna blocca la quest.
quality:
  - { id: fazione.laresh, immagine: ambientazione/laresh, nome: "La terra che beve", categoria: pista, descrizione: "Dama Ryn Velar ti ha aperto il suo libro dei conti alla pagina dei campi a nord, dove il grano nasce nero da tre raccolti." }
  - { id: laresh.ilio, nome: Ilio Vardo, categoria: stato, nascosta: true, descrizione: "1 se Ilio è rimasto a Laresh per la mietitura; 2 se è partito con il reclutatore dei Raschiatori." }
  - { id: laresh.camera, nome: La camera sotto la macina, categoria: stato, nascosta: true, descrizione: "1 se la botola sotto la macina è stata murata; 2 se la camera è andata ai Raschiatori di Oreste Ruffo." }

fazioni:
  - id: laresh
    nome: Laresh
    immagine: ambientazione/laresh
    reputazione: rep.laresh
    pista: fazione.laresh
    gradi:
      - { passo: 3, nome: Ospite dell'aia, ricompensa: "Un posto alla tavola di Casa Velar. Il fischietto d'osso di Cahir, una manciata di monete e le voci dei braccianti sulla Volta dell'Aculeo e sull'Anello del Camminatore." }
      - { passo: 6, nome: Garante dei carri, ricompensa: "Il tuo nome sulla licenza della carovana di Cahir. La puledra grigia delle stalle di Laresh e una borsa di monete." }
      - { passo: 9, nome: Voce dell'aia, ricompensa: "La parola all'assemblea del villaggio. La stanza del grano di Casa Velar, dove si dorme gratis, e una borsa di monete." }
      - { passo: 12, nome: Guardiano del rio, ricompensa: "Il rio di mezzo torna a scorrere. La giubba delle spigolatrici e una borsa pesante." }
      - { passo: 15, nome: Primo pane, ricompensa: "La Falce della chiusa, battuta con il metallo del campo che beve, una borsa pesante e il dono di Laresh per la Campana." }
