# La quest di Laresh, Atto I e II (fazione.laresh 0 → 6).
# - 0 → 1 `laresh-la-vedova-velar` (Casa Velar, pista.arena >= 5): Dama Ryn Velar e il libro dei conti, i campi a
#   nord dove il grano nasce nero. Opzione d'origine del Mercante dei Ponti (le ricevute della concessione).
# - 1 → 2 `laresh-il-mugnaio-cieco` (il mulino centrale) e il seguito `laresh-quello-che-sente-la-macina`: Old
#   Marrek legge il grano bruciato (la carestia se il nero passa il rio di mezzo), sente un secondo battito sotto
#   la macina e manda il protagonista da Cahir. Con pista.corin >= 6 i saluti di Corin bastano come idromele.
# - 2 → 3 `laresh-fra-mezzanotte-e-le-tre` (le stalle a est) e il seguito `laresh-la-tavola-della-dama` (grado 1,
#   Ospite dell'aia): i cani che ululano verso nord, il fischietto d'osso, le voci sulla Volta dell'Aculeo e
#   sull'Anello del Camminatore (traccia.aculeo e traccia.anello +1). Opzioni per chi conosce Cahir dalla pista
#   della Gilda (fazione.gilda >= 4) e per il Fuggiasco di Ghoran.
# - 3 → 4 il giorno della pesa, in due varianti: `laresh-il-giorno-della-pesa` (pista.pelle < 7, Ugolino Carrà, il
#   fattore della concessione dei Malgrani) e `laresh-il-giorno-della-pesa-cooperativa` (pista.pelle >= 7, Anselmo
#   Brey e la cooperativa del grano). In tutte e due il grano buono della Dama resta senza un carro per la città.
# - 4 → 5 `laresh-i-ragazzi-della-cicatrice` (l'aia grande, il giorno di mercato): Oreste Ruffo recluta per i
#   Raschiatori; Ilio Vardo resta (laresh.ilio 1) o parte (2).
# - 5 → 6 `laresh-trenta-cani-per-tre-carri` (Municipio, grado 2, Garante dei carri): Julia Castaldi firma la licenza
#   della carovana di Cahir; la puledra grigia.
storylet:
  # ------------------------------------------------------------ 0 → 1 · la vedova e il libro dei conti
  - id: laresh-la-vedova-velar
    presso: laresh
    immagine: ambientazione/laresh
    titolo: La vedova e il libro dei conti
    sommario: "Dama Ryn Velar amministra le terre del marito da un tavolo sotto il portico. Cerca qualcuno di fuori, che in città non abbia un padrone."
    luogo: Laresh, il portico di Casa Velar
    area: superficie-fratturata
    requisiti: [fazione.laresh == 0, pista.arena >= 5]
    testo: |
      Al bivio Tobiolo Mirri, il carrettiere che porta il grano in città, ti
      ha indicato Casa Velar con il manico della frusta. È la più lunga delle
      case basse di Laresh, con i muri di fango e paglia intrecciata sotto un
      tetto spiovente e un portico che guarda sull'aia. Sotto il portico c'è
      un tavolo, e al tavolo siede Dama Ryn Velar con un libro dei conti
      aperto davanti. È una donna asciutta, vestita di grigio, con i capelli
      tirati sulla nuca e una macchia d'inchiostro sul medio della destra che
      nessun sapone deve averle mai tolto. Scrive una cifra alla volta, e
      prima di voltare pagina passa il palmo aperto sul foglio per stirarlo.

      «Voi non siete della concessione, e al collo non portate la lanterna
      dei Raschiatori» dice senza alzare gli occhi dal foglio. «A conti
      fatti, è già qualcosa.»

      Gira il libro verso di te. La pagina è divisa in colonne, una per ogni
      campo, con i raccolti degli ultimi anni, e nelle colonne dei campi a
      nord i numeri calano da tre raccolti. L'ultimo è una croce. «Lassù il
      grano nasce nero» dice la Dama. «Al mulino dicono che è una ruggine e
      che passa. I miei fittavoli dicono che sono i morti. Mi serve qualcuno
      che vada a guardare senza avere già deciso.»

      {politica-ed-economia Media} Le colonne del nord calano tutte insieme,
      di più quelle vicine al rio di mezzo. Una ruggine si sparge a macchie
      dove la porta il vento, mentre questa segue l'acqua.

      La Dama aspetta con la penna sollevata sopra il foglio. *Una che fa i
      conti due volte non si fida nemmeno dei numeri.* Sull'aia un cane si
      gratta al sole, e il battito della macina arriva dal rio di mezzo.

      {origine mercante-dei-ponti} Il libro è tenuto alla maniera della
      Gilda, con il dare a sinistra e l'avere a destra. In fondo alla pagina
      le ricevute della concessione sono incollate con la cera verde dei
      contratti che passano dalla Casa dei Nodi.
    opzioni:
      - testo: "Andare a vedere i campi a nord"
        descrizione: "Una giornata di cammino fra le spighe, e la sera un resoconto alla Dama, senza abbellimenti."
        prova: { attributo: mentale, abilita: [natura, percezione], difficolta: Media }
        successo:
          titolo: Il grano che segue l'acqua
          testo: |
            Cammini i campi a nord dalla mattina al tramonto. Il nero parte
            dal rio di mezzo e si allarga campo dopo campo verso i lati, e dove
            il grano è nero la terra sotto le radici è fredda come quella di
            una cantina. Alla Dama lo dici senza aggiungere niente, e lei lo
            scrive nel libro con la sua grafia lenta. «Marrek sente quello che
            noi non vediamo» dice poi, e ti manda al mulino centrale con il
            consiglio di portare da bere al vecchio, che senza non sente
            nemmeno chi gli parla.
          pe: { natura: 3 }
          effetti: { fazione.laresh: 1, rep.laresh: 0.5 }
        fallimento:
          titolo: La polvere nera
          testo: |
            Fra le spighe nere perdi la strada due volte, e torni all'aia al
            buio con la polvere scura fin dentro le orecchie. Alla Dama riesci
            a dire soltanto che lassù fa freddo. Lei lo scrive lo stesso,
            perché a Laresh d'estate non fa freddo da nessuna parte, e ti manda
            al mulino centrale da Old Marrek. Ti raccomanda di portargli da
            bere, perché senza da bere il vecchio non sente.
          effetti: { fazione.laresh: 1, tormento: 0.5 }
      - testo: "Rifarle i conti dei campi a nord"
        descrizione: "Le colonne del libro dicono già molto, a chi le legge con pazienza."
        prova: { attributo: mentale, abilita: politica-ed-economia, difficolta: Media }
        successo:
          titolo: Il rio di mezzo
          testo: |
            Ti siedi accanto a lei e rifai le somme campo per campo, con la
            penna di riserva che ti presta senza dire niente. Quando metti i
            campi in fila lungo il rio di mezzo i numeri calano con ordine, dal
            più vicino all'acqua al più lontano. La Dama guarda la colonna a
            lungo e poi rifà la somma da sola, per scrupolo. Alla fine ammette
            che Marrek lo dice da un anno, e ti manda al mulino centrale con il
            consiglio di portargli da bere.
          pe: { politica-ed-economia: 3 }
          effetti: { fazione.laresh: 1, rep.laresh: 0.5 }
        fallimento:
          titolo: La somma sbagliata
          testo: |
            Rifai le somme e ti torna un raccolto più grande di quello che la
            Dama ha messo in granaio. Il fattore, che ascoltava dalla porta,
            ride forte. La Dama ti riprende la penna e rifà la somma da sola,
            poi ti manda al mulino centrale da Old Marrek, che i conti non li
            sa fare e i campi li sente lo stesso.
          effetti: { fazione.laresh: 1, scandalo: 0.5 }
      - testo: "Dirle chiaro che cosa cerchi a Laresh"
        descrizione: "La Dama non ha tempo per le cortesie. Una risposta dritta forse sì."
        prova: { attributo: sociale, abilita: [persuasione, galateo], difficolta: Media }
        successo:
          titolo: Una risposta dritta
          testo: |
            Le dici che in città ti hanno parlato di lei e del grano nero, e
            che vuoi vedere se a Laresh c'è un lavoro per qualcuno che non deve
            niente a nessuno. La Dama ti guarda per la prima volta da quando ti
            sei seduto. Poi chiude il libro con il palmo e ti manda al mulino
            centrale da Old Marrek. «Portategli da bere» aggiunge mentre ti alzi,
            «perché senza il vecchio non vi sente.»
          pe: { persuasione: 3 }
          effetti: { fazione.laresh: 1, rep.laresh: 0.5 }
        fallimento:
          titolo: Le cortesie della città
          testo: |
            Cominci con le cortesie che si usano in città, e alla seconda la
            Dama ricomincia a scrivere. Il fattore si copre la bocca con il
            cappello per non farsi sentire ridere. Quando hai finito lei ti
            manda al mulino centrale da Old Marrek senza alzare gli occhi, e
            ti consiglia di parlare a lui con meno giri, perché il vecchio è
            cieco e con chi gira intorno alle cose si annoia presto.
          effetti: { fazione.laresh: 1, scandalo: 0.5 }
      - testo: "Passare la giornata nei campi con il fattore"
        descrizione: "Il fattore conosce ogni solco della Dama. Ci vuole il giorno intero, e lui parla soltanto di vacche."
        costo: 2
        esito:
          titolo: Le vacche del fattore
          testo: |
            Cammini i campi a nord con il fattore dall'alba al tramonto. Ti
            racconta di ogni vacca che ha avuto chiamandola per nome, e intanto
            ti mostra dove il nero è arrivato quest'anno e dove era l'anno
            scorso, piantando un bastone nella terra a ogni passo. La sera la
            Dama ascolta il suo resoconto e poi il tuo, e ti manda al mulino
            centrale da Old Marrek con il consiglio di portargli da bere.
          pe: { natura: 2 }
          effetti: { fazione.laresh: 1 }
      - testo: "Leggere le ricevute della concessione"
        descrizione: "Le ricevute stanno in fondo alla pagina, con la cera verde della Gilda. Una ricevuta dice sempre più di quello che c'è scritto."
        quando: [origine.mercante-dei-ponti >= 1]
        esito:
          titolo: La cera verde
          testo: |
            Sollevi con l'unghia l'angolo di una ricevuta e la leggi
            controluce, come si fa alla Casa dei Nodi. Da tre anni la
            concessione scrive *seconda scelta* su tutto il grano che arriva
            dai campi a nord, anche su quello buono, e lo paga la metà. La Dama
            lo sapeva senza saperlo dire, e sentirlo da te le basta. Ti manda
            al mulino centrale da Old Marrek e ti raccomanda di portargli da
            bere.
          pe: { politica-ed-economia: 3 }
          effetti: { fazione.laresh: 1, rep.laresh: 0.5 }

  # ------------------------------------------------------------ 1 → 2 · il mugnaio cieco
  - id: laresh-il-mugnaio-cieco
    presso: laresh
    immagine: ambientazione/mulino-malgrani
    titolo: Il mugnaio cieco
    sommario: "Al mulino centrale Old Marrek tiene una mano sulla macina e sente il grano passare. Per leggerti il futuro vuole l'idromele."
    luogo: Laresh, il mulino centrale sul rio di mezzo
    area: superficie-fratturata
    requisiti: [fazione.laresh == 1]
    testo: |
      Il mulino centrale è il più vecchio di Laresh, con le pietre del
      basamento mangiate dall'acqua del rio di mezzo e una ruota così grande
      che a guardarla girare viene il capogiro. Dentro la farina vola nella
      luce delle finestrelle e si posa su tutto, ragnatele comprese. Old
      Marrek siede su uno sgabello accanto alla macina con il palmo aperto
      sull'incastellatura di legno, e la sente girare come si sente il polso
      di un malato. Ha gli occhi bianchi come il latte cagliato e una barba
      che la farina ha reso dello stesso colore.

      Accanto a lui un ragazzino di dodici anni conta le brocche vuote
      allineate sotto la trave. È Tano, il nipote, che lo porta in giro per
      il villaggio tenendolo per la manica.

      «Viene da Casa Velar» dice Marrek al ragazzo prima che tu apra bocca.
      «Cammina sulla paglia con il tallone, alla maniera dei cittadini.»
      Allunga verso di te la mano aperta. «Il grano lo leggo a chi porta il
      dolce, e del nero parlo soltanto a chi ne porta due brocche.»

      {medicina Media} Una cataratta presa da piccolo e mai curata, a
      giudicare dal colore. Le mani invece ci vedono benissimo, e lo sanno.

      {origine accolito-del-velo} Al Velo ti hanno insegnato ad aspettare il
      futuro senza guardarlo in faccia. Marrek lo guarda per una brocca
      d'idromele, e a Laresh nessuno lo trova strano.

      Sotto lo sgabello il pavimento trema con la macina. *Due brocche per
      sapere perché la terra è fredda.* Ogni tanto ti sembra che tremi una
      volta di troppo, nella pausa fra due giri.
    opzioni:
      - testo: "Portargli due brocche d'idromele"
        descrizione: "All'osteria sul rio l'idromele lo tengono apposta per lui, e lo fanno pagare a chi lo porta."
        requisiti: [monete >= 8]
        esito:
          titolo: Il dolce
          testo: |
            Torni dall'osteria con due brocche tappate con la cera, e Tano le
            prende dalle tue mani prima che arrivino a quelle del nonno, per
            contarle. Marrek ne stappa una con i denti e beve un sorso lungo,
            poi ti fa sedere sullo sgabello di fronte al suo e ti prende la
            mano.
          effetti: { monete: -8 }
          segue: laresh-quello-che-sente-la-macina
      - testo: "Cantargli la canzone della spiga"
        descrizione: "A Laresh si paga anche con le canzoni, se sono quelle giuste. Marrek ha l'orecchio fino."
        prova: { attributo: sociale, abilita: espressivita, difficolta: Media }
        successo:
          titolo: La canzone della spiga
          testo: |
            Canti la canzone della spiga, quella che si canta legando i
            covoni, e alla seconda strofa Marrek batte il tempo sul ginocchio.
            Alla terza la canta anche lui, con una voce rotta che ci prende
            meglio della tua. Quando hai finito dice che una canzone vale una
            brocca e che la seconda gliela devi, e ti fa sedere di fronte a lui.
          pe: { espressivita: 3 }
          effetti: { rep.laresh: 0.5 }
          segue: laresh-quello-che-sente-la-macina
        fallimento:
          titolo: La strofa sbagliata
          testo: |
            Attacchi la canzone della spiga e alla seconda strofa ci metti le
            parole di un'altra, che parla di una ragazza e di un fienile.
            Tano scappa fuori a raccontarlo all'osteria prima che tu abbia
            finito. Marrek ride fino a tossire e ti fa sedere lo stesso,
            perché dice che una risata così vale mezza brocca.
          effetti: { scandalo: 0.5 }
          segue: laresh-quello-che-sente-la-macina
      - testo: "Rabboccare la tramoggia al posto di Tano"
        descrizione: "La tramoggia va riempita ogni ora, e Tano è troppo piccolo per i sacchi grandi. Il vecchio paga anche in chiacchiere."
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Media }
        successo:
          titolo: La tramoggia piena
          testo: |
            Sali la scaletta con i sacchi in spalla per tutto il pomeriggio e
            versi il grano nella tramoggia finché la macina canta piena. Marrek
            ascolta contento il cambio di suono, e quando scendi l'ultima
            volta ti dice che hai pagato il dolce con la schiena. Ti fa sedere
            di fronte a lui.
          pe: { atletica: 3 }
          effetti: { rep.laresh: 0.5 }
          segue: laresh-quello-che-sente-la-macina
        fallimento:
          titolo: Il sacco aperto
          testo: |
            Al terzo sacco la cucitura cede in cima alla scaletta, e il grano
            ti finisce addosso e sotto la macina in una cascata che fa urlare
            Tano. Ci vuole un'ora per raccoglierlo. Marrek ti ascolta spazzare
            senza dire niente, e alla fine ti fa sedere di fronte a lui. Si
            vede che lo spettacolo gratis gli è piaciuto.
          effetti: { tormento: 0.5 }
          segue: laresh-quello-che-sente-la-macina
      - testo: "Portargli i saluti di Corin"
        descrizione: "Corin Ashdale ha passato a Laresh mezza stagione, e al mulino centrale qualcuno se lo ricorda bene."
        quando: [pista.corin >= 6]
        esito:
          titolo: Il mercante nel fosso
          testo: |
            Al nome di Corin Tano scoppia a ridere. È lui il ragazzo che l'ha
            ripescato nel fosso, la notte in cui chiamava i fuochi azzurri con
            il fischio dei cani, e ci tiene a dire che è il nipote del mugnaio,
            perché Corin nelle lettere lo chiama figlio. Marrek ride con lui.
            Prima di ripartire Corin ha pagato all'osteria una botticella
            d'idromele per il primo che fosse venuto da parte sua, e Tano corre
            a prenderne due brocche.
          effetti: { rep.laresh: 0.5 }
          segue: laresh-quello-che-sente-la-macina

  - id: laresh-quello-che-sente-la-macina
    presso: laresh
    immagine: ambientazione/mulino-malgrani
    titolo: Quello che sente la macina
    tipo: seguito
    luogo: Laresh, il mulino centrale
    area: superficie-fratturata
    requisiti: [fazione.laresh == 1]
    testo: |
      Marrek ti prende la mano e ti versa sul palmo una manciata di chicchi
      bruciati dalla scodella di coccio, poi ci passa sopra il pollice. Per
      te legge l'amore, perché con i forestieri si comincia da lì, e annuncia
      con grande serietà che incontrerai una persona alta, oppure bassa, che
      ti farà soffrire o ridere. Tano incide una tacca sulla trave.

      Poi prende dalla tasca del grembiule i chicchi neri dei campi a nord, e
      la voce gli cambia. «Se il nero passa il rio di mezzo prima della
      mietitura, a primavera in città mancano tre pani su dieci» dice piano,
      come si dice il prezzo di una vacca. «Sulle carestie il grano non
      sbaglia.» Appoggia la mano sulla macina. «E sotto questa ce n'è
      un'altra. La sento da tre inverni nella pausa fra un giro e l'altro. La terra ogni
      tanto beve sangue, e quando beve ha sete come noi. Come quel legno che
      cresce a Pann...» Si ferma a metà della parola e non la finisce più.

      {empatia Media} Il filo ce l'ha ancora in mano. Ha deciso di non
      tirarlo, e la mano sulla macina gli trema appena.

      {percezione Difficile} Il tremito in più del pavimento arriva sempre
      dopo il giro della macina, regolare, con un passo tutto suo.
    opzioni:
      - testo: "Chiedergli che cosa vuol dire"
        descrizione: "Un vecchio che si ferma a metà di una parola l'ha fatto apposta. Si può provare a farlo ripartire."
        esito:
          titolo: I cani di Cahir
          testo: |
            Marrek scuote la testa e beve. «Vuol dire che i cani di Cahir
            hanno ragione, e io sono vecchio» dice. «Andate alle stalle a est
            dopo mezzanotte, e sentirete anche voi.» Tano ti accompagna fino
            alla porta e ti spiega, a voce bassa, che il nonno di notte non
            dorme più.
          effetti: { fazione.laresh: 1, rep.laresh: 0.5 }
      - testo: "Mettere anche tu la mano sulla macina"
        descrizione: "Il legno dell'incastellatura trema con il sasso. Forse il secondo battito lo sente anche chi ha gli occhi."
        prova: { attributo: mentale, abilita: [percezione, resilienza], difficolta: Media }
        successo:
          titolo: Il secondo battito
          testo: |
            Appoggi il palmo accanto al suo e aspetti, con la farina che ti
            pizzica il naso. Al decimo giro lo senti anche tu, un colpo sordo
            che viene da più in basso del basamento, in ritardo sulla macina
            come un'eco. Marrek sorride senza denti e dice che adesso siete in
            due. Ti manda dai cani di Cahir, alle stalle a est dopo mezzanotte,
            perché loro lo sentono da prima di lui.
          pe: { percezione: 3 }
          effetti: { fazione.laresh: 1, rep.laresh: 0.5 }
        fallimento:
          titolo: Il polso tuo
          testo: |
            Appoggi il palmo accanto al suo e senti soltanto il tuo cuore, che
            batte più forte del sasso. Marrek ride piano e ti toglie la mano dal
            legno come si toglie un gatto dal tavolo. Ti manda da Cahir alle
            stalle a est, e ti dice di andarci dopo mezzanotte.
          effetti: { fazione.laresh: 1, tormento: 0.5 }

  # ------------------------------------------------------------ 2 → 3 · i cani di Cahir (grado 1)
  - id: laresh-fra-mezzanotte-e-le-tre
    presso: laresh
    immagine: icone/wolf-howl
    titolo: Fra mezzanotte e le tre
    sommario: "Alle stalle a est i cani da soma di Cahir ululano tutti insieme verso nord, ogni notte, con il muso nella stessa direzione."
    luogo: Laresh, le stalle a est, dopo mezzanotte
    area: superficie-fratturata
    requisiti: [fazione.laresh == 2]
    testo: |
      Le stalle a est sono tre capannoni di fango e travi in fila lungo un
      rio stretto, con i cavalli da una parte e i cani da soma dall'altra. I
      cani sono grossi come vitelli, con il pelo raso e le orecchie mozze, e
      dormono a coppie nei box con la paglia fino al collo. Cahir siede su un
      secchio rovesciato davanti alla porta, con la pipa spenta fra i denti e
      la cicatrice di morso sull'avambraccio scoperta. È un mezzelfo giovane
      con i capelli legati, e ti saluta alzando il mento.

      «Si vedrà» dice, quando gli chiedi dei cani. È tutto quello che dice
      per un pezzo.

      A mezzanotte i cani si alzano insieme, senza un rumore che li svegli, e
      cominciano a ululare con il muso verso nord. Anche quelli nei box che
      guardano a sud girano la testa per farlo. L'ululato è lungo e basso,
      sempre sulla stessa nota, e lo tiene il capobranco, un cane grigio che
      Cahir chiama Cenere.

      {addestrare-animali Media} La fame e la paura i cani le dicono in un
      altro modo. Cenere ascolta fra un ululato e l'altro, con le orecchie mozze
      tese, come se aspettasse una risposta.

      {natura Facile} Non c'è vento e non c'è odore di bestie. Il nord, da
      qui, è soltanto grano nero fino all'orizzonte.

      «Fino alle tre» dice Cahir, e accende finalmente la pipa. «Poi si
      mangiano la paglia e dormono come sassi. Li ho cambiati di box, li ho
      portati a sud del rio. Girano la testa lo stesso.»

      {origine fuggiasco-di-ghoran} Quell'ululato basso lo conosci, e le
      spalle ti si alzano da sole verso le orecchie. A Ghoran lo fanno i cani
      dei recinti quando hanno trovato una pista e aspettano che qualcuno li
      sciolga.
    opzioni:
      - testo: "Sciogliere Cenere e seguirlo verso nord"
        descrizione: "Il capobranco sa dove guarda. Basta lasciarlo andare e stargli dietro nel buio."
        prova: { attributo: sociale, abilita: addestrare-animali, difficolta: Media }
        successo:
          titolo: Cenere nel grano nero
          testo: |
            Sciogli Cenere e gli corri dietro con la lanterna fra i campi, fino
            dove il grano diventa nero. Lì il cane si ferma, raspa due volte la
            terra e ci mette sopra l'orecchio. Lo fai anche tu, e sotto la
            terra fredda senti scorrere qualcosa, lontano, come acqua dentro un
            tubo che qualcuno sta succhiando. Alle tre Cenere si scuote e torna
            alle stalle da solo.
          pe: { addestrare-animali: 3 }
          effetti: { rep.laresh: 0.5 }
          segue: laresh-la-tavola-della-dama
        fallimento:
          titolo: Il fosso
          testo: |
            Sciogli Cenere, e il cane parte così veloce che la lanterna ti
            resta indietro. Lo perdi nel grano nero, finisci in un fosso con
            l'acqua alle ginocchia e ci resti finché Cahir non arriva a
            ripescarti con un fischio, il cane già seduto accanto a lui.
          effetti: { tormento: 0.5 }
          segue: laresh-la-tavola-della-dama
      - testo: "Segnare con il gesso la direzione dei musi"
        descrizione: "Se tutti i cani guardano lo stesso punto, le loro linee sul pavimento lo dicono meglio delle parole."
        prova: { attributo: mentale, abilita: [percezione, natura], difficolta: Media }
        successo:
          titolo: Le righe di gesso
          testo: |
            Passi di box in box con un pezzo di gesso e tiri una riga sul
            pavimento sotto il muso di ogni cane. Alle tre, quando smettono,
            le righe sono tutte parallele, come le tracce di un rastrello, e
            puntano a nord un poco verso levante. Oltre i campi neri, da quella
            parte, non c'è niente che tu conosca. Cahir guarda il pavimento e
            non cancella le righe.
          pe: { percezione: 3 }
          effetti: { rep.laresh: 0.5 }
          segue: laresh-la-tavola-della-dama
        fallimento:
          titolo: Il gesso calpestato
          testo: |
            Tiri le tue righe di gesso, e alle tre i cani si alzano a mangiare
            la paglia e le calpestano tutte. Ti resta una manciata di linee
            storte che non puntano da nessuna parte, e Cahir che le guarda
            fumando, con un sopracciglio alzato.
          effetti: { tormento: 0.5 }
          segue: laresh-la-tavola-della-dama
      - testo: "Restare sveglio con Cahir a parlare della sua carovana"
        descrizione: "Cahir parla poco, tranne che di una cosa. Fino alle tre c'è tempo."
        prova: { attributo: sociale, abilita: [empatia, persuasione], difficolta: Media }
        successo:
          titolo: Da pari a pari
          testo: |
            Gli chiedi della carovana, e Cahir parla fino alle tre senza
            fermarsi. Trenta cani per tre carri, il grano di Laresh portato in
            città da chi lo coltiva, venduto da pari a pari senza nessuno in
            mezzo a prendersi la parte. Lo dice piano, per non farsi sentire
            dai cani, e alla fine ti chiede se sembra una cosa da matti.
          pe: { empatia: 3 }
          effetti: { rep.laresh: 0.5 }
          segue: laresh-la-tavola-della-dama
        fallimento:
          titolo: La Gilda
          testo: |
            Gli chiedi della carovana con la voce di uno che sta facendo un
            conto, e Cahir ti chiede subito se ti manda la Gilda. Gli rispondi
            di no, e lui ricomincia a parlare con i cani. Fino alle tre non ti
            rivolge più la parola.
          effetti: { sospetto: 0.5 }
          segue: laresh-la-tavola-della-dama
      - testo: "Ricordargli la pista e il grano nero"
        descrizione: "Sulla pista di Laresh i suoi cani tenevano il muso a nord anche allora. Cahir ti conosce."
        quando: [fazione.gilda >= 4]
        esito:
          titolo: La stessa nota
          testo: |
            Cahir ti riconosce quando entri nella luce della porta e ti fa
            posto su un secondo secchio. Gli ricordi i cani sulla pista, con il
            muso a nord anche quando la strada girava a sud, e lui annuisce.
            «Allora era uno ogni tanto» dice. «Adesso ululano tutti insieme ogni
            notte, e sempre sulla stessa nota.» Restate a sentirli fino alle
            tre, uno accanto all'altro.
          effetti: { rep.laresh: 0.5 }
          segue: laresh-la-tavola-della-dama
      - testo: "Mostrargli la cinghia intrecciata che ti ha regalato"
        descrizione: "Sulla pista di Laresh hai lasciato il suo nome fuori dal rapporto, e lui ti ha dato una cinghia da cane che non valeva niente."
        quando: [gilda.cahir == 1]
        esito:
          titolo: La cinghia
          testo: |
            Tiri fuori dalla tasca la cinghia intrecciata, e Cahir la riconosce
            prima di riconoscere te. Ride piano, per la prima volta da quando
            sei arrivato. «Allora sei quello della riga in meno» dice, e ti
            racconta della sua carovana fino alle tre, mentre i cani ululano a
            nord sulla stessa nota.
          effetti: { rep.laresh: 0.5 }
          segue: laresh-la-tavola-della-dama
      - testo: "Dire a Cahir che cosa vuol dire quell'ululato a Ghoran"
        descrizione: "Quel suono lo conosci da prima di sapere che cos'è. A Ghoran i cani lo fanno quando hanno una pista."
        quando: [origine.fuggiasco-di-ghoran >= 1]
        esito:
          titolo: I cani dei recinti
          testo: |
            Glielo dici a voce bassa, con le mani in tasca perché non le veda
            tremare. Cahir ti guarda a lungo, poi guarda i cani. «Una pista»
            ripete. «E nessuno che li sciolga.» Restate seduti fino alle tre
            senza parlare, e quando i cani smettono ti passa la pipa, che per
            lui è più di una stretta di mano.
          effetti: { rep.laresh: 0.5 }
          segue: laresh-la-tavola-della-dama

  - id: laresh-la-tavola-della-dama
    presso: laresh
    immagine: ambientazione/laresh
    titolo: La tavola di Casa Velar
    tipo: seguito
    luogo: Laresh, la cucina di Casa Velar, all'alba
    area: superficie-fratturata
    requisiti: [fazione.laresh == 2]
    testo: |
      All'alba la cucina di Casa Velar è piena del fumo del pane e delle
      voci dei braccianti, seduti lungo una tavola che occupa tutta la
      stanza. La Dama siede in fondo, con il libro dei conti chiuso accanto
      alla scodella, e ti indica il posto alla sua destra senza dire niente.
      Cahir entra con due secchi di latte, li posa sul focolare e ti lascia
      cadere accanto al piatto un fischietto d'osso lucido di tasca. «Per
      Cenere» dice soltanto, e se ne va.

      I braccianti parlano dei cani, e poi dei posti dove le capre non
      vogliono andare. Uno racconta della Conca dei Rovi, a ovest, dove c'è
      un foro che una notte all'anno fischia come un richiamo. Una donna con
      le mani rosse di lisciva parla di nove pietre nere ai margini del
      Rovolungo, a nord-ovest, dove i pastori non portano le greggi.

      {accademiche Media} Nove pietre nere in cerchio e un foro che fischia.
      Nei registri della Biblioteca, accanto a nomi così, c'è sempre scritto
      *non scavato*.

      La Dama ascolta tutto mangiando adagio, poi apre il libro e scrive il
      tuo nome in una colonna che ha in cima la parola *tavola*.
    opzioni:
      - testo: "Raccontare alla Dama la notte alle stalle"
        descrizione: "Lei vuole i fatti, nell'ordine in cui sono successi. Il resto lo lascia ai braccianti."
        esito:
          titolo: Ospite dell'aia
          testo: |
            Le racconti la notte dall'inizio, e lei ti ferma due volte per
            farsi ripetere la direzione. Poi chiude il libro con il palmo. «A
            conti fatti, siete dei nostri» dice. «Alla mia tavola c'è un posto
            per voi quando volete.» Sotto il tavolo ti passa una borsa di
            monete, perché davanti ai braccianti non si parla di paga.
          almeno: { rep.laresh: 2 }
          effetti: { fazione.laresh: 1, monete: 30, oggetto.laresh-fischietto-d-osso: 1, traccia.aculeo: 1, traccia.anello: 1 }
      - testo: "Farti raccontare dai braccianti le strade per i posti neri"
        descrizione: "Chi ha parlato della Conca e delle nove pietre sa anche da dove si passa, se qualcuno glielo chiede con il pane in mano."
        esito:
          titolo: Le strade delle capre
          testo: |
            Ti siedi in mezzo ai braccianti con la tua fetta di pane, e loro ti
            tracciano sulla tavola con il dito bagnato le strade delle capre
            fino alla Conca dei Rovi e fino alle pietre. La Dama vi lascia fare.
            Quando ti alzi ti dice che alla sua tavola c'è un posto per te,
            e ti fa scivolare in mano una borsa di monete senza guardarti.
          almeno: { rep.laresh: 2 }
          effetti: { fazione.laresh: 1, monete: 30, oggetto.laresh-fischietto-d-osso: 1, traccia.aculeo: 1, traccia.anello: 1 }

  # ------------------------------------------------------------ 3 → 4 · il giorno della pesa (prima della caduta dei Malgrani)
  - id: laresh-il-giorno-della-pesa
    presso: laresh
    immagine: fazioni/famiglia-malgrani
    titolo: Il giorno della pesa
    sommario: "Al mulino centrale il fattore della concessione pesa il grano di Laresh con i pesi suoi. Quest'anno la macina costa di più, e il grano nero lo conta come buono."
    luogo: Laresh, l'aia del mulino centrale
    area: superficie-fratturata
    requisiti: [fazione.laresh == 3, pista.pelle < 7]
    testo: |
      Il giorno della pesa l'aia del mulino centrale è piena di carri, e i
      sacchi aspettano in fila davanti a una bilancia a bracci alta come un
      uomo. Accanto alla bilancia, su una sedia portata da casa, siede Ugolino
      Carrà, il fattore della concessione dei Malgrani. Ha una giacca di
      panno buono e sul bavero lo stemma dei padroni, un albero trafitto da
      una lama, in ottone lucido. I pesi li tira fuori uno alla volta da una
      cassetta foderata di velluto.

      «Per contratto» dice Carrà a ogni sacco, prima di scrivere. Sui sacchi
      dei campi a nord scrive *buono* anche quando il grano dentro è nero, e
      così la quota che Laresh deve alla concessione resta intera. La macina,
      quest'anno, costa ai contadini più dell'anno scorso, e anche questo è
      per contratto.

      La Dama sta in piedi accanto alla bilancia con il libro dei conti
      stretto al petto. Old Marrek, sul suo sgabello alla porta del mulino,
      ascolta i pesi che battono sul piatto.

      {percezione Media} Il peso più grande è più lucido degli altri sul
      fondo, come se qualcuno l'avesse limato e ripassato da poco.

      {politica-ed-economia Media} Una concessione che rincara senza un
      cattivo raccolto a giustificarla, di solito, vuol dire che a un casato
      serve denaro in fretta.

      {origine rampollo-dei-quartieri-alti} Carrà l'hai visto aspettare
      nell'anticamera del Maniero Malgrani con il cappello in mano. Qui il
      cappello lo tiene in testa, e la sedia se l'è portata da casa.
    opzioni:
      - testo: "Contestare il peso più grande"
        descrizione: "Un peso limato e ripassato pesa quello che vuole chi l'ha limato. Bisogna dimostrarlo davanti a tutti."
        prova: { attributo: mentale, abilita: [percezione, tecnologia], difficolta: Media }
        successo:
          titolo: Il piombo nel fondo
          testo: |
            Chiedi a Carrà di pesare il suo peso grande contro quelli della
            Dama, e davanti a tutta l'aia il piatto scende dalla parte sua. Nel
            fondo c'è un tappo di piombo colato di fresco. Carrà dice che sarà
            stato il fabbro e rifà la pesa con i pesi della Dama, scrivendo in
            fretta. Prima di andarsene ti avverte che la concessione macina
            soltanto il grano che pesa lei. «Ci serve un carro che non sia loro» dice la Dama, guardando verso le stalle di Cahir.
          pe: { percezione: 3 }
          effetti: { fazione.laresh: 1, rep.laresh: 0.5 }
        fallimento:
          titolo: Il peso giusto
          testo: |
            Chiedi a Carrà di pesare il suo peso grande contro quelli della
            Dama, e i piatti si fermano pari. Carrà ringrazia a voce alta per
            il controllo e si fa ridere dietro dai carrettieri. La pesa finisce
            com'era cominciata, e prima di andarsene ti ricorda che la
            concessione macina soltanto il grano che pesa lei. «Ci serve un carro che non sia loro» dice la Dama, guardando verso le stalle di Cahir.
          effetti: { fazione.laresh: 1, scandalo: 0.5 }
      - testo: "Far scrivere a verbale il grano nero"
        descrizione: "Un sacco nero scritto buono davanti a cento testimoni è una cosa che si può far correggere, se qualcuno alza la voce al momento giusto."
        prova: { attributo: sociale, abilita: [persuasione, intimidire], difficolta: Media }
        successo:
          titolo: Il verbale
          testo: |
            Apri un sacco dei campi a nord davanti alla bilancia e ci infili
            il braccio fino al gomito. Quando lo tiri fuori è nero fino alla
            spalla, e l'aia intorno ammutolisce. Carrà, con cento occhi addosso, scrive
            *perduto* al posto di *buono* su tutti i sacchi del nord. Prima di
            andarsene ti fa sapere che la concessione macina soltanto il grano
            che pesa lei. «Ci serve un carro che non sia loro» dice la Dama, guardando verso le stalle di Cahir.
          pe: { persuasione: 3 }
          effetti: { fazione.laresh: 1, rep.laresh: 0.5 }
        fallimento:
          titolo: Per contratto
          testo: |
            Alzi la voce, e Carrà alza la penna e ti legge il contratto ad
            alta voce, clausola per clausola, finché i carrettieri smettono di
            ascoltare e tornano ai loro sacchi. La pesa finisce come voleva
            lui. Prima di andarsene ti ricorda che la concessione macina
            soltanto il grano che pesa lei. «Ci serve un carro che non sia loro» dice la Dama, guardando verso le stalle di Cahir.
          effetti: { fazione.laresh: 1, scandalo: 0.5 }
      - testo: "Pagare di tasca tua la differenza"
        descrizione: "Una borsa sul tavolo di Carrà chiude la pesa senza discussioni. La Dama non sarà contenta."
        requisiti: [monete >= 40]
        esito:
          titolo: La borsa sul tavolo
          testo: |
            Posi la borsa sul tavolo di Carrà, e lui conta le monete con le
            dita guantate e scrive *saldato* in fondo alla pagina. La Dama
            scrive il tuo nome nel suo libro, fra quelli a cui Casa Velar deve
            qualcosa, e non ti ringrazia. Quando la concessione se ne va guarda verso le stalle di Cahir e dice che serve un carro che non sia loro.
          effetti: { monete: -40, fazione.laresh: 1, rep.laresh: 0.5 }
      - testo: "Rimettere in pari la bilancia con il campione della Gilda"
        descrizione: "Nella borsa del Mercante c'è sempre il campione di ottone con il bollo della Gilda. Davanti a quello, un peso limato non ha niente da dire."
        quando: [origine.mercante-dei-ponti >= 1]
        esito:
          titolo: Il bollo della Gilda
          testo: |
            Tiri fuori dalla borsa il campione di ottone con il bollo della
            Gilda e lo posi sul piatto contro il peso grande di Carrà. Il
            piatto scende dalla parte sbagliata, e in mezzo all'aia nessuno ha
            bisogno di spiegazioni. Carrà rifà la pesa con il tuo campione e prima
            di andarsene ti dice che la concessione macina soltanto il grano che
            pesa lei. «Ci serve un carro che non sia loro» dice la Dama, guardando verso le stalle di Cahir.
          pe: { politica-ed-economia: 3 }
          effetti: { fazione.laresh: 1, rep.laresh: 0.5 }

  # ------------------------------------------------------------ 3 → 4 · il giorno della pesa (dopo la caduta dei Malgrani)
  - id: laresh-il-giorno-della-pesa-cooperativa
    presso: laresh
    immagine: personaggi/anselmo-brey
    titolo: Il giorno della pesa
    sommario: "La prima pesa dopo i Malgrani la fa Anselmo Brey in persona, con il quaderno della cooperativa. La quota di Laresh la prende da un registro che ha ereditato."
    luogo: Laresh, l'aia del mulino centrale
    area: superficie-fratturata
    requisiti: [fazione.laresh == 3, pista.pelle >= 7]
    testo: |
      Il giorno della pesa l'aia del mulino centrale è piena di carri, e i
      sacchi aspettano in fila davanti a una bilancia a bracci alta come un
      uomo. La prima pesa dopo la caduta dei Malgrani la fa Anselmo Brey in
      persona, il mugnaio che la cooperativa del grano ha scelto come capo.
      Starnutisce a ogni sacco che si apre e scrive su un quaderno di conti
      tenuto meglio dei registri del Comune, con il cappello appoggiato sul
      ginocchio.

      Accanto al quaderno tiene aperto il registro vecchio dei Malgrani, e la
      quota di Laresh la legge da lì. «Questi
      numeri li ho ereditati» dice alla Dama, con il dito sulla pagina. «La
      città deve mangiare, e io devo sapere quanto le manda Laresh.» Sui
      sacchi dei campi a nord si ferma ogni volta, e ogni volta starnutisce.

      La Dama sta in piedi accanto alla bilancia con il libro dei conti
      stretto al petto. Old Marrek, sul suo sgabello alla porta del mulino,
      ascolta i pesi che battono sul piatto.

      {politica-ed-economia Media} I raccolti che il registro vecchio dà a
      Laresh sono più alti di quelli che la Dama ha in granaio da almeno
      cinque anni. Una concessione che scrive raccolti grandi chiede quote
      grandi.

      {empatia Facile} Anselmo vorrebbe essere da un'altra parte. Ha la
      faccia di un uomo onesto a cui hanno messo in mano i conti di un ladro.

      {origine mercante-dei-ponti} Il registro vecchio ha la cera verde della
      Gilda sul dorso, e i timbri delle pagine sono tutti della stessa mano.
      Alla Casa dei Nodi un registro così si chiama comodo.
    opzioni:
      - testo: "Rifare con Anselmo i conti del registro vecchio"
        descrizione: "Il quaderno di Anselmo è onesto e il registro dei Malgrani no. Messi uno accanto all'altro, lo dicono da soli."
        prova: { attributo: mentale, abilita: politica-ed-economia, difficolta: Media }
        successo:
          titolo: I numeri ereditati
          testo: |
            Mettete il registro vecchio accanto al libro della Dama e li
            confrontate anno per anno. A ogni riga Anselmo starnutisce e tira una riga sul numero
            dei Malgrani. Alla fine la quota di Laresh è quella vera, più
            piccola, con il grano nero segnato come perduto. Anselmo chiude il
            quaderno e ammette che la cooperativa quest'anno non ha carri da
            mandare fin qui. «Ci serve un carro nostro» dice la Dama, guardando verso le stalle di Cahir.
          pe: { politica-ed-economia: 3 }
          effetti: { fazione.laresh: 1, rep.laresh: 0.5 }
        fallimento:
          titolo: L'anno prossimo
          testo: |
            Cominci a confrontare i due registri e ti perdi alla terza annata,
            mentre i carrettieri aspettano al sole e cominciano a lamentarsi ad
            alta voce. Anselmo promette di rifare i conti l'anno prossimo e
            tiene la quota vecchia, con aria dispiaciuta. Ammette anche che la
            cooperativa non ha carri da mandare fin qui. «Ci serve un carro nostro» dice la Dama, guardando verso le stalle di Cahir.
          effetti: { fazione.laresh: 1, scandalo: 0.5 }
      - testo: "Portarlo a vedere i campi a nord"
        descrizione: "Anselmo ha la farina fino ai polsi, e il grano lo conosce. Il nero, visto da vicino, convince più di un registro."
        prova: { attributo: sociale, abilita: [persuasione, empatia], difficolta: Media }
        successo:
          titolo: Il campo nero
          testo: |
            Lo porti fino al primo campo nero e gli metti in mano una spiga.
            Anselmo la sbriciola fra le dita e smette perfino di starnutire.
            Al mulino scrive *perduto* su tutti i sacchi del nord e abbassa la
            quota senza consultare il registro vecchio. Poi ammette che la
            cooperativa non ha carri da mandare fin qui. «Ci serve un carro nostro» dice la Dama, guardando verso le stalle di Cahir.
          pe: { persuasione: 3 }
          effetti: { fazione.laresh: 1, rep.laresh: 0.5 }
        fallimento:
          titolo: La polvere
          testo: |
            A metà strada la polvere del grano nero gli entra nel naso, e
            Anselmo starnutisce tanto da doversi sedere in un fosso. Torna al
            mulino senza aver visto niente, e davanti ai carrettieri tiene la
            quota del registro vecchio. Ammette anche che la cooperativa non ha
            carri da mandare fin qui. «Ci serve un carro nostro» dice la Dama, guardando verso le stalle di Cahir.
          effetti: { fazione.laresh: 1, scandalo: 0.5 }
      - testo: "Pagare di tasca tua la differenza"
        descrizione: "Una borsa sul quaderno di Anselmo chiude la pesa senza discussioni. La Dama non sarà contenta."
        requisiti: [monete >= 40]
        esito:
          titolo: La borsa sul quaderno
          testo: |
            Posi la borsa sul quaderno, e Anselmo la guarda come se gli avessi
            portato un cane bagnato. Conta le monete, scrive *saldato* e ti
            ringrazia due volte. La Dama scrive il tuo nome nel suo libro, fra
            quelli a cui Casa Velar deve qualcosa. Quando Anselmo ammette che la
            cooperativa non ha carri da mandare fin qui, lei guarda verso le stalle di Cahir e dice che serve un carro di Laresh.
          effetti: { monete: -40, fazione.laresh: 1, rep.laresh: 0.5 }
      - testo: "Mostrargli come la Gilda conta le perdite"
        descrizione: "Alla Casa dei Nodi le perdite si scrivono in una colonna a parte, con il testimone accanto. Anselmo quel metodo non lo conosce."
        quando: [origine.mercante-dei-ponti >= 1]
        esito:
          titolo: La colonna a parte
          testo: |
            Gli tiri una colonna nuova sulla destra del quaderno e ci scrivi il
            grano nero sacco per sacco con il nome della Dama come testimone.
            Anselmo la studia fra uno starnuto e l'altro, poi la copia sul registro della
            cooperativa con la sua grafia rotonda. Poi ammette che quest'anno
            la cooperativa non ha carri da mandare fin qui. «Ci serve un carro nostro» dice la Dama, guardando verso le stalle di Cahir.
          pe: { politica-ed-economia: 3 }
          effetti: { fazione.laresh: 1, rep.laresh: 0.5 }

  # ------------------------------------------------------------ 4 → 5 · i ragazzi della Cicatrice
  - id: laresh-i-ragazzi-della-cicatrice
    presso: laresh
    immagine: fazioni/raschiatori
    titolo: I ragazzi della Cicatrice
    sommario: "Il giorno di mercato un reclutatore dei Raschiatori apre il suo registro sull'aia grande. In fila davanti al tavolo ci sono sei ragazzi di Laresh."
    luogo: Laresh, l'aia grande, il giorno di mercato
    area: superficie-fratturata
    requisiti: [fazione.laresh == 4]
    testo: |
      Il giorno di mercato l'aia grande di Laresh si riempie di bancarelle di
      formaggi e di finimenti, e in fondo, accanto al pozzo, c'è un carro con
      una lanterna dipinta sulla tela. Davanti al carro un uomo sui
      cinquant'anni ha piazzato un tavolino pieghevole con un registro
      aperto. Gli manca l'orecchio sinistro, e porta i capelli corti apposta,
      perché si veda. Si chiama Oreste Ruffo e recluta per i Raschiatori.

      In fila davanti al tavolo ci sono sei ragazzi. Il primo è Ilio Vardo,
      il figlio di un fittavolo della Dama. Ha sedici anni e le mani tagliate
      dalla falce, e sua madre guarda dal bordo dell'aia con il grembiule
      stretto nei pugni.

      «Al Grifone di Ferro si mangia due volte al giorno» dice Ruffo ai
      ragazzi, con una voce calma da vecchio maestro. «E in Cicatrice in un
      mese si porta a casa quello che qui si porta a casa in un raccolto.»

      La Dama arriva dal portico a passi lunghi, con il libro sotto il
      braccio, e si ferma davanti al tavolo. «Ai Raschiatori i ragazzi li
      presto» dice. «E indietro mi tornano i nomi, scritti su una lanterna.»

      {intimidire Media} Ruffo non si alza e non alza la voce. È abituato a
      gente che urla, e ha imparato che chi urla di solito firma lo stesso.

      {origine apprendista-raschiatore} Sulle piattaforme hai visto arrivare
      ragazzi così ogni stagione, con le mani da contadino e le spalle buone.
      I primi turni li passano a vomitare nella Cicatrice.

      {origine figlio-della-citta-bassa} Nei vicoli il reclutatore passa a
      primavera, e chi ha fame firma. Qui la fame non c'è ancora, e i ragazzi
      firmano lo stesso.
    opzioni:
      - testo: "Convincere Ilio a restare almeno per la mietitura"
        descrizione: "Sedici anni, e la Cicatrice gli sembra il mondo. Bisogna parlargli di quello che lascia, senza fargli la predica."
        prova: { attributo: sociale, abilita: [empatia, persuasione], difficolta: Media }
        successo:
          titolo: Dopo la mietitura
          testo: |
            Ti metti accanto a Ilio nella fila e gli chiedi chi miete il campo
            di suo padre, quest'anno. Ilio guarda sua madre. Esce dalla fila
            senza dire niente, e Ruffo chiude il registro sul suo nome con
            un'alzata di spalle, come uno che sa aspettare. La Dama lo
            ringrazia con un cenno della testa, e il cenno vale anche per te.
          pe: { empatia: 3 }
          imposta: { laresh.ilio: 1 }
          effetti: { fazione.laresh: 1, rep.laresh: 0.5 }
        fallimento:
          titolo: La firma
          testo: |
            Gli parli di sua madre e del campo di suo padre, e Ilio diventa rosso
            davanti a tutta l'aia. Firma per dispetto, con una croce grande che
            buca il foglio. Partirà con Ruffo all'alba. La Dama ti guarda come
            si guarda un conto che non torna, e torna al portico senza dirti
            niente.
          imposta: { laresh.ilio: 2 }
          effetti: { fazione.laresh: 1, scandalo: 0.5 }
      - testo: "Trattare con Ruffo un contratto giusto"
        descrizione: "Se i ragazzi devono andare, che vadano con un contratto scritto. Ritorno per la mietitura e paga mandata a casa."
        prova: { attributo: sociale, abilita: [persuasione, conoscenze-della-strada], difficolta: Media }
        successo:
          titolo: Il contratto
          testo: |
            Ti siedi davanti al tavolino e tratti con Ruffo come si tratta un
            carico di grano. Alla fine il registro ha due righe in più per ogni
            ragazzo, una con il ritorno a Laresh per la mietitura e una con la
            paga mandata alla famiglia ogni mese. Ruffo le scrive di suo
            pugno e soffia sull'inchiostro. Ilio firma per primo, e la Dama
            legge le righe nuove due volte prima di lasciarlo andare.
          pe: { persuasione: 3 }
          imposta: { laresh.ilio: 2 }
          effetti: { fazione.laresh: 1, rep.laresh: 0.5 }
        fallimento:
          titolo: Le condizioni dei Raschiatori
          testo: |
            Ruffo ti ascolta con pazienza e poi ti spiega, senza cambiare
            tono, che le condizioni le fa Dragna Gro-Malog al Grifone e non
            un forestiero su un'aia. I ragazzi firmano alle sue. Ilio partirà
            all'alba, e la Dama torna al portico con il libro stretto sotto il
            braccio.
          imposta: { laresh.ilio: 2 }
          effetti: { fazione.laresh: 1, scandalo: 0.5 }
      - testo: "Lasciare che decida la Dama"
        descrizione: "I ragazzi sono figli dei suoi fittavoli. La parola è sua, e lei la dirà comunque."
        esito:
          titolo: La parola della Dama
          testo: |
            Fai un passo indietro, e la Dama ne fa uno avanti. Dice a Ilio che
            il campo di suo padre quest'anno lo miete lui, e Ilio esce dalla
            fila a testa bassa, con le orecchie rosse. Gli altri cinque firmano.
            Ruffo chiude il registro e ti guarda come si guarda uno che ha
            scelto di non scegliere.
          imposta: { laresh.ilio: 1 }
          effetti: { fazione.laresh: 1 }
      - testo: "Parlare a Ruffo da Raschiatore"
        descrizione: "Hai il nome sulla bacheca del Grifone. Una parola fra gente dei turni pesa più di un contratto."
        quando: [raschiatore >= 1]
        esito:
          titolo: Fra gente dei turni
          testo: |
            Gli mostri il polso, e Ruffo guarda il segno dei turni prima di
            guardare te. Gli dici che i ragazzi di Laresh li vuoi nella tua fila
            quando scendono, e che per la mietitura tornano a casa. Ruffo ci
            pensa, poi scrive le due righe sul registro di suo pugno. Ilio firma
            per primo, e la Dama ti guarda come si guarda una persona di cui
            fidarsi, un poco controvoglia.
          imposta: { laresh.ilio: 2 }
          effetti: { fazione.laresh: 1, rep.laresh: 0.5 }
      - testo: "Raccontare a Ilio i primi turni"
        descrizione: "I primi turni li hai fatti anche tu. Basta raccontarli come sono andati, senza abbellirli."
        quando: [origine.apprendista-raschiatore >= 1]
        esito:
          titolo: Il primo turno
          testo: |
            Racconti a Ilio il tuo primo turno, la corda che gira e il buio
            sotto i piedi, e il ragazzo che vomitava accanto a te e che il
            secondo turno non l'ha fatto. Ilio ascolta con la bocca aperta.
            Poi esce dalla fila e torna da sua madre, e Ruffo, che ha
            ascoltato anche lui, chiude il registro senza protestare.
          imposta: { laresh.ilio: 1 }
          effetti: { fazione.laresh: 1, rep.laresh: 0.5 }

  # ------------------------------------------------------------ 5 → 6 · trenta cani per tre carri (grado 2)
  - id: laresh-trenta-cani-per-tre-carri
    presso: municipio
    immagine: personaggi/julia-castaldi
    titolo: Trenta cani per tre carri
    sommario: "Cahir è venuto in città con un foglio piegato in quattro. Per portare il grano di Laresh fino ai granai del Comune gli serve una licenza, e la licenza la firma Julia Castaldi."
    luogo: Municipio, l'ufficio della Rappresentante
    area: quartieri-alti
    requisiti: [fazione.laresh == 5]
    testo: |
      Nell'anticamera del Municipio Cahir sta seduto in punta di panca,
      con il cappello di feltro fra le mani e l'odore delle stalle addosso.
      Fra i postulanti in giacca è l'unico ad avere le orecchie a punta, e
      gli altri gli lasciano un palmo di panca libero da ogni lato. Nella
      tasca della camicia ha un foglio piegato in quattro, che tocca ogni
      tanto per sentire se c'è ancora.

      Quando Tullio chiama il suo nome, Cahir ti guarda. «Vieni anche tu»
      dice. «Tu parli come loro.»

      Julia Castaldi lo riceve dietro una scrivania coperta di pratiche già
      lette, con i capelli corti sopra le orecchie e la voce roca di chi
      parla da stamattina. Legge il foglio di Cahir due volte. C'è scritto
      trenta cani per tre carri, il grano di Casa Velar e di chi vorrà
      unirsi, portato ai granai del Comune senza passare da nessun altro.

      «La licenza la firmo io» dice Julia, e posa il foglio. «Il resto lo
      devono firmare altri, e quegli altri mi chiederanno perché.» Poi guarda
      te. «Me lo dica lei, perché.»

      {galateo Media} Cahir tiene il cappello come si tiene un uccello
      ferito. In questa stanza ha paura di tutto tranne che di Julia,
      l'unica che lo guarda in faccia.

      {politica-ed-economia Media} Una carovana che non è della Gilda e non è
      della concessione toglie un poco di grano a tutti e due. Julia lo sa, e
      vuole sentire se lo sai anche tu.

      *Trenta cani, e la Gilda che conta i suoi.* Dalla finestra arriva il
      rumore della piazza, e Cahir si gira a guardarla.

      {origine rampollo-dei-quartieri-alti} In questo ufficio ci sei entrato da
      bambino, per mano a qualcuno che chiedeva un favore. Allora la
      scrivania era più ordinata, e la Rappresentante era un'altra.
    opzioni:
      - testo: "Dirle perché alla città conviene"
        descrizione: "Il pane di Qir-Azel viene da Laresh. Un carro in più sulla strada del grano è un argomento che Julia rispetta."
        prova: { attributo: sociale, abilita: persuasione, difficolta: Media }
        successo:
          titolo: Questo è un argomento
          testo: |
            Le dici che finché il grano di Laresh passa da una mano sola, la
            città mangia al prezzo che decide quella mano. Julia posa la penna
            sulla pratica. «Questo è un argomento» dice, e firma la licenza con il nome di
            Cahir e quello di Casa Velar. Sotto, come garante, ci scrive il tuo.

            A Laresh, quando tornate, Cahir ti porta alla stalla e ti mette in
            mano la cavezza di una puledra grigia. Secondo lui il garante deve arrivare prima dei carri. La sera la Dama ti fa avere una borsa di monete.
          pe: { persuasione: 3 }
          almeno: { rep.laresh: 4 }
          effetti: { fazione.laresh: 1, monete: 60, oggetto.laresh-puledra-grigia: 1 }
        fallimento:
          titolo: Una stagione
          testo: |
            Le parli del pane e della città, e ti accorgi a metà frase che
            stai ripetendo un discorso del Consiglio. Julia ti lascia finire.
            Poi firma una licenza per una stagione sola, con il tuo nome come
            garante, e dice che il resto lo vedrà dai conti.

            A Laresh, quando tornate, Cahir ti porta alla stalla e ti mette in
            mano la cavezza di una puledra grigia. Secondo lui una stagione basta per cominciare. La sera la Dama ti fa avere una borsa di monete.
          almeno: { rep.laresh: 4 }
          effetti: { fazione.laresh: 1, monete: 60, oggetto.laresh-puledra-grigia: 1, scandalo: 0.5 }
      - testo: "Mettere in ordine davanti a lei i conti della carovana"
        descrizione: "Sul foglio di Cahir ci sono i cani e i carri. Mancano i conti dei noli e il prezzo del grano ai granai del Comune."
        prova: { attributo: mentale, abilita: politica-ed-economia, difficolta: Media }
        successo:
          titolo: I conti della carovana
          testo: |
            Prendi il foglio di Cahir e sul retro scrivi una riga sotto l'altra
            i noli della strada e il prezzo del grano ai granai del Comune. Julia
            segue la penna con gli occhi e alla fine annuisce una volta, che da
            lei è molto. Firma la licenza con il nome di Cahir e quello di Casa
            Velar, e come garante scrive il tuo.

            A Laresh, quando tornate, Cahir ti porta alla stalla e ti mette in
            mano la cavezza di una puledra grigia. Secondo lui il garante deve arrivare prima dei carri. La sera la Dama ti fa avere una borsa di monete.
          pe: { politica-ed-economia: 3 }
          almeno: { rep.laresh: 4 }
          effetti: { fazione.laresh: 1, monete: 60, oggetto.laresh-puledra-grigia: 1 }
        fallimento:
          titolo: La riga storta
          testo: |
            Scrivi i noli e le soste sul retro del foglio, e a metà sbagli la
            somma davanti a lei. Julia la corregge con la sua penna senza
            commentare. Firma una licenza per una stagione sola, e come garante
            scrive il tuo nome, che a questo punto le sembra il minimo.

            A Laresh, quando tornate, Cahir ti porta alla stalla e ti mette in
            mano la cavezza di una puledra grigia. Secondo lui una stagione basta per cominciare. La sera la Dama ti fa avere una borsa di monete.
          almeno: { rep.laresh: 4 }
          effetti: { fazione.laresh: 1, monete: 60, oggetto.laresh-puledra-grigia: 1, scandalo: 0.5 }
      - testo: "Raccontarle dei pesi di Ugolino Carrà"
        descrizione: "Un peso con il piombo nel fondo, alla pesa di Laresh. Julia vuole i mulini sotto controllo civico, e questa è una storia che le serve."
        quando: [pista.pelle < 7]
        esito:
          titolo: Il piombo dei Malgrani
          testo: |
            Le racconti della pesa e del peso limato, e Julia prende appunti a
            margine di una pratica che non c'entra niente. «Questa la porto in
            seduta» dice, e firma la licenza con il nome di Cahir e quello di
            Casa Velar, e il tuo come garante.

            A Laresh, quando tornate, Cahir ti porta alla stalla e ti mette in
            mano la cavezza di una puledra grigia. Secondo lui il garante deve arrivare prima dei carri. La sera la Dama ti fa avere una borsa di monete.
          almeno: { rep.laresh: 4 }
          effetti: { fazione.laresh: 1, monete: 60, oggetto.laresh-puledra-grigia: 1 }
      - testo: "Ricordarle i carri del guado"
        descrizione: "Il grano delle terre dei Castaldi a Laresh l'hai portato tu, per il guado vecchio, quando al ponte c'era il dazio della Gilda."
        quando: [fazione.consiglio >= 8]
        esito:
          titolo: Il guado vecchio
          testo: |
            Le ricordi i carri del Comune e il guado vecchio del Torvessa, e
            Julia per un momento sorride con un angolo della bocca. «Allora
            sa già come si porta il grano senza chiedere permesso» dice. Firma
            la licenza con il nome di Cahir e quello di Casa Velar, e il tuo
            come garante.

            A Laresh, quando tornate, Cahir ti porta alla stalla e ti mette in
            mano la cavezza di una puledra grigia. Secondo lui il garante deve arrivare prima dei carri. La sera la Dama ti fa avere una borsa di monete.
          almeno: { rep.laresh: 4 }
          effetti: { fazione.laresh: 1, monete: 60, oggetto.laresh-puledra-grigia: 1 }
      - testo: "Scrivere il piano dei noli alla maniera della Gilda"
        descrizione: "I noli della Gilda li conosci a memoria, e sai dove una carovana di pari può stare sotto senza perderci."
        quando: [origine.mercante-dei-ponti >= 1]
        esito:
          titolo: Sotto i noli della Gilda
          testo: |
            Scrivi sul retro del foglio i noli della Gilda per la strada di
            Laresh, e accanto quelli di Cahir, un poco più bassi a ogni sosta.
            Julia li confronta riga per riga. «La Gilda non sarà contenta» dice,
            e lo dice come una cosa buona. Firma la licenza con il nome di Cahir
            e quello di Casa Velar, e il tuo come garante.

            A Laresh, quando tornate, Cahir ti porta alla stalla e ti mette in
            mano la cavezza di una puledra grigia. Secondo lui il garante deve arrivare prima dei carri. La sera la Dama ti fa avere una borsa di monete.
          pe: { politica-ed-economia: 3 }
          almeno: { rep.laresh: 4 }
          effetti: { fazione.laresh: 1, monete: 60, oggetto.laresh-puledra-grigia: 1 }
