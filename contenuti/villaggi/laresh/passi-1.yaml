# La quest di Laresh, Atto I e II (fazione.laresh 0 → 6).
# - 0 → 1 `laresh-la-vedova-velar` (Casa Velar, pista.arena >= 5): Dama Ryn Velar e il libro dei conti, i campi a
#   nord dove il grano nasce nero. Opzione d'origine del Mercante dei Ponti (le ricevute della concessione).
# - 1 → 2 `laresh-il-mugnaio-cieco` (il mulino centrale) e il seguito `laresh-quello-che-sente-la-macina`: Old
#   Marrek legge il grano bruciato (la carestia se il nero passa il rio di mezzo), sente un secondo battito sotto
#   la macina e manda il protagonista da Cahir. Con pista.corin >= 6 i saluti di Corin bastano come idromele.
# - 2 → 3 `laresh-fra-mezzanotte-e-le-tre` (le stalle a est) e il seguito `laresh-la-tavola-della-dama` (grado 1,
#   Ospite dell'aia): i cani che ululano verso nord, il fischietto d'osso, le voci sulla Volta dell'Aculeo e
#   sull'Anello del Camminatore (traccia.aculeo e traccia.anello +1). Opzioni per chi conosce Cahir dalla pista
#   della Gilda (fazione.gilda >= 4) e per il Fuggiasco di Ghoran.
# - 3 → 4 il giorno della pesa, in due varianti: `laresh-il-giorno-della-pesa` (pista.pelle < 7, Ugolino Carrà, il
#   fattore della concessione dei Malgrani) e `laresh-il-giorno-della-pesa-cooperativa` (pista.pelle >= 7, Anselmo
#   Brey e la cooperativa del grano). In tutte e due il grano buono della Dama resta senza un carro per la città.
# - 4 → 5 `laresh-i-ragazzi-della-cicatrice` (l'aia grande, il giorno di mercato): Oreste Ruffo recluta per i
#   Raschiatori; Ilio Vardo resta (laresh.ilio 1) o parte (2).
# - 5 → 6 `laresh-trenta-cani-per-tre-carri` (Municipio, grado 2, Garante dei carri): Julia Castaldi firma la licenza
#   della carovana di Cahir; la puledra grigia.
storylet:
  # ------------------------------------------------------------ 0 → 1 · la vedova e il libro dei conti
  - id: laresh-la-vedova-velar
    presso: laresh
    immagine: ambientazione/laresh
    titolo: La vedova e il libro dei conti
    sommario: "Dama Ryn Velar amministra le terre del marito da un tavolo sotto il portico, e cerca qualcuno di fuori."
    luogo: Laresh, il portico di Casa Velar
    area: superficie-fratturata
    requisiti: [fazione.laresh == 0, pista.arena >= 5]
    testo: |
      Al bivio Tobiolo Mirri, il carrettiere del grano, ti ha indicato con il
      manico della frusta Casa Velar, la più lunga delle case di Laresh, con
      un portico sull'aia. Sotto il portico, a un tavolo, siede Dama Ryn
      Velar con un libro dei conti aperto davanti. È una donna asciutta,
      vestita di grigio, con una macchia d'inchiostro sul medio della destra
      che nessun sapone deve averle mai tolto.

      «Voi non siete della concessione, e al collo non portate la lanterna
      dei Raschiatori» dice senza alzare gli occhi. «A conti fatti, è già
      qualcosa.»

      Gira il libro verso di te. Nelle colonne dei campi a nord i numeri
      calano da tre raccolti, e l'ultimo è una croce. «Lassù il grano nasce
      nero» dice la Dama. «Al mulino dicono che è una ruggine e che passa, i
      miei fittavoli dicono che sono i morti. Mi serve qualcuno che vada a
      guardare senza avere già deciso.»

      {politica-ed-economia Media} Le colonne calano di più vicino al rio di
      mezzo. Una ruggine segue il vento, e questa segue l'acqua.

      {origine mercante-dei-ponti} Il libro è tenuto alla maniera della
      Gilda, e le ricevute in fondo alla pagina portano la cera verde della
      Casa dei Nodi.
    opzioni:
      - testo: "Andare a vedere i campi a nord"
        descrizione: "Una giornata di cammino fra le spighe, e la sera un resoconto alla Dama, senza abbellimenti."
        prova: { attributo: mentale, abilita: [natura, percezione], difficolta: Media }
        successo:
          titolo: Il grano che segue l'acqua
          testo: |
            Il nero parte dal rio di mezzo e si allarga verso i lati, e dove il
            grano è nero la terra sotto le radici è fredda come in cantina.
            «Marrek sente quello che noi non vediamo» dice la Dama, e ti manda al
            mulino centrale con il consiglio di portare da bere al vecchio.
          pe: { natura: 3 }
          effetti: { fazione.laresh: 1, rep.laresh: 0.5 }
        fallimento:
          titolo: La polvere nera
          testo: |
            Fra le spighe nere perdi la strada due volte, e alla Dama riesci a
            dire soltanto che lassù fa freddo. Lei lo scrive lo stesso, perché a
            Laresh d'estate non fa freddo da nessuna parte, e ti manda al mulino
            da Old Marrek, con qualcosa da bere per lui.
          effetti: { fazione.laresh: 1, tormento: 0.5 }
      - testo: "Rifarle i conti dei campi a nord"
        descrizione: "Le colonne del libro dicono già molto, a chi le legge con pazienza."
        prova: { attributo: mentale, abilita: politica-ed-economia, difficolta: Media }
        successo:
          titolo: Il rio di mezzo
          testo: |
            Messi in fila lungo il rio di mezzo, i campi calano con ordine dal più
            vicino all'acqua al più lontano. La Dama rifà la somma da sola, poi
            ammette che Marrek lo dice da un anno e ti manda al mulino centrale,
            con il consiglio di portargli da bere.
          pe: { politica-ed-economia: 3 }
          effetti: { fazione.laresh: 1, rep.laresh: 0.5 }
        fallimento:
          titolo: La somma sbagliata
          testo: |
            Ti torna un raccolto più grande di quello che la Dama ha in granaio, e
            il fattore, che ascoltava dalla porta, ride forte. La Dama ti riprende
            la penna e ti manda da Old Marrek, che i conti non li sa fare e i
            campi li sente lo stesso.
          effetti: { fazione.laresh: 1, scandalo: 0.5 }
      - testo: "Dirle chiaro che cosa cerchi a Laresh"
        descrizione: "La Dama non ha tempo per le cortesie. Una risposta dritta forse sì."
        prova: { attributo: sociale, abilita: [persuasione, galateo], difficolta: Media }
        successo:
          titolo: Una risposta dritta
          testo: |
            Le dici che cerchi un lavoro per qualcuno che non deve niente a
            nessuno, e la Dama ti guarda per la prima volta. Chiude il libro e ti
            manda al mulino da Old Marrek. «Portategli da bere» aggiunge, «perché
            senza il vecchio non vi sente.»
          pe: { persuasione: 3 }
          effetti: { fazione.laresh: 1, rep.laresh: 0.5 }
        fallimento:
          titolo: Le cortesie della città
          testo: |
            Cominci con le cortesie della città e alla seconda la Dama ricomincia
            a scrivere, mentre il fattore ride dietro il cappello. Alla fine ti
            manda da Old Marrek senza alzare gli occhi, consigliandoti meno giri
            con lui, perché il vecchio è cieco e si annoia presto.
          effetti: { fazione.laresh: 1, scandalo: 0.5 }
      - testo: "Passare la giornata nei campi con il fattore"
        descrizione: "Il fattore conosce ogni solco della Dama. Ci vuole il giorno intero, e lui parla soltanto di vacche."
        costo: 2
        esito:
          titolo: Le vacche del fattore
          testo: |
            Cammini i campi a nord con il fattore fino al tramonto, e mentre ti
            racconta di ogni vacca che ha avuto, chiamandola per nome, pianta un
            bastone dove il nero è arrivato quest'anno e dove era l'anno scorso.
            La sera la Dama ti manda da Old Marrek, con il consiglio di portargli
            da bere.
          pe: { natura: 2 }
          effetti: { fazione.laresh: 1 }
      - testo: "Leggere le ricevute della concessione"
        descrizione: "In fondo alla pagina le ricevute portano la cera verde della Gilda, e una ricevuta dice sempre di più."
        quando: [origine.mercante-dei-ponti >= 1]
        esito:
          titolo: La cera verde
          testo: |
            Letta controluce, la ricevuta dice che da tre anni la concessione
            scrive *seconda scelta* su tutto il grano del nord, anche su quello
            buono, e lo paga la metà. La Dama lo sapeva senza saperlo dire, e ti
            manda da Old Marrek con il consiglio di portargli da bere.
          pe: { politica-ed-economia: 3 }
          effetti: { fazione.laresh: 1, rep.laresh: 0.5 }

  # ------------------------------------------------------------ 1 → 2 · il mugnaio cieco
  - id: laresh-il-mugnaio-cieco
    presso: laresh
    immagine: ambientazione/mulino-malgrani
    titolo: Il mugnaio cieco
    sommario: "Al mulino centrale Old Marrek sente il grano passare con una mano sulla macina, e vuole l'idromele."
    luogo: Laresh, il mulino centrale sul rio di mezzo
    area: superficie-fratturata
    requisiti: [fazione.laresh == 1]
    testo: |
      Nel mulino centrale la farina vola nella luce delle finestrelle. Old
      Marrek siede su uno sgabello accanto alla macina con il palmo aperto
      sull'incastellatura, e la sente girare come il polso di un malato.
      Accanto a lui Tano, il nipote di dodici anni, conta le brocche vuote
      sotto la trave.

      «Viene da Casa Velar» dice Marrek al ragazzo. «Cammina sulla paglia
      con il tallone, come i cittadini.» Allunga la mano aperta. «Il grano
      lo leggo a chi porta il dolce, e del nero parlo soltanto a chi ne
      porta due brocche.»

      {medicina Media} Ha gli occhi bianchi di cataratta, ma le mani ci
      vedono benissimo.

      {origine accolito-del-velo} Al Velo il futuro si aspettava senza
      guardarlo in faccia, e qui lo si legge per una brocca d'idromele.

      Sotto lo sgabello il pavimento trema con la macina, e ogni tanto trema
      una volta di troppo, nella pausa fra due giri.
    opzioni:
      - testo: "Portargli due brocche d'idromele"
        descrizione: "All'osteria sul rio l'idromele lo tengono apposta per lui, e lo fanno pagare a chi lo porta."
        requisiti: [monete >= 8]
        esito:
          titolo: Il dolce
          testo: |
            Torni dall'osteria con due brocche tappate con la cera, e Tano le
            conta prima che arrivino al nonno. Marrek ne stappa una con i denti e,
            dopo un sorso lungo, ti fa sedere di fronte a lui.
          effetti: { monete: -8 }
          segue: laresh-quello-che-sente-la-macina
      - testo: "Cantargli la canzone della spiga"
        descrizione: "A Laresh si paga anche con le canzoni, se sono quelle giuste. Marrek ha l'orecchio fino."
        prova: { attributo: sociale, abilita: espressivita, difficolta: Media }
        successo:
          titolo: La canzone della spiga
          testo: |
            Canti la canzone della spiga, e alla terza strofa Marrek la canta con
            te con una voce rotta che ci prende meglio della tua. Quando hai
            finito dice che una canzone vale una brocca e ti fa sedere di fronte a
            lui, ricordandoti che la seconda gliela devi.
          pe: { espressivita: 3 }
          effetti: { rep.laresh: 0.5 }
          segue: laresh-quello-che-sente-la-macina
        fallimento:
          titolo: La strofa sbagliata
          testo: |
            Alla seconda strofa ci metti le parole della canzone del fienile, e
            Tano scappa a raccontarlo all'osteria. Marrek ride fino a tossire e ti
            fa sedere lo stesso, perché una risata così vale mezza brocca.
          effetti: { scandalo: 0.5 }
          segue: laresh-quello-che-sente-la-macina
      - testo: "Rabboccare la tramoggia al posto di Tano"
        descrizione: "Tano è troppo piccolo per i sacchi della tramoggia, e il vecchio paga anche in chiacchiere."
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Media }
        successo:
          titolo: La tramoggia piena
          testo: |
            Porti i sacchi su per la scaletta tutto il pomeriggio finché la macina
            canta piena. Marrek ascolta contento il cambio di suono, dice che hai
            pagato il dolce con la schiena e ti fa sedere di fronte a lui.
          pe: { atletica: 3 }
          effetti: { rep.laresh: 0.5 }
          segue: laresh-quello-che-sente-la-macina
        fallimento:
          titolo: Il sacco aperto
          testo: |
            Al terzo sacco la cucitura cede in cima alla scaletta e il grano ti
            finisce addosso e sotto la macina, fra le urla di Tano. Marrek ti
            ascolta spazzare per un'ora, e alla fine ti fa sedere di fronte a lui,
            contento dello spettacolo gratis.
          effetti: { tormento: 0.5 }
          segue: laresh-quello-che-sente-la-macina
      - testo: "Portargli i saluti di Corin"
        descrizione: "Corin Ashdale ha passato a Laresh mezza stagione, e al mulino centrale qualcuno se lo ricorda bene."
        quando: [pista.corin >= 6]
        esito:
          titolo: Il mercante nel fosso
          testo: |
            Al nome di Corin Tano scoppia a ridere, perché è lui che l'ha
            ripescato nel fosso la notte in cui chiamava i fuochi azzurri con il
            fischio dei cani. Corin, prima di ripartire, ha lasciato all'osteria
            una botticella d'idromele per chi fosse venuto da parte sua, e Tano
            corre a prenderne due brocche.
          effetti: { rep.laresh: 0.5 }
          segue: laresh-quello-che-sente-la-macina

  - id: laresh-quello-che-sente-la-macina
    presso: laresh
    immagine: ambientazione/mulino-malgrani
    titolo: Quello che sente la macina
    tipo: seguito
    luogo: Laresh, il mulino centrale
    area: superficie-fratturata
    requisiti: [fazione.laresh == 1]
    testo: |
      Marrek ti versa sul palmo una manciata di chicchi bruciati e ci passa sopra il
      pollice. Per te legge l'amore, e annuncia con grande serietà che incontrerai una
      persona alta, oppure bassa.

      Poi prende dalla tasca del grembiule i chicchi neri dei campi a nord, e la voce
      gli cambia. «Se il nero passa il rio di mezzo prima della mietitura, a primavera
      in città mancano tre pani su dieci» dice piano. Appoggia la mano sulla macina. «E
      sotto questa ce n'è un'altra. La sento da tre inverni nella pausa fra un giro e
      l'altro. La terra ogni tanto beve sangue, e quando beve ha sete come noi. Come
      quel legno che cresce a Pann...» Si ferma a metà della parola e non la finisce
      più.

      {percezione Difficile} Il tremito in più del pavimento arriva sempre dopo il giro
      della macina, regolare, con un passo tutto suo.
    opzioni:
      - testo: "Chiedergli che cosa vuol dire"
        descrizione: "Chi si ferma a metà di una parola l'ha fatto apposta, ma si può provare a farlo ripartire."
        esito:
          titolo: I cani di Cahir
          testo: |
            Marrek scuote la testa e beve. «Vuol dire che i cani di Cahir hanno
            ragione, e io sono vecchio» dice. «Andate alle stalle a est dopo
            mezzanotte, e sentirete anche voi.» Sulla porta Tano ti spiega a voce
            bassa che il nonno di notte non dorme più.
          effetti: { fazione.laresh: 1, rep.laresh: 0.5 }
      - testo: "Mettere anche tu la mano sulla macina"
        descrizione: "Il legno dell'incastellatura trema con il sasso. Forse il secondo battito lo sente anche chi ha gli occhi."
        prova: { attributo: mentale, abilita: [percezione, resilienza], difficolta: Media }
        successo:
          titolo: Il secondo battito
          testo: |
            Al decimo giro senti anche tu un colpo sordo, più in basso del
            basamento, in ritardo sulla macina come un'eco. Marrek sorride senza
            denti e ti manda dai cani di Cahir, alle stalle a est dopo mezzanotte,
            perché loro lo sentono da prima di lui.
          pe: { percezione: 3 }
          effetti: { fazione.laresh: 1, rep.laresh: 0.5 }
        fallimento:
          titolo: Il polso tuo
          testo: |
            Senti soltanto il tuo cuore, e Marrek ti toglie la mano dal legno come
            si toglie un gatto dal tavolo. Ti manda da Cahir, alle stalle a est,
            dopo mezzanotte.
          effetti: { fazione.laresh: 1, tormento: 0.5 }

  # ------------------------------------------------------------ 2 → 3 · i cani di Cahir (grado 1)
  - id: laresh-fra-mezzanotte-e-le-tre
    presso: laresh
    immagine: icone/wolf-howl
    titolo: Fra mezzanotte e le tre
    sommario: "Alle stalle a est i cani da soma di Cahir ululano ogni notte verso nord, tutti insieme."
    luogo: Laresh, le stalle a est, dopo mezzanotte
    area: superficie-fratturata
    requisiti: [fazione.laresh == 2]
    testo: |
      Le stalle a est sono tre capannoni di fango lungo un rio stretto, con i
      cavalli da una parte e dall'altra i cani da soma, grossi come vitelli.
      Cahir, un mezzelfo giovane con una cicatrice di morso sull'avambraccio,
      siede su un secchio rovesciato davanti alla porta con la pipa spenta fra i
      denti.

      «Si vedrà» dice, quando gli chiedi dei cani, e per un pezzo non dice
      altro.

      A mezzanotte i cani si alzano insieme, senza un rumore che li svegli, e
      cominciano a ululare con il muso verso nord, anche quelli dei box che
      guardano a sud. L'ululato è lungo e basso, sempre sulla stessa nota, e lo
      tiene il capobranco, un cane grigio che Cahir chiama Cenere.

      {addestrare-animali Media} Cenere ascolta fra un ululato e l'altro, con le
      orecchie tese, come se aspettasse una risposta.

      «Fino alle tre» dice Cahir, e accende finalmente la pipa. «Poi si mangiano
      la paglia e dormono come sassi. Li ho portati a sud del rio, e girano la
      testa lo stesso.»

      {origine fuggiasco-di-ghoran} Quell'ululato basso lo conosci, e le spalle
      ti si alzano da sole. A Ghoran lo fanno i cani dei recinti quando hanno
      trovato una pista e aspettano che qualcuno li sciolga.
    opzioni:
      - testo: "Sciogliere Cenere e seguirlo verso nord"
        descrizione: "Il capobranco sa dove guarda. Basta lasciarlo andare e stargli dietro nel buio."
        prova: { attributo: sociale, abilita: addestrare-animali, difficolta: Media }
        successo:
          titolo: Cenere nel grano nero
          testo: |
            Sciogli Cenere e gli corri dietro con la lanterna fino dove il grano
            diventa nero. Lì il cane raspa la terra e ci mette sopra l'orecchio, e
            quando lo fai anche tu senti scorrere qualcosa, lontano, come acqua in
            un tubo che qualcuno sta succhiando. Alle tre Cenere torna alle stalle
            da solo.
          pe: { addestrare-animali: 3 }
          effetti: { rep.laresh: 0.5 }
          segue: laresh-la-tavola-della-dama
        fallimento:
          titolo: Il fosso
          testo: |
            Cenere parte così veloce che la lanterna ti resta indietro, e lo perdi
            nel grano nero. Finisci in un fosso con l'acqua alle ginocchia finché
            Cahir non ti ripesca con un fischio, il cane già seduto accanto a lui.
          effetti: { tormento: 0.5 }
          segue: laresh-la-tavola-della-dama
      - testo: "Segnare con il gesso la direzione dei musi"
        descrizione: "Se tutti i cani guardano lo stesso punto, le loro linee sul pavimento lo dicono meglio delle parole."
        prova: { attributo: mentale, abilita: [percezione, natura], difficolta: Media }
        successo:
          titolo: Le righe di gesso
          testo: |
            Tiri una riga di gesso sotto il muso di ogni cane, e alle tre le righe
            sono tutte parallele come le tracce di un rastrello. Puntano a nord un
            poco verso levante, oltre i campi neri, e Cahir guarda il pavimento
            senza cancellarle.
          pe: { percezione: 3 }
          effetti: { rep.laresh: 0.5 }
          segue: laresh-la-tavola-della-dama
        fallimento:
          titolo: Il gesso calpestato
          testo: |
            Alle tre i cani si alzano a mangiare la paglia e calpestano le tue
            righe, e ti restano poche linee storte e Cahir che le guarda fumando,
            con un sopracciglio alzato.
          effetti: { tormento: 0.5 }
          segue: laresh-la-tavola-della-dama
      - testo: "Restare sveglio con Cahir a parlare della sua carovana"
        descrizione: "Cahir parla poco, tranne che di una cosa. Fino alle tre c'è tempo."
        prova: { attributo: sociale, abilita: [empatia, persuasione], difficolta: Media }
        successo:
          titolo: Da pari a pari
          testo: |
            Fino alle tre Cahir ti parla della carovana, trenta cani per tre carri
            e il grano di Laresh venduto in città da chi lo coltiva, da pari a
            pari. Lo dice piano, per non farsi sentire dai cani, e alla fine ti
            chiede se sembra una cosa da matti.
          pe: { empatia: 3 }
          effetti: { rep.laresh: 0.5 }
          segue: laresh-la-tavola-della-dama
        fallimento:
          titolo: La Gilda
          testo: |
            Gli chiedi della carovana con il tono di un conto, e Cahir ti chiede
            se ti manda la Gilda. Fino alle tre parla soltanto con i cani.
          effetti: { sospetto: 0.5 }
          segue: laresh-la-tavola-della-dama
      - testo: "Ricordargli la pista e il grano nero"
        descrizione: "Sulla pista di Laresh i suoi cani tenevano il muso a nord anche allora. Cahir ti conosce."
        quando: [fazione.gilda >= 4]
        esito:
          titolo: La stessa nota
          testo: |
            Cahir ti riconosce nella luce della porta e ti fa posto su un secondo
            secchio. Quando gli ricordi i cani della pista, con il muso a nord
            anche dove la strada girava a sud, annuisce. «Allora era uno ogni
            tanto» dice. «Adesso ululano tutti insieme, ogni notte.» Restate a
            sentirli fino alle tre.
          effetti: { rep.laresh: 0.5 }
          segue: laresh-la-tavola-della-dama
      - testo: "Mostrargli la cinghia intrecciata che ti ha regalato"
        descrizione: "Hai lasciato il suo nome fuori dal rapporto, e lui ti ha regalato una cinghia da cane."
        quando: [gilda.cahir == 1]
        esito:
          titolo: La cinghia
          testo: |
            Cahir riconosce la cinghia intrecciata prima di riconoscere te, e ride
            piano per la prima volta. «Allora sei quello della riga in meno» dice,
            e ti racconta della sua carovana fino alle tre, mentre i cani ululano
            a nord.
          effetti: { rep.laresh: 0.5 }
          segue: laresh-la-tavola-della-dama
      - testo: "Dire a Cahir che cosa vuol dire quell'ululato a Ghoran"
        descrizione: "Quel suono lo conosci da prima di sapere che cos'è, e a Ghoran vuol dire una pista."
        quando: [origine.fuggiasco-di-ghoran >= 1]
        esito:
          titolo: I cani dei recinti
          testo: |
            Glielo dici a voce bassa, con le mani in tasca perché non le veda
            tremare. «Una pista» ripete Cahir, guardando i cani. «E nessuno che li
            sciolga.» Restate seduti fino alle tre senza parlare, e quando i cani
            smettono ti passa la pipa.
          effetti: { rep.laresh: 0.5 }
          segue: laresh-la-tavola-della-dama

  - id: laresh-la-tavola-della-dama
    presso: laresh
    immagine: ambientazione/laresh
    titolo: La tavola di Casa Velar
    tipo: seguito
    luogo: Laresh, la cucina di Casa Velar, all'alba
    area: superficie-fratturata
    requisiti: [fazione.laresh == 2]
    testo: |
      All'alba la cucina di Casa Velar è piena del fumo del pane e delle
      voci dei braccianti, e la Dama, in fondo alla tavola, ti indica il
      posto alla sua destra. Cahir entra con due secchi di latte e ti lascia
      cadere accanto al piatto un fischietto d'osso lucido di tasca. «Per
      Cenere» dice soltanto, e se ne va.

      I braccianti parlano dei posti dove le capre non vogliono andare. Uno
      racconta della Conca dei Rovi, a ovest, dove un foro fischia come un
      richiamo una notte all'anno, e una donna con le mani rosse di lisciva
      parla di nove pietre nere ai margini del Rovolungo, a nord-ovest.

      {accademiche Media} Nei registri della Biblioteca, accanto a nomi
      così, c'è sempre scritto *non scavato*.

      La Dama ascolta mangiando adagio, poi scrive il tuo nome in una
      colonna che ha in cima la parola *tavola*.
    opzioni:
      - testo: "Raccontare alla Dama la notte alle stalle"
        descrizione: "Lei vuole i fatti, nell'ordine in cui sono successi. Il resto lo lascia ai braccianti."
        esito:
          titolo: Ospite dell'aia
          testo: |
            Le racconti la notte dall'inizio, e lei ti ferma due volte per farsi
            ripetere la direzione. «A conti fatti, siete dei nostri» dice poi.
            «Alla mia tavola c'è un posto per voi quando volete.» Sotto il tavolo
            ti passa una borsa di monete, perché davanti ai braccianti non si
            parla di paga.
          almeno: { rep.laresh: 2 }
          effetti: { fazione.laresh: 1, monete: 30, oggetto.laresh-fischietto-d-osso: 1, traccia.aculeo: 1, traccia.anello: 1 }
      - testo: "Farti raccontare dai braccianti le strade per i posti neri"
        descrizione: "Chi ha parlato della Conca e delle pietre sa anche da dove si passa."
        esito:
          titolo: Le strade delle capre
          testo: |
            I braccianti ti tracciano sulla tavola con il dito bagnato le strade
            delle capre fino alla Conca dei Rovi e alle pietre. Quando ti alzi la
            Dama ti dice che alla sua tavola c'è un posto per te, e ti fa
            scivolare in mano una borsa di monete.
          almeno: { rep.laresh: 2 }
          effetti: { fazione.laresh: 1, monete: 30, oggetto.laresh-fischietto-d-osso: 1, traccia.aculeo: 1, traccia.anello: 1 }

  # ------------------------------------------------------------ 3 → 4 · il giorno della pesa (prima della caduta dei Malgrani)
  - id: laresh-il-giorno-della-pesa
    presso: laresh
    immagine: fazioni/famiglia-malgrani
    titolo: Il giorno della pesa
    sommario: "Il fattore della concessione pesa il grano di Laresh con i suoi pesi, e conta il nero come buono."
    luogo: Laresh, l'aia del mulino centrale
    area: superficie-fratturata
    requisiti: [fazione.laresh == 3, pista.pelle < 7]
    testo: |
      Il giorno della pesa l'aia del mulino centrale è piena di carri, e i
      sacchi aspettano in fila davanti a una bilancia a bracci alta come un
      uomo. Accanto, su una sedia portata da casa, siede Ugolino Carrà, il
      fattore dei Malgrani, con lo stemma dei padroni in ottone sul bavero.

      «Per contratto» dice a ogni sacco. Su quelli dei campi a nord scrive
      *buono* anche quando il grano è nero, così la quota di Laresh resta
      intera, e quest'anno anche la macina costa di più. La Dama guarda
      accanto alla bilancia con il libro stretto al petto.

      {percezione Media} Il peso più grande è più lucido degli altri sul
      fondo, come se qualcuno l'avesse limato e ripassato da poco.

      {origine rampollo-dei-quartieri-alti} Carrà l'hai visto aspettare
      nell'anticamera del Maniero Malgrani con il cappello in mano, e qui il
      cappello lo tiene in testa.
    opzioni:
      - testo: "Contestare il peso più grande"
        descrizione: "Un peso limato e ripassato pesa quello che vuole chi l'ha limato. Bisogna dimostrarlo davanti a tutti."
        prova: { attributo: mentale, abilita: [percezione, tecnologia], difficolta: Media }
        successo:
          titolo: Il piombo nel fondo
          testo: |
            Contro i pesi della Dama il peso grande di Carrà fa scendere il piatto, e nel fondo c'è un tappo di piombo colato di
            fresco. Carrà incolpa il fabbro e rifà la pesa, ma ti avverte che la concessione macina soltanto il grano che pesa
            lei. «Ci serve un carro che non sia loro» dice la Dama, guardando le stalle di Cahir.
          pe: { percezione: 3 }
          effetti: { fazione.laresh: 1, rep.laresh: 0.5 }
        fallimento:
          titolo: Il peso giusto
          testo: |
            I piatti si fermano pari, e Carrà ringrazia a voce alta per il controllo mentre i carrettieri ridono. Prima di andarsene ti ricorda che
            la concessione macina soltanto il grano che pesa lei. «Ci serve un carro che non sia loro» dice la Dama, guardando le stalle di Cahir.
          effetti: { fazione.laresh: 1, scandalo: 0.5 }
      - testo: "Far scrivere a verbale il grano nero"
        descrizione: "Un sacco nero scritto buono davanti a cento testimoni si può far correggere, alzando la voce al momento giusto."
        prova: { attributo: sociale, abilita: [persuasione, intimidire], difficolta: Media }
        successo:
          titolo: Il verbale
          testo: |
            Infili il braccio fino al gomito in un sacco del nord, e quando lo tiri fuori nero l'aia
            ammutolisce. Carrà scrive *perduto* su tutti i sacchi del nord, ma ti fa sapere che la concessione
            macina soltanto il grano che pesa lei. «Ci serve un carro che non sia loro» dice la Dama, guardando
            le stalle di Cahir.
          pe: { persuasione: 3 }
          effetti: { fazione.laresh: 1, rep.laresh: 0.5 }
        fallimento:
          titolo: Per contratto
          testo: |
            Alzi la voce, e Carrà ti legge il contratto clausola per clausola finché i carrettieri tornano ai loro sacchi. Prima
            di andarsene ti ricorda che la concessione macina soltanto il grano che pesa lei. «Ci serve un carro che non sia loro»
            dice la Dama, guardando le stalle di Cahir.
          effetti: { fazione.laresh: 1, scandalo: 0.5 }
      - testo: "Pagare di tasca tua la differenza"
        descrizione: "Una borsa sul tavolo di Carrà chiude la pesa senza discussioni. La Dama non sarà contenta."
        requisiti: [monete >= 40]
        esito:
          titolo: La borsa sul tavolo
          testo: |
            Carrà conta le monete con le dita guantate e scrive *saldato*. La Dama mette il tuo nome fra quelli a cui Casa Velar deve qualcosa e
            non ti ringrazia. Quando la concessione se ne va guarda le stalle di Cahir e dice che serve un carro che non sia loro.
          effetti: { monete: -40, fazione.laresh: 1, rep.laresh: 0.5 }
      - testo: "Rimettere in pari la bilancia con il campione della Gilda"
        descrizione: "Davanti al campione di ottone della Gilda, un peso limato non ha niente da dire."
        quando: [origine.mercante-dei-ponti >= 1]
        esito:
          titolo: Il bollo della Gilda
          testo: |
            Contro il campione con il bollo della Gilda il piatto di Carrà scende dalla parte sbagliata,
            e nessuno sull'aia ha bisogno di spiegazioni. Carrà rifà la pesa, ma ti dice che la
            concessione macina soltanto il grano che pesa lei. «Ci serve un carro che non sia loro» dice
            la Dama, guardando le stalle di Cahir.
          pe: { politica-ed-economia: 3 }
          effetti: { fazione.laresh: 1, rep.laresh: 0.5 }

  # ------------------------------------------------------------ 3 → 4 · il giorno della pesa (dopo la caduta dei Malgrani)
  - id: laresh-il-giorno-della-pesa-cooperativa
    presso: laresh
    immagine: personaggi/anselmo-brey
    titolo: Il giorno della pesa
    sommario: "La prima pesa dopo i Malgrani la fa Anselmo Brey, con il quaderno della cooperativa e un registro ereditato."
    luogo: Laresh, l'aia del mulino centrale
    area: superficie-fratturata
    requisiti: [fazione.laresh == 3, pista.pelle >= 7]
    testo: |
      L'aia del mulino centrale è piena di carri, e la prima pesa dopo la
      caduta dei Malgrani la fa Anselmo Brey, il mugnaio scelto come capo
      dalla cooperativa. Starnutisce a ogni sacco che si apre e scrive su un
      quaderno tenuto meglio dei registri del Comune.

      Accanto al quaderno tiene aperto il registro vecchio dei Malgrani, e la
      quota di Laresh la legge da lì. «Questi numeri li ho ereditati» dice
      alla Dama, che stringe al petto il libro dei conti. «La città deve
      mangiare, e io devo sapere quanto le manda Laresh.»

      {politica-ed-economia Media} Il registro vecchio dà a Laresh raccolti
      più alti di quelli della Dama da cinque anni, e chi scrive raccolti
      grandi chiede quote grandi.

      {origine mercante-dei-ponti} Il registro ha la cera verde della Gilda
      sul dorso e i timbri tutti della stessa mano, e alla Casa dei Nodi un
      registro così si chiama comodo.
    opzioni:
      - testo: "Rifare con Anselmo i conti del registro vecchio"
        descrizione: "Il quaderno di Anselmo è onesto e il registro dei Malgrani no. Messi uno accanto all'altro, lo dicono da soli."
        prova: { attributo: mentale, abilita: politica-ed-economia, difficolta: Media }
        successo:
          titolo: I numeri ereditati
          testo: |
            Confrontate anno per anno il registro vecchio con il libro della Dama, e Anselmo,
            starnutendo, cancella a ogni riga il numero dei Malgrani. La quota di Laresh torna quella
            vera, ma la cooperativa non ha carri da mandare fin qui. «Ci serve un carro nostro» dice la
            Dama, guardando le stalle di Cahir.
          pe: { politica-ed-economia: 3 }
          effetti: { fazione.laresh: 1, rep.laresh: 0.5 }
        fallimento:
          titolo: L'anno prossimo
          testo: |
            Ti perdi alla terza annata mentre i carrettieri si lamentano al sole, e Anselmo, dispiaciuto, tiene la quota vecchia. La
            cooperativa, ammette, non ha carri da mandare fin qui. «Ci serve un carro nostro» dice la Dama, guardando le stalle di
            Cahir.
          effetti: { fazione.laresh: 1, scandalo: 0.5 }
      - testo: "Portarlo a vedere i campi a nord"
        descrizione: "Anselmo il grano lo conosce, e il nero visto da vicino convince più di un registro."
        prova: { attributo: sociale, abilita: [persuasione, empatia], difficolta: Media }
        successo:
          titolo: Il campo nero
          testo: |
            Al primo campo nero Anselmo sbriciola una spiga fra le dita e smette perfino di starnutire. Al mulino scrive *perduto* su
            tutti i sacchi del nord e abbassa la quota, ma la cooperativa non ha carri da mandare fin qui. «Ci serve un carro nostro»
            dice la Dama, guardando le stalle di Cahir.
          pe: { persuasione: 3 }
          effetti: { fazione.laresh: 1, rep.laresh: 0.5 }
        fallimento:
          titolo: La polvere
          testo: |
            A metà strada la polvere del grano nero lo fa starnutire tanto da doversi sedere in un fosso, e al
            mulino Anselmo tiene la quota del registro vecchio. La cooperativa, ammette, non ha carri da mandare
            fin qui. «Ci serve un carro nostro» dice la Dama, guardando le stalle di Cahir.
          effetti: { fazione.laresh: 1, scandalo: 0.5 }
      - testo: "Pagare di tasca tua la differenza"
        descrizione: "Una borsa sul quaderno di Anselmo chiude la pesa senza discussioni. La Dama non sarà contenta."
        requisiti: [monete >= 40]
        esito:
          titolo: La borsa sul quaderno
          testo: |
            Anselmo guarda la borsa come se gli avessi portato un cane bagnato, poi scrive *saldato* e ti ringrazia due volte. La
            Dama scrive il tuo nome fra quelli a cui Casa Velar deve qualcosa e, quando Anselmo ammette che la cooperativa non ha
            carri, dice che serve un carro di Laresh.
          effetti: { monete: -40, fazione.laresh: 1, rep.laresh: 0.5 }
      - testo: "Mostrargli come la Gilda conta le perdite"
        descrizione: "Alla Casa dei Nodi le perdite si scrivono in una colonna a parte, con il testimone accanto."
        quando: [origine.mercante-dei-ponti >= 1]
        esito:
          titolo: La colonna a parte
          testo: |
            Sul quaderno tiri una colonna nuova per il grano nero, sacco per sacco, con la Dama come testimone, e Anselmo la copia sul
            registro della cooperativa. Poi ammette che la cooperativa non ha carri da mandare fin qui. «Ci serve un carro nostro»
            dice la Dama, guardando le stalle di Cahir.
          pe: { politica-ed-economia: 3 }
          effetti: { fazione.laresh: 1, rep.laresh: 0.5 }

  # ------------------------------------------------------------ 4 → 5 · i ragazzi della Cicatrice
  - id: laresh-i-ragazzi-della-cicatrice
    presso: laresh
    immagine: fazioni/raschiatori
    titolo: I ragazzi della Cicatrice
    sommario: "Un reclutatore dei Raschiatori apre il registro sull'aia, e sei ragazzi di Laresh fanno la fila."
    luogo: Laresh, l'aia grande, il giorno di mercato
    area: superficie-fratturata
    requisiti: [fazione.laresh == 4]
    testo: |
      Il giorno di mercato, accanto al pozzo dell'aia grande, c'è il carro di
      un reclutatore dei Raschiatori con una lanterna dipinta sulla tela. Al
      tavolino pieghevole davanti siede Oreste Ruffo, con i capelli corti
      perché si veda l'orecchio sinistro che gli manca.

      In fila ci sono sei ragazzi, e il primo è Ilio Vardo, sedici anni,
      figlio di un fittavolo della Dama, con le mani tagliate dalla falce.
      Sua madre guarda dal bordo dell'aia stringendo il grembiule.

      «Al Grifone di Ferro si mangia due volte al giorno, e in Cicatrice in
      un mese porti a casa un raccolto» dice Ruffo, con una calma da vecchio
      maestro.

      La Dama arriva dal portico. «Ai Raschiatori i ragazzi li presto» dice.
      «E indietro mi tornano i nomi, scritti su una lanterna.»

      {origine apprendista-raschiatore} Sulle piattaforme arrivano ragazzi
      così ogni stagione, e i primi turni li passano a vomitare nella
      Cicatrice.
    opzioni:
      - testo: "Convincere Ilio a restare almeno per la mietitura"
        descrizione: "Sedici anni, e la Cicatrice gli sembra il mondo. Bisogna parlargli di quello che lascia, senza fargli la predica."
        prova: { attributo: sociale, abilita: [empatia, persuasione], difficolta: Media }
        successo:
          titolo: Dopo la mietitura
          testo: |
            Ti metti accanto a Ilio nella fila e gli chiedi chi miete il campo di
            suo padre, quest'anno. Ilio guarda sua madre ed esce dalla fila senza
            dire niente, mentre Ruffo chiude il registro con un'alzata di spalle.
            La Dama ringrazia con un cenno che vale anche per te.
          pe: { empatia: 3 }
          imposta: { laresh.ilio: 1 }
          effetti: { fazione.laresh: 1, rep.laresh: 0.5 }
        fallimento:
          titolo: La firma
          testo: |
            Gli parli di sua madre davanti a tutta l'aia, e Ilio, rosso in faccia,
            firma per dispetto con una croce che buca il foglio. Partirà all'alba,
            e la Dama torna al portico senza dirti niente.
          imposta: { laresh.ilio: 2 }
          effetti: { fazione.laresh: 1, scandalo: 0.5 }
      - testo: "Trattare con Ruffo un contratto giusto"
        descrizione: "Se i ragazzi devono andare, che vadano con il ritorno per la mietitura e la paga mandata a casa."
        prova: { attributo: sociale, abilita: [persuasione, conoscenze-della-strada], difficolta: Media }
        successo:
          titolo: Il contratto
          testo: |
            Tratti con Ruffo come per un carico di grano, e il registro guadagna
            due righe per ogni ragazzo, il ritorno per la mietitura e la paga
            mandata alla famiglia ogni mese. Ilio firma per primo, e la Dama legge
            le righe due volte prima di lasciarlo andare.
          pe: { persuasione: 3 }
          imposta: { laresh.ilio: 2 }
          effetti: { fazione.laresh: 1, rep.laresh: 0.5 }
        fallimento:
          titolo: Le condizioni dei Raschiatori
          testo: |
            Ruffo ti spiega, senza cambiare tono, che le condizioni le fa Dragna
            Gro-Malog al Grifone e non un forestiero su un'aia. I ragazzi firmano,
            e Ilio partirà all'alba.
          imposta: { laresh.ilio: 2 }
          effetti: { fazione.laresh: 1, scandalo: 0.5 }
      - testo: "Lasciare che decida la Dama"
        descrizione: "I ragazzi sono figli dei suoi fittavoli. La parola è sua, e lei la dirà comunque."
        esito:
          titolo: La parola della Dama
          testo: |
            Fai un passo indietro e la Dama ne fa uno avanti. Dice a Ilio che il
            campo di suo padre quest'anno lo miete lui, e il ragazzo esce dalla
            fila con le orecchie rosse. Gli altri cinque firmano, e Ruffo ti
            guarda come uno che ha scelto di non scegliere.
          imposta: { laresh.ilio: 1 }
          effetti: { fazione.laresh: 1 }
      - testo: "Parlare a Ruffo da Raschiatore"
        descrizione: "Hai il nome sulla bacheca del Grifone, e fra gente dei turni una parola vale un contratto."
        quando: [raschiatore >= 1]
        esito:
          titolo: Fra gente dei turni
          testo: |
            Ruffo guarda il segno dei turni sul tuo polso, e quando gli dici che i
            ragazzi di Laresh li vuoi nella tua fila e che per la mietitura
            tornano a casa scrive le due righe di suo pugno. Ilio firma per primo,
            e la Dama ti guarda come una persona di cui fidarsi, un poco
            controvoglia.
          imposta: { laresh.ilio: 2 }
          effetti: { fazione.laresh: 1, rep.laresh: 0.5 }
      - testo: "Raccontare a Ilio i primi turni"
        descrizione: "I primi turni li hai fatti anche tu. Basta raccontarli come sono andati, senza abbellirli."
        quando: [origine.apprendista-raschiatore >= 1]
        esito:
          titolo: Il primo turno
          testo: |
            Racconti a Ilio il tuo primo turno, la corda che gira e il buio sotto
            i piedi, e il ragazzo accanto a te che il secondo turno non l'ha
            fatto. Ilio esce dalla fila e torna da sua madre, e Ruffo, che ha
            ascoltato anche lui, chiude il registro senza protestare.
          imposta: { laresh.ilio: 1 }
          effetti: { fazione.laresh: 1, rep.laresh: 0.5 }

  # ------------------------------------------------------------ 5 → 6 · trenta cani per tre carri (grado 2)
  - id: laresh-trenta-cani-per-tre-carri
    presso: municipio
    immagine: personaggi/julia-castaldi
    titolo: Trenta cani per tre carri
    sommario: "A Cahir serve una licenza per portare il grano di Laresh ai granai del Comune, e la firma Julia Castaldi."
    luogo: Municipio, l'ufficio della Rappresentante
    area: quartieri-alti
    requisiti: [fazione.laresh == 5]
    testo: |
      Nell'anticamera del Municipio Cahir sta seduto in punta di panca, con il
      cappello di feltro fra le mani e l'odore delle stalle addosso, e i
      postulanti in giacca gli lasciano un palmo libero da ogni lato. In tasca
      ha un foglio piegato in quattro, che tocca ogni tanto.

      Quando Tullio chiama il suo nome, Cahir ti guarda. «Vieni anche tu» dice.
      «Tu parli come loro.»

      Julia Castaldi lo riceve dietro una scrivania coperta di pratiche, con la
      voce roca di chi parla da stamattina. Legge il foglio due volte. C'è
      scritto trenta cani per tre carri, il grano di Casa Velar e di chi vorrà
      unirsi, portato ai granai del Comune senza passare da nessun altro.

      «La licenza la firmo io» dice Julia, e posa il foglio. «Il resto lo
      devono firmare altri, e quegli altri mi chiederanno perché.» Poi guarda
      te. «Me lo dica lei, perché.»

      {politica-ed-economia Media} Una carovana che non è della Gilda né della
      concessione toglie un poco di grano a tutti e due, e Julia vuole sentire
      se lo sai.

      {origine rampollo-dei-quartieri-alti} In questo ufficio ci sei entrato da
      bambino, per mano a qualcuno che chiedeva un favore, quando la
      Rappresentante era un'altra.
    opzioni:
      - testo: "Dirle perché alla città conviene"
        descrizione: "Il pane di Qir-Azel viene da Laresh, e Julia rispetta chi glielo ricorda."
        prova: { attributo: sociale, abilita: persuasione, difficolta: Media }
        successo:
          titolo: Questo è un argomento
          testo: |
            «Finché il grano passa da una mano sola, la città mangia al prezzo di quella mano» le dici. «Questo è un argomento» risponde Julia, e firma
            la licenza a nome di Cahir e di Casa Velar, con te come garante.

            A Laresh Cahir ti regala una puledra grigia, perché il garante deve arrivare prima dei carri, e la Dama ti paga.
          pe: { persuasione: 3 }
          almeno: { rep.laresh: 4 }
          effetti: { fazione.laresh: 1, monete: 60, oggetto.laresh-puledra-grigia: 1 }
        fallimento:
          titolo: Una stagione
          testo: |
            Ti accorgi a metà frase che stai ripetendo un discorso del Consiglio. Julia firma una licenza per una stagione sola con te come
            garante, e il resto lo vedrà dai conti.

            A Laresh Cahir ti regala lo stesso una puledra grigia, perché una stagione basta per cominciare, e la Dama ti paga.
          almeno: { rep.laresh: 4 }
          effetti: { fazione.laresh: 1, monete: 60, oggetto.laresh-puledra-grigia: 1, scandalo: 0.5 }
      - testo: "Mettere in ordine davanti a lei i conti della carovana"
        descrizione: "Sul foglio di Cahir mancano i noli della strada e il prezzo del grano ai granai."
        prova: { attributo: mentale, abilita: politica-ed-economia, difficolta: Media }
        successo:
          titolo: I conti della carovana
          testo: |
            Sul retro del foglio scrivi i noli e il prezzo del grano ai granai, e Julia annuisce una volta, che da lei è molto. Firma la licenza a
