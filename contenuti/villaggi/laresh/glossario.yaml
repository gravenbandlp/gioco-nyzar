# Le voci del glossario per la gente di Laresh, nel formato di contenuti/glossario/personaggi.yaml: presentazioni
# stabili, senza segreti. Cahir ha già la sua voce (contenuti/fazioni/gilda/glossario.yaml).
# - Dama Ryn Velar e Old Marrek vengono dal Codex e finora il gioco li nominava senza una voce.
# - Tobiolo Mirri è il carrettiere dell'aggancio dopo l'Arena (contenuti/scoperte/tracce.yaml).
# - Ilio Vardo ha tre varianti secondo laresh.ilio (prima del mercato, rimasto, partito con i Raschiatori).
# - Ugolino Carrà compare soltanto prima della caduta di Ottone Malgrani; il Seminatore dal passo 13.
glossario:
  - id: dama-ryn-velar
    nome: Dama Ryn Velar
    tipo: personaggio
    sottotitolo: "La vedova di Casa Velar, a Laresh"
    testo: "Vedova di un proprietario terriero di Laresh, di cui amministra le terre da un tavolo sotto il portico di Casa Velar. È una donna asciutta e severa, vestita di grigio, che fa i conti due volte e scrive una cifra alla volta. Sostiene le licenze sul grano di Julia Castaldi, e i Raschiatori che passano a reclutare i ragazzi del villaggio non li vede volentieri."
    requisiti: []

  - id: old-marrek
    nome: Old Marrek
    alias: [Marrek]
    tipo: personaggio
    sottotitolo: "Il mugnaio cieco del mulino centrale"
    testo: "Mugnaio del mulino centrale di Laresh, cieco da bambino. Distingue il grano buono da quello bruciato dalla sola vibrazione della macina, e legge il futuro nelle crepe dei chicchi bruciati a chi lo paga in idromele. Sulle carestie non sbaglia mai e sull'amore quasi sempre. Dice che la terra ogni tanto beve sangue."
    requisiti: []

  - id: tano
    nome: Tano
    tipo: personaggio
    sottotitolo: "Il nipote di Old Marrek"
    testo: "Nipote di Old Marrek, sui dodici anni, che porta il nonno in giro per Laresh tenendolo per la manica. Tiene il conto delle brocche d'idromele incidendo tacche sulle travi del mulino centrale, e ai forestieri tiene a dire che è il nipote del mugnaio, perché c'è chi lo chiama figlio."
    requisiti: []

  - id: tobiolo-mirri
    nome: Tobiolo Mirri
    tipo: personaggio
    sottotitolo: "Carrettiere di Laresh"
    testo: "Carrettiere di Laresh che porta il grano del villaggio in città e torna con il sale. Conosce ogni buca della strada dei carri, tormenta un cappello di paglia quando deve chiedere un favore, e ai forestieri che cercano Dama Ryn Velar indica Casa Velar con il manico della frusta."
    requisiti: []

  - id: casa-velar
    nome: Casa Velar
    tipo: luogo
    sottotitolo: "La casa della Dama, a Laresh"
    testo: "La più lunga delle case di Laresh, con i muri di fango e paglia intrecciata e un portico che guarda sull'aia. Nella cucina, all'alba, la Dama mangia con i fittavoli e i braccianti a una tavola sola. Da qui Dama Ryn Velar amministra le terre del marito e tiene il libro dei conti del villaggio."
    requisiti: []

  - id: ilio-vardo
    nome: Ilio Vardo
    alias: [Ilio]
    tipo: personaggio
    sottotitolo: "Figlio di un fittavolo di Laresh"
    testo: "Figlio di un fittavolo di Dama Ryn Velar. Ha sedici anni e le mani tagliate dalla falce. Il giorno di mercato si è messo in fila davanti al tavolo del reclutatore dei Raschiatori, primo di sei ragazzi di Laresh, mentre sua madre guardava dal bordo dell'aia."
    requisiti: [laresh.ilio == 0]

  - id: ilio-vardo-rimasto
    nome: Ilio Vardo
    alias: [Ilio]
    tipo: personaggio
    sottotitolo: "Figlio di un fittavolo di Laresh"
    testo: "Figlio di un fittavolo di Dama Ryn Velar. Ha sedici anni e le mani tagliate dalla falce. Voleva partire con i Raschiatori per la Cicatrice, e invece è rimasto a Laresh a mietere il campo di suo padre. I ragazzi del villaggio lo ascoltano più dei vecchi."
    requisiti: [laresh.ilio == 1]

  - id: ilio-vardo-raschiatore
    nome: Ilio Vardo
    alias: [Ilio]
    tipo: personaggio
    sottotitolo: "Ragazzo di Laresh, fra i Raschiatori"
    testo: "Figlio di un fittavolo di Dama Ryn Velar, partito a sedici anni con il reclutatore dei Raschiatori. Il suo contratto dice che torna a Laresh per la mietitura e che la paga va alla famiglia ogni mese. Dal Grifone di Ferro scrive a casa lettere che sua madre si fa leggere."
    requisiti: [laresh.ilio == 2]

  - id: oreste-ruffo
    nome: Oreste Ruffo
    alias: [Ruffo]
    tipo: personaggio
    sottotitolo: "Reclutatore dei Raschiatori"
    testo: "Raschiatore sui cinquant'anni a cui manca l'orecchio sinistro, e porta i capelli corti perché si veda. Gira i villaggi della Superficie con un carro che ha una lanterna dipinta sulla tela, a reclutare ragazzi per i turni della Cicatrice. Parla piano, con la pazienza di un vecchio maestro, e non alza mai la voce."
    requisiti: []

  - id: ugolino-carra
    nome: Ugolino Carrà
    alias: [Carrà]
    tipo: personaggio
    sottotitolo: "Fattore della concessione dei Malgrani a Laresh"
    testo: "Fattore della concessione dei mulini che i Malgrani tengono a Laresh. Porta una giacca di panno buono con lo stemma dei padroni in ottone sul bavero, e tiene i pesi della bilancia in una cassetta foderata di velluto. A ogni sacco che pesa ripete che è per contratto."
    requisiti: [pista.pelle < 7]

  - id: seminatore
    nome: Seminatore
    tipo: creatura
    sottotitolo: "Una macchina di quelli di prima, nei campi di Laresh"
    testo: "Una macchina di quelli di prima, con un corpo di metallo grande come una tramoggia in cima a quattro trampoli lunghi tre uomini. Pianta le zampe nella terra come pali e ci resta fermo a bere. A Laresh il nome gliel'ha dato Tano, il nipote del mugnaio."
    requisiti: [fazione.laresh >= 13]
