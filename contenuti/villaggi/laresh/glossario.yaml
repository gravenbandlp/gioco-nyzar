# Le voci del glossario per la gente di Laresh, nel formato di contenuti/glossario/personaggi.yaml: presentazioni
# stabili, senza segreti. Cahir ha già la sua voce (contenuti/fazioni/gilda/glossario.yaml).
# - Dama Ryn Velar e Old Marrek vengono dal Codex e finora il gioco li nominava senza una voce.
# - Tobiolo Mirri è il carrettiere dell'aggancio dopo l'Arena (contenuti/scoperte/tracce.yaml).
# - Ilio Vardo ha tre varianti secondo laresh.ilio (prima del mercato, rimasto, partito con i Raschiatori).
# - Ugolino Carrà compare soltanto prima della caduta di Ottone Malgrani; il Seminatore dal passo 13.
glossario:
  - id: dama-ryn-velar
    nome: Dama Ryn Velar
    tipo: personaggio
    sottotitolo: "La vedova di Casa Velar, a Laresh"
    testo: "Vedova di un proprietario terriero di Laresh, amministra le terre da un tavolo sotto il portico di Casa Velar. Sostiene le licenze sul grano di Julia Castaldi e non ama i reclutatori dei Raschiatori."
    requisiti: []

  - id: old-marrek
    nome: Old Marrek
    alias: [Marrek]
    tipo: personaggio
    sottotitolo: "Il mugnaio cieco del mulino centrale"
    testo: "Mugnaio cieco del mulino centrale di Laresh. A chi lo paga in idromele legge il futuro nelle crepe del grano bruciato, e sulle carestie non sbaglia mai. Dice che la terra ogni tanto beve sangue."
    requisiti: []

  - id: tano
    nome: Tano
    tipo: personaggio
    sottotitolo: "Il nipote di Old Marrek"
    testo: "Nipote dodicenne di Old Marrek, porta il nonno in giro per Laresh tenendolo per la manica e segna le brocche d'idromele con tacche sulle travi del mulino."
    requisiti: []

  - id: tobiolo-mirri
    nome: Tobiolo Mirri
    tipo: personaggio
    sottotitolo: "Carrettiere di Laresh"
    testo: "Carrettiere di Laresh che porta il grano in città e torna con il sale, e tormenta il cappello di paglia quando deve chiedere un favore."
    requisiti: []

  - id: casa-velar
    nome: Casa Velar
    tipo: luogo
    sottotitolo: "La casa della Dama, a Laresh"
    testo: "La più lunga delle case di Laresh, con un portico sull'aia, da cui Dama Ryn Velar amministra le terre del marito e tiene il libro dei conti del villaggio."
    requisiti: []

  - id: ilio-vardo
    nome: Ilio Vardo
    alias: [Ilio]
    tipo: personaggio
    sottotitolo: "Figlio di un fittavolo di Laresh"
    testo: "Figlio sedicenne di un fittavolo di Dama Ryn Velar. Il giorno di mercato si è messo in fila per primo davanti al reclutatore dei Raschiatori, sotto gli occhi della madre."
    requisiti: [laresh.ilio == 0]

  - id: ilio-vardo-rimasto
    nome: Ilio Vardo
    alias: [Ilio]
    tipo: personaggio
    sottotitolo: "Figlio di un fittavolo di Laresh"
    testo: "Figlio sedicenne di un fittavolo di Dama Ryn Velar. Voleva partire con i Raschiatori ed è rimasto a mietere il campo del padre, e i ragazzi del villaggio lo ascoltano più dei vecchi."
    requisiti: [laresh.ilio == 1]

  - id: ilio-vardo-raschiatore
    nome: Ilio Vardo
    alias: [Ilio]
    tipo: personaggio
    sottotitolo: "Ragazzo di Laresh, fra i Raschiatori"
    testo: "Figlio di un fittavolo di Dama Ryn Velar, partito a sedici anni con i Raschiatori con un contratto che gli garantisce la mietitura a casa e la paga alla famiglia. Scrive alla madre dal Grifone di Ferro."
    requisiti: [laresh.ilio == 2]

  - id: oreste-ruffo
    nome: Oreste Ruffo
    alias: [Ruffo]
    tipo: personaggio
    sottotitolo: "Reclutatore dei Raschiatori"
    testo: "Raschiatore sui cinquant'anni senza l'orecchio sinistro, che porta i capelli corti perché si veda. Gira i villaggi della Superficie con un carro a reclutare ragazzi per la Cicatrice, senza mai alzare la voce."
    requisiti: []

  - id: ugolino-carra
    nome: Ugolino Carrà
    alias: [Carrà]
    tipo: personaggio
    sottotitolo: "Fattore della concessione dei Malgrani a Laresh"
    testo: "Fattore della concessione dei mulini che i Malgrani tengono a Laresh, con lo stemma dei padroni in ottone sul bavero. A ogni sacco che pesa ripete che è per contratto."
    requisiti: [pista.pelle < 7]

  - id: seminatore
    nome: Seminatore
    tipo: creatura
    sottotitolo: "Una macchina di quelli di prima, nei campi di Laresh"
    testo: "Una macchina di quelli di prima, un corpo di metallo su quattro trampoli alti tre uomini, che pianta le zampe nella terra e ci resta fermo a bere. Il nome gliel'ha dato Tano."
    requisiti: [fazione.laresh >= 13]
