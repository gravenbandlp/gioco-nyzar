# La quest di Laresh, passo 11 (fazione.laresh 10 → 11): il campo che beve, sotto il mulino centrale. Sotto la botola
# dei mugnai la scala scende in una camera di quelli di prima che sta sotto i campi di Laresh, con i tubi che tirano
# giù l'acqua e il sangue della terra e li mandano via da una chiusa, verso un posto che la spedizione non nomina.
# L'ingresso (`laresh-sotto-la-macina`, al mulino) ha una via a cavallo dallo sbocco del canale nei campi a nord.
# Le stanze vanno in fasce di profondità (una stanza superata non ricompare nella stessa visita):
#   0 l'albero della macina, la scala dei mugnai (le offerte di generazioni di mugnai);
#   1 il soffitto di radici, i canali di vetro; 1-2 il nido dei fuochi azzurri (con lo scontro dei fuochi);
#   2 il campo pallido, le bocche nei muri;
#   3 la sala delle misure (lo schema con la linea verso nord-est), la pozza scura (la terra che beve sangue).
# Ogni stanza ha due prove Medie e una via da due rintocchi con un po' di Ferite, Tormento o Contaminazione.
# Il cuore a 4 è la chiusa con il suo custode (boss): combattimento, Tecnologia o Atletica Difficili, o il Comando.
# Chi vince chiude la chiusa e torna a Laresh con il passo; chi perde o fallisce torna in Superficie e può rientrare.
aree:
  - id: laresh-campo-che-beve
    immagine: ambientazione/regno-profondo
    nome: Il campo che beve
    sommario: "Sotto il mulino centrale di Laresh, i tubi di quelli di prima tirano giù quello che i campi bevono."
    spedizione: { ritorno: superficie-fratturata, soglia: 4, stanze: 3 }
    testo: |
      La scala dei mugnai sbuca in una camera che non finisce, sotto un soffitto di roccia da cui pendono
      le radici del grano. Per terra corrono canali di metallo pieni di un liquido scuro che va in salita,
      e da lontano arriva il battito che Marrek sente sotto la macina.

colonna:
  - { contesto: area, id: laresh-campo-che-beve, musica: the-light-that-failed, ambiente: cave }

storylet:
  # ------------------------------------------------------------ l'ingresso, al mulino centrale
  - id: laresh-sotto-la-macina
    presso: laresh
    immagine: ambientazione/mulino-malgrani
    titolo: Sotto la macina
    sommario: "Sotto la botola dei mugnai una scala di pietra scende verso il battito che Marrek sente da tre inverni."
    luogo: Laresh, il mulino centrale, la botola sotto la macina
    area: superficie-fratturata
    requisiti: [fazione.laresh == 10]
    testo: |
      La botola sotto la macina è aperta su una scala di pietra stretta e
      ripida, con i gradini consumati al centro. Tano tiene la lanterna sopra
      il buco e non vuole scendere.

      «Mio padre ci scendeva a portare il pane» dice Marrek dal suo sgabello.
      «Io sono cieco e non ci sono mai sceso, e lui diceva che era una
      fortuna.»

      {tecnologia Media} Più in basso i gradini diventano lisci come se li
      avesse colati qualcuno.

      Cahir, sulla porta, ti dice che lo sbocco del tubo è nei campi a nord,
      in fondo alla striscia bruciata.
    opzioni:
      - testo: "Scendere la scala dei mugnai"
        descrizione: "Ripida, stretta, consumata al centro. Con la lanterna in una mano e l'altra sul muro."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Media }
        successo:
          titolo: La scala
          testo: |
            Scendi con la spalla contro il muro finché la botola è un quadrato
            giallo lontano e la lanterna non arriva alle pareti.
          pe: { atletica: 2 }
          vai: laresh-campo-che-beve
        fallimento:
          titolo: I gradini lisci
          testo: |
            Dove i gradini diventano lisci scivoli, e fai l'ultimo tratto seduto,
            battendo la schiena su ogni scalino mentre la lanterna rotola via.
          effetti: { ferite: 0.5, tormento: 0.5 }
          vai: laresh-campo-che-beve
      - testo: "Farti fare luce da Tano e cercare la via dei mugnai"
        descrizione: "I mugnai scendevano con il pane, e avranno lasciato segni."
        prova: { attributo: mentale, abilita: percezione, difficolta: Media }
        successo:
          titolo: Le tacche di farina
          testo: |
            Sul muro della scala trovi tacche bianche di farina impastata
            all'altezza della mano, e seguendole metti i piedi dove li mettevano i
            mugnai.
          pe: { percezione: 2 }
          vai: laresh-campo-che-beve
        fallimento:
          titolo: La lanterna che si spegne
          testo: |
            I segni non li trovi, e a metà scala la lanterna si spegne, così fai
            il resto al buio contando i gradini a voce alta.
          effetti: { tormento: 0.5 }
          vai: laresh-campo-che-beve
      - testo: "Entrare a cavallo dallo sbocco del tubo nei campi a nord"
        descrizione: "Dove finisce la striscia bruciata il tubo sbuca in un fosso, e a cavallo si entra in piano."
        requisiti: [chiave.cavalcatura >= 1]
        costo: 0
        esito:
          titolo: Lo sbocco
          testo: |
            Il tubo sbuca in un fosso largo quanto una porta, in fondo alla
            striscia bruciata, e ci entri in piedi con la lanterna dopo aver
            legato la bestia a un palo.
          vai: laresh-campo-che-beve
      - testo: "Scendere piano con Tano e le corde dei mugnai"
        descrizione: "Le corde dei mugnai sono vecchie ma tengono, e con Tano che le fila ci vuole il doppio."
        costo: 2
        esito:
          titolo: Le corde
          testo: |
            Tano ti fila la corda un palmo alla volta, contando ad alta voce per
            farsi coraggio, e tocchi il fondo con i fianchi segnati.
          effetti: { tormento: 0.5 }
          vai: laresh-campo-che-beve

  # ------------------------------------------------------------ 0 · l'albero della macina
  - id: laresh-campo-l-albero-della-macina
    immagine: ambientazione/mulino-malgrani
    titolo: L'albero della macina
    sommario: "L'albero di ferro della macina continua giù, molto più in basso di quanto serva a un mulino."
    luogo: Il campo che beve, sotto la macina
    area: laresh-campo-che-beve
    ripetibile: true
    requisiti: [fazione.laresh == 10, profondita.laresh-campo-che-beve == 0]
    testo: |
      In fondo alla scala, nel mezzo di un pozzo, scende l'albero della
      macina, di ferro legato con le fasce dei fabbri finché non entra in un
      manicotto di metallo grigio senza giunture e continua giù nel buio. È
      fermo, eppure trema.

      {tecnologia Media} È l'albero che girava il mulino, e i mugnai ci hanno
      appoggiato sopra la macina come una pentola sul fuoco di un altro.
    opzioni:
      - testo: "Calarti lungo l'albero"
        descrizione: "Il manicotto ha le fasce dei fabbri per appoggiare i piedi, ma più giù non ci sono più."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Media }
        successo:
          titolo: Le fasce dei fabbri
          testo: |
            Scendi abbracciato all'albero, prima con i piedi sulle fasce e poi con
            le ginocchia strette sul metallo, fino a un passaggio basso aperto su
            una luce azzurrina.
          pe: { atletica: 2 }
          effetti: { profondita.laresh-campo-che-beve: 1 }
        fallimento:
          titolo: Il metallo liscio
          testo: |
            Dove finiscono le fasce scivoli lungo l'albero per un tratto che ti
            brucia le mani, e risali con le braccia che tremano.
          effetti: { ferite: 0.5 }
      - testo: "Capire dove porta il manicotto"
        descrizione: "Dove il ferro dei fabbri entra nel metallo di quelli di prima, l'unione avrà una porta."
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Media }
        successo:
          titolo: Lo sportello nel manicotto
          testo: |
            Sul manicotto trovi una linea sottile, e premendola si apre uno
            sportello su una scaletta che gira intorno all'albero verso una luce
            azzurrina.
          pe: { tecnologia: 2 }
          effetti: { profondita.laresh-campo-che-beve: 1 }
        fallimento:
          titolo: Il tremito
          testo: |
            Appoggi l'orecchio al manicotto e il battito ti entra nella testa come
            un chiodo, lasciandoti un ronzio che ci mette un pezzo ad andarsene.
          effetti: { tormento: 1 }
      - testo: "Calarti con la corda legata alle fasce"
        descrizione: "Una corda doppia legata in cima, e giù piano, anche se la corda brucia."
        costo: 2
        esito:
          titolo: La corda doppia
          testo: |
            Ti cali a strattoni con la corda legata alle fasce, e in fondo,
            davanti a un passaggio basso, ti fasci con il fazzoletto il palmo
            scorticato.
          effetti: { profondita.laresh-campo-che-beve: 1, ferite: 0.5 }

  # ------------------------------------------------------------ 0 · la scala dei mugnai
  - id: laresh-campo-la-scala-dei-mugnai
    immagine: ambientazione/rovine-dei-precursori
    titolo: Le offerte dei mugnai
    sommario: "Lungo l'ultimo tratto della scala le nicchie nella roccia tengono un pane secco e un nome."
    luogo: Il campo che beve, la scala dei mugnai
    area: laresh-campo-che-beve
    ripetibile: true
    requisiti: [fazione.laresh == 10, profondita.laresh-campo-che-beve == 0]
    testo: |
      Le pareti dell'ultimo tratto della scala sono piene di nicchie, e in
      ognuna c'è un pane secco diventato pietra o una brocca col tappo di
      cera, con un nome inciso sotto. Fra gli ultimi c'è un Marrek, scritto
      due volte.

      {accademiche Media} I nomi più in basso sono in un alfabeto più
      vecchio della città.
    opzioni:
      - testo: "Leggere i nomi fino in fondo"
        descrizione: "Sotto l'ultima nicchia forse c'è scritto perché ci scendevano."
        prova: { attributo: mentale, abilita: accademiche, difficolta: Media }
        successo:
          titolo: Per la sete
          testo: |
            Sotto la nicchia più bassa leggi a fatica tre parole dell'alfabeto
            vecchio, *per la sete*, e dietro la roccia cava un passaggio stretto
            porta verso una luce azzurrina.
          pe: { accademiche: 2 }
          effetti: { profondita.laresh-campo-che-beve: 1 }
        fallimento:
          titolo: I nomi che si ripetono
          testo: |
            Leggi i nomi finché cominciano a ripetersi, e ti accorgi di averli
            detti tutti ad alta voce, con il battito che teneva il tempo.
          effetti: { tormento: 1 }
      - testo: "Scendere senza toccare le offerte"
        descrizione: "Le nicchie arrivano fino al pavimento, e le offerte stanno meglio dove sono."
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Media }
        successo:
          titolo: Di lato
          testo: |
            Scendi di lato con la schiena al muro libero e la lanterna alta, senza
            smuovere una brocca, fino al passaggio stretto verso la luce
            azzurrina.
          pe: { acrobazia: 2 }
          effetti: { profondita.laresh-campo-che-beve: 1 }
        fallimento:
          titolo: La brocca rotta
          testo: |
            Il gomito urta una brocca d'idromele che si rompe sui gradini, e il
            pavimento la beve senza lasciare una macchia.
          effetti: { tormento: 0.5 }
      - testo: "Lasciare un pane anche tu"
        descrizione: "Nella bisaccia c'è il pane di Casa Velar, e i mugnai lo lasciavano qui."
        costo: 2
        esito:
          titolo: Il pane nella nicchia
          testo: |
            Lasci il tuo pane in una nicchia vuota, e dopo un tempo lungo è
            sparito, mentre in fondo alla scala ora vedi il passaggio.
          effetti: { profondita.laresh-campo-che-beve: 1, tormento: 0.5 }

  # ------------------------------------------------------------ 1 · il soffitto di radici
  - id: laresh-campo-il-soffitto-di-radici
    immagine: ambientazione/regno-profondo
    titolo: Il soffitto di radici
    sommario: "Una sala bassa e larga quanto un campo, sotto le radici del grano che sgocciolano."
    luogo: Il campo che beve, sotto i campi
    area: laresh-campo-che-beve
    ripetibile: true
    requisiti: [fazione.laresh == 10, profondita.laresh-campo-che-beve == 1]
    testo: |
      Dal soffitto pendono le radici bianche del grano di sopra, che
      sgocciolano su un fango scuro e lucido in una sala larga quanto un
      campo. Qua e là un ciuffo è nero fino al soffitto.

      {natura Media} Le radici nere pendono sopra i canali, e il grano nero
      comincia da qui sotto.
    opzioni:
      - testo: "Seguire le radici nere"
        descrizione: "Le radici nere stanno sopra i canali, e i canali vanno da qualche parte."
        prova: { attributo: mentale, abilita: natura, difficolta: Media }
        successo:
          titolo: Sotto il nero
          testo: |
            Sotto ogni ciuffo nero scorre un canale, e i canali convergono verso
            un'apertura in fondo alla sala, dove ti portano.
          pe: { natura: 2 }
          effetti: { profondita.laresh-campo-che-beve: 1 }
        fallimento:
          titolo: Le radici in faccia
          testo: |
            Una radice nera ti si avvolge al collo come una sciarpa bagnata, e te
            la strappi di dosso con un urlo che la sala ti rimanda tre volte.
          effetti: { tormento: 1 }
      - testo: "Attraversare il fango in fretta"
        descrizione: "Il fango è lucido e scivoloso, e meglio non fermarsi."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Media }
        successo:
          titolo: L'altra riva
          testo: |
            Attraversi a passi lunghi, senza fermarti abbastanza da affondare,
            fino al pavimento di pietra dall'altra parte.
          pe: { acrobazia: 2 }
          effetti: { profondita.laresh-campo-che-beve: 1 }
        fallimento:
          titolo: Fino al ginocchio
          testo: |
            A metà sala il fango ti tira giù lo stivale come una bocca, e torni
            indietro zoppicando con il piede nudo che si gela.
          effetti: { ferite: 0.5 }
      - testo: "Camminare lungo il muro, piegato"
        descrizione: "Lungo il muro il fango è più sottile, ma si passa piegati in due e ci vuole il triplo."
        costo: 2
        esito:
          titolo: Piegato in due
          testo: |
            Fai il giro della sala piegato in due, con le radici che ti
            sgocciolano sulla nuca, e arrivi con la schiena a pezzi.
          effetti: { profondita.laresh-campo-che-beve: 1, ferite: 0.5, contaminazione: 0.5 }

  # ------------------------------------------------------------ 1 · i canali di vetro
  - id: laresh-campo-i-canali-di-vetro
    immagine: ambientazione/cristalli-conduttori
    titolo: I canali di vetro
    sommario: "Canali di metallo chiaro attraversano la galleria, pieni di un liquido scuro che va in salita."
    luogo: Il campo che beve, i canali
    area: laresh-campo-che-beve
    ripetibile: true
    requisiti: [fazione.laresh == 10, profondita.laresh-campo-che-beve == 1]
    testo: |
      La galleria è tagliata da un fascio di canali di metallo chiaro,
      larghi quanto una mangiatoia, dove un liquido scuro scorre in salita
      senza un rumore. Sul bordo del primo qualcuno ha lasciato una lanterna
      da mugnaio spenta.

      {tecnologia Media} Lo spingono le spirali sul fondo, e da qualche
      parte deve esserci il modo di fermarle.
    opzioni:
      - testo: "Trovare il modo di fermare le spirali"
        descrizione: "Ogni canale ha una piastra sul bordo. Una piastra è un interruttore, finché non si dimostra il contrario."
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Media }
        successo:
          titolo: La piastra
          testo: |
            Alla quarta piastra il liquido di tutti i canali si ferma il tempo di
            passare, e quando sei dall'altra parte riprende a salire.
          pe: { tecnologia: 2 }
          effetti: { profondita.laresh-campo-che-beve: 1 }
        fallimento:
          titolo: Lo spruzzo
          testo: |
            La piastra sbagliata ti sputa addosso uno spruzzo scuro e tiepido, e
            torni indietro a pulirti la faccia.
          effetti: { contaminazione: 0.5 }
      - testo: "Saltare i canali uno alla volta"
        descrizione: "Cinque canali con un bordo largo un piede fra l'uno e l'altro, da saltare con la rincorsa giusta."
        prova: { attributo: fisico, abilita: atletica, difficolta: Media }
        successo:
          titolo: Cinque salti
          testo: |
            Salti da un bordo all'altro cinque volte, atterrando con le braccia
            larghe, e all'ultimo hai il cuore che batte più forte del battito.
          pe: { atletica: 2 }
          effetti: { profondita.laresh-campo-che-beve: 1 }
        fallimento:
          titolo: Il terzo canale
          testo: |
            Al terzo salto finisci nel canale fino alla cintura, e il liquido ti
            tira in salita per un tratto prima che tu riesca a uscire.
          effetti: { contaminazione: 0.5, ferite: 0.5 }
      - testo: "Guadare i canali"
        descrizione: "Il liquido è tiepido e arriva alla coscia, e poi ci si lava come si può."
        costo: 2
        esito:
          titolo: Il guado
          testo: |
            Guadi i canali uno dopo l'altro con le mani alzate, e il liquido ti
            tira i calzoni in salita, lasciandoti le gambe scure fino alle cosce.
          effetti: { profondita.laresh-campo-che-beve: 1, contaminazione: 1 }

  # ------------------------------------------------------------ 1-2 · il nido dei fuochi
  - id: laresh-campo-il-nido-dei-fuochi
    immagine: ambientazione/cristalli-conduttori
    titolo: Il nido dei fuochi
    sommario: "In una camera tonda nascono i fuochi azzurri dei campi, dalle scintille che salgono dal pavimento."
    luogo: Il campo che beve, la camera dei fuochi
    area: laresh-campo-che-beve
    ripetibile: true
    requisiti: [fazione.laresh == 10, profondita.laresh-campo-che-beve >= 1, profondita.laresh-campo-che-beve <= 2]
    testo: |
      Dalle crepe del pavimento di una camera a cupola salgono scintille
      azzurre che a mezz'aria diventano fuochi grandi come un pugno, quelli
      che di notte galleggiano sui campi. Lo sciame gira lento proprio sopra
      la porta dall'altra parte, e ogni tanto un fuoco sale per un foro del
      soffitto.

      {magia Media} Il Mana qui non c'entra, e i fuochi portano su qualcosa
      che sale dalle crepe.
    opzioni:
      - testo: "Passare sotto lo sciame senza farti vedere"
        descrizione: "Lo sciame gira lento in un verso, e lascia buio dietro di sé."
        prova: { attributo: fisico, abilita: furtivita, difficolta: Media }
        successo:
          titolo: Nel buio dello sciame
          testo: |
            Ti muovi nel buio che lo sciame si lascia dietro, un passo ogni giro,
            e quando torna sei già nella galleria.
          pe: { furtivita: 2 }
          effetti: { profondita.laresh-campo-che-beve: 1 }
        fallimento:
          titolo: Il freddo addosso
          testo: |
            Lo sciame si gira e ti passa sopra, e ti ritrovi fuori a sfregarti le
            braccia senza ricordare di essere uscito.
          effetti: { tormento: 1 }
      - testo: "Tendere la mano ai fuochi"
        descrizione: "Rispondono a qualcosa che sale dalle crepe. Forse rispondono anche a chi sa ascoltare il Mana."
        prova: { attributo: mentale, abilita: [magia, resilienza], difficolta: Media }
        successo:
          titolo: La mano fredda
          testo: |
            I fuochi più vicini ti girano intorno al polso senza toccarlo, freddi
            come acqua di fonte, poi salgono tutti verso la cupola lasciando
            libera la porta.
          pe: { magia: 2 }
          effetti: { profondita.laresh-campo-che-beve: 1 }
        fallimento:
          titolo: Le dita azzurre
          testo: |
            I fuochi ti si posano sulle dita, e per un'ora la mano non risponde,
            con le unghie che restano azzurre.
          effetti: { tormento: 1, ferite: 0.5 }
      - testo: "Aprirti la strada fra i fuochi"
        descrizione: "Sono fiamme fredde e piccole, ma tante. Prese a colpi, si spengono come le altre."
        combattimento: laresh-fuochi-azzurri
        vittoria:
          titolo: I fuochi spenti
          testo: |
            I fuochi che colpisci si spengono con un sibilo, come braci in un
            secchio, e il resto dello sciame sale verso la cupola.
          effetti: { profondita.laresh-campo-che-beve: 1 }
        sconfitta:
          titolo: La brina
          testo: |
            Lo sciame ti avvolge di brina fino ai gomiti, e ti ritrovi fuori in
            ginocchio, con le mani che non stringono la lanterna.
          effetti: { tormento: 0.5 }
      - testo: "Aspettare che lo sciame salga ai campi"
        descrizione: "Ogni tanto i fuochi salgono tutti insieme. Basta aspettare al freddo, quanto serve."
        costo: 2
        esito:
          titolo: L'attesa al freddo
          testo: |
            Aspetti contro il muro con le ginocchia al petto, tanto che perdi il
            conto dei battiti, e quando lo sciame sale hai le dita gelate.
          effetti: { profondita.laresh-campo-che-beve: 1, ferite: 0.5, tormento: 0.5 }

  # ------------------------------------------------------------ 2 · il campo pallido
  - id: laresh-campo-il-campo-pallido
    immagine: ambientazione/regno-profondo
    titolo: Il campo pallido
    sommario: "Sotto terra cresce un campo di grano bianco come la cera, sotto una luce azzurra."
    luogo: Il campo che beve, il campo pallido
    area: laresh-campo-che-beve
    ripetibile: true
    requisiti: [fazione.laresh == 10, profondita.laresh-campo-che-beve == 2]
    testo: |
      La galleria si apre su un campo di grano in file dritte come quelle
      della Dama, sotto una luce azzurra che viene dal soffitto senza una
      lampada. Le spighe sono bianche come la cera e immobili, e fra le file
      corrono rotaie sottili che spariscono in fondo.

      {natura Media} Il chicco ha la forma di quello di Laresh, e questo
      campo l'hanno seminato molto prima dei campi di sopra.
    opzioni:
      - testo: "Seguire le rotaie fino in fondo al campo"
        descrizione: "Le rotaie servivano a qualcosa che mieteva o seminava. Vanno da dove partiva a dove tornava."
        prova: { attributo: mentale, abilita: percezione, difficolta: Media }
        successo:
          titolo: Le rotaie
          testo: |
            Le rotaie si riuniscono in una sola che entra in una galleria più
            larga, segnata da impronte di punte sottili distanti tre passi.
          pe: { percezione: 2 }
          effetti: { profondita.laresh-campo-che-beve: 1 }
        fallimento:
          titolo: Le file tutte uguali
          testo: |
            Le rotaie si dividono e si riuniscono, e dopo un'ora sei di nuovo
            all'ingresso, con la giubba bianca di una polvere fine come il talco.
          effetti: { tormento: 0.5 }
      - testo: "Attraversare il campo spiga per spiga"
        descrizione: "Le spighe sono fitte e dure come canne. Bisogna aprirsi la strada senza spezzarle tutte."
        prova: { attributo: fisico, abilita: [resistenza, atletica], difficolta: Media }
        successo:
          titolo: Le canne bianche
          testo: |
            Ti apri la strada con gli avambracci e le spighe si richiudono dietro
            di te, fino a una galleria larga dall'altra parte.
          pe: { resistenza: 2 }
          effetti: { profondita.laresh-campo-che-beve: 1 }
        fallimento:
          titolo: I tagli
          testo: |
            Le foglie bianche tagliano come carta, e a metà campo torni indietro
            con le mani e le guance rigate di rosso.
          effetti: { ferite: 0.5 }
      - testo: "Camminare sulle rotaie a occhi bassi"
        descrizione: "Le rotaie sono strette, ma attraversano tutto il campo. Basta non guardare le spighe."
        costo: 2
        esito:
          titolo: A occhi bassi
          testo: |
            Cammini sulla rotaia con gli occhi sui piedi per un tempo lunghissimo,
            e arrivi in fondo con la nausea.
          effetti: { profondita.laresh-campo-che-beve: 1, tormento: 1 }

  # ------------------------------------------------------------ 2 · le bocche
  - id: laresh-campo-le-bocche
    immagine: ambientazione/marea-grigia
    titolo: Le bocche nei muri
    sommario: "Una galleria con i muri pieni di fori tondi che tirano l'aria verso di sé."
    luogo: Il campo che beve, la galleria delle bocche
    area: laresh-campo-che-beve
    ripetibile: true
    requisiti: [fazione.laresh == 10, profondita.laresh-campo-che-beve == 2]
    testo: |
      I muri della galleria sono pieni di fori tondi larghi quanto una testa,
      e ognuno tira l'aria con un sibilo basso che piega la fiamma della
      lanterna. Sulla soglia della porta in fondo c'è un mucchietto di ossa
      piccole di lepre.

      {resistenza Media} Uno per uno il tiro è debole, ma a metà galleria
      tirano tutti insieme come una corrente di fiume.
    opzioni:
      - testo: "Passare in mezzo con le gambe piantate"
        descrizione: "Il tiro non basta a sollevare un uomo, se a metà non perde l'equilibrio."
        prova: { attributo: fisico, abilita: resistenza, difficolta: Media }
        successo:
          titolo: In mezzo
          testo: |
            Cammini piegato in avanti come contro il vento, e a metà le bocche
            tirano da tutte le parti finché ti sembra di stare fermo, poi il tiro
            si allenta.
          pe: { resistenza: 2 }
          effetti: { profondita.laresh-campo-che-beve: 1 }
        fallimento:
          titolo: Contro il muro
          testo: |
            Il tiro ti strappa la lanterna e ti incolla la guancia a una bocca che
            succhia, e torni indietro a quattro zampe.
          effetti: { ferite: 0.5, tormento: 0.5 }
      - testo: "Tappare le bocche con le pietre del pavimento"
        descrizione: "Le bocche sono collegate. Tappandone abbastanza da un lato, il tiro dall'altro si calma."
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Media }
        successo:
          titolo: Le pietre
          testo: |
            Tappi le bocche con le pietre del pavimento, una fila alla volta, e
            alla decima il tiro cala abbastanza da attraversare camminando.
          pe: { tecnologia: 2 }
          effetti: { profondita.laresh-campo-che-beve: 1 }
        fallimento:
          titolo: La pietra risucchiata
          testo: |
            La bocca si prende la pietra con un rumore di ossa rotte che dura a
            lungo dentro il muro, e le altre tirano più forte.
          effetti: { tormento: 1 }
      - testo: "Strisciare sul pavimento"
        descrizione: "Le bocche più basse stanno un palmo sopra il pavimento, e ventre a terra il tiro passa sopra."
        costo: 2
        esito:
          titolo: Ventre a terra
          testo: |
            Strisci sui gomiti con le bocche che ti sibilano sopra la testa, e
            arrivi alla porta coperto di una polvere grassa.
          effetti: { profondita.laresh-campo-che-beve: 1, contaminazione: 0.5, ferite: 0.5 }

  # ------------------------------------------------------------ 3 · la sala delle misure
  - id: laresh-campo-la-sala-delle-misure
    immagine: ambientazione/rovine-dei-precursori
    titolo: La sala delle misure
    sommario: "Una sala di colonne di vetro mezze vuote, con in mezzo una lastra incisa di linee e cerchi."
    luogo: Il campo che beve, la sala delle misure
    area: laresh-campo-che-beve
    ripetibile: true
    requisiti: [fazione.laresh == 10, profondita.laresh-campo-che-beve == 3]
    testo: |
      In mezzo alla sala c'è una lastra di metallo incisa con linee e cerchi,
      fra colonne di vetro alte quanto un uomo e quasi tutte vuote.

      {accademiche Media} È una mappa. Da un cerchio con accanto una spiga
      parte una linea che passa vicino ad altri cerchi e finisce in una forma
      grande nell'angolo a nord, un poco verso levante.
    opzioni:
      - testo: "Leggere la lastra incisa"
        descrizione: "Chi l'ha incisa voleva che chi scendeva capisse dove si trovava."
        prova: { attributo: mentale, abilita: accademiche, difficolta: Media }
        successo:
          titolo: La linea lunga
          testo: |
            La linea parte dalla spiga, passa vicino a otto o nove cerchi e
            finisce contro la forma grande, e accanto alla spiga una freccia
            indica una porta della sala.
          pe: { accademiche: 2 }
          effetti: { profondita.laresh-campo-che-beve: 1 }
        fallimento:
          titolo: I cerchi
          testo: |
            Ogni volta che conti i cerchi ti viene un numero diverso, e ti
            allontani con un mal di testa che pulsa a tempo con il battito.
          effetti: { tormento: 1 }
      - testo: "Capire le colonne di vetro"
        descrizione: "Sono misure. Una colonna piena e cento vuote dicono che cosa va dove."
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Media }
        successo:
          titolo: La colonna piena
          testo: |
            Le colonne vuote sono i campi di sopra, e tutto quello che bevono va
            verso l'unica piena, oltre la porta che le sta sotto.
          pe: { tecnologia: 2 }
          effetti: { profondita.laresh-campo-che-beve: 1 }
        fallimento:
          titolo: Il vetro incrinato
          testo: |
            Tocchi una colonna e il vetro si incrina, e mentre il liquido comincia
            a colare esci dalla sala camminando all'indietro.
          effetti: { contaminazione: 0.5 }
      - testo: "Ricopiare tutto e pensarci dopo"
        descrizione: "Un pezzo di carbone e il retro di un sacco. La Dama i disegni li legge meglio dei libri."
        costo: 2
        esito:
          titolo: Il sacco disegnato
          testo: |
            Ricopi la lastra sul retro di un sacco finché il braccio ti fa male,
            senza capire quasi niente, e uscendo prendi la porta sotto la colonna
            piena.
          effetti: { profondita.laresh-campo-che-beve: 1, tormento: 0.5 }

  # ------------------------------------------------------------ 3 · la pozza scura
  - id: laresh-campo-la-pozza-scura
    immagine: ambientazione/marea-grigia
    titolo: La pozza scura
    sommario: "Una vasca di pietra piena di liquido scuro, con il bordo coperto di ossa di bestie."
    luogo: Il campo che beve, la vasca
    area: laresh-campo-che-beve
    ripetibile: true
    requisiti: [fazione.laresh == 10, profondita.laresh-campo-che-beve == 3]
    testo: |
      I canali finiscono in una vasca di pietra grande come l'aia di Casa
      Velar, piena di un liquido scuro in cui la lanterna non si riflette.
      Sul bordo ci sono ossa di bestie disposte in cerchio, e dall'altra
      parte un canale più largo porta via il liquido verso una galleria che
      scende.

      {medicina Media} È sangue mescolato con l'acqua, ancora liquido come
      appena versato.
    opzioni:
      - testo: "Girare intorno alla vasca senza guardarla"
        descrizione: "Il bordo è largo un passo, con le ossa da scavalcare e gli occhi da tenere sul canale."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Media }
        successo:
          titolo: Gli occhi sul canale
          testo: |
            Giri intorno alla vasca con gli occhi sul canale grande e scopri,
            dall'altra parte, di aver tenuto i pugni chiusi tutto il tempo.
          pe: { resilienza: 2 }
          effetti: { profondita.laresh-campo-che-beve: 1 }
        fallimento:
          titolo: Il riflesso
          testo: |
            Guardi la vasca, e il liquido non riflette nemmeno la tua faccia, e ti
            ritrovi all'ingresso senza ricordare di essere tornato.
          effetti: { tormento: 1 }
      - testo: "Esaminare le ossa sul bordo"
        descrizione: "Le ossa dicono come è morta una bestia, e quando."
        prova: { attributo: mentale, abilita: [medicina, natura], difficolta: Media }
        successo:
          titolo: Le ossa pulite
          testo: |
            Sono bestie morte di vecchiaia o di parto, senza segni di coltello o
            di denti, e fra le ossa trovi un sentiero sgombro fino al canale
            grande.
          pe: { medicina: 2 }
          effetti: { profondita.laresh-campo-che-beve: 1 }
        fallimento:
          titolo: L'osso caldo
          testo: |
            Un osso che prendi in mano è caldo come se la bestia fosse appena
            morta, e la vasca lo prende senza un'onda quando lo lasci cadere.
          effetti: { tormento: 1 }
      - testo: "Camminare nel canale grande"
        descrizione: "Il canale grande porta via il liquido, e anche chi ci cammina dentro."
        costo: 2
        esito:
          titolo: Nel canale
          testo: |
            Il liquido tiepido del canale ti arriva alle ginocchia e ti spinge con
            calma fino alla galleria che scende, e ne esci con le gambe scure.
          effetti: { profondita.laresh-campo-che-beve: 1, contaminazione: 1 }

  # ------------------------------------------------------------ il cuore · la chiusa
  - id: laresh-campo-la-chiusa
    immagine: bestiario/salvaguardia-precursori
    titolo: La chiusa
    sommario: "Sotto la chiusa aperta passa il canale grande, e davanti lavora una macchina con sei braccia a rastrello."
    luogo: Il campo che beve, la chiusa
    area: laresh-campo-che-beve
    requisiti: [fazione.laresh == 10, profondita.laresh-campo-che-beve >= 4]
    testo: |
      La galleria finisce in una sala alta, dove il canale passa sotto una
      chiusa di metallo sollevata e se ne va in un tunnel verso nord, un poco
      a levante. Accanto c'è la ruota che la abbassa.

      Davanti alla chiusa una macchina larga come un carro toglie le ossa dal
      canale con sei braccia a rastrello. Il battito che Marrek sente sotto la
      macina viene da qui.

      {tecnologia Difficile} Se giri la ruota mentre la macchina è dall'altra
      parte del canale, forse fai in tempo.

      Il custode si gira verso la tua lanterna e alza i rastrelli.
    opzioni:
      - testo: "Affrontare il custode della chiusa"
        descrizione: "Sei braccia a rastrello su un corpo grande come un carro, che tiene pulito il canale da prima di Laresh."
        combattimento: laresh-la-chiusa
        vittoria:
          titolo: La chiusa abbassata
          testo: |
            Il custode si accascia sul bordo del canale, e giri la ruota finché la
            chiusa scende con un gemito lungo e il battito sotto i piedi tace.

            Stacchi dal custode un pezzo del suo metallo e risali fino alla
            botola, dove Tano ti aspetta con la lanterna.
          pe: { armi-da-mischia: 5 }
          effetti: { fazione.laresh: 1, reliquie.frammento-inciso: 2, parte.nucleo-2: 1 }
          vai: superficie-fratturata
        sconfitta:
          titolo: I rastrelli
          testo: |
            Un rastrello ti getta contro il muro e un altro ti trascina
            all'imbocco della galleria come un ramo da togliere dal canale, e
            risali con la chiusa ancora aperta.
          effetti: { tormento: 0.5 }
          vai: superficie-fratturata
      - testo: "Girare la ruota mentre il custode lavora"
        descrizione: "Quando il custode è dall'altra parte del canale la ruota è libera, e va girata tutta prima che torni."
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Difficile }
        successo:
          titolo: La ruota
          testo: |
            Ti butti sulla ruota quando il custode è dall'altra parte, e la chiusa scende con un
            gemito. Il custode si volta a cose fatte e torna a pulire il canale fermo, mentre il
            battito sotto i piedi tace.

            Stacchi una scheggia di metallo dal bordo della chiusa e risali fino alla botola, dove
            Tano ti aspetta.
          pe: { tecnologia: 5 }
          effetti: { fazione.laresh: 1, reliquie.frammento-inciso: 2, parte.nucleo-2: 1 }
          vai: superficie-fratturata
        fallimento:
          titolo: La ruota a metà
          testo: |
            La ruota si blocca a metà giro, e il custode attraversa il canale con
            un passo e ti trascina via per la caviglia. Risali zoppicando, con la
            chiusa aperta alle spalle.
          effetti: { ferite: 2, tormento: 1 }
          vai: superficie-fratturata
      - testo: "Bloccare i rastrelli con le leve dei mugnai"
        descrizione: "Una leva di ferro dei mugnai in ogni giuntura, e la ruota la giri dopo."
        prova: { attributo: fisico, abilita: [atletica, rissa], difficolta: Difficile }
        successo:
          titolo: Sei leve
          testo: |
            Pianti una leva in ogni giuntura con i rastrelli che ti fischiano
            sopra la testa, e alla sesta il custode resta piegato come un ragno
            morto. Giri la ruota, e quando la chiusa scende il battito sotto i
            piedi tace.

            Stacchi dal custode un pezzo del suo metallo e risali fino alla
            botola, dove Tano ti aspetta.
          pe: { atletica: 5 }
          effetti: { fazione.laresh: 1, reliquie.frammento-inciso: 2, parte.nucleo-2: 1 }
          vai: superficie-fratturata
        fallimento:
          titolo: La leva che salta
          testo: |
            La terza leva salta dalla giuntura e ti torna in faccia, e due
            rastrelli ti gettano oltre l'imbocco della galleria. Risali la scala
            con il sangue in bocca.
          effetti: { ferite: 2, tormento: 1 }
          vai: superficie-fratturata
      - testo: "Ordinargli di fermarsi"
        descrizione: "La formula del Comando parla alle macchine di quelli di prima, e questa ha sempre ubbidito a qualcuno."
        incantesimo: comando
        prova: { attributo: mentale, abilita: magia, difficolta: Difficile }
        successo:
          titolo: Fermo
          testo: |
            Dici la formula in una lingua che non è la tua, e il custode abbassa i
            rastrelli e resta in attesa mentre giri la ruota. Quando la chiusa
            tocca il fondo il battito sotto i piedi tace.

            Stacchi una scheggia di metallo dal bordo della chiusa e risali fino
            alla botola, dove Tano ti aspetta.
          pe: { magia: 5 }
          effetti: { fazione.laresh: 1, reliquie.frammento-inciso: 2, parte.nucleo-2: 1 }
          vai: superficie-fratturata
        fallimento:
          titolo: La parola a metà
          testo: |
            La formula ti si spezza in bocca, e il custode alza tutti i rastrelli
            e viene verso di te. Scappi su per la galleria con la testa che pulsa,
            senza aver toccato la ruota.
          effetti: { ferite: 1, tormento: 1.5 }
          vai: superficie-fratturata
