# La quest di Laresh, Atto III e inizio dell'Atto IV (fazione.laresh 6 → 10).
# - 6 → 7 `laresh-il-nero-passa-il-rio` (Casa Velar) e il seguito `laresh-il-tubo-nella-cenere`: il grano nero passa
#   il rio di mezzo, la Dama fa bruciare una striscia di campi; nella cenere affiora il dorso di un tubo di quelli di
#   prima che corre verso il mulino centrale. Opzione d'origine del Figlio del Circolo (il fuoco controvento).
# - 7 → 8 `laresh-quelli-di-prima-bevono` (la baracca di Oda Krell): Oda apre il pezzo di tubo, che tira giù invece
#   che su. Opzione d'origine dell'Allievo di Torvessa.
# - 8 → 9 `laresh-l-assemblea-dell-aia` (grado 3, Voce dell'aia): il villaggio decide di fermare la macina di Marrek
#   per aprire il pavimento. Con laresh.ilio 1 parla Ilio, con 2 arriva la sua lettera dalla Cicatrice.
# - 9 → 10 `laresh-la-notte-dei-fuochi`: il segno della Campana. A macina ferma i fuochi azzurri si mettono in file
#   parallele che puntano tutte verso lo stesso punto oltre l'orizzonte, a nord appena piegato a levante; poi resta
#   una fila sola, che si spegne contro la macina. Nessuno spiega che cosa sia. Tano mostra la botola dei mugnai.
storylet:
  # ------------------------------------------------------------ 6 → 7 · il nero passa il rio
  - id: laresh-il-nero-passa-il-rio
    presso: laresh
    immagine: ambientazione/laresh
    titolo: Il nero passa il rio
    sommario: "Il grano nero ha passato il rio di mezzo, e la Dama decide di bruciare una striscia di campi."
    luogo: Laresh, i campi lungo il rio di mezzo, di notte
    area: superficie-fratturata
    requisiti: [fazione.laresh == 6]
    testo: |
      Tano arriva a Casa Velar con una spiga nera strappata sulla riva sud
      del rio. La Dama apre il libro alla pagina dei campi e tira con il
      righello una riga lungo il rio, così forte da segnare il foglio sotto.

      «Si brucia» dice. «Stanotte, prima che il vento giri. Una striscia
      larga venti passi dal mulino al confine, e il grano buono resta di
      qua.»

      La sera l'aia si riempie di gente con secchi e sacchi bagnati. I
      fittavoli tacciono davanti alla striscia, quasi tutta loro, perché la
      Dama ha già pagato a ciascuno quello che il fuoco gli toglie.

      {natura Media} Il vento di Laresh viene da sud e fino a mezzanotte
      spinge il fuoco verso il grano nero, poi gira verso le case.

      {origine figlio-del-circolo} Il Circolo brucia il sottobosco una
      striscia alla volta e controvento, mentre qui lo fanno d'estate con il
      grano in piedi.
    opzioni:
      - testo: "Guidare la catena dei secchi"
        descrizione: "Dal rio al bordo della striscia ci vogliono quaranta persone in fila, che reggano quando il fuoco si alza."
        prova: { attributo: sociale, abilita: [persuasione, intimidire], difficolta: Media }
        successo:
          titolo: La catena
          testo: |
            Metti i più forti vicino all'acqua e i più svelti vicino al fuoco, e
            la catena regge per tutta la notte, con il fuoco chiuso nella striscia
            come un cane alla catena. All'alba il grano buono è intatto.
          pe: { persuasione: 3 }
          effetti: { rep.laresh: 0.5 }
          segue: laresh-il-tubo-nella-cenere
        fallimento:
          titolo: Il pagliaio
          testo: |
            A metà notte due ragazzi lasciano il secchio per guardare il fuoco, e
            una favilla passa il rio e brucia un pagliaio dei Vardo fino all'alba.
            Il grano buono si salva, ma l'aia si ricorda chi teneva la catena.
          effetti: { scandalo: 0.5 }
          segue: laresh-il-tubo-nella-cenere
      - testo: "Scegliere il momento giusto con il vento"
        descrizione: "Il fuoco va acceso quando il vento spinge verso il nero, e spento prima che giri."
        prova: { attributo: mentale, abilita: natura, difficolta: Media }
        successo:
          titolo: Il vento del sud
          testo: |
            Con un fazzoletto bagnato alzato sopra la testa aspetti che il vento
            si faccia costante, e al tuo segnale il fuoco corre verso nord e
            brucia la striscia prima di mezzanotte. Quando il vento gira trova
            soltanto cenere, e il grano buono è intatto.
          pe: { natura: 3 }
          effetti: { rep.laresh: 0.5 }
          segue: laresh-il-tubo-nella-cenere
        fallimento:
          titolo: Il fumo addosso
          testo: |
            Dai il segnale troppo presto e il fumo ti torna addosso per mezz'ora
            prima che il fuoco vada a nord. All'alba il grano buono è intatto, e
            tu hai la testa piena di cenere.
          effetti: { tormento: 0.5, ferite: 0.5 }
          segue: laresh-il-tubo-nella-cenere
      - testo: "Tagliare a mano il bordo della striscia"
        descrizione: "Un fuoco senza niente da bruciare si ferma, e prima di sera si possono tagliare venti passi di grano."
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Media }
        successo:
          titolo: Il bordo tagliato
          testo: |
            Passi il pomeriggio a falciare il bordo della striscia con i mietitori
            più vecchi, e la notte il fuoco arriva al taglio e si ferma lì.
            All'alba hai le mani piene di vesciche, e il grano buono è intatto.
          pe: { atletica: 3 }
          effetti: { rep.laresh: 0.5 }
          segue: laresh-il-tubo-nella-cenere
        fallimento:
          titolo: La falce
          testo: |
            La falce ti apre il polpaccio, e una donna ti fascia con il grembiule
            brontolando. Il bordo lo tagliano gli altri, e il grano buono si salva
            mentre tu guardi il fuoco seduto su una botte.
          effetti: { ferite: 0.5, tormento: 0.5 }
          segue: laresh-il-tubo-nella-cenere
      - testo: "Bruciare come brucia il Circolo"
        descrizione: "Una striscia alla volta, controvento, con la terra bagnata davanti. È lento, e il fuoco non scappa."
        quando: [origine.figlio-del-circolo >= 1]
        esito:
          titolo: Controvento
          testo: |
            Fai bagnare una fascia di terra lungo il rio e accendi controvento, un
            tratto alla volta, come nel Bosco. Il fuoco cammina basso invece di
            correre, e i vecchi di Laresh lo guardano con un rispetto che non si
            aspettavano. All'alba il grano buono è intatto.
          pe: { natura: 3 }
          effetti: { rep.laresh: 0.5 }
          segue: laresh-il-tubo-nella-cenere

  - id: laresh-il-tubo-nella-cenere
    presso: laresh
    immagine: ambientazione/rovine-dei-precursori
    titolo: Il tubo nella cenere
    tipo: seguito
    luogo: Laresh, la striscia bruciata, all'alba
    area: superficie-fratturata
    requisiti: [fazione.laresh == 6]
    testo: |
      All'alba la striscia bruciata fuma ancora. A metà strada fra il confine
      e il mulino la terra si è spaccata per il calore, e nella crepa affiora
      il dorso di un tubo liscio e grigio, largo quanto una coscia, che corre
      sotto il campo verso il mulino centrale. Dove una pietra l'ha incrinato,
      dentro c'è un fango scuro che puzza di ferro.

      Un ragazzo ci rovescia sopra un secchio d'acqua, che sparisce nella
      cenere senza fumo, come in una spugna asciutta.

      {tecnologia Media} È un metallo che sembra vetro e non ha preso il nero
      del fuoco. Quelli di prima ci facevano i condotti.

      Old Marrek arriva sottobraccio a Tano e si inginocchia nella cenere, il
      palmo aperto sulla terra come sulla macina e la faccia rivolta al
      mulino.
    opzioni:
      - testo: "Staccarne un pezzo da portare a Oda Krell"
        descrizione: "Cahir dice che la vecchia delle terrazze apre le cose di quelli di prima meglio di chiunque."
        esito:
          titolo: Il pezzo nella tela
          testo: |
            Stacchi con lo scalpello un pezzo incrinato e lo avvolgi in una tela
            cerata. Cahir ti dice che sulle terrazze vive Oda Krell, una
            Raschiatrice vecchia con una gamba di legno che queste cose le apre, e
            intanto Marrek non si rialza finché Tano non lo tira per la manica.
          effetti: { fazione.laresh: 1, rep.laresh: 0.5 }
      - testo: "Seguirne il dorso fino al mulino"
        descrizione: "Sopra il tubo la terra è più secca, e si può seguire a passi fino a dove va."
        prova: { attributo: mentale, abilita: percezione, difficolta: Media }
        successo:
          titolo: Sotto il basamento
          testo: |
            La striscia di terra secca va dritta al mulino centrale e ci passa
            sotto, dove le pietre del basamento sono più vecchie. Stacchi un pezzo
            incrinato e lo avvolgi nella tela, e Cahir ti indica la strada per la
            baracca di Oda Krell, sulle terrazze, che queste cose le apre.
          pe: { percezione: 3 }
          effetti: { fazione.laresh: 1, rep.laresh: 0.5 }
        fallimento:
          titolo: La terra secca
          testo: |
            A metà strada la terra secca si perde nella cenere, e giri in tondo
            per un'ora sotto gli occhi del villaggio. Alla fine stacchi un pezzo
            di tubo, e Cahir ti indica la baracca di Oda Krell, sulle terrazze.
          effetti: { fazione.laresh: 1, scandalo: 0.5 }

  # ------------------------------------------------------------ 7 → 8 · quelli di prima bevono
  - id: laresh-quelli-di-prima-bevono
    presso: baracca-di-oda
    immagine: ambientazione/orlo-dei-rottami
    titolo: Quelli di prima bevono
    sommario: "Oda Krell gratta il fango dal pezzo di tubo, e viene via a strati come gli anelli di un albero."
    luogo: La baracca di Oda Krell, accanto alla stufa
    area: superficie-fratturata
    requisiti: [fazione.laresh == 7]
    testo: |
      Nella baracca di Oda Krell la stufa è accesa anche con il sole a picco,
      e sul coperchio bolle un pentolino di cicoria bruciata. Oda gira il
      pezzo di tubo verso la luce e bussa due volte con le nocche sulla gamba
      di legno, intagliata con una fila di lepri che corrono verso il piede.

      «Questo è di quelli di prima» dice. «L'hai capito anche tu, dico bene?»

      Con la punta del coltello gratta il fango dall'interno, che viene via a
      strati sottili come gli anelli di un albero tagliato. Ne conta una
      ventina e smette.

      «Un pozzo tira su l'acqua» dice. «Questo tirava giù.»

      {tecnologia Media} Dentro corrono nervature a spirale, come la
      filettatura di una vite, che spingono quello che c'è dentro da una
      parte sola.

      {origine allievo-di-torvessa} Il metallo che sembra vetro l'hai visto
      nelle vetrine dell'Accademia, sotto un cartellino di Orvald Temmerin
      che diceva soltanto *condotto*.
    opzioni:
      - testo: "Aprire il tubo con Oda"
        descrizione: "Oda ha gli attrezzi, e due mani in più le fanno comodo per guardare dentro le nervature."
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Media }
        successo:
          titolo: Il filo che pulsa
          testo: |
            Oda apre il tubo per il lungo nella morsa che tieni ferma, e fra le
            nervature corre un filo di metallo chiaro che, scaldato, pulsa piano come
            un polso. «Vive ancora, e tira giù verso il vostro mulino» dice. «Andate a
            guardare sotto la macina, dico bene?»
          pe: { tecnologia: 3 }
          effetti: { fazione.laresh: 1, rep.laresh: 0.5 }
        fallimento:
          titolo: Lo schizzo
          testo: |
            La lama di Oda scivola e il tubo ti sputa in faccia un getto di fango che sa di ferro.
            Oda ride fino a doversi sedere, poi ti pulisce con lo straccio della stufa e ti dice che
            quella roba tira giù verso il vostro mulino, e che sotto la macina c'è da guardare.
          effetti: { fazione.laresh: 1, contaminazione: 0.5 }
      - testo: "Chiederle se qualcuno le aveva già portato pezzi così"
        descrizione: "Oda ha visto passare dalla sua baracca tutto quello che la Superficie restituisce. Basta farla parlare."
        prova: { attributo: sociale, abilita: [empatia, conoscenze-della-strada], difficolta: Media }
        successo:
          titolo: Il mugnaio di trent'anni fa
          testo: |
            Trent'anni fa, ti racconta Oda versando la cicoria, un mugnaio di Laresh le portò un pezzo uguale e la
            pagò per dimenticare che tirava giù. «Io non dimentico niente» dice, battendo le nocche sulla gamba di
            legno. «Guarda sotto la macina, dico bene?»
          pe: { empatia: 3 }
          effetti: { fazione.laresh: 1, rep.laresh: 0.5 }
        fallimento:
          titolo: Le lepri
          testo: |
            Oda ti racconta una per una le lepri sulla gamba e chi gliele ha
            intagliate, poi ti chiede di traverso se ti manda la Gilda. Alla fine
            ti dice soltanto che il tubo tira verso il mulino, e che sotto la
            macina c'è da guardare.
          effetti: { fazione.laresh: 1, sospetto: 0.5 }
      - testo: "Pagarle la cicoria e lasciarla lavorare"
        descrizione: "Oda lavora meglio senza domande, e ci vuole un pomeriggio e qualche moneta."
        requisiti: [monete >= 5]
        costo: 2
        esito:
          titolo: Il pomeriggio alla stufa
          testo: |
            Lasci qualche moneta sul banco e bevi cicoria bruciata accanto alla
            porta mentre lei lavora. Al tramonto sul banco c'è una freccia di
            carbone che punta verso Laresh. «Tira verso il vostro mulino, dico
            bene?» dice Oda, e batte il dito sulla punta, dove ha scritto
            *macina*.
          effetti: { monete: -5, fazione.laresh: 1 }
      - testo: "Riconoscere il metallo dei condotti"
        descrizione: "All'Accademia questo metallo l'hai visto sotto vetro. Le nervature a spirale dicono che cosa ci correva dentro."
        quando: [origine.allievo-di-torvessa >= 1]
        esito:
          titolo: Il cartellino di Orvald
          testo: |
            Le dici che all'Accademia questi condotti stanno nelle vetrine, e che
            le spirali spingono il liquido in un senso solo. Oda ti fa tenere il
            tubo mentre lo apre, e dentro corre un filo chiaro che pulsa quando lo
            scaldi. «Tira giù verso il vostro mulino, e bisogna guardare sotto la
            macina» dice.
          pe: { tecnologia: 3 }
          effetti: { fazione.laresh: 1, rep.laresh: 0.5 }

  # ------------------------------------------------------------ 8 → 9 · l'assemblea dell'aia (grado 3)
  - id: laresh-l-assemblea-dell-aia
    presso: laresh
    immagine: ambientazione/laresh
    titolo: L'assemblea dell'aia
    sommario: "Per guardare sotto la macina bisogna fermare il mulino a due settimane dalla mietitura, e Marrek dice di no."
    luogo: Laresh, l'aia di Casa Velar, la sera
    area: superficie-fratturata
    requisiti: [fazione.laresh == 8]
    testo: |
      La sera la Dama fa portare le panche sull'aia, e Laresh ci si siede
      sopra per famiglie. Sul tavolo sotto il portico ci sono il libro dei
      conti e il pezzo di tubo nella tela. Old Marrek siede in prima fila
      con le mani sulle ginocchia, e Tano gli sta accanto.

      Bisogna fermare il mulino centrale e aprire il pavimento sotto la
      macina, e a due settimane dalla mietitura vuol dire grano ammucchiato
      nei granai e pane che arriva tardi in città. Lo dice il fattore a voce
      alta, e molti annuiscono.

      «La macina non si ferma da quarant'anni» dice Marrek. «Non la fermo
      adesso per guardarci sotto.» Lo dice tranquillo, come si dice il tempo
      di domani, e l'aia tace.

      {empatia Media} A macina ferma, Marrek il battito lo sentirebbe da
      solo, senza niente a coprirlo, ed è di questo che ha paura.

      {politica-ed-economia Media} Una settimana di mulino fermo costa meno
      di un raccolto perso, e nessuno sull'aia vuole fare il conto ad alta
      voce.

      La Dama ti guarda e apre il libro alla pagina bianca.

      {origine figlio-della-citta-bassa} In Città Bassa le assemblee
      finiscono a pugni o in osteria, mentre qui la gente aspetta che parli
      chi ne ha diritto.
    opzioni:
      - testo: "Parlare all'assemblea"
        descrizione: "Il villaggio ha paura per il pane. Bisogna parlargli del pane, e del raccolto di primavera."
        prova: { attributo: sociale, abilita: persuasione, difficolta: Media }
        successo:
          titolo: Il pane di primavera
          testo: |
            Parli del pane che mancherà a primavera con le parole di Marrek, e
            alla fine nessuno annuisce più al fattore. La Dama fa firmare la
            decisione a tre fittavoli e ti dà la chiave della stanza sopra il
            granaio, e sotto il tavolo una borsa di monete. «Da stasera all'aia
            parlate anche voi» dice.
          pe: { persuasione: 3 }
          almeno: { rep.laresh: 6 }
          effetti: { fazione.laresh: 1, monete: 90 }
        fallimento:
          titolo: Le parole della città
          testo: |
            Parli troppo a lungo e con parole di città, e i braccianti in fondo
            cominciano a chiacchierare. Alla fine è la Dama a dire che il mulino
            si ferma domani al tramonto, e ti dà la chiave della stanza sopra il
            granaio e una borsa di monete, con il consiglio di parlare meno.
          almeno: { rep.laresh: 6 }
          effetti: { fazione.laresh: 1, monete: 90, scandalo: 0.5 }
      - testo: "Convincere Marrek prima che parli"
        descrizione: "Se il vecchio cede, il villaggio lo segue. Bisogna parlargli a parte, di quello che teme davvero."
        prova: { attributo: sociale, abilita: empatia, difficolta: Media }
        successo:
          titolo: In due
          testo: |
            Dici piano a Marrek che quella notte resterai al mulino con lui, e il
            vecchio ti tiene il polso a lungo, poi dice all'aia che la macina si
            può fermare. La Dama ti dà la chiave della stanza sopra il granaio e
            una borsa di monete. «Da stasera all'aia parlate anche voi» dice.
          pe: { empatia: 3 }
          almeno: { rep.laresh: 6 }
          effetti: { fazione.laresh: 1, monete: 90 }
        fallimento:
          titolo: Il polso
          testo: |
            Marrek ti cerca il polso e lo lascia andare subito, scontento di
            quello che ci ha sentito, e resta zitto per tutta l'assemblea. La Dama
            decide da sola che il mulino si ferma domani al tramonto, e ti dà lo
            stesso la chiave della stanza sopra il granaio e una borsa di monete.
          almeno: { rep.laresh: 6 }
          effetti: { fazione.laresh: 1, monete: 90, tormento: 0.5 }
      - testo: "Mettere il tubo sul tavolo e fare i conti"
        descrizione: "A Laresh i conti convincono più delle parole, e c'è anche il pezzo di tubo."
        prova: { attributo: mentale, abilita: [politica-ed-economia, accademiche], difficolta: Media }
        successo:
          titolo: I conti sull'aia
          testo: |
            Fai passare il tubo fra le panche e leggi dal libro quanto grano si è
            perso in tre anni e quanto ne costa una settimana di mulino fermo, e i
            fittavoli fanno i conti con le dita. La Dama ti dà la chiave della
            stanza sopra il granaio e una borsa di monete.
          pe: { politica-ed-economia: 3 }
          almeno: { rep.laresh: 6 }
          effetti: { fazione.laresh: 1, monete: 90 }
        fallimento:
          titolo: Il tubo che passa di mano
          testo: |
            Un bambino fa cadere il pezzo di tubo e ne esce il fango scuro, e
            mentre le madri portano via i figli i tuoi conti non li ascolta più
            nessuno. La Dama decide da sola che il mulino si ferma domani al
            tramonto, e ti dà la chiave della stanza sopra il granaio e una borsa
            di monete.
          almeno: { rep.laresh: 6 }
          effetti: { fazione.laresh: 1, monete: 90, scandalo: 0.5 }
      - testo: "Lasciare la parola a Ilio"
        descrizione: "Ilio Vardo è rimasto per la mietitura, e i ragazzi del villaggio ascoltano lui più dei vecchi."
        quando: [laresh.ilio == 1]
        esito:
          titolo: Il campo di suo padre
          testo: |
            Ilio si alza con le orecchie rosse e dice che il campo di suo padre è
            mezzo nero, e che se il mulino deve fermarsi per salvare l'altra metà
            si ferma. I ragazzi gli danno ragione, e la Dama ti dà la chiave della
            stanza sopra il granaio e una borsa di monete.
          almeno: { rep.laresh: 6 }
          effetti: { fazione.laresh: 1, monete: 90 }
      - testo: "Leggere all'aia la lettera di Ilio dalla Cicatrice"
        descrizione: "Ilio Vardo ha scritto dalla Cicatrice, e sua madre, che non sa leggere, ti chiede di leggere la lettera."
        quando: [laresh.ilio == 2]
        esito:
          titolo: La lettera dal Grifone
          testo: |
            Ilio scrive che in Cicatrice, quando una vena ronza, la squadra smette
            di lavorare e ascolta, anche se costa un turno. L'aia ci pensa, e la
            Dama scrive che il mulino si ferma domani al tramonto. Ti dà la chiave
            della stanza sopra il granaio e una borsa di monete.
          almeno: { rep.laresh: 6 }
          effetti: { fazione.laresh: 1, monete: 90 }

  # ------------------------------------------------------------ 9 → 10 · la notte dei fuochi (il segno della Campana)
  - id: laresh-la-notte-dei-fuochi
    presso: laresh
    immagine: ambientazione/laresh
    titolo: La notte dei fuochi
    sommario: "Il mulino centrale si ferma, e a mezzanotte i fuochi azzurri sopra i campi si mettono in fila."
    luogo: Laresh, il mulino centrale e i campi, a macina ferma
    area: superficie-fratturata
    requisiti: [fazione.laresh == 9]
    testo: |
      La macina si ferma al tramonto. Marrek toglie la mano dall'incastellatura
      come se scottasse, e per la prima volta da quarant'anni a Laresh si sente
      soltanto il rio. Anche i cani di Cahir, stanotte, non ululano.

      A mezzanotte sopra i campi si accendono i fuochi azzurri e scivolano uno
      verso l'altro, fino a mettersi in file lunghe e dritte, parallele come i
      solchi di un campo arato. Puntano tutte a nord, appena piegate a levante,
      e restano ferme per il tempo che ci vuole a cuocere un pane.

      {percezione Media} Le file puntano dalla parte verso cui ululano i cani
      di Cahir fra mezzanotte e le tre.

      {resilienza Media fallita} Ti accorgi di avere fatto tre passi verso la
      fila più vicina senza averlo deciso, e Tano ti tira per la manica.

      Poi i fuochi si spengono a gruppi, campo dopo campo, finché ne resta una
      fila sola, che dalla striscia bruciata scende lungo il rio fino alla
      ruota ferma e si spegne contro la macina, un fuoco alla volta. Nel buio
      del mulino Marrek ha di nuovo la mano sul legno. «L'altro battito non si
      è fermato» dice. «Va più svelto.»
    opzioni:
      - testo: "Segnare la direzione delle file sul libro della Dama"
        descrizione: "Le file stanno ferme il tempo di cuocere un pane, e basta un punto di riferimento."
        prova: { attributo: mentale, abilita: [percezione, accademiche], difficolta: Media }
        successo:
          titolo: La riga sul libro
          testo: |
            Con il comignolo di Casa Velar alle spalle tiri sul retro del libro
            della Dama una riga che punta dove ululano i cani di Cahir. Poi Tano
            vi porta sotto la macina e solleva una botola di assi coperta di
            sacchi, sopra una scala di pietra.
          pe: { percezione: 3 }
          effetti: { fazione.laresh: 1, rep.laresh: 0.5 }
        fallimento:
          titolo: La riga storta
          testo: |
            A metà ti volti a guardare la fila più vicina e la mano continua da
            sola, e sul libro della Dama resta una curva che non vuol dire niente.
            Tano vi porta sotto la macina e solleva una botola di assi coperta di
            sacchi, e sotto c'è una scala di pietra.
          effetti: { fazione.laresh: 1, tormento: 0.5 }
      - testo: "Restare con Marrek alla macina ferma"
        descrizione: "All'assemblea glielo hai promesso, o qualcuno doveva farlo. Il vecchio non vuole sentirlo da solo."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Media }
        successo:
          titolo: Il battito svelto
          testo: |
            Con la mano sul legno accanto alla sua senti il battito di sotto
            accelerare mentre i fuochi stanno in fila, e rallentare senza fermarsi
            quando si spengono. Marrek ti stringe il polso e dice a Tano di
            mostrarti la botola sotto i sacchi, sopra una scala di pietra.
          pe: { resilienza: 3 }
          effetti: { fazione.laresh: 1, rep.laresh: 0.5 }
        fallimento:
          titolo: Il legno che trema
          testo: |
            Il battito di sotto ti entra nel braccio e non se ne va più, nemmeno
            quando togli la mano, e resti seduto per terra a tremare fino
            all'alba. Allora Tano sposta i sacchi sotto la macina e solleva una
            botola, e sotto c'è una scala di pietra.
          effetti: { fazione.laresh: 1, tormento: 1 }
      - testo: "Seguire l'ultima fila fino alla ruota"
        descrizione: "Una fila sola scende lungo il rio verso il mulino. Si può camminarle accanto, piano, senza toccarla."
        prova: { attributo: fisico, abilita: [furtivita, atletica], difficolta: Media }
        successo:
          titolo: La crepa nel pavimento
          testo: |
            Cammini accanto all'ultima fila lungo il rio, sentendone il freddo
            sulla guancia, e nel mulino la vedi spegnersi in una crepa sotto la
            macina. Lì Tano scopre sotto i sacchi una botola di assi, sopra una
            scala di pietra che i mugnai non usano da quando è nato.
          pe: { furtivita: 3 }
          effetti: { fazione.laresh: 1, rep.laresh: 0.5 }
        fallimento:
          titolo: Il freddo sulla mano
          testo: |
            Un fuoco ti passa sul dorso della mano, freddo come la neve, e il
            freddo ti resta nelle dita fino al mattino. Dentro il mulino Tano
            sposta i sacchi sotto la macina e solleva una botola, e sotto c'è una
            scala di pietra.
          effetti: { fazione.laresh: 1, ferite: 0.5, tormento: 0.5 }
      - testo: "Fischiare ai fuochi con il fischietto di Cahir"
        descrizione: "Corin li chiamava con il fischio dei cani, e il fischietto d'osso di Cahir forse lo sentono meglio."
        requisiti: [oggetto.laresh-fischietto-d-osso >= 1]
        esito:
          titolo: Le due note
          testo: |
            Al fischietto d'osso i fuochi della fila più vicina si girano un poco
            verso di te, poi tornano a puntare dove puntavano. Tano ride e dice
            che sei come il mercante del fosso, e quando l'ultima fila si spegne
            solleva la botola sotto la macina, sopra una scala di pietra.
          effetti: { fazione.laresh: 1, rep.laresh: 0.5 }
