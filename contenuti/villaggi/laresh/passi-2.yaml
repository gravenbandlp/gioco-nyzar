# La quest di Laresh, Atto III e inizio dell'Atto IV (fazione.laresh 6 → 10).
# - 6 → 7 `laresh-il-nero-passa-il-rio` (Casa Velar) e il seguito `laresh-il-tubo-nella-cenere`: il grano nero passa
#   il rio di mezzo, la Dama fa bruciare una striscia di campi; nella cenere affiora il dorso di un tubo di quelli di
#   prima che corre verso il mulino centrale. Opzione d'origine del Figlio del Circolo (il fuoco controvento).
# - 7 → 8 `laresh-quelli-di-prima-bevono` (la baracca di Oda Krell): Oda apre il pezzo di tubo, che tira giù invece
#   che su. Opzione d'origine dell'Allievo di Torvessa.
# - 8 → 9 `laresh-l-assemblea-dell-aia` (grado 3, Voce dell'aia): il villaggio decide di fermare la macina di Marrek
#   per aprire il pavimento. Con laresh.ilio 1 parla Ilio, con 2 arriva la sua lettera dalla Cicatrice.
# - 9 → 10 `laresh-la-notte-dei-fuochi`: il segno della Campana. A macina ferma i fuochi azzurri si mettono in file
#   parallele che puntano tutte verso lo stesso punto oltre l'orizzonte, a nord appena piegato a levante; poi resta
#   una fila sola, che si spegne contro la macina. Nessuno spiega che cosa sia. Tano mostra la botola dei mugnai.
storylet:
  # ------------------------------------------------------------ 6 → 7 · il nero passa il rio
  - id: laresh-il-nero-passa-il-rio
    presso: laresh
    immagine: ambientazione/laresh
    titolo: Il nero passa il rio
    sommario: "La Dama ha deciso di bruciare una striscia di campi prima che il vento giri."
    luogo: Laresh, i campi lungo il rio di mezzo, di notte
    area: superficie-fratturata
    requisiti: [fazione.laresh == 6]
    testo: |
      Una mattina Tano arriva di corsa a Casa Velar con una spiga nera strappata sulla riva sud del rio di
      mezzo. La spiga è nera fino al gambo, e i chicchi sono vuoti e si rompono fra le dita. La Dama la guarda
      a lungo, poi apre il libro e tira con il righello d'ottone una riga lungo il rio, che taglia in due la
      pagina dei campi di mezzo.

      «Si brucia» dice. «Stanotte, prima che il vento giri. Una striscia larga venti passi dal mulino al
      confine, e il grano buono resta di qua.»

      La sera l'aia si riempie di gente con secchi e sacchi bagnati. I secchi sono di doghe cerchiate di
      ferro, e sotto ogni mucchio di sacchi l'acqua che gocciola fa una pozza scura sulle pietre. Dal rio
      arriva il verso delle rane, e arriva soltanto dalla sponda del grano buono.

      {natura Media} Il vento di Laresh viene da sud, e fino a mezzanotte spingerà il fuoco verso il grano
      nero. Dopo gira e lo spinge verso le case.

      Ilio Vardo, o un ragazzo che gli somiglia, ti mette in mano una torcia spenta e ti chiede dove deve
      stare.

      {origine figlio-del-circolo} Il Circolo brucia il sottobosco controvento a fine inverno, con l'acqua
      pronta. Qui lo fanno d'estate con il grano in piedi.
    opzioni:
      - testo: "Guidare la catena dei secchi"
        descrizione: "Dal rio al bordo della striscia ci vogliono quaranta persone in fila."
        prova: { attributo: sociale, abilita: [persuasione, intimidire], difficolta: Media }
        successo:
          titolo: La catena
          testo: |
            Metti in fila quaranta persone dal rio al bordo della striscia, le più forti vicino all'acqua e le
            più svelte vicino al fuoco, e quando il grano prende fuoco la catena regge. I secchi passano di
            mano in mano per tutta la notte, e il fuoco resta nella striscia come un cane alla catena. Verso
            l'alba nessuno parla più, e si sente soltanto l'acqua che passa da un secchio all'altro. All'alba
            la striscia è nera e fuma, e il grano buono di qua dal rio è intatto.
          pe: { persuasione: 3 }
          effetti: { rep.laresh: 0.5 }
          segue: laresh-il-tubo-nella-cenere
        fallimento:
          titolo: Il pagliaio
          testo: |
            La catena si rompe a metà notte, quando il fuoco si alza e due ragazzi lasciano il secchio per
            guardarlo. Una favilla passa il rio e prende un pagliaio dei Vardo, che brucia fino all'alba
            davanti a tutto il villaggio. Verso le tre il pagliaio crolla su sé stesso, e le faville salgono
            in colonna sopra i tetti. Il grano buono si salva lo stesso, e la gente sull'aia si ricorda bene
            chi teneva la catena.
          effetti: { scandalo: 0.5 }
          segue: laresh-il-tubo-nella-cenere
      - testo: "Scegliere il momento giusto con il vento"
        descrizione: "Il fuoco va acceso quando il vento spinge verso il nero, e spento prima che giri."
        prova: { attributo: mentale, abilita: natura, difficolta: Media }
        successo:
          titolo: Il vento del sud
          testo: |
            Stai sul bordo della striscia con un fazzoletto bagnato alzato sopra la testa, e quando il
            fazzoletto si stende verso nord e resta teso dai il segnale. Il fuoco corre verso nord come se
            avesse fretta di arrivare, e brucia la striscia da un capo all'altro prima di mezzanotte. Quando
            il vento gira trova soltanto cenere. All'alba il grano buono di qua dal rio è intatto.
          pe: { natura: 3 }
          effetti: { rep.laresh: 0.5 }
          segue: laresh-il-tubo-nella-cenere
        fallimento:
          titolo: Il fumo addosso
          testo: |
            Dai il segnale troppo presto, con il vento ancora incerto, e il fumo ti torna addosso per mezz'ora
            prima che il fuoco si decida ad andare a nord. Il fumo del grano nero è più denso di quello della
            paglia, e ti lascia sulla lingua una patina che l'acqua non porta via. Passi la notte a tossire
            con gli occhi che bruciano. All'alba il grano buono è intatto, e a te sembra di avere la testa
            piena di cenere.
          effetti: { tormento: 0.5, ferite: 0.5 }
          segue: laresh-il-tubo-nella-cenere
      - testo: "Tagliare a mano il bordo della striscia"
        descrizione: "Un fuoco senza niente da bruciare si ferma. Venti passi di grano tagliato a terra prima di sera, a colpi di falce."
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Media }
        successo:
          titolo: Il bordo tagliato
          testo: |
            Passi il pomeriggio con la falce in mano insieme ai mietitori più vecchi, a tagliare il grano sul
            bordo della striscia e a portarlo via a bracciate. Il manico della falce è scuro e liscio nei due
            punti dove le mani l'hanno tenuto per anni. La notte il fuoco arriva al taglio e si ferma lì,
            senza niente da mangiare. All'alba hai le mani piene di vesciche, e il grano buono di qua dal rio
            è intatto.
          pe: { atletica: 3 }
          effetti: { rep.laresh: 0.5 }
          segue: laresh-il-tubo-nella-cenere
        fallimento:
          titolo: La falce
          testo: |
            A metà pomeriggio la falce ti scappa di mano e ti apre il polpaccio, e una donna ti fascia la
            gamba con il grembiule senza smettere di brontolare. Il grembiule sa di lievito e in pochi minuti
            diventa rosso da una parte all'altra. La notte guardi il fuoco sedut{o|a} su una botte. Il bordo
            che non hai tagliato lo hanno tagliato gli altri, e il grano buono si salva lo stesso.
          effetti: { ferite: 0.5, tormento: 0.5 }
          segue: laresh-il-tubo-nella-cenere
      - testo: "Bruciare come brucia il Circolo"
        descrizione: "Una striscia alla volta, controvento, con la terra bagnata davanti."
        quando: [origine.figlio-del-circolo >= 1]
        esito:
          titolo: Controvento
          testo: |
            Fai bagnare una fascia di terra lungo il rio e accendi il fuoco controvento, un tratto alla volta,
            come ti hanno insegnato nel Bosco. Quando la fiamma arriva alla terra bagnata sfrigola e si piega
            indietro sul grano nero. Il fuoco cammina basso e lento invece di correre, e i vecchi di Laresh lo
            guardano con un rispetto che non si aspettavano di provare. All'alba la striscia è nera, e il
            grano buono di qua dal rio è intatto.
          pe: { natura: 3 }
          effetti: { rep.laresh: 0.5 }
          segue: laresh-il-tubo-nella-cenere

  - id: laresh-il-tubo-nella-cenere
    presso: laresh
    immagine: ambientazione/rovine-dei-precursori
    titolo: Il tubo nella cenere
    tipo: seguito
    luogo: Laresh, la striscia bruciata, all'alba
    area: superficie-fratturata
    requisiti: [fazione.laresh == 6]
    testo: |
      All'alba la striscia bruciata fuma ancora, e il fondo dei solchi è caldo sotto gli stivali. A metà
      strada fra il confine e il mulino la terra si è spaccata per il calore, e nella crepa affiora il dorso
      di un tubo liscio e grigio che corre sotto il campo verso il mulino centrale. Per tutto il tratto che si
      vede non ha una giuntura. Il fuoco gli è passato sopra tutta la notte e non ha lasciato un velo di
      fuliggine. Dove una pietra l'ha incrinato, dentro c'è un fango scuro che puzza di ferro.

      Un ragazzo ci rovescia sopra un secchio d'acqua per raffreddarlo, e l'acqua sparisce nella cenere senza
      fumo. Ci appoggi il dorso della mano, e il metallo è più fresco della terra che ha intorno. Ti dici che
      il fuoco è passato in fretta e che sotto terra il fresco della notte resta a lungo.

      {medicina Media} L'odore di ferro è quello del sangue vecchio, quando resta per giorni in una benda che
      nessuno cambia.

      Le cornacchie scendono sulla striscia a cercare i chicchi tostati, e si posano dappertutto tranne che
      sul tratto sopra il tubo. Old Marrek arriva sottobraccio a Tano e si inginocchia ad appoggiare il palmo
      sul tubo, come fa con la macina. Resta così a lungo, con la faccia rivolta al mulino.
    opzioni:
      - testo: "Staccarne un pezzo da portare a Oda Krell"
        descrizione: "Cahir dice che la vecchia delle terrazze apre le cose di quelli di prima meglio di chiunque in città."
        esito:
          titolo: Il pezzo nella tela
          testo: |
            Stacchi con lo scalpello un pezzo incrinato lungo un palmo e lo avvolgi in una tela cerata. La
            lama scivola sul metallo senza intaccarlo, e il pezzo viene via soltanto lungo la crepa che c'era
            già. Cahir ti dice che sulla Superficie, in una piega delle terrazze, vive Oda Krell, una
            Raschiatrice vecchia con una gamba di legno che queste cose le apre. Marrek non si rialza finché
            Tano non lo tira su per la manica.
          effetti: { fazione.laresh: 1, rep.laresh: 0.5 }
      - testo: "Seguirne il dorso fino al mulino"
        descrizione: "Il tubo corre sotto il campo, e la terra sopra è più secca."
        prova: { attributo: mentale, abilita: percezione, difficolta: Media }
        successo:
          titolo: Sotto il basamento
          testo: |
            Segui la striscia di terra secca a passi contati. È larga un palmo e dritta come la riga che la
            Dama tira con il righello, e il dorso del tubo va verso il mulino centrale e ci passa sotto, dove
            le pietre del basamento sono più vecchie. Quelle pietre sono squadrate meglio di quelle sopra e
            stanno insieme senza calce. Stacchi con lo scalpello un pezzo incrinato e lo avvolgi nella tela.
            Cahir ti indica la strada per la baracca di Oda Krell, sulle terrazze, che queste cose le apre.
          pe: { percezione: 3 }
          effetti: { fazione.laresh: 1, rep.laresh: 0.5 }
        fallimento:
          titolo: La terra secca
          testo: |
            La striscia di terra secca a metà strada si perde nella cenere, e tu giri in tondo per un'ora
            mentre il villaggio ti guarda dall'aia. La cenere ti arriva alle caviglie e ricopre i tuoi passi
            appena li fai. Alla fine stacchi un pezzo di tubo e lo avvolgi nella tela, e Cahir ti indica la
            strada per la baracca di Oda Krell, sulle terrazze.
          effetti: { fazione.laresh: 1, scandalo: 0.5 }

  # ------------------------------------------------------------ 7 → 8 · quelli di prima bevono
  - id: laresh-quelli-di-prima-bevono
    presso: baracca-di-oda
    immagine: ambientazione/orlo-dei-rottami
    titolo: Quelli di prima bevono
    sommario: "Oda Krell gira il pezzo di tubo fra le mani vicino alla stufa. Dentro il fango è a strati, come gli anelli di un albero."
    luogo: La baracca di Oda Krell, accanto alla stufa
    area: superficie-fratturata
    requisiti: [fazione.laresh == 7]
    testo: |
      Nella baracca di Oda Krell la stufa è accesa anche con il sole a picco, e sul coperchio bolle la cicoria
      bruciata. Le pareti sono lamiere di recupero inchiodate su pali, e ogni lamiera ha una ruggine diversa.
      Oda gira il pezzo di tubo verso la luce della porta. Poi bussa due volte con le nocche sulla gamba di
      legno, intagliata con una fila di lepri.

      «Questo è di quelli di prima» dice. «L'hai capito anche tu, dico bene?»

      Con la punta del coltello gratta il fango scuro dall'interno, che viene via a strati sottili come gli
      anelli di un albero. Il tubo è stato tutta la mattina sul banco accanto alla stufa, e quando Oda te lo
      passa è ancora freddo.

      «Un pozzo tira su l'acqua» dice. «Questo invece tirava giù, lo vedi da come si sono messi gli strati.»

      {tecnologia Media} Dentro il tubo corrono nervature a spirale che spingono tutto da una parte sola. Il
      passo delle spirali è identico da un capo all'altro del pezzo, e nessuna lima che conosci lavora così
      regolare.

      {origine allievo-di-torvessa} Il metallo che sembra vetro l'hai visto nelle vetrine dell'Accademia, con
      un cartellino di Orvald Temmerin che diceva soltanto *condotto*.
    opzioni:
      - testo: "Aprire il tubo con Oda"
        descrizione: "Oda ha gli attrezzi, e due mani in più le fanno comodo."
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Media }
        successo:
          titolo: Il filo che pulsa
          testo: |
            Tieni fermo il tubo nella morsa mentre Oda lo apre per il lungo con una lama sottile. La morsa è
            di ferro nero, e la ghiera stride a ogni giro che le dai. Fra le nervature corre un filo di
            metallo chiaro, e quando Oda ci avvicina la stufa il filo pulsa piano, a tempo, come un polso. Oda
            dice che vive ancora, e che tira giù verso il vostro mulino e dal mulino da qualche altra parte.
            Ti dice di andare a guardare sotto la macina.
          pe: { tecnologia: 3 }
          effetti: { fazione.laresh: 1, rep.laresh: 0.5 }
        fallimento:
          titolo: Lo schizzo
          testo: |
            La lama di Oda scivola, e il tubo si spacca nella morsa sputando un getto di fango scuro che ti
            prende in faccia. È freddo, e il sapore di ferro ti resta in bocca anche dopo che hai sputato. Oda
            ride fino a doversi sedere, poi ti pulisce con lo straccio della stufa e ti dice che quella roba
            tira giù verso il vostro mulino, e che sotto la macina c'è da guardare.
          effetti: { fazione.laresh: 1, contaminazione: 0.5 }
      - testo: "Chiederle se qualcuno le aveva già portato pezzi così"
        descrizione: "Oda ha visto passare dalla sua baracca tutto quello che la Superficie restituisce."
        prova: { attributo: sociale, abilita: [empatia, conoscenze-della-strada], difficolta: Media }
        successo:
          titolo: Il mugnaio di trent'anni fa
          testo: |
            Oda versa la cicoria in due tazze e ci pensa. La cicoria è nera e densa e sa di radice bruciata.
            Trent'anni fa, dice, un mugnaio di Laresh le portò un pezzo uguale e le chiese di aprirlo. Quando
            lei gli disse che tirava giù, lui le chiese di dimenticarselo, e la pagò per questo. «Io non
            dimentico niente» dice Oda, e batte le nocche sulla gamba di legno. «Tirava verso il mulino
            grande, dico bene? Guarda sotto la macina.»
          pe: { empatia: 3 }
          effetti: { fazione.laresh: 1, rep.laresh: 0.5 }
        fallimento:
          titolo: Le lepri
          testo: |
            Le chiedi del tubo e Oda ti racconta una per una delle lepri sulla gamba, e per ognuna ti dice chi
            gliel'ha intagliata e con quale coltello. Quando finalmente torna al tubo ti guarda di traverso e
            ti chiede se ti manda la Gilda. Alla fine ti dice soltanto che tira verso il mulino, e che sotto
            la macina c'è da guardare.
          effetti: { fazione.laresh: 1, sospetto: 0.5 }
      - testo: "Pagarle la cicoria e lasciarla lavorare"
        descrizione: "Oda lavora meglio quando nessuno le fa domande. Ci vuole un pomeriggio, e qualche moneta per il disturbo."
        requisiti: [monete >= 5]
        costo: 2
        esito:
          titolo: Il pomeriggio alla stufa
          testo: |
            Le lasci qualche moneta sul banco e ti siedi accanto alla porta a bere cicoria bruciata mentre lei
            lavora. Per tutto il pomeriggio senti la lima e il fiato di Oda, e mai una parola. Al tramonto Oda
            ha aperto il tubo e l'ha richiuso, e sul banco ha disegnato col carbone una freccia che punta
            verso Laresh. «Tira verso il vostro mulino, dico bene?» dice, e batte il dito sulla punta della
            freccia, dove ha scritto *macina*.
          effetti: { monete: -5, fazione.laresh: 1 }
      - testo: "Riconoscere il metallo dei condotti"
        descrizione: "All'Accademia questo metallo l'hai visto sotto vetro. Le nervature a spirale dicono che cosa ci correva dentro."
        quando: [origine.allievo-di-torvessa >= 1]
        esito:
          titolo: Il cartellino di Orvald
          testo: |
            Dici a Oda che all'Accademia questi condotti stanno nelle vetrine, e che le spirali spingono il
            liquido in un senso solo. Oda ti guarda con un rispetto nuovo e ti fa tenere il tubo mentre lo
            apre. Dentro corre un filo chiaro che pulsa quando lo scaldi, e il metallo intorno resta freddo.
            «Tira giù verso il vostro mulino» dice poi, e aggiunge che bisogna guardare sotto la macina, come
            se tu lo sapessi già.
          pe: { tecnologia: 3 }
          effetti: { fazione.laresh: 1, rep.laresh: 0.5 }

  # ------------------------------------------------------------ 8 → 9 · l'assemblea dell'aia (grado 3)
  - id: laresh-l-assemblea-dell-aia
    presso: laresh
    immagine: ambientazione/laresh
    titolo: L'assemblea dell'aia
    sommario: "Per guardare sotto la macina bisogna fermare il mulino centrale a due settimane dalla mietitura."
    luogo: Laresh, l'aia di Casa Velar, la sera
    area: superficie-fratturata
    requisiti: [fazione.laresh == 8]
    testo: |
      La sera la Dama fa portare le panche sull'aia per le famiglie di Laresh. Arrivano dalle cucine e dalle
      stalle, ognuna di un legno e di un'altezza diversa, e la gente ci si siede stretta. Sul tavolo del
      portico ci sono il libro dei conti e il pezzo di tubo, e in prima fila siede Old Marrek con Tano
      accanto. Il tubo sta sulla sua tela cerata, e nessuno di quelli in prima fila allunga la mano per
      toccarlo.

      Bisogna fermare il mulino centrale per aprire il pavimento sotto la macina, e a due settimane dalla
      mietitura il grano si ammucchierà nei granai e in città il pane arriverà tardi. Lo dice il fattore a
      voce alta, e molti annuiscono.

      «La macina non si ferma da quarant'anni» dice Marrek. «Non la fermo adesso per guardarci sotto.» Lo dice
      tranquillo, e l'aia tace.

      {empatia Media} Marrek ha paura di una cosa sola, che a macina ferma sentirebbe il battito da solo,
      senza niente a coprirlo. Mentre parla tiene la mano aperta sul ginocchio, nello stesso modo in cui la
      tiene sull'incastellatura.

      La Dama ti guarda e apre il libro alla pagina bianca.

      {origine figlio-della-citta-bassa} In Città Bassa le assemblee finiscono a pugni o in osteria. Qui si
      aspetta che parli chi ne ha diritto, e il silenzio dura più di quanto sei abituat{o|a}.
    opzioni:
      - testo: "Parlare all'assemblea"
        descrizione: "Il villaggio ha paura per il pane."
        prova: { attributo: sociale, abilita: persuasione, difficolta: Media }
        successo:
          titolo: Il pane di primavera
          testo: |
            Parli del grano nero che ha passato il rio e del pane che mancherà a primavera, con le parole di
            Marrek, e alla fine nessuno annuisce più al fattore. La Dama scrive la decisione nel libro e la fa
            firmare a tre fittavoli, che tengono la penna come una falce. Il mulino si ferma domani al
            tramonto. Poi ti mette in mano la chiave della stanza sopra il granaio, e sotto il tavolo una
            borsa di monete. «Da stasera all'aia parlate anche voi» dice.
          pe: { persuasione: 3 }
          almeno: { rep.laresh: 6 }
          effetti: { fazione.laresh: 1, monete: 90 }
        fallimento:
          titolo: Le parole della città
          testo: |
            Parli troppo a lungo e con parole di città, e a metà discorso i braccianti in fondo cominciano a
            chiacchierare fra loro. Sulle panche dietro qualcuno passa una fiasca, e la senti stappare due
            volte. Alla fine è la Dama ad alzarsi e a dire che il mulino si ferma domani al tramonto, e tutti
            tacciono. Poi ti dà la chiave della stanza sopra il granaio e una borsa di monete.
          almeno: { rep.laresh: 6 }
          effetti: { fazione.laresh: 1, monete: 90, scandalo: 0.5 }
      - testo: "Convincere Marrek prima che parli"
        descrizione: "Se il vecchio cede, il villaggio lo segue. Bisogna parlargli a parte, di quello che teme davvero."
        prova: { attributo: sociale, abilita: empatia, difficolta: Media }
        successo:
          titolo: In due
          testo: |
            Ti accucci accanto a Marrek e gli dici piano che la notte in cui la macina si ferma resterai al
            mulino con lui. Il vecchio ti cerca il polso e lo tiene a lungo, con le dita secche premute dove
            batte il sangue. Poi si alza da solo e dice all'aia che la macina si può fermare per una
            settimana, e l'aia lo segue. La Dama ti dà la chiave della stanza sopra il granaio e una borsa di
            monete. «Da stasera all'aia parlate anche voi» dice.
          pe: { empatia: 3 }
          almeno: { rep.laresh: 6 }
          effetti: { fazione.laresh: 1, monete: 90 }
        fallimento:
          titolo: Il polso
          testo: |
            Ti accucci accanto a Marrek, e lui ti cerca il polso e lo lascia andare subito, scontento di
            quello che ci ha sentito. Alla fine la Dama decide da sola che il mulino si ferma domani al
            tramonto. Marrek se ne va senza salutare, con il bastone che batte sulle pietre dell'aia fino al
            buio. Lei ti dà lo stesso la chiave della stanza sopra il granaio e una borsa di monete.
          almeno: { rep.laresh: 6 }
          effetti: { fazione.laresh: 1, monete: 90, tormento: 0.5 }
      - testo: "Mettere il tubo sul tavolo e fare i conti"
        descrizione: "Il pezzo di tubo, il fango che sa di ferro e i numeri del libro."
        prova: { attributo: mentale, abilita: [politica-ed-economia, accademiche], difficolta: Media }
        successo:
          titolo: I conti sull'aia
          testo: |
            Apri la tela sul tavolo e fai passare il pezzo di tubo fra le panche, e chi lo prende lo passa al
            vicino più in fretta di come l'ha ricevuto. Poi leggi ad alta voce dal libro della Dama quanto
            grano si è perso in tre anni e quanto se ne perde in una settimana di mulino fermo. La Dama scrive
            la decisione nel libro, e il mulino si ferma domani al tramonto. Poi ti mette in mano la chiave
            della stanza sopra il granaio e una borsa di monete.
          pe: { politica-ed-economia: 3 }
          almeno: { rep.laresh: 6 }
          effetti: { fazione.laresh: 1, monete: 90 }
        fallimento:
          titolo: Il tubo che passa di mano
          testo: |
            Il pezzo di tubo passa fra le panche e a metà strada un bambino lo fa cadere, e da dentro esce il
            fango scuro. Sulle pietre dell'aia il fango non si allarga e resta in una pozza tonda. Le madri si
            alzano a portare via i figli, e i tuoi conti non li ascolta più nessuno. La Dama decide da sola
            che il mulino si ferma domani al tramonto. Ti dà la chiave della stanza sopra il granaio e una
            borsa di monete.
          almeno: { rep.laresh: 6 }
          effetti: { fazione.laresh: 1, monete: 90, scandalo: 0.5 }
      - testo: "Lasciare la parola a Ilio"
        descrizione: "Ilio Vardo è rimasto per la mietitura."
        quando: [laresh.ilio == 1]
        esito:
          titolo: Il campo di suo padre
          testo: |
            Fai un cenno a Ilio, e il ragazzo si alza in mezzo alle panche con le orecchie rosse e le mani
            ancora nere della cenere della striscia. Dice che il campo di suo padre è mezzo nero e che lui è
            rimasto per mieterlo, e che se il mulino deve fermarsi per salvare l'altra metà si ferma. I
            ragazzi gli danno ragione, e le madri dei ragazzi pure. La Dama scrive la decisione e ti dà la
            chiave della stanza sopra il granaio e una borsa di monete.
          almeno: { rep.laresh: 6 }
          effetti: { fazione.laresh: 1, monete: 90 }
      - testo: "Leggere all'aia la lettera di Ilio dalla Cicatrice"
        descrizione: "Ilio Vardo è partito con i Raschiatori e ha scritto a casa. Sua madre ti chiede di leggerla, perché lei non sa leggere."
        quando: [laresh.ilio == 2]
        esito:
          titolo: La lettera dal Grifone
          testo: |
            Leggi la lettera di Ilio ad alta voce. La carta è consumata sulle pieghe, perché sua madre l'ha
            aperta e richiusa molte volte senza poterla leggere. Scrive che al Grifone si mangia due volte al
            giorno davvero, e che in Cicatrice, quando una vena ronza, la squadra smette di lavorare e
            ascolta, anche se costa un turno. L'aia ride, poi ci pensa. La Dama scrive che il mulino si ferma
            domani al tramonto e ti dà la chiave della stanza sopra il granaio e una borsa di monete.
          almeno: { rep.laresh: 6 }
          effetti: { fazione.laresh: 1, monete: 90 }

  # ------------------------------------------------------------ 9 → 10 · la notte dei fuochi (il segno della Campana)
  - id: laresh-la-notte-dei-fuochi
    presso: laresh
    immagine: ambientazione/laresh
    titolo: La notte dei fuochi
    sommario: "La macina del mulino centrale si ferma al tramonto. A mezzanotte, sopra i campi di Laresh, i fuochi azzurri si mettono in fila."
    luogo: Laresh, il mulino centrale e i campi, a macina ferma
    area: superficie-fratturata
    requisiti: [fazione.laresh == 9]
    testo: |
      La macina si ferma al tramonto. Marrek toglie la mano dall'incastellatura come se scottasse, e per la
      prima volta da quarant'anni a Laresh non si sente il battito del mulino centrale. Senza il battito si
      sentono il rio e i grilli. Dopo un poco tacciono anche i grilli, a cominciare dai campi vicino al
      mulino.

      A mezzanotte sopra i campi si accendono i fuochi azzurri, più di quanti i vecchi ne abbiano mai visti.
      La loro luce non scalda l'aria e non fa ombra sotto le spighe. Poi scivolano piano uno verso l'altro e
      si mettono in file lunghe e parallele, che attraversano Laresh puntando a nord appena piegato a levante,
      verso un punto oltre l'orizzonte dove non c'è niente che tu conosca. Fra un fuoco e l'altro della stessa
      fila c'è sempre la stessa distanza, e le file restano dritte anche dove il campo scende verso il rio. Ti
      dici che è un vento d'alta quota a metterli in fila, e intanto il fumo dei camini sale dritto. Restano
      ferme per il tempo di cuocere un pane.

      {percezione Media} Le file puntano dove ululano i cani di Cahir fra mezzanotte e le tre.

      Poi i fuochi si spengono campo dopo campo. Ne resta una fila sola, che dalla striscia bruciata scende
      lungo il rio fino al mulino e si spegne contro la macina, un fuoco alla volta. Fa la strada del tubo
      sotto il campo. Nel buio Marrek ha di nuovo la mano sul legno. «L'altro battito non si è fermato» dice.
      «Va più svelto.»

      {origine accolito-del-velo} Al Velo le veglie per i morti si fanno con i lumi in fila. Questi la fila se
      la sono fatta da soli, senza guardare verso nessun altare.
    opzioni:
      - testo: "Segnare la direzione delle file sul libro della Dama"
        descrizione: "Le file stanno ferme il tempo di cuocere un pane."
        prova: { attributo: mentale, abilita: [percezione, accademiche], difficolta: Media }
        successo:
          titolo: La riga sul libro
          testo: |
            Ti metti in fila dietro a una fila, con il comignolo di Casa Velar alle spalle, e tiri una riga
            sul retro del libro della Dama prima che i fuochi si spengano. La pagina è umida di guazza e la
            penna ci si impunta due volte. È la direzione verso cui ululano i cani di Cahir. Poi Tano vi porta
            sotto la macina e solleva una botola di assi che i mugnai tengono coperta di sacchi, e sotto c'è
            una scala di pietra.
          pe: { percezione: 3 }
          effetti: { fazione.laresh: 1, rep.laresh: 0.5 }
        fallimento:
          titolo: La riga storta
          testo: |
            La riga ti viene storta, perché a metà ti volti a guardare la fila più vicina e la mano continua
            da sola. Quando i fuochi si spengono sul libro della Dama c'è una curva che non vuol dire niente,
            e la mano che teneva la penna ha le dita intirizzite. Tano vi porta sotto la macina e solleva una
            botola di assi coperta di sacchi, e sotto c'è una scala di pietra.
          effetti: { fazione.laresh: 1, tormento: 0.5 }
      - testo: "Restare con Marrek alla macina ferma"
        descrizione: "All'assemblea glielo hai promesso, o qualcuno doveva farlo."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Media }
        successo:
          titolo: Il battito svelto
          testo: |
            Resti accanto a Marrek con la mano sul legno vicino alla sua, e senti il battito di sotto farsi
            più svelto mentre i fuochi stanno in fila. Il legno dell'incastellatura è liscio e tiepido dove
            Marrek tiene la mano da quarant'anni, e freddo appena più in là. Quando l'ultima fila si spegne
            contro la macina il battito rallenta, ma resta. Marrek ti stringe il polso. Poi dice a Tano di
            mostrarti la botola, e il ragazzo sposta i sacchi dalle assi sotto la macina, scoprendo una scala
            di pietra che scende.
          pe: { resilienza: 3 }
          effetti: { fazione.laresh: 1, rep.laresh: 0.5 }
        fallimento:
          titolo: Il legno che trema
          testo: |
            Resti accanto a Marrek con la mano sul legno, e a un certo punto il battito di sotto ti entra nel
            braccio e non se ne va più, nemmeno quando togli la mano. Ha un passo diverso da quello del tuo
            cuore, e il tuo cuore prova a seguirlo. Ti siedi per terra a tremare fino all'alba. Allora Tano
            sposta i sacchi dalle assi sotto la macina e solleva una botola, e sotto c'è una scala di pietra
            che scende.
          effetti: { fazione.laresh: 1, tormento: 1 }
      - testo: "Seguire l'ultima fila fino alla ruota"
        descrizione: "Una fila sola scende lungo il rio verso il mulino."
        prova: { attributo: fisico, abilita: [furtivita, atletica], difficolta: Media }
        successo:
          titolo: La crepa nel pavimento
          testo: |
            Cammini accanto all'ultima fila lungo il rio, abbastanza vicino da sentirne il freddo sulla
            guancia. Sotto la fila l'erba della riva è bianca di brina, in piena estate. Dentro il mulino la
            vedi spegnersi in una crepa del pavimento sotto la macina, un fuoco alla volta. Tano ti raggiunge
            e sposta i sacchi da quella parte del pavimento, scoprendo una botola di assi. Sotto c'è una scala
            di pietra che i mugnai, dice, non usano da quando lui è nato.
          pe: { furtivita: 3 }
          effetti: { fazione.laresh: 1, rep.laresh: 0.5 }
        fallimento:
          titolo: Il freddo sulla mano
          testo: |
            Cammini troppo vicino alla fila, e un fuoco ti passa sul dorso della mano. È freddo come la neve,
            e il freddo ti resta nelle ossa delle dita fino al mattino. Sulla pelle non lascia nessun segno.
            Dentro il mulino Tano sposta i sacchi dalle assi sotto la macina e solleva una botola, e sotto c'è
            una scala di pietra.
          effetti: { fazione.laresh: 1, ferite: 0.5, tormento: 0.5 }
      - testo: "Fischiare ai fuochi con il fischietto di Cahir"
        descrizione: "Con il fischio dei cani Corin li chiamava, e finiva nel fosso. Il fischietto d'osso di Cahir forse lo sentono meglio."
        requisiti: [oggetto.laresh-fischietto-d-osso >= 1]
        esito:
          titolo: Le due note
          testo: |
            Fischi le due note del fischietto d'osso verso la fila più vicina, e i fuochi tremano tutti
            insieme. Si girano un poco verso di te, poi tornano a puntare dove puntavano. Lungo tutta la fila
            il tremito parte dal fuoco più vicino e arriva fino all'ultimo. Tano ride e dice che sei come il
            mercante del fosso. Quando l'ultima fila si spegne contro la macina, sposta i sacchi dalle assi e
            solleva una botola, e sotto c'è una scala di pietra.
          effetti: { fazione.laresh: 1, rep.laresh: 0.5 }
