# La quest di Ghoran, «Si pesa» (fazione.ghoran 0 → 15), blocco 2 di docs/piano-superficie.md. Qui la pista, la
# voce della fazione con i cinque gradi, la reputazione del villaggio e le quality della quest. Il luogo, l'attività,
# il servizio e i lavori dei gradi stanno in luogo.yaml; gli storylet in passi-1/2/3.yaml; la spedizione dell'Atto IV
# in spedizione-fossa.yaml.
# - Atto I (passi 1-3, pista.arena >= 5): l'invito di Ragh e la bilancia della palizzata, una ripresa nel campo dei
#   tamburi, la sala lunga di Ragh (grado 1, Pesato: il filo di rame e le voci sulla Costola e sui Tamburi).
# - Atto II (4-6): la lite fra il clan della Pece e il clan del Guado per la morte di Jarko, il fiele d'anguilla sul
#   margine della palude, il verdetto sul piatto della bilancia (grado 2, Peso dei clan: il campo dei tamburi).
# - Atto III (7-9): la casa bianca di Tasha, il recinto di notte e la scelta sugli schiavi, l'incidente che la Gilda
#   aveva ordinato (grado 3, Torcia di pece: la lancia della Pece).
# - Atto IV (10-12): le radici che battono senza sangue (il segno della Campana), la spedizione nella Fossa del Seme
#   (passo 11), la risalita (grado 4, Parente di clan: la pelle della Fossa).
# - Atto V (13-15): il patto per cui Ragh ha perso l'occhio, la notte dei tamburi e il voto dei clan, la discesa
#   oltre la porta dell'ascia (grado 5, Occhio di Ragh: la bipenne di Ragh e dono.ghoran).
# Nessuna scelta chiude la quest: ghoran.verdetto, ghoran.schiavi e ghoran.patto cambiano soltanto chi ti saluta e
# che cosa ti dicono.
quality:
  - { id: fazione.ghoran, immagine: icone/weight-scale, nome: "Si pesa", categoria: pista, descrizione: "Ragh Kor'Nul ha mandato a dire che vuole pesarti. A Ghoran chi non ha un clan vale quanto la sua parola, e la parola si mette sul piatto davanti a tutti." }
  - { id: rep.ghoran, immagine: icone/weight-scale, nome: Ghoran, categoria: reputazione, famiglia: Luoghi, descrizione: "Quanto ti conoscono i clan di Ghoran, sulle passerelle come intorno al campo dei tamburi." }
  - { id: ghoran.verdetto, nome: Il verdetto della bilancia, categoria: stato, nascosta: true, descrizione: "Come hai chiuso la lite fra la Pece e il Guado. 1 Tibbo libero e Ostrav che paga a peso d'argento; 2 Tibbo dato alla Pece in cambio del morto." }
  - { id: ghoran.schiavi, nome: Il recinto di Tasha, categoria: stato, nascosta: true, descrizione: "Che cosa hai fatto del recinto di Tasha la Bianca. 1 l'hai aperto di notte; 2 hai riscattato i più piccoli; 3 l'hai lasciato chiuso." }
  - { id: ghoran.parente, immagine: icone/linked-rings, nome: Parente di clan, categoria: accesso, descrizione: "Sei sceso nella Fossa del Seme e ne sei risalito vivo. Sulle passerelle di Ghoran ti salutano con la mano sul petto, e nessun clan ti chiede il prezzo del passaggio." }
  - { id: ghoran.patto, nome: Il patto del Seme, categoria: stato, nascosta: true, descrizione: "Come è finita oltre la porta dell'ascia. 1 il patto di Ragh rinnovato; 2 la radice madre tagliata." }

fazioni:
  - id: ghoran
    nome: Ghoran
    immagine: ambientazione/ghoran
    reputazione: rep.ghoran
    pista: fazione.ghoran
    gradi:
      - { passo: 3, nome: Pesato, ricompensa: "Ragh ti ha pesato davanti ai clan. Il filo di rame da intrecciare nei capelli e una borsa di monete." }
      - { passo: 6, nome: Peso dei clan, ricompensa: "I clan ti chiamano a fare da peso nelle liti. Il campo dei tamburi, dove si combatte per una borsa quando vuoi." }
      - { passo: 9, nome: Torcia di pece, ricompensa: "La Pece ti dà la sua lancia, con la punta lunga e il manico nero di pece." }
      - { passo: 12, nome: Parente di clan, ricompensa: "Sei risalito vivo dalla Fossa del Seme. La pelle della Fossa e l'ospitalità di ogni clan, con la cerusica del campo a metà prezzo." }
      - { passo: 15, nome: Occhio di Ragh, ricompensa: "La bipenne che Ragh lasciò nella radice diciannove anni fa, e il dono di Ghoran per quello che verrà." }
