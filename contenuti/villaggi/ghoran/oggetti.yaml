# Gli oggetti della quest di Ghoran. Ricompense dei gradi: il filo di rame (grado 1, passo 3), il campo dei tamburi
# è un servizio (grado 2, passo 6, in luogo.yaml), la lancia della Pece (grado 3, passo 9), la pelle della Fossa
# (grado 4, passo 12) e la bipenne di Ragh (grado 5, oggetto unico di grado 4, passo 15).
# Il dente del verro è il ricordo del cuore della Fossa, una chiave per due opzioni dell'Atto V.
oggetti:
  - id: ghoran-filo-di-rame
    nome: Filo di rame del clan
    immagine: icone/wire-coil
    descrizione: "Un filo di rame lungo un braccio, da intrecciare nei capelli. A Ghoran lo porta chi combatte per un clan, e chi lo vede sa che dietro di te c'è qualcuno che si ricorda i torti."
    slot: accessorio
    grado: 1
    proprieta: { talento: { intimidire: 1, conoscenze-della-strada: 1 } }
    difetti: [riconoscibile]

  - id: ghoran-lancia-della-pece
    nome: Lancia della Pece
    immagine: icone/spear-hook
    descrizione: "Una lancia da gladiatore con la punta lunga e stretta e il manico nero, passato nella pece calda finché non scivola più nemmeno con il sangue. La Pece la dà a chi le ha reso un morto."
    slot: arma
    base: lancia
    grado: 2
    dadi: 1
    proprieta: { affilata: 1 }

  - id: ghoran-pelle-della-fossa
    nome: Pelle della Fossa
    immagine: icone/leather-armor
    descrizione: "Cuoio di verro conciato nell'acqua delle pozze e cucito da Oska con il budello di capra. Chi risale dalla Fossa la porta, e le cose che ha visto di sotto gli pesano un po' meno."
    slot: armatura
    base: cuoio-rinforzato
    grado: 3
    dadi: 1
    proprieta: { lucida: true }

  - id: ghoran-bipenne-di-ragh
    nome: Bipenne di Ragh
    immagine: icone/sharp-axe
    descrizione: "La bipenne che Ragh Kor'Nul piantò in una radice diciannove anni fa e che la radice ha tenuto da allora. Il filo è rimasto nero, e beve il sangue che tocca prima che arrivi a terra."
    slot: arma
    base: ascia-bipenne
    grado: 4
    dadi: 2
    proprieta: { assetata: true, ostinata: true }
    difetti: [legata]

  - id: ghoran-dente-del-verro
    nome: Dente del verro radicato
    immagine: icone/fangs
    descrizione: "Una zanna lunga come un avambraccio, con una radice nera che ci gira intorno. Viene dal fondo della Fossa del Seme, e sulle passerelle di Ghoran tutti sanno da dove."
    slot: nessuno
    proprieta: { chiave: [dente-del-verro] }
