# La quest di Ghoran, la fine dell'Atto IV e l'Atto V (fazione.ghoran 11 → 15).
# - 11 → 12 `ghoran-parente-di-clan` (grado 4, Parente di clan): i clan ti segnano come parente, Oska ti cuce la
#   pelle della Fossa, e Ragh vuole sapere della porta e della bipenne (ghoran.parente).
# - 12 → 13 `ghoran-l-occhio-di-ragh`: Ragh racconta l'inverno delle tre Fosse e il patto per cui ha perso l'occhio.
# - 13 → 14 `ghoran-la-notte-dei-tamburi`: Ostrav e Tasha vogliono nutrire la Fossa con il sangue comprato, e la notte
#   prima della discesa il Guado prova a tagliare la catena. Le varianti (Tibbo libero, Lucia Malgrani a Ghoran dopo
#   pista.pelle >= 7, il dente del verro) sono opzioni con `quando` o chiavi.
# - 14 → 15 `ghoran-oltre-la-porta` (grado 5, Occhio di Ragh): la camera del Seme e il suo custode (boss finale). Il
#   patto si rinnova o la radice madre si taglia (ghoran.patto); in ogni caso la bipenne di Ragh e dono.ghoran.
# Il Seme batte a tempo con qualcosa più in basso: nessuno, a Ghoran, sa dire che cosa (la Campana Sepolta).
storylet:
  # ------------------------------------------------------------ 11 → 12 · parente di clan (grado 4)
  - id: ghoran-parente-di-clan
    presso: ghoran
    immagine: ambientazione/ghoran
    titolo: Parente di clan
    sommario: "Sei risalito vivo dalla Fossa del Seme. A Ghoran chi ne risale è parente di tutti i clan, e i clan te lo vengono a dire uno alla volta."
    luogo: Ghoran, la sala lunga di Ragh Kor'Nul
    area: superficie-fratturata
    requisiti: [fazione.ghoran == 11]
    testo: |
      Il giorno dopo la sala lunga è piena fino alla passerella. I capi dei
      clan entrano uno alla volta, si fermano davanti a te e ti toccano il
      petto con la mano aperta, che a Ghoran è il saluto fra parenti. Gedda
      della Pece ti lascia sulla giubba un'impronta nera di resina. Per ultimo
      arriva Ostrav, che te lo tocca appena con due dita e poi se le pulisce
      sull'anello di cera verde.

      Oska siede in un angolo con una pelle di verro sulle ginocchia e cuce
      senza alzare la testa.

      Quando i capi se ne vanno resta soltanto Ragh, sulla sua sedia nera,
      con il fuoco basso. Batte le nocche sul bracciolo, due volte. «Hai
      visto la porta» dice. «E hai visto la mia bipenne. Dimmi chi c'era
      davanti.»

      {empatia Media} Lo sa già, chi c'era. Vuole sentirlo dire da un altro,
      per essere sicuro di non esserselo sognato per diciannove anni.

      {percezione Difficile} Ragh tiene la mano destra chiusa sul bracciolo,
      e il pollice continua a tornare sul palmo, dove c'è un callo largo
      quanto un manico.

      {origine fuggiasco-di-ghoran} I clan che ti toccano il petto sono gli
      stessi che compravano dalla fila. Nessuno di loro ti ha mai chiesto il
      nome, e adesso te lo chiedono tutti, uno alla volta.
    opzioni:
      - testo: "Raccontargli del verro, senza nascondere niente"
        descrizione: "Un verro grande come un carro, le radici nella schiena, e l'orecchio tagliato a tacche dei recinti."
        prova: { attributo: sociale, abilita: [empatia, persuasione], difficolta: Media }
        successo:
          titolo: Il verro di Ragh
          testo: |
            Glielo racconti piano, con l'orecchio tagliato a tacche e le radici
            nella schiena. Ragh ascolta con l'occhio chiuso. Quando hai finito
            dice che il verro era suo, cresciuto da porcello nella sala lunga,
            e che l'ha lasciato giù a guardare la porta. Poi chiama Oska, che ti mette
            addosso la pelle cucita. È di verro, conciata nell'acqua delle
            pozze, e la porta chi risale dalla Fossa.
          pe: { empatia: 5 }
          almeno: { rep.ghoran: 8 }
          imposta: { ghoran.parente: 1 }
          effetti: { fazione.ghoran: 1, monete: 50, oggetto.ghoran-pelle-della-fossa: 1 }
        fallimento:
          titolo: Le parole sbagliate
          testo: |
            Lo racconti come una caccia, con il verro che carica e le zanne, e
            Ragh ti ferma con una mano alzata. Era il suo verro, dice Ragh,
            cresciuto da porcello nella sala lunga. Poi chiama Oska, che ti mette addosso la
            pelle cucita, quella che porta chi risale dalla Fossa, e ti stringe
            le cinghie più del necessario.
          almeno: { rep.ghoran: 8 }
          imposta: { ghoran.parente: 1 }
          effetti: { fazione.ghoran: 1, monete: 50, oggetto.ghoran-pelle-della-fossa: 1, tormento: 0.5 }
      - testo: "Mettergli in mano la zanna del verro"
        descrizione: "La zanna che hai portato su parla meglio di qualunque racconto. Ragh la riconoscerà."
        requisiti: [chiave.dente-del-verro >= 1]
        esito:
          titolo: La zanna
          testo: |
            Gli metti in mano la zanna, e Ragh la gira fra le dita, con la
            radice nera che ci gira intorno. Dice che il verro era suo,
            cresciuto da porcello nella sala lunga, e che l'ha lasciato giù a
            guardare la porta. Ti rende la zanna. Poi chiama Oska, che ti mette addosso la
            pelle cucita, quella che porta chi risale dalla Fossa.
          almeno: { rep.ghoran: 8 }
          imposta: { ghoran.parente: 1 }
          effetti: { fazione.ghoran: 1, monete: 50, oggetto.ghoran-pelle-della-fossa: 1, rep.ghoran: 0.5 }
      - testo: "Chiedergli prima della bipenne"
        descrizione: "Una bipenne piantata in una radice davanti a una porta è un pegno. Chi lascia un pegno ha fatto un patto."
        prova: { attributo: sociale, abilita: [intimidire, galateo], difficolta: Difficile }
        successo:
          titolo: Il pegno
          testo: |
            Gli chiedi della bipenne prima che lui ti chieda del verro, e Ragh
            ti guarda a lungo. Poi ride dal fondo del petto e dice che sei il
            primo in diciannove anni a pesare lui. Il verro era suo, e la
            bipenne è un pegno. Del patto ti parlerà quando sarai pronto ad
            ascoltarlo. Oska intanto ti mette addosso la pelle cucita, quella
            che porta chi risale dalla Fossa.
          pe: { intimidire: 5 }
          almeno: { rep.ghoran: 8 }
          imposta: { ghoran.parente: 1 }
          effetti: { fazione.ghoran: 1, monete: 50, oggetto.ghoran-pelle-della-fossa: 1, rep.ghoran: 0.5 }
        fallimento:
          titolo: La domanda troppo presto
          testo: |
            Gli chiedi della bipenne, e Ragh batte le nocche una volta sola,
            forte. Ti dice che le domande le fa chi è seduto sulla sedia, poi
            si fa raccontare del verro, che era suo. Oska ti mette addosso la
            pelle cucita, quella che porta chi risale dalla Fossa, senza
            guardarti in faccia.
          almeno: { rep.ghoran: 8 }
          imposta: { ghoran.parente: 1 }
          effetti: { fazione.ghoran: 1, monete: 50, oggetto.ghoran-pelle-della-fossa: 1, scandalo: 0.5 }
      - testo: "Dirgli soltanto che la bipenne è ancora lì"
        descrizione: "Il resto lo sa. Ragh vuole sapere una cosa sola, anche se ne chiede un'altra."
        esito:
          titolo: Ancora lì
          testo: |
            Gli dici che la bipenne è ancora lì, piantata nella radice. Ragh
            chiude l'occhio e resta così per tutto il tempo che Oska ci mette a
            finire l'ultima cucitura. Poi ti fa mettere addosso la pelle, quella
            che porta chi risale dalla Fossa, e ti dice che del resto parlerete
            un'altra notte.
          almeno: { rep.ghoran: 8 }
          imposta: { ghoran.parente: 1 }
          effetti: { fazione.ghoran: 1, monete: 50, oggetto.ghoran-pelle-della-fossa: 1 }

  # ------------------------------------------------------------ 12 → 13 · l'occhio di Ragh
  - id: ghoran-l-occhio-di-ragh
    presso: ghoran
    immagine: ambientazione/ghoran
    titolo: L'occhio di Ragh
    sommario: "Ragh Kor'Nul si toglie la benda davanti a te. Diciannove anni fa, sotto il campo, ha fatto un patto, e il patto si è svegliato."
    luogo: Ghoran, la sala lunga di notte
    area: superficie-fratturata
    requisiti: [fazione.ghoran == 12]
    testo: |
      A notte fonda la sala lunga è vuota e il fuoco è quasi spento. Ragh ha
      mandato via anche Vesna. Si slaccia la benda e la posa sul bracciolo,
      e sotto non c'è un occhio. C'è una cicatrice scura e liscia, come
      pietra levigata, con sottili righe nere che partono dal bordo.

      «L'inverno delle tre Fosse» dice. «Tre dispute in un mese, poi una
      ogni settimana. La Fossa beveva, e le radici salivano. Le abbiamo
      viste uscire dalle pozze sotto le case.» Batte le nocche sul
      bracciolo. «Sono sceso con il mio verro e la mia bipenne fino alla
      porta. La porta si è aperta di un palmo, e da dentro mi hanno chiesto
      una cosa che guarda. Gliel'ho data. Le radici sono tornate giù. Da
      allora nella Fossa si scende di rado, per le liti che si chiudono
      soltanto laggiù, e io conto le tacche.»

      {medicina Media} La cicatrice è troppo liscia. Nessuna lama lascia un
      segno così, e nessun fuoco.

      {resilienza Difficile} Le righe nere intorno all'orbita si muovono,
      appena, a tempo con il colpo che sale dal campo.

      *Si è fatto togliere un occhio per un villaggio che lo pesa ogni
      giorno.* Ragh si rimette la benda. «Adesso battono senza sangue. Io
      scendo, e oltre la porta stavolta ci passo. Tu vieni con me.»
    opzioni:
      - testo: "Chiedergli che cosa c'è dietro la porta"
        descrizione: "Ragh ha visto un palmo di porta aperta. Qualcosa ha visto, anche se non lo dice."
        prova: { attributo: sociale, abilita: [empatia, persuasione], difficolta: Media }
        successo:
          titolo: Un palmo di porta
          testo: |
            Glielo chiedi piano, e Ragh ci pensa a lungo. Dietro la porta,
            dice, c'era una luce grigia e una cosa nera grande come una casa
            che batteva, e davanti alla cosa nera qualcuno di metallo, in
            piedi. La mano che ha preso l'occhio era fredda come un ferro
            d'inverno. Poi ti dice che si parte fra due notti, quando i clan
            avranno votato.
          pe: { empatia: 3 }
          effetti: { fazione.ghoran: 1, rep.ghoran: 0.5 }
        fallimento:
          titolo: La benda
          testo: |
            Glielo chiedi troppo in fretta, e Ragh si rimette la benda senza
            rispondere. Dice soltanto che si parte fra due notti, quando i
            clan avranno votato, e che quello che c'è dietro la porta lo
            vedrai da te.
          effetti: { fazione.ghoran: 1, tormento: 0.5 }
      - testo: "Dirgli che non scende da solo con te soltanto"
        descrizione: "Un capo che scende dove ha perso un occhio lascia un villaggio senza capo. Ci vuole qualcuno che tenga la catena in alto."
        prova: { attributo: sociale, abilita: [politica-ed-economia, persuasione], difficolta: Media }
        successo:
          titolo: La catena in alto
          testo: |
            Gli dici che se scendete in due, in alto la catena la deve tenere
            qualcuno di cui si fida, e che il Guado aspetta proprio questo.
            Ragh annuisce e dice che la catena la terrà la Pece. I clan votano
            fra due notti alla bilancia se chi scende può scendere, e si parte
            subito dopo il voto.
          pe: { politica-ed-economia: 3 }
          effetti: { fazione.ghoran: 1, rep.ghoran: 0.5 }
        fallimento:
          titolo: La sedia nera
          testo: |
            Gli dici che un capo non dovrebbe scendere, e Ragh ti risponde che
            il capo l'ha fatto la Fossa diciannove anni fa, e che adesso se lo
            riprende se vuole. Si parte dopo il voto dei clan, fra due notti.
          effetti: { fazione.ghoran: 1, scandalo: 0.5 }
      - testo: "Restare con lui fino all'alba senza parlare"
        descrizione: "Ragh ha detto quello che aveva da dire. Il resto si aspetta insieme, davanti al fuoco."
        costo: 2
        esito:
          titolo: Il fuoco spento
          testo: |
            Resti con lui finché il fuoco si spegne del tutto. Ogni tanto Ragh
            si tocca la benda. All'alba si alza, ti batte due volte la mano
            sulla spalla come sul bracciolo, e ti dice che si parte dopo il voto
            dei clan.
          effetti: { fazione.ghoran: 1, tormento: 0.5 }
      - testo: "Toccargli la cicatrice con le dita del Velo"
        descrizione: "Al Velo si impara a toccare le ferite che non sono ferite. Questa è una di quelle."
        quando: [origine.accolito-del-velo >= 1]
        esito:
          titolo: Le dita del Velo
          testo: |
            Gli chiedi il permesso con lo sguardo, e Ragh abbassa la testa.
            Appoggi due dita sulla cicatrice come ti hanno insegnato i
            confessori della Cattedrale, e la senti battere, lenta, sotto i
            polpastrelli. Ragh ti prende il polso e lo allontana, senza
            durezza. Si parte dopo il voto dei clan, dice, fra due notti.
          pe: { resilienza: 3 }
          effetti: { fazione.ghoran: 1, rep.ghoran: 0.5 }

  # ------------------------------------------------------------ 13 → 14 · la notte dei tamburi
  - id: ghoran-la-notte-dei-tamburi
    presso: ghoran
    immagine: ambientazione/ghoran
    titolo: La notte dei tamburi
    sommario: "Alla bilancia i clan votano se Ragh può scendere oltre la porta. Ostrav vuole nutrire la Fossa con sangue comprato, e Tasha ha la merce pronta."
    luogo: Ghoran, la bilancia del mercato e il campo dei gladiatori
    area: superficie-fratturata
    requisiti: [fazione.ghoran == 13]
    testo: |
      Alla bilancia del mercato i capi dei clan sono in piedi in cerchio con
      le torce, e Ragh sta in mezzo senza sedersi. Ostrav parla per
      primo. Dice che la Fossa ha sete e che una volta la si nutriva, e che
      nutrirla costa meno che perdere il capo dei clan oltre una porta. Tasha
      la Bianca è accanto a lui, vestita di bianco, con le mani giunte. Dice
      che ha della merce e che la cede a prezzo di costo, per il bene delle
      anime.

      Gedda della Pece sputa la resina sulle assi. Dalla finestra della casa
      di pietra, oltre la pozza, la vecchia Mendion guarda il mercato con una
      lanterna accanto, e non scende.

      {politica-ed-economia Difficile} Se Ragh non risale, il Guado è il clan
      più ricco e Ostrav il prossimo sulla sedia nera. Gli conviene che
      Ragh scenda, e gli conviene ancora di più che non risalga.

      {intimidire Media} Due uomini del Guado si sono staccati dal cerchio
      e vanno verso il campo, dove la Pece tiene la catena della grata.

      Dopo il voto, comunque vada, i tamburi suonano tutta la notte.
    opzioni:
      - testo: "Parlare ai clan contro il sangue comprato"
        descrizione: "Sei parente di tutti i clan, e chi è sceso parla della Fossa con più diritto di chi la vuole nutrire."
        prova: { attributo: sociale, abilita: persuasione, difficolta: Difficile }
        successo:
          titolo: Il voto
          testo: |
            Dici ai clan quello che hai visto di sotto, dalle ossa
            dell'inverno fino al verro con le radici nella schiena, e chiedi chi vuole rifare
            quell'inverno con la carne comprata. I capi votano mettendo una
            pietra sul piatto, e il piatto di Ragh scende. Mentre il mercato si
            svuota, la Pece ferma i due uomini del Guado accanto alla catena
            con i coltelli in mano. All'alba Ragh e il peso dei clan scendono.
          pe: { persuasione: 5 }
          effetti: { fazione.ghoran: 1, rep.ghoran: 0.5 }
        fallimento:
          titolo: Il voto stretto
          testo: |
            Parli troppo a lungo, e Ostrav ti interrompe a metà, davanti a
            tutti, per chiederti il prezzo di quello che dici. Il voto finisce
            con una pietra di scarto. Ragh può scendere, e Tasha si riporta a
            casa la sua merce. Più tardi la Pece trova la catena della grata
            segata a metà, e la sostituisce prima dell'alba.
          effetti: { fazione.ghoran: 1, scandalo: 0.5 }
      - testo: "Andare a guardia della catena"
        descrizione: "I due uomini del Guado vanno verso il campo. Il voto si fa anche senza di te."
        combattimento: ghoran-gli-uomini-del-guado
        vittoria:
          titolo: La catena
          testo: |
            Li trovi accanto alla grata con un seghetto da ferro e un coltello
            per chi tiene la catena. Quando restano a terra li porti per il
            bavero alla bilancia davanti a tutti, e Ostrav non dice niente. Il
            voto lo vince Ragh senza che nessuno parli, e all'alba si scende.
          effetti: { fazione.ghoran: 1, rep.ghoran: 0.5 }
        sconfitta:
          titolo: La catena segata
          testo: |
            Ti lasciano a terra accanto alla grata e scappano con il seghetto,
            ma la catena l'hanno segata soltanto a metà. La Pece la cambia
            prima dell'alba, e alla bilancia il voto lo vince Ragh per una
            pietra.
          effetti: { fazione.ghoran: 1, tormento: 0.5 }
      - testo: "Seguirli nel buio e prenderli sul fatto"
        descrizione: "Due uomini con un seghetto non fanno rumore, finché non cominciano a segare."
        prova: { attributo: fisico, abilita: furtivita, difficolta: Media }
        successo:
          titolo: Il seghetto
          testo: |
            Li segui sotto le gradinate e aspetti che comincino. Al primo
            colpo di seghetto chiami Vesna, e la Pece li circonda con le torce.
            Li portate alla bilancia con il seghetto ancora in mano, e il voto
            lo vince Ragh mentre Ostrav guarda da un'altra parte.
          pe: { furtivita: 3 }
          effetti: { fazione.ghoran: 1, rep.ghoran: 0.5 }
        fallimento:
          titolo: Il gradino che scricchiola
          testo: |
            Un gradino scricchiola sotto il tuo piede, e i due scappano lasciando
            la catena segata a metà. La Pece la cambia prima dell'alba, e alla
            bilancia il voto lo vince Ragh per una pietra.
          effetti: { fazione.ghoran: 1, sospetto: 0.5 }
      - testo: "Restare tutta la notte con la Pece accanto alla catena"
        descrizione: "Una catena guardata da venti torce non la sega nessuno. Il voto però va avanti senza di te."
        costo: 2
        esito:
          titolo: Venti torce
          testo: |
            Passi la notte accanto alla grata con la Pece a masticare resina e
            contare i colpi dei tamburi. Nessuno si avvicina alla catena. Al
            mattino Vesna ti dice che il voto l'ha vinto Ragh per una pietra, e
            che Ostrav ha votato per ultimo.
          effetti: { fazione.ghoran: 1, tormento: 0.5 }
      - testo: "Mostrare ai clan la zanna del verro"
        descrizione: "La zanna con la radice intorno l'hai portata su tu. Chi la vede sa da dove viene."
        requisiti: [chiave.dente-del-verro >= 1]
        prova: { attributo: sociale, abilita: [intimidire, espressivita], difficolta: Media }
        successo:
          titolo: La zanna sul piatto
          testo: |
            Posi la zanna sul piatto della bilancia, con la radice nera ancora
            intorno, e il piatto scende, e il resto lo dice il piatto. I capi votano per
            Ragh uno dopo l'altro, e Tasha porta via la sua merce senza una
            parola. La Pece intanto ferma i due uomini del Guado accanto alla
            catena, e all'alba si scende.
          pe: { intimidire: 3 }
          effetti: { fazione.ghoran: 1, rep.ghoran: 0.5 }
        fallimento:
          titolo: La zanna e il prezzo
          testo: |
            Posi la zanna sul piatto, e Ostrav chiede a voce alta quanto vale
            un osso di porco. Ridono in pochi, ma ridono. Il voto lo vince Ragh
            per una pietra, e più tardi la Pece trova la catena segata a metà e
            la cambia prima dell'alba.
          effetti: { fazione.ghoran: 1, scandalo: 0.5 }
      - testo: "Ascoltare quello che Tibbo ha da dirti"
        descrizione: "Tibbo è libero da quando hai pesato la sua lite. Da libero gira dove vuole, e sente quello che il Guado dice a voce bassa."
        quando: [ghoran.verdetto == 1]
        esito:
          titolo: Le dita di Tibbo
          testo: |
            Tibbo ti aspetta sulla passerella prima del voto e ti parla con le
            dita, in fretta. Due uomini del Guado, un seghetto da ferro, la
            catena della grata. Lo dici a Vesna, e la Pece li aspetta sotto le
            gradinate. Alla bilancia il voto lo vince Ragh, e Ostrav non apre
            bocca.
          effetti: { fazione.ghoran: 1, rep.ghoran: 0.5 }
      - testo: "Chiedere a Lucia Malgrani di parlare con la zia"
        descrizione: "Lucia vive nella casa di pietra con i figli, da quando ha lasciato Qir-Azel. Urtilia guarda il mercato dalla finestra, e una parola sua vale molti voti."
        quando: [pista.pelle >= 7]
        esito:
          titolo: La casa di pietra
          testo: |
            Lucia Malgrani ti apre la porta della casa di pietra con un bambino
            in braccio, e ti ascolta senza farti entrare. Poi sale le scale.
            Poco dopo la lanterna alla finestra si sposta da sinistra a destra,
            e alla bilancia due capi cambiano la loro pietra di piatto. Il voto
            lo vince Ragh. La Pece intanto ferma i due del Guado accanto alla
            catena.
          effetti: { fazione.ghoran: 1, rep.ghoran: 0.5 }
      - testo: "Raccontare ai clan la fila della bilancia"
        descrizione: "La carne comprata che Tasha offre l'hai vista dalla parte del piatto. Detto da te, ai clan suona diverso."
        quando: [origine.fuggiasco-di-ghoran >= 1]
        esito:
          titolo: Dalla parte del piatto
          testo: |
            Racconti ai clan la fila prima della pesata, dal più grosso al più
            piccolo, e il peso preso prima di mangiare. Lo dici guardando Tasha.
            Nessuno ti interrompe, e quando hai finito i capi votano per Ragh
            con le pietre in mano da prima che tu smettessi. La Pece intanto
            ferma i due del Guado accanto alla catena.
          pe: { persuasione: 3 }
          effetti: { fazione.ghoran: 1, rep.ghoran: 0.5 }

  # ------------------------------------------------------------ 14 → 15 · oltre la porta (grado 5)
  - id: ghoran-oltre-la-porta
    presso: ghoran
    immagine: bestiario/salvaguardia-precursori
    titolo: Oltre la porta
    sommario: "Ragh strappa la sua bipenne dalla radice, e la porta di pietra si apre. Dentro c'è il Seme, e davanti al Seme c'è chi gli ha preso l'occhio."
    luogo: La Fossa del Seme, oltre la porta dell'ascia
    area: superficie-fratturata
    requisiti: [fazione.ghoran == 14]
    testo: |
      Scendete in due per la catena, e la Pece la tiene dall'alto con le
      torce. In fondo alla Fossa la sala rotonda è come l'hai lasciata. Ragh
      si ferma davanti alla radice, prende il manico nero della sua bipenne e
      la strappa via con un colpo solo, e dalla radice cola una linfa scura.
      La porta di pietra si apre, adagio, verso l'interno.

      La camera dietro la porta è più grande dell'arena di sopra. Al centro
      c'è una massa nera e liscia, grande come una casa, a forma di seme, e
      tutte le radici della Fossa partono da lei. Batte, e ogni colpo fa
      tremare la luce grigia che sale dal pavimento. Davanti al Seme c'è una
      figura di metallo nero alta due volte un uomo, con le radici che le
      entrano nelle giunture. Ha una faccia liscia, e un occhio solo, che si
      gira verso Ragh.

      {tecnologia Difficile} La figura è una macchina dei Precursori, di
      quelle che custodiscono. Le radici però non sono sue, e la tengono
      ferma come il verro, che senza di loro sarebbe già caduto.

      {resilienza Media} Il Seme batte a tempo con un colpo che viene da più
      in basso, molto più in basso. Lo senti salire dai talloni fino alle ginocchia.

      Ragh ti mette in mano la bipenne. «Io gliel'ho data» dice. «Tu
      riprenditela.»

      {origine fuggiasco-di-ghoran} Il custode ti guarda come guardava il
      vecchio della bilancia, dalla testa ai piedi, per sapere quanto vali.
      Lo hai già visto fare tante volte, e sai stare fermo.
    opzioni:
      - testo: "Affrontare il custode del Seme"
        descrizione: "Una macchina dei Precursori tenuta in piedi dalle radici, alta il doppio di te. Con la bipenne di Ragh in mano."
        combattimento: ghoran-il-custode
        vittoria:
          titolo: La radice madre
          testo: |
            Il custode cade in ginocchio davanti al Seme, e l'occhio si chiude.
            Con l'ultimo colpo di bipenne tagli la radice madre dove entra nel
            pavimento, e il Seme smette di battere. Più in basso, molto più in
            basso, il colpo lontano continua, e nessuno dei due ne parla.

            In superficie Ragh ti lascia la bipenne e davanti ai clan dice che
            da oggi sei il suo occhio. Gedda ti mette in mano una borsa pesante
            della Pece, e i tamburi suonano fino all'alba.
          almeno: { rep.ghoran: 10 }
          imposta: { ghoran.patto: 2 }
          effetti: { fazione.ghoran: 1, monete: 80, oggetto.ghoran-bipenne-di-ragh: 1, dono.ghoran: 1 }
        sconfitta:
          titolo: La mano fredda
          testo: |
            Il custode ti prende per la gola con una mano fredda come un ferro
            d'inverno, e Ragh te lo stacca di dosso a mani nude. Risalite la
            catena trascinandovi a vicenda, mentre la porta si richiude dietro
            di voi. Ragh ti ripete che si torna giù quando sei pronto.
          effetti: { tormento: 1 }
      - testo: "Rinnovare il patto con il tuo sangue"
        descrizione: "Ragh ha dato una cosa che guarda. Il Seme beve. Si può dargli da bere una volta, da parte di chi è parente di tutti i clan, e chiedergli di dormire."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Difficile }
        successo:
          titolo: Il sangue del peso
          testo: |
            Ti tagli il palmo con il filo della bipenne e appoggi la mano sul
            Seme. È tiepido. Beve, e a ogni sorso il colpo rallenta, finché il
            custode chiude l'occhio e le radici della camera si afflosciano
            sul pavimento. Ragh ti fascia la mano con la benda che si è tolto.

            In superficie ti lascia la bipenne e davanti ai clan dice che da
            oggi sei il suo occhio. Gedda ti mette in mano una borsa pesante
            della Pece, e i tamburi suonano fino all'alba.
          pe: { resilienza: 5 }
          almeno: { rep.ghoran: 10 }
          imposta: { ghoran.patto: 1 }
          effetti: { fazione.ghoran: 1, monete: 80, oggetto.ghoran-bipenne-di-ragh: 1, dono.ghoran: 1, ferite: 1 }
        fallimento:
          titolo: Il Seme che beve
          testo: |
            Appoggi la mano sul Seme, e il Seme beve troppo, e troppo in fretta.
            Ragh ti strappa via per il braccio prima che le gambe ti cedano.
            Risalite la catena in due, con te che non riesci a stringere la mano.
          effetti: { ferite: 2, tormento: 1 }
      - testo: "Spegnere il custode come una macchina"
        descrizione: "Le macchine dei Precursori hanno una piastra che le fa dormire. Questa ce l'ha da qualche parte, sotto le radici."
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Difficile }
        successo:
          titolo: La piastra
          testo: |
            Mentre Ragh tiene impegnato il custode con la sua mole tu gli giri
            dietro, e trovi la piastra fredda sotto le radici del collo. La
            premi. Il custode si ferma a metà passo e l'occhio si chiude, e con
            la bipenne tagli la radice madre dove entra nel pavimento. Il Seme
            smette di battere, e più in basso, molto più in basso, il colpo
            lontano continua.

            In superficie Ragh ti lascia la bipenne e davanti ai clan dice che
            da oggi sei il suo occhio. Gedda ti mette in mano una borsa pesante
            della Pece, e i tamburi suonano fino all'alba.
          pe: { tecnologia: 5 }
          almeno: { rep.ghoran: 10 }
          imposta: { ghoran.patto: 2 }
          effetti: { fazione.ghoran: 1, monete: 80, oggetto.ghoran-bipenne-di-ragh: 1, dono.ghoran: 1 }
        fallimento:
          titolo: Le radici del collo
          testo: |
            Cerchi la piastra fra le radici del collo, e le radici si chiudono
            sulla tua mano. Il custode si gira. Ragh ti tira via e tutti e due
            correte verso la porta, che si chiude a un palmo dai vostri talloni.
          effetti: { ferite: 1.5, contaminazione: 1 }
      - testo: "Ordinargli di dormire"
        descrizione: "La formula del Comando parla alle macchine dei Precursori nella loro lingua. Questa aspetta un ordine da prima di Ghoran."
        incantesimo: comando
        prova: { attributo: mentale, abilita: magia, difficolta: Difficile }
        successo:
          titolo: Dormi
          testo: |
            Dici la formula, e la parola ti esce in una lingua che non è tua.
            Il custode ti guarda con l'occhio di Ragh e poi lo chiude, mentre
            le radici della camera si afflosciano sul pavimento. Il Seme rallenta
            fino a battere appena, a tempo con il colpo lontano che sale da
            sotto.

            In superficie Ragh ti lascia la bipenne e davanti ai clan dice che
            da oggi sei il suo occhio. Gedda ti mette in mano una borsa pesante
            della Pece, e i tamburi suonano fino all'alba.
          pe: { magia: 5 }
          almeno: { rep.ghoran: 10 }
          imposta: { ghoran.patto: 1 }
          effetti: { fazione.ghoran: 1, monete: 80, oggetto.ghoran-bipenne-di-ragh: 1, dono.ghoran: 1 }
        fallimento:
          titolo: La parola spezzata
          testo: |
            La formula ti si spezza in bocca a metà, e il custode sente soltanto
            la prima parte. Si muove. Ragh ti trascina fuori dalla camera e la
            porta si richiude, e la testa ti pulsa per tutta la risalita.
          effetti: { tormento: 1.5, ferite: 1 }
      - testo: "Salire sul piatto davanti al custode"
        descrizione: "Ti guarda come il vecchio della bilancia. Sai come si sta fermi mentre qualcuno decide quanto vali, e quando smette di decidere."
        quando: [origine.fuggiasco-di-ghoran >= 1]
        prova: { attributo: mentale, abilita: resilienza, difficolta: Difficile }
        successo:
          titolo: Fermo sul piatto
          testo: |
            Ti metti davanti al custode con le braccia lungo i fianchi e i
            talloni uniti come sul piatto, e lasci che ti guardi. Lo fa a
            lungo. Poi l'occhio si chiude, come si chiude una pesata, e le
            radici della camera si afflosciano. Il Seme rallenta fino a battere
            appena, a tempo con il colpo lontano che sale da sotto.

            In superficie Ragh ti lascia la bipenne e davanti ai clan dice che
            da oggi sei il suo occhio. Gedda ti mette in mano una borsa pesante
            della Pece, e i tamburi suonano fino all'alba.
          pe: { resilienza: 5 }
          almeno: { rep.ghoran: 10 }
          imposta: { ghoran.patto: 1 }
          effetti: { fazione.ghoran: 1, monete: 80, oggetto.ghoran-bipenne-di-ragh: 1, dono.ghoran: 1 }
        fallimento:
          titolo: La schiena che si curva
          testo: |
            Sotto lo sguardo del custode la schiena ti si curva da sola come
            nella fila, e il custode lo prende per una risposta. Allunga la
            mano. Ragh si mette in mezzo e ti riporta su per la catena.
          effetti: { tormento: 1.5, ferite: 0.5 }
