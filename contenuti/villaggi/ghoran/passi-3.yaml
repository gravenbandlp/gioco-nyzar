# La quest di Ghoran, la fine dell'Atto IV e l'Atto V (fazione.ghoran 11 → 15).
# - 11 → 12 `ghoran-parente-di-clan` (grado 4, Parente di clan): i clan ti segnano come parente, Oska ti cuce la
#   pelle della Fossa, e Ragh vuole sapere della porta e della bipenne (ghoran.parente).
# - 12 → 13 `ghoran-l-occhio-di-ragh`: Ragh racconta l'inverno delle tre Fosse e il patto per cui ha perso l'occhio.
# - 13 → 14 `ghoran-la-notte-dei-tamburi`: Ostrav e Tasha vogliono nutrire la Fossa con il sangue comprato, e la notte
#   prima della discesa il Guado prova a tagliare la catena. Le varianti (Tibbo libero, Lucia Malgrani a Ghoran dopo
#   pista.pelle >= 7, il dente del verro) sono opzioni con `quando` o chiavi.
# - 14 → 15 `ghoran-oltre-la-porta` (grado 5, Occhio di Ragh): la camera del Seme e il suo custode (boss finale). Il
#   patto si rinnova o la radice madre si taglia (ghoran.patto); in ogni caso la bipenne di Ragh e dono.ghoran.
# Il Seme batte a tempo con qualcosa più in basso: nessuno, a Ghoran, sa dire che cosa (la Campana Sepolta).
storylet:
  # ------------------------------------------------------------ 11 → 12 · parente di clan (grado 4)
  - id: ghoran-parente-di-clan
    presso: ghoran
    immagine: ambientazione/ghoran
    titolo: Parente di clan
    sommario: "Sei risalito vivo dalla Fossa, e i clan vengono uno alla volta a chiamarti parente."
    luogo: Ghoran, la sala lunga di Ragh Kor'Nul
    area: superficie-fratturata
    requisiti: [fazione.ghoran == 11]
    testo: |
      Il giorno dopo i capi dei clan entrano uno alla volta nella sala lunga e
      ti toccano il petto con la mano aperta, il saluto fra parenti. Gedda ti
      lascia sulla giubba un'impronta nera di resina, e Ostrav, per ultimo, ti
      sfiora con due dita che poi si pulisce sull'anello di cera verde.

      Quando se ne vanno resta soltanto Ragh, sulla sua sedia nera, con Oska
      che in un angolo cuce una pelle di verro. Batte le nocche due volte.
      «Hai visto la porta» dice. «E hai visto la mia bipenne. Dimmi chi c'era
      davanti.»

      {empatia Media} Lo sa già, e vuole sentirlo dire da un altro per essere
      sicuro di non esserselo sognato per diciannove anni.

      {origine fuggiasco-di-ghoran} I clan che ti toccano il petto sono gli
      stessi che compravano dalla fila.
    opzioni:
      - testo: "Raccontargli del verro, senza nascondere niente"
        descrizione: "Un verro grande come un carro, con le radici nella schiena e l'orecchio a tacche dei recinti."
        prova: { attributo: sociale, abilita: [empatia, persuasione], difficolta: Media }
        successo:
          titolo: Il verro di Ragh
          testo: |
            Glielo racconti piano, e Ragh ascolta con l'occhio chiuso. Il verro era
            suo, cresciuto da porcello nella sala lunga e lasciato giù a guardare la
            porta. Oska ti mette addosso la pelle di verro conciata nelle pozze,
            quella che porta chi risale dalla Fossa.
          pe: { empatia: 5 }
          almeno: { rep.ghoran: 8 }
          imposta: { ghoran.parente: 1 }
          effetti: { fazione.ghoran: 1, monete: 50, oggetto.ghoran-pelle-della-fossa: 1 }
        fallimento:
          titolo: Le parole sbagliate
          testo: |
            Lo racconti come una caccia, e Ragh ti ferma con una mano alzata perché quel
            verro l'ha cresciuto lui da porcello. Oska ti mette addosso la pelle di chi
            risale dalla Fossa, stringendo le cinghie più del necessario.
          almeno: { rep.ghoran: 8 }
          imposta: { ghoran.parente: 1 }
          effetti: { fazione.ghoran: 1, monete: 50, oggetto.ghoran-pelle-della-fossa: 1, tormento: 0.5 }
      - testo: "Mettergli in mano la zanna del verro"
        descrizione: "La zanna che hai portato su parla meglio di un racconto, e Ragh la riconoscerà."
        requisiti: [chiave.dente-del-verro >= 1]
        esito:
          titolo: La zanna
          testo: |
            Ragh gira la zanna fra le dita e dice che quel verro l'aveva cresciuto
            lui da porcello, prima di lasciarlo giù a guardare la porta. Ti rende la
            zanna, e Oska ti mette addosso la pelle di chi risale dalla Fossa.
          almeno: { rep.ghoran: 8 }
          imposta: { ghoran.parente: 1 }
          effetti: { fazione.ghoran: 1, monete: 50, oggetto.ghoran-pelle-della-fossa: 1, rep.ghoran: 0.5 }
      - testo: "Chiedergli prima della bipenne"
        descrizione: "Una bipenne piantata in una radice davanti a una porta è un pegno."
        prova: { attributo: sociale, abilita: [intimidire, galateo], difficolta: Difficile }
        successo:
          titolo: Il pegno
          testo: |
            Gli chiedi della bipenne prima che lui ti chieda del verro, e Ragh
            ride dal fondo del petto, perché sei il primo in diciannove anni a
            pesare lui. Del patto ti parlerà quando sarai pronto, e intanto Oska
            ti mette addosso la pelle di chi risale dalla Fossa.
          pe: { intimidire: 5 }
          almeno: { rep.ghoran: 8 }
          imposta: { ghoran.parente: 1 }
          effetti: { fazione.ghoran: 1, monete: 50, oggetto.ghoran-pelle-della-fossa: 1, rep.ghoran: 0.5 }
        fallimento:
          titolo: La domanda troppo presto
          testo: |
            Ragh batte forte le nocche e ti dice che le domande le fa chi siede
            sulla sedia, poi si fa raccontare del verro. Oska ti mette addosso la
            pelle di chi risale dalla Fossa senza guardarti in faccia.
          almeno: { rep.ghoran: 8 }
          imposta: { ghoran.parente: 1 }
          effetti: { fazione.ghoran: 1, monete: 50, oggetto.ghoran-pelle-della-fossa: 1, scandalo: 0.5 }
      - testo: "Dirgli soltanto che la bipenne è ancora lì"
        descrizione: "Ragh vuole sapere una cosa sola, anche se ne chiede un'altra."
        esito:
          titolo: Ancora lì
          testo: |
            Gli dici che la bipenne è ancora piantata nella radice, e Ragh resta
            con l'occhio chiuso finché Oska finisce l'ultima cucitura. Poi ti fa
            mettere addosso la pelle di chi risale dalla Fossa, e del resto
            parlerete un'altra notte.
          almeno: { rep.ghoran: 8 }
          imposta: { ghoran.parente: 1 }
          effetti: { fazione.ghoran: 1, monete: 50, oggetto.ghoran-pelle-della-fossa: 1 }

  # ------------------------------------------------------------ 12 → 13 · l'occhio di Ragh
  - id: ghoran-l-occhio-di-ragh
    presso: ghoran
    immagine: ambientazione/ghoran
    titolo: L'occhio di Ragh
    sommario: "Ragh si toglie la benda e ti racconta il patto fatto sotto il campo."
    luogo: Ghoran, la sala lunga di notte
    area: superficie-fratturata
    requisiti: [fazione.ghoran == 12]
    testo: |
      A notte fonda Ragh ha mandato via Vesna dalla sala lunga. Si slaccia
      la benda, e al posto dell'occhio c'è una cicatrice scura e liscia come
      pietra, con righe nere che partono dal bordo.

      «L'inverno delle tre Fosse» dice piano, guardando il fuoco. «Tre
      dispute in un mese, poi una ogni settimana, e le radici salivano fino
      alle pozze sotto le case. Sono sceso con il verro e la bipenne fino
      alla porta, che si è aperta di un palmo, e da dentro mi hanno chiesto
      una cosa che guarda. Gliel'ho data, e le radici sono tornate giù.»

      {resilienza Difficile} Le righe nere intorno all'orbita si muovono a
      tempo con il colpo che sale dal campo.

      *Si è fatto togliere un occhio per un villaggio che lo pesa ogni
      giorno.* «Adesso battono senza sangue» dice, rimettendosi la benda.
      «Io scendo, e stavolta oltre la porta ci passo, con te.»
    opzioni:
      - testo: "Chiedergli che cosa c'è dietro la porta"
        descrizione: "Ragh ha visto un palmo di porta aperta, e più di quanto dice."
        prova: { attributo: sociale, abilita: [empatia, persuasione], difficolta: Media }
        successo:
          titolo: Un palmo di porta
          testo: |
            Ragh ci pensa a lungo. Dietro la porta c'era una luce grigia e una
            cosa nera grande come una casa che batteva, con davanti una figura di
            metallo. La mano che gli ha preso l'occhio era fredda come un ferro
            d'inverno. Si parte fra due notti, dopo il voto dei clan.
          pe: { empatia: 3 }
          effetti: { fazione.ghoran: 1, rep.ghoran: 0.5 }
        fallimento:
          titolo: La benda
          testo: |
            Glielo chiedi troppo in fretta, e Ragh si rimette la benda senza
            rispondere. Dice soltanto che si parte fra due notti, quando i
            clan avranno votato, e che quello che c'è dietro la porta lo
            vedrai da te.
          effetti: { fazione.ghoran: 1, tormento: 0.5 }
      - testo: "Dirgli che non scende da solo con te soltanto"
        descrizione: "Se il capo scende, qualcuno di fidato deve tenere la catena in alto."
        prova: { attributo: sociale, abilita: [politica-ed-economia, persuasione], difficolta: Media }
        successo:
          titolo: La catena in alto
          testo: |
            Gli dici che la catena va tenuta da qualcuno di fidato, perché il
            Guado aspetta proprio questo, e Ragh la affida alla Pece. Si parte fra
            due notti, dopo il voto dei clan alla bilancia.
          pe: { politica-ed-economia: 3 }
          effetti: { fazione.ghoran: 1, rep.ghoran: 0.5 }
        fallimento:
          titolo: La sedia nera
          testo: |
            Gli dici che un capo non dovrebbe scendere, e Ragh ti risponde che
            il capo l'ha fatto la Fossa diciannove anni fa, e che adesso se lo
            riprende se vuole. Si parte dopo il voto dei clan, fra due notti.
          effetti: { fazione.ghoran: 1, scandalo: 0.5 }
      - testo: "Restare con lui fino all'alba senza parlare"
        descrizione: "Il resto si aspetta insieme, davanti al fuoco."
        costo: 2
        esito:
          titolo: Il fuoco spento
          testo: |
            Resti con lui finché il fuoco si spegne. All'alba Ragh ti batte due
            volte la mano sulla spalla come sul bracciolo. Si parte dopo il voto
            dei clan.
          effetti: { fazione.ghoran: 1, tormento: 0.5 }
      - testo: "Toccargli la cicatrice con le dita del Velo"
        descrizione: "Al Velo si impara a toccare anche le ferite che non sanguinano."
        quando: [origine.accolito-del-velo >= 1]
        esito:
          titolo: Le dita del Velo
          testo: |
            Ragh abbassa la testa al tuo sguardo, e appoggi due dita sulla
            cicatrice come ti hanno insegnato i confessori della Cattedrale.
            Batte, lenta, finché Ragh ti allontana il polso senza durezza. Si
            parte dopo il voto, fra due notti.
          pe: { resilienza: 3 }
          effetti: { fazione.ghoran: 1, rep.ghoran: 0.5 }

  # ------------------------------------------------------------ 13 → 14 · la notte dei tamburi
  - id: ghoran-la-notte-dei-tamburi
    presso: ghoran
    immagine: ambientazione/ghoran
    titolo: La notte dei tamburi
    sommario: "I clan votano alla bilancia se Ragh può scendere, e Ostrav vuole nutrire la Fossa con sangue comprato."
    luogo: Ghoran, la bilancia del mercato e il campo dei gladiatori
    area: superficie-fratturata
    requisiti: [fazione.ghoran == 13]
    testo: |
      Alla bilancia del mercato i capi stanno in cerchio con le torce, e Ragh
      in mezzo, in piedi. Ostrav dice che nutrire la Fossa costa meno che
      perdere il capo dei clan oltre una porta, e accanto a lui Tasha la
      Bianca offre la sua merce a prezzo di costo, per il bene delle anime.
      Dalla finestra della casa di pietra, oltre la pozza, la vecchia Mendion
      guarda con una lanterna accanto.

      {politica-ed-economia Difficile} Se Ragh non risale, Ostrav è il
      prossimo sulla sedia nera.

      {intimidire Media} Due uomini del Guado si staccano dal cerchio e vanno
      verso il campo, dove la Pece tiene la catena della grata.
    opzioni:
      - testo: "Parlare ai clan contro il sangue comprato"
        descrizione: "Chi è sceso nella Fossa ne parla con più diritto di chi la vuole nutrire."
        prova: { attributo: sociale, abilita: persuasione, difficolta: Difficile }
        successo:
          titolo: Il voto
          testo: |
            Racconti ai clan quello che hai visto di sotto, dalle ossa dell'inverno al verro
            con le radici nella schiena, e chiedi chi vuole rifare quell'inverno con la
            carne comprata. Il piatto di Ragh scende mentre la Pece ferma i due del Guado
            accanto alla catena, e all'alba si scende.
          pe: { persuasione: 5 }
          effetti: { fazione.ghoran: 1, rep.ghoran: 0.5 }
        fallimento:
          titolo: Il voto stretto
          testo: |
            Ostrav ti interrompe a metà per chiederti il prezzo di quello che
            dici, e il voto passa per una pietra. Tasha si riporta a casa la sua
            merce, e più tardi la Pece trova la catena della grata segata a metà e
            la cambia prima dell'alba.
          effetti: { fazione.ghoran: 1, scandalo: 0.5 }
      - testo: "Andare a guardia della catena"
        descrizione: "Il voto si fa anche senza di te, mentre il Guado va verso la catena."
        combattimento: ghoran-gli-uomini-del-guado
        vittoria:
          titolo: La catena
          testo: |
            Li trovi accanto alla grata con un seghetto da ferro e un coltello per
            chi tiene la catena. Quando restano a terra li porti per il bavero
            alla bilancia, e il voto lo vince Ragh senza che nessuno parli.
          effetti: { fazione.ghoran: 1, rep.ghoran: 0.5 }
        sconfitta:
          titolo: La catena segata
          testo: |
            Ti lasciano a terra accanto alla grata e scappano con il seghetto,
            ma la catena l'hanno segata soltanto a metà. La Pece la cambia
            prima dell'alba, e alla bilancia il voto lo vince Ragh per una
            pietra.
          effetti: { fazione.ghoran: 1, tormento: 0.5 }
      - testo: "Seguirli nel buio e prenderli sul fatto"
        descrizione: "Due uomini con un seghetto non fanno rumore, finché non cominciano a segare."
        prova: { attributo: fisico, abilita: furtivita, difficolta: Media }
        successo:
          titolo: Il seghetto
          testo: |
            Aspetti sotto le gradinate il primo colpo di seghetto e chiami Vesna,
            e la Pece li circonda con le torce. Alla bilancia, con il seghetto
            ancora in mano a loro, il voto lo vince Ragh mentre Ostrav guarda da
            un'altra parte.
          pe: { furtivita: 3 }
          effetti: { fazione.ghoran: 1, rep.ghoran: 0.5 }
        fallimento:
          titolo: Il gradino che scricchiola
          testo: |
            Un gradino scricchiola sotto il tuo piede, e i due scappano lasciando
            la catena segata a metà. La Pece la cambia prima dell'alba, e alla
            bilancia il voto lo vince Ragh per una pietra.
          effetti: { fazione.ghoran: 1, sospetto: 0.5 }
      - testo: "Restare tutta la notte con la Pece accanto alla catena"
        descrizione: "Venti torce bastano a guardare una catena, però il voto va avanti senza di te."
        costo: 2
        esito:
          titolo: Venti torce
          testo: |
            Passi la notte accanto alla grata con la Pece, e nessuno si avvicina
            alla catena. Al mattino Vesna ti dice che Ragh ha vinto per una
            pietra, e che Ostrav ha votato per ultimo.
          effetti: { fazione.ghoran: 1, tormento: 0.5 }
      - testo: "Mostrare ai clan la zanna del verro"
        descrizione: "Chi vede la zanna con la radice intorno sa da dove viene."
        requisiti: [chiave.dente-del-verro >= 1]
        prova: { attributo: sociale, abilita: [intimidire, espressivita], difficolta: Media }
        successo:
          titolo: La zanna sul piatto
          testo: |
            Posi la zanna sul piatto della bilancia, con la radice nera ancora intorno,
            e il piatto scende. I capi votano per Ragh uno dopo l'altro e Tasha porta
            via la sua merce senza una parola, mentre la Pece ferma i due del Guado
            accanto alla catena.
          pe: { intimidire: 3 }
          effetti: { fazione.ghoran: 1, rep.ghoran: 0.5 }
        fallimento:
          titolo: La zanna e il prezzo
          testo: |
            Posi la zanna sul piatto, e Ostrav chiede a voce alta quanto vale
            un osso di porco. Ridono in pochi, ma ridono. Il voto lo vince Ragh
            per una pietra, e più tardi la Pece trova la catena segata a metà e
            la cambia prima dell'alba.
          effetti: { fazione.ghoran: 1, scandalo: 0.5 }
      - testo: "Ascoltare quello che Tibbo ha da dirti"
        descrizione: "Tibbo è libero, e sente quello che il Guado dice a voce bassa."
        quando: [ghoran.verdetto == 1]
        esito:
          titolo: Le dita di Tibbo
          testo: |
            Prima del voto Tibbo ti avverte con le dita di due uomini del Guado
            con un seghetto, diretti alla catena. La Pece li aspetta sotto le
            gradinate, e il voto lo vince Ragh senza che Ostrav apra bocca.
          effetti: { fazione.ghoran: 1, rep.ghoran: 0.5 }
      - testo: "Chiedere a Lucia Malgrani di parlare con la zia"
        descrizione: "Una parola della vecchia Urtilia, zia di Lucia, vale molti voti."
        quando: [pista.pelle >= 7]
        esito:
          titolo: La casa di pietra
          testo: |
            Lucia Malgrani ti ascolta sulla soglia della casa di pietra con un
            bambino in braccio, poi sale le scale. Poco dopo la lanterna alla
            finestra si sposta da sinistra a destra, e due capi cambiano piatto
            alla loro pietra. Il voto lo vince Ragh, e la Pece ferma i due del
            Guado.
          effetti: { fazione.ghoran: 1, rep.ghoran: 0.5 }
      - testo: "Raccontare ai clan la fila della bilancia"
        descrizione: "La carne che Tasha offre l'hai vista dalla parte del piatto."
        quando: [origine.fuggiasco-di-ghoran >= 1]
        esito:
          titolo: Dalla parte del piatto
          testo: |
            Racconti ai clan la fila prima della pesata, dal più grosso al più
            piccolo, guardando Tasha. Nessuno ti interrompe, e i capi votano per
            Ragh con le pietre già in mano, mentre la Pece ferma i due del Guado
            accanto alla catena.
          pe: { persuasione: 3 }
          effetti: { fazione.ghoran: 1, rep.ghoran: 0.5 }

  # ------------------------------------------------------------ 14 → 15 · oltre la porta (grado 5)
  - id: ghoran-oltre-la-porta
    presso: ghoran
    immagine: bestiario/salvaguardia-precursori
    titolo: Oltre la porta
    sommario: "Ragh strappa la bipenne dalla radice, e la porta si apre sul Seme."
    luogo: La Fossa del Seme, oltre la porta dell'ascia
    area: superficie-fratturata
    requisiti: [fazione.ghoran == 14]
    testo: |
      Scendete in due per la catena, che la Pece tiene dall'alto con le torce. In
      fondo alla Fossa Ragh strappa la bipenne dalla radice con un colpo solo, e
      mentre cola una linfa scura la porta di pietra si apre, adagio, verso
      l'interno.

      Nella camera, più grande dell'arena di sopra, sta una massa nera e liscia a
      forma di seme, grande come una casa, da cui partono tutte le radici della
      Fossa, e a ogni colpo la luce grigia del pavimento trema. Davanti al Seme c'è
      una figura di metallo nero alta due volte un uomo, con le radici dentro le
      giunture. Ha un occhio solo, e lo gira verso Ragh.

      {tecnologia Difficile} È una macchina dei Precursori, di quelle che
      custodiscono, e la tengono in piedi le radici, come il verro.

      {resilienza Media} Il Seme batte a tempo con un colpo che viene da molto più
      in basso.

      Ragh ti mette in mano la bipenne. «Io gliel'ho data» dice. «Tu riprenditela.»

      {origine fuggiasco-di-ghoran} Il custode ti guarda come il vecchio della
      bilancia, dalla testa ai piedi, e tu sai stare fermo.
    opzioni:
      - testo: "Affrontare il custode del Seme"
        descrizione: "Una macchina dei Precursori alta il doppio di te, contro la bipenne di Ragh."
        combattimento: ghoran-il-custode
        vittoria:
          titolo: La radice madre
          testo: |
            Il custode cade in ginocchio e l'occhio si chiude. Tagli la radice
            madre dove entra nel pavimento, e il Seme smette di battere, mentre
            più in basso il colpo lontano continua.

            In superficie Ragh ti lascia la bipenne e ti nomina suo occhio davanti
            ai clan, mentre Gedda ti mette in mano una borsa della Pece.
          almeno: { rep.ghoran: 10 }
          imposta: { ghoran.patto: 2 }
          effetti: { fazione.ghoran: 1, monete: 80, oggetto.ghoran-bipenne-di-ragh: 1, dono.ghoran: 1 }
        sconfitta:
          titolo: La mano fredda
          testo: |
            Il custode ti prende per la gola con una mano fredda come un ferro
            d'inverno, e Ragh te lo stacca di dosso a mani nude. Risalite la
            catena trascinandovi a vicenda, mentre la porta si richiude dietro
            di voi. Ragh ti ripete che si torna giù quando sei pronto.
          effetti: { tormento: 1 }
      - testo: "Rinnovare il patto con il tuo sangue"
        descrizione: "Chi è parente di tutti i clan può dare da bere al Seme e chiedergli di dormire."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Difficile }
        successo:
          titolo: Il sangue del peso
          testo: |
            Ti tagli il palmo con la bipenne e lo appoggi sul Seme, che beve
            finché il custode chiude l'occhio e le radici si afflosciano. Ragh ti
            fascia la mano con la sua benda.

            In superficie Ragh ti lascia la bipenne e ti nomina suo occhio davanti
            ai clan, mentre Gedda ti mette in mano una borsa della Pece.
          pe: { resilienza: 5 }
          almeno: { rep.ghoran: 10 }
          imposta: { ghoran.patto: 1 }
          effetti: { fazione.ghoran: 1, monete: 80, oggetto.ghoran-bipenne-di-ragh: 1, dono.ghoran: 1, ferite: 1 }
        fallimento:
          titolo: Il Seme che beve
          testo: |
            Il Seme beve troppo e troppo in fretta, e Ragh ti strappa via per il
            braccio prima che le gambe ti cedano. Risalite la catena in due, con
            la tua mano che non stringe più.
          effetti: { ferite: 2, tormento: 1 }
      - testo: "Spegnere il custode come una macchina"
        descrizione: "Le macchine dei Precursori hanno una piastra per dormire, e questa ce l'ha sotto le radici."
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Difficile }
        successo:
          titolo: La piastra
          testo: |
            Mentre Ragh tiene impegnato il custode, tu premi la piastra fredda
            sotto le radici del collo e il custode si ferma a metà passo. Tagli la
            radice madre, e il Seme smette di battere, mentre più in basso il
            colpo lontano continua.

            In superficie Ragh ti lascia la bipenne e ti nomina suo occhio davanti
            ai clan, mentre Gedda ti mette in mano una borsa della Pece.
          pe: { tecnologia: 5 }
          almeno: { rep.ghoran: 10 }
          imposta: { ghoran.patto: 2 }
          effetti: { fazione.ghoran: 1, monete: 80, oggetto.ghoran-bipenne-di-ragh: 1, dono.ghoran: 1 }
        fallimento:
          titolo: Le radici del collo
          testo: |
            Cerchi la piastra fra le radici del collo, e le radici si chiudono
            sulla tua mano. Il custode si gira. Ragh ti tira via e tutti e due
            correte verso la porta, che si chiude a un palmo dai vostri talloni.
          effetti: { ferite: 1.5, contaminazione: 1 }
      - testo: "Ordinargli di dormire"
        descrizione: "La formula del Comando parla alle macchine dei Precursori, e questa aspetta un ordine."
        incantesimo: comando
        prova: { attributo: mentale, abilita: magia, difficolta: Difficile }
        successo:
          titolo: Dormi
          testo: |
            Dici la formula in una lingua che non è tua, e il custode ti guarda
            con l'occhio di Ragh prima di chiuderlo. Il Seme rallenta fino a
            battere appena, a tempo con il colpo lontano che sale da sotto.

            In superficie Ragh ti lascia la bipenne e ti nomina suo occhio davanti
            ai clan, mentre Gedda ti mette in mano una borsa della Pece.
          pe: { magia: 5 }
          almeno: { rep.ghoran: 10 }
          imposta: { ghoran.patto: 1 }
          effetti: { fazione.ghoran: 1, monete: 80, oggetto.ghoran-bipenne-di-ragh: 1, dono.ghoran: 1 }
        fallimento:
          titolo: La parola spezzata
          testo: |
            La formula ti si spezza in bocca a metà, e il custode sente soltanto
            la prima parte. Si muove. Ragh ti trascina fuori dalla camera e la
            porta si richiude, e la testa ti pulsa per tutta la risalita.
          effetti: { tormento: 1.5, ferite: 1 }
      - testo: "Salire sul piatto davanti al custode"
        descrizione: "Ti guarda come il vecchio della bilancia, e tu sai stare fermo mentre qualcuno decide quanto vali."
        quando: [origine.fuggiasco-di-ghoran >= 1]
        prova: { attributo: mentale, abilita: resilienza, difficolta: Difficile }
        successo:
          titolo: Fermo sul piatto
          testo: |
            Ti metti davanti al custode con i talloni uniti come sul piatto, e
            lasci che ti guardi. Poi l'occhio si chiude, come si chiude una
            pesata, e il Seme rallenta fino a battere appena, a tempo con il colpo
            lontano.

            In superficie Ragh ti lascia la bipenne e ti nomina suo occhio davanti
            ai clan, mentre Gedda ti mette in mano una borsa della Pece.
          pe: { resilienza: 5 }
          almeno: { rep.ghoran: 10 }
          imposta: { ghoran.patto: 1 }
          effetti: { fazione.ghoran: 1, monete: 80, oggetto.ghoran-bipenne-di-ragh: 1, dono.ghoran: 1 }
        fallimento:
          titolo: La schiena che si curva
          testo: |
            Sotto lo sguardo del custode la schiena ti si curva da sola come
            nella fila, e il custode lo prende per una risposta. Allunga la
            mano. Ragh si mette in mezzo e ti riporta su per la catena.
          effetti: { tormento: 1.5, ferite: 0.5 }
