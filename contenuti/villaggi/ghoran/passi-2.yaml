# La quest di Ghoran, Atto III e l'inizio dell'Atto IV (fazione.ghoran 6 → 10).
# - 6 → 7 `ghoran-la-casa-bianca`: Tasha la Bianca sa che la Gilda la vuole morta in un incidente, e chiede al peso
#   dei clan di pesare i suoi uomini. Le varianti di gilda.tasha (il passo 10 della Gilda) sono opzioni con `quando`.
# - 7 → 8 `ghoran-il-recinto-di-notte`: l'uomo comprato dalla Gilda vuole dare fuoco al recinto, e dentro c'è la
#   merce di domani. La scelta sugli schiavi (ghoran.schiavi 1 aperto, 2 riscattati i più piccoli, 3 chiuso).
# - 8 → 9 `ghoran-l-incidente` (grado 3, Torcia di pece): all'asta del mattino arrivano i sicari della Gilda, e Ragh
#   pesa l'ospitalità di Ghoran. La Pece ti dà la sua lancia.
# - 9 → 10 `ghoran-le-radici-senza-sangue`: i tamburi tacciono, e nella Fossa le radici battono senza che nessuno
#   abbia versato sangue (il segno della Campana, che nessuno spiega). Ostrav vuole nutrirla, Gedda chiuderla, e
#   Ragh manda giù il peso.
# Nomi nuovi: Corvo (la guardia di Tasha pagata dalla Gilda), la casa di pietra della vecchia Mendion (Urtilia).
storylet:
  # ------------------------------------------------------------ 6 → 7 · la casa bianca
  - id: ghoran-la-casa-bianca
    presso: ghoran
    immagine: ambientazione/ghoran
    titolo: La casa bianca
    sommario: "L'unica palafitta di Ghoran dipinta di calce è di Tasha la Bianca, che ti manda a chiamare."
    luogo: Ghoran, la palafitta di Tasha la Bianca
    area: superficie-fratturata
    requisiti: [fazione.ghoran == 6]
    testo: |
      La mattina dopo il verdetto un ragazzo ti lega un nastro bianco al
      polso e ti porta all'unica palafitta di Ghoran dipinta di calce,
      pulita come sulle passerelle non si vede mai. Dalla finestra si vede
      la casa di pietra della vecchia Mendion, l'unica che non sta su pali.

      Tasha la Bianca, vestita di bianco fino ai polsi, ti offre il tè prima
      di parlare. «Cara anima» dice, con una voce che non si alza mai. «La
      Gilda dei Mercanti mi vuole morta in un incidente, perché gli
      incidenti a Ghoran non si pesano, e uno dei miei uomini ha preso il
      loro argento. Pesami i miei uomini, e domani alla vendita ti lascio
      guardare la merce da vicino.»

      {empatia Media} Ha paura, e la tiene piegata come una tovaglia.

      {origine fuggiasco-di-ghoran} Nei recinti Tasha la nominavano a bassa
      voce, come il tempo che cambia.
    opzioni:
      - testo: "Guardare i suoi uomini mentre fanno la guardia"
        descrizione: "Chi ha preso l'argento della Gilda ha qualcosa di nuovo addosso, o qualcosa che non guarda più."
        prova: { attributo: mentale, abilita: percezione, difficolta: Media }
        successo:
          titolo: Gli stivali nuovi
          testo: |
            Delle sei guardie della casa bianca una sola ha gli stivali nuovi, di
            cuoio di città, e non guarda mai la porta del recinto. Lo chiamano
            Corvo. Tasha annuisce senza sorpresa e ti chiede di guardarlo
            stanotte, perché un incidente si fa la notte prima della vendita.
          pe: { percezione: 3 }
          effetti: { fazione.ghoran: 1, rep.ghoran: 0.5 }
        fallimento:
          titolo: Sei facce
          testo: |
            A sera le sei guardie ti sembrano tutte colpevoli. Tasha ti ascolta
            con pazienza, poi ti dice che lei sospetta di quello che chiamano
            Corvo, e ti chiede di guardarlo stanotte.
          effetti: { fazione.ghoran: 1, sospetto: 0.5 }
      - testo: "Farle domande sulla sua merce"
        descrizione: "Chi vende uomini e dice di liberarli ha una risposta pronta, e serve quella che non ha."
        prova: { attributo: sociale, abilita: [galateo, empatia], difficolta: Media }
        successo:
          titolo: La sofferenza che libera
          testo: |
            Tasha ti risponde che ogni anima si libera soffrendo. Quando le chiedi
            dove va la merce di domani la tazza le resta a mezz'aria, e dice
            soltanto che va a un compratore sgradito alla Gilda. Poi ti chiede di
            guardare stanotte la guardia che chiamano Corvo.
          pe: { galateo: 3 }
          effetti: { fazione.ghoran: 1, rep.ghoran: 0.5 }
        fallimento:
          titolo: La risposta pronta
          testo: |
            Le chiedi degli dei, e Tasha ti risponde per mezz'ora con una calma
            che ti fa venire freddo alle mani, prima di chiederti di guardare
            stanotte la guardia che chiamano Corvo.
          effetti: { fazione.ghoran: 1, tormento: 0.5 }
      - testo: "Restare a dormire nella casa bianca"
        descrizione: "Un ospite vede le guardie da dentro, se regge una notte in un letto troppo pulito."
        costo: 2
        esito:
          titolo: Il letto bianco
          testo: |
            All'alba, dalla stuoia bianca, senti una guardia uscire dalla porta di
            servizio e tornare a mani vuote. È quella che chiamano Corvo, e Tasha
            ti chiede di guardarlo stanotte.
          effetti: { fazione.ghoran: 1, tormento: 0.5 }
      - testo: "Dirle che all'approdo delle chiatte il cavo l'hai allentato tu"
        descrizione: "Tasha si ricorda la faccia di chi era all'argano, tanto vale che lo senta da te."
        quando: [gilda.tasha == 1]
        esito:
          titolo: Il cavo
          testo: |
            Glielo dici guardandola in faccia. Tasha posa la tazza e risponde che
            le anime cadute nella Cicatrice sono libere da un pezzo, e tu invece
            no, poi ti chiede di guardare stanotte la guardia che chiamano Corvo,
            perché un debito si paga anche così.
          effetti: { fazione.ghoran: 1, tormento: 1 }
      - testo: "Ricordarle le due parole all'approdo"
        descrizione: "All'approdo delle chiatte l'hai avvertita del cavo, e Tasha si ricorda anche i debiti suoi."
        quando: [gilda.tasha == 2]
        esito:
          titolo: Il nastro bianco
          testo: |
            Tasha sorride per la prima volta e tocca il nastro bianco al tuo
            polso, lo stesso della borsa di quella sera. Dice che un'anima che
            avverte vale più di una che pesa e ti chiede di guardare Corvo
            stanotte, con una borsa per il disturbo.
          effetti: { fazione.ghoran: 1, monete: 15, rep.ghoran: 0.5 }
      - testo: "Dirle che la merce dell'approdo l'hai liberata tu"
        descrizione: "Le undici persone del carro all'approdo sono andate per la loro strada, e Tasha sa chi è stato."
        quando: [gilda.tasha == 4]
        esito:
          titolo: La merce perduta
          testo: |
            Tasha ti ascolta con le mani in grembo e ti risponde che quella merce le è
            costata un inverno, e che le anime che scappano soffrono più a lungo. Poi,
            come se il carro non fosse mai esistito, ti chiede di guardare stanotte la
            guardia che chiamano Corvo.
          effetti: { fazione.ghoran: 1, sospetto: 0.5 }
      - testo: "Chiederle di vedere i contratti delle guardie"
        descrizione: "Una guardia pagata anche dalla Gilda ha un contratto in più, scritto meglio."
        quando: [origine.mercante-dei-ponti >= 1]
        esito:
          titolo: Il contratto in più
          testo: |
            Nella cassetta bianca dei contratti, quello di Corvo ha la piega che
            la Casa dei Nodi fa alle lettere dei magazzini, con un segno a matita
            dentro. Tasha lo guarda e ti chiede di guardare Corvo stanotte.
          pe: { politica-ed-economia: 3 }
          effetti: { fazione.ghoran: 1, rep.ghoran: 0.5 }

  # ------------------------------------------------------------ 7 → 8 · il recinto di notte
  - id: ghoran-il-recinto-di-notte
    presso: ghoran
    immagine: ambientazione/ghoran
    titolo: Il recinto di notte
    sommario: "Corvo ha una tanica di pece e la chiave del recinto di Tasha, e stanotte decidi tu."
    luogo: Ghoran, il recinto di Tasha la Bianca
    area: superficie-fratturata
    requisiti: [fazione.ghoran == 7]
    testo: |
      Il recinto di Tasha è un capannone di canne e fango su una piattaforma
      di pali, chiuso da una sbarra di ferro. Dentro dormono quattordici
      persone legate a due a due, e le sei vicino alla porta sono bambini,
      che domani vanno in vendita per primi.

      A mezzanotte Corvo arriva senza lanterna, con una tanica di pece in
      una mano e la chiave della sbarra nell'altra, mentre le altre guardie
      dormono nel casotto. Un incendio di notte è un incidente pulito, di
      quelli che a Ghoran nessuno pesa.

      Quando gli avrai tolto la tanica, la chiave resterà nelle tue mani.

      {origine fuggiasco-di-ghoran} I nodi alle caviglie dei bambini sono
      quelli di allora, e le tue dita sanno dove si allentano.
    opzioni:
      - testo: "Fermare Corvo e aprire il recinto"
        descrizione: "Togliergli la tanica e poi alzare la sbarra, anche se a Ghoran nessuno dà asilo ai fuggiaschi."
        prova: { attributo: fisico, abilita: [furtivita, rissa], difficolta: Media }
        successo:
          titolo: La sbarra
          testo: |
            Stendi Corvo sulle assi prima che apra la tanica e alzi la sbarra. Le
            quattordici persone spariscono verso i canneti, i bambini in braccio
            ai grandi, e Corvo resta legato alla porta vuota con la sua corda,
            perché all'alba Tasha lo trovi lì.
          pe: { furtivita: 3 }
          imposta: { ghoran.schiavi: 1 }
          effetti: { fazione.ghoran: 1 }
        fallimento:
          titolo: Le guardie sveglie
          testo: |
            Corvo grida e dal casotto escono le guardie, ma alzi la sbarra lo
            stesso, e mentre ti tengono a terra i legati scappano nei canneti. Ne
            riprendono due, e Corvo resta legato alla porta.
          imposta: { ghoran.schiavi: 1 }
          effetti: { fazione.ghoran: 1, ferite: 1 }
      - testo: "Aprire il recinto passando sopra le guardie"
        descrizione: "Le guardie del casotto si svegliano al primo rumore, e si può fare lo stesso, a colpi."
        combattimento: ghoran-le-guardie-del-recinto
        vittoria:
          titolo: Il casotto
          testo: |
            Corvo scappa al primo colpo lasciando la tanica sulle assi, e le due
            guardie del casotto restano a terra davanti alla porta. Alzi la
            sbarra, e i legati spariscono verso i canneti con i bambini in
            braccio, senza voltarsi.
          imposta: { ghoran.schiavi: 1 }
          effetti: { fazione.ghoran: 1 }
        sconfitta:
          titolo: La sbarra a metà
          testo: |
            Le guardie ti tengono a terra con un ginocchio sul collo, ma la
            sbarra l'avevi già alzata a metà. Mentre ti picchiano i legati
            escono dalla fessura uno alla volta e spariscono nei canneti.
            Corvo, nella confusione, scappa con la tanica.
          imposta: { ghoran.schiavi: 1 }
          effetti: { fazione.ghoran: 1, tormento: 0.5 }
      - testo: "Fermare Corvo e riscattare i più piccoli"
        descrizione: "Tasha domani vende, e stanotte si può comprare a casa sua, con la guardia traditrice legata."
        requisiti: [monete >= 40]
        esito:
          titolo: Sei bambini
          testo: |
            Trascini Corvo legato alla casa bianca, e Tasha, in camicia da notte,
            per i sei bambini ti fa un prezzo onesto per Ghoran. All'alba i sei
            escono con te e Vesna li porta alla Pece, mentre gli altri otto vanno
            in vendita.
          imposta: { ghoran.schiavi: 2 }
          effetti: { fazione.ghoran: 1, monete: -40, rep.ghoran: 0.5 }
      - testo: "Fermare Corvo e lasciare chiuso il recinto"
        descrizione: "Tasha ti ha chiesto di pesare i suoi uomini, e la merce resta merce."
        prova: { attributo: fisico, abilita: [rissa, atletica], difficolta: Media }
        successo:
          titolo: La tanica
          testo: |
            Corvo ti vede quando sei già addosso, e la tanica rotola sulle assi
            senza aprirsi. Tasha lo guarda legato e dice che anche la sua anima un
            giorno sarà libera, e dentro il recinto chiuso un bambino si mette a
            piangere e smette subito.
          pe: { rissa: 3 }
          imposta: { ghoran.schiavi: 3 }
          effetti: { fazione.ghoran: 1, rep.ghoran: 0.5, tormento: 0.5 }
        fallimento:
          titolo: La pece sui pali
          testo: |
            Corvo apre la tanica prima che tu lo stenda, e la pece cola sui pali. Il
            fuoco resta spento, eppure i legati nel recinto piangono fino all'alba.
          imposta: { ghoran.schiavi: 3 }
          effetti: { fazione.ghoran: 1, tormento: 1 }
      - testo: "Parlare ai legati con le dita di Nella"
        descrizione: "Nella ti ha insegnato qualche segno della lingua dei legati, compreso quello per scappare."
        quando: [raschiatori.nella >= 1]
        esito:
          titolo: I segni di Nella
          testo: |
            Stendi Corvo e alzi la sbarra. Alla prima coppia fai il segno di Nella
            per scappare, e la donna davanti risponde con il segno per fratello e
            sveglia gli altri, che spariscono nei canneti.
          imposta: { ghoran.schiavi: 1 }
          effetti: { fazione.ghoran: 1 }
      - testo: "Dire ai legati da che parte si scappa"
        descrizione: "Nei recinti si parla con le dita, e tu sai quali canneti portano lontano dai cani."
        quando: [origine.fuggiasco-di-ghoran >= 1]
        esito:
          titolo: La strada dei canneti
          testo: |
            Stendi Corvo con un colpo alla nuca, come facevano i sorveglianti, e
            alzi la sbarra. Con le dita indichi la strada, a sinistra della
            seconda pozza e poi nell'acqua fino ai fianchi per non lasciare odore
            ai cani, e l'ultimo a uscire ti tocca il polso, sulla riga.
          pe: { furtivita: 3 }
          imposta: { ghoran.schiavi: 1 }
          effetti: { fazione.ghoran: 1 }

  # ------------------------------------------------------------ 8 → 9 · l'incidente (grado 3)
  - id: ghoran-l-incidente
    presso: ghoran
    immagine: ambientazione/ghoran
    titolo: L'incidente
    sommario: "All'asta del mattino ci sono due carovanieri con le maniche troppo larghe, e Ragh è venuto a vedere."
    luogo: Ghoran, la passerella davanti alla casa bianca
    area: superficie-fratturata
    requisiti: [fazione.ghoran == 8]
    testo: |
      La mattina dopo la passerella davanti alla casa bianca è piena di gente
      venuta a comprare, o a vedere com'è finita la notte. Tasha è sulla soglia
      con le mani giunte, accanto a Corvo legato a un palo con il labbro
      gonfio, e Ragh sta seduto sulla ringhiera, che scricchiola.

      In fondo alla folla due uomini con le giubbe da carovaniere hanno le
      maniche troppo larghe per il caldo che fa, e si sono messi ai due lati
      della scala.

      {armi-da-distanza Media} Dalla scala alla soglia ci sono otto passi, e un
      coltello lungo arriva prima che qualcuno si metta in mezzo.

      {politica-ed-economia Media} Se Tasha muore oggi sotto gli occhi di Ragh,
      a Ghoran nessun mercante di città sarà più al sicuro, e la Gilda lo sa.

      Ragh batte le nocche due volte. «Il peso ha pesato» dice alla folla.
      «Adesso vediamo chi ha pagato.»

      {origine accolito-del-velo} Tasha tiene le mani giunte come le novizie al
      vespro, con i pollici incrociati.
    opzioni:
      - testo: "Mettersi fra i sicari e Tasha"
        descrizione: "Due coltelli lunghi nelle maniche e otto passi di passerella, e qualcuno deve stare in mezzo."
        combattimento: ghoran-i-sicari
        vittoria:
          titolo: Le maniche larghe
          testo: |
            Il primo coltello si pianta nella ringhiera accanto al tuo fianco, e
            il secondo non arriva a partire. Ragh fa legare i sicari accanto a
            Corvo e dice che chi porta un incidente a Ghoran lo porta in casa sua.
            Gedda ti dà una lancia con il manico nero di pece, per chi ha reso un
            morto alla Pece e un vivo a Ghoran.
          almeno: { rep.ghoran: 6 }
          effetti: { fazione.ghoran: 1, monete: 30, oggetto.ghoran-lancia-della-pece: 1 }
        sconfitta:
          titolo: Il coltello nella spalla
          testo: |
            Un coltello ti entra nella spalla mentre spingi Tasha dentro casa, ma
            la Pece prende i sicari prima della palizzata. Gedda ti dà una lancia
            con il manico nero di pece, e Oska ti cuce la spalla.
          almeno: { rep.ghoran: 6 }
          effetti: { fazione.ghoran: 1, monete: 30, oggetto.ghoran-lancia-della-pece: 1, tormento: 0.5 }
      - testo: "Smascherarli davanti a tutti"
        descrizione: "Un carovaniere vero ha le mani rovinate dalle redini, basta chiedergli di mostrarle."
        prova: { attributo: sociale, abilita: [intimidire, ingannare], difficolta: Media }
        successo:
          titolo: Le mani lisce
          testo: |
            Chiedi ai due carovanieri di mostrarti le mani, e hanno le palme lisce
            e i calli del coltello sulle dita. La folla si apre intorno a loro e
            la Pece li lega accanto a Corvo. Gedda ti dà una lancia con il manico
            nero di pece.
          pe: { intimidire: 5 }
          almeno: { rep.ghoran: 6 }
          effetti: { fazione.ghoran: 1, monete: 30, oggetto.ghoran-lancia-della-pece: 1 }
        fallimento:
          titolo: La folla
          testo: |
            Fai la domanda troppo presto, e un coltello prende Tasha di striscio
            sul braccio prima che la Pece li fermi sulla scala. Gedda ti dà una
            lancia con il manico nero di pece, e ti dice che la prossima volta
            parli dopo.
          almeno: { rep.ghoran: 6 }
          effetti: { fazione.ghoran: 1, monete: 30, oggetto.ghoran-lancia-della-pece: 1, scandalo: 1 }
      - testo: "Far parlare Corvo davanti a Ragh"
        descrizione: "Corvo è legato al palo e ha paura, e una sua parola basta a indicare i due della Gilda."
        prova: { attributo: sociale, abilita: [persuasione, intimidire], difficolta: Difficile }
        successo:
          titolo: Il dito di Corvo
          testo: |
            Ti accucci davanti a Corvo e gli ricordi che cosa succede a chi tace
            davanti a Ragh, e lui alza il mento verso il fondo della folla. I due
            carovanieri provano a scendere la scala, ma la Pece è già in fondo.
            Gedda ti dà una lancia con il manico nero di pece.
          pe: { persuasione: 5 }
          almeno: { rep.ghoran: 6 }
          effetti: { fazione.ghoran: 1, monete: 30, oggetto.ghoran-lancia-della-pece: 1, rep.ghoran: 0.5 }
        fallimento:
          titolo: Corvo tace
          testo: |
            Corvo ti sputa sugli stivali, e intanto i due carovanieri si muovono
            finché Vesna li ferma a fatica sulla scala. Gedda ti dà lo stesso una
            lancia con il manico nero di pece, per quello che hai fatto prima di
            stamattina.
          almeno: { rep.ghoran: 6 }
          effetti: { fazione.ghoran: 1, monete: 30, oggetto.ghoran-lancia-della-pece: 1, scandalo: 0.5 }
      - testo: "Lasciare che se ne occupi la Pece"
        descrizione: "La Pece è sulle gradinate da stamattina, e basta un cenno a Vesna."
        esito:
          titolo: Il cenno
          testo: |
            Al tuo cenno Vesna muove i suoi, e quando i due carovanieri mettono le
            mani nelle maniche la Pece li ha già circondati con le torce. Ragh ti
            dice che stavolta il peso ha pesato bene. Gedda ti dà una lancia con
            il manico nero di pece, per chi ha reso un morto alla Pece e un vivo a
            Ghoran.
          almeno: { rep.ghoran: 6 }
          effetti: { fazione.ghoran: 1, monete: 30, oggetto.ghoran-lancia-della-pece: 1 }
      - testo: "Rispondere a Tasha del recinto vuoto"
        descrizione: "Il recinto l'hai aperto tu, e Tasha lo dice davanti a Ragh."
        quando: [ghoran.schiavi == 1]
        prova: { attributo: sociale, abilita: [persuasione, galateo], difficolta: Media }
        successo:
          titolo: Il debito di Tasha
          testo: |
            Tasha dice a Ragh che le hai rubato quattordici anime, e tu rispondi
            che le hai salvato la vita da un incendio che le avrebbe prese tutte.
            Ragh pesa e trova pari, e intanto la Pece prende i due carovanieri
            sulla scala. Gedda ti dà una lancia con il manico nero di pece.
          pe: { persuasione: 5 }
          almeno: { rep.ghoran: 6 }
          effetti: { fazione.ghoran: 1, monete: 30, oggetto.ghoran-lancia-della-pece: 1 }
        fallimento:
          titolo: Il recinto vuoto
          testo: |
            Tasha dice a Ragh che le hai rubato quattordici anime, e tu non trovi
            le parole. Quando la Pece ha preso i due carovanieri sulla scala, Ragh
            dice che il recinto resta un debito fra te e Tasha. Gedda ti dà lo
            stesso una lancia con il manico nero di pece.
          almeno: { rep.ghoran: 6 }
          effetti: { fazione.ghoran: 1, monete: 30, oggetto.ghoran-lancia-della-pece: 1, scandalo: 1 }
      - testo: "Lasciare che Merlach indichi i suoi vecchi soci"
        descrizione: "Valdo Merlach, tornato a Ghoran dopo il giudizio del Ferro, conosce bene la Gilda e i suoi uomini."
        quando: [raschiatori.merlach == 2]
        esito:
          titolo: La voce piana
          testo: |
            Valdo Merlach, pulito come al Grifone, capisce al primo sguardo e dice
            a tutti che i due carovanieri lavorano per i magazzini della Casa dei
            Nodi, perché li ha pagati anche lui. La Pece li prende sulla scala, e
            Merlach ti dice che adesso siete pari. Gedda ti dà una lancia con il
            manico nero di pece.
          almeno: { rep.ghoran: 6 }
          effetti: { fazione.ghoran: 1, monete: 30, oggetto.ghoran-lancia-della-pece: 1 }

  # ------------------------------------------------------------ 9 → 10 · le radici senza sangue (il segno)
  - id: ghoran-le-radici-senza-sangue
    presso: ghoran
    immagine: ambientazione/regno-profondo
    titolo: Le radici senza sangue
    sommario: "Una notte i tamburi tacciono, e nella Fossa del Seme le radici battono senza sangue."
    luogo: Ghoran, la grata della Fossa sotto il campo dei gladiatori
    area: superficie-fratturata
    requisiti: [fazione.ghoran == 9]
    testo: |
      A metà della notte i tamburi del campo smettono tutti insieme, e Vesna
      viene a prenderti senza torcia. Sotto le gradinate, una grata di ferro
      grande come una porta copre il buio della Fossa del Seme. Ragh è
      inginocchiato sul bordo con una lanterna calata a una catena, e alla
      luce si vedono le radici nere, spesse quanto un braccio, che si
      gonfiano tutte insieme e mandano un colpo su per la catena fino alle
      sue mani.

      «Battono quando ci cola il sangue» dice Ragh. «Stanotte nessuno ha
      versato niente.» Si tocca la benda di cuoio. «Da diciannove anni.»

      {natura Difficile} Il colpo è troppo regolare per un cuore.

      Arrivano i capi dei clan. Ostrav dice che la Fossa ha sete e che una
      volta la si nutriva, e Gedda risponde che chi la nutre si rivende i
      figli.
    opzioni:
      - testo: "Offrirti di scendere a vedere"
        descrizione: "Il peso dei clan forse è l'unico forestiero ammesso nella Fossa."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Media }
        successo:
          titolo: Il peso scende
          testo: |
            Dici a Ragh che scendi tu, e Ostrav ride. Ragh ti mette in mano la
            lanterna ancora calda e ti dice che domani notte la grata si apre per
            il peso dei clan, e chi ne risale vivo a Ghoran è parente di tutti.
          pe: { resilienza: 3 }
          effetti: { fazione.ghoran: 1, rep.ghoran: 0.5 }
        fallimento:
          titolo: Le mani che tremano
          testo: |
            Ti offri con le mani che tremano sulla grata, e Ostrav ride di gusto.
            Ragh ti dà la lanterna e ti dice che domani notte la grata si apre per
            il peso dei clan, anche se gli tremano le mani.
          effetti: { fazione.ghoran: 1, tormento: 0.5 }
      - testo: "Dire ai capi che la Fossa non si nutre"
        descrizione: "Ostrav vuole comprare sangue da versare di sotto, e va fermato prima che lo dica in piazza."
        prova: { attributo: sociale, abilita: [persuasione, intimidire], difficolta: Media }
        successo:
          titolo: Prima di sapere
          testo: |
            Dici ai capi che prima di nutrire una cosa bisogna sapere che cosa
            mangia. Gedda annuisce, e con lei due capi rimasti zitti fino a quel
            momento. Ragh ti mette in mano la lanterna, perché domani notte la
            grata si apre per il peso dei clan e tu vada a sapere.
          pe: { persuasione: 3 }
          effetti: { fazione.ghoran: 1, rep.ghoran: 0.5 }
        fallimento:
          titolo: L'anello di Ostrav
          testo: |
            Ostrav ti risponde che chi è senza clan sulla Fossa tace, e mezzo
            Guado gli dà ragione. Ragh chiude la lite mettendoti in mano la
            lanterna, perché domani notte la grata si apre per il peso dei clan.
          effetti: { fazione.ghoran: 1, scandalo: 0.5 }
      - testo: "Restare sul bordo fino all'alba a guardare"
        descrizione: "Le radici battono, e qualcuno deve stare a guardarle tutta la notte."
        costo: 2
        esito:
          titolo: Fino all'alba
          testo: |
            Resti sul bordo accanto a Ragh fino all'alba, e le radici battono
            senza smettere. Con il cielo che si schiarisce Ragh ti dà la lanterna
            e ti dice che domani notte la grata si apre per te.
          effetti: { fazione.ghoran: 1, tormento: 1 }
      - testo: "Contare i colpi come all'Accademia"
        descrizione: "All'Accademia si conta una nota prima di averne paura, e un colpo sempre uguale si può contare."
        quando: [origine.allievo-di-torvessa >= 1]
        esito:
          titolo: I colpi contati
          testo: |
            Conti i colpi come ti ha insegnato Orvald, con le dita sul ferro della
            grata, e l'intervallo resta sempre lo stesso, anche quando Ostrav alza
            la voce. Ragh ti ringrazia senza sapere che farsene, poi ti dà la
            lanterna, perché domani notte la grata si apre per il peso dei clan.
          pe: { accademiche: 3 }
          effetti: { fazione.ghoran: 1, rep.ghoran: 0.5 }
