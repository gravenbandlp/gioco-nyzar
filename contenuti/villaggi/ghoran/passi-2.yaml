# La quest di Ghoran, Atto III e l'inizio dell'Atto IV (fazione.ghoran 6 → 10).
# - 6 → 7 `ghoran-la-casa-bianca`: Tasha la Bianca sa che la Gilda la vuole morta in un incidente, e chiede al peso
#   dei clan di pesare i suoi uomini. Le varianti di gilda.tasha (il passo 10 della Gilda) sono opzioni con `quando`.
# - 7 → 8 `ghoran-il-recinto-di-notte`: l'uomo comprato dalla Gilda vuole dare fuoco al recinto, e dentro c'è la
#   merce di domani. La scelta sugli schiavi (ghoran.schiavi 1 aperto, 2 riscattati i più piccoli, 3 chiuso).
# - 8 → 9 `ghoran-l-incidente` (grado 3, Torcia di pece): all'asta del mattino arrivano i sicari della Gilda, e Ragh
#   pesa l'ospitalità di Ghoran. La Pece ti dà la sua lancia.
# - 9 → 10 `ghoran-le-radici-senza-sangue`: i tamburi tacciono, e nella Fossa le radici battono senza che nessuno
#   abbia versato sangue (il segno della Campana, che nessuno spiega). Ostrav vuole nutrirla, Gedda chiuderla, e
#   Ragh manda giù il peso.
# Nomi nuovi: Corvo (la guardia di Tasha pagata dalla Gilda), la casa di pietra della vecchia Mendion (Urtilia).
storylet:
  # ------------------------------------------------------------ 6 → 7 · la casa bianca
  - id: ghoran-la-casa-bianca
    presso: ghoran
    immagine: ambientazione/ghoran
    titolo: La casa bianca
    sommario: "Fra le palafitte nere di Ghoran ce n'è una sola dipinta di calce. Tasha la Bianca ti manda a chiamare con un nastro bianco."
    luogo: Ghoran, la palafitta di Tasha la Bianca
    area: superficie-fratturata
    requisiti: [fazione.ghoran == 6]
    testo: |
      La mattina dopo il verdetto un ragazzo ti lega un nastro bianco al
      polso e ti porta fino all'unica palafitta di Ghoran dipinta di calce.
      Dentro è tutto pulito in un modo che sulle passerelle non si vede mai,
      con le stuoie bianche e una ciotola d'acqua accanto alla porta per le
      mani. Dalla finestra si vede la casa di pietra della vecchia Mendion,
      l'unica casa del villaggio che non sta su pali.

      Tasha la Bianca ti aspetta seduta, vestita di bianco fino ai polsi,
      con i capelli bianchi raccolti. Ti offre il tè prima di parlare.

      «Cara anima» dice, con una voce che non si alza mai. «La Gilda dei
      Mercanti mi vuole morta, e la vuole in un incidente, perché gli
      incidenti a Ghoran non si pesano. Uno dei miei uomini ha preso il loro
      argento. Tu sai pesare. Pesami i miei uomini, e domani alla vendita ti
      lascio guardare la merce da vicino.»

      {empatia Media} Ha paura, e la tiene piegata come una tovaglia. Non le
      importa di morire, le importa di morire in un modo che non ha scelto.

      {galateo Facile} Ti ha servito il tè con la tazza buona e si è tenuta
      quella sbeccata. A Ghoran è un modo di dire che sei ospite.

      *Pesare i suoi uomini, e poi guardare la sua merce.* La tazza ti
      scotta le dita.

      {origine fuggiasco-di-ghoran} Il nastro bianco al polso ti stringe nel
      punto della riga chiara. Tasha la nominavano a bassa voce, nei
      recinti, come il tempo che cambia.
    opzioni:
      - testo: "Guardare i suoi uomini mentre fanno la guardia"
        descrizione: "Chi ha preso l'argento della Gilda ha qualcosa di nuovo addosso, o qualcosa che non guarda più."
        prova: { attributo: mentale, abilita: percezione, difficolta: Media }
        successo:
          titolo: Gli stivali nuovi
          testo: |
            Passi la giornata sulla passerella davanti alla casa bianca. Delle
            sei guardie di Tasha una sola ha gli stivali nuovi, di cuoio di
            città, e non guarda mai la porta del recinto quando ci passa
            davanti. Lo chiamano Corvo. Lo dici a Tasha, e lei annuisce senza
            sorpresa. Ti chiede di guardarlo stanotte, perché un uomo pagato
            per un incidente lo fa la notte prima della vendita.
          pe: { percezione: 3 }
          effetti: { fazione.ghoran: 1, rep.ghoran: 0.5 }
        fallimento:
          titolo: Sei facce
          testo: |
            Guardi le sei guardie fino a sera, e alla fine ti sembrano tutte
            colpevoli. Tasha ti ascolta con pazienza, poi ti dice che anche lei
            ha un sospetto, e che si chiama Corvo. Ti chiede di guardarlo
            stanotte, perché un incidente si fa la notte prima della vendita.
          effetti: { fazione.ghoran: 1, sospetto: 0.5 }
      - testo: "Farle domande sulla sua merce"
        descrizione: "Chi vende uomini e dice di liberarli ha una risposta pronta. Bisogna arrivare a quella che non ha pronta."
        prova: { attributo: sociale, abilita: [galateo, empatia], difficolta: Media }
        successo:
          titolo: La sofferenza che libera
          testo: |
            Le chiedi della merce, e Tasha ti risponde che ogni anima si
            libera soffrendo, e che lei la accompagna fino alla porta. Poi le
            chiedi dove va la merce di domani, e per un momento la tazza le
            resta a mezz'aria. Dice soltanto che va a un compratore che la
            Gilda non gradisce. Poi ti dice che sospetta di una guardia che
            chiamano Corvo, e ti chiede di guardarlo stanotte.
          pe: { galateo: 3 }
          effetti: { fazione.ghoran: 1, rep.ghoran: 0.5 }
        fallimento:
          titolo: La risposta pronta
          testo: |
            Le fai la domanda sbagliata, quella sugli dei. Tasha ti risponde per
            mezz'ora con una calma che ti fa venire freddo alle mani. Alla fine
            ti dice che sospetta di una guardia che chiamano Corvo, e ti
            chiede di guardarlo stanotte.
          effetti: { fazione.ghoran: 1, tormento: 0.5 }
      - testo: "Restare a dormire nella casa bianca"
        descrizione: "Un ospite in casa vede le guardie da dentro. Ci vuole una notte, e il letto è troppo pulito."
        costo: 2
        esito:
          titolo: Il letto bianco
          testo: |
            Dormi poco su una stuoia bianca, e all'alba senti una guardia
            uscire dalla porta di servizio e tornare con le mani vuote. La
            riconosci dalla voce, ed è quella che gli altri chiamano Corvo.
            Tasha, quando glielo
            dici, ti versa il tè e ti chiede di guardarlo stanotte.
          effetti: { fazione.ghoran: 1, tormento: 0.5 }
      - testo: "Dirle che all'approdo delle chiatte il cavo l'hai allentato tu"
        descrizione: "Tasha si ricorda la faccia di chi era all'argano. Tanto vale che lo senta da te."
        quando: [gilda.tasha == 1]
        esito:
          titolo: Il cavo
          testo: |
            Glielo dici guardandola in faccia. Tasha posa la tazza, e per un
            momento non dice niente. Poi ti risponde che le anime cadute nella
            Cicatrice sono libere da un pezzo, e che tu invece no. Ti dice che
            sospetta di una guardia che chiamano Corvo, e ti chiede di
            guardarlo stanotte, perché un debito si paga anche così.
          effetti: { fazione.ghoran: 1, tormento: 1 }
      - testo: "Ricordarle le due parole all'approdo"
        descrizione: "All'approdo delle chiatte l'hai avvertita del cavo. Tasha si ricorda i debiti, anche quelli che ha lei."
        quando: [gilda.tasha == 2]
        esito:
          titolo: Il nastro bianco
          testo: |
            Tasha sorride, per la prima volta, e tocca il nastro bianco che hai
            al polso. È lo stesso della borsa che ti mandò quella sera. Ti dice
            che un'anima che avverte vale più di una che pesa, e ti fa subito il
            nome della guardia che sospetta, Corvo. Ti chiede di guardarlo
            stanotte, e ti mette in mano una borsa per il disturbo.
          effetti: { fazione.ghoran: 1, monete: 15, rep.ghoran: 0.5 }
      - testo: "Dirle che la merce dell'approdo l'hai liberata tu"
        descrizione: "Le undici persone del carro all'approdo sono andate per la loro strada. Tasha lo sa, e sa anche chi è stato."
        quando: [gilda.tasha == 4]
        esito:
          titolo: La merce perduta
          testo: |
            Tasha ti ascolta con le mani in grembo. Ti dice che quella merce
            le è costata un inverno, e che le anime che scappano soffrono più
            a lungo delle altre, quindi forse le hai fatto un favore. Poi ti
            dice che sospetta di una guardia che chiamano Corvo, e ti chiede
            di guardarlo stanotte, come se il carro all'approdo non fosse mai esistito.
          effetti: { fazione.ghoran: 1, sospetto: 0.5 }
      - testo: "Chiederle di vedere i contratti delle guardie"
        descrizione: "Una guardia pagata da Tasha ha un contratto con il suo sigillo. Chi la paga anche la Gilda ha un contratto in più, scritto meglio."
        quando: [origine.mercante-dei-ponti >= 1]
        esito:
          titolo: Il contratto in più
          testo: |
            Tasha ti porta i contratti in una cassetta bianca. Li leggi uno
            per uno alla finestra, e quello di Corvo ha una piega che conosci,
            la piega che la Casa dei Nodi fa alle lettere dei magazzini quando
            ci passano sotto una carta. Dentro la piega c'è un segno a matita.
            Tasha guarda il segno e ti chiede di guardare Corvo stanotte.
          pe: { politica-ed-economia: 3 }
          effetti: { fazione.ghoran: 1, rep.ghoran: 0.5 }

  # ------------------------------------------------------------ 7 → 8 · il recinto di notte
  - id: ghoran-il-recinto-di-notte
    presso: ghoran
    immagine: ambientazione/ghoran
    titolo: Il recinto di notte
    sommario: "Corvo ha una tanica di pece e la chiave del recinto di Tasha. Dentro c'è la merce di domani, e stanotte chi decide sei tu."
    luogo: Ghoran, il recinto di Tasha la Bianca
    area: superficie-fratturata
    requisiti: [fazione.ghoran == 7]
    testo: |
      Il recinto di Tasha è un capannone di canne e fango su una piattaforma
      di pali, con una porta sola chiusa da una sbarra di ferro. Dentro
      dormono quattordici persone legate a due a due. Le ultime sei sono
      bambini, e stanno vicino alla porta perché pesano poco e domani vanno
      in vendita per primi.

      A mezzanotte Corvo arriva dalla passerella senza lanterna, con una
      tanica di pece in una mano e la chiave della sbarra nell'altra. Le
      altre guardie dormono nel casotto. Un incendio di notte, la pece che
      cola sui pali e una donna che corre a salvare la merce. Un incidente
      pulito, di quelli che a Ghoran nessuno pesa.

      {furtivita Media} Corvo cammina sul bordo delle assi, dove non
      scricchiolano. Lo fa da anni, e per la stessa ragione lo fai tu.

      {medicina Facile} Dalle fessure delle canne arriva l'odore di chi è
      chiuso da giorni. Un bambino tossisce nel sonno, piano, da uno che ha
      imparato a farlo piano.

      Hai Corvo a dieci passi e il recinto alle spalle. Quando gli avrai
      tolto la tanica, la chiave della sbarra resterà nelle tue mani.

      {origine fuggiasco-di-ghoran} I nodi alle caviglie dei bambini sono
      quelli di allora. Sai dove si allentano, e lo sanno anche le tue dita.
    opzioni:
      - testo: "Fermare Corvo e aprire il recinto"
        descrizione: "Gli togli la tanica, poi alzi la sbarra e indichi la palude. A Ghoran nessuno dà asilo ai fuggiaschi dei recinti, e domani lo sapranno tutti."
        prova: { attributo: fisico, abilita: [furtivita, rissa], difficolta: Media }
        successo:
          titolo: La sbarra
          testo: |
            Prendi Corvo alle spalle e lo stendi sulle assi prima che apra la
            tanica. Poi alzi la sbarra. Le quattordici persone escono una alla
            volta, i bambini in braccio ai grandi, e spariscono verso i canneti
            senza una parola. Corvo lo leghi alla porta vuota con la sua corda,
            perché all'alba Tasha lo trovi lì.
          pe: { furtivita: 3 }
          imposta: { ghoran.schiavi: 1 }
          effetti: { fazione.ghoran: 1 }
        fallimento:
          titolo: Le guardie sveglie
          testo: |
            Corvo ti sente arrivare e grida, e dal casotto escono le guardie.
            Nella confusione la sbarra la alzi lo stesso, e i legati scappano
            verso i canneti mentre le guardie ti tengono a terra. Prima che ti
            lascino andare ne hanno ripresi due. Corvo resta legato alla porta
            con la sua corda, dove l'hai legato tu.
          imposta: { ghoran.schiavi: 1 }
          effetti: { fazione.ghoran: 1, ferite: 1 }
      - testo: "Aprire il recinto passando sopra le guardie"
        descrizione: "Le guardie del casotto si svegliano al primo rumore. Si può fare lo stesso, a colpi."
        combattimento: ghoran-le-guardie-del-recinto
        vittoria:
          titolo: Il casotto
          testo: |
            Corvo scappa al primo colpo, lasciando la tanica sulle assi. Le due
            guardie del casotto restano a terra davanti alla porta, e tu alzi
            la sbarra. I legati escono una coppia alla volta e spariscono
            verso i canneti con i bambini in braccio, senza voltarsi.
          imposta: { ghoran.schiavi: 1 }
          effetti: { fazione.ghoran: 1 }
        sconfitta:
          titolo: La sbarra a metà
          testo: |
            Le guardie ti tengono a terra con un ginocchio sul collo, ma la
            sbarra l'avevi già alzata a metà. Mentre ti picchiano i legati
            escono dalla fessura uno alla volta e spariscono nei canneti.
            Corvo, nella confusione, scappa con la tanica.
          imposta: { ghoran.schiavi: 1 }
          effetti: { fazione.ghoran: 1, tormento: 0.5 }
      - testo: "Fermare Corvo e riscattare i più piccoli"
        descrizione: "Tasha domani vende. Si può comprare stanotte, a casa sua, con i soldi in mano e la guardia traditrice legata."
        requisiti: [monete >= 40]
        esito:
          titolo: Sei bambini
          testo: |
            Stendi Corvo prima che apra la tanica e lo trascini legato fino
            alla casa bianca. Tasha ti ascolta in camicia da notte, e quando le
            chiedi i sei bambini ti fa un prezzo, onesto per Ghoran. Paghi.
            All'alba i sei escono dal recinto con te, e Vesna li porta alla
            Pece. Gli altri otto vanno in vendita.
          imposta: { ghoran.schiavi: 2 }
          effetti: { fazione.ghoran: 1, monete: -40, rep.ghoran: 0.5 }
      - testo: "Fermare Corvo e lasciare chiuso il recinto"
        descrizione: "Tasha ti ha chiesto di pesare i suoi uomini, e quello è il lavoro. La merce resta merce, e domani va in vendita."
        prova: { attributo: fisico, abilita: [rissa, atletica], difficolta: Media }
        successo:
          titolo: La tanica
          testo: |
            Corvo ti vede quando sei già addosso, e la tanica rotola sulle assi
            senza aprirsi. Lo porti legato alla casa bianca. Tasha lo guarda
            a lungo e dice che anche la sua anima un giorno sarà libera.
            Il recinto resta chiuso, e dentro, al rumore, un bambino si mette
            a piangere e smette subito.
          pe: { rissa: 3 }
          imposta: { ghoran.schiavi: 3 }
          effetti: { fazione.ghoran: 1, rep.ghoran: 0.5, tormento: 0.5 }
        fallimento:
          titolo: La pece sui pali
          testo: |
            Corvo fa in tempo ad aprire la tanica, e la pece cola sui pali del
            recinto prima che tu lo stenda. Il fuoco resta spento, eppure
            l'odore sveglia tutti. Tasha arriva in camicia da notte e si fa portare Corvo
            legato, mentre dentro il recinto i legati piangono fino all'alba.
          imposta: { ghoran.schiavi: 3 }
          effetti: { fazione.ghoran: 1, tormento: 1 }
      - testo: "Parlare ai legati con le dita di Nella"
        descrizione: "Nella ti ha insegnato qualche segno della lingua dei legati, compreso quello che vuol dire scappare."
        quando: [raschiatori.nella >= 1]
        esito:
          titolo: I segni di Nella
          testo: |
            Stendi Corvo e alzi la sbarra, e alla prima coppia fai il segno
            che ti ha insegnato Nella, quello per scappare. La donna davanti
            sgrana gli occhi e risponde con il segno per fratello, poi sveglia
            gli altri. Escono tutti e spariscono nei canneti, e tu resti a
            guardare la porta vuota con le mani che non sanno dove stare.
          imposta: { ghoran.schiavi: 1 }
          effetti: { fazione.ghoran: 1 }
      - testo: "Dire ai legati da che parte si scappa"
        descrizione: "Nei recinti si parla con le dita. Tu sai ancora quali canneti portano lontano dai cani."
        quando: [origine.fuggiasco-di-ghoran >= 1]
        esito:
          titolo: La strada dei canneti
          testo: |
            Stendi Corvo con un colpo solo, alla nuca, come facevano i
            sorveglianti. Poi alzi la sbarra e parli con le dita alla prima
            coppia di legati. A sinistra della seconda pozza, poi nell'acqua
            fino ai fianchi per non lasciare odore ai cani. Escono tutti senza
            una parola, e l'ultimo a passare ti tocca il polso, sulla riga.
          pe: { furtivita: 3 }
          imposta: { ghoran.schiavi: 1 }
          effetti: { fazione.ghoran: 1 }

  # ------------------------------------------------------------ 8 → 9 · l'incidente (grado 3)
  - id: ghoran-l-incidente
    presso: ghoran
    immagine: ambientazione/ghoran
    titolo: L'incidente
    sommario: "All'asta del mattino davanti alla casa bianca ci sono due carovanieri con le maniche troppo larghe. La Gilda vuole il suo incidente, e Ragh è venuto a vedere."
    luogo: Ghoran, la passerella davanti alla casa bianca
    area: superficie-fratturata
    requisiti: [fazione.ghoran == 8]
    testo: |
      La mattina dopo la passerella davanti alla casa bianca è piena di gente
      venuta a comprare, o soltanto a vedere com'è finita la notte.
      Tasha è in piedi sulla soglia con le mani giunte. Accanto a lei, legato
      a un palo, c'è Corvo con il labbro gonfio. Ragh è venuto di persona e
      sta seduto sulla ringhiera, che scricchiola, con le nocche sul
      ginocchio.

      In fondo alla folla ci sono due uomini con le giubbe da carovaniere e
      la polvere del Gradone ancora sugli stivali. Hanno le maniche troppo
      larghe per il caldo che fa, e si sono messi uno a destra e uno a
      sinistra della scala, senza guardarsi.

      {armi-da-distanza Media} Dalla scala alla soglia ci sono otto passi.
      Con un coltello lungo, lanciato da lì, la passerella è stretta abbastanza
      perché nessuno faccia in tempo a mettersi in mezzo.

      {politica-ed-economia Media} Se Tasha muore oggi sotto gli occhi di
      Ragh, a Ghoran nessun mercante di città sarà più al sicuro, e la Gilda
      lo sa. Per questo a Qir-Azel lo chiamano un incidente.

      Ragh batte le nocche due volte. «Il peso ha pesato» dice alla folla.
      «Adesso vediamo chi ha pagato.»

      {origine accolito-del-velo} Tasha tiene le mani giunte come le tengono
      le novizie durante il vespro, con i pollici incrociati. Qualcuno, molto
      tempo fa, le ha insegnato a pregare nel modo giusto.
    opzioni:
      - testo: "Mettersi fra i sicari e Tasha"
        descrizione: "Due coltelli lunghi nelle maniche, e otto passi di passerella. Qualcuno deve stare in mezzo."
        combattimento: ghoran-i-sicari
        vittoria:
          titolo: Le maniche larghe
          testo: |
            Il primo coltello ti si pianta nella ringhiera accanto al fianco,
            e del secondo non fanno in tempo a parlare. Quando i due sicari
            sono a terra Ragh si alza e li fa legare accanto a Corvo. Dice
            che chi porta un incidente a Ghoran lo porta in casa sua, e la
            folla tace.

            Gedda della Pece sale la scala e ti mette in mano una lancia con
            il manico nero di pece. Dice che è per chi ha reso un morto alla
            Pece e un vivo a Ghoran.
          almeno: { rep.ghoran: 6 }
          effetti: { fazione.ghoran: 1, monete: 30, oggetto.ghoran-lancia-della-pece: 1 }
        sconfitta:
          titolo: Il coltello nella spalla
          testo: |
            Un coltello ti entra nella spalla mentre spingi Tasha dentro la
            casa, e i sicari scappano verso la passerella, senza arrivare alla
            palizzata. Le gradinate della Pece li aspettano con le torce, e Ragh
            li fa legare accanto a Corvo.

            Più tardi Gedda della Pece ti mette in mano una lancia con il
            manico nero di pece, per chi ha reso un morto alla Pece e un vivo
            a Ghoran. Oska, intanto, ti cuce la spalla.
          almeno: { rep.ghoran: 6 }
          effetti: { fazione.ghoran: 1, monete: 30, oggetto.ghoran-lancia-della-pece: 1, tormento: 0.5 }
      - testo: "Smascherarli davanti a tutti"
        descrizione: "Un carovaniere vero ha le mani rovinate dalle redini. Basta chiedergli di mostrarle."
        prova: { attributo: sociale, abilita: [intimidire, ingannare], difficolta: Media }
        successo:
          titolo: Le mani lisce
          testo: |
            Chiedi ad alta voce ai due carovanieri quale strada hanno fatto,
            e poi di mostrarti le mani. Hanno le palme lisce e i calli sulle
            dita, quelli del coltello. La folla si apre intorno a loro da sola,
            e i ragazzi della Pece li legano accanto a Corvo prima che arrivino
            alla scala. Ragh dice che chi porta un incidente a Ghoran lo porta
            in casa sua.

            Gedda della Pece ti mette in mano una lancia con il manico nero di
            pece, per chi ha reso un morto alla Pece e un vivo a Ghoran.
          pe: { intimidire: 5 }
          almeno: { rep.ghoran: 6 }
          effetti: { fazione.ghoran: 1, monete: 30, oggetto.ghoran-lancia-della-pece: 1 }
        fallimento:
          titolo: La folla
          testo: |
            Fai la domanda troppo presto, e uno dei due lancia il coltello
            prima che la folla capisca. Il coltello prende Tasha di striscio
            sul braccio, e la manica bianca diventa rossa. I ragazzi della Pece
            li prendono tutti e due sulla scala, e Ragh li fa legare accanto a
            Corvo.

            Gedda della Pece ti mette in mano una lancia con il manico nero di
            pece, e ti dice che la prossima volta parli dopo.
          almeno: { rep.ghoran: 6 }
          effetti: { fazione.ghoran: 1, monete: 30, oggetto.ghoran-lancia-della-pece: 1, scandalo: 1 }
      - testo: "Far parlare Corvo davanti a Ragh"
        descrizione: "Corvo è legato al palo e ha paura. Una parola sua basta a indicare i due della Gilda."
        prova: { attributo: sociale, abilita: [persuasione, intimidire], difficolta: Difficile }
        successo:
          titolo: Il dito di Corvo
          testo: |
            Ti accucci davanti a Corvo e gli dici quello che succede, a Ghoran,
            a chi tace davanti a Ragh. Corvo alza il mento verso il fondo della
            folla e lo tiene lì. I due carovanieri provano a scendere la scala,
            ma la Pece è già in fondo. Ragh li fa legare accanto a Corvo e
            dice che chi porta un incidente a Ghoran lo porta in casa sua.

            Gedda della Pece ti mette in mano una lancia con il manico nero di
            pece, per chi ha reso un morto alla Pece e un vivo a Ghoran.
          pe: { persuasione: 5 }
          almeno: { rep.ghoran: 6 }
          effetti: { fazione.ghoran: 1, monete: 30, oggetto.ghoran-lancia-della-pece: 1, rep.ghoran: 0.5 }
        fallimento:
          titolo: Corvo tace
          testo: |
            Corvo ti sputa sugli stivali e guarda per terra. Mentre perdi tempo
            con lui i due carovanieri si muovono, e Vesna li ferma sulla scala
            con il manico della lancia, a fatica. Ragh li fa legare accanto a
            Corvo senza guardarti.

            Gedda della Pece ti mette in mano una lancia con il manico nero di
            pece, e dice che è per quello che hai fatto prima di stamattina.
          almeno: { rep.ghoran: 6 }
          effetti: { fazione.ghoran: 1, monete: 30, oggetto.ghoran-lancia-della-pece: 1, scandalo: 0.5 }
      - testo: "Lasciare che se ne occupi la Pece"
        descrizione: "Vesna e i ragazzi della Pece stanno sulle gradinate da stamattina. Basta un cenno."
        esito:
          titolo: Il cenno
          testo: |
            Fai un cenno a Vesna, e Vesna lo fa ai suoi. Quando i due
            carovanieri mettono le mani nelle maniche, la Pece li ha già
            circondati con le torce. Ragh li fa legare accanto a Corvo e dice
            che chi porta un incidente a Ghoran lo porta in casa sua. A te
            dice soltanto che il peso ha pesato bene, stavolta.

            Gedda della Pece ti mette in mano una lancia con il manico nero di
            pece, per chi ha reso un morto alla Pece e un vivo a Ghoran.
          almeno: { rep.ghoran: 6 }
          effetti: { fazione.ghoran: 1, monete: 30, oggetto.ghoran-lancia-della-pece: 1 }
      - testo: "Rispondere a Tasha del recinto vuoto"
        descrizione: "Il recinto stanotte l'hai aperto tu. Tasha lo dice davanti a Ragh prima che arrivi il resto."
        quando: [ghoran.schiavi == 1]
        prova: { attributo: sociale, abilita: [persuasione, galateo], difficolta: Media }
        successo:
          titolo: Il debito di Tasha
          testo: |
            Tasha dice a Ragh che le hai rubato quattordici anime. Tu rispondi
            che le hai salvato la vita e la casa, e che un incendio le avrebbe
            prese tutte e quattordici insieme a lei. Ragh batte le nocche e
            pesa. Dice che fra le due cose c'è pari. In quel momento i due
            carovanieri si muovono, e la Pece li prende sulla scala.

            Gedda della Pece ti mette in mano una lancia con il manico nero di
            pece, per chi ha reso un morto alla Pece e un vivo a Ghoran.
          pe: { persuasione: 5 }
          almeno: { rep.ghoran: 6 }
          effetti: { fazione.ghoran: 1, monete: 30, oggetto.ghoran-lancia-della-pece: 1 }
        fallimento:
          titolo: Il recinto vuoto
          testo: |
            Tasha dice a Ragh che le hai rubato quattordici anime, e tu non
            trovi le parole. Ragh pesa in silenzio, finché i due carovanieri
            si muovono e la Pece li prende sulla scala. Allora dice che oggi
            si pesa una cosa sola, e che il recinto resta un debito fra te e
            Tasha.

            Gedda della Pece ti mette in mano lo stesso una lancia con il
            manico nero di pece.
          almeno: { rep.ghoran: 6 }
          effetti: { fazione.ghoran: 1, monete: 30, oggetto.ghoran-lancia-della-pece: 1, scandalo: 1 }
      - testo: "Lasciare che Merlach indichi i suoi vecchi soci"
        descrizione: "Valdo Merlach è fra i compratori, tornato a Ghoran dopo il giudizio del Ferro. La Gilda la conosce bene, e i suoi uomini anche."
        quando: [raschiatori.merlach == 2]
        esito:
          titolo: La voce piana
          testo: |
            Valdo Merlach è in prima fila, pulito come al Grifone. Lo guardi, e
            lui capisce. Con la sua voce bassa e piana dice ad alta voce che i
            due carovanieri in fondo lavorano per i magazzini della Casa dei
            Nodi, perché li ha pagati anche lui, una volta. La Pece li prende
            sulla scala. Merlach si gira verso di te e ti dice che adesso sono
            pari.

            Gedda della Pece ti mette in mano una lancia con il manico nero di
            pece, per chi ha reso un morto alla Pece e un vivo a Ghoran.
          almeno: { rep.ghoran: 6 }
          effetti: { fazione.ghoran: 1, monete: 30, oggetto.ghoran-lancia-della-pece: 1 }

  # ------------------------------------------------------------ 9 → 10 · le radici senza sangue (il segno)
  - id: ghoran-le-radici-senza-sangue
    presso: ghoran
    immagine: ambientazione/regno-profondo
    titolo: Le radici senza sangue
    sommario: "Una notte i tamburi del campo tacciono. Sotto la sabbia, nella Fossa del Seme, le radici battono anche se nessuno ci ha versato sangue."
    luogo: Ghoran, la grata della Fossa sotto il campo dei gladiatori
    area: superficie-fratturata
    requisiti: [fazione.ghoran == 9]
    testo: |
      A metà della notte i tamburi del campo smettono di suonare tutti
      insieme, e il silenzio sveglia mezzo villaggio. Vesna viene a prenderti
      senza torcia. Nel campo la sabbia trema appena, come la pelle di un
      tamburo quando qualcuno ci appoggia la mano dall'altra parte.

      Sotto le gradinate c'è una grata di ferro grande come una porta
      stesa a terra, e sotto la grata c'è il buio della Fossa del Seme. Ragh
      è inginocchiato sul bordo con una lanterna calata a una catena. Alla
      luce si vedono le radici nere uscire dal pavimento di pietra, spesse
      quanto un braccio, e si vede che palpitano. Si gonfiano piano e piano si
      sgonfiano tutte insieme, e il colpo arriva su per la catena fino
      alle mani di Ragh.

      «Battono quando ci cola il sangue» dice Ragh. «Stanotte nessuno ha
      versato niente.» Si tocca la benda di cuoio. «Da diciannove anni.»

      {natura Difficile} Il colpo è lento e regolare, troppo regolare per un
      cuore. Una radice che beve si muove quando beve, mentre queste battono
      a tempo con qualcosa che non è qui.

      {resilienza Media fallita} Ti accorgi di contare i colpi a mezza voce,
      e di non riuscire a smettere.

      Dietro di voi i capi dei clan arrivano uno alla volta. Ostrav dice che
      la Fossa ha sete e che una volta la si nutriva. Gedda risponde che chi
      la nutre si rivende i figli.
    opzioni:
      - testo: "Offrirti di scendere a vedere"
        descrizione: "I forestieri nella Fossa non sono ammessi. Il peso dei clan, forse, non è un forestiero."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Media }
        successo:
          titolo: Il peso scende
          testo: |
            Dici a Ragh che scendi tu. I capi si girano a guardarti, e Ostrav
            ride. Ragh invece tira su la lanterna e te la mette in mano, ancora
            calda. Ti dice che domani notte la grata si apre per il peso dei
            clan, e che chi ne risale vivo a Ghoran è parente di tutti.
          pe: { resilienza: 3 }
          effetti: { fazione.ghoran: 1, rep.ghoran: 0.5 }
        fallimento:
          titolo: Le mani che tremano
          testo: |
            Dici a Ragh che scendi tu, e intanto ti accorgi che le mani ti
            tremano sulla grata. Ostrav ride di gusto. Ragh aspetta che smettano,
            poi ti mette in mano la lanterna e ti dice che domani notte la grata
            si apre per il peso dei clan, anche se gli tremano le mani.
          effetti: { fazione.ghoran: 1, tormento: 0.5 }
      - testo: "Dire ai capi che la Fossa non si nutre"
        descrizione: "Ostrav vuole comprare sangue da versare di sotto, come facevano i vecchi. Va fermato prima che lo dica a voce alta in piazza."
        prova: { attributo: sociale, abilita: [persuasione, intimidire], difficolta: Media }
        successo:
          titolo: Prima di sapere
          testo: |
            Dici ai capi che prima di nutrire una cosa bisogna sapere che cosa
            mangia. Gedda annuisce, e anche due capi che non avevano parlato.
            Ostrav si gira l'anello di cera verde intorno al dito e tace. Ragh
            ti mette in mano la lanterna e dice che domani notte la grata si
            apre per il peso dei clan, perché vada a sapere.
          pe: { persuasione: 3 }
          effetti: { fazione.ghoran: 1, rep.ghoran: 0.5 }
        fallimento:
          titolo: L'anello di Ostrav
          testo: |
            Parli troppo forte, e Ostrav ti risponde che chi non ha un clan non
            ha diritto di parola sulla Fossa. Mezzo Guado gli dà ragione. Ragh
            mette fine alla lite mettendoti in mano la lanterna. Domani notte,
            dice, la grata si apre per il peso dei clan, e poi si vedrà chi ha
            diritto di parola.
          effetti: { fazione.ghoran: 1, scandalo: 0.5 }
      - testo: "Restare sul bordo fino all'alba a guardare"
        descrizione: "Le radici battono, e nessuno sa se smetteranno. Qualcuno deve stare a guardarle tutta la notte."
        costo: 2
        esito:
          titolo: Fino all'alba
          testo: |
            Resti sul bordo accanto a Ragh fino all'alba, e le gambe ti si
            addormentano. Le radici non smettono mai. Quando il cielo si
            schiarisce Ragh tira su la lanterna e te la dà, e ti dice che domani
            notte la grata si apre per te.
          effetti: { fazione.ghoran: 1, tormento: 1 }
      - testo: "Contare i colpi come all'Accademia"
        descrizione: "All'Accademia si conta una nota prima di averne paura. Un colpo che torna sempre uguale si può contare."
        quando: [origine.allievo-di-torvessa >= 1]
        esito:
          titolo: I colpi contati
          testo: |
            Conti i colpi come ti ha insegnato Orvald, con le dita sul ferro
            della grata. Tornano sempre allo stesso intervallo, e l'intervallo
            non cambia quando cambia il vento o quando Ostrav alza la voce. Lo
            dici a Ragh, che non sa che farsene e ti ringrazia lo stesso. Poi
            ti dà la lanterna, e ti dice che domani notte la grata si apre per
            il peso dei clan.
          pe: { accademiche: 3 }
          effetti: { fazione.ghoran: 1, rep.ghoran: 0.5 }
