# La quest di Ghoran, Atto I e II (fazione.ghoran 0 → 6). Tutte le scene stanno presso il luogo `ghoran`, tranne
# la palude del passo 5.
# - 0 → 1 `ghoran-la-bilancia-della-palizzata` (pista.arena >= 5): Vesna porta l'invito di Ragh, e alla palizzata
#   chi entra senza un clan sale sul piatto della bilancia di porta.
# - 1 → 2 `ghoran-una-ripresa-per-ragh`: una ripresa nel campo dei tamburi, con Ragh sul palco dei clan. Si va
#   avanti anche perdendo, perché Ragh pesa come si cade.
# - 2 → 3 `ghoran-la-sala-lunga` (grado 1, Pesato): Ragh ti fa la sua domanda e ti dà il filo di rame; i capi dei
#   clan parlano dell'osso di ferro sulle alture e di chi bussa al guado nord (traccia.costola, traccia.tamburi).
# - 3 → 4 `ghoran-un-morto-nel-campo`: Jarko della Pece muore in una ripresa contro Tibbo, comprato del Guado; la
#   Pece chiede la Fossa, e Ragh ti nomina peso.
# - 4 → 5 `ghoran-il-fiele-d-anguilla` (margine della Palude Acquanera): chi ha comprato il veleno.
# - 5 → 6 `ghoran-sul-piatto` (grado 2, Peso dei clan): il verdetto alla bilancia del mercato (ghoran.verdetto).
# Nomi nuovi: il vecchio della porta (senza nome), Gedda della Pece (la capa del clan di Vesna), Jarko (il ragazzo
# morto), Ostrav (il capo del clan del Guado), Tibbo (il suo comprato), Malvo (l'anguillaio della palude).
storylet:
  # ------------------------------------------------------------ 0 → 1 · la bilancia della palizzata
  - id: ghoran-la-bilancia-della-palizzata
    presso: ghoran
    immagine: ambientazione/ghoran
    titolo: La bilancia della palizzata
    sommario: "Ragh Kor'Nul vuole pesare chi ha fatto tanto rumore all'Arena. A Ghoran chi entra senza un clan sale sul piatto, davanti a tutti."
    luogo: Ghoran, la porta della palizzata
    area: superficie-fratturata
    requisiti: [fazione.ghoran == 0, pista.arena >= 5]
    testo: |
      Da Qir-Azel a Ghoran ci sono sei giorni di strada verso sud, lungo la
      Palude Acquanera e poi giù per il Gradone Rosso, e l'ultimo giorno la
      terra comincia a cedere sotto gli stivali. Il villaggio compare al
      tramonto, un groviglio di palafitte nere piantate nel fango, con le
      torce di pece già accese sulle passerelle. Da oltre le pozze arrivano i
      tamburi.

      Alla palizzata la strada finisce davanti a una bilancia da grano a due
      piatti, appesa a una trave. Sul banco accanto ci sono i pesi di bronzo
      in fila, e un vecchio con il naso schiacciato scrive su una tavoletta di
      cera. Chi entra a Ghoran senza un clan sale sul piatto.

      Sul banco è seduta Vesna, la gladiatrice con il filo di rame nella
      treccia. «Ragh vuole sapere quanto pesi» dice, ridendo con mezza bocca.
      «Il vecchio lo scrive stasera, e domani Ragh lo legge.»

      {conoscenze-della-strada Media} Il numero sulla tavoletta conta poco.
      Il vecchio guarda come ci sali, e chi si ferma a guardarti dalle
      passerelle.

      *Mi pesano davanti a tutto il villaggio.* Sulle assi intorno alla
      palizzata si sono fermati in parecchi, con le mani sui fianchi e le
      torce alzate per vederti meglio.

      {origine fuggiasco-di-ghoran} Il piatto di ferro è consumato nello
      stesso punto di allora, dove si appoggiavano i talloni. La fila si
      faceva dal più grosso al più piccolo, e il peso si prendeva prima di
      mangiare. Le mani ti vanno da sole alla riga chiara sul polso.
    opzioni:
      - testo: "Salire sul piatto e dire chi sei"
        descrizione: "Il vecchio scrive il peso e quello che dici. Bisogna dirlo in modo che chi guarda lo ripeta."
        prova: { attributo: sociale, abilita: [persuasione, espressivita], difficolta: Media }
        successo:
          titolo: Il numero sulla tavoletta
          testo: |
            Sali sul piatto senza aspettare l'invito e dici il tuo nome forte,
            insieme a quello dell'Arena, e dalle passerelle qualcuno lo ripete
            al vicino. Il vecchio scrive un numero sulla cera e sotto ci fa un
            segno, una riga dritta. Vesna dice che è un segno buono, e ti porta
            a dormire in una palafitta della Pece dove il pavimento non cede.
            Domani notte, ti dice, Ragh ti guarda combattere.
          pe: { persuasione: 3 }
          effetti: { fazione.ghoran: 1, rep.ghoran: 0.5 }
        fallimento:
          titolo: Il segno storto
          testo: |
            Sali sul piatto, e il piatto oscilla più del previsto. Ti
            aggrappi alla catena davanti a tutti, mentre dalle passerelle
            arriva una risata lunga. Il vecchio scrive il numero e accanto ci
            fa un segno storto. Vesna ti porta a dormire dalla Pece senza
            commentare, e ti dice che domani notte Ragh ti guarda combattere.
          effetti: { fazione.ghoran: 1, scandalo: 0.5 }
      - testo: "Tenere il peso grande a braccio teso mentre ti pesano"
        descrizione: "Sul banco c'è un peso di bronzo più grosso degli altri. Vesna dice che i gladiatori lo tengono a braccio teso, per farsi notare."
        prova: { attributo: fisico, abilita: [resistenza, atletica], difficolta: Media }
        successo:
          titolo: Il braccio teso
          testo: |
            Prendi il peso grande e lo tieni davanti a te a braccio teso,
            mentre il vecchio aggiunge bronzo sull'altro piatto. Quando ha
            finito il braccio ti trema appena, e sulle passerelle qualcuno
            batte le mani sulle cosce. Il vecchio fa un segno dritto sotto il
            numero, e Vesna ti porta a dormire dalla Pece. Domani notte, dice,
            Ragh ti guarda combattere.
          pe: { resistenza: 3 }
          effetti: { fazione.ghoran: 1, rep.ghoran: 0.5 }
        fallimento:
          titolo: Il bronzo nel fango
          testo: |
            A metà pesata il peso ti scivola e cade nel fango sotto la
            bilancia con un tonfo grasso. Lo ripeschi tu, fino al gomito. Il
            vecchio ci mette un po' a smettere di ridere, poi scrive un numero
            e un segno storto. Vesna ti porta a dormire dalla Pece, e ti dice
            che domani notte Ragh ti guarda combattere.
          effetti: { fazione.ghoran: 1, scandalo: 0.5 }
      - testo: "Aspettare in fila che tocchi a te"
        descrizione: "Alla palizzata si mette in fila anche chi porta merce. Il vecchio pesa tutti nello stesso modo, e ci vuole la notte."
        costo: 2
        esito:
          titolo: La fila
          testo: |
            Ti metti in fila dietro due carovanieri e un cane, e aspetti fino
            a mezzanotte con il fango che ti sale nelle scarpe. Quando tocca
            a te il vecchio ti pesa senza alzare gli occhi e scrive un numero
            con un segno a metà. Vesna, che ha aspettato con te sul banco, ti
            porta a dormire dalla Pece. Domani notte Ragh ti guarda combattere.
          effetti: { fazione.ghoran: 1, tormento: 0.5 }
      - testo: "Dire al vecchio chi ha fermato il carro del Pesatore"
        descrizione: "Sulla strada del fango hai fermato il carro-gabbia di Ulmo Strass. A Ghoran quel carro lo conoscono tutti."
        quando: [fazione.caserma >= 12, bivio.legge == 1]
        esito:
          titolo: Il carro del Pesatore
          testo: |
            Glielo dici a voce bassa, mentre sali sul piatto. Il vecchio
            smette di scrivere e ti guarda per la prima volta in faccia, poi
            guarda il piatto, e infine scrive il numero con due righe dritte
            sotto invece di una. Vesna fischia. Ti porta a dormire dalla Pece
            e ti dice che domani notte Ragh ti guarda combattere, e che adesso
            lo sa anche lui chi sei.
          effetti: { fazione.ghoran: 1, rep.ghoran: 0.5 }
      - testo: "Salire sul piatto prima che te lo chiedano"
        descrizione: "La regola della bilancia la conosci dal fondo della fila. Il vecchio la conosce da molto prima."
        quando: [origine.fuggiasco-di-ghoran >= 1]
        esito:
          titolo: Il piede giusto
          testo: |
            Sali sul piatto appoggiando i talloni nel punto consumato, come
            ti hanno insegnato, e tieni le braccia lungo i fianchi. Il vecchio
            ti guarda i piedi e poi il polso, e la penna gli resta ferma sulla
            cera. Vesna scende dal banco e gli dice che sei invitato da Ragh, e
            che l'invito di Ragh vale fino a quando non esci. Il vecchio scrive
            il numero e una riga dritta. Domani notte, ti dice Vesna mentre ti
            porta dalla Pece, Ragh ti guarda combattere.
          pe: { resilienza: 3 }
          effetti: { fazione.ghoran: 1, rep.ghoran: 0.5 }

  # ------------------------------------------------------------ 1 → 2 · una ripresa per Ragh
  - id: ghoran-una-ripresa-per-ragh
    presso: ghoran
    immagine: ambientazione/arena-di-qir-azel
    titolo: Una ripresa per Ragh
    sommario: "Nel campo dei tamburi stanotte combatti tu. Sul palco dei clan siede Ragh Kor'Nul, e guarda con il suo occhio solo."
    luogo: Ghoran, il campo dei gladiatori
    area: superficie-fratturata
    requisiti: [fazione.ghoran == 1]
    testo: |
      Il campo dei gladiatori è una conca di terra battuta oltre l'ultima
      pozza, con le gradinate di legno tutt'intorno piene fino all'ultima
      asse. Le torce di pece fanno un cerchio sul bordo, e su una pedana tre
      ragazzi della Pece battono i tamburi, uno per chi entra e due per chi
      esce in piedi.

      Dalla parte del palco dei clan siede Ragh Kor'Nul. È l'uomo più grande
      che tu abbia visto, con le spalle larghe come una porta e una benda di
      cuoio sull'occhio sinistro, e sta seduto così fermo che le torce gli
      fanno tremare l'ombra mentre lui resta immobile. Accanto ha i capi dei
      clan, ognuno con il suo segno cucito sul petto.

      Il tuo avversario è un gladiatore della Pece con la lama smussata sul
      filo, e saltella sul posto per scaldarsi.

      {armi-da-mischia Media} Si colpisce di piatto e si minaccia di punta.
      Chi ferisce sul serio in una ripresa d'invito fa una brutta figura,
      e la fa fare anche al suo clan.

      {empatia Facile} Ragh non guarda il tuo avversario. Guarda te, e da
      quando sei entrato non ha ancora sbattuto la palpebra.

      «Non farti ammazzare, che poi la sabbia la cambio io» ti dice Vesna
      alla sbarra.
    opzioni:
      - testo: "Combattere la ripresa"
        descrizione: "Contro un gladiatore della Pece con la lama smussata, davanti alle gradinate piene. Si vince quando l'altro resta a terra."
        combattimento: ghoran-una-ripresa
        vittoria:
          titolo: Due colpi di tamburo
          testo: |
            Il gladiatore della Pece resta a terra con la mano alzata, e dalla
            pedana arrivano i due colpi di tamburo per te. Le gradinate battono
            i piedi sulle assi. Ragh si alza, e il campo tace mentre lui scende
            dal palco senza dire niente. All'alba Vesna ti sveglia per dirti
            che stasera ti aspetta nella sala lunga.
          effetti: { fazione.ghoran: 1, rep.ghoran: 0.5 }
        sconfitta:
          titolo: Un colpo solo
          testo: |
            Finisci a terra con la sabbia in bocca, e dalla pedana arriva un
            colpo solo di tamburo. Mentre ti rialzi vedi Ragh che si sporge
            in avanti sul palco, attento, a guardare come ti rimetti in piedi.
            All'alba Vesna ti porta l'acqua e ti dice che stasera Ragh ti
            aspetta nella sala lunga lo stesso.
          effetti: { fazione.ghoran: 1, tormento: 0.5 }
      - testo: "Combattere senza mai colpire"
        descrizione: "Chi ferisce in una ripresa d'invito fa una brutta figura. Si può vincere facendo sbagliare l'altro fino alla fine."
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Media }
        successo:
          titolo: La sabbia
          testo: |
            Giri intorno al gladiatore e lo lasci colpire l'aria finché le
            gambe non gli pesano, e quando inciampa da solo gli appoggi la
            punta della lama sulla spalla. Le gradinate ridono, poi battono i
            piedi. Ragh dal palco alza una mano sola. All'alba Vesna ti dice
            che stasera ti aspetta nella sala lunga.
          pe: { acrobazia: 3 }
          effetti: { fazione.ghoran: 1, rep.ghoran: 0.5 }
        fallimento:
          titolo: Il piede storto
          testo: |
            Alla terza schivata il piede ti si storce nella sabbia, e il
            gladiatore ti appoggia la lama di piatto sul collo con un certo
            garbo. Il tamburo batte una volta. All'alba Vesna ti fascia la
            caviglia e ti dice che stasera Ragh ti aspetta nella sala lunga.
          effetti: { fazione.ghoran: 1, ferite: 0.5 }
      - testo: "Buttare la lama e fare ridere le gradinate"
        descrizione: "Una ripresa d'invito è anche uno spettacolo. Chi fa ridere il campo lo fa ridere anche dalla parte del palco."
        prova: { attributo: sociale, abilita: [espressivita, intimidire], difficolta: Media }
        successo:
          titolo: A mani nude
          testo: |
            Butti la lama nella sabbia e chiami il gladiatore con due dita,
            alla maniera dei lottatori della Città Bassa. Il campo ride insieme
            a lui, e la ripresa diventa una lotta nel fango che finisce con
            tutti e due seduti a terra. Dalla pedana arrivano due colpi di
            tamburo per ciascuno. All'alba Vesna ti dice che stasera Ragh ti
            aspetta nella sala lunga.
          pe: { espressivita: 3 }
          effetti: { fazione.ghoran: 1, rep.ghoran: 0.5 }
        fallimento:
          titolo: La risata sbagliata
          testo: |
            Butti la lama, e il gladiatore la prende per un insulto. Ti
            stende con un colpo di piatto sulla tempia mentre le gradinate
            fischiano. All'alba Vesna ti porta l'acqua e ti dice che stasera
            Ragh ti aspetta nella sala lunga lo stesso.
          effetti: { fazione.ghoran: 1, scandalo: 0.5, ferite: 0.5 }
      - testo: "Lasciare che il tuo avversario si stanchi da solo"
        descrizione: "Si resta in guardia a parare finché l'altro si stanca. Il campo fischia, e la ripresa dura fino all'ultima torcia."
        costo: 2
        esito:
          titolo: L'ultima torcia
          testo: |
            Pari colpi finché le braccia ti diventano di legno, e le
            gradinate si svuotano a metà prima che il gladiatore si sieda da
            solo nella sabbia. Il tamburo batte due volte, stanco anche lui.
            All'alba Vesna ti dice che stasera Ragh ti aspetta nella sala
            lunga, e che si è annoiato.
          effetti: { fazione.ghoran: 1, ferite: 0.5 }
      - testo: "Farti riconoscere dai mercenari tornati da Qir-Azel"
        descrizione: "Sulle gradinate ci sono uomini di Durgan, tornati a Ghoran dopo il cerchio di gesso. Si ricordano chi c'era."
        quando: [scuri.durgan == 1]
        esito:
          titolo: Il cerchio di gesso
          testo: |
            Sulle gradinate qualcuno ti riconosce e lo dice al vicino, e in
            poco tutta la fila dei mercenari tornati da Qir-Azel batte i piedi
            prima ancora che tu entri. Il gladiatore della Pece ti guarda
            meglio. La ripresa è breve, e finisce con lui che ti offre la mano
            per rialzarsi. All'alba Vesna ti dice che Ragh stasera ti aspetta
            nella sala lunga, e che ha voluto sapere del cerchio.
          effetti: { fazione.ghoran: 1, rep.ghoran: 0.5 }

  # ------------------------------------------------------------ 2 → 3 · la sala lunga (grado 1)
  - id: ghoran-la-sala-lunga
    presso: ghoran
    immagine: ambientazione/ghoran
    titolo: La sala lunga
    sommario: "Ragh Kor'Nul ti riceve nella sua palafitta, dove si siedono i capi dei clan. Ha letto il numero sulla tavoletta e ti ha visto cadere o restare in piedi."
    luogo: Ghoran, la sala lunga di Ragh Kor'Nul
    area: superficie-fratturata
    requisiti: [fazione.ghoran == 2]
    testo: |
      La palafitta di Ragh è la più grande di Ghoran, una sala lunga di
      legno annerito piantata in mezzo alla pozza più profonda, e ci si
      arriva da una passerella sola. Dentro c'è un fuoco basso in una buca di
      pietre e intorno al fuoco le panche dei clan, ognuna con il suo segno
      inciso sullo schienale. Sulla panca del Guado c'è la cera verde, su
      quella della Pece un'impronta nera di mano.

      Ragh siede in fondo, su una sedia di legno nero con i braccioli
      consumati. Ha la tavoletta della palizzata sulle ginocchia. Prima di
      parlare batte due volte le nocche sul bracciolo, piano, come si
      posano due pesi sul piatto.

      «Ti ho pesato due volte» dice, con una voce che sembra salire dal
      fondo della pozza. «Sulla bilancia e nel campo. Adesso ti faccio una
      domanda, e quella è la terza pesata. Perché sei venuto a Ghoran?»

      {intimidire Media} Non serve a niente fargli paura. Un uomo così ha
      smesso di averne prima che tu nascessi.

      {percezione Facile} La benda di cuoio sull'occhio è nuova, mentre il
      laccio che la tiene è vecchio e ricucito più volte.

      Sulla panca della Pece, Vesna ti fa un cenno con il mento.
    opzioni:
      - testo: "Rispondergli la verità, tutta"
        descrizione: "Ragh ha una memoria che non perdona. Con lui conviene che la prima risposta sia anche l'ultima."
        prova: { attributo: sociale, abilita: [persuasione, empatia], difficolta: Media }
        successo:
          titolo: La terza pesata
          testo: |
            Gli dici perché sei venuto, e anche quello che speri di trovare.
            Ragh ascolta fino in fondo, poi batte le nocche una volta sola e
            ti lancia un filo di rame lungo un braccio. Vesna te lo intreccia
            nei capelli davanti ai capi dei clan.

            Mentre bevete il vino di resina i capi parlano fra loro. Il
            vecchio della Pece racconta di un osso di ferro nero sulle alture
            a sud, che fa cantare i coltelli, e quello del Guado di tre colpi
            che qualcuno batte a mezzanotte sotto il guado nord della palude.
          pe: { persuasione: 3 }
          almeno: { rep.ghoran: 2 }
          effetti: { fazione.ghoran: 1, monete: 30, oggetto.ghoran-filo-di-rame: 1, traccia.costola: 1, traccia.tamburi: 1 }
        fallimento:
          titolo: La risposta storta
          testo: |
            Cominci a rispondere e ti perdi a metà, e Ragh aspetta in silenzio
            finché sulle panche qualcuno tossisce. Alla fine batte le nocche
            una volta e ti lancia lo stesso un filo di rame, perché, dice, anche
            chi si perde ha un peso. Vesna te lo intreccia nei capelli.

            Mentre bevete il vino di resina i capi parlano fra loro. Il
            vecchio della Pece racconta di un osso di ferro nero sulle alture
            a sud, che fa cantare i coltelli, e quello del Guado di tre colpi
            che qualcuno batte a mezzanotte sotto il guado nord della palude.
          almeno: { rep.ghoran: 2 }
          effetti: { fazione.ghoran: 1, monete: 30, oggetto.ghoran-filo-di-rame: 1, traccia.costola: 1, traccia.tamburi: 1, scandalo: 0.5 }
      - testo: "Rispondergli con una domanda sulla Fossa"
        descrizione: "Sotto il campo ce n'è un altro, dicono i carovanieri. Chiederlo a Ragh in faccia è un modo di farsi pesare."
        prova: { attributo: sociale, abilita: [intimidire, galateo], difficolta: Difficile }
        successo:
          titolo: La domanda giusta
          testo: |
            Gli dici che sei venuto per vedere che cosa c'è sotto il campo.
            Sulle panche cala un silenzio di legno. Ragh ti guarda a lungo con
            l'occhio buono, poi ride, piano, dal fondo del petto, e ti lancia
            un filo di rame. Ti dice che sotto il campo ci si scende per due
            motivi soli, e che nessuno dei due lo auguri a nessuno.

            Più tardi, con il vino di resina, i capi parlano di altre cose. Il
            vecchio della Pece racconta di un osso di ferro nero sulle alture
            a sud, che fa cantare i coltelli, e quello del Guado di tre colpi
            che qualcuno batte a mezzanotte sotto il guado nord della palude.
          pe: { intimidire: 3 }
          almeno: { rep.ghoran: 2 }
          effetti: { fazione.ghoran: 1, monete: 30, oggetto.ghoran-filo-di-rame: 1, traccia.costola: 1, traccia.tamburi: 1, rep.ghoran: 0.5 }
        fallimento:
          titolo: Il silenzio di legno
          testo: |
            Nomini la Fossa, e Ragh smette di guardarti. Batte le nocche una
            volta e parla d'altro con il capo del Guado, finché Vesna non ti
            mette in mano il filo di rame da parte sua e te lo intreccia lei.

            Più tardi, con il vino di resina, i capi parlano di altre cose. Il
            vecchio della Pece racconta di un osso di ferro nero sulle alture
            a sud, che fa cantare i coltelli, e quello del Guado di tre colpi
            che qualcuno batte a mezzanotte sotto il guado nord della palude.
          almeno: { rep.ghoran: 2 }
          effetti: { fazione.ghoran: 1, monete: 30, oggetto.ghoran-filo-di-rame: 1, traccia.costola: 1, traccia.tamburi: 1, sospetto: 0.5 }
      - testo: "Restare zitto finché non parla lui"
        descrizione: "A Ghoran il primo che parla vende. Si può aspettare, se si regge lo sguardo di un occhio solo."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Media }
        successo:
          titolo: Chi parla per primo
          testo: |
            Resti zitto e lo guardi, e il fuoco fra voi si abbassa. Alla fine
            è Ragh a battere le nocche e a dire che chi sa stare zitto a Ghoran
            vende caro. Ti lancia un filo di rame, e Vesna te lo intreccia nei
            capelli.

            Con il vino di resina i capi si sciolgono. Il vecchio della Pece
            racconta di un osso di ferro nero sulle alture a sud, che fa
            cantare i coltelli, e quello del Guado di tre colpi che qualcuno
            batte a mezzanotte sotto il guado nord della palude.
          pe: { resilienza: 3 }
          almeno: { rep.ghoran: 2 }
          effetti: { fazione.ghoran: 1, monete: 30, oggetto.ghoran-filo-di-rame: 1, traccia.costola: 1, traccia.tamburi: 1, rep.ghoran: 0.5 }
        fallimento:
          titolo: Il primo che parla
          testo: |
            Reggi il suo sguardo fino a quando un ciocco crolla nel fuoco, e
            allora parli tu, per primo, di una cosa qualsiasi. Sulle panche
            qualcuno sorride. Ragh ti lancia lo stesso il filo di rame, e
            Vesna te lo intreccia nei capelli scuotendo la testa.

            Con il vino di resina i capi si sciolgono. Il vecchio della Pece
            racconta di un osso di ferro nero sulle alture a sud, che fa
            cantare i coltelli, e quello del Guado di tre colpi che qualcuno
            batte a mezzanotte sotto il guado nord della palude.
          almeno: { rep.ghoran: 2 }
          effetti: { fazione.ghoran: 1, monete: 30, oggetto.ghoran-filo-di-rame: 1, traccia.costola: 1, traccia.tamburi: 1, scandalo: 0.5 }
      - testo: "Lasciare che risponda Vesna per te"
        descrizione: "Vesna ti ha portato fin qui, e conosce la sala. Una risposta sua però resta sua."
        esito:
          titolo: La voce di Vesna
          testo: |
            Guardi Vesna, e Vesna si alza dalla panca. Dice a Ragh che sei
            venuto perché l'Arena ti stava stretta, e la sala ride. Ragh batte
            le nocche, ti lancia un filo di rame e dice a Vesna di
            intrecciartelo lei, visto che parla lei.

            Con il vino di resina i capi si sciolgono. Il vecchio della Pece
            racconta di un osso di ferro nero sulle alture a sud, che fa
            cantare i coltelli, e quello del Guado di tre colpi che qualcuno
            batte a mezzanotte sotto il guado nord della palude.
          almeno: { rep.ghoran: 2 }
          effetti: { fazione.ghoran: 1, monete: 30, oggetto.ghoran-filo-di-rame: 1, traccia.costola: 1, traccia.tamburi: 1 }
      - testo: "Mostrargli il polso"
        descrizione: "La riga chiara sul polso a Ghoran la sanno leggere tutti. Ragh la sa leggere meglio di tutti."
        quando: [origine.fuggiasco-di-ghoran >= 1]
        esito:
          titolo: La riga sul polso
          testo: |
            Tiri su la manica e gli mostri il polso, senza dire niente. Sulle
            panche nessuno si muove. Ragh guarda la riga a lungo, poi batte
            le nocche due volte e dice che chi è scappato dai recinti e torna
            da solo, con il suo invito, pesa più di chi non se n'è mai andato.
            Ti lancia il filo di rame, quello che porta chi combatte per un
            clan, e Vesna te lo intreccia nei capelli con le dita lente.

            Con il vino di resina i capi si sciolgono. Il vecchio della Pece
            racconta di un osso di ferro nero sulle alture a sud, che fa
            cantare i coltelli, e quello del Guado di tre colpi che qualcuno
            batte a mezzanotte sotto il guado nord della palude.
          pe: { resilienza: 3 }
          almeno: { rep.ghoran: 2 }
          effetti: { fazione.ghoran: 1, monete: 30, oggetto.ghoran-filo-di-rame: 1, traccia.costola: 1, traccia.tamburi: 1, rep.ghoran: 0.5 }

  # ------------------------------------------------------------ 3 → 4 · un morto nel campo
  - id: ghoran-un-morto-nel-campo
    presso: ghoran
    immagine: ambientazione/arena-di-qir-azel
    titolo: Un morto nel campo
    sommario: "In una ripresa di notte un ragazzo della Pece è morto per un graffio. La Pece chiede la Fossa, e Ragh cerca qualcuno senza clan che faccia da peso."
    luogo: Ghoran, il campo dei gladiatori all'alba
    area: superficie-fratturata
    requisiti: [fazione.ghoran == 3]
    testo: |
      All'alba il campo dei gladiatori è vuoto, a parte due clan che si
      guardano dai lati opposti della sabbia. In mezzo, steso su una porta
      tolta dai cardini, c'è Jarko della Pece, un ragazzo di sedici anni con
      un graffio sull'avambraccio lungo un dito. Ieri notte è entrato nel
      campo per una ripresa contro Tibbo, un comprato del Guado, ed è uscito
      sulle sue gambe. Prima di mezzanotte era già morto nella palafitta
      della Pece.

      Gedda della Pece, una donna grigia con le braccia coperte di
      cicatrici, mastica resina senza guardare nessuno. Dice che la lama di
      Tibbo era sporca e che la Pece chiede la Fossa. Ostrav del Guado si
      gira l'anello di cera verde intorno al dito e risponde che un graffio
      è un graffio, e che la merce non si butta di sotto per un graffio.

      {medicina Media} L'avambraccio del ragazzo è nero intorno al taglio,
      e il nero sale in righe sottili verso il gomito. Da solo, un graffio
      così non ha mai ammazzato un ragazzo di sedici anni.

      Ragh arriva dalla passerella e si ferma accanto alla porta. «La Fossa
      non si apre per un graffio» dice. «E nemmeno si tiene chiusa per un
      anello. Serve un peso.» Batte due volte le nocche sulla porta e
      guarda te.

      {origine fuggiasco-di-ghoran} Tibbo sta in piedi dietro Ostrav con la
      schiena curva e gli occhi bassi, nella posa che avevi anche tu. Ha le
      dita che si muovono piano lungo la coscia, e parlano.
    opzioni:
      - testo: "Guardare la ferita da vicino"
        descrizione: "Il nero che sale dal graffio ha una forma. Chi la sa leggere sa anche da dove viene."
        prova: { attributo: mentale, abilita: [medicina, natura], difficolta: Media }
        successo:
          titolo: Il fiele
          testo: |
            Ti chini sul ragazzo e annusi il taglio. Sotto l'odore del sangue
            ce n'è un altro, dolciastro come la frutta marcia, che hai sentito soltanto
            sulle rive della palude. È fiele d'anguilla nera, e qualcuno l'ha
            spalmato sulla lama. Lo dici a Ragh a voce bassa. Lui annuisce e
            ti dice che sul margine della palude c'è un solo anguillaio che lo
            vende.
          pe: { medicina: 3 }
          effetti: { fazione.ghoran: 1, rep.ghoran: 0.5 }
        fallimento:
          titolo: Il nero
          testo: |
            Tocchi il taglio con le dita, e un poco del nero ti resta sui
            polpastrelli e brucia. Gedda ti allontana dal ragazzo con una
            spinta. Più tardi Oska, guardandoti le dita, ti dice che è fiele
            d'anguilla nera e che sul margine della palude c'è un solo
            anguillaio che lo vende.
          effetti: { fazione.ghoran: 1, contaminazione: 0.5 }
      - testo: "Parlare con Tibbo"
        descrizione: "Il comprato del Guado non ha detto una parola. Forse nessuno gliel'ha chiesta nel modo giusto."
        prova: { attributo: sociale, abilita: empatia, difficolta: Media }
        successo:
          titolo: Le dita di Tibbo
          testo: |
            Ti metti davanti a Tibbo, abbastanza vicino perché Ostrav non
            senta, e gli chiedi chi gli ha dato la lama. Tibbo guarda Ostrav,
            poi le tue mani, e risponde con le dita contro la coscia. Gli
            hanno dato una bottiglia sul margine della palude, e gliel'ha data
            un uomo con la cera verde sulla spalla. Ragh
            ti dice che sul margine della palude c'è un solo anguillaio che
            vende cose da mettere sulle lame.
          pe: { empatia: 3 }
          effetti: { fazione.ghoran: 1, rep.ghoran: 0.5 }
        fallimento:
          titolo: Lo sguardo di Ostrav
          testo: |
            Ti avvicini a Tibbo, e Ostrav si mette in mezzo con un sorriso da
            mercante. Il comprato abbassa gli occhi e non li rialza più. Più
            tardi Vesna ti dice che la lama di Tibbo puzzava di palude, e che
            sul margine della palude c'è un solo anguillaio che vende veleni.
          effetti: { fazione.ghoran: 1, sospetto: 0.5 }
      - testo: "Chiedere di vedere la lama di Tibbo"
        descrizione: "Una lama da ripresa è smussata sul filo. Questa forse è stata preparata in un altro modo."
        prova: { attributo: fisico, abilita: armi-da-mischia, difficolta: Media }
        successo:
          titolo: La punta
          testo: |
            Ostrav te la porge di malavoglia. Il filo è smussato come vuole la
            regola, mentre la punta è stata rifatta sottile con la pietra, e
            nel solco c'è una crosta nera. Gedda la vede e sputa la resina
            sulla sabbia. Ragh prende la lama e te la rende, e ti dice che sul
            margine della palude c'è un solo anguillaio che vende quella crosta.
          pe: { armi-da-mischia: 3 }
          effetti: { fazione.ghoran: 1, rep.ghoran: 0.5 }
        fallimento:
          titolo: La lama pulita
          testo: |
            Ostrav ti porge la lama, e la lama è pulita, lucidata di fresco.
            Gedda ride male. Ragh però ti prende la lama di mano e la annusa,
            e ti dice che sul margine della palude c'è un solo anguillaio che
            vende cose con quell'odore.
          effetti: { fazione.ghoran: 1, scandalo: 0.5 }
      - testo: "Vegliare il ragazzo con la Pece"
        descrizione: "La Pece veglia i suoi morti fino al tramonto. Chi veglia con loro sente quello che i clan si dicono a voce bassa."
        costo: 2
        esito:
          titolo: La veglia
          testo: |
            Ti siedi con la Pece intorno alla porta fino al tramonto, a
            masticare la resina che ti passa Gedda. A metà pomeriggio una
            ragazza racconta di aver visto un uomo del Guado tornare dalla
            palude due giorni fa, con una bottiglia. Ragh, quando glielo dici,
            ti dà il nome dell'anguillaio che vende fiele sul margine.
          effetti: { fazione.ghoran: 1, tormento: 0.5 }
      - testo: "Rispondere a Tibbo con le dita"
        descrizione: "La lingua dei recinti si parla con le mani, e tu non l'hai dimenticata."
        quando: [origine.fuggiasco-di-ghoran >= 1]
        esito:
          titolo: La lingua dei recinti
          testo: |
            Ti metti accanto a Tibbo con le mani lungo i fianchi, e le dita
            fanno le domande da sole. Lui risponde senza alzare gli occhi.
            Gli hanno dato una bottiglia sul margine della palude, e gliel'ha
            data un uomo del Guado con la cera verde sulla spalla, a uno che
            non poteva dire di no. Ragh ti guarda le
            mani e non chiede che cosa vi siete detti. Ti dà il nome
            dell'anguillaio che vende fiele sul margine della palude.
          pe: { empatia: 3 }
          effetti: { fazione.ghoran: 1, rep.ghoran: 0.5 }

  # ------------------------------------------------------------ 4 → 5 · il fiele d'anguilla
  - id: ghoran-il-fiele-d-anguilla
    presso: ghoran
    immagine: ambientazione/palude-acquanera
    titolo: Il fiele d'anguilla
    sommario: "Sul margine della Palude Acquanera, a mezza giornata da Ghoran, un anguillaio vende fiele per le lame. Qualcuno del Guado ci è arrivato prima di te."
    luogo: Il margine della Palude Acquanera, la capanna dell'anguillaio
    area: superficie-fratturata
    requisiti: [fazione.ghoran == 4]
    testo: |
      La capanna dell'anguillaio sta a mezza giornata da Ghoran, dove il
      margine della Palude Acquanera fa una lingua di fango asciutto fra i
      canneti. È fatta di canne legate con lo spago, e sul tetto ci sono le
      nasse ad asciugare, tante che la capanna sembra coperta di gabbie.

      Malvo l'anguillaio è un uomo piccolo con le dita senza unghie per
      l'acqua, e ti aspetta sulla porta con un bastone in mano. Davanti alla
      capanna, nel fango, ci sono le impronte fresche di due cani e di un
      uomo con gli stivali chiodati.

      {natura Media} Le anguille nere non si pescano con la nassa. Si
      prendono a mano nelle pozze calde, e il fiele si tira fuori subito,
      sennò si guasta. Chi lo vende ne tiene sempre poco.

      {percezione Facile fallita} Ti sembra che nei canneti a destra si
      muova il vento. Poi ti ricordi che oggi il vento non c'è.

      «Non vendo niente» dice Malvo, e stringe il bastone. «Stamattina è
      passato uno del Guado a dirmi che non vendo niente.»
    opzioni:
      - testo: "Aspettare i cani del Guado e affrontarli"
        descrizione: "Nei canneti ci sono i cani da presa che il Guado usa per i fuggiaschi. Sono cani che aspettano un ordine senza abbaiare."
        combattimento: ghoran-i-cani-del-guado
        vittoria:
          titolo: I cani muti
          testo: |
            I cani escono dai canneti senza un verso e ti vengono addosso
            insieme. Quando l'ultimo resta nel fango l'uomo con gli stivali
            chiodati è già lontano, e ha perso una bottiglia vuota con il
            tappo di cera verde. Malvo la raccoglie e te la dà, e ti dice che
            gliel'ha comprata il cacciatore di Ostrav, la settimana scorsa,
            piena di fiele.
          effetti: { fazione.ghoran: 1, rep.ghoran: 0.5 }
        sconfitta:
          titolo: Il morso alla gamba
          testo: |
            Un cane ti prende alla gamba e non molla, finché un fischio dai
            canneti lo richiama. Quando ti rialzi i cani se ne sono andati, e
            nel fango c'è una bottiglia vuota con il tappo di cera verde, persa
            nella fretta. Malvo ti fascia la gamba e ti dice di chi è.
          effetti: { fazione.ghoran: 1, tormento: 0.5 }
      - testo: "Far parlare Malvo"
        descrizione: "Ha più paura del Guado che di te. Bisogna fargli capire che il Guado stavolta perde."
        prova: { attributo: sociale, abilita: [persuasione, intimidire], difficolta: Media }
        successo:
          titolo: La bottiglia con la cera
          testo: |
            Gli dici che Ragh ti ha mandato a pesare questa storia, e che il
            filo di rame nei tuoi capelli vale più di due cani. Malvo ci pensa
            a lungo, poi entra nella capanna e torna con una bottiglia uguale
            a quella che ha venduto. Il cacciatore di Ostrav gliel'ha comprata
            la settimana scorsa, e l'ha chiusa con il suo tappo di cera verde.
          pe: { persuasione: 3 }
          effetti: { fazione.ghoran: 1, rep.ghoran: 0.5 }
        fallimento:
          titolo: Il bastone
          testo: |
            Alzi la voce, e Malvo alza il bastone. Ti allontani di tre passi,
            e lui si calma abbastanza da dirti soltanto un nome, il cacciatore
            di Ostrav, prima di chiudersi dentro. Il resto lo trovi da solo,
            una bottiglia rotta con un pezzo di cera verde fra i canneti.
          effetti: { fazione.ghoran: 1, scandalo: 0.5 }
      - testo: "Cercare le pozze calde delle anguille nere"
        descrizione: "Chi compra il fiele a volte se lo va a prendere da solo. Le pozze calde stanno vicino ai canneti."
        prova: { attributo: mentale, abilita: [natura, percezione], difficolta: Media }
        successo:
          titolo: Le pozze calde
          testo: |
            Trovi le pozze calde dietro i canneti, e accanto a una ci sono i
            resti di tre anguille nere aperte con il coltello e una bottiglia
            dimenticata, con il tappo di cera verde. Quando la porti a Malvo
            lui annuisce e ti dice il nome che ti serve, quello del cacciatore
            di Ostrav.
          pe: { natura: 3 }
          effetti: { fazione.ghoran: 1, rep.ghoran: 0.5 }
        fallimento:
          titolo: L'acqua calda
          testo: |
            Metti un piede nella pozza sbagliata, e l'acqua calda ti sale fino
            al ginocchio insieme a qualcosa che morde. Ne esci con un taglio
            sul polpaccio e una bottiglia con il tappo di cera verde che ti
            era rimasta sotto la scarpa. Malvo ti dice di chi è.
          effetti: { fazione.ghoran: 1, contaminazione: 0.5 }
      - testo: "Comprare tutto quello che Malvo ha pescato oggi"
        descrizione: "Un anguillaio che non vende niente ha comunque una giornata da pagare. Si compra la giornata, e il resto viene da sé."
        requisiti: [monete >= 10]
        esito:
          titolo: Una giornata di anguille
          testo: |
            Compri le anguille di oggi, e anche quelle di domani. Malvo conta
            le monete due volte e alla seconda decide che il Guado è lontano.
            Ti dà una bottiglia uguale a quella che ha venduto al cacciatore di
            Ostrav, con lo stesso tappo di cera verde.
          effetti: { fazione.ghoran: 1, monete: -10 }
      - testo: "Riconoscere il fiele dalle canne tagliate"
        descrizione: "Al Circolo si impara che una pianta tagliata male racconta chi l'ha tagliata. Le canne intorno alle pozze sono state tagliate di fresco."
        quando: [origine.figlio-del-circolo >= 1]
        esito:
          titolo: Le canne tagliate
          testo: |
            Le canne intorno alle pozze calde sono state tagliate di traverso,
            con una lama larga, da uno che aveva fretta e la mano destra
            forte. Segui il taglio fino a una bottiglia nascosta fra le radici
            del salice, con il tappo di cera verde. Malvo la guarda e ti dice
            di chi è, perché quel tappo l'ha visto la settimana scorsa.
          pe: { natura: 3 }
          effetti: { fazione.ghoran: 1, rep.ghoran: 0.5 }

  # ------------------------------------------------------------ 5 → 6 · sul piatto (grado 2)
  - id: ghoran-sul-piatto
    presso: ghoran
    immagine: ambientazione/ghoran
    titolo: Sul piatto
    sommario: "Al mercato dei recinti i clan si radunano intorno alla bilancia. Su un piatto c'è la bottiglia con la cera verde, sull'altro c'è quello che dirai."
    luogo: Ghoran, la bilancia del mercato dei recinti
    area: superficie-fratturata
    requisiti: [fazione.ghoran == 5]
    testo: |
      Al mercato dei recinti la bilancia grande pende da una trave annerita,
      e stasera intorno non c'è merce. Ci sono i clan, in piedi sulle
      passerelle, la Pece da una parte con le torce e il Guado dall'altra con
      i sigilli di cera verde cuciti sulle spalle. Sul piatto di sinistra
      hai posato la bottiglia di Malvo, e il piatto è sceso di un dito.

      Gedda della Pece mastica la resina così forte che le si sente la
      mascella. Ostrav ha le mani dietro la schiena e l'anello che gira fra
      le dita, e Tibbo è in piedi dietro di lui. Ragh sta seduto sotto la
      trave su uno sgabello troppo piccolo, con le nocche sul ginocchio.

      «Il peso parla» dice Ragh, e il mercato tace.

      {politica-ed-economia Media} Ostrav ha comprato il fiele per far
      vincere il suo comprato e alzare il prezzo di Tibbo. Un morto della
      Pece non era nel conto, e adesso vale più di tutto il resto.

      {empatia Facile} Gedda vuole la Fossa perché è l'unica cosa che le
      sembra grande quanto il ragazzo. Se le dai qualcosa di altrettanto
      grande, la Fossa le serve meno.

      *Una parola sbagliata, e domani scendono sotto il campo.* Le torce
      della Pece fanno fumo, e il fumo ti va negli occhi.
    opzioni:
      - testo: "Chiedere che Ostrav paghi a peso d'argento e che Tibbo sia libero"
        descrizione: "Il colpevole è chi ha comprato il fiele. Tibbo ha tenuto la lama che gli hanno dato, e a Ghoran un comprato libero è una cosa che si vede di rado."
        prova: { attributo: sociale, abilita: persuasione, difficolta: Difficile }
        successo:
          titolo: A peso d'argento
          testo: |
            Dici che il fiele l'ha comprato il Guado e che Tibbo ha tenuto la
            lama che gli hanno dato. Chiedi che Ostrav metta sul piatto tanto
            argento quanto pesava Jarko, e che Tibbo esca dal mercato senza
            corda. Gedda smette di masticare. Ragh batte le nocche due volte,
            e Ostrav paga davanti a tutti, moneta per moneta, finché il piatto
            non si alza.

            Tibbo resta fermo dove sta, perché non sa dove andare. Vesna gli
            mette una mano sulla spalla e se lo porta alla Pece. A te dice che
            da stasera il campo dei tamburi ti è aperto quando vuoi.
          pe: { persuasione: 5 }
          almeno: { rep.ghoran: 4 }
          imposta: { ghoran.verdetto: 1 }
          effetti: { fazione.ghoran: 1, monete: 40 }
        fallimento:
          titolo: Il prezzo di Tibbo
          testo: |
            Chiedi l'argento e la libertà di Tibbo. Ostrav ride, e con lui
            ride mezzo Guado. Dice che un comprato libero lo paga il peso, se
            il peso vuole. Gedda ti guarda come si guarda un ponte che cede.
            Ragh allora batte le nocche e decide lui. Ostrav paga l'argento,
            e Tibbo esce senza corda lo stesso, perché Ragh ha detto così.

            Vesna si porta Tibbo alla Pece, e a te dice che il campo dei
            tamburi ti è aperto quando vuoi, anche se stasera hai parlato male.
          almeno: { rep.ghoran: 4 }
          imposta: { ghoran.verdetto: 1 }
          effetti: { fazione.ghoran: 1, monete: 40, scandalo: 1 }
      - testo: "Dare Tibbo alla Pece in cambio del morto"
        descrizione: "È la legge vecchia di Ghoran. Il clan che toglie un uomo ne rende uno, e il Guado perde la merce che voleva vendere."
        prova: { attributo: sociale, abilita: [conoscenze-della-strada, galateo], difficolta: Media }
        successo:
          titolo: Un uomo per un uomo
          testo: |
            Dici la legge vecchia, un uomo per un uomo, e lo dici con le
            parole dei vecchi dei clan. Tibbo passa dal Guado alla Pece, e
            Ostrav perde il comprato che aveva pagato più caro di tutti. Gedda
            guarda il ragazzo che le danno al posto del suo, e alla fine
            annuisce. Ragh batte le nocche, e i clan tornano alle palafitte
            senza parlare di Fossa.

            Vesna ti dice che da stasera il campo dei tamburi ti è aperto
            quando vuoi, e non ti guarda mentre lo dice.
          pe: { conoscenze-della-strada: 5 }
          almeno: { rep.ghoran: 4 }
          imposta: { ghoran.verdetto: 2 }
          effetti: { fazione.ghoran: 1, monete: 40 }
        fallimento:
          titolo: Le parole dei vecchi
          testo: |
            Dici la legge vecchia, ma la dici con le parole sbagliate, e un
            vecchio del Guado ti corregge davanti a tutti. Ragh batte le
            nocche e la dice lui, giusta. Tibbo passa alla Pece, Ostrav
            perde il suo comprato, e i clan tornano alle palafitte senza
            parlare di Fossa.

            Vesna ti dice che il campo dei tamburi ti è aperto quando vuoi, e
            di imparare le parole prima della prossima volta.
          almeno: { rep.ghoran: 4 }
          imposta: { ghoran.verdetto: 2 }
          effetti: { fazione.ghoran: 1, monete: 40, scandalo: 0.5 }
      - testo: "Lasciare la bottiglia sul piatto e tacere"
        descrizione: "La bottiglia parla da sola. Il resto lo decide Ragh, che lo decide da diciannove anni."
        esito:
          titolo: Ragh decide
          testo: |
            Resti zitto, e il mercato aspetta con te. Alla fine Ragh si alza
            dallo sgabello, prende la bottiglia dal piatto e la spacca sulla
            trave. Decide lui. Ostrav paga l'argento, e Tibbo passa alla Pece
            al posto di Jarko. I clan tornano alle palafitte senza parlare di
            Fossa.

            Vesna ti dice che il campo dei tamburi ti è aperto quando vuoi.
            Ragh, passando, ti dice che la prossima volta il peso parla.
          almeno: { rep.ghoran: 4 }
          imposta: { ghoran.verdetto: 2 }
          effetti: { fazione.ghoran: 1, monete: 40 }
      - testo: "Mettere la tua parola sul piatto accanto a Tibbo"
        descrizione: "Sei salito su quel piatto da comprato. Adesso ci sali per un altro, e i clan lo sanno."
        quando: [origine.fuggiasco-di-ghoran >= 1]
        esito:
          titolo: Sul piatto per un altro
          testo: |
            Sali sul piatto di destra accanto alla bottiglia e dici che
            garantisci tu per Tibbo, con il tuo peso. Il piatto scende sotto
            di te. Nessuno ride. Ostrav guarda Ragh, e Ragh batte le nocche
            due volte. L'argento lo paga il Guado, e Tibbo esce dal mercato
            senza corda, dietro di te.

            Vesna se lo porta alla Pece. A te dice che il campo dei tamburi ti
            è aperto quando vuoi, e ti stringe il braccio sopra il polso.
          pe: { persuasione: 5 }
          almeno: { rep.ghoran: 4 }
          imposta: { ghoran.verdetto: 1 }
          effetti: { fazione.ghoran: 1, monete: 40 }
