# La quest di Ghoran, Atto I e II (fazione.ghoran 0 → 6). Tutte le scene stanno presso il luogo `ghoran`, tranne
# la palude del passo 5.
# - 0 → 1 `ghoran-la-bilancia-della-palizzata` (pista.arena >= 5): Vesna porta l'invito di Ragh, e alla palizzata
#   chi entra senza un clan sale sul piatto della bilancia di porta.
# - 1 → 2 `ghoran-una-ripresa-per-ragh`: una ripresa nel campo dei tamburi, con Ragh sul palco dei clan. Si va
#   avanti anche perdendo, perché Ragh pesa come si cade.
# - 2 → 3 `ghoran-la-sala-lunga` (grado 1, Pesato): Ragh ti fa la sua domanda e ti dà il filo di rame; i capi dei
#   clan parlano dell'osso di ferro sulle alture e di chi bussa al guado nord (traccia.costola, traccia.tamburi).
# - 3 → 4 `ghoran-un-morto-nel-campo`: Jarko della Pece muore in una ripresa contro Tibbo, comprato del Guado; la
#   Pece chiede la Fossa, e Ragh ti nomina peso.
# - 4 → 5 `ghoran-il-fiele-d-anguilla` (margine della Palude Acquanera): chi ha comprato il veleno.
# - 5 → 6 `ghoran-sul-piatto` (grado 2, Peso dei clan): il verdetto alla bilancia del mercato (ghoran.verdetto).
# Nomi nuovi: il vecchio della porta (senza nome), Gedda della Pece (la capa del clan di Vesna), Jarko (il ragazzo
# morto), Ostrav (il capo del clan del Guado), Tibbo (il suo comprato), Malvo (l'anguillaio della palude).
storylet:
  # ------------------------------------------------------------ 0 → 1 · la bilancia della palizzata
  - id: ghoran-la-bilancia-della-palizzata
    presso: ghoran
    immagine: ambientazione/ghoran
    titolo: La bilancia della palizzata
    sommario: "Ragh Kor'Nul vuole pesare chi ha fatto rumore all'Arena, sul piatto della palizzata."
    luogo: Ghoran, la porta della palizzata
    area: superficie-fratturata
    requisiti: [fazione.ghoran == 0, pista.arena >= 5]
    testo: |
      Da Qir-Azel a Ghoran ci sono sei giorni di strada verso sud, lungo la
      Palude Acquanera e giù per il Gradone Rosso. Il villaggio compare al
      tramonto, palafitte nere piantate nel fango con le torce di pece già
      accese sulle passerelle.

      Alla palizzata la strada finisce davanti a una bilancia da grano a due
      piatti appesa a una trave, dove un vecchio dal naso schiacciato scrive
      su una tavoletta di cera. Chi entra a Ghoran senza un clan sale sul
      piatto, e sulle assi intorno si sono fermati in parecchi, con le torce
      alzate per vederti meglio.

      Sul banco è seduta Vesna, la gladiatrice con il filo di rame nella
      treccia. «Ragh vuole sapere quanto pesi» dice, ridendo con mezza bocca.
      «Il vecchio lo scrive stasera, e domani Ragh lo legge.»

      {conoscenze-della-strada Media} Il numero conta poco, perché il vecchio
      guarda come ci sali.

      {origine fuggiasco-di-ghoran} Il piatto di ferro è consumato nello
      stesso punto di allora, dove si appoggiavano i talloni, e le mani ti
      vanno da sole alla riga chiara sul polso.
    opzioni:
      - testo: "Salire sul piatto e dire chi sei"
        descrizione: "Il vecchio scrive il peso e quello che dici, e conviene dirlo in modo che chi guarda lo ripeta."
        prova: { attributo: sociale, abilita: [persuasione, espressivita], difficolta: Media }
        successo:
          titolo: Il numero sulla tavoletta
          testo: |
            Sali sul piatto senza aspettare l'invito e dici forte il tuo nome e
            quello dell'Arena, che dalle passerelle si ripetono di bocca in bocca.
            Il vecchio scrive il numero con una riga dritta sotto, un segno buono
            secondo Vesna. Domani notte, ti dice, Ragh ti guarda combattere.
          pe: { persuasione: 3 }
          effetti: { fazione.ghoran: 1, rep.ghoran: 0.5 }
        fallimento:
          titolo: Il segno storto
          testo: |
            Il piatto oscilla e ti aggrappi alla catena fra le risate delle
            passerelle, e il vecchio scrive il numero con un segno storto. Domani
            notte, dice Vesna senza commentare, Ragh ti guarda combattere.
          effetti: { fazione.ghoran: 1, scandalo: 0.5 }
      - testo: "Tenere il peso grande a braccio teso mentre ti pesano"
        descrizione: "I gladiatori tengono a braccio teso il bronzo più grosso del banco, per farsi notare."
        prova: { attributo: fisico, abilita: [resistenza, atletica], difficolta: Media }
        successo:
          titolo: Il braccio teso
          testo: |
            Tieni il peso grande a braccio teso mentre il vecchio aggiunge bronzo
            sull'altro piatto, e sulle passerelle qualcuno batte le mani sulle
            cosce. Il vecchio fa un segno dritto sotto il numero. Domani notte,
            dice Vesna, Ragh ti guarda combattere.
          pe: { resistenza: 3 }
          effetti: { fazione.ghoran: 1, rep.ghoran: 0.5 }
        fallimento:
          titolo: Il bronzo nel fango
          testo: |
            A metà pesata il peso ti scivola nel fango sotto la bilancia e lo
            ripeschi tu, fino al gomito, mentre il vecchio ride e scrive un segno
            storto. Domani notte, dice Vesna, Ragh ti guarda combattere.
          effetti: { fazione.ghoran: 1, scandalo: 0.5 }
      - testo: "Aspettare in fila che tocchi a te"
        descrizione: "Il vecchio pesa tutti nello stesso modo, anche chi porta merce, e ci vuole la notte."
        costo: 2
        esito:
          titolo: La fila
          testo: |
            Aspetti in fila dietro due carovanieri e un cane fino a mezzanotte, e
            il vecchio ti pesa senza alzare gli occhi, con un segno a metà. Domani
            notte, dice Vesna, Ragh ti guarda combattere.
          effetti: { fazione.ghoran: 1, tormento: 0.5 }
      - testo: "Dire al vecchio chi ha fermato il carro del Pesatore"
        descrizione: "Sulla strada del fango hai fermato il carro-gabbia di Ulmo Strass, che a Ghoran conoscono tutti."
        quando: [fazione.caserma >= 12, bivio.legge == 1]
        esito:
          titolo: Il carro del Pesatore
          testo: |
            Mentre sali sul piatto glielo dici a voce bassa, e il vecchio ti
            guarda per la prima volta in faccia prima di scrivere due righe dritte
            invece di una. Vesna fischia, e ti dice che domani notte Ragh ti
            guarda combattere e che adesso sa anche lui chi sei.
          effetti: { fazione.ghoran: 1, rep.ghoran: 0.5 }
      - testo: "Salire sul piatto prima che te lo chiedano"
        descrizione: "La regola della bilancia la conosci dal fondo della fila, e il vecchio da molto prima."
        quando: [origine.fuggiasco-di-ghoran >= 1]
        esito:
          titolo: Il piede giusto
          testo: |
            Sali con i talloni nel punto consumato e le braccia lungo i fianchi,
            come ti hanno insegnato. Il vecchio ti guarda il polso con la penna
            ferma, finché Vesna gli dice che l'invito di Ragh vale fino a quando
            non esci, e allora scrive una riga dritta. Domani notte, ti dice
            Vesna, Ragh ti guarda combattere.
          pe: { resilienza: 3 }
          effetti: { fazione.ghoran: 1, rep.ghoran: 0.5 }

  # ------------------------------------------------------------ 1 → 2 · una ripresa per Ragh
  - id: ghoran-una-ripresa-per-ragh
    presso: ghoran
    immagine: ambientazione/arena-di-qir-azel
    titolo: Una ripresa per Ragh
    sommario: "Stanotte combatti nel campo dei tamburi, sotto l'occhio solo di Ragh Kor'Nul."
    luogo: Ghoran, il campo dei gladiatori
    area: superficie-fratturata
    requisiti: [fazione.ghoran == 1]
    testo: |
      Il campo è una conca di terra battuta oltre l'ultima pozza, con le
      gradinate piene fino all'ultima asse e le torce di pece in cerchio. Su
      una pedana tre ragazzi della Pece battono i tamburi, uno per chi entra
      e due per chi esce in piedi.

      Sul palco dei clan siede Ragh Kor'Nul, con le spalle larghe come una
      porta e una benda di cuoio sull'occhio sinistro, così fermo che si
      muove soltanto la sua ombra alla luce delle torce. Il tuo avversario è
      un gladiatore della Pece con la lama smussata, che saltella per
      scaldarsi.

      {armi-da-mischia Media} Chi ferisce sul serio in una ripresa d'invito
      fa sfigurare anche il suo clan.

      «Non farti ammazzare, che poi la sabbia la cambio io» ti dice Vesna
      alla sbarra.
    opzioni:
      - testo: "Combattere la ripresa"
        descrizione: "Contro un gladiatore della Pece con la lama smussata, finché uno resta a terra."
        combattimento: ghoran-una-ripresa
        vittoria:
          titolo: Due colpi di tamburo
          testo: |
            Il gladiatore della Pece resta a terra con la mano alzata, e i due
            colpi di tamburo sono per te. Ragh scende dal palco senza dire niente,
            e all'alba Vesna ti dice che stasera ti aspetta nella sala lunga.
          effetti: { fazione.ghoran: 1, rep.ghoran: 0.5 }
        sconfitta:
          titolo: Un colpo solo
          testo: |
            Finisci a terra con la sabbia in bocca al colpo solo di tamburo, e
            Ragh si sporge dal palco a guardare come ti rialzi. All'alba Vesna ti
            dice che stasera ti aspetta lo stesso nella sala lunga.
          effetti: { fazione.ghoran: 1, tormento: 0.5 }
      - testo: "Combattere senza mai colpire"
        descrizione: "Si può vincere senza ferire, facendo sbagliare l'altro fino alla fine."
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Media }
        successo:
          titolo: La sabbia
          testo: |
            Lasci che il gladiatore colpisca l'aria finché inciampa da solo, e gli
            appoggi la punta sulla spalla. Le gradinate battono i piedi e Ragh
            alza una mano sola. All'alba Vesna ti dice che stasera ti aspetta
            nella sala lunga.
          pe: { acrobazia: 3 }
          effetti: { fazione.ghoran: 1, rep.ghoran: 0.5 }
        fallimento:
          titolo: Il piede storto
          testo: |
            Alla terza schivata il piede ti si storce nella sabbia, e il
            gladiatore ti appoggia con garbo la lama di piatto sul collo. All'alba
            Vesna ti fascia la caviglia e ti dice che stasera Ragh ti aspetta
            nella sala lunga.
          effetti: { fazione.ghoran: 1, ferite: 0.5 }
      - testo: "Buttare la lama e fare ridere le gradinate"
        descrizione: "Chi fa ridere le gradinate fa ridere anche il palco."
        prova: { attributo: sociale, abilita: [espressivita, intimidire], difficolta: Media }
        successo:
          titolo: A mani nude
          testo: |
            Butti la lama e chiami il gladiatore con due dita, alla maniera dei
            lottatori della Città Bassa, e la ripresa finisce in una lotta nel
            fango fra le risate, con due colpi di tamburo per ciascuno. All'alba
            Vesna ti dice che stasera Ragh ti aspetta nella sala lunga.
          pe: { espressivita: 3 }
          effetti: { fazione.ghoran: 1, rep.ghoran: 0.5 }
        fallimento:
          titolo: La risata sbagliata
          testo: |
            Il gladiatore prende la lama buttata per un insulto e ti stende con un
            colpo di piatto sulla tempia. All'alba Vesna ti dice che stasera Ragh
            ti aspetta lo stesso nella sala lunga.
          effetti: { fazione.ghoran: 1, scandalo: 0.5, ferite: 0.5 }
      - testo: "Lasciare che il tuo avversario si stanchi da solo"
        descrizione: "Parare finché l'altro si stanca, mentre il campo fischia."
        costo: 2
        esito:
          titolo: L'ultima torcia
          testo: |
            Pari colpi finché le gradinate si svuotano a metà e il gladiatore si
            siede da solo nella sabbia. All'alba Vesna ti dice che stasera Ragh ti
            aspetta nella sala lunga, e che si è annoiato.
          effetti: { fazione.ghoran: 1, ferite: 0.5 }
      - testo: "Farti riconoscere dai mercenari tornati da Qir-Azel"
        descrizione: "Sulle gradinate ci sono uomini di Durgan che si ricordano il cerchio di gesso."
        quando: [scuri.durgan == 1]
        esito:
          titolo: Il cerchio di gesso
          testo: |
            I mercenari tornati da Qir-Azel ti riconoscono e battono i piedi prima
            ancora che tu entri, e la ripresa finisce presto, con il gladiatore
            della Pece che ti offre la mano. All'alba Vesna ti dice che Ragh
            stasera ti aspetta nella sala lunga, e che ha voluto sapere del
            cerchio.
          effetti: { fazione.ghoran: 1, rep.ghoran: 0.5 }

  # ------------------------------------------------------------ 2 → 3 · la sala lunga (grado 1)
  - id: ghoran-la-sala-lunga
    presso: ghoran
    immagine: ambientazione/ghoran
    titolo: La sala lunga
    sommario: "Ragh Kor'Nul ti riceve nella sala lunga dei clan, dopo averti pesato sulla bilancia e nel campo."
    luogo: Ghoran, la sala lunga di Ragh Kor'Nul
    area: superficie-fratturata
    requisiti: [fazione.ghoran == 2]
    testo: |
      La sala lunga di Ragh, la palafitta più grande di Ghoran, sta in mezzo
      alla pozza più profonda, e ci si arriva da una passerella sola. Intorno
      al fuoco basso ci sono le panche dei clan, ognuna con il suo segno
      inciso sullo schienale.

      Ragh siede in fondo su una sedia di legno nero, con la tavoletta della
      palizzata sulle ginocchia, e prima di parlare batte due volte le nocche
      sul bracciolo, piano, come si posano due pesi sul piatto.

      «Ti ho pesato due volte» dice, con una voce che sembra salire dal fondo
      della pozza. «Sulla bilancia e nel campo. Adesso ti faccio una domanda,
      e quella è la terza pesata. Perché sei venuto a Ghoran?»

      {percezione Facile} La benda di cuoio sull'occhio è nuova, mentre il
      laccio è vecchio e ricucito più volte.

      Sulla panca della Pece, Vesna ti fa un cenno con il mento.
    opzioni:
      - testo: "Rispondergli la verità, tutta"
        descrizione: "Ragh ha una memoria che non perdona, e la prima risposta conviene che sia l'ultima."
        prova: { attributo: sociale, abilita: [persuasione, empatia], difficolta: Media }
        successo:
          titolo: La terza pesata
          testo: |
            Gli dici la verità, tutta. Ragh batte le nocche una volta e ti lancia
            un filo di rame lungo un braccio, che Vesna ti intreccia nei capelli.

            Col vino di resina i capi parlano di un osso di ferro nero sulle
            alture a sud, che fa cantare i coltelli, e di tre colpi battuti a
            mezzanotte sotto il guado nord della palude.
          pe: { persuasione: 3 }
          almeno: { rep.ghoran: 2 }
          effetti: { fazione.ghoran: 1, monete: 30, oggetto.ghoran-filo-di-rame: 1, traccia.costola: 1, traccia.tamburi: 1 }
        fallimento:
          titolo: La risposta storta
          testo: |
            Ti perdi a metà della risposta, ma Ragh ti lancia lo stesso un filo di
            rame, perché anche chi si perde ha un peso, e Vesna te lo intreccia
            nei capelli.

            Col vino di resina i capi parlano di un osso di ferro nero sulle
            alture a sud, che fa cantare i coltelli, e di tre colpi battuti a
            mezzanotte sotto il guado nord della palude.
          almeno: { rep.ghoran: 2 }
          effetti: { fazione.ghoran: 1, monete: 30, oggetto.ghoran-filo-di-rame: 1, traccia.costola: 1, traccia.tamburi: 1, scandalo: 0.5 }
      - testo: "Rispondergli con una domanda sulla Fossa"
        descrizione: "Chiedere a Ragh in faccia del campo che c'è sotto il campo è un modo di farsi pesare."
        prova: { attributo: sociale, abilita: [intimidire, galateo], difficolta: Difficile }
        successo:
          titolo: La domanda giusta
          testo: |
            Gli dici che vuoi vedere cosa c'è sotto il campo. Ragh ride, ti lancia
            un filo di rame e dice che laggiù si scende per due motivi soli, e
            nessuno dei due è bello.

            Col vino di resina i capi parlano di un osso di ferro nero sulle
            alture a sud che fa cantare i coltelli, e di tre colpi a mezzanotte
            sotto il guado nord della palude.
          pe: { intimidire: 3 }
          almeno: { rep.ghoran: 2 }
          effetti: { fazione.ghoran: 1, monete: 30, oggetto.ghoran-filo-di-rame: 1, traccia.costola: 1, traccia.tamburi: 1, rep.ghoran: 0.5 }
        fallimento:
          titolo: Il silenzio di legno
          testo: |
            Nomini la Fossa, e Ragh si mette a parlare d'altro, così il filo di
            rame te lo intreccia Vesna, da parte sua.

            Col vino di resina i capi parlano di un osso di ferro nero sulle
            alture a sud, che fa cantare i coltelli, e di tre colpi battuti a
            mezzanotte sotto il guado nord della palude.
          almeno: { rep.ghoran: 2 }
          effetti: { fazione.ghoran: 1, monete: 30, oggetto.ghoran-filo-di-rame: 1, traccia.costola: 1, traccia.tamburi: 1, sospetto: 0.5 }
      - testo: "Restare zitto finché non parla lui"
        descrizione: "A Ghoran il primo che parla vende, se reggi lo sguardo di un occhio solo."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Media }
        successo:
          titolo: Chi parla per primo
          testo: |
            Resti zitto finché è Ragh a battere le nocche e a dire che chi sa
            stare zitto a Ghoran vende caro. Ti lancia un filo di rame, e Vesna te
            lo intreccia nei capelli.

            Col vino di resina i capi parlano di un osso di ferro nero sulle
            alture a sud, che fa cantare i coltelli, e di tre colpi battuti a
            mezzanotte sotto il guado nord della palude.
          pe: { resilienza: 3 }
          almeno: { rep.ghoran: 2 }
          effetti: { fazione.ghoran: 1, monete: 30, oggetto.ghoran-filo-di-rame: 1, traccia.costola: 1, traccia.tamburi: 1, rep.ghoran: 0.5 }
        fallimento:
          titolo: Il primo che parla
          testo: |
            Quando un ciocco crolla nel fuoco parli tu per primo, di una cosa
            qualsiasi, e Ragh ti lancia lo stesso il filo di rame. Vesna te lo
            intreccia scuotendo la testa.

            Col vino di resina i capi parlano di un osso di ferro nero sulle
            alture a sud, che fa cantare i coltelli, e di tre colpi battuti a
            mezzanotte sotto il guado nord della palude.
          almeno: { rep.ghoran: 2 }
          effetti: { fazione.ghoran: 1, monete: 30, oggetto.ghoran-filo-di-rame: 1, traccia.costola: 1, traccia.tamburi: 1, scandalo: 0.5 }
      - testo: "Lasciare che risponda Vesna per te"
        descrizione: "Vesna ti ha portato fin qui e conosce la sala, però una risposta sua resta sua."
        esito:
          titolo: La voce di Vesna
          testo: |
            Vesna dice a Ragh che sei venuto perché l'Arena ti stava stretta, e la
            sala ride. Ragh le dice di intrecciarti lei il filo di rame, visto che
            parla lei.

            Col vino di resina i capi parlano di un osso di ferro nero sulle
            alture a sud, che fa cantare i coltelli, e di tre colpi battuti a
            mezzanotte sotto il guado nord della palude.
          almeno: { rep.ghoran: 2 }
          effetti: { fazione.ghoran: 1, monete: 30, oggetto.ghoran-filo-di-rame: 1, traccia.costola: 1, traccia.tamburi: 1 }
      - testo: "Mostrargli il polso"
        descrizione: "La riga chiara sul polso a Ghoran la sanno leggere tutti, e Ragh meglio di tutti."
        quando: [origine.fuggiasco-di-ghoran >= 1]
        esito:
          titolo: La riga sul polso
          testo: |
            Gli mostri il polso. Ragh guarda la riga e dice che un fuggiasco
            tornato con il suo invito pesa più di chi non se n'è mai andato, e
            Vesna ti intreccia il filo di rame.

            Col vino di resina i capi parlano di un osso di ferro nero sulle
            alture a sud che fa cantare i coltelli, e di tre colpi a mezzanotte
            sotto il guado nord della palude.
          pe: { resilienza: 3 }
          almeno: { rep.ghoran: 2 }
          effetti: { fazione.ghoran: 1, monete: 30, oggetto.ghoran-filo-di-rame: 1, traccia.costola: 1, traccia.tamburi: 1, rep.ghoran: 0.5 }

  # ------------------------------------------------------------ 3 → 4 · un morto nel campo
  - id: ghoran-un-morto-nel-campo
    presso: ghoran
    immagine: ambientazione/arena-di-qir-azel
    titolo: Un morto nel campo
    sommario: "Per un graffio è morto un ragazzo della Pece, e Ragh cerca un peso senza clan."
    luogo: Ghoran, il campo dei gladiatori all'alba
    area: superficie-fratturata
    requisiti: [fazione.ghoran == 3]
    testo: |
      All'alba, nel campo vuoto, su una porta tolta dai cardini, c'è Jarko
      della Pece, sedicenne, con un graffio sull'avambraccio. Ieri notte ha
      combattuto una ripresa contro Tibbo, un comprato del Guado, ed è morto
      prima di mezzanotte.

      Gedda, che guida la Pece, dice che la lama di Tibbo era sporca e che
      la Pece chiede la Fossa. Ostrav del Guado gira fra le dita l'anello di
      cera verde e risponde che la merce non si butta di sotto per un
      graffio.

      «La Fossa non si apre per un graffio, né si tiene chiusa per un
      anello» dice Ragh. «Serve un peso.» E guarda te.

      {medicina Media} Intorno al taglio la pelle è nera, e il nero sale in
      righe sottili verso il gomito.

      {origine fuggiasco-di-ghoran} Tibbo sta dietro Ostrav con gli occhi
      bassi, nella posa che avevi anche tu, e le dita gli parlano lungo la
      coscia.
    opzioni:
      - testo: "Guardare la ferita da vicino"
        descrizione: "Il nero che sale dal graffio dice da dove viene, a chi lo sa leggere."
        prova: { attributo: mentale, abilita: [medicina, natura], difficolta: Media }
        successo:
          titolo: Il fiele
          testo: |
            Annusi il taglio, e sotto il sangue senti un odore dolciastro di frutta
            marcia che conosci dalle rive della palude, fiele d'anguilla nera. Ragh
            ti dice che sul margine della palude c'è un solo anguillaio che lo vende.
          pe: { medicina: 3 }
          effetti: { fazione.ghoran: 1, rep.ghoran: 0.5 }
        fallimento:
          titolo: Il nero
          testo: |
            Tocchi il taglio, e il nero ti resta sui polpastrelli e brucia. Più
            tardi Oska, guardandoti le dita, ti dice che è fiele d'anguilla nera e
            che sul margine della palude c'è un solo anguillaio che lo vende.
          effetti: { fazione.ghoran: 1, contaminazione: 0.5 }
      - testo: "Parlare con Tibbo"
        descrizione: "Forse nessuno ha chiesto niente a Tibbo nel modo giusto."
        prova: { attributo: sociale, abilita: empatia, difficolta: Media }
        successo:
          titolo: Le dita di Tibbo
          testo: |
            Lontano dalle orecchie di Ostrav chiedi a Tibbo chi gli ha dato la
            lama, e lui risponde con le dita che sul margine della palude un uomo
            con la cera verde sulla spalla gli ha dato una bottiglia. Ragh ti dice
            che laggiù c'è un solo anguillaio che vende cose da mettere sulle
            lame.
          pe: { empatia: 3 }
          effetti: { fazione.ghoran: 1, rep.ghoran: 0.5 }
        fallimento:
          titolo: Lo sguardo di Ostrav
          testo: |
            Ostrav si mette in mezzo con un sorriso da mercante, e Tibbo abbassa
            gli occhi. Più tardi Vesna ti dice che la lama di Tibbo puzzava di
            palude, e che sul margine c'è un solo anguillaio che vende veleni.
          effetti: { fazione.ghoran: 1, sospetto: 0.5 }
      - testo: "Chiedere di vedere la lama di Tibbo"
        descrizione: "Una lama da ripresa è smussata sul filo, ma questa forse no."
        prova: { attributo: fisico, abilita: armi-da-mischia, difficolta: Media }
        successo:
          titolo: La punta
          testo: |
            Il filo della lama è smussato come vuole la regola, ma la punta è
            stata rifatta sottile con la pietra, e nel solco c'è una crosta nera.
            Ragh ti dice che sul margine della palude c'è un solo anguillaio che
            la vende.
          pe: { armi-da-mischia: 3 }
          effetti: { fazione.ghoran: 1, rep.ghoran: 0.5 }
        fallimento:
          titolo: La lama pulita
          testo: |
            La lama che ti porge Ostrav è lucidata di fresco, ma Ragh la annusa e
            ti dice che sul margine della palude c'è un solo anguillaio che vende
            cose con quell'odore.
          effetti: { fazione.ghoran: 1, scandalo: 0.5 }
      - testo: "Vegliare il ragazzo con la Pece"
        descrizione: "Chi veglia con la Pece fino al tramonto sente quello che i clan dicono a voce bassa."
        costo: 2
        esito:
          titolo: La veglia
          testo: |
            Vegli con la Pece fino al tramonto, e a metà pomeriggio una ragazza
            racconta di un uomo del Guado tornato dalla palude con una bottiglia.
            Ragh ti dà il nome dell'anguillaio che vende fiele sul margine.
          effetti: { fazione.ghoran: 1, tormento: 0.5 }
      - testo: "Rispondere a Tibbo con le dita"
        descrizione: "La lingua dei recinti si parla con le mani, e tu non l'hai dimenticata."
        quando: [origine.fuggiasco-di-ghoran >= 1]
        esito:
          titolo: La lingua dei recinti
          testo: |
            Le tue dita fanno le domande da sole, e Tibbo risponde senza alzare
            gli occhi che sul margine della palude un uomo del Guado con la cera
            verde sulla spalla gli ha dato una bottiglia, e lui non poteva dire di
            no. Ragh non chiede che cosa vi siete detti e ti dà il nome
            dell'anguillaio.
          pe: { empatia: 3 }
          effetti: { fazione.ghoran: 1, rep.ghoran: 0.5 }

  # ------------------------------------------------------------ 4 → 5 · il fiele d'anguilla
  - id: ghoran-il-fiele-d-anguilla
    presso: ghoran
    immagine: ambientazione/palude-acquanera
    titolo: Il fiele d'anguilla
    sommario: "Un anguillaio della palude vende fiele per le lame, e il Guado ci è arrivato prima."
    luogo: Il margine della Palude Acquanera, la capanna dell'anguillaio
    area: superficie-fratturata
    requisiti: [fazione.ghoran == 4]
    testo: |
      La capanna dell'anguillaio sta a mezza giornata da Ghoran, fra i
      canneti, così coperta di nasse ad asciugare che sembra fatta di
      gabbie. Malvo, un uomo piccolo con le dita senza unghie per l'acqua,
      ti aspetta sulla porta con un bastone, e nel fango davanti ci sono le
      impronte fresche di due cani e di un uomo con gli stivali chiodati.

      {percezione Facile fallita} Nei canneti a destra si muove il vento,
      anche se oggi il vento non c'è.

      «Non vendo niente» dice Malvo, «stamattina è passato uno del Guado a
      dirmi che non vendo niente.»
    opzioni:
      - testo: "Aspettare i cani del Guado e affrontarli"
        descrizione: "I cani da presa del Guado aspettano nei canneti senza abbaiare."
        combattimento: ghoran-i-cani-del-guado
        vittoria:
          titolo: I cani muti
          testo: |
            I cani escono dai canneti senza un verso. Quando l'ultimo resta nel
            fango l'uomo con gli stivali chiodati è già lontano, e ha perso una
            bottiglia vuota con il tappo di cera verde che Malvo, la settimana
            scorsa, ha venduto piena al cacciatore di Ostrav.
          effetti: { fazione.ghoran: 1, rep.ghoran: 0.5 }
        sconfitta:
          titolo: Il morso alla gamba
          testo: |
            Un cane ti prende alla gamba e non molla finché un fischio dai canneti
            lo richiama. Nel fango, persa nella fretta, resta una bottiglia vuota
            con il tappo di cera verde, e Malvo, fasciandoti la gamba, ti dice di
            chi è.
          effetti: { fazione.ghoran: 1, tormento: 0.5 }
      - testo: "Far parlare Malvo"
        descrizione: "Ha più paura del Guado che di te, finché non capisce che stavolta il Guado perde."
        prova: { attributo: sociale, abilita: [persuasione, intimidire], difficolta: Media }
        successo:
          titolo: La bottiglia con la cera
          testo: |
            Gli dici che ti manda Ragh e che il filo di rame nei tuoi capelli vale
            più di due cani. Malvo torna dalla capanna con una bottiglia uguale a
            quella venduta la settimana scorsa al cacciatore di Ostrav, con lo
            stesso tappo di cera verde.
          pe: { persuasione: 3 }
          effetti: { fazione.ghoran: 1, rep.ghoran: 0.5 }
        fallimento:
          titolo: Il bastone
          testo: |
            Alzi la voce, e Malvo alza il bastone. Prima di chiudersi dentro ti
            dice soltanto un nome, il cacciatore di Ostrav, e il resto lo trovi da
            solo fra i canneti, una bottiglia rotta con un pezzo di cera verde.
          effetti: { fazione.ghoran: 1, scandalo: 0.5 }
      - testo: "Cercare le pozze calde delle anguille nere"
        descrizione: "Chi compra il fiele a volte se lo va a prendere nelle pozze calde dietro i canneti."
        prova: { attributo: mentale, abilita: [natura, percezione], difficolta: Media }
        successo:
          titolo: Le pozze calde
          testo: |
            Dietro i canneti, accanto a una pozza calda, ci sono tre anguille nere
            aperte con il coltello e una bottiglia dimenticata con il tappo di
            cera verde. Malvo la guarda e ti dice il nome del cacciatore di
            Ostrav.
          pe: { natura: 3 }
          effetti: { fazione.ghoran: 1, rep.ghoran: 0.5 }
        fallimento:
          titolo: L'acqua calda
          testo: |
            Metti un piede nella pozza sbagliata e l'acqua calda ti sale al
            ginocchio insieme a qualcosa che morde. Ne esci con un taglio sul
            polpaccio e, sotto la scarpa, una bottiglia con il tappo di cera verde
            di cui Malvo ti dice il padrone.
          effetti: { fazione.ghoran: 1, contaminazione: 0.5 }
      - testo: "Comprare tutto quello che Malvo ha pescato oggi"
        descrizione: "Un anguillaio che non vende ha comunque una giornata da pagare."
        requisiti: [monete >= 10]
        esito:
          titolo: Una giornata di anguille
          testo: |
            Compri le anguille di oggi e quelle di domani, e alla seconda volta
            che conta le monete Malvo decide che il Guado è lontano. Ti dà una
            bottiglia uguale a quella venduta al cacciatore di Ostrav, con lo
            stesso tappo di cera verde.
          effetti: { fazione.ghoran: 1, monete: -10 }
      - testo: "Riconoscere il fiele dalle canne tagliate"
        descrizione: "Al Circolo si impara che una canna tagliata male racconta chi l'ha tagliata."
        quando: [origine.figlio-del-circolo >= 1]
        esito:
          titolo: Le canne tagliate
          testo: |
            Le canne intorno alle pozze sono tagliate di traverso, con una lama
            larga e fretta. Segui il taglio fino a una bottiglia con il tappo di
            cera verde nascosta fra le radici di un salice, e Malvo ti dice di chi
            è.
          pe: { natura: 3 }
          effetti: { fazione.ghoran: 1, rep.ghoran: 0.5 }

  # ------------------------------------------------------------ 5 → 6 · sul piatto (grado 2)
  - id: ghoran-sul-piatto
    presso: ghoran
    immagine: ambientazione/ghoran
    titolo: Sul piatto
    sommario: "Al mercato i clan si radunano intorno alla bilancia e alla bottiglia di cera verde."
    luogo: Ghoran, la bilancia del mercato dei recinti
    area: superficie-fratturata
    requisiti: [fazione.ghoran == 5]
    testo: |
      Al mercato dei recinti la bilancia grande pende da una trave annerita.
      Sulle passerelle ci sono i clan, la Pece con le torce e il Guado con i
      sigilli di cera verde sulle spalle. Sul piatto di sinistra hai posato
      la bottiglia di Malvo, e il piatto è sceso di un dito.

      Gedda mastica la resina così forte che le si sente la mascella. Ostrav
      gira l'anello fra le dita dietro la schiena, con Tibbo alle spalle.
      Ragh sta seduto sotto la trave su uno sgabello troppo piccolo. «Il peso
      parla» dice, e il mercato tace.

      {empatia Facile} Gedda vuole la Fossa perché è l'unica cosa che le
      sembra grande quanto il ragazzo. Se le dai qualcosa di altrettanto
      grande, la Fossa le serve meno.

      *Una parola sbagliata, e domani scendono sotto il campo.* Le torce
      della Pece fanno fumo, e il fumo ti va negli occhi.
    opzioni:
      - testo: "Chiedere che Ostrav paghi a peso d'argento e che Tibbo sia libero"
        descrizione: "Il colpevole è chi ha comprato il fiele, e a Ghoran un comprato libero è raro."
        prova: { attributo: sociale, abilita: persuasione, difficolta: Difficile }
        successo:
          titolo: A peso d'argento
          testo: |
            Chiedi che Ostrav metta sul piatto tanto argento quanto pesava Jarko e
            che Tibbo esca senza corda, perché ha soltanto tenuto la lama che gli
            hanno dato. Gedda smette di masticare. Ragh batte le nocche due volte,
            e Ostrav paga finché il piatto non si alza.

            Vesna si porta Tibbo alla Pece, e a te dice che il campo dei tamburi
            ti è aperto quando vuoi.
          pe: { persuasione: 5 }
          almeno: { rep.ghoran: 4 }
          imposta: { ghoran.verdetto: 1 }
          effetti: { fazione.ghoran: 1, monete: 40 }
        fallimento:
          titolo: Il prezzo di Tibbo
          testo: |
            Chiedi l'argento e la libertà di Tibbo, e mezzo Guado ride, finché
            Ragh batte le nocche e decide lui. Ostrav paga, e Tibbo esce senza
            corda lo stesso.

            Vesna se lo porta alla Pece e ti dice che il campo dei tamburi ti è
            aperto quando vuoi, anche se stasera hai parlato male.
          almeno: { rep.ghoran: 4 }
          imposta: { ghoran.verdetto: 1 }
          effetti: { fazione.ghoran: 1, monete: 40, scandalo: 1 }
      - testo: "Dare Tibbo alla Pece in cambio del morto"
        descrizione: "Per la legge vecchia chi toglie un uomo ne rende uno."
        prova: { attributo: sociale, abilita: [conoscenze-della-strada, galateo], difficolta: Media }
        successo:
          titolo: Un uomo per un uomo
          testo: |
            Dici la legge vecchia, un uomo per un uomo, con le parole dei vecchi
            dei clan. Tibbo passa alla Pece e Ostrav perde il comprato più caro.
            Gedda guarda il ragazzo che le danno al posto del suo e alla fine
            annuisce, e di Fossa non si parla più.

            Vesna ti dice che il campo dei tamburi ti è aperto, e non ti guarda
            mentre lo dice.
          pe: { conoscenze-della-strada: 5 }
          almeno: { rep.ghoran: 4 }
          imposta: { ghoran.verdetto: 2 }
          effetti: { fazione.ghoran: 1, monete: 40 }
        fallimento:
          titolo: Le parole dei vecchi
          testo: |
            Sbagli le parole della legge vecchia, e un vecchio del Guado ti
            corregge finché Ragh la dice lui, giusta. Tibbo passa alla Pece e di
            Fossa non si parla più.

            Vesna ti dice che il campo dei tamburi ti è aperto, e di imparare le
            parole per la prossima volta.
          almeno: { rep.ghoran: 4 }
          imposta: { ghoran.verdetto: 2 }
          effetti: { fazione.ghoran: 1, monete: 40, scandalo: 0.5 }
      - testo: "Lasciare la bottiglia sul piatto e tacere"
        descrizione: "La bottiglia parla da sola, e il resto lo decide Ragh, come da diciannove anni."
        esito:
          titolo: Ragh decide
          testo: |
            Resti zitto finché Ragh si alza, prende la bottiglia dal piatto e la
            spacca sulla trave. Ostrav paga l'argento e Tibbo passa alla Pece al
            posto di Jarko.

            Vesna ti dice che il campo dei tamburi ti è aperto quando vuoi, e
            Ragh, passando, che la prossima volta il peso parla.
          almeno: { rep.ghoran: 4 }
          imposta: { ghoran.verdetto: 2 }
          effetti: { fazione.ghoran: 1, monete: 40 }
      - testo: "Mettere la tua parola sul piatto accanto a Tibbo"
        descrizione: "Sei salito su quel piatto da comprato, e adesso ci sali per un altro."
        quando: [origine.fuggiasco-di-ghoran >= 1]
        esito:
          titolo: Sul piatto per un altro
          testo: |
            Sali sul piatto accanto alla bottiglia e garantisci tu per Tibbo, con
            il tuo peso, e il piatto scende sotto di te senza che nessuno rida.
            Ragh batte le nocche due volte. Il Guado paga, e Tibbo esce senza
            corda dietro di te.

            Vesna se lo porta alla Pece e ti stringe il braccio sopra il polso,
            dicendoti che il campo dei tamburi ti è aperto quando vuoi.
          pe: { persuasione: 5 }
          almeno: { rep.ghoran: 4 }
          imposta: { ghoran.verdetto: 1 }
          effetti: { fazione.ghoran: 1, monete: 40 }
