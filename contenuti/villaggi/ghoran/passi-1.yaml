# La quest di Ghoran, Atto I e II (fazione.ghoran 0 → 6). Tutte le scene stanno presso il luogo `ghoran`, tranne
# la palude del passo 5.
# - 0 → 1 `ghoran-la-bilancia-della-palizzata` (pista.arena >= 5): Vesna porta l'invito di Ragh, e alla palizzata
#   chi entra senza un clan sale sul piatto della bilancia di porta.
# - 1 → 2 `ghoran-una-ripresa-per-ragh`: una ripresa nel campo dei tamburi, con Ragh sul palco dei clan. Si va
#   avanti anche perdendo, perché Ragh pesa come si cade.
# - 2 → 3 `ghoran-la-sala-lunga` (grado 1, Pesato): Ragh ti fa la sua domanda e ti dà il filo di rame; i capi dei
#   clan parlano dell'osso di ferro sulle alture e di chi bussa al guado nord (traccia.costola, traccia.tamburi).
# - 3 → 4 `ghoran-un-morto-nel-campo`: Jarko della Pece muore in una ripresa contro Tibbo, comprato del Guado; la
#   Pece chiede la Fossa, e Ragh ti nomina peso.
# - 4 → 5 `ghoran-il-fiele-d-anguilla` (margine della Palude Acquanera): chi ha comprato il veleno.
# - 5 → 6 `ghoran-sul-piatto` (grado 2, Peso dei clan): il verdetto alla bilancia del mercato (ghoran.verdetto).
# Nomi nuovi: il vecchio della porta (senza nome), Gedda della Pece (la capa del clan di Vesna), Jarko (il ragazzo
# morto), Ostrav (il capo del clan del Guado), Tibbo (il suo comprato), Malvo (l'anguillaio della palude).
storylet:
  # ------------------------------------------------------------ 0 → 1 · la bilancia della palizzata
  - id: ghoran-la-bilancia-della-palizzata
    presso: ghoran
    immagine: ambientazione/ghoran
    titolo: La bilancia della palizzata
    sommario: "Ragh Kor'Nul vuole pesare chi ha fatto tanto rumore all'Arena. A Ghoran chi entra senza un clan sale sul piatto, davanti a tutti."
    luogo: Ghoran, la porta della palizzata
    area: superficie-fratturata
    requisiti: [fazione.ghoran == 0, pista.arena >= 5]
    testo: |
      Da Qir-Azel a Ghoran ci sono sei giorni di strada verso sud, lungo la Palude Acquanera e giù per il
      Gradone Rosso. L'odore del fango caldo e della pece bruciata arriva un'ora prima delle case. Il
      villaggio compare al tramonto, un groviglio di palafitte nere con le torce di pece già accese sulle
      passerelle.

      Alla palizzata la strada finisce davanti a una bilancia da grano a due piatti appesa a una trave. I
      piatti sono di ferro e larghi quanto la ruota di un carro, e la trave è annerita dove la catena la
      sfrega. Accanto ai pesi di bronzo in fila sul banco un vecchio con il naso schiacciato scrive su una
      tavoletta di cera. Chi entra a Ghoran senza un clan sale sul piatto.

      Sul banco è seduta Vesna, la gladiatrice con il filo di rame nella treccia. «Ragh vuole sapere quanto
      pesi» dice ridendo con mezza bocca. «Sali e sta' ferm{o|a}, che il vecchio è lento. Domani Ragh legge il
      numero.»

      Sulle assi intorno si è fermata gente con le torce alzate.

      {origine fuggiasco-di-ghoran} Il piatto di ferro è consumato dove si appoggiavano i talloni, e le mani
      ti vanno da sole alla riga chiara sul polso.
    opzioni:
      - testo: "Salire sul piatto e dire chi sei"
        descrizione: "Il vecchio scrive il peso e quello che dici. Bisogna dirlo in modo che chi guarda lo ripeta."
        prova: { attributo: sociale, abilita: [persuasione, espressivita], difficolta: Media }
        successo:
          titolo: Il numero sulla tavoletta
          testo: |
            Sali sul piatto senza aspettare l'invito e dici il tuo nome forte, insieme a quello dell'Arena, e
            dalle passerelle qualcuno lo ripete al vicino. Il piatto scende sotto il tuo peso con un cigolio
            di catena e si ferma a un palmo dal fango. Il vecchio scrive un numero sulla cera e sotto ci fa un
            segno, una riga dritta. Vesna dice che è un segno buono, e ti porta a dormire in una palafitta
            della Pece dove il pavimento non cede. Domani notte, ti dice, Ragh ti guarda combattere.
          pe: { persuasione: 3 }
          effetti: { fazione.ghoran: 1, rep.ghoran: 0.5 }
        fallimento:
          titolo: Il segno storto
          testo: |
            Sali sul piatto, e il piatto oscilla più del previsto. Ti aggrappi alla catena davanti a tutti,
            mentre dalle passerelle arriva una risata lunga. La catena è unta di grasso e ti lascia il palmo
            nero. Il vecchio scrive il numero e accanto ci fa un segno storto. Vesna ti porta a dormire dalla
            Pece senza commentare, e ti dice che domani notte Ragh ti guarda combattere.
          effetti: { fazione.ghoran: 1, scandalo: 0.5 }
      - testo: "Tenere il peso grande a braccio teso mentre ti pesano"
        descrizione: "Sul banco c'è un peso di bronzo più grosso degli altri. Vesna dice che i gladiatori lo tengono a braccio teso, per farsi notare."
        prova: { attributo: fisico, abilita: [resistenza, atletica], difficolta: Media }
        successo:
          titolo: Il braccio teso
          testo: |
            Prendi il peso grande e lo tieni davanti a te a braccio teso, mentre il vecchio aggiunge bronzo
            sull'altro piatto. Il manico è consumato e liscio, e il bronzo è freddo contro le dita. Quando ha
            finito il braccio ti trema appena, e sulle passerelle qualcuno batte le mani sulle cosce. Il
            vecchio fa un segno dritto sotto il numero, e Vesna ti porta a dormire dalla Pece. Domani notte,
            dice, Ragh ti guarda combattere.
          pe: { resistenza: 3 }
          effetti: { fazione.ghoran: 1, rep.ghoran: 0.5 }
        fallimento:
          titolo: Il bronzo nel fango
          testo: |
            A metà pesata il peso ti scivola e cade nel fango sotto la bilancia con un tonfo grasso. Lo
            ripeschi tu fino al gomito, e il fango tiepido lo lascia andare con un risucchio. Il vecchio ci
            mette un po' a smettere di ridere, poi scrive un numero e un segno storto. Vesna ti porta a
            dormire dalla Pece, e ti dice che domani notte Ragh ti guarda combattere.
          effetti: { fazione.ghoran: 1, scandalo: 0.5 }
      - testo: "Aspettare in fila che tocchi a te"
        descrizione: "Alla palizzata si mette in fila anche chi porta merce. Il vecchio pesa tutti nello stesso modo, e ci vuole la notte."
        costo: 2
        esito:
          titolo: La fila
          testo: |
            Ti metti in fila dietro due carovanieri e un cane, e aspetti fino a mezzanotte con il fango che ti
            sale nelle scarpe. A un certo punto il cane si addormenta sui tuoi piedi, e almeno lì il fango
            smette di salire. Quando tocca a te il vecchio ti pesa senza alzare gli occhi e scrive un numero
            con un segno a metà. Vesna, che ha aspettato con te sul banco, ti porta a dormire dalla Pece.
            Domani notte Ragh ti guarda combattere.
          effetti: { fazione.ghoran: 1, tormento: 0.5 }
      - testo: "Dire al vecchio chi ha fermato il carro del Pesatore"
        descrizione: "Sulla strada del fango hai fermato il carro-gabbia di Ulmo Strass. A Ghoran quel carro lo conoscono tutti."
        quando: [fazione.caserma >= 12, bivio.legge == 1]
        esito:
          titolo: Il carro del Pesatore
          testo: |
            Glielo dici a voce bassa, mentre sali sul piatto. Il vecchio smette di scrivere e ti guarda per la
            prima volta in faccia, poi guarda il piatto, e infine scrive il numero con due righe dritte sotto
            invece di una. Lo stilo scava la cera così a fondo che la seconda riga arriva al legno. Vesna
            fischia. Ti porta a dormire dalla Pece e ti dice che domani notte Ragh ti guarda combattere, e che
            adesso lo sa anche lui chi sei.
          effetti: { fazione.ghoran: 1, rep.ghoran: 0.5 }
      - testo: "Salire sul piatto prima che te lo chiedano"
        descrizione: "La regola della bilancia la conosci dal fondo della fila. Il vecchio la conosce da molto prima."
        quando: [origine.fuggiasco-di-ghoran >= 1]
        esito:
          titolo: Il piede giusto
          testo: |
            Sali sul piatto appoggiando i talloni nel punto consumato, come ti hanno insegnato, e tieni le
            braccia lungo i fianchi. Il ferro è freddo, e la catena sopra di te non fa nemmeno un cigolio. Il
            vecchio ti guarda i piedi e poi il polso, e la penna gli resta ferma sulla cera. Vesna scende dal
            banco e gli dice che sei invitat{o|a} da Ragh, e che l'invito di Ragh vale fino a quando non esci.
            Il vecchio scrive il numero e una riga dritta. Domani notte, ti dice Vesna mentre ti porta dalla
            Pece, Ragh ti guarda combattere.
          pe: { resilienza: 3 }
          effetti: { fazione.ghoran: 1, rep.ghoran: 0.5 }

  # ------------------------------------------------------------ 1 → 2 · una ripresa per Ragh
  - id: ghoran-una-ripresa-per-ragh
    presso: ghoran
    immagine: ambientazione/arena-di-qir-azel
    titolo: Una ripresa per Ragh
    sommario: "Nel campo dei tamburi stanotte combatti tu. Sul palco dei clan siede Ragh Kor'Nul, e guarda con il suo occhio solo."
    luogo: Ghoran, il campo dei gladiatori
    area: superficie-fratturata
    requisiti: [fazione.ghoran == 1]
    testo: |
      Il campo dei gladiatori è una conca di terra battuta oltre l'ultima pozza, con le gradinate di legno
      piene e un cerchio di torce sul bordo. Le gradinate sono travi legate con la corda, e sotto il peso
      della folla scricchiolano a ogni colpo di tamburo. Su una pedana tre ragazzi della Pece battono i
      tamburi, uno per chi entra e due per chi esce in piedi.

      Sul palco dei clan siede Ragh Kor'Nul, l'uomo più grande che tu abbia mai visto, con una benda di cuoio
      sull'occhio sinistro. Il palco sta un braccio più in alto delle gradinate, e la sedia di Ragh è l'unica
      con lo schienale. Intorno ha i capi dei clan, ognuno con il suo segno cucito sul petto.

      Il tuo avversario è un gladiatore della Pece con la lama smussata, e saltella sul posto per scaldarsi.
      Ha le spalle unte di grasso, che alla luce delle torce luccicano a ogni salto.

      «Non farti ammazzare, che poi la sabbia la cambio io» ti dice Vesna alla sbarra.
    opzioni:
      - testo: "Combattere la ripresa"
        descrizione: "Contro un gladiatore della Pece con la lama smussata, davanti alle gradinate piene."
        combattimento: ghoran-una-ripresa
        vittoria:
          titolo: Due colpi di tamburo
          testo: |
            Il gladiatore della Pece resta a terra con la mano alzata, e dalla pedana arrivano i due colpi di
            tamburo per te. Le gradinate battono i piedi sulle assi, e il rumore ti sale per le gambe dalla
            terra del campo. Ragh si alza, e il campo tace mentre lui scende dal palco senza dire niente.
            All'alba Vesna ti sveglia per dirti che stasera ti aspetta nella sala lunga.
          effetti: { fazione.ghoran: 1, rep.ghoran: 0.5 }
        sconfitta:
          titolo: Un colpo solo
          testo: |
            Finisci a terra con la sabbia in bocca, e dalla pedana arriva un colpo solo di tamburo. Hai un
            fischio nell'orecchio destro che copre il rumore delle gradinate. Mentre ti rialzi vedi Ragh che
            si sporge in avanti sul palco, attento, a guardare come ti rimetti in piedi. All'alba Vesna ti
            porta l'acqua e ti dice che stasera Ragh ti aspetta nella sala lunga lo stesso.
          effetti: { fazione.ghoran: 1, tormento: 0.5 }
      - testo: "Combattere senza mai colpire"
        descrizione: "Chi ferisce in una ripresa d'invito fa una brutta figura. Si può vincere facendo sbagliare l'altro fino alla fine."
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Media }
        successo:
          titolo: La sabbia
          testo: |
            Giri intorno al gladiatore e lo lasci colpire l'aria finché le gambe non gli pesano. A ogni colpo
            a vuoto lo senti soffiare più forte, e la sua lama scende ogni volta di un palmo. Quando inciampa
            da solo gli appoggi la punta della lama sulla spalla. Le gradinate ridono, poi battono i piedi.
            Ragh dal palco alza una mano sola. All'alba Vesna ti dice che stasera ti aspetta nella sala lunga.
          pe: { acrobazia: 3 }
          effetti: { fazione.ghoran: 1, rep.ghoran: 0.5 }
        fallimento:
          titolo: Il piede storto
          testo: |
            Alla terza schivata il piede ti si storce nella sabbia, e il gladiatore ti appoggia la lama di
            piatto sul collo con un certo garbo. La tiene lì giusto il tempo che serve, e il ferro è freddo.
            Il tamburo batte una volta. All'alba Vesna ti fascia la caviglia e ti dice che stasera Ragh ti
            aspetta nella sala lunga.
          effetti: { fazione.ghoran: 1, ferite: 0.5 }
      - testo: "Buttare la lama e fare ridere le gradinate"
        descrizione: "Una ripresa d'invito è anche uno spettacolo. Chi fa ridere il campo lo fa ridere anche dalla parte del palco."
        prova: { attributo: sociale, abilita: [espressivita, intimidire], difficolta: Media }
        successo:
          titolo: A mani nude
          testo: |
            Butti la lama nella sabbia e chiami il gladiatore con due dita, alla maniera dei lottatori della
            Città Bassa. Il campo ride insieme a lui, e la ripresa diventa una lotta nel fango che finisce con
            tutti e due seduti a terra. Il fango vi copre a chiazze, e dalle gradinate nessuno sa più chi è
            chi. Dalla pedana arrivano due colpi di tamburo per ciascuno. All'alba Vesna ti dice che stasera
            Ragh ti aspetta nella sala lunga.
          pe: { espressivita: 3 }
          effetti: { fazione.ghoran: 1, rep.ghoran: 0.5 }
        fallimento:
          titolo: La risata sbagliata
          testo: |
            Butti la lama, e il gladiatore la prende per un insulto. Ti stende con un colpo di piatto sulla
            tempia mentre le gradinate fischiano. Da terra vedi le torce del bordo sdoppiarsi e poi tornare
            una. All'alba Vesna ti porta l'acqua e ti dice che stasera Ragh ti aspetta nella sala lunga lo
            stesso.
          effetti: { fazione.ghoran: 1, scandalo: 0.5, ferite: 0.5 }
      - testo: "Lasciare che il tuo avversario si stanchi da solo"
        descrizione: "Si resta in guardia a parare finché l'altro si stanca. Il campo fischia, e la ripresa dura fino all'ultima torcia."
        costo: 2
        esito:
          titolo: L'ultima torcia
          testo: |
            Pari colpi finché le braccia ti diventano di legno, e le gradinate si svuotano a metà prima che il
            gladiatore si sieda da solo nella sabbia. Una dopo l'altra le torce del bordo si spengono, e
            nessuno le cambia. Il tamburo batte due volte, stanco anche lui. All'alba Vesna ti dice che
            stasera Ragh ti aspetta nella sala lunga, e che si è annoiato.
          effetti: { fazione.ghoran: 1, ferite: 0.5 }
      - testo: "Farti riconoscere dai mercenari tornati da Qir-Azel"
        descrizione: "Sulle gradinate ci sono uomini di Durgan, tornati a Ghoran dopo il cerchio di gesso. Si ricordano chi c'era."
        quando: [scuri.durgan == 1]
        esito:
          titolo: Il cerchio di gesso
          testo: |
            Sulle gradinate qualcuno ti riconosce e lo dice al vicino, e in poco tutta la fila dei mercenari
            tornati da Qir-Azel batte i piedi prima ancora che tu entri. Il loro rumore copre i tamburi, e i
            ragazzi della Pece smettono di battere per ascoltarlo. Il gladiatore della Pece ti guarda meglio.
            La ripresa è breve, e finisce con lui che ti offre la mano per rialzarsi. All'alba Vesna ti dice
            che Ragh stasera ti aspetta nella sala lunga, e che ha voluto sapere del cerchio.
          effetti: { fazione.ghoran: 1, rep.ghoran: 0.5 }

  # ------------------------------------------------------------ 2 → 3 · la sala lunga (grado 1)
  - id: ghoran-la-sala-lunga
    presso: ghoran
    immagine: ambientazione/ghoran
    titolo: La sala lunga
    sommario: "Ragh Kor'Nul ti riceve nella sua palafitta, dove si siedono i capi dei clan."
    luogo: Ghoran, la sala lunga di Ragh Kor'Nul
    area: superficie-fratturata
    requisiti: [fazione.ghoran == 2]
    testo: |
      La palafitta di Ragh è una sala lunga di legno annerito in mezzo alla pozza più profonda, e ci si arriva
      da una passerella sola. Il pavimento è fatto di tavole spesse un palmo e unite a incastro senza chiodi,
      e dalle fessure sale il tepore della pozza che sta sotto. Intorno al fuoco basso stanno le panche dei
      clan, ognuna con il suo segno sullo schienale. I segni sono intagliati nel legno e ripassati con la
      pece, e sulle panche più vecchie le schiene li hanno consumati fino a lasciarli lisci.

      Ragh siede in fondo su una sedia di legno nero e batte due volte le nocche sul bracciolo, come si posano
      due pesi sul piatto. Nel punto dove batte il bracciolo ha due incavi lucidi, e la benda di cuoio
      sull'occhio sinistro prende la luce del fuoco.

      «Ti ho pesato due volte» dice. «Sulla bilancia e nel campo. Adesso ti faccio una domanda, e quella è la
      terza pesata. Perché sei venut{o|a} a Ghoran?»

      Dalla panca della Pece Vesna ti fa un cenno con il mento.
    opzioni:
      - testo: "Rispondergli la verità, tutta"
        descrizione: "Ragh ha una memoria che non perdona. Con lui conviene che la prima risposta sia anche l'ultima."
        prova: { attributo: sociale, abilita: [persuasione, empatia], difficolta: Media }
        successo:
          titolo: La terza pesata
          testo: |
            Ragh ascolta fino in fondo senza staccare la mano dal bracciolo. Poi batte le nocche una volta
            sola e ti lancia un filo di rame lungo un braccio, che ti arriva in mano ancora caldo della sua.
            Vesna te lo intreccia nei capelli davanti ai capi dei clan e stringe ogni giro con il pollice.

            Il vecchio della Pece racconta di un osso di ferro nero sulle alture a sud, che fa cantare i
            coltelli, e quello del Guado di tre colpi che qualcuno batte a mezzanotte sotto il guado nord
            della palude.
          pe: { persuasione: 3 }
          almeno: { rep.ghoran: 2 }
          effetti: { fazione.ghoran: 1, monete: 30, oggetto.ghoran-filo-di-rame: 1, traccia.costola: 1, traccia.tamburi: 1 }
        fallimento:
          titolo: La risposta storta
          testo: |
            Cominci a rispondere e ti perdi a metà. Ragh aspetta in silenzio e nella sala si sente soltanto il
            fuoco che schiocca, finché sulle panche qualcuno tossisce. Alla fine batte le nocche una volta e
            ti lancia lo stesso un filo di rame. Dice che la risposta era storta, ma che fin qui ci sei
            venut{o|a} con le tue gambe.

            Il vecchio della Pece racconta di un osso di ferro nero sulle alture a sud, che fa cantare i
            coltelli, e quello del Guado di tre colpi che qualcuno batte a mezzanotte sotto il guado nord
            della palude.
          almeno: { rep.ghoran: 2 }
          effetti: { fazione.ghoran: 1, monete: 30, oggetto.ghoran-filo-di-rame: 1, traccia.costola: 1, traccia.tamburi: 1, scandalo: 0.5 }
      - testo: "Rispondergli con una domanda sulla Fossa"
        descrizione: "Sotto il campo ce n'è un altro, dicono i carovanieri. Chiederlo a Ragh in faccia è un modo di farsi pesare."
        prova: { attributo: sociale, abilita: [intimidire, galateo], difficolta: Difficile }
        successo:
          titolo: La domanda giusta
          testo: |
            Ragh ti guarda a lungo con l'occhio buono, poi ride piano dal fondo del petto, e la sedia
            scricchiola sotto di lui. Sulle panche nessuno ride con lui. Ti lancia un filo di rame e ti dice
            che sotto il campo i clan scendono soltanto per le dispute più gravi, e che per adesso a te basta
            sapere questo.

            Il vecchio della Pece racconta di un osso di ferro nero sulle alture a sud, che fa cantare i
            coltelli, e quello del Guado di tre colpi che qualcuno batte a mezzanotte sotto il guado nord
            della palude.
          pe: { intimidire: 3 }
          almeno: { rep.ghoran: 2 }
          effetti: { fazione.ghoran: 1, monete: 30, oggetto.ghoran-filo-di-rame: 1, traccia.costola: 1, traccia.tamburi: 1, rep.ghoran: 0.5 }
        fallimento:
          titolo: Il silenzio di legno
          testo: |
            Nomini la Fossa, e Ragh smette di guardarti. Batte le nocche una volta e si gira verso il capo del
            Guado per parlare d'altro a voce bassa. Resti in piedi davanti al fuoco con le mani vuote finché
            Vesna non ti mette in mano il filo di rame da parte sua e te lo intreccia lei.

            Il vecchio della Pece racconta di un osso di ferro nero sulle alture a sud, che fa cantare i
            coltelli, e quello del Guado di tre colpi che qualcuno batte a mezzanotte sotto il guado nord
            della palude.
          almeno: { rep.ghoran: 2 }
          effetti: { fazione.ghoran: 1, monete: 30, oggetto.ghoran-filo-di-rame: 1, traccia.costola: 1, traccia.tamburi: 1, sospetto: 0.5 }
      - testo: "Restare zitto finché non parla lui"
        descrizione: "A Ghoran il primo che parla vende. Si può aspettare, se si regge lo sguardo di un occhio solo."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Media }
        successo:
          titolo: Chi parla per primo
          testo: |
            Il silenzio dura tanto che il fuoco si abbassa, e nessuno si alza a metterci un ciocco. Alla fine
            è Ragh a battere le nocche e a dirti che hai retto, e che a Ghoran questo conta. Ti lancia un filo
            di rame, e Vesna te lo intreccia nei capelli.

            Il vecchio della Pece racconta di un osso di ferro nero sulle alture a sud, che fa cantare i
            coltelli, e quello del Guado di tre colpi che qualcuno batte a mezzanotte sotto il guado nord
            della palude.
          pe: { resilienza: 3 }
          almeno: { rep.ghoran: 2 }
          effetti: { fazione.ghoran: 1, monete: 30, oggetto.ghoran-filo-di-rame: 1, traccia.costola: 1, traccia.tamburi: 1, rep.ghoran: 0.5 }
        fallimento:
          titolo: Il primo che parla
          testo: |
            Reggi il suo sguardo fino a quando un ciocco crolla nel fuoco e alza una colonna di scintille.
            Allora parli tu, per primo, di una cosa qualsiasi, e la tua voce ti sembra troppo alta per la
            sala. Ragh ti lancia lo stesso il filo di rame, e Vesna te lo intreccia nei capelli scuotendo la
            testa.

            Il vecchio della Pece racconta di un osso di ferro nero sulle alture a sud, che fa cantare i
            coltelli, e quello del Guado di tre colpi che qualcuno batte a mezzanotte sotto il guado nord
            della palude.
          almeno: { rep.ghoran: 2 }
          effetti: { fazione.ghoran: 1, monete: 30, oggetto.ghoran-filo-di-rame: 1, traccia.costola: 1, traccia.tamburi: 1, scandalo: 0.5 }
      - testo: "Lasciare che risponda Vesna per te"
        descrizione: "Vesna ti ha portato fin qui, e conosce la sala. Una risposta sua però resta sua."
        esito:
          titolo: La voce di Vesna
          testo: |
            Guardi Vesna, e Vesna si alza dalla panca. Dice a Ragh che sei venut{o|a} perché l'Arena ti stava
            stretta, e la sala ride tanto che le panche scricchiolano tutte insieme. Ragh batte le nocche, ti
            lancia un filo di rame e dice a Vesna di intrecciartelo lei, visto che parla lei.

            Il vecchio della Pece racconta di un osso di ferro nero sulle alture a sud, che fa cantare i
            coltelli, e quello del Guado di tre colpi che qualcuno batte a mezzanotte sotto il guado nord
            della palude.
          almeno: { rep.ghoran: 2 }
          effetti: { fazione.ghoran: 1, monete: 30, oggetto.ghoran-filo-di-rame: 1, traccia.costola: 1, traccia.tamburi: 1 }
      - testo: "Mostrargli il polso"
        descrizione: "La riga chiara sul polso a Ghoran la sanno leggere tutti. Ragh la sa leggere meglio di tutti."
        quando: [origine.fuggiasco-di-ghoran >= 1]
        esito:
          titolo: La riga sul polso
          testo: |
            Ragh guarda la riga a lungo, e per guardarla si piega in avanti finché il fuoco gli illumina la
            benda. Poi batte le nocche due volte. Dice che sei scappat{o|a} dai recinti e sei tornat{o|a} da
            sol{o|a}, con il suo invito, e che per lui questo vale più di qualunque risposta. Ti lancia il
            filo di rame, quello che porta chi combatte per un clan, e Vesna te lo intreccia nei capelli con
            le dita lente.

            Il vecchio della Pece racconta di un osso di ferro nero sulle alture a sud, che fa cantare i
            coltelli, e quello del Guado di tre colpi che qualcuno batte a mezzanotte sotto il guado nord
            della palude.
          pe: { resilienza: 3 }
          almeno: { rep.ghoran: 2 }
          effetti: { fazione.ghoran: 1, monete: 30, oggetto.ghoran-filo-di-rame: 1, traccia.costola: 1, traccia.tamburi: 1, rep.ghoran: 0.5 }

  # ------------------------------------------------------------ 3 → 4 · un morto nel campo
  - id: ghoran-un-morto-nel-campo
    presso: ghoran
    immagine: ambientazione/arena-di-qir-azel
    titolo: Un morto nel campo
    sommario: "In una ripresa di notte un ragazzo della Pece è morto per un graffio."
    luogo: Ghoran, il campo dei gladiatori all'alba
    area: superficie-fratturata
    requisiti: [fazione.ghoran == 3]
    testo: |
      All'alba due clan si guardano dai lati opposti della sabbia. In mezzo, su una porta tolta dai cardini, è
      steso Jarko della Pece, un ragazzo di sedici anni con un graffio sull'avambraccio. Il graffio è lungo
      quanto un dito, e da lì sale verso il gomito un nero fitto che segue le vene sotto la pelle. Sopra la
      porta girano le mosche del campo, e nessuna si posa sul ragazzo. Ieri notte Jarko è uscito sulle sue
      gambe da una ripresa contro Tibbo, un comprato del Guado, e prima di mezzanotte era morto.

      Gedda della Pece è una donna grigia con le braccia piene di cicatrici. Mastica resina e dice che la lama
      di Tibbo era sporca e che la Pece chiede la Fossa. Ostrav del Guado si gira al dito l'anello di cera
      verde e risponde che la merce non si butta di sotto per un graffio.

      Ragh arriva dalla passerella, e i due clan smettono di parlare prima che arrivi alla sabbia. «Per un
      graffio la Fossa non si apre» dice. «E non resta chiusa solo perché lo dice il Guado. Serve un peso, uno
      senza clan che decida.» Batte due volte le nocche sulla porta, e il legno suona vuoto sotto il ragazzo.
      Poi guarda te. «Sei tu.»

      {origine fuggiasco-di-ghoran} Tibbo sta dietro Ostrav con la schiena curva, nella posa che avevi anche
      tu, e le sue dita parlano piano lungo la coscia.
    opzioni:
      - testo: "Guardare la ferita da vicino"
        descrizione: "Il nero che sale dal graffio ha una forma. Chi la sa leggere sa anche da dove viene."
        prova: { attributo: mentale, abilita: [medicina, natura], difficolta: Media }
        successo:
          titolo: Il fiele
          testo: |
            Ti chini sul ragazzo e annusi il taglio. Sotto l'odore del sangue ce n'è un altro, dolciastro come
            la frutta marcia, che hai sentito soltanto sulle rive della palude. Intorno al graffio la pelle è
            più fredda del resto del braccio. È fiele d'anguilla nera, e qualcuno l'ha spalmato sulla lama. Lo
            dici a Ragh a voce bassa. Lui annuisce e ti dice che sul margine della palude c'è un solo
            anguillaio che lo vende.
          pe: { medicina: 3 }
          effetti: { fazione.ghoran: 1, rep.ghoran: 0.5 }
        fallimento:
          titolo: Il nero
          testo: |
            Tocchi il taglio con le dita, e un poco del nero ti resta sui polpastrelli e brucia. Il bruciore
            resta anche dopo che li hai strofinati sulla sabbia, e i polpastrelli diventano bianchi e sordi.
            Gedda ti allontana dal ragazzo con una spinta. Più tardi Oska, guardandoti le dita, ti dice che è
            fiele d'anguilla nera e che sul margine della palude c'è un solo anguillaio che lo vende.
          effetti: { fazione.ghoran: 1, contaminazione: 0.5 }
      - testo: "Parlare con Tibbo"
        descrizione: "Il comprato del Guado non ha detto una parola. Forse nessuno gliel'ha chiesta nel modo giusto."
        prova: { attributo: sociale, abilita: empatia, difficolta: Media }
        successo:
          titolo: Le dita di Tibbo
          testo: |
            Ti metti davanti a Tibbo, abbastanza vicino perché Ostrav non senta, e gli chiedi chi gli ha dato
            la lama. Tibbo guarda Ostrav, poi le tue mani, e risponde con le dita contro la coscia. Fa i segni
            piccoli e veloci, con la mano chiusa a metà perché da dietro non si vedano. Gli hanno dato una
            bottiglia sul margine della palude, e gliel'ha data un uomo con la cera verde sulla spalla. Ragh
            ti dice che sul margine della palude c'è un solo anguillaio che vende cose da mettere sulle lame.
          pe: { empatia: 3 }
          effetti: { fazione.ghoran: 1, rep.ghoran: 0.5 }
        fallimento:
          titolo: Lo sguardo di Ostrav
          testo: |
            Ti avvicini a Tibbo, e Ostrav si mette in mezzo con un sorriso da mercante. Ti posa due dita
            leggere sul petto e ti tiene lontano senza spingere. Il comprato abbassa gli occhi e non li rialza
            più. Più tardi Vesna ti dice che la lama di Tibbo puzzava di palude, e che sul margine della
            palude c'è un solo anguillaio che vende veleni.
          effetti: { fazione.ghoran: 1, sospetto: 0.5 }
      - testo: "Chiedere di vedere la lama di Tibbo"
        descrizione: "Una lama da ripresa è smussata sul filo. Questa forse è stata preparata in un altro modo."
        prova: { attributo: fisico, abilita: armi-da-mischia, difficolta: Media }
        successo:
          titolo: La punta
          testo: |
            Ostrav te la porge di malavoglia. Il filo è smussato come vuole la regola. La punta invece è stata
            rifatta sottile con la pietra, e i segni della mola sono ancora chiari sul ferro scuro. Nel solco
            c'è una crosta nera che si sbriciola sotto l'unghia. Gedda la vede e sputa la resina sulla sabbia.
            Ragh prende la lama e te la rende, e ti dice che sul margine della palude c'è un solo anguillaio
            che vende quella crosta.
          pe: { armi-da-mischia: 3 }
          effetti: { fazione.ghoran: 1, rep.ghoran: 0.5 }
        fallimento:
          titolo: La lama pulita
          testo: |
            Ostrav ti porge la lama, e la lama è pulita e lucidata di fresco con l'olio fino all'elsa. Gedda
            ride male. Ragh però ti prende la lama di mano e la annusa a lungo vicino all'impugnatura, dove
            l'olio non è arrivato. Poi ti dice che sul margine della palude c'è un solo anguillaio che vende
            cose con quell'odore.
          effetti: { fazione.ghoran: 1, scandalo: 0.5 }
      - testo: "Vegliare il ragazzo con la Pece"
        descrizione: "La Pece veglia i suoi morti fino al tramonto. Chi veglia con loro sente quello che i clan si dicono a voce bassa."
        costo: 2
        esito:
          titolo: La veglia
          testo: |
            Ti siedi con la Pece intorno alla porta fino al tramonto, a masticare la resina che ti passa
            Gedda. La resina sa di fumo e ti incolla i denti, e dopo un'ora non senti più l'odore del ragazzo.
            A metà pomeriggio una ragazza racconta di aver visto un uomo del Guado tornare dalla palude due
            giorni fa, con una bottiglia. Ragh, quando glielo dici, ti dà il nome dell'anguillaio che vende
            fiele sul margine.
          effetti: { fazione.ghoran: 1, tormento: 0.5 }
      - testo: "Rispondere a Tibbo con le dita"
        descrizione: "La lingua dei recinti si parla con le mani, e tu non l'hai dimenticata."
        quando: [origine.fuggiasco-di-ghoran >= 1]
        esito:
          titolo: La lingua dei recinti
          testo: |
            Ti metti accanto a Tibbo con le mani lungo i fianchi, e le dita fanno le domande da sole. Tibbo
            risponde dopo un poco, e sui segni più lunghi le sue dita tremano. Gli hanno dato una bottiglia
            sul margine della palude, e gliel'ha data un uomo del Guado con la cera verde sulla spalla, a uno
            che non poteva dire di no. Ragh ti guarda le mani e non chiede che cosa vi siete detti. Ti dà il
            nome dell'anguillaio che vende fiele sul margine della palude.
          pe: { empatia: 3 }
          effetti: { fazione.ghoran: 1, rep.ghoran: 0.5 }

  # ------------------------------------------------------------ 4 → 5 · il fiele d'anguilla
  - id: ghoran-il-fiele-d-anguilla
    presso: ghoran
    immagine: ambientazione/palude-acquanera
    titolo: Il fiele d'anguilla
    sommario: "Sul margine della Palude Acquanera, a mezza giornata da Ghoran, un anguillaio vende fiele per le lame."
    luogo: Il margine della Palude Acquanera, la capanna dell'anguillaio
    area: superficie-fratturata
    requisiti: [fazione.ghoran == 4]
    testo: |
      La capanna dell'anguillaio sta a mezza giornata da Ghoran, su una lingua di fango asciutto fra i canneti
      al margine della Palude Acquanera. Le pareti sono fasci di canne legati stretti e impastati di fango, e
      al sole il fango si è crepato in scaglie larghe un palmo. Sul tetto di canne asciugano tante nasse che
      la capanna sembra coperta di gabbie.

      Malvo l'anguillaio è un uomo piccolo con le dita senza unghie e ti aspetta sulla porta con un bastone.
      Le punte delle dita sono lisce e rosa, e il bastone lo stringe con il palmo. Nel fango ci sono le
      impronte fresche di due cani e di un uomo con gli stivali chiodati. Le impronte dei cani arrivano
      all'orlo dei canneti e lì finiscono. Sull'orlo della lingua di fango le rane non cantano.

      «Stamattina è passato uno del Guado a dirmi che non vendo niente» dice Malvo, e stringe il bastone.
    opzioni:
      - testo: "Aspettare i cani del Guado e affrontarli"
        descrizione: "Nei canneti ci sono i cani da presa che il Guado usa per i fuggiaschi. Sono cani che aspettano un ordine senza abbaiare."
        combattimento: ghoran-i-cani-del-guado
        vittoria:
          titolo: I cani muti
          testo: |
            I cani escono dai canneti senza un verso e ti vengono addosso insieme. Sono bassi e larghi di
            petto, e mordono senza ringhiare. Quando l'ultimo resta nel fango l'uomo con gli stivali chiodati
            è già lontano, e ha perso una bottiglia vuota con il tappo di cera verde. Malvo la raccoglie e te
            la dà, e ti dice che gliel'ha comprata il cacciatore di Ostrav, la settimana scorsa, piena di
            fiele.
          effetti: { fazione.ghoran: 1, rep.ghoran: 0.5 }
        sconfitta:
          titolo: Il morso alla gamba
          testo: |
            Un cane ti prende alla gamba e non molla nemmeno quando lo colpisci sul muso, finché un fischio
            dai canneti lo richiama. Allora apre le mascelle tutto in una volta. Quando ti rialzi i cani se ne
            sono andati, e nel fango c'è una bottiglia vuota con il tappo di cera verde, persa nella fretta.
            Malvo ti fascia la gamba con una striscia di rete e ti dice di chi è.
          effetti: { fazione.ghoran: 1, tormento: 0.5 }
      - testo: "Far parlare Malvo"
        descrizione: "Ha più paura del Guado che di te. Bisogna fargli capire che il Guado stavolta perde."
        prova: { attributo: sociale, abilita: [persuasione, intimidire], difficolta: Media }
        successo:
          titolo: La bottiglia con la cera
          testo: |
            Gli dici che Ragh ti ha mandato a pesare questa storia, e che il filo di rame nei tuoi capelli
            vale più di due cani. Malvo guarda il filo a lungo, e intanto il bastone gli scende piano fino a
            toccare il fango. Poi entra nella capanna e torna con una bottiglia uguale a quella che ha
            venduto. Il cacciatore di Ostrav gliel'ha comprata la settimana scorsa, e l'ha chiusa con il suo
            tappo di cera verde.
          pe: { persuasione: 3 }
          effetti: { fazione.ghoran: 1, rep.ghoran: 0.5 }
        fallimento:
          titolo: Il bastone
          testo: |
            Alzi la voce, e Malvo alza il bastone. Ti allontani di tre passi, e lui si calma abbastanza da
            dirti soltanto un nome, il cacciatore di Ostrav, prima di chiudersi dentro. Dietro la porta di
            canne senti cadere il paletto. Il resto lo trovi da sol{o|a}, una bottiglia rotta con un pezzo di
            cera verde fra i canneti, nel fango dove finiscono le impronte dei cani.
          effetti: { fazione.ghoran: 1, scandalo: 0.5 }
      - testo: "Cercare le pozze calde delle anguille nere"
        descrizione: "Chi compra il fiele a volte se lo va a prendere da solo. Le pozze calde stanno vicino ai canneti."
        prova: { attributo: mentale, abilita: [natura, percezione], difficolta: Media }
        successo:
          titolo: Le pozze calde
          testo: |
            Trovi le pozze calde dietro i canneti. L'acqua è torbida e fuma appena, e sul fondo si muove
            qualcosa di lungo che non sale mai fino al pelo. Accanto alla pozza più grande ci sono i resti di
            tre anguille nere aperte con il coltello lungo il ventre e svuotate del fiele, e una bottiglia
            dimenticata con il tappo di cera verde. Quando la porti a Malvo lui annuisce e ti dice il nome che
            ti serve, quello del cacciatore di Ostrav.
          pe: { natura: 3 }
          effetti: { fazione.ghoran: 1, rep.ghoran: 0.5 }
        fallimento:
          titolo: L'acqua calda
          testo: |
            Metti un piede nella pozza sbagliata, e l'acqua calda ti sale fino al ginocchio insieme a qualcosa
            che morde. Ne esci con un taglio sul polpaccio e una bottiglia con il tappo di cera verde che ti
            era rimasta sotto la scarpa. Il taglio è una mezzaluna di forellini fitti, e l'acqua della pozza
            ci brucia dentro. Malvo ti dice di chi è.
          effetti: { fazione.ghoran: 1, contaminazione: 0.5 }
      - testo: "Comprare tutto quello che Malvo ha pescato oggi"
        descrizione: "Un anguillaio che non vende niente ha comunque una giornata da pagare. Si compra la giornata, e il resto viene da sé."
        requisiti: [monete >= 10]
        esito:
          titolo: Una giornata di anguille
          testo: |
            Compri le anguille di oggi, e anche quelle di domani. Sono lunghe quanto un braccio e ancora vive
            nella cesta, e quando la sollevi si annodano fra loro. Malvo conta le monete due volte e alla
            seconda decide che il Guado è lontano. Ti dà una bottiglia uguale a quella che ha venduto al
            cacciatore di Ostrav, con lo stesso tappo di cera verde.
          effetti: { fazione.ghoran: 1, monete: -10 }
      - testo: "Riconoscere il fiele dalle canne tagliate"
        descrizione: "Al Circolo si impara che una pianta tagliata male racconta chi l'ha tagliata. Le canne intorno alle pozze sono state tagliate di fresco."
        quando: [origine.figlio-del-circolo >= 1]
        esito:
          titolo: Le canne tagliate
          testo: |
            Le canne intorno alle pozze calde sono state tagliate di traverso, con una lama larga, da uno che
            aveva fretta e la mano destra forte. Le fibre sono nette dove la lama è entrata e strappate dove è
            uscita. Segui il taglio fino a una bottiglia nascosta fra le radici del salice, con il tappo di
            cera verde. Malvo la guarda e ti dice di chi è, perché quel tappo l'ha visto la settimana scorsa.
          pe: { natura: 3 }
          effetti: { fazione.ghoran: 1, rep.ghoran: 0.5 }

  # ------------------------------------------------------------ 5 → 6 · sul piatto (grado 2)
  - id: ghoran-sul-piatto
    presso: ghoran
    immagine: ambientazione/ghoran
    titolo: Sul piatto
    sommario: "Su un piatto c'è la bottiglia con la cera verde, sull'altro c'è quello che dirai."
    luogo: Ghoran, la bilancia del mercato dei recinti
    area: superficie-fratturata
    requisiti: [fazione.ghoran == 5]
    testo: |
      Al mercato dei recinti la bilancia grande pende da una trave annerita, e intorno non c'è merce. I piatti
      sono due dischi di ferro appesi a tre catene ciascuno, e il ferro è lucido al centro dove si posano i
      piedi. Sulle passerelle ci sono i clan, la Pece con le torce e il Guado con i sigilli di cera verde
      cuciti sulle spalle. Sul piatto di sinistra hai posato la bottiglia di Malvo, ed è così leggera che il
      piatto si è abbassato appena.

      Ostrav fa girare l'anello fra le dita, con Tibbo alle spalle. Ragh siede sotto la trave su uno sgabello
      troppo piccolo, con le ginocchia che gli arrivano quasi al petto.

      «Il peso parla» dice Ragh, e ti indica con il mento.

      {politica-ed-economia Media} Ostrav ha comprato il fiele per far vincere il suo comprato e alzarne il
      prezzo. Il morto della Pece non era nel conto, e adesso pesa più di tutto il resto.

      {empatia Facile} Gedda vuole la Fossa perché è l'unica cosa che le sembra grande quanto il ragazzo. Se
      le dai qualcosa di altrettanto grande, la Fossa le serve meno.
    opzioni:
      - testo: "Chiedere che Ostrav paghi a peso d'argento e che Tibbo sia libero"
        descrizione: "Il colpevole è chi ha comprato il fiele."
        prova: { attributo: sociale, abilita: persuasione, difficolta: Difficile }
        successo:
          titolo: A peso d'argento
          testo: |
            Chiedi che Ostrav metta sul piatto tanto argento quanto pesava Jarko, e che Tibbo esca dal mercato
            senza corda. Ragh batte le nocche due volte, e Ostrav paga davanti a tutti, moneta per moneta,
            finché il piatto non si alza. Le monete battono sul ferro con un suono secco, e dalle passerelle
            la gente le conta a mezza voce.

            Tibbo resta fermo dove sta, perché non sa dove andare. Vesna gli mette una mano sulla spalla e se
            lo porta alla Pece. A te dice che da stasera il campo dei tamburi ti è aperto quando vuoi.
          pe: { persuasione: 5 }
          almeno: { rep.ghoran: 4 }
          imposta: { ghoran.verdetto: 1 }
          effetti: { fazione.ghoran: 1, monete: 40 }
        fallimento:
          titolo: Il prezzo di Tibbo
          testo: |
            Chiedi l'argento e la libertà di Tibbo. Ostrav ride, e dalle passerelle con lui ride mezzo Guado.
            Dice che un comprato costa, e che se il peso lo vuole libero se lo paghi di tasca sua. Ragh allora
            batte le nocche e decide lui. Ostrav paga l'argento senza più ridere, e Tibbo esce senza corda lo
            stesso, perché Ragh ha detto così.

            Vesna si porta Tibbo alla Pece, e a te dice che il campo dei tamburi ti è aperto quando vuoi,
            anche se stasera hai parlato male.
          almeno: { rep.ghoran: 4 }
          imposta: { ghoran.verdetto: 1 }
          effetti: { fazione.ghoran: 1, monete: 40, scandalo: 1 }
      - testo: "Dare Tibbo alla Pece in cambio del morto"
        descrizione: "È la legge vecchia di Ghoran. Il clan che toglie un uomo ne rende uno, e il Guado perde la merce che voleva vendere."
        prova: { attributo: sociale, abilita: [conoscenze-della-strada, galateo], difficolta: Media }
        successo:
          titolo: Un uomo per un uomo
          testo: |
            Tibbo passa dal Guado alla Pece, e Ostrav perde il comprato che aveva pagato più caro di tutti.
            Gedda guarda a lungo il ragazzo che le danno al posto del suo, e intanto mastica la resina sempre
            più piano. Alla fine annuisce. Ragh batte le nocche, e i clan tornano alle palafitte senza parlare
            di Fossa.

            Vesna ti dice che da stasera il campo dei tamburi ti è aperto quando vuoi, e non ti guarda mentre
            lo dice.
          pe: { conoscenze-della-strada: 5 }
          almeno: { rep.ghoran: 4 }
          imposta: { ghoran.verdetto: 2 }
          effetti: { fazione.ghoran: 1, monete: 40 }
        fallimento:
          titolo: Le parole dei vecchi
          testo: |
            Dici la legge vecchia, ma la dici con le parole sbagliate, e un vecchio del Guado ti corregge
            davanti a tutti. Lo fa una parola alla volta e aspetta che tu la ripeta. Ragh batte le nocche e la
            dice lui, giusta. Tibbo passa alla Pece, Ostrav perde il suo comprato, e i clan tornano alle
            palafitte senza parlare di Fossa.

            Vesna ti dice che il campo dei tamburi ti è aperto quando vuoi, e di imparare le parole prima
            della prossima volta.
          almeno: { rep.ghoran: 4 }
          imposta: { ghoran.verdetto: 2 }
          effetti: { fazione.ghoran: 1, monete: 40, scandalo: 0.5 }
      - testo: "Lasciare la bottiglia sul piatto e tacere"
        descrizione: "La bottiglia parla da sola. Il resto lo decide Ragh, che lo decide da diciannove anni."
        esito:
          titolo: Ragh decide
          testo: |
            Resti zitt{o|a}, e il mercato aspetta con te. Si sentono soltanto le torce della Pece che
            sfrigolano e le catene della bilancia che cigolano quando passa il vento. Alla fine Ragh si alza
            dallo sgabello, prende la bottiglia dal piatto e la spacca sulla trave. Ostrav paga l'argento, e
            Tibbo passa alla Pece al posto di Jarko. I clan tornano alle palafitte senza parlare di Fossa.

            Vesna ti dice che il campo dei tamburi ti è aperto quando vuoi. Ragh, passando, ti dice che ti ha
            nominato peso per sentirti parlare.
          almeno: { rep.ghoran: 4 }
          imposta: { ghoran.verdetto: 2 }
          effetti: { fazione.ghoran: 1, monete: 40 }
      - testo: "Mettere la tua parola sul piatto accanto a Tibbo"
        descrizione: "Sei salit{o|a} su quel piatto da comprat{o|a}. Adesso ci sali per un altro, e i clan lo sanno."
        quando: [origine.fuggiasco-di-ghoran >= 1]
        esito:
          titolo: Sul piatto per un altro
          testo: |
            Sali sul piatto di destra accanto alla bottiglia e dici che garantisci tu per Tibbo, con il tuo
            peso. Il piatto scende sotto di te, e le catene cigolano fino in cima alla trave. Ostrav guarda
            Ragh, e Ragh batte le nocche due volte. L'argento lo paga il Guado, e Tibbo esce dal mercato senza
            corda, dietro di te.

            Vesna se lo porta alla Pece. A te dice che il campo dei tamburi ti è aperto quando vuoi, e ti
            stringe il braccio sopra il polso.
          pe: { persuasione: 5 }
          almeno: { rep.ghoran: 4 }
          imposta: { ghoran.verdetto: 1 }
          effetti: { fazione.ghoran: 1, monete: 40 }
