# Ghoran come luogo della Superficie Fratturata (presso: ghoran), aperto dopo l'Arena (pista.arena >= 5).
# - `ghoran-le-passerelle`: l'attività ripetibile, a fasce di rep.ghoran (< 2, 2-4, 4-6, >= 6). Le opzioni delle
#   prime tre fasce alzano la reputazione di mezzo punto fino a 6; oltre la porta la quest (almeno 8 e 10).
# - `ghoran-la-cerusica-del-campo`: il servizio, Oska che ricuce i gladiatori; a metà prezzo per chi è parente di
#   clan (ghoran.parente, grado 4).
# - `ghoran-il-campo-dei-tamburi`: la ricompensa del grado 2, una ripresa nel campo per una borsa, le scommesse e
#   l'allenamento con Vesna.
# Nomi nuovi: Oska (la cerusica del campo), il clan della Pece (torce e gladiatori, quello di Vesna) accanto ai clan
# che il gioco conosce già (il Guado, la mano aperta con tre dita).
luoghi:
  - id: ghoran
    area: superficie-fratturata
    nome: Ghoran
    immagine: ambientazione/ghoran
    requisiti: [pista.arena >= 5]
    sommario: "Palafitte sul fango oltre il Gradone Rosso, dove i clan riconoscono Ragh Kor'Nul."
    testo: |
      A sud del Gradone Rosso, dove la terra cede verso la palude, Ghoran è
      un intrico di palafitte piantate nel fango e unite da passerelle di
      assi. Al mercato dei recinti una bilancia da grano pesa la merce, che
      qui cammina. Oltre l'ultima pozza il campo dei gladiatori suona i
      tamburi ogni notte, e i clan che comandano riconoscono Ragh Kor'Nul,
      che ha un occhio solo e una memoria che non perdona.

storylet:
  # ------------------------------------------------------------ l'attività ripetibile
  - id: ghoran-le-passerelle
    presso: ghoran
    immagine: ambientazione/ghoran
    titolo: Le passerelle
    sommario: "Sulle passerelle di Ghoran si trova lavoro, pagato a occhio da chi ti guarda."
    luogo: Ghoran, le passerelle fra le palafitte
    area: superficie-fratturata
    ripetibile: true
    testo: |
      Sulle passerelle il lavoro non si chiede, si aspetta all'incrocio
      davanti al cambiavalute con le mani in vista, finché qualcuno ti misura
      da capo a piedi e ti dice che cosa serve e quanto paga.

      {origine fuggiasco-di-ghoran} Su queste assi sei già passato con una
      corda ai polsi, e la schiena se ne ricorda.
    opzioni:
      # ------------------------------------------------ rep < 2
      - testo: "Rifare un tratto di passerella"
        descrizione: "Un'asse marcia sopra il fango profondo davanti ai recinti, pagata da chi ci passa con la merce."
        requisiti: [rep.ghoran < 2]
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Facile }
        successo:
          titolo: L'asse nuova
          testo: |
            Cambi l'asse marcia con il fango fino ai polpacci, e il padrone ci
            salta sopra per provarla prima di pagarti.
          effetti: { monete: 2, rep.ghoran: 0.5 }
        fallimento:
          titolo: La pozza
          testo: |
            Il palo cede e finisci nella pozza fino alla cintura, e il lavoro lo
            finisce un altro.
      - testo: "Portare l'acqua ai recinti delle bestie"
        descrizione: "I cani da combattimento bevono molto e mordono chi porta il secchio piano."
        requisiti: [rep.ghoran < 2]
        prova: { attributo: fisico, abilita: [resistenza, addestrare-animali], difficolta: Facile }
        successo:
          titolo: I secchi
          testo: |
            Venti viaggi dal pozzo ai recinti, e il custode ti paga e ti regala
            una scheggia di metallo trovata nel fango.
          effetti: { monete: 1, reliquie.scheggia: 1, rep.ghoran: 0.5 }
        fallimento:
          titolo: Il morso
          testo: |
            Al decimo viaggio un cane ti strappa il secchio con i denti, e il
            custode ti saluta con un insulto in dialetto.
      # ------------------------------------------------ rep 2-4
      - testo: "Tenere i cani della Pece prima della ripresa"
        descrizione: "Prima di una ripresa i cani vanno calmati, o entrano nel campo già stanchi di ringhiare."
        requisiti: [rep.ghoran >= 2, rep.ghoran < 4]
        prova: { attributo: sociale, abilita: addestrare-animali, difficolta: Media }
        successo:
          titolo: I cani calmi
          testo: |
            Lasci che i cani ti annusino uno alla volta, e quando li portano al
            campo quello grosso ti lecca il polso.
          effetti: { monete: 3, rep.ghoran: 0.5 }
        fallimento:
          titolo: Il ringhio
          testo: |
            I cani sentono la tua fretta e ringhiano tutta la mattina, finché il
            ragazzo della Pece ti manda a imparare a sederti.
      - testo: "Fare il conto delle scommesse al campo dei tamburi"
        descrizione: "Al banco delle scommesse si scrive con l'inchiostro marrone, e chi sbaglia paga di tasca sua."
        requisiti: [rep.ghoran >= 2, rep.ghoran < 4]
        prova: { attributo: mentale, abilita: politica-ed-economia, difficolta: Media }
        successo:
          titolo: Il banco delle scommesse
          testo: |
            I conti delle poste tornano, e il banchiere ti paga con quello che
            resta e con un nome che è meglio sapere.
          effetti: { monete: 4, informazioni.voce: 1, rep.ghoran: 0.5 }
        fallimento:
          titolo: La posta sbagliata
          testo: |
            Scrivi una posta sulla riga sbagliata, e all'alba il banchiere paga a
            un mercenario del Guado una vincita mai fatta, e a te niente.
      # ------------------------------------------------ rep 4-6
      - testo: "Fare da peso in una lite di mercato"
        descrizione: "Due mercanti litigano su una partita di pelli, e chi non ha un clan può fare da giudice."
        requisiti: [rep.ghoran >= 4, rep.ghoran < 6]
        prova: { attributo: sociale, abilita: [persuasione, empatia], difficolta: Media }
        successo:
          titolo: Le pelli
          testo: |
            Conti le pelli e trovi le tre bucate che nessuno voleva contare, e
            dividi la differenza a metà. I mercanti ti pagano brontolando nello
            stesso modo.
          effetti: { monete: 4, informazioni.pettegolezzo: 1, rep.ghoran: 0.5 }
        fallimento:
          titolo: Due scontenti
          testo: |
            Dai ragione al primo, e il secondo ricorda a tutto il mercato che non
            hai un clan.
      - testo: "Scortare una carovana fino al Gradone"
        descrizione: "Una carovana di pelli parte per Qir-Azel, e al Gradone i predoni aspettano chi va piano."
        requisiti: [rep.ghoran >= 4, rep.ghoran < 6]
        prova: { attributo: fisico, abilita: [armi-da-mischia, resistenza], difficolta: Difficile }
        successo:
          titolo: La strada del Gradone
          testo: |
            Al passo del Gradone tre predoni ti vedono in testa alla carovana e
            aspettano la prossima, e il carovaniere ti paga e ti regala un guscio
            di metallo trovato sul ciglio.
          effetti: { monete: 8, reperto.sigillato: 1, rep.ghoran: 0.5 }
        fallimento:
          titolo: Il carro rovesciato
          testo: |
            Mentre rimettete in piedi un carro rovesciato al Gradone un predone si
            porta via due balle di pelli, e il carovaniere ti paga metà.
          effetti: { monete: 3 }
      # ------------------------------------------------ rep >= 6
      - testo: "Andare con i cacciatori di bestie oltre le pozze"
        descrizione: "I cacciatori del Guado escono a prendere bestie per il campo, e nelle tane c'è anche altro."
        requisiti: [rep.ghoran >= 6]
        prova: { attributo: mentale, abilita: [natura, percezione], difficolta: Media }
        successo:
          titolo: La tana vuota
          testo: |
            Trovi prima dei cacciatori la tana fra le radici di un salice morto. È
            vuota, e fra le ossa sul fondo c'è un guscio di metallo con un
            cristallo opaco.
          effetti: { reperto.sigillato: 1, cristalli.cristallo-sterile: 1, monete: 5 }
        fallimento:
          titolo: Le tracce vecchie
          testo: |
            Segui per tutto il giorno tracce che hanno almeno una settimana. I
            cacciatori tornano con una bestia legata, e tu con le scarpe piene.
      - testo: "Sedere alla bilancia con i vecchi dei clan"
        descrizione: "La sera i vecchi dei clan parlano di prezzi intorno alla bilancia, e ci si siede su invito."
        requisiti: [rep.ghoran >= 6]
        prova: { attributo: sociale, abilita: [galateo, conoscenze-della-strada], difficolta: Media }
        successo:
          titolo: I prezzi della sera
          testo: |
            Parli sempre dopo il più vecchio, e a fine sera sai quanto costerà la
            carne in città fra un mese. Un vecchio ti allunga una moneta perché
            hai saputo stare zitto.
          effetti: { informazioni.pettegolezzo: 1, monete: 6 }
        fallimento:
          titolo: Il posto sbagliato
          testo: |
            Ti siedi sulla panca del clan del Guado senza saperlo, e per tutta
            la sera nessuno ti rivolge la parola.
      # ------------------------------------------------ sempre
      - testo: "Ascoltare i tamburi dalla passerella"
        descrizione: "Di notte dal campo suonano i tamburi, e chi li capisce sa chi combatte e chi perde."
        esito:
          titolo: I tamburi
          testo: |
            Dalla passerella ascolti i tamburi. Uno batte per chi entra nel campo
            e due per chi ne esce in piedi, e quando ne batte uno solo, lungo, le
            torce sulle gradinate si abbassano tutte insieme.
          pe: { espressivita: 2 }

  # ------------------------------------------------------------ il servizio · la cerusica del campo
  - id: ghoran-la-cerusica-del-campo
    presso: ghoran
    immagine: ambientazione/ghoran
    titolo: La cerusica del campo
    sommario: "Sotto le gradinate del campo Oska ricuce i gladiatori, e a pagamento anche te."
    luogo: Ghoran, sotto le gradinate del campo dei tamburi
    area: superficie-fratturata
    ripetibile: true
    testo: |
      Sotto le gradinate del campo Oska ha un tavolo lungo quanto un uomo e un
      braciere per gli aghi. Ricuce i gladiatori da quando Ragh aveva tutti e
      due gli occhi, e ti guarda le ferite da lontano senza chiederti come te
      le sei fatte.

      {medicina Media} Aghi d'osso e budello di capra, eppure le sue cuciture
      tengono meglio di tante della Cattedrale.
    opzioni:
      - testo: "Farti ricucire una ferita"
        descrizione: "Oska cuce in fretta e senza parlare, e fa male quanto la ferita ma dura meno."
        quando: [ghoran.parente == 0]
        requisiti: [ferite >= 1, monete >= 15]
        costo: 0
        esito:
          titolo: Il budello di capra
          testo: |
            Oska cuce senza avvisarti, poi ti dà un colpetto sulla spalla e tende
            la mano per le monete.
          effetti: { ferite: -1, monete: -15 }
      - testo: "Farti ricucire una ferita da parente"
        descrizione: "Chi è risalito dalla Fossa paga metà, e Oska lo dice di malavoglia."
        quando: [ghoran.parente >= 1]
        requisiti: [ferite >= 1, monete >= 8]
        costo: 0
        esito:
          titolo: Da parente
          testo: |
            Oska cuce con più calma e ti chiede della Fossa, poi se ne pente e
            accelera. Ti prende metà delle monete.
          effetti: { ferite: -1, monete: -8 }
      - testo: "Farti rimettere in piedi"
        descrizione: "Per due ferite e più ci vuole un pomeriggio sul tavolo, pagato in anticipo."
        quando: [ghoran.parente == 0]
        requisiti: [ferite >= 2, monete >= 28]
        costo: 0
        esito:
          titolo: Il pomeriggio sul tavolo
          testo: |
            Passi il pomeriggio sul tavolo, con Oska che cuce e beve dalla stessa
            tazza, e quando ti alzi le gambe ti reggono.
          effetti: { ferite: -2, monete: -28 }
      - testo: "Farti rimettere in piedi da parente"
        descrizione: "Un pomeriggio sul tavolo a metà prezzo, e una tazza della sua acquavite."
        quando: [ghoran.parente >= 1]
        requisiti: [ferite >= 2, monete >= 14]
        costo: 0
        esito:
          titolo: La tazza di Oska
          testo: |
            A metà lavoro Oska ti passa la tazza, e l'acquavite brucia più delle
            cuciture. Lei ride, per la prima volta da quando la conosci.
          effetti: { ferite: -2, monete: -14 }
      - testo: "Comprare un vasetto del suo grasso"
        descrizione: "Grasso di capra e resina chiuso con la pece, che i gladiatori si spalmano prima della ripresa."
        requisiti: [monete >= 18]
        costo: 0
        esito:
          titolo: Il vasetto
          testo: |
            Oska ti dà il vasetto più piccolo, e lo cambia con uno più grande
            quando vede che non protesti.
          effetti: { unguento: 1, monete: -18 }
      - testo: "Comprare un rotolo di bende di vela"
        descrizione: "Strisce di vela bollita che tengono bene."
        requisiti: [monete >= 6]
        costo: 0
        esito:
          titolo: Tela di vela
          testo: |
            Oska strappa un rotolo dalla vela con i denti e te lo lancia, e
            le monete le prende al volo.
          effetti: { bende: 1, monete: -6 }

  # ------------------------------------------------------------ grado 2 · il campo dei tamburi
  - id: ghoran-il-campo-dei-tamburi
    presso: ghoran
    immagine: ambientazione/arena-di-qir-azel
    titolo: Il campo dei tamburi
    sommario: "Da quando fai da peso ai clan puoi combattere per una borsa nel campo dei gladiatori."
    luogo: Ghoran, il campo dei gladiatori
    area: superficie-fratturata
    ripetibile: true
    requisiti: [fazione.ghoran >= 6]
    testo: |
      Il campo è una conca di terra battuta fra gradinate di legno,
      illuminata da un cerchio di torce di pece. Su una pedana tre ragazzi
      della Pece battono i tamburi, uno per chi entra e due per chi esce in
      piedi, e Vesna, appoggiata alla sbarra d'ingresso, ti fa posto.

      {armi-da-mischia Media} Le lame sono smussate sul filo e affilate in
      punta, e il pubblico paga per la minaccia.
    opzioni:
      - testo: "Entrare nel campo per una ripresa"
        descrizione: "Una ripresa contro un gladiatore di clan con la lama smussata, e la borsa a chi resta in piedi."
        combattimento: ghoran-una-ripresa
        vittoria:
          titolo: Due colpi di tamburo
          testo: |
            L'avversario resta a terra con la mano alzata, e dalla pedana arrivano
            i due colpi di tamburo. Vesna ti porta la borsa.
          effetti: { monete: 12, rep.ghoran: 0.5 }
        sconfitta:
          titolo: Un colpo solo
          testo: |
            Ti rialzi con la sabbia in bocca al singolo colpo di tamburo, e da
            sotto le gradinate Oska ti fa segno di andare da lei.
      - testo: "Scommettere su chi resta in piedi"
        descrizione: "Al banco si scommette con l'inchiostro marrone, guardando bene i gladiatori prima che entrino."
        requisiti: [monete >= 5]
        prova: { attributo: mentale, abilita: [percezione, armi-da-mischia], difficolta: Media }
        successo:
          titolo: La caviglia
          testo: |
            Il favorito appoggia la destra con troppa cura, e il banchiere ti paga
            storcendo la bocca.
          effetti: { monete: 8 }
        fallimento:
          titolo: La posta persa
          testo: |
            Il tuo uomo cade alla prima ripresa, su una caviglia che non
            avevi visto. Il banchiere ti ringrazia.
          effetti: { monete: -5 }
      - testo: "Allenarti con Vesna fino all'alba"
        descrizione: "Vesna si allena nel campo vuoto dopo l'ultima ripresa e spiega poco."
        costo: 2
        esito:
          titolo: Fino all'alba
          testo: |
            Vesna ti fa ripetere lo stesso colpo cento volte, finché i tamburi
            tacciono, e alla fine ti dice che il centesimo era buono.
          pe: { armi-da-mischia: 6, resistenza: 2 }

colonna:
  - { contesto: luogo, id: ghoran, musica: goblin-ritual, ambiente: campfire }
