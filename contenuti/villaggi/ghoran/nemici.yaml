# I nemici e gli scontri della quest di Ghoran. Tutta la quest viene dopo l'Arena, quindi i nemici stanno al livello
# delle quest di fazione (combattente di fine capitolo, scripts/simula-fine.ts ghoran-): gregari sopra l'80%, i due
# boss fra il 40 e il 60%, e il boss finale sopra l'80% anche per il combattente di fine contenuti.
# - Atto I e II: il gladiatore della ripresa (anche nel campo dei tamburi), i cani da presa del Guado.
# - Atto III: le guardie del recinto di Tasha e i due sicari della Gilda.
# - Atto IV (la Fossa del Seme): i cani rimasti di sotto, le radici che cercano, e il cuore, il verro radicato che
#   Ragh lasciò davanti alla porta l'inverno delle tre Fosse (boss).
# - Atto V: gli uomini di Ostrav che vogliono tagliare le corde, e oltre la porta dell'ascia il custode del Seme
#   (boss finale).
nemici:
  - id: ghoran-gladiatore
    immagine: ambientazione/arena-di-qir-azel
    nome: Gladiatore di clan
    descrizione: "Un combattente del campo dei tamburi, con la treccia legata nel rame e una lama smussata sul filo. Colpisce di piatto per far male e di punta per far paura."
    attacco: 4
    difesa: 3
    difesaMentale: 3
    pf: 10
    danno: 3
    riduzione: 2
    iniziativa: 2

  - id: ghoran-cane-da-presa
    immagine: icone/wolf-head
    nome: Cane da presa del Guado
    descrizione: "Un cane dalle orecchie tagliate che non abbaia mai. I cacciatori del Guado lo usano per riprendere chi scappa dai recinti, e lo nutrono poco apposta."
    attacco: 4
    difesa: 3
    difesaMentale: 2
    pf: 7
    danno: 2
    riduzione: 1
    iniziativa: 3
    tratti: [animale]

  - id: ghoran-guardia-del-recinto
    immagine: ambientazione/ghoran
    nome: Guardia del recinto
    descrizione: "Un mercenario di Tasha la Bianca, con le braccia segnate e un'ascia corta alla cintura. È pagato per stare fermo finché qualcuno non tocca la porta."
    attacco: 4
    difesa: 3
    difesaMentale: 3
    pf: 8
    danno: 2
    riduzione: 1
    iniziativa: 2

  - id: ghoran-sicario
    immagine: ambientazione/ghoran
    nome: Sicario della Gilda
    descrizione: "Un uomo venuto da Qir-Azel con la giubba di un carovaniere e due coltelli lunghi nelle maniche. È pagato per un incidente, e gli incidenti si fanno in fretta."
    attacco: 4
    difesa: 3
    difesaMentale: 3
    pf: 7
    danno: 2
    riduzione: 1
    iniziativa: 3

  - id: ghoran-cane-della-fossa
    immagine: icone/wolf-head
    nome: Cane rimasto di sotto
    descrizione: "I cani buttati nella Fossa con i perdenti delle dispute si sono fatti una muta là sotto. Sono grigi, senza pelo sul dorso, e vedono al buio meglio di te."
    attacco: 4
    difesa: 3
    difesaMentale: 2
    pf: 7
    danno: 3
    riduzione: 1
    iniziativa: 3
    tratti: [animale]

  - id: ghoran-radice-che-cerca
    immagine: icone/root-tip
    nome: Radice che cerca
    descrizione: "Una radice nera spessa quanto un braccio che si stacca dalla parete quando sente il caldo di un corpo. Si avvolge intorno a quello che trova e lo stringe finché la pelle si apre."
    attacco: 4
    difesa: 2
    difesaMentale: 5
    pf: 9
    danno: 2
    riduzione: 3
    iniziativa: 1

  - id: ghoran-verro-radicato
    immagine: bestiario/cinghiale-mutato-gigante
    nome: Il verro radicato
    descrizione: "Un verro da combattimento grande come un carro, sceso nella Fossa diciannove anni fa e mai risalito. Le radici gli escono dalla schiena come setole, e lo tengono vivo."
    attacco: 5
    difesa: 4
    difesaMentale: 4
    pf: 15
    danno: 4
    riduzione: 3
    iniziativa: 2
    tratti: [animale]

  - id: ghoran-uomo-di-ostrav
    immagine: ambientazione/ghoran
    nome: Uomo del Guado
    descrizione: "Un mercenario del clan del Guado con il sigillo di cera verde cucito sulla spalla. Stanotte ha un coltello per le corde e uno per chi le tiene."
    attacco: 4
    difesa: 3
    difesaMentale: 3
    pf: 8
    danno: 2
    riduzione: 1
    iniziativa: 2

  - id: ghoran-custode-del-seme
    immagine: bestiario/salvaguardia-precursori
    nome: Il custode del Seme
    descrizione: "Un corpo di metallo nero cresciuto dentro le radici, o le radici cresciute dentro di lui. Ha una faccia liscia con un occhio solo, ed è un occhio d'uomo."
    attacco: 5
    difesa: 4
    difesaMentale: 5
    pf: 15
    danno: 4
    riduzione: 3
    iniziativa: 2

scontri:
  - { id: ghoran-una-ripresa, nome: "Una ripresa nel campo dei tamburi", nemici: [ghoran-gladiatore], feriteSconfitta: 2 }
  - { id: ghoran-i-cani-del-guado, nome: "I cani da presa del Guado", nemici: [ghoran-cane-da-presa, ghoran-cane-da-presa], feriteSconfitta: 2 }
  - { id: ghoran-le-guardie-del-recinto, nome: "Le guardie del recinto", nemici: [ghoran-guardia-del-recinto, ghoran-guardia-del-recinto], feriteSconfitta: 2 }
  - { id: ghoran-i-sicari, nome: "I sicari della Gilda", nemici: [ghoran-sicario, ghoran-sicario], feriteSconfitta: 2 }
  - { id: ghoran-la-muta, nome: "La muta della Fossa", nemici: [ghoran-cane-della-fossa, ghoran-cane-della-fossa], feriteSconfitta: 2 }
  - { id: ghoran-le-radici, nome: "Le radici che cercano", nemici: [ghoran-radice-che-cerca], feriteSconfitta: 2 }
  - { id: ghoran-il-verro, nome: "Il verro radicato", nemici: [ghoran-verro-radicato], feriteSconfitta: 3 }
  - { id: ghoran-gli-uomini-del-guado, nome: "Gli uomini del Guado", nemici: [ghoran-uomo-di-ostrav, ghoran-uomo-di-ostrav], feriteSconfitta: 2 }
  - { id: ghoran-il-custode, nome: "Il custode del Seme", nemici: [ghoran-custode-del-seme], feriteSconfitta: 4 }
