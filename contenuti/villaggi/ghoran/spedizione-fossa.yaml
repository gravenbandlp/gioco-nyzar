# La quest di Ghoran, passo 11 (fazione.ghoran 10 → 11): la spedizione nella Fossa del Seme, l'arena sotto il campo
# dei gladiatori, più antica del villaggio (codex sf-fossa-del-seme e mn-ghoran). Si scende dalla grata del campo
# (`ghoran-la-grata-della-fossa`, presso Ghoran): a cavallo per la rampa delle bestie non costa rintocchi.
# Le stanze vanno in fasce di profondità (una stanza superata non ricompare nella stessa visita):
# 0 l'arena di sotto o le gradinate di pietra, 1 le radici che cercano o i nomi sul muro, 2 la pozza nera o il muro
# liscio, 3 le ossa dell'inverno o la strettoia; la muta dei cani rimasti di sotto vale da 1 a 3.
# Il cuore a 4 è la porta dell'ascia: la bipenne di Ragh piantata in una radice davanti a una porta di pietra, e il
# verro radicato che la guarda (boss). Le vie sono Difficili; chi fallisce o perde torna in superficie senza passo.
aree:
  - id: ghoran-fossa-del-seme
    immagine: ambientazione/regno-profondo
    nome: La Fossa del Seme
    sommario: "Sotto il campo dei gladiatori di Ghoran c'è un'arena più vecchia del villaggio, con radici nere che battono."
    spedizione: { ritorno: superficie-fratturata, soglia: 4, stanze: 3 }
    testo: |
      Sotto la grata del campo la Fossa del Seme si apre in una conca di pietra
      grigia liscia come l'interno di una conchiglia. Dal pavimento escono radici
      nere spesse quanto un braccio che battono tutte insieme, e il colpo lo
      senti nei piedi prima che nelle orecchie.

colonna:
  - { contesto: area, id: ghoran-fossa-del-seme, musica: our-wounds-our-crown, ambiente: hellish-dungeon }

storylet:
  # ------------------------------------------------------------ l'ingresso, dal campo dei gladiatori
  - id: ghoran-la-grata-della-fossa
    presso: ghoran
    immagine: ambientazione/regno-profondo
    titolo: La grata della Fossa
    sommario: "La grata della Fossa è aperta per la prima volta in tre anni, e i clan guardano chi scende."
    luogo: Ghoran, la grata sotto il campo dei gladiatori
    area: superficie-fratturata
    requisiti: [fazione.ghoran == 10]
    testo: |
      Stanotte la grata della Fossa è rovesciata sulla sabbia, fra i capi
      dei clan con le torce e mezzo villaggio che guarda in silenzio dalle
      gradinate. Dal buio sale un'aria tiepida che sa di terra smossa,
      insieme al colpo lento delle radici.

      Ragh ti aspetta sul bordo con la catena della lanterna avvolta al
      braccio. Più in là c'è la rampa dei verri delle dispute, chiusa da
      tavole.

      {intimidire Facile} Ostrav ti guarda dal bordo e aspetta che tu esiti,
      per poterlo raccontare.

      «Chi scende si conta da solo» dice Ragh, e ti porge la catena.
    opzioni:
      - testo: "Calarti con la catena della lanterna"
        descrizione: "Quaranta braccia di catena, con i piedi contro la parete liscia."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Media }
        successo:
          titolo: Quaranta braccia
          testo: |
            Scendi un anello alla volta, e a metà la catena comincia a battere
            sotto le dita insieme alle radici.
          pe: { atletica: 2 }
          vai: ghoran-fossa-del-seme
        fallimento:
          titolo: La catena che batte
          testo: |
            A metà la catena batte così forte che ti sfugge, e gli ultimi passi li
            fai cadendo mentre qualcuno del Guado ride.
          effetti: { ferite: 0.5 }
          vai: ghoran-fossa-del-seme
      - testo: "Cercare la scala dei vecchi"
        descrizione: "Chi ha scavato la Fossa ci scendeva a piedi, per gradini nascosti nella parete."
        prova: { attributo: mentale, abilita: [percezione, accademiche], difficolta: Media }
        successo:
          titolo: I gradini nella parete
          testo: |
            Sul lato nord trovi i gradini scavati a spirale nella parete, larghi
            appena mezzo piede. Ragh ti guarda scendere come se se li ricordasse.
          pe: { percezione: 2 }
          vai: ghoran-fossa-del-seme
        fallimento:
          titolo: Il gradino che manca
          testo: |
            A metà manca un gradino, e resti appeso con le dita finché il piede
            non trova il successivo.
          effetti: { tormento: 0.5 }
          vai: ghoran-fossa-del-seme
      - testo: "Scendere a cavallo per la rampa delle bestie"
        descrizione: "La rampa dei verri porta al fondo, e una bestia da sella la regge."
        requisiti: [chiave.cavalcatura >= 1]
        costo: 0
        esito:
          titolo: La rampa dei verri
          testo: |
            I ragazzi della Pece tolgono le tavole e la tua bestia scende al
            passo, con le orecchie dritte, fino alle radici che le battono sotto
            gli zoccoli.
          vai: ghoran-fossa-del-seme
      - testo: "Farti calare con l'argano della Pece"
        descrizione: "L'argano della Pece tira su i morti dal campo, e cala anche i vivi davanti a tutti."
        costo: 2
        esito:
          titolo: L'argano dei morti
          testo: |
            I ragazzi della Pece ti calano nell'imbragatura dei morti un giro di
            manovella alla volta, e arrivi in fondo a mezza notte con le gambe
            addormentate.
          effetti: { tormento: 0.5 }
          vai: ghoran-fossa-del-seme

  # ------------------------------------------------------------ 0 · l'arena di sotto e le gradinate
  - id: ghoran-fossa-l-arena-di-sotto
    immagine: ambientazione/regno-profondo
    titolo: L'arena di sotto
    sommario: "Il fondo della Fossa è un'arena di pietra grigia macchiata dalle dispute."
    luogo: La Fossa del Seme, l'arena di sotto
    area: ghoran-fossa-del-seme
    ripetibile: true
    requisiti: [fazione.ghoran == 10, profondita.ghoran-fossa-del-seme == 0]
    testo: |
      L'arena di sotto è un cerchio di pietra grigia con macchie scure
      bevute dalla pietra, e intorno a ogni macchia le radici si ammassano
      come maiali a un trogolo. Dall'altra parte scende un passaggio basso.

      {percezione Media} Le macchie hanno la forma di chi è caduto.
    opzioni:
      - testo: "Attraversare il cerchio senza calpestare le macchie"
        descrizione: "Dove c'è stato sangue le radici sono fitte, e si passa nei vuoti."
        prova: { attributo: fisico, abilita: [acrobazia, furtivita], difficolta: Media }
        successo:
          titolo: I vuoti
          testo: |
            Salti da un vuoto all'altro e le radici ti lasciano passare, immobili,
            fino al passaggio basso.
          pe: { acrobazia: 2 }
          effetti: { profondita.ghoran-fossa-del-seme: 1 }
        fallimento:
          titolo: Il piede nella macchia
          testo: |
            Metti un piede in una macchia e le radici ti stringono la caviglia, e
            torni alla parete zoppicando.
          effetti: { ferite: 0.5 }
      - testo: "Leggere le macchie per capire dove si combatteva"
        descrizione: "Chi conosce le arene sa da che parte si esce vivi."
        prova: { attributo: mentale, abilita: [percezione, armi-da-mischia], difficolta: Media }
        successo:
          titolo: Il lato dei vivi
          testo: |
            Sul bordo destro, da dove si usciva in piedi, non c'è nessuna macchia,
            e fai il giro largo da quella parte.
          pe: { percezione: 2 }
          effetti: { profondita.ghoran-fossa-del-seme: 1 }
        fallimento:
          titolo: Il centro
          testo: |
            Leggi le macchie al contrario e ti ritrovi in mezzo al cerchio, fra le
            radici che si alzano.
          effetti: { tormento: 0.5 }
      - testo: "Camminare piano lungo la parete"
        descrizione: "Lungo la parete le radici sono poche, e la strada è lunga il doppio."
        costo: 2
        esito:
          titolo: Lungo la parete
          testo: |
            Fai il giro del cerchio con la spalla contro la pietra, e ci metti
            un'ora con una radice che ti segue battendo.
          effetti: { profondita.ghoran-fossa-del-seme: 1, tormento: 0.5 }

  - id: ghoran-fossa-le-gradinate-di-pietra
    immagine: ambientazione/regno-profondo
    titolo: Le gradinate di pietra
    sommario: "Le gradinate della Fossa sono file strette scavate nella roccia, e sull'ultima luccica qualcosa."
    luogo: La Fossa del Seme, le gradinate
    area: ghoran-fossa-del-seme
    ripetibile: true
    requisiti: [fazione.ghoran == 10, profondita.ghoran-fossa-del-seme == 0]
    testo: |
      Le gradinate salgono fino al buio in file così strette che ci si siede
      con le ginocchia in bocca. Dietro l'ultima fila un corridoio gira
      intorno all'arena e scende, e lassù nella polvere luccica qualcosa.

      {accademiche Media} Sono file troppo regolari per un pubblico, più
      simili a quelle di un archivio.
    opzioni:
      - testo: "Salire fino all'ultima fila"
        descrizione: "In cima ci sono il corridoio e quello che luccica, ma la polvere scivola."
        prova: { attributo: fisico, abilita: atletica, difficolta: Media }
        successo:
          titolo: L'ultima fila
          testo: |
            Sali a quattro zampe e trovi un anello di rame da orecchio, come
            quelli dei mercenari di Ghoran. Lo intaschi e prendi il corridoio.
          pe: { atletica: 2 }
          effetti: { profondita.ghoran-fossa-del-seme: 1, reliquie.scheggia: 1 }
        fallimento:
          titolo: La polvere
          testo: |
            La polvere ti scivola sotto le mani e torni giù tre file alla volta,
            con i calzoni strappati.
          effetti: { ferite: 0.5 }
      - testo: "Cercare l'ingresso del corridoio dal basso"
        descrizione: "Un corridoio intorno all'arena avrà una porta anche in basso, per chi ci lavorava."
        prova: { attributo: mentale, abilita: [percezione, tecnologia], difficolta: Media }
        successo:
          titolo: La porta bassa
          testo: |
            Sotto la prima fila, dietro una cortina di radici secche, c'è una
            porta bassa da cui il corridoio scende.
          pe: { percezione: 2 }
          effetti: { profondita.ghoran-fossa-del-seme: 1 }
        fallimento:
          titolo: Le radici vive
          testo: |
            La cortina di radici è viva e ti si stringe al polso finché non la
            tagli con il coltello.
          effetti: { contaminazione: 0.5 }
      - testo: "Fare il giro lungo dietro le gradinate"
        descrizione: "Dietro le file c'è sempre un passaggio, da fare piegati."
        costo: 2
        esito:
          titolo: Piegato
          testo: |
            Cammini piegato con la torcia che ti fuma in faccia, e quando trovi il
            corridoio hai la schiena di un vecchio.
          effetti: { profondita.ghoran-fossa-del-seme: 1, ferite: 0.5 }

  # ------------------------------------------------------------ 1 · le radici e i nomi
  - id: ghoran-fossa-le-radici-che-cercano
    immagine: icone/root-tip
    titolo: Le radici che cercano
    sommario: "Nel corridoio le radici si staccano dalla parete quando passi, in cerca del caldo."
    luogo: La Fossa del Seme, il corridoio delle radici
    area: ghoran-fossa-del-seme
    ripetibile: true
    requisiti: [fazione.ghoran == 10, profondita.ghoran-fossa-del-seme == 1]
    testo: |
      Il corridoio scende in curva fra radici fitte come una rete messa ad asciugare. Al
      passaggio della torcia le più vicine si staccano e si allungano fino a un palmo dalla tua
      faccia, poi tornano alla pietra.

      {natura Media} Seguono il caldo, e una torcia lasciata a terra ne terrebbe occupate
      parecchie.
    opzioni:
      - testo: "Lasciare la torcia a terra e passare al buio"
        descrizione: "Le radici vanno al caldo, e al buio si passa tastando la parete."
        prova: { attributo: mentale, abilita: [natura, resilienza], difficolta: Media }
        successo:
          titolo: Al buio
          testo: |
            Le radici si avvolgono alla torcia piantata in una fessura, e tu passi
            al buio con la mano sulla pietra.
          pe: { natura: 2 }
          effetti: { profondita.ghoran-fossa-del-seme: 1 }
        fallimento:
          titolo: La mano sulla radice
          testo: |
            Al buio appoggi la mano su una radice, e torni a riprendere la torcia
            con un anello rosso sul polso.
          effetti: { contaminazione: 0.5 }
      - testo: "Tagliarsi la strada con la lama"
        descrizione: "Le radici tagliate smettono di battere, ma le altre se ne accorgono."
        combattimento: ghoran-le-radici
        vittoria:
          titolo: Le radici tagliate
          testo: |
            Tagli in tre pezzi la radice che ti viene addosso, e le altre si
            ritirano contro la parete.
          effetti: { profondita.ghoran-fossa-del-seme: 1 }
        sconfitta:
          titolo: La stretta
          testo: |
            La radice ti stringe il braccio finché la lama cade, e quando te ne
            liberi torni indietro di corsa.
          effetti: { contaminazione: 0.5 }
      - testo: "Passare in fretta, lasciandosi toccare"
        descrizione: "Le radici toccano e poi si ritirano, quindi si passa di corsa."
        costo: 2
        esito:
          titolo: Di corsa
          testo: |
            Corri con la torcia alta fra le radici fredde che ti sfiorano il
            collo, e in fondo ti strofini la pelle finché non brucia.
          effetti: { profondita.ghoran-fossa-del-seme: 1, contaminazione: 0.5 }

  - id: ghoran-fossa-i-nomi-sul-muro
    immagine: ambientazione/regno-profondo
    titolo: I nomi sul muro
    sommario: "In una nicchia del corridoio ci sono nomi incisi nella pietra che nessun martello scheggia."
    luogo: La Fossa del Seme, la nicchia dei nomi
    area: ghoran-fossa-del-seme
    ripetibile: true
    requisiti: [fazione.ghoran == 10, profondita.ghoran-fossa-del-seme == 1]
    testo: |
      La pietra della nicchia è coperta di nomi incisi, alcuni accanto al
      segno di un clan. In fondo c'è quello di Ragh, più profondo degli
      altri, con sotto una fila di tacche fatte da mani diverse.

      {tecnologia Media} Nessun martello scheggia questa pietra, eppure i
      solchi hanno il fondo lucido, come se si fosse lasciata incidere.
    opzioni:
      - testo: "Incidere il tuo nome accanto agli altri"
        descrizione: "Chi scende lascia il nome. La pietra sceglie se tenerlo."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Media }
        successo:
          titolo: Il tuo nome
          testo: |
            Il coltello segna la pietra come cera tiepida, e quando togli la lama
            vedi dietro la nicchia un corridoio che prima ti era sfuggito.
          pe: { resilienza: 2 }
          effetti: { profondita.ghoran-fossa-del-seme: 1 }
        fallimento:
          titolo: La lama che scivola
          testo: |
            La lama scivola senza lasciare segno e ti apre il pollice, e al tuo
            sangue le radici battono più forte.
          effetti: { ferite: 0.5 }
      - testo: "Contare le tacche e capire il conto di Ragh"
        descrizione: "Un conto si fa per sapere quando finisce."
        prova: { attributo: mentale, abilita: [accademiche, percezione], difficolta: Media }
        successo:
          titolo: Il conto delle discese
          testo: |
            C'è una tacca per ogni discesa dopo quella di Ragh, e nessuno è mai
            sceso più giù di qui. Dietro le tacche una fessura scende.
          pe: { accademiche: 2 }
          effetti: { profondita.ghoran-fossa-del-seme: 1, informazioni.segreto: 1 }
        fallimento:
          titolo: I nomi che si muovono
          testo: |
            Alla terza volta che conti le tacche i nomi sembrano più vicini, ed
            esci all'indietro.
          effetti: { tormento: 0.5 }
      - testo: "Leggere tutti i nomi, uno per uno"
        descrizione: "Ci vuole tempo, e i nomi restano dentro a chi li legge."
        costo: 2
        esito:
          titolo: I nomi letti
          testo: |
            Li leggi tutti a mezza voce e arrivi a quello di Ragh con la gola
            secca, accanto a una fessura che non avevi visto.
          effetti: { profondita.ghoran-fossa-del-seme: 1, tormento: 0.5 }

  # ------------------------------------------------------------ 1–3 · la muta
  - id: ghoran-fossa-la-muta
    immagine: icone/wolf-head
    titolo: La muta
    sommario: "Nel buio vive la muta dei cani buttati di sotto con i perdenti delle dispute, e nessuno abbaia."
    luogo: La Fossa del Seme, la tana dei cani
    area: ghoran-fossa-del-seme
    ripetibile: true
    requisiti: [fazione.ghoran == 10, profondita.ghoran-fossa-del-seme >= 1, profondita.ghoran-fossa-del-seme <= 3]
    testo: |
      Il corridoio sbuca in una caverna bassa che puzza di bestia, dove si
      accendono gli occhi di cani grigi e senza pelo, nipoti di quelli buttati
      di sotto con i clan che perdevano. Nessuno abbaia, e il più grosso si
      mette fra te e l'uscita, ma più in alto, dove le radici fanno da scala,
      se ne apre un'altra.

      {addestrare-animali Media} Aspettano un ordine, come i cani dei recinti.
    opzioni:
      - testo: "Dare l'ordine dei recinti"
        descrizione: "I cani di Ghoran rispondono a un fischio e a un gesto, e questi forse se lo ricordano."
        prova: { attributo: sociale, abilita: [addestrare-animali, intimidire], difficolta: Media }
        successo:
          titolo: A cuccia
          testo: |
            Fischi corto e abbassi la mano aperta come i cacciatori del Guado, e la muta si
            sdraia dietro al cane grosso lasciandoti passare.
          pe: { addestrare-animali: 2 }
          effetti: { profondita.ghoran-fossa-del-seme: 1 }
        fallimento:
          titolo: Il fischio sbagliato
          testo: |
            Il fischio esce storto e la muta si alza tutta insieme, ringhiando,
            mentre esci all'indietro con la lama davanti.
          effetti: { tormento: 0.5 }
      - testo: "Salire per le radici fino all'uscita alta"
        descrizione: "Le radici della parete fanno da scala. I cani non si arrampicano."
        prova: { attributo: fisico, abilita: [acrobazia, furtivita], difficolta: Media }
        successo:
          titolo: L'uscita alta
          testo: |
            Sali per le radici come per una scala di corda, con la muta che ti
            guarda da sotto, fino al corridoio dell'uscita alta.
          pe: { acrobazia: 2 }
          effetti: { profondita.ghoran-fossa-del-seme: 1 }
        fallimento:
          titolo: La radice che cede
          testo: |
            Una radice cede e cadi fra i cani, e scappi da dove sei venuto con un
            morso sul polpaccio.
          effetti: { ferite: 0.5 }
      - testo: "Affrontare la muta"
        descrizione: "Sono magri e veloci, e il buio è casa loro."
        combattimento: ghoran-la-muta
        vittoria:
          titolo: La muta dispersa
          testo: |
            Quando i due più grossi restano a terra gli altri spariscono nel buio,
            e attraversi la caverna con la lama alzata.
          effetti: { profondita.ghoran-fossa-del-seme: 1 }
        sconfitta:
          titolo: I denti nel buio
          testo: |
            I cani ti spingono fuori dalla caverna a morsi senza mai abbaiare,
            e si fermano sulla soglia a guardarti andare.
          effetti: { tormento: 0.5 }
      - testo: "Lasciargli quello che hai da mangiare"
        descrizione: "Una muta affamata si compra con il pane. Il pane però era per te."
        costo: 2
        esito:
          titolo: Il pane
          testo: |
            Butti in mezzo alla caverna il pane e la carne secca, e passi mentre
            la muta mangia in silenzio.
          effetti: { profondita.ghoran-fossa-del-seme: 1, ferite: 0.5 }

  # ------------------------------------------------------------ 2 · la pozza nera e il muro liscio
  - id: ghoran-fossa-la-pozza-nera
    immagine: ambientazione/marea-grigia
    titolo: La pozza nera
    sommario: "Le radici scendono tutte in una pozza d'acqua nera che non riflette la torcia."
    luogo: La Fossa del Seme, la pozza
    area: ghoran-fossa-del-seme
    ripetibile: true
    requisiti: [fazione.ghoran == 10, profondita.ghoran-fossa-del-seme == 2]
    testo: |
      Più in basso le radici scendono tutte in una pozza d'acqua nera che si
      increspa a ogni colpo, e per passare c'è soltanto una cengia stretta
      lungo il bordo.

      {medicina Media} L'acqua ha l'odore di chi è stato troppo vicino alla
      Marea Grigia, ed è meglio non toccarla.
    opzioni:
      - testo: "Passare sulla cengia"
        descrizione: "La cengia è larga mezzo piede, e la parete non ha appigli."
        prova: { attributo: fisico, abilita: acrobazia, difficolta: Media }
        successo:
          titolo: Mezzo piede
          testo: |
            Passi con il petto contro la parete e i talloni sul vuoto, senza mai
            guardare l'acqua.
          pe: { acrobazia: 2 }
          effetti: { profondita.ghoran-fossa-del-seme: 1 }
        fallimento:
          titolo: Fino al ginocchio
          testo: |
            Scivoli nell'acqua fino al ginocchio, e torni indietro a strofinarti
            le gambe con la sabbia finché non bruciano.
          effetti: { contaminazione: 0.5 }
      - testo: "Capire dove la pozza è bassa"
        descrizione: "Dove le radici non scendono, forse, si tocca il fondo."
        prova: { attributo: mentale, abilita: [natura, percezione], difficolta: Media }
        successo:
          titolo: Il guado
          testo: |
            Lungo il bordo sinistro, libero dalle radici, il fondo si vede, e
            attraversando trovi fra i sassi un frammento di metallo inciso.
          pe: { natura: 2 }
          effetti: { profondita.ghoran-fossa-del-seme: 1, reliquie.frammento-inciso: 1 }
        fallimento:
          titolo: La buca
          testo: |
            Dove sembrava basso c'è una buca, e ne esci bagnato di acqua nera fino
            alla vita.
          effetti: { contaminazione: 0.5 }
      - testo: "Fare il giro per il cunicolo asciutto"
        descrizione: "Un cunicolo stretto e lungo gira intorno alla pozza."
        costo: 2
        esito:
          titolo: Il cunicolo
          testo: |
            Strisci nel cunicolo con la torcia spenta fra i denti, e sbuchi
            dall'altra parte coperto di terra.
          effetti: { profondita.ghoran-fossa-del-seme: 1, tormento: 0.5 }

  - id: ghoran-fossa-il-muro-liscio
    immagine: ambientazione/rovine-dei-precursori
    titolo: Il muro liscio
    sommario: "Il corridoio finisce contro un muro liscio senza giunture, e le radici ci passano attraverso."
    luogo: La Fossa del Seme, il muro liscio
    area: ghoran-fossa-del-seme
    ripetibile: true
    requisiti: [fazione.ghoran == 10, profondita.ghoran-fossa-del-seme == 2]
    testo: |
      Il corridoio finisce contro un muro di pietra grigia liscio come il
      vetro, che le radici attraversano come se non ci fosse.

      {tecnologia Media} È la pietra delle rovine dei Precursori, quella che
      non si graffia, e dove entrano le radici ha fori rotondi fatti apposta,
      come asole.
    opzioni:
      - testo: "Trovare il foro più grande e passarci"
        descrizione: "Se il muro ha fori per le radici, ne avrà uno per chi le curava."
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Media }
        successo:
          titolo: L'asola
          testo: |
            Sotto le radici più grosse c'è un foro largo quanto un uomo
            accucciato, e ci passi strisciando.
          pe: { tecnologia: 2 }
          effetti: { profondita.ghoran-fossa-del-seme: 1 }
        fallimento:
          titolo: Il muro tiepido
          testo: |
            Tasti il muro per un'ora senza trovare niente, se non che si scalda
            dove appoggi le mani.
          effetti: { tormento: 0.5 }
      - testo: "Arrampicarti sulle radici fino al soffitto"
        descrizione: "Le radici entrano anche dall'alto, e dove entrano c'è spazio."
        prova: { attributo: fisico, abilita: atletica, difficolta: Media }
        successo:
          titolo: Il varco in alto
          testo: |
            In cima il muro si ferma un palmo sotto la volta, e ti infili nel
            varco lasciandoti cadere dall'altra parte.
          pe: { atletica: 2 }
          effetti: { profondita.ghoran-fossa-del-seme: 1 }
        fallimento:
          titolo: La caduta
          testo: |
            Il colpo delle radici ti stacca le mani mentre sei appeso, e cadi di
            schiena sulla pietra.
          effetti: { ferite: 0.5 }
      - testo: "Aspettare che le radici si aprano"
        descrizione: "Fra un colpo e l'altro le radici si sgonfiano. Forse lasciano passare."
        costo: 2
        esito:
          titolo: Fra un colpo e l'altro
          testo: |
            Conti i colpi davanti al muro finché le radici più grosse,
            sgonfiandosi, lasciano libero un foro, e al colpo giusto ci passi.
          effetti: { profondita.ghoran-fossa-del-seme: 1, tormento: 0.5 }

  # ------------------------------------------------------------ 3 · le ossa dell'inverno e la strettoia
  - id: ghoran-fossa-le-ossa-dell-inverno
    immagine: ambientazione/regno-profondo
    titolo: Le ossa dell'inverno
    sommario: "Una sala piena di ossa tenute insieme dalle radici, i morti di un inverno di diciannove anni fa."
    luogo: La Fossa del Seme, la sala delle ossa
    area: ghoran-fossa-del-seme
    ripetibile: true
    requisiti: [fazione.ghoran == 10, profondita.ghoran-fossa-del-seme == 3]
    testo: |
      La sala è piena di ossa ammucchiate contro le pareti come legna per
      l'inverno, tenute insieme dalle radici. Fra le ossa restano fibbie e
      lame spezzate, e su qualche cranio il filo di rame dei capelli.

      {medicina Media} Sono morti quasi tutti giovani e nello stesso
      periodo, di ferite da lama, una disputa dopo l'altra.

      {origine fuggiasco-di-ghoran} Nei recinti i sorveglianti parlavano a
      voce bassa dell'inverno in cui i clan si erano mangiati da soli.
    opzioni:
      - testo: "Attraversare la sala sulle ossa"
        descrizione: "Non c'è pavimento libero, e le ossa si spostano sotto i piedi."
        prova: { attributo: fisico, abilita: [acrobazia, resistenza], difficolta: Media }
        successo:
          titolo: Sulle ossa
          testo: |
            Metti i piedi dove le radici tengono ferme le ossa e arrivi a un arco
            basso, oltre il quale l'aria cambia.
          pe: { acrobazia: 2 }
          effetti: { profondita.ghoran-fossa-del-seme: 1 }
        fallimento:
          titolo: La frana di ossa
          testo: |
            Un mucchio ti frana sotto i piedi, e ne esci tossendo con un taglio
            fatto da una lama di diciannove anni fa.
          effetti: { ferite: 0.5 }
      - testo: "Leggere i segni dei clan sulle fibbie"
        descrizione: "Ogni clan ha il suo segno, e i morti dicono chi ha combattuto contro chi."
        prova: { attributo: mentale, abilita: [accademiche, conoscenze-della-strada], difficolta: Difficile }
        successo:
          titolo: Tutti i clan
          testo: |
            Le ossa più vicine all'arco basso hanno tutte la fibbia senza segno
            che a Ghoran porta chi non ha clan. Il peso, pensi. Passi sotto l'arco
            con le fibbie in tasca.
          pe: { accademiche: 2 }
          effetti: { profondita.ghoran-fossa-del-seme: 1, informazioni.segreto: 1 }
        fallimento:
          titolo: I segni confusi
          testo: |
            Alla luce della torcia i segni si somigliano tutti, e rimetti giù le
            fibbie.
          effetti: { tormento: 0.5 }
      - testo: "Raccogliere le ossa e farti strada"
        descrizione: "Le ossa si spostano una per una, e ci vuole tempo."
        costo: 2
        esito:
          titolo: Il sentiero
          testo: |
            Sposti le ossa contro la parete, con i crani verso il muro, e arrivi
            all'arco con le mani bianche di polvere.
          effetti: { profondita.ghoran-fossa-del-seme: 1, tormento: 0.5 }

  - id: ghoran-fossa-la-strettoia
    immagine: ambientazione/regno-profondo
    titolo: La strettoia
    sommario: "Le radici si stringono in un passaggio dove si entra di fianco, e battono più forte."
    luogo: La Fossa del Seme, la strettoia
    area: ghoran-fossa-del-seme
    ripetibile: true
    requisiti: [fazione.ghoran == 10, profondita.ghoran-fossa-del-seme == 3]
    testo: |
      Le radici si stringono in un passaggio largo quanto un uomo di fianco,
      che ogni colpo chiude quasi. Quando si sgonfiano si apre un varco per
      tre passi, e di là c'è una luce grigia che non viene da nessuna
      torcia.

      {resilienza Media} Se ti lasci contare dal colpo passi, se lo conti tu
      resti incastrato.
    opzioni:
      - testo: "Passare fra un colpo e l'altro"
        descrizione: "Tre passi di fianco, nel tempo fra due colpi."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Media }
        successo:
          titolo: Tre passi
          testo: |
            Entri di fianco subito dopo il colpo, e al terzo passo sei fuori
            mentre le radici si chiudono alle tue spalle.
          pe: { atletica: 2 }
          effetti: { profondita.ghoran-fossa-del-seme: 1 }
        fallimento:
          titolo: Il colpo che stringe
          testo: |
            Parti tardi e le radici ti stringono il petto finché non vedi bianco,
            e quando si sgonfiano torni indietro.
          effetti: { ferite: 0.5 }
      - testo: "Lasciare che il colpo ti porti"
        descrizione: "Si sta fermi e si va quando il corpo lo dice."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Difficile }
        successo:
          titolo: A tempo
          testo: |
            Smetti di contare e il corpo parte da solo con il colpo, fino alla
            luce grigia dall'altra parte.
          pe: { resilienza: 2 }
          effetti: { profondita.ghoran-fossa-del-seme: 1 }
        fallimento:
          titolo: Il conto
          testo: |
            Ti scopri a contare, e il colpo ti trova fermo sulla soglia e ti
            costringe ad arretrare.
          effetti: { tormento: 0.5 }
      - testo: "Allargare la strettoia con la lama"
        descrizione: "Si tagliano le radici piccole una per colpo, ma le grandi se ne accorgono."
        costo: 2
        esito:
          titolo: Il varco tagliato
          testo: |
            Tagli le radici piccole fra un colpo e l'altro finché il varco resta
            aperto, e le grandi ti lasciano la pelle grigia dove ti strisciano.
          effetti: { profondita.ghoran-fossa-del-seme: 1, contaminazione: 0.5 }

  # ------------------------------------------------------------ il cuore · la porta dell'ascia
  - id: ghoran-fossa-la-porta-dell-ascia
    immagine: bestiario/cinghiale-mutato-gigante
    titolo: La porta dell'ascia
    sommario: "Davanti alla porta in fondo alla Fossa c'è una bipenne piantata in una radice, e un verro a guardia."
    luogo: La Fossa del Seme, il fondo
    area: ghoran-fossa-del-seme
    requisiti: [fazione.ghoran == 10, profondita.ghoran-fossa-del-seme >= 4]
    testo: |
      Il fondo della Fossa è una sala rotonda, con una luce grigia che sale
      dal pavimento come da sotto il ghiaccio. Le radici convergono verso una
      porta di pietra alta tre uomini, e davanti, piantata di traverso nella
      radice più grossa, c'è una bipenne.

      Accanto dorme un verro grande come un carro, con le radici che gli
      escono dalla schiena come setole ed entrano nel pavimento. Quando le
      radici battono apre un occhio e si alza.

      {addestrare-animali Difficile} È un verro da combattimento dei recinti,
      e tanti anni fa qualcuno gli ha insegnato a obbedire a un grido.
    opzioni:
      - testo: "Affrontare il verro radicato"
        descrizione: "È grande come un carro, e le radici lo tengono in piedi anche quando dovrebbe cadere."
        combattimento: ghoran-il-verro
        vittoria:
          titolo: Il verro a terra
          testo: |
            Il verro cade sul fianco, e le radici della schiena si strappano dal
            pavimento come corde. Gli stacchi una zanna, e ai piedi della porta
            trovi anelli di rame e frammenti incisi di chi era sceso prima.

            Quando risali, lasciata la bipenne dov'è, Ragh è il primo dei clan a
            tenderti la mano.
          effetti: { fazione.ghoran: 1, oggetto.ghoran-dente-del-verro: 1, reliquie.frammento-inciso: 2, reperto.sigillato: 1 }
          vai: superficie-fratturata
        sconfitta:
          titolo: Le zanne
          testo: |
            Il verro ti butta contro la parete con una zanna, e scappi su per la
            Fossa senza voltarti. In cima i clan ti tirano su, e Ostrav ride.
          effetti: { tormento: 1 }
          vai: superficie-fratturata
      - testo: "Gridargli l'ordine dei recinti"
        descrizione: "Qualcuno gli ha insegnato a obbedire a un grido, da dare con la voce di un padrone."
        prova: { attributo: sociale, abilita: [addestrare-animali, intimidire], difficolta: Difficile }
        successo:
          titolo: Il grido
          testo: |
            Gridi l'ordine con cui i cacciatori del Guado fermano le bestie, e il
            verro si blocca a zanne basse. Raccogli una sua zanna rotta, e ai
            piedi della porta trovi anelli di rame e frammenti di chi era sceso
            prima.

            Quando risali, lasciata la bipenne dov'è, Ragh è il primo dei clan a
            tenderti la mano.
          pe: { addestrare-animali: 5 }
          effetti: { fazione.ghoran: 1, oggetto.ghoran-dente-del-verro: 1, reliquie.frammento-inciso: 2, reperto.sigillato: 1 }
          vai: superficie-fratturata
        fallimento:
          titolo: La voce che si rompe
          testo: |
            La voce ti si rompe a metà grido e il verro carica, e corri fino alla
            catena con le zanne a un passo dalla schiena.
          effetti: { ferite: 2, tormento: 0.5 }
          vai: superficie-fratturata
      - testo: "Tagliare le radici che lo tengono in vita"
        descrizione: "Senza le radici che gli entrano nella schiena, un verro di quell'età non regge in piedi."
        prova: { attributo: mentale, abilita: [natura, medicina], difficolta: Difficile }
        successo:
          titolo: Le setole tagliate
          testo: |
            Aspetti che le radici della schiena siano tese dalla stessa parte e le
            tagli con tre colpi, e il verro si siede come un vecchio stanco. Gli
            prendi una zanna, e ai piedi della porta trovi anelli di rame e frammenti
            di chi era sceso prima.

            Quando risali, lasciata la bipenne dov'è, Ragh è il primo dei clan a
            tenderti la mano.
          pe: { natura: 5 }
          effetti: { fazione.ghoran: 1, oggetto.ghoran-dente-del-verro: 1, reliquie.frammento-inciso: 2, reperto.sigillato: 1 }
          vai: superficie-fratturata
        fallimento:
          titolo: La radice sbagliata
          testo: |
            Tagli la radice sbagliata e quella che resta ti frusta in pieno petto,
            e scappi verso la strettoia mentre il verro si gira.
          effetti: { ferite: 1.5, contaminazione: 1 }
          vai: superficie-fratturata
      - testo: "Strappare la bipenne dalla radice e usarla"
        descrizione: "Diciannove anni di radice intorno alla lama, e se viene via la radice madre sanguina con il verro."
        prova: { attributo: fisico, abilita: [atletica, armi-da-mischia], difficolta: Difficile }
        successo:
          titolo: La lama che esce
          testo: |
            Tiri il manico nero e la lama esce dalla radice, che cola linfa scura,
            mentre il verro crolla in ginocchio come se avessi colpito lui.
            Rimetti piano la bipenne al suo posto e prendi una zanna al verro. Ai
            piedi della porta trovi anelli di rame e frammenti di chi era sceso
            prima.

            Quando risali, Ragh è il primo dei clan a tenderti la mano.
          pe: { atletica: 5 }
          effetti: { fazione.ghoran: 1, oggetto.ghoran-dente-del-verro: 1, reliquie.frammento-inciso: 2, reperto.sigillato: 1 }
          vai: superficie-fratturata
        fallimento:
          titolo: Il manico che non cede
          testo: |
            La bipenne non si muove di un dito, e il verro ti prende di fianco e
            ti butta lontano. Ti trascini fino alla strettoia con un braccio che
            non risponde.
          effetti: { ferite: 2, tormento: 0.5 }
          vai: superficie-fratturata
