# Le voci del glossario per i personaggi e i luoghi della quest di Ghoran, nel formato di
# contenuti/glossario/personaggi.yaml: presentazioni stabili, senza segreti (il patto di Ragh e il Seme restano
# fuori). Ghoran, Tasha la Bianca, Urtilia Mendion e Lucia Malgrani hanno già la loro voce.
# - Ragh Kor'Nul, la Fossa del Seme e Vesna c'erano già nei testi, senza voce.
# - Il clan del Guado non ha l'alias «Guado», che è anche il Guado di Pietra della strada del fango; il clan della
#   Pece ha l'alias «Pece», che nei testi è sempre maiuscolo solo per il clan.
# - Corvo, Jarko e Malvo compaiono in una scena sola e restano senza voce.
glossario:
  - id: ragh-kor-nul
    nome: Ragh Kor'Nul
    alias: [Ragh]
    tipo: personaggio
    sottotitolo: "Il capo dei clan di Ghoran"
    testo: "L'uomo che i clan di Ghoran riconoscono come capo. È enorme, porta una benda di cuoio sull'occhio sinistro e ha una voce profonda come una miniera. Prima di parlare batte due volte le nocche sul bracciolo, come si posano due pesi sul piatto, e non dimentica un torto."
    requisiti: []

  - id: fossa-del-seme
    nome: Fossa del Seme
    alias: [la Fossa]
    tipo: luogo
    sottotitolo: "L'arena sotto il campo dei gladiatori di Ghoran"
    testo: "Un'arena di pietra più antica del villaggio, sotto il campo dei gladiatori di Ghoran. Le pareti non si scheggiano con nessun martello, e dal pavimento escono radici nere che battono quando ci cola il sangue. I clan ci scendono soltanto per le dispute più gravi, e chi ne risale vivo è parente di tutti."
    requisiti: []

  - id: vesna
    nome: Vesna
    tipo: personaggio
    sottotitolo: "Gladiatrice della Pece"
    testo: "Gladiatrice di Ghoran che combatte per il clan della Pece, con le braccia nude e una treccia legata con il filo di rame. Ride con mezza bocca e picchia forte. Dopo l'ultima ripresa della notte si allena da sola nel campo vuoto."
    requisiti: []

  - id: clan-della-pece
    nome: clan della Pece
    alias: [Pece]
    tipo: fazione
    sottotitolo: "Clan di Ghoran"
    testo: "Il clan di Ghoran che fa le torce di pece e tiene il campo dei gladiatori insieme ai suoi tamburi e all'argano dei morti. Il suo segno è un'impronta nera di mano. Lo guida Gedda, e ci combatte Vesna."
    requisiti: []

  - id: clan-del-guado
    nome: clan del Guado
    tipo: fazione
    sottotitolo: "Clan di Ghoran"
    testo: "Uno dei clan più ricchi di Ghoran. Compra ragazzi per rivenderli e tiene i cani da presa per riprendere chi scappa dai recinti. I suoi uomini portano il sigillo di cera verde cucito sulla spalla. Il suo capo è Ostrav, un mercante di uomini."
    requisiti: []

  - id: gedda-della-pece
    nome: Gedda della Pece
    alias: [Gedda]
    tipo: personaggio
    sottotitolo: "La capa del clan della Pece"
    testo: "Una donna grigia con le braccia coperte di cicatrici, che guida il clan della Pece. Mastica resina tutto il giorno e la sputa quando qualcosa non le piace, e alla bilancia parla poco e per ultima."
    requisiti: []

  - id: ostrav
    nome: Ostrav
    tipo: personaggio
    sottotitolo: "Il capo del clan del Guado"
    testo: "Il capo del clan del Guado, un mercante di uomini dai modi gentili che si gira sempre fra le dita un anello di cera verde. Chiama merce quello che compra e parla dei prezzi della carne come altri parlano del tempo."
    requisiti: []

  - id: tibbo
    nome: Tibbo
    tipo: personaggio
    sottotitolo: "Gladiatore di Ghoran"
    testo: "Un ragazzo comprato dal clan del Guado per combattere nel campo dei tamburi. Parla poco e quasi soltanto con le dita, nella lingua dei recinti, e tiene gli occhi bassi anche quando nessuno lo guarda. Dopo la morte di Jarko è passato alla Pece."
    requisiti: []

  - id: oska
    nome: Oska
    tipo: personaggio
    sottotitolo: "La cerusica del campo dei tamburi"
    testo: "Una vecchia piccola con le braccia nodose e un grembiule di cuoio, che sotto le gradinate del campo di Ghoran ricuce i gladiatori con aghi d'osso e budello di capra. Si fa pagare prima, beve acquavite dalla stessa tazza dei feriti e ride di rado."
    requisiti: []
