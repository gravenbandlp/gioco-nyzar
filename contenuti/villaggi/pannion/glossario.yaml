# Le voci del glossario per Pannion: il villaggio, i luoghi e i personaggi che il gioco nominava senza dar loro una
# voce (Darrin Huld, Frate Koln, il Vecchio Albero, Delek, Ansgar) e quelli nuovi della quest (Liduina Brace, Gaspare
# Tenca). Presentazioni stabili, senza segreti: perché il villaggio si è spostato lo dice la quest, non il glossario.
# - «vecchia Pannion» si cerca con la minuscola, come sta nei testi; la forma più lunga vince su «Pannion».
# - Il Vecchio Albero si cerca solo per nome intero: «Vecchio» da solo apre troppe frasi.
# - Delek compare anche nel diario di Aurenne (piste/capomozzo-ritorno.yaml): la voce dice soltanto chi è oggi.
glossario:
  - id: pannion
    nome: Pannion
    tipo: luogo
    sottotitolo: "Villaggio dei carbonai, a nord-est"
    testo: "Villaggio di boscaioli e carbonai su un'altura di terra rossa a nord-est di Qir-Azel. Manda in città legname per i ponti e carbone per le forge, e di notte accende le lanterne sui pontili."
    requisiti: []

  - id: vecchia-pannion
    nome: vecchia Pannion
    tipo: luogo
    sottotitolo: "Il villaggio di prima, nella valle"
    testo: "Il villaggio dei nonni di Pannion, più in basso, nella valle delle sequoie grandi, con le case riprese dalle radici del bosco. Fra quelle radici c'è la Conca degli specchi, e ci scende quasi nessuno."
    requisiti: []

  - id: conca-degli-specchi
    nome: Conca degli specchi
    tipo: luogo
    sottotitolo: "La vasca di pietra della vecchia Pannion"
    testo: "Una vasca rotonda di pietra liscia fra le radici della vecchia Pannion. Alla luce del sole l'acqua mostra volti sconosciuti in fogge mai viste, e soltanto sotto la luna il volto giusto."
    requisiti: []

  - id: darrin-huld
    nome: Darrin Huld
    alias: [Darrin]
    tipo: personaggio
    sottotitolo: "Caposquadra di Pannion"
    testo: "Il caposquadra di Pannion, con un orecchio mezzo bruciato da una carbonaia e poche parole per tutto. Tiene fede alle consegne della Rappresentante Julia Castaldi anche quando gli costano, e al Vecchio Albero parla per nome."
    requisiti: []

  - id: frate-koln
    nome: Frate Koln
    alias: [Koln]
    tipo: personaggio
    sottotitolo: "Frate del Velo a Pannion"
    testo: "Frate del Velo che tiene la cappella di Pannion e ride tanto forte che lo si sente dalla piazza. Con la linfa del Vecchio Albero fa unguenti che chiudono le bruciature dei carbonai."
    requisiti: []

  - id: vecchio-albero
    nome: Vecchio Albero
    tipo: cosa
    sottotitolo: "Il totem nero di Pannion"
    testo: "Il tronco nero in mezzo alla piazza di Pannion, annerito dal fumo dei carbonai. I boscaioli dicono che cresce ancora, e Darrin Huld gli parla quando deve decidere."
    requisiti: []

  - id: liduina-brace
    nome: Liduina Brace
    alias: [Liduina]
    tipo: personaggio
    sottotitolo: "La donna delle lanterne di Pannion"
    testo: "La più vecchia di Pannion, che ogni sera accende le lanterne del pontile più lungo contandole a mezza voce. È nata nella vecchia Pannion, e ricorda la strada per scendere."
    requisiti: []

  - id: gaspare-tenca
    nome: Gaspare Tenca
    alias: [Tenca]
    tipo: personaggio
    sottotitolo: "Capo della banda di Pannion"
    testo: "Il capo della banda di Pannion, che risponde agli Scuri quando conviene. Di giorno è un boscaiolo con un ronco da potatura alla cintura, e di notte vende quello che il bosco non sa di aver perso."
    requisiti: [pannion.tenca <= 1]

  - id: gaspare-tenca-cacciato
    nome: Gaspare Tenca
    alias: [Tenca]
    tipo: personaggio
    sottotitolo: "Ex capo della banda di Pannion"
    testo: "Era il capo della banda di Pannion, che risponde agli Scuri quando conviene. Da quando è sceso a scavare nella vecchia Pannion, Darrin Huld l'ha cacciato dall'altura."
    requisiti: [pannion.tenca == 2]

  - id: delek
    nome: Delek
    tipo: personaggio
    sottotitolo: "Carbonaio di Pannion"
    testo: "Carbonaio di Pannion sui trent'anni, con la barba nera di fuliggine, che lavora nelle carbonaie più basse del bosco, dove nessun altro vuole andare. In città è stato una volta sola."
    requisiti: []

  - id: ansgar
    nome: Ansgar
    tipo: personaggio
    sottotitolo: "Giovane carbonaio di Pannion"
    testo: "Ragazzo della squadra di Darrin Huld, con le mani nere di carbone fino ai polsi e una scottatura che si gratta quando è nervoso. Parla poco, e porta in città i messaggi del caposquadra."
    requisiti: []
