# Le voci del glossario per Pannion: il villaggio, i luoghi e i personaggi che il gioco nominava senza dar loro una
# voce (Darrin Huld, Frate Koln, il Vecchio Albero, Delek, Ansgar) e quelli nuovi della quest (Liduina Brace, Gaspare
# Tenca). Presentazioni stabili, senza segreti: perché il villaggio si è spostato lo dice la quest, non il glossario.
# - «vecchia Pannion» si cerca con la minuscola, come sta nei testi; la forma più lunga vince su «Pannion».
# - Il Vecchio Albero si cerca solo per nome intero: «Vecchio» da solo apre troppe frasi.
# - Delek compare anche nel diario di Aurenne (piste/capomozzo-ritorno.yaml): la voce dice soltanto chi è oggi.
glossario:
  - id: pannion
    nome: Pannion
    tipo: luogo
    sottotitolo: "Villaggio dei carbonai, a nord-est"
    testo: "Villaggio di boscaioli e di carbonai su un'altura di terra rossa a nord-est di Qir-Azel, fra le sequoie minori e i fiumi di linfa indurita. Manda in città il legname per i ponti e il carbone per le forge, e nelle sue strade c'è sempre odore di fumo. Di notte accende le lanterne sui pontili che escono verso il bosco."
    requisiti: []

  - id: vecchia-pannion
    nome: vecchia Pannion
    tipo: luogo
    sottotitolo: "Il villaggio di prima, nella valle"
    testo: "Il villaggio da cui vengono i nonni di Pannion, più in basso dell'altura, nella valle delle sequoie grandi. Le case sono ancora in piedi, e il bosco se le è riprese con le radici. Fra quelle radici c'è la Conca degli specchi. A Pannion se ne parla poco, e ci scende quasi nessuno."
    requisiti: []

  - id: conca-degli-specchi
    nome: Conca degli specchi
    tipo: luogo
    sottotitolo: "La vasca di pietra della vecchia Pannion"
    testo: "Una vasca rotonda di pietra liscia scavata in un blocco solo, larga tre passi, fra le radici della vecchia Pannion. L'acqua è limpida e si beve senza danno. Alla luce del sole chi si affaccia vede gente sconosciuta, vestita in fogge mai viste; soltanto di notte, sotto la luna, l'acqua restituisce il volto giusto."
    requisiti: []

  - id: darrin-huld
    nome: Darrin Huld
    alias: [Darrin]
    tipo: personaggio
    sottotitolo: "Caposquadra di Pannion"
    testo: "Il caposquadra di Pannion, che dirige i tagli e le carbonaie con poche parole e gesti netti. Ha le mani larghe e un orecchio mezzo bruciato da una carbonaia di trent'anni fa. A Qir-Azel ci va malvolentieri, eppure riconosce la Rappresentante Julia Castaldi e tiene fede alle consegne anche quando gli costano. Al Vecchio Albero parla per nome."
    requisiti: []

  - id: frate-koln
    nome: Frate Koln
    alias: [Koln]
    tipo: personaggio
    sottotitolo: "Frate del Velo a Pannion"
    testo: "Frate della Confraternita del Velo mandato a Pannion a tenere la cappella. È grasso e rosso in faccia, con una risata che si sente dalla piazza, e suda anche d'inverno. Raccoglie ai piedi del Vecchio Albero una linfa rossastra e ne fa gli unguenti della cappella, che chiudono le bruciature dei carbonai meglio di quelli di città."
    requisiti: []

  - id: vecchio-albero
    nome: Vecchio Albero
    tipo: cosa
    sottotitolo: "Il totem nero di Pannion"
    testo: "Il tronco nero al centro della piazza di Pannion, alto come una casa e annerito dal fumo di generazioni di carbonai. Nessuno ricorda chi l'abbia piantato. I boscaioli dicono che cresce ancora, qualche dito ogni dieci anni, e lo chiamano il Vecchio. Darrin Huld gli parla quando deve decidere qualcosa di difficile."
    requisiti: []

  - id: liduina-brace
    nome: Liduina Brace
    alias: [Liduina]
    tipo: personaggio
    sottotitolo: "La donna delle lanterne di Pannion"
    testo: "La più vecchia di Pannion, che ogni sera accende le lanterne del pontile più lungo e ogni mattina le spegne. È piccola e curva, con le dita storte dai geloni, e conta le lanterne a mezza voce come si dicono i nomi. È nata nella vecchia Pannion, e ricorda la strada per scendere."
    requisiti: []

  - id: gaspare-tenca
    nome: Gaspare Tenca
    alias: [Tenca]
    tipo: personaggio
    sottotitolo: "Capo della banda di Pannion"
    testo: "Il capo della banda di Pannion, una delle bande dei villaggi che rispondono agli Scuri quando conviene. Di giorno è un boscaiolo come gli altri, con le spalle larghe e un ronco da potatura alla cintura; di notte vende quello che il bosco non sa di aver perso."
    requisiti: [pannion.tenca <= 1]

  - id: gaspare-tenca-cacciato
    nome: Gaspare Tenca
    alias: [Tenca]
    tipo: personaggio
    sottotitolo: "Ex capo della banda di Pannion"
    testo: "Era il capo della banda di Pannion, una delle bande dei villaggi che rispondono agli Scuri quando conviene. Dopo la notte in cui è sceso a scavare nella vecchia Pannion, Darrin Huld l'ha cacciato dall'altura, e la sua scure non taglia più per nessuno."
    requisiti: [pannion.tenca == 2]

  - id: delek
    nome: Delek
    tipo: personaggio
    sottotitolo: "Carbonaio di Pannion"
    testo: "Carbonaio di Pannion, sui trent'anni, che cuoce il carbone nelle carbonaie più basse del bosco, dove nessun altro vuole lavorare. Ha le mani piene di calli e la barba nera di fuliggine fino agli zigomi. In città è stato una volta sola, e non ne parla."
    requisiti: []

  - id: ansgar
    nome: Ansgar
    tipo: personaggio
    sottotitolo: "Giovane carbonaio di Pannion"
    testo: "Un ragazzo di Pannion con le mani nere di carbone fino ai polsi e una scottatura che si gratta quando è nervoso. Fa il carbonaio nella squadra di Darrin Huld. Parla poco, e quando serve porta i messaggi del caposquadra fino in città."
    requisiti: []
