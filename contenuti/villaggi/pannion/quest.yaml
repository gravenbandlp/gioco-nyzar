# La quest di Pannion, «Per il fumo di Pannion» (fazione.pannion 0 → 15), blocco 5 di docs/piano-superficie.md.
# Pannion è un luogo della Superficie Fratturata (luogo.yaml), aperto con pista.arena >= 5. Qui la pista, la
# reputazione, la voce della fazione con i cinque gradi e le quality della quest. Gli storylet stanno in
# passi-1/2/3.yaml, la spedizione dell'Atto IV in spedizione-vecchia-pannion.yaml, nemici, oggetti e glossario nei
# loro file.
# - Atto I, il fumo (passi 1-3): la carbonaia spaccata dalle radici del Vecchio, i tronchi segnati tagliati di notte
#   dalla banda di Gaspare Tenca, la consegna del legname al Ponte delle Mille Corde (grado 1; traccia.sornione e
#   traccia.mara dalle voci dei carrettieri).
# - Atto II, la linfa (4-6): Frate Koln e la linfa rossa, le lanterne dei pontili e Liduina Brace, il conto del
#   legname in Municipio con Julia Castaldi (grado 2).
# - Atto III, il Vecchio cresce (7-9): il Vecchio cresce di un dito in una notte (il segno della Campana, non
#   spiegato), Delek il carbonaio e la strada per la vecchia Pannion, Gaspare Tenca che scende a scavare (grado 3,
#   boss).
# - Atto IV, la vecchia Pannion (10-12): Liduina racconta l'anno della linfa, la spedizione nella vecchia Pannion con
#   la Conca degli specchi (passo 11), il ritorno dal Vecchio (grado 4).
# - Atto V, la strada delle lanterne (13-15): le lanterne che si spengono da sole e il bosco che si avvicina, la
#   strada di lanterne fino alla vecchia piazza, il bosco perso davanti al Vecchio (grado 5, boss, dono.pannion).
# Perché il villaggio si è spostato: settant'anni fa, dopo una notte in cui la terra tremò a lungo, le sequoie
# della valle sanguinarono linfa per una stagione intera. La linfa scese per le strade della vecchia Pannion e
# indurì in fiumi di vetro, e la gente salì con le lanterne sull'altura di terra rossa, dove il Vecchio stava già
# da solo e la linfa non arrivava. I morti restarono nelle case, che il bosco si è ripreso.
quality:
  - { id: fazione.pannion, immagine: icone/tree-roots, nome: "Per il fumo di Pannion", categoria: pista, descrizione: "Darrin Huld ti ha lasciato un posto vicino al fuoco dei carbonai. A Pannion chi resta una stagione smette di sorridere delle lanterne." }
  - { id: rep.pannion, immagine: icone/pine-tree, nome: Pannion, categoria: reputazione, famiglia: Luoghi, descrizione: "Quanto ti considerano dei loro i boscaioli e i carbonai di Pannion, sull'altura di terra rossa." }
  - { id: pannion.tenca, nome: Gaspare Tenca, categoria: stato, nascosta: true, descrizione: "1 se Gaspare Tenca è rimasto a Pannion con la sua banda e risponde a Darrin; 2 se è stato cacciato dall'altura." }
  - { id: pannion.delek, nome: Delek, categoria: stato, nascosta: true, descrizione: "1 se Delek il carbonaio ti ha fatto da guida verso la vecchia Pannion." }
  - { id: pannion.conca, nome: La Conca degli specchi, categoria: stato, nascosta: true, descrizione: "1 se alla Conca degli specchi hai guardato l'acqua sotto la luna; 2 se hai dovuto combattere il custode." }
  - { id: pannion.segreto, nome: Il segreto della conca, categoria: stato, nascosta: true, descrizione: "1 se la Conca resta un segreto di Darrin e del Vecchio; 2 se Frate Koln ne ha scritto al Velo." }

fazioni:
  - id: pannion
    nome: Pannion
    immagine: ambientazione/foresta-strisciante
    reputazione: rep.pannion
    pista: fazione.pannion
    gradi:
      - { passo: 3, nome: Portalanterne, ricompensa: "La lanterna da pontile e una manciata di monete, con le voci dei carrettieri sul vetro che ride e sull'arco del crinale." }
      - { passo: 6, nome: Di squadra, ricompensa: "Una notte ai pontili quando ne hai bisogno, per lasciare un poco di Tormento alle lanterne, il vasetto di unguento al prezzo della squadra e una borsa." }
      - { passo: 9, nome: Fumo di Pannion, ricompensa: "La giubba di resina che i carbonai cuociono per i loro, e una borsa." }
      - { passo: 12, nome: Guardia del Vecchio, ricompensa: "La scheggia del Vecchio, che ti fa ascoltare da lui come uno di casa, e una borsa più pesante." }
      - { passo: 15, nome: Radice, ricompensa: "La scure di linfa e una borsa pesante, con la parola di Pannion che un giorno ti servirà." }
