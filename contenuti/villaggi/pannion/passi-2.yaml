# La quest di Pannion, Atto III e il passo 10 (fazione.pannion 6 → 10).
# - 6 → 7 `pannion-un-dito-in-una-notte` (Pannion): il segno della Campana. Il Vecchio cresce di un dito in una notte,
#   l'anello della lanterna della piazza scoppia, e nessuno sa perché. La scena non lo spiega.
# - 7 → 8 `pannion-il-carbonaio-di-sotto` (Pannion): Delek, l'unico che conosce la strada per la vecchia Pannion
#   (pannion.delek 1 se fa da guida). Con il diario di Aurenne si può chiedergli della ragazza dai capelli d'argento.
# - 8 → 9 `pannion-quelli-che-scendono-di-notte` (la prima casa della vecchia Pannion, grado 3, boss): Gaspare Tenca e
#   la banda spaccano il vetro di linfa di una casa. Combattimento o vie Difficili; chi fallisce non chiude il passo.
#   pannion.tenca 1 se resta a Pannion e risponde a Darrin, 2 se Darrin lo caccia. Varianti: la lanterna da pontile
#   (chiave.lanterna), il Figlio della Città Bassa, scuri.finale == 1.
# - 9 → 10 `pannion-l-anno-della-linfa` (Pannion): Liduina Brace racconta perché il villaggio si è spostato.
storylet:
  # ------------------------------------------------------------ 6 → 7 · un dito in una notte
  - id: pannion-un-dito-in-una-notte
    presso: pannion
    immagine: icone/tree-growth
    titolo: Un dito in una notte
    sommario: "Stamattina la tacca che Darrin ha inciso sul Vecchio è più alta di un dito, e l'anello della lanterna della piazza è scoppiato. Pannion è tutta in piazza, e nessuno lavora."
    luogo: Pannion, la piazza del Vecchio, all'alba
    area: superficie-fratturata
    requisiti: [fazione.pannion == 6]
    testo: |
      La mattina Pannion è tutta in piazza, e nessuno lavora. Intorno al
      Vecchio i carbonai stanno in cerchio con le mani nere in tasca, e
      Frate Koln suda nel saio a un passo dal tronco, muovendo le labbra
      senza voce.

      Sul Vecchio, all'altezza di un uomo alto, c'è una tacca che Darrin ha
      inciso con la scure il giorno in cui è diventato caposquadra. Ieri
      sera gli stava sopra la testa di un palmo. Stamattina sta più su di
      un dito, e la corteccia intorno si è aperta in una crepa fresca,
      chiara, che odora di linfa. L'anello di ferro che reggeva la lanterna
      della piazza è scoppiato ed è caduto nell'erba.

      {percezione Media} Un dito preciso. La crepa è lunga quanto la tua
      mano e ha i bordi puliti, da legno che è cresciuto in fretta.

      {magia Media fallita} Ti aspetti di sentire il Mana muoversi intorno al
      tronco, e intorno al tronco c'è lo stesso Mana di ieri. Le mani ti si
      sono fatte fredde lo stesso.

      Darrin tiene il palmo aperto sulla corteccia. «Vecchio» dice, e dopo il
      nome aspetta. Aspetta tanto che qualcuno nel cerchio comincia a parlare
      di caricare i carri e andarsene.

      *Un dito in una notte, e nessuno l'ha visto crescere.* Koln ti guarda
      come se adesso toccasse a te.

      {origine accolito-del-velo} In Cattedrale insegnano che le radici del
      Grande Albero Rosso corrono sotto tutta la Superficie. Ti torna in
      mente adesso, e ti accorgi che non ti consola.
    opzioni:
      - testo: "Misurare il Vecchio con Darrin"
        descrizione: "Una cosa misurata fa meno paura. Con la corda a nodi della segheria si vede di quanto è cresciuto davvero."
        prova: { attributo: mentale, abilita: [percezione, accademiche], difficolta: Media }
        successo:
          titolo: La tacca nuova
          testo: |
            Prendi la corda a nodi della segheria e misuri il Vecchio dalla
            radice alla tacca nuova, poi alla vecchia, segnata a carbone sulla
            corda. Un dito esatto. Lo dici ad alta voce, e la piazza si calma
            un poco. Darrin incide la tacca nuova con la scure e accanto la
            data, poi ti dice che le radici vanno guardate dove vanno a finire,
            e che la strada la sa Delek.
          pe: { percezione: 3 }
          effetti: { fazione.pannion: 1, rep.pannion: 0.5 }
        fallimento:
          titolo: La corda che scivola
          testo: |
            La corda a nodi ti scivola fra le dita, e il numero che dici fa
            gridare una donna in fondo al cerchio. Darrin ti prende la corda
            di mano e misura lui in silenzio. Un dito. Poi ti dice che le
            radici vanno guardate dove vanno a finire, e che la strada la sa
            Delek.
          effetti: { fazione.pannion: 1, scandalo: 0.5 }
      - testo: "Parlare alla piazza"
        descrizione: "Qualcuno parla già di caricare i carri. Bisogna dire alla piazza qualcosa di vero che la tenga ferma."
        prova: { attributo: sociale, abilita: [persuasione, empatia], difficolta: Media }
        successo:
          titolo: I carri scaricati
          testo: |
            Sali sulla panca della mensa e parli alla piazza senza promettere
            niente. Dici che il Vecchio cresceva anche quando loro erano
            bambini, e che stanotte ha avuto fretta. Due famiglie che avevano
            già caricato il carro lo scaricano. Quando scendi dalla panca
            Darrin ti dice che le radici vanno guardate dove vanno a finire, e
            che la strada la sa Delek.
          pe: { persuasione: 3 }
          effetti: { fazione.pannion: 1, rep.pannion: 0.5 }
        fallimento:
          titolo: L'ultimo carro
          testo: |
            Sali sulla panca e parli troppo, e una donna chiede che cosa ne può
            sapere uno arrivato con l'ultimo carro. Ride mezza piazza, e
            l'altra metà torna a casa a fare i fagotti. Darrin aspetta che tu
            scenda, poi ti dice che le radici vanno guardate dove vanno a
            finire, e che la strada la sa Delek.
          effetti: { fazione.pannion: 1, scandalo: 0.5 }
      - testo: "Salire sul Vecchio a guardare dall'alto"
        descrizione: "La corteccia ha sporgenze come gradini fino ai primi rami spezzati. Da lassù si vede la valle."
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Media }
        successo:
          titolo: Dai rami spezzati
          testo: |
            Sali per le sporgenze della corteccia fino ai primi rami spezzati,
            e da lassù vedi la valle. I fiumi di linfa luccicano più del
            solito. Fra le sequoie grandi ci sono tetti senza fumo, e in mezzo
            ai tetti un cerchio di pietra chiara. Quando scendi Darrin ti dice
            che le radici vanno guardate dove vanno a finire, e che la strada
            la sa Delek.
          pe: { acrobazia: 3 }
          effetti: { fazione.pannion: 1, rep.pannion: 0.5 }
        fallimento:
          titolo: La corteccia
          testo: |
            A metà tronco la corteccia ti si sfalda sotto le dita, e scivoli
            giù graffiandoti le braccia fino ai gomiti fra le risate dei
            bambini. Darrin ti tira su per il colletto, poi ti dice che le
            radici vanno guardate dove vanno a finire, e che la strada la sa
            Delek.
          effetti: { fazione.pannion: 1, ferite: 0.5, scandalo: 0.5 }
      - testo: "Reggere il turibolo alla funzione di Koln"
        descrizione: "Koln vuole ringraziare l'Albero davanti a tutti. Una funzione lunga tiene la piazza ferma più di qualunque discorso."
        costo: 2
        esito:
          titolo: La funzione
          testo: |
            Reggi il turibolo per tutta la funzione, con il fumo dell'incenso
            che si mescola a quello delle carbonaie. Koln canta male e a lungo,
            e alla fine la piazza è troppo stanca per avere paura. Darrin ti
            dice che le radici vanno guardate dove vanno a finire, e che la
            strada la sa Delek.
          effetti: { fazione.pannion: 1, rep.pannion: 0.5 }
      - testo: "Dire con Koln la preghiera delle radici"
        descrizione: "In Cattedrale c'è una preghiera per quando l'Albero dà un segno. La sai a memoria, e la piazza la conosce."
        quando: [origine.accolito-del-velo >= 1]
        esito:
          titolo: La preghiera delle radici
          testo: |
            Cominci la preghiera delle radici a voce alta, e Koln ti viene
            dietro di mezza parola. Dopo il primo verso le donne la dicono con
            voi, e i carbonai tolgono le mani di tasca. Alla fine Darrin ti
            dice che le radici vanno guardate dove vanno a finire, e che la
            strada la sa Delek.
          pe: { empatia: 3 }
          effetti: { fazione.pannion: 1, rep.pannion: 0.5 }

  # ------------------------------------------------------------ 7 → 8 · il carbonaio di sotto
  - id: pannion-il-carbonaio-di-sotto
    presso: pannion
    immagine: icone/coal-pile
    titolo: Il carbonaio di sotto
    sommario: "Le carbonaie più basse di Pannion sono di Delek, che ci lavora da solo. La strada per la vecchia Pannion la sa soltanto lui."
    luogo: Pannion, le carbonaie basse
    area: superficie-fratturata
    requisiti: [fazione.pannion == 7]
    testo: |
      Le carbonaie di Delek sono le più basse di Pannion, dove il fianco
      dell'altura smette di essere rosso e comincia a scendere verso la
      valle fra le sequoie grandi. Nessun altro ci vuole lavorare, e lui ci
      lavora da solo da qualche anno. Ha una trentina d'anni, la barba nera
      di fuliggine fino agli zigomi e le mani piene di calli, e quando ti
      vede arrivare continua a battere le zolle con il dorso della pala.

      Darrin ti ha mandato da lui con una frase sola, che la strada per la
      vecchia Pannion la sa Delek. La sa perché scende a tagliare la legna
      dove gli altri non vanno, e la legna della valle brucia più lenta.

      {conoscenze-della-strada Media} Il carbone di Delek è migliore di
      quello degli altri, e lui lo vende a meno. Un uomo così ha fretta di
      vendere, oppure vuole che nessuno gli faccia domande.

      «Laggiù non si va» dice, senza voltarsi.

      {empatia Media} Quando nomini Qir-Azel, Delek guarda la strada della
      città e poi torna alla carbonaia in fretta, come si toglie la mano da
      una pentola che scotta.

      *Uno che vive sull'orlo del bosco e non ci vuole scendere.* Sotto il
      bordo dell'altura il pendio scende ripido verso un buio verde, dove il
      fumo delle carbonaie non arriva.
    opzioni:
      - testo: "Aiutarlo a coprire la carbonaia"
        descrizione: "Le zolle si battono in due più in fretta che da soli. Un carbonaio parla meglio con le mani occupate."
        prova: { attributo: fisico, abilita: [resistenza, atletica], difficolta: Media }
        successo:
          titolo: Le zolle battute
          testo: |
            Battete le zolle fino a sera, e a un certo punto Delek comincia a
            dirti dove mettere la pala prima che tu la metta. Quando la
            carbonaia è chiusa ti porta fino al crinale, dove finiscono le sue
            tracce. Da lì si vedono i tetti della vecchia Pannion fra le
            sequoie grandi, i fiumi di vetro e in mezzo un cerchio di pietra
            chiara. Ti dice che con la luna piena scende con te.
          pe: { resistenza: 3 }
          imposta: { pannion.delek: 1 }
          effetti: { fazione.pannion: 1, rep.pannion: 0.5 }
        fallimento:
          titolo: La zolla rotta
          testo: |
            Batti una zolla troppo forte, e si apre una crepa da cui esce fumo
            bianco. Delek la chiude imprecando e ti manda via. La mattina dopo
            però ti aspetta al crinale, perché Darrin gliel'ha chiesto, e ti
            mostra i tetti della vecchia Pannion fra le sequoie grandi. Con la
            luna piena, dice, scende con te.
          imposta: { pannion.delek: 1 }
          effetti: { fazione.pannion: 1, tormento: 0.5 }
      - testo: "Dirgli che Darrin ha bisogno di lui"
        descrizione: "Delek deve a Darrin il posto alle carbonaie. Un debito così si ricorda volentieri, se qualcuno lo ricorda per bene."
        prova: { attributo: sociale, abilita: [persuasione, empatia], difficolta: Media }
        successo:
          titolo: Il debito con Darrin
          testo: |
            Gli dici che Darrin ti ha mandato da lui perché si fida, e Delek
            posa la pala. Ti porta fino al crinale e ti mostra la vecchia
            Pannion fra le sequoie grandi, con i fiumi di vetro e un cerchio di
            pietra chiara in mezzo ai tetti. Con la luna piena, dice, scende
            con te.
          pe: { empatia: 3 }
          imposta: { pannion.delek: 1 }
          effetti: { fazione.pannion: 1, rep.pannion: 0.5 }
        fallimento:
          titolo: Da solo
          testo: |
            Delek ti ascolta e poi ti volta le spalle. Al crinale ci arrivi da
            solo, seguendo le sue tracce sulla terra rossa, e da lì vedi i
            tetti della vecchia Pannion fra le sequoie grandi. La strada per
            scendere dovrai trovarla tu.
          effetti: { fazione.pannion: 1, tormento: 0.5 }
      - testo: "Pagarlo per la guida"
        descrizione: "Un carbonaio che vende a meno degli altri ha bisogno di monete. Una guida si paga."
        requisiti: [monete >= 15]
        esito:
          titolo: La paga della guida
          testo: |
            Conti le monete sul coperchio della carbonaia, e Delek le guarda
            senza toccarle. Poi le prende tutte insieme e ti porta al crinale,
            da dove si vedono i tetti della vecchia Pannion fra le sequoie
            grandi. Con la luna piena, dice, scende con te.
          imposta: { pannion.delek: 1 }
          effetti: { fazione.pannion: 1, monete: -15 }
      - testo: "Trovare la strada da solo, seguendo le radici del Vecchio"
        descrizione: "La radice grossa del Vecchio scende verso la valle dritta come una corda. Dove va lei, va la strada."
        costo: 2
        esito:
          titolo: La radice come corda
          testo: |
            Segui la radice nera del Vecchio giù per il pendio, tenendoti ai
            tronchi, finché arrivi a un crinale da cui si vedono i tetti della
            vecchia Pannion fra le sequoie grandi. Quando risali hai la terra
            rossa fino alle ginocchia, e Delek, dalla sua carbonaia, ti guarda
            passare senza dire niente.
          effetti: { fazione.pannion: 1, tormento: 0.5 }
      - testo: "Chiedergli di una ragazza dai capelli d'argento"
        descrizione: "Nel diario di Aurenne c'è un carbonaio di Pannion che si chiamava Delek, e che una sera d'estate è ripartito per Pannion senza di lei."
        quando: [oggetto.diario-di-aurenne >= 1]
        esito:
          titolo: La pagina del quaderno
          testo: |
            Delek smette di battere le zolle. Ti chiede se è viva, e lo chiede
            alla carbonaia, senza guardarti. Gli dici quello che sai, e lui
            resta a lungo con le mani nere sul manico della pala. Poi dice che
            a Qir-Azel è stato un vigliacco una volta sola, e che la strada per
            la valle almeno la sa. Ti porta al crinale e ti mostra i tetti
            della vecchia Pannion. Con la luna piena, dice, scende con te.

            {empatia Media} Non ti chiede di lei nient'altro. Ha paura delle
            risposte, e se ne vergogna davanti a te.
          imposta: { pannion.delek: 1 }
          effetti: { fazione.pannion: 1, rep.pannion: 0.5 }

  # ------------------------------------------------------------ 8 → 9 · quelli che scendono di notte (grado 3)
  - id: pannion-quelli-che-scendono-di-notte
    presso: pannion
    immagine: fazioni/scuri
    titolo: Quelli che scendono di notte
    sommario: "Gaspare Tenca è sceso nella valle con la sua banda e con i picconi. In città gli hanno detto che le case della vecchia Pannion sono rimaste piene."
    luogo: La prima casa della vecchia Pannion, di notte
    area: superficie-fratturata
    requisiti: [fazione.pannion == 8]
    testo: |
      Ti sveglia Ansgar nel cuore della notte, con la scottatura che
      sanguina a forza di grattarla. Gaspare Tenca è sceso nella valle con
      sei della sua banda e un carico di picconi. In città qualcuno gli ha
      detto che sotto il vetro della vecchia Pannion c'è roba dei
      Precursori, e che le case sono rimaste piene. Darrin è già sul crinale
      di Delek con una lanterna, e quando arrivi ti dice una cosa sola, che i
      morti stanno nelle case.

      Li trovi alla prima casa del vecchio villaggio, dove il pendio si fa
      piano. La linfa indurita ha chiuso la porta come una lastra di vetro
      scuro, e due uomini la stanno spaccando a colpi di piccone. Tenca li
      guarda lavorare con il ronco da potatura sulla spalla e la barba
      rossa accesa dalla lanterna. Quando ti vede si mette fra te e la porta.

      {intimidire Media} I suoi uomini tengono gli occhi su di lui. Se lui va
      giù, i picconi tornano su per la collina da soli.

      {armi-da-mischia Media} Il manico del ronco è più lungo del tuo braccio.
      Ti terrà lontano e aspetterà che ti stanchi.

      *Una porta chiusa da prima che tu nascessi, e lui la apre a picconate.* Dietro
      la lastra scura, alla luce della lanterna, si vede un tavolo con le
      scodelle ancora sopra.

      {origine figlio-della-citta-bassa} Nelle bande dei vicoli il capo si
      mette sempre fra te e la merce. Tenca lo fa senza pensarci, e vuol dire
      che la merce la considera già sua.
    opzioni:
      - testo: "Affrontare Gaspare Tenca"
        descrizione: "Il ronco ha il manico lungo, e Tenca sa aspettare. Se cade lui, la banda se ne va."
        combattimento: pannion-tenca
        vittoria:
          titolo: Il ronco nell'erba
          testo: |
            Tenca si batte bene, e alla fine il ronco gli vola di mano
            nell'erba e lui resta in ginocchio davanti alla porta. I suoi sono
            già a metà del pendio. Darrin arriva con la lanterna e
            gli dice di lasciare l'altura entro sera, senza alzare la voce. All'alba, in piazza, ti
            mette sulle spalle una giubba di cuoio bollito nella resina, dura
            come una tavola, e ti chiama «Fumo di Pannion», il nome che danno ai
            loro.
          pe: { armi-da-mischia: 5 }
          almeno: { rep.pannion: 6 }
          imposta: { pannion.tenca: 2 }
          effetti: { fazione.pannion: 1, monete: 80, oggetto.pannion-giubba-di-resina: 1 }
        sconfitta:
          titolo: Il manico lungo
          testo: |
            Il ronco ti aggancia la caviglia, e finisci a terra con la faccia
            contro il vetro della porta. Darrin arriva con le lanterne di mezza
            squadra, e la banda risale senza aver aperto la casa. Tenca,
            passandoti accanto, ti dice che tornerà la prima notte che Darrin
            dorme.
          effetti: { scandalo: 0.5 }
      - testo: "Fermare i picconi prima che rompano il vetro"
        descrizione: "I due ai picconi sono di Pannion, e hanno nonni sepolti in queste case. Bisogna ricordarglielo con una voce che non si discute."
        prova: { attributo: sociale, abilita: [intimidire, persuasione], difficolta: Difficile }
        successo:
          titolo: I picconi giù
          testo: |
            Chiedi a voce alta ai due chi sono i loro nonni, e li chiami per
            nome uno dopo l'altro come fa Liduina quando accende le lanterne. I picconi si
            fermano. Tenca resta solo con il ronco in mano e lo abbassa. All'alba Darrin
            lo lascia restare, a patto che la banda risponda a lui, e in piazza
            ti mette sulle spalle una giubba di cuoio bollito nella resina e ti
            chiama «Fumo di Pannion», il nome che danno ai loro.
          pe: { intimidire: 5 }
          almeno: { rep.pannion: 6 }
          imposta: { pannion.tenca: 1 }
          effetti: { fazione.pannion: 1, monete: 80, oggetto.pannion-giubba-di-resina: 1 }
        fallimento:
          titolo: Il vetro incrinato
          testo: |
            Alzi la voce, e i due ridono e continuano. Il vetro della porta si
            incrina dall'alto in basso con un suono da campana rotta, e dentro
            la casa qualcosa si sposta. Arriva Darrin con le lanterne, e la
            banda risale. La porta resta incrinata, e la notte dopo Tenca ci
            riprova.
          effetti: { tormento: 1, scandalo: 0.5 }
      - testo: "Mostrargli che cosa c'è dietro il vetro"
        descrizione: "Tenca crede che dietro la porta ci sia roba da vendere. Alla luce giusta il vetro di linfa si fa trasparente."
        prova: { attributo: mentale, abilita: [percezione, accademiche], difficolta: Difficile }
        successo:
          titolo: Le scodelle sul tavolo
          testo: |
            Accosti la lanterna al vetro nel punto dove la linfa è più sottile,
            e la cucina si vede tutta. Le scodelle sul tavolo, una culla
            accanto alla stufa e nessun metallo dei Precursori. I due ai
            picconi smettono di colpire. Tenca guarda a lungo la culla e
            abbassa il ronco. All'alba Darrin lo lascia restare, a patto che la
            banda risponda a lui, e in piazza ti mette sulle spalle una giubba
            di cuoio bollito nella resina e ti chiama «Fumo di Pannion».
          pe: { percezione: 5 }
          almeno: { rep.pannion: 6 }
          imposta: { pannion.tenca: 1 }
          effetti: { fazione.pannion: 1, monete: 80, oggetto.pannion-giubba-di-resina: 1 }
        fallimento:
          titolo: Il riflesso
          testo: |
            Accosti la lanterna al vetro, e dentro la casa qualcosa si muove
            insieme alla luce. Fai un salto indietro, e i due ai picconi ridono
            di te. È soltanto il tuo riflesso, lo capisci dopo. Quando arriva Darrin
            con le lanterne la banda risale, e la notte dopo Tenca ci riprova.
          effetti: { tormento: 1 }
      - testo: "Mettere la lanterna fra lui e la porta"
        descrizione: "A Pannion nessuno alza la mano su chi porta una lanterna da pontile. Bisogna tenerla ferma mentre il ronco si alza."
        requisiti: [chiave.lanterna >= 1]
        prova: { attributo: mentale, abilita: [resilienza, natura], difficolta: Difficile }
        successo:
          titolo: La lanterna ferma
          testo: |
            Alzi la lanterna da pontile fra Tenca e la porta, e la tieni ferma.
            Il ronco si alza, si ferma a un dito dal vetro velato di resina e
            resta lì, mentre i due ai picconi guardano il loro capo. Tenca lo
            abbassa e sputa nell'erba. All'alba Darrin lo lascia restare, a
            patto che la banda risponda a lui, e in piazza ti mette sulle
            spalle una giubba di cuoio bollito nella resina e ti chiama «Fumo
            di Pannion».
          pe: { resilienza: 5 }
          almeno: { rep.pannion: 6 }
          imposta: { pannion.tenca: 1 }
          effetti: { fazione.pannion: 1, monete: 80, oggetto.pannion-giubba-di-resina: 1 }
        fallimento:
          titolo: La mano che trema
          testo: |
            Il ronco si alza, e la lanterna ti trema in mano fino a sbattere
            contro il vetro della porta. Tenca la scosta con il manico e ti
            colpisce al braccio. Arriva Darrin con le lanterne, e la banda
            risale, ma la notte dopo Tenca ci riprova.
          effetti: { ferite: 1, scandalo: 0.5 }
      - testo: "Dirgli chi tiene i conti a Qir-Azel"
        descrizione: "Il tavolo d'angolo degli Scuri adesso è tuo, e le bande dei villaggi lo sanno. Bisogna farglielo ricordare qui, al buio."
        quando: [scuri.finale == 1]
        prova: { attributo: sociale, abilita: [intimidire, politica-ed-economia], difficolta: Difficile }
        successo:
          titolo: Il tavolo d'angolo
          testo: |
            Gli dici chi siede al tavolo d'angolo, e che una banda dei villaggi
            che scava nelle case dei morti per conto suo al tavolo non ci si
            siede più. Tenca ci pensa, poi richiama i suoi. All'alba Darrin lo
            lascia restare, a patto che la banda risponda a lui, e in piazza ti
            mette sulle spalle una giubba di cuoio bollito nella resina e ti
            chiama «Fumo di Pannion».
          pe: { intimidire: 5 }
          almeno: { rep.pannion: 6 }
          imposta: { pannion.tenca: 1 }
          effetti: { fazione.pannion: 1, monete: 80, oggetto.pannion-giubba-di-resina: 1, rep.scuri: 0.5 }
        fallimento:
          titolo: Il tavolo lontano
          testo: |
            Tenca ti ascolta e ti risponde che il tavolo d'angolo sta a due
            giorni di strada, mentre la porta sta qui. Arriva Darrin con le
            lanterne, e la banda risale. La notte dopo Tenca torna giù a riprovarci.
          effetti: { scandalo: 1 }
      - testo: "Ricordargli dove è finito il registro degli Scuri"
        descrizione: "Il registro degli Scuri l'hai portato tu allo sceriffo, e le bande dei villaggi lo sanno. Uno che ha fatto cadere il tavolo d'angolo fa paura anche a Pannion."
        quando: [scuri.finale == 3]
        prova: { attributo: sociale, abilita: [intimidire, conoscenze-della-strada], difficolta: Difficile }
        successo:
          titolo: Il registro
          testo: |
            Gli dici chi ha portato il registro degli Scuri allo sceriffo, e che
            in quel registro c'era posto anche per le bande dei villaggi. Tenca
            ti guarda a lungo da sopra la barba rossa, e poi richiama i suoi.
            All'alba Darrin lo lascia restare, a patto che la banda risponda a
            lui, e in piazza ti mette sulle spalle una giubba di cuoio bollito
            nella resina e ti chiama «Fumo di Pannion».
          pe: { intimidire: 5 }
          almeno: { rep.pannion: 6 }
          imposta: { pannion.tenca: 1 }
          effetti: { fazione.pannion: 1, monete: 80, oggetto.pannion-giubba-di-resina: 1 }
        fallimento:
          titolo: Lo sceriffo lontano
          testo: |
            Tenca ride e ti risponde che lo sceriffo, a Pannion, non ci è mai
            salito. Arriva Darrin con le lanterne, e la banda risale. La notte
            dopo Tenca torna giù a riprovarci, e stavolta porta un uomo in più.
          effetti: { scandalo: 1 }
      - testo: "Parlargli come si parla fra capi di banda"
        descrizione: "Nei vicoli un capo che si mette fra te e la merce si convince soltanto con un prezzo migliore della merce."
        quando: [origine.figlio-della-citta-bassa >= 1]
        prova: { attributo: sociale, abilita: [conoscenze-della-strada, persuasione], difficolta: Difficile }
        successo:
          titolo: Il prezzo della merce
          testo: |
            Gli parli come si parla nei vicoli, e gli fai il conto di quanto
            vale la merce di una casa di morti a Qir-Azel, compresi i
            compratori che la rivendono agli Scuri e lo sceriffo che lo viene a
            sapere. Il conto non gli piace. Tenca richiama i suoi. All'alba
            Darrin lo lascia restare, a patto che la banda risponda a lui, e in
            piazza ti mette sulle spalle una giubba di cuoio bollito nella
            resina e ti chiama «Fumo di Pannion».
          pe: { conoscenze-della-strada: 5 }
          almeno: { rep.pannion: 6 }
          imposta: { pannion.tenca: 1 }
          effetti: { fazione.pannion: 1, monete: 80, oggetto.pannion-giubba-di-resina: 1 }
        fallimento:
          titolo: Il conto sbagliato
          testo: |
            Gli fai il conto, e Tenca lo rifà meglio di te, a voce alta,
            davanti ai suoi. Arriva Darrin con le lanterne e la banda risale.
            La notte dopo Tenca ci riprova, con due uomini in più.
          effetti: { scandalo: 1 }

  # ------------------------------------------------------------ 9 → 10 · l'anno della linfa
  - id: pannion-l-anno-della-linfa
    presso: pannion
    immagine: icone/paper-lantern
    titolo: L'anno della linfa
    sommario: "Prima di scendere nella vecchia Pannion Darrin ti porta da Liduina Brace, che quando il villaggio è salito sull'altura aveva otto anni."
    luogo: Pannion, la casa di Liduina in fondo al pontile
    area: superficie-fratturata
    requisiti: [fazione.pannion == 9]
    testo: |
      La casa di Liduina Brace sta in fondo al pontile più lungo, una stanza
      sola con la stufa e un letto stretto, e alle pareti sono appese
      lanterne vecchie, una per ogni famiglia che è salita. Darrin si siede
      sullo sgabello vicino alla porta con il cappello sulle ginocchia. Ti ha
      portato qui perché prima di scendere tu sappia, e lo dice così.

      Liduina aveva otto anni. Una notte d'estate la terra tremò a lungo
      sotto le case, e i cani lo sentirono prima delle persone. La
      mattina dopo le sequoie della valle cominciarono a piangere linfa. La piansero
      per una stagione intera. La linfa scese per le strade della vecchia
      Pannion come acqua lenta. Riempì le porte e le finestre basse, e indurì
      in fiumi di vetro rosso. Chi dormiva al piano terra restò dove
      dormiva. Gli altri salirono di notte sull'altura con tutte le lanterne
      accese, fino al Vecchio, che stava già lassù da solo e dove la linfa
      non arrivava. Il nonno di Darrin portava la prima lanterna.

      {empatia Media} Liduina racconta guardando la stufa. Quando arriva a
      chi è rimasto nelle case, le dita le si fermano sul bastone.

      {accademiche Media} Il primo accordo per il legname la città l'ha
      firmato quando Pannion stava sull'altura già da una generazione.

      La Conca degli specchi, dice Liduina, la linfa non la toccò mai. Ci girò
      intorno, e continuò a scendere.

      {origine allievo-di-torvessa} Nel registro delle rovine dell'Accademia
      la Conca degli specchi ha una riga sola, che la dice censita e mai esplorata. Chi
      l'ha scritta non sapeva che ci viveva intorno un villaggio.
    opzioni:
      - testo: "Ascoltarla fino in fondo"
        descrizione: "Liduina non racconta questa storia da molto tempo. Va lasciata arrivare dove vuole, senza fretta."
        prova: { attributo: sociale, abilita: [empatia, galateo], difficolta: Media }
        successo:
          titolo: I nomi di chi è rimasto
          testo: |
            La lasci parlare finché le parole finiscono da sole, e alla fine ti
            dice i nomi di chi è rimasto nelle case, uno per lanterna. Poi ti
            spiega la strada vecchia, dai pali delle lanterne fino alla piazza.
            Fra tre notti c'è la luna piena. Darrin si alza e ti dice che si
            scende allora, e che lui resta con il Vecchio.
          pe: { empatia: 3 }
          effetti: { fazione.pannion: 1, rep.pannion: 0.5 }
        fallimento:
          titolo: Troppo presto
          testo: |
            Le chiedi di chi è rimasto nelle case troppo presto, e Liduina
            smette di parlare. Il resto lo dice Darrin in poche parole, e la
            strada vecchia te la disegna lui sul tavolo con il dito. Fra tre
            notti c'è la luna piena, e si scende allora.
          effetti: { fazione.pannion: 1, scandalo: 0.5 }
      - testo: "Disegnare con lei la pianta della vecchia Pannion"
        descrizione: "Liduina ricorda le strade come le ha camminate a otto anni. Con un pezzo di carbone e la tavola si possono rimettere in fila."
        prova: { attributo: mentale, abilita: [accademiche, percezione], difficolta: Media }
        successo:
          titolo: La pianta a carbone
          testo: |
            Disegni sulla tavola con un pezzo di carbone, e Liduina ti
            corregge le strade una per una, dal forno fino alla piazza con la
            Conca nel mezzo. Quando hai finito la guarda a lungo. Fra tre
            notti c'è la luna piena, e Darrin ti dice che si scende allora e
            che lui resta con il Vecchio.
          pe: { accademiche: 3 }
          effetti: { fazione.pannion: 1, rep.pannion: 0.5 }
        fallimento:
          titolo: Le strade storte
          testo: |
            Le strade che disegni non tornano, e Liduina si confonde con te.
            Alla fine piange un poco senza fare rumore, e Darrin cancella la tavola
            con la manica. Fra tre notti c'è la luna piena, e si scende allora.
          effetti: { fazione.pannion: 1, tormento: 0.5 }
      - testo: "Aprire con la squadra il primo tratto della discesa"
        descrizione: "Dal crinale di Delek al primo fiume di vetro il pendio è pieno di rovi. Con la squadra di Darrin si apre in un giorno."
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Media }
        successo:
          titolo: Il sentiero aperto
          testo: |
            Passi il giorno sul pendio con la squadra di Darrin. Tagliate i
            rovi e piantate i paletti per le corde fino al primo fiume di
            vetro. La sera, in piazza, Liduina ti dice che la strada è quella
            giusta. Fra tre notti c'è la luna piena, e Darrin ti dice che si
            scende allora e che lui resta con il Vecchio.
          pe: { atletica: 3 }
          effetti: { fazione.pannion: 1, rep.pannion: 0.5 }
        fallimento:
          titolo: I rovi
          testo: |
            I rovi del pendio ti aprono le braccia e le guance, e a metà
            giornata un paletto ti scivola giù fino al fiume di vetro. La sera
            la squadra ti guarda le mani fasciate e non dice niente. Fra tre
            notti c'è la luna piena, e si scende allora.
          effetti: { fazione.pannion: 1, ferite: 0.5, tormento: 0.5 }
      - testo: "Restare con Liduina fino all'alba"
        descrizione: "Dopo una storia così una vecchia non deve restare sola. La notte si passa accanto alla stufa."
        costo: 2
        esito:
          titolo: La stufa
          testo: |
            Darrin se ne va, e tu resti accanto alla stufa fino all'alba.
            Liduina dorme poco e parla nel sonno, e una volta dice il nome di
            sua madre. La mattina ti dà una delle lanterne appese al muro e ti
            dice di riportarla giù. Fra tre notti c'è la luna piena, e si
            scende allora.
          pe: { resilienza: 3 }
          effetti: { fazione.pannion: 1, rep.pannion: 0.5 }
