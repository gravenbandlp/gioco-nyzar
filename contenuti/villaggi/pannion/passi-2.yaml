# La quest di Pannion, Atto III e il passo 10 (fazione.pannion 6 → 10).
# - 6 → 7 `pannion-un-dito-in-una-notte` (Pannion): il segno della Campana. Il Vecchio cresce di un dito in una notte,
#   l'anello della lanterna della piazza scoppia, e nessuno sa perché. La scena non lo spiega.
# - 7 → 8 `pannion-il-carbonaio-di-sotto` (Pannion): Delek, l'unico che conosce la strada per la vecchia Pannion
#   (pannion.delek 1 se fa da guida). Con il diario di Aurenne si può chiedergli della ragazza dai capelli d'argento.
# - 8 → 9 `pannion-quelli-che-scendono-di-notte` (la prima casa della vecchia Pannion, grado 3, boss): Gaspare Tenca e
#   la banda spaccano il vetro di linfa di una casa. Combattimento o vie Difficili; chi fallisce non chiude il passo.
#   pannion.tenca 1 se resta a Pannion e risponde a Darrin, 2 se Darrin lo caccia. Varianti: la lanterna da pontile
#   (chiave.lanterna), il Figlio della Città Bassa, scuri.finale == 1.
# - 9 → 10 `pannion-l-anno-della-linfa` (Pannion): Liduina Brace racconta perché il villaggio si è spostato.
storylet:
  # ------------------------------------------------------------ 6 → 7 · un dito in una notte
  - id: pannion-un-dito-in-una-notte
    presso: pannion
    immagine: icone/tree-growth
    titolo: Un dito in una notte
    sommario: "Stamattina la tacca che Darrin ha inciso sul Vecchio è più alta di un dito, e Pannion è tutta in piazza."
    luogo: Pannion, la piazza del Vecchio, all'alba
    area: superficie-fratturata
    requisiti: [fazione.pannion == 6]
    testo: |
      La mattina Pannion è tutta in piazza, e nessuno lavora. Intorno al
      Vecchio i carbonai stanno in cerchio con le mani nere in tasca, e Frate
      Koln suda nel saio a un passo dal tronco.

      La tacca che Darrin ha inciso sul tronco il giorno in cui è diventato
      caposquadra ieri sera stava un palmo sopra la sua testa, e stamattina
      sta più su di un dito, con la corteccia aperta intorno in una crepa
      chiara che odora di linfa. L'anello di ferro della lanterna della
      piazza è scoppiato ed è caduto nell'erba.

      Darrin tiene il palmo aperto sulla corteccia. «Vecchio» dice, e dopo il
      nome aspetta, tanto che qualcuno nel cerchio comincia a parlare di
      caricare i carri e andarsene.

      {origine accolito-del-velo} In Cattedrale insegnano che le radici del
      Grande Albero Rosso corrono sotto tutta la Superficie, e adesso ti
      torna in mente senza consolarti.
    opzioni:
      - testo: "Misurare il Vecchio con Darrin"
        descrizione: "Con la corda a nodi della segheria si vede di quanto è cresciuto davvero."
        prova: { attributo: mentale, abilita: [percezione, accademiche], difficolta: Media }
        successo:
          titolo: La tacca nuova
          testo: |
            Misuri il Vecchio con la corda a nodi dalla radice alla tacca nuova e
            poi alla vecchia, e dici ad alta voce che è un dito esatto. La piazza
            si calma un poco. Darrin incide la data accanto alla tacca, poi ti
            manda a guardare dove finiscono le radici, da Delek, che sa la strada.
          pe: { percezione: 3 }
          effetti: { fazione.pannion: 1, rep.pannion: 0.5 }
        fallimento:
          titolo: La corda che scivola
          testo: |
            La corda ti scivola fra le dita, e il numero che dici fa gridare una
            donna. Darrin rimisura in silenzio, poi ti manda a guardare dove
            finiscono le radici, da Delek, che sa la strada.
          effetti: { fazione.pannion: 1, scandalo: 0.5 }
      - testo: "Parlare alla piazza"
        descrizione: "Bisogna dire alla piazza qualcosa di vero che la tenga ferma."
        prova: { attributo: sociale, abilita: [persuasione, empatia], difficolta: Media }
        successo:
          titolo: I carri scaricati
          testo: |
            Dalla panca della mensa dici alla piazza che il Vecchio cresceva anche
            quando loro erano bambini, e che stanotte ha avuto fretta, e due
            famiglie scaricano il carro. Darrin ti manda a guardare dove finiscono
            le radici, da Delek, che sa la strada.
          pe: { persuasione: 3 }
          effetti: { fazione.pannion: 1, rep.pannion: 0.5 }
        fallimento:
          titolo: L'ultimo carro
          testo: |
            Una donna chiede che cosa ne può sapere uno arrivato con l'ultimo
            carro, e mezza piazza va a fare i fagotti. Darrin ti manda a guardare
            dove finiscono le radici, da Delek, che sa la strada.
          effetti: { fazione.pannion: 1, scandalo: 0.5 }
      - testo: "Salire sul Vecchio a guardare dall'alto"
        descrizione: "La corteccia ha sporgenze come gradini fino ai primi rami spezzati."
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Media }
        successo:
          titolo: Dai rami spezzati
          testo: |
            Dai primi rami spezzati vedi la valle, i fiumi di linfa che luccicano
            e, fra le sequoie grandi, tetti senza fumo intorno a un cerchio di
            pietra chiara. Darrin ti manda a guardare dove finiscono le radici, da
            Delek, che sa la strada.
          pe: { acrobazia: 3 }
          effetti: { fazione.pannion: 1, rep.pannion: 0.5 }
        fallimento:
          titolo: La corteccia
          testo: |
            La corteccia si sfalda e scivoli giù graffiandoti le braccia fra le
            risate dei bambini. Darrin ti manda a guardare dove finiscono le
            radici, da Delek, che sa la strada.
          effetti: { fazione.pannion: 1, ferite: 0.5, scandalo: 0.5 }
      - testo: "Reggere il turibolo alla funzione di Koln"
        descrizione: "Una funzione lunga tiene la piazza ferma più di qualunque discorso."
        costo: 2
        esito:
          titolo: La funzione
          testo: |
            Koln canta male e a lungo, e quando posi il turibolo la piazza è
            troppo stanca per avere paura. Darrin ti manda a guardare dove
            finiscono le radici, da Delek, che sa la strada.
          effetti: { fazione.pannion: 1, rep.pannion: 0.5 }
      - testo: "Dire con Koln la preghiera delle radici"
        descrizione: "In Cattedrale c'è una preghiera per quando l'Albero dà un segno, e la piazza la conosce."
        quando: [origine.accolito-del-velo >= 1]
        esito:
          titolo: La preghiera delle radici
          testo: |
            Dopo il primo verso la preghiera delle radici la dice tutta la piazza,
            con Koln che ti viene dietro. Alla fine Darrin ti manda a guardare
            dove finiscono le radici, da Delek, che sa la strada.
          pe: { empatia: 3 }
          effetti: { fazione.pannion: 1, rep.pannion: 0.5 }

  # ------------------------------------------------------------ 7 → 8 · il carbonaio di sotto
  - id: pannion-il-carbonaio-di-sotto
    presso: pannion
    immagine: icone/coal-pile
    titolo: Il carbonaio di sotto
    sommario: "Le carbonaie più basse di Pannion sono di Delek, l'unico che sa la strada per la vecchia Pannion."
    luogo: Pannion, le carbonaie basse
    area: superficie-fratturata
    requisiti: [fazione.pannion == 7]
    testo: |
      Le carbonaie di Delek sono le più basse di Pannion, dove il fianco
      dell'altura scende verso la valle fra le sequoie grandi, e ci lavora
      da solo perché nessun altro le vuole. Ha la barba nera di fuliggine
      fino agli zigomi, e quando arrivi continua a battere le zolle con il
      dorso della pala. La strada per la vecchia Pannion la sa perché scende
      a tagliare la legna dove gli altri non vanno.

      {empatia Media} Quando nomini Qir-Azel, Delek torna alla carbonaia in
      fretta, come si toglie la mano da una pentola che scotta.

      «Laggiù non si va» dice, senza voltarsi.
    opzioni:
      - testo: "Aiutarlo a coprire la carbonaia"
        descrizione: "Un carbonaio parla meglio con le mani occupate."
        prova: { attributo: fisico, abilita: [resistenza, atletica], difficolta: Media }
        successo:
          titolo: Le zolle battute
          testo: |
            Battete le zolle fino a sera, e quando la carbonaia è chiusa Delek ti
            porta al crinale. Da lì si vedono i tetti della vecchia Pannion fra le
            sequoie grandi, i fiumi di vetro e un cerchio di pietra chiara. Con la
            luna piena, dice, scende con te.
          pe: { resistenza: 3 }
          imposta: { pannion.delek: 1 }
          effetti: { fazione.pannion: 1, rep.pannion: 0.5 }
        fallimento:
          titolo: La zolla rotta
          testo: |
            Da una zolla battuta male esce fumo bianco, e Delek ti manda via
            imprecando. La mattina dopo però, perché Darrin gliel'ha chiesto, ti
            mostra dal crinale i tetti della vecchia Pannion. Con la luna piena,
            dice, scende con te.
          imposta: { pannion.delek: 1 }
          effetti: { fazione.pannion: 1, tormento: 0.5 }
      - testo: "Dirgli che Darrin ha bisogno di lui"
        descrizione: "Delek deve a Darrin il posto alle carbonaie."
        prova: { attributo: sociale, abilita: [persuasione, empatia], difficolta: Media }
        successo:
          titolo: Il debito con Darrin
          testo: |
            Gli dici che Darrin si fida di lui, e Delek posa la pala. Dal crinale
            ti mostra la vecchia Pannion fra le sequoie grandi, con i fiumi di
            vetro e un cerchio di pietra chiara. Con la luna piena, dice, scende
            con te.
          pe: { empatia: 3 }
          imposta: { pannion.delek: 1 }
          effetti: { fazione.pannion: 1, rep.pannion: 0.5 }
        fallimento:
          titolo: Da solo
          testo: |
            Delek ti volta le spalle. Al crinale arrivi da solo seguendo le sue
            tracce e vedi i tetti della vecchia Pannion, ma la strada per scendere
            dovrai trovarla tu.
          effetti: { fazione.pannion: 1, tormento: 0.5 }
      - testo: "Pagarlo per la guida"
        descrizione: "Un carbonaio che vende a meno degli altri ha bisogno di monete."
        requisiti: [monete >= 15]
        esito:
          titolo: La paga della guida
          testo: |
            Delek prende le monete tutte insieme e ti porta al crinale, da dove si
            vedono i tetti della vecchia Pannion. Con la luna piena, dice, scende
            con te.
          imposta: { pannion.delek: 1 }
          effetti: { fazione.pannion: 1, monete: -15 }
      - testo: "Trovare la strada da solo, seguendo le radici del Vecchio"
        descrizione: "La radice grossa del Vecchio scende verso la valle dritta come una corda."
        costo: 2
        esito:
          titolo: La radice come corda
          testo: |
            Segui la radice nera del Vecchio fino a un crinale da cui si vedono i
            tetti della vecchia Pannion, e risali con la terra rossa fino alle
            ginocchia, sotto gli occhi di Delek.
          effetti: { fazione.pannion: 1, tormento: 0.5 }
      - testo: "Chiedergli di una ragazza dai capelli d'argento"
        descrizione: "Nel diario di Aurenne c'è un carbonaio di Pannion di nome Delek, ripartito una sera d'estate senza di lei."
        quando: [oggetto.diario-di-aurenne >= 1]
        esito:
          titolo: La pagina del quaderno
          testo: |
            Senza guardarti Delek chiede alla carbonaia se è viva, e ascolta
            quello che sai. Poi dice che a Qir-Azel è stato un vigliacco una volta
            sola, e che la strada per la valle almeno la sa. Dal crinale ti mostra
            i tetti della vecchia Pannion, e con la luna piena scenderà con te.

            {empatia Media} Di lei non ti chiede altro, perché ha paura delle
            risposte.
          imposta: { pannion.delek: 1 }
          effetti: { fazione.pannion: 1, rep.pannion: 0.5 }

  # ------------------------------------------------------------ 8 → 9 · quelli che scendono di notte (grado 3)
  - id: pannion-quelli-che-scendono-di-notte
    presso: pannion
    immagine: fazioni/scuri
    titolo: Quelli che scendono di notte
    sommario: "Gaspare Tenca è sceso nella valle con la sua banda e con i picconi, a svuotare le case della vecchia Pannion."
    luogo: La prima casa della vecchia Pannion, di notte
    area: superficie-fratturata
    requisiti: [fazione.pannion == 8]
    testo: |
      Ti sveglia Ansgar nel cuore della notte. Gaspare Tenca è sceso nella valle con
      sei della sua banda e i picconi, perché in città gli hanno detto che le case
      della vecchia Pannion sono rimaste piene. Darrin è già sul crinale di Delek
      con una lanterna, e ti dice soltanto che i morti stanno nelle case.

      Li trovi alla prima casa del vecchio villaggio. La linfa indurita ha chiuso la
      porta come una lastra di vetro scuro, e due uomini la stanno spaccando a colpi
      di piccone. Tenca li guarda con il ronco da potatura sulla spalla e la barba
      rossa accesa dalla lanterna, e quando ti vede si mette fra te e la porta.

      {intimidire Media} I suoi uomini tengono gli occhi su di lui. Se lui va giù, i
      picconi tornano su per la collina da soli.

      {armi-da-mischia Media} Il manico del ronco è più lungo del tuo braccio. Ti
      terrà lontano e aspetterà che ti stanchi.

      Dietro la lastra scura, alla luce della lanterna, si vede un tavolo con le
      scodelle ancora sopra.

      {origine figlio-della-citta-bassa} Nelle bande dei vicoli il capo si mette
      sempre fra te e la merce, e vuol dire che la considera già sua.
    opzioni:
      - testo: "Affrontare Gaspare Tenca"
        descrizione: "Il ronco ha il manico lungo, e se cade Tenca, la banda se ne va."
        combattimento: pannion-tenca
        vittoria:
          titolo: Il ronco nell'erba
          testo: |
            Il ronco vola nell'erba e Tenca resta in ginocchio davanti alla porta, mentre i suoi
            scappano su per il pendio. Darrin gli dice di lasciare l'altura entro sera. All'alba,
            in piazza, ti mette sulle spalle una giubba di cuoio bollito nella resina e ti chiama
            «Fumo di Pannion», il nome che danno ai loro.
          pe: { armi-da-mischia: 5 }
          almeno: { rep.pannion: 6 }
          imposta: { pannion.tenca: 2 }
          effetti: { fazione.pannion: 1, monete: 80, oggetto.pannion-giubba-di-resina: 1 }
        sconfitta:
          titolo: Il manico lungo
          testo: |
            Il ronco ti aggancia la caviglia e finisci con la faccia contro il
            vetro. Darrin arriva con mezza squadra e la banda risale, e Tenca ti
            promette che tornerà la prima notte che Darrin dorme.
          effetti: { scandalo: 0.5 }
      - testo: "Fermare i picconi prima che rompano il vetro"
        descrizione: "I due ai picconi sono di Pannion, e hanno nonni sepolti in queste case."
        prova: { attributo: sociale, abilita: [intimidire, persuasione], difficolta: Difficile }
        successo:
          titolo: I picconi giù
          testo: |
            Chiami per nome i nonni dei due, come fa Liduina quando accende le lanterne, e
            i picconi si fermano. Tenca abbassa il ronco, e all'alba Darrin lo lascia
            restare, purché la banda risponda a lui. In piazza ti mette sulle spalle una
            giubba di cuoio bollito nella resina e ti chiama «Fumo di Pannion», il nome
            che danno ai loro.
          pe: { intimidire: 5 }
          almeno: { rep.pannion: 6 }
          imposta: { pannion.tenca: 1 }
          effetti: { fazione.pannion: 1, monete: 80, oggetto.pannion-giubba-di-resina: 1 }
        fallimento:
          titolo: Il vetro incrinato
          testo: |
            I due ridono e continuano, e il vetro della porta si incrina dall'alto
            in basso con un suono da campana rotta. Arriva Darrin con le lanterne
            e la banda risale, ma la notte dopo Tenca ci riprova.
          effetti: { tormento: 1, scandalo: 0.5 }
      - testo: "Mostrargli che cosa c'è dietro il vetro"
        descrizione: "Alla luce giusta il vetro di linfa si fa trasparente."
        prova: { attributo: mentale, abilita: [percezione, accademiche], difficolta: Difficile }
        successo:
          titolo: Le scodelle sul tavolo
          testo: |
            Dove la linfa è più sottile la lanterna mostra le scodelle sul tavolo
            e una culla accanto alla stufa, senza un metallo dei Precursori. Tenca
            guarda a lungo la culla e abbassa il ronco, e all'alba Darrin lo
            lascia restare, purché la banda risponda a lui. In piazza ti mette
            sulle spalle la giubba di cuoio dei «Fumo di Pannion».
          pe: { percezione: 5 }
          almeno: { rep.pannion: 6 }
          imposta: { pannion.tenca: 1 }
          effetti: { fazione.pannion: 1, monete: 80, oggetto.pannion-giubba-di-resina: 1 }
        fallimento:
          titolo: Il riflesso
          testo: |
            Dentro la casa qualcosa si muove con la luce, e fai un salto indietro
            prima di capire che è il tuo riflesso. Arriva Darrin con le lanterne e
            la banda risale, ma la notte dopo Tenca ci riprova.
          effetti: { tormento: 1 }
      - testo: "Mettere la lanterna fra lui e la porta"
        descrizione: "A Pannion nessuno alza la mano su chi porta una lanterna da pontile."
        requisiti: [chiave.lanterna >= 1]
        prova: { attributo: mentale, abilita: [resilienza, natura], difficolta: Difficile }
        successo:
          titolo: La lanterna ferma
          testo: |
            Il ronco si alza e si ferma a un dito dalla lanterna da pontile, e
            Tenca lo abbassa e sputa nell'erba. All'alba Darrin lo lascia restare,
            purché la banda risponda a lui, e in piazza ti mette sulle spalle la
            giubba di cuoio dei «Fumo di Pannion».
          pe: { resilienza: 5 }
          almeno: { rep.pannion: 6 }
          imposta: { pannion.tenca: 1 }
          effetti: { fazione.pannion: 1, monete: 80, oggetto.pannion-giubba-di-resina: 1 }
        fallimento:
          titolo: La mano che trema
          testo: |
            La lanterna ti trema in mano, e Tenca la scosta con il manico e ti
            colpisce al braccio. Arriva Darrin con le lanterne e la banda risale,
            ma la notte dopo Tenca ci riprova.
          effetti: { ferite: 1, scandalo: 0.5 }
      - testo: "Dirgli chi tiene i conti a Qir-Azel"
        descrizione: "Il tavolo d'angolo degli Scuri adesso è tuo, e le bande dei villaggi lo sanno."
        quando: [scuri.finale == 1]
        prova: { attributo: sociale, abilita: [intimidire, politica-ed-economia], difficolta: Difficile }
        successo:
          titolo: Il tavolo d'angolo
          testo: |
            Una banda che scava per conto suo nelle case dei morti, gli dici, al
            tavolo d'angolo è finita, e Tenca richiama i suoi. All'alba Darrin lo
            lascia restare, purché la banda risponda a lui, e in piazza ti mette
            sulle spalle la giubba di cuoio dei «Fumo di Pannion».
          pe: { intimidire: 5 }
          almeno: { rep.pannion: 6 }
          imposta: { pannion.tenca: 1 }
          effetti: { fazione.pannion: 1, monete: 80, oggetto.pannion-giubba-di-resina: 1, rep.scuri: 0.5 }
        fallimento:
          titolo: Il tavolo lontano
          testo: |
            Il tavolo d'angolo sta a due giorni di strada e la porta sta qui, ti
            risponde Tenca. Arriva Darrin con le lanterne e la banda risale, ma la
            notte dopo Tenca ci riprova.
          effetti: { scandalo: 1 }
      - testo: "Ricordargli dove è finito il registro degli Scuri"
        descrizione: "Il registro degli Scuri l'hai portato tu allo sceriffo, e le bande dei villaggi lo sanno."
        quando: [scuri.finale == 3]
        prova: { attributo: sociale, abilita: [intimidire, conoscenze-della-strada], difficolta: Difficile }
        successo:
          titolo: Il registro
          testo: |
            Gli ricordi chi ha portato il registro degli Scuri allo sceriffo, e
            che in quel registro c'era posto anche per le bande dei villaggi, e
            Tenca richiama i suoi. All'alba Darrin lo lascia restare, purché la
            banda risponda a lui, e in piazza ti mette sulle spalle la giubba di
            cuoio dei «Fumo di Pannion».
          pe: { intimidire: 5 }
          almeno: { rep.pannion: 6 }
          imposta: { pannion.tenca: 1 }
          effetti: { fazione.pannion: 1, monete: 80, oggetto.pannion-giubba-di-resina: 1 }
        fallimento:
          titolo: Lo sceriffo lontano
          testo: |
            Tenca ride, perché lo sceriffo a Pannion non ci è mai salito. Arriva
            Darrin con le lanterne e la banda risale, ma la notte dopo Tenca torna
            con un uomo in più.
          effetti: { scandalo: 1 }
      - testo: "Parlargli come si parla fra capi di banda"
        descrizione: "Nei vicoli un capo si convince soltanto con un prezzo migliore della merce."
        quando: [origine.figlio-della-citta-bassa >= 1]
        prova: { attributo: sociale, abilita: [conoscenze-della-strada, persuasione], difficolta: Difficile }
        successo:
          titolo: Il prezzo della merce
          testo: |
            Gli fai il conto di quanto vale a Qir-Azel la merce di una casa di
            morti, con lo sceriffo che lo viene a sapere, e Tenca richiama i suoi.
            All'alba Darrin lo lascia restare, purché la banda risponda a lui, e
            in piazza ti mette sulle spalle la giubba di cuoio dei «Fumo di
            Pannion».
          pe: { conoscenze-della-strada: 5 }
          almeno: { rep.pannion: 6 }
          imposta: { pannion.tenca: 1 }
          effetti: { fazione.pannion: 1, monete: 80, oggetto.pannion-giubba-di-resina: 1 }
        fallimento:
          titolo: Il conto sbagliato
          testo: |
            Tenca rifà il conto meglio di te, a voce alta, davanti ai suoi. Arriva
            Darrin con le lanterne e la banda risale, ma la notte dopo Tenca torna
            con due uomini in più.
          effetti: { scandalo: 1 }

  # ------------------------------------------------------------ 9 → 10 · l'anno della linfa
  - id: pannion-l-anno-della-linfa
    presso: pannion
    immagine: icone/paper-lantern
    titolo: L'anno della linfa
    sommario: "Prima di scendere nella vecchia Pannion Darrin ti porta da Liduina Brace, che aveva otto anni quando il villaggio salì sull'altura."
    luogo: Pannion, la casa di Liduina in fondo al pontile
    area: superficie-fratturata
    requisiti: [fazione.pannion == 9]
    testo: |
      La casa di Liduina Brace sta in fondo al pontile più lungo, con le pareti piene
      di lanterne vecchie, una per ogni famiglia che è salita. Darrin si siede vicino
      alla porta con il cappello sulle ginocchia.

      Liduina aveva otto anni. Una notte d'estate la terra tremò a lungo, e la mattina
      dopo le sequoie della valle cominciarono a piangere linfa, per una stagione
      intera. La linfa scese per le strade della vecchia Pannion come acqua lenta e
      indurì in fiumi di vetro rosso, e chi dormiva al piano terra restò dove dormiva.
      Gli altri salirono di notte con tutte le lanterne accese fino al Vecchio, e il
      nonno di Darrin portava la prima.

      {empatia Media} Quando arriva a chi è rimasto nelle case, le dita le si fermano
      sul bastone.

      La Conca degli specchi, dice Liduina, la linfa non la toccò mai. Ci girò intorno
      e continuò a scendere.
    opzioni:
      - testo: "Ascoltarla fino in fondo"
        descrizione: "Liduina non racconta questa storia da molto tempo, e va lasciata arrivare dove vuole."
        prova: { attributo: sociale, abilita: [empatia, galateo], difficolta: Media }
        successo:
          titolo: I nomi di chi è rimasto
          testo: |
            Alla fine Liduina ti dice uno per lanterna i nomi di chi è rimasto
            nelle case, e ti spiega la strada vecchia fino alla piazza. Fra tre
            notti c'è la luna piena, e Darrin ti dice che si scende allora e che
            lui resta con il Vecchio.
          pe: { empatia: 3 }
          effetti: { fazione.pannion: 1, rep.pannion: 0.5 }
        fallimento:
          titolo: Troppo presto
          testo: |
            Le chiedi troppo presto di chi è rimasto nelle case, e Liduina smette
            di parlare. La strada vecchia te la disegna Darrin sul tavolo con il
            dito. Fra tre notti c'è la luna piena, e si scende allora.
          effetti: { fazione.pannion: 1, scandalo: 0.5 }
      - testo: "Disegnare con lei la pianta della vecchia Pannion"
        descrizione: "Liduina ricorda le strade come le ha camminate a otto anni."
        prova: { attributo: mentale, abilita: [accademiche, percezione], difficolta: Media }
        successo:
          titolo: La pianta a carbone
          testo: |
            Disegni sulla tavola con un pezzo di carbone, e Liduina ti corregge le
            strade una per una, dal forno fino alla piazza con la Conca nel mezzo.
            Fra tre notti c'è la luna piena, e si scende allora, mentre Darrin
            resta con il Vecchio.
          pe: { accademiche: 3 }
          effetti: { fazione.pannion: 1, rep.pannion: 0.5 }
        fallimento:
          titolo: Le strade storte
          testo: |
            Le strade non tornano, e Liduina si confonde con te e piange un poco.
            Darrin cancella la tavola con la manica. Fra tre notti c'è la luna
            piena, e si scende allora.
          effetti: { fazione.pannion: 1, tormento: 0.5 }
      - testo: "Aprire con la squadra il primo tratto della discesa"
        descrizione: "Dal crinale di Delek al primo fiume di vetro il pendio è pieno di rovi."
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Media }
        successo:
          titolo: Il sentiero aperto
          testo: |
            Con la squadra di Darrin tagli i rovi e pianti i paletti per le corde
            fino al primo fiume di vetro. Fra tre notti c'è la luna piena, e si
            scende allora, mentre Darrin resta con il Vecchio.
          pe: { atletica: 3 }
          effetti: { fazione.pannion: 1, rep.pannion: 0.5 }
        fallimento:
          titolo: I rovi
          testo: |
            I rovi ti aprono le braccia e le guance, e un paletto ti scivola giù
            fino al fiume di vetro. Fra tre notti c'è la luna piena, e si scende
            allora.
          effetti: { fazione.pannion: 1, ferite: 0.5, tormento: 0.5 }
      - testo: "Restare con Liduina fino all'alba"
        descrizione: "Dopo una storia così una vecchia non deve restare sola."
        costo: 2
        esito:
          titolo: La stufa
          testo: |
            Resti accanto alla stufa fino all'alba, e Liduina nel sonno dice il
            nome di sua madre. La mattina ti dà una delle lanterne appese al muro
            perché tu la riporti giù. Fra tre notti c'è la luna piena, e si scende
            allora.
          pe: { resilienza: 3 }
          effetti: { fazione.pannion: 1, rep.pannion: 0.5 }
