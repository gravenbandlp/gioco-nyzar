# I nemici e gli scontri della quest di Pannion, tarati con scripts/simula-fine.ts per il combattente di fine
# capitolo (Fisico 3, Armi da mischia 3, Spadone di Uzgreth, cuoio rinforzato): gregari sopra l'80%, boss fra il
# 40 e il 60%. Il bosco perso, boss finale della quest, sta sopra l'80% anche per il profilo di fine contenuti.
# - Atto I (passo 2): i tagliatori della banda di Gaspare Tenca.
# - Atto III (passo 9): Gaspare Tenca (boss).
# - Atto IV (la vecchia Pannion): i cinghiali rossi, le radici di vetro e il custode della conca (boss).
# - Atto V (passi 14 e 15): le ombre del bosco e il bosco perso (boss finale).
nemici:
  - id: pannion-tagliatore
    immagine: fazioni/scuri
    nome: Tagliatore della banda
    descrizione: "Un boscaiolo di Pannion che di notte taglia per Gaspare Tenca, con la scure corta e un fazzoletto scuro sulla faccia. Conosce il bosco meglio di te, e lo sa."
    attacco: 4
    difesa: 3
    difesaMentale: 2
    pf: 9
    danno: 2
    riduzione: 1
    iniziativa: 2

  - id: pannion-gaspare-tenca
    immagine: fazioni/scuri
    nome: Gaspare Tenca
    descrizione: "Il capo della banda di Pannion ha le spalle di un boscaiolo e la pazienza di uno che conta. Combatte con un ronco da potatura dal manico lungo, e tiene la distanza finché non sei stanco."
    attacco: 5
    difesa: 4
    difesaMentale: 3
    pf: 15
    danno: 3
    riduzione: 4
    iniziativa: 3

  - id: pannion-cinghiale-rosso
    immagine: bestiario/cinghiale-crudele-mutato
    nome: Cinghiale rosso
    descrizione: "Un cinghiale della valle con le setole incrostate di linfa rossa, che gli fa sulla schiena una corazza di schegge. Grufola fra le case della vecchia Pannion e non le cede."
    attacco: 4
    difesa: 3
    difesaMentale: 2
    pf: 8
    danno: 2
    riduzione: 2
    iniziativa: 2
    tratti: [animale]

  - id: pannion-radice-di-vetro
    immagine: ambientazione/foresta-strisciante
    nome: Radice di vetro
    descrizione: "Una radice grossa come una gamba, coperta di linfa indurita che taglia come un coccio. Si muove piano, e si chiude intorno a quello che le passa vicino."
    attacco: 4
    difesa: 3
    difesaMentale: 5
    pf: 9
    danno: 2
    riduzione: 3
    iniziativa: 1

  - id: pannion-custode-della-conca
    immagine: ambientazione/rovine-dei-precursori
    nome: Il custode della conca
    descrizione: "Una figura di radici e di linfa di vetro, più alta di un uomo, che sale dall'acqua della Conca degli specchi. Di giorno ha la faccia degli sconosciuti che l'acqua riflette, e la cambia a ogni colpo."
    attacco: 5
    difesa: 4
    difesaMentale: 5
    pf: 14
    danno: 4
    riduzione: 3
    iniziativa: 2

  - id: pannion-ombra-del-bosco
    immagine: ambientazione/foresta-strisciante
    nome: Ombra del bosco
    descrizione: "Un pezzo di bosco che si muove da solo, un groviglio di rami e di muschio alto quanto un uomo. Nel buio fra due lanterne sembra un albero, finché non ti viene addosso."
    attacco: 4
    difesa: 4
    difesaMentale: 4
    pf: 8
    danno: 2
    riduzione: 2
    iniziativa: 2

  - id: pannion-bosco-perso
    immagine: icone/evil-tree
    nome: Il bosco perso
    descrizione: "Un tronco nero che cammina sulle radici, alto quanto il Vecchio, con i rami carichi di lanterne spente. Sale dalla valle seguendo la strada delle luci, e dove passa il fumo si piega."
    attacco: 5
    difesa: 4
    difesaMentale: 5
    pf: 17
    danno: 3
    riduzione: 4
    iniziativa: 2

scontri:
  - { id: pannion-tagliatori, nome: "I tagliatori della banda", nemici: [pannion-tagliatore, pannion-tagliatore], feriteSconfitta: 2 }
  - { id: pannion-tenca, nome: "Gaspare Tenca", nemici: [pannion-gaspare-tenca], feriteSconfitta: 3 }
  - { id: pannion-cinghiali, nome: "I cinghiali rossi", nemici: [pannion-cinghiale-rosso, pannion-cinghiale-rosso], feriteSconfitta: 2 }
  - { id: pannion-radici, nome: "Le radici di vetro", nemici: [pannion-radice-di-vetro, pannion-radice-di-vetro], feriteSconfitta: 2 }
  - { id: pannion-custode, nome: "Il custode della conca", nemici: [pannion-custode-della-conca], feriteSconfitta: 4 }
  - { id: pannion-ombre, nome: "Le ombre del bosco", nemici: [pannion-ombra-del-bosco, pannion-ombra-del-bosco], feriteSconfitta: 2 }
  - { id: pannion-bosco-perso, nome: "Il bosco perso", nemici: [pannion-bosco-perso], feriteSconfitta: 4 }
