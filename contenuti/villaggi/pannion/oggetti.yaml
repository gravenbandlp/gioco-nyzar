# Gli oggetti della quest di Pannion, uno per grado tranne il secondo, che è un servizio (la notte ai pontili, in
# luogo.yaml, insieme all'unguento della cappella al prezzo della squadra).
# - Grado 1 (passo 3): la lanterna da pontile, accessorio di grado 1 che apre le opzioni con chiave.lanterna.
# - Grado 3 (passo 9): la giubba di resina, cuoio rinforzato di grado 3.
# - Grado 4 (passo 12): la scheggia del Vecchio, accessorio di grado 3 che apre le opzioni con chiave.vecchio.
# - Grado 5 (passo 15): la scure di linfa, oggetto unico di grado 4.
oggetti:
  - id: pannion-lanterna-da-pontile
    nome: Lanterna da pontile
    immagine: icone/old-lantern
    descrizione: "Una lanterna di ferro nero con i vetri velati di resina, uguale a quelle che i boscaioli di Pannion appendono sui pontili ogni sera. Fa una luce bassa e calda, e chi la porta vede più lontano nel bosco."
    slot: accessorio
    grado: 1
    proprieta: { talento: { percezione: 1, natura: 1 }, chiave: [lanterna] }
    difetti: [riconoscibile]

  - id: pannion-giubba-di-resina
    nome: Giubba di resina
    immagine: icone/leather-armor
    descrizione: "Cuoio bollito nella resina delle sequoie e lasciato indurire al fumo delle carbonaie per un inverno intero. È duro come una tavola, e odora di bosco anche dopo un mese di città."
    slot: armatura
    base: cuoio-rinforzato
    grado: 3
    dadi: 1
    proprieta: { robusta: 1 }

  - id: pannion-scheggia-del-vecchio
    nome: Scheggia del Vecchio
    immagine: icone/tree-branch
    descrizione: "Una scheggia di legno nero lunga un dito, staccata dal Vecchio Albero nella notte in cui è cresciuto, legata a un laccio di cuoio. Darrin la dà a chi può parlare al Vecchio come uno di casa, e chi la porta tiene la testa ferma anche davanti alle cose storte."
    slot: accessorio
    grado: 3
    proprieta: { lucida: true, talento: { resilienza: 1 }, chiave: [vecchio] }

  - id: pannion-scure-di-linfa
    nome: Scure di linfa
    immagine: icone/wood-axe
    descrizione: "Una scure da taglio a due mani con il manico ricavato dal ramo che il Vecchio ha lasciato cadere, e la lama temprata nella linfa rossa. Quando morde, la linfa sulla lama si scalda, e chi la impugna sente le ferite chiudersi. Non si vende e non si presta."
    slot: arma
    base: ascia-bipenne
    grado: 4
    dadi: 2
    proprieta: { affilata: 1, assetata: true }
    difetti: [legata]
