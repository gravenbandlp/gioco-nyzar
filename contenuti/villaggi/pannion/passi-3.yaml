# La quest di Pannion, passo 12 e Atto V (fazione.pannion 11 → 15).
# - 11 → 12 `pannion-quello-che-ha-visto-l-acqua` (Pannion, grado 4): il racconto della Conca a Darrin e a Frate Koln.
#   Le radici del Vecchio bevono nella Conca; Koln vuole scriverne al Velo, Darrin no (pannion.segreto 1 o 2). La
#   scheggia del Vecchio. Opzione d'origine dell'Accolito; con pannion.conca 1 il racconto della propria faccia.
# - 12 → 13 `pannion-le-lanterne-spente` (Pannion): a mezzanotte le lanterne dei pontili si spengono e il bosco si
#   avvicina; una lettera del Consiglio offre alle famiglie case in città in cambio del taglio nella valle. Varianti
#   con pannion.tenca 1 (la banda sui pontili) e pannion.segreto 2 (la risposta del Velo).
# - 13 → 14 `pannion-la-strada-delle-lanterne` (Pannion, poi la valle): Liduina fa rifare la strada di lanterne
#   dell'anno della linfa, dal pontile più lungo fino alla Conca. Varianti con pannion.delek 1 e chiave.lanterna;
#   opzione d'origine del Figlio del Circolo.
# - 14 → 15 `pannion-il-vecchio` (Pannion, grado 5, boss finale): il bosco perso sale per la strada delle lanterne
#   fino al Vecchio. Combattimento o vie Difficili (la lanterna, la scheggia del Vecchio, il fumo delle carbonaie, il
#   Figlio del Circolo); chi fallisce non chiude il passo. Il grado dà la scure di linfa e dono.pannion.
storylet:
  # ------------------------------------------------------------ 11 → 12 · quello che ha visto l'acqua (grado 4)
  - id: pannion-quello-che-ha-visto-l-acqua
    presso: pannion
    immagine: icone/mirror-mirror
    titolo: Quello che ha visto l'acqua
    sommario: "Quando risali dalla valle la piazza è piena. Darrin ha passato la notte fra le radici del Vecchio, e Frate Koln vuole sapere che cosa c'era nell'acqua."
    luogo: Pannion, fra le radici del Vecchio
    area: superficie-fratturata
    requisiti: [fazione.pannion == 11]
    testo: |
      Quando risali dalla valle la piazza di Pannion è piena, e la gente si
      apre per lasciarti passare fino al Vecchio. Darrin è seduto fra le
      radici con la schiena contro il tronco, dove ha passato la notte, e ha
      gli occhi rossi di fumo. Frate Koln sta in piedi accanto a lui con le
      mani nascoste nel saio.

      Racconti quello che hai visto, dall'inizio, le radici del Vecchio che
      bevono nella Conca e la gente sconosciuta nell'acqua, che a un tratto
      alza la testa tutta insieme. Darrin ascolta senza muoversi.

      {resistenza Media fallita} Due notti senza dormire ti si siedono sulle
      spalle tutte insieme, proprio adesso che devi parlare.

      {empatia Media} Quando dici delle radici che bevono, a Darrin si apre
      la mano sul ginocchio. Forse lo sapeva già. Adesso che l'ha sentito
      dire ha paura di averlo saputo.

      Koln vuole scriverne al Velo. Secondo lui una vasca che restituisce il
      volto giusto soltanto sotto la luna è una cosa della fede, e la
      Cattedrale deve saperlo prima di altri. Darrin scuote la testa una volta. Il Vecchio
      beve laggiù, e quello che sa il Velo la città lo viene a sapere il
      giorno dopo.

      *Due uomini che vogliono bene allo stesso albero, ognuno a modo suo.*
      Fra le radici, ai piedi di Darrin, c'è una scheggia di legno nero lunga
      un dito, caduta la notte in cui il Vecchio è cresciuto.

      {origine accolito-del-velo} In Cattedrale le lettere dei villaggi
      passano per molte mani prima di arrivare a Padre Vantes. Da novizio le
      hai viste passare, e sai che qualcuna si ferma a metà strada.
    opzioni:
      - testo: "Dare ragione a Darrin e chiedere a Koln di tacere"
        descrizione: "Il Vecchio beve laggiù, e Pannion vive del Vecchio. Una lettera al Velo è una lettera alla città."
        prova: { attributo: sociale, abilita: [persuasione, empatia], difficolta: Media }
        successo:
          titolo: La lettera non scritta
          testo: |
            Dici a Koln che la Conca appartiene a chi ci è nato intorno, e che
            Pannion ci è nato intorno. Koln ci pensa a lungo e poi ride piano,
            togliendosi le mani dal saio. Darrin raccoglie la scheggia fra le
            radici, ci fa un buco con la punta del coltello, la infila in un
            laccio di cuoio e te la mette al collo. «Guardia del Vecchio» dice,
            davanti a tutta la piazza.
          pe: { persuasione: 5 }
          almeno: { rep.pannion: 8 }
          imposta: { pannion.segreto: 1 }
          effetti: { fazione.pannion: 1, monete: 120, oggetto.pannion-scheggia-del-vecchio: 1 }
        fallimento:
          titolo: Koln offeso
          testo: |
            Koln ti ascolta con la faccia sempre più rossa, e alla fine ti dice
            che un forestiero non insegna la fede a un frate. Poi promette di
            tacere lo stesso, per Darrin. Darrin raccoglie la scheggia fra le
            radici, la infila in un laccio di cuoio e te la mette al collo.
            «Guardia del Vecchio» dice, davanti a tutta la piazza.
          almeno: { rep.pannion: 8 }
          imposta: { pannion.segreto: 1 }
          effetti: { fazione.pannion: 1, monete: 120, oggetto.pannion-scheggia-del-vecchio: 1, scandalo: 0.5 }
      - testo: "Lasciare che Koln scriva al Velo"
        descrizione: "Koln è del Velo, e il Velo ha diritto di sapere. Darrin non sarà contento."
        esito:
          titolo: Il sigillo di Koln
          testo: |
            Koln scrive la lettera quella sera stessa, alla luce della pentola
            dell'unguento, e la sigilla con la cera della cappella. Darrin non
            dice niente. Raccoglie la scheggia fra le radici, la infila in un
            laccio di cuoio e te la mette al collo, e la stringe un poco più del
            necessario. «Guardia del Vecchio» dice, davanti a tutta la piazza.
          almeno: { rep.pannion: 8 }
          imposta: { pannion.segreto: 2 }
          effetti: { fazione.pannion: 1, monete: 120, oggetto.pannion-scheggia-del-vecchio: 1 }
      - testo: "Trovare le parole per tutti e due"
        descrizione: "Koln può scrivere al Velo della linfa e degli unguenti, che sono roba sua, e lasciare la Conca a Pannion. Bisogna convincerli insieme."
        prova: { attributo: sociale, abilita: [galateo, empatia], difficolta: Difficile }
        successo:
          titolo: La linfa e la Conca
          testo: |
            Proponi a Koln di scrivere al Velo della linfa, che è cosa sua da sempre, e di
            lasciare a Pannion la Conca, che è dei morti di Pannion. Koln
            guarda Darrin, e Darrin per la prima volta guarda Koln. Si
            stringono la mano sopra le radici. Darrin raccoglie la scheggia, la
            infila in un laccio di cuoio e te la mette al collo. «Guardia del
            Vecchio» dice, davanti a tutta la piazza.
          pe: { galateo: 5 }
          almeno: { rep.pannion: 8 }
          imposta: { pannion.segreto: 1 }
          effetti: { fazione.pannion: 1, monete: 120, oggetto.pannion-scheggia-del-vecchio: 1, rep.pannion: 0.5, rep.velo: 0.5 }
        fallimento:
          titolo: Né l'uno né l'altro
          testo: |
            Le parole ti escono storte, e alla fine nessuno dei due è contento. Koln promette
            di tacere borbottando. Darrin raccoglie la scheggia fra le radici e
            te la mette al collo con un laccio di cuoio, senza guardarti.
            «Guardia del Vecchio» dice, davanti a tutta la piazza.
          almeno: { rep.pannion: 8 }
          imposta: { pannion.segreto: 1 }
          effetti: { fazione.pannion: 1, monete: 120, oggetto.pannion-scheggia-del-vecchio: 1, scandalo: 0.5 }
      - testo: "Raccontare che sotto la luna l'acqua ti ha restituito la tua faccia"
        descrizione: "Di notte la Conca ti ha mostrato te. Detto a un frate che crede, è più forte di qualunque argomento."
        quando: [pannion.conca == 1]
        esito:
          titolo: La faccia giusta
          testo: |
            Racconti a Koln del momento in cui la luna ha passato le cime e
            nell'acqua c'eri tu. Koln resta zitto a lungo. Poi dice che una cosa
            che ti restituisce a te stesso non si mette in una lettera, e se ne
            torna alla cappella a piedi lenti. Darrin raccoglie la scheggia e te
            la mette al collo con un laccio di cuoio. «Guardia del Vecchio»
            dice, davanti a tutta la piazza.
          almeno: { rep.pannion: 8 }
          imposta: { pannion.segreto: 1 }
          effetti: { fazione.pannion: 1, monete: 120, oggetto.pannion-scheggia-del-vecchio: 1 }
      - testo: "Dire a Koln dove finiscono le lettere dei villaggi"
        descrizione: "Le lettere che arrivano in Cattedrale dai villaggi passano per molte mani. Lo sai da novizio, e Koln lo sa da frate."
        quando: [origine.accolito-del-velo >= 1]
        esito:
          titolo: Le molte mani
          testo: |
            Dici a Koln, a voce bassa, quante mani tocca una lettera dei
            villaggi prima di arrivare a Padre Vantes. Koln lo sa, e sentirlo
            dire da un novizio lo convince più di Darrin. Promette di tacere.
            Darrin raccoglie la scheggia e te la mette al collo con un laccio di
            cuoio. «Guardia del Vecchio» dice, davanti a tutta la piazza.
          pe: { empatia: 5 }
          almeno: { rep.pannion: 8 }
          imposta: { pannion.segreto: 1 }
          effetti: { fazione.pannion: 1, monete: 120, oggetto.pannion-scheggia-del-vecchio: 1 }

  # ------------------------------------------------------------ 12 → 13 · le lanterne spente
  - id: pannion-le-lanterne-spente
    presso: pannion
    immagine: ambientazione/foresta-strisciante
    titolo: Le lanterne spente
    sommario: "A mezzanotte le lanterne dei pontili si spengono tutte insieme, e la mattina il bosco è più vicino. Dal Consiglio arriva una lettera con una proposta gentile."
    luogo: Pannion, i pontili e la piazza
    area: superficie-fratturata
    requisiti: [fazione.pannion == 12]
    testo: |
      Da quando sei tornato dalla Conca, a mezzanotte le lanterne dei
      pontili si spengono tutte insieme senza un filo di vento, e la mattina
      il bosco è più vicino. Le sequoie che stavano fuori dai pontili adesso
      ci stanno sotto, e sulla strada delle carbonaie basse c'è una radice
      che ieri non c'era. Delek ha spostato la sua carbonaia di cinquanta
      passi verso l'alto.

      In piazza qualcuno dice che dalla valle hai portato su qualcosa, e lo
      dice abbastanza forte perché tu lo senta. Un messo del Municipio è
      arrivato con una lettera del Consiglio. La città offre alle famiglie
      di Pannion case in Città Bassa e lavoro alle segherie del canale, in
      cambio del diritto di taglio nella valle.

      {politica-ed-economia Media} Un villaggio vuoto non discute il prezzo
      del legname. Chi ha scritto la lettera lo sa benissimo, e l'ha scritta
      con molta gentilezza.

      Darrin legge la lettera, la piega in quattro e se la mette in tasca.
      Poi va al pontile di Liduina a riaccendere le lanterne una per una,
      come in una sera qualunque.

      {resilienza Media fallita} La frase della piazza ti segue fino al
      pontile. Ti accorgi di averla ripetuta fra te tre volte, ogni volta con
      la voce di un altro.
    opzioni:
      - testo: "Organizzare i turni delle lanterne con la squadra"
        descrizione: "Un ragazzo ogni dieci lanterne, con il tizzone pronto. Se a mezzanotte si spengono, si riaccendono subito."
        prova: { attributo: sociale, abilita: [persuasione, intimidire], difficolta: Media }
        successo:
          titolo: I tizzoni pronti
          testo: |
            Metti un ragazzo della squadra ogni dieci lanterne, con il tizzone
            acceso in un secchio di sabbia. A mezzanotte le lanterne si
            spengono e si riaccendono in un momento, e la mattina il bosco si è
            mosso di poco. Liduina ti manda a chiamare. Dice che bisogna rifare
            la strada.
          pe: { persuasione: 3 }
          effetti: { fazione.pannion: 1, rep.pannion: 0.5 }
        fallimento:
          titolo: I ragazzi addormentati
          testo: |
            A mezzanotte metà dei ragazzi dorme, e le lanterne restano spente
            fino alla terza ora. La mattina il bosco ha passato il primo
            pontile, e una madre ti guarda dalla finestra. Liduina ti manda a
            chiamare. Dice che bisogna rifare la strada.
          effetti: { fazione.pannion: 1, scandalo: 0.5 }
      - testo: "Misurare di quanto si muove il bosco"
        descrizione: "Un palo piantato a ogni sequoia, e la mattina si guarda di quanto si è spostata. Il bosco si muove in una direzione."
        prova: { attributo: mentale, abilita: [natura, percezione], difficolta: Media }
        successo:
          titolo: Verso le luci
          testo: |
            Pianti un paletto accanto a dieci sequoie, e la mattina li controlli
            uno per uno. Il bosco si muove verso le luci dei pontili, e verso
            il Vecchio. Lo racconti a Liduina, che annuisce come davanti a una
            cosa che aspettava. Secondo lei il bosco ha perso la strada, e bisogna
            rifargliela.
          pe: { natura: 3 }
          effetti: { fazione.pannion: 1, rep.pannion: 0.5 }
        fallimento:
          titolo: I paletti spariti
          testo: |
            La mattina metà dei paletti non si trova più, e quelli rimasti
            stanno dove li hai piantati. Torni in piazza con le mani vuote.
            Liduina ti manda a chiamare lo stesso. Dice che bisogna rifare la
            strada.
          effetti: { fazione.pannion: 1, tormento: 0.5 }
      - testo: "Rispondere alla lettera del Consiglio"
        descrizione: "Darrin non scrive lettere. Una risposta cortese e ferma, scritta da qualcuno che conosce la città, tiene il Consiglio lontano per una stagione."
        prova: { attributo: sociale, abilita: [galateo, politica-ed-economia], difficolta: Media }
        successo:
          titolo: La risposta
          testo: |
            Scrivi la risposta al tavolo della mensa, con Darrin che legge da
            sopra la tua spalla. Pannion ringrazia la città e resta dov'è, e il
            legname arriverà come da contratto. Darrin la firma con una croce,
            e due famiglie che stavano partendo leggono la copia appesa al
            Vecchio e restano. Poi Liduina ti manda a chiamare.
          pe: { galateo: 3 }
          effetti: { fazione.pannion: 1, rep.pannion: 0.5 }
        fallimento:
          titolo: Troppo cortese
          testo: |
            La risposta che scrivi è così cortese che sembra un sì, e Darrin la
            butta nel fuoco della mensa. La riscrive Koln, in due righe. Poi
            Liduina ti manda a chiamare. Dice che bisogna rifare la strada.
          effetti: { fazione.pannion: 1, scandalo: 0.5 }
      - testo: "Riaccendere le lanterne una per una tutta la notte"
        descrizione: "Tutta la notte sui pontili con il tizzone in mano, da una lanterna all'altra. Si dorme il giorno dopo."
        costo: 2
        esito:
          titolo: Il tizzone
          testo: |
            Passi la notte a correre da una lanterna all'altra con il tizzone,
            e all'alba hai le mani nere e le gambe che non ti reggono. Il bosco
            si è mosso di poco. Liduina ti manda a chiamare. Dice che bisogna
            rifare la strada.
          effetti: { fazione.pannion: 1, rep.pannion: 0.5, tormento: 0.5 }
      - testo: "Chiedere a Gaspare Tenca di mettere la sua banda sui pontili"
        descrizione: "Tenca risponde a Darrin, e la sua banda di notte è sveglia per mestiere."
        quando: [pannion.tenca == 1]
        esito:
          titolo: La banda sui pontili
          testo: |
            Tenca si gratta la barba rossa e ti dice che di notte la sua banda
            è sveglia comunque. A mezzanotte le lanterne si spengono, e i suoi
            le riaccendono prima che tu arrivi al pontile. Liduina ti manda a
            chiamare. Dice che bisogna rifare la strada.
          effetti: { fazione.pannion: 1, rep.pannion: 0.5 }
      - testo: "Leggere con Koln la risposta del Velo"
        descrizione: "Il Velo ha risposto alla lettera di Koln. Koln non l'ha ancora aperta, e non vuole aprirla da solo."
        quando: [pannion.segreto == 2]
        esito:
          titolo: La risposta del Velo
          testo: |
            La risposta del Velo dice di pregare e di aspettare, e annuncia una
            visita di due confratelli dopo l'inverno. Koln la legge due volte,
            poi la butta nella stufa e va ai pontili con il tizzone. Liduina ti
            manda a chiamare. Dice che bisogna rifare la strada.
          effetti: { fazione.pannion: 1, rep.pannion: 0.5 }

  # ------------------------------------------------------------ 13 → 14 · la strada delle lanterne
  - id: pannion-la-strada-delle-lanterne
    presso: pannion
    immagine: icone/old-lantern
    titolo: La strada delle lanterne
    sommario: "La notte della linfa la gente salì sull'altura per una strada di lanterne accese. Liduina vuole rifarla, dal pontile più lungo fino alla Conca."
    luogo: Pannion, dal pontile più lungo fino alla vecchia Pannion
    area: superficie-fratturata
    requisiti: [fazione.pannion == 13]
    testo: |
      Liduina ti riceve in piedi, appoggiata al bastone, con tutte le
      lanterne della sua casa staccate dai chiodi e allineate sul pavimento.
      La notte della linfa, dice, la gente salì sull'altura per una strada
      di lanterne accese, dalla piazza della Conca fino al Vecchio, e dopo
      quella notte la strada non l'ha più accesa nessuno. Il bosco ha perso
      la strada di casa, e adesso la cerca qui.

      Bisogna rifarla, una lanterna ogni tre passi dal pontile più lungo
      fino alla piazza della vecchia Pannion, e accenderle tutte nello
      stesso momento, a mezzanotte. Darrin ha già fatto portare in piazza le
      lanterne del villaggio, anche quelle delle case, e le ha fatte
      riempire d'olio.

      {accademiche Media} Dal pontile alla Conca sono quasi duemila passi.
      Fanno più di seicento lanterne, e un uomo ogni venti per accenderle
      insieme.

      {natura Media fallita} Guardi il bosco cercando di capire da che parte
      si sia spostato stanotte. Ti sembra fermo, e la cosa ti preoccupa di
      più.

      Darrin ti mette in mano la lanterna da portare in fondo. «Tu» dice, e
      basta. Liduina ti stringe il polso con le dita storte dai geloni.
    opzioni:
      - testo: "Aprire la strada fra le ombre del bosco"
        descrizione: "Fra i pontili e la valle il bosco si muove, e certi pezzi di bosco si mettono in mezzo. Le squadre passano se qualcuno va avanti."
        combattimento: pannion-ombre
        vittoria:
          titolo: La strada aperta
          testo: |
            Le due ombre si sfasciano in rami e muschio sotto i tuoi colpi, e
            le squadre ti vengono dietro con le lanterne in spalla. A
            mezzanotte le lanterne si accendono tutte insieme, e la strada
            scende di luce dall'altura fino alla Conca. Dalla valle, lungo la
            strada, qualcosa comincia a salire.
          pe: { armi-da-mischia: 3 }
          effetti: { fazione.pannion: 1, rep.pannion: 0.5 }
        sconfitta:
          titolo: Il muschio
          testo: |
            Un'ombra ti butta a terra e ti tiene giù con un peso di rami, e ti
            tirano fuori due della squadra. Le lanterne le portano in fondo
            loro, mentre tu zoppichi dietro. A mezzanotte si accendono tutte
            insieme, e dalla valle, lungo la strada, qualcosa comincia a salire.
          effetti: { fazione.pannion: 1, tormento: 1 }
      - testo: "Guidare le squadre al buio con la lanterna da pontile"
        descrizione: "La lanterna da pontile fa una luce bassa che si vede lontano nel bosco. Le squadre la seguono, se chi la porta sa dove andare."
        requisiti: [chiave.lanterna >= 1]
        prova: { attributo: mentale, abilita: [natura, percezione], difficolta: Media }
        successo:
          titolo: La luce bassa
          testo: |
            Vai avanti con la lanterna da pontile alta sopra la testa, e le
            squadre ti seguono in fila piantando le lanterne ogni tre passi. A
            mezzanotte si accendono tutte insieme, e la strada scende di luce
            dall'altura fino alla Conca. Dalla valle, lungo la strada,
            qualcosa comincia a salire.
          pe: { natura: 3 }
          effetti: { fazione.pannion: 1, rep.pannion: 0.5 }
        fallimento:
          titolo: Il giro lungo
          testo: |
            A metà strada perdi la radice del Vecchio e porti le squadre in un
            giro lungo fra i tronchi, e a mezzanotte l'ultimo tratto è ancora
            al buio. Lo finite di corsa. Le lanterne si accendono, e dalla
            valle, lungo la strada, qualcosa comincia a salire.
          effetti: { fazione.pannion: 1, tormento: 0.5 }
      - testo: "Contare i passi e le lanterne con Liduina"
        descrizione: "Seicento lanterne, una ogni tre passi. Se il conto sbaglia, la strada si interrompe."
        prova: { attributo: mentale, abilita: [accademiche, percezione], difficolta: Media }
        successo:
          titolo: Il conto giusto
          testo: |
            Conti i passi a voce alta, e Liduina dal pontile ripete i numeri
            come fa con i nomi. Le lanterne bastano fino all'ultima, posata sul
            bordo della Conca. A mezzanotte si accendono tutte insieme, e dalla
            valle, lungo la strada, qualcosa comincia a salire.
          pe: { accademiche: 3 }
          effetti: { fazione.pannion: 1, rep.pannion: 0.5 }
        fallimento:
          titolo: Il conto corto
          testo: |
            Il conto sbaglia, e le lanterne finiscono cinquanta passi prima
            della Conca. Mandi su un ragazzo a prendere quelle delle case. A
            mezzanotte si accendono tutte, e dalla valle, lungo la strada,
            qualcosa comincia a salire.
          effetti: { fazione.pannion: 1, scandalo: 0.5 }
      - testo: "Portare le lanterne fino in fondo alla valle"
        descrizione: "Le lanterne pesano piene d'olio, e la valle è lontana. Qualcuno deve portare l'ultimo carico fino alla Conca."
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Media }
        successo:
          titolo: L'ultimo carico
          testo: |
            Porti l'ultimo carico di lanterne giù per il pendio, con le cinghie
            che ti segano le spalle, e posi l'ultima sul bordo della Conca. A
            mezzanotte si accendono tutte insieme, e la strada scende di luce
            dall'altura fino a te. Dalla valle, alle tue spalle, qualcosa
            comincia a salire.
          pe: { atletica: 3 }
          effetti: { fazione.pannion: 1, rep.pannion: 0.5 }
        fallimento:
          titolo: L'olio versato
          testo: |
            A metà pendio ti si rovescia una cassa, e l'olio ti inzuppa i
            vestiti fino alla pelle. Arrivi in fondo che puzzi come una
            lanterna. A mezzanotte si accendono tutte insieme, e dalla valle
            qualcosa comincia a salire.
          effetti: { fazione.pannion: 1, ferite: 0.5, tormento: 0.5 }
      - testo: "Mandare Delek in testa alla seconda squadra"
        descrizione: "Delek conosce la discesa meglio di chiunque, e ha un debito da pagare con la valle."
        quando: [pannion.delek >= 1]
        esito:
          titolo: Delek in testa
          testo: |
            Delek prende la seconda squadra senza discutere e la porta giù per
            la strada dei pali, mentre tu porti la tua per la radice. Vi
            ritrovate alla Conca. A mezzanotte le lanterne si accendono tutte
            insieme, e dalla valle, lungo la strada, qualcosa comincia a salire.
          effetti: { fazione.pannion: 1, rep.pannion: 0.5 }
      - testo: "Chiedere al bosco di lasciar passare le squadre"
        descrizione: "Al Circolo il bosco si ascolta prima di attraversarlo, e a volte risponde. Le squadre passano dove passa lui."
        quando: [origine.figlio-del-circolo >= 1]
        esito:
          titolo: Il bosco che ascolta
          testo: |
            Ti fermi in mezzo al bosco con le mani aperte e ascolti, come al
            Circolo, finché senti dove i tronchi lasciano passare l'aria. Le
            squadre passano di lì, in fila. A mezzanotte le lanterne si
            accendono tutte insieme, e dalla valle, lungo la strada, qualcosa
            comincia a salire.
          pe: { natura: 3 }
          effetti: { fazione.pannion: 1, rep.pannion: 0.5 }

  # ------------------------------------------------------------ 14 → 15 · il Vecchio (grado 5)
  - id: pannion-il-vecchio
    presso: pannion
    immagine: icone/tree-face
    titolo: Il Vecchio
    sommario: "Per la strada delle lanterne sale dalla valle un tronco nero che cammina, con i rami carichi di lanterne spente. Va verso il Vecchio."
    luogo: Pannion, la piazza del Vecchio, a mezzanotte
    area: superficie-fratturata
    requisiti: [fazione.pannion == 14]
    testo: |
      Sale per la strada delle lanterne con il passo lento delle cose
      grandi, e quando arriva al bordo dell'altura la vedi bene. È un tronco
      nero alto quanto il Vecchio, che cammina sulle radici, e dai rami gli
      pendono lanterne spente, vecchie, di ferro rosso di ruggine. Sono le
      lanterne della vecchia Pannion.

      La piazza si svuota in un momento. Restano Darrin, davanti al Vecchio
      con la scure in mano e i piedi piantati fra le radici, e Liduina sul
      pontile più lungo, che riaccende le lanterne che si spengono al
      passaggio della cosa. Koln prega a voce alta dalla porta della
      cappella.

      {percezione Media} Dove passa, il fumo delle carbonaie si piega verso
      il tronco e gli si attacca ai rami. Il fumo di Pannion lo tiene, o lo
      chiama.

      {empatia Difficile} Il tronco cerca il Vecchio, con la fretta di un
      bambino che si è perso e ha visto la porta di casa. Non sa più come si
      bussa.

      Darrin si volta un momento verso di te. «Vecchio» dice, e lo dice a te.
      Poi torna a guardare la strada.

      {origine figlio-del-circolo} Al Circolo si racconta che un bosco
      lasciato solo per troppo tempo dimentica la sua forma. Non l'avevi mai
      creduto fino a stanotte.
    opzioni:
      - testo: "Affrontare il bosco perso davanti al Vecchio"
        descrizione: "Un tronco che cammina, alto quanto il Vecchio. Se arriva al Vecchio come ci arriva adesso, lo spacca."
        combattimento: pannion-bosco-perso
        vittoria:
          titolo: Il tronco in ginocchio
          testo: |
            Il bosco perso si piega sotto i tuoi colpi e cade in ginocchio sulle
            radici, ai piedi del Vecchio, e le sue radici entrano nella terra
            accanto a quelle del Vecchio e ci restano. All'alba in piazza c'è un
            secondo tronco nero, più basso, con le lanterne della vecchia
            Pannion appese ai rami. Ai piedi del Vecchio c'è un ramo caduto
            nella notte.

            Darrin e il fabbro ne fanno il manico di una scure, con la lama
            temprata nella linfa rossa, e Darrin te la mette in mano davanti a tutta Pannion, e ti chiama «Radice». Poi ti dice che quando avrai
            bisogno di Pannion, Pannion verrà.
          pe: { armi-da-mischia: 5 }
          almeno: { rep.pannion: 10 }
          effetti: { fazione.pannion: 1, monete: 350, oggetto.pannion-scure-di-linfa: 1, dono.pannion: 1 }
        sconfitta:
          titolo: Il pontile spaccato
          testo: |
            Il bosco perso ti spazza via con un ramo e ti scaraventa contro le
            palafitte del pontile, che si spaccano. Darrin lo tiene lontano dal
            Vecchio fino all'alba con le torce delle carbonaie, e all'alba la
            cosa torna giù per la strada delle lanterne. La notte dopo salirà di nuovo, e Darrin sarà ancora lì ad aspettarla.
          effetti: { tormento: 1 }
      - testo: "Riportarlo a casa con la lanterna da pontile"
        descrizione: "Il bosco perso segue le luci. Una lanterna che scende all'indietro per la strada, passo dopo passo, lo può riportare fino alla Conca."
        requisiti: [chiave.lanterna >= 1]
        prova: { attributo: mentale, abilita: [natura, resilienza], difficolta: Difficile }
        successo:
          titolo: All'indietro
          testo: |
            Ti metti fra il tronco e il Vecchio con la lanterna da pontile alta,
            e cominci a scendere all'indietro per la strada delle lanterne. Il
            tronco ti viene dietro passo per passo. Lo porti giù per duemila passi, fino alla piazza
            della vecchia Pannion, e lì si ferma accanto alla Conca e mette
            radici, e le lanterne sui suoi rami si accendono da sole.

            All'alba ritrovi Darrin ai piedi del Vecchio, con un ramo caduto
            nella notte. Lui e il fabbro ne fanno il manico di una scure, con la
            lama temprata nella linfa rossa, e Darrin te la mette in mano
            davanti a tutta Pannion, e ti chiama «Radice». Poi ti dice che quando
            avrai bisogno di Pannion, Pannion verrà.
          pe: { natura: 5 }
          almeno: { rep.pannion: 10 }
          effetti: { fazione.pannion: 1, monete: 350, oggetto.pannion-scure-di-linfa: 1, dono.pannion: 1 }
        fallimento:
          titolo: La luce che non basta
          testo: |
            Il tronco guarda la tua lanterna e passa oltre diretto al Vecchio, e
            un ramo ti prende al petto e ti butta in mezzo alla piazza. Darrin
            lo tiene lontano con le torce fino all'alba, quando la cosa torna
            giù. La notte dopo salirà di nuovo, e Darrin sarà ancora lì ad aspettarla.
          effetti: { ferite: 1, tormento: 0.5 }
      - testo: "Mettere la mano sul Vecchio insieme a Darrin"
        descrizione: "Con la scheggia del Vecchio al collo il Vecchio ti ascolta come uno di casa. Bisogna parlargli in due, e restare fermi mentre la cosa arriva."
        requisiti: [chiave.vecchio >= 1]
        prova: { attributo: sociale, abilita: [empatia, persuasione], difficolta: Difficile }
        successo:
          titolo: Due mani sulla corteccia
          testo: |
            Metti la mano sul Vecchio accanto a quella di Darrin, e lo chiamate
            per nome tutti e due, mentre il tronco nero vi arriva addosso. Dalla
            terra della piazza salgono le radici del Vecchio e prendono le sue,
            e i due tronchi si stringono fino a fermarsi. All'alba la cosa è un
            groviglio di legno nero ai piedi del Vecchio, e fra le radici c'è un
            ramo caduto nella notte.

            Darrin e il fabbro ne fanno il manico di una scure, con la lama
            temprata nella linfa rossa, e Darrin te la mette in mano davanti a tutta Pannion, e ti chiama «Radice». Poi ti dice che quando avrai
            bisogno di Pannion, Pannion verrà.
          pe: { empatia: 5 }
          almeno: { rep.pannion: 10 }
          effetti: { fazione.pannion: 1, monete: 350, oggetto.pannion-scure-di-linfa: 1, dono.pannion: 1 }
        fallimento:
          titolo: La mano che si stacca
          testo: |
            La cosa vi è addosso, e la tua mano si stacca dalla corteccia da
            sola. Un ramo ti scaraventa via e prende Darrin alla spalla. Fino
            all'alba lo tenete lontano con le torce, e all'alba torna giù per la
            strada. La notte dopo salirà di nuovo, e Darrin sarà ancora lì ad aspettarla.
          effetti: { ferite: 1, tormento: 1 }
      - testo: "Aprire le carbonaie e piegarlo con il fumo"
        descrizione: "Il fumo di Pannion lo piega. Con tutte le carbonaie aperte la piazza diventa una nuvola, e una carbonaia aperta può prendere fuoco."
        prova: { attributo: mentale, abilita: [natura, tecnologia], difficolta: Difficile }
        successo:
          titolo: La nuvola
          testo: |
            Corri da una carbonaia all'altra a togliere le zolle, e in poco la
            piazza è una nuvola grigia. Il tronco si piega dentro il fumo, si
            ferma a dieci passi dal Vecchio e si inginocchia, e quando il fumo
            si alza le sue radici sono già nella terra. All'alba ai piedi del
            Vecchio c'è un ramo caduto nella notte.

            Darrin e il fabbro ne fanno il manico di una scure, con la lama
            temprata nella linfa rossa, e Darrin te la mette in mano davanti a tutta Pannion, e ti chiama «Radice». Poi ti dice che quando avrai
            bisogno di Pannion, Pannion verrà.
          pe: { natura: 5 }
          almeno: { rep.pannion: 10 }
          effetti: { fazione.pannion: 1, monete: 350, oggetto.pannion-scure-di-linfa: 1, dono.pannion: 1 }
        fallimento:
          titolo: La carbonaia in fiamme
          testo: |
            Una carbonaia prende aria e si accende tutta, e il fuoco corre al
            pontile più vicino. Passate la notte a spegnerlo, mentre Darrin
            tiene la cosa lontana dal Vecchio con le torce. All'alba torna giù
            per la strada. La notte dopo salirà di nuovo, e Darrin sarà ancora lì ad aspettarla.
          effetti: { ferite: 0.5, scandalo: 1 }
      - testo: "Chiamarlo come al Circolo si chiama il bosco"
        descrizione: "Al Circolo un bosco che ha dimenticato la sua forma si chiama a voce bassa, finché si ricorda. Bisogna stargli davanti mentre si ricorda."
        quando: [origine.figlio-del-circolo >= 1]
        prova: { attributo: mentale, abilita: [natura, magia], difficolta: Difficile }
        successo:
          titolo: La forma
          testo: |
            Ti metti davanti al tronco e lo chiami a voce bassa, come ti hanno
            insegnato, e il tronco si ferma a sentirti. Piano piano si piega fino a
            terra e mette radici dove sta, a dieci passi dal Vecchio. All'alba
            ai piedi del Vecchio c'è un ramo caduto nella notte.

            Darrin e il fabbro ne fanno il manico di una scure, con la lama
            temprata nella linfa rossa, e Darrin te la mette in mano davanti a tutta Pannion, e ti chiama «Radice». Poi ti dice che quando avrai
            bisogno di Pannion, Pannion verrà.
          pe: { natura: 5 }
          almeno: { rep.pannion: 10 }
          effetti: { fazione.pannion: 1, monete: 350, oggetto.pannion-scure-di-linfa: 1, dono.pannion: 1 }
        fallimento:
          titolo: La voce coperta
          testo: |
            La tua voce si perde nel rumore dei rami, e il tronco ti passa
            accanto come se non ci fossi. Darrin lo tiene lontano dal Vecchio
            con le torce fino all'alba, quando torna giù. La notte dopo salirà di nuovo, e Darrin sarà ancora lì ad aspettarla.
          effetti: { ferite: 0.5, tormento: 1 }
