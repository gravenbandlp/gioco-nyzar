# La quest di Pannion, passo 12 e Atto V (fazione.pannion 11 → 15).
# - 11 → 12 `pannion-quello-che-ha-visto-l-acqua` (Pannion, grado 4): il racconto della Conca a Darrin e a Frate Koln.
#   Le radici del Vecchio bevono nella Conca; Koln vuole scriverne al Velo, Darrin no (pannion.segreto 1 o 2). La
#   scheggia del Vecchio. Opzione d'origine dell'Accolito; con pannion.conca 1 il racconto della propria faccia.
# - 12 → 13 `pannion-le-lanterne-spente` (Pannion): a mezzanotte le lanterne dei pontili si spengono e il bosco si
#   avvicina; una lettera del Consiglio offre alle famiglie case in città in cambio del taglio nella valle. Varianti
#   con pannion.tenca 1 (la banda sui pontili) e pannion.segreto 2 (la risposta del Velo).
# - 13 → 14 `pannion-la-strada-delle-lanterne` (Pannion, poi la valle): Liduina fa rifare la strada di lanterne
#   dell'anno della linfa, dal pontile più lungo fino alla Conca. Varianti con pannion.delek 1 e chiave.lanterna;
#   opzione d'origine del Figlio del Circolo.
# - 14 → 15 `pannion-il-vecchio` (Pannion, grado 5, boss finale): il bosco perso sale per la strada delle lanterne
#   fino al Vecchio. Combattimento o vie Difficili (la lanterna, la scheggia del Vecchio, il fumo delle carbonaie, il
#   Figlio del Circolo); chi fallisce non chiude il passo. Il grado dà la scure di linfa e dono.pannion.
storylet:
  # ------------------------------------------------------------ 11 → 12 · quello che ha visto l'acqua (grado 4)
  - id: pannion-quello-che-ha-visto-l-acqua
    presso: pannion
    immagine: icone/mirror-mirror
    titolo: Quello che ha visto l'acqua
    sommario: "Quando risali dalla valle la piazza è piena, e Frate Koln vuole sapere che cosa c'era nell'acqua."
    luogo: Pannion, fra le radici del Vecchio
    area: superficie-fratturata
    requisiti: [fazione.pannion == 11]
    testo: |
      Quando risali dalla valle la piazza di Pannion è piena. Darrin è seduto fra le
      radici del Vecchio, dove ha passato la notte, con gli occhi rossi di fumo, e Frate
      Koln gli sta accanto con le mani nascoste nel saio. Racconti tutto, le radici del
      Vecchio che bevono nella Conca e la gente sconosciuta nell'acqua che a un tratto
      alza la testa tutta insieme.

      {empatia Media} Quando dici delle radici che bevono, a Darrin si apre la mano sul
      ginocchio. Forse lo sapeva già, e adesso che l'ha sentito dire ha paura di averlo
      saputo.

      Koln vuole scriverne al Velo, perché una vasca che restituisce il volto giusto
      soltanto sotto la luna è una cosa della fede. Darrin scuote la testa una volta. Il
      Vecchio beve laggiù, e quello che sa il Velo la città lo viene a sapere il giorno
      dopo.

      Fra le radici, ai piedi di Darrin, c'è una scheggia di legno nero lunga un dito,
      caduta la notte in cui il Vecchio è cresciuto.

      {origine accolito-del-velo} Da novizio hai visto le lettere dei villaggi passare per
      molte mani prima di arrivare a Padre Vantes, e qualcuna fermarsi a metà strada.
    opzioni:
      - testo: "Dare ragione a Darrin e chiedere a Koln di tacere"
        descrizione: "Il Vecchio beve laggiù, e una lettera al Velo è una lettera alla città."
        prova: { attributo: sociale, abilita: [persuasione, empatia], difficolta: Media }
        successo:
          titolo: La lettera non scritta
          testo: |
            Dici a Koln che la Conca appartiene a chi ci è nato intorno, e Koln ci
            pensa a lungo e poi ride piano. Darrin raccoglie la scheggia fra le
            radici, la fora con la punta del coltello e te la mette al collo con
            un laccio di cuoio. «Guardia del Vecchio» dice, davanti a tutta la
            piazza.
          pe: { persuasione: 5 }
          almeno: { rep.pannion: 8 }
          imposta: { pannion.segreto: 1 }
          effetti: { fazione.pannion: 1, monete: 120, oggetto.pannion-scheggia-del-vecchio: 1 }
        fallimento:
          titolo: Koln offeso
          testo: |
            Rosso in faccia, Koln ti dice che un forestiero non insegna la fede a
            un frate, e poi per amore di Darrin promette di tacere. Darrin ti
            mette al collo la scheggia con un laccio di cuoio. «Guardia del
            Vecchio» dice, davanti a tutta la piazza.
          almeno: { rep.pannion: 8 }
          imposta: { pannion.segreto: 1 }
          effetti: { fazione.pannion: 1, monete: 120, oggetto.pannion-scheggia-del-vecchio: 1, scandalo: 0.5 }
      - testo: "Lasciare che Koln scriva al Velo"
        descrizione: "Koln è del Velo, e il Velo ha diritto di sapere, anche se Darrin non sarà contento."
        esito:
          titolo: Il sigillo di Koln
          testo: |
            Koln scrive la lettera quella sera stessa e la sigilla con la cera
            della cappella. Darrin non dice niente. Ti mette al collo la scheggia
            con un laccio di cuoio, stretto un poco più del necessario. «Guardia
            del Vecchio» dice, davanti a tutta la piazza.
          almeno: { rep.pannion: 8 }
          imposta: { pannion.segreto: 2 }
          effetti: { fazione.pannion: 1, monete: 120, oggetto.pannion-scheggia-del-vecchio: 1 }
      - testo: "Trovare le parole per tutti e due"
        descrizione: "Koln può scrivere al Velo della linfa e degli unguenti, che sono roba sua, e lasciare la Conca a Pannion."
        prova: { attributo: sociale, abilita: [galateo, empatia], difficolta: Difficile }
        successo:
          titolo: La linfa e la Conca
          testo: |
            Proponi a Koln di scrivere al Velo della linfa, che è cosa sua da sempre, e di
            lasciare a Pannion la Conca dei suoi morti. Koln e Darrin si stringono la mano
            sopra le radici. Darrin ti mette al collo la scheggia con un laccio di cuoio.
            «Guardia del Vecchio» dice, davanti a tutta la piazza.
          pe: { galateo: 5 }
          almeno: { rep.pannion: 8 }
          imposta: { pannion.segreto: 1 }
          effetti: { fazione.pannion: 1, monete: 120, oggetto.pannion-scheggia-del-vecchio: 1, rep.pannion: 0.5, rep.velo: 0.5 }
        fallimento:
          titolo: Né l'uno né l'altro
          testo: |
            Le parole ti escono storte, e Koln promette di tacere borbottando. Darrin ti
            mette al collo la scheggia con un laccio di cuoio, senza guardarti. «Guardia del
            Vecchio» dice, davanti a tutta la piazza.
          almeno: { rep.pannion: 8 }
          imposta: { pannion.segreto: 1 }
          effetti: { fazione.pannion: 1, monete: 120, oggetto.pannion-scheggia-del-vecchio: 1, scandalo: 0.5 }
      - testo: "Raccontare che sotto la luna l'acqua ti ha restituito la tua faccia"
        descrizione: "Di notte la Conca ti ha mostrato te, e per un frate che crede vale più di qualunque argomento."
        quando: [pannion.conca == 1]
        esito:
          titolo: La faccia giusta
          testo: |
            Racconti a Koln del momento in cui la luna ha passato le cime e
            nell'acqua c'eri tu. Dopo un lungo silenzio Koln dice che una cosa che
            ti restituisce a te stesso non si mette in una lettera. Darrin ti
            mette al collo la scheggia con un laccio di cuoio. «Guardia del
            Vecchio» dice, davanti a tutta la piazza.
          almeno: { rep.pannion: 8 }
          imposta: { pannion.segreto: 1 }
          effetti: { fazione.pannion: 1, monete: 120, oggetto.pannion-scheggia-del-vecchio: 1 }
      - testo: "Dire a Koln dove finiscono le lettere dei villaggi"
        descrizione: "Le lettere dei villaggi passano per molte mani, e Koln lo sa da frate come tu da novizio."
        quando: [origine.accolito-del-velo >= 1]
        esito:
          titolo: Le molte mani
          testo: |
            Dici a Koln quante mani tocca una lettera dei villaggi prima di
            arrivare a Padre Vantes, e sentirlo da un novizio lo convince più di
            Darrin. Promette di tacere. Darrin ti mette al collo la scheggia con
            un laccio di cuoio. «Guardia del Vecchio» dice, davanti a tutta la
            piazza.
          pe: { empatia: 5 }
          almeno: { rep.pannion: 8 }
          imposta: { pannion.segreto: 1 }
          effetti: { fazione.pannion: 1, monete: 120, oggetto.pannion-scheggia-del-vecchio: 1 }

  # ------------------------------------------------------------ 12 → 13 · le lanterne spente
  - id: pannion-le-lanterne-spente
    presso: pannion
    immagine: ambientazione/foresta-strisciante
    titolo: Le lanterne spente
    sommario: "A mezzanotte le lanterne dei pontili si spengono tutte insieme, e dal Consiglio arriva una lettera con una proposta gentile."
    luogo: Pannion, i pontili e la piazza
    area: superficie-fratturata
    requisiti: [fazione.pannion == 12]
    testo: |
      Da quando sei tornato dalla Conca, a mezzanotte le lanterne dei pontili
      si spengono tutte insieme senza un filo di vento, e la mattina il bosco
      è più vicino, con le sequoie che adesso stanno sotto i pontili. In
      piazza qualcuno dice, abbastanza forte perché tu senta, che dalla valle
      hai portato su qualcosa.

      Un messo del Municipio porta una lettera del Consiglio, che offre alle
      famiglie di Pannion case in Città Bassa e lavoro alle segherie del
      canale in cambio del diritto di taglio nella valle.

      {politica-ed-economia Media} Un villaggio vuoto non discute il prezzo
      del legname, e chi ha scritto la lettera l'ha scritta con molta
      gentilezza.

      Darrin piega la lettera in quattro e va al pontile di Liduina a
      riaccendere le lanterne una per una, come in una sera qualunque.
    opzioni:
      - testo: "Organizzare i turni delle lanterne con la squadra"
        descrizione: "Un ragazzo ogni dieci lanterne, con il tizzone pronto per mezzanotte."
        prova: { attributo: sociale, abilita: [persuasione, intimidire], difficolta: Media }
        successo:
          titolo: I tizzoni pronti
          testo: |
            Con un ragazzo ogni dieci lanterne, a mezzanotte le luci si
            riaccendono in un momento e il bosco si muove di poco. Poi Liduina ti
            manda a chiamare.
          pe: { persuasione: 3 }
          effetti: { fazione.pannion: 1, rep.pannion: 0.5 }
        fallimento:
          titolo: I ragazzi addormentati
          testo: |
            A mezzanotte metà dei ragazzi dorme, e la mattina il bosco ha passato
            il primo pontile. Liduina ti manda a chiamare.
          effetti: { fazione.pannion: 1, scandalo: 0.5 }
      - testo: "Misurare di quanto si muove il bosco"
        descrizione: "Un palo a ogni sequoia, e la mattina si guarda di quanto si è spostata."
        prova: { attributo: mentale, abilita: [natura, percezione], difficolta: Media }
        successo:
          titolo: Verso le luci
          testo: |
            I paletti dicono che il bosco si muove verso le luci dei pontili e
            verso il Vecchio. Liduina annuisce come davanti a una cosa che
            aspettava, perché il bosco ha perso la strada e bisogna rifargliela.
          pe: { natura: 3 }
          effetti: { fazione.pannion: 1, rep.pannion: 0.5 }
        fallimento:
          titolo: I paletti spariti
          testo: |
            La mattina metà dei paletti non si trova più. Liduina ti manda a
            chiamare lo stesso.
          effetti: { fazione.pannion: 1, tormento: 0.5 }
      - testo: "Rispondere alla lettera del Consiglio"
        descrizione: "Una risposta cortese e ferma, scritta da chi conosce la città, tiene il Consiglio lontano per una stagione."
        prova: { attributo: sociale, abilita: [galateo, politica-ed-economia], difficolta: Media }
        successo:
          titolo: La risposta
          testo: |
            Scrivi che Pannion ringrazia la città e resta dov'è, e che il legname
            arriverà come da contratto. Darrin firma con una croce, e due famiglie
            che stavano partendo leggono la copia appesa al Vecchio e restano. Poi
            Liduina ti manda a chiamare.
          pe: { galateo: 3 }
          effetti: { fazione.pannion: 1, rep.pannion: 0.5 }
        fallimento:
          titolo: Troppo cortese
          testo: |
            La risposta che scrivi è così cortese che sembra un sì, e Darrin la
            butta nel fuoco. La riscrive Koln in due righe, e Liduina ti manda a
            chiamare.
          effetti: { fazione.pannion: 1, scandalo: 0.5 }
      - testo: "Riaccendere le lanterne una per una tutta la notte"
        descrizione: "Tutta la notte sui pontili con il tizzone in mano, e si dorme il giorno dopo."
        costo: 2
        esito:
          titolo: Il tizzone
          testo: |
            All'alba hai le mani nere e le gambe che non ti reggono, e il bosco si
            è mosso di poco. Liduina ti manda a chiamare.
          effetti: { fazione.pannion: 1, rep.pannion: 0.5, tormento: 0.5 }
      - testo: "Chiedere a Gaspare Tenca di mettere la sua banda sui pontili"
        descrizione: "Tenca risponde a Darrin, e la sua banda di notte è sveglia per mestiere."
        quando: [pannion.tenca == 1]
        esito:
          titolo: La banda sui pontili
          testo: |
            A mezzanotte la banda di Tenca riaccende le lanterne prima che tu
            arrivi al pontile. Liduina ti manda a chiamare.
          effetti: { fazione.pannion: 1, rep.pannion: 0.5 }
      - testo: "Leggere con Koln la risposta del Velo"
        descrizione: "Il Velo ha risposto alla lettera di Koln, che non vuole aprirla da solo."
        quando: [pannion.segreto == 2]
        esito:
          titolo: La risposta del Velo
          testo: |
            Il Velo dice di pregare e di aspettare due confratelli dopo l'inverno.
            Koln butta la lettera nella stufa e va ai pontili con il tizzone, e
            Liduina ti manda a chiamare.
          effetti: { fazione.pannion: 1, rep.pannion: 0.5 }

  # ------------------------------------------------------------ 13 → 14 · la strada delle lanterne
  - id: pannion-la-strada-delle-lanterne
    presso: pannion
    immagine: icone/old-lantern
    titolo: La strada delle lanterne
    sommario: "La notte della linfa la gente salì sull'altura per una strada di lanterne accese, e Liduina vuole rifarla fino alla Conca."
    luogo: Pannion, dal pontile più lungo fino alla vecchia Pannion
    area: superficie-fratturata
    requisiti: [fazione.pannion == 13]
    testo: |
      Liduina ti riceve appoggiata al bastone, con tutte le lanterne della
      sua casa allineate sul pavimento. La notte della linfa, dice, la gente
      salì sull'altura per una strada di lanterne accese, dalla piazza della
      Conca fino al Vecchio, e nessuno l'ha più accesa. Il bosco ha perso la
      strada di casa, e adesso la cerca qui.

      Bisogna rifarla, una lanterna ogni tre passi dal pontile più lungo
      fino alla piazza della vecchia Pannion, e accenderle tutte a
      mezzanotte. Darrin ha già fatto riempire d'olio le lanterne del
      villaggio e ti mette in mano quella da portare in fondo. «Tu» dice, e
      basta.

      {accademiche Media} Dal pontile alla Conca sono quasi duemila passi,
      più di seicento lanterne e un uomo ogni venti per accenderle insieme.
    opzioni:
      - testo: "Aprire la strada fra le ombre del bosco"
        descrizione: "Fra i pontili e la valle certi pezzi di bosco si mettono in mezzo, e qualcuno deve andare avanti."
        combattimento: pannion-ombre
        vittoria:
          titolo: La strada aperta
          testo: |
            Le due ombre si sfasciano in rami e muschio, e le squadre ti vengono
            dietro con le lanterne in spalla. A mezzanotte la strada si accende
            tutta fino alla Conca, e dalla valle qualcosa comincia a salire.
          pe: { armi-da-mischia: 3 }
          effetti: { fazione.pannion: 1, rep.pannion: 0.5 }
        sconfitta:
          titolo: Il muschio
          testo: |
            Un'ombra ti tiene giù con un peso di rami finché due della squadra ti
            tirano fuori, e le lanterne le portano in fondo loro. A mezzanotte si
            accendono tutte insieme, e dalla valle qualcosa comincia a salire.
          effetti: { fazione.pannion: 1, tormento: 1 }
      - testo: "Guidare le squadre al buio con la lanterna da pontile"
        descrizione: "La luce bassa della lanterna da pontile si vede lontano nel bosco."
        requisiti: [chiave.lanterna >= 1]
        prova: { attributo: mentale, abilita: [natura, percezione], difficolta: Media }
        successo:
          titolo: La luce bassa
          testo: |
            Le squadre seguono la tua lanterna da pontile piantando le lanterne
            ogni tre passi. A mezzanotte la strada si accende tutta fino alla
            Conca, e dalla valle qualcosa comincia a salire.
          pe: { natura: 3 }
          effetti: { fazione.pannion: 1, rep.pannion: 0.5 }
        fallimento:
          titolo: Il giro lungo
          testo: |
            Perdi la radice del Vecchio e porti le squadre in un giro lungo, e
            l'ultimo tratto lo finite di corsa. A mezzanotte le lanterne si
            accendono, e dalla valle qualcosa comincia a salire.
          effetti: { fazione.pannion: 1, tormento: 0.5 }
      - testo: "Contare i passi e le lanterne con Liduina"
        descrizione: "Seicento lanterne, una ogni tre passi, e se il conto sbaglia la strada si interrompe."
        prova: { attributo: mentale, abilita: [accademiche, percezione], difficolta: Media }
        successo:
          titolo: Il conto giusto
          testo: |
            Conti i passi a voce alta e Liduina ripete i numeri come fa con i
            nomi, e l'ultima lanterna arriva sul bordo della Conca. A mezzanotte
            si accendono tutte, e dalla valle qualcosa comincia a salire.
          pe: { accademiche: 3 }
          effetti: { fazione.pannion: 1, rep.pannion: 0.5 }
        fallimento:
          titolo: Il conto corto
          testo: |
            Le lanterne finiscono cinquanta passi prima della Conca, e un ragazzo
            corre su a prendere quelle delle case. A mezzanotte si accendono
            tutte, e dalla valle qualcosa comincia a salire.
          effetti: { fazione.pannion: 1, scandalo: 0.5 }
      - testo: "Portare le lanterne fino in fondo alla valle"
        descrizione: "Qualcuno deve portare l'ultimo carico di lanterne fino alla Conca."
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Media }
        successo:
          titolo: L'ultimo carico
          testo: |
            Porti l'ultimo carico con le cinghie che ti segano le spalle e posi
            l'ultima lanterna sul bordo della Conca. A mezzanotte la strada si
            accende fino a te, e alle tue spalle qualcosa comincia a salire.
          pe: { atletica: 3 }
          effetti: { fazione.pannion: 1, rep.pannion: 0.5 }
        fallimento:
          titolo: L'olio versato
          testo: |
            Ti si rovescia una cassa, e arrivi in fondo inzuppato d'olio come una
            lanterna. A mezzanotte si accendono tutte insieme, e dalla valle
            qualcosa comincia a salire.
          effetti: { fazione.pannion: 1, ferite: 0.5, tormento: 0.5 }
      - testo: "Mandare Delek in testa alla seconda squadra"
        descrizione: "Delek conosce la discesa meglio di chiunque, e ha un debito con la valle."
        quando: [pannion.delek >= 1]
        esito:
          titolo: Delek in testa
          testo: |
            Delek porta la seconda squadra giù per la strada dei pali e tu la tua
            per la radice, e vi ritrovate alla Conca. A mezzanotte le lanterne si
            accendono tutte insieme, e dalla valle qualcosa comincia a salire.
          effetti: { fazione.pannion: 1, rep.pannion: 0.5 }
      - testo: "Chiedere al bosco di lasciar passare le squadre"
        descrizione: "Al Circolo il bosco si ascolta prima di attraversarlo."
        quando: [origine.figlio-del-circolo >= 1]
        esito:
          titolo: Il bosco che ascolta
          testo: |
            Ascolti il bosco con le mani aperte come al Circolo, e le squadre
            passano dove i tronchi lasciano passare l'aria. A mezzanotte le
            lanterne si accendono, e dalla valle qualcosa comincia a salire.
          pe: { natura: 3 }
          effetti: { fazione.pannion: 1, rep.pannion: 0.5 }

  # ------------------------------------------------------------ 14 → 15 · il Vecchio (grado 5)
  - id: pannion-il-vecchio
    presso: pannion
    immagine: icone/tree-face
    titolo: Il Vecchio
    sommario: "Per la strada delle lanterne sale dalla valle un tronco nero che cammina verso il Vecchio."
    luogo: Pannion, la piazza del Vecchio, a mezzanotte
    area: superficie-fratturata
    requisiti: [fazione.pannion == 14]
    testo: |
      Sale per la strada delle lanterne con il passo lento delle cose grandi,
      un tronco nero alto quanto il Vecchio che cammina sulle radici, e dai
      rami gli pendono le lanterne di ferro arrugginito della vecchia
      Pannion.

      La piazza si svuota in un momento. Restano Darrin, davanti al Vecchio
      con la scure in mano, e Liduina sul pontile più lungo, che riaccende le
      lanterne che si spengono al passaggio della cosa. Koln prega a voce
      alta dalla porta della cappella.

      {percezione Media} Dove passa, il fumo delle carbonaie si piega verso
      il tronco e gli si attacca ai rami. Il fumo di Pannion lo tiene, o lo
      chiama.

      {empatia Difficile} Il tronco cerca il Vecchio con la fretta di un
      bambino che ha visto la porta di casa e non sa più come si bussa.

      Darrin si volta un momento verso di te. «Vecchio» dice, e lo dice a te.

      {origine figlio-del-circolo} Al Circolo si racconta che un bosco
      lasciato solo per troppo tempo dimentica la sua forma, e fino a
      stanotte non ci avevi creduto.
    opzioni:
      - testo: "Affrontare il bosco perso davanti al Vecchio"
        descrizione: "Un tronco alto quanto il Vecchio, che se arriva così lo spacca."
        combattimento: pannion-bosco-perso
        vittoria:
          titolo: Il tronco in ginocchio
          testo: |
            Il bosco perso cade in ginocchio ai piedi del Vecchio e mette radici accanto alle sue, e all'alba in piazza c'è un secondo tronco
            nero con le lanterne vecchie.

            Da un ramo caduto nella notte il fabbro fa il manico di una scure temprata nella linfa rossa. Darrin te la mette in mano davanti a
            tutti, ti chiama «Radice» e ti promette che Pannion verrà quando ne avrai bisogno.
          pe: { armi-da-mischia: 5 }
          almeno: { rep.pannion: 10 }
          effetti: { fazione.pannion: 1, monete: 350, oggetto.pannion-scure-di-linfa: 1, dono.pannion: 1 }
        sconfitta:
          titolo: Il pontile spaccato
          testo: |
            Il bosco perso ti scaraventa contro le palafitte del pontile, che si spaccano. Darrin lo tiene lontano dal Vecchio
            con le torce fino all'alba, quando la cosa torna giù. La notte dopo salirà di nuovo, e Darrin sarà ancora lì.
          effetti: { tormento: 1 }
      - testo: "Riportarlo a casa con la lanterna da pontile"
        descrizione: "Il bosco perso segue le luci, e una lanterna che scende all'indietro lo può riportare alla Conca."
        requisiti: [chiave.lanterna >= 1]
        prova: { attributo: mentale, abilita: [natura, resilienza], difficolta: Difficile }
        successo:
          titolo: All'indietro
          testo: |
            Scendi all'indietro con la lanterna da pontile alta, e il tronco ti segue fino alla
            Conca. Lì mette radici, e le lanterne sui suoi rami si accendono da sole.

            All'alba, da un ramo caduto nella notte, il fabbro fa il manico di una scure temprata
            nella linfa rossa. Darrin te la mette in mano davanti a tutti, ti chiama «Radice» e
            ti promette che Pannion verrà quando ne avrai bisogno.
          pe: { natura: 5 }
          almeno: { rep.pannion: 10 }
          effetti: { fazione.pannion: 1, monete: 350, oggetto.pannion-scure-di-linfa: 1, dono.pannion: 1 }
        fallimento:
          titolo: La luce che non basta
          testo: |
            Il tronco passa oltre la tua lanterna diretto al Vecchio, e un ramo ti
            butta in mezzo alla piazza. Darrin lo tiene lontano con le torce fino
            all'alba. La notte dopo salirà di nuovo, e Darrin sarà ancora lì.
          effetti: { ferite: 1, tormento: 0.5 }
      - testo: "Mettere la mano sul Vecchio insieme a Darrin"
        descrizione: "Con la scheggia del Vecchio al collo il Vecchio ti ascolta come uno di casa, se resti fermo mentre la cosa arriva."
        requisiti: [chiave.vecchio >= 1]
        prova: { attributo: sociale, abilita: [empatia, persuasione], difficolta: Difficile }
        successo:
          titolo: Due mani sulla corteccia
          testo: |
            Con la mano sul Vecchio accanto a quella di Darrin lo chiamate per nome, e le sue radici salgono a stringere quelle del tronco
            nero finché si ferma.

            All'alba, da un ramo caduto nella notte, il fabbro fa il manico di una scure temprata nella linfa rossa. Darrin te la mette in
            mano davanti a tutti, ti chiama «Radice» e ti promette che Pannion verrà quando ne avrai bisogno.
          pe: { empatia: 5 }
          almeno: { rep.pannion: 10 }
          effetti: { fazione.pannion: 1, monete: 350, oggetto.pannion-scure-di-linfa: 1, dono.pannion: 1 }
        fallimento:
          titolo: La mano che si stacca
          testo: |
            La tua mano si stacca dalla corteccia da sola, e un ramo ti scaraventa via e
            prende Darrin alla spalla. Fino all'alba lo tenete lontano con le torce. La
            notte dopo salirà di nuovo, e Darrin sarà ancora lì.
          effetti: { ferite: 1, tormento: 1 }
      - testo: "Aprire le carbonaie e piegarlo con il fumo"
        descrizione: "Il fumo di Pannion lo piega, ma una carbonaia aperta può prendere fuoco."
        prova: { attributo: mentale, abilita: [natura, tecnologia], difficolta: Difficile }
        successo:
          titolo: La nuvola
          testo: |
            Togli le zolle alle carbonaie, e nella nuvola grigia il tronco si inginocchia a dieci passi dal Vecchio e mette radici.

            All'alba, da un ramo caduto nella notte, il fabbro fa il manico di una scure temprata nella linfa rossa. Darrin te la mette in mano
            davanti a tutta Pannion, ti chiama «Radice» e ti promette che Pannion verrà quando ne avrai bisogno.
          pe: { natura: 5 }
          almeno: { rep.pannion: 10 }
          effetti: { fazione.pannion: 1, monete: 350, oggetto.pannion-scure-di-linfa: 1, dono.pannion: 1 }
        fallimento:
          titolo: La carbonaia in fiamme
          testo: |
            Una carbonaia si accende tutta e il fuoco corre al pontile più vicino, e passate la
            notte a spegnerlo mentre Darrin tiene la cosa lontana con le torce. La notte dopo
            salirà di nuovo, e Darrin sarà ancora lì.
          effetti: { ferite: 0.5, scandalo: 1 }
      - testo: "Chiamarlo come al Circolo si chiama il bosco"
        descrizione: "Al Circolo un bosco che ha dimenticato la sua forma si chiama a voce bassa, finché si ricorda."
        quando: [origine.figlio-del-circolo >= 1]
        prova: { attributo: mentale, abilita: [natura, magia], difficolta: Difficile }
        successo:
          titolo: La forma
          testo: |
            Lo chiami a voce bassa come ti hanno insegnato, e il tronco si piega fino a terra e mette radici a dieci passi dal Vecchio.

            All'alba, da un ramo caduto nella notte, il fabbro fa il manico di una scure temprata nella linfa rossa. Darrin te la mette in mano
            davanti a tutta Pannion, ti chiama «Radice» e ti promette che Pannion verrà quando ne avrai bisogno.
          pe: { natura: 5 }
          almeno: { rep.pannion: 10 }
          effetti: { fazione.pannion: 1, monete: 350, oggetto.pannion-scure-di-linfa: 1, dono.pannion: 1 }
        fallimento:
          titolo: La voce coperta
          testo: |
            La tua voce si perde nel rumore dei rami, e il tronco ti passa accanto. Darrin lo tiene lontano con le torce fino
            all'alba. La notte dopo salirà di nuovo, e Darrin sarà ancora lì.
          effetti: { ferite: 0.5, tormento: 1 }
