# La quest di Pannion, passo 11 (fazione.pannion 10 → 11): la spedizione nella vecchia Pannion, il villaggio di
# prima nella valle sotto l'altura, con la Conca degli specchi in mezzo alla piazza (codex sf-conca-degli-specchi).
# Si scende la notte della luna piena dal crinale delle carbonaie di Delek. L'ingresso (`pannion-la-discesa`, nella
# Superficie, presso Pannion) ha una via a cavallo a costo 0 e, con pannion.delek 1, la via dietro Delek.
# Le stanze vanno in fasce di profondità (una stanza superata non ricompare nella stessa visita):
# 0 il fiume di vetro o i pali delle lanterne (la strada che scende dall'altura), 1 la casa presa dalle radici o i
# cinghiali rossi (le prime case), 2 la cappella sepolta o la radice del Vecchio (il cuore del villaggio), 3 la
# piazza di vetro o le radici di vetro (il bordo della piazza); le luci che rispondono valgono da 1 a 3.
# Il cuore a 4 è la Conca degli specchi: le radici del Vecchio bevono nella vasca, nell'acqua gli sconosciuti
# alzano la testa tutti insieme, e dall'acqua sale il custode (boss). Le vie sono Difficili; chi fallisce o perde
# torna in Superficie senza chiudere il passo. pannion.conca 1 se hai guardato l'acqua sotto la luna, 2 se hai
# dovuto combattere o spezzare il custode.
aree:
  - id: pannion-vecchia-pannion
    immagine: ambientazione/foresta-strisciante
    nome: La vecchia Pannion
    sommario: "Il villaggio di prima, nella valle sotto l'altura, con la Conca degli specchi in mezzo alla piazza."
    spedizione: { ritorno: superficie-fratturata, soglia: 4, stanze: 3 }
    testo: |
      Le sequoie della valle stanno fra le case come colonne in una chiesa
      troppo grande, e la linfa scesa settant'anni fa riempie ancora le
      strade fino alle finestre, in fiumi di vetro rosso dove si specchia la
      luna. In fondo alla strada grande c'è la Conca degli specchi, e nessuno
      di Pannion ci guarda dentro da quando è salito sull'altura.

colonna:
  - { contesto: area, id: pannion-vecchia-pannion, musica: uncharted-dreams, ambiente: forest-night }

storylet:
  # ------------------------------------------------------------ l'ingresso, nella Superficie
  - id: pannion-la-discesa
    presso: pannion
    immagine: ambientazione/foresta-strisciante
    titolo: La discesa
    sommario: "La notte della luna piena si scende nella valle dal crinale di Delek."
    luogo: Pannion, il crinale delle carbonaie basse, la notte della luna piena
    area: superficie-fratturata
    requisiti: [fazione.pannion == 10]
    testo: |
      La notte della luna piena Darrin ti accompagna fino al crinale delle carbonaie di Delek, ti stringe la mano una volta sola e torna su verso il
      Vecchio. Dietro di te Liduina ha acceso tutte le lanterne del pontile più lungo. Sotto il crinale il pendio scende fra le sequoie grandi verso i
      primi tetti senza fumo e i pali storti di una vecchia strada di lanterne.

      {natura Media} Dove passa la radice grossa del Vecchio, dritta giù per il pendio, i rovi sono più radi, perché anche il bosco le lascia la strada.
    opzioni:
      - testo: "Scendere per la strada vecchia, dai pali delle lanterne"
        descrizione: "Liduina ti ha spiegato la strada palo per palo, ma al buio i pali si vedono appena."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Media }
        successo:
          titolo: Palo per palo
          testo: |
            Scendi da un palo all'altro come ti ha detto Liduina, con una mano
            sempre su qualcosa, fino in fondo alla valle.
          pe: { atletica: 2 }
          vai: pannion-vecchia-pannion
        fallimento:
          titolo: Il pendio
          testo: |
            Un palo ti si spezza in mano, e scivoli fino in fondo fra gli aghi.
          effetti: { ferite: 0.5, tormento: 0.5 }
          vai: pannion-vecchia-pannion
      - testo: "Seguire la radice del Vecchio"
        descrizione: "La radice grossa scende dritta verso la valle, se non la perdi al buio."
        prova: { attributo: mentale, abilita: [natura, percezione], difficolta: Media }
        successo:
          titolo: La radice come guida
          testo: |
            Tieni la mano sulla radice tiepida fino alla prima strada della
            vecchia Pannion, dove sparisce sotto il vetro.
          pe: { natura: 2 }
          vai: pannion-vecchia-pannion
        fallimento:
          titolo: Due radici
          testo: |
            Segui la radice sbagliata fino a un burrone, e arrivi in fondo con
            un'ora di ritardo.
          effetti: { tormento: 0.5 }
          vai: pannion-vecchia-pannion
      - testo: "Scendere dietro Delek"
        descrizione: "Delek ti aspetta sul crinale con la sua lanterna, come ha promesso."
        quando: [pannion.delek >= 1]
        esito:
          titolo: Dietro Delek
          testo: |
            Delek scende davanti a te senza una parola fino alla prima casa, dove
            si ferma. Più in là non va, e resterà lì ad aspettarti con la lanterna
            accesa.
          vai: pannion-vecchia-pannion
      - testo: "Scendere a cavallo per la strada dei carri"
        descrizione: "Prima della linfa una strada dei carri scendeva nella valle dal lato del bosco."
        requisiti: [chiave.cavalcatura >= 1]
        costo: 0
        esito:
          titolo: La strada dei carri
          testo: |
            Il cavallo trova sotto gli aghi la vecchia strada dei carri e la segue giù fino al primo fiume di vetro, dove lo leghi.
          vai: pannion-vecchia-pannion
      - testo: "Calarsi con le corde della squadra"
        descrizione: "I paletti della squadra arrivano fino al primo fiume di vetro, e con le corde si scende sicuri."
        costo: 2
        esito:
          titolo: Le corde
          testo: |
            Ti cali da un paletto all'altro, e in fondo hai le mani bruciate dalla
            canapa.
          effetti: { tormento: 0.5 }
          vai: pannion-vecchia-pannion

  # ------------------------------------------------------------ 0 · il fiume di vetro e i pali delle lanterne
  - id: pannion-vp-il-fiume-di-vetro
    immagine: ambientazione/foresta-strisciante
    titolo: Il fiume di vetro
    sommario: "La prima strada della vecchia Pannion è piena di linfa indurita fino alle finestre."
    luogo: La vecchia Pannion, la strada che scende dall'altura
    area: pannion-vecchia-pannion
    ripetibile: true
    requisiti: [fazione.pannion == 10, profondita.pannion-vecchia-pannion == 0]
    testo: |
      La prima strada della vecchia Pannion è un fiume di linfa indurita che
      la riempie da un muro all'altro fino alle finestre. A un palmo sotto il
      vetro ci sono ancora un secchio, una scarpa da bambino e un cesto di
      castagne.

      {acrobazia Media} Il vetro è liscio dove la linfa è scesa piano, e
      tagliente dove si è spaccato. Si cammina sul liscio, a piedi larghi.
    opzioni:
      - testo: "Attraversare sul vetro"
        descrizione: "A piedi larghi, sul liscio, evitando le crepe."
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Media }
        successo:
          titolo: Sul liscio
          testo: |
            Attraversi a braccia aperte, e la scarpa da bambino ti passa sotto gli
            stivali.
          pe: { acrobazia: 2 }
          effetti: { profondita.pannion-vecchia-pannion: 1 }
        fallimento:
          titolo: La crepa
          testo: |
            Il piede ti finisce in una crepa, e il vetro ti apre lo stivale e la
            caviglia.
          effetti: { ferite: 0.5 }
      - testo: "Cercare un tronco caduto per passare sopra"
        descrizione: "Un tronco caduto di traverso è un ponte."
        prova: { attributo: mentale, abilita: [percezione, natura], difficolta: Media }
        successo:
          titolo: Il ponte di sequoia
          testo: |
            Una sequoia caduta di traverso fa da ponte, e ci passi sopra a
            cavalcioni.
          pe: { percezione: 2 }
          effetti: { profondita.pannion-vecchia-pannion: 1 }
        fallimento:
          titolo: Il cesto di castagne
          testo: |
            Cerchi a lungo un tronco che non c'è, e torni sempre sopra il cesto di
            castagne.
          effetti: { tormento: 0.5 }
      - testo: "Spezzare il vetro con la scure e farti un sentiero"
        descrizione: "Il vetro di linfa si spezza a colpi di scure, e le schegge tagliano."
        costo: 2
        esito:
          titolo: Le schegge
          testo: |
            Ti apri un sentiero a colpi di scure lungo il bordo della strada, con
            le schegge rosse che ti saltano addosso.
          effetti: { profondita.pannion-vecchia-pannion: 1, ferite: 0.5 }

  - id: pannion-vp-i-pali-delle-lanterne
    immagine: icone/old-lantern
    titolo: I pali delle lanterne
    sommario: "Lungo la strada restano i pali delle lanterne, e su uno c'è ancora una lanterna intera."
    luogo: La vecchia Pannion, la strada delle lanterne
    area: pannion-vecchia-pannion
    ripetibile: true
    requisiti: [fazione.pannion == 10, profondita.pannion-vecchia-pannion == 0]
    testo: |
      Lungo la strada ci sono ancora i pali delle lanterne, uno ogni tre
      passi come sui pontili, piegati dalle radici. Su uno c'è la lanterna
      con il vetro intero che dall'altura si vede accendersi di notte, e su
      ogni palo è inciso un segno.

      {accademiche Media} Sono nomi di famiglia incisi con la punta di un
      coltello, gli stessi che Liduina dice quando conta le lanterne.
    opzioni:
      - testo: "Leggere i nomi sui pali e seguirne l'ordine"
        descrizione: "Liduina dice i nomi in un ordine preciso, e sui pali dovrebbe essere lo stesso."
        prova: { attributo: mentale, abilita: [accademiche, percezione], difficolta: Media }
        successo:
          titolo: L'ordine dei nomi
          testo: |
            I nomi, nell'ordine di Liduina, ti portano su una strada lastricata verso le prime case.
          pe: { accademiche: 2 }
          effetti: { profondita.pannion-vecchia-pannion: 1 }
        fallimento:
          titolo: Il nome che manca
          testo: |
            Un nome manca, e giri fra i tronchi fino al palo da cui sei partito.
          effetti: { tormento: 0.5 }
      - testo: "Raddrizzare il palo e appendere la tua luce"
        descrizione: "Sui pontili una lanterna in più si appende sempre, ma qui il palo va raddrizzato prima."
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Media }
        successo:
          titolo: Una luce in più
          testo: |
            Raddrizzi il palo con la spalla e ci appendi una delle lanterne di
            Liduina, e la strada si vede fino alle prime case.
          pe: { atletica: 2 }
          effetti: { profondita.pannion-vecchia-pannion: 1 }
        fallimento:
          titolo: Il palo marcio
          testo: |
            Il palo è marcio e ti si spacca contro la spalla, lasciandoti una
            scheggia nel braccio.
          effetti: { ferite: 0.5 }
      - testo: "Passare al buio, senza luci"
        descrizione: "Al buio il bosco si sente meglio, e fa più paura."
        costo: 2
        esito:
          titolo: Al tatto
          testo: |
            Copri la lanterna e cammini con una mano sui pali, fra i rumori che il
            bosco fa soltanto al buio.
          effetti: { profondita.pannion-vecchia-pannion: 1, tormento: 0.5 }

  # ------------------------------------------------------------ 1 · la casa presa e i cinghiali rossi
  - id: pannion-vp-la-casa-presa
    immagine: ambientazione/foresta-strisciante
    titolo: La casa presa dalle radici
    sommario: "Una casa aperta in due da una sequoia, con le cose del piano di sopra rimaste dove stavano."
    luogo: La vecchia Pannion, le prime case
    area: pannion-vecchia-pannion
    ripetibile: true
    requisiti: [fazione.pannion == 10, profondita.pannion-vecchia-pannion == 1]
    testo: |
      Una sequoia è cresciuta dentro una casa e l'ha aperta in due, come un
      ospite che nessuno ha invitato. Al piano terra la linfa arriva al
      davanzale, e dalla breccia si vede il piano di sopra, con un letto
      dalla coperta tirata e un vestito piegato su una sedia.

      {furtivita Media} Le assi del piano di sopra sono vecchie di
      settant'anni, e reggono se ci cammini lungo i muri.
    opzioni:
      - testo: "Attraversare la casa al piano di sopra"
        descrizione: "Si sale dalla breccia e si cammina lungo i muri fino all'altra finestra."
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Media }
        successo:
          titolo: Lungo i muri
          testo: |
            Le assi scricchiolano senza cedere, e passando accanto al letto non
            guardi la coperta.
          pe: { furtivita: 2 }
          effetti: { profondita.pannion-vecchia-pannion: 1 }
        fallimento:
          titolo: L'asse
          testo: |
            Un'asse cede, e la gamba ti finisce nel vuoto fino al ginocchio. Torni
            indietro dalla breccia.
          effetti: { ferite: 0.5 }
      - testo: "Frugare nella stanza di sopra"
        descrizione: "Chi è salito sull'altura ha portato via soltanto le lanterne."
        prova: { attributo: mentale, abilita: [percezione, tecnologia], difficolta: Media }
        successo:
          titolo: La cassetta sotto il letto
          testo: |
            Sotto il letto c'è una cassetta con dentro una scheggia di metallo
            inciso, avvolta in un panno, e la prendi chiedendo scusa a nessuno.
          pe: { percezione: 2 }
          effetti: { profondita.pannion-vecchia-pannion: 1, reliquie.scheggia: 1 }
        fallimento:
          titolo: Il vestito piegato
          testo: |
            Il vestito piegato ti cade sui piedi e si sbriciola in polvere, ed
            esci senza voltarti.
          effetti: { tormento: 0.5 }
      - testo: "Girare intorno alla casa nell'erba alta"
        descrizione: "La casa si evita girandoci intorno fra i rovi e l'erba alta."
        costo: 2
        esito:
          titolo: I rovi
          testo: |
            Giri intorno alla casa fra i rovi, e dall'altra parte ti togli le
            spine dai polsi.
          effetti: { profondita.pannion-vecchia-pannion: 1, ferite: 0.5 }

  - id: pannion-vp-i-cinghiali-rossi
    immagine: bestiario/cinghiale-crudele-mutato
    titolo: I cinghiali rossi
    sommario: "Fra le case grufolano due cinghiali con la schiena incrostata di linfa."
    luogo: La vecchia Pannion, l'orto dietro le case
    area: pannion-vecchia-pannion
    ripetibile: true
    requisiti: [fazione.pannion == 10, profondita.pannion-vecchia-pannion == 1]
    testo: |
      Nell'orto dietro le prime case due cinghiali grufolano fra le radici, con la linfa
      rossa che sulla schiena gli fa una corazza di schegge. Quando ti sentono alzano il
      muso, e il più grosso raspa la terra con lo zoccolo.

      {addestrare-animali Media} Hanno la pancia piena e difendono l'orto come una casa. Se
      capiscono che passi e basta, forse ti lasciano passare.
    opzioni:
      - testo: "Affrontare i cinghiali"
        descrizione: "Due bestie con la schiena di vetro, e l'orto stretto per tutti."
        combattimento: pannion-cinghiali
        vittoria:
          titolo: L'orto libero
          testo: |
            Il secondo cinghiale scappa fra i tronchi lasciando una scia di
            schegge rosse.
          effetti: { profondita.pannion-vecchia-pannion: 1 }
        sconfitta:
          titolo: Lo zoccolo
          testo: |
            Il più grosso ti prende al fianco e ti butta contro un muro, e torni
            indietro strisciando.
      - testo: "Fargli capire che passi e basta"
        descrizione: "Piano, di lato, senza guardarli negli occhi."
        prova: { attributo: sociale, abilita: [addestrare-animali, empatia], difficolta: Media }
        successo:
          titolo: Di lato
          testo: |
            Cammini di lato con gli occhi bassi, e il cinghiale più grosso sbuffa
            e torna a grufolare.
          pe: { addestrare-animali: 2 }
          effetti: { profondita.pannion-vecchia-pannion: 1 }
        fallimento:
          titolo: La carica
          testo: |
            Il più grosso carica dopo tre passi, e salti dietro un muro appena in
            tempo.
          effetti: { tormento: 0.5 }
      - testo: "Aspettare che se ne vadano"
        descrizione: "Prima o poi i cinghiali vanno a grufolare altrove."
        costo: 2
        esito:
          titolo: L'attesa
          testo: |
            Resti accucciato dietro un muro finché se ne vanno, e trovi l'orto
            vuoto e pieno di buche.
          effetti: { profondita.pannion-vecchia-pannion: 1, tormento: 0.5 }

  # ------------------------------------------------------------ 1–3 · le luci che rispondono
  - id: pannion-vp-le-luci-che-rispondono
    immagine: icone/paper-lantern
    titolo: Le luci che rispondono
    sommario: "Fra i tronchi si accende una luce piccola che si ferma quando ti fermi."
    luogo: La vecchia Pannion, fra i tronchi
    area: pannion-vecchia-pannion
    ripetibile: true
    requisiti: [fazione.pannion == 10, profondita.pannion-vecchia-pannion >= 1, profondita.pannion-vecchia-pannion <= 3]
    testo: |
      Fra i tronchi, una trentina di passi più avanti, si accende una luce
      piccola all'altezza di una lanterna tenuta in mano. Quando ti fermi si
      ferma anche lei, e se alzi la tua lanterna lei si alza. La strada vera
      va da un'altra parte, a sinistra, fra due case.

      {resilienza Media} È la tua luce riflessa da un fiume di vetro, oppure
      no. La mente sceglie la prima spiegazione, le gambe la seconda.
    opzioni:
      - testo: "Seguire la luce"
        descrizione: "Un riflesso porta a un fiume di vetro, e qualunque altra cosa forse a peggio."
        prova: { attributo: mentale, abilita: [resilienza, percezione], difficolta: Media }
        successo:
          titolo: Il riflesso
          testo: |
            La luce si ferma davanti a un fiume di vetro che fa da specchio alla
            tua lanterna, e il fiume scende verso il cuore del villaggio.
          pe: { resilienza: 2 }
          effetti: { profondita.pannion-vecchia-pannion: 1 }
        fallimento:
          titolo: La luce che si allontana
          testo: |
            La luce si allontana a ogni passo, finché non sai più da che parte è
            l'altura e torni indietro.
          effetti: { tormento: 0.5 }
      - testo: "Coprire la lanterna e vedere che cosa resta"
        descrizione: "Se è un riflesso, al buio sparisce."
        prova: { attributo: fisico, abilita: [furtivita, resistenza], difficolta: Media }
        successo:
          titolo: Il buio
          testo: |
            Al buio la luce piccola si spegne con la tua, e sotto la luna vedi la strada vera.
          pe: { furtivita: 2 }
          effetti: { profondita.pannion-vecchia-pannion: 1 }
        fallimento:
          titolo: La luce che resta
          testo: |
            La luce piccola resta accesa da sola per un momento, e riaccendi la
            tua in fretta.
          effetti: { tormento: 0.5 }
      - testo: "Ignorarla e tenere la strada di Liduina"
        descrizione: "Liduina ti ha detto la strada, e la strada va a sinistra."
        costo: 2
        esito:
          titolo: Senza voltarsi
          testo: |
            Prendi la strada a sinistra contando i passi, e la luce piccola ti cammina
            accanto finché sparisce.
          effetti: { profondita.pannion-vecchia-pannion: 1, tormento: 0.5 }

  # ------------------------------------------------------------ 2 · la cappella sepolta e la radice del Vecchio
  - id: pannion-vp-la-cappella-sepolta
    immagine: fazioni/confraternita-del-velo
    titolo: La cappella sepolta
    sommario: "La cappella della vecchia Pannion è piena di linfa fino all'altare."
    luogo: La vecchia Pannion, la cappella
    area: pannion-vecchia-pannion
    ripetibile: true
    requisiti: [fazione.pannion == 10, profondita.pannion-vecchia-pannion == 2]
    testo: |
      La cappella ha il simbolo dell'Albero inciso sulla porta, come quella
      di Koln. Dentro la linfa arriva al piano dell'altare, e le panche si
      vedono sotto il vetro come barche affondate. Sull'altare restano le
      sette lanterne della funzione, e dietro c'è una lastra con
      un'iscrizione.

      {magia Media} Le lanterne sull'altare hanno il vetro rosso come la
      linfa, e il Mana intorno all'altare si ricorda che nessuno le ha mai
      riaccese.
    opzioni:
      - testo: "Leggere l'iscrizione dietro l'altare"
        descrizione: "Una lastra di pietra con una scritta lunga."
        prova: { attributo: mentale, abilita: [accademiche, magia], difficolta: Media }
        successo:
          titolo: La lastra
          testo: |
            È una preghiera per i boscaioli che non tornano, con i nomi sotto, e
            in fondo una frase incisa male, *riportateli a casa*. Dietro la lastra
            una porta bassa dà sulla strada grande.
          pe: { accademiche: 2 }
          effetti: { profondita.pannion-vecchia-pannion: 1, reliquie.frammento-inciso: 1 }
        fallimento:
          titolo: I nomi
          testo: |
            A metà dei nomi ti accorgi che li stai dicendo ad alta voce, e il
            rimbombo continua da solo.
          effetti: { tormento: 0.5 }
      - testo: "Salire sul tetto per vedere la piazza"
        descrizione: "Dal colmo del tetto sfondato si vede la strada grande."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Media }
        successo:
          titolo: Il colmo
          testo: |
            Dal colmo del tetto vedi la strada grande scendere fino a uno spiazzo
            rotondo che luccica sotto la luna.
          pe: { atletica: 2 }
          effetti: { profondita.pannion-vecchia-pannion: 1 }
        fallimento:
          titolo: La trave
          testo: |
            Una trave si sbriciola e cadi sull'altare fra le lanterne, che
            rotolano sul vetro.
          effetti: { ferite: 0.5 }
      - testo: "Uscire dalla porta da cui sei entrato e girare intorno"
        descrizione: "La cappella si gira dall'esterno, fra i rovi."
        costo: 2
        esito:
          titolo: Il giro della cappella
          testo: |
            Giri intorno alla cappella fra rovi e radici, e le mani ti bruciano
            fino a sera.
          effetti: { profondita.pannion-vecchia-pannion: 1, ferite: 0.5 }

  - id: pannion-vp-la-radice-del-vecchio
    immagine: icone/tree-roots
    titolo: La radice del Vecchio
    sommario: "La radice del Vecchio arriva fin qui, grossa come un uomo, e scende per la strada grande verso la piazza."
    luogo: La vecchia Pannion, la strada grande
    area: pannion-vecchia-pannion
    ripetibile: true
    requisiti: [fazione.pannion == 10, profondita.pannion-vecchia-pannion == 2]
    testo: |
      La radice grossa del Vecchio sbuca da sotto un fiume di vetro e corre in mezzo
      alla strada grande verso la piazza, grossa come un uomo sdraiato. Ogni tanto
      sotto la corteccia passa un movimento lento, e ai lati la strada è un
      groviglio di vetro e di travi.

      {natura Media} La radice beve. Il movimento sotto la corteccia va dalla piazza
      al Vecchio, e porta qualcosa.
    opzioni:
      - testo: "Camminare sulla radice fino alla piazza"
        descrizione: "La radice è larga come una trave da ponte e porta dritta alla piazza."
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Media }
        successo:
          titolo: Sulla radice
          testo: |
            Cammini sulla radice tiepida, e a metà strada il movimento lento ti
            passa sotto i piedi diretto all'altura.
          pe: { acrobazia: 2 }
          effetti: { profondita.pannion-vecchia-pannion: 1 }
        fallimento:
          titolo: Lo scivolone
          testo: |
            Scivoli sulla corteccia lucida e finisci di schiena sul vetro, con le
            schegge nella giubba.
          effetti: { ferite: 0.5 }
      - testo: "Appoggiare l'orecchio alla radice"
        descrizione: "Una radice che beve fa rumore, a sentirla da vicino."
        prova: { attributo: mentale, abilita: [natura, magia], difficolta: Media }
        successo:
          titolo: Il rumore dell'acqua
          testo: |
            Sotto la corteccia l'acqua sale piano dalla piazza, come in una
            grondaia, e la segui controcorrente.
          pe: { natura: 2 }
          effetti: { profondita.pannion-vecchia-pannion: 1 }
        fallimento:
          titolo: L'altro rumore
          testo: |
            Sotto l'acqua senti un suono basso e lunghissimo, e ti stacchi con
            quel suono nei denti.
          effetti: { tormento: 0.5 }
      - testo: "Arrampicarsi fra le travi a lato della strada"
        descrizione: "Le case crollate fanno un groviglio di travi lungo tutta la strada."
        costo: 2
        esito:
          titolo: Il groviglio
          testo: |
            Passi di trave in trave, e arrivi in fondo con le mani nere di muffa e
            un taglio sul palmo.
          effetti: { profondita.pannion-vecchia-pannion: 1, ferite: 0.5 }

  # ------------------------------------------------------------ 3 · la piazza di vetro e le radici di vetro
  - id: pannion-vp-la-piazza-di-vetro
    immagine: ambientazione/rovine-dei-precursori
    titolo: La piazza di vetro
    sommario: "Il bordo della piazza è un lago di linfa indurita sopra il mercato dell'ultimo giorno."
    luogo: La vecchia Pannion, il bordo della piazza
    area: pannion-vecchia-pannion
    ripetibile: true
    requisiti: [fazione.pannion == 10, profondita.pannion-vecchia-pannion == 3]
    testo: |
      Il bordo della piazza è un lago di linfa indurita, e sotto il vetro pieno di crepe
      sottili c'è ancora il mercato dell'ultimo giorno, con un carretto senza mulo fra i
      banchi. In mezzo, dove la linfa non è arrivata, c'è la pietra chiara della Conca, a
      cinquanta passi di vetro da te.

      {percezione Media} Le crepe si allargano intorno alla Conca in cerchi, come se il
      vetro fosse stato battuto da sotto, piano, tante volte.
    opzioni:
      - testo: "Attraversare la piazza seguendo le crepe sottili"
        descrizione: "Il vetro regge dove le crepe sono sottili."
        prova: { attributo: mentale, abilita: [percezione, tecnologia], difficolta: Media }
        successo:
          titolo: Le crepe sottili
          testo: |
            Cammini dove le crepe sono sottili, e il vetro regge con un suono di
            ghiaccio fino alla pietra chiara.
          pe: { percezione: 2 }
          effetti: { profondita.pannion-vecchia-pannion: 1 }
        fallimento:
          titolo: Il vetro che cede
          testo: |
            Il vetro cede e la gamba ti finisce in un buco fino alla coscia, fra i
            banchi.
          effetti: { ferite: 0.5 }
      - testo: "Strisciare sul vetro per spartire il peso"
        descrizione: "Pancia a terra e braccia larghe, come sul ghiaccio sottile."
        prova: { attributo: fisico, abilita: [furtivita, resistenza], difficolta: Media }
        successo:
          titolo: Come sul ghiaccio
          testo: |
            Strisci con le braccia larghe sopra i banchi del mercato, e arrivi
            alla pietra chiara con i gomiti rossi.
          pe: { resistenza: 2 }
          effetti: { profondita.pannion-vecchia-pannion: 1 }
        fallimento:
          titolo: Il carretto
          testo: |
            A metà strada, sotto la faccia, passa il carretto senza mulo, e torni
            indietro senza guardarci dentro.
          effetti: { tormento: 0.5 }
      - testo: "Fare il giro lungo il muro delle case"
        descrizione: "Lungo il muro delle case il vetro è più spesso, e il giro è lungo il doppio."
        costo: 2
        esito:
          titolo: Il giro della piazza
          testo: |
            Fai il giro lungo il muro delle case e arrivi alla pietra chiara
            tremando di freddo.
          effetti: { profondita.pannion-vecchia-pannion: 1, tormento: 0.5 }

  - id: pannion-vp-le-radici-di-vetro
    immagine: ambientazione/foresta-strisciante
    titolo: Le radici di vetro
    sommario: "All'imbocco della piazza due radici coperte di linfa indurita si chiudono intorno a quello che passa."
    luogo: La vecchia Pannion, l'imbocco della piazza
    area: pannion-vecchia-pannion
    ripetibile: true
    requisiti: [fazione.pannion == 10, profondita.pannion-vecchia-pannion == 3]
    testo: |
      All'imbocco della piazza due radici grosse come gambe escono dal vetro, coperte di linfa
      indurita che taglia come un coccio. Quando un ramo secco ci cade sopra si chiudono intorno al
      ramo e lo spezzano, e fra le due c'è la pietra chiara della Conca.

      {armi-da-mischia Media} La linfa sulle radici è più sottile dove si piegano, e lì si
      colpisce.
    opzioni:
      - testo: "Aprirsi la strada fra le radici"
        descrizione: "Due radici di vetro, da colpire nelle giunture."
        combattimento: pannion-radici
        vittoria:
          titolo: Le giunture
          testo: |
            Le colpisci dove si piegano, e la linfa si spacca con un rumore di
            stoviglie. Le radici ricadono sul vetro, ferme.
          effetti: { profondita.pannion-vecchia-pannion: 1 }
        sconfitta:
          titolo: La stretta
          testo: |
            Una radice ti si chiude intorno alla gamba, e il vetro ti entra nella
            carne prima che tu te ne liberi.
      - testo: "Passare fra le radici senza toccarle"
        descrizione: "Bisogna passare nel mezzo piano, senza sfiorarle."
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Media }
        successo:
          titolo: Nel mezzo
          testo: |
            Passi nel mezzo di fianco, con la pancia in dentro, e le radici ti
            sfiorano la giubba senza chiudersi.
          pe: { furtivita: 2 }
          effetti: { profondita.pannion-vecchia-pannion: 1 }
        fallimento:
          titolo: La manica
          testo: |
            Una radice ti prende la manica, che si strappa prima del braccio, e
            torni indietro di corsa.
          effetti: { ferite: 0.5 }
      - testo: "Dar loro da stringere un tronco"
        descrizione: "Un tronco buttato in mezzo le tiene occupate."
        prova: { attributo: mentale, abilita: [natura, tecnologia], difficolta: Media }
        successo:
          titolo: Il tronco
          testo: |
            Spingi un tronco marcio fra le radici, e mentre si chiudono a
            spezzarlo passi dall'altra parte.
          pe: { natura: 2 }
          effetti: { profondita.pannion-vecchia-pannion: 1 }
        fallimento:
          titolo: Il tronco leggero
          testo: |
            Il tronco è troppo leggero e le radici lo spezzano in un momento, poi
            si voltano verso di te.
          effetti: { tormento: 0.5 }
      - testo: "Tagliarle a colpi di scure"
        descrizione: "La scure contro il vetro, un colpo dopo l'altro, e il vetro taglia anche chi colpisce."
        costo: 2
        esito:
          titolo: Le schegge
          testo: |
            Ogni colpo di scure ti manda addosso una pioggia di schegge rosse, e
            alla fine hai le braccia piene di tagli sottili.
          effetti: { profondita.pannion-vecchia-pannion: 1, ferite: 1 }

  # ------------------------------------------------------------ il cuore · la Conca degli specchi
  - id: pannion-la-conca-degli-specchi
    immagine: ambientazione/rovine-dei-precursori
    titolo: La Conca degli specchi
    sommario: "In mezzo alla piazza c'è una vasca di pietra dove bevono le radici del Vecchio, e nell'acqua c'è gente che non conosci."
    luogo: La vecchia Pannion, la Conca degli specchi
    area: pannion-vecchia-pannion
    requisiti: [fazione.pannion == 10, profondita.pannion-vecchia-pannion >= 4]
    testo: |
      La Conca degli specchi è una vasca rotonda di pietra chiara in un
      anello di terra nuda dove la linfa non è arrivata. Tre radici nere del
      Vecchio scendono dal bordo a bere nell'acqua come da una scodella.

      La luna è ancora dietro le sequoie, e nell'acqua c'è la luce grigia di
      un altro giorno, con persone in fogge mai viste, chine su pareti lisce
      che toccano con due dita. Poi alzano la testa tutte insieme, e
      dall'acqua sale una figura di radici e di linfa di vetro, con la faccia
      di uno di loro.
    opzioni:
      - testo: "Affrontare il custode della conca"
        descrizione: "Radici e vetro, e una faccia che cambia a ogni colpo."
        combattimento: pannion-custode
        vittoria:
          titolo: La faccia giusta
          testo: |
            Il custode si spacca in schegge e radici che ricadono nella vasca, e
            la luna passa le cime. L'acqua ti restituisce la tua faccia, con il
            sangue sullo zigomo, e sul fondo raccogli frammenti di metallo inciso
            e un nucleo che sussurra. All'alba, dal crinale, vedi Pannion in
            piazza intorno al Vecchio.
          pe: { armi-da-mischia: 5 }
          imposta: { pannion.conca: 2 }
          effetti: { fazione.pannion: 1, reliquie.frammento-inciso: 2, parte.nucleo-2: 1 }
          vai: superficie-fratturata
        sconfitta:
          titolo: Il bordo della piazza
          testo: |
            Il custode ti butta fuori dall'anello di terra nuda, sul vetro che si
            incrina. All'alba risali senza aver guardato l'acqua sotto la luna.
          effetti: { tormento: 1 }
          vai: superficie-fratturata
      - testo: "Aspettare la luna senza guardare l'acqua"
        descrizione: "Sotto la luna la Conca mostra te, se resisti fino ad allora con il custode davanti."
        prova: { attributo: mentale, abilita: [resilienza, natura], difficolta: Difficile }
        successo:
          titolo: Sotto la luna
          testo: |
            Tieni gli occhi sulle cime finché la luna le passa, e il custode torna
            nella vasca come acqua. L'acqua ti restituisce la tua faccia, e sul
            bordo restano frammenti di metallo inciso e un nucleo che sussurra.
            All'alba, dal crinale, vedi Pannion in piazza intorno al Vecchio.
          pe: { resilienza: 5 }
          imposta: { pannion.conca: 1 }
          effetti: { fazione.pannion: 1, reliquie.frammento-inciso: 2, parte.nucleo-2: 1 }
          vai: superficie-fratturata
        fallimento:
          titolo: Gli occhi nell'acqua
          testo: |
            Gli occhi ti scendono sull'acqua, e il custode ti colpisce mentre
            guardi. All'alba risali senza aver visto la tua faccia.
          effetti: { ferite: 1, tormento: 1 }
          vai: superficie-fratturata
      - testo: "Spezzare le radici che lo tengono in piedi"
        descrizione: "La figura sta in piedi su radici che scendono nella vasca."
        prova: { attributo: fisico, abilita: [armi-da-mischia, atletica], difficolta: Difficile }
        successo:
          titolo: Le gambe di radice
          testo: |
            Colpite le radici che lo tengono, la figura si sbriciola nella vasca.
            Sotto la luna l'acqua ti restituisce la tua faccia, e sul fondo
            raccogli frammenti di metallo inciso e un nucleo che sussurra.
            All'alba, dal crinale, vedi Pannion in piazza intorno al Vecchio.
          pe: { armi-da-mischia: 5 }
          imposta: { pannion.conca: 2 }
          effetti: { fazione.pannion: 1, reliquie.frammento-inciso: 2, parte.nucleo-2: 1 }
          vai: superficie-fratturata
        fallimento:
          titolo: La radice che stringe
          testo: |
            Un'altra radice ti si chiude intorno al polso, e il custode ti butta
            sul vetro della piazza. All'alba risali con il polso gonfio.
          effetti: { ferite: 1, tormento: 0.5 }
          vai: superficie-fratturata
      - testo: "Posare la lanterna da pontile sul bordo della vasca"
        descrizione: "La luce delle lanterne di Pannion è calda e bassa come quella della luna."
        requisiti: [chiave.lanterna >= 1]
        prova: { attributo: mentale, abilita: [natura, magia], difficolta: Difficile }
        successo:
          titolo: La luce bassa
          testo: |
            Nella luce calda della lanterna gli sconosciuti spariscono e il
            custode torna nella vasca come acqua. L'acqua ti restituisce la tua
            faccia, e sul bordo restano frammenti di metallo inciso e un nucleo
            che sussurra. All'alba, dal crinale, vedi Pannion in piazza intorno al
            Vecchio.
          pe: { natura: 5 }
          imposta: { pannion.conca: 1 }
          effetti: { fazione.pannion: 1, reliquie.frammento-inciso: 2, parte.nucleo-2: 1 }
          vai: superficie-fratturata
        fallimento:
          titolo: La lanterna nell'acqua
          testo: |
            La lanterna cade nella vasca e si spegne con un sibilo, e risali
            all'alba con la manica che gocciola.
          effetti: { ferite: 0.5, tormento: 1 }
          vai: superficie-fratturata
      - testo: "Leggere i segni sul bordo della vasca"
        descrizione: "Sul bordo della Conca c'è un giro di segni che all'Accademia si chiamerebbero precuriani."
        quando: [origine.allievo-di-torvessa >= 1]
        prova: { attributo: mentale, abilita: [accademiche, tecnologia], difficolta: Difficile }
        successo:
          titolo: Il giro dei segni
          testo: |
            Al nono segno la pietra si fa tiepida e il custode torna nella vasca
            come acqua. L'acqua ti restituisce la tua faccia, e sul bordo restano
            frammenti di metallo inciso e un nucleo che sussurra. All'alba, dal
            crinale, vedi Pannion in piazza intorno al Vecchio.
          pe: { accademiche: 5 }
          imposta: { pannion.conca: 1 }
          effetti: { fazione.pannion: 1, reliquie.frammento-inciso: 2, parte.nucleo-2: 1 }
          vai: superficie-fratturata
        fallimento:
          titolo: Il segno sbagliato
          testo: |
            Al terzo segno la pietra ti scotta le dita, e risali all'alba con i
            polpastrelli pieni di vesciche.
          effetti: { ferite: 1, tormento: 0.5 }
          vai: superficie-fratturata
