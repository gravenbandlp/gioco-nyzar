# La quest di Pannion, passo 11 (fazione.pannion 10 → 11): la spedizione nella vecchia Pannion, il villaggio di
# prima nella valle sotto l'altura, con la Conca degli specchi in mezzo alla piazza (codex sf-conca-degli-specchi).
# Si scende la notte della luna piena dal crinale delle carbonaie di Delek. L'ingresso (`pannion-la-discesa`, nella
# Superficie, presso Pannion) ha una via a cavallo a costo 0 e, con pannion.delek 1, la via dietro Delek.
# Le stanze vanno in fasce di profondità (una stanza superata non ricompare nella stessa visita):
# 0 il fiume di vetro o i pali delle lanterne (la strada che scende dall'altura), 1 la casa presa dalle radici o i
# cinghiali rossi (le prime case), 2 la cappella sepolta o la radice del Vecchio (il cuore del villaggio), 3 la
# piazza di vetro o le radici di vetro (il bordo della piazza); le luci che rispondono valgono da 1 a 3.
# Il cuore a 4 è la Conca degli specchi: le radici del Vecchio bevono nella vasca, nell'acqua gli sconosciuti
# alzano la testa tutti insieme, e dall'acqua sale il custode (boss). Le vie sono Difficili; chi fallisce o perde
# torna in Superficie senza chiudere il passo. pannion.conca 1 se hai guardato l'acqua sotto la luna, 2 se hai
# dovuto combattere o spezzare il custode.
aree:
  - id: pannion-vecchia-pannion
    immagine: ambientazione/foresta-strisciante
    nome: La vecchia Pannion
    sommario: "Il villaggio di prima, nella valle sotto l'altura, dove le sequoie grandi e i fiumi di vetro si sono presi le case."
    spedizione: { ritorno: superficie-fratturata, soglia: 4, stanze: 3 }
    testo: |
      Le sequoie della valle sono il doppio di quelle dell'altura, e i tronchi stanno fra le case come colonne
      in una chiesa troppo grande. La linfa scesa settant'anni fa riempie ancora le strade fino alle finestre
      in fiumi di vetro rosso. In settant'anni il vetro non ha preso polvere né muschio, e dentro si vedono
      ancora le foglie cadute quell'estate. Le travi delle case invece sono nere e molli, e le radici hanno
      sfondato i muri. Dove la linfa non è arrivata l'erba è alta fino alla vita.

      In fondo alla strada grande c'è uno spiazzo rotondo con in mezzo la Conca degli specchi. Nessuno di
      Pannion ci guarda dentro da quando è salito sull'altura.

colonna:
  - { contesto: area, id: pannion-vecchia-pannion, musica: uncharted-dreams, ambiente: forest-night }

storylet:
  # ------------------------------------------------------------ l'ingresso, nella Superficie
  - id: pannion-la-discesa
    presso: pannion
    immagine: ambientazione/foresta-strisciante
    titolo: La discesa
    sommario: "La notte della luna piena si scende nella valle dal crinale delle carbonaie di Delek. Darrin resta in piazza con il Vecchio."
    luogo: Pannion, il crinale delle carbonaie basse, la notte della luna piena
    area: superficie-fratturata
    requisiti: [fazione.pannion == 10]
    testo: |
      La notte della luna piena Darrin ti accompagna fino al crinale delle carbonaie di Delek. Ti stringe la
      mano una volta sola e torna su verso il Vecchio, nero contro il cielo. Dietro di te Liduina ha acceso
      tutte le lanterne del pontile più lungo.

      Sotto il crinale il pendio scende fra le sequoie grandi, che hanno i tronchi larghi il doppio di quelle
      dell'altura. La luna arriva fra loro soltanto a strisce. Più giù si vedono i primi tetti senza fumo e i
      pali storti di una strada che aveva le sue lanterne. Dal bosco sotto il crinale non sale il verso di un
      uccello.

      {natura Media} La radice grossa del Vecchio scende dritta per il pendio, e il bosco le lascia la strada.
      Per tutta la sua lunghezza non ci cresce sopra un filo di muschio.
    opzioni:
      - testo: "Scendere per la strada vecchia, dai pali delle lanterne"
        descrizione: "Liduina ti ha spiegato la strada palo per palo. Al buio i pali si vedono appena, e il pendio è ripido."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Media }
        successo:
          titolo: Palo per palo
          testo: |
            Scendi da un palo all'altro come ti ha detto Liduina, con una mano sempre su qualcosa, e il pendio
            ti lascia passare. Il legno dei pali è grigio e consumato all'altezza della mano da chi ci si
            teneva prima di te. In fondo l'aria è più fredda, e sa di pietra bagnata e di resina.
          pe: { atletica: 2 }
          vai: pannion-vecchia-pannion
        fallimento:
          titolo: Il pendio
          testo: |
            A metà strada un palo ti si spezza in mano, e scivoli fino in fondo fra gli aghi delle sequoie.
            Hai le braccia graffiate, e la lanterna è ancora accesa. Del palo ti resta in mano un pezzo che
            dentro è nero e molle.
          effetti: { ferite: 0.5, tormento: 0.5 }
          vai: pannion-vecchia-pannion
      - testo: "Seguire la radice del Vecchio"
        descrizione: "La radice grossa scende dritta verso la valle, e il bosco le lascia la strada."
        prova: { attributo: mentale, abilita: [natura, percezione], difficolta: Media }
        successo:
          titolo: La radice come guida
          testo: |
            Tieni la mano sulla radice per tutta la discesa, e sotto il palmo la senti tiepida. Più scendi e
            più si scalda, anche quando l'aria intorno si fa fredda. Ti porta fino alla prima strada della
            vecchia Pannion, dove sparisce sotto un fiume di vetro.
          pe: { natura: 2 }
          vai: pannion-vecchia-pannion
        fallimento:
          titolo: Due radici
          testo: |
            A metà pendio le radici diventano due, e segui quella sbagliata fino a un burrone. Questa sotto la
            mano è fredda, e te ne accorgi solo sul bordo. Torni indietro al buio, e quando arrivi in fondo
            hai perso un'ora e la pazienza.
          effetti: { tormento: 0.5 }
          vai: pannion-vecchia-pannion
      - testo: "Scendere dietro Delek"
        descrizione: "Delek ha detto che con la luna piena scendeva con te, e ti aspetta sul crinale con la sua lanterna."
        quando: [pannion.delek >= 1]
        esito:
          titolo: Dietro Delek
          testo: |
            Delek scende davanti a te senza una parola, mettendo i piedi dove li ha messi cento volte, e tu
            metti i tuoi nei suoi. Nella terra del pendio i suoi passi hanno scavato buche lisce, e il piede
            ci entra da solo. In fondo al pendio si ferma alla prima casa e ti dice che lui più in là non va.
            Resterà lì ad aspettarti, con la lanterna accesa.
          vai: pannion-vecchia-pannion
      - testo: "Scendere a cavallo per la strada dei carri"
        descrizione: "Prima della linfa una strada dei carri scendeva nella valle dal lato del bosco. Un cavallo la trova anche dove è sparita."
        requisiti: [chiave.cavalcatura >= 1]
        costo: 0
        esito:
          titolo: La strada dei carri
          testo: |
            Il cavallo trova prima di te la vecchia strada dei carri sotto l'erba e gli aghi, e la segue giù
            per il fianco della valle senza fretta. Ogni tanto sotto gli zoccoli suona una pietra del
            selciato. In fondo si ferma davanti al primo fiume di vetro, e lì lo leghi. Mentre stringi il nodo
            tiene le orecchie girate verso la valle.
          vai: pannion-vecchia-pannion
      - testo: "Calarsi con le corde della squadra"
        descrizione: "I paletti della squadra arrivano fino al primo fiume di vetro. Con le corde si scende sicuri, e si scende piano."
        costo: 2
        esito:
          titolo: Le corde
          testo: |
            Ti cali da un paletto all'altro con le corde della squadra. La canapa è umida di rugiada e ti
            scorre fra le mani, e ci metti tanto che quando tocchi il fondo hai i palmi bruciati.
          effetti: { tormento: 0.5 }
          vai: pannion-vecchia-pannion

  # ------------------------------------------------------------ 0 · il fiume di vetro e i pali delle lanterne
  - id: pannion-vp-il-fiume-di-vetro
    immagine: ambientazione/foresta-strisciante
    titolo: Il fiume di vetro
    sommario: "La prima strada della vecchia Pannion è piena di linfa indurita fino alle finestre."
    luogo: La vecchia Pannion, la strada che scende dall'altura
    area: pannion-vecchia-pannion
    ripetibile: true
    requisiti: [fazione.pannion == 10, profondita.pannion-vecchia-pannion == 0]
    testo: |
      La prima strada della vecchia Pannion è piena di linfa indurita fino alle finestre. Il vetro è rosso e
      liscio, e la luna ci scivola sopra. Dentro la linfa è rimasta ferma una fila di bolle, tutte inclinate
      verso valle. Appena sotto ci sono ancora le cose di chi ci camminava, un secchio con il manico alzato e
      una scarpa da bambino. Più in là c'è un cesto di castagne, e le castagne sono ancora lucide.

      {acrobazia Media} Il vetro è liscio dove la linfa è scesa piano e tagliente dove si è spaccato. Le crepe
      hanno gli spigoli vivi e senza polvere. Si cammina sul liscio, a piedi larghi.

      Dall'altra parte la strada riprende fra due case sfondate.
    opzioni:
      - testo: "Attraversare sul vetro"
        descrizione: "A piedi larghi, sul liscio, evitando le crepe."
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Media }
        successo:
          titolo: Sul liscio
          testo: |
            Attraversi a piedi larghi, con le braccia aperte, e la scarpa da bambino ti passa sotto gli
            stivali. Ha il laccio annodato a metà. Dall'altra parte ti siedi un momento sulla soglia di una
            casa prima di andare avanti.
          pe: { acrobazia: 2 }
          effetti: { profondita.pannion-vecchia-pannion: 1 }
        fallimento:
          titolo: La crepa
          testo: |
            Il piede ti finisce in una crepa, e il bordo del vetro ti apre lo stivale e la caviglia. Il sangue
            scivola sul vetro e ha lo stesso colore. Torni indietro zoppicando a cercare un altro punto.
          effetti: { ferite: 0.5 }
      - testo: "Cercare un tronco caduto per passare sopra"
        descrizione: "Le sequoie della valle ogni tanto cadono, e un tronco caduto di traverso è un ponte."
        prova: { attributo: mentale, abilita: [percezione, natura], difficolta: Media }
        successo:
          titolo: Il ponte di sequoia
          testo: |
            Più giù una sequoia è caduta di traverso sulla strada, con la chioma su un tetto e le radici
            sull'altro lato. Ci passi sopra a cavalcioni senza toccare il vetro, e la corteccia secca si
            stacca a scaglie sotto le gambe.
          pe: { percezione: 2 }
          effetti: { profondita.pannion-vecchia-pannion: 1 }
        fallimento:
          titolo: Il cesto di castagne
          testo: |
            Cerchi a lungo un tronco che non c'è, e torni sempre allo stesso punto, sopra il cesto di
            castagne. Ogni volta lo riconosci dal secchio con il manico alzato. Alla terza volta ti sembra che
            le castagne siano più vicine al vetro.
          effetti: { tormento: 0.5 }
      - testo: "Spezzare il vetro con la scure e farti un sentiero"
        descrizione: "Il vetro di linfa si spezza a colpi di scure, e le schegge tagliano. Lento, e rumoroso."
        costo: 2
        esito:
          titolo: Le schegge
          testo: |
            Ti apri un sentiero a colpi di scure lungo il bordo della strada, con le schegge rosse che ti
            saltano addosso. Il rumore rimbalza fra i tronchi e torna indietro più forte, sempre dal lato del
            bosco. Vai avanti così finché arrivi dall'altra parte.
          effetti: { profondita.pannion-vecchia-pannion: 1, ferite: 0.5 }

  - id: pannion-vp-i-pali-delle-lanterne
    immagine: icone/old-lantern
    titolo: I pali delle lanterne
    sommario: "Lungo la strada che scende alla vecchia Pannion ci sono ancora i pali delle lanterne, storti."
    luogo: La vecchia Pannion, la strada delle lanterne
    area: pannion-vecchia-pannion
    ripetibile: true
    requisiti: [fazione.pannion == 10, profondita.pannion-vecchia-pannion == 0]
    testo: |
      Lungo la strada ci sono ancora i pali delle lanterne, uno ogni tre passi come sui pontili. Le radici li
      hanno piegati, e qualcuno tocca terra con la cima. Su uno è rimasta la lanterna che dall'altura si vede
      accendersi di notte. Ha il vetro intero, e quando la tua luce la sfiora il vetro si accende di rosso. Su
      ogni palo è inciso un segno.

      {accademiche Media} Sono nomi di famiglia, gli stessi che Liduina dice quando conta le lanterne. Le
      lettere sono incise a coltello, e su ogni palo la mano è diversa.

      Oltre l'ultimo palo la strada sparisce sotto gli aghi.
    opzioni:
      - testo: "Leggere i nomi sui pali e seguirne l'ordine"
        descrizione: "Liduina dice i nomi in un ordine preciso."
        prova: { attributo: mentale, abilita: [accademiche, percezione], difficolta: Media }
        successo:
          titolo: L'ordine dei nomi
          testo: |
            Segui i nomi palo dopo palo nell'ordine di Liduina, e l'ordine ti porta fuori dagli aghi, su una
            strada lastricata che scende verso le prime case. Le lastre sono consumate in due solchi
            paralleli, alla larghezza di un carro.
          pe: { accademiche: 2 }
          effetti: { profondita.pannion-vecchia-pannion: 1 }
        fallimento:
          titolo: Il nome che manca
          testo: |
            A un certo punto un nome manca, e il palo dopo ne porta uno che non conosci. Giri a lungo fra i
            tronchi con gli aghi che coprono il rumore dei passi, finché ritrovi l'ultimo palo da cui sei
            partit{o|a}.
          effetti: { tormento: 0.5 }
      - testo: "Raddrizzare il palo e appendere la tua luce"
        descrizione: "Sui pontili una lanterna in più si appende sempre. Qui il palo va raddrizzato prima."
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Media }
        successo:
          titolo: Una luce in più
          testo: |
            Raddrizzi il palo spingendolo con la spalla, e sotto terra senti schioccare le radici sottili che
            lo tenevano. Ci appendi una delle lanterne di Liduina. Nella luce nuova la strada si vede fino
            alle prime case, e da lassù, sull'altura, qualcuno la vede accendersi.
          pe: { atletica: 2 }
          effetti: { profondita.pannion-vecchia-pannion: 1 }
        fallimento:
          titolo: Il palo marcio
          testo: |
            Il palo è marcio dentro e ti si spacca contro la spalla, e ti ritrovi in ginocchio fra gli aghi
            con una scheggia nel braccio. Fuori il legno sembrava sano, e dentro è una polvere bruna che sa di
            funghi.
          effetti: { ferite: 0.5 }
      - testo: "Passare al buio, senza luci"
        descrizione: "Si copre la lanterna e si cammina fra i pali al tatto. Il bosco al buio si sente meglio, e fa più paura."
        costo: 2
        esito:
          titolo: Al tatto
          testo: |
            Copri la lanterna e cammini con una mano sui pali, uno dopo l'altro. Al buio il bosco fa rumori
            che di giorno non fa, e uno ti segue per un tratto sempre dalla stessa parte, con un fruscio di
            aghi pestati. Arrivi alle prime case con le spalle rigide.
          effetti: { profondita.pannion-vecchia-pannion: 1, tormento: 0.5 }

  # ------------------------------------------------------------ 1 · la casa presa e i cinghiali rossi
  - id: pannion-vp-la-casa-presa
    immagine: ambientazione/foresta-strisciante
    titolo: La casa presa dalle radici
    sommario: "Una casa che le radici di una sequoia hanno aperto in due."
    luogo: La vecchia Pannion, le prime case
    area: pannion-vecchia-pannion
    ripetibile: true
    requisiti: [fazione.pannion == 10, profondita.pannion-vecchia-pannion == 1]
    testo: |
      Una sequoia è cresciuta dentro una casa e l'ha aperta in due, e adesso il tronco sta in mezzo alla
      stanza grande. Le travi del soffitto sono spezzate dove il tronco è passato, e i monconi sono piegati
      verso l'alto. Al piano terra la linfa è arrivata fino al davanzale. Al piano di sopra, che si vede dalla
      breccia, c'è un letto con la coperta tirata e una sedia con sopra un vestito piegato. La coperta arriva
      fino al cuscino, come in una casa dove qualcuno torna la sera.

      {furtivita Media} Le assi del piano di sopra sono vecchie di settant'anni, e reggono se cammini lungo i
      muri. Al centro della stanza l'umido le ha imbarcate, e lungo i muri le tengono ancora i chiodi.

      Oltre la breccia la strada continua verso il cuore del villaggio.
    opzioni:
      - testo: "Attraversare la casa al piano di sopra"
        descrizione: "Si sale dalla breccia e si cammina lungo i muri, sopra il vetro, fino all'altra finestra."
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Media }
        successo:
          titolo: Lungo i muri
          testo: |
            Cammini lungo i muri con la schiena contro il legno, e le assi scricchiolano senza cedere. Il
            tronco ti passa a un braccio dalla spalla, e ne sale un odore di resina fresca. Passando accanto
            al letto non guardi la coperta. Esci dalla finestra dall'altra parte e ti cali sulla strada.
          pe: { furtivita: 2 }
          effetti: { profondita.pannion-vecchia-pannion: 1 }
        fallimento:
          titolo: L'asse
          testo: |
            Un'asse cede sotto il tallone, e la gamba ti finisce nel vuoto fino
            al ginocchio. Ti tiri su graffiandoti, e torni indietro dalla
            breccia.
          effetti: { ferite: 0.5 }
      - testo: "Frugare nella stanza di sopra"
        descrizione: "Chi è salito sull'altura ha portato via soltanto le lanterne."
        prova: { attributo: mentale, abilita: [percezione, tecnologia], difficolta: Media }
        successo:
          titolo: La cassetta sotto il letto
          testo: |
            Sotto il letto c'è una cassetta di legno con dentro una scheggia di metallo inciso, avvolta in un
            panno come una cosa preziosa. Il panno si sfalda fra le dita, e il metallo sotto è lucido e senza
            un segno di ruggine. La prendi, e chiedi scusa a nessuno prima di uscire dalla finestra dall'altra
            parte.
          pe: { percezione: 2 }
          effetti: { profondita.pannion-vecchia-pannion: 1, reliquie.scheggia: 1 }
        fallimento:
          titolo: Il vestito piegato
          testo: |
            Sposti la sedia per guardare sotto il letto, e il vestito piegato ti cade sui piedi e si sbriciola
            in polvere. La polvere ti resta sugli stivali fino alla strada, e non ha nessun odore. Esci dalla
            breccia da cui sei entrat{o|a}, senza voltarti.
          effetti: { tormento: 0.5 }
      - testo: "Girare intorno alla casa nell'erba alta"
        descrizione: "La casa si evita girandoci intorno fra i rovi e l'erba alta fino alla vita."
        costo: 2
        esito:
          titolo: I rovi
          testo: |
            Giri intorno alla casa fra i rovi, che ti si attaccano ai vestiti e alle mani. Sul retro la parete
            è gonfia verso l'esterno, con i chiodi sfilati a metà dalle assi. Dall'altra parte ti fermi a
            toglierti le spine dai polsi una per una.
          effetti: { profondita.pannion-vecchia-pannion: 1, ferite: 0.5 }

  - id: pannion-vp-i-cinghiali-rossi
    immagine: bestiario/cinghiale-crudele-mutato
    titolo: I cinghiali rossi
    sommario: "Fra le case della vecchia Pannion grufolano due cinghiali con la schiena incrostata di linfa. Le case le considerano loro."
    luogo: La vecchia Pannion, l'orto dietro le case
    area: pannion-vecchia-pannion
    ripetibile: true
    requisiti: [fazione.pannion == 10, profondita.pannion-vecchia-pannion == 1]
    testo: |
      Nell'orto dietro le prime case due cinghiali grufolano fra le radici. Sulla schiena la linfa rossa
      incrostata nelle setole fa una corazza di schegge, e quando si muovono le schegge battono fra loro con
      un tintinnio secco. L'orto è rivoltato fino ai muri. Quando ti sentono alzano il muso insieme, e il più
      grosso raspa la terra.

      {addestrare-animali Media} Hanno la pancia piena e difendono l'orto come una casa. Il più grosso tiene
      le orecchie dritte verso di te e la coda ferma. Se capiscono che passi e basta, forse ti lasciano
      passare.

      Oltre l'orto la strada sale verso una cappella con il tetto sfondato.
    opzioni:
      - testo: "Affrontare i cinghiali"
        descrizione: "Due bestie con la schiena di vetro, e l'orto è stretto per tutti."
        combattimento: pannion-cinghiali
        vittoria:
          titolo: L'orto libero
          testo: |
            Il secondo cinghiale scappa fra i tronchi lasciando una scia di schegge rosse. Passi l'orto e ti
            fermi alla prima casa a pulirti la lama sull'erba. Sulla lama il sangue e la linfa hanno lo stesso
            rosso.
          effetti: { profondita.pannion-vecchia-pannion: 1 }
        sconfitta:
          titolo: Lo zoccolo
          testo: |
            Il più grosso ti prende al fianco e ti butta contro un muro, e le schegge della sua schiena ti
            lasciano sul fianco una fila di tagli sottili. Torni indietro strisciando fino alla strada, e i
            cinghiali non ti seguono.
      - testo: "Fargli capire che passi e basta"
        descrizione: "Si cammina piano, di lato, senza guardarli negli occhi."
        prova: { attributo: sociale, abilita: [addestrare-animali, empatia], difficolta: Media }
        successo:
          titolo: Di lato
          testo: |
            Cammini di lato con gli occhi bassi, e i cinghiali ti guardano passare con il muso alzato. Sono
            così vicini che senti il loro odore di terra smossa e di ferro. Il più grosso sbuffa, poi torna a
            grufolare fra le radici.
          pe: { addestrare-animali: 2 }
          effetti: { profondita.pannion-vecchia-pannion: 1 }
        fallimento:
          titolo: La carica
          testo: |
            Il più grosso carica prima che tu abbia fatto tre passi, e salti dietro un muro appena in tempo.
            Lo senti sbattere contro le pietre dall'altra parte, e il muro trema. Torni sulla strada con il
            cuore nelle orecchie.
          effetti: { tormento: 0.5 }
      - testo: "Aspettare che se ne vadano"
        descrizione: "Prima o poi i cinghiali vanno a grufolare altrove. Bisogna stare fermi e zitti finché succede."
        costo: 2
        esito:
          titolo: L'attesa
          testo: |
            Resti accucciat{o|a} dietro un muro finché i cinghiali se ne vanno, e ci vuole così tanto che le
            gambe ti si addormentano. Li senti allontanarsi fra i tronchi con il tintinnio delle schegge.
            Quando passi l'orto è vuoto e pieno di buche.
          effetti: { profondita.pannion-vecchia-pannion: 1, tormento: 0.5 }

  # ------------------------------------------------------------ 1–3 · le luci che rispondono
  - id: pannion-vp-le-luci-che-rispondono
    immagine: icone/paper-lantern
    titolo: Le luci che rispondono
    sommario: "Fra i tronchi, più avanti, si accende una luce piccola. Quando ti fermi, si ferma anche lei."
    luogo: La vecchia Pannion, fra i tronchi
    area: pannion-vecchia-pannion
    ripetibile: true
    requisiti: [fazione.pannion == 10, profondita.pannion-vecchia-pannion >= 1, profondita.pannion-vecchia-pannion <= 3]
    testo: |
      A una trentina di passi fra i tronchi si accende una luce piccola, all'altezza di una lanterna tenuta in
      mano. Quando ti fermi si ferma anche lei, e se alzi la lanterna lei si alza. Fai due passi verso destra,
      e la luce fa due passi con te. Lontano, sull'altura, le luci del pontile di Liduina fanno una fila di
      punti sopra il buio.

      {resilienza Media} I fiumi di vetro rimandano la luce, e la valle ne è piena. È la tua luce riflessa da
      un fiume di vetro, oppure no. La mente sceglie la prima spiegazione e le gambe la seconda.

      La strada vera va a sinistra, fra due case.
    opzioni:
      - testo: "Seguire la luce"
        descrizione: "Un riflesso porta a un fiume di vetro. Qualunque altra cosa porta da qualche parte, e forse è peggio."
        prova: { attributo: mentale, abilita: [resilienza, percezione], difficolta: Media }
        successo:
          titolo: Il riflesso
          testo: |
            La segui, e la luce si ferma davanti a un fiume di vetro che fa da specchio alla tua lanterna. Era
            un riflesso. Sotto la superficie la tua lanterna è rossa, e anche la mano che la tiene. Il fiume
            scende verso il cuore del villaggio, e tu con lui.
          pe: { resilienza: 2 }
          effetti: { profondita.pannion-vecchia-pannion: 1 }
        fallimento:
          titolo: La luce che si allontana
          testo: |
            La luce si allontana quando ti avvicini, e tu la segui fra i tronchi finché ti accorgi di non
            sapere più da che parte è l'altura. Per tutto il tratto sotto i piedi hai avuto aghi e terra, e
            nessun fiume di vetro. Torni indietro guardando soltanto il pontile di Liduina.
          effetti: { tormento: 0.5 }
      - testo: "Coprire la lanterna e vedere che cosa resta"
        descrizione: "Se è un riflesso, al buio sparisce. Se resta accesa, è un'altra cosa."
        prova: { attributo: fisico, abilita: [furtivita, resistenza], difficolta: Media }
        successo:
          titolo: Il buio
          testo: |
            Copri la lanterna e resti ferm{o|a} al buio. La luce piccola si spegne con la tua, nello stesso
            momento. Quando gli occhi si abituano vedi la strada vera fra le due case, chiara sotto la luna, e
            la prendi. Ai bordi della strada i fiumi di vetro tengono un poco di luna.
          pe: { furtivita: 2 }
          effetti: { profondita.pannion-vecchia-pannion: 1 }
        fallimento:
          titolo: La luce che resta
          testo: |
            Copri la lanterna, e la luce piccola resta accesa da sola per tre battiti del cuore. Poi si
            spegne. Riaccendi la tua più in fretta di quanto vorresti, con le dita che sbagliano il primo
            colpo della pietra focaia, e torni da dove sei venut{o|a}.
          effetti: { tormento: 0.5 }
      - testo: "Ignorarla e tenere la strada di Liduina"
        descrizione: "Liduina ti ha detto la strada, e la strada va a sinistra."
        costo: 2
        esito:
          titolo: Senza voltarsi
          testo: |
            Prendi la strada a sinistra senza voltarti, contando i passi come Liduina conta le lanterne. Per
            tutto il tratto la luce piccola ti cammina accanto fra i tronchi, sempre all'altezza della tua
            spalla. Quando arrivi a cento ricominci da uno, finché a un tratto la luce non c'è più.
          effetti: { profondita.pannion-vecchia-pannion: 1, tormento: 0.5 }

  # ------------------------------------------------------------ 2 · la cappella sepolta e la radice del Vecchio
  - id: pannion-vp-la-cappella-sepolta
    immagine: fazioni/confraternita-del-velo
    titolo: La cappella sepolta
    sommario: "La cappella della vecchia Pannion è piena di linfa fino all'altare. Sull'altare ci sono ancora le lanterne della funzione."
    luogo: La vecchia Pannion, la cappella
    area: pannion-vecchia-pannion
    ripetibile: true
    requisiti: [fazione.pannion == 10, profondita.pannion-vecchia-pannion == 2]
    testo: |
      La cappella della vecchia Pannion ha il simbolo dell'Albero inciso sulla porta, uguale a quello della
      cappella di Koln. Dentro la linfa l'ha riempita fino al piano dell'altare, e le panche si vedono sotto
      il vetro come barche affondate. Le file sono dritte, e nessuna panca è rovesciata. Sull'altare, appena
      fuori dal vetro, ci sono ancora le sette lanterne della funzione, spente da settant'anni. Gli stoppini
      sono bruciati fino in fondo. Sulla lastra dietro l'altare c'è un'iscrizione.

      Dal tetto sfondato si vede la cima di una sequoia, e la luna. Sul pavimento di vetro la luna fa un
      cerchio chiaro, e ogni tuo passo rimbomba fino alle travi.
    opzioni:
      - testo: "Leggere l'iscrizione dietro l'altare"
        descrizione: "Una lastra di pietra con una scritta lunga."
        prova: { attributo: mentale, abilita: [accademiche, magia], difficolta: Media }
        successo:
          titolo: La lastra
          testo: |
            È una preghiera per i boscaioli che non tornano, con i nomi sotto, e in fondo una frase più nuova
            incisa male, *riportateli a casa*. Le lettere della preghiera sono regolari e profonde, e quelle
            della frase sono graffiate con una punta e storte. Dietro la lastra c'è una porta bassa che dà
            sulla strada grande.
          pe: { accademiche: 2 }
          effetti: { profondita.pannion-vecchia-pannion: 1, reliquie.frammento-inciso: 1 }
        fallimento:
          titolo: I nomi
          testo: |
            Leggi i nomi uno dopo l'altro, e a metà ti accorgi che li stai dicendo ad alta voce. Smetti, e
            nella cappella i nomi continuano un poco da soli, nel rimbombo. Il tetto è sfondato, e il suono
            dovrebbe uscire dalla breccia.
          effetti: { tormento: 0.5 }
      - testo: "Salire sul tetto per vedere la piazza"
        descrizione: "Dal tetto sfondato si sale fino al colmo, e dal colmo si vede la strada grande."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Media }
        successo:
          titolo: Il colmo
          testo: |
            Sali dalle travi fino al colmo del tetto, e da lassù vedi la strada grande che scende fra le case
            fino a uno spiazzo rotondo. Lo spiazzo luccica sotto la luna, e al centro c'è un cerchio chiaro
            che non luccica. Ridiscendi dall'altra parte, dove la strada comincia.
          pe: { atletica: 2 }
          effetti: { profondita.pannion-vecchia-pannion: 1 }
        fallimento:
          titolo: La trave
          testo: |
            Una trave ti si sbriciola sotto le mani, e cadi sull'altare fra le
            lanterne, che rotolano sul vetro con un rumore di campanelli.
          effetti: { ferite: 0.5 }
      - testo: "Uscire dalla porta da cui sei entrat{o|a} e girare intorno"
        descrizione: "La cappella si gira dall'esterno. È lunga, e piena di rovi."
        costo: 2
        esito:
          titolo: Il giro della cappella
          testo: |
            Giri intorno alla cappella fra i rovi e le radici, e dall'altra
            parte trovi la strada grande. Le mani ti bruciano fino a sera.
          effetti: { profondita.pannion-vecchia-pannion: 1, ferite: 0.5 }

  - id: pannion-vp-la-radice-del-vecchio
    immagine: icone/tree-roots
    titolo: La radice del Vecchio
    sommario: "La radice del Vecchio arriva fin qui, grossa come un uomo, e scende per la strada grande verso la piazza."
    luogo: La vecchia Pannion, la strada grande
    area: pannion-vecchia-pannion
    ripetibile: true
    requisiti: [fazione.pannion == 10, profondita.pannion-vecchia-pannion == 2]
    testo: |
      La radice grossa del Vecchio sbuca da sotto un fiume di vetro e corre in mezzo alla strada grande verso
      la piazza. Qui è grossa come un uomo sdraiato e nera di corteccia lucida, e ha sfondato le soglie delle
      case sui due lati. Le pietre delle soglie sono spaccate di netto. Ogni tanto sotto la corteccia passa un
      movimento lento da un capo all'altro, e dove passa la corteccia si alza di un dito e poi torna giù. Il
      vetro ai lati crepita sottile mentre passa.

      {natura Media} La radice beve. Il movimento va verso l'altura, dalla piazza al Vecchio, e porta
      qualcosa. Una radice si allunga di solito qualche centinaio di passi dal suo tronco, e il Vecchio è a
      duemila passi da qui.

      Ai lati della radice la strada è un groviglio di vetro e di travi.
    opzioni:
      - testo: "Camminare sulla radice fino alla piazza"
        descrizione: "La radice è larga come una trave da ponte, e scivolosa."
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Media }
        successo:
          titolo: Sulla radice
          testo: |
            Cammini sulla radice con le braccia aperte, e sotto gli stivali la senti tiepida e viva. A metà
            strada il movimento lento ti passa sotto i piedi diretto all'altura, mentre tu vai nell'altra
            direzione. Lo senti salire dalle suole alle ginocchia, con una spinta morbida e lunga.
          pe: { acrobazia: 2 }
          effetti: { profondita.pannion-vecchia-pannion: 1 }
        fallimento:
          titolo: Lo scivolone
          testo: |
            Scivoli sulla corteccia lucida e finisci di schiena sul vetro di
            fianco alla radice, con le schegge che ti entrano nella giubba.
          effetti: { ferite: 0.5 }
      - testo: "Appoggiare l'orecchio alla radice"
        descrizione: "Una radice che beve fa rumore, a sentirla da vicino. Il rumore dice da dove arriva l'acqua."
        prova: { attributo: mentale, abilita: [natura, magia], difficolta: Media }
        successo:
          titolo: Il rumore dell'acqua
          testo: |
            Appoggi l'orecchio alla corteccia e senti l'acqua salire, piano, come in una grondaia dopo la
            pioggia. Contro la guancia la corteccia è tiepida. L'acqua arriva dalla piazza. La segui
            controcorrente, sul bordo della radice.
          pe: { natura: 2 }
          effetti: { profondita.pannion-vecchia-pannion: 1 }
        fallimento:
          titolo: L'altro rumore
          testo: |
            Appoggi l'orecchio alla corteccia, e sotto l'acqua senti un suono più basso, lunghissimo, che non
            sai dire che cosa sia. Dura più del tuo respiro e non cambia di tono. Ti stacchi di colpo, e per
            un pezzo te lo senti ancora nei denti.
          effetti: { tormento: 0.5 }
      - testo: "Arrampicarsi fra le travi a lato della strada"
        descrizione: "Le case crollate fanno un groviglio di travi lungo tutta la strada. Si passa, a fatica."
        costo: 2
        esito:
          titolo: Il groviglio
          testo: |
            Passi di trave in trave lungo le case crollate, e ci metti il doppio del tempo. Le travi che
            escono dal vetro sono sane, e quelle rimaste all'aria si sbriciolano sotto le dita. Arrivi alla
            fine della strada con le mani nere di muffa e un taglio sul palmo.
          effetti: { profondita.pannion-vecchia-pannion: 1, ferite: 0.5 }

  # ------------------------------------------------------------ 3 · la piazza di vetro e le radici di vetro
  - id: pannion-vp-la-piazza-di-vetro
    immagine: ambientazione/rovine-dei-precursori
    titolo: La piazza di vetro
    sommario: "Il bordo della piazza è un lago di linfa indurita, e sotto il vetro c'è ancora il mercato dell'ultimo giorno."
    luogo: La vecchia Pannion, il bordo della piazza
    area: pannion-vecchia-pannion
    ripetibile: true
    requisiti: [fazione.pannion == 10, profondita.pannion-vecchia-pannion == 3]
    testo: |
      Il bordo della piazza è un lago di linfa indurita rosso scuro, pieno di crepe sottili. Sotto il vetro ci
      sono ancora i banchi del mercato dell'ultimo giorno e un carretto senza mulo. Sui banchi i cesti sono
      ancora in fila. In mezzo alla piazza, dove la linfa non è arrivata, c'è la pietra chiara della Conca. La
      linfa si ferma a un passo dalla pietra, e tutto intorno alla stessa distanza.

      {percezione Media} Le crepe si allargano in cerchi intorno alla Conca, come se il vetro fosse stato
      battuto da sotto. Lungo ogni crepa il vetro è rialzato di un filo dalla parte della Conca.

      Fra te e la pietra chiara ci sono cinquanta passi di vetro.
    opzioni:
      - testo: "Attraversare la piazza seguendo le crepe sottili"
        descrizione: "Il vetro regge dove le crepe sono sottili. Sotto quelle larghe c'è il vuoto."
        prova: { attributo: mentale, abilita: [percezione, tecnologia], difficolta: Media }
        successo:
          titolo: Le crepe sottili
          testo: |
            Cammini dove le crepe sono sottili, e il vetro regge sotto gli stivali con un suono di ghiaccio. A
            ogni passo una crepa nuova corre via dal tuo tallone e si ferma dopo un braccio. Arrivi alla
            pietra chiara e ti fermi sul bordo, prima di guardare.
          pe: { percezione: 2 }
          effetti: { profondita.pannion-vecchia-pannion: 1 }
        fallimento:
          titolo: Il vetro che cede
          testo: |
            Il vetro ti cede sotto un piede e la gamba ti finisce in un buco fino alla coscia, fra i banchi
            del mercato. Là sotto c'è aria fredda, e il piede non tocca il fondo. Ti tiri fuori con le mani
            tagliate e torni al bordo.
          effetti: { ferite: 0.5 }
      - testo: "Strisciare sul vetro per spartire il peso"
        descrizione: "Pancia a terra e braccia larghe, come sul ghiaccio sottile. Lento, e il vetro taglia."
        prova: { attributo: fisico, abilita: [furtivita, resistenza], difficolta: Media }
        successo:
          titolo: Come sul ghiaccio
          testo: |
            Strisci sul vetro con le braccia larghe, e sotto la faccia ti passano i banchi del mercato, uno
            dopo l'altro. Su un banco c'è una bilancia con i piatti fermi a metà. Arrivi alla pietra chiara
            con i gomiti rossi.
          pe: { resistenza: 2 }
          effetti: { profondita.pannion-vecchia-pannion: 1 }
        fallimento:
          titolo: Il carretto
          testo: |
            A metà strada, sotto la faccia, passa il carretto senza mulo, e dentro il carretto c'è qualcosa
            che non guardi. Il vetro lì sopra si appanna del tuo fiato, e lo lasci appannato. Torni indietro
            strisciando senza fretta e senza voltarti.
          effetti: { tormento: 0.5 }
      - testo: "Fare il giro lungo il muro delle case"
        descrizione: "Lungo il muro delle case il vetro è più spesso. Il giro è lungo il doppio."
        costo: 2
        esito:
          titolo: Il giro della piazza
          testo: |
            Fai il giro lungo il muro delle case, una soglia dopo l'altra. Lungo il muro il vetro è spesso una
            spanna, e sotto non si vede niente. Arrivi alla pietra chiara dall'altra parte, con le ginocchia
            che tremano di freddo.
          effetti: { profondita.pannion-vecchia-pannion: 1, tormento: 0.5 }

  - id: pannion-vp-le-radici-di-vetro
    immagine: ambientazione/foresta-strisciante
    titolo: Le radici di vetro
    sommario: "Al bordo della piazza due radici coperte di linfa indurita si muovono piano e si chiudono intorno a quello che passa."
    luogo: La vecchia Pannion, l'imbocco della piazza
    area: pannion-vecchia-pannion
    ripetibile: true
    requisiti: [fazione.pannion == 10, profondita.pannion-vecchia-pannion == 3]
    testo: |
      All'imbocco della piazza due radici escono dal vetro e si piegano nell'aria, coperte di linfa indurita
      che taglia. La linfa le riveste a scaglie sovrapposte, e quando si muovono le scaglie sfregano fra loro
      con un rumore di vetro su vetro. Non sono nere e ferme come quelle del Vecchio. Si muovono piano, e
      quando ci cade sopra un ramo secco si chiudono intorno e lo spezzano. Ai loro piedi il vetro è coperto
      di legno spezzato, e una parte è grigia e vecchia di anni.

      {armi-da-mischia Media} La linfa è più sottile nelle giunture, dove le radici si piegano. Lì le scaglie
      si aprono a ogni movimento e lasciano vedere la corteccia.

      Fra le due radici c'è la pietra chiara della Conca.
    opzioni:
      - testo: "Aprirsi la strada fra le radici"
        descrizione: "Due radici di vetro, che si chiudono su quello che le tocca. Si colpiscono nelle giunture."
        combattimento: pannion-radici
        vittoria:
          titolo: Le giunture
          testo: |
            Colpisci le radici dove si piegano, e la linfa si spacca con un rumore di stoviglie. Le radici
            ricadono sul vetro e restano lì, ferme. Dalle giunture aperte cola una linfa fresca e lenta, che
            indurisce sul vetro prima che tu sia passat{o|a}. Passi in mezzo a loro senza guardarle.
          effetti: { profondita.pannion-vecchia-pannion: 1 }
        sconfitta:
          titolo: La stretta
          testo: |
            Una radice ti si chiude intorno alla gamba e stringe, e il vetro ti entra nella carne. Ogni colpo
            che dai stacca una scaglia, e la radice stringe di più. Te ne liberi a colpi, e torni indietro
            zoppicando.
      - testo: "Passare fra le radici senza toccarle"
        descrizione: "Le radici si chiudono su quello che le tocca. Bisogna passare nel mezzo piano, senza sfiorarle."
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Media }
        successo:
          titolo: Nel mezzo
          testo: |
            Passi nel mezzo di fianco, con la pancia in dentro, e le radici ti
            sfiorano la giubba senza chiudersi. Dall'altra parte non ti volti.
          pe: { furtivita: 2 }
          effetti: { profondita.pannion-vecchia-pannion: 1 }
        fallimento:
          titolo: La manica
          testo: |
            Una radice ti prende la manica e la tira, e la manica si strappa
            prima del braccio. Torni indietro di corsa.
          effetti: { ferite: 0.5 }
      - testo: "Dar loro da stringere un tronco"
        descrizione: "Le radici si chiudono su quello che cade. Un tronco buttato in mezzo le tiene occupate."
        prova: { attributo: mentale, abilita: [natura, tecnologia], difficolta: Media }
        successo:
          titolo: Il tronco
          testo: |
            Trascini un tronco marcio fino all'imbocco e lo spingi fra le radici. Si chiudono tutte e due sul
            tronco, e mentre lo spezzano passi dall'altra parte. Alle tue spalle il legno scricchiola a lungo,
            e poi più niente.
          pe: { natura: 2 }
          effetti: { profondita.pannion-vecchia-pannion: 1 }
        fallimento:
          titolo: Il tronco leggero
          testo: |
            Il tronco è troppo leggero, e le radici lo spezzano in un momento. Poi le punte si alzano e si
            girano verso di te tutte e due insieme, e tu indietreggi fino al bordo della strada.
          effetti: { tormento: 0.5 }
      - testo: "Tagliarle a colpi di scure"
        descrizione: "La scure contro il vetro, un colpo dopo l'altro, finché le radici smettono di muoversi. Il vetro taglia anche chi colpisce."
        costo: 2
        esito:
          titolo: Le schegge
          testo: |
            Tagli le radici un colpo dopo l'altro, e ogni colpo ti manda addosso una pioggia di schegge rosse.
            Sotto la linfa il legno è bianco e bagnato. Quando smettono di muoversi hai le braccia piene di
            tagli sottili.
          effetti: { profondita.pannion-vecchia-pannion: 1, ferite: 1 }

  # ------------------------------------------------------------ il cuore · la Conca degli specchi
  - id: pannion-la-conca-degli-specchi
    immagine: ambientazione/rovine-dei-precursori
    titolo: La Conca degli specchi
    sommario: "In mezzo alla piazza della vecchia Pannion c'è una vasca di pietra liscia piena d'acqua."
    luogo: La vecchia Pannion, la Conca degli specchi
    area: pannion-vecchia-pannion
    requisiti: [fazione.pannion == 10, profondita.pannion-vecchia-pannion >= 4]
    testo: |
      La Conca degli specchi è una vasca rotonda di pietra chiara scavata in un blocco solo. Sta dentro un
      anello di terra nuda dove la linfa non è mai arrivata, e dove la terra finisce il vetro rosso della
      piazza si ferma con un orlo netto. Tre radici nere del Vecchio affondano nell'acqua come mani che bevono
      da una scodella. Sul bordo non c'è una giuntura né il segno di uno scalpello, e la pietra è liscia anche
      sotto le radici.

      La luna non ha ancora passato le cime delle sequoie, e l'acqua non riflette il cielo. Dentro c'è la luce
      grigia di un altro giorno, con persone vestite in fogge mai viste che toccano pareti lisce con due dita.
      Ti dici che la pietra chiara rimanda la luce di un'altra ora, e te lo ripeti anche quando sopra le
      sequoie trovi il cielo scuro. Da quando hai messo piede sulla terra nuda i grilli tacciono, e li senti
      ancora soltanto alle tue spalle.

      {accademiche Difficile} Nessun libro della Biblioteca ha mai disegnato vestiti così, con le cuciture che
      non si vedono da nessuna parte. Le mani si muovono tutte allo stesso tempo, e nessuno guarda quello che
      fa.

      Poi alzano la testa insieme, e l'acqua trema in cerchi che partono dal centro, lontano dalle radici. Ne
      sale una figura di radici e di linfa di vetro più alta di te, e l'acqua le scivola via senza lasciare
      una goccia. Ha la faccia di uno di loro.
    opzioni:
      - testo: "Affrontare il custode della conca"
        descrizione: "Radici e vetro, e una faccia che cambia a ogni colpo."
        combattimento: pannion-custode
        vittoria:
          titolo: La faccia giusta
          testo: |
            Il custode si spacca in schegge rosse e in radici che ricadono nella vasca con un rumore di
            stoviglie, e l'acqua si fa ferma. In quel momento la luna passa le cime. Ti affacci, e l'acqua ti
            restituisce la tua faccia, con il sangue sullo zigomo e la paura negli occhi. Sul fondo, fra le
            schegge, raccogli frammenti di metallo inciso e un nucleo che sussurra. L'acqua è fredda fino al
            gomito, e le schegge appena cadute hanno già gli spigoli lisci.

            All'alba risali il pendio. Sul crinale, nella prima luce, vedi la piazza di Pannion piena di
            gente, e il Vecchio in mezzo.
          pe: { armi-da-mischia: 5 }
          imposta: { pannion.conca: 2 }
          effetti: { fazione.pannion: 1, reliquie.frammento-inciso: 2, parte.nucleo-2: 1 }
          vai: superficie-fratturata
        sconfitta:
          titolo: Il bordo della piazza
          testo: |
            Il custode ti prende per il petto con dita di radice che ti entrano nella giubba, e ti butta fuori
            dall'anello di terra nuda. Cadi sul vetro della piazza, che si incrina sotto la tua schiena con lo
            schiocco di un ghiaccio che cede. Risali il pendio all'alba senza aver guardato l'acqua sotto la
            luna, con la faccia di uno sconosciuto davanti agli occhi.
          effetti: { tormento: 1 }
          vai: superficie-fratturata
      - testo: "Aspettare la luna senza guardare l'acqua"
        descrizione: "Di giorno la Conca mostra gli sconosciuti, sotto la luna mostra te."
        prova: { attributo: mentale, abilita: [resilienza, natura], difficolta: Difficile }
        successo:
          titolo: Sotto la luna
          testo: |
            Tieni gli occhi sulle cime delle sequoie, lontano dall'acqua, mentre il custode ti sta davanti con
            la faccia di un altro. A un passo da te senti le sue radici che scricchiolano a ogni movimento.
            Quando la luna passa le cime la figura si ferma e si piega, e torna nella vasca come acqua. Ti
            affacci, e l'acqua ti restituisce la tua faccia, con gli occhi rossi di chi ha fissato il cielo
            troppo a lungo. Sul bordo, dove la figura è scesa, restano frammenti di metallo inciso e un nucleo
            che sussurra.

            All'alba risali il pendio. Sul crinale vedi la piazza di Pannion piena di gente, e il Vecchio in
            mezzo.
          pe: { resilienza: 5 }
          imposta: { pannion.conca: 1 }
          effetti: { fazione.pannion: 1, reliquie.frammento-inciso: 2, parte.nucleo-2: 1 }
          vai: superficie-fratturata
        fallimento:
          titolo: Gli occhi nell'acqua
          testo: |
            A un certo punto gli occhi ti scendono sull'acqua, e la gente sconosciuta ti guarda da laggiù
            tutta insieme. Hanno smesso di toccare le pareti, e tengono ancora le due dita alzate. Il custode
            ti colpisce mentre guardi. Risali il pendio all'alba senza aver visto la tua faccia.
          effetti: { ferite: 1, tormento: 1 }
          vai: superficie-fratturata
      - testo: "Spezzare le radici che lo tengono in piedi"
        descrizione: "La figura sta in piedi su radici che scendono nella vasca. Spezzate quelle, cade."
        prova: { attributo: fisico, abilita: [armi-da-mischia, atletica], difficolta: Difficile }
        successo:
          titolo: Le gambe di radice
          testo: |
            Gli giri intorno e colpisci le radici che lo tengono, una dopo l'altra. Sotto la linfa c'è un
            legno vivo e fibroso, e a ogni colpo il contraccolpo ti sale fino alla spalla. Alla fine la figura
            si inginocchia e si sbriciola nella vasca. Quando la luna passa le cime ti affacci, e l'acqua ti
            restituisce la tua faccia. Sul fondo raccogli frammenti di metallo inciso e un nucleo che
            sussurra.

            All'alba risali il pendio. Sul crinale vedi la piazza di Pannion piena di gente, e il Vecchio in
            mezzo.
          pe: { armi-da-mischia: 5 }
          imposta: { pannion.conca: 2 }
          effetti: { fazione.pannion: 1, reliquie.frammento-inciso: 2, parte.nucleo-2: 1 }
          vai: superficie-fratturata
        fallimento:
          titolo: La radice che stringe
          testo: |
            Colpisci una radice, e un'altra ti si chiude intorno al polso con una stretta fredda e bagnata. Il
            custode ti solleva da terra senza sforzo e ti butta sul vetro della piazza. Risali il pendio
            all'alba con il polso gonfio e il segno della corteccia sulla pelle.
          effetti: { ferite: 1, tormento: 0.5 }
          vai: superficie-fratturata
      - testo: "Posare la lanterna da pontile sul bordo della vasca"
        descrizione: "La luce delle lanterne di Pannion è calda e bassa come quella della luna."
        requisiti: [chiave.lanterna >= 1]
        prova: { attributo: mentale, abilita: [natura, magia], difficolta: Difficile }
        successo:
          titolo: La luce bassa
          testo: |
            Posi la lanterna sul bordo della vasca, fra due radici del Vecchio, e la luce calda scende
            sull'acqua. Gli sconosciuti spariscono uno dopo l'altro, dal bordo verso il centro, man mano che
            la luce li raggiunge. Il custode si ferma a mezzo passo e torna nella vasca come acqua. Ti
            affacci, e l'acqua ti restituisce la tua faccia con la fiamma della lanterna riflessa accanto alla
            guancia. Sul bordo restano frammenti di metallo inciso e un nucleo che sussurra.

            All'alba risali il pendio. Sul crinale vedi la piazza di Pannion piena di gente, e il Vecchio in
            mezzo.
          pe: { natura: 5 }
          imposta: { pannion.conca: 1 }
          effetti: { fazione.pannion: 1, reliquie.frammento-inciso: 2, parte.nucleo-2: 1 }
          vai: superficie-fratturata
        fallimento:
          titolo: La lanterna nell'acqua
          testo: |
            Il custode colpisce il bordo, e la lanterna cade nella vasca e si spegne con un sibilo. Recuperi
            la lanterna con il braccio nell'acqua gelata, e là sotto la luce grigia di un altro giorno ti
            illumina il braccio fino al gomito. Risali il pendio all'alba con la manica che gocciola.
          effetti: { ferite: 0.5, tormento: 1 }
          vai: superficie-fratturata
      - testo: "Leggere i segni sul bordo della vasca"
        descrizione: "Sul bordo della Conca c'è un giro di segni che all'Accademia si chiamerebbero precuriani."
        quando: [origine.allievo-di-torvessa >= 1]
        prova: { attributo: mentale, abilita: [accademiche, tecnologia], difficolta: Difficile }
        successo:
          titolo: Il giro dei segni
          testo: |
            Passi le dita sui segni uno dopo l'altro. Sono incisi tutti alla stessa profondità, e il fondo dei
            solchi è liscio quanto il resto della pietra. Al nono la pietra si fa tiepida. Il custode si ferma
            e torna nella vasca come acqua. Ti affacci, e l'acqua ti restituisce la tua faccia. Sul bordo
            restano frammenti di metallo inciso e un nucleo che sussurra.

            All'alba risali il pendio. Sul crinale vedi la piazza di Pannion piena di gente, e il Vecchio in
            mezzo.
          pe: { accademiche: 5 }
          imposta: { pannion.conca: 1 }
          effetti: { fazione.pannion: 1, reliquie.frammento-inciso: 2, parte.nucleo-2: 1 }
          vai: superficie-fratturata
        fallimento:
          titolo: Il segno sbagliato
          testo: |
            Al terzo segno la pietra ti scotta le dita, e intorno al solco resta fredda come prima. Il custode
            ti è addosso prima che tu le ritiri. Risali il pendio all'alba con i polpastrelli bianchi di
            vesciche.
          effetti: { ferite: 1, tormento: 0.5 }
          vai: superficie-fratturata
