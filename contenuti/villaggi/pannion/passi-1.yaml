# La quest di Pannion, Atto I e II (fazione.pannion 0 → 6).
# - 0 → 1 `pannion-il-fumo-di-pannion` (Pannion, pista.arena >= 5): l'arrivo, Darrin Huld che parla al Vecchio, la
#   carbonaia spaccata da una radice del Vecchio salita fin lì.
# - 1 → 2 `pannion-i-tronchi-segnati` (Pannion, di notte): i tronchi segnati per i ponti tagliati dalla banda di
#   Gaspare Tenca. Varianti: il Figlio della Città Bassa parla il gergo delle bande; scuri.nihali e scuri.finale.
# - 2 → 3 `pannion-la-consegna` (Ponte delle Mille Corde, grado 1): il carico corto davanti ad Aldous Castaldi e alla
#   penale. Per strada i carrettieri parlano del vetro che ride e dell'arco sul crinale: traccia.sornione e
#   traccia.mara.
# - 3 → 4 `pannion-la-linfa-rossa` (Pannion): Frate Koln, la linfa del Vecchio e la Cattedrale che ne vuole di più.
#   Le radici scendono verso la vecchia Pannion. Opzione d'origine dell'Accolito del Velo.
# - 4 → 5 `pannion-le-lanterne-dei-pontili` (Pannion): Liduina Brace e l'ultima lanterna, che si spegne ogni notte
#   alla stessa ora. Opzione d'origine del Figlio del Circolo.
# - 5 → 6 `pannion-il-conto-del-legname` (Municipio, grado 2): Julia Castaldi chiede il doppio del legname per il
#   ponte in dissesto. Varianti con pista.pelle < 7 (l'uomo dei Malgrani) e >= 7 (le cooperative della segheria).
# Nomi nuovi in questo file: Gaspare Tenca (capo della banda di Pannion), Liduina Brace (la donna delle lanterne).
storylet:
  # ------------------------------------------------------------ 0 → 1 · il fumo di Pannion
  - id: pannion-il-fumo-di-pannion
    presso: pannion
    immagine: ambientazione/foresta-strisciante
    titolo: Il fumo di Pannion
    sommario: "Il fumo di Pannion si vede dalla strada mezza giornata prima delle case. Darrin Huld vuole qualcuno di fuori che guardi le radici del Vecchio senza pregarci sopra."
    luogo: Pannion, la piazza del Vecchio
    area: superficie-fratturata
    requisiti: [fazione.pannion == 0, pista.arena >= 5]
    testo: |
      Il fumo di Pannion lo vedi dalla strada mezza giornata prima delle
      case, una riga grigia sopra le sequoie che il vento non riesce a
      piegare. L'altura è di terra rossa, e fra i tronchi scendono certi
      fiumi di linfa indurita che al sole si fanno lucidi. Le
      case sono di legno scuro e lucide di resina. In mezzo alla piazza sta
      il Vecchio Albero, un tronco nero più alto dei tetti, senza una foglia.

      Davanti al Vecchio un uomo con le mani larghe e un orecchio mezzo
      bruciato gli sta parlando a voce bassa. Ansgar, il ragazzo con le mani
      nere che ti ha fatto strada dal bivio, ti dice che quello è Darrin Huld e che quando
      parla al Vecchio non lo si interrompe.

      {empatia Media} Gli parla come si parla a un vecchio di casa, con la
      voce di tutti i giorni, e lascia le pause per le risposte.

      Quando ha finito Darrin si volta e ti guarda prima le scarpe, poi la
      faccia. «Le radici» dice, e ti porta sul fianco dell'altura, dove una
      carbonaia coperta di zolle fuma storta. Una radice nera è salita da
      sotto e l'ha spaccata, e dalla crepa esce una lingua di fumo bianco.

      {natura Facile} Fumo bianco vuol dire aria. Una carbonaia che prende
      aria brucia tutta, e il fuoco arriva ai pontili.

      *Una radice del Vecchio, a cinquanta passi dal tronco.* Darrin ti mette
      in mano una pala e si toglie la giacca.

      {origine figlio-del-circolo} Al Circolo ti hanno insegnato che un
      albero cresce lontano dal fumo. Questo è cresciuto dentro il fumo per
      tutta la vita, e le sue radici vanno dove vogliono.
    opzioni:
      - testo: "Chiudere la crepa con le zolle"
        descrizione: "Terra rossa e zolle d'erba, buttate in fretta sulla crepa finché il fumo torna grigio. Con il caldo che sale dalla carbonaia."
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Media }
        successo:
          titolo: Il fumo grigio
          testo: |
            Butti terra sulla crepa a palate, con il caldo della carbonaia che
            ti asciuga gli occhi, e Darrin batte le zolle con il dorso della
            pala dove le butti tu. Dopo un tempo lungo il fumo torna grigio. La
            sera, al fuoco dei carbonai, Darrin ti indica un posto sulla panca
            e dice soltanto «Resti». Ansgar ti spiega che è un invito.
          pe: { atletica: 3 }
          effetti: { fazione.pannion: 1, rep.pannion: 0.5 }
        fallimento:
          titolo: La lingua di fuoco
          testo: |
            Una zolla ti scivola dalla pala e la crepa si allarga, e dalla
            carbonaia esce una lingua di fuoco che ti lecca il braccio. Darrin
            ti scosta con una spallata e la chiude da solo, mentre i carbonai
            accorsi guardano te. La sera ti indica lo stesso un posto sulla panca accanto al fuoco e dice soltanto «Resti».
          effetti: { fazione.pannion: 1, ferite: 0.5, scandalo: 0.5 }
      - testo: "Leggere il fumo e chiudere gli sfiatatoi giusti"
        descrizione: "Una carbonaia ha una dozzina di sfiatatoi. Chiudendo quelli giusti l'aria smette di entrare dalla crepa."
        prova: { attributo: mentale, abilita: [natura, percezione], difficolta: Media }
        successo:
          titolo: Gli sfiatatoi
          testo: |
            Giri intorno alla carbonaia guardando il fumo che esce dai buchi, e
            chiudi con le zolle quelli da cui esce più chiaro. L'aria smette di
            tirare, e la crepa si spegne da sola. Darrin ti guarda fare senza
            muoversi. La sera, al fuoco dei carbonai, ti indica un posto sulla
            panca e dice soltanto «Resti».
          pe: { natura: 3 }
          effetti: { fazione.pannion: 1, rep.pannion: 0.5 }
        fallimento:
          titolo: Il buco sbagliato
          testo: |
            Chiudi gli sfiatatoi sbagliati, e la carbonaia comincia a tirare
            dalla crepa come un camino. Darrin ne riapre due con un calcio e ne
            chiude altri tre, senza una parola. La sera ti indica lo stesso un
            posto sulla panca, e un carbonaio ride dietro la scodella.
          effetti: { fazione.pannion: 1, scandalo: 0.5 }
      - testo: "Mettere in fila i carbonai con i secchi di terra"
        descrizione: "I carbonai accorrono a uno a uno e si intralciano. Una fila che passa i secchi lavora più in fretta di dieci pale."
        prova: { attributo: sociale, abilita: [persuasione, intimidire], difficolta: Media }
        successo:
          titolo: La fila
          testo: |
            Alzi la voce, e i carbonai si mettono in fila dal mucchio di terra
            alla carbonaia, passandosi i secchi di mano in mano. La crepa è
            chiusa prima che Darrin finisca di tirarsi su le maniche. La sera,
            al fuoco, Darrin ti indica un posto sulla panca e dice soltanto
            «Resti».
          pe: { persuasione: 3 }
          effetti: { fazione.pannion: 1, rep.pannion: 0.5 }
        fallimento:
          titolo: Il forestiero che grida
          testo: |
            Alzi la voce, e i carbonai ti guardano come si guarda un cane che
            abbaia alla luna, finché Darrin fa un gesto con la mano e la fila
            si forma da sola. La sera ti indica lo stesso un posto sulla panca accanto al fuoco e dice soltanto «Resti».
          effetti: { fazione.pannion: 1, scandalo: 0.5 }
      - testo: "Portare la terra a Darrin e lasciar fare a lui"
        descrizione: "Darrin sa che cosa fare, e lo fa da trent'anni. Tu porti la terra finché ce n'è bisogno."
        costo: 2
        esito:
          titolo: La terra rossa
          testo: |
            Porti terra fino a sera, un secchio dopo l'altro, e Darrin la
            sistema sulla crepa con le mani, come si sistema una coperta su un
            bambino. Quando la carbonaia torna a fumare grigio è buio. Al fuoco
            ti indica un posto sulla panca e dice soltanto «Resti».
          pe: { resistenza: 2 }
          effetti: { fazione.pannion: 1, rep.pannion: 0.5 }

  # ------------------------------------------------------------ 1 → 2 · i tronchi segnati
  - id: pannion-i-tronchi-segnati
    presso: pannion
    immagine: ambientazione/segheria-di-qir-azel
    titolo: I tronchi segnati
    sommario: "Le sequoie segnate per i ponti di Qir-Azel spariscono di notte a una o due per volta. Restano le ceppaie fresche e le tracce di una slitta."
    luogo: Pannion, i tagli del versante nord, di notte
    area: superficie-fratturata
    requisiti: [fazione.pannion == 1]
    testo: |
      Le sequoie che vanno ai ponti di Qir-Azel Darrin le segna una per una
      con una croce di terra rossa sulla corteccia, all'altezza degli occhi.
      Stamattina sul versante nord ci sono tre ceppaie fresche con la croce
      ancora sui trucioli, e dei tronchi nessuna traccia. Una slitta li ha
      trascinati giù verso un fiume di linfa, dove i segni finiscono sul
      vetro.

      Ansgar si gratta la scottatura e fa il nome di Gaspare Tenca a voce
      bassa, guardandosi intorno. Di giorno è un boscaiolo come gli altri,
      e la notte ha una banda che vende in città quello che il bosco non sa
      di aver perso. Darrin non dice niente. Guarda le ceppaie e poi guarda
      te. La sera ti aspetta in fondo all'ultimo pontile con una lanterna
      coperta.

      {conoscenze-della-strada Media} Un tronco con la croce di Darrin è
      legname dei Castaldi. Senza la croce vale il doppio alle segherie del
      canale, che lo comprano a peso e non chiedono da dove viene.

      {furtivita Media fallita} Ti accorgi tardi che sul pontile tutte le
      assi scricchiolano. Lo sai perché lo senti, e se lo senti tu lo sente
      anche il bosco.

      {origine figlio-della-citta-bassa} Sulla ceppaia qualcuno ha inciso un
      segno piccolo, un cerchio tagliato da una riga. In Città Bassa lo fanno
      le bande dei villaggi quando portano merce agli Scuri, per dire che il
      lavoro è loro.
    opzioni:
      - testo: "Fermare i tagliatori al lavoro"
        descrizione: "Due uomini con la scure, il fazzoletto sulla faccia e un tronco già mezzo abbattuto. Si fermano soltanto se li fermi tu."
        combattimento: pannion-tagliatori
        vittoria:
          titolo: La slitta abbandonata
          testo: |
            Il secondo tagliatore scappa nel buio lasciando la scure piantata
            nel tronco e la slitta carica in mezzo al sentiero. Sul manico
            della scure c'è inciso il cerchio tagliato da una riga. Darrin
            riporta su la slitta con due della squadra, e alla piazza ti dice
            che il carico per la città sarà corto lo stesso, ma meno.
          pe: { armi-da-mischia: 3 }
          effetti: { fazione.pannion: 1, rep.pannion: 0.5 }
        sconfitta:
          titolo: Il fazzoletto
          testo: |
            Un colpo di manico ti prende dietro il ginocchio e finisci con la
            faccia nella terra rossa. Quando ti rialzi i tagliatori sono
            spariti con il tronco, e di loro resta un fazzoletto scuro
            impigliato in un ramo. Darrin lo guarda e lo butta nel fuoco della
            piazza. Il carico per la città sarà corto.
          effetti: { fazione.pannion: 1, scandalo: 0.5 }
      - testo: "Seguire la slitta fino a chi compra"
        descrizione: "I tronchi rubati finiscono da qualche parte. Seguendoli al buio si vede dove, e chi paga."
        prova: { attributo: fisico, abilita: [furtivita, atletica], difficolta: Media }
        successo:
          titolo: Il carro coperto
          testo: |
            Segui la slitta fino al fiume di linfa e poi lungo il vetro, al
            riparo dei tronchi. All'alba, dove il bosco finisce, c'è un carro
            coperto, e un uomo con un panciotto di città paga Gaspare Tenca con
            una borsa che tintinna. Lo riconosci dalla barba rossa e dal ronco
            alla cintura. Darrin, quando glielo racconti, annuisce piano.
          pe: { furtivita: 3 }
          effetti: { fazione.pannion: 1, rep.pannion: 0.5, informazioni.voce: 1 }
        fallimento:
          titolo: Il ramo secco
          testo: |
            Un ramo secco ti si spezza sotto il piede, e la slitta si ferma.
            Resti accucciato nel buio a lungo, finché la senti ripartire più in
            fretta, verso un posto dove non riesci a seguirla. Al ritorno hai
            le ginocchia gelate e un nome solo, quello di Tenca.
          effetti: { fazione.pannion: 1, sospetto: 0.5 }
      - testo: "Andare a parlare con Gaspare Tenca"
        descrizione: "Tenca di giorno taglia per Darrin come tutti. Si può andare da lui a dirgli che le croci si vedono."
        prova: { attributo: sociale, abilita: [intimidire, persuasione], difficolta: Media }
        successo:
          titolo: La barba rossa
          testo: |
            Tenca sta affilando un ronco da potatura sulla soglia di casa, un
            uomo con la barba rossa e le spalle di chi tira tronchi da
            vent'anni. Lo ascolti negare, poi gli dici dove finiscono le
            tracce della slitta. Smette di affilare e ti risponde che per
            questa luna le croci di Darrin restano dove sono.
          pe: { intimidire: 3 }
          effetti: { fazione.pannion: 1, rep.pannion: 0.5 }
        fallimento:
          titolo: Il ronco
          testo: |
            Tenca ti ascolta continuando ad affilare il ronco, e alla fine ti
            dice che i forestieri a Pannion durano una stagione. Gli uomini
            seduti sulla sua soglia ridono. Darrin, la sera, sa già tutto.
          effetti: { fazione.pannion: 1, scandalo: 0.5 }
      - testo: "Fare la guardia ai tronchi segnati fino all'alba"
        descrizione: "Una notte intera fra le sequoie con la croce, a lanterna coperta. Lento, e il freddo non perdona."
        costo: 2
        esito:
          titolo: La notte lunga
          testo: |
            Passi la notte seduto fra le sequoie segnate, con la lanterna
            coperta e le mani sotto le ascelle. Verso l'alba senti una slitta
            fermarsi lontano, e poi tornare indietro. Nessun tronco manca, e
            Darrin la mattina ti porta una scodella di zuppa calda.
          effetti: { fazione.pannion: 1, rep.pannion: 0.5, tormento: 0.5 }
      - testo: "Fargli sapere che Nihali Cuzan sta con te"
        descrizione: "Le bande dei villaggi ascoltano Nihali da quando è tornato da Pannion. Basta fargli arrivare il nome."
        quando: [scuri.nihali >= 1]
        esito:
          titolo: Il nome di Nihali
          testo: |
            Mandi a Tenca un fante di coppe con l'angolo ingiallito, per mezzo
            di Ansgar. La mattina dopo Tenca ti aspetta alla segheria con il
            cappello in mano e ti dice che per questa luna le croci di Darrin
            restano dove sono, e che saluti Nihali da parte sua.
          effetti: { fazione.pannion: 1, rep.pannion: 0.5 }
      - testo: "Ricordargli chi tiene i conti a Qir-Azel"
        descrizione: "Il tavolo d'angolo degli Scuri adesso è tuo. Una banda dei villaggi che taglia senza dirtelo ti deve una spiegazione."
        quando: [scuri.finale == 1]
        esito:
          titolo: Il tavolo d'angolo
          testo: |
            Vai da Tenca a mezzogiorno e ti siedi sulla sua soglia senza
            chiedere. Lui ti riconosce dopo un momento, e il ronco gli resta a
            mezz'aria. Ti promette che per questa luna le croci di Darrin
            restano dove sono, e che la tua parte arriverà in città.
          effetti: { fazione.pannion: 1, rep.pannion: 0.5, rep.scuri: 0.5 }
      - testo: "Parlare ai tagliatori come si parla nelle bande"
        descrizione: "Il cerchio tagliato da una riga lo conosci dai vicoli. Chi lo incide capisce quando gli rispondi nella stessa lingua."
        quando: [origine.figlio-della-citta-bassa >= 1]
        esito:
          titolo: Il gergo dei vicoli
          testo: |
            Aspetti i tagliatori accanto alla ceppaia e li saluti con le parole
            che in Città Bassa si usano fra bande che non vogliono litigare.
            Quelli si guardano fra loro.
            Abbassano le scuri e ti portano da Gaspare Tenca, che dopo averti
            ascoltato decide che per questa luna le croci di Darrin restano
            dove sono.
          pe: { conoscenze-della-strada: 3 }
          effetti: { fazione.pannion: 1, rep.pannion: 0.5 }

  # ------------------------------------------------------------ 2 → 3 · la consegna (grado 1)
  - id: pannion-la-consegna
    presso: ponte-delle-mille-corde
    immagine: ambientazione/ponti-sospesi
    titolo: La consegna
    sommario: "Il legname di Pannion arriva al Ponte delle Mille Corde con qualche tronco di meno. Aldous Castaldi aspetta al gabbiotto dei Custodi con il contratto in mano."
    luogo: Ponte delle Mille Corde, il gabbiotto dei Custodi
    area: ponti-sospesi
    requisiti: [fazione.pannion == 2]
    testo: |
      Il convoglio del legname ci mette due giorni ad arrivare in città, otto
      carri tirati dai muli con i tronchi legati a catena. Per strada i
      carrettieri di Pannion parlano dei loro posti neri, come si parla del
      tempo. Uno dice del vetro piantato in un campo oltre il Gradone Rosso,
      che riflette un cielo di notte e sembra ridere, e un altro di un arco
      sul crinale a est della Roccia di Wren, dove al tramonto si sente odore
      di pioggia salata.

      All'imbocco del Ponte delle Mille Corde i Custodi di Passaggio pesano i
      carri uno alla volta. Accanto al gabbiotto aspetta Aldous Castaldi in
      giacca grigia, con le mani giunte dietro la schiena e due scrivani
      alle spalle. Il
      contratto con Pannion l'ha firmato sua sorella Julia, e il carico è
      corto di qualche tronco. La penale sta scritta in fondo alla seconda
      pagina.

      {politica-ed-economia Media} Una penale così la scrive chi sa che il
      carico arriverà corto prima o poi, e vuole il prezzo già fissato.

      {empatia Facile} Darrin ha messo la mano sulla borsa che porta al
      collo, e non l'ha ancora tolta. Pagherà lui, di tasca sua, prima di
      chiedere uno sconto a un Castaldi.

      {galateo Media fallita} Ti chiedi se a un Castaldi si porge la mano o
      si fa un inchino. Mentre ci pensi, Aldous ha già salutato Darrin con un
      cenno, e tu resti con la mano a mezz'aria.

      {origine mercante-dei-ponti} La bilancia dei Custodi la conosci da
      quando hai la licenza. Pende verso il gabbiotto di un'unghia, e chi
      lavora ai Ponti lo sa da anni.
    opzioni:
      - testo: "Chiedere ad Aldous di rinunciare alla penale"
        descrizione: "I tronchi li ha rubati una banda, e Pannion ha consegnato lo stesso. Una casata che mantiene le promesse lo capisce, se glielo si dice bene."
        prova: { attributo: sociale, abilita: [persuasione, galateo], difficolta: Media }
        successo:
          titolo: Le mani giunte
          testo: |
            Racconti della slitta e delle croci sulle ceppaie, e Aldous ascolta
            con le mani dietro la schiena fino alla fine. Poi fa cancellare la
            penale a uno scrivano, con una riga sola. Al primo fuoco della
            strada di ritorno Darrin ti mette in mano una lanterna da pontile,
            di ferro nero con i vetri velati di resina, e ti dice
            «Portalanterne». Intorno al fuoco i carrettieri alzano la scodella verso di te.
          pe: { persuasione: 3 }
          almeno: { rep.pannion: 2 }
          effetti: { fazione.pannion: 1, monete: 30, oggetto.pannion-lanterna-da-pontile: 1, traccia.sornione: 1, traccia.mara: 1 }
        fallimento:
          titolo: Metà penale
          testo: |
            Aldous ti ascolta e poi ti risponde a voce bassa che un contratto è
            un contratto, e fa scrivere metà della penale. Darrin la paga di
            tasca sua senza contare. Al primo fuoco della strada di ritorno ti
            mette in mano lo stesso una lanterna da pontile di ferro nero e ti dice «Portalanterne».
          almeno: { rep.pannion: 2 }
          effetti: { fazione.pannion: 1, monete: 30, oggetto.pannion-lanterna-da-pontile: 1, traccia.sornione: 1, traccia.mara: 1, scandalo: 0.5 }
      - testo: "Ripesare il legname sulla bilancia dei Custodi"
        descrizione: "I Custodi pesano in fretta, e la bilancia è vecchia quanto il ponte. Un carico pesato due volte a volte cambia."
        prova: { attributo: mentale, abilita: [percezione, tecnologia], difficolta: Media }
        successo:
          titolo: La bilancia storta
          testo: |
            Fai ripesare il primo carro con un tronco spostato di lato, e il
            peso cambia. Il piatto della bilancia pende verso il gabbiotto. I
            Custodi rifanno i conti brontolando, e il carico risulta corto di
            un tronco solo. Al primo fuoco della strada di ritorno Darrin ti dà
            una lanterna da pontile, di ferro nero con i vetri velati di
            resina, e ti dice «Portalanterne».
          pe: { percezione: 3 }
          almeno: { rep.pannion: 2 }
          effetti: { fazione.pannion: 1, monete: 30, oggetto.pannion-lanterna-da-pontile: 1, traccia.sornione: 1, traccia.mara: 1 }
        fallimento:
          titolo: I Custodi ridono
          testo: |
            Chiedi di ripesare, e il Custode della bilancia ti chiede se vuoi
            pesare anche lui. Ridono tutti, scrivani compresi. Darrin paga la
            penale di tasca sua, e al primo fuoco della strada di ritorno ti
            mette in mano una lanterna da pontile e ti dice «Portalanterne».
          almeno: { rep.pannion: 2 }
          effetti: { fazione.pannion: 1, monete: 30, oggetto.pannion-lanterna-da-pontile: 1, traccia.sornione: 1, traccia.mara: 1, scandalo: 0.5 }
      - testo: "Pagare tu una parte della penale"
        descrizione: "Darrin pagherebbe tutto da solo. Una parte la puoi mettere tu, se ce l'hai."
        requisiti: [monete >= 20]
        esito:
          titolo: Due borse
          testo: |
            Posi la tua borsa sul banco del gabbiotto accanto a quella di
            Darrin. Lui la guarda a lungo e non dice niente. Al primo fuoco
            della strada di ritorno ti restituisce qualche moneta più di quanto
            hai messo, insieme a una lanterna da pontile, e ti dice
            «Portalanterne».
          almeno: { rep.pannion: 2 }
          effetti: { fazione.pannion: 1, monete: 15, oggetto.pannion-lanterna-da-pontile: 1, traccia.sornione: 1, traccia.mara: 1 }
      - testo: "Lasciare che paghi Darrin"
        descrizione: "È il suo contratto e la sua parola. Darrin paga, e la parola resta intera."
        esito:
          titolo: La borsa al collo
          testo: |
            Darrin si sfila la borsa dal collo e conta la penale sul banco
            moneta dopo moneta, senza guardare Aldous. Aldous lo ringrazia, e
            non sembra contento di essere ringraziato. Al primo fuoco della
            strada di ritorno Darrin ti mette in mano una lanterna da pontile di ferro nero e ti dice «Portalanterne».
          almeno: { rep.pannion: 2 }
          effetti: { fazione.pannion: 1, monete: 30, oggetto.pannion-lanterna-da-pontile: 1, traccia.sornione: 1, traccia.mara: 1 }
      - testo: "Far ripesare il carico con la misura della Gilda"
        descrizione: "La licenza della Gilda ti dà il diritto di chiedere la misura ufficiale. I Custodi la odiano, e la devono dare."
        quando: [origine.mercante-dei-ponti >= 1]
        esito:
          titolo: La misura ufficiale
          testo: |
            Posi la licenza sul banco e chiedi la misura della Gilda. Il
            Custode tira fuori i pesi di bronzo da una cassa e ripesa il primo
            carro, e il carico risulta corto di un tronco solo. Al primo fuoco
            della strada di ritorno Darrin ti dà una lanterna da pontile e ti
            dice «Portalanterne».
          pe: { politica-ed-economia: 3 }
          almeno: { rep.pannion: 2 }
          effetti: { fazione.pannion: 1, monete: 30, oggetto.pannion-lanterna-da-pontile: 1, traccia.sornione: 1, traccia.mara: 1 }

  # ------------------------------------------------------------ 3 → 4 · la linfa rossa
  - id: pannion-la-linfa-rossa
    presso: pannion
    immagine: fazioni/confraternita-del-velo
    titolo: La linfa rossa
    sommario: "La Cattedrale vuole il doppio dell'unguento rosso di Frate Koln, e la linfa del Vecchio non scende più in fretta di così. Koln ti chiede di aiutarlo stanotte."
    luogo: Pannion, ai piedi del Vecchio, di notte
    area: superficie-fratturata
    requisiti: [fazione.pannion == 3]
    testo: |
      Frate Koln ti aspetta sulla porta della cappella con una lettera in
      mano e il saio sudato sotto le ascelle. La lettera viene dalla
      Cattedrale, con il sigillo di Padre Vantes, e chiede per l'infermeria
      il doppio dei vasetti di unguento rosso. Koln la legge ad alta voce
      due volte, e ride male.

      La linfa del Vecchio scende di notte, da certe crepe alla base del
      tronco, e la si raccoglie con le scodelle. Darrin lascia prendere soltanto quella che il Vecchio dà da solo goccia
      per goccia, e chi ha provato a incidere la corteccia se l'è vista con
      lui. A mezzanotte Koln ti mette
      in mano due scodelle di legno e si inginocchia fra le radici, con la
      lanterna posata sull'erba.

      {medicina Media} La linfa è densa e tiepida, e sulle dita si rapprende
      in fretta. Odora di ferro e di bosco bagnato, e le bruciature dei
      carbonai la vogliono.

      {magia Difficile} Sotto le dita c'è un filo di Mana, sottile come un
      capello. Scende lungo le radici verso il basso, invece di salire.

      {origine accolito-del-velo} Koln ti guarda le mani mentre tieni la
      scodella, e sorride. Le scodelle le tieni come si tengono le ampolle
      in Cattedrale, con il pollice fuori dal bordo, e lui lo riconosce.
    opzioni:
      - testo: "Raccogliere la linfa senza ferire il Vecchio"
        descrizione: "Si aspetta la goccia dove scende, e si cambia crepa quando rallenta. Ci vuole occhio per le crepe giuste."
        prova: { attributo: mentale, abilita: [natura, medicina], difficolta: Media }
        successo:
          titolo: Le crepe giuste
          testo: |
            Passi da una crepa all'altra seguendo il luccichio della linfa alla
            lanterna, e all'alba le scodelle sono piene. Ti accorgi che le
            crepe più generose stanno tutte dalla parte della valle, dove una
            radice grossa come una gamba scende sotto i pontili. Koln guarda
            dove guardi tu, e dice «la vecchia Pannion» prima di decidere di
            non dirlo.
          pe: { natura: 3 }
          effetti: { fazione.pannion: 1, rep.pannion: 0.5, unguento: 1 }
        fallimento:
          titolo: La scodella rovesciata
          testo: |
            Cambi crepa troppo presto, e poi troppo tardi, e alla fine
            rovesci una scodella mezza piena sull'erba. Koln sospira e la
            raccoglie con le dita. Le crepe che danno di più stanno dalla parte
            della valle, ti dice, dove la radice grossa scende verso la vecchia
            Pannion, e poi si morde il labbro.
          effetti: { fazione.pannion: 1, tormento: 0.5 }
      - testo: "Convincere Koln a chiedere meno alla Cattedrale"
        descrizione: "La Cattedrale chiede il doppio perché non sa quanto costa. Una lettera onesta di Koln potrebbe bastare."
        prova: { attributo: sociale, abilita: [persuasione, empatia], difficolta: Media }
        successo:
          titolo: La lettera onesta
          testo: |
            Lo aiuti a scrivere la risposta, una riga per ogni goccia e una
            per Darrin. Koln la firma ridendo, e ride bene stavolta. Mentre la
            sigilla ti racconta che la linfa migliore scende dalla radice
            grossa dalla parte della valle, quella che va sotto i pontili verso
            la vecchia Pannion. Poi cambia discorso e ti chiede del raccolto della resina.
          pe: { persuasione: 3 }
          effetti: { fazione.pannion: 1, rep.pannion: 0.5 }
        fallimento:
          titolo: Padre Vantes
          testo: |
            Koln ti ascolta, poi ti ricorda che Padre Vantes non è un uomo a
            cui si scrive di no. Raccogliete fino all'alba, e la radice che dà
            di più è quella che scende sotto i pontili, verso la vecchia
            Pannion. Koln la nomina e poi tace per un'ora.
          effetti: { fazione.pannion: 1, scandalo: 0.5 }
      - testo: "Seguire la radice da cui scende la linfa"
        descrizione: "La linfa più abbondante viene da una radice che corre sotto i pontili. Bisogna strisciarci sotto per vedere dove va."
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Media }
        successo:
          titolo: Sotto i pontili
          testo: |
            Strisci sotto le palafitte con la lanterna fra i denti, seguendo la
            radice nera sulla terra rossa. Al bordo dell'altura la radice si
            tuffa giù per il pendio, verso la valle, dritta come una corda.
            Quando torni Koln ti chiede soltanto fin dove andava, e quando
            glielo dici risponde «la vecchia Pannion».
          pe: { acrobazia: 3 }
          effetti: { fazione.pannion: 1, rep.pannion: 0.5 }
        fallimento:
          titolo: La palafitta
          testo: |
            Sotto i pontili la lanterna ti scivola dai denti e rotola giù per
            il pendio, e tu dietro di lei per un tratto, finché una palafitta
            ti ferma. Risali con la terra rossa nei capelli. La radice, l'hai
            vista, va verso la valle, e Koln dice che laggiù c'è la vecchia
            Pannion.
          effetti: { fazione.pannion: 1, ferite: 0.5, tormento: 0.5 }
      - testo: "Aspettare che il Vecchio dia quello che vuole"
        descrizione: "Si sta seduti fra le radici con una scodella sotto ogni crepa, e si aspetta. Una notte lunga."
        costo: 2
        esito:
          titolo: Goccia per goccia
          testo: |
            Restate fra le radici fino all'alba con una scodella sotto ogni
            crepa, e Koln si addormenta due volte, e due volte si sveglia
            ridendo. All'alba le scodelle sono piene a metà. Quelle piene di
            più stanno sotto la radice grossa che scende verso la valle, e Koln
            dice che di lì si va alla vecchia Pannion.
          effetti: { fazione.pannion: 1, rep.pannion: 0.5 }
      - testo: "Raccogliere con la preghiera della goccia"
        descrizione: "In Cattedrale le ampolle si riempiono dicendo la preghiera della goccia, una parola per ogni goccia. Koln la conosce, e non la dice mai."
        quando: [origine.accolito-del-velo >= 1]
        esito:
          titolo: La preghiera della goccia
          testo: |
            Cominci la preghiera a mezza voce, una parola per ogni goccia, e
            dopo un poco Koln la dice con te. All'alba le scodelle sono piene,
            e Koln ti indica la radice grossa che scende verso la valle, quella
            che dà la linfa migliore. Di là, dice, c'è la vecchia Pannion.
          pe: { medicina: 3 }
          effetti: { fazione.pannion: 1, rep.pannion: 0.5, unguento: 1 }

  # ------------------------------------------------------------ 4 → 5 · le lanterne dei pontili
  - id: pannion-le-lanterne-dei-pontili
    presso: pannion
    immagine: icone/old-lantern
    titolo: Le lanterne dei pontili
    sommario: "Da una settimana l'ultima lanterna del pontile più lungo si spegne ogni notte alla stessa ora. Liduina Brace dice che vuol dire che qualcuno non trova la strada."
    luogo: Pannion, il pontile più lungo, di notte
    area: superficie-fratturata
    requisiti: [fazione.pannion == 4]
    testo: |
      Liduina Brace accende le lanterne del pontile più lungo da quando
      nessuno a Pannion se lo ricorda diversamente. È piccola e curva, con
      le dita storte dai geloni, e le conta a mezza voce mentre le accende,
      una ogni tre passi, fino all'ultima, che sta sopra il bosco come una
      stella bassa. Da una settimana l'ultima si spegne ogni notte alla
      seconda ora, senza vento.

      «Vuol dire che qualcuno non trova la strada» ti dice, quando le chiedi
      perché, e sorride della tua faccia. I forestieri sorridono delle
      lanterne. Stavolta ti accorgi di essere rimasto serio, e lei se n'è
      accorta.

      {percezione Media} Quando l'ultima lanterna si spegne, giù nella valle
      se ne accende un'altra più piccola, molto lontana. Si spegne quando
      riaccendono quella del pontile.

      {resilienza Facile fallita} Il freddo della valle sale fino alle assi e
      ti entra nelle maniche. Fai finta di niente con le mani in tasca, e le
      mani lo dicono lo stesso.

      {origine figlio-del-circolo} Al Circolo il bosco di notte lo ascolti e
      basta, senza luci. Qui lo illuminano come una strada, e ti sembra che
      il bosco sia d'accordo.
    opzioni:
      - testo: "Vegliare l'ultima lanterna e vedere chi la spegne"
        descrizione: "Seduti accanto all'ultima lanterna fino alla seconda ora, con gli occhi aperti."
        prova: { attributo: mentale, abilita: [resilienza, percezione], difficolta: Media }
        successo:
          titolo: La seconda ora
          testo: |
            Alla seconda ora sale dalla valle un'aria fredda che odora di
            pietra bagnata, e la fiamma si piega e si spegne. Laggiù, fra le
            sequoie grandi, si accende la luce piccola. La riaccendi, e la luce
            si spegne. Liduina, alle tue spalle, dice che laggiù c'era Pannion,
            e che lei ci è nata.
          pe: { resilienza: 3 }
          effetti: { fazione.pannion: 1, rep.pannion: 0.5 }
        fallimento:
          titolo: Il sonno sul pontile
          testo: |
            Ti addormenti con la schiena contro la trave, e ti sveglia Liduina
            con la lanterna già spenta. Ti indica la valle con il bastone.
            Ti dice che laggiù c'era Pannion e che lei ci è nata. Laggiù, dice, c'è qualcuno che risponde alle sue lanterne.
          effetti: { fazione.pannion: 1, tormento: 0.5 }
      - testo: "Scendere dal pontile verso la luce che risponde"
        descrizione: "Le palafitte scendono fino alla terra del bosco. Da lì, al buio, si può camminare verso la luce piccola."
        prova: { attributo: fisico, abilita: [atletica, furtivita], difficolta: Media }
        successo:
          titolo: Il palo della lanterna
          testo: |
            Scendi lungo una palafitta e cammini verso la luce piccola finché
            il pendio si fa ripido. Da lì la vedi bene. È il vetro di una
            lanterna vecchia, ancora appesa a un palo storto, che prende la
            luna quando la nuvola si sposta. Sotto il palo il bosco scende
            verso tetti senza fumo. Liduina ti aspetta in cima e ti dice che
            quella è la vecchia Pannion.
          pe: { atletica: 3 }
          effetti: { fazione.pannion: 1, rep.pannion: 0.5 }
        fallimento:
          titolo: Il pendio
          testo: |
            Scendi lungo una palafitta e al buio il pendio ti prende le gambe.
            Rotoli per un tratto fra gli aghi delle sequoie e ti fermi contro
            un tronco, con la luce piccola sempre lontana. Liduina ti aiuta a
            risalire e ti dice che laggiù c'era Pannion, e che di notte non ci
            si va.
          effetti: { fazione.pannion: 1, ferite: 0.5, tormento: 0.5 }
      - testo: "Farti raccontare da Liduina perché si accendono"
        descrizione: "Liduina accende le lanterne da più anni di chiunque. Se ha voglia di parlare, sa le cose che gli altri hanno dimenticato."
        prova: { attributo: sociale, abilita: [empatia, galateo], difficolta: Media }
        successo:
          titolo: Il bosco che si perde
          testo: |
            Liduina ti racconta che un bosco senza luci finisce per perdersi, e
            che le lanterne lo riportano a casa, insieme a chi ci abita. Poi ti
            indica la valle con il bastone. Laggiù c'era Pannion, e lei ci è
            nata. Di quando se ne sono andati, dice, si parla un'altra notte.
          pe: { empatia: 3 }
          effetti: { fazione.pannion: 1, rep.pannion: 0.5 }
        fallimento:
          titolo: Un'altra notte
          testo: |
            Le fai troppe domande insieme, e Liduina smette di rispondere. Ti
            dice soltanto, indicando la valle con il bastone, che laggiù c'era
            Pannion e che si parla un'altra notte. Poi torna a contare le
            lanterne a voce più alta.
          effetti: { fazione.pannion: 1, scandalo: 0.5 }
      - testo: "Riaccendere l'ultima lanterna ogni volta che si spegne"
        descrizione: "Si sta lì tutta la notte con il tizzone in mano. Ogni volta che si spegne, la si riaccende."
        costo: 2
        esito:
          titolo: Sette volte
          testo: |
            La lanterna si spegne sette volte, e sette volte la riaccendi, e
            ogni volta giù nella valle si spegne la luce piccola. All'alba
            Liduina ti porta una tazza di latte caldo e ti dice che laggiù c'era
            Pannion, e che lei ci è nata.
          effetti: { fazione.pannion: 1, rep.pannion: 0.5, tormento: 0.5 }
      - testo: "Ascoltare il bosco invece di guardarlo"
        descrizione: "Al Circolo il bosco si ascolta al buio. Con la lanterna coperta si sente da dove arriva l'aria che la spegne."
        quando: [origine.figlio-del-circolo >= 1]
        esito:
          titolo: La strada dell'aria
          testo: |
            Copri la lanterna con la giacca e ascolti. L'aria che sale dalla
            valle passa fra le sequoie per una strada sola, sempre la stessa,
            come l'acqua in un fosso. Arriva da dove si accende la luce
            piccola. Liduina ti dice che laggiù c'era Pannion, e che lei ci è
            nata.
          pe: { natura: 3 }
          effetti: { fazione.pannion: 1, rep.pannion: 0.5 }

  # ------------------------------------------------------------ 5 → 6 · il conto del legname (grado 2)
  - id: pannion-il-conto-del-legname
    presso: municipio
    immagine: personaggi/julia-castaldi
    titolo: Il conto del legname
    sommario: "Il Ponte delle Mille Corde ha bisogno di assi nuove prima dell'inverno, e la Rappresentante chiede a Pannion il doppio del legname. Darrin scende in città perché glielo chiede lei."
    luogo: Municipio, l'ufficio della Rappresentante
    area: quartieri-alti
    requisiti: [fazione.pannion == 5]
    testo: |
      Darrin in città ci viene soltanto quando lo chiama Julia Castaldi, e
      stavolta l'ha chiamato. Sulla panca consumata dell'anticamera sta
      seduto con le mani sulle ginocchia e la giacca della domenica, che gli
      tira sulle spalle, sotto il ritratto della Rappresentante. Ti ha
      chiesto di venire con lui con una parola sola, «Parli», e tu sei
      venuto.

      {resistenza Facile fallita} La panca dell'anticamera l'hanno fatta
      apposta per far venire voglia di andarsene. Dopo un'ora la tua schiena
      è d'accordo con chi l'ha fatta.

      Un uomo con una cartella di cuoio si siede accanto a lui e gli parla
      di prezzi, a voce bassa. Darrin guarda davanti a sé finché l'uomo si
      alza.

      {politica-ed-economia Media} La cartella ha il nodo delle segherie del
      canale. Chi compra legname a peso per il canale guadagna di più se
      Pannion rompe con i Castaldi.

      Julia vi riceve in piedi, con i capelli corti e le pratiche già lette.
      Il Ponte delle Mille Corde ha bisogno di assi nuove prima
      dell'inverno, e la città chiede a Pannion il doppio del legname.
      Darrin risponde che le sequoie vicine sono tagliate, e quelle grandi
      stanno nella valle, intorno alla vecchia Pannion, dove a Pannion non si
      taglia.

      {galateo Facile} Julia ha offerto a Darrin una sedia, e lui è rimasto
      in piedi. Allora lei si è alzata, e adesso sono in piedi tutti e due.

      {origine rampollo-dei-quartieri-alti} In casa Castaldi c'è un detto
      del nonno di Julia, che la casata firma promesse e le mantiene. Alle
      cene lo ripetono spesso, di solito prima di chiedere qualcosa.
    opzioni:
      - testo: "Proporre la consegna in due stagioni"
        descrizione: "Il doppio, ma in due volte, con i carri pagati dalla città. Pannion taglia dove taglia sempre, e il ponte ha le prime assi prima dell'inverno."
        prova: { attributo: sociale, abilita: [persuasione, politica-ed-economia], difficolta: Media }
        successo:
          titolo: Due stagioni
          testo: |
            Fai i conti a voce alta carro per carro, e Julia li segue con il
            dito sulla pratica. Accetta le due stagioni e i carri pagati dalla
            città, e firma. Darrin le stringe la mano una volta, forte. Sulle
            scale ti mette in mano una borsa e dice «Di squadra», e il resto lo
            capisci da solo.
          pe: { persuasione: 3 }
          almeno: { rep.pannion: 4 }
          effetti: { fazione.pannion: 1, monete: 50 }
        fallimento:
          titolo: I conti storti
          testo: |
            Sbagli il conto dei carri, e Julia te lo corregge con la matita
            senza alzare gli occhi. Accetta lo stesso le due stagioni, perché
            Darrin ha detto di sì con la testa. Sulle scale lui ti mette in
            mano una borsa e dice «Di squadra». Ti tiene la mano un momento di
            più.
          almeno: { rep.pannion: 4 }
          effetti: { fazione.pannion: 1, monete: 50, scandalo: 0.5 }
      - testo: "Raccontare dove finiva il legname rubato"
        descrizione: "I tronchi con la croce di Darrin finivano alle segherie del canale. La Rappresentante paga il legname, e quel legname l'ha pagato due volte."
        prova: { attributo: mentale, abilita: [politica-ed-economia, accademiche], difficolta: Media }
        successo:
          titolo: Pagato due volte
          testo: |
            Le racconti delle croci sulle ceppaie e del carro coperto, e Julia
            si fa portare i registri del canale. Quando trova il legname senza
            croce venduto alla città diventa bianca. Accetta le condizioni di
            Darrin senza discutere. Sulle scale Darrin ti mette in mano una
            borsa e dice «Di squadra».
          pe: { politica-ed-economia: 3 }
          almeno: { rep.pannion: 4 }
          effetti: { fazione.pannion: 1, monete: 50, rep.castaldi: 0.5 }
        fallimento:
          titolo: Le prove
          testo: |
            Julia ti ascolta e ti chiede le prove, e tu hai soltanto il
            racconto di una notte nel bosco. Accetta lo stesso le condizioni di
            Darrin, e si vede che le accetta per lui. Sulle scale Darrin
            ti mette in mano una borsa e dice «Di squadra».
          almeno: { rep.pannion: 4 }
          effetti: { fazione.pannion: 1, monete: 50, scandalo: 0.5 }
      - testo: "Smascherare l'uomo della cartella"
        descrizione: "L'uomo dell'anticamera compra per Ottone Malgrani. Detto davanti alla Rappresentante, il suo prezzo diventa un'offesa."
        quando: [pista.pelle < 7]
        prova: { attributo: sociale, abilita: [intimidire, persuasione], difficolta: Media }
        successo:
          titolo: Prezzo nostro
          testo: |
            Esci in anticamera, prendi l'uomo per la manica e lo riporti dentro
            con la sua cartella. Dentro c'è un foglio con l'alloro dei Malgrani
            e un prezzo per tutto il legname di Pannion. Julia lo legge, lo
            piega in quattro e se lo tiene. Accetta le condizioni di Darrin, e
            sulle scale Darrin ti mette in mano una borsa e dice «Di squadra».
          pe: { intimidire: 3 }
          almeno: { rep.pannion: 4 }
          effetti: { fazione.pannion: 1, monete: 50, rep.malgrani: -0.5 }
        fallimento:
          titolo: La manica
          testo: |
            Lo prendi per la manica, e l'uomo grida abbastanza perché due
            uscieri ti mettano le mani addosso. Julia li manda via con un gesto
            stanco e accetta le condizioni di Darrin. Sulle scale Darrin
            ti mette in mano una borsa e dice «Di squadra».
          almeno: { rep.pannion: 4 }
          effetti: { fazione.pannion: 1, monete: 50, scandalo: 1 }
      - testo: "Proporre che le cooperative segnino il legname con Pannion"
        descrizione: "Le segherie del canale adesso sono delle cooperative. Possono comprare direttamente da Pannion, con la croce di Darrin e la bolla della città."
        quando: [pista.pelle >= 7]
        prova: { attributo: mentale, abilita: [politica-ed-economia, accademiche], difficolta: Media }
        successo:
          titolo: La croce e la bolla
          testo: |
            Spieghi l'idea a Julia, e lei la prende al volo. Le cooperative
            hanno bisogno di legname quanto la città, e una croce di Darrin con
            la bolla della città non la ruba nessuno. Firma, e sulle scale
            Darrin ti mette in mano una borsa e dice «Di squadra».
          pe: { politica-ed-economia: 3 }
          almeno: { rep.pannion: 4 }
          effetti: { fazione.pannion: 1, monete: 50, rep.castaldi: 0.5 }
        fallimento:
          titolo: Le cooperative
          testo: |
            Julia ti fa notare che le cooperative non hanno ancora un
            registro, e che senza registro non si firma niente. Accetta lo
            stesso le condizioni di Darrin. Sulle scale lui ti mette in mano
            una borsa e dice «Di squadra».
          almeno: { rep.pannion: 4 }
          effetti: { fazione.pannion: 1, monete: 50, scandalo: 0.5 }
      - testo: "Lasciar parlare Darrin"
        descrizione: "Darrin parla poco, e Julia lo ascolta quando parla. Quello che dice costa più a lui che a lei."
        esito:
          titolo: Una frase
          testo: |
            Darrin dice una frase sola, che il doppio lo darà Pannion e che lo
            pagherà Pannion, e che nella valle non si taglia. Julia lo guarda a
            lungo e firma. Sulle scale Darrin ti mette in mano una borsa e dice
            «Di squadra», e poi aggiunge che la prossima volta parli tu.
          almeno: { rep.pannion: 4 }
          effetti: { fazione.pannion: 1, monete: 50 }
      - testo: "Ricordare a Julia il detto di suo nonno"
        descrizione: "Lo conosci dalle cene dei Quartieri Alti. Detto da uno che ci è cresciuto, in quella stanza, è difficile rispondergli di no."
        quando: [origine.rampollo-dei-quartieri-alti >= 1]
        esito:
          titolo: Il detto del nonno
          testo: |
            Le ricordi il detto del nonno con il tono delle cene, e Julia
            sorride per la prima volta. Ti risponde che i Castaldi mantengono
            volentieri anche le promesse buone degli altri, e accetta le
            condizioni di Darrin. Sulle scale lui ti mette in mano una borsa e
            dice «Di squadra».
          pe: { galateo: 3 }
          almeno: { rep.pannion: 4 }
          effetti: { fazione.pannion: 1, monete: 50, rep.castaldi: 0.5 }
