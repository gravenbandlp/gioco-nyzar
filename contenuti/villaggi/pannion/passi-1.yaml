# La quest di Pannion, Atto I e II (fazione.pannion 0 → 6).
# - 0 → 1 `pannion-il-fumo-di-pannion` (Pannion, pista.arena >= 5): l'arrivo, Darrin Huld che parla al Vecchio, la
#   carbonaia spaccata da una radice del Vecchio salita fin lì.
# - 1 → 2 `pannion-i-tronchi-segnati` (Pannion, di notte): i tronchi segnati per i ponti tagliati dalla banda di
#   Gaspare Tenca. Varianti: il Figlio della Città Bassa parla il gergo delle bande; scuri.nihali e scuri.finale.
# - 2 → 3 `pannion-la-consegna` (Ponte delle Mille Corde, grado 1): il carico corto davanti ad Aldous Castaldi e alla
#   penale. Per strada i carrettieri parlano del vetro che ride e dell'arco sul crinale: traccia.sornione e
#   traccia.mara.
# - 3 → 4 `pannion-la-linfa-rossa` (Pannion): Frate Koln, la linfa del Vecchio e la Cattedrale che ne vuole di più.
#   Le radici scendono verso la vecchia Pannion. Opzione d'origine dell'Accolito del Velo.
# - 4 → 5 `pannion-le-lanterne-dei-pontili` (Pannion): Liduina Brace e l'ultima lanterna, che si spegne ogni notte
#   alla stessa ora. Opzione d'origine del Figlio del Circolo.
# - 5 → 6 `pannion-il-conto-del-legname` (Municipio, grado 2): Julia Castaldi chiede il doppio del legname per il
#   ponte in dissesto. Varianti con pista.pelle < 7 (l'uomo dei Malgrani) e >= 7 (le cooperative della segheria).
# Nomi nuovi in questo file: Gaspare Tenca (capo della banda di Pannion), Liduina Brace (la donna delle lanterne).
storylet:
  # ------------------------------------------------------------ 0 → 1 · il fumo di Pannion
  - id: pannion-il-fumo-di-pannion
    presso: pannion
    immagine: ambientazione/foresta-strisciante
    titolo: Il fumo di Pannion
    sommario: "Darrin Huld vuole qualcuno di fuori che guardi le radici del Vecchio senza pregarci sopra."
    luogo: Pannion, la piazza del Vecchio
    area: superficie-fratturata
    requisiti: [fazione.pannion == 0, pista.arena >= 5]
    testo: |
      Il fumo di Pannion lo vedi dalla strada mezza giornata prima delle case, una riga grigia che sale dritta
      sopra l'altura. In piazza sta il Vecchio Albero, un tronco nero senza una foglia, con la corteccia dura
      e lucida di fuliggine.

      Davanti al Vecchio un uomo con le mani larghe e un orecchio mezzo bruciato gli parla a voce bassa.
      Ansgar, il ragazzo con le mani nere fino ai polsi che ti ha guidato dal bivio, ti dice che è Darrin Huld
      e che non va interrotto.

      Poi Darrin ti guarda dalle scarpe alla faccia. «Le radici» dice, e ti porta sul fianco dell'altura da
      una carbonaia coperta di zolle che fuma storta. È una cupola alta quanto un uomo, con una dozzina di
      sfiatatoi alla base. Una radice nera grossa come un braccio l'ha spaccata da sotto ed è uscita dalla
      parte di sopra, e dalla crepa esce una lingua di fumo bianco. La corteccia della radice è intatta in
      mezzo al calore. Il legno vivo è pieno d'acqua e brucia male, e te lo ripeti mentre guardi la radice.

      {natura Facile} Fumo bianco vuol dire aria. Una carbonaia che prende aria brucia tutta, e il fuoco
      arriva ai pontili.

      *Una radice del Vecchio, a cinquanta passi dal tronco.* Darrin ti mette in mano una pala e si toglie la
      giacca.

      {origine figlio-del-circolo} Al Circolo ti hanno insegnato che un albero cresce lontano dal fumo. Questo
      ci è cresciuto dentro, e le radici vanno dove vogliono.
    opzioni:
      - testo: "Chiudere la crepa con le zolle"
        descrizione: "Terra rossa e zolle d'erba, buttate in fretta sulla crepa finché il fumo torna grigio."
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Media }
        successo:
          titolo: Il fumo grigio
          testo: |
            Butti terra sulla crepa a palate, con il caldo della carbonaia che ti asciuga gli occhi, e Darrin
            batte le zolle con il dorso della pala dove le butti tu. La terra rossa è grassa e si attacca al
            ferro, e devi batterla sul bordo per staccarla. Dopo un tempo lungo il fumo torna grigio. La sera,
            al fuoco dei carbonai, Darrin ti indica un posto sulla panca e dice soltanto «Resti». Ansgar ti
            spiega che è un invito.
          pe: { atletica: 3 }
          effetti: { fazione.pannion: 1, rep.pannion: 0.5 }
        fallimento:
          titolo: La lingua di fuoco
          testo: |
            Una zolla ti scivola dalla pala e la crepa si allarga, e dalla carbonaia esce una lingua di fuoco
            che ti lecca il braccio. I peli dell'avambraccio si arricciano con un odore di corno bruciato.
            Darrin ti scosta con una spallata e la chiude da solo, mentre i carbonai accorsi guardano te. La
            sera ti indica lo stesso un posto sulla panca accanto al fuoco e dice soltanto «Resti».
          effetti: { fazione.pannion: 1, ferite: 0.5, scandalo: 0.5 }
      - testo: "Leggere il fumo e chiudere gli sfiatatoi giusti"
        descrizione: "Una carbonaia ha una dozzina di sfiatatoi. Chiudendo quelli giusti l'aria smette di entrare dalla crepa."
        prova: { attributo: mentale, abilita: [natura, percezione], difficolta: Media }
        successo:
          titolo: Gli sfiatatoi
          testo: |
            Giri intorno alla carbonaia guardando il fumo che esce dai buchi. Da ogni buco esce di un colore
            suo, dal grigio della cenere al bianco quasi trasparente, e il più chiaro è anche il più caldo sul
            dorso della mano. Chiudi con le zolle quelli da cui esce più chiaro, e l'aria smette di tirare e
            la crepa si spegne da sola. Darrin ti guarda fare senza muoversi. La sera, al fuoco dei carbonai,
            ti indica un posto sulla panca e dice soltanto «Resti».
          pe: { natura: 3 }
          effetti: { fazione.pannion: 1, rep.pannion: 0.5 }
        fallimento:
          titolo: Il buco sbagliato
          testo: |
            Chiudi gli sfiatatoi sbagliati, e la carbonaia comincia a tirare dalla crepa come un camino, con
            un fischio basso che senti nelle orecchie. Darrin ne riapre due con un calcio e ne chiude altri
            tre, senza una parola. La sera ti indica lo stesso un posto sulla panca, e un carbonaio ride
            dietro la scodella.
          effetti: { fazione.pannion: 1, scandalo: 0.5 }
      - testo: "Mettere in fila i carbonai con i secchi di terra"
        descrizione: "I carbonai accorrono a uno a uno e si intralciano."
        prova: { attributo: sociale, abilita: [persuasione, intimidire], difficolta: Media }
        successo:
          titolo: La fila
          testo: |
            Alzi la voce, e i carbonai si mettono in fila dal mucchio di terra alla carbonaia, passandosi i
            secchi di mano in mano. Sono secchi di legno cerchiati di ferro, e passano lungo la fila senza
            perdere una manciata di terra. La crepa è chiusa prima che Darrin finisca di tirarsi su le
            maniche. La sera, al fuoco, Darrin ti indica un posto sulla panca e dice soltanto «Resti».
          pe: { persuasione: 3 }
          effetti: { fazione.pannion: 1, rep.pannion: 0.5 }
        fallimento:
          titolo: Il forestiero che grida
          testo: |
            Alzi la voce, e i carbonai ti guardano come si guarda un cane che abbaia alla luna. Poi Darrin fa
            un solo gesto netto con la mano, e la fila si forma da sola. La sera ti indica lo stesso un posto
            sulla panca accanto al fuoco e dice soltanto «Resti».
          effetti: { fazione.pannion: 1, scandalo: 0.5 }
      - testo: "Portare la terra a Darrin e lasciar fare a lui"
        descrizione: "Darrin sa che cosa fare, e lo fa da trent'anni."
        costo: 2
        esito:
          titolo: La terra rossa
          testo: |
            Porti terra fino a sera, un secchio dopo l'altro, e Darrin la sistema sulla crepa con le mani,
            come si sistema una coperta su un bambino. Le sue mani non restano mai ferme sulla stessa zolla,
            perché la terra sopra la crepa scotta. Quando la carbonaia torna a fumare grigio è buio. Al fuoco
            ti indica un posto sulla panca e dice soltanto «Resti».
          pe: { resistenza: 2 }
          effetti: { fazione.pannion: 1, rep.pannion: 0.5 }

  # ------------------------------------------------------------ 1 → 2 · i tronchi segnati
  - id: pannion-i-tronchi-segnati
    presso: pannion
    immagine: ambientazione/segheria-di-qir-azel
    titolo: I tronchi segnati
    sommario: "Le sequoie segnate per i ponti di Qir-Azel spariscono di notte a una o due per volta."
    luogo: Pannion, i tagli del versante nord, di notte
    area: superficie-fratturata
    requisiti: [fazione.pannion == 1]
    testo: |
      Darrin segna con una croce di terra rossa le sequoie che vanno ai ponti di Qir-Azel. Stamattina sul
      versante nord ci sono tre ceppaie fresche con la croce sui trucioli, e dei tronchi nessuna traccia. I
      tagli sono puliti, con la tacca di caduta dalla parte della valle, e li ha fatti gente che il mestiere
      lo sa. Una slitta ha trascinato i tronchi verso un fiume di linfa, e i due solchi dei pattini finiscono
      dove comincia il vetro.

      Ansgar si gratta la scottatura e fa a voce bassa il nome di Gaspare Tenca, che di giorno taglia come gli
      altri e di notte ha una banda che vende in città il legname rubato. Darrin guarda le ceppaie e poi te.
      La sera ti aspetta in fondo all'ultimo pontile con una lanterna coperta.

      {origine figlio-della-citta-bassa} Sulla ceppaia qualcuno ha inciso un cerchio tagliato da una riga. In
      Città Bassa è il segno delle bande dei villaggi che portano merce agli Scuri.
    opzioni:
      - testo: "Fermare i tagliatori al lavoro"
        descrizione: "Due uomini con la scure, il fazzoletto sulla faccia e un tronco già mezzo abbattuto."
        combattimento: pannion-tagliatori
        vittoria:
          titolo: La slitta abbandonata
          testo: |
            Il secondo tagliatore scappa nel buio lasciando la scure piantata nel tronco e la slitta carica in
            mezzo al sentiero. La lama è affilata di fresco e ha ancora la resina del taglio. Sul manico della
            scure c'è inciso il cerchio tagliato da una riga. Darrin riporta su la slitta con due della
            squadra, e alla piazza ti dice che il carico per la città sarà corto lo stesso, ma meno.
          pe: { armi-da-mischia: 3 }
          effetti: { fazione.pannion: 1, rep.pannion: 0.5 }
        sconfitta:
          titolo: Il fazzoletto
          testo: |
            Un colpo di manico ti prende dietro il ginocchio e finisci con la faccia nella terra rossa, e te
            la ritrovi fra i denti. Quando ti rialzi i tagliatori sono spariti con il tronco, e di loro resta
            un fazzoletto scuro impigliato in un ramo. Darrin lo guarda e lo butta nel fuoco della piazza. Il
            carico per la città sarà corto.
          effetti: { fazione.pannion: 1, scandalo: 0.5 }
      - testo: "Seguire la slitta fino a chi compra"
        descrizione: "I tronchi rubati finiscono da qualche parte."
        prova: { attributo: fisico, abilita: [furtivita, atletica], difficolta: Media }
        successo:
          titolo: Il carro coperto
          testo: |
            Segui la slitta fino al fiume di linfa e poi lungo il vetro, al riparo dei tronchi. Sul vetro i
            pattini non fanno rumore, e la senti soltanto quando gli uomini imprecano nelle curve. All'alba,
            dove il bosco finisce, c'è un carro coperto, e un uomo con un panciotto di città paga Gaspare
            Tenca con una borsa che tintinna. Lo riconosci dalla barba rossa e dal ronco alla cintura.
          pe: { furtivita: 3 }
          effetti: { fazione.pannion: 1, rep.pannion: 0.5, informazioni.voce: 1 }
        fallimento:
          titolo: Il ramo secco
          testo: |
            Un ramo secco ti si spezza sotto il piede, e la slitta si ferma. Smette di chiamare anche un
            uccello notturno che hai sentito per tutta la strada. Resti accucciat{o|a} nel buio a lungo,
            finché la senti ripartire più in fretta, verso un posto dove non riesci a seguirla. Al ritorno hai
            le ginocchia gelate e un nome solo, quello di Tenca.
          effetti: { fazione.pannion: 1, sospetto: 0.5 }
      - testo: "Andare a parlare con Gaspare Tenca"
        descrizione: "Tenca di giorno taglia per Darrin come tutti. Si può andare da lui a dirgli che le croci si vedono."
        prova: { attributo: sociale, abilita: [intimidire, persuasione], difficolta: Media }
        successo:
          titolo: La barba rossa
          testo: |
            Tenca sta affilando un ronco da potatura sulla soglia di casa, un uomo con la barba rossa e le
            spalle di chi tira tronchi da vent'anni. Lo ascolti negare, e intanto la cote passa sulla lama con
            un ritmo che non cambia. Poi gli dici dove finiscono le tracce della slitta. Smette di affilare e
            ti risponde che per questa luna le croci di Darrin restano dove sono.
          pe: { intimidire: 3 }
          effetti: { fazione.pannion: 1, rep.pannion: 0.5 }
        fallimento:
          titolo: Il ronco
          testo: |
            Tenca ti ascolta continuando ad affilare il ronco, e non alza mai gli occhi dal filo della lama.
            Alla fine ti dice che se ti trova un'altra volta vicino alle sue slitte ti spacca le ginocchia con
            il manico. Gli uomini seduti sulla sua soglia ridono. Darrin, la sera, sa già tutto.
          effetti: { fazione.pannion: 1, scandalo: 0.5 }
      - testo: "Fare la guardia ai tronchi segnati fino all'alba"
        descrizione: "Una notte intera fra le sequoie con la croce, a lanterna coperta. Lento, e il freddo non perdona."
        costo: 2
        esito:
          titolo: La notte lunga
          testo: |
            Passi la notte sedut{o|a} fra le sequoie segnate, con la lanterna coperta e le mani sotto le
            ascelle. Il freddo sale dalla terra attraverso i calzoni, e a metà notte non senti più i piedi.
            Verso l'alba senti una slitta fermarsi lontano, e poi tornare indietro. Nessun tronco manca, e
            Darrin la mattina ti porta una scodella di zuppa calda.
          effetti: { fazione.pannion: 1, rep.pannion: 0.5, tormento: 0.5 }
      - testo: "Fargli sapere che Nihali Cuzan sta con te"
        descrizione: "Le bande dei villaggi ascoltano Nihali da quando è tornato da Pannion."
        quando: [scuri.nihali >= 1]
        esito:
          titolo: Il nome di Nihali
          testo: |
            Mandi a Tenca un fante di coppe con l'angolo ingiallito, per mezzo di Ansgar. La mattina dopo
            Tenca ti aspetta alla segheria con il cappello in mano, e lo gira fra le dita mentre parla. Ti
            dice che per questa luna le croci di Darrin restano dove sono, e che saluti Nihali da parte sua.
          effetti: { fazione.pannion: 1, rep.pannion: 0.5 }
      - testo: "Ricordargli chi tiene i conti a Qir-Azel"
        descrizione: "Il tavolo d'angolo degli Scuri adesso è tuo. Una banda dei villaggi che taglia senza dirtelo ti deve una spiegazione."
        quando: [scuri.finale == 1]
        esito:
          titolo: Il tavolo d'angolo
          testo: |
            Vai da Tenca a mezzogiorno e ti siedi sulla sua soglia senza chiedere. È una pietra liscia e
            consumata dagli stivali, e ci stai sedut{o|a} senza fretta. Lui ti riconosce dopo un momento, e il
            ronco gli resta a mezz'aria. Ti promette che per questa luna le croci di Darrin restano dove sono,
            e che la tua parte arriverà in città.
          effetti: { fazione.pannion: 1, rep.pannion: 0.5, rep.scuri: 0.5 }
      - testo: "Parlare ai tagliatori come si parla nelle bande"
        descrizione: "Il cerchio tagliato da una riga lo conosci dai vicoli."
        quando: [origine.figlio-della-citta-bassa >= 1]
        esito:
          titolo: Il gergo dei vicoli
          testo: |
            Aspetti i tagliatori accanto alla ceppaia e li saluti con le parole che in Città Bassa si usano
            fra bande che non vogliono litigare. Quelli si guardano fra loro, e le scuri restano alzate finché
            non hai finito di parlare. Poi le abbassano e ti portano da Gaspare Tenca, che dopo averti
            ascoltato decide che per questa luna le croci di Darrin restano dove sono.
          pe: { conoscenze-della-strada: 3 }
          effetti: { fazione.pannion: 1, rep.pannion: 0.5 }

  # ------------------------------------------------------------ 2 → 3 · la consegna (grado 1)
  - id: pannion-la-consegna
    presso: ponte-delle-mille-corde
    immagine: ambientazione/ponti-sospesi
    titolo: La consegna
    sommario: "Il legname di Pannion arriva al Ponte delle Mille Corde con qualche tronco di meno."
    luogo: Ponte delle Mille Corde, il gabbiotto dei Custodi
    area: ponti-sospesi
    requisiti: [fazione.pannion == 2]
    testo: |
      Per strada i carrettieri di Pannion parlano dei loro posti neri come del tempo. Uno dice del vetro
      piantato in un campo oltre il Gradone Rosso, che riflette un cielo di notte e sembra ridere. Un altro di
      un arco sul crinale a est della Roccia di Wren, che al tramonto sa di pioggia salata.

      All'imbocco del Ponte delle Mille Corde i Custodi di Passaggio pesano i carri. La bilancia è una
      piattaforma di travi grande quanto un carro, appesa con quattro catene a un braccio di ferro, e a ogni
      carro le catene scricchiolano e il ponte dondola appena. Accanto al gabbiotto aspetta Aldous Castaldi
      con le mani dietro la schiena e due scrivani. Il contratto con Pannion l'ha firmato sua sorella Julia, e
      il carico è corto di qualche tronco. La penale sta in fondo alla seconda pagina.

      {empatia Facile} Darrin tiene la mano sulla borsa al collo. Pagherà di tasca sua prima di chiedere uno
      sconto a un Castaldi.

      {origine mercante-dei-ponti} La bilancia dei Custodi pende di un'unghia verso il gabbiotto, e ai Ponti
      lo sanno tutti.
    opzioni:
      - testo: "Chiedere ad Aldous di rinunciare alla penale"
        descrizione: "I tronchi li ha rubati una banda, e Pannion ha consegnato lo stesso."
        prova: { attributo: sociale, abilita: [persuasione, galateo], difficolta: Media }
        successo:
          titolo: Le mani giunte
          testo: |
            Racconti della slitta e delle croci sulle ceppaie, e Aldous ascolta con le mani dietro la schiena
            fino alla fine. Poi fa cancellare la penale a uno scrivano, con una riga sola di penna d'oca che
            lo scrivano asciuga soffiandoci sopra. Al primo fuoco della strada di ritorno Darrin ti mette in
            mano una lanterna da pontile, di ferro nero con i vetri velati di resina, e ti dice
            «Portalanterne».
          pe: { persuasione: 3 }
          almeno: { rep.pannion: 2 }
          effetti: { fazione.pannion: 1, monete: 30, oggetto.pannion-lanterna-da-pontile: 1, traccia.sornione: 1, traccia.mara: 1 }
        fallimento:
          titolo: Metà penale
          testo: |
            Aldous ti ascolta e poi ti risponde a voce bassa che un contratto è un contratto, e fa scrivere
            metà della penale. Darrin tira fuori le monete dalla borsa al collo ancora tiepide e le spinge sul
            banco senza contarle. Al primo fuoco della strada di ritorno ti mette in mano lo stesso una
            lanterna da pontile di ferro nero e ti dice «Portalanterne».
          almeno: { rep.pannion: 2 }
          effetti: { fazione.pannion: 1, monete: 30, oggetto.pannion-lanterna-da-pontile: 1, traccia.sornione: 1, traccia.mara: 1, scandalo: 0.5 }
      - testo: "Ripesare il legname sulla bilancia dei Custodi"
        descrizione: "I Custodi pesano in fretta, e la bilancia è vecchia quanto il ponte. Un carico pesato due volte a volte cambia."
        prova: { attributo: mentale, abilita: [percezione, tecnologia], difficolta: Media }
        successo:
          titolo: La bilancia storta
          testo: |
            Fai ripesare il primo carro con un tronco spostato di lato, e il peso cambia. La piattaforma
            smette di pendere verso il gabbiotto, e l'ago sul braccio torna indietro di una tacca. I Custodi
            rifanno i conti brontolando, e il carico risulta corto di un tronco solo. Al primo fuoco della
            strada di ritorno Darrin ti dà una lanterna da pontile, di ferro nero con i vetri velati di
            resina, e ti dice «Portalanterne».
          pe: { percezione: 3 }
          almeno: { rep.pannion: 2 }
          effetti: { fazione.pannion: 1, monete: 30, oggetto.pannion-lanterna-da-pontile: 1, traccia.sornione: 1, traccia.mara: 1 }
        fallimento:
          titolo: I Custodi ridono
          testo: |
            Chiedi di ripesare, e il Custode della bilancia ti chiede se vuoi pesare anche lui. Ridono tutti,
            e uno degli scrivani si asciuga gli occhi con la manica. Darrin paga la penale di tasca sua, e al
            primo fuoco della strada di ritorno ti mette in mano una lanterna da pontile e ti dice
            «Portalanterne».
          almeno: { rep.pannion: 2 }
          effetti: { fazione.pannion: 1, monete: 30, oggetto.pannion-lanterna-da-pontile: 1, traccia.sornione: 1, traccia.mara: 1, scandalo: 0.5 }
      - testo: "Pagare tu una parte della penale"
        descrizione: "Darrin pagherebbe tutto da solo."
        requisiti: [monete >= 20]
        esito:
          titolo: Due borse
          testo: |
            Posi la tua borsa sul banco del gabbiotto accanto a quella di Darrin. Il banco è di quercia scura
            e ha il piano segnato dalle tacche di chi ci conta le monete da anni. Darrin guarda la tua borsa a
            lungo e non dice niente. Al primo fuoco della strada di ritorno ti restituisce qualche moneta più
            di quanto hai messo, insieme a una lanterna da pontile, e ti dice «Portalanterne».
          almeno: { rep.pannion: 2 }
          effetti: { fazione.pannion: 1, monete: 15, oggetto.pannion-lanterna-da-pontile: 1, traccia.sornione: 1, traccia.mara: 1 }
      - testo: "Lasciare che paghi Darrin"
        descrizione: "È il suo contratto e la sua parola."
        esito:
          titolo: La borsa al collo
          testo: |
            Darrin si sfila la borsa dal collo e conta la penale sul banco moneta dopo moneta. Le mette in
            pile ordinate e non guarda mai Aldous. Aldous lo ringrazia, e non sembra contento di essere
            ringraziato. Al primo fuoco della strada di ritorno Darrin ti mette in mano una lanterna da
            pontile di ferro nero e ti dice «Portalanterne».
          almeno: { rep.pannion: 2 }
          effetti: { fazione.pannion: 1, monete: 30, oggetto.pannion-lanterna-da-pontile: 1, traccia.sornione: 1, traccia.mara: 1 }
      - testo: "Far ripesare il carico con la misura della Gilda"
        descrizione: "La licenza della Gilda ti dà il diritto di chiedere la misura ufficiale."
        quando: [origine.mercante-dei-ponti >= 1]
        esito:
          titolo: La misura ufficiale
          testo: |
            Posi la licenza sul banco e chiedi la misura della Gilda. Il Custode tira fuori da una cassa i
            pesi di bronzo, che sono verdi sugli spigoli e lucidi dove le dita li prendono. Ripesa il primo
            carro, e il carico risulta corto di un tronco solo. Al primo fuoco della strada di ritorno Darrin
            ti dà una lanterna da pontile e ti dice «Portalanterne».
          pe: { politica-ed-economia: 3 }
          almeno: { rep.pannion: 2 }
          effetti: { fazione.pannion: 1, monete: 30, oggetto.pannion-lanterna-da-pontile: 1, traccia.sornione: 1, traccia.mara: 1 }

  # ------------------------------------------------------------ 3 → 4 · la linfa rossa
  - id: pannion-la-linfa-rossa
    presso: pannion
    immagine: fazioni/confraternita-del-velo
    titolo: La linfa rossa
    sommario: "La Cattedrale vuole il doppio dell'unguento rosso di Frate Koln, e la linfa del Vecchio non scende più in fretta di così."
    luogo: Pannion, ai piedi del Vecchio, di notte
    area: superficie-fratturata
    requisiti: [fazione.pannion == 3]
    testo: |
      Frate Koln ti aspetta sulla porta della cappella con una lettera della Cattedrale. Ha il sigillo di
      Padre Vantes e chiede per l'infermeria il doppio dei vasetti di unguento rosso. La carta è spessa e
      bianca, di quella che a Pannion non si trova. Koln la legge ad alta voce due volte e ride male.

      La linfa del Vecchio scende di notte da certe crepe alla base del tronco. Darrin lascia raccogliere
      soltanto quella che il Vecchio dà da solo, e chi ha inciso la corteccia se l'è vista con lui. A
      mezzanotte Koln ti dà due scodelle di legno e si inginocchia fra le radici con la lanterna sull'erba.
      Intorno alle crepe la corteccia è tiepida sotto il palmo, e la notte è fredda. Ti dici che il legno nero
      tiene il caldo del giorno.

      {magia Difficile} Sotto le dita c'è un filo di Mana sottile come un capello, che scende lungo le radici
      invece di salire.

      {origine accolito-del-velo} Koln sorride quando vede che tieni la scodella come un'ampolla della
      Cattedrale, con il pollice fuori dal bordo.
    opzioni:
      - testo: "Raccogliere la linfa senza ferire il Vecchio"
        descrizione: "Si aspetta la goccia dove scende, e si cambia crepa quando rallenta."
        prova: { attributo: mentale, abilita: [natura, medicina], difficolta: Media }
        successo:
          titolo: Le crepe giuste
          testo: |
            Passi da una crepa all'altra seguendo il luccichio della linfa alla lanterna, e all'alba le
            scodelle sono piene. Ogni goccia resta appesa al bordo della crepa e cresce fino a diventare
            grossa come un'unghia, e poi cade tutta insieme. Ti accorgi che le crepe più generose stanno tutte
            dalla parte della valle, dove una radice grossa come una gamba scende sotto i pontili. Koln guarda
            dove guardi tu, e dice «la vecchia Pannion» prima di decidere di non dirlo.
          pe: { natura: 3 }
          effetti: { fazione.pannion: 1, rep.pannion: 0.5, unguento: 1 }
        fallimento:
          titolo: La scodella rovesciata
          testo: |
            Cambi crepa troppo presto, e poi troppo tardi, e alla fine rovesci una scodella mezza piena
            sull'erba. La linfa non si allarga e resta in una pozza tonda e lucida. Koln sospira e la
            raccoglie con le dita. Le crepe che danno di più stanno dalla parte della valle, ti dice, dove la
            radice grossa scende verso la vecchia Pannion, e poi si morde il labbro.
          effetti: { fazione.pannion: 1, tormento: 0.5 }
      - testo: "Convincere Koln a chiedere meno alla Cattedrale"
        descrizione: "La Cattedrale chiede il doppio perché non sa quanto costa. Una lettera onesta di Koln potrebbe bastare."
        prova: { attributo: sociale, abilita: [persuasione, empatia], difficolta: Media }
        successo:
          titolo: La lettera onesta
          testo: |
            Lo aiuti a scrivere la risposta, una riga per ogni goccia e una per Darrin. Koln la firma ridendo,
            e ride bene stavolta. Scalda la ceralacca alla fiamma della lanterna, e mentre la sigilla ti
            racconta che la linfa migliore scende dalla radice grossa dalla parte della valle, quella che va
            sotto i pontili verso la vecchia Pannion.
          pe: { persuasione: 3 }
          effetti: { fazione.pannion: 1, rep.pannion: 0.5 }
        fallimento:
          titolo: Padre Vantes
          testo: |
            Koln ti ascolta, poi ti ricorda che Padre Vantes non è un uomo a cui si scrive di no. Raccogliete
            fino all'alba senza parlare, e l'unico rumore è quello delle gocce sul legno delle scodelle. La
            radice che dà di più è quella che scende sotto i pontili, verso la vecchia Pannion. Koln la nomina
            e poi tace per un'ora.
          effetti: { fazione.pannion: 1, scandalo: 0.5 }
      - testo: "Seguire la radice da cui scende la linfa"
        descrizione: "La linfa più abbondante viene da una radice che corre sotto i pontili. Bisogna strisciarci sotto per vedere dove va."
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Media }
        successo:
          titolo: Sotto i pontili
          testo: |
            Strisci sotto le palafitte con la lanterna fra i denti, seguendo la radice nera sulla terra rossa.
            Per tutta la larghezza della radice la terra è asciutta, e non ci crescono né erba né funghi. Al
            bordo dell'altura la radice si tuffa giù per il pendio, verso la valle, dritta come una corda.
            Quando torni Koln ti chiede soltanto fin dove andava, e quando glielo dici risponde «la vecchia
            Pannion».
          pe: { acrobazia: 3 }
          effetti: { fazione.pannion: 1, rep.pannion: 0.5 }
        fallimento:
          titolo: La palafitta
          testo: |
            Sotto i pontili la lanterna ti scivola dai denti e rotola giù per il pendio, e tu dietro di lei
            per un tratto, finché una palafitta ti ferma con un colpo sordo nelle costole. Risali con la terra
            rossa nei capelli. La radice, l'hai vista, va verso la valle, e Koln dice che laggiù c'è la
            vecchia Pannion.
          effetti: { fazione.pannion: 1, ferite: 0.5, tormento: 0.5 }
      - testo: "Aspettare che il Vecchio dia quello che vuole"
        descrizione: "Si sta seduti fra le radici con una scodella sotto ogni crepa, e si aspetta."
        costo: 2
        esito:
          titolo: Goccia per goccia
          testo: |
            Restate fra le radici fino all'alba con una scodella sotto ogni crepa, e Koln si addormenta due
            volte, e due volte si sveglia ridendo. Le gocce cadono nel legno con un rumore piccolo e regolare,
            e dopo un po' smetti di sentirlo. All'alba le scodelle sono piene a metà. Quelle piene di più
            stanno sotto la radice grossa che scende verso la valle, e Koln dice che di lì si va alla vecchia
            Pannion.
          effetti: { fazione.pannion: 1, rep.pannion: 0.5 }
      - testo: "Raccogliere con la preghiera della goccia"
        descrizione: "In Cattedrale le ampolle si riempiono dicendo la preghiera della goccia, una parola per ogni goccia. Koln la conosce, e non la dice mai."
        quando: [origine.accolito-del-velo >= 1]
        esito:
          titolo: La preghiera della goccia
          testo: |
            Cominci la preghiera a mezza voce, una parola per ogni goccia. Dopo un poco Koln la dice con te e
            non ride, e dice una parola ogni volta che una goccia tocca il legno. All'alba le scodelle sono
            piene, e Koln ti indica la radice grossa che scende verso la valle, quella che dà la linfa
            migliore. Di là, dice, c'è la vecchia Pannion.
          pe: { medicina: 3 }
          effetti: { fazione.pannion: 1, rep.pannion: 0.5, unguento: 1 }

  # ------------------------------------------------------------ 4 → 5 · le lanterne dei pontili
  - id: pannion-le-lanterne-dei-pontili
    presso: pannion
    immagine: icone/old-lantern
    titolo: Le lanterne dei pontili
    sommario: "Da una settimana l'ultima lanterna del pontile più lungo si spegne ogni notte alla stessa ora."
    luogo: Pannion, il pontile più lungo, di notte
    area: superficie-fratturata
    requisiti: [fazione.pannion == 4]
    testo: |
      Liduina Brace accende le lanterne del pontile più lungo da che Pannion ricordi. È piccola e curva, con
      le dita storte dai geloni, e le conta a mezza voce fino all'ultima, che sta sopra il bosco come una
      stella bassa. Le assi del pontile sono lisce al centro, dove lei passa ogni sera con l'olio e il
      tizzone, e ruvide sui bordi.

      Da una settimana l'ultima si spegne ogni notte alla seconda ora, senza vento. Lo stoppino è asciutto e
      nel vetro l'olio arriva ancora a metà. Sotto le palafitte i grilli smettono di cantare un poco prima che
      la fiamma si pieghi.

      «Eh, vuol dire che c'è qualcuno che non trova la strada di casa» dice quando le chiedi perché.

      {percezione Media} Quando l'ultima si spegne giù nella valle se ne accende una più piccola, sempre nello
      stesso punto fra i tronchi. Si spegne quando riaccendono quella del pontile, e a guardarla bene non
      tremola come fa una fiamma.

      {origine figlio-del-circolo} Al Circolo il bosco di notte lo ascolti al buio, e dal fruscio capisci dove
      passa l'aria. Qui lo illuminano come una strada.
    opzioni:
      - testo: "Vegliare l'ultima lanterna e vedere chi la spegne"
        descrizione: "Seduti accanto all'ultima lanterna fino alla seconda ora, con gli occhi aperti."
        prova: { attributo: mentale, abilita: [resilienza, percezione], difficolta: Media }
        successo:
          titolo: La seconda ora
          testo: |
            Alla seconda ora sale dalla valle un'aria fredda che odora di pietra bagnata. Passa soltanto
            sull'ultima lanterna, e le altre lungo il pontile non tremano nemmeno mentre la fiamma si piega e
            si spegne. Laggiù fra le sequoie grandi si accende la luce piccola. La riaccendi, e la luce si
            spegne. Liduina alle tue spalle dice che laggiù c'era Pannion, e che lei ci è nata.
          pe: { resilienza: 3 }
          effetti: { fazione.pannion: 1, rep.pannion: 0.5 }
        fallimento:
          titolo: Il sonno sul pontile
          testo: |
            Ti addormenti con la schiena contro la trave, e ti sveglia Liduina con la lanterna già spenta. La
            giacca è umida sul fianco che dava sulla valle e asciutta sull'altro. Liduina ti indica la valle
            con il bastone e ti dice che laggiù c'era Pannion e che lei ci è nata. Laggiù, dice, c'è qualcuno
            che risponde alle sue lanterne.
          effetti: { fazione.pannion: 1, tormento: 0.5 }
      - testo: "Scendere dal pontile verso la luce che risponde"
        descrizione: "Le palafitte scendono fino alla terra del bosco. Da lì, al buio, si può camminare verso la luce piccola."
        prova: { attributo: fisico, abilita: [atletica, furtivita], difficolta: Media }
        successo:
          titolo: Il palo della lanterna
          testo: |
            Scendi lungo una palafitta e cammini verso la luce piccola finché il pendio si fa ripido. È il
            vetro di una lanterna vecchia, ancora appesa a un palo storto e piegato dalle radici, che prende
            la luna quando la nuvola si sposta. Sul legno del palo è inciso un segno che la pioggia ha quasi
            spianato. Sotto il palo il bosco scende verso tetti senza fumo. Liduina ti aspetta in cima e ti
            dice che quella è la vecchia Pannion.
          pe: { atletica: 3 }
          effetti: { fazione.pannion: 1, rep.pannion: 0.5 }
        fallimento:
          titolo: Il pendio
          testo: |
            Scendi lungo una palafitta e al buio il pendio ti prende le gambe. Rotoli per un tratto fra gli
            aghi delle sequoie e ti fermi contro un tronco, con la luce piccola sempre lontana. Gli aghi sono
            alti una spanna, e sotto la terra è nera e fredda. Liduina ti aiuta a risalire e ti dice che
            laggiù c'era Pannion, e che di notte non ci si va.
          effetti: { fazione.pannion: 1, ferite: 0.5, tormento: 0.5 }
      - testo: "Farti raccontare da Liduina perché si accendono"
        descrizione: "Liduina accende le lanterne da più anni di chiunque."
        prova: { attributo: sociale, abilita: [empatia, galateo], difficolta: Media }
        successo:
          titolo: Il bosco che si perde
          testo: |
            Liduina ti racconta che sua madre diceva sempre che un bosco senza luci si perde, e che le
            lanterne riportano a casa chi ci abita. Poi ti indica la valle con il bastone, che in cima è
            lucido dove lo tiene la sua mano. Laggiù c'era Pannion, e lei ci è nata. Di quando se ne sono
            andati, dice, si parla un'altra notte.
          pe: { empatia: 3 }
          effetti: { fazione.pannion: 1, rep.pannion: 0.5 }
        fallimento:
          titolo: Un'altra notte
          testo: |
            Le fai troppe domande insieme, e Liduina smette di rispondere. Indica la valle con il bastone e ti
            dice soltanto che laggiù c'era Pannion e che si parla un'altra notte. Poi ti volta le spalle e
            torna a contare le lanterne a voce più alta, una ogni tre passi fino in fondo al pontile.
          effetti: { fazione.pannion: 1, scandalo: 0.5 }
      - testo: "Riaccendere l'ultima lanterna ogni volta che si spegne"
        descrizione: "Si sta lì tutta la notte con il tizzone in mano."
        costo: 2
        esito:
          titolo: Sette volte
          testo: |
            La lanterna si spegne sette volte, e sette volte la riaccendi, e ogni volta giù nella valle si
            spegne la luce piccola. Ogni volta l'aria che sale dalla valle ti passa sulle mani e le lascia
            fredde e umide. All'alba Liduina ti porta una tazza di latte caldo e ti dice che laggiù c'era
            Pannion, e che lei ci è nata.
          effetti: { fazione.pannion: 1, rep.pannion: 0.5, tormento: 0.5 }
      - testo: "Ascoltare il bosco invece di guardarlo"
        descrizione: "Al Circolo il bosco si ascolta al buio. Con la lanterna coperta si sente da dove arriva l'aria che la spegne."
        quando: [origine.figlio-del-circolo >= 1]
        esito:
          titolo: La strada dell'aria
          testo: |
            Copri la lanterna con la giacca e ascolti. L'aria che sale dalla valle passa fra le sequoie per
            una strada sola, sempre la stessa, come l'acqua in un fosso. Gli aghi frusciano soltanto lungo
            quella strada, e intorno il bosco è fermo. Arriva da dove si accende la luce piccola. Liduina ti
            dice che laggiù c'era Pannion, e che lei ci è nata.
          pe: { natura: 3 }
          effetti: { fazione.pannion: 1, rep.pannion: 0.5 }

  # ------------------------------------------------------------ 5 → 6 · il conto del legname (grado 2)
  - id: pannion-il-conto-del-legname
    presso: municipio
    immagine: personaggi/julia-castaldi
    titolo: Il conto del legname
    sommario: "Il Ponte delle Mille Corde ha bisogno di assi nuove prima dell'inverno, e la Rappresentante chiede a Pannion il doppio del legname."
    luogo: Municipio, l'ufficio della Rappresentante
    area: quartieri-alti
    requisiti: [fazione.pannion == 5]
    testo: |
      Darrin viene in città soltanto quando lo chiama Julia Castaldi, e stavolta l'ha chiamato. Siede
      nell'anticamera sotto il ritratto della Rappresentante, con le mani sulle ginocchia e la giacca della
      domenica stretta sulle spalle. Nelle pieghe delle nocche ha ancora il nero del carbone, che il sapone
      della mattina non ha tolto.

      Un uomo con una cartella di cuoio gli si siede accanto e gli parla di prezzi. Darrin guarda davanti a sé
      finché quello si alza.

      {politica-ed-economia Media} Sulla fibbia della cartella è impresso il nodo delle segherie del canale.
      Le segherie guadagnano di più se Pannion rompe con i Castaldi.

      Julia vi riceve in piedi con le pratiche già lette, squadrate in una pila sul tavolo e con un segno di
      matita sul margine di ogni foglio. Il Ponte delle Mille Corde ha bisogno di assi nuove prima
      dell'inverno, e la città chiede a Pannion il doppio del legname. Darrin risponde che le sequoie vicine
      sono tagliate e quelle grandi stanno nella valle intorno alla vecchia Pannion, dove non si taglia.

      {origine rampollo-dei-quartieri-alti} Il nonno di Julia diceva che la casata Castaldi firma promesse e
      le mantiene. Alle cene lo ripetono prima di chiedere qualcosa.
    opzioni:
      - testo: "Proporre la consegna in due stagioni"
        descrizione: "Il doppio, ma in due volte, con i carri pagati dalla città."
        prova: { attributo: sociale, abilita: [persuasione, politica-ed-economia], difficolta: Media }
        successo:
          titolo: Due stagioni
          testo: |
            Fai i conti a voce alta carro per carro, e Julia li segue con il dito sulla pratica. Accetta le
            due stagioni e i carri pagati dalla città, e firma con una penna che gratta sulla carta. Darrin le
            stringe la mano una volta sola e forte. Sulle scale ti mette in mano una borsa e dice «Di
            squadra», e il resto lo capisci da sol{o|a}.
          pe: { persuasione: 3 }
          almeno: { rep.pannion: 4 }
          effetti: { fazione.pannion: 1, monete: 50 }
        fallimento:
          titolo: I conti storti
          testo: |
            Sbagli il conto dei carri, e Julia te lo corregge con la matita senza alzare gli occhi, con un
            segno piccolo e dritto accanto al tuo numero. Accetta lo stesso le due stagioni, perché Darrin ha
            detto di sì con la testa. Sulle scale lui ti mette in mano una borsa e dice «Di squadra». Ti tiene
            la mano un momento di più.
          almeno: { rep.pannion: 4 }
          effetti: { fazione.pannion: 1, monete: 50, scandalo: 0.5 }
      - testo: "Raccontare dove finiva il legname rubato"
        descrizione: "I tronchi con la croce di Darrin finivano alle segherie del canale. La Rappresentante paga il legname, e quel legname l'ha pagato due volte."
        prova: { attributo: mentale, abilita: [politica-ed-economia, accademiche], difficolta: Media }
        successo:
          titolo: Pagato due volte
          testo: |
            Le racconti delle croci sulle ceppaie e del carro coperto, e Julia si fa portare i registri del
            canale. Arrivano rilegati in tela grigia, e lei li sfoglia in piedi con un dito sulle colonne.
            Quando trova il legname senza croce venduto alla città diventa bianca. Accetta le condizioni di
            Darrin senza discutere. Sulle scale Darrin ti mette in mano una borsa e dice «Di squadra».
          pe: { politica-ed-economia: 3 }
          almeno: { rep.pannion: 4 }
          effetti: { fazione.pannion: 1, monete: 50, rep.castaldi: 0.5 }
        fallimento:
          titolo: Le prove
          testo: |
            Julia ti ascolta e ti chiede le prove, e tu hai soltanto il racconto di una notte nel bosco.
            Accetta lo stesso le condizioni di Darrin, e da come lo guarda mentre firma si vede che le accetta
            per lui. Sulle scale Darrin ti mette in mano una borsa e dice «Di squadra».
          almeno: { rep.pannion: 4 }
          effetti: { fazione.pannion: 1, monete: 50, scandalo: 0.5 }
      - testo: "Smascherare l'uomo della cartella"
        descrizione: "L'uomo dell'anticamera compra per Ottone Malgrani. Detto davanti alla Rappresentante, il suo prezzo diventa un'offesa."
        quando: [pista.pelle < 7]
        prova: { attributo: sociale, abilita: [intimidire, persuasione], difficolta: Media }
        successo:
          titolo: Prezzo nostro
          testo: |
            Esci in anticamera, prendi l'uomo per la manica e lo riporti dentro con la sua cartella. Nella
            cartella c'è un foglio di carta pesante con l'alloro dei Malgrani impresso a secco, e sotto un
            prezzo per tutto il legname di Pannion. Julia lo legge, lo piega in quattro e se lo tiene. Accetta
            le condizioni di Darrin, e sulle scale Darrin ti mette in mano una borsa e dice «Di squadra».
          pe: { intimidire: 3 }
          almeno: { rep.pannion: 4 }
          effetti: { fazione.pannion: 1, monete: 50, rep.malgrani: -0.5 }
        fallimento:
          titolo: La manica
          testo: |
            Lo prendi per la manica, e l'uomo grida abbastanza perché due uscieri ti mettano le mani addosso e
            ti stringano i polsi dietro la schiena. Julia li manda via con un gesto stanco e accetta le
            condizioni di Darrin. Sulle scale Darrin ti mette in mano una borsa e dice «Di squadra».
          almeno: { rep.pannion: 4 }
          effetti: { fazione.pannion: 1, monete: 50, scandalo: 1 }
      - testo: "Proporre che le cooperative segnino il legname con Pannion"
        descrizione: "Le segherie del canale adesso sono delle cooperative. Possono comprare direttamente da Pannion, con la croce di Darrin e la bolla della città."
        quando: [pista.pelle >= 7]
        prova: { attributo: mentale, abilita: [politica-ed-economia, accademiche], difficolta: Media }
        successo:
          titolo: La croce e la bolla
          testo: |
            Spieghi l'idea a Julia, e lei la prende al volo. Le cooperative hanno bisogno di legname quanto la
            città, e una croce di Darrin con la bolla della città non la ruba nessuno. Prende un foglio pulito
            e scrive l'accordo di suo pugno, poi firma. Sulle scale Darrin ti mette in mano una borsa e dice
            «Di squadra».
          pe: { politica-ed-economia: 3 }
          almeno: { rep.pannion: 4 }
          effetti: { fazione.pannion: 1, monete: 50, rep.castaldi: 0.5 }
        fallimento:
          titolo: Le cooperative
          testo: |
            Julia ti fa notare che le cooperative non hanno ancora un registro, e che senza registro non si
            firma niente. Lo dice con la matita ferma sul margine della pratica. Accetta lo stesso le
            condizioni di Darrin. Sulle scale lui ti mette in mano una borsa e dice «Di squadra».
          almeno: { rep.pannion: 4 }
          effetti: { fazione.pannion: 1, monete: 50, scandalo: 0.5 }
      - testo: "Lasciar parlare Darrin"
        descrizione: "Darrin parla poco, e Julia lo ascolta quando parla."
        esito:
          titolo: Una frase
          testo: |
            Darrin parla con le mani larghe aperte sul tavolo, una accanto all'altra. Dice una frase sola, che
            il doppio lo darà Pannion e che lo pagherà Pannion, e che nella valle non si taglia. Julia lo
            guarda a lungo e firma. Sulle scale Darrin ti mette in mano una borsa e dice «Di squadra», e poi
            aggiunge che la prossima volta parli tu.
          almeno: { rep.pannion: 4 }
          effetti: { fazione.pannion: 1, monete: 50 }
      - testo: "Ricordare a Julia il detto di suo nonno"
        descrizione: "Lo conosci dalle cene dei Quartieri Alti."
        quando: [origine.rampollo-dei-quartieri-alti >= 1]
        esito:
          titolo: Il detto del nonno
          testo: |
            Le ricordi il detto del nonno con il tono delle cene, e Julia sorride per la prima volta. Ti
            risponde con la stessa cadenza che i Castaldi mantengono volentieri anche le promesse buone degli
            altri, e accetta le condizioni di Darrin. Sulle scale lui ti mette in mano una borsa e dice «Di
            squadra».
          pe: { galateo: 3 }
          almeno: { rep.pannion: 4 }
          effetti: { fazione.pannion: 1, monete: 50, rep.castaldi: 0.5 }
