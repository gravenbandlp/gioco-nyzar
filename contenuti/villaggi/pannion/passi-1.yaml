# La quest di Pannion, Atto I e II (fazione.pannion 0 → 6).
# - 0 → 1 `pannion-il-fumo-di-pannion` (Pannion, pista.arena >= 5): l'arrivo, Darrin Huld che parla al Vecchio, la
#   carbonaia spaccata da una radice del Vecchio salita fin lì.
# - 1 → 2 `pannion-i-tronchi-segnati` (Pannion, di notte): i tronchi segnati per i ponti tagliati dalla banda di
#   Gaspare Tenca. Varianti: il Figlio della Città Bassa parla il gergo delle bande; scuri.nihali e scuri.finale.
# - 2 → 3 `pannion-la-consegna` (Ponte delle Mille Corde, grado 1): il carico corto davanti ad Aldous Castaldi e alla
#   penale. Per strada i carrettieri parlano del vetro che ride e dell'arco sul crinale: traccia.sornione e
#   traccia.mara.
# - 3 → 4 `pannion-la-linfa-rossa` (Pannion): Frate Koln, la linfa del Vecchio e la Cattedrale che ne vuole di più.
#   Le radici scendono verso la vecchia Pannion. Opzione d'origine dell'Accolito del Velo.
# - 4 → 5 `pannion-le-lanterne-dei-pontili` (Pannion): Liduina Brace e l'ultima lanterna, che si spegne ogni notte
#   alla stessa ora. Opzione d'origine del Figlio del Circolo.
# - 5 → 6 `pannion-il-conto-del-legname` (Municipio, grado 2): Julia Castaldi chiede il doppio del legname per il
#   ponte in dissesto. Varianti con pista.pelle < 7 (l'uomo dei Malgrani) e >= 7 (le cooperative della segheria).
# Nomi nuovi in questo file: Gaspare Tenca (capo della banda di Pannion), Liduina Brace (la donna delle lanterne).
storylet:
  # ------------------------------------------------------------ 0 → 1 · il fumo di Pannion
  - id: pannion-il-fumo-di-pannion
    presso: pannion
    immagine: ambientazione/foresta-strisciante
    titolo: Il fumo di Pannion
    sommario: "Darrin Huld vuole qualcuno di fuori che guardi le radici del Vecchio senza pregarci sopra."
    luogo: Pannion, la piazza del Vecchio
    area: superficie-fratturata
    requisiti: [fazione.pannion == 0, pista.arena >= 5]
    testo: |
      Il fumo di Pannion lo vedi dalla strada mezza giornata prima delle case, una riga
      grigia sopra le sequoie. In mezzo alla piazza sta il Vecchio Albero, un tronco nero
      più alto dei tetti e senza foglie. Davanti al Vecchio un uomo con le mani larghe e
      un orecchio mezzo bruciato gli parla a voce bassa, e Ansgar, il ragazzo con le mani
      nere che ti ha fatto strada dal bivio, ti dice che è Darrin Huld e che non lo si
      interrompe.

      {empatia Media} Gli parla come a un vecchio di casa, e lascia le pause per le
      risposte.

      Quando ha finito Darrin ti guarda prima le scarpe, poi la faccia. «Le radici» dice,
      e ti porta sul fianco dell'altura, dove una radice nera è salita da sotto una
      carbonaia e l'ha spaccata. Dalla crepa esce una lingua di fumo bianco, e Darrin ti
      mette in mano una pala.

      {natura Facile} Fumo bianco vuol dire aria, e una carbonaia che prende aria brucia
      tutta, fino ai pontili.

      {origine figlio-del-circolo} Al Circolo ti hanno insegnato che un albero cresce
      lontano dal fumo, e questo ci è cresciuto dentro.
    opzioni:
      - testo: "Chiudere la crepa con le zolle"
        descrizione: "Terra rossa e zolle buttate sulla crepa finché il fumo torna grigio, con il caldo che sale."
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Media }
        successo:
          titolo: Il fumo grigio
          testo: |
            Butti terra sulla crepa a palate e Darrin batte le zolle con il dorso
            della pala finché il fumo torna grigio. La sera, al fuoco dei
            carbonai, ti indica un posto sulla panca e dice soltanto «Resti», che
            Ansgar ti spiega essere un invito.
          pe: { atletica: 3 }
          effetti: { fazione.pannion: 1, rep.pannion: 0.5 }
        fallimento:
          titolo: La lingua di fuoco
          testo: |
            Una zolla ti scivola e dalla crepa esce una lingua di fuoco che ti lecca il braccio, finché Darrin ti scosta
            con una spallata e la chiude da solo. La sera ti indica lo stesso un posto sulla panca e dice soltanto «Resti».
          effetti: { fazione.pannion: 1, ferite: 0.5, scandalo: 0.5 }
      - testo: "Leggere il fumo e chiudere gli sfiatatoi giusti"
        descrizione: "Una carbonaia ha una dozzina di sfiatatoi. Chiudendo quelli giusti l'aria smette di entrare dalla crepa."
        prova: { attributo: mentale, abilita: [natura, percezione], difficolta: Media }
        successo:
          titolo: Gli sfiatatoi
          testo: |
            Chiudi con le zolle gli sfiatatoi da cui il fumo esce più chiaro, e la
            crepa si spegne da sola mentre Darrin ti guarda fare. La sera, al
            fuoco dei carbonai, ti indica un posto sulla panca e dice soltanto
            «Resti».
          pe: { natura: 3 }
          effetti: { fazione.pannion: 1, rep.pannion: 0.5 }
        fallimento:
          titolo: Il buco sbagliato
          testo: |
            Chiudi gli sfiatatoi sbagliati e la carbonaia tira dalla crepa come un
            camino, finché Darrin ne sistema cinque a calci senza una parola. La
            sera ti indica lo stesso un posto sulla panca, e un carbonaio ride
            dietro la scodella.
          effetti: { fazione.pannion: 1, scandalo: 0.5 }
      - testo: "Mettere in fila i carbonai con i secchi di terra"
        descrizione: "Una fila che passa i secchi lavora più in fretta di dieci carbonai che si intralciano."
        prova: { attributo: sociale, abilita: [persuasione, intimidire], difficolta: Media }
        successo:
          titolo: La fila
          testo: |
            I carbonai si passano i secchi in fila al tuo comando, e la crepa è
            chiusa prima che Darrin finisca di tirarsi su le maniche. La sera ti
            indica un posto sulla panca e dice soltanto «Resti».
          pe: { persuasione: 3 }
          effetti: { fazione.pannion: 1, rep.pannion: 0.5 }
        fallimento:
          titolo: Il forestiero che grida
          testo: |
            I carbonai ti guardano come un cane che abbaia alla luna, finché Darrin fa un gesto e la fila si forma da
            sola. La sera ti indica lo stesso un posto sulla panca e dice soltanto «Resti».
          effetti: { fazione.pannion: 1, scandalo: 0.5 }
      - testo: "Portare la terra a Darrin e lasciar fare a lui"
        descrizione: "Darrin sa che cosa fare, e lo fa da trent'anni. Tu porti la terra finché ce n'è bisogno."
        costo: 2
        esito:
          titolo: La terra rossa
          testo: |
            Porti terra fino a buio, e Darrin la sistema sulla crepa con le mani
            come una coperta su un bambino. Al fuoco ti indica un posto sulla
            panca e dice soltanto «Resti».
          pe: { resistenza: 2 }
          effetti: { fazione.pannion: 1, rep.pannion: 0.5 }

  # ------------------------------------------------------------ 1 → 2 · i tronchi segnati
  - id: pannion-i-tronchi-segnati
    presso: pannion
    immagine: ambientazione/segheria-di-qir-azel
    titolo: I tronchi segnati
    sommario: "Le sequoie segnate per i ponti spariscono di notte, e restano ceppaie fresche e tracce di slitta."
    luogo: Pannion, i tagli del versante nord, di notte
    area: superficie-fratturata
    requisiti: [fazione.pannion == 1]
    testo: |
      Darrin segna con una croce di terra rossa le sequoie destinate ai ponti
      di Qir-Azel, e stamattina sul versante nord ci sono tre ceppaie fresche
      con la croce ancora sui trucioli. Una slitta ha trascinato i tronchi
      fino a un fiume di linfa, dove i segni finiscono sul vetro.

      Ansgar fa a voce bassa il nome di Gaspare Tenca, un boscaiolo come gli
      altri che di notte ha una banda e vende in città quello che il bosco
      non sa di aver perso. La sera Darrin ti aspetta in fondo all'ultimo
      pontile con una lanterna coperta.

      {conoscenze-della-strada Media} Senza croce un tronco dei Castaldi vale
      il doppio alle segherie del canale, dove nessuno chiede da dove viene.

      {origine figlio-della-citta-bassa} Sulla ceppaia c'è inciso un cerchio
      tagliato da una riga, il segno con cui in Città Bassa le bande dicono
      agli Scuri che il lavoro è loro.
    opzioni:
      - testo: "Fermare i tagliatori al lavoro"
        descrizione: "Due uomini con la scure e il fazzoletto sulla faccia, e un tronco già mezzo abbattuto."
        combattimento: pannion-tagliatori
        vittoria:
          titolo: La slitta abbandonata
          testo: |
            Il secondo tagliatore scappa nel buio lasciando la slitta carica e la
            scure piantata nel tronco, con il cerchio tagliato inciso sul manico.
            Darrin riporta su la slitta e ti dice che il carico per la città sarà
            corto lo stesso, ma meno.
          pe: { armi-da-mischia: 3 }
          effetti: { fazione.pannion: 1, rep.pannion: 0.5 }
        sconfitta:
          titolo: Il fazzoletto
          testo: |
            Un colpo di manico dietro il ginocchio ti manda con la faccia nella
            terra rossa, e i tagliatori spariscono con il tronco, lasciando un
            fazzoletto scuro che Darrin butta nel fuoco. Il carico per la città
            sarà corto.
          effetti: { fazione.pannion: 1, scandalo: 0.5 }
      - testo: "Seguire la slitta fino a chi compra"
        descrizione: "I tronchi rubati finiscono da qualche parte. Seguendoli al buio si vede dove, e chi paga."
        prova: { attributo: fisico, abilita: [furtivita, atletica], difficolta: Media }
        successo:
          titolo: Il carro coperto
          testo: |
            All'alba, al margine del bosco, un uomo con un panciotto di città paga
            Gaspare Tenca con una borsa che tintinna, e lo riconosci dalla barba
            rossa e dal ronco alla cintura. Darrin, quando glielo racconti,
            annuisce piano.
          pe: { furtivita: 3 }
          effetti: { fazione.pannion: 1, rep.pannion: 0.5, informazioni.voce: 1 }
        fallimento:
          titolo: Il ramo secco
          testo: |
            Un ramo secco ti si spezza sotto il piede e la slitta riparte più in
            fretta, dove non riesci a seguirla. Torni con le ginocchia gelate e un
            nome solo, quello di Tenca.
          effetti: { fazione.pannion: 1, sospetto: 0.5 }
      - testo: "Andare a parlare con Gaspare Tenca"
        descrizione: "Tenca di giorno taglia per Darrin come tutti, e gli si può dire che le croci si vedono."
        prova: { attributo: sociale, abilita: [intimidire, persuasione], difficolta: Media }
        successo:
          titolo: La barba rossa
          testo: |
            Tenca affila un ronco sulla soglia di casa e nega tutto, ma quando gli
            dici dove finiscono le tracce della slitta smette di affilare. Per
            questa luna, risponde, le croci di Darrin restano dove sono.
          pe: { intimidire: 3 }
          effetti: { fazione.pannion: 1, rep.pannion: 0.5 }
        fallimento:
          titolo: Il ronco
          testo: |
            Tenca ti ascolta affilando il ronco e ti dice che i forestieri a
            Pannion durano una stagione, fra le risate dei suoi. La sera Darrin sa
            già tutto.
          effetti: { fazione.pannion: 1, scandalo: 0.5 }
      - testo: "Fare la guardia ai tronchi segnati fino all'alba"
        descrizione: "Si passa la notte fra le sequoie segnate con la lanterna coperta."
        costo: 2
        esito:
          titolo: La notte lunga
          testo: |
            Passi la notte fra le sequoie segnate con le mani sotto le ascelle, e
            verso l'alba senti una slitta fermarsi lontano e tornare indietro.
            Nessun tronco manca, e Darrin ti porta una scodella di zuppa calda.
          effetti: { fazione.pannion: 1, rep.pannion: 0.5, tormento: 0.5 }
      - testo: "Fargli sapere che Nihali Cuzan sta con te"
        descrizione: "Le bande dei villaggi ascoltano Nihali da quando è tornato, e basta fargli arrivare il nome."
        quando: [scuri.nihali >= 1]
        esito:
          titolo: Il nome di Nihali
          testo: |
            Per mezzo di Ansgar mandi a Tenca un fante di coppe con l'angolo
            ingiallito, e la mattina dopo lui ti promette, con il cappello in
            mano, che per questa luna le croci di Darrin restano dove sono, e che
            saluti Nihali.
          effetti: { fazione.pannion: 1, rep.pannion: 0.5 }
      - testo: "Ricordargli chi tiene i conti a Qir-Azel"
        descrizione: "Il tavolo d'angolo degli Scuri adesso è tuo, e una banda che taglia senza dirtelo ti deve una spiegazione."
        quando: [scuri.finale == 1]
        esito:
          titolo: Il tavolo d'angolo
          testo: |
            Ti siedi sulla soglia di Tenca senza chiedere, e quando ti riconosce
            il ronco gli resta a mezz'aria. Per questa luna le croci di Darrin
            restano dove sono, e la tua parte arriverà in città.
          effetti: { fazione.pannion: 1, rep.pannion: 0.5, rep.scuri: 0.5 }
      - testo: "Parlare ai tagliatori come si parla nelle bande"
        descrizione: "Il cerchio tagliato da una riga lo conosci dai vicoli, e sai rispondere nella stessa lingua."
        quando: [origine.figlio-della-citta-bassa >= 1]
        esito:
          titolo: Il gergo dei vicoli
          testo: |
            Saluti i tagliatori con le parole che in Città Bassa si usano fra
            bande che non vogliono litigare, e loro ti portano da Tenca, che per
            questa luna lascia le croci di Darrin dove sono.
          pe: { conoscenze-della-strada: 3 }
          effetti: { fazione.pannion: 1, rep.pannion: 0.5 }

  # ------------------------------------------------------------ 2 → 3 · la consegna (grado 1)
  - id: pannion-la-consegna
    presso: ponte-delle-mille-corde
    immagine: ambientazione/ponti-sospesi
    titolo: La consegna
    sommario: "Il legname arriva al Ponte delle Mille Corde corto di qualche tronco, e Aldous Castaldi aspetta con il contratto."
    luogo: Ponte delle Mille Corde, il gabbiotto dei Custodi
    area: ponti-sospesi
    requisiti: [fazione.pannion == 2]
    testo: |
      Il convoglio del legname ci mette due giorni ad arrivare in città. Per
      strada i carrettieri di Pannion parlano dei loro posti neri come si
      parla del tempo. Uno dice del vetro piantato in un campo oltre il
      Gradone Rosso, che riflette un cielo di notte e sembra ridere, un altro
      di un arco sul crinale a est della Roccia di Wren, dove al tramonto si
      sente odore di pioggia salata.

      All'imbocco del Ponte delle Mille Corde i Custodi di Passaggio pesano i
      carri uno alla volta, e accanto al gabbiotto aspetta Aldous Castaldi in
      giacca grigia, con due scrivani alle spalle. Il contratto con Pannion
      l'ha firmato sua sorella Julia, e la penale per il carico corto sta in
      fondo alla seconda pagina.

      {politica-ed-economia Media} Una penale così la scrive chi sa che il
      carico arriverà corto prima o poi, e vuole il prezzo già fissato.

      {origine mercante-dei-ponti} La bilancia dei Custodi pende verso il
      gabbiotto di un'unghia, e chi lavora ai Ponti lo sa da anni.
    opzioni:
      - testo: "Chiedere ad Aldous di rinunciare alla penale"
        descrizione: "I tronchi li ha rubati una banda, e una casata che mantiene le promesse può capirlo."
        prova: { attributo: sociale, abilita: [persuasione, galateo], difficolta: Media }
        successo:
          titolo: Le mani giunte
          testo: |
            Racconti della slitta e delle croci, e Aldous fa cancellare la penale con una
            riga sola. Al primo fuoco del ritorno Darrin ti dà una lanterna da pontile di
            ferro nero, con i vetri velati di resina, e ti dice «Portalanterne».
          pe: { persuasione: 3 }
          almeno: { rep.pannion: 2 }
          effetti: { fazione.pannion: 1, monete: 30, oggetto.pannion-lanterna-da-pontile: 1, traccia.sornione: 1, traccia.mara: 1 }
        fallimento:
          titolo: Metà penale
          testo: |
            Aldous risponde a voce bassa che un contratto è un contratto e fa scrivere metà della
            penale, che Darrin paga senza contare. Al primo fuoco del ritorno ti dà lo stesso una
            lanterna da pontile e ti dice «Portalanterne».
          almeno: { rep.pannion: 2 }
          effetti: { fazione.pannion: 1, monete: 30, oggetto.pannion-lanterna-da-pontile: 1, traccia.sornione: 1, traccia.mara: 1, scandalo: 0.5 }
      - testo: "Ripesare il legname sulla bilancia dei Custodi"
        descrizione: "La bilancia dei Custodi è vecchia quanto il ponte, e un carico pesato due volte a volte cambia."
        prova: { attributo: mentale, abilita: [percezione, tecnologia], difficolta: Media }
        successo:
          titolo: La bilancia storta
          testo: |
            Con un tronco spostato di lato il peso cambia, perché il piatto pende
            verso il gabbiotto, e il carico risulta corto di un tronco solo. Al
            primo fuoco del ritorno Darrin ti dà una lanterna da pontile e ti dice
            «Portalanterne».
          pe: { percezione: 3 }
          almeno: { rep.pannion: 2 }
          effetti: { fazione.pannion: 1, monete: 30, oggetto.pannion-lanterna-da-pontile: 1, traccia.sornione: 1, traccia.mara: 1 }
        fallimento:
          titolo: I Custodi ridono
          testo: |
            Il Custode della bilancia ti chiede se vuoi pesare anche lui, e ridono
            tutti. Darrin paga la penale di tasca sua, e al primo fuoco del
            ritorno ti dà una lanterna da pontile e ti dice «Portalanterne».
          almeno: { rep.pannion: 2 }
          effetti: { fazione.pannion: 1, monete: 30, oggetto.pannion-lanterna-da-pontile: 1, traccia.sornione: 1, traccia.mara: 1, scandalo: 0.5 }
      - testo: "Pagare tu una parte della penale"
        descrizione: "Darrin pagherebbe tutto da solo. Una parte la puoi mettere tu, se ce l'hai."
        requisiti: [monete >= 20]
        esito:
          titolo: Due borse
          testo: |
            Posi la tua borsa sul banco accanto a quella di Darrin, e lui la
            guarda a lungo senza dire niente. Al primo fuoco del ritorno ti
            restituisce qualche moneta più di quanto hai messo, con una lanterna
            da pontile, e ti dice «Portalanterne».
          almeno: { rep.pannion: 2 }
          effetti: { fazione.pannion: 1, monete: 15, oggetto.pannion-lanterna-da-pontile: 1, traccia.sornione: 1, traccia.mara: 1 }
      - testo: "Lasciare che paghi Darrin"
        descrizione: "È il suo contratto e la sua parola. Darrin paga, e la parola resta intera."
        esito:
          titolo: La borsa al collo
          testo: |
            Darrin conta la penale sul banco moneta dopo moneta, senza guardare Aldous. Al primo fuoco del ritorno
            ti dà una lanterna da pontile di ferro nero e ti dice «Portalanterne».
          almeno: { rep.pannion: 2 }
          effetti: { fazione.pannion: 1, monete: 30, oggetto.pannion-lanterna-da-pontile: 1, traccia.sornione: 1, traccia.mara: 1 }
      - testo: "Far ripesare il carico con la misura della Gilda"
        descrizione: "La licenza della Gilda ti dà diritto alla misura ufficiale, che i Custodi odiano e devono dare."
        quando: [origine.mercante-dei-ponti >= 1]
        esito:
          titolo: La misura ufficiale
          testo: |
            Posi la licenza sul banco e il Custode, con i pesi di bronzo della
            Gilda, ripesa il primo carro, e il carico risulta corto di un tronco
            solo. Al primo fuoco del ritorno Darrin ti dà una lanterna da pontile
            e ti dice «Portalanterne».
          pe: { politica-ed-economia: 3 }
          almeno: { rep.pannion: 2 }
          effetti: { fazione.pannion: 1, monete: 30, oggetto.pannion-lanterna-da-pontile: 1, traccia.sornione: 1, traccia.mara: 1 }

  # ------------------------------------------------------------ 3 → 4 · la linfa rossa
  - id: pannion-la-linfa-rossa
    presso: pannion
    immagine: fazioni/confraternita-del-velo
    titolo: La linfa rossa
    sommario: "La Cattedrale vuole il doppio dell'unguento rosso, e Frate Koln ti chiede aiuto con la linfa del Vecchio."
    luogo: Pannion, ai piedi del Vecchio, di notte
    area: superficie-fratturata
    requisiti: [fazione.pannion == 3]
    testo: |
      Frate Koln ti aspetta sulla porta della cappella con una lettera di Padre Vantes, che per l'infermeria della
      Cattedrale chiede il doppio dei vasetti di unguento rosso. Koln la legge due volte, e ride male.

      La linfa del Vecchio scende di notte da certe crepe alla base del tronco, e Darrin lascia prendere soltanto quella
      che il Vecchio dà da solo, goccia per goccia. A mezzanotte Koln ti mette in mano due scodelle di legno e si
      inginocchia fra le radici.

      {medicina Media} La linfa odora di ferro e di bosco bagnato, e le bruciature dei carbonai la vogliono.

      {magia Difficile} Sotto le dita c'è un filo di Mana, sottile come un capello, che scende lungo le radici invece di
      salire.

      {origine accolito-del-velo} Tieni le scodelle come le ampolle in Cattedrale, con il pollice fuori dal bordo, e
      Koln lo riconosce con un sorriso.
    opzioni:
      - testo: "Raccogliere la linfa senza ferire il Vecchio"
        descrizione: "Si aspetta la goccia e si cambia crepa quando rallenta."
        prova: { attributo: mentale, abilita: [natura, medicina], difficolta: Media }
        successo:
          titolo: Le crepe giuste
          testo: |
            All'alba le scodelle sono piene, e le crepe più generose stanno dalla
            parte della valle, dove una radice grossa come una gamba scende sotto
            i pontili. Koln dice «la vecchia Pannion» prima di decidere di non
            dirlo.
          pe: { natura: 3 }
          effetti: { fazione.pannion: 1, rep.pannion: 0.5, unguento: 1 }
        fallimento:
          titolo: La scodella rovesciata
          testo: |
            Cambi crepa troppo presto e poi troppo tardi, e rovesci una scodella
            sull'erba. Koln la raccoglie con le dita e ti dice che le crepe
            migliori stanno dalla parte della valle, dove la radice grossa scende
            verso la vecchia Pannion, poi si morde il labbro.
          effetti: { fazione.pannion: 1, tormento: 0.5 }
      - testo: "Convincere Koln a chiedere meno alla Cattedrale"
        descrizione: "La Cattedrale chiede il doppio perché non sa quanto costa, e una lettera onesta potrebbe bastare."
        prova: { attributo: sociale, abilita: [persuasione, empatia], difficolta: Media }
        successo:
          titolo: La lettera onesta
          testo: |
            Lo aiuti a scrivere la risposta, una riga per ogni goccia e una per Darrin, e
            Koln la firma ridendo bene. Poi ti dice che la linfa migliore scende dalla
            radice grossa sotto i pontili, verso la vecchia Pannion, e cambia discorso.
          pe: { persuasione: 3 }
          effetti: { fazione.pannion: 1, rep.pannion: 0.5 }
        fallimento:
          titolo: Padre Vantes
          testo: |
            Koln ti ricorda che a Padre Vantes non si scrive di no, e raccogliete
            fino all'alba. La radice che dà di più scende sotto i pontili, verso
            la vecchia Pannion, e dopo averla nominata Koln tace per un'ora.
          effetti: { fazione.pannion: 1, scandalo: 0.5 }
      - testo: "Seguire la radice da cui scende la linfa"
        descrizione: "La linfa più abbondante viene da una radice che corre sotto i pontili, e ci si striscia sotto."
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Media }
        successo:
          titolo: Sotto i pontili
          testo: |
            Strisci sotto le palafitte con la lanterna fra i denti, seguendo la
            radice nera fino al bordo dell'altura, dove si tuffa verso la valle
            dritta come una corda. «La vecchia Pannion» dice Koln quando glielo
            racconti.
          pe: { acrobazia: 3 }
          effetti: { fazione.pannion: 1, rep.pannion: 0.5 }
        fallimento:
          titolo: La palafitta
          testo: |
            La lanterna ti scivola dai denti e rotola giù per il pendio, e tu
            dietro finché una palafitta ti ferma. La radice va verso la valle, e
            Koln dice che laggiù c'è la vecchia Pannion.
          effetti: { fazione.pannion: 1, ferite: 0.5, tormento: 0.5 }
      - testo: "Aspettare che il Vecchio dia quello che vuole"
        descrizione: "Una scodella sotto ogni crepa, e si aspetta per tutta la notte."
        costo: 2
        esito:
          titolo: Goccia per goccia
          testo: |
            Koln si addormenta due volte e due volte si sveglia ridendo, e
            all'alba le scodelle più piene stanno sotto la radice grossa che
            scende alla vecchia Pannion.
          effetti: { fazione.pannion: 1, rep.pannion: 0.5 }
      - testo: "Raccogliere con la preghiera della goccia"
        descrizione: "In Cattedrale le ampolle si riempiono con la preghiera della goccia, e Koln la conosce."
        quando: [origine.accolito-del-velo >= 1]
        esito:
          titolo: La preghiera della goccia
          testo: |
            Cominci la preghiera a mezza voce, una parola per ogni goccia, e dopo
            un poco Koln la dice con te. All'alba le scodelle sono piene, e lui ti
            indica la radice grossa che scende verso la valle, dove c'è la vecchia
            Pannion.
          pe: { medicina: 3 }
          effetti: { fazione.pannion: 1, rep.pannion: 0.5, unguento: 1 }

  # ------------------------------------------------------------ 4 → 5 · le lanterne dei pontili
  - id: pannion-le-lanterne-dei-pontili
    presso: pannion
    immagine: icone/old-lantern
    titolo: Le lanterne dei pontili
    sommario: "Da una settimana l'ultima lanterna del pontile più lungo si spegne ogni notte alla stessa ora."
    luogo: Pannion, il pontile più lungo, di notte
    area: superficie-fratturata
    requisiti: [fazione.pannion == 4]
    testo: |
      Liduina Brace accende le lanterne del pontile più lungo contandole a
      mezza voce, una ogni tre passi, fino all'ultima, che sta sopra il bosco
      come una stella bassa. Da una settimana l'ultima si spegne ogni notte
      alla seconda ora, senza vento.

      «Vuol dire che qualcuno non trova la strada» ti dice, quando le chiedi
      perché, e sorride della tua faccia, perché i forestieri sorridono delle
      lanterne e tu stavolta sei rimasto serio.

      {percezione Media} Quando l'ultima lanterna si spegne, giù nella valle
      se ne accende un'altra più piccola, molto lontana, che si spegne quando
      riaccendono quella del pontile.

      {origine figlio-del-circolo} Al Circolo il bosco di notte lo ascolti
      senza luci, e qui lo illuminano come una strada.
    opzioni:
      - testo: "Vegliare l'ultima lanterna e vedere chi la spegne"
        descrizione: "Seduti accanto all'ultima lanterna fino alla seconda ora, con gli occhi aperti."
        prova: { attributo: mentale, abilita: [resilienza, percezione], difficolta: Media }
        successo:
          titolo: La seconda ora
          testo: |
            Alla seconda ora un'aria fredda che sale dalla valle spegne la fiamma,
            e laggiù, fra le sequoie grandi, si accende la luce piccola. Liduina
            ti dice che laggiù c'era Pannion, e che lei ci è nata.
          pe: { resilienza: 3 }
          effetti: { fazione.pannion: 1, rep.pannion: 0.5 }
        fallimento:
          titolo: Il sonno sul pontile
          testo: |
            Ti addormenti contro la trave e ti sveglia Liduina, con la lanterna già spenta. Laggiù nella valle c'era
            Pannion, ti dice indicandola con il bastone, e qualcuno risponde alle sue lanterne.
          effetti: { fazione.pannion: 1, tormento: 0.5 }
      - testo: "Scendere dal pontile verso la luce che risponde"
        descrizione: "Le palafitte scendono fino alla terra del bosco, e da lì si può camminare verso la luce."
        prova: { attributo: fisico, abilita: [atletica, furtivita], difficolta: Media }
        successo:
          titolo: Il palo della lanterna
          testo: |
            Scendi lungo una palafitta e cammini verso la luce finché vedi il
            vetro di una lanterna vecchia appesa a un palo storto, che prende la
            luna, sopra tetti senza fumo. Liduina, in cima, ti dice che quella è
            la vecchia Pannion.
          pe: { atletica: 3 }
          effetti: { fazione.pannion: 1, rep.pannion: 0.5 }
        fallimento:
          titolo: Il pendio
          testo: |
            Al buio il pendio ti prende le gambe e rotoli fra gli aghi fino a un
            tronco, con la luce sempre lontana. Liduina ti aiuta a risalire e ti
            dice che laggiù c'era Pannion, e che di notte non ci si va.
          effetti: { fazione.pannion: 1, ferite: 0.5, tormento: 0.5 }
      - testo: "Farti raccontare da Liduina perché si accendono"
        descrizione: "Liduina accende le lanterne da più anni di chiunque, e sa le cose che gli altri hanno dimenticato."
        prova: { attributo: sociale, abilita: [empatia, galateo], difficolta: Media }
        successo:
          titolo: Il bosco che si perde
          testo: |
            Liduina ti racconta che le lanterne riportano a casa il bosco e chi ci
            abita, poi indica con il bastone la valle, perché laggiù c'era Pannion
            e lei ci è nata. Di quando se ne sono andati, dice, si parla un'altra
            notte.
          pe: { empatia: 3 }
          effetti: { fazione.pannion: 1, rep.pannion: 0.5 }
        fallimento:
          titolo: Un'altra notte
          testo: |
            Le fai troppe domande e Liduina smette di rispondere, se non per dirti
            che laggiù c'era Pannion, e torna a contare le lanterne a voce più
            alta.
          effetti: { fazione.pannion: 1, scandalo: 0.5 }
      - testo: "Riaccendere l'ultima lanterna ogni volta che si spegne"
        descrizione: "Tutta la notte con il tizzone in mano, a riaccendere l'ultima lanterna ogni volta che si spegne."
        costo: 2
        esito:
          titolo: Sette volte
          testo: |
            La riaccendi sette volte, e ogni volta giù nella valle si spegne la
            luce piccola. All'alba Liduina ti porta una tazza di latte caldo e ti
            dice che laggiù c'era Pannion, e che lei ci è nata.
          effetti: { fazione.pannion: 1, rep.pannion: 0.5, tormento: 0.5 }
      - testo: "Ascoltare il bosco invece di guardarlo"
        descrizione: "Con la lanterna coperta si sente da dove arriva l'aria che la spegne."
        quando: [origine.figlio-del-circolo >= 1]
        esito:
          titolo: La strada dell'aria
          testo: |
            Copri la lanterna con la giacca e ascolti l'aria che sale dalla valle
            per una strada sola, come l'acqua in un fosso, da dove si accende la
            luce piccola. Liduina ti dice che laggiù c'era Pannion, e che lei ci è
            nata.
          pe: { natura: 3 }
          effetti: { fazione.pannion: 1, rep.pannion: 0.5 }

  # ------------------------------------------------------------ 5 → 6 · il conto del legname (grado 2)
  - id: pannion-il-conto-del-legname
    presso: municipio
    immagine: personaggi/julia-castaldi
    titolo: Il conto del legname
    sommario: "La Rappresentante chiede a Pannion il doppio del legname per il Ponte delle Mille Corde, e Darrin scende in città."
    luogo: Municipio, l'ufficio della Rappresentante
    area: quartieri-alti
    requisiti: [fazione.pannion == 5]
    testo: |
      Darrin in città ci viene soltanto quando lo chiama Julia Castaldi.
      Sulla panca dell'anticamera sta seduto con le mani sulle ginocchia e la
      giacca della domenica che gli tira sulle spalle, e a te ha chiesto di
      venire con una parola sola, «Parli».

      Un uomo con una cartella di cuoio gli si siede accanto e gli parla di
      prezzi a voce bassa, e Darrin guarda davanti a sé finché quello non si
      alza.

      {politica-ed-economia Media} La cartella ha il nodo delle segherie del
      canale, che guadagnano di più se Pannion rompe con i Castaldi.

      Julia vi riceve in piedi, con le pratiche già lette. Il Ponte delle
      Mille Corde ha bisogno di assi nuove prima dell'inverno, e la città
      chiede a Pannion il doppio del legname. Darrin risponde che le sequoie
      vicine sono tagliate, e quelle grandi stanno nella valle, intorno alla
      vecchia Pannion, dove a Pannion non si taglia.

      {origine rampollo-dei-quartieri-alti} In casa Castaldi si ripete un
      detto del nonno di Julia, che la casata firma promesse e le mantiene,
      di solito prima di chiedere qualcosa.
    opzioni:
      - testo: "Proporre la consegna in due stagioni"
        descrizione: "Il doppio in due stagioni, con i carri pagati dalla città, e Pannion taglia dove taglia sempre."
        prova: { attributo: sociale, abilita: [persuasione, politica-ed-economia], difficolta: Media }
        successo:
          titolo: Due stagioni
          testo: |
            Fai i conti carro per carro a voce alta, e Julia li segue con il dito
            e firma le due stagioni con i carri pagati dalla città. Darrin le
            stringe forte la mano, e sulle scale ti dà una borsa e dice «Di
            squadra».
          pe: { persuasione: 3 }
          almeno: { rep.pannion: 4 }
          effetti: { fazione.pannion: 1, monete: 50 }
        fallimento:
          titolo: I conti storti
          testo: |
            Sbagli il conto dei carri e Julia te lo corregge con la matita, ma
            accetta le due stagioni perché Darrin ha detto di sì con la testa.
            Sulle scale lui ti mette in mano una borsa e dice «Di squadra».
          almeno: { rep.pannion: 4 }
          effetti: { fazione.pannion: 1, monete: 50, scandalo: 0.5 }
      - testo: "Raccontare dove finiva il legname rubato"
        descrizione: "I tronchi con la croce di Darrin finivano alle segherie del canale, e la città li ha pagati due volte."
        prova: { attributo: mentale, abilita: [politica-ed-economia, accademiche], difficolta: Media }
        successo:
          titolo: Pagato due volte
          testo: |
            Nei registri del canale Julia trova il legname senza croce venduto
            alla città, e diventa bianca. Accetta le condizioni di Darrin senza
            discutere, e sulle scale lui ti dà una borsa e dice «Di squadra».
          pe: { politica-ed-economia: 3 }
          almeno: { rep.pannion: 4 }
          effetti: { fazione.pannion: 1, monete: 50, rep.castaldi: 0.5 }
        fallimento:
          titolo: Le prove
          testo: |
            Julia ti chiede le prove, e hai soltanto il racconto di una notte nel
            bosco, ma accetta le condizioni di Darrin per lui. Sulle scale Darrin
            ti mette in mano una borsa e dice «Di squadra».
          almeno: { rep.pannion: 4 }
          effetti: { fazione.pannion: 1, monete: 50, scandalo: 0.5 }
      - testo: "Smascherare l'uomo della cartella"
        descrizione: "L'uomo dell'anticamera compra per Ottone Malgrani. Detto davanti alla Rappresentante, il suo prezzo diventa un'offesa."
        quando: [pista.pelle < 7]
        prova: { attributo: sociale, abilita: [intimidire, persuasione], difficolta: Media }
        successo:
          titolo: Prezzo nostro
          testo: |
            Nella cartella dell'uomo dell'anticamera, riportato dentro per la
            manica, c'è un foglio con l'alloro dei Malgrani e un prezzo per tutto
            il legname di Pannion. Julia lo piega in quattro e accetta le
            condizioni di Darrin, e sulle scale lui ti dà una borsa e dice «Di
            squadra».
          pe: { intimidire: 3 }
          almeno: { rep.pannion: 4 }
          effetti: { fazione.pannion: 1, monete: 50, rep.malgrani: -0.5 }
        fallimento:
          titolo: La manica
          testo: |
            L'uomo grida abbastanza perché due uscieri ti mettano le mani addosso,
            e Julia li manda via con un gesto stanco e accetta le condizioni di
            Darrin. Sulle scale lui ti dà una borsa e dice «Di squadra».
          almeno: { rep.pannion: 4 }
          effetti: { fazione.pannion: 1, monete: 50, scandalo: 1 }
      - testo: "Proporre che le cooperative segnino il legname con Pannion"
        descrizione: "Le cooperative del canale possono comprare da Pannion, con la croce di Darrin e la bolla della città."
        quando: [pista.pelle >= 7]
        prova: { attributo: mentale, abilita: [politica-ed-economia, accademiche], difficolta: Media }
        successo:
          titolo: La croce e la bolla
          testo: |
            Julia prende l'idea al volo, perché una croce di Darrin con la bolla
            della città è difficile da rubare, e firma. Sulle scale Darrin ti dà
            una borsa e dice «Di squadra».
          pe: { politica-ed-economia: 3 }
          almeno: { rep.pannion: 4 }
          effetti: { fazione.pannion: 1, monete: 50, rep.castaldi: 0.5 }
        fallimento:
          titolo: Le cooperative
          testo: |
            Le cooperative non hanno ancora un registro, così Julia firma soltanto
            le condizioni di Darrin. Sulle scale lui ti dà una borsa e dice «Di
            squadra».
          almeno: { rep.pannion: 4 }
          effetti: { fazione.pannion: 1, monete: 50, scandalo: 0.5 }
      - testo: "Lasciar parlare Darrin"
        descrizione: "Darrin parla poco, e quando parla Julia lo ascolta."
        esito:
          titolo: Una frase
          testo: |
            Darrin dice una frase sola, che il doppio lo darà e lo pagherà
            Pannion, e che nella valle non si taglia, e Julia lo guarda a lungo e
            firma. Sulle scale ti dà una borsa e dice «Di squadra», ma la prossima
            volta, aggiunge, parli tu.
          almeno: { rep.pannion: 4 }
          effetti: { fazione.pannion: 1, monete: 50 }
      - testo: "Ricordare a Julia il detto di suo nonno"
        descrizione: "Lo conosci dalle cene dei Quartieri Alti, e detto da uno cresciuto lì è difficile dirgli di no."
        quando: [origine.rampollo-dei-quartieri-alti >= 1]
        esito:
          titolo: Il detto del nonno
          testo: |
            Ricordi a Julia il detto del nonno con il tono delle cene, e lei
            sorride per la prima volta e accetta le condizioni di Darrin, perché i
            Castaldi mantengono volentieri anche le promesse buone degli altri.
            Sulle scale Darrin ti dà una borsa e dice «Di squadra».
          pe: { galateo: 3 }
          almeno: { rep.pannion: 4 }
          effetti: { fazione.pannion: 1, monete: 50, rep.castaldi: 0.5 }
