# Pannion, il villaggio dei carbonai (docs/piano-superficie.md, blocco 5): il luogo nella Superficie Fratturata,
# aperto con pista.arena >= 5, con l'attività ripetibile, il servizio e i servizi dei gradi.
# - `pannion-il-lavoro-dell-altura` (attività): opzioni a fasce di rep.pannion (< 2, 2-4, 4-6, >= 6). Fino a 6 ogni
#   lavoro riuscito alza la reputazione di ½; da 6 in su si lavora per le monete e per i reperti.
# - `pannion-la-cappella-di-koln` (servizio): Frate Koln medica le Ferite e vende l'unguento rosso, al prezzo della
#   squadra dal grado 2 (passo 6).
# - `pannion-una-notte-ai-pontili` (grado 2, passo 6): una notte con Liduina Brace e le lanterne, contro il Tormento.
# Nomi nuovi: nessuno oltre a quelli della quest (Liduina Brace, Gaspare Tenca), con voce in glossario.yaml.
luoghi:
  - id: pannion
    area: superficie-fratturata
    nome: Pannion
    immagine: ambientazione/foresta-strisciante
    requisiti: [pista.arena >= 5]
    sommario: "Il villaggio dei carbonai su un'altura a nord-est, con il Vecchio Albero in piazza e le lanterne sui pontili."
    testo: |
      Pannion sta su un'altura di terra rossa a nord-est della città, dove i fiumi di linfa indurita luccicano al sole
      come vetro colato. Le case sono di legno scuro e resina, e in ogni strada c'è odore di fumo. In mezzo alla piazza
      sta il Vecchio Albero, un tronco nero più alto delle case, e verso il bosco escono i pontili su palafitte, dove
      la sera i boscaioli appendono le lanterne perché un bosco senza luci, dicono, finisce per perdersi.

colonna:
  - { contesto: luogo, id: pannion, musica: our-wounds-our-crown, ambiente: campfire }

storylet:
  # ------------------------------------------------------------ l'attività ripetibile
  - id: pannion-il-lavoro-dell-altura
    presso: pannion
    immagine: ambientazione/segheria-di-qir-azel
    titolo: Il lavoro dell'altura
    sommario: "Chi ha due mani libere trova sempre lavoro a Pannion, e Darrin Huld paga poco ma la sera stessa."
    luogo: Pannion, la piazza del Vecchio
    area: superficie-fratturata
    ripetibile: true
    requisiti: [pista.arena >= 5]
    testo: |
      La mattina Darrin Huld segna i turni a carbone su un'asse appesa al muro della segheria, sotto il Vecchio, mentre le
      carbonaie fumano sul fianco dell'altura.

      {conoscenze-della-strada Facile} Un forestiero prende la metà di uno della squadra, ma la paga arriva la sera
      stessa.

      Quando ti vede, Darrin ti indica un posto con il carbone e aspetta che tu ci vada.
    opzioni:
      - testo: "Portare i sacchi di carbone ai carri"
        descrizione: "Dalla carbonaia al carro ci sono cento passi in salita, con i sacchi sulla schiena."
        requisiti: [rep.pannion < 2]
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Facile }
        successo:
          titolo: Cento passi
          testo: |
            Porti sacchi fino a mezzogiorno, con la polvere nera incollata al
            sudore, e la sera Darrin ti paga guardandoti la schiena, nera come
            quella dei suoi.
          effetti: { monete: 1, rep.pannion: 0.5 }
        fallimento:
          titolo: Il sacco aperto
          testo: |
            Al quinto viaggio il sacco si apre sul sentiero, e raccogli il carbone
            a manciate per una paga di mezza giornata.
      - testo: "Scegliere il vetro di linfa per i molatori"
        descrizione: "Le schegge di linfa indurita si vendono ai molatori di lenti, purché senza bolle."
        requisiti: [rep.pannion < 2]
        prova: { attributo: mentale, abilita: [percezione, natura], difficolta: Media }
        successo:
          titolo: Le schegge limpide
          testo: |
            Separi contro il sole le schegge limpide da quelle con le bolle, e la
            vecchia che controlla non ne toglie nessuna, che a Pannion vale come
            una lode.
          effetti: { monete: 2, rep.pannion: 0.5 }
        fallimento:
          titolo: Le bolle
          testo: |
            Dopo un'ora vedi bolle dappertutto, e la vecchia che controlla
            rovescia il tuo mucchio nella cesta e ricomincia da capo, senza
            rimproverarti.
      - testo: "Tirare la sega a due mani"
        descrizione: "Alla segheria si tira in due, e quello sotto si prende la segatura negli occhi."
        requisiti: [rep.pannion >= 2, rep.pannion < 4]
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Media }
        successo:
          titolo: Il tronco aperto
          testo: |
            Nella fossa sotto il tronco tiri al tempo di quello sopra, che canta a
            mezza voce, finché verso sera il tronco si apre in due assi dritte e
            Darrin passa la mano sul taglio.
          effetti: { monete: 2, rep.pannion: 0.5 }
        fallimento:
          titolo: La lama storta
          testo: |
            Perdi il tempo a metà tronco e la lama si incastra nel legno, e quello
            sopra smette di cantare.
      - testo: "Raccogliere la resina sulle sequoie"
        descrizione: "La resina buona sta nelle ferite della corteccia, e non tutti gli alberi la danno."
        requisiti: [rep.pannion >= 2, rep.pannion < 4]
        prova: { attributo: mentale, abilita: natura, difficolta: Media }
        successo:
          titolo: Le coppe di corteccia
          testo: |
            Incidi soltanto le sequoie con la pelle lucida alla base, e a sera i
            resinieri ti comprano metà delle tue coppe senza discutere.
          effetti: { monete: 2, rep.pannion: 0.5 }
        fallimento:
          titolo: Gli alberi asciutti
          testo: |
            Incidi gli alberi sbagliati, e un resiniere ti mostra con pazienza
            quelli giusti mentre hai le mani appiccicose fino ai gomiti.
      - testo: "Accompagnare un carro di carbone in città"
        descrizione: "Due giorni di strada sulla Superficie con un carro carico, per chi sa tenere a bada muli e predoni."
        requisiti: [rep.pannion >= 4, rep.pannion < 6]
        prova: { attributo: fisico, abilita: [cavalcare, armi-da-mischia], difficolta: Media }
        successo:
          titolo: Il carro alle fucine
          testo: |
            Il carro arriva intero alle fucine della Città Bassa all'alba del
            terzo giorno, e il carrettiere ti paga con una moneta in più per i
            muli.
          effetti: { monete: 4, rep.pannion: 0.5 }
        fallimento:
          titolo: La ruota
          testo: |
            Una ruota finisce in una crepa e il carro si piega su un fianco, e
            arrivate in città con un giorno di ritardo e due sacchi di meno.
      - testo: "Vegliare una carbonaia di notte"
        descrizione: "Una carbonaia che cuoce va guardata fino all'alba. Se il fumo cambia colore, bisogna capire perché."
        requisiti: [rep.pannion >= 4, rep.pannion < 6]
        prova: { attributo: mentale, abilita: [natura, resilienza], difficolta: Media }
        successo:
          titolo: Il fumo bianco
          testo: |
            Verso la terza ora il fumo diventa bianco e chiudi lo sfiatatoio con
            una zolla, e la mattina il carbonaio ti paga raccontandoti chi ha
            litigato con chi.
          effetti: { monete: 3, rep.pannion: 0.5, informazioni.voce: 1 }
        fallimento:
          titolo: Il sonno
          testo: |
            Il caldo ti addormenta seduto, e il carbonaio ti sveglia a calci
            leggeri quando il fumo è già bianco.
      - testo: "Trattare il vetro di linfa con i molatori"
        descrizione: "L'uomo dei molatori di lenti viene ogni mese, e con chi conosce il villaggio tratta meglio."
        requisiti: [rep.pannion >= 6]
        prova: { attributo: sociale, abilita: [persuasione, politica-ed-economia], difficolta: Media }
        successo:
          titolo: La ceralacca blu
          testo: |
            L'uomo dei molatori arriva con un sorriso che a Pannion conoscono
            bene, ma alla fine paga il vetro limpido per quello che vale, e Darrin
            ti lascia la tua parte senza contarla.
          effetti: { monete: 6 }
        fallimento:
          titolo: Il sorriso
          testo: |
            L'uomo dei molatori sorride per tutta la trattativa e paga il vetro
            limpido come quello con le bolle, e te ne accorgi quando se n'è già
            andato.
          effetti: { monete: 2 }
      - testo: "Scendere con i boscaioli ai tagli lontani"
        descrizione: "Sotto le radici delle sequoie grandi ogni tanto esce un pezzo di metallo lucido."
        requisiti: [rep.pannion >= 6]
        prova: { attributo: fisico, abilita: [atletica, armi-da-mischia], difficolta: Difficile }
        successo:
          titolo: Il guscio fra le radici
          testo: |
            Fra le radici della ceppaia di una sequoia grande stacchi a colpi di
            scure un guscio di metallo, e i boscaioli te lo lasciano, perché la
            roba dei Precursori porta male a chi la vende.
          effetti: { monete: 3, reperto.sigillato: 1 }
        fallimento:
          titolo: La ceppaia
          testo: |
            La sequoia cade storta e un ramo ti sfiora la spalla, e la paga della
            sera è quella di una giornata a liberare il sentiero.
          effetti: { monete: 1 }
      - testo: "Mangiare alla mensa dei carbonai"
        descrizione: "La sera i carbonai mangiano insieme sotto una tettoia, e un piatto in più c'è sempre."
        esito:
          titolo: La zuppa nera
          testo: |
            La zuppa ha il colore del carbone e il sapore delle castagne, e il tuo
            vicino ti spiega sulle dita i colori del fumo.
          pe: { natura: 2 }

  # ------------------------------------------------------------ il servizio · la cappella di Frate Koln
  - id: pannion-la-cappella-di-koln
    presso: pannion
    immagine: fazioni/confraternita-del-velo
    titolo: La cappella di Frate Koln
    sommario: "Nella cappella del Velo Frate Koln cuoce un unguento rosso che chiude le bruciature in una notte."
    luogo: Pannion, la cappella del Velo
    area: superficie-fratturata
    ripetibile: true
    requisiti: [pista.arena >= 5]
    testo: |
      La cappella del Velo è una baracca di legno scuro dietro la piazza,
      con il simbolo dell'Albero annerito sopra la porta e dentro più odore
      di cucina che d'incenso. Frate Koln rimesta sudando una pentola di
      linfa rossa e grasso di montone, e sugli scaffali aspettano i vasetti
      con il tappo di cera.

      {medicina Media} Sulle mani di Koln le bruciature vecchie sono guarite
      lisce, senza le cicatrici a corda degli unguenti di città.
    opzioni:
      - testo: "Farti medicare da Frate Koln"
        descrizione: "Koln medica chiunque entri, ma la linfa costa fatica e il Velo vuole la sua parte."
        requisiti: [ferite >= 1, monete >= 12]
        esito:
          titolo: Le mani unte
          testo: |
            Koln ti spalma l'unguento ridendo a ogni tua smorfia, e brucia come
            l'aceto, ma la mattina la pelle ha chiuso.
          effetti: { monete: -12, ferite: -1 }
      - testo: "Comprare un vasetto di unguento rosso"
        descrizione: "Un vasetto di linfa e grasso col tappo di cera, da usare quando serve."
        requisiti: [fazione.pannion < 6, monete >= 18]
        costo: 0
        esito:
          titolo: Il vasetto rosso
          testo: |
            Koln soffia via la polvere da un vasetto e te lo dà, e chiude le
            monete nella cassetta del Velo.
          effetti: { monete: -18, unguento: 1 }
      - testo: "Comprare l'unguento al prezzo della squadra"
        descrizione: "Chi è della squadra di Darrin paga l'unguento quanto lo paga il villaggio."
        requisiti: [fazione.pannion >= 6, monete >= 12]
        costo: 0
        esito:
          titolo: Il prezzo della squadra
          testo: |
            Koln ti dà il vasetto, e le monete finiscono nella tasca del saio
            invece che nella cassetta del Velo.
          effetti: { monete: -12, unguento: 1 }
      - testo: "Rimestare la pentola al posto suo"
        descrizione: "Koln ha sempre bisogno di un braccio fresco. Rimestando si impara qualcosa sugli unguenti."
        esito:
          titolo: Il cucchiaio lungo
          testo: |
            Rimesti per un'ora mentre Koln ti spiega quanto grasso ci va e perché
            la linfa si aggiunge per ultima. Alla fine ride della tua faccia
            davanti alla pentola.
          pe: { medicina: 2 }

  # ------------------------------------------------------------ grado 2 · una notte ai pontili
  - id: pannion-una-notte-ai-pontili
    presso: pannion
    immagine: icone/old-lantern
    titolo: Una notte ai pontili
    sommario: "Liduina Brace ti lascia tenere le lanterne del pontile più lungo, sopra il bosco al buio."
    luogo: Pannion, il pontile più lungo
    area: superficie-fratturata
    ripetibile: true
    requisiti: [fazione.pannion >= 6]
    testo: |
      Il pontile più lungo esce dall'altura per un tiro di sasso sopra il
      bosco, e Liduina Brace ne accende le lanterne una alla volta con un
      tizzone in cima a un bastone, contandole a mezza voce. Ti indica lo
      sgabello in fondo, accanto all'ultima.

      {empatia Facile} A chi viene a sedersi sul pontile di notte, a
      Pannion, nessuno chiede perché.
    opzioni:
      - testo: "Tenere le lanterne fino all'alba"
        descrizione: "Una notte a guardare le luci e il bosco, e la mattina quello che ti porti dietro pesa meno."
        requisiti: [tormento >= 0.5]
        prova: { attributo: mentale, abilita: [resilienza, natura], difficolta: Facile }
        successo:
          titolo: L'ultima lanterna
          testo: |
            Passi la notte accanto all'ultima lanterna, riaccendendo quelle che si
            spengono, e verso l'alba ti accorgi di aver smesso di pensare da un
            pezzo.
          effetti: { tormento: -1 }
        fallimento:
          titolo: I rumori del bosco
          testo: |
            I rumori del bosco ti tengono sveglio, finché ti addormenti seduto e
            Liduina ti sveglia all'alba con una coperta già sulle spalle.
          effetti: { tormento: -0.5 }
      - testo: "Contare le lanterne con Liduina"
        descrizione: "Liduina le conta tutte le sere. Contarle con lei è un modo di farle compagnia."
        esito:
          titolo: I nomi
          testo: |
            Le contate insieme lungo il pontile, e a ogni lanterna Liduina dice il nome di
            una famiglia del villaggio invece di un numero, e alla fine anche il tuo.
          pe: { espressivita: 2 }
