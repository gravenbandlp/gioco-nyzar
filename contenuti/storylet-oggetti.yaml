# Storylet che si aprono dagli Averi (tipo: oggetto): oggetti usabili e decifrazione dei reperti.
storylet:
  - id: usare-registro
    titolo: Il registro del ricettatore
    tipo: oggetto
    area: citta-bassa
    immagine: ambientazione/orlo-dei-rottami
    requisiti: [oggetto.registro-del-ricettatore >= 1]
    sommario: "Un quaderno di conti che qualcuno pagherebbe per leggere, e qualcun altro per farlo sparire."
    testo: |
      Il registro è un quaderno di conti dalla copertina di cartone unta, con un angolo mangiucchiato da
      qualcosa che sperava fosse formaggio. Il dorso è cucito a mano con lo spago da sacchi, e qualcuno l'ha
      ricucito più di una volta. Le pagine sono fitte di nomi e di cifre in una grafia piccola e sempre
      uguale, e l'inchiostro è sbiadito nell'angolo dove il pollice le ha girate. Alcuni nomi li hai sentiti
      nelle osterie della Città Bassa, e uno è di un funzionario della Gilda.

      {origine figlio-della-citta-bassa} Due di quei nomi li conosci di faccia, e sono proprio le facce che in
      Città Bassa è meglio dimenticare.

      {conoscenze-della-strada Facile} Un quaderno così vale due volte, una per chi lo vuole leggere e una per
      chi lo vuole bruciare. Di solito il secondo paga meglio.

      Non conviene tenerlo a lungo in tasca, e infatti l'hai già spostato in quella interna senza pensarci.
    opzioni:
      - testo: "Venderlo a Mauro Scrocco"
        quando: [pista.pelle < 6]
        descrizione: "Gli Scuri pagano bene le informazioni sui ricettatori della Città Bassa, soprattutto su quelli che non pagano loro."
        esito:
          titolo: Si parla di tutto
          testo: |
            Mauro sfoglia il registro fischiettando dietro il bancone della Pignatta e si bagna il pollice a
            ogni pagina. A una pagina verso la metà smette di fischiettare e ci passa sopra il dito due volte,
            piano. Ti paga senza contrattare e ti versa anche da bere, cosa che da lui non ti aspettavi e che
            ti fa venire un piccolo dubbio sul prezzo.
          effetti: { oggetto.registro-del-ricettatore: -1, monete: 15, rep.scuri: 1, rep.caserma: -0.5 }
      - testo: "Consegnarlo alla Caserma"
        descrizione: "Il capitano di turno sarà contento. Gli Scuri, quando lo sapranno, molto meno."
        esito:
          titolo: Un verbale
          testo: |
            Il sergente al banco della Caserma ti fa firmare un verbale con una penna legata a uno spago così
            corto che devi piegarti sul banco per arrivarci. Il bordo di quercia è lucido dei gomiti di chi ha
            firmato prima di te. Poi mette il registro in un cassetto chiuso a chiave, ti ringrazia a nome
            dello sceriffo e ti chiede di non parlarne in giro, abbassando la voce come se il cassetto
            ascoltasse.
          effetti: { oggetto.registro-del-ricettatore: -1, rep.caserma: 1, rep.scuri: -1 }
      - testo: "Studiarlo con calma"
        descrizione: "Incrociando i nomi con quello che hai sentito in giro, forse qualcosa viene fuori."
        prova: { attributo: mentale, abilita: [percezione, accademiche], difficolta: Media }
        successo:
          titolo: Un nome ricorre
          testo: |
            Dopo un'ora di confronti, con gli occhi che ti lacrimano e il collo rigido, un nome torna su
            quattro pagine, sempre accanto a una partita di cristalli non registrati. Le cifre accanto a quel
            nome sono scritte con un inchiostro più scuro, e in quei punti la penna ha graffiato la carta. Lo
            annoti sul dorso della mano e poi su un foglio, e bruci il registro nella stufa della locanda. La
            copertina unta prende fuoco meglio di quanto vorresti.
          effetti: { oggetto.registro-del-ricettatore: -1, informazioni.pettegolezzo: 1 }
        fallimento:
          titolo: Solo cifre
          testo: |
            I conti non tornano, o forse sono scritti in un codice che non conosci e che chi lo ha inventato
            trovava molto spiritoso. Certe colonne si sommano in fondo alla pagina e altre no, senza un segno
            che le distingua. Rimetti il registro in tasca per un'altra volta.
          effetti: {}

  - id: usare-iniettore
    titolo: L'iniettore
    tipo: oggetto
    area: citta-bassa
    immagine: ambientazione/rovine-dei-precursori
    requisiti: [oggetto.iniettore >= 1, decifrato.iniettore >= 1, guasto.iniettore == 0, cariche.iniettore >= 1, ferite >= 0.5]
    sommario: "Un cilindro che punge e richiude le ferite."
    testo: |
      Appoggi il cilindro sull'interno dell'avambraccio, dove la vena si vede meglio, e senti una puntura
      fredda. Subito dopo il calore si allarga lungo il braccio fino alle ferite, e le spalle ti si sciolgono.
      Il metallo invece resta freddo contro la pelle per tutto il tempo.

      {medicina Media} Il calore va dove fa male e solo lì, prima alla ferita più profonda e poi alle altre.
      Nessun unguento della Città Bassa ha mai avuto tanta educazione.

      {origine accolito-del-velo} È il calore che usciva dai palmi di Padre Vantes nella tenda dei feriti,
      senza la faccia grigia di chi lo dava. Ti senti in colpa come quando da novizi{o|a} saltavi una
      preghiera.
    opzioni:
      - testo: "Usare una carica"
        reperto: iniettore
        descrizione: "Una prova di Mentale + Tecnologia. Con zero successi il reperto si guasta."
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Molto facile }
        successo:
          titolo: Il calore
          testo: "Le ferite si chiudono sotto la pelle, e per un'ora ti senti la bocca piena di metallo."
          effetti: { cariche.iniettore: -1, ferite: -1 }
        fallimento:
          titolo: La puntura sbagliata
          testo: "Il cilindro punge nel punto sbagliato e ti lascia soltanto un livido."
          effetti: { cariche.iniettore: -1 }

  - id: decifrare-iniettore
    titolo: Decifrare l'iniettore
    tipo: oggetto
    area: citta-bassa
    immagine: ambientazione/rovine-dei-precursori
    requisiti: [oggetto.iniettore >= 1, decifrato.iniettore == 0]
    sommario: "Capire come funziona un reperto dei Precursori prima che sia lui a capire te."
    testo: |
      Il cilindro è lungo come un dito e fatto di un metallo che non si scalda in mano per quanto tu lo
      stringa. Non ha giunture né viti, e il metallo è tutto d'un pezzo dalla punta al fondo. Su un lato ha
      una fila di segni che si spostano quando provi a leggerli, e sull'altro un ago sottile che esce e
      rientra da solo. L'ago è asciutto e pulito, e sul foro da cui esce non c'è un graffio.

      {tecnologia Media} I segni si spostano sempre nello stesso ordine, e a ogni giro ne mostrano uno in
      meno. È un contatore, e conta all'indietro.
    opzioni:
      - testo: "Studiare il reperto"
        reperto: iniettore
        descrizione: "Una prova di Mentale + Tecnologia. Il contatto con la tecnologia precuriana lascia il segno."
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Media }
        successo:
          titolo: Decifrato
          testo: |
            Capisci quali segni indicano le cariche e che il foro va appoggiato sull'interno dell'avambraccio.
            L'ago esce e rientra, e il cilindro che non si era mai scaldato si scalda appena nel palmo come se
            ti avesse riconosciuto.
          effetti: { decifrato.iniettore: 1 }
        fallimento:
          titolo: Il reperto non risponde
          testo: |
            Passi un'ora a girarlo fra le dita, e i segni sul fianco non si fermano mai abbastanza da farsi
            contare. Quando lo posi hai la sensazione di aver dimenticato qualcosa, e ti tasti le tasche una
            per una come se potesse essere lì.
          effetti: { tormento: 1 }

  - id: decifrare-arma-a-impulsi
    titolo: Decifrare l'arma a impulsi
    tipo: oggetto
    area: citta-bassa
    immagine: ambientazione/rovine-dei-precursori
    requisiti: [oggetto.arma-a-impulsi >= 1, decifrato.arma-a-impulsi == 0]
    sommario: "Capire come funziona un reperto dei Precursori prima che sia lui a capire te."
    testo: |
      Il tubo di metallo è freddo e pesante, e il peso sta tutto verso la bocca, tanto che a reggerlo con una
      mano sola il polso cede. L'impugnatura è fatta per mani più lunghe delle tue, e le scanalature per le
      dita cadono sempre fra una tua nocca e l'altra. In fondo c'è una fessura che si illumina quando la punti
      verso qualcosa di vivo, e ti viene da allontanarla dai tuoi piedi. Davanti al muro resta spenta, e
      quando passa sul ragno nell'angolo si accende.

      {armi-da-distanza Facile} Manca il mirino e manca la tacca per l'occhio, perché la fessura sceglie da
      sola il bersaglio e a te resta la parte del grilletto.

      {origine apprendista-raschiatore} Sulle piattaforme hai visto risalire tubi come questo dentro casse
      chiuse, e chi le portava camminava largo. Adesso il tubo ce l'hai in mano tu, e i gomiti ti si sono
      allargati da soli.
    opzioni:
      - testo: "Studiare il reperto"
        reperto: arma-a-impulsi
        descrizione: "Una prova di Mentale + Tecnologia. Il contatto con la tecnologia precuriana lascia il segno."
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Media }
        successo:
          titolo: Decifrato
          testo: |
            Trovi la posizione giusta per le dita e il tubo si accende con un ronzio basso, che ti arriva nei
            denti prima che nelle orecchie. Sul muro davanti a te resta un segno tondo e annerito, e al centro
            la pietra si è fusa in una crosta liscia. Ti formicola il braccio fino alla spalla.
          effetti: { decifrato.arma-a-impulsi: 1 }
        fallimento:
          titolo: Il reperto non risponde
          testo: |
            La fessura si illumina e si spegne, e per quanto tu cambi la presa il tubo ti resta freddo e
            immobile fra le mani. Per tutta la notte ti sembra di sentire il ronzio anche a occhi chiusi, e ti
            giri sul fianco sperando che stia dall'altra parte.
          effetti: { tormento: 1 }

  - id: decifrare-respiratore
    titolo: Decifrare il respiratore
    tipo: oggetto
    area: citta-bassa
    immagine: ambientazione/rovine-dei-precursori
    requisiti: [oggetto.respiratore >= 1, decifrato.respiratore == 0]
    sommario: "Capire come funziona un reperto dei Precursori prima che sia lui a capire te."
    testo: |
      La maschera di lega grigia è più leggera di quanto sembri, e il metallo è così sottile che contro la
      luce lascia passare un chiarore. Non ha cinghie né fibbie per fermarla dietro la testa. Quando la
      avvicini al viso i bordi si muovono da soli per adattarsi, e d'istinto la allontani di un dito.

      {natura Media} Dentro c'è un odore di pietra bagnata, lo stesso dei pozzi quando la Marea è passata da
      poco. Chi l'ha fatta sapeva cosa c'era da respirare là sotto.

    opzioni:
      - testo: "Studiare il reperto"
        reperto: respiratore
        descrizione: "Una prova di Mentale + Tecnologia. Il contatto con la tecnologia precuriana lascia il segno."
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Media }
        successo:
          titolo: Decifrato
          testo: |
            La maschera si chiude sul viso con un piccolo sospiro, e i bordi ti seguono la mascella quando
            parli. L'aria che respiri sa di pietra bagnata ed è più fresca di quella intorno. La Marea, con
            questa addosso, fa meno paura, anche se ti vedi riflesso in una pozza e fai paura tu.
          effetti: { decifrato.respiratore: 1 }
        fallimento:
          titolo: Il reperto non risponde
          testo: |
            La maschera ti si stringe addosso e per un momento non riesci a togliertela. Le unghie scivolano
            sul bordo liscio, e dentro l'aria si fa scarsa e sa di pozzo. Quando cede la butti sul tavolo, e
            sulle guance ti restano due solchi rossi.
          effetti: { tormento: 1 }

  - id: decifrare-campo-di-forza
    titolo: Decifrare il campo di forza
    tipo: oggetto
    area: citta-bassa
    immagine: ambientazione/rovine-dei-precursori
    requisiti: [oggetto.campo-di-forza >= 1, decifrato.campo-di-forza == 0]
    sommario: "Capire come funziona un reperto dei Precursori prima che sia lui a capire te."
    testo: |
      Il disco è largo quanto un palmo e spesso un dito, di un metallo scuro che non ha preso una macchia. Al
      centro ha un incavo consumato da un pollice che c'è stato prima del tuo, e quel pollice era più largo,
      perché il tuo ci balla dentro. Quando lo appoggi sul petto senti la pelle formicolare e i peli delle
      braccia si alzano.

      {origine allievo-di-torvessa} All'Accademia i reperti dei Precursori si studiano sui libri, e i libri su
      questo disco hanno poco da dire. Temmerin te lo farebbe disegnare tre volte prima di lasciartelo
      toccare.

      {rissa Facile} Una cosa che ferma i colpi ha sempre un lato scoperto, e conviene sapere quale.
    opzioni:
      - testo: "Studiare il reperto"
        reperto: campo-di-forza
        descrizione: "Una prova di Mentale + Tecnologia. Il contatto con la tecnologia precuriana lascia il segno."
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Media }
        successo:
          titolo: Decifrato
          testo: |
            Premi l'incavo e l'aria attorno a te si fa densa e luminosa, e i suoni di fuori ti arrivano
            attutiti. Un sasso che lanci contro il tuo braccio si ferma a un palmo dalla pelle e cade dritto a
            terra. Ne lanci un altro con più convinzione, e fa la stessa fine.
          effetti: { decifrato.campo-di-forza: 1 }
        fallimento:
          titolo: Il reperto non risponde
          testo: |
            Il disco si scalda fino a scottare e poi si spegne, e quando lo tocchi di nuovo è già freddo. Il
            formicolio ti resta nelle dita fino a sera, e il cucchiaio della cena ti sembra di qualcun altro.
          effetti: { tormento: 1 }

  - id: decifrare-visore
    titolo: Decifrare il visore
    tipo: oggetto
    area: citta-bassa
    immagine: ambientazione/rovine-dei-precursori
    requisiti: [oggetto.visore >= 1, decifrato.visore == 0]
    sommario: "Capire come funziona un reperto dei Precursori prima che sia lui a capire te."
    testo: |
      La lente è montata su un archetto che si aggancia dietro l'orecchio, fatto per un orecchio più alto del
      tuo, e così ti resta storta sull'occhio. Il cristallo è spesso come un'unghia e non ha un graffio.
      Attraverso il cristallo le cose sembrano più vicine, e un poco in anticipo.

      {percezione Media} Una goccia cade dalla grondaia. La vedi staccarsi, e poi la vedi staccarsi di nuovo.
    opzioni:
      - testo: "Studiare il reperto"
        reperto: visore
        descrizione: "Una prova di Mentale + Tecnologia. Il contatto con la tecnologia precuriana lascia il segno."
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Media }
        successo:
          titolo: Decifrato
          testo: |
            Impari a guardare attraverso la lente senza perdere l'equilibrio, con l'altro occhio socchiuso e
            il mento un poco abbassato per raddrizzare l'archetto. Il gatto sul muretto si muove, e tu lo
            avevi visto muoversi un attimo prima. Lui ti guarda con l'aria offesa di chi è stato anticipato.
          effetti: { decifrato.visore: 1 }
        fallimento:
          titolo: Il reperto non risponde
          testo: |
            Guardi troppo a lungo attraverso la lente e ti gira la testa, e quando la togli il pavimento ti
            arriva sotto i piedi un poco in ritardo. Per un po' non riesci a capire in che ordine succedono le
            cose, e mangi la cena con il sospetto di averla già mangiata.
          effetti: { tormento: 1 }
