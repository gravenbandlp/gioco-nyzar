# Storylet che si aprono dagli Averi (tipo: oggetto): oggetti usabili e decifrazione dei reperti.
storylet:
  - id: usare-registro
    titolo: Il registro del ricettatore
    tipo: oggetto
    area: citta-bassa
    immagine: ambientazione/orlo-dei-rottami
    requisiti: [oggetto.registro-del-ricettatore >= 1]
    sommario: "Un quaderno di conti che qualcuno pagherebbe per leggere, e qualcun altro per farlo sparire."
    testo: |
      Il registro è un quaderno di conti dalla copertina unta, con un angolo
      mangiucchiato da qualcosa che sperava fosse formaggio. Le pagine sono
      fitte di nomi e di cifre, in una grafia piccola e regolare. Molti nomi
      non ti dicono niente. Alcuni li hai sentiti nelle osterie della Città
      Bassa, e uno è di un funzionario della Gilda.

      {origine figlio-della-citta-bassa} Due di quei nomi li conosci di
      faccia, e sono proprio le facce che in Città Bassa è meglio
      dimenticare. Il dito si ferma sulla pagina da solo, e da solo va
      avanti.

      {conoscenze-della-strada Facile} Un quaderno così vale due volte, una
      per chi lo vuole leggere e una per chi lo vuole bruciare. Di solito
      il secondo paga meglio, e con meno domande.

      {percezione Media} La grafia non cambia mai, nemmeno quando le cifre
      si fanno grosse. Chi teneva questi conti non aveva paura di niente,
      oppure non sapeva cosa stava scrivendo.

      Non è un oggetto che conviene tenere a lungo in tasca, e infatti l'hai
      già spostato in quella interna senza pensarci.
    opzioni:
      - testo: "Venderlo a Mauro Scrocco"
        quando: [pista.pelle < 6]
        descrizione: "Gli Scuri pagano bene le informazioni sui ricettatori della Città Bassa, soprattutto su quelli che non pagano loro."
        esito:
          titolo: Si parla di tutto
          testo: |
            Mauro sfoglia il registro fischiettando dietro il bancone della
            Pignatta, bagnandosi il pollice a ogni pagina, e su una pagina
            smette di fischiettare. Ti paga senza contrattare e ti versa anche
            da bere, cosa che da lui non ti aspettavi e che ti fa venire un
            piccolo dubbio sul prezzo.
          effetti: { oggetto.registro-del-ricettatore: -1, monete: 15, rep.scuri: 1, rep.caserma: -0.5 }
      - testo: "Consegnarlo alla Caserma"
        descrizione: "Il capitano di turno sarà contento. Gli Scuri, quando lo sapranno, molto meno."
        esito:
          titolo: Un verbale
          testo: |
            Il sergente al banco della Caserma ti fa firmare un verbale con una
            penna legata a uno spago così corto che devi piegarti sul banco
            per arrivarci. Poi mette il registro in un cassetto chiuso
            a chiave, ti ringrazia a nome dello sceriffo e ti chiede di non
            parlarne in giro, abbassando la voce come se il cassetto ascoltasse.
          effetti: { oggetto.registro-del-ricettatore: -1, rep.caserma: 1, rep.scuri: -1 }
      - testo: "Studiarlo con calma"
        descrizione: "Incrociando i nomi con quello che hai sentito in giro, forse qualcosa viene fuori."
        prova: { attributo: mentale, abilita: [percezione, accademiche], difficolta: Media }
        successo:
          titolo: Un nome ricorre
          testo: |
            Dopo un'ora di confronti, con gli occhi che ti lacrimano e il collo
            rigido, un nome torna su quattro pagine, sempre accanto a una
            partita di cristalli non registrati. Lo annoti sul dorso della mano,
            poi su un foglio, e bruci il registro nella stufa della locanda.
            La copertina unta prende fuoco meglio di quanto vorresti.
          effetti: { oggetto.registro-del-ricettatore: -1, informazioni.pettegolezzo: 1 }
        fallimento:
          titolo: Solo cifre
          testo: |
            I conti non tornano, o forse sono scritti in un codice che non
            conosci e che chi lo ha inventato trovava molto spiritoso. Rimetti
            il registro in tasca per un'altra volta.
          effetti: {}

  - id: usare-iniettore
    titolo: L'iniettore
    tipo: oggetto
    area: citta-bassa
    immagine: ambientazione/rovine-dei-precursori
    requisiti: [oggetto.iniettore >= 1, decifrato.iniettore >= 1, guasto.iniettore == 0, cariche.iniettore >= 1, ferite >= 0.5]
    sommario: "Un cilindro che punge e richiude le ferite."
    testo: |
      Appoggi il cilindro all'avambraccio e senti la puntura, fredda. Dopo
      un attimo il calore si allarga lungo il braccio fino alle ferite, e
      le spalle ti si sciolgono prima ancora che tu decida di rilassarle.

      {medicina Media} Il calore va dove fa male e solo lì, come se sapesse
      la strada. Nessun unguento della Città Bassa ha mai avuto tanta
      educazione.

      {origine accolito-del-velo} È il calore che usciva dai palmi di Padre
      Vantes nella tenda dei feriti, senza la faccia grigia di chi lo dava.
      Per un momento ti senti in colpa, come quando da novizio saltavi una
      preghiera.
    opzioni:
      - testo: "Usare una carica"
        reperto: iniettore
        descrizione: "Una prova di Mentale + Tecnologia. Con zero successi il reperto si guasta."
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Molto facile }
        successo:
          titolo: Il calore
          testo: "Le ferite si chiudono sotto la pelle, e per un'ora ti senti la bocca piena di metallo."
          effetti: { cariche.iniettore: -1, ferite: -1 }
        fallimento:
          titolo: La puntura sbagliata
          testo: "Il cilindro punge nel punto sbagliato e ti lascia soltanto un livido."
          effetti: { cariche.iniettore: -1 }

  - id: decifrare-iniettore
    titolo: Decifrare l'iniettore
    tipo: oggetto
    area: citta-bassa
    immagine: ambientazione/rovine-dei-precursori
    requisiti: [oggetto.iniettore >= 1, decifrato.iniettore == 0]
    sommario: "Capire come funziona un reperto dei Precursori prima che sia lui a capire te."
    testo: |
      Il cilindro è lungo come un dito, di un metallo che non si scalda in
      mano per quanto tu lo stringa. Su un lato ha una fila di segni che si
      spostano quando provi a leggerli, sull'altro un ago sottile che esce e
      rientra da solo.

      {tecnologia Media} I segni si spostano sempre nello stesso ordine. È
      un contatore, e conta all'indietro.

      {resilienza Facile fallita} L'ago esce di nuovo e il tuo braccio si
      ritira da solo dentro la manica, senza consultarti.
    opzioni:
      - testo: "Studiare il reperto"
        reperto: iniettore
        descrizione: "Una prova di Mentale + Tecnologia. Il contatto con la tecnologia precuriana lascia il segno."
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Media }
        successo:
          titolo: Decifrato
          testo: |
            Capisci quali segni indicano le cariche e dove si appoggia. L'ago
            esce e rientra, e il cilindro, che non si era mai scaldato, si
            scalda appena nel palmo come se ti avesse riconosciuto.
          effetti: { decifrato.iniettore: 1 }
        fallimento:
          titolo: Il reperto non risponde
          testo: |
            Passi un'ora a girarlo fra le dita. Quando lo posi hai la sensazione
            di aver dimenticato qualcosa, e ti tasti le tasche una per una come
            se potesse essere lì.
          effetti: { tormento: 0.5 }

  - id: decifrare-arma-a-impulsi
    titolo: Decifrare l'arma a impulsi
    tipo: oggetto
    area: citta-bassa
    immagine: ambientazione/rovine-dei-precursori
    requisiti: [oggetto.arma-a-impulsi >= 1, decifrato.arma-a-impulsi == 0]
    sommario: "Capire come funziona un reperto dei Precursori prima che sia lui a capire te."
    testo: |
      Il tubo di metallo è freddo e pesante, con un'impugnatura fatta per
      mani più lunghe delle tue, e le dita ti restano aperte sul calcio come
      quelle di un bambino sul bicchiere di un adulto. In fondo c'è una
      fessura che si illumina quando la tieni puntata verso qualcosa di vivo,
      e ti viene da allontanarla dai tuoi piedi.

      {armi-da-distanza Facile} Manca il mirino, e a quanto pare manca
      anche il bisogno di averlo. La fessura sceglie da sola il bersaglio, a
      te resta la parte del grilletto.

      {tecnologia Difficile} Il peso è tutto in fondo, dietro la fessura.
      Lì dentro c'è qualcosa che accumula, e da come tira giù il polso è
      ancora carico.

      {origine apprendista-raschiatore} Sulle piattaforme hai visto risalire
      tubi come questo dentro casse chiuse, e chi le portava camminava largo,
      con la cassa lontana dalle gambe. Adesso il tubo ce l'hai in mano tu, e
      i gomiti ti si sono allargati da soli.
    opzioni:
      - testo: "Studiare il reperto"
        reperto: arma-a-impulsi
        descrizione: "Una prova di Mentale + Tecnologia. Il contatto con la tecnologia precuriana lascia il segno."
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Media }
        successo:
          titolo: Decifrato
          testo: |
            Trovi la posizione giusta per le dita e il tubo si accende con un
            ronzio basso, che ti arriva nei denti prima che nelle orecchie. Sul
            muro davanti a te resta un segno bruciato, e ti formicola il braccio
            fino alla spalla.
          effetti: { decifrato.arma-a-impulsi: 1 }
        fallimento:
          titolo: Il reperto non risponde
          testo: |
            La fessura si illumina e si spegne. Per tutta la notte ti sembra di
            sentire il ronzio anche a occhi chiusi, e ti giri sul fianco
            sperando che stia dall'altra parte.
          effetti: { tormento: 0.5 }

  - id: decifrare-respiratore
    titolo: Decifrare il respiratore
    tipo: oggetto
    area: citta-bassa
    immagine: ambientazione/rovine-dei-precursori
    requisiti: [oggetto.respiratore >= 1, decifrato.respiratore == 0]
    sommario: "Capire come funziona un reperto dei Precursori prima che sia lui a capire te."
    testo: |
      La maschera di lega grigia è più leggera di quanto sembri. Quando la
      avvicini al viso i bordi si muovono da soli per adattarsi, e d'istinto
      la allontani di un dito.

      {natura Media} Dentro c'è un odore di pietra bagnata, lo stesso dei
      pozzi quando la Marea è passata da poco. Chi l'ha fatta sapeva cosa
      c'era da respirare là sotto.

    opzioni:
      - testo: "Studiare il reperto"
        reperto: respiratore
        descrizione: "Una prova di Mentale + Tecnologia. Il contatto con la tecnologia precuriana lascia il segno."
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Media }
        successo:
          titolo: Decifrato
          testo: |
            La maschera si chiude sul viso con un piccolo sospiro, e l'aria che
            respiri sa di pietra bagnata. La Marea, con questa addosso, fa meno
            paura, anche se ti vedi riflesso in una pozza e fai paura tu.
          effetti: { decifrato.respiratore: 1 }
        fallimento:
          titolo: Il reperto non risponde
          testo: |
            La maschera ti si stringe addosso e per un momento non riesci a
            togliertela, e le unghie scivolano sul bordo liscio. Quando cede la
            butti sul tavolo, e sulle guance ti restano due solchi rossi.
          effetti: { tormento: 0.5 }

  - id: decifrare-campo-di-forza
    titolo: Decifrare il campo di forza
    tipo: oggetto
    area: citta-bassa
    immagine: ambientazione/rovine-dei-precursori
    requisiti: [oggetto.campo-di-forza >= 1, decifrato.campo-di-forza == 0]
    sommario: "Capire come funziona un reperto dei Precursori prima che sia lui a capire te."
    testo: |
      Il disco ha un incavo al centro, grande come un pollice, e il bordo
      consumato da un pollice che c'è stato prima del tuo. Quando lo appoggi
      sul petto senti la pelle formicolare, e i peli delle braccia si
      alzano.

      {magia Media} Il Mana qui non c'entra. È un'altra cosa, più ordinata,
      che non ti chiede niente e non ti promette niente.

      {origine allievo-di-torvessa} All'Accademia i reperti dei Precursori si
      studiano soprattutto sui libri, e i libri su questo disco hanno poco da
      dire. Temmerin te lo farebbe disegnare tre volte prima di lasciartelo
      toccare, e tu ce l'hai già sul petto.

      {rissa Facile} Una cosa che ferma i colpi ha sempre un lato da cui
      non li ferma, e prima di fidarti varrebbe la pena di sapere quale.
    opzioni:
      - testo: "Studiare il reperto"
        reperto: campo-di-forza
        descrizione: "Una prova di Mentale + Tecnologia. Il contatto con la tecnologia precuriana lascia il segno."
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Media }
        successo:
          titolo: Decifrato
          testo: |
            Premi l'incavo e l'aria attorno a te si fa densa e luminosa. Un sasso
            che lanci contro il tuo braccio cade a terra prima di toccarlo. Ne
            lanci un altro con più convinzione, e fa la stessa fine.
          effetti: { decifrato.campo-di-forza: 1 }
        fallimento:
          titolo: Il reperto non risponde
          testo: |
            Il disco si scalda fino a scottare e poi si spegne. Il formicolio ti
            resta nelle dita fino a sera, e il cucchiaio della cena ti sembra
            di qualcun altro.
          effetti: { tormento: 0.5 }

  - id: decifrare-visore
    titolo: Decifrare il visore
    tipo: oggetto
    area: citta-bassa
    immagine: ambientazione/rovine-dei-precursori
    requisiti: [oggetto.visore >= 1, decifrato.visore == 0]
    sommario: "Capire come funziona un reperto dei Precursori prima che sia lui a capire te."
    testo: |
      La lente è montata su un archetto che si aggancia dietro l'orecchio,
      fatto per un orecchio più alto del tuo. Attraverso il cristallo le cose
      sembrano più vicine, e un poco in anticipo.

      {percezione Media} Una goccia cade dalla grondaia. La vedi staccarsi,
      e poi la vedi staccarsi di nuovo.

      {acrobazia Facile fallita} Fai un passo e il pavimento arriva prima
      del piede. Ti appoggi al muro con molta dignità.
    opzioni:
      - testo: "Studiare il reperto"
        reperto: visore
        descrizione: "Una prova di Mentale + Tecnologia. Il contatto con la tecnologia precuriana lascia il segno."
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Media }
        successo:
          titolo: Decifrato
          testo: |
            Impari a guardare attraverso la lente senza perdere l'equilibrio,
            tenendo l'altro occhio socchiuso. Il gatto sul muretto si muove, e
            tu lo avevi visto muoversi un attimo prima. Lui ti guarda con
            l'aria offesa di chi è stato anticipato.
          effetti: { decifrato.visore: 1 }
        fallimento:
          titolo: Il reperto non risponde
          testo: |
            Guardi troppo a lungo attraverso la lente e ti gira la testa. Per un
            po' non riesci a capire in che ordine succedono le cose, e mangi la
            cena con il sospetto di averla già mangiata.
          effetti: { tormento: 0.5 }
