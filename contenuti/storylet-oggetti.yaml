# Storylet che si aprono dagli Averi (tipo: oggetto): oggetti usabili e decifrazione dei reperti.
storylet:
  - id: usare-registro
    titolo: Il registro del ricettatore
    tipo: oggetto
    area: citta-bassa
    immagine: ambientazione/orlo-dei-rottami
    requisiti: [oggetto.registro-del-ricettatore >= 1]
    sommario: "Un quaderno di conti che qualcuno pagherebbe per leggere, e qualcun altro per farlo sparire."
    testo: |
      Sotto la copertina unta, le pagine del registro sono piene di nomi e
      cifre in una grafia piccola e regolare. Alcuni nomi li hai sentiti
      nelle osterie della Città Bassa, e uno è di un funzionario della
      Gilda.

      {conoscenze-della-strada Facile} Un quaderno così vale due volte, per
      chi lo vuole leggere e per chi lo vuole bruciare, e di solito il
      secondo paga meglio.

      {origine figlio-della-citta-bassa} Due di quei nomi li conosci di
      faccia, e sono facce che in Città Bassa è meglio dimenticare.
    opzioni:
      - testo: "Venderlo a Mauro Scrocco"
        quando: [pista.pelle < 6]
        descrizione: "Gli Scuri pagano bene i segreti dei ricettatori, soprattutto di quelli che non pagano loro."
        esito:
          titolo: Si parla di tutto
          testo: |
            Mauro sfoglia il registro dietro il bancone della Pignatta e a una
            pagina smette di fischiettare. Ti paga senza contrattare e ti versa
            anche da bere, che da lui è un cattivo segno per il prezzo.
          effetti: { oggetto.registro-del-ricettatore: -1, monete: 15, rep.scuri: 1, rep.caserma: -0.5 }
      - testo: "Consegnarlo alla Caserma"
        descrizione: "Il capitano di turno sarà contento, gli Scuri molto meno."
        esito:
          titolo: Un verbale
          testo: |
            Il sergente della Caserma chiude il registro in un cassetto, dopo
            averti fatto firmare un verbale con una penna legata a uno spago
            cortissimo, e ti chiede a bassa voce di non parlarne in giro.
          effetti: { oggetto.registro-del-ricettatore: -1, rep.caserma: 1, rep.scuri: -1 }
      - testo: "Studiarlo con calma"
        descrizione: "Incrociando i nomi con le voci che hai sentito, forse qualcosa viene fuori."
        prova: { attributo: mentale, abilita: [percezione, accademiche], difficolta: Media }
        successo:
          titolo: Un nome ricorre
          testo: |
            Dopo un'ora di confronti un nome torna su quattro pagine, sempre
            accanto a una partita di cristalli non registrati. Lo annoti su un
            foglio e bruci il registro nella stufa della locanda, dove la
            copertina unta prende fuoco fin troppo bene.
          effetti: { oggetto.registro-del-ricettatore: -1, informazioni.pettegolezzo: 1 }
        fallimento:
          titolo: Solo cifre
          testo: |
            I conti non tornano, o sono scritti in un codice che non conosci, e
            rimetti il registro in tasca per un'altra volta.
          effetti: {}

  - id: usare-iniettore
    titolo: L'iniettore
    tipo: oggetto
    area: citta-bassa
    immagine: ambientazione/rovine-dei-precursori
    requisiti: [oggetto.iniettore >= 1, decifrato.iniettore >= 1, guasto.iniettore == 0, cariche.iniettore >= 1, ferite >= 0.5]
    sommario: "Un cilindro che punge e richiude le ferite."
    testo: |
      Appoggi il cilindro all'avambraccio e senti la puntura, fredda. Poi un
      calore si allarga lungo il braccio fino alle ferite, e le spalle ti si
      sciolgono prima che tu decida di rilassarle.

      {origine accolito-del-velo} È il calore che usciva dai palmi di Padre
      Vantes nella tenda dei feriti, senza la faccia grigia di chi lo dava.
    opzioni:
      - testo: "Usare una carica"
        reperto: iniettore
        descrizione: "Una prova di Mentale + Tecnologia. Con zero successi il reperto si guasta."
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Molto facile }
        successo:
          titolo: Il calore
          testo: "Le ferite si chiudono sotto la pelle, e per un'ora ti senti la bocca piena di metallo."
          effetti: { cariche.iniettore: -1, ferite: -1 }
        fallimento:
          titolo: La puntura sbagliata
          testo: "Il cilindro punge nel punto sbagliato e ti lascia soltanto un livido."
          effetti: { cariche.iniettore: -1 }

  - id: decifrare-iniettore
    titolo: Decifrare l'iniettore
    tipo: oggetto
    area: citta-bassa
    immagine: ambientazione/rovine-dei-precursori
    requisiti: [oggetto.iniettore >= 1, decifrato.iniettore == 0]
    sommario: "Capire come funziona un reperto dei Precursori."
    testo: |
      Il cilindro è lungo come un dito, di un metallo che non si scalda in
      mano. Su un lato ha una fila di segni che si spostano quando provi a
      leggerli, sull'altro un ago sottile che esce e rientra da solo.

      {tecnologia Media} I segni si spostano sempre nello stesso ordine,
      come un contatore che conta all'indietro.
    opzioni:
      - testo: "Studiare il reperto"
        reperto: iniettore
        descrizione: "Una prova di Mentale + Tecnologia. Il contatto con la tecnologia precuriana lascia il segno."
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Media }
        successo:
          titolo: Decifrato
          testo: |
            Capisci quali segni indicano le cariche e dove si appoggia, e il
            cilindro, che non si era mai scaldato, si scalda appena nel palmo.
          effetti: { decifrato.iniettore: 1 }
        fallimento:
          titolo: Il reperto non risponde
          testo: |
            Passi un'ora a girarlo fra le dita, e quando lo posi ti tasti le
            tasche come se avessi dimenticato qualcosa.
          effetti: { tormento: 1 }

  - id: decifrare-arma-a-impulsi
    titolo: Decifrare l'arma a impulsi
    tipo: oggetto
    area: citta-bassa
    immagine: ambientazione/rovine-dei-precursori
    requisiti: [oggetto.arma-a-impulsi >= 1, decifrato.arma-a-impulsi == 0]
    sommario: "Capire come funziona un reperto dei Precursori."
    testo: |
      Il tubo di metallo è freddo e pesante, con un'impugnatura fatta per
      mani più lunghe delle tue, e in fondo una fessura che si illumina
      quando la punti verso qualcosa di vivo.

      {tecnologia Difficile} Il peso sta tutto dietro la fessura, e da come
      ti tira giù il polso quello che c'è dentro è ancora carico.

      {origine apprendista-raschiatore} Sulle piattaforme hai visto risalire
      tubi come questo in casse chiuse, portate lontano dalle gambe.
    opzioni:
      - testo: "Studiare il reperto"
        reperto: arma-a-impulsi
        descrizione: "Una prova di Mentale + Tecnologia. Il contatto con la tecnologia precuriana lascia il segno."
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Media }
        successo:
          titolo: Decifrato
          testo: |
            Trovi la posizione giusta per le dita e il tubo si accende con un
            ronzio basso che ti arriva nei denti. Sul muro davanti a te resta un
            segno bruciato.
          effetti: { decifrato.arma-a-impulsi: 1 }
        fallimento:
          titolo: Il reperto non risponde
          testo: |
            La fessura si illumina e si spegne, e per tutta la notte ti sembra di
            sentire il ronzio anche a occhi chiusi.
          effetti: { tormento: 1 }

  - id: decifrare-respiratore
    titolo: Decifrare il respiratore
    tipo: oggetto
    area: citta-bassa
    immagine: ambientazione/rovine-dei-precursori
    requisiti: [oggetto.respiratore >= 1, decifrato.respiratore == 0]
    sommario: "Capire come funziona un reperto dei Precursori."
    testo: |
      La maschera di lega grigia è più leggera di quanto sembri, e quando la
      avvicini al viso i bordi si muovono da soli per adattarsi.

      {natura Media} Dentro c'è un odore di pietra bagnata, lo stesso dei
      pozzi dopo la Marea. Chi l'ha fatta sapeva che cosa c'era da respirare
      là sotto.

    opzioni:
      - testo: "Studiare il reperto"
        reperto: respiratore
        descrizione: "Una prova di Mentale + Tecnologia. Il contatto con la tecnologia precuriana lascia il segno."
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Media }
        successo:
          titolo: Decifrato
          testo: |
            La maschera si chiude sul viso con un piccolo sospiro, e con questa
            addosso la Marea fa meno paura, anche se nel riflesso di una pozza la
            paura la fai tu.
          effetti: { decifrato.respiratore: 1 }
        fallimento:
          titolo: Il reperto non risponde
          testo: |
            La maschera ti si stringe addosso e per un momento non riesci a
            togliertela. Quando cede ti restano sulle guance due solchi rossi.
          effetti: { tormento: 1 }

  - id: decifrare-campo-di-forza
    titolo: Decifrare il campo di forza
    tipo: oggetto
    area: citta-bassa
    immagine: ambientazione/rovine-dei-precursori
    requisiti: [oggetto.campo-di-forza >= 1, decifrato.campo-di-forza == 0]
    sommario: "Capire come funziona un reperto dei Precursori."
    testo: |
      Il disco ha al centro un incavo grande come un pollice, consumato da
      un pollice venuto prima del tuo, e quando lo appoggi sul petto la
      pelle formicola.

      {rissa Facile} Una cosa che ferma i colpi ha sempre un lato da cui non
      li ferma, e varrebbe la pena di sapere quale.

      {origine allievo-di-torvessa} Temmerin te lo farebbe disegnare tre
      volte prima di lasciartelo toccare, e tu ce l'hai già sul petto.
    opzioni:
      - testo: "Studiare il reperto"
        reperto: campo-di-forza
        descrizione: "Una prova di Mentale + Tecnologia. Il contatto con la tecnologia precuriana lascia il segno."
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Media }
        successo:
          titolo: Decifrato
          testo: |
            Premi l'incavo e l'aria attorno a te si fa densa e luminosa, e i sassi
            che lanci contro il tuo braccio cadono a terra prima di toccarlo.
          effetti: { decifrato.campo-di-forza: 1 }
        fallimento:
          titolo: Il reperto non risponde
          testo: |
            Il disco si scalda fino a scottare e si spegne, e il formicolio ti
            resta nelle dita fino a sera.
          effetti: { tormento: 1 }

  - id: decifrare-visore
    titolo: Decifrare il visore
    tipo: oggetto
    area: citta-bassa
    immagine: ambientazione/rovine-dei-precursori
    requisiti: [oggetto.visore >= 1, decifrato.visore == 0]
    sommario: "Capire come funziona un reperto dei Precursori."
    testo: |
      La lente è montata su un archetto che si aggancia dietro un orecchio
      più alto del tuo. Attraverso il cristallo le cose sembrano più vicine,
      e un poco in anticipo.

      {percezione Media} Una goccia cade dalla grondaia. La vedi staccarsi, e
      poi la vedi staccarsi di nuovo.
    opzioni:
      - testo: "Studiare il reperto"
        reperto: visore
        descrizione: "Una prova di Mentale + Tecnologia. Il contatto con la tecnologia precuriana lascia il segno."
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Media }
        successo:
          titolo: Decifrato
          testo: |
            Impari a guardare attraverso la lente con l'altro occhio socchiuso, e
            il gatto sul muretto lo vedi muoversi un attimo prima che si muova.
          effetti: { decifrato.visore: 1 }
        fallimento:
          titolo: Il reperto non risponde
          testo: |
            Guardi troppo a lungo attraverso la lente e ti gira la testa, e mangi
            la cena con il sospetto di averla già mangiata.
          effetti: { tormento: 1 }
