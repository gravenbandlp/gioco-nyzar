# Luoghi di allenamento di base: azioni ripetibili, una sola abilità per opzione, prova Molto facile.
# Portano un'abilità al massimo a 2 (requisito <= 1); oltre servono le storie vere.

storylet:
  - id: il-cortile-dei-due-mastini
    presso: fucina-dei-due-mastini
    immagine: ambientazione/fucina-dei-due-mastini
    titolo: Il cortile dei Due Mastini
    sommario: "Dietro la fucina i garzoni di Bram Halgast tirano di scherma con lame spuntate, e chi vuole può mettersi in fila."
    luogo: Fucina dei Due Mastini
    area: citta-bassa
    ripetibile: true
    testo: |
      Dietro la Fucina dei Due Mastini c'è un cortile di terra battuta
      chiuso da un muro a secco, dove Bram Halgast butta le scorie e lascia
      che i garzoni tirino di scherma a fine turno. Le lame sono spuntate e
      dentellate dai colpi, e una ha il filo smussato con tanta cura che
      ormai taglia meno di un cucchiaio. Al centro c'è un palo fasciato di
      cuoio, e qualcuno gli ha messo in testa un vecchio elmo da Custode
      ammaccato sulla fronte.

      Bram si affaccia dalla porta sul retro asciugandosi il cranio con uno
      straccio. «Chi si fa male se lo cura da solo, e chi mi rompe una lama
      me la paga» dice, e torna all'incudine. All'ingresso i due mastini
      rossi non alzano la testa nemmeno quando le lame sbattono. Dentro, il
      mantice della forgia si ferma ogni volta che un garzone esce a tirare
      di scherma, e Bram lo fa sapere a tutta la strada. Davanti alla
      bottega, intanto, la fila dei clienti si allunga, e in fondo qualcuno
      comincia già a spingere.
    opzioni:
      - testo: "Fare a pugni con i garzoni"
        descrizione: "Prima di prendere in mano il ferro i garzoni si scaldano a mani nude, e un avversario in più fa comodo."
        requisiti: [rissa <= 1]
        prova: { attributo: fisico, abilita: rissa, difficolta: "Molto facile" }
        successo:
          titolo: Nocche sbucciate
          testo: |
            Il garzone più grosso ti viene addosso con la testa bassa, e la
            prima volta finisci contro il muro a secco. La seconda ti sposti di
            mezzo passo e lo lasci passare, e mentre ti sfila davanti gli pianti
            un gomito sotto le costole. Lui si siede per terra a riprendere fiato
            e ti fa segno con la mano che per oggi basta così. Hai le nocche
            sbucciate e un sorriso stupido che non riesci a toglierti di faccia.
        fallimento:
          titolo: Il muro a secco
          testo: |
            Il garzone più grosso ti viene addosso con la testa bassa e tu,
            invece di spostarti, provi a fermarlo. Finisci contro il muro a
            secco con una pietra piantata fra le scapole e la bocca piena di
            polvere. Lui ti tende la mano per rialzarti e ti chiede, con sincero
            interesse, se sei sicuro di voler continuare.
          effetti: { ferite: 0.5 }

      - testo: "Prendere una lama spuntata"
        descrizione: "Una lama dentellata e un garzone di fronte. Per chi è proprio alle prime armi c'è il palo con l'elmo."
        requisiti: [armi-da-mischia <= 1]
        prova: { attributo: fisico, abilita: armi-da-mischia, difficolta: "Molto facile" }
        successo:
          titolo: La guardia alta
          testo: |
            Il garzone contro cui ti mettono ha il polso svelto e ti colpisce
            due volte sul braccio prima che tu capisca da dove arriva. Alla
            terza tieni la guardia più alta, e la sua lama scivola sulla tua fino
            all'elsa. Bram passa con un secchio d'acqua e si ferma a guardare il
            tempo di un respiro. «Meno peggio di ieri» dice, anche se ieri non
            c'eri, e per lui è un complimento lungo.
        fallimento:
          titolo: Sul dorso della mano
          testo: |
            La lama è più pesante di come sembrava appesa al muro, e dopo una
            dozzina di parate il braccio comincia a scendere da solo. Il garzone
            se ne accorge e ti colpisce di piatto sul dorso della mano. Le dita
            si aprono da sole, e il dolore ti arriva mezzo respiro dopo, quando
            la lama è già nella polvere. Bram dalla porta ti dice di raccoglierla
            prima che ci pisci sopra un cane.
          effetti: { ferite: 0.5 }

      - testo: "Tenere a bada la fila"
        descrizione: "Davanti alla bottega c'è sempre qualcuno convinto che la sua spada da riparare sia più urgente delle altre."
        requisiti: [intimidire <= 1]
        prova: { attributo: sociale, abilita: intimidire, difficolta: "Molto facile" }
        successo:
          titolo: La fila tiene
          testo: |
            Un mercante con la scarsella gonfia prova a passare davanti a tutti
            agitando una spada spezzata. Ti metti fra lui e la porta senza dire
            niente, e quando alza la voce guardi i mastini e poi di nuovo lui,
            con calma. Il mercante torna al suo posto in fondo alla fila. A fine
            giornata Bram ti lancia una moneta senza ringraziarti, e la prendi al
            volo.
          effetti: { monete: 1 }
        fallimento:
          titolo: Il mercante passa
          testo: |
            Un mercante con la scarsella gonfia prova a passare davanti a tutti,
            e tu gli dici di rimettersi in fila con una voce che si incrina
            proprio sull'ultima parola. Lui ti guarda dall'alto in basso, ti
            sposta con due dita ed entra in bottega. Da dentro senti Bram che lo
            manda in un posto molto preciso, e subito dopo che ci manda anche te.

      - testo: "Reggere il mantice"
        descrizione: "Dentro la fucina il mantice va tirato senza fermarsi, nel caldo, finché Bram non dice basta."
        requisiti: [resistenza <= 1]
        prova: { attributo: fisico, abilita: resistenza, difficolta: "Molto facile" }
        successo:
          titolo: Il fuoco bianco
          testo: |
            Tiri il mantice a braccia tese mentre il fuoco passa dal rosso al
            giallo, e poi a un bianco che fa male guardare. Il sudore ti cola
            negli occhi e lo lasci colare. Quando Bram tira fuori il ferro e
            comincia a batterlo, ti accorgi che le spalle hanno smesso di
            protestare da un pezzo. «Domani torna» dice, e detto da lui è quasi
            un contratto.
        fallimento:
          titolo: Il mantice fermo
          testo: |
            Dopo un centinaio di colpi le braccia ti diventano di legno, e il
            mantice comincia a soffiare a strappi. Il fuoco cala proprio mentre
            Bram ci ha messo dentro una lama. Ti toglie le maniglie di mano
            senza una parola e le tira lui con un braccio solo, mentre con
            l'altro ti indica la porta sul retro e il secchio dell'acqua.

  - id: strigliare-alla-zanna-rotta
    presso: scuderie-della-zanna-rotta
    immagine: ambientazione/scuderie-della-zanna-rotta
    titolo: Strigliare alla Zanna Rotta
    sommario: "Dolovan Stroud ha più cavalli di nolo che mani, e paga in natura chi li striglia e li muove."
    luogo: Scuderie della Zanna Rotta
    area: citta-bassa
    ripetibile: true
    testo: |
      Le Scuderie della Zanna Rotta stanno oltre l'ultima fila di case della
      Città Bassa, e l'odore di fieno lo senti prima di vedere il portone.
      Sull'insegna il cavallo da guerra calpesta ancora il suo orco tagliato
      in due, e dopo la razzia qualcuno ci ha aggiunto con la vernice rossa
      una seconda testa d'orco più piccola, disegnata decisamente peggio.

      Dopo la razzia mezza città vuole un cavallo per andarsene e l'altra
      metà per inseguire qualcuno, e Dolovan Stroud non ha abbastanza mani. Ti
      squadra dagli stivali in su mentre Squash gli tiene il muso appoggiato
      sulla spalla. «Soldi non ne ho da darti» dice. «Ho del pane, e ho dei
      cavalli da muovere che ti insegneranno più di quanto ti meriti. Se uno
      ti morde vuol dire che aveva ragione lui.»

      Nel recinto aspettano tre cavalli di nolo con la sella addosso, e nei
      box le spazzole sono ancora dove le ha lasciate l'ultimo garzone. Alla
      trave della selleria seccano mazzi di erbe che Dolovan raccoglie da
      sé, e quando gli chiedi dove alza le spalle.
    opzioni:
      - testo: "Muovere i cavalli di nolo nel recinto"
        descrizione: "Giri al passo e al trotto su cavalli che hanno visto troppi cavalieri e non ne stimano nessuno."
        requisiti: [cavalcare <= 1]
        prova: { attributo: fisico, abilita: cavalcare, difficolta: "Molto facile" }
        successo:
          titolo: Il trotto del grigio
          testo: |
            Ti tocca un grigio vecchio e testardo che al trotto si ricorda di
            colpo di essere stato giovane. Al terzo giro smetti di aggrapparti
            alla criniera e cominci a seguirlo con le reni, e il grigio, offeso,
            rallenta da solo. Dolovan dalla staccionata alza appena il mento. A
            fine giornata ti mette in mano mezza pagnotta e un pezzo di formaggio
            duro, e lo mangi seduto sul secchio rovesciato.
        fallimento:
          titolo: Nel fieno
          testo: |
            Il grigio parte al trotto prima che tu abbia trovato la staffa, e
            dopo mezzo giro decide che il recinto gli piace di più senza di te.
            Atterri di schiena sul mucchio di fieno, che per fortuna sta lì
            apposta. Dolovan va a riprendere il cavallo, gli controlla le zampe
            una per una e solo alla fine si gira a chiederti se sei vivo.

      - testo: "Strigliare e governare i cavalli"
        descrizione: "Spazzole da passare e zoccoli da pulire, con animali che decidono loro quando è il momento."
        requisiti: [addestrare-animali <= 1]
        prova: { attributo: sociale, abilita: addestrare-animali, difficolta: "Molto facile" }
        successo:
          titolo: Lo zoccolo alzato
          testo: |
            Cominci da un baio dal muso lungo, che ti annusa la manica a
            lungo prima di concederti il collo. Passi la brusca a
            cerchi lenti e intanto gli parli a voce bassa di niente, e quando gli
            tocchi il garretto alza lo zoccolo da solo e te lo appoggia sul
            ginocchio. Dolovan passa con un secchio e se ne accorge. «Con me ci
            ha messo un mese» dice.
        fallimento:
          titolo: La manica
          testo: |
            La giumenta nel box in fondo ti lascia arrivare fino alla spalla, poi
            gira la testa e ti chiude i denti sulla manica, con calma, senza
            stringere troppo. Quando la molla la stoffa è bagnata e strappata.
            Dolovan guarda la manica e poi la giumenta, e le gratta la fronte.
            «Te l'avevo detto che aveva ragione lei» dice.

      - testo: "Imparare le erbe e le tracce"
        descrizione: "Dolovan ti mostra quali erbe vanno nella biada e quali no, e poi ti fa leggere il fango del recinto."
        requisiti: [natura <= 1]
        prova: { attributo: mentale, abilita: natura, difficolta: "Molto facile" }
        successo:
          titolo: Il ferro storto
          testo: |
            Dolovan ti mette in mano tre mazzetti di erbe secche e aspetta.
            Riconosci dall'odore di anice quella che calma la pancia ai cavalli,
            e lui annuisce appena. Poi ti porta nel recinto a leggere il fango, e
            fra le impronte ne trovi una che trascina di lato, come se il ferro
            fosse storto. Dolovan va a prendere il grigio e gli alza lo zoccolo,
            e il ferro è proprio quello.
        fallimento:
          titolo: L'erba sbagliata
          testo: |
            Fra i tre mazzetti scegli quello che ha l'odore migliore. Dolovan te
            lo toglie di mano prima che tu lo metta nella biada e lo riappende
            alla trave, più in alto. «Questo lo dai ai cavalli che ti stanno
            antipatici» dice. Nel recinto, poi, scambi le impronte di Squash per
            quelle di un mulo, e Squash se ne offende per tutto il pomeriggio.

  - id: i-ragazzi-dell-orlo
    presso: orlo-dei-rottami
    immagine: ambientazione/orlo-dei-rottami
    titolo: I ragazzi dell'Orlo
    sommario: "Fra i mucchi di rottami i figli degli spazzini giocano all'ombra, e sanno di ogni vicolo chi lo comanda."
    luogo: Orlo dei Rottami
    area: citta-bassa
    ripetibile: true
    testo: |
      Nel primo pomeriggio, quando gli spazzini si siedono sotto le lamiere a
      dividersi il pane, all'Orlo dei Rottami comandano i loro figli. Sono
      una mezza dozzina, scalzi sulla terra battuta che scotta, con le
      ginocchia nere di ruggine e un capo di otto o nove anni che porta al
      collo un ingranaggio precuriano appeso a uno spago. Giocano all'ombra,
      un gioco in cui si sparisce fra i mucchi di rottami prima che chi conta
      arrivi a dieci, e poi si resta spariti il più a lungo possibile.

      Quando ti avvicini smettono di giocare e ti guardano tutti insieme. Il
      capo ti chiede se sei della Gilda, poi se sei degli Scuri, e alla fine,
      deluso, se hai almeno qualcosa da mangiare. *Ti ha appena fatto
      l'interrogatorio, e l'ha fatto meglio di una guardia.* Dalla riva
      arriva il cigolio della carriola rossa con la solita strofa, e quando
      lo spazzino la lascia per sedersi all'ombra i ragazzi se la prendono in
      prestito senza chiedere. Dietro le baracche ci sono le lamiere
      accatastate, dove si gioca a non toccare terra.
    opzioni:
      - testo: "Giocare all'ombra"
        descrizione: "Sparire fra i mucchi di rottami prima che il capo arrivi a dieci, e restare sparito."
        requisiti: [furtivita <= 1]
        prova: { attributo: fisico, abilita: furtivita, difficolta: "Molto facile" }
        successo:
          titolo: Fino a dieci
          testo: |
            Ti infili sotto una lamiera piegata ad arco, tiri dentro i piedi e
            trattieni il fiato mentre il capo conta a voce alta, e un po' troppo
            in fretta. Ti passa due volte a un braccio di distanza. Alla fine i
            ragazzi si arrendono e ti chiamano, e quando sbuchi fuori il capo ti
            guarda con un rispetto offeso e ti avverte che la prossima volta
            conta fino a cinque.
        fallimento:
          titolo: Il gomito
          testo: |
            Trovi un buon nascondiglio dietro una cassa sfondata, ma il gomito
            ti sporge di lato e urta una lastra di lamiera, che suona come una
            campana. Il capo non arriva nemmeno a tre. I ragazzi ti tirano fuori
            per le caviglie ridendo, e per il resto del pomeriggio a contare
            tocca a te, visto che in quello sei più bravo.

      - testo: "Farti spiegare chi comanda dove"
        descrizione: "In cambio di un po' di attenzione i ragazzi ti disegnano la Città Bassa per terra, con un chiodo."
        requisiti: [conoscenze-della-strada <= 1]
        prova: { attributo: sociale, abilita: conoscenze-della-strada, difficolta: "Molto facile" }
        successo:
          titolo: La mappa nella polvere
          testo: |
            Il capo traccia la Città Bassa nella terra battuta con un chiodo
            storto e ci mette sopra dei sassi, uno per ogni padrone di vicolo.
            Ti spiega quali strade sono degli Scuri e in quali la Guardia passa
            solo di giorno, e sempre in coppia. Sulla Pignatta Grassa mette tre
            sassi uno sopra l'altro. Devi ricordarti tutto in fretta, perché
            appena ha finito la mappa la cancella con il piede.
          effetti: { informazioni.voce: 1 }
        fallimento:
          titolo: Chi paga e chi no
          testo: |
            Il capo ti ascolta e ti chiede che cosa gli dai in cambio. Quando gli
            offri soltanto la tua gratitudine, ti spiega con molta pazienza che
            la Città Bassa è divisa fra chi paga e chi no. Poi disegna nella terra
            un vicolo solo, quello in cui siete adesso, e ci mette sopra un sasso per dire
            che questo è suo e che per oggi la lezione finisce qui.

      - testo: "Fare la corsa con la carriola rossa"
        descrizione: "Un giro dei mucchi spingendo la carriola dello spazzino, prima che lui si svegli."
        requisiti: [atletica <= 1]
        prova: { attributo: fisico, abilita: atletica, difficolta: "Molto facile" }
        successo:
          titolo: Il giro dei mucchi
          testo: |
            Il capo dà il via battendo due pezzi di ferro, e parti spingendo la
            carriola con le ginocchia basse e il fiato già corto alla prima
            curva. Il ragazzino che ti corre accanto bara tagliando dietro un
            mucchio, ma arrivi lo stesso alla lamiera del traguardo con mezza
            ruota di vantaggio. Ti tremano le gambe, e all'ombra lo spazzino
            continua a russare.
        fallimento:
          titolo: La ruota
          testo: |
            Alla seconda curva la ruota della carriola trova un bullone, e la
            carriola si gira di lato portandosi dietro anche te. Finisci lungo
            disteso nella polvere con il manico piantato nello stomaco. Quando
            rialzi la testa i ragazzi sono già all'arrivo, e lo spazzino dei
            tatuaggi è sveglio e ti guarda, con la carriola rovesciata fra voi
            due.

      - testo: "Saltare fra le lamiere"
        descrizione: "Sulle lamiere accatastate si gioca a non toccare terra, e chi la tocca resta fuori."
        requisiti: [acrobazia <= 1]
        prova: { attributo: fisico, abilita: acrobazia, difficolta: "Molto facile" }
        successo:
          titolo: Senza toccare terra
          testo: |
            Salti da una lamiera all'altra dietro al capo, che sceglie apposta
            quelle che si piegano sotto i piedi. Su una ti senti scivolare, e
            invece di frenare ti butti in avanti e atterri in ginocchio sulla
            successiva. Alla fine del giro sei ancora in gioco, con le ginocchia
            graffiate, e il capo ti guarda come se lo avessi tradito.
        fallimento:
          titolo: Per terra
          testo: |
            La terza lamiera è più storta di come sembrava e ti si piega sotto il
            piede. Scendi a terra con tutte e due le scarpe e una caviglia che
            protesta, e i ragazzi ti dichiarano fuori in coro. Ti siedi su una
            cassa a guardarli, e per tutto il pomeriggio nessuno di loro tocca
            terra nemmeno una volta.

  - id: la-tenda-del-velo
    immagine: fazioni/confraternita-del-velo
    titolo: La tenda del Velo
    sommario: "In uno slargo della Città Bassa i monaci della Confraternita curano i feriti poveri, e due mani in più non le rifiutano."
    luogo: La tenda del Velo
    area: citta-bassa
    ripetibile: true
    testo: |
      In uno slargo della Città Bassa, dove prima della razzia si teneva il
      mercato delle capre, la Confraternita del Velo ha piantato una tenda di
      tela grigia con il simbolo dell'Albero cucito sopra l'ingresso. Dentro
      ci sono una ventina di pagliericci, quasi tutti occupati da gente che
      alla Cattedrale non salirebbe mai, o che non saprebbe come arrivarci. I
      primi erano feriti della razzia, e da allora la tenda non si è più
      svuotata. Si respira aceto, e sotto l'aceto l'odore delle bende bollite.

      Due monaci con la veste arrotolata ai gomiti passano fra le file. Uno
      dei due tiene appesa alla cintura una tazza sbeccata che usa sia per il
      brodo sia per misurare l'aceto, e quando ti vede fermo sulla soglia ti
      mette in mano una bacinella prima ancora di sapere chi sei. «Se hai
      stomaco resta» dice, già voltato verso il pagliericcio successivo. «Se
      non ce l'hai resta lo stesso e porta l'acqua.»

      In fondo alla tenda, dietro una coperta appesa a una corda, un
      Raschiatore con la febbre alta parla da solo da ieri notte.
    opzioni:
      - testo: "Pulire e fasciare le ferite"
        descrizione: "Bende bollite e aceto, con un monaco che ti guarda le mani mentre lavori."
        requisiti: [medicina <= 1]
        prova: { attributo: mentale, abilita: medicina, difficolta: "Molto facile" }
        successo:
          titolo: Una fasciatura che tiene
          testo: |
            Il monaco ti affida un Raschiatore con un taglio lungo
            sull'avambraccio cucito da poco e già sporco. Lavi la ferita con l'aceto
            mentre lui bestemmia a mezza voce contro l'Albero e poi gli chiede
            scusa, e la fasci stretta senza fermare il sangue. Il monaco controlla
            il nodo, lo tira con due dita e passa oltre senza dire niente, che qui
            dentro vale come una lode.
        fallimento:
          titolo: Il piede freddo
          testo: |
            Fasci la gamba di un'anziana bruciata da un tizzone, e ci metti tanto
            impegno che stringi più del dovuto. Dopo un'ora il piede le diventa
            freddo. Il monaco scioglie la benda, la rifà in metà del tempo e ti
            spiega con pazienza dove hai sbagliato, mentre l'anziana ti guarda
            come si guarda il nipote che ha rotto il vaso buono.

      - testo: "Sederti accanto a chi non dorme"
        descrizione: "Fra i pagliericci c'è chi ha bisogno più di qualcuno vicino che di una benda."
        requisiti: [empatia <= 1]
        prova: { attributo: sociale, abilita: empatia, difficolta: "Molto facile" }
        successo:
          titolo: Il nome del cane
          testo: |
            Accanto al palo centrale c'è un uomo con le mani fasciate che fissa
            la tela del soffitto. Ti siedi e aspetti, e dopo un po' comincia a
            parlarti del suo cane, che la notte della razzia è scappato verso i
            Ponti e non è più tornato. Ti dice come si chiama e ti chiede di
            chiamarlo, se mai lo vedi. Intanto, senza accorgersene, ti racconta
            da quale vicolo ha visto arrivare gli orchi.
          effetti: { informazioni.voce: 1 }
        fallimento:
          titolo: Dall'altra parte
          testo: |
            Ti siedi accanto a una donna con la testa fasciata e le chiedi come
            sta, la domanda che le fanno tutti. Lei ti guarda a lungo e poi si
            gira dall'altra parte. Resti lì ancora un po', con le mani sulle
            ginocchia e la sensazione di aver parlato troppo forte, finché il
            monaco ti tocca la spalla e ti manda a prendere l'acqua.

      - testo: "Vegliare il ferito che delira"
        descrizione: "Dietro la coperta un Raschiatore con la febbre parla con gente che non c'è, e qualcuno deve restare sveglio con lui."
        requisiti: [resilienza <= 1]
        prova: { attributo: mentale, abilita: resilienza, difficolta: "Molto facile" }
        successo:
          titolo: Fino al mattino
          testo: |
            Per metà della notte il Raschiatore ti scambia per suo fratello, e
            per l'altra metà per qualcosa che sale dal Labirinto. Gli tieni il
            panno bagnato sulla fronte e rispondi a tutti e due con la stessa
            voce bassa, anche quando le cose che dice ti si attaccano addosso.
            Verso l'alba la febbre scende e lui si addormenta, e ti accorgi di
            avere ancora il panno in mano.
        fallimento:
          titolo: La porta sbagliata
          testo: |
            Il Raschiatore parla per ore di una porta in fondo al Labirinto che
            si apre dalla parte sbagliata, e a forza di ascoltarlo cominci a
            vederla anche tu, ogni volta che chiudi gli occhi. Verso mezzanotte
            esci a respirare e non rientri più. Il monaco prende il tuo posto
            senza farti domande, e sulla soglia ti lascia la tazza sbeccata piena
            di brodo.

  - id: il-banco-dei-conti
    presso: mercato-dei-nodi
    immagine: ambientazione/mercato-dei-nodi
    titolo: Il banco dei conti
    sommario: "Al Mercato dei Nodi un vecchio mercante della Gilda cerca qualcuno che gli tenga i conti e gli stia al banco."
    luogo: Mercato dei Nodi
    area: ponti-sospesi
    ripetibile: true
    testo: |
      Sulla piattaforma più ventosa del Mercato dei Nodi, fra un venditore di
      lanterne e uno di corde, c'è un banco di stoffe tinte che appartiene a
      un mercante della Gilda vecchio quasi quanto i ponti. Porta il
      distintivo della Gilda appuntato al cappello, e sul banco tiene un
      pallottoliere di legno a cui mancano tre palline, sostituite con tre
      bottoni di osso. Sotto il banco tiene una bilancina da orafo per le
      monete limate, che dopo la razzia girano più del solito.

      Il nipote che gli teneva il banco si è arruolato in Caserma dopo la
      razzia, e da allora il vecchio fa da solo, e si vede. «Mi servono due
      occhi giovani per i conti e una lingua svelta per le stoffe» dice, e ti
      spinge davanti il registro prima che tu abbia detto di sì. «Nei giorni
      morti c'è anche il gioco dei tre nodi, che con i passanti rende più
      delle stoffe. I borseggi li ho già messi in conto, quindi bada a non
      contarli due volte.»
    opzioni:
      - testo: "Tenere i conti del banco"
        descrizione: "Il registro, il pallottoliere con i bottoni e le tariffe della Gilda, che cambiano più spesso del vento."
        requisiti: [politica-ed-economia <= 1]
        prova: { attributo: mentale, abilita: politica-ed-economia, difficolta: "Molto facile" }
        successo:
          titolo: I conti tornano
          testo: |
            Passi il pomeriggio chino sul registro, con il vento che ti gira le
            pagine ogni volta che alzi la mano. Trovi un errore di tre settimane
            prima, una gabella pagata due volte, e quando lo fai vedere al vecchio
            lui si toglie il cappello per guardarlo meglio. Ti lascia qualche moneta
            sul registro. Poi ci ripensa, e ne riprende una per la gabella.
          effetti: { monete: 1 }
        fallimento:
          titolo: Il bottone
          testo: |
            Fra le palline e i bottoni del pallottoliere perdi il conto due volte,
            e la terza ti accorgi che stavi contando un bottone come se valesse
            dieci. Il vecchio ti riprende il registro senza arrabbiarsi e rifà la
            somma a mente, muovendo le labbra. Dice che all'inizio anche suo
            nipote contava i bottoni, e che adesso fa la guardia in Caserma.

      - testo: "Stare al banco e vendere"
        descrizione: "Stoffe tinte da vendere a gente che dopo la razzia ha appena ricominciato a comprare."
        requisiti: [persuasione <= 1]
        prova: { attributo: sociale, abilita: persuasione, difficolta: "Molto facile" }
        successo:
          titolo: Due braccia di blu
          testo: |
            Una donna dei sottoponti tocca un taglio di stoffa blu e fa per
            andarsene. Le parli del colore che regge al sole e della trama fitta
            che ferma il vento, e lei torna indietro a toccarla di nuovo. Alla
            fine ne compra due braccia per le tende nuove, quelle che metterà al
            posto delle vecchie bruciate. Il vecchio ti allunga qualche spicciolo di
            commissione da sotto il banco.
          effetti: { monete: 1 }
        fallimento:
          titolo: La corda accanto
          testo: |
            Parli tanto e troppo in fretta, e il cliente, un Raschiatore con le
            mani ancora grigie di polvere, ti ascolta fino in fondo con molta
            attenzione. Poi ti chiede quanto costa la corda del banco accanto, e
            va a comprarla lì.

      - testo: "Fare il gioco dei tre nodi"
        descrizione: "Una perlina nascosta in uno di tre nodi di corda, e passanti convinti di avere le mani più svelte delle tue."
        requisiti: [ingannare <= 1]
        prova: { attributo: sociale, abilita: ingannare, difficolta: "Molto facile" }
        successo:
          titolo: La perlina sparita
          testo: |
            Sposti i tre nodi sul banco con le dita che all'inizio sudano e poi
            si scaldano, e lasci vincere il primo passante perché gli altri si
            fermino a guardare. Il secondo punta sul nodo di mezzo convinto di
            aver capito il trucco, e lo trova vuoto. A sera il vecchio conta
            l'incasso e ti dà la tua parte, pochi spiccioli, dicendo che il resto è
            per l'insegnamento.
          effetti: { monete: 1 }
        fallimento:
          titolo: Un passante più svelto
          testo: |
            Un ragazzo con un berretto sfondato vince tre volte di fila, e alla
            terza ti accorgi che ti guarda le mani da quando hai cominciato.
            Quando provi a cambiare ritmo lui ha già raccolto la vincita e si è
            perso fra la folla del ponte. Il vecchio sospira e scrive la perdita
            nella colonna dei borseggi, poi ti ripassa i nodi.

      - testo: "Controllare le monete"
        descrizione: "Dopo la razzia girano monete limate sui bordi, e la bilancina da orafo è lenta."
        requisiti: [percezione <= 1]
        prova: { attributo: mentale, abilita: percezione, difficolta: "Molto facile" }
        successo:
          titolo: Il bordo lucido
          testo: |
            Passi le monete fra le dita una per una, e una ti resta in mano più
            liscia delle altre. Contro la luce vedi che il bordo è troppo
            lucido, perché qualcuno l'ha limato da poco con molta pazienza. La bilancina, quando la provi,
            ti dà ragione. Il vecchio la mette in un vasetto dove ce ne sono già
            una dozzina, e ti regala la prima moneta buona che entra nella cassa.
          effetti: { monete: 1 }
        fallimento:
          titolo: Tutte uguali
          testo: |
            Le monete ti sembrano tutte uguali e le fai passare tutte. A sera il
            vecchio le pesa una alla volta sulla bilancina e ne mette da parte
            due, limate sul bordo con tanta pazienza che sembrano nuove. Poi ti
            fa vedere come tenerle controluce, inclinate, perché il bordo limato
            si riconosce dal riflesso prima che dal peso.

      - testo: "Servire un cliente della Gilda"
        descrizione: "Un funzionario della Gilda che vuole essere chiamato col suo titolo, e si offende per molto meno."
        requisiti: [galateo <= 1]
        prova: { attributo: sociale, abilita: galateo, difficolta: "Molto facile" }
        successo:
          titolo: Il titolo giusto
          testo: |
            Il funzionario si presenta con un titolo lungo una riga, e tu glielo
            restituisci intero con un mezzo inchino, senza sbagliare una parola.
            Gli mostri le stoffe migliori senza toccarle per primo, e lasci che
            sia lui a scoprire quella che gli piace. Se ne va con un taglio di
            velluto e l'impressione di averlo scelto da solo. Il vecchio, quando
            è lontano, ti allunga una mancia da sotto il banco.
          effetti: { monete: 1 }
        fallimento:
          titolo: Il titolo sbagliato
          testo: |
            Chiami il funzionario «signore» invece che con il suo titolo, e lui
            si irrigidisce come se gli avessi pestato un piede. Da quel momento
            ogni stoffa che gli mostri è troppo ruvida o troppo cara, e alla
            fine se ne va senza comprare niente. Il vecchio aspetta che sia
            sparito oltre le bancarelle prima di confessarti che quel titolo lo
            sbaglia apposta da vent'anni.

  - id: il-poligono-dei-custodi
    presso: ponte-delle-mille-corde
    immagine: ambientazione/ponti-sospesi
    titolo: Il poligono dei Custodi
    sommario: "Sotto il Ponte delle Mille Corde i Custodi di Passaggio tirano di balestra su sagome appese sopra il vuoto. Per pochi spiccioli tira anche chi passa."
    luogo: Sotto il Ponte delle Mille Corde
    area: ponti-sospesi
    ripetibile: true
    testo: |
      Sotto il Ponte delle Mille Corde, su una piattaforma di servizio a cui
      si scende da una scala a pioli, i Custodi di Passaggio si allenano con
      le balestre. Le sagome sono fantocci di paglia appesi a funi tese sopra
      la Cicatrice, e a ogni raffica ondeggiano avanti e indietro come
      biancheria stesa. I dardi che li mancano finiscono nel vuoto, dove col
      tempo arrivano anche quelli che li prendono, perché nessuno ha voglia di
      sporgersi a recuperarli.

      Il Custode di turno è un uomo largo con il cappello della Gilda calcato
      fin sulle sopracciglia. Tiene una cassetta di latta per le monete e,
      accanto, una lavagnetta su cui segna i dardi persi. Dopo la razzia i
      Custodi hanno cominciato a tirare due volte al giorno, e la lavagnetta
      non basta più. «Pochi spiccioli per cinque dardi. Se cadi giù il dardo te lo
      vai a riprendere da solo» dice, e ti porge la balestra dal calcio.
    opzioni:
      - testo: "Pagare e tirare"
        descrizione: "Cinque dardi contro un fantoccio di paglia che il vento sposta quando vuole."
        requisiti: [armi-da-distanza <= 1, monete >= 1]
        prova: { attributo: fisico, abilita: armi-da-distanza, difficolta: "Molto facile" }
        successo:
          titolo: Due nel vuoto
          testo: |
            Il primo dardo se lo porta via il vento, e il secondo anche. Poi
            capisci che conviene tirare quando il fantoccio arriva in fondo
            all'oscillazione e resta fermo per un battito, e il terzo gli entra
            nella pancia con un rumore di sacco. Ne pianti altri due nello stesso
            punto. Il Custode segna sulla lavagnetta due dardi persi invece di
            cinque, e per lui è già una bella giornata.
          effetti: { monete: -1 }
        fallimento:
          titolo: Cinque nel vuoto
          testo: |
            Prendi la mira con cura, e proprio quando sei pronto una raffica
            sposta il fantoccio di lato. Il dardo sparisce nella Cicatrice senza
            fare rumore, e i quattro dopo lo seguono. Il Custode fa cinque segni
            sulla lavagnetta e ti chiede se vuoi riprovare domani, quando magari
            il vento ti sarà più simpatico.
          effetti: { monete: -1 }

  - id: il-banco-di-ambrin
    presso: mercato-dei-nodi
    immagine: ambientazione/nodo-d-ossidiana
    titolo: I cassetti di Ambrin
    sommario: "Nel retrobottega del Nodo d'Ossidiana un mobile a cento cassetti aspetta qualcuno che ci metta ordine."
    luogo: Il Nodo d'Ossidiana
    area: ponti-sospesi
    ripetibile: true
    testo: |
      Nel retrobottega del Nodo d'Ossidiana c'è un mobile a cassetti alto
      fino alle travi, con un centinaio di cassetti piccoli e una sola
      scaletta. Ambrin Qell ne apre uno a caso e te lo mostra con lo stesso
      entusiasmo che riserva ai clienti, anche se dentro ci sono soltanto
      tre denti di animale e un congegno di ottone grande come una noce. Le
      etichette sui cassetti le ha scritte lui anni fa, e metà sono
      sbiadite.

      «Quello che sta sugli scaffali lo conosco pezzo per pezzo» dice, e si
      scosta dalla fronte una ciocca rossa. «Questi li ho comprati a sacchi
      dai Raschiatori dopo la razzia, e non ho ancora avuto il tempo di
      presentarmi. Se mi dai una mano ti do la paga di un apprendista e in
      più la mia gratitudine, che vale anche meno.» Il corvo è sceso dal bancone e si
      è appollaiato sulla scaletta. Ogni volta che apri un cassetto ci guarda
      dentro prima di te.
    opzioni:
      - testo: "Rifare le etichette"
        descrizione: "Riconoscere che cosa c'è in un cassetto e scriverlo in modo che fra un anno lo capisca ancora qualcuno."
        requisiti: [accademiche <= 1]
        prova: { attributo: mentale, abilita: accademiche, difficolta: "Molto facile" }
        successo:
          titolo: Etichette nuove
          testo: |
            Lavori fino a sera con la penna di Ambrin, che a ogni riga graffia
            la carta e perde una goccia d'inchiostro. Riconosci un sigillo di cera del Casato
            Tarvelin vecchio di vent'anni e una manciata di gettoni di
            ceramica che i Raschiatori portano su dal Labirinto, e li scrivi con
            la grafia più chiara che hai. Ambrin legge le etichette nuove ad alta
            voce, una per una, come se aprisse dei regali, e ti paga qualche spicciolo.
          effetti: { monete: 1 }
        fallimento:
          titolo: Un cassetto più in là
          testo: |
            Scrivi venti etichette prima di accorgerti che ne hai sbagliata una,
            e che da lì in poi hai spostato tutto di un cassetto. Ambrin trova i
            denti di animale sotto la voce *monete antiche* e ride così forte che
            il corvo si alza in volo. Poi ti presta un'altra penna e ti fa
            ricominciare dal fondo.

      - testo: "Guardare i congegni rotti"
        descrizione: "In fondo ai cassetti ci sono ingranaggi e molle che forse si muovono ancora, se sai dove toccare."
        requisiti: [tecnologia <= 1]
        prova: { attributo: mentale, abilita: tecnologia, difficolta: "Molto facile" }
        successo:
          titolo: La noce di ottone
          testo: |
            Il congegno di ottone ha una vite bloccata dalla ruggine. La sblocchi
            con la punta del coltello e una goccia d'olio, e dentro trovi una
            molla avvolta stretta che si distende con un ronzio sottile. Il
            congegno comincia a ticchettare, e Ambrin si china così vicino che ti
            sfiora la spalla con i capelli. Nemmeno lui sa a cosa serva, e lo
            dice con evidente soddisfazione.
        fallimento:
          titolo: La molla
          testo: |
            Il congegno di ottone ha una vite bloccata dalla ruggine. Forzi
            troppo con la punta del coltello e la vite salta via, mentre dal
            congegno esce una molla che ti passa accanto all'orecchio. Ambrin la
            raccoglie da terra con due dita e la rimette nel cassetto con
            affetto, sotto un'etichetta nuova su cui scrive *forse*.

  - id: una-canzone-al-grifone
    presso: grifone-di-ferro
    immagine: personaggi/liaren-tarvelin
    titolo: Una canzone al Grifone
    sommario: "Quando la zuppa è finita Liaren tira fuori il samisen, e le serve qualcuno che tenga il ritmo o attacchi il ritornello."
    luogo: Locanda del Grifone di Ferro
    area: ponti-sospesi
    ripetibile: true
    # Liaren con pista.acciaio da 1 a 4 è sparita e a 5 è a letto ferita (citta/grifone.yaml): la scena salta quei passi.
    requisiti: [conosci.liaren >= 1, pista.acciaio != 1, pista.acciaio != 2, pista.acciaio != 3, pista.acciaio != 4, pista.acciaio != 5]
    testo: |
      Certe sere, quando la sala è piena e la zuppa è finita, Liaren tira
      fuori il samisen e suona le canzoni dei Raschiatori, quelle con il
      ritornello che sanno tutti e che nessuno canta a tempo. Dopo la razzia
      le suona più spesso e più forte. Il tamburo che teneva il ritmo si è
      sfondato quella notte, quando qualcuno l'ha usato per tenere chiusa una
      finestra, e adesso sta appeso sopra il camino con la pelle rotta e un
      nastro nero legato al bordo.

      Liaren ti vede entrare e ti punta contro il plettro. «Tu, sì. Mi serve
      qualcuno che batta il tempo sul bancone senza perderlo al secondo
      boccale, oppure che attacchi il ritornello abbastanza forte da
      trascinarsi dietro la sala» dice. Brunella ti mette davanti un
      cucchiaio di legno, nel caso tu scelga il bancone, e senti le orecchie
      scaldarsi prima ancora di aver deciso.
    opzioni:
      - testo: "Battere il tempo sul bancone"
        descrizione: "Un cucchiaio di legno sul bancone, e il piede di Liaren da seguire."
        requisiti: [espressivita <= 1]
        prova: { attributo: sociale, abilita: espressivita, difficolta: "Molto facile" }
        successo:
          titolo: Il cucchiaio di Brunella
          testo: |
            Batti il cucchiaio sul bancone seguendo il piede di Liaren, che tiene
            il tempo sotto il tavolo. Alla seconda canzone smetti di guardarle il
            piede e lo senti arrivare dal legno, e alla terza un Raschiatore
            comincia a battere il boccale con te. Liaren ti fa l'occhiolino sopra
            il manico del samisen. A fine serata Brunella si riprende il
            cucchiaio e ti lascia una scodella di zuppa.
        fallimento:
          titolo: Fuori tempo
          testo: |
            Al secondo ritornello il cucchiaio va per conto suo, e la sala, che
            segue te invece di seguire Liaren, si sfalda in tre ritmi diversi.
            Liaren smette di suonare, e quando la sala si è zittita ti toglie il
            cucchiaio con molta gentilezza. «Per stasera lo tengo io, va bene?»
            dice, e ricomincia dall'inizio.

      - testo: "Cantare il ritornello"
        descrizione: "Il ritornello lo sanno tutti. Basta qualcuno che lo attacchi per primo, e forte."
        requisiti: [espressivita <= 1]
        prova: { attributo: sociale, abilita: espressivita, difficolta: "Molto facile" }
        successo:
          titolo: Tutta la sala
          testo: |
            Attacchi il ritornello un attimo prima di sentirtene capace, con una
            voce che esce più rauca di come la ricordavi. Al secondo verso ti
            viene dietro il tavolo dei Raschiatori, e al terzo la sala intera,
            Brunella compresa con il mestolo in mano. Per il resto della sera
            qualcuno ti batte la mano sulla spalla ogni volta che passa, e Liaren
            ti offre mezza pinta.
        fallimento:
          titolo: La canzone sbagliata
          testo: |
            Attacchi il ritornello con sicurezza, ed è quello di un'altra
            canzone. Per un paio di versi la sala prova a seguirti per
            gentilezza, poi un Raschiatore scoppia a ridere e dietro di lui
            ridono tutti. Liaren ride più forte di tutti e intanto cambia
            canzone, passando a quella che stavi cantando tu, così che alla fine
            hai ragione tu.
