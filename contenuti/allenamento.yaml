# Luoghi di allenamento di base: azioni ripetibili, una sola abilità per opzione, prova Molto facile.
# Portano un'abilità al massimo a 2 (requisito <= 1); oltre servono le storie vere.

storylet:
  - id: il-cortile-dei-due-mastini
    presso: fucina-dei-due-mastini
    immagine: ambientazione/fucina-dei-due-mastini
    titolo: Il cortile dei Due Mastini
    sommario: "Dietro la fucina i garzoni di Bram Halgast tirano con lame spuntate, e chi vuole si mette in fila."
    luogo: Fucina dei Due Mastini
    area: citta-bassa
    ripetibile: true
    testo: |
      Nel cortile dietro la Fucina dei Due Mastini i garzoni di Bram Halgast tirano
      di scherma con lame spuntate intorno a un palo fasciato di cuoio, che porta in
      testa un elmo da Custode.

      Bram si affaccia dal retro con uno straccio sul cranio. «Chi si fa male se lo
      cura da solo, e chi mi rompe una lama me la paga» dice, e torna al mantice.
      Davanti alla bottega intanto si allunga la fila dei clienti.

      {origine fuggiasco-di-ghoran} Con un uomo che dà ordini dalla porta conti i
      passi fino all'uscita, come nei recinti di Ghoran.
    opzioni:
      - testo: "Fare a pugni con i garzoni"
        descrizione: "Prima del ferro i garzoni si scaldano a mani nude, e un avversario in più fa comodo."
        requisiti: [rissa <= 1]
        prova: { attributo: fisico, abilita: rissa, difficolta: "Molto facile" }
        successo:
          titolo: Nocche sbucciate
          testo: |
            Il garzone più grosso ti viene addosso a testa bassa e la prima volta ti
            manda contro il muro a secco. La seconda ti sposti di mezzo passo e gli
            pianti un gomito sotto le costole, e lui si siede per terra facendoti
            segno che per oggi basta così. Ti restano le nocche sbucciate e un
            sorriso stupido che non riesci a toglierti.
        fallimento:
          titolo: Il muro a secco
          testo: |
            Il garzone più grosso ti viene addosso a testa bassa e tu, invece di spostarti, provi a fermarlo. Finisci
            contro il muro a secco con la bocca piena di polvere di scorie, e lui ti tende la mano chiedendoti, con
            sincero interesse, se sei sicuro di voler continuare.
          effetti: { ferite: 0.5 }

      - testo: "Prendere una lama spuntata"
        descrizione: "Una lama dentellata e un garzone di fronte, o il palo con l'elmo per chi è alle prime armi."
        requisiti: [armi-da-mischia <= 1]
        prova: { attributo: fisico, abilita: armi-da-mischia, difficolta: "Molto facile" }
        successo:
          titolo: La guardia alta
          testo: |
            Il garzone che ti mettono contro ti colpisce due volte sul braccio
            prima che tu capisca da dove arriva, ma alla terza tieni la guardia
            più alta e la sua lama scivola sulla tua fino all'elsa. «Meno peggio
            di ieri» dice Bram passando con un secchio, anche se ieri non c'eri, e
            per lui è un complimento lungo.
        fallimento:
          titolo: Sul dorso della mano
          testo: |
            Dopo una dozzina di parate la lama pesa il doppio e il braccio scende da solo. Il garzone ti
            colpisce di piatto sul dorso della mano, le dita si aprono e la lama finisce nella polvere,
            mentre Bram dalla porta ti dice di raccoglierla prima che ci pisci sopra un cane.
          effetti: { ferite: 0.5 }

      - testo: "Tenere a bada la fila"
        descrizione: "Davanti alla bottega c'è sempre qualcuno convinto che la sua spada da riparare sia più urgente delle altre."
        requisiti: [intimidire <= 1]
        prova: { attributo: sociale, abilita: intimidire, difficolta: "Molto facile" }
        successo:
          titolo: La fila tiene
          testo: |
            Un mercante con la scarsella gonfia prova a passare davanti a tutti
            agitando una spada spezzata. Ti metti fra lui e la porta e guardi i
            mastini, poi di nuovo lui, finché non torna in fondo alla fila. A fine
            giornata Bram ti lancia una moneta senza ringraziarti.
          effetti: { monete: 1 }
        fallimento:
          titolo: Il mercante passa
          testo: |
            Dici al mercante con la scarsella gonfia di rimettersi in fila, e la
            voce ti si incrina sull'ultima parola. Lui ti sposta con due dita ed
            entra in bottega, e da dentro senti Bram che lo manda in un posto
            molto preciso, e subito dopo ci manda anche te.

      - testo: "Reggere il mantice"
        descrizione: "Dentro la fucina il mantice va tirato senza fermarsi, nel caldo, finché Bram non dice basta."
        requisiti: [resistenza <= 1]
        prova: { attributo: fisico, abilita: resistenza, difficolta: "Molto facile" }
        successo:
          titolo: Il fuoco bianco
          testo: |
            Tiri il mantice a braccia tese mentre il fuoco passa dal rosso a un
            bianco che fa male guardare, con il sudore che ti cola negli occhi.
            Quando Bram comincia a battere il ferro, le spalle hanno smesso di
            protestare da un pezzo. «Domani torna» dice, e detto da lui è quasi un
            contratto.
        fallimento:
          titolo: Il mantice fermo
          testo: |
            Dopo un centinaio di colpi le braccia ti diventano di legno e il mantice soffia a strappi, proprio
            mentre Bram ha messo una lama nel fuoco. Ti toglie le maniglie di mano senza una parola e con l'altro
            braccio ti indica il secchio dell'acqua.

  - id: strigliare-alla-zanna-rotta
    presso: scuderie-della-zanna-rotta
    immagine: ambientazione/scuderie-della-zanna-rotta
    titolo: Strigliare alla Zanna Rotta
    sommario: "Dolovan Stroud ha più cavalli di nolo che mani, e paga in natura chi li striglia e li muove."
    luogo: Scuderie della Zanna Rotta
    area: citta-bassa
    ripetibile: true
    testo: |
      Dopo la razzia, alle Scuderie della Zanna Rotta oltre l'ultima fila di
      case, mezza città vuole un cavallo per andarsene e l'altra metà per
      inseguire qualcuno.

      Dolovan Stroud ti squadra mentre Squash gli tiene il muso sulla spalla.
      «Soldi non ne ho da darti, solo pane» dice. Nel recinto aspettano tre
      cavalli di nolo sellati, e alla trave della selleria seccano le erbe che
      raccoglie da sé.

      {origine figlio-del-circolo} Al Circolo le erbe si appendono così, a
      testa in giù e lontano dal fumo, come nel Bosco di Velthar.
    opzioni:
      - testo: "Muovere i cavalli di nolo nel recinto"
        descrizione: "Giri al passo e al trotto su cavalli che hanno visto troppi cavalieri e non ne stimano nessuno."
        requisiti: [cavalcare <= 1]
        prova: { attributo: fisico, abilita: cavalcare, difficolta: "Molto facile" }
        successo:
          titolo: Il trotto del grigio
          testo: |
            Ti tocca un grigio vecchio e testardo che al trotto si ricorda di
            colpo di essere stato giovane. Al terzo giro smetti di aggrapparti
            alla criniera e lo segui con le reni, e il grigio, offeso, rallenta da
            solo. A fine giornata Dolovan ti mette in mano mezza pagnotta e un
            pezzo di formaggio duro.
        fallimento:
          titolo: Nel fieno
          testo: |
            Il grigio parte al trotto prima che tu abbia trovato la staffa e dopo
            mezzo giro ti scarica sul mucchio di fieno, che per fortuna sta lì
            apposta. Dolovan va a riprendere il cavallo, gli controlla le zampe
            una per una e solo alla fine ti chiede se sei vivo.

      - testo: "Strigliare e governare i cavalli"
        descrizione: "Spazzole da passare e zoccoli da pulire, con animali che decidono loro quando è il momento."
        requisiti: [addestrare-animali <= 1]
        prova: { attributo: sociale, abilita: addestrare-animali, difficolta: "Molto facile" }
        successo:
          titolo: Lo zoccolo alzato
          testo: |
            Il baio dal muso lungo ti annusa la manica a lungo prima di concederti il collo. Passi la brusca a
            cerchi lenti parlandogli a voce bassa, e quando gli tocchi il garretto alza lo zoccolo da solo e
            te lo appoggia sul ginocchio. «Con me ci ha messo un mese» dice Dolovan, che passa con un secchio.
        fallimento:
          titolo: La manica
          testo: |
            La giumenta nel box in fondo ti lascia arrivare fino alla spalla, poi
            gira la testa e ti chiude i denti sulla manica, senza stringere
            troppo. Dolovan guarda la stoffa strappata e le gratta la fronte. «Te
            l'avevo detto che aveva ragione lei» dice.

      - testo: "Imparare le erbe e le tracce"
        descrizione: "Dolovan ti mostra quali erbe vanno nella biada, poi ti fa leggere il fango del recinto."
        requisiti: [natura <= 1]
        prova: { attributo: mentale, abilita: natura, difficolta: "Molto facile" }
        successo:
          titolo: Il ferro storto
          testo: |
            Dall'odore di anice riconosci l'erba che calma la pancia ai cavalli, e Dolovan annuisce
            appena, come se gli costasse. Nel fango del recinto trovi un'impronta che trascina di lato,
            e quando Dolovan alza lo zoccolo al grigio il ferro è proprio storto.
        fallimento:
          titolo: L'erba sbagliata
          testo: |
            Fra i tre mazzetti scegli quello che ha l'odore migliore, e Dolovan te
            lo toglie di mano prima che finisca nella biada. «Questo lo dai ai
            cavalli che ti stanno antipatici» dice. Nel recinto, poi, scambi le
            impronte di Squash per quelle di un mulo, e Squash ti volta la groppa
            per tutto il pomeriggio.

  - id: i-ragazzi-dell-orlo
    presso: orlo-dei-rottami
    immagine: ambientazione/orlo-dei-rottami
    titolo: I ragazzi dell'Orlo
    sommario: "Fra i mucchi di rottami i figli degli spazzini giocano all'ombra, e sanno di ogni vicolo chi lo comanda."
    luogo: Orlo dei Rottami
    area: citta-bassa
    ripetibile: true
    testo: |
      Mentre gli spazzini sonnecchiano sotto le lamiere, all'Orlo dei Rottami
      comandano i loro figli, mezza dozzina di ragazzi scalzi guidati da un
      capo di otto o nove anni con un ingranaggio precuriano appeso al collo.

      Il capo ti chiede se sei della Gilda, poi se sei degli Scuri e alla
      fine, deluso, se hai qualcosa da mangiare.

      {origine apprendista-raschiatore} Un ingranaggio così, sulle
      piattaforme, finirebbe nella sacca del turno, e il capo ci chiude sopra
      la mano.

      {origine figlio-della-citta-bassa} Alla sua età facevi le stesse
      domande nello stesso ordine a chiunque avesse le scarpe buone.
    opzioni:
      - testo: "Giocare all'ombra"
        descrizione: "Sparire fra i mucchi di rottami prima che il capo arrivi a dieci, e restare sparito."
        requisiti: [furtivita <= 1]
        prova: { attributo: fisico, abilita: furtivita, difficolta: "Molto facile" }
        successo:
          titolo: Fino a dieci
          testo: |
            Ti infili sotto una lamiera piegata ad arco e resti immobile, con l'odore di ruggine nel naso,
            mentre il capo conta troppo in fretta e ti passa due volte a un braccio di distanza. Quando
            sbuchi fuori ti guarda con un rispetto offeso e ti avverte che la prossima volta conta fino a
            cinque.
        fallimento:
          titolo: Il gomito
          testo: |
            Il gomito ti sporge da dietro la cassa sfondata e urta una lastra di lamiera, che suona come
            una campana, e il capo non arriva nemmeno a tre. I ragazzi ti tirano fuori per le caviglie e
            per il resto del pomeriggio a contare tocca a te.

      - testo: "Farti spiegare chi comanda dove"
        descrizione: "In cambio di un po' di attenzione i ragazzi ti disegnano la Città Bassa per terra, con un chiodo."
        requisiti: [conoscenze-della-strada <= 1]
        prova: { attributo: sociale, abilita: conoscenze-della-strada, difficolta: "Molto facile" }
        successo:
          titolo: La mappa nella polvere
          testo: |
            Il capo traccia la Città Bassa nella terra con un chiodo storto e ci
            mette un sasso per ogni padrone di vicolo, spiegandoti quali strade
            sono degli Scuri e dove la Guardia passa solo di giorno. Sulla
            Pignatta Grassa mette tre sassi uno sopra l'altro, poi cancella tutto
            con il piede.

            {conoscenze-della-strada Media} Tre sassi uno sopra l'altro, fra i
            ragazzi dell'Orlo, vogliono dire che lì non si sgarra mai.
          effetti: { informazioni.voce: 1 }
        fallimento:
          titolo: Chi paga e chi no
          testo: |
            Il capo ti chiede che cosa gli dai in cambio, e quando offri soltanto
            la tua gratitudine ti spiega, come a un fratello piccolo, che la Città
            Bassa è divisa fra chi paga e chi no. Poi disegna nella terra un
            vicolo solo, quello in cui siete, e ci mette sopra un sasso per dire
            che è suo.

      - testo: "Fare la corsa con la carriola rossa"
        descrizione: "Un giro dei mucchi spingendo la carriola dello spazzino, prima che lui si svegli."
        requisiti: [atletica <= 1]
        prova: { attributo: fisico, abilita: atletica, difficolta: "Molto facile" }
        successo:
          titolo: Il giro dei mucchi
          testo: |
            Il capo dà il via battendo due pezzi di ferro e spingi la carriola a
            ginocchia basse. Il ragazzino accanto a te bara tagliando dietro un
            mucchio, ma arrivi lo stesso al traguardo con mezza ruota di
            vantaggio, mentre all'ombra lo spazzino continua a russare.
        fallimento:
          titolo: La ruota
          testo: |
            Alla seconda curva la ruota trova un bullone e la carriola si gira di
            lato portandosi dietro anche te. Quando rialzi la testa dalla polvere
            i ragazzi sono già all'arrivo, e lo spazzino dei tatuaggi è sveglio e
            ti guarda, senza nessuna fretta di dire qualcosa.

      - testo: "Saltare fra le lamiere"
        descrizione: "Sulle lamiere accatastate si gioca a non toccare terra, e chi la tocca resta fuori."
        requisiti: [acrobazia <= 1]
        prova: { attributo: fisico, abilita: acrobazia, difficolta: "Molto facile" }
        successo:
          titolo: Senza toccare terra
          testo: |
            Salti da una lamiera all'altra dietro al capo, che sceglie apposta quelle
            che si piegano. Su una scivoli, ti butti in avanti invece di frenare e
            atterri in ginocchio sulla successiva, e a fine giro sei ancora in gioco,
            con il capo che ti guarda come se lo avessi tradito.
        fallimento:
          titolo: Per terra
          testo: |
            La terza lamiera ti si piega sotto il piede e scendi a terra con tutte e due le
            scarpe e una caviglia che protesta. I ragazzi ti dichiarano fuori in coro, e
            dalla cassa dove ti siedi li guardi giocare per tutto il pomeriggio senza che
            nessuno tocchi terra.

  - id: la-tenda-del-velo
    immagine: fazioni/confraternita-del-velo
    titolo: La tenda del Velo
    sommario: "In uno slargo della Città Bassa i monaci del Velo curano i feriti poveri e accettano due mani in più."
    luogo: La tenda del Velo
    area: citta-bassa
    ripetibile: true
    testo: |
      In uno slargo la Confraternita del Velo ha piantato una tenda grigia con
      l'Albero cucito sull'ingresso, e la ventina di pagliericci là dentro,
      quasi tutti occupati, sa di bende bollite nell'aceto.

      Un monaco con una tazza sbeccata alla cintura ti mette in mano una
      bacinella prima ancora di sapere chi sei. «Se hai stomaco resta, se non ce
      l'hai porta l'acqua» dice. In fondo, dietro una coperta, un Raschiatore
      delira per la febbre da ieri notte.

      {origine accolito-del-velo} Le bende hanno l'odore della Cattedrale, e da
      come reggi la bacinella il monaco capisce da dove vieni.
    opzioni:
      - testo: "Pulire e fasciare le ferite"
        descrizione: "Bende bollite e aceto, con un monaco che ti guarda le mani mentre lavori."
        requisiti: [medicina <= 1]
        prova: { attributo: mentale, abilita: medicina, difficolta: "Molto facile" }
        successo:
          titolo: Una fasciatura che tiene
          testo: |
            Il monaco ti affida un Raschiatore con un taglio lungo sull'avambraccio, già
            sporco. Lavi la ferita con l'aceto mentre lui bestemmia contro l'Albero e poi
            chiede scusa guardando in alto, e la fasci stretta. Il monaco tira il nodo con
            due dita e passa oltre senza dire niente, che qui dentro vale come una lode.
        fallimento:
          titolo: Il piede freddo
          testo: |
            Fasci la gamba di un'anziana bruciata da un tizzone e stringi più del
            dovuto, e dopo un'ora il piede le diventa freddo. Il monaco rifà la
            benda in metà del tempo spiegandoti dove hai sbagliato, mentre
            l'anziana ti guarda come si guarda il nipote che ha rotto il vaso
            buono.

      - testo: "Sederti accanto a chi non dorme"
        descrizione: "Fra i pagliericci c'è chi ha bisogno più di qualcuno vicino che di una benda."
        requisiti: [empatia <= 1]
        prova: { attributo: sociale, abilita: empatia, difficolta: "Molto facile" }
        successo:
          titolo: Il nome del cane
          testo: |
            Accanto al palo centrale un uomo con le mani fasciate fissa la tela
            del soffitto. Ti siedi e aspetti, e dopo un po' ti parla del suo cane,
            scappato verso i Ponti la notte della razzia, e ti chiede di chiamarlo
            per nome se mai lo vedi. Intanto, senza accorgersene, ti racconta da
            quale vicolo ha visto arrivare gli orchi.
          effetti: { informazioni.voce: 1 }
        fallimento:
          titolo: Dall'altra parte
          testo: |
            Chiedi a una donna con la testa fasciata come sta, la domanda che le fanno tutti, e lei
            ti guarda a lungo senza rabbia prima di girarsi dall'altra parte. Resti lì con le mani
            sulle ginocchia finché il monaco ti tocca la spalla e ti manda a prendere l'acqua.

      - testo: "Vegliare il ferito che delira"
        descrizione: "Dietro la coperta un Raschiatore delira per la febbre, e qualcuno deve restare sveglio con lui."
        requisiti: [resilienza <= 1]
        prova: { attributo: mentale, abilita: resilienza, difficolta: "Molto facile" }
        successo:
          titolo: Fino al mattino
          testo: |
            Per metà della notte il Raschiatore ti scambia per suo fratello, e per
            l'altra metà per qualcosa che sale dal Labirinto. Gli tieni il panno
            bagnato sulla fronte e rispondi a tutti e due con la stessa voce
            bassa, finché verso l'alba la febbre scende e lui si addormenta.
        fallimento:
          titolo: La porta sbagliata
          testo: |
            Il Raschiatore parla per ore di una porta in fondo al Labirinto che si
            apre dalla parte sbagliata, e a forza di ascoltarlo la vedi anche tu
            quando chiudi gli occhi. Verso mezzanotte esci nel cortile e non
            rientri più, e il monaco, prendendo il tuo posto, ti lascia sulla
            soglia la tazza sbeccata piena di brodo.

  - id: il-banco-dei-conti
    presso: mercato-dei-nodi
    immagine: ambientazione/mercato-dei-nodi
    titolo: Il banco dei conti
    sommario: "Al Mercato dei Nodi un vecchio mercante della Gilda cerca qualcuno che gli tenga i conti e il banco."
    luogo: Mercato dei Nodi
    area: ponti-sospesi
    ripetibile: true
    testo: |
      Su una piattaforma del Mercato dei Nodi un vecchio mercante della
      Gilda vende stoffe, con un pallottoliere a cui mancano tre palline,
      rimpiazzate da bottoni di osso, e una bilancina da orafo per le monete
      limate.

      Ti spinge davanti il registro prima che tu dica di sì. «Mi servono due
      occhi giovani per i conti e una lingua svelta per le stoffe» dice.
      «Nei giorni morti c'è anche il gioco dei tre nodi.»

      {origine mercante-dei-ponti} La licenza della Gilda ce l'hai anche tu
      in tasca, e il vecchio lo capisce da come tocchi il registro.
    opzioni:
      - testo: "Tenere i conti del banco"
        descrizione: "Il registro, il pallottoliere con i bottoni e le tariffe della Gilda, che cambiano più spesso del vento."
        requisiti: [politica-ed-economia <= 1]
        prova: { attributo: mentale, abilita: politica-ed-economia, difficolta: "Molto facile" }
        successo:
          titolo: I conti tornano
          testo: |
            Passi il pomeriggio chino sul registro, con il vento che ti gira le
            pagine, e trovi una gabella pagata due volte tre settimane prima. Il
            vecchio si toglie il cappello per guardarla meglio, come se il
            distintivo gli coprisse la vista, e ti lascia qualche moneta sul
            registro, salvo riprenderne una per la gabella.
          effetti: { monete: 1 }
        fallimento:
          titolo: Il bottone
          testo: |
            Fra palline e bottoni perdi il conto due volte, e la terza ti accorgi
            che stavi contando un bottone come se valesse dieci. Il vecchio rifà
            la somma a mente muovendo le labbra e ti dice che anche suo nipote
            contava i bottoni, e che adesso fa la guardia in Caserma.

      - testo: "Stare al banco e vendere"
        descrizione: "Stoffe tinte da vendere a gente che dopo la razzia ha appena ricominciato a comprare."
        requisiti: [persuasione <= 1]
        prova: { attributo: sociale, abilita: persuasione, difficolta: "Molto facile" }
        successo:
          titolo: Due braccia di blu
          testo: |
            Una donna dei sottoponti tocca un taglio di stoffa blu e fa per
            andarsene, finché le parli del colore che regge al sole e della trama
            che ferma il vento. Ne compra due braccia per le tende nuove, e il
            vecchio ti allunga qualche spicciolo di commissione.
          effetti: { monete: 1 }
        fallimento:
          titolo: La corda accanto
          testo: |
            Parli troppo e troppo in fretta, con le mani che si agitano sopra le
            stoffe, e il Raschiatore che hai davanti ti ascolta fino in fondo. Poi
            ti chiede quanto costa la corda del banco accanto, e va a comprarla
            lì.

      - testo: "Fare il gioco dei tre nodi"
        descrizione: "Una perlina nascosta in uno di tre nodi di corda, e passanti convinti di avere le mani più svelte."
        requisiti: [ingannare <= 1]
        prova: { attributo: sociale, abilita: ingannare, difficolta: "Molto facile" }
        successo:
          titolo: La perlina sparita
          testo: |
            Lasci vincere il primo passante perché gli altri si fermino a
            guardare, e il secondo punta sul nodo di mezzo convinto di aver capito
            il trucco e lo trova vuoto. A sera il vecchio conta l'incasso e ti dà
            la tua parte, pochi spiccioli, dicendo che il resto è per
            l'insegnamento.
          effetti: { monete: 1 }
        fallimento:
          titolo: Un passante più svelto
          testo: |
            Un ragazzo con un berretto sfondato vince tre volte di fila, e alla
            terza ti accorgi che ti guarda le mani da quando hai cominciato. Prima
            che tu cambi ritmo si è già perso fra la folla del ponte, e il vecchio
            sospira e scrive la perdita nella colonna dei borseggi.

      - testo: "Controllare le monete"
        descrizione: "Dopo la razzia girano monete limate sui bordi, e la bilancina da orafo è lenta."
        requisiti: [percezione <= 1]
        prova: { attributo: mentale, abilita: percezione, difficolta: "Molto facile" }
        successo:
          titolo: Il bordo lucido
          testo: |
            Una moneta ti resta in mano più liscia delle altre, e contro la luce
            vedi il bordo troppo lucido di chi l'ha limata da poco, e la bilancina
            ti dà ragione. Il vecchio la mette in un vasetto dove ce ne sono già
            una dozzina, e ti regala la prima moneta buona che entra in cassa.
          effetti: { monete: 1 }
        fallimento:
          titolo: Tutte uguali
          testo: |
            Le monete ti sembrano tutte uguali e le fai passare tutte. A sera il
            vecchio le pesa sulla bilancina e ne mette da parte due, limate con
            tanta pazienza che sembrano nuove, poi ti insegna a tenerle
            controluce, inclinate, perché il bordo limato si vede dal riflesso
            prima che dal peso.

      - testo: "Servire un cliente della Gilda"
        descrizione: "Un funzionario della Gilda che vuole essere chiamato col suo titolo, e si offende per molto meno."
        requisiti: [galateo <= 1]
        prova: { attributo: sociale, abilita: galateo, difficolta: "Molto facile" }
        successo:
          titolo: Il titolo giusto
          testo: |
            Restituisci al funzionario il suo titolo intero, lungo una riga, con
            un mezzo inchino. Gli mostri le stoffe migliori senza toccarle per
            primo, e se ne va con un taglio di velluto e l'impressione di averlo
            scelto da solo. Il vecchio, quando è lontano, ti allunga una mancia da
            sotto il banco.
          effetti: { monete: 1 }
        fallimento:
          titolo: Il titolo sbagliato
          testo: |
            Chiami il funzionario «signore» invece che con il suo titolo, e da
            quel momento ogni stoffa che gli mostri è troppo ruvida o troppo cara.
            Se ne va senza comprare niente, e il vecchio aspetta che sia sparito
            per confessarti che quel titolo lo sbaglia apposta da vent'anni.

  - id: il-poligono-dei-custodi
    presso: ponte-delle-mille-corde
    immagine: ambientazione/ponti-sospesi
    titolo: Il poligono dei Custodi
    sommario: "Sotto il Ponte delle Mille Corde i Custodi tirano di balestra sopra il vuoto, e per pochi spiccioli tira chiunque."
    luogo: Sotto il Ponte delle Mille Corde
    area: ponti-sospesi
    ripetibile: true
    testo: |
      Sotto il Ponte delle Mille Corde i Custodi di Passaggio tirano con le
      balestre su fantocci appesi a funi tese sopra la Cicatrice, che a ogni
      raffica ondeggiano come biancheria stesa.

      Il Custode di turno, un uomo largo con il cappello sulle sopracciglia,
      segna i dardi persi su una lavagnetta. «Pochi spiccioli per cinque
      dardi, e se cadi giù il dardo te lo vai a riprendere da solo» dice,
      porgendoti la balestra dal calcio.

      {armi-da-distanza Facile} Il calcio è consumato da mille guance, e con
      questo vento si tira basso, aspettando la pausa fra due raffiche.
    opzioni:
      - testo: "Pagare e tirare"
        descrizione: "Cinque dardi contro un fantoccio di paglia che il vento sposta quando vuole."
        requisiti: [armi-da-distanza <= 1, monete >= 1]
        prova: { attributo: fisico, abilita: armi-da-distanza, difficolta: "Molto facile" }
        successo:
          titolo: Due nel vuoto
          testo: |
            I primi due dardi se li porta via il vento. Poi capisci che conviene tirare quando il fantoccio arriva in fondo all'oscillazione
            e resta fermo per un battito, e il terzo gli entra nella pancia con un rumore di sacco, seguito da altri due. Il Custode segna
            sulla lavagnetta due dardi persi invece di cinque.
          effetti: { monete: -1 }
        fallimento:
          titolo: Cinque nel vuoto
          testo: |
            Prendi la mira con cura, e proprio quando sei pronto una raffica
            sposta il fantoccio di lato. Il dardo sparisce nella Cicatrice senza
            rumore, e i quattro dopo lo seguono. Il Custode fa cinque segni sulla
            lavagnetta e ti chiede se vuoi riprovare domani, quando il vento ti
            sarà più simpatico.
          effetti: { monete: -1 }

  - id: il-banco-di-ambrin
    presso: mercato-dei-nodi
    immagine: ambientazione/nodo-d-ossidiana
    titolo: I cassetti di Ambrin
    sommario: "Nel retrobottega del Nodo d'Ossidiana un mobile a cento cassetti aspetta qualcuno che ci metta ordine."
    luogo: Il Nodo d'Ossidiana
    area: ponti-sospesi
    ripetibile: true
    testo: |
      Nel retrobottega del Nodo d'Ossidiana c'è un mobile con un centinaio
      di cassetti dalle etichette sbiadite. Ambrin Qell ne apre uno, e
      dentro ci sono tre denti di animale e un congegno di ottone grande
      come una noce.

      «Li ho presi a sacchi dai Raschiatori dopo la razzia e mai aperti»
      dice. «Ti do la paga di un apprendista e la mia gratitudine, che vale
      anche meno.» Il corvo guarda in ogni cassetto prima di te.

      {origine allievo-di-torvessa} Quel congegno l'hai visto disegnato su
      una tavola dell'Accademia, e le dita ti vanno da sole al cassetto.
    opzioni:
      - testo: "Rifare le etichette"
        descrizione: "Riconoscere che cosa c'è in un cassetto e scriverlo in modo che fra un anno lo capisca ancora qualcuno."
        requisiti: [accademiche <= 1]
        prova: { attributo: mentale, abilita: accademiche, difficolta: "Molto facile" }
        successo:
          titolo: Etichette nuove
          testo: |
            Lavori fino a sera con le dita blu d'inchiostro, e riconosci un
            sigillo di cera del Casato Tarvelin vecchio di vent'anni e una
            manciata di gettoni di ceramica del Labirinto. Ambrin legge le
            etichette nuove ad alta voce come se aprisse dei regali, e ti paga
            qualche spicciolo.
          effetti: { monete: 1 }
        fallimento:
          titolo: Un cassetto più in là
          testo: |
            Scrivi venti etichette prima di accorgerti di aver spostato tutto di
            un cassetto. Ambrin trova i denti di animale sotto la voce *monete
            antiche* e ride così forte che il corvo va a offendersi su una trave,
            poi ti presta un'altra penna e ti fa ricominciare dal fondo.

      - testo: "Guardare i congegni rotti"
        descrizione: "In fondo ai cassetti ci sono ingranaggi e molle che forse si muovono ancora, se sai dove toccare."
        requisiti: [tecnologia <= 1]
        prova: { attributo: mentale, abilita: tecnologia, difficolta: "Molto facile" }
        successo:
          titolo: La noce di ottone
          testo: |
            Sblocchi la vite arrugginita del congegno di ottone con la punta del
            coltello e una goccia d'olio, e dentro una molla si distende con un ronzio
            sottile. Il congegno comincia a ticchettare e Ambrin si china ad ascoltarlo
            accanto a te senza una parola. Nemmeno lui sa a cosa serva, e lo dice con
            evidente soddisfazione.
        fallimento:
          titolo: La molla
          testo: |
            Forzi troppo la vite arrugginita del congegno di ottone, e ne esce una
            molla che ti passa accanto all'orecchio con un sibilo da vespa. Ambrin
            la raccoglie con due dita e la rimette nel cassetto con affetto, sotto
            un'etichetta nuova su cui scrive *forse*.

  - id: una-canzone-al-grifone
    presso: grifone-di-ferro
    immagine: personaggi/liaren-tarvelin
    titolo: Una canzone al Grifone
    sommario: "A zuppa finita Liaren suona il samisen, e cerca qualcuno che tenga il ritmo o attacchi il ritornello."
    luogo: Locanda del Grifone di Ferro
    area: ponti-sospesi
    ripetibile: true
    # Liaren con pista.acciaio da 1 a 4 è sparita e a 5 è a letto ferita (citta/grifone.yaml): la scena salta quei passi.
    requisiti: [conosci.liaren >= 1, pista.acciaio != 1, pista.acciaio != 2, pista.acciaio != 3, pista.acciaio != 4, pista.acciaio != 5]
    testo: |
      Certe sere, finita la zuppa, Liaren tira fuori il samisen e suona le
      canzoni dei Raschiatori, quelle con il ritornello che sanno tutti e
      nessuno canta a tempo. Il tamburo che teneva il ritmo si è sfondato la
      notte della razzia, e adesso sta appeso sopra il camino con un nastro
      nero.

      Liaren ti punta contro il plettro. «Tu, sì. Mi serve qualcuno che batta
      il tempo sul bancone, oppure che attacchi il ritornello abbastanza
      forte da trascinarsi dietro la sala» dice. Brunella ti mette davanti un
      cucchiaio di legno, nel caso tu scelga il bancone.
    opzioni:
      - testo: "Battere il tempo sul bancone"
        descrizione: "Un cucchiaio di legno sul bancone, e il piede di Liaren da seguire."
        requisiti: [espressivita <= 1]
        prova: { attributo: sociale, abilita: espressivita, difficolta: "Molto facile" }
        successo:
          titolo: Il cucchiaio di Brunella
          testo: |
            Batti il cucchiaio seguendo il piede di Liaren sotto il tavolo, e alla
            seconda canzone lo senti arrivare dal legno senza guardarlo, mentre un
            Raschiatore comincia a battere il boccale con te. A fine serata
            Brunella si riprende il cucchiaio, ne controlla il manico come se
            potessi averlo consumato, e ti lascia una scodella di zuppa.
        fallimento:
          titolo: Fuori tempo
          testo: |
            Al secondo ritornello il cucchiaio va per conto suo, e la sala, che
            segue te invece di Liaren, si sfalda in tre ritmi diversi. Liaren
            smette di suonare e ti toglie il cucchiaio con molta gentilezza. «Per
            stasera lo tengo io, va bene?» dice, e ricomincia dall'inizio.

      - testo: "Cantare il ritornello"
        descrizione: "Il ritornello lo sanno tutti. Basta qualcuno che lo attacchi per primo, e forte."
        requisiti: [espressivita <= 1]
        prova: { attributo: sociale, abilita: espressivita, difficolta: "Molto facile" }
        successo:
          titolo: Tutta la sala
          testo: |
            Attacchi il ritornello con una voce più rauca di come la ricordavi, e
            al secondo verso ti viene dietro il tavolo dei Raschiatori e al terzo
            la sala intera. Per il resto della sera qualcuno ti batte la mano
            sulla spalla ogni volta che passa.
        fallimento:
          titolo: La canzone sbagliata
          testo: |
            Attacchi il ritornello con sicurezza, ed è quello di un'altra canzone.
            La sala prova a seguirti per gentilezza finché un Raschiatore scoppia
            a ridere, e Liaren, ridendo più forte di tutti, passa alla canzone che
            stavi cantando tu, così che alla fine hai ragione tu.
