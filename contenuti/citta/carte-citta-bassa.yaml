# Città Bassa, carte del mazzo (seconda parte): la vita del quartiere, la catena di Fosco Ambri e due carte che
# arrivano tardi. Il resto del mazzo sta in aree/citta-bassa.yaml e nei file dei luoghi e delle piste.
#
# CARTE SINGOLE
#   carta-il-forno-sulla-crepa     una volta sola (visto). Agata Sorre cuoce il pane su una fenditura e la Gilda
#                                  vuole la tassa sul calore: politica-ed-economia, resistenza, dare ragione alla
#                                  Gilda (rep.gilda), tirare dritto.
#   carta-le-bottiglie-sul-muretto si ripete. Tiro alle bottiglie dietro la Locanda di Ilka: armi-da-distanza,
#                                  ingannare (il banco delle scommesse), restare a guardare (una voce).
#   carta-lo-scrivano-del-lavatoio una volta sola (visto). Ermes Calvi ha la mano fasciata e la fila aspetta:
#                                  espressivita, medicina, tirare dritto.
#
# FOSCO AMBRI, L'IMBIANCHINO DEI CIVICI (catena di tre carte)
#   fosco   0 non l'hai conosciuto, 1 ti ha raccontato della casa che manca, 2 hai la targa di smalto,
#           3 la targa è sul muretto del pollaio e hai il suo taccuino (oggetto taccuino-dei-civici).
#     carta-fosco-il-numero-sbagliato  fosco 0   galateo, dare ragione alla Mora, chiedere a Fosco → 1; tirare dritto.
#     carta-fosco-la-targa-di-smalto   fosco 1   percezione all'Orlo (fallendo resta 1), comprarla da Grusk → 2.
#     carta-fosco-la-casa-quattordici  fosco 2   furtivita (anche fallendo la targa va su, con scandalo),
#                                                persuasione (fallendo resta 2) → 3 e il taccuino.
#
# CARTE DI PIÙ AVANTI
#   carta-il-cerchio-di-gesso      pista.arena >= 5 e campione: i bambini giocano all'Arena e un ubriaco di
#                                  Ghoran ti sfida (intimidire). Una volta sola.
#   carta-vapore-nelle-cantine     pista.acciaio >= 8 e acciaieria.futuro >= 1: la fornace riaccesa scalda le
#                                  cantine di un vicolo (tecnologia). Una volta sola.
#
# Nomi nuovi, che il Codex non dà: Agata Sorre (fornaia), Ermes Calvi (scrivano del lavatoio), Fosco Ambri
# (imbianchino), la signora Mora (la vicina della quindici di Via del Salmone).
quality:
  - { id: fosco, nome: "Fosco Ambri e i civici", categoria: stato, nascosta: true, descrizione: "0 non l'hai ancora conosciuto, 1 ti ha raccontato della casa che manca, 2 hai la targa di smalto, 3 la targa è al suo posto." }
  - { id: visto.carta-il-forno-sulla-crepa, nome: Il forno di Agata Sorre, categoria: stato, nascosta: true }
  - { id: visto.carta-lo-scrivano-del-lavatoio, nome: La mano di Ermes Calvi, categoria: stato, nascosta: true }
  - { id: visto.carta-il-cerchio-di-gesso, nome: Il cerchio di gesso, categoria: stato, nascosta: true }
  - { id: visto.carta-vapore-nelle-cantine, nome: Il vapore nelle cantine, categoria: stato, nascosta: true }

oggetti:
  - id: taccuino-dei-civici
    nome: Taccuino dei civici
    immagine: icone/notebook
    descrizione: "Il quaderno di Fosco Ambri, con tutte le porte della Città Bassa e chi ci abita dietro, aggiornato a matita da trent'anni. La casa quattordici di Via del Salmone c'è ancora."
    slot: accessorio
    grado: 1
    proprieta: { talento: { conoscenze-della-strada: 1 } }

storylet:
  # ================================================================ carte singole
  - id: carta-il-forno-sulla-crepa
    immagine: icone/bread
    titolo: Il forno sulla crepa
    sommario: "Agata Sorre cuoce il pane su una fenditura del suo cortile, e la Gilda vuole la tassa sul calore."
    luogo: Città Bassa, un cortile dietro Via del Salmone
    tipo: carta
    area: citta-bassa
    requisiti: [visto.carta-il-forno-sulla-crepa == 0]
    testo: |
      In un cortile dietro Via del Salmone una fenditura corre da un muro
      all'altro, e sopra c'è il forno di Agata Sorre, una cassa di ferro che
      cuoce il pane per mezzo quartiere senza legna.

      Stamattina la fila è ferma, perché un ispettore della Gilda dei
      Mercanti legge da un foglio timbrato una tassa sul calore delle
      fenditure, da pagare a ogni infornata, e Agata lo ascolta a braccia
      incrociate mentre il pane sa già di bruciato.

      {origine mercante-dei-ponti} Di fogli della Gilda letti davanti al tuo
      banco ne hai sentiti parecchi, mai dalla parte della fila.
    opzioni:
      - testo: "Leggere il foglio dell'ispettore"
        descrizione: "In fondo a un foglio della Gilda c'è sempre una riga che dice il contrario della prima."
        prova: { attributo: mentale, abilita: politica-ed-economia, difficolta: Media }
        successo:
          titolo: Il selciato pubblico
          testo: |
            Chiedi il foglio, e l'ispettore te lo porge convinto che il timbro
            basti a farti tacere. La concessione parla delle fenditure *sotto il
            selciato pubblico*, e il cortile di Agata è della sua famiglia dai
            tempi del nonno, selciato compreso. Lo leggi ad alta voce, l'ispettore
            arrotola il foglio e se ne va, e i vicini in fila ti raccontano quello
            che sanno della Gilda in quartiere.
          pe: { politica-ed-economia: 4 }
          effetti: { informazioni.voce: 2, rep.gilda: -0.5 }
          imposta: { visto.carta-il-forno-sulla-crepa: 1 }
        fallimento:
          titolo: La riga sotto
          testo: |
            Trovi una riga che sembra fatta apposta e la leggi ad alta voce davanti
            a tutto il cortile, e l'ispettore ti indica con l'unghia quella subito
            sotto, che la annulla. Qualcuno nella fila ride. Agata paga contando le
            monete sul palmo una alla volta, senza staccare gli occhi da te, e
            intanto il pane nel forno è diventato nero.
          effetti: { scandalo: 1 }
          imposta: { visto.carta-il-forno-sulla-crepa: 1 }

      - testo: "Togliere il forno dalla crepa"
        descrizione: "Senza la cassa sopra la fenditura torna a essere una crepa nel cortile, ma la cassa scotta."
        prova: { attributo: fisico, abilita: resistenza, difficolta: Facile }
        successo:
          titolo: Le mani nel grembiule
          testo: |
            Ti avvolgi le mani nel grembiule che Agata ti lancia e afferri la
            cassa. Il ferro ti morde i palmi attraverso la tela, ma tieni duro fino
            al muretto, e sulla fenditura resta solo il segno della cassa.
            L'ispettore lo fissa a lungo e se ne va con il suo foglio, e Agata,
            rimesso il forno al suo posto, ti paga con quello che avrebbe dato alla
            Gilda.
          pe: { resistenza: 3 }
          effetti: { monete: 3 }
          imposta: { visto.carta-il-forno-sulla-crepa: 1 }
        fallimento:
          titolo: Il ferro
          testo: |
            Afferri la cassa a mani nude, prima che ti arrivi il grembiule di
            Agata, e il ferro ti brucia i palmi prima ancora che la testa capisca.
            La molli a metà strada, e la cassa si rovescia sulla fenditura con il
            pane dentro. L'ispettore segna qualcosa sul foglio e se ne va
            soddisfatto, mentre Agata ti fascia le mani con uno straccio infarinato
            senza dire una parola.
          effetti: { ferite: 0.5 }
          imposta: { visto.carta-il-forno-sulla-crepa: 1 }

      - testo: "Dare ragione alla Gilda"
        descrizione: "Una tassa scritta va pagata, e la Gilda si ricorda di chi lo dice in pubblico, come il cortile."
        esito:
          titolo: Il tuo nome sul foglio
          testo: |
            Dici a voce alta che una tassa scritta va pagata, anche quando è
            stupida. L'ispettore, grato, ti chiede come ti chiami e scrive il tuo
            nome in fondo al foglio, sotto il timbro, mentre Agata paga senza
            guardarti in faccia. Nei giorni dopo, quando ripassi dal cortile, i
            vicini sui gradini smettono di parlare e riprendono solo dopo che hai
            girato l'angolo.
          effetti: { rep.gilda: 0.5 }
          imposta: { visto.carta-il-forno-sulla-crepa: 1 }

      - testo: "Tirare dritto"
        descrizione: "Il pane è di Agata, e la tassa pure."
        costo: 0
        esito:
          titolo: Odore di bruciato
          testo: |
            Lasci il cortile mentre l'ispettore attacca il secondo foglio.
            All'angolo di Via del Salmone ti arriva ancora l'odore del pane
            bruciato, e dietro di te Agata conta le monete ad alta voce, perché le
            sentano tutti.
          imposta: { visto.carta-il-forno-sulla-crepa: 1 }

  - id: carta-le-bottiglie-sul-muretto
    immagine: icone/crossbow
    titolo: Le bottiglie sul muretto
    sommario: "Dietro la Locanda di Ilka miliziani fuori servizio e Raschiatori tirano con la balestra alle bottiglie vuote."
    luogo: Città Bassa, il cortile dietro la Locanda di Ilka
    tipo: carta
    area: citta-bassa
    testo: |
      Dietro la Locanda di Ilka il cortile finisce contro un muretto a secco,
      e oltre il muretto una fenditura manda su un tremolio d'aria calda. Sul
      muretto sono in fila le bottiglie vuote del sidro di Besk, e due
      miliziani fuori servizio e un paio di Raschiatori ci tirano a turno con
      una balestra da caccia legata al palo da una catenella, segnando le
      scommesse col gesso su un'asse. Il più vecchio dei Raschiatori ti tende
      la balestra dalla parte del calcio.

      {origine apprendista-raschiatore} Prima della faccia ti ha guardato le
      mani, e i calli della corda gli sono bastati.
    opzioni:
      - testo: "Tirare alle bottiglie"
        descrizione: "Il caldo della crepa sposta le bottiglie di un palmo, e bisogna mirare a dove saranno."
        prova: { attributo: fisico, abilita: armi-da-distanza, difficolta: Media }
        successo:
          titolo: Il vetro
          testo: |
            Guardi il tremolio dell'aria finché ne capisci il ritmo e tiri nel momento
            in cui l'onda si accorcia, mentre i miliziani sbuffano. La prima bottiglia
            salta in pezzi e poco dopo anche la seconda, e alla terza i miliziani hanno
            smesso di ridere. La posta sull'asse è tua, e il Raschiatore vecchio
            cancella il gesso con il palmo e ci scrive sopra il tuo nome, storto.
          pe: { armi-da-distanza: 4 }
          effetti: { monete: 5, rep.caserma: 0.5 }
        fallimento:
          titolo: La crepa
          testo: |
            Tiri dove vedi la bottiglia, e il dardo passa un palmo sopra il collo e
            sparisce nella fenditura con un tintinnio così lungo che i miliziani si
            mettono a contare ad alta voce. Il secondo fa lo stesso. Paghi la tua
            parte di posta, e un Raschiatore ti batte una mano sulla spalla e ti
            dice che la crepa si è mangiata balestrieri migliori di te.
          effetti: { monete: -2 }

      - testo: "Tenere il banco delle scommesse"
        descrizione: "Nessuno tiene più il conto delle poste, e chi tiene il banco, se è svelto, ci guadagna."
        prova: { attributo: sociale, abilita: ingannare, difficolta: Media }
        successo:
          titolo: Il gesso
          testo: |
            Prendi il gesso e ti metti dietro l'asse come se ci fossi nato. Paghi
            bene i tiri facili, su cui tutti scommettono contro, e male quelli
            difficili, e nessuno ha voglia di rifare i conti con il boccale in
            mano. A sera i miliziani se ne vanno convinti di averci guadagnato, e
            nella tua tasca è finito il grosso della posta.
          pe: { ingannare: 4 }
          effetti: { monete: 6 }
        fallimento:
          titolo: Il conto del Raschiatore
          testo: |
            Per un'ora va tutto liscio, abbastanza da farti sentire furbo. Poi il
            Raschiatore vecchio ti prende il gesso dalle dita e rifà i conti
            sull'asse davanti a tutti, con una calligrafia lenta da contabile. Ti
            tocca restituire la differenza con una mancia per il disturbo, mentre i
            miliziani raccontano la storia al tavolo accanto, ogni volta un po' più
            lunga.
          effetti: { monete: -3, scandalo: 1 }

      - testo: "Restare a guardare"
        descrizione: "Fra un tiro e l'altro i miliziani fuori servizio dicono più di quanto dovrebbero."
        esito:
          titolo: Fra un tiro e l'altro
          testo: |
            Ti siedi su un barile con un boccale di sidro e guardi le bottiglie
            saltare, o più spesso restare dove sono. I due miliziani si lamentano
            del sergente, che li manda di ronda in Via dei Rasoi proprio nelle sere
            di paga, e uno dei due dice anche a che ora passa la ronda, prima che
            l'altro gli dia una gomitata.
          effetti: { informazioni.voce: 1 }

  - id: carta-lo-scrivano-del-lavatoio
    immagine: icone/quill-ink
    titolo: Lo scrivano del lavatoio
    sommario: "Lo scrivano Ermes Calvi ha la mano destra fasciata, e la fila davanti al suo tavolino arriva alle vasche."
    luogo: Città Bassa, il lavatoio
    tipo: carta
    area: citta-bassa
    requisiti: [visto.carta-lo-scrivano-del-lavatoio == 0]
    testo: |
      Al lavatoio, sotto la tettoia di lamiera, mastro Ermes Calvi tiene da
      sempre un tavolino pieghevole con un calamaio, e scrive lettere per chi
      non sa scriverle, soprattutto ai mariti partiti per Laresh.

      Oggi ha la mano destra fasciata fino al polso, e con la sinistra sulla
      carta viene fuori un ragno. La fila arriva fino alle vasche, e una
      ragazza con un mazzetto di fiori di cardo ripete fra sé le frasi che
      vuole dettare.

      {origine figlio-della-citta-bassa} Il tavolino di Ermes stava sotto la
      tettoia già quando eri bambino, e lui sempre con la penna in mano.
    opzioni:
      - testo: "Scrivere sotto dettatura"
        descrizione: "La gente detta come parla, ma le lettere devono farsi leggere, ed Ermes ha una reputazione."
        prova: { attributo: sociale, abilita: espressivita, difficolta: Media }
        successo:
          titolo: La lettera della ragazza
          testo: |
            Ti siedi al posto di Ermes, che ti suggerisce le formule. La ragazza
            dei cardi scrive a un fonditore dell'Acciaieria che non le ha mai
            rivolto la parola, e trovi un modo di dirlo senza farla sembrare
            sciocca. Poi passano una lavandaia che reclama un debito e un vecchio
            che scrive al fratello a Tuarmir. A sera Ermes divide con te
            l'incasso, e tu conosci i fatti di mezza fila.
          pe: { espressivita: 4 }
          effetti: { monete: 3, informazioni.pettegolezzo: 1 }
          imposta: { visto.carta-lo-scrivano-del-lavatoio: 1 }
        fallimento:
          titolo: Caro
          testo: |
            Scrivi la prima lettera parola per parola come te la detta una
            lavandaia, e quando gliela rileggi lei diventa rossa fino alle
            orecchie. Avevi scritto *caro* dove lei aveva detto *Carlo*, e la
            lettera era per il padrone di casa. La fila ride per un buon quarto
            d'ora, ed Ermes ti riprende la penna dalla mano ridendo fino alle
            lacrime.
          effetti: { scandalo: 1, informazioni.voce: 1 }
          imposta: { visto.carta-lo-scrivano-del-lavatoio: 1 }

      - testo: "Guardargli la mano"
        descrizione: "La fasciatura è fatta male e in fretta, e forse sotto c'è meno danno di quanto creda Ermes."
        prova: { attributo: mentale, abilita: medicina, difficolta: Facile }
        successo:
          titolo: Una storta
          testo: |
            Sciogli la fasciatura e trovi il polso gonfio ma con le ossa al loro
            posto, perché il dolore viene da una benda così stretta che toglieva il
            sangue alle dita. Gliela rifai più morbida, con una stecca ricavata da
            un righello, ed Ermes muove le dita a una a una. Prima di sera
            ricomincia a scrivere, e per ringraziarti ti racconta chi ha scritto a
            chi nell'ultimo mese, e perché.
          pe: { medicina: 4 }
          effetti: { informazioni.voce: 2 }
          imposta: { visto.carta-lo-scrivano-del-lavatoio: 1 }
        fallimento:
          titolo: Più stretta
          testo: |
            Rifai la fasciatura da capo, convinto di sapere come si fa, finché
            Ermes impallidisce a metà del secondo giro e ti chiede con molta
            educazione di smettere. Una lavandaia ti prende la benda di mano e
            gliela rifà lei in un attimo, meglio di te, mentre la fila commenta.
          effetti: { scandalo: 0.5 }
          imposta: { visto.carta-lo-scrivano-del-lavatoio: 1 }

      - testo: "Tirare dritto"
        descrizione: "Le lettere degli altri restano degli altri."
        costo: 0
        esito:
          titolo: La fila
          testo: |
            Lasci il lavatoio con il rumore dei panni sbattuti sulla pietra alle
            spalle. Ermes prova ancora con la sinistra, e la ragazza dei cardi si è
            seduta sul bordo della vasca ad aspettare, con i fiori che le
            appassiscono in grembo.
          imposta: { visto.carta-lo-scrivano-del-lavatoio: 1 }

  # ================================================================ Fosco Ambri, l'imbianchino dei civici
  - id: carta-fosco-il-numero-sbagliato
    immagine: icone/paint-brush
    titolo: Il numero sbagliato
    sommario: "In Via del Salmone un vecchio imbianchino dipinge un numero civico, e la padrona di casa grida che è sbagliato."
    luogo: Città Bassa, Via del Salmone
    tipo: carta
    area: citta-bassa
    requisiti: [fosco == 0]
    testo: |
      In Via del Salmone un vecchio in cima a una scala a pioli dipinge di
      blu un quindici sulla porta di una casa, con un ricciolo all'insù in
      fondo al cinque.

      Sotto la scala una donna con un cesto di panni bagnati gli grida che
      quella è la quattordici da sempre, e che per colpa dei suoi numeri il
      riscossore della Gilda le ha chiesto la gabella due volte. «Quindici»
      dice il vecchio al pennello. «Il quattordici c'è già, signora Mora,
      anche se lei non lo vede.»

      {empatia Media} Lo dice con dolcezza, come si parla di un morto.
    opzioni:
      - testo: "Fare da paciere"
        descrizione: "In Città Bassa una lite sui numeri civici può durare una generazione, se nessuno la accorcia."
        prova: { attributo: sociale, abilita: galateo, difficolta: Facile }
        successo:
          titolo: Una sedia sulla soglia
          testo: |
            Parli alla signora Mora come a una padrona di casa dei Quartieri Alti, e la
            cortesia la disarma. Le prometti che parlerai tu al riscossore, e alla fine si
            siede sulla soglia e ti racconta mezzo vicinato. Il vecchio scende e ti tende una
            mano macchiata di blu. Si chiama Fosco Ambri, e se vuoi sapere perché sbaglia i
            numeri lo trovi nella cantina con la porta dipinta.
          pe: { galateo: 3 }
          effetti: { informazioni.voce: 1 }
          imposta: { fosco: 1 }
        fallimento:
          titolo: Il cesto
          testo: |
            Provi a mettere pace con un discorso che sembrava ragionevole finché
            non l'hai detto ad alta voce, e la signora Mora ti rovescia addosso
            mezzo cesto di panni bagnati e rientra sbattendo la porta. Dalla scala
            il vecchio ride fino a doversi tenere ai pioli, poi scende, si presenta
            come Fosco Ambri e ti invita nella sua cantina in fondo alla via, dove
            almeno ti asciughi.
          imposta: { fosco: 1 }
          effetti: { scandalo: 0.5 }

      - testo: "Dare ragione alla signora Mora"
        descrizione: "La casa è sua, e alla sua porta bussa il riscossore della Gilda."
        esito:
          titolo: Il coltello da cucina
          testo: |
            Tieni ferma la scala mentre il vecchio scende, offeso come un gatto
            bagnato, e la signora Mora ci sale lei a raschiare il quindici con un
            coltello da cucina, sporcandosi di blu fino al naso. Per ringraziarti
            ti mette in mano una focaccia tiepida e qualche moneta. «Fosco Ambri,
            in fondo a Via del Salmone» dice il vecchio prima di andarsene.
            «Quando vorrai sapere come si conta davvero.»
          effetti: { monete: 2 }
          imposta: { fosco: 1 }

      - testo: "Chiedere al vecchio perché sbaglia"
        descrizione: "Un imbianchino che sbaglia sempre di uno, e sempre nello stesso verso, di solito ha una ragione."
        esito:
          titolo: La casa che manca
          testo: |
            Aspetti che finisca il cinque e gli chiedi perché. «Fra la tredici e la
            casa della signora c'era un'altra casa, e io ci sono nato» dice,
            pulendo il pennello. «La Gilda l'ha buttata giù, e questo vuol dire
            soltanto che la contano loro e la conto io.» Si chiama Fosco Ambri, e
            il resto lo racconta nella sua cantina in fondo alla via.
          effetti: { informazioni.voce: 1 }
          imposta: { fosco: 1 }

      - testo: "Tirare dritto"
        descrizione: "In Città Bassa i numeri sbagliati sono più dei giusti, e nessuno si è mai perso per questo."
        costo: 0
        esito:
          titolo: Quindici
          testo: |
            Lasci la lite dietro di te. In fondo alla via ti volti, e la signora
            Mora è ancora sotto la scala, mentre il vecchio ripassa il ricciolo del
            cinque con una pazienza da miniatore e un ragazzino, sporco di blu fino
            ai gomiti, gli tiene il barattolo.

  - id: carta-fosco-la-targa-di-smalto
    immagine: icone/paint-brush
    titolo: La targa di smalto
    sommario: "Fosco Ambri ti aspetta nella sua cantina in fondo a Via del Salmone con una mappa vecchia da mostrarti."
    luogo: Città Bassa, la cantina di Fosco Ambri in Via del Salmone
    tipo: carta
    area: citta-bassa
    requisiti: [fosco == 1]
    testo: |
      La cantina di Fosco Ambri ha la porta dipinta di un colore per ogni
      asse, e sul tavolo è inchiodata una mappa della Città Bassa.

      Fosco mette il dito su una casetta fra la tredici e la casa della
      signora Mora, coperta da una croce rossa, e ti spiega che era casa sua
      finché un inverno la fenditura sotto si è allargata e la Gilda l'ha
      fatta buttare giù. «La targa di smalto con il quattordici è finita
      all'Orlo dei Rottami, e Grusk non butta niente che abbia una scritta.
      Con queste ginocchia, laggiù non ci scendo più.»
    opzioni:
      - testo: "Cercare la targa all'Orlo dei Rottami"
        descrizione: "Grusk tiene le cose con le scritte nelle casse sotto i teli, e le casse sono tante."
        prova: { attributo: mentale, abilita: percezione, difficolta: Media }
        successo:
          titolo: Il quattordici blu
          testo: |
            Passi il pomeriggio sulla spiaggia dei rottami a rovesciare casse di
            insegne, mentre Grusk ti dice *fuochino* senza sapere che cosa cerchi.
            La targa è in fondo a una cassa di lamiere smaltate, con il blu
            scrostato e il ricciolo all'insù che Fosco mette ai suoi numeri. Con
            lei ti resta in mano una scheggia di metallo strano, e Grusk ti fa
            segno di tenertela.
          pe: { percezione: 4 }
          effetti: { reliquie.scheggia: 1 }
          imposta: { fosco: 2 }
        fallimento:
          titolo: Lamiera
          testo: |
            Rovesci casse fino al tramonto e trovi quattro targhe con il
            quattordici, tutte del colore sbagliato. Mentre ne tiri fuori una da
            sotto un mucchio di lamiere ti apri il palmo su un bordo arrugginito, e
            Grusk ti fascia la mano con uno straccio che ha visto giorni migliori,
            promettendoti che terrà gli occhi aperti.
          effetti: { ferite: 0.5 }

      - testo: "Comprare la targa da Grusk"
        descrizione: "Grusk sa dov'è ogni cosa sulla sua spiaggia, e ogni cosa ha un prezzo, anche quelle che nessuno vorrebbe."
        requisiti: [monete >= 4]
        esito:
          titolo: Il prezzo di Grusk
          testo: |
            Grusk ti ascolta con le mani sui fianchi, poi va dritto a una cassa
            sotto un telo e tira fuori la targa di smalto blu senza nemmeno
            guardare. Te la vende per molto più di quanto valga, e tu paghi senza
            discutere, perché il prezzo l'ha deciso guardandoti in faccia.
          effetti: { monete: -4 }
          imposta: { fosco: 2 }

      - testo: "Dirgli di aspettare"
        descrizione: "Le ginocchia di Fosco aspettano da trent'anni, e possono aspettare ancora un po'."
        costo: 0
        esito:
          titolo: Un altro giorno
          testo: |
            Fosco arrotola la mappa senza commenti e ti accompagna alla porta,
            salendo i gradini con una mano sul ginocchio. Sulla soglia ti dice che
            le cantine, a differenza delle case, restano dove le hai lasciate.

  - id: carta-fosco-la-casa-quattordici
    immagine: icone/paint-brush
    titolo: La casa quattordici
    sommario: "La targa di Fosco Ambri può andare su un solo muro, quello del pollaio della signora Mora."
    luogo: Città Bassa, Via del Salmone, fra la tredici e la casa della signora Mora
    tipo: carta
    area: citta-bassa
    requisiti: [fosco == 2]
    testo: |
      Fosco tiene la targa sulle ginocchia a lungo, pulendo con il pollice lo
      smalto saltato, poi ti porta in Via del Salmone. Dove c'era casa sua
      c'è un pollaio con un muretto di sassi, e le galline razzolano sopra la
      fenditura, che d'inverno le tiene al caldo.

      «Il muretto è della Mora» dice Fosco, e ti porge il martello e due
      chiodi. «La terra sotto è ancora mia, qualunque cosa abbia scritto la
      Gilda.»

      {furtivita Media} Il muretto sta sotto tre finestre, ma di notte un
      martello avvolto in uno straccio si sente meno di una gallina sveglia.
    opzioni:
      - testo: "Inchiodarla di notte"
        descrizione: "Di notte il muretto è di chi ci pianta un chiodo, se le galline non si svegliano."
        prova: { attributo: fisico, abilita: furtivita, difficolta: Media }
        successo:
          titolo: Due chiodi
          testo: |
            Aspettate che si spenga l'ultima finestra, poi pianti i chiodi con il
            martello avvolto in uno straccio, mentre Fosco, rimasto sull'angolo,
            si soffia il naso più volte. La mattina dopo la signora Mora trova il
            quattordici sul pollaio, lo guarda a lungo e poi lo lucida con uno
            straccio. Fosco ti regala il suo taccuino, con tutte le porte del
            quartiere e chi ci abita dietro.
          pe: { furtivita: 4 }
          effetti: { oggetto.taccuino-dei-civici: 1 }
          imposta: { fosco: 3 }
        fallimento:
          titolo: Le galline
          testo: |
            Al primo colpo di martello le galline si svegliano e si accendono tre
            finestre. La signora Mora esce in camicia da notte con una scopa in
            mano, ma quando vede la targa abbassa la scopa e il secondo chiodo lo
            pianta lei, borbottando. Il giorno dopo Fosco ti dà il suo taccuino, e
            per una settimana in Città Bassa si racconta del ladro di galline con
            il martello.
          effetti: { oggetto.taccuino-dei-civici: 1, scandalo: 1 }
          imposta: { fosco: 3 }

      - testo: "Chiedere il permesso alla signora Mora"
        descrizione: "Il muretto e le galline sono suoi, ma forse la storia della quattordici le fa dimenticare la gabella."
        prova: { attributo: sociale, abilita: persuasione, difficolta: Media }
        successo:
          titolo: La porta gialla
          testo: |
            Bussi alla quindici con Fosco, che si torce il cappello. A metà della
            storia la signora Mora scioglie le braccia conserte, perché si ricorda
            della casa con la porta gialla e della madre di Fosco, che le regalava
            le uova. Dice che il muretto è suo, il quattordici di Fosco, e il
            riscossore si arrangi. Inchiodate la targa di giorno, e la sera Fosco
            ti porta il suo taccuino.
          pe: { persuasione: 4 }
          effetti: { oggetto.taccuino-dei-civici: 1, informazioni.voce: 1 }
          imposta: { fosco: 3 }
        fallimento:
          titolo: La porta chiusa
          testo: |
            La signora Mora apre di mezzo palmo e ti lascia arrivare a metà della
            storia, prima di chiederti chi le ridà la gabella pagata due volte. La
            porta si chiude prima che tu trovi la risposta. Fosco si rimette il
            cappello e ti dice che con le galline e con le vicine ci vuole
            pazienza, e che la targa intanto la tieni tu.
          effetti: { scandalo: 0.5 }

      - testo: "Rimandare a un'altra sera"
        descrizione: "La targa ha aspettato trent'anni sulla spiaggia dei rottami, e qualche giorno nella sacca non le cambia niente."
        costo: 0
        esito:
          titolo: La targa nella sacca
          testo: |
            Rimetti la targa nella sacca e dici a Fosco che ne riparlate. Lui
            resta ancora un po' a guardare il pollaio, poi se ne torna verso la
            cantina con i due chiodi in tasca, che tintinnano a ogni passo.

  # ================================================================ carte di più avanti
  - id: carta-il-cerchio-di-gesso
    immagine: icone/laurels-trophy
    titolo: Il cerchio di gesso
    sommario: "In un cortile i bambini giocano all'Arena, e un ubriaco di Ghoran vuole sfidarti."
    luogo: Città Bassa, un cortile dietro Via dei Rasoi
    tipo: carta
    area: citta-bassa
    requisiti: [pista.arena >= 5, campione >= 1, visto.carta-il-cerchio-di-gesso == 0]
    testo: |
      In un cortile due bambini si picchiano con spade di canna dentro un
      cerchio di gesso. Uno porta in vita una cintura di spago con un tappo
      di bottiglia per fibbia, e quando ti vede molla la spada e ti indica, e
      il cortile si gira tutto insieme.

      Dalla soglia di una bettola esce un uomo grosso con una cicatrice da
      Ghoran sulla nuca. «Campione» dice, sputando nel cerchio. «Vediamo se
      senza lo sceriffo davanti sai ancora dove mettere i piedi.»

      {origine fuggiasco-di-ghoran} L'accento di Ghoran ti arriva prima delle
      parole, e la schiena ti si irrigidisce da sola.
    opzioni:
      - testo: "Fargli passare la voglia"
        descrizione: "Basta che si ricordi chi ha battuto Galdrick, e che se lo ricordi davanti ai bambini."
        prova: { attributo: sociale, abilita: intimidire, difficolta: Media }
        successo:
          titolo: Un passo avanti
          testo: |
            Entri nel cerchio senza fretta e ti fermi a un palmo da lui con le mani
            lungo i fianchi, aspettando che si muova. Lui ti guarda a lungo, e piano
            piano gli si abbassano le spalle. Alla fine si gratta la cicatrice e
            torna nella bettola borbottando che oggi non è giornata, mentre i bambini
            urlano il tuo nome e il più piccolo ti regala la cintura di spago.
          pe: { intimidire: 3 }
          effetti: { racconto: 1, informazioni.voce: 1 }
          imposta: { visto.carta-il-cerchio-di-gesso: 1 }
        fallimento:
          titolo: Nel cerchio
          testo: |
            Lo guardi fisso, e lui ricambia finché non ti arriva un pugno che non
            avevi visto partire. Finisce in fretta, con lui seduto nella polvere a
            tenersi il naso e tu con un occhio che si gonfia. I bambini applaudono
            lo stesso, ma una madre li chiama dentro a uno a uno e chiude le
            imposte guardando te.
          effetti: { ferite: 0.5, scandalo: 1 }
          imposta: { visto.carta-il-cerchio-di-gesso: 1 }

      - testo: "Entrare nel cerchio con i bambini"
        descrizione: "Una spada di canna, e come avversario il bambino con la cintura di spago."
        esito:
          titolo: Spade di canna
          testo: |
            Prendi una spada di canna e ti fai battere tre volte di fila dal
            bambino con la cintura di spago, che alla terza alza le braccia come le
            hai alzate tu sulla pietra dell'Arena. Cadere apposta è più difficile
            di quanto credevi, e alla seconda caduta ti scappa da ridere davvero.
            L'uomo della bettola finisce seduto sul bordo della vasca a fare il
            tifo per il bambino.
          effetti: { tormento: -1 }
          imposta: { visto.carta-il-cerchio-di-gesso: 1 }

      - testo: "Offrirgli da bere"
        descrizione: "Un uomo di Ghoran che beve da mezzogiorno può bere fino a sera, e a quel punto parla."
        requisiti: [monete >= 2]
        esito:
          titolo: Alla bettola
          testo: |
            Lo prendi sottobraccio prima che trovi un'altra cosa da dire e lo porti
            nella bettola. Al terzo boccale ti racconta delle fosse di Ghoran dove
            combatteva da ragazzo, e di chi in Città Bassa compra ancora i
            combattenti scappati da lì, toccandosi la cicatrice sulla nuca a ogni
            nome. Al quinto si addormenta sul tavolo, e il conto resta a te.
          effetti: { monete: -2, informazioni.pettegolezzo: 1 }
          imposta: { visto.carta-il-cerchio-di-gesso: 1 }

  - id: carta-vapore-nelle-cantine
    immagine: icone/steam
    titolo: Vapore nelle cantine
    sommario: "Da quando hanno riacceso la fornace dei Tarvelin, in un vicolo sotto l'Acciaieria il vapore sale dalle cantine."
    luogo: Città Bassa, un vicolo sotto l'Acciaieria
    tipo: carta
    area: citta-bassa
    requisiti: [pista.acciaio >= 8, acciaieria.futuro >= 1, visto.carta-vapore-nelle-cantine == 0]
    testo: |
      Dietro l'Acciaieria le famiglie del vicolo dormono sul selciato, perché
      dalle grate delle cantine esce un vapore che sa di uova marce, e una
      vecchia ha messo a bollire una pentola d'acqua su una grata.

      Un fonditore in mutande ti spiega che lo sfiato della fornace passa in
      un tubo dei Precursori sotto il vicolo e, da quando l'hanno riaccesa,
      torna indietro. Dove il tubo piega c'è una saracinesca con una ruota di
      ferro, e in Acciaieria dicono che non è affar loro.

      {origine accolito-del-velo} Fra un paio di giorni questi bambini
      arriveranno in Cattedrale con la tosse.
    opzioni:
      - testo: "Scendere a girare la ruota"
        descrizione: "Una saracinesca dei Precursori si apre soltanto nel verso voluto da chi l'ha costruita."
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Media }
        successo:
          titolo: La ruota
          testo: |
            Nella cantina più vicina trovi la ruota dove il tubo piega, e dalle
            tacche incise sul bordo capisci che va spinta di lato prima di girare,
            come la sicura di una balestra. Il tubo sfiata, e il vapore nel vicolo
            si abbassa in pochi minuti. Il giorno dopo Abele Torsi ti porta i
            ringraziamenti dell'Acciaieria con una borsa e un cristallo tolto da
            un filtro.
          pe: { tecnologia: 5 }
          effetti: { monete: 6, cristalli.cristallo-sterile: 1 }
          imposta: { visto.carta-vapore-nelle-cantine: 1 }
        fallimento:
          titolo: Lo sfiato
          testo: |
            Giri la ruota con tutte e due le mani, e il tubo ti risponde con un
            getto di vapore in faccia che ti butta contro il muro. Risali con il
            collo arrossato e le sopracciglia bruciacchiate. All'alba arriva Abele
            Torsi con due fonditori e una leva, e la chiudono in tre, dopo averti
            guardato come si guarda un ragazzino che ha toccato la stufa.
          effetti: { ferite: 1 }
          imposta: { visto.carta-vapore-nelle-cantine: 1 }

      - testo: "Andare a svegliare Abele Torsi"
        descrizione: "Il capoturno Abele Torsi abita a due vicoli da qui, e svegliarlo di notte non lo renderà allegro."
        esito:
          titolo: Il capoturno in ciabatte
          testo: |
            Abele Torsi ti apre in ciabatte, con la piega del cuscino sulla
            guancia, e prende la giubba a metà della tua frase. La saracinesca la
            chiude in tre, con due fonditori svegliati a calci. Quando il vapore
            cala, la vecchia della pentola ti offre l'ultimo uovo cotto sulla
            grata, e mentre lo sbucci ti racconta chi, nel vicolo, ha già chiesto
            i danni alla Casa dei Nodi.
          effetti: { informazioni.voce: 1 }
          imposta: { visto.carta-vapore-nelle-cantine: 1 }

      - testo: "Tirare dritto"
        descrizione: "Il vicolo ha già chi se ne occupa, o almeno chi dovrebbe."
        costo: 0
        esito:
          titolo: Il vicolo bianco
          testo: |
            Prosegui per la tua strada, con l'odore di uova marce ancora nei
            vestiti. Dall'alto della salita ti volti, e il vicolo è una striscia
            bianca di vapore con i materassi dentro, e su uno di questi qualcuno
            dorme lo stesso.
          imposta: { visto.carta-vapore-nelle-cantine: 1 }
