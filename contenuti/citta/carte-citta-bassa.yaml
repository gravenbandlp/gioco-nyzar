# Città Bassa, carte del mazzo (seconda parte): la vita del quartiere, la catena di Fosco Ambri e due carte che
# arrivano tardi. Il resto del mazzo sta in aree/citta-bassa.yaml e nei file dei luoghi e delle piste.
#
# CARTE SINGOLE
#   carta-il-forno-sulla-crepa     una volta sola (visto). Agata Sorre cuoce il pane su una fenditura e la Gilda
#                                  vuole la tassa sul calore: politica-ed-economia, resistenza, dare ragione alla
#                                  Gilda (rep.gilda), tirare dritto.
#   carta-le-bottiglie-sul-muretto si ripete. Tiro alle bottiglie dietro la Locanda di Ilka: armi-da-distanza,
#                                  ingannare (il banco delle scommesse), restare a guardare (una voce).
#   carta-lo-scrivano-del-lavatoio una volta sola (visto). Ermes Calvi ha la mano fasciata e la fila aspetta:
#                                  espressivita, medicina, tirare dritto.
#
# FOSCO AMBRI, L'IMBIANCHINO DEI CIVICI (catena di tre carte)
#   fosco   0 non l'hai conosciuto, 1 ti ha raccontato della casa che manca, 2 hai la targa di smalto,
#           3 la targa è sul muretto del pollaio e hai il suo taccuino (oggetto taccuino-dei-civici).
#     carta-fosco-il-numero-sbagliato  fosco 0   galateo, dare ragione alla Mora, chiedere a Fosco → 1; tirare dritto.
#     carta-fosco-la-targa-di-smalto   fosco 1   percezione all'Orlo (fallendo resta 1), comprarla da Grusk → 2.
#     carta-fosco-la-casa-quattordici  fosco 2   furtivita (anche fallendo la targa va su, con scandalo),
#                                                persuasione (fallendo resta 2) → 3 e il taccuino.
#
# CARTE DI PIÙ AVANTI
#   carta-il-cerchio-di-gesso      pista.arena >= 5 e campione: i bambini giocano all'Arena e un ubriaco di
#                                  Ghoran ti sfida (intimidire). Una volta sola.
#   carta-vapore-nelle-cantine     pista.acciaio >= 8 e acciaieria.futuro >= 1: la fornace riaccesa scalda le
#                                  cantine di un vicolo (tecnologia). Una volta sola.
#
# Nomi nuovi, che il Codex non dà: Agata Sorre (fornaia), Ermes Calvi (scrivano del lavatoio), Fosco Ambri
# (imbianchino), la signora Mora (la vicina della quindici di Via del Salmone).
quality:
  - { id: fosco, nome: "Fosco Ambri e i civici", categoria: stato, nascosta: true, descrizione: "0 non l'hai ancora conosciuto, 1 ti ha raccontato della casa che manca, 2 hai la targa di smalto, 3 la targa è al suo posto." }
  - { id: visto.carta-il-forno-sulla-crepa, nome: Il forno di Agata Sorre, categoria: stato, nascosta: true }
  - { id: visto.carta-lo-scrivano-del-lavatoio, nome: La mano di Ermes Calvi, categoria: stato, nascosta: true }
  - { id: visto.carta-il-cerchio-di-gesso, nome: Il cerchio di gesso, categoria: stato, nascosta: true }
  - { id: visto.carta-vapore-nelle-cantine, nome: Il vapore nelle cantine, categoria: stato, nascosta: true }

oggetti:
  - id: taccuino-dei-civici
    nome: Taccuino dei civici
    immagine: icone/notebook
    descrizione: "Il quaderno di Fosco Ambri, con tutte le porte della Città Bassa e chi ci abita dietro, aggiornato a matita da trent'anni. La casa quattordici di Via del Salmone c'è ancora."
    slot: accessorio
    grado: 1
    proprieta: { talento: { conoscenze-della-strada: 1 } }

storylet:
  # ================================================================ carte singole
  - id: carta-il-forno-sulla-crepa
    immagine: icone/bread
    titolo: Il forno sulla crepa
    sommario: "Agata Sorre cuoce il pane su una fenditura del suo cortile, e un ispettore della Gilda è venuto a leggerle la tassa sul calore."
    luogo: Città Bassa, un cortile dietro Via del Salmone
    tipo: carta
    area: citta-bassa
    requisiti: [visto.carta-il-forno-sulla-crepa == 0]
    testo: |
      In un cortile dietro Via del Salmone una fenditura del terreno corre in
      diagonale da un muro all'altro, larga quanto una mano, e qualcuno ci ha
      piantato sopra una cassa di ferro con lo sportello. È il forno di Agata
      Sorre. Ci cuoce il pane per mezzo quartiere senza bruciare un ciocco di
      legna, e i vicini portano le pagnotte crude su assi infarinate e
      aspettano il loro turno seduti sui gradini. Su ogni asse c'è un segno
      inciso col coltello, perché nessuno confonda il proprio pane con quello
      degli altri.

      Stamattina la fila è ferma. Davanti al forno c'è un uomo della Gilda
      dei Mercanti con un cappello a tesa stretta e un foglio timbrato in
      mano, e legge ad alta voce di una tassa sul calore delle fenditure, a
      tanto per infornata. Agata lo ascolta con le braccia bianche di farina
      incrociate sul petto. Dietro di lei il pane comincia a mandare odore di
      crosta bruciata, e lo sportello resta chiuso finché lui non ha finito.

      {politica-ed-economia Media} Una tassa letta ad alta voce in un cortile
      è una tassa che chi la riscuote spera di non dover mai scrivere davanti
      a un giudice. I fogli della Gilda, di solito, hanno più righe di quante
      ne legga l'ispettore.

      *Una tassa sul caldo che sale da sotto.* Ti viene da ridere, e poi ti
      accorgi che l'uomo con il cappello non scherza affatto.
    opzioni:
      - testo: "Leggere il foglio dell'ispettore"
        descrizione: "Un foglio della Gilda ha sempre, in fondo, una riga che dice il contrario della prima. Bisogna trovarla prima che il pane bruci."
        prova: { attributo: mentale, abilita: politica-ed-economia, difficolta: Media }
        successo:
          titolo: Il selciato pubblico
          testo: |
            Chiedi il foglio con garbo e lui te lo porge, convinto che basti il
            timbro a farti tacere. La concessione della Gilda parla delle fenditure
            *sotto il selciato pubblico*, e lo ripete tre volte con giri di frase
            diversi. Il cortile di Agata è della sua famiglia da quando c'era suo
            nonno, e il selciato l'hanno pagato loro. Lo leggi ad alta voce, con il
            dito sulla riga, e la voce ti esce più ferma di quanto ti sentissi.
            L'ispettore arrotola il foglio e se ne va senza salutare, con il
            cappello calcato fino alle sopracciglia. Mentre aspetti la tua
            pagnotta, i vicini in fila ti raccontano a turno quello che sanno della
            Gilda in quartiere, e ne sanno parecchio.
          pe: { politica-ed-economia: 4 }
          effetti: { informazioni.voce: 2, rep.gilda: -0.5 }
          imposta: { visto.carta-il-forno-sulla-crepa: 1 }
        fallimento:
          titolo: La riga sotto
          testo: |
            Trovi una riga che sembra fatta apposta e la leggi ad alta voce davanti
            a tutto il cortile. L'ispettore aspetta che tu finisca, poi ti indica
            con l'unghia la riga subito sotto, quella che la annulla. Qualcuno
            nella fila ride. Agata paga la tassa contando le monete sul palmo una
            alla volta, senza staccare gli occhi da te. Intanto il pane nel forno è
            diventato nero.

            {politica-ed-economia Media fallita} La riga giusta c'era, e stava due
            righe più in basso. L'hai saltata perché cercavi quella che ti dava
            ragione.
          effetti: { scandalo: 0.5 }
          imposta: { visto.carta-il-forno-sulla-crepa: 1 }

      - testo: "Togliere il forno dalla crepa"
        descrizione: "Senza la cassa sopra, la fenditura torna a essere soltanto una crepa nel cortile. La cassa però scotta."
        prova: { attributo: fisico, abilita: resistenza, difficolta: Facile }
        successo:
          titolo: Le mani nel grembiule
          testo: |
            Ti avvolgi le mani nel grembiule che Agata ti lancia e afferri la cassa
            per gli spigoli. Il ferro ti morde i palmi attraverso la tela, e tu
            tieni duro fino al muretto, con i denti stretti e il sudore che ti cola
            negli occhi, e la posi con un tonfo che fa saltare le pagnotte. Sulla
            fenditura resta solo il segno rettangolare della cassa. L'ispettore lo
            fissa a lungo, poi rilegge il foglio e si rimette il cappello. Quando
            se n'è andato, Agata rimette il forno al suo posto e ti paga con quello
            che avrebbe dato alla Gilda.

            {resistenza Facile} Un'ora dopo i palmi sono ancora rossi e pulsano, ma
            la pelle ha tenuto. Domani faranno male, e oggi ti hanno dato ragione.
          pe: { resistenza: 3 }
          effetti: { monete: 3 }
          imposta: { visto.carta-il-forno-sulla-crepa: 1 }
        fallimento:
          titolo: Il ferro
          testo: |
            Afferri la cassa a mani nude, perché il grembiule di Agata è ancora per
            aria quando ci arrivi. Il ferro ti brucia i palmi prima ancora che la
            testa capisca, e la molli a metà strada, e la cassa si rovescia sulla
            fenditura con il pane dentro. L'ispettore segna qualcosa sul foglio e
            se ne va soddisfatto. Agata raccoglie le pagnotte dalla polvere e ti
            fascia le mani con uno straccio infarinato, senza dire una parola, con
            una delicatezza che è peggio di un rimprovero.
          effetti: { ferite: 0.5 }
          imposta: { visto.carta-il-forno-sulla-crepa: 1 }

      - testo: "Dare ragione alla Gilda"
        descrizione: "Una tassa scritta va pagata, e la Gilda si ricorda di chi lo dice in pubblico. Anche il cortile se ne ricorda."
        esito:
          titolo: Il tuo nome sul foglio
          testo: |
            Dici a voce alta che una tassa scritta va pagata, anche quando è
            stupida. L'ispettore ti guarda con gratitudine sincera, ti chiede come
            ti chiami e scrive il tuo nome in fondo al foglio, sotto il timbro.
            Agata paga la tassa senza mai guardarti in faccia.

            {galateo Media} In un cortile della Città Bassa si può dare ragione
            alla Gilda in silenzio. Dirlo ad alta voce davanti alla fila è un'altra
            cosa, e il cortile ha preso nota.

            Quando ripassi dal cortile, nei giorni dopo, i vicini sui gradini
            smettono di parlare e riprendono solo dopo che hai girato l'angolo.
          effetti: { rep.gilda: 0.5 }
          imposta: { visto.carta-il-forno-sulla-crepa: 1 }

      - testo: "Tirare dritto"
        descrizione: "Il pane è di Agata, e la tassa pure."
        costo: 0
        esito:
          titolo: Odore di bruciato
          testo: |
            Lasci il cortile mentre l'ispettore attacca il secondo foglio.
            All'angolo di Via del Salmone ti arriva ancora l'odore del pane
            bruciato, e lo stomaco te lo rimprovera. Dietro di te senti la voce di
            Agata che conta le monete ad alta voce, perché le sentano tutti.
          imposta: { visto.carta-il-forno-sulla-crepa: 1 }

  - id: carta-le-bottiglie-sul-muretto
    immagine: icone/crossbow
    titolo: Le bottiglie sul muretto
    sommario: "Dietro la Locanda di Ilka due miliziani fuori servizio e qualche Raschiatore tirano con la balestra alle bottiglie vuote, e si scommette."
    luogo: Città Bassa, il cortile dietro la Locanda di Ilka
    tipo: carta
    area: citta-bassa
    testo: |
      Dietro la Locanda di Ilka c'è un cortile di terra battuta che finisce
      contro un muretto a secco, e oltre il muretto il terreno si apre in una
      fenditura da cui sale un tremolio di aria calda. Sul muretto, a
      distanza regolare, qualcuno ha messo in fila le bottiglie vuote del
      sidro di Besk. Due miliziani fuori servizio, con la giubba della
      Caserma slacciata, tirano a turno con un paio di Raschiatori. La
      balestra da caccia è legata al palo con una catenella, perché l'ultima
      volta qualcuno se l'è portata a casa.

      {armi-da-distanza Media} Una balestra da caccia, con la corda allentata
      da troppi tiri e il calcio rattoppato con lo spago. Tira un po' basso e
      a sinistra, come tutte quelle che passano per troppe mani.

      Il calore che sale dalla crepa fa ballare le bottiglie davanti agli
      occhi, e metà dei dardi finisce nella fenditura con un tintinnio che va
      avanti a lungo. Le scommesse si segnano con il gesso su un'asse
      appoggiata a due barili. Il più vecchio dei Raschiatori ti fa cenno con
      il mento e ti tende la balestra dalla parte del calcio.

      {conoscenze-della-strada Facile} Sull'asse i conti sono scritti da tre
      mani diverse, e nessuna delle tre sa fare le somme. Chi tiene il gesso,
      qui, comanda più di chi tira.
    opzioni:
      - testo: "Tirare alle bottiglie"
        descrizione: "Il caldo che sale dalla crepa sposta le bottiglie di un palmo, e bisogna mirare a dove saranno quando arriva il dardo."
        prova: { attributo: fisico, abilita: armi-da-distanza, difficolta: Media }
        successo:
          titolo: Il vetro
          testo: |
            Ti prendi il tuo tempo, anche se i miliziani cominciano a sbuffare.
            Guardi il tremolio dell'aria finché ne capisci il ritmo, che alterna un
            respiro lungo a uno corto, e tiri sul corto. La prima bottiglia salta
            in pezzi e poco dopo anche la seconda. Alla terza i miliziani hanno
            smesso di ridere, e uno ti chiede dove hai imparato. La posta sull'asse
            è tua. Il Raschiatore vecchio cancella il gesso con il palmo e ci
            scrive sopra il tuo nome, storto, con la lingua fra i denti.
          pe: { armi-da-distanza: 4 }
          effetti: { monete: 5, rep.caserma: 0.5 }
        fallimento:
          titolo: La crepa
          testo: |
            Tiri dove vedi la bottiglia, e il dardo passa un palmo sopra il collo e
            sparisce nella fenditura. Il tintinnio dura così a lungo che i
            miliziani si mettono a contare ad alta voce. Il secondo dardo fa lo
            stesso. Paghi la tua parte di posta sull'asse, e uno dei Raschiatori ti
            batte una mano sulla spalla e ti dice che la crepa si è mangiata
            balestrieri migliori di te.

            {armi-da-distanza Media fallita} Hai mirato dove la bottiglia sembrava,
            e l'aria calda l'aveva spostata da un'altra parte. Lo sapevi anche
            prima di tirare, e il dito non ti ha dato retta.
          effetti: { monete: -2 }

      - testo: "Tenere il banco delle scommesse"
        descrizione: "Da quando il gesso è passato di mano tre volte nessuno tiene più il conto delle poste. Chi tiene il banco decide quanto paga ogni tiro, e se è svelto ci guadagna."
        prova: { attributo: sociale, abilita: ingannare, difficolta: Media }
        successo:
          titolo: Il gesso
          testo: |
            Prendi il gesso e ti metti dietro l'asse come se ci fossi nato. I tiri
            facili li paghi bene, perché tutti scommettono contro, e quelli
            difficili li paghi male, e nessuno ha voglia di rifare i conti con il
            boccale in mano. A sera i miliziani se ne vanno convinti di averci
            guadagnato, e uno ti stringe pure la mano. Nella tua tasca, intanto, è
            finito il grosso della posta.

            {ingannare Media} Il trucco è sorridere ogni volta che paghi, e
            lasciare che vincano spesso piccole somme. Un uomo che vince spesso non
            conta mai quanto ha perso.
          pe: { ingannare: 4 }
          effetti: { monete: 6 }
        fallimento:
          titolo: Il conto del Raschiatore
          testo: |
            Ti metti al banco e per un'ora va tutto liscio, abbastanza da farti
            sentire furbo. Poi il Raschiatore vecchio, che fino a quel momento ha
            bevuto senza dire niente, ti prende il gesso dalle dita e rifà i conti
            sull'asse davanti a tutti, con una calligrafia lenta da contabile. Ti
            tocca restituire la differenza, e una mancia per il disturbo, mentre i
            miliziani raccontano la storia al tavolo accanto, ogni volta un po' più
            lunga.
          effetti: { monete: -3, scandalo: 0.5 }

      - testo: "Restare a guardare"
        descrizione: "Fra un tiro e l'altro chi aspetta il proprio turno chiacchiera, e i miliziani fuori servizio dicono più di quanto dovrebbero."
        esito:
          titolo: Fra un tiro e l'altro
          testo: |
            Ti siedi su un barile con un boccale di sidro e guardi le bottiglie
            saltare, o più spesso restare dove sono. I due miliziani si lamentano
            del sergente, che li manda di ronda in Via dei Rasoi proprio nelle sere
            di paga. Uno dei due dice anche a che ora passa la ronda, e l'altro gli
            dà una gomitata quando ormai è troppo tardi.

            {furtivita Facile} Un'ora precisa e una via precisa. Chi ha qualcosa da
            fare in Via dei Rasoi, quelle sere, sa adesso quando farla.
          effetti: { informazioni.voce: 1 }

  - id: carta-lo-scrivano-del-lavatoio
    immagine: icone/quill-ink
    titolo: Lo scrivano del lavatoio
    sommario: "Ermes Calvi scrive lettere per chi non sa scriverle, e oggi ha la mano destra fasciata. Davanti al suo tavolino la fila arriva fino alle vasche."
    luogo: Città Bassa, il lavatoio
    tipo: carta
    area: citta-bassa
    requisiti: [visto.carta-lo-scrivano-del-lavatoio == 0]
    testo: |
      Al lavatoio, sotto la tettoia di lamiera dove le donne della Città
      Bassa sciacquano i panni, c'è da sempre un tavolino pieghevole con un
      calamaio e una pila di fogli tenuti fermi da un sasso. È il banco di
      mastro Ermes Calvi, che scrive lettere per chi non sa scriverle. Le
      scrive soprattutto ai mariti partiti per Laresh, con la stessa
      calligrafia ornata che usa una volta all'anno per le suppliche al
      Consiglio.

      Oggi Ermes ha la mano destra fasciata fino al polso e la tiene in
      grembo come un uccello caduto dal nido. Con la sinistra prova a
      scrivere, e sulla carta viene fuori un ragno. Davanti al tavolino la
      fila arriva fino alle vasche. Una ragazza stringe un mazzetto di fiori
      di cardo e ripete fra sé le frasi che vuole dettare, muovendo le
      labbra.

      {medicina Facile} La fasciatura è stretta e fatta di fretta, con il
      nodo proprio sopra l'osso del polso. Le dita che spuntano fuori hanno
      un colore che non ti piace.

      {empatia Media} La ragazza dei cardi ha già cambiato tre volte la prima
      frase, e ogni volta la fa più corta. Fra un po' non le resterà che il
      nome di lui.

      *Mezzo quartiere che aspetta una mano buona.* Ermes ti vede guardare e
      alza un sopracciglio, pieno di speranza.
    opzioni:
      - testo: "Scrivere sotto dettatura"
        descrizione: "La gente detta come parla. Le lettere però devono farsi leggere da chi le riceve, ed Ermes ha una reputazione da difendere."
        prova: { attributo: sociale, abilita: espressivita, difficolta: Media }
        successo:
          titolo: La lettera della ragazza
          testo: |
            Ti siedi al posto di Ermes, con lui che ti suggerisce all'orecchio le
            formule di apertura. La ragazza con i fiori di cardo vuole scrivere a
            un fonditore dell'Acciaieria che non le ha mai rivolto la parola, e tu
            trovi un modo di dirglielo che non la faccia sembrare sciocca. Dopo di
            lei passano una lavandaia che reclama un debito e un vecchio che scrive
            al fratello a Tuarmir per la prima volta in vent'anni.

            {espressivita Media} Il vecchio detta come si parla a un fratello che
            si è perso di vista. Tu lasci le sue pause dove sono, e sulla carta
            diventano virgole che il fratello saprà leggere.

            A sera Ermes divide con te l'incasso, e ti fa notare che adesso conosci
            i fatti di mezza fila.
          pe: { espressivita: 4 }
          effetti: { monete: 3, informazioni.pettegolezzo: 1 }
          imposta: { visto.carta-lo-scrivano-del-lavatoio: 1 }
        fallimento:
          titolo: Caro
          testo: |
            Scrivi la prima lettera parola per parola come te la detta una
            lavandaia, con la lingua fra i denti per lo sforzo della bella grafia,
            e quando gliela rileggi lei diventa rossa fino alle orecchie. Avevi
            scritto *caro* dove lei aveva detto *Carlo*, e la lettera era per il
            padrone di casa. La fila ride per un buon quarto d'ora. Ermes ti
            riprende la penna con la mano sana e ti ringrazia della buona volontà,
            con gli occhi che lacrimano dal ridere.
          effetti: { scandalo: 0.5, informazioni.voce: 1 }
          imposta: { visto.carta-lo-scrivano-del-lavatoio: 1 }

      - testo: "Guardargli la mano"
        descrizione: "La fasciatura è fatta male, da qualcuno che aveva fretta. Forse sotto c'è meno danno di quanto creda Ermes."
        prova: { attributo: mentale, abilita: medicina, difficolta: Facile }
        successo:
          titolo: Una storta
          testo: |
            Sciogli la fasciatura sul tavolino, con la fila che allunga il collo
            per vedere. Il polso è gonfio ma le ossa sono al loro posto, e il
            dolore viene da una benda così stretta che gli toglieva il sangue alle
            dita.

            {medicina Facile} Una storta e una benda fatta da qualcuno che voleva
            aiutare in fretta. Succede più spesso di quanto si creda, e fa più
            danni della storta.

            Gliela rifai più morbida, con una stecca ricavata da un righello. Ermes
            muove le dita a una a una, stupito come un bambino, e prima di sera
            ricomincia a scrivere, più lento del solito. Per ringraziarti ti
            racconta chi ha scritto a chi nell'ultimo mese, e perché.
          pe: { medicina: 4 }
          effetti: { informazioni.voce: 2 }
          imposta: { visto.carta-lo-scrivano-del-lavatoio: 1 }
        fallimento:
          titolo: Più stretta
          testo: |
            Sciogli la fasciatura e la rifai da capo, convinto di sapere come si
            fa. Ermes impallidisce a metà del secondo giro e ti chiede con molta
            educazione di smettere. Una lavandaia ti prende la benda di mano e
            gliela rifà lei in un attimo, meglio di te, mentre la fila commenta.

            {medicina Facile fallita} Più stretta non vuol dire più ferma. Te
            l'avevano spiegato una volta, e quel giorno pensavi ad altro.
          effetti: {}
          imposta: { visto.carta-lo-scrivano-del-lavatoio: 1 }

      - testo: "Tirare dritto"
        descrizione: "Le lettere degli altri restano degli altri."
        costo: 0
        esito:
          titolo: La fila
          testo: |
            Lasci il lavatoio con il rumore dei panni sbattuti sulla pietra, che ti
            accompagna per tutta la salita. Alle tue spalle Ermes prova ancora con
            la sinistra, e la ragazza con i fiori di cardo si è seduta sul bordo
            della vasca ad aspettare, con i fiori in grembo che cominciano ad
            appassire.
          imposta: { visto.carta-lo-scrivano-del-lavatoio: 1 }

  # ================================================================ Fosco Ambri, l'imbianchino dei civici
  - id: carta-fosco-il-numero-sbagliato
    immagine: icone/paint-brush
    titolo: Il numero sbagliato
    sommario: "Un vecchio imbianchino dipinge un numero civico su una porta di Via del Salmone, e la padrona di casa gli grida da sotto la scala che è sbagliato."
    luogo: Città Bassa, Via del Salmone
    tipo: carta
    area: citta-bassa
    requisiti: [fosco == 0]
    testo: |
      In Via del Salmone un vecchio sta in cima a una scala a pioli con un
      barattolo di vernice blu appeso al gancio, e con un pennello sottile
      dipinge un quindici sulla porta di una casa di pietra. Lavora con la
      lingua fra i denti e il pennello tenuto come una penna, e il numero
      viene fuori pulito, con un ricciolo all'insù in fondo al cinque.

      {acrobazia Facile} La scala poggia su un ciottolo che balla, e il
      vecchio corregge l'equilibrio con l'anca a ogni pennellata senza
      nemmeno accorgersene. Lassù ci ha passato più anni che a terra.

      Sotto la scala una donna con le maniche rimboccate e un cesto di panni
      bagnati sul fianco gli grida che quella casa è la quattordici da quando
      era viva sua nonna, e che per colpa dei suoi numeri il riscossore della
      Gilda le ha chiesto la gabella due volte. Il vecchio non si volta.
      «Quindici» dice al pennello. «Il quattordici c'è già, signora Mora,
      anche se lei non lo vede.»

      {empatia Media} Lo dice con dolcezza, a voce bassa, come si parla di un
      morto. Per lui quella lite non riguarda la gabella.

      Intorno si sono fermati due ragazzini a godersi la scena, e dalla
      finestra di fronte un uomo in camicia da notte si sporge con la pipa in
      bocca. *In Città Bassa i numeri sono sbagliati quasi tutti, e sempre di
      uno.* Ti accorgi di averli contati anche tu, venendo su per la via.
    opzioni:
      - testo: "Fare da paciere"
        descrizione: "Una lite sui numeri civici, in Città Bassa, può durare una generazione. Con le buone maniere si accorcia."
        prova: { attributo: sociale, abilita: galateo, difficolta: Facile }
        successo:
          titolo: Una sedia sulla soglia
          testo: |
            Ti metti fra la scala e il cesto e parli alla signora Mora come si
            parla a una padrona di casa dei Quartieri Alti, dandole del lei senza
            alzare la voce. Lei sbatte le palpebre, presa in contropiede dalla
            cortesia. Le prometti che dirai tu al riscossore come stanno le cose, e
            lei alla fine si siede sulla soglia a riprendere fiato e ti racconta
            mezzo vicinato. Il vecchio scende, si pulisce le mani in uno straccio e
            te ne tende una, ancora macchiata di blu. Si chiama Fosco Ambri, e se
            vuoi sapere perché sbaglia i numeri lo trovi in fondo alla via, nella
            cantina con la porta dipinta.
          pe: { galateo: 3 }
          effetti: { informazioni.voce: 1 }
          imposta: { fosco: 1 }
        fallimento:
          titolo: Il cesto
          testo: |
            Provi a mettere pace con un discorso che ti sembrava ragionevole finché
            non l'hai detto ad alta voce. La signora Mora ti ascolta fino a metà,
            poi ti rovescia addosso mezzo cesto di panni bagnati e rientra
            sbattendo la porta, sotto il quindici fresco di vernice. L'acqua del
            bucato ti scende nel colletto ed è gelida. Dalla scala il vecchio ride
            fino a doversi tenere ai pioli. Quando scende si presenta come Fosco
            Ambri e ti invita nella sua cantina in fondo alla via, dove almeno ti
            asciughi.

            {galateo Facile fallita} Le hai dato del tu. Te ne accorgi adesso, con
            una camicia di lei appesa alla spalla.
          imposta: { fosco: 1 }

      - testo: "Dare ragione alla signora Mora"
        descrizione: "La casa è sua, e il riscossore della Gilda bussa alla sua porta. Il vecchio può tenersi i suoi numeri."
        esito:
          titolo: Il coltello da cucina
          testo: |
            Tieni ferma la scala mentre il vecchio scende, offeso come un gatto
            bagnato, e la signora Mora ci sale lei con un coltello da cucina a
            raschiare il quindici ancora fresco. Raschia con energia, e la vernice
            blu le finisce sulle maniche e sul naso. Per ringraziarti ti mette in
            mano una focaccia tiepida e qualche moneta per il disturbo. Il vecchio
            ti studia appoggiato al muro, con il barattolo blu fra le mani. «Fosco
            Ambri, in fondo a Via del Salmone» dice prima di andarsene. «Quando
            vorrai sapere come si conta davvero.»
          effetti: { monete: 2 }
          imposta: { fosco: 1 }

      - testo: "Chiedere al vecchio perché sbaglia"
        descrizione: "Un imbianchino che sbaglia sempre di uno, e sempre nello stesso verso, di solito ha una ragione."
        esito:
          titolo: La casa che manca
          testo: |
            Aspetti che finisca il cinque e gli chiedi perché. Il vecchio pulisce
            il pennello sull'orlo del barattolo e ti guarda dall'alto della scala.
            «Perché fra la tredici e la casa della signora qui c'era un'altra casa,
            e io ci sono nato» dice. «La Gilda l'ha buttata giù, e questo vuol dire
            soltanto che la contano loro e la conto io.» Si chiama Fosco Ambri. Il
            resto della storia, dice, lo racconta nella sua cantina in fondo alla
            via a chi si siede ad ascoltare.

            {conoscenze-della-strada Media} Una casa che la Gilda butta giù e una
            gabella chiesta due volte sulla porta accanto. Quando in Città Bassa
            capitano tutte e due nella stessa via, raramente è un caso.
          effetti: { informazioni.voce: 1 }
          imposta: { fosco: 1 }

      - testo: "Tirare dritto"
        descrizione: "In Città Bassa i numeri sbagliati sono più dei giusti, e nessuno si è mai perso per questo."
        costo: 0
        esito:
          titolo: Quindici
          testo: |
            Lasci la lite dietro di te. In fondo alla via ti volti, e la signora
            Mora è ancora sotto la scala con il cesto sul fianco, mentre il vecchio
            ripassa il ricciolo del cinque con una pazienza da miniatore. Uno dei
            ragazzini gli tiene il barattolo, e si è sporcato di blu fino ai
            gomiti.

  - id: carta-fosco-la-targa-di-smalto
    immagine: icone/paint-brush
    titolo: La targa di smalto
    sommario: "Fosco Ambri ti aspetta nella sua cantina di barattoli in fondo a Via del Salmone, e ha una mappa vecchia da mostrarti."
    luogo: Città Bassa, la cantina di Fosco Ambri in Via del Salmone
    tipo: carta
    area: citta-bassa
    requisiti: [fosco == 1]
    testo: |
      La cantina di Fosco Ambri è in fondo a Via del Salmone, dietro una
      porta dipinta di un colore diverso per ogni asse. Dentro ci sono
      barattoli di vernice impilati fino al soffitto, con il colore segnato
      sul coperchio a pennellate. Sul tavolo è inchiodato agli angoli un
      foglio grande e ingiallito, una mappa della Città Bassa con tutte le
      case disegnate a una a una e il numero dentro, nella calligrafia della
      Gilda di quarant'anni fa.

      {accademiche Media} È una mappa catastale, di quelle che la Gilda
      rifaceva a ogni generazione e poi buttava. Questa è sopravvissuta
      perché qualcuno l'ha tenuta per affetto, e lo si vede dai bordi
      consumati dalle dita.

      Fosco ti fa sedere e mette il dito su una casetta fra la tredici e la
      casa della signora Mora, coperta da una croce a matita rossa. «Era casa
      nostra» dice, e ti spiega che un inverno la fenditura sotto si è
      allargata e la Gilda l'ha fatta buttare giù, dando il terreno ai
      vicini. «La targa di smalto blu con il quattordici è finita all'Orlo
      dei Rottami con le macerie, e Grusk non butta niente che abbia una
      scritta sopra. Con queste ginocchia, io sulla spiaggia dei rottami non
      ci scendo più» aggiunge, battendosi una mano sul ginocchio.

      {atletica Facile} La spiaggia dei rottami è una discesa di ghiaia e
      lamiere che si fa di corsa all'andata e a quattro zampe al ritorno. Le
      ginocchia di Fosco hanno ragione, e le tue per ora reggono.
    opzioni:
      - testo: "Cercare la targa all'Orlo dei Rottami"
        descrizione: "Grusk tiene le cose con le scritte nelle casse sotto i teli. Le casse sono tante, e i ragazzi dell'Orlo ci frugano dentro tutti i giorni."
        prova: { attributo: mentale, abilita: percezione, difficolta: Media }
        successo:
          titolo: Il quattordici blu
          testo: |
            Passi il pomeriggio sulla spiaggia dei rottami a sollevare teli
            incerati e a rovesciare casse di insegne, con la ruggine che ti si
            infila sotto le unghie, mentre Grusk ogni tanto ti dice *fuochino*
            senza sapere che cosa cerchi. La targa è in fondo a una cassa di
            lamiere smaltate, sotto un'insegna da barbiere. Il blu si è scrostato
            agli angoli, ma il quattordici è ancora lì, con lo stesso ricciolo
            all'insù che Fosco mette in fondo ai suoi numeri.

            {percezione Media} Il ricciolo l'hai riconosciuto prima del numero.
            Fosco lo mette in fondo ai suoi numeri da quando lo dipingeva su questa
            targa.

            Mentre la tiri fuori ti resta in mano anche una scheggia di metallo
            strano, e Grusk ti fa segno di tenertela.
          pe: { percezione: 4 }
          effetti: { reliquie.scheggia: 1 }
          imposta: { fosco: 2 }
        fallimento:
          titolo: Lamiera
          testo: |
            Rovesci casse fino al tramonto e trovi quattro targhe con il
            quattordici, tutte del colore sbagliato. Ogni volta il cuore ti fa un
            salto, e ogni volta ricade. Mentre ne tiri fuori una da sotto un
            mucchio di lamiere ti apri il palmo su un bordo arrugginito, e Grusk ti
            fascia la mano con uno straccio che ha visto giorni migliori. Torni a
            mani vuote, con la promessa di Grusk che terrà gli occhi aperti.
          effetti: { ferite: 0.5 }

      - testo: "Comprare la targa da Grusk"
        descrizione: "Grusk sa dov'è ogni cosa sulla sua spiaggia, e ogni cosa ha un prezzo, anche quelle che nessuno vorrebbe."
        requisiti: [monete >= 4]
        esito:
          titolo: Il prezzo di Grusk
          testo: |
            Grusk ti ascolta con le mani sui fianchi, poi va dritto a una cassa
            sotto un telo e tira fuori una targa di smalto blu senza nemmeno
            guardare. Il quattordici è scrostato agli angoli. Te la vende per molto
            più di quanto valga, e tu paghi senza discutere, perché ha già capito
            che ti serve.

            {conoscenze-della-strada Facile} Sapeva dov'era prima ancora che tu
            finissi di parlare, e il prezzo l'ha deciso guardandoti in faccia.
          effetti: { monete: -4 }
          imposta: { fosco: 2 }

      - testo: "Dirgli di aspettare"
        descrizione: "Le ginocchia di Fosco aspettano da trent'anni, e possono aspettare ancora un po'."
        costo: 0
        esito:
          titolo: Un altro giorno
          testo: |
            Fosco arrotola la mappa senza fare commenti e ti accompagna alla porta,
            salendo i gradini con una mano sul ginocchio. Sulla soglia ti dice che
            lui di solito è lì la mattina presto e la sera tardi, e che le cantine,
            a differenza delle case, restano dove le hai lasciate.

  - id: carta-fosco-la-casa-quattordici
    immagine: icone/paint-brush
    titolo: La casa quattordici
    sommario: "Hai la targa di Fosco Ambri, e in Via del Salmone c'è un solo muro dove può andare. È quello del pollaio della signora Mora."
    luogo: Città Bassa, Via del Salmone, fra la tredici e la casa della signora Mora
    tipo: carta
    area: citta-bassa
    requisiti: [fosco == 2]
    testo: |
      Fosco tiene la targa sulle ginocchia per un bel po' senza dire niente,
      e la pulisce con il pollice dove lo smalto è saltato. Poi si alza e ti
      porta in Via del Salmone, fra la casa tredici e quella della signora
      Mora. Dove c'era casa sua adesso c'è un pollaio, con un muretto di
      sassi verso la strada e un tetto di lamiera ondulata. Le galline
      razzolano proprio sopra la fenditura, che d'inverno le tiene al caldo.

      {natura Facile} Galline sopra una fenditura calda fanno uova anche
      d'inverno. La signora Mora, con quel pollaio, ha fatto un affare
      migliore di quanto direbbe.

      «Il muretto è della Mora» dice Fosco, rigirandosi in mano due chiodi
      lunghi. «La terra sotto è ancora mia, qualunque cosa abbia scritto la
      Gilda.» Il martello te lo porge dalla parte del manico, e ti guarda
      come guarderebbe un garzone il primo giorno.

      {furtivita Media} Il muretto dà sulla strada sotto tre finestre, e le
      galline dormono a un braccio dai sassi. Di notte un martello avvolto in
      uno straccio si sente meno di una gallina sveglia.

      *Una targa su un pollaio, e un vecchio che ci tiene più che alla sua
      cantina.* La mano si è già chiusa sul martello.
    opzioni:
      - testo: "Inchiodarla di notte"
        descrizione: "Quando la Mora dorme, il muretto è di chi ci pianta un chiodo. Le galline però hanno il sonno leggero."
        prova: { attributo: fisico, abilita: furtivita, difficolta: Media }
        successo:
          titolo: Due chiodi
          testo: |
            Aspettate che si spenga l'ultima finestra di Via del Salmone, seduti
            sul gradino della tredici con il freddo che sale dalla pietra. Ti
            avvicini al muretto un passo alla volta, con i chiodi in bocca perché
            non tintinnino, e pianti il primo con il martello avvolto in uno
            straccio. I chiodi in bocca hanno un gusto di ruggine. Una gallina
            borbotta nel sonno e si riaddormenta. Al secondo chiodo la targa è
            dritta, e Fosco, rimasto sull'angolo, si soffia il naso molto a lungo.

            La mattina dopo la signora Mora trova il quattordici sul suo pollaio e
            lo guarda con le mani sui fianchi, poi va a prendere uno straccio e lo
            lucida. Qualche giorno più tardi Fosco ti mette in mano il suo
            taccuino, con tutte le porte del quartiere e chi ci abita dietro.
          pe: { furtivita: 4 }
          effetti: { oggetto.taccuino-dei-civici: 1 }
          imposta: { fosco: 3 }
        fallimento:
          titolo: Le galline
          testo: |
            Al primo colpo di martello le galline si svegliano tutte insieme, e il
            pollaio si riempie di piume e di strilli. Si accendono tre finestre. La
            signora Mora esce in camicia da notte con una lanterna e una scopa, e
            per un momento il martello in mano ce l'hai tu, e la colpa pure.

            {furtivita Media fallita} Hai pensato al rumore del martello e ti sei
            scordato che le galline dormono con un occhio solo. Lo straccio intorno
            al ferro, a loro, non è bastato.

            Poi vede la targa, e la scopa si abbassa piano. Finisce che il secondo
            chiodo lo pianta lei, borbottando, con mezza via alle finestre. Fosco
            ti dà il suo taccuino il giorno dopo, e per una settimana in Città
            Bassa si racconta del ladro di galline con il martello.
          effetti: { oggetto.taccuino-dei-civici: 1, scandalo: 0.5 }
          imposta: { fosco: 3 }

      - testo: "Chiedere il permesso alla signora Mora"
        descrizione: "Il muretto è suo, e anche le galline. Se le si racconta chi abitava nella quattordici, forse la gabella pagata due volte le brucia un po' meno."
        prova: { attributo: sociale, abilita: persuasione, difficolta: Media }
        successo:
          titolo: La porta gialla
          testo: |
            Bussi alla quindici con Fosco dietro di te, il cappello in mano e le
            dita che ne torcono la tesa. La signora Mora vi ascolta sulla soglia a
            braccia conserte, e a metà della storia le braccia scendono. Si ricorda
            della casa con la porta gialla e della madre di Fosco, che da bambina
            le regalava le uova.

            {persuasione Media} Le uova hanno fatto quello che la gabella non
            poteva. Una donna che ricorda un regalo da bambina non riesce più a
            pensare a quel muretto come a una cosa soltanto sua.

            Alla fine dice che il muretto è suo, il quattordici di Fosco, e il
            riscossore si arrangi. La targa la inchiodate di giorno, con mezza via
            a guardare. Quella sera Fosco ti porta il suo taccuino, con tutte le
            porte del quartiere e chi ci abita dietro.
          pe: { persuasione: 4 }
          effetti: { oggetto.taccuino-dei-civici: 1, informazioni.voce: 1 }
          imposta: { fosco: 3 }
        fallimento:
          titolo: La porta chiusa
          testo: |
            Bussi alla quindici e la signora Mora apre di mezzo palmo, e dalla
            fessura esce un odore di cavolo e di bucato. Ti lascia arrivare fino a
            metà della storia, poi ti chiede chi le ridà la gabella pagata due
            volte, e la porta si chiude prima che tu trovi la risposta. Fosco si
            rimette il cappello e ti dice che con le galline e con le vicine ci
            vuole pazienza, e che la targa intanto la tieni tu.
          effetti: {}

      - testo: "Rimandare a un'altra sera"
        descrizione: "La targa ha aspettato trent'anni sulla spiaggia dei rottami. Qualche giorno nella tua sacca non le cambia niente."
        costo: 0
        esito:
          titolo: La targa nella sacca
          testo: |
            Rimetti la targa nella sacca e dici a Fosco che ne riparlate, e la
            sacca ti sembra subito più pesante. Lui annuisce e resta ancora un po'
            a guardare il pollaio, poi se ne torna verso la cantina con i due
            chiodi in tasca, che tintinnano a ogni passo.

  # ================================================================ carte di più avanti
  - id: carta-il-cerchio-di-gesso
    immagine: icone/laurels-trophy
    titolo: Il cerchio di gesso
    sommario: "In un cortile della Città Bassa i bambini giocano all'Arena, e un uomo di Ghoran che ha bevuto da mezzogiorno vuole giocare con te."
    luogo: Città Bassa, un cortile dietro Via dei Rasoi
    tipo: carta
    area: citta-bassa
    requisiti: [pista.arena >= 5, campione >= 1, visto.carta-il-cerchio-di-gesso == 0]
    testo: |
      In un cortile fra le case di pietra qualcuno ha tracciato in terra un
      cerchio di gesso grande come un'aia, e dentro due bambini si picchiano
      con spade di canna mentre gli altri fanno il tifo dal bordo di una
      vasca. Uno dei due porta in vita una cintura di spago intrecciato, con
      un tappo di bottiglia al posto della fibbia. Quando ti vede passare
      molla la spada e ti indica, e il cortile si gira tutto insieme.

      {espressivita Facile} Il bambino con la cintura alza le braccia come le
      alzavi tu, con il mento in su e i gomiti larghi. Lo ha visto fare dagli
      spalti, e lo rifà meglio di te.

      Il tuo nome lo sanno, e lo storpiano in tre modi diversi. Dalla soglia
      di una bettola esce anche un uomo grosso, con le maniche strappate e
      una cicatrice da Ghoran sulla nuca, che cerca il muro con la spalla da
      quando ha cominciato a bere. «Campione» dice, sputando nel cerchio. «Il
      cerchio è questo. Vediamo se senza lo sceriffo davanti sai ancora dove
      mettere i piedi.»

      {rissa Media} È grosso, ma l'equilibrio l'ha lasciato nella bettola. Il
      peso gli sta tutto sul piede sinistro, e un uomo così si mette giù con
      una spinta.
    opzioni:
      - testo: "Fargli passare la voglia"
        descrizione: "Toccarlo non serve. Basta che si ricordi chi ha battuto Galdrick, e che se lo ricordi davanti ai bambini."
        prova: { attributo: sociale, abilita: intimidire, difficolta: Media }
        successo:
          titolo: Un passo avanti
          testo: |
            Entri nel cerchio senza fretta e ti fermi a un palmo da lui, con le
            mani lungo i fianchi, e aspetti che sia lui a muoversi. Ti arriva il
            fiato di vino acido e di cipolla, e non ti scansi. Ti guarda prima le
            mani e poi la faccia, e piano piano gli si accorcia il fiato.

            {intimidire Media} Basta che capisca da solo come finirebbe, e
            lasciargli il tempo di arrivarci senza perdere la faccia davanti ai
            bambini.

            Alla fine si gratta la cicatrice, borbotta che oggi non è giornata e
            torna nella bettola, mentre i bambini si mettono a urlare il tuo nome
            storpiato. Il più piccolo ti regala la cintura di spago. Prima di sera
            la storia ha già fatto il giro della via, ingrandita a ogni porta.
          pe: { intimidire: 3 }
          effetti: { racconto: 1, informazioni.voce: 1 }
          imposta: { visto.carta-il-cerchio-di-gesso: 1 }
        fallimento:
          titolo: Nel cerchio
          testo: |
            Lo guardi fisso, e lui ricambia lo sguardo finché non ti arriva un
            pugno che non avevi visto partire. Finisce in fretta, con lui seduto
            nella polvere a tenersi il naso e tu con un occhio che si gonfia. I
            bambini applaudono lo stesso, ma una madre li chiama dentro dalla
            finestra a uno a uno e chiude le imposte guardando te.

            {intimidire Media fallita} Uno che beve da mezzogiorno non ha più paura
            di niente, e lo sguardo fisso gli è sembrato un invito.
          effetti: { ferite: 0.5, scandalo: 0.5 }
          imposta: { visto.carta-il-cerchio-di-gesso: 1 }

      - testo: "Entrare nel cerchio con i bambini"
        descrizione: "Con una spada di canna, e il bambino con la cintura di spago come avversario. L'uomo della bettola può aspettare il suo turno."
        esito:
          titolo: Spade di canna
          testo: |
            Prendi una spada di canna e ti fai battere tre volte di fila dal
            bambino con la cintura di spago, che alla terza alza le braccia come le
            hai alzate tu sulla pietra dell'Arena. Cadere apposta è più difficile
            di quanto credevi, e alla seconda caduta ti scappa da ridere davvero.
            L'uomo della bettola guarda per un po' e poi scoppia a ridere. Alla
            fine si siede sul bordo della vasca a fare il tifo per il bambino.
            Torni a casa con un livido da canna sul polso e la testa più leggera di
            quando sei uscito.
          effetti: { tormento: -1 }
          imposta: { visto.carta-il-cerchio-di-gesso: 1 }

      - testo: "Offrirgli da bere"
        descrizione: "Un uomo di Ghoran che beve da mezzogiorno può bere fino a sera, e a quel punto parla."
        requisiti: [monete >= 2]
        esito:
          titolo: Alla bettola
          testo: |
            Lo prendi sottobraccio prima che trovi un'altra cosa da dire e lo porti
            dentro la bettola. Al terzo boccale ti racconta delle fosse di Ghoran
            dove combatteva da ragazzo, e di chi in Città Bassa compra ancora i
            combattenti scappati da lì, e a che prezzo.

            {empatia Media} Parla delle fosse come si parla di casa, e ogni volta
            che dice un nome si tocca la cicatrice sulla nuca, senza accorgersene.

            Al quinto si addormenta sul tavolo con la testa sulle braccia, e il
            conto resta a te.
          effetti: { monete: -2, informazioni.pettegolezzo: 1 }
          imposta: { visto.carta-il-cerchio-di-gesso: 1 }

  - id: carta-vapore-nelle-cantine
    immagine: icone/steam
    titolo: Vapore nelle cantine
    sommario: "Da quando la fornace dei Tarvelin è stata riaccesa, in un vicolo sotto l'Acciaieria il vapore sale dalle cantine e le famiglie dormono in strada."
    luogo: Città Bassa, un vicolo sotto l'Acciaieria
    tipo: carta
    area: citta-bassa
    requisiti: [pista.acciaio >= 8, acciaieria.futuro >= 1, visto.carta-vapore-nelle-cantine == 0]
    testo: |
      Il vicolo scende dietro l'Acciaieria verso le fenditure più larghe, e
      stanotte è pieno di gente. Le famiglie hanno portato fuori i materassi
      e li hanno stesi sul selciato, perché dalle grate delle cantine esce un
      vapore bianco con un odore di uova marce, che appanna le finestre fino
      al primo piano. Una vecchia ha messo una pentola d'acqua sulla grata, e
      l'acqua bolle.

      {resistenza Facile fallita} Al terzo respiro di quel vapore la gola ti
      si chiude e gli occhi ti lacrimano. Ti tiri il bavero sul naso, che non
      serve a niente.

      Un uomo in mutande e giubba da fonditore ti spiega che da quando hanno
      riacceso la fornace il calore va giù invece che su. Sotto il vicolo
      passa un tubo dei Precursori, vecchio quanto la città, che porta via lo
      sfiato dei forni, e dove il tubo piega c'è una saracinesca con una
      ruota di ferro. «In Acciaieria dicono che la roba di sotto non è affar
      loro» dice l'uomo. «Sotto, però, ci dormiamo noi.»

      {tecnologia Media} Uno sfiato che torna indietro vuol dire una
      saracinesca chiusa a metà, o girata dalla parte sbagliata. I Precursori
      costruivano le cose perché funzionassero in un verso solo, e il verso
      giusto raramente è quello che viene in mente per primo.

      *Il primo inverno senza Ondrel Tarvelin, e la fornace scalda già il
      quartiere sbagliato.* Il vapore ti sale in faccia, e i capelli ti si
      appiccicano alla fronte.
    opzioni:
      - testo: "Scendere a girare la ruota"
        descrizione: "Una saracinesca dei Precursori non si apre a forza di braccia. Bisogna capire da che parte voleva farla girare chi l'ha costruita."
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Media }
        successo:
          titolo: La ruota
          testo: |
            Scendi nella cantina più vicina con un fazzoletto bagnato sulla bocca,
            e trovi la ruota dove il tubo piega. È fredda, in mezzo a tutto quel
            caldo, e ha sul bordo delle tacche incise che non sono numeri. Le segui
            con il dito e capisci che va spinta di lato prima di girare, come la
            sicura di una balestra. Il tubo sospira, e nel vicolo il vapore si
            abbassa in pochi minuti. Quando risali, qualcuno ti batte sulle spalle
            e qualcun altro sta già riportando dentro il materasso.

            Il giorno dopo Abele Torsi ti cerca per ringraziarti a nome
            dell'Acciaieria. Ti lascia una borsa e un cristallo che i fonditori
            hanno tolto da un filtro.
          pe: { tecnologia: 5 }
          effetti: { monete: 6, cristalli.cristallo-sterile: 1 }
          imposta: { visto.carta-vapore-nelle-cantine: 1 }
        fallimento:
          titolo: Lo sfiato
          testo: |
            Giri la ruota con tutte e due le mani, e il tubo ti risponde con un
            getto di vapore in faccia che ti butta contro il muro. Risali in strada
            con la pelle del collo arrossata e le sopracciglia bruciacchiate.

            {tecnologia Media fallita} Le tacche sul bordo c'erano, e le hai viste.
            Le hai prese per decorazioni, perché erano belle.

            All'alba arriva Abele Torsi con due fonditori e una leva, e la chiudono
            in tre, dopo averti guardato come si guarda un ragazzino che ha toccato
            la stufa.
          effetti: { ferite: 1 }
          imposta: { visto.carta-vapore-nelle-cantine: 1 }

      - testo: "Andare a svegliare Abele Torsi"
        descrizione: "Il capoturno conosce l'Acciaieria meglio di chiunque, e abita a due vicoli da qui. Svegliarlo di notte non lo renderà allegro."
        esito:
          titolo: Il capoturno in ciabatte
          testo: |
            Abele Torsi ti apre in ciabatte e ascolta mezza frase prima di prendere
            la giubba, con la faccia gonfia di sonno e una piega del cuscino sulla
            guancia. Scende nel vicolo con due fonditori svegliati a calci, e la
            saracinesca la chiudono in tre, imprecando contro i Precursori e contro
            chi ha progettato la fornace nuova. Quando il vapore cala le famiglie
            riportano dentro i materassi, e la vecchia della pentola ti offre
            l'ultimo uovo cotto sulla grata. Mentre lo sbucci, con le dita che
            scottano, ti racconta chi, nel vicolo, ha già chiesto i danni alla Casa
            dei Nodi.
          effetti: { informazioni.voce: 1 }
          imposta: { visto.carta-vapore-nelle-cantine: 1 }

      - testo: "Tirare dritto"
        descrizione: "Il vicolo ha già chi se ne occupa, o almeno chi dovrebbe."
        costo: 0
        esito:
          titolo: Il vicolo bianco
          testo: |
            Prosegui per la tua strada, con l'odore di uova marce ancora nei
            vestiti. Dall'alto della salita ti volti, e il vicolo è una striscia
            bianca di vapore con i materassi dentro, e su uno di questi qualcuno
            dorme lo stesso.
          imposta: { visto.carta-vapore-nelle-cantine: 1 }
