# La città viva, luogo 9: il Teatro delle Meraviglie (presso: teatro-delle-meraviglie, area quartieri-alti).
# L'attività dietro le quinte (con pista.teatro != 1, per non sovrapporsi alle prove della Promessa), le tre
# storie di rep.teatro (2 la sartoria, con il seguito della Fusari; 4 il copione nuovo, con il seguito della
# lettura; 6 il nome sul cartellone, che mette in scena quel copione e quindi chiede teatro.copione) e la carta
# del manifesto strappato. Il servizio (le prove, la prima e le repliche della Promessa dell'Arpia) sta già in
# contenuti/piste/teatro.yaml.
# Reputazione: le storie la portano a 3, 5 e 7; le funi, la comparsa e la buca la fanno salire fino a 4, la
# macchina del volo (Fisico), il libro di scena (Mentale) e la sostituzione (Sociale, Difficile) fino a 6.
# Teodora Fusari, la sarta, è un personaggio nuovo e minore, inventato per la storia a 2.
storylet:
  # ------------------------------------------------------------ l'attività ripetibile
  - id: dietro-le-quinte
    presso: teatro-delle-meraviglie
    immagine: ambientazione/teatro-delle-meraviglie
    titolo: Dietro le quinte
    sommario: "Quando non c'è la Promessa dell'Arpia, il Teatro vive di repertorio, e dietro il sipario rosso servono sempre mani."
    luogo: Teatro delle Meraviglie, dietro le quinte
    area: quartieri-alti
    ripetibile: true
    requisiti: [pista.teatro != 1]
    testo: |
      Quando non c'è la Promessa dell'Arpia, il Teatro delle Meraviglie tira
      avanti con le farse di Orazio. Dietro le quinte, dove il corridoio
      odora di cerone, le funi del sipario sono legate a caviglie di ferro,
      ognuna con il suo nastrino colorato. Il vecchio macchinista sonnecchia
      su un rotolo di corda.

      {origine apprendista-raschiatore} Funi riconosciute dal colore le hai
      tirate sulle piattaforme della Cicatrice, con il vuoto al posto del
      lampadario.

      Orazio passa con mezza faccia di cerone cercando le sue pastiglie alla
      menta. «Anime mie, il sipario fra un'ora!» annuncia, e nessuno alza la
      testa.
    opzioni:
      - testo: "Stare alle funi del sipario"
        descrizione: "Il vecchio macchinista ha le dita storte dalle corde, e cerca qualcuno che le abbia ancora dritte."
        requisiti: [rep.teatro < 2]
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Media }
        successo:
          titolo: Il nastrino rosso
          testo: |
            Il macchinista ti spiega i nastrini una volta sola. Al segnale giri la
            ruota a braccia tese e il velluto rosso si apre senza uno strappo, e
            dalla sala arriva la prima risata. Fra un atto e l'altro il
            macchinista ti passa la fiaschetta che sa di prugne, e a fine serata
            ti dice di tornare domani, che per lui è già un discorso lungo.
          effetti: { monete: 1, rep.teatro: 0.5 }
        fallimento:
          titolo: Il nastrino nero
          testo: |
            Al segnale afferri la fune con il nastrino nero, e sopra la platea il
            lampadario scende di un braccio con un tintinnio di gocce di vetro. Il
            macchinista ti toglie la fune di mano e lo riporta su prima che Orazio
            se ne accorga, e per il resto della sera ti lascia tenere la lanterna,
            che non è attaccata a niente.

      - testo: "Stare alle funi del sipario"
        descrizione: "Il macchinista ti lascia la ruota e dorme, ma se un fondale si incastra in alto sveglia te."
        requisiti: [rep.teatro >= 2, rep.teatro < 4]
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Media }
        successo:
          titolo: Il graticcio
          testo: |
            A metà del secondo atto il fondale del giardino si incastra a
            mezz'aria, con un albero dipinto che penzola sopra la testa di Orazio.
            Sali al graticcio e liberi la fune da un chiodo storto, e il fondale
            scende al suo posto. Orazio, che ha recitato tutta la scena guardando
            in su, ti paga la serata e ti chiede di controllare quel chiodo ogni
            sera.
          effetti: { monete: 2, rep.teatro: 0.5 }
        fallimento:
          titolo: L'albero di tela
          testo: |
            Al graticcio tiri la fune con troppa forza, e il fondale si sgancia
            dall'altro capo e cade di piatto sul palco con un sospiro di tela.
            Orazio lo scavalca con dignità, alzando il ginocchio come sopra una
            pozzanghera, e la platea pensa che sia voluto. Il macchinista ha
            capito benissimo, e per due sere non ti offre la fiaschetta.

      - testo: "Fare la comparsa"
        descrizione: "Nella *Vedova dei tre ponti* c'è una guardia che sta ferma tutto il secondo atto e dice una battuta sola."
        requisiti: [rep.teatro < 4, campione == 0]
        prova: { attributo: sociale, abilita: espressivita, difficolta: Media }
        successo:
          titolo: Alt, chi va là
          testo: |
            Ti infilano un elmo di latta che ti arriva al naso e ti piazzano
            accanto alla porta della vedova. Stai fermo tutto il secondo atto,
            anche quando Orazio, che la vedova la fa lui, ti pizzica una guancia
            per far ridere la platea. Al momento giusto dici «Alt, chi va là» con
            una voce così seria che il loggione applaude, e Orazio decide che la
            guardia avrà due battute.
          effetti: { monete: 2, rep.teatro: 0.5 }
        fallimento:
          titolo: La guardia ride
          testo: |
            Stai fermo accanto alla porta di cartone finché Orazio, che la vedova
            la fa lui, ti pizzica una guancia. Ti scappa una risata dal naso e
            l'elmo ti scivola sugli occhi, mentre dal loggione qualcuno grida di
            arrestare la guardia. Dietro le quinte Orazio ti paga in pastiglie
            alla menta, appena ritrovate in tasca.

      - testo: "Fare la comparsa"
        immagine: personaggi/orazio-belcanto
        descrizione: "Il loggione ti ha visto vincere all'Arena, e ti riconosce anche sotto un elmo di latta."
        requisiti: [rep.teatro < 4, campione >= 1]
        prova: { attributo: sociale, abilita: espressivita, difficolta: Media }
        successo:
          titolo: Il campione con l'elmo di latta
          testo: |
            A metà del primo atto qualcuno in loggione ti riconosce sotto l'elmo,
            e il tuo nome passa di bocca in bocca fino alla prima fila. Quando
            dici «Alt, chi va là» la sala viene giù, e Orazio, che fa la vedova,
            aspetta che l'applauso finisca con un sorriso di gesso. Dietro le
            quinte ti paga e ti prega, con la voce più alta del solito, di tenere
            la visiera abbassata.
          effetti: { monete: 2, rep.teatro: 0.5 }
        fallimento:
          titolo: Il saluto del campione
          testo: |
            Il loggione ti riconosce e grida il tuo nome a ogni battuta di Orazio.
            Il braccio alza la lancia per salutare prima che tu glielo abbia
            permesso, e la porta di cartone cade all'indietro con tutta la vedova
            dietro. Nel camerino Orazio ti paga una miseria senza dire una parola,
            e in compagnia se ne parla per giorni, perché nessuno l'aveva mai
            visto zitto così a lungo.
          effetti: { monete: 1 }

      - testo: "Suggerire dalla buca"
        descrizione: "Il suggeritore ha il raffreddore, e nella buca si sta piegati con le scarpe degli attori sotto il naso."
        requisiti: [rep.teatro < 4]
        prova: { attributo: mentale, abilita: [percezione, accademiche], difficolta: Media }
        successo:
          titolo: La mezza pagina
          testo: |
            Ti infili nella buca con il copione e una candela schermata, e segui
            le battute con il dito. A metà del secondo atto Orazio salta mezza
            pagina per arrivare prima alla scena in cui piange, e tu la salti con
            lui, suggerendo agli altri la battuta giusta per andargli dietro.
            Quando esci hai le ginocchia segnate, e Orazio ti mette in mano
            qualche moneta senza ammettere niente.
          effetti: { monete: 2, rep.teatro: 0.5 }
        fallimento:
          titolo: La candela
          testo: |
            Nella buca la candela si spegne a metà del primo atto, e per
            riaccenderla perdi il segno. Quando lo ritrovi l'attor giovane ha già
            inventato due battute, e quella che suggerisci riporta la scena
            indietro di una pagina intera. Dopo, Orazio ti spiega che un
            suggeritore si sente solo quando sbaglia.

      - testo: "Vendere i biglietti del loggione"
        descrizione: "Il botteghino del loggione dà sul vicolo, dove chi passa di solito ha già speso tutto all'osteria."
        prova: { attributo: sociale, abilita: persuasione, difficolta: Facile }
        successo:
          titolo: Otto biglietti
          testo: |
            Ti siedi nel botteghino con la cassetta di latta e un mazzo di
            biglietti stampati storti. Una squadra di Raschiatori, con la polvere
            del Labirinto ancora nelle rughe, si ferma a ridere davanti alla
            locandina, e tu li prendi prima che arrivino all'osteria. Ne comprano
            otto, più uno per la madre di uno di loro. A fine serata Orazio ti dà
            la tua parte.
          effetti: { monete: 3 }
        fallimento:
          titolo: Creditori e gatti
          testo: |
            Stasera nel vicolo passano soprattutto creditori e gatti. Vendi tre
            biglietti, uno a una vecchia che cercava soltanto un posto al coperto
            per contare le sue monete, e Orazio ti dà la tua parte, che è poca.
          effetti: { monete: 1 }

      - testo: "Spazzare la sala dopo lo spettacolo"
        descrizione: "A sala vuota la donna delle pulizie ha bisogno di una scopa in più."
        quando: [pista.arena < 2]
        esito:
          titolo: Le cose perse
          testo: |
            Spazzi fra le poltrone mentre la donna delle pulizie passa lo straccio
            sul palco, canticchiando la canzone del secondo atto una nota sotto.
            Sotto una poltrona trovi un biglietto d'amore senza firma. Lei lo
            legge prima di metterlo nella cassetta delle cose perse, e ti dice che
            da quando lavora qui l'ha trovato cento volte, sempre uguale tranne il
            nome. Ti offre mezza mela per il disturbo.
          pe: { percezione: 2 }

      - testo: "Spazzare la sala dopo lo spettacolo"
        immagine: personaggi/orazio-belcanto
        descrizione: "Orazio torna dall'Arena con la voce rovinata, e il teatro va chiuso lo stesso."
        quando: [pista.arena >= 2]
        esito:
          titolo: La voce di Orazio
          testo: |
            Stai spazzando quando entra Orazio, ancora con la giacca dell'Arena, e
            si siede sul bordo del palco con le gambe a penzoloni. Ha gridato nomi
            tutto il pomeriggio e gli esce solo un soffio. Gli porti acqua calda e
            miele, e lui la beve tenendo la tazza con tutte e due le mani
            inanellate. «Cinquemila persone, anima mia» sussurra, «e il biglietto
            non l'hanno pagato a me.»
          pe: { empatia: 2 }

      - testo: "Manovrare la macchina del volo"
        immagine: personaggi/violante
        descrizione: "Nella farsa nuova Violante scende dal soffitto vestita da luna, e il contrappeso lo regge chi sta all'argano."
        requisiti: [rep.teatro >= 4, rep.teatro < 6]
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Media }
        successo:
          titolo: La luna
          testo: |
            Ti metti all'argano e lasci scorrere la fune un palmo alla volta.
            Violante scende dal buio in una veste d'argento, con la falce di luna
            sulla testa, e si ferma a un braccio dalle assi proprio sulla sua
            battuta. Quando si sgancia ti dice che a metà discesa di solito recita
            una preghiera, e stasera se n'è dimenticata; Orazio, a fine serata, ti
            paga bene.
          effetti: { monete: 4, rep.teatro: 0.5 }
        fallimento:
          titolo: La luna storta
          testo: |
            A metà discesa la fune ti scivola di un palmo fra le mani, e Violante
            si ferma storta, con la falce di luna di traverso sulla fronte. Recita
            la sua battuta a testa in giù senza perdere una sillaba, e il loggione
            applaude più del solito. Dietro le quinte ti guarda i palmi bruciati e
            ti chiede, con molta gentilezza, di non farlo mai più.
          effetti: { monete: 1, ferite: 0.5 }

      - testo: "Tenere il libro di scena"
        descrizione: "Il libro di scena comanda luci ed entrate, e Orazio di solito non lo affida a nessuno."
        requisiti: [rep.teatro >= 4, rep.teatro < 6]
        prova: { attributo: mentale, abilita: [percezione, accademiche], difficolta: Media }
        successo:
          titolo: Tutte le entrate
          testo: |
            Ti siedi in quinta con il libro di scena sulle ginocchia, le pagine
            piene di segni a matita di vent'anni di repliche. Dai il via alle
            lampade della ribalta e alle entrate, e due volte allunghi una pausa
            perché il loggione sta ancora ridendo. A fine serata Orazio scrive la
            data sulla tua pagina, come fa per le sere che vuole ricordare, e ti
            paga come si deve.
          effetti: { monete: 4, rep.teatro: 0.5 }
        fallimento:
          titolo: Il tuono in anticipo
          testo: |
            A metà del primo atto leggi un segno vecchio al posto di quello nuovo,
            e il tuono di lamiera arriva durante la scena d'amore. Orazio, in
            ginocchio a dichiararsi, alza gli occhi al soffitto e recita il resto
            della scena come davanti a un presagio, e la platea ride come non le
            capitava da mesi. Dopo, nel camerino, ti spiega la differenza fra la
            matita rossa e quella blu.
          effetti: { monete: 2 }

      - testo: "Prendere la parte di un attore malato"
        descrizione: "L'attor giovane ha la febbre, e fra un'ora Orazio ti vuole in scena al suo posto."
        requisiti: [rep.teatro >= 4, rep.teatro < 6]
        prova: { attributo: sociale, abilita: [espressivita, ingannare], difficolta: Difficile }
        successo:
          titolo: Un'ora per quaranta battute
          testo: |
            Hai un'ora per imparare quaranta battute, e ne impari trenta
            ripetendole a mezza voce. Le altre dieci le inventi in scena,
            guardando Orazio negli occhi finché lui capisce dove vuoi arrivare e
            ti viene dietro. La tua versione è più corta di quella scritta e fa
            ridere di più. Nel camerino Orazio ti conta le monete e annota
            qualcosa sul margine del copione.
          effetti: { monete: 6, rep.teatro: 0.5 }
        fallimento:
          titolo: Un tanto per atto
          testo: |
            Hai un'ora per imparare quaranta battute, e in scena te ne restano in
            testa una dozzina. Al terzo vuoto Orazio comincia a dire anche le tue,
            cambiando voce ogni volta, mentre tu annuisci con grande convinzione e
            in platea ridono credendolo uno scherzo previsto. Nel camerino ti paga
            una miseria, calcolata un atto alla volta.
          effetti: { monete: 2 }

      - testo: "Recitare la tua sera in cartellone"
        descrizione: "Il tuo nome è sul cartellone sotto quello di Orazio, e una sera alla settimana la sala è tua."
        requisiti: [teatro.primattore >= 1]
        prova: { attributo: sociale, abilita: [espressivita, persuasione], difficolta: Media }
        successo:
          titolo: La tua sera
          testo: |
            La sala è piena fino al loggione, e quando entri in scena qualcuno in
            platea dice la tua prima battuta insieme a te, sottovoce. Ormai sai
            dove il pubblico ride e lo lasci ridere prima di andare avanti. Agli
            applausi Orazio ti spinge avanti di un passo, poi si mette davanti lui
            per l'inchino. Nel camerino ti aspetta il tuo sacchetto di velluto,
            accanto a un biglietto senza firma.
          effetti: { monete: 8 }
        fallimento:
          titolo: Una sera fiacca
          testo: |
            Stasera la battuta ti arriva un momento in ritardo, e la sala se ne
            accorge prima di te. Il secondo atto si trascina fino all'inchino, e
            il loggione applaude per educazione infilandosi il cappotto. Orazio
            dice che le sere fiacche servono a far brillare le altre, e ti paga un
            po' meno del solito.
          effetti: { monete: 5 }

  # ------------------------------------------------------------ storia a 2 · la sartoria
  - id: la-sartoria
    presso: teatro-delle-meraviglie
    immagine: personaggi/orazio-belcanto
    titolo: La sartoria
    sommario: "Un costume si è aperto in scena per la terza volta, e Orazio Belcanto ha già il suo colpevole."
    luogo: Teatro delle Meraviglie, la sartoria sotto il tetto
    area: quartieri-alti
    requisiti: [rep.teatro >= 2, teatro.costumi == 0]
    testo: |
      La sartoria è una stanza lunga sotto il tetto che odora di naftalina.
      Su un manichino senza testa c'è il corpetto della vedova, aperto sul
      fianco dall'ascella alla vita; ieri sera si è aperto così in scena, e
      la platea ha visto la camicia di Orazio.

      «È la terza volta in un mese, anima mia» dice Orazio, camminando fra i
      manichini. «C'è una mano nemica in questo teatro, e al Grifone di Ferro
      le forbici non mancano di sicuro.»

      Accanto alla finestra cuce Teodora Fusari, che veste Orazio da quando
      lui faceva il garzone di bottega. È piccola e curva, e infila l'ago
      tenendolo a un braccio dagli occhi. Quando Orazio esce sbattendo la
      porta lei non alza la testa.

      {medicina Difficile} Strizza gli occhi anche verso la finestra. Le si
      stanno velando, e da parecchio tempo.
    opzioni:
      - testo: "Esaminare la cucitura"
        descrizione: "Un filo tagliato e un filo che cede, guardati da vicino, sono due cose diverse."
        prova: { attributo: mentale, abilita: [percezione, tecnologia], difficolta: Media }
        successo:
          titolo: Punti lunghi
          testo: |
            Giri il corpetto verso la luce. Il filo è intero e si è soltanto
            sfilato, perché i punti sono lunghi il doppio del normale e storti, e
            in qualche tratto l'ago è passato fuori dalla stoffa. Più in alto,
            nella cucitura vecchia, la stessa mano ha fatto punti piccoli e dritti
            come una fila di formiche. Quando ti volti, la Fusari ti guarda con
            l'ago fermo a mezz'aria.
          segue: la-sarta-di-orazio
        fallimento:
          titolo: Un filo rosso
          testo: |
            Giri il corpetto da tutte le parti e ti fermi su un filo rosso che con
            il costume non c'entra niente. Lo porti a Orazio, che lo alza
            controluce e dice, trionfante, che al Grifone le tende sono rosse.
            Entro sera tutta la compagnia sa che Liaren Tarvelin taglia i costumi
            di notte. Quando torni in sartoria la Fusari ha ricominciato a cucire,
            e non ti guarda più.
          effetti: { scandalo: 0.5 }

      - testo: "Parlare con la Fusari"
        descrizione: "Quando Orazio grida lei non alza la testa. Forse con qualcuno che non grida parla."
        prova: { attributo: sociale, abilita: [empatia, galateo], difficolta: Media }
        successo:
          titolo: Il rocchetto
          testo: |
            Ti siedi accanto a lei e le chiedi del corpetto, poi di Orazio da
            ragazzo, e lei sorride raccontando di un garzone che non stava mai
            fermo alle prove. Quando le cade un rocchetto e glielo porgi, lo cerca
            tastando sul tuo palmo, e smette di sorridere. «Il filo me lo infila
            mia nipote la mattina, venti aghi alla volta» dice piano, «e ieri ne
            aveva preparati diciannove.»
          segue: la-sarta-di-orazio
        fallimento:
          titolo: Il costume da finire
          testo: |
            Le chiedi del corpetto con troppa fretta, e lei capisce che cosa
            cerchi prima che tu finisca la domanda. «Ho trent'anni di lavoro qui
            dentro e un costume da finire per stasera» dice, e si gira verso la
            finestra. Tiene l'ago fermo senza dare un punto finché non te ne vai,
            e alle tue spalle senti girare la chiave nella serratura.
          effetti: { scandalo: 0.5 }

      - testo: "Tornare in sartoria di notte"
        descrizione: "Se qualcuno tocca i costumi di nascosto lo fa a teatro chiuso, e basta una notte di sonno in meno."
        costo: 2
        esito:
          titolo: La candela
          testo: |
            Ti fai chiudere dentro dal macchinista e aspetti nel buio fra i sacchi
            dei costumi. Verso mezzanotte entra la Fusari con il corpetto della
            vedova sotto il braccio. Seduta alla finestra, avvicina una candela
            finché la fiamma le scalda la faccia e prova a rifare la cucitura;
            dopo un'ora ha dato tre punti. Quando esci dal buio non si spaventa, e
            ti porge l'ago senza dire niente.
          segue: la-sarta-di-orazio

  - id: la-sarta-di-orazio
    immagine: ambientazione/teatro-delle-meraviglie
    titolo: La sarta di Orazio
    tipo: seguito
    luogo: Teatro delle Meraviglie, la sartoria sotto il tetto
    area: quartieri-alti
    requisiti: [teatro.costumi == 0]
    testo: |
      La Fusari posa il corpetto sulle ginocchia, con i polpastrelli segnati da
      mille punture. «Gli occhi mi vanno via da un anno» dice. «Da vicino vedo
      una nebbia, e ogni mese si allarga un poco. Mia nipote mi infila gli aghi
      la mattina, e le cuciture lunghe le faccio a memoria. Orazio mi tiene
      perché gli ho cucito il primo costume, quando aveva quindici anni. Se lo
      sa mi dà una pensione e un posto in platea, e io in platea muoio in un
      mese.»

      {empatia Facile} La nebbia la spaventa meno della platea, dove sarebbe
      un'ospite nel teatro in cui è sempre stata di casa.

      {origine fuggiasco-di-ghoran} A Ghoran chi sentiva gli occhi andarsene lo
      nascondeva fino all'ultimo giorno, perché sulla bilancia si pesava anche
      quello.

      Dalla tromba delle scale sale la voce di Orazio, che racconta al
      macchinista delle forbici di Liaren Tarvelin.
    opzioni:
      - testo: "Dirlo a Orazio"
        descrizione: "Una verità detta bene farà a Orazio meno male di una bugia sul Grifone."
        immagine: personaggi/orazio-belcanto
        esito:
          titolo: Gli anelli sul tavolo
          testo: |
            Racconti tutto a Orazio nel camerino. A metà si sfila gli anelli e li
            allinea sulla toeletta, poi sale in sartoria, e quando scende ha gli
            occhi rossi e un foglio in mano. La nipote verrà ogni giorno a spese
            del teatro, e la Fusari taglierà e disegnerà, i punti li daranno
            altri. «Il mio primo costume me l'ha cucito lei, e io stavo per
            accusare Liaren» dice.
          pe: { empatia: 5 }
          imposta: { teatro.costumi: 1 }
          effetti: { rep.teatro: 1 }

      - testo: "Infilarle gli aghi tu"
        descrizione: "La mattina passi dalla sartoria prima che arrivi la compagnia, e il segreto resta fra voi due e la nipote."
        esito:
          titolo: Venti aghi
          testo: |
            Ti siedi accanto a lei alla finestra e infili venti aghi, poi rifai il
            fianco del corpetto mentre lei ti guida la mano, con le dita leggere e
            la voce severa. La sera il corpetto regge per tutti e due gli atti, e
            Orazio dice a tutti che la mano nemica si è spaventata. La Fusari,
            quando passi, ti tiene da parte una caramella di zucchero cotto.
          pe: { tecnologia: 5 }
          imposta: { teatro.costumi: 1 }
          effetti: { rep.teatro: 1 }

      - testo: "Dare ragione a Orazio"
        descrizione: "Orazio ha già il suo colpevole, e se gli dai ragione la Fusari tiene il posto senza domande."
        immagine: personaggi/liaren-tarvelin
        esito:
          titolo: Le forbici di Liaren
          testo: |
            Dici a Orazio che il filo era tagliato di netto, e lui comincia a
            raccontare a chiunque che Liaren Tarvelin gli manda un sicario con le
            forbici. La Fusari ti ringrazia, ma l'ago lo tiene ancora lontano
            dagli occhi, e presto un altro corpetto si aprirà in scena.

            {resilienza Media} La bugia ti è uscita liscia, e al Grifone la
            pagherà una donna innocente.
          pe: { ingannare: 5 }
          imposta: { teatro.costumi: 1 }
          effetti: { rep.teatro: 1 }

  # ------------------------------------------------------------ storia a 4 · il copione nuovo
  - id: un-copione-nuovo
    presso: teatro-delle-meraviglie
    immagine: personaggi/orazio-belcanto
    titolo: Un copione nuovo
    sommario: "Orazio Belcanto vuole uno spettacolo nuovo con un eroe vero, e ha deciso che l'eroe sei tu."
    luogo: Teatro delle Meraviglie, il camerino di Orazio
    area: quartieri-alti
    requisiti: [rep.teatro >= 4, teatro.copione == 0]
    testo: |
      Il camerino di Orazio è piccolo e caldo, con uno specchio grande quanto
      la parete. Sulla toeletta, appoggiato a una bottiglia, c'è il ritratto a
      carboncino di un uomo serio in camicia bianca, l'unica cosa nella stanza
      che Orazio non ha fatto incorniciare d'oro.

      «Anima mia, la città è stanca di arpie» dice Orazio, indicandoti la
      sedia davanti allo specchio. «Vuole un eroe in carne e ossa, e io ho
      deciso di dargli il tuo nome. La gente racconta molto e racconta male.
      Tu mi dici com'è andata, e io la racconto meglio. Meglio nel senso
      dell'Arte, s'intende.»

      {origine mercante-dei-ponti} Sui Ponti una storia si vende a peso come
      le castagne, e Orazio la vuole gratis.

      *Il finale l'ha già scritto, e adesso cerca qualcosa da metterci prima.*
      Le lampade a olio intorno allo specchio ti scaldano la nuca.
    opzioni:
      - testo: "Raccontargli la sera del Festival"
        descrizione: "Anche Orazio ha visto la razzia del Festival, e la ricorda a modo suo."
        esito:
          titolo: Il discorso interrotto
          testo: |
            Gli racconti la sera del Festival, e Orazio scrive in fretta finché
            arrivi agli orchi. «Io ero sul palco e ho continuato a parlare per
            tenere calma la folla, anima mia» dice. Violante, che passa in
            corridoio, dice che quella sera l'ha visto saltare giù dal palco per
            primo. Orazio scrive lo stesso, con le orecchie rosse, e nel copione
            gli orchi diventano trecento.
          segue: la-lettura-del-copione

      - testo: "Raccontargli del cinghiale della Foresta"
        immagine: personaggi/corin-ashdale
        descrizione: "Il cinghiale della Foresta, grande come un carro, per Orazio è già una farsa perfetta."
        requisiti: [pista.corin >= 3]
        esito:
          titolo: Grande come la Casa dei Nodi
          testo: |
            Gli racconti della radura piena di carcasse, e di Corin Ashdale che
            teneva la balestra come un ombrello chiuso. Orazio scrive Corin così
            com'è, perché uno così non si inventa. Il cinghiale invece alla quinta
            pagina parla. «Un cinghiale muto non regge un atto intero» ti spiega.
            Sul margine disegna la bestia di cartapesta, con sei paia di gambe di
            comparse sotto la pancia.
          segue: la-lettura-del-copione

      - testo: "Raccontargli di Capomozzo"
        descrizione: "La strada per la fortezza di Balthog e quello che hai riportato dai sotterranei, di cui in città si parla."
        requisiti: [pista.capomozzo >= 7]
        esito:
          titolo: La principessa
          testo: |
            Orazio ascolta la storia della fortezza di Balthog senza alzare la
            testa, e ai sotterranei dice che la ragazza con i capelli d'argento
            della Cattedrale la vede già come una principessa addormentata in una
            torre. Gli dici che lei nel copione non entra, e Orazio, dopo un lungo
            sguardo, tira una riga sulla pagina. «Allora al suo posto metto un
            tesoro, che almeno non si offende» dice.
          segue: la-lettura-del-copione

      - testo: "Raccontargli della finale all'Arena"
        immagine: personaggi/toren-galdrick
        descrizione: "La finale l'ha annunciata lui, dalla tribuna. Vuole sapere come si vedeva da giù, dalla sabbia."
        requisiti: [pista.arena >= 5, campione >= 1]
        esito:
          titolo: Lo sceriffo imbottito
          testo: |
            Gli racconti della finale, con Galdrick che ti saluta alzando la lama
            sul camminamento bagnato. Galdrick, decide Orazio, lo farà lui, con
            un'imbottitura sulle spalle e una barba finta. «Lo sceriffo ha le
            spalle, e io ho il talento» spiega. Nel copione la pozza dell'Arena
            diventa un lago di fuoco, e al posto della cintura del campione hai
            una corona d'alloro, che dal loggione si vede meglio.
          segue: la-lettura-del-copione

      - testo: "Raccontargli della finale all'Arena"
        immagine: personaggi/toren-galdrick
        descrizione: "Nella finale ha vinto Galdrick, di un soffio. Orazio era sulla tribuna e se lo ricorda bene."
        requisiti: [pista.arena >= 5, campione == 0]
        esito:
          titolo: Sul mio palco vinci tu
          testo: |
            Gli racconti della finale e del momento in cui hai sbagliato, che ti
            brucia ancora. Orazio ascolta con la faccia da funerale, e al premio
            del secondo scuote la testa. «Sul mio palco il secondo posto non l'ho
            mai messo in scena, e non comincio adesso» dice. Nel copione Galdrick
            scivola sul camminamento e tu lo salvi dalla pozza, poi vinci lo
            stesso.
          segue: la-lettura-del-copione

      - testo: "Non raccontargli niente"
        descrizione: "Quello che hai fatto è tuo. Orazio però scrive lo stesso, con quello che gli arriva dalla strada."
        esito:
          titolo: Quello che dice la gente
          testo: |
            Gli dici che preferisci tenerti le tue storie. Orazio ti legge dai
            suoi fogli quello che dice la gente. In Città Bassa giurano che sei
            figlio di un nobile decaduto, e una lavandaia dei Quartieri Alti
            sostiene che parli con i gatti. «Prendo tutto» dice. «La gente ha già
            fatto metà del lavoro.» Alla fine della pagina di te è rimasto
            soltanto il nome.
          segue: la-lettura-del-copione

      - testo: "Alzarti dalla sedia"
        descrizione: "Per oggi preferisci che la tua storia resti fuori dal teatro. Orazio sa aspettare, almeno a parole."
        costo: 0
        esito:
          titolo: La penna sospesa
          testo: |
            Ti alzi dalla sedia davanti allo specchio e gli dici che per adesso la
            tua storia la tieni tu. Orazio resta con la penna sospesa finché una
            goccia d'inchiostro cade sul foglio, e allora la posa. «L'Arte sa
            aspettare, anima mia. Io ci provo» dice, e ti avverte che intanto
            continuerà a raccogliere quello che dice la gente, perché la gente non
            chiede il permesso.

  - id: la-lettura-del-copione
    immagine: personaggi/violante
    titolo: La lettura del copione
    tipo: seguito
    luogo: Teatro delle Meraviglie, il ridotto, tre giorni dopo
    area: quartieri-alti
    requisiti: [teatro.copione == 0]
    testo: |
      Orazio raduna la compagnia nel ridotto per la lettura. Il copione ha la
      copertina di cartone rosso e un titolo pieno di svolazzi, *Le imprese
      mirabolanti di un cittadino qualunque*, e Orazio legge tutte le parti da
      solo, cambiando voce a ogni battuta.

      Dentro ci sei tu, con una spada che canta quando c'è un nemico vicino, e
      un vecchio maestro che nel primo atto ti muore fra le braccia dicendoti
      una frase di quattro righe.

      Violante, con i piedi su un'altra sedia, ti passa un foglio piegato con
      scritto a matita *a pagina dodici ti innamori di me e a quattordici
      muoio, stai tranquillo*. La donna delle pulizie, che Orazio invita a
      tutte le letture perché è il pubblico, ride nei punti giusti e anche in
      qualcuno sbagliato.

      Quando chiude il copione Orazio ti guarda, con la penna già in mano.
      «Allora, anima mia. Quanto lo tagliamo?»
    opzioni:
      - testo: "Lasciarlo esagerare"
        descrizione: "Il teatro è suo, e la spada che canta anche. Alla fine la gente saprà che è una farsa."
        esito:
          titolo: I diritti della tua vita
          testo: |
            Gli dici che il teatro è suo e la spada che canta anche. Orazio ti
            abbraccia, con gli anelli che ti premono nella schiena, e dalla tasca
            della giacca tira fuori un sacchetto di velluto. «I diritti della tua
            vita, anima mia. La vita resta a te, e la versione migliore la tengo
            io.» Nei giorni dopo, per strada, qualcuno comincia a chiederti se la
            spada canta davvero.
          pe: { galateo: 5 }
          imposta: { teatro.copione: 1 }
          effetti: { rep.teatro: 1, monete: 20 }

      - testo: "Togliere le bugie una alla volta"
        descrizione: "Pagina per pagina, finché nel copione resta qualcosa che è successo davvero. Orazio difenderà ogni riga."
        prova: { attributo: sociale, abilita: [persuasione, galateo], difficolta: Media }
        successo:
          titolo: Una pessima coreografia
          testo: |
            Riprendi il copione dalla prima pagina e a ogni bugia gli racconti
            com'è andata davvero. Orazio difende la spada che canta per mezz'ora,
            e alla fine la cede, purché resti il maestro che muore. «La verità è
            una pessima coreografia» dice, e intanto taglia. Il copione esce più
            sottile di un terzo, e Orazio, rileggendolo, ride in un punto dove
            prima non rideva nessuno.
          pe: { persuasione: 5 }
          imposta: { teatro.copione: 1 }
          effetti: { rep.teatro: 1, monete: 10 }
        fallimento:
          titolo: La spada resta
          testo: |
            Provi a togliere la spada che canta, e Orazio la difende come un
            figlio. La compagnia si schiera con lui, perché nel duello con la
            spada tutti hanno almeno una battuta, e nessun attore rinuncia a una
            battuta per amore della verità. Orazio rimette il copione nel cassetto
            e ti dice che l'Arte sa aspettare.
          effetti: { scandalo: 0.5 }

      - testo: "Trovare nei fatti la scena migliore"
        descrizione: "Forse un dettaglio vero vale più di una spada che canta, e Orazio paga chi glielo porta."
        prova: { attributo: mentale, abilita: [percezione, accademiche], difficolta: Media }
        successo:
          titolo: La fibbia
          testo: |
            Gli racconti una cosa che non hai mai detto. Dopo, finito tutto, le
            mani ti tremavano tanto che qualcuno ha dovuto slacciarti una fibbia.
            Orazio resta zitto, poi cancella le quattro righe del maestro che
            muore e al loro posto scrive una fibbia che non si slaccia. «Questa la
            recito io, e la sala piangerà» dice. Violante ti guarda da sopra il
            copione, senza ridere.
          pe: { percezione: 5 }
          imposta: { teatro.copione: 1 }
          effetti: { rep.teatro: 1, monete: 10 }
        fallimento:
          titolo: Troppo vero
          testo: |
            Gli racconti una cosa vera, e la scegli male, un ricordo che ti tiene
            sveglio di notte e che in bocca a te suona soltanto crudo. Nel ridotto
            cala un silenzio in cui si sente il lampadario. Orazio ti posa una
            mano sul braccio. «Il pubblico paga per piangere un poco e tornare a
            casa, e questa è una cosa da notte insonne» dice, e chiude il copione.
          effetti: { tormento: 0.5 }

      - testo: "Togliere i nomi veri"
        descrizione: "Che esageri pure, purché nel copione non resti il nome di nessun altro."
        esito:
          titolo: Lo sceriffo Baldracco
          testo: |
            Gli lasci la spada che canta e tutto il resto, a patto che l'unico
            nome vero nel copione sia il tuo. Orazio brontola sui diritti
            dell'Arte, poi ci prende gusto e passa il pomeriggio a inventare nomi
            nuovi, provandoli ad alta voce finché non suonano abbastanza ridicoli.
            Uno sceriffo diventa Baldracco e una Gilda intera la Lega dei
            Bottegai, mentre la donna delle pulizie ride a ogni nome.
          pe: { empatia: 5 }
          imposta: { teatro.copione: 1 }
          effetti: { rep.teatro: 1, monete: 10 }

  # ------------------------------------------------------------ storia a 6 · il nome sul cartellone
  - id: il-nome-sul-cartellone
    presso: teatro-delle-meraviglie
    immagine: ambientazione/teatro-delle-meraviglie
    titolo: Il nome sul cartellone
    sommario: "Stasera va in scena il copione di Orazio, e sul cartellone c'è il tuo nome, sotto il suo."
    luogo: Teatro delle Meraviglie, la sera della prima
    area: quartieri-alti
    requisiti: [rep.teatro >= 6, teatro.primattore == 0, teatro.copione >= 1]
    testo: |
      Sul cartellone fra le colonne del Teatro c'è il titolo in lettere d'oro,
      sotto il nome di Orazio Belcanto, grande quanto il titolo, e sotto
      ancora il tuo, un poco più piccolo.

      Dietro il sipario la compagnia si muove in punta di piedi, e Violante ti
      sistema il colletto senza chiedere. Dal buco nel velluto si vede la sala
      piena fino al loggione, e in terza fila la donna delle pulizie ha un
      biglietto vero e un cappello. Orazio guarda dal buco accanto al tuo e
      s'irrigidisce. «C'è Tarquin» dice, con una voce di un'ottava più bassa.
      In un palco di prima fila, accanto a Isotta Cordani, siede l'uomo in
      camicia bianca del ritratto sulla toeletta. Poi Orazio si volta, e la
      voce gli risale dove sta di solito. «Anime mie, in posizione!»

      {origine rampollo-dei-quartieri-alti} Isotta Cordani l'hai incrociata in
      abbastanza salotti da riconoscerle il ventaglio anche da qui. Domani nei
      Quartieri Alti del tuo nome si parlerà come ne parlerà lei.

      {origine figlio-della-citta-bassa} In Città Bassa i nomi sui muri sono
      quelli che la Caserma cerca. Il tuo, scritto in oro fra due colonne, non
      ti sembra ancora il tuo.

      Hai le mani fredde e la bocca asciutta, e le battute del primo atto se
      ne sono andate tutte insieme.
    opzioni:
      - testo: "Fare come la sera della Promessa"
        immagine: personaggi/violante
        descrizione: "La sera della Promessa dell'Arpia hai già retto una sala piena al buio, e le ginocchia se lo ricordano."
        requisiti: [pista.teatro >= 2, teatro.ruolo == 1]
        prova: { attributo: sociale, abilita: [espressivita, persuasione], difficolta: Facile }
        successo:
          titolo: Le ginocchia ricordano
          testo: |
            Pianti i piedi come la sera della Promessa e aspetti che la sala
            smetta di tossire. La prima battuta ti torna da sola, e le altre la
            seguono. Orazio recita i cattivi cambiando mantello in quinta, e ogni
            volta che rientra ti strizza l'occhio. Agli applausi la sala si alza,
            e Tarquin Cordani applaude per primo dal suo palco. L'indomani il
            pittore ripassa il tuo nome di vernice fresca.
          pe: { espressivita: 5 }
          imposta: { teatro.primattore: 1 }
          effetti: { rep.teatro: 1, monete: 25, racconto: 1 }
        fallimento:
          titolo: La striscia di carta
          testo: |
            Entri in scena convinto che le ginocchia sappiano la strada, e a metà
            del primo atto ti si piegano. Orazio ti copre come può e recita quasi
            tutto il secondo atto lui, sudando sotto il cerone per due. Il giorno
            dopo sul cartellone, sopra il tuo nome, c'è una striscia di carta
            incollata di traverso, e Orazio ti dice che la toglierà la sera che
            sarai pronto.
          effetti: { monete: 8, scandalo: 0.5 }

      - testo: "Recitare la parte come l'ha scritta Orazio"
        descrizione: "Le battute sono di Orazio, e davanti a una sala piena serve la voce e un po' di faccia tosta."
        prova: { attributo: sociale, abilita: [espressivita, persuasione], difficolta: Media }
        successo:
          titolo: La sala in piedi
          testo: |
            La prima battuta ti esce un tono troppo alta e la seconda giusta. Da
            lì in avanti la sala la tieni tu, e ride prima che tu finisca la
            frase. Orazio recita i cattivi e ogni tanto si dimentica di esserlo,
            per guardarti. Agli applausi la sala si alza, e Tarquin Cordani
            applaude per primo dal suo palco. L'indomani il pittore ripassa il tuo
            nome di vernice fresca.
          pe: { espressivita: 5 }
          imposta: { teatro.primattore: 1 }
          effetti: { rep.teatro: 1, monete: 25, racconto: 1 }
        fallimento:
          titolo: Il buco nel velluto
          testo: |
            A metà del primo atto ti perdi in una battuta e la finisci in un altro
            modo, e la scena dopo non ha più senso. Orazio la rimette in piedi
            improvvisando, ma gli applausi sono educati e dal palco di Tarquin
            Cordani non arriva niente. L'indomani sul cartellone, sopra il tuo
            nome, c'è una striscia di carta, e Orazio ti dice che la toglierà la
            sera che sarai pronto.
          effetti: { monete: 8, scandalo: 0.5 }

      - testo: "Fare da te i duelli"
        descrizione: "Tre duelli e una caduta dal ballatoio, e se li fai tu senza controfigura la sala lo capisce."
        prova: { attributo: fisico, abilita: [acrobazia, armi-da-mischia], difficolta: Media }
        successo:
          titolo: Tre duelli e una caduta
          testo: |
            La sala ti perdona le battute appena tiri fuori la spada di legno.
            Batti i cattivi di Orazio uno dopo l'altro con le finte provate, e
            alla caduta dal ballatoio atterri sulla spalla e la prima fila grida
            davvero. Agli applausi la sala si alza, e Tarquin Cordani applaude per
            primo dal suo palco. L'indomani il pittore ripassa il tuo nome di
            vernice fresca.
          pe: { acrobazia: 5 }
          imposta: { teatro.primattore: 1 }
          effetti: { rep.teatro: 1, monete: 25, racconto: 1 }
        fallimento:
          titolo: La caduta vera
          testo: |
            Al terzo duello sbagli una finta e colpisci Orazio sul polso per
            davvero, e lui trasforma il grido in una battuta che non c'era. La
            caduta dal ballatoio la fai storta, e finisci lo spettacolo zoppicando
            mentre la sala applaude il coraggio. L'indomani sul cartellone, sopra
            il tuo nome, c'è una striscia di carta, e Orazio ti dice che la
            toglierà quando sarete guariti tutti e due.
          effetti: { monete: 8, ferite: 1 }

      - testo: "Recitare pensando a com'è andata davvero"
        descrizione: "Le parole sono di Orazio, ma la paura di quella sera è tua, e basta lasciarla salire senza farsi portare via."
        prova: { attributo: mentale, abilita: [resilienza, percezione], difficolta: Media }
        successo:
          titolo: La sala zitta
          testo: |
            Dici le battute di Orazio lasciando che ti torni in mente quella sera
            vera, con le mani che tremavano, e la voce ti esce più bassa, un poco
            roca. La sala, venuta per ridere, a metà del secondo atto ti segue in
            silenzio. Agli applausi c'è un momento vuoto, poi si alzano tutti, con
            Tarquin Cordani per primo. L'indomani il pittore ripassa il tuo nome
            di vernice fresca.
          pe: { resilienza: 5 }
          imposta: { teatro.primattore: 1 }
          effetti: { rep.teatro: 1, monete: 25, racconto: 1 }
        fallimento:
          titolo: Troppo vicino
          testo: |
            Ti lasci tornare in mente quello che è successo davvero, e ti torna
            tutto insieme, gli odori prima delle immagini. A metà del secondo atto
            resti fermo in mezzo al palco finché Orazio non entra a prenderti per
            un braccio. Il giorno dopo sul cartellone, sopra il tuo nome, c'è una
            striscia di carta di traverso, e Orazio ti dice che la toglierà la
            sera che sarai pronto, senza fretta.
          effetti: { monete: 8, tormento: 1 }

      - testo: "Salire sul palco e parlare come a tavola"
        descrizione: "Forse per una sera non serve essere attori, e basta dire le battute come a un amico."
        costo: 2
        esito:
          titolo: Come a tavola
          testo: |
            Dici le battute di Orazio come le diresti a una tavola di amici. Per
            un po' la sala non capisce, poi qualcuno in loggione ride nel punto
            giusto, e da lì ti vengono dietro. Orazio, nei panni dei cattivi,
            abbassa il tono per starti accanto. Agli applausi Tarquin Cordani si
            alza per primo nel suo palco, e l'indomani il pittore ripassa il tuo
            nome di vernice fresca.
          pe: { espressivita: 5 }
          imposta: { teatro.primattore: 1 }
          effetti: { rep.teatro: 1, monete: 20, racconto: 1 }

      - testo: "Dire a Orazio che stasera non ce la fai"
        descrizione: "Il sostituto c'è, e sa le battute. Il tuo nome può aspettare sul cartellone."
        costo: 0
        esito:
          titolo: Il sostituto
          testo: |
            Glielo dici a voce bassa dietro il sipario, con le orecchie che
            scottano. Orazio mette in mano all'attor giovane la tua spada di legno
            senza una parola di rimprovero, e dalla quinta guardi lui fare la tua
            parte con un entusiasmo che ti imbarazza un po'. L'indomani sul
            cartellone, sopra il tuo nome, c'è una striscia di carta. «La carta la
            togliamo quando vuoi tu» dice Orazio.

  # ------------------------------------------------------------ la carta
  - id: carta-un-manifesto-strappato
    immagine: personaggi/orazio-belcanto
    titolo: Un manifesto strappato
    sommario: "Qualcuno ha ritagliato la faccia di Orazio Belcanto da un manifesto, e il garzone del Teatro non sa come dirglielo."
    luogo: Quartieri Alti, un muro vicino alla piazza
    tipo: carta
    area: quartieri-alti
    requisiti: [rep.teatro < 2]
    testo: |
      Sul muro c'è un manifesto del Teatro delle Meraviglie con Orazio Belcanto
      a figura intera, una mano tesa verso chi passa. Al posto della faccia c'è
      un buco tondo.

      Ai piedi del muro un garzone con un secchio di colla guarda il buco. «È il
      quarto da stamattina» ti dice. «Il signor Belcanto dice che se ne
      strappano un altro chiude il teatro per lutto, e la faccia io non la so
      disegnare.»

      Di fronte, sulla soglia di un forno, due bambine giocano con un tondo di
      carta che una si tiene davanti agli occhi.
    opzioni:
      - testo: "Aiutare il garzone a rattoppare il manifesto"
        descrizione: "Con carta da pacchi e una faccia disegnata alla meglio il garzone ti sarà grato almeno fino a stasera."
        esito:
          titolo: Una faccia alla meglio
          testo: |
            Ti fai dare dal fornaio un foglio di carta da pacchi e ritagli un
            tondo della misura giusta, che il garzone incolla da dietro. Sopra
            disegni una faccia con il mento alto e le sopracciglia inarcate, con
            la lingua fra i denti come a scuola. Il garzone dice che il signor
            Belcanto ci si riconoscerà, e ti dice di passare al Teatro, dove
            cercano sempre gente.
          effetti: { rep.teatro: 0.5 }

      - testo: "Andare a parlare con le bambine"
        descrizione: "Quel pezzo di carta tondo ha due fori per gli occhi, e un'aria offesa che conosci."
        prova: { attributo: sociale, abilita: [empatia, conoscenze-della-strada], difficolta: Facile }
        successo:
          titolo: Quattro Orazi
          testo: |
            Le bambine hanno quattro facce di Orazio e giocano a fare il teatro, e
            una dice «anima mia» con una precisione che fa paura. Gliene compri
            tre con la promessa di portarle una sera in loggione, e la quarta la
            lasci a quella che fa meglio la voce. Il garzone rincolla le facce ai
            manifesti e si fa dire il tuo nome per riferirlo al signor Belcanto.
          pe: { empatia: 2 }
          effetti: { rep.teatro: 0.5 }
        fallimento:
          titolo: La fuga
          testo: |
            Appena ti avvicini le bambine scappano nel vicolo con le loro
            maschere, gridando con la voce di Orazio e ridendo tanto da
            inciampare. Il garzone ti dice che il signor Belcanto chiuderà il
            teatro per lutto, e che sarà colpa di tutti e due.
          effetti: { scandalo: 0.5 }

      - testo: "Tirare dritto"
        descrizione: "Le facce di Orazio sono un problema di Orazio."
        costo: 0
        esito:
          titolo: Il quarto manifesto
          testo: |
            Lasci il garzone davanti al suo buco e prosegui verso la piazza. Due
            strade più in là un altro manifesto del Teatro ha ancora la faccia di
            Orazio, e una vecchia con la sporta della spesa si ferma a guardarlo e
            si sistema i capelli sotto il fazzoletto, come se lui potesse vederla.
