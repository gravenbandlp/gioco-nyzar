# La città viva, luogo 9: il Teatro delle Meraviglie (presso: teatro-delle-meraviglie, area quartieri-alti).
# L'attività dietro le quinte (con pista.teatro != 1, per non sovrapporsi alle prove della Promessa), le tre
# storie di rep.teatro (2 la sartoria, con il seguito della Fusari; 4 il copione nuovo, con il seguito della
# lettura; 6 il nome sul cartellone, che mette in scena quel copione e quindi chiede teatro.copione) e la carta
# del manifesto strappato. Il servizio (le prove, la prima e le repliche della Promessa dell'Arpia) sta già in
# contenuti/piste/teatro.yaml.
# Reputazione: le storie la portano a 3, 5 e 7; le funi, la comparsa e la buca la fanno salire fino a 4, la
# macchina del volo (Fisico), il libro di scena (Mentale) e la sostituzione (Sociale, Difficile) fino a 6.
# Teodora Fusari, la sarta, è un personaggio nuovo e minore, inventato per la storia a 2.
storylet:
  # ------------------------------------------------------------ l'attività ripetibile
  - id: dietro-le-quinte
    presso: teatro-delle-meraviglie
    immagine: ambientazione/teatro-delle-meraviglie
    titolo: Dietro le quinte
    sommario: "Quando non c'è la Promessa dell'Arpia, il Teatro vive di repertorio, e dietro il sipario rosso servono sempre mani."
    luogo: Teatro delle Meraviglie, dietro le quinte
    area: quartieri-alti
    ripetibile: true
    requisiti: [pista.teatro != 1]
    testo: |
      Quando non c'è la Promessa dell'Arpia, il Teatro delle Meraviglie tira
      avanti con il repertorio di Orazio, farse in due atti che il pubblico
      sa a memoria e torna a vedere lo stesso, per ridere un attimo prima
      della battuta. Dietro le quinte corre un corridoio stretto che odora di
      colla e di cerone, e l'odore ti si attacca ai vestiti prima ancora che
      tu abbia fatto qualcosa per meritartelo. Le funi del sipario sono
      legate a caviglie di ferro piantate nel muro, ognuna con il suo
      nastrino colorato, e il vecchio macchinista sonnecchia su un rotolo di
      corda e apre un occhio solo quando qualcuno sbaglia colore. Davanti al
      palco c'è la buca del suggeritore, chiusa da una cupoletta di legno
      dorato, e da un vicolo sul fianco si entra al botteghino del loggione.

      {origine apprendista-raschiatore} Sulle piattaforme della Cicatrice
      le funi si legano a caviglie di ferro come queste, e si riconoscono
      dal colore perché nessuno ha il tempo di leggere. Qui, se sbagli fune,
      scende un lampadario di vetro, e ti pare quasi un lusso.

      {atletica Facile} Le funi salgono fino al graticcio, molto sopra le
      assi, e chi le tira per tutta la sera ha bisogno di spalle buone. Il
      macchinista le sue, a giudicare dalle dita, le ha consumate qui.

      Sulla porta del camerino di Orazio c'è una stella dipinta e ridipinta
      tante volte che adesso ha sei punte. Lui passa nel corridoio con mezza
      faccia di cerone e un copione arrotolato in pugno, e chiede a tutti
      quelli che incontra se hanno visto le sue pastiglie alla menta. «Anime
      mie, il sipario fra un'ora!» annuncia, e nessuno alza la testa. Lo
      stipite, all'altezza della spalla, ha la vernice consumata fino al
      legno, perché chi va in scena ci batte sopra le nocche due volte per
      scaramanzia, anche quelli che giurano di non crederci.

      {espressivita Media} Le pastiglie sono nella tasca interna della sua
      giacca. Lo sa benissimo, ma chiederle a tutti è il suo modo di
      scaldare la voce e di contare chi c'è.
    opzioni:
      - testo: "Stare alle funi del sipario"
        descrizione: "Il vecchio macchinista ha le dita storte dalle corde, e cerca qualcuno che le abbia ancora dritte."
        requisiti: [rep.teatro < 2]
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Media }
        successo:
          titolo: Il nastrino rosso
          testo: |
            Il macchinista ti mette davanti alla ruota del sipario e ti spiega
            i nastrini una volta sola, senza guardare la legenda appesa al muro.
            Al segnale giri la ruota a braccia tese, e il velluto rosso si apre
            senza uno strappo sulla prima scena della farsa. Dalla sala arriva
            la prima risata, e ti accorgi di averla aspettata anche tu. Fra un
            atto e l'altro lui ti passa la fiaschetta che sa di prugne. A fine
            serata ti dice di tornare domani, che per lui è già un discorso
            lungo, e ti mette in mano uno spicciolo.
          effetti: { monete: 1, rep.teatro: 0.5 }
        fallimento:
          titolo: Il nastrino nero
          testo: |
            Al segnale afferri la fune sbagliata, quella con il nastrino nero,
            e sopra la platea il lampadario scende di un braccio con un
            tintinnio di gocce di vetro. In sala qualcuno grida, e a te si
            gelano le mani sulla corda. Il macchinista ti toglie la fune di
            mano e lo riporta su prima che Orazio se ne accorga, poi ti squadra
            masticando qualcosa. Per il resto della sera ti lascia tenere la
            lanterna, che non è attaccata a niente.

      - testo: "Stare alle funi del sipario"
        descrizione: "Ormai il macchinista ti lascia la ruota e va a dormire sul suo rotolo di corda. Quando un fondale si incastra in alto, però, sveglia te."
        requisiti: [rep.teatro >= 2, rep.teatro < 4]
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Media }
        successo:
          titolo: Il graticcio
          testo: |
            A metà del secondo atto il fondale del giardino si incastra a
            mezz'aria, con un albero dipinto che penzola sopra la testa di
            Orazio. Sali la scala a pioli fino al graticcio, dove le assi
            scricchiolano a ogni passo e la polvere ti va negli occhi, e liberi
            la fune da un chiodo storto. Sotto di te la platea è un mare di
            teste, e preferisci non guardarlo a lungo. Il fondale scende al suo
            posto. Orazio, che intanto ha recitato tutta la scena guardando in
            su, ti paga la serata. Poi ti chiede di salire ogni sera a
            controllare quel chiodo.
          effetti: { monete: 2, rep.teatro: 0.5 }
        fallimento:
          titolo: L'albero di tela
          testo: |
            Sali al graticcio e tiri la fune con troppa forza, e il fondale si
            sgancia dall'altro capo e cade di piatto sul palco con un sospiro di
            tela. Orazio si trova di colpo davanti a un giardino sdraiato. Lo
            scavalca con dignità, alzando il ginocchio come sopra una
            pozzanghera, e finisce la scena, e la platea pensa che sia voluto.
            Il macchinista ha capito benissimo, e per due sere non ti offre la
            fiaschetta.

      - testo: "Fare la comparsa"
        descrizione: "Nella farsa della *Vedova dei tre ponti* c'è una guardia che sta ferma per tutto il secondo atto e dice una battuta sola. Di solito è la parte più difficile."
        requisiti: [rep.teatro < 4, campione == 0]
        prova: { attributo: sociale, abilita: espressivita, difficolta: Media }
        successo:
          titolo: Alt, chi va là
          testo: |
            Ti infilano un elmo di latta che ti arriva al naso e una lancia di
            legno dipinta d'argento, e ti piazzano accanto alla porta di cartone
            della vedova. Stai fermo per tutto il secondo atto, con un prurito
            sotto l'elmo che non puoi grattare, anche quando Orazio, che la
            vedova la fa lui, ti pizzica una guancia per far ridere la platea.
            Al momento giusto dici «Alt, chi va là» con una voce così seria che
            il loggione applaude. Orazio ti paga la serata e decide che d'ora
            in poi la guardia avrà due battute.

            {resistenza Media} Un atto intero sull'attenti, con la lancia in
            pugno e il polpaccio che ti si indurisce. Le gambe hanno retto, e
            domani te lo faranno pagare.
          effetti: { monete: 2, rep.teatro: 0.5 }
        fallimento:
          titolo: La guardia ride
          testo: |
            Stai fermo accanto alla porta di cartone per tutto il secondo atto,
            finché Orazio, che la vedova la fa lui, ti pizzica una guancia. Ti
            scappa una risata dal naso e subito dopo un'altra, e l'elmo di
            latta ti scivola sugli occhi. Dal loggione qualcuno grida di
            arrestare la guardia. Dietro le quinte Orazio ti paga in pastiglie
            alla menta, che ha appena ritrovato in tasca, e ti perdona con un
            gesto largo.

      - testo: "Fare la comparsa"
        immagine: personaggi/orazio-belcanto
        descrizione: "Il loggione ti ha visto vincere all'Arena, e la tua faccia se la ricorda anche sotto un elmo di latta."
        requisiti: [rep.teatro < 4, campione >= 1]
        prova: { attributo: sociale, abilita: espressivita, difficolta: Media }
        successo:
          titolo: Il campione con l'elmo di latta
          testo: |
            Ti infilano l'elmo di latta e ti piazzano accanto alla porta di
            cartone, e a metà del primo atto qualcuno in loggione ti riconosce.
            Il tuo nome passa di bocca in bocca fino alla prima fila, e quando
            dici «Alt, chi va là» la sala viene giù. Orazio, che fa la vedova,
            aspetta che l'applauso finisca con un sorriso di gesso. Dietro le
            quinte ti paga e ti prega, con la voce più alta del solito, di
            tenere la visiera abbassata.

            {galateo Media} Nel suo teatro l'applauso più lungo spetta a lui.
            Un primo attore perdona tutto a una comparsa, tranne questo.
          effetti: { monete: 2, rep.teatro: 0.5 }
        fallimento:
          titolo: Il saluto del campione
          testo: |
            Il loggione ti riconosce sotto l'elmo e comincia a gridare il tuo
            nome a ogni battuta di Orazio. Provi a restare serio, poi il braccio
            alza la lancia per salutare prima che tu glielo abbia permesso, e
            la porta di cartone cade all'indietro con tutta la vedova dietro.
            Orazio si rialza tenendosi la parrucca. Nel camerino ti paga una
            miseria senza dire una parola, e in compagnia se ne parla per
            giorni, perché nessuno l'aveva mai visto zitto per tanto tempo.
          effetti: { monete: 1 }

      - testo: "Suggerire dalla buca"
        descrizione: "Il suggeritore ha il raffreddore. Nella buca si sta piegati, con il copione su un leggio e le scarpe degli attori a un palmo dal naso."
        requisiti: [rep.teatro < 4]
        prova: { attributo: mentale, abilita: [percezione, accademiche], difficolta: Media }
        successo:
          titolo: La mezza pagina
          testo: |
            Ti infili nella buca con il copione sul leggio e una candela
            schermata, e segui le battute con il dito. Le scarpe di Orazio
            hanno la fibbia d'argento e la suola consumata storta, tutta dalla
            parte del tallone sinistro. A metà del secondo atto salta mezza
            pagina per arrivare prima alla scena in cui piange. Tu la salti con
            lui senza perdere il segno, e agli altri suggerisci la battuta
            giusta per andargli dietro. In platea non se ne accorge nessuno.
            Quando esci hai le ginocchia segnate dalle assi, e Orazio ti mette
            in mano qualche moneta senza ammettere niente.
          effetti: { monete: 2, rep.teatro: 0.5 }
        fallimento:
          titolo: La candela
          testo: |
            Nella buca la candela si spegne a metà del primo atto, e per
            riaccenderla perdi il segno, sudando in un buio che puzza di
            scarpe. Quando lo ritrovi l'attor giovane ha già inventato due
            battute, e la vedova gli ha risposto con altre tre. Suggerisci
            quella che ti sembra giusta, e la scena torna indietro di una
            pagina intera. Dopo, Orazio ti spiega che un suggeritore si sente
            solo quando sbaglia, e ti fa vedere come si tiene il dito sul
            copione.

      - testo: "Vendere i biglietti del loggione"
        descrizione: "Il botteghino del loggione dà sul vicolo. I posti costano poco, e chi passa di lì di solito ha già speso tutto all'osteria."
        prova: { attributo: sociale, abilita: persuasione, difficolta: Facile }
        successo:
          titolo: Otto biglietti
          testo: |
            Ti siedi nel botteghino con la cassetta di latta e un mazzo di
            biglietti stampati storti, e chiami la gente che passa nel vicolo.
            Una squadra di Raschiatori di ritorno dagli scavi si ferma a ridere
            davanti alla locandina, ancora con la polvere del Labirinto nelle
            rughe, e tu li convinci che la vedova di Orazio è la cosa più
            divertente che vedranno quest'anno. Ne prendono otto, e uno torna
            indietro a comprarne un altro per sua madre. A fine serata Orazio
            conta la cassetta e ti dà la tua parte.

            {conoscenze-della-strada Facile} Chi torna dagli scavi ha voglia di
            ridere e la paga fresca in tasca, e conviene prenderlo prima che
            arrivi all'osteria.
          effetti: { monete: 3 }
        fallimento:
          titolo: Creditori e gatti
          testo: |
            Stasera nel vicolo passano soprattutto creditori e gatti, e i pochi
            che si fermano chiedono se il biglietto del loggione vale anche per
            la platea. Ne vendi tre, uno a una vecchia che cercava soltanto un
            posto al coperto per contare le sue monete, e che le conta davanti
            a te due volte per farti vedere che sono poche. Orazio conta la
            cassetta in un attimo e ti dà la tua parte, che è poca.
          effetti: { monete: 1 }

      - testo: "Spazzare la sala dopo lo spettacolo"
        descrizione: "A sala vuota la donna delle pulizie ha bisogno di una scopa in più, e di qualcuno che le tenga il secchio."
        quando: [pista.arena < 2]
        esito:
          titolo: Le cose perse
          testo: |
            Spazzi fra le poltrone della platea mentre la donna delle pulizie
            passa lo straccio sulle assi del palco, canticchiando la canzone
            del secondo atto una nota sotto. Sotto una poltrona trovi un
            ventaglio rotto e un biglietto d'amore senza firma, e lei ti mostra
            la cassetta dove mette le cose perse, che non torna mai a chiedere
            nessuno. Il biglietto lo legge prima di metterlo via. Ti dice che
            da quando lavora qui quello lì l'ha trovato cento volte, sempre
            uguale tranne il nome, e ti offre mezza mela per il disturbo.
          pe: { percezione: 2 }

      - testo: "Spazzare la sala dopo lo spettacolo"
        immagine: personaggi/orazio-belcanto
        descrizione: "Orazio torna dall'Arena con la voce rovinata, e il teatro va chiuso lo stesso."
        quando: [pista.arena >= 2]
        esito:
          titolo: La voce di Orazio
          testo: |
            Stai spazzando fra le poltrone quando entra Orazio, ancora con la
            giacca dell'Arena che manda lampi sotto la lanterna, e si siede sul
            bordo del palco con le gambe a penzoloni, come un ragazzo su un
            muretto. Ha gridato nomi per tutto il pomeriggio e adesso gli esce
            solo un soffio. Gli porti acqua calda e miele dalla stufetta del
            camerino, e lui la beve a piccoli sorsi tenendo la tazza con tutte
            e due le mani inanellate. «Cinquemila persone, anima mia» sussurra,
            «e il biglietto non l'hanno pagato a me.»

            {medicina Facile} Corde vocali gonfie. Due giorni di silenzio e di
            miele, che per un uomo come lui saranno la parte difficile.
          pe: { empatia: 2 }

      - testo: "Manovrare la macchina del volo"
        immagine: personaggi/violante
        descrizione: "Nella farsa nuova Violante scende dal soffitto vestita da luna. L'imbracatura è legata a un contrappeso di sacchi di sabbia, e il contrappeso lo regge chi sta all'argano."
        requisiti: [rep.teatro >= 4, rep.teatro < 6]
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Media }
        successo:
          titolo: La luna
          testo: |
            Ti metti all'argano con i piedi puntati contro la trave e lasci
            scorrere la fune un palmo alla volta. Le braccia ti si tendono fino
            alle spalle, e per tutta la discesa non sbatti quasi le palpebre.
            Violante scende dal buio del soffitto in una veste d'argento, con la
            falce di luna sulla testa, e si ferma a un braccio dalle assi
            proprio sulla sua battuta. Quando la riporti su ti fanno male le
            spalle fino al collo. Lei, sganciandosi l'imbracatura, ti dice che
            di solito a metà discesa recita una preghiera e che stasera se n'è
            dimenticata. Orazio ti paga bene e ti chiede di tenere le mani così
            anche domani.
          effetti: { monete: 4, rep.teatro: 0.5 }
        fallimento:
          titolo: La luna storta
          testo: |
            A metà discesa la fune ti scivola di un palmo fra le mani, e
            Violante scende di colpo e si ferma storta, con la falce di luna di
            traverso sulla fronte. Recita la sua battuta a testa in giù senza
            perdere una sillaba, e il loggione applaude più del solito. Dietro
            le quinte ti guarda i palmi bruciati e ti chiede, con molta
            gentilezza, di non farlo mai più.

            {resistenza Media fallita} I palmi bruciano come se avessi stretto
            una padella. Domani terrai il cucchiaio con due dita, e il bicchiere
            con nessuna.
          effetti: { monete: 1, ferite: 0.5 }

      - testo: "Tenere il libro di scena"
        descrizione: "Chi tiene il libro di scena dà il via alle luci e alle entrate, e risponde a Orazio di tutto quello che va storto. Di solito Orazio non lo affida a nessuno."
        requisiti: [rep.teatro >= 4, rep.teatro < 6]
        prova: { attributo: mentale, abilita: [percezione, accademiche], difficolta: Media }
        successo:
          titolo: Tutte le entrate
          testo: |
            Ti siedi in quinta su uno sgabello alto con il libro di scena sulle
            ginocchia, e ogni pagina porta i segni a matita rossa e blu di
            vent'anni di repliche, riscritti uno sopra l'altro.
            Dai il via alle lampade della ribalta e alle entrate, e tieni
            d'occhio la sala per capire dove ride e dove si annoia. Due volte
            allunghi una pausa perché il loggione sta ancora ridendo. A fine
            serata Orazio sfoglia il libro fino alla tua pagina e ci scrive la
            data, come fa per le sere che vuole ricordare, e ti paga come si
            deve.

            {percezione Media} Sulle pagine più vecchie ci sono date così
            sbiadite da sembrare impronte. Molte sono di sere in cui, a quanto
            pare, non è successo niente di speciale, se non che lui era felice.
          effetti: { monete: 4, rep.teatro: 0.5 }
        fallimento:
          titolo: Il tuono in anticipo
          testo: |
            A metà del primo atto leggi un segno vecchio al posto di quello
            nuovo, e il tuono di lamiera arriva durante la scena d'amore.
            Orazio, che si sta dichiarando in ginocchio, alza gli occhi al
            soffitto e decide che è un presagio. Recita il resto della scena
            con il terrore negli occhi, e la platea ride come non le capitava da
            mesi. Tu, in quinta, vorresti scomparire dentro il libro. Dopo, nel
            camerino, ti spiega la differenza fra la matita rossa e quella blu,
            e ti dà la paga.
          effetti: { monete: 2 }

      - testo: "Prendere la parte di un attore malato"
        descrizione: "L'attor giovane ha la febbre, e la farsa va in scena fra un'ora. Orazio ti mette in mano il copione e ti studia da capo a piedi."
        requisiti: [rep.teatro >= 4, rep.teatro < 6]
        prova: { attributo: sociale, abilita: [espressivita, ingannare], difficolta: Difficile }
        successo:
          titolo: Un'ora per quaranta battute
          testo: |
            Hai un'ora per imparare quaranta battute, e ne impari trenta,
            ripetendole a mezza voce contro il muro del corridoio. Le altre
            dieci le inventi in scena, guardando Orazio negli occhi finché lui
            non capisce dove vuoi arrivare e ti viene dietro. Alla fine del
            secondo atto la tua versione è un po' più corta di quella scritta e
            fa ridere di più, e Orazio lo sa benissimo. Nel camerino ti conta
            le monete sul tavolo e annota qualcosa sul margine del copione, con
            la matita che tiene dietro l'orecchio.

            {ingannare Media} Una battuta inventata funziona se la dici come se
            l'avessi provata cento volte. Il pubblico si fida di chi parla
            sicuro, e in platea il copione ce l'ha soltanto il suggeritore.
          effetti: { monete: 6, rep.teatro: 0.5 }
        fallimento:
          titolo: Un tanto per atto
          testo: |
            Hai un'ora per imparare quaranta battute, e in scena te ne restano
            in testa una dozzina. Al terzo vuoto Orazio comincia a dire anche
            le tue, cambiando voce ogni volta, e per tutto il secondo atto
            recita la scena da solo mentre tu annuisci con grande convinzione.
            In platea credono che sia uno scherzo previsto, e ridono. Nel
            camerino Orazio si toglie il cerone in silenzio e ti paga una
            miseria, calcolata un atto alla volta.
          effetti: { monete: 2 }

      - testo: "Recitare la tua sera in cartellone"
        descrizione: "Il tuo nome è sul cartellone, sotto quello di Orazio. Una sera alla settimana la sala viene anche per te."
        requisiti: [teatro.primattore >= 1]
        prova: { attributo: sociale, abilita: [espressivita, persuasione], difficolta: Media }
        successo:
          titolo: La tua sera
          testo: |
            La sala è piena fino al loggione, e quando entri in scena qualcuno
            in platea dice la tua prima battuta insieme a te, sottovoce. Ormai
            sai dove il pubblico ride e lo lasci ridere prima di andare avanti,
            con la pazienza di un cocchiere che lascia bere i cavalli. Agli
            applausi Orazio ti spinge avanti di un passo, e poi si mette davanti
            lui per l'inchino. Nel camerino il tuo sacchetto di velluto ti
            aspetta sulla toeletta, accanto a un biglietto senza firma.
          effetti: { monete: 8 }
        fallimento:
          titolo: Una sera fiacca
          testo: |
            Stasera la battuta ti arriva un momento in ritardo, e la sala se ne
            accorge prima di te. Il secondo atto si trascina fino all'inchino,
            e il loggione applaude per educazione, mentre qualcuno si sta già
            infilando il cappotto. Orazio, nel camerino, ti dice che le
            sere fiacche servono a far brillare le altre, e ti paga lo stesso,
            un po' meno del solito.
          effetti: { monete: 5 }

  # ------------------------------------------------------------ storia a 2 · la sartoria
  - id: la-sartoria
    presso: teatro-delle-meraviglie
    immagine: personaggi/orazio-belcanto
    titolo: La sartoria
    sommario: "Per la terza volta in un mese un costume si è aperto in scena davanti a tutta la platea. Orazio Belcanto cerca un colpevole, e ha già deciso chi è."
    luogo: Teatro delle Meraviglie, la sartoria sotto il tetto
    area: quartieri-alti
    requisiti: [rep.teatro >= 2, teatro.costumi == 0]
    testo: |
      La sartoria del Teatro è una stanza lunga sotto il tetto, con una sola
      finestra alta che dà sui comignoli dei Quartieri Alti. Sotto le tegole
      l'aria è calda e ferma, e odora di naftalina. Dalle
      travi pendono i costumi di tutto il repertorio, infilati in sacchi di
      tela con il nome scritto sopra. Su un manichino senza testa c'è il
      corpetto della vedova, quello che Orazio indossa nella farsa, aperto sul
      fianco dall'ascella alla vita. Ieri sera si è aperto così in scena sotto
      le lampade, e la platea ha visto la camicia di Orazio.

      Orazio cammina avanti e indietro fra i manichini. «È la terza volta in
      un mese, anima mia. C'è una mano nemica in questo teatro, e io so da
      dove viene» dice, e abbassa la voce di mezzo tono. «Al Grifone di Ferro
      le forbici non mancano di sicuro.»

      {politica-ed-economia Media} Ogni sera che la gente passa a bere in
      una taverna è una sera in cui non compra un biglietto. A Orazio un
      colpevole che vende vino conviene due volte.

      In fondo alla stanza, accanto alla finestra, è seduta Teodora Fusari, la
      sarta che veste Orazio da quando lui faceva il garzone di bottega. È
      piccola e curva, con un cuscinetto di spilli legato al polso, e ha sulle
      ginocchia un altro costume da rammendare. Infila l'ago tenendolo a un
      braccio di distanza dagli occhi, e ci mette molto. Quando Orazio esce
      sbattendo la porta lei non alza la testa.

      {medicina Difficile} Allontana l'ago per metterlo a fuoco, e strizza
      gli occhi anche verso la finestra. Gli occhi le si stanno velando, e
      da parecchio tempo.

      *Orazio il colpevole ce l'ha già, e adesso gli serve qualcuno che glielo
      confermi.* Ti avvicini al manichino, e la Fusari ti segue con gli occhi
      senza smettere di cucire.
    opzioni:
      - testo: "Esaminare la cucitura"
        descrizione: "Un filo tagliato e un filo che cede, guardati da vicino, sono due cose diverse."
        prova: { attributo: mentale, abilita: [percezione, tecnologia], difficolta: Media }
        successo:
          titolo: Punti lunghi
          testo: |
            Giri il corpetto verso la luce e passi il pollice lungo il fianco
            aperto. Il filo è intero da un capo all'altro e si è soltanto
            sfilato, perché i punti sono lunghi il doppio del normale e storti,
            e in qualche tratto l'ago è passato fuori dalla stoffa senza
            prenderla. Più in alto, dove la cucitura è vecchia, i punti sono
            piccoli e dritti come una fila di formiche. La stessa mano, a
            distanza di anni. Ti volti verso la finestra. La Fusari ha smesso
            di cucire e ti guarda, con l'ago fermo a mezz'aria.
          segue: la-sarta-di-orazio
        fallimento:
          titolo: Un filo rosso
          testo: |
            Giri il corpetto da tutte le parti e ti fermi su un filo rosso che
            con il costume non c'entra niente. Lo porti a Orazio, e lui lo alza
            controluce fra due dita e dice, trionfante, che al Grifone le tende
            sono rosse. Nel giro di un'ora mezza compagnia sa che Liaren
            Tarvelin taglia i costumi di notte, e l'altra metà lo sa entro
            sera. Quando torni in sartoria la Fusari ha ricominciato a cucire,
            e non ti guarda più.

            {percezione Media fallita} In un teatro i fili rossi si trovano
            dappertutto, a cominciare dal sipario. Te lo dici adesso, con molto
            ritardo.

      - testo: "Parlare con la Fusari"
        descrizione: "Quando Orazio grida lei non alza la testa. Forse con qualcuno che non grida parla."
        prova: { attributo: sociale, abilita: [empatia, galateo], difficolta: Media }
        successo:
          titolo: Il rocchetto
          testo: |
            Prendi uno sgabello, ti siedi accanto a lei e le chiedi del
            corpetto, e poi di Orazio da ragazzo, che è un argomento più facile.
            Lei sorride e ti racconta di un garzone magro che non stava mai
            fermo durante le prove dei costumi. Le cade un rocchetto di filo
            bianco. Quando glielo porgi lei lo cerca tastando con le dita aperte
            sul tuo palmo, e smette di sorridere. «Il filo me lo infila mia
            nipote, la mattina» dice piano, «e ne prepara venti aghi. Quando
            finiscono aspetto il giorno dopo, e ieri ne aveva preparati
            diciannove.»
          segue: la-sarta-di-orazio
        fallimento:
          titolo: Il costume da finire
          testo: |
            Le chiedi del corpetto con troppa fretta, e lei capisce che cosa
            cerchi prima che tu finisca la domanda. «Ho trent'anni di lavoro qui
            dentro e un costume da finire per stasera» dice, e si gira verso la
            finestra. Per tutto il tempo che resti nella stanza tiene l'ago
            fermo in mano senza dare un punto, e tu non trovi niente da dire
            che non suoni come un interrogatorio. Quando esci senti la sedia
            che si sposta, e la chiave che gira nella serratura alle tue spalle.

      - testo: "Tornare in sartoria di notte"
        descrizione: "Se qualcuno tocca i costumi di nascosto, lo fa quando il teatro è chiuso. Serve soltanto pazienza, e una notte di sonno in meno."
        costo: 2
        esito:
          titolo: La candela
          testo: |
            Ti fai chiudere dentro dal macchinista e aspetti nel buio fra i
            sacchi dei costumi, con la naftalina che ti pizzica il naso e una
            gamba che si addormenta molto prima di te. Verso mezzanotte
            la porta si apre. È la Fusari, con una candela in mano e il
            corpetto della vedova sotto il braccio. Si siede alla finestra,
            avvicina la candela finché la fiamma le scalda la faccia e prova a
            rifare la cucitura da capo. Dopo un'ora ha dato tre punti. Quando
            esci dal buio non si spaventa, e ti porge l'ago senza dire niente.

            {furtivita Facile} Ti ha sentito arrivare dal primo scricchiolio.
            Ha deciso di aspettare che uscissi tu.
          segue: la-sarta-di-orazio

  - id: la-sarta-di-orazio
    immagine: ambientazione/teatro-delle-meraviglie
    titolo: La sarta di Orazio
    tipo: seguito
    luogo: Teatro delle Meraviglie, la sartoria sotto il tetto
    area: quartieri-alti
    requisiti: [teatro.costumi == 0]
    testo: |
      La Fusari posa il corpetto sulle ginocchia e ci appoggia sopra le mani,
      che hanno i polpastrelli segnati da mille punture. «Gli occhi mi vanno
      via da un anno» dice. «Da vicino vedo una nebbia, e la nebbia ogni mese
      si allarga un poco. Mia nipote mi infila gli aghi la mattina, e le
      cuciture lunghe le faccio a memoria.» Guarda la porta da cui è uscito
      Orazio. «Lui mi tiene perché gli ho cucito il primo costume, quando aveva
      quindici anni e me lo rubava per provarselo allo specchio. Se lo sa mi
      dà una pensione e un posto in platea, e io in platea muoio in un mese.»

      {empatia Facile} La nebbia la spaventa meno della platea. Un posto in
      prima fila, per lei, vorrebbe dire diventare un'ospite nel teatro dove
      per trent'anni è stata di casa.

      {origine fuggiasco-di-ghoran} A Ghoran chi sentiva le mani o gli occhi
      andarsene lo nascondeva fino all'ultimo giorno, perché sulla bilancia
      si pesava anche quello. Riconosci il modo in cui la Fusari tiene l'ago
      lontano dagli occhi, come una cosa che nessuno deve vedere tremare.

      Dalle travi pendono i sacchi dei costumi, ciascuno con il suo nome
      scritto a mano. Molti sono di attori che hanno lasciato la compagnia da
      anni, e lei non ne ha buttato via nessuno. Sul tavolo, accanto al
      cuscinetto degli spilli, c'è una lente da orologiaio con il manico
      fasciato di stoffa, che lei deve aver provato e messo da parte.

      {tecnologia Media} La lente è buona, ma per cucire servono due mani
      libere. Con un sostegno a molla da fissare al tavolo sarebbe un'altra
      faccenda.

      Dalla tromba delle scale sale la voce di Orazio, che sta raccontando al
      macchinista delle forbici di Liaren Tarvelin con dettagli che si
      arricchiscono a ogni rampa.
    opzioni:
      - testo: "Dirlo a Orazio"
        descrizione: "È il suo teatro, e lei è la sua sarta. Una verità detta bene gli farà meno male di una bugia sul Grifone."
        immagine: personaggi/orazio-belcanto
        esito:
          titolo: Gli anelli sul tavolo
          testo: |
            Trovi Orazio nel camerino e gli racconti tutto, dalla nebbia agli
            aghi della nipote. Lui ascolta seduto davanti allo specchio, e a metà
            si sfila gli anelli uno alla volta e li allinea sulla toeletta,
            come uno che si prepara a lavarsi le mani. Poi sale in sartoria e
            ti lascia sul pianerottolo, da dove senti soltanto la voce bassa di
            lei, e di lui niente. Quando scende ha gli
            occhi rossi e un foglio in mano. La nipote verrà ogni giorno a
            spese del teatro, e la Fusari d'ora in poi taglierà e disegnerà,
            mentre i punti li daranno gli altri. «Il mio primo costume me l'ha
            cucito lei» ti dice, rimettendosi gli anelli. «E io stavo per
            accusare Liaren.»
          pe: { empatia: 5 }
          imposta: { teatro.costumi: 1 }
          effetti: { rep.teatro: 1 }

      - testo: "Infilarle gli aghi tu"
        descrizione: "La mattina passi dalla sartoria prima che arrivi la compagnia, e il segreto resta fra voi due e la nipote."
        esito:
          titolo: Venti aghi
          testo: |
            Le prometti di passare ogni mattina. Il giorno dopo ti siedi
            accanto a lei alla finestra e infili venti aghi con il filo di
            quattro colori, poi rifai il fianco del corpetto mentre lei ti guida
            la mano e ti dice dove allungare il punto e dove stringerlo. Ha le
            dita leggere e la voce severa, e ti punge due volte per insegnarti.
            La sera il corpetto regge per tutti e due gli atti. Orazio dice a
            tutti che la mano nemica si è spaventata, e ne va molto fiero. La
            Fusari, quando passi, ti tiene da parte una caramella di zucchero
            cotto.
          pe: { tecnologia: 5 }
          imposta: { teatro.costumi: 1 }
          effetti: { rep.teatro: 1 }

      - testo: "Dare ragione a Orazio"
        descrizione: "Orazio ha già il suo colpevole, e una lite con Liaren gli fa più piacere che male. La Fusari tiene il suo posto, e nessuno fa domande."
        immagine: personaggi/liaren-tarvelin
        esito:
          titolo: Le forbici di Liaren
          testo: |
            Scendi nel camerino e dici a Orazio che il filo era tagliato di
            netto. Lui batte le mani una volta. Per il resto della giornata
            racconta a chiunque passi che Liaren Tarvelin gli manda di notte un
            sicario con le forbici, e la sera aggiunge alla farsa una battuta
            sulle taverniere che cuciono male, e in loggione ridono molto. Alla
            porta della sartoria mette un lucchetto. La Fusari ti ringrazia con
            un cenno della testa. L'ago però continua a tenerlo lontano dagli
            occhi, e presto un altro corpetto si aprirà in scena.

            {resilienza Media} La bugia ti è uscita liscia, ed è questo che ti
            resta in gola. Una donna innocente al Grifone pagherà il conto di
            una gentilezza fatta qui.
          pe: { ingannare: 5 }
          imposta: { teatro.costumi: 1 }
          effetti: { rep.teatro: 1 }

  # ------------------------------------------------------------ storia a 4 · il copione nuovo
  - id: un-copione-nuovo
    presso: teatro-delle-meraviglie
    immagine: personaggi/orazio-belcanto
    titolo: Un copione nuovo
    sommario: "Orazio Belcanto vuole uno spettacolo nuovo con un eroe vero. Ha deciso che l'eroe sei tu, e ti aspetta nel camerino con la penna in mano."
    luogo: Teatro delle Meraviglie, il camerino di Orazio
    area: quartieri-alti
    requisiti: [rep.teatro >= 4, teatro.copione == 0]
    testo: |
      Il camerino di Orazio è piccolo e caldo, e lo specchio occupa una
      parete intera, con una fila di lampade a olio tutto intorno che fanno
      sudare chiunque ci si sieda davanti. Sulla toeletta i vasetti del cerone
      stanno allineati per colore, e in mezzo, appoggiato a una bottiglia, c'è
      il ritratto a carboncino di un uomo serio in camicia bianca, l'unica
      cosa nella stanza che Orazio non ha fatto incorniciare d'oro. Sul tavolo
      ci sono fogli pieni di cancellature e di frecce che fanno il giro del
      margine e tornano indietro.

      {percezione Difficile} Il ritratto è girato un poco verso la sedia di
      Orazio, come si gira una persona per sentire meglio. Lui lo sposta
      ogni mattina in quel modo, e probabilmente non se ne accorge più.

      «Anima mia, la città è stanca di arpie» dice Orazio, e ti indica la
      sedia davanti allo specchio. «Vuole un eroe in carne e ossa, e io ho
      deciso di dargli il tuo nome.» Intinge la penna e la tiene sospesa
      sopra il foglio. «Ho raccolto quello che dice la gente, e la gente
      racconta molto e racconta male. Adesso tu mi dici com'è andata, e io la
      racconto meglio.» Si sistema una piuma del cappello senza guardarsi
      allo specchio. «Meglio nel senso dell'Arte, s'intende.»

      {origine mercante-dei-ponti} Sui Ponti una storia si vende come le
      castagne, e chi la compra cerca sempre di pagarla a peso. Orazio la
      vuole gratis e con la penna già intinta, e ti viene da guardare se
      sulla toeletta c'è una bilancia.

      *Il finale l'ha già scritto, e adesso cerca qualcosa da metterci
      prima.* Le lampade ti scaldano la nuca, e senti il sudore che comincia a
      scendere sotto il colletto.

      {resistenza Facile fallita} Dieci minuti davanti a quelle lampade e
      la camicia ti si incolla alla schiena. Orazio, abituato, ha la
      fronte asciutta come un pane.
    opzioni:
      - testo: "Raccontargli la sera del Festival"
        descrizione: "La razzia l'ha vista tutta la città, compreso Orazio, che quel giorno teneva un discorso. Lui però la ricorda a modo suo."
        esito:
          titolo: Il discorso interrotto
          testo: |
            Gli racconti la sera del Festival come l'hai vissuta tu, e Orazio
            scrive in fretta, annuendo, finché arrivi agli orchi. «Io ero sul
            palco dei discorsi e ho continuato a parlare per tenere calma la
            folla, anima mia» dice, con la penna alzata. Dal corridoio
            Violante, che passa in quel momento, dice ad alta voce che quella
            sera l'ha visto saltare giù dal palco per primo. Orazio scrive lo
            stesso, senza voltarsi, con le orecchie che gli diventano rosse
            sotto il cerone. Nel copione gli orchi diventano trecento, e tu
            combatti in mezzo alla piazza mentre lui recita dal palco, finché
            l'ultimo orco si ferma ad ascoltarlo e scappa via piangendo.
          segue: la-lettura-del-copione

      - testo: "Raccontargli del cinghiale della Foresta"
        immagine: personaggi/corin-ashdale
        descrizione: "Un mercante della Gilda, una radura piena di carcasse e una bestia grande come un carro. Orazio lo trova già perfetto così."
        requisiti: [pista.corin >= 3]
        esito:
          titolo: Grande come la Casa dei Nodi
          testo: |
            Gli racconti della Foresta Strisciante e della radura piena di
            carcasse, e di Corin Ashdale che teneva la balestra come un ombrello
            chiuso. Ti torna in naso, per un momento, l'odore dolciastro di
            quella radura. Orazio ride fino alle lacrime e scrive Corin così
            com'è, perché dice che uno così non si inventa. Il cinghiale invece
            cresce a ogni riga. Alla terza pagina è grande come la Casa dei
            Nodi, e alla quinta comincia a parlare. «Un cinghiale muto non regge
            un atto intero» ti spiega, «e così gli do una voce da basso e un
            passato tragico.» Sul margine disegna la bestia di cartapesta, con
            sei paia di gambe di comparse sotto la pancia.
          segue: la-lettura-del-copione

      - testo: "Raccontargli di Capomozzo"
        descrizione: "La strada fino alla fortezza di Balthog e quello che hai riportato in città dai sotterranei. In città se ne parla, e Orazio ascolta tutto quello che si dice in città."
        requisiti: [pista.capomozzo >= 7]
        esito:
          titolo: La principessa
          testo: |
            Gli racconti della strada per la costa e della fortezza di Balthog,
            e Orazio scrive senza alzare la testa fino ai sotterranei, dove si
            ferma con la penna in aria. «È la ragazza con i capelli d'argento
            che sta in Cattedrale, lo sa tutta la città. Ci vedo una principessa
            addormentata in cima a una torre, anima mia» dice, già con gli occhi
            lucidi. Ti si irrigidisce la schiena, e gli dici che lei nel copione non
            entra. Orazio ti guarda per un po', con la penna ferma, poi tira una
            riga sola sulla pagina. «Allora al suo posto metto un tesoro» dice,
            «che almeno non si offende.»

            {empatia Media} Ha capito più di quanto gli hai detto. La riga l'ha
            tirata dritta e senza svolazzi, che per Orazio è una forma di
            rispetto.
          segue: la-lettura-del-copione

      - testo: "Raccontargli della finale all'Arena"
        immagine: personaggi/toren-galdrick
        descrizione: "La finale l'ha annunciata lui, dalla tribuna. Vuole sapere come si vedeva da giù, dalla sabbia."
        requisiti: [pista.arena >= 5, campione >= 1]
        esito:
          titolo: Lo sceriffo imbottito
          testo: |
            Gli racconti della finale vista dalla sabbia, con Galdrick che ti
            saluta alzando la lama sul camminamento bagnato, e ti accorgi che
            le mani ti si chiudono da sole sull'elsa che non hai. Orazio vuole
            sapere soprattutto che cosa si prova quando la folla grida il tuo
            nome, e quando glielo dici lo scrive due volte. Galdrick, decide,
            lo farà lui, con un'imbottitura sulle spalle e una barba finta.
            «Lo sceriffo ha le spalle, e io ho il talento» spiega. Nel copione
            la pozza dell'Arena diventa un lago di fuoco, e al posto della
            cintura del campione Orazio ti mette in testa una corona d'alloro,
            perché dal loggione si vede meglio.
          segue: la-lettura-del-copione

      - testo: "Raccontargli della finale all'Arena"
        immagine: personaggi/toren-galdrick
        descrizione: "Nella finale ha vinto Galdrick, di un soffio. Orazio era sulla tribuna e se lo ricorda bene."
        requisiti: [pista.arena >= 5, campione == 0]
        esito:
          titolo: Sul mio palco vinci tu
          testo: |
            Gli racconti della finale e del momento in cui hai sbagliato, e il
            punto ti fa ancora male, come un livido che si preme. Orazio ascolta
            con la penna ferma e la faccia di un uomo a un funerale. Quando
            arrivi al premio del secondo scuote la testa. «Sul mio palco il
            secondo posto non l'ho mai messo in scena, e non comincio adesso»
            dice, e riscrive la finale da capo. Nel copione Galdrick scivola sul
            camminamento e tu lo salvi dalla pozza un attimo prima che ci cada.
            Poi vinci lo stesso, e la folla porta in trionfo tutti e due.
          segue: la-lettura-del-copione

      - testo: "Non raccontargli niente"
        descrizione: "Quello che hai fatto è tuo. Orazio però scrive lo stesso, con quello che gli arriva dalla strada."
        esito:
          titolo: Quello che dice la gente
          testo: |
            Gli dici che preferisci tenerti le tue storie, e Orazio non se la
            prende. Sfoglia i suoi fogli e ti legge quello che dice la gente.
            In Città Bassa giurano che sei figlio di un nobile decaduto, e una
            lavandaia dei Quartieri Alti sostiene che parli con i gatti.
            «Prendo tutto» dice, e intinge la penna. «La gente ha già fatto
            metà del lavoro, e gratis.» Alla fine della pagina non riconosci
            più una sola cosa di te, a parte il nome.

            {conoscenze-della-strada Media} In Città Bassa si sogna il sangue
            nobile e nei Quartieri Alti la stranezza. Ogni quartiere ti ha
            cucito addosso la favola che gli manca.
          segue: la-lettura-del-copione

      - testo: "Alzarti dalla sedia"
        descrizione: "Per oggi preferisci che la tua storia resti fuori dal teatro. Orazio sa aspettare, almeno a parole."
        costo: 0
        esito:
          titolo: La penna sospesa
          testo: |
            Ti alzi dalla sedia davanti allo specchio, e l'aria fresca del
            corridoio ti arriva sulla nuca come una mano gentile, e gli dici che
            per adesso la tua storia la tieni tu. Orazio resta con la penna
            sospesa finché una goccia d'inchiostro cade sul foglio, e allora la
            posa. «L'Arte sa aspettare, anima mia. Io ci provo» dice. Ti
            accompagna alla porta del camerino e ti avverte che intanto
            continuerà a raccogliere quello che dice la gente, perché la gente
            non chiede il permesso.

  - id: la-lettura-del-copione
    immagine: personaggi/violante
    titolo: La lettura del copione
    tipo: seguito
    luogo: Teatro delle Meraviglie, il ridotto, tre giorni dopo
    area: quartieri-alti
    requisiti: [teatro.copione == 0]
    testo: |
      Tre giorni dopo Orazio raduna la compagnia nel ridotto per la lettura,
      con le sedie messe in cerchio sotto il lampadario e una brocca di vino
      annacquato che nessuno tocca. Il copione ha la copertina di cartone rosso
      e un titolo scritto a mano con molti svolazzi, *Le imprese mirabolanti di
      un cittadino qualunque*. Orazio legge tutte le parti da solo, cambiando
      voce a ogni battuta, e si ferma soltanto per bere, dalla brocca che
      nessuno tocca.

      Dentro ci sei tu, o qualcuno con il tuo nome. Hai una spada che canta
      quando c'è un nemico vicino, e un vecchio maestro che nel primo atto ti
      muore fra le braccia dicendoti una frase di quattro righe. Ti scopri a
      sorridere nei punti peggiori e ad arrossire in quelli migliori.

      {accademiche Media} Le spade che cantano vengono dalle ballate dei
      Casati, dove servivano a riempire le rime. Orazio le ha lette tutte, e
      si vede.

      Violante, con i piedi appoggiati su un'altra sedia, ti passa un foglio
      piegato. Sopra ha scritto a matita *a pagina dodici ti innamori di me e
      a quattordici muoio, stai tranquillo*. La donna delle pulizie, che
      Orazio invita a tutte le letture perché dice che lei è il pubblico,
      ride nei punti giusti e anche in qualcuno sbagliato.

      {espressivita Facile} Ride dove riderebbe il loggione. Orazio, mentre
      legge, la guarda di sbieco a ogni battuta per segnarsi quali tenere.

      Quando chiude il copione Orazio guarda prima te, con la penna già in
      mano. «Allora, anima mia. Quanto lo tagliamo?»
    opzioni:
      - testo: "Lasciarlo esagerare"
        descrizione: "Il teatro è suo, e la spada che canta anche. Alla fine la gente saprà che è una farsa."
        esito:
          titolo: I diritti della tua vita
          testo: |
            Gli dici che il teatro è suo e la spada che canta anche. Orazio si
            alza e ti abbraccia, con gli anelli che ti premono nella schiena e
            un profumo di violetta che ti resta addosso fino a sera, e dalla
            tasca della giacca tira fuori un sacchetto di velluto. «I diritti
            della tua vita, anima mia. Senti com'è pesante. La vita resta a te,
            e la versione migliore la tengo io.» Violante applaude piano, con
            due dita. Nei giorni dopo, per strada, qualcuno comincia a chiederti
            se la spada canta davvero.
          pe: { galateo: 5 }
          imposta: { teatro.copione: 1 }
          effetti: { rep.teatro: 1, monete: 20 }

      - testo: "Togliere le bugie una alla volta"
        descrizione: "Pagina per pagina, finché nel copione resta qualcosa che è successo davvero. Orazio difenderà ogni riga."
        prova: { attributo: sociale, abilita: [persuasione, galateo], difficolta: Media }
        successo:
          titolo: Una pessima coreografia
          testo: |
            Riprendi il copione dalla prima pagina, e a ogni bugia ti fermi e
            gli racconti com'è andata davvero. Orazio difende la spada che canta
            per mezz'ora, con la mano sul cuore e poi sulla fronte, e alla fine
            la cede, purché resti almeno il maestro che muore. «La verità è una
            pessima coreografia» dice, e intanto taglia. Alla fine il copione è
            più sottile di un terzo. Orazio lo rilegge da capo in silenzio, e a
            metà si mette a ridere in un punto dove prima non rideva nessuno.

            {persuasione Media} Gli hai lasciato il maestro. Un uomo che ha
            appena perso la spada ha bisogno di vincere qualcosa, e tu glielo
            hai fatto vincere.
          pe: { persuasione: 5 }
          imposta: { teatro.copione: 1 }
          effetti: { rep.teatro: 1, monete: 10 }
        fallimento:
          titolo: La spada resta
          testo: |
            Provi a togliere la spada che canta, e Orazio la difende come un
            figlio. Il resto della compagnia si schiera con lui, perché nel
            duello con la spada tutti hanno almeno una battuta, e nessun attore
            rinuncia a una battuta per amore della verità. Alla fine la lettura
            si chiude senza un accordo. Orazio rimette il copione nel
            cassetto del camerino e ti dice che l'Arte sa aspettare, e che lui
            per primo ci prova.

      - testo: "Trovare nei fatti la scena migliore"
        descrizione: "Orazio paga chi gli porta i dettagli giusti. Forse ce n'è uno vero che vale più di una spada che canta."
        prova: { attributo: mentale, abilita: [percezione, accademiche], difficolta: Media }
        successo:
          titolo: La fibbia
          testo: |
            Gli racconti una cosa piccola che non hai mai detto a nessuno. Dopo,
            quando era tutto finito, le mani ti tremavano tanto che non riuscivi
            a slacciarti una fibbia, e qualcuno ha dovuto farlo per te. Mentre
            lo racconti le dita ti cercano la cintura, per conto loro. Orazio
            resta zitto. Poi prende la penna, cancella le quattro righe del
            maestro che muore e al loro posto scrive una fibbia che non si
            slaccia. «Questa la recito io» dice, «e la sala piangerà sul serio.»
            Violante ti guarda da sopra il copione, senza ridere.
          pe: { percezione: 5 }
          imposta: { teatro.copione: 1 }
          effetti: { rep.teatro: 1, monete: 10 }
        fallimento:
          titolo: Troppo vero
          testo: |
            Gli racconti una cosa vera, e la scegli male. È un ricordo che ti
            tiene sveglio di notte e che in bocca a te suona soltanto crudo, e
            nel ridotto cala un silenzio in cui si sente il lampadario. Orazio
            ascolta con gli anelli fermi sul copione, poi ti posa una mano sul
            braccio. «Il pubblico paga per piangere un poco e tornare a
            casa, e questa è una cosa da notte insonne» dice. Chiude il copione e
            ti dice di tornare quando avrai voglia di raccontarne un'altra.

      - testo: "Togliere i nomi veri"
        descrizione: "Che esageri pure, purché nel copione non resti il nome di nessun altro. Quelli che conosci non hanno chiesto di salire sul palco."
        esito:
          titolo: Lo sceriffo Baldracco
          testo: |
            Gli lasci la spada che canta e tutto il resto, a patto che l'unico
            nome vero nel copione sia il tuo. Orazio brontola per un po' sui
            diritti dell'Arte, poi ci prende gusto. Passa il resto del
            pomeriggio a inventare nomi nuovi per tutti quelli che compaiono
            nella storia, e li prova ad alta voce uno per uno finché non suonano
            abbastanza ridicoli. Uno sceriffo diventa Baldracco, e una Gilda
            intera diventa la Lega dei Bottegai. La donna delle pulizie ride a
            ogni nome.
          pe: { empatia: 5 }
          imposta: { teatro.copione: 1 }
          effetti: { rep.teatro: 1, monete: 10 }

  # ------------------------------------------------------------ storia a 6 · il nome sul cartellone
  - id: il-nome-sul-cartellone
    presso: teatro-delle-meraviglie
    immagine: ambientazione/teatro-delle-meraviglie
    titolo: Il nome sul cartellone
    sommario: "Stasera va in scena il copione di Orazio, e sul cartellone fra le colonne del Teatro c'è il tuo nome, sotto il suo."
    luogo: Teatro delle Meraviglie, la sera della prima
    area: quartieri-alti
    requisiti: [rep.teatro >= 6, teatro.primattore == 0, teatro.copione >= 1]
    testo: |
      Sul cartellone appeso fra le colonne del Teatro c'è il titolo dello
      spettacolo in lettere d'oro, e sotto c'è il nome di Orazio Belcanto,
      grande quanto il titolo. Sotto ancora c'è il tuo, un poco più piccolo.
      Il pittore l'ha ridipinto due volte, perché la prima Orazio l'aveva
      trovato troppo grande e la seconda troppo piccolo per un teatro serio.
      Sotto la vernice fresca si vedono ancora le ombre delle due versioni
      precedenti, come un nome scritto da tre mani diverse.

      Dietro il sipario la compagnia si muove in punta di piedi. Violante ti
      sistema il colletto senza chiedere, e il macchinista prova la ruota per
      la terza volta. Dal buco nel velluto si vede la sala piena fino al
      loggione, e in terza fila la donna delle pulizie ha un biglietto vero e
      si è messa un cappello. Orazio guarda dal buco accanto al tuo e
      s'irrigidisce. «C'è Tarquin» dice, con una voce più bassa di un'ottava
      che non gli hai mai sentito. In un palco di prima fila, accanto a Isotta
      Cordani, siede un uomo in camicia bianca e panciotto, lo stesso del
      ritratto sulla toeletta. Poi Orazio si volta, e la voce gli risale dove
      sta di solito. «Anime mie, in posizione!»

      {empatia Media} Per un attimo hai visto Orazio senza il personaggio
      addosso. Stasera recita per una persona sola, e il resto della sala è
      lì per caso.

      {origine rampollo-dei-quartieri-alti} Isotta Cordani l'hai incrociata
      in abbastanza salotti da riconoscerle il ventaglio anche dal buco nel
      velluto. Domani nei Quartieri Alti del tuo nome sul cartellone si
      parlerà come ne parlerà lei, e lei non ha ancora deciso.

      {origine figlio-della-citta-bassa} In Città Bassa i nomi sui muri sono
      quelli che la Caserma cerca, e da ragazzo li leggevi per sapere chi non
      sarebbe tornato a casa. Il tuo, scritto in oro fra due colonne, non ti
      sembra ancora il tuo.

      Hai le mani fredde e la bocca asciutta, e le battute del primo atto
      se ne sono andate tutte insieme.

      {resilienza Facile fallita} Provi a ricordare la prima battuta e ti
      viene in mente soltanto il titolo, con tutti i suoi svolazzi. Le
      ginocchia, intanto, hanno deciso di tremare in anticipo.
    opzioni:
      - testo: "Fare come la sera della Promessa"
        immagine: personaggi/violante
        descrizione: "Hai già retto una sala piena al buio, la sera della Promessa dell'Arpia. Le ginocchia se lo ricordano, anche se la testa adesso no."
        requisiti: [pista.teatro >= 2, teatro.ruolo == 1]
        prova: { attributo: sociale, abilita: [espressivita, persuasione], difficolta: Facile }
        successo:
          titolo: Le ginocchia ricordano
          testo: |
            Entri in scena, pianti i piedi sulle assi come la sera della
            Promessa e aspetti che la sala smetta di tossire. Il calore delle
            lampade ti arriva in faccia come un ricordo. La prima battuta ti
            torna da sola, e dietro di lei tutte le altre. Orazio recita
            tutti i cattivi cambiando mantello dietro le quinte, e ogni volta
            che rientra ti strizza l'occhio. Agli applausi la sala si alza, e
            dal palco di prima fila Tarquin Cordani applaude per primo. Il
            giorno dopo il pittore torna con la scala e ripassa il tuo nome di
            vernice fresca.
          pe: { espressivita: 5 }
          imposta: { teatro.primattore: 1 }
          effetti: { rep.teatro: 1, monete: 25, racconto: 1 }
        fallimento:
          titolo: La striscia di carta
          testo: |
            Entri in scena convinto che le ginocchia sappiano la strada, e a
            metà del primo atto ti si piegano. Orazio ti copre come può, ma il
            secondo atto lo recita quasi tutto lui, sudando sotto il cerone per
            due. Il giorno dopo sul cartellone, sopra il tuo nome, c'è una
            striscia di carta incollata di traverso, come quella che c'era sul
            manifesto della Promessa. Orazio ti dice che la toglierà la sera
            che sarai pronto.
          effetti: { monete: 8 }

      - testo: "Recitare la parte come l'ha scritta Orazio"
        descrizione: "Le battute sono sue, la faccia è la tua. Davanti a una sala piena serve la voce, e anche un po' di faccia tosta."
        prova: { attributo: sociale, abilita: [espressivita, persuasione], difficolta: Media }
        successo:
          titolo: La sala in piedi
          testo: |
            La prima battuta ti esce un tono troppo alta, e la seconda giusta.
            Da lì in avanti la sala la tieni tu, e a volte ride prima ancora
            che tu finisca la frase, e tu senti la risata arrivarti nel petto
            come un'onda calda. Orazio recita tutti i cattivi e ogni tanto si
            dimentica di esserlo, per guardarti. Agli applausi
            la sala si alza, e dal palco di prima fila Tarquin Cordani applaude
            per primo. Il giorno dopo il pittore torna con la scala e ripassa il
            tuo nome di vernice fresca.
          pe: { espressivita: 5 }
          imposta: { teatro.primattore: 1 }
          effetti: { rep.teatro: 1, monete: 25, racconto: 1 }
        fallimento:
          titolo: Il buco nel velluto
          testo: |
            A metà del primo atto ti perdi in una battuta lunga e la finisci in
            un altro modo, e la scena dopo non ha più senso. Orazio la rimette
            in piedi improvvisando, con la voce sempre più alta. Gli applausi
            alla fine sono educati, e dal palco di prima fila non arriva niente.
            Il giorno dopo sul cartellone, sopra il tuo nome, c'è una striscia
            di carta incollata di traverso, e Orazio ti dice che la toglierà la
            sera che sarai pronto.
          effetti: { monete: 8 }

      - testo: "Fare da te i duelli"
        descrizione: "Nel copione ci sono tre duelli e una caduta dal ballatoio. Orazio voleva una controfigura, ma se li fai tu la sala lo capisce."
        prova: { attributo: fisico, abilita: [acrobazia, armi-da-mischia], difficolta: Media }
        successo:
          titolo: Tre duelli e una caduta
          testo: |
            Le battute le dici come puoi, e la sala te le perdona appena tiri
            fuori la spada di legno. Orazio fa tutti i cattivi, cambiando
            mantello in quinta, e tu li batti uno dopo l'altro con le finte che
            avete provato per una settimana. Alla caduta dal ballatoio la prima
            fila grida davvero.

            {acrobazia Media} Atterri sulla spalla e lasci che il resto del
            corpo rotoli dietro, come avete provato. Le assi cedono un poco
            sotto il peso, e i tuoi muscoli lo sapevano prima di te.

            Agli applausi la sala si alza, e dal palco di
            prima fila Tarquin Cordani applaude per primo. Il giorno dopo il
            pittore torna con la scala e ripassa il tuo nome di vernice fresca.
          pe: { acrobazia: 5 }
          imposta: { teatro.primattore: 1 }
          effetti: { rep.teatro: 1, monete: 25, racconto: 1 }
        fallimento:
          titolo: La caduta vera
          testo: |
            I primi due duelli vanno bene. Al terzo sbagli una finta e colpisci
            Orazio sul polso per davvero, e lui trasforma il grido in una
            battuta che non c'era. La caduta dal ballatoio la fai storta, con
            una caviglia che ti si gira sotto. Finisci lo spettacolo
            zoppicando, e la sala applaude il coraggio più del resto. Il giorno
            dopo sul cartellone, sopra il tuo nome, c'è una striscia di carta di
            traverso. Orazio ti dice che la toglierà quando sarete guariti
            tutti e due.
          effetti: { monete: 8, ferite: 1 }

      - testo: "Recitare pensando a com'è andata davvero"
        descrizione: "Le parole sono di Orazio, ma la paura di quella sera te la ricordi da solo. Basta lasciarla salire senza farsi portare via."
        prova: { attributo: mentale, abilita: [resilienza, percezione], difficolta: Media }
        successo:
          titolo: La sala zitta
          testo: |
            Dici le battute di Orazio e intanto lasci che ti torni in mente
            quella sera vera, con le mani che tremavano. La voce ti esce più
            bassa di come l'avevi provata, e un poco roca.

            {resilienza Media} La paura sale e la lasci salire fino alla gola,
            dove la tieni ferma. La conosci bene, e stasera lavora per te.

            La sala, che era venuta per ridere, a metà del secondo atto smette
            di farlo e ti segue in silenzio. Agli applausi c'è un momento vuoto,
            e poi si alzano tutti. Dal palco di prima fila Tarquin Cordani
            applaude per primo. Il giorno dopo il pittore torna con la scala e
            ripassa il tuo nome di vernice fresca.
          pe: { resilienza: 5 }
          imposta: { teatro.primattore: 1 }
          effetti: { rep.teatro: 1, monete: 25, racconto: 1 }
        fallimento:
          titolo: Troppo vicino
          testo: |
            Ti lasci tornare in mente quello che è successo davvero, e ti torna
            tutto insieme, gli odori prima delle immagini. A metà del secondo
            atto resti fermo in mezzo al palco con il sudore che si raffredda
            sulla nuca, finché Orazio non entra a prenderti per un braccio. Il
            giorno dopo sul cartellone, sopra il tuo nome, c'è una striscia di
            carta di traverso. Orazio ti dice che la toglierà la sera che sarai
            pronto, e che non c'è fretta.
          effetti: { monete: 8, tormento: 0.5 }

      - testo: "Salire sul palco e parlare come a tavola"
        descrizione: "Forse per una sera non serve essere attori. Dici le battute come le diresti a un amico, e vediamo che cosa succede."
        costo: 2
        esito:
          titolo: Come a tavola
          testo: |
            Entri in scena e dici le battute di Orazio come le diresti a una
            tavola di amici, con le pause dove ti viene di farle. Per un po' la
            sala non capisce, e tu senti un colpo di tosse in platea come una
            domanda. Poi qualcuno in loggione ride nel punto giusto, e da lì in
            avanti ti vengono dietro. Orazio, nei panni dei cattivi,
            abbassa il tono per starti accanto. Agli applausi Tarquin Cordani si
            alza per primo nel palco di prima fila. Il giorno dopo il pittore
            torna con la scala e ripassa il tuo nome di vernice fresca.
          pe: { espressivita: 5 }
          imposta: { teatro.primattore: 1 }
          effetti: { rep.teatro: 1, monete: 20, racconto: 1 }

      - testo: "Dire a Orazio che stasera non ce la fai"
        descrizione: "Il sostituto c'è, e sa le battute. Il tuo nome può aspettare sul cartellone."
        costo: 0
        esito:
          titolo: Il sostituto
          testo: |
            Glielo dici a voce bassa dietro il sipario, con la vergogna che ti
            scalda le orecchie. Orazio ti guarda, poi chiama
            l'attor giovane e gli mette in mano la tua spada di legno senza una
            parola di rimprovero. Guardi lo spettacolo dalla quinta, e
            l'attor giovane fa la tua parte con un entusiasmo che ti mette un po'
            di imbarazzo. Il giorno dopo sul cartellone, sopra il tuo nome, c'è
            una striscia di carta. «Il tuo nome resta lì sotto» dice Orazio, «e
            la carta la togliamo quando vuoi tu.»

  # ------------------------------------------------------------ la carta
  - id: carta-un-manifesto-strappato
    immagine: personaggi/orazio-belcanto
    titolo: Un manifesto strappato
    sommario: "Su un muro dei Quartieri Alti qualcuno ha ritagliato la faccia di Orazio Belcanto da un manifesto, con molta cura. Il garzone del Teatro non sa come dirglielo."
    luogo: Quartieri Alti, un muro vicino alla piazza
    tipo: carta
    area: quartieri-alti
    requisiti: [rep.teatro < 2]
    testo: |
      Sul muro di un palazzo vicino alla piazza è incollato un manifesto del
      Teatro delle Meraviglie, con Orazio Belcanto dipinto a figura intera in
      un mantello di piume, una mano tesa verso chi passa. Al posto della
      faccia c'è un buco tondo ritagliato con molta pazienza, e attraverso il
      buco si vede l'intonaco grigio. Il resto del manifesto è intatto, fino
      all'ultimo anello sulle dita, e senza la faccia la mano tesa sembra
      chiedere l'elemosina.

      {percezione Facile} Il bordo del buco è un po' sfrangiato, a scatti
      corti. Niente coltello, quindi, ma un paio di forbicine piccole o
      un'unghia molto paziente.

      Ai piedi del muro c'è un garzone di una dozzina d'anni con un secchio di
      colla e un pennello largo, che guarda il buco a bocca aperta. «È il quarto
      da stamattina» ti dice senza che tu gli abbia chiesto niente. «Sempre la
      faccia, e sempre così pulito. Il signor Belcanto dice che è una
      maledizione, e che se ne strappano un altro chiude il teatro per lutto.»
      Si soffia il naso nella manica. «Manifesti nuovi non ce ne sono, e la
      faccia io non la so disegnare.»

      Dall'altra parte della strada, sulla soglia di un forno, due bambine
      giocano con un pezzo di carta tondo che una delle due si tiene davanti
      agli occhi.

      {intimidire Facile} Basterebbe attraversare la strada con l'aria
      giusta. Poi ti viene in mente quanto sono piccole, e l'aria giusta ti
      passa.
    opzioni:
      - testo: "Aiutare il garzone a rattoppare il manifesto"
        descrizione: "Un foglio di carta da pacchi, un po' di colla e una faccia disegnata alla meglio. Il garzone ti sarà grato per sempre, o almeno fino a stasera."
        esito:
          titolo: Una faccia alla meglio
          testo: |
            Ti fai dare dal fornaio un foglio di carta da pacchi e ritagli un
            tondo della misura giusta, e il garzone lo incolla da dietro. Sopra
            disegni con il carbone una faccia con il mento alto e le
            sopracciglia inarcate, la più somigliante che ti riesce, con la
            lingua fra i denti come a scuola. Il garzone
            ci gira intorno con la testa piegata e dice che il signor Belcanto
            ci si riconoscerà, perché ha l'aria offesa giusta. Ti ringrazia e ti
            dice di passare al Teatro, dove cercano sempre gente.
          effetti: { rep.teatro: 0.5 }

      - testo: "Andare a parlare con le bambine"
        descrizione: "Quel pezzo di carta tondo ha due fori per gli occhi, e un'aria offesa che conosci."
        prova: { attributo: sociale, abilita: [empatia, conoscenze-della-strada], difficolta: Facile }
        successo:
          titolo: Quattro Orazi
          testo: |
            Le bambine hanno quattro facce di Orazio, ognuna con due fori per
            gli occhi, e giocano a fare il teatro sulla soglia del forno. Una
            delle due dice «anima mia» con una precisione che fa paura. Gliene
            compri tre con la promessa di portarle una sera in loggione, e la
            quarta la lasci a quella che fa meglio la voce. Il garzone
            rincolla le facce ai loro manifesti con le mani che gli tremano
            dalla gioia, e si fa dire il tuo nome due volte per riferirlo al
            signor Belcanto.
          pe: { empatia: 2 }
          effetti: { rep.teatro: 0.5 }
        fallimento:
          titolo: La fuga
          testo: |
            Appena ti avvicini, le bambine capiscono che cosa vuoi e scappano
            via nel vicolo con le loro maschere, gridando con la voce di Orazio
            e ridendo tanto da inciampare. Il garzone le guarda sparire, e poi
            si volta verso di te con il pennello in mano. Ti dice che il signor
            Belcanto chiuderà il teatro per lutto, e che sarà colpa di tutti e
            due.

      - testo: "Tirare dritto"
        descrizione: "Le facce di Orazio sono un problema di Orazio."
        costo: 0
        esito:
          titolo: Il quarto manifesto
          testo: |
            Lasci il garzone davanti al suo buco e prosegui verso la piazza, con
            la sensazione di avere sulla schiena gli occhi delle due bambine, o
            di quattro Orazi. Due strade più in là trovi un altro manifesto del
            Teatro dove la faccia di Orazio è rimasta al suo posto, e una vecchia
            con la sporta della spesa si ferma a guardarlo e si sistema i
            capelli sotto il fazzoletto, come se lui potesse vederla.
