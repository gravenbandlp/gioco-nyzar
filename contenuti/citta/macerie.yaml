# La città viva, luogo 13: le macerie della Pignatta (presso: macerie-della-pignatta, area citta-bassa, visibile
# con pista.pelle >= 6). L'attività fra le travi bruciate, le tre storie della Città Bassa (2 Rozalia torna, con
# la variante per chi ha la nomea bassa; 4 il cantiere; 6 l'insegna nuova) e la carta della cenere.
# Reputazione: nomea.citta-bassa (−5…+10, già esistente). Sgomberare, dare da mangiare e fare la guardia la fanno
# salire di ½ fino a 4; puntellare i muri (fisico), cacciare i ladri di ferro (sociale) e scegliere le travi
# (mentale) fino a 6; le storie danno +1, così da 2 si arriva a 3, da 4 a 5 e da 6 a 7.
# Nomea bassa: con nomea < 0 Rozalia viene a cercarti lei (rozalia-ti-cerca), e l'attività ha varianti
# (le croci di legno, i bambini che scappano, le scritte sui muri).
# macerie.rozalia: 1 lasciata andare, 2 consegnata, 3 lavora per te (poi un'opzione dell'attività al suo tavolo).
# Se una prova per consegnarla o assumerla fallisce, Rozalia scappa ma la storia resta aperta.
# macerie.cantiere: 1 il quartiere, 2 il Comune e le cooperative, 3 la Gilda; l'insegna nuova cambia di
# conseguenza (casa per gli orfani, mensa, locanda di quartiere).
# Stato del mondo: le cooperative di Julia nominate solo con pista.pelle >= 7. Il destino di Mauro non si
# dice (può essere preso o morto); Nestor e Borso sono in catene.
# Nomi nuovi, che il Codex non dà: Orsola Brena (la vecchia dell'orto di cipolle), Tibo (orfano della razzia
# che dorme sotto il bancone), Cosimo Venn (ispettore dei lotti della Casa dei Nodi). Mastro Fenzi, il
# pittore, è solo nominato in municipio.yaml.
storylet:
  # ------------------------------------------------------------ l'attività ripetibile
  - id: fra-le-travi-bruciate
    presso: macerie-della-pignatta
    immagine: ambientazione/pignatta-grassa
    titolo: Fra le travi bruciate
    sommario: "Dove c'era la Pignatta Grassa c'è da sgomberare e da fare la guardia, e la Città Bassa guarda chi lo fa."
    luogo: Le macerie della Pignatta
    area: citta-bassa
    ripetibile: true
    requisiti: [pista.pelle >= 6]
    testo: |
      Della Pignatta Grassa restano i muri di pietra, neri fino al punto dove
      cominciava il tetto, e il bancone di quercia, che il fuoco ha soltanto
      scurito. Nel cortile delle risse la cenere si è impastata con la pioggia,
      e sotto si vede ancora il cerchio di gesso dove una volta si scommetteva.
      Contro il muro qualcuno ha appoggiato una porta bruciata e ci ha scritto
      sopra con il carbone *chiuso per lutto*. Una mano diversa ha cancellato
      *lutto* con una riga e sopra ha scritto *sempre*.

      Di giorno fra le travi giocano i bambini, e la notte sotto il bancone
      dorme chi non ha un altro tetto, mentre i ladri di ferro frugano nel
      cortile in cerca di chiodi e cerchioni di botte. L'odore di legna
      bagnata ti si attacca ai vestiti e ti riporta allo spiazzo pieno di lanterne, la notte
      in cui Galdrick è entrato qui dentro con la spada in mano, e le tue mani
      vanno da sole a cercare la cintura.

      Davanti alla porta c'è un orto piccolo, cinto da uno spago. Le cipolle
      crescono tutte piegate verso la strada, e la vecchia che le zappa alza
      la testa ogni volta che passa qualcuno.
    opzioni:
      - testo: "Sgomberare le macerie"
        descrizione: "Travi da spostare e chiodi da cavare. Il ferraiolo di Via del Salmone compra il ferro vecchio a peso."
        requisiti: [nomea.citta-bassa >= 0, nomea.citta-bassa < 4]
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Media }
        successo:
          titolo: Il secchio dei chiodi
          testo: |
            Sposti le travi una alla volta fino al muro di fondo, facendo leva
            con un palo di ferro, e cavi i chiodi con la tenaglia. Un bambino
            scalzo ti segue con un secchio e li raccoglie tutti, compresi quelli
            piegati. Ti dice che si chiama Tibo e che il secchio è suo. A sera
            il ferraiolo di Via del Salmone pesa il ferro sulla stadera e ti dà
            la paga, che Tibo guarda finché non gliene lasci qualcuna.
          effetti: { monete: 1, nomea.citta-bassa: 0.5 }
        fallimento:
          titolo: La trave che scivola
          testo: |
            La terza trave è più pesante delle altre e ancora umida dentro. A
            metà strada ti scivola dalla spalla e ti cade sul piede, e per un
            po' resti seduto nella cenere a contare le dita attraverso lo
            stivale. Un bambino scalzo ti guarda dal bancone e ti chiede se
            adesso puoi dargli il palo di ferro, visto che tu non lo usi.
          effetti: { ferite: 0.5 }

      - testo: "Sgomberare le macerie"
        descrizione: "Travi da spostare e chiodi da cavare. Accanto alla porta ci sono le croci di legno, e la strada ti guarda lavorare."
        requisiti: [nomea.citta-bassa < 0]
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Media }
        successo:
          titolo: Una brocca sulla soglia
          testo: |
            Lavori da solo per tutta la mattina. Davanti alla porta ci sono le
            croci di legno, una per ogni ragazzo morto sullo spiazzo, e quando
            sposti le travi stai attento a non urtarle. Dalle finestre di fronte
            ti guardano in silenzio. Verso sera trovi sulla soglia una brocca
            d'acqua che prima non c'era, e nessuno si fa avanti a dire di chi è.
            Il ferraiolo ti pesa i chiodi senza parlare.
          effetti: { monete: 1, nomea.citta-bassa: 0.5 }
        fallimento:
          titolo: La croce storta
          testo: |
            Una trave ti sfugge di mano mentre la giri e va a battere contro una
            delle croci di legno, che si piega da una parte. La raddrizzi subito
            in ginocchio, ma dalla finestra di fronte una donna ha visto tutto e
            chiude le imposte con un colpo che senti fino al cortile. Per il
            resto del giorno le travi ti sembrano pesare il doppio.
          effetti: { tormento: 0.5 }

      - testo: "Dare da mangiare a chi ci dorme"
        descrizione: "Pane e zuppa per chi dorme sotto il bancone. Bastano poche monete, e un po' di pazienza."
        requisiti: [nomea.citta-bassa >= 0, nomea.citta-bassa < 4, monete >= 2]
        esito:
          titolo: Le scodelle
          testo: |
            Compri pane e una pentola di zuppa di cavolo al forno dietro
            l'angolo, che te la presta con il patto di riportarla lavata. Sotto
            il bancone dormono in sei. Quattro sono bambini, e i due vecchi non
            si parlano fra loro. Mangiano tutti in fretta, con la scodella fra
            le ginocchia.
            Uno dei vecchi ti dice che la zuppa della Pignatta era peggiore, e
            che però la serviva Mauro, e Mauro almeno rideva.
          pe: { empatia: 2 }
          effetti: { monete: -2, nomea.citta-bassa: 0.5 }

      - testo: "Dare da mangiare a chi ci dorme"
        descrizione: "Pane e zuppa per chi dorme sotto il bancone. Prima però devono decidere se accettarli da te."
        requisiti: [nomea.citta-bassa < 0, monete >= 2]
        esito:
          titolo: Un passo indietro
          testo: |
            Compri pane e una pentola di zuppa al forno dietro l'angolo e la
            porti fino al bancone. Nessuno si muove finché resti lì vicino.
            Allora
            posi la pentola sulla quercia e fai tre passi indietro fino all'orto,
            e solo da lì li vedi uscire a uno a uno. Il più piccolo, prima di
            mangiare, si volta verso di te con la scodella fra le mani e ti fa
            un cenno con il mento.
          pe: { empatia: 2 }
          effetti: { monete: -2, nomea.citta-bassa: 0.5 }

      - testo: "Fare la guardia di notte"
        descrizione: "I ladri di ferro arrivano dopo la seconda ronda della Guardia. Hanno un carretto con gli stracci intorno alle ruote."
        requisiti: [nomea.citta-bassa < 4]
        prova: { attributo: mentale, abilita: [percezione, resilienza], difficolta: Media }
        successo:
          titolo: Gli stracci alle ruote
          testo: |
            Passi la notte seduto sul bancone con la schiena contro il muro.
            Dopo la seconda ronda senti arrivare un carretto con le ruote fasciate
            di stracci, e capisci dove si ferma dal cigolio dell'asse. Ti basta
            alzarti in piedi nel buio. I due ladri lasciano il carretto e
            scappano, e la mattina i vicini si dividono i cerchioni e ti
            lasciano qualche moneta sul bancone.
          effetti: { monete: 2, nomea.citta-bassa: 0.5 }
        fallimento:
          titolo: Il sonno prima dell'alba
          testo: |
            Resisti fino alla seconda ronda, poi gli occhi ti si chiudono per
            conto loro. Ti svegli all'alba con il collo storto e la cenere sulla
            guancia, e le cerniere di ferro del bancone non ci sono più. Al loro
            posto restano otto buchi puliti nel legno. La vecchia dell'orto ti
            guarda dalla porta e scuote la testa, senza cattiveria.

      - testo: "Ascoltare cosa si dice di quella notte"
        descrizione: "La sera, intorno al bancone, la notte della Pignatta si racconta ancora, e ogni volta un po' diversa."
        requisiti: [nomea.citta-bassa >= 3]
        prova: { attributo: sociale, abilita: conoscenze-della-strada, difficolta: Facile }
        successo:
          titolo: La versione di stasera
          testo: |
            Ti siedi in fondo, sul gradino del cortile. Il racconto lo fa un
            facchino con la voce grossa, e nella versione di stasera Galdrick e
            Vesh si battono per un'ora intera. A un certo punto compare anche il
            tuo nome, e qualcuno si gira a guardarti e sorride. Dopo, mentre gli
            altri vanno via, il facchino ti dice chi in Città Bassa ha
            ricominciato a prestare soldi a interesse.
          effetti: { informazioni.voce: 1 }
        fallimento:
          titolo: Troppo vicino
          testo: |
            Ti siedi troppo vicino al bancone, e quando il facchino arriva al
            punto in cui compari tu si accorge di averti davanti. Diventa rosso
            e salta un pezzo del racconto e poi un altro, e finisce in fretta con
            Galdrick seduto sul gradino. Gli altri ti guardano come se fosse
            colpa tua, e te ne vai prima che si alzino.

      - testo: "Ascoltare cosa si dice di quella notte"
        descrizione: "La sera, intorno al bancone, la notte della Pignatta si racconta ancora. Di te, per adesso, si parla poco."
        requisiti: [nomea.citta-bassa >= 0, nomea.citta-bassa < 3]
        prova: { attributo: sociale, abilita: conoscenze-della-strada, difficolta: Facile }
        successo:
          titolo: Le randellate
          testo: |
            Il racconto lo fa una lavandaia con le braccia rosse, e parla
            soprattutto delle randellate della milizia e delle imposte che la
            mattina dopo non si chiudevano più. Le facce le ricorda poco, e la
            tua non la ricorda per niente. Alla fine ti chiede da dove vieni, e
            quando glielo dici ti racconta chi vende ancora il sidro degli Scuri
            in un cortile di Via del Salmone.
          effetti: { informazioni.voce: 1 }
        fallimento:
          titolo: Le facce
          testo: |
            La lavandaia che racconta si interrompe quando ti siedi, ti guarda
            da capo a piedi e chiede se sei della Guardia. Le dici di no, e lei
            ricomincia da un altro punto parlando del tempo e del prezzo del
            sapone. Te ne vai prima della fine, con la sensazione di aver
            ascoltato un racconto preparato apposta per te.

      - testo: "Ascoltare cosa si dice di quella notte"
        descrizione: "La sera, intorno al bancone, la notte della Pignatta si racconta ancora. Quando arrivi tu, però, si smette."
        requisiti: [nomea.citta-bassa < 0]
        prova: { attributo: sociale, abilita: conoscenze-della-strada, difficolta: Facile }
        successo:
          titolo: Dietro il muro
          testo: |
            Non ti avvicini al bancone. Ti fermi al buio dietro il muro del
            cortile e ascolti attraverso una crepa. Il racconto arriva fino ai
            corpi dei ragazzi sotto le lanterne, e lì qualcuno dice il tuo nome a voce
            bassa, come una parola che porta male. Poi parlano d'altro, e fra le
            altre cose di un magazzino della Gilda che nessuno sorveglia più.
          effetti: { informazioni.voce: 1, tormento: 0.5 }
        fallimento:
          titolo: Il gradino vuoto
          testo: |
            Ti avvicini al bancone mentre la storia è a metà, e chi racconta si
            ferma. Uno alla volta si alzano e se ne vanno, senza fretta, per non
            dare l'impressione di scappare. Resti solo con la cenere e con il
            gradino del cortile, dove sul muro, a carbone, qualcuno ha scritto
            *assassini del governo* e poi l'ha lavato via a metà.
          effetti: { tormento: 0.5 }

      - testo: "Puntellare i muri"
        descrizione: "I muri della Pignatta stanno in piedi per abitudine. Prima che qualcuno ci costruisca sopra vanno puntellati, trave per trave."
        requisiti: [nomea.citta-bassa >= 4, nomea.citta-bassa < 6]
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Media }
        successo:
          titolo: Il muro di levante
          testo: |
            Con due facchini del quartiere pianti nel cortile quattro puntelli
            di castagno contro il muro di levante, quello che pende di più.
            Batti i cunei finché la pietra smette di sgranarsi a ogni colpo. A
            fine giornata Orsola, la vecchia dell'orto, appoggia l'orecchio al
            muro come a una botte e dice che adesso sta zitto. Il facchino più
            anziano ti divide la paga con lui, a parti uguali.
          effetti: { monete: 3, nomea.citta-bassa: 0.5 }
        fallimento:
          titolo: La pioggia di calce
          testo: |
            Batti il primo cuneo troppo forte e dal muro di levante si stacca una
            pioggia di calce e di pietrisco che ti finisce nel colletto. I
            facchini ti tirano indietro per la giubba. Il muro resta in piedi, e
            per oggi nessuno ha più voglia di toccarlo. Ti scrolli la polvere di
            dosso fino a sera, e ne trovi ancora nelle orecchie il giorno dopo.
          effetti: { ferite: 0.5 }

      - testo: "Cacciare i ladri di ferro"
        descrizione: "Adesso vengono di giorno con un carretto, e hanno un foglio timbrato che dice che il ferro è loro."
        requisiti: [nomea.citta-bassa >= 4, nomea.citta-bassa < 6]
        prova: { attributo: sociale, abilita: [intimidire, persuasione], difficolta: Media }
        successo:
          titolo: Il foglio timbrato
          testo: |
            Sono in tre con un carretto, e hanno un foglio che porta in fondo
            un timbro sbavato della Gilda. Ti fai dare il foglio e lo leggi ad alta voce
            davanti a tutta la strada, compreso il punto dove il nome della
            Pignatta è scritto con due enne. Il capo dei tre se lo riprende e se
            ne va con il carretto vuoto. I vicini, che hanno sentito ridere la
            strada, ti offrono una manciata di monete e un bicchiere.
          effetti: { monete: 3, nomea.citta-bassa: 0.5 }
        fallimento:
          titolo: Mezzo carretto
          testo: |
            Il foglio ha un timbro della Gilda sbavato ma quasi vero, e il
            capo dei tre te lo tiene sotto il naso finché non ti fa venire il
            dubbio. Mentre discuti gli altri due caricano mezzo carretto di
            cerchioni. Quando finalmente se ne vanno, Tibo ti fa notare che il
            foglio parlava di un'altra strada.

      - testo: "Scegliere le travi che reggono"
        descrizione: "Il capomastro del quartiere vuole sapere quali travi bruciate si possono ancora usare. Sbagliare vuol dire un tetto che cade."
        requisiti: [nomea.citta-bassa >= 4, nomea.citta-bassa < 6]
        prova: { attributo: mentale, abilita: [percezione, tecnologia], difficolta: Difficile }
        successo:
          titolo: Il suono del legno
          testo: |
            Batti ogni trave con il manico della scure e ascolti. Quelle sane
            rispondono con un suono pieno, mentre quelle bruciate dentro suonano
            vuote anche se fuori sembrano nere soltanto di fuliggine. Ne segni
            undici col gesso. Il capomastro le prova con lo scalpello una per
            una e trova da ridire su una sola, poi ti paga il giusto e ti chiede
            se vuoi lavorare per lui.
          effetti: { monete: 3, nomea.citta-bassa: 0.5 }
        fallimento:
          titolo: Il gesso sbagliato
          testo: |
            Segni col gesso dodici travi buone. Il capomastro ne apre una con lo
            scalpello e dentro è carbone fino al cuore, e alla seconda smette di
            controllare. Ti restituisce il gesso con molta educazione. Le travi
            le rifà da solo il giorno dopo, e le tue croci di gesso restano
            sulle travi per una settimana.

      - testo: "Passare dal tavolo di Rozalia"
        descrizione: "Rozalia scrive lettere per chi non sa scrivere, a prezzi da Città Bassa, e intanto ascolta."
        immagine: personaggi/rozalia-marga
        requisiti: [monete >= 1]
        quando: [macerie.rozalia == 3]
        prova: { attributo: sociale, abilita: [galateo, ingannare], difficolta: Facile }
        successo:
          titolo: Il conto della settimana
          testo: |
            Rozalia ha messo accanto al bancone un tavolo pieghevole con un
            calamaio e una scatola di latta per le monete. Quando ti vede batte
            due volte la penna sull'orlo. Ti racconta chi ha scritto a chi
            questa settimana e per quali somme. La lettera di una moglie della
            Gilda la ricorda parola per parola. «Ti informo per contratto,
            tesoro» dice, e si rimette la piuma dietro l'orecchio. «Quella
            lettera, per la precisione, non te l'ho mai raccontata.»
          effetti: { informazioni.pettegolezzo: 1 }
        fallimento:
          titolo: Lo segno a parte
          testo: |
            Rozalia ha la coda al tavolo e ti fa aspettare dietro una lavandaia
            che detta una lettera al fratello di Pannion. Quando tocca a te ti
            dice soltanto di un mercante che ha cambiato fornitore di sale, e ti
            fa pagare l'inchiostro. «Lo segno a parte» dice, con la penna già
            sulla lettera successiva.
          effetti: { informazioni.voce: 1, monete: -1 }

      - testo: "Guardare i bambini nel cerchio di gesso"
        descrizione: "Nel cortile delle risse i bambini hanno inventato un gioco nuovo, e il cerchio di gesso gli serve ancora."
        requisiti: [nomea.citta-bassa >= 0]
        esito:
          titolo: Lo sceriffo e Vesh
          testo: |
            Nel cerchio di gesso due bambini si battono con due bastoni, e quello
            con il fazzoletto legato in testa fa Galdrick. L'altro, che fa Vesh,
            muore tre volte di fila con grande soddisfazione di tutti. Alla
            quarta vogliono che Vesh lo faccia tu, e muori anche tu, steso
            nella cenere. Il bambino con il secchio dei chiodi, che si chiama
            Tibo, ti spiega che si muore con gli occhi aperti, e ti corregge
            finché non lo fai bene.
          pe: { espressivita: 2 }

      - testo: "Guardare i bambini nel cerchio di gesso"
        descrizione: "Nel cortile delle risse i bambini giocano. Ti vedono arrivare prima che tu veda loro."
        requisiti: [nomea.citta-bassa < 0]
        esito:
          titolo: Il più piccolo
          testo: |
            Quando entri nel cortile il gioco si ferma. I più grandi raccolgono i
            bastoni e scavalcano il muro di fondo senza una parola. Resta il più
            piccolo, scalzo, in mezzo al cerchio di gesso, e ti chiede se è vero
            che quella notte eri tu. Gli rispondi di sì. Lui ci pensa, poi esce
            anche lui dalla porta bruciata, camminando.
          pe: { resilienza: 2 }

  # ------------------------------------------------------------ storia a 2 · Rozalia torna
  - id: rozalia-torna
    presso: macerie-della-pignatta
    immagine: personaggi/rozalia-marga
    titolo: Rozalia torna
    sommario: "La vecchia dell'orto dice che di notte una donna con la piuma dietro l'orecchio scava fra le macerie del retrobottega."
    luogo: Le macerie della Pignatta, a notte fonda
    area: citta-bassa
    requisiti: [pista.pelle >= 6, nomea.citta-bassa >= 2, macerie.rozalia == 0]
    testo: |
      Te l'ha detto Orsola, la vecchia dell'orto, mentre abbassava la voce
      insieme alla zappa. Da tre notti una donna scava fra le macerie del
      retrobottega, e la Guardia non la vede perché arriva dopo la seconda
      ronda. Orsola lo ha detto a te perché nei vicoli il tuo nome adesso
      conta qualcosa.

      Aspetti seduto sul bancone di quercia, con la lanterna spenta accanto.
      Dopo la seconda ronda una figura snella scavalca il muro di fondo, accende
      una lanterna cieca e si mette a scavare con una paletta da camino dove
      c'erano gli scaffali delle cartelle. Ha le maniche rimboccate fino al
      gomito, i capelli raccolti sulla nuca e la piuma d'oca dietro l'orecchio.
      Dalla cenere tira fuori una cassetta di ferro annerita e ci soffia sopra.

      Quando ti alzi lei non scappa. Batte due volte la paletta sull'orlo della
      cassetta, come faceva con la penna sul calamaio.

      «Buonasera, tesoro. Ti aspettavo qualche notte fa, per la precisione»
      dice Rozalia Marga. «Mirko è morto, e io sono una falsaria senza padrone.
      Qui dentro ci sono le firme di mezza città divise per famiglia e per
      mestiere. Il fuoco s'è preso gli scaffali, la cassetta no.»

      *Ha le mani nere fino al polso, e questa volta l'inchiostro non c'entra.*
      Lei se le pulisce sulla gonna con calma, una alla volta.
    opzioni:
      - testo: "Chiederle che fine hanno fatto gli altri"
        descrizione: "Quella notte, sullo spiazzo, c'erano quattro tenenti. Lei è l'unica che non hai più visto."
        costo: 0
        esito:
          titolo: Parenti rumorosi
          testo: |
            «Nestor si è seduto per terra e ha alzato le mani, e adesso sta in
            catene alla Caserma e fa le tisane ai carcerieri. Borso è in fondo alle celle,
            che conosce meglio di chiunque» dice, contando sulle dita. «Nihali è
            partito per Pannion con la prima carovana, e lo sentivano tossire
            fino all'ultimo ponte.» Si ferma. «Di Mauro non chiedermi. Eravamo
            parenti rumorosi, e a me dei parenti piace ricordare le feste.»
          segue: rozalia-torna

      - testo: "Lasciarla andare"
        descrizione: "Mirko è morto, e la guerra è finita. Una falsaria senza padrone può cercarsi un'altra città."
        esito:
          titolo: In pari
          testo: |
            Le dici di prendere la sua cassetta e di andarsene prima della terza
            ronda. Rozalia ti guarda un momento più a lungo del solito, poi si
            mette la cassetta sotto il braccio. «I conti li chiudo in pari» dice,
            e ti sussurra il nome di un funzionario della Casa dei Nodi che per
            sei anni le ha comprato permessi falsi, e per ogni permesso anche
            il giorno e la cifra.
            Scavalca il muro di fondo senza fretta. Dalla finestra di fronte
            Orsola ha visto tutto, e la mattina dopo non ne parla con nessuno.
          pe: { conoscenze-della-strada: 5 }
          imposta: { macerie.rozalia: 1 }
          effetti: { nomea.citta-bassa: 1, informazioni.segreto: 1 }

      - testo: "Dirle di venire alla Caserma con te"
        descrizione: "Senza Mirko non ha nessuno che la protegga, e lo sa meglio di te. Galdrick ascolta chi si presenta da solo."
        prova: { attributo: sociale, abilita: [persuasione, intimidire], difficolta: Media }
        successo:
          titolo: Un appuntamento
          testo: |
            Le dici che in città la cercano in molti, e che fra tutti Galdrick è
            quello che fa meno domande a chi si presenta da sé. Rozalia ci pensa
            battendo la paletta tre volte invece di due. Poi si sistema la piuma
            e ti cammina accanto fino alla Caserma con la cassetta sotto il
            braccio, come se andasse a un appuntamento. Galdrick la riceve in
            piedi e scrive il suo nome sul taccuino. Lei gli fa notare che la
            matita è troppo corta.
          pe: { persuasione: 5 }
          imposta: { macerie.rozalia: 2 }
          effetti: { nomea.citta-bassa: 1, rep.caserma: 1 }
        fallimento:
          titolo: Il fumo grigio
          testo: |
            Al nome di Galdrick Rozalia sorride, e tu capisci tardi che sta
            guardando la tua mano, andata da sola alla cintura. La fiala si rompe ai tuoi
            piedi e il fumo grigio ti riempie la gola. Quando smetti di tossire
            il cortile è vuoto e la cassetta è sparita con lei. La buca però è
            più profonda di quanto le serviva, e sotto la cenere spunta
            l'angolo di una seconda cassetta. Prima o poi Rozalia dovrà tornare
            a prenderla.
          effetti: { tormento: 0.5 }

      - testo: "Prenderla prima che scappi"
        descrizione: "Ha una fiala di fumo da qualche parte sotto la mantellina. Bisogna arrivarle al polso prima che ci arrivi lei."
        prova: { attributo: fisico, abilita: [furtivita, atletica], difficolta: Media }
        successo:
          titolo: Il polso
          testo: |
            Le giri intorno nel buio, dalla parte dei muri, mentre lei parla al
            punto dove eri prima. Quando la sua mano scende verso la mantellina
            tu sei già lì, e le stringi il polso con la fiala ancora intera fra
            le dita. Rozalia sospira. «Per la precisione, tesoro, questo è
            maleducato» dice, e ti lascia la fiala. Alla Caserma Galdrick scrive
            il suo nome sul taccuino senza alzare gli occhi, e Orsola, la
            mattina dopo, racconta la scena a tutta la strada.
          pe: { furtivita: 5 }
          imposta: { macerie.rozalia: 2 }
          effetti: { nomea.citta-bassa: 1, rep.caserma: 1 }
        fallimento:
          titolo: La seconda cassetta
          testo: |
            Le giri intorno nel buio, ma sotto il tuo piede una trave scricchiola.
            La fiala si rompe contro il bancone e il fumo grigio riempie il
            cortile, e quando si dirada sei in ginocchio a tossire con un graffio
            sul dorso della mano. Rozalia è sparita con la sua cassetta. Nella
            buca, sotto la cenere, c'è l'angolo di una seconda cassetta di
            ferro, e la ricopri con il piede per quando tornerà.
          effetti: { ferite: 0.5 }

      - testo: "Offrirle un lavoro"
        descrizione: "Una falsaria senza padrone cerca un padrone nuovo, o almeno un cliente. La Città Bassa ha bisogno di qualcuno che sappia scrivere."
        prova: { attributo: sociale, abilita: [persuasione, ingannare], difficolta: Media }
        successo:
          titolo: Come te
          testo: |
            Le dici che in Città Bassa metà della gente non sa scrivere, e che
            dopo il fuoco tutti hanno bisogno di lettere e di ricevute
            vere. Rozalia ti ascolta con la testa piegata di lato. «Io
            firmo come te, e firmare come qualcun altro costa il doppio» dice
            alla fine. Poi accetta la metà, a patto di scegliersi il tavolo. Lo
            sceglie accanto al bancone, e la cassetta la seppellisce di
            nuovo dove l'ha trovata.
          pe: { persuasione: 5 }
          imposta: { macerie.rozalia: 3 }
          effetti: { nomea.citta-bassa: 1 }
        fallimento:
          titolo: Quando avrai un'offerta
          testo: |
            Rozalia ti lascia arrivare in fondo, poi rimette la cassetta nella
            buca e ci spinge sopra la cenere con la punta della scarpa. «Mi offri
            lavoro con le tasche vuote, tesoro. Le tasche io le sento da qui»
            dice. «Ne riparliamo quando avrai un'offerta.» Scavalca il muro di
            fondo. La cassetta resta sottoterra, sotto un palmo di cenere.

      - testo: "Pagarle il primo mese"
        descrizione: "Una borsa pesante sul bancone, e lei scrive per te e per la Città Bassa. Rozalia rispetta chi paga in anticipo."
        requisiti: [monete >= 30]
        esito:
          titolo: Il primo mese
          testo: |
            Conti le monete sulla quercia bruciata, una alla volta. Rozalia
            le sposta con la punta della paletta senza toccarle, e alla fine
            annuisce. «Puntuale nei pagamenti. Mi piace» dice. Seppellisce di
            nuovo la cassetta dove l'ha trovata, perché lì sotto non la cerca
            nessuno, e il giorno dopo arriva con un tavolo pieghevole e un
            calamaio. Lo mette accanto al bancone, e prima di sera ha già scritto
            tre lettere per tre vicine che non sanno scrivere.
          pe: { politica-ed-economia: 5 }
          imposta: { macerie.rozalia: 3 }
          effetti: { monete: -30, nomea.citta-bassa: 1 }

  # ------------------------------------------------------------ storia a 2, nomea bassa · Rozalia ti cerca
  - id: rozalia-ti-cerca
    presso: macerie-della-pignatta
    immagine: personaggi/rozalia-marga
    titolo: Una falsaria al bancone
    sommario: "Nei vicoli il tuo nome lo dicono sottovoce. C'è una donna, seduta sul bancone bruciato, che invece lo dice ad alta voce."
    luogo: Le macerie della Pignatta, al tramonto
    area: citta-bassa
    requisiti: [pista.pelle >= 6, nomea.citta-bassa < 0, macerie.rozalia == 0]
    testo: |
      Al tramonto, quando arrivi, i bambini lasciano il cerchio di gesso e
      scavalcano il muro di fondo, e la vecchia dell'orto rientra in casa con
      la zappa. Sul muro annerito qualcuno ha scritto a carbone *assassini del
      governo*, e sotto c'è il tuo nome, lavato a metà da una mano che si è
      stancata prima di finire.

      Seduta sul bancone di quercia c'è una donna snella, con i capelli raccolti
      sulla nuca e una piuma d'oca dietro l'orecchio. Si pulisce le unghie con
      un coltellino da ufficio, un'unghia alla volta. Ha le dita macchiate
      d'inchiostro fino alla seconda falange. È l'unica persona in tutta la
      strada che non si è mossa quando sei arrivato.

      «Buonasera, tesoro. Rozalia Marga, se te ne sei dimenticato» dice,
      chiudendo il coltellino. «Nei vicoli il tuo nome lo dicono a bassa voce,
      e a me la gente che fa paura piace, perché paga in anticipo. Mirko è
      morto, e io sono una falsaria senza padrone.» Indica la scritta con il
      mento. «Una Città Bassa che ti vuole bene te la posso scrivere io. Sono
      lettere e firme, e il resto lo fa la gente, che crede a quello che
      legge.»

      *Mi offre di falsificare me stesso.* Senti lo stomaco chiudersi, e non
      sai dire se di disgusto o di tentazione.
    opzioni:
      - testo: "Mandarla via"
        descrizione: "Mirko è morto. Una falsaria senza padrone può cercarsi un'altra città, e un altro cliente."
        esito:
          titolo: La porta bruciata
          testo: |
            Le dici di andarsene dalla Città Bassa prima che cambi idea. Rozalia
            scende dal bancone senza fretta e si rimette il coltellino nella
            manica. «Peccato. Sarebbe stato il mio lavoro migliore» dice, e passa
            dalla porta bruciata invece che dal muro, perché la vedano uscire.
            Dietro le imposte di fronte qualcuno ha guardato tutto. La mattina
            dopo la scritta sul muro è lavata un po' di più.
          pe: { resilienza: 5 }
          imposta: { macerie.rozalia: 1 }
          effetti: { nomea.citta-bassa: 1 }

      - testo: "Portarla alla Caserma"
        descrizione: "Rozalia ha detto che la gente che fa paura le piace. Puoi vedere se le piace anche da vicino."
        prova: { attributo: sociale, abilita: [intimidire, persuasione], difficolta: Media }
        successo:
          titolo: Davanti a tutti
          testo: |
            Le dici di scendere dal bancone e di camminarti davanti fino alla
            Caserma, e glielo dici con la voce che in Città Bassa ricordano.
            Rozalia smette di sorridere. Ti cammina davanti per tutta la discesa
            con le mani in vista, e dalle finestre la strada guarda una tenente
            di Vesh portata via viva, senza un colpo. Galdrick scrive il suo
            nome sul taccuino. Nei vicoli, quella sera, il tuo nome lo dicono
            con un tono un po' diverso.
          pe: { intimidire: 5 }
          imposta: { macerie.rozalia: 2 }
          effetti: { nomea.citta-bassa: 1, rep.caserma: 1 }
        fallimento:
          titolo: La sua offerta, per iscritto
          testo: |
            Rozalia ti lascia finire, poi rompe una fiala sulla quercia. Il fumo
            grigio ti brucia gli occhi, e quando si dirada sul bancone c'è un
            foglio piegato in due, fermato da un sasso. È la sua offerta in bella
            grafia con il prezzo, e in fondo c'è una riga, *ripasso fra
            qualche sera*. La scritta sul muro, intanto, è ancora lì.
          effetti: { tormento: 0.5 }

      - testo: "Accettare, ma alle tue condizioni"
        descrizione: "Niente firme false sul tuo conto. Lettere vere, per chi non sa scrivere, e lei al bancone tutti i giorni dove la vedono."
        prova: { attributo: sociale, abilita: [persuasione, ingannare], difficolta: Media }
        successo:
          titolo: Lettere vere
          testo: |
            Le dici che vuoi lettere vere e un tavolo qui, alla luce del
            giorno, dove scriva per chi non sa farlo e dica a tutti chi la paga.
            Rozalia ci pensa battendo il coltellino chiuso sul ginocchio. «Una
            reputazione onesta costa più cara, tesoro, perché ci vuole più
            tempo, però è anche più difficile da smascherare» dice, e accetta
            senza tirare sul prezzo. Il giorno dopo arriva con un tavolo
            pieghevole e un calamaio.
          pe: { persuasione: 5 }
          imposta: { macerie.rozalia: 3 }
          effetti: { nomea.citta-bassa: 1 }
        fallimento:
          titolo: Ripasso fra qualche sera
          testo: |
            Le spieghi le tue condizioni, e lei ti ascolta come un maestro
            che corregge un compito. «Le condizioni le fa chi paga» dice alla fine,
            e scende dal bancone. Ti lascia sulla quercia un biglietto con il
            suo prezzo, scritto in una grafia piccola e diritta, e in fondo una
            riga, *ripasso fra qualche sera*.

      - testo: "Pagarle il primo mese"
        descrizione: "Un mese pagato in anticipo, e lettere vere per la Città Bassa, firmate col nome di chi le detta. Il tuo resta fuori."
        requisiti: [monete >= 30]
        esito:
          titolo: Il tavolo pieghevole
          testo: |
            Conti le monete sul bancone e le dici che cosa vuoi, lettere
            vere per chi non sa scrivere, a prezzo di strada, e il tuo nome
            fuori da tutto. Rozalia sposta le monete con la punta del coltellino
            e le conta due volte. «Puntuale nei pagamenti. Mi piace» dice. Il
            giorno dopo mette un tavolo pieghevole accanto al bancone, e a sera
            la prima a sedersi davanti a lei è la vecchia dell'orto.
          pe: { politica-ed-economia: 5 }
          imposta: { macerie.rozalia: 3 }
          effetti: { monete: -30, nomea.citta-bassa: 1 }

  # ------------------------------------------------------------ storia a 4 · il cantiere
  - id: il-cantiere
    presso: macerie-della-pignatta
    immagine: ambientazione/pignatta-grassa
    titolo: Il cantiere
    sommario: "Sulla porta bruciata della Pignatta qualcuno ha inchiodato un avviso d'asta. Davanti, la Città Bassa aspetta di sapere da che parte stai."
    luogo: Le macerie della Pignatta, di mattina
    area: citta-bassa
    requisiti: [pista.pelle >= 6, nomea.citta-bassa >= 4, macerie.cantiere == 0]
    testo: |
      Stamattina sulla porta bruciata c'è un avviso inchiodato con quattro
      chiodi nuovi, che in mezzo al legno nero luccicano. Il lotto della
      Pignatta Grassa, che era di Mirko Vesh e adesso è del Comune, va all'asta
      fra un mese, e il prezzo di partenza è scritto in cifre e poi in lettere
      perché nessuno lo possa correggere. Davanti all'avviso c'è un uomo magro
      con il libro dei lotti sotto il braccio e gli stivali puliti. È Cosimo
      Venn, ispettore della Casa dei Nodi, e tiene gli stivali ben lontani
      dalla cenere.

      Intorno a lui c'è mezza strada. Orsola si appoggia alla zappa con tutte e
      due le mani davanti al suo orto, e Tibo le sta dietro con il secchio dei
      chiodi. Due taglialegna con l'ascia in spalla sono scesi dalla Segheria a
      vedere, e sul muro di fondo, seduto a gambe incrociate, c'è un cappuccio
      blu che mastica qualcosa.

      «Il compratore della Gilda tira su una locanda con il magazzino dietro
      in due mesi, e paga la giornata a chi lavora» dice Venn. «Il Comune incassa, e voi avete un
      lavoro. Non vedo il problema.»

      «Il problema è che qui ci dormono» dice Orsola, «e le cipolle sono mie.»

      Poi si girano tutti verso di te. *Vogliono che decida io, perché di me
      si fidano più che del Comune.* In mano hai ancora un chiodo raccolto
      per strada, e le dita lo rigirano da sole.
    opzioni:
      - testo: "Guardare il cappuccio blu sul muro"
        descrizione: "Una ragazzina con le lentiggini segue la discussione dall'alto, come a teatro."
        immagine: personaggi/gaia-acari
        costo: 0
        esito:
          titolo: Chi mi dà da mangiare
          testo: |
            La ragazzina ti vede guardarla e smette di masticare. «Io sto con chi
            mi dà da mangiare» dice ad alta voce, così la sente tutta la strada,
            «e finora mi ha dato da mangiare la vecchia.» Orsola alza la zappa
            verso di lei come una benedizione. Venn sfoglia il libro dei lotti
            per cercare il nome della ragazzina, e quando alza la testa il muro
            è vuoto.
          segue: il-cantiere

      - testo: "Leggere l'avviso e il libro dei lotti"
        descrizione: "Un'asta del Comune ha le sue regole, e un ispettore con gli stivali puliti non sempre le ha lette tutte."
        prova: { attributo: mentale, abilita: [politica-ed-economia, accademiche], difficolta: Media }
        successo:
          titolo: Il sigillo che manca
          testo: |
            Ti fai prestare il libro dei lotti e lo leggi davanti a tutti, con
            Venn che sbuffa sopra la tua spalla. Per mettere all'asta un lotto
            confiscato serve il sigillo del Consiglio, e sull'avviso c'è soltanto
            quello della Casa dei Nodi. Venn arrossisce fino alle orecchie e
            stacca l'avviso con i suoi quattro chiodi nuovi. Finché il Consiglio
            non si riunisce, il lotto resta a chi ci abita, e Orsola ti dà una
            cipolla come caparra. Il pomeriggio la strada comincia a portare le
            travi.
          pe: { politica-ed-economia: 5 }
          imposta: { macerie.cantiere: 1 }
          effetti: { nomea.citta-bassa: 1 }
        fallimento:
          titolo: Tutto in regola
          testo: |
            Ti fai prestare il libro dei lotti e lo leggi davanti a tutti, ma la
            scrittura della Casa dei Nodi è piena di abbreviazioni che non
            conosci. Venn aspetta con le mani dietro la schiena e poi ti spiega
            pagina per pagina che è tutto in regola, con una pazienza che fa
            più male di uno schiaffo. La strada si disperde a gruppi, e
            nessuno ha deciso niente.

      - testo: "Mettere i tuoi soldi nel cantiere del quartiere"
        descrizione: "Una borsa piena nelle mani giuste, e la strada ricostruisce da sé. Con una caparra in mano anche un ispettore sa aspettare."
        requisiti: [monete >= 20]
        esito:
          titolo: La caparra
          testo: |
            Conti le monete nella mano di Venn e gli dici che sono la caparra
            del quartiere, e che il resto lo pagherà la strada, una giornata di
            lavoro alla volta. Venn le guarda, poi guarda la strada che lo
            guarda, e scrive una ricevuta con molta cura. Orsola fa un segno
            sull'avviso con il carbone. Il pomeriggio i taglialegna tornano con
            una trave a testa, e Tibo conta i chiodi nuovi uno per uno.
          pe: { persuasione: 5 }
          imposta: { macerie.cantiere: 1 }
          effetti: { monete: -20, nomea.citta-bassa: 1 }

      - testo: "Far leggere l'atto a Rozalia"
        descrizione: "Rozalia conosce le carte della Pignatta meglio di chiunque. Molte, per la precisione, le ha scritte lei."
        immagine: personaggi/rozalia-marga
        quando: [macerie.rozalia == 3]
        esito:
          titolo: La vedova Brena
          testo: |
            Rozalia lascia il suo tavolo, si fa dare il libro dei lotti e lo
            sfoglia con l'unghia del mignolo. Si ferma a metà e batte due volte
            la penna sulla pagina. «Mirko la Pignatta l'aveva intestata a una
            vedova rispettabile, perché a lui conveniva così» dice. «La firma, tesoro,
            l'ho fatta io, anni fa.» Il nome sull'atto è quello di Orsola
            Brena. Orsola si siede sul bancone e non riesce a smettere di ridere,
            e Venn chiude il libro senza una parola.
          pe: { accademiche: 5 }
          imposta: { macerie.cantiere: 1 }
          effetti: { nomea.citta-bassa: 1 }

      - testo: "Chiamare i taglialegna della cooperativa"
        descrizione: "La cooperativa ha il legname, e il Comune il lotto. Se si mettono d'accordo, qui nasce una mensa."
        quando: [pista.pelle >= 7]
        esito:
          titolo: Il legname e il lotto
          testo: |
            Chiami i due taglialegna, e loro ti dicono che la cooperativa il
            legname ce l'ha, e che le travi le porterebbe gratis se il lotto
            restasse del Comune. Scrivi due righe a Julia Castaldi, e la risposta
            arriva prima di sera con il sigillo del Consiglio. L'asta è
            sospesa, il lotto resta al Comune, e la cooperativa del grano ci
            farà una mensa. Venn stacca l'avviso con una faccia da funerale.
          pe: { politica-ed-economia: 5 }
          imposta: { macerie.cantiere: 2 }
          effetti: { nomea.citta-bassa: 1, rep.castaldi: 0.5 }

      - testo: "Scrivere a Julia Castaldi"
        descrizione: "Il lotto è del Comune, e il Comune è Julia. Forse la Rappresentante preferisce un tetto per la Città Bassa a un'asta."
        quando: [pista.pelle < 7]
        esito:
          titolo: La risposta del Municipio
          testo: |
            Scrivi a Julia Castaldi su un foglio che ti presta Venn, appoggiato
            alla porta bruciata, e un ragazzo lo porta su in Municipio di corsa.
            La risposta arriva prima di sera, con il sigillo del Consiglio. Il
            lotto resta del Comune, e appena le casse lo permettono ci si farà una
            mensa per la Città Bassa. Venn stacca l'avviso e se lo porta via
            piegato in quattro, e Orsola gli raccomanda di non sciuparlo.
          pe: { politica-ed-economia: 5 }
          imposta: { macerie.cantiere: 2 }
          effetti: { nomea.citta-bassa: 1, rep.castaldi: 0.5 }

      - testo: "Lasciare fare alla Gilda"
        descrizione: "La Gilda paga la giornata e costruisce in fretta. Venn, a bassa voce, parla anche di una provvigione."
        immagine: fazioni/gilda-dei-mercanti
        esito:
          titolo: La provvigione
          testo: |
            Dici a Venn che la strada ha bisogno di lavoro prima che di
            cipolle, a patto che il compratore assuma gente del quartiere. Venn
            lo scrive sul libro dei lotti e ti fa scivolare in mano una piccola borsa, che chiama provvigione. Orsola stringe la zappa, poi torna
            a zappare senza salutarti. Nel pomeriggio il compratore manda un capomastro, che
            assume dodici uomini della strada e promette che l'orto per adesso
            resta dov'è.
          pe: { politica-ed-economia: 5 }
          imposta: { macerie.cantiere: 3 }
          effetti: { monete: 15, nomea.citta-bassa: 1, rep.gilda: 0.5 }

  # ------------------------------------------------------------ storia a 6 · l'insegna nuova
  - id: l-insegna-nuova
    presso: macerie-della-pignatta
    immagine: ambientazione/citta-bassa
    titolo: L'insegna nuova
    sommario: "Dove c'era la Pignatta Grassa i muri hanno di nuovo un tetto. Manca soltanto il nome, e la strada vuole che lo scelga tu."
    luogo: Le macerie della Pignatta, che non sono più macerie
    area: citta-bassa
    requisiti: [pista.pelle >= 6, nomea.citta-bassa >= 6, macerie.insegna == 0, macerie.cantiere >= 1]
    testo: |
      I muri sono gli stessi, anneriti fino all'altezza del tetto vecchio, ma
      sopra adesso c'è un tetto nuovo di travi chiare e di tegole spaiate,
      recuperate un po' da tutta la Città Bassa. Il bancone di quercia è
      ancora al suo posto, raschiato fino al legno buono, e sopra ci sono già
      le scodelle impilate. Nel cortile il cerchio di gesso è stato ripassato
      da qualcuno con la mano ferma.

      Sulla porta nuova manca soltanto l'insegna. Mastro Fenzi, il pittore che
      di solito fa i ritratti in Municipio, aspetta in cima a una scala con
      un'asse bianca e i pennelli in tasca, e da un'ora la strada gli grida
      nomi da sotto. Orsola ne vuole uno, i taglialegna un altro, e Tibo, dal
      bancone, propone soltanto nomi di cose che si mangiano.

      Mastro Fenzi ti vede arrivare e appoggia il pennello sul piolo. «Hanno
      deciso che decidi tu, e io ho fame» dice. «Dimmelo prima che si secchi il
      colore.» La strada si zittisce un poco alla volta, cominciando dalle
      prime file.

      *La Pignatta la chiamavano grassa perché ingrassava Mirko.* Ti scappa
      un sorriso, e non lo nascondi.
    opzioni:
      - testo: "Chiamarla *Le Cipolle Storte*"
        descrizione: "Una casa per gli orfani della razzia, con la cucina di Orsola e l'orto davanti alla porta."
        quando: [macerie.cantiere == 1]
        esito:
          titolo: Le Cipolle Storte
          testo: |
            Mastro Fenzi dipinge sull'asse tre cipolle verdi, tutte piegate dalla
            stessa parte, e sotto il nome in lettere tonde. Orsola dice che la
            cipolla di mezzo è venuta troppo dritta, e Fenzi la corregge senza
            protestare. La sera i quattro bambini che dormivano sotto il bancone
            dormono nella stanza di dietro, su materassi di paglia nuova, e
            Tibo tiene il secchio dei chiodi accanto al letto. I due vecchi hanno
            una panca ciascuno vicino al fuoco, e continuano a non parlarsi.
          pe: { empatia: 5 }
          imposta: { macerie.insegna: 1 }
          effetti: { nomea.citta-bassa: 1, racconto: 1 }

      - testo: "Chiamarla *La Pignatta Magra*"
        descrizione: "La mensa del Comune, una scodella a prezzo fisso per chiunque si sieda."
        quando: [macerie.cantiere == 2]
        esito:
          titolo: La Pignatta Magra
          testo: |
            Quando lo dici la strada resta zitta un momento, poi ride tutta
            insieme, e i taglialegna più forte di tutti. Mastro Fenzi dipinge una
            pentola stretta e alta, con un manico solo, e sotto il nome in lettere
            nere. La prima sera le cuoche del Comune servono zuppa di farro a
            pochi spiccioli la scodella. Orsola mangia in piedi, perché dice che
            seduta le viene sonno, e chiede il bis due volte.
          pe: { espressivita: 5 }
          imposta: { macerie.insegna: 1 }
          effetti: { nomea.citta-bassa: 1, racconto: 1 }

      - testo: "Chiamarla *Il Cerchio di Gesso*"
        descrizione: "La locanda di quartiere della Gilda, con il cortile delle risse tenuto com'era."
        quando: [macerie.cantiere == 3]
        esito:
          titolo: Il Cerchio di Gesso
          testo: |
            Il capomastro della Gilda voleva un nome con dentro la parola
            *mercanti*, e la strada gli ha gridato contro per un'ora. Il cerchio
            di gesso invece piace a tutti. Mastro Fenzi lo dipinge bianco su
            fondo nero e perfettamente tondo, e la sera il locandiere della Gilda
            lascia che i bambini ci giochino dentro finché non si accendono le
            lanterne. Orsola beve il primo bicchiere e lo trova annacquato, come
            ai vecchi tempi.
          pe: { galateo: 5 }
          imposta: { macerie.insegna: 1 }
          effetti: { nomea.citta-bassa: 1, racconto: 1 }

      - testo: "Lasciare le lettere a Rozalia"
        descrizione: "Le lettere le dipinge Rozalia, che con il pennello è più brava del pittore. Il nome lo sceglie lei, e Fenzi la lascia fare."
        immagine: personaggi/rozalia-marga
        quando: [macerie.rozalia == 3]
        esito:
          titolo: Conti in Pari
          testo: |
            Rozalia sale sulla scala al posto di Fenzi, che glielo lascia fare
            con sollievo, e scrive *Conti in Pari* in una grafia così bella che
            la strada smette di gridare per guardarla. Quando scende si pulisce
            il pennello su uno straccio. «I conti li chiudo sempre in pari,
            tesoro» dice. «Questo era il più lungo.» Mastro Fenzi studia le
            lettere con il naso quasi sull'asse, e la sera le offre da bere.
          pe: { espressivita: 5 }
          imposta: { macerie.insegna: 1 }
          effetti: { nomea.citta-bassa: 1, racconto: 1 }

      - testo: "Lasciare che lo scelga Tibo"
        descrizione: "Il secchio dei chiodi l'ha riempito lui, uno alla volta. Forse il nome spetta a chi ha cominciato."
        esito:
          titolo: Il Chiodo
          testo: |
            Tibo ci pensa con la serietà di un consigliere e poi dice *Il Chiodo*,
            perché senza i chiodi il tetto non stava su. La strada ci prova a
            protestare, ma Orsola dà ragione a lui, e Fenzi dipinge un chiodo
            grosso come un remo, un po' piegato in punta. Sotto l'insegna, la sera
            stessa, Tibo inchioda l'ultimo chiodo del suo secchio, e da allora
            chiunque entri lo tocca per fortuna.
          pe: { empatia: 5 }
          imposta: { macerie.insegna: 1 }
          effetti: { nomea.citta-bassa: 1, racconto: 1 }

  # ------------------------------------------------------------ la carta
  - id: carta-la-cenere-della-pignatta
    immagine: personaggi/gaia-acari
    titolo: Un cappuccio blu fra la cenere
    sommario: "Una ragazzina con il cappuccio blu ti si mette al passo e ti dice che alla Pignatta qualcuno ha fame."
    luogo: Città Bassa, verso sera
    tipo: carta
    area: citta-bassa
    requisiti: [pista.pelle >= 6, macerie.cantiere == 0]
    testo: |
      Verso sera la Città Bassa accende i fuochi nei cortili, e dalle finestre
      esce odore di cavolo e di lardo. Stai scendendo per Via del Salmone
      quando un cappuccio blu scuro ti si mette al passo, alla tua sinistra,
      senza chiedere il permesso. Sotto il cappuccio ci sono un naso pieno di
      lentiggini e una bocca che mastica una radice di liquirizia.

      «Alla Pignatta la Guardia passa due volte per notte, e in mezzo sotto il
      bancone ci dormono in sei» dice la ragazzina senza guardarti. «Quattro sono
      piccoli. Tu hai la faccia di uno che il pane se lo può permettere, e io
      ho la faccia di una che non te lo chiede due volte.»

      Sputa la radice nel rigagnolo e aspetta, camminando
      al tuo fianco con le mani in tasca. Dalla parte dei muri anneriti, in
      fondo alla strada, sale un filo di fumo da un fuoco piccolo.
    opzioni:
      - testo: "Seguirla alle macerie con il pane"
        descrizione: "Una pagnotta al forno dell'angolo, e la strada fino al bancone di quercia."
        requisiti: [monete >= 1]
        esito:
          titolo: Sei pezzi uguali
          testo: |
            Compri una pagnotta al forno dell'angolo e Gaia ti porta fino al
            bancone bruciato, dove un bambino scalzo con un secchio di chiodi la
            saluta per nome. Dividete il pane in sei pezzi uguali, e lei controlla
            che siano davvero uguali. Poi se ne va senza salutare. La vecchia
            dell'orto davanti alla porta ti guarda, e la volta dopo ti saluta.
          pe: { empatia: 2 }
          effetti: { monete: -1, nomea.citta-bassa: 0.5 }
      - testo: "Darle uno spicciolo per il pane"
        descrizione: "Il pane lo può comprare anche lei. Tu hai da fare."
        requisiti: [monete >= 1]
        esito:
          titolo: Uno spicciolo
          testo: |
            Le dai uno spicciolo. Gaia lo morde, se lo mette in tasca e in cambio ti
            racconta, già voltata, che al forno dell'angolo il pane di ieri lo
            vendono per pane di oggi, e chi lo compra a chi lo rivende. Poi si
            infila in un vicolo verso le macerie, e non la vedi più.
          effetti: { monete: -1, informazioni.voce: 1 }
      - testo: "Lasciarla parlare da sola"
        descrizione: "Una ragazzina della Città Bassa che chiede soldi per il pane. Ne hai sentite tante, di storie così."
        costo: 0
        esito:
          titolo: Una parolaccia
          testo: |
            Allunghi il passo e lei non ti segue. Alle tue spalle ti dice una
            parolaccia che fa voltare una donna con un cesto di panni, e poi
            un'altra, più lunga, che non conoscevi. Quando ti giri il cappuccio
            blu è già sparito, e il filo di fumo in fondo alla strada è sempre lì.
