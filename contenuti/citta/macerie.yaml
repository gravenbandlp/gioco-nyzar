# La città viva, luogo 13: le macerie della Pignatta (presso: macerie-della-pignatta, area citta-bassa, visibile
# con pista.pelle >= 6). L'attività fra le travi bruciate, le tre storie della Città Bassa (2 Rozalia torna, con
# la variante per chi ha la nomea bassa; 4 il cantiere; 6 l'insegna nuova) e la carta della cenere.
# Reputazione: nomea.citta-bassa (−5…+10, già esistente). Sgomberare, dare da mangiare e fare la guardia la fanno
# salire di ½ fino a 4; puntellare i muri (fisico), cacciare i ladri di ferro (sociale) e scegliere le travi
# (mentale) fino a 6; le storie danno +1, così da 2 si arriva a 3, da 4 a 5 e da 6 a 7.
# Nomea bassa: con nomea < 0 Rozalia viene a cercarti lei (rozalia-ti-cerca), e l'attività ha varianti
# (le croci di legno, i bambini che scappano, le scritte sui muri).
# macerie.rozalia: 1 lasciata andare, 2 consegnata, 3 lavora per te (poi un'opzione dell'attività al suo tavolo).
# Se una prova per consegnarla o assumerla fallisce, Rozalia scappa ma la storia resta aperta.
# macerie.cantiere: 1 il quartiere, 2 il Comune e le cooperative, 3 la Gilda; l'insegna nuova cambia di
# conseguenza (casa per gli orfani, mensa, locanda di quartiere).
# Stato del mondo: le cooperative di Julia nominate solo con pista.pelle >= 7. Il destino di Mauro non si
# dice (può essere preso o morto); Nestor e Borso sono in catene.
# Nomi nuovi, che il Codex non dà: Orsola Brena (la vecchia dell'orto di cipolle), Tibo (orfano della razzia
# che dorme sotto il bancone), Cosimo Venn (ispettore dei lotti della Casa dei Nodi). Mastro Fenzi, il
# pittore, è solo nominato in municipio.yaml.
storylet:
  # ------------------------------------------------------------ l'attività ripetibile
  - id: fra-le-travi-bruciate
    presso: macerie-della-pignatta
    immagine: ambientazione/pignatta-grassa
    titolo: Fra le travi bruciate
    sommario: "Dove c'era la Pignatta Grassa c'è da sgomberare e da fare la guardia, e la Città Bassa guarda chi lo fa."
    luogo: Le macerie della Pignatta
    area: citta-bassa
    ripetibile: true
    requisiti: [pista.pelle >= 6]
    testo: |
      Della Pignatta Grassa restano i muri di pietra anneriti e il bancone di quercia, che il fuoco ha
      soltanto scurito. Il tetto è caduto dentro la sala, e le travi giacciono di traverso sul pavimento con
      il carbone spaccato a quadretti come la pelle di una lucertola. Il bancone ha retto perché la quercia
      stagionata brucia piano, e quella era spessa una spanna.

      {origine figlio-della-citta-bassa} Da ragazzin{o|a} portavi i messaggi degli Scuri e ti fermavi sulla
      soglia a guardare le risse nel cerchio di gesso. Adesso passi dalla porta bruciata senza che nessuno ti
      fermi, con la cenere fino alle caviglie.

      Di giorno fra le travi giocano i bambini e la notte sotto il bancone dorme chi non ha un tetto, mentre i
      ladri di ferro frugano nel cortile in cerca di chiodi. Sulle travi che hanno già ripulito restano file
      di buchi neri e regolari, alla distanza di una spanna l'uno dall'altro.

      Davanti alla porta c'è un orto cinto da uno spago annodato, con le cipolle tutte piegate verso la
      strada. La terra è grigia di cenere fino a un palmo sotto la superficie. La vecchia che le zappa alza la
      testa ogni volta che passa qualcuno.
    opzioni:
      - testo: "Sgomberare le macerie"
        descrizione: "Travi da spostare e chiodi da cavare. Il ferraiolo di Via del Salmone compra il ferro vecchio a peso."
        requisiti: [nomea.citta-bassa >= 0, nomea.citta-bassa < 4]
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Media }
        successo:
          titolo: Il secchio dei chiodi
          testo: |
            Sposti le travi una alla volta fino al muro di fondo facendo leva con un palo di ferro, e cavi i
            chiodi con la tenaglia finché non ti fa male il polso. Sono chiodi forgiati a mano con la testa a
            quattro facce, e il fuoco li ha lasciati neri e ruvidi di scaglie. Un bambino scalzo ti segue con
            un secchio e li raccoglie tutti, compresi quelli piegati, che raddrizza fra due sassi con una
            serietà da notaio. Ti dice che si chiama Tibo e che il secchio è suo.
          effetti: { monete: 1, nomea.citta-bassa: 0.5 }
        fallimento:
          titolo: La trave che scivola
          testo: |
            La terza trave è più pesante delle altre perché dentro il legno è ancora umido. A metà strada ti
            scivola dalla spalla e ti cade sul piede, e il dolore arriva un momento dopo, con calma, come un
            creditore. Per un po' resti sedut{o|a} nella cenere a contare le dita attraverso lo stivale. Sul
            cuoio della punta c'è il segno dello spigolo. Un bambino scalzo ti guarda dal bancone e ti chiede
            se adesso puoi dargli il palo di ferro, visto che tu non lo usi.
          effetti: { ferite: 0.5 }

      - testo: "Sgomberare le macerie"
        descrizione: "Travi da spostare e chiodi da cavare. Accanto alla porta ci sono le croci di legno, e la strada ti guarda lavorare."
        requisiti: [nomea.citta-bassa < 0]
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Media }
        successo:
          titolo: Una brocca sulla soglia
          testo: |
            Lavori da sol{o|a} per tutta la mattina. Davanti alla porta ci sono le croci di legno, una per
            ogni ragazzo morto sullo spiazzo, e quando sposti le travi stai attent{o|a} a non urtarle. Sono
            due assicelle di cassetta legate con lo spago, e su qualcuna il nome è inciso con la punta di un
            coltello. Dalle finestre di fronte ti guardano in silenzio, e ogni tanto una tenda si muove e poi
            torna al suo posto. Verso sera trovi sulla soglia una brocca d'acqua che prima non c'era, e
            nessuno si fa avanti a dire di chi è. L'acqua è fresca di pozzo e la brocca ha il collo
            scheggiato.

            Il ferraiolo ti pesa i chiodi senza parlare.
          effetti: { monete: 1, nomea.citta-bassa: 0.5 }
        fallimento:
          titolo: La croce storta
          testo: |
            Una trave ti sfugge di mano mentre la giri e va a battere contro una delle croci di legno, che si
            piega da una parte. La raddrizzi subito in ginocchio con le mani impacciate su quel legno leggero,
            e pigi la cenere intorno al piede della croce con il pollice. Dalla finestra di fronte però una
            donna ha visto tutto, e chiude le imposte con un colpo che senti fino al cortile. Per il resto del
            giorno le travi ti sembrano pesare il doppio.
          effetti: { tormento: 1 }

      - testo: "Dare da mangiare a chi ci dorme"
        descrizione: "Pane e zuppa per chi dorme sotto il bancone."
        requisiti: [nomea.citta-bassa >= 0, nomea.citta-bassa < 4, monete >= 2]
        esito:
          titolo: Le scodelle
          testo: |
            Compri pane e una pentola di zuppa di cavolo al forno dietro l'angolo, che te la presta con il
            patto di riportarla lavata. Sotto il bancone dormono in sei, su un letto di sacchi stesi sulla
            cenere. Quattro sono bambini, e i due vecchi non si parlano fra loro anche se dormono a un braccio
            di distanza.

            Uno dei vecchi ti dice che la zuppa della Pignatta era peggiore, e che però la serviva Mauro, e
            Mauro almeno rideva.
          pe: { empatia: 2 }
          effetti: { monete: -2, nomea.citta-bassa: 0.5 }

      - testo: "Dare da mangiare a chi ci dorme"
        descrizione: "Pane e zuppa per chi dorme sotto il bancone. Prima però devono decidere se accettarli da te."
        requisiti: [nomea.citta-bassa < 0, monete >= 2]
        esito:
          titolo: Un passo indietro
          testo: |
            Compri pane e una pentola di zuppa al forno dietro l'angolo e la porti fino al bancone, con il
            manico che ti scotta le dita. Nessuno si muove finché resti lì vicin{o|a}. Dal buio sotto il
            bancone sporgono soltanto due piedi fasciati di stracci, e restano fermi. Allora posi la pentola
            sulla quercia e fai tre passi indietro fino all'orto, e solo da lì li vedi uscire a uno a uno.

            Il più piccolo, prima di mangiare, si volta verso di te con la scodella fra le mani e ti fa un
            cenno con il mento.
          pe: { empatia: 2 }
          effetti: { monete: -2, nomea.citta-bassa: 0.5 }

      - testo: "Fare la guardia di notte"
        descrizione: "I ladri di ferro arrivano dopo la seconda ronda della Guardia. Hanno un carretto con gli stracci intorno alle ruote."
        requisiti: [nomea.citta-bassa < 4]
        prova: { attributo: mentale, abilita: [percezione, resilienza], difficolta: Media }
        successo:
          titolo: Gli stracci alle ruote
          testo: |
            Passi la notte sedut{o|a} sul bancone con la schiena contro il muro, e la pietra ti restituisce il
            freddo che ha preso di giorno. Dopo la seconda ronda senti arrivare un carretto con le ruote
            fasciate di stracci, e capisci dove si ferma dal cigolio dell'asse, che gli stracci non bastano a
            coprire. È il cigolio secco di un mozzo che nessuno ingrassa da anni, e torna uguale a ogni giro
            di ruota. Ti basta alzarti in piedi nel buio. I due ladri lasciano il carretto e scappano, e la
            mattina i vicini si dividono i cerchioni e ti lasciano qualche moneta sul bancone.
          effetti: { monete: 2, nomea.citta-bassa: 0.5 }
        fallimento:
          titolo: Il sonno prima dell'alba
          testo: |
            Resisti fino alla seconda ronda, poi gli occhi ti si chiudono per conto loro, dopo averti promesso
            che era solo per un momento. Ti svegli all'alba con il collo storto e la cenere sulla guancia, e
            le cerniere di ferro del bancone non ci sono più. Al loro posto restano otto buchi puliti nel
            legno, fatti senza fretta a un braccio dalla tua testa. Dentro ogni buco la quercia è ancora
            chiara sotto la crosta nera. La vecchia dell'orto ti guarda dalla porta e scuote la testa, senza
            cattiveria.

      - testo: "Ascoltare cosa si dice di quella notte"
        descrizione: "La sera, intorno al bancone, la notte della Pignatta si racconta ancora, e ogni volta un po' diversa."
        requisiti: [nomea.citta-bassa >= 3]
        prova: { attributo: sociale, abilita: conoscenze-della-strada, difficolta: Facile }
        successo:
          titolo: La versione di stasera
          testo: |
            Ti siedi in fondo, sul gradino del cortile. Il racconto lo fa un facchino con la voce grossa, e
            nella versione di stasera Galdrick e Vesh si battono per un'ora intera, con un numero di affondi
            che nessuna spada reggerebbe. Gli affondi li mima con un pezzo di trave carbonizzata, e a ogni
            colpo la cenere gli piove sulle scarpe. A un certo punto compare anche il tuo nome, e qualcuno si
            gira a guardarti e sorride.

            Dopo, mentre gli altri vanno via, il facchino ti dice chi in Città Bassa ha ricominciato a
            prestare soldi a interesse.
          effetti: { informazioni.voce: 1 }
        fallimento:
          titolo: Troppo vicino
          testo: |
            Ti siedi troppo vicino al bancone, e quando il facchino arriva al punto in cui compari tu si
            accorge di averti davanti. Diventa rosso fino al collo e salta un pezzo del racconto e poi un
            altro, e finisce in fretta con Galdrick seduto sul gradino, una fine che non convince nemmeno lui.
            Gli altri ti guardano come se fosse colpa tua, e in fondo lo è un poco. Te ne vai prima che si
            alzino. Sei ancora sulla porta bruciata quando senti la voce grossa del facchino che riprende dal
            punto dove si era fermato.

      - testo: "Ascoltare cosa si dice di quella notte"
        descrizione: "La sera, intorno al bancone, la notte della Pignatta si racconta ancora. Di te, per adesso, si parla poco."
        requisiti: [nomea.citta-bassa >= 0, nomea.citta-bassa < 3]
        prova: { attributo: sociale, abilita: conoscenze-della-strada, difficolta: Facile }
        successo:
          titolo: Le randellate
          testo: |
            Il racconto lo fa una lavandaia con le braccia rosse fino al gomito e le dita raggrinzite dalla
            liscivia, e parla soprattutto delle randellate della milizia e delle imposte che la mattina dopo
            non si chiudevano più. Le facce le ricorda poco, e la tua non la ricorda per niente, cosa che ti
            offende un po' più del ragionevole. Alla fine ti chiede da dove vieni, e quando glielo dici ti
            racconta chi vende ancora il sidro degli Scuri in un cortile di Via del Salmone.
          effetti: { informazioni.voce: 1 }
        fallimento:
          titolo: Le facce
          testo: |
            La lavandaia che racconta si interrompe quando ti siedi, ti guarda da capo a piedi e chiede se sei
            della Guardia. Le dici di no, e lei ricomincia da un altro punto parlando del tempo e del prezzo
            del sapone. Gli altri intorno al bancone annuiscono a ogni frase, anche a quelle sul sapone.

            Te ne vai prima della fine, con la sensazione di aver ascoltato un racconto preparato apposta per
            te.

      - testo: "Ascoltare cosa si dice di quella notte"
        descrizione: "La sera, intorno al bancone, la notte della Pignatta si racconta ancora. Quando arrivi tu, però, si smette."
        requisiti: [nomea.citta-bassa < 0]
        prova: { attributo: sociale, abilita: conoscenze-della-strada, difficolta: Facile }
        successo:
          titolo: Dietro il muro
          testo: |
            Non ti avvicini al bancone. Ti fermi al buio dietro il muro del cortile e ascolti attraverso una
            crepa, con la guancia contro la pietra che sa ancora di fumo. La crepa è larga un dito e segue le
            giunture, dove il calore ha fatto sgranare la calce. Il racconto arriva fino ai corpi dei ragazzi
            sotto le lanterne, e lì qualcuno dice il tuo nome a voce bassa, come una parola che porta male.
            Poi parlano d'altro, e fra le altre cose di un magazzino della Gilda che nessuno sorveglia più.
          effetti: { informazioni.voce: 1, tormento: 1 }
        fallimento:
          titolo: Il gradino vuoto
          testo: |
            Ti avvicini al bancone mentre la storia è a metà, e chi racconta si ferma con la bocca ancora
            aperta sulla parola successiva. Uno alla volta si alzano e se ne vanno senza fretta, per non dare
            l'impressione di scappare. Sul gradino restano le impronte tonde di chi era seduto, più pulite
            della cenere intorno. Resti sol{o|a} con la cenere e con il gradino del cortile, dove sul muro, a
            carbone, qualcuno ha scritto *assassini del governo*, con le lettere che colano dove il muro è
            ancora umido di pioggia.
          effetti: { tormento: 1 }

      - testo: "Puntellare i muri"
        descrizione: "I muri della Pignatta stanno in piedi per abitudine. Prima che qualcuno ci costruisca sopra vanno puntellati, trave per trave."
        requisiti: [nomea.citta-bassa >= 4, nomea.citta-bassa < 6]
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Media }
        successo:
          titolo: Il muro di levante
          testo: |
            Con due facchini del quartiere pianti nel cortile quattro puntelli di castagno contro il muro di
            levante, quello che pende di più. Il piede di ogni puntello lo appoggi su una lastra piatta,
            perché nella terra smossa del cortile affonderebbe. Batti i cunei finché la pietra smette di
            sgranarsi a ogni colpo, e le braccia ti vibrano fino ai denti. A fine giornata Orsola, la vecchia
            dell'orto, appoggia l'orecchio al muro come a una botte e dice che adesso sta zitto.

            Il facchino più anziano ti divide la paga con lui, a parti uguali.
          effetti: { monete: 3, nomea.citta-bassa: 0.5 }
        fallimento:
          titolo: La pioggia di calce
          testo: |
            Batti il primo cuneo troppo forte, e dal muro di levante si stacca una pioggia di calce e di
            pietrisco che ti finisce nel colletto. È calce vecchia che il fuoco ha cotto una seconda volta, e
            adesso si sbriciola fra le dita. I facchini ti tirano indietro per la giubba, imprecando in due
            dialetti diversi. Il muro resta in piedi, e per oggi nessuno ha più voglia di toccarlo. Ti scrolli
            la polvere di dosso fino a sera, e ne trovi ancora nelle orecchie il giorno dopo.
          effetti: { ferite: 0.5 }

      - testo: "Cacciare i ladri di ferro"
        descrizione: "Adesso vengono di giorno con un carretto, e hanno un foglio timbrato che dice che il ferro è loro."
        requisiti: [nomea.citta-bassa >= 4, nomea.citta-bassa < 6]
        prova: { attributo: sociale, abilita: [intimidire, persuasione], difficolta: Media }
        successo:
          titolo: Il foglio timbrato
          testo: |
            Sono in tre con un carretto, e hanno un foglio che porta in fondo un timbro sbavato della Gilda.

            Ti fai dare il foglio e lo leggi ad alta voce davanti a tutta la strada, scandendo come un
            banditore, compreso il punto dove il nome della Pignatta è scritto con due enne. L'inchiostro del
            timbro è passato fino al retro e ti macchia il pollice di viola. Il capo dei tre se lo riprende e
            se ne va con il carretto vuoto. I vicini, che hanno sentito ridere la strada, ti offrono una
            manciata di monete e un bicchiere.
          effetti: { monete: 3, nomea.citta-bassa: 0.5 }
        fallimento:
          titolo: Mezzo carretto
          testo: |
            Il foglio ha un timbro della Gilda sbavato ma quasi vero, e il capo dei tre te lo tiene sotto il
            naso, così vicino che senti l'odore della colla, finché non ti fa venire il dubbio. Mentre discuti
            gli altri due caricano mezzo carretto di cerchioni e il ferro batte sul ferro a ogni carico.
            Quando finalmente se ne vanno, Tibo ti fa notare che il foglio parlava di un'altra strada.

      - testo: "Scegliere le travi che reggono"
        descrizione: "Il capomastro del quartiere vuole sapere quali travi bruciate si possono ancora usare. Sbagliare vuol dire un tetto che cade."
        requisiti: [nomea.citta-bassa >= 4, nomea.citta-bassa < 6]
        prova: { attributo: mentale, abilita: [percezione, tecnologia], difficolta: Difficile }
        successo:
          titolo: Il suono del legno
          testo: |
            Batti ogni trave con il manico della scure e ascolti, con l'orecchio quasi appoggiato al legno.
            Quelle sane rispondono con un suono pieno, mentre quelle bruciate dentro suonano vuote anche se
            fuori sembrano nere soltanto di fuliggine. Dove resta il dubbio gratti la crosta con l'unghia, e
            sotto il legno buono è ancora color miele. Ne segni undici col gesso, e alla dodicesima esiti
            tanto che il capomastro smette di fischiettare. Lui le prova con lo scalpello una per una e trova
            da ridire su una sola, poi ti paga il giusto e ti chiede se vuoi lavorare per lui.
          effetti: { monete: 3, nomea.citta-bassa: 0.5 }
        fallimento:
          titolo: Il gesso sbagliato
          testo: |
            Segni col gesso dodici travi buone. Il capomastro ne apre una con lo scalpello e dentro è carbone
            fino al cuore, e alla seconda smette di controllare. Il carbone viene via a scaglie lucide e
            lascia sulla lama una polvere nera. Ti restituisce il gesso con molta educazione, tenendolo per la
            punta come una cosa che potrebbe sporcare. Le travi le rifà da solo il giorno dopo, e le tue croci
            di gesso restano sulle travi per una settimana.

      - testo: "Passare dal tavolo di Rozalia"
        descrizione: "Rozalia scrive lettere per chi non sa scrivere, a prezzi da Città Bassa, e intanto ascolta."
        immagine: personaggi/rozalia-marga
        requisiti: [monete >= 1]
        quando: [macerie.rozalia == 3]
        prova: { attributo: sociale, abilita: [galateo, ingannare], difficolta: Facile }
        successo:
          titolo: Il conto della settimana
          testo: |
            Rozalia ha messo accanto al bancone un tavolo pieghevole con un calamaio e una scatola di latta
            per le monete, con il coperchio ammaccato e ripiegato a mano perché chiuda ancora. Il calamaio è
            di vetro spesso, e l'inchiostro ha lasciato sull'orlo un anello secco. Ti racconta chi ha scritto
            a chi questa settimana e per quali somme.

            La lettera di una moglie della Gilda la ricorda parola per parola. «Ti tengo informat{o|a},
            tesoro, è nei patti» dice, e si rimette la piuma dietro l'orecchio. «Quella lettera, per la
            precisione, io non te l'ho mai raccontata.»
          effetti: { informazioni.pettegolezzo: 1 }
        fallimento:
          titolo: Lo segno a parte
          testo: |
            Rozalia ha la coda al tavolo e ti fa aspettare dietro una lavandaia che detta una lettera al
            fratello di Pannion. La lavandaia si corregge a ogni riga e fa cancellare a Rozalia ogni
            correzione, finché sul foglio le righe barrate sono più di quelle buone. Quando tocca a te ti dice
            soltanto di un mercante che ha cambiato fornitore di sale, e ti fa pagare l'inchiostro. «Lo segno
            a parte» dice, con la penna già sulla lettera successiva.
          effetti: { informazioni.voce: 1, monete: -1 }

      - testo: "Guardare i bambini nel cerchio di gesso"
        descrizione: "Nel cortile delle risse i bambini hanno inventato un gioco nuovo, e il cerchio di gesso gli serve ancora."
        requisiti: [nomea.citta-bassa >= 0]
        esito:
          titolo: Lo sceriffo e Vesh
          testo: |
            Nel cerchio di gesso due bambini si battono con due bastoni, e quello con il fazzoletto legato in
            testa fa Galdrick. Il cerchio è ancora quello delle risse, ripassato tante volte che la riga è
            larga tre dita. L'altro, che fa Vesh, muore tre volte di fila con grande soddisfazione di tutti,
            ogni volta con un rantolo più lungo. Alla quarta vogliono che Vesh lo faccia tu, e muori anche tu,
            stes{o|a} nella cenere, con un sasso appuntito sotto la scapola.
          pe: { espressivita: 2 }

      - testo: "Guardare i bambini nel cerchio di gesso"
        descrizione: "Nel cortile delle risse i bambini giocano. Ti vedono arrivare prima che tu veda loro."
        requisiti: [nomea.citta-bassa < 0]
        esito:
          titolo: Il più piccolo
          testo: |
            Quando entri nel cortile il gioco si ferma. I più grandi raccolgono i bastoni e scavalcano il muro
            di fondo senza una parola. Mettono i piedi negli stessi buchi della pietra dove la calce è caduta
            da tempo. Resta il più piccolo, scalzo, in mezzo al cerchio di gesso, con un bastone più alto di
            lui, e ti chiede se è vero che quella notte eri tu. Gli rispondi di sì, e la gola ti fa un po'
            male a dirlo. Lui ci pensa, poi esce anche lui dalla porta bruciata, camminando.
          pe: { resilienza: 2 }

      - testo: "Zappare l'orto di Orsola"
        descrizione: "Mentre zappa, a chi passa racconta di chi sei figli{o|a}."
        quando: [origine.figlio-della-citta-bassa >= 1]
        requisiti: [nomea.citta-bassa >= 0, nomea.citta-bassa < 4]
        prova: { attributo: sociale, abilita: [conoscenze-della-strada, empatia], difficolta: Media }
        successo:
          titolo: Le cipolle storte
          testo: |
            Orsola ti passa la zappa senza chiederti se hai tempo, e ti corregge il colpo come quando eri
            bambin{o|a}, con due dita sul gomito e lo stesso schiocco di lingua di allora. Il manico è lucido
            dove lo tengono le sue mani, e la lama è consumata da un lato fino a essere sbieca. Intanto parla
            con chiunque si fermi allo spago, e a ognuno racconta di chi sei figli{o|a} e di quale finestra
            rompevi da {ragazzo|ragazza}.

            La sera le cipolle sono zappate tutte, e Orsola te ne mette in tasca due, storte come le altre.
          effetti: { nomea.citta-bassa: 0.5 }
        fallimento:
          titolo: Il figlio del carradore
          testo: |
            Orsola ti passa la zappa e intanto racconta a chi passa di chi sei figli{o|a}, solo che si
            confonde e ti fa figli{o|a} del carradore della strada accanto, quello che è scappato con la cassa
            dei carrettieri. Provi a correggerla, e lei ti zittisce con il manico della zappa puntato sul
            petto, perché la storia è sua. Il fabbro che si era fermato a sentire se ne va scuotendo la testa.
            Tu passi il resto del pomeriggio a zappare cipolle in una terra grigia di cenere, con le orecchie
            rosse.

  # ------------------------------------------------------------ storia a 2 · Rozalia torna
  - id: rozalia-torna
    presso: macerie-della-pignatta
    immagine: personaggi/rozalia-marga
    titolo: Rozalia torna
    sommario: "La vecchia dell'orto dice che di notte una donna con la piuma dietro l'orecchio scava fra le macerie del retrobottega."
    luogo: Le macerie della Pignatta, a notte fonda
    area: citta-bassa
    requisiti: [pista.pelle >= 6, nomea.citta-bassa >= 2, macerie.rozalia == 0]
    testo: |
      Da tre notti una donna scava fra le macerie del retrobottega dopo la seconda ronda della Guardia. La
      mattina la cenere di quell'angolo è più scura del resto, perché qualcuno l'ha rivoltata.

      Aspetti sul bancone di quercia con la lanterna spenta. Dopo la seconda ronda una figura snella scavalca
      il muro di fondo con una lanterna cieca, che ha lo sportello aperto appena e lascia sulla cenere una
      lama di luce larga due dita. Si mette a scavare con una paletta da camino dove c'erano gli scaffali
      delle cartelle, e la paletta trova il ferro con un colpo sordo. Dalla cenere tira fuori una cassetta di
      ferro annerita, con gli angoli ribattuti a martello.

      Quando ti alzi lei non scappa, e batte due volte la paletta sull'orlo della cassetta come faceva con la
      penna sul calamaio.

      «Buonasera, tesoro. Ti aspettavo qualche notte fa, per la precisione» dice Rozalia Marga. «Mirko è
      morto, e io sono una falsaria senza padrone. Qui dentro ci sono le firme di mezza città, perché il fuoco
      s'è preso gli scaffali e la cassetta no.»

      {origine rampollo-dei-quartieri-alti} La tua famiglia firma molte carte, e ti chiedi se in quella
      cassetta c'è anche la vostra firma, e in fondo a quale lettera sia finita.
    opzioni:
      - testo: "Chiederle che fine hanno fatto gli altri"
        descrizione: "Quella notte, sullo spiazzo, c'erano quattro tenenti. Lei è l'unica che non hai più visto."
        costo: 0
        esito:
          titolo: Parenti rumorosi
          testo: |
            «Nestor si è seduto per terra e ha alzato le mani, e adesso sta in catene alla Caserma e fa le
            tisane ai carcerieri. Borso è in fondo alle celle, che conosce meglio di chiunque» dice, contando
            sulle dita sporche di cenere. «Nihali è partito per Pannion con la prima carovana, e lo sentivano
            tossire fino all'ultimo ponte.» La lanterna cieca, posata sulla cassetta, le illumina soltanto le
            mani. Si ferma, con un quarto dito rimasto a mezz'aria. «Di Mauro non chiedermi, tesoro, perché
            non ne parlo. Eravamo parenti rumorosi che litigavano sempre, e io mi tengo i ricordi belli.»
          segue: rozalia-torna

      - testo: "Lasciarla andare"
        descrizione: "Mirko è morto, e la guerra è finita. Una falsaria senza padrone può cercarsi un'altra città."
        esito:
          titolo: In pari
          testo: |
            Le dici di prendere la sua cassetta e di andarsene prima della terza ronda. «I conti li chiudo in
            pari» dice. Poi ti sussurra il nome di un funzionario della Casa dei Nodi che per sei anni le ha
            comprato permessi falsi, e per ogni permesso anche il giorno e la cifra, senza sbagliare un
            numero. Lo dice a memoria, e la cassetta resta chiusa sotto il suo braccio.

            Scavalca il muro di fondo senza fretta. Dall'altra parte senti lo sportello della lanterna cieca
            che si chiude con uno scatto.
          pe: { conoscenze-della-strada: 5 }
          imposta: { macerie.rozalia: 1 }
          effetti: { nomea.citta-bassa: 1, informazioni.segreto: 1 }

      - testo: "Dirle di venire alla Caserma con te"
        descrizione: "Senza Mirko non ha nessuno che la protegga, e lo sa meglio di te. Galdrick ascolta chi si presenta da solo."
        prova: { attributo: sociale, abilita: [persuasione, intimidire], difficolta: Media }
        successo:
          titolo: Un appuntamento
          testo: |
            Le dici che in città la cercano in molti, e che fra tutti Galdrick è quello che fa meno domande a
            chi si presenta da sé. Rozalia ci pensa il tempo di pulire la paletta sull'orlo della cassetta.
            Poi si sistema la piuma e ti cammina accanto fino alla Caserma con la cassetta sotto il braccio,
            come se andasse a un appuntamento. Galdrick la riceve in piedi e scrive il suo nome sul taccuino.
            Lei gli fa notare che la matita è troppo corta.
          pe: { persuasione: 5 }
          imposta: { macerie.rozalia: 2 }
          effetti: { nomea.citta-bassa: 1, rep.caserma: 1 }
        fallimento:
          titolo: Il fumo grigio
          testo: |
            Al nome di Galdrick Rozalia sorride, e tu capisci tardi che sta guardando la tua mano, andata da
            sola alla cintura.

            La fiala si rompe ai tuoi piedi e il fumo grigio ti riempie la gola, amaro come cenere masticata.
            Quando smetti di tossire il cortile è vuoto e la cassetta è sparita con lei. Sui sassi restano le
            schegge di un vetro sottile e verdastro, ancora unte. La buca però è più profonda di quanto le
            serviva, e sotto la cenere spunta l'angolo di una seconda cassetta.
          effetti: { tormento: 1 }

      - testo: "Prenderla prima che scappi"
        descrizione: "Ha una fiala di fumo da qualche parte sotto la mantellina. Bisogna arrivarle al polso prima che ci arrivi lei."
        prova: { attributo: fisico, abilita: [furtivita, atletica], difficolta: Media }
        successo:
          titolo: Il polso
          testo: |
            Quando la sua mano scende verso la mantellina tu sei già lì, e le stringi il polso con la fiala
            ancora intera fra le dita. Il polso è sottile e freddo, e sotto il pollice le senti battere il
            sangue tranquillo. Rozalia sospira. «Per la precisione, tesoro, questo è maleducato» dice, e ti
            lascia la fiala. Alla Caserma Galdrick scrive il suo nome sul taccuino senza alzare gli occhi, e
            la mattina dopo Orsola racconta la scena a tutta la strada.
          pe: { furtivita: 5 }
          imposta: { macerie.rozalia: 2 }
          effetti: { nomea.citta-bassa: 1, rep.caserma: 1 }
        fallimento:
          titolo: La seconda cassetta
          testo: |
            La fiala si rompe contro il bancone e il fumo grigio riempie il cortile. Quando si dirada sei in
            ginocchio a tossire con un graffio sul dorso della mano. Sulla quercia il legno è rimasto bagnato
            e lucido dove la fiala si è rotta. Rozalia è sparita con la sua cassetta. Nella buca, sotto la
            cenere, c'è l'angolo di una seconda cassetta di ferro, e la ricopri con il piede per quando
            tornerà.
          effetti: { ferite: 0.5 }

      - testo: "Offrirle un lavoro"
        descrizione: "Una falsaria senza padrone cerca un padrone nuovo, o almeno un cliente. La Città Bassa ha bisogno di qualcuno che sappia scrivere."
        prova: { attributo: sociale, abilita: [persuasione, ingannare], difficolta: Media }
        successo:
          titolo: Come te
          testo: |
            Le dici che in Città Bassa metà della gente non sa scrivere, e che dopo il fuoco tutti hanno
            bisogno di lettere e di ricevute vere. Rozalia ti ascolta seduta sulla cassetta, con la paletta di
            traverso sulle ginocchia.

            «Le lettere vere te le scrivo, tesoro, ma firmare col nome di un altro rendeva il doppio» dice
            alla fine. Poi accetta la metà, a patto di scegliersi il tavolo. Lo sceglie accanto al bancone, e
            la cassetta la seppellisce di nuovo dove l'ha trovata.
          pe: { persuasione: 5 }
          imposta: { macerie.rozalia: 3 }
          effetti: { nomea.citta-bassa: 1 }
        fallimento:
          titolo: Quando avrai un'offerta
          testo: |
            Rozalia ti lascia arrivare in fondo, poi rimette la cassetta nella buca e ci spinge sopra la
            cenere con la punta della scarpa. La batte con la suola finché la buca non si distingue più dal
            resto del retrobottega. «Mi offri lavoro con le tasche vuote, tesoro. Le tasche io le sento da
            qui» dice. «Ne riparliamo quando avrai un'offerta.» Scavalca il muro di fondo con un fruscio di
            gonna, e la cassetta resta sottoterra, sotto un palmo di cenere.
          effetti: { scandalo: 0.5 }

      - testo: "Pagarle il primo mese"
        descrizione: "Una borsa pesante sul bancone, e lei scrive per te e per la Città Bassa. Rozalia rispetta chi paga in anticipo."
        requisiti: [monete >= 30]
        esito:
          titolo: Il primo mese
          testo: |
            Conti le monete una alla volta sulla quercia bruciata. Rozalia le sposta con la punta della
            paletta senza toccarle, e alla fine annuisce. Dove sono passate, le monete hanno lasciato nella
            fuliggine tanti tondi puliti. «Puntuale nei pagamenti. Mi piace» dice. Seppellisce di nuovo la
            cassetta dove l'ha trovata, perché lì sotto non la cerca nessuno, e il giorno dopo arriva con un
            tavolo pieghevole e un calamaio. Lo mette accanto al bancone, e prima di sera ha già scritto tre
            lettere per tre vicine che non sanno scrivere.
          pe: { politica-ed-economia: 5 }
          imposta: { macerie.rozalia: 3 }
          effetti: { monete: -30, nomea.citta-bassa: 1 }

      - testo: "Parlarle come uno cresciuto sotto gli Scuri"
        descrizione: "Da ragazzin{o|a} portavi i messaggi degli Scuri su e giù per Via del Salmone, e Rozalia ti scriveva le lettere per tua madre a metà prezzo."
        quando: [origine.figlio-della-citta-bassa >= 1]
        prova: { attributo: sociale, abilita: [conoscenze-della-strada, persuasione], difficolta: Media }
        successo:
          titolo: A metà prezzo
          testo: |
            Le ricordi le lettere che ti scriveva per tua madre quando eri {il ragazzino|la ragazzina} delle
            consegne. «Avevi sempre le scarpe slacciate, tesoro» dice, e si sistema la piuma dietro
            l'orecchio. È una piuma d'oca con la punta tagliata di sbieco e scura d'inchiostro fino a metà. Le
            proponi di scrivere lettere e suppliche per il quartiere, a prezzi da Città Bassa e sotto gli
            occhi di tutti. «A metà prezzo per te, e per gli altri no» dice, battendo due volte la paletta
            sull'orlo della cassetta.
          pe: { conoscenze-della-strada: 5 }
          imposta: { macerie.rozalia: 3 }
          effetti: { nomea.citta-bassa: 1 }
        fallimento:
          titolo: Le scarpe slacciate
          testo: |
            Le ricordi le lettere che ti scriveva a metà prezzo, quando portavi i messaggi degli Scuri su e
            giù per Via del Salmone. Rozalia ride piano e ti chiama {il ragazzino|la ragazzina} delle
            consegne. Poi ti fa notare che quei messaggi li portavi a Mirko, e che dalla notte dello spiazzo
            lei non sa più da che parte stai. Chiude la cassetta, scavalca il muro di fondo e ti lascia sul
            bancone la lanterna cieca ancora accesa. Lo sportello è aperto di due dita, e la lama di luce cade
            sulla buca vuota.
          effetti: { sospetto: 0.5 }

  # ------------------------------------------------------------ storia a 2, nomea bassa · Rozalia ti cerca
  - id: rozalia-ti-cerca
    presso: macerie-della-pignatta
    immagine: personaggi/rozalia-marga
    titolo: Una falsaria al bancone
    sommario: "Nei vicoli il tuo nome lo dicono sottovoce. C'è una donna, seduta sul bancone bruciato, che invece lo dice ad alta voce."
    luogo: Le macerie della Pignatta, al tramonto
    area: citta-bassa
    requisiti: [pista.pelle >= 6, nomea.citta-bassa < 0, macerie.rozalia == 0]
    testo: |
      Al tramonto, quando arrivi, i bambini lasciano il cerchio di gesso e la vecchia dell'orto rientra in
      casa con la zappa. Sul muro annerito qualcuno ha scritto a carbone *assassini del governo*, e sotto c'è
      il tuo nome lavato a metà. Chi l'ha lavato ha strofinato con uno straccio bagnato, e il carbone sciolto
      è sceso in una striscia grigia fino a terra.

      {origine figlio-della-citta-bassa} È il muro della strada dove sei cresciut{o|a}, e chi ha lavato il tuo
      nome forse ti ha visto nascere.

      Sul bancone di quercia è seduta una donna snella con una piuma d'oca dietro l'orecchio, che si pulisce
      le unghie con un coltellino da ufficio. Il coltellino ha il manico d'osso e una lama corta, di quelle
      che servono a tagliare la carta e a raschiare l'inchiostro.

      «Buonasera, tesoro. Rozalia Marga, se te ne sei dimenticat{o|a}» dice, chiudendo il coltellino. «Nei
      vicoli il tuo nome lo dicono a bassa voce, e a me la gente che fa paura piace perché paga in anticipo.
      Mirko è morto, e io sono una falsaria senza padrone.» Indica la scritta con il mento. «Il nome in Città
      Bassa te lo rimetto a posto io con un po' di lettere di ringraziamento firmate da chi non sa scrivere,
      perché la gente crede a quello che legge.»
    opzioni:
      - testo: "Mandarla via"
        descrizione: "Mirko è morto. Una falsaria senza padrone può cercarsi un'altra città, e un altro cliente."
        esito:
          titolo: La porta bruciata
          testo: |
            Le dici di andarsene dalla Città Bassa prima che cambi idea, e la voce ti esce più ferma di quanto
            ti senta. Rozalia scende dal bancone senza fretta e si rimette il coltellino nella manica.
            «Peccato. Sarebbe stato il mio lavoro migliore» dice. Passa dalla porta bruciata invece che dal
            muro, perché la vedano uscire, e sulla soglia si scuote la cenere dall'orlo della gonna. Dietro le
            imposte di fronte qualcuno ha guardato tutto. La mattina dopo la scritta sul muro è lavata un po'
            di più.
          pe: { resilienza: 5 }
          imposta: { macerie.rozalia: 1 }
          effetti: { nomea.citta-bassa: 1 }

      - testo: "Portarla alla Caserma"
        descrizione: "Rozalia ha detto che la gente che fa paura le piace. Puoi vedere se le piace anche da vicino."
        prova: { attributo: sociale, abilita: [intimidire, persuasione], difficolta: Media }
        successo:
          titolo: Davanti a tutti
          testo: |
            Le dici di scendere dal bancone e di camminarti davanti fino alla Caserma, e glielo dici con la
            voce che in Città Bassa ricordano. Rozalia smette di sorridere. Richiude il coltellino contro la
            coscia e te lo porge dalla parte del manico. Dalle finestre la strada guarda una tenente di Vesh
            portata via viva, senza un colpo. Galdrick scrive il suo nome sul taccuino. Nei vicoli, quella
            sera, il tuo nome lo dicono con un tono un po' diverso.
          pe: { intimidire: 5 }
          imposta: { macerie.rozalia: 2 }
          effetti: { nomea.citta-bassa: 1, rep.caserma: 1 }
        fallimento:
          titolo: La sua offerta, per iscritto
          testo: |
            Rozalia ti lascia finire, cortese come una maestra con un bambino, poi rompe una fiala sulla
            quercia. Il fumo grigio ti brucia gli occhi e ti fa lacrimare, così che per un poco sembri
            commoss{o|a}. Quando si dirada sul bancone c'è un foglio piegato in due, fermato da un sasso. È la
            sua offerta in bella grafia con il prezzo, e in fondo c'è una riga, *ripasso fra qualche sera*.
            L'inchiostro è secco da ore, e il foglio l'aveva scritto prima che tu arrivassi. La scritta sul
            muro, intanto, è ancora lì.
          effetti: { tormento: 1 }

      - testo: "Accettare, ma alle tue condizioni"
        descrizione: "Niente firme false sul tuo conto. Lettere vere, per chi non sa scrivere, e lei al bancone tutti i giorni dove la vedono."
        prova: { attributo: sociale, abilita: [persuasione, ingannare], difficolta: Media }
        successo:
          titolo: Lettere vere
          testo: |
            Le dici che vuoi lettere vere e un tavolo qui, alla luce del giorno, dove scriva per chi non sa
            farlo e dica a tutti chi la paga. Rozalia ascolta e intanto pulisce la lama del coltellino
            sull'orlo della manica. «Una reputazione onesta costa più cara, tesoro, perché ci vuole più tempo,
            però è anche più difficile da smascherare» dice, e accetta senza tirare sul prezzo. Il giorno dopo
            arriva con un tavolo pieghevole e un calamaio. Il tavolo ha le gambe legate con lo spago dove le
            cerniere non tengono più.
          pe: { persuasione: 5 }
          imposta: { macerie.rozalia: 3 }
          effetti: { nomea.citta-bassa: 1 }
        fallimento:
          titolo: Ripasso fra qualche sera
          testo: |
            Le spieghi le tue condizioni, e lei ti ascolta senza interromperti, rigirandosi la piuma fra le
            dita. «Le condizioni le fa chi paga» dice alla fine, e scende dal bancone. Scrive il biglietto in
            piedi, con il foglio appoggiato al ginocchio. Te lo lascia sulla quercia con il suo prezzo,
            scritto in una grafia piccola e diritta, e in fondo una riga, *ripasso fra qualche sera*.
          effetti: { scandalo: 0.5 }

      - testo: "Pagarle il primo mese"
        descrizione: "Un mese pagato in anticipo, e lettere vere per la Città Bassa, firmate col nome di chi le detta. Il tuo resta fuori."
        requisiti: [monete >= 30]
        esito:
          titolo: Il tavolo pieghevole
          testo: |
            Conti le monete sul bancone e le dici che cosa vuoi. Lettere vere per chi non sa scrivere, a
            prezzo di strada, e il tuo nome fuori da tutto. Rozalia sposta le monete con la punta del
            coltellino e le conta due volte, la seconda all'indietro. «Puntuale nei pagamenti. Mi piace» dice.
            Il giorno dopo mette un tavolo pieghevole accanto al bancone, e a sera la prima a sedersi davanti
            a lei è la vecchia dell'orto.
          pe: { politica-ed-economia: 5 }
          imposta: { macerie.rozalia: 3 }
          effetti: { monete: -30, nomea.citta-bassa: 1 }

  # ------------------------------------------------------------ storia a 4 · il cantiere
  - id: il-cantiere
    presso: macerie-della-pignatta
    immagine: ambientazione/pignatta-grassa
    titolo: Il cantiere
    sommario: "Sulla porta bruciata della Pignatta qualcuno ha inchiodato un avviso d'asta. Davanti, la Città Bassa aspetta di sapere da che parte stai."
    luogo: Le macerie della Pignatta, di mattina
    area: citta-bassa
    requisiti: [pista.pelle >= 6, nomea.citta-bassa >= 4, macerie.cantiere == 0]
    testo: |
      Stamattina sulla porta bruciata c'è un avviso fissato con quattro chiodi nuovi. Il lotto della Pignatta
      Grassa, che era di Mirko Vesh e adesso è del Comune, va all'asta fra un mese. Sul legno nero della porta
      le teste dei chiodi luccicano, e si vedono da metà strada.

      Davanti all'avviso c'è Cosimo Venn, ispettore della Casa dei Nodi, un uomo magro con il libro dei lotti
      sotto il braccio e gli stivali puliti tenuti lontani dalla cenere. Il libro è rilegato in tela grigia,
      con gli angoli rinforzati di cuoio e una fettuccia per tenere il segno. Due taglialegna sono scesi dalla
      Segheria a vedere, e sul muro di fondo un cappuccio blu seduto a gambe incrociate mastica qualcosa.

      «Il compratore della Gilda tira su una locanda con il magazzino dietro in due mesi, e paga la giornata a
      chi lavora» dice Venn. «Il Comune incassa, e voi avete un lavoro. Non vedo il problema.»

      {origine mercante-dei-ponti} Venn ti ha riconosciuto per uno della Gilda prima che tu aprissi bocca, e
      il problema che non vede lo dice guardando te.

      «Il problema è che qui ci dormono» dice Orsola, «e le cipolle sono mie.» Poi si girano tutti verso di
      te.
    opzioni:
      - testo: "Guardare il cappuccio blu sul muro"
        descrizione: "Una ragazzina con le lentiggini segue la discussione dall'alto, come a teatro."
        immagine: personaggi/gaia-acari
        costo: 0
        esito:
          titolo: Chi mi dà da mangiare
          testo: |
            La ragazzina ti vede guardarla e smette di masticare, senza imbarazzo, come un gatto sorpreso su
            una mensola. In mano ha mezza cipolla cruda con i segni dei denti. «Io sto con chi mi dà da
            mangiare» dice ad alta voce, così la sente tutta la strada, «e finora mi ha dato da mangiare la
            vecchia.» Venn sfoglia il libro dei lotti per cercare il nome della ragazzina, e quando alza la
            testa il muro è vuoto.
          segue: il-cantiere

      - testo: "Leggere l'avviso e il libro dei lotti"
        descrizione: "Un'asta del Comune ha le sue regole, e un ispettore con gli stivali puliti non sempre le ha lette tutte."
        prova: { attributo: mentale, abilita: [politica-ed-economia, accademiche], difficolta: Media }
        successo:
          titolo: Il sigillo che manca
          testo: |
            Per mettere all'asta un lotto confiscato serve il sigillo del Consiglio, e sull'avviso c'è
            soltanto quello della Casa dei Nodi. La regola sta nel libro dei lotti stesso, in un capoverso
            scritto più piccolo in fondo a una pagina.

            Venn arrossisce fino alle orecchie e stacca l'avviso con i suoi quattro chiodi nuovi. Finché il
            Consiglio non si riunisce, il lotto resta a chi ci abita, e Orsola ti dà una cipolla come caparra.
            Il pomeriggio la strada comincia a portare le travi.
          pe: { politica-ed-economia: 5 }
          imposta: { macerie.cantiere: 1 }
          effetti: { nomea.citta-bassa: 1 }
        fallimento:
          titolo: Tutto in regola
          testo: |
            Ti fai prestare il libro dei lotti e lo leggi davanti a tutti. La scrittura della Casa dei Nodi è
            fitta e piena di abbreviazioni che non conosci, con i numeri dei lotti in colonna sul margine, e
            dopo la terza pagina ti si annebbia la vista. Venn aspetta con le mani dietro la schiena e poi ti
            spiega pagina per pagina che è tutto in regola, con una pazienza che fa più male di uno schiaffo.
            La strada si disperde a gruppi, e nessuno ha deciso niente.
          effetti: { scandalo: 0.5 }

      - testo: "Mettere i tuoi soldi nel cantiere del quartiere"
        descrizione: "Una borsa piena nelle mani giuste, e la strada ricostruisce da sé. Con una caparra in mano anche un ispettore sa aspettare."
        requisiti: [monete >= 20]
        esito:
          titolo: La caparra
          testo: |
            Conti le monete nella mano di Venn e gli dici che sono la caparra del quartiere, e che il resto lo
            pagherà la strada, una giornata di lavoro alla volta. Venn le guarda, poi guarda la strada che lo
            guarda, e scrive una ricevuta con molta cura, tirando fuori la lingua all'angolo della bocca. Usa
            il libro dei lotti come piano d'appoggio e soffia sull'inchiostro prima di consegnartela. Orsola
            fa un segno sull'avviso con il carbone. Il pomeriggio i taglialegna tornano con una trave a testa,
            e Tibo conta i chiodi nuovi uno per uno.
          pe: { persuasione: 5 }
          imposta: { macerie.cantiere: 1 }
          effetti: { monete: -20, nomea.citta-bassa: 1 }

      - testo: "Far leggere l'atto a Rozalia"
        descrizione: "Rozalia conosce le carte della Pignatta meglio di chiunque. Molte, per la precisione, le ha scritte lei."
        immagine: personaggi/rozalia-marga
        quando: [macerie.rozalia == 3]
        esito:
          titolo: La vedova Brena
          testo: |
            Rozalia lascia il suo tavolo, si fa dare il libro dei lotti e lo sfoglia con l'unghia del mignolo,
            così in fretta che Venn allunga una mano per fermarla e poi non osa. «Mirko la Pignatta l'aveva
            intestata a una vedova rispettabile, perché a lui conveniva così» dice. «La firma, tesoro, l'ho
            fatta io, anni fa.» Il nome sull'atto è quello di Orsola Brena, scritto in una grafia piccola e
            diritta. Orsola si siede sul bancone e non riesce a smettere di ridere, e Venn chiude il libro
            senza una parola.
          pe: { accademiche: 5 }
          imposta: { macerie.cantiere: 1 }
          effetti: { nomea.citta-bassa: 1 }

      - testo: "Chiamare i taglialegna della cooperativa"
        descrizione: "La cooperativa ha il legname, e il Comune il lotto. Se si mettono d'accordo, qui nasce una mensa."
        quando: [pista.pelle >= 7]
        esito:
          titolo: Il legname e il lotto
          testo: |
            Chiami i due taglialegna, e loro ti dicono che la cooperativa il legname ce l'ha, e che le travi
            le porterebbe gratis se il lotto restasse del Comune. Hanno le mani appiccicose di resina e la
            segatura nelle pieghe delle maniche. Scrivi due righe a Julia Castaldi sul retro di una ricevuta,
            con un carboncino che si spezza a metà, e la risposta arriva prima di sera con il sigillo del
            Consiglio. L'asta è sospesa e il lotto resta al Comune. La cooperativa del grano ci farà una
            mensa. Venn stacca l'avviso con una faccia da funerale.
          pe: { politica-ed-economia: 5 }
          imposta: { macerie.cantiere: 2 }
          effetti: { nomea.citta-bassa: 1, rep.castaldi: 0.5 }

      - testo: "Scrivere a Julia Castaldi"
        descrizione: "Il lotto è del Comune, e il Comune è Julia. Forse la Rappresentante preferisce un tetto per la Città Bassa a un'asta."
        quando: [pista.pelle < 7]
        esito:
          titolo: La risposta del Municipio
          testo: |
            Scrivi a Julia Castaldi su un foglio che ti presta Venn, appoggiato alla porta bruciata, e la
            fuliggine passa dal legno alla carta e dalla carta alle tue dita. Venn ti guarda scrivere da sopra
            la spalla, e a ogni riga allunga il collo un poco di più. La risposta arriva prima di sera, con il
            sigillo del Consiglio. Il lotto resta del Comune, e appena le casse lo permettono ci si farà una
            mensa per la Città Bassa.
          pe: { politica-ed-economia: 5 }
          imposta: { macerie.cantiere: 2 }
          effetti: { nomea.citta-bassa: 1, rep.castaldi: 0.5 }

      - testo: "Lasciare fare alla Gilda"
        descrizione: "La Gilda paga la giornata e costruisce in fretta. Venn, a bassa voce, parla anche di una provvigione."
        immagine: fazioni/gilda-dei-mercanti
        esito:
          titolo: La provvigione
          testo: |
            Dici a Venn che la strada ha bisogno di lavoro prima che di cipolle, a patto che il compratore
            assuma gente del quartiere. Venn lo scrive sul libro dei lotti e ti fa scivolare in mano una
            piccola borsa, che chiama provvigione. È di pelle morbida e chiusa da un laccio, e le monete
            dentro non fanno rumore.

            Orsola stringe la zappa, poi torna a zappare senza salutarti. Nel pomeriggio il compratore manda
            un capomastro, che assume dodici uomini della strada e promette che l'orto per adesso resta dov'è.
          pe: { politica-ed-economia: 5 }
          imposta: { macerie.cantiere: 3 }
          effetti: { monete: 15, nomea.citta-bassa: 1, rep.gilda: 0.5 }

  # ------------------------------------------------------------ storia a 6 · l'insegna nuova
  - id: l-insegna-nuova
    presso: macerie-della-pignatta
    immagine: ambientazione/citta-bassa
    titolo: L'insegna nuova
    sommario: "Dove c'era la Pignatta Grassa i muri hanno di nuovo un tetto. Manca soltanto il nome, e la strada vuole che lo scelga tu."
    luogo: Le macerie della Pignatta, che non sono più macerie
    area: citta-bassa
    requisiti: [pista.pelle >= 6, nomea.citta-bassa >= 6, macerie.insegna == 0, macerie.cantiere >= 1]
    testo: |
      I muri anneriti sono gli stessi, con la fuliggine ancora dentro i giunti delle pietre, e sopra adesso
      c'è un tetto di travi chiare e di tegole spaiate raccolte in tutta la Città Bassa. Le tegole hanno tre
      colori e due misure, e chi le ha posate ha messo le più grandi in basso, dove l'acqua scende più forte.
      Sulle travi si vedono ancora i colpi dell'ascia che le ha squadrate. Il bancone di quercia è stato
      raschiato fino al legno buono, e sopra ci sono già le scodelle impilate.

      Alla porta nuova manca soltanto l'insegna, e Mastro Fenzi aspetta in cima a una scala con un'asse bianca
      di calce e il barattolo del colore agganciato alla scala. Di solito fa i ritratti in Municipio, e da
      un'ora Orsola e i taglialegna gli gridano nomi da sotto.

      Quando ti vede appoggia il pennello sul piolo. «Hanno deciso che decidi tu, e io ho fame. Dimmelo prima
      che si secchi il colore» dice.

      *La Pignatta la chiamavano grassa perché ingrassava Mirko.* Ti scappa un sorriso, e non lo nascondi.
    opzioni:
      - testo: "Chiamarla *Le Cipolle Storte*"
        descrizione: "Una casa per gli orfani della razzia, con la cucina di Orsola e l'orto davanti alla porta."
        quando: [macerie.cantiere == 1]
        esito:
          titolo: Le Cipolle Storte
          testo: |
            Mastro Fenzi dipinge sull'asse tre cipolle verdi, tutte piegate dalla stessa parte come quelle
            dell'orto, e sotto il nome in lettere tonde. La sera i quattro bambini che dormivano sotto il
            bancone dormono nella stanza di dietro, su materassi di paglia nuova che scricchiolano a ogni giro
            nel sonno, e Tibo tiene il secchio dei chiodi accanto al letto. I due vecchi hanno una panca
            ciascuno vicino al fuoco, e continuano a non parlarsi.
          pe: { empatia: 5 }
          imposta: { macerie.insegna: 1 }
          effetti: { nomea.citta-bassa: 1, racconto: 1 }

      - testo: "Chiamarla *La Pignatta Magra*"
        descrizione: "La mensa del Comune, una scodella a prezzo fisso per chiunque si sieda."
        quando: [macerie.cantiere == 2]
        esito:
          titolo: La Pignatta Magra
          testo: |
            Quando lo dici la strada resta zitta un momento, poi ride tutta insieme, e i taglialegna più forte
            di tutti. Mastro Fenzi dipinge una pentola stretta e alta, con un manico solo, e sotto il nome in
            lettere nere che colano appena prima di asciugare. La prima sera le cuoche del Comune servono
            zuppa di farro a pochi spiccioli la scodella. Il vapore appanna le finestre nuove prima ancora che
            qualcuno le abbia pulite dalla calce, e sul vetro appannato i bambini disegnano con il dito.
          pe: { espressivita: 5 }
          imposta: { macerie.insegna: 1 }
          effetti: { nomea.citta-bassa: 1, racconto: 1 }

      - testo: "Chiamarla *Il Cerchio di Gesso*"
        descrizione: "La locanda di quartiere della Gilda, con il cortile delle risse tenuto com'era."
        quando: [macerie.cantiere == 3]
        esito:
          titolo: Il Cerchio di Gesso
          testo: |
            Il capomastro della Gilda voleva un nome con dentro la parola *mercanti*, e la strada gli ha
            gridato contro per un'ora, finché lui si è tolto il cappello per farsi aria. Il cerchio di gesso
            invece piace a tutti. Mastro Fenzi lo dipinge bianco su fondo nero, e per farlo perfettamente
            tondo pianta un chiodo al centro dell'asse e ci gira intorno con uno spago legato al pennello. La
            sera il locandiere della Gilda lascia che i bambini ci giochino dentro finché non si accendono le
            lanterne. Orsola beve il primo bicchiere e lo trova annacquato, come ai vecchi tempi.
          pe: { galateo: 5 }
          imposta: { macerie.insegna: 1 }
          effetti: { nomea.citta-bassa: 1, racconto: 1 }

      - testo: "Lasciare le lettere a Rozalia"
        descrizione: "Le lettere le dipinge Rozalia, che con il pennello è più brava del pittore. Il nome lo sceglie lei, e Fenzi la lascia fare."
        immagine: personaggi/rozalia-marga
        quando: [macerie.rozalia == 3]
        esito:
          titolo: Conti in Pari
          testo: |
            Rozalia sale sulla scala al posto di Fenzi, che glielo lascia fare con sollievo, e scrive *Conti
            in Pari* in una grafia così bella che la strada smette di gridare per guardarla. Tiene il pennello
            impugnato vicino alle setole, e le aste delle lettere vengono tutte alte uguali senza una riga
            tirata prima. Quando scende si pulisce il pennello su uno straccio e poi piega lo straccio in
            quattro, come una lettera da spedire. «I conti li chiudo sempre in pari, tesoro» dice. «Con la
            Pignatta ci ho messo un po' di più, tutto qui.» Mastro Fenzi studia le lettere con il naso quasi
            sull'asse, e la sera le offre da bere.
          pe: { espressivita: 5 }
          imposta: { macerie.insegna: 1 }
          effetti: { nomea.citta-bassa: 1, racconto: 1 }

      - testo: "Lasciare che lo scelga Tibo"
        descrizione: "Il secchio dei chiodi l'ha riempito lui, uno alla volta. Forse il nome spetta a chi ha cominciato."
        esito:
          titolo: Il Chiodo
          testo: |
            Tibo ci pensa con la serietà di un consigliere, grattandosi una crosta sul ginocchio, e poi dice
            *Il Chiodo*, perché senza i chiodi il tetto non stava su. La strada ci prova a protestare, ma
            Orsola dà ragione a lui, e Fenzi dipinge un chiodo grosso come un remo, un po' piegato in punta.
            La sera stessa Tibo inchioda sotto l'insegna l'ultimo chiodo del suo secchio, uno di quelli
            raddrizzati fra due sassi e ancora neri del fuoco. Da allora chiunque entri lo tocca per fortuna,
            e in poche settimane la testa del chiodo diventa lucida.
          pe: { empatia: 5 }
          imposta: { macerie.insegna: 1 }
          effetti: { nomea.citta-bassa: 1, racconto: 1 }

  # ------------------------------------------------------------ la carta
  - id: carta-la-cenere-della-pignatta
    immagine: personaggi/gaia-acari
    titolo: Un cappuccio blu fra la cenere
    sommario: "Una ragazzina con il cappuccio blu ti si mette al passo e ti dice che alla Pignatta qualcuno ha fame."
    luogo: Città Bassa, verso sera
    tipo: carta
    area: citta-bassa
    requisiti: [pista.pelle >= 6, macerie.cantiere == 0]
    testo: |
      Stai scendendo per Via del Salmone quando un cappuccio blu scuro ti si mette al passo senza chiedere il
      permesso. È lana tinta male, più chiara sulle cuciture dove il colore non ha preso, e da sotto spunta
      soltanto un naso pieno di lentiggini.

      «Alla Pignatta la Guardia passa due volte per notte, e in mezzo sotto il bancone ci dormono in sei» dice
      la ragazzina senza guardarti. «Tu il pane te lo puoi permettere, si vede da come cammini. Me lo compri o
      no? Guarda che due volte non te lo chiedo.»

      {origine fuggiasco-di-ghoran} La mano ti va da sola alla tasca, dove da quando sei scappat{o|a} da
      Ghoran tieni sempre un pezzo di pane per dopo, avvolto in un fazzoletto.

      In fondo alla strada, dalla parte dei muri anneriti, sale il filo di fumo di un fuoco piccolo, fatto con
      legna umida che fuma più di quanto scaldi.
    opzioni:
      - testo: "Seguirla alle macerie con il pane"
        descrizione: "Una pagnotta al forno dell'angolo, e la strada fino al bancone di quercia."
        requisiti: [monete >= 1]
        esito:
          titolo: Sei pezzi uguali
          testo: |
            Compri una pagnotta al forno dell'angolo, ancora tiepida sotto la crosta, e Gaia ti porta fino al
            bancone bruciato, dove un bambino scalzo con un secchio di chiodi la saluta per nome. Dividete il
            pane in sei pezzi uguali, e lei controlla che siano davvero uguali, soppesandoli uno per mano come
            un mercante di spezie. Per sé non ne tiene nemmeno una briciola, e quelle cadute sul legno le
            raccoglie con il dito e le mette sul pezzo più piccolo. Poi se ne va senza salutare. La vecchia
            dell'orto davanti alla porta ti guarda, e la volta dopo ti saluta.
          pe: { empatia: 2 }
          effetti: { monete: -1, nomea.citta-bassa: 0.5 }
      - testo: "Darle uno spicciolo per il pane"
        descrizione: "Il pane lo può comprare anche lei. Tu hai da fare."
        requisiti: [monete >= 1]
        esito:
          titolo: Uno spicciolo
          testo: |
            Le dai uno spicciolo. Gaia lo morde con un dente solo, quello davanti. Guarda il segno contro la
            luce prima di metterselo in tasca, e in cambio ti racconta, già voltata, che al forno dell'angolo
            il pane di ieri lo vendono per pane di oggi, e chi lo compra a chi lo rivende. Poi si infila in un
            vicolo verso le macerie, e non la vedi più.
          effetti: { monete: -1, informazioni.voce: 1 }
      - testo: "Lasciarla parlare da sola"
        descrizione: "Una ragazzina della Città Bassa che chiede soldi per il pane. Ne hai sentite tante, di storie così."
        costo: 0
        esito:
          titolo: Una parolaccia
          testo: |
            Allunghi il passo e lei non ti segue. Alle tue spalle ti dice una parolaccia che fa voltare una
            donna con un cesto di panni, e poi un'altra, più lunga, che non conoscevi. Ti ritrovi a ripeterla
            sottovoce per impararla, e conti le sillabe sulle dita per non perderne una. Quando ti giri il
            cappuccio blu è già sparito, e il filo di fumo in fondo alla strada è sempre lì.
