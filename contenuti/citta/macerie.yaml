# La città viva, luogo 13: le macerie della Pignatta (presso: macerie-della-pignatta, area citta-bassa, visibile
# con pista.pelle >= 6). L'attività fra le travi bruciate, le tre storie della Città Bassa (2 Rozalia torna, con
# la variante per chi ha la nomea bassa; 4 il cantiere; 6 l'insegna nuova) e la carta della cenere.
# Reputazione: nomea.citta-bassa (−5…+10, già esistente). Sgomberare, dare da mangiare e fare la guardia la fanno
# salire di ½ fino a 4; puntellare i muri (fisico), cacciare i ladri di ferro (sociale) e scegliere le travi
# (mentale) fino a 6; le storie danno +1, così da 2 si arriva a 3, da 4 a 5 e da 6 a 7.
# Nomea bassa: con nomea < 0 Rozalia viene a cercarti lei (rozalia-ti-cerca), e l'attività ha varianti
# (le croci di legno, i bambini che scappano, le scritte sui muri).
# macerie.rozalia: 1 lasciata andare, 2 consegnata, 3 lavora per te (poi un'opzione dell'attività al suo tavolo).
# Se una prova per consegnarla o assumerla fallisce, Rozalia scappa ma la storia resta aperta.
# macerie.cantiere: 1 il quartiere, 2 il Comune e le cooperative, 3 la Gilda; l'insegna nuova cambia di
# conseguenza (casa per gli orfani, mensa, locanda di quartiere).
# Stato del mondo: le cooperative di Julia nominate solo con pista.pelle >= 7. Il destino di Mauro non si
# dice (può essere preso o morto); Nestor e Borso sono in catene.
# Nomi nuovi, che il Codex non dà: Orsola Brena (la vecchia dell'orto di cipolle), Tibo (orfano della razzia
# che dorme sotto il bancone), Cosimo Venn (ispettore dei lotti della Casa dei Nodi). Mastro Fenzi, il
# pittore, è solo nominato in municipio.yaml.
storylet:
  # ------------------------------------------------------------ l'attività ripetibile
  - id: fra-le-travi-bruciate
    presso: macerie-della-pignatta
    immagine: ambientazione/pignatta-grassa
    titolo: Fra le travi bruciate
    sommario: "Dove c'era la Pignatta Grassa c'è da sgomberare e da fare la guardia, e la Città Bassa guarda."
    luogo: Le macerie della Pignatta
    area: citta-bassa
    ripetibile: true
    requisiti: [pista.pelle >= 6]
    testo: |
      Della Pignatta Grassa restano i muri di pietra anneriti e il bancone di
      quercia, che il fuoco ha soltanto scurito. Nel cortile delle risse, sotto
      la cenere impastata di pioggia, si vede ancora il cerchio di gesso.

      {origine figlio-della-citta-bassa} Da ragazzino guardavi le risse dalla
      soglia, perché dentro non ti lasciavano entrare.

      Di giorno fra le travi giocano i bambini, di notte sotto il bancone dorme
      chi non ha un tetto e nel cortile frugano i ladri di ferro. Davanti alla
      porta una vecchia zappa un orto di cipolle tutte piegate verso la strada.
    opzioni:
      - testo: "Sgomberare le macerie"
        descrizione: "Travi da spostare e chiodi da cavare, che il ferraiolo di Via del Salmone compra a peso."
        requisiti: [nomea.citta-bassa >= 0, nomea.citta-bassa < 4]
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Media }
        successo:
          titolo: Il secchio dei chiodi
          testo: |
            Sposti le travi facendo leva con un palo di ferro e cavi i chiodi con la
            tenaglia finché non ti fa male il polso. Un bambino scalzo, Tibo, li
            raccoglie nel suo secchio e raddrizza quelli piegati fra due sassi con
            una serietà da notaio. A sera il ferraiolo di Via del Salmone pesa il
            ferro e ti paga, e Tibo guarda le monete finché non gliene lasci
            qualcuna.
          effetti: { monete: 1, nomea.citta-bassa: 0.5 }
        fallimento:
          titolo: La trave che scivola
          testo: |
            La terza trave, ancora umida dentro, ti scivola dalla spalla e ti cade
            sul piede, e il dolore arriva un momento dopo, con calma, come un
            creditore. Un bambino scalzo ti guarda dal bancone e ti chiede se
            adesso il palo di ferro puoi darlo a lui, visto che tu non lo usi.
          effetti: { ferite: 0.5 }

      - testo: "Sgomberare le macerie"
        descrizione: "Travi da spostare e chiodi da cavare accanto alle croci di legno, con la strada che ti guarda."
        requisiti: [nomea.citta-bassa < 0]
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Media }
        successo:
          titolo: Una brocca sulla soglia
          testo: |
            Lavori da solo tutta la mattina, attento a non urtare le croci di
            legno davanti alla porta, una per ogni ragazzo morto sullo spiazzo.
            Dalle finestre di fronte ti guardano in silenzio. Verso sera sulla
            soglia compare una brocca d'acqua, e chi l'ha messa lì non si fa
            avanti. Il ferraiolo ti pesa i chiodi senza parlare.
          effetti: { monete: 1, nomea.citta-bassa: 0.5 }
        fallimento:
          titolo: La croce storta
          testo: |
            Una trave ti sfugge mentre la giri e piega una delle croci di legno.
            La raddrizzi subito in ginocchio, ma dalla finestra di fronte una
            donna ha visto tutto e chiude le imposte con un colpo che senti fino
            al cortile.
          effetti: { tormento: 1 }

      - testo: "Dare da mangiare a chi ci dorme"
        descrizione: "Pane e zuppa per chi dorme sotto il bancone. Bastano poche monete, e un po' di pazienza."
        requisiti: [nomea.citta-bassa >= 0, nomea.citta-bassa < 4, monete >= 2]
        esito:
          titolo: Le scodelle
          testo: |
            Compri pane e una pentola di zuppa di cavolo al forno dietro l'angolo,
            con il patto di riportarla lavata. Sotto il bancone dormono quattro
            bambini e due vecchi che non si parlano fra loro. Mangiano tutti in
            fretta con la scodella fra le ginocchia e un occhio alla pentola. Uno
            dei vecchi ti dice che la zuppa della Pignatta era peggiore, però la
            serviva Mauro, e Mauro almeno rideva.
          pe: { empatia: 2 }
          effetti: { monete: -2, nomea.citta-bassa: 0.5 }

      - testo: "Dare da mangiare a chi ci dorme"
        descrizione: "Pane e zuppa per chi dorme sotto il bancone. Prima però devono decidere se accettarli da te."
        requisiti: [nomea.citta-bassa < 0, monete >= 2]
        esito:
          titolo: Un passo indietro
          testo: |
            Porti la pentola fino al bancone, con il manico che ti scotta le dita, ma
            nessuno si muove finché resti lì vicino. La posi sulla quercia e ti ritiri
            fino all'orto, e solo allora li vedi uscire a uno a uno. Il più piccolo,
            prima di mangiare, si volta verso di te e ti fa un cenno con il mento.
          pe: { empatia: 2 }
          effetti: { monete: -2, nomea.citta-bassa: 0.5 }

      - testo: "Fare la guardia di notte"
        descrizione: "I ladri di ferro arrivano dopo la seconda ronda, con un carretto dalle ruote fasciate di stracci."
        requisiti: [nomea.citta-bassa < 4]
        prova: { attributo: mentale, abilita: [percezione, resilienza], difficolta: Media }
        successo:
          titolo: Gli stracci alle ruote
          testo: |
            Passi la notte seduto sul bancone con la schiena contro la pietra
            fredda. Dopo la seconda ronda senti arrivare il carretto, e l'asse
            cigola più di quanto gli stracci riescano a coprire. Ti basta alzarti in
            piedi nel buio perché i due ladri lo lascino lì e scappino. La mattina i
            vicini si dividono i cerchioni e ti lasciano qualche moneta sul bancone.
          effetti: { monete: 2, nomea.citta-bassa: 0.5 }
        fallimento:
          titolo: Il sonno prima dell'alba
          testo: |
            Dopo la seconda ronda gli occhi ti si chiudono da soli, promettendo
            che è solo per un momento. Ti svegli all'alba con la cenere sulla
            guancia, e delle cerniere di ferro del bancone restano otto buchi
            puliti nel legno, a un braccio dalla tua testa.

      - testo: "Ascoltare cosa si dice di quella notte"
        descrizione: "La sera, intorno al bancone, la notte della Pignatta si racconta ancora, e ogni volta un po' diversa."
        requisiti: [nomea.citta-bassa >= 3]
        prova: { attributo: sociale, abilita: conoscenze-della-strada, difficolta: Facile }
        successo:
          titolo: La versione di stasera
          testo: |
            Ti siedi sul gradino del cortile. Racconta un facchino con la voce
            grossa, e nella versione di stasera Galdrick e Vesh si battono per
            un'ora intera, con più affondi di quanti una spada ne regga. Quando
            compare il tuo nome qualcuno si gira a guardarti e sorride. Dopo, mentre
            gli altri vanno via, il facchino ti dice chi in Città Bassa ha
            ricominciato a prestare soldi a interesse.
          effetti: { informazioni.voce: 1 }
        fallimento:
          titolo: Troppo vicino
          testo: |
            Ti siedi troppo vicino, e quando il facchino arriva al punto in cui
            compari tu si accorge di averti davanti. Diventa rosso, salta due
            pezzi del racconto e finisce in fretta, con un finale che non convince
            nemmeno lui. Gli altri ti guardano come se fosse colpa tua, e te ne
            vai prima che si alzino.

      - testo: "Ascoltare cosa si dice di quella notte"
        descrizione: "La sera, intorno al bancone, la notte della Pignatta si racconta ancora. Di te, per adesso, si parla poco."
        requisiti: [nomea.citta-bassa >= 0, nomea.citta-bassa < 3]
        prova: { attributo: sociale, abilita: conoscenze-della-strada, difficolta: Facile }
        successo:
          titolo: Le randellate
          testo: |
            Racconta una lavandaia con le braccia rosse, e parla soprattutto delle
            randellate della milizia e delle imposte sfondate. La tua faccia non
            la ricorda per niente, cosa che ti offende più del ragionevole. Alla
            fine ti chiede da dove vieni, e poi ti racconta chi vende ancora il
            sidro degli Scuri in un cortile di Via del Salmone.
          effetti: { informazioni.voce: 1 }
        fallimento:
          titolo: Le facce
          testo: |
            La lavandaia si interrompe quando ti siedi e chiede se sei della
            Guardia. Le dici di no, e lei ricomincia parlando del tempo e del
            prezzo del sapone. Te ne vai prima della fine, con la sensazione di
            aver sentito un racconto preparato apposta per te.

      - testo: "Ascoltare cosa si dice di quella notte"
        descrizione: "La sera, intorno al bancone, la notte della Pignatta si racconta ancora. Quando arrivi tu, però, si smette."
        requisiti: [nomea.citta-bassa < 0]
        prova: { attributo: sociale, abilita: conoscenze-della-strada, difficolta: Facile }
        successo:
          titolo: Dietro il muro
          testo: |
            Ti fermi al buio dietro il muro del cortile e ascolti attraverso una
            crepa, con la guancia contro la pietra che sa ancora di fumo. Quando il
            racconto arriva ai ragazzi morti sotto le lanterne, qualcuno dice il tuo
            nome a voce bassa, come una parola che porta male. Poi parlano d'altro,
            e fra le altre cose di un magazzino della Gilda che nessuno sorveglia
            più.
          effetti: { informazioni.voce: 1, tormento: 1 }
        fallimento:
          titolo: Il gradino vuoto
          testo: |
            Ti avvicini mentre la storia è a metà, e chi racconta si ferma con la
            bocca ancora aperta. Uno alla volta si alzano e se ne vanno, senza
            fretta, per non dare l'impressione di scappare. Sul muro del cortile,
            a carbone, qualcuno ha scritto *assassini del governo*.
          effetti: { tormento: 1 }

      - testo: "Puntellare i muri"
        descrizione: "I muri della Pignatta stanno in piedi per abitudine, e prima di costruirci sopra vanno puntellati."
        requisiti: [nomea.citta-bassa >= 4, nomea.citta-bassa < 6]
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Media }
        successo:
          titolo: Il muro di levante
          testo: |
            Con due facchini del quartiere pianti quattro puntelli di castagno
            contro il muro di levante, quello che pende di più, e batti i cunei
            finché la pietra smette di sgranarsi. A fine giornata Orsola, la
            vecchia dell'orto, appoggia l'orecchio al muro come a una botte e dice
            che adesso sta zitto. Il facchino più anziano divide la paga con te a
            parti uguali.
          effetti: { monete: 3, nomea.citta-bassa: 0.5 }
        fallimento:
          titolo: La pioggia di calce
          testo: |
            Batti il primo cuneo troppo forte e dal muro di levante si stacca una
            pioggia di calce che ti finisce nel colletto. I facchini ti tirano
            indietro per la giubba, imprecando in due dialetti, e per oggi nessuno
            ha più voglia di toccare il muro.
          effetti: { ferite: 0.5 }

      - testo: "Cacciare i ladri di ferro"
        descrizione: "Adesso vengono di giorno con un carretto, e hanno un foglio timbrato che dice che il ferro è loro."
        requisiti: [nomea.citta-bassa >= 4, nomea.citta-bassa < 6]
        prova: { attributo: sociale, abilita: [intimidire, persuasione], difficolta: Media }
        successo:
          titolo: Il foglio timbrato
          testo: |
            Sono in tre con un carretto e un foglio con un timbro della Gilda
            sbavato proprio dove dovrebbe esserci la data. Lo leggi ad alta voce
            alla strada, scandendo come un banditore, compreso il nome della
            Pignatta scritto con due enne, e il capo dei tre se lo riprende e se ne
            va con il carretto vuoto. I vicini ti offrono qualche moneta e un
            bicchiere.
          effetti: { monete: 3, nomea.citta-bassa: 0.5 }
        fallimento:
          titolo: Mezzo carretto
          testo: |
            Il timbro della Gilda è sbavato ma quasi vero, e il capo dei tre te lo
            tiene sotto il naso finché non ti viene il dubbio. Intanto gli altri
            due caricano mezzo carretto di cerchioni. Quando se ne vanno, Tibo ti
            fa notare che il foglio parlava di un'altra strada.

      - testo: "Scegliere le travi che reggono"
        descrizione: "Il capomastro del quartiere vuole sapere quali travi bruciate reggono ancora. Sbagliare vuol dire un tetto che cade."
        requisiti: [nomea.citta-bassa >= 4, nomea.citta-bassa < 6]
        prova: { attributo: mentale, abilita: [percezione, tecnologia], difficolta: Difficile }
        successo:
          titolo: Il suono del legno
          testo: |
            Batti ogni trave con il manico della scure tenendo l'orecchio quasi
            sul legno, e quelle bruciate dentro suonano vuote anche se fuori
            sembrano nere soltanto di fuliggine, così ne segni undici col gesso.
            Il capomastro le prova con lo scalpello e trova da ridire su una sola,
            poi ti paga il giusto e ti chiede se vuoi lavorare per lui.
          effetti: { monete: 3, nomea.citta-bassa: 0.5 }
        fallimento:
          titolo: Il gesso sbagliato
          testo: |
            Segni col gesso dodici travi buone. Il capomastro ne apre una con lo
            scalpello e dentro è carbone fino al cuore, e alla seconda smette di
            controllare. Ti restituisce il gesso tenendolo per la punta, come una
            cosa che potrebbe sporcare, e il giorno dopo le travi le sceglie da
            solo.

      - testo: "Passare dal tavolo di Rozalia"
        descrizione: "Rozalia scrive lettere per chi non sa scrivere, a prezzi da Città Bassa, e intanto ascolta."
        immagine: personaggi/rozalia-marga
        requisiti: [monete >= 1]
        quando: [macerie.rozalia == 3]
        prova: { attributo: sociale, abilita: [galateo, ingannare], difficolta: Facile }
        successo:
          titolo: Il conto della settimana
          testo: |
            Rozalia ha un tavolo pieghevole accanto al bancone, con una scatola di
            latta ammaccata per le monete. Quando ti vede batte due volte la penna
            sull'orlo e ti racconta chi ha scritto a chi questa settimana, e per
            quali somme, compresa la lettera di una moglie della Gilda, parola per
            parola. «Quella, per la precisione, non te l'ho mai raccontata,
            tesoro» dice, e si rimette la piuma dietro l'orecchio.
          effetti: { informazioni.pettegolezzo: 1 }
        fallimento:
          titolo: Lo segno a parte
          testo: |
            Rozalia ha la coda al tavolo, e aspetti dietro una lavandaia che detta una
            lettera al fratello di Pannion correggendosi a ogni riga. Quando tocca a te
            ti dice soltanto di un mercante che ha cambiato fornitore di sale, e ti fa
            pagare l'inchiostro. «Lo segno a parte» dice, già sulla lettera successiva.
          effetti: { informazioni.voce: 1, monete: -1 }

      - testo: "Guardare i bambini nel cerchio di gesso"
        descrizione: "Nel cortile delle risse i bambini hanno inventato un gioco nuovo, e il cerchio di gesso gli serve ancora."
        requisiti: [nomea.citta-bassa >= 0]
        esito:
          titolo: Lo sceriffo e Vesh
          testo: |
            Nel cerchio di gesso il bambino con il fazzoletto in testa fa
            Galdrick, e quello che fa Vesh muore tre volte di fila, ogni volta con
            un rantolo più lungo. Alla quarta Vesh lo fai tu, steso nella cenere
            con un sasso sotto la scapola, e Tibo ti spiega che si muore con gli
            occhi aperti e ti corregge finché non lo fai bene.
          pe: { espressivita: 2 }

      - testo: "Guardare i bambini nel cerchio di gesso"
        descrizione: "Nel cortile delle risse i bambini giocano. Ti vedono arrivare prima che tu veda loro."
        requisiti: [nomea.citta-bassa < 0]
        esito:
          titolo: Il più piccolo
          testo: |
            Quando entri nel cortile il gioco si ferma, e i più grandi scavalcano
            il muro di fondo senza una parola. Resta il più piccolo, scalzo, in
            mezzo al cerchio di gesso con un bastone più alto di lui, e ti chiede
            se è vero che quella notte eri tu. Gli dici di sì, e lui ci pensa, poi
            esce anche lui dalla porta bruciata, camminando.
          pe: { resilienza: 2 }

      - testo: "Zappare l'orto di Orsola"
        descrizione: "La vecchia delle cipolle storte ti conosce da bambino, e a chi passa racconta di chi sei figlio."
        quando: [origine.figlio-della-citta-bassa >= 1]
        requisiti: [nomea.citta-bassa >= 0, nomea.citta-bassa < 4]
        prova: { attributo: sociale, abilita: [conoscenze-della-strada, empatia], difficolta: Media }
        successo:
          titolo: Le cipolle storte
          testo: |
            Orsola ti passa la zappa e ti corregge il colpo con due dita sul gomito,
            come quando eri bambino, raccontando a chiunque si fermi allo spago di
            chi sei figlio. Un fabbro di Via del Salmone che da quando sei tornato
            ti guardava storto si ferma a sentire e alla fine ti fa un cenno con il
            mento. La sera Orsola ti mette in tasca due cipolle storte.
          effetti: { nomea.citta-bassa: 0.5 }
        fallimento:
          titolo: Il figlio del carradore
          testo: |
            Mentre zappi, Orsola racconta ai passanti che sei figlio del carradore
            della strada accanto, quello scappato con la cassa dei carrettieri,
            perché si è confusa. Provi a correggerla e lei ti zittisce con il
            manico della zappa puntato sul petto, perché la storia è sua. Il fabbro
            che si era fermato a sentire se ne va scuotendo la testa.

  # ------------------------------------------------------------ storia a 2 · Rozalia torna
  - id: rozalia-torna
    presso: macerie-della-pignatta
    immagine: personaggi/rozalia-marga
    titolo: Rozalia torna
    sommario: "La vecchia dell'orto dice che di notte una donna con la piuma all'orecchio scava nel retrobottega."
    luogo: Le macerie della Pignatta, a notte fonda
    area: citta-bassa
    requisiti: [pista.pelle >= 6, nomea.citta-bassa >= 2, macerie.rozalia == 0]
    testo: |
      Orsola te l'ha detto abbassando la voce insieme alla zappa. Da tre notti
      una donna scava fra le macerie del retrobottega, dopo la seconda ronda.

      Aspetti seduto sul bancone di quercia. Poi una figura snella con la piuma
      d'oca dietro l'orecchio scavalca il muro di fondo e, alla luce di una
      lanterna cieca, scava con una paletta da camino dove c'erano gli scaffali
      delle cartelle, finché tira fuori dalla cenere una cassetta di ferro
      annerita.

      Quando ti alzi lei non scappa, e batte due volte la paletta sull'orlo
      della cassetta.

      «Buonasera, tesoro. Ti aspettavo qualche notte fa, per la precisione»
      dice Rozalia Marga. «Mirko è morto, e io sono una falsaria senza padrone.
      Qui dentro ci sono le firme di mezza città. Il fuoco s'è preso gli
      scaffali, la cassetta no.»

      {ingannare Media} Non ti aspettava affatto, e ha battuto la paletta per
      prendere tempo.
    opzioni:
      - testo: "Chiederle che fine hanno fatto gli altri"
        descrizione: "Quella notte, sullo spiazzo, c'erano quattro tenenti. Lei è l'unica che non hai più visto."
        costo: 0
        esito:
          titolo: Parenti rumorosi
          testo: |
            «Nestor si è seduto per terra con le mani alzate, e adesso alla
            Caserma fa le tisane ai carcerieri. Borso è in fondo alle celle, che
            conosce meglio di chiunque» dice, contando sulle dita sporche di
            cenere. «Nihali è partito per Pannion con la prima carovana.» Il
            quarto dito le resta a mezz'aria. «Di Mauro non chiedermi. Eravamo
            parenti rumorosi, e dei parenti preferisco ricordare le feste.»
          segue: rozalia-torna

      - testo: "Lasciarla andare"
        descrizione: "Mirko è morto, e la guerra è finita. Una falsaria senza padrone può cercarsi un'altra città."
        esito:
          titolo: In pari
          testo: |
            Le dici di prendere la cassetta e di andarsene prima della terza
            ronda. Rozalia ti guarda un momento più del solito, poi se la mette
            sotto il braccio. «I conti li chiudo in pari» dice, e ti sussurra il
            nome di un funzionario della Casa dei Nodi che per sei anni le ha
            comprato permessi falsi. Di ogni permesso ricorda il giorno e la
            cifra.
          pe: { conoscenze-della-strada: 5 }
          imposta: { macerie.rozalia: 1 }
          effetti: { nomea.citta-bassa: 1, informazioni.segreto: 1 }

      - testo: "Dirle di venire alla Caserma con te"
        descrizione: "Senza Mirko nessuno la protegge, e lo sa meglio di te. Galdrick ascolta chi si presenta da solo."
        prova: { attributo: sociale, abilita: [persuasione, intimidire], difficolta: Media }
        successo:
          titolo: Un appuntamento
          testo: |
            Le dici che la cercano in molti, e che Galdrick è quello che fa meno
            domande a chi si presenta da sé. Rozalia ci pensa battendo la paletta
            tre volte invece di due, poi ti cammina accanto fino alla Caserma con
            la cassetta sotto il braccio, come se andasse a un appuntamento.
            Galdrick scrive il suo nome sul taccuino, e lei gli fa notare che la
            matita è troppo corta.
          pe: { persuasione: 5 }
          imposta: { macerie.rozalia: 2 }
          effetti: { nomea.citta-bassa: 1, rep.caserma: 1 }
        fallimento:
          titolo: Il fumo grigio
          testo: |
            Al nome di Galdrick Rozalia sorride, e tu capisci tardi che sta
            guardando la tua mano, andata da sola alla cintura. La fiala si rompe
            ai tuoi piedi e il fumo grigio ti riempie la gola, e quando smetti di
            tossire il cortile è vuoto e la cassetta è sparita con lei. Nella buca
            però spunta dalla cenere l'angolo di una seconda cassetta, e Rozalia
            dovrà tornare a prenderla.
          effetti: { tormento: 1 }

      - testo: "Prenderla prima che scappi"
        descrizione: "Ha una fiala di fumo sotto la mantellina. Bisogna arrivarle al polso prima che ci arrivi lei."
        prova: { attributo: fisico, abilita: [furtivita, atletica], difficolta: Media }
        successo:
          titolo: Il polso
          testo: |
            Le giri intorno nel buio, dalla parte dei muri, dove la cenere è più
            spessa e non scricchiola. Quando la sua mano scende verso la
            mantellina tu sei già lì, e le stringi il polso con la fiala ancora
            intera fra le dita. «Per la precisione, tesoro, questo è maleducato»
            dice Rozalia, e ti lascia la fiala. Alla Caserma Galdrick scrive il
            suo nome sul taccuino senza alzare gli occhi.
          pe: { furtivita: 5 }
          imposta: { macerie.rozalia: 2 }
          effetti: { nomea.citta-bassa: 1, rep.caserma: 1 }
        fallimento:
          titolo: La seconda cassetta
          testo: |
            Le giri intorno nel buio, ma una trave ti scricchiola sotto il piede. La
            fiala si rompe contro il bancone e il fumo grigio riempie il cortile, e
            quando si dirada sei in ginocchio a tossire e Rozalia è sparita con la
            sua cassetta. Nella buca, sotto la cenere, spunta l'angolo di una
            seconda cassetta di ferro, e la ricopri con il piede per quando tornerà.
          effetti: { ferite: 0.5 }

      - testo: "Offrirle un lavoro"
        descrizione: "Una falsaria senza padrone cerca un cliente, e la Città Bassa ha bisogno di qualcuno che sappia scrivere."
        prova: { attributo: sociale, abilita: [persuasione, ingannare], difficolta: Media }
        successo:
          titolo: Come te
          testo: |
            Le dici che in Città Bassa metà della gente non sa scrivere, e che
            dopo il fuoco servono lettere e ricevute vere. Rozalia ti ascolta
            grattando la cenere dal coperchio con l'unghia. «Firmare come qualcun
            altro costa il doppio» dice alla fine, poi accetta la metà a patto di
            scegliersi il tavolo. Lo vuole accanto al bancone, e la cassetta la
            seppellisce di nuovo dove l'ha trovata.
          pe: { persuasione: 5 }
          imposta: { macerie.rozalia: 3 }
          effetti: { nomea.citta-bassa: 1 }
        fallimento:
          titolo: Quando avrai un'offerta
          testo: |
            Rozalia ti lascia arrivare in fondo, poi rimette la cassetta nella
            buca e ci spinge sopra la cenere con la scarpa. «Mi offri lavoro con
            le tasche vuote, tesoro. Le tasche io le sento da qui» dice. «Ne
            riparliamo quando avrai un'offerta.» Scavalca il muro di fondo con un
            fruscio di gonna.
          effetti: { scandalo: 0.5 }

      - testo: "Pagarle il primo mese"
        descrizione: "Una borsa pesante sul bancone, e lei scrive per te e per la Città Bassa."
        requisiti: [monete >= 30]
        esito:
          titolo: Il primo mese
          testo: |
            Conti le monete sulla quercia bruciata, e ognuna lascia un tondino
            pulito nella fuliggine. Rozalia le sposta con la punta della paletta
            senza toccarle. «Puntuale nei pagamenti, e questo mi piace» dice.
            Seppellisce di nuovo la cassetta dove l'ha trovata, e il giorno dopo
            arriva con un tavolo pieghevole e un calamaio, e prima di sera ha già
            scritto tre lettere per tre vicine.
          pe: { politica-ed-economia: 5 }
          imposta: { macerie.rozalia: 3 }
          effetti: { monete: -30, nomea.citta-bassa: 1 }

      - testo: "Parlarle come uno cresciuto sotto gli Scuri"
        descrizione: "Da ragazzino portavi i messaggi degli Scuri, e Rozalia ti scriveva le lettere per tua madre a metà prezzo."
        quando: [origine.figlio-della-citta-bassa >= 1]
        prova: { attributo: sociale, abilita: [conoscenze-della-strada, persuasione], difficolta: Media }
        successo:
          titolo: A metà prezzo
          testo: |
            Le ricordi le lettere che ti scriveva per tua madre quando eri il
            ragazzino delle consegne. «Avevi sempre le scarpe slacciate, tesoro» dice
            Rozalia. Le proponi di scrivere lettere per il quartiere, a prezzi da
            Città Bassa e sotto gli occhi di tutti, e lei si mette la cassetta sotto
            il braccio. «A metà prezzo per te, e per gli altri no» dice, battendo due
            volte la paletta.
          pe: { conoscenze-della-strada: 5 }
          imposta: { macerie.rozalia: 3 }
          effetti: { nomea.citta-bassa: 1 }
        fallimento:
          titolo: Le scarpe slacciate
          testo: |
            Le ricordi le lettere a metà prezzo, quando portavi i messaggi degli Scuri
            su e giù per Via del Salmone. Rozalia ride piano, poi ti fa notare che
            quei messaggi li portavi a Mirko, e che dalla notte dello spiazzo lei non
            sa più da che parte stai. Chiude la cassetta, scavalca il muro di fondo e
            ti lascia sul bancone la lanterna cieca ancora accesa, che illumina
            soltanto te.
          effetti: { sospetto: 0.5 }

  # ------------------------------------------------------------ storia a 2, nomea bassa · Rozalia ti cerca
  - id: rozalia-ti-cerca
    presso: macerie-della-pignatta
    immagine: personaggi/rozalia-marga
    titolo: Una falsaria al bancone
    sommario: "Nei vicoli il tuo nome lo dicono sottovoce. Una donna seduta sul bancone bruciato lo dice ad alta voce."
    luogo: Le macerie della Pignatta, al tramonto
    area: citta-bassa
    requisiti: [pista.pelle >= 6, nomea.citta-bassa < 0, macerie.rozalia == 0]
    testo: |
      Al tramonto, quando arrivi, i bambini lasciano il cerchio di gesso e la vecchia
      dell'orto rientra in casa. Sul muro annerito qualcuno ha scritto a carbone
      *assassini del governo*, e sotto c'è il tuo nome, lavato a metà.

      {origine figlio-della-citta-bassa} È la strada dove sei cresciuto, e quella
      mano può essere di qualcuno che ti ha visto nascere.

      Seduta sul bancone di quercia una donna snella con una piuma d'oca dietro
      l'orecchio si pulisce le unghie con un coltellino da ufficio, l'unica in tutta
      la strada a non essersi mossa quando sei arrivato.

      «Buonasera, tesoro. Rozalia Marga, se te ne sei dimenticato» dice, chiudendo il
      coltellino. «A me la gente che fa paura piace, perché paga in anticipo. Mirko è
      morto, e io sono una falsaria senza padrone.» Indica la scritta con il mento.
      «Una Città Bassa che ti vuole bene te la posso scrivere io.»
    opzioni:
      - testo: "Mandarla via"
        descrizione: "Mirko è morto. Una falsaria senza padrone può cercarsi un'altra città, e un altro cliente."
        esito:
          titolo: La porta bruciata
          testo: |
            Le dici di andarsene dalla Città Bassa prima che cambi idea, con la
            voce più ferma di quanto ti senta. Rozalia scende dal bancone e si
            rimette il coltellino nella manica. «Peccato, sarebbe stato il mio
            lavoro migliore» dice, e passa dalla porta bruciata invece che dal
            muro, perché la vedano uscire. La mattina dopo la scritta sul muro è
            lavata un po' di più.
          pe: { resilienza: 5 }
          imposta: { macerie.rozalia: 1 }
          effetti: { nomea.citta-bassa: 1 }

      - testo: "Portarla alla Caserma"
        descrizione: "Rozalia ha detto che la gente che fa paura le piace. Puoi vedere se le piace anche da vicino."
        prova: { attributo: sociale, abilita: [intimidire, persuasione], difficolta: Media }
        successo:
          titolo: Davanti a tutti
          testo: |
            Le dici di camminarti davanti fino alla Caserma, con la voce che in
            Città Bassa ricordano. Rozalia smette di sorridere e fa tutta la discesa
            con le mani in vista, mentre dalle finestre la strada guarda una tenente
            di Vesh portata via viva, senza un colpo. Galdrick scrive il suo nome
            sul taccuino, e quella sera nei vicoli il tuo nome lo dicono con un tono
            diverso.
          pe: { intimidire: 5 }
          imposta: { macerie.rozalia: 2 }
          effetti: { nomea.citta-bassa: 1, rep.caserma: 1 }
        fallimento:
          titolo: La sua offerta, per iscritto
          testo: |
            Rozalia ti lascia finire, cortese come una maestra con un bambino, poi
            rompe una fiala sulla quercia, e il fumo grigio ti fa lacrimare tanto
            che per un poco sembri commosso. Quando si dirada, sul bancone c'è un
            foglio piegato in due sotto un sasso, con la sua offerta in bella
            grafia e in fondo una riga, *ripasso fra qualche sera*.
          effetti: { tormento: 1 }

      - testo: "Accettare, ma alle tue condizioni"
        descrizione: "Lettere vere per chi non sa scrivere, nessuna firma falsa sul tuo conto, e lei al bancone ogni giorno."
        prova: { attributo: sociale, abilita: [persuasione, ingannare], difficolta: Media }
        successo:
          titolo: Lettere vere
          testo: |
            Le dici che vuoi lettere vere e un tavolo qui, alla luce del giorno,
            dove scriva per chi non sa farlo. Rozalia ci pensa battendo il
            coltellino chiuso sul ginocchio. «Una reputazione onesta costa più
            cara, tesoro, perché ci vuole più tempo, però è più difficile da
            smascherare» dice, e accetta senza tirare sul prezzo. Il giorno dopo
            arriva con un tavolo pieghevole e un calamaio.
          pe: { persuasione: 5 }
          imposta: { macerie.rozalia: 3 }
          effetti: { nomea.citta-bassa: 1 }
        fallimento:
          titolo: Ripasso fra qualche sera
          testo: |
            Rozalia ti ascolta come un maestro che corregge un compito, muovendo
            appena le labbra sugli errori. «Le condizioni le fa chi paga» dice, e
            scende dal bancone. Sulla quercia ti lascia un biglietto con il suo
            prezzo e in fondo una riga, *ripasso fra qualche sera*.
          effetti: { scandalo: 0.5 }

      - testo: "Pagarle il primo mese"
        descrizione: "Un mese pagato in anticipo, e lettere vere per la Città Bassa con il tuo nome fuori."
        requisiti: [monete >= 30]
        esito:
          titolo: Il tavolo pieghevole
          testo: |
            Conti le monete sul bancone e le dici cosa vuoi, lettere vere per chi non sa
            scrivere, a prezzo di strada, e il tuo nome fuori da tutto. Rozalia le conta
            due volte con la punta del coltellino. «Puntuale nei pagamenti, e questo mi
            piace» dice. Il giorno dopo mette un tavolo pieghevole accanto al bancone, e
            la prima a sedersi davanti a lei è la vecchia dell'orto.
          pe: { politica-ed-economia: 5 }
          imposta: { macerie.rozalia: 3 }
          effetti: { monete: -30, nomea.citta-bassa: 1 }

  # ------------------------------------------------------------ storia a 4 · il cantiere
  - id: il-cantiere
    presso: macerie-della-pignatta
    immagine: ambientazione/pignatta-grassa
    titolo: Il cantiere
    sommario: "Sulla porta della Pignatta c'è un avviso d'asta, e la strada aspetta di sapere da che parte stai."
    luogo: Le macerie della Pignatta, di mattina
    area: citta-bassa
    requisiti: [pista.pelle >= 6, nomea.citta-bassa >= 4, macerie.cantiere == 0]
    testo: |
      Sulla porta bruciata un avviso fissato con quattro chiodi nuovi annuncia
      che il lotto della Pignatta Grassa, che era di Mirko Vesh e adesso è del
      Comune, va all'asta fra un mese.

      Davanti all'avviso c'è Cosimo Venn, l'ispettore della Casa dei Nodi, con
      il libro dei lotti sotto il braccio e gli stivali puliti. Intorno a lui
      c'è mezza strada. Orsola si appoggia alla zappa con Tibo dietro, che
      tiene il secchio dei chiodi, e due taglialegna sono scesi dalla Segheria
      con l'ascia in spalla. Sul muro di fondo un cappuccio blu mastica
      qualcosa.

      «Il compratore della Gilda tira su una locanda in due mesi, e paga la
      giornata a chi lavora» dice Venn. «Il Comune incassa, e voi avete un
      lavoro. Non vedo il problema.»

      «Il problema è che qui ci dormono» dice Orsola, «e le cipolle sono mie.»
      Poi si girano tutti verso di te.
    opzioni:
      - testo: "Guardare il cappuccio blu sul muro"
        descrizione: "Una ragazzina con le lentiggini segue la discussione dall'alto, come a teatro."
        immagine: personaggi/gaia-acari
        costo: 0
        esito:
          titolo: Chi mi dà da mangiare
          testo: |
            La ragazzina ti vede guardarla e smette di masticare, senza imbarazzo,
            come un gatto sorpreso su una mensola. «Io sto con chi mi dà da
            mangiare» dice ad alta voce, «e finora mi ha dato da mangiare la
            vecchia.» Venn sfoglia il libro dei lotti per cercare il suo nome, e
            quando alza la testa il muro è vuoto.
          segue: il-cantiere

      - testo: "Leggere l'avviso e il libro dei lotti"
        descrizione: "Un'asta del Comune ha regole che un ispettore con gli stivali puliti non sempre ha letto tutte."
        prova: { attributo: mentale, abilita: [politica-ed-economia, accademiche], difficolta: Media }
        successo:
          titolo: Il sigillo che manca
          testo: |
            Ti fai prestare il libro dei lotti e lo leggi con Venn che ti sbuffa
            sulla spalla un fiato di menta. Per mettere all'asta un lotto
            confiscato serve il sigillo del Consiglio, e sull'avviso c'è soltanto
            quello della Casa dei Nodi. Venn arrossisce e stacca l'avviso. Finché
            il Consiglio non si riunisce il lotto resta a chi ci abita, e Orsola ti
            dà una cipolla come caparra.
          pe: { politica-ed-economia: 5 }
          imposta: { macerie.cantiere: 1 }
          effetti: { nomea.citta-bassa: 1 }
        fallimento:
          titolo: Tutto in regola
          testo: |
            La scrittura della Casa dei Nodi è piena di abbreviazioni che non
            conosci, e dopo la terza pagina ti si annebbia la vista. Venn aspetta
            con le mani dietro la schiena e poi ti spiega pagina per pagina che è
            tutto in regola, con una pazienza che fa più male di uno schiaffo. La
            strada si disperde a gruppi senza aver deciso niente.
          effetti: { scandalo: 0.5 }

      - testo: "Mettere i tuoi soldi nel cantiere del quartiere"
        descrizione: "Una borsa piena nelle mani giuste, e la strada ricostruisce da sé mentre l'ispettore aspetta."
        requisiti: [monete >= 20]
        esito:
          titolo: La caparra
          testo: |
            Conti le monete nella mano di Venn e gli dici che sono la caparra del
            quartiere, e che il resto lo pagherà la strada, una giornata di lavoro
            alla volta. Venn guarda la strada che lo guarda e scrive una ricevuta
            con la lingua all'angolo della bocca. Il pomeriggio i taglialegna
            tornano con una trave a testa, e Tibo conta i chiodi nuovi uno per
            uno.
          pe: { persuasione: 5 }
          imposta: { macerie.cantiere: 1 }
          effetti: { monete: -20, nomea.citta-bassa: 1 }

      - testo: "Far leggere l'atto a Rozalia"
        descrizione: "Rozalia conosce le carte della Pignatta meglio di chiunque. Molte, per la precisione, le ha scritte lei."
        immagine: personaggi/rozalia-marga
        quando: [macerie.rozalia == 3]
        esito:
          titolo: La vedova Brena
          testo: |
            Rozalia sfoglia il libro dei lotti con l'unghia del mignolo, così in
            fretta che Venn non osa fermarla, poi batte due volte la penna su una
            pagina. «Mirko la Pignatta l'aveva intestata a una vedova
            rispettabile» dice. «La firma, tesoro, l'ho fatta io.» Il nome
            sull'atto è quello di Orsola Brena, che si siede sul bancone e ride
            fino a tossire, mentre Venn chiude il libro senza una parola.
          pe: { accademiche: 5 }
          imposta: { macerie.cantiere: 1 }
          effetti: { nomea.citta-bassa: 1 }

      - testo: "Chiamare i taglialegna della cooperativa"
        descrizione: "La cooperativa ha il legname, e il Comune il lotto. Se si mettono d'accordo, qui nasce una mensa."
        quando: [pista.pelle >= 7]
        esito:
          titolo: Il legname e il lotto
          testo: |
            I due taglialegna ti dicono che la cooperativa il legname ce l'ha, e
            lo porterebbe gratis se il lotto restasse del Comune. Scrivi due righe
            a Julia Castaldi sul retro di una ricevuta, e la risposta arriva prima
            di sera con il sigillo del Consiglio. L'asta è sospesa, il lotto resta
            al Comune e la cooperativa del grano ci farà una mensa. Venn stacca
            l'avviso con una faccia da funerale.
          pe: { politica-ed-economia: 5 }
          imposta: { macerie.cantiere: 2 }
          effetti: { nomea.citta-bassa: 1, rep.castaldi: 0.5 }

      - testo: "Scrivere a Julia Castaldi"
        descrizione: "Il lotto è del Comune, e forse Julia preferisce un tetto per la Città Bassa a un'asta."
        quando: [pista.pelle < 7]
        esito:
          titolo: La risposta del Municipio
          testo: |
            Scrivi a Julia Castaldi su un foglio appoggiato alla porta bruciata, e
            la fuliggine ti passa sulle dita. Un ragazzo lo porta in Municipio di
            corsa, e prima di sera arriva la risposta con il sigillo del Consiglio.
            Il lotto resta del Comune, e appena le casse lo permettono ci si farà
            una mensa per la Città Bassa. Venn stacca l'avviso e se lo porta via.
          pe: { politica-ed-economia: 5 }
          imposta: { macerie.cantiere: 2 }
          effetti: { nomea.citta-bassa: 1, rep.castaldi: 0.5 }

      - testo: "Lasciare fare alla Gilda"
        descrizione: "La Gilda paga la giornata e costruisce in fretta. Venn, a bassa voce, parla anche di una provvigione."
        immagine: fazioni/gilda-dei-mercanti
        esito:
          titolo: La provvigione
          testo: |
            Dici a Venn che la strada ha bisogno di lavoro prima che di cipolle, a
            patto che il compratore assuma gente del quartiere. Venn lo scrive sul
            libro dei lotti e ti fa scivolare in mano una piccola borsa, che
            chiama provvigione. Orsola stringe la zappa e torna a zappare senza
            salutarti, e nel pomeriggio il capomastro del compratore assume dodici
            uomini della strada.
          pe: { politica-ed-economia: 5 }
          imposta: { macerie.cantiere: 3 }
          effetti: { monete: 15, nomea.citta-bassa: 1, rep.gilda: 0.5 }

  # ------------------------------------------------------------ storia a 6 · l'insegna nuova
  - id: l-insegna-nuova
    presso: macerie-della-pignatta
    immagine: ambientazione/citta-bassa
    titolo: L'insegna nuova
    sommario: "Dove c'era la Pignatta i muri hanno di nuovo un tetto, e il nome lo devi scegliere tu."
    luogo: Le macerie della Pignatta, che non sono più macerie
    area: citta-bassa
    requisiti: [pista.pelle >= 6, nomea.citta-bassa >= 6, macerie.insegna == 0, macerie.cantiere >= 1]
    testo: |
      I muri sono gli stessi, anneriti fino all'altezza del tetto vecchio, ma
      sopra adesso c'è un tetto di travi chiare e di tegole spaiate, recuperate
      un po' da tutta la Città Bassa. Il bancone di quercia è stato raschiato
      fino al legno buono, e nel cortile qualcuno ha ripassato il cerchio di
      gesso con la mano ferma.

      Sulla porta nuova manca soltanto l'insegna. Mastro Fenzi, il pittore che
      di solito fa i ritratti in Municipio, aspetta in cima a una scala con
      un'asse bianca, e da un'ora la strada gli grida nomi da sotto. Orsola ne
      vuole uno e i taglialegna un altro, mentre Tibo dal bancone propone
      soltanto nomi di cose che si mangiano.

      {acrobazia Facile} La scala poggia su una tegola spaccata. Ancora un paio
      di nomi gridati e Mastro Fenzi scoprirà quanto.

      Mastro Fenzi ti vede arrivare e appoggia il pennello sul piolo. «Hanno
      deciso che decidi tu, e io ho fame» dice. «Dimmelo prima che si secchi il
      colore.»

      *La Pignatta la chiamavano grassa perché ingrassava Mirko.* Ti scappa un
      sorriso, e non lo nascondi.
    opzioni:
      - testo: "Chiamarla *Le Cipolle Storte*"
        descrizione: "Una casa per gli orfani della razzia, con la cucina di Orsola e l'orto davanti alla porta."
        quando: [macerie.cantiere == 1]
        esito:
          titolo: Le Cipolle Storte
          testo: |
            Mastro Fenzi dipinge sull'asse tre cipolle verdi tutte piegate dalla stessa
            parte, e Orsola gli fa correggere quella di mezzo, venuta troppo dritta. La
            sera i quattro bambini che dormivano sotto il bancone dormono nella stanza
            di dietro, Tibo con il secchio dei chiodi accanto al letto. I due vecchi
            hanno una panca ciascuno vicino al fuoco, e continuano a non parlarsi.
          pe: { empatia: 5 }
          imposta: { macerie.insegna: 1 }
          effetti: { nomea.citta-bassa: 1, racconto: 1 }

      - testo: "Chiamarla *La Pignatta Magra*"
        descrizione: "La mensa del Comune, una scodella a prezzo fisso per chiunque si sieda."
        quando: [macerie.cantiere == 2]
        esito:
          titolo: La Pignatta Magra
          testo: |
            La strada resta zitta un momento, poi ride tutta insieme, i
            taglialegna più forte di tutti. Mastro Fenzi dipinge una pentola
            stretta e alta, con un manico solo. La prima sera le cuoche del Comune
            servono zuppa di farro a pochi spiccioli la scodella, e il vapore
            appanna le finestre nuove. Orsola mangia in piedi, perché seduta le
            viene sonno, e chiede il bis due volte.
          pe: { espressivita: 5 }
          imposta: { macerie.insegna: 1 }
          effetti: { nomea.citta-bassa: 1, racconto: 1 }

      - testo: "Chiamarla *Il Cerchio di Gesso*"
        descrizione: "La locanda di quartiere della Gilda, con il cortile delle risse tenuto com'era."
        quando: [macerie.cantiere == 3]
        esito:
          titolo: Il Cerchio di Gesso
          testo: |
            Il capomastro della Gilda voleva un nome con dentro la parola
            *mercanti*, e la strada gli ha gridato contro finché non si è tolto il
            cappello per farsi aria. Il cerchio di gesso invece piace a tutti, e
            Mastro Fenzi lo dipinge bianco su fondo nero. Orsola beve il primo
            bicchiere e lo trova annacquato, come ai vecchi tempi.
          pe: { galateo: 5 }
          imposta: { macerie.insegna: 1 }
          effetti: { nomea.citta-bassa: 1, racconto: 1 }

      - testo: "Lasciare le lettere a Rozalia"
        descrizione: "Le lettere le dipinge Rozalia, più brava del pittore, e il nome lo sceglie lei."
        immagine: personaggi/rozalia-marga
        quando: [macerie.rozalia == 3]
        esito:
          titolo: Conti in Pari
          testo: |
            Rozalia sale sulla scala al posto di Fenzi, che glielo lascia fare con
            sollievo, e scrive *Conti in Pari* in una grafia così bella che la
            strada smette di gridare. Quando scende piega lo straccio del pennello
            in quattro, come una lettera da spedire. «Questo era il conto più
            lungo, tesoro. L'ho chiuso in pari anche lui» dice, e Fenzi la sera le
            offre da bere.
          pe: { espressivita: 5 }
          imposta: { macerie.insegna: 1 }
          effetti: { nomea.citta-bassa: 1, racconto: 1 }

      - testo: "Lasciare che lo scelga Tibo"
        descrizione: "Il secchio dei chiodi l'ha riempito lui, uno alla volta. Forse il nome spetta a chi ha cominciato."
        esito:
          titolo: Il Chiodo
          testo: |
            Tibo ci pensa con la serietà di un consigliere, grattandosi una crosta
            sul ginocchio, e poi dice *Il Chiodo*, perché senza i chiodi il tetto
            non stava su. Orsola gli dà ragione, e Fenzi dipinge un chiodo grosso
            come un remo, un po' piegato in punta. La sera stessa Tibo inchioda
            sotto l'insegna l'ultimo chiodo del suo secchio, e da allora chiunque
            entri lo tocca per fortuna.
          pe: { empatia: 5 }
          imposta: { macerie.insegna: 1 }
          effetti: { nomea.citta-bassa: 1, racconto: 1 }

  # ------------------------------------------------------------ la carta
  - id: carta-la-cenere-della-pignatta
    immagine: personaggi/gaia-acari
    titolo: Un cappuccio blu fra la cenere
    sommario: "Una ragazzina con il cappuccio blu ti si mette al passo e dice che alla Pignatta qualcuno ha fame."
    luogo: Città Bassa, verso sera
    tipo: carta
    area: citta-bassa
    requisiti: [pista.pelle >= 6, macerie.cantiere == 0]
    testo: |
      In Via del Salmone un cappuccio blu ti si mette al passo. Sotto ci sono un
      naso pieno di lentiggini e una radice di liquirizia fra i denti.

      «Alla Pignatta la Guardia passa due volte per notte, e in mezzo sotto il
      bancone ci dormono in sei» dice la ragazzina. «Quattro sono piccoli. Tu hai
      la faccia di uno che il pane se lo può permettere, e io di una che non te
      lo chiede due volte.»

      {origine fuggiasco-di-ghoran} La mano ti va da sola alla tasca, dove da
      Ghoran tieni sempre un pezzo di pane per dopo.
    opzioni:
      - testo: "Seguirla alle macerie con il pane"
        descrizione: "Una pagnotta al forno dell'angolo, e la strada fino al bancone di quercia."
        requisiti: [monete >= 1]
        esito:
          titolo: Sei pezzi uguali
          testo: |
            Compri una pagnotta al forno dell'angolo e Gaia ti porta fino al bancone
            bruciato, dove un bambino scalzo con un secchio di chiodi la saluta per
            nome. Dividete il pane in sei pezzi, e lei li soppesa uno per mano come
            un mercante di spezie per controllare che siano uguali. Per sé non tiene
            nemmeno una briciola, e se ne va senza salutare.
          pe: { empatia: 2 }
          effetti: { monete: -1, nomea.citta-bassa: 0.5 }
      - testo: "Darle uno spicciolo per il pane"
        descrizione: "Il pane lo può comprare anche lei. Tu hai da fare."
        requisiti: [monete >= 1]
        esito:
          titolo: Uno spicciolo
          testo: |
            Gaia morde lo spicciolo con il dente davanti, se lo mette in tasca e in
            cambio ti racconta, già voltata, che al forno dell'angolo il pane di
            ieri lo vendono per pane di oggi, e chi lo compra a chi lo rivende.
          effetti: { monete: -1, informazioni.voce: 1 }
      - testo: "Lasciarla parlare da sola"
        descrizione: "Una ragazzina della Città Bassa che chiede soldi per il pane. Ne hai sentite tante, di storie così."
        costo: 0
        esito:
          titolo: Una parolaccia
          testo: |
            Allunghi il passo e lei non ti segue. Alle tue spalle ti dice una
            parolaccia che fa voltare una donna con un cesto di panni, e poi
            un'altra più lunga che non conoscevi e che ti ritrovi a ripetere
            sottovoce. Quando ti giri il cappuccio blu è già sparito.
