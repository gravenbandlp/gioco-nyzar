# La città viva, luogo 2: la Cattedrale del Velo (presso: cattedrale-del-velo, area quartieri-alti).
# L'attività delle ore, le tre storie della Confraternita (2 i Giardini della Linfa, 4 gli archivi minori,
# 6 il voto, ognuna con il suo flag) e la carta della processione. Il servizio (purificazione, navata
# silenziosa, la Liturgia dell'Albero alla scuola dei novizi) sta già in contenuti/aree/quartieri-alti.yaml.
# Reputazione: è quella della Confraternita (rep.velo). I Giardini e le ore la fanno salire fino a 4, l'alba
# con Ottilia e la linfa di notte fino a 6; le storie la portano a 3, a 5 (4,5 se Ottilia ti scopre a copiare)
# e a 7. Aurenne è sveglia e vive in Cattedrale da pista.capomozzo >= 9 (si risveglia nel passo 8 → 9).
storylet:
  # ------------------------------------------------------------ l'attività ripetibile
  - id: le-ore-del-velo
    presso: cattedrale-del-velo
    immagine: ambientazione/cattedrale-del-velo
    titolo: Le ore del Velo
    sommario: "In Cattedrale il lavoro non manca mai, e ogni mattina Ottilia Sanvel lo scrive su una tavoletta accanto alla sagrestia."
    luogo: Cattedrale del Velo, la navata e il chiostro
    area: quartieri-alti
    ripetibile: true
    testo: |
      In Cattedrale le giornate le misura il cristallo rosso sull'altare. A
      ogni ora canonica pulsa più forte, e un momento dopo arriva il rintocco
      dal campanile, dove il campanaro guarda l'altare da una feritoia prima
      di tirare la corda. Fra un'ora e l'altra la navata si riempie di gente
      che lavora a bassa voce, accoliti che cambiano le candele e novizi che
      attraversano il chiostro con le braccia cariche di bende. Due guardie
      del Velo fanno il giro delle colonne sempre in coppia, e a forza di giri
      hanno preso lo stesso passo, come due muli attaccati allo stesso carro.

      Accanto alla porta della sagrestia è appesa una tavoletta di cera, e
      ogni mattina Ottilia Sanvel ci scrive i lavori del giorno uno sotto
      l'altro, con la sua grafia piccola e diritta. Chi dà una mano passa la
      sera da Sorella Arva, la tesoriera, che conta la paga dei laici una
      moneta alla volta e a ognuno, per carità, propone un prestito a un
      quinto d'interesse.

      Sotto l'ultima riga, quella delle candele, qualcuno ha disegnato un
      piccolo liuto, e qualcun altro l'ha raschiato via a metà con l'unghia.
      *Prima Celia, poi Ottilia.* Ti viene da sorridere, e lo nascondi in
      fretta quando una delle due guardie si volta dalla tua parte.
    opzioni:
      - testo: "Lavorare nei Giardini della Linfa"
        descrizione: "Sorella Giulia ha sempre bisogno di mani che sappiano distinguere una foglia sana da una malata, e che non abbiano fretta."
        immagine: personaggi/sorella-giulia
        requisiti: [rep.velo < 4, pista.capomozzo < 9]
        prova: { attributo: mentale, abilita: [natura, medicina], difficolta: Media }
        successo:
          titolo: Le foglie buone
          testo: |
            Passi il pomeriggio in ginocchio fra le aiuole a togliere le
            foglie arrugginite, e alla fine hai i polpastrelli tinti di una
            luce verdina che non va via. Sorella Giulia controlla il lavoro
            camminando piano, con un passero appollaiato sul pollice, e ti
            dice che oggi le piante respirano meglio. La sera Sorella Arva ti
            conta qualche moneta sul palmo e ti chiede se per caso te ne servono
            altre in prestito.
          effetti: { monete: 2, rep.velo: 0.5 }
        fallimento:
          titolo: La ruggine di sotto
          testo: |
            Togli le foglie arrugginite con impegno, e insieme a loro anche
            una manciata di germogli nuovi che alla luce del giorno sembravano
            malati. Sorella Giulia li raccoglie dal cesto uno per uno e li
            ripianta senza una parola di rimprovero, il che è peggio. Ti
            spiega che la ruggine comincia sotto la foglia, e ti manda a casa
            con un germoglio in un vaso, per esercitarti.

      - testo: "Lavorare nei Giardini della Linfa"
        descrizione: "Al tramonto, fra le aiuole, Giulia non è più sola. Aurenne annaffia le piante con la mano buona e tiene l'artiglio dietro la schiena."
        immagine: personaggi/aurenne
        requisiti: [rep.velo < 4, pista.capomozzo >= 9]
        prova: { attributo: mentale, abilita: [natura, medicina], difficolta: Media }
        successo:
          titolo: I passeri
          testo: |
            Lavori fra le aiuole fino al tramonto, e quando la luce cala
            arriva Aurenne con l'annaffiatoio. Lo regge con la mano buona e
            tiene l'artiglio dietro la schiena, e i passeri, che di solito si
            posano dappertutto, intorno a lei lasciano un cerchio vuoto.
            Sorella Giulia dice che si abitueranno, e intanto approva quasi
            tutte le tue foglie. Aurenne non ti parla. A fine giro però ti
            indica con il mento una foglia arrugginita che ti era sfuggita.
            Sorella Arva, all'uscita, ti conta la paga.
          effetti: { monete: 2, rep.velo: 0.5 }
        fallimento:
          titolo: La foglia rovesciata
          testo: |
            Strappi le foglie arrugginite insieme a qualche germoglio sano, e
            Sorella Giulia si china a ripiantarli. Aurenne, che annaffia
            l'aiuola accanto, si ferma a guardarti le mani. Poi posa
            l'annaffiatoio e ti mostra con la mano buona come si gira una
            foglia per guardarla di sotto, senza una parola. Quando te ne vai
            i passeri stanno ancora tutti dalla parte di Giulia.

      - testo: "Servire alle ore canoniche"
        descrizione: "Reggere il turibolo e rispondere ai salmi al momento giusto, davanti a Padre Vantes, che non perde un gesto."
        immagine: personaggi/padre-vantes
        requisiti: [rep.velo < 4, pista.capomozzo < 9]
        prova: { attributo: sociale, abilita: [galateo, resilienza], difficolta: Media }
        successo:
          titolo: Il turibolo
          testo: |
            Reggi il turibolo per tutta l'ora di terza, un passo dietro Padre
            Vantes, e rispondi ai salmi un attimo dopo i novizi, che li sanno
            a memoria. Quando il cristallo pulsa ti inginocchi insieme agli
            altri senza che nessuno debba tirarti la manica. Alla fine Vantes
            ti posa due dita sul polso, come fa con tutti, e ti dice che
            domani c'è la sesta, se ti va. Sorella Arva ti conta uno spicciolo
            sul palmo.
          effetti: { monete: 1, rep.velo: 0.5 }
        fallimento:
          titolo: Il fumo negli occhi
          testo: |
            Il turibolo pesa più di quanto pensavi, e a metà dell'ora il fumo
            ti sale dritto negli occhi. Rispondi a un salmo con le parole di
            quello prima, e due novizi si mordono le labbra per non ridere.
            Quando il cristallo pulsa ti inginocchi in ritardo, ultimo di
            tutta la navata. Alla fine Padre Vantes ti posa lo stesso due dita
            sul polso e ti dice che la terza, la prima volta, la sbagliano
            tutti.

      - testo: "Servire alle ore canoniche"
        descrizione: "All'ora di compieta Aurenne è sempre in ginocchio sull'ultima panca, lontana dagli altri. I salmi li sa meglio dei novizi."
        immagine: personaggi/aurenne
        requisiti: [rep.velo < 4, pista.capomozzo >= 9]
        prova: { attributo: sociale, abilita: [galateo, resilienza], difficolta: Media }
        successo:
          titolo: Le risposte vecchie
          testo: |
            Servi la compieta con il turibolo in mano, dietro Padre Vantes.
            Dall'ultima panca Aurenne risponde ai salmi a voce bassa, e dopo
            un po' ti accorgi che certe risposte le dice con parole più
            antiche. Sono quelle del vecchio Santuario, che nella Cattedrale
            nuova sono state cambiate. Se ne accorge anche Vantes, e non la
            corregge. Quando il cristallo pulsa vi inginocchiate tutti nello
            stesso momento, lei compresa. All'uscita Sorella Arva ti conta uno
            spicciolo.
          effetti: { monete: 1, rep.velo: 0.5 }
        fallimento:
          titolo: Fuori tempo
          testo: |
            Reggi il turibolo dietro Padre Vantes, ma dall'ultima panca
            Aurenne risponde ai salmi con le parole del vecchio Santuario, e
            tu vai dietro a lei invece che ai novizi. A metà dell'ora ti
            ritrovi a dire da solo, in mezzo alla navata, una risposta che
            nessuno usa più. Aurenne alza la testa e ti guarda. Poi abbassa
            gli occhi e risponde con le parole nuove, piano, perché tu possa
            seguirla.

      - testo: "Copiare per gli archivi minori"
        descrizione: "Ottilia Sanvel tiene gli archivi minori dietro il chiostro. Dei registri vecchi servono copie pulite, e chi ha una bella grafia viene pagato a pagina."
        immagine: personaggi/ottilia-sanvel
        prova: { attributo: mentale, abilita: accademiche, difficolta: Facile }
        successo:
          titolo: Trenta pagine
          testo: |
            Ottilia ti fa sedere a un tavolo del chiostro con un registro di
            battesimi del centotrenta e un quaderno nuovo, e ti lascia
            lavorare fino a sera. Ricopi nomi e date con la grafia più chiara
            che hai. Quando torna la sfoglia in piedi dall'ultima pagina alla
            prima e trova una sola svista, che ti indica con l'unghia. Sorella
            Arva ti paga a pagine copiate, e arrotonda per
            difetto.
          effetti: { monete: 3 }
        fallimento:
          titolo: La riga saltata
          testo: |
            Ricopi un registro di battesimi fino a sera, e a metà pomeriggio
            salti una riga senza accorgertene, così da lì in poi ogni nome
            finisce accanto alla data del bambino dopo. Ottilia se ne accorge
            alla prima occhiata e ti mostra dove hai sbagliato, senza alzare
            la voce. La copia la rifarà un novizio, e Sorella Arva ti conta
            appena il prezzo della carta.
          effetti: { monete: 1 }

      - testo: "Assistere i ricoverati"
        descrizione: "Nell'infermeria della navata nord le brande non bastano mai. Nadja Oresca cerca qualcuno che cambi le bende e ascolti chi ha voglia di parlare."
        immagine: personaggi/nadja-oresca
        prova: { attributo: mentale, abilita: [medicina, empatia], difficolta: Media }
        successo:
          titolo: L'infuso all'aceto
          testo: |
            Passi la mattina fra le brande con Nadja Oresca, che ha le vesti
            spiegazzate e un proverbio in lingua antica per ogni ferita. Cambi
            le bende a un muratore caduto da un'impalcatura, poi tieni la mano
            a una vecchia che non vuole bere l'infuso perché sa di aceto. Alla
            fine lo beve, a patto che lo assaggi prima tu. Nadja ti ringrazia
            con un proverbio che nessuno dei due capisce, e Sorella Arva ti
            conta qualche moneta.
          effetti: { monete: 2 }
        fallimento:
          titolo: Il dialetto dei Ponti
          testo: |
            Cambi le bende a un muratore caduto da un'impalcatura e stringi
            troppo, e lui ti dice quello che pensa di te in un dialetto dei
            Ponti che non conoscevi. Nadja Oresca rifà la fasciatura in un
            attimo, girandosi l'anello di rame intorno al dito, e ti manda a
            vuotare i catini per il resto della mattina. Quando ripassi
            davanti alla sua branda il muratore ti saluta con la mano buona.

      - testo: "Accendere le candele della navata"
        descrizione: "Ogni sera le candele della navata si accendono una per una, dall'ingresso fino all'altare. Lo fa chi capita, e stasera capiti tu."
        esito:
          titolo: Le candele di sinistra
          testo: |
            Accendi le candele con un lungo stoppino partendo dall'ingresso, e
            a ogni fila la navata si scalda un poco. Sorella Celia accorda il
            liuto su una panca laterale per la funzione della sera e ogni
            tanto ti corregge, perché le candele di sinistra vanno accese
            prima di quelle di destra, per una ragione che nemmeno lei
            ricorda. Quando arrivi all'altare il cristallo pulsa, e la fiamma
            più vicina si piega appena nella sua direzione.
          pe: { resilienza: 2 }

      - testo: "Esercitarti all'alba con i novizi"
        descrizione: "All'alba Ottilia fa esercitare i novizi nel corridoio sotto il chiostro. A chi il Velo conosce bene chiede di mettersi in testa alla fila e di non sbagliare."
        immagine: personaggi/ottilia-sanvel
        requisiti: [rep.velo >= 4, rep.velo < 6]
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Media }
        successo:
          titolo: In testa alla fila
          testo: |
            Ti metti in testa alla fila, dove ti vedono tutti, e segui la
            sequenza di Ottilia dal primo movimento all'ultimo. Il respiro va
            con le braccia come dice lei, e alle tue spalle sedici novizi
            tengono il tempo con te. Alla fine Ottilia prende un bastone dalla
            rastrelliera e ti fa ripetere contro di lei l'ultimo movimento,
            ogni volta più svelto. Lo pari due volte, e lei dice che può
            bastare, parole che in bocca sua valgono un elogio. Sorella Arva
            ti conta il dovuto.
          effetti: { monete: 3, rep.velo: 0.5 }
        fallimento:
          titolo: Il bastone
          testo: |
            Ti metti in testa alla fila e parti bene, ma al decimo movimento
            perdi il respiro, e con te lo perdono i sedici novizi che ti
            guardano la schiena. Ottilia ferma tutti con una parola. Prende un
            bastone dalla rastrelliera e ti fa ripetere il movimento contro di
            lei, finché alla terza volta ti ritrovi seduto sulla pietra. Ti
            tende la mano per rialzarti e ti rimanda in fondo alla fila.
          effetti: { ferite: 0.5 }

      - testo: "Raccogliere la linfa di notte"
        descrizione: "La linfa per gli unguenti si raccoglie di notte, quando le piante sono più accese. Giulia la affida soltanto a mani che conosce."
        immagine: personaggi/sorella-giulia
        requisiti: [rep.velo >= 4, rep.velo < 6]
        prova: { attributo: mentale, abilita: [natura, medicina], difficolta: Difficile }
        successo:
          titolo: Dodici fiale
          testo: |
            Giri fra le aiuole con una lanterna schermata e una cassetta di
            fiale, e incidi i fusti come ti ha mostrato Giulia, con un taglio
            sottile in diagonale che si richiude prima dell'alba. La linfa
            scende a gocce e nella fiala continua a brillare. All'alba ne hai
            riempite dodici senza sprecarne una. Giulia le alza controluce a
            una a una e le porta all'infermeria, e Sorella Arva ti conta
            la paga della notte.
          effetti: { monete: 5, rep.velo: 0.5 }
        fallimento:
          titolo: Il taglio storto
          testo: |
            Incidi i fusti al buio, con la lanterna schermata, e su una pianta
            giovane il taglio ti viene troppo profondo. La linfa esce tutta
            insieme e ti cola accesa sulle dita, mentre la pianta si spegne
            foglia dopo foglia fino alla radice. Giulia la guarda a lungo
            prima di decidere che forse si riprende. Per il resto della notte
            le fiale le riempie lei, e tu reggi la lanterna.

      - testo: "Scendere nella Cripta con i novizi"
        descrizione: "Da laico consacrato puoi sederti in fondo alla Cripta mentre i novizi recitano la Preghiera del Battito."
        immagine: personaggi/madre-del-velo
        requisiti: [cattedrale.voto >= 1]
        prova: { attributo: mentale, abilita: resilienza, difficolta: Media }
        successo:
          titolo: La Preghiera del Battito
          testo: |
            Ti siedi sull'ultimo gradino della Cripta mentre i novizi recitano
            a mezza voce, tutti insieme. «Finché il cuore del mondo batterà,
            anche noi ricorderemo.» Dopo un po' ti accorgi che le parole le
            dici anche tu, e che le voci che ti porti dietro dalle profondità
            sono rimaste in cima alla scala, ad aspettarti. Quando risali la
            navata è piena di luce, e la testa ti sembra più leggera di come
            l'avevi portata giù.
          effetti: { tormento: -0.5 }
        fallimento:
          titolo: La seconda voce
          testo: |
            Ti siedi sull'ultimo gradino della Cripta mentre i novizi recitano
            la Preghiera del Battito. A metà della seconda strofa senti una
            voce che dice le stesse parole con un attimo di ritardo, più bassa
            delle altre, e non riesci a capire se arriva dal fondo della sala
            o da dentro la tua testa. Resti fino alla fine con le mani strette
            sulle ginocchia, e quando i novizi si alzano risali per primo.

  # ------------------------------------------------------------ storia a 2 · i Giardini della Linfa
  - id: i-giardini-della-linfa
    presso: cattedrale-del-velo
    immagine: personaggi/sorella-giulia
    titolo: I Giardini della Linfa
    sommario: "Nei Giardini la pianta più vecchia si sta spegnendo, e Sorella Giulia ha trovato sui fusti dei tagli che non ha fatto lei."
    luogo: Cattedrale del Velo, i Giardini della Linfa
    area: quartieri-alti
    requisiti: [rep.velo >= 2, cattedrale.giardini == 0]
    testo: |
      Sorella Giulia ti aspetta in fondo ai Giardini, davanti al cespuglio più
      vecchio, quello con le foglie larghe come mani che la sera si accendono
      per prime. Stamattina è spento per metà. Le foglie basse sono ancora
      verdi e tiepide, mentre quelle in cima sono diventate grigie e molli, e
      i passeri che ci dormivano dentro si sono spostati sulla siepe.

      «È una talea del vecchio Santuario» dice Giulia. «La notte dell'incendio
      Padre Vantes l'ha portata fuori in una tasca della tonaca. Adesso guarda
      qui.» Scosta una foglia con due dita. Alla base dei fusti ci sono tagli
      sottili e diagonali, fatti con una lama piccola e con una certa cura, e
      da ognuno è uscita la linfa. Chi li fa sa come si incide una pianta, e
      ogni notte ne prende un poco dalla stessa, che a lungo andare si spegne.

      A Ottilia, Giulia non lo vuole dire. «Ottilia trova sempre il colpevole»
      dice, «e dopo non resta più niente da sistemare.» Apre la mano verso la
      siepe, e un passero ci salta sopra e si lascia portare all'altezza del
      suo viso.

      *Un ladro di linfa che ne ruba un dito per notte.* Hai già le dita sui
      tagli, a misurarne la larghezza.
    opzioni:
      - testo: "Esaminare i tagli e la linfa"
        descrizione: "Una lama piccola, un taglio pulito. Dalle ferite di una pianta si capisce chi l'ha incisa, e per farne che cosa."
        prova: { attributo: mentale, abilita: [natura, medicina], difficolta: Media }
        successo:
          titolo: Un dito per notte
          testo: |
            Conti i tagli e li confronti. Sono ventidue, tutti della stessa
            larghezza, e accanto a ognuno la corteccia porta il segno di una
            fiala piccola appoggiata per raccogliere. Chi vende la linfa agli
            speziali la prende a mezzi barattoli, e dalle piante giovani, che
            ne danno di più. Questo ne prende un dito a notte, sempre dalla
            pianta più vecchia, che è anche la più vicina al dormitorio dei
            novizi. Giulia segue il tuo ragionamento fino in fondo, poi si
            gira a guardare la finestra del dormitorio.
          pe: { natura: 5 }
          segue: il-ladro-di-linfa
        fallimento:
          titolo: Gli speziali
          testo: |
            Ti convinci che dietro ci sia qualcuno che vende la linfa agli
            speziali del Mercato dei Nodi, e lo spieghi a Giulia con molta
            sicurezza. Lei ti ascolta fino in fondo, poi ti fa notare che un
            ladro di linfa porterebbe via mezzo barattolo alla volta, mentre
            alla pianta vecchia ne manca sì e no un dito. Ti ringrazia lo
            stesso, e torna alla sua siepe a parlare con i passeri.

      - testo: "Seguire le gocce di luce"
        descrizione: "La linfa brilla anche quando cade. Chi la porta via di notte lascia una traccia, se si sa dove guardare."
        prova: { attributo: mentale, abilita: percezione, difficolta: Media }
        successo:
          titolo: Le gocce
          testo: |
            Aspetti la mattina presto, quando le piante dormono, e cammini
            piano per i vialetti, chino. Fra le pietre del sentiero ci sono
            gocce di linfa secca, piccole come capocchie di spillo, che
            all'ombra mandano ancora un filo di luce. Partono dal cespuglio
            vecchio e attraversano il chiostro fino alla porta del dormitorio
            dei novizi, dove sotto lo stipite qualcuno ha provato a
            strofinarle via con la suola. Giulia ti raggiunge e guarda la
            porta senza dire niente.
          pe: { percezione: 5 }
          segue: il-ladro-di-linfa
        fallimento:
          titolo: Le foglie cadute
          testo: |
            Aspetti il crepuscolo e cerchi una traccia fra le pietre dei
            vialetti, ma a quell'ora i Giardini si accendono tutti insieme, e
            ogni foglia caduta brilla come la goccia che cercavi. Dopo un'ora
            ti fanno male gli occhi. Giulia ti porta una tazza d'infuso e ti
            consiglia di riprovare la mattina presto, quando le piante dormono
            e la linfa caduta si vede meglio.

      - testo: "Passare la notte dietro la siepe"
        descrizione: "Per stare svegli dietro una siepe non serve nessun talento. Serve una notte intera, e un mantello pesante."
        costo: 2
        esito:
          titolo: La notte dei passeri
          testo: |
            Ti siedi dietro la siepe dei passeri con il mantello sulle spalle
            e aspetti. Verso la terza ora il freddo ti entra nelle ginocchia,
            e Giulia ti porta di nascosto una coperta e una mela. Poco prima
            del mattutino la porta del dormitorio si apre di uno spiraglio, e
            una sagoma piccola attraversa il chiostro in punta di piedi con
            una fiala in mano. Si inginocchia davanti al cespuglio vecchio e
            incide il fusto con un temperino, piano, come se avesse paura di
            fargli male.
          pe: { resilienza: 5 }
          segue: il-ladro-di-linfa

  - id: il-ladro-di-linfa
    immagine: personaggi/sorella-giulia
    titolo: Il ladro di linfa
    tipo: seguito
    luogo: Cattedrale del Velo, il chiostro dei novizi
    area: quartieri-alti
    requisiti: [cattedrale.giardini == 0]
    testo: |
      Il ladro si chiama Lino. Ha quattordici anni e un velo corto da primo
      anno che gli scivola sempre su un orecchio. Giulia lo accompagna fuori
      dal dormitorio tenendogli una mano sulla spalla senza stringere, e lui
      non prova nemmeno a scappare. Quando gli chiedi della linfa infila una
      mano sotto la tunica e tira fuori una fiala tappata con la cera, piena
      per metà, che nel chiostro ancora buio manda una luce verdina e
      tranquilla.

      «Io non la bevo e non la vendo» dice, guardandosi i piedi. «La tengo
      sotto la coperta, la notte. Dalla razzia al buio non riesco più a
      dormire, e Ottilia nel dormitorio non vuole lumi, dice che i novizi
      devono imparare a stare con il buio.» Si asciuga il naso con la manica.
      «Gli altri dormono. Io sento ancora i corni degli orchi, e con la luce
      verde un po' meno.»

      Giulia ti guarda sopra la testa del ragazzo. In fondo ai Giardini il
      cespuglio vecchio è acceso soltanto a metà. *Ventidue notti di corni, e
      una pianta che si spegne per farle passare.* Senza averlo deciso ti sei
      accucciato all'altezza di Lino.
    opzioni:
      - testo: "Chiedere a Giulia una pianta per lui"
        descrizione: "Una talea in un vaso fa la stessa luce di una fiala, e per averla non bisogna tagliare niente ogni notte."
        immagine: personaggi/sorella-giulia
        esito:
          titolo: Il vaso sul davanzale
          testo: |
            Giulia ci pensa il tempo di accarezzare un passero, poi va a
            prendere un vaso di coccio e un coltellino. Taglia una talea dal
            cespuglio vecchio, dalla parte ancora accesa, e la pianta nel vaso
            davanti a Lino, spiegandogli come si annaffia e quanto. «Così la
            luce te la fai da solo, e il cespuglio respira» dice. Lino tiene
            il vaso con tutte e due le mani. Il giorno dopo sul davanzale del
            dormitorio c'è una piantina che di notte brilla appena, e Ottilia
            ci passa davanti senza fermarsi.
          pe: { natura: 5 }
          imposta: { cattedrale.giardini: 1 }
          effetti: { rep.velo: 1 }

      - testo: "Parlare con Ottilia della regola dei lumi"
        descrizione: "Una regola si cambia soltanto con chi l'ha scritta. Ottilia ascolta tutti, e cambia idea di rado."
        immagine: personaggi/ottilia-sanvel
        prova: { attributo: sociale, abilita: [persuasione, empatia], difficolta: Media }
        successo:
          titolo: Lume del dormitorio
          testo: |
            Trovi Ottilia nel corridoio dopo l'esercizio dell'alba e le
            racconti dei corni e della fiala, senza fare il nome di Lino. Lei
            ascolta con le mani infilate nelle maniche. Quando hai finito ti
            chiede se sai quanti novizi sono arrivati dopo la razzia, e dalla
            tua faccia capisce la risposta. «Undici» dice. Il giorno dopo in
            fondo al dormitorio è appesa una lanterna schermata accesa al
            minimo, e sulla tavoletta dei lavori c'è una riga nuova con la sua
            grafia, *lume del dormitorio, a turno*.
          pe: { persuasione: 5 }
          imposta: { cattedrale.giardini: 1 }
          effetti: { rep.velo: 1 }
        fallimento:
          titolo: Il buio si impara
          testo: |
            Trovi Ottilia nel corridoio dopo l'esercizio dell'alba e le chiedi
            di permettere un lume nel dormitorio. Lei ti chiede perché, e tu,
            per non fare il nome di Lino, ti ingarbugli in una storia di
            candele e di ladri che non sta in piedi. Ottilia ti ascolta fino
            in fondo. «Il buio si impara come il resto» dice, e torna dai
            novizi. La sera Giulia mette in mano a Lino una talea in un vaso,
            di nascosto, perché almeno il cespuglio smetta di spegnersi.
          imposta: { cattedrale.giardini: 1 }
          effetti: { rep.velo: 0.5 }

      - testo: "Portare Lino da Ottilia"
        descrizione: "Un furto è un furto, anche di linfa. La disciplina dei novizi spetta a Ottilia, e Lino lo sa."
        immagine: personaggi/ottilia-sanvel
        esito:
          titolo: La disciplina
          testo: |
            Accompagni Lino da Ottilia, nel corridoio, con la fiala in mano.
            Lei lo ascolta senza interromperlo, poi prende la fiala e la vuota
            nel catino delle abluzioni, dove la luce si spegne in un attimo.
            Per un mese Lino spazzerà il chiostro prima dell'alba. Ottilia ti
            ringrazia con un cenno breve, e la sera dopo sulla tavoletta dei
            lavori il tuo nome compare in cima. Quando ti incrocia nei
            Giardini, Giulia ti saluta con un passero sulla mano e non ti
            chiede di Lino.
          pe: { galateo: 5 }
          imposta: { cattedrale.giardini: 1 }
          effetti: { rep.velo: 1 }

  # ------------------------------------------------------------ storia a 4 · gli archivi minori
  - id: gli-archivi-minori
    presso: cattedrale-del-velo
    immagine: personaggi/ottilia-sanvel
    titolo: Gli archivi minori
    sommario: "Ottilia Sanvel ha bisogno di qualcuno che ricopi le pagine salvate dal vecchio Santuario, prima che si sbriciolino."
    luogo: Cattedrale del Velo, gli archivi minori dietro il chiostro
    area: quartieri-alti
    requisiti: [rep.velo >= 4, cattedrale.archivio == 0]
    testo: |
      Gli archivi minori stanno dietro il chiostro, in tre stanze basse che
      erano le cantine del vecchio Santuario e che l'incendio ha risparmiato.
      Gli scaffali arrivano al soffitto, e ogni scatola ha un cartellino
      scritto con la grafia piccola e diritta di Ottilia Sanvel. Sul tavolo
      sotto la finestra c'è una cassetta di latta annerita, e quando Ottilia
      ne solleva il coperchio senti l'odore del fumo, vecchio di cinque anni e
      ancora intatto.

      Dentro ci sono i registri del Santuario che si sono salvati a metà, con
      i bordi bruciati e le pagine che si sfaldano se le tocchi senza
      attenzione. «La Madre ne vuole una copia pulita per la Cripta» dice
      Ottilia. «Le copie le fai qui. Gli originali non escono, e quello che
      leggi resta in questa stanza.» Ti porge un paio di guanti di cotone e
      una pinzetta d'osso per voltare i fogli. «Si comincia dall'ultimo
      registro, che è quello che si sbriciola prima.»

      Ti siedi e tiri verso di te la cassetta. L'odore del fumo ti riporta a
      un altro fuoco, quello della piazza la sera della razzia, e le mani ti
      restano ferme sui guanti più a lungo del necessario. *Cinque anni in una
      scatola di latta, e l'odore non se n'è andato.* Ottilia aspetta in
      piedi, con le braccia incrociate nelle maniche.
    opzioni:
      - testo: "Ricopiare le pagine"
        descrizione: "Una riga alla volta, con la pinzetta d'osso e i guanti di cotone. Ottilia controlla ogni pagina prima di passarti la successiva."
        prova: { attributo: mentale, abilita: accademiche, difficolta: Media }
        successo:
          titolo: L'ultimo foglio
          testo: |
            Ricopi per tutto il pomeriggio, una riga alla volta, voltando i
            fogli con la pinzetta. Per lo più sono turni di guardia, firmati a
            ogni ora canonica da un sacerdote diverso. Ottilia controlla ogni
            pagina in piedi e te ne passa un'altra. Verso sera arrivi
            all'ultimo foglio del registro, quello con i bordi più neri, e in
            cima, con una grafia che non conosci, c'è la data della notte
            dell'incendio.
          pe: { accademiche: 5 }
          segue: la-notte-del-santuario
        fallimento:
          titolo: Cenere
          testo: |
            Ricopi una pagina e mezza, poi volti un foglio con le dita invece
            che con la pinzetta, e un angolo ti resta in mano fatto di cenere.
            Ottilia lo raccoglie in un piattino e lo guarda in silenzio. «Per oggi
            basta» dice, e chiude la cassetta. La prossima volta, aggiunge, le
            dita le tieni in grembo finché non ti servono per scrivere.

      - testo: "Leggere le pagine controluce"
        descrizione: "Dove l'inchiostro è bruciato restano i solchi del pennino. Contro la luce della finestra, a volte, si leggono ancora."
        prova: { attributo: mentale, abilita: percezione, difficolta: Media }
        successo:
          titolo: I solchi del pennino
          testo: |
            Prendi i fogli più bruciati uno alla volta con la pinzetta e li
            alzi contro la finestra. Dove l'inchiostro se n'è andato restano i
            solchi del pennino, e se inclini il foglio di poco le lettere
            tornano fuori una per una. Ottilia smette di guardarti le mani e
            comincia a guardare le pagine. Ricostruisci tre fogli che lei
            credeva persi, e l'ultimo porta in cima la data della notte
            dell'incendio.
          pe: { percezione: 5 }
          segue: la-notte-del-santuario
        fallimento:
          titolo: Controluce
          testo: |
            Alzi i fogli contro la finestra e cerchi i solchi del pennino, ma
            la carta bruciata è troppo sottile e la luce ci passa attraverso
            senza mostrarti niente. Dopo un'ora hai ricostruito una parola
            sola, *candele*. Ottilia la annota in un quaderno senza commentare
            e ti dice di tornare quando avrai gli occhi più riposati. Sul
            tavolo restano i guanti di cotone, con le punte delle dita
            annerite.

      - testo: "Aiutarla un'ora al giorno"
        descrizione: "Senza fretta, un foglio per volta, alla sua maniera. Ottilia non ha mai avuto fretta in vita sua."
        costo: 2
        esito:
          titolo: Un foglio al giorno
          testo: |
            Per una settimana torni ogni giorno alla stessa ora, e ogni giorno
            Ottilia ti dà un foglio solo. Lo ricopi con calma, poi lei lo
            controlla e te lo toglie di mano. Il quinto giorno ti chiede da
            dove vieni. Il sesto ti racconta che da novizia copiava anche lei,
            in queste cantine, quando sopra c'era ancora il Santuario. Il
            settimo ti porge l'ultimo foglio del registro, quello con i bordi
            più neri, che porta la data della notte dell'incendio.
          pe: { resilienza: 5 }
          segue: la-notte-del-santuario

  - id: la-notte-del-santuario
    immagine: personaggi/ottilia-sanvel
    titolo: La notte del Santuario
    tipo: seguito
    luogo: Cattedrale del Velo, gli archivi minori
    area: quartieri-alti
    requisiti: [cattedrale.archivio == 0]
    testo: |
      L'ultimo foglio è diviso in due colonne. A sinistra ci sono i sei
      sacerdoti di turno quella notte, ognuno con accanto l'ora in cui ha
      firmato. A destra c'è l'elenco di chi dormiva nel Santuario, i rifugiati
      che dopo le Notti Cucite non volevano tornare a casa e le famiglie che
      una casa non l'avevano più. Sono quarantuno righe, e accanto a quasi
      tutte c'è una crocetta, tracciata con un altro inchiostro da una mano
      che andava di fretta. Nella colonna dei sacerdoti le firme si fermano
      alla compieta. Più sotto c'era una riga a matita, e qualcuno l'ha
      cancellata con tanta forza da strappare la carta.

      Ottilia è dietro di te, e non l'hai sentita arrivare. «Le crocette le ho
      fatte io» dice. «Stavo sulla porta del chiostro e contavo chi usciva.
      Allora avevo la grafia più grande.» Posa un dito guantato su tre righe
      senza crocetta, una dopo l'altra. Poi lo sposta in fondo alla colonna,
      sui nomi di Idrian Sollen e di sua figlia, che la crocetta non ce
      l'hanno nemmeno loro. «La riga cancellata diceva a che ora sono usciti i
      sacerdoti. Su questo foglio la Madre ha chiesto riservatezza, e io la
      rispetto.»

      *Lei stava sulla porta a contare, e i sacerdoti di turno erano già
      fuori.* Il guanto ti ha lasciato un'impronta grigia sull'angolo del
      foglio, e lo rimetti giù piano.
    opzioni:
      - testo: "Chiederle di quella notte"
        descrizione: "Ottilia parla in frasi brevi e non ama i superlativi. Di quella notte, forse, parla lo stesso."
        esito:
          titolo: I nomi del mattino
          testo: |
            Ottilia ci mette un po' a rispondere. «Il fuoco è partito dall'ala
            nord, e il fumo è arrivato prima delle fiamme» dice. «La chiave
            della porta del chiostro ce l'avevo io, e sono rimasta lì. Ne ho
            contati trentasei. Cinque non sono usciti.» Ti dice i cinque nomi a
            memoria, senza guardare il foglio, e aggiunge che li ripete ogni
            mattina all'esercizio dell'alba, prima del primo respiro. «Il
            sapere si accumula e basta. Saggezza è quello che decidi di non
            dimenticare.» Poi ti toglie il foglio di mano e lo rimette nella
            cassetta, sopra gli altri.
          pe: { empatia: 5 }
          imposta: { cattedrale.archivio: 1 }
          effetti: { rep.velo: 1 }

      - testo: "Ricopiare il foglio com'è, riga strappata compresa"
        descrizione: "La copia pulita la vuole la Madre. Quello che c'è sul foglio va sulla copia, anche il segno della cancellatura."
        esito:
          titolo: Il rettangolo vuoto
          testo: |
            Ricopi il foglio crocetta per crocetta senza parlare, e dove c'è
            la riga cancellata disegni sulla copia un rettangolo vuoto della
            stessa misura, con lo strappo segnato a matita. Ottilia guarda il
            rettangolo a lungo. Poi piega la copia in tre, la chiude con la
            cera del Velo e ci preme sopra il sigillo che porta alla cintura.
            «Per la Madre» dice. Mentre esci la senti chiudere la porta degli
            archivi a chiave, cosa che di giorno non fa mai.
          pe: { accademiche: 5 }
          imposta: { cattedrale.archivio: 1 }
          effetti: { rep.velo: 1 }

      - testo: "Copiare di nascosto la colonna dei sacerdoti"
        descrizione: "Sei nomi con le loro ore. In città c'è chi li pagherebbe bene, e Ottilia adesso ti volta le spalle."
        prova: { attributo: fisico, abilita: furtivita, difficolta: Media }
        successo:
          titolo: Sei nomi
          testo: |
            Mentre Ottilia rimette in ordine la cassetta ricopi i sei nomi in
            fondo al tuo quaderno, fra due conti della spesa, con l'ora
            accanto a ognuno. Quando si volta stai scrivendo la data in cima
            alla copia pulita. Più tardi, sotto un lampione dei Quartieri
            Alti, rileggi la pagina. Due di quei nomi li hai già sentiti in
            Cattedrale, durante le funzioni solenni. Richiudi il quaderno in
            fretta, e ti accorgi di esserti voltato a guardare se qualcuno ti
            segue.
          imposta: { cattedrale.archivio: 1 }
          effetti: { rep.velo: 1, informazioni.segreto: 1 }
        fallimento:
          titolo: La pagina strappata
          testo: |
            Ricopi i sei nomi in fondo al tuo quaderno mentre Ottilia rimette
            in ordine la cassetta, ma lei si volta prima che tu abbia finito.
            Ti tende la mano senza dire niente, e tu le dai il quaderno.
            Strappa la pagina con cura e la ripone nella cassetta, sopra il
            foglio bruciato. «Te l'avevo detto, quello che leggi resta qui»
            dice, e ti rende il quaderno. Gli archivi te li apre ancora, ma da
            quel giorno resta nella stanza finché non te ne vai.
          imposta: { cattedrale.archivio: 1 }
          effetti: { rep.velo: 0.5, scandalo: 0.5 }

      - testo: "Chiederle di Aurenne"
        descrizione: "Sul foglio la figlia del cappellano non ha la crocetta. Tu sai che dalle rovine è tornata viva."
        immagine: personaggi/aurenne
        requisiti: [pista.capomozzo >= 6]
        costo: 0
        esito:
          titolo: Una crocetta da mettere
          testo: |
            Ottilia resta a guardare il nome. «Quella notte non l'ho vista
            uscire, e dentro non l'avevo vista nemmeno prima» dice. «Per
            cinque anni è stata una riga senza crocetta, e la mattina la
            ripetevo con gli altri quattro nomi.» Si toglie un guanto e passa il pollice
            sulla carta accanto al nome, senza toccarlo. «Adesso la crocetta
            non so dove metterla.» Rimette il guanto, e per un po' non
            aggiunge altro.

  # ------------------------------------------------------------ storia a 6 · il voto del Velo
  - id: il-voto-del-velo
    presso: cattedrale-del-velo
    immagine: personaggi/padre-vantes
    titolo: Il voto del Velo
    sommario: "Dopo la compieta Padre Vantes ti trattiene sulla prima panca. Ha una cosa da chiederti, e prima di chiederla ti prende il polso."
    luogo: Cattedrale del Velo, la navata, dopo la compieta
    area: quartieri-alti
    requisiti: [rep.velo >= 6, cattedrale.voto == 0]
    testo: |
      Dopo la compieta la navata si svuota in fretta, e gli accoliti spengono
      le candele partendo dall'ingresso. Padre Vantes ti trattiene con due
      dita sul polso e ti fa sedere sulla prima panca, quella dove di giorno
      siedono i consiglieri. Il cristallo rosso pulsa piano, al ritmo lungo
      delle ore di notte. Da vicino ti accorgi che nella pietra corrono
      venature più scure, e che il battito ci passa dentro come l'acqua in un
      canale.

      «Il Velo ha i suoi chierici e i suoi monaci» dice Vantes, «e poi ha
      quelli come te, che ci aiutano senza portare la tonaca. A volte a uno di
      loro chiediamo di più.» Le dita restano sul tuo polso, leggere. «Un
      laico consacrato fa il suo voto di notte davanti all'altare, e da quella
      notte la Cripta per lui è aperta. Scende quando vuole e prega con i
      novizi. In cambio, quando il Velo ha bisogno, lo chiama per nome.»

      Si ferma, e per la prima volta da quando lo conosci ti sembra in
      imbarazzo. «La Madre è d'accordo. Il tuo nome l'ha fatto lei.»

      *Una donna che nessuno ha mai visto in faccia, e che sa come mi chiamo.*
      Ti sei seduto con la schiena dritta senza volerlo, e la lasci andare
      contro lo schienale.
    opzioni:
      - testo: "Chiedere che cosa si promette"
        descrizione: "Un voto è fatto di parole. Prima di dirle, conviene saperle."
        costo: 0
        esito:
          titolo: La vita che resta
          testo: |
            «Si promette di servire la vita che resta» dice Vantes. «Le parole
            sono della Madre, e io le ho imparate da lei quando ero novizio.»
            Si tocca il sigillo del Velo che porta al collo, l'unico ornamento
            che gli hai mai visto. «Come servirla lo decidi tu giorno per
            giorno, e decidi tu se restare in città o partire. Il Velo chiede
            di sapere dove sei, e di poterti chiamare. Il resto lo chiede la
            tua coscienza, e a lei rispondi da solo.»

      - testo: "Chiedere chi ci sarà"
        descrizione: "Un rito di notte, davanti al cristallo. Qualcuno lo deve pur vedere."
        requisiti: [pista.capomozzo < 9]
        costo: 0
        esito:
          titolo: Tre testimoni
          testo: |
            «Io, che dico le parole prima di te» dice Vantes, e conta sulle
            dita. «Ottilia, che scrive il tuo nome nel registro dei laici, e
            lo scrive soltanto se ha visto con i suoi occhi.» Esita sul terzo
            dito. «E Sorella Celia con il liuto, perché me l'ha chiesto, e io
            a Celia dico di no di rado.» Ti lascia il polso. «La Madre resta
            nella Cripta. Ma la scala è aperta, e lei sente.»

      - testo: "Chiedere chi ci sarà"
        descrizione: "Un rito di notte, davanti al cristallo. Qualcuno lo deve pur vedere."
        requisiti: [pista.capomozzo >= 9]
        immagine: personaggi/aurenne
        costo: 0
        esito:
          titolo: Quattro testimoni
          testo: |
            «Ci saremo io e Ottilia, con Sorella Celia che porta il liuto»
            dice Vantes, e dopo una pausa aggiunge che ci sarà anche Aurenne.
            Ti guarda per vedere come la prendi. «Me l'ha chiesto lei ieri
            sera, ed è la prima cosa che chiede da quando è sveglia. Dice che
            al Santuario, da bambina, i voti li guardava di nascosto dal
            matroneo, e che stavolta ne vorrebbe vedere uno da vicino.» Ti
            stringe il polso per un momento. «Se preferisci di no, glielo dico
            io» dice, e te lo lascia andare.

      - testo: "Dirgli dell'argano"
        descrizione: "Ferro ti aspetta sull'orlo della Cicatrice. Un voto che ti tiene in città arriva tardi."
        requisiti: [pista.capomozzo >= 10]
        costo: 0
        esito:
          titolo: La garitta
          testo: |
            «Lo so» dice Vantes. «Il custode della garitta sopra i piloni è
            uno dei nostri, e mi ha detto chi è sceso a provare l'argano.» Ti
            tiene il polso un po' più a lungo del solito. «Il voto non ti
            trattiene. Il Velo custodisce le strade che scendono, e uno dei
            suoi laggiù gli serve più di uno quassù. Quando torni, la Cripta è
            ancora aperta.»

      - testo: "Accettare"
        descrizione: "Stanotte, all'ultima ora, davanti al cristallo rosso. Si veglia fino al mattutino."
        esito:
          titolo: Stanotte
          testo: |
            Vantes annuisce piano, e per un momento le dita sul tuo polso
            stringono un po' di più. «Allora stanotte» dice. «Torna quando
            suona l'ultima ora, e non portare niente. Le armi le lasci al
            portone, come tutti.» Si alza, e mentre va verso la sagrestia
            accende una candela per ogni panca, al contrario degli accoliti,
            che le hanno appena spente.
          segue: la-veglia-del-voto

      - testo: "Rifiutare con garbo"
        descrizione: "È un onore, e un impegno. Per adesso preferisci restare uno che aiuta senza promettere."
        costo: 0
        esito:
          titolo: La prima panca
          testo: |
            Gli dici che ti fa onore, e che per adesso preferisci aiutare
            senza promettere. Vantes ti ascolta con le dita sul tuo polso e
            alla fine le ritira. «Il Velo sa aspettare» dice. «La prima panca
            resta qui, e anche la domanda.» Ti accompagna al portone con una
            candela in mano, e sulla soglia ti benedice come ogni sera, senza
            aggiungere altro.

  - id: la-veglia-del-voto
    immagine: ambientazione/cattedrale-del-velo
    titolo: La veglia del voto
    tipo: seguito
    luogo: Cattedrale del Velo, l'altare, di notte
    area: quartieri-alti
    requisiti: [cattedrale.voto == 0]
    testo: |
      Quando suona l'ultima ora torni in Cattedrale. Le porte sono accostate,
      e dentro restano accese soltanto le candele dell'altare e una lanterna
      in fondo, dove Ottilia Sanvel aspetta con un registro sotto il braccio.
      Su una panca laterale Sorella Celia tiene il liuto sulle ginocchia senza
      suonarlo, e al polso ha un nastro che stanotte nessuno le farà togliere.
      Padre Vantes ti fa inginocchiare sul gradino più basso, a un braccio dal
      cristallo rosso, e ti mette fra le mani una candela spenta.

      «Si veglia fino al mattutino» dice. «Quando il cristallo batte l'ora
      accendi la candela alla sua luce e dici il voto. Se prima ti addormenti
      nessuno te ne farà una colpa, e si ricomincia un'altra notte.»

      Il gradino è di pietra, e il freddo ti sale nelle ginocchia attraverso
      la stoffa. Il cristallo pulsa a intervalli lunghi, e ogni volta la luce
      rossa ti scorre sulle mani e poi si ritira. Dalla scala della Cripta,
      alle tue spalle, sale un filo d'aria fredda che odora di rame, e capisci
      che il passaggio è aperto anche se da laggiù non arriva un rumore.

      *Quattro ore di qui al mattutino, e il freddo è già arrivato alle
      ginocchia.* Ti sistemi meglio sul gradino, e accanto a te Vantes
      comincia a pregare sottovoce.
    opzioni:
      - testo: "Vegliare fino al mattutino"
        descrizione: "Quattro ore in ginocchio sulla pietra, senza chiudere gli occhi, con il battito del cristallo davanti."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Media }
        successo:
          titolo: Il mattutino
          testo: |
            Vegli tutta la notte, e verso la terza ora non senti più le
            ginocchia. Quando il cristallo batte il mattutino accosti lo
            stoppino alla pietra, che è calda come una brace, e la candela si
            accende. Dici il voto con le parole che ti ha dato Vantes, servire
            la vita che resta, e dalla scala della Cripta una voce bassa
            ripete l'ultima parola con un attimo di ritardo. Celia suona un
            accordo solo. Ottilia scrive in piedi il tuo nome nel registro dei
            laici, e Vantes ti aiuta ad alzarti tenendoti il polso.
          pe: { resilienza: 5 }
          imposta: { cattedrale.voto: 1 }
          effetti: { rep.velo: 1 }
        fallimento:
          titolo: L'alba sul gradino
          testo: |
            Verso la terza ora il battito del cristallo comincia a cullarti, e
            ti svegli con la guancia sul gradino e la candela rotolata via.
            Dalle vetrate entra la luce grigia dell'alba. Vantes è ancora in
            ginocchio accanto a te e ha continuato a pregare per tutti e due.
            «Succede a molti» dice, raccogliendo la candela. «Si ricomincia
            un'altra notte, come ti avevo detto.» Ottilia chiude il registro
            senza scriverci niente.

      - testo: "Pregare con Vantes per restare sveglio"
        descrizione: "La sua voce non si ferma mai. Se le vai dietro, parola per parola, la notte passa più in fretta."
        costo: 2
        esito:
          titolo: La voce di Vantes
          testo: |
            Vai dietro alla preghiera di Vantes parola per parola, e quando
            non la conosci ripeti l'ultima frase finché lui non la cambia. Le
            ore passano così, una strofa dopo l'altra. Quando il cristallo
            batte il mattutino accosti lo stoppino alla pietra calda, e la
            candela si accende. Dici il voto, servire la vita che resta, e
            dalla scala della Cripta una voce bassa ripete l'ultima parola con
            un attimo di ritardo. Ottilia scrive il tuo nome nel registro, e
            Celia suona un accordo solo.
          pe: { galateo: 5 }
          imposta: { cattedrale.voto: 1 }
          effetti: { rep.velo: 1 }

      - testo: "Vegliare con Aurenne accanto"
        descrizione: "Dalla sala di preghiera più interna arriva Aurenne, e si inginocchia sul gradino accanto al tuo senza chiedere permesso."
        immagine: personaggi/aurenne
        requisiti: [pista.capomozzo >= 9]
        esito:
          titolo: Il gradino accanto
          testo: |
            Aurenne si inginocchia accanto a te, con l'artiglio appoggiato
            sulla coscia. Verso la seconda ora ti dice sottovoce che al
            Santuario si addormentava sempre alla terza, e che suo padre la
            lasciava dormire. Alla terza ora, quando ti cade la testa, ti
            tocca la spalla con la mano buona. Al mattutino ti regge il polso
            mentre accosti lo stoppino alla pietra calda. Dici il voto, e lei
            lo dice con te nelle parole vecchie, mezza sillaba avanti. Ottilia
            scrive il tuo nome nel registro e, dopo un momento, nella riga
            sotto, quello di Aurenne come testimone.
          pe: { empatia: 5 }
          imposta: { cattedrale.voto: 1 }
          effetti: { rep.velo: 1 }

      - testo: "Alzarti prima dell'ora"
        descrizione: "Forse non è la notte giusta. Vantes lo ha detto, si può ricominciare."
        costo: 0
        esito:
          titolo: Un'altra notte
          testo: |
            Ti alzi dal gradino prima del mattutino e posi la candela spenta
            sull'altare. Vantes smette di pregare e ti guarda senza
            rimprovero. «Un'altra notte, allora» dice, e ti posa due dita sul
            polso. Celia ripone il liuto nella custodia, Ottilia chiude il
            registro, e nessuno dei tre ti chiede perché. Fuori la notte è
            ancora fonda, e mentre scendi la scalinata senti il portone che si
            richiude piano alle tue spalle.

  # ------------------------------------------------------------ la carta
  - id: carta-le-campane-del-velo
    immagine: fazioni/confraternita-del-velo
    titolo: Le campane del Velo
    sommario: "Per strada passa una processione del Velo, e in coda un novizio ha perso il batacchio della campanella."
    luogo: Quartieri Alti, la strada che scende dalla Cattedrale
    tipo: carta
    area: quartieri-alti
    requisiti: [rep.velo < 2]
    testo: |
      Le campane della Cattedrale suonano a lutto, e dalla strada alta scende
      una processione del Velo per i morti della razzia. Davanti vanno due
      guardie in coppia e un sacerdote con il libro aperto, e dietro una fila
      di fedeli con le candele, che il vento della Cicatrice spegne e che loro
      riaccendono l'una dall'altra senza fermarsi. In coda cammina un novizio
      di dodici anni al massimo con una campanella in mano, che dovrebbe
      suonare a ogni passo e da un po' non suona più.

      Il batacchio gli è scappato ed è rotolato sotto la carrozza di un
      nobile, ferma all'angolo con i cavalli che sbuffano. Il novizio guarda
      la carrozza e la processione che si allontana, e intanto continua ad
      agitare la campanella muta con molta fede. A cassetta il cocchiere
      sbuccia una mela e fa finta di niente.

      *Se esce dalla fila glielo fanno pagare, e se non suona pure.* Ti
      ritrovi fermo sul bordo della strada, con le mani già fuori dalle tasche.
    opzioni:
      - testo: "Recuperare il batacchio"
        descrizione: "Bisogna infilarsi sotto la carrozza, fra le ruote, mentre i cavalli sbuffano."
        esito:
          titolo: Sotto la carrozza
          testo: |
            Ti infili a carponi fra le ruote della carrozza, e il cocchiere si
            sporge a guardarti con la mela a mezz'aria. Il batacchio è finito
            in una pozzanghera accanto alla ruota di dietro. Il novizio lo
            riaggancia da solo, con le dita che tremano, e corre dietro alla
            processione suonando più forte di prima. In fondo alla strada il
            sacerdote si volta verso il ragazzo e poi verso di te, e ti fa un
            cenno con il libro. Le ginocchia dei calzoni restano bagnate fino
            a sera.
          effetti: { rep.velo: 0.5 }
      - testo: "Chiedere al cocchiere di spostarsi"
        descrizione: "Basta un passo di cavalli, e il batacchio è libero. Il cocchiere va soltanto convinto."
        prova: { attributo: sociale, abilita: [persuasione, intimidire], difficolta: Facile }
        successo:
          titolo: Un passo di cavalli
          testo: |
            Ti pianti accanto alle ruote e spieghi al cocchiere che la
            carrozza è ferma sopra un oggetto sacro, cosa vera in un certo
            senso. Lui guarda te e poi la processione, e alla fine schiocca la
            lingua, e i cavalli fanno un passo avanti. Il novizio si tuffa sul
            batacchio e corre via suonando, prima ancora di averlo
            riagganciato bene. Dalla processione un sacerdote si volta e ti fa
            un cenno con il libro aperto.
          effetti: { rep.velo: 0.5 }
        fallimento:
          titolo: La mela
          testo: |
            Il cocchiere ti ascolta fino in fondo, poi ti dice che la carrozza
            è del suo padrone e che lui da lì non si muove finché il padrone
            non esce. Mentre discutete il novizio si arrende, si infila la
            campanella muta sotto il braccio e corre dietro alla processione.
            Il cocchiere torna alla sua mela. Poco dopo, dalla piazza in
            fondo, arriva un suono storto di campanella, battuta con qualcosa
            che non è il suo batacchio.
      - testo: "Proseguire per la tua strada"
        descrizione: "I novizi del Velo hanno i loro maestri, e tu hai i tuoi affari."
        costo: 0
        esito:
          testo: |
            Prosegui per la tua strada. All'angolo ti volti, e il novizio è
            ancora lì con la campanella muta in mano, mentre la processione è
            già in fondo alla discesa. Il cocchiere ha finito la mela e ne
            butta il torsolo sotto la carrozza, accanto al batacchio. Quando
            arrivi in piazza le campane della Cattedrale hanno smesso di
            suonare a lutto.
