# La città viva, luogo 2: la Cattedrale del Velo (presso: cattedrale-del-velo, area quartieri-alti).
# L'attività delle ore, le tre storie della Confraternita e la carta della processione. Il servizio (purificazione,
# navata silenziosa, la Liturgia dell'Albero alla scuola dei novizi) sta già in contenuti/aree/quartieri-alti.yaml.
# Dall'ottobre 2026 le tre storie sono passi della quest di fazione del Velo (contenuti/fazioni/velo/): i Giardini
# della Linfa con Lino sono il passo 1 (fazione.velo == 0), gli archivi minori con la notte del Santuario il passo 4
# (== 3), il voto con la veglia il passo 6 (== 5, grado 2). I flag di prima (cattedrale.giardini, archivio, voto)
# restano, perché altre scene li leggono. Le Ore del Velo hanno in più il turno di garitta (grado 3, reputazione fino
# a 8) e il servizio della Cripta (grado 4, fino a 10).
# Reputazione: è quella della Confraternita (rep.velo). I Giardini e le ore la fanno salire fino a 4, l'alba
# con Ottilia e la linfa di notte fino a 6, la garitta fino a 8 e la Cripta fino a 10.
# Aurenne è sveglia e vive in Cattedrale da pista.capomozzo >= 9 (si risveglia nel passo 8 → 9).
storylet:
  # ------------------------------------------------------------ l'attività ripetibile
  - id: le-ore-del-velo
    presso: cattedrale-del-velo
    immagine: ambientazione/cattedrale-del-velo
    titolo: Le ore del Velo
    sommario: "In Cattedrale il lavoro non manca mai, e ogni mattina Ottilia Sanvel lo scrive su una tavoletta accanto alla sagrestia."
    luogo: Cattedrale del Velo, la navata e il chiostro
    area: quartieri-alti
    ripetibile: true
    testo: |
      In Cattedrale le giornate le misura il cristallo rosso sull'altare, e quando pulsa la sua luce arriva
      fino alla prima fila di colonne. Due guardie del Velo girano fra le colonne sempre in coppia, e a forza
      di giri hanno preso lo stesso passo. Lungo il loro giro le lastre del pavimento sono più lisce e più
      chiare delle altre.

      Sulla tavoletta di cera accanto alla sagrestia Ottilia Sanvel scrive ogni mattina i lavori del giorno
      con la sua grafia piccola e diritta. La cera è stata lisciata tante volte che sotto i turni di oggi si
      leggono ancora i solchi di quelli vecchi. La sera chi ha dato una mano passa dalla tesoriera Sorella
      Arva. Lei conta la paga una moneta alla volta e a ognuno propone per carità un prestito a interesse.

      {origine accolito-del-velo} Quella grafia per anni ti ha detto dove dovevi essere all'alba. Le guardie
      ti salutano con un cenno del mento senza perdere il passo, come si saluta uno di casa.
    opzioni:
      - testo: "Lavorare nei Giardini della Linfa"
        descrizione: "Sorella Giulia ha sempre bisogno di mani che sappiano distinguere una foglia sana da una malata, e che non abbiano fretta."
        immagine: personaggi/sorella-giulia
        quando: [pista.capomozzo < 9]
        requisiti: [rep.velo < 4]
        prova: { attributo: mentale, abilita: [natura, medicina], difficolta: Media }
        successo:
          titolo: Le foglie buone
          testo: |
            Passi il pomeriggio in ginocchio fra le aiuole a togliere le foglie arrugginite, che si staccano
            dal picciolo con un suono di carta secca. Alla fine hai i polpastrelli tinti di una luce verdina
            che non va via nemmeno sfregandoli sui calzoni. Sorella Giulia controlla il lavoro camminando
            piano, con un passero appollaiato sul pollice, e ti dice che oggi le piante bevono meglio la luce.
            La sera Sorella Arva ti conta qualche moneta sul palmo e ti chiede se per caso te ne servono altre
            in prestito.

            {origine figlio-del-circolo} Giulia parla al passero a mezza voce, con le pause lunghe che al
            Circolo si usano per le bestie che non si fidano. Ti viene da chiederle dove l'ha imparato, e poi
            ti accorgi che le stai rispondendo con le stesse pause.
          effetti: { monete: 2, rep.velo: 0.5 }
        fallimento:
          titolo: La ruggine di sotto
          testo: |
            Togli le foglie arrugginite con impegno, e insieme a loro anche una manciata di germogli nuovi che
            alla luce del giorno sembravano malati. Sorella Giulia li raccoglie dal cesto uno per uno e li
            ripianta senza una parola di rimprovero, il che è peggio. Ti spiega che la ruggine comincia sotto
            la foglia, e ne gira una per mostrarti la polvere arancione che si allarga dalle nervature. Poi ti
            manda a casa con un germoglio in un vaso, per esercitarti.

      - testo: "Lavorare nei Giardini della Linfa"
        descrizione: "Al tramonto, fra le aiuole, Giulia non è più sola. Aurenne annaffia le piante con la mano buona e tiene l'artiglio dietro la schiena."
        immagine: personaggi/aurenne
        quando: [pista.capomozzo >= 9]
        requisiti: [rep.velo < 4]
        prova: { attributo: mentale, abilita: [natura, medicina], difficolta: Media }
        successo:
          titolo: I passeri
          testo: |
            Lavori fra le aiuole fino al tramonto, e quando la luce cala arriva Aurenne con l'annaffiatoio. Lo
            regge con la mano buona e tiene l'artiglio dietro la schiena, e i passeri, che di solito si posano
            dappertutto, intorno a lei lasciano un cerchio vuoto. Il cerchio è largo un paio di passi e si
            sposta con lei da un'aiuola all'altra. Sorella Giulia dice che si abitueranno, e intanto approva
            quasi tutte le tue foglie. Aurenne non ti parla. A fine giro però ti indica con il mento una
            foglia arrugginita che ti era sfuggita. Sorella Arva, all'uscita, ti conta la paga.
          effetti: { monete: 2, rep.velo: 0.5 }
        fallimento:
          titolo: La foglia rovesciata
          testo: |
            Strappi le foglie arrugginite insieme a qualche germoglio sano, e Sorella Giulia si china a
            ripiantarli con un sospiro che vuole essere un sorriso. Aurenne, che annaffia l'aiuola accanto, si
            ferma a guardarti le mani. Poi posa l'annaffiatoio e ti mostra con la mano buona come si gira una
            foglia per guardarla di sotto, senza una parola. Sotto, la ruggine è una polvere fine color
            mattone che con la luce di sopra non si vede. Quando te ne vai i passeri stanno ancora tutti dalla
            parte di Giulia.

      - testo: "Servire alle ore canoniche"
        descrizione: "Reggere il turibolo e rispondere ai salmi al momento giusto, davanti a Padre Vantes, che non perde un gesto."
        immagine: personaggi/padre-vantes
        quando: [pista.capomozzo < 9]
        requisiti: [rep.velo < 4]
        prova: { attributo: sociale, abilita: [galateo, resilienza], difficolta: Media }
        successo:
          titolo: Il turibolo
          testo: |
            Reggi il turibolo per tutta l'ora di terza, un passo dietro Padre Vantes, e rispondi ai salmi un
            attimo dopo i novizi, che li sanno a memoria. La catena è calda e ti lascia sulle dita l'odore
            della resina. Quando il cristallo pulsa ti inginocchi insieme agli altri senza che nessuno debba
            tirarti la manica. Alla fine Vantes ti posa due dita sul polso, come fa con tutti, e ti dice che
            domani c'è la sesta, se ti va. Sorella Arva ti conta uno spicciolo sul palmo, e lo fa sembrare un
            sacrificio personale.
          effetti: { monete: 1, rep.velo: 0.5 }
        fallimento:
          titolo: Il fumo negli occhi
          testo: |
            Il turibolo pesa più di quanto pensavi, e la catena ti sega le dita a ogni oscillazione. A metà
            dell'ora il fumo ti sale dritto negli occhi. Rispondi a un salmo con le parole di quello prima, e
            due novizi si mordono le labbra per non ridere. Quando il cristallo pulsa ti inginocchi in
            ritardo, ultimo di tutta la navata, con le ginocchia che scricchiolano. Alla fine Padre Vantes ti
            posa lo stesso due dita sul polso e ti dice che la terza, la prima volta, la sbagliano tutti.

      - testo: "Servire alle ore canoniche"
        descrizione: "All'ora di compieta Aurenne è sempre in ginocchio sull'ultima panca, lontana dagli altri. I salmi li sa meglio dei novizi."
        immagine: personaggi/aurenne
        quando: [pista.capomozzo >= 9]
        requisiti: [rep.velo < 4]
        prova: { attributo: sociale, abilita: [galateo, resilienza], difficolta: Media }
        successo:
          titolo: Le risposte vecchie
          testo: |
            Servi la compieta con il turibolo in mano, dietro Padre Vantes. Dall'ultima panca Aurenne risponde
            ai salmi a voce bassa, e dopo un po' ti accorgi che certe risposte le dice con parole più antiche.
            Sono quelle del vecchio Santuario, che nella Cattedrale nuova sono state cambiate. Hanno le vocali
            più lunghe, e sotto le volte durano un poco più delle altre. Se ne accorge anche Vantes, e non la
            corregge. Quando il cristallo pulsa vi inginocchiate tutti nello stesso momento, lei compresa.
            All'uscita Sorella Arva ti conta uno spicciolo.
          effetti: { monete: 1, rep.velo: 0.5 }
        fallimento:
          titolo: Fuori tempo
          testo: |
            Reggi il turibolo dietro Padre Vantes, ma dall'ultima panca Aurenne risponde ai salmi con le
            parole del vecchio Santuario, e tu vai dietro a lei invece che ai novizi. A metà dell'ora ti
            ritrovi a dire da sol{o|a}, in mezzo alla navata, una risposta che nessuno usa più. La tua voce
            rimbomba fino alle volte, e l'eco torna giù quando tu hai già smesso. Aurenne alza la testa e ti
            guarda. Poi abbassa gli occhi e risponde con le parole nuove, piano, perché tu possa seguirla.

      - testo: "Copiare per gli archivi minori"
        descrizione: "Ottilia Sanvel tiene gli archivi minori dietro il chiostro. Dei registri vecchi servono copie pulite, e chi ha una bella grafia viene pagato a pagina."
        immagine: personaggi/ottilia-sanvel
        prova: { attributo: mentale, abilita: accademiche, difficolta: Facile }
        successo:
          titolo: Trenta pagine
          testo: |
            Ottilia ti fa sedere a un tavolo del chiostro con un registro di battesimi del centotrenta e un
            quaderno nuovo, e ti lascia lavorare fino a sera. Le pagine del registro sono ingiallite ai bordi,
            e l'inchiostro è diventato marrone. Quando torna Ottilia sfoglia la copia in piedi dall'ultima
            pagina alla prima e trova una sola svista, che ti indica con l'unghia. Sorella Arva ti paga a
            pagine copiate, e arrotonda per difetto.
          effetti: { monete: 3 }
        fallimento:
          titolo: La riga saltata
          testo: |
            Ricopi un registro di battesimi fino a sera, e a metà pomeriggio salti una riga senza
            accorgertene. Da lì in poi ogni nome finisce accanto alla data del bambino dopo, per tre pagine
            intere di bella grafia. Ottilia se ne accorge alla prima occhiata e ti mostra dove hai sbagliato,
            senza alzare la voce. La copia la rifarà un novizio, e Sorella Arva ti conta appena il prezzo
            della carta.
          effetti: { monete: 1 }

      - testo: "Assistere i ricoverati"
        descrizione: "Nell'infermeria della navata nord le brande non bastano mai. Nadja Oresca cerca qualcuno che cambi le bende e ascolti chi ha voglia di parlare."
        immagine: personaggi/nadja-oresca
        prova: { attributo: mentale, abilita: [medicina, empatia], difficolta: Media }
        successo:
          titolo: L'infuso all'aceto
          testo: |
            Passi la mattina fra le brande con Nadja Oresca, che ha le vesti spiegazzate e un proverbio in
            lingua antica per ogni ferita. Cambi le bende a un muratore caduto da un'impalcatura, e quelle
            vecchie sono rigide di calce e si staccano a pezzi. Poi tieni la mano a una vecchia che non vuole
            bere l'infuso perché sa di aceto. Nadja ti ringrazia con un proverbio che nessuno dei due capisce,
            e Sorella Arva ti conta qualche moneta.
          effetti: { monete: 2 }
        fallimento:
          titolo: Il dialetto dei Ponti
          testo: |
            Cambi le bende a un muratore caduto da un'impalcatura e stringi troppo, e lui ti dice quello che
            pensa di te in un dialetto dei Ponti che non conoscevi. La fascia gli ha già lasciato sulla pelle
            un solco bianco. Nadja Oresca rifà la fasciatura in un attimo, girandosi l'anello di rame intorno
            al dito, e ti manda a vuotare i catini per il resto della mattina. Quando ripassi davanti alla sua
            branda il muratore ti saluta con la mano buona.

      - testo: "Accendere le candele della navata"
        descrizione: "Ogni sera le candele della navata si accendono una per una, dall'ingresso fino all'altare. Lo fa chi capita, e stasera capiti tu."
        esito:
          titolo: Le candele di sinistra
          testo: |
            Accendi le candele con un lungo stoppino partendo dall'ingresso, e a ogni fila la navata si scalda
            un poco. Sorella Celia accorda il liuto su una panca laterale per la funzione della sera e ogni
            tanto ti corregge, perché le candele di sinistra vanno accese prima di quelle di destra, per una
            ragione che nemmeno lei ricorda. Sono anche le più consumate, con le colature di cera che scendono
            fino al ferro dei portacandele. Quando arrivi all'altare il cristallo pulsa, e la fiamma più
            vicina si piega appena nella sua direzione.
          pe: { resilienza: 2 }

      - testo: "Esercitarti all'alba con i novizi"
        descrizione: "All'alba Ottilia fa esercitare i novizi nel corridoio sotto il chiostro."
        immagine: personaggi/ottilia-sanvel
        requisiti: [rep.velo >= 4, rep.velo < 6]
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Media }
        successo:
          titolo: In testa alla fila
          testo: |
            Ti metti in testa alla fila, dove ti vedono tutti, e segui la sequenza di Ottilia dal primo
            movimento all'ultimo. Il respiro va con le braccia come dice lei, e alle tue spalle sedici novizi
            tengono il tempo con te. Sul pavimento del corridoio la pietra è consumata in file di conche poco
            profonde, dove i piedi dei novizi tornano ogni mattina. Alla fine Ottilia prende un bastone dalla
            rastrelliera e ti fa ripetere contro di lei l'ultimo movimento, ogni volta più svelto. Lo pari due
            volte, e lei dice che può bastare, parole che in bocca sua valgono un elogio. Sorella Arva ti
            conta il dovuto.
          effetti: { monete: 3, rep.velo: 0.5 }
        fallimento:
          titolo: Il bastone
          testo: |
            Ti metti in testa alla fila e parti bene, ma al decimo movimento perdi il conto, e con te lo
            perdono i sedici novizi che ti guardano la schiena. Ottilia ferma tutti con una parola. Prende
            dalla rastrelliera un bastone di frassino che è scuro e liscio dove si impugna, e ti fa ripetere
            il movimento contro di lei. Alla terza volta ti ritrovi sedut{o|a} sulla pietra, con il coccige
            che protesta. Ti tende la mano per rialzarti e ti rimanda in fondo alla fila.
          effetti: { ferite: 0.5 }

      - testo: "Raccogliere la linfa di notte"
        descrizione: "La linfa per gli unguenti si raccoglie di notte, quando le piante sono più accese. Giulia la affida soltanto a mani che conosce."
        immagine: personaggi/sorella-giulia
        requisiti: [rep.velo >= 4, rep.velo < 6]
        prova: { attributo: mentale, abilita: [natura, medicina], difficolta: Difficile }
        successo:
          titolo: Dodici fiale
          testo: |
            Giri fra le aiuole con una lanterna schermata e una cassetta di fiale, e incidi i fusti come ti ha
            mostrato Giulia, con un taglio sottile in diagonale che si richiude prima dell'alba. La linfa
            scende a gocce e nella fiala continua a brillare. Il vetro è sottile, e quando la linfa ci entra
            si scalda appena sotto le dita. All'alba ne hai riempite dodici senza sprecarne una, e hai la
            schiena di un vecchio. Giulia le alza controluce a una a una e le porta all'infermeria, e Sorella
            Arva ti conta la paga della notte.
          effetti: { monete: 5, rep.velo: 0.5 }
        fallimento:
          titolo: Il taglio storto
          testo: |
            Incidi i fusti al buio, con la lanterna schermata, e su una pianta giovane il taglio ti viene
            troppo profondo. La linfa esce tutta insieme e ti cola accesa sulle dita, mentre la pianta si
            spegne foglia dopo foglia fino alla radice. Sulla siepe i passeri si svegliano e cambiano ramo.
            Giulia guarda la pianta a lungo prima di decidere che forse si riprende. Per il resto della notte
            le fiale le riempie lei, e tu reggi la lanterna.

      - testo: "Scendere nella Cripta con i novizi"
        descrizione: "Da laico consacrato puoi sederti in fondo alla Cripta mentre i novizi recitano la Preghiera del Battito."
        immagine: personaggi/madre-del-velo
        requisiti: [cattedrale.voto >= 1]
        prova: { attributo: mentale, abilita: resilienza, difficolta: Media }
        successo:
          titolo: La Preghiera del Battito
          testo: |
            L'ultimo gradino della Cripta è freddo e consumato al centro da chi ci si è seduto prima di te. Ti
            siedi lì mentre i novizi recitano a mezza voce, tutti insieme. «Finché il cuore del mondo batterà,
            anche noi ricorderemo.» Dopo un po' ti accorgi che le parole le dici anche tu, e che le voci che
            ti porti dietro dalle profondità sono rimaste in cima alla scala, ad aspettarti.
          effetti: { tormento: -0.5 }
        fallimento:
          titolo: La seconda voce
          testo: |
            Ti siedi sull'ultimo gradino della Cripta mentre i novizi recitano la Preghiera del Battito. A
            metà della seconda strofa senti una voce che dice le stesse parole con un attimo di ritardo, più
            bassa delle altre, e non riesci a capire se arriva dal fondo della sala o da dentro la tua testa.
            Quando i novizi si fermano fra un verso e l'altro, quella voce finisce la parola da sola. Resti
            fino alla fine con le mani strette sulle ginocchia, e quando i novizi si alzano risali per
            prim{o|a}.

            {origine apprendista-raschiatore} Quando uno risale dai tunnel e sente voci, sulle piattaforme c'è
            sempre qualcuno che fa il nome di Mirn il Sordo, morto in una cella di questa Cattedrale. Sulla
            scala della Cripta il nome ti torna in mente da solo, e la mano cerca la corda di sicurezza che
            qui non c'è.

      - testo: "Fare il turno che Ottilia ti ha segnato"
        descrizione: "Sulla tavoletta di cera c'è il tuo nome scritto per intero. Agli accoliti Ottilia assegna un posto senza chiedere."
        quando: [origine.accolito-del-velo >= 1]
        requisiti: [rep.velo < 4]
        prova: { attributo: mentale, abilita: [medicina, accademiche], difficolta: Media }
        successo:
          titolo: Il giro di Vantes
          testo: |
            Il tuo turno è il giro dei malati con Padre Vantes, dalle brande della navata nord fino alle case
            dei fedeli che non possono più salire. Le scale di quelle case hanno i gradini consumati a conca.
            Lui impone le mani e tu cambi le bende, e quando a lui manca una parola della preghiera la dici
            tu, abbastanza piano perché sembri sua. Dalla razzia il vecchio si stanca prima, e a metà giro si
            appoggia al tuo braccio senza chiedere.
          effetti: { monete: 1, rep.velo: 0.5 }
        fallimento:
          titolo: La preghiera sbagliata
          testo: |
            Fai il giro dei malati con Padre Vantes, e a una branda della navata nord attacchi la preghiera
            per i moribondi davanti a un uomo che si è soltanto rotto un polso. Il libro ha le pagine
            incollate dall'umido, e ne hai girate due insieme. L'uomo si fa bianco e chiede un prete vero.
            Vantes finisce la preghiera giusta senza guardarti, e sulla porta ti dice che anche lui, da
            accolito, sbagliava pagina.

      - testo: "Fare il turno di garitta"
        descrizione: "Da custode dei pozzi la tavoletta ti manda ai piloni, nella garitta del Velo."
        immagine: personaggi/padre-walter
        quando: [fazione.velo >= 9]
        requisiti: [rep.velo < 8]
        prova: { attributo: mentale, abilita: [medicina, resilienza], difficolta: Media }
        successo:
          titolo: Il registro della garitta
          testo: |
            Passi la notte nella garitta sopra i piloni, con il braciere ai piedi e il registro sulle
            ginocchia. Il vento passa fra i cavi dei piloni con una nota sola, e la nota cambia ogni volta che
            qualcuno sale. Salgono una squadra di Raschiatori stanchi e un ragazzo con la tosse, e a ognuno
            guardi il bianco dell'occhio prima della faccia. Il ragazzo lo mandi in Cripta, gli altri a casa.
            All'alba Padre Walter passa a firmare il registro sotto la tua firma, con una grafia grande e
            lenta, e la sera Sorella Arva ti conta la paga del turno.
          effetti: { monete: 6, rep.velo: 0.5 }
        fallimento:
          titolo: Il braciere
          testo: |
            Verso la terza ora il braciere ti scalda troppo bene, e quando riapri gli occhi una squadra di
            Raschiatori è già passata e ti guarda dal ponte. Il registro ti è scivolato verso le braci e ha un
            angolo bruciacchiato. Nel registro mancano tre righe. Walter le riempie lui all'alba, chiedendo i
            nomi a memoria a chi è salito, e non ti rimprovera. Arva ti conta metà della paga, e lo fa con
            molta tristezza.
          effetti: { monete: 3, tormento: 1 }

      - testo: "Servire nella Cripta"
        descrizione: "Da velato della Cripta puoi scendere sotto l'altare a reggere le candele mentre la Madre ascolta chi viene a confessarsi."
        immagine: personaggi/madre-del-velo
        quando: [fazione.velo >= 12]
        requisiti: [rep.velo < 10]
        prova: { attributo: mentale, abilita: [resilienza, accademiche], difficolta: Difficile }
        successo:
          titolo: Le candele della Cripta
          testo: |
            Reggi il candeliere a un passo dai veli della Madre per tutta la notte, mentre scendono a parlarle
            un vecchio consigliere con il bastone e poi un Raschiatore che non riesce a finire le frasi. Lei
            ascolta senza muovere i veli. Nella Cripta l'aria è ferma, e il fumo della candela sale dritto
            fino alla volta. Tu tieni la fiamma ferma e gli occhi sul pavimento, come si insegna ai velati, e
            all'alba ti accorgi di non ricordare una sola parola di quello che hai sentito, il che forse è il
            punto.
          effetti: { monete: 4, rep.velo: 0.5 }
        fallimento:
          titolo: La fiamma che trema
          testo: |
            A metà della notte scende una donna a parlare di suo figlio, e la fiamma del candeliere comincia a
            tremarti in mano. La cera calda ti cola sul dorso delle dita. La Madre alza appena un dito senza
            voltarsi, e un altro velato ti toglie il candeliere e ti accompagna alla scala. Sali piano, con la
            voce della donna che ti segue fino in navata.
          effetti: { tormento: 1 }

  # ------------------------------------------------------------ storia a 2 · i Giardini della Linfa
  - id: i-giardini-della-linfa
    presso: cattedrale-del-velo
    immagine: personaggi/sorella-giulia
    titolo: I Giardini della Linfa
    sommario: "Nei Giardini la pianta più vecchia si sta spegnendo, e Sorella Giulia ha trovato sui fusti dei tagli che non ha fatto lei."
    luogo: Cattedrale del Velo, i Giardini della Linfa
    area: quartieri-alti
    requisiti: [fazione.velo == 0, pista.capomozzo >= 10]
    testo: |
      Sorella Giulia ti aspetta in fondo ai Giardini davanti al cespuglio più vecchio, quello che la sera si
      accende per primo. Ha i fusti grossi come un polso e la corteccia grigia e scanalata. Stamattina è
      spento in cima, con le foglie opache come carta, e i passeri che ci dormivano si sono spostati sulla
      siepe.

      «È una talea del vecchio Santuario» dice Giulia. «La notte dell'incendio Padre Vantes l'ha portata fuori
      in una tasca della tonaca. Adesso guarda qui.» Alla base dei fusti ci sono tagli sottili fatti con una
      lama piccola, e da ognuno è uscita la linfa. Sulla corteccia intorno ai tagli è rimasta una patina secca
      che brilla ancora appena.

      {origine mercante-dei-ponti} Sai quanto pagano la linfa del Velo gli speziali del Mercato dei Nodi, e
      prima di vergognartene fai il conto di quanto vale il cespuglio.

      Giulia non lo vuole dire a Ottilia. «Ottilia trova sempre il colpevole e lo punisce e basta» dice. «Io
      vorrei capire perché lo fa, e salvare la pianta.»

      Hai già le dita sui tagli, a misurarne la larghezza.
    opzioni:
      - testo: "Esaminare i tagli e la linfa"
        descrizione: "Una lama piccola, un taglio pulito. Dalle ferite di una pianta si capisce chi l'ha incisa, e per farne che cosa."
        prova: { attributo: mentale, abilita: [natura, medicina], difficolta: Media }
        successo:
          titolo: Un dito per notte
          testo: |
            Conti i tagli e li confronti. Sono ventidue, tutti della stessa larghezza, e accanto a ognuno la
            corteccia porta il segno di una fiala piccola appoggiata per raccogliere. I bordi dei tagli vecchi
            si sono chiusi in un orlo chiaro, e solo l'ultimo è ancora umido. Chi vende la linfa agli speziali
            la prende a mezzi barattoli, e dalle piante giovani, che ne danno di più. Questo ne prende un dito
            a notte, sempre dalla pianta più vecchia, che è anche la più vicina al dormitorio dei novizi.
          pe: { natura: 5 }
          segue: il-ladro-di-linfa
        fallimento:
          titolo: Gli speziali
          testo: |
            Ti convinci che dietro ci sia qualcuno che vende la linfa agli speziali del Mercato dei Nodi, e lo
            spieghi a Giulia con molta sicurezza, e anche con un certo gusto. Intanto conti sulle dita i
            barattoli che ci guadagnerebbe. Lei ti ascolta fino in fondo, poi ti fa notare che un ladro di
            linfa porterebbe via mezzo barattolo alla volta, mentre alla pianta vecchia ne manca sì e no un
            dito. Ti ringrazia lo stesso, e torna alla sua siepe a parlare con i passeri.
          effetti: { scandalo: 0.5 }

      - testo: "Seguire le gocce di luce"
        descrizione: "La linfa brilla anche quando cade. Chi la porta via di notte lascia una traccia, se si sa dove guardare."
        prova: { attributo: mentale, abilita: percezione, difficolta: Media }
        successo:
          titolo: Le gocce
          testo: |
            Aspetti la mattina presto, quando le piante dormono. Poi cammini piano per i vialetti e chino
            sulle pietre, con la schiena che si lamenta. Fra le pietre del sentiero ci sono gocce di linfa
            secca, piccole come capocchie di spillo, che all'ombra mandano ancora un filo di luce. Sono più
            fitte vicino al cespuglio dove la fiala era ancora aperta e si diradano più avanti. Partono dal
            cespuglio vecchio e attraversano il chiostro fino alla porta del dormitorio dei novizi, dove sotto
            lo stipite qualcuno ha provato a strofinarle via con la suola. Giulia ti raggiunge e guarda la
            porta senza dire niente.
          pe: { percezione: 5 }
          segue: il-ladro-di-linfa
        fallimento:
          titolo: Le foglie cadute
          testo: |
            Aspetti il crepuscolo e cerchi una traccia fra le pietre dei vialetti, ma a quell'ora i Giardini
            si accendono tutti insieme, e ogni foglia caduta brilla come la goccia che cercavi. Dopo un'ora ti
            fanno male gli occhi e vedi lucine anche a palpebre chiuse. Giulia ti porta l'infuso in una tazza
            di terracotta sbeccata e ti consiglia di riprovare la mattina presto, quando le piante dormono e
            la linfa caduta si vede meglio.
          effetti: { tormento: 0.5 }

      - testo: "Passare la notte dietro la siepe"
        descrizione: "Per stare svegli dietro una siepe non serve nessun talento. Serve una notte intera, e un mantello pesante."
        costo: 2
        esito:
          titolo: La notte dei passeri
          testo: |
            Ti siedi dietro la siepe dei passeri con il mantello sulle spalle e aspetti. Dopo il tramonto il
            cespuglio vecchio si accende per primo, e la cima resta scura. Verso mezzanotte la rugiada ti ha
            già bagnato il mantello. Poco prima del mattutino la porta del dormitorio si apre di uno
            spiraglio, e una sagoma piccola attraversa il chiostro in punta di piedi con una fiala in mano. Si
            inginocchia davanti al cespuglio vecchio e incide il fusto con un temperino, piano, come se avesse
            paura di fargli male.
          pe: { resilienza: 5 }
          segue: il-ladro-di-linfa

      - testo: "Leggere i tagli come al Circolo"
        descrizione: "Nel Bosco di Velthar si impara presto a riconoscere chi ha inciso una corteccia, e perché. Chi vende la linfa taglia in un altro modo."
        quando: [origine.figlio-del-circolo >= 1]
        prova: { attributo: mentale, abilita: natura, difficolta: Facile }
        successo:
          titolo: Un dito per notte
          testo: |
            Ti inginocchi accanto al cespuglio e misuri i tagli con il pollice. Sono corti e poco profondi, e
            ognuno ha dato appena un dito di linfa. Al Circolo ti hanno insegnato che chi vende la linfa
            taglia a fondo e torna di rado, mentre chi taglia così ne vuole poca e ogni notte. Nella terra
            molle sotto il cespuglio ci sono impronte di piedi piccoli e scalzi, che portano verso il
            dormitorio dei novizi. La punta è segnata più a fondo del tallone, perché chi le ha lasciate
            camminava in punta di piedi.
          pe: { natura: 5 }
          segue: il-ladro-di-linfa
        fallimento:
          titolo: La siepe
          testo: |
            Misuri i tagli con il pollice e li confronti con quelli che hai visto sulle cortecce del Bosco di
            Velthar, ma questa pianta viene dal vecchio Santuario e la sua linfa sotto le dita è più densa.
            Segui una fila di impronte fino alla siepe, dove finisce contro il muro del chiostro. Lì la terra
            è calpestata da troppi piedi e le impronte si confondono. Il passero di Giulia ti guarda dal ramo
            per tutto il tempo, e quando torni da lei con le mani vuote vola via.
          effetti: { tormento: 0.5 }

  - id: il-ladro-di-linfa
    immagine: personaggi/sorella-giulia
    titolo: Il ladro di linfa
    tipo: seguito
    luogo: Cattedrale del Velo, il chiostro dei novizi
    area: quartieri-alti
    requisiti: [fazione.velo == 0]
    testo: |
      Il ladro si chiama Lino. Ha quattordici anni e un velo corto da primo anno che gli scivola sempre su un
      orecchio. Giulia lo porta fuori dal dormitorio con una mano sulla spalla, e lui non prova nemmeno a
      scappare. Quando gli chiedi della linfa tira fuori da sotto la tunica una fiala mezza piena, che nel
      chiostro ancora buio manda una luce verdina. È una fiala da unguenti con il tappo di sughero, e il vetro
      è opaco di ditate. Anche i polpastrelli che la stringono sono tinti della stessa luce, quella che la
      linfa lascia sulla pelle e che non va via sfregando.

      «Io non la bevo e non la vendo» dice guardandosi i piedi. «La tengo sotto la coperta, la notte. Dalla
      razzia al buio non riesco più a dormire, e Ottilia nel dormitorio non vuole lumi. Gli altri dormono. Io
      sento ancora i corni degli orchi, e con la luce verde un po' meno.»

      {origine fuggiasco-di-ghoran} Le prime notti fuori da Ghoran dormivi con la schiena al muro. Il modo che
      ha trovato Lino per arrivare all'alba ti sembra più gentile del tuo.

      Giulia ti guarda sopra la testa del ragazzo. Senza averlo deciso ti sei accucciat{o|a} alla sua altezza,
      con un ginocchio sulle lastre del chiostro ancora fredde della notte.
    opzioni:
      - testo: "Chiedere a Giulia una pianta per lui"
        descrizione: "Una talea in un vaso fa la stessa luce di una fiala, e per averla non bisogna tagliare niente ogni notte."
        immagine: personaggi/sorella-giulia
        esito:
          titolo: Il vaso sul davanzale
          testo: |
            Giulia ci pensa il tempo di accarezzare un passero, poi va a prendere un vaso di coccio e un
            coltellino. Taglia una talea dal cespuglio vecchio, dalla parte ancora accesa, e la pianta nel
            vaso davanti a Lino, spiegandogli come si annaffia e quanto. Sul ramo il taglio butta una goccia
            che brilla e si rapprende subito, e Giulia ci preme sopra il pollice. «Così la luce te la fai da
            solo, e il cespuglio si riposa» dice. Lino tiene il vaso con tutte e due le mani, come un
            bicchiere troppo pieno.
          pe: { natura: 5 }
          imposta: { cattedrale.giardini: 1 }
          effetti: { rep.velo: 1, fazione.velo: 1 }

      - testo: "Parlare con Ottilia della regola dei lumi"
        descrizione: "Una regola si cambia soltanto con chi l'ha scritta. Ottilia ascolta tutti, e cambia idea di rado."
        immagine: personaggi/ottilia-sanvel
        prova: { attributo: sociale, abilita: [persuasione, empatia], difficolta: Media }
        successo:
          titolo: Lume del dormitorio
          testo: |
            Trovi Ottilia nel corridoio dopo l'esercizio dell'alba e le racconti dei corni e della fiala,
            senza fare il nome di Lino. Lei ascolta con le mani infilate nelle maniche. Quando hai finito ti
            chiede se sai quanti novizi sono arrivati dopo la razzia, e dalla tua faccia capisce la risposta.
            «Undici» dice. Il giorno dopo in fondo al dormitorio è appesa una lanterna schermata accesa al
            minimo, con lo sportello di latta socchiuso di un dito. Sulla cera della tavoletta dei lavori c'è
            una riga nuova con la sua grafia, *lume del dormitorio, a turno*.
          pe: { persuasione: 5 }
          imposta: { cattedrale.giardini: 1 }
          effetti: { rep.velo: 1, fazione.velo: 1 }
        fallimento:
          titolo: Il buio si impara
          testo: |
            Trovi Ottilia nel corridoio dopo l'esercizio dell'alba e le chiedi di permettere un lume nel
            dormitorio. Lei ti chiede perché, e tu, per non fare il nome di Lino, ti ingarbugli in una storia
            di candele e di ladri che non sta in piedi e che senti crollare mentre la racconti. Ottilia ti
            lascia arrivare in fondo senza aiutarti, con le mani infilate nelle maniche. «Il buio si impara
            come il resto, e in dormitorio non si accendono lumi» dice, e torna dai novizi. La sera Giulia
            mette in mano a Lino una talea in un vaso, di nascosto, perché almeno il cespuglio smetta di
            spegnersi.
          imposta: { cattedrale.giardini: 1 }
          effetti: { rep.velo: 0.5, fazione.velo: 1, scandalo: 0.5 }

      - testo: "Portare Lino da Ottilia"
        descrizione: "Un furto è un furto, anche di linfa. La disciplina dei novizi spetta a Ottilia, e Lino lo sa."
        immagine: personaggi/ottilia-sanvel
        esito:
          titolo: La disciplina
          testo: |
            Accompagni Lino da Ottilia, nel corridoio, con la fiala in mano. Lei lo ascolta senza
            interromperlo, poi prende la fiala e la vuota nel catino delle abluzioni. La linfa scende
            nell'acqua in un filo verde che si allarga sul fondo di pietra, e la luce si spegne in un attimo.
            Lino guarda l'acqua finché non torna scura. Per un mese spazzerà il chiostro prima dell'alba.
            Ottilia ti ringrazia con un cenno breve, e la sera dopo sulla tavoletta dei lavori il tuo nome
            compare in cima.
          pe: { galateo: 5 }
          imposta: { cattedrale.giardini: 1 }
          effetti: { rep.velo: 1, fazione.velo: 1 }

      - testo: "Raccontare a Lino delle tue notti da novizi{o|a}"
        descrizione: "Anche tu hai dormito in quel dormitorio senza lumi, e ricordi come si arrivava all'alba."
        quando: [origine.accolito-del-velo >= 1]
        esito:
          titolo: La Preghiera del Battito
          testo: |
            Ti siedi sul gradino del chiostro accanto a Lino e gli racconti del tuo primo inverno in
            dormitorio, quando contavi le travi del soffitto fino all'alba. Gli insegni il trucco dei novizi
            di allora, la Preghiera del Battito detta a mezza voce con due dita sul polso, finché il cuore va
            più piano delle parole. Lino la ripete due volte, e alla seconda le parole gli escono più lente.
            Poi ti consegna la fiala, e Giulia la versa ai piedi del cespuglio vecchio. La terra intorno alle
            radici resta accesa di verde fino a giorno fatto.
          pe: { empatia: 5 }
          imposta: { cattedrale.giardini: 1 }
          effetti: { rep.velo: 1, fazione.velo: 1 }

  # ------------------------------------------------------------ storia a 4 · gli archivi minori
  - id: gli-archivi-minori
    presso: cattedrale-del-velo
    immagine: personaggi/ottilia-sanvel
    titolo: Gli archivi minori
    sommario: "Ottilia Sanvel ha bisogno di qualcuno che ricopi le pagine salvate dal vecchio Santuario, prima che si sbriciolino."
    luogo: Cattedrale del Velo, gli archivi minori dietro il chiostro
    area: quartieri-alti
    requisiti: [fazione.velo == 3]
    testo: |
      Gli archivi minori stanno dietro il chiostro, in tre stanze basse che erano le cantine del vecchio
      Santuario. Le volte di mattoni si toccano alzando la mano, e l'unica luce viene da una finestra stretta
      in cima al muro, a filo del selciato del chiostro. Ogni scatola ha un cartellino nella grafia piccola e
      diritta di Ottilia Sanvel, tranne una in basso dove la grafia è più grande e più storta. Sul tavolo c'è
      una cassetta di latta annerita con il coperchio imbarcato dal calore, e quando Ottilia lo solleva senti
      l'odore del fumo di cinque anni fa.

      Dentro ci sono i registri del Santuario salvati a metà, con le pagine bruciate che si sfaldano. Verso il
      centro dei fogli il nero sfuma nel giallo della carta sana, e solo lì l'inchiostro si legge ancora. «La
      Madre ne vuole una copia pulita per la Cripta» dice Ottilia. «Le copie le fai qui. Gli originali non
      escono, e quello che leggi resta in questa stanza.» Ti porge un paio di guanti di cotone e una pinzetta
      d'osso. «Si comincia dall'ultimo registro, che è quello che si sbriciola prima.»

      {origine allievo-di-torvessa} Prendi la pinzetta fra pollice e medio, come all'Accademia si prendono i
      fogli preziosi, e Ottilia ti guarda le dita un momento più del necessario.

      Ti siedi e tiri verso di te la cassetta, mentre lei aspetta in piedi con le braccia incrociate nelle
      maniche.
    opzioni:
      - testo: "Ricopiare le pagine"
        descrizione: "Una riga alla volta, con la pinzetta d'osso e i guanti di cotone. Ottilia controlla ogni pagina prima di passarti la successiva."
        prova: { attributo: mentale, abilita: accademiche, difficolta: Media }
        successo:
          titolo: L'ultimo foglio
          testo: |
            Ricopi per tutto il pomeriggio, una riga alla volta, voltando i fogli con la pinzetta. Per lo più
            sono turni di guardia, firmati a ogni ora canonica da un sacerdote diverso, e ogni firma ha il suo
            inchiostro e la sua mano. Ottilia controlla ogni pagina in piedi e te ne passa un'altra. Verso
            sera hai il polso indolenzito e le punte dei guanti grigie di cenere. Arrivi all'ultimo foglio del
            registro, quello con i bordi più neri, e in cima, con una grafia che non conosci, c'è la data
            della notte dell'incendio.
          pe: { accademiche: 5 }
          segue: la-notte-del-santuario
        fallimento:
          titolo: Cenere
          testo: |
            Ricopi una pagina e mezza, poi volti un foglio con le dita invece che con la pinzetta, e un angolo
            ti resta in mano fatto di cenere. Sul cotone del guanto rimane una polvere grigia e leggera che si
            solleva appena respiri. Ottilia raccoglie l'angolo in un piattino e lo guarda in silenzio. «Per
            oggi basta» dice, e chiude la cassetta. La prossima volta, aggiunge, le dita le tieni in grembo
            finché non ti servono per scrivere.
          effetti: { tormento: 0.5 }

      - testo: "Leggere le pagine controluce"
        descrizione: "Dove l'inchiostro è bruciato restano i solchi del pennino. Contro la luce della finestra, a volte, si leggono ancora."
        prova: { attributo: mentale, abilita: percezione, difficolta: Media }
        successo:
          titolo: I solchi del pennino
          testo: |
            Prendi i fogli più bruciati uno alla volta con la pinzetta e li alzi contro la finestra. Dove
            l'inchiostro se n'è andato restano i solchi del pennino, più fondi nelle aste che negli occhielli,
            e se inclini il foglio di poco le lettere tornano fuori una per una. Ottilia smette di guardarti
            le mani e comincia a guardare le pagine, e scioglie le braccia dalle maniche. Ricostruisci tre
            fogli che lei credeva persi, e l'ultimo porta in cima la data della notte dell'incendio.
          pe: { percezione: 5 }
          segue: la-notte-del-santuario
        fallimento:
          titolo: Controluce
          testo: |
            Alzi i fogli contro la finestra e cerchi i solchi del pennino, ma la carta bruciata è troppo
            sottile e la luce ci passa attraverso senza mostrarti niente. Dopo un'ora hai il collo rigido a
            forza di tenere la testa piegata all'indietro, e hai ricostruito una parola sola, *candele*.
            Ottilia la annota in un quaderno senza commentare e ti dice di tornare quando avrai gli occhi più
            riposati. Sul tavolo restano i guanti di cotone, con le punte delle dita annerite.
          effetti: { tormento: 0.5 }

      - testo: "Aiutarla un'ora al giorno"
        descrizione: "Senza fretta, un foglio per volta, alla sua maniera. Ottilia non ha mai avuto fretta in vita sua."
        costo: 2
        esito:
          titolo: Un foglio al giorno
          testo: |
            Per una settimana torni ogni giorno alla stessa ora, e ogni giorno Ottilia ti dà un foglio solo.
            Lavori nella striscia di luce della finestra, che è l'unico punto della cantina dove l'inchiostro
            si distingue dalla carta bruciata. Lo ricopi con calma, poi lei lo controlla riga per riga con la
            punta della pinzetta e te lo toglie di mano. Il quinto giorno ti chiede da dove vieni. Il sesto ti
            racconta che da novizia copiava anche lei, in queste cantine, quando sopra c'era ancora il
            Santuario. Il settimo ti porge l'ultimo foglio del registro, quello con i bordi più neri, che
            porta la data della notte dell'incendio.
          pe: { resilienza: 5 }
          segue: la-notte-del-santuario

  - id: la-notte-del-santuario
    immagine: personaggi/ottilia-sanvel
    titolo: La notte del Santuario
    tipo: seguito
    luogo: Cattedrale del Velo, gli archivi minori
    area: quartieri-alti
    requisiti: [fazione.velo == 3]
    testo: |
      L'ultimo foglio è diviso in due colonne. A sinistra ci sono i sei sacerdoti di turno quella notte, con
      l'ora della firma. A destra c'è l'elenco di chi dormiva nel Santuario, rifugiati delle Notti Cucite e
      famiglie senza più una casa. Sono quarantuno righe, e quasi tutte hanno accanto una crocetta tracciata
      di fretta con un inchiostro più chiaro. Le firme dei sacerdoti si fermano alla compieta, e sotto una
      riga a matita è stata cancellata con tanta forza da strappare la carta. Lo strappo è lungo quanto un
      dito, e intorno la carta è lisciata e lucida, consumata a forza di passarci sopra.

      {percezione Media} Le sei firme della compieta hanno lo stesso inchiostro e la stessa pressione, come se
      fossero state messe tutte insieme. Nelle ore prima ogni firma ha il suo inchiostro, che cambia da un
      calamaio all'altro.

      Ottilia è dietro di te senza che tu l'abbia sentita. «Le crocette le ho fatte io. Stavo sulla porta del
      chiostro e contavo chi usciva» dice. «Allora avevo la grafia più grande.» Posa un dito guantato su tre
      righe senza crocetta e poi sui nomi di Idrian Sollen e di sua figlia, anche loro senza crocetta. «La
      riga cancellata diceva a che ora sono usciti i sacerdoti. Su questo foglio la Madre ha chiesto
      riservatezza, e io la rispetto.»

      {origine rampollo-dei-quartieri-alti} Nei salotti l'incendio del Santuario torna fuori a ogni
      anniversario come una disgrazia di cui nessuno ha colpa. Davanti a questo foglio quel modo di dirlo ti
      sembra molto ben educato.
    opzioni:
      - testo: "Chiederle di quella notte"
        descrizione: "Ottilia parla in frasi brevi e non ama i superlativi. Di quella notte, forse, parla lo stesso."
        esito:
          titolo: I nomi del mattino
          testo: |
            «Il fuoco è partito dall'ala nord, e il fumo è arrivato prima delle fiamme» dice Ottilia, e per
            tutto il tempo tiene le mani infilate nelle maniche. «La chiave della porta del chiostro ce
            l'avevo io, e sono rimasta lì. Ne ho contati trentasei. Cinque non sono usciti.» Ti dice i cinque
            nomi a memoria, senza guardare il foglio, con la stessa pausa dopo ognuno. Aggiunge che li ripete
            ogni mattina all'esercizio dell'alba, prima del primo movimento. «Sono scritti anche qui, ma la
            carta brucia. Così li tengo a mente io.»
          pe: { empatia: 5 }
          imposta: { cattedrale.archivio: 1 }
          effetti: { rep.velo: 1, fazione.velo: 1 }

      - testo: "Ricopiare il foglio com'è, riga strappata compresa"
        descrizione: "La copia pulita la vuole la Madre. Quello che c'è sul foglio va sulla copia, anche il segno della cancellatura."
        esito:
          titolo: Il rettangolo vuoto
          testo: |
            Ricopi il foglio crocetta per crocetta senza parlare, e dove c'è la riga cancellata disegni sulla
            copia un rettangolo vuoto della stessa misura, con lo strappo segnato a matita. Prima di
            tracciarlo misuri lo strappo due volte con il bordo di un cartellino. Ottilia guarda il rettangolo
            a lungo. Poi piega la copia in tre, la chiude con la cera del Velo e ci preme sopra il sigillo che
            porta alla cintura, tenendolo giù finché la cera non si rapprende. «Per la Madre» dice. Mentre
            esci la senti chiudere la porta degli archivi a chiave, cosa che di giorno non fa mai.
          pe: { accademiche: 5 }
          imposta: { cattedrale.archivio: 1 }
          effetti: { rep.velo: 1, fazione.velo: 1 }

      - testo: "Copiare di nascosto la colonna dei sacerdoti"
        descrizione: "Sei nomi con le loro ore. In città c'è chi li pagherebbe bene, e Ottilia adesso ti volta le spalle."
        prova: { attributo: fisico, abilita: furtivita, difficolta: Media }
        successo:
          titolo: Sei nomi
          testo: |
            Mentre Ottilia rimette in ordine la cassetta ricopi i sei nomi in fondo al tuo quaderno, fra due
            conti della spesa, con l'ora accanto a ognuno. Quando si volta stai scrivendo la data in cima alla
            copia pulita. Più tardi, sotto un lampione dei Quartieri Alti, rileggi la pagina. La grafia ti è
            venuta piccola e storta, e le ore si leggono appena. Due di quei nomi li hai già sentiti in
            Cattedrale, durante le funzioni solenni. Richiudi il quaderno in fretta, e ti accorgi di esserti
            voltat{o|a} a guardare se qualcuno ti segue.
          imposta: { cattedrale.archivio: 1, velo.copia: 1 }
          effetti: { rep.velo: 1, informazioni.segreto: 1, fazione.velo: 1 }
        fallimento:
          titolo: La pagina strappata
          testo: |
            Ricopi i sei nomi in fondo al tuo quaderno mentre Ottilia rimette in ordine la cassetta, ma lei si
            volta prima che tu abbia finito. Ti tende la mano senza dire niente, e tu le dai il quaderno, con
            le orecchie che ti scottano. Strappa la pagina con cura, tenendo il quaderno fermo sul tavolo con
            il palmo, e la ripone nella cassetta, sopra il foglio bruciato. Lo strappo è netto e segue la
            cucitura. «Te l'avevo detto, quello che leggi resta qui» dice, e ti rende il quaderno.
          imposta: { cattedrale.archivio: 1 }
          effetti: { rep.velo: 0.5, scandalo: 1, fazione.velo: 1 }

      - testo: "Chiederle di Aurenne"
        descrizione: "Sul foglio la figlia del cappellano non ha la crocetta. Tu sai che dalle rovine è tornata viva."
        immagine: personaggi/aurenne
        quando: [pista.capomozzo >= 7]
        costo: 0
        esito:
          titolo: Una crocetta da mettere
          testo: |
            Ottilia resta a guardare il nome. «Quella notte non l'ho vista uscire, e dentro non l'avevo vista
            nemmeno prima» dice. «Per cinque anni è stata una riga senza crocetta, e la mattina la ripetevo
            con gli altri quattro nomi.» Si toglie un guanto e passa il pollice sulla carta accanto al nome,
            senza toccarlo. In quel punto la carta è più liscia del resto del foglio, consumata da un dito che
            ci è passato sopra molte volte. «Adesso la crocetta non so dove metterla.» Rimette il guanto, e
            per un po' non aggiunge altro.
          segue: la-notte-del-santuario

  # ------------------------------------------------------------ storia a 6 · il voto del Velo
  - id: il-voto-del-velo
    presso: cattedrale-del-velo
    immagine: personaggi/padre-vantes
    titolo: Il voto del Velo
    sommario: "Dopo la compieta Padre Vantes ti trattiene sulla prima panca. Ha una cosa da chiederti, e prima di chiederla ti prende il polso."
    luogo: Cattedrale del Velo, la navata, dopo la compieta
    area: quartieri-alti
    requisiti: [fazione.velo == 5]
    testo: |
      Dopo la compieta gli accoliti spengono le candele della navata partendo dall'ingresso, e la navata si fa
      buia una fila di panche alla volta. Padre Vantes ti trattiene con due dita sul polso e ti fa sedere
      sulla prima panca, quella dei consiglieri, che ha il legno dello schienale lucido dove si appoggiano le
      spalle. Il cristallo rosso pulsa piano, e a ogni battito la luce arriva fino alle vostre ginocchia e poi
      si ritira.

      «Il Velo ha i suoi chierici e i suoi monaci, e poi ha quelli come te che ci aiutano senza tonaca» dice
      Vantes. «A volte a uno di loro chiediamo di più. Un laico consacrato fa il suo voto di notte davanti
      all'altare, e da allora la Cripta per lui è aperta. In cambio, quando il Velo ha bisogno, lo chiama per
      nome.»

      Per la prima volta da quando lo conosci ti sembra in imbarazzo, e per dirlo guarda il cristallo invece
      di te. «La Madre è d'accordo. Il tuo nome l'ha fatto lei.»

      {origine accolito-del-velo} Da accolito ti hanno insegnato a non chiedere che cosa c'è sotto l'altare, e
      adesso Vantes ti offre la scala per scendere a vederlo.
    opzioni:
      - testo: "Chiedere che cosa si promette"
        descrizione: "Un voto è fatto di parole. Prima di dirle, conviene saperle."
        costo: 0
        esito:
          titolo: La vita che resta
          testo: |
            «Si promette di servire la vita che resta» dice Vantes, e si tocca il sigillo del Velo che porta
            al collo, l'unico ornamento che gli hai mai visto, consumato sul bordo dalle dita. Le altre due
            dita restano sul tuo polso, leggere. «Come servirla lo decidi tu giorno per giorno, e decidi tu se
            restare in città o partire. Il Velo chiede di sapere dove sei, e di poterti chiamare. Il resto lo
            chiede la tua coscienza, e a lei rispondi da sol{o|a}.»

      - testo: "Chiedere chi ci sarà"
        descrizione: "Un rito di notte, davanti al cristallo. Qualcuno lo deve pur vedere."
        quando: [pista.capomozzo < 9]
        costo: 0
        esito:
          titolo: Tre testimoni
          testo: |
            «Io, che dico le parole prima di te» dice Vantes, e conta sulle dita. «Ottilia, che scrive il tuo
            nome nel registro dei laici, e lo scrive soltanto se ha visto con i suoi occhi.» Esita sul terzo
            dito, che tiene piegato un momento più degli altri. «E Sorella Celia con il liuto, perché me l'ha
            chiesto, e io a Celia dico di no di rado.» Ti lascia il polso. «La Madre resta nella Cripta, ma
            lascia aperta la scala, e da laggiù sente tutto.» Dietro l'altare la bocca della scala è un
            rettangolo nero, e la luce del cristallo non ci arriva.

      - testo: "Chiedere chi ci sarà"
        descrizione: "Un rito di notte, davanti al cristallo. Qualcuno lo deve pur vedere."
        quando: [pista.capomozzo >= 9]
        immagine: personaggi/aurenne
        costo: 0
        esito:
          titolo: Quattro testimoni
          testo: |
            «Ci saremo io e Ottilia, con Sorella Celia che porta il liuto» dice Vantes, e dopo una pausa
            aggiunge che ci sarà anche Aurenne. «Me l'ha chiesto lei ieri sera, ed è la prima cosa che chiede
            da quando è sveglia. Dice che al Santuario, da bambina, i voti li guardava di nascosto dal
            matroneo, e che stavolta ne vorrebbe vedere uno da vicino.» Ti stringe il polso per un momento con
            le dita asciutte e fredde. «Se preferisci di no, glielo dico io» dice, e te lo lascia andare.

      - testo: "Dirgli dell'argano"
        descrizione: "Ferro ti aspetta sull'orlo della Cicatrice. Un voto che ti tiene in città arriva tardi."
        quando: [pista.capomozzo >= 10]
        costo: 0
        esito:
          titolo: La garitta
          testo: |
            «Lo so» dice Vantes. «Il custode della garitta sopra i piloni è uno dei nostri, e mi ha detto chi
            è sceso a provare l'argano.» Ti tiene il polso un po' più a lungo del solito, e senti le due dita
            premere dove batte il sangue. «Anche col voto puoi andare dove vuoi, {figliolo|figliola}. Il Velo
            veglia anche sulle strade che scendono, e laggiù uno dei nostri ci serve più che quassù. Quando
            torni, la Cripta è ancora aperta.»

      - testo: "Accettare"
        descrizione: "Stanotte, all'ultima ora, davanti al cristallo rosso. Si veglia fino al mattutino."
        quando: [rep.scuri < 4]
        esito:
          titolo: Stanotte
          testo: |
            Vantes annuisce piano, e per un momento le dita sul tuo polso stringono un po' di più. «Allora
            stanotte» dice. «Torna quando suona l'ultima ora, e non portare niente. Le armi le lasci al
            portone, come tutti.» Si alza e va verso la sagrestia, e lungo la strada accende una candela per
            ogni panca con lo stoppino di quella prima. Lo fa al contrario degli accoliti, che le hanno appena
            spente e adesso lo guardano dal fondo con il moccolo in mano.
          segue: la-veglia-del-voto

      - testo: "Accettare"
        descrizione: "Stanotte, all'ultima ora, davanti al cristallo rosso. Si veglia fino al mattutino."
        quando: [rep.scuri >= 4, pista.pelle >= 6]
        esito:
          titolo: Stanotte
          testo: |
            Vantes annuisce piano, e per un momento le dita sul tuo polso stringono un po' di più. «Allora
            stanotte» dice. «Torna quando suona l'ultima ora, e non portare niente. Le armi le lasci al
            portone, come tutti.» Si alza e va verso la sagrestia, e lungo la strada accende una candela per
            ogni panca con lo stoppino di quella prima. Lo fa al contrario degli accoliti, che le hanno appena
            spente e adesso lo guardano dal fondo con il moccolo in mano.
          segue: la-veglia-del-voto

      - testo: "Promettere di chiudere con gli Scuri"
        descrizione: "Vantes sa a chi porti i saluti in Via dei Rasoi. Un laico consacrato, dice, non può avere due padroni in Città Bassa."
        quando: [rep.scuri >= 4, pista.pelle < 6]
        esito:
          titolo: Due padroni
          testo: |
            Ti dice che in Via dei Rasoi il tuo nome lo conoscono, e che un laico consacrato non può portare i
            saluti del Velo e quelli di Mirko Vesh nella stessa tasca. Lo dice senza alzare la voce, con le
            due dita ferme sul tuo polso. Glielo prometti, e lui ti tiene il polso finché non lo hai detto
            tutto. Il giorno dopo, in Via dei Rasoi, la voce gira prima di te, e un ragazzo che ti salutava
            ogni mattina guarda dall'altra parte.
          effetti: { rep.scuri: -2 }
          segue: la-veglia-del-voto

      - testo: "Rifiutare con garbo"
        descrizione: "È un onore, e un impegno. Per adesso preferisci restare uno che aiuta senza promettere."
        costo: 0
        esito:
          titolo: La prima panca
          testo: |
            Gli dici che ti fa onore, e che per adesso preferisci aiutare senza promettere. Vantes ti ascolta
            con le dita sul tuo polso e alla fine le ritira. «Non c'è nessuna fretta, {figliolo|figliola}»
            dice. «Se cambi idea sai dove trovarmi.» Ti accompagna al portone con una candela in mano,
            riparandola dalla corrente con il palmo, e la fiamma gli fa i bordi delle dita rossi e
            trasparenti. Sulla soglia ti benedice come ogni sera, senza aggiungere altro.

  - id: la-veglia-del-voto
    immagine: ambientazione/cattedrale-del-velo
    titolo: La veglia del voto
    tipo: seguito
    luogo: Cattedrale del Velo, l'altare, di notte
    area: quartieri-alti
    requisiti: [fazione.velo == 5]
    testo: |
      Quando suona l'ultima ora torni in Cattedrale. Restano accese soltanto le candele dell'altare e una
      lanterna in fondo, dove Ottilia Sanvel aspetta con un registro sotto il braccio. Su una panca laterale
      Sorella Celia tiene il liuto sulle ginocchia. Padre Vantes ti fa inginocchiare sul gradino più basso
      davanti al cristallo rosso e ti mette in mano una candela spenta. La pietra del gradino è consumata in
      due conche poco profonde, alla distanza giusta per due ginocchia, e le tue ci entrano da sole.

      «Si veglia fino al mattutino» dice. «Quando il cristallo batte l'ora accendi la candela alla sua luce e
      dici il voto. Se ti addormenti prima si ricomincia un'altra notte, e nessuno te ne farà una colpa.»

      Il cristallo pulsa a intervalli lunghi, e ogni volta la luce rossa ti scorre sulle mani. Dalla scala
      della Cripta sale un filo d'aria fredda che odora di rame, e capisci che il passaggio è aperto. Le
      fiamme dell'altare si piegano tutte dalla parte opposta alla scala. Ti dici che laggiù la roccia è
      sempre fredda e umida, e che la pietra bagnata ha spesso quell'odore. Quando sposti un ginocchio il
      fruscio della stoffa torna indietro dalle volte, e dalla parte della scala invece non torna niente.

      Accanto a te Vantes comincia a pregare sottovoce.
    opzioni:
      - testo: "Vegliare fino al mattutino"
        descrizione: "Quattro ore in ginocchio sulla pietra, senza chiudere gli occhi, con il battito del cristallo davanti."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Media }
        successo:
          titolo: Il mattutino
          testo: |
            Quando il cristallo batte il mattutino accosti lo stoppino alla pietra, che è calda come una
            brace, e la candela si accende. Dici il voto con le parole che ti ha dato Vantes, servire la vita
            che resta, e dalla scala della Cripta una voce bassa ripete l'ultima parola con un attimo di
            ritardo. Celia suona un accordo solo. Ottilia scrive in piedi il tuo nome nel registro dei laici,
            e Vantes ti aiuta ad alzarti tenendoti il polso. Dopo quattro ore sulla pietra hai le ginocchia
            così rigide che da sol{o|a} non ce la faresti. La mattina dopo, sul portale, Padre Walter ti
            aspetta con le mani infilate nelle maniche del saio. I consacrati, ti dice, fanno la prima notte
            di garitta con lui.
          pe: { resilienza: 5 }
          imposta: { cattedrale.voto: 1 }
          effetti: { rep.velo: 1, fazione.velo: 1, oggetto.velo-sigillo-del-velo: 1 }
          almeno: { rep.velo: 4 }
        fallimento:
          titolo: L'alba sul gradino
          testo: |
            Verso la terza ora il battito del cristallo comincia a cullarti, e ti svegli con la guancia sul
            gradino e la candela rotolata via. Dalle vetrate entra la luce grigia dell'alba, e dalla scala
            della Cripta non sale più l'aria fredda. Vantes è ancora in ginocchio accanto a te e ha continuato
            a pregare per tutti e due, con la voce ormai ridotta a un soffio. «Succede a molti» dice,
            raccogliendo la candela. «Si ricomincia un'altra notte, come ti avevo detto.» Ottilia chiude il
            registro senza scriverci niente.
          effetti: { tormento: 0.5 }

      - testo: "Pregare con Vantes per restare sveglio"
        descrizione: "La sua voce non si ferma mai. Se le vai dietro, parola per parola, la notte passa più in fretta."
        costo: 2
        esito:
          titolo: La voce di Vantes
          testo: |
            Vai dietro alla preghiera di Vantes parola per parola, e quando non la conosci ripeti l'ultima
            frase finché lui non la cambia. Verso la terza ora la sua voce si è fatta roca, e il passo delle
            parole resta quello dell'inizio. Quando il cristallo batte il mattutino accosti lo stoppino alla
            pietra calda, e la candela si accende. Dici il voto, servire la vita che resta, e dalla scala
            della Cripta una voce bassa ripete l'ultima parola con un attimo di ritardo. Ottilia scrive il tuo
            nome nel registro, e Celia suona un accordo solo. La mattina dopo, sul portale, Padre Walter ti
            aspetta per dirti che i consacrati fanno la prima notte di garitta con lui.
          pe: { galateo: 5 }
          imposta: { cattedrale.voto: 1 }
          effetti: { rep.velo: 1, fazione.velo: 1, oggetto.velo-sigillo-del-velo: 1 }
          almeno: { rep.velo: 4 }

      - testo: "Vegliare con Aurenne accanto"
        descrizione: "Dalla sala di preghiera più interna arriva Aurenne, e si inginocchia sul gradino accanto al tuo senza chiedere permesso."
        immagine: personaggi/aurenne
        quando: [pista.capomozzo >= 9]
        esito:
          titolo: Il gradino accanto
          testo: |
            Aurenne si inginocchia accanto a te, con l'artiglio appoggiato sulla coscia. A ogni battito la
            luce del cristallo le scorre sull'artiglio come sulle tue mani. Alla terza ora, quando ti cade la
            testa, ti tocca la spalla con la mano buona. Al mattutino ti regge il polso mentre accosti lo
            stoppino alla pietra calda. Dici il voto, e lei lo dice con te nelle parole del vecchio Santuario,
            mezza sillaba avanti. Ottilia scrive il tuo nome nel registro e, dopo un momento, nella riga
            sotto, quello di Aurenne come testimone. La mattina dopo, sul portale, Padre Walter ti aspetta per
            dirti che i consacrati fanno la prima notte di garitta con lui.
          pe: { empatia: 5 }
          imposta: { cattedrale.voto: 1 }
          effetti: { rep.velo: 1, fazione.velo: 1, oggetto.velo-sigillo-del-velo: 1 }
          almeno: { rep.velo: 4 }

      - testo: "Alzarti prima dell'ora"
        descrizione: "Forse non è la notte giusta. Vantes lo ha detto, si può ricominciare."
        costo: 0
        esito:
          titolo: Un'altra notte
          testo: |
            Ti alzi dal gradino prima del mattutino e posi la candela spenta sull'altare. Le ginocchia ti
            ringraziano, e per i primi passi le senti scricchiolare. Vantes smette di pregare e ti guarda
            senza rimprovero. «Un'altra notte, allora» dice, e ti posa due dita sul polso. Celia ripone il
            liuto nella custodia, Ottilia chiude il registro, e nessuno dei tre ti chiede perché. Fuori la
            notte è ancora fonda, e mentre scendi la scalinata senti il portone che si richiude piano alle tue
            spalle.

  # ------------------------------------------------------------ la carta
  - id: carta-le-campane-del-velo
    immagine: fazioni/confraternita-del-velo
    titolo: Le campane del Velo
    sommario: "Per strada passa una processione del Velo, e in coda un novizio ha perso il batacchio della campanella."
    luogo: Quartieri Alti, la strada che scende dalla Cattedrale
    tipo: carta
    area: quartieri-alti
    requisiti: [rep.velo < 2]
    testo: |
      Le campane della Cattedrale suonano a lutto, e scende una processione del Velo per i morti della razzia.
      In coda un novizio di dodici anni agita una campanella d'ottone che da un po' non suona più, e dalla
      bocca rovesciata si vede che dentro è vuota.

      Il batacchio gli è scappato ed è rotolato sotto una carrozza ferma all'angolo con i cavalli che
      sbuffano. Il novizio guarda la carrozza e la processione che si allontana. A cassetta il cocchiere
      sbuccia una mela con un coltellino e fa finta di niente. La buccia gli scende dalla lama in una spirale
      sola che arriva fino al ginocchio.

      {origine figlio-della-citta-bassa} Da ragazz{o|a}, in Città Bassa, strisciavi sotto i carri per
      raccogliere quello che cadeva dai sacchi. C'erano cocchieri che ti tiravano un calcio e cocchieri che
      facevano finta di non vederti, e questo con la sua mela è dei secondi.

      Ti ritrovi ferm{o|a} sul bordo della strada con le mani già fuori dalle tasche.
    opzioni:
      - testo: "Recuperare il batacchio"
        descrizione: "Bisogna infilarsi sotto la carrozza, fra le ruote, mentre i cavalli sbuffano."
        esito:
          titolo: Sotto la carrozza
          testo: |
            Ti infili a carponi fra le ruote della carrozza, e il cocchiere si sporge a guardarti con la mela
            a mezz'aria. Il batacchio è finito in una pozzanghera accanto alla ruota di dietro. È un ferro a
            pera lungo un pollice, e l'occhiello in cima si è consumato fino a diventare un filo.

            Il novizio lo riaggancia da solo, con le dita che tremano, e corre dietro alla processione
            suonando più forte di prima. In fondo alla strada il sacerdote si volta verso il ragazzo e poi
            verso di te, e ti fa un cenno con il libro.
          effetti: { rep.velo: 0.5 }
      - testo: "Chiedere al cocchiere di spostarsi"
        descrizione: "Basta un passo di cavalli, e il batacchio è libero. Il cocchiere va soltanto convinto."
        prova: { attributo: sociale, abilita: [persuasione, intimidire], difficolta: Facile }
        successo:
          titolo: Un passo di cavalli
          testo: |
            Ti pianti accanto alle ruote e spieghi al cocchiere che la carrozza è ferma sopra un oggetto
            sacro, cosa vera in un certo senso. Lui guarda te e poi la processione, e alla fine schiocca la
            lingua. I cavalli fanno un passo avanti, e il cerchione di ferro della ruota scricchiola sul
            selciato. Il novizio si tuffa sul batacchio e corre via suonando, prima ancora di averlo
            riagganciato bene. Dalla processione un sacerdote si volta e ti fa un cenno con il libro aperto.
          effetti: { rep.velo: 0.5 }
        fallimento:
          titolo: La mela
          testo: |
            Il cocchiere ti ascolta fino in fondo, masticando, poi ti dice che la carrozza è del suo padrone e
            che lui da lì non si muove finché il padrone non esce. Mentre discutete il novizio si arrende. Si
            infila la campanella muta sotto il braccio e corre dietro alla processione. Il cocchiere torna
            alla sua mela e alla buccia, che gli pende ancora dal coltellino. Poco dopo, dalla piazza in
            fondo, arriva un suono storto di campanella, battuta con qualcosa che non è il suo batacchio.
          effetti: { scandalo: 0.5 }
      - testo: "Proseguire per la tua strada"
        descrizione: "I novizi del Velo hanno i loro maestri, e tu hai i tuoi affari."
        costo: 0
        esito:
          testo: |
            Prosegui per la tua strada. All'angolo ti volti, e il novizio è ancora lì con la campanella muta
            in mano, mentre la processione è già in fondo alla discesa. Il cocchiere ha finito la mela e ne
            butta il torsolo sotto la carrozza, accanto al batacchio. Quando arrivi in piazza le campane della
            Cattedrale hanno smesso di suonare a lutto, e tu ti accorgi di avere ancora le mani strette nelle
            tasche, con le unghie piantate nel palmo.
