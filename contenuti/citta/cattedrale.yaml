# La città viva, luogo 2: la Cattedrale del Velo (presso: cattedrale-del-velo, area quartieri-alti).
# L'attività delle ore, le tre storie della Confraternita e la carta della processione. Il servizio (purificazione,
# navata silenziosa, la Liturgia dell'Albero alla scuola dei novizi) sta già in contenuti/aree/quartieri-alti.yaml.
# Dall'ottobre 2026 le tre storie sono passi della quest di fazione del Velo (contenuti/fazioni/velo/): i Giardini
# della Linfa con Lino sono il passo 1 (fazione.velo == 0), gli archivi minori con la notte del Santuario il passo 4
# (== 3), il voto con la veglia il passo 6 (== 5, grado 2). I flag di prima (cattedrale.giardini, archivio, voto)
# restano, perché altre scene li leggono. Le Ore del Velo hanno in più il turno di garitta (grado 3, reputazione fino
# a 8) e il servizio della Cripta (grado 4, fino a 10).
# Reputazione: è quella della Confraternita (rep.velo). I Giardini e le ore la fanno salire fino a 4, l'alba
# con Ottilia e la linfa di notte fino a 6, la garitta fino a 8 e la Cripta fino a 10.
# Aurenne è sveglia e vive in Cattedrale da pista.capomozzo >= 9 (si risveglia nel passo 8 → 9).
storylet:
  # ------------------------------------------------------------ l'attività ripetibile
  - id: le-ore-del-velo
    presso: cattedrale-del-velo
    immagine: ambientazione/cattedrale-del-velo
    titolo: Le ore del Velo
    sommario: "Ogni mattina Ottilia Sanvel scrive i lavori della Cattedrale su una tavoletta accanto alla sagrestia."
    luogo: Cattedrale del Velo, la navata e il chiostro
    area: quartieri-alti
    ripetibile: true
    testo: |
      In Cattedrale le giornate le misura il cristallo rosso sull'altare, che
      pulsa più forte a ogni ora canonica. Ottilia Sanvel scrive ogni mattina
      i lavori del giorno su una tavoletta di cera, e la sera Sorella Arva
      conta la paga dei laici e a ognuno, per carità, propone un prestito a
      interesse.

      {origine accolito-del-velo} La grafia piccola e diritta di Ottilia per
      anni ti ha detto dove dovevi essere all'alba.

      Sotto la tavoletta lo straccio della cera è piegato sopra un plettro
      d'osso dimenticato. *Prima Celia, poi Ottilia.* Ti viene da sorridere, e
      lo nascondi in fretta.
    opzioni:
      - testo: "Lavorare nei Giardini della Linfa"
        descrizione: "Sorella Giulia ha sempre bisogno di mani che distinguano una foglia sana da una malata, senza fretta."
        immagine: personaggi/sorella-giulia
        quando: [pista.capomozzo < 9]
        requisiti: [rep.velo < 4]
        prova: { attributo: mentale, abilita: [natura, medicina], difficolta: Media }
        successo:
          titolo: Le foglie buone
          testo: |
            Passi il pomeriggio fra le aiuole a togliere le foglie arrugginite, e
            la sera Sorella Arva ti conta qualche moneta sul palmo.

            {origine figlio-del-circolo} Sorella Giulia parla al passero che tiene
            sul pollice con le pause lunghe che al Circolo si usano per le bestie
            che non si fidano, e ti accorgi che le stai rispondendo con le stesse
            pause.
          effetti: { monete: 2, rep.velo: 0.5 }
        fallimento:
          titolo: La ruggine di sotto
          testo: |
            Togli le foglie arrugginite con impegno, e insieme a loro una manciata
            di germogli nuovi che sembravano malati. Sorella Giulia li ripianta
            uno per uno senza una parola di rimprovero, il che è peggio, e ti
            manda a casa con un germoglio in un vaso, per esercitarti.

      - testo: "Lavorare nei Giardini della Linfa"
        descrizione: "Al tramonto Aurenne annaffia le aiuole con la mano buona, tenendo l'artiglio dietro la schiena."
        immagine: personaggi/aurenne
        quando: [pista.capomozzo >= 9]
        requisiti: [rep.velo < 4]
        prova: { attributo: mentale, abilita: [natura, medicina], difficolta: Media }
        successo:
          titolo: I passeri
          testo: |
            Lavori fra le aiuole fino al tramonto, quando arriva Aurenne con
            l'annaffiatoio nella mano buona e l'artiglio dietro la schiena. I
            passeri, che di solito si posano dappertutto, intorno a lei lasciano
            un cerchio vuoto. Aurenne tace per tutto il tempo, e a fine giro ti
            indica con il mento una foglia arrugginita che ti era sfuggita.
            All'uscita Sorella Arva ti conta la paga.
          effetti: { monete: 2, rep.velo: 0.5 }
        fallimento:
          titolo: La foglia rovesciata
          testo: |
            Strappi le foglie arrugginite insieme a qualche germoglio sano, e
            Sorella Giulia si china a ripiantarli con un sospiro. Aurenne posa
            l'annaffiatoio e, senza una parola, ti mostra con la mano buona come
            si gira una foglia per guardarla di sotto.

      - testo: "Servire alle ore canoniche"
        descrizione: "Reggere il turibolo e rispondere ai salmi al momento giusto, davanti a Padre Vantes, che non perde un gesto."
        immagine: personaggi/padre-vantes
        quando: [pista.capomozzo < 9]
        requisiti: [rep.velo < 4]
        prova: { attributo: sociale, abilita: [galateo, resilienza], difficolta: Media }
        successo:
          titolo: Il turibolo
          testo: |
            Reggi il turibolo per tutta l'ora di terza, un passo dietro Padre
            Vantes, e rispondi ai salmi un attimo dopo i novizi. Quando il
            cristallo pulsa ti inginocchi con gli altri senza che nessuno debba
            tirarti la manica. Alla fine Vantes ti posa due dita sul polso, e
            Sorella Arva ti conta uno spicciolo sul palmo come se fosse un
            sacrificio personale.
          effetti: { monete: 1, rep.velo: 0.5 }
        fallimento:
          titolo: Il fumo negli occhi
          testo: |
            A metà dell'ora il fumo del turibolo ti sale negli occhi, e rispondi a
            un salmo con le parole di quello prima mentre due novizi si mordono le
            labbra. Alla fine Padre Vantes ti posa lo stesso due dita sul polso e
            ti dice che la terza, la prima volta, la sbagliano tutti.

      - testo: "Servire alle ore canoniche"
        descrizione: "A compieta Aurenne prega da sola sull'ultima panca, e i salmi li sa meglio dei novizi."
        immagine: personaggi/aurenne
        quando: [pista.capomozzo >= 9]
        requisiti: [rep.velo < 4]
        prova: { attributo: sociale, abilita: [galateo, resilienza], difficolta: Media }
        successo:
          titolo: Le risposte vecchie
          testo: |
            Servi la compieta con il turibolo dietro Padre Vantes, e dall'ultima
            panca Aurenne risponde ai salmi a voce bassa, con le parole più
            antiche del vecchio Santuario. Vantes non la corregge, perché le sa
            anche lui, e per un momento le sue labbra le seguono. All'uscita
            Sorella Arva ti conta uno spicciolo.
          effetti: { monete: 1, rep.velo: 0.5 }
        fallimento:
          titolo: Fuori tempo
          testo: |
            Dall'ultima panca Aurenne risponde ai salmi con le parole del vecchio
            Santuario, e tu vai dietro a lei invece che ai novizi, finché ti
            ritrovi a dire da solo una risposta che nessuno usa più. Aurenne alza
            la testa e ti guarda, poi risponde con le parole nuove, piano, perché
            tu possa seguirla.

      - testo: "Copiare per gli archivi minori"
        descrizione: "Dei registri vecchi degli archivi minori servono copie pulite, pagate a pagina a chi ha una bella grafia."
        immagine: personaggi/ottilia-sanvel
        prova: { attributo: mentale, abilita: accademiche, difficolta: Facile }
        successo:
          titolo: Trenta pagine
          testo: |
            Ottilia ti fa sedere nel chiostro con un registro di battesimi del
            centotrenta e un quaderno nuovo, e ricopi fino a sera con la lingua
            che ti spunta fra i denti come a uno scolaro. Quando torna lo sfoglia
            in piedi e trova una sola svista, che ti indica con l'unghia. Sorella
            Arva ti paga a pagine copiate, e arrotonda per difetto.
          effetti: { monete: 3 }
        fallimento:
          titolo: La riga saltata
          testo: |
            A metà pomeriggio salti una riga senza accorgertene, e da lì in poi
            ogni nome finisce accanto alla data del bambino dopo. Ottilia se ne
            accorge alla prima occhiata, senza alzare la voce. La copia la rifarà
            un novizio, e Sorella Arva ti conta appena il prezzo della carta.
          effetti: { monete: 1 }

      - testo: "Assistere i ricoverati"
        descrizione: "Nell'infermeria della navata nord Nadja Oresca cerca chi cambi le bende e ascolti chi ha voglia di parlare."
        immagine: personaggi/nadja-oresca
        prova: { attributo: mentale, abilita: [medicina, empatia], difficolta: Media }
        successo:
          titolo: L'infuso all'aceto
          testo: |
            Passi la mattina fra le brande con Nadja Oresca, che ha un proverbio
            in lingua antica per ogni ferita. Una vecchia non vuole bere l'infuso
            perché sa di aceto, e alla fine lo beve a patto che lo assaggi prima
            tu, convinta dalla tua smorfia più che da ogni discorso. Sorella Arva
            ti conta qualche moneta.
          effetti: { monete: 2 }
        fallimento:
          titolo: Il dialetto dei Ponti
          testo: |
            Cambi le bende a un muratore caduto da un'impalcatura e stringi troppo
            sopra il gomito, e lui ti dice quello che pensa di te in un dialetto
            dei Ponti che non conoscevi. Nadja Oresca rifà la fasciatura in un
            attimo e ti manda a vuotare i catini, e quando ripassi il muratore ti
            saluta con la mano buona.

      - testo: "Accendere le candele della navata"
        descrizione: "Ogni sera qualcuno accende le candele della navata dall'ingresso all'altare, e stasera tocca a te."
        esito:
          titolo: Le candele di sinistra
          testo: |
            Accendi le candele con un lungo stoppino partendo dall'ingresso,
            mentre Sorella Celia accorda il liuto su una panca laterale e ti
            ricorda che quelle di sinistra vanno prima, per una ragione che
            nemmeno lei ricorda. Quando arrivi all'altare il cristallo pulsa, e
            nell'aria ferma della navata la fiamma più vicina si piega appena
            nella sua direzione.
          pe: { resilienza: 2 }

      - testo: "Esercitarti all'alba con i novizi"
        descrizione: "All'alba Ottilia fa esercitare i novizi sotto il chiostro, e chi conosce il Velo guida la fila senza sbagliare."
        immagine: personaggi/ottilia-sanvel
        requisiti: [rep.velo >= 4, rep.velo < 6]
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Media }
        successo:
          titolo: In testa alla fila
          testo: |
            Ti metti in testa alla fila e segui la sequenza di Ottilia dal primo
            movimento all'ultimo, con sedici novizi che tengono il tempo con te.
            Alla fine lei prende un bastone dalla rastrelliera e ti fa ripetere
            l'ultimo movimento contro di lei, ogni volta più svelto. Lo pari due
            volte. «Può bastare» dice, e in bocca sua è un elogio. Sorella Arva ti
            conta il dovuto.
          effetti: { monete: 3, rep.velo: 0.5 }
        fallimento:
          titolo: Il bastone
          testo: |
            Al decimo movimento perdi il conto, e con te lo perdono i sedici
            novizi che ti guardano la schiena. Ottilia prende un bastone dalla
            rastrelliera e ti fa ripetere il movimento contro di lei, finché alla
            terza volta ti ritrovi seduto sulla pietra. Ti tende la mano per
            rialzarti e ti rimanda in fondo alla fila.
          effetti: { ferite: 0.5 }

      - testo: "Raccogliere la linfa di notte"
        descrizione: "La linfa per gli unguenti si raccoglie di notte, e Giulia la affida soltanto a mani che conosce."
        immagine: personaggi/sorella-giulia
        requisiti: [rep.velo >= 4, rep.velo < 6]
        prova: { attributo: mentale, abilita: [natura, medicina], difficolta: Difficile }
        successo:
          titolo: Dodici fiale
          testo: |
            Giri fra le aiuole con una lanterna schermata e incidi i fusti come ti
            ha mostrato Giulia, con un taglio sottile in diagonale che si richiude
            prima dell'alba. All'alba hai riempito dodici fiale senza sprecare una
            goccia, e hai la schiena di un vecchio. Sorella Arva ti conta la paga
            della notte.
          effetti: { monete: 5, rep.velo: 0.5 }
        fallimento:
          titolo: Il taglio storto
          testo: |
            Su una pianta giovane il taglio ti viene troppo profondo, e la linfa
            ti cola accesa sulle dita mentre la pianta si spegne foglia dopo
            foglia. Giulia la guarda a lungo e dice che forse si riprende, poi per
            il resto della notte riempie lei le fiale, e tu reggi la lanterna.

      - testo: "Scendere nella Cripta con i novizi"
        descrizione: "Da laico consacrato puoi sederti in fondo alla Cripta mentre i novizi recitano la Preghiera del Battito."
        immagine: personaggi/madre-del-velo
        requisiti: [cattedrale.voto >= 1]
        prova: { attributo: mentale, abilita: resilienza, difficolta: Media }
        successo:
          titolo: La Preghiera del Battito
          testo: |
            Ti siedi sull'ultimo gradino della Cripta mentre i novizi recitano a
            mezza voce. «Finché il cuore del mondo batterà, anche noi
            ricorderemo.» Dopo un po' le parole le dici anche tu, e le voci che ti
            porti dietro dalle profondità restano in cima alla scala, ad
            aspettarti. Quando risali la testa ti sembra più leggera di come
            l'avevi portata giù.
          effetti: { tormento: -0.5 }
        fallimento:
          titolo: La seconda voce
          testo: |
            A metà della Preghiera del Battito senti una voce che dice le stesse
            parole con un attimo di ritardo, e non capisci se arriva dal fondo
            della sala o da dentro la tua testa. Quando i novizi si alzano risali
            per primo.

            {origine apprendista-raschiatore} Sulle piattaforme, a chi risale dai
            tunnel e sente voci, fanno sempre il nome di Mirn il Sordo, morto in
            una cella di questa Cattedrale.

      - testo: "Fare il turno che Ottilia ti ha segnato"
        descrizione: "Sulla tavoletta di cera c'è il tuo nome scritto per intero. Agli accoliti Ottilia assegna un posto senza chiedere."
        quando: [origine.accolito-del-velo >= 1]
        requisiti: [rep.velo < 4]
        prova: { attributo: mentale, abilita: [medicina, accademiche], difficolta: Media }
        successo:
          titolo: Il giro di Vantes
          testo: |
            Il tuo turno è il giro dei malati con Padre Vantes, dalle brande della
            navata nord alle case dei fedeli che non salgono più. Lui impone le
            mani e tu cambi le bende, e quando a lui manca una parola della
            preghiera la dici tu, piano perché sembri sua. Dalla razzia si stanca
            prima, e a metà giro si appoggia al tuo braccio senza chiedere.
          effetti: { monete: 1, rep.velo: 0.5 }
        fallimento:
          titolo: La preghiera sbagliata
          testo: |
            A una branda della navata nord attacchi la preghiera per i moribondi
            davanti a un uomo che si è soltanto rotto un polso, e lui si fa bianco
            e chiede un prete vero. Vantes finisce la preghiera giusta e sulla
            porta ti dice che anche lui, da accolito, sbagliava pagina. Domani
            sulla tavoletta il tuo nome sta accanto alle candele, scritto un po'
            più piccolo.

      - testo: "Fare il turno di garitta"
        descrizione: "Nella garitta del Velo sopra i piloni decidi tu chi, fra quelli che risalgono, scende in Cripta."
        immagine: personaggi/padre-walter
        quando: [fazione.velo >= 9]
        requisiti: [rep.velo < 8]
        prova: { attributo: mentale, abilita: [medicina, resilienza], difficolta: Media }
        successo:
          titolo: Il registro della garitta
          testo: |
            Passi la notte nella garitta sopra i piloni, con il braciere ai piedi
            e il registro sulle ginocchia, e a chi risale dalla Cicatrice guardi
            il bianco dell'occhio prima della faccia. Un ragazzo con la tosse lo
            mandi in Cripta, i Raschiatori a casa. All'alba Padre Walter firma il
            registro sotto di te, e la sera Sorella Arva ti conta la paga del
            turno.
          effetti: { monete: 6, rep.velo: 0.5 }
        fallimento:
          titolo: Il braciere
          testo: |
            Verso la terza ora il braciere ti scalda troppo bene, e quando riapri
            gli occhi una squadra di Raschiatori è già passata. Walter riempie
            all'alba le tre righe che hai saltato, chiedendo i nomi a memoria, e
            non ti rimprovera. Arva ti conta metà della paga, con molta tristezza.
          effetti: { monete: 3, tormento: 1 }

      - testo: "Servire nella Cripta"
        descrizione: "Da velato della Cripta reggi le candele sotto l'altare mentre la Madre ascolta chi viene a confessarsi."
        immagine: personaggi/madre-del-velo
        quando: [fazione.velo >= 12]
        requisiti: [rep.velo < 10]
        prova: { attributo: mentale, abilita: [resilienza, accademiche], difficolta: Difficile }
        successo:
          titolo: Le candele della Cripta
          testo: |
            Reggi il candeliere a un passo dai veli della Madre per tutta la
            notte, mentre scendono a parlarle un vecchio consigliere e poi un
            Raschiatore che non riesce a finire le frasi. Tieni la fiamma ferma e
            gli occhi sul pavimento, come si insegna ai velati, e all'alba non
            ricordi una parola di quello che hai sentito, il che forse è il punto.
          effetti: { monete: 4, rep.velo: 0.5 }
        fallimento:
          titolo: La fiamma che trema
          testo: |
            A metà della notte scende una donna a parlare di suo figlio, e la
            fiamma comincia a tremarti in mano. La Madre alza appena un dito, e un
            altro velato ti toglie il candeliere e ti accompagna alla scala.
          effetti: { tormento: 1 }

  # ------------------------------------------------------------ storia a 2 · i Giardini della Linfa
  - id: i-giardini-della-linfa
    presso: cattedrale-del-velo
    immagine: personaggi/sorella-giulia
    titolo: I Giardini della Linfa
    sommario: "Nei Giardini la pianta più vecchia si spegne, e sui fusti ci sono tagli che Sorella Giulia non ha fatto."
    luogo: Cattedrale del Velo, i Giardini della Linfa
    area: quartieri-alti
    requisiti: [fazione.velo == 0, pista.capomozzo >= 10]
    testo: |
      Sorella Giulia ti aspetta in fondo ai Giardini, davanti al cespuglio
      più vecchio, quello con le foglie larghe come mani che la sera si
      accendono per prime. Stamattina è spento per metà, con le foglie in
      cima grigie e molli, e i passeri che ci dormivano si sono spostati
      sulla siepe.

      «È una talea del vecchio Santuario» dice Giulia. «La notte
      dell'incendio Padre Vantes l'ha portata fuori in una tasca della
      tonaca. Adesso guarda qui.» Scosta una foglia con due dita. Alla base
      dei fusti ci sono tagli sottili e diagonali, fatti con cura da
      qualcuno che sa come si incide una pianta, e ogni notte ne prende un
      poco dalla stessa.

      {natura Media} Tagli così piccoli una pianta li richiude in un giorno.
      Questa non fa in tempo, perché il coltello torna ogni notte.

      {origine mercante-dei-ponti} Sai quanto pagano la linfa del Velo gli
      speziali del Mercato dei Nodi, e per un momento, prima di
      vergognartene, fai il conto di quanto vale il cespuglio intero.

      A Ottilia, Giulia non lo vuole dire. «Ottilia trova sempre il
      colpevole, e dopo non resta più niente da sistemare.» Apre la mano
      verso la siepe, e un passero ci salta sopra.

      {empatia Media} Giulia ha già un sospetto, e le fa paura. Ti chiede
      aiuto perché spera che tu arrivi da un'altra parte.
    opzioni:
      - testo: "Esaminare i tagli e la linfa"
        descrizione: "Dalle ferite di una pianta si capisce chi l'ha incisa, e per farne che cosa."
        prova: { attributo: mentale, abilita: [natura, medicina], difficolta: Media }
        successo:
          titolo: Un dito per notte
          testo: |
            I tagli sono ventidue, tutti della stessa larghezza, e accanto a
            ognuno c'è il segno di una fiala piccola. Chi vende la linfa agli
            speziali la prende a mezzi barattoli e dalle piante giovani, mentre
            questo ne prende un dito a notte, sempre dalla pianta più vecchia, che
            è anche la più vicina al dormitorio dei novizi. Giulia ti segue
            annuendo, poi si gira a guardare la finestra del dormitorio.
          pe: { natura: 5 }
          segue: il-ladro-di-linfa
        fallimento:
          titolo: Gli speziali
          testo: |
            Spieghi a Giulia, con molta sicurezza, che dietro c'è qualcuno che
            vende la linfa agli speziali del Mercato dei Nodi. Lei ti fa notare
            che un ladro di linfa porterebbe via mezzo barattolo alla volta,
            mentre alla pianta vecchia ne manca un dito, e torna alla sua siepe a
            parlare con i passeri.
          effetti: { scandalo: 0.5 }

      - testo: "Seguire le gocce di luce"
        descrizione: "La linfa brilla anche quando cade, e chi la porta via di notte lascia una traccia."
        prova: { attributo: mentale, abilita: percezione, difficolta: Media }
        successo:
          titolo: Le gocce
          testo: |
            La mattina presto, quando le piante dormono, trovi fra le pietre dei
            vialetti gocce di linfa secca a distanza di passi corti, come di
            qualcuno in punta di piedi. Partono dal cespuglio vecchio e
            attraversano il chiostro fino alla porta del dormitorio dei novizi,
            dove qualcuno ha provato a strofinarle via con la suola.
          pe: { percezione: 5 }
          segue: il-ladro-di-linfa
        fallimento:
          titolo: Le foglie cadute
          testo: |
            Al crepuscolo i Giardini si accendono tutti insieme, e ogni foglia
            caduta brilla come la goccia che cercavi. Dopo un'ora vedi lucine
            anche a palpebre chiuse, e Giulia ti porta una tazza d'infuso e ti
            consiglia di riprovare la mattina presto, quando le piante dormono.
          effetti: { tormento: 0.5 }

      - testo: "Passare la notte dietro la siepe"
        descrizione: "Per stare svegli dietro una siepe non serve nessun talento. Serve una notte intera, e un mantello pesante."
        costo: 2
        esito:
          titolo: La notte dei passeri
          testo: |
            Ti siedi dietro la siepe, e verso la terza ora Giulia ti porta una
            coperta e una mela. Poco prima del mattutino la porta del dormitorio
            si apre di uno spiraglio, e una sagoma piccola attraversa il chiostro
            in punta di piedi con una fiala in mano. Si inginocchia davanti al
            cespuglio vecchio e incide il fusto con un temperino, piano, come se
            avesse paura di fargli male.
          pe: { resilienza: 5 }
          segue: il-ladro-di-linfa

      - testo: "Leggere i tagli come al Circolo"
        descrizione: "Nel Bosco di Velthar si impara presto a riconoscere chi ha inciso una corteccia, e perché."
        quando: [origine.figlio-del-circolo >= 1]
        prova: { attributo: mentale, abilita: natura, difficolta: Facile }
        successo:
          titolo: Un dito per notte
          testo: |
            Misuri i tagli con il pollice. Sono corti e poco profondi, e al
            Circolo ti hanno insegnato che chi vende la linfa taglia a fondo e
            torna di rado, mentre chi taglia così ne vuole poca e ogni notte.
            Nella terra molle sotto il cespuglio ci sono impronte di piedi piccoli
            e scalzi, che portano verso il dormitorio dei novizi, e all'alba
            aspetti con Giulia davanti alla porta.
          pe: { natura: 5 }
          segue: il-ladro-di-linfa
        fallimento:
          titolo: La siepe
          testo: |
            Confronti i tagli con quelli delle cortecce del Bosco di Velthar, ma
            questa pianta viene dal vecchio Santuario e la sua linfa è più densa.
            Segui una fila di impronte fino alla siepe, dove finisce contro il
            muro del chiostro, e torni da Giulia con le mani vuote mentre il suo
            passero vola via.
          effetti: { tormento: 0.5 }

  - id: il-ladro-di-linfa
    immagine: personaggi/sorella-giulia
    titolo: Il ladro di linfa
    tipo: seguito
    luogo: Cattedrale del Velo, il chiostro dei novizi
    area: quartieri-alti
    requisiti: [fazione.velo == 0]
    testo: |
      Il ladro si chiama Lino. Ha quattordici anni e un velo corto da primo
      anno che gli scivola su un orecchio, e Giulia lo accompagna fuori dal
      dormitorio con una mano sulla spalla. Da sotto la tunica tira fuori una
      fiala tappata con la cera che manda una luce verdina.

      «Io non la bevo e non la vendo» dice. «La tengo sotto la coperta, la
      notte. Dalla razzia non riesco più a dormire al buio, e Ottilia nel
      dormitorio non vuole lumi. Io sento ancora i corni degli orchi, e con
      la luce verde un po' meno.»

      {origine fuggiasco-di-ghoran} Le prime notti fuori da Ghoran dormivi
      con la schiena al muro, e Lino ha trovato un modo più gentile del tuo
      di arrivare all'alba.

      Giulia ti guarda sopra la testa del ragazzo, e senza averlo deciso ti
      sei accucciato all'altezza di Lino.
    opzioni:
      - testo: "Chiedere a Giulia una pianta per lui"
        descrizione: "Una talea in un vaso fa la stessa luce di una fiala, senza tagliare niente ogni notte."
        immagine: personaggi/sorella-giulia
        esito:
          titolo: Il vaso sul davanzale
          testo: |
            Giulia taglia una talea dal cespuglio vecchio, dalla parte ancora
            accesa, e la pianta in un vaso di coccio davanti a Lino. «Così la luce
            te la fai da solo, e il cespuglio si riposa.» Lino tiene il vaso con
            tutte e due le mani, come un bicchiere troppo pieno. Il giorno dopo
            Ottilia, passando, gira verso il sole la piantina sul davanzale del
            dormitorio.
          pe: { natura: 5 }
          imposta: { cattedrale.giardini: 1 }
          effetti: { rep.velo: 1, fazione.velo: 1 }

      - testo: "Parlare con Ottilia della regola dei lumi"
        descrizione: "Una regola si cambia soltanto con chi l'ha scritta. Ottilia ascolta tutti, e cambia idea di rado."
        immagine: personaggi/ottilia-sanvel
        prova: { attributo: sociale, abilita: [persuasione, empatia], difficolta: Media }
        successo:
          titolo: Lume del dormitorio
          testo: |
            Racconti a Ottilia dei corni e della fiala, senza fare il nome di
            Lino. Lei ascolta con le mani nelle maniche e ti chiede se sai quanti
            novizi sono arrivati dopo la razzia. «Undici.» Il giorno dopo in fondo
            al dormitorio pende una lanterna schermata accesa al minimo, e sulla
            tavoletta c'è una riga nuova, *lume del dormitorio, a turno*.
          pe: { persuasione: 5 }
          imposta: { cattedrale.giardini: 1 }
          effetti: { rep.velo: 1, fazione.velo: 1 }
        fallimento:
          titolo: Il buio si impara
          testo: |
            Chiedi a Ottilia di permettere un lume nel dormitorio, e per non fare
            il nome di Lino ti ingarbugli in una storia di candele e di ladri che
            non sta in piedi. «Il buio si impara come il resto» dice lei, e torna
            dai novizi. La sera Giulia mette in mano a Lino una talea in un vaso,
            di nascosto, perché almeno il cespuglio smetta di spegnersi.
          imposta: { cattedrale.giardini: 1 }
          effetti: { rep.velo: 0.5, fazione.velo: 1, scandalo: 0.5 }

      - testo: "Portare Lino da Ottilia"
        descrizione: "Un furto è un furto, anche di linfa. La disciplina dei novizi spetta a Ottilia, e Lino lo sa."
        immagine: personaggi/ottilia-sanvel
        esito:
          titolo: La disciplina
          testo: |
            Accompagni Lino da Ottilia con la fiala in mano. Lei lo ascolta senza
            interromperlo, poi vuota la fiala nel catino delle abluzioni, e Lino
            guarda l'acqua finché non torna scura. Per un mese spazzerà il
            chiostro prima dell'alba. La sera dopo sulla tavoletta dei lavori il
            tuo nome compare in cima, e quando ti incrocia nei Giardini Giulia non
            ti chiede di Lino.
          pe: { galateo: 5 }
          imposta: { cattedrale.giardini: 1 }
          effetti: { rep.velo: 1, fazione.velo: 1 }

      - testo: "Raccontare a Lino delle tue notti da novizio"
        descrizione: "Anche tu hai dormito in quel dormitorio senza lumi, e ricordi come si arrivava all'alba."
        quando: [origine.accolito-del-velo >= 1]
        esito:
          titolo: La Preghiera del Battito
          testo: |
            Ti siedi accanto a Lino sul gradino del chiostro e gli insegni il
            trucco dei novizi, la Preghiera del Battito detta a mezza voce con due
            dita sul polso. Lino la ripete due volte e ti consegna la fiala, che
            Giulia versa ai piedi del cespuglio vecchio. Il giorno dopo Ottilia ti
            chiede chi l'ha insegnata ai primi anni, e dal tono capisci che farà
            finta di non sentire.
          pe: { empatia: 5 }
          imposta: { cattedrale.giardini: 1 }
          effetti: { rep.velo: 1, fazione.velo: 1 }

  # ------------------------------------------------------------ storia a 4 · gli archivi minori
  - id: gli-archivi-minori
    presso: cattedrale-del-velo
    immagine: personaggi/ottilia-sanvel
    titolo: Gli archivi minori
    sommario: "Ottilia Sanvel ha bisogno di qualcuno che ricopi le pagine salvate dal vecchio Santuario, prima che si sbriciolino."
    luogo: Cattedrale del Velo, gli archivi minori dietro il chiostro
    area: quartieri-alti
    requisiti: [fazione.velo == 3]
    testo: |
      Gli archivi minori stanno dietro il chiostro, in tre stanze basse che
      erano le cantine del vecchio Santuario. Ogni scatola ha un cartellino
      con la grafia piccola e diritta di Ottilia Sanvel, tranne uno, in
      basso, con una grafia più grande e più storta. Sul tavolo c'è una
      cassetta di latta annerita, e quando Ottilia ne solleva il coperchio
      senti l'odore del fumo, vecchio di cinque anni e ancora intatto.

      Dentro ci sono i registri del Santuario salvati a metà, con i bordi
      bruciati. «La Madre ne vuole una copia pulita per la Cripta» dice
      Ottilia, e ti porge un paio di guanti di cotone e una pinzetta d'osso.
      «Gli originali non escono, e quello che leggi resta in questa stanza.»

      {origine allievo-di-torvessa} Prendi la pinzetta fra pollice e medio
      come all'Accademia, e Ottilia guarda le tue dita un momento più del
      necessario.
    opzioni:
      - testo: "Ricopiare le pagine"
        descrizione: "Si ricopia riga per riga, voltando i fogli con la pinzetta, e Ottilia controlla ogni pagina."
        prova: { attributo: mentale, abilita: accademiche, difficolta: Media }
        successo:
          titolo: L'ultimo foglio
          testo: |
            Ricopi per tutto il pomeriggio turni di guardia firmati a ogni ora
            canonica da un sacerdote diverso, e Ottilia controlla ogni pagina in
            piedi. Verso sera arrivi all'ultimo foglio del registro, quello con i
            bordi più neri, e in cima, con una grafia che non conosci, c'è la data
            della notte dell'incendio.
          pe: { accademiche: 5 }
          segue: la-notte-del-santuario
        fallimento:
          titolo: Cenere
          testo: |
            Dopo una pagina e mezza volti un foglio con le dita invece che con la
            pinzetta, e un angolo ti resta in mano fatto di cenere. Ottilia lo
            raccoglie in un piattino e chiude la cassetta. «Per oggi basta. La
            prossima volta le dita le tieni in grembo finché non ti servono per
            scrivere.»
          effetti: { tormento: 0.5 }

      - testo: "Leggere le pagine controluce"
        descrizione: "Dove l'inchiostro è bruciato restano i solchi del pennino. Contro la luce della finestra, a volte, si leggono ancora."
        prova: { attributo: mentale, abilita: percezione, difficolta: Media }
        successo:
          titolo: I solchi del pennino
          testo: |
            Alzi i fogli più bruciati contro la finestra, e dove l'inchiostro se
            n'è andato i solchi del pennino fanno tornare fuori le lettere una per
            una. Ottilia smette di guardarti le mani e comincia a guardare le
            pagine. Ricostruisci tre fogli che lei credeva persi, e l'ultimo porta
            in cima la data della notte dell'incendio.
          pe: { percezione: 5 }
          segue: la-notte-del-santuario
        fallimento:
          titolo: Controluce
          testo: |
            La carta bruciata è troppo sottile, e la luce ci passa attraverso
            senza mostrarti niente. Dopo un'ora hai ricostruito una parola sola,
            *candele*, che Ottilia annota in un quaderno prima di dirti di tornare
            con gli occhi più riposati.
          effetti: { tormento: 0.5 }

      - testo: "Aiutarla un'ora al giorno"
        descrizione: "Senza fretta, un foglio per volta, alla sua maniera. Ottilia non ha mai avuto fretta in vita sua."
        costo: 2
        esito:
          titolo: Un foglio al giorno
          testo: |
            Per una settimana torni ogni giorno alla stessa ora, e ogni giorno
            Ottilia ti dà un foglio solo. Il quinto giorno ti chiede da dove
            vieni. Il sesto ti racconta che da novizia copiava anche lei in queste
            cantine, e mentre parla tocca con un dito il cartellino storto in
            basso, quello con la grafia grande. Il settimo ti porge l'ultimo
            foglio del registro, con la data della notte dell'incendio.
          pe: { resilienza: 5 }
          segue: la-notte-del-santuario

  - id: la-notte-del-santuario
    immagine: personaggi/ottilia-sanvel
    titolo: La notte del Santuario
    tipo: seguito
    luogo: Cattedrale del Velo, gli archivi minori
    area: quartieri-alti
    requisiti: [fazione.velo == 3]
    testo: |
      L'ultimo foglio è diviso in due colonne. A sinistra ci sono i sei
      sacerdoti di turno quella notte, ognuno con l'ora della sua firma, e
      le firme si fermano alla compieta. A destra ci sono le quarantuno
      persone che dormivano nel Santuario, quasi tutte rifugiati delle Notti
      Cucite, e accanto alla maggior parte c'è una crocetta tracciata con un
      altro inchiostro, da una mano che andava di fretta. Più sotto c'era
      una riga a matita, cancellata con tanta forza da strappare la carta.

      {percezione Media} Le sei firme della compieta hanno lo stesso
      inchiostro e la stessa pressione, come se fossero state messe una dopo
      l'altra, in fretta, sullo stesso tavolo.

      «Le crocette le ho fatte io» dice Ottilia alle tue spalle. «Stavo
      sulla porta del chiostro e contavo chi usciva.» Posa un dito guantato
      su tre righe senza crocetta, poi sui nomi di Idrian Sollen e di sua
      figlia, in fondo alla colonna. «La riga cancellata diceva a che ora
      sono usciti i sacerdoti. Su questo foglio la Madre ha chiesto
      riservatezza, e io la rispetto.»

      {origine rampollo-dei-quartieri-alti} Nei salotti l'incendio del
      Santuario torna fuori a ogni anniversario, dopo il dolce, come una
      disgrazia senza colpevoli.

      *Lei stava sulla porta a contare, e i sacerdoti di turno erano già
      fuori.* Rimetti giù il foglio piano, con le dita guantate.
    opzioni:
      - testo: "Chiederle di quella notte"
        descrizione: "Ottilia parla in frasi brevi e non ama i superlativi. Di quella notte, forse, parla lo stesso."
        esito:
          titolo: I nomi del mattino
          testo: |
            «Il fuoco è partito dall'ala nord, e il fumo è arrivato prima delle
            fiamme» dice Ottilia. «La chiave della porta del chiostro ce l'avevo
            io. Ne ho contati trentasei, e cinque non sono usciti.» Ti dice i
            cinque nomi a memoria, gli stessi che ripete ogni mattina
            all'esercizio dell'alba. «Il sapere si accumula e basta. Saggezza è
            quello che decidi di non dimenticare.»
          pe: { empatia: 5 }
          imposta: { cattedrale.archivio: 1 }
          effetti: { rep.velo: 1, fazione.velo: 1 }

      - testo: "Ricopiare il foglio com'è, riga strappata compresa"
        descrizione: "La copia pulita la vuole la Madre, e quello che c'è sul foglio va sulla copia, cancellatura compresa."
        esito:
          titolo: Il rettangolo vuoto
          testo: |
            Ricopi il foglio crocetta per crocetta, e dove c'è la riga cancellata
            disegni un rettangolo vuoto della stessa misura, con lo strappo
            segnato a matita. Ottilia lo guarda a lungo, poi sigilla la copia con
            la cera del Velo, premendoci sopra il sigillo che porta alla cintura.
            «Per la Madre.» Mentre esci la senti chiudere a chiave la porta degli
            archivi, cosa che di giorno non fa mai.
          pe: { accademiche: 5 }
          imposta: { cattedrale.archivio: 1 }
          effetti: { rep.velo: 1, fazione.velo: 1 }

      - testo: "Copiare di nascosto la colonna dei sacerdoti"
        descrizione: "Sei nomi con le loro ore, che in città qualcuno pagherebbe bene, e Ottilia adesso ti volta le spalle."
        prova: { attributo: fisico, abilita: furtivita, difficolta: Media }
        successo:
          titolo: Sei nomi
          testo: |
            Mentre Ottilia rimette in ordine la cassetta ricopi i sei nomi in
            fondo al tuo quaderno, fra due conti della spesa, con l'ora accanto a
            ognuno, e quando si volta stai scrivendo la data sulla copia pulita.
            Più tardi, sotto un lampione, rileggi la pagina. Due di quei nomi li
            hai già sentiti in Cattedrale, durante le funzioni solenni.
          imposta: { cattedrale.archivio: 1, velo.copia: 1 }
          effetti: { rep.velo: 1, informazioni.segreto: 1, fazione.velo: 1 }
        fallimento:
          titolo: La pagina strappata
          testo: |
            Ottilia si volta prima che tu abbia finito di ricopiare i sei nomi, e
            ti tende la mano senza dire niente. Strappa la pagina dal tuo quaderno
            e la ripone nella cassetta, sopra il foglio bruciato. «Te l'avevo
            detto, quello che leggi resta qui.» Gli archivi te li apre ancora, ma
            da quel giorno resta nella stanza finché non te ne vai.
          imposta: { cattedrale.archivio: 1 }
          effetti: { rep.velo: 0.5, scandalo: 1, fazione.velo: 1 }

      - testo: "Chiederle di Aurenne"
        descrizione: "Sul foglio la figlia del cappellano non ha la crocetta. Tu sai che dalle rovine è tornata viva."
        immagine: personaggi/aurenne
        quando: [pista.capomozzo >= 7]
        costo: 0
        esito:
          titolo: Una crocetta da mettere
          testo: |
            Ottilia resta a guardare il nome. «Quella notte non l'ho vista uscire,
            e dentro non l'avevo vista nemmeno prima. Per cinque anni è stata una
            riga senza crocetta, e la mattina la ripetevo con gli altri quattro
            nomi.» Si toglie un guanto e passa il pollice sulla carta accanto al
            nome, senza toccarlo. «Adesso la crocetta non so dove metterla.»
          segue: la-notte-del-santuario

  # ------------------------------------------------------------ storia a 6 · il voto del Velo
  - id: il-voto-del-velo
    presso: cattedrale-del-velo
    immagine: personaggi/padre-vantes
    titolo: Il voto del Velo
    sommario: "Dopo la compieta Padre Vantes ti trattiene sulla prima panca, con due dita sul tuo polso."
    luogo: Cattedrale del Velo, la navata, dopo la compieta
    area: quartieri-alti
    requisiti: [fazione.velo == 5]
    testo: |
      Dopo la compieta, mentre gli accoliti spengono le candele, Padre Vantes
      ti trattiene con due dita sul polso e ti fa sedere sulla prima panca,
      quella dei consiglieri, davanti al cristallo rosso che pulsa piano.

      «Il Velo ha i suoi chierici e i suoi monaci» dice Vantes, «e poi ha
      quelli come te, che ci aiutano senza portare la tonaca. A volte a uno
      di loro chiediamo di più. Un laico consacrato fa il suo voto di notte
      davanti all'altare, e da quella notte la Cripta per lui è aperta. In
      cambio, quando il Velo ha bisogno, lo chiama per nome.» Si ferma, e per
      la prima volta da quando lo conosci ti sembra in imbarazzo. «La Madre è
      d'accordo. Il tuo nome l'ha fatto lei.»

      {politica-ed-economia Media} Un laico consacrato che il Velo chiama per
      nome può andare dove la tonaca non entra, e per questo Vantes adesso si
      guarda le mani.

      {origine accolito-del-velo} Da accolito ti hanno insegnato a non
      chiedere che cosa c'è sotto l'altare, e adesso Vantes ti offre la scala
      per scendere a vederlo.

      *Una donna che nessuno ha mai visto in faccia, e che sa come mi
      chiamo.* Ti accorgi di esserti seduto con la schiena dritta, e la lasci
      andare contro lo schienale.
    opzioni:
      - testo: "Chiedere che cosa si promette"
        descrizione: "Un voto è fatto di parole. Prima di dirle, conviene saperle."
        costo: 0
        esito:
          titolo: La vita che resta
          testo: |
            «Si promette di servire la vita che resta» dice Vantes, toccando il
            sigillo del Velo che porta al collo, consumato sul bordo dalle dita.
            «Le parole sono della Madre. Come servirla lo decidi tu giorno per
            giorno, e decidi tu se restare in città o partire. Il Velo chiede di
            sapere dove sei, e di poterti chiamare. Il resto lo chiede la tua
            coscienza, e a lei rispondi da solo.»

      - testo: "Chiedere chi ci sarà"
        descrizione: "Un rito di notte, davanti al cristallo. Qualcuno lo deve pur vedere."
        quando: [pista.capomozzo < 9]
        costo: 0
        esito:
          titolo: Tre testimoni
          testo: |
            «Io, che dico le parole prima di te» dice Vantes, contando sulle dita.
            «Ottilia, che scrive il tuo nome nel registro dei laici soltanto se ha
            visto con i suoi occhi. E Sorella Celia con il liuto, perché me l'ha
            chiesto, e io a Celia dico di no di rado.» Ti lascia il polso. «La
            Madre resta nella Cripta, ma la scala è aperta, e lei sente.»

      - testo: "Chiedere chi ci sarà"
        descrizione: "Un rito di notte, davanti al cristallo. Qualcuno lo deve pur vedere."
        quando: [pista.capomozzo >= 9]
        immagine: personaggi/aurenne
        costo: 0
        esito:
          titolo: Quattro testimoni
          testo: |
            «Ci sarà anche Aurenne» dice Vantes, dopo averti nominato Ottilia e
            Celia, e ti guarda per vedere come la prendi. «Me l'ha chiesto lei
            ieri sera, ed è la prima cosa che chiede da quando è sveglia. Al
            Santuario, da bambina, i voti li guardava di nascosto dal matroneo.»
            Ti stringe il polso per un momento. «Se preferisci di no, glielo dico
            io.»

      - testo: "Dirgli dell'argano"
        descrizione: "Ferro ti aspetta sull'orlo della Cicatrice. Un voto che ti tiene in città arriva tardi."
        quando: [pista.capomozzo >= 10]
        costo: 0
        esito:
          titolo: La garitta
          testo: |
            «Lo so» dice Vantes. «Il custode della garitta sopra i piloni è uno
            dei nostri, e mi ha detto chi è sceso a provare l'argano.» Ti tiene il
            polso un po' più a lungo del solito. «Il voto non ti trattiene. Il
            Velo custodisce le strade che scendono, e uno dei suoi laggiù gli
            serve più di uno quassù. Quando torni, la Cripta è ancora aperta.»

      - testo: "Accettare"
        descrizione: "Stanotte, all'ultima ora, davanti al cristallo rosso. Si veglia fino al mattutino."
        quando: [rep.scuri < 4]
        esito:
          titolo: Stanotte
          testo: |
            Vantes annuisce piano, e le dita sul tuo polso stringono un po' di
            più. «Allora stanotte. Torna quando suona l'ultima ora, e lascia le
            armi al portone, come tutti.» Mentre va verso la sagrestia riaccende
            una candela per ogni panca, sotto gli occhi degli accoliti che le
            hanno appena spente.
          segue: la-veglia-del-voto

      - testo: "Accettare"
        descrizione: "Stanotte, all'ultima ora, davanti al cristallo rosso. Si veglia fino al mattutino."
        quando: [rep.scuri >= 4, pista.pelle >= 6]
        esito:
          titolo: Stanotte
          testo: |
            Vantes annuisce piano, e le dita sul tuo polso stringono un po' di
            più. «Allora stanotte. Torna quando suona l'ultima ora, e lascia le
            armi al portone, come tutti.» Mentre va verso la sagrestia riaccende
            una candela per ogni panca, sotto gli occhi degli accoliti che le
            hanno appena spente.
          segue: la-veglia-del-voto

      - testo: "Promettere di chiudere con gli Scuri"
        descrizione: "Vantes sa a chi porti i saluti in Via dei Rasoi, e un laico consacrato non può avere due padroni."
        quando: [rep.scuri >= 4, pista.pelle < 6]
        esito:
          titolo: Due padroni
          testo: |
            Vantes ti dice che in Via dei Rasoi il tuo nome lo conoscono, e che un
            laico consacrato non può portare nella stessa tasca i saluti del Velo
            e quelli di Mirko Vesh. Glielo prometti. «Allora stanotte. Torna
            quando suona l'ultima ora, e lascia le armi al portone.» Il giorno
            dopo, in Via dei Rasoi, un ragazzo che ti salutava ogni mattina guarda
            dall'altra parte.
          effetti: { rep.scuri: -2 }
          segue: la-veglia-del-voto

      - testo: "Rifiutare con garbo"
        descrizione: "È un onore, e un impegno. Per adesso preferisci restare uno che aiuta senza promettere."
        costo: 0
        esito:
          titolo: La prima panca
          testo: |
            Gli dici che ti fa onore, e che per adesso preferisci aiutare senza
            promettere. Vantes ritira le dita dal tuo polso. «Il Velo sa
            aspettare. La prima panca resta qui, e anche la domanda.» Ti
            accompagna al portone riparando la candela con il palmo, e sulla
            soglia ti benedice come ogni sera.

  - id: la-veglia-del-voto
    immagine: ambientazione/cattedrale-del-velo
    titolo: La veglia del voto
    tipo: seguito
    luogo: Cattedrale del Velo, l'altare, di notte
    area: quartieri-alti
    requisiti: [fazione.velo == 5]
    testo: |
      Quando suona l'ultima ora torni in Cattedrale. Dentro restano accese
      soltanto le candele dell'altare e una lanterna in fondo, dove Ottilia
      Sanvel aspetta con un registro sotto il braccio. Su una panca laterale
      Sorella Celia tiene il liuto sulle ginocchia senza suonarlo, con al
      polso un nastro che stanotte nessuno le farà togliere. Padre Vantes ti
      fa inginocchiare sul gradino più basso, a un braccio dal cristallo
      rosso, e ti mette fra le mani una candela spenta.

      «Si veglia fino al mattutino» dice. «Quando il cristallo batte l'ora
      accendi la candela alla sua luce e dici il voto. Se prima ti
      addormenti nessuno te ne farà una colpa, e si ricomincia un'altra
      notte.»

      Il freddo del gradino ti sale nelle ginocchia attraverso la stoffa. A
      ogni battito del cristallo la luce rossa ti scorre sulle mani e si
      ritira, e dalla scala della Cripta, alle tue spalle, sale un filo
      d'aria fredda che odora di rame.

      {espressivita Media} Celia ha accordato il liuto prima che arrivassi,
      e non lo tocca per non doverlo riaccordare. Aspetta un solo momento
      della notte.

      *Quattro ore di qui al mattutino.* Accanto a te Vantes comincia a
      pregare sottovoce.
    opzioni:
      - testo: "Vegliare fino al mattutino"
        descrizione: "Quattro ore in ginocchio sulla pietra, senza chiudere gli occhi, con il battito del cristallo davanti."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Media }
        successo:
          titolo: Il mattutino
          testo: |
            Al mattutino, con le ginocchia che non senti più, accosti lo stoppino
            alla pietra calda come una brace e la candela si accende. Dici il
            voto, servire la vita che resta, e dalla scala della Cripta una voce
            bassa ripete l'ultima parola con un attimo di ritardo. Ottilia scrive
            il tuo nome nel registro dei laici, e la mattina dopo Padre Walter ti
            aspetta sul portale per la prima garitta.
          pe: { resilienza: 5 }
          imposta: { cattedrale.voto: 1 }
          effetti: { rep.velo: 1, fazione.velo: 1, oggetto.velo-sigillo-del-velo: 1 }
          almeno: { rep.velo: 4 }
        fallimento:
          titolo: L'alba sul gradino
          testo: |
            Verso la terza ora il battito del cristallo comincia a cullarti, e ti
            svegli con la guancia sul gradino nella luce grigia dell'alba. Vantes,
            ancora in ginocchio, ha pregato per tutti e due. «Succede a molti»
            dice, raccogliendo la candela. «Si ricomincia un'altra notte.» Ottilia
            chiude il registro senza scriverci niente.
          effetti: { tormento: 0.5 }

      - testo: "Pregare con Vantes per restare sveglio"
        descrizione: "La sua voce non si ferma mai, e andandole dietro la notte passa più in fretta."
        costo: 2
        esito:
          titolo: La voce di Vantes
          testo: |
            Vai dietro alla preghiera di Vantes parola per parola, e lui rallenta
            apposta per aspettarti. Al mattutino accendi la candela alla pietra
            calda e dici il voto, e dalla scala della Cripta una voce bassa ripete
            l'ultima parola con un attimo di ritardo. Ottilia scrive il tuo nome
            nel registro, e la mattina dopo Padre Walter ti aspetta sul portale
            per la prima notte di garitta dei consacrati.
          pe: { galateo: 5 }
          imposta: { cattedrale.voto: 1 }
          effetti: { rep.velo: 1, fazione.velo: 1, oggetto.velo-sigillo-del-velo: 1 }
          almeno: { rep.velo: 4 }

      - testo: "Vegliare con Aurenne accanto"
        descrizione: "Dalla sala di preghiera più interna arriva Aurenne, e si inginocchia sul gradino accanto al tuo senza chiedere permesso."
        immagine: personaggi/aurenne
        quando: [pista.capomozzo >= 9]
        esito:
          titolo: Il gradino accanto
          testo: |
            Aurenne si inginocchia accanto a te e alla terza ora, quando ti cade
            la testa, ti tocca la spalla con la mano buona. Al mattutino dice il
            voto con te nelle parole vecchie, mezza sillaba avanti. Ottilia scrive
            il tuo nome nel registro e, dopo un momento di esitazione, sotto il
            tuo quello di Aurenne come testimone. La mattina dopo Padre Walter ti
            aspetta sul portale per la prima garitta.
          pe: { empatia: 5 }
          imposta: { cattedrale.voto: 1 }
          effetti: { rep.velo: 1, fazione.velo: 1, oggetto.velo-sigillo-del-velo: 1 }
          almeno: { rep.velo: 4 }

      - testo: "Alzarti prima dell'ora"
        descrizione: "Forse non è la notte giusta. Vantes lo ha detto, si può ricominciare."
        costo: 0
        esito:
          titolo: Un'altra notte
          testo: |
            Ti alzi prima del mattutino e posi la candela spenta sull'altare.
            Vantes smette di pregare e ti guarda senza rimprovero. «Un'altra
            notte, allora» dice, posandoti due dita sul polso. Celia ripone il
            liuto e Ottilia chiude il registro senza che nessuno ti chieda perché,
            e mentre scendi la scalinata senti il portone richiudersi piano alle
            tue spalle.

  # ------------------------------------------------------------ la carta
  - id: carta-le-campane-del-velo
    immagine: fazioni/confraternita-del-velo
    titolo: Le campane del Velo
    sommario: "Per strada passa una processione del Velo, e in coda un novizio ha perso il batacchio della campanella."
    luogo: Quartieri Alti, la strada che scende dalla Cattedrale
    tipo: carta
    area: quartieri-alti
    requisiti: [rep.velo < 2]
    testo: |
      Le campane della Cattedrale suonano a lutto, e dalla strada alta
      scende una processione del Velo per i morti della razzia, con i fedeli
      che si riaccendono le candele l'uno dall'altro. In coda un novizio di
      dodici anni agita una campanella muta, perché il batacchio gli è
      rotolato sotto la carrozza di un nobile, ferma all'angolo, mentre a
      cassetta il cocchiere sbuccia una mela e fa finta di niente.

      {origine figlio-della-citta-bassa} In Città Bassa, strisciando sotto i
      carri, hai imparato a distinguere i cocchieri che tirano calci da
      quelli che guardano altrove.
    opzioni:
      - testo: "Recuperare il batacchio"
        descrizione: "Bisogna infilarsi sotto la carrozza, fra le ruote, mentre i cavalli sbuffano."
        esito:
          titolo: Sotto la carrozza
          testo: |
            Ti infili a carponi fra le ruote, sotto lo sguardo del cocchiere con
            la mela a mezz'aria, e trovi il batacchio in una pozzanghera. Il
            novizio lo riaggancia con le dita che tremano e corre dietro alla
            processione suonando più forte di prima, e in fondo alla strada il
            sacerdote si volta e ti fa un cenno con il libro.
          effetti: { rep.velo: 0.5 }
      - testo: "Chiedere al cocchiere di spostarsi"
        descrizione: "Basta un passo di cavalli, e il batacchio è libero. Il cocchiere va soltanto convinto."
        prova: { attributo: sociale, abilita: [persuasione, intimidire], difficolta: Facile }
        successo:
          titolo: Un passo di cavalli
          testo: |
            Spieghi al cocchiere che la carrozza è ferma sopra un oggetto sacro,
            cosa vera in un certo senso. Lui guarda te, poi la processione che si
            è voltata a guardarlo, e alla fine schiocca la lingua. Al primo passo
            dei cavalli il novizio si tuffa sul batacchio e corre via suonando, e
            dalla processione un sacerdote ti fa un cenno con il libro aperto.
          effetti: { rep.velo: 0.5 }
        fallimento:
          titolo: La mela
          testo: |
            Il cocchiere ti ascolta masticando, poi ti dice che da lì non si muove
            finché il padrone non esce. Mentre discutete il novizio si arrende e
            corre dietro alla processione con la campanella muta sotto il braccio,
            e poco dopo dalla piazza in fondo arriva un suono storto, di una
            campanella battuta con qualcosa che non è il suo batacchio.
          effetti: { scandalo: 0.5 }
      - testo: "Proseguire per la tua strada"
        descrizione: "I novizi del Velo hanno i loro maestri, e tu hai i tuoi affari."
        costo: 0
        esito:
          testo: |
            All'angolo ti volti, e il novizio è ancora lì con la campanella muta
            in mano, mentre la processione è già in fondo alla discesa. Il
            cocchiere butta il torsolo della mela sotto la carrozza, proprio
            accanto al batacchio. Quando arrivi in piazza ti accorgi di avere
            ancora le mani strette nelle tasche.
