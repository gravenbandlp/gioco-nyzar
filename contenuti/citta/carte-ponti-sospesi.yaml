# Ponti Sospesi, il mazzo del quartiere (ottobre 2026). Prima c'erano sette carte (carte.yaml, ponti.yaml,
# nodo.yaml, grifone.yaml, piste/tribu.yaml) e con la mano da tre si ripetevano troppo. Qui ce ne sono venti:
# tredici singole sulla vita del quartiere, la catena di Ilde Sarrocchi in quattro carte e tre carte che arrivano
# con le piste avanzate.
#
# LE SINGOLE: tutte ripetibili, tranne la vendita di Clelia Vennari (visto.carta-ponti-clelia-vennari).
#   galline al gabbiotto, le botti di Varn Kett, l'asta dei colli, la casa che dondola, il gabbiano, l'involto
#   nella borsa, la lanterna che sfrigola, il cantastorie senza voce, Clelia Vennari, il posto del banco, la
#   lenza fra le assi, la nebbia sulla campata, l'approdo delle chiatte (con chiatta.posto == 1 la via di Ilde).
#
# LA CATENA DI ILDE SARROCCHI, la chiattaiola della Mula (una carta alla volta, ogni opzione porta al passo dopo)
#   chiatta.ilde       0 non la conosci, 1..3 i passi fatti, 4 finita.
#     carta-ilde-la-mula            0 → 1  l'argano bloccato. Guardarci dentro (successo) trova il cuneo: chiatta.cuneo 1.
#     carta-ilde-il-carico          1 → 2  il privilegio di fune e le botti sotto sigillo. Con licenza-gilda una via in più.
#     carta-ilde-la-fune-segata     2 → 3  chi ha segato il cavo: la posta, i soldi, il cuneo (chiatta.cuneo == 1, senza
#                                          prova) danno chiatta.colpevole 1.
#     carta-ilde-l-ultima-traversata 3 → 4 la lettera della Gilda. Convincerla (successo) o fare il nome di Bracco a Varn
#                                          Kett (chiatta.colpevole == 1) la fanno restare: chiatta.fine 1 e chiatta.posto 1.
#                                          Altrimenti vende (chiatta.fine 2) e ti dà la tua parte.
#   chiatta.posto, la ricompensa che resta: un posto sulla Mula. Apre l'opzione migliore dell'approdo delle chiatte.
#
# LE CARTE CHE ARRIVANO DOPO
#   carta-ponti-il-turno-di-notte     pista.registro >= 5: il custode nuovo del Ponte dei Morti (con maedric == 1
#                                     una domanda in più su Holl).
#   carta-ponti-il-prezzo-del-lyssan  pista.acciaio >= 8: l'Acciaieria ferma e il lyssan dipinto.
#   carta-ponti-le-passerelle-di-sotto pista.pelle >= 6: i sottoponti senza gli Scuri (con guarnigione.distintivo una via in più).
#
# Nomi nuovi, che il Codex non dà: Ilde Sarrocchi (chiattaiola, intercalare «socio», la liquirizia fra i denti) e la
# sua chiatta, la Mula; Ugo Bracco (padrone delle chiatte grandi); Clelia Vennari (l'ultima di una famiglia del Patto
# delle Corde) e suo cugino Gerardo; Ruggero Fosco (mercante d'olio); Bastiano Rocca (cantastorie); Teo Marsan
# (custode notturno dopo Maedric Holl); i ragazzi della corda e i Lunghi (bande dei sottoponti); i gabbiani di cresta
# grigia. Luoghi: le chiatte a fune e il loro approdo, a valle del Ponte delle Mille Corde (piattaforme da carico tirate
# su cavi d'acciaio fra le due sponde della Cicatrice, per le merci troppo pesanti per le assi); il privilegio di fune
# (dal Patto delle Corde, chi ha un argano porta la propria merce senza gabella); lo slargo della campana, la campata
# di ponente, la piattaforma dei bottai.
# Nessuna cifra nella prosa: i numeri stanno negli effetti (docs/stile-dei-testi.md, regola 11).
quality:
  - { id: chiatta.ilde, nome: "Ilde Sarrocchi e la Mula", categoria: stato, nascosta: true, descrizione: "A che punto sei con Ilde Sarrocchi, da 0 (non la conosci) a 4 (la sua storia è chiusa)." }
  - { id: chiatta.cuneo, nome: "Il cuneo nell'argano", categoria: stato, nascosta: true, descrizione: "1 se hai trovato il cuneo di quercia piantato nell'argano della Mula." }
  - { id: chiatta.colpevole, nome: "Chi ha segato la fune", categoria: stato, nascosta: true, descrizione: "1 se sai che dietro la fune segata della Mula c'è Ugo Bracco." }
  - { id: chiatta.fine, nome: "Com'è finita con la Mula", categoria: stato, nascosta: true, descrizione: "1 se Ilde ha tenuto la Mula e il privilegio di fune, 2 se l'ha venduto alla Gilda." }
  - { id: chiatta.posto, immagine: icone/pulley-hook, nome: "Un posto sulla Mula", categoria: stato, descrizione: "Ilde Sarrocchi ti tiene un posto sulla sua chiatta, e all'approdo ti fa lavorare per prima." }
  - { id: visto.carta-ponti-clelia-vennari, nome: "Il panno di Clelia Vennari", categoria: stato, nascosta: true }

storylet:
  # ================================================================ le singole
  - id: carta-ponti-la-gabella-delle-galline
    immagine: icone/chicken
    titolo: La gabella delle galline
    sommario: "Al gabbiotto dei Custodi una ragazza con una gabbia di galline riconta i suoi spiccioli, e il conto resta lo stesso."
    luogo: Ponte delle Mille Corde, il gabbiotto dei Custodi
    tipo: carta
    area: ponti-sospesi
    testo: |
      All'imbocco del Ponte delle Mille Corde la fila per la gabella è ferma
      da un pezzo, e chi aspetta ha smesso di lamentarsi e si è messo a
      guardare. Davanti alla finestrella del gabbiotto c'è una ragazza con
      gli zoccoli infangati e una gabbia di vimini sulla schiena, dove sei
      galline protestano a turno. Tiene gli spiccioli nel palmo aperto e li
      riconta spingendoli con l'indice uno alla volta, come se a contarli
      piano potessero aumentare.

      Il Custode di turno è giovane, con il colletto inamidato e una
      tavoletta di gesso, e ha l'aria di uno che quel colletto se l'è stirato
      da solo, stamattina, con molto impegno. «Sei galline sono merce» dice,
      e batte il gesso sul tariffario inchiodato accanto alla finestrella.
      «La merce paga per capo. Se fossero uova, sarebbe un altro discorso.»

      {politica-ed-economia Facile} I tariffari dei Custodi hanno sempre una
      coda in caratteri piccoli. Nessuno ci arriva mai, compreso chi li
      inchioda.

      La ragazza si volta verso di te, perché sei il primo della fila. Una
      gallina infila il becco fra le stecche e ti becca la manica, senza
      cattiveria, per vedere di che cosa sei fatto.

      {addestrare-animali Facile} La gallina è curiosa, e la tua manica ha
      un bottone che luccica abbastanza da sembrare un chicco.
    opzioni:
      - testo: "Pagare la differenza"
        descrizione: "Quello che le manca è meno di una cena al Grifone."
        requisiti: [monete >= 1]
        esito:
          titolo: Un uovo tiepido
          testo: |
            Posi le monete sul davanzale della finestrella, e il Custode le fa
            scivolare nel cassetto senza commenti e scrive la ricevuta, con un
            sollievo che cerca di non far vedere. La ragazza passa con la gabbia che
            sbatte, poi torna indietro di corsa e ti mette in mano un uovo ancora
            tiepido, della gallina che ti ha beccato. Te lo porti dietro per tutto
            il giorno, nella mano chiusa, perché non sai dove metterlo, e la sera ti
            accorgi di averlo tenuto come si tiene una cosa importante.
          effetti: { monete: -1, tormento: -0.5 }
      - testo: "Convincere il Custode che sono uova"
        descrizione: "In fondo una gallina è soltanto un uovo che ci ha messo più tempo. Bisogna dirlo con la faccia giusta."
        prova: { attributo: sociale, abilita: persuasione, difficolta: Media }
        successo:
          titolo: Uova a venire
          testo: |
            Spieghi al Custode che quelle sono uova a venire, e che il tariffario
            non distingue fra un uovo oggi e un uovo domani. Lo dici serio, senza
            battere ciglio, mentre una gallina ti smentisce con un verso indignato.
            Lui ti guarda a lungo, poi scoppia a ridere così forte che dalla fila
            ridono anche quelli che non hanno sentito. Scrive *uova* sulla ricevuta
            e ci fa sopra un ricciolo. Fuori dal gabbiotto la ragazza ti cammina
            accanto per un tratto e ti racconta che i suoi vicini, a Laresh, vendono
            il grano ai carri che passano di notte.
          effetti: { informazioni.voce: 1 }
        fallimento:
          titolo: La lavagnetta
          testo: |
            Il Custode ti ascolta fino in fondo con la pazienza dei funzionari,
            poi ti chiede il nome e lo scrive sulla tavoletta di gesso, sotto la
            voce *intralcio*, in bella calligrafia.

            {persuasione Media fallita} L'argomento era buono. Il problema è che
            l'hai detto ridendo, e lui non aveva voglia di ridere.

            La fila, che prima stava dalla tua parte, adesso ti guarda come la causa
            del ritardo. Alla fine la ragazza lascia due galline al gabbiotto in
            pegno e passa con le altre, e tu ti senti gli occhi di tutti sulla nuca
            fino a metà del ponte.
          effetti: { scandalo: 0.5 }
      - testo: "Leggere il tariffario"
        descrizione: "È inchiodato lì accanto, e nessuno lo legge fino in fondo, compreso chi lo applica."
        prova: { attributo: mentale, abilita: politica-ed-economia, difficolta: Facile }
        successo:
          titolo: Animali portati a mano
          testo: |
            In fondo al tariffario, in caratteri più piccoli, c'è una voce che il
            Custode non ricordava, sugli animali vivi portati a mano da chi li
            alleva. Pagano la metà. Glielo indichi con il dito, e lui lo legge
            muovendo le labbra, arrossisce fino alle orecchie e fa il conto nuovo,
            cancellando quello vecchio con il palmo della mano. La ragazza ha gli
            spiccioli giusti. Il Custode, quando passi, ti saluta portandosi due
            dita al cappello, come si fa con un collega della Gilda.
          effetti: { rep.gilda: 0.5 }
        fallimento:
          titolo: Il tariffario lungo
          testo: |
            Il tariffario è lungo più di un braccio e scritto fitto, e tu ti
            perdi fra la voce del sale e quella delle pelli conciate, con le
            righe che a un certo punto cominciano a ballare. Quando
            alzi la testa la ragazza ha già lasciato due galline in pegno al
            gabbiotto ed è passata con le altre. Il Custode ti chiede, con
            garbo, se hai trovato quello che cercavi.
      - testo: "Dichiarare le galline come merce tua"
        descrizione: "Con la licenza della Gilda la tua merce non paga la gabella. Per un giorno, sei un allevatore."
        quando: [licenza-gilda >= 1]
        esito:
          titolo: Allevatore per un giorno
          testo: |
            Mostri la licenza e dici che le galline sono tue, e la ragazza
            capisce al volo e ti passa la gabbia sulla schiena. Pesa più di
            quanto pensassi, e qualcuno dentro ti tira i capelli. Il Custode
            studia la licenza a lungo, alza gli occhi sulle galline e alla
            fine timbra. Dall'altra parte del gabbiotto le restituisci la gabbia.
            Lei ti accompagna fino al Mercato raccontandoti dei carri che
            passano di notte dalle parti di Laresh, carichi di grano che nessun
            mulino ha macinato.
          effetti: { informazioni.voce: 1, tormento: -0.5 }

  - id: carta-ponti-il-conto-delle-botti
    immagine: personaggi/varn-kett
    titolo: Il conto delle botti
    sommario: "Varn Kett ha bisogno di un testimone che non sia della Gilda, e tu passavi di lì nel momento sbagliato."
    luogo: Mercato dei Nodi, la piattaforma dei bottai
    tipo: carta
    area: ponti-sospesi
    testo: |
      Sulla piattaforma dei bottai, in fondo al Mercato dei Nodi, le botti
      stanno impilate su tre file e legate con le cinghie, perché il ponte
      vibra e una botte che parte arriva dritta nella Cicatrice. Varn Kett è
      in piedi davanti alla pila con il cappotto color tabacco abbottonato
      fino al mento. Accanto a lui Ruggero Fosco, mercante d'olio, in un
      panciotto di velluto tirato sulla pancia, sorride a tutti quanti e
      anche alle botti.

      {ingannare Facile} Chi sorride anche alle botti vuole che si guardi lui
      e si guardino poco loro. Il panciotto è velluto buono, e i bottoni sono
      di ottone che finge di essere oro.

      «Lei» dice Varn, e ti indica senza alzare la mano. «Conti queste botti
      e mi dica il numero ad alta voce. Mi serve un testimone che non sia
      della Gilda, così il signor Fosco non potrà dire che il numero me lo
      sono inventato.» Le dita gli si muovono sul fianco, piano, come se
      scrivessero.

      Mentre ti avvicini alla pila il mercante ti passa accanto e ti lascia
      cadere qualcosa nella tasca della giubba. Senti il tintinnio, e subito
      dopo il suo profumo di acqua di rose, così dolce che ti si incolla al
      palato. La tasca adesso pesa da una parte sola.

      {acrobazia Media} Fra la pila e il parapetto c'è lo spazio di una
      spalla, e sotto il parapetto c'è la Cicatrice. Ci si passa di lato,
      a patto di non guardare giù.
    opzioni:
      - testo: "Contare come si deve"
        descrizione: "Le file sono tre, e quella dietro si vede male. Forse è messa apposta per vedersi male."
        prova: { attributo: mentale, abilita: percezione, difficolta: Media }
        successo:
          titolo: La fila di dietro
          testo: |
            Conti la prima fila e la seconda, poi ti infili fra la pila e il
            parapetto, con il vento che ti tira la giubba verso il vuoto, e
            trovi la terza, più lunga delle altre, nascosta da un telo color
            legno. Dici il numero ad alta voce, e Fosco smette di sorridere.
            Varn resta impassibile, e soltanto le dita sul fianco si fermano a
            metà di una riga invisibile. Più tardi un garzone della Gilda ti
            porta la paga del testimone, e nella tasca della giubba hai ancora
            la moneta del mercante, che nessuno ti chiede indietro.
          effetti: { monete: 3, rep.gilda: 0.5 }
        fallimento:
          titolo: Il telo color legno
          testo: |
            Conti due volte e ti viene lo stesso numero, e lo dici con sicurezza.
            Varn ti ringrazia, poi gira intorno alla pila, solleva un telo color
            legno e scopre una terza fila di botti che non avevi visto. Rifà il
            conto da solo a mezza voce. Ogni numero che dice è un po' più
            freddo del precedente. Fosco ti guarda con una gratitudine che ti
            mette a disagio, e Varn non ti guarda più.
      - testo: "Sbagliare il conto a favore del mercante"
        descrizione: "Una moneta in tasca, e altre se il numero viene basso. Varn Kett però non ha mai sbagliato una riga."
        prova: { attributo: sociale, abilita: ingannare, difficolta: Media }
        successo:
          titolo: Un numero tondo
          testo: |
            Conti con calma muovendo le labbra, poi dici un numero tondo e
            credibile, più basso di una fila. Varn lo ripete e lo annota, e per
            un momento ti sembra che le dita sul fianco esitino.

            {empatia Media} Il numero l'ha scritto senza crederci. Ha deciso
            anche di ricordarsi di te.

            Poi ti ringrazia e se ne va. La sera un ragazzo con il grembiule unto ti
            ferma al Grifone e ti mette in mano un sacchetto da parte del signor
            Fosco, che odora di acqua di rose.
          effetti: { monete: 4, sospetto: 0.5 }
        fallimento:
          titolo: La riga di Varn
          testo: |
            Dici il tuo numero, e Varn non lo ripete. Gira intorno alla pila e
            solleva un telo, sotto il quale c'è la fila di dietro, poi ti chiede
            di svuotare la tasca della giubba davanti a tutti. Le orecchie ti
            bruciano mentre lo fai. La moneta di Fosco finisce nel registro
            della Gilda come prova, e il tuo nome accanto. Il mercante,
            intanto, ha già trovato un appuntamento urgente dall'altra parte del
            Mercato.
          effetti: { sospetto: 1, rep.gilda: -0.5 }
      - testo: "Restituire la moneta davanti a Varn"
        descrizione: "Tirarla fuori dalla tasca e posarla sul coperchio della prima botte, dove la vedano tutti."
        esito:
          titolo: Sul coperchio
          testo: |
            Tiri fuori la moneta e la posi sul coperchio della prima botte, dove
            gira due volte su se stessa prima di fermarsi. Fosco diventa del colore
            del suo vino, e Varn guarda la moneta senza toccarla. Poi conta le botti
            da solo, compresa la fila nascosta sotto un telo, e quando ha finito ti
            accompagna fino alla passerella. Strada facendo ti racconta che i Fosco
            pagano la Gilda con l'olio annacquato da tre generazioni. Secondo lui
            era ora che qualcuno se ne accorgesse davanti a un testimone.
          effetti: { rep.gilda: 0.5, informazioni.pettegolezzo: 1 }

  - id: carta-ponti-i-colli-senza-padrone
    immagine: icone/cargo-crate
    titolo: I colli senza padrone
    sommario: "Una volta al mese i Custodi mettono all'asta i colli che nessuno è tornato a prendere. Si compra a scatola chiusa."
    luogo: Ponte delle Mille Corde, la piattaforma dietro il gabbiotto
    tipo: carta
    area: ponti-sospesi
    testo: |
      Una volta al mese, sulla piattaforma dietro il gabbiotto, i Custodi di
      Passaggio vendono all'asta i colli che nessuno è tornato a reclamare.
      Ci sono casse senza bolla e involti di tela cerata con l'indirizzo
      lavato dalla pioggia. Si compra a scatola chiusa, e la regola vuole che
      nessuno scuota niente prima di avere pagato. Il banditore è un Custode
      anziano con la voce rovinata, che a ogni offerta batte un martelletto
      di legno su un barile e a ogni battuta tossisce.

      Intorno al barile stanno soprattutto i rigattieri del Mercato dei
      Nodi, che si conoscono tutti e alzano la mano a turno, senza fretta,
      come a una partita di Zekar di cui sanno già il finale.

      {conoscenze-della-strada Media} Il finale l'hanno deciso stamattina,
      davanti a un bicchiere. Le mani alzate a turno servono a far salire il
      prezzo a chi non è della compagnia.

      Un ragazzo del Grifone è venuto per una cassa sola e la guarda da
      lontano con un'adorazione che fa tenerezza, tormentandosi un bottone
      della giacca. Il banditore annuncia il lotto successivo, e a metà del
      numero la voce gli si rompe del tutto.

      {medicina Facile fallita} Acqua e miele, e passa tutto. Lo suggerisci
      con sicurezza, ed è lo stesso rimedio che proponi per il mal di denti.
    opzioni:
      - testo: "Puntare sul collo giusto"
        descrizione: "Le bolle sono sparite. Restano i sigilli e le cuciture, che a chi li sa leggere dicono da dove arriva un collo."
        requisiti: [monete >= 3]
        prova: { attributo: mentale, abilita: [politica-ed-economia, percezione], difficolta: Media }
        successo:
          titolo: La ceralacca di Pannion
          testo: |
            Scegli una cassetta piccola, chiusa con la ceralacca blu che usano
            i molatori di lenti di Pannion, e la spunti con un'offerta sola
            perché i rigattieri la guardano appena. Dentro, fra la paglia,
            trovi un cristallo limpido senza un graffio e un frammento di
            metallo inciso, avvolti con cura in un fazzoletto ricamato. Qualcuno
            li aspettava, e non è mai venuto a prenderli.

            {tecnologia Media} L'incisione sul metallo è troppo regolare per una
            mano. L'ha fatta una macchina, e di macchine così a Pannion ce ne
            sono poche.
          effetti: { monete: -3, cristalli.cristallo-sterile: 1, reliquie.frammento-inciso: 1 }
        fallimento:
          titolo: Stivali spaiati
          testo: |
            Il sacco che scegli è pesante e fa un rumore promettente, e un
            rigattiere ti lascia vincere con un sorriso che avresti dovuto notare,
            largo fino al dente d'oro. Dentro ci sono stivali spaiati, tutti del
            piede sinistro, e in fondo un rotolo di tela pulita. La tela almeno la
            tagli a strisce, e la sera ne hai fatto un rotolo di bende.
          effetti: { monete: -3, bende: 1 }
      - testo: "Prendere il martelletto"
        descrizione: "Al banditore è andata via la voce. A te no, e i rigattieri pagano di più quando si divertono."
        prova: { attributo: sociale, abilita: espressivita, difficolta: Media }
        successo:
          titolo: Il banditore
          testo: |
            Il Custode ti passa il martelletto con un'occhiata di gratitudine e
            si siede sul barile a bere acqua e miele. Tu presenti ogni lotto come
            se venisse dal tesoro di un re, e i rigattieri ridono e alzano la
            mano più spesso di quanto vorrebbero. Una cassa di cucchiai
            spaiati diventa l'argenteria di un Casato decaduto, e la compra il
            più vecchio di loro. Il ragazzo del Grifone si
            porta a casa la sua cassa. A fine asta il Custode ti allunga una
            parte dell'incasso e scrive il tuo nome su un foglio, per il mese
            prossimo.
          effetti: { monete: 3, rep.gilda: 0.5 }
        fallimento:
          titolo: Il lotto sbagliato
          testo: |
            Prendi il martelletto e cominci bene, con la voce che ti esce larga e
            sicura, finché non confondi due lotti e aggiudichi a un rigattiere una
            cassa di candele al prezzo di un sacco di chiodi. Lui paga in fretta e
            se ne va prima che qualcuno se ne accorga. Il banditore si riprende il
            martelletto senza una parola, e per il resto dell'asta i rigattieri ti
            chiamano *maestro*.
          effetti: { scandalo: 0.5 }
      - testo: "Comprare il lotto che non vuole nessuno"
        descrizione: "Un pacco di lettere legate con lo spago. Il banditore lo offre per quasi niente, e nessuno alza la mano."
        requisiti: [monete >= 1]
        esito:
          titolo: Le lettere non consegnate
          testo: |
            Le lettere sono una trentina, tutte per lo stesso indirizzo dei
            Quartieri Alti, e non sono mai state aperte. Le leggi la sera al
            lume di una candela, con un po' di vergogna e il coltello sotto i
            sigilli. Parlano di affari andati male e di un debito di gioco, e
            in una c'è il nome di un Custode che chiudeva un occhio a
            pagamento.

            {accademiche Media} La grafia è ordinata nelle prime lettere e
            sempre più stretta nelle ultime. Chi scriveva aveva studiato, e
            alla fine aveva fretta.

            A metà della terza ti accorgi di tenere il fiato, come se qualcuno
            potesse sentirti leggere.
          effetti: { monete: -1, informazioni.voce: 2 }

  - id: carta-ponti-la-casa-che-dondola
    immagine: ambientazione/ponti-sospesi
    titolo: La casa che dondola
    sommario: "Al margine del reticolo una casa appesa ha perso una delle sue corde, e il vento la sbatte contro la trave maestra."
    luogo: Ponti Sospesi, le case appese del margine
    tipo: carta
    area: ponti-sospesi
    testo: |
      Ai margini del reticolo le case appese stanno sotto le travi come nidi
      di vespe. Sono di legno e lamiera, e ognuna è tenuta da quattro corde
      che i padroni di casa controllano ogni sera con la mano. Stasera
      il vento sale di traverso dalla Cicatrice, e una delle case ha perso la
      corda dell'angolo verso il vuoto. Pende di sbieco, e a ogni raffica
      batte contro la trave maestra con un colpo sordo che senti nei denti.

      {acrobazia Media} La trave è larga quanto due piedi messi di fianco, e
      bagnata solo sul lato del vento. Si cammina sull'altro, con il peso
      basso.

      Dalla finestra si affaccia un vecchio con il berretto da notte e un
      bambino in braccio, e alle sue spalle si sente rotolare un mobile sul
      pavimento inclinato. I vicini si sono radunati sulla passerella più
      vicina e danno consigli tutti insieme. Uno tiene in mano un rotolo di
      corda nuova, però nessuno si offre di portarla fino all'angolo.

      {origine apprendista-raschiatore} Il nodo per una corda d'angolo lo
      sai, perché sulle piattaforme te l'hanno fatto legare al buio finché le
      dita non l'hanno imparato da sole. Il vuoto sotto la trave è quello
      della Cicatrice, soltanto con le finestre accese intorno.

      {intimidire Facile fallita} Basterebbe gridare più forte di tutti. Ci
      provi dentro la testa, e anche lì ti esce una voce da chierichetto.
    opzioni:
      - testo: "Portare la corda fino all'angolo"
        descrizione: "Lungo la trave, con il vuoto sotto e il vento di traverso. Il nodo te lo gridano i vicini."
        prova: { attributo: fisico, abilita: acrobazia, difficolta: Media }
        successo:
          titolo: Il nodo dei vicini
          testo: |
            Cammini sulla trave con le braccia larghe e la corda a tracolla, mentre
            i vicini ti gridano il nodo tutti insieme e ognuno a modo suo. Alla fine
            le mani fanno da sole un nodo che ti sorprende, e il nodo regge. La casa
            si raddrizza con un lungo cigolio, e dentro qualcosa smette di rotolare.
            Ti accorgi solo adesso di non aver respirato per tutto il tempo. Il
            vecchio ti fa entrare e ti regala un vasetto di unguento che sua moglie
            preparava, e che lui continua a preparare con la sua ricetta anche
            adesso che lei non c'è più.
          effetti: { unguento: 1 }
        fallimento:
          titolo: Le mani sulla trave
          testo: |
            A metà trave una raffica ti prende di fianco e ti ritrovi appeso con
            le braccia, la corda che penzola sotto i tuoi piedi e il vuoto che
            ti tira gli stivali con una pazienza tutta sua. I vicini ti
            tirano su per la cintura, e alla fine la corda la legano i
            ponteggiatori della Gilda, arrivati con calma. Hai le mani
            scorticate fino al polso e una spalla che domani ti farà sapere
            come la pensa.
          effetti: { ferite: 1 }
      - testo: "Tenere ferma la casa mentre escono"
        descrizione: "Dall'angolo sano pende una fune di servizio. Tenendola tesa contro il vento si dà al vecchio il tempo di uscire con il bambino."
        prova: { attributo: fisico, abilita: resistenza, difficolta: Facile }
        successo:
          titolo: La fune tesa
          testo: |
            Ti avvolgi la fune intorno al braccio e punti i piedi sulla
            passerella. A ogni raffica la casa ti tira verso il vuoto, e tu tiri
            indietro finché le spalle ti bruciano. Il vecchio esce con il
            bambino, poi torna dentro a prendere una gabbia con un merlo, e
            soltanto allora ti dice che puoi lasciare.

            {resistenza Facile} Le spalle ti diranno domani cosa pensano del
            merlo. Per adesso tengono, e ti basta.

            Il bambino ti guarda per tutto il tempo che i ponteggiatori impiegano a
            rifare l'angolo.
          effetti: { tormento: -0.5 }
        fallimento:
          titolo: Lo strappo
          testo: |
            Tieni la fune finché il vecchio passa il bambino ai vicini, poi una
            raffica più forte delle altre te la strappa di mano e ti brucia il
            palmo. Il vecchio riesce a uscire lo stesso aggrappandosi alla
            porta, poi si siede sulla passerella a riprendere fiato. Restate
            tutti e due senza parole, e le mani ti tremano per un'ora, anche
            quando le infili sotto le ascelle per fermarle.
          effetti: { ferite: 0.5 }
      - testo: "Mettere d'accordo i vicini"
        descrizione: "Sono in dieci e hanno tutti un'idea. Basterebbe che ne avessero una sola."
        prova: { attributo: sociale, abilita: [persuasione, intimidire], difficolta: Media }
        successo:
          titolo: Una catena di braccia
          testo: |
            Alzi la voce sopra le loro, e ti esce il tono dei capisquadra, che
            fino a stamattina credevi di non avere. Quando si girano gli dai un compito
            ciascuno. Due tengono la passerella, tre passano la corda di mano in
            mano fino all'angolo, e il più leggero la lega. Ci mettono meno di
            quanto ci hanno messo a litigare. Dopo si passano una bottiglia sulla
            passerella, e uno di loro ti racconta chi dei Custodi lascia passare
            i carri senza contarli, in cambio di una cassa di vino.
          effetti: { informazioni.voce: 1 }
        fallimento:
          titolo: Più forte
          testo: |
            Alzi la voce, e loro alzano la loro, e in breve la passerella
            sembra un mercato del pesce. Mentre discutete la casa perde
            un'altra corda e resta appesa per due angoli soltanto, e il vecchio
            esce dalla finestra con il bambino a forza di braccia, da solo. I
            ponteggiatori arrivano a cose fatte e chiedono chi è il responsabile,
            e dieci dita indicano te.
          effetti: { scandalo: 0.5 }

  - id: carta-ponti-il-ladro-con-le-ali
    immagine: icone/seagull
    titolo: Il ladro con le ali
    sommario: "Un gabbiano di cresta grigia ha strappato la borsa di mano a una venditrice di pesce, e adesso se la tiene sul cavo più alto del Mercato."
    luogo: Mercato dei Nodi, sotto le funi delle lanterne
    tipo: carta
    area: ponti-sospesi
    testo: |
      I gabbiani di cresta grigia salgono dalla Cicatrice la mattina e se ne
      tornano giù la sera, sempre più grassi, con la sicurezza degli
      esattori. Hanno il becco giallo con la punta nera e sulla testa un
      ciuffo di piume color cenere che si alza quando sono contenti. Il più
      grosso ha appena strappato la borsa dalle mani di una venditrice di
      pesce secco, ed è volato sul cavo più alto del Mercato, quello che
      regge le lanterne della piattaforma centrale.

      Adesso se ne sta lassù con la cresta dritta e la borsa nel becco, e la
      soppesa girando la testa.

      {origine figlio-del-circolo} Nel Bosco di Velthar i gabbiani non
      arrivano, e questo ti sembra una gazza a cui la città ha dato troppo da
      mangiare. Le gazze del bosco, almeno, le cose lucide le rubavano
      soltanto per guardarle.

      {natura Facile} Il ciuffo alzato vuol dire che è soddisfatto di sé. Un
      gabbiano soddisfatto si distrae facilmente, soprattutto davanti a
      qualcosa che puzza di pesce.

      {armi-da-distanza Media fallita} Il bersaglio è grosso e sta fermo, e
      il braccio ti prude. Della folla che c'è sotto, al braccio, non
      importa niente.

      La venditrice è una donna larga con le braccia nude fino alle spalle, e
      lo insulta in un dialetto che non conosci e che si capisce benissimo. Ti
      vede guardare in su e ti afferra il polso con una mano che sa di sale.
      «Dentro c'è l'incasso della settimana» dice, stringendo più forte. «Chi
      me la riporta mangia pesce gratis fino all'inverno.»
    opzioni:
      - testo: "Tirargli qualcosa"
        descrizione: "Un sasso, una castagna, il manico di un coltello. Il cavo è alto, e sotto c'è la folla."
        prova: { attributo: fisico, abilita: armi-da-distanza, difficolta: Media }
        successo:
          titolo: Una castagna ben tirata
          testo: |
            Prendi una castagna dal cartoccio di un ragazzo, che protesta più
            per la castagna che per il gabbiano, e la tiri con tutto il
            braccio. La castagna prende il gabbiano sotto l'ala, e lui
            strilla aprendo il becco. La borsa cade dritta sul tendone di un
            banco di stoffe, e la venditrice la recupera con un manico di scopa
            e ti bacia sulle guance. Del pesce gratis nessuno parla più. In
            compenso ti mette in mano qualche moneta, contandola due volte.
          effetti: { monete: 2 }
        fallimento:
          titolo: La lanterna
          testo: |
            Il sasso passa a un palmo dal gabbiano e prende in pieno il vetro di
            una lanterna. I cocci piovono sulla folla, e il gabbiano se ne va
            con calma, verso il fondo della Cicatrice, con la borsa. Un Custode
            si fa largo fino a te con la tavoletta in mano, e tu ti trovi a
            nascondere la mano dietro la schiena come un bambino. La
            venditrice, che un minuto fa ti teneva il polso, adesso dice di
            non averti mai visto.
          effetti: { scandalo: 0.5 }
      - testo: "Arrampicarsi sul palo delle lanterne"
        descrizione: "Il palo è liscio e unto, il cavo è più in alto ancora. Il gabbiano ti guarderà arrivare."
        prova: { attributo: fisico, abilita: atletica, difficolta: Difficile }
        successo:
          titolo: Il nido sul cavo
          testo: |
            Sali il palo a forza di ginocchia, con l'unto che ti entra nelle
            pieghe dei calzoni, e dal palo passi sul cavo con le gambe
            incrociate sotto. Il gabbiano ti becca due volte la mano e poi
            se ne va, offeso, lasciando la borsa nel nido. Il nido è un groviglio
            di spago e di cose lucide, e fra le cose lucide ci sono un paio di
            monete forestiere e qualche scheggia di metallo inciso. La
            venditrice ti lascia tenere tutto quello che non è suo.
          effetti: { monete: 2, reliquie.scheggia: 2 }
        fallimento:
          titolo: Il palo unto
          testo: |
            A metà del palo il gabbiano decide che sei un pericolo e ti piomba sulla
            testa con il becco aperto. Scivoli giù per tutta la lunghezza del palo e
            atterri sulle assi con un tonfo che fa girare mezzo Mercato e ti svuota
            i polmoni in un colpo solo. Il gabbiano torna sul cavo, si sistema le
            piume e riprende a soppesare la borsa.
          effetti: { ferite: 1 }
      - testo: "Offrirgli un pesce in cambio"
        descrizione: "Un gabbiano non sa tenere due cose nel becco, e il pesce secco gli piace più dei soldi."
        prova: { attributo: mentale, abilita: natura, difficolta: Facile }
        successo:
          titolo: Lo scambio
          testo: |
            Prendi un'aringa secca dalla cesta e la fai girare in aria, e
            l'odore ti resta sulle dita fino a sera. Quando il gabbiano la
            vede la lanci in alto, e lui apre il becco per
            prenderla al volo. La borsa cade nelle mani della venditrice. Lei
            ride forte, ti regala l'aringa che resta e qualche spicciolo, e ti
            racconta chi fra i mercanti di Laresh paga il pesce in ritardo e
            perché.
          effetti: { monete: 1, informazioni.voce: 1 }
        fallimento:
          titolo: Due cose nel becco
          testo: |
            Lanci l'aringa, e il gabbiano la prende al volo senza lasciare la borsa.
            Due cose nel becco le tiene benissimo, a quanto pare. Se ne va verso il
            fondo della Cicatrice con il pranzo e l'incasso, e la venditrice si
            siede sulla cesta e ride fino alle lacrime, perché a quel punto c'è
            soltanto da ridere.

  - id: carta-ponti-un-peso-in-piu
    immagine: icone/swap-bag
    titolo: Un peso in più
    sommario: "Nella calca prima del gabbiotto qualcuno ti ha infilato nella borsa un involto che non è tuo, e i Custodi stanno aprendo le borse."
    luogo: Ponte delle Mille Corde, nella calca prima del gabbiotto
    tipo: carta
    area: ponti-sospesi
    testo: |
      Nella calca prima del gabbiotto la gente si spinge con i gomiti e con
      le ceste, e ti ritrovi schiacciato fra un facchino e una donna che
      porta un'oca sotto il braccio. Quando la fila si allenta la borsa ti
      pesa in modo diverso sulla spalla. Ci infili la mano e trovi un
      involto di tela cerata grande come un mattone, legato con lo spago,
      che prima non c'era e che ha il freddo dei sassi. Il sudore ti si
      raffredda sulla nuca prima ancora che tu abbia capito perché.

      {origine figlio-della-citta-bassa} Da ragazzino, quando portavi i
      messaggi degli Scuri su e giù per Via del Salmone, ti avevano insegnato
      a non guardare mai dentro quello che portavi. Chi ti infilava qualcosa
      in borsa senza dirtelo, però, lo faceva perché a farti prendere fossi
      tu al posto suo.

      Più avanti i Custodi di Passaggio fanno aprire le borse a chi passa, e
      un cane magro annusa le caviglie della fila.

      {addestrare-animali Facile} Il cane annusa per dovere ed è stanco. Lo
      distrae qualunque cosa faccia più rumore di te, e a due passi c'è
      un'oca.

      Oltre il gabbiotto, appoggiato al parapetto, un uomo con un cappuccio
      di tela cerata mangia una mela e guarda dalla tua parte con molta
      pazienza.

      {percezione Media} Mangia piano, a morsi piccoli intorno al torsolo,
      per farla durare. È lì da prima che tu arrivassi in fila.

      *Il mattone ce l'ha messo lui, e adesso aspetta che glielo porti fuori
      io.* Le tue dita si sono già chiuse sullo spago.
    opzioni:
      - testo: "Liberartene senza farti vedere"
        descrizione: "Il parapetto è a un passo, e sotto le assi ci sono le reti. Basta un momento in cui nessuno guarda."
        prova: { attributo: fisico, abilita: furtivita, difficolta: Media }
        successo:
          titolo: Nelle reti
          testo: |
            Aspetti che il cane si metta ad abbaiare all'oca, e lasci scivolare
            l'involto oltre il parapetto con la mano bassa. Lo senti cadere nelle
            reti dei sottoponti con un tonfo morbido. Al gabbiotto apri la borsa con
            l'aria più annoiata che hai, mentre il cuore ti batte nelle orecchie
            così forte che ti pare lo sentano anche loro. L'uomo con la mela ha
            smesso di mangiare, e tu adesso la sua faccia la conosci bene, dal neo
            sulla guancia alla cicatrice sul labbro.
          effetti: { informazioni.voce: 1 }
        fallimento:
          titolo: Il cane
          testo: |
            L'involto ti scivola dalle dita a metà strada e cade sulle assi, proprio
            sotto il naso del cane. Il Custode lo apre davanti a tutti e dentro ci
            sono cristalli carichi senza il timbro della Gilda. Passi il resto del
            pomeriggio nel gabbiotto a spiegare che non sono tuoi, seduto su uno
            sgabello con una gamba più corta delle altre, e alla fine ti lasciano
            andare, però il tuo nome resta nel registro. L'uomo con la mela se n'è
            andato da un pezzo.
          effetti: { sospetto: 1 }
      - testo: "Consegnarlo ai Custodi"
        descrizione: "Dire subito che non è tuo, e lasciare che lo aprano loro."
        esito:
          titolo: Senza timbro
          testo: |
            Posi l'involto sul davanzale della finestrella e spieghi com'è
            arrivato nella tua borsa. Il Custode lo apre con la punta del
            coltello. Dentro ci sono cristalli carichi senza il timbro della
            Gilda, avvolti nella lana. Quando ti volti per indicare l'uomo con la
            mela, al parapetto c'è soltanto il torsolo, mangiato fino ai semi.

            {magia Media} I cristalli dentro la lana ronzano piano, tutti sulla
            stessa nota. Li ha caricati di recente una mano sola.

            Il Custode scrive il tuo nome nel registro, nella colonna di quelli che
            hanno fatto il loro dovere, la più corta delle due.
          effetti: { rep.gilda: 0.5 }
      - testo: "Portarlo all'uomo con la mela"
        descrizione: "Passare il gabbiotto con l'involto, e poi chiedere la paga del corriere. Chi usa le borse degli altri sa che si paga."
        prova: { attributo: sociale, abilita: conoscenze-della-strada, difficolta: Media }
        successo:
          titolo: La paga del corriere
          testo: |
            Al gabbiotto il Custode è impegnato con l'oca, e tu passi con la borsa
            chiusa. L'uomo con la mela ti vede arrivare e si stacca dal parapetto.
            Gli dici quanto costa il trasporto, senza abbassare la voce, e lui ti
            guarda come si guarda un collega. Ti mette in mano una borsa piccola e
            pesante. Poi si riprende l'involto e sparisce giù per una scala a pioli
            che non avevi notato.
          effetti: { monete: 4, sospetto: 0.5 }
        fallimento:
          titolo: Il taglio sulla cinghia
          testo: |
            Passi il gabbiotto e porti l'involto all'uomo con la mela, e gli chiedi
            la tua parte. Lui ti allunga una moneta sola, e mentre la guardi, offeso
            dalla cifra, un ragazzo ti passa alle spalle e taglia la cinghia della
            borsa con un coltellino. Quando ti giri il ragazzo è già giù per la
            scala a pioli con l'involto, e a te resta un graffio lungo sulla mano.
          effetti: { monete: 1, ferite: 0.5 }

  - id: carta-ponti-la-lanterna-che-sfrigola
    immagine: icone/old-lantern
    titolo: La lanterna che sfrigola
    sommario: "Una lanterna di Mana sputa scintille azzurre sopra la folla, e il lampionaio della Gilda la guarda dal basso senza decidersi a toccarla."
    luogo: Ponte delle Mille Corde, a metà campata
    tipo: carta
    area: ponti-sospesi
    testo: |
      A metà campata una delle lanterne di Mana ha cominciato a sfrigolare
      come grasso in padella. Il cristallo dentro il vetro pulsa a scatti,
      una volta troppo chiaro e la volta dopo quasi spento, e a ogni scatto
      sputa una scintilla azzurra che scende sulla folla e si spegne prima
      di toccare le assi. Sotto la lanterna la gente si allarga in cerchio e
      alza la testa, e un bambino allunga la mano per prendere una scintilla
      finché la madre non lo tira indietro per il colletto.

      Il lampionaio della Gilda è un uomo piccolo con un'asta lunga il
      doppio di lui, e tiene l'uncino a un palmo dal gancio della lanterna
      senza decidersi.

      {atletica Facile fallita} L'asta sembra leggera. Lo sembra a te, che
      non l'hai mai tenuta tesa per più di un respiro.

      «Quando fanno così si calmano da sole, oppure scoppiano» dice a
      nessuno in particolare. «Se scoppia prende fuoco la fune, e la fune
      regge mezza piattaforma.» Si gratta il collo con la mano libera.
      Nell'aria c'è l'odore di temporale che fanno i cristalli prima di
      cedere, e i peli delle braccia ti si rizzano da soli.

      {origine allievo-di-torvessa} Le prime formule dei cristalli le hai
      ripetute all'Accademia finché non ti venivano in sogno, e nessuna
      parlava di un cristallo che sfrigola sopra una folla. Orvald Temmerin,
      se glielo chiedessi due volte, ti darebbe due risposte diverse e
      ugualmente giuste a metà.

      {magia Media} Il Mana dentro il vetro tira da una parte sola. È un
      cristallo stanco più che rotto, e i cristalli stanchi si lasciano
      convincere da chi ha la pazienza di farlo.
    opzioni:
      - testo: "Rimettere in pari il cristallo"
        descrizione: "Un cristallo che pulsa così ha il Mana sbilanciato. Con le mani vicine al vetro e la formula giusta torna quieto."
        prova: { attributo: mentale, abilita: magia, difficolta: Media }
        successo:
          titolo: Il polso del cristallo
          testo: |
            Ti metti sotto la lanterna con le mani aperte e senti il Mana
            andare e venire come un respiro affannato. Lo accompagni piano, con
            la formula che si usa per i cristalli stanchi, finché il polso
            rallenta e la luce si ferma su un bianco tranquillo. Ti accorgi di
            aver rallentato anche tu il respiro, per fargli compagnia. Il
            lampionaio ti guarda con la bocca aperta. Poi fruga nella borsa degli attrezzi
            e ti regala i frammenti esausti che ha tolto dalle lanterne della
            settimana.
          effetti: { cristalli.frammento-esausto: 2 }
        fallimento:
          titolo: La scintilla
          testo: |
            Il Mana ti scappa fra le dita, e la lanterna risponde con una scintilla
            più grossa delle altre che ti colpisce il dorso della mano. Per un
            momento senti nella testa un ronzio di vetro, come un bicchiere fatto
            cantare con un dito bagnato. Il cristallo si calma da solo poco dopo,
            come aveva detto il lampionaio, che ha la delicatezza di non
            ricordartelo. A te resta una bruciatura rotonda sulla mano e un sapore
            metallico in bocca fino a sera.
          effetti: { tormento: 0.5, ferite: 0.5 }
      - testo: "Staccarla dalla fune"
        descrizione: "Il gancio ha un fermo a molla. Se lo apri nel momento giusto la lanterna viene via, e la fune resta fuori dai guai."
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Media }
        successo:
          titolo: Il fermo a molla
          testo: |
            Prendi l'asta al lampionaio, aspetti uno scatto spento e apri il
            fermo con l'uncino. La lanterna scende nelle tue mani, calda come
            una pagnotta, e la posi su un secchio d'acqua che qualcuno ha
            portato. Il cristallo dentro è crepato da parte a parte, e di Mana
            non ne ha più.

            {tecnologia Facile} La molla del fermo è arrugginita a metà. Fra un
            mese o due avrebbe ceduto comunque, anche senza scintille.

            Il lampionaio te lo lascia, perché alla Gilda i
            cristalli crepati vanno denunciati e lui non ha voglia di scrivere.
          effetti: { cristalli.cristallo-sterile: 1 }
        fallimento:
          titolo: La scossa
          testo: |
            Apri il fermo nel momento sbagliato, e la scossa scende lungo l'asta
            fino alle tue mani. Ti ritrovi seduto sulle assi con le dita intorpidite
            e i capelli dritti, e un bambino ti indica alla madre ridendo. La
            lanterna, intanto, ha deciso di calmarsi da sola. Il lampionaio ti aiuta
            ad alzarti e ti consiglia, con affetto, di non toccare più niente che
            abbia dentro un cristallo.
          effetti: { ferite: 1 }
      - testo: "Allontanare la gente e lasciarla scoppiare"
        descrizione: "Se proprio deve scoppiare, meglio che sotto non ci sia nessuno."
        esito:
          titolo: Vetri azzurri
          testo: |
            Allarghi le braccia e spingi indietro la folla, che si lascia
            spingere brontolando perché voleva vedere, e il lampionaio ti
            dà una mano a voce. La lanterna scoppia quando sotto non c'è più
            nessuno, con un colpo secco, e la fune si annerisce per un tratto ma
            regge. Sulle assi restano vetri azzurri e qualche frammento di
            cristallo. Un Custode arriva a scrivere una multa al lampionaio, e
            lui, mentre firma, ti indica come quello che ha salvato la
            piattaforma.
          effetti: { cristalli.frammento-esausto: 1, rep.gilda: 0.5 }

  - id: carta-ponti-il-cantastorie-senza-voce
    immagine: icone/scroll-unfurled
    titolo: Il cantastorie senza voce
    sommario: "Bastiano Rocca racconta storie sullo slargo della campana da trent'anni, e stamattina gli è rimasto un filo di voce."
    luogo: Ponte delle Mille Corde, lo slargo della campana
    tipo: carta
    area: ponti-sospesi
    testo: |
      Dove il Ponte delle Mille Corde si allarga intorno al palo della
      campana, Bastiano Rocca racconta storie da prima che arrivassero le
      lanterne di Mana. Ha un cappello a tesa larga rovesciato ai piedi per
      le offerte e una bacchetta per indicare i mostri e gli eroi del telone
      dipinto alle sue spalle. Sono sempre gli stessi, con i colori
      consumati dalle dita dei bambini, e al drago manca ormai mezza coda.

      {accademiche Media fallita} Quel drago deve venire da una cronaca
      antica, che di sicuro gli dava anche un nome. Ti torna in mente soltanto che da
      bambino gli avevi dato un nome tu, e non ricordi nemmeno quello.

      Stamattina la gente è già seduta sulle assi. Bastiano apre la bocca e
      ne esce un soffio rauco. Ci riprova, e gli viene soltanto la tosse. I
      bambini in prima fila ridono, e i facchini in fondo cominciano ad
      alzarsi. Bastiano cerca qualcuno fra la folla, chissà perché trova
      proprio te, e ti porge la bacchetta con un inchino da teatro, tenendosi
      l'altra mano sulla gola.

      {origine accolito-del-velo} La voce se ne va così ai ragazzi del coro
      dopo le notti di veglia in Cattedrale, e Padre Vantes li mette a sedere
      in sagrestia con una tazza calda e l'ordine di stare zitti. Senza
      volerlo cerchi una tazza con gli occhi.

      {espressivita Media} Il pubblico è già seduto e ha già pagato con
      l'attesa. Basta non farlo alzare nei primi tre respiri, poi è tuo.
    opzioni:
      - testo: "Raccontare una storia vera"
        descrizione: "Una cosa che hai visto o fatto. Il telone lo usi per finta, i mostri ce li metti tu."
        requisiti: [racconto >= 1]
        esito:
          titolo: Il cappello pieno
          testo: |
            Racconti la tua storia indicando il telone a caso, con la gola secca
            nelle prime frasi, e dopo un po' la bacchetta non ti serve più. I
            facchini tornano a sedersi. Quando arrivi alla parte che fa paura un
            bambino si stringe alla gamba della madre, e alla fine il cappello è più
            pieno di quanto Bastiano l'abbia visto da anni. Lui insiste per darti la
            metà grande e ti stringe la mano fra le sue come si fa con un parente.
          effetti: { racconto: -1, monete: 5, tormento: -0.5 }
      - testo: "Inventarne una sul momento"
        descrizione: "Sul telone ci sono un cavaliere e una torre. Il resto si trova strada facendo."
        prova: { attributo: sociale, abilita: espressivita, difficolta: Media }
        successo:
          titolo: Il cavaliere che soffriva il vento
          testo: |
            Il tuo cavaliere soffre di vertigini, e per arrivare alla torre deve
            attraversare il Ponte delle Mille Corde. La gente lo riconosce
            subito, perché lo ha visto passare cento volte. I facchini ridono
            delle sue ginocchia molli, e i bambini gridano quando il ponte
            trema. Il drago, alla fine, gli paga la gabella, e la paga con la
            faccia offesa che fai tu al gabbiotto. Nel cappello piove una
            manciata di monete, e Bastiano ti fa il gesto dell'applauso senza
            far rumore.
          effetti: { monete: 3 }
        fallimento:
          titolo: La torre
          testo: |
            Cominci dal cavaliere e ti perdi alla torre, dove ti accorgi di non
            sapere perché il cavaliere ci stesse andando. I facchini se ne vanno
            per primi, poi le madri con i bambini. L'ultimo bambino, prima di
            andare, ti tira una castagna e dice che la storia di Bastiano era più
            bella. Bastiano ti riprende la bacchetta con delicatezza, come si
            riprende un attrezzo prestato a uno che non lo sa usare.
          effetti: { scandalo: 0.5 }
      - testo: "Guardargli la gola"
        descrizione: "Una voce che se ne va così in una notte ha di solito un motivo semplice."
        prova: { attributo: mentale, abilita: medicina, difficolta: Facile }
        successo:
          titolo: Miele e sale
          testo: |
            Gli fai aprire la bocca alla luce e trovi la gola rossa e gonfia,
            arrossata dal fumo delle lanterne e da una notte passata a parlare
            all'umido. Il fiato gli sa di acquavite, e lui ha il buon gusto di
            arrossire. Gli prescrivi miele e sale e una giornata di silenzio, e
            lui annuisce con gli occhi pieni di gratitudine. Il giorno dopo la
            voce è tornata. Bastiano ti racconta a bassa voce quello che ha
            sentito dire dalle prime file, e dalle prime file si sente tutto.
          effetti: { informazioni.voce: 2 }
        fallimento:
          titolo: Il rimedio sbagliato
          testo: |
            Gli consigli di bere qualcosa di forte per sciogliere la gola, e
            Bastiano, fiducioso, ti dà retta con la borraccia di un facchino. La
            voce non torna, in compenso tornano i colpi di tosse, più forti di
            prima.

            {medicina Facile fallita} Il forte scioglie tutto, lo dicono tutti al
            Grifone. Al Grifone, a pensarci bene, nessuno ha una bella voce.

            Raccoglie il telone e se ne va dallo slargo con il cappello vuoto sotto
            il braccio, e ti saluta lo stesso, con la mano.

  - id: carta-ponti-clelia-vennari
    immagine: icone/wax-seal
    titolo: L'ultima dei Vennari
    sommario: "Una signora anziana vende su un panno di velluto i ricordi di una famiglia che ha firmato il Patto delle Corde, e il rigattiere offre come per il ferro vecchio."
    luogo: Mercato dei Nodi, una piattaforma laterale
    tipo: carta
    area: ponti-sospesi
    requisiti: [visto.carta-ponti-clelia-vennari == 0]
    testo: |
      Su una piattaforma laterale del Mercato dei Nodi, dove arriva soltanto
      chi si è perso, una signora anziana ha steso un panno di velluto verde
      e ci ha disposto la sua roba in file ordinate. C'è una bilancia
      d'ottone da orafo con i pesi nella sua scatola, e accanto un calamaio
      con il coperchio a cupola. In fondo al panno, da solo, c'è un sigillo
      da ceralacca con il manico d'osso. Lei sta seduta su uno sgabello
      pieghevole, con la schiena diritta e i guanti di pizzo, e ha l'aria di
      ricevere visite. Uno dei guanti è rammendato sul pollice con un filo
      di un bianco appena diverso.

      {politica-ed-economia Media} Le famiglie del Patto vendono gli
      strumenti del mestiere per ultimi, dopo l'argenteria. Se
      siamo arrivati alla bilancia, i debiti sono arrivati a lei.

      Il rigattiere chino sul panno tocca tutto con due dita e borbotta
      prezzi, sempre più bassi. «Il sigillo glielo lascio, signora Vennari»
      dice. «Chi vuole che lo compri, un sigillo con un nome che non firma
      più niente?»

      {galateo Facile} Le ha parlato con il cappello in testa e lo sguardo
      sul velluto. In casa Vennari, una volta, uno così lo avrebbero fatto
      entrare dalla porta di servizio.

      Clelia Vennari non gli risponde. Ti vede passare e ti chiama con un
      cenno del mento, come si chiamava un servitore ai tempi in cui c'erano
      i servitori.

      {origine rampollo-dei-quartieri-alti} Il nome Vennari a casa tua si
      diceva a tavola, a mezza voce, insieme a quelli delle famiglie che hanno
      venduto troppo presto. A quel cenno del mento le gambe si muovono prima
      dell'orgoglio, perché è lo stesso con cui ti hanno chiamato per tutta
      l'infanzia.
    opzioni:
      - testo: "Trattare per lei"
        descrizione: "Con i modi di chi fa gli affari di una casa importante. Il rigattiere, quei modi, se li ricorda ancora."
        prova: { attributo: sociale, abilita: galateo, difficolta: Media }
        successo:
          titolo: L'agente di casa Vennari
          testo: |
            Ti metti alle spalle della signora e parli al rigattiere a voce bassa e
            senza fretta, come l'agente di una casa che ha ancora un nome, e ti
            sorprende quanto ti venga facile. Lui si raddrizza, si toglie il
            cappello e alza l'offerta per la bilancia due volte. Clelia vende
            soltanto la bilancia. Poi ti racconta di suo nonno, che firmò il Patto
            delle Corde con un nodo di fune al posto del nome perché scrivere non lo
            sapeva, e ti chiede di raccontarlo in giro.
          effetti: { racconto: 1, rep.gilda: 0.5 }
          imposta: { visto.carta-ponti-clelia-vennari: 1 }
        fallimento:
          titolo: Il cappello in testa
          testo: |
            Parli al rigattiere con tutti i modi che conosci, e lui ti ascolta
            con il cappello in testa, masticando qualcosa. Poi alza le spalle e
            se ne va a guardare un altro banco. Clelia ripiega il panno senza
            fretta, un angolo dopo l'altro, lisciando ogni piega con il dorso
            del guanto. Ti ringrazia per il disturbo con una
            cortesia perfetta, e tu ti senti congedato come un fornitore.
          imposta: { visto.carta-ponti-clelia-vennari: 1 }
      - testo: "Comprare il sigillo"
        descrizione: "Il nome non firma più niente. Il manico d'osso però è lavorato bene, e lei lo guarda come una cosa viva."
        requisiti: [monete >= 4]
        esito:
          titolo: Il manico d'osso
          testo: |
            Paghi il prezzo che chiede lei senza trattare. Il rigattiere ti
            guarda come uno che ha sbagliato mestiere. Clelia ti avvolge il
            sigillo in un fazzoletto di lino. A casa, girandolo fra le dita,
            senti il manico allentarsi, e dentro trovi un disco di metallo inciso
            con segni che non sono umani.

            {accademiche Difficile} Segni del genere li hai visti soltanto
            ricopiati, a margine di libri che in biblioteca non si prestano, e
            ricopiati facevano molta meno impressione.

            Il biglietto nel fazzoletto ti dice, con una grafia antica, quali
            famiglie della Gilda oggi siedono dove sedevano i Vennari.
          effetti: { monete: -4, reliquie.frammento-inciso: 1, informazioni.pettegolezzo: 1 }
          imposta: { visto.carta-ponti-clelia-vennari: 1 }
      - testo: "Guardare bene la bilancia"
        descrizione: "Ha i pesi marchiati con un segno che hai già visto, forse in un libro."
        prova: { attributo: mentale, abilita: accademiche, difficolta: Media }
        successo:
          titolo: I pesi del Patto
          testo: |
            Il segno sui pesi è quello dei primi campioni della Gilda, fusi
            l'anno del Patto delle Corde perché tutti i ponti pesassero allo
            stesso modo. Ne sono rimasti pochissimi. Lo dici a Clelia a bassa
            voce, e lei rimette la bilancia nella scatola davanti al rigattiere,
            peso per peso, ognuno nel suo incavo di velluto.
            Una settimana dopo un garzone della Biblioteca ti porta un biglietto
            di ringraziamento e una piccola somma, la tua parte.
          effetti: { monete: 3, informazioni.voce: 1 }
          imposta: { visto.carta-ponti-clelia-vennari: 1 }
        fallimento:
          titolo: Un segno qualunque
          testo: |
            Giri i pesi fra le dita e il segno ti sfugge. Ti sembra di averlo visto
            su una lapide del Cimitero, o forse su un boccale, e più ci pensi più
            diventa un boccale. Il rigattiere ti guardava di sottecchi. Adesso si
            rilassa e fa la sua offerta per la bilancia. Clelia accetta. Mentre se
            ne va, ti accorgi che il rigattiere ha preso i pesi con molta più cura
            del resto.
          imposta: { visto.carta-ponti-clelia-vennari: 1 }
      - testo: "Salutarla con il suo titolo"
        descrizione: "Nei Quartieri Alti qualcuno si ricorda ancora come ci si rivolge a una Vennari."
        quando: [origine.rampollo-dei-quartieri-alti >= 1]
        esito:
          titolo: Donna Clelia
          testo: |
            Le fai l'inchino che ti hanno insegnato da bambino, e la schiena se lo
            ricorda meglio di te. La chiami donna Clelia. Lei ti guarda a lungo, poi
            dice il nome di tua nonna e ti fa sedere sullo sgabello del rigattiere,
            che se ne va offeso. Per un'ora ti racconta i Quartieri Alti di quando
            le famiglie del Patto si contavano sulle dita, e chi ha comprato i
            debiti di chi. Prima di salutarti ti fa promettere di non vendere mai
            niente su un panno.
          effetti: { informazioni.pettegolezzo: 1, racconto: 1 }
          imposta: { visto.carta-ponti-clelia-vennari: 1 }

  - id: carta-ponti-il-posto-del-banco
    immagine: ambientazione/mercato-dei-nodi
    titolo: Il posto del banco
    sommario: "Due mercanti si contendono lo stesso pezzo di piattaforma, e uno dei due agita una copia del Patto delle Corde come un coltello."
    luogo: Mercato dei Nodi, la piattaforma centrale
    tipo: carta
    area: ponti-sospesi
    testo: |
      Sulla piattaforma centrale del Mercato dei Nodi due banchi sono montati
      uno addosso all'altro sullo stesso pezzo di assi, e i padroni si
      gridano in faccia sopra la merce. Il primo è un uomo anziano con il
      panciotto liso di una famiglia che aveva un nome, e sventola un foglio
      ingiallito che dice essere una copia del Patto delle Corde. La seconda
      è una ragazza di Laresh con le mani rosse di tintura, che ha pagato la
      licenza il mese scorso e lo ripete a ogni frase.

      {origine mercante-dei-ponti} Anche la tua licenza della Gilda sta in
      tasca piegata in quattro, e la mano ci va sopra da sola ogni volta che
      la ragazza nomina la sua. Ai banchi il Patto delle Corde lo tira fuori
      soltanto chi la licenza non l'ha più rinnovata.

      {empatia Media} Lui grida del Patto per non dover parlare d'altro. Il
      foglio gli trema in mano anche quando smette di sventolarlo.

      Intorno si è fatto un cerchio. Un Custode di Passaggio guarda da
      lontano e scrive qualcosa sulla tavoletta senza avvicinarsi, con la
      calma di uno che verrà pagato lo stesso. Il vecchio ha afferrato un
      rotolo di stoffa per buttarlo giù dal banco, lei gli ha bloccato il
      polso, e al panciotto è saltato un bottone che rotola verso il bordo
      della piattaforma.

      {rissa Facile} Il bastone appeso al banco il vecchio lo tiene a
      portata di mano senza guardarlo. La ragazza ha la presa di chi strizza
      stoffe tutto il giorno, e il polso di lui sta già cedendo.
    opzioni:
      - testo: "Separarli"
        descrizione: "Prendere lui per il colletto e lei per la spalla, prima che arrivi il bastone."
        prova: { attributo: fisico, abilita: rissa, difficolta: Facile }
        successo:
          titolo: A distanza di braccio
          testo: |
            Ti metti in mezzo e li allontani tenendoli a distanza di braccio, lui
            leggero come un fascio di stecchi e lei piantata sulle assi più di
            quanto sembrasse, finché smettono di dimenarsi e si limitano a
            guardarsi. Il Custode arriva in quel momento, come se aspettasse proprio
            quello, e assegna il posto con un tratto di gesso sulle assi. Ti
            ringrazia per avere evitato un verbale. Il bottone del panciotto lo
            raccogli tu e lo restituisci al vecchio, che lo prende senza dire
            grazie.
          effetti: { rep.gilda: 0.5 }
        fallimento:
          titolo: Il bastone
          testo: |
            Ti metti in mezzo nel momento in cui il vecchio alza il bastone, e il
            bastone trova la tua tempia. Ti siedi sulle assi a vedere le stelle
            in pieno giorno, e per un po' il Mercato ti arriva da molto lontano,
            come da sott'acqua. Quando ti rialzi i due hanno smesso di litigare e
            ti guardano preoccupati, mentre nel cerchio qualcuno ride. Il
            Custode scrive il tuo nome sul verbale come parte in causa.
          effetti: { ferite: 0.5, scandalo: 0.5 }
      - testo: "Metterli d'accordo"
        descrizione: "Lui ha bisogno di quel posto per un motivo che non dice. Lei per un motivo che dice fin troppo."
        prova: { attributo: sociale, abilita: empatia, difficolta: Media }
        successo:
          titolo: Un giorno a testa
          testo: |
            Li fai parlare uno alla volta, e a un certo punto il vecchio ammette che
            la casa di famiglia l'ha venduta da un pezzo e che quel banco è tutto
            quello che gli resta del Mercato. Lo dice guardandosi le scarpe. La
            ragazza smette di ripetere della licenza. Alla fine si dividono il posto
            a giorni alterni. Lei ti regala una striscia di stoffa tinta, e lui ti
            dice a mezza voce quali famiglie della Gilda sono piene di debiti.
          effetti: { informazioni.voce: 1, tormento: -0.5 }
        fallimento:
          titolo: Tutti e due contro
          testo: |
            Cominci a parlare di buon senso, e i due si voltano verso di te con la
            stessa faccia, che per un momento li fa sembrare parenti. Lui ti chiede
            chi ti manda, lei ti chiede se hai una licenza. Per un po' litigano con
            te invece che fra loro, e quando te ne vai hanno ripreso a gridarsi
            addosso. Il cerchio ha trovato un argomento nuovo, e l'argomento sei tu.
          effetti: { scandalo: 0.5 }
      - testo: "Leggere il foglio del vecchio"
        descrizione: "Una copia del Patto delle Corde, scritta nella lingua dei notai di trent'anni fa. Bisogna saperla leggere."
        requisiti: [accademiche >= 2]
        esito:
          titolo: Il Patto parla di funi
          testo: |
            Ti fai dare il foglio e lo leggi ad alta voce, una clausola dopo
            l'altra, con il latino dei notai che ti si impiglia fra i denti. Il
            Patto delle Corde parla di funi e di gabelle, e dei banchi del Mercato
            non dice una parola. Il vecchio si sgonfia come un otre bucato. Più
            tardi, mentre ripiega il foglio, ti spiega quali famiglie hanno ancora
            le quote delle funi, e ti sembra che parlarne gli faccia bene.
          effetti: { informazioni.pettegolezzo: 1 }

  - id: carta-ponti-la-lenza-fra-le-assi
    immagine: icone/fishing-hook
    titolo: La lenza fra le assi
    sommario: "Da una fessura fra le assi sale un filo con un amo di ferro, e l'amo ha appena preso la tua borsa."
    luogo: Ponte delle Mille Corde, sopra i sottoponti
    tipo: carta
    area: ponti-sospesi
    testo: |
      Cammini sul Ponte delle Mille Corde guardando le bancarelle, e a un
      certo punto la borsa ti tira verso il basso, con garbo, come quando un
      bambino ti prende la mano per farti vedere qualcosa. Abbassi gli
      occhi. Da una fessura fra due assi è salito un filo sottile e
      incerato, e all'estremità c'è un amo di ferro grande come un dito che
      si è infilato nella fibbia.

      {atletica Media} Il filo incerato taglia le dita se lo prendi a mano
      nuda. Se lo avvolgi due volte intorno al polso tiene, e allora conta
      soltanto chi ha più schiena.

      Il filo dà un altro strattone, più deciso. Sotto le assi qualcuno sta
      pescando nel buio dei sottoponti, e da come tira ha già capito di avere
      preso qualcosa di buono. La gente ti passa accanto senza fermarsi. Un
      facchino vede il filo e sorride scuotendo la testa, perché sui Ponti lo
      scherzo è vecchio e fa ridere lo stesso.

      {conoscenze-della-strada Facile} Di sotto la pesca alle borse è un
      mestiere, con le sue regole e i suoi orari. Chi scende a fare due
      chiacchiere con il pescatore di solito torna su con la fibbia.
    opzioni:
      - testo: "Tirare su la lenza"
        descrizione: "Chi pesca sta sotto, e tu sopra. Con le braccia giuste la pesca la fai tu."
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Media }
        successo:
          titolo: Il pescato
          testo: |
            Afferri il filo con tutte e due le mani e tiri. Sotto qualcuno
            impreca e tiene duro, poi molla di colpo, e dalla fessura sale
            tutta la lenza con il suo pescato della mattina appeso agli ami, e
            tu finisci seduto sulle assi per il contraccolpo. Ci sono un
            fazzoletto di seta e una borsa da cintura che non è la tua. La
            borsa la porti al gabbiotto, quasi tutta. Il resto della mattina lo
            passi a guardare dove metti i piedi.
          effetti: { monete: 3 }
        fallimento:
          titolo: La fibbia
          testo: |
            Tiri, e sotto tirano più forte, perché sotto sono in due e hanno i
            piedi puntati su una trave. Il filo si spezza all'altezza dell'amo,
            e l'amo scende nei sottoponti con la fibbia della borsa e qualche
            moneta che c'era vicino. Ti restano in mano un pezzo di filo e il
            bruciore del filo sui palmi. Dalla fessura arriva una risata, poi un
            grazie educato.
          effetti: { monete: -1 }
      - testo: "Scendere a conoscere il pescatore"
        descrizione: "Una scala a pioli a dieci passi da qui porta giù. Di sotto vale un'altra legge, ma è pur sempre una legge."
        prova: { attributo: sociale, abilita: conoscenze-della-strada, difficolta: Media }
        successo:
          titolo: Il pescatore di borse
          testo: |
            Scendi la scala e segui il filo fino a una piattaforma di tavole, dove
            un ragazzino con un cappello di paglia tiene la canna fra le ginocchia.
            Da quaggiù le assi del ponte sono un soffitto di suole che passano, e la
            luce arriva a strisce. Gli fai i complimenti per il nodo dell'amo, e lui
            ride con tutti i denti che gli sono rimasti. Ti restituisce la fibbia,
            perché con chi scende a trovarlo si fa così. Poi ti racconta chi, di
            notte, cala le casse dai ponti senza passare dal gabbiotto.
          effetti: { informazioni.voce: 1 }
        fallimento:
          titolo: Le passerelle
          testo: |
            Scendi la scala e ti perdi subito fra le passerelle larghe una
            spanna, con l'aria fredda della Cicatrice che sale fra le tavole.
            Ti fermi a metà di una passerella con le ginocchia che tremano e
            una mano sulla fune.

            {acrobazia Media fallita} Guarda avanti e non in basso. Il consiglio
            arriva puntuale subito dopo che hai guardato in basso.

            Il pescatore lo trovi soltanto quando lui trova te, e ti riaccompagna
            alla scala tenendoti per la manica come un nonno.
          effetti: { tormento: 0.5 }
      - testo: "Lasciargli una moneta sull'amo"
        descrizione: "Sciogliere l'amo dalla fibbia e rimandarlo giù con una moneta appesa."
        requisiti: [monete >= 1]
        esito:
          titolo: La risposta
          testo: |
            Sciogli l'amo, ci leghi una moneta con un filo della giubba e lo
            lasci andare. Il filo scende fino a fermarsi, e per un po' resti
            chino sulla fessura come uno che aspetta una lettera. Poco dopo risale con
            un pacchetto di carta oleata legato all'amo. Dentro c'è un rotolo
            di bende pulite e un biglietto scritto a carbone, con il nome di un
            Custode che di notte si addormenta e l'ora in cui succede.
          effetti: { monete: -1, bende: 1, informazioni.voce: 1 }

  - id: carta-ponti-la-nebbia-sulla-campata
    immagine: ambientazione/cicatrice-del-mondo
    titolo: La nebbia sulla campata
    sommario: "Dalla Cicatrice è salita una nebbia che copre la campata da un parapetto all'altro, e le lanterne là in mezzo si vedono appena."
    luogo: Ponte delle Mille Corde, la campata di ponente
    tipo: carta
    area: ponti-sospesi
    testo: |
      Al tramonto dalla Cicatrice sale una nebbia bianca e lenta, che si
      posa sulla campata di ponente e la copre da un parapetto all'altro. Le
      lanterne là in mezzo diventano macchie gialle con un alone intorno, e
      di chi è già dentro si sentono soltanto i passi. I Raschiatori dicono
      che nella nebbia della Cicatrice non bisogna mai fermarsi, nemmeno per
      allacciarsi una scarpa, perché chi si ferma comincia a sentire le voci
      del fondo.

      {origine apprendista-raschiatore} La regola della nebbia te l'hanno
      insegnata sulle piattaforme il primo giorno, insieme a quella della mano
      sulla spalla di chi ti sta davanti. Chi te l'ha detta parlava a voce
      bassa, e intanto guardava la nebbia.

      {resilienza Media fallita} Sono storie da Raschiatori, per spaventare
      chi è nuovo. Te lo ripeti con fermezza, e intanto ti accorgi di esserti
      allontanato di un passo dal parapetto.

      Al gabbiotto della campata due Custodi giocano a Zekar sotto una
      lampada e non hanno nessuna intenzione di uscire. Dall'altra parte hai
      da fare, e il giro lungo per la Città Bassa ti prende mezza sera.
      Accanto a te un facchino con la gerla vuota si arrotola una sigaretta
      con calma, leccando la cartina con una lingua lunga e pratica. «Io la
      passo a occhi chiusi, la conosco» dice. «A te costa una moneta di
      compagnia.»

      {resistenza Facile} L'umido della nebbia ti è già entrato nelle
      maniche. Mezza sera di giro lungo la faresti con i piedi bagnati.
    opzioni:
      - testo: "Attraversarla da solo, senza fermarti"
        descrizione: "Un passo dopo l'altro, con gli occhi sulla lanterna davanti. Quello che senti lo lasci dove lo senti."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Media }
        successo:
          titolo: Le voci del fondo
          testo: |
            A metà campata arrivano le voci, così basse che sembrano venire dalle
            assi, e dicono il tuo nome con l'accento sbagliato. Il collo ti si
            irrigidisce per la voglia di girarti. Tu conti i passi e tieni gli occhi
            sulla lanterna davanti, e quando la raggiungi passi alla successiva. A
            un certo punto lo stivale urta qualcosa che scivola sulle assi. Lo
            raccogli senza fermarti, e dall'altra parte, alla luce, è una scheggia
            di metallo inciso, fredda come se venisse dal fondo.
          effetti: { reliquie.scheggia: 1 }
        fallimento:
          titolo: Chi ti chiamava
          testo: |
            A metà campata una voce ti chiama con la voce di qualcuno che
            conosci, e ti fermi a rispondere prima di decidere di farlo. Quando
            ti ritrovano sei seduto contro il parapetto, con la nebbia che si
            dirada, e uno dei Custodi del gabbiotto ti scuote per una spalla.
            Ti ricordi di esserti fermato, però di esserti seduto no, e hai i
            pantaloni bagnati fino alle ginocchia come se fossi rimasto lì a
            lungo. La voce, quella notte, ti viene a cercare anche nel sonno.
          effetti: { tormento: 1 }
      - testo: "Andare dietro al facchino"
        descrizione: "Una moneta per la compagnia. Lui la nebbia la conosce, e parla per tutto il tempo."
        requisiti: [monete >= 1]
        esito:
          titolo: Le chiacchiere del facchino
          testo: |
            Il facchino cammina con la mano sinistra sul parapetto e ti parla dei
            suoi piedi per tutto il tempo, in particolare di un'unghia che cresce
            storta da quando era ragazzo, e a forza di ascoltarlo le voci del fondo
            non le senti nemmeno. Ti racconta anche chi passa di qui con la nebbia,
            quando i Custodi restano dentro, e che cosa porta. Dall'altra parte ti
            batte una mano sulla spalla e torna indietro a cercare un altro cliente.
          effetti: { monete: -1, informazioni.voce: 1 }
      - testo: "Aspettare al gabbiotto e giocare a Zekar"
        descrizione: "I Custodi giocano a poste basse e bluffano male. Fino a quando la nebbia resta, un posto al tavolo c'è."
        requisiti: [monete >= 2]
        prova: { attributo: sociale, abilita: ingannare, difficolta: Media }
        successo:
          titolo: La mano dei Custodi
          testo: |
            Ti fanno posto sulla panca e ti spiegano le regole della campata,
            che con quelle del Grifone hanno in comune soltanto le carte. Il
            Custode più vecchio si gratta l'orecchio ogni volta che ha una mano
            buona, e dopo tre giri lo sai anche tu.

            {ingannare Media} Lo sa anche il suo compagno, che da anni finge
            di non saperlo. Fra loro due è una forma di gentilezza.

            Quando la nebbia si alza hai vinto abbastanza da pagarti la cena, e loro
            ti invitano a tornare, come si invita uno da cui ci si vuole rifare.
          effetti: { monete: 3 }
        fallimento:
          titolo: L'orecchio
          testo: |
            Il Custode più vecchio si gratta l'orecchio, e tu ci caschi due
            volte prima di capire che lo fa apposta. Quando la nebbia si alza le
            tue monete sono passate dall'altra parte del tavolo, una alla volta,
            senza nessuna fretta. I Custodi sono di ottimo umore e ti aprono la
            porta del gabbiotto con un inchino.
          effetti: { monete: -2 }

  - id: carta-ponti-l-approdo-delle-chiatte
    immagine: icone/pulley-hook
    titolo: L'approdo delle chiatte
    sommario: "All'approdo delle chiatte i padroni cercano braccia per la prima traversata, e la paga dipende da quanto guardi in basso."
    luogo: Ponti Sospesi, l'approdo delle chiatte
    tipo: carta
    area: ponti-sospesi
    testo: |
      A valle del Ponte delle Mille Corde, dove la Cicatrice si stringe,
      dalle due sponde partono i cavi delle chiatte. Sono funi d'acciaio
      grosse come un polso, tese sopra il vuoto fra gli argani, e lungo
      ciascuna scorre una piattaforma di tavole con le sponde basse, che
      porta da una parte all'altra quello che sulle assi dei ponti non
      passerebbe, come la pietra da taglio o il lyssan grezzo nelle casse
      piombate. All'alba l'approdo è pieno di carri in attesa e di uomini
      che battono i piedi intorno a un bidone acceso. Ti metti anche tu
      vicino al fuoco, e il calore ti arriva alle ginocchia e si ferma lì.

      {politica-ed-economia Media} Chi ha le chiatte grandi decide anche i
      turni delle piccole. All'approdo una lista in mano conta più del
      timbro di un Custode.

      Ugo Bracco, che ha le chiatte grandi e il naso rotto in due punti,
      passa fra i carri con una lista in mano e sceglie le braccia per la
      prima traversata. Si ferma davanti a te, ti guarda le mani e poi le
      scarpe. «Uno per l'argano e uno per la bolla» dice, e ti squadra di
      nuovo. «Tu che cosa sai fare?»

      {origine fuggiasco-di-ghoran} Ti guarda le mani e poi le scarpe nello
      stesso ordine in cui a Ghoran guardavano chi saliva sulla bilancia. Le
      spalle ti si curvano da sole, e ti ci vuole un respiro intero per
      raddrizzarle.

      {rissa Facile} Il naso rotto in due punti non l'ha mai fatto
      raddrizzare. Ha imparato a prendere i pugni, e adesso paga perché li
      prendano gli altri.
    opzioni:
      - testo: "Lavorare all'argano"
        descrizione: "Quattro uomini per manovella, e la chiatta che pesa come una casa. Si spinge finché il caposquadra non fischia."
        prova: { attributo: fisico, abilita: [resistenza, atletica], difficolta: Media }
        successo:
          titolo: La manovella
          testo: |
            Spingi la manovella con altri tre, a testa bassa, contando i giri
            con il fiato, mentre l'uomo accanto a te canticchia la stessa
            strofa a ogni giro. La chiatta parte con uno strappo e va, sopra il vuoto,
            con la pietra legata e il chiattaiolo seduto a prua che fuma. Quando
            arriva dall'altra parte il caposquadra fischia e voi vi lasciate
            andare sulle assi. Bracco paga a fine turno, contando le monete
            nella mano di ciascuno.
          effetti: { monete: 3 }
        fallimento:
          titolo: Il contraccolpo
          testo: |
            A metà traversata la chiatta sbanda sotto una raffica e la manovella
            torna indietro di mezzo giro, prendendoti nel fianco. Finisci il
            turno piegato in due, e Bracco ti paga meno degli altri perché, dice,
            hai spinto meno degli altri. Non ha tutti i torti, e il fianco te lo
            ricorda a ogni respiro.
          effetti: { monete: 1, ferite: 0.5 }
      - testo: "Scrivere la bolla"
        descrizione: "Contare i colli, pesarli a occhio, scrivere tutto in modo che la Gilda ci creda."
        prova: { attributo: mentale, abilita: politica-ed-economia, difficolta: Media }
        successo:
          titolo: Una cassa troppo leggera
          testo: |
            Conti i colli e li scrivi in colonna, e alla quarta cassa ti fermi,
            perché è segnata come pietra e due uomini la sollevano senza
            sudare. Lo scrivi lo stesso, ma a margine, con un punto di domanda
            piccolo e onesto. Bracco legge la bolla e si ferma sul margine,
            con il pollice che ci passa sopra come per cancellarlo. Poi guarda
            te, e ti paga il doppio di quello che aveva detto. Ti chiede di
            dimenticare il punto di domanda, e tu te lo segni da un'altra parte.
          effetti: { monete: 3, informazioni.voce: 1 }
        fallimento:
          titolo: Le colonne storte
          testo: |
            Sbagli un conto, poi ne sbagli un altro, e alla fine hai l'inchiostro
            fino al polso e in mezzo alla bolla una macchia a forma di pollice,
            il tuo. Al gabbiotto dall'altra parte un
            Custode la rimanda indietro due volte. Bracco ti paga la metà, e
            mentre te ne vai lo senti dire che la prossima volta prende uno che
            sappia scrivere.
          effetti: { monete: 1 }
      - testo: "Salire sulla Mula con Ilde"
        descrizione: "Dall'altra parte dell'approdo Ilde Sarrocchi agita il fazzoletto rosso. Il tuo posto ce l'ha tenuto."
        quando: [chiatta.posto == 1]
        esito:
          titolo: Il posto a bordo
          testo: |
            Ilde ti fa salire senza chiederti niente e ti mette in mano la cima
            di prua. «Socio, oggi si porta il sale di Laresh a chi lo paga
            meglio» dice, e ride da sola. La cima è ruvida e fredda, e dopo la
            prima traversata le mani la riconoscono. Prima di mezzogiorno fate
            due traversate. Nelle pause lei mastica la liquirizia e ti racconta le
            voci dell'approdo, che sono più di quelle del Mercato. A fine
            giornata divide la paga a metà.
          effetti: { monete: 4, informazioni.pettegolezzo: 1 }

  # ================================================================ la catena di Ilde Sarrocchi
  - id: carta-ilde-la-mula
    immagine: icone/crane
    titolo: La Mula
    sommario: "Una chiatta piccola si è fermata a metà del cavo, e la donna a bordo dice all'argano cose che un argano non dovrebbe sentire."
    luogo: Ponti Sospesi, l'approdo delle chiatte
    tipo: carta
    area: ponti-sospesi
    requisiti: [chiatta.ilde == 0]
    testo: |
      All'approdo delle chiatte tutti guardano in alto. A metà del cavo più
      vecchio, quello con l'argano di legno anziché di ferro, una chiatta
      piccola è ferma sopra il vuoto e dondola, carica di botti legate con
      le cinghie. A bordo c'è una donna sulla cinquantina con un fazzoletto
      rosso in testa e un pezzo di radice di liquirizia fra i denti, che
      grida verso l'approdo parole molto precise sull'argano e sulla madre
      del ragazzo che doveva girarlo.

      Il ragazzo è sparito. L'argano ha la manovella bloccata a metà giro, e
      due chiattaioli di Ugo Bracco lo guardano con le braccia incrociate
      senza toccarlo.

      {tecnologia Facile} Un argano di legno non si ferma a metà giro per
      capriccio. O si spacca o gira, e questo non ha nessuna crepa in vista.

      {intimidire Media} Quei due non stanno guardando l'argano. Guardano
      chi si avvicina, e basterebbe uno sguardo un po' più lungo per
      metterli a disagio.

      Sul fianco della chiatta qualcuno ha dipinto una mula con le orecchie
      dritte, e sotto, in lettere storte, *la Mula*. «Socio!» grida la
      donna, e indica proprio te. «Sì, tu. Hai due braccia, o sono di legno
      anche quelle?»
    opzioni:
      - testo: "Girare l'argano"
        descrizione: "La manovella è dura. Bisogna metterci il peso, e sperare che si sblocchi prima della schiena."
        prova: { attributo: fisico, abilita: resistenza, difficolta: Media }
        successo:
          titolo: A fune tesa
          testo: |
            Ti appoggi alla manovella con tutto il peso, e la schiena protesta
            già alla seconda spinta, e dopo tre spinte qualcosa dentro
            l'argano cede con uno schiocco. La Mula arriva
            all'approdo dondolando. La donna salta giù prima che tocchi le assi,
            ti stringe la mano con una mano dura come una cima e si presenta.
            Si chiama Ilde Sarrocchi, e la Mula è sua. Ti paga il giro
            d'argano e ti offre un pezzo di liquirizia, che è tutto quello che
            ha in tasca.
          effetti: { monete: 2, chiatta.ilde: 1 }
        fallimento:
          titolo: Il contraccolpo
          testo: |
            La manovella si sblocca di colpo e torna indietro, e ti prende sul
            braccio prima che tu riesca a scansarti. Mentre ti tieni il gomito,
            Ilde perde la pazienza e si tira fino all'approdo a forza di braccia,
            aggrappata al cavo, con la chiatta dietro e la liquirizia stretta
            fra i denti come un morso. Scende, ti guarda il
            braccio e dice che hai fatto quello che potevi. Si chiama Ilde
            Sarrocchi, e da quel giorno ti chiama socio.
          effetti: { ferite: 0.5, chiatta.ilde: 1 }
      - testo: "Guardare perché si è bloccato"
        descrizione: "Un argano di legno ha poche parti e tutte in vista. Se si è fermato a metà giro, c'è un motivo."
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Facile }
        successo:
          titolo: Il cuneo
          testo: |
            Ti chini sugli ingranaggi e lo trovi subito. Fra due denti della
            ruota grande qualcuno ha piantato un cuneo di quercia, e l'ha
            piantato con il martello. Lo tiri fuori con il coltello e l'argano
            riparte da solo, pigro, finché la Mula non tocca le assi. Ilde
            Sarrocchi scende e guarda il cuneo nella tua mano senza dire niente,
            e la liquirizia smette di muoversi fra i denti. Poi se lo mette in
            tasca. «Grazie, socio» dice, e guarda verso i
            chiattaioli di Bracco.
          effetti: { chiatta.ilde: 1, chiatta.cuneo: 1 }
        fallimento:
          titolo: Il calcio
          testo: |
            Ti infili fra gli ingranaggi e ne esci con il grasso fino ai gomiti,
            senza avere capito niente, e con il sospetto di aver toccato più di
            quanto dovevi. Uno dei chiattaioli di Bracco ti sposta
            con una mano, dà un calcio alla ruota grande e l'argano riparte.
            Quando la Mula arriva, la donna ringrazia lui a denti stretti e te
            con un sorriso storto. Si chiama Ilde Sarrocchi, e ti dice che il
            grasso va via con la cenere.
          effetti: { chiatta.ilde: 1 }
      - testo: "Chiedere ai chiattaioli perché non la aiutano"
        descrizione: "Sono in due, hanno le braccia buone e stanno a guardare. Qualcosa sotto c'è."
        esito:
          titolo: Roba di nessuno
          testo: |
            I due si guardano, e il più giovane si trova all'improvviso qualcosa da
            fare con le stringhe delle scarpe. «La Mula non è roba nostra» dice il
            più vecchio, e sputa. Poi ti spiega che quella è l'ultima fune con il
            privilegio del Patto delle Corde, e che il loro padrone, Ugo Bracco,
            aspetta che si rompa da anni. Detto questo, siccome lo guardi, si mette
            all'argano con te. Quando la chiatta tocca le assi la donna si presenta
            come Ilde Sarrocchi. Al vecchio chiattaiolo non dice grazie.
          effetti: { chiatta.ilde: 1, informazioni.voce: 1 }

  - id: carta-ilde-il-carico
    immagine: fazioni/gilda-dei-mercanti
    titolo: Il privilegio di fune
    sommario: "Un Custode ha messo i sigilli al carico della Mula, e Ilde Sarrocchi è venuta a cercarti con la liquirizia fra i denti."
    luogo: Ponti Sospesi, l'approdo delle chiatte
    tipo: carta
    area: ponti-sospesi
    requisiti: [chiatta.ilde == 1]
    testo: |
      Ilde Sarrocchi ti trova sul Ponte delle Mille Corde e ti prende per la
      manica senza salutare. «Socio, ti devo una cosa e me ne serve
      un'altra» dice, e ti porta fino all'approdo masticando la liquirizia.
      Strada facendo ti spiega il privilegio di fune. Suo nonno ha firmato il
      Patto delle Corde con una mano sola, perché l'altra gliel'aveva presa
      un cavo, e in cambio dell'argano ha avuto il diritto di portare la sua
      merce sulla sua fune senza pagare gabella. Lo racconta come si
      racconta una cosa di famiglia, con la mano sinistra che si chiude a
      pugno senza che lei se ne accorga.

      {accademiche Media} Il Patto delle Corde è scritto per gli argani e
      per le funi. Di chi sia la merce che ci viaggia sopra, se ricordi
      bene, parla pochissimo.

      Sulla Mula le botti hanno tutte un nastro della Gilda incollato sul
      tappo, e accanto un Custode giovane scrive su un registro. «Merce sua»
      dice, senza alzare gli occhi. «Queste botti sono di un oste del Ponte
      del Pesce, quindi pagano. Fino al pagamento, restano qui.» Ilde sputa
      la liquirizia nella Cicatrice. Al sole, l'olio comincia a sudare dai
      tappi.

      {furtivita Media} Il Custode scrive a testa bassa e se ne andrà al
      tramonto. Di notte all'approdo resta un lumino solo, dalla parte dei
      carri.
    opzioni:
      - testo: "Discutere il privilegio con il Custode"
        descrizione: "Con le formule della Gilda e un tono che un Custode giovane rispetta. A Ilde quel tono non riesce."
        prova: { attributo: sociale, abilita: galateo, difficolta: Media }
        successo:
          titolo: Le formule
          testo: |
            Chiedi al Custode, con tutte le formule della Gilda, se il registro
            distingue la merce trasportata da quella posseduta, e gli ricordi che il
            Patto parla soltanto di argani. Lui ci pensa sopra a lungo,
            mordicchiando la penna, mentre Ilde dietro di te trattiene il fiato in
            modo molto rumoroso. Alla fine arrossisce fino alle orecchie e stacca i
            nastri uno alla volta, con cura, per non rovinare i tappi. Ilde lo
            guarda andare via e ti mette in mano qualche moneta. «Adesso ti devo due
            cose» dice, contandole sulle dita. «Io le cose che devo le pago sempre.»
          effetti: { monete: 2, chiatta.ilde: 1 }
        fallimento:
          titolo: Il tono
          testo: |
            Il Custode ti ascolta finché non sbagli una formula, e da quel
            momento ascolta soltanto quella, con l'aria offesa di un sacrestano.
            Alla fine Ilde paga la gabella contando le monete sul registro una per
            una, ad alta voce, perché tutto l'approdo senta quanto costa. Ti
            ringrazia lo stesso, ma per il resto della giornata all'approdo ridono
            della discussione, e ridono anche di te.
          effetti: { scandalo: 0.5, chiatta.ilde: 1 }
      - testo: "Portare via le botti di notte"
        descrizione: "I nastri si staccano e si riattaccano. L'oste del Ponte del Pesce aspetta, e di notte il Custode dorme."
        prova: { attributo: fisico, abilita: furtivita, difficolta: Media }
        successo:
          titolo: Nastri nuovi
          testo: |
            Tornate a mezzanotte con un carretto dalle ruote fasciate. Tu stacchi i
            nastri con il vapore di una pentola, scottandoti due dita senza fiatare,
            mentre Ilde rotola le botti. Prima dell'alba l'oste ha il suo olio. Al
            posto delle botti, sulla Mula, lasciate barili d'acqua con i nastri
            rimessi. Il Custode, la mattina dopo, firma il dissequestro senza
            accorgersi di niente. Ilde ti paga la notte e ti fa giurare di non dirlo
            a nessuno.
          effetti: { monete: 3, sospetto: 0.5, chiatta.ilde: 1 }
        fallimento:
          titolo: La lanterna del Custode
          testo: |
            Alla terza botte una lanterna si accende sull'approdo, e voi due
            scappate fra i carri lasciando il carretto dov'è, con il cuore che
            ti batte in gola e Ilde che ride sottovoce correndo. Il Custode trova
            soltanto i nastri staccati, e la mattina chiede in giro chi ha visto
            due persone, una con un fazzoletto rosso. Ilde paga la gabella e una
            multa, e quando ti incrocia ti strizza l'occhio lo stesso.
          effetti: { sospetto: 1, chiatta.ilde: 1 }
      - testo: "Pagare la gabella di tasca tua"
        descrizione: "Prima che l'olio vada a male. Lei non te lo chiederebbe mai, e infatti non te lo chiede."
        requisiti: [monete >= 3]
        esito:
          titolo: Una cosa da segnare
          testo: |
            Paghi al Custode prima che Ilde riesca a fermarti. Lei ti guarda come
            si guarda un debito, poi tira fuori un mozzicone di matita e scrive
            qualcosa sul legno della sponda, all'interno, dove non piove.

            {empatia Facile} Su quel legno ci sono altre righe, vecchie, alcune
            cancellate. È il suo libro dei debiti, e tu ci sei appena entrato.

            Il Custode stacca i nastri e ti scrive una ricevuta in bella
            calligrafia, e la mattina dopo all'approdo tutti sanno che Ilde
            Sarrocchi ha un socio che paga in contanti.
          effetti: { monete: -3, rep.gilda: 0.5, chiatta.ilde: 1 }
      - testo: "Prendere le botti a nome della tua licenza"
        descrizione: "Con la licenza della Gilda la merce che porti è tua per legge, e la tua merce non paga."
        quando: [licenza-gilda >= 1]
        esito:
          titolo: Merce tua
          testo: |
            Mostri la licenza e dichiari le botti come merce tua, da consegnare
            al Ponte del Pesce. Il Custode legge la licenza due volte in cerca
            di un appiglio, tenendola controluce per cercare le filigrane, e
            alla fine stacca i nastri con un sospiro. Ilde ti guarda con la
            liquirizia ferma a metà, poi ride così forte che i chiattaioli di
            Bracco si voltano. Mentre caricate ti dice che all'approdo, quando
            c'è da sapere qualcosa, c'è sempre qualcuno che lo sa.
          effetti: { informazioni.voce: 1, chiatta.ilde: 1 }

  - id: carta-ilde-la-fune-segata
    immagine: icone/rope-coil
    titolo: La fune segata
    sommario: "Sul cavo della Mula c'è un taglio fatto con la sega, a un palmo dall'argano, e Ilde dice che le funi d'acciaio non si segano da sole."
    luogo: Ponti Sospesi, l'argano della Mula
    tipo: carta
    area: ponti-sospesi
    requisiti: [chiatta.ilde == 2]
    testo: |
      All'alba Ilde Sarrocchi ti aspetta all'argano della Mula con le
      braccia conserte e la liquirizia ferma fra i denti. Ti fa chinare sul
      cavo, a un palmo dalla ruota, e ti mostra il taglio. È netto e lucido,
      profondo quasi metà dello spessore, fatto con una sega da metallo da
      qualcuno che aveva tempo e sapeva dove mettere la lama. Un'altra
      traversata con le botti, e la Mula sarebbe andata giù con il carico.

      {tecnologia Media} Il taglio è dritto e si ferma a metà. Chi l'ha
      fatto voleva che il cavo cedesse sotto carico, fra qualche giorno,
      così da sembrare usura.

      {resistenza Facile fallita} Il vento dell'alba ti entra nel colletto
      per ricordarti che hai dormito poco. Lo stomaco aggiunge che non hai
      fatto colazione.

      «Le funi si consumano, socio. Questa l'hanno aiutata» dice. Guarda
      verso l'altro capo dell'approdo, dove i cavi nuovi di Ugo Bracco
      brillano di grasso e i suoi uomini caricano pietra. «Lui il mio cavo lo
      vuole da quando è morto mio nonno. Però che sia stato lui, io non lo
      so.» Si toglie la liquirizia di bocca e la guarda come se avesse
      cambiato sapore. «Tu hai l'aria di uno che le cose le scopre.»
    opzioni:
      - testo: "Fare la posta al cavo stanotte"
        descrizione: "Chi ha segato a metà torna a finire il lavoro. Si aspetta al buio, vicino all'argano, con l'arma in mano."
        prova: { attributo: fisico, abilita: armi-da-mischia, difficolta: Media }
        successo:
          titolo: La sega
          testo: |
            Passi la notte acquattato dietro l'argano, con il freddo che sale dalle
            assi e una gamba che ti si addormenta due volte. Verso la terza campana
            un uomo arriva con una sega avvolta in uno straccio, e lo prendi mentre
            si inginocchia sul cavo. Gli giri il braccio dietro la schiena finché
            parla. È un chiattaiolo di Bracco, e dice che il padrone gli aveva
            promesso la Mula, una volta caduta. All'alba Ilde lo lascia andare con
            un calcio.
          effetti: { chiatta.ilde: 1, chiatta.colpevole: 1 }
        fallimento:
          titolo: La nebbia
          testo: |
            Verso la terza campana un'ombra arriva dalla nebbia con una sega in
            mano. Le salti addosso troppo presto, e l'ombra ti apre un taglio
            sull'avambraccio con la lama della sega e sparisce fra i carri.
            All'alba Ilde ti fascia il braccio con il suo fazzoletto rosso e
            cambia il cavo in silenzio, con le mascelle serrate.
          effetti: { ferite: 1, chiatta.ilde: 1 }
      - testo: "Seguire i soldi"
        descrizione: "Se la Mula cade, il privilegio di fune torna alla Gilda e qualcuno lo compra. Qualcuno avrà già chiesto quanto costa."
        prova: { attributo: mentale, abilita: [accademiche, politica-ed-economia], difficolta: Media }
        successo:
          titolo: Una domanda alla Casa dei Nodi
          testo: |
            Al gabbiotto un Custode annoiato, in cambio di un boccale, ti lascia
            sfogliare il registro delle istanze, con le pagine molli di umido.
            Tre settimane fa Ugo Bracco ha chiesto alla Casa dei Nodi
            che cosa succede a un privilegio di fune quando la fune
            cade, e ha chiesto anche il prezzo. In fondo c'è la sua firma
            larga, piena di svolazzi. La copi parola per parola, e a Ilde
            tremano le mani quando la legge.
          effetti: { informazioni.pettegolezzo: 1, chiatta.ilde: 1, chiatta.colpevole: 1 }
        fallimento:
          titolo: I registri chiusi
          testo: |
            Chiedi al gabbiotto, alla Casa dei Nodi e a un paio di rigattieri del
            Mercato, e tutti ti rispondono con molta gentilezza e niente dentro,
            come scatole incartate bene e vuote. Alla fine Ilde ti dice di lasciar
            perdere, che il cavo nuovo l'ha già comprato e che a Bracco ci penserà
            lei. Lo dice guardando la sega che si è comprata, appesa a un chiodo.
          effetti: { chiatta.ilde: 1 }
      - testo: "Riguardare il cuneo dell'argano"
        descrizione: "Ilde l'ha tenuto in tasca da quella mattina. Un cuneo di quercia, tagliato da qualcuno che sa lavorare il legno."
        quando: [chiatta.cuneo == 1]
        esito:
          titolo: Il segno sotto il cuneo
          testo: |
            Ilde tira fuori il cuneo e tu lo giri alla luce. Sulla faccia di
            sotto, quella che stava contro il dente della ruota, c'è un segno
            fatto con il ferro rovente, una B dentro un cerchio. È il marchio
            che i carpentieri di Bracco mettono su ogni pezzo che esce dal loro
            banco, anche sui cunei. Ilde lo guarda a lungo, e poi lo rimette in
            tasca con più cura di prima, come una cosa che servirà.

            {percezione Facile} Il marchio è stato premuto storto, di fretta.
            Chi l'ha messo sul cuneo non pensava che qualcuno l'avrebbe mai
            girato.
          effetti: { chiatta.ilde: 1, chiatta.colpevole: 1 }
      - testo: "Aiutarla a cambiare il cavo"
        descrizione: "Chi è stato, lo scoprirà lei. Intanto la fune nuova va tesa, e ci vogliono quattro braccia."
        prova: { attributo: fisico, abilita: atletica, difficolta: Facile }
        successo:
          titolo: La fune nuova
          testo: |
            Passate la giornata a tendere il cavo nuovo, tu appeso alla sponda
            della Mula e lei all'argano, a forza di urla e di strattoni, e a
            mezzogiorno hai le mani che non chiudono più del tutto. A sera la
            fune canta quando la pizzichi, e Ilde la ascolta con l'orecchio
            appoggiato come a un violino. Ti paga la giornata e ti dice che
            questa, almeno, per segarla ci vorrà una notte intera.
          effetti: { monete: 2, chiatta.ilde: 1 }
        fallimento:
          titolo: Lo schiocco
          testo: |
            A metà della tesatura un morsetto salta, e il cavo torna indietro
            con uno schiocco che ti passa a un dito dalla faccia e ti lascia un
            segno rosso sulla spalla. Il fiato ti si ferma e poi riparte tutto
            insieme. Il resto lo fate più piano. A sera la fune
            è tesa, e Ilde ti guarda la spalla e dice che sei stato fortunato.
            A giudicare dalle sue mani, lo sa per esperienza.
          effetti: { ferite: 0.5, chiatta.ilde: 1 }

  - id: carta-ilde-l-ultima-traversata
    immagine: ambientazione/cicatrice-del-mondo
    titolo: L'ultima traversata
    sommario: "Ilde ti invita sulla Mula per una traversata senza carico. A metà del cavo ferma l'argano e ti dice che la Gilda vuole comprarle la fune."
    luogo: La Mula, sopra la Cicatrice
    tipo: carta
    area: ponti-sospesi
    requisiti: [chiatta.ilde == 3]
    testo: |
      Ilde Sarrocchi ti fa salire sulla Mula al tramonto. A bordo stavolta
      non c'è carico, e la chiatta scorre lungo il cavo nuovo con un ronzio
      basso che ti entra nelle ginocchia. A metà traversata il ragazzo
      dell'argano, a un suo fischio, si ferma. Restate sospesi sopra la
      Cicatrice con le lanterne dei Ponti alle spalle e il fondo che non si
      vede.

      {acrobazia Facile fallita} La chiatta ferma dondola appena, e tu ti
      aggrappi alla sponda con tutte e due le mani come se dondolasse
      moltissimo.

      Ilde tira fuori di tasca una lettera con il sigillo della Gilda e te la
      passa. È di Varn Kett, scritta con una grafia minuta e dritta. La Casa
      dei Nodi le offre una somma per il privilegio di fune, una volta sola,
      da firmare entro la luna nuova. «È una bella somma» dice, e si gratta
      sotto il fazzoletto. «Le gambe mi reggono sempre meno, e i cavi costano.
      Mio nonno, però, su questa fune ci ha lasciato una mano.» Si appoggia
      alla sponda e guarda giù. «Tu cosa faresti, socio?»

      {empatia Media} Lo chiede a te perché da sola non riesce a scegliere
      senza sentirsi in colpa. Qualunque cosa le dica, un po' di quella
      colpa te la passerà.
    opzioni:
      - testo: "Convincerla a tenere la Mula"
        descrizione: "La somma si spende in un anno. La fune, se la tiene, la porta fino alla fine."
        prova: { attributo: sociale, abilita: [persuasione, empatia], difficolta: Media }
        successo:
          titolo: La lettera nel vuoto
          testo: |
            Le parli di suo nonno e della mano sulla fune, e di quello che
            l'approdo diventerebbe con tutti i cavi in mano a Bracco. Lei ti
            ascolta masticando, poi straccia la lettera in quattro e la lascia
            andare sopra il vuoto, e i pezzi scendono girando, bianchi, finché
            la nebbia non se li prende. «Allora il posto a
            bordo è tuo, socio» dice. «Quando vuoi, la prima traversata la fai
            con me.» Fischia, e la Mula riparte verso le luci.
          effetti: { monete: 3, chiatta.ilde: 1, chiatta.fine: 1, chiatta.posto: 1 }
        fallimento:
          titolo: La firma
          testo: |
            Le parli di suo nonno, e lei ti lascia finire con gentilezza,
            dandoti una pacca sul ginocchio a metà discorso. Poi ti
            spiega che le ginocchia la mattina non si piegano più e che il cavo
            nuovo l'ha pagato con i risparmi di tre anni. Firma la lettera sulla
            sponda, con il mozzicone di matita. Una settimana dopo ti manda un
            ragazzo con un sacchetto e un biglietto storto, dentro c'è la tua
            parte di socio.
          effetti: { monete: 4, chiatta.ilde: 1, chiatta.fine: 2 }
      - testo: "Scrivere a Varn Kett il nome di Ugo Bracco"
        descrizione: "Quello che hai scoperto sulla fune segata, scritto per bene. Varn Kett non ha mai sbagliato una riga."
        quando: [chiatta.colpevole == 1]
        esito:
          titolo: La riga di Varn Kett
          testo: |
            Scrivete la risposta insieme, sulla sponda della Mula, con la chiatta
            che dondola sotto la penna e le lettere che vengono un po' ubriache. In
            fondo ci mettete il nome di Ugo Bracco e quello che sapete. Varn Kett
            risponde dopo tre giorni con poche righe. La Casa dei Nodi ritira
            l'offerta, il privilegio di fune resta a Ilde Sarrocchi, e il signor
            Bracco pagherà una multa per ogni metro di cavo segato. Ilde legge la
            lettera due volte, poi ti dice che sulla Mula, da adesso, un posto è
            tuo.
          effetti: { rep.gilda: 1, informazioni.pettegolezzo: 1, chiatta.ilde: 1, chiatta.fine: 1, chiatta.posto: 1 }
      - testo: "Aiutarla a vendere al prezzo giusto"
        descrizione: "Se deve vendere, che venda bene. Una somma scritta in una lettera si può sempre ritoccare."
        prova: { attributo: mentale, abilita: politica-ed-economia, difficolta: Media }
        successo:
          titolo: Il prezzo vero
          testo: |
            Le fai notare che la Gilda offre per il privilegio quello che pagava
            vent'anni fa, e che senza la Mula le chiatte di Bracco avrebbero
            l'approdo tutto per sé. Scrivete la risposta insieme, con i conti in
            colonna.

            {politica-ed-economia Facile} La Gilda non ama pagare di più. Ama
            ancora meno che una cifra vecchia di vent'anni finisca sulla bocca
            di tutto l'approdo.

            La Casa dei Nodi alza l'offerta. Ilde firma, e ti dà la tua
            parte in una borsa di cuoio con le sue iniziali, e per una volta
            senza liquirizia in bocca.
          effetti: { monete: 10, rep.gilda: 0.5, chiatta.ilde: 1, chiatta.fine: 2 }
        fallimento:
          titolo: L'offerta ferma
          testo: |
            Scrivete una risposta con i conti in colonna, e la Casa dei Nodi la
            rimanda indietro con una riga sola, che l'offerta è quella. Ilde
            firma lo stesso, perché la luna nuova arriva, e preme sulla carta
            fino a romperne quasi la punta. Ti dà la tua parte senza
            fartela pesare. L'ultima volta che la vedi sull'approdo sta
            insegnando al ragazzo dell'argano a bestemmiare per bene.
          effetti: { monete: 5, chiatta.ilde: 1, chiatta.fine: 2 }

  # ================================================================ le carte che arrivano dopo
  - id: carta-ponti-il-turno-di-notte
    immagine: ambientazione/ponte-dei-morti
    titolo: Il nuovo turno di notte
    sommario: "Il Ponte dei Morti ha un custode nuovo che conta i carri tre volte. Una donna con il cappuccio di tela cerata vuole sapere quando dorme."
    luogo: Ponte dei Morti, dopo la seconda campana
    tipo: carta
    area: ponti-sospesi
    requisiti: [pista.registro >= 5]
    testo: |
      Dopo la seconda campana il Ponte dei Morti è di nuovo pieno di nebbia,
      e le lanterne dei Raschiatori dondolano sopra il vuoto come sempre.
      Il gabbiotto in fondo invece è cambiato. Dentro c'è Teo Marsan, il
      custode notturno che la Gilda ha messo al posto di Maedric Holl, un
      ragazzo con la barba rada e il registro aperto davanti. Ferma ogni
      carro e conta le casse tre volte, prima di scriverle con una grafia
      grande da scolaro, e ogni volta muove le labbra.

      {origine apprendista-raschiatore} Sai per chi si accendono queste
      lanterne, e passarci sotto mentre un ragazzo conta casse ti pare quasi
      una scortesia. Senza volerlo abbassi la voce, come si fa sulle
      piattaforme quando qualcuno nomina un compagno rimasto giù.

      {politica-ed-economia Media} Un custode che conta tre volte costa
      alla Gilda un'ora per ogni carro, e a chi viaggia di notte molto di
      più. Qualcuno, da qualche parte, sta già facendo questo conto.

      Una donna con il cappuccio di tela cerata ti si mette accanto al
      parapetto, come per guardare le lanterne. «Tu sei quello del
      registro» dice piano. «Da quando Holl non c'è più, di notte qui sopra
      passa soltanto quello che è in regola, e la gente di sotto ha fame. A
      noi basta sapere quando il ragazzo dorme.» Ti fa scivolare sul
      parapetto una borsa che tintinna, e non la ritira.

      {furtivita Media} Si è messa in modo che dal gabbiotto si veda solo
      la tua schiena. La borsa sul parapetto sta nell'ombra del tuo gomito.
    opzioni:
      - testo: "Prendere la borsa e dirle i turni"
        descrizione: "I turni di Teo Marsan stanno scritti sulla tavoletta del gabbiotto. Basta leggerli per lei."
        esito:
          titolo: La tavoletta
          testo: |
            Prendi la borsa e vai a leggere la tavoletta dei turni appesa fuori
            dal gabbiotto, mentre Teo conta una cassa per la terza volta. Glieli
            dici all'orecchio, e il cappuccio le sa di pioggia vecchia. Lei
            annuisce e sparisce nella nebbia, e la borsa nella tua tasca pesa
            più di quanto pesasse sul parapetto. Due notti
            dopo, a quanto si dice sui Ponti, sul Ponte dei Morti passano carri
            con le ruote fasciate, e Teo Marsan non se ne accorge. Qualcuno, alla
            Caserma, si chiede chi glielo abbia detto.
          effetti: { monete: 6, sospetto: 1 }
      - testo: "Avvertire Teo Marsan"
        descrizione: "È un ragazzo e conta tre volte. Prima o poi qualcuno gli venderà, e meglio che lo sappia da te."
        esito:
          titolo: Tre volte
          testo: |
            Lasci la borsa sul parapetto e vai al gabbiotto. Teo ti ascolta con
            la penna sollevata e diventa bianco, poi rosso. Una goccia
            d'inchiostro gli cade sul registro senza che se ne accorga. Ti ringrazia due
            volte e ti chiede se può scriverlo, e lo scrive. La settimana dopo
            Varn Kett ti fa avere un biglietto, tre righe di grafia minuta, in
            cui ti dice che la Gilda ha cambiato i turni del Ponte dei Morti e
            che di questo si ricorderà.
          effetti: { rep.gilda: 1, informazioni.voce: 1 }
      - testo: "Prendere la borsa e tenderle una trappola"
        descrizione: "Darle dei turni sbagliati e aspettare i carri insieme a Teo. Bisogna che lei ci creda."
        prova: { attributo: sociale, abilita: [ingannare, persuasione], difficolta: Difficile }
        successo:
          titolo: Le ruote fasciate
          testo: |
            Le dai un'ora sbagliata abbassando gli occhi, come se ti
            vergognassi un po', e lei se la beve.

            {ingannare Difficile} La vergogna era quasi vera, e per questo ha
            funzionato. Le bugie migliori ne contengono sempre un poco.

            Due notti dopo i carri arrivano con le ruote fasciate di stracci, e
            trovano Teo Marsan sveglio e sei guardie della Gilda. La donna con il
            cappuccio non c'è. Teo ti stringe la mano davanti a tutti, la borsa
            resta a te, e alla Caserma il tuo nome lo scrivono nella colonna giusta.
          effetti: { monete: 6, rep.gilda: 0.5, rep.caserma: 0.5, informazioni.pettegolezzo: 1 }
        fallimento:
          titolo: Il cappuccio
          testo: |
            Le dai l'ora sbagliata e lei ti guarda troppo a lungo, finché non
            senti il bisogno di grattarti il naso. La notte dei
            carri non arriva nessuno. La notte dopo invece arrivano in due, sul
            Ponte dei Morti, mentre torni a casa, e ti spiegano con calma che le
            borse si restituiscono. La borsa se la riprendono, e ti lasciano un
            labbro spaccato e un nome nel registro dei Custodi.
          effetti: { ferite: 1, sospetto: 0.5 }
      - testo: "Chiederle dove è andato Holl"
        descrizione: "Maedric Holl è scappato dalla città prima che lo prendessero. Lei ha l'aria di una che lo conosceva."
        quando: [maedric == 1]
        esito:
          titolo: Una lettera da lontano
          testo: |
            Lei ride sotto il cappuccio, una risata breve che finisce in un
            colpo di tosse. «Holl è un uomo prudente» dice. «È andato dove la
            Gilda non ha gabbiotti, e ci resterà finché qui ha dei debiti.» Ti
            racconta che le ha scritto, una volta sola, per chiederle se il suo
            posto sul ponte era ancora vuoto e chi lo teneva. Poi si riprende
            la borsa, ti saluta con due dita e torna nella nebbia.
          effetti: { informazioni.pettegolezzo: 1 }

  - id: carta-ponti-il-prezzo-del-lyssan
    immagine: ambientazione/acciaieria-di-qir-azel
    titolo: Il prezzo del lyssan
    sommario: "Da quando la ciminiera dei Tarvelin non fuma, al Mercato dei Nodi il lyssan costa quanto l'oro, e qualcuno ha cominciato a dipingerlo."
    luogo: Mercato dei Nodi, i banchi dei metalli
    tipo: carta
    area: ponti-sospesi
    requisiti: [pista.acciaio >= 8]
    testo: |
      Ai banchi dei metalli, sul lato del Mercato dei Nodi che guarda la
      Città Bassa, si parla soltanto della ciminiera dei Tarvelin, che non
      fuma più. Le barre di lyssan raffinato rimaste in città sono poche, e
      ogni mattina i prezzi scritti col gesso sulle lavagnette salgono, e i
      mercanti hanno le nocche bianche di gesso già prima dell'alba. Un fabbro dei
      Quartieri Alti ha comprato un banco intero prima di colazione, e due
      armaioli si sono presi a spinte per una barra sola.

      Un mercante in redingote grigia ti viene incontro come a un vecchio
      amico. Si presenta come Gerardo Vennari, di una famiglia che aveva un
      nome, e ti prende sotto braccio.

      {galateo Media} La redingote è di un buon sarto di qualche anno fa,
      rivoltata con cura sui polsini. Il braccio sotto il tuo lo prende come
      si prendeva una dama, per abitudine più che per affetto.

      {origine rampollo-dei-quartieri-alti} Ti ha riconosciuto per uno dei
      Quartieri Alti dal modo di stare in piedi, e ti tiene il braccio come si
      tiene quello di uno della propria classe. Nei salotti un Vennari che fa
      affari al Mercato dei Nodi sarebbe una notizia per una settimana.

      «In città si dice che c'eri anche tu, quando l'Acciaieria si è
      fermata» dice. «A me basta sapere quando riaccende, e saperlo prima
      degli altri. Una parola sola, e ti pago come un socio.» Sul banco
      accanto un venditore lucida una barra con uno straccio, e lo straccio
      diventa grigio.

      {tecnologia Facile} Il lyssan buono non sporca e non ha bisogno di
      lucido per sembrare vivo. Uno straccio che diventa grigio, su un
      banco di metalli, è una cosa da tenere a mente.
    opzioni:
      - testo: "Vendergli quello che sai"
        descrizione: "Quello che hai visto all'Acciaieria e quello che pensi. Lui lo trasforma in denaro prima di sera."
        esito:
          titolo: Una parola sola
          testo: |
            Gli racconti quello che hai visto e quello che pensi, e lui ascolta
            annuendo, con gli occhi che fanno già i conti. Ti paga in una borsa
            di velluto ancora calda della sua tasca, che ti mette in mano
            come si dà una mancia. Prima di sera ha comprato tutte le barre del lato che
            guarda la Città Bassa, e due giorni dopo le rivende al doppio. Al
            Grifone qualcuno dice il tuo nome insieme al suo, e Liaren, quando
            lo sente, posa il boccale che stava asciugando.

            {empatia Media} Lo posa piano, senza guardarti. Con Liaren è peggio
            di un boccale sbattuto sul bancone.
          effetti: { monete: 8, rep.tarvelin: -1 }
      - testo: "Smascherare il lyssan dipinto"
        descrizione: "Il lyssan spento diventa grigio e non vale niente. Una mano di vernice lo fa sembrare vivo, finché qualcuno non lo gratta."
        prova: { attributo: mentale, abilita: [tecnologia, accademiche], difficolta: Media }
        successo:
          titolo: La vernice
          testo: |
            Ti avvicini al banco accanto e chiedi di vedere una barra, e il
            venditore te la porge un momento troppo tardi. Il lyssan vero,
            quando ci passi sopra un cristallo, fa un ronzio che senti nelle
            unghie. Questo resta muto, e sotto l'unghia ti rimane
            una scaglia di vernice. Lo dici ad alta voce. I due armaioli si
            voltano insieme, il venditore scappa lasciando il banco, e il
            Custode che arriva ti ringrazia e ti lascia una parte della multa.
          effetti: { monete: 2, rep.gilda: 0.5, informazioni.voce: 1 }
        fallimento:
          titolo: La barra buona
          testo: |
            Gratti la barra con l'unghia e dici che è vernice, e il venditore ti
            porge un coltello perché tu possa grattare meglio. Sotto c'è lyssan
            vero, e il ronzio arriva a tutti quelli che hanno un cristallo in tasca.
            Ti si scaldano le orecchie fino alla punta. La folla ride, il venditore
            pretende scuse pubbliche, e Gerardo Vennari si allontana fingendo di non
            conoscerti.
          effetti: { scandalo: 1 }
      - testo: "Mandarlo a chiederlo a Liaren"
        descrizione: "L'Acciaieria è dei Tarvelin, e la Tarvelin che resta tiene la locanda a due piattaforme da qui."
        esito:
          titolo: Il nome giusto
          testo: |
            Gli dici che la persona da cui andare è Liaren Tarvelin, e che la
            trova al Grifone. Gerardo impallidisce, e la mano sotto il tuo
            braccio si fa umida, perché la storia del mestolo la conoscono
            anche nei Quartieri Alti. Ti lascia il braccio
            e un biglietto da visita con l'angolo piegato. La sera, al Grifone,
            Brunella ti mette davanti un piatto che non hai ordinato, e ti dice
            che a quanto pare il vento gira anche per chi non vende niente.
          effetti: { rep.tarvelin: 0.5, informazioni.voce: 1 }

  - id: carta-ponti-le-passerelle-di-sotto
    immagine: ambientazione/mercato-dei-nodi
    titolo: Le passerelle di sotto
    sommario: "Senza gli Scuri, sotto le assi del Mercato due bande si contendono le passerelle buone, e stanotte qualcuno ne ha tagliata una."
    luogo: Sottoponti, sotto il Mercato dei Nodi
    tipo: carta
    area: ponti-sospesi
    requisiti: [pista.pelle >= 6]
    testo: |
      Da quando Mirko Vesh è morto e gli Scuri si sono sbandati, sotto il
      Mercato dei Nodi le passerelle buone non hanno più un padrone. Sono
      quelle che portano dalle reti agli argani di servizio, e chi le tiene
      decide che cosa sale sulle assi senza passare dal gabbiotto. Adesso se
      le contendono due bande. I ragazzi della corda vengono dalla Città
      Bassa e sono svelti. I Lunghi stanno sotto i ponti da sempre e hanno i
      coltelli più vecchi.

      {origine figlio-della-citta-bassa} I ragazzi della corda hanno l'età che
      avevi tu quando portavi i messaggi degli Scuri, e un paio hanno ancora
      le facce di Via del Salmone. Ai tempi di Mirko le passerelle non le
      tagliava nessuno, e ti sorprende provare qualcosa di simile alla
      nostalgia.

      {armi-da-mischia Media} I coltelli dei Lunghi sono lame corte e
      ricurve, da cordaio, fatte per le funi prima che per le persone. Una
      passerella tagliata di netto ha l'aria di un lavoro loro.

      Stanotte qualcuno ha tagliato una passerella, e una donna che ci
      passava sopra con la spesa è rimasta appesa alla fune per mezz'ora.
      Una vecchia dei sottoponti, con un fazzoletto nero e una pipa spenta
      fra i denti, ti aspetta in cima alla scala a pioli, e quando parla la
      pipa resta ferma come se fosse inchiodata. «Tu di sopra conti
      qualcosa» dice. «Qui sotto, prima che ci scappi il morto, qualcuno
      deve dire a questi dov'è il confine.»

      {conoscenze-della-strada Media} Sotto i ponti comanda chi decide cosa
      sale senza passare dal gabbiotto. Le passerelle buone valgono quanto il
      pedaggio che ci passa sopra, e quel pedaggio nessuno lo scrive.
    opzioni:
      - testo: "Far sloggiare i Lunghi"
        descrizione: "Sono loro ad avere tagliato la passerella, lo sanno tutti. Bisogna convincerli che non conviene rifarlo."
        prova: { attributo: sociale, abilita: intimidire, difficolta: Difficile }
        successo:
          titolo: I coltelli vecchi
          testo: |
            Scendi fino alla piattaforma dei Lunghi e ti siedi in mezzo a loro senza
            chiedere il permesso, anche se le ginocchia ti suggeriscono di restare
            in piedi. Parli piano della Caserma e di quello che sai fare, e a un
            certo punto il più vecchio rinfodera il coltello. Il giorno dopo le
            passerelle di levante sono libere. La vecchia ti fa avere una borsa di
            frammenti e qualche moneta, raccolti fra i ripari, e nessuno ti chiede
            da dove vieni.
          effetti: { cristalli.frammento-esausto: 2, monete: 2 }
        fallimento:
          titolo: La passerella stretta
          testo: |
            I Lunghi ti lasciano parlare e poi ti accompagnano verso l'uscita
            su una passerella larga una spanna, con uno di loro davanti e gli
            altri dietro. A metà passerella uno inciampa apposta. Ti ritrovi
            appeso alla fune come la donna della spesa, con un taglio sul
            fianco che brucia più del freddo, e risali da solo mentre loro
            ridono dalla piattaforma.
          effetti: { ferite: 1.5 }
      - testo: "Tracciare un confine"
        descrizione: "Le reti a una banda e gli argani all'altra, con una passerella di mezzo dove nessuno tocca nessuno."
        prova: { attributo: sociale, abilita: [persuasione, conoscenze-della-strada], difficolta: Media }
        successo:
          titolo: La passerella di mezzo
          testo: |
            Riunisci i due capi sulla piattaforma della vecchia, uno per lato del
            braciere, e disegni il confine con il carbone sulle tavole. Le reti ai
            ragazzi della corda, gli argani ai Lunghi, e la passerella di mezzo a
            chi ci deve passare con la spesa. Si sputano sulle mani e se le
            stringono, e tu, per educazione, guardi altrove. Da quel giorno, una
            volta al mese, sulla tua porta compare un sacchetto che nessuno ha
            portato.
          effetti: { monete: 4, sospetto: 0.5 }
        fallimento:
          titolo: Il carbone
          testo: |
            Cominci a disegnare il confine con il carbone, e i due capi cominciano a
            discutere su dove passa la linea e finiscono a discutere di te. Quando
            volano i primi pugni, uno dei quali trova il tuo occhio, la vecchia ti
            tira per la giubba fino alla scala a pioli. Sali con un occhio gonfio e
            la sensazione che sotto i Ponti di te parleranno a lungo.
          effetti: { ferite: 0.5, scandalo: 0.5 }
      - testo: "Fare i nomi alla Caserma"
        descrizione: "Alla Caserma credono che, senza gli Scuri, sotto i Ponti sia tornata la calma. Di queste due bande non sanno niente."
        esito:
          titolo: La retata
          testo: |
            Al sergente di guardia in Città Bassa racconti tutto quello che sai
            sulle passerelle, e lui lo scrive con la lingua fra i denti. Due
            notti dopo le guardie scendono nei sottoponti con le lanterne e le
            reti, e per una settimana le bande spariscono. La
            vecchia con la pipa, la volta dopo che la incroci, guarda dall'altra
            parte. Le passerelle sono di nuovo libere, e sotto le assi qualcuno
            ha scritto il tuo nome sopra una trave, con il carbone.
          effetti: { rep.caserma: 1, sospetto: -0.5 }
      - testo: "Scendere con il distintivo"
        descrizione: "Il nome nella lista dei vice-sceriffi di Galdrick, sotto i ponti, lo conoscono tutti."
        quando: [guarnigione.distintivo >= 1]
        esito:
          titolo: La lista dello sceriffo
          testo: |
            Scendi la scala a pioli con il distintivo appuntato sulla giubba,
            dove si vede. Le due bande ti vengono incontro ciascuna dal suo
            lato. I capi sentono il tuo nome e decidono di colpo che il confine
            si può discutere senza coltelli. Il distintivo sulla giubba ti
            sembra pesare più del solito. La vecchia ti offre la pipa, ormai
            accesa. Fumando ti dice chi, sotto le assi, si
            è messo a comprare le passerelle per conto di qualcuno di sopra.
          effetti: { rep.caserma: 0.5, informazioni.pettegolezzo: 1 }
