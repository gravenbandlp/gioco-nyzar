# Ponti Sospesi, il mazzo del quartiere (ottobre 2026). Prima c'erano sette carte (carte.yaml, ponti.yaml,
# nodo.yaml, grifone.yaml, piste/tribu.yaml) e con la mano da tre si ripetevano troppo. Qui ce ne sono venti:
# tredici singole sulla vita del quartiere, la catena di Ilde Sarrocchi in quattro carte e tre carte che arrivano
# con le piste avanzate.
#
# LE SINGOLE: tutte ripetibili, tranne la vendita di Clelia Vennari (visto.carta-ponti-clelia-vennari).
#   galline al gabbiotto, le botti di Varn Kett, l'asta dei colli, la casa che dondola, il gabbiano, l'involto
#   nella borsa, la lanterna che sfrigola, il cantastorie senza voce, Clelia Vennari, il posto del banco, la
#   lenza fra le assi, la nebbia sulla campata, l'approdo delle chiatte (con chiatta.posto == 1 la via di Ilde).
#
# LA CATENA DI ILDE SARROCCHI, la chiattaiola della Mula (una carta alla volta, ogni opzione porta al passo dopo)
#   chiatta.ilde       0 non la conosci, 1..3 i passi fatti, 4 finita.
#     carta-ilde-la-mula            0 → 1  l'argano bloccato. Guardarci dentro (successo) trova il cuneo: chiatta.cuneo 1.
#     carta-ilde-il-carico          1 → 2  il privilegio di fune e le botti sotto sigillo. Con licenza-gilda una via in più.
#     carta-ilde-la-fune-segata     2 → 3  chi ha segato il cavo: la posta, i soldi, il cuneo (chiatta.cuneo == 1, senza
#                                          prova) danno chiatta.colpevole 1.
#     carta-ilde-l-ultima-traversata 3 → 4 la lettera della Gilda. Convincerla (successo) o fare il nome di Bracco a Varn
#                                          Kett (chiatta.colpevole == 1) la fanno restare: chiatta.fine 1 e chiatta.posto 1.
#                                          Altrimenti vende (chiatta.fine 2) e ti dà la tua parte.
#   chiatta.posto, la ricompensa che resta: un posto sulla Mula. Apre l'opzione migliore dell'approdo delle chiatte.
#
# LE CARTE CHE ARRIVANO DOPO
#   carta-ponti-il-turno-di-notte     pista.registro >= 5: il custode nuovo del Ponte dei Morti (con maedric == 1
#                                     una domanda in più su Holl).
#   carta-ponti-il-prezzo-del-lyssan  pista.acciaio >= 8: l'Acciaieria ferma e il lyssan dipinto.
#   carta-ponti-le-passerelle-di-sotto pista.pelle >= 6: i sottoponti senza gli Scuri (con guarnigione.distintivo una via in più).
#
# Nomi nuovi, che il Codex non dà: Ilde Sarrocchi (chiattaiola, intercalare «socio», la liquirizia fra i denti) e la
# sua chiatta, la Mula; Ugo Bracco (padrone delle chiatte grandi); Clelia Vennari (l'ultima di una famiglia del Patto
# delle Corde) e suo cugino Gerardo; Ruggero Fosco (mercante d'olio); Bastiano Rocca (cantastorie); Teo Marsan
# (custode notturno dopo Maedric Holl); i ragazzi della corda e i Lunghi (bande dei sottoponti); i gabbiani di cresta
# grigia. Luoghi: le chiatte a fune e il loro approdo, a valle del Ponte delle Mille Corde (piattaforme da carico tirate
# su cavi d'acciaio fra le due sponde della Cicatrice, per le merci troppo pesanti per le assi); il privilegio di fune
# (dal Patto delle Corde, chi ha un argano porta la propria merce senza gabella); lo slargo della campana, la campata
# di ponente, la piattaforma dei bottai.
# Nessuna cifra nella prosa: i numeri stanno negli effetti (docs/stile-dei-testi.md, regola 11).
quality:
  - { id: chiatta.ilde, nome: "Ilde Sarrocchi e la Mula", categoria: stato, nascosta: true, descrizione: "A che punto sei con Ilde Sarrocchi, da 0 (non la conosci) a 4 (la sua storia è chiusa)." }
  - { id: chiatta.cuneo, nome: "Il cuneo nell'argano", categoria: stato, nascosta: true, descrizione: "1 se hai trovato il cuneo di quercia piantato nell'argano della Mula." }
  - { id: chiatta.colpevole, nome: "Chi ha segato la fune", categoria: stato, nascosta: true, descrizione: "1 se sai che dietro la fune segata della Mula c'è Ugo Bracco." }
  - { id: chiatta.fine, nome: "Com'è finita con la Mula", categoria: stato, nascosta: true, descrizione: "1 se Ilde ha tenuto la Mula e il privilegio di fune, 2 se l'ha venduto alla Gilda." }
  - { id: chiatta.posto, immagine: icone/pulley-hook, nome: "Un posto sulla Mula", categoria: stato, descrizione: "Ilde Sarrocchi ti tiene un posto sulla sua chiatta, e all'approdo ti fa lavorare per prima." }
  - { id: visto.carta-ponti-clelia-vennari, nome: "Il panno di Clelia Vennari", categoria: stato, nascosta: true }

storylet:
  # ================================================================ le singole
  - id: carta-ponti-la-gabella-delle-galline
    immagine: icone/chicken
    titolo: La gabella delle galline
    sommario: "Al gabbiotto dei Custodi una ragazza con una gabbia di galline riconta gli spiccioli, e il conto non cambia."
    luogo: Ponte delle Mille Corde, il gabbiotto dei Custodi
    tipo: carta
    area: ponti-sospesi
    testo: |
      All'imbocco del Ponte delle Mille Corde la fila per la gabella è ferma.
      Alla finestrella del gabbiotto una ragazza con una gabbia di sei
      galline sulla schiena riconta gli spiccioli nel palmo, e il Custode di
      turno, con il colletto inamidato, batte il gesso sul tariffario
      inchiodato accanto. «Sei galline sono merce, e la merce paga per capo.
      Se fossero uova, sarebbe un altro discorso.»

      {politica-ed-economia Facile} I tariffari dei Custodi hanno sempre una
      coda in caratteri piccoli, e nessuno ci arriva mai.

      La ragazza si volta verso di te, che sei il primo della fila.
    opzioni:
      - testo: "Pagare la differenza"
        descrizione: "Quello che le manca è meno di una cena al Grifone."
        requisiti: [monete >= 1]
        esito:
          titolo: Un uovo tiepido
          testo: |
            Posi le monete sul davanzale, e il Custode le fa sparire nel cassetto
            con un sollievo che cerca di nascondere. La ragazza passa, poi torna
            indietro di corsa e ti mette in mano un uovo ancora tiepido, che ti
            porti dietro tutto il giorno perché non sai dove metterlo.
          effetti: { monete: -1, tormento: -0.5 }
      - testo: "Convincere il Custode che sono uova"
        descrizione: "Una gallina, in fondo, è un uovo che ci ha messo più tempo. Basta dirlo con la faccia giusta."
        prova: { attributo: sociale, abilita: persuasione, difficolta: Media }
        successo:
          titolo: Uova a venire
          testo: |
            Spieghi al Custode che quelle sono uova a venire, mentre una gallina ti
            smentisce con un verso indignato. Lui scoppia a ridere e scrive *uova*
            sulla ricevuta. Fuori dal gabbiotto la ragazza ti racconta che i suoi
            vicini, a Laresh, vendono il grano ai carri che passano di notte.
          effetti: { informazioni.voce: 1 }
        fallimento:
          titolo: La lavagnetta
          testo: |
            Il Custode ti ascolta fino in fondo con la pazienza dei funzionari, poi
            scrive il tuo nome sulla tavoletta sotto la voce *intralcio*, in bella
            calligrafia. La fila adesso ti guarda come la causa del ritardo, e alla
            fine la ragazza lascia due galline in pegno al gabbiotto e passa con le
            altre.
          effetti: { scandalo: 1 }
      - testo: "Leggere il tariffario"
        descrizione: "È inchiodato lì accanto, e nessuno lo legge fino in fondo, compreso chi lo applica."
        prova: { attributo: mentale, abilita: politica-ed-economia, difficolta: Facile }
        successo:
          titolo: Animali portati a mano
          testo: |
            In fondo al tariffario, in caratteri piccoli, una voce che il Custode
            non ricordava fa pagare la metà agli animali portati a mano da chi li
            alleva. Lui arrossisce fino alle orecchie e rifà il conto, che la
            ragazza può pagare. Quando passi, ti saluta con due dita al cappello.
          effetti: { rep.gilda: 0.5 }
        fallimento:
          titolo: Il tariffario lungo
          testo: |
            Il tariffario è lungo più di un braccio e scritto fitto, e ti perdi
            fra la voce del sale e quella delle pelli conciate. Quando alzi la
            testa la ragazza ha già lasciato due galline in pegno ed è passata con
            le altre, e il Custode ti chiede con garbo se hai trovato quello che
            cercavi.
          effetti: { scandalo: 0.5 }
      - testo: "Dichiarare le galline come merce tua"
        descrizione: "Con la licenza della Gilda la tua merce non paga la gabella. Per un giorno, sei un allevatore."
        quando: [licenza-gilda >= 1]
        esito:
          titolo: Allevatore per un giorno
          testo: |
            Mostri la licenza e dici che le galline sono tue, e il Custode, dopo
            averla studiata a lungo, timbra. Dall'altra parte del gabbiotto la
            ragazza si riprende la gabbia e ti racconta dei carri che passano di
            notte dalle parti di Laresh, carichi di grano che nessun mulino ha
            macinato.
          effetti: { informazioni.voce: 1, tormento: -0.5 }

  - id: carta-ponti-il-conto-delle-botti
    immagine: personaggi/varn-kett
    titolo: Il conto delle botti
    sommario: "Varn Kett cerca un testimone che non sia della Gilda, e tu passavi di lì nel momento sbagliato."
    luogo: Mercato dei Nodi, la piattaforma dei bottai
    tipo: carta
    area: ponti-sospesi
    testo: |
      Sulla piattaforma dei bottai le botti stanno impilate su tre file e
      legate con le cinghie. Davanti alla pila ci sono Varn Kett, nel
      cappotto color tabacco abbottonato fino al mento, e Ruggero Fosco,
      mercante d'olio, in un panciotto di velluto tirato sulla pancia.

      «Lei» dice Varn, e ti indica senza alzare la mano. «Conti queste botti
      e dica il numero ad alta voce, così il signor Fosco non potrà dire che
      me lo sono inventato.»

      Mentre ti avvicini, il mercante ti passa accanto in una nuvola di
      acqua di rose e ti lascia cadere in tasca qualcosa che tintinna.
    opzioni:
      - testo: "Contare come si deve"
        descrizione: "Le file sono tre, e quella dietro si vede male. Forse è messa apposta per vedersi male."
        prova: { attributo: mentale, abilita: percezione, difficolta: Media }
        successo:
          titolo: La fila di dietro
          testo: |
            Fra la pila e il parapetto trovi la terza fila, nascosta da un telo
            color legno. Al tuo numero Fosco smette di sorridere, e le dita di
            Varn si fermano a metà di una riga invisibile. Più tardi un garzone
            della Gilda ti porta la paga del testimone, e la moneta del mercante
            nessuno te la chiede.
          effetti: { monete: 3, rep.gilda: 0.5 }
        fallimento:
          titolo: Il telo color legno
          testo: |
            Conti due volte, ti viene lo stesso numero e lo dici con sicurezza.
            Varn ti ringrazia, poi solleva un telo color legno dietro la pila,
            scopre una terza fila che non avevi visto e rifà il conto da solo a
            mezza voce. Fosco ti guarda con una gratitudine che ti mette a
            disagio, e Varn non ti guarda più.
          effetti: { scandalo: 0.5 }
      - testo: "Sbagliare il conto a favore del mercante"
        descrizione: "Una moneta in tasca, altre se il numero viene basso. Ma Varn Kett non ha mai sbagliato una riga."
        prova: { attributo: sociale, abilita: ingannare, difficolta: Media }
        successo:
          titolo: Un numero tondo
          testo: |
            Dici un numero tondo e credibile, più basso di una fila. Varn lo annota
            senza crederci, e capisci che di te si ricorderà. La sera, al Grifone,
            un ragazzo con il grembiule unto ti mette in mano un sacchetto da parte
            del signor Fosco, che odora di acqua di rose.
          effetti: { monete: 4, sospetto: 1 }
        fallimento:
          titolo: La riga di Varn
          testo: |
            Dici il tuo numero, e Varn non lo ripete. Solleva il telo sulla fila
            di dietro e ti chiede di svuotare la tasca della giubba davanti a
            tutti. La moneta di Fosco finisce nel registro della Gilda come prova,
            con il tuo nome accanto, e il mercante ha già trovato un appuntamento
            urgente dall'altra parte del Mercato.
          effetti: { sospetto: 1.5, rep.gilda: -0.5 }
      - testo: "Restituire la moneta davanti a Varn"
        descrizione: "Tirarla fuori dalla tasca e posarla sul coperchio della prima botte, dove la vedano tutti."
        esito:
          titolo: Sul coperchio
          testo: |
            Posi la moneta sul coperchio della prima botte, e Fosco diventa
            paonazzo. Varn conta le botti da solo, compresa la fila nascosta sotto
            un telo, poi ti accompagna alla passerella raccontandoti che i Fosco
            pagano la Gilda con l'olio annacquato da tre generazioni.
          effetti: { rep.gilda: 0.5, informazioni.pettegolezzo: 1 }

  - id: carta-ponti-i-colli-senza-padrone
    immagine: icone/cargo-crate
    titolo: I colli senza padrone
    sommario: "Una volta al mese i Custodi mettono all'asta i colli che nessuno è tornato a prendere, a scatola chiusa."
    luogo: Ponte delle Mille Corde, la piattaforma dietro il gabbiotto
    tipo: carta
    area: ponti-sospesi
    testo: |
      Sulla piattaforma dietro il gabbiotto i Custodi di Passaggio vendono
      all'asta casse senza bolla e involti con l'indirizzo lavato dalla
      pioggia. Il banditore, un Custode anziano con la voce rovinata, batte
      un martelletto su un barile e tossisce a ogni battuta, e i rigattieri
      del Mercato dei Nodi alzano la mano a turno, senza fretta.

      {conoscenze-della-strada Media} Il finale l'hanno deciso stamattina
      all'osteria, e le mani alzate servono a far salire il prezzo a chi non
      è della compagnia.

      A metà del lotto successivo la voce del banditore si rompe del tutto.
    opzioni:
      - testo: "Puntare sul collo giusto"
        descrizione: "Sigilli e cuciture dicono da dove arriva un collo, anche senza bolla, a chi li sa leggere."
        requisiti: [monete >= 3]
        prova: { attributo: mentale, abilita: [politica-ed-economia, percezione], difficolta: Media }
        successo:
          titolo: La ceralacca di Pannion
          testo: |
            Scegli una cassetta chiusa con la ceralacca blu dei molatori di lenti
            di Pannion e la spunti con un'offerta sola, perché i rigattieri la
            guardano appena. Dentro, fra la paglia, avvolti in un fazzoletto
            ricamato, trovi un cristallo limpido senza un graffio e un frammento
            di metallo inciso con una regolarità che nessuna mano ha.
          effetti: { monete: -3, cristalli.cristallo-sterile: 1, reliquie.frammento-inciso: 1 }
        fallimento:
          titolo: Stivali spaiati
          testo: |
            Il sacco che scegli è pesante e promette bene, e un rigattiere ti
            lascia vincere con un sorriso largo fino al dente d'oro. Dentro ci
            sono stivali spaiati, tutti del piede sinistro, e in fondo un rotolo
            di tela pulita che la sera tagli a strisce per farne bende.
          effetti: { monete: -3, bende: 1, scandalo: 0.5 }
      - testo: "Prendere il martelletto"
        descrizione: "Al banditore è andata via la voce. A te no, e i rigattieri pagano di più quando si divertono."
        prova: { attributo: sociale, abilita: espressivita, difficolta: Media }
        successo:
          titolo: Il banditore
          testo: |
            Il Custode ti passa il martelletto e si siede sul barile a bere acqua
            e miele. Tu presenti ogni lotto come se venisse dal tesoro di un re, e
            una cassa di cucchiai spaiati diventa l'argenteria di un Casato
            decaduto. A fine asta il Custode ti allunga una parte dell'incasso.
          effetti: { monete: 3, rep.gilda: 0.5 }
        fallimento:
          titolo: Il lotto sbagliato
          testo: |
            Cominci bene, con la voce larga e sicura, finché non confondi due
            lotti e aggiudichi a un rigattiere una cassa di candele al prezzo di
            un sacco di chiodi, che lui paga in fretta prima di sparire. Il
            banditore si riprende il martelletto senza una parola, e per il resto
            dell'asta i rigattieri ti chiamano *maestro*.
          effetti: { scandalo: 1 }
      - testo: "Comprare il lotto che non vuole nessuno"
        descrizione: "Un pacco di lettere legate con lo spago, offerto per quasi niente, e nessuno alza la mano."
        requisiti: [monete >= 1]
        esito:
          titolo: Le lettere non consegnate
          testo: |
            Le lettere sono una trentina, tutte per lo stesso indirizzo dei
            Quartieri Alti e mai aperte. Le leggi la sera, con un po' di vergogna.
            Parlano di affari andati male e di un debito di gioco, e in una c'è il
            nome di un Custode che chiudeva un occhio a pagamento.
          effetti: { monete: -1, informazioni.voce: 2 }

  - id: carta-ponti-la-casa-che-dondola
    immagine: ambientazione/ponti-sospesi
    titolo: La casa che dondola
    sommario: "Al margine del reticolo una casa appesa ha perso una corda, e il vento la sbatte contro la trave maestra."
    luogo: Ponti Sospesi, le case appese del margine
    tipo: carta
    area: ponti-sospesi
    testo: |
      Ai margini del reticolo le case appese stanno sotto le travi come nidi
      di vespe, tenute da quattro corde. Stasera il vento sale di traverso
      dalla Cicatrice, e una ha perso la corda dell'angolo verso il vuoto,
      così pende di sbieco e a ogni raffica batte contro la trave.

      Dalla finestra si affaccia un vecchio con un bambino in braccio. Sulla
      passerella i vicini danno consigli tutti insieme, e uno tiene un rotolo
      di corda nuova che nessuno porta fino all'angolo.

      {origine apprendista-raschiatore} Il nodo per una corda d'angolo te
      l'hanno fatto legare al buio, sulle piattaforme.
    opzioni:
      - testo: "Portare la corda fino all'angolo"
        descrizione: "Lungo la trave, con il vuoto sotto e il vento di traverso, mentre i vicini ti gridano il nodo."
        prova: { attributo: fisico, abilita: acrobazia, difficolta: Media }
        successo:
          titolo: Il nodo dei vicini
          testo: |
            Cammini sulla trave con le braccia larghe, mentre i vicini ti gridano
            il nodo ognuno a modo suo, e alla fine le mani ne fanno uno che regge.
            Il vecchio ti regala un vasetto di unguento che preparava sua moglie, e
            che lui prepara ancora adesso che lei non c'è più.
          effetti: { unguento: 1 }
        fallimento:
          titolo: Le mani sulla trave
          testo: |
            A metà trave una raffica ti prende di fianco e ti ritrovi appeso per
            le braccia. I vicini ti tirano su per la cintura, e la corda la legano
            poi i ponteggiatori della Gilda, arrivati con calma. Hai le mani
            scorticate fino al polso e una spalla che domani ti farà sapere come
            la pensa.
          effetti: { ferite: 1 }
      - testo: "Tenere ferma la casa mentre escono"
        descrizione: "Se tieni tesa la fune di servizio dell'angolo sano, il vecchio ha il tempo di uscire con il bambino."
        prova: { attributo: fisico, abilita: resistenza, difficolta: Facile }
        successo:
          titolo: La fune tesa
          testo: |
            Ti avvolgi la fune intorno al braccio e punti i piedi sulla passerella,
            tirando indietro a ogni raffica finché le spalle ti bruciano. Il
            vecchio esce con il bambino, poi torna dentro a prendere una gabbia con
            un merlo, e soltanto allora ti dice che puoi lasciare.
          effetti: { tormento: -0.5 }
        fallimento:
          titolo: Lo strappo
          testo: |
            Tieni la fune finché il vecchio passa il bambino ai vicini, poi una
            raffica te la strappa di mano bruciandoti il palmo. Il vecchio esce lo
            stesso aggrappandosi alla porta e si siede sulla passerella con la
            testa fra le mani, e a te le mani tremano per un'ora.
          effetti: { ferite: 0.5 }
      - testo: "Mettere d'accordo i vicini"
        descrizione: "Sono in dieci e hanno tutti un'idea. Basterebbe che ne avessero una sola."
        prova: { attributo: sociale, abilita: [persuasione, intimidire], difficolta: Media }
        successo:
          titolo: Una catena di braccia
          testo: |
            Alzi la voce sopra le loro con un tono da caposquadra che credevi di non
            avere, e dai un compito a ciascuno. Ci mettono meno a legare la corda di
            quanto ne avevano perso a litigare. Dopo, uno di loro ti racconta quale
            Custode lascia passare i carri senza contarli in cambio di vino.
          effetti: { informazioni.voce: 1 }
        fallimento:
          titolo: Più forte
          testo: |
            Alzi la voce, loro alzano la loro, e la passerella diventa un mercato
            del pesce. Intanto la casa perde un'altra corda, e il vecchio esce
            dalla finestra con il bambino a forza di braccia, da solo. I
            ponteggiatori arrivano a cose fatte e chiedono chi è il responsabile,
            e dieci dita indicano te.
          effetti: { scandalo: 1 }

  - id: carta-ponti-il-ladro-con-le-ali
    immagine: icone/seagull
    titolo: Il ladro con le ali
    sommario: "Un gabbiano ha rubato la borsa a una venditrice di pesce, e la tiene sul cavo più alto del Mercato."
    luogo: Mercato dei Nodi, sotto le funi delle lanterne
    tipo: carta
    area: ponti-sospesi
    testo: |
      Uno dei gabbiani di cresta grigia che salgono dalla Cicatrice ha
      strappato la borsa a una venditrice di pesce secco, e adesso sta sul
      cavo più alto del Mercato, quello delle lanterne, con la cresta dritta e
      la borsa nel becco.

      {origine figlio-del-circolo} Nel Bosco di Velthar i gabbiani non
      arrivano, e questo ti sembra una gazza ingrassata dalla città.

      La venditrice ti afferra il polso. «Dentro c'è l'incasso della
      settimana. Chi me la riporta mangia pesce gratis fino all'inverno.»
    opzioni:
      - testo: "Tirargli qualcosa"
        descrizione: "Un sasso, una castagna, il manico di un coltello. Il cavo è alto, e sotto c'è la folla."
        prova: { attributo: fisico, abilita: armi-da-distanza, difficolta: Media }
        successo:
          titolo: Una castagna ben tirata
          testo: |
            Prendi una castagna dal cartoccio di un ragazzo e la tiri con tutto il
            braccio. Il gabbiano colpito sotto l'ala strilla e lascia cadere la
            borsa sul tendone di un banco di stoffe. La venditrice la recupera con
            un manico di scopa e, invece del pesce gratis, ti mette in mano
            qualche moneta contandola due volte.
          effetti: { monete: 2 }
        fallimento:
          titolo: La lanterna
          testo: |
            Il sasso passa a un palmo dal gabbiano e prende in pieno il vetro di
            una lanterna. Mentre i cocci piovono sulla folla il gabbiano se ne va
            con la borsa, e un Custode si fa largo fino a te con la tavoletta. La
            venditrice, adesso, dice di non averti mai visto.
          effetti: { scandalo: 1 }
      - testo: "Arrampicarsi sul palo delle lanterne"
        descrizione: "Il palo è liscio e unto, il cavo è più in alto ancora. Il gabbiano ti guarderà arrivare."
        prova: { attributo: fisico, abilita: atletica, difficolta: Difficile }
        successo:
          titolo: Il nido sul cavo
          testo: |
            Sali il palo a forza di ginocchia e passi sul cavo. Il gabbiano ti
            becca due volte la mano e se ne va offeso, lasciando la borsa nel
            nido, dove fra le cose lucide trovi un paio di monete forestiere e
            qualche scheggia di metallo inciso. La venditrice ti lascia tenere
            tutto quello che non è suo.
          effetti: { monete: 2, reliquie.scheggia: 2 }
        fallimento:
          titolo: Il palo unto
          testo: |
            A metà del palo il gabbiano decide che sei un pericolo e ti piomba sulla
            testa con il becco aperto. Scivoli giù e atterri sulle assi con un tonfo
            che fa girare mezzo Mercato, mentre il gabbiano torna sul cavo, si
            sistema le piume e riprende a soppesare la borsa.
          effetti: { ferite: 1 }
      - testo: "Offrirgli un pesce in cambio"
        descrizione: "Un gabbiano non sa tenere due cose nel becco, e il pesce secco gli piace più dei soldi."
        prova: { attributo: mentale, abilita: natura, difficolta: Facile }
        successo:
          titolo: Lo scambio
          testo: |
            Fai girare in aria un'aringa secca e, quando il gabbiano la vede, la
            lanci in alto. Lui apre il becco per prenderla e la borsa cade nelle
            mani della venditrice, che ti regala l'aringa rimasta e qualche
            spicciolo e ti racconta chi fra i mercanti di Laresh paga il pesce in
            ritardo.
          effetti: { monete: 1, informazioni.voce: 1 }
        fallimento:
          titolo: Due cose nel becco
          testo: |
            Lanci l'aringa, e il gabbiano la prende al volo senza lasciare la borsa,
            perché due cose nel becco, a quanto pare, le tiene benissimo. Se ne va
            verso il fondo della Cicatrice con il pranzo e l'incasso, e la
            venditrice si siede sulla cesta e ride fino alle lacrime.
          effetti: { scandalo: 0.5 }

  - id: carta-ponti-un-peso-in-piu
    immagine: icone/swap-bag
    titolo: Un peso in più
    sommario: "Nella calca prima del gabbiotto qualcuno ti ha infilato in borsa un involto, e i Custodi stanno aprendo le borse."
    luogo: Ponte delle Mille Corde, nella calca prima del gabbiotto
    tipo: carta
    area: ponti-sospesi
    testo: |
      Nella calca prima del gabbiotto ti accorgi che la borsa pesa di più.
      Dentro c'è un involto di tela cerata grande come un mattone, legato
      con lo spago, che prima non c'era.

      {origine figlio-della-citta-bassa} Chi ti infila qualcosa in borsa
      senza dirtelo vuole che a farti prendere sia tu, e l'hai imparato con
      gli Scuri.

      Più avanti i Custodi di Passaggio fanno aprire le borse, e un cane
      magro annusa le caviglie della fila. Oltre il gabbiotto, appoggiato al
      parapetto, un uomo con un cappuccio di tela cerata mangia una mela e
      guarda dalla tua parte.
    opzioni:
      - testo: "Liberartene senza farti vedere"
        descrizione: "Il parapetto è a un passo, e sotto le assi ci sono le reti. Basta un momento di distrazione."
        prova: { attributo: fisico, abilita: furtivita, difficolta: Media }
        successo:
          titolo: Nelle reti
          testo: |
            Aspetti che il cane si metta ad abbaiare all'oca e lasci scivolare
            l'involto oltre il parapetto, finché lo senti cadere nelle reti dei
            sottoponti. Al gabbiotto apri la borsa con l'aria più annoiata che hai.
            L'uomo con la mela ha smesso di mangiare, e adesso la sua faccia la
            conosci, dal neo sulla guancia alla cicatrice sul labbro.
          effetti: { informazioni.voce: 1 }
        fallimento:
          titolo: Il cane
          testo: |
            L'involto ti scivola dalle dita e cade sotto il naso del cane. Dentro ci
            sono cristalli carichi senza il timbro della Gilda, e passi il
            pomeriggio nel gabbiotto a spiegare che non sono tuoi. Quando ti
            lasciano andare il tuo nome è nel registro, e l'uomo con la mela se n'è
            andato da un pezzo.
          effetti: { sospetto: 1.5 }
      - testo: "Consegnarlo ai Custodi"
        descrizione: "Dire subito che non è tuo, e lasciare che lo aprano loro."
        esito:
          titolo: Senza timbro
          testo: |
            Posi l'involto sul davanzale e spieghi com'è arrivato nella tua borsa.
            Dentro ci sono cristalli carichi senza il timbro della Gilda, e al
            parapetto dell'uomo con la mela resta soltanto il torsolo. Il Custode
            scrive il tuo nome nella colonna di quelli che hanno fatto il loro
            dovere, la più corta delle due.
          effetti: { rep.gilda: 0.5 }
      - testo: "Portarlo all'uomo con la mela"
        descrizione: "Passare il gabbiotto con l'involto e chiedere la paga del corriere. Chi usa le borse altrui sa che si paga."
        prova: { attributo: sociale, abilita: conoscenze-della-strada, difficolta: Media }
        successo:
          titolo: La paga del corriere
          testo: |
            Il Custode è impegnato con l'oca, e tu passi con la borsa chiusa.
            Quando dici all'uomo con la mela quanto costa il trasporto, lui ti
            guarda come un collega e ti mette in mano una borsa piccola e pesante.
            Poi si riprende l'involto e sparisce giù per una scala a pioli.
          effetti: { monete: 4, sospetto: 1 }
        fallimento:
          titolo: Il taglio sulla cinghia
          testo: |
            Porti l'involto all'uomo con la mela e chiedi la tua parte. Lui ti
            allunga una moneta sola, e mentre la guardi offeso un ragazzo ti passa
            alle spalle e taglia la cinghia della borsa. Quando ti giri è già giù
            per la scala a pioli con l'involto, e a te resta un graffio lungo sulla
            mano.
          effetti: { monete: 1, ferite: 0.5 }

  - id: carta-ponti-la-lanterna-che-sfrigola
    immagine: icone/old-lantern
    titolo: La lanterna che sfrigola
    sommario: "Una lanterna di Mana sputa scintille azzurre sulla folla, e il lampionaio della Gilda non si decide a toccarla."
    luogo: Ponte delle Mille Corde, a metà campata
    tipo: carta
    area: ponti-sospesi
    testo: |
      A metà campata una lanterna di Mana sfrigola come grasso in padella, e
      a ogni scatto del cristallo sputa una scintilla azzurra sulla folla,
      che si allarga in cerchio. Il lampionaio della Gilda tiene l'uncino a
      un palmo dal gancio senza decidersi. «Quando fanno così si calmano da
      sole, oppure scoppiano. Se scoppia prende fuoco la fune, e la fune
      regge mezza piattaforma.»

      {origine allievo-di-torvessa} All'Accademia nessuna formula prevedeva
      una folla sotto il cristallo.

      {magia Media} È un cristallo stanco più che rotto, e i cristalli
      stanchi si lasciano convincere da chi ha pazienza.
    opzioni:
      - testo: "Rimettere in pari il cristallo"
        descrizione: "Il cristallo ha il Mana sbilanciato. Con le mani vicine al vetro e la formula giusta torna quieto."
        prova: { attributo: mentale, abilita: magia, difficolta: Media }
        successo:
          titolo: Il polso del cristallo
          testo: |
            Ti metti sotto la lanterna con le mani aperte e accompagni il Mana con la
            formula dei cristalli stanchi, finché la luce si ferma su un bianco
            tranquillo. Il lampionaio ti guarda a bocca aperta, poi ti regala i frammenti
            esausti tolti dalle lanterne della settimana.
          effetti: { cristalli.frammento-esausto: 2 }
        fallimento:
          titolo: La scintilla
          testo: |
            Il Mana ti scappa fra le dita, e la lanterna risponde con una scintilla
            che ti colpisce il dorso della mano. Il cristallo si calma da solo poco
            dopo, come aveva detto il lampionaio, che ha la delicatezza di non
            ricordartelo, e a te resta una bruciatura rotonda sulla mano.
          effetti: { tormento: 1, ferite: 0.5 }
      - testo: "Staccarla dalla fune"
        descrizione: "Se apri il fermo a molla del gancio nel momento giusto, la lanterna viene via e la fune è salva."
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Media }
        successo:
          titolo: Il fermo a molla
          testo: |
            Prendi l'asta, aspetti uno scatto spento e apri il fermo con l'uncino.
            La lanterna ti scende nelle mani, calda come una pagnotta, con dentro
            il cristallo crepato da parte a parte. Il lampionaio te lo lascia,
            perché alla Gilda i cristalli crepati vanno denunciati e lui non ha
            voglia di scrivere.
          effetti: { cristalli.cristallo-sterile: 1 }
        fallimento:
          titolo: La scossa
          testo: |
            Apri il fermo nel momento sbagliato, e la scossa scende lungo l'asta
            fino alle tue mani. Ti ritrovi seduto sulle assi con le dita intorpidite
            e i capelli dritti, mentre la lanterna decide di calmarsi da sola. Il
            lampionaio ti aiuta ad alzarti e ti consiglia, con affetto, di non
            toccare più niente che abbia dentro un cristallo.
          effetti: { ferite: 1 }
      - testo: "Allontanare la gente e lasciarla scoppiare"
        descrizione: "Se proprio deve scoppiare, meglio che sotto non ci sia nessuno."
        esito:
          titolo: Vetri azzurri
          testo: |
            Spingi indietro la folla, che brontola perché voleva vedere. La
            lanterna scoppia quando sotto non c'è più nessuno, e la fune si
            annerisce ma regge, mentre sulle assi restano vetri azzurri e qualche
            frammento di cristallo. Il lampionaio, firmando la multa del Custode,
            ti indica come quello che ha salvato la piattaforma.
          effetti: { cristalli.frammento-esausto: 1, rep.gilda: 0.5 }

  - id: carta-ponti-il-cantastorie-senza-voce
    immagine: icone/scroll-unfurled
    titolo: Il cantastorie senza voce
    sommario: "Bastiano Rocca racconta storie sullo slargo della campana da trent'anni, e stamattina gli è rimasto un filo di voce."
    luogo: Ponte delle Mille Corde, lo slargo della campana
    tipo: carta
    area: ponti-sospesi
    testo: |
      Sullo slargo della campana Bastiano Rocca racconta storie da trent'anni, con
      una bacchetta per indicare i mostri del telone dipinto alle sue spalle.
      Stamattina apre la bocca e ne esce soltanto un soffio rauco, e mentre i
      facchini in fondo cominciano ad alzarsi ti porge la bacchetta con un inchino
      da teatro, una mano sulla gola.

      {origine accolito-del-velo} La voce se ne va così ai ragazzi del coro dopo le
      veglie in Cattedrale.

      {espressivita Media} Il pubblico è già seduto, e se non lo fai alzare nelle
      prime tre frasi è tuo.
    opzioni:
      - testo: "Raccontare una storia vera"
        descrizione: "Una cosa che hai visto o fatto. Il telone lo usi per finta, i mostri ce li metti tu."
        requisiti: [racconto >= 1]
        esito:
          titolo: Il cappello pieno
          testo: |
            Racconti la tua storia indicando il telone a caso, finché la bacchetta
            non ti serve più e i facchini tornano a sedersi. Alla fine il cappello
            è più pieno di quanto Bastiano l'abbia visto da anni, e lui insiste per
            darti la metà grande.
          effetti: { racconto: -1, monete: 5, tormento: -0.5 }
      - testo: "Inventarne una sul momento"
        descrizione: "Sul telone ci sono un cavaliere e una torre. Il resto si trova strada facendo."
        prova: { attributo: sociale, abilita: espressivita, difficolta: Media }
        successo:
          titolo: Il cavaliere che soffriva il vento
          testo: |
            Il tuo cavaliere soffre di vertigini e per arrivare alla torre deve
            attraversare il Ponte delle Mille Corde. I facchini ridono delle sue
            ginocchia molli, e alla fine il drago gli paga la gabella con la
            faccia offesa che fai tu al gabbiotto. Nel cappello piove una manciata
            di monete.
          effetti: { monete: 3 }
        fallimento:
          titolo: La torre
          testo: |
            Cominci dal cavaliere e ti perdi alla torre, quando ti accorgi di non
            sapere perché ci stesse andando. I facchini se ne vanno per primi, poi
            le madri con i bambini, e l'ultimo bambino ti tira una castagna
            dicendo che la storia di Bastiano era più bella. Bastiano ti riprende
            la bacchetta con molta delicatezza.
          effetti: { scandalo: 1 }
      - testo: "Guardargli la gola"
        descrizione: "Una voce che se ne va così in una notte ha di solito un motivo semplice."
        prova: { attributo: mentale, abilita: medicina, difficolta: Facile }
        successo:
          titolo: Miele e sale
          testo: |
            Trovi la gola rossa e gonfia per il fumo delle lanterne, oltre a un
            fiato che sa di acquavite, e gli prescrivi miele e silenzio. Il giorno
            dopo la voce è tornata, e Bastiano ti racconta a bassa voce quello che
            ha sentito dalle prime file, da dove si sente tutto.
          effetti: { informazioni.voce: 2 }
        fallimento:
          titolo: Il rimedio sbagliato
          testo: |
            Gli consigli qualcosa di forte per sciogliere la gola, e Bastiano,
            fiducioso, ti dà retta con la borraccia di un facchino. La voce non
            torna, in compenso la tosse peggiora. Raccoglie il telone e se ne va
            dallo slargo con il cappello vuoto sotto il braccio, e ti saluta lo
            stesso, con la mano.
          effetti: { tormento: 0.5 }

  - id: carta-ponti-clelia-vennari
    immagine: icone/wax-seal
    titolo: L'ultima dei Vennari
    sommario: "Un'anziana vende i ricordi di una famiglia del Patto delle Corde, e il rigattiere offre come per ferro vecchio."
    luogo: Mercato dei Nodi, una piattaforma laterale
    tipo: carta
    area: ponti-sospesi
    requisiti: [visto.carta-ponti-clelia-vennari == 0]
    testo: |
      Su una piattaforma laterale una signora anziana ha steso un panno di
      velluto verde, con sopra una bilancia d'ottone da orafo e, in fondo, un
      sigillo da ceralacca con il manico d'osso. Porta guanti di pizzo, uno
      rammendato sul pollice.

      «Il sigillo glielo lascio, signora Vennari» borbotta il rigattiere.
      «Chi lo compra, un sigillo con un nome che non firma più niente?»

      Clelia Vennari non gli risponde e ti chiama con un cenno del mento,
      come si chiamava un servitore.

      {origine rampollo-dei-quartieri-alti} Il nome Vennari a casa tua si
      diceva a mezza voce, e le gambe si muovono prima dell'orgoglio.
    opzioni:
      - testo: "Trattare per lei"
        descrizione: "Con i modi di chi cura gli affari di una casa importante, che il rigattiere si ricorda ancora."
        prova: { attributo: sociale, abilita: galateo, difficolta: Media }
        successo:
          titolo: L'agente di casa Vennari
          testo: |
            Parli al rigattiere a voce bassa, come l'agente di una casa che ha
            ancora un nome, e lui si toglie il cappello e alza due volte l'offerta
            per la bilancia. Poi Clelia ti racconta di suo nonno, che firmò il
            Patto delle Corde con un nodo di fune perché non sapeva scrivere, e ti
            chiede di raccontarlo in giro.
          effetti: { racconto: 1, rep.gilda: 0.5 }
          imposta: { visto.carta-ponti-clelia-vennari: 1 }
        fallimento:
          titolo: Il cappello in testa
          testo: |
            Parli al rigattiere con tutti i modi che conosci, e lui ti ascolta con
            il cappello in testa, masticando, poi alza le spalle e va a guardare
            un altro banco. Clelia ripiega il panno un angolo dopo l'altro e ti
            ringrazia per il disturbo con una cortesia perfetta, che ti congeda
            come un fornitore.
          imposta: { visto.carta-ponti-clelia-vennari: 1 }
          effetti: { scandalo: 0.5 }
      - testo: "Comprare il sigillo"
        descrizione: "Il manico d'osso è lavorato bene, e lei lo guarda come una cosa viva."
        requisiti: [monete >= 4]
        esito:
          titolo: Il manico d'osso
          testo: |
            Paghi quello che chiede senza trattare. A casa il manico del sigillo
            si allenta fra le tue dita, e dentro c'è un disco di metallo inciso
            con segni che non sono umani. Nel fazzoletto in cui Clelia l'ha
            avvolto, un biglietto elenca le famiglie della Gilda che oggi siedono
            dove sedevano i Vennari.
          effetti: { monete: -4, reliquie.frammento-inciso: 1, informazioni.pettegolezzo: 1 }
          imposta: { visto.carta-ponti-clelia-vennari: 1 }
      - testo: "Guardare bene la bilancia"
        descrizione: "Ha i pesi marchiati con un segno che hai già visto, forse in un libro."
        prova: { attributo: mentale, abilita: accademiche, difficolta: Media }
        successo:
          titolo: I pesi del Patto
          testo: |
            Il segno sui pesi è quello dei primi campioni della Gilda, fusi l'anno
            del Patto delle Corde, e ne sono rimasti pochissimi. Lo dici a Clelia
            a bassa voce, e lei rimette la bilancia nella scatola davanti al
            rigattiere. Una settimana dopo un garzone della Biblioteca ti porta un
            biglietto di ringraziamento e la tua parte.
          effetti: { monete: 3, informazioni.voce: 1 }
          imposta: { visto.carta-ponti-clelia-vennari: 1 }
        fallimento:
          titolo: Un segno qualunque
          testo: |
            Giri i pesi fra le dita e il segno ti sfugge, perché ti sembra di
            averlo visto su una lapide del Cimitero, o forse su un boccale. Clelia
            accetta l'offerta del rigattiere. Più tardi ti accorgi che lui ha
            preso i pesi con molta più cura del resto.
          imposta: { visto.carta-ponti-clelia-vennari: 1 }
          effetti: { tormento: 0.5 }
      - testo: "Salutarla con il suo titolo"
        descrizione: "Nei Quartieri Alti qualcuno si ricorda ancora come ci si rivolge a una Vennari."
        quando: [origine.rampollo-dei-quartieri-alti >= 1]
        esito:
          titolo: Donna Clelia
          testo: |
            Le fai l'inchino che ti hanno insegnato da bambino e la chiami donna
            Clelia. Lei dice il nome di tua nonna e ti fa sedere sullo sgabello del
            rigattiere, che se ne va offeso. Ti racconta chi, nei Quartieri Alti, ha
            comprato i debiti di chi, e ti fa promettere di non vendere mai niente
            su un panno.
          effetti: { informazioni.pettegolezzo: 1, racconto: 1 }
          imposta: { visto.carta-ponti-clelia-vennari: 1 }

  - id: carta-ponti-il-posto-del-banco
    immagine: ambientazione/mercato-dei-nodi
    titolo: Il posto del banco
    sommario: "Due mercanti si contendono lo stesso pezzo di piattaforma, e uno agita una copia del Patto delle Corde."
    luogo: Mercato dei Nodi, la piattaforma centrale
    tipo: carta
    area: ponti-sospesi
    testo: |
      Sulla piattaforma centrale due banchi sono montati sullo stesso pezzo
      di assi. Il vecchio, con il panciotto liso di una famiglia che aveva un
      nome, sventola un foglio che chiama copia del Patto delle Corde, e la
      ragazza di Laresh, con le mani rosse di tintura, ripete che ha pagato
      la licenza il mese scorso.

      {origine mercante-dei-ponti} Ai banchi il Patto delle Corde lo tira
      fuori solo chi non ha rinnovato la licenza.

      Il vecchio afferra un rotolo di stoffa per buttarlo giù e lei gli
      blocca il polso, mentre lui con la mano libera cerca il bastone.
    opzioni:
      - testo: "Separarli"
        descrizione: "Prendere lui per il colletto e lei per la spalla, prima che arrivi il bastone."
        prova: { attributo: fisico, abilita: rissa, difficolta: Facile }
        successo:
          titolo: A distanza di braccio
          testo: |
            Ti metti in mezzo e li tieni a distanza di braccio, lui leggero come un
            fascio di stecchi e lei piantata sulle assi, finché smettono di
            dimenarsi. Il Custode arriva in quel momento, come se aspettasse proprio
            quello, assegna il posto con un tratto di gesso e ti ringrazia per avere
            evitato un verbale.
          effetti: { rep.gilda: 0.5 }
        fallimento:
          titolo: Il bastone
          testo: |
            Ti metti in mezzo nel momento in cui il vecchio alza il bastone, e il
            bastone trova la tua tempia. Ti siedi sulle assi a vedere le stelle in
            pieno giorno, e quando ti rialzi i due hanno smesso di litigare e ti
            guardano preoccupati. Il Custode scrive il tuo nome sul verbale come
            parte in causa.
          effetti: { ferite: 0.5, scandalo: 1 }
      - testo: "Metterli d'accordo"
        descrizione: "Lui ha bisogno di quel posto per un motivo che non dice, lei per uno che dice fin troppo."
        prova: { attributo: sociale, abilita: empatia, difficolta: Media }
        successo:
          titolo: Un giorno a testa
          testo: |
            Li fai parlare uno alla volta, finché il vecchio ammette, guardandosi
            le scarpe, che la casa di famiglia l'ha venduta e quel banco è tutto
            quello che gli resta. Si dividono il posto a giorni alterni. Lei ti
            regala una striscia di stoffa tinta, e lui ti dice a mezza voce quali
            famiglie della Gilda sono piene di debiti.
          effetti: { informazioni.voce: 1, tormento: -0.5 }
        fallimento:
          titolo: Tutti e due contro
          testo: |
            Cominci a parlare di buon senso, e i due si voltano verso di te con la
            stessa faccia, che per un momento li fa sembrare parenti. Lui ti chiede
            chi ti manda, lei se hai una licenza, e quando te ne vai hanno ripreso a
            gridarsi addosso.
          effetti: { scandalo: 1 }
      - testo: "Leggere il foglio del vecchio"
        descrizione: "Una copia del Patto delle Corde, scritta nella lingua dei notai di trent'anni fa. Bisogna saperla leggere."
        requisiti: [accademiche >= 2]
        esito:
          titolo: Il Patto parla di funi
          testo: |
            Leggi il foglio ad alta voce, con il latino dei notai che ti si
            impiglia fra i denti. Del Mercato il Patto delle Corde tace del tutto,
            e il vecchio si sgonfia. Più tardi, ripiegando il foglio, ti spiega
            quali famiglie hanno ancora le quote delle funi.
          effetti: { informazioni.pettegolezzo: 1 }

  - id: carta-ponti-la-lenza-fra-le-assi
    immagine: icone/fishing-hook
    titolo: La lenza fra le assi
    sommario: "Da una fessura fra le assi sale un filo con un amo di ferro, che ha appena preso la tua borsa."
    luogo: Ponte delle Mille Corde, sopra i sottoponti
    tipo: carta
    area: ponti-sospesi
    testo: |
      Fra le bancarelle del Ponte delle Mille Corde la borsa ti tira verso il
      basso, con garbo, come un bambino che vuole farti vedere qualcosa. Da
      una fessura fra due assi è salito un filo incerato, e l'amo di ferro in
      cima si è infilato nella fibbia. Il filo dà uno strattone più deciso,
      perché nel buio dei sottoponti qualcuno ha capito di aver preso
      qualcosa di buono.

      {conoscenze-della-strada Facile} Di sotto la pesca alle borse è un
      mestiere con le sue regole, e chi scende a parlare con il pescatore di
      solito torna su con la fibbia.
    opzioni:
      - testo: "Tirare su la lenza"
        descrizione: "Chi pesca sta sotto, e tu sopra. Con le braccia giuste la pesca la fai tu."
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Media }
        successo:
          titolo: Il pescato
          testo: |
            Afferri il filo con tutte e due le mani e tiri. Sotto qualcuno tiene
            duro, poi molla di colpo, e tu finisci seduto sulle assi con la lenza
            in mano e il pescato della mattina appeso agli ami, un fazzoletto di
            seta e una borsa da cintura che porti al gabbiotto, quasi tutta.
          effetti: { monete: 3 }
        fallimento:
          titolo: La fibbia
          testo: |
            Tiri, e sotto tirano più forte, perché sono in due e hanno i piedi
            puntati su una trave. Il filo si spezza all'altezza dell'amo, che
            scende nei sottoponti con la fibbia della borsa e qualche moneta, e
            dalla fessura arriva una risata, poi un grazie educato.
          effetti: { monete: -1 }
      - testo: "Scendere a conoscere il pescatore"
        descrizione: "Una scala a pioli a dieci passi porta giù, dove vale un'altra legge, ma pur sempre una legge."
        prova: { attributo: sociale, abilita: conoscenze-della-strada, difficolta: Media }
        successo:
          titolo: Il pescatore di borse
          testo: |
            In fondo alla scala un ragazzino con un cappello di paglia tiene la
            canna fra le ginocchia. Quando gli fai i complimenti per il nodo
            dell'amo ti restituisce la fibbia ridendo, perché con chi scende a
            trovarlo si fa così, e ti racconta chi, di notte, cala le casse dai
            ponti senza passare dal gabbiotto.
          effetti: { informazioni.voce: 1 }
        fallimento:
          titolo: Le passerelle
          testo: |
            Scendi la scala e ti perdi subito fra passerelle larghe una spanna,
            con l'aria fredda della Cicatrice che sale fra le tavole, finché ti
            fermi con le ginocchia che tremano e una mano sulla fune. Il pescatore
            lo trovi soltanto quando lui trova te, e ti riaccompagna alla scala
            tenendoti per la manica come un nonno.
          effetti: { tormento: 1 }
      - testo: "Lasciargli una moneta sull'amo"
        descrizione: "Sciogliere l'amo dalla fibbia e rimandarlo giù con una moneta appesa."
        requisiti: [monete >= 1]
        esito:
          titolo: La risposta
          testo: |
            Sciogli l'amo, ci leghi una moneta e lo lasci scendere. Poco dopo risale
            con un pacchetto di carta oleata, e dentro ci sono un rotolo di bende
            pulite e un biglietto a carbone con il nome di un Custode che di notte si
            addormenta, e l'ora in cui succede.
          effetti: { monete: -1, bende: 1, informazioni.voce: 1 }

  - id: carta-ponti-la-nebbia-sulla-campata
    immagine: ambientazione/cicatrice-del-mondo
    titolo: La nebbia sulla campata
    sommario: "Dalla Cicatrice è salita una nebbia che copre la campata da un parapetto all'altro."
    luogo: Ponte delle Mille Corde, la campata di ponente
    tipo: carta
    area: ponti-sospesi
    testo: |
      Al tramonto una nebbia bianca sale dalla Cicatrice e copre la campata di
      ponente da un parapetto all'altro. I Raschiatori dicono che dentro non
      bisogna mai fermarsi, perché chi si ferma comincia a sentire le voci del
      fondo.

      {origine apprendista-raschiatore} La regola della nebbia te l'hanno
      insegnata sulle piattaforme il primo giorno.

      Al gabbiotto della campata due Custodi giocano a Zekar sotto una
      lampada, e il giro lungo per la Città Bassa prende mezza sera. Un
      facchino con la gerla vuota ti si affianca. «Io la passo a occhi chiusi,
      e a te costa soltanto una moneta di compagnia.»
    opzioni:
      - testo: "Attraversarla da solo, senza fermarti"
        descrizione: "Un passo dopo l'altro, con gli occhi sulla lanterna davanti. Quello che senti lo lasci dove lo senti."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Media }
        successo:
          titolo: Le voci del fondo
          testo: |
            A metà campata arrivano le voci, basse come se venissero dalle assi, e
            dicono il tuo nome con l'accento sbagliato. Tu conti i passi e tieni gli
            occhi sulla lanterna davanti. Lo stivale urta qualcosa che raccogli
            senza fermarti, e dall'altra parte, alla luce, è una scheggia di metallo
            inciso, fredda come se venisse dal fondo.
          effetti: { reliquie.scheggia: 1 }
        fallimento:
          titolo: Chi ti chiamava
          testo: |
            A metà campata una voce ti chiama con la voce di qualcuno che conosci,
            e ti fermi a rispondere prima di deciderlo. Ti ritrovi seduto contro
            il parapetto, con la nebbia che si dirada e un Custode che ti scuote
            per una spalla, e quella notte la voce ti viene a cercare anche nel
            sonno.
          effetti: { tormento: 1.5 }
      - testo: "Andare dietro al facchino"
        descrizione: "Una moneta per la compagnia. Lui la nebbia la conosce, e parla per tutto il tempo."
        requisiti: [monete >= 1]
        esito:
          titolo: Le chiacchiere del facchino
          testo: |
            Il facchino cammina con la mano sinistra sul parapetto e ti parla per
            tutto il tempo dei suoi piedi, in particolare di un'unghia che cresce
            storta, e a forza di ascoltarlo le voci del fondo non le senti nemmeno.
            Ti racconta anche chi passa di qui con la nebbia, quando i Custodi
            restano dentro, e che cosa porta.
          effetti: { monete: -1, informazioni.voce: 1 }
      - testo: "Aspettare al gabbiotto e giocare a Zekar"
        descrizione: "I Custodi giocano a poste basse e bluffano male, e finché c'è nebbia un posto al tavolo c'è."
        requisiti: [monete >= 2]
        prova: { attributo: sociale, abilita: ingannare, difficolta: Media }
        successo:
          titolo: La mano dei Custodi
          testo: |
            Il Custode più vecchio si gratta l'orecchio ogni volta che ha una mano
            buona, e dopo tre giri lo sai anche tu. Quando la nebbia si alza hai
            vinto abbastanza da pagarti la cena, e loro ti invitano a tornare, come
            si invita uno da cui ci si vuole rifare.
          effetti: { monete: 3 }
        fallimento:
          titolo: L'orecchio
          testo: |
            Il Custode più vecchio si gratta l'orecchio, e tu ci caschi due volte
            prima di capire che lo fa apposta. Quando la nebbia si alza le tue
            monete sono passate dall'altra parte del tavolo, e i Custodi, di
            ottimo umore, ti aprono la porta del gabbiotto con un inchino.
          effetti: { monete: -2, scandalo: 0.5 }

  - id: carta-ponti-l-approdo-delle-chiatte
    immagine: icone/pulley-hook
    titolo: L'approdo delle chiatte
    sommario: "All'approdo delle chiatte cercano braccia per la prima traversata, e la paga dipende da quanto guardi in basso."
    luogo: Ponti Sospesi, l'approdo delle chiatte
    tipo: carta
    area: ponti-sospesi
    testo: |
      A valle del Ponte delle Mille Corde le chiatte attraversano la
      Cicatrice su funi d'acciaio tese fra gli argani, e portano la pietra
      da taglio troppo pesante per i ponti. All'alba l'approdo è pieno di
      carri e di uomini intorno a un bidone acceso.

      Ugo Bracco, che ha le chiatte grandi e il naso rotto in due punti,
      sceglie le braccia per la prima traversata e ti guarda le mani, poi le
      scarpe. «Uno per l'argano e uno per la bolla. Tu che cosa sai fare?»

      {origine fuggiasco-di-ghoran} A Ghoran guardavano nello stesso ordine
      chi saliva sulla bilancia.
    opzioni:
      - testo: "Lavorare all'argano"
        descrizione: "Quattro uomini per manovella, e la chiatta che pesa come una casa. Si spinge finché il caposquadra non fischia."
        prova: { attributo: fisico, abilita: [resistenza, atletica], difficolta: Media }
        successo:
          titolo: La manovella
          testo: |
            Spingi la manovella con altri tre, a testa bassa, contando i giri. La
            chiatta parte con uno strappo e va sopra il vuoto, e quando arriva
            dall'altra parte il caposquadra fischia e vi lasciate andare sulle assi.
            Bracco paga a fine turno, contando le monete nella mano di ciascuno.
          effetti: { monete: 3 }
        fallimento:
          titolo: Il contraccolpo
          testo: |
            A metà traversata la chiatta sbanda sotto una raffica e la manovella
            torna indietro di mezzo giro, prendendoti nel fianco. Finisci il turno
            piegato in due, e Bracco ti paga meno degli altri perché, dice, hai
            spinto meno degli altri.
          effetti: { monete: 1, ferite: 0.5 }
      - testo: "Scrivere la bolla"
        descrizione: "Contare i colli, pesarli a occhio, scrivere tutto in modo che la Gilda ci creda."
        prova: { attributo: mentale, abilita: politica-ed-economia, difficolta: Media }
        successo:
          titolo: Una cassa troppo leggera
          testo: |
            Alla quarta cassa ti fermi, perché è segnata come pietra e due uomini
            la sollevano senza sudare, e la scrivi con un piccolo punto di domanda
            a margine. Bracco ci passa sopra il pollice come per cancellarlo, poi
            ti paga il doppio e ti chiede di dimenticarlo.
          effetti: { monete: 3, informazioni.voce: 1 }
        fallimento:
          titolo: Le colonne storte
          testo: |
            Sbagli due conti di fila, e alla fine hai l'inchiostro fino al polso e
            una macchia a forma di pollice in mezzo alla bolla. Al gabbiotto
            dall'altra parte un Custode la rimanda indietro due volte, e Bracco ti
            paga la metà dicendo che la prossima volta prende uno che sappia
            scrivere.
          effetti: { monete: 1, scandalo: 0.5 }
      - testo: "Salire sulla Mula con Ilde"
        descrizione: "Dall'altra parte dell'approdo Ilde Sarrocchi agita il fazzoletto rosso. Il tuo posto ce l'ha tenuto."
        quando: [chiatta.posto == 1]
        esito:
          titolo: Il posto a bordo
          testo: |
            Ilde ti fa salire senza chiederti niente e ti mette in mano la cima di
            prua. «Socio, oggi si porta il sale di Laresh a chi lo paga meglio.»
            Prima di mezzogiorno fate due traversate, e nelle pause lei mastica la
            liquirizia e ti racconta le voci dell'approdo. A fine giornata divide
            la paga a metà.
          effetti: { monete: 4, informazioni.pettegolezzo: 1 }

  # ================================================================ la catena di Ilde Sarrocchi
  - id: carta-ilde-la-mula
    immagine: icone/crane
    titolo: La Mula
    sommario: "Una chiatta è ferma a metà del cavo, e la donna a bordo dice all'argano cose che non dovrebbe sentire."
    luogo: Ponti Sospesi, l'approdo delle chiatte
    tipo: carta
    area: ponti-sospesi
    requisiti: [chiatta.ilde == 0]
    testo: |
      All'approdo tutti guardano in alto, dove a metà del cavo più vecchio
      una chiatta carica di botti dondola sulla Cicatrice. A bordo una donna
      con un fazzoletto rosso e una radice di liquirizia fra i denti impreca
      contro la madre del ragazzo che doveva girare l'argano di legno.

      Il ragazzo è sparito e la manovella è bloccata a metà giro, mentre due
      chiattaioli di Ugo Bracco guardano senza toccarla.

      Sul fianco della chiatta è dipinta una mula, e sotto, in lettere
      storte, *la Mula*. «Socio!» grida la donna, indicando te. «Hai due
      braccia, o sono di legno anche quelle?»
    opzioni:
      - testo: "Girare l'argano"
        descrizione: "La manovella è dura. Bisogna metterci il peso, e sperare che si sblocchi prima della schiena."
        prova: { attributo: fisico, abilita: resistenza, difficolta: Media }
        successo:
          titolo: A fune tesa
          testo: |
            Ti appoggi alla manovella con tutto il peso, e alla terza spinta
            qualcosa dentro l'argano cede con uno schiocco. Quando la Mula arriva,
            la donna salta giù e ti stringe la mano con una mano dura come una
            cima. Si chiama Ilde Sarrocchi, e ti paga il giro d'argano con un
            pezzo di liquirizia in più.
          effetti: { monete: 2, chiatta.ilde: 1 }
        fallimento:
          titolo: Il contraccolpo
          testo: |
            La manovella si sblocca di colpo e torna indietro, prendendoti sul
            braccio. Ilde perde la pazienza e si tira fino all'approdo a forza di
            braccia, aggrappata al cavo. Quando scende ti guarda il braccio e dice
            che hai fatto quello che potevi. Si chiama Ilde Sarrocchi, e da quel
            giorno ti chiama socio.
          effetti: { ferite: 0.5, chiatta.ilde: 1 }
      - testo: "Guardare perché si è bloccato"
        descrizione: "Un argano di legno ha poche parti, tutte in vista. Se si è fermato a metà, c'è un motivo."
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Facile }
        successo:
          titolo: Il cuneo
          testo: |
            Fra due denti della ruota grande trovi un cuneo di quercia piantato a
            martellate. Lo tiri fuori con il coltello e l'argano riparte, pigro,
            finché la Mula non tocca le assi. Ilde Sarrocchi guarda il cuneo nella
            tua mano e se lo mette in tasca senza dire niente. «Grazie, socio»
            dice, e guarda verso i chiattaioli di Bracco.
          effetti: { chiatta.ilde: 1, chiatta.cuneo: 1 }
        fallimento:
          titolo: Il calcio
          testo: |
            Ne esci con il grasso fino ai gomiti, senza avere capito niente. Uno
            dei chiattaioli di Bracco ti sposta con una mano e dà un calcio alla
            ruota grande, e l'argano riparte. La donna ringrazia lui a denti
            stretti e te con un sorriso storto. Si chiama Ilde Sarrocchi, e ti
            dice che il grasso va via con la cenere.
          effetti: { chiatta.ilde: 1, scandalo: 0.5 }
      - testo: "Chiedere ai chiattaioli perché non la aiutano"
        descrizione: "Sono in due, hanno le braccia buone e stanno a guardare. Qualcosa sotto c'è."
        esito:
          titolo: Roba di nessuno
          testo: |
            «La Mula non è roba nostra» dice il più vecchio dei due, e ti spiega
            che è l'ultima fune con il privilegio del Patto delle Corde, e che il
            loro padrone, Ugo Bracco, aspetta da anni che si rompa. Siccome lo
            guardi, si mette all'argano con te. La donna si presenta come Ilde
            Sarrocchi, e a lui non dice grazie.
          effetti: { chiatta.ilde: 1, informazioni.voce: 1 }

  - id: carta-ilde-il-carico
    immagine: fazioni/gilda-dei-mercanti
    titolo: Il privilegio di fune
    sommario: "Un Custode ha messo i sigilli al carico della Mula, e Ilde Sarrocchi è venuta a cercarti."
    luogo: Ponti Sospesi, l'approdo delle chiatte
    tipo: carta
    area: ponti-sospesi
    requisiti: [chiatta.ilde == 1]
    testo: |
      Ilde Sarrocchi ti trova sul Ponte delle Mille Corde e ti prende per la
      manica. «Socio, ti devo una cosa e me ne serve un'altra.» Strada
      facendo ti spiega il privilegio di fune, il diritto che suo nonno ha
      avuto firmando il Patto delle Corde di portare la sua merce sulla sua
      fune senza pagare gabella.

      Sulla Mula le botti hanno un nastro della Gilda sul tappo, e un Custode
      giovane scrive su un registro. «Queste botti sono di un oste del Ponte
      del Pesce. Finché non pagano la gabella restano qui.» Ilde sputa la
      liquirizia nella Cicatrice.
    opzioni:
      - testo: "Discutere il privilegio con il Custode"
        descrizione: "Con le formule della Gilda e un tono che un Custode giovane rispetta. A Ilde quel tono non riesce."
        prova: { attributo: sociale, abilita: galateo, difficolta: Media }
        successo:
          titolo: Le formule
          testo: |
            Chiedi al Custode, con tutte le formule della Gilda, se il registro distingue
            la merce trasportata da quella posseduta. Lui mordicchia la penna a lungo
            prima di arrossire e staccare i nastri. Ilde ti mette in mano qualche moneta.
            «Adesso te ne devo due, socio. Io le cose che devo le pago sempre.»
          effetti: { monete: 2, chiatta.ilde: 1 }
        fallimento:
          titolo: Il tono
          testo: |
            Il Custode ti ascolta finché non sbagli una formula, e da quel momento
            ascolta soltanto quella, con l'aria offesa di un sacrestano. Alla fine
            Ilde paga la gabella contando le monete sul registro ad alta voce,
            perché tutto l'approdo senta quanto costa, e per il resto della
            giornata all'approdo ridono della discussione e di te.
          effetti: { scandalo: 1, chiatta.ilde: 1 }
      - testo: "Portare via le botti di notte"
        descrizione: "I nastri si staccano e si riattaccano. L'oste del Ponte del Pesce aspetta, e di notte il Custode dorme."
        prova: { attributo: fisico, abilita: furtivita, difficolta: Media }
        successo:
          titolo: Nastri nuovi
          testo: |
            Tornate a mezzanotte con un carretto dalle ruote fasciate. Tu stacchi i
            nastri con il vapore di una pentola mentre Ilde rotola le botti, e al
            loro posto lasciate barili d'acqua con i nastri rimessi. La mattina il
            Custode firma il dissequestro senza accorgersi di niente, e Ilde ti paga
            la notte facendoti giurare di non dirlo a nessuno.
          effetti: { monete: 3, sospetto: 1, chiatta.ilde: 1 }
        fallimento:
          titolo: La lanterna del Custode
          testo: |
            Alla terza botte una lanterna si accende sull'approdo, e scappate fra
            i carri lasciando il carretto dov'è, con Ilde che ride sottovoce
            correndo. La mattina il Custode chiede in giro chi ha visto due
            persone, una con un fazzoletto rosso. Ilde paga la gabella e una
            multa, e quando ti incrocia ti strizza l'occhio lo stesso.
          effetti: { sospetto: 1.5, chiatta.ilde: 1 }
      - testo: "Pagare la gabella di tasca tua"
        descrizione: "Prima che l'olio vada a male. Lei non te lo chiederebbe mai, e infatti non te lo chiede."
        requisiti: [monete >= 3]
        esito:
          titolo: Una cosa da segnare
          testo: |
            Paghi al Custode prima che Ilde riesca a fermarti. Lei ti guarda come
            si guarda un debito, poi con un mozzicone di matita scrive qualcosa
            all'interno della sponda, fra altre righe vecchie. La mattina dopo
            all'approdo tutti sanno che Ilde Sarrocchi ha un socio che paga in
            contanti.
          effetti: { monete: -3, rep.gilda: 0.5, chiatta.ilde: 1 }
      - testo: "Prendere le botti a nome della tua licenza"
        descrizione: "Con la licenza della Gilda la merce che porti è tua per legge, e la tua merce non paga."
        quando: [licenza-gilda >= 1]
        esito:
          titolo: Merce tua
          testo: |
            Mostri la licenza e dichiari le botti come merce tua. Il Custode la
            tiene controluce in cerca di un appiglio, poi stacca i nastri con un
            sospiro. Ilde ride così forte che i chiattaioli di Bracco si voltano,
            e mentre caricate ti dice che all'approdo c'è sempre qualcuno che sa
            quello che serve sapere.
          effetti: { informazioni.voce: 1, chiatta.ilde: 1 }

  - id: carta-ilde-la-fune-segata
    immagine: icone/rope-coil
    titolo: La fune segata
    sommario: "Sul cavo della Mula c'è un taglio di sega, e Ilde dice che le funi non si segano da sole."
    luogo: Ponti Sospesi, l'argano della Mula
    tipo: carta
    area: ponti-sospesi
    requisiti: [chiatta.ilde == 2]
    testo: |
      All'alba Ilde ti aspetta all'argano della Mula e ti fa chinare sul cavo
      a un palmo dalla ruota. Il taglio arriva quasi a metà dello spessore,
      fatto da qualcuno che sapeva dove mettere la lama, e con un'altra
      traversata carica la Mula sarebbe andata giù.

      {tecnologia Media} Un taglio a metà cede sotto carico fra qualche
      giorno, e sembra usura.

      «Questa fune l'hanno aiutata, socio» dice, guardando i cavi nuovi di
      Ugo Bracco. «Lui la vuole da quando è morto mio nonno, ma che sia stato
      lui non lo so. Tu hai l'aria di uno che le cose le scopre.»
    opzioni:
      - testo: "Fare la posta al cavo stanotte"
        descrizione: "Chi ha segato a metà torna a finire. Si aspetta al buio vicino all'argano, con l'arma in mano."
        prova: { attributo: fisico, abilita: armi-da-mischia, difficolta: Media }
        successo:
          titolo: La sega
          testo: |
            Passi la notte acquattato dietro l'argano. Verso la terza campana
            arriva un uomo con una sega avvolta in uno straccio, e lo prendi mentre
            si inginocchia sul cavo, girandogli il braccio finché parla. È un
            chiattaiolo di Bracco, a cui il padrone aveva promesso la Mula una
            volta caduta, e all'alba Ilde lo lascia andare con un calcio.
          effetti: { chiatta.ilde: 1, chiatta.colpevole: 1 }
        fallimento:
          titolo: La nebbia
          testo: |
            Verso la terza campana un'ombra arriva dalla nebbia con una sega in
            mano. Le salti addosso troppo presto, e l'ombra ti apre un taglio
            sull'avambraccio e sparisce fra i carri. All'alba Ilde ti fascia il
            braccio con il suo fazzoletto rosso e cambia il cavo in silenzio.
          effetti: { ferite: 1, chiatta.ilde: 1 }
      - testo: "Seguire i soldi"
        descrizione: "Se la Mula cade, il privilegio di fune torna alla Gilda, e qualcuno avrà già chiesto quanto costa."
        prova: { attributo: mentale, abilita: [accademiche, politica-ed-economia], difficolta: Media }
        successo:
          titolo: Una domanda alla Casa dei Nodi
          testo: |
            In cambio di un boccale un Custode ti lascia sfogliare il registro
            delle istanze. Tre settimane fa Ugo Bracco ha chiesto alla Casa dei
            Nodi che cosa succede a un privilegio di fune quando la fune cade, e
            quanto costerebbe comprarlo. Copi la sua firma piena di svolazzi, e a
            Ilde tremano le mani quando la legge.
          effetti: { informazioni.pettegolezzo: 1, chiatta.ilde: 1, chiatta.colpevole: 1 }
        fallimento:
          titolo: I registri chiusi
          testo: |
            Chiedi al gabbiotto, alla Casa dei Nodi e a un paio di rigattieri, e
            tutti ti rispondono con molta gentilezza e niente dentro. Alla fine
            Ilde ti dice di lasciar perdere, che il cavo nuovo l'ha già comprato e
            che a Bracco ci penserà lei, e intanto guarda la sega appesa a un
            chiodo.
          effetti: { chiatta.ilde: 1, sospetto: 0.5 }
      - testo: "Riguardare il cuneo dell'argano"
        descrizione: "Ilde l'ha tenuto in tasca da quella mattina, un cuneo di quercia tagliato da chi sa lavorare il legno."
        quando: [chiatta.cuneo == 1]
        esito:
          titolo: Il segno sotto il cuneo
          testo: |
            Sulla faccia di sotto del cuneo, quella che stava contro il dente
            della ruota, c'è un marchio a fuoco premuto di fretta, una B dentro un
            cerchio. È quello che i carpentieri di Bracco mettono su ogni pezzo
            che esce dal loro banco. Ilde lo rimette in tasca con più cura di
            prima.
          effetti: { chiatta.ilde: 1, chiatta.colpevole: 1 }
      - testo: "Aiutarla a cambiare il cavo"
        descrizione: "Chi è stato, lo scoprirà lei. Intanto la fune nuova va tesa, e ci vogliono quattro braccia."
        prova: { attributo: fisico, abilita: atletica, difficolta: Facile }
        successo:
          titolo: La fune nuova
          testo: |
            Passate la giornata a tendere il cavo nuovo, tu appeso alla sponda
            della Mula e lei all'argano, a forza di urla e di strattoni, finché le
            mani non ti chiudono più del tutto. A sera la fune canta quando la
            pizzichi, e Ilde ti paga la giornata dicendo che questa, almeno, per
            segarla ci vorrà una notte intera.
          effetti: { monete: 2, chiatta.ilde: 1 }
        fallimento:
          titolo: Lo schiocco
          testo: |
            A metà della tesatura salta un morsetto, e il cavo torna indietro con
            uno schiocco che ti lascia un segno rosso sulla spalla. Il resto lo
            fate più piano. A sera Ilde ti guarda la spalla e dice che sei stato
            fortunato, e a giudicare dalle sue mani lo sa per esperienza.
          effetti: { ferite: 0.5, chiatta.ilde: 1 }

  - id: carta-ilde-l-ultima-traversata
    immagine: ambientazione/cicatrice-del-mondo
    titolo: L'ultima traversata
    sommario: "Sulla Mula senza carico, a metà cavo, Ilde ti dice che la Gilda vuole comprarle la fune."
    luogo: La Mula, sopra la Cicatrice
    tipo: carta
    area: ponti-sospesi
    requisiti: [chiatta.ilde == 3]
    testo: |
      Al tramonto Ilde Sarrocchi ti porta sulla Mula senza carico. A metà
      traversata l'argano si ferma al suo fischio, e restate sospesi sopra
      la Cicatrice.

      Ti passa una lettera di Varn Kett in cui la Casa dei Nodi le offre una
      somma per il privilegio di fune, una volta sola, da firmare entro la
      luna nuova. «È una bella somma» dice, grattandosi sotto il fazzoletto.
      «Le gambe mi reggono sempre meno, e i cavi costano. Mio nonno, però,
      su questa fune ci ha lasciato una mano. Tu cosa faresti, socio?»
    opzioni:
      - testo: "Convincerla a tenere la Mula"
        descrizione: "La somma si spende in un anno. La fune, se la tiene, la porta fino alla fine."
        prova: { attributo: sociale, abilita: [persuasione, empatia], difficolta: Media }
        successo:
          titolo: La lettera nel vuoto
          testo: |
            Le parli di suo nonno e di che cosa diventerebbe l'approdo con tutti i
            cavi in mano a Bracco. Lei straccia la lettera in quattro e la lascia
            andare sopra il vuoto. «Allora il posto a bordo è tuo, socio. Quando
            vuoi, la prima traversata la fai con me.»
          effetti: { monete: 3, chiatta.ilde: 1, chiatta.fine: 1, chiatta.posto: 1 }
        fallimento:
          titolo: La firma
          testo: |
            Lei ti lascia finire con gentilezza, poi ti spiega che le ginocchia la
            mattina non si piegano più e che il cavo nuovo le è costato i risparmi
            di tre anni. Firma la lettera sulla sponda con il mozzicone di matita,
            e una settimana dopo un ragazzo ti porta un sacchetto con la tua parte
            di socio.
          effetti: { monete: 4, chiatta.ilde: 1, chiatta.fine: 2, tormento: 0.5 }
      - testo: "Scrivere a Varn Kett il nome di Ugo Bracco"
        descrizione: "Quello che hai scoperto sulla fune segata, scritto per bene. Varn Kett non ha mai sbagliato una riga."
        quando: [chiatta.colpevole == 1]
        esito:
          titolo: La riga di Varn Kett
          testo: |
            Scrivete la risposta insieme sulla sponda della Mula, con il nome di
            Ugo Bracco in fondo. Dopo tre giorni Varn Kett risponde che la Casa dei
            Nodi ritira l'offerta e che Bracco pagherà una multa per ogni metro di
            cavo segato. Il privilegio di fune resta a Ilde Sarrocchi, e sulla
            Mula, da adesso, un posto è tuo.
          effetti: { rep.gilda: 1, informazioni.pettegolezzo: 1, chiatta.ilde: 1, chiatta.fine: 1, chiatta.posto: 1 }
      - testo: "Aiutarla a vendere al prezzo giusto"
        descrizione: "Se deve vendere, che venda bene. Una somma scritta in una lettera si può sempre ritoccare."
        prova: { attributo: mentale, abilita: politica-ed-economia, difficolta: Media }
        successo:
          titolo: Il prezzo vero
          testo: |
            Le fai notare che la Gilda offre per il privilegio quello che pagava
            vent'anni fa. Scrivete la risposta insieme, con i conti in colonna, e
            la Casa dei Nodi alza l'offerta. Ilde firma e ti dà la tua parte in
            una borsa di cuoio con le sue iniziali, per una volta senza liquirizia
            in bocca.
          effetti: { monete: 10, rep.gilda: 0.5, chiatta.ilde: 1, chiatta.fine: 2 }
        fallimento:
          titolo: L'offerta ferma
          testo: |
            La Casa dei Nodi rimanda indietro la vostra risposta con una riga
            sola, che l'offerta è quella. Ilde firma lo stesso, perché la luna
            nuova arriva, premendo sulla carta fino a rompere quasi la punta, e ti
            dà la tua parte. L'ultima volta che la vedi sull'approdo sta
            insegnando al ragazzo dell'argano a bestemmiare per bene.
          effetti: { monete: 5, chiatta.ilde: 1, chiatta.fine: 2, tormento: 0.5 }

  # ================================================================ le carte che arrivano dopo
  - id: carta-ponti-il-turno-di-notte
    immagine: ambientazione/ponte-dei-morti
    titolo: Il nuovo turno di notte
    sommario: "Al Ponte dei Morti c'è un custode nuovo, e una donna incappucciata vuole sapere quando dorme."
    luogo: Ponte dei Morti, dopo la seconda campana
    tipo: carta
    area: ponti-sospesi
    requisiti: [pista.registro >= 5]
    testo: |
      Il Ponte dei Morti è pieno di nebbia. Nel gabbiotto in fondo, al posto
      di Maedric Holl, la Gilda ha messo Teo Marsan, un ragazzo con la barba
      rada che conta le casse di ogni carro tre volte, muovendo le labbra.

      Una donna con il cappuccio di tela cerata ti si mette accanto al
      parapetto. «Tu sei quello del registro» dice piano. «Da quando Holl
      non c'è più passa soltanto quello che è in regola, e la gente di sotto
      ha fame. A noi basta sapere quando il ragazzo dorme.» Ti fa scivolare
      sul parapetto una borsa che tintinna.
    opzioni:
      - testo: "Prendere la borsa e dirle i turni"
        descrizione: "I turni di Teo Marsan stanno scritti sulla tavoletta del gabbiotto. Basta leggerli per lei."
        esito:
          titolo: La tavoletta
          testo: |
            Prendi la borsa e le ripeti all'orecchio i turni scritti sulla
            tavoletta fuori dal gabbiotto. Due notti dopo, a quanto si dice, sul
            Ponte dei Morti passano carri con le ruote fasciate senza che Teo
            Marsan se ne accorga, e alla Caserma qualcuno si chiede chi glielo
            abbia detto.
          effetti: { monete: 6, sospetto: 1.5 }
      - testo: "Avvertire Teo Marsan"
        descrizione: "Prima o poi qualcuno venderà i turni del ragazzo, ed è meglio che lo sappia da te."
        esito:
          titolo: Tre volte
          testo: |
            Lasci la borsa sul parapetto e vai al gabbiotto. Teo ti ascolta con la penna
            sollevata e cambia colore due volte, poi scrive tutto. La settimana dopo
            Varn Kett ti fa avere tre righe in cui dice che la Gilda ha cambiato i turni
            del Ponte dei Morti e che di questo si ricorderà.
          effetti: { rep.gilda: 1, informazioni.voce: 1 }
      - testo: "Prendere la borsa e tenderle una trappola"
        descrizione: "Darle dei turni sbagliati e aspettare i carri insieme a Teo. Bisogna che lei ci creda."
        prova: { attributo: sociale, abilita: [ingannare, persuasione], difficolta: Difficile }
        successo:
          titolo: Le ruote fasciate
          testo: |
            Le dai un'ora sbagliata abbassando gli occhi, come se ti vergognassi un
            po', e lei se la beve. Due notti dopo i carri con le ruote fasciate
            trovano Teo Marsan sveglio e sei guardie della Gilda. La borsa resta a
            te, e alla Caserma il tuo nome lo scrivono nella colonna giusta.
          effetti: { monete: 6, rep.gilda: 0.5, rep.caserma: 0.5, informazioni.pettegolezzo: 1 }
        fallimento:
          titolo: Il cappuccio
          testo: |
            Le dai l'ora sbagliata e lei ti guarda troppo a lungo. La notte dei
            carri il ponte resta vuoto, e la notte dopo ti fermano in due e ti
            spiegano con calma che le borse si restituiscono. Se la riprendono, e
            ti lasciano un labbro spaccato e un nome nel registro dei Custodi.
          effetti: { ferite: 1, sospetto: 1 }
      - testo: "Chiederle dove è andato Holl"
        descrizione: "Maedric Holl è scappato dalla città prima che lo prendessero. Lei ha l'aria di una che lo conosceva."
        quando: [maedric == 1]
        esito:
          titolo: Una lettera da lontano
          testo: |
            Lei ride sotto il cappuccio, e la risata finisce in un colpo di tosse.
            «Holl è un uomo prudente. È andato dove la Gilda non ha gabbiotti, e
            ci resterà finché qui ha dei debiti.» Le ha scritto una volta sola,
            per chiederle chi teneva il suo posto sul ponte. Poi si riprende la
            borsa e torna nella nebbia.
          effetti: { informazioni.pettegolezzo: 1 }

  - id: carta-ponti-il-prezzo-del-lyssan
    immagine: ambientazione/acciaieria-di-qir-azel
    titolo: Il prezzo del lyssan
    sommario: "Da quando la ciminiera dei Tarvelin non fuma il lyssan costa quanto l'oro, e qualcuno ha cominciato a dipingerlo."
    luogo: Mercato dei Nodi, i banchi dei metalli
    tipo: carta
    area: ponti-sospesi
    requisiti: [pista.acciaio >= 8]
    testo: |
      Ai banchi dei metalli si parla della ciminiera dei Tarvelin e del lyssan
      raffinato, che costa di più ogni mattina. Un mercante in redingote rivoltata
      sui polsini ti prende sotto braccio e si presenta come Gerardo Vennari, di
      una famiglia che aveva un nome.

      {origine rampollo-dei-quartieri-alti} Nei salotti un Vennari che tratta al
      Mercato dei Nodi farebbe parlare per una settimana.

      «Si dice che c'eri anche tu, quando l'Acciaieria si è fermata. Dimmi quando
      riaccende prima che lo sappiano gli altri, e ti pago come un socio.» Sul
      banco accanto un venditore lucida una barra, e lo straccio diventa grigio.
    opzioni:
      - testo: "Vendergli quello che sai"
        descrizione: "Quello che hai visto all'Acciaieria e quello che pensi. Lui lo trasforma in denaro prima di sera."
        esito:
          titolo: Una parola sola
          testo: |
            Gli racconti quello che hai visto, e lui ti mette in mano una borsa di
            velluto come si dà una mancia. Prima di sera ha comprato tutte le barre
            del lato che guarda la Città Bassa, e due giorni dopo le rivende al
            doppio. Al Grifone, quando sente il tuo nome insieme al suo, Liaren posa
            piano il boccale che stava asciugando.
          effetti: { monete: 8, rep.tarvelin: -1 }
      - testo: "Smascherare il lyssan dipinto"
        descrizione: "Una mano di vernice fa sembrare vivo il lyssan spento, che non vale niente."
        prova: { attributo: mentale, abilita: [tecnologia, accademiche], difficolta: Media }
        successo:
          titolo: La vernice
          testo: |
            Il lyssan vero ronza quando ci passi sopra un cristallo, e questa
            barra resta muta, mentre sotto l'unghia ti rimane una scaglia di
            vernice. Lo dici ad alta voce e il venditore scappa lasciando il
            banco. Il Custode che arriva ti lascia una parte della multa.
          effetti: { monete: 2, rep.gilda: 0.5, informazioni.voce: 1 }
        fallimento:
          titolo: La barra buona
          testo: |
            Gratti la barra con l'unghia e dici che è vernice, e il venditore ti
            porge un coltello perché tu possa grattare meglio. Sotto c'è lyssan
            vero, che ronza per tutti quelli che hanno un cristallo in tasca. La
            folla ride, il venditore pretende scuse pubbliche, e Gerardo Vennari si
            allontana fingendo di non conoscerti.
          effetti: { scandalo: 1.5 }
      - testo: "Mandarlo a chiederlo a Liaren"
        descrizione: "L'Acciaieria è dei Tarvelin, e la Tarvelin che resta tiene la locanda a due piattaforme da qui."
        esito:
          titolo: Il nome giusto
          testo: |
            Gli dici che la persona da cui andare è Liaren Tarvelin, e che la
            trova al Grifone. Gerardo impallidisce, perché la storia del mestolo
            la conoscono anche nei Quartieri Alti, e ti lascia il braccio e un
            biglietto da visita con l'angolo piegato. La sera, al Grifone,
            Brunella ti mette davanti un piatto che non hai ordinato.
          effetti: { rep.tarvelin: 0.5, informazioni.voce: 1 }

  - id: carta-ponti-le-passerelle-di-sotto
    immagine: ambientazione/mercato-dei-nodi
    titolo: Le passerelle di sotto
    sommario: "Senza gli Scuri, sotto il Mercato due bande si contendono le passerelle buone, e qualcuno ne ha tagliata una."
    luogo: Sottoponti, sotto il Mercato dei Nodi
    tipo: carta
    area: ponti-sospesi
    requisiti: [pista.pelle >= 6]
    testo: |
      Da quando Mirko Vesh è morto, le passerelle dei sottoponti fra le reti e
      gli argani se le contendono due bande, i ragazzi della corda, venuti
      dalla Città Bassa, e i Lunghi, da sempre sotto i ponti.

      {origine figlio-della-citta-bassa} I ragazzi della corda hanno l'età che
      avevi tu con gli Scuri.

      Stanotte qualcuno ne ha tagliata una, e una donna è rimasta appesa per
      mezz'ora. In fondo alla scala ti aspetta una vecchia con una pipa spenta
      fra i denti. «Tu di sopra conti qualcosa. Prima che ci scappi il morto,
      qualcuno deve dire a questi dov'è il confine.»
    opzioni:
      - testo: "Far sloggiare i Lunghi"
        descrizione: "Sono loro ad avere tagliato la passerella, lo sanno tutti. Bisogna convincerli che non conviene rifarlo."
        prova: { attributo: sociale, abilita: intimidire, difficolta: Difficile }
        successo:
          titolo: I coltelli vecchi
          testo: |
            Scendi fino alla piattaforma dei Lunghi e ti siedi in mezzo a loro senza
            chiedere il permesso. Parli piano della Caserma finché il più vecchio
            rinfodera il coltello, e il giorno dopo le passerelle di levante sono
            libere. La vecchia ti fa avere una borsa di frammenti e qualche moneta.
          effetti: { cristalli.frammento-esausto: 2, monete: 2 }
        fallimento:
          titolo: La passerella stretta
          testo: |
            I Lunghi ti lasciano parlare, poi ti accompagnano verso l'uscita su
            una passerella larga una spanna, e a metà uno inciampa apposta. Ti
            ritrovi appeso alla fune come la donna della spesa, con un taglio sul
            fianco che brucia più del freddo, e risali da solo mentre loro ridono.
          effetti: { ferite: 1.5 }
      - testo: "Tracciare un confine"
        descrizione: "Le reti a una banda e gli argani all'altra, con una passerella di mezzo dove nessuno tocca nessuno."
        prova: { attributo: sociale, abilita: [persuasione, conoscenze-della-strada], difficolta: Media }
        successo:
          titolo: La passerella di mezzo
          testo: |
            Riunisci i due capi sulla piattaforma della vecchia e disegni il
            confine con il carbone, le reti ai ragazzi della corda e gli argani ai
            Lunghi. Si sputano sulle mani e se le stringono, e da quel giorno, una
            volta al mese, sulla tua porta compare un sacchetto che nessuno ha
            portato.
          effetti: { monete: 4, sospetto: 1 }
        fallimento:
          titolo: Il carbone
          testo: |
            Cominci a disegnare il confine con il carbone, e i due capi discutono su
            dove passa la linea e finiscono a discutere di te. Quando volano i primi
            pugni, e uno trova il tuo occhio, la vecchia ti tira per la giubba fino
            alla scala a pioli.
          effetti: { ferite: 0.5, scandalo: 1 }
      - testo: "Fare i nomi alla Caserma"
        descrizione: "Alla Caserma credono che sotto i Ponti sia tornata la calma, e delle due bande non sanno niente."
        esito:
          titolo: La retata
          testo: |
            Racconti al sergente di guardia in Città Bassa quello che sai sulle
            passerelle, e lui lo scrive con la lingua fra i denti. Due notti dopo
            le guardie scendono nei sottoponti con le lanterne, e per una
            settimana le bande spariscono. La vecchia con la pipa, da allora,
            guarda dall'altra parte quando ti incrocia.
          effetti: { rep.caserma: 1, sospetto: -0.5 }
      - testo: "Scendere con il distintivo"
        descrizione: "Il nome nella lista dei vice-sceriffi di Galdrick, sotto i ponti, lo conoscono tutti."
        quando: [guarnigione.distintivo >= 1]
        esito:
          titolo: La lista dello sceriffo
          testo: |
            Scendi con il distintivo appuntato dove si vede. Le due bande ti
            vengono incontro ciascuna dal suo lato, e i capi, sentito il tuo nome,
            decidono che il confine si può discutere senza coltelli. Più tardi la
            vecchia, con la pipa finalmente accesa, ti dice chi si è messo a
            comprare le passerelle per conto di qualcuno di sopra.
          effetti: { rep.caserma: 0.5, informazioni.pettegolezzo: 1 }
