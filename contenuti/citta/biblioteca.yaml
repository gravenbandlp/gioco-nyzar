# La città viva, luogo 8: la Biblioteca di Qir-Azel (presso: biblioteca-di-qir-azel, area quartieri-alti).
# L'attività del tavolo lungo, le tre storie di rep.biblioteca (2 gli scaffali sigillati, 4 i cristalli che
# pensano, 6 la chiave degli scaffali, ognuna con il suo flag) e la carta del libro in prestito. Il servizio
# (le ricerche fra gli scaffali, da pista.sepolcro >= 4) sta già in contenuti/piste/sepolcro-1.yaml.
# Reputazione: le storie la portano a 3, 5 e 7. Le opzioni dell'attività la fanno salire fino a 4 (catalogo,
# topi, Mattias) e da 4 a 6 (i visitatori, sociale Media; la tavoletta, mentale Media; il tetto, fisico
# Difficile). Con la chiave (biblioteca.tessera) si aprono gli scaffali sigillati, che ogni tanto danno un
# Segreto.
storylet:
  # ------------------------------------------------------------ l'attività ripetibile
  - id: il-tavolo-lungo
    presso: biblioteca-di-qir-azel
    immagine: ambientazione/biblioteca-di-qir-azel
    titolo: Il tavolo lungo
    sommario: "Ulric Stanne paga poco chi lavora per la Biblioteca. Al tavolo lungo, però, c'è sempre qualcosa da fare."
    luogo: Biblioteca di Qir-Azel, la sala di lettura
    area: quartieri-alti
    ripetibile: true
    testo: |
      La mattina il tavolo lungo della Biblioteca diventa il banco di chi lavora
      per Ulric Stanne, fra casse di libri e schede da ricopiare.

      Ulric legge dietro il bancone con il monocolo, e alle sue spalle è
      appoggiato un liuto con una corda rotta. Paga poco e puntuale, con una
      lamentela sul prezzo della carta.

      {empatia Media} La corda rotta non l'ha tolta perché vorrebbe dire comprarne
      una nuova, e ammettere che il liuto lo suona ancora.

      {origine fuggiasco-di-ghoran} A Ghoran nessuno ti pagava, e qui anche la
      lamentela di Ulric ti sembra parte della paga.
    opzioni:
      - testo: "Ricopiare le schede del catalogo"
        descrizione: "Le schede vecchie sono macchiate e scritte da mani diverse, e Ulric le vuole nuove e tutte uguali."
        quando: [indizio.archivi-mutilati == 0]
        requisiti: [rep.biblioteca < 2]
        prova: { attributo: mentale, abilita: accademiche, difficolta: Facile }
        successo:
          titolo: Le schede nuove
          testo: |
            Passi la mattina a ricopiare schede, e su una vecchia trovi un volume
            di cronache segnato due volte con due numeri diversi, un errore di
            trent'anni fa che correggi. Ulric guarda la correzione attraverso il
            monocolo e fa un piccolo verso con la gola, il complimento più alto
            che gli conosci. A mezzogiorno ti mette in mano uno spicciolo, e ci
            pensa un poco prima di lasciarlo andare.
          effetti: { monete: 1, rep.biblioteca: 0.5 }
        fallimento:
          titolo: Le grafie
          testo: |
            Una delle mani che hanno scritto le schede vecchie fa le stesse curve per
            la elle e per la esse, e a metà mattina hai segnato un trattato di
            agrimensura fra i bestiari. Ulric se ne accorge prima di te e rifà la
            scheda lui, con un sospiro che gli muove la barba, e per quella mattina
            non ti dà niente.

      - testo: "Ricontare le schede del catalogo"
        descrizione: "Da quando sono spariti i libri della costa nord, Ulric vuole sapere se manca qualcos'altro dai quattordici cassetti."
        immagine: personaggi/ulric-stanne
        quando: [indizio.archivi-mutilati >= 1]
        requisiti: [rep.biblioteca < 2]
        prova: { attributo: mentale, abilita: accademiche, difficolta: Facile }
        successo:
          titolo: I conti tornano
          testo: |
            Conti le schede del settimo cassetto contro il registro degli acquisti,
            con un dito sul registro e uno sulle schede, e a sera i numeri tornano,
            a parte quello che sapevate già. Ulric scrive *completo* e la data sul
            frontalino e ti paga il solito, poi resta a guardare il cassetto della
            costa nord come si guarda una sedia vuota a tavola.
          effetti: { monete: 1, rep.biblioteca: 0.5 }
        fallimento:
          titolo: La scheda dietro l'altra
          testo: |
            A metà del settimo cassetto perdi il conto, e al terzo conteggio ti
            convinci che manca una scheda. Ulric diventa bianco come la sua barba
            finché la ritrovate infilata dietro un'altra, con l'angolo piegato. Ti
            ringrazia con la voce stanca, e il cassetto lo riconta lui.

      - testo: "Catalogare un lascito"
        descrizione: "Una vedova dei Quartieri Alti ha lasciato alla Biblioteca i libri del marito, e Ulric vuole sapere che cosa c'è."
        requisiti: [rep.biblioteca >= 2, rep.biblioteca < 4]
        prova: { attributo: mentale, abilita: [accademiche, percezione], difficolta: Media }
        successo:
          titolo: L'erbario
          testo: |
            Apri le casse e scrivi un foglio per ogni volume. Sono quasi tutti libri
            di conti e trattati di navigazione fluviale mai aperti, ma in fondo alla
            terza cassa c'è un erbario, e fra le piante seccate una lettera d'amore
            indirizzata a un'altra donna. Ulric la legge e se la mette nel taschino
            del panciotto. «Questa effettivamente a catalogo non ci va» dice, e ti
            paga qualche moneta.
          effetti: { monete: 2, rep.biblioteca: 0.5 }
        fallimento:
          titolo: Il fondo umido
          testo: |
            La terza cassa ha preso l'umido in cantina, e le pagine si sono
            incollate a blocchi che odorano di muffa. Una si strappa in due con un
            rumore che fa voltare tutta la sala. Ulric ti mostra come si stacca una
            pagina con il vapore della teiera e una spatola d'osso, e per la
            giornata non ti dà niente, facendoti notare che la spatola l'ha pagata
            lui.

      - testo: "Dare la caccia ai topi delle casse"
        descrizione: "Nel deposito sotto la sala qualcosa rosicchia le rilegature, e Ulric giura che è sempre lo stesso topo."
        requisiti: [rep.biblioteca < 4]
        prova: { attributo: fisico, abilita: [atletica, furtivita], difficolta: Media }
        successo:
          titolo: Il topo del salterio
          testo: |
            Scendi nel deposito con una lanterna e una scopa e aspetti fra le
            casse il rosicchio. Il topo, grosso come un gatto giovane, sta
            mangiando la costola di un salterio, e lo insegui fino al tombino,
            dove sparisce con un pezzo di cuoio in bocca. Ci metti sopra una
            pietra. Ulric ti allunga uno spicciolo e ti chiede che libro stesse
            mangiando, per il registro dei danni.
          effetti: { monete: 1, rep.biblioteca: 0.5 }
        fallimento:
          titolo: La pila di casse
          testo: |
            Al primo rumore ti butti fra le casse, e il manico della scopa ne fa cadere una pila che ti finisce sulle
            caviglie. Il topo ti passa sopra il piede senza fretta, con un pezzo di rilegatura in bocca, e sparisce nel
            tombino. Quando risali, Ulric guarda la polvere che hai addosso e ti chiede con molta educazione se il topo stia
            bene.
          effetti: { ferite: 0.5 }

      - testo: "Aiutare Mattias con un'iscrizione"
        descrizione: "Mattias Crenn ha una pietra precuriana incisa e gli serve qualcuno che regga la lente in silenzio."
        immagine: personaggi/mattias-crenn
        requisiti: [rep.biblioteca < 4]
        prova: { attributo: mentale, abilita: [tecnologia, magia], difficolta: Media }
        successo:
          titolo: La terza riga
          testo: |
            Reggi la lente mentre Mattias Crenn, uno studioso stempiato con gli
            occhiali spessi, ricalca i segni su un foglio sottile, e noti che la
            terza riga è incisa più a fondo delle altre, come ripassata. Mattias
            si pulisce le lenti sulla manica e parla a raffica di scalpellini
            precuriani pentiti. «Si fa, si fa» dice alla fine, e scrive il tuo
            nome a margine del foglio, molto piccolo.
          effetti: { rep.biblioteca: 0.5 }
        fallimento:
          titolo: La lente
          testo: |
            Reggi la lente mentre Mattias Crenn ricalca i segni, e dopo un'ora il
            braccio comincia a tremarti e la luce riflessa gli finisce dritta negli
            occhiali. Mattias ti prende la lente di mano senza dire niente e la
            appoggia su una pila delle sue monografie respinte, che la regge meglio
            di te. Per il resto del pomeriggio ti manda a prendere l'acqua.

      - testo: "Rifare le capolettere di un salterio"
        descrizione: "Un salterio è finito sotto una goccia del tetto, e metà delle capolettere miniate sono sbavate."
        prova: { attributo: sociale, abilita: espressivita, difficolta: Facile }
        successo:
          titolo: La vite sulla prima lettera
          testo: |
            Ti siedi alla finestra con un pennello fine e i vecchi colori di Ulric,
            il verde seccato in una crosta da bagnare con la saliva, e rifai le
            capolettere sul modello di quelle intatte, una vite che si arrampica
            sulla prima lettera di ogni salmo. Ulric controlla con il monocolo,
            conta le pagine due volte e ti paga tirando fuori le monete una alla
            volta.
          effetti: { monete: 3 }
        fallimento:
          titolo: Il serpente
          testo: |
            Rifai le capolettere sbavate sul modello di quelle intatte, ma alla terza
            pagina la vite ti viene storta e alla quarta somiglia a un serpente con
            il mal di pancia. Ulric la studia attraverso il monocolo, dice che il
            salterio era brutto anche prima e ti paga soltanto le pagine venute bene.
          effetti: { monete: 1 }

      - testo: "Restare dopo la chiusura"
        descrizione: "Chi ha la pazienza di restare quando la sala si svuota, qualche volta sente Ulric suonare."
        esito:
          titolo: La canzone del mulo
          testo: |
            Aiuti il custode a spegnere i lampadari, e quando resta accesa
            soltanto la lampada del bancone Ulric prende il liuto e suona, senza
            la corda rotta, una canzone caldrese su un mulo testardo. Fra una
            strofa e l'altra racconta della sua prima spedizione, un inverno in
            una grotta con un orso che dormiva in fondo, e quando parla di casa
            l'accento gli scivola indietro di cinquant'anni.
          pe: { natura: 2 }

      - testo: "Ricevere i visitatori che Ulric ignora"
        descrizione: "Ulric non alza gli occhi per chi di storia non sa niente, e adesso quei visitatori li manda da te."
        immagine: personaggi/ulric-stanne
        requisiti: [rep.biblioteca >= 4, rep.biblioteca < 6]
        prova: { attributo: sociale, abilita: [galateo, persuasione], difficolta: Media }
        successo:
          titolo: Il bisnonno conciatore
          testo: |
            Il primo è il figlio di un mercante che vuole discendere da un
            fondatore. Gli trovi il registro dove il bisnonno risulta conciatore,
            e lo convinci che anche i conciatori hanno fondato qualcosa. La
            seconda è una cuoca che cerca una vecchia ricetta, e la trovi in un
            trattato di medicina sotto la voce *febbri*. A sera Ulric ti paga e si
            fa raccontare del mercante, ridendo dentro la barba.
          effetti: { monete: 2, rep.biblioteca: 0.5 }
        fallimento:
          titolo: Il figlio del mercante
          testo: |
            Il primo è il figlio di un mercante che vuole discendere da un fondatore
            della città, e il registro giusto dice che il bisnonno era conciatore.
            Glielo dici troppo in fretta, e lui alza la voce finché metà della sala
            smette di leggere. Ulric lo accompagna alla porta, poi ti dice che la
            verità si porge dal manico come le pentole e ti manda a riordinare il
            carrello dei resi.

      - testo: "Leggere una tavoletta con Mattias"
        descrizione: "Mattias ha in prestito una tavoletta precuriana della Casa dei Nodi, e da solo non ce la fa."
        immagine: personaggi/mattias-crenn
        requisiti: [rep.biblioteca >= 4, rep.biblioteca < 6]
        prova: { attributo: mentale, abilita: [tecnologia, magia], difficolta: Media }
        successo:
          titolo: La bolla di consegna
          testo: |
            La tavoletta è di metallo grigio con i segni in rilievo, e Mattias la
            tiene sul tavolo come un piatto che scotta. A sera noti che i segni si
            ripetono ogni sette, come le righe di un registro. «Una bolla di
            consegna» dice. «Prima della Caduta, e già contavano le casse come la
            Gilda.» Poi ti versa mezzo bicchiere del vino di Ulric, che vale più
            di una paga.
          effetti: { rep.biblioteca: 0.5 }
        fallimento:
          titolo: Il metallo freddo
          testo: |
            Passi il pomeriggio a contare i segni della tavoletta, finché senti il
            metallo farsi freddo sotto le dita come l'acqua di un pozzo. Lo dici a
            Mattias, che ritira le mani di colpo, copre la tavoletta con un panno
            e ti dice che per oggi basta, senza spiegarti perché. A te resta un
            formicolio sui polpastrelli fino a notte.
          effetti: { tormento: 1 }

      - testo: "Rattoppare il tetto della galleria"
        descrizione: "Il tetto nuovo lascia passare l'acqua sugli scaffali alti, e Ulric preferisce te al conciatetti, che costa caro."
        requisiti: [rep.biblioteca >= 4, rep.biblioteca < 6]
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Difficile }
        successo:
          titolo: Sui coppi
          testo: |
            Esci dall'abbaino della galleria con un rotolo di tela incatramata e ti
            ritrovi sui coppi, con la Cicatrice laggiù che riflette il sole.
            Strisciando sulla pancia rimetti a posto il coppo spostato vicino al
            colmo e ci inchiodi sopra la tela. Ulric ti paga la giornata e ti fa
            sapere con grande soddisfazione che è la metà di quanto chiedeva il
            conciatetti.
          effetti: { monete: 4, rep.biblioteca: 0.5 }
        fallimento:
          titolo: La grondaia
          testo: |
            Al terzo passo fuori dall'abbaino un coppo ti scivola sotto il piede, e
            scivoli giù per la falda fino alla grondaia, che per fortuna regge.
            Resti lì aggrappato, con la Cicatrice sotto le scarpe, finché il garzone
            di Ulric ti cala una corda senza nessuna fretta. Ulric ti mette un panno
            sul gomito sbucciato e un secchio sotto la perdita.
          effetti: { ferite: 1 }

      - testo: "Aprire uno scaffale sigillato"
        descrizione: "Hai la chiave e il nome sul registro, e Ulric ti chiede soltanto di non leggere a voce alta."
        immagine: personaggi/ulric-stanne
        requisiti: [biblioteca.tessera >= 1]
        prova: { attributo: mentale, abilita: [accademiche, magia], difficolta: Media }
        successo:
          titolo: Dietro la cera nera
          testo: |
            Ulric rompe il sigillo e scrive l'ora sul registro. Fra le cronache
            delle Notti Cucite e i diari dei pescatori, segnati dal Velo con *non
            rispondano*, scegli un fascio di frammenti precuriani, e in fondo trovi
            la traduzione di un'iscrizione dove il nome del Torvessa, il fiume dei
            pescatori, torna tre volte in sei righe. La ricopi con la mano che
            suda, e Ulric rifà il sigillo senza chiederti niente.
          effetti: { informazioni.segreto: 1, tormento: 1 }
        fallimento:
          titolo: Il diario del pescatore
          testo: |
            Apri uno dei diari dei pescatori, che per sessanta pagine parla con calma
            di reti e di correnti e nelle ultime dieci ripete una parola sola, in una
            lingua che somiglia al precuriano, con una grafia sempre più grande.
            Chiudi il diario con la bocca che si muove da sola sulla prima sillaba.
            Al bancone, mentre ti riprendi, Ulric ti racconta di chi l'aveva portato
            in Biblioteca.
          effetti: { informazioni.pettegolezzo: 1, tormento: 1 }

  # ------------------------------------------------------------ il cilindro di lyssan, dopo che ha parlato
  # Il cilindro delle Segrete dell'Ira (piste/acciaio-pozzo.yaml): una volta decifrato, Mattias lo compra.
  - id: il-cilindro-per-mattias
    presso: biblioteca-di-qir-azel
    immagine: ambientazione/rovine-dei-precursori
    titolo: Il cilindro per Mattias
    sommario: "Il cilindro di lyssan ha detto tutto, e al primo piano c'è un vecchio che lo ascolterebbe ogni sera."
    luogo: Biblioteca di Qir-Azel, il primo piano
    area: quartieri-alti
    ripetibile: true
    requisiti: [oggetto.registratore-olografico >= 1, cilindro.decifrato >= 1]
    testo: |
      Il cilindro ormai lo sai far parlare, e nella bisaccia formicola come
      un animale che dorme.

      Al primo piano Mattias Crenn ha spostato le sue pietre incise per fare
      posto sul tavolo, come se aspettasse qualcuno. Quando ti vede salire
      si toglie le lenti e le pulisce sulla manica, e intanto guarda la
      bisaccia.

      {empatia Facile} Aspetta che glielo offra tu, perché chiedere gli
      costerebbe troppo. In trent'anni di pietre incise ha visto un
      Precursore muoversi una volta sola.
    opzioni:
      - testo: "Venderlo a Mattias"
        descrizione: "Mattias lo paga con le monete che mette da parte da anni per un libro che non ha mai trovato."
        esito:
          titolo: Si fa, si fa
          testo: |
            Prima di toccare il cilindro Mattias va a prendere un panno di lana
            pulito, e ce lo sposta sopra con due dita, come un pulcino. Poi conta
            due volte le monete del cassetto chiuso a chiave e te le spinge
            davanti in una pila ordinata. «Si fa, si fa» dice. In fondo alle scale
            senti il ronzio, e la sua voce che ripete piano una parola dopo il
            cilindro.
          effetti: { monete: 100, oggetto.registratore-olografico: -1 }
      - testo: "Tenerlo"
        costo: 0
        esito:
          testo: "Richiudi la bisaccia. Mattias rimette le lenti, sposta di nuovo le pietre al centro del tavolo e dice che tanto lui è sempre qui, il pomeriggio."

  # ------------------------------------------------------------ storia a 2 · gli scaffali sigillati
  - id: gli-scaffali-sigillati
    presso: biblioteca-di-qir-azel
    immagine: personaggi/ulric-stanne
    titolo: Gli scaffali sigillati
    sommario: "Su uno degli scaffali sigillati la cera nera si è sciolta per la terza volta in un mese."
    luogo: Biblioteca di Qir-Azel, il secondo piano
    area: quartieri-alti
    requisiti: [rep.biblioteca >= 2, biblioteca.scaffali == 0]
    testo: |
      Ulric Stanne ti porta al secondo piano, dove i lettori non salgono. Nel
      corridoio stretto gli scaffali hanno le ante chiuse con la cera nera della
      Confraternita, l'Albero impresso su ogni sigillo e un nastro rosso fra le
      maniglie. Davanti al quarto a sinistra Ulric alza la lanterna. La cera è
      colata giù per l'anta in tre righe lucide fino al pavimento, mentre il
      nastro è intatto. «Terza volta in un mese» dice, e si toglie il monocolo.
      «Lo rifacciamo, e la mattina dopo lo ritroviamo così. Effettivamente non so
      più che cosa pensare.»

      Accanto allo scaffale c'è Ottilia Sanvel, una monaca del Velo bassa e
      robusta che tiene le chiavi di questi corridoi insieme a Ulric. Guarda la
      cera senza toccarla. «Se qualcuno apre gli scaffali lo devo dire alla
      Madre» dice. «Prima voglio sapere se è così.»

      {origine accolito-del-velo} Ottilia ti saluta con il cenno corto che
      riserva ai novizi, e ti accorgi di avere abbassato la voce prima ancora di
      aprire bocca.

      Sul cartellino, nella grafia di un bibliotecario morto da tempo, c'è
      scritto *pietre dei pellegrini, sette*. *Sette pietre chiuse a chiave, come
      se potessero scappare.* Ti accorgi di avere infilato le mani in tasca, come
      davanti alla vetrina di un orafo.
    opzioni:
      - testo: "Esaminare la cera colata"
        descrizione: "Chi apre uno scaffale di nascosto lascia un segno sul legno, e con la lanterna lo si può cercare."
        prova: { attributo: mentale, abilita: [percezione, natura], difficolta: Media }
        successo:
          titolo: Dal di dentro
          testo: |
            Avvicini la lanterna e guardi le colature, così da vicino da sentire
            l'odore dolciastro della cera vecchia. La cera è uscita soltanto dalla
            fessura fra le ante e il legno intorno non ha un graffio, quindi il
            sigillo si è sciolto per un caldo venuto da dentro. Ottilia guarda le
            colature e poi te, e tira fuori dalla manica un mazzo di chiavi legato
            con lo spago.
          pe: { percezione: 5 }
          segue: le-pietre-dei-pellegrini
        fallimento:
          titolo: La quarta colatura
          testo: |
            Avvicini troppo la lanterna, e la cera si ammorbidisce sotto i tuoi
            occhi fino a fare una quarta colatura, tutta tua. Ottilia stringe le
            labbra finché spariscono. Ulric va a prendere il sigillo d'ottone e ti
            chiede gentilmente di tenere la lanterna più lontano, con il tono che
            si usa con i bambini vicino al camino.
          effetti: { scandalo: 0.5 }

      - testo: "Confrontare le date con i registri dei cronisti"
        descrizione: "I cronisti della Biblioteca annotano ogni notte il cielo e la Cicatrice, anche nelle tre notti delle colature."
        prova: { attributo: mentale, abilita: accademiche, difficolta: Media }
        successo:
          titolo: Luna chiara
          testo: |
            Scendi a prendere i registri dei cronisti e cerchi le tre date che ti
            dà Ulric. In tutte e tre le notti il cronista di turno ha scritto
            *luna chiara, nessun bagliore*, e lo leggi ad alta voce. Ulric resta
            con il monocolo a mezz'aria, poi si batte la fronte con il palmo e
            dice a Ottilia che adesso sa quali sono le due pietre.
          pe: { accademiche: 5 }
          segue: le-pietre-dei-pellegrini
        fallimento:
          titolo: Le sigle
          testo: |
            Il cronista di quelle notti scrive in un'abbreviazione tutta sua, e
            quello che annota sul cielo e sulla Cicatrice è un muro di sigle che
            passi il pomeriggio a decifrare senza venirne a capo. Ulric ti dice che è
            il cronista più vecchio della Biblioteca, e che in trent'anni nessuno è
            riuscito a fargli scrivere una parola per intero.
          effetti: { tormento: 0.5 }

      - testo: "Chiedere a Ottilia di aprire lo scaffale"
        descrizione: "Le chiavi le ha lei, e Ottilia apre soltanto a chi le dà un motivo."
        immagine: personaggi/ottilia-sanvel
        prova: { attributo: sociale, abilita: [persuasione, galateo], difficolta: Media }
        successo:
          titolo: La richiesta motivata
          testo: |
            Le dici che basta un'occhiata dentro lo scaffale per sapere se manca
            qualcosa, mentre fare la guardia di notte costa una settimana di sonno a
            due persone che ne hanno poco. Ottilia ci pensa con le mani dietro la
            schiena. «È motivata» dice, e scioglie il nastro rosso con due dita. Le
            ante si aprono con un odore di polvere e di pietra calda.
          pe: { persuasione: 5 }
          segue: le-pietre-dei-pellegrini
        fallimento:
          titolo: Un motivo e una firma
          testo: |
            Le dici che basterebbe un'occhiata dentro lo scaffale, e Ottilia ti
            domanda a che titolo lo chiedi. La risposta non le basta, e lo capisci da
            come si sistema le maniche prima di parlare. Ti spiega che gli scaffali
            si aprono per chi ha un motivo scritto e una firma, e che tu oggi non hai
            né l'uno né l'altra.
          effetti: { scandalo: 0.5 }

      - testo: "Vegliare con Ulric la prossima notte serena"
        descrizione: "Se qualcuno sale di notte lo vedrete, ma ci vuole una notte intera seduti sul pavimento del corridoio."
        costo: 2
        esito:
          titolo: La goccia nera
          testo: |
            Aspettate la prima notte serena seduti sul pavimento del corridoio, con la
            lanterna schermata e una coperta in due, e Ulric si addormenta a metà di un
            racconto. Verso l'alba senti odore di cera calda. Il sigillo del quarto scaffale
            suda, e una goccia nera scende lenta lungo l'anta senza che nessuno ci sia passato
            davanti. Svegli Ulric, che manda il garzone di corsa a chiamare Ottilia.
          pe: { resilienza: 5 }
          segue: le-pietre-dei-pellegrini

      - testo: "Chiedergli se c'entrano i libri spariti"
        descrizione: "I libri della costa nord sono spariti senza lasciare traccia, e adesso si scioglie un sigillo."
        quando: [indizio.archivi-mutilati >= 1]
        costo: 0
        esito:
          titolo: Due ladri in un mese
          testo: |
            «I libri della costa nord stavano in galleria, aperta a chiunque abbia
            un posto al tavolo» dice Ulric. «Questi scaffali si aprono solo con la
            chiave di Ottilia o con la mia. I ladri dei libri non hanno lasciato
            segni. Due ladri diversi nello stesso autunno mi sembrano troppi.»

            {ingannare Media} Ti ha detto anche la parte che lo mette fra i
            sospetti, e chi mente di solito la salta.

  - id: le-pietre-dei-pellegrini
    immagine: ambientazione/superficie-fratturata
    titolo: Le pietre dei pellegrini
    tipo: seguito
    luogo: Biblioteca di Qir-Azel, il quarto scaffale
    area: quartieri-alti
    requisiti: [biblioteca.scaffali == 0]
    testo: |
      Ottilia apre le ante con una chiave lunga. Dentro c'è un vassoio
      foderato di feltro verde con sette pietre grigie grandi come un uovo,
      ognuna con un cartellino legato con lo spago. Sotto due di loro il
      feltro è bruciacchiato.

      «Sono dei pellegrini che dicono di essere caduti verso l'alto mentre
      sognavano, e di essere tornati con queste in tasca» dice Ulric. «Due si
      scaldano nelle notti di luna chiara, e lo sapevamo, ma che si
      scaldassero fino a sciogliere la cera non lo sapeva nessuno.»

      {percezione Media} Sui cartellini di quelle due lo spago è nuovo, segno
      che qualcuno li ha dovuti rifare.

      Ottilia tocca una delle due con il dorso delle dita e la trova fredda.
      «Non le ha prese nessuno. Resta da decidere dove metterle.» Nessuno dei
      due vuole toccarle un'altra volta, e la decisione tocca a te.
    opzioni:
      - testo: "Metterle in una nicchia di pietra"
        descrizione: "Nel muro del corridoio c'è una nicchia vuota dei Precursori, dove la pietra non brucia e la cera non serve."
        esito:
          titolo: La nicchia
          testo: |
            Nel muro del corridoio, fra due scaffali, c'è una nicchia scavata dai
            Precursori, liscia come l'interno di una conchiglia. Ci porti le due
            pietre una alla volta nel palmo aperto, e Ottilia ci mette davanti una
            grata di ferro con un lucchetto. Ulric riscrive il cartellino, *cinque*,
            e ne fa un altro per la nicchia. Poi ti conta in mano la paga, e
            all'ultima moneta esita come al solito.
          pe: { accademiche: 5 }
          imposta: { biblioteca.scaffali: 1 }
          effetti: { rep.biblioteca: 1, monete: 3 }
      - testo: "Battere l'unghia su una delle due pietre"
        descrizione: "Nelle cronache della Superficie certe pietre rispondono ai colpi, e Ulric fa una smorfia senza fermarti."
        esito:
          titolo: Un secondo dopo
          testo: |
            Batti piano l'unghia su una delle due pietre. Il colpo non fa rumore, e un
            secondo dopo dalla pietra arriva un ticchettio identico, come se qualcuno lo
            restituisse dall'altra parte. Ulric ti toglie la pietra di mano e porta il
            vassoio di persona fino alla nicchia vuota del corridoio, dove Ottilia ci
            chiude davanti una grata di ferro.
          pe: { resilienza: 5 }
          imposta: { biblioteca.scaffali: 1 }
          effetti: { rep.biblioteca: 1, tormento: 1, informazioni.pettegolezzo: 1 }
      - testo: "Lasciarle dov'erano e cambiare il sigillo"
        descrizione: "Le pietre non hanno fatto niente di male, a parte la cera, e basta un sigillo che non si sciolga."
        esito:
          titolo: Il sigillo di piombo
          testo: |
            Proponi di lasciare le pietre dove sono e chiudere lo scaffale con un
            sigillo di piombo, che non si scioglie e costa meno della cera nera.
            Ulric sente la parola *meno* e annuisce prima che tu abbia finito.
            Ottilia ci pensa di più, poi va a prendere la pinza da sigilli della
            Confraternita e ti lascia stringere il primo, che prende l'impronta
            dell'Albero un poco storta.
          pe: { tecnologia: 5 }
          imposta: { biblioteca.scaffali: 1 }
          effetti: { rep.biblioteca: 1, monete: 2 }

  # ------------------------------------------------------------ storia a 4 · i cristalli che pensano
  - id: i-cristalli-che-pensano
    presso: biblioteca-di-qir-azel
    immagine: ambientazione/cristalli-conduttori
    titolo: I cristalli che pensano
    sommario: "Stasera Ulric Stanne suona dopo la chiusura, e Mattias Crenn vuole che tu ti sieda vicino alle vetrine."
    luogo: Biblioteca di Qir-Azel, l'ingresso, di sera
    area: quartieri-alti
    requisiti: [rep.biblioteca >= 4, biblioteca.cristalli == 0]
    testo: |
      Dopo la chiusura resta accesa soltanto la lampada del bancone. Ulric
      accorda il liuto con la corda rotta, e Mattias Crenn è sceso dal primo
      piano con una bottiglia di vino di Laresh. Nelle vetrine dell'ingresso
      stanno gli undici cristalli antichi che si sono spenti con l'Eclisse di
      Sangue.

      {origine allievo-di-torvessa} Dal grigio uniforme di questi undici capisci
      che nessuna delle formule che conosci li sveglierebbe.

      «In città dicono che li si sente pensare» dice Mattias. «Io ci passo
      davanti da trent'anni e non ho sentito niente, però chi lo racconta si era
      sempre fermato qui mentre Ulric suonava.»

      Ti siedi accanto alla vetrina, e Ulric suona una nota bassa e la tiene.
      *Questo vino costa più della mia giubba.* Un secondo dopo la stessa frase
      ti torna indietro dal vetro, con le tue parole e una voce che non
      riconosci.
    opzioni:
      - testo: "Pensare di proposito una cosa sola"
        descrizione: "Se il vetro ti restituisce i pensieri, puoi scegliere tu che cosa dargli, con la testa ferma."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Media }
        successo:
          titolo: Il numero
          testo: |
            Chiudi gli occhi e pensi un numero, centoquarantatré, scandendolo come una
            parola d'ordine, e un secondo dopo ti torna dalla vetrina uguale. Il nome
            della tua strada torna con la tua stessa esitazione sulla seconda sillaba.
            Poi ti chiedi chi sei, e dal vetro torna soltanto la domanda, con la tua
            voce e nient'altro. Lo racconti a Mattias, che scrive tutto su un quaderno
            con la mano che gli trema.
          pe: { resilienza: 5 }
          imposta: { biblioteca.cristalli: 1 }
          effetti: { rep.biblioteca: 1, tormento: 1, informazioni.segreto: 1 }
        fallimento:
          titolo: Tutto insieme
          testo: |
            Provi a pensare una cosa sola e ti vengono in mente tutte le altre. Dal
            vetro ti tornano il nome di una persona che non vedi da anni e una frase
            cattiva che avevi detto a qualcuno e speravi di aver dimenticato, con il
            tono di allora. Ti alzi così in fretta che lo sgabello cade e il vino ti
            macchia la manica, e Ulric smette di suonare.
          effetti: { tormento: 1.5 }

      - testo: "Lasciare che Mattias misuri"
        descrizione: "Mattias ha un cristallo conduttore e un filo di rame, e gli serve una mano sul vetro."
        immagine: personaggi/mattias-crenn
        prova: { attributo: mentale, abilita: [magia, tecnologia], difficolta: Media }
        successo:
          titolo: La venatura
          testo: |
            Mattias appoggia il filo di rame sul vetro e ci tieni sopra il palmo, facendo passare il Mana come quando
            accendi una lanterna. Ulric riprende la nota bassa, e nel cristallo più grande si illumina d'azzurro una
            venatura sottile per il tempo di contare fino a tre. Mattias scrive senza alzare la testa. «La sesta
            monografia, e me la respingeranno come le altre cinque, ma si fa, si fa» dice.
          pe: { magia: 5 }
          imposta: { biblioteca.cristalli: 1 }
          effetti: { rep.biblioteca: 1, tormento: 1 }
        fallimento:
          titolo: Il filo di rame
          testo: |
            Spingi il Mana troppo in fretta, e il filo di rame si scalda fino a
            lasciarti sul palmo una scottatura a righe. Nella testa ti si accende un
            ronzio che dura fino a mezzanotte, pieno di frasi tue lasciate a metà.
            Mattias ti fa tenere la mano in una bacinella d'acqua e richiude il
            quaderno senza scriverci niente.
          effetti: { tormento: 1, ferite: 0.5 }

      - testo: "Chiedere a Ulric di smettere di suonare"
        descrizione: "Forse basta la musica a svegliarli, e Ulric forse sa anche altro."
        immagine: personaggi/ulric-stanne
        esito:
          titolo: Eren Solmir
          testo: |
            Ulric posa il liuto e il vetro tace. L'ultima volta che ha visto
            accendersi un cristallo di quelle vetrine, racconta, c'era Eren Solmir,
            il più giovane dei tre che risalirono dal Labirinto con le Maschere.
            Negli anni dopo il Rito Eren veniva ancora a leggere al tavolo lungo, e
            quando passava davanti alle vetrine i cristalli pulsavano. «Rideva di
            tutto, anche dopo» dice Ulric, e Mattias riempie i bicchieri.
          pe: { accademiche: 5 }
          imposta: { biblioteca.cristalli: 1 }
          effetti: { rep.biblioteca: 1, tormento: 1 }

      - testo: "Non dire niente a nessuno"
        descrizione: "Mattias aspetta di sapere se hai sentito qualcosa, e la risposta puoi tenertela."
        esito:
          titolo: L'eco che non arriva
          testo: |
            Bevi il vino accanto alla vetrina finché Ulric non finisce di suonare,
            e impari presto a pensare piano. Quando Mattias ti chiede se hai
            sentito qualcosa gli dici di no, e lui dice soddisfatto a Ulric che
            aveva ragione lui. Ulric salta mezza battuta e riprende senza
            guardarti. Tornando a casa ti sorprendi ad aspettare l'eco di ogni
            pensiero, e l'eco non arriva più.
          pe: { resilienza: 5 }
          imposta: { biblioteca.cristalli: 1 }
          effetti: { rep.biblioteca: 1, tormento: 1.5 }

      - testo: "Riconoscere la nota del Festival"
        descrizione: "La nota bassa di Ulric ti arriva nei denti come quella dei cristalli del banco, la sera della razzia."
        quando: [origine.allievo-di-torvessa >= 1]
        prova: { attributo: mentale, abilita: [magia, accademiche], difficolta: Media }
        successo:
          titolo: La stessa nota
          testo: |
            Chiedi a Ulric di tenere la nota e conti i battiti come la sera del
            Festival. Al settimo nel cristallo più grande si accende una venatura
            azzurra, e dal vetro ti torna un pensiero che hai avuto quella sera
            dietro il banco, compresa una bestemmia che non ricordavi. Ulric ti
            chiede chi ti ha insegnato a contare così, e quando gli dici di Orvald
            fa una smorfia di rispetto.
          pe: { magia: 5 }
          imposta: { biblioteca.cristalli: 1 }
          effetti: { rep.biblioteca: 1, tormento: 1 }
        fallimento:
          titolo: La piazza
          testo: |
            Conti i battiti come la sera del Festival, e la nota ti trova prima che tu
            trovi lei. Ti si riempie la testa delle urla della piazza e del canto
            rauco degli orchi, e il bicchiere ti scivola di mano. Mattias lo prende
            prima che si rompa, Ulric smette di suonare e ti versa altro vino, e per
            il resto della sera nessuno parla dei cristalli.
          effetti: { tormento: 1 }

  # ------------------------------------------------------------ storia a 6 · la chiave degli scaffali
  - id: la-chiave-degli-scaffali
    presso: biblioteca-di-qir-azel
    immagine: personaggi/ulric-stanne
    titolo: La chiave degli scaffali
    sommario: "Ulric Stanne ha una chiave per te, e Ottilia Sanvel vuole sapere perché dovrebbe essere tua."
    luogo: Biblioteca di Qir-Azel, il bancone
    area: quartieri-alti
    requisiti: [rep.biblioteca >= 6, biblioteca.tessera == 0]
    testo: |
      Ulric ti aspetta al bancone con il panciotto abbottonato dritto, che per
      lui vuol dire un'occasione. Davanti ha un registro nuovo, e sopra una
      chiave di ferro lunga quanto una mano, legata a un nastro rosso come
      quelli dei sigilli. «È una copia della chiave del secondo piano» dice. «In
      quarant'anni non l'ho mai data a nessuno, e questa la do a te, se Ottilia
      firma.»

      Ottilia Sanvel è in piedi accanto al bancone, con le mani dietro la
      schiena e la penna intatta accanto al calamaio. «Gli scaffali si aprono
      per chi ha un motivo, e Ulric dice che ce l'hai» dice. «Voglio sentirlo da
      te, oppure vedere qualcosa che me lo dica.»

      Al tavolo in fondo Padre Walter, il monaco enorme della Confraternita del
      Velo, tiene le mani appoggiate su un libro chiuso e alza gli occhi su di
      te una volta sola.

      {origine accolito-del-velo} Ti hanno insegnato che un monaco con le mani
      su un libro chiuso sta pregando, e Walter prega guardando te, tanto che la
      schiena ti si raddrizza da sola.

      *Quarant'anni e una chiave sola, e tocca a me.* Ti asciughi le mani sui
      calzoni senza farti vedere, due volte.
    opzioni:
      - testo: "Spiegare a Ottilia il tuo motivo"
        descrizione: "Ottilia vuole un motivo vero, detto in poche parole."
        immagine: personaggi/ottilia-sanvel
        prova: { attributo: sociale, abilita: [persuasione, galateo], difficolta: Difficile }
        successo:
          titolo: Senza aggettivi
          testo: |
            Le dici che in città succedono cose che non si vedevano da
            cinquant'anni, e che chi se le trova davanti non ha il tempo di salire
            da lei a chiedere il permesso. Poi le racconti quello che hai visto in
            questa sala, senza aggettivi. Ottilia ti ascolta fino in fondo. Poi
            intinge la penna e firma l'ultima riga della pagina bianca, con una
            grafia piccola e senza svolazzi.
          pe: { persuasione: 5 }
          segue: il-registro-delle-chiavi
        fallimento:
          titolo: Troppe parole
          testo: |
            Le parli a lungo della storia della città e dell'importanza dei libri, e a
            metà Ottilia sta già guardando una macchia sul soffitto. «Mi hai detto
            perché i libri sono importanti, e lo sapevo» dice alla fine. «Perché a te
            serve la chiave non me l'hai detto.» Rimette la penna accanto al calamaio,
            e Ulric sospira dentro la barba.
          effetti: { scandalo: 0.5 }

      - testo: "Rispondere alle domande di Ulric"
        descrizione: "Ulric propone tre domande di storia davanti a lei, che a lui sono sempre bastate per capire una persona."
        prova: { attributo: mentale, abilita: accademiche, difficolta: Media }
        successo:
          titolo: Il poeta caldrese
          testo: |
            Ulric ti chiede in che anno fu firmato il Patto delle Corde, e tu rispondi
            il centodiciotto, nella sala grande della Casa dei Nodi. Poi ti chiede
            quanti tetti ha avuto l'edificio, e tu dici tre, contando quello dei
            Precursori. Su un poeta caldrese ammetti di non averlo mai sentito
            nominare. «Effettivamente non lo sa nessuno, perché me l'ero inventato»
            dice Ulric, e Ottilia firma.
          pe: { accademiche: 5 }
          segue: il-registro-delle-chiavi
        fallimento:
          titolo: La risposta inventata
          testo: |
            Sbagli le prime due domande, la seconda di parecchi secoli. Alla terza, su un
            poeta caldrese che non hai mai sentito nominare, inventi con molta sicurezza
            una risposta, compresi il paese natale e una moglie. «Il poeta me l'ero
            inventato io» dice Ulric, dispiaciuto. Ottilia lascia la penna dov'è, e Ulric
            rimette la chiave nel cassetto senza girare la serratura.
          effetti: { scandalo: 0.5 }

      - testo: "Chiedere a Padre Walter di garantire per te"
        descrizione: "Ottilia ascolta Walter, e lui ti conosce abbastanza per dire una parola, se vuole."
        immagine: personaggi/padre-walter
        requisiti: [rep.velo >= 3]
        esito:
          titolo: Una parola
          testo: |
            Vai al tavolo in fondo e chiedi a Walter se vuole dire una parola per te.
            Il monaco ti squadra da sotto le sopracciglia e si alza, più alto di
            chiunque altro nella sala, e al bancone dice soltanto «Lo conosco», a voce
            bassa. Poi torna a sedersi con le mani sul libro chiuso, e Ottilia firma
            il registro senza fare altre domande.
          pe: { galateo: 5 }
          segue: il-registro-delle-chiavi

      - testo: "Lasciare che Ottilia ti guardi lavorare"
        descrizione: "Una giornata al tavolo lungo con Ottilia seduta di fronte, che firma se le basta quello che vede."
        costo: 2
        esito:
          titolo: Una giornata
          testo: |
            Passi la giornata al tavolo lungo fra le schede da ricopiare e un
            visitatore che cerca un libro che non esiste, e Ottilia resta seduta di
            fronte a te con un breviario aperto di cui non gira mai una pagina.
            All'ora di chiusura va al bancone. «Lavora e non si lamenta» dice a
            Ulric, che si lamenta per due, e firma il registro in fondo alla pagina
            bianca.
          pe: { resilienza: 5 }
          segue: il-registro-delle-chiavi

      - testo: "Chiedere perché un registro nuovo"
        descrizione: "Per quarant'anni Ulric ha dato le chiavi senza scrivere niente, e adesso compra un registro."
        quando: [indizio.archivi-mutilati >= 1]
        costo: 0
        esito:
          titolo: Chi ha le chiavi
          testo: |
            «L'ho comprato il giorno dopo che ho trovato vuoti i ripiani della costa
            nord» dice Ulric, accarezzando la copertina. «Chi ha preso quei libri
            conosceva questa Biblioteca meglio di me, che ci vivo dentro. Da allora
            voglio sapere chi ha una chiave di qui, e a che ora la usa.»

            {empatia Media} Da quel giorno non si fida più nemmeno della propria
            memoria, e una riga d'inchiostro almeno non dimentica.

      - testo: "Chiedere perché un registro nuovo"
        descrizione: "Per quarant'anni Ulric ha dato le chiavi senza scrivere niente, e adesso compra un registro."
        quando: [indizio.archivi-mutilati == 0]
        costo: 0
        esito:
          titolo: Una porta aperta
          testo: |
            «È un'idea di Ottilia» dice Ulric, come si confessa un debito. «Secondo
            lei una chiave senza un nome scritto è una porta aperta.» Ottilia annuisce
            una volta, senza aria di trionfo. Ulric aggiunge che il registro è costato
            quanto tre mesi di colla, e ti mostra la prima pagina con le colonne
            tirate a righello e una piccola sbavatura dove il righello gli è scappato.

      - testo: "Dire che non è il momento"
        descrizione: "Una chiave così è un impegno, e Ulric sa aspettare."
        costo: 0
        esito:
          titolo: Nel cassetto
          testo: |
            Lo ringrazi e dici che per adesso preferisci chiedere ogni volta. Ulric
            ci resta male, e si vede da come arrotola stretto il nastro rosso
            intorno alla chiave prima di rimetterla nel cassetto. Ottilia invece
            annuisce, come se la risposta le piacesse più di un sì. «Quando lo vuoi,
            il registro è qui» dice Ulric.

  - id: il-registro-delle-chiavi
    immagine: personaggi/ottilia-sanvel
    titolo: Il registro delle chiavi
    tipo: seguito
    luogo: Biblioteca di Qir-Azel, il bancone
    area: quartieri-alti
    requisiti: [biblioteca.tessera == 0]
    testo: |
      Ulric scrive il tuo nome sulla prima riga del registro nuovo con la lingua
      fra i denti, sotto la firma ancora lucida di Ottilia. Poi ti spiega le
      regole contando sulle dita. Gli scaffali si aprono soltanto nelle ore
      d'apertura, il sigillo lo rifà lui, e lì dentro non si legge mai a voce
      alta, perché certe cose lette ad alta voce restano nell'aria.

      {origine mercante-dei-ponti} Sui Ponti hai firmato registri della Gilda per
      ogni cassa che passava dal tuo banco, e sai quando una firma ancora lucida
      si potrebbe sbavare con il pollice.

      Prima di andarsene Ottilia ti chiede a voce bassa se Mattias Crenn mangia
      abbastanza, e se gli hanno respinto un'altra monografia. «A Mattias non dire
      che te l'ho chiesto» dice.

      Ulric ti porge la chiave dalla parte del nastro, che ha già l'odore della
      cera.
    opzioni:
      - testo: "Prendere la chiave"
        descrizione: "Gli scaffali sigillati del secondo piano, e ogni volta una riga tua sul registro."
        esito:
          titolo: La prima riga
          testo: |
            Ti leghi la chiave alla cintura con il nastro rosso. Ulric ti stringe la
            mano e ti dice che adesso siete in due a poter salire al secondo piano
            senza chiedere a Ottilia. Poi tira fuori da sotto il bancone la bottiglia
            di Laresh che tiene per Mattias e ne versa due dita in due bicchieri.
            Dalla sala di lettura Padre Walter alza la testa al rumore del vetro.
          imposta: { biblioteca.tessera: 1 }
          effetti: { rep.biblioteca: 1 }
      - testo: "Restituirgli la chiave"
        descrizione: "Per adesso preferisci che la chiave resti nel cassetto, e la riga con il tuo nome può aspettare."
        esito:
          titolo: La riga in sospeso
          testo: |
            Gli rendi la chiave, e Ulric la guarda sul palmo prima di rimetterla nel
            cassetto senza chiudere a chiave. Il tuo nome non lo cancella, e accanto
            ci scrive a matita *in sospeso*. «Una riga scritta è già mezza fatta»
            dice, e ti accompagna alla porta parlandoti del prezzo della cera.

  # ------------------------------------------------------------ la carta
  - id: carta-un-libro-in-prestito
    immagine: ambientazione/quartieri-alti
    titolo: Un libro in prestito
    sommario: "Sui gradini di un portico un vecchio precettore stringe un libro della Biblioteca, e non ha il coraggio di riportarlo."
    luogo: Quartieri Alti, sotto un portico
    tipo: carta
    area: quartieri-alti
    requisiti: [rep.biblioteca < 2, invito >= 1]
    testo: |
      Sul gradino più basso del portico di un palazzo siede un vecchio
      precettore vestito di nero, con in grembo un libro rilegato in pelle verde
      con il timbro sbiadito della Biblioteca. L'ha preso in prestito per i
      ragazzi del padrone undici anni fa. «Se lo riporto io, Ulric Stanne mi fa
      la predica fino a sera» dice. «Alla mia età non so se la reggo.»

      È un'antologia dei poeti dei primi anni della città, con un nastrino fermo
      sempre allo stesso punto.

      {empatia Media} Riportare il libro vuol dire non poter più aprire quella
      pagina quando gli pare.
    opzioni:
      - testo: "Riportarlo tu alla Biblioteca"
        descrizione: "Il libro non l'hai preso tu, e una predica per il debito di un altro dura meno."
        esito:
          titolo: Il nastrino
          testo: |
            Ulric Stanne prende il libro senza dire niente e lo apre al nastrino.
            Legge la poesia muovendo le labbra, e la barba bianca gli trema un poco.
            «Si fermava sempre qui anche da ragazzo» dice. «Era un allievo
            effettivamente pessimo, e questa gli piaceva lo stesso.» Rimette il libro
            sul carrello dei resi e ti dice che al tavolo lungo c'è sempre bisogno di
            qualcuno, e che paga poco.
          effetti: { rep.biblioteca: 0.5 }
      - testo: "Leggere la poesia del nastrino"
        descrizione: "Undici anni fermo alla stessa pagina, e prima di decidere vale la pena sapere che cosa c'è scritto."
        esito:
          titolo: La poesia
          testo: |
            Ti siedi sul gradino accanto al precettore e leggi la poesia del
            nastrino. Parla di un ponte di corde e di una ragazza che lo attraversa
            ogni sera senza guardare giù, e il penultimo verso lui lo dice insieme a
            te senza accorgersene. Poi si soffia il naso, si riprende il libro e si
            avvia verso la Biblioteca, dicendo che a quel punto la predica se la
            merita.
          pe: { espressivita: 2 }
      - testo: "Dirgli che tocca a lui"
        descrizione: "Il libro l'ha preso lui, e la predica è sua."
        costo: 0
        esito:
          titolo: La predica
          testo: |
            Il precettore resta in silenzio con il libro sulle ginocchia. Poi sospira e si alza tenendosi alla
            colonna del portico. Lo guardi allontanarsi a passi piccoli, con il libro stretto al petto, e
            fermarsi a metà strada a bere a una fontana per prendere tempo, prima di salire i gradini della
            Biblioteca.

      - testo: "Riconoscere il precettore dei tuoi cugini"
        descrizione: "Quel colletto liso l'hai visto per anni in fondo alla tavola, dalla parte dei tuoi cugini."
        quando: [origine.rampollo-dei-quartieri-alti >= 1]
        esito:
          titolo: Il precettore
          testo: |
            «Maestro» gli dici, come lo chiamavano i tuoi cugini, e lui ti riconosce e arrossisce fino al
            colletto, come quando ti passava davanti con il vassoio dei dolci. Gli prometti che a Ulric dirai
            che il libro l'avevano i ragazzi, ormai con la barba. Ulric apre il libro al nastrino e ti dice
            che al tavolo lungo c'è sempre lavoro per chi riporta i libri degli altri.
          effetti: { rep.biblioteca: 0.5 }
