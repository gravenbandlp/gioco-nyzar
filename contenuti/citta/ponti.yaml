# La città viva, luogo 12: i Ponti (presso: ponte-delle-mille-corde e ponte-dei-morti, area ponti-sospesi).
# L'attività sulle assi, le tre storie di rep.ponti (2 il braciere di Mamma Tesh, 4 le lanterne del Ponte dei
# Morti, 6 il passo dei Ponti, ognuna con il suo flag) e la carta del carro bloccato. Il servizio c'è già:
# il poligono dei Custodi (contenuti/allenamento.yaml) e le lanterne del Ponte dei Morti
# (contenuti/aree/ponti-sospesi.yaml).
# Reputazione: le storie la portano a 3, 5 e 7; l'attività la fa salire fino a 4 e, con tre opzioni fra 4 e 6
# su attributi diversi, fino a 6.
storylet:
  # ------------------------------------------------------------ l'attività ripetibile
  - id: sulle-assi
    presso: ponte-delle-mille-corde
    immagine: ambientazione/ponti-sospesi
    titolo: Sulle assi
    sommario: "All'imbocco del Ponte delle Mille Corde c'è sempre una gabella da contare o un'asse da cambiare."
    luogo: Ponte delle Mille Corde, l'imbocco
    area: ponti-sospesi
    ripetibile: true
    testo: |
      All'imbocco del Ponte delle Mille Corde il gabbiotto dei Custodi di
      Passaggio fa da dogana e da riparo, e il Custode alla finestrella porta
      nel nastro del cappello d'ordinanza una piuma di gabbiano che il
      regolamento non prevede. Il ponte vibra sotto le ruote, e i
      ponteggiatori della Gilda lavorano appesi alle funi a cambiare le assi
      marce. Fra le fessure del tavolato sale il fumo del braciere che Mamma
      Tesh tiene acceso nei sottoponti.

      Il Custode ti vede e alza due dita, che sui ponti vuol dire che una mano
      in più serve sempre.
    opzioni:
      - testo: "Dare il cambio al gabbiotto"
        descrizione: "Contare la gabella dei carri e tenere il registro in ordine mentre il ponte balla."
        requisiti: [rep.ponti < 2]
        prova: { attributo: mentale, abilita: [politica-ed-economia, percezione], difficolta: Media }
        successo:
          titolo: Il conto torna
          testo: |
            Ti siedi nel gabbiotto al posto del Custode, che va a mangiare sulla
            piattaforma di fronte con la forchetta a mezz'aria ogni volta che passa
            un carro. Conti la gabella e la segni sul registro incatenato al banco,
            e quando un carrettiere ti allunga una moneta tosata tieni il palmo
            aperto finché non ne tira fuori una buona. Al cambio del turno il conto
            torna, e il Custode ti paga.
          effetti: { monete: 2, rep.ponti: 0.5 }
        fallimento:
          titolo: Il conto che non torna
          testo: |
            All'ora di punta arrivano tre carri insieme e il registro ti scappa di
            mano. Al cambio del turno la cassetta risulta scarica. Il Custode ci
            mette la differenza di tasca sua, con un sospiro lungo, e ti dice che
            domani i carri li conta lui.
          effetti: { monete: 1 }

      - testo: "Dare il cambio al gabbiotto"
        descrizione: "Varn Kett ti lascia il registro per fare il giro dei ponti, e al ritorno lo controlla a memoria."
        immagine: personaggi/varn-kett
        requisiti: [rep.ponti >= 2, rep.ponti < 4]
        prova: { attributo: mentale, abilita: [politica-ed-economia, percezione], difficolta: Media }
        successo:
          titolo: Riga per riga
          testo: |
            Varn Kett ti lascia il gabbiotto per tutta la mattina e va a fare il
            giro dei ponti. Quando torna non guarda il registro e ti recita in
            ordine i carri della mattina con l'ora e il carico di ciascuno. Tu
            segui sulle tue righe con il dito, e coincidono tutte. Varn scrive
            qualcosa nell'aria con una penna che non c'è, poi ti conta la paga sul
            banco.
          effetti: { monete: 3, rep.ponti: 0.5 }
        fallimento:
          titolo: L'ora sbagliata
          testo: |
            Varn torna dal giro e ti recita a memoria i carri della mattina. Al
            quarto si ferma, perché sul tuo registro quel carro è passato un'ora
            prima, e ha ragione lui. Corregge la riga con la sua grafia da notaio
            e ti paga uno spicciolo, mentre la mano destra continua a scrivere
            nell'aria.
          effetti: { monete: 1 }

      - testo: "Fermare un carro che non vuole pagare"
        descrizione: "Un carrettiere non vuole pagare la gabella, perché alla Pignatta Grassa gli hanno promesso che non l'avrebbe pagata."
        requisiti: [rep.ponti < 4, pista.pelle < 6]
        prova: { attributo: sociale, abilita: [intimidire, persuasione], difficolta: Media }
        successo:
          titolo: L'accordo per iscritto
          testo: |
            Ti pianti davanti al mulo con le braccia incrociate e chiedi al
            carrettiere di mostrarti per iscritto l'accordo con la Pignatta. Lui
            guarda il Custode alle tue spalle, poi il vuoto oltre il parapetto, e
            alla fine conta qualche moneta sul palmo come se gli costassero un
            dente. Il Custode le infila nella cassetta e te ne passa altrettante
            per il disturbo.
          effetti: { monete: 2, rep.ponti: 0.5 }
        fallimento:
          titolo: Il mulo passa
          testo: |
            Gli dici che la gabella la pagano tutti, e lui ti risponde di andare a
            riscuoterla alla Pignatta Grassa, dove ti aspettano con piacere. Il
            mulo avanza di un passo, e i tuoi piedi si scansano prima che tu abbia
            deciso di farlo. Il Custode segna una gabella persa e, sotto, una
            crocetta accanto al tuo nome.

      - testo: "Fermare un carro che non vuole pagare"
        descrizione: "Dopo la notte della Pignatta i carrettieri che si dicevano protetti hanno smesso di dirlo. Qualcuno ci prova ancora."
        requisiti: [rep.ponti < 4, pista.pelle >= 6]
        prova: { attributo: sociale, abilita: [intimidire, persuasione], difficolta: Media }
        successo:
          titolo: Le travi bruciate
          testo: |
            Il carrettiere comincia a dire che ha un accordo, poi si ricorda con
            chi era e si ferma a metà della frase. Gli fai notare che della
            Pignatta Grassa sono rimaste le travi bruciate, e che a protestare con
            le travi si fa poca strada. Paga la gabella intera e chiede pure la
            ricevuta, e il Custode, divertito, ti passa una manciata di monete.
          effetti: { monete: 2, rep.ponti: 0.5 }
        fallimento:
          titolo: Un protettore nuovo
          testo: |
            Il carrettiere ti dice che adesso il suo protettore è un altro, e che
            gli conviene non fare il nome. Mentre cerchi di capire se è una bugia
            il mulo avanza e tu ti scansi. Il Custode segna la gabella persa e ti
            dice di lasciar perdere, perché quel carro lo conosce e domani
            ripassa.

      - testo: "Cambiare un'asse con i ponteggiatori"
        descrizione: "Ormun Pell, il caposquadra dei ponteggiatori, cerca sempre braccia per tenere la fune mentre i suoi cambiano le assi marce."
        requisiti: [rep.ponti < 4]
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Media }
        successo:
          titolo: Entro la settimana
          testo: |
            Ormun Pell è un nano largo quanto la porta del gabbiotto, con la barba
            chiusa in una fascia di cuoio. Sull'asse marcia si ferma dove le suole
            gli dicono di fermarsi. «Entro la settimana» dice, con il tono di un
            medico che non vuole spaventare la famiglia. Tieni la fune mentre due
            dei suoi inchiodano un'asse nuova, e Ormun, visti i tuoi palmi
            spellati, ti paga qualcosa in più.
          effetti: { monete: 2, rep.ponti: 0.5 }
        fallimento:
          titolo: La fune
          testo: |
            Tieni la fune mentre i ponteggiatori di Ormun Pell tolgono un'asse
            marcia, ma una raffica te la strappa dalle mani e l'asse vecchia se ne
            va nella Cicatrice prima che qualcuno la leghi. Nessuno si fa male.
            Ormun guarda il buco nel tavolato e poi te, e dice che un'asse caduta
            almeno non c'è da schiodarla. Ti paga poco e ti consiglia un paio di
            guanti.
          effetti: { monete: 1 }

      - testo: "Cercare chi è caduto"
        descrizione: "Un facchino è scivolato dal ponte con la gerla, e sotto le assi ci sono le reti dei sottoponti."
        immagine: ambientazione/cicatrice-del-mondo
        prova: { attributo: mentale, abilita: [percezione, acrobazia], difficolta: Facile }
        successo:
          titolo: Nella rete
          testo: |
            Scendi fra le travi seguendo le reti dei sottoponti. Il facchino è
            nella terza, avvolto nella maglia come un pesce, con la gerla sulla
            pancia e una caviglia storta, e si scusa due volte per il disturbo.
            Gli parli finché arrivano due uomini di Mamma Tesh con una fune. Il
            suo padrone, al Mercato dei Nodi, ti paga la gerla e qualcosa in più.
          effetti: { monete: 3 }
        fallimento:
          titolo: Le reti vuote
          testo: |
            Cerchi fra le reti dei sottoponti per tutto il pomeriggio e trovi un
            cavolo e un cappello che non è del facchino. Una ragazzina seduta su
            una trave, dondolando le gambe sul vuoto, ti dice che l'hanno già
            tirato su da un'altra parte e che il padrone ha pagato chi l'ha
            trovato. Risali la scala con le mani nere di pece.

      - testo: "Portare la legna al braciere di Mamma Tesh"
        descrizione: "Una fascina sulle spalle giù per la scala a pioli, fino al fuoco dei sottoponti che non si spegne mai."
        requisiti: [ponti.braciere == 0]
        esito:
          titolo: Il Capitano
          testo: |
            Scendi la scala a pioli con la fascina sulle spalle. Sulla piattaforma
            più larga dei sottoponti Mamma Tesh, una donna piccola con le mani
            annerite, rimprovera il suo braciere perché fa troppo fumo; è un
            vecchio elmo rovesciato, e lei lo chiama il Capitano. Prende la legna
            e te ne restituisce un ramo verde. «Questo al Capitano no, che poi
            tossisce» dice, e lo dice sul serio.
          pe: { resistenza: 2 }

      - testo: "Portare la legna al braciere di Mamma Tesh"
        descrizione: "Di sotto ormai ti aspettano, e la sera intorno al Capitano si raccontano le notizie della settimana."
        requisiti: [ponti.braciere >= 1]
        esito:
          titolo: Il posto buono
          testo: |
            Mamma Tesh ti vede arrivare dalla scala con la fascina e batte due
            volte la mano sull'asse accanto a sé, dalla parte dove il Capitano
            scalda meglio. Mentre la legna prende ti racconta a voce bassa chi è
            passato sotto le travi questa settimana e che cosa cercava di sopra.
            Risali con l'odore del fumo nei vestiti e una notizia da vendere.
          pe: { resistenza: 2 }
          effetti: { informazioni.voce: 1 }

      - testo: "Leggere le corde con Ormun Pell"
        descrizione: "Ormun sente le corde dalle suole, e vuole sapere se almeno tu sai leggere i nodi."
        requisiti: [rep.ponti >= 4, rep.ponti < 6]
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Media }
        successo:
          titolo: Entro il mese
          testo: |
            Percorri con Ormun il tratto dal gabbiotto al Mercato, una corda di
            sostegno alla volta, e lui ti chiede il verdetto prima di dare il suo.
            Alla sesta dici che va cambiata entro l'anno, perché il nodo
            all'attacco è lucido dove dovrebbe essere ruvido. «Entro il mese, ma
            l'hai vista» dice Ormun, e segna la corda con il gesso prima di
            pagarti bene.
          effetti: { monete: 4, rep.ponti: 0.5 }
        fallimento:
          titolo: Una corda buona
          testo: |
            A ogni corda dai il tuo verdetto con sempre più sicurezza, e alla
            sesta dici che è buona. Ormun ci sale sopra con tutta la sua mole, poi
            ti mostra con il pollice un trefolo spezzato sotto il nodo. «Un ponte
            che cade dopo aver avvisato è un'occasione. Uno che cade senza
            avvisare è una sciagura, e questa corda avvisava» dice, e ti paga la
            metà del solito.
          effetti: { monete: 2 }

      - testo: "Mettere pace fra un Custode e i sottoponti"
        descrizione: "Un Custode giovane ha l'ordine di tagliare una rete dei sottoponti, e ha già il coltello in mano."
        requisiti: [rep.ponti >= 4, rep.ponti < 6]
        prova: { attributo: sociale, abilita: [persuasione, empatia], difficolta: Media }
        successo:
          titolo: Rinviato
          testo: |
            Il Custode ha in tasca l'ordine e il coltello in mano, e sotto la
            trave una vecchia dei sottoponti stringe il capo della rete. Gli fai
            notare che quella rete raccoglie anche i dardi del poligono, che senza
            di lei la Gilda dovrebbe ricomprare. Il Custode rimette il coltello
            alla cintura e scrive sull'ordine *rinviato*, e Varn Kett, che
            guardava dalla finestrella, ti paga più del dovuto.
          effetti: { monete: 4, rep.ponti: 0.5 }
        fallimento:
          titolo: Il primo nodo
          testo: |
            Provi a spiegare a che cosa serve la rete, ma il Custode ha l'ordine
            in tasca e Varn Kett alle spalle, e taglia il primo nodo mentre parli,
            con gli occhi bassi. Metà della rete se ne va nel vuoto insieme a un
            cesto di mele appena ripescato. Per qualche giorno, quando scendi
            dalla scala a pioli, di sotto ti salutano un po' meno.

      - testo: "Recuperare un carico caduto"
        descrizione: "Una cassa è incastrata fra due travi sopra il vuoto, e il mercante paga chi la tira su intera."
        immagine: ambientazione/cicatrice-del-mondo
        requisiti: [rep.ponti >= 4, rep.ponti < 6]
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Media }
        successo:
          titolo: Fra due travi
          testo: |
            Ti leghi in vita la fune di un ponteggiatore e scendi lungo la trave
            maestra, con il vento che ti spinge di lato. La cassa è incastrata di
            sbieco, con un angolo già fuori dalla trave; la liberi un palmo alla
            volta e la leghi alla fune. Quando risali il mercante sta già contando
            le stoviglie, e ti paga senza alzare gli occhi dai piatti.
          effetti: { monete: 4, rep.ponti: 0.5 }
        fallimento:
          titolo: Un rumore di piatti
          testo: |
            Scendi lungo la trave maestra con la fune in vita, e a metà strada una
            raffica ti costringe ad abbracciare il legno. Mentre leghi la cassa
            l'angolo scivola, e la cassa se ne va nel vuoto con un rumore di
            piatti che dura molto più del previsto. Il mercante non ti paga. Ormun
            Pell, dal ponte, ti dà uno spicciolo perché almeno la fune l'hai
            riportata.
          effetti: { monete: 1 }

      - testo: "Fare il giro dei ponti con il passo"
        descrizione: "Sopra e sotto le assi ti conoscono. Dal gabbiotto ai sottoponti, ognuno ha qualcosa da chiederti o da raccontarti."
        requisiti: [ponti.passo >= 1]
        prova: { attributo: sociale, abilita: [conoscenze-della-strada, persuasione], difficolta: Media }
        successo:
          titolo: Il giro lungo
          testo: |
            Fai il giro lungo, dal gabbiotto di Varn alla piattaforma di Mamma
            Tesh e ritorno. Un Custode ti affida un messaggio per i sottoponti, e
            di sotto ti danno la risposta incisa con un chiodo su un pezzo di
            lamiera. Una venditrice di funi ti dice chi ha comprato corda nuova di
            notte, e torni con qualche moneta di commissioni e una notizia che
            vale qualcosa.
          effetti: { monete: 6, informazioni.pettegolezzo: 1 }
        fallimento:
          titolo: Troppi messaggi
          testo: |
            A ogni tratto qualcuno ti affida un messaggio o una commissione, e a
            metà giornata li hai confusi. Porti ai sottoponti la risposta di un
            Custode che era per un mercante, e al mercante il prezzo delle reti.
            Ti ridono dietro con affetto da tutte e due le parti del tavolato, e
            ti pagano lo stesso, a metà.
          effetti: { monete: 3 }

      - testo: "Contare i sacchi di un carro della Gilda"
        descrizione: "Certi carri dichiarano un sacco in meno, e il trucco lo conosci perché sul banco l'hai provato anche tu."
        quando: [origine.mercante-dei-ponti >= 1]
        prova: { attributo: mentale, abilita: [percezione, politica-ed-economia], difficolta: Media }
        successo:
          titolo: Il sacco sotto la tela
          testo: |
            Il carrettiere dichiara i sacchi ad alta voce tenendo una mano sulla
            tela, un gesto che le tue mani facevano uguale. Sollevi l'angolo dalla
            parte delle stanghe, dove nessuno guarda mai, e il sacco in più è lì.
            Il Custode scrive la gabella giusta e ti allunga la parte di chi
            trova, mentre il carrettiere, che ti riconosce dal banco, ti chiede
            perché proprio a lui.
          effetti: { monete: 2 }
        fallimento:
          titolo: Un carro onesto
          testo: |
            Sollevi l'angolo della tela dalla parte delle stanghe e trovi soltanto
            assi bagnate. Il carro è onesto, e il carrettiere lo fa notare a tutto il
            ponte con una voce che si sente fino al Mercato. Il Custode alza un dito
            solo, che sui ponti vuol dire che per oggi basta così.

  # ------------------------------------------------------------ storia a 2 · il braciere di Mamma Tesh
  - id: il-braciere-di-mamma-tesh
    presso: ponte-delle-mille-corde
    immagine: ambientazione/ponti-sospesi
    titolo: Il braciere di Mamma Tesh
    sommario: "La Casa dei Nodi ha vietato i fuochi sotto le assi, e Mamma Tesh non ha intenzione di spegnere il suo."
    luogo: Sotto il Ponte delle Mille Corde, i sottoponti
    area: ponti-sospesi
    requisiti: [rep.ponti >= 2, ponti.braciere == 0]
    testo: |
      Sulla porta del gabbiotto è inchiodato un ordine della Casa dei Nodi che
      vieta i fuochi sotto le assi del Ponte delle Mille Corde e dà tre giorni
      per spegnerli. Lo firma Varn Kett, con un ricciolo sulla K che da lui non
      ti saresti aspettato.

      {origine rampollo-dei-quartieri-alti} Ordini così li hai sentiti nascere
      a tavola dopo il pesce, da gente che sui Ponti non è mai scesa.

      Nei sottoponti, accanto al pilone, Mamma Tesh siede vicino al Capitano.
      «L'ho ripescato da una rete la notte che il ponte bruciò, e scottava
      ancora» dice senza alzare gli occhi. «Di sopra il fuoco se lo ricordano,
      lo capisco. Però quaggiù l'inverno arriva prima, e senza di lui qualcuno
      va a dormire al freddo e non si sveglia.»

      {origine fuggiasco-di-ghoran} Nei recinti di Ghoran il fuoco era dei
      sorveglianti, e voi dormivate dalla parte del vento.
    opzioni:
      - testo: "Parlare con Varn Kett"
        descrizione: "Varn ha firmato l'ordine, e per ritirarlo gli serve una ragione che si possa scrivere."
        immagine: personaggi/varn-kett
        prova: { attributo: sociale, abilita: [persuasione, galateo], difficolta: Media }
        successo:
          titolo: Un nome che ne risponde
          testo: |
            Dici a Varn che il braciere sta a quattro braccia dalle assi e che i sottoponti lo sorvegliano
            meglio di qualunque Custode, poi chi dorme intorno a quel fuoco d'inverno, e la sua mano, che
            scriveva nell'aria, rallenta. «Una lamiera sotto e un secchio di sabbia accanto» dice. «Ci vuole
            un nome che ne risponda, e il nome è il tuo.» Stacca il foglio dalla porta.
          pe: { persuasione: 5 }
          imposta: { ponti.braciere: 1 }
          effetti: { rep.ponti: 1 }
        fallimento:
          titolo: Il ricciolo sulla K
          testo: |
            Varn ti ascolta con la mano che scrive nell'aria, e a metà ti
            interrompe. «Ventitré anni fa ho visto bruciare questo ponte dalla
            piazza, con la divisa della milizia addosso» dice. «Da allora un fuoco
            vicino alle assi non lo firmo per nessuno.» Chiude la finestrella, e
            l'ordine resta inchiodato alla porta con il suo ricciolo sulla K.
          effetti: { scandalo: 0.5 }

      - testo: "Mettere il Capitano in sicurezza"
        descrizione: "Con una lamiera sotto e una cappa sopra il fuoco non tocca le assi, e l'ordine perde la sua ragione."
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Media }
        successo:
          titolo: La cappa
          testo: |
            Con una lamiera vecchia e un secchio di sabbia costruisci sotto il
            Capitano un letto che non scotta, e sopra appendi un'altra lamiera
            piegata a cappa, inclinata in modo che il vento della Cicatrice porti
            il fumo verso il vuoto. A sera Varn scende la scala a pioli, cosa che
            non fa mai, e gira due volte intorno alla cappa, poi risale a staccare
            l'ordine dalla porta.
          pe: { tecnologia: 5 }
          imposta: { ponti.braciere: 1 }
          effetti: { rep.ponti: 1 }
        fallimento:
          titolo: Il fumo
          testo: |
            Costruisci sotto il Capitano un letto di sabbia e sopra una cappa di lamiera, ma
            la pieghi storta, e il fumo invece di andare verso il vuoto torna giù sulla
            piattaforma. Per un'ora i sottoponti tossiscono insieme a te, e Mamma Tesh
            rimprovera prima il Capitano e poi te, con la stessa voce. Smonti tutto prima di
            sera, e il foglio sulla porta del gabbiotto resta dov'è.
          effetti: { scandalo: 0.5 }

      - testo: "Spostare il braciere sul pilone"
        descrizione: "Il pilone che ripara la piattaforma è di ferro dei Precursori e non brucia, se Mamma Tesh si lascia convincere."
        costo: 2
        esito:
          titolo: Sulla cengia
          testo: |
            Mamma Tesh fa il giro della piattaforma tre volte prima di dire di sì,
            e con due ragazzi dei sottoponti sistemi sulla cengia del pilone un
            anello di pietre di zavorra. Il Capitano ci sale per ultimo, portato
            da Tesh con due stracci bagnati, e da lassù scalda la piattaforma come
            prima, a cinque braccia dalle assi. A sera Varn guarda giù dalla
            finestrella ed esce a staccare l'ordine.
          pe: { atletica: 5 }
          imposta: { ponti.braciere: 1 }
          effetti: { rep.ponti: 1 }

      - testo: "Pagare il lavoro ai ponteggiatori"
        descrizione: "Per i ponteggiatori di Ormun Pell un fuoco sicuro è un appalto come un altro."
        requisiti: [monete >= 12]
        esito:
          titolo: Un appalto
          testo: |
            Ormun si gratta la barba nella fascia di cuoio e fa un prezzo, tutto
            compreso. «Un lavoro pagato in anticipo è il migliore che ci sia»
            dice, contando le monete con il pollice leccato. Il giorno dopo due
            dei suoi montano sotto il Capitano un letto di sabbia e sopra una
            cappa di lamiera, e Varn, letta la ricevuta di Ormun, stacca l'ordine
            dalla porta.
          pe: { politica-ed-economia: 5 }
          imposta: { ponti.braciere: 1 }
          effetti: { monete: -12, rep.ponti: 1 }

      - testo: "Farti raccontare la notte del Capitano"
        descrizione: "Mamma Tesh racconta di rado la notte in cui bruciò il ponte, ma a te potrebbe raccontarla."
        costo: 0
        esito:
          titolo: La notte del ponte
          testo: |
            «Bruciava da metà in su, e da quaggiù sembrava giorno» racconta Tesh,
            e parla delle bande con le livree che si inseguivano sulle assi e
            delle travi accese che cadevano nella Cicatrice. Il Capitano è caduto
            in una rete con lo stemma già grattato via. «Nessuno è mai venuto a
            riprenderselo, così adesso è mio e comanda soltanto il fumo» dice, e
            gli dà un colpetto.
          segue: il-braciere-di-mamma-tesh

  # ------------------------------------------------------------ storia a 4 · le lanterne del Ponte dei Morti
  - id: le-lanterne-del-ponte-dei-morti
    presso: ponte-dei-morti
    immagine: ambientazione/ponte-dei-morti
    titolo: Le lanterne in fondo al ponte
    sommario: "In fondo al Ponte dei Morti ci sono lanterne che nessuno cura più, e non si spengono mai."
    luogo: Ponte dei Morti, all'imbrunire
    area: ponti-sospesi
    requisiti: [rep.ponti >= 4, ponti.lanterne == 0]
    testo: |
      Il Ponte dei Morti ha già le sue lanterne accese, una per ogni
      Raschiatore disperso, e ogni squadra cura le proprie. In fondo, oltre il
      gabbiotto dei Custodi, c'è un tratto di parapetto con le lanterne di
      squadre che non esistono più, il ferro mangiato dalla ruggine. Dovrebbero
      essere spente, e invece sono accese tutte, con il vetro pulito.

      {origine apprendista-raschiatore} Una lanterna di squadra la puliscono a
      turno quelli della squadra, e qui non è rimasto nessuno a cui tocchi.

      Sulla solita cassa due Raschiatori della veglia si passano la borraccia.
      «Si accendono da sole, dicono» fa la donna. «Io dico che qualcuno le
      pulisce.»

      Sotto la più vecchia, sulle assi umide di nebbia, ci sono impronte di
      piedi nudi, piccole, che arrivano dal parapetto e al parapetto tornano.
      *Da quella parte c'è soltanto il vuoto.* Ti tieni con una mano al metallo
      freddo.
    opzioni:
      - testo: "Aspettare nascosto fra le lanterne"
        descrizione: "Chi le pulisce aspetta che il ponte sia vuoto. Basta sembrarlo per un'ora o due, nascosto dietro una trave."
        prova: { attributo: mentale, abilita: [percezione, furtivita], difficolta: Media }
        successo:
          titolo: Dal parapetto
          testo: |
            Ti siedi nella nebbia dietro una trave e lasci passare la seconda
            campana. Poco dopo due mani piccole si aggrappano al parapetto, e sul
            ponte sale un bambino scalzo con un sacco di tela sulla schiena. Va
            dritto alla lanterna più vecchia e cambia il cristallo con uno preso
            dal sacco, muovendo le labbra come se contasse. Quando ti vede resta
            immobile, con il cristallo in mano.
          segue: lo-stoppino
        fallimento:
          titolo: Le impronte nuove
          testo: |
            Ti siedi dietro una trave e aspetti, ma la nebbia sale fitta e a un
            certo punto ti assopisci. Quando riapri gli occhi le lanterne in fondo
            al ponte sono pulite, e sulle assi ci sono impronte nuove, piccole,
            che passano a un palmo dai tuoi stivali. Chi è venuto ti ha visto
            dormire e ti ha lasciato stare, e te ne vai all'alba con le ossa
            umide.
          effetti: { tormento: 0.5 }

      - testo: "Chiedere ai Raschiatori della veglia"
        descrizione: "Passano qui tutte le notti. Se qualcuno pulisce quelle lanterne lo sanno, e forse lo proteggono."
        prova: { attributo: sociale, abilita: [empatia, conoscenze-della-strada], difficolta: Media }
        successo:
          titolo: Un bambino dei sottoponti
          testo: |
            Ti siedi con loro e accetti la borraccia. «È un bambino dei sottoponti, lo chiamano Stoppino» dice
            la donna. «Sale dal parapetto dopo la seconda campana e accende le lanterne che non hanno più
            nessuno. Noi lo lasciamo fare, perché alla Gilda i bambini sui parapetti non piacciono.» Poi ti
            indica un punto del parapetto con il mento, e ti avverte di non spaventarlo.
          segue: lo-stoppino
        fallimento:
          titolo: Una lanterna per nome
          testo: |
            Ti siedi con loro e fai domande, e il vecchio ti risponde con il detto
            dei Raschiatori, una lanterna per nome e una per quello che pensavi di
            sapere di lui. Lo ripete ogni volta che chiedi qualcosa, con la stessa
            voce, finché la donna si mette a ridere e ti riprende la borraccia.
            Delle lanterne in fondo al ponte non ti dicono una parola.
          effetti: { scandalo: 0.5 }

      - testo: "Guardare da vicino i cristalli"
        descrizione: "Un cristallo conduttore dura anni, poi si spegne. Se queste lanterne sono ancora accese, qualcuno ha cambiato i cristalli."
        prova: { attributo: mentale, abilita: [tecnologia, magia], difficolta: Media }
        successo:
          titolo: Spago da pacchi
          testo: |
            Con il permesso della veglia apri la porticina della lanterna più
            vecchia. Dentro c'è un frammento esausto dell'Orlo dei Rottami, fermato
            con un nodo di spago da pacchi stretto con più forza che mestiere. Lo
            stesso nodo c'è in tutte le lanterne del tratto, e sul parapetto, dove
            una corda annodata scende nel vuoto fino ai sottoponti. Ti siedi
            accanto alla corda e aspetti.
          segue: lo-stoppino
        fallimento:
          titolo: Le dita sul vetro
          testo: |
            Guardi il cristallo controluce con aria esperta, ti sembra un
            conduttore come gli altri e dici alla Raschiatrice della veglia che
            allora è vero, la lanterna si accende da sola. Lei ride nella
            borraccia e ti fa notare le impronte delle tue dita sul vetro pulito.
            Lo ripassi con la manica, e le orecchie ti scottano fino al gabbiotto.
          effetti: { tormento: 0.5 }

      - testo: "Passare le notti sul ponte"
        descrizione: "Senza nasconderti e senza fare domande. Prima o poi chi pulisce le lanterne si abitua a vederti."
        costo: 2
        esito:
          titolo: La terza notte
          testo: |
            Torni per tre notti e ti siedi allo stesso posto, con la schiena al
            parapetto e le mani in vista. La terza notte, dopo la seconda campana,
            un bambino scalzo si arrampica dal vuoto sul parapetto a dieci passi da
            te, ti studia per un pezzo e decide che sei parte del ponte. Cambia i
            cristalli delle lanterne vecchie senza fretta, poi viene a sedersi
            accanto a te.
          segue: lo-stoppino

      - testo: "Sederti con la veglia, come uno di loro"
        descrizione: "I Raschiatori della veglia ti conoscono dalle piattaforme, e a uno della corporazione dicono le cose come stanno."
        quando: [origine.apprendista-raschiatore >= 1]
        esito:
          titolo: La borraccia
          testo: |
            La donna ti passa la borraccia prima che tu la chieda, perché sulle
            piattaforme ti ha visto tenere la corda. Il vecchio ti chiede di che
            squadra sei, poi ti racconta del bambino che arriva dopo la seconda
            campana, scalzo lungo il parapetto, con un sacco di cristalli dell'Orlo.
            «Noi lo lasciamo fare. Se resti seduto non lo spaventi» dice. Il bambino
            arriva, e tu resti seduto dove sei.
          segue: lo-stoppino

  - id: lo-stoppino
    immagine: ambientazione/ponte-dei-morti
    titolo: Lo Stoppino
    tipo: seguito
    luogo: Ponte dei Morti, dopo la seconda campana
    area: ponti-sospesi
    requisiti: [ponti.lanterne == 0]
    testo: |
      Il bambino avrà dieci anni, i piedi neri di pece e una camicia da uomo
      arrotolata sui gomiti. Si siede sul parapetto con le gambe sopra il
      vuoto, e devi trattenerti dall'allungare una mano per tenerlo.

      «Mi chiamano Stoppino, il nome vero ce l'ho ma qui non serve» dice. Apre
      il sacco e ti mostra i frammenti di cristallo grigi dell'Orlo dei
      Rottami. «Questi la Gilda li butta, ma dentro una lanterna, con la
      porticina chiusa, fanno un mese, a volte due.»

      Suo padre stava in una squadra di cinque, scesa nel Labirinto quattro
      inverni fa e mai risalita, e nessuno gli aveva appeso una lanterna.
      Gliel'ha appesa lui, e poi ha cominciato a guardare quelle accanto. «Se
      ne accendo una, posso accenderne anche sei» dice, e alza le spalle.

      {empatia Facile} Alza le spalle troppo in fretta, perché tu non faccia
      in tempo a dire che ti dispiace.

      {origine figlio-della-citta-bassa} Alla sua età rubavi i cerchi di ferro
      nel cortile del bottaio, e lui invece accende le lanterne dei morti.

      Indica l'ultima della fila, una lanterna di ferro nero quasi senza
      vetro. «Quella non la tocco, si accende da sola» dice, più piano. «Ci ho
      guardato dentro una volta, e da allora ci passo alla larga.»
    opzioni:
      - testo: "Dirlo ai Raschiatori"
        descrizione: "Le lanterne dei dispersi sono cosa dei Raschiatori, e al Grifone Dragna Gro-Malog compila i turni."
        immagine: personaggi/dragna-gro-malog
        esito:
          titolo: Nel registro del Ferro
          testo: |
            Racconti tutto a Dragna Gro-Malog, al Grifone, che nell'ultima pagina
            del registro, accanto a sei squadre che non scendono più, scrive *Ponte
            dei Morti, tratto in fondo*. «Da adesso i cristalli buoni li mette la
            bacheca, uno al mese per lanterna. Se il bambino vuole, li porta lui,
            dalla scala come la gente» dice. La settimana dopo trovi Stoppino sul
            ponte in pieno giorno, con un cristallo buono in mano.
          pe: { persuasione: 5 }
          imposta: { ponti.lanterne: 1 }
          effetti: { rep.ponti: 1, rep.raschiatori: 0.5 }

      - testo: "Dargli i tuoi frammenti"
        descrizione: "Nella bisaccia hai frammenti esausti che al Mercato valgono poco. In una lanterna valgono un mese di luce ciascuno."
        requisiti: [cristalli.frammento-esausto >= 2]
        esito:
          titolo: La Brontolona e la Gobba
          testo: |
            Svuoti la bisaccia sul parapetto. Stoppino conta i frammenti con il
            dito e per ognuno ti dice a quale lanterna andrà, chiamandole con i
            nomi che ha dato lui, come la Brontolona, che ha la porticina che
            cigola, o la Gobba, che pende a destra. Poi ti fa tenere il sacco
            mentre gira sull'esterno del parapetto, e tu per tutto il tempo eviti
            di guardare giù.
          pe: { empatia: 5 }
          imposta: { ponti.lanterne: 1 }
          effetti: { cristalli.frammento-esausto: -2, rep.ponti: 1 }

      - testo: "Comprare un cristallo buono per suo padre"
        descrizione: "Un cristallo conduttore del Mercato dura anni, e per quella lanterna Stoppino non dovrebbe più arrampicarsi."
        requisiti: [monete >= 4]
        esito:
          titolo: Una luce bianca
          testo: |
            Al mattino compri al banco delle lanterne un cristallo conduttore piccolo e la
            sera lo porti a Stoppino, che lo gira contro la luce prima di prenderlo. Insieme
            aprite la lanterna di suo padre, appesa fra due delle vecchie, e ci mettete il
            cristallo nuovo, che fa una luce bianca. Stoppino appoggia la fronte al vetro per
            un po', e tu guardi verso la nebbia.
          pe: { empatia: 5 }
          imposta: { ponti.lanterne: 1 }
          effetti: { monete: -4, rep.ponti: 1 }

      - testo: "Aiutarlo a cambiare i cristalli"
        descrizione: "Le lanterne vecchie sono appese fuori dal parapetto. Lui ci gira intorno come su un marciapiede, e tu dovresti provarci."
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Media }
        successo:
          titolo: Dall'altra parte
          testo: |
            Scavalchi il parapetto e ti muovi sul bordo esterno, con una mano sempre
            sul metallo e la nebbia fino alle ginocchia. Stoppino ti spiega dove
            mettere i piedi senza voltarsi, con la pazienza che si usa con un bambino
            più piccolo, e tu incastri i frammenti nelle lanterne più lontane. A fine
            giro ti regala il frammento più chiaro del suo sacco, per la tua lanterna,
            quando servirà.
          pe: { acrobazia: 5 }
          imposta: { ponti.lanterne: 1 }
          effetti: { cristalli.frammento-esausto: 1, rep.ponti: 1 }
        fallimento:
          titolo: Per il colletto
          testo: |
            Sulla lamiera bagnata del bordo ti scivola un piede, e resti appeso
            con le mani al metallo e le gambe nel vuoto. Stoppino ti afferra per
            il colletto con una forza che non ti aspettavi e ti tira di qua. Il
            resto del giro lo fa lui, e poi ti racconta che la prima volta è
            caduto anche lui, nella rete di Mamma Tesh, che l'ha sgridato per una
            settimana.
          imposta: { ponti.lanterne: 1 }
          effetti: { ferite: 0.5, rep.ponti: 1 }

      - testo: "Chiedergli del custode di notte"
        descrizione: "Dopo la seconda campana, nel gabbiotto in fondo al ponte, sta un uomo pallido con un mantello cerato."
        requisiti: [maedric == 0]
        costo: 0
        esito:
          titolo: I carri di notte
          testo: |
            «Quello alle lanterne non tocca niente» dice Stoppino, abbassando la
            voce. «Però i carri che passano di notte li guarda lui, e quando
            passano io sto sotto, che di sopra non mi vede nessuno.» Mamma Tesh
            gli ha insegnato a non contarli, e infatti lui non li guarda.

            {ingannare Media} Eppure sa quando passano e chi li controlla, come un
            bambino a cui hanno insegnato a stare al sicuro.
          segue: lo-stoppino

      - testo: "Chiedergli del custode di notte"
        descrizione: "Il gabbiotto in fondo al ponte ha un custode nuovo, da quando Maedric Holl non c'è più."
        requisiti: [maedric >= 1]
        costo: 0
        esito:
          titolo: Il custode nuovo
          testo: |
            «Quello nuovo è giovane e ha paura del buio» dice Stoppino, con il
            rispetto che si usa per un difetto delle persone perbene. «Mi lascia
            salire prima della seconda campana, e una volta mi ha dato mezza
            pagnotta.» Di notte i carri con le ruote fasciate non passano più, e
            sul ponte si sente solo il custode nuovo che canta per farsi coraggio.
          segue: lo-stoppino

      - testo: "Guardare nella lanterna nera"
        descrizione: "L'ultima della fila. Stoppino non ci si avvicina, e ti guarda mentre ti avvicini tu."
        costo: 0
        esito:
          titolo: La lanterna nera
          testo: |
            La lanterna di ferro nero ha un solo vetro, e dentro un cristallo
            grande come un'unghia fa luce lo stesso. La luce batte piano e
            rallenta quando ti avvicini.

            {magia Difficile} Il Mana non si consuma, gira in un cerchio chiuso,
            come non hai mai sentito fare a un cristallo.

            Sulla porticina c'è un nome mangiato dalla ruggine, e quando torni da
            Stoppino, con la pelle d'oca, lui annuisce.
          effetti: { tormento: 1 }
          segue: lo-stoppino

  # ------------------------------------------------------------ storia a 6 · il passo dei Ponti
  - id: il-passo-dei-ponti
    presso: ponte-delle-mille-corde
    immagine: personaggi/varn-kett
    titolo: Il passo dei Ponti
    sommario: "Varn Kett ti fa chiamare nel gabbiotto, dove Mamma Tesh è salita dai sottoponti per l'occasione."
    luogo: Ponte delle Mille Corde, il gabbiotto dei Custodi
    area: ponti-sospesi
    requisiti: [rep.ponti >= 6, ponti.passo == 0]
    testo: |
      Nel gabbiotto, sulla panca dove si siedono i carrettieri che contestano
      la gabella, c'è Mamma Tesh con lo scialle buono. Accanto a lei Ormun
      Pell occupa da solo mezzo gabbiotto, e suda.

      {origine mercante-dei-ponti} Con la licenza della Gilda sui Ponti passi
      senza gabella da quando hai aperto il banco, e Varn lo sa meglio di te.

      «Chi lavora sui ponti non paga la gabella per andare a lavorare» dice
      Varn. «Sulle assi lo chiamano il passo.» La mano destra comincia a
      scrivere nell'aria. «Ormun dice che lavori per lui da abbastanza tempo
      da stare sul suo ruolo, e io dico che i tuoi conti tornano. Tesh dice
      altre cose, e le dica lei.»

      «Dico che di sotto c'è un posto vicino al Capitano, e che è tuo» dice
      Tesh.

      «Sul ruolo però ci va chi ha fatto il giro» dice Ormun, asciugandosi la
      fronte. «Un giro intero del ponte, da una sponda all'altra, sopra le
      corde con me o sotto le assi con la gente di Tesh. Se no Varn ti fa le
      sue domande, e quelle sono peggio.»

      *Tre persone che non vanno d'accordo su niente hanno trovato un accordo
      su di me.* Le mani ti sono finite in tasca, e le tiri fuori.
    opzioni:
      - testo: "Il giro delle corde con Ormun"
        descrizione: "Da una sponda all'altra, corda per corda. Ormun vuole il tuo verdetto su ciascuna, prima del suo."
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Media }
        successo:
          titolo: Il verdetto
          testo: |
            Partite all'alba dalla sponda dei Quartieri Alti, e a ogni corda Ormun
            aspetta il tuo verdetto; a metà mattina smette di dare il suo, perché
            è lo stesso. Vicino alla sponda della Città Bassa una sola corda vi
            divide, e ne discutete fino a mezzogiorno, finché Ormun ci sale sopra
            e ammette che hai ragione tu, piano, perché davanti ai suoi uomini non
            lo direbbe mai.
          pe: { tecnologia: 5 }
          segue: il-ruolo-dei-ponteggiatori
        fallimento:
          titolo: Mezzo ponte
          testo: |
            Per mezzo ponte i tuoi verdetti sono quelli di Ormun. Poi una corda
            che giuri buona gli si sfilaccia sotto il pollice, e la successiva che
            dici marcia è nuova di un mese. Ormun segna le due corde con il gesso
            e ti dice che il giro finisce qui per oggi, ma il ruolo resta aperto e
            le corde non scappano.
          effetti: { tormento: 0.5 }

      - testo: "Il giro sotto le assi"
        descrizione: "Da una sponda all'altra sotto le assi, da una trave all'altra con una mano sempre sulla fune."
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Media }
        successo:
          titolo: Da una trave all'altra
          testo: |
            Due ragazzi di Mamma Tesh ti guidano sotto le assi, su passerelle
            larghe una spanna e travi nude. A metà strada uno si ferma su una
            trave ad aspettare cosa fai, e tu passi oltre senza guardarlo, perché
            chi chiede permesso quaggiù resta ospite per sempre. Alla sponda della
            Città Bassa arrivi con le mani nere di pece, e Tesh ti batte una mano
            sul braccio.
          pe: { acrobazia: 5 }
          segue: il-ruolo-dei-ponteggiatori
        fallimento:
          titolo: La rete
          testo: |
            Due ragazzi di Mamma Tesh ti fanno strada sotto le assi. Per un buon
            tratto tieni il passo, poi su una trave nuda ti prende una raffica e
            finisci nella rete sotto il Mercato, fra le mele ammaccate. I ragazzi
            ti tirano fuori ridendo, e uno ti dice che a lui era successo tre
            volte. Il giro va rifatto da capo un altro giorno.
          effetti: { ferite: 0.5 }

      - testo: "Le domande di Varn"
        descrizione: "Varn ricorda ogni giorno passato sui ponti. Vuole sapere quanto ne ricordi tu, e quanto conosci il regolamento."
        prova: { attributo: mentale, abilita: [politica-ed-economia, accademiche], difficolta: Difficile }
        successo:
          titolo: Il martedì di tre settimane fa
          testo: |
            Varn chiede dei carri di sale del martedì di tre settimane fa, e li ricordi perché uno aveva
            il mulo zoppo. Poi chiede dei carichi caduti nelle reti, che sono di chi li ripesca se
            nessuno li reclama entro sera, e della gabella sui funerali, che non paga nessuno. Varn
            smette di scrivere nell'aria. «Basta così» dice, e Ormun fa un fischio lungo.
          pe: { politica-ed-economia: 5 }
          segue: il-ruolo-dei-ponteggiatori
        fallimento:
          titolo: I carri di sale
          testo: |
            Varn ti chiede quanti carri di sale sono passati il martedì di tre
            settimane fa. Dici con aria convinta il primo numero che ti viene in
            mente, e lui ti corregge con l'ora di ciascun carro e il colore del
            mulo. Sul regolamento confondi le reti con i parapetti, e Ormun
            sospira alle tue spalle. Varn ti dice di tornare quando avrai deciso
            quale delle tre strade fa per te.
          effetti: { scandalo: 0.5 }

      - testo: "Farti garantire dalla gente di sotto"
        descrizione: "Al braciere ognuno paga il posto con una storia, e se i sottoponti garantiscono per te Ormun non obietta."
        prova: { attributo: sociale, abilita: [espressivita, empatia], difficolta: Media }
        successo:
          titolo: Intorno al Capitano
          testo: |
            La sera scendi al braciere e racconti come hai conosciuto i ponti,
            dalla prima gabella a oggi, sbagli compresi. Ridono nei punti giusti,
            e il Capitano scoppietta in uno sbagliato. Alla fine Mamma Tesh chiede
            chi garantisce, e si alzano in sei, fra cui un ragazzino con i piedi
            neri di pece. Il giorno dopo i loro nomi sono sul ruolo di Ormun
            accanto al tuo.
          pe: { espressivita: 5 }
          segue: il-ruolo-dei-ponteggiatori
        fallimento:
          titolo: In fondo al cerchio
          testo: |
            La storia ti viene fuori troppo lunga e troppo seria, e a metà la gente intorno al
            fuoco comincia a parlare d'altro, mentre tu alzi la voce e peggiori le cose.
            Quando Mamma Tesh chiede chi garantisce si alza soltanto lei. «Una non basta, e lo
            dico io per prima» dice, e ti passa la scodella lo stesso, con il consiglio di
            tornare quando avrai una storia più corta.
          effetti: { scandalo: 0.5 }

      - testo: "Fare il giro piano, con Ormun"
        descrizione: "Una giornata intera al passo di Ormun, che legge le corde mentre tu cammini al suo fianco e impari."
        costo: 2
        esito:
          titolo: Al passo di Ormun
          testo: |
            Il giro al passo di Ormun dura dall'alba al tramonto. Lui ascolta ogni
            corda con i piedi e dice il verdetto ad alta voce, perché tu lo
            impari. Mentre mangiate pane e lardo su una trave ti racconta di un
            ponte crollato vent'anni fa con un carro sopra, che lui aveva visto
            venire una settimana prima. Alla fine dice che per il ruolo conta
            anche la pazienza.
          pe: { resilienza: 5 }
          segue: il-ruolo-dei-ponteggiatori

      - testo: "Dire che non è il momento"
        descrizione: "Il passo è un impegno con tre persone diverse. Puoi chiedere tempo, e il ruolo resta lì."
        costo: 0
        esito:
          titolo: Il ruolo aperto
          testo: |
            Dici che ti fa onore, ma che per adesso non sei sicuro di poterlo meritare tutti i giorni, e mentre lo
            dici ti accorgi che è vero. Ormun dice che le corde sanno aspettare. Mamma Tesh si sistema lo scialle e ti
            dice che il posto vicino al Capitano intanto non lo dà a nessuno.

  - id: il-ruolo-dei-ponteggiatori
    immagine: personaggi/varn-kett
    titolo: Il ruolo dei ponteggiatori
    tipo: seguito
    luogo: Ponte delle Mille Corde, il gabbiotto dei Custodi
    area: ponti-sospesi
    requisiti: [ponti.passo == 0]
    testo: |
      Nel gabbiotto Ormun ha posato sul banco il ruolo della squadra, un
      registro unto di pece con una ventina di nomi in una grafia incerta,
      perché parecchi dei suoi uomini hanno imparato a firmare in cella. Varn
      tiene sospesa sul foglio una penna vera, con il pennino mai intinto,
      comprata apposta per questa riga.

      «Una riga sul ruolo, e da domani la gabella non la paghi» dice Varn.
      «Quando Ormun ti chiama devi venire, di notte come con la pioggia. Se un
      ponte ha bisogno di te tu ci sei, e per la Casa dei Nodi questo vale più
      di una gabella.»

      Tesh ti mostra dalla finestrella un pezzo di lamiera con un segno inciso
      a chiodo che somiglia al tuo nome. *Una vita intera sotto le travi, e ha
      imparato a scrivere il mio nome.* La tua mano sul banco si stringe a
      pugno da sola.
    opzioni:
      - testo: "Mettere il tuo nome sul ruolo"
        descrizione: "Una riga sul registro di Ormun, scritta dalla mano di Varn, e un posto vicino al Capitano."
        requisiti: [licenza-gilda == 0]
        esito:
          titolo: Il passo
          testo: |
            Varn scrive il tuo nome sul ruolo con la sua grafia da notaio, e
            accanto aggiunge *ausiliario*. «Da oggi i ponti non ti costano niente»
            dice, «e non perché ti faccio un favore.» Ormun ti stringe la mano
            fino a farti scricchiolare le dita, e Mamma Tesh ti dà la lamiera da
            appendere al chiodo accanto al braciere, così tutti sanno che quel
            posto è occupato.
          imposta: { ponti.passo: 1 }
          effetti: { rep.ponti: 1 }

      - testo: "Mettere il tuo nome sul ruolo"
        descrizione: "La gabella non la paghi già, perché hai la licenza della Gilda. Il passo invece non si compra."
        requisiti: [licenza-gilda >= 1]
        esito:
          titolo: Quello che non si compra
          testo: |
            Varn scrive il tuo nome sul ruolo, e accanto aggiunge *ausiliario*.
            «La gabella non la pagavi già, per la licenza» dice. «Sul ruolo invece
            ci sei perché ti ci abbiamo messo noi.» Ormun ti stringe la mano fino
            a farti scricchiolare le dita, e Mamma Tesh ti dà la lamiera da
            appendere accanto al braciere, perché di sotto la licenza non la legge
            nessuno.
          imposta: { ponti.passo: 1 }
          effetti: { rep.ponti: 1 }

      - testo: "Chiedere ancora tempo"
        descrizione: "Venire ogni volta che Ormun chiama, anche di notte. Forse adesso non puoi promettere tanto."
        esito:
          titolo: La lamiera sul chiodo
          testo: |
            Gli dici che per adesso non puoi promettere di venire ogni volta che
            Ormun chiama, e preferisci non firmare una cosa che rischi di non
            mantenere. Varn posa la penna nuova e annuisce una volta, e Ormun
            richiude il ruolo con un tonfo. Mamma Tesh si tiene la lamiera e dice
            che la appende lei, al chiodo accanto al Capitano, così il posto resta
            tuo finché non ti decidi.

  # ------------------------------------------------------------ la carta
  - id: carta-un-carro-bloccato-sul-ponte
    immagine: ambientazione/ponti-sospesi
    titolo: Un carro bloccato sul ponte
    sommario: "A metà del Ponte delle Mille Corde un carro ha sfondato un'asse, e dietro si è fermato mezzo Mercato."
    luogo: Ponte delle Mille Corde, a metà campata
    tipo: carta
    area: ponti-sospesi
    requisiti: [rep.ponti < 2]
    testo: |
      A metà del Ponte delle Mille Corde un carro carico di botti ha sfondato
      un'asse marcia, e pende di sbieco con la ruota infilata nel tavolato
      fino al mozzo. Dietro si sono fermati i carretti del Mercato e una fila
      di facchini, e un ragazzo vende già castagne a chi aspetta. Il mulo
      scalcia, e il ponte trema a ogni colpo.

      Da sotto, per la fessura dell'asse rotta, una voce di donna chiede se
      lassù qualcuno ha intenzione di farle cadere una botte in cucina. Il
      Custode più vicino è all'imbocco, e da lì si sbraccia senza muoversi.
    opzioni:
      - testo: "Sollevare la ruota"
        descrizione: "Una spalla sotto il pianale e due facchini dall'altra parte. Se la ruota esce dal buco, il carro riparte."
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Media }
        successo:
          titolo: Fuori dal buco
          testo: |
            Ti metti sotto il pianale con la spalla, e due facchini fanno lo
            stesso dall'altra parte. Al tre spingete, e la ruota esce dal buco con
            un rumore di legno strappato. Il Custode arriva a cose fatte e si
            segna il tuo nome, perché i ponteggiatori di Ormun Pell cercano sempre
            spalle buone.
          effetti: { rep.ponti: 0.5 }
        fallimento:
          titolo: Il pianale
          testo: |
            Spingi con la spalla sotto il pianale, ma il carro è più pesante di
            quanto sembrava e la ruota affonda ancora di un palmo, mentre una
            botte rotola indietro e la fermi con il ginocchio. Alla fine arrivano
            i ponteggiatori con una leva, e tu resti a massaggiarti la spalla
            mentre tirano fuori la ruota in due colpi.
          effetti: { ferite: 0.5 }

      - testo: "Calmare il mulo"
        descrizione: "Finché il mulo scalcia la ruota affonda sempre di più. Prima bisogna fermare lui."
        prova: { attributo: sociale, abilita: addestrare-animali, difficolta: Facile }
        successo:
          titolo: La cavezza
          testo: |
            Prendi la cavezza dalle mani del carrettiere, che te la lascia per lo stupore, e parli
            al mulo piano, con la mano aperta sul muso. Il mulo smette di scalciare e il ponte
            smette di tremare. Il carrettiere mette un'asse di traverso sotto la ruota, e il carro
            esce dal buco al primo tiro. Ti allunga qualche spicciolo e ti chiede se il mulo lo
            vuoi comprare.
          effetti: { monete: 1 }
        fallimento:
          titolo: Lo zoccolo
          testo: |
            Prendi la cavezza e parli al mulo, ma il mulo ha deciso che la colpa è tua e ti pesta
            un piede.

            {cavalcare Facile fallita} Un mulo, ti eri detto, è soltanto un cavallo con più
            opinioni, e i cavalli ti hanno sempre dato retta.

            Quando smetti di saltellare i ponteggiatori di Ormun Pell hanno già liberato la
            ruota, e il mulo, passandoti accanto, ti guarda con un occhio solo.

      - testo: "Scendere a tranquillizzare la cucina di sotto"
        descrizione: "Sotto le assi qualcuno cucina, e la scala a pioli è lì vicino."
        esito:
          titolo: La cucina sotto le assi
          testo: |
            Di sotto trovi la cucina, una piattaforma con un fornello di mattoni sotto la ruota
            del carro. La donna gira la zuppa con un coperchio sopra la testa contro la segatura
            che piove dall'asse rotta. Le tieni la pentola mentre sposta il fornello lontano dal
            buco, e quando il carro riparte ti offre una scodella e ti chiede come ti chiami, per
            sapere a chi deve un favore.
          effetti: { rep.ponti: 0.5 }

      - testo: "Passare oltre"
        descrizione: "Prima o poi i Custodi o i ponteggiatori quella ruota la tirano fuori."
        costo: 0
        esito:
          titolo: Il giro largo
          testo: |
            Ti infili fra i facchini e passi accanto al carro tenendoti alla larga
            dal mulo. Il ragazzo delle castagne prova a venderti un cartoccio, e
            per liberartene gli dici che hai appena mangiato, mentre la pancia
            brontola e ti smentisce. Da sotto le assi la donna della cucina si è
            messa a cantare, forte, per coprire i ragli.
