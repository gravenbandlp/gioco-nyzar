# La città viva, luogo 6: la Guarnigione di Qir-Azel (presso: guarnigione-di-qir-azel, area quartieri-alti).
# L'attività delle pattuglie, le tre storie di rep.caserma (2 la ronda di notte, con il seguito sul Ponte dei
# Morti; 4 i trenta di Ghoran; 6 la lista dello sceriffo, con il seguito del nome nella lista) e la carta del
# miliziano. Galdrick è a Ghoran dal congedo delle tribù alla fine di Acciaio e Ira (`galdrick.via == 1`): le
# scene che lo vogliono in ufficio chiedono `galdrick.via == 0` (requisiti o `quando`). Il servizio del luogo sono le pattuglie stesse: la paga del furiere e, con il distintivo, gli
# incarichi dalla lista.
# Reputazione: le storie la portano a 3, 5 e 7; le ronde (Ponti, Città Bassa, mura) la fanno salire fino a 4, e
# le reclute, la ronda mista e le pratiche dello sceriffo (fisico, sociale, mentale) fino a 6.
# Stato del mondo: i mercenari di Ghoran dopo pista.capomozzo >= 1; Borso carceriere fino a pista.pelle 3, poi
# fuggito, e dopo pista.pelle >= 6 in catene in fondo alle celle; Vesh morto e Galdrick ferito dopo pista.pelle 6.
# Nomi nuovi, che il Codex non dà: il sergente Livio Mastrel, la recluta Linna Varo (e il padre Ansel), il
# mercenario Mardek. Hagra è la guida di capomozzo-1.yaml.
# Dall'ottobre 2026 le tre storie sono passi della quest della Caserma (contenuti/fazioni/caserma/): la ronda di
# notte è il passo 2 (fazione.caserma == 1), la lista dello sceriffo il passo 9 (== 8, con il bivio con gli Scuri e
# il grado di vice-sceriffo), i trenta di Ghoran il passo 10 (== 9, bivio.legge == 1). I flag guarnigione.ronda,
# .mercenari e .distintivo restano, perché altre scene li leggono. Le pattuglie, la carta e gli incarichi della
# lista restano come prima.
storylet:
  # ------------------------------------------------------------ l'attività ripetibile
  - id: le-pattuglie
    presso: guarnigione-di-qir-azel
    immagine: ambientazione/guarnigione-di-qir-azel
    titolo: Le pattuglie
    sommario: "All'alba il furiere consegna le lanterne alle ronde, e due braccia in più non le rimanda mai indietro."
    luogo: Guarnigione di Qir-Azel, il cortile
    area: quartieri-alti
    ripetibile: true
    testo: |
      All'alba il cortile della Caserma è già pieno, e passando il portone
      senti i manichini di paglia colpiti a tempo e il sergente d'addestramento
      che conta ad alta voce. Alla porta del magazzino il furiere consegna a
      ogni miliziano una lanterna insieme alla ricevuta da firmare, e chi non
      sa scrivere firma con il pollice.

      Dalla finestra del primo piano, quando è in città, lo sceriffo Galdrick
      guarda il cortile con i pollici nella cintura. *Qui dentro ha una
      ricevuta perfino la paglia dei manichini.* Senza volerlo tieni la schiena
      più dritta del solito.
    opzioni:
      - testo: "Uscire di ronda sui Ponti"
        descrizione: "Il giro lungo dei Ponti Sospesi, da un gabbiotto all'altro, a passo di Raschiatore."
        immagine: ambientazione/ponti-sospesi
        requisiti: [rep.caserma < 4]
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Media }
        successo:
          titolo: Il giro lungo
          testo: |
            Il sergente ti mette in coppia con un Raschiatore anziano che sulle
            assi non guarda mai in basso, e fate il giro dei Ponti battendo due
            colpi sulla porta di ogni gabbiotto dei Custodi.

            {origine apprendista-raschiatore} Al secondo ponte smette di voltarsi
            a controllare se lo segui, e fra Raschiatori è un complimento.

            Al rientro il furiere ti fa firmare per la lanterna, che non avete mai
            acceso.
          effetti: { monete: 2, rep.caserma: 0.5 }
        fallimento:
          titolo: Un ponte di ritardo
          testo: |
            Il Raschiatore con cui ti mettono in coppia cammina sui Ponti come se
            fossero in piano, e a metà giro ti lascia indietro di un ponte intero,
            poi ti aspetta seduto su una bitta. Sul registro il furiere scrive
            l'ora del rientro con accanto un punto, che nel suo alfabeto vale un
            rimprovero, e ti paga con gli spiccioli del cassetto.
          effetti: { monete: 1 }

      - testo: "Scendere di ronda in Città Bassa"
        descrizione: "La Guardia passa in Città Bassa di rado e mai a sorpresa, e serve chi conosce le strade."
        immagine: ambientazione/citta-bassa
        requisiti: [rep.caserma < 4]
        quando: [pista.pelle < 6]
        prova: { attributo: sociale, abilita: [conoscenze-della-strada, intimidire], difficolta: Media }
        successo:
          titolo: Il lenzuolo
          testo: |
            Tu e il miliziano fate il giro di sempre alla solita ora, e la gente
            vi vede arrivare da due strade di distanza. Sul tardi una lavandaia vi
            ferma per un lenzuolo rubato, e tu sai già in quale cortile cercarlo;
            lo trovi steso ad asciugare, con le iniziali di lei ricamate in un
            angolo. Il furiere ti paga il giro e ti fa firmare anche per il
            lenzuolo.
          effetti: { monete: 2, rep.caserma: 0.5 }
        fallimento:
          titolo: Il cortile sbagliato
          testo: |
            Una lavandaia vi ferma per un lenzuolo rubato, e tu lo cerchi nel
            cortile sbagliato davanti a tutta la strada. Quando lo trovate, la
            presunta ladra vi spiega con calma dalla finestra che il lenzuolo è
            suo e che la lavandaia beve, e la strada si mette comoda ad ascoltarle
            litigare mentre voi rientrate in Caserma senza lenzuolo e senza ladra.
          effetti: { monete: 1 }

      - testo: "Scendere di ronda in Città Bassa"
        descrizione: "Dopo la notte della Pignatta la ronda scende anche di sera, e la Città Bassa non sa ancora come guardarla."
        immagine: ambientazione/citta-bassa
        requisiti: [rep.caserma < 4]
        quando: [pista.pelle >= 6]
        prova: { attributo: sociale, abilita: [conoscenze-della-strada, intimidire], difficolta: Media }
        successo:
          titolo: L'orto della Pignatta
          testo: |
            Qualcuno vi saluta dalla finestra, e qualcun altro chiude le imposte
            prima che arriviate. Davanti ai muri anneriti della Pignatta una
            vecchia zappa un orto di cipolle storte e vi chiede se è vero che
            adesso la Guardia passa anche di notte. Le rispondi di sì, e il
            miliziano accanto a te lo scrive sul taccuino come un ordine.
          effetti: { monete: 2, rep.caserma: 0.5 }
        fallimento:
          titolo: La zolla
          testo: |
            Davanti ai muri anneriti della Pignatta un ragazzo vi tira una zolla
            di terra e scappa nei vicoli, e tu lo perdi alla quarta strada, fra i
            panni stesi. Il miliziano si è già pulito il mantello scarlatto e ti
            dice che è la terza zolla della settimana, e che la terra della Città
            Bassa, almeno, è buona.
          effetti: { monete: 1 }

      - testo: "Fare la guardia sulle mura"
        descrizione: "Dopo la razzia le mura nord hanno pochi uomini e molta notte."
        requisiti: [rep.caserma < 4]
        quando: [pista.capomozzo < 1]
        prova: { attributo: mentale, abilita: [percezione, natura], difficolta: Media }
        successo:
          titolo: Le stoppie
          testo: |
            Dal cammino di ronda delle mura nord passi la notte a guardare i campi
            con una guardia che sbadiglia ogni volta che sbadigli tu. Verso l'alba
            oltre i campi si alza un fumo basso, e prima che lui afferri la corda
            della campana gli dici che è un contadino che brucia le stoppie.

            {origine figlio-del-circolo} Al Circolo ti hanno insegnato a leggere
            un fumo prima di sentirne l'odore.
          effetti: { monete: 2, rep.caserma: 0.5 }
        fallimento:
          titolo: La campana
          testo: |
            Verso l'alba vedi un fumo oltre i campi e suoni la campana, e il
            sergente sale sulle mura in camicia con la spada sguainata. È un
            contadino che brucia le stoppie, come ogni autunno. Il sergente si
            riabbottona la camicia fino al collo con una lentezza piena di
            significato e ti paga una miseria, perché il turno l'hai fatto.
          effetti: { monete: 1 }

      - testo: "Fare la guardia sulle mura"
        descrizione: "Le mura nord le tengono i mercenari di Ghoran, e lo sceriffo vuole qualcuno della città in ogni turno."
        immagine: ambientazione/ghoran
        requisiti: [rep.caserma < 4]
        quando: [pista.capomozzo >= 1]
        prova: { attributo: mentale, abilita: [percezione, natura], difficolta: Media }
        successo:
          titolo: La resina sul parapetto
          testo: |
            Ti mettono di turno con una donna dei clan che mastica resina e non
            dice una parola in tutta la notte. Verso l'alba oltre i campi si alza
            un fumo basso, e tu le dici che sono stoppie bruciate prima che lei
            metta mano alla balestra, già carica. Lei annuisce e sputa la resina
            oltre il parapetto.
          effetti: { monete: 2, rep.caserma: 0.5 }
        fallimento:
          titolo: I dadi sulle merlature
          testo: |
            Verso l'alba vedi un fumo oltre i campi e suoni la campana, ma sono stoppie
            bruciate come ogni autunno. Per tutta la mattina, quando passi sotto una torre, i
            mercenari di Ghoran imitano il suono della campana battendo un elmo con il pugno.
            Il sergente ti paga lo stesso, senza guardarti.
          effetti: { monete: 1 }

      - testo: "Fare la guardia alle celle"
        descrizione: "Borso cerca qualcuno che tenga il corridoio delle celle, mentre lui dorme seduto con la clava sulle ginocchia."
        immagine: personaggi/borso
        quando: [pista.pelle <= 3]
        prova: { attributo: mentale, abilita: [resilienza, percezione], difficolta: Facile }
        successo:
          titolo: La sedia in fondo
          testo: |
            Borso va a dormire su una sedia in fondo al corridoio, con la clava
            corta sulle ginocchia. Fai il giro degli spioncini ogni ora, e in una
            cella un ladro di galline ti racconta la sua innocenza tre volte, ogni
            volta con un dettaglio nuovo. All'alba Borso scrive qualcosa nel
            registro con la sua matita minuscola e conta due volte le monete prima
            di dartele.
          effetti: { monete: 3 }
        fallimento:
          titolo: La voce bassa
          testo: |
            Verso la terza campana ti si chiudono gli occhi, e ti sveglia la voce
            bassa di Borso che ti chiede se la sedia è comoda. Nessuno è scappato,
            ma Borso scrive una riga nel registro senza farti vedere che cosa, e
            ti paga il minimo.
          effetti: { monete: 1 }

      - testo: "Fare la guardia alle celle"
        descrizione: "Da quando Borso se n'è andato le chiavi delle celle le tiene un sergente che non conosce i detenuti."
        quando: [pista.pelle >= 4, pista.pelle <= 5]
        prova: { attributo: mentale, abilita: [resilienza, percezione], difficolta: Facile }
        successo:
          titolo: Le chiavi nuove
          testo: |
            Il sergente delle chiavi nuove ne prova tre a ogni porta prima di
            trovare quella giusta. Fai il giro con lui reggendo la lanterna e gli
            scrivi su un foglio, porta per porta, il nome del detenuto e il numero
            della chiave. All'alba lui inchioda il foglio accanto al chiodo vuoto
            dell'anello di Borso, che ha il ferro lucido come la maniglia di una
            porta di casa.
          effetti: { monete: 3 }
        fallimento:
          titolo: L'anello che non c'è
          testo: |
            Il sergente sbaglia chiave a ogni porta, e alla fine ti chiede di
            tenere la lanterna più in alto, come se la colpa fosse della luce.
            All'alba siete ancora alla terza cella, e il detenuto dentro ha smesso
            da un pezzo di fingere di dormire per godersi lo spettacolo.
          effetti: { monete: 1 }

      - testo: "Fare la guardia alle celle"
        descrizione: "In fondo al corridoio delle celle c'è un detenuto che le celle le conosce meglio del nuovo carceriere."
        immagine: personaggi/borso
        quando: [pista.pelle >= 6]
        prova: { attributo: mentale, abilita: [resilienza, percezione], difficolta: Facile }
        successo:
          titolo: Una lettera da Ghoran
          testo: |
            Nella cella in fondo al corridoio c'è Borso, con le catene ai polsi e
            il grembiule di cuoio che nessuno gli ha tolto. A metà notte ti chiama
            dallo spioncino con la voce bassa di sempre e ti chiede se è arrivata
            una lettera da Ghoran. Gli dici di no. Lui ringrazia e torna a sedersi
            sulla paglia.
          effetti: { monete: 3 }
        fallimento:
          titolo: La sedia scomoda
          testo: |
            Verso la terza campana ti si chiudono gli occhi sulla sedia, e ti
            sveglia la voce di Borso dalla cella in fondo. Ti dice di appoggiare
            la schiena al muro, perché su quella sedia ci ha dormito otto anni e
            sa da che parte cede, e la schiena ti conferma subito che ha ragione.
          effetti: { monete: 1 }

      - testo: "Ricopiare i rapporti per il furiere"
        descrizione: "I rapporti delle ronde arrivano scritti a matita, e il furiere li vuole in bella sul registro."
        prova: { attributo: mentale, abilita: [accademiche, politica-ed-economia], difficolta: Facile }
        successo:
          titolo: In bella copia
          testo: |
            Ricopi sul registro i rapporti a matita delle ronde, che trovano quasi
            sempre ubriachi addormentati sulle scale e un mulo che ogni notte
            scappa dalla stessa stalla.

            {origine allievo-di-torvessa} All'Accademia ricopiare in bella è la
            prima cosa che ti fanno fare, e la mano ritrova da sola la grafia
            degli esami.

            Il furiere controlla le tue righe con il dito e ti porge la ricevuta
            da firmare anche per quelle.
          effetti: { monete: 3 }
        fallimento:
          titolo: Il mulo sul ponte
          testo: |
            A metà pila confondi due ronde e metti il mulo fuggitivo sul Ponte dei
            Morti, dove nessun mulo è mai arrivato da solo. Il furiere raschia
            l'inchiostro con un coltellino, sospirando a ogni lettera, e la
            ricevuta te la fa firmare due volte.
          effetti: { monete: 1 }

      - testo: "Dare il cambio alla porta"
        descrizione: "Una delle due guardie del portone deve fare colazione, e qualcuno deve stare al suo posto."
        esito:
          titolo: Il portone
          testo: |
            Per un'ora prendi il posto della guardia del portone mentre lei va a
            mangiare. Passano due madri venute a chiedere dei figli in cella, e
            impari a capire da come salgono la discesa chi viene a chiedere e chi
            a denunciare. Le madri salgono piano e guardano le finestre, chi
            denuncia sale svelto e guarda te.

            {origine accolito-del-velo} Alla Cattedrale le madri salgono i gradini
            allo stesso modo.
          pe: { percezione: 2 }

      - testo: "Addestrare le reclute"
        descrizione: "Dragna Gro-Malog cerca qualcuno che tenga le reclute dei turni misti mentre lei compila i fogli."
        immagine: personaggi/dragna-gro-malog
        requisiti: [rep.caserma >= 4, rep.caserma < 6]
        prova: { attributo: fisico, abilita: [armi-da-mischia, rissa], difficolta: Media }
        successo:
          titolo: Le divise mescolate
          testo: |
            Dragna ti affida sei reclute prese per metà dalla Guardia e per metà
            dai Raschiatori, e si appoggia al muro. Le metti in coppia mescolando
            le divise e fai ripetere la stessa parata finché nessuno la sbaglia
            più. Un Raschiatore ti chiede a che cosa serva una parata da Guardia
            nei tunnel, e tu glielo fai vedere sulla sua spalla finché lui si
            massaggia il punto e annuisce.
          effetti: { monete: 5, rep.caserma: 0.5 }
        fallimento:
          titolo: La forza è controllo
          testo: |
            Per mostrare la parata scegli la recluta più grossa, e lei ti mette a
            sedere sulla ghiaia alla prima finta. Dragna ti aiuta a rialzarti con
            la mano a cui mancano due dita. «La forza è controllo» dice con la
            voce roca, e ti rimanda dal furiere a prendere la paga ridotta.
          effetti: { monete: 2 }

      - testo: "Guidare una ronda mista"
        descrizione: "Due miliziani e due Raschiatori che fra loro non si parlano, e un giro dei Ponti da fare insieme."
        requisiti: [rep.caserma >= 4, rep.caserma < 6]
        prova: { attributo: sociale, abilita: [persuasione, intimidire], difficolta: Media }
        successo:
          titolo: La cassa di pesce
          testo: |
            Al Mercato dei Nodi un banco rovescia una cassa di pesce per una lite
            sul peso, e la folla si chiude intorno ai due mercanti. Mandi i
            Raschiatori a tenere indietro la gente e i miliziani a raccogliere i
            testimoni, poi li fai scambiare a metà, perché si parlino per forza.
            Rientrando un miliziano passa la borraccia al Raschiatore accanto, che
            ne pulisce il collo con la manica, per educazione.
          effetti: { monete: 5, rep.caserma: 0.5 }
        fallimento:
          titolo: Il pesce per terra
          testo: |
            Al Mercato dei Nodi un banco rovescia una cassa di pesce, e mentre tu
            dai gli ordini i miliziani e i Raschiatori litigano su chi debba
            tenere la folla. Il pesce sparisce un po' alla volta nelle tasche dei
            passanti. Al rientro ognuno racconta la sua versione al sergente, e
            nessuna somiglia alla tua.
          effetti: { monete: 2 }

      - testo: "Mettere in fila una pratica dello sceriffo"
        descrizione: "Galdrick ha letto un mese di rapporti su un magazzino del Mercato dei Nodi, e non gli tornano."
        immagine: personaggi/toren-galdrick
        requisiti: [rep.caserma >= 4, rep.caserma < 6]
        quando: [galdrick.via == 0]
        prova: { attributo: mentale, abilita: [politica-ed-economia, accademiche], difficolta: Difficile }
        successo:
          titolo: Il giorno dopo la paga
          testo: |
            Passi due giorni al tavolo dell'ufficio a mettere i rapporti in
            colonna, data per data. Le casse spariscono sempre il giorno dopo la
            paga dei facchini, e a firmare i rapporti di quei giorni è sempre lo
            stesso Custode di Passaggio. Galdrick legge il tuo foglio muovendo le
            labbra e scrive una riga sul taccuino con una matita così corta che la
            tiene fra due polpastrelli.
          effetti: { monete: 6, rep.caserma: 0.5 }
        fallimento:
          titolo: Quello che sapeva già
          testo: |
            Alla fine porti allo sceriffo un foglio con il nome del facchino più
            povero del magazzino. Galdrick lo legge fino in fondo con i pollici
            nella cintura, e ti dice senza cattiveria che quel facchino l'ha già
            sentito due volte, e che le casse spariscono anche quando lui è a casa
            con la febbre.
          effetti: { monete: 2 }

      - testo: "Un incarico dalla lista"
        descrizione: "Galdrick ti passa un biglietto piegato in quattro con un nome e un'ora, e niente divisa."
        immagine: personaggi/toren-galdrick
        requisiti: [guarnigione.distintivo >= 1]
        quando: [galdrick.via == 0]
        prova: { attributo: sociale, abilita: [ingannare, conoscenze-della-strada], difficolta: Media }
        successo:
          titolo: Spese di servizio
          testo: |
            Passi la sera in una bettola dei Ponti senza divisa, a bere sidro
            annacquato accanto a un uomo che vende cristalli non registrati, e
            quando se ne va sai in quale magazzino li tiene. All'alba lo racconti
            allo sceriffo, e il furiere ti conta il compenso alla voce *spese di
            servizio* senza chiederti di quale servizio.
          effetti: { monete: 8, informazioni.voce: 1 }
        fallimento:
          titolo: Il secondo bicchiere
          testo: |
            L'uomo del biglietto ti guarda una volta di troppo, e prima del
            secondo bicchiere esce dalla porta sul retro. Lo segui fino al primo
            ponte e lo perdi fra i carretti, dove un mulo carico ti sbarra la
            strada. Galdrick ascolta il racconto e scrive una riga corta, e il
            furiere ti conta meno del dovuto, perché il sidro l'hai pagato tu.
          effetti: { monete: 4 }

  # ------------------------------------------------------------ storia a 2 · la ronda di notte
  - id: la-ronda-di-notte
    presso: guarnigione-di-qir-azel
    immagine: ambientazione/guarnigione-di-qir-azel
    titolo: La ronda di notte
    sommario: "Dal magazzino della Caserma sparisce un cristallo da lanterna ogni giovedì, e il furiere vuole sapere dove va."
    luogo: Guarnigione di Qir-Azel, il magazzino del furiere
    area: quartieri-alti
    requisiti: [fazione.caserma == 1]
    testo: |
      Il furiere ti aspetta alla porta del magazzino con il registro aperto, e
      ti mostra una colonna di numeri, i cristalli da lanterna consegnati alla
      ronda di notte e quelli resi esauriti. Il sergente della ronda scrive
      *esaurito* sempre con la stessa grafia tonda, e da due mesi ne manca uno
      ogni giovedì, come oggi.

      «Otto giovedì sono otto cristalli» dice il furiere. «Lo sceriffo dice che
      la cosa la guardi tu, perché i miei sergenti conoscono me e te no.»

      {origine mercante-dei-ponti} Il prezzo di un cristallo da lanterna lo sai
      a memoria, perché al Mercato dei Nodi cambia ogni settimana.

      Il sergente della ronda, Livio Mastrel, è un uomo magro con i baffi
      grigi, che tiene fra i denti una radice di liquirizia e la offre a
      chiunque. Stasera esce con quattro miliziani e due reclute dei
      Raschiatori, e ti fa posto nella fila senza domande.
    opzioni:
      - testo: "Contare le lanterne lungo il giro"
        descrizione: "Sei lanterne alla partenza. Basta guardare dove diventano cinque, o sette."
        prova: { attributo: mentale, abilita: percezione, difficolta: Media }
        successo:
          titolo: Una lanterna in più
          testo: |
            Conti le lanterne della ronda a ogni ponte. Sul Ponte dei Morti, per
            qualche minuto, la fila ne ha una di meno, perché una delle reclute
            dei Raschiatori è rimasta indietro, china sul parapetto fra le
            lanterne dei compagni perduti. Quando vi raggiunge la sua lanterna fa
            una luce gialla e fioca, mentre prima era bianca, e il sergente non le
            chiede niente.
          segue: la-lanterna-del-ponte
        fallimento:
          titolo: Le lanterne del ponte
          testo: |
            Conti le lanterne a ogni ponte, ma sul Ponte dei Morti i Raschiatori
            ne hanno appese a centinaia sopra il vuoto, e lì perdi il conto. Al
            rientro Mastrel scrive *esaurito* sul registro con la sua grafia tonda
            e ti offre un altro pezzo di liquirizia, con la gentilezza che si
            riserva ai perdenti onesti.
          effetti: { tormento: 0.5 }

      - testo: "Fare parlare Mastrel"
        descrizione: "Vent'anni di ronde di notte e una grafia tonda sul registro, e il sergente sa dove va il cristallo."
        prova: { attributo: sociale, abilita: [empatia, persuasione], difficolta: Media }
        successo:
          titolo: Vedi tu
          testo: |
            Gli chiedi di sua moglie, e lui te ne parla fino al secondo ponte. Al
            terzo gli dici che il furiere conta i giovedì, e Mastrel mastica la
            liquirizia a lungo. «Il giovedì è il giorno che suo padre è sceso nel
            Labirinto, tre anni fa» dice alla fine, indicando con il mento la
            recluta più giovane. «Io sul registro scrivo *esaurito*, e vedi tu se
            è una bugia.»
          segue: la-lanterna-del-ponte
        fallimento:
          titolo: Come gli uomini
          testo: |
            Mastrel ti ascolta masticando e ti risponde che i cristalli si
            esauriscono come gli uomini, e che lui ne ha visti esaurire parecchi.
            Poi per tutto il giro ti parla di sua moglie e delle verze che coltiva
            sul balcone, e ogni volta che provi a riportarlo sui giovedì ti
            ritrovi a parlare di concime.
          effetti: { sospetto: 0.5 }

      - testo: "Restare in coda alla fila"
        descrizione: "In fondo alla fila nessuno si volta, e se qualcuno si ferma lo vedi tu per primo."
        prova: { attributo: fisico, abilita: [furtivita, atletica], difficolta: Media }
        successo:
          titolo: Il parapetto
          testo: |
            Ti lasci scivolare in fondo alla fila. Sul Ponte dei Morti la recluta
            più giovane si ferma al parapetto, e tu ti schiacci dietro una trave.
            La vedi aprire una lanterna dei Raschiatori appesa sopra il vuoto,
            infilarci il cristallo della sua e richiudere la porticina con due
            dita, piano, come la porta di una stanza dove dorme qualcuno.
          segue: la-lanterna-del-ponte
        fallimento:
          titolo: La trave
          testo: |
            Sul Ponte dei Morti inciampi in una trave nella nebbia, che risponde
            con un rimbombo di legno vuoto. La recluta più giovane si volta di
            scatto e torna di corsa al suo posto, e per il resto del giro non si
            stacca da Mastrel di un passo. Al rientro il registro dice *esaurito*
            come tutti gli altri giovedì.
          effetti: { sospetto: 0.5 }

      - testo: "Fare la ronda per tutta la settimana"
        descrizione: "Dopo sette notti di giro chi prende il cristallo lo prenderà sotto i tuoi occhi."
        costo: 2
        esito:
          titolo: Sette notti
          testo: |
            Fai la ronda per sette notti di fila, finché il giro dei Ponti lo
            sogni anche di giorno. Il giovedì successivo, sul Ponte dei Morti, la
            recluta più giovane resta indietro, e tu sei abbastanza stanco da
            restare indietro con lei senza che nessuno ci faccia caso. La vedi
            aprire una lanterna appesa al parapetto e infilarci dentro il
            cristallo della Caserma.
          pe: { resistenza: 5 }
          segue: la-lanterna-del-ponte

  - id: la-lanterna-del-ponte
    immagine: ambientazione/ponte-dei-morti
    titolo: La lanterna sul Ponte dei Morti
    tipo: seguito
    luogo: Ponte dei Morti, a notte fonda
    area: ponti-sospesi
    requisiti: [fazione.caserma == 1]
    testo: |
      Sul Ponte dei Morti, fra le lanterne dei Raschiatori che dondolano nella
      nebbia, la recluta Linna Varo sta chiudendo la porticina di una lanterna
      dove il cristallo della Caserma brilla più bianco degli altri. Ha
      diciassette anni e i polsi ancora sottili per la mazza. Sul vetro c'è
      inciso *Ansel*, e sotto, più piccolo, *giovedì*.

      Quando ti vede si mette sull'attenti, con il mento che trema. «Mio padre
      è sceso un giovedì, tre anni fa» dice. «Al Grifone mi hanno detto che
      finché la lanterna resta accesa uno può ancora risalire. Lo so che è una
      storia da bambini, però la paga di una recluta è poca, e un cristallo
      buono costa più di una settimana di servizio.»

      {origine apprendista-raschiatore} Sulle piattaforme te l'hanno raccontata
      il primo giorno.

      Mastrel arriva dal fondo del ponte e, guardando la lanterna, si toglie la
      liquirizia di bocca.
    opzioni:
      - testo: "Riferire tutto allo sceriffo"
        descrizione: "Galdrick ti ha chiesto di guardare, e tu hai guardato. Quello che decide è affare suo."
        immagine: personaggi/toren-galdrick
        quando: [galdrick.via == 0]
        esito:
          titolo: Una voce nuova
          testo: |
            Il mattino dopo racconti tutto a Galdrick, compreso il nome inciso sul
            vetro. Lo sceriffo chiama il furiere e gli fa aprire una voce nuova
            sul registro, *Ponte dei Morti, un cristallo al giovedì*, a carico
            delle spese di servizio. «Linna Varo resta recluta» dice, «e il
            cristallo lo porta Mastrel, che firma la ricevuta.» Il furiere scrive
            senza alzare la testa, e per una volta non sospira.
          pe: { persuasione: 5 }
          imposta: { guarnigione.ronda: 1 }
          effetti: { rep.caserma: 1, fazione.caserma: 1 }

      - testo: "Portarla da Dragna"
        descrizione: "Le lanterne del Ponte dei Morti sono dei Raschiatori, e ai Raschiatori ci pensa il Ferro."
        immagine: personaggi/dragna-gro-malog
        esito:
          titolo: La veglia
          testo: |
            La sera dopo accompagni Linna al Grifone di Ferro da Dragna Gro-Malog,
            e lasci che racconti lei. Dragna ascolta, poi volta i fogli dei turni
            e scrive il nome di Linna sotto la veglia del Ponte dei Morti. «La
            veglia ha i suoi cristalli, e li paghiamo noi» dice con la voce roca.
            «La Caserma si tenga i suoi.» Linna arrossisce, e Dragna ordina un
            altro boccale anche per lei.
          pe: { empatia: 5 }
          imposta: { guarnigione.ronda: 1 }
          effetti: { rep.caserma: 1, fazione.caserma: 1 }

      - testo: "Coprirla con il furiere"
        descrizione: "Una partita di cristalli difettosi capita a tutti, basta raccontarla bene al furiere."
        prova: { attributo: sociale, abilita: [ingannare, persuasione], difficolta: Media }
        successo:
          titolo: La partita difettosa
          testo: |
            Riporti al furiere un cristallo esaurito e gli fai notare la venatura
            opaca, che hanno quasi tutti i cristalli della stessa partita, e poi
            taci. Lui lo guarda contro la luce, si convince da solo che il
            fornitore lo derubi da mesi e da quel giorno conta i cristalli
            all'arrivo. Mastrel, passandoti accanto nel cortile, ti infila in
            tasca una radice di liquirizia intera.
          imposta: { guarnigione.ronda: 1 }
          effetti: { rep.caserma: 1, informazioni.voce: 1, fazione.caserma: 1 }
        fallimento:
          titolo: La venatura
          testo: |
            Il furiere guarda la venatura contro la luce e poi guarda te. Ti dice
            senza trionfo che quella venatura è dell'ultima partita, mentre i
            cristalli spariti sono di quella prima, e alla fine gli racconti la
            verità. Due giorni dopo sulla colonna dei giovedì compare la voce
            *Ponte dei Morti*, insieme a una riga di rimprovero per te.
          imposta: { guarnigione.ronda: 1 }
          effetti: { rep.caserma: 1, sospetto: 1, fazione.caserma: 1 }

      - testo: "Pagare tu i cristalli"
        descrizione: "Il prezzo di tutti i giovedì passati, e la Caserma non ha più niente da contare."
        requisiti: [monete >= 32]
        esito:
          titolo: Il conto pari
          testo: |
            Il mattino dopo conti sul leggio del furiere il prezzo di otto
            cristalli, e lui ti fa firmare una ricevuta alla voce *cristalli,
            rimborso* senza chiederti per conto di chi. Linna lo viene a sapere da
            Mastrel, e per una settimana ti saluta nel cortile come si fa con i
            sergenti. Il giovedì dopo la lanterna sul ponte è ancora accesa, e il
            cristallo dentro è bianco.
          pe: { galateo: 5 }
          imposta: { guarnigione.ronda: 1 }
          effetti: { rep.caserma: 1, monete: -32, fazione.caserma: 1 }

  # ------------------------------------------------------------ storia a 4 · i trenta di Ghoran
  - id: i-trenta-di-ghoran
    presso: guarnigione-di-qir-azel
    immagine: ambientazione/ghoran
    titolo: I trenta di Ghoran
    sommario: "I mercenari di Ghoran aspettano armati sotto il portico, e dall'altra parte del cortile aspetta la Guardia."
    luogo: Guarnigione di Qir-Azel, il cortile
    area: quartieri-alti
    requisiti: [fazione.caserma == 9, bivio.legge == 1, pista.capomozzo >= 1]
    testo: |
      Nel cortile della Caserma i mercenari di Ghoran stanno sotto il portico con le
      armi addosso, e dall'altra parte una dozzina di miliziani tiene il mantello
      scarlatto aperto sull'elsa.

      Il motivo è in cella. Mardek, un ragazzo con le orecchie piene di anelli di rame,
      ieri al Mercato dei Nodi ha preso un prosciutto lasciando al posto delle monete
      un gettone d'argilla con un segno inciso.

      Per i mercenari parla Hagra, che ha tre righe di argilla secca sulla faccia e
      mastica resina. «A Ghoran il gettone vale come la moneta, eh. Il clan paga quando
      torna. Qui la paga non la vediamo da due settimane, e per un prosciutto ci
      chiudono in cella.»

      {origine fuggiasco-di-ghoran} Quando Hagra dice Ghoran ti si piegano le dita
      verso il palmo.

      Lo sceriffo è in Municipio fino a sera, e il furiere ti guarda come si guarda una
      scala durante un incendio.
    opzioni:
      - testo: "Esaminare il gettone"
        descrizione: "Il gettone d'argilla è sul leggio del furiere, accanto al registro dove i trenta hanno firmato l'ingaggio."
        prova: { attributo: mentale, abilita: [politica-ed-economia, percezione], difficolta: Media }
        successo:
          titolo: Il segno del clan
          testo: |
            Il segno sul gettone è una mano aperta con tre dita. Nel registro
            dell'ingaggio la mano con tre dita la trovi cinque volte, compreso
            Mardek. In fondo alla pagina il furiere stesso ha scritto che la
            Caserma risponde dei debiti contratti in servizio. Il furiere
            riconosce la propria grafia e paga il prosciutto, scalandolo dalla
            paga di Mardek, che esce dalla cella.
          imposta: { guarnigione.mercenari: 1 }
          effetti: { rep.caserma: 1, fazione.caserma: 1 }
        fallimento:
          titolo: Uno sgorbio
          testo: |
            Giri il gettone fra le dita e il segno inciso ti sembra uno sgorbio
            qualsiasi. Lo dici, e sotto il portico qualcuno lo traduce agli altri
            nella lingua dei clan. Hagra si riprende il gettone dalla tua mano
            senza chiedere e se lo infila nello stivale, e i mercenari restano
            sotto il portico per tutta la mattina.
          effetti: { scandalo: 0.5 }

      - testo: "Mettere d'accordo Hagra e il sergente"
        descrizione: "Il sergente vuole un colpevole e Hagra vuole Mardek fuori, e qualcuno deve trovare il modo."
        prova: { attributo: sociale, abilita: [persuasione, empatia], difficolta: Media }
        successo:
          titolo: Il banco del prosciutto
          testo: |
            Porti il sergente e Hagra in mezzo al cortile, lontano dalla loro
            gente, e proponi che Mardek esca oggi e serva al banco del mercante
            finché il prosciutto non è pagato. Il sergente vuole una settimana,
            Hagra dice che a Ghoran per un prosciutto basta un giorno, e vi
            accordate su tre. Quando i miliziani chiudono i mantelli, sotto il
            portico qualcuno ricomincia a ridere.
          imposta: { guarnigione.mercenari: 1 }
          effetti: { rep.caserma: 1, fazione.caserma: 1 }
        fallimento:
          titolo: Tutti e due contro
          testo: |
            Proponi di dividere la colpa a metà, e per la prima volta in tutta la
            mattina il sergente e Hagra sono d'accordo, contro di te. Lui ti
            ricorda che la Guardia non tratta con chi ruba, lei che non tratta con
            chi non paga, e tornano ciascuno dalla sua parte del cortile.
          effetti: { scandalo: 0.5 }

      - testo: "Accettare la sfida di Hagra"
        descrizione: "A Ghoran una lite si chiude nel fango, e vince chi mette l'altro con la schiena per terra."
        prova: { attributo: fisico, abilita: [rissa, atletica], difficolta: Media }
        successo:
          titolo: La schiena sulla ghiaia
          testo: |
            Hagra si toglie la cintura con il coltello e ti gira intorno due volte
            prima di prenderti alla vita, tirando forte. Ti lasci tirare, poi
            ruoti sul piede portandola giù con te, e lei finisce con la schiena
            sulla ghiaia. «Eh» dice, e si mette a ridere, e Mardek esce dalla
            cella prima di mezzogiorno.
          imposta: { guarnigione.mercenari: 1 }
          effetti: { rep.caserma: 1, fazione.caserma: 1 }
        fallimento:
          titolo: Nel fango di Ghoran
          testo: |
            Hagra ti prende alla vita e tu fai l'errore di spingere, e ti ritrovi
            con la schiena sulla ghiaia mentre i mercenari battono le lance per
            terra. Lei ti aiuta a rialzarti e ti dice che a Ghoran adesso il
            prosciutto sarebbe suo. Qui però siamo a Qir-Azel, aggiunge
            allacciandosi la cintura, e la cella resta chiusa.
          effetti: { ferite: 0.5 }

      - testo: "Pagare il prosciutto di tasca tua"
        descrizione: "Paghi il prosciutto al mercante, e il gettone di Mardek resta a te."
        requisiti: [monete >= 12]
        esito:
          titolo: Il gettone d'argilla
          testo: |
            Scendi al Mercato dei Nodi con il furiere e paghi il mercante, che
            firma una ricevuta per la Caserma. Mardek sale le scale delle celle
            sbattendo gli occhi alla luce, con gli anelli di rame che tintinnano,
            e quando Hagra gli dice chi ha pagato viene da te e ti mette in mano
            il gettone d'argilla. «Tienilo, eh, il clan paga quando torna» dice,
            con l'accento dei clan.
          pe: { galateo: 5 }
          imposta: { guarnigione.mercenari: 1 }
          effetti: { rep.caserma: 1, monete: -12, fazione.caserma: 1 }

      - testo: "Aspettare lo sceriffo"
        descrizione: "Galdrick torna dal Municipio a sera. Fino ad allora qualcuno deve stare in mezzo al cortile."
        quando: [pista.pelle < 6]
        costo: 2
        esito:
          titolo: Fino a sera
          testo: |
            Passi la giornata a fare avanti e indietro nel cortile con l'acqua e
            il pane, finché tutti mangiano dalla stessa cesta. Galdrick rientra al
            tramonto e ascolta Hagra e poi il sergente, con i pollici nella
            cintura. «La paga arriva domani dal Consiglio» dice, «e Mardek lavora
            al banco finché il prosciutto è pagato.» Poi ti fa un cenno con il
            mento, per dirti che il cortile l'hai tenuto tu.
          pe: { resilienza: 5 }
          imposta: { guarnigione.mercenari: 1 }
          effetti: { rep.caserma: 1, fazione.caserma: 1 }

      - testo: "Aspettare lo sceriffo"
        descrizione: "Galdrick torna a sera con il fianco ancora fasciato, e fino ad allora qualcuno deve tenere il cortile."
        quando: [pista.pelle >= 6]
        costo: 2
        esito:
          titolo: Il gradino
          testo: |
            Passi la giornata in mezzo al cortile con l'acqua e il pane. Galdrick
            rientra al tramonto con una mano sul fianco, e invece di salire
            nell'ufficio si siede sul gradino del portico, in mezzo ai mercenari
            che la notte della Pignatta erano con lui. «La paga arriva domani»
            dice, «e Mardek lavora al banco finché il prosciutto è pagato.» Resta
            seduto anche dopo che se ne sono andati tutti.
          pe: { resilienza: 5 }
          imposta: { guarnigione.mercenari: 1 }
          effetti: { rep.caserma: 1, fazione.caserma: 1 }

      - testo: "Dire a Hagra da dove vieni"
        descrizione: "A Ghoran i gettoni dei clan passavano sopra la bilancia del mercato, quella da cui sei sceso tu."
        quando: [origine.fuggiasco-di-ghoran >= 1]
        prova: { attributo: sociale, abilita: [intimidire, empatia], difficolta: Media }
        successo:
          titolo: La riga sul polso
          testo: |
            Mostri a Hagra il polso, dove la corda dei recinti ha lasciato una
            riga chiara, e lei smette di masticare. Dici al furiere che a Ghoran
            il gettone di quel clan vale quanto la moneta e che il clan paga
            sempre, anche ai mercanti di schiavi. Hagra ordina ai suoi di posare
            le lance. «E tu, eh, ai miei non dire da dove vieni» ti dice piano.
          pe: { intimidire: 5 }
          imposta: { guarnigione.mercenari: 1 }
          effetti: { rep.caserma: 1, fazione.caserma: 1 }
        fallimento:
          titolo: Gli occhi sulla ghiaia
          testo: |
            Cominci a parlare di Ghoran, e a metà della prima frase ti accorgi di
            avere le spalle curve e gli occhi sulla ghiaia, come quando passavano i
            sorveglianti. Hagra se ne accorge prima di te e ride, e i suoi ridono con
            lei. Il cortile resta diviso in due fino a sera, con te in mezzo e la
            schiena che non vuole raddrizzarsi.
          effetti: { tormento: 0.5 }

  # ------------------------------------------------------------ storia a 6 · la lista dello sceriffo
  - id: la-lista-dello-sceriffo
    presso: guarnigione-di-qir-azel
    immagine: personaggi/toren-galdrick
    titolo: La lista dello sceriffo
    sommario: "Galdrick ti fa chiamare a sera, chiude la porta dell'ufficio a chiave e tira fuori il taccuino."
    luogo: Guarnigione di Qir-Azel, l'ufficio dello sceriffo, a sera
    area: quartieri-alti
    requisiti: [fazione.caserma == 8, bivio.legge != 2, galdrick.via == 0]
    testo: |
      Galdrick ti fa chiamare a sera, quando il cortile è vuoto e il furiere ha
      già chiuso il magazzino con le sue due mandate. Sul tavolo dell'ufficio
      c'è una lampada sola, e sul calendario appeso al muro i giorni passati
      sono barrati con righe dritte, tutte della stessa lunghezza. Lo sceriffo
      chiude la porta, ci gira la chiave e resta in piedi.

      Dalla tasca interna della divisa tira fuori il taccuino e lo apre alle
      ultime pagine, dove c'è una colonna di una dozzina di nomi, ognuno con
      una data accanto. «Questa lista l'ho cominciata due anni fa» dice. «Sono
      vice-sceriffi. Nessuno li ha mai visti in divisa, e la paga gliela conto
      io di persona. Vanno dove la Guardia non può andare senza farsi vedere.»

      {politica-ed-economia Difficile} Una paga che non passa dal registro del
      furiere esce da una tasca o da una cassa che il Municipio non controlla.

      Batte la matita corta sullo spazio bianco sotto l'ultimo nome. «Qui ci
      starebbe il tuo. Prima però voglio vederti lavorare una sera come
      lavorano loro, senza la divisa addosso e senza di me. Stanotte ho tre
      cose da fare, e me ne basta una.»

      *Quest'uomo non si fida di nessuno, e ti sta mostrando la sua lista.*
      Pianti bene i piedi sul pavimento, come prima di un salto.
    opzioni:
      - testo: "Leggere i tre rapporti"
        descrizione: "Tre rapporti di ronda sulla stessa notte, e uno l'ha scritto chi non c'era."
        prova: { attributo: mentale, abilita: [percezione, accademiche], difficolta: Media }
        successo:
          titolo: La pioggia
          testo: |
            I tre rapporti raccontano la stessa notte sui Ponti, con gli stessi
            orari e gli stessi nomi. Due hanno la carta ondulata e l'inchiostro
            sbavato, mentre il terzo è asciutto e liscio, anche se quella notte è
            piovuto. Metti il dito sul terzo, e Galdrick ti mostra la firma, di un
            miliziano rimasto a casa con la febbre. «Lo sapevo, e volevo sapere se
            lo vedevi anche tu» dice.
          segue: il-nome-nella-lista
        fallimento:
          titolo: Il rapporto sbagliato
          testo: |
            Leggi i tre rapporti due volte e scegli quello con più errori di
            grammatica. Galdrick scuote la testa piano, perché quello l'ha scritto
            un sergente che sa leggere a fatica e c'era, mentre il falso è scritto
            meglio degli altri due. Rimette i fogli nel cassetto e ti dice che la
            lista aspetta.
          effetti: { scandalo: 0.5 }

      - testo: "Interrogare il detenuto della cella sei"
        descrizione: "Un ricettatore dei Ponti sa dove è finita una cassa di armi della Caserma, anche se giura il contrario."
        prova: { attributo: sociale, abilita: [empatia, intimidire], difficolta: Media }
        successo:
          titolo: La cella sei
          testo: |
            Il ricettatore ti aspetta seduto sulla paglia, e la sua storia l'ha
            già raccontata a tre sergenti. Gli chiedi di sua figlia, che ogni
            mattina gli porta il pane al portone, e lui ne parla con le mani,
            misurando nell'aria quanto è cresciuta. Dopo un po' ti dice il nome
            del magazzino e quello del barcaiolo che ha portato la cassa, e
            Galdrick, dalla porta, lo scrive sul taccuino.
          segue: il-nome-nella-lista
        fallimento:
          titolo: Tre sergenti
          testo: |
            Il ricettatore ti risponde parola per parola con la stessa storia che
            ha raccontato ai sergenti, e quando alzi la voce si stende sulla
            paglia e chiude gli occhi. Sulle scale Galdrick ti dice che con lui ci
            sono voluti tre mesi, e che la lista aspetta. Dalla cella sei arriva
            un russare tranquillo e un po' teatrale.
          effetti: { scandalo: 0.5 }

      - testo: "Seguire il corriere fino ai Ponti"
        descrizione: "Ogni sera un ragazzo esce dalle cucine della Caserma con una lettera, e Galdrick vuole sapere per chi."
        prova: { attributo: fisico, abilita: [furtivita, atletica], difficolta: Media }
        successo:
          titolo: La porta delle cucine
          testo: |
            Il ragazzo esce dalla porta delle cucine dopo la seconda campana e
            prende la discesa dei Ponti a passo svelto, senza voltarsi. Lo segui a
            distanza di due lanterne e lo vedi consegnare la lettera a un facchino
            del Mercato dei Nodi, che la legge alla luce della lanterna e poi la
            brucia. Torni da Galdrick con il nome del facchino, e lui lo scrive
            sotto quello del ragazzo.
          segue: il-nome-nella-lista
        fallimento:
          titolo: Due lanterne
          testo: |
            Sul primo ponte il ragazzo si ferma di colpo ad allacciarsi uno stivale, e tu sei troppo vicino per
            fermarti anche tu. Lui ti guarda passare e torna verso la Caserma fischiettando un motivo da osteria.
            Galdrick ti aspetta sul portone e ti dice che stanotte il ragazzo resterà in cucina, e che la lista
            aspetta.
          effetti: { sospetto: 0.5 }

      - testo: "Lasciare parlare il taccuino"
        descrizione: "Il taccuino di Galdrick ha una riga per ogni volta che sei passato da questo ufficio."
        costo: 2
        esito:
          titolo: Tutte le righe
          testo: |
            Gli chiedi di leggerti quello che ha scritto su di te, e lui si gratta
            la testa rasata prima di sedersi. Legge ad alta voce, per tutta la
            notte, ogni riga con la sua data, e quelle più gentili di quanto ti
            aspettavi fanno più male delle altre. All'alba chiude il taccuino e
            dice che una sera di lavoro non gli avrebbe detto niente di più.
          pe: { resilienza: 5 }
          segue: il-nome-nella-lista

      - testo: "Chiedergli perché adesso"
        descrizione: "Una lista che tiene da due anni, e il tuo nome proprio stasera."
        quando: [pista.pelle < 6]
        costo: 0
        esito:
          titolo: Un quarto
          testo: |
            «Perché un quarto dei miei prende la paga di Vesh, e non so quale
            quarto» dice. «Quelli della lista li ho scelti uno per uno fuori dalla
            Caserma, e nessuno di loro conosce gli altri.» Si gira verso la
            finestra. «E perché in questi mesi tu sei andato dove io potevo
            mandare soltanto qualcuno di fuori, e ne sei sempre tornato.»

      - testo: "Chiedergli perché adesso"
        descrizione: "Vesh è morto, e la lista era cominciata per lui."
        quando: [pista.pelle >= 6]
        costo: 0
        esito:
          titolo: Dopo Vesh
          testo: |
            Galdrick si siede piano, con una mano sul fianco, e per un po' guarda
            la lampada. «La lista l'ho cominciata per Vesh, e adesso Vesh è morto»
            dice alla fine. «In Città Bassa chi faceva i conti per lui adesso li
            fa per sé, e a me serve una ragione per alzarmi la mattina che non sia
            lui.» Nella lista vuole gente capace di lavorare anche senza un nemico
            davanti.

      - testo: "Chiedergli di Gaia Acari"
        descrizione: "Hai capito per chi lavora davvero Gaia Acari, la ragazzina con il cappuccio blu della Città Bassa."
        immagine: personaggi/gaia-acari
        quando: [gaia >= 2]
        costo: 0
        esito:
          titolo: Fuori dalla lista
          testo: |
            Galdrick chiude il taccuino prima di rispondere. «Gaia Acari nella
            lista non c'è, e non ci sarà mai» dice. «Ha tredici anni, quello che
            fa l'ha deciso lei e io non sono riuscito a farle cambiare idea. Le
            devo una cosa che risale a Ghoran, e che cosa sia resta fra me e lei.»
            Ti chiede, se la incontri, di offrirle da mangiare senza farle
            domande.

      - testo: "Chiedergli di Fulvio Saldo"
        descrizione: "Il miliziano con la tosse è in cella, e il tuo rapporto è sul tavolo dello sceriffo."
        quando: [caserma.saldo == 1]
        costo: 0
        esito:
          titolo: Le celle
          testo: |
            Galdrick apre il cassetto e tira fuori il tuo rapporto, annotato a
            matita. «Fulvio Saldo resta dentro finché non trovo chi gli dava i
            soldi» dice. «Sua moglie viene al portone ogni mattina con il pane, e
            Brina dalla casa blu le manda la zuppa per i bambini. Per la Caserma
            hai fatto bene, ma quella famiglia la paga cara, e qui ci sono scritte
            tutte e due le cose.»

      - testo: "Chiedergli di Fulvio Saldo"
        descrizione: "Hai lasciato Fulvio Saldo in servizio perché ti riferisca quello che gli chiedono."
        quando: [caserma.saldo == 2]
        costo: 0
        esito:
          titolo: Un uomo girato
          testo: |
            «Un uomo girato ha già cambiato padrone una volta» dice Galdrick,
            guardando la lampada. «Un giorno qualcuno gli rifà la stessa offerta
            che gli hai fatto tu. Lo tengo ai turni di giorno dove si vede, e tu
            tienilo d'occhio di notte.» Sul taccuino, accanto al nome di Fulvio,
            c'è un punto interrogativo fatto con cura.

      - testo: "Chiedergli di Fulvio Saldo"
        descrizione: "Hai pagato tu il debito di Fulvio Saldo, e lo sceriffo l'ha saputo dal furiere."
        quando: [caserma.saldo == 3]
        costo: 0
        esito:
          titolo: La ricevuta
          testo: |
            Galdrick tira fuori dal taccuino la ricevuta del debito di Fulvio,
            firmata da uno degli Scuri con una croce. «Me l'ha portata la moglie»
            dice. «Voleva sapere a chi doveva i soldi adesso. Le ho detto che non
            li deve a nessuno, e spero di non averle mentito.» Ti guarda, e
            aspetta che tu glielo confermi.

      - testo: "Chiedergli del Cucitore"
        descrizione: "In città lo chiamano l'uomo che fermò il Cucitore. Lui non l'ha mai detto."
        immagine: ambientazione/evento-notti-cucite-145
        costo: 0
        esito:
          titolo: La spada nella teca
          testo: |
            Galdrick ti guarda come se gli avessi chiesto l'ora a un funerale. «Ivo
            Carstan è morto in un vicolo della Città Bassa, e io sono arrivato
            dopo» dice. «Il resto lo racconta la città, e la città racconta quello
            che le serve.» Poi riapre il taccuino e ti chiede, con la stessa voce
            di prima, se hai già deciso quale delle tre cose fare stanotte.

      - testo: "Dirgli che non è il momento"
        descrizione: "Una lista segreta è un impegno senza divisa e senza nome, e puoi dirgli di aspettare."
        costo: 0
        esito:
          titolo: Lo spazio bianco
          testo: |
            Gli dici che per adesso preferisci lavorare per la Caserma alla luce
            del giorno. Galdrick annuisce una volta e rimette il taccuino nella
            tasca della divisa. «Lo spazio bianco resta» dice, e ti accompagna
            fino al portone con la lampada in mano, facendoti luce sui gradini uno
            per uno, come si fa con un ospite.

  - id: il-nome-nella-lista
    immagine: personaggi/toren-galdrick
    titolo: Il nome nella lista
    tipo: seguito
    luogo: Guarnigione di Qir-Azel, l'ufficio dello sceriffo, all'alba
    area: quartieri-alti
    requisiti: [fazione.caserma == 8, bivio.legge != 2]
    testo: |
      Quando torni nell'ufficio la lampada è quasi consumata e dalla finestra
      entra la prima luce grigia. Galdrick non ha dormito, e ha la divisa
      slacciata al collo e il taccuino aperto all'ultima pagina, con la
      matita corta appoggiata di traverso sullo spazio bianco.

      «Nella lista nessuno ha il suo nome vero» dice, girando il taccuino
      verso di te. «Scegline uno che ti ricordi, perché se un giorno qualcuno
      legge questa pagina non deve arrivare a te. Niente divisa e niente paga
      dal furiere, se non alla voce spese di servizio. Se ti prendono io non
      ti ho mai visto, e lo dico adesso perché dopo non potrò dirlo. Quando
      ti serve la Caserma, la Caserma c'è.»

      Ti porge la matita, corta come un dito e consumata dalla parte del
      pollice, con i segni dei suoi denti vicino alla punta.

      {ingannare Media} Un nome falso regge se è noioso, come quello di un
      cugino di campagna per cui nessuno si volterebbe due volte.

      *Con questa matita ha scritto ogni riga su di te.* La prendi, e le tue
      dita la tengono già dalla parte consumata.
    opzioni:
      - testo: "Scrivere un nome e firmare"
        descrizione: "Un nome falso nella lista dello sceriffo, e una paga che non passa dal registro."
        quando: [pista.pelle < 6, fazione.scuri < 1]
        esito:
          titolo: Per motivi di servizio
          testo: |
            Scrivi il nome che hai scelto, e Galdrick ci mette accanto la data e
            rimette il taccuino nella tasca interna. «Di notte, se in Caserma non
            mi trovi, lascia detto alla Maison des Lunes, a Sara Beck» dice. «Per
            motivi di servizio.» Sulla porta del magazzino il furiere ti aspetta
            con una giubba di cuoio senza mostrine e la borsa per le spese di
            servizio della prima settimana.
          imposta: { guarnigione.distintivo: 1, bivio.legge: 1 }
          effetti: { rep.caserma: 1, fazione.caserma: 1, oggetto.caserma-giubba-senza-mostrine: 1, monete: 40 }
          almeno: { rep.caserma: 6 }

      - testo: "Scrivere un nome e firmare"
        descrizione: "Un nome falso nella lista, sotto quelli che c'erano la notte della Pignatta."
        quando: [pista.pelle >= 6, fazione.scuri < 1]
        esito:
          titolo: Due righe dritte
          testo: |
            Due nomi della lista sono barrati, accanto alla data della notte della
            Pignatta. «Le loro vedove le pago ancora io» dice Galdrick, «e con la
            stessa matita.» Scrivi il nome, lui ci mette la data e ti dice di
            lasciare detto alla Maison des Lunes, a Sara Beck, se di notte non lo
            trovi. Fuori il furiere ti aspetta con la giubba senza mostrine e la
            borsa delle spese.
          imposta: { guarnigione.distintivo: 1, bivio.legge: 1 }
          effetti: { rep.caserma: 1, fazione.caserma: 1, oggetto.caserma-giubba-senza-mostrine: 1, monete: 40 }
          almeno: { rep.caserma: 6 }

      - testo: "Scrivere un nome e firmare"
        descrizione: "Un nome falso nella lista dello sceriffo, e con gli Scuri hai già chiuso."
        quando: [fazione.scuri >= 1, bivio.legge == 1]
        esito:
          titolo: Una riga chiusa
          testo: |
            Galdrick sfoglia il taccuino fino alle tue sere al tavolo degli Scuri,
            chiuse da una riga dritta tirata con il righello. «Questa l'ho chiusa
            io quando l'hai chiusa tu» dice. «Adesso scrivi, e di notte, se non mi
            trovi, lascia detto alla Maison des Lunes, a Sara Beck.» Sulla porta
            del magazzino il furiere ti aspetta con la giubba senza mostrine e la
            borsa delle spese.
          imposta: { guarnigione.distintivo: 1, bivio.legge: 1 }
          effetti: { rep.caserma: 1, fazione.caserma: 1, oggetto.caserma-giubba-senza-mostrine: 1, monete: 40 }
          almeno: { rep.caserma: 6 }

      - testo: "Chiudere con gli Scuri e scrivere il nome"
        descrizione: "Nella lista non si sta con un piede fra gli Scuri e uno in Caserma."
        immagine: fazioni/scuri
        quando: [fazione.scuri >= 1, bivio.legge == 0]
        esito:
          titolo: La riga dritta
          testo: |
            Le tue sere con gli Scuri sono tutte lì, una per riga, ognuna con l'ora
            accanto alla data. Gli dici che hai chiuso, e Galdrick tira con il righello
            una riga dritta sotto l'ultima sera, senza fretta. Poi ti dà la matita e
            scrivi il nome che hai scelto. Fuori il furiere ti aspetta con la giubba
            senza mostrine e la borsa delle spese.
          imposta: { guarnigione.distintivo: 1, bivio.legge: 1 }
          effetti: { rep.caserma: 1, fazione.caserma: 1, oggetto.caserma-giubba-senza-mostrine: 1, monete: 40, rep.scuri: -2 }
          almeno: { rep.caserma: 6 }

      - testo: "Rendergli la matita e restare con gli Scuri"
        descrizione: "Il tavolo d'angolo degli Scuri è un posto dove ti aspettano, e una volta scelto non si torna indietro."
        immagine: fazioni/scuri
        quando: [fazione.scuri >= 1, bivio.legge == 0]
        esito:
          titolo: Lo spazio bianco
          testo: |
            Posi la matita sul tavolo, accanto alla tazza fredda. Galdrick la
            guarda a lungo senza toccarla, poi chiude il taccuino con la matita
            fuori. «Allora i tuoi turni li fa un altro, e il mantello tienilo, che
            i turni li hai fatti» dice, senza alzare gli occhi. Sulle scale ti
            accorgi che non ti ha accompagnato con la lampada, e che i gradini, al
            buio, sono più di quanti ricordassi.
          imposta: { bivio.legge: 2 }
          effetti: { rep.caserma: -2 }

      - testo: "Rendergli la matita"
        descrizione: "Per adesso preferisci restare fuori dal taccuino, e la prova si rifà."
        esito:
          titolo: La matita corta
          testo: |
            Gli rendi la matita senza scrivere niente. Galdrick la rimette dentro
            il taccuino a fare da segno, proprio sullo spazio bianco, e lo chiude.
            «Quando torni, una sera di lavoro te la chiedo di nuovo» dice, e va
            alla finestra a guardare il primo turno, con la matita che sporge dal
            taccuino come un dito alzato per chiedere la parola.

  # ------------------------------------------------------------ la carta
  - id: carta-un-miliziano-in-difficolta
    immagine: ambientazione/citta-bassa
    titolo: L'elmo sul tetto
    sommario: "Un miliziano guarda in su da un cortile della Città Bassa, e il suo elmo è sul tetto."
    luogo: Città Bassa, un cortile fra i panni stesi
    tipo: carta
    area: citta-bassa
    requisiti: [rep.caserma < 2]
    testo: |
      Fra i panni stesi di un cortile un miliziano giovanissimo guarda in su.
      Il suo elmo è incastrato fra due tegole, e sul colmo del tetto tre
      ragazzini scalzi gli fanno il verso, uno con il cappuccio di maglia del
      miliziano calato fino al naso. Il miliziano ti spiega che senza elmo il
      sergente gli toglie una settimana di paga, mentre da una finestra una
      donna ride tanto da lasciar cadere il tappeto che sbatteva.

      {origine figlio-della-citta-bassa} Su tetti come quello hai passato
      mezza infanzia, e un poco tifi ancora per i ragazzini.
    opzioni:
      - testo: "Salire sul tetto"
        descrizione: "Dalla grondaia al davanzale, e poi sulle tegole della Città Bassa, che reggono quando vogliono loro."
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Facile }
        successo:
          titolo: Il colmo del tetto
          testo: |
            Sali dalla grondaia al davanzale e dal davanzale alle tegole, e i
            ragazzini scappano dall'altra parte del colmo. L'elmo viene via con
            una tegola attaccata. Il miliziano se lo infila in testa ancora sporco
            di muschio e ti ringrazia tre volte, una per ogni ragazzino, e
            promette di fare il tuo nome al sergente, perché in Caserma un favore
            si mette per iscritto.
          effetti: { rep.caserma: 0.5 }
        fallimento:
          titolo: La tegola
          testo: |
            A metà grondaia una tegola ti resta in mano, e scivoli giù fino al
            tappeto caduto nel cortile, che almeno attutisce. I ragazzini ridono
            così tanto che uno di loro fa cadere l'elmo dal tetto da solo, e il
            miliziano lo raccoglie e ti aiuta a rialzarti, più imbarazzato di te.
          effetti: { ferite: 0.5 }

      - testo: "Comprare l'elmo ai ragazzini"
        descrizione: "In Città Bassa ogni cosa ha il suo prezzo, anche un elmo sul tetto sbagliato."
        requisiti: [monete >= 2]
        esito:
          titolo: Il prezzo del cappuccio
          testo: |
            Mostri qualche moneta al ragazzino con il cappuccio di maglia, e lui tira sul prezzo con la serietà di un
            mercante finché non fai per rimetterla in tasca. L'elmo arriva giù rotolando lungo le tegole, e il cappuccio
            subito dopo. Il miliziano li raccoglie, rosso fino al collo, e ti promette che al posto di guardia farà il tuo
            nome al sergente.
          effetti: { monete: -2, rep.caserma: 0.5 }

      - testo: "Tirare dritto"
        descrizione: "Gli elmi della Caserma sono affare della Caserma."
        costo: 0
        esito:
          titolo: Fra i panni stesi
          testo: |
            Passi oltre fra i panni stesi, con un lenzuolo bagnato che ti scivola
            sulla nuca. In fondo al cortile senti i ragazzini attaccare una
            filastrocca sul miliziano senza testa, e lui resta sotto la grondaia a
            guardare in su.
