# La città viva, luogo 6: la Guarnigione di Qir-Azel (presso: guarnigione-di-qir-azel, area quartieri-alti).
# L'attività delle pattuglie, le tre storie di rep.caserma (2 la ronda di notte, con il seguito sul Ponte dei
# Morti; 4 i trenta di Ghoran; 6 la lista dello sceriffo, con il seguito del nome nella lista) e la carta del
# miliziano. Galdrick è a Ghoran dal congedo delle tribù alla fine di Acciaio e Ira (`galdrick.via == 1`): le
# scene che lo vogliono in ufficio chiedono `galdrick.via == 0` (requisiti o `quando`). Il servizio del luogo sono le pattuglie stesse: la paga del furiere e, con il distintivo, gli
# incarichi dalla lista.
# Reputazione: le storie la portano a 3, 5 e 7; le ronde (Ponti, Città Bassa, mura) la fanno salire fino a 4, e
# le reclute, la ronda mista e le pratiche dello sceriffo (fisico, sociale, mentale) fino a 6.
# Stato del mondo: i mercenari di Ghoran dopo pista.capomozzo >= 1; Borso carceriere fino a pista.pelle 3, poi
# fuggito, e dopo pista.pelle >= 6 in catene in fondo alle celle; Vesh morto e Galdrick ferito dopo pista.pelle 6.
# Nomi nuovi, che il Codex non dà: il sergente Livio Mastrel, la recluta Linna Varo (e il padre Ansel), il
# mercenario Mardek. Hagra è la guida di capomozzo-1.yaml.
storylet:
  # ------------------------------------------------------------ l'attività ripetibile
  - id: le-pattuglie
    presso: guarnigione-di-qir-azel
    immagine: ambientazione/guarnigione-di-qir-azel
    titolo: Le pattuglie
    sommario: "All'alba il furiere della Caserma consegna le lanterne alle ronde, e un paio di braccia in più non le rimanda mai indietro."
    luogo: Guarnigione di Qir-Azel, il cortile
    area: quartieri-alti
    ripetibile: true
    testo: |
      All'alba il cortile della Caserma è già pieno, e il primo rumore che
      senti passando il portone è quello dei manichini di paglia colpiti a
      tempo, con il sergente d'addestramento che conta ad alta voce e
      ricomincia da uno ogni volta che una recluta sbaglia. Sotto il portico
      c'è la tavola dei turni, una lavagna lunga quanto il muro dove la Guardia
      e i Raschiatori scrivono i nomi con lo stesso gesso. Accanto a un nome
      qualcuno ha scritto *malato*, e sotto, con un'altra mano, *al Grifone*.

      I miliziani escono a coppie con il mantello scarlatto piegato sul
      braccio, e lo indossano soltanto sul portone. Il furiere sta alla porta
      del magazzino con il registro aperto su un leggio, e a ciascuno consegna
      una lanterna insieme alla ricevuta da firmare. Chi non sa scrivere firma
      con il pollice, e il furiere soffia sull'inchiostro prima di voltare
      pagina.

      La finestra dell'ufficio dello sceriffo dà sul cortile dal primo piano.
      Quando è in città Galdrick ci si affaccia con i pollici nella cintura
      a guardarlo, come si guarda un orologio da cui si aspetta l'ora giusta.
      *Qui dentro ha una ricevuta perfino la paglia dei manichini.* Da quando hai passato il portone, senza volerlo, tieni la
      schiena più dritta del solito.
    opzioni:
      - testo: "Uscire di ronda sui Ponti"
        descrizione: "Il giro lungo dei Ponti Sospesi, da un gabbiotto all'altro, a passo di Raschiatore."
        immagine: ambientazione/ponti-sospesi
        requisiti: [rep.caserma < 4]
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Media }
        successo:
          titolo: Il giro lungo
          testo: |
            Il sergente ti mette in coppia con un Raschiatore anziano che
            cammina sulle assi più svelto di te e non guarda mai in basso. Fate
            il giro lungo dal Ponte delle Mille Corde fino al Ponte dei Morti e
            ritorno, e a ogni gabbiotto dei Custodi di Passaggio lui batte due
            colpi sulla porta e tira dritto. A mezzogiorno hai i polpacci duri
            come legno. Il furiere ti conta la paga del turno e ti fa firmare
            per la lanterna, che non avete mai acceso.
          effetti: { monete: 2, rep.caserma: 0.5 }
        fallimento:
          titolo: Il fiato corto
          testo: |
            Il Raschiatore con cui ti mettono in coppia cammina sui Ponti come
            se fossero in piano, e a metà giro ti lascia indietro di un ponte
            intero. Lo ritrovi seduto su una bitta ad aspettarti, senza fretta.
            Sul registro il furiere scrive l'ora del vostro rientro e ci mette
            accanto un punto, che nel suo alfabeto vale un rimprovero, e poi ti
            paga lo stesso, con gli spiccioli del cassetto.
          effetti: { monete: 1 }

      - testo: "Scendere di ronda in Città Bassa"
        descrizione: "La Guardia passa in Città Bassa di rado e mai a sorpresa. Chi conosce le strade sa dove fermarsi e dove tirare dritto."
        immagine: ambientazione/citta-bassa
        requisiti: [rep.caserma < 4]
        quando: [pista.pelle < 6]
        prova: { attributo: sociale, abilita: [conoscenze-della-strada, intimidire], difficolta: Media }
        successo:
          titolo: Il lenzuolo
          testo: |
            Tu e il miliziano fate il giro di sempre alla solita ora, e la
            gente vi vede arrivare da due strade di distanza. Davanti alla
            Pignatta Grassa due uomini sulla soglia vi guardano passare senza
            togliersi la pipa di bocca. Sul tardi una lavandaia vi ferma per un
            lenzuolo rubato, e tu sai già in quale cortile andare a cercarlo.
            Il furiere ti paga il giro e ti fa firmare anche per il lenzuolo.
          effetti: { monete: 2, rep.caserma: 0.5 }
        fallimento:
          titolo: Il cortile sbagliato
          testo: |
            Una lavandaia vi ferma per un lenzuolo rubato, e tu lo cerchi nel
            cortile sbagliato davanti a tutta la strada. Quando finalmente lo
            trovate è steso alla finestra della presunta ladra, che vi spiega
            con calma che il lenzuolo è suo e che la lavandaia beve. Rientrate
            in Caserma senza lenzuolo e senza ladra, e il furiere ti dà due
            spiccioli.
          effetti: { monete: 1 }

      - testo: "Scendere di ronda in Città Bassa"
        descrizione: "Dopo la notte della Pignatta la ronda scende anche di sera, e la Città Bassa non ha ancora deciso come guardarla."
        immagine: ambientazione/citta-bassa
        requisiti: [rep.caserma < 4]
        quando: [pista.pelle >= 6]
        prova: { attributo: sociale, abilita: [conoscenze-della-strada, intimidire], difficolta: Media }
        successo:
          titolo: L'orto della Pignatta
          testo: |
            Qualcuno vi saluta dalla finestra, e qualcun altro chiude le
            imposte prima che arriviate. Davanti ai muri anneriti della
            Pignatta c'è un orto con le cipolle storte, e la vecchia che lo
            zappa vi chiede se è vero che adesso la Guardia passa anche di
            notte. Le rispondi di sì, e il miliziano accanto a te lo scrive sul
            taccuino come un ordine. Il furiere ti conta la paga sul banco.
          effetti: { monete: 2, rep.caserma: 0.5 }
        fallimento:
          titolo: La zolla
          testo: |
            Davanti ai muri anneriti della Pignatta un ragazzo vi tira una
            zolla di terra e scappa nei vicoli. Gli corri dietro per tre strade
            e lo perdi alla quarta, fra i panni stesi. Quando torni il
            miliziano si è già pulito il mantello scarlatto e ti dice che è la
            terza zolla della settimana. Il furiere ti paga il minimo e annota
            la zolla.
          effetti: { monete: 1 }

      - testo: "Fare la guardia sulle mura"
        descrizione: "Dopo la razzia le mura nord hanno pochi uomini e molta notte. Serve qualcuno che sappia guardare il buio."
        requisiti: [rep.caserma < 4]
        quando: [pista.capomozzo < 1]
        prova: { attributo: mentale, abilita: [percezione, natura], difficolta: Media }
        successo:
          titolo: Le stoppie
          testo: |
            Dal cammino di ronda delle mura nord si vedono i campi fino alle
            colline, e tu passi la notte a guardarli con una guardia che
            sbadiglia ogni volta che sbadigli tu. Verso l'alba oltre i campi si
            alza un fumo basso e lento, e prima che lui afferri la corda della
            campana gli dici che è un contadino che brucia le stoppie. Il
            sergente ti paga la notte e la guardia ti offre il fondo della sua
            borraccia.
          effetti: { monete: 2, rep.caserma: 0.5 }
        fallimento:
          titolo: La campana
          testo: |
            Verso l'alba vedi un fumo oltre i campi e suoni la campana. Mezza
            Caserma si sveglia, e il sergente sale sulle mura in camicia con la
            spada sguainata. È un contadino che brucia le stoppie, come ogni
            autunno. Il sergente si riabbottona la camicia fino al collo e alla
            fine ti paga una miseria, perché il turno l'hai fatto.
          effetti: { monete: 1 }

      - testo: "Fare la guardia sulle mura"
        descrizione: "Le mura nord adesso le tengono i mercenari di Ghoran, due per torre. Lo sceriffo vuole qualcuno della città in ogni turno."
        immagine: ambientazione/ghoran
        requisiti: [rep.caserma < 4]
        quando: [pista.capomozzo >= 1]
        prova: { attributo: mentale, abilita: [percezione, natura], difficolta: Media }
        successo:
          titolo: La resina sul parapetto
          testo: |
            Ti mettono di turno con una donna dei clan che non dice una parola
            in tutta la notte e mastica resina, mentre nella torre accanto due
            mercenari si giocano la paga a dadi sulle merlature. Verso l'alba
            oltre i campi si alza un fumo basso, e tu le dici che sono stoppie
            bruciate prima che lei metta mano alla balestra. Lei annuisce e
            sputa la resina. Il sergente ti paga il turno.
          effetti: { monete: 2, rep.caserma: 0.5 }
        fallimento:
          titolo: I dadi sulle merlature
          testo: |
            Verso l'alba vedi un fumo oltre i campi e suoni la campana. Sono
            stoppie bruciate come ogni autunno, e i mercenari di Ghoran ridono
            fino al cambio del turno. Per tutta la mattina, ogni volta che
            passi sotto una torre, qualcuno imita il suono della campana
            battendo un elmo con il pugno. Il sergente ti paga lo stesso, senza
            guardarti.
          effetti: { monete: 1 }

      - testo: "Fare la guardia alle celle"
        descrizione: "Borso cerca qualcuno che tenga il corridoio delle celle per una notte, mentre lui dorme seduto con la clava sulle ginocchia."
        immagine: personaggi/borso
        quando: [pista.pelle <= 3]
        prova: { attributo: mentale, abilita: [resilienza, percezione], difficolta: Facile }
        successo:
          titolo: La sedia in fondo
          testo: |
            Borso ti affida il corridoio e va a dormire su una sedia in fondo,
            con la clava corta sulle ginocchia. Fai il giro degli spioncini
            ogni ora, e in una cella un ladro di galline ti racconta la sua
            innocenza tre volte, ogni volta con un dettaglio nuovo. All'alba
            Borso apre un occhio e scrive qualcosa nel registro con la sua
            matita minuscola, poi conta due volte le monete prima di dartele.
          effetti: { monete: 3 }
        fallimento:
          titolo: La voce bassa
          testo: |
            Verso la terza campana ti si chiudono gli occhi, e ti sveglia la
            voce bassa di Borso che ti chiede se la sedia è comoda. Nessuno è
            scappato, e il ladro di galline russa. Borso scrive una riga nel
            registro senza farti vedere che cosa, e ti paga il minimo.
          effetti: { monete: 1 }

      - testo: "Fare la guardia alle celle"
        descrizione: "Da quando Borso se n'è andato le serrature delle celle sono tutte nuove, e le chiavi le tiene un sergente che non conosce i detenuti."
        quando: [pista.pelle >= 4, pista.pelle <= 5]
        prova: { attributo: mentale, abilita: [resilienza, percezione], difficolta: Facile }
        successo:
          titolo: Le chiavi nuove
          testo: |
            Il sergente che tiene le chiavi nuove prova tre chiavi a ogni porta
            prima di trovare quella giusta. Fai il giro con lui reggendo la
            lanterna, e porta per porta gli scrivi su un foglio il nome del
            detenuto e il numero della chiave. All'alba lui inchioda il tuo
            foglio accanto al chiodo vuoto dove stava l'anello di Borso, e ti
            paga la notte per intero.
          effetti: { monete: 3 }
        fallimento:
          titolo: L'anello che non c'è
          testo: |
            Il sergente sbaglia chiave a ogni porta, e alla fine ti chiede di
            tenere la lanterna più in alto, come se la colpa fosse della luce.
            All'alba siete ancora alla terza cella. Lui guarda il chiodo vuoto
            dove stava l'anello di Borso e bestemmia a mezza voce, poi ti paga
            il minimo.
          effetti: { monete: 1 }

      - testo: "Fare la guardia alle celle"
        descrizione: "In fondo al corridoio delle celle c'è un detenuto che le celle le conosce meglio del nuovo carceriere."
        immagine: personaggi/borso
        quando: [pista.pelle >= 6]
        prova: { attributo: mentale, abilita: [resilienza, percezione], difficolta: Facile }
        successo:
          titolo: Una lettera da Ghoran
          testo: |
            Nella cella in fondo al corridoio c'è Borso, con le catene ai polsi
            e il grembiule di cuoio che nessuno gli ha tolto. A metà notte ti
            chiama dallo spioncino con la voce bassa di sempre e ti chiede se è
            arrivata una lettera da Ghoran. Gli dici di no. Lui ringrazia e
            torna a sedersi sulla paglia, e per il resto della notte non lo
            senti più. All'alba il carceriere nuovo ti paga la notte.
          effetti: { monete: 3 }
        fallimento:
          titolo: La sedia scomoda
          testo: |
            Verso la terza campana ti si chiudono gli occhi sulla sedia. Ti
            sveglia la voce di Borso dalla cella in fondo, che ti dice di
            appoggiare la schiena al muro, perché su quella sedia ci ha dormito
            otto anni e sa da che parte cede. Il carceriere nuovo ti trova così
            all'alba e ti paga due spiccioli.
          effetti: { monete: 1 }

      - testo: "Ricopiare i rapporti per il furiere"
        descrizione: "I rapporti delle ronde arrivano scritti a matita, a volte firmati con il pollice. Il furiere li vuole in bella sul registro."
        prova: { attributo: mentale, abilita: [accademiche, politica-ed-economia], difficolta: Facile }
        successo:
          titolo: In bella copia
          testo: |
            Il furiere ti fa sedere al suo tavolo con una pila di rapporti
            scritti a matita, e tu li ricopi sul registro uno sotto l'altro. Le
            ronde trovano quasi sempre ubriachi addormentati sulle scale, e in
            più c'è un mulo che ogni notte scappa dalla stessa stalla. Il
            furiere controlla le tue righe con il dito, ti conta la paga e ti
            porge la ricevuta da firmare anche per quelle.
          effetti: { monete: 3 }
        fallimento:
          titolo: Il mulo sul ponte
          testo: |
            A metà pila confondi due ronde e metti il mulo fuggitivo sul Ponte
            dei Morti, dove nessun mulo è mai arrivato da solo. Il furiere se
            ne accorge alla prima riga e raschia l'inchiostro con un
            coltellino, sospirando a ogni lettera. Ti paga pochi spiccioli, e
            la ricevuta te la fa firmare due volte.
          effetti: { monete: 1 }

      - testo: "Dare il cambio alla porta"
        descrizione: "Una delle due guardie del portone deve fare colazione, e qualcuno deve stare al suo posto per un'ora."
        esito:
          titolo: Il portone
          testo: |
            Prendi per un'ora il posto della guardia del portone che ha sempre
            l'aria di avere appena mangiato, mentre lei va a mangiare davvero.
            L'altra guardia non ti rivolge la parola. Passano un garzone con il
            pane per il furiere e due madri venute a chiedere dei figli in
            cella, e impari a capire da come salgono la discesa chi viene a
            chiedere e chi viene a denunciare. Quando la guardia torna si
            spazzola le briciole dal pettorale e ti ringrazia con un cenno.
          pe: { percezione: 2 }

      - testo: "Addestrare le reclute"
        descrizione: "Dragna Gro-Malog cerca qualcuno che tenga le reclute dei turni misti mentre lei compila i fogli. Le reclute non perdonano niente."
        immagine: personaggi/dragna-gro-malog
        requisiti: [rep.caserma >= 4, rep.caserma < 6]
        prova: { attributo: fisico, abilita: [armi-da-mischia, rissa], difficolta: Media }
        successo:
          titolo: Le divise mescolate
          testo: |
            Dragna ti affida sei reclute prese metà dalla Guardia e metà dai
            Raschiatori, e si appoggia al muro con i fogli dei turni in mano.
            Le metti in coppia mescolando le divise e fai ripetere la stessa
            parata finché nessuno la sbaglia più. Un Raschiatore ti chiede a
            che cosa serva una parata da Guardia nei tunnel, e tu glielo fai
            vedere sulla sua spalla. Dragna volta pagina inumidendosi il
            pollice. Il furiere ti paga la giornata.
          effetti: { monete: 5, rep.caserma: 0.5 }
        fallimento:
          titolo: La forza è controllo
          testo: |
            Per mostrare la parata scegli la recluta più grossa, e lei ti mette
            a sedere sulla ghiaia alla prima finta. Le altre ridono finché
            Dragna non alza gli occhi dai fogli. Ti aiuta a rialzarti con la
            mano a cui mancano due dita. «La forza è controllo» dice con la
            voce roca, e ti rimanda dal furiere a prendere la paga ridotta.
          effetti: { monete: 2 }

      - testo: "Guidare una ronda mista"
        descrizione: "Due miliziani e due Raschiatori che fra loro non si parlano, e un giro dei Ponti da fare insieme. Il sergente te li affida per un giorno."
        requisiti: [rep.caserma >= 4, rep.caserma < 6]
        prova: { attributo: sociale, abilita: [persuasione, intimidire], difficolta: Media }
        successo:
          titolo: La cassa di pesce
          testo: |
            Al Mercato dei Nodi un banco rovescia una cassa di pesce per una
            lite sul peso, e la folla si chiude intorno ai due mercanti. Mandi
            i Raschiatori a tenere indietro la gente e i miliziani a
            raccogliere i testimoni, poi li fai scambiare a metà, perché si
            parlino per forza. Rientrando uno dei miliziani passa la borraccia
            al Raschiatore che gli cammina accanto. Il furiere ti paga la ronda
            per intero.
          effetti: { monete: 5, rep.caserma: 0.5 }
        fallimento:
          titolo: Il pesce per terra
          testo: |
            Al Mercato dei Nodi un banco rovescia una cassa di pesce per una
            lite sul peso, e mentre tu dai gli ordini i miliziani e i
            Raschiatori litigano fra loro su chi debba tenere la folla. Il
            pesce sparisce un po' alla volta nelle tasche dei passanti. Al
            rientro ognuno racconta la sua versione al sergente, e nessuna
            somiglia alla tua. Il furiere ti paga la ronda e basta.
          effetti: { monete: 2 }

      - testo: "Mettere in fila una pratica dello sceriffo"
        descrizione: "Un mese di rapporti su un magazzino del Mercato dei Nodi da cui spariscono le casse. Galdrick li ha letti tutti, e non gli tornano."
        immagine: personaggi/toren-galdrick
        requisiti: [rep.caserma >= 4, rep.caserma < 6]
        quando: [galdrick.via == 0]
        prova: { attributo: mentale, abilita: [politica-ed-economia, accademiche], difficolta: Difficile }
        successo:
          titolo: Il giorno dopo la paga
          testo: |
            Passi due giorni al tavolo dell'ufficio a mettere i rapporti in
            colonna, data per data. Le casse spariscono sempre il giorno dopo
            la paga dei facchini, e a firmare i rapporti di quei giorni è
            sempre lo stesso Custode di Passaggio. Galdrick legge il tuo foglio
            muovendo le labbra, lo infila nella pratica e scrive una riga sul
            taccuino con la matita corta. Il furiere ti paga più del solito.
          effetti: { monete: 6, rep.caserma: 0.5 }
        fallimento:
          titolo: Quello che sapeva già
          testo: |
            Passi due giorni sui rapporti e alla fine porti allo sceriffo un
            foglio con il nome del facchino più povero del magazzino. Galdrick
            lo legge fino in fondo con i pollici nella cintura. Ti dice che
            quel facchino l'ha già sentito due volte, e che le casse spariscono
            anche quando lui è a casa con la febbre. Il furiere ti paga il
            minimo della pratica.
          effetti: { monete: 2 }

      - testo: "Un incarico dalla lista"
        descrizione: "Galdrick ti passa un biglietto piegato in quattro con sopra un nome e un'ora. Niente divisa, e la paga la conta il furiere alla voce spese di servizio."
        immagine: personaggi/toren-galdrick
        requisiti: [guarnigione.distintivo >= 1]
        quando: [galdrick.via == 0]
        prova: { attributo: sociale, abilita: [ingannare, conoscenze-della-strada], difficolta: Media }
        successo:
          titolo: Spese di servizio
          testo: |
            Passi la sera in una bettola dei Ponti senza divisa, a bere sidro
            annacquato accanto a un uomo che vende cristalli non registrati, e
            quando se ne va sai in quale magazzino li tiene. All'alba lo
            racconti allo sceriffo, che lo scrive sul taccuino. Il furiere ti
            conta il compenso alla voce *spese di servizio* e non ti chiede di
            quale servizio.
          effetti: { monete: 8, informazioni.voce: 1 }
        fallimento:
          titolo: Il secondo bicchiere
          testo: |
            L'uomo del biglietto ti guarda una volta di troppo, e prima del
            secondo bicchiere paga ed esce dalla porta sul retro. Lo segui fino
            al primo ponte e lo perdi fra i carretti. Galdrick ascolta il tuo
            racconto con i pollici nella cintura e scrive una riga corta. Il
            furiere ti conta meno del dovuto, perché il sidro l'hai pagato tu.
          effetti: { monete: 4 }

  # ------------------------------------------------------------ storia a 2 · la ronda di notte
  - id: la-ronda-di-notte
    presso: guarnigione-di-qir-azel
    immagine: ambientazione/guarnigione-di-qir-azel
    titolo: La ronda di notte
    sommario: "Dal magazzino della Caserma sparisce un cristallo da lanterna ogni settimana, sempre il giovedì. Il furiere vuole sapere dove va a finire."
    luogo: Guarnigione di Qir-Azel, il magazzino del furiere
    area: quartieri-alti
    requisiti: [rep.caserma >= 2, guarnigione.ronda == 0]
    testo: |
      Il furiere ti aspetta alla porta del magazzino con il registro aperto, e
      prima ancora di salutarti ti mostra una colonna di numeri. Sono i
      cristalli da lanterna consegnati alla ronda di notte uno per lanterna, e
      accanto ci sono quelli resi esauriti. Da due mesi ne manca uno ogni
      giovedì, e il sergente della ronda scrive *esaurito* con la stessa
      grafia tonda.

      «Un cristallo da lanterna costa più di quanto pensi» dice il furiere, e
      batte il dito sulla colonna. «Otto giovedì sono otto cristalli, e la
      Caserma non li trova per terra. Lo sceriffo dice che la cosa la guardi
      tu, perché i miei sergenti conoscono me e te no.» Ti porge la ricevuta
      per una lanterna, e oggi è giovedì.

      Il sergente della ronda di notte si chiama Livio Mastrel. È un uomo magro
      con i baffi grigi e vent'anni di servizio, e tiene sempre fra i denti una
      radice di liquirizia, che offre a chiunque, detenuti compresi. Stasera
      esce con quattro miliziani e due reclute dei Raschiatori per il giro dei
      Ponti. Ti fa posto nella fila senza domande e ti allunga un pezzo di
      liquirizia.

      *Il furiere quegli otto cristalli li ha contati anche in sogno.* Prendi
      la liquirizia, e intanto conti le lanterne della fila, una per una.
    opzioni:
      - testo: "Contare le lanterne lungo il giro"
        descrizione: "Sei lanterne alla partenza. Basta guardare dove diventano cinque, o sette."
        prova: { attributo: mentale, abilita: percezione, difficolta: Media }
        successo:
          titolo: Una lanterna in più
          testo: |
            Conti le lanterne della ronda a ogni ponte. Sul Ponte dei Morti, per
            qualche minuto, la fila ne ha una di meno, e una delle due reclute
            dei Raschiatori è rimasta indietro, china sul parapetto fra le
            lanterne dei compagni perduti. Quando vi raggiunge la sua lanterna
            fa una luce gialla e fioca, e il sergente non le chiede niente.
            Tu tieni la bocca chiusa e continui a contare fino al rientro.
          segue: la-lanterna-del-ponte
        fallimento:
          titolo: Le lanterne del ponte
          testo: |
            Conti le lanterne a ogni ponte, ma sul Ponte dei Morti i Raschiatori
            ne hanno appese a centinaia sopra il vuoto, e lì perdi il conto. Al
            rientro il sergente scrive *esaurito* sul registro con la sua grafia
            tonda, e tu non sai dire in quale punto del giro sia successo.
            Mastrel ti offre un altro pezzo di liquirizia.

      - testo: "Fare parlare Mastrel"
        descrizione: "Vent'anni di ronde di notte, e una grafia tonda sul registro. Il sergente sa dove va il cristallo."
        prova: { attributo: sociale, abilita: [empatia, persuasione], difficolta: Media }
        successo:
          titolo: Vedi tu
          testo: |
            Gli chiedi di sua moglie, e lui te ne parla fino al secondo ponte.
            Al terzo sei tu a dirgli che il furiere conta i giovedì. Mastrel
            mastica la liquirizia a lungo. «Il giovedì è il giorno che suo padre
            è sceso nel Labirinto, tre anni fa» dice alla fine, e con il mento
            indica la recluta più giovane. «Io sul registro scrivo *esaurito*, e
            vedi tu se è una bugia.» Sul Ponte dei Morti rallenta, e lascia che
            la recluta resti indietro.
          segue: la-lanterna-del-ponte
        fallimento:
          titolo: Come gli uomini
          testo: |
            Mastrel ti ascolta masticando e ti risponde che i cristalli si
            esauriscono come gli uomini, e che lui ne ha visti esaurire
            parecchi. Poi per tutto il resto del giro ti parla di sua moglie e
            delle verze che coltiva sul balcone. Al rientro scrive *esaurito* sul
            registro, e ti offre la liquirizia.

      - testo: "Restare in coda alla fila"
        descrizione: "In fondo alla fila nessuno si volta. Se qualcuno si ferma, lo vedi tu per primo."
        prova: { attributo: fisico, abilita: [furtivita, atletica], difficolta: Media }
        successo:
          titolo: Il parapetto
          testo: |
            Ti lasci scivolare in fondo alla fila e a ogni ponte rallenti un
            poco. Sul Ponte dei Morti la recluta più giovane si ferma al
            parapetto senza una parola, e tu ti schiacci dietro una trave. La
            vedi aprire una lanterna dei Raschiatori, appesa sopra il vuoto, e
            infilarci dentro il cristallo della sua. Poi richiude la porticina
            con due dita, piano, come si chiude la porta di una stanza dove
            dorme qualcuno.
          segue: la-lanterna-del-ponte
        fallimento:
          titolo: La trave
          testo: |
            Ti lasci scivolare in fondo alla fila, e sul Ponte dei Morti inciampi
            in una trave nella nebbia. La recluta più giovane si volta di scatto
            e torna di corsa al suo posto nella fila. Per il resto del giro non
            si stacca da Mastrel nemmeno di un passo, e al rientro il registro
            dice *esaurito* come tutti gli altri giovedì.

      - testo: "Fare la ronda per tutta la settimana"
        descrizione: "Sette notti di giro, e il giovedì che torna. Prima o poi chi prende il cristallo lo prende sotto i tuoi occhi."
        costo: 2
        esito:
          titolo: Sette notti
          testo: |
            Fai la ronda per sette notti di fila, finché il giro dei Ponti lo
            sogni anche di giorno. Il giovedì successivo, sul Ponte dei Morti,
            la recluta più giovane resta indietro come se niente fosse, e tu sei
            abbastanza stanco da restare indietro con lei senza che nessuno ci
            faccia caso. La vedi aprire una lanterna appesa al parapetto e
            infilarci dentro il cristallo della Caserma.
          pe: { resistenza: 5 }
          segue: la-lanterna-del-ponte

  - id: la-lanterna-del-ponte
    immagine: ambientazione/ponte-dei-morti
    titolo: La lanterna sul Ponte dei Morti
    tipo: seguito
    luogo: Ponte dei Morti, a notte fonda
    area: ponti-sospesi
    requisiti: [guarnigione.ronda == 0]
    testo: |
      Sul Ponte dei Morti la nebbia sale dalla Cicatrice fino alle ginocchia, e
      sopra il vuoto dondolano le lanterne dei Raschiatori, ognuna con il suo
      piccolo cristallo acceso per qualcuno rimasto nel Labirinto. La recluta
      si chiama Linna Varo. Ha diciassette anni e i polsi ancora troppo sottili
      per la mazza dei Raschiatori, e sta chiudendo la porticina di una
      lanterna di ferro battuto dove il cristallo della Caserma brilla più
      bianco di tutti gli altri. Sul vetro qualcuno ha inciso *Ansel*, e sotto,
      più piccolo, *giovedì*.

      Quando ti vede non scappa. Si mette sull'attenti come le ha insegnato il
      sergente d'addestramento, con la sua lanterna in mano e il cristallo
      vecchio dentro, quasi esaurito.

      «Mio padre è sceso un giovedì, tre anni fa» dice. «Al Grifone mi hanno
      detto che finché la lanterna resta accesa uno può ancora risalire. Lo so
      che è una storia da bambini, però la paga di una recluta è poca, e un
      cristallo buono costa più di una settimana di servizio.»

      Mastrel arriva dal fondo del ponte e guarda prima te e poi la lanterna.
      Per la prima volta da quando lo conosci si toglie la liquirizia di bocca,
      e aspetta.
    opzioni:
      - testo: "Riferire tutto allo sceriffo"
        descrizione: "Galdrick ti ha chiesto di guardare, e tu hai guardato. Quello che decide è affare suo."
        immagine: personaggi/toren-galdrick
        quando: [galdrick.via == 0]
        esito:
          titolo: Una voce nuova
          testo: |
            Il mattino dopo racconti tutto a Galdrick, compreso il nome inciso
            sul vetro. Lo sceriffo ti ascolta con i pollici nella cintura e
            muove le labbra su *giovedì*. Poi chiama il furiere e gli fa aprire
            una voce nuova sul registro, *Ponte dei Morti, un cristallo al
            giovedì*, a carico della cassa delle spese di servizio. «Linna Varo
            resta recluta» dice, «e il cristallo lo porta Mastrel, che firma la
            ricevuta.» Il furiere scrive senza alzare la testa, e per una volta
            non sospira.
          pe: { persuasione: 5 }
          imposta: { guarnigione.ronda: 1 }
          effetti: { rep.caserma: 1 }

      - testo: "Portarla da Dragna"
        descrizione: "Le lanterne del Ponte dei Morti sono dei Raschiatori, e ai Raschiatori ci pensa il Ferro."
        immagine: personaggi/dragna-gro-malog
        esito:
          titolo: La veglia
          testo: |
            La sera dopo accompagni Linna al Grifone di Ferro, al tavolo di
            Dragna Gro-Malog, e lasci che racconti lei. Dragna ascolta davanti
            al suo boccale, poi volta i fogli dei turni inumidendosi il pollice
            e scrive il nome di Linna sotto la veglia del Ponte dei Morti, quella
            dei due vecchi con la borraccia. «La veglia ha i suoi cristalli, e li
            paghiamo noi» dice con la voce roca. «La Caserma si tenga i suoi.»
            Linna arrossisce fino alle orecchie e non riesce a ringraziare.
          pe: { empatia: 5 }
          imposta: { guarnigione.ronda: 1 }
          effetti: { rep.caserma: 1 }

      - testo: "Coprirla con il furiere"
        descrizione: "Una partita di cristalli difettosi capita a tutti. Basta raccontarla bene a un uomo che conta ogni galletta."
        prova: { attributo: sociale, abilita: [ingannare, persuasione], difficolta: Media }
        successo:
          titolo: La partita difettosa
          testo: |
            Riporti al furiere un cristallo esaurito e gli fai notare la venatura
            opaca, che hanno quasi tutti i cristalli della stessa partita. Lui
            lo guarda contro la luce e si convince che il fornitore lo derubi da
            mesi, e da quel giorno conta i cristalli due volte all'arrivo invece
            che alla partenza. Mastrel, passandoti accanto nel cortile, ti
            infila in tasca una radice di liquirizia intera.
          imposta: { guarnigione.ronda: 1 }
          effetti: { rep.caserma: 1, informazioni.voce: 1 }
        fallimento:
          titolo: La venatura
          testo: |
            Il furiere guarda la venatura opaca contro la luce, poi guarda te.
            Ti dice che quella venatura è dell'ultima partita, e che i cristalli
            spariti sono di quella prima. Alla fine gli racconti la verità, e lui
            la scrive sul registro con la sua grafia piccola. Due giorni dopo
            sulla colonna dei giovedì compare la voce *Ponte dei Morti*, insieme
            a una riga di rimprovero per te.
          imposta: { guarnigione.ronda: 1 }
          effetti: { rep.caserma: 1, sospetto: 0.5 }

      - testo: "Pagare tu i cristalli"
        descrizione: "Il prezzo di tutti i giovedì passati, e la Caserma non ha più niente da contare."
        requisiti: [monete >= 32]
        esito:
          titolo: Il conto pari
          testo: |
            Il mattino dopo conti sul leggio del furiere il prezzo di otto
            cristalli, che lui impila a mucchietti e poi ti fa firmare una
            ricevuta alla voce *cristalli, rimborso*. Non ti chiede per conto
            di chi. Linna lo viene a sapere da Mastrel, e per una settimana ti
            saluta nel cortile portandosi la mano alla fronte, come si fa con i
            sergenti. Il giovedì dopo la lanterna sul ponte è ancora accesa.
          pe: { galateo: 5 }
          imposta: { guarnigione.ronda: 1 }
          effetti: { rep.caserma: 1, monete: -32 }

  # ------------------------------------------------------------ storia a 4 · i trenta di Ghoran
  - id: i-trenta-di-ghoran
    presso: guarnigione-di-qir-azel
    immagine: ambientazione/ghoran
    titolo: I trenta di Ghoran
    sommario: "I mercenari che Galdrick ha portato da Ghoran stanno sotto il portico con le armi addosso, e dall'altra parte del cortile la Guardia aspetta."
    luogo: Guarnigione di Qir-Azel, il cortile
    area: quartieri-alti
    requisiti: [rep.caserma >= 4, guarnigione.mercenari == 0, pista.capomozzo >= 1]
    testo: |
      Stamattina nel cortile della Caserma non si addestra nessuno. I
      mercenari di Ghoran stanno sotto il portico tutti insieme, con le armi
      addosso e le facce cotte dal sole, e dall'altra parte del cortile una
      dozzina di miliziani tiene il mantello scarlatto aperto sull'elsa. In
      mezzo c'è il furiere con il registro stretto al petto, e guarda ora una
      parte ora l'altra senza decidersi.

      Il motivo è chiuso in una cella del piano interrato. Si chiama Mardek, è
      un ragazzo dei clan con le orecchie piene di anelli di rame, e ieri al
      Mercato dei Nodi ha preso un prosciutto da un banco lasciando al posto
      delle monete un gettone d'argilla con un segno inciso. Il mercante ha
      chiamato la Guardia, e la Guardia l'ha portato giù.

      Per i mercenari parla Hagra, una donna con tre righe di argilla secca
      sulla faccia che mastica resina dalla mattina alla sera. «A Ghoran il gettone vale
      come la moneta, eh» dice, abbastanza forte da farsi sentire fino alle
      finestre dell'ufficio. «Il clan paga quando torna. Qui invece la paga non
      la vediamo da due settimane, e per un prosciutto ci chiudono in cella,
      eh.» Sputa la resina sulla ghiaia.

      Lo sceriffo è in Municipio fino a sera. Il furiere ti guarda come si
      guarda una scala a pioli durante un incendio. *Trenta lance da una parte
      e dodici mantelli dall'altra, e in mezzo un prosciutto.* Senti le spalle
      che ti salgono verso le orecchie.
    opzioni:
      - testo: "Esaminare il gettone"
        descrizione: "Il gettone d'argilla è sul leggio del furiere, insieme al registro dove i trenta hanno firmato l'ingaggio."
        prova: { attributo: mentale, abilita: [politica-ed-economia, percezione], difficolta: Media }
        successo:
          titolo: Il segno del clan
          testo: |
            Il segno inciso sul gettone è una mano aperta con tre dita. Sfogli
            il registro del furiere fino all'ingaggio dei mercenari, che non
            sapevano scrivere e hanno firmato con il segno del loro clan, e la
            mano con tre dita la trovi cinque volte, Mardek compreso. In fondo
            alla pagina il furiere stesso ha scritto che la Caserma risponde dei
            debiti contratti in servizio. Glielo leggi ad alta voce. Il furiere
            paga il prosciutto e ne scala il prezzo dalla paga di Mardek, che
            esce dalla cella. Hagra ride e ti batte sulla spalla.
          imposta: { guarnigione.mercenari: 1 }
          effetti: { rep.caserma: 1 }
        fallimento:
          titolo: Uno sgorbio
          testo: |
            Giri il gettone fra le dita e il segno inciso ti sembra uno sgorbio
            qualsiasi. Lo dici, e sotto il portico qualcuno lo traduce agli altri
            nella lingua dei clan. Hagra si riprende il gettone dalla tua mano
            senza chiedere e se lo infila nello stivale. Per il resto della
            mattina i mercenari restano sotto il portico, e il furiere non si
            stacca dal suo registro.

      - testo: "Mettere d'accordo Hagra e il sergente"
        descrizione: "Il sergente vuole un colpevole e Hagra vuole Mardek fuori. Una soluzione che vada bene a tutti e due esiste, se qualcuno la trova."
        prova: { attributo: sociale, abilita: [persuasione, empatia], difficolta: Media }
        successo:
          titolo: Il banco del prosciutto
          testo: |
            Porti il sergente e Hagra in mezzo al cortile, lontano dalla loro
            gente, e proponi la cosa più semplice. Mardek esce oggi, e per una settimana
            serve al banco del mercante finché il prosciutto non è pagato. Il
            sergente ci pensa grattandosi il collo sotto il cappuccio, e Hagra
            dice che a Ghoran per un prosciutto basta un giorno di lavoro.
            Vi accordate su tre. Quando i miliziani chiudono i mantelli, sotto il
            portico qualcuno ricomincia a ridere.
          imposta: { guarnigione.mercenari: 1 }
          effetti: { rep.caserma: 1 }
        fallimento:
          titolo: Tutti e due contro
          testo: |
            Proponi al sergente e a Hagra di dividere la colpa a metà, e per la
            prima volta in tutta la mattina sono d'accordo, contro di te. Il
            sergente ti ricorda che la Guardia non tratta con chi ruba, e Hagra
            gli risponde che lei non tratta con chi non paga. Tornano ciascuno
            dalla sua parte del cortile, e il furiere stringe il registro un po'
            più forte.

      - testo: "Accettare la sfida di Hagra"
        descrizione: "A Ghoran una lite si chiude nel fango, e vince chi mette l'altro con la schiena per terra. Hagra lo propone a chiunque abbia il coraggio di rispondere."
        prova: { attributo: fisico, abilita: [rissa, atletica], difficolta: Media }
        successo:
          titolo: La schiena sulla ghiaia
          testo: |
            Hagra si toglie la cintura con il coltello e la dà a un compagno, e
            i miliziani si fanno avanti per vedere. Ti gira intorno due volte,
            poi ti prende alla vita. Ti lasci tirare, poi ruoti sul piede
            portandola giù con te, e quando la ghiaia smette di scricchiolare
            lei è sotto, con la schiena per terra e la resina ancora fra i denti. «Eh»
            dice, e si mette a ridere. Mardek esce dalla cella prima di
            mezzogiorno e paga il prosciutto lavorando al banco.
          imposta: { guarnigione.mercenari: 1 }
          effetti: { rep.caserma: 1 }
        fallimento:
          titolo: Nel fango di Ghoran
          testo: |
            Hagra ti prende alla vita e tu fai l'errore di spingere. Ti ritrovi
            con la schiena sulla ghiaia e il cielo che gira sopra il cortile,
            mentre i mercenari battono le lance per terra. Lei ti aiuta a
            rialzarti e ti dice che a Ghoran adesso il prosciutto sarebbe suo.
            Qui però siamo a Qir-Azel, aggiunge mentre si allaccia la cintura,
            e la cella resta chiusa.
          effetti: { ferite: 0.5 }

      - testo: "Pagare il prosciutto di tasca tua"
        descrizione: "Il prezzo del prosciutto al mercante, e il gettone di Mardek resta a te. È il modo più rapido."
        requisiti: [monete >= 12]
        esito:
          titolo: Il gettone d'argilla
          testo: |
            Scendi al Mercato dei Nodi con il furiere al seguito e paghi il
            mercante, che firma una ricevuta per la Caserma. Al ritorno il
            sergente fa aprire la cella, e Mardek sale le scale sbattendo gli
            occhi alla luce, e quando Hagra gli dice chi ha
            pagato viene da te e ti mette in mano il gettone d'argilla. «Il clan
            paga quando torna» dice, con l'accento dei clan. «Tienilo, eh.»
          pe: { galateo: 5 }
          imposta: { guarnigione.mercenari: 1 }
          effetti: { rep.caserma: 1, monete: -12 }

      - testo: "Aspettare lo sceriffo"
        descrizione: "Galdrick torna dal Municipio a sera. Fino ad allora qualcuno deve stare in mezzo al cortile."
        quando: [pista.pelle < 6]
        costo: 2
        esito:
          titolo: Fino a sera
          testo: |
            Passi la giornata a fare avanti e indietro fra il portico e i
            mantelli scarlatti con l'acqua e il pane, finché tutti mangiano
            dalla stessa cesta. Galdrick rientra al tramonto e
            capisce tutto dal portone. Ascolta Hagra e poi il sergente, con i
            pollici nella cintura. «La paga arriva domani dal Consiglio» dice,
            «e Mardek lavora al banco finché il prosciutto è pagato.» Poi ti fa
            un cenno con il mento, che vuol dire che il cortile l'hai tenuto
            tu.
          pe: { resilienza: 5 }
          imposta: { guarnigione.mercenari: 1 }
          effetti: { rep.caserma: 1 }

      - testo: "Aspettare lo sceriffo"
        descrizione: "Galdrick torna dal Municipio a sera, con il fianco ancora fasciato dalla notte della Pignatta. Fino ad allora qualcuno deve stare in mezzo al cortile."
        quando: [pista.pelle >= 6]
        costo: 2
        esito:
          titolo: Il gradino
          testo: |
            Passi la giornata in mezzo al cortile a fare avanti e indietro con
            l'acqua e il pane. Galdrick rientra al tramonto, lento, con una mano
            sul fianco, e invece di salire nell'ufficio si siede sul gradino del
            portico, in mezzo ai mercenari che la notte della Pignatta erano
            con lui. Nessuno alza più la voce. «La paga arriva domani» dice, «e
            Mardek lavora al banco finché il prosciutto è pagato.» Poi resta
            seduto sul gradino anche dopo che se ne sono andati tutti, a
            guardare il cortile che si svuota.
          pe: { resilienza: 5 }
          imposta: { guarnigione.mercenari: 1 }
          effetti: { rep.caserma: 1 }

      - testo: "Dire a Hagra da dove vieni"
        descrizione: "A Ghoran i gettoni dei clan li hai visti passare di mano sopra la bilancia del mercato, e sai quanto valgono. Hagra non sa che da quella bilancia sei sceso tu."
        quando: [origine.fuggiasco-di-ghoran >= 1]
        prova: { attributo: sociale, abilita: [intimidire, empatia], difficolta: Media }
        successo:
          titolo: La riga sul polso
          testo: |
            In mezzo al cortile ti tiri su la manica e mostri a Hagra il polso, dove
            la corda dei recinti ha lasciato una riga chiara. Lei smette di masticare,
            e la resina le resta ferma fra i denti. Dici al furiere, abbastanza forte
            per tutti, che a Ghoran il gettone di quel clan vale quanto la moneta e
            che il clan lo paga sempre, anche ai mercanti di schiavi. Il furiere lo
            scrive sul registro. Hagra ti guarda a lungo, poi ordina ai suoi di posare
            le lance. «Mardek paga il prosciutto quando arriva la paga» dice Hagra al
            sergente. Poi si volta verso di te. «E tu, eh, ai miei non dire da dove
            vieni» ti dice a voce bassa.
          pe: { intimidire: 5 }
          imposta: { guarnigione.mercenari: 1 }
          effetti: { rep.caserma: 1 }
        fallimento:
          titolo: Gli occhi sulla ghiaia
          testo: |
            Cominci a parlare di Ghoran, e a metà della prima frase ti accorgi di
            avere le spalle curve e gli occhi sulla ghiaia, come quando passavano i
            sorveglianti. Hagra se ne accorge prima di te e ride, e i suoi ridono con
            lei. Il furiere chiude il registro. Il cortile resta diviso in due fino a
            sera, con te in mezzo e la schiena che non vuole raddrizzarsi.

  # ------------------------------------------------------------ storia a 6 · la lista dello sceriffo
  - id: la-lista-dello-sceriffo
    presso: guarnigione-di-qir-azel
    immagine: personaggi/toren-galdrick
    titolo: La lista dello sceriffo
    sommario: "Galdrick ti fa chiamare a sera, chiude la porta dell'ufficio a chiave e tira fuori il taccuino."
    luogo: Guarnigione di Qir-Azel, l'ufficio dello sceriffo, a sera
    area: quartieri-alti
    requisiti: [rep.caserma >= 6, guarnigione.distintivo == 0, galdrick.via == 0]
    testo: |
      Galdrick ti fa chiamare a sera, quando il cortile è vuoto e il furiere ha
      già chiuso il magazzino con le sue due mandate. Sul tavolo dell'ufficio
      c'è una lampada sola, e il calendario appeso al muro ha i
      giorni passati barrati con una riga dritta. Lo sceriffo chiude la
      porta, ci gira la chiave e resta in piedi.

      Dalla tasca interna della divisa tira fuori il taccuino, quello che gli
      hai visto riempire di righe per tutto questo tempo, e lo apre alle
      ultime pagine. C'è una colonna di nomi, forse una dozzina, ognuno con
      una data accanto. «Questa lista l'ho cominciata due anni fa» dice. «Sono
      vice-sceriffi. Nessuno li ha mai visti in divisa, e la paga gliela conto
      io di persona. Vanno dove la Guardia non può andare senza farsi vedere.»

      Batte la matita corta sullo spazio bianco sotto l'ultimo nome. «Qui ci
      starebbe il tuo. Prima però voglio vederti lavorare una sera come
      lavorano loro, senza la divisa addosso e senza di me. Stanotte ho tre cose da fare,
      e me ne basta una.»

      Si appoggia al bordo del tavolo con i pollici nella cintura. *Quest'uomo
      non si fida di nessuno, e ti sta mostrando la sua lista.* Respiri piano,
      con il naso, come prima di un salto.
    opzioni:
      - testo: "Leggere i tre rapporti"
        descrizione: "Tre rapporti di ronda sulla stessa notte. Uno l'ha scritto chi non c'era, e Galdrick vuole sapere quale."
        prova: { attributo: mentale, abilita: [percezione, accademiche], difficolta: Media }
        successo:
          titolo: La pioggia
          testo: |
            I tre rapporti raccontano la stessa notte sui Ponti, con gli stessi
            orari e gli stessi nomi. Due però hanno la carta ondulata in un
            angolo e l'inchiostro un poco sbavato, e il terzo è asciutto e
            liscio come appena uscito dal cassetto, anche se quella notte ha
            piovuto dal tramonto all'alba. Metti il dito sul terzo, e Galdrick
            lo gira e ti mostra la firma, che è di un miliziano rimasto a casa
            con la febbre. «Lo sapevo, e volevo sapere se lo vedevi anche tu»
            dice, e rimette i fogli nel cassetto.
          segue: il-nome-nella-lista
        fallimento:
          titolo: Il rapporto sbagliato
          testo: |
            Leggi i tre rapporti due volte e scegli quello con più errori di
            grammatica. Galdrick scuote la testa piano. Quello l'ha scritto un
            sergente che sa leggere a fatica e c'era, e il falso è scritto
            meglio degli altri due. Rimette i fogli nel cassetto e ti dice che
            la lista aspetta, e che stanotte ha altre cose da fare.

      - testo: "Interrogare il detenuto della cella sei"
        descrizione: "Un ricettatore dei Ponti che giura di non sapere niente. Sa dove è finita una cassa di armi della Caserma."
        prova: { attributo: sociale, abilita: [empatia, intimidire], difficolta: Media }
        successo:
          titolo: La cella sei
          testo: |
            Il ricettatore ti aspetta seduto sulla paglia, e la sua storia l'ha
            già raccontata a tre sergenti. Gli chiedi di sua figlia, che ogni
            mattina viene al portone a portargli il pane, e di quanto ci mette a
            salire la discesa. Dopo un
            po' ti dice il nome del magazzino, e anche quello del barcaiolo che
            ha portato la cassa. Galdrick ascolta dalla porta e lo scrive sul
            taccuino.
          segue: il-nome-nella-lista
        fallimento:
          titolo: Tre sergenti
          testo: |
            Il ricettatore ti ascolta con pazienza e ti risponde con la stessa
            storia che ha raccontato ai sergenti, parola per parola. Quando alzi
            la voce si stende sulla paglia e chiude gli occhi. Galdrick ti apre
            la porta della cella senza commenti. Sulle scale ti dice che con lui
            ci sono voluti tre mesi, e che la lista aspetta.

      - testo: "Seguire il corriere fino ai Ponti"
        descrizione: "Ogni sera un ragazzo esce dalla porta delle cucine della Caserma con una lettera. Galdrick vuole sapere a chi la porta."
        prova: { attributo: fisico, abilita: [furtivita, atletica], difficolta: Media }
        successo:
          titolo: La porta delle cucine
          testo: |
            Il ragazzo esce dalla porta delle cucine dopo la seconda campana e
            prende la discesa dei Ponti a passo svelto, senza mai voltarsi. Lo segui a
            distanza di due lanterne, e quando sale su un ponte tu passi
            sull'altro e lo ritrovi dall'altra parte. Consegna la lettera a un
            facchino del Mercato dei Nodi, che la legge alla luce della lanterna
            e poi la brucia. Torni da Galdrick con il nome del facchino, e lui lo
            scrive sotto quello del ragazzo.
          segue: il-nome-nella-lista
        fallimento:
          titolo: Due lanterne
          testo: |
            Segui il ragazzo giù per la discesa, ma sul primo ponte si ferma di
            colpo ad allacciarsi uno stivale, e tu sei troppo vicino per
            fermarti anche tu. Lui ti guarda passare e torna indietro verso la
            Caserma fischiettando. Galdrick ti aspetta sul portone e ti dice che
            stanotte il ragazzo resterà in cucina, e che la lista aspetta.

      - testo: "Lasciare parlare il taccuino"
        descrizione: "Il taccuino di Galdrick ha una riga per ogni volta che sei passato da questo ufficio. Si può chiedergli di rileggerle tutte."
        costo: 2
        esito:
          titolo: Tutte le righe
          testo: |
            Gli chiedi di leggerti quello che ha scritto su di te, e lui si
            gratta la testa rasata prima di sedersi. Poi sfoglia il taccuino dall'inizio
            e legge ad alta voce, muovendo le labbra anche quando non serve,
            ogni riga con la sua data, comprese quelle che preferiresti non
            sentire. Ci vuole tutta la notte. All'alba chiude il taccuino e
            dice che una sera di lavoro non gli avrebbe detto niente di più.
          pe: { resilienza: 5 }
          segue: il-nome-nella-lista

      - testo: "Chiedergli perché adesso"
        descrizione: "Una lista che tiene da due anni, e il tuo nome proprio stasera."
        quando: [pista.pelle < 6]
        costo: 0
        esito:
          titolo: Un quarto
          testo: |
            «Perché un quarto dei miei prende la paga di Vesh, e non so quale
            quarto» dice. «Quelli della lista li ho scelti uno per uno fuori
            dalla Caserma, e nessuno di loro conosce gli altri. Se ne prendono
            uno, gli altri restano.» Si gira verso la finestra. «E perché in
            questi mesi tu sei andato dove io potevo mandare soltanto qualcuno
            di fuori, e ne sei sempre tornato.»

      - testo: "Chiedergli perché adesso"
        descrizione: "Vesh è morto, e la lista era cominciata per lui."
        quando: [pista.pelle >= 6]
        costo: 0
        esito:
          titolo: Dopo Vesh
          testo: |
            Galdrick si siede piano, con una mano sul fianco, e per un po'
            guarda la lampada. «La lista l'ho cominciata per Vesh, e adesso
            Vesh è morto» dice alla fine, senza alzare gli occhi. «In Città
            Bassa chi faceva i conti per lui adesso li fa per sé, e a me serve
            una ragione per alzarmi la mattina che non sia lui.» Si tocca la
            fasciatura sotto la giubba senza accorgersene, poi dice che nella
            lista vuole gente capace di lavorare anche senza un nemico davanti.

      - testo: "Chiedergli di Gaia Acari"
        descrizione: "Hai capito per chi lavora davvero Gaia Acari, la ragazzina con il cappuccio blu della Città Bassa."
        immagine: personaggi/gaia-acari
        quando: [gaia >= 2]
        costo: 0
        esito:
          titolo: Fuori dalla lista
          testo: |
            Galdrick chiude il taccuino prima di rispondere. «Gaia Acari nella
            lista non c'è, e non ci sarà mai» dice poi, scandendo le parole.
            «Ha tredici anni, e quello che fa lo fa perché l'ha deciso lei, e io
            non sono riuscito a farle cambiare idea. Le devo una cosa che
            risale a Ghoran, e che cosa sia resta fra me e lei.» Si passa una
            mano sulla testa rasata e ti chiede, se la incontri, di offrirle da
            mangiare senza farle domande.

      - testo: "Chiedergli del Cucitore"
        descrizione: "In città lo chiamano l'uomo che fermò il Cucitore. Lui non l'ha mai detto."
        immagine: ambientazione/evento-notti-cucite-145
        costo: 0
        esito:
          titolo: La spada nella teca
          testo: |
            Galdrick ti guarda come se gli avessi chiesto l'ora a un funerale. «Ivo
            Carstan è morto in un vicolo della Città Bassa, e io sono arrivato
            dopo» dice. «Il resto lo racconta la città, e la città racconta
            quello che le serve.» Poi riapre il taccuino e ti chiede se hai già
            deciso quale delle tre cose fare stanotte, con la stessa voce di
            prima. Sulla parete, dietro di lui, il giorno di oggi sul calendario
            non è ancora barrato.

      - testo: "Dirgli che non è il momento"
        descrizione: "Una lista segreta è un impegno senza divisa e senza nome. Puoi dirgli di aspettare."
        costo: 0
        esito:
          titolo: Lo spazio bianco
          testo: |
            Lo ringrazi, e gli dici che per adesso preferisci lavorare per la
            Caserma alla luce del giorno. Galdrick annuisce una volta sola
            con il mento e rimette il taccuino nella tasca della divisa. «Lo
            spazio bianco resta» dice. «I nomi di questa lista li scrivo piano,
            e li cancello soltanto con una riga dritta.» Poi gira la chiave
            nella porta e ti accompagna fino al portone con la lampada in mano.

  - id: il-nome-nella-lista
    immagine: personaggi/toren-galdrick
    titolo: Il nome nella lista
    tipo: seguito
    luogo: Guarnigione di Qir-Azel, l'ufficio dello sceriffo, all'alba
    area: quartieri-alti
    requisiti: [guarnigione.distintivo == 0]
    testo: |
      Quando torni nell'ufficio la lampada è quasi consumata e dalla finestra
      entra la prima luce grigia, insieme al rumore del furiere che apre il
      magazzino. Galdrick non ha dormito. Ha la divisa slacciata al collo e
      il taccuino aperto sul tavolo, all'ultima pagina, con la matita corta
      appoggiata di traverso sullo spazio bianco.

      «Nella lista nessuno ha il suo nome vero» dice. «Scegline uno che ti
      ricordi, perché se un giorno qualcuno legge questa pagina non deve
      arrivare a te.» Gira il taccuino verso di te. «Niente divisa e niente
      paga dal furiere, se non alla voce spese di servizio. Se ti prendono io
      non ti ho mai visto, e lo dico adesso perché dopo non potrò dirlo.
      Quando ti serve la Caserma, la Caserma c'è.»

      Ti porge la matita. È corta come un dito, consumata dalla parte del
      pollice, e ha i segni dei suoi denti vicino alla punta.

      *Con questa matita ha scritto ogni riga su di te, e adesso tocca a te.*
      La prendi, e le tue dita la tengono già dalla parte consumata.
    opzioni:
      - testo: "Scrivere un nome e firmare"
        descrizione: "Un nome falso nella lista dello sceriffo, e una paga che non passa dal registro."
        quando: [pista.pelle < 6]
        esito:
          titolo: Per motivi di servizio
          testo: |
            Scrivi il nome che hai scelto, e Galdrick ci mette accanto la data
            con la sua grafia. Poi chiude il taccuino e lo rimette nella tasca
            interna, contro il petto. «Di notte, se in Caserma non mi trovi,
            lascia detto alla Maison des Lunes, a Sara Beck» dice, guardando il
            calendario. «Per motivi di servizio.» Ti stringe la mano forte una
            volta sola e ti accompagna alla porta senza togliere i pollici
            dalla cintura.
          imposta: { guarnigione.distintivo: 1 }
          effetti: { rep.caserma: 1 }

      - testo: "Scrivere un nome e firmare"
        descrizione: "Un nome falso nella lista dello sceriffo, sotto quelli che c'erano la notte della Pignatta."
        quando: [pista.pelle >= 6]
        esito:
          titolo: Due righe dritte
          testo: |
            Prima di scrivere vedi che due nomi della lista sono barrati con una
            riga dritta, e accanto c'è la data della notte della Pignatta.
            Galdrick se ne accorge. «Le loro vedove le pago ancora io» dice, «e
            con la stessa matita.» Scrivi il nome che hai scelto, e lui ci mette
            accanto la data e rimette il taccuino contro il petto. «Di notte, se
            in Caserma non mi trovi, lascia detto alla Maison des Lunes, a Sara
            Beck. Per motivi di servizio.» Ti stringe la mano, e la tiene un
            poco più del solito.
          imposta: { guarnigione.distintivo: 1 }
          effetti: { rep.caserma: 1 }

      - testo: "Rendergli la matita"
        descrizione: "Per adesso preferisci restare fuori dal taccuino. La lista aspetta, e la prova si rifà."
        esito:
          titolo: La matita corta
          testo: |
            Gli rendi la matita senza scrivere niente. Galdrick la guarda sul
            palmo, poi la rimette dentro il taccuino a fare da segno, proprio
            sullo spazio bianco. «Va bene» dice, e chiude il taccuino. «Quando
            torni, una sera di lavoro te la chiedo di nuovo, perché anche i nomi
            di questa lista hanno le loro regole.» Fuori il furiere chiama il
            primo turno, e lo sceriffo va alla finestra a guardarlo.

  # ------------------------------------------------------------ la carta
  - id: carta-un-miliziano-in-difficolta
    immagine: ambientazione/citta-bassa
    titolo: L'elmo sul tetto
    sommario: "Un miliziano della Caserma guarda in su da un cortile della Città Bassa, e il suo elmo è sul tetto."
    luogo: Città Bassa, un cortile fra i panni stesi
    tipo: carta
    area: citta-bassa
    requisiti: [rep.caserma < 2]
    testo: |
      In un cortile della Città Bassa, fra due file di panni stesi, un
      miliziano giovanissimo con il mantello scarlatto sta in piedi sotto una
      grondaia e guarda in su. Il suo elmo è sul tetto, incastrato fra due
      tegole sconnesse, e sul colmo tre ragazzini scalzi gli fanno il verso
      battendo i tacchi. Uno si è messo in testa il cappuccio di maglia del
      miliziano, che gli arriva fino al naso.

      Il miliziano ha i baffi appena cominciati e le orecchie rosse fino alla
      punta. Ti spiega senza che tu gli chieda niente che fra mezz'ora deve
      presentarsi al posto di guardia, nella casa di pietra blu con le
      inferriate, e che senza elmo il sergente gli toglie la paga di una
      settimana. Da una finestra una donna che sbatte un tappeto ride così
      forte che il tappeto le scappa di mano e cade nel cortile.

      *Se torna senza elmo, in Caserma se lo ricordano per anni.* Intanto i
      ragazzini ti hanno notato, e aspettano di vedere che cosa fai.
    opzioni:
      - testo: "Salire sul tetto"
        descrizione: "Dalla grondaia al davanzale, e poi sulle tegole della Città Bassa, che reggono quando vogliono loro."
        prova: { attributo: fisico, abilita: [acrobazia, atletica], difficolta: Facile }
        successo:
          titolo: Il colmo del tetto
          testo: |
            Sali dalla grondaia al davanzale e dal davanzale alle tegole, e i
            ragazzini scappano dall'altra parte del colmo prima che tu arrivi.
            L'elmo viene via con una tegola attaccata. Quando lo riconsegni al
            miliziano lui se lo infila in testa ancora sporco di muschio e ti
            ringrazia tre volte. Al posto di guardia, dice, farà il tuo nome al
            sergente, perché in Caserma un favore si mette per iscritto.
          effetti: { rep.caserma: 0.5 }
        fallimento:
          titolo: La tegola
          testo: |
            A metà grondaia una tegola ti resta in mano, e tu scivoli giù fino
            al tappeto caduto nel cortile, che almeno attutisce. I ragazzini
            ridono così tanto che uno di loro fa cadere l'elmo dal tetto da
            solo. Il miliziano lo raccoglie e ti aiuta a rialzarti, più
            imbarazzato di te.
          effetti: { ferite: 0.5 }

      - testo: "Comprare l'elmo ai ragazzini"
        descrizione: "In Città Bassa ogni cosa ha il suo prezzo, anche un elmo della Caserma sul tetto sbagliato."
        requisiti: [monete >= 2]
        esito:
          titolo: Il prezzo del cappuccio
          testo: |
            Tiri fuori qualche moneta e la mostri al ragazzino con il cappuccio
            di maglia. Lui tira sul prezzo, poi cede quando fai per rimetterle
            in tasca. L'elmo arriva giù rotolando lungo le tegole, e il
            cappuccio subito dopo. Il miliziano li raccoglie tutti e due, rosso
            fino al collo, e ti promette che al posto di guardia farà il tuo
            nome al sergente.
          effetti: { monete: -2, rep.caserma: 0.5 }

      - testo: "Tirare dritto"
        descrizione: "Gli elmi della Caserma sono affare della Caserma."
        costo: 0
        esito:
          titolo: Fra i panni stesi
          testo: |
            Passi oltre fra i panni stesi, con un lenzuolo bagnato che ti
            scivola sulla nuca. Quando sei in fondo al cortile senti i
            ragazzini attaccare una filastrocca sul miliziano senza testa, e la
            donna alla finestra che chiama giù qualcuno perché le riporti il
            tappeto. Il miliziano non canta con loro, e resta sotto la grondaia
            a guardare in su.
