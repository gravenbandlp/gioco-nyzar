# La città viva, luogo 1: l'Accademia di Torvessa (presso: accademia-di-torvessa, area quartieri-alti).
# L'attività delle aule, le tre storie di rep.accademia (2 la lite delle mappe, 4 il registro delle allieve,
# 6 la cattedra, ognuna con il suo flag) e la carta di Pett. Il servizio (le lezioni di magia di Orvald,
# livelli 1–5) sta già in contenuti/aree/quartieri-alti.yaml.
# Reputazione: le storie la portano a 3, 5 e 7; l'assistente in aula la fa salire fino a 4 e la lezione
# tenuta da te fino a 6, così la catena è percorribile.
storylet:
  # ------------------------------------------------------------ l'attività ripetibile
  - id: le-aule-di-torvessa
    presso: accademia-di-torvessa
    immagine: ambientazione/accademia-di-torvessa
    titolo: Le aule di Torvessa
    sommario: "Al piano di sopra dell'Accademia si fa scuola, e a Orvald Temmerin due mani in più fanno sempre comodo."
    luogo: Accademia di Torvessa, le aule
    area: quartieri-alti
    ripetibile: true
    testo: |
      Il piano di sopra dell'Accademia di Torvessa è un corridoio lungo e
      chiaro, con le aule da una parte e dall'altra le finestre che guardano
      la Cicatrice. I banchi hanno il piano inclinato e un incavo per il
      calamaio, e su ogni cattedra c'è un cristallo conduttore montato su un
      supporto d'ottone. Sulla lavagna dell'aula grande qualcuno ha scritto
      una formula, e qualcun altro l'ha corretta in fondo con un gesso di
      un altro colore, senza cancellare niente.

      Dopo la razzia le lezioni sono riprese a metà. Gli allievi del primo
      anno sono pochi e si voltano ancora a ogni rumore dalla strada, e
      quelli più grandi fanno da maestri ai piccoli quando i maestri non
      bastano. L'odore del gesso ti si attacca alla gola e ti riporta a un
      banco qualsiasi, con le gambe troppo corte per arrivare a terra.

      In fondo al corridoio c'è lo studio di Orvald Temmerin, e sullo stipite
      sta appollaiato Pett, il corvo, che segue con la testa chiunque passi.
      Accanto alla porta, su un chiodo, è appeso un foglio con la grafia
      stretta del preside, *cercasi assistenti per le aule*, e sotto un'altra
      mano ha aggiunto a matita *il caffè è cattivo*.
    opzioni:
      - testo: "Fare gli esercizi con i cristalli"
        descrizione: "Gli esercizi del primo anno, per chi non ha ancora sentito un cristallo rispondere."
        immagine: ambientazione/cristalli-conduttori
        requisiti: [magia <= 1, pista.arena < 2]
        prova: { attributo: mentale, abilita: magia, difficolta: "Molto facile" }
        successo:
          titolo: Il primo calore
          testo: |
            Ti siedi in fondo all'aula fra due ragazzini del primo anno, con
            un cristallo grezzo fra i palmi, e l'allievo grande che fa lezione
            vi dice di respirare piano e di ascoltare. Per molto tempo senti
            soltanto il ragazzino accanto che tira su col naso. Poi il
            cristallo si intiepidisce sotto le dita, come una pietra lasciata
            al sole, e una venatura si accende d'azzurro. Il ragazzino se ne
            accorge e smette di tirare su col naso per guardare.
        fallimento:
          titolo: Un sasso freddo
          testo: |
            Ti siedi in fondo all'aula con un cristallo grezzo fra i palmi e
            respiri come vi hanno detto, contando fino a quattro. Il cristallo
            resta freddo. Accanto a te un bambino di dieci anni ci riesce al
            terzo tentativo e ti guarda con una compassione che non ti
            aspettavi. L'allievo che fa lezione ti dice che a molti la prima
            volta arriva dopo la decima, e intanto ti cambia il cristallo con
            uno più piccolo.

      - testo: "Fare gli esercizi con i cristalli"
        descrizione: "Besk Dravec ti ha visto combattere in Arena. Adesso vuole vedere che cosa fai con un cristallo in mano."
        immagine: personaggi/besk-dravec
        requisiti: [magia <= 1, pista.arena >= 2]
        prova: { attributo: mentale, abilita: magia, difficolta: "Molto facile" }
        successo:
          titolo: Il quaderno nella manica
          testo: |
            Besk ti trova in fondo all'aula e si siede accanto a te senza
            chiedere. Ti sistema le dita intorno al cristallo, si sistema gli
            occhiali e ti spiega a voce rapida come si respira, due volte,
            perché la prima andava troppo veloce anche per lei. Quando una
            venatura si accende d'azzurro tira fuori il quaderno dalla manica
            e ci scrive una riga. «In Arena eri più bravo con le cose che
            ti corrono addosso» dice, «però questo non era male.»
        fallimento:
          titolo: Troppo forte
          testo: |
            Besk ti trova in fondo all'aula e si siede accanto a te. Stringi il
            cristallo così forte che ti si sbiancano le nocche, e lei ti apre
            le dita una alla volta. «È un cristallo, mica una bestia dell'Arena.
            Tenerlo fermo non serve» dice a voce rapida, e poi si scusa di
            averlo detto. Il cristallo resta freddo per tutta l'ora. A fine
            lezione Besk scrive qualcosa sul quaderno che tiene nella manica, e
            quando provi a sbirciare lo chiude.

      - testo: "Fare da assistente in aula"
        descrizione: "Orvald ha bisogno di qualcuno che distribuisca i cristalli e tenga in ordine l'aula. Chi se la cava torna il giorno dopo."
        requisiti: [rep.accademia < 2]
        prova: { attributo: mentale, abilita: [accademiche, magia], difficolta: Media }
        successo:
          titolo: Il gesso e i cristalli
          testo: |
            Passi la mattina a fare quello che Orvald non ha tempo di fare.
            Distribuisci i cristalli all'inizio dell'ora e li ritiri alla fine
            contandoli, e quando un ragazzo sbaglia il verso di una formula
            gliela correggi a bassa voce prima che se ne accorga il preside.
            Orvald ti allunga due spiccioli senza guardarti. «Domani alla
            stessa ora» dice, già voltato verso lo studio.
          effetti: { monete: 1, rep.accademia: 0.5 }
        fallimento:
          titolo: Il conto dei cristalli
          testo: |
            Distribuisci i cristalli all'inizio dell'ora, e alla fine, quando
            li ritiri, ne manca uno. Lo cerchi sotto i banchi mentre gli
            allievi aspettano, e Orvald aspetta con loro a braccia conserte. Lo
            trova Pett, nella tasca di un ragazzino del primo anno che giura di
            non sapere come ci sia finito. Orvald ti dice che domani i cristalli
            li conta lui, e dal tono capisci che li conterà due volte.

      - testo: "Fare da assistente in aula"
        descrizione: "Ormai Orvald ti lascia correggere gli esercizi del secondo anno, e ogni tanto anche spiegarli."
        requisiti: [rep.accademia >= 2, rep.accademia < 4]
        prova: { attributo: mentale, abilita: [accademiche, magia], difficolta: Media }
        successo:
          titolo: La nota a margine
          testo: |
            Orvald ti affida i quaderni del secondo anno e una penna rossa, e
            va a fare lezione nell'aula accanto. Correggi gli esercizi uno per
            uno, e a margine scrivi dove hanno sbagliato e perché, con la
            grafia più chiara che hai. Quando torna ne sfoglia due a caso e si
            ferma su una tua nota, la legge due volte e la lascia dov'è. Ti
            paga e ti dà un'altra pila di quaderni, che dalle sue parti vale
            come una promozione.
          effetti: { monete: 2, rep.accademia: 0.5 }
        fallimento:
          titolo: La penna rossa
          testo: |
            Orvald ti affida i quaderni del secondo anno e una penna rossa. Al
            decimo esercizio segni come sbagliata una formula giusta, scritta
            in una variante che non conoscevi, e l'allieva va a protestare dal
            preside con il quaderno aperto. Orvald le dà ragione con calma
            davanti a te, poi ti spiega la variante alla lavagna come se fossi
            del primo anno. Pett segue tutta la lezione dalla trave, con
            interesse.

      - testo: "Ricopiare formule per gli allievi"
        descrizione: "I libri di formule sono pochi e cari, e gli allievi pagano chi glieli ricopia in bella grafia."
        prova: { attributo: mentale, abilita: accademiche, difficolta: Facile }
        successo:
          titolo: Bella copia
          testo: |
            Ti siedi nella saletta degli allievi con un libro di formule
            prestato per un giorno e un quaderno nuovo, e ricopi fino a sera.
            Le formule dell'Arte dei cristalli hanno segni che non perdonano, e
            una virgola spostata cambia la direzione del Mana. Le tue restano
            al loro posto. La ragazza che ti ha chiesto la copia la controlla
            riga per riga con l'indice, e alla fine ti paga senza discutere il
            prezzo.
          effetti: { monete: 3 }
        fallimento:
          titolo: La goccia
          testo: |
            Ricopi fino a sera nella saletta degli allievi, e verso la fine una
            goccia d'inchiostro cade proprio su una formula e se ne mangia
            metà. Provi a ricostruirla a memoria, ma la ragazza che ti ha
            chiesto la copia se ne accorge alla prima lettura e ti fa vedere
            dove hai sbagliato. Ti paga soltanto la carta e si porta via il
            quaderno lo stesso.
          effetti: { monete: 1 }

      - testo: "Portare fuori Pett"
        descrizione: "Il corvo del preside va portato a prendere aria due volte al giorno, e la strada la decide lui."
        immagine: personaggi/orvald-temmerin
        esito:
          titolo: Il giro di Pett
          testo: |
            Pett ti sale sulla spalla senza chiedere il permesso e ti guida
            con piccoli colpi di becco sull'orecchio, a destra verso la fontana
            e a sinistra verso il forno. Al forno si fa dare un pezzo di crosta
            dal fornaio, che lo saluta per nome. Sulla via del ritorno si ferma
            su un davanzale a guardare un gatto per un tempo lunghissimo.
            Quando lo riporti allo studio Orvald ti chiede soltanto se ha
            mangiato al forno, e alla risposta sospira.
          pe: { addestrare-animali: 2 }

      - testo: "Tenere una lezione ai primi anni"
        descrizione: "Orvald ha due lezioni alla stessa ora. Una la tiene lui, e l'altra tu, davanti a trenta ragazzini che aspettavano il preside."
        requisiti: [rep.accademia >= 4, rep.accademia < 6]
        prova: { attributo: sociale, abilita: espressivita, difficolta: Difficile }
        successo:
          titolo: Trenta ragazzini
          testo: |
            Entri in aula e trenta ragazzini smettono di parlare per guardare
            chi c'è al posto del preside. Cominci raccontando la prima volta
            che hai visto un cristallo accendersi, e solo quando li hai tutti
            spieghi la formula, una riga alla volta, facendola ripetere in
            coro. A metà ora uno alza la mano e chiede se fuori dalle mura ci
            sono davvero i mostri dei libri, e il resto dell'ora va a finire lì.
            La formula comunque se la ricordano tutti, e Orvald ti paga la
            lezione come a un maestro vero.
          pe: { accademiche: 2 }
          effetti: { monete: 5, rep.accademia: 0.5 }
        fallimento:
          titolo: La terza fila
          testo: |
            Entri in aula con la lezione preparata riga per riga, e alla terza
            riga la terza fila ha già smesso di ascoltarti. Alzi la voce, e
            smettono anche le prime due. Quando un ragazzino fa cadere apposta
            il cristallo scoppiano a ridere tutti, e tu perdi il filo per il
            resto dell'ora. Orvald entra a fine ora e guarda la lavagna e poi
            la classe, e da quel momento in aula non vola una mosca. Ti paga
            metà della lezione senza commenti.
          effetti: { monete: 2 }

      - testo: "Tenere una lezione sui cristalli"
        descrizione: "Al terzo anno la teoria la sanno già. Serve qualcuno che gli faccia sentire il Mana sotto le dita."
        immagine: ambientazione/cristalli-conduttori
        requisiti: [rep.accademia >= 4, rep.accademia < 6]
        prova: { attributo: mentale, abilita: magia, difficolta: Difficile }
        successo:
          titolo: La nota del cristallo
          testo: |
            Metti sul tavolo un cristallo carico e ci fai passare dentro il
            Mana piano, finché comincia a ronzare. Poi chiami gli allievi uno
            alla volta a sentirlo con le dita e a dirti in che punto cambia
            nota. A fine ora lo sentono quasi tutti, e due lo sentono prima di
            te. Orvald, che ha ascoltato dalla porta, ti paga la lezione e ti
            chiede dove hai imparato quel trucco.
          pe: { accademiche: 2 }
          effetti: { monete: 5, rep.accademia: 0.5 }
        fallimento:
          titolo: Il fischio
          testo: |
            Metti sul tavolo un cristallo carico e ci spingi dentro il Mana
            troppo in fretta, e la nota sale fino a fischiare. Gli allievi
            della prima fila si tappano le orecchie, e il cristallo si incrina
            con un rumore secco. Orvald arriva dall'aula accanto e guarda la
            crepa. Ti dice che i cristalli dell'Accademia li paga lui, e che
            per oggi la lezione la paga a metà.
          effetti: { monete: 2 }

      - testo: "Tenere la tua ora di lezione"
        descrizione: "Un'ora alla settimana è tua. L'aula piccola ti aspetta, e nel cassetto gli allievi ti lasciano i compiti."
        requisiti: [accademia.cattedra >= 1]
        prova: { attributo: mentale, abilita: [magia, accademiche], difficolta: Media }
        successo:
          titolo: Il cassetto del maestro
          testo: |
            Apri il tuo cassetto, dove gli allievi lasciano i compiti e
            qualche volta un biglietto con la domanda che non hanno avuto il
            coraggio di fare in aula. Rispondi ai biglietti prima della
            lezione, poi spieghi la formula della settimana. A fine ora un
            ragazzo resta indietro a chiederti una cosa fuori dal programma, e
            gli rispondi lo stesso. Il tesoriere dell'Accademia ti conta la
            paga sospirando a ogni moneta.
          effetti: { monete: 8 }
        fallimento:
          titolo: Un'ora storta
          testo: |
            La formula della settimana ti si ingarbuglia sulla lavagna, e
            un'allieva del terzo anno te la corregge dal banco con molta
            gentilezza. Il resto dell'ora va avanti un po' storto, e tu
            arrossisci ogni volta che lei alza la mano. Il tesoriere ti
            conta la paga intera, perché il contratto dice un'ora e l'ora
            l'hai fatta.
          effetti: { monete: 6 }

  # ------------------------------------------------------------ storia a 2 · la lite delle mappe
  - id: la-lite-delle-mappe
    presso: accademia-di-torvessa
    immagine: personaggi/tobol-aspern
    titolo: La lite delle mappe
    sommario: "Orvald Temmerin e Tobol Aspern litigano su una mappa vecchia di trent'anni, e Ottilia Sanvel, che di solito li mette d'accordo, oggi non c'è."
    luogo: Accademia di Torvessa, lo studio del preside
    area: quartieri-alti
    requisiti: [rep.accademia >= 2, accademia.tobol == 0]
    testo: |
      Le voci ti arrivano dallo studio di Orvald prima ancora che tu sia in
      fondo al corridoio, e Pett ha lasciato lo stipite per rifugiarsi
      sull'architrave della finestra. Sulla scrivania, fra il teschio di
      cinghiale mutato e un calamaio che fa da fermacarte, è srotolata una
      mappa ingiallita con la grafia stretta del preside. In un angolo c'è
      scritto *Gradone Rosso, scavo del centoventi*, e lungo la scarpata
      scende un sentiero tratteggiato fino a una croce.

      Dall'altra parte della scrivania c'è uno gnomo anziano con i capelli
      rossi sbiaditi raccolti in una coda, gli occhiali tondi sul naso e un
      gilet ricamato a fiori arancioni. La cravatta è verde a pois gialli.
      Sulla spalla tiene un geco verde brillante, che guarda la mappa con un
      occhio solo. «Sono Tobol Aspern, il cartografo. Lui è Whisp» dice senza
      voltarsi. «Tu devi essere quello che Orvald fa lavorare per una miseria.
      Ottimo, mi serve un testimone.»

      «Il sentiero esiste» dice Orvald. «L'ho fatto trenta volte, con un
      mulo carico.»

      «Trent'anni fa» dice Tobol, e batte il dito sulla croce. «Io ci sono
      passato due estati fa, e al posto del tuo sentiero c'è un muro di
      sabbia rossa alto come la Cattedrale. Di solito decide Ottilia, mio
      caro, ma oggi ha i novizi.» Si gira verso di te e si sistema gli
      occhiali. «Quindi decidi tu.»

      *Questa lite è più vecchia di me, e mi sopravviverà.* Ti accorgi di
      avere ancora una mano sulla maniglia, e la lasci andare.
    opzioni:
      - testo: "Studiare la mappa e il diario di scavo"
        descrizione: "Orvald scriveva tutto, anche trent'anni fa. Da qualche parte, sulla carta, ci deve essere quello che è successo dopo."
        prova: { attributo: mentale, abilita: [percezione, accademiche], difficolta: Media }
        successo:
          titolo: La nota a margine
          testo: |
            Mentre i due discutono sopra la tua testa ti chini sulla mappa con
            la lente del preside. In basso, quasi coperta da una macchia di tè,
            c'è una nota piccola con la stessa grafia del sentiero, *arenaria
            che si sfoglia sopra la croce, non passarci dopo le piogge*. La
            leggi ad alta voce. Orvald si zittisce, e Tobol batte le mani una
            volta sola. Avevano ragione tutti e due, ciascuno nella sua estate,
            e adesso devono correggere due mappe. Tobol ti paga la scoperta di
            tasca sua, perché dice che le notizie esatte si pagano anche quando
            danno ragione a Orvald.
          pe: { accademiche: 5 }
          imposta: { accademia.tobol: 3 }
          effetti: { rep.accademia: 1, monete: 5 }
        fallimento:
          titolo: Una macchia di tè
          testo: |
            Studi la mappa a lungo, mentre i due discutono sopra la tua testa,
            e trovi soltanto una vecchia macchia di tè nell'angolo in basso.
            Quando provi a dire qualcosa di sensato sulla scala Tobol ti
            corregge con tre numeri, e Orvald gli dà ragione, sorpreso lui
            stesso. Per qualche minuto sono d'accordo su di te. Poi tornano a
            litigare fra loro, e tu esci dallo studio senza che nessuno dei due
            se ne accorga.

      - testo: "Ragionare sulla roccia del Gradone"
        descrizione: "Il Gradone Rosso è una scarpata di arenaria. Chi conosce la pietra sa che cosa le fanno trent'anni di piogge."
        prova: { attributo: mentale, abilita: natura, difficolta: Media }
        successo:
          titolo: Trent'anni di piogge
          testo: |
            Chiedi a Tobol com'era il muro di sabbia, e lui te lo descrive con
            precisione. Era a strati sottili, e in cima aveva le radici degli
            arbusti scoperte. È una frana, e nemmeno tanto vecchia. L'arenaria
            del Gradone si sfoglia a ogni pioggia, e un sentiero scavato sul
            fianco della scarpata in trent'anni può sparire senza che nessuno
            lo veda cadere. Orvald e Tobol ti ascoltano e poi si guardano.
            Avevano ragione tutti e due, e adesso devono correggere due mappe.
            Tobol ti paga la spiegazione e la scrive a margine, con il tuo
            nome.
          pe: { natura: 5 }
          imposta: { accademia.tobol: 3 }
          effetti: { rep.accademia: 1, monete: 5 }
        fallimento:
          titolo: La pietra sbagliata
          testo: |
            Spieghi con sicurezza che il Gradone è di granito e che il granito
            tiene, e Tobol ti lascia arrivare in fondo con un sorriso sempre
            più largo. Poi tira fuori dal taschino del gilet un sasso rosso e
            te lo mette in mano, e il sasso ti si sbriciola fra le dita. Orvald
            ride per la prima volta da quando sei entrato, e Pett torna sullo
            stipite. La lite riprende subito dopo, più allegra di prima.

      - testo: "Dare ragione a Orvald"
        descrizione: "Il sentiero l'ha percorso lui con il mulo, trenta volte. Una mappa disegnata da chi ci è passato vale più di una visita."
        immagine: personaggi/orvald-temmerin
        esito:
          titolo: Il sentiero del mulo
          testo: |
            Dici che una mappa disegnata da chi ci è passato trenta volte vale
            più di una visita di due estati, e che i muri di sabbia vanno e
            vengono. Orvald annuisce una volta sola. Tobol si toglie gli
            occhiali, li pulisce sulla cravatta e se li rimette, poi arrotola
            la mappa, che è di Orvald, e se la porta via lo stesso. Orvald ti
            versa una tazza di caffè cattivo come promesso, poi ti racconta
            dello scavo del centoventi finché la tazza non è vuota. «Domani
            Tobol torna con una cravatta nuova» dice, soffiando sul caffè. «È
            il suo modo di chiedere scusa.»
          pe: { galateo: 5 }
          imposta: { accademia.tobol: 1 }
          effetti: { rep.accademia: 1, informazioni.pettegolezzo: 1 }

      - testo: "Dare ragione a Tobol"
        descrizione: "Tobol è passato di lì due estati fa, Orvald trent'anni fa. Una mappa vale quanto l'ultima volta che qualcuno l'ha controllata."
        immagine: personaggi/tobol-aspern
        esito:
          titolo: Il silenzio del corvo
          testo: |
            Dici che una mappa vale quanto l'ultima volta che qualcuno l'ha
            controllata, e che il sentiero, se c'era, adesso non c'è più. Tobol
            batte le mani una volta, e Whisp gli corre dalla spalla alla testa.
            Sull'architrave Pett smette di lisciarsi le penne e resta immobile,
            e dopo un momento capisci il perché. Orvald arrotola la mappa con
            molta cura e la rimette nello scaffale senza una parola. «Bene»
            dice soltanto. Sulla porta Tobol ti paga la tua opinione il doppio
            di quanto vale, e ti sussurra che il silenzio del corvo vale molto
            di più.
          pe: { galateo: 5 }
          imposta: { accademia.tobol: 2 }
          effetti: { rep.accademia: 1, monete: 8 }

      - testo: "Farli ridere tutti e due"
        descrizione: "Due vecchi amici litigano su un sentiero di trent'anni fa. Qualcuno deve farli smettere prima dell'ora di cena."
        prova: { attributo: sociale, abilita: [espressivita, empatia], difficolta: Media }
        successo:
          titolo: Il percorso consigliato
          testo: |
            Prendi un foglio dalla scrivania e disegni in fretta una terza
            mappa, con la croce dello scavo in fondo alla scarpata e un
            sentiero che fa un giro lunghissimo intorno a due vecchi che
            litigano. Sotto scrivi *percorso consigliato*, imitando la grafia
            di Orvald. Tobol guarda il foglio e poi Orvald, e scoppia a ridere
            così forte che Whisp gli scivola dalla spalla. Orvald resiste un
            poco di più. Alla fine attacca il tuo disegno al muro, accanto alle
            mappe vere, e Tobol ti paga subito, perché è il primo disegno
            onesto di tutto lo studio.
          pe: { espressivita: 5 }
          imposta: { accademia.tobol: 3 }
          effetti: { rep.accademia: 1, monete: 5 }
        fallimento:
          titolo: Lo scherzo sbagliato
          testo: |
            Provi a sdrammatizzare con una battuta sull'età di tutti e due, e
            la sbagli di qualche decennio. Tobol, che di anni ne ha centodieci,
            se la prende per Orvald, e Orvald se la prende per Tobol. Per
            qualche minuto sono alleati contro di te e ti spiegano a due voci
            quanto vivono gli gnomi e quanto gli umani. Poi tornano alla mappa,
            e la lite ricomincia da dove l'avevano lasciata. Pett, dall'architrave,
            ti guarda con compatimento.

  # ------------------------------------------------------------ storia a 4 · il registro delle allieve
  - id: il-registro-delle-allieve
    presso: accademia-di-torvessa
    immagine: personaggi/orvald-temmerin
    titolo: Il registro delle allieve
    sommario: "Orvald Temmerin ha saputo chi hai riportato in città dalle rovine. Stasera ti aspetta nello studio con un registro sulla scrivania."
    luogo: Accademia di Torvessa, lo studio del preside, di sera
    area: quartieri-alti
    requisiti: [rep.accademia >= 4, accademia.aurenne == 0, pista.capomozzo >= 6]
    testo: |
      La sera l'Accademia è vuota, e i tuoi passi nel corridoio rimbombano
      come in una chiesa. Lo studio di Orvald è illuminato da una sola lampada
      a cristallo, posata sulla scrivania accanto a un registro rilegato in
      tela grigia, con *centoquarantuno* scritto sul dorso. Il cassetto in
      basso, quello che ha sempre la chiave nella serratura, adesso è aperto.
      Pett sta sulla trave con le penne raccolte e non si muove.

      Orvald non ti fa sedere. «Ottilia mi ha detto che Aurenne è viva, e che
      l'hai riportata tu» dice. «Non mi ha detto altro, e conoscendola vuol
      dire che c'è molto altro.» Apre il registro a una pagina d'inverno e ti
      mostra l'elenco delle allieve, scritto con la sua grafia. Fra due nomi
      c'è una riga lasciata vuota.

      «Sollen mi chiese di non scriverla, e io obbedii perché obbedire era
      comodo» dice, e dal cassetto tira fuori tre fogli piegati. «Era
      taciturna, con i capelli d'argento, e diceva di sentire delle voci. Gli
      altri la tormentavano e io lo sapevo. Amyll e le sue amiche, e più di
      tutti Rennick Dole, che era il peggiore.» Si ferma, e riprende con la
      stessa voce. «Io le davo molti compiti. Pensavo che chi lavora non ha
      tempo di stare male, e non ho fatto nient'altro.»

      *Ha preparato questo discorso per nove anni, e lo dice male lo stesso.*
      Ti accorgi di stringere il bordo della scrivania, e lo lasci.
    opzioni:
      - testo: "Chiedergli perché non ha fatto niente"
        descrizione: "Un preside ha in mano più di un registro. Orvald lo sa meglio di te."
        costo: 0
        esito:
          titolo: Comodo
          testo: |
            «Perché era comodo» dice Orvald, e non cerca un'altra parola.
            «Sollen era il cappellano della Cattedrale e chiedeva discrezione.
            I ragazzi che la tormentavano avevano genitori che venivano a
            parlarmi una volta al mese, e lei non si lamentava mai. Io prendevo
            il suo silenzio per pazienza.» Si passa una mano sulla barba corta.
            «Era quella che costava meno lasciare sola. Te lo dico perché tu
            non mi trovi una scusa che io non ho.»

      - testo: "Raccontargli del diario"
        descrizione: "Nel diario di Aurenne c'è un inverno all'Accademia, e c'è il suo nome."
        requisiti: [oggetto.diario-di-aurenne >= 1]
        costo: 0
        esito:
          titolo: Tanti di quei compiti
          testo: |
            Gli racconti del quaderno dalla copertina azzurra e di quella
            pagina d'inverno. Il Maestro Temmerin le dava tanti di quei compiti
            che lei non li avrebbe mai finiti. Intanto Amyll e le altre
            spingevano i banchi contro la porta del bagno dove si era chiusa.
            Ci è rimasta fino a notte, al buio. Orvald ascolta fino in fondo
            senza interromperti, poi dice che d'inverno, la sera, lui scendeva
            nel seminterrato a riordinare la collezione, e che laggiù dal piano
            di sopra non arrivava nessun rumore. Chiude il registro con tutte e
            due le mani. Pett, sulla trave, sposta la testa di un grado.

      - testo: "Chiedergli di Rennick Dole"
        descrizione: "Il peggiore, dice Orvald. In città c'è ancora chi lo ricorda come il bullo della scuola."
        costo: 0
        esito:
          titolo: Il peggiore
          testo: |
            «Rennick la picchiava di rado. Faceva di peggio, perché era bravo a
            farsi seguire» dice Orvald. «Decideva lui come la si chiamava
            quella settimana, e la settimana dopo la chiamava così tutta la
            scuola.» Racconta che i suoi amici ridevano a ogni parola, e che gli
            altri ragazzi ridevano con loro per non diventare il bersaglio
            successivo. A lezione Rennick era educatissimo. Orvald lo dice guardando la
            riga vuota del registro, e aggiunge che a lui questo bastava per
            non vedere il resto.

      - testo: "Dirgli che avrebbe dovuto accorgersene"
        descrizione: "Lo sa già. Forse ha bisogno di sentirlo dire da qualcuno che non sia lui."
        esito:
          titolo: Una sera
          testo: |
            Gli dici che un maestro che vede un'allieva tormentata e le dà più
            compiti ha già scelto da che parte stare. Orvald ti ascolta senza
            distogliere lo sguardo, e alla fine annuisce piano. «Hai ragione»
            dice, e per un po' guarda la riga vuota. «A me sono serviti nove
            anni e un incendio per dirmelo da solo, e a te una sera.» Rimette i
            fogli nel cassetto, e questa volta lascia la chiave sul tavolo. Ti
            accompagna alla porta con la lampada in mano, e sul corridoio buio
            ti ringrazia di non essere stato gentile.
          pe: { resilienza: 5 }
          imposta: { accademia.aurenne: 1 }
          effetti: { rep.accademia: 1 }

      - testo: "Leggere le sue note su di lei"
        descrizione: "Tre fogli piegati, scritti nove anni fa da un maestro che preferiva guardare altrove."
        esito:
          titolo: Tre fogli
          testo: |
            Le note sono brevi, con la data in cima a ogni foglio. Sul primo
            Orvald ha scritto *risponde per enigmi, dice di sentire delle voci*.
            Nel secondo ha ricopiato una frase di Sollen, che il mondo non era
            pronto per la benedizione di sua figlia, e accanto ha messo un
            punto interrogativo. Il terzo è quasi bianco, con una data di
            primavera e una parola sola, *ritirata*. Orvald ti lascia leggere
            in silenzio. Poi riprende i fogli e li rimette nel cassetto, e
            questa volta lascia la chiave sul tavolo.
          pe: { accademiche: 5 }
          imposta: { accademia.aurenne: 1 }
          effetti: { rep.accademia: 1 }

      - testo: "Portare ad Aurenne qualcosa da parte sua"
        descrizione: "Lei è in Cattedrale, e la strada la conosci. Se Orvald ha qualcosa da darle, puoi portarglielo tu."
        immagine: ambientazione/cattedrale-del-velo
        esito:
          titolo: Il compito
          testo: |
            Orvald ci pensa a lungo. Poi apre il registro all'ultima pagina,
            dove è rimasto infilato un foglio di quaderno piegato in quattro, e
            te lo porge. È un esercizio sui cristalli, con il titolo in una
            grafia tonda da scolara e due fiori disegnati a margine. «È
            l'ultimo compito che mi ha consegnato. Non l'ho mai corretto e non
            gliel'ho mai restituito» dice. «Sopra non ci scrivo niente, perché
            qualunque cosa ci scrivessi adesso la scriverei per me.» Ti
            accompagna fino al portone e lo chiude piano, dietro di te.
          pe: { empatia: 5 }
          imposta: { accademia.aurenne: 1 }
          effetti: { rep.accademia: 1 }
          segue: il-compito-di-aurenne

  - id: il-compito-di-aurenne
    immagine: ambientazione/cattedrale-del-velo
    titolo: Il compito di Aurenne
    tipo: seguito
    luogo: Cattedrale del Velo, la mattina dopo
    area: quartieri-alti
    requisiti: [accademia.aurenne >= 1]
    testo: |
      La mattina dopo attraversi i Quartieri Alti con il foglio piegato nella
      giubba, e ogni tanto ci posi sopra la mano per sentire che c'è ancora.
      Sul sagrato della Cattedrale lo apri contro il parapetto. L'esercizio
      chiede di descrivere che cosa si sente quando un cristallo risponde. La
      ragazza che l'ha scritto ha riempito una pagina e mezza, e a un certo
      punto ha scritto che il cristallo le parlava come le parlavano le voci,
      solo più gentile. In fondo lo spazio per il voto è rimasto vuoto, e
      accanto c'è un fiore a matita cominciato e lasciato a metà.

      *Dall'Accademia alla Cattedrale ci sono tre strade, e a questo foglio
      sono serviti nove anni.* Lo ripieghi lungo le pieghe vecchie.

      Dentro, la navata è fresca e odora di cera. Un novizio ti riconosce e va
      a chiamare Ottilia Sanvel, che arriva dal chiostro con le maniche
      rimboccate e guarda il foglio che hai in mano prima di guardare te.
    opzioni:
      - testo: "Darlo ad Aurenne"
        descrizione: "È sveglia, nella sala di preghiera più interna. Ottilia ti accompagna fino alla porta."
        immagine: personaggi/aurenne
        requisiti: [pista.capomozzo >= 9]
        esito:
          titolo: Una pagina e mezza
          testo: |
            Aurenne è seduta sulla panca della sala di preghiera. Quando
            riconosce la grafia prende il foglio con la mano buona e tiene
            l'artiglio lontano, appoggiato sul ginocchio. Legge tutta la
            pagina e mezza muovendo appena le labbra. «Il Maestro Temmerin
            dava tanti compiti» dice alla fine, con la voce piatta, e ti chiede
            se ci ha scritto qualcosa. Le dici di no, e che è stato lui a non
            volerlo. Aurenne piega il foglio in quattro e lo infila sotto la
            corazza, contro il petto. Poi torna a guardare la luce delle
            vetrate e non ti chiede altro.
          pe: { empatia: 3 }
      - testo: "Lasciarlo a Ottilia"
        descrizione: "Aurenne dorme ancora, e Padre Vantes non vuole visite. Ottilia decide da sola che cosa entra in quella stanza."
        immagine: personaggi/ottilia-sanvel
        requisiti: [pista.capomozzo < 9]
        esito:
          titolo: Quando si sveglia
          testo: |
            Ottilia ti dice che Aurenne dorme ancora e che per adesso non entra
            nessuno. Prende il foglio e lo legge in piedi nella navata,
            dall'inizio alla fine, poi lo ripiega lungo le stesse pieghe.
            «L'ho conosciuta. Pregava male, però veniva» dice. «Quando si
            sveglia glielo do io, e a Orvald di' che è arrivato.» Infila il
            foglio nella manica della tunica nera e torna verso il chiostro con
            il suo passo regolare.
          pe: { empatia: 3 }
      - testo: "Tenerlo per te"
        descrizione: "Forse è presto, o forse il messaggero giusto è un altro."
        esito:
          titolo: Nella giubba
          testo: |
            Dici a Ottilia che hai sbagliato porta, e lei ti guarda il tempo
            che le serve per capire che non è vero. Torni sul sagrato e resti
            al parapetto con il foglio in mano finché le campane suonano l'ora.
            Poi lo rimetti nella tasca interna della giubba e torni indietro
            per la strada più lunga. Orvald non ti chiederà se l'hai
            consegnato, e tu non avrai bisogno di mentirgli.

  # ------------------------------------------------------------ storia a 6 · la cattedra
  - id: una-cattedra-a-torvessa
    presso: accademia-di-torvessa
    immagine: personaggi/orvald-temmerin
    titolo: Una cattedra a Torvessa
    sommario: "Orvald Temmerin ti fa sedere, per la prima volta, e mette sulla scrivania una chiave di ferro."
    luogo: Accademia di Torvessa, lo studio del preside
    area: quartieri-alti
    requisiti: [rep.accademia >= 6, accademia.cattedra == 0]
    testo: |
      Questa volta Orvald ti fa sedere, ed è la prima volta da quando
      frequenti l'Accademia. La sedia degli ospiti ha una gamba più corta
      delle altre, e lui ci ha messo sotto un libro di formule perché non
      dondoli. Sulla scrivania, fra le mappe, ci sono una chiave di ferro
      lunga quanto un dito e un'etichetta di cartone ancora bianca. Pett
      passeggia avanti e indietro sul bordo della scrivania, e tiene d'occhio
      la chiave.

      «Il consiglio dei maestri ha accettato di darti una cattedra da maestro
      aggiunto» dice Orvald, e picchietta l'etichetta con la nocca. «Un'ora
      alla settimana nell'aula piccola, e un cassetto con il tuo nome. Questa
      invece è la chiave del seminterrato, che finora avevamo soltanto io e
      Tobol.» Si appoggia allo schienale. «Il consiglio vuole una prova, e qui
      le prove si scelgono. Puoi tenere una lezione al terzo anno, oppure
      rispondere a tre domande dei maestri, che sono cinque vecchi e si
      annoiano. La terza strada è una richiesta mia. Stamattina ho sgridato
      Pett per una tazza rotta, e lui si è vendicato nascondendo un pezzo
      della collezione. Se me lo ritrovi, il consiglio lo conta come prova,
      visto che lo decido io.»

      Pett smette di passeggiare e si mette a guardare il soffitto.
    opzioni:
      - testo: "Tenere la lezione al terzo anno"
        descrizione: "Trenta allievi che sanno abbastanza da accorgersi se sbagli, e Orvald seduto all'ultimo banco."
        immagine: ambientazione/cristalli-conduttori
        prova: { attributo: sociale, abilita: [espressivita, persuasione], difficolta: Difficile }
        successo:
          titolo: L'ultimo banco
          testo: |
            Gli allievi del terzo anno ti aspettano a braccia conserte, e
            Orvald si siede all'ultimo banco con Pett sulla spalla. Scegli la
            formula che a te è costata più fatica e cominci raccontando come
            l'hai sbagliata tu. Un allievo ride, un altro si mette a prendere
            appunti, e a metà ora le mani si alzano per fare domande vere.
            Quando suona la campana nessuno si alza subito. Orvald esce per
            primo senza dire niente, e dal corridoio lo senti dire a Tobol che
            la lezione è andata.
          pe: { espressivita: 5 }
          segue: la-chiave-del-seminterrato
        fallimento:
          titolo: La domanda difficile
          testo: |
            Gli allievi del terzo anno ti aspettano a braccia conserte, e
            Orvald si siede all'ultimo banco. Parti bene, poi alla prima
            domanda difficile ti accorgi di non sapere la risposta e provi a
            girarci intorno, e gli allievi se ne accorgono prima di te. La
            campana suona quando hai ancora mezza lavagna da riempire. Orvald
            ti aspetta in corridoio e ti dice che la cattedra resta lì, e che
            la prossima volta alla domanda difficile si risponde che non lo
            sai, perché anche quella è una risposta da maestro.

      - testo: "Rispondere alle domande del consiglio"
        descrizione: "Cinque maestri anziani dietro un tavolo lungo, e Tobol Aspern in mezzo con una cravatta nuova."
        immagine: personaggi/tobol-aspern
        prova: { attributo: mentale, abilita: [accademiche, politica-ed-economia], difficolta: Difficile }
        successo:
          titolo: Tre domande
          testo: |
            La prima domanda la fa la maestra di retorica, sulla storia della
            città, e te la cavi. La seconda è del tesoriere, che vuole sapere
            quanto costa all'Accademia un cristallo spezzato da un allievo, e la
            sai perché l'hai visto succedere. La terza la fa Tobol. Ti chiede
            che cosa c'è sulla mappa della città nel punto della Cicatrice, e
            quando rispondi che lì la mappa è bianca, perché nessuno l'ha mai
            misurata, si toglie gli occhiali e dice al consiglio che lui ha
            finito. Gli altri quattro votano subito dopo di lui, e il consiglio
            si scioglie in tempo per il pranzo.
          pe: { accademiche: 5 }
          segue: la-chiave-del-seminterrato
        fallimento:
          titolo: La seconda domanda
          testo: |
            La prima domanda la superi a fatica. Alla seconda il tesoriere
            vuole sapere quanto costa all'Accademia un anno di un allievo, e tu
            tiri a indovinare un numero che lo fa ridere fino alla tosse. Tobol
            prova ad aiutarti con la terza, una domanda facile sulle mappe, ma
            ormai sei così agitato che sbagli anche quella. Il consiglio si
            aggiorna al mese prossimo. Orvald ti dice che i maestri hanno la
            memoria corta, e che per allora se ne saranno dimenticati.

      - testo: "Cercare quello che ha nascosto Pett"
        descrizione: "Orvald dice che è un anello d'ottone dei Precursori, il primo pezzo che ha trovato in vita sua. Pett ti guarda mentre lo cerchi."
        immagine: personaggi/orvald-temmerin
        prova: { attributo: mentale, abilita: percezione, difficolta: Media }
        successo:
          titolo: L'anello d'ottone
          testo: |
            Invece di cercare l'anello guardi Pett. Il corvo fa finta di
            niente, ma ogni volta che ti avvicini alla scrivania smette di
            lisciarsi le penne. Il teschio di cinghiale mutato è lì da sempre,
            e dentro l'orbita sinistra, incastrati fra due denti, trovi
            l'anello d'ottone insieme a tre bottoni e a una moneta che Orvald
            credeva di aver perso l'anno scorso. Orvald si infila l'anello al
            dito e la moneta in tasca, e Pett va a sedersi sulla trave con l'aria
            offesa.
          pe: { percezione: 5 }
          segue: la-chiave-del-seminterrato
        fallimento:
          titolo: Lo studio sottosopra
          testo: |
            Cerchi l'anello fra le mappe e sotto il tappeto, e svuoti mezzo
            scaffale. Pett ti segue da un ripiano all'altro e gracchia ogni
            volta che ti allontani dal punto giusto, sempre un attimo dopo, in
            modo che tu non capisca quale fosse. A sera lo studio è sottosopra
            e l'anello non è saltato fuori. Orvald rimette in ordine con te
            senza fretta. Ti dice che domani Pett avrà dimenticato dove l'ha
            messo, e allora toccherà a lui.

      - testo: "Corrompere Pett con le noci"
        descrizione: "Il corvo ti conosce, e le noci gli piacciono. Forse te lo dice lui dove l'ha messo."
        prova: { attributo: sociale, abilita: addestrare-animali, difficolta: Media }
        successo:
          titolo: Le noci
          testo: |
            Ti siedi sul pavimento dello studio con una manciata di noci
            sgusciate e le posi sul tappeto una alla volta, ogni volta un po'
            più vicino a te. Pett resiste fino alla quinta. Alla settima ti sale
            sul ginocchio, e all'ottava vola sulla scrivania, infila il becco
            nell'orbita del teschio di cinghiale e tira fuori l'anello d'ottone,
            che ti lascia cadere sul palmo. Orvald ti guarda come se avessi
            imparato una formula proibita.
          pe: { addestrare-animali: 5 }
          segue: la-chiave-del-seminterrato
        fallimento:
          titolo: Le noci finite
          testo: |
            Ti siedi sul pavimento dello studio con una manciata di noci e le
            offri a Pett una alla volta. Il corvo se le mangia tutte una dopo
            l'altra. Quando sono finite torna sulla trave a dormire, con la
            testa sotto l'ala. Orvald ti dice che con lui ci aveva già
            provato. Secondo lui Pett si lascia corrompere volentieri e poi
            tiene il becco chiuso lo stesso.

      - testo: "Aspettare che Pett si tradisca"
        descrizione: "Ci vuole soltanto tempo. Prima o poi un corvo va a controllare dove ha nascosto le sue cose."
        costo: 2
        esito:
          titolo: La pazienza
          testo: |
            Ti siedi nell'angolo dello studio con un libro aperto e non ti
            muovi più. Orvald lavora alle sue mappe fino a sera come se tu non
            ci fossi, e Pett ti tiene d'occhio per due ore. Alla terza si
            convince che ti sei addormentato. Scende dalla trave e va a
            infilare il becco nell'orbita del teschio di cinghiale. Quando alzi
            gli occhi dal libro ti guarda e capisce. Ti lascia prendere
            l'anello d'ottone senza protestare, da giocatore che ha perso
            onestamente.
          pe: { resilienza: 5 }
          segue: la-chiave-del-seminterrato

      - testo: "Dire a Orvald che non è il momento"
        descrizione: "Una cattedra è un impegno. Puoi dirgli di no per adesso, e lui sa aspettare."
        costo: 0
        esito:
          titolo: La sedia degli ospiti
          testo: |
            Gli dici che ti fa onore, e che per adesso un'ora alla settimana
            non riusciresti a garantirla. Orvald annuisce e rimette la chiave
            nel cassetto, senza chiuderlo. «Bene. La cattedra resta qui, e la
            sedia degli ospiti anche» dice, e ti indica il libro sotto la gamba
            corta. «Quando torni la trovi pari come adesso.» Pett ricomincia a
            passeggiare sul bordo della scrivania.

  - id: la-chiave-del-seminterrato
    immagine: personaggi/orvald-temmerin
    titolo: La chiave del seminterrato
    tipo: seguito
    luogo: Accademia di Torvessa, il seminterrato
    area: quartieri-alti
    requisiti: [accademia.cattedra == 0]
    testo: |
      Orvald prende la chiave dalla scrivania e ti porta giù per la scala
      stretta del seminterrato, con la lampada in una mano e Pett sulla
      spalla. Apre la porta di ferro con la chiave sua, che porta al collo.
      Laggiù l'aria odora di polvere e di olio per le armi. Alle
      pareti ci sono le mappe di trent'anni di scavi, e fra una mappa e
      l'altra le lame e i teschi con i cartellini scritti a mano. In fondo
      c'è il bersaglio di legno con la placca di lyssan, coperta di segni
      vecchi e nuovi.

      Quando risalite si ferma sulla soglia, davanti alla porta di ferro, e
      ti mette la chiave nel palmo. «Il cassetto lo scegli tu, e l'ora anche, purché non sia il
      lunedì sera, perché il lunedì sera il seminterrato è mio» dice. «Il
      consiglio ti vorrà anche alle sue riunioni, che durano tutto il
      pomeriggio. Se dici di no, la porta resta aperta, ma la prova te la
      faccio rifare, perché qui le regole sono regole.»

      Pett allunga il collo verso la chiave e la guarda con un occhio solo.
    opzioni:
      - testo: "Accettare la cattedra"
        descrizione: "Un'ora alla settimana nell'aula piccola, un cassetto con il tuo nome, e la seconda chiave del seminterrato."
        esito:
          titolo: Maestro aggiunto
          testo: |
            Chiudi la mano sulla chiave. È fredda, più pesante di come
            sembrava sulla scrivania. Orvald scrive il tuo nome sull'etichetta
            di cartone con la sua grafia stretta e te la dà, perché il cassetto
            lo scegli tu, basta che non sia quello con la cravatta dipinta sul
            legno, che è di Tobol. Poi ti stringe la mano una volta sola, e Pett
            ti becca piano il dorso delle dita. «Benvenuto fra i maestri» dice
            Orvald, e mentre risalite la scala ti avverte che il caffè resta
            cattivo anche per loro.
          imposta: { accademia.cattedra: 1 }
          effetti: { rep.accademia: 1 }
      - testo: "Rifiutare con garbo"
        descrizione: "Per adesso preferisci restare un ospite. Orvald lo capirà, anche se Pett forse no."
        esito:
          titolo: Il chiodo accanto alla porta
          testo: |
            Gli dici che per adesso preferisci restare un ospite, e gli rendi
            la chiave. Orvald la guarda sul palmo per un momento, poi la appende
            a un chiodo accanto alla porta del seminterrato, all'altezza dei
            tuoi occhi. «Resta lì» dice, e ci batte sopra con la nocca. «Quando
            la vorrai, la prova te la faccio rifare.» Risalite la scala insieme,
            e Pett, dalla sua spalla, ti volta la schiena per tutto il tempo.

  # ------------------------------------------------------------ la carta
  - id: carta-pett-alla-finestra
    immagine: personaggi/orvald-temmerin
    titolo: Pett alla fontana
    sommario: "Un corvo si posa accanto a te con un biglietto nel becco, e non se ne va finché non decidi che cosa farne."
    luogo: Quartieri Alti, una panchina vicino alla fontana
    tipo: carta
    area: quartieri-alti
    requisiti: [rep.accademia < 2]
    testo: |
      Ti sei seduto su una panchina di pietra vicino alla fontana dei
      Quartieri Alti, dove l'acqua esce dalla bocca di un pesce con una
      pinna scheggiata. Sullo schienale qualcuno ha inciso due iniziali, e
      qualcun altro ha provato a raschiarle via senza riuscirci. Una servetta
      riempie due secchi senza fretta, per far durare la pausa. Un corvo si posa sul bordo della panchina, a un
      braccio da te. È grosso e lucido, e nel becco tiene un biglietto
      piegato in due, con un angolo un po' masticato.

      Il corvo ti guarda con un occhio e poi con l'altro, e fa un passo
      avanti. La servetta ti dice dalla fontana che quello è Pett, il corvo
      del preside dell'Accademia, e che porta i biglietti del padrone a chi
      gli pare a lui. L'ultima volta, aggiunge, l'ha portato al fornaio.
      *Spero di valere più del fornaio.* Attraverso la carta
      si intravede una grafia stretta e ordinata.
    opzioni:
      - testo: "Leggere il biglietto"
        descrizione: "Se un corvo fa tanta strada per portartelo, almeno leggerlo è educazione."
        esito:
          titolo: Cercasi assistenti
          testo: |
            Pett ti lascia cadere il biglietto in grembo e resta a guardarti
            mentre lo leggi. L'Accademia di Torvessa cerca assistenti per le
            aule e paga poco, dice il biglietto, però offre il caffè, che il
            preside in persona definisce cattivo. Chi è interessato si presenti
            da Orvald Temmerin, in fondo al corridoio del piano di sopra. Sotto,
            a matita, un'altra mano ha aggiunto *il corvo non va pagato*. Quando
            alzi gli occhi Pett è già sulla grondaia del palazzo di fronte, e ti
            guarda finché non ti alzi dalla panchina.
          effetti: { rep.accademia: 0.5 }
      - testo: "Dare da mangiare al corvo"
        descrizione: "In tasca hai una crosta di pane, e un corvo che lavora merita la sua paga."
        esito:
          titolo: La paga del corvo
          testo: |
            Gli porgi un pezzo di crosta sul palmo aperto. Pett guarda prima il
            pane e poi te, e alla fine posa il biglietto sulla panchina per avere
            il becco libero. Si mangia la crosta a piccoli colpi.
            Quando ha finito riprende il biglietto e vola via con quello, basso
            sopra la fontana. La servetta ride così forte che le si rovescia un
            secchio. Hai fatto amicizia con un corvo, e del biglietto non hai
            letto nemmeno una riga.
          pe: { addestrare-animali: 2 }
      - testo: "Ignorarlo"
        descrizione: "Oggi hai altro da fare che leggere la posta dei corvi."
        costo: 0
        esito:
          titolo: La posta bagnata
          testo: |
            Ti alzi e fai per andartene. Pett ti segue in volo fino al bordo
            della fontana e ti lascia cadere il biglietto davanti ai piedi,
            dritto nell'acqua. La carta si inzuppa subito, e l'inchiostro si
            scioglie prima che tu riesca a leggere più di una parola,
            *assistenti*. Pett ti guarda per un po' dalla grondaia, poi vola
            via verso l'Accademia, con le penne arruffate.
