# La città viva, luogo 1: l'Accademia di Torvessa (presso: accademia-di-torvessa, area quartieri-alti).
# L'attività delle aule e la carta di Pett restano come prima. Dall'ottobre 2026 le storie della catena sono passi
# della quest di fazione «Il cerchio aperto» (contenuti/fazioni/accademia/): la lite delle mappe è il passo 3
# (fazione.accademia == 2, poi il registro degli uditori), la cattedra e la chiave del seminterrato sono il passo 9
# (fazione.accademia == 8, con il grado 3). Il registro delle allieve è un interludio facoltativo dal grado 2, dopo
# Capomozzo. Il servizio (le lezioni di magia di Orvald, livelli 1–5) sta in contenuti/aree/quartieri-alti.yaml.
storylet:
  # ------------------------------------------------------------ l'attività ripetibile
  - id: le-aule-di-torvessa
    presso: accademia-di-torvessa
    immagine: ambientazione/accademia-di-torvessa
    titolo: Le aule di Torvessa
    sommario: "Al piano di sopra dell'Accademia si fa scuola, e a Orvald Temmerin due mani in più fanno comodo."
    luogo: Accademia di Torvessa, le aule
    area: quartieri-alti
    ripetibile: true
    testo: |
      Il piano di sopra dell'Accademia di Torvessa è un corridoio lungo, con
      le aule da una parte e le finestre sulla Cicatrice dall'altra. Su ogni
      cattedra c'è un cristallo conduttore, e sotto la lavagna dell'aula
      grande un mucchietto di mozziconi di gesso che nessuno si decide a
      buttare.

      {empatia Media} Il ragazzo che si volta più spesso verso la strada
      scrive anche più in fretta, come se finire l'esercizio lo tenesse al
      sicuro.

      Sullo stipite dello studio di Orvald Temmerin sta appollaiato il corvo
      Pett. Accanto alla porta un foglio dice *cercasi assistenti per le
      aule*.
    opzioni:
      - testo: "Fare gli esercizi con i cristalli"
        descrizione: "Gli esercizi del primo anno, per chi non ha ancora sentito un cristallo rispondere."
        immagine: ambientazione/cristalli-conduttori
        quando: [pista.arena < 2]
        requisiti: [magia <= 1]
        prova: { attributo: mentale, abilita: magia, difficolta: "Molto facile" }
        successo:
          titolo: Il primo calore
          testo: |
            Ti siedi in fondo all'aula fra due ragazzini del primo anno, con un
            cristallo grezzo fra i palmi e le ginocchia che non entrano sotto il
            banco. Dopo molto tempo il cristallo si intiepidisce come una pietra
            al sole e una venatura si accende d'azzurro, e il ragazzino accanto
            smette di tirare su col naso per guardare.
        fallimento:
          titolo: Un sasso freddo
          testo: |
            Il cristallo resta freddo, e a forza di stringerlo ti si addormenta un
            pollice. Accanto a te un bambino di dieci anni ci riesce al terzo
            tentativo e ti guarda con compassione. L'allievo che fa lezione ti dice
            che a molti succede dopo la decima volta, e ti cambia il cristallo con
            uno più piccolo.

      - testo: "Fare gli esercizi con i cristalli"
        descrizione: "Besk Dravec ti ha visto combattere in Arena, e adesso vuole vederti con un cristallo in mano."
        immagine: personaggi/besk-dravec
        quando: [pista.arena >= 2]
        requisiti: [magia <= 1]
        prova: { attributo: mentale, abilita: magia, difficolta: "Molto facile" }
        successo:
          titolo: Il quaderno nella manica
          testo: |
            Besk si siede accanto a te senza chiedere, ti sistema le dita intorno
            al cristallo e ti spiega come si ascolta, due volte, perché la prima
            andava troppo veloce anche per lei. Quando una venatura si accende
            tira fuori il quaderno dalla manica e ci scrive una riga. «In Arena
            eri più bravo con le cose che ti corrono addosso» dice, «però questo
            non era male.»
        fallimento:
          titolo: Troppo forte
          testo: |
            Stringi il cristallo così forte che ti si sbiancano le nocche, e Besk
            ti apre le dita una alla volta. «È un cristallo, mica una bestia
            dell'Arena» dice a voce rapida, e poi si scusa di averlo detto. Il
            cristallo resta freddo per tutta l'ora, e a fine lezione Besk scrive
            qualcosa sul quaderno che chiude appena provi a sbirciare.

      - testo: "Fare da assistente in aula"
        descrizione: "Orvald cerca qualcuno che distribuisca i cristalli e tenga in ordine l'aula."
        requisiti: [rep.accademia < 2]
        prova: { attributo: mentale, abilita: [accademiche, magia], difficolta: Media }
        successo:
          titolo: Il gesso e i cristalli
          testo: |
            Distribuisci i cristalli all'inizio dell'ora e li ritiri contandoli, e
            quando un ragazzo sbaglia il verso di una formula gliela correggi a
            bassa voce prima che se ne accorga il preside. Orvald ti allunga uno
            spicciolo senza guardarti. «Domani alla stessa ora» dice, già voltato
            verso lo studio.
          effetti: { monete: 1, rep.accademia: 0.5 }
        fallimento:
          titolo: Il conto dei cristalli
          testo: |
            Alla fine dell'ora manca un cristallo, e lo cerchi sotto i banchi
            mentre Orvald aspetta a braccia conserte. Lo trova Pett, nella tasca di
            un ragazzino del primo anno che giura di non sapere come ci sia finito.
            Orvald ti dice che domani i cristalli li conta lui, e dal tono capisci
            che li conterà due volte.

      - testo: "Fare da assistente in aula"
        descrizione: "Ormai Orvald ti lascia correggere gli esercizi del secondo anno, e ogni tanto spiegarli."
        requisiti: [rep.accademia >= 2, rep.accademia < 4]
        prova: { attributo: mentale, abilita: [accademiche, magia], difficolta: Media }
        successo:
          titolo: La nota a margine
          testo: |
            Orvald ti affida i quaderni del secondo anno e una penna rossa.
            Correggi uno per uno, scrivendo a margine dove hanno sbagliato e
            perché, finché verso il ventesimo ti fa male il polso. Orvald ne
            sfoglia due a caso e legge due volte una tua nota. Poi ti paga e ti dà
            un'altra pila, che dalle sue parti vale come una promozione.
          effetti: { monete: 2, rep.accademia: 0.5 }
        fallimento:
          titolo: La penna rossa
          testo: |
            Al decimo esercizio segni come sbagliata una formula giusta, scritta
            in una variante che non conoscevi, e l'allieva va a protestare dal
            preside con il quaderno aperto. Orvald le dà ragione davanti a te, poi
            ti spiega la variante alla lavagna come se fossi del primo anno, con
            Pett che segue dalla trave.

      - testo: "Ricopiare formule per gli allievi"
        descrizione: "I libri di formule sono pochi e cari, e gli allievi pagano chi glieli ricopia."
        prova: { attributo: mentale, abilita: accademiche, difficolta: Facile }
        successo:
          titolo: Bella copia
          testo: |
            Ricopi fino a sera un libro di formule prestato per un giorno, dove
            una virgola spostata cambia la direzione del Mana. Le tue restano al
            loro posto anche quando devi avvicinare il naso alla pagina, e la
            ragazza che ti ha chiesto la copia la controlla riga per riga e ti
            paga senza discutere.
          effetti: { monete: 3 }
        fallimento:
          titolo: La goccia
          testo: |
            Verso sera, mentre sbadigli, una goccia d'inchiostro si mangia metà di
            una formula. La ricostruisci a memoria, ma la ragazza se ne accorge
            alla prima lettura picchiettando sulla pagina con un'unghia mangiata, e
            ti paga soltanto la carta.
          effetti: { monete: 1 }

      - testo: "Portare fuori Pett"
        descrizione: "Il corvo del preside va portato a prendere aria due volte al giorno, e la strada la decide lui."
        immagine: personaggi/orvald-temmerin
        esito:
          titolo: Il giro di Pett
          testo: |
            Pett ti sale sulla spalla e ti guida con piccoli colpi di becco
            sull'orecchio fino al forno, dove il fornaio lo saluta per nome e gli
            dà un pezzo di crosta. Sulla via del ritorno si ferma su un davanzale
            a studiare un gatto come un collega del quartiere. Quando lo riporti
            Orvald ti chiede soltanto se ha mangiato al forno, e alla risposta
            sospira.
          pe: { addestrare-animali: 2 }

      - testo: "Tenere una lezione ai primi anni"
        descrizione: "Orvald ha due lezioni alla stessa ora, e una tocca a te, davanti a trenta ragazzini che aspettavano il preside."
        requisiti: [rep.accademia >= 4, rep.accademia < 6]
        prova: { attributo: sociale, abilita: espressivita, difficolta: Difficile }
        successo:
          titolo: Trenta ragazzini
          testo: |
            Trenta ragazzini smettono di parlare quando entri al posto del preside.
            Cominci dalla prima volta che hai visto un cristallo accendersi, poi
            spieghi la formula facendola ripetere in coro. A metà ora uno chiede se
            fuori dalle mura ci sono davvero i mostri dei libri, e il resto dell'ora
            va a finire lì, ma la formula se la ricordano tutti e Orvald ti paga come
            un maestro vero.
          pe: { accademiche: 2 }
          effetti: { monete: 5, rep.accademia: 0.5 }
        fallimento:
          titolo: La terza fila
          testo: |
            Alla terza riga la terza fila ha smesso di ascoltarti, e quando alzi la
            voce ti esce più acuta di come la conosci. Quando un ragazzino fa
            cadere apposta il cristallo scoppiano a ridere tutti, e perdi il filo.
            Orvald entra a fine ora, e da quel momento non vola una mosca. Ti paga
            metà della lezione senza commenti.
          effetti: { monete: 2 }

      - testo: "Tenere una lezione sui cristalli"
        descrizione: "Al terzo anno la teoria la sanno già, e serve qualcuno che gli faccia sentire il Mana."
        immagine: ambientazione/cristalli-conduttori
        requisiti: [rep.accademia >= 4, rep.accademia < 6]
        prova: { attributo: mentale, abilita: magia, difficolta: Difficile }
        successo:
          titolo: La nota del cristallo
          testo: |
            Fai passare il Mana piano in un cristallo carico finché comincia a
            ronzare, e chiami gli allievi uno alla volta a sentire con le dita in
            che punto cambia nota. A fine ora lo sentono quasi tutti, e due prima
            di te. Orvald ascoltava dalla porta, e quando ti paga ti chiede dove
            hai imparato quel trucco.
          pe: { accademiche: 2 }
          effetti: { monete: 5, rep.accademia: 0.5 }
        fallimento:
          titolo: Il fischio
          testo: |
            Spingi il Mana nel cristallo troppo in fretta, e la nota sale fino a
            fischiare finché il cristallo si incrina con un rumore secco. Orvald
            arriva dall'aula accanto a guardare la crepa, e ti dice che i
            cristalli li paga lui e che per oggi la lezione la paga a metà.
          effetti: { monete: 2 }

      - testo: "Tenere la tua ora di lezione"
        descrizione: "Un'ora alla settimana è tua, nell'aula piccola, con il cassetto dei compiti."
        requisiti: [accademia.cattedra >= 1]
        prova: { attributo: mentale, abilita: [magia, accademiche], difficolta: Media }
        successo:
          titolo: Il cassetto del maestro
          testo: |
            Nel tuo cassetto gli allievi lasciano i compiti e qualche volta un
            biglietto con la domanda che non hanno avuto il coraggio di fare in
            aula. Rispondi ai biglietti prima della lezione, e a fine ora anche a
            un ragazzo che resta indietro con una domanda fuori programma. Il
            tesoriere ti conta la paga sospirando a ogni moneta.
          effetti: { monete: 8 }
        fallimento:
          titolo: Un'ora storta
          testo: |
            La formula ti si ingarbuglia sulla lavagna, e un'allieva del terzo
            anno te la corregge dal banco con molta gentilezza, che è la cosa
            peggiore. Il tesoriere ti paga lo stesso, perché il contratto dice
            un'ora e l'ora l'hai fatta.
          effetti: { monete: 6 }

      - testo: "Seguire la lezione di Orvald dal tuo banco"
        descrizione: "Sei un suo allievo, e Orvald non risponde mai due volte alla stessa domanda."
        quando: [origine.allievo-di-torvessa >= 1]
        esito:
          titolo: La seconda domanda
          testo: |
            Orvald entra con Pett sulla spalla e riprende la lezione da un punto
            sempre diverso da quello che ricordavi. Quando un allievo del primo
            anno gli chiede di ripetere una formula, lo guarda a lungo e risponde
            con un'altra domanda, e tu scrivi in fretta, perché la risposta è
            quella. Esci con due pagine di appunti fitti e una macchia
            d'inchiostro sul polsino.
          pe: { accademiche: 2 }

  # ------------------------------------------------------------ storia a 2 · la lite delle mappe
  - id: la-lite-delle-mappe
    presso: accademia-di-torvessa
    immagine: personaggi/tobol-aspern
    titolo: La lite delle mappe
    sommario: "Orvald Temmerin e Tobol Aspern litigano su una mappa di trent'anni fa, e Ottilia Sanvel oggi non c'è."
    luogo: Accademia di Torvessa, lo studio del preside
    area: quartieri-alti
    requisiti: [fazione.accademia == 2, accademia.tobol == 0]
    testo: |
      Le voci dello studio di Orvald ti arrivano già dal corridoio, e Pett si
      è rifugiato sull'architrave. Sulla scrivania è srotolata una mappa
      ingiallita con la grafia stretta del preside, *Gradone Rosso, scavo del
      centoventi*, dove un sentiero tratteggiato scende lungo la scarpata fino
      a una croce.

      Dall'altra parte della scrivania c'è uno gnomo anziano con gli occhiali
      tondi e una cravatta verde a pois gialli che a guardarla troppo fa
      venire mal di testa, e sulla spalla un geco verde brillante. «Sono Tobol
      Aspern, il cartografo. Lui è Whisp» dice senza voltarsi. «Tu devi essere
      quello che Orvald fa lavorare per una miseria. Mi serve un testimone.»

      «Il sentiero esiste» dice Orvald. «L'ho fatto trenta volte, con un mulo
      carico.»

      «Trent'anni fa» dice Tobol, e batte il dito sulla croce. «Io ci sono
      passato due estati fa, e al posto del tuo sentiero c'è un muro di sabbia
      rossa alto come la Cattedrale. Di solito decide Ottilia, ma oggi ha i
      novizi.» Si sistema gli occhiali. «Quindi decidi tu.»

      {origine apprendista-raschiatore} Sulla Cicatrice una mappa di
      trent'anni si tiene per affetto e non si segue, e ti mordi la lingua per
      non dirlo.

      {empatia Facile} Litigano come si gioca una partita di carte che dura da
      una vita, e nessuno dei due vuole vincere davvero, perché poi
      bisognerebbe smettere.
    opzioni:
      - testo: "Studiare la mappa e il diario di scavo"
        descrizione: "Orvald scriveva tutto anche trent'anni fa, e sulla carta ci sarà quello che è successo dopo."
        prova: { attributo: mentale, abilita: [percezione, accademiche], difficolta: Media }
        successo:
          titolo: La nota a margine
          testo: |
            Mentre i due discutono ti chini sulla mappa. In basso, quasi coperta
            da una macchia di tè, c'è una nota con la stessa grafia, *arenaria che
            si sfoglia sopra la croce, non passarci dopo le piogge*. La leggi ad
            alta voce, e i due si zittiscono. Avevano ragione tutti e due,
            ciascuno nella sua estate, e Tobol ti paga la scoperta di tasca sua.
          pe: { accademiche: 5 }
          imposta: { accademia.tobol: 3 }
          effetti: { rep.accademia: 1, monete: 5 }
        fallimento:
          titolo: Una macchia di tè
          testo: |
            Studi la mappa a lungo e trovi soltanto una macchia di tè a forma di
            isola. Quando provi a dire qualcosa sulla scala Tobol ti corregge con
            tre numeri, e Orvald gli dà ragione. Per qualche minuto sono d'accordo
            su di te, poi tornano a litigare.
          effetti: { scandalo: 0.5 }

      - testo: "Ragionare sulla roccia del Gradone"
        descrizione: "Il Gradone Rosso è di arenaria, e chi conosce la pietra sa che cosa le fanno trent'anni di piogge."
        prova: { attributo: mentale, abilita: natura, difficolta: Media }
        successo:
          titolo: Trent'anni di piogge
          testo: |
            Chiedi a Tobol com'era il muro di sabbia, e lui disegna nell'aria gli
            strati sottili e le radici scoperte in cima. È una frana recente,
            perché l'arenaria del Gradone si sfoglia a ogni pioggia, e in
            trent'anni un sentiero sulla scarpata può sparire. Avevano ragione
            tutti e due, e Tobol ti paga la spiegazione e la scrive a margine, con
            il tuo nome.
          pe: { natura: 5 }
          imposta: { accademia.tobol: 3 }
          effetti: { rep.accademia: 1, monete: 5 }
        fallimento:
          titolo: La pietra sbagliata
          testo: |
            Spieghi con sicurezza che il Gradone è di granito, e Tobol ti lascia
            arrivare in fondo con un sorriso sempre più largo. Poi tira fuori dal
            gilet un sasso rosso e te lo mette in mano, e il sasso ti si sbriciola
            fra le dita. Orvald ride per la prima volta, e la lite riprende più
            allegra di prima.
          effetti: { scandalo: 0.5 }

      - testo: "Dare ragione a Orvald"
        descrizione: "Il sentiero l'ha percorso lui, trenta volte, con il mulo."
        immagine: personaggi/orvald-temmerin
        esito:
          titolo: Il sentiero del mulo
          testo: |
            Dici che una mappa disegnata da chi ci è passato trenta volte vale più
            di una visita di due estati. Tobol si pulisce gli occhiali sulla
            cravatta, arrotola la mappa, che è di Orvald, e se la porta via lo
            stesso. Orvald ti versa un caffè cattivo e ti racconta dello scavo del
            centoventi. «Domani Tobol torna con una cravatta nuova, che è il suo
            modo di chiedere scusa» dice.
          pe: { galateo: 5 }
          imposta: { accademia.tobol: 1 }
          effetti: { rep.accademia: 1, informazioni.pettegolezzo: 1 }

      - testo: "Dare ragione a Tobol"
        descrizione: "Una mappa vale quanto l'ultima volta che qualcuno l'ha controllata."
        immagine: personaggi/tobol-aspern
        esito:
          titolo: Il silenzio del corvo
          testo: |
            Dici che il sentiero, se c'era, adesso non c'è più. Tobol batte le mani
            una volta, e sull'architrave Pett smette di lisciarsi le penne e resta
            immobile. Orvald arrotola la mappa con molta cura e la rimette nello
            scaffale. «Bene» dice soltanto. Sulla porta Tobol ti paga la tua
            opinione il doppio di quanto vale, e ti sussurra che il silenzio del
            corvo vale molto di più.
          pe: { galateo: 5 }
          imposta: { accademia.tobol: 2 }
          effetti: { rep.accademia: 1, monete: 8 }

      - testo: "Farli ridere tutti e due"
        descrizione: "Due vecchi amici litigano su un sentiero, e qualcuno deve farli smettere prima di cena."
        prova: { attributo: sociale, abilita: [espressivita, empatia], difficolta: Media }
        successo:
          titolo: Il percorso consigliato
          testo: |
            Prendi un foglio e disegni in fretta una terza mappa, con un sentiero
            che fa un giro lunghissimo intorno a due vecchi che litigano, e sotto
            scrivi *percorso consigliato* imitando la grafia di Orvald. Tobol
            scoppia a ridere così forte che Whisp gli scivola dalla spalla. Orvald
            resiste un poco di più, poi attacca il disegno al muro accanto alle
            mappe vere, e Tobol ti paga subito.
          pe: { espressivita: 5 }
          imposta: { accademia.tobol: 3 }
          effetti: { rep.accademia: 1, monete: 5 }
        fallimento:
          titolo: Lo scherzo sbagliato
          testo: |
            Provi a sdrammatizzare con una battuta sull'età di tutti e due e la
            sbagli di qualche decennio. Tobol, che di anni ne ha centodieci, se la
            prende per Orvald, e Orvald per Tobol, e per qualche minuto ti
            spiegano a due voci quanto vivono gli gnomi e quanto gli umani prima
            di tornare alla mappa.
          effetti: { scandalo: 0.5 }

      - testo: "Ricordare a Orvald la sua lezione sul Gradone"
        descrizione: "Al secondo anno Orvald ha dedicato una lezione intera all'arenaria del Gradone, e i tuoi appunti li hai ancora."
        quando: [origine.allievo-di-torvessa >= 1]
        prova: { attributo: mentale, abilita: accademiche, difficolta: Facile }
        successo:
          titolo: Gli appunti del secondo anno
          testo: |
            Tiri fuori il quaderno del secondo anno e trovi la pagina sotto una
            macchia di cera, *l'arenaria del Gradone si sfoglia sopra la quota
            delle piogge*, sottolineata due volte. La leggi con la cadenza di
            Orvald, e Orvald si zittisce a metà frase mentre Tobol ride fino a
            farsi cadere gli occhiali. Tobol ti paga la scoperta, perché non aveva
            mai visto Orvald smentito da Orvald.
          pe: { accademiche: 5 }
          imposta: { accademia.tobol: 3 }
          effetti: { rep.accademia: 1, monete: 5 }
        fallimento:
          titolo: Il margine strappato
          testo: |
            Nel quaderno del secondo anno trovi soltanto il margine dove avevi
            preso nota del pranzo, e la lezione la ricordi male. Orvald ti
            corregge con la cadenza dell'aula, e Tobol gli chiede chi gli ha
            insegnato a scegliersi gli allievi. Litigano su questo per un quarto
            d'ora, molto più soddisfatti di prima.
          effetti: { scandalo: 0.5 }

  # ------------------------------------------------------------ storia a 4 · il registro delle allieve
  - id: il-registro-delle-allieve
    presso: accademia-di-torvessa
    immagine: personaggi/orvald-temmerin
    titolo: Il registro delle allieve
    sommario: "Orvald Temmerin ha saputo chi hai riportato dalle rovine, e stasera ti aspetta con un registro sulla scrivania."
    luogo: Accademia di Torvessa, lo studio del preside, di sera
    area: quartieri-alti
    requisiti: [fazione.accademia >= 6, accademia.aurenne == 0, pista.capomozzo >= 7]
    testo: |
      La sera l'Accademia è vuota. Lo studio è illuminato da una sola lampada a
      cristallo, accanto a un registro rilegato in tela grigia con
      *centoquarantuno* scritto sul dorso, e il cassetto in basso, quello che ha
      sempre la chiave nella serratura, adesso è aperto. Pett sta immobile sulla
      trave, con le penne raccolte.

      Orvald non ti fa sedere. «Ottilia mi ha detto che Aurenne è viva, e che l'hai
      riportata tu.» Apre il registro all'elenco delle allieve di un inverno, e fra
      due nomi ti mostra una riga lasciata vuota.

      {origine allievo-di-torvessa} Il tuo nome sta in un registro uguale, qualche
      scaffale più in là, e ti chiedi se accanto ci sia una nota che non hai mai
      letto.

      «Sollen mi chiese di non scriverla, e io obbedii perché obbedire era comodo»
      dice, e dal cassetto tira fuori tre fogli piegati. «Era taciturna, con i
      capelli d'argento, e diceva di sentire delle voci. Gli altri la tormentavano
      e io lo sapevo. Amyll e le sue amiche, e più di tutti Rennick Dole, che era
      il peggiore. Io le davo molti compiti. Pensavo che chi lavora non ha tempo di
      stare male, e non ho fatto nient'altro.»

      *Ha preparato questo discorso per nove anni, e lo dice male lo stesso.* Ti
      accorgi di stringere il bordo della scrivania.
    opzioni:
      - testo: "Chiedergli perché non ha fatto niente"
        descrizione: "Un preside ha in mano più di un registro. Orvald lo sa meglio di te."
        costo: 0
        esito:
          titolo: Comodo
          testo: |
            «Perché era comodo» dice Orvald, senza cercare un'altra parola.
            «Sollen era il cappellano del Santuario e chiedeva discrezione. I
            genitori dei ragazzi che la tormentavano venivano a parlarmi una volta
            al mese, e lei non si lamentava mai. Era quella che costava meno
            lasciare sola.» Si passa una mano sulla barba corta. «Te lo dico
            perché tu non mi trovi una scusa che io non ho.»

      - testo: "Raccontargli del diario"
        descrizione: "Nel diario di Aurenne c'è un inverno all'Accademia, e c'è il suo nome."
        requisiti: [oggetto.diario-di-aurenne >= 1]
        costo: 0
        esito:
          titolo: Tanti di quei compiti
          testo: |
            Gli racconti del quaderno dalla copertina azzurra e della sera in cui Amyll e le altre spinsero i banchi contro la porta del bagno dove si era chiusa, lasciandola al buio fino a notte. Orvald dice che d'inverno scendeva nella Camera
            oltre il seminterrato a fare i turni che poi ha lasciato ad Agnese, e laggiù non arrivava nessun rumore. Chiude il registro con tutte e due le mani.

      - testo: "Chiedergli di Rennick Dole"
        descrizione: "Orvald lo chiama il peggiore, e in città c'è ancora chi lo ricorda come il bullo della scuola."
        costo: 0
        esito:
          titolo: Il peggiore
          testo: |
            «Rennick la picchiava di rado. Faceva di peggio, perché era bravo a
            farsi seguire» dice Orvald. «Decideva lui come la si chiamava quella
            settimana, e la settimana dopo la chiamava così tutta la scuola.» Gli
            altri ridevano per non diventare il bersaglio successivo, e a lezione
            Rennick era educatissimo. Orvald lo dice guardando la riga vuota, e
            aggiunge che a lui questo bastava per non vedere il resto.

      - testo: "Dirgli che avrebbe dovuto accorgersene"
        descrizione: "Lo sa già, ma forse ha bisogno di sentirlo dire da qualcun altro."
        esito:
          titolo: Una sera
          testo: |
            Gli dici che un maestro che vede un'allieva tormentata e le dà più
            compiti ha già scelto da che parte stare, e anche se te ne penti a
            metà frase la finisci. «Hai ragione» dice Orvald. «A me sono serviti
            nove anni e un incendio per dirmelo da solo.» Rimette i fogli nel
            cassetto e lascia la chiave sul tavolo, e alla porta ti ringrazia di
            non essere stato gentile.
          pe: { resilienza: 5 }
          imposta: { accademia.aurenne: 1 }
          effetti: { rep.accademia: 1 }

      - testo: "Leggere le sue note su di lei"
        descrizione: "Tre fogli piegati, scritti nove anni fa da un maestro che preferiva guardare altrove."
        esito:
          titolo: Tre fogli
          testo: |
            Sul primo foglio Orvald ha scritto *risponde per enigmi, dice di
            sentire delle voci*. Nel secondo ha ricopiato una frase di Sollen, che
            il mondo non era pronto per la benedizione di sua figlia, con accanto
            un punto interrogativo aggiunto dopo con un'altra penna. Il terzo ha
            una data di primavera e una parola sola, *ritirata*. Orvald rimette i
            fogli nel cassetto e lascia la chiave sul tavolo.
          pe: { accademiche: 5 }
          imposta: { accademia.aurenne: 1 }
          effetti: { rep.accademia: 1 }

      - testo: "Portare ad Aurenne qualcosa da parte sua"
        descrizione: "Lei è in Cattedrale, e se Orvald ha qualcosa da darle puoi portarglielo tu."
        immagine: ambientazione/cattedrale-del-velo
        esito:
          titolo: Il compito
          testo: |
            Orvald ci pensa a lungo, poi tira fuori dall'ultima pagina del
            registro un foglio piegato in quattro, un esercizio sui cristalli in
            una grafia tonda da scolara, con due fiori a margine. «È l'ultimo
            compito che mi ha consegnato, e non l'ho mai corretto» dice. «Se ci
            scrivessi qualcosa adesso, la scriverei per me.» Ti accompagna al
            portone e lo chiude piano dietro di te.
          pe: { empatia: 5 }
          imposta: { accademia.aurenne: 1 }
          effetti: { rep.accademia: 1 }
          segue: il-compito-di-aurenne

  - id: il-compito-di-aurenne
    immagine: ambientazione/cattedrale-del-velo
    titolo: Il compito di Aurenne
    tipo: seguito
    luogo: Cattedrale del Velo, la mattina dopo
    area: quartieri-alti
    requisiti: [accademia.aurenne >= 1]
    testo: |
      La mattina dopo, sul sagrato della Cattedrale, apri il foglio contro il
      parapetto. L'esercizio chiede di descrivere che cosa si sente quando un
      cristallo risponde, e la ragazza ha riempito una pagina e mezza,
      scrivendo a un certo punto che il cristallo le parlava come le voci,
      solo più gentile. In fondo lo spazio per il voto è vuoto, accanto a un
      fiore a matita lasciato a metà.

      {magia Media} Quello che descrive è giusto, e al primo anno quasi
      nessuno lo sa mettere per iscritto.

      *Dall'Accademia alla Cattedrale ci sono tre strade, e a questo foglio
      sono serviti nove anni.* Lo ripieghi lungo le pieghe vecchie ed entri.

      Un novizio va a chiamare Ottilia Sanvel, che arriva dal chiostro e
      guarda il foglio prima di guardare te.

      {origine accolito-del-velo} Il novizio stava nella tua fila agli
      esercizi dell'alba, e davanti a Ottilia ti raddrizzi senza volerlo.
    opzioni:
      - testo: "Darlo ad Aurenne"
        descrizione: "È sveglia, nella sala di preghiera più interna. Ottilia ti accompagna fino alla porta."
        immagine: personaggi/aurenne
        quando: [pista.capomozzo >= 9]
        esito:
          titolo: Una pagina e mezza
          testo: |
            Aurenne è seduta sulla panca della sala di preghiera, sotto le
            vetrate. Riconosce la grafia e prende il foglio con la mano buona
            tenendo lontano l'artiglio, poi lo legge muovendo appena le labbra.
            «Il Maestro Temmerin dava tanti compiti» dice, e ti chiede se ci ha
            scritto qualcosa. Le dici di no, che è stato lui a non volerlo, e lei
            infila il foglio sotto la corazza, contro il petto.
          pe: { empatia: 3 }
      - testo: "Lasciarlo a Ottilia"
        descrizione: "Aurenne dorme ancora, e Ottilia decide da sola che cosa entra in quella stanza."
        immagine: personaggi/ottilia-sanvel
        quando: [pista.capomozzo < 9]
        esito:
          titolo: Quando si sveglia
          testo: |
            Ottilia ti dice che Aurenne dorme ancora e prende il foglio, che legge
            in piedi nella navata seguendo le righe con un dito. «L'ho conosciuta.
            Pregava male, però veniva» dice. «Quando si sveglia glielo do io, e a
            Orvald di' che è arrivato.» Lo infila nella manica della tunica nera e
            torna verso il chiostro.
          pe: { empatia: 3 }
      - testo: "Tenerlo per te"
        descrizione: "Forse è presto, o forse il messaggero giusto è un altro."
        esito:
          titolo: Nella giubba
          testo: |
            Dici a Ottilia che hai sbagliato porta, e lei ti guarda il tempo che
            le serve per capire che non è vero, e ha la gentilezza di non dirlo.
            Resti al parapetto del sagrato con il foglio in mano finché le campane
            suonano l'ora, poi lo rimetti nella giubba e torni per la strada più
            lunga.

  # ------------------------------------------------------------ storia a 6 · la cattedra
  - id: una-cattedra-a-torvessa
    presso: accademia-di-torvessa
    immagine: personaggi/orvald-temmerin
    titolo: Una cattedra a Torvessa
    sommario: "Orvald Temmerin ti fa sedere, per la prima volta, e mette sulla scrivania una chiave di ferro."
    luogo: Accademia di Torvessa, lo studio del preside
    area: quartieri-alti
    requisiti: [fazione.accademia == 8, accademia.cattedra == 0]
    testo: |
      Per la prima volta Orvald ti fa sedere. La sedia degli ospiti ha una
      gamba più corta, e sotto lui ci ha messo un libro di formule perché non
      dondoli. Sulla scrivania ci sono una chiave di ferro e un'etichetta di
      cartone ancora bianca, e Pett passeggia sul bordo senza perdere d'occhio
      la chiave.

      «Il consiglio dei maestri ha accettato di darti una cattedra da maestro
      aggiunto» dice Orvald. «Un'ora alla settimana nell'aula piccola, un
      cassetto con il tuo nome e la chiave del seminterrato. Il consiglio
      vuole una prova, a scelta. Puoi tenere una lezione al terzo anno, oppure
      rispondere a tre domande dei maestri, che sono cinque vecchi e si
      annoiano. Oppure mi ritrovi il pezzo della collezione che Pett ha
      nascosto stamattina, per vendicarsi di una sgridata per una tazza rotta,
      e il consiglio lo conta come prova, visto che lo decido io.»

      Poi abbassa la voce. «Mi serve un voto in più in consiglio. Querci e due
      maestri vogliono tacere fino all'inverno e lasciare che la Vecchia si
      spenga da sola, per poi chiedere i soldi al Consiglio della città a cose
      fatte. Un maestro aggiunto vota come gli altri.»

      Pett si mette a guardare il soffitto, da corvo che in vita sua non ha
      mai visto una tazza.
    opzioni:
      - testo: "Tenere la lezione al terzo anno"
        descrizione: "Trenta allievi che sanno abbastanza da accorgersi se sbagli, e Orvald seduto all'ultimo banco."
        immagine: ambientazione/cristalli-conduttori
        prova: { attributo: sociale, abilita: [espressivita, persuasione], difficolta: Difficile }
        successo:
          titolo: L'ultimo banco
          testo: |
            Gli allievi del terzo anno ti aspettano a braccia conserte, con Orvald
            all'ultimo banco. Il gesso ti scivola dalle mani sudate. Lo posi e
            cominci a raccontare come hai sbagliato tu la formula che ti è costata
            più fatica. A metà ora le mani si alzano per domande vere, e quando
            suona la campana nessuno si alza subito. Dal corridoio senti Orvald
            dire a Tobol che la lezione è andata.
          pe: { espressivita: 5 }
          segue: la-chiave-del-seminterrato
        fallimento:
          titolo: La domanda difficile
          testo: |
            Alla prima domanda difficile provi a girarci intorno, e gli allievi se
            ne accorgono prima di te. La campana suona con mezza lavagna ancora da
            riempire. Orvald ti aspetta in corridoio e ti dice che la cattedra
            resta lì, e che alla domanda difficile si risponde che non lo sai,
            perché anche quella è una risposta da maestro.
          effetti: { scandalo: 0.5 }

      - testo: "Rispondere alle domande del consiglio"
        descrizione: "Cinque maestri anziani dietro un tavolo lungo, e Tobol Aspern in mezzo con una cravatta nuova."
        immagine: personaggi/tobol-aspern
        prova: { attributo: mentale, abilita: [accademiche, politica-ed-economia], difficolta: Difficile }
        successo:
          titolo: Tre domande
          testo: |
            Alla maestra di retorica, sulla storia della città, rispondi con la
            bocca secca ma rispondi. Il tesoriere vuole sapere quanto costa un
            cristallo spezzato da un allievo, e lo sai perché l'hai visto
            succedere. Tobol ti chiede che cosa c'è sulla mappa nel punto della
            Cicatrice, e quando rispondi che lì la mappa è bianca si toglie gli
            occhiali e dice che ha finito, e gli altri votano subito dopo.
          pe: { accademiche: 5 }
          segue: la-chiave-del-seminterrato
        fallimento:
          titolo: La seconda domanda
          testo: |
            La prima domanda la superi a fatica. Alla seconda tiri a indovinare
            quanto costa un anno di un allievo, e il tesoriere ride fino alla tosse.
            Ormai sei così agitato che sbagli anche la domanda facile di Tobol sulle
            mappe, e il consiglio si aggiorna al mese prossimo. Orvald ti dice che
            per allora i maestri se ne saranno dimenticati.
          effetti: { scandalo: 0.5 }

      - testo: "Cercare quello che ha nascosto Pett"
        descrizione: "Un anello d'ottone dei Precursori, il primo pezzo che Orvald ha trovato in vita sua."
        immagine: personaggi/orvald-temmerin
        prova: { attributo: mentale, abilita: percezione, difficolta: Media }
        successo:
          titolo: L'anello d'ottone
          testo: |
            Invece di cercare l'anello guardi Pett, che smette di lisciarsi le
            penne ogni volta che ti avvicini alla scrivania, come un giocatore di
            carte quando gli passi dietro. Nell'orbita sinistra del teschio di
            cinghiale trovi l'anello d'ottone, insieme a tre bottoni e a una moneta
            che Orvald credeva perduta. Orvald si infila l'anello al dito, e Pett
            va sulla trave con l'aria offesa.
          pe: { percezione: 5 }
          segue: la-chiave-del-seminterrato
        fallimento:
          titolo: Lo studio sottosopra
          testo: |
            Cerchi l'anello fra le mappe e sotto il tappeto, e per il ripiano più
            alto sali sulla sedia con la gamba corta. Pett gracchia ogni volta che
            ti allontani dal punto giusto, sempre un attimo dopo. A sera lo studio
            è sottosopra, e Orvald rimette in ordine con te dicendo che domani Pett
            avrà dimenticato dove l'ha messo.
          effetti: { tormento: 0.5 }

      - testo: "Corrompere Pett con le noci"
        descrizione: "Il corvo ti conosce, e le noci gli piacciono."
        prova: { attributo: sociale, abilita: addestrare-animali, difficolta: Media }
        successo:
          titolo: Le noci
          testo: |
            Ti siedi sul pavimento e posi le noci sul tappeto una alla volta,
            sempre più vicino a te. Pett resiste fino alla quinta e alla settima
            ti sale sul ginocchio. All'ottava vola sulla scrivania a tirare fuori
            l'anello dall'orbita del teschio di cinghiale, te lo lascia cadere sul
            palmo, e Orvald ti guarda come se avessi imparato una formula
            proibita.
          pe: { addestrare-animali: 5 }
          segue: la-chiave-del-seminterrato
        fallimento:
          titolo: Le noci finite
          testo: |
            Pett si mangia tutte le noci una dopo l'altra, con una gratitudine
            molto limitata, e torna sulla trave a dormire con la testa sotto l'ala.
            Orvald ti dice che ci aveva già provato, e che Pett si lascia
            corrompere volentieri e poi tiene il becco chiuso lo stesso.

      - testo: "Aspettare che Pett si tradisca"
        descrizione: "Prima o poi un corvo va a controllare dove ha nascosto le sue cose."
        costo: 2
        esito:
          titolo: La pazienza
          testo: |
            Ti siedi nell'angolo dello studio con un libro aperto e non ti muovi più,
            mentre Pett ti tiene d'occhio per due ore e ti si addormentano tutti e
            due i piedi. Alla terza il corvo ti crede addormentato e va a infilare il
            becco nell'orbita del teschio di cinghiale. Quando alzi gli occhi ti
            lascia prendere l'anello d'ottone, da giocatore che ha perso onestamente.
          pe: { resilienza: 5 }
          segue: la-chiave-del-seminterrato

      - testo: "Lasciare che parlino i maestri che ti hanno visto in Arena"
        descrizione: "Due maestri del consiglio erano sugli spalti il giorno delle Tre Prove, e se lo ricordano."
        quando: [campione >= 1]
        esito:
          titolo: Gli spalti
          testo: |
            Al consiglio la maestra di retorica si alza prima che tu apra bocca e
            racconta la Grande Mischia come se ci fosse stata, e in effetti c'era,
            in terza fila. Un vecchio maestro di storia le dà ragione battendo il
            bastone, e Tobol dice che è un peccato sprecare le prove preparate.
            Votano prima della prova, e Querci vota per ultimo, con un sospiro.
          pe: { espressivita: 5 }
          segue: la-chiave-del-seminterrato

      - testo: "Dire a Orvald che non è il momento"
        descrizione: "Una cattedra è un impegno, e Orvald sa aspettare."
        costo: 0
        esito:
          titolo: La sedia degli ospiti
          testo: |
            Gli dici che ti fa onore, ma che un'ora alla settimana per adesso non
            riusciresti a garantirla, e lo dici guardando la chiave. Orvald la
            rimette nel cassetto senza chiuderlo. «La cattedra resta qui, e la
            sedia degli ospiti anche» dice, indicando il libro sotto la gamba
            corta. «Quando torni la trovi pari come adesso.»

  - id: la-chiave-del-seminterrato
    immagine: personaggi/orvald-temmerin
    titolo: La chiave del seminterrato
    tipo: seguito
    luogo: Accademia di Torvessa, il seminterrato
    area: quartieri-alti
    requisiti: [fazione.accademia == 8, accademia.cattedra == 0]
    testo: |
      Orvald ti porta giù per la scala del seminterrato con Pett sulla spalla, e apre la porta di ferro con la chiave che porta al collo. Alle pareti sono appesi i trofei di trent'anni di scavi, ognuno con il suo cartellino. In
      fondo c'è il bersaglio di legno con la placca di lyssan, e dietro la seconda porta di ferro, quella della Vecchia, si sente piano il suo battito.

      {origine figlio-del-circolo} Fra i trofei ci sono teste di bestie toccate dalla Marea, con il pelo bruciato come la volpe che da bambino hai visto abbattere nel Bosco di Velthar.

      Sulla soglia ti mette la chiave nel palmo. «Il cassetto e l'ora li scegli tu, tranne il lunedì sera, che è mio. Il consiglio ti vorrà alle sue riunioni. Se dici di no la porta resta aperta, ma la prova te la faccio
      rifare.»
    opzioni:
      - testo: "Accettare la cattedra"
        descrizione: "La chiave e una stanza nella torretta, con in più l'anello d'ottone ritrovato da Pett."
        esito:
          titolo: Maestro aggiunto
          testo: |
            Chiudi la mano sulla chiave. Orvald scrive il tuo nome sull'etichetta
            e si sfila dal dito l'anello d'ottone dei Precursori per mettertelo
            nel palmo. «Pett lo nasconde ogni settimana, quindi adesso lo nasconde
            a te. Nella torretta c'è una stanza con un letto, ed è tua finché
            voti.» Giovedì in consiglio passa per un voto la proposta di portare
            la Vecchia davanti al Consiglio della città.
          imposta: { accademia.cattedra: 1 }
          almeno: { rep.accademia: 6 }
          effetti: { fazione.accademia: 1, rep.accademia: 1, oggetto.accademia-anello-d-ottone: 1 }
      - testo: "Accettare la cattedra e chiedere la lezione del Sigillo"
        descrizione: "Al posto dell'anello, la formula del Sigillo per chiudere le serrature di Mana, regalata a un maestro aggiunto."
        quando: [magia >= 3, incantesimo.sigillo == 0]
        esito:
          titolo: La porta del seminterrato
          testo: |
            Orvald scrive il tuo nome sull'etichetta e ti fa chiudere con il
            Sigillo la porta del seminterrato, poi prova ad aprirla con la spalla
            senza riuscirci, e ne sembra contento. Ti fa promettere di non usarlo
            sulle porte dell'Accademia. «Nella torretta c'è una stanza con un
            letto, ed è tua finché voti.» Giovedì in consiglio passa per un voto
            la proposta di portare la Vecchia davanti al Consiglio della città.
          imposta: { accademia.cattedra: 1 }
          almeno: { rep.accademia: 6 }
          effetti: { fazione.accademia: 1, rep.accademia: 1, incantesimo.sigillo: 1 }
      - testo: "Accettare la cattedra e chiedere la lezione della Lancia di luce"
        descrizione: "Al posto dell'anello, un raggio che resta dritto, e sulla placca di lyssan c'è ancora posto."
        quando: [magia >= 3, incantesimo.lancia-di-luce == 0]
        esito:
          titolo: Il ventunesimo segno
          testo: |
            Orvald scrive il tuo nome sull'etichetta e ti mette davanti alla
            placca di lyssan, dove il raggio lascia il ventunesimo segno, il più
            piccolo, dritto. Lui ci graffia accanto la data con la punta della
            chiave. «Nella torretta c'è una stanza vuota con un letto, ed è tua
            finché voti.» Al consiglio di giovedì la proposta di portare la
            Vecchia davanti al Consiglio della città passa per un voto.
          imposta: { accademia.cattedra: 1 }
          almeno: { rep.accademia: 6 }
          effetti: { fazione.accademia: 1, rep.accademia: 1, incantesimo.lancia-di-luce: 1 }
      - testo: "Rifiutare con garbo"
        descrizione: "Per adesso preferisci restare un ospite. Orvald lo capirà, anche se Pett forse no."
        esito:
          titolo: Il chiodo accanto alla porta
          testo: |
            Gli rendi la chiave, e Orvald la appende a un chiodo accanto alla
            porta del seminterrato, all'altezza dei tuoi occhi e non dei suoi.
            «Resta lì» dice, battendoci sopra con la nocca. «Quando la vorrai, la
            prova te la faccio rifare.» Risalite insieme, e Pett, dalla sua
            spalla, ti volta la schiena per tutto il tempo.

  # ------------------------------------------------------------ la carta
  - id: carta-pett-alla-finestra
    immagine: personaggi/orvald-temmerin
    titolo: Pett alla fontana
    sommario: "Un corvo si posa accanto a te con un biglietto nel becco, e aspetta che tu decida."
    luogo: Quartieri Alti, una panchina vicino alla fontana
    tipo: carta
    area: quartieri-alti
    requisiti: [rep.accademia < 2]
    testo: |
      Sei seduto su una panchina vicino alla fontana dei Quartieri Alti, dove
      l'acqua esce dalla bocca di un pesce con una pinna scheggiata. Un corvo
      grosso si posa a un braccio da te, con un biglietto piegato nel becco.
      Una servetta che riempie i secchi alla fontana ti dice che è Pett, il
      corvo del preside dell'Accademia, e che porta i biglietti del padrone a
      chi pare a lui, l'ultima volta al fornaio.

      {origine rampollo-dei-quartieri-alti} Da bambino passavi di qui tenuto
      per mano, e la pinna era scheggiata già allora. In famiglia dicevano che
      l'avrebbero fatta aggiustare.
    opzioni:
      - testo: "Leggere il biglietto"
        descrizione: "Se un corvo fa tanta strada per portartelo, almeno leggerlo è educazione."
        esito:
          titolo: Cercasi assistenti
          testo: |
            Pett ti lascia cadere il biglietto in grembo e ti guarda leggere, con
            la testa inclinata da esaminatore severo. Il biglietto dice che
            l'Accademia di Torvessa cerca assistenti per le aule e offre poco
            denaro e un caffè che il preside in persona definisce cattivo. Chi è
            interessato si presenti da Orvald Temmerin. Quando alzi gli occhi Pett
            è sulla grondaia di fronte, e ti guarda finché non ti alzi.
          effetti: { rep.accademia: 0.5 }
      - testo: "Dare da mangiare al corvo"
        descrizione: "In tasca hai una crosta di pane, e un corvo che lavora merita la sua paga."
        esito:
          titolo: La paga del corvo
          testo: |
            Pett guarda il pane e poi te, e alla fine posa il biglietto sulla
            panchina per avere il becco libero. Mangia la crosta a piccoli colpi
            sul tuo palmo, poi riprende il biglietto e vola via. La servetta ride
            così forte che le si rovescia un secchio, e del biglietto non hai
            letto una riga.
          pe: { addestrare-animali: 2 }
      - testo: "Ignorarlo"
        descrizione: "Oggi hai altro da fare che leggere la posta dei corvi."
        costo: 0
        esito:
          titolo: La posta bagnata
          testo: |
            Fai per andartene, e Pett ti segue fino alla fontana e ti lascia
            cadere il biglietto nell'acqua davanti ai piedi. L'inchiostro si
            scioglie prima che tu riesca a leggere più di una parola,
            *assistenti*, e il corvo vola via verso l'Accademia con le penne
            arruffate.

      - testo: "Riconoscere la grafia sul biglietto"
        descrizione: "La grafia stretta la conosci dai tuoi compiti, e forse il biglietto è proprio per te."
        quando: [origine.allievo-di-torvessa >= 1]
        esito:
          titolo: Il compito dimenticato
          testo: |
            È la grafia di Orvald, che in poche righe ti ricorda che il compito sui
            cristalli conduttori doveva essere sul suo tavolo ieri, e sotto, con
            un'altra penna, che il caffè dell'aula è ancora cattivo. La servetta
            ride quando capisce che il corvo cercava proprio te. Torni all'Accademia
            con il compito da finire, e Pett ti vola davanti di grondaia in
            grondaia.
          effetti: { rep.accademia: 0.5 }
