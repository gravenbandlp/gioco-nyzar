# La città viva, luogo 15: le carte della città. Solo carte, legate allo stato del mondo.
# Ponti Sospesi: il Raschiatore disperso e l'ultimo posto in squadra (raschiatore >= 1), la lettera di
# Corin da Laresh (pista.corin >= 6, finché il torneo non lo riporta in città: pista.arena == 0).
# Città Bassa: Stroud e l'orco al mercato del bestiame (pista.tribu >= 1).
# Quartieri Alti: Ottilia e la regola della Cripta (contaminazione >= 1; la variante su Mirn il Sordo con
# rep.raschiatori >= 2, perché i requisiti non hanno l'oppure), la stella color lavanda
# (pista.dama-argento >= 9, dopo la sera in cui la vedi per la prima volta dal Ponte del Pesce).
# Nomi nuovi, che il Codex non dà: Nilo (Raschiatore), Pio Varre (recluta), la Vena Storta (un pozzo di
# scavo), Tessaro Vell (maestro dell'Accademia che insegna i calcoli delle stagioni).
storylet:
  # ================================================================ Ponti Sospesi
  - id: carta-un-raschiatore-disperso
    immagine: ambientazione/cicatrice-del-mondo
    titolo: Uno in meno
    sommario: "In cima alle corde la squadra si conta due volte, e alla fine dei conti manca sempre Nilo."
    luogo: Ponti Sospesi, la piattaforma dell'argano sull'orlo della Cicatrice
    tipo: carta
    area: ponti-sospesi
    requisiti: [raschiatore >= 1, visto.carta-un-raschiatore-disperso == 0]
    testo: |
      Sulla piattaforma dell'argano la squadra si conta con una mano sulla
      spalla di quello davanti, e manca Nilo, il più giovane, che si porta
      sempre in tasca una mela per la risalita.

      La sua corda arriva su vuota, con il gancio aperto. Qualcuno dice che
      sarà risalito dal pozzo di levante, e lo dice guardando le assi. Sotto,
      all'altezza del terzo pianerottolo, una lampada da scavo si accende e si
      spegne a intervalli.

      {tecnologia Media} Una lampada che si scarica sfarfalla a caso, e questa
      tiene il tempo, quindi qualcuno la sta accendendo con il pollice.
    opzioni:
      - testo: "Ridiscendere a prenderlo"
        descrizione: "La lampada lampeggia dal terzo pianerottolo, e con una corda nuova ci si arriva prima che cambi il vento."
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Media }
        successo:
          titolo: Il terzo pianerottolo
          testo: |
            Ti cali con una corda nuova legata in vita, che il caposquadra fila da
            sopra sbuffando. Nilo è seduto sul terzo pianerottolo con una caviglia
            gonfia, e fa lampeggiare la lampada perché la voce non gli esce più.
            Te lo leghi addosso e risalite, mentre lui ti chiede scusa a ogni
            strattone. In cima ti mette in mano la mela, ammaccata, perché
            stavolta tocca a te mangiarla.
          pe: { atletica: 3 }
          effetti: { rep.raschiatori: 0.5 }
          imposta: { visto.carta-un-raschiatore-disperso: 1 }
        fallimento:
          titolo: Il saluto
          testo: |
            Trovi Nilo al terzo pianerottolo con una caviglia rotta, e a metà
            della risalita dal fondo sale una folata grigia che fa cedere il campo
            del bracciale. Quelli di sopra vi tirano su a braccia. Nilo se la
            caverà, e tu hai sotto la lingua il sapore di ferro che i veterani
            chiamano il saluto, e una spalla che domani non vorrà saperne di
            alzarsi.
          pe: { resistenza: 2 }
          effetti: { contaminazione: 1, ferite: 0.5 }
          imposta: { visto.carta-un-raschiatore-disperso: 1 }
      - testo: "Leggere la lampada"
        descrizione: "Quando la voce non arriva i Raschiatori parlano con le lampade, e questa sta dicendo qualcosa."
        prova: { attributo: mentale, abilita: [percezione, resilienza], difficolta: Media }
        successo:
          titolo: Tre e due
          testo: |
            Ti stendi sulle assi con la testa oltre il bordo e conti tre lampi lenti
            e due veloci, sempre uguali, che il caposquadra ti traduce a mezza voce.
            Intanto ti accorgi che la luce viene da una sporgenza appena sotto la
            vena dei cristalli, molto più in alto del fondo. Due della squadra
            scendono dritti fin lì con la barella di corda e riportano su Nilo con
            una caviglia rotta.
          pe: { percezione: 3 }
          effetti: { rep.raschiatori: 0.5 }
          imposta: { visto.carta-un-raschiatore-disperso: 1 }
        fallimento:
          titolo: Dentro la parete
          testo: |
            Conti i lampi, ma ogni volta te ne torna uno in più, e poi sotto il
            vento senti battere. Tre colpi lenti e due veloci arrivano dalla
            parete proprio sotto le tue mani, mentre la lampada laggiù è spenta.
            Hai già il pugno chiuso per rispondere quando il caposquadra ti tira
            indietro per la cintura. Nilo lo riportano su all'alba, con una
            caviglia rotta, e del battito non sa niente.
          effetti: { tormento: 1 }
          imposta: { visto.carta-un-raschiatore-disperso: 1 }
      - testo: "Correre a chiamare Dragna"
        descrizione: "Al Grifone Dragna tiene i nomi di chi scende e di chi risale, e se manca qualcuno deve saperlo."
        esito:
          titolo: Il segno a matita
          testo: |
            Corri fino al Grifone, e Dragna ascolta in piedi. Prima che tu abbia
            finito ha già mandato giù due Raschiatori con la barella di corda, e
            accanto al nome di Nilo, sul foglio dei turni, traccia un segno
            piccolo a matita. Lo cancella a mezzanotte, quando lo riportano su con
            una caviglia rotta e la mela ancora in tasca, e intanto ti fa portare
            un boccale senza chiedertelo.
          pe: { resilienza: 2 }
          imposta: { visto.carta-un-raschiatore-disperso: 1 }

      - testo: "Scendere dal pozzo di levante"
        descrizione: "Dal pozzo di levante del tuo primo turno il terzo pianerottolo è a mezza corda."
        quando: [origine.apprendista-raschiatore >= 1]
        prova: { attributo: fisico, abilita: [atletica, tecnologia], difficolta: Facile }
        successo:
          titolo: Nilo e la mela
          testo: |
            Scendi con la corda di riserva dal pozzo di levante, dove le staffe sono
            ancora quelle del tuo primo turno, con una che manca ogni sette, e alla
            settima il piede si allunga da solo. Nilo è seduto sul terzo
            pianerottolo con una caviglia gonfia e fa ancora lampeggiare la lampada.
            Lo leghi a te e risalite piano, e in cima ti regala la mela che si era
            dimenticato.
          pe: { atletica: 3 }
          imposta: { visto.carta-un-raschiatore-disperso: 1 }
          effetti: { rep.raschiatori: 0.5 }
        fallimento:
          titolo: La staffa che manca
          testo: |
            Scendi dal pozzo di levante contando le staffe come al primo turno, e a metà ne
            manca una che allora c'era. Il piede trova il vuoto e batti il ginocchio contro la
            roccia. Arrivi al terzo pianerottolo zoppicando e lo trovi vuoto. Nilo era
            risalito dal pozzo grande, e quando torni su ti aspetta all'argano con la mela in
            mano, rosso fino alle orecchie.
          pe: { resistenza: 2 }
          imposta: { visto.carta-un-raschiatore-disperso: 1 }
          effetti: { contaminazione: 1, ferite: 0.5 }

  - id: carta-dragna-sceglie-chi-scende
    immagine: personaggi/dragna-gro-malog
    titolo: L'ultimo posto in squadra
    sommario: "Sul foglio dei turni di Dragna l'ultimo posto di domani ha due nomi a matita, e uno è il tuo."
    luogo: Locanda del Grifone di Ferro, il tavolo di Dragna
    tipo: carta
    area: ponti-sospesi
    requisiti: [raschiatore >= 1, visto.carta-dragna-sceglie-chi-scende == 0]
    testo: |
      Dragna ti gira davanti il foglio dei turni della Vena Storta, dove per
      il quinto posto ci sono a matita il tuo nome e quello di Pio Varre.

      «Suo padre ha la lanterna sul Ponte dei Morti, e lui vuole scendere per
      l'affitto di sua madre» dice Dragna, indicando un ragazzo di sedici
      anni al bancone. «Il posto è uno, e lo decidi tu.»

      {atletica Media} Il ragazzo ha i polsi sottili, e là sotto sono i polsi
      a decidere.

      {origine apprendista-raschiatore} Pio ha la faccia che avevi tu la
      prima volta che hai visto il tuo nome sul foglio.
    opzioni:
      - testo: "Prendere il posto"
        descrizione: "Alla Vena Storta si lavora appesi alla corda, e si risale con le braccia che tremano."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Media }
        successo:
          titolo: La Vena Storta
          testo: |
            Alla Vena Storta si lavora appesi, con il piccone corto nella mano
            libera e la guancia contro la roccia fredda, e quando un cristallo
            cade intero nel sacco il caposquadra fischia piano. Risali con le dita
            che non vogliono più aprirsi e le tasche pesanti. Al Grifone Pio ti
            guarda passare, e quando Dragna gli dice di nuovo di no se ne va senza
            finire la birra.
          effetti: { cristalli.frammento-esausto: 2, cristalli.cristallo-sterile: 1, monete: 4, rep.raschiatori: 0.5 }
          imposta: { visto.carta-dragna-sceglie-chi-scende: 1 }
        fallimento:
          titolo: La guancia contro la roccia
          testo: |
            Alla seconda ora il piede ti scivola sulla roccia bagnata, e resti
            appeso a girare sopra il buio finché il caposquadra non ti riporta
            contro la parete con un'asta. Per il resto del turno lavori con una
            mano sola, perché l'altra serve a tenerti, e risali con una spalla
            ammaccata e poco nelle tasche. Al Grifone Pio ti guarda il livido, e
            sembra contento di essere rimasto di sopra.
          effetti: { cristalli.frammento-esausto: 1, monete: 2, ferite: 0.5 }
          imposta: { visto.carta-dragna-sceglie-chi-scende: 1 }
      - testo: "Portare giù anche Pio"
        descrizione: "Se in squadra c'è qualcuno che lo tiene d'occhio forse Dragna dice di sì, e quel qualcuno sei tu."
        prova: { attributo: sociale, abilita: [persuasione, empatia], difficolta: Media }
        successo:
          titolo: Sei sulla riga
          testo: |
            Dragna ti lascia parlare guardando il ragazzo, e smette di rigirare la
            penna. Poi aggiunge una sesta riga e ci scrive Pio, premendo fino a
            bucare la carta. «Sta attaccato a te come la corda» dice. «Se torna su
            con un dito in meno, il dito lo paghi tu.» Alla risalita Pio ti porge i
            suoi cristalli perché tu li conti, con le mani che gli tremano ancora.
          pe: { empatia: 2 }
          effetti: { cristalli.frammento-esausto: 2, monete: 2, rep.raschiatori: 0.5 }
          imposta: { visto.carta-dragna-sceglie-chi-scende: 1 }
        fallimento:
          titolo: Uno
          testo: |
            Dragna ti ascolta fino in fondo senza smettere di guardare il ragazzo,
            poi posa la penna di traverso sul foglio e batte una volta i monconi
            sul tavolo. «Uno» dice. Il turno alla Vena Storta lo fai tu, e risali
            stanco con qualche frammento in tasca. Al Grifone Pio è già andato
            via, e il suo boccale è ancora mezzo pieno sul bancone.
          effetti: { cristalli.frammento-esausto: 1, monete: 3, tormento: 0.5 }
          imposta: { visto.carta-dragna-sceglie-chi-scende: 1 }
      - testo: "Lasciare il posto a Pio"
        descrizione: "Tu un'altra squadra la trovi, e lui ha una madre con l'affitto da pagare."
        esito:
          titolo: La sesta lanterna da destra
          testo: |
            Dragna ti guarda a lungo, poi alza il mento verso il bancone, e Pio
            arriva rovesciando uno sgabello. La sera dopo entra al Grifone con le
            mani scorticate e ti offre una birra che costa metà della sua paga, e
            la accetti. Mentre la bevete ti racconta che la lanterna di suo padre è
            la sesta da destra sul secondo tratto del ponte, e che stamattina,
            scendendo, l'ha salutata.
          pe: { empatia: 2 }
          effetti: { tormento: -0.5 }
          imposta: { visto.carta-dragna-sceglie-chi-scende: 1 }

  - id: carta-una-lettera-da-laresh
    immagine: ambientazione/laresh
    titolo: Una lettera da Laresh
    sommario: "Brunella ti consegna una lettera con la cera verde della Gilda, ripiegata su se stessa e senza busta."
    luogo: Locanda del Grifone di Ferro, il bancone
    tipo: carta
    area: ponti-sospesi
    requisiti: [pista.corin >= 6, pista.arena == 0, visto.carta-una-lettera-da-laresh == 0]
    testo: |
      Brunella Fennick ti chiama al bancone e tira fuori una lettera piegata
      in quattro, con la cera verde della Gilda. «È arrivata con il carro del
      sale» dice. «L'ho tenuta all'asciutto, perché a Laresh le lettere le
      usano per incartare il formaggio.»

      {origine mercante-dei-ponti} Il pollice cerca da solo il punto dove il
      sigillo della Gilda si stacca senza rompersi, e Corin l'ha premuto
      storto, probabilmente in piedi su un carro.

      Dentro ci sono quattro fogli scritti davanti e dietro, con una grafia
      che si allarga quando Corin Ashdale si entusiasma, cioè quasi sempre.
    opzioni:
      - testo: "Leggerla con calma"
        descrizione: "Quattro fogli scritti davanti e dietro, e Corin scrive come quando offre da bere."
        esito:
          titolo: Le fiamme azzurre
          testo: |
            La leggi tutta vicino alla finestra, sorridendo da solo. Nel terzo
            foglio Corin racconta di essere uscito una notte con una lanterna dietro
            le fiamme azzurre che a Laresh chiamano gli spiriti dei morti, finché il
            figlio del mugnaio l'ha trovato nel fosso a chiamarle con il fischio dei
            cani. Un eroe, scrive, la prima volta si sente sempre un po' stupido.
            Tornerà prima dell'inverno, con il vino buono.
          effetti: { racconto: 1, tormento: -0.5 }
          imposta: { visto.carta-una-lettera-da-laresh: 1 }
      - testo: "Leggere fra le righe"
        descrizione: "Fra un formaggio e una lumaca, un mercante della Gilda scrive sempre quanto costano le cose."
        prova: { attributo: mentale, abilita: [politica-ed-economia, percezione], difficolta: Facile }
        successo:
          titolo: Il prezzo della macina
          testo: |
            Corin scrive i prezzi anche quando racconta altro. A Laresh i mulini
            sono una concessione dei Malgrani, e quest'anno la macina costa ai
            contadini parecchio più dell'anno scorso, senza un cattivo raccolto a
            giustificarla. I mugnai se ne lamentano, e Corin ha promesso che ne
            avrebbe parlato in città.

            {politica-ed-economia Media} Una concessione che rincara così, di
            solito, vuol dire che a un Casato serve denaro in fretta.
          effetti: { informazioni.pettegolezzo: 1 }
          imposta: { visto.carta-una-lettera-da-laresh: 1 }
        fallimento:
          titolo: Sei formaggi
          testo: |
            Cerchi i numeri e trovi i formaggi. Corin ne descrive sei, e di ognuno
            dice anche il nome della capra, che per due di loro è lo stesso. Quando
            arrivi alla firma sai molte cose sulle capre di Laresh e niente di
            quello che cercavi, e Brunella dal bancone ti chiede se Corin scrive
            sempre così.
          imposta: { visto.carta-una-lettera-da-laresh: 1 }
          effetti: { tormento: 0.5 }
      - testo: "Rispondergli"
        descrizione: "Il carro del sale riparte all'alba, e Brunella ha la carta buona."
        requisiti: [monete >= 1]
        esito:
          titolo: La prima lettera
          testo: |
            Brunella ti presta la carta buona e la penna del registro, e scrivi al
            bancone mentre lei sparecchia intorno a te. La prima riga la ricominci
            due volte. Gli racconti la città, almeno quella che si può affidare a un
            carrettiere, e Brunella sigilla con la cera delle candele e mette la
            lettera nella cassetta del carro, sicura che Corin la leggerà ad alta
            voce a tutta la locanda.
          pe: { espressivita: 3 }
          effetti: { monete: -1 }
          imposta: { visto.carta-una-lettera-da-laresh: 1 }

  # ================================================================ Città Bassa
  - id: carta-stroud-e-l-orco
    immagine: personaggi/dolovan-stroud
    titolo: Il piede caldo
    sommario: "Al mercato del bestiame Dolovan Stroud sta per comprare una cavalla grigia, e un orco gli dice di no."
    luogo: Città Bassa, il mercato del bestiame dietro la Zanna Rotta
    tipo: carta
    area: citta-bassa
    requisiti: [pista.tribu >= 1, visto.carta-stroud-e-l-orco == 0]
    testo: |
      Al mercato del bestiame dietro la Zanna Rotta Dolovan Stroud tasta una
      cavalla, mentre il mercante di Laresh ne elenca i nonni.

      Accanto al recinto c'è un orco anziano con quattro buoi e la fascia dei
      mandriani di Ghoran al braccio. Quando Stroud mette mano alla borsa,
      l'orco parla. «Piede caldo, davanti a sinistra. Sopra c'è pece fresca,
      per non far vedere.»

      {origine fuggiasco-di-ghoran} Quella fascia l'hai vista a Ghoran,
      dall'altra parte dei recinti.

      {origine figlio-del-circolo} Al Circolo una bestia si guarda anche
      mentre cammina.

      Stroud resta di spalle con la mano sulla borsa, e il mercante ride
      troppo forte.
    opzioni:
      - testo: "Alzare lo zoccolo"
        descrizione: "La pece fresca si gratta via con l'unghia, e sotto si vede se l'orco ha ragione."
        prova: { attributo: mentale, abilita: [natura, percezione], difficolta: Media }
        successo:
          titolo: Sotto la pece
          testo: |
            Prendi il nodello della cavalla e lei ti dà lo zoccolo. La pece ancora
            morbida viene via sotto l'unghia, e sotto la suola è calda e cede
            appena la premi. Stroud rimette la borsa nella giubba e dice al
            mercante una parola che non si ripete davanti ai bambini. All'orco non
            dice niente. Passandogli accanto, però, gli stringe con due dita la
            cinghia del giogo che pendeva lenta.
          pe: { natura: 3 }
          effetti: { informazioni.voce: 1 }
          imposta: { visto.carta-stroud-e-l-orco: 1 }
        fallimento:
          titolo: Il prezzo pieno
          testo: |
            Gratti la pece, ma la cavalla sposta il peso e non capisci se la suola
            sia calda o se lo sia la tua mano. Quando dici che non vedi niente,
            Stroud paga al mercante il prezzo pieno, con gli occhi fissi sull'orco
            mentre conta le monete. L'orco tira i suoi buoi verso l'uscita, e la
            cavalla, mentre Stroud la porta via, appoggia la zampa davanti con
            cautela.
          pe: { natura: 1 }
          imposta: { visto.carta-stroud-e-l-orco: 1 }
          effetti: { tormento: 0.5 }
      - testo: "Parlare a Stroud"
        descrizione: "Dolovan odia gli orchi, ma dei cavalli si fida più che delle persone."
        prova: { attributo: sociale, abilita: [empatia, persuasione], difficolta: Media }
        successo:
          titolo: Per la cavalla
          testo: |
            Ti metti accanto a lui e gli dici piano che un orco può anche
            sbagliare, ma la pece fresca sullo zoccolo di una bestia in vendita non
            l'ha messa l'orco. Stroud ascolta con la mascella che gli lavora sotto
            la barba, poi alza lo zoccolo e preme il pollice sulla suola, e la
            cavalla scarta. «Squash l'avrebbe sentito dall'odore» dice, e se ne va
            senza comprare e senza guardare l'orco.
          pe: { empatia: 3 }
          effetti: { informazioni.voce: 1 }
          imposta: { visto.carta-stroud-e-l-orco: 1 }
        fallimento:
          titolo: Fatti i fatti tuoi
          testo: |
            Stroud ti ferma alzando una mano larga e screpolata, che odora di
            finimenti. «Gli orchi li conosco da prima che tu nascessi, e i cavalli
            pure» dice. Paga il mercante senza trattare e porta via la cavalla
            passando così vicino all'orco da sfiorargli la spalla. Più tardi, al
            pozzo, una donna ti dice che alla Zanna Rotta stanotte hanno tenuto
            accesa la lampada nella stalla fino all'alba.
          imposta: { visto.carta-stroud-e-l-orco: 1 }
          effetti: { scandalo: 0.5 }
      - testo: "Lasciar fare a Stroud"
        descrizione: "Fra Dolovan Stroud e un orco, chi si mette in mezzo rischia la parte peggiore di tutti e due."
        costo: 0
        esito:
          titolo: La parola dell'orco
          testo: |
            Resti al tuo posto, e come te tutto il mercato. Stroud guarda l'orco,
            poi si china lo stesso ad alzare lo zoccolo, perché un cavallo è un
            cavallo, e gratta la pece con il pollice. Quello che trova lo fa
            raddrizzare di scatto. Se ne va senza la cavalla e senza una parola, e
            il mercante smette di ridere, mentre l'orco è già all'uscita con i
            suoi buoi.
          imposta: { visto.carta-stroud-e-l-orco: 1 }

  # ================================================================ Quartieri Alti
  - id: carta-ottilia-ti-ferma
    immagine: personaggi/ottilia-sanvel
    titolo: La regola della Cripta
    sommario: "In Via del Velo Ottilia Sanvel ti ferma con due dita sul braccio e ti guarda la mano sinistra."
    luogo: Quartieri Alti, Via del Velo
    tipo: carta
    area: quartieri-alti
    requisiti: [contaminazione >= 1]
    testo: |
      In Via del Velo Ottilia Sanvel scende con due novizi carichi di bende.
      Passandoti accanto torna indietro di un passo, ti posa due dita sul
      polso e ti guarda la mano sinistra finché non comincia a tremare.

      «Ti sei portato addosso la Marea, e dopo alla Cripta non sei passato»
      dice, e ti abbassa la palpebra per guardarti il bianco dell'occhio. «La
      regola vale per tutti, anche per chi ha da fare.»

      {origine accolito-del-velo} Ottilia ti ha mandato lei nella Città Bassa
      con la borsa di bende, e adesso ti guarda come un rotolo tornato
      indietro sporco.
    opzioni:
      - testo: "Seguirla in Cattedrale"
        descrizione: "Ottilia ti porta lei alla Cripta, davanti a chi aspetta, e l'offerta resta quella di prima."
        requisiti: [monete >= 50]
        esito:
          titolo: Davanti alla fila
          testo: |
            Ottilia ti fa scendere la scala della Cripta davanti a tre Raschiatori
            che aspettano sulla panca, e nessuno protesta, anche se uno si
            schiarisce la gola. Le monete cadono nel bacile di rame, e l'accolito
            ti bagna la fronte e ti preme i pollici sulle tempie mentre Ottilia
            resta accanto alla porta. Quando ti rialzi ti guarda la mano sinistra e
            annuisce. «Così» dice, e torna alle sue bende.
          effetti: { monete: -50, contaminazione: -0.5, rep.velo: 0.5, tormento: -0.5 }
      - testo: "Prometterle che ci passerai"
        descrizione: "Ottilia scrive le promesse, e la tua sarebbe per domani."
        costo: 0
        esito:
          titolo: Il quaderno
          testo: |
            Ottilia tira fuori dalla manica un quaderno con la copertina di tela e
            scrive il tuo nome, con la data, sotto una colonna di altri nomi, quasi
            tutti con una crocetta accanto. «Se domani non ti vedo» dice, «ti vengo
            a cercare.» Poi fa cenno ai novizi e riprende a scendere con la cesta
            delle bende.
      - testo: "Chiederle di Mirn il Sordo"
        descrizione: "Il suo nome torna fuori ogni volta che un Raschiatore risale e sente voci, e Ottilia allora c'era."
        requisiti: [rep.raschiatori >= 2]
        costo: 0
        esito:
          titolo: Gli occhi aperti
          testo: |
            Ottilia manda avanti i novizi prima di rispondere. «È rimasto due anni
            in una cella sotto il chiostro. Ripeteva frasi in una lingua che
            nessuno di noi conosceva, e non chiudeva gli occhi nemmeno per
            dormire. Gli portavo io l'acqua.» Di che cosa sia morto nessuno l'ha
            scritto. Ti riprende la mano sinistra. «Voi Raschiatori ve lo
            raccontate per farvi paura. Io te lo racconto perché alla Cripta ci
            passi.»
          pe: { resilienza: 3 }
          effetti: { tormento: 1 }

  - id: carta-una-stella-color-lavanda
    immagine: ambientazione/accademia-di-torvessa
    titolo: La stella color lavanda
    sommario: "Sulla terrazza dell'Accademia un maestro ha piantato un cannocchiale d'ottone, e intorno si è radunata mezza strada."
    luogo: Quartieri Alti, la terrazza dell'Accademia di Torvessa
    tipo: carta
    area: quartieri-alti
    requisiti: [pista.dama-argento >= 9, visto.carta-una-stella-color-lavanda == 0]
    testo: |
      Sulla terrazza dell'Accademia di Torvessa c'è più gente che di giorno.
      Tessaro Vell, un maestro magro con una sciarpa, ha piantato un
      cannocchiale puntato a sud, dove sopra i tetti la stella color lavanda è
      già accesa, e detta numeri a uno studente con una lavagnetta.

      Una cuoca spiega che quella stella porta male ai raccolti, e quando una
      novizia le risponde che a chi prega porta bene, le chiede se allora il
      pane lo fa lei.

      {origine allievo-di-torvessa} Nei corridoi Tessaro Vell cammina rasente
      al muro, e qui fuori ha una voce che non gli hai mai sentito.
    opzioni:
      - testo: "Guardare nel cannocchiale"
        descrizione: "Tessaro Vell lascia guardare chi aspetta il suo turno senza toccare le viti."
        prova: { attributo: mentale, abilita: [accademiche, percezione], difficolta: Facile }
        successo:
          titolo: Una luce ferma
          testo: |
            Tessaro ti mette all'oculare con una mano nervosa sulla spalla, perché
            tu non lo urti. Nel cerchio di vetro le stelle vicine tremano, mentre
            quella color lavanda resta immobile e conserva il suo colore anche in
            basso, dove le altre diventano rosse. Glielo dici, e lui smette di
            dettare. «Le stelle tremano tutte. Questa no, e nei miei libri non c'è»
            dice, e ti chiede il nome per la lavagnetta.
          pe: { accademiche: 3 }
          imposta: { visto.carta-una-stella-color-lavanda: 1 }
        fallimento:
          titolo: Il ciglio
          testo: |
            Appoggi l'occhio all'oculare e ci vedi una cosa grossa e scura che si
            muove quando batti le palpebre. Tessaro ti spiega, con il tono che
            riserva agli studenti del primo anno, che è un tuo ciglio e che la
            stella sta un po' più a sinistra. Quando la trovi un ragazzo ti tira
            la manica perché tocca a lui, e ti resta negli occhi soltanto un
            puntino viola chiaro.
          pe: { percezione: 1 }
          imposta: { visto.carta-una-stella-color-lavanda: 1 }
          effetti: { tormento: 0.5 }
      - testo: "Ascoltare la gente"
        descrizione: "Sulla terrazza ognuno ha una spiegazione, e la dice a voce alta."
        esito:
          titolo: I presagi
          testo: |
            Resti fra la gente, e un vecchio con il bastone giura che la stessa
            stella era in cielo l'anno dell'incendio del Santuario, e un altro gli
            risponde che quell'anno era ubriaco. Due servette dei Castaldi
            decidono che porta un matrimonio e litigano su quale delle due. Un
            bambino sulle spalle del padre dice che è la lanterna di un
            Raschiatore appesa troppo in alto, e nessuno trova niente da
            rispondergli.
          effetti: { informazioni.voce: 1 }
          imposta: { visto.carta-una-stella-color-lavanda: 1 }
      - testo: "Ripensare al racconto di Rennick"
        descrizione: "Alla processione del Solstizio, Rennick ricordava il colore degli occhi di una bambina con i capelli d'argento."
        quando: [rennick.cane >= 1]
        costo: 0
        esito:
          titolo: Viola chiaro
          testo: |
            Guardi la stella e ti torna in mente la voce di Rennick, bassa, sopra il
            bicchiere. Alla processione la bambina aveva gli occhi viola, e mentre
            il cane cadeva le erano diventati color lavanda. *È il colore della
            lavanda, e al Mercato dei Nodi la lavanda la vendono in sacchetti.* Ti
            accorgi di avere le spalle rigide, come quella notte alla Maison, e le
            sciogli una alla volta.
          pe: { resilienza: 2 }
          effetti: { tormento: 1 }
          imposta: { visto.carta-una-stella-color-lavanda: 1 }
      - testo: "Tirare dritto"
        costo: 0
        esito:
          testo: "Prosegui per la tua strada. Alle tue spalle Tessaro Vell detta un altro numero, e lo studente chiede di ripeterlo."
          imposta: { visto.carta-una-stella-color-lavanda: 1 }
