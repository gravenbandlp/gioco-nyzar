# La città viva, luogo 15: le carte della città. Solo carte, legate allo stato del mondo.
# Ponti Sospesi: il Raschiatore disperso e l'ultimo posto in squadra (raschiatore >= 1), la lettera di
# Corin da Laresh (pista.corin >= 6, finché il torneo non lo riporta in città: pista.arena == 0).
# Città Bassa: Stroud e l'orco al mercato del bestiame (pista.tribu >= 1).
# Quartieri Alti: Ottilia e la regola della Cripta (contaminazione >= 1; la variante su Mirn il Sordo con
# rep.raschiatori >= 2, perché i requisiti non hanno l'oppure), la stella color lavanda
# (pista.dama-argento >= 9, dopo la sera in cui la vedi per la prima volta dal Ponte del Pesce).
# Nomi nuovi, che il Codex non dà: Nilo (Raschiatore), Pio Varre (recluta), la Vena Storta (un pozzo di
# scavo), Tessaro Vell (maestro dell'Accademia che insegna i calcoli delle stagioni).
storylet:
  # ================================================================ Ponti Sospesi
  - id: carta-un-raschiatore-disperso
    immagine: ambientazione/cicatrice-del-mondo
    titolo: Uno in meno
    sommario: "In cima alle corde la squadra si conta due volte, e alla fine dei conti manca sempre Nilo."
    luogo: Ponti Sospesi, la piattaforma dell'argano sull'orlo della Cicatrice
    tipo: carta
    area: ponti-sospesi
    requisiti: [raschiatore >= 1, visto.carta-un-raschiatore-disperso == 0]
    testo: |
      Sulla piattaforma dell'argano, a fine turno, la squadra si conta come
      vuole la regola, con una mano sulla spalla di quello davanti. Il
      caposquadra conta due volte, la seconda a voce alta, e ogni volta manca
      Nilo, il più giovane, quello che si porta sempre in tasca una mela per
      la risalita e poi se la dimentica.

      L'ultima volta l'hai visto al terzo pianerottolo, chino su una vena di
      cristalli che veniva via bene. Adesso la sua corda pende lenta oltre il
      bordo, e quando il caposquadra la tira su arriva vuota, con il gancio
      aperto. Qualcuno dice che sarà risalito dal pozzo di levante, e lo dice
      guardando le assi. Ti accorgi di avere ancora i guanti in mano e di
      stringerli tanto da sentire le cuciture contro il palmo.

      {empatia Media} Chi guarda le assi non ci crede. Lo dice perché qualcuno
      deve pur dirlo, e perché finché lo dice nessuno gli chiede di scendere.

      Sotto, nel buio della Cicatrice, una lampada da scavo si accende e si
      spegne a intervalli, piccola come una capocchia di spillo.

      {tecnologia Media} Una lampada che si scarica sfarfalla a caso. Questa
      tiene il tempo, quindi qualcuno la sta accendendo con il pollice.

      Il caposquadra arrotola sul braccio la corda vuota, un giro alla volta,
      e nessuno della squadra si slaccia l'imbracatura.
    opzioni:
      - testo: "Ridiscendere a prenderlo"
        descrizione: "La lampada lampeggia dal terzo pianerottolo. Con una corda nuova e le braccia ancora buone ci si arriva prima che cambi il vento."
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Media }
        successo:
          titolo: Il terzo pianerottolo
          testo: |
            Ti cali con una corda nuova legata in vita, e il caposquadra la
            fila da sopra a braccia, sbuffando a ogni palmo. Trovi Nilo seduto
            sul pianerottolo con la schiena contro la parete e una caviglia
            gonfia come una pagnotta, e fa lampeggiare la lampada con il
            pollice perché la voce non gli esce più. Te lo leghi addosso e
            risalite insieme un palmo alla volta, mentre lui ti chiede scusa a
            ogni strattone, anche a quelli che non sono colpa sua. In cima la
            squadra vi tira su per le cinghie. Nilo ti mette in mano la mela
            della risalita, ammaccata, perché stavolta tocca a te mangiarla.
          pe: { atletica: 3 }
          effetti: { rep.raschiatori: 0.5 }
          imposta: { visto.carta-un-raschiatore-disperso: 1 }
        fallimento:
          titolo: Il saluto
          testo: |
            Arrivi al terzo pianerottolo e trovi Nilo con una caviglia rotta.
            A metà della risalita dal fondo sale una folata grigia, e il campo
            del bracciale ronza e cede con il rumore di una vespa schiacciata.
            Per un lungo tratto la corda la tirano quelli di sopra, mentre tu
            tieni stretto il ragazzo e conti i suoi respiri insieme ai tuoi,
            che non vanno d'accordo. In cima vi stendono tutti e due sulle assi.
            Nilo se la caverà, e tu hai sotto la lingua il sapore di ferro che
            i veterani chiamano il saluto, con una spalla che domani non vorrà
            saperne di alzarsi.

            {medicina Media} Il ferro sotto la lingua è la Marea, e alla Cripta
            lo sanno togliere. La spalla va tenuta ferma e al caldo, cosa che
            non farai.
          pe: { resistenza: 2 }
          effetti: { contaminazione: 0.5, ferite: 0.5 }
          imposta: { visto.carta-un-raschiatore-disperso: 1 }
      - testo: "Leggere la lampada"
        descrizione: "Quando la voce non arriva, i Raschiatori parlano con le lampade. Bisogna capire che cosa sta dicendo questa."
        prova: { attributo: mentale, abilita: [percezione, resilienza], difficolta: Media }
        successo:
          titolo: Tre e due
          testo: |
            Ti stendi sulle assi con la testa oltre il bordo e conti, con il vento
            della Cicatrice che ti entra nel colletto. Tre lampi lenti e due veloci,
            e poi da capo, sempre uguali. Il caposquadra te li traduce a mezza voce.
            Intanto ti accorgi che la luce non viene dal fondo e sta appena sotto la
            vena dei cristalli, dove la parete fa una sporgenza. Due della squadra
            scendono dritti fin lì con la barella di corda e riportano su Nilo con
            una caviglia rotta e la faccia bianca. Il caposquadra ti batte la mano
            sulla spalla una volta sola, come fa Dragna con i monconi sul tavolo
            quando una cosa è decisa.
          pe: { percezione: 3 }
          effetti: { rep.raschiatori: 0.5 }
          imposta: { visto.carta-un-raschiatore-disperso: 1 }
        fallimento:
          titolo: Dentro la parete
          testo: |
            Ti stendi sulle assi e conti i lampi, ma ogni volta te ne torna
            uno in più, come con le pecore nelle notti in cui non si dorme.
            Poi, sotto il vento, senti battere. Tre colpi lenti e due veloci
            arrivano dalla parete della Cicatrice, proprio sotto le tue mani,
            mentre la lampada laggiù è spenta.

            {resilienza Media fallita} È la roccia che si assesta. Te lo ripeti
            tante volte che la frase smette di voler dire qualcosa.

            Hai già il pugno chiuso per rispondere quando il caposquadra ti
            tira indietro per la cintura. Nilo lo riportano su all'alba, con
            una caviglia rotta, e del battito non sa niente. Tu quella notte lo
            senti ancora nelle tempie.
          effetti: { tormento: 0.5 }
          imposta: { visto.carta-un-raschiatore-disperso: 1 }
      - testo: "Correre a chiamare Dragna"
        descrizione: "Al Grifone Dragna tiene i nomi di chi scende e di chi risale. Se manca qualcuno, deve saperlo lei per prima."
        esito:
          titolo: Il segno a matita
          testo: |
            Corri fino al Grifone con il fiato che ti brucia in gola e un
            fianco che ti punge a ogni passo. Dragna ascolta in piedi. Prima
            che tu abbia finito di parlare ha già posato la penna e mandato giù
            due Raschiatori con la barella di corda. Poi riprende il foglio dei
            turni e accanto al nome di Nilo traccia un segno piccolo, a matita,
            di quelli che si cancellano.

            {empatia Facile} Ha scelto la matita prima di sapere com'è finita.
            È il suo modo di scommettere che torna.

            Lo cancella lei a mezzanotte, quando lo riportano su con una
            caviglia rotta e la mela ancora in tasca. Tu resti al suo tavolo
            fino ad allora, e Dragna ti fa portare un boccale senza chiederti
            se lo vuoi.
          pe: { resilienza: 2 }
          imposta: { visto.carta-un-raschiatore-disperso: 1 }

      - testo: "Scendere dal pozzo di levante"
        descrizione: "Al tuo primo turno ti hanno fatto risalire dal pozzo di levante, che è più corto e che nessuno usa. Da lì il terzo pianerottolo è a mezza corda."
        quando: [origine.apprendista-raschiatore >= 1]
        prova: { attributo: fisico, abilita: [atletica, tecnologia], difficolta: Facile }
        successo:
          titolo: Nilo e la mela
          testo: |
            Prendi la corda di riserva e scendi dal pozzo di levante, dove le staffe
            sono ancora quelle del tuo primo turno, con una che manca ogni sette.

            {acrobazia Facile} Il piede se lo ricorda prima di te. Alla settima
            staffa si allunga da solo un po' più in basso, senza chiederti niente.

            Trovi Nilo seduto sul terzo pianerottolo con una caviglia gonfia, e
            continua a far lampeggiare la lampada anche quando ti vede, perché lo
            spavento non ha ancora finito. Lo leghi a te secondo la regola, perché
            chi resta indietro si trascina, e risalite piano. Sulla piattaforma il
            caposquadra conta di nuovo, con la mano sulla spalla di quello davanti,
            e Nilo ti regala la mela che si era dimenticato.
          pe: { atletica: 3 }
          imposta: { visto.carta-un-raschiatore-disperso: 1 }
          effetti: { rep.raschiatori: 0.5 }
        fallimento:
          titolo: La staffa che manca
          testo: |
            Scendi dal pozzo di levante contando le staffe come al primo turno, e a
            metà ne manca una che allora c'era. Il piede trova il vuoto, lo stomaco
            ti sale in gola, e batti il ginocchio contro la roccia con un rumore
            sordo che senti più nei denti che nella gamba. Arrivi al terzo
            pianerottolo zoppicando, con l'aria della Cicatrice che ti brucia in
            gola, e lo trovi vuoto. Nilo era risalito dal pozzo grande mentre tu
            scendevi da quello piccolo, e quando torni su ti aspetta all'argano con
            la mela in mano, rosso fino alle orecchie.
          pe: { resistenza: 2 }
          imposta: { visto.carta-un-raschiatore-disperso: 1 }
          effetti: { contaminazione: 0.5, ferite: 0.5 }

  - id: carta-dragna-sceglie-chi-scende
    immagine: personaggi/dragna-gro-malog
    titolo: L'ultimo posto in squadra
    sommario: "Sul foglio dei turni di Dragna l'ultima riga della squadra di domani ha due nomi a matita, e uno è il tuo."
    luogo: Locanda del Grifone di Ferro, il tavolo di Dragna
    tipo: carta
    area: ponti-sospesi
    requisiti: [raschiatore >= 1, visto.carta-dragna-sceglie-chi-scende == 0]
    testo: |
      Dragna Gro-Malog ti fa sedere battendo i monconi sul tavolo e ti gira
      davanti il foglio dei turni, con una macchia di birra che ha fatto
      ondulare la carta in un angolo. La squadra di domani scende alla Vena
      Storta, una fenditura nella parete della Cicatrice dove i cristalli
      escono buoni e le corde si consumano in fretta, e le manca il quinto.
      Sull'ultima riga ci sono due nomi a matita, uno sopra l'altro. Il primo
      è il tuo, nella grafia squadrata di Dragna. Il secondo, Pio Varre, l'ha
      aggiunto qualcun altro, e le lettere vanno in salita.

      {percezione Facile} Salgono come quelle di chi scrive di rado, in piedi,
      chinato su un bancone e con la paura di essere visto.

      «Sedici anni» dice Dragna, e indica con il mento il bancone, dove un
      ragazzo con le orecchie a sventola finge di guardare la bacheca. «Suo
      padre ha la lanterna sul Ponte dei Morti da due inverni. Vuole scendere
      per pagare l'affitto a sua madre, e io gli ho detto di no tre volte.» Si
      rigira la penna fra le dita buone. «Il posto è uno. Stasera lo decidi
      tu, così domani non lo devo spiegare io.»

      {origine apprendista-raschiatore} La prima volta che hai visto il tuo
      nome a matita sul foglio dei turni ti era sembrato scritto più grande
      degli altri. Pio guarda la bacheca con la faccia che dovevi avere tu
      allora, e con la stessa fretta di scendere.

      {atletica Media} Il ragazzo ha i polsi sottili e le spalle di chi non ha
      mai tirato una corda per un turno intero. Alla Vena Storta, verso la
      terza ora, sono i polsi a decidere.
    opzioni:
      - testo: "Prendere il posto"
        descrizione: "Alla Vena Storta si lavora appesi alla corda, con un piede contro la roccia, e si risale con le braccia che tremano."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Media }
        successo:
          titolo: La Vena Storta
          testo: |
            La Vena Storta corre di sbieco lungo la parete, e ci si lavora
            appesi, con il piccone corto nella mano libera e la guancia contro
            la roccia fredda, e nell'aria un sentore di ferro che i
            Raschiatori fingono di non sentire. I cristalli escono interi,
            uno ogni tanto. Quando ne cade uno nel sacco il caposquadra
            fischia piano, sempre la stessa nota. A fine turno
            risali con le dita che non vogliono più aprirsi e le tasche
            pesanti. Al Grifone Pio ti guarda passare dal bancone, e
            quando Dragna cancella il suo nome dall'ultima riga se ne va senza
            finire la birra.
          effetti: { cristalli.frammento-esausto: 2, cristalli.cristallo-sterile: 1, monete: 4, rep.raschiatori: 0.5 }
          imposta: { visto.carta-dragna-sceglie-chi-scende: 1 }
        fallimento:
          titolo: La guancia contro la roccia
          testo: |
            Alla Vena Storta il piede ti scivola sulla roccia bagnata alla
            seconda ora, e resti appeso alla corda a girare su te stesso,
            sopra il buio, finché il caposquadra non ti riporta contro la
            parete con un'asta. Il cuore ci mette molto più della corda a
            fermarsi. Per il resto del turno lavori con una mano sola, perché
            l'altra serve a tenerti. Risali con una spalla
            ammaccata e poco nelle tasche. Al Grifone Pio ti guarda il livido
            e per la prima volta sembra contento di essere rimasto di sopra.
          effetti: { cristalli.frammento-esausto: 1, monete: 2, ferite: 0.5 }
          imposta: { visto.carta-dragna-sceglie-chi-scende: 1 }
      - testo: "Portare giù anche Pio"
        descrizione: "Se in squadra c'è qualcuno che lo tiene d'occhio, forse Dragna dice di sì. Devi convincerla che quel qualcuno sei tu."
        prova: { attributo: sociale, abilita: [persuasione, empatia], difficolta: Media }
        successo:
          titolo: Sei sulla riga
          testo: |
            Dragna ti lascia parlare guardando il ragazzo, e a un certo punto smette
            di rigirare la penna, che con lei è un buon segno. Poi aggiunge una
            sesta riga sotto la quinta e ci scrive Pio a penna, premendo fino a
            bucare la carta. «Sta attaccato a te come la corda» dice. «Se torna su
            con un dito in meno, il dito lo paghi tu.» Alla Vena Storta Pio lavora
            poco e guarda molto, e alla risalita ti porge i cristalli che ha
            staccato perché tu li conti, uno per uno, con le mani che gli tremano
            ancora.
          pe: { empatia: 2 }
          effetti: { cristalli.frammento-esausto: 2, monete: 2, rep.raschiatori: 0.5 }
          imposta: { visto.carta-dragna-sceglie-chi-scende: 1 }
        fallimento:
          titolo: Uno
          testo: |
            Dragna ti ascolta fino in fondo senza smettere di guardare il
            ragazzo, e la penna continua a girarle fra le dita per tutto il
            tempo. Poi ripassa a penna il tuo nome sopra la matita e cancella
            l'altro con una riga sola. «Uno» dice, e torna ai suoi fogli.

            {persuasione Media fallita} Avevi un argomento buono. L'hai tenuto
            per la fine, e la fine Dragna l'aveva già decisa all'inizio.

            Il turno alla Vena Storta lo fai tu, appeso alla corda con
            il piccone corto, e risali stanco con qualche frammento in tasca.
            Quando torni al Grifone Pio è già andato via, e il suo boccale è
            ancora mezzo pieno sul bancone.
          effetti: { cristalli.frammento-esausto: 1, monete: 3 }
          imposta: { visto.carta-dragna-sceglie-chi-scende: 1 }
      - testo: "Lasciare il posto a Pio"
        descrizione: "Tu un'altra squadra la trovi. Lui ha una madre e un affitto, e una lanterna sul Ponte dei Morti."
        esito:
          titolo: La sesta lanterna da destra
          testo: |
            Dragna ti guarda a lungo, poi cancella il tuo nome e ripassa quello del
            ragazzo a penna, piano, come se la penna potesse cambiare idea. Il
            giorno dopo, a sera, Pio entra al Grifone con la polvere nelle pieghe
            della giacca e le mani scorticate, e ti cerca fra i tavoli. Ti offre una
            birra che costa metà della sua paga, e tu la accetti, perché rifiutarla
            gli farebbe più male delle mani. Mentre la bevete ti racconta che la
            lanterna di suo padre è la sesta da destra sul secondo tratto del ponte,
            e che stamattina, scendendo, l'ha salutata.
          pe: { empatia: 2 }
          effetti: { tormento: -0.5 }
          imposta: { visto.carta-dragna-sceglie-chi-scende: 1 }

  - id: carta-una-lettera-da-laresh
    immagine: ambientazione/laresh
    titolo: Una lettera da Laresh
    sommario: "Brunella ti consegna una lettera con la cera verde della Gilda. Sul retro il tuo nome è sbagliato alla prima lettera, e corretto sopra."
    luogo: Locanda del Grifone di Ferro, il bancone
    tipo: carta
    area: ponti-sospesi
    requisiti: [pista.corin >= 6, pista.arena == 0, visto.carta-una-lettera-da-laresh == 0]
    testo: |
      Brunella Fennick ti chiama al bancone mentre passi e tira fuori da sotto
      il grembiule una lettera piegata in quattro, con la cera verde della
      Gilda e gli angoli consumati dal viaggio. «È arrivata con il carro del
      sale» dice. «L'ho tenuta all'asciutto, perché a Laresh le lettere le
      usano per incartare il formaggio.» Sul retro c'è il tuo nome, sbagliato
      alla prima lettera e corretto sopra con un inchiostro più scuro.

      {origine mercante-dei-ponti} La cera verde è quella delle lettere della
      Gilda, e il pollice cerca da solo il punto dove il sigillo si stacca
      senza rompersi. Corin l'ha premuto storto, probabilmente in piedi su un
      carro che si muoveva.

      {galateo Facile fallita} Un nome corretto sopra, invece di una busta
      nuova. In certe case sarebbe un insulto, e per un momento ti offendi
      senza sapere bene a nome di chi.

      {resistenza Molto facile} La carta ha viaggiato con il sale e se l'è
      tenuto. Ti si secca la bocca solo a girarla fra le mani.

      Dentro ci sono quattro fogli scritti davanti e dietro, con una grafia
      che si allarga verso il fondo della pagina quando Corin Ashdale si
      entusiasma, cioè quasi sempre. Il sale l'ha venduto a un prezzo che ha
      sottolineato due volte. Alla locanda delle lumache nel miele ci è
      stato, e ne è rimasto deluso. In fondo all'ultimo foglio, sotto la
      firma, ha disegnato un cinghiale grande come un carro e accanto ci ha
      scritto *noi*, con una freccia, perché non ci fossero equivoci.
    opzioni:
      - testo: "Leggerla con calma"
        descrizione: "Quattro fogli scritti davanti e dietro. Corin, quando scrive, parla come quando offre da bere."
        esito:
          titolo: Le fiamme azzurre
          testo: |
            Ti siedi vicino alla finestra e la leggi tutta, e a un certo punto
            ti accorgi di sorridere da solo a un foglio di carta. A metà del terzo
            foglio Corin racconta di essere uscito una notte nei campi con una
            lanterna, per vedere da vicino le fiamme azzurre che i contadini
            di Laresh chiamano gli spiriti dei morti. Più si avvicinava e più
            loro si allontanavano, e alla fine il figlio del mugnaio l'ha
            trovato nel fosso a chiamarle con il fischio che si usa per i
            cani. Scrive che un eroe, la prima volta, si sente sempre un po'
            stupido, e che lui sta facendo molta pratica.

            {espressivita Media} La storia è costruita per essere detta ad alta
            voce, con la pausa prima del fosso. Si sente che Corin la sta già
            provando davanti a qualcuno.

            Tornerà prima dell'inverno, scrive, con il vino buono e questa storia da
            raccontare a Liaren.
          effetti: { racconto: 1, tormento: -0.5 }
          imposta: { visto.carta-una-lettera-da-laresh: 1 }
      - testo: "Leggere fra le righe"
        descrizione: "Fra un formaggio e una lumaca, un mercante della Gilda scrive sempre quanto costano le cose."
        prova: { attributo: mentale, abilita: [politica-ed-economia, percezione], difficolta: Facile }
        successo:
          titolo: Il prezzo della macina
          testo: |
            Corin ha l'abitudine dei mercanti di scrivere i prezzi anche
            quando racconta altro, e i prezzi raccontano per conto loro. A
            Laresh i mulini sono una concessione dei Malgrani, e quest'anno la
            macina costa ai contadini parecchio più dell'anno scorso.

            {politica-ed-economia Media} Una concessione che rincara senza un
            cattivo raccolto a giustificarla, di solito, vuol dire che a un
            Casato serve denaro in fretta.

            I mugnai se ne lamentano all'osteria e chiedono a Corin, che è
            della Gilda, se in città qualcuno lo sa. Corin ha promesso ai
            mugnai che ne avrebbe parlato in città.
          effetti: { informazioni.pettegolezzo: 1 }
          imposta: { visto.carta-una-lettera-da-laresh: 1 }
        fallimento:
          titolo: Sei formaggi
          testo: |
            Cerchi i numeri e trovi i formaggi. Corin ne descrive sei, e di ognuno
            dice anche il nome della capra, che per due di loro è lo stesso. Tu li
            leggi tutti con l'attenzione che avevi messo da parte per i prezzi.
            Quando arrivi alla firma sai molte cose sulle capre di Laresh e niente
            di quello che cercavi. Brunella, dal bancone, ti chiede se Corin scrive
            sempre così, e tu le dici di sì.
          imposta: { visto.carta-una-lettera-da-laresh: 1 }
      - testo: "Rispondergli"
        descrizione: "Il carro del sale riparte all'alba. Brunella ha la carta, e il compenso per il carrettiere lo trovi."
        requisiti: [monete >= 1]
        esito:
          titolo: La prima lettera
          testo: |
            Brunella ti presta la carta buona e la penna del registro, e tu scrivi
            al bancone mentre lei sparecchia intorno a te, spostando i boccali con
            un gomito per non disturbarti. La prima riga la ricominci due volte. Gli
            racconti la città, quello che si può scrivere in una lettera che passa
            per le mani di un carrettiere. Alla fine scrivi il suo nome lettera per
            lettera e controlli due volte la prima. Brunella sigilla con la cera
            delle candele e mette la lettera nella cassetta del carro. Secondo lei
            Corin la leggerà ad alta voce a tutta la locanda, e intanto pulisce la
            penna del registro con il grembiule.
          pe: { espressivita: 3 }
          effetti: { monete: -1 }
          imposta: { visto.carta-una-lettera-da-laresh: 1 }

  # ================================================================ Città Bassa
  - id: carta-stroud-e-l-orco
    immagine: personaggi/dolovan-stroud
    titolo: Il piede caldo
    sommario: "Al mercato del bestiame Dolovan Stroud sta per comprare una cavalla grigia, e un orco gli dice che non dovrebbe."
    luogo: Città Bassa, il mercato del bestiame dietro la Zanna Rotta
    tipo: carta
    area: citta-bassa
    requisiti: [pista.tribu >= 1, visto.carta-stroud-e-l-orco == 0]
    testo: |
      Il mercato del bestiame si tiene nello spiazzo di terra battuta dietro
      le Scuderie della Zanna Rotta, fra le capre legate ai pali e un carro di
      fieno su cui dorme il ragazzo che dovrebbe sorvegliarlo, con un filo di
      paglia in bocca che va su e giù a ogni respiro. Dolovan Stroud passa la
      mano sulla schiena di una giovane cavalla grigia mentre il mercante di
      Laresh che la vende gli elenca i nonni della bestia fino alla terza
      generazione.

      {cavalcare Media} La cavalla tiene il peso sui posteriori, e
      l'anteriore sinistro lo posa appena, quando nessuno la tira.

      Accanto al recinto, con quattro buoi da tenere per la cavezza, c'è un
      orco anziano con una zanna spezzata a metà e al braccio la fascia di
      cuoio dei mandriani di Ghoran. Guarda la cavalla da un pezzo. Quando
      Stroud mette mano alla borsa, l'orco parla nella lingua della città,
      lento, con le erre dure. «Piede caldo, davanti a sinistra. Sopra c'è
      pece fresca, per non far vedere.»

      {origine fuggiasco-di-ghoran} La fascia di cuoio dei mandriani l'hai
      vista a Ghoran, dall'altra parte dei recinti, e le spalle ti si curvano
      prima che tu abbia deciso niente. L'orco ti guarda una volta sola e
      torna a guardare la cavalla.

      {origine figlio-del-circolo} Al Circolo una bestia si guarda prima ferma
      e poi mentre cammina, e questa, da ferma, mente meglio di chi la vende.

      Intorno il mercato smette di contrattare, e perfino le capre sembrano
      aspettare. Stroud resta di spalle, con la mano ferma sulla borsa e le
      nocche bianche, e il mercante di Laresh comincia a ridere un po'
      troppo forte per una cosa che non fa ridere nessuno.

      {ingannare Facile} Ride per riempire il silenzio prima che ci entri
      qualcun altro, e intanto sta bene attento a non guardare la zampa
      davanti della cavalla.
    opzioni:
      - testo: "Alzare lo zoccolo"
        descrizione: "La pece fresca si gratta via con l'unghia, e sotto si vede se l'orco ha ragione."
        prova: { attributo: mentale, abilita: [natura, percezione], difficolta: Media }
        successo:
          titolo: Sotto la pece
          testo: |
            Ti chini, prendi il nodello della cavalla e lei ti dà lo zoccolo
            con uno sbuffo che ti scalda la nuca. La pece ancora morbida viene
            via sotto l'unghia e ti resta appiccicata per il resto del giorno.
            Sotto, la suola è calda e cede appena la premi col pollice, e la
            cavalla ritira la zampa. Stroud guarda lo zoccolo a lungo, poi
            rimette la borsa nella giubba e dice al mercante una parola sola,
            che non si ripete davanti ai bambini. All'orco non dice niente.
            Passandogli accanto però si ferma, gli stringe con due dita la
            cinghia del giogo che pendeva lenta, e se ne va senza voltarsi.
          pe: { natura: 3 }
          effetti: { informazioni.voce: 1 }
          imposta: { visto.carta-stroud-e-l-orco: 1 }
        fallimento:
          titolo: Il prezzo pieno
          testo: |
            Ti chini e gratti la pece, ma la cavalla sposta il peso e non
            riesci a capire se la suola sia calda o se lo sia la tua mano.

            {natura Media fallita} Gli zoccoli al sole sono tutti caldi. Suona
            convincente, finché non ricordi che è il primo che alzi in vita tua.

            Ti rialzi dicendo che non vedi niente. Stroud annuisce senza
            guardarti e paga al mercante il prezzo pieno, senza trattare, con
            gli occhi fissi sull'orco mentre conta le monete. L'orco fa
            schioccare la lingua e tira i suoi buoi verso l'uscita. La
            cavalla, mentre Stroud la porta via, appoggia la zampa davanti con
            cautela.
          pe: { natura: 1 }
          imposta: { visto.carta-stroud-e-l-orco: 1 }
      - testo: "Parlare a Stroud"
        descrizione: "Dolovan odia gli orchi, e dei cavalli si fida più che delle persone. Bisogna ricordargli quale delle due cose conta qui."
        prova: { attributo: sociale, abilita: [empatia, persuasione], difficolta: Media }
        successo:
          titolo: Per la cavalla
          testo: |
            Ti metti accanto a lui, di spalle al recinto, e gli parli piano della
            cavalla, come si parla a uno che ha già deciso di non ascoltarti. Gli
            dici che un orco può anche sbagliare, e che la pece fresca sullo zoccolo
            di una bestia in vendita in fiera non l'ha messa l'orco. Stroud ascolta
            senza girarsi, e la mascella gli lavora sotto la barba. Poi si china,
            alza lo zoccolo da solo e preme il pollice sulla suola, e la cavalla
            scarta. «Squash l'avrebbe sentito dall'odore» dice, e se ne va senza
            comprare. All'orco non rivolge nemmeno un'occhiata, e uscendo ti batte
            una mano sulla spalla.
          pe: { empatia: 3 }
          effetti: { informazioni.voce: 1 }
          imposta: { visto.carta-stroud-e-l-orco: 1 }
        fallimento:
          titolo: Fatti i fatti tuoi
          testo: |
            Cominci a parlargli della cavalla, e Stroud ti ferma alzando una
            mano larga e screpolata, che odora di finimenti.
            «Gli orchi li conosco da prima che tu nascessi, e i cavalli
            pure» dice. Paga il mercante senza trattare e porta via la cavalla
            per la cavezza, passando così vicino all'orco da sfiorargli la
            spalla. L'orco resta dov'è, con la cavezza dei buoi in mano. Più
            tardi, al pozzo, una donna ti dice che alla Zanna Rotta stanotte
            hanno acceso la lampada nella stalla e l'hanno tenuta accesa fino
            all'alba.
          imposta: { visto.carta-stroud-e-l-orco: 1 }
      - testo: "Lasciar fare a Stroud"
        descrizione: "Fra Dolovan Stroud e un orco, chi si mette in mezzo rischia di prendersi la parte peggiore di tutti e due."
        costo: 0
        esito:
          titolo: La parola dell'orco
          testo: |
            Resti al tuo posto, e come te tutto il mercato, con le mani in
            tasca e la voglia di essere altrove. Stroud si gira a guardare
            l'orco per la prima volta, a lungo. Poi, con calma, si
            china lo stesso ad alzare lo zoccolo, perché un cavallo è un
            cavallo, e gratta la pece con il pollice. Quello che trova lo fa
            raddrizzare di scatto. Se ne va senza la cavalla e senza dire
            niente a nessuno, e il mercante di Laresh smette di ridere. L'orco
            a quel punto è già all'uscita del mercato con i suoi buoi, e non
            si è voltato a guardare.
          imposta: { visto.carta-stroud-e-l-orco: 1 }

  # ================================================================ Quartieri Alti
  - id: carta-ottilia-ti-ferma
    immagine: personaggi/ottilia-sanvel
    titolo: La regola della Cripta
    sommario: "In Via del Velo Ottilia Sanvel ti ferma con due dita sul braccio e ti guarda la mano sinistra."
    luogo: Quartieri Alti, Via del Velo
    tipo: carta
    area: quartieri-alti
    requisiti: [contaminazione >= 1]
    testo: |
      In Via del Velo, a metà della salita verso la Cattedrale, Ottilia Sanvel
      scende con due novizi che portano una cesta di bende pulite. Quando ti è
      passata accanto si ferma e torna indietro di un passo. Ti posa due dita
      sul braccio senza stringere e ti guarda la mano sinistra finché la mano
      non comincia a tremare per conto suo, come un cane colto sul divano.

      {medicina Media} Le due dita sono sul polso, ed è lì che stanno
      contando. Il tuo, adesso, corre più di quanto vorresti.

      «Ti sei portato addosso la Marea» dice. «Dopo, alla Cripta, non sei
      passato.» Ti abbassa la palpebra con il pollice per guardarti il bianco
      dell'occhio, mentre i novizi tengono la cesta e guardano da un'altra
      parte. Sotto la lingua hai ancora il sapore di ferro, e adesso che lei
      è così vicina ti pare che lo senta anche lei.

      {origine accolito-del-velo} Ottilia ti ha mandato lei nella Città Bassa
      con la borsa di bende, e adesso ti guarda come si guarda un rotolo
      tornato indietro sporco. Il più giovane dei due novizi ti riconosce e si
      morde il labbro per non salutarti.

      {galateo Facile} Per una della Cattedrale fermarsi in strada e tornare
      indietro di un passo è già un rimprovero fatto in pubblico. I novizi lo
      sanno, e per educazione guardano altrove.

      «La regola vale per tutti» dice. «Anche per chi ha da fare.» Uno dei
      novizi ha i lacci delle scarpe di due colori diversi, e se ne accorge
      solo adesso, guardando per terra.
    opzioni:
      - testo: "Seguirla in Cattedrale"
        descrizione: "Ottilia ti porta lei alla Cripta, davanti a chi aspetta. L'offerta resta quella di prima."
        requisiti: [monete >= 50]
        esito:
          titolo: Davanti alla fila
          testo: |
            Ottilia ti fa scendere la scala della Cripta davanti a tre Raschiatori
            che aspettano sulla panca, e nessuno dei tre protesta, anche se uno si
            schiarisce la gola con molta intenzione. Le monete cadono nel bacile di
            rame con un suono che rimbomba più del necessario. L'accolito ti bagna
            la fronte e ti preme i pollici sulle tempie, e Ottilia resta in piedi
            accanto alla porta per tutta la preghiera, con le mani intrecciate
            davanti. Quando ti rialzi ti guarda la mano sinistra un'ultima volta e
            annuisce. «Così» dice, e torna alle sue bende.
          effetti: { monete: -50, contaminazione: -0.5, rep.velo: 0.5, tormento: -0.5 }
      - testo: "Prometterle che ci passerai"
        descrizione: "Domani, o appena puoi. Ottilia ascolta le promesse e le scrive."
        costo: 0
        esito:
          titolo: Il quaderno
          testo: |
            Glielo prometti. Ottilia tira fuori dalla manica un quaderno
            piccolo, con la copertina di tela, e ci scrive il tuo nome sotto
            una colonna di altri nomi, con la data accanto. Molti hanno una
            crocetta, e qualcuno no.

            {intimidire Media} Chiude il quaderno con il palmo aperto, e ti
            viene il sospetto che quelli senza crocetta abbiano ricevuto una
            visita, e che non l'abbiano dimenticata.

            «Se domani non ti vedo» dice, «ti vengo a cercare.» Poi fa cenno ai
            novizi e riprende a scendere, e la cesta delle bende ondeggia fra i due
            novizi.
      - testo: "Chiederle di Mirn il Sordo"
        descrizione: "Fra i Raschiatori il suo nome torna fuori ogni volta che uno di loro risale e sente voci. Ottilia, allora, c'era."
        requisiti: [rep.raschiatori >= 2]
        costo: 0
        esito:
          titolo: Gli occhi aperti
          testo: |
            Ottilia manda avanti i novizi con la cesta e ci mette un po' a
            rispondere, il tempo di sistemarsi una piega della manica che non ne
            aveva bisogno. «È rimasto due anni in una cella sotto il chiostro.
            Ripeteva frasi in una lingua che nessuno di noi conosceva, e non
            chiudeva gli occhi nemmeno per dormire. Gli portavo io l'acqua» dice,
            quando i novizi hanno svoltato l'angolo. Di che cosa sia morto nessuno
            l'ha scritto, racconta, perché nessuno lo sapeva. Poi ti riprende la
            mano sinistra e la guarda di nuovo mentre parla. «Voi Raschiatori ve lo
            raccontate per farvi paura. Io te lo racconto perché alla Cripta ci
            passi.»
          pe: { resilienza: 3 }
          effetti: { tormento: 0.5 }

  - id: carta-una-stella-color-lavanda
    immagine: ambientazione/accademia-di-torvessa
    titolo: La stella color lavanda
    sommario: "Sulla terrazza dell'Accademia un maestro ha piantato un cannocchiale d'ottone, e intorno si è radunata mezza strada."
    luogo: Quartieri Alti, la terrazza dell'Accademia di Torvessa
    tipo: carta
    area: quartieri-alti
    requisiti: [pista.dama-argento >= 9, visto.carta-una-stella-color-lavanda == 0]
    testo: |
      È quasi buio quando passi davanti all'Accademia di Torvessa, e sulla
      terrazza che guarda la Cicatrice c'è più gente di quanta ne veda di
      giorno. Un maestro magro, con i polsini macchiati d'inchiostro e una
      sciarpa girata due volte intorno al collo, ha piantato su un treppiede
      un cannocchiale d'ottone lungo quanto un braccio e lo tiene puntato a
      sud, basso sull'orizzonte. Lì, sopra i tetti, la stella color lavanda è
      già accesa, prima di tutte le altre.

      {accademiche Facile fallita} Dev'esserci un nome antico per le stelle
      che si accendono prima delle altre. Dalla memoria ti arriva soltanto
      quello di una locanda.

      Il maestro si chiama Tessaro Vell, e di solito insegna i calcoli delle
      stagioni a studenti che sbadigliano. Stasera detta numeri a uno di loro,
      che li scrive su una lavagnetta con la lingua fra i denti, e ogni tanto
      si toglie gli occhiali per pulirli sulla sciarpa senza smettere di
      dettare. Dietro di lui una cuoca con le mani ancora infarinate spiega a
      chi le sta vicino che quella stella porta male ai raccolti, e quando una
      novizia del Velo le risponde che a chi prega porta bene, le chiede se
      allora il pane lo fa lei.

      {origine allievo-di-torvessa} Tessaro Vell lo conosci dai corridoi
      dell'Accademia, dove cammina rasente al muro con i fogli stretti al
      petto. Qui fuori, con mezza strada intorno, ha una voce che nei corridoi
      non gli hai mai sentito.

      {conoscenze-della-strada Media} Dei raccolti sai poco. Ai prezzi un
      presagio fa sempre bene, e domani al mercato qualcuno venderà la farina
      come se la stella l'avesse vista lui per primo.

      Il maestro intanto ha ripreso a dettare senza voltarsi.
    opzioni:
      - testo: "Guardare nel cannocchiale"
        descrizione: "Tessaro Vell lascia guardare chi aspetta il suo turno senza toccare le viti."
        prova: { attributo: mentale, abilita: [accademiche, percezione], difficolta: Facile }
        successo:
          titolo: Una luce ferma
          testo: |
            Tessaro ti mette davanti all'oculare tenendoti una mano sulla spalla,
            perché tu non urti il treppiede, e la mano è leggera e nervosa insieme.
            L'ottone è freddo contro lo zigomo. Nel cerchio di vetro le stelle
            vicine tremano come fanno sempre, mentre la stella color lavanda resta
            immobile e netta, e conserva il suo colore anche in basso, dove le altre
            diventano rosse. Glielo dici, e lui smette di dettare. «Le stelle
            tremano tutte» dice. «Questa no, e nei miei libri non c'è.» Ti chiede il
            nome per scriverlo sulla lavagnetta, accanto alla sua osservazione.
          pe: { accademiche: 3 }
          imposta: { visto.carta-una-stella-color-lavanda: 1 }
        fallimento:
          titolo: Il ciglio
          testo: |
            Appoggi l'occhio all'oculare e ci vedi dentro una cosa grossa e
            scura che si muove quando batti le palpebre. Tessaro ti spiega con
            pazienza che è un tuo ciglio, e che la stella sta un po' più a
            sinistra. Lo dice con il tono paziente che deve riservare agli
            studenti del primo anno. Quando la trovi, un ragazzo dietro di te
            ti tira la manica perché tocca a lui. Ti resta negli occhi soltanto un
            puntino viola chiaro, che per un po' vedi anche sulle facciate
            delle case.
          pe: { percezione: 1 }
          imposta: { visto.carta-una-stella-color-lavanda: 1 }
      - testo: "Ascoltare la gente"
        descrizione: "Sulla terrazza ognuno ha una spiegazione, e la dice a voce alta."
        esito:
          titolo: I presagi
          testo: |
            Resti fra la gente con le mani in tasca. Un vecchio con il bastone
            giura che la stessa stella era in cielo l'anno dell'incendio del
            Santuario, e un altro gli risponde che quell'anno lui era ubriaco.
            Due servette dei Castaldi si dividono una castagna e decidono che
            la stella porta un matrimonio, poi litigano su quale delle due.

            {furtivita Facile} Con tutti questi nasi all'insù una borsa si
            sfila senza fatica. Te lo fa notare una parte di te che preferiresti
            non presentare a Tessaro Vell.

            Un bambino, a cavalcioni sulle spalle del padre, dice che è la lanterna
            di un Raschiatore appesa troppo in alto, e nessuno trova niente da
            rispondergli.
          effetti: { informazioni.voce: 1 }
          imposta: { visto.carta-una-stella-color-lavanda: 1 }
      - testo: "Ripensare al racconto di Rennick"
        descrizione: "Alla processione del Solstizio, una bambina con i capelli d'argento. Rennick ricordava il colore dei suoi occhi."
        quando: [rennick.cane >= 1]
        costo: 0
        esito:
          titolo: Viola chiaro
          testo: |
            Guardi la stella e ti torna in mente la voce di Rennick, bassa, sopra il
            bicchiere. Insieme alla voce torna il rumore del bicchiere posato sul
            tavolo, che non avevi chiesto di ricordare. Alla processione la bambina
            aveva gli occhi viola, e mentre il cane cadeva le erano diventati color
            lavanda. *È il colore della lavanda, e al Mercato dei Nodi la lavanda la
            vendono in sacchetti.* Ti accorgi di avere le spalle rigide, come quella
            notte al primo piano della Maison, e le sciogli una alla volta. La
            stella intanto è salita di un dito sopra i tetti, e il maestro detta un
            numero nuovo.
          pe: { resilienza: 2 }
          effetti: { tormento: 0.5 }
          imposta: { visto.carta-una-stella-color-lavanda: 1 }
      - testo: "Tirare dritto"
        costo: 0
        esito:
          testo: "Prosegui per la tua strada. Alle tue spalle Tessaro Vell detta un altro numero, e lo studente chiede di ripeterlo."
          imposta: { visto.carta-una-stella-color-lavanda: 1 }
