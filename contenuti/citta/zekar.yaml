# Lo Zekar al Grifone di Ferro (ottobre 2026). Regole in src/motore/zekar.ts, dal regolamento di Luca e dal Codex.
# Si apre con rep.grifone >= 2. Ogni partita costa un rintocco.
# - Il tavolo dello Zekar: una partita secca con tre poste. Le due basse contro i Raschiatori, la più alta contro
#   Dragna, che per meno non lascia i suoi fogli. Vinci la posta o la perdi.
# - Il torneo del Grifone: quattro tavoli in fila (Raschiatori, Dragna, Orazio Belcanto, Liaren). La quota si paga
#   al primo tavolo; zekar.torneo conta i tavoli vinti. Chi cade al secondo riprende la quota, al terzo una volta
#   e mezza, al quarto il triplo e mezzo punto di rep.grifone; chi batte Liaren sei volte la quota e un punto. La reputazione dal
#   torneo arriva fino a 4, come quella della sala (contenuti/citta/grifone.yaml): oltre servono le storie.
#   Il torneo lo tiene Liaren, quindi è chiuso mentre lei è sparita o ferita (pista.acciaio da 1 a 5).
# Probabilità di vittoria con una mano equilibrata (simulate): Raschiatori 61%, Dragna 53%, Orazio 49%, Liaren 45%.

zekar:
  - id: raschiatori
    nome: I Raschiatori del turno lungo
    immagine: fazioni/raschiatori
    descrizione: "Giocano in fretta per tornare al boccale e si fermano presto, ma con le laterali cercano sempre il venti tondo."
    laterali: [-1, 1, 2, 3]
    soglia: 16
    mira: 20

  - id: dragna-gro-malog
    nome: Dragna Gro-Malog
    immagine: personaggi/dragna-gro-malog
    descrizione: "Tiene le carte con le tre dita che le restano e non ha fretta. Si ferma quando conviene, e le negative le tiene per salvarsi."
    laterali: [-4, -3, 2, 3]
    soglia: 17
    mira: 19

  - id: orazio-belcanto
    nome: Orazio Belcanto
    immagine: personaggi/orazio-belcanto
    descrizione: "Gioca per il pubblico. Ha laterali alte e le cala con un gesto largo, sempre a caccia del venti esatto."
    laterali: [-1, 3, 4, 5]
    soglia: 17
    mira: 20

  - id: liaren-tarvelin
    nome: Liaren Tarvelin
    immagine: personaggi/liaren-tarvelin
    descrizione: "Si spinge più in alto di tutti perché ha in mano solo carte per tornare indietro."
    laterali: [-5, -3, -2, -1]
    soglia: 18
    mira: 19

quality:
  - { id: zekar.torneo, immagine: icone/card-random, nome: Il torneo del Grifone, categoria: stato, descrizione: "I tavoli che hai vinto nel torneo di Zekar in corso al Grifone di Ferro." }

storylet:
  # ------------------------------------------------------------ la partita secca
  - id: zekar-al-grifone
    presso: grifone-di-ferro
    immagine: fazioni/raschiatori
    titolo: Il tavolo dello Zekar
    sommario: "Sotto la scala del Grifone i Raschiatori giocano a Zekar fino a tardi, e una sedia libera c'è sempre."
    luogo: Locanda del Grifone di Ferro, sotto la scala
    area: ponti-sospesi
    ripetibile: true
    requisiti: [rep.grifone >= 2]
    testo: |
      Il tavolo dello Zekar sta sotto la scala, dove il calore del camino arriva appena e la luce viene da una
      lanterna appesa a una trave bassa. Il piano è di castagno, e al centro il legno si è consumato in una
      conca chiara dove si raccolgono i piatti.

      Un ragazzo con la polvere delle rovine ancora nelle pieghe del collo mescola il mazzo e ti fa scivolare
      davanti la scatoletta delle laterali, perché scegli le tue quattro. Dal tavolo dei turni Dragna
      Gro-Malog conta le monete che hai davanti prima di guardare te.

      {origine apprendista-raschiatore} Il tuo nome sta in fondo alla colonna dei turni di piattaforma, e
      Dragna lo sa a memoria. Quando ti vede sedere al tavolo fa la smorfia di quando un turno le torna
      storto.
    opzioni:
      - testo: "Una mano a poste basse"
        descrizione: "I Raschiatori giocano per passare la serata e puntano poco."
        requisiti: [monete >= 10]
        zekar: raschiatori
        vittoria:
          titolo: Il piatto è tuo
          testo: |
            Stavolta la mano gira dalla tua parte, e il ragazzo con la polvere sul collo ti spinge il piatto
            con due dita, senza guardarlo, come si spinge via un piatto vuoto. Le monete sono tiepide delle
            mani che le hanno tenute tutta la sera. «Un'altra» propone qualcuno dal fondo del tavolo. Intanto
            Brunella passa con le scodelle e ti lascia accanto al gomito un pezzo di pane ancora caldo che non
            hai chiesto.
          effetti: { monete: 10 }
        sconfitta:
          titolo: Il venti scappa
          testo: |
            Le carte stasera hanno altri amici. I Raschiatori raccolgono il piatto senza commenti e lo
            dividono a mucchietti sul legno. Uno di loro ti batte sulla spalla la stessa pacca che si danno
            fra loro quando qualcuno risale dai tunnel a mani vuote. È una pacca gentile data con una mano
            dura di piccone, e la spalla te la ricorda per un pezzo.
          effetti: { monete: -10 }

      - testo: "Alzare la posta"
        descrizione: "Al secondo boccale i Raschiatori puntano volentieri qualche moneta in più."
        requisiti: [monete >= 15]
        zekar: raschiatori
        vittoria:
          titolo: Il tavolo si zittisce
          testo: |
            La mano è tua, e il ragazzo che ti sta di fronte resta a guardare le sue carte come se potessero
            ancora cambiare idea. Il tavolo si zittisce, e dall'altra parte della sala si sente il camino che
            scoppietta. Poi il ragazzo ride per primo, e qualcuno ordina un giro a nome tuo prima che tu possa
            dire di no. Le monete del piatto te le contano in mano una per una, come si fa al Grifone con chi
            ha vinto bene.
          effetti: { monete: 15 }
        sconfitta:
          titolo: Una laterale di troppo
          testo: |
            Ripensandoci, ogni scelta di questa mano l'hai fatta un turno troppo presto o un turno troppo
            tardi. Il ragazzo raccoglie le monete con un sorriso che cerca di nascondere senza riuscirci.
            «Capita» dice, e intanto le impila per bene davanti al suo boccale, in torrette tutte della stessa
            altezza che pareggia con la punta del dito.
          effetti: { monete: -15 }

      - testo: "Sfidare Dragna Gro-Malog"
        descrizione: "Il Ferro dei Raschiatori lascia i suoi fogli solo per una posta che valga la serata."
        requisiti: [monete >= 20]
        zekar: dragna-gro-malog
        vittoria:
          titolo: Il Ferro paga
          testo: |
            Dragna guarda a lungo le tue carte prima delle sue, e le posa a faccia in giù con le tre dita
            della mano sinistra. Paga senza discutere dalla borsa di cuoio che tiene legata alla cintura,
            annerita dove sfrega contro la fibbia, e torna ai suoi fogli come se la partita fosse stata una
            voce del registro. Più tardi, passandoti accanto, ti dice che un posto in prima squadra per chi sa
            fermarsi lo trova sempre.
          effetti: { monete: 20 }
        sconfitta:
          titolo: Tre dita bastano
          testo: |
            Dragna gioca come compila i turni, senza sprecare niente. Alla fine la mano è sua. Raccoglie il
            piatto con la mano mutilata, un mucchietto alla volta. Poi intinge la penna e scrive qualcosa sul
            foglio dei turni. Il pennino gratta sulla carta per tutta una riga, e lei non ti dice cosa.
          effetti: { monete: -20 }

  # ------------------------------------------------------------ il torneo
  - id: torneo-del-grifone
    presso: grifone-di-ferro
    immagine: personaggi/liaren-tarvelin
    titolo: Il torneo del Grifone
    sommario: "L'ultima sera della settimana Liaren mette in fila quattro tavoli di Zekar, e chi li vince tutti si porta a casa il boccale."
    luogo: Locanda del Grifone di Ferro, la sala
    area: ponti-sospesi
    ripetibile: true
    requisiti: [rep.grifone >= 2, pista.acciaio != 1, pista.acciaio != 2, pista.acciaio != 3, pista.acciaio != 4, pista.acciaio != 5]
    testo: |
      L'ultima sera di ogni settimana Liaren fa sgomberare il fondo della sala e lascia quattro tavoli in
      fila, dalla porta al camino. Sulla lavagna dei piatti del giorno Brunella scrive con il gesso i nomi
      degli iscritti e tira una riga sopra ogni nome che perde. Sotto i nomi resta l'ombra bianca dei piatti
      di mezzogiorno, cancellati con il palmo. Le quote finiscono in un boccale di peltro sul bancone, sotto
      gli occhi di tutti. Il peltro ha un'ammaccatura sul fianco, e ogni moneta che ci cade dentro suona sorda
      contro le altre.

      {origine mercante-dei-ponti} Le quote nel boccale le stai già contando dal tintinnio, come facevi al
      banco con l'incasso della giornata.

      Al primo tavolo siedono i Raschiatori, al secondo Dragna Gro-Malog con i suoi fogli piegati in tasca. Al
      terzo c'è Orazio Belcanto, con un anello per dito e una sciarpa che si risistema ogni volta che qualcuno
      lo guarda. All'ultimo, vicino al fuoco, aspetta Liaren.
    opzioni:
      - testo: "Iscriverti e sederti al primo tavolo"
        descrizione: "La quota va nel boccale prima di vedere le carte. Chi perde al primo tavolo non riprende niente."
        quando: [zekar.torneo == 0]
        requisiti: [monete >= 20]
        zekar: raschiatori
        vittoria:
          titolo: Il primo tavolo
          testo: |
            I Raschiatori ti stringono la mano uno dopo l'altro, con le dita ruvide di roccia, e il ragazzo
            con la polvere sul collo racconta a tutta la sala di averlo capito subito, che sei un{o|a} che sa
            fermarsi. Lo racconta due volte e la seconda più forte. Al bancone qualcuno batte il boccale sul
            legno. Brunella non tira la riga sul tuo nome. Liaren, dal fondo, alza il boccale di un dito.
          effetti: { monete: -20, zekar.torneo: 1 }
        sconfitta:
          titolo: Una riga di gesso
          testo: |
            Fuori al primo tavolo, contro i Raschiatori. Brunella tira la riga sul tuo nome con un colpo
            deciso che fa stridere il gesso sulla lavagna. Poi soffia via la polvere, che ti arriva fin sulla
            manica. La quota resta nel boccale, insieme a quelle degli altri che ci hanno provato e che
            adesso, dal bancone, ti guardano con simpatia.
          effetti: { monete: -20 }

      - testo: "Il secondo tavolo, contro Dragna"
        descrizione: "Chi cade al secondo tavolo riprende la quota."
        quando: [zekar.torneo == 1]
        zekar: dragna-gro-malog
        vittoria:
          titolo: Il secondo tavolo
          testo: |
            Dragna ti guarda a lungo, come guarda le reclute alla prima discesa, e tu ti senti misurare dalle
            scarpe al collo. Quando si alza per cederti la sedia lo fa con un cenno del mento, che da lei vale
            quanto una stretta di mano. Le sue carte restano sul tavolo allineate al bordo del legno. «Al
            prossimo tavolo c'è Orazio, e parlerà per tutta la partita» dice mentre si rimette i fogli in
            tasca. «Tu non ascoltarlo. Guarda le carte che cala e conta le sue laterali.»
          effetti: { zekar.torneo: 1 }
        sconfitta:
          titolo: Fuori al secondo
          testo: |
            Dragna chiude la partita senza alzare la voce e senza guardarti in faccia, forse per gentilezza.
            Per tutta la mano non ha mai toccato i fogli dei turni che le sporgono dalla tasca. Liaren pesca
            nel boccale senza guardare e ti rende la quota, perché al Grifone chi supera il primo tavolo non
            torna a casa a mani vuote.
          effetti: { monete: 20 }
          imposta: { zekar.torneo: 0 }

      - testo: "Il terzo tavolo, contro Orazio Belcanto"
        descrizione: "Chi cade al terzo tavolo riprende più della quota."
        quando: [zekar.torneo == 2]
        zekar: orazio-belcanto
        vittoria:
          titolo: Il terzo tavolo
          testo: |
            Orazio getta le carte per aria e applaude prima di tutti, così la sala applaude con lui e sembra
            quasi che abbia vinto lui. Una carta ti atterra nel bicchiere e resta a galla di piatto sul vino.
            «Che serata, amici miei, che serata per il Grifone» esclama, e ti stringe le mani fra le sue,
            fredde di anelli. «Dovresti salire sul palco, uno di questi giorni. Stasera però ti aspetta lei, e
            lei il palco non lo cede a nessuno.»
          effetti: { zekar.torneo: 1 }
        sconfitta:
          titolo: Fuori al terzo
          testo: |
            Orazio cala l'ultima carta con un gesto da ultimo atto, e la sciarpa gli scivola giù dalla spalla.
            Si inchina alla sala così in basso che gli anelli battono sulle assi del pavimento, e la sala
            ride. Liaren ti rende dal boccale più di quanto avevi messo, e Orazio insiste per offrirti da bere
            con i tuoi stessi soldi, e non c'è verso di spiegarglielo.
          effetti: { monete: 30 }
          imposta: { zekar.torneo: 0 }

      # la finale ha tre varianti solo per la reputazione: dal torneo arriva fino a 4, come quella della sala
      - testo: "L'ultimo tavolo, contro Liaren"
        descrizione: "Arrivare fin qui paga comunque bene. Battere Liaren vale il boccale e il rispetto della sala."
        quando: [zekar.torneo == 3, rep.grifone <= 3]
        zekar: liaren-tarvelin
        vittoria:
          titolo: Il boccale
          testo: |
            Liaren posa l'ultima carta e ti guarda, e la mano è tua. Poi lei ride e ti mette davanti il
            boccale di peltro con tutto quello che c'è dentro, così pieno che per sollevarlo ti servono due
            mani. Prende il samisen dalla parete per suonare qualcosa che parla di un forestiero fortunato.
            Brunella cancella la lavagna e ci scrive il tuo nome da solo, in lettere più grandi del
            necessario.
          effetti: { monete: 120, rep.grifone: 1 }
          imposta: { zekar.torneo: 0 }
        sconfitta:
          titolo: All'ultimo tavolo
          testo: |
            Liaren gioca alta e tranquilla, e non sbaglia un'uscita. Quando chiudi l'ultimo round il fuoco
            alle sue spalle è sceso a brace. Lei ti tende la mano sopra le carte, una mano calda, con i calli
            delle corde sui polpastrelli. «Fin qui ci arrivano in pochi» dice, e dal boccale ti conta una
            parte che pesa più di quanto hai messo. In sala qualcuno brinda al tuo nome, anche se la riga
            sulla lavagna c'è.
          effetti: { monete: 60, rep.grifone: 0.5 }
          imposta: { zekar.torneo: 0 }

      - testo: "L'ultimo tavolo, contro Liaren"
        descrizione: "Arrivare fin qui paga comunque bene. Battere Liaren vale il boccale e il rispetto della sala."
        quando: [zekar.torneo == 3, rep.grifone == 3.5]
        zekar: liaren-tarvelin
        vittoria:
          titolo: Il boccale
          testo: |
            Liaren posa l'ultima carta e ti guarda, e la mano è tua. Poi lei ride e ti mette davanti il
            boccale di peltro con tutto quello che c'è dentro, così pieno che per sollevarlo ti servono due
            mani. Prende il samisen dalla parete per suonare qualcosa che parla di un forestiero fortunato.
            Brunella cancella la lavagna e ci scrive il tuo nome da solo, in lettere più grandi del
            necessario.
          effetti: { monete: 120, rep.grifone: 0.5 }
          imposta: { zekar.torneo: 0 }
        sconfitta:
          titolo: All'ultimo tavolo
          testo: |
            Liaren gioca alta e tranquilla, e non sbaglia un'uscita. Quando chiudi l'ultimo round il fuoco
            alle sue spalle è sceso a brace. Lei ti tende la mano sopra le carte, una mano calda, con i calli
            delle corde sui polpastrelli. «Fin qui ci arrivano in pochi» dice, e dal boccale ti conta una
            parte che pesa più di quanto hai messo. In sala qualcuno brinda al tuo nome, anche se la riga
            sulla lavagna c'è.
          effetti: { monete: 60, rep.grifone: 0.5 }
          imposta: { zekar.torneo: 0 }

      - testo: "L'ultimo tavolo, contro Liaren"
        descrizione: "Arrivare fin qui paga comunque bene. Battere Liaren vale il boccale."
        quando: [zekar.torneo == 3, rep.grifone >= 4]
        zekar: liaren-tarvelin
        vittoria:
          titolo: Il boccale
          testo: |
            Liaren posa l'ultima carta e ti guarda, e la mano è tua. Poi lei ride e ti mette davanti il
            boccale di peltro con tutto quello che c'è dentro, così pieno che per sollevarlo ti servono due
            mani. Prende il samisen dalla parete per suonare qualcosa che parla di un forestiero fortunato.
            Brunella cancella la lavagna e ci scrive il tuo nome da solo, in lettere più grandi del
            necessario.
          effetti: { monete: 120 }
          imposta: { zekar.torneo: 0 }
        sconfitta:
          titolo: All'ultimo tavolo
          testo: |
            Liaren gioca alta e tranquilla, e non sbaglia un'uscita. Quando chiudi l'ultimo round il fuoco
            alle sue spalle è sceso a brace. Lei ti tende la mano sopra le carte, una mano calda, con i calli
            delle corde sui polpastrelli. «Fin qui ci arrivano in pochi» dice, e dal boccale ti conta una
            parte che pesa più di quanto hai messo. In sala qualcuno brinda al tuo nome, anche se la riga
            sulla lavagna c'è.
          effetti: { monete: 60 }
          imposta: { zekar.torneo: 0 }
