      {politica-ed-economia Difficile} Lo sceriffo ha portato in città gente
      pagata per combattere, e adesso la paga corre e la guerra no. Una
      porta sfondata in Via dei Rasoi gli costerebbe più di quanto costi a
      Gretchen.

      {origine fuggiasco-di-ghoran} Basta la parola Ghoran, e le spalle ti
      si curvano da sole come quando passavano i sorveglianti. Poi pensi a
      Laure, chiusa in una stanza con uno pagato a Ghoran, e la schiena si
      raddrizza senza chiederti il permesso.

      *Una guerra intera per una porta chiusa a chiave.* Stanotte Sara non ti
      ha chiesto le armi, e la mano ti va da sola al fianco.
