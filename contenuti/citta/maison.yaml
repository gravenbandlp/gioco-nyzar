# La città viva, luogo 10: Via dei Rasoi e la Maison des Lunes (presso: via-dei-rasoi, area citta-bassa).
# L'attività delle sere alla porta di servizio, tre storie che sono anche i passi 1, 2 e 6 della quest di fazione
# (contenuti/fazioni/maison/, pista fazione.maison): 1 il quaderno di Sara, 2 la lanterna spenta, con due aperture
# secondo pista.pelle e il seguito alla porta della Luna Calante, 6 ospite della Maison, che dà il secondo grado. Poi
# la carta della catena di bronzo. Il servizio del luogo è il lavoro della sera pagato da Sara e, da ospite, il tè in
# salone che porta pettegolezzi.
# Le storie chiedono il passo della quest (fazione.maison == 0, 1, 5) e lo fanno avanzare; i vecchi flag
# (maison.sara, maison.lanterna, maison.ospite) restano negli esiti perché altre scene li leggono. Il quaderno di Sara
# imposta maison.quaderno, la porta della Luna Calante maison.mare, il signor Pace maison.pace.
# Reputazione: Kanat alla porta, il cliente ubriaco e i conti di Gretchen (fisico, sociale, mentale) la fanno salire
# fino a 4; il turno di sala, il bancone di Sara e il cliente molesto (mentale, sociale, fisico) fino a 6. Le storie
# danno +1 o +½, e la storia a 6 la porta almeno a 4.
# Stato del mondo: prima di pista.pelle 6 la Maison paga gli Scuri e l'uomo della Luna Calante riscuote per
# Mauro; dopo, i conti non hanno più quella colonna e l'uomo è uno dei mercenari di Ghoran.
# Nessuna scena esplicita: il protagonista lavora, ascolta e protegge. Galdrick non è mai nominato come amante
# (la seconda tazza e la matita corta in salone), e la storia a 6 chiede `galdrick.via == 0`, perché mentre lui è
# a Ghoran la tazza non può essere sua. Laure, Kasja e Chiara vengono dal Codex.
storylet:
  # ------------------------------------------------------------ l'attività ripetibile
  - id: le-sere-della-maison
    presso: via-dei-rasoi
    immagine: ambientazione/maison-des-lunes
    titolo: Le sere della Maison
    sommario: "Dietro la Maison des Lunes c'è una porta di servizio, e la sera Sara Beck ci appende la lavagnetta con i lavori da fare."
    luogo: Maison des Lunes, la porta di servizio
    area: citta-bassa
    ripetibile: true
    testo: |
      La porta di servizio della Maison des Lunes dà su un cortiletto di Via
      del Salmone, fra i secchi della cenere e una fila di vasi di basilico
      che qualcuno annaffia con l'acqua dei piatti. Accanto allo stipite è
      appesa una lavagnetta, dove Sara Beck scrive col gesso i lavori della
      sera a lettere tonde, e in fondo, sottolineato due volte, *chi entra di
      qui non sale*. La sera c'è sempre bisogno di qualcuno, e Sara paga a
      fine turno contando le monete sul bancone una per una.

      {conoscenze-della-strada Media} Una casa che ti paga davanti agli
      occhi, moneta per moneta, è una casa che vuole rivederti. In Via dei
      Rasoi non è una cosa che si possa dire di tutte.

      Dalla cucina si vede il corridoio che porta all'ingresso. Kanat è sulla
      soglia a torso nudo anche con il freddo. Ha la mazza alla cintura e i
      tatuaggi che gli salgono fino alle orecchie. Al tavolo della cucina
      Gretchen tiene aperto il libro dei conti accanto a una tazza di latte
      caldo, e ogni tanto chiude gli occhi per fare una somma a mente, con
      le labbra che si muovono appena. Dal salone arrivano voci basse e
      qualche risata, e nessuna musica, perché alla Maison des Lunes non si
      suona mai.

      {resistenza Facile fallita} Il latte di Gretchen manda un filo di
      vapore, e lo stomaco ti ricorda con una certa insistenza che stasera
      non hai cenato.

      *Qui ognuno sa fin dove arriva il suo pezzo di casa.* I piedi ti si
      fermano da soli sullo zerbino della cucina, come se ci fosse una riga
      tracciata per terra.
    opzioni:
      - testo: "Dare una mano a Kanat alla porta"
        descrizione: "Di sera Kanat tiene la porta da solo, e c'è sempre qualcuno che vuole entrare senza appuntamento o uscire senza pagare."
        requisiti: [rep.maison < 4]
        prova: { attributo: fisico, abilita: [atletica, intimidire], difficolta: Media }
        successo:
          titolo: Io rompo, tu parli
          testo: |
            Stai accanto a Kanat sulla soglia per tutta la sera, mezzo passo
            dietro di lui sulla sinistra, come ti ha detto, e dopo un'ora le
            spalle smettono di aspettarsi un pugno. Verso mezzanotte due
            Raschiatori ubriachi vogliono entrare a cantare, e mentre Kanat
            parla con il primo tu prendi il secondo per il gomito e lo porti
            fino al cristallo spento, chiacchierando del tempo come due vecchi
            vicini. Kanat ti guarda tornare e annuisce. «Io rompo, tu parli.
            Funziona» dice. Sara ti paga il turno e scrive qualcosa accanto al
            tuo nome sulla lavagnetta.
          effetti: { monete: 2, rep.maison: 0.5 }
        fallimento:
          titolo: Il gradino
          testo: |
            Verso mezzanotte un carrettiere vuole entrare senza appuntamento, e
            tu ti metti in mezzo prima che Kanat abbia deciso che cosa fare. Il
            carrettiere ti spinge, tu inciampi nel gradino e ti ritrovi seduto
            per terra davanti a mezza Via dei Rasoi, con il fondoschiena che
            protesta e una finestra di fronte che si apre per vedere meglio.
            Kanat solleva il carrettiere per la cintura e lo posa in mezzo alla
            strada con molta delicatezza, poi tende la mano anche a te. Sara ti
            paga una miseria e ti consiglia di stare a sinistra, la prossima
            volta.
          effetti: { monete: 1 }

      - testo: "Tenere compagnia a Sara al bancone"
        descrizione: "Al bancone curvo passano tutti, e Sara li conosce tutti. A chi le tiene compagnia racconta quello che si dice in strada."
        immagine: personaggi/sara-beck
        quando: [pista.pelle < 6]
        prova: { attributo: sociale, abilita: [empatia, percezione], difficolta: Media }
        successo:
          titolo: Chi cambia strada
          testo: |
            Ti siedi su uno sgabello dietro il bancone curvo, e per tutta la
            sera Sara ritira e restituisce armi e intanto ti racconta chi è chi
            senza dire mai un nome. A ogni cliente ti indica con il mento un
            dettaglio da ricordare, come un fodero rammendato o un anello
            girato all'interno, e tu cominci a vedere le persone a partire dai
            foderi. Fra un cliente e l'altro ti dice che questa settimana i
            ragazzi di Mauro Scrocco salgono dalla Pignatta per un'altra strada,
            e che quando gli Scuri cambiano strada vuol dire che hanno
            cominciato a temere qualcuno.

            {conoscenze-della-strada Media fallita} Secondo te hanno soltanto
            trovato una scorciatoia. Lo tieni per te, ed è la cosa più furba
            che fai stasera.
          effetti: { informazioni.voce: 1 }
        fallimento:
          titolo: Le domande le fanno i clienti
          testo: |
            Ti siedi su uno sgabello dietro il bancone e cominci a chiedere a
            Sara chi è il signore con la spilla, e perché la donna velata tiene
            il cappuccio alzato anche dentro. Sara risponde a tutto con un
            sorriso e con nessuna informazione, e lo fa così bene che per un
            po' ti sembra di aver saputo qualcosa. A fine serata ti offre una
            caramella d'orzo dal barattolo e ti spiega che al bancone si
            ascolta, e che le domande le fanno i clienti.

      - testo: "Tenere compagnia a Sara al bancone"
        descrizione: "Al bancone curvo passano tutti, e Sara li conosce tutti. Dopo la notte della Pignatta in strada si dicono cose nuove."
        immagine: personaggi/sara-beck
        quando: [pista.pelle >= 6]
        prova: { attributo: sociale, abilita: [empatia, percezione], difficolta: Media }
        successo:
          titolo: Chi riempie i vuoti
          testo: |
            Ti siedi su uno sgabello dietro il bancone curvo, e per tutta la
            sera Sara ritira e restituisce armi e intanto ti racconta chi è chi
            senza dire mai un nome. Fra un cliente e l'altro, soffiando sulla
            lucerna perché non fumi, ti dice che dopo la notte della Pignatta
            in Città Bassa nessuno passa più a riscuotere, e che proprio per
            questo tutti si guardano intorno. Due fratelli del Ponte del Pesce
            hanno cominciato a girare le botteghe con un quaderno sotto il
            braccio, e per adesso chiedono soltanto il permesso di sedersi.

            {politica-ed-economia Media} Un quaderno sotto il braccio vuol dire
            che tengono i conti fin dal primo giorno. Chi chiede di sedersi
            adesso, fra un mese chiederà la sedia.
          effetti: { informazioni.voce: 1 }
        fallimento:
          titolo: Le domande le fanno i clienti
          testo: |
            Ti siedi su uno sgabello dietro il bancone e cominci a chiedere a
            Sara che cosa si dice in giro adesso che la Pignatta è bruciata.
            Sara risponde con un sorriso e con nessuna informazione, e intanto
            saluta per nome un cliente che arrossisce fino alle orecchie e
            consegna il pugnale come se fosse un mazzo di fiori. A fine
            serata ti offre una caramella d'orzo dal barattolo e ti spiega che
            al bancone si ascolta, e che le domande le fanno i clienti.

      - testo: "Accompagnare a casa un cliente ubriaco"
        descrizione: "Chi esce dalla Maison con il passo storto e la borsa piena non arriva a casa da solo. Sara lo affida a qualcuno che conosce le strade."
        requisiti: [rep.maison < 4]
        prova: { attributo: sociale, abilita: conoscenze-della-strada, difficolta: Media }
        successo:
          titolo: Il giro lungo
          testo: |
            Il cliente è un mercante di stoffe con il mantello buono e la
            lingua impastata, e ha voglia di cantare. Lo porti per il giro
            lungo, lontano dal cristallo spento e dai vicoli dove di notte si
            aspetta qualcuno, e lo tieni sottobraccio come un cugino che ha
            alzato il gomito al matrimonio della sorella. Davanti alla sua
            porta si fruga in tasca e ti dà qualche moneta. Poi ci ripensa e te
            ne aggiunge una manciata per non averlo lasciato cantare. La mattina
            dopo Sara ti chiede soltanto se è arrivato a casa con la borsa.
          effetti: { monete: 4, rep.maison: 0.5 }
        fallimento:
          titolo: L'amico di una sera
          testo: |
            Il cliente si appoggia a te per due strade, poi si stacca per
            abbracciare un amico che non ha mai visto prima. Quando lo riprendi
            sottobraccio ha il mantello slacciato e la borsa sparita, e del
            ragazzino che lo ha abbracciato resta il rumore dei passi in un
            vicolo.

            {ingannare Facile fallita} L'abbraccio era troppo lungo per un
            ubriaco e troppo affettuoso per uno sconosciuto. Adesso lo vedi
            benissimo, a cose fatte.

            Lo porti a casa lo stesso. La mattina dopo Sara ti ascolta fino in
            fondo e scuote la testa, e per questa volta non ti paga.

      - testo: "Rifare i conti di Gretchen"
        descrizione: "Quando Nerissa è fuori i conti della casa li tiene Gretchen, e a fine mese le colonne non tornano mai al primo colpo."
        requisiti: [rep.maison < 4]
        quando: [pista.pelle < 6]
        prova: { attributo: mentale, abilita: politica-ed-economia, difficolta: Media }
        successo:
          titolo: La colonna che torna sempre
          testo: |
            Ti siedi al tavolo della cucina con Gretchen e il libro dei conti,
            e in un'ora trovi l'errore, una partita di candele scritta due
            volte. Gretchen ride con la sua voce profonda e ti versa un dito di
            latte caldo nella tazza col manico incollato. In fondo alla pagina
            c'è una colonna senza intestazione, con la stessa cifra ogni
            settimana, e quando ci posi sopra il dito lei te lo sposta con
            garbo. «Quella torna sempre» dice. Ti paga dalla cassetta della
            cucina.

            {politica-ed-economia Media} Una cifra fissa, ogni settimana, senza
            nome. In Città Bassa una colonna così ha sempre un destinatario
            con un coltello, e il coltello di solito sta alla Pignatta.
          effetti: { monete: 3, rep.maison: 0.5 }
        fallimento:
          titolo: Le candele
          testo: |
            Passi un'ora sul libro dei conti, con le cifre che dopo un po' ti
            ballano davanti agli occhi, e alla fine le colonne tornano soltanto
            perché hai sommato due volte una partita di candele. Gretchen se ne
            accorge al primo sguardo e rifà la somma a mente mentre ti versa il
            latte. Ti paga una miseria per il tempo, e il libro dei conti lo
            richiude lei, con il nastro, prima che tu possa riprovarci.
          effetti: { monete: 1 }

      - testo: "Rifare i conti di Gretchen"
        descrizione: "Quando Nerissa è fuori i conti della casa li tiene Gretchen. Da qualche settimana sono più facili da far tornare."
        requisiti: [rep.maison < 4]
        quando: [pista.pelle >= 6]
        prova: { attributo: mentale, abilita: politica-ed-economia, difficolta: Media }
        successo:
          titolo: La riga tirata
          testo: |
            Ti siedi al tavolo della cucina con Gretchen e il libro dei conti,
            e in un'ora trovi l'errore, una partita di candele scritta due
            volte. In fondo alla pagina c'è una colonna senza intestazione, con
            la stessa cifra ogni settimana fino alla notte della Pignatta, e
            dopo una riga tirata con il righello. Gretchen la guarda insieme a
            te, e passa il pollice sulla riga come per sentire se è ancora lì.
            «Da quella notte non paghiamo più nessuno» dice, «e io continuo a
            lasciare lo spazio, per abitudine.» Ti conta la paga dalla cassetta
            della cucina.

            {empatia Media} Lascia lo spazio perché non si fida ancora. Una
            colonna vuota si riempie in fretta, e lei vuole essere pronta.
          effetti: { monete: 3, rep.maison: 0.5 }
        fallimento:
          titolo: Le candele
          testo: |
            Passi un'ora sul libro dei conti, con le cifre che dopo un po' ti
            ballano davanti agli occhi, e alla fine le colonne tornano soltanto
            perché hai sommato due volte una partita di candele. Gretchen se ne
            accorge al primo sguardo e rifà la somma a mente mentre ti versa il
            latte. Ti paga una miseria per il tempo, e il libro dei conti lo
            richiude lei, con il nastro, prima che tu possa riprovarci.
          effetti: { monete: 1 }

      - testo: "Accendere la lanterna sopra la porta"
        descrizione: "Al tramonto qualcuno deve salire sulla scala con lo stoppino. In Via dei Rasoi tutti guardano quando la lanterna si accende."
        esito:
          titolo: La lanterna accesa
          testo: |
            Sara ti tiene la scala con tutte e due le mani e il mento alzato, e
            tu sali con il bastone e lo stoppino acceso, con un piolo che
            cigola a ogni passo. La lanterna prende al secondo tentativo. Da
            lassù vedi la curva di Via dei Rasoi fino al cristallo spento, e una
            donna che ritira i panni da una finestra all'altra. Quando la luce
            si allarga sulla porta la donna si ferma a guardarla, poi richiude
            le imposte, perché adesso sa che ora è. Sara ti allunga una
            mancia e ti chiama per nome.
          pe: { percezione: 2 }
          effetti: { monete: 1 }

      - testo: "Fare il turno di sala con Tachek"
        descrizione: "In salone Tachek sta vicino alla tenda come un ospite qualunque, e le ragazze gli parlano con le dita. Per un turno quei segnali li guardi anche tu."
        immagine: personaggi/tachek
        requisiti: [rep.maison >= 4, rep.maison < 6]
        prova: { attributo: mentale, abilita: [percezione, empatia], difficolta: Media }
        successo:
          titolo: Il lobo dell'orecchio
          testo: |
            Ti siedi in fondo al salone con un bicchiere d'acqua appena colorata
            di vino, e Tachek ti spiega i segnali senza mai guardarti. Una mano
            sul bracciolo vuol dire una cosa e una ciocca girata dietro
            l'orecchio un'altra. Per un'ora il salone diventa una pagina scritta
            in una lingua che stai imparando. Verso mezzanotte Kasja, quella
            con la medaglia d'oro al collo, si tocca due volte il lobo mentre
            ride a una battuta, e tu te ne accorgi prima di Tachek. Lui appoggia
            due dita sulla cintura, e dieci minuti dopo il cliente è in strada.
            Gretchen ti paga dalla cassetta della cucina, senza contare due
            volte.

            {empatia Media} La risata di Kasja era perfetta. Proprio per questo
            era il segnale più chiaro di tutti.
          effetti: { monete: 5, rep.maison: 0.5 }
        fallimento:
          titolo: Segnali dappertutto
          testo: |
            Tachek ti spiega i segnali senza guardarti, e tu per tutta la sera
            vedi segnali dappertutto, perfino in una ragazza che si gratta il
            naso. Ti alzi due volte per niente, e la seconda il cliente di
            Kasja ti chiede se desideri qualcosa da lui.
            Il segnale vero arriva mentre guardi dall'altra parte, e se ne
            occupa Tachek con una mano sulla spalla del cliente e una voce
            gentile. Gretchen ti paga meno del solito e ti dice che domani si
            ricomincia.
          effetti: { monete: 2 }

      - testo: "Tenere il bancone al posto di Sara"
        descrizione: "Una sera al mese Sara va a trovare la sorella dall'altra parte dei Ponti. Qualcuno deve ritirare le armi e dire di no a chi non ha appuntamento."
        immagine: personaggi/sara-beck
        requisiti: [rep.maison >= 4, rep.maison < 6]
        prova: { attributo: sociale, abilita: [galateo, persuasione], difficolta: Media }
        successo:
          titolo: L'armadio delle armi
          testo: |
            Prendi il posto di Sara dietro il bancone, con la chiave
            dell'armadio appesa al collo e la lavagnetta degli appuntamenti
            davanti. Ritiri le armi a tutti, compreso un bastone animato che il
            proprietario giura di non sapere che si apra.

            {armi-da-mischia Facile} Lo sa benissimo. Il pollice gli è andato
            al fermo della lama prima ancora che tu allungassi la mano.

            A un giovanotto senza
            appuntamento spieghi la regola con tanta cortesia che ti ringrazia
            mentre se ne va. Quando torna, Sara conta le armi nell'armadio una
            per una e ti paga bene.
          effetti: { monete: 5, rep.maison: 0.5 }
        fallimento:
          titolo: Il figlio di qualcuno
          testo: |
            Al bancone va tutto bene finché arriva un signore dei Quartieri
            Alti senza appuntamento e con molta fretta. Gli spieghi la regola,
            lui ti spiega chi è suo padre, e alla fine lo lasci passare per
            evitare una scenata.

            {galateo Media fallita} Un cognome importante, pronunciato bene.
            Ti sei inchinato dentro prima ancora di decidere qualcosa, e lui se
            n'è accorto.

            Dopo due minuti Gretchen lo riaccompagna fuori con la stessa
            cortesia, e poi passa dal bancone a guardarti. Al suo ritorno Sara
            ti paga a metà e cancella con il pollice il tuo nome dalla
            lavagnetta.
          effetti: { monete: 2 }

      - testo: "Accompagnare fuori un cliente molesto"
        descrizione: "Churl ti indica con il mento un uomo che ha alzato la voce con Chiara. Va accompagnato alla porta senza rompergli niente."
        immagine: personaggi/churl-braak
        requisiti: [rep.maison >= 4, rep.maison < 6]
        prova: { attributo: fisico, abilita: [intimidire, rissa], difficolta: Media }
        successo:
          titolo: Intero
          testo: |
            Chiara è seduta sul divano rosso con il portasigarette d'osso nero
            fra le dita, e guarda l'uomo che le parla addosso con molta noia.

            {rissa Media} Ha il peso tutto sul piede davanti e il gomito
            sinistro scoperto. Uno che alza la voce raramente sa dove tiene i
            gomiti.

            Ti avvicini da dietro e gli prendi il gomito con una presa che ti
            ha insegnato Tachek, e lui si ritrova in piedi senza sapere come.
            Lo porti fino alla porta parlandogli piano, come a un cavallo
            nervoso, e Churl gliela apre. «Fuori» dice Churl, poi guarda te.
            «Bene.» Gretchen ti paga senza discutere, e Chiara non alza nemmeno
            gli occhi.
          effetti: { monete: 5, rep.maison: 0.5 }
        fallimento:
          titolo: Il gomito sbagliato
          testo: |
            Gli prendi il gomito sbagliato, e l'uomo si gira e ti pianta un
            pugno sullo zigomo davanti a tutto il salone. Per qualche momento il
            salone ha due lampade in più. Prima che tu possa rispondere Churl lo
            ha già sollevato per il bavero e lo sta portando fuori, senza
            fretta. Chiara ti porge un fazzoletto profumato di fumo dolce e torna
            a guardare il soffitto. Gretchen ti paga la serata e ti mette un po'
            di burro sullo zigomo.
          effetti: { monete: 2, ferite: 0.5 }

      - testo: "Prendere il tè nel salone"
        descrizione: "Da ospite della casa il tè lo bevi in salone, e a quell'ora chi ci passa parla a voce bassa di quello che succede in città."
        immagine: personaggi/nerissa-dalvane
        requisiti: [maison.ospite >= 1]
        prova: { attributo: sociale, abilita: [galateo, empatia], difficolta: Media }
        successo:
          titolo: Il tè della scatola di latta
          testo: |
            Nerissa si siede con te per il tempo di una tazza, e ti fa servire
            il tè buono, quello della scatola di latta, che sa di affumicato e
            ti scalda fino ai polsi. Non ti racconta niente di proposito.
            Lascia cadere una frase su un mercante della Gilda che da un mese
            paga in argento nuovo, e un'altra sulla moglie che non lo sa, e
            quando alzi gli occhi sta già parlando del tempo.

            {politica-ed-economia Difficile} L'argento nuovo in Città Bassa non
            ci arriva da solo. Prima di consumarsi nelle tasche dei facchini
            passa per mani molto più in alto, e quel mercante lo riceve prima
            dei facchini.

            Sulla porta Sara ti saluta per nome, e tu esci con il nome del
            mercante in testa.
          effetti: { informazioni.pettegolezzo: 1 }
        fallimento:
          titolo: Una tazza sola
          testo: |
            Bevi il tè nel salone e fai una domanda di troppo a un cliente
            seduto vicino al camino. Il cliente si alza e va a sedersi
            dall'altra parte, portandosi dietro il cuscino. Nerissa passa
            accanto alla tua poltrona e ti versa un'altra tazza senza dire
            niente, e il silenzio della teiera ti arriva benissimo. Per il resto
            della sera in salone si parla soltanto del prezzo della legna, e
            scopri almeno chi la vende bagnata.
          effetti: { informazioni.voce: 1 }

      - testo: "Riconoscere un cliente dei Quartieri Alti"
        descrizione: "Dalla cucina si vede l'ingresso, e ogni tanto entra una faccia che hai visto a cena. Certi clienti pagano bene per uscire dalla porta di servizio."
        quando: [origine.rampollo-dei-quartieri-alti >= 1]
        requisiti: [rep.maison < 4]
        prova: { attributo: sociale, abilita: [galateo, ingannare], difficolta: Media }
        successo:
          titolo: La porta di servizio
          testo: |
            Stasera è il cognato di un consigliere, che a una festa ti ha parlato per
            un'ora dei suoi uccelli da richiamo mentre tu cercavi con gli occhi la
            porta. Lo riconosci dal passo prima che dal cappuccio e lo dici a Sara,
            che lo ferma con un sorriso e lo manda in cucina.

            {galateo Facile} Il cappuccio è di lana grezza, gli stivali sono di
            capretto. Nei Quartieri Alti ci si traveste sempre a metà.

            Lo accompagni fuori fra i secchi della cenere parlando di uccelli
            da richiamo, finché lui si convince di essere passato di lì per caso. A
            fine turno, sul bancone, Sara conta anche le monete che il cliente ha
            lasciato per il disturbo.
          effetti: { monete: 3, rep.maison: 0.5 }
        fallimento:
          titolo: Il saluto di troppo
          testo: |
            Riconosci il cliente dal passo, ed è un vecchio amico di tuo padre, uno
            che alle cene ti regalava caramelle di menta e ti chiamava campione. Prima
            di pensarci lo saluti per nome dalla porta della cucina, a voce troppo
            alta. Lui si irrigidisce nel corridoio e fa finta di non sentirti, e due
            ragazze in salone si voltano a guardare chi è. Sara ti prende per il
            gomito e ti riporta sullo zerbino. Il cliente esce dall'ingresso
            principale con il cappuccio calato fino al mento, e a fine turno Sara non
            ti chiede di restare.

  # ------------------------------------------------------------ passo 1 · il quaderno di Sara
  - id: il-quaderno-di-sara
    presso: via-dei-rasoi
    immagine: personaggi/sara-beck
    titolo: Il quaderno di Sara
    sommario: "A Qir-Azel tutti dicono che Sara Beck si ricorda ogni cliente. Oggi, a casa chiusa, ti fa vedere come fa."
    luogo: Maison des Lunes, il bancone d'ingresso
    area: citta-bassa
    requisiti: [fazione.maison == 0, pista.capomozzo >= 10]
    testo: |
      È l'ora morta del pomeriggio, quando la Maison è chiusa e le ragazze
      dormono ancora, e Sara Beck ti fa entrare dalla porta grande invece che
      da quella di servizio. Passare da lì senza tirare la catena ti fa
      sentire un po' un ladro. Sara ha i capelli raccolti nel fermaglio
      d'argento e gli occhi arrossati, come se avesse dormito poco. Da sotto
      il bancone curvo tira fuori un quaderno piccolo con la copertina di
      cartone, legato con un nastro verde, e lo apre per te.

      Su ogni pagina c'è un'arma disegnata a matita con molta cura, qui
      un'elsa a canestro e là un fodero rammendato. Sotto ci sono due righe
      nella grafia minuta di Sara, *tè senza zucchero, mancia buona*. Di nomi
      non ce n'è nemmeno uno.

      {armi-da-mischia Media} Le proporzioni sono giuste fino all'ultima
      spanna di lama. Chi disegna così ha tenuto in mano ogni arma del
      quaderno, anche solo per il tempo di appenderla nell'armadio.

      «In città dicono che mi ricordo tutti. Me li ricordo con questo» dice,
      e batte un dito sulla copertina. «La signora non scrive mai un nome, e
      qui dentro nessuno deve scrivere niente. Io disegno le armi, perché le
      armi un nome non ce l'hanno.» Abbassa la voce anche se nella sala non
      c'è nessuno. «Stamattina il nastro era annodato in un altro modo.
      Qualcuno l'ha letto, e io alla signora non l'ho ancora detto.»

      {empatia Facile} Gli occhi rossi vengono da più lontano di stamattina.
      Quel quaderno la tiene sveglia da settimane, e il nastro annodato male
      è soltanto l'ultima goccia.

      {origine rampollo-dei-quartieri-alti} Nei salotti dei Quartieri Alti
      il nome di Sara Beck si dice a mezza voce, e gli uomini che lo dicono
      intanto guardano il bicchiere. Il motivo ce l'hai davanti, legato con
      un nastro verde.

      *Ha paura di dimenticare, in una casa dove ricordare è il mestiere di
      tutti.* Abbassi la voce anche tu, per farle compagnia. Accanto al
      quaderno il nastro verde ha ancora le pieghe di un nodo doppio, con
      un'asola sola.
    opzioni:
      - testo: "Scoprire chi l'ha letto"
        descrizione: "Un nodo è una firma, per chi la sa leggere. In questa casa qualcuno annoda i nastri sempre allo stesso modo."
        prova: { attributo: mentale, abilita: percezione, difficolta: Media }
        successo:
          titolo: Il nodo doppio
          testo: |
            Il nodo con un'asola sola lo ritrovi in cucina, sul nastro che
            tiene chiuso il libro dei conti di Gretchen, stretto con la stessa
            pazienza da contabile. Gretchen scende in vestaglia poco dopo, con
            le pantofole spaiate, vede il quaderno nelle mani di Sara e non
            nega. Dice che
            da settimane la vedeva scrivere di nascosto con gli occhi lucidi, e
            che voleva sapere che cosa la teneva sveglia. Sara stringe le
            labbra e non risponde. Poi Gretchen le rilega il quaderno con il
            suo nodo, e le promette che da adesso glielo terrà lei in cucina,
            sotto il libro dei conti, dove nessun cliente arriva.
          imposta: { maison.sara: 1, maison.quaderno: 2 }
          effetti: { rep.maison: 1, fazione.maison: 1 }
        fallimento:
          titolo: Un nastro qualunque
          testo: |
            Giri il nastro fra le dita e studi la serratura
            dell'armadio e la polvere sul pavimento, e non trovi niente che
            tu sappia leggere.

            {percezione Media fallita} Un nodo è un nodo. Te lo ripeti un paio
            di volte, con la sensazione precisa di averlo già visto da qualche
            parte in questa casa. Sara ti ringrazia lo stesso, con la cortesia
            rapida che usa con i clienti nuovi. Rilega il quaderno con un nodo
            semplice e lo rimette sotto il bancone, e ti accompagna alla porta
            di servizio chiamandoti per nome.

      - testo: "Chiederle perché lo tiene"
        descrizione: "Sara Beck sta alla porta della Maison da vent'anni. Il quaderno ha cominciato a tenerlo per un motivo preciso."
        prova: { attributo: sociale, abilita: empatia, difficolta: Media }
        successo:
          titolo: Il primo anno
          testo: |
            Sara si siede sullo sgabello alto, con i piedi che non arrivano al
            piolo, e ti racconta del suo primo anno alla porta. Un uomo aveva
            fatto male a una ragazza, e la signora lo aveva fatto buttare fuori. Tre mesi dopo era tornato senza barba
            e con un mantello nuovo, e Sara gli aveva sorriso e lo aveva
            lasciato entrare. «La barba la tagli in un'ora» dice, «la spada
            invece te la tieni per vent'anni.» Riavvolge il nastro intorno al
            quaderno, piano. Decide di dirlo lei alla signora stasera stessa, e ti
            chiede soltanto di restare al bancone mentre sale.
          imposta: { maison.sara: 1, maison.quaderno: 2 }
          effetti: { rep.maison: 1, fazione.maison: 1 }
        fallimento:
          titolo: La cortesia rapida
          testo: |
            Le chiedi perché lo tiene, e la domanda ti esce troppo diretta,
            con la voce di uno sbirro al banco dei pegni. Sara ti guarda con la
            cortesia rapida che usa con i clienti nuovi e
            ti dice che ognuno ha le sue abitudini. Rimette il quaderno sotto
            il bancone, e ti accompagna alla porta di servizio parlando del
            tempo e del prezzo dell'olio per la lanterna. Sulla soglia ti
            chiama per nome come sempre, e richiude la porta a chiave due volte.

      - testo: "Aiutarla a bruciarlo"
        descrizione: "Un quaderno che nessuno ha mai letto è un segreto. Uno che qualcuno ha letto è già un pericolo."
        esito:
          titolo: Pagina per pagina
          testo: |
            Sara ci pensa un po', poi apre lo sportello della stufa in cucina.
            Prima di bruciare ogni pagina ti mostra il disegno e ti dice a voce
            bassissima chi è, e lo indovina quasi sempre. Il calore della stufa
            ti arriva sulle guance e la carta brucia in fretta, più in fretta di
            quanto ci voglia a disegnarla. Alla trentesima pagina si ferma con
            il foglio in mano e non ricorda.

            {medicina Media} Le mani le tremano appena, con il tremito sottile
            che viene dopo settimane di sonno corto. Stanotte, forse, dormirà. Lo rigira
            fra le dita, poi lo butta nella stufa insieme agli altri. Quando
            resta soltanto la copertina di cartone si asciuga gli occhi con il
            dorso della mano e ti dice che per vent'anni il quaderno le è
            servito più che altro per dormire.
          pe: { empatia: 5 }
          imposta: { maison.sara: 1, maison.quaderno: 1 }
          effetti: { rep.maison: 1, fazione.maison: 1 }

      - testo: "Consigliarle di portarlo alla signora"
        descrizione: "Nerissa Dalvane non scrive mai un nome. Forse è proprio la persona a cui consegnare un quaderno senza nomi."
        immagine: personaggi/nerissa-dalvane
        esito:
          titolo: La scatola del tè
          testo: |
            Sara sale la scala curva con il quaderno stretto al petto, e tu
            resti al bancone a guardare la porta, con l'orecchio teso verso il
            primo piano da cui non arriva niente. Torna dopo un quarto d'ora
            a mani vuote, con gli occhi rossi e la schiena dritta. Ti racconta
            che la signora lo ha chiuso a chiave nella scatola di latta del tè
            buono senza aprirlo, e ha detto che da stasera è roba sua, e che se
            qualcuno lo legge ancora ne risponde lei. Sara ti stringe la mano
            con le sue mani piccole e asciutte.
          pe: { persuasione: 5 }
          imposta: { maison.sara: 1, maison.quaderno: 3 }
          effetti: { rep.maison: 1, fazione.maison: 1 }

      - testo: "Leggerne qualche pagina mentre è voltata"
        descrizione: "Prima o poi la catena suonerà, e Sara andrà alla porta. Un quaderno così vale molto, a saperlo leggere."
        prova: { attributo: sociale, abilita: [ingannare, furtivita], difficolta: Media }
        successo:
          titolo: L'elsa incisa
          testo: |
            La catena suona, e mentre Sara va alla porta tu sfogli il quaderno
            con un dito, il cuore che batte un po' più del necessario. Su una
            pagina c'è un'elsa con uno stemma dei Quartieri Alti disegnato fin
            nei dettagli, e sotto, nella grafia minuta di Sara, *beve prima di
            entrare, la signora lo rimanda a casa*. Quando Sara torna il
            quaderno è chiuso dove l'aveva lasciato. Le dici che il nastro si
            sarà allentato da solo, e lei, sollevata, ti crede.

            {ingannare Media} Ti ha creduto perché voleva crederti. Una bugia
            che consola si vende da sola.
          imposta: { maison.sara: 1, maison.quaderno: 4 }
          effetti: { rep.maison: 0.5, informazioni.pettegolezzo: 1, fazione.maison: 1 }
        fallimento:
          titolo: Il dito sulla pagina
          testo: |
            La catena suona e Sara va alla porta, ma a metà strada si volta a
            prendere la chiave dell'armadio e ti trova con il dito sulla
            pagina. Il dito resta lì, come se non fosse tuo. Riprende il quaderno senza gridare, lo rilega con un nodo
            stretto e ti accompagna alla porta di servizio con la cortesia
            che riserva ai clienti che non torneranno. Per un pezzo, la sera, alla
            porta della Maison non ti chiamerà per nome.
          imposta: { maison.sara: 1, maison.quaderno: 5 }
          effetti: { rep.maison: -1, fazione.maison: 1 }

  # ------------------------------------------------------------ passo 2 · la lanterna spenta, prima della Pignatta
  - id: la-lanterna-spenta-di-nuovo
    presso: via-dei-rasoi
    immagine: ambientazione/maison-des-lunes
    titolo: La lanterna spenta, di nuovo
    sommario: "Passata mezzanotte, sopra la porta della Maison la lanterna è spenta. Sara Beck ti aspetta in mezzo alla strada."
    luogo: Via dei Rasoi, dopo mezzanotte
    area: citta-bassa
    requisiti: [fazione.maison == 1, pista.pelle < 6]
    testo: |
      È passata mezzanotte, e quando giri il gomito di Via dei Rasoi la
      lanterna sopra la porta della Maison è spenta. Le finestre della via
      sono buie, e dietro un'imposta senti girare un chiavistello. Il collo
      ti si irrigidisce prima che tu sappia perché. Sara Beck è sulla soglia
      con uno scialle sulle spalle, e appena ti vede ti viene incontro fino
      al cristallo spento, cosa che non fa mai.

      {furtivita Facile} In Via dei Rasoi le imposte si chiudono quando la
      gente vuole poter dire di non aver visto niente. Tu, in mezzo alla
      strada, sei l'unica cosa che si vede.

      «Meno male che sei passato» dice, e ti prende per la manica. Mentre ti
      porta dentro ti racconta tutto a bassa voce. Un uomo è salito al primo
      piano con Laure, la più minuta delle ragazze, e si è chiuso a chiave
      nella stanza della Luna Calante. Aveva un coltello nello stivale, e
      all'armadio non l'ha lasciato. Laure ha battuto il segnale sul muro, e
      adesso Kanat è davanti alla porta con la mazza in mano.

      Gretchen ti aspetta in fondo alla scala, truccata come sempre, con le
      mani strette sul corrimano. Ti dice che la signora è fuori e che
      stanotte la casa la tiene lei. «Quell'uomo riscuote per Mauro Scrocco.
      Se Kanat sfonda la porta, domani alla Pignatta diranno che la Maison ha
      rotto le ossa a uno degli Scuri, e laggiù aspettano proprio una scusa
      così» dice. La voce è ferma, le nocche sul corrimano no. «Mi serve
      Laure fuori di lì senza sangue sulle scale.»

      {conoscenze-della-strada Media} Uno che riscuote e si chiude dentro
      con una ragazza vuole far vedere che può. Forse Mauro ignora tutto di
      stanotte, e domani dirà lo stesso di averlo mandato lui.

      {origine figlio-della-citta-bassa} Nei vicoli hai imparato presto che
      cosa vuol dire riscuotere per Mauro Scrocco, e quali facce è meglio
      dimenticare. Quella chiusa nella Luna Calante, a quanto pare, ha
      deciso di farsi ricordare.

      *Una guerra intera per una porta chiusa a chiave.* Stanotte Sara non ti
      ha chiesto le armi, e la mano ti va da sola al fianco.
    opzioni:
      - testo: "Salire con Gretchen"
        descrizione: "La Luna Calante è in fondo al corridoio del primo piano. Kanat aspetta solo un cenno."
        esito:
          titolo: Il terzo gradino
          testo: |
            Sali la scala curva dietro Gretchen, che tiene sollevato l'orlo del
            vestito con due dita come per andare a un ballo. Il terzo gradino
            scricchiola sotto di te e tace sotto di lei, che sa dove mettere i
            piedi da vent'anni.
          segue: la-porta-della-luna-calante
      - testo: "Dirle che stanotte non puoi"
        descrizione: "Una casa di Via dei Rasoi ha i suoi buttafuori, e tu non sei uno di loro."
        costo: 0
        esito:
          titolo: La lanterna resta spenta
          testo: |
            Gretchen annuisce senza discutere e torna verso la scala. Sara ti
            riaccompagna fuori e richiude la porta, e tu resti in strada sotto
            la lanterna spenta finché al primo piano qualcuno chiude una
            finestra. Mentre ti allontani verso il Ponte del Pesce senti le
            spalle rigide fino alle orecchie, e per due strade non ti volti a
            guardare se la lanterna si è riaccesa.

