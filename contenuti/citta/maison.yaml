    titolo: La lanterna spenta, di nuovo
    sommario: "Gli Scuri non ci sono più, eppure stanotte sopra la porta della Maison la lanterna è spenta. Sara Beck ti aspetta in mezzo alla strada."
    luogo: Via dei Rasoi, dopo mezzanotte
