            vestito con due dita. Il terzo gradino scricchiola sotto di te e
            tace sotto di lei, che sa dove mettere i piedi da vent'anni.
          segue: la-porta-della-luna-calante
      - testo: "Dirle che stanotte non puoi"
        descrizione: "Una casa di Via dei Rasoi ha i suoi buttafuori, e tu non sei uno di loro."
        costo: 0
        esito:
          titolo: La lanterna resta spenta
          testo: |
            Gretchen annuisce senza discutere e torna verso la scala. Sara ti
            riaccompagna fuori e richiude la porta, e tu resti in strada sotto
            la lanterna spenta finché al primo piano qualcuno chiude una
            finestra. Mentre ti allontani verso il Ponte del Pesce senti le
            spalle rigide fino alle orecchie.

  - id: la-porta-della-luna-calante
    immagine: ambientazione/maison-des-lunes
    titolo: La porta della Luna Calante
    tipo: seguito
    luogo: Maison des Lunes, primo piano
    area: citta-bassa
    requisiti: [maison.lanterna == 0]
    testo: |
      Al primo piano la carta da parati è color vino, e lungo il corridoio
      uno degli specchi a mezzaluna è ancora girato verso il muro, come se
      nessuno avesse mai trovato il tempo di raddrizzarlo. Kanat occupa il
      corridoio da una parete all'altra, con la mazza appoggiata alla spalla
      e i tatuaggi lucidi di sudore. In cima alla scala di servizio Tachek
      aspetta con due dita sulla cintura.

      Dietro la porta della Luna Calante l'uomo parla forte, e da un quarto
      d'ora ripete che ha pagato e che la ragazza deve smetterla di piangere.
      Laure invece non piange affatto. La sua voce arriva bassa e regolare, e
      gli sta chiedendo da dove viene.

      «Due spinte e la porta viene giù» dice Kanat senza voltarsi. «Lui
      dopo esce a pezzi, e i pezzi li raccoglie la signora.»

      Gretchen ti posa una mano sulla schiena. Ti dice piano che la stanza ha
      una finestra sul tetto della casa accanto e che la serratura è vecchia
      quanto la casa. Il resto lo lascia decidere a te, e intanto tiene gli
      occhi sulla porta senza sbattere le palpebre.
    opzioni:
      - testo: "Parlargli attraverso la porta"
        descrizione: "Un uomo stanco e ubriaco cerca soprattutto un modo di uscire senza sembrare uno sconfitto. Puoi offrirglielo tu."
        prova: { attributo: sociale, abilita: [persuasione, empatia], difficolta: Media }
        successo:
          titolo: Il coltello sotto la porta
          testo: |
            Ti siedi per terra con la schiena contro la porta e gli parli come
            a uno che conosci da anni. Gli dici che nessuno lo ha visto entrare
            con il coltello, e che nessuno lo vedrà uscire, se esce adesso. Lui
            tace per un pezzo. Poi la lama scivola sotto la porta, contro il
            tuo stivale, e la chiave gira. Kanat si fa da parte, e Tachek lo
            accompagna giù senza toccarlo. Laure esce per ultima e si ferma
            davanti a te. «Una volta o l'altra raccontami di un mare» dice. «Anche
            di uno solo.»
          imposta: { maison.lanterna: 1 }
          effetti: { rep.maison: 1 }
        fallimento:
          titolo: La voce sbagliata
          testo: |
            Gli parli attraverso la porta, ma usi la voce sbagliata, e lui si
            mette a gridare contro di te invece che contro Laure. Mentre grida,
            dall'altra parte la chiave gira piano. Laure apre la porta di una
            spanna e si sfila fuori sotto il suo braccio, e Kanat entra prima
            che l'uomo si volti. Lo porta giù per la scala tenendolo per la
            collottola, con il coltello ancora nello stivale e le ossa intere.
          imposta: { maison.lanterna: 1 }
          effetti: { rep.maison: 0.5 }

      - testo: "Entrare dalla finestra"
        descrizione: "Dalla finestra del corridoio si arriva sul tetto della casa accanto, e da lì alla finestra della Luna Calante."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Media }
        successo:
          titolo: Sul tetto accanto
          testo: |
            Esci dalla finestra del corridoio e cammini sulle tegole della casa
            accanto, che scricchiolano più di quanto vorresti. La finestra della
            Luna Calante è socchiusa. L'uomo sta in piedi in mezzo alla stanza,
            voltato verso la porta, e Laure è seduta sul letto con le mani in
            grembo. Lei ti vede e non cambia espressione. Gli chiede un
            bicchiere d'acqua, e mentre lui si gira verso la brocca tu sei già
            dentro con una mano sul suo polso. Il coltello cade sul tappeto
            senza far rumore.
          imposta: { maison.lanterna: 1 }
          effetti: { rep.maison: 1 }
        fallimento:
          titolo: La grondaia
          testo: |
            A metà strada la grondaia cede sotto il tuo piede, e resti appeso
            al bordo del tetto con le gambe nel vuoto sopra Via del Salmone.
            L'uomo sente il rumore e corre alla finestra a guardare. Laure apre
            la porta alle sue spalle, e Kanat lo prende prima che si volti. Ti
            tira su Tachek, per il colletto, con una mano sola. Hai le palme
            sbucciate e un ginocchio che ti farà male per giorni.
          imposta: { maison.lanterna: 1 }
          effetti: { rep.maison: 0.5, ferite: 0.5 }

      - testo: "Lasciar fare a Kanat"
        descrizione: "Due spinte e la porta viene giù. Il resto lo decideranno alla Pignatta."
        quando: [pista.pelle < 6]
        esito:
          titolo: Due spinte
          testo: |
            Basta un tuo cenno, e alla seconda spinta di Kanat la porta viene
            giù con tutto il telaio. L'uomo esce dalla Luna Calante con il
            braccio piegato nel verso sbagliato, e il coltello resta sul
            tappeto. Laure esce dopo di lui senza un graffio. Tre giorni dopo
            due ragazzi di Mauro rompono i vetri del pianterreno con i sassi,
            e Gretchen paga il vetraio di tasca sua. Quando passi per Via dei
            Rasoi, adesso, ti saluta con un po' meno calore di prima.
          imposta: { maison.lanterna: 1 }
          effetti: { rep.maison: 0.5, rep.scuri: -1 }

      - testo: "Lasciar fare a Kanat"
        descrizione: "Due spinte e la porta viene giù. Il resto lo dovrà sistemare lo sceriffo."
        quando: [pista.pelle >= 6]
        esito:
          titolo: Due spinte
          testo: |
            Basta un tuo cenno, e alla seconda spinta di Kanat la porta viene
            giù con tutto il telaio. Il mercenario esce dalla Luna Calante con
            il braccio piegato nel verso sbagliato, e Laure esce dopo di lui
            senza un graffio. La mattina dopo sei mercenari scendono dalla
            Caserma e restano un'ora davanti al cristallo spento a guardare la
            porta, finché arriva lo sceriffo in
            persona a rimandarli su, per servizio. Gretchen lo ringrazia sulla
            soglia, e a te non dice niente per una settimana.
          imposta: { maison.lanterna: 1 }
          effetti: { rep.maison: 0.5, rep.caserma: -0.5 }

      - testo: "Aspettare davanti alla porta con Kanat"
        descrizione: "Laure sta parlando, e da come parla sa quello che fa. Puoi fidarti di lei e aspettare tutta la notte."
        costo: 2
        esito:
          titolo: Le ragazze decidono
          testo: |
            Ti siedi sul pavimento del corridoio accanto a Kanat, e per un'ora
            ascoltate tutti e due la voce di Laure dietro la porta. Gli chiede
            del suo paese e del fiume dove andava a pescare da bambino. La
            voce dell'uomo si fa più lenta, e verso le tre si spegne del tutto. Allora la chiave gira, e
            Laure esce scalza con il coltello in mano, tenuto per la lama. Lo
            porge a Kanat e ti guarda. «Dorme. Domattina avrà mal di testa, e
            Sara gli renderà il coltello sulla porta» dice.
          pe: { resilienza: 5 }
          imposta: { maison.lanterna: 1 }
          effetti: { rep.maison: 1 }

  # ------------------------------------------------------------ storia a 6 · ospite della Maison
  - id: ospite-della-maison
    presso: via-dei-rasoi
    immagine: personaggi/nerissa-dalvane
    titolo: Ospite della Maison
    sommario: "Stasera Sara Beck non ti indica l'armadio delle armi. Nerissa Dalvane ti aspetta in salone, con la teiera sul tavolino."
    luogo: Maison des Lunes, il salone
    area: citta-bassa
    requisiti: [rep.maison >= 6, maison.ospite == 0, galdrick.via == 0]
    testo: |
      Questa volta, quando tiri la catena, Sara Beck apre la porta grande e
      non indica l'armadio. Ti guarda prima la cintura e poi la faccia, e si
      sposta di lato con un mezzo inchino che non le hai mai visto fare.
      «La signora ti aspetta in salone. Le armi tienile, stasera sei un
      ospite» dice.

      Il salone a quest'ora è vuoto. Le lampade con gli schermi di vetro fumé
      danno la solita luce color miele, e sullo schermo crepato la carta
      dipinta si è staccata da un angolo. Nerissa Dalvane siede in una delle
      poltrone di cuoio, con un vestito scuro abbottonato fino al collo e la
      teiera sul tavolino. Accanto alla teiera c'è una seconda tazza vuota ma
      ancora tiepida, e sul piattino una matita corta come un dito, con i
      segni dei denti vicino alla punta.

      Nerissa ti versa il tè della scatola di latta, quello buono. «In questa
      casa un ospite entra con le sue armi e beve il tè in salone, e Churl gli
      apre prima che tiri la catena» dice. «Lo diventano in pochi. In cambio
      chiedo una cosa sola, e prima di chiederla voglio sapere se sei capace
      di darmela.» Posa la tazza sul piattino senza far rumore. «Dimmi il
      nome di un cliente che hai visto passare di qui.»

      *È la domanda che farei io, se avessi una casa da difendere.* Il tè ti
      scotta la lingua, e lo tieni in bocca lo stesso.
    opzioni:
      - testo: "Non dirle nessun nome"
        descrizione: "In questa casa i nomi non si scrivono e non si dicono. Forse la risposta giusta è il silenzio."
        esito:
          titolo: La cosa sola
          testo: |
            Bevi il tè e non dici niente. Nerissa aspetta, e tu aspetti con
            lei, finché la tazza è vuota. «Bene» dice alla fine. La cosa che
            chiede è quella che hai appena fatto. I nomi che senti in questa
            casa restano tuoi anche fuori di qui, perfino davanti allo
            sceriffo. Ti versa una seconda tazza e ti racconta, con
            misura, di un consigliere che da un mese entra dalla porta di
            servizio. «Benvenuto» dice, e Sara, dalla soglia, ti chiama per
            nome.
          pe: { galateo: 5 }
          imposta: { maison.ospite: 1 }
          effetti: { rep.maison: 1, informazioni.pettegolezzo: 1 }

      - testo: "Inventarle un nome"
        descrizione: "Un nome che non esiste non tradisce nessuno. Basta che suoni vero, e che non sia di qualcuno che lei conosce."
        prova: { attributo: sociale, abilita: [ingannare, espressivita], difficolta: Media }
        successo:
          titolo: Il signor Nessuno
          testo: |
            Le dici con molta serietà che il martedì passa un certo Bertoldo
            Pace, mercante di bottoni, che porta sempre un garofano. Nerissa
            ti osserva da sopra la tazza, e poi ride per la prima volta
            da quando la conosci, piano, con la mano davanti alla bocca. «Il
            signor Pace è sempre il benvenuto» dice. La cosa che chiede è
            quella che hai appena fatto, perché i nomi che senti in questa
            casa devono restare tuoi anche fuori di qui. Ti versa una seconda
            tazza e, insieme, una notizia su un consigliere che da un mese
            entra dalla porta di servizio.
          imposta: { maison.ospite: 1 }
          effetti: { rep.maison: 1, informazioni.pettegolezzo: 1 }
        fallimento:
          titolo: Un nome vero
          testo: |
            Le dici il primo nome che ti viene in mente, sicuro di averlo
            inventato. Nerissa posa la tazza. È il nome di un mugnaio della
            Città Bassa che viene qui il giovedì, e tu lo avevi sentito al
            bancone senza farci caso. «Torna quando avrai imparato a
            dimenticarli» dice senza alzare la voce. Sara ti
            riaccompagna alla porta con un sorriso cortese.
          effetti: { scandalo: 0.5 }

      - testo: "Chiederle della seconda tazza"
        descrizione: "La tazza è ancora tiepida, e la matita sul piattino non è di Nerissa."
        costo: 0
        esito:
          titolo: Per servizio
          testo: |
            Nerissa guarda la tazza e poi la matita, e non le sposta. «È
            passato lo sceriffo, per servizio» dice. Lo dice con la voce piana
            con cui si dà l'ora, e ti versa il tè senza aggiungere altro. Dal
            fondo del salone Churl tossisce una volta sola.
          segue: ospite-della-maison

      - testo: "Chiederle di Jass"
        descrizione: "Jass ti passa ancora quello che sente, e Nerissa non è una donna a cui sfuggono le cose della sua casa."
        immagine: personaggi/jass
        quando: [jass == 1]
        costo: 0
        esito:
          titolo: Due padroni
          testo: |
            «So che Jass ti parla» dice Nerissa prima che tu finisca la
            domanda. «Non ti chiedo che cosa ti dice. Le ragazze decidono, e
            lei ha deciso così.» Gira la tazza sul piattino di un quarto di
            giro. «Una ragazza che parla con te ha meno tempo per parlare con
            altri, e io questo lo chiamo un buon affare.»
          segue: ospite-della-maison

      - testo: "Dirle che non sei pronto"
        descrizione: "Una porta aperta senza armadio è anche un impegno. Puoi chiederle di aspettare."
        costo: 0
        esito:
          titolo: Il tè resta caldo
          testo: |
            Le dici che per adesso preferisci restare uno che lavora dalla
            porta di servizio. Nerissa annuisce, come se se lo aspettasse, e
            finisce il suo tè. «La teiera la tengo calda» dice. Sara ti
            accompagna fuori, e prima di richiudere ti tende la mano aperta,
            per abitudine, come per farsi dare le armi che stasera non ti ha
            preso.

  # ------------------------------------------------------------ la carta
  - id: carta-la-catena-di-bronzo
    immagine: ambientazione/maison-des-lunes
    titolo: La catena di bronzo
    sommario: "In Via dei Rasoi tre ragazzini si sfidano a tirare la catena di una porta senza insegna e a scappare prima che qualcuno apra."
    luogo: Via dei Rasoi, di giorno
    tipo: carta
    area: citta-bassa
    requisiti: [rep.maison < 2, pista.dama-argento < 5]
    testo: |
      Di giorno Via dei Rasoi è una strada come le altre, con i panni stesi
      da una finestra all'altra e un arrotino che fa girare la mola davanti a
      una porta. All'angolo con Via del Salmone c'è una casa di legno a tre
      piani con le tende chiuse e nessuna insegna, e accanto alla porta pende
      una catena di bronzo con due parole incise, *Ospiti Benvenuti*. Tre
      ragazzini si sfidano a tirarla e a scappare prima che qualcuno apra, e
      dentro il campanello suona per la quarta volta.

      Al quinto strappo il gancio si stacca dal legno, e la catena cade sul
      gradino con un rumore di posate. I ragazzini spariscono verso il
      cristallo spento. La porta si apre, e sulla soglia compare una halfling
      con i capelli raccolti in un fermaglio d'argento e uno sgabello in mano.
      Guarda la catena per terra e il gancio che pende, e alla fine guarda
      te, l'unico rimasto in strada.

      «Sara Beck» dice, e ti tende lo sgabello. «Tu ci arrivi, lassù?»
    opzioni:
      - testo: "Riattaccare la catena"
        descrizione: "Il gancio è alto, e a Sara Beck mancano tre spanne buone."
        esito:
          titolo: Il gancio
          testo: |
            Sali sullo sgabello e pianti il gancio nel legno battendolo con un
            sasso, mentre Sara ti tiene per la cintura e ti dice dove colpire.
            Quando la catena è di nuovo al suo posto la tira una volta per
            prova, e dentro il campanello suona. Ti ringrazia e ti dice che, se
            cerchi lavoro la sera, la porta di servizio è quella sul cortile di
            Via del Salmone, e che lì nessuno chiede appuntamenti.
          effetti: { rep.maison: 0.5 }
      - testo: "Correre dietro ai ragazzini"
        descrizione: "Sono spariti verso il cristallo spento, e uno dei tre zoppica."
        prova: { attributo: fisico, abilita: atletica, difficolta: Facile }
        successo:
          titolo: Il più lento
          testo: |
            Prendi il più lento per il colletto dietro il cristallo spento. È
            un ragazzino con le ginocchia sbucciate, e per farsi lasciare andare
            ti racconta d'un fiato tutto quello che sa della strada, chi litiga
            con chi e quale finestra si apre di notte. Quando torni la catena è
            già al suo posto, e Sara sta rientrando con lo sgabello sotto il
            braccio.
          effetti: { informazioni.voce: 1 }
        fallimento:
          titolo: Il cortile
          testo: |
            Al cristallo spento i ragazzini si dividono e infilano tre portoni
            diversi, e tu ti fermi in mezzo alla strada senza fiato. Quando
            torni la catena è già al suo posto, appesa un po' storta, e sotto
            il gancio c'è un sasso con il segno dei colpi. Sara sta rientrando
            con lo sgabello sotto il braccio e non si volta.
      - testo: "Tirare dritto"
        costo: 0
        esito:
          testo: "Prosegui verso Via del Salmone. Dietro di te Sara Beck sale sullo sgabello, si alza in punta di piedi e non ci arriva."
