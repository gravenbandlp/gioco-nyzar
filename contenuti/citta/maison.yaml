        fallimento:
          titolo: Il cortile
          testo: |
            Al cristallo spento i ragazzini si dividono e infilano tre portoni
            diversi, e tu ti fermi piegato in due con una fitta sotto le costole.
            Quando torni la catena è già al suo posto, appesa un po' storta, con
            sotto il gancio un sasso segnato dai colpi, e Sara sta rientrando con
            lo sgabello sotto il braccio.
