# La città viva, luogo 10: Via dei Rasoi e la Maison des Lunes (presso: via-dei-rasoi, area citta-bassa).
# L'attività delle sere alla porta di servizio, tre storie che sono anche i passi 1, 2 e 6 della quest di fazione
# (contenuti/fazioni/maison/, pista fazione.maison): 1 il quaderno di Sara, 2 la lanterna spenta, con due aperture
# secondo pista.pelle e il seguito alla porta della Luna Calante, 6 ospite della Maison, che dà il secondo grado. Poi
# la carta della catena di bronzo. Il servizio del luogo è il lavoro della sera pagato da Sara e, da ospite, il tè in
# salone che porta pettegolezzi.
# Le storie chiedono il passo della quest (fazione.maison == 0, 1, 5) e lo fanno avanzare; i vecchi flag
# (maison.sara, maison.lanterna, maison.ospite) restano negli esiti perché altre scene li leggono. Il quaderno di Sara
# imposta maison.quaderno, la porta della Luna Calante maison.mare, il signor Pace maison.pace.
# Reputazione: Kanat alla porta, il cliente ubriaco e i conti di Gretchen (fisico, sociale, mentale) la fanno salire
# fino a 4; il turno di sala, il bancone di Sara e il cliente molesto (mentale, sociale, fisico) fino a 6. Le storie
# danno +1 o +½, e la storia a 6 la porta almeno a 4.
# Stato del mondo: prima di pista.pelle 6 la Maison paga gli Scuri e l'uomo della Luna Calante riscuote per
# Mauro; dopo, i conti non hanno più quella colonna e l'uomo è uno dei mercenari di Ghoran.
# Nessuna scena esplicita: il protagonista lavora, ascolta e protegge. Galdrick non è mai nominato come amante
# (la seconda tazza e la matita corta in salone), e la storia a 6 chiede `galdrick.via == 0`, perché mentre lui è
# a Ghoran la tazza non può essere sua. Laure, Kasja e Chiara vengono dal Codex.
storylet:
  # ------------------------------------------------------------ l'attività ripetibile
  - id: le-sere-della-maison
    presso: via-dei-rasoi
    immagine: ambientazione/maison-des-lunes
    titolo: Le sere della Maison
    sommario: "Alla porta di servizio della Maison des Lunes, la sera, Sara Beck appende la lavagnetta dei lavori."
    luogo: Maison des Lunes, la porta di servizio
    area: citta-bassa
    ripetibile: true
    testo: |
      La porta di servizio della Maison des Lunes dà su un cortiletto di Via
      del Salmone, fra i secchi della cenere e una fila di vasi di basilico.
      Sulla lavagnetta accanto allo stipite Sara Beck scrive col gesso i
      lavori della sera, e in fondo, sottolineato due volte, *chi entra di
      qui non sale*.

      Dalla cucina si vede il corridoio fino all'ingresso, dove Kanat sta
      sulla soglia a torso nudo. Al tavolo Gretchen tiene aperto il libro
      dei conti accanto a una tazza di latte caldo, e muove appena le labbra
      quando fa una somma.
    opzioni:
      - testo: "Dare una mano a Kanat alla porta"
        descrizione: "Di sera Kanat tiene la porta da solo, e c'è sempre chi vuole entrare senza appuntamento."
        requisiti: [rep.maison < 4]
        prova: { attributo: fisico, abilita: [atletica, intimidire], difficolta: Media }
        successo:
          titolo: Io rompo, tu parli
          testo: |
            Stai accanto a Kanat sulla soglia tutta la sera, mezzo passo dietro di
            lui sulla sinistra, come ti ha detto. Verso mezzanotte due Raschiatori
            ubriachi vogliono entrare a cantare, e mentre Kanat parla con il primo
            tu porti il secondo fino al cristallo spento chiacchierando del tempo
            come due vecchi vicini. «Io rompo, tu parli. Funziona» dice Kanat
            quando torni, e Sara ti paga il turno.
          effetti: { monete: 2, rep.maison: 0.5 }
        fallimento:
          titolo: Il gradino
          testo: |
            Verso mezzanotte un carrettiere vuole entrare senza appuntamento, e tu
            ti metti in mezzo prima che Kanat decida. Il carrettiere ti spinge e
            finisci seduto per terra davanti a mezza Via dei Rasoi, finché Kanat
            lo solleva per la cintura e lo posa in mezzo alla strada con molta
            delicatezza. Sara ti paga una miseria e ti consiglia di stare a
            sinistra, la prossima volta.
          effetti: { monete: 1 }

      - testo: "Tenere compagnia a Sara al bancone"
        descrizione: "Al bancone curvo passano tutti, e a chi le tiene compagnia Sara racconta quello che si dice in strada."
        immagine: personaggi/sara-beck
        quando: [pista.pelle < 6]
        prova: { attributo: sociale, abilita: [empatia, percezione], difficolta: Media }
        successo:
          titolo: Chi cambia strada
          testo: |
            Dietro il bancone curvo Sara ritira e restituisce armi per tutta la
            sera e ti racconta chi è chi senza dire un nome, indicandoti con il
            mento un fodero rammendato o un anello girato all'interno. Fra un
            cliente e l'altro ti dice che i ragazzi di Mauro Scrocco salgono dalla
            Pignatta per un'altra strada, e che quando gli Scuri cambiano strada
            hanno cominciato a temere qualcuno.
          effetti: { informazioni.voce: 1 }
        fallimento:
          titolo: Le domande le fanno i clienti
          testo: |
            Cominci a chiedere a Sara chi è il signore con la spilla e perché la
            donna velata tiene il cappuccio alzato anche dentro. Sara risponde a
            tutto con un sorriso e nessuna informazione, così bene che per un po'
            ti sembra di aver saputo qualcosa. A fine serata ti offre una
            caramella d'orzo e ti spiega che al bancone si ascolta, e le domande
            le fanno i clienti.

      - testo: "Tenere compagnia a Sara al bancone"
        descrizione: "Al bancone curvo passano tutti, e dopo la notte della Pignatta in strada si dicono cose nuove."
        immagine: personaggi/sara-beck
        quando: [pista.pelle >= 6]
        prova: { attributo: sociale, abilita: [empatia, percezione], difficolta: Media }
        successo:
          titolo: Chi riempie i vuoti
          testo: |
            Per tutta la sera Sara ritira e restituisce armi, e fra un cliente e
            l'altro ti dice che dopo la notte della Pignatta in Città Bassa
            nessuno passa più a riscuotere, e proprio per questo tutti si guardano
            intorno. Due fratelli del Ponte del Pesce hanno cominciato a girare le
            botteghe con un quaderno sotto il braccio, e per adesso chiedono
            soltanto il permesso di sedersi.
          effetti: { informazioni.voce: 1 }
        fallimento:
          titolo: Le domande le fanno i clienti
          testo: |
            Chiedi a Sara che cosa si dice adesso che la Pignatta è bruciata. Lei
            risponde con un sorriso e nessuna informazione, e intanto saluta per
            nome un cliente che arrossisce e consegna il pugnale come un mazzo di
            fiori. A fine serata ti offre una caramella d'orzo e ti spiega che al
            bancone si ascolta, e le domande le fanno i clienti.

      - testo: "Accompagnare a casa un cliente ubriaco"
        descrizione: "Chi esce dalla Maison con il passo storto e la borsa piena non arriva a casa da solo."
        requisiti: [rep.maison < 4]
        prova: { attributo: sociale, abilita: conoscenze-della-strada, difficolta: Media }
        successo:
          titolo: Il giro lungo
          testo: |
            Il cliente è un mercante di stoffe con il mantello buono e la lingua
            impastata, e ha voglia di cantare. Lo porti per il giro lungo, lontano
            dai vicoli dove di notte si aspetta qualcuno, tenendolo sottobraccio
            come un cugino al matrimonio della sorella. Davanti alla sua porta ti
            dà qualche moneta. Poi ci ripensa e ne aggiunge una manciata per non
            averlo lasciato cantare.
          effetti: { monete: 4, rep.maison: 0.5 }
        fallimento:
          titolo: L'amico di una sera
          testo: |
            Il cliente si appoggia a te per due strade, poi si stacca per
            abbracciare un amico che non ha mai visto prima. Quando lo riprendi
            sottobraccio la borsa è sparita, e del ragazzino che lo ha abbracciato
            resta il rumore dei passi in un vicolo. Lo porti a casa lo stesso, e
            la mattina dopo Sara scuote la testa e per questa volta non ti paga.

      - testo: "Rifare i conti di Gretchen"
        descrizione: "Quando Nerissa è fuori i conti li tiene Gretchen, e le colonne non tornano mai al primo colpo."
        requisiti: [rep.maison < 4]
        quando: [pista.pelle < 6]
        prova: { attributo: mentale, abilita: politica-ed-economia, difficolta: Media }
        successo:
          titolo: La colonna che torna sempre
          testo: |
            In un'ora trovi l'errore, una partita di candele scritta due volte, e
            Gretchen ride con la sua voce profonda e ti versa un dito di latte
            nella tazza col manico incollato. In fondo alla pagina c'è una colonna
            senza intestazione, con la stessa cifra ogni settimana, e quando ci
            posi sopra il dito lei te lo sposta con garbo. «Quella torna sempre»
            dice, e ti paga.
          effetti: { monete: 3, rep.maison: 0.5 }
        fallimento:
          titolo: Le candele
          testo: |
            Dopo un'ora le cifre ti ballano davanti agli occhi, e le colonne
            tornano soltanto perché hai sommato due volte una partita di candele.
            Gretchen se ne accorge al primo sguardo, ti paga una miseria per il
            tempo e richiude lei il libro con il nastro.
          effetti: { monete: 1 }

      - testo: "Rifare i conti di Gretchen"
        descrizione: "Quando Nerissa è fuori i conti li tiene Gretchen, e da qualche settimana tornano più facilmente."
        requisiti: [rep.maison < 4]
        quando: [pista.pelle >= 6]
        prova: { attributo: mentale, abilita: politica-ed-economia, difficolta: Media }
        successo:
          titolo: La riga tirata
          testo: |
            In un'ora trovi l'errore, una partita di candele scritta due volte. In
            fondo alla pagina c'è una colonna senza intestazione, con la stessa
            cifra ogni settimana fino alla notte della Pignatta e dopo una riga
            tirata con il righello, su cui Gretchen passa il pollice. «Da quella
            notte non paghiamo più nessuno» dice, «e io continuo a lasciare lo
            spazio, per abitudine.»
          effetti: { monete: 3, rep.maison: 0.5 }
        fallimento:
          titolo: Le candele
          testo: |
            Dopo un'ora le cifre ti ballano davanti agli occhi, e le colonne
            tornano soltanto perché hai sommato due volte una partita di candele.
            Gretchen se ne accorge al primo sguardo, ti paga una miseria per il
            tempo e richiude lei il libro con il nastro.
          effetti: { monete: 1 }

      - testo: "Accendere la lanterna sopra la porta"
        descrizione: "Al tramonto qualcuno deve salire sulla scala con lo stoppino, e in Via dei Rasoi tutti guardano."
        esito:
          titolo: La lanterna accesa
          testo: |
            Sara ti tiene la scala, e tu sali con il bastone e lo stoppino acceso
            su un piolo che cigola. Da lassù vedi una donna che ritira i panni da
            una finestra all'altra, e quando la luce si allarga sulla porta lei
            richiude le imposte, perché adesso sa che ora è. Sara ti allunga una
            mancia e ti chiama per nome.
          pe: { percezione: 2 }
          effetti: { monete: 1 }

      - testo: "Fare il turno di sala con Tachek"
        descrizione: "In salone Tachek sta vicino alla tenda come un ospite qualunque, e le ragazze gli parlano con le dita."
        immagine: personaggi/tachek
        requisiti: [rep.maison >= 4, rep.maison < 6]
        prova: { attributo: mentale, abilita: [percezione, empatia], difficolta: Media }
        successo:
          titolo: Il lobo dell'orecchio
          testo: |
            Ti siedi in fondo al salone con un bicchiere d'acqua e vino, e Tachek
            ti spiega i segnali senza mai guardarti, una mano sul bracciolo per
            una cosa e una ciocca dietro l'orecchio per un'altra. Verso mezzanotte
            Kasja si tocca due volte il lobo ridendo a una battuta, e te ne
            accorgi prima di Tachek, che appoggia due dita sulla cintura. Dieci
            minuti dopo il cliente è in strada.
          effetti: { monete: 5, rep.maison: 0.5 }
        fallimento:
          titolo: Segnali dappertutto
          testo: |
            Per tutta la sera vedi segnali dappertutto, perfino in una ragazza che
            si gratta il naso, e ti alzi due volte per niente. La seconda il
            cliente di Kasja ti chiede se desideri qualcosa da lui. Il segnale
            vero arriva mentre guardi dall'altra parte, e se ne occupa Tachek con
            una mano sulla spalla del cliente. Gretchen ti paga meno del solito.
          effetti: { monete: 2 }

      - testo: "Tenere il bancone al posto di Sara"
        descrizione: "Una sera al mese Sara va dalla sorella, e qualcuno deve ritirare le armi al bancone."
        immagine: personaggi/sara-beck
        requisiti: [rep.maison >= 4, rep.maison < 6]
        prova: { attributo: sociale, abilita: [galateo, persuasione], difficolta: Media }
        successo:
          titolo: L'armadio delle armi
          testo: |
            Prendi il posto di Sara dietro il bancone e ritiri le armi a tutti,
            compreso un bastone animato che il proprietario giura di non sapere
            che si apra, anche se il pollice gli è andato al fermo della lama
            prima che tu allungassi la mano. Un giovanotto senza appuntamento lo
            rimandi indietro con tanta cortesia che ti ringrazia, e al ritorno
            Sara ti paga bene.
          effetti: { monete: 5, rep.maison: 0.5 }
        fallimento:
          titolo: Il figlio di qualcuno
          testo: |
            Va tutto bene finché arriva un signore dei Quartieri Alti senza
            appuntamento e con molta fretta. Gli spieghi la regola, lui ti spiega
            chi è suo padre, e alla fine lo lasci passare per evitare una scenata.
            Dopo due minuti Gretchen lo riaccompagna fuori con la stessa cortesia.
            Al suo ritorno Sara ti paga a metà e cancella con il pollice il tuo
            nome dalla lavagnetta.
          effetti: { monete: 2 }

      - testo: "Accompagnare fuori un cliente molesto"
        descrizione: "Churl ti indica un uomo che ha alzato la voce con Chiara, da accompagnare fuori senza rompergli niente."
        immagine: personaggi/churl-braak
        requisiti: [rep.maison >= 4, rep.maison < 6]
        prova: { attributo: fisico, abilita: [intimidire, rissa], difficolta: Media }
        successo:
          titolo: Intero
          testo: |
            Chiara è seduta sul divano rosso con il portasigarette d'osso nero fra
            le dita, e ascolta con molta noia l'uomo che le parla addosso. Gli
            prendi il gomito da dietro con una presa che ti ha insegnato Tachek, e
            lui si ritrova in piedi senza sapere come. Lo porti alla porta
            parlandogli piano, come a un cavallo nervoso, e Churl gliela apre.
            «Fuori» dice Churl, poi guarda te. «Bene.»
          effetti: { monete: 5, rep.maison: 0.5 }
        fallimento:
          titolo: Il gomito sbagliato
          testo: |
            Gli prendi il gomito sbagliato, e l'uomo si gira e ti pianta un pugno
            sullo zigomo davanti a tutto il salone. Prima che tu possa rispondere
            Churl lo ha già sollevato per il bavero e lo porta fuori senza fretta.
            Chiara ti porge un fazzoletto profumato di fumo dolce, e Gretchen ti
            paga la serata e ti mette un po' di burro sullo zigomo.
          effetti: { monete: 2, ferite: 0.5 }

      - testo: "Prendere il tè nel salone"
        descrizione: "Da ospite il tè lo bevi in salone, dove a quell'ora si parla a voce bassa della città."
        immagine: personaggi/nerissa-dalvane
        requisiti: [maison.ospite >= 1]
        prova: { attributo: sociale, abilita: [galateo, empatia], difficolta: Media }
        successo:
          titolo: Il tè della scatola di latta
          testo: |
            Nerissa si siede con te per il tempo di una tazza del tè buono e
            lascia cadere, come per caso, una frase su un mercante della Gilda che
            da un mese paga in argento nuovo, e un'altra sulla moglie che non lo
            sa.

            {politica-ed-economia Difficile} L'argento nuovo in Città Bassa non ci
            arriva da solo, e quel mercante lo riceve da mani molto più in alto.
          effetti: { informazioni.pettegolezzo: 1 }
        fallimento:
          titolo: Una tazza sola
          testo: |
            Fai una domanda di troppo a un cliente seduto vicino al camino, e lui
            si alza e va a sedersi dall'altra parte portandosi dietro il cuscino.
            Nerissa ti versa un'altra tazza senza dire niente. Per il resto della
            sera in salone si parla soltanto del prezzo della legna, e scopri
            almeno chi la vende bagnata.
          effetti: { informazioni.voce: 1 }

      - testo: "Riconoscere un cliente dei Quartieri Alti"
        descrizione: "Ogni tanto all'ingresso entra una faccia che hai visto a cena, e certi clienti pagano per uscire dal retro."
        quando: [origine.rampollo-dei-quartieri-alti >= 1]
        requisiti: [rep.maison < 4]
        prova: { attributo: sociale, abilita: [galateo, ingannare], difficolta: Media }
        successo:
          titolo: La porta di servizio
          testo: |
            Stasera è il cognato di un consigliere, che a una festa ti ha parlato per
            un'ora dei suoi uccelli da richiamo. Lo riconosci dal passo e lo dici a
            Sara, che lo manda in cucina con un sorriso. Lo accompagni fuori parlando
            di uccelli da richiamo finché si convince di essere passato di lì per
            caso, e Sara conta anche le monete che ha lasciato per il disturbo.
          effetti: { monete: 3, rep.maison: 0.5 }
        fallimento:
          titolo: Il saluto di troppo
          testo: |
            È un vecchio amico di tuo padre, uno che alle cene ti regalava caramelle
            di menta, e prima di pensarci lo saluti per nome a voce troppo alta. Lui
            fa finta di non sentirti, mentre due ragazze in salone si voltano a
            guardare chi è, ed esce dall'ingresso principale con il cappuccio calato
            fino al mento. A fine turno Sara non ti chiede di restare.

  # ------------------------------------------------------------ passo 1 · il quaderno di Sara
  - id: il-quaderno-di-sara
    presso: via-dei-rasoi
    immagine: personaggi/sara-beck
    titolo: Il quaderno di Sara
    sommario: "A Qir-Azel dicono che Sara Beck si ricorda ogni cliente, e oggi, a casa chiusa, ti fa vedere come."
    luogo: Maison des Lunes, il bancone d'ingresso
    area: citta-bassa
    requisiti: [fazione.maison == 0, pista.capomozzo >= 10]
    testo: |
      È l'ora morta del pomeriggio e la Maison è chiusa, e Sara Beck ti fa
      entrare dalla porta grande invece che da quella di servizio. Ha gli
      occhi arrossati. Da sotto il bancone curvo tira fuori un quaderno
      piccolo con la copertina di cartone, legato con un nastro verde, e lo
      apre per te.

      Su ogni pagina c'è un'arma disegnata a matita con molta cura, qui
      un'elsa a canestro e là un fodero rammendato. Sotto ci sono due righe
      nella grafia minuta di Sara, *tè senza zucchero, mancia buona*.

      «In città dicono che mi ricordo tutti. Me li ricordo con questo» dice,
      e batte un dito sulla copertina. «La signora non scrive mai un nome, e
      io disegno le armi, perché le armi un nome non ce l'hanno. Stamattina
      il nastro era annodato in un altro modo. Qualcuno l'ha letto, e io alla
      signora non l'ho ancora detto.»

      {empatia Facile} Gli occhi rossi vengono da più lontano di stamattina,
      perché quel quaderno la tiene sveglia da settimane.

      {origine rampollo-dei-quartieri-alti} Nei salotti dei Quartieri Alti il
      nome di Sara Beck lo dicono a mezza voce guardando il bicchiere, e il
      motivo ce l'hai davanti.

      Accanto al quaderno il nastro verde ha ancora le pieghe di un nodo
      doppio, con un'asola sola.
    opzioni:
      - testo: "Scoprire chi l'ha letto"
        descrizione: "Un nodo è una firma, e in questa casa qualcuno annoda i nastri sempre allo stesso modo."
        prova: { attributo: mentale, abilita: percezione, difficolta: Media }
        successo:
          titolo: Il nodo doppio
          testo: |
            Il nodo con un'asola sola lo ritrovi in cucina, sul nastro del libro
            dei conti di Gretchen. Lei scende in vestaglia, vede il quaderno nelle
            mani di Sara e non nega, perché da settimane la vedeva scrivere di
            nascosto con gli occhi lucidi e voleva sapere che cosa la teneva
            sveglia. Poi rilega il quaderno con il suo nodo e promette di tenerlo
            lei in cucina, dove nessun cliente arriva.
          imposta: { maison.sara: 1, maison.quaderno: 2 }
          effetti: { rep.maison: 1, fazione.maison: 1 }
        fallimento:
          titolo: Un nastro qualunque
          testo: |
            Giri il nastro fra le dita e studi la serratura dell'armadio senza
            trovare niente che tu sappia leggere, anche se quel nodo ti sembra di
            averlo già visto da qualche parte in questa casa. Sara ti ringrazia
            con la cortesia rapida che usa con i clienti nuovi, rilega il quaderno
            con un nodo semplice e ti accompagna alla porta di servizio.
          effetti: { tormento: 0.5 }

      - testo: "Chiederle perché lo tiene"
        descrizione: "Sara Beck sta alla porta della Maison da vent'anni. Il quaderno ha cominciato a tenerlo per un motivo preciso."
        prova: { attributo: sociale, abilita: empatia, difficolta: Media }
        successo:
          titolo: Il primo anno
          testo: |
            Sara si siede sullo sgabello, con i piedi che non arrivano al piolo. Il suo primo anno alla porta un uomo
            che aveva fatto male a una ragazza era tornato senza barba, e lei lo aveva lasciato entrare. «La barba la
            tagli in un'ora» dice, «la spada invece te la tieni per vent'anni.» Stasera stessa lo dirà lei alla
            signora, e ti chiede di restare al bancone mentre sale.
          imposta: { maison.sara: 1, maison.quaderno: 2 }
          effetti: { rep.maison: 1, fazione.maison: 1 }
        fallimento:
          titolo: La cortesia rapida
          testo: |
            La domanda ti esce troppo diretta, con la voce di uno sbirro al banco
            dei pegni. Sara ti risponde con la cortesia rapida dei clienti nuovi
            che ognuno ha le sue abitudini, rimette il quaderno sotto il bancone e
            ti accompagna alla porta di servizio parlando del prezzo dell'olio.
            Sulla soglia ti chiama per nome come sempre, e richiude a chiave due
            volte.
          effetti: { sospetto: 0.5 }

      - testo: "Aiutarla a bruciarlo"
        descrizione: "Un quaderno che nessuno ha mai letto è un segreto. Uno che qualcuno ha letto è già un pericolo."
        esito:
          titolo: Pagina per pagina
          testo: |
            Sara apre lo sportello della stufa in cucina, e prima di bruciare ogni
            pagina ti dice a voce bassissima di chi è l'arma, e lo indovina quasi
            sempre. Alla trentesima si ferma con il foglio in mano e non ricorda, poi lo
            butta nella stufa con gli altri. Finite le pagine si asciuga gli occhi e ti
            dice che per vent'anni il quaderno le è servito soprattutto per dormire.
          pe: { empatia: 5 }
          imposta: { maison.sara: 1, maison.quaderno: 1 }
          effetti: { rep.maison: 1, fazione.maison: 1 }

      - testo: "Consigliarle di portarlo alla signora"
        descrizione: "Nerissa Dalvane non scrive mai un nome. Forse è proprio la persona a cui consegnare un quaderno senza nomi."
        immagine: personaggi/nerissa-dalvane
        esito:
          titolo: La scatola del tè
          testo: |
            Sara sale la scala curva con il quaderno stretto al petto, e torna
            dopo un quarto d'ora a mani vuote e con la schiena dritta. La signora
            l'ha chiuso senza aprirlo nella scatola di latta del tè buono, e ha
            detto che da stasera è roba sua, e se qualcuno lo legge ancora ne
            risponde lei. Sara ti stringe la mano con le sue mani piccole e
            asciutte.
          pe: { persuasione: 5 }
          imposta: { maison.sara: 1, maison.quaderno: 3 }
          effetti: { rep.maison: 1, fazione.maison: 1 }

      - testo: "Leggerne qualche pagina mentre è voltata"
        descrizione: "Prima o poi la catena suonerà, e Sara andrà alla porta. Un quaderno così vale molto, a saperlo leggere."
        prova: { attributo: sociale, abilita: [ingannare, furtivita], difficolta: Media }
        successo:
          titolo: L'elsa incisa
          testo: |
            Mentre Sara va alla porta sfogli il quaderno con un dito. Su una
            pagina c'è un'elsa con uno stemma dei Quartieri Alti, e sotto, nella
            grafia minuta di Sara, *beve prima di entrare, la signora lo rimanda a
            casa*. Quando torna il quaderno è chiuso dove l'aveva lasciato, e le
            dici che il nastro si sarà allentato da solo, e lei ti crede con
            sollievo.
          imposta: { maison.sara: 1, maison.quaderno: 4 }
          effetti: { rep.maison: 0.5, informazioni.pettegolezzo: 1, fazione.maison: 1 }
        fallimento:
          titolo: Il dito sulla pagina
          testo: |
            A metà strada Sara si volta a prendere la chiave dell'armadio e ti trova con il dito sulla pagina.
            Riprende il quaderno senza gridare, lo rilega con un nodo stretto e ti accompagna alla porta di servizio
            con la cortesia che riserva ai clienti che non torneranno. Per un pezzo, alla porta della Maison, non ti
            chiamerà per nome.
          imposta: { maison.sara: 1, maison.quaderno: 5 }
          effetti: { rep.maison: -1, fazione.maison: 1, sospetto: 0.5 }

  # ------------------------------------------------------------ passo 2 · la lanterna spenta, prima della Pignatta
  - id: la-lanterna-spenta-di-nuovo
    presso: via-dei-rasoi
    immagine: ambientazione/maison-des-lunes
    titolo: La lanterna spenta, di nuovo
    sommario: "Passata mezzanotte, sopra la porta della Maison la lanterna è spenta. Sara Beck ti aspetta in mezzo alla strada."
    luogo: Via dei Rasoi, dopo mezzanotte
    area: citta-bassa
    requisiti: [fazione.maison == 1, pista.pelle < 6]
    testo: |
      È passata mezzanotte, e la lanterna sopra la porta della Maison è
      spenta. Sara Beck ti viene incontro fino al cristallo spento, cosa che
      non fa mai.

      «Meno male che sei passato» dice, e ti porta dentro per la manica. Un
      uomo si è chiuso a chiave con Laure, la più minuta delle ragazze, nella
      stanza della Luna Calante, con un coltello nello stivale, e Kanat è
      davanti alla porta con la mazza in mano.

      Gretchen ti aspetta in fondo alla scala, perché la signora è fuori e
      stanotte la casa la tiene lei. «Quell'uomo riscuote per Mauro Scrocco.
      Se Kanat sfonda la porta, domani alla Pignatta diranno che la Maison ha
      rotto le ossa a uno degli Scuri» dice. «Mi serve Laure fuori di lì
      senza sangue sulle scale.»

      {origine figlio-della-citta-bassa} Nei vicoli hai imparato presto che
      cosa vuol dire riscuotere per Mauro Scrocco.
    opzioni:
      - testo: "Salire con Gretchen"
        descrizione: "La Luna Calante è in fondo al corridoio del primo piano. Kanat aspetta solo un cenno."
        esito:
          titolo: Il terzo gradino
          testo: |
            Sali la scala curva dietro Gretchen, che tiene sollevato l'orlo del
            vestito con due dita come per andare a un ballo. Il terzo gradino
            scricchiola sotto di te e tace sotto di lei.
          segue: la-porta-della-luna-calante
      - testo: "Dirle che stanotte non puoi"
        descrizione: "Una casa di Via dei Rasoi ha i suoi buttafuori, e tu non sei uno di loro."
        costo: 0
        esito:
          titolo: La lanterna resta spenta
          testo: |
            Gretchen annuisce senza discutere e torna verso la scala. Sara ti
            riaccompagna fuori e richiude la porta, e mentre ti allontani verso il
            Ponte del Pesce per due strade non ti volti a guardare se la lanterna
            si è riaccesa.

  # ------------------------------------------------------------ passo 2 · la lanterna spenta, dopo la Pignatta
  - id: la-lanterna-spenta-dopo-la-pignatta
    presso: via-dei-rasoi
    immagine: ambientazione/maison-des-lunes
    titolo: La lanterna spenta, di nuovo
    sommario: "Gli Scuri non ci sono più, eppure la lanterna della Maison è spenta e Sara Beck ti aspetta."
    luogo: Via dei Rasoi, dopo mezzanotte
    area: citta-bassa
    requisiti: [fazione.maison == 1, pista.pelle >= 6]
    testo: |
      È passata mezzanotte, e la lanterna sopra la porta della Maison è
      spenta, cosa che dalla notte della Pignatta non era più successa. Sara
      Beck ti viene incontro fino al cristallo spento.

      «Meno male che sei passato» dice, e ti porta dentro per la manica. Un
      uomo si è chiuso a chiave con Laure, la più minuta delle ragazze, nella
      stanza della Luna Calante, con un coltello nello stivale, e Kanat è
      davanti alla porta con la mazza in mano.

      Gretchen ti aspetta in fondo alla scala, perché stanotte la casa la
      tiene lei. «È uno dei mercenari di Ghoran che lo sceriffo ha portato in
      città. Se Kanat lo rompe, domani ne scendono venti dalla Caserma, e lo
      sceriffo dovrà scegliere fra i suoi uomini e questa casa.»

      {origine fuggiasco-di-ghoran} Alla parola Ghoran le spalle ti si
      curvano da sole, come quando passavano i sorveglianti.
    opzioni:
      - testo: "Salire con Gretchen"
        descrizione: "La Luna Calante è in fondo al corridoio del primo piano. Kanat aspetta solo un cenno."
        esito:
          titolo: Il terzo gradino
          testo: |
            Sali la scala curva dietro Gretchen, che tiene sollevato l'orlo del
            vestito con due dita come per andare a un ballo. Il terzo gradino
            scricchiola sotto di te e tace sotto di lei.
          segue: la-porta-della-luna-calante
      - testo: "Dirle che stanotte non puoi"
        descrizione: "Una casa di Via dei Rasoi ha i suoi buttafuori, e tu non sei uno di loro."
        costo: 0
        esito:
          titolo: La lanterna resta spenta
          testo: |
            Gretchen annuisce senza discutere e torna verso la scala. Sara ti
            riaccompagna fuori e richiude la porta, e mentre ti allontani verso il
            Ponte del Pesce per due strade non ti volti a guardare se la lanterna
            si è riaccesa.

  - id: la-porta-della-luna-calante
    immagine: ambientazione/maison-des-lunes
    titolo: La porta della Luna Calante
    tipo: seguito
    luogo: Maison des Lunes, primo piano
    area: citta-bassa
    requisiti: [fazione.maison == 1]
    testo: |
      Al primo piano Kanat occupa il corridoio da una parete all'altra con la
      mazza sulla spalla, e in cima alla scala di servizio Tachek aspetta con
      due dita sulla cintura.

      Dietro la porta della Luna Calante l'uomo ripete da un quarto d'ora che
      ha pagato e che la ragazza deve smetterla di piangere. Laure invece non
      piange affatto, e con la voce bassa e regolare gli sta chiedendo da
      dove viene.

      {empatia Media} Gli tiene la testa occupata con le domande perché le
      mani di lui restino lontane dallo stivale.

      «Due spinte e la porta viene giù» dice Kanat senza voltarsi. «Lui dopo
      esce a pezzi, e i pezzi li raccoglie la signora.»

      Gretchen ti dice piano che la stanza ha una finestra sul tetto della
      casa accanto, e che la serratura è vecchia quanto la casa.
    opzioni:
      - testo: "Parlargli attraverso la porta"
        descrizione: "Un uomo stanco e ubriaco cerca soprattutto un modo di uscire senza sembrare uno sconfitto. Puoi offrirglielo tu."
        prova: { attributo: sociale, abilita: [persuasione, empatia], difficolta: Media }
        successo:
          titolo: Il coltello sotto la porta
          testo: |
            Seduto con la schiena contro la porta, gli dici che nessuno lo ha
            visto entrare con il coltello e nessuno lo vedrà uscire, se esce
            adesso. Dopo un lungo silenzio la lama scivola sotto la porta fino al
            tuo stivale, e la chiave gira. Tachek lo accompagna giù senza
            toccarlo, e Laure si ferma davanti a te. «Una volta o l'altra
            raccontami di un mare, anche di uno solo» dice.
          imposta: { maison.lanterna: 1, maison.mare: 1 }
          effetti: { rep.maison: 1, fazione.maison: 1 }
        fallimento:
          titolo: La voce sbagliata
          testo: |
            Usi la voce sbagliata, quella da guardia al cancello, e lui si mette a
            gridare contro di te invece che contro Laure. Mentre grida la chiave
            gira piano, e Laure si sfila fuori sotto il suo braccio. Kanat entra
            prima che l'uomo si volti e lo porta giù per la collottola, con il
            coltello ancora nello stivale e le ossa intere.
          imposta: { maison.lanterna: 1 }
          effetti: { rep.maison: 0.5, fazione.maison: 1, scandalo: 0.5 }

      - testo: "Entrare dalla finestra"
        descrizione: "Dalla finestra del corridoio si arriva sul tetto della casa accanto, e da lì alla finestra della Luna Calante."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Media }
        successo:
          titolo: Sul tetto accanto
          testo: |
            Esci dalla finestra del corridoio e cammini sulle tegole
            scricchiolanti della casa accanto. La finestra della Luna Calante è
            socchiusa. L'uomo è in piedi voltato verso la porta. Laure è seduta
            sul letto e ti vede senza cambiare espressione. Gli chiede un
            bicchiere d'acqua, e mentre lui si gira verso la brocca tu sei già
            dentro con una mano sul suo polso. Il coltello cade sul tappeto senza
            far rumore.
          imposta: { maison.lanterna: 1 }
          effetti: { rep.maison: 1, fazione.maison: 1 }
        fallimento:
          titolo: La grondaia
          testo: |
            A metà strada la grondaia cede sotto il tuo piede, e resti appeso al
            bordo del tetto sopra Via del Salmone. L'uomo corre alla finestra a
            guardare, Laure apre la porta alle sue spalle e Kanat lo prende prima
            che si volti. Ti tira su Tachek per il colletto, con una mano sola, e
            hai le palme sbucciate e un ginocchio che ti farà male per giorni.
          imposta: { maison.lanterna: 1 }
          effetti: { rep.maison: 0.5, ferite: 0.5, fazione.maison: 1 }

      - testo: "Lasciar fare a Kanat"
        descrizione: "Due spinte e la porta viene giù. Il resto lo decideranno alla Pignatta."
        quando: [pista.pelle < 6]
        esito:
          titolo: Due spinte
          testo: |
            Basta un tuo cenno, e alla seconda spinta di Kanat la porta viene giù
            con tutto il telaio. L'uomo esce con il braccio piegato nel verso
            sbagliato, e Laure dopo di lui senza un graffio. Tre giorni dopo due
            ragazzi di Mauro rompono i vetri del pianterreno con i sassi, e
            Gretchen paga il vetraio di tasca sua. Da allora, quando passi, ti
            saluta con meno calore.
          imposta: { maison.lanterna: 1 }
          effetti: { rep.maison: 0.5, rep.scuri: -1, fazione.maison: 1 }

      - testo: "Lasciar fare a Kanat"
        descrizione: "Due spinte e la porta viene giù. Il resto lo dovrà sistemare lo sceriffo."
        quando: [pista.pelle >= 6]
        esito:
          titolo: Due spinte
          testo: |
            Basta un tuo cenno, e alla seconda spinta di Kanat la porta viene giù con tutto il telaio. Il
            mercenario esce con il braccio piegato nel verso sbagliato, Laure dopo di lui senza un
            graffio. La mattina dopo sei mercenari restano un'ora davanti al cristallo spento a guardare
            la porta, finché lo sceriffo li rimanda su. Gretchen lo ringrazia sulla soglia, e a te non
            dice niente per una settimana.
          imposta: { maison.lanterna: 1 }
          effetti: { rep.maison: 0.5, rep.caserma: -0.5, fazione.maison: 1 }

      - testo: "Aspettare davanti alla porta con Kanat"
        descrizione: "Laure sta parlando, e da come parla sa quello che fa. Puoi fidarti di lei e aspettare."
        costo: 2
        esito:
          titolo: Le ragazze decidono
          testo: |
            Ti siedi sul pavimento del corridoio accanto a Kanat, e per un'ora
            ascoltate Laure che gli chiede del suo paese e del fiume dove pescava
            da bambino. Verso le tre la voce dell'uomo si spegne. Allora la chiave
            gira, e Laure esce scalza con il coltello tenuto per la lama. «Dorme.
            Domattina avrà mal di testa, e Sara gli renderà il coltello sulla
            porta» dice.
          pe: { resilienza: 5 }
          imposta: { maison.lanterna: 1, maison.mare: 1 }
          effetti: { rep.maison: 1, fazione.maison: 1 }

  # ------------------------------------------------------------ passo 6 · ospite della Maison (secondo grado)
  # Chi accetta prende il bastone animato dell'armadio e sente da Nerissa che in casa c'è un orecchio che non è una
  # ragazza. Chi le dice il nome di Ettore (maison.leva-ettore) viene accompagnato alla porta e rifà il passo.
  - id: ospite-della-maison
    presso: via-dei-rasoi
    immagine: personaggi/nerissa-dalvane
    titolo: Ospite della Maison
    sommario: "Stasera Sara Beck non ti indica l'armadio delle armi, e Nerissa Dalvane ti aspetta in salone."
    luogo: Maison des Lunes, il salone
    area: citta-bassa
    requisiti: [fazione.maison == 5, galdrick.via == 0]
    testo: |
      Questa volta, quando tiri la catena, Sara Beck apre la porta grande e
      non indica l'armadio. Si sposta di lato con un mezzo inchino che non le
      hai mai visto fare. «La signora ti aspetta in salone. Le armi tienile,
      stasera sei un ospite» dice.

      Il salone a quest'ora è vuoto, nella solita luce color miele delle
      lampade. Nerissa Dalvane siede in una delle poltrone di cuoio, con un
      vestito scuro abbottonato fino al collo e la teiera sul tavolino.
      Accanto c'è una seconda tazza vuota ma ancora tiepida, e sul piattino
      una matita corta come un dito, con i segni dei denti vicino alla punta.

      Nerissa ti versa il tè buono. «In questa casa un ospite entra con le sue
      armi e beve il tè in salone, e Churl gli apre prima che tiri la catena»
      dice. «In cambio chiedo una cosa sola, e prima di chiederla voglio
      sapere se sei capace di darmela.» Posa la tazza sul piattino senza far
      rumore. «Dimmi il nome di un cliente che hai visto passare di qui.»

      {origine accolito-del-velo} Al Velo hai imparato a parlare a bassa voce
      e a non chiedere cosa c'è sotto l'altare, e in questo salone ti scopri
      seduto dritto come in sagrestia.
    opzioni:
      - testo: "Non dirle nessun nome"
        descrizione: "In questa casa i nomi non si scrivono e non si dicono. Forse la risposta giusta è il silenzio."
        esito:
          titolo: La cosa sola
          testo: |
            Non dici niente, e Nerissa aspetta finché nella tua tazza restano due
            foglie arricciate. «Bene» dice, e con la seconda tazza ti passa una
            notizia su un consigliere che entra dalla porta di servizio. Poi
            abbassa la voce. «In questa casa c'è un orecchio che non è una
            ragazza. Trovalo, e dillo soltanto a me.» Sulla porta Sara ti dà un
            bastone di ebano mai reclamato.
          pe: { galateo: 5 }
          imposta: { maison.ospite: 1 }
          effetti: { rep.maison: 1, informazioni.pettegolezzo: 1, monete: 25, oggetto.maison-bastone-animato: 1, fazione.maison: 1 }
          almeno: { rep.maison: 4 }

      - testo: "Inventarle un nome"
        descrizione: "Un nome inventato non tradisce nessuno se suona vero e lei non lo conosce."
        prova: { attributo: sociale, abilita: [ingannare, espressivita], difficolta: Media }
        successo:
          titolo: Il signor Nessuno
          testo: |
            Le dici che il martedì passa un certo Bertoldo Pace, con un garofano.
            Nerissa ride dietro la mano, e con la seconda tazza ti passa una
            notizia su un consigliere che entra dalla porta di servizio. «Il signor
            Pace è il benvenuto. In questa casa c'è un orecchio che non è una
            ragazza. Trovalo e dillo soltanto a me.» Sulla porta Sara ti dà un
            bastone di ebano mai reclamato.
          imposta: { maison.ospite: 1, maison.pace: 1 }
          effetti: { rep.maison: 1, informazioni.pettegolezzo: 1, monete: 25, oggetto.maison-bastone-animato: 1, fazione.maison: 1 }
          almeno: { rep.maison: 4 }
        fallimento:
          titolo: Un nome vero
          testo: |
            Le dici il primo nome che ti viene in mente, sicuro di averlo
            inventato. È il nome di un mugnaio della Città Bassa che viene qui il
            giovedì, sentito al bancone senza farci caso, e Nerissa posa la tazza
            senza rumore. «Torna quando avrai imparato a dimenticarli» dice. Sara
            ti riaccompagna alla porta con un sorriso cortese.
          effetti: { scandalo: 1 }

      - testo: "Chiederle della seconda tazza"
        descrizione: "La tazza è ancora tiepida, e la matita sul piattino non è di Nerissa."
        costo: 0
        esito:
          titolo: Per servizio
          testo: |
            Nerissa guarda la tazza e poi la matita, e non le sposta. «È passato
            lo sceriffo, per servizio» dice, con la voce piana con cui si dà
            l'ora. Dal fondo del salone Churl tossisce una volta sola, e poi si
            guarda le scarpe.
          segue: ospite-della-maison

      - testo: "Chiederle di Jass"
        descrizione: "Jass ti passa ancora quello che sente, e a Nerissa non sfugge niente della sua casa."
        immagine: personaggi/jass
        quando: [jass == 1]
        costo: 0
        esito:
          titolo: Due padroni
          testo: |
            «So che Jass ti parla» dice Nerissa prima che tu finisca la domanda, e ti senti arrossire fino al
            colletto. «Le ragazze decidono, e lei ha deciso così.» Gira la tazza di un quarto di giro sul piattino.
            «Una ragazza che parla con te ha meno tempo per parlare con altri, e io lo chiamo un buon affare.»
          segue: ospite-della-maison

      - testo: "Dirle il nome di Ettore Castaldi"
        descrizione: "Un nome vero, e di quelli che pesano. Il cugino della Rappresentante, quello che Churl ha lasciato sul gradino."
        quando: [maison.leva-ettore >= 1]
        esito:
          titolo: La porta grande
          testo: |
            Glielo dici piano, come si offre una cosa preziosa, e aggiungi che sai
            anche dove beve prima di venire qui. Nerissa posa la tazza e si alza
            senza guardarti, e ti accompagna lei alla porta grande con la cortesia
            che si usa con i clienti che non torneranno. Sulla soglia Sara non ti
            chiama per nome, e la catena di bronzo, quando la porta si richiude,
            oscilla ancora un poco.
          effetti: { rep.maison: -2 }

      - testo: "Dirle che non sei pronto"
        descrizione: "Una porta aperta senza armadio è anche un impegno. Puoi chiederle di aspettare."
        costo: 0
        esito:
          titolo: Il tè resta caldo
          testo: |
            Le dici che per adesso preferisci restare uno che lavora dalla porta
            di servizio. Nerissa annuisce come se se lo aspettasse e finisce il tè
            a piccoli sorsi. «La teiera la tengo calda» dice. Sara ti accompagna
            fuori, e prima di richiudere ti tende la mano aperta, per abitudine,
            come per farsi dare le armi che stasera non ti ha preso.

  # ------------------------------------------------------------ la carta
  - id: carta-la-catena-di-bronzo
    immagine: ambientazione/maison-des-lunes
    titolo: La catena di bronzo
    sommario: "In Via dei Rasoi tre ragazzini tirano la catena di una porta senza insegna e scappano."
    luogo: Via dei Rasoi, di giorno
    tipo: carta
    area: citta-bassa
    requisiti: [rep.maison < 2, pista.dama-argento < 5]
    testo: |
      All'angolo fra Via dei Rasoi e Via del Salmone c'è una casa di legno
      con le tende chiuse, e accanto alla porta pende una catena di bronzo
      con due parole incise, *Ospiti Benvenuti*. Tre ragazzini si sfidano a
      tirarla e a scappare, finché il gancio si stacca dal legno e la catena
      cade sul gradino.

      I ragazzini spariscono, e sulla soglia compare una halfling con i
      capelli raccolti in un fermaglio d'argento e uno sgabello in mano, che
      guarda la catena e poi te.

      «Sara Beck» dice, e ti tende lo sgabello. «Tu ci arrivi, lassù?»
    opzioni:
      - testo: "Riattaccare la catena"
        descrizione: "Il gancio è alto, e a Sara Beck mancano tre spanne buone."
        esito:
          titolo: Il gancio
          testo: |
            Sali sullo sgabello e pianti il gancio nel legno battendolo con un
            sasso, mentre Sara ti tiene per la cintura e ti dice dove colpire.
            Quando la catena è al suo posto la tira una volta, e dentro il
            campanello suona. Ti ringrazia e ti dice che, se cerchi lavoro la
            sera, la porta di servizio è quella sul cortile di Via del Salmone,
            dove nessuno chiede appuntamenti.
          effetti: { rep.maison: 0.5 }
      - testo: "Correre dietro ai ragazzini"
        descrizione: "Sono spariti verso il cristallo spento, e uno dei tre zoppica."
        prova: { attributo: fisico, abilita: atletica, difficolta: Facile }
        successo:
          titolo: Il più lento
          testo: |
            Prendi il più lento per il colletto dietro il cristallo spento, un
            ragazzino con le ginocchia sbucciate e il fiato corto quanto il tuo, e
            per farsi lasciare andare ti racconta in fretta chi litiga con chi e
            quale finestra si apre di notte. Quando torni la catena è già al suo
            posto.
