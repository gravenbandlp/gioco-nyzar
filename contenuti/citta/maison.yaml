  - id: la-porta-della-luna-calante
    immagine: ambientazione/maison-des-lunes
    titolo: La porta della Luna Calante
    tipo: seguito
    luogo: Maison des Lunes, primo piano
    area: citta-bassa
    requisiti: [fazione.maison == 1]
    testo: |
      Kanat occupa il corridoio da una parete all'altra con la mazza sulla spalla, e in cima alla scala di
      servizio Tachek aspetta con due dita sulla cintura.

      Dietro la porta della Luna Calante l'uomo ripete che ha pagato e che la ragazza deve smetterla di
      piangere. Laure non piange affatto, e con voce bassa e regolare gli chiede da dove viene.

      «Due spinte e la porta viene giù» dice Kanat. «Però lui non esce intero, e poi la faccenda la deve
      sistemare la signora.»

      Gretchen ti dice piano che la stanza ha una finestra sul tetto della casa accanto e che la serratura è
      vecchia quanto la casa.
    opzioni:
      - testo: "Parlargli attraverso la porta"
        descrizione: "Un uomo stanco e ubriaco cerca soprattutto un modo di uscire senza sembrare uno sconfitto. Puoi offrirglielo tu."
        prova: { attributo: sociale, abilita: [persuasione, empatia], difficolta: Media }
        successo:
          titolo: Il coltello sotto la porta
          testo: |
            Gli dici che nessuno lo ha visto entrare con il coltello, e che
            nessuno lo vedrà uscire, se esce adesso. Poi la lama scivola sotto la
            porta, contro il tuo stivale, e la chiave gira. Kanat si fa da parte,
            e Tachek lo accompagna giù senza toccarlo. Laure esce per ultima e si
            ferma davanti a te. «Una volta o l'altra raccontami di un mare» dice.
          imposta: { maison.lanterna: 1, maison.mare: 1 }
          effetti: { rep.maison: 1, fazione.maison: 1 }
        fallimento:
          titolo: La voce sbagliata
          testo: |
            Gli parli attraverso la porta, ma usi la voce sbagliata, quella da
            guardia al cancello, e lui si mette a gridare contro di te invece
            che contro Laure. Mentre grida,
            dall'altra parte la chiave gira piano. Laure apre la porta di una
            spanna e si sfila fuori sotto il suo braccio, e Kanat entra prima
            che l'uomo si volti. Lo porta giù per la scala tenendolo per la
            collottola, con il coltello ancora nello stivale e le ossa intere.
          imposta: { maison.lanterna: 1 }
          effetti: { rep.maison: 0.5, fazione.maison: 1, scandalo: 0.5 }

      - testo: "Entrare dalla finestra"
        descrizione: "Dalla finestra del corridoio si arriva sul tetto della casa accanto, e da lì alla finestra della Luna Calante."
        prova: { attributo: fisico, abilita: [atletica, acrobazia], difficolta: Media }
        successo:
          titolo: Sul tetto accanto
          testo: |
            La finestra della Luna Calante è socchiusa. L'uomo sta in piedi in
            mezzo alla stanza, voltato verso la porta, e Laure è seduta sul letto
            con le mani in grembo. Gli chiede un bicchiere d'acqua, e mentre lui
            si gira verso la brocca tu sei già dentro con una mano sul suo polso.
            Il coltello cade sul tappeto senza far rumore.
          imposta: { maison.lanterna: 1 }
          effetti: { rep.maison: 1, fazione.maison: 1 }
        fallimento:
          titolo: La grondaia
          testo: |
            A metà strada la grondaia cede sotto il tuo piede, e resti appes{o|a} al
            bordo del tetto con le gambe nel vuoto sopra Via del Salmone e le
            nocche bianche sulle tegole. L'uomo sente il rumore e corre alla
            finestra a guardare. Laure apre la porta alle sue spalle, e Kanat lo
            prende prima che si volti. Ti tira su Tachek, per il colletto, con una
            mano sola.
          imposta: { maison.lanterna: 1 }
          effetti: { rep.maison: 0.5, ferite: 0.5, fazione.maison: 1 }

      - testo: "Lasciar fare a Kanat"
        descrizione: "Due spinte e la porta viene giù. Il resto lo decideranno alla Pignatta."
        quando: [pista.pelle < 6]
        esito:
          titolo: Due spinte
          testo: |
            Basta un tuo cenno, e alla seconda spinta di Kanat la porta viene giù
            con tutto il telaio. L'uomo esce dalla Luna Calante con il braccio
            piegato nel verso sbagliato, e il coltello resta sul tappeto. Laure
            esce dopo di lui senza un graffio. Tre giorni dopo due ragazzi di
            Mauro rompono i vetri del pianterreno con i sassi, e Gretchen paga il
            vetraio di tasca sua. Quando passi per Via dei Rasoi, adesso, ti
            saluta con un po' meno calore di prima.
          imposta: { maison.lanterna: 1 }
          effetti: { rep.maison: 0.5, rep.scuri: -1, fazione.maison: 1 }

      - testo: "Lasciar fare a Kanat"
        descrizione: "Due spinte e la porta viene giù. Il resto lo dovrà sistemare lo sceriffo."
        quando: [pista.pelle >= 6]
        esito:
          titolo: Due spinte
          testo: |
            Basta un tuo cenno, e alla seconda spinta di Kanat la porta viene giù con tutto il telaio. Il
            mercenario esce dalla Luna Calante con il braccio piegato nel verso sbagliato, e Laure esce
            dopo di lui senza un graffio. La mattina dopo sei mercenari scendono dalla Caserma e restano
            un'ora davanti al cristallo spento a guardare la porta, con i pollici nelle cinture e nessuna
            fretta, finché arriva lo sceriffo in persona a rimandarli su, per servizio.
          imposta: { maison.lanterna: 1 }
          effetti: { rep.maison: 0.5, rep.caserma: -0.5, fazione.maison: 1 }

      - testo: "Aspettare davanti alla porta con Kanat"
        descrizione: "Laure sta parlando, e da come parla sa quello che fa. Puoi fidarti di lei e aspettare tutta la notte."
        costo: 2
        esito:
          titolo: Le ragazze decidono
          testo: |
            Ti siedi sul pavimento del corridoio accanto a Kanat, e per un'ora
            ascoltate tutti e due la voce di Laure dietro la porta.

            La voce dell'uomo si fa più lenta, e verso le tre si spegne del tutto.
            Allora la chiave gira, e Laure esce scalza con il coltello in mano,
            tenuto per la lama. «Dorme. Domattina avrà mal di testa, e Sara gli
            renderà il coltello sulla porta» dice.
          pe: { resilienza: 5 }
          imposta: { maison.lanterna: 1, maison.mare: 1 }
          effetti: { rep.maison: 1, fazione.maison: 1 }

  # ------------------------------------------------------------ passo 6 · ospite della Maison (secondo grado)
  # Chi accetta prende il bastone animato dell'armadio e sente da Nerissa che in casa c'è un orecchio che non è una
  # ragazza. Chi le dice il nome di Ettore (maison.leva-ettore) viene accompagnato alla porta e rifà il passo.
  - id: ospite-della-maison
    presso: via-dei-rasoi
    immagine: personaggi/nerissa-dalvane
    titolo: Ospite della Maison
    sommario: "Stasera Sara Beck non ti indica l'armadio delle armi. Nerissa Dalvane ti aspetta in salone, con la teiera sul tavolino."
    luogo: Maison des Lunes, il salone
    area: citta-bassa
    requisiti: [fazione.maison == 5, galdrick.via == 0]
    testo: |
      Questa volta, quando tiri la catena, Sara Beck apre la porta grande e non indica l'armadio. «La signora
      ti aspetta in salone. Le armi tienile, stasera sei {un ospite|un'ospite}» dice.

      Nerissa Dalvane siede in una poltrona di cuoio con un vestito scuro abbottonato fino al collo. Accanto
      alla teiera c'è una seconda tazza ancora tiepida, e sul piattino una matita corta con i segni dei denti.

      Ti versa il tè della scatola di latta, quello buono. «In questa casa un ospite entra con le sue armi, e
      Churl gli apre prima che tiri la catena» dice. «Lo diventano in pochi, e in cambio chiedo una cosa sola.
      Prima però voglio sapere se sei capace di darmela.» Posa la tazza senza far rumore. «Dimmi il nome di un
      cliente che hai visto passare di qui.»

      {origine accolito-del-velo} Al Velo hai imparato a parlare a bassa voce e a non chiedere cosa c'è sotto
      l'altare, e in questo salone ti scopri sedut{o|a} dritto come in sagrestia.
    opzioni:
      - testo: "Non dirle nessun nome"
        descrizione: "In questa casa i nomi non si scrivono e non si dicono. Forse la risposta giusta è il silenzio."
        esito:
          titolo: La cosa sola
          testo: |
            Bevi il tè e non dici niente. La cosa che chiede è quella che hai
            appena fatto. I nomi che senti in questa casa restano tuoi anche fuori
            di qui, perfino davanti allo sceriffo. Ti versa una seconda tazza e ti
            racconta, con misura, di un consigliere che da un mese entra dalla
            porta di servizio.

            Prima di lasciarti andare abbassa la voce, anche se nel salone non c'è
            nessuno. «In questa casa qualcuno ascolta e riferisce, e non è una
            delle ragazze» dice. «Ti chiedo di trovarlo, e di dirlo a me e a nessun altro.» Sulla porta
            Sara ti mette in mano un bastone da passeggio di ebano con il pomo
            d'argento, preso dal fondo dell'armadio.
          pe: { galateo: 5 }
          imposta: { maison.ospite: 1 }
          effetti: { rep.maison: 1, informazioni.pettegolezzo: 1, monete: 25, oggetto.maison-bastone-animato: 1, fazione.maison: 1 }
          almeno: { rep.maison: 4 }

      - testo: "Inventarle un nome"
        descrizione: "Un nome che non esiste non tradisce nessuno. Basta che suoni vero, e che non sia di qualcuno che lei conosce."
        prova: { attributo: sociale, abilita: [ingannare, espressivita], difficolta: Media }
        successo:
          titolo: Il signor Nessuno
          testo: |
            Le dici con molta serietà che il martedì passa un certo Bertoldo Pace,
            mercante di bottoni, che porta sempre un garofano.

            Nerissa ti osserva da sopra la tazza, e poi ride per la prima volta da
            quando la conosci, piano, con la mano davanti alla bocca. La cosa che
            chiede è quella che hai appena fatto, perché i nomi che senti in questa
            casa devono restare tuoi anche fuori di qui.

            «Il signor Pace, almeno, non va in giro a riferire. In questa casa
            invece qualcuno lo fa, e non è una delle ragazze» dice. «Ti chiedo di trovarlo, e di dirlo a
            me e a nessun altro.» Sulla porta Sara ti mette in mano un bastone da
            passeggio di ebano con il pomo d'argento, preso dal fondo dell'armadio.
          imposta: { maison.ospite: 1, maison.pace: 1 }
          effetti: { rep.maison: 1, informazioni.pettegolezzo: 1, monete: 25, oggetto.maison-bastone-animato: 1, fazione.maison: 1 }
          almeno: { rep.maison: 4 }
        fallimento:
          titolo: Un nome vero
          testo: |
            Le dici il primo nome che ti viene in mente, sicuro di averlo
            inventato. Nerissa posa la tazza, e il piattino non fa rumore
            nemmeno stavolta. È il nome di un mugnaio della
            Città Bassa che viene qui il giovedì, e tu lo avevi sentito al
            bancone senza farci caso. «I nomi che senti qui vanno dimenticati.
            Torna quando ci riesci» dice senza alzare la voce. Sara ti
            riaccompagna alla porta con un sorriso cortese.
          effetti: { scandalo: 1 }

      - testo: "Chiederle della seconda tazza"
        descrizione: "La tazza è ancora tiepida, e la matita sul piattino non è di Nerissa."
        costo: 0
        esito:
          titolo: Per servizio
          testo: |
            Nerissa guarda la tazza e poi la matita, e non le sposta. «È
            passato lo sceriffo, per servizio» dice. Lo dice con la voce piana
            con cui si dà l'ora, e ti versa il tè senza aggiungere altro. Dal
            fondo del salone Churl tossisce una volta sola, e poi si guarda le
            scarpe.
          segue: ospite-della-maison

      - testo: "Chiederle di Jass"
        descrizione: "Jass ti passa ancora quello che sente, e Nerissa non è una donna a cui sfuggono le cose della sua casa."
        immagine: personaggi/jass
        quando: [jass == 1]
        costo: 0
        esito:
          titolo: Due padroni
          testo: |
            «So che Jass ti parla» dice Nerissa prima che tu finisca la
            domanda, e ti senti arrossire fino al colletto. «Non ti chiedo che cosa ti dice. Le ragazze decidono, e
            lei ha deciso così.» Gira la tazza sul piattino di un quarto di
            giro. «Il tempo che passa a parlarti lo toglie a qualcun altro, e
            a me va bene così.»
          segue: ospite-della-maison

      - testo: "Dirle il nome di Ettore Castaldi"
        descrizione: "Un nome vero, e di quelli che pesano. Il cugino della Rappresentante, quello che Churl ha lasciato sul gradino."
        quando: [maison.leva-ettore >= 1]
        esito:
          titolo: La porta grande
          testo: |
            Glielo dici piano, come si offre una cosa preziosa, e aggiungi che sai
            anche dove beve prima di venire qui. Nerissa posa la tazza e si alza
            senza guardarti. Ti accompagna lei alla porta grande, una mano appena
            sotto il tuo gomito, con la cortesia che si usa con i clienti che non
            torneranno. Sulla soglia Sara non ti chiama per nome. La catena di
            bronzo, quando la porta si richiude, oscilla ancora un poco.
          effetti: { rep.maison: -2 }

      - testo: "Dirle che non sei pront{o|a}"
        descrizione: "Una porta aperta senza armadio è anche un impegno. Puoi chiederle di aspettare."
        costo: 0
        esito:
          titolo: Il tè resta caldo
          testo: |
            Le dici che per adesso preferisci restare uno che lavora dalla
            porta di servizio. Nerissa annuisce, come se se lo aspettasse, e
            finisce il suo tè a piccoli sorsi, senza nessuna fretta di
            vederti andare. «La teiera la tengo calda» dice. Sara ti
            accompagna fuori, e prima di richiudere ti tende la mano aperta,
            per abitudine, come per farsi dare le armi che stasera non ti ha
            preso.

  # ------------------------------------------------------------ la carta
  - id: carta-la-catena-di-bronzo
    immagine: ambientazione/maison-des-lunes
    titolo: La catena di bronzo
    sommario: "In Via dei Rasoi tre ragazzini si sfidano a tirare la catena di una porta senza insegna e a scappare prima che qualcuno apra."
    luogo: Via dei Rasoi, di giorno
    tipo: carta
    area: citta-bassa
    requisiti: [rep.maison < 2, pista.dama-argento < 5]
    testo: |
      All'angolo con Via del Salmone c'è una casa di legno a tre piani con le tende chiuse e nessuna insegna.
      Accanto alla porta pende una catena di bronzo con incise le parole *Ospiti Benvenuti*, e tre ragazzini
      si sfidano a tirarla e scappare. Al quinto strappo il gancio si stacca dal legno e la catena cade sul
      gradino con un rumore di posate.

      {atletica Facile fallita} Potresti prenderli tutti e tre, però le ginocchia sono di un altro parere.
      Sulla soglia compare una halfling con un fermaglio d'argento nei capelli e uno sgabello in mano, che
      guarda la catena e poi te, l'unico rimasto in strada.

      «Sara Beck» dice, e ti tende lo sgabello. «Tu ci arrivi, lassù?»
    opzioni:
      - testo: "Riattaccare la catena"
        descrizione: "Il gancio è alto, e a Sara Beck mancano tre spanne buone."
        esito:
          titolo: Il gancio
          testo: |
            Sali sullo sgabello e pianti il gancio nel legno battendolo con un
            sasso, mentre Sara ti tiene per la cintura e ti dice dove colpire, con
            la sicurezza di una che ha sempre visto il gancio da sotto. Ti
            ringrazia e ti dice che, se cerchi lavoro la sera, la porta di
            servizio è quella sul cortile di Via del Salmone, e che lì nessuno
            chiede appuntamenti.
          effetti: { rep.maison: 0.5 }
      - testo: "Correre dietro ai ragazzini"
        descrizione: "Sono spariti verso il cristallo spento, e uno dei tre zoppica."
        prova: { attributo: fisico, abilita: atletica, difficolta: Facile }
        successo:
          titolo: Il più lento
          testo: |
            Prendi il più lento per il colletto dietro il cristallo spento. È
            un ragazzino con le ginocchia sbucciate e il fiato corto quanto il
            tuo, e per farsi lasciare andare
            ti racconta in fretta tutto quello che sa della strada, chi litiga
            con chi e quale finestra si apre di notte. Quando torni la catena è
            già al suo posto, e Sara sta rientrando con lo sgabello sotto il
            braccio.
          effetti: { informazioni.voce: 1 }
        fallimento:
          titolo: Il cortile
          testo: |
            Al cristallo spento i ragazzini si dividono e infilano tre portoni
            diversi, e tu ti fermi in mezzo alla strada piegat{o|a} in due, con le
            mani sulle ginocchia e una fitta sotto le costole. Quando
            torni la catena è già al suo posto, appesa un po' storta, e sotto
            il gancio c'è un sasso con il segno dei colpi. Sara sta rientrando
            con lo sgabello sotto il braccio e non si volta.
      - testo: "Tirare dritto"
        costo: 0
        esito:
          testo: "Prosegui verso Via del Salmone. Dietro di te Sara Beck sale sullo sgabello, si alza in punta di piedi e non ci arriva."
