# La città viva, luogo 5: la Fucina dei Due Mastini e l'Armeria di Irsa (presso: fucina-dei-due-mastini o
# armeria-di-irsa, area citta-bassa). Reputazione comune rep.botteghe: Bram fornisce il grezzo a Irsa, e il cuoio
# arriva dalla Conceria Kasselt.
# L'attività al mantice, le tre storie (2 i mastini, con il seguito alla Conceria; 4 il cuoio di Kasselt, con il
# seguito da Nello Brusa; 6 il capolavoro, con il seguito del pezzo su misura) e la carta del garzone.
# Il servizio (le botteghe e i pezzi dietro il banco) sta già in contenuti/aree/citta-bassa.yaml.
# Reputazione: le storie la portano a 3, 5 e 7; la mazza e il ferro per Irsa la fanno salire fino a 4, il pezzo
# forgiato da solo e la fornitura del mese fino a 6, così la catena è percorribile.
# I mastini si chiamano Tizzone (il maschio) e Scoria (la femmina): i nomi sono nuovi, il Codex non li dà.
storylet:
  # ------------------------------------------------------------ l'attività ripetibile
  - id: al-mantice
    presso: fucina-dei-due-mastini
    immagine: ambientazione/fucina-dei-due-mastini
    titolo: Al mantice
    sommario: "Alla Fucina dei Due Mastini il lavoro non finisce mai, e Bram Halgast paga poco chi lo regge fino a sera."
    luogo: Fucina dei Due Mastini, la forgia
    area: citta-bassa
    ripetibile: true
    testo: |
      Dentro la Fucina dei Due Mastini il caldo ti arriva in faccia appena
      passi la soglia, e dopo tre respiri hai già la camicia incollata alla
      schiena. La forgia occupa tutta la parete di fondo, con il mantice di
      cuoio rattoppato appeso a una trave e l'incudine piantata su un ceppo
      di quercia largo quanto un tavolo d'osteria. Accanto alla porta
      aspettano le casse del ferro grezzo per l'Armeria di Irsa. Su ognuna
      qualcuno ha scritto con il gesso il nome della bottega, e su una ha
      sbagliato la doppia e poi l'ha corretta sopra, più grande.

      {resistenza Facile} Il corpo fa il conto prima di te. Un'ora qui
      dentro vale mezza giornata di carico al porto, e la sete arriva prima
      della stanchezza.

      Bram Halgast lavora con lo smanicato di cuoio aperto sul petto e il
      cranio lucido di sudore, e si ferma soltanto per bestemmiare contro il
      fuoco, che secondo lui non tira mai abbastanza. Gli parla con
      l'intimità che si riserva a un parente scansafatiche. Sulla soglia i
      due mastini rossi stanno sdraiati sulla pietra tiepida. I garzoni li
      chiamano Tizzone e Scoria. Quando entri il maschio alza la testa, ti
      guarda il tempo che gli serve per decidere che sei innocuo e la
      rimette giù.

      {addestrare-animali Media} Ha deciso troppo in fretta per essere
      distratto. Tizzone tiene un orecchio girato verso di te anche a occhi
      chiusi, e la coda ferma.

      Sulla lavagna appesa allo stipite Bram scrive le commissioni del giorno
      con una grafia enorme e storta. *Se questo è il caldo del mattino, a
      mezzogiorno qui dentro si cuoce il pane sull'incudine.* In fondo alla
      lavagna c'è sempre la stessa riga, *cercasi braccia che non parlino*,
      con le lettere che diventano più piccole verso la fine perché lo spazio
      non bastava.
    opzioni:
      - testo: "Battere di mazza per Bram"
        descrizione: "Bram tiene il ferro con le tenaglie e il martello piccolo, e a te tocca la mazza. Colpisci dove batte lui, e soltanto lì."
        immagine: personaggi/bram-halgast
        requisiti: [rep.botteghe < 2]
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Media }
        successo:
          titolo: Dove batte lui
          testo: |
            Bram tiene il ferro rovente sull'incudine e ci batte sopra due colpi
            leggeri con il martello piccolo, e tu ci cali sopra la mazza
            esattamente in quel punto. Andate avanti così per un'ora, con lui che
            indica e te che colpisci, finché il ferro prende la forma di una
            cerniera. Hai le spalle in fiamme e le orecchie piene del suono
            dell'incudine, che continua a battere per conto suo anche quando la
            mazza è appoggiata. Bram ti lancia qualche moneta e scrive qualcosa
            sulla lavagna, che a guardarla bene è il tuo nome, sbagliato.

            {percezione Facile} Sbagliato con cura, però. Ha scritto le lettere
            più piccole del solito, perché la lavagna basti anche domani.
          effetti: { monete: 2, rep.botteghe: 0.5 }
        fallimento:
          titolo: Fuori tempo
          testo: |
            La mazza pesa più di quanto pensavi, e al quarto colpo arrivi in
            ritardo, quando Bram ha già girato il ferro. Il colpo cade di piatto
            sul bordo dell'incudine e ti risale su per le braccia fino ai denti.
            Bram ti toglie la mazza di mano e finisce la cerniera da solo, a colpi
            corti, bestemmiando in una lingua che i garzoni imparano il primo
            giorno. Tu resti lì con i polsi che ronzano e le mani vuote, a
            guardare. A fine giornata, con un gesto del mento, ti fa capire che
            per oggi non ti paga.

      - testo: "Battere di mazza per Bram"
        descrizione: "Ormai Bram ti lascia le tenaglie, purché possa guardarti le mani mentre lavori."
        immagine: personaggi/bram-halgast
        requisiti: [rep.botteghe >= 2, rep.botteghe < 4]
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Media }
        successo:
          titolo: Le tenaglie
          testo: |
            Bram ti mette in mano le tenaglie e il ferro di una roncola, e questa
            volta la mazza la prende lui. Devi girare il pezzo al momento giusto,
            di un quarto di giro alla volta, e tenerlo fermo mentre lui ci cala
            sopra un colpo che ti fa tremare i polsi. A metà mattina la roncola è
            dritta. Bram la guarda contro la luce della porta chiudendo un occhio,
            la butta nella vasca dell'acqua, che sbuffa vapore fino al soffitto, e
            ti dà la sua paga senza commentare. Poi ti indica con il mento la pila
            dei ferri che restano.
          effetti: { monete: 3, rep.botteghe: 0.5 }
        fallimento:
          titolo: Il quarto di giro
          testo: |
            Giri il pezzo troppo presto, e la mazza di Bram scende sul ferro
            storto. La roncola si piega a gomito. Bram la rimette nel fuoco senza
            dire niente, e avresti preferito una bestemmia. Senti le orecchie
            scaldarsi più del ferro. La rifate da capo. Alla fine ti spiega che le
            tenaglie vanno tenute come un bicchiere pieno, e ti dà una paga da
            apprendista.
          effetti: { monete: 1 }

      - testo: "Forgiare un pezzo da solo"
        descrizione: "Bram ti lascia la forgia per un'ora e un lavoro semplice da fare. Lui intanto si siede sulla soglia e finge di non guardare."
        requisiti: [rep.botteghe >= 4, rep.botteghe < 6]
        prova: { attributo: fisico, abilita: [resistenza, atletica], difficolta: Difficile }
        successo:
          titolo: Sei cardini
          testo: |
            Ti tocca una serie di sei cardini per la porta di una casa della Città
            Bassa. Scaldi il ferro finché diventa giallo e lo batti sul corno
            dell'incudine, e a ogni cardine ti servono meno colpi del precedente.
            Quando hai finito Bram li prende uno per uno e li fa suonare contro
            l'incudine, con l'orecchio piegato verso il ferro. Ne butta via uno
            solo. Poi tira fuori di tasca il martello di pietra inciso e lo tiene
            in mano per un po', prima di rimetterlo dov'era.

            {empatia Media} Con quel martello Bram firma il suo lavoro. Tenerlo in
            mano davanti a te, senza usarlo, è il complimento più lungo che ti
            farà mai.

            Ti paga bene, e ti avverte che la firma si guadagna con altri mille
            cardini.
          effetti: { monete: 6, rep.botteghe: 0.5 }
        fallimento:
          titolo: Il ferro bruciato
          testo: |
            Lasci il ferro nel fuoco troppo a lungo, mentre ti rigiri fra le mani
            un cardine finito, e quando lo tiri fuori sputa scintille bianche da
            festa di paese. È bruciato, e si sbriciola al primo colpo in una
            pioggia di briciole nere. Bram arriva dalla soglia annusando l'aria,
            con Scoria dietro che annusa anche lei. Ti spiega che il ferro
            bruciato un fabbro lo riconosce da una strada di distanza, e che oggi
            l'ha riconosciuto tutta la Città Bassa. Ti paga soltanto i cardini
            buoni.
          effetti: { monete: 2 }

      - testo: "Portare il ferro a Irsa"
        descrizione: "Le casse del grezzo vanno all'Armeria di Irsa. Irsa paga puntuale, però contratta ogni moneta, e Bram dice che stavolta il prezzo lo tieni tu."
        immagine: personaggi/irsa-valbrun
        quando: [pista.acciaio < 8]
        requisiti: [rep.botteghe < 4]
        prova: { attributo: sociale, abilita: [persuasione, politica-ed-economia], difficolta: Media }
        successo:
          titolo: Il prezzo di Bram
          testo: |
            Spingi il carretto delle casse fino all'Armeria, e Irsa Valbrun,
            prima di guardare il ferro, guarda te. Prima le mani, poi gli
            occhi. Le dici il prezzo di Bram, e lei ti offre molto meno
            sorridendo appena.

            {conoscenze-della-strada Media} Quel sorriso è l'apertura di rito.
            Irsa offre poco a chiunque le spinga un carretto in bottega, per
            vedere se dietro il carretto c'è anche una testa.

            Tieni il punto e le ricordi che dopo la razzia mezza città vuole una
            lama, e che Bram il grezzo potrebbe venderlo a chiunque. Alla fine
            Irsa scrive il prezzo pieno nel registro, con la sua calligrafia da
            notaio, e a te dà qualcosa per il disturbo. «Digli che ha mandato la
            persona giusta, e che non ci si abitui» dice, mentre chiude il
            registro.
          effetti: { monete: 3, rep.botteghe: 0.5 }
        fallimento:
          titolo: Meno del dovuto
          testo: |
            Irsa ti offre molto meno del prezzo di Bram, e quando provi a
            discutere ti chiede quanto carbone brucia la fucina in un mese. Quando
            vede la tua faccia te lo dice lei, al sacco, con la pazienza che si
            usa per i bambini e per i clienti nuovi. Torni alla fucina con il
            carretto vuoto e una ricevuta più leggera del previsto, che ti pesa in
            tasca lo stesso. Bram la legge e dice qualcosa su tua madre che i
            garzoni fingono di non sentire, poi ti dà uno spicciolo lo stesso,
            perché almeno Irsa ha pagato subito.
          effetti: { monete: 1 }

      - testo: "Portare il ferro a Irsa"
        descrizione: "Irsa ha il grembiule sopra il panciotto buono e la testa alla Casa dei Nodi, dove adesso si parla soltanto dell'Acciaieria dei Tarvelin."
        immagine: personaggi/irsa-valbrun
        quando: [pista.acciaio >= 8]
        requisiti: [rep.botteghe < 4]
        prova: { attributo: sociale, abilita: [persuasione, politica-ed-economia], difficolta: Media }
        successo:
          titolo: La cosa sicura
          testo: |
            Trovi Irsa al banco ancora con il panciotto buono, appena tornata
            dalla Casa dei Nodi, con il grembiule annodato sopra di traverso. Ti
            guarda le mani e intanto parla. Da quando Ondrel Tarvelin è morto,
            alla Gilda non si parla d'altro che dell'Acciaieria, e il prezzo del
            lyssan cambia ogni mattina.

            {politica-ed-economia Media} Quando il lyssan balla, chi compra ferro
            cerca un prezzo che stia fermo. Bram, senza saperlo, ha l'unica merce
            tranquilla della Città Bassa.

            Le fai notare che il ferro di Bram costa uguale da un anno, e che è
            l'unica cosa sicura che entrerà oggi nella sua bottega. Irsa ride e
            paga il prezzo pieno. A te lascia la mancia, e ti chiede di dire a
            Bram che per adesso il ferro lo compra ancora da lui.
          effetti: { monete: 3, rep.botteghe: 0.5 }
        fallimento:
          titolo: Il prezzo del lyssan
          testo: |
            Irsa ha la testa alla Gilda. Conta le monete due volte muovendo le
            labbra. Alla seconda ne toglie una parte. Provi a protestare, e lei ti
            risponde con il prezzo del lyssan di ieri e quello di stamattina, che
            non c'entrano niente con il ferro di Bram ma ti tolgono la parola lo
            stesso. Bram legge la ricevuta e si versa da bere, anche se manca
            un'ora al tramonto, poi ti allunga la paga senza guardarti.
          effetti: { monete: 1 }

      - testo: "Trattare la fornitura del mese"
        descrizione: "Bram non ha pazienza per i conti, e questo mese la fornitura per Irsa la tratti tu, dall'inizio alla fine."
        immagine: personaggi/irsa-valbrun
        requisiti: [rep.botteghe >= 4, rep.botteghe < 6]
        prova: { attributo: sociale, abilita: [persuasione, politica-ed-economia], difficolta: Media }
        successo:
          titolo: I conti del carbone
          testo: |
            Passi un pomeriggio sotto la scala dell'Armeria con Irsa e il suo
            registro. Lei vuole più grezzo per le cotte e meno per le lame, a un
            prezzo che il carbone di Bram non regge. Tu le metti davanti i conti
            del carbone, che hai fatto la sera prima a lume di candela, con una
            macchia di cera sull'ultima colonna. Irsa li legge con attenzione,
            alza un sopracciglio sopra la cicatrice e firma. Quando glielo
            racconti, Bram ti dà una paga doppia e si versa da bere anche se fuori
            c'è ancora il sole.
          effetti: { monete: 6, rep.botteghe: 0.5 }
        fallimento:
          titolo: Il registro delle rate
          testo: |
            Irsa ti chiede quanto ferro ha venduto Bram il mese scorso, e tu
            tiri a indovinare. Lei apre il registro delle rate e ti mostra la
            cifra giusta, che a quanto pare conosce meglio di Bram.

            {politica-ed-economia Media fallita} Il numero che hai tirato fuori ti
            sembrava convincente finché non l'hai sentito ad alta voce.

            Da lì in poi la fornitura la tratta lei con molta gentilezza e la
            chiude al suo prezzo. Bram ti paga il minimo scuotendo la testa.
          effetti: { monete: 2 }

      - testo: "Provare le lame"
        descrizione: "Prima di mandare le lame a Irsa, Bram le fa provare contro un rotolo di cuoio bagnato appeso a una trave del cortile."
        quando: [campione == 0]
        prova: { attributo: fisico, abilita: armi-da-mischia, difficolta: Media }
        successo:
          titolo: Il rotolo di cuoio
          testo: |
            Il rotolo di cuoio bagnato pende dalla trave del cortile, pesante
            quanto un uomo. Prendi le lame una alla volta e lo colpisci di
            taglio, e Bram ascolta il rumore più che guardare il taglio. Le
            prime due entrano pulite. La terza rimbalza con un suono sordo, e
            Bram la piega sul ginocchio e la butta nel mucchio del ferro da
            rifondere.

            {armi-da-mischia Media} La colpa è della lama. L'hai sentito nel polso
            un attimo prima del rumore, una tempra fatta di fretta che cede invece
            di mordere.

            Ti paga e ti dice che hai il polso buono, e che è un peccato per tutto
            il resto, che a quanto pare comprende anche la faccia.
          effetti: { monete: 2 }
        fallimento:
          titolo: Il rimbalzo
          testo: |
            La prima lama ti rimbalza sul cuoio bagnato e ti torna indietro fino
            alla spalla. Alla seconda stringi troppo, e il colpo arriva di piatto,
            con uno schiocco umido che fa ridere un garzone. Bram ti guarda dalla
            porta e dice che le lame sono buone, e che il problema sta all'altro
            capo. Ti dà qualcosa per il tempo perso e le prova lui, una dopo
            l'altra, con lo straccio ancora intorno al collo.
          effetti: { monete: 1 }

      - testo: "Provare le lame"
        descrizione: "Il Campione di Qir-Azel prova le lame di Bram, e i garzoni lasciano la scherma per venire a vedere."
        quando: [campione >= 1]
        prova: { attributo: fisico, abilita: armi-da-mischia, difficolta: Media }
        successo:
          titolo: Il campione nel cortile
          testo: |
            Quando prendi la prima lama i garzoni smettono di tirare di scherma e
            vanno a sedersi sul muro a secco. Uno ti chiede dell'Arena, e Bram gli
            dice di chiudere la bocca. Colpisci il rotolo di cuoio bagnato con una
            lama dopo l'altra, e tutte entrano pulite. Bram finge di non essere
            contento, e gli riesce male, perché si accarezza il cranio due volte
            di fila. Ti paga più del solito, perché da domani in Città Bassa
            racconteranno che le sue lame le prova il campione.
          effetti: { monete: 3 }
        fallimento:
          titolo: Davanti a tutti
          testo: |
            I garzoni si siedono sul muro a secco a guardare il campione, e il
            campione manca il rotolo di cuoio con la prima lama e lo prende di
            piatto con la seconda. Qualcuno ride e smette subito, e tu ti asciughi
            le mani sui calzoni più a lungo del necessario. Bram ti paga in fretta
            e dice ai garzoni, a voce abbastanza alta perché la senta anche tu,
            che i campioni buoni sbagliano quando non c'è nessuno a guardarli.
          effetti: { monete: 1 }

      - testo: "Spazzare le scorie"
        descrizione: "Le scorie della forgia si ammucchiano sul pavimento. Qualcuno le deve portare via con la pala, e non serve saper fare niente."
        quando: [botteghe.mastini == 0]
        esito:
          titolo: Le scorie
          testo: |
            Riempi la carriola con le scorie nere e la spingi fino al mucchio in
            fondo al cortile, un viaggio dopo l'altro, finché il pavimento della
            fucina torna grigio. Fra le scorie trovi un chiodo storto e una fibbia
            d'ottone fusa a metà. Scoria, la femmina, ti segue a ogni viaggio e si
            sdraia sul mucchio ancora tiepido, sempre nel punto esatto dove devi
            rovesciare la carriola successiva, e da lì ti guarda come se
            l'ingombro fossi tu. Bram ti allunga la paga senza voltarsi.
          pe: { resistenza: 2 }
          effetti: { monete: 1 }

      - testo: "Spazzare le scorie"
        descrizione: "Le scorie della forgia si ammucchiano sul pavimento, e i cuccioli di Scoria ci giocano in mezzo."
        quando: [botteghe.mastini >= 1]
        esito:
          titolo: I cuccioli nelle scorie
          testo: |
            Riempi la carriola con le scorie nere e la spingi fino al mucchio in
            fondo al cortile. A ogni viaggio i cuccioli di Scoria ti corrono
            dietro, e a ogni viaggio uno di loro si porta via qualcosa, un guanto
            di Bram o il manico della scopa. Il più piccolo si addormenta dentro
            la carriola vuota, e lo devi spostare con due dita, mentre lui
            protesta senza svegliarsi. Bram, dall'incudine, ti grida di non
            viziarli e ti allunga lo spicciolo di sempre.
          pe: { resistenza: 2 }
          effetti: { monete: 1 }

  # ------------------------------------------------------------ storia a 2 · i due mastini
  - id: i-due-mastini
    presso: fucina-dei-due-mastini
    immagine: personaggi/bram-halgast
    titolo: I due mastini
    sommario: "A metà mattina la Fucina dei Due Mastini è silenziosa, e davanti alla porta c'è un cane solo."
    luogo: Fucina dei Due Mastini, a metà mattina
    area: citta-bassa
    requisiti: [rep.botteghe >= 2, botteghe.mastini == 0]
    testo: |
      Te ne accorgi dal fondo della strada, prima ancora di vedere
      l'insegna. In Città Bassa il martello di Bram si sente da due isolati
      di distanza, e stamattina non si sente. Le orecchie lo cercano lo
      stesso, come si cerca con la lingua un dente che non c'è più. Davanti
      alla porta della fucina c'è Tizzone da solo, sdraiato sulla pietra con
      il muso verso la strada, e quando ti avvicini non alza la testa.

      {natura Facile} È sveglio, con il mento sulle zampe e gli occhi sulla
      strada, che è il modo dei cani di aspettare qualcuno.

      Una donna con la cesta del bucato si ferma accanto a te a guardare la
      porta accostata. «L'ultima volta che quel martello è stato zitto così,
      gli avevano ammazzato la moglie e il figlio» dice, e se ne va senza
      aspettare risposta.

      Dentro, la forgia è coperta di cenere. Bram è seduto sul ceppo
      dell'incudine con una bottiglia chiusa fra le ginocchia, anche se manca
      mezza giornata al tramonto, e la guarda. «Oggi è chiuso» dice. «Se sei
      qui per perdere tempo, la porta è dietro di te.»

      {intimidire Media fallita} Ti viene da rispondergli a tono. Poi guardi
      le sue spalle e la bottiglia, e la risposta se ne torna giù da dove
      era venuta.

      Il garzone più giovane ti raggiunge in cortile e ti parla
      all'orecchio. Scoria, la femmina, è sparita da due notti. La prima
      notte Bram ha girato tutta la Città Bassa con una lanterna, e la
      seconda è rimasto seduto lì, dove lo vedi adesso.

      *Sta ascoltando la porta, nel caso un cane ci raspi contro.* Ti
      ritrovi a parlare a voce bassa anche tu, e la bottiglia, fra le
      ginocchia di Bram, resta chiusa.
    opzioni:
      - testo: "Cercare le tracce di Scoria"
        descrizione: "Un mastino di quella taglia lascia le impronte nella polvere e i peli rossi sugli spigoli dei muri."
        prova: { attributo: mentale, abilita: [percezione, natura], difficolta: Media }
        successo:
          titolo: I peli rossi
          testo: |
            Parti dalla soglia della fucina e cerchi a terra, dove la cenere
            del cortile si mescola alla polvere della strada. Le impronte sono
            larghe come il tuo palmo e scendono lungo il muro, sempre dalla
            parte dell'ombra.

            {natura Media} Le impronte posteriori affondano più delle anteriori.
            La cagna portava un peso nella pancia, e camminava cercando il fresco.

            Più in basso, sul chiodo di uno steccato, trovi un ciuffo di pelo
            rosso scuro. La pista ti porta giù per tre vicoli, fino al cortile
            delle vasche della Conceria Kasselt, e al portone del seccatoio senti
            un guaito sottile e una voce d'uomo che bestemmia.
          segue: la-cucciolata
        fallimento:
          titolo: La strada lavata
          testo: |
            Trovi due impronte nella cenere del cortile e poi più niente, perché
            stanotte i carri dell'acqua sono passati per la strada e l'hanno
            lavata. Giri per i vicoli fino a mezzogiorno guardando ogni spigolo,
            con il collo che a forza di stare piegato comincia a protestare. Trovi
            peli di gatto e di mulo, e un ciuffo bianco di un cane che non
            c'entra. Quando torni Bram è ancora seduto sul ceppo, e Tizzone non si
            è mosso dalla porta.

      - testo: "Chiedere in giro"
        descrizione: "In Città Bassa nessuno si fa gli affari suoi, e un mastino rosso grande come un vitello lo nota chiunque."
        prova: { attributo: sociale, abilita: [conoscenze-della-strada, empatia], difficolta: Media }
        successo:
          titolo: Il seccatoio
          testo: |
            Alla fontana le donne hanno visto il cane rosso due notti fa, che
            scendeva verso le vasche con la pancia bassa. Un facchino aggiunge che
            gli operai della Conceria Kasselt da due giorni non riescono a entrare
            nel seccatoio, perché dentro c'è una bestia che ringhia, e che il
            padrone è di un umore peggiore del solito, cosa che credeva
            impossibile, e lo dice con evidente soddisfazione. Ringrazi, e scendi
            verso la Conceria quasi di corsa.
          segue: la-cucciolata
        fallimento:
          titolo: Cinque cani rossi
          testo: |
            Tutti hanno visto un cane rosso. Una donna l'ha visto al mercato,
            un vecchio sul Ponte delle Mille Corde, un ragazzino giura di averlo
            visto volare. Passi la mattina a inseguire cinque cani diversi per
            cinque strade diverse, e l'unico rosso che trovi è un bastardo
            spelacchiato che ti segue fino alla fucina sperando in un osso.

            {conoscenze-della-strada Facile fallita} Ti eri scordato che in Città
            Bassa una risposta inventata costa meno di un'alzata di spalle, e fa
            anche più compagnia.

            Bram non lo degna di uno sguardo.

      - testo: "Farti guidare da Tizzone"
        descrizione: "Il maschio sa dov'è la sorella. Il problema è convincerlo ad alzarsi da quella porta."
        prova: { attributo: sociale, abilita: addestrare-animali, difficolta: Facile }
        successo:
          titolo: Il naso di Tizzone
          testo: |
            Ti accucci accanto a Tizzone e gli lasci annusare la mano, poi la
            coperta di Scoria che il garzone ti porta dal cortile. Il cane solleva
            la testa e ti guarda, come per controllare che tu abbia capito la
            stessa cosa. Quando ti alzi si alza anche lui, e parte senza
            aspettarti, con il naso a un palmo da terra. Si ferma a ogni angolo
            per controllare che tu ci sia ancora, e ti porta giù per tre vicoli
            fino al cortile delle vasche della Conceria Kasselt, dove si pianta
            davanti alla porta del seccatoio e abbaia per la prima volta da quando
            lo conosci.
          segue: la-cucciolata
        fallimento:
          titolo: La porta
          testo: |
            Ti accucci accanto a Tizzone e gli parli piano, e lui ti lascia
            parlare. Gli fai annusare la coperta della sorella, e lui la annusa a
            lungo e poi ci appoggia sopra il muso. Quando ti alzi resta dov'è, con
            gli occhi sulla strada. Dopo un po' capisci che non lo smuovi, e che
            sta facendo esattamente quello che fa Bram dentro la fucina, con la
            stessa testardaggine e meno bottiglie.

      - testo: "Restare seduto con Bram"
        descrizione: "Una cassa del grezzo vuota, e nessuna domanda. Prima o poi qualcuno viene a bussare."
        costo: 2
        esito:
          titolo: Il ragazzo dalle mani blu
          testo: |
            Ti siedi su una cassa vuota senza dire niente, e Bram fa lo stesso. La
            cassa ha uno spigolo che ti entra nella coscia, e non ti muovi per non
            rompere niente. Dopo un'ora parla, sempre guardando la bottiglia.
            «Sono fratello e sorella. Lei è quella sveglia» dice, e non aggiunge
            altro.

            {empatia Media} Parla di Scoria al presente. Lo sta facendo apposta, e
            ti chiede senza chiederlo di non correggerlo.

            Verso mezzogiorno alla porta si affaccia un ragazzo della Conceria
            Kasselt, con le mani tinte di blu fino ai gomiti. Mastro Kasselt manda
            a dire che nel suo seccatoio c'è il cane di Halgast, e che se nessuno
            viene a prenderselo gli rovina tutte le pelli della stagione. Bram si
            alza così in fretta che la bottiglia rotola sul pavimento, e sulla
            soglia si ferma con una mano sullo stipite. «Vacci tu» dice senza
            voltarsi, con la voce più bassa del solito. «Io resto qui, nel caso
            fosse un altro cane.»
          pe: { resilienza: 3 }
          segue: la-cucciolata

      - testo: "Ascoltare Tizzone prima di guardarlo"
        descrizione: "Al Circolo si ascolta una bestia prima di guardarla. Una femmina che sparisce per due notti di solito ha una ragione, e il fratello la conosce."
        quando: [origine.figlio-del-circolo >= 1]
        esito:
          titolo: Un posto caldo e asciutto
          testo: |
            Ti siedi sulla pietra accanto a Tizzone senza toccarlo e resti in
            ascolto. La pietra è tiepida di sole. Il cane respira piano e ogni
            tanto alza il naso verso valle, sempre dalla stessa parte, dove il
            vento porta l'odore acido delle vasche. Ti tornano in mente le volpi
            del Bosco di Velthar, che prima del parto spariscono in cerca di un
            posto caldo e asciutto, e il consiglio che al Circolo si dava ai
            ragazzi, di lasciarle in pace finché non tornano. Chiedi al garzone se
            da quella parte c'è un posto così, e lui ti nomina il seccatoio della
            Conceria Kasselt. Tizzone si alza nel momento in cui ti alzi tu, e
            scendete insieme.
          segue: la-cucciolata

  - id: la-cucciolata
    immagine: ambientazione/conceria-kasselt
    titolo: La cucciolata
    tipo: seguito
    luogo: Conceria Kasselt, il seccatoio
    area: citta-bassa
    requisiti: [botteghe.mastini == 0]
    testo: |
      La Conceria Kasselt sta più in basso, dove la strada si allarga in un
      cortile di vasche murate, e l'odore della concia ti prende alla gola
      dieci passi prima del portone. Lo stomaco ti si chiude per conto suo e
      decide che oggi si salta il pranzo. Nel seccatoio le pelli sono tese
      su telai di legno, una fila sopra l'altra fino al soffitto. Sotto
      l'ultimo telaio, in un nido di ritagli di cuoio, c'è Scoria. Ha il
      pelo arruffato e la pancia ancora gonfia, e contro il ventre le si
      muovono cinque cuccioli ciechi, rossi come lei, che si arrampicano uno
      sull'altro per arrivare al latte. Quando ti vede scopre i denti senza
      fare rumore.

      {addestrare-animali Media} I denti scoperti senza ringhio sono
      l'ultimo avviso educato che una madre ti concede.

      Sulla soglia del seccatoio c'è Gunter Kasselt con le braccia
      incrociate sul grembiule rigido. È basso e largo di spalle, e ha le
      mani macchiate di bruno fino ai polsi. «Due notti che non mi fa
      entrare nel mio seccatoio» dice. «Si è scelta le pelli migliori della
      stagione, naturalmente. La bestia ha più occhio dei miei operai.» Non
      fa un passo per cacciarla. Accanto alla porta c'è una ciotola d'acqua,
      riempita da poco.

      {politica-ed-economia Media} Le pelli migliori della stagione, dette
      ad alta voce davanti a un testimone. Kasselt sta già preparando il
      conto per qualcuno.

      *La ciotola l'ha messa lui, e se glielo fai notare ti caccia.* Kasselt
      intanto guarda te, in attesa che tu dica qualcosa di utile.
    opzioni:
      - testo: "Andare a chiamare Bram"
        descrizione: "I cuccioli sono suoi, e anche la cagna. Deve vederli lui, prima di chiunque altro."
        immagine: personaggi/bram-halgast
        esito:
          titolo: Cinque
          testo: |
            Risali i tre vicoli di corsa. Bram ti ascolta fino a «seccatoio» e poi
            è già in strada, con Tizzone che gli trotta accanto. Nel seccatoio si
            inginocchia sui ritagli, e Scoria smette di mostrare i denti e gli
            infila il muso nel palmo. Bram conta i cuccioli a voce alta, due
            volte, perché la prima ha sbagliato, e tu fingi di non avere sentito
            dove si è fermato la prima volta. A Kasselt dice che la pelle rovinata
            gliela paga lui. «E anche la ciotola» risponde Kasselt. Quella sera,
            dal fondo della strada, il martello della fucina si sente di nuovo, e
            la donna del bucato si affaccia a guardare e poi rientra.
          pe: { empatia: 5 }
          imposta: { botteghe.mastini: 1 }
          effetti: { rep.botteghe: 1 }

      - testo: "Portare i cuccioli alla fucina"
        descrizione: "Una cesta, i ritagli di cuoio per tenerli al caldo, e la madre che ti lascia fare. Se ti lascia fare."
        prova: { attributo: sociale, abilita: addestrare-animali, difficolta: Media }
        successo:
          titolo: La cesta
          testo: |
            Ti siedi sui ritagli a un braccio da Scoria e aspetti che smetta di
            ringhiare, con le mani bene in vista sulle ginocchia.

            {natura Media} Lasciale gli occhi e guarda i cuccioli, che è la cosa
            che le interessa, e lascia che sia lei a decidere quando sei diventato
            innocuo.

            Poi prendi i cuccioli uno alla volta e li posi in una cesta che
            Kasselt ti allunga senza commenti, e lei ti guarda fare con il muso
            sul bordo. Risali i vicoli con la cesta fra le braccia e la cagna alle
            calcagna. Davanti alla fucina Tizzone si alza in piedi per la prima
            volta in due giorni. Bram esce sulla soglia, guarda dentro la cesta e
            si appoggia allo stipite. Poi torna dentro e riaccende il fuoco.
          pe: { addestrare-animali: 3 }
          imposta: { botteghe.mastini: 1 }
          effetti: { rep.botteghe: 1 }
        fallimento:
          titolo: I denti
          testo: |
            Allunghi la mano verso il primo cucciolo un momento troppo presto, e
            Scoria ti morde il polso, abbastanza da farti sanguinare e non
            abbastanza da farti male davvero. Il dolore arriva dopo, insieme
            all'imbarazzo. Kasselt manda il ragazzo dalle mani blu a chiamare
            Halgast. Bram arriva di corsa, si inginocchia sui ritagli, e la cagna
            gli infila il muso nel palmo. I cuccioli li porta lui nella cesta, e a
            te lascia lo straccio che ha al collo per fasciarti il polso.
          pe: { addestrare-animali: 3 }
          imposta: { botteghe.mastini: 1 }
          effetti: { rep.botteghe: 1, ferite: 0.5 }

      - testo: "Trattare con Kasselt per le pelli"
        descrizione: "Le pelli sotto la cagna sono rovinate, e Kasselt lo sa. Resta da vedere quanto vuole farle pagare a Bram."
        prova: { attributo: sociale, abilita: [persuasione, politica-ed-economia], difficolta: Media }
        successo:
          titolo: Il conto di Kasselt
          testo: |
            Gli fai notare che i ritagli sotto la cagna erano già ritagli, e che
            la pelle buona sul telaio più basso si è soltanto macchiata. Kasselt
            la tocca con il pollice, la annusa, la tocca di nuovo e ammette a
            denti stretti che si può ancora conciare per le cinture. Accetta che
            Scoria resti nel seccatoio finché i cuccioli aprono gli occhi, e il
            conto per Halgast lo scrive su un pezzo di cuoio. Quando Bram arriva
            lo legge, lo infila in tasca e resta in ginocchio davanti alla
            cucciolata finché Kasselt non gli ricorda che anche lui deve lavorare.
          pe: { politica-ed-economia: 3 }
          imposta: { botteghe.mastini: 1 }
          effetti: { rep.botteghe: 1 }
        fallimento:
          titolo: Il prezzo di ogni pelle
          testo: |
            Provi a discutere il danno, e Kasselt ti elenca a memoria il prezzo
            di ogni pelle del seccatoio, dalla più vecchia alla più nuova,
            insieme al giorno in cui l'ha conciata.

            {accademiche Facile fallita} Cerchi di tenere il conto per contestarlo
            dopo. Alla terza pelle ti sei già perso, e alla quarta ti chiedi se
            l'odore della concia passi mai dai vestiti.

            Smetti di discutere a metà della seconda fila. Quando Bram arriva paga
            tutto senza contare, si inginocchia sui ritagli e lascia che Scoria
            gli infili il muso nel palmo. Kasselt conta le monete per lui, due
            volte.
          pe: { politica-ed-economia: 3 }
          imposta: { botteghe.mastini: 1 }
          effetti: { rep.botteghe: 1 }

  # ------------------------------------------------------------ storia a 4 · il cuoio di Kasselt
  - id: il-cuoio-di-kasselt
    presso: armeria-di-irsa
    immagine: personaggi/gunter-kasselt
    titolo: Il cuoio di Kasselt
    sommario: "Gunter Kasselt è uscito dalla sua conceria per venire all'Armeria di Irsa, e sul banco c'è un rotolo di cuoio che si spacca a piegarlo."
    luogo: Armeria di Irsa, il banco sotto la scala
    area: citta-bassa
    requisiti: [rep.botteghe >= 4, botteghe.kasselt == 0]
    testo: |
      Gunter Kasselt non esce mai dalla Conceria, e in Città Bassa si dice
      che ci dorma dentro, in piedi fra le vasche. Stamattina invece è
      all'Armeria di Irsa, piantato davanti al banco sotto la scala con le
      braccia incrociate e la camicia che era bianca venti lavaggi fa. Irsa
      Valbrun sta dall'altra parte del banco, con la coda di cavallo buttata
      su una spalla, e fra loro c'è un rotolo di strisce di cuoio per le
      impugnature e le cinture. Un garzone dell'Armeria lucida la stessa
      fibbia da quando sei entrato, per non perdersi niente.

      Quando entri Irsa prende una striscia e la piega in due davanti a te. Il
      cuoio si spacca lungo la piega con un rumore secco, ed è bianco dentro,
      come pane raffermo. «È arrivato nove giorni fa dalla Conceria, e l'ho
      pagato fino all'ultima moneta. L'ho anche segnato» dice, e batte il dito
      sul registro delle rate, aperto accanto al rotolo.

      «E io non ho visto una moneta. Dalla mia bottega esce il cuoio migliore
      della regione, e quella roba non l'ho conciata io. Chi dice il
      contrario mi fa perdere la mattinata» ribatte Kasselt senza
      scomporsi.

      {ingannare Media} Nessuno dei due sta mentendo, e questo è il guaio.
      Il pagamento di Irsa è vero, e il disgusto di Kasselt per quel cuoio è
      sincero fino all'ultima ruga.

      Irsa si volta verso di te e ti guarda le mani, e poi gli occhi. «Tu
      conosci tutti e due, e non lavori per nessuno dei due. Guardaci e
      dimmi chi dei due ha torto» dice, e incrocia le braccia anche lei.

      {armi-da-mischia Facile} Un'impugnatura fasciata con quella roba ti
      scivola di mano al primo colpo parato, quando la mano suda. Se Irsa ci
      avesse già fasciato le sue lame, qualcuno se ne accorgerebbe nel
      momento peggiore.

      *Per spaccarsi così, quel cuoio deve essere stato al sole per
      settimane.* Kasselt sbuffa dal naso e aspetta.
    opzioni:
      - testo: "Esaminare il cuoio"
        descrizione: "Kasselt dice che non è roba sua. Se è vero, il cuoio stesso deve dirlo."
        prova: { attributo: mentale, abilita: [natura, percezione], difficolta: Media }
        successo:
          titolo: Il marchio tagliato
          testo: |
            Giri le strisce una per una contro la luce della porta. Il cuoio di
            Kasselt porta sul rovescio un piccolo marchio a fuoco ogni braccio di
            lunghezza, e queste strisce sono rifilate proprio nei punti in cui il
            marchio dovrebbe stare. È cuoio da poco, seccato al sole invece che
            all'ombra, e chi l'ha tagliato sapeva dove tagliare. Ti accorgi di
            avere il cuore più svelto, quello della caccia. Lo dici ad alta voce,
            e Kasselt smette di sbuffare. «Il posto del marchio lo conosce
            soltanto chi lavora da me. Nello Brusa, che ho cacciato dieci giorni
            fa» dice piano, guardando il rotolo.
          segue: le-due-settimane-di-nello
        fallimento:
          titolo: Cuoio è cuoio
          testo: |
            Giri le strisce contro la luce e le pieghi fra le dita, e alla fine ti
            sembrano cuoio come tutti gli altri. Lo dici, e Kasselt ti guarda come
            guarda un operaio al primo giorno. Ti spiega in tre frasi la
            differenza fra la concia all'ombra e quella al sole, e poi la ripete a
            Irsa, più forte. Irsa gli risponde con la pagina del registro. La lite
            riprende dove l'avevano lasciata, e tu esci a prendere aria, che in
            Città Bassa vuol dire scegliere fra due odori.

      - testo: "Leggere il registro delle rate"
        descrizione: "Irsa segna tutto con una calligrafia da notaio. Se ha pagato, sulla pagina c'è anche a chi."
        prova: { attributo: mentale, abilita: [politica-ed-economia, accademiche], difficolta: Media }
        successo:
          titolo: La croce
          testo: |
            La riga è precisa come tutte le altre, con la data, il peso del
            rotolo e la cifra pagata, consegnata al garzone di Kasselt.
            Accanto, al posto della firma, c'è una croce tracciata con molta
            cura.

            {percezione Media} Una croce ripassata due volte, perché venisse
            dritta. La fa così chi sa scrivere soltanto quella, e ci tiene a farla
            bene.

            Chiedi a Kasselt se i suoi garzoni sanno scrivere il loro nome.
            «Tutti» dice lui, offeso. «Quello che non sapeva l'ho cacciato dieci
            giorni fa. Nello Brusa.» Poi guarda la data della riga, che viene il
            giorno dopo, e si zittisce.
          segue: le-due-settimane-di-nello
        fallimento:
          titolo: Una calligrafia da notaio
          testo: |
            Il registro delle rate è scritto così bene che leggerlo è un piacere,
            e ti perdi nelle pagine precedenti a contare quanta gente in Città
            Bassa paga una cotta di maglia a rate. Quando torni alla riga giusta
            Irsa e Kasselt hanno ripreso a litigare sopra la tua testa, e la
            pagina, a guardarla bene, dice soltanto che Irsa ha pagato. Lo
            sapevano già tutti e due, e ora lo sai anche tu, con un certo ritardo
            e un leggero mal di testa.

      - testo: "Mettere pace fra i due"
        descrizione: "Due persone che si stimano e che oggi si darebbero del ladro. Forse basta farle parlare invece che litigare."
        prova: { attributo: sociale, abilita: [empatia, persuasione], difficolta: Media }
        successo:
          titolo: Chi ha portato il rotolo
          testo: |
            Chiedi a Irsa una sedia per Kasselt, che non si siede, e una per te,
            che invece ti siedi. Poi fai la domanda che nessuno dei due ha fatto,
            cioè chi ha portato materialmente il rotolo all'Armeria. Irsa descrive
            un ragazzo magro con le mani bruciate dalla concia. Kasselt chiude gli
            occhi e resta così per un po', e le braccia incrociate gli si
            sciolgono da sole. «Nello Brusa. L'ho cacciato dieci giorni fa per un
            taglio storto, e chi sbaglia da me non viene pagato» dice, e riapre
            gli occhi su Irsa, che chiude il registro senza aggiungere una parola.
          segue: le-due-settimane-di-nello
        fallimento:
          titolo: Due voci
          testo: |
            Provi a farli parlare uno alla volta, e ottieni che parlino tutti e
            due insieme, più forte. Kasselt ti dice che la cortesia è una
            perdita di tempo professionale. Irsa, con molta gentilezza, ti
            chiede di non mettere le mani sul suo registro.

            {persuasione Media fallita} Hai scelto le parole giuste per una stanza
            in cui nessuno ascoltava. Le hai scelte anche con calma, il che non ha
            aiutato. Alla fine la discussione la rimandano a domani di comune
            accordo, e ti lasciano solo davanti al rotolo di cuoio rotto.

      - testo: "Chiedere chi ha portato il cuoio"
        descrizione: "La domanda più semplice. Nessuno dei due l'ha ancora fatta."
        esito:
          titolo: Nello Brusa
          testo: |
            Chiedi soltanto chi ha portato il rotolo fino all'Armeria. Irsa dice
            che era un ragazzo della Conceria, magro, con le mani bruciate dalla
            concia, e che l'ha pagato a lui perché le consegne si pagano a chi le
            porta. Kasselt si passa una mano sulla faccia. «Nello Brusa» dice.
            «L'ho cacciato dieci giorni fa.» Per qualche momento nessuno dei due
            parla. Il garzone smette di lucidare la fibbia, e il banco fra loro
            sembra meno largo.
          pe: { empatia: 2 }
          segue: le-due-settimane-di-nello

  - id: le-due-settimane-di-nello
    immagine: ambientazione/citta-bassa
    titolo: Le due settimane di Nello
    tipo: seguito
    luogo: Città Bassa, una stanza sopra il forno
    area: citta-bassa
    requisiti: [botteghe.kasselt == 0]
    testo: |
      Nello Brusa abita in una stanza sopra un forno, in fondo a un vicolo
      che scende verso le fenditure calde, e Irsa ci arriva per prima perché
      conosce la strada. Kasselt vi segue a tre passi senza fiatare. Sulle
      scale l'odore del pane ti arriva dritto allo stomaco, che a quanto
      pare non ha capito il motivo della visita. La porta è aperta per il
      caldo che sale dal forno. Dentro c'è un ragazzo di sedici anni con le
      mani macchiate di bruno fino ai polsi, come quelle del suo vecchio
      padrone, seduto su un pagliericcio accanto a una bambina che dorme.
      Sul tavolo ci sono una pagnotta e una borsa di tela. Nella borsa ci
      sono quasi tutte le monete di Irsa.

      {furtivita Facile} La finestra dà sul tetto del forno, e da lì al
      vicolo è un salto da niente. Il ragazzo non la guarda nemmeno.

      Nello non prova a scappare. Quando vede Kasselt si alza in piedi per
      abitudine, e parla a lui. «Mi avete cacciato per un taglio storto e non
      mi avete pagato le ultime due settimane» dice. «Il cuoio buono l'avevo
      conciato io, e l'ho venduto sul Ponte delle Mille Corde. A Irsa ho
      portato gli scarti, perché lei le consegne le paga a chi le porta.»
      Guarda la bambina. «Ne mancano alcune. Erano per l'affitto.»

      {empatia Media} Dà ancora del voi a Kasselt. Una parte di lui sta
      ancora aspettando che il padrone gli dica come rifare il taglio.

      «Lavoro pulito o non lavoro» dice Kasselt, piano. Irsa invece tace e
      guarda te, con il registro delle rate stretto sotto il braccio.
    opzioni:
      - testo: "Proporre un accordo"
        descrizione: "Nello restituisce quello che ha e lavora il resto all'Armeria, e Kasselt gli paga le due settimane. È quello che Irsa spera, e che Kasselt non vuole sentire."
        immagine: personaggi/irsa-valbrun
        prova: { attributo: sociale, abilita: [persuasione, politica-ed-economia], difficolta: Media }
        successo:
          titolo: Monete nuove
          testo: |
            Dici a Kasselt che il lavoro fatto si paga, anche quando chi l'ha
            fatto sbaglia dopo, e che le due settimane di Nello erano lavoro
            pulito. Kasselt ci pensa a lungo, con il cipiglio che gli scende
            fino al naso. Poi tira fuori il borsello e conta le monete sul
            tavolo, scegliendo soltanto quelle coniate quest'anno.

            {galateo Media} Monete nuove, lucide, senza un graffio. È il modo di
            Kasselt di chiedere scusa senza che nessuno lo debba sentire.

            Irsa prende le sue dalla borsa di tela e lascia a Nello la pagnotta.
            «Domani all'alba al banco sotto la scala, finché le monete che mancano
            non le hai lavorate tutte» gli dice, senza alzare la voce.
          pe: { persuasione: 5 }
          imposta: { botteghe.kasselt: 1 }
          effetti: { rep.botteghe: 1 }
        fallimento:
          titolo: Lavoro pulito
          testo: |
            Dici a Kasselt che il lavoro fatto si paga, e lui ti risponde che le
            seconde occasioni le si dà al pellame e non agli operai. Se ne va senza
            chiamare la Caserma, ed è già molto, e scendendo le scale urta il
            corrimano con la spalla. Irsa invece resta. Prende le sue monete dalla
            borsa, ci aggiunge di tasca sua quelle che mancano e le lascia sul
            tavolo. A Nello dice di presentarsi domani all'alba al banco sotto la
            scala. Poi guarda te, e capisci che avrebbe voluto vederti convincere
            Kasselt.
          pe: { persuasione: 3 }
          imposta: { botteghe.kasselt: 1 }
          effetti: { rep.botteghe: 1 }

      - testo: "Dare ragione a Kasselt"
        descrizione: "Il ragazzo ha rubato a tutti e due, e il posto di guardia è a due strade da qui."
        immagine: personaggi/gunter-kasselt
        esito:
          titolo: Le regole della Conceria
          testo: |
            Dici che Nello ha rubato a tutti e due, e che le due settimane non lo
            autorizzavano a farlo. Kasselt annuisce una volta sola. Prende il
            ragazzo per un braccio senza strattonarlo e lo porta giù per il
            vicolo, verso il posto di guardia. Il ragazzo si volta una volta sola,
            verso il pagliericcio. Irsa raccoglie le monete dalla borsa e le
            conta, poi ne lascia un mucchietto sul tavolo accanto alla bambina che
            dorme. «Avevi ragione» ti dice sulla porta. «Avrei preferito che
            avessi torto.» La settimana dopo all'Armeria arriva un rotolo di cuoio
            nuovo, con il marchio dove deve stare e un biglietto di Kasselt per
            te, che dice soltanto *corretto*.
          pe: { resilienza: 5 }
          imposta: { botteghe.kasselt: 1 }
          effetti: { rep.botteghe: 1 }

      - testo: "Pagare tu quello che manca"
        descrizione: "Quello che manca chiude il conto di Irsa. Il resto se lo sistemano Kasselt e il ragazzo."
        requisiti: [monete >= 12]
        esito:
          titolo: Quello che manca
          testo: |
            Conti sul tavolo le monete che mancano, accanto alla borsa di tela.
            Irsa le guarda e poi guarda te, e le prende senza discutere, insieme
            alle sue. Kasselt fa un verso con il naso. «Le seconde occasioni le si
            dà al pellame, non agli operai» dice, e si avvia alla porta, battendo
            i tacchi sul legno come per farsi sentire da tutto il palazzo. Sulla
            soglia però si ferma. Torna al tavolo e ci lascia sopra una moneta
            coniata quest'anno, poi un'altra, finché non fanno due settimane di
            paga. Se ne va senza guardare il ragazzo, che le fissa senza toccarle.
          pe: { empatia: 5 }
          imposta: { botteghe.kasselt: 1 }
          effetti: { rep.botteghe: 1, monete: -12 }

      - testo: "Lasciare che decidano loro"
        descrizione: "Sono due bottegai che si conoscono da anni. Tu hai trovato il ragazzo, il resto tocca a loro."
        esito:
          titolo: Sulle scale
          testo: |
            Dici che il ragazzo l'hai trovato, e che il resto tocca a loro. Irsa e
            Kasselt escono sulle scale e ci restano mezz'ora. Dalla porta arrivano
            pezzi di frase, e la voce di Kasselt che si alza una volta sola e poi
            non più. Intanto tu e Nello vi guardate senza parlare, e a un certo
            punto la bambina si sveglia, ti fissa per un po' e torna a dormire.
            Quando rientrano hanno deciso. Nello restituisce quello che ha e
            Kasselt non va alla Caserma. Le due settimane invece non le paga
            nessuno, e il ragazzo tiene la pagnotta. Irsa ti dice sulla porta che
            è un pessimo accordo, e che è il primo che Kasselt accetta in dieci
            anni.
          pe: { galateo: 5 }
          imposta: { botteghe.kasselt: 1 }
          effetti: { rep.botteghe: 1 }

      - testo: "Ritrovare il cuoio buono sul Ponte"
        descrizione: "Nello ha venduto il cuoio buono sul Ponte delle Mille Corde. I banchi che comprano pelle senza fare domande li conosci tutti, e la licenza della Gilda apre i cassetti."
        quando: [origine.mercante-dei-ponti >= 1]
        esito:
          titolo: Il banco del pellaio
          testo: |
            Dici a Kasselt di aspettare e scendi con Irsa fino al Ponte delle
            Mille Corde. Il pellaio che compra senza domande ha il banco sotto il
            terzo pilone, e quando gli mostri la licenza della Gilda ti ricorda a
            voce alta che lui le pelli le paga a peso. Lo dice abbastanza forte da
            farsi sentire dai banchi vicini, nel caso qualcuno lo stesse
            giudicando. Il cuoio di Kasselt è ancora arrotolato sotto il banco,
            con il marchio intero. Lo ricompri al prezzo che aveva pagato a Nello,
            e Kasselt ti rimborsa fino all'ultima moneta, scegliendo quelle
            coniate quest'anno. Poi paga a Nello le due settimane senza discutere,
            perché il suo cuoio è tornato a casa. Irsa riprende le sue monete
            dalla borsa di tela e lascia al ragazzo la pagnotta.
          pe: { politica-ed-economia: 5 }
          imposta: { botteghe.kasselt: 1 }
          effetti: { rep.botteghe: 1 }

  # ------------------------------------------------------------ storia a 6 · il capolavoro
  - id: il-capolavoro
    presso: fucina-dei-due-mastini
    immagine: personaggi/irsa-valbrun
    titolo: Il capolavoro
    sommario: "Irsa Valbrun alla fucina non viene mai, perché è Bram che va da lei. Stasera è seduta sulle casse del grezzo, e ti aspettano tutti e due."
    luogo: Fucina dei Due Mastini, dopo il tramonto
    area: citta-bassa
    requisiti: [rep.botteghe >= 6, botteghe.capolavoro == 0]
    testo: |
      Dopo il tramonto la Fucina dei Due Mastini dovrebbe essere chiusa, e
      invece il fuoco è acceso e il mantice va piano, tirato da un garzone
      mezzo addormentato. Bram ha una bottiglia aperta sul ceppo
      dell'incudine, perché il sole è sceso, e accanto ci sono due
      bicchieri, che è uno in più del solito. Sulle casse del ferro grezzo è
      seduta Irsa Valbrun, con il grembiule sopra il panciotto buono e la
      coda di cavallo infilata nel colletto. È la prima volta che la vedi da
      questa parte della strada, e la fucina, con lei dentro, sembra più
      piccola.

      «Lei dice che ti serve un pezzo fatto da tutti e due» dice Bram, e
      indica Irsa con il bicchiere. «Io dico che non lo so ancora. Così
      stasera ti guardiamo tutti e due, uno alla volta.»

      {galateo Media} Due bicchieri, e uno è per te. Da Bram è un invito
      formale, e una cortesia che si può ancora ritirare.

      Irsa scende dalla cassa e ti gira intorno senza fretta. «Prima ti
      guardo, poi ti vendo» dice. «Stavolta non vendo niente, quindi ti
      guardo il doppio.» Sulla parete di fondo sono appesi i tre pezzi di
      Bram che non stanno con gli altri, e sotto, su un telo steso a terra,
      Irsa ha disposto le sue pinze piccole accanto a un rotolo di filo
      cremisi.

      {armi-da-mischia Media} I tre pezzi sulla parete non sono in vendita.
      Si capisce da come sono appesi, all'altezza degli occhi di Bram e
      lontani dalla polvere della forgia.

      *Due fabbri che di solito si parlano attraverso un registro, adesso
      nella stessa stanza, per me.* Ti asciughi le mani sui calzoni prima che
      Irsa te le guardi.
    opzioni:
      - testo: "Battere il ferro davanti a Bram"
        descrizione: "Ti tocca una barra del ferro migliore, con la mazza. Bram, mentre lavori, tiene gli occhi chiusi e ascolta l'incudine."
        immagine: personaggi/bram-halgast
        prova: { attributo: fisico, abilita: [resistenza, atletica], difficolta: Difficile }
        successo:
          titolo: Il suono giusto
          testo: |
            Bram ti dà una barra del ferro migliore e la mazza, e si siede a
            bere. Lavori come ti ha insegnato in questi mesi, senza fretta, con
            il garzone che tira il mantice al tuo ritmo. Bram tiene gli occhi
            chiusi e ascolta l'incudine, e a metà barra ne apre uno.

            {atletica Media} Il colpo parte dalle gambe e passa per la schiena, e
            le braccia lo accompagnano soltanto. Per la prima volta te ne ricordi
            senza doverci pensare.

            Quando hai finito si alza, prende la barra con le tenaglie e la fa
            suonare contro il corno. «Va bene» dice a Irsa, e ti versa da bere nel
            secondo bicchiere.
          pe: { resistenza: 3 }
          segue: il-pezzo-su-misura
        fallimento:
          titolo: Il braccio che scende
          testo: |
            Cominci bene, ma a metà barra il braccio ti scende da solo e i colpi
            si fanno corti, mentre il sudore ti cola negli occhi e non hai una
            mano libera per asciugarlo. Bram apre gli occhi al primo colpo storto
            e non li richiude più. Quando ti fermi a riprendere fiato ti toglie la
            mazza di mano e la appende al suo chiodo. «Torna quando alla fine del
            lavoro ti reggi ancora in piedi» dice. Irsa, sulla cassa, si versa da
            bere dal bicchiere che era per te.

      - testo: "Farti guardare da Irsa"
        descrizione: "Irsa vuole vederti muovere come in uno scontro, con un'arma in mano. Prima ti guarda, poi decide."
        prova: { attributo: fisico, abilita: [armi-da-mischia, armi-da-distanza, rissa], difficolta: Media }
        successo:
          titolo: La cordicella
          testo: |
            Irsa ti mette in mano un bastone zavorrato e ti chiede di muoverti
            come se qualcuno ti venisse addosso. Ti muovi, e dopo un po' ti
            dimentichi che ti sta guardando. Lei ti gira intorno con la cordicella
            annodata, ti misura le spalle e il passo, e segna tutto su un foglio.
            Poi ti chiede da che parte ti arriva di solito il colpo che ti
            sorprende, e tu glielo dici prima di accorgerti che nessuno te l'aveva
            mai chiesto. «Adesso so che cosa ti serve» dice, e porge il foglio a
            Bram, che lo legge tenendolo lontano dagli occhi.
          pe: { percezione: 3 }
          segue: il-pezzo-su-misura
        fallimento:
          titolo: Come da un sarto
          testo: |
            Irsa ti mette in mano un bastone zavorrato e ti chiede di muoverti
            come in uno scontro. Ti muovi, ma sai che ti sta guardando, e ogni
            gesto ti esce rigido, preparato.

            {espressivita Media fallita} Ti accorgi che ti stai esibendo a metà di
            una parata particolarmente elegante, contro un avversario che non c'è
            e che comunque non sarebbe rimasto impressionato.

            Irsa ti fa fermare dopo un minuto. «Così ti vedo come ti vede un
            sarto» dice, senza cattiveria. «Torna quando ti dimentichi di me.»
            Bram ride per la prima volta nella serata, e lei gli lancia
            un'occhiata che lo fa smettere.

      - testo: "Dire che non sai che cosa ti serve"
        descrizione: "Irsa vende soltanto a chi sa rispondere. Forse anche questa è una risposta."
        esito:
          titolo: La risposta onesta
          testo: |
            Dici a Irsa che non sai che cosa ti serve, e che finora hai usato
            quello che c'era. Ti sembra di confessare una cosa da poco, e ti
            scaldi lo stesso fino alle orecchie. Lei smette di girarti intorno.
            «In dieci anni di bottega me l'hanno detto in pochi» dice. «Gli altri
            mi dicono quello che hanno visto addosso a un eroe.» Ti prende le
            misure in silenzio con la cordicella annodata e segna tutto su un
            foglio. Bram lo legge tenendolo lontano dagli occhi e si versa il
            secondo bicchiere.
          pe: { resilienza: 3 }
          segue: il-pezzo-su-misura

  - id: il-pezzo-su-misura
    immagine: personaggi/bram-halgast
    titolo: Il pezzo su misura
    tipo: seguito
    luogo: Fucina dei Due Mastini, a notte fonda
    area: citta-bassa
    requisiti: [botteghe.capolavoro == 0]
    testo: |
      Bram e Irsa parlano fra loro a voce bassa per il tempo di un
      bicchiere, e tu li guardi dal fondo della fucina senza capire una
      parola, perché parlano di metallo. Ogni tanto Irsa batte il dito sul
      foglio delle misure, e Bram scuote la testa e poi, alla fine,
      annuisce. Il garzone del mantice si è addormentato seduto, con la
      bocca aperta e la mano ancora sulla stanga, e nessuno lo sveglia.

      {tecnologia Difficile} Di tutto il discorso afferri soltanto il punto
      in cui una lama deve cedere perché il resto non si spezzi. Bram scuote
      la testa proprio quando Irsa ha ragione.

      Alla fine Bram si alza e va alla parete dei suoi pezzi. «Roba nuova non
      ne faccio per nessuno» dice. «Rifaccio quella vecchia, sulle tue
      misure. Io batto il ferro e lei lo finisce, e lo firmiamo tutti e due.»
      Irsa apre il telo dei suoi attrezzi, tira fuori un sacchetto di anelli
      di bronzo e lo soppesa. «Ci vorrà tutta la notte» dice. «Tu decidi che
      cosa, e poi ti siedi e non ci parli più.»

      {resistenza Facile fallita} Tutta la notte seduto su una cassa, a guardare
      altri lavorare. La schiena ha già cominciato a lamentarsi per conto
      proprio.

      Bram tira fuori dalla tasca il martello di pietra inciso e lo posa
      sull'incudine, dove lo vedete tutti e tre. *Quello lo usa soltanto
      quando un pezzo è finito.* Dalla porta, Tizzone alza la testa verso
      l'incudine e poi verso di te.
    opzioni:
      - testo: "Il martello dei Due Mastini"
        descrizione: "Il vecchio martello da fucina del padre di Bram, riforgiato per la guerra. Bram ne ribatte la testa sul tuo braccio, Irsa ne fascia il manico."
        immagine: reliquie/martello-due-mastini
        requisiti: [oggetto.martello-dei-due-mastini == 0]
        esito:
          titolo: Il martello del padre
          testo: |
            Bram stacca il martello dalla parete e lo soppesa a lungo, poi ne
            rimette la testa nel fuoco. Lo ribatte per metà notte, togliendo
            peso dove Irsa gli indica sul foglio, finché il martello sta in
            equilibrio sul tuo palmo. Irsa ne fascia il manico con il cuoio
            della Conceria Kasselt e ci incide sopra una spirale di filo
            cremisi. All'alba Bram prende il martello di pietra e lo batte una
            volta accanto al marchio delle incudini.

            {percezione Facile} Prima di dartelo lo tiene in mano un momento di
            troppo, come si tiene la mano di qualcuno sulla porta di casa.

            «Era di mio padre» dice, porgendotelo dal manico. «Adesso è un po' tuo
            e un po' di lei.»
          pe: { tecnologia: 5 }
          imposta: { botteghe.capolavoro: 1 }
          effetti: { oggetto.martello-dei-due-mastini: 1, rep.botteghe: 1 }

      - testo: "Il Re della Collina"
        descrizione: "Lo spadone dalla lama larga e scura, che colpisce più forte quando sei ferito. Bram lo riequilibra, Irsa rifà l'impugnatura."
        immagine: reliquie/spadone-re-della-collina
        requisiti: [oggetto.martello-dei-due-mastini >= 1, oggetto.re-della-collina == 0]
        esito:
          titolo: Un assalto in più
          testo: |
            Bram stacca lo spadone dalla parete e ne sposta il peso verso l'elsa,
            a colpi piccoli, finché la punta smette di tirarti il polso verso
            terra. Ogni tanto te lo rimette in mano, ti guarda il polso e se lo
            riprende senza dire niente. Irsa rifà l'impugnatura intrecciando
            stretto il cuoio della Conceria Kasselt, e sotto la guardia ci annoda
            un anello di bronzo. All'alba Bram batte il martello di pietra sul
            tallone della lama, accanto alla sua vecchia firma. «I clienti lo
            chiamano così perché un mercenario è rimasto in piedi un assalto più
            del dovuto. Vedi di fare lo stesso» dice, e te lo porge dall'elsa.
          pe: { tecnologia: 5 }
          imposta: { botteghe.capolavoro: 1 }
          effetti: { oggetto.re-della-collina: 1, rep.botteghe: 1 }

      - testo: "La corazza ostinata"
        descrizione: "Piastre irregolari, rifatte tre volte. Bram le ribatte sul tuo petto, e Irsa ti rifà le cinghie su misura."
        immagine: reliquie/corazza-ostinata
        requisiti: [oggetto.corazza-ostinata == 0]
        esito:
          titolo: Rifatta quattro volte
          testo: |
            Bram stacca la corazza dalla parete e la smonta piastra per
            piastra sul pavimento. Le ribatte una alla volta sull'incudine,
            mentre Irsa gli legge ad alta voce le misure del tuo petto e delle
            tue spalle. Poi tocca a Irsa, che rifà le cinghie con il cuoio della
            Conceria Kasselt e cuce dentro un'imbottitura nuova, più spessa
            dove il foglio dice che prendi i colpi.

            {rissa Media} Il foglio ha ragione. Sono i punti dove ti hanno colpito
            più spesso, e dove la prossima volta proveranno di nuovo.

            All'alba Bram batte il martello di pietra sul pettorale, accanto alle
            tre firme vecchie. «L'ho rifatta tre volte, e uno di quelli che
            l'hanno portata è tornato vivo dal Labirinto. Vedi di essere il
            secondo» dice, e Irsa ti stringe le cinghie sui fianchi.
          pe: { tecnologia: 5 }
          imposta: { botteghe.capolavoro: 1 }
          effetti: { oggetto.corazza-ostinata: 1, rep.botteghe: 1 }

      - testo: "La cotta di maglia di Irsa"
        descrizione: "Anelli e cuoio sottile, con le spalle a ventaglio. Il filo lo trafila Bram, gli anelli li chiude Irsa."
        immagine: reliquie/cotta-di-maglia-irsa
        requisiti: [oggetto.corazza-ostinata >= 1, oggetto.cotta-di-maglia-di-irsa == 0]
        esito:
          titolo: Le spalle a ventaglio
          testo: |
            Bram passa la prima metà della notte a trafilare il filo, tirandolo
            attraverso la piastra forata finché è sottile e uguale. Irsa lo
            avvolge su un tondino, lo taglia in anelli e li chiude uno per uno con
            le pinze piccole, sul tavolo, senza alzare mai la testa. Il rumore
            degli anelli che si chiudono, uno ogni pochi respiri, a un certo punto
            ti fa addormentare sulla cassa. Le spalle a ventaglio le monta sulle
            tue misure, con il cuoio della Conceria Kasselt sotto gli anelli.
            All'alba Bram batte il martello di pietra sulla fibbia del collo. «Ti
            stancherà di più la sera» dice Irsa, stringendoti le cinghie. «Ma alla
            sera ci arrivi.»
          pe: { tecnologia: 5 }
          imposta: { botteghe.capolavoro: 1 }
          effetti: { oggetto.cotta-di-maglia-di-irsa: 1, rep.botteghe: 1 }

      - testo: "Le asce da lancio"
        descrizione: "Tre asce gemelle con il manico di frassino. Le lame sono di Bram, le rune di richiamo sul dorso sono di Irsa. È l'unico lavoro che hanno sempre fatto insieme."
        immagine: reliquie/asce-da-lancio-set
        requisiti: [oggetto.asce-da-lancio == 0]
        esito:
          titolo: Tre asce gemelle
          testo: |
            Bram forgia tre lame una dopo l'altra, dallo stesso pezzo di ferro,
            e le confronta sul palmo finché pesano uguali. Irsa le monta su tre
            manici di frassino e incide sul dorso di ognuna le piccole rune di
            richiamo, con una punta sottile e la lente sull'occhio. Prima
            dell'alba ti porta in cortile e ti fa lanciare la prima contro il
            ceppo, e dopo il lancio te la ritrovi in mano senza sapere come.

            {magia Media} Quando l'ascia torna, il Mana delle rune dà un piccolo
            strappo fra il dorso e il tuo palmo, e si spegne appena il manico
            tocca la pelle.

            Bram batte il martello di pietra sui tre manici. «È l'unica cosa
            che facciamo sempre in due, e adesso la fai anche tu» dice, e ti
            batte una mano sulla spalla.
          pe: { tecnologia: 5 }
          imposta: { botteghe.capolavoro: 1 }
          effetti: { oggetto.asce-da-lancio: 1, rep.botteghe: 1 }

      - testo: "Il giaco di maglia"
        descrizione: "Maglia fitta con il zig-zag di anelli di bronzo, la firma di Irsa. Il bronzo attutisce il rumore della maglia."
        immagine: reliquie/giaco-di-maglia-irsa
        requisiti: [oggetto.asce-da-lancio >= 1, oggetto.giaco-di-maglia-di-irsa == 0]
        esito:
          titolo: Il nodo a sei passi
          testo: |
            Bram trafila il filo di ferro per metà notte, e Irsa ci intreccia
            dentro gli anelli di bronzo del suo sacchetto, a zig-zag, con il nodo
            a sei passi che usa per riconoscere i falsi. Lavora sulle tue misure,
            provandoti addosso il giaco ancora aperto ogni ora. Prima dell'alba te
            lo fa indossare e ti fa camminare per la fucina, e la maglia non
            tintinna. Tizzone, sulla soglia, non si sveglia nemmeno. Bram batte il
            martello di pietra sulla fibbia, e Irsa ci passa sopra il pollice.
            «Adesso, se qualcuno lo copia, ce ne accorgiamo in due» dice.
          pe: { tecnologia: 5 }
          imposta: { botteghe.capolavoro: 1 }
          effetti: { oggetto.giaco-di-maglia-di-irsa: 1, rep.botteghe: 1 }

      - testo: "Soltanto la loro firma"
        descrizione: "Quello che porti ti basta. Chiedi soltanto che tutti e due ci mettano sopra il loro segno."
        esito:
          titolo: Due firme
          testo: |
            Dici che quello che porti ti basta, e che vorresti soltanto il loro
            segno sopra. Bram ti guarda come se avessi rifiutato da bere. Irsa
            invece ride, ti prende di mano l'arma che porti al fianco e la ripassa
            da cima a fondo, rifacendo i punti consumati dell'impugnatura con il
            cuoio della Conceria Kasselt e un anello di bronzo. All'alba Bram
            batte il martello di pietra sul metallo, vicino all'impugnatura. Prima
            di battere ci soffia sopra per togliere una polvere immaginaria, e
            intanto borbotta. «È la prima volta che firmo una cosa che non ho
            fatto io, quindi non lo raccontare in giro» dice, e ti restituisce
            l'arma.
          pe: { tecnologia: 5 }
          imposta: { botteghe.capolavoro: 1 }
          effetti: { rep.botteghe: 1 }

  # ------------------------------------------------------------ la carta
  - id: carta-il-garzone-di-bram
    immagine: ambientazione/citta-bassa
    titolo: Il garzone di Bram
    sommario: "Un ragazzo con un carretto di ferro grezzo è rimasto incastrato in mezzo alla strada, e dietro di lui la fila dei carri ha cominciato a bestemmiare."
    luogo: Città Bassa, una strada in salita
    tipo: carta
    area: citta-bassa
    requisiti: [rep.botteghe < 2]
    testo: |
      Dove la strada sale stretta fra due case di pietra grezza, la ruota di
      un carretto è finita dentro una delle fenditure calde della Città
      Bassa, e dalla crepa sale un filo di vapore che sa di zolfo. Il
      carretto è carico di barre di ferro grezzo legate con lo spago. A
      reggerlo per le stanghe c'è un ragazzo di quattordici anni con le
      braccia magre e un grembiule di cuoio troppo grande, ripiegato due
      volte in vita. Dietro di lui la fila dei carri si allunga fino
      all'angolo, e i carrettieri gli spiegano a voce alta che cosa pensano
      di sua madre, con una ricchezza di particolari che meriterebbe miglior
      causa.

      {conoscenze-della-strada Facile} Nessuno di quelli che gridano scende
      dal carro ad aiutarlo. In Città Bassa si aiuta volentieri, ma dopo
      aver finito di insultare.

      Il ragazzo ha gli occhi lucidi e la mascella serrata. «È il ferro per
      l'Armeria di Irsa» dice a nessuno in particolare. «Se arriva tardi,
      mastro Halgast mi ammazza. Se lo lascio qui, mi ammazza due volte.»
      Sul fianco del carretto qualcuno ha dipinto un mastino rosso, molto
      male, che sembra un maiale arrabbiato.

      {atletica Facile} Una spalla sotto il pianale e una spinta al momento
      giusto. La ruota è incastrata di poco, e il peso sta quasi tutto
      sull'altra.

      *Le barre pesano più del ragazzo, e forse anche più del carretto.*
      Senti già nelle spalle il punto dove ti farebbero male.
    opzioni:
      - testo: "Sollevare la ruota"
        descrizione: "Ti basta infilare una spalla sotto il pianale e spingere al momento giusto, e la ruota esce dalla crepa."
        prova: { attributo: fisico, abilita: atletica, difficolta: Facile }
        successo:
          titolo: Fuori dalla crepa
          testo: |
            Ti infili con la spalla sotto il pianale, e al tuo segnale il ragazzo
            tira le stanghe con tutto il peso che ha. La ruota esce dalla crepa
            con uno strattone, e il carretto riparte in salita con il ragazzo
            attaccato e il grembiule che gli sbatte sulle ginocchia. Si volta a
            metà strada per gridarti che si chiama Pim, e che alla Fucina dei Due
            Mastini cercano braccia, purché non parlino troppo. I carrettieri,
            passando, ti salutano con molto meno entusiasmo di quanto ne avevano
            per insultare lui.
          pe: { atletica: 2 }
          effetti: { rep.botteghe: 0.5 }
        fallimento:
          titolo: Il vapore
          testo: |
            Ti infili sotto il pianale proprio dove sale il vapore, e la fenditura
            ti scotta il braccio fino al gomito. Il corpo molla la presa prima che
            tu abbia deciso di farlo, e la ruota ricade nella crepa più a fondo di
            prima. Alla fine un carrettiere scende dalla fila bestemmiando e la
            tira fuori lui con una leva di legno. Il ragazzo riparte senza
            guardarti, e tu resti sul bordo della strada a soffiarti sul braccio.
          effetti: { ferite: 0.5 }

      - testo: "Portare le barre a mano"
        descrizione: "Scaricato, il carretto esce dalla crepa con una spinta. Le barre però vanno portate fino all'Armeria, e ci vuole tutta la mattina."
        esito:
          titolo: Barra per barra
          testo: |
            Aiuti il ragazzo a scaricare le barre sul bordo della strada, e il
            carretto vuoto esce dalla crepa con una spinta sola. Poi però le barre
            vanno ricaricate, e siccome il carretto scricchiola ne portate metà a
            spalla fino all'Armeria di Irsa, e a ogni gradino ti ricordi di avere
            una schiena. Irsa vi guarda arrivare sudati e ti guarda le mani prima
            di guardare il ferro. Il ragazzo le dice che sei un amico di mastro
            Halgast, e tu non lo smentisci, anche se Halgast, di amici, dice di
            non averne.
          pe: { resistenza: 2 }
          effetti: { rep.botteghe: 0.5 }

      - testo: "Tirare dritto"
        descrizione: "Il carretto e il ferro sono di qualcun altro, e anche la fretta."
        costo: 0
        esito:
          titolo: La fila
          testo: |
            Giri intorno alla fila dei carri e prosegui per la tua strada.
            All'angolo ti volti, e il ragazzo è ancora lì, con le mani sulle
            stanghe e i carrettieri che gli gridano dietro. Dopo un po' arriva
            dalla fucina un uomo calvo a torso nudo che solleva il carretto con
            una mano sola e lo libera. Il ragazzo si prende uno scappellotto, più
            affettuoso che altro, e il carretto riparte.
