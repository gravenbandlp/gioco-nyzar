# La città viva, luogo 5: la Fucina dei Due Mastini e l'Armeria di Irsa (presso: fucina-dei-due-mastini o
# armeria-di-irsa, area citta-bassa). Reputazione comune rep.botteghe: Bram fornisce il grezzo a Irsa, e il cuoio
# arriva dalla Conceria Kasselt.
# L'attività al mantice, le tre storie (2 i mastini, con il seguito alla Conceria; 4 il cuoio di Kasselt, con il
# seguito da Nello Brusa; 6 il capolavoro, con il seguito del pezzo su misura) e la carta del garzone.
# Il servizio (le botteghe e i pezzi dietro il banco) sta già in contenuti/aree/citta-bassa.yaml.
# Reputazione: le storie la portano a 3, 5 e 7; la mazza e il ferro per Irsa la fanno salire fino a 4, il pezzo
# forgiato da solo e la fornitura del mese fino a 6, così la catena è percorribile.
# I mastini si chiamano Tizzone (il maschio) e Scoria (la femmina): i nomi sono nuovi, il Codex non li dà.
storylet:
  # ------------------------------------------------------------ l'attività ripetibile
  - id: al-mantice
    presso: fucina-dei-due-mastini
    immagine: ambientazione/fucina-dei-due-mastini
    titolo: Al mantice
    sommario: "Alla Fucina dei Due Mastini c'è sempre lavoro, e Bram Halgast paga poco chi lo regge fino a sera."
    luogo: Fucina dei Due Mastini, la forgia
    area: citta-bassa
    ripetibile: true
    testo: |
      Nella Fucina dei Due Mastini il caldo ti incolla subito la camicia alla
      schiena. La forgia occupa la parete di fondo, e accanto alla porta aspettano
      le casse del ferro grezzo per l'Armeria di Irsa.

      Bram Halgast lavora con lo smanicato aperto sul petto e bestemmia contro il
      fuoco come contro un parente scansafatiche. Sulla soglia Tizzone alza la
      testa il tempo di decidere che sei innocuo, mentre Scoria, la femmina, non si
      scomoda nemmeno.

      {addestrare-animali Media} Ha deciso troppo in fretta per essere distratto, e
      anche a occhi chiusi tiene un orecchio girato verso di te.
    opzioni:
      - testo: "Battere di mazza per Bram"
        descrizione: "Bram tiene il ferro con le tenaglie, e a te tocca la mazza, da calare dove batte lui."
        immagine: personaggi/bram-halgast
        requisiti: [rep.botteghe < 2]
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Media }
        successo:
          titolo: Dove batte lui
          testo: |
            Bram batte due colpi leggeri con il martello piccolo sul ferro
            rovente, e tu ci cali sopra la mazza esattamente in quel punto, per
            un'ora, finché il ferro prende la forma di una cerniera. Hai le spalle
            in fiamme e l'incudine che ti suona ancora nelle orecchie. Bram ti
            lancia qualche moneta e scrive sulla lavagna il tuo nome, sbagliato,
            con le lettere piccole perché basti anche domani.
          effetti: { monete: 2, rep.botteghe: 0.5 }
        fallimento:
          titolo: Fuori tempo
          testo: |
            Al quarto colpo arrivi in ritardo, quando Bram ha già girato il ferro,
            e la mazza cade di piatto sul bordo dell'incudine con una botta che ti
            risale fino ai denti. Bram ti toglie la mazza di mano e finisce la
            cerniera da solo, bestemmiando in una lingua che i garzoni imparano il
            primo giorno. A fine giornata, con un gesto del mento, ti fa capire
            che non ti paga.

      - testo: "Battere di mazza per Bram"
        descrizione: "Ormai Bram ti lascia le tenaglie, purché possa guardarti le mani mentre lavori."
        immagine: personaggi/bram-halgast
        requisiti: [rep.botteghe >= 2, rep.botteghe < 4]
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Media }
        successo:
          titolo: Le tenaglie
          testo: |
            Bram ti mette in mano le tenaglie e il ferro di una roncola e prende
            lui la mazza. Giri il pezzo di un quarto alla volta e lo tieni fermo
            sotto colpi che ti fanno tremare i polsi, e a metà mattina la roncola
            è dritta. Bram la guarda controluce chiudendo un occhio e la butta
            nella vasca, che sbuffa vapore fino al soffitto, poi ti paga senza
            commentare.
          effetti: { monete: 3, rep.botteghe: 0.5 }
        fallimento:
          titolo: Il quarto di giro
          testo: |
            Giri il pezzo troppo presto, e la mazza di Bram scende sul ferro
            storto piegando la roncola a gomito. Bram la rimette nel fuoco senza
            dire niente, e avresti preferito una bestemmia. La rifate da capo, e
            alla fine ti spiega che le tenaglie vanno tenute come un bicchiere
            pieno e ti dà una paga da apprendista.
          effetti: { monete: 1 }

      - testo: "Forgiare un pezzo da solo"
        descrizione: "Bram ti lascia la forgia per un'ora e un lavoro semplice, e dalla soglia finge di non guardare."
        requisiti: [rep.botteghe >= 4, rep.botteghe < 6]
        prova: { attributo: fisico, abilita: [resistenza, atletica], difficolta: Difficile }
        successo:
          titolo: Sei cardini
          testo: |
            Ti tocca una serie di sei cardini per una porta. Bram li fa suonare
            uno per uno contro l'incudine e ne butta via uno solo. Poi tira fuori
            di tasca il martello di pietra inciso con cui firma il suo lavoro e lo
            tiene in mano per un po' prima di rimetterlo via. Ti paga bene, e ti
            avverte che la firma si guadagna con altri mille cardini.
          effetti: { monete: 6, rep.botteghe: 0.5 }
        fallimento:
          titolo: Il ferro bruciato
          testo: |
            Lasci il ferro nel fuoco troppo a lungo, e quando lo tiri fuori sputa
            scintille bianche da festa di paese e si sbriciola al primo colpo.
            Bram arriva dalla soglia annusando l'aria, con Scoria dietro che
            annusa anche lei. Il ferro bruciato, ti spiega, un fabbro lo riconosce
            da una strada di distanza, e oggi l'ha riconosciuto tutta la Città
            Bassa. Ti paga soltanto i cardini buoni.
          effetti: { monete: 2 }

      - testo: "Portare il ferro a Irsa"
        descrizione: "Le casse del grezzo vanno all'Armeria di Irsa, che contratta ogni moneta, e stavolta il prezzo lo tieni tu."
        immagine: personaggi/irsa-valbrun
        quando: [pista.acciaio < 8]
        requisiti: [rep.botteghe < 4]
        prova: { attributo: sociale, abilita: [persuasione, politica-ed-economia], difficolta: Media }
        successo:
          titolo: Il prezzo di Bram
          testo: |
            Spingi il carretto fino all'Armeria, e Irsa Valbrun ti guarda le mani
            prima del ferro. Al prezzo di Bram risponde con un'offerta molto più
            bassa, sorridendo appena. Le ricordi che Bram il grezzo potrebbe
            venderlo a chiunque, finché Irsa scrive il prezzo pieno nel registro e
            a te dà qualcosa per il disturbo. «Digli che ha mandato la persona
            giusta, e che non ci si abitui» dice.
          effetti: { monete: 3, rep.botteghe: 0.5 }
        fallimento:
          titolo: Meno del dovuto
          testo: |
            Irsa ti offre molto meno del prezzo di Bram, e quando provi a
            discutere ti chiede quanto carbone brucia la fucina in un mese. Vista
            la tua faccia te lo dice lei, al sacco, con la pazienza che si usa per
            i bambini. Bram legge la ricevuta e dice qualcosa su tua madre, poi ti
            dà uno spicciolo lo stesso, perché almeno Irsa ha pagato subito.
          effetti: { monete: 1 }

      - testo: "Portare il ferro a Irsa"
        descrizione: "Irsa ha la testa alla Casa dei Nodi, dove si parla soltanto dell'Acciaieria dei Tarvelin."
        immagine: personaggi/irsa-valbrun
        quando: [pista.acciaio >= 8]
        requisiti: [rep.botteghe < 4]
        prova: { attributo: sociale, abilita: [persuasione, politica-ed-economia], difficolta: Media }
        successo:
          titolo: La cosa sicura
          testo: |
            Trovi Irsa al banco con il grembiule sopra il panciotto buono, appena
            tornata dalla Casa dei Nodi, dove da quando Ondrel Tarvelin è morto il
            prezzo del lyssan cambia ogni mattina. Le fai notare che il ferro di
            Bram costa uguale da un anno. Irsa ride e paga il prezzo pieno, con la
            mancia per te e un messaggio per Bram, che il ferro lo compra ancora
            da lui.
          effetti: { monete: 3, rep.botteghe: 0.5 }
        fallimento:
          titolo: Il prezzo del lyssan
          testo: |
            Irsa ha la testa alla Gilda. Conta le monete due volte, e alla seconda
            ne toglie una parte. Quando protesti ti risponde con il prezzo del
            lyssan di ieri e quello di stamattina, che con il ferro di Bram non
            c'entrano niente e ti tolgono la parola lo stesso. Bram legge la
            ricevuta e si versa da bere un'ora prima del tramonto, e la paga te la
            allunga senza guardarti.
          effetti: { monete: 1 }

      - testo: "Trattare la fornitura del mese"
        descrizione: "Bram non ha pazienza per i conti, e questo mese la fornitura per Irsa la tratti tu."
        immagine: personaggi/irsa-valbrun
        requisiti: [rep.botteghe >= 4, rep.botteghe < 6]
        prova: { attributo: sociale, abilita: [persuasione, politica-ed-economia], difficolta: Media }
        successo:
          titolo: I conti del carbone
          testo: |
            Passi un pomeriggio sotto la scala dell'Armeria con Irsa e il suo
            registro. Lei vuole più grezzo per le cotte e meno per le lame, a un
            prezzo che il carbone di Bram non regge, e tu le metti davanti i conti
            del carbone. Irsa li legge alzando un sopracciglio, poi firma. Bram ti
            dà una paga doppia e si versa da bere anche se fuori c'è il sole.
          effetti: { monete: 6, rep.botteghe: 0.5 }
        fallimento:
          titolo: Il registro delle rate
          testo: |
            Irsa ti chiede quanto ferro ha venduto Bram il mese scorso, e tu tiri
            a indovinare. Lei apre il registro delle rate e ti mostra la cifra
            giusta, che a quanto pare conosce meglio di Bram, e da lì in poi la
            fornitura la tratta lei, con molta gentilezza, al suo prezzo. Bram ti
            paga il minimo scuotendo la testa.
          effetti: { monete: 2 }

      - testo: "Provare le lame"
        descrizione: "Prima di mandare le lame a Irsa, Bram le fa provare contro un rotolo di cuoio bagnato."
        quando: [campione == 0]
        prova: { attributo: fisico, abilita: armi-da-mischia, difficolta: Media }
        successo:
          titolo: Il rotolo di cuoio
          testo: |
            Colpisci di taglio il rotolo di cuoio bagnato, e Bram ascolta il
            rumore più che guardare. Le prime due lame entrano pulite, la terza
            rimbalza con un suono sordo che senti nel polso prima che nelle
            orecchie. Bram la piega sul ginocchio e la butta fra il ferro da
            rifondere. Ti paga e ti dice che hai il polso buono, ed è un peccato
            per tutto il resto.
          effetti: { monete: 2 }
        fallimento:
          titolo: Il rimbalzo
          testo: |
            La prima lama ti rimbalza sul cuoio bagnato fino alla spalla, e la
            seconda arriva di piatto, con uno schiocco umido che fa ridere un
            garzone. Bram dice dalla porta che le lame sono buone e che il
            problema sta all'altro capo. Ti dà qualcosa per il tempo perso e le
            prova lui, con lo straccio ancora intorno al collo.
          effetti: { monete: 1 }

      - testo: "Provare le lame"
        descrizione: "Il Campione di Qir-Azel prova le lame di Bram, e i garzoni lasciano la scherma per venire a vedere."
        quando: [campione >= 1]
        prova: { attributo: fisico, abilita: armi-da-mischia, difficolta: Media }
        successo:
          titolo: Il campione nel cortile
          testo: |
            I garzoni lasciano la scherma e si siedono sul muro, e uno ti chiede
            dell'Arena finché Bram non gli dice di chiudere la bocca. Le lame
            entrano tutte pulite nel cuoio bagnato. Bram finge di non essere
            contento e gli riesce male, perché si accarezza il cranio due volte.
            Ti paga più del solito, perché da domani in Città Bassa diranno che le
            sue lame le prova il campione.
          effetti: { monete: 3 }
        fallimento:
          titolo: Davanti a tutti
          testo: |
            Con i garzoni seduti sul muro a guardarti, manchi il rotolo con la
            prima lama e lo prendi di piatto con la seconda. Qualcuno ride e
            smette subito. Bram ti paga in fretta e dice ai garzoni, abbastanza
            forte perché senta anche tu, che i campioni buoni sbagliano quando non
            c'è nessuno a guardarli.
          effetti: { monete: 1 }

      - testo: "Spazzare le scorie"
        descrizione: "Le scorie della forgia si ammucchiano sul pavimento, e per portarle via con la pala non serve saper fare niente."
        quando: [botteghe.mastini == 0]
        esito:
          titolo: Le scorie
          testo: |
            Spingi la carriola delle scorie nere fino al mucchio in fondo al
            cortile, un viaggio dopo l'altro, finché il pavimento torna grigio.
            Scoria, la femmina, ti segue a ogni viaggio e si sdraia sul mucchio
            tiepido, sempre dove devi rovesciare la carriola successiva, e da lì
            ti guarda come se l'ingombro fossi tu. Bram ti allunga la paga senza
            voltarsi.
          pe: { resistenza: 2 }
          effetti: { monete: 1 }

      - testo: "Spazzare le scorie"
        descrizione: "Le scorie della forgia si ammucchiano sul pavimento, e i cuccioli di Scoria ci giocano in mezzo."
        quando: [botteghe.mastini >= 1]
        esito:
          titolo: I cuccioli nelle scorie
          testo: |
            Spingi la carriola delle scorie fino in fondo al cortile, e a ogni
            viaggio i cuccioli di Scoria ti corrono dietro e se ne portano via
            qualcosa, un guanto di Bram o il manico della scopa. Il più piccolo si
            addormenta nella carriola vuota, e lo sposti con due dita mentre
            protesta senza svegliarsi. Bram ti grida di non viziarli e ti allunga
            lo spicciolo di sempre.
          pe: { resistenza: 2 }
          effetti: { monete: 1 }

  # ------------------------------------------------------------ storia a 2 · i due mastini
  - id: i-due-mastini
    presso: fucina-dei-due-mastini
    immagine: personaggi/bram-halgast
    titolo: I due mastini
    sommario: "A metà mattina la Fucina dei Due Mastini è silenziosa, e davanti alla porta c'è un cane solo."
    luogo: Fucina dei Due Mastini, a metà mattina
    area: citta-bassa
    requisiti: [rep.botteghe >= 2, botteghe.mastini == 0]
    testo: |
      Il martello di Bram, in Città Bassa, si sente da due isolati, e
      stamattina non si sente. Davanti alla porta della fucina c'è Tizzone da
      solo, sdraiato con il mento sulle zampe e gli occhi sulla strada, e
      quando ti avvicini non alza la testa.

      {origine figlio-della-citta-bassa} Con le pause di quel martello, da
      bambino, misuravi quanto mancava al pranzo, e un silenzio così lungo a
      metà mattina non te lo ricordi.

      Una donna con la cesta del bucato si ferma accanto a te a guardare la
      porta accostata. «L'ultima volta che quel martello è stato zitto così,
      gli avevano ammazzato la moglie e il figlio» dice, e se ne va.

      Dentro, Bram è seduto sul ceppo dell'incudine con una bottiglia chiusa
      fra le ginocchia, e la forgia è coperta di cenere. «Oggi è chiuso»
      dice. «Se sei qui per perdere tempo, la porta è dietro di te.»

      Il garzone più giovane ti raggiunge in cortile e ti dice all'orecchio
      che Scoria, la femmina, è sparita da due notti, e che la prima Bram ha
      girato tutta la Città Bassa con una lanterna.

      *Sta ascoltando la porta, nel caso un cane ci raspi contro.* Ti ritrovi
      a parlare a voce bassa anche tu.
    opzioni:
      - testo: "Cercare le tracce di Scoria"
        descrizione: "Un mastino di quella taglia lascia le impronte nella polvere e i peli rossi sugli spigoli dei muri."
        prova: { attributo: mentale, abilita: [percezione, natura], difficolta: Media }
        successo:
          titolo: I peli rossi
          testo: |
            Le impronte, larghe come il tuo palmo, scendono lungo il muro dalla
            parte dell'ombra, e le posteriori affondano più delle anteriori, come
            quelle di una cagna con un peso nella pancia. Su uno steccato trovi un
            ciuffo di pelo rosso scuro. La pista ti porta giù per tre vicoli fino
            alle vasche della Conceria Kasselt, dove dal seccatoio arrivano un
            guaito sottile e una voce d'uomo che bestemmia.
          segue: la-cucciolata
        fallimento:
          titolo: La strada lavata
          testo: |
            Trovi due impronte nella cenere del cortile e poi più niente, perché
            stanotte i carri dell'acqua hanno lavato la strada. Giri per i vicoli
            fino a mezzogiorno guardando ogni spigolo, e trovi soltanto peli di
            gatto e di mulo. Quando torni Bram è ancora seduto sul ceppo, e
            Tizzone non si è mosso dalla porta.
          effetti: { tormento: 0.5 }

      - testo: "Chiedere in giro"
        descrizione: "In Città Bassa nessuno si fa gli affari suoi, e un mastino rosso grande come un vitello si nota."
        prova: { attributo: sociale, abilita: [conoscenze-della-strada, empatia], difficolta: Media }
        successo:
          titolo: Il seccatoio
          testo: |
            Alla fontana le donne hanno visto il cane rosso due notti fa, che
            scendeva verso le vasche con la pancia bassa. Un facchino aggiunge,
            con evidente soddisfazione, che da due giorni gli operai della
            Conceria Kasselt non riescono a entrare nel seccatoio per via di una
            bestia che ringhia, e che il padrone è di un umore peggiore del
            solito. Scendi verso la Conceria quasi di corsa.
          segue: la-cucciolata
        fallimento:
          titolo: Cinque cani rossi
          testo: |
            Tutti hanno visto un cane rosso. Una donna l'ha visto al mercato, e un
            ragazzino giura di averlo visto volare. Passi la mattina a inseguire
            cani diversi per strade diverse, e l'unico rosso che trovi è un
            bastardo spelacchiato che ti segue fino alla fucina sperando in un
            osso, e che Bram non degna di uno sguardo.
          effetti: { tormento: 0.5 }

      - testo: "Farti guidare da Tizzone"
        descrizione: "Il maschio sa dov'è la sorella, ma bisogna convincerlo ad alzarsi da quella porta."
        prova: { attributo: sociale, abilita: addestrare-animali, difficolta: Facile }
        successo:
          titolo: Il naso di Tizzone
          testo: |
            Lasci annusare a Tizzone la mano, poi la coperta di Scoria che il
            garzone ti porta dal cortile. Quando ti alzi parte senza aspettarti,
            fermandosi a ogni angolo per vedere se ci sei ancora. Ti porta giù per
            tre vicoli fino alla Conceria Kasselt, si pianta davanti alla porta
            del seccatoio e abbaia per la prima volta da quando lo conosci.
          segue: la-cucciolata
        fallimento:
          titolo: La porta
          testo: |
            Gli fai annusare la coperta della sorella, e Tizzone la annusa a lungo
            e poi ci appoggia sopra il muso. Quando ti alzi resta dov'è, con gli
            occhi sulla strada, e capisci che sta facendo esattamente quello che
            fa Bram dentro la fucina, con la stessa testardaggine e meno
            bottiglie.

      - testo: "Restare seduto con Bram"
        descrizione: "Una cassa vuota e nessuna domanda, finché qualcuno non viene a bussare."
        costo: 2
        esito:
          titolo: Il ragazzo dalle mani blu
          testo: |
            Ti siedi su una cassa senza dire niente, e dopo un'ora Bram parla.
            «Sono fratello e sorella, e lei è quella sveglia.» Verso mezzogiorno
            un ragazzo della Conceria Kasselt viene a dire che nel seccatoio c'è
            il cane di Halgast. Bram si alza così in fretta che la bottiglia
            rotola, poi si ferma sulla soglia. «Vacci tu, io resto qui nel caso
            fosse un altro cane» dice.
          pe: { resilienza: 3 }
          segue: la-cucciolata

      - testo: "Ascoltare Tizzone prima di guardarlo"
        descrizione: "Al Circolo si ascolta una bestia prima di guardarla, e il fratello sa perché la femmina è sparita."
        quando: [origine.figlio-del-circolo >= 1]
        esito:
          titolo: Un posto caldo e asciutto
          testo: |
            Ti siedi accanto a Tizzone senza toccarlo. Ogni tanto il cane alza il naso
            verso le vasche della concia, a valle. Ti tornano in mente le volpi del Bosco
            di Velthar, che prima del parto spariscono in cerca di un posto asciutto.
            Chiedi al garzone se da quella parte c'è un posto così, e lui ti nomina il
            seccatoio della Conceria Kasselt. Tizzone si alza insieme a te, e scendete.
          segue: la-cucciolata

  - id: la-cucciolata
    immagine: ambientazione/conceria-kasselt
    titolo: La cucciolata
    tipo: seguito
    luogo: Conceria Kasselt, il seccatoio
    area: citta-bassa
    requisiti: [botteghe.mastini == 0]
    testo: |
      La Conceria Kasselt sta più in basso, in un cortile di vasche murate,
      e l'odore della concia ti prende alla gola dieci passi prima del
      portone. Nel seccatoio le pelli sono tese su telai fino al soffitto, e
      sotto l'ultimo, in un nido di ritagli di cuoio, c'è Scoria con cinque
      cuccioli ciechi che si arrampicano uno sull'altro per arrivare al
      latte. Quando ti vede scopre i denti senza fare rumore.

      Sulla soglia Gunter Kasselt tiene le braccia incrociate sul grembiule
      rigido. «Due notti che non mi fa entrare nel mio seccatoio» dice. «Si
      è scelta le pelli migliori della stagione, naturalmente.» Non fa un
      passo per cacciarla, e accanto alla porta c'è una ciotola d'acqua
      riempita da poco. *La ciotola l'ha messa lui, e se glielo fai notare
      ti caccia.* Kasselt intanto aspetta che tu dica qualcosa di utile.
    opzioni:
      - testo: "Andare a chiamare Bram"
        descrizione: "I cuccioli e la cagna sono suoi, e deve vederli lui prima di chiunque altro."
        immagine: personaggi/bram-halgast
        esito:
          titolo: Cinque
          testo: |
            Risali di corsa, e Bram ti ascolta fino a «seccatoio» ed è già in
            strada. Nel seccatoio si inginocchia sui ritagli, e Scoria gli infila
            il muso nel palmo. Conta i cuccioli a voce alta due volte, perché la
            prima ha sbagliato, e a Kasselt dice che la pelle rovinata gliela paga
            lui. «E anche la ciotola» risponde Kasselt. Quella sera il martello
            della fucina si sente di nuovo.
          pe: { empatia: 5 }
          imposta: { botteghe.mastini: 1 }
          effetti: { rep.botteghe: 1 }

      - testo: "Portare i cuccioli alla fucina"
        descrizione: "Una cesta e i ritagli di cuoio per tenerli al caldo, se la madre ti lascia fare."
        prova: { attributo: sociale, abilita: addestrare-animali, difficolta: Media }
        successo:
          titolo: La cesta
          testo: |
            Ti siedi sui ritagli a un braccio da Scoria, con le mani in vista
            sulle ginocchia, e guardi i cuccioli invece di lei finché smette di
            ringhiare. Poi li posi uno alla volta in una cesta che Kasselt ti
            allunga, e risali i vicoli con Scoria alle calcagna. Davanti alla
            fucina Tizzone si alza in piedi, e Bram guarda dentro la cesta e torna
            a riaccendere il fuoco.
          pe: { addestrare-animali: 3 }
          imposta: { botteghe.mastini: 1 }
          effetti: { rep.botteghe: 1 }
        fallimento:
          titolo: I denti
          testo: |
            Allunghi la mano verso il primo cucciolo troppo presto, e Scoria ti
            morde il polso, abbastanza da farti sanguinare. Kasselt manda il
            ragazzo dalle mani blu a chiamare Halgast. Bram arriva di corsa e si
            inginocchia sui ritagli, e la cagna gli infila il muso nel palmo. I
            cuccioli li porta lui, e a te lascia lo straccio che ha al collo per
            fasciarti il polso.
          pe: { addestrare-animali: 3 }
          imposta: { botteghe.mastini: 1 }
          effetti: { rep.botteghe: 1, ferite: 0.5 }

      - testo: "Trattare con Kasselt per le pelli"
        descrizione: "Le pelli sotto la cagna sono rovinate, e resta da vedere quanto Kasselt vuole farle pagare a Bram."
        prova: { attributo: sociale, abilita: [persuasione, politica-ed-economia], difficolta: Media }
        successo:
          titolo: Il conto di Kasselt
          testo: |
            Gli fai notare che i ritagli sotto la cagna erano già ritagli e che la
            pelle buona si è soltanto macchiata, e Kasselt, dopo averla annusata,
            ammette che si può ancora conciare per le cinture. Accetta che Scoria
            resti nel seccatoio finché i cuccioli aprono gli occhi, e scrive il
            conto per Halgast su un pezzo di cuoio, che Bram si infila in tasca
            prima di inginocchiarsi davanti alla cucciolata.
          pe: { politica-ed-economia: 3 }
          imposta: { botteghe.mastini: 1 }
          effetti: { rep.botteghe: 1 }
        fallimento:
          titolo: Il prezzo di ogni pelle
          testo: |
            Provi a discutere il danno, e Kasselt ti elenca a memoria il prezzo di
            ogni pelle del seccatoio, insieme al giorno in cui l'ha conciata.
            Smetti a metà della seconda fila. Quando Bram arriva paga tutto senza
            contare e si inginocchia sui ritagli, e Scoria gli infila il muso nel
            palmo. Kasselt conta le monete per lui, due volte.
          pe: { politica-ed-economia: 3 }
          imposta: { botteghe.mastini: 1 }
          effetti: { rep.botteghe: 1, scandalo: 0.5 }

  # ------------------------------------------------------------ storia a 4 · il cuoio di Kasselt
  - id: il-cuoio-di-kasselt
    presso: armeria-di-irsa
    immagine: personaggi/gunter-kasselt
    titolo: Il cuoio di Kasselt
    sommario: "Gunter Kasselt è uscito dalla Conceria per venire all'Armeria di Irsa, dove c'è un rotolo di cuoio che si spacca."
    luogo: Armeria di Irsa, il banco sotto la scala
    area: citta-bassa
    requisiti: [rep.botteghe >= 4, botteghe.kasselt == 0]
    testo: |
      Gunter Kasselt è all'Armeria di Irsa con le braccia incrociate, davanti
      al banco sotto la scala. Fra lui e Irsa Valbrun c'è un rotolo di strisce
      di cuoio.

      Irsa piega in due una striscia, e il cuoio si spacca bianco dentro come
      pane raffermo. «È arrivato nove giorni fa dalla Conceria, e l'ho pagato
      fino all'ultima moneta» dice, battendo il dito sul registro delle rate.

      «E io non ho visto una moneta» ribatte Kasselt. «Quella roba non l'ho
      conciata io.»

      {origine mercante-dei-ponti} Irsa siede nel consiglio interno della
      Gilda, e lassù chi contesta il suo registro di solito ha già perso.

      Irsa si volta verso di te. «Tu conosci tutti e due e non lavori per
      nessuno dei due. Dimmi chi ha torto» dice.

      {ingannare Media} Nessuno dei due sta mentendo, e il disgusto di Kasselt
      per quel cuoio è sincero.
    opzioni:
      - testo: "Esaminare il cuoio"
        descrizione: "Kasselt dice che non è roba sua, e se è vero il cuoio stesso deve dirlo."
        prova: { attributo: mentale, abilita: [natura, percezione], difficolta: Media }
        successo:
          titolo: Il marchio tagliato
          testo: |
            Girando le strisce controluce ti accorgi che sono rifilate proprio
            dove il cuoio di Kasselt porta sul rovescio il suo marchio a fuoco,
            uno ogni braccio di lunghezza, e chi le ha tagliate sapeva dove
            tagliare. Lo dici ad alta voce, e Kasselt smette di sbuffare. «Il
            posto del marchio lo conosce soltanto chi lavora da me, e Nello Brusa
            l'ho cacciato dieci giorni fa» dice piano.
          segue: le-due-settimane-di-nello
        fallimento:
          titolo: Cuoio è cuoio
          testo: |
            Giri le strisce contro la luce e alla fine ti sembrano cuoio come
            tutti gli altri. Kasselt ti guarda come un operaio al primo giorno e
            ti spiega in tre frasi la differenza fra la concia all'ombra e quella
            al sole, poi la ripete a Irsa, più forte. La lite riprende dove
            l'avevano lasciata, e tu esci a prendere aria, che in Città Bassa vuol
            dire scegliere fra due odori.
          effetti: { scandalo: 0.5 }

      - testo: "Leggere il registro delle rate"
        descrizione: "Irsa segna tutto con una calligrafia da notaio, e se ha pagato sulla pagina c'è anche a chi."
        prova: { attributo: mentale, abilita: [politica-ed-economia, accademiche], difficolta: Media }
        successo:
          titolo: La croce
          testo: |
            La riga dice a chi Irsa ha pagato, al garzone di Kasselt, ma al posto
            della firma c'è una croce ripassata due volte. Chiedi a Kasselt se i
            suoi garzoni sanno scrivere il loro nome. «Tutti» dice lui, offeso.
            «Quello che non sapeva l'ho cacciato dieci giorni fa. Nello Brusa.»
            Poi guarda la data della riga, che viene il giorno dopo, e si
            zittisce.
          segue: le-due-settimane-di-nello
        fallimento:
          titolo: Una calligrafia da notaio
          testo: |
            Il registro delle rate è scritto così bene che ti perdi nelle pagine
            precedenti a contare quanta gente in Città Bassa paga una cotta di
            maglia a rate. Quando torni alla riga giusta Irsa e Kasselt hanno
            ripreso a litigare sopra la tua testa, e la pagina dice soltanto che
            Irsa ha pagato, cosa che sapevano già tutti e due.
          effetti: { tormento: 0.5 }

      - testo: "Mettere pace fra i due"
        descrizione: "Due persone che si stimano oggi si darebbero del ladro, e forse basta farle parlare."
        prova: { attributo: sociale, abilita: [empatia, persuasione], difficolta: Media }
        successo:
          titolo: Chi ha portato il rotolo
          testo: |
            Fai portare due sedie e ti siedi, mentre Kasselt resta in piedi. Poi
            chiedi chi ha portato il rotolo all'Armeria, e Irsa descrive un
            ragazzo magro con le mani bruciate dalla concia. Kasselt chiude gli
            occhi, e le braccia incrociate gli si sciolgono da sole. «Nello Brusa.
            L'ho cacciato dieci giorni fa per un taglio storto, e chi sbaglia da
            me non viene pagato» dice.
          segue: le-due-settimane-di-nello
        fallimento:
          titolo: Due voci
          testo: |
            Provi a farli parlare uno alla volta, e ottieni che parlino tutti e
            due insieme, più forte. Kasselt ti dice che la cortesia è una perdita
            di tempo professionale, e Irsa ti chiede con molta gentilezza di non
            mettere le mani sul suo registro. Alla fine rimandano la discussione a
            domani e ti lasciano solo davanti al rotolo di cuoio rotto.
          effetti: { scandalo: 0.5 }

      - testo: "Chiedere chi ha portato il cuoio"
        descrizione: "La domanda più semplice, che nessuno dei due ha ancora fatto."
        esito:
          titolo: Nello Brusa
          testo: |
            Chiedi soltanto chi ha portato il rotolo fino all'Armeria. Irsa dice
            che era un ragazzo della Conceria, magro, con le mani bruciate dalla
            concia, e che l'ha pagato a lui perché le consegne si pagano a chi le
            porta. Kasselt si passa una mano sulla faccia. «Nello Brusa» dice.
            «L'ho cacciato dieci giorni fa.» Per un po' nessuno dei due parla, e
            il banco fra loro sembra meno largo.
          pe: { empatia: 2 }
          segue: le-due-settimane-di-nello

  - id: le-due-settimane-di-nello
    immagine: ambientazione/citta-bassa
    titolo: Le due settimane di Nello
    tipo: seguito
    luogo: Città Bassa, una stanza sopra il forno
    area: citta-bassa
    requisiti: [botteghe.kasselt == 0]
    testo: |
      Nello Brusa abita in una stanza sopra un forno. Dentro c'è un ragazzo con
      le mani macchiate di bruno, su un pagliericcio accanto a una bambina che
      dorme, e sul tavolo una pagnotta e una borsa di tela con quasi tutte le
      monete di Irsa.

      {origine accolito-del-velo} Dopo la razzia hai salito molte scale come
      questa con le bende di Ottilia, e guardi per prima la bambina.

      {origine fuggiasco-di-ghoran} La finestra sul tetto del forno la guardi
      prima di tutto, da quando sei scappato da Ghoran.

      Nello si alza in piedi. «Mi avete cacciato senza pagarmi le ultime due
      settimane» dice a Kasselt. «Il cuoio buono l'ho venduto sul Ponte delle
      Mille Corde. A Irsa ho portato gli scarti, perché lei le consegne le paga
      a chi le porta.» «Le monete che mancano erano per l'affitto.»

      «Lavoro pulito o non lavoro» dice Kasselt. Irsa tace e guarda te.
    opzioni:
      - testo: "Proporre un accordo"
        descrizione: "Nello restituisce quello che ha e lavora il resto all'Armeria, e Kasselt gli paga le due settimane."
        immagine: personaggi/irsa-valbrun
        prova: { attributo: sociale, abilita: [persuasione, politica-ed-economia], difficolta: Media }
        successo:
          titolo: Monete nuove
          testo: |
            Dici a Kasselt che il lavoro fatto si paga anche quando chi l'ha fatto
            sbaglia dopo, e che le due settimane di Nello erano lavoro pulito.
            Kasselt ci pensa, poi conta le monete scegliendo soltanto quelle
            coniate quest'anno, il suo modo di chiedere scusa. Irsa riprende le
            sue e lascia a Nello la pagnotta. «Domani all'alba al banco sotto la
            scala, finché non le hai lavorate tutte» gli dice.
          pe: { persuasione: 5 }
          imposta: { botteghe.kasselt: 1 }
          effetti: { rep.botteghe: 1 }
        fallimento:
          titolo: Lavoro pulito
          testo: |
            Kasselt ti risponde che le seconde occasioni le si dà al pellame e non
            agli operai, e se ne va senza chiamare la Caserma, che è già molto.
            Irsa invece lascia sul tavolo le sue monete, con l'aggiunta di tasca
            sua di quelle che mancano, e a Nello dice di presentarsi domani
            all'alba al banco sotto la scala. Poi guarda te, e capisci che avrebbe
            voluto vederti convincere Kasselt.
          pe: { persuasione: 3 }
          imposta: { botteghe.kasselt: 1 }
          effetti: { rep.botteghe: 1, scandalo: 0.5 }

      - testo: "Dare ragione a Kasselt"
        descrizione: "Il ragazzo ha rubato a tutti e due, e il posto di guardia è a due strade da qui."
        immagine: personaggi/gunter-kasselt
        esito:
          titolo: Le regole della Conceria
          testo: |
            Kasselt annuisce e porta il ragazzo al posto di guardia, e Nello si
            volta una volta sola verso il pagliericcio. Irsa lascia un mucchietto
            delle sue monete accanto alla bambina che dorme. «Avevi ragione» ti
            dice sulla porta. «Avrei preferito che avessi torto.» La settimana
            dopo all'Armeria arriva un rotolo di cuoio nuovo con il marchio al suo
            posto e un biglietto di Kasselt per te, *corretto*.
          pe: { resilienza: 5 }
          imposta: { botteghe.kasselt: 1 }
          effetti: { rep.botteghe: 1 }

      - testo: "Pagare tu quello che manca"
        descrizione: "Quello che manca chiude il conto di Irsa, e il resto se lo sistemano Kasselt e il ragazzo."
        requisiti: [monete >= 12]
        esito:
          titolo: Quello che manca
          testo: |
            Conti sul tavolo le monete che mancano, e Irsa le prende senza
            discutere insieme alle sue. «Le seconde occasioni le si dà al pellame,
            non agli operai» dice Kasselt, e si avvia alla porta battendo i
            tacchi. Sulla soglia però torna indietro e lascia sul tavolo monete
            coniate quest'anno, una alla volta, finché non fanno due settimane di
            paga. Il ragazzo le fissa senza toccarle.
          pe: { empatia: 5 }
          imposta: { botteghe.kasselt: 1 }
          effetti: { rep.botteghe: 1, monete: -12 }

      - testo: "Lasciare che decidano loro"
        descrizione: "Sono due bottegai che si conoscono da anni, e tu il ragazzo l'hai già trovato."
        esito:
          titolo: Sulle scale
          testo: |
            Irsa e Kasselt escono sulle scale e ci restano mezz'ora, mentre la
            bambina si sveglia e ti fissa per un po' prima di riaddormentarsi.
            Quando rientrano hanno deciso. Nello restituisce quello che ha e
            Kasselt lascia stare la Caserma, ma le due settimane restano senza
            paga. Irsa ti dice sulla porta che è un pessimo accordo, e il primo
            che Kasselt accetta in dieci anni.
          pe: { galateo: 5 }
          imposta: { botteghe.kasselt: 1 }
          effetti: { rep.botteghe: 1 }

      - testo: "Ritrovare il cuoio buono sul Ponte"
        descrizione: "Nello ha venduto il cuoio buono sul Ponte delle Mille Corde, dove conosci i banchi che non fanno domande."
        quando: [origine.mercante-dei-ponti >= 1]
        esito:
          titolo: Il banco del pellaio
          testo: |
            Scendi con Irsa fino al Ponte delle Mille Corde, dove il pellaio ha il
            banco sotto il terzo pilone e, davanti alla licenza della Gilda, ti
            ricorda che le pelli le paga a peso. Il cuoio di Kasselt è ancora
            sotto il banco, con il marchio intero, e lo ricompri al prezzo pagato
            a Nello. Kasselt ti rimborsa con monete coniate quest'anno e paga a
            Nello le due settimane.
          pe: { politica-ed-economia: 5 }
          imposta: { botteghe.kasselt: 1 }
          effetti: { rep.botteghe: 1 }

  # ------------------------------------------------------------ storia a 6 · il capolavoro
  - id: il-capolavoro
    presso: fucina-dei-due-mastini
    immagine: personaggi/irsa-valbrun
    titolo: Il capolavoro
    sommario: "Irsa Valbrun alla fucina non viene mai, e stasera è seduta sulle casse del grezzo ad aspettarti con Bram."
    luogo: Fucina dei Due Mastini, dopo il tramonto
    area: citta-bassa
    requisiti: [rep.botteghe >= 6, botteghe.capolavoro == 0]
    testo: |
      Dopo il tramonto la Fucina dei Due Mastini dovrebbe essere chiusa, e
      invece il fuoco è acceso e un garzone mezzo addormentato tira piano il
      mantice. Sul ceppo dell'incudine c'è una bottiglia aperta con due
      bicchieri, uno più del solito, e sulle casse del grezzo è seduta Irsa
      Valbrun, con il grembiule sopra il panciotto buono.

      «Lei dice che ti serve un pezzo fatto da tutti e due» dice Bram,
      indicandola con il bicchiere. «Io dico che non lo so ancora. Così
      stasera ti guardiamo tutti e due, uno alla volta.»

      Irsa scende dalla cassa e ti gira intorno senza fretta. «Prima ti
      guardo, poi ti vendo» dice. «Stavolta non vendo niente, quindi ti
      guardo il doppio.» Alle sue spalle, sulla parete di fondo, sono appesi
      i tre pezzi di Bram che non stanno con gli altri.

      {origine rampollo-dei-quartieri-alti} La spada corta dei tuoi
      diciott'anni te l'hanno regalata già fatta, senza prenderti una misura,
      e essere guardato così da due persone del mestiere ti mette più a
      disagio di un pranzo del Consiglio.

      Ti asciughi le mani sui calzoni prima che Irsa te le guardi.
    opzioni:
      - testo: "Battere il ferro davanti a Bram"
        descrizione: "Ti tocca una barra del ferro migliore, e Bram ascolta l'incudine a occhi chiusi."
        immagine: personaggi/bram-halgast
        prova: { attributo: fisico, abilita: [resistenza, atletica], difficolta: Difficile }
        successo:
          titolo: Il suono giusto
          testo: |
            Bram ti dà una barra di ferro e la mazza, e si siede a bere. Lavori
            come ti ha insegnato con il garzone che tira il mantice al tuo ritmo,
            e per la prima volta il colpo parte dalle gambe senza che tu ci debba
            pensare. Quando hai finito Bram fa suonare la barra contro il corno.
            «Va bene» dice a Irsa, e ti versa da bere nel secondo bicchiere.
          pe: { resistenza: 3 }
          segue: il-pezzo-su-misura
        fallimento:
          titolo: Il braccio che scende
          testo: |
            A metà barra il braccio ti scende da solo e i colpi si fanno corti. Bram
            apre gli occhi al primo colpo storto e non li richiude più, e quando ti
            fermi ti toglie la mazza di mano e la appende al suo chiodo. «Torna quando
            alla fine del lavoro ti reggi ancora in piedi» dice. Irsa si versa da bere
            nel bicchiere che era per te.

      - testo: "Farti guardare da Irsa"
        descrizione: "Irsa vuole vederti muovere come in uno scontro, con un'arma in mano, prima di decidere."
        prova: { attributo: fisico, abilita: [armi-da-mischia, armi-da-distanza, rissa], difficolta: Media }
        successo:
          titolo: La cordicella
          testo: |
            Irsa ti mette in mano un bastone zavorrato e ti chiede di muoverti
            come se qualcuno ti venisse addosso, mentre ti gira intorno e segna
            sul foglio le spalle e il passo. Poi ti chiede da che parte ti arriva
            il colpo che ti sorprende, e glielo dici prima di accorgerti che
            nessuno te l'aveva mai chiesto. «Adesso so che cosa ti serve» dice, e
            porge il foglio a Bram.
          pe: { percezione: 3 }
          segue: il-pezzo-su-misura
        fallimento:
          titolo: Come da un sarto
          testo: |
            Ti muovi con il bastone zavorrato sapendo che Irsa ti guarda, e ogni
            gesto ti esce rigido, preparato. Dopo un minuto ti fa fermare. «Così
            ti vedo come ti vede un sarto» dice, senza cattiveria. «Torna quando
            ti dimentichi di me.» Bram ride per la prima volta nella serata, e lei
            gli lancia un'occhiata che lo fa smettere.

      - testo: "Dire che non sai che cosa ti serve"
        descrizione: "Irsa vende soltanto a chi sa rispondere, e forse anche questa è una risposta."
        esito:
          titolo: La risposta onesta
          testo: |
            Dici a Irsa che non sai che cosa ti serve, e che finora hai usato
            quello che c'era, e ti scaldi fino alle orecchie. Lei smette di
            girarti intorno. «In dieci anni di bottega me l'hanno detto in pochi»
            dice. «Gli altri mi dicono quello che hanno visto addosso a un eroe.»
            Ti prende le misure con la cordicella annodata, e Bram legge il foglio
            tenendolo lontano dagli occhi.
          pe: { resilienza: 3 }
          segue: il-pezzo-su-misura

  - id: il-pezzo-su-misura
    immagine: personaggi/bram-halgast
    titolo: Il pezzo su misura
    tipo: seguito
    luogo: Fucina dei Due Mastini, a notte fonda
    area: citta-bassa
    requisiti: [botteghe.capolavoro == 0]
    testo: |
      Bram e Irsa parlano di metallo a voce bassa per il tempo di un bicchiere.
      Ogni tanto Irsa batte il dito sul foglio delle misure, e Bram scuote la
      testa finché alla fine annuisce.

      {tecnologia Difficile} Di tutto il discorso afferri soltanto il punto in
      cui una lama deve cedere perché il resto non si spezzi, e Bram scuote la
      testa proprio quando Irsa ha ragione.

      Poi Bram si alza e va alla parete dei suoi pezzi. «Roba nuova non ne
      faccio per nessuno» dice. «Rifaccio quella vecchia, sulle tue misure. Io
      batto il ferro e lei lo finisce, e lo firmiamo tutti e due.» Irsa soppesa
      un sacchetto di anelli di bronzo. «Ci vorrà tutta la notte. Tu decidi che
      cosa, e poi ti siedi e non ci parli più.»

      Bram posa sull'incudine il martello di pietra inciso, quello che usa
      soltanto quando un pezzo è finito.
    opzioni:
      - testo: "Il martello dei Due Mastini"
        descrizione: "Il vecchio martello da fucina del padre di Bram, ribattuto da lui sul tuo braccio e fasciato da Irsa."
        immagine: reliquie/martello-due-mastini
        requisiti: [oggetto.martello-dei-due-mastini == 0]
        esito:
          titolo: Il martello del padre
          testo: |
            Bram rimette nel fuoco la testa del martello e la ribatte finché il
            martello sta in equilibrio sul tuo palmo, e Irsa ne fascia il manico
            con una spirale di filo cremisi. All'alba Bram batte il martello di
            pietra accanto al marchio delle incudini e prima di dartelo lo tiene
            in mano un momento. «Era di mio padre, e adesso è un po' tuo e un po'
            di lei» dice.
          pe: { tecnologia: 5 }
          imposta: { botteghe.capolavoro: 1 }
          effetti: { oggetto.martello-dei-due-mastini: 1, rep.botteghe: 1 }

      - testo: "Il Re della Collina"
        descrizione: "Lo spadone dalla lama larga e scura che colpisce più forte quando sei ferito, riequilibrato da Bram."
        immagine: reliquie/spadone-re-della-collina
        requisiti: [oggetto.martello-dei-due-mastini >= 1, oggetto.re-della-collina == 0]
        esito:
          titolo: Un assalto in più
          testo: |
            Bram sposta il peso dello spadone verso l'elsa, finché la punta smette
            di tirarti il polso verso terra. Irsa rifà l'impugnatura con il cuoio
            della Conceria Kasselt e ci annoda sotto la guardia un anello di
            bronzo. All'alba Bram batte il martello di pietra sul tallone della
            lama. «Lo chiamano così perché un mercenario è rimasto in piedi un
            assalto più del dovuto. Vedi di fare lo stesso» dice.
          pe: { tecnologia: 5 }
          imposta: { botteghe.capolavoro: 1 }
          effetti: { oggetto.re-della-collina: 1, rep.botteghe: 1 }

      - testo: "La corazza ostinata"
        descrizione: "Piastre irregolari rifatte tre volte, ribattute da Bram sul tuo petto, con le cinghie di Irsa su misura."
        immagine: reliquie/corazza-ostinata
        requisiti: [oggetto.corazza-ostinata == 0]
        esito:
          titolo: Rifatta quattro volte
          testo: |
            Bram smonta la corazza e ne ribatte le piastre sulle misure del tuo
            petto, poi Irsa rifà le cinghie con il cuoio della Conceria Kasselt e
            cuce dentro un'imbottitura più spessa dove prendi i colpi. All'alba
            Bram batte il martello di pietra sul pettorale. «L'ho rifatta tre
            volte, e uno di quelli che l'hanno portata è tornato vivo dal
            Labirinto. Vedi di essere il secondo» dice.
          pe: { tecnologia: 5 }
          imposta: { botteghe.capolavoro: 1 }
          effetti: { oggetto.corazza-ostinata: 1, rep.botteghe: 1 }

      - testo: "La cotta di maglia di Irsa"
        descrizione: "Anelli e cuoio sottile con le spalle a ventaglio, a cui hanno lavorato tutti e due."
        immagine: reliquie/cotta-di-maglia-irsa
        requisiti: [oggetto.corazza-ostinata >= 1, oggetto.cotta-di-maglia-di-irsa == 0]
        esito:
          titolo: Le spalle a ventaglio
          testo: |
            Bram trafila il filo per metà notte, e Irsa lo taglia in anelli e li chiude
            uno per uno con le pinze piccole, senza mai alzare la testa. Il rumore
            regolare degli anelli a un certo punto ti fa addormentare sulla cassa.
            All'alba Bram batte il martello di pietra sulla fibbia del collo. «Ti
            stancherà di più la sera» dice Irsa, stringendoti le cinghie. «Ma alla sera
            ci arrivi.»
          pe: { tecnologia: 5 }
          imposta: { botteghe.capolavoro: 1 }
          effetti: { oggetto.cotta-di-maglia-di-irsa: 1, rep.botteghe: 1 }

      - testo: "I coltelli da lancio"
        descrizione: "Tre coltelli gemelli, con le lame di Bram e le rune di richiamo di Irsa sul dorso."
        immagine: icone/thrown-daggers
        requisiti: [oggetto.asce-da-lancio == 0]
        esito:
          titolo: Tre coltelli gemelli
          testo: |
            Bram forgia tre coltelli e li confronta sul palmo finché pesano
            uguali. Irsa fascia le impugnature di cuoio e incide sul dorso le rune
            di richiamo. Prima dell'alba ti fa lanciare il primo contro il ceppo,
            e dopo il lancio te lo ritrovi in mano. Bram batte il martello di
            pietra sulle tre impugnature. «È l'unica cosa che facciamo sempre in
            due, e adesso la fai anche tu» dice.
          pe: { tecnologia: 5 }
          imposta: { botteghe.capolavoro: 1 }
          effetti: { oggetto.asce-da-lancio: 1, rep.botteghe: 1 }

      - testo: "Il giaco di maglia"
        descrizione: "Maglia fitta con il zig-zag di anelli di bronzo di Irsa, che attutisce il rumore."
        immagine: reliquie/giaco-di-maglia-irsa
        requisiti: [oggetto.asce-da-lancio >= 1, oggetto.giaco-di-maglia-di-irsa == 0]
        esito:
          titolo: Il nodo a sei passi
          testo: |
            Bram trafila il filo di ferro, e Irsa ci intreccia a zig-zag gli
            anelli di bronzo, con il nodo a sei passi che usa per riconoscere i
            falsi. Prima dell'alba ti fa camminare per la fucina, e la maglia non
            tintinna, tanto che Tizzone sulla soglia non si sveglia. Bram batte il
            martello di pietra sulla fibbia. «Se qualcuno lo copia, ce ne
            accorgiamo in due» dice Irsa.
          pe: { tecnologia: 5 }
          imposta: { botteghe.capolavoro: 1 }
          effetti: { oggetto.giaco-di-maglia-di-irsa: 1, rep.botteghe: 1 }

      - testo: "Soltanto la loro firma"
        descrizione: "Quello che porti ti basta, e chiedi soltanto che tutti e due ci mettano sopra il loro segno."
        esito:
          titolo: Due firme
          testo: |
            Dici che quello che porti ti basta, e Bram ti guarda come se avessi
            rifiutato da bere. Irsa invece ride, ti prende di mano l'arma e ne
            rifà l'impugnatura con il cuoio della Conceria Kasselt e un anello di
            bronzo. All'alba Bram ci batte il martello di pietra vicino
            all'impugnatura. «È la prima volta che firmo una cosa che non ho fatto
            io, quindi non lo raccontare in giro» dice.
          pe: { tecnologia: 5 }
          imposta: { botteghe.capolavoro: 1 }
          effetti: { rep.botteghe: 1 }

  # ------------------------------------------------------------ la carta
  - id: carta-il-garzone-di-bram
    immagine: ambientazione/citta-bassa
    titolo: Il garzone di Bram
    sommario: "Un ragazzo con un carretto di ferro grezzo è incastrato in mezzo alla strada, e la fila dei carri bestemmia."
    luogo: Città Bassa, una strada in salita
    tipo: carta
    area: citta-bassa
    requisiti: [rep.botteghe < 2]
    testo: |
      In una strada la ruota di un carretto è finita in una delle fenditure
      calde, da cui sale un vapore che sa di zolfo. A reggere le stanghe c'è
      un ragazzino, e dietro di lui i carrettieri gli dicono che cosa
      pensano di sua madre.

      «È il ferro per l'Armeria di Irsa» dice. «Se arriva tardi, mastro
      Halgast mi ammazza. Se lo lascio qui, mi ammazza due volte.» Sul
      fianco del carretto qualcuno ha dipinto un mastino rosso che sembra un
      maiale arrabbiato.

      {atletica Facile} La ruota è incastrata di poco, e il peso sta quasi
      tutto sull'altra.
    opzioni:
      - testo: "Sollevare la ruota"
        descrizione: "Ti basta infilare una spalla sotto il pianale e spingere al momento giusto, e la ruota esce dalla crepa."
        prova: { attributo: fisico, abilita: atletica, difficolta: Facile }
        successo:
          titolo: Fuori dalla crepa
          testo: |
            Ti infili con la spalla sotto il pianale, e al tuo segnale il ragazzo
            tira le stanghe con tutto il suo peso. La ruota esce dalla crepa con
            uno strattone, e a metà salita il ragazzo ti grida che si chiama Pim,
            e che alla Fucina dei Due Mastini cercano braccia, purché non parlino
            troppo. I carrettieri ti salutano con meno entusiasmo di quanto ne
            avevano per insultare lui.
          pe: { atletica: 2 }
          effetti: { rep.botteghe: 0.5 }
        fallimento:
          titolo: Il vapore
          testo: |
            Ti infili sotto il pianale proprio dove sale il vapore, e la fenditura
            ti scotta il braccio fino al gomito. Molli la presa prima di averlo
            deciso, e la ruota ricade più a fondo di prima. Alla fine un
            carrettiere scende bestemmiando e la tira fuori con una leva, e il
            ragazzo riparte senza guardarti.
          effetti: { ferite: 0.5 }

      - testo: "Portare le barre a mano"
        descrizione: "Scaricato, il carretto esce dalla crepa, ma le barre vanno portate fino all'Armeria, e ci vuole la mattina."
        esito:
          titolo: Barra per barra
          testo: |
            Scaricate le barre, il carretto vuoto esce dalla crepa con una spinta
            sola, e siccome scricchiola ne portate metà a spalla fino all'Armeria
            di Irsa. Irsa vi guarda arrivare sudati e ti guarda le mani prima del
            ferro. Il ragazzo le dice che sei un amico di mastro Halgast, e tu non
            lo smentisci, anche se Halgast dice di non avere amici.
          pe: { resistenza: 2 }
          effetti: { rep.botteghe: 0.5 }

      - testo: "Tirare dritto"
        descrizione: "Il carretto e il ferro sono di qualcun altro, e anche la fretta."
        costo: 0
        esito:
          titolo: La fila
          testo: |
            Giri intorno alla fila dei carri e prosegui. All'angolo ti volti, e il
            ragazzo è ancora lì con le mani sulle stanghe. Dopo un po' arriva
            dalla fucina un uomo calvo a torso nudo che solleva il carretto con
            una mano sola, e il ragazzo si prende uno scappellotto, più affettuoso
            che altro.
