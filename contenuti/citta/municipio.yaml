# La città viva, luogo 7: il Municipio (presso: municipio, area quartieri-alti).
# L'attività delle udienze del mattino, le tre storie della casata e la carta del bando.
# Le tre storie sono i passi 1, 3 e 5 della quest del Consiglio (contenuti/fazioni/consiglio/, pista
# fazione.consiglio): 1 le petizioni, con il seguito nel seminterrato (rep.castaldi >= 2, fazione.consiglio == 0);
# 3 il ritratto della Rappresentante, con il seguito davanti al quadro (fazione.consiglio == 2), che porta al
# seguito del grado in passi-1.yaml; 5 un incarico del Consiglio, con il seguito del nome sul registro
# (fazione.consiglio == 4), dove il nome resta a matita: l'inchiostro arriva al passo 6, dopo la tribuna. I flag
# municipio.petizioni, municipio.ritratto e municipio.incarico restano, perché altre scene li leggono.
# Reputazione: è quella della casata di Julia (rep.castaldi). Gli impiegati, le suppliche e i dazi la fanno
# salire fino a 4; le udienze piccole, le carte della seduta e la scorta di Quintus fino a 6 (sociale,
# mentale e fisico). Il Municipio non ha un servizio a pagamento: i servizi della casata si aprono con i gradi
# della quest (contenuti/fazioni/consiglio/servizi.yaml).
# Dopo pista.pelle >= 7 Julia fa le riforme (licenze, cooperative del grano e dei taglialegna) e le casse
# sono vuote: varianti nella supplica, nella panca, negli incarichi, nella prova della storia a 6 e nel bando.
# Nomi nuovi: Tullio Merga (il primo impiegato), Ada Rusca (lavandaia della Città Bassa), Mastro Fenzi (il
# pittore, solo nominato), Nino (il garzone che affigge i bandi).
storylet:
  # ------------------------------------------------------------ l'attività ripetibile
  - id: le-udienze-del-mattino
    presso: municipio
    immagine: ambientazione/quartieri-alti
    titolo: Le udienze del mattino
    sommario: "Il Municipio riceve dalla seconda campana, un nome alla volta, e la panca dell'anticamera è sempre piena."
    luogo: Municipio, l'anticamera
    area: quartieri-alti
    ripetibile: true
    testo: |
      Nell'anticamera del Municipio la panca di legno è consumata dalle attese
      e lucida come un corrimano, e sullo schienale qualcuno ha inciso una
      tacca per ogni ora passata ad aspettare, fermandosi a ventitré.

      {resistenza Media fallita} La schiena ha già capito che cosa l'aspetta,
      e comincia a protestare prima ancora di sederti.

      Dietro il bancone l'impiegato Tullio Merga chiama un nome alla volta,
      con gli occhiali appesi a una cordicella che inforca soltanto per i nomi
      difficili. Ogni tanto la porta dell'ufficio si apre e Julia Castaldi
      chiama il nome seguente con la sua voce roca.
    opzioni:
      - testo: "Dare una mano agli impiegati"
        descrizione: "Tullio Merga ha più nomi sulla lista che ore nella mattina, e chi sa smistare la gente gli serve."
        requisiti: [rep.castaldi < 2]
        prova: { attributo: sociale, abilita: [galateo, politica-ed-economia], difficolta: Media }
        successo:
          titolo: La lista di Tullio
          testo: |
            Tullio ti chiede di dividere la coda per faccende, i dazi da una parte e le liti fra
            vicini dall'altra. Passi lungo la panca a chiedere sottovoce a ciascuno che cosa lo
            porta qui, e chi si è già lamentato due volte lo metti in cima, perché non arrivi alla
            terza. A mezzogiorno la panca è vuota, e Tullio inforca gli occhiali per guardarti
            meglio.
          effetti: { monete: 1, rep.castaldi: 0.5 }
        fallimento:
          titolo: Il mugnaio e la vedova
          testo: |
            Metti un mugnaio con una lite di confine davanti a una vedova che
            aspetta dall'alba, e la vedova lo fa sapere a tutta la sala con una
            voce che arriva fino all'ufficio della Rappresentante. Tullio deve
            uscire da dietro il bancone a calmarla, e quando torna si riprende la
            lista senza una parola e ti lascia il posto in fondo alla panca,
            quello vicino allo spiffero.

      - testo: "Tenere la lista al posto di Tullio"
        descrizione: "Ormai Tullio ti lascia la lista e va a bersi il caffè che non ha mai tempo di bere."
        requisiti: [rep.castaldi >= 2, rep.castaldi < 4]
        prova: { attributo: sociale, abilita: [galateo, politica-ed-economia], difficolta: Media }
        successo:
          titolo: I nomi difficili
          testo: |
            Chiami i nomi dal bancone per tutta la mattina, anche quelli per cui
            Tullio inforca gli occhiali, e a un mercante di Laresh che vuole
            passare avanti spieghi con garbo che si riceve per ordine di arrivo.
            Tullio rientra con il caffè freddo e ti dà la paga del turno. «In
            ordine» dice, guardando la panca come un uomo che vede il proprio
            giardino potato da un altro.
          effetti: { monete: 2, rep.castaldi: 0.5 }
        fallimento:
          titolo: Un nome storpiato
          testo: |
            Verso mezzogiorno storpi il nome di un consigliere della Gilda venuto
            per una faccenda privata, e lui si alza con molta calma e ti corregge
            davanti a tutta la panca, sillaba per sillaba. Tullio torna con il
            caffè, capisce dal silenzio della sala che cosa è successo e si
            riprende la penna con due dita.

      - testo: "Portare la supplica di una fornaia"
        descrizione: "Una fornaia della Città Bassa ha il pane nel forno e ti lascia in mano la sua supplica."
        requisiti: [rep.castaldi < 4, pista.pelle < 7]
        prova: { attributo: sociale, abilita: [persuasione, empatia], difficolta: Media }
        successo:
          titolo: Il prezzo della farina
          testo: |
            La supplica dice una cosa sola, che un sacco di farina costa un terzo
            più dell'anno scorso. Quando Julia apre la porta glielo spieghi tu,
            con le cifre che la fornaia ti ha ripetuto tre volte sulla scalinata,
            e lei le scrive sul registro del Consiglio e le sottolinea. «La porto
            in seduta» dice, «però dille che non le prometto niente, perché i
            mulini sono tutti dello stesso padrone.»
          effetti: { rep.castaldi: 0.5 }
        fallimento:
          titolo: Il forno e la farina
          testo: |
            Cominci dal forno della fornaia invece che dalla farina, e quando
            Julia ti chiede quanto costa un sacco adesso e quanto costava un anno
            fa, non lo sai. «Torna quando hai le cifre» dice, e chiama il nome
            seguente. Sulla scalinata la fornaia si riprende la supplica senza
            guardarti e corre giù verso il pane.

      - testo: "Portare la supplica di una madre"
        descrizione: "Una madre della Città Bassa sale per la terza volta a chiedere delle sue finestre."
        requisiti: [rep.castaldi < 4, pista.pelle >= 7]
        prova: { attributo: sociale, abilita: [persuasione, empatia], difficolta: Media }
        successo:
          titolo: Le assi alle finestre
          testo: |
            La supplica racconta che la notte della Pignatta le hanno sfondato le
            finestre, e che da allora ci tiene inchiodate delle assi. Lo racconti
            tu a Julia, con il bambino che ti sbava sul polsino, e lei ti dice che
            le casse sono vuote, ma intanto scrive a parte il nome della donna.
            «Le assi buone gliele manda la cooperativa dei taglialegna, e il vetro
            quando le casse si riempiono.»
          effetti: { rep.castaldi: 0.5 }
        fallimento:
          titolo: La strada sbagliata
          testo: |
            Julia ti chiede in quale strada abita la donna, e tu non lo sai,
            perché lei è scesa nell'atrio a cambiare il bambino. Senza una strada,
            ti dice, non saprebbe nemmeno dove mandare a dire di no. Sulla
            scalinata trovi la madre seduta su un gradino con il bambino
            addormentato, e lei te lo legge in faccia senza chiederti niente.

      - testo: "Controllare i conti di un dazio"
        descrizione: "Ogni mese la Gilda manda il conto dei dazi dei Ponti, e qualcuno deve rifare le somme."
        requisiti: [rep.castaldi < 4]
        prova: { attributo: mentale, abilita: [accademiche, politica-ed-economia], difficolta: Media }
        successo:
          titolo: La colonna di destra
          testo: |
            Al tavolino sotto la finestra rifai colonna per colonna il conto dei
            dazi del Ponte delle Mille Corde, tre fogli fitti con la firma di un
            esattore della Gilda. Al secondo foglio una colonna torna con qualche
            moneta in meno, a favore della Gilda. Julia ci scrive accanto la cifra
            giusta e la sottolinea due volte. Tullio ti paga la mattinata e
            sospira, perché adesso alla Gilda dovrà scrivere lui.
          effetti: { monete: 3, rep.castaldi: 0.5 }
        fallimento:
          titolo: Il riporto
          testo: |
            Alla terza colonna trovi un ammanco nel totale, lo segni con un certo
            orgoglio e porti il foglio a Tullio. Lui lo rifà a mente con gli
            occhiali sul naso e ti mostra che hai sbagliato un riporto. Ti paga
            uno spicciolo per il tempo, e il foglio lo ricopia da capo con la sua
            grafia minuta.
          effetti: { monete: 1 }

      - testo: "Ricevere le udienze piccole"
        descrizione: "Julia è in seduta fino a sera, e le faccende minute le può sbrigare qualcuno di cui si fida."
        requisiti: [rep.castaldi >= 4, rep.castaldi < 6]
        prova: { attributo: sociale, abilita: [galateo, persuasione], difficolta: Media }
        successo:
          titolo: Le udienze piccole
          testo: |
            Al tavolino dell'anticamera ricevi la panca un nome alla volta, da un
            carrettiere multato due volte per la stessa ruota a due vicini che
            litigano per un muro che nessuno dei due ha costruito. A metà
            pomeriggio ti accorgi che stai inforcando anche tu occhiali che non
            hai. La sera Julia sfoglia il registro in piedi, ne corregge una riga
            sola e ti paga la giornata.
          effetti: { monete: 4, rep.castaldi: 0.5 }
        fallimento:
          titolo: Il muro di nessuno
          testo: |
            Al terzo nome ti arrivano davanti due vicini che litigano per un muro,
            e tu dai ragione al primo che parla. Il secondo si mette a gridare, e
            Tullio deve chiamare le sentinelle della scalinata per separarli. La
            sera Julia ti dice che quel muro andrà a vederlo lei, ti paga metà
            della giornata e richiude il registro.
          effetti: { monete: 2 }

      - testo: "Preparare le carte per la seduta"
        descrizione: "Prima di ogni seduta Julia ti fa leggere le pratiche e scrivere in fondo che cosa ne pensi."
        requisiti: [rep.castaldi >= 4, rep.castaldi < 6]
        prova: { attributo: mentale, abilita: [politica-ed-economia, accademiche], difficolta: Difficile }
        successo:
          titolo: In fondo alla pratica
          testo: |
            Nell'ufficio di Julia leggi le pratiche della seduta e in fondo a ciascuna
            scrivi in tre righe che cosa chiede e chi ci guadagna. La sera lei ne rilegge
            una sola, quella dove hai scritto che i conti non tornano, e tu tieni le dita
            intrecciate sotto la scrivania finché non posa il foglio. «Hai ragione, e
            domani lo dico in Consiglio» dice.
          effetti: { monete: 5, rep.castaldi: 0.5 }
        fallimento:
          titolo: La colonna sbagliata
          testo: |
            In fondo a una pratica sui ponti scrivi che il conto non torna, e la
            seduta di Julia comincia da lì. Il consigliere della Gilda impiega un
            quarto d'ora a dimostrare che il conto tornava benissimo e che avevi
            letto la colonna sbagliata. Julia te lo racconta la sera senza alzare
            la voce, ti paga lo stesso perché il lavoro l'hai fatto, e la prossima
            volta le rilegge lei.
          effetti: { monete: 2 }

      - testo: "Camminare con la scorta di Quintus Vael"
        descrizione: "Quando Julia scende dal Maniero al Municipio, il percorso lo decide Quintus Vael. Stamattina gli manca un uomo."
        immagine: personaggi/quintus-vael
        requisiti: [rep.castaldi >= 4, rep.castaldi < 6]
        prova: { attributo: fisico, abilita: [resistenza, atletica], difficolta: Media }
        successo:
          titolo: Ogni giorno un'altra strada
          testo: |
            Quintus Vael ti mette due passi dietro la Rappresentante a tenere gli
            occhi sulle finestre. Prendete la via lunga dietro la Casa dei Nodi, e
            a ogni incrocio Quintus si ferma mezzo passo prima di Julia, che
            cammina leggendo una pratica. Sulla scalinata del Municipio ti fa un
            cenno con il mento, e la cicatrice gli si tende. «Domani si cambia
            strada» dice, «perché qui si cambia strada ogni giorno.»
          effetti: { monete: 3, rep.castaldi: 0.5 }
        fallimento:
          titolo: Il carro di fieno
          testo: |
            A metà strada un carro di fieno sbuca da un vicolo, e tu resti a
            guardarlo invece di metterti in mezzo. Quintus lo fa al posto tuo, con
            il braccio teso e la mano sull'elsa, mentre Julia non alza nemmeno la
            testa dalla pratica. In cima alla scalinata Quintus ti spiega che un
            carro di fieno nasconde bene un uomo armato, e che domattina gli
            uomini li sceglie lui.
          effetti: { monete: 1 }

      - testo: "Sbrigare un incarico del Consiglio"
        descrizione: "Accanto al tuo nome il registro elenca le faccende che il Consiglio rinvia da mesi."
        immagine: fazioni/consiglio-di-qir-azel
        requisiti: [municipio.incarico >= 1, pista.pelle < 7]
        prova: { attributo: sociale, abilita: [persuasione, politica-ed-economia], difficolta: Media }
        successo:
          titolo: Una riga in meno
          testo: |
            L'incarico di oggi è un forno comune della Città Bassa che due vicoli
            si contendono da un anno. Con la lettera del Consiglio in tasca metti
            le due famiglie davanti alla bocca del forno finché si accordano sui
            turni del pane, la mattina ai primi e il pomeriggio agli altri, e la
            più vecchia scrive l'accordo a carbone sul muro, disegnandoci sotto
            una pagnotta per i nipoti.
          effetti: { monete: 8 }
        fallimento:
          titolo: Le pagnotte bruciate
          testo: |
            Metti le due famiglie davanti alla bocca del forno comune, e mezz'ora
            dopo stanno ancora discutendo di chi ha bruciato le pagnotte
            dell'altro tre inverni fa, finché se ne vanno ognuno dalla sua parte.
            Julia rimette la pratica in fondo alla pila e ti paga lo stesso,
            perché la giornata, dice, l'hai persa per il Consiglio.
          effetti: { monete: 4 }

      - testo: "Sbrigare un incarico del Consiglio"
        descrizione: "Con le casse vuote Julia paga gli incarichi tardi, e qualche volta in notizie."
        immagine: fazioni/consiglio-di-qir-azel
        requisiti: [municipio.incarico >= 1, pista.pelle >= 7]
        prova: { attributo: mentale, abilita: [politica-ed-economia, accademiche], difficolta: Media }
        successo:
          titolo: Il registro del mulino
          testo: |
            La cooperativa del grano ha rilevato il Mulino Malgrani e non sa
            ancora tenere un registro. Passi la giornata a insegnare a un mugnaio
            con le mani infarinate come si scrive un'uscita e come si chiude una
            pagina, e a sera i conti tornano. Julia ti paga una parte della
            giornata, e al posto del resto ti racconta chi in Consiglio tratta già
            per i seggi vuoti.
          effetti: { monete: 4, informazioni.pettegolezzo: 1 }
        fallimento:
          titolo: La farina sul registro
          testo: |
            Il mugnaio della cooperativa annuisce a tutto, e la sera scopri che ha
            scritto le uscite nella colonna delle entrate per tutto il mese.
            Rifate i conti insieme fino al buio, con la farina che si impasta con
            l'inchiostro sulla pagina. Julia ti paga qualcosa e ti chiede di
            tornarci la settimana prossima.
          effetti: { monete: 2 }

      - testo: "Aspettare sulla panca e ascoltare"
        descrizione: "Sulla panca si aspetta a lungo, e chi aspetta parla."
        requisiti: [pista.pelle < 7]
        esito:
          titolo: Le voci della panca
          testo: |
            Ti siedi fra un carrettiere e una signora dei Quartieri Alti con un
            cane piccolo in grembo. Il carrettiere racconta che la farina è salita
            ancora, e la signora gli risponde che ai Malgrani la farina non manca
            mai, a voce così bassa che il cane alza le orecchie.
          pe: { politica-ed-economia: 2 }

      - testo: "Aspettare sulla panca e ascoltare"
        descrizione: "Adesso sulla panca ci sono soprattutto mugnai e taglialegna, venuti per le licenze nuove."
        requisiti: [pista.pelle >= 7]
        esito:
          titolo: Le licenze nuove
          testo: |
            Ti siedi fra due taglialegna con il cappello in mano e un mugnaio che
            ripassa a mezza voce le domande della licenza. I taglialegna discutono
            di chi deve fare il caposquadra alla Segheria della cooperativa, senza
            mettersi d'accordo nemmeno sul modo di votare. Il mugnaio ti chiede
            quanto si paga di tassa sulla macinatura, e quando gli dici che non lo
            sai si tranquillizza.
          pe: { politica-ed-economia: 2 }

      - testo: "Farti chiamare per primo"
        descrizione: "Tullio Merga conosce il tuo cognome, e alla tua famiglia la panca non l'ha mai fatta fare nessuno."
        quando: [origine.rampollo-dei-quartieri-alti >= 1]
        esito:
          titolo: Il cognome
          testo: |
            Tullio inforca gli occhiali per leggere il tuo nome, che pure è un nome
            facile, e lo chiama per primo. Un consigliere che ti ha visto crescere si
            ferma a salutarti e ti racconta a voce bassa che cosa deciderà il
            Consiglio la settimana prossima. Quando torni verso le scale la panca ti
            guarda passare, e le ventitré tacche sullo schienale restano ventitré.
          effetti: { informazioni.voce: 1 }

  # ------------------------------------------------------------ storia a 2 · le petizioni
  - id: le-petizioni
    presso: municipio
    immagine: ambientazione/quartieri-alti
    titolo: Le petizioni
    sommario: "Una lavandaia della Città Bassa sale in Municipio per la terza volta con la stessa petizione."
    luogo: Municipio, il bancone degli impiegati
    area: quartieri-alti
    requisiti: [rep.castaldi >= 2, fazione.consiglio == 0, pista.capomozzo >= 10]
    testo: |
      La donna in fondo alla panca, sotto lo spiffero, l'hai già vista due volte. È Ada Rusca, una
      lavandaia della Città Bassa con le mani arrossate dall'acqua del lavatoio, e tiene sulle ginocchia
      un foglio piegato in quattro. Quando Tullio Merga chiama l'ultimo nome della mattina, che è di un
      altro, si alza lo stesso.

      {origine figlio-della-citta-bassa} Nei vicoli le carte per il Comune si tengono in tasca piegate
      così, e si riaprono soltanto davanti a chi deve leggerle.

      «Sono tre mesi» dice. «Davanti al lavatoio c'è un ponticello di assi sopra il canale di scolo, e
      le assi sono marce. Ci è caduta dentro una bambina, e l'abbiamo tirata fuori per i capelli.»
      Tullio inforca gli occhiali e le risponde gentilmente che la petizione è in esame, come le altre
      due volte.

      Ada se ne va senza discutere e lascia il foglio sul bancone. I fogli scritti bene, con i margini
      dritti e il sigillo, Tullio li mette nel cesto che il garzone porta alla Rappresentante, e quelli
      con le macchie d'inchiostro e le croci al posto delle firme in una cassa sotto il bancone, che a
      fine mattina il garzone si carica in spalla per scendere nel seminterrato.

      {percezione Facile} Il foglio di Ada aveva i margini storti, ed è finito nella cassa senza che
      Tullio lo riaprisse.
    opzioni:
      - testo: "Chiedere a Tullio dove va la cassa"
        descrizione: "Tullio è un uomo gentile e ordinato, e gli uomini ordinati rispondono volentieri a chi chiede con garbo."
        prova: { attributo: sociale, abilita: [galateo, persuasione], difficolta: Media }
        successo:
          titolo: In archivio
          testo: |
            Aspetti che la panca si svuoti e gli chiedi della cassa con il tono
            che useresti per il tempo. Tullio si toglie gli occhiali e li pulisce
            sulla manica. «In archivio» dice, «in ordine, per anno.» Quando gli
            chiedi se la Rappresentante le legge resta con gli occhiali in mano,
            poi prende una candela dal cassetto e ti fa segno di seguirlo giù per
            le scale.
          pe: { galateo: 5 }
          segue: la-cassa-dei-respinti
        fallimento:
          titolo: Davanti al pubblico
          testo: |
            Gli chiedi della cassa mentre la panca è ancora mezza piena, e Tullio
            arrossisce fino alle orecchie e ti risponde a voce alta che la
            procedura non si discute davanti al pubblico. Da quel momento ti
            chiama per cognome e ti fa aspettare in fondo alla panca, sotto lo
            spiffero, accanto al posto di Ada.
          effetti: { scandalo: 0.5 }

      - testo: "Seguire il garzone con la cassa"
        descrizione: "Il garzone scende con la cassa verso il seminterrato, dove la banca cittadina ha le sue sentinelle."
        prova: { attributo: fisico, abilita: [furtivita, atletica], difficolta: Media }
        successo:
          titolo: La porta bassa
          testo: |
            Scendi dietro il garzone rasente al muro. In fondo alle scale le
            sentinelle guardano soltanto la grata della banca, e il garzone gira
            dall'altra parte, verso una porta bassa senza guardia. Dentro ci sono
            casse impilate fino al soffitto, con l'anno scritto col gesso sul
            coperchio, e stai ancora leggendo le date quando alle tue spalle si
            accende una candela, tenuta da Tullio.
          pe: { furtivita: 5 }
          segue: la-cassa-dei-respinti
        fallimento:
          titolo: La grata della banca
          testo: |
            In fondo alle scale sbagli corridoio e ti ritrovi davanti alla grata
            della banca cittadina, con due sentinelle che ti chiedono senza
            nessuna voglia di scherzare che cosa ci fai lì. Ti riaccompagnano su
            fino alla panca, e Tullio annota qualcosa nel registro senza alzare
            gli occhi.
          effetti: { sospetto: 1 }

      - testo: "Leggere il registro delle petizioni"
        descrizione: "Tullio annota tutto, e quando va a pranzo il registro resta aperto sul bancone."
        prova: { attributo: mentale, abilita: [accademiche, percezione], difficolta: Media }
        successo:
          titolo: La erre a margine
          testo: |
            Quando Tullio va a pranzo ti chini sul registro. Ogni petizione ha una
            riga con la data e il nome, e in fondo l'esito, *accolta* oppure
            *rinviata*, mentre quella di Ada ha soltanto una erre piccola a
            margine, come centinaia di altre, e sfogliando all'indietro le erre
            continuano per tre anni. Tullio ti trova lì quando torna, e invece di
            arrabbiarsi va a prendere una candela.
          pe: { accademiche: 5 }
          segue: la-cassa-dei-respinti
        fallimento:
          titolo: Su richiesta scritta
          testo: |
            Stai ancora cercando di capire che cosa voglia dire la lettera piccola
            a margine della riga di Ada quando Tullio rientra, con il pane avvolto
            nel fazzoletto. Chiude piano il registro con due dita e ti ricorda che
            i registri del Municipio si consultano su richiesta scritta, con i
            margini dritti e la firma in fondo, e lo dice senza ironia.
          effetti: { sospetto: 0.5 }

      - testo: "Aspettare la chiusura con Ada"
        descrizione: "Ada torna domani, e anche il giorno dopo. Puoi aspettare con lei sulla panca finché succede qualcosa."
        costo: 2
        esito:
          titolo: Fino alla chiusura
          testo: |
            Il giorno dopo aspetti con Ada sulla panca. Ti racconta della bambina
            caduta nel canale e di sua figlia, che è a servizio nei Quartieri Alti
            e la domenica le scrive le petizioni. All'ora di chiusura Tullio
            spegne le lampade una alla volta, vede che sei ancora lì e guarda la
            cassa sotto il bancone. Sospira a lungo, poi prende una candela e ti
            fa segno di seguirlo.
          pe: { empatia: 5 }
          segue: la-cassa-dei-respinti

  - id: la-cassa-dei-respinti
    immagine: ambientazione/quartieri-alti
    titolo: La cassa dei respinti
    tipo: seguito
    luogo: Municipio, il seminterrato
    area: quartieri-alti
    requisiti: [fazione.consiglio == 0]
    testo: |
      Il seminterrato del Municipio odora di carta umida e di sego. In fondo
      al corridoio c'è una stanza bassa senza finestre con le casse impilate
      fino al soffitto, una per ogni anno. Quella di quest'anno è aperta, e
      il foglio di Ada sta in cima.

      «Le petizioni vanno presentate in ordine» dice Tullio. «Lo diceva il
      Rappresentante di prima. La Rappresentante Castaldi legge tutto, e io
      non volevo farle perdere tempo con le macchie e con le croci.» Si
      rigira gli occhiali fra le dita. «Le tenevo da parte, in ordine, per
      anno. Pensavo che prima o poi qualcuno le avrebbe ricopiate bene.»

      Alla luce della candela apri il foglio di Ada, scritto nella grafia
      incerta di una ragazza che ha imparato tardi, e in fondo c'è il
      ponticello disegnato a penna, con una crocetta dove è caduta la
      bambina.

      {ingannare Difficile} Tullio dice la verità, anche a se stesso.
    opzioni:
      - testo: "Portare la cassa a Julia"
        descrizione: "La Rappresentante legge tutto, dice Tullio. Allora che legga anche questo."
        immagine: personaggi/julia-castaldi
        esito:
          titolo: Una notte di petizioni
          testo: |
            Porti la cassa su fino all'ufficio di Julia, con Tullio che ti fa
            luce. Julia la apre e alla seconda petizione dice a Tullio che
            domattina vuole sulla scrivania anche quelle degli anni prima. Il
            giorno dopo la panca è piena di gente della Città Bassa chiamata per
            nome, la prima è Ada, e Julia firma l'ordine per il ponticello, ma una
            settimana dopo le assi marce sono ancora lì.
          pe: { politica-ed-economia: 3 }
          imposta: { municipio.petizioni: 1 }
          effetti: { rep.castaldi: 1, fazione.consiglio: 1 }
      - testo: "Lasciare che sia Tullio a portarla su"
        descrizione: "L'errore è suo, e tocca a lui rimediare. Puoi stargli accanto mentre lo fa."
        esito:
          titolo: In ordine, per anno
          testo: |
            Dici a Tullio che la cassa deve portarla su lui, e lui resta zitto per
            un pezzo, poi se la carica in spalla. Esce dall'ufficio di Julia
            mezz'ora dopo con le orecchie rosse, e racconta come se non ci
            credesse che la Rappresentante l'ha ringraziato di avergliele tenute
            in ordine. Il ponticello di Ada è il primo ordine che Julia firma, e i
            falegnami si aspettano ancora.
          pe: { empatia: 3 }
          imposta: { municipio.petizioni: 1 }
          effetti: { rep.castaldi: 1, fazione.consiglio: 1 }
      - testo: "Ricopiare in bella la petizione di Ada"
        descrizione: "La cassa può aspettare, il ponticello no. Scritta bene, a Julia la petizione arriva lo stesso."
        esito:
          titolo: La bella copia
          testo: |
            Con un foglio di carta buona che Tullio ti allunga senza farsi vedere
            ricopi la petizione di Ada con i margini dritti, e in fondo ridisegni
            il ponticello con la crocetta. La mattina dopo sale nel cesto di
            vimini, e tre giorni più tardi al lavatoio arrivano due falegnami del
            Comune a mani vuote, perché le assi non sono arrivate nemmeno a loro.
            La cassa di quest'anno resta dov'era.
          pe: { accademiche: 3 }
          imposta: { municipio.petizioni: 1 }
          effetti: { rep.castaldi: 1, fazione.consiglio: 1 }

      - testo: "Parlarne a Julia a cena"
        descrizione: "A cena la tua famiglia siede vicino ai Castaldi, e lì una cassa di petizioni arriva più in alto."
        quando: [origine.rampollo-dei-quartieri-alti >= 1]
        esito:
          titolo: Fra il pesce e la frutta
          testo: |
            A una cena in Via del Velo Julia Castaldi siede di fronte a te, e fra il
            pesce e la frutta le racconti delle casse in archivio e del ponticello
            disegnato a penna. Julia posa la forchetta e non la riprende più. Il mattino
            dopo scende lei stessa nel seminterrato, e prima di mezzogiorno firma
            l'ordine per il ponticello, anche se i falegnami non si vedono ancora.
          pe: { galateo: 3 }
          imposta: { municipio.petizioni: 1 }
          effetti: { rep.castaldi: 1, fazione.consiglio: 1 }

  # ------------------------------------------------------------ storia a 4 · il ritratto
  - id: il-ritratto-della-rappresentante
    presso: municipio
    immagine: personaggi/marella-castaldi
    titolo: Il ritratto della Rappresentante
    sommario: "Il ritratto sopra la panca è caduto, e Marella Castaldi vuole un quadro nuovo."
    luogo: Municipio, l'anticamera
    area: quartieri-alti
    requisiti: [fazione.consiglio == 2]
    testo: |
      Stamattina sopra la panca c'è un rettangolo di muro più chiaro con un
      chiodo piegato in mezzo, e il ritratto è appoggiato alla panca con la
      cornice spaccata in un angolo. Chi arriva per le udienze ci gira
      intorno come intorno a un ferito.

      A reggerlo dritto c'è Ettore Castaldi, cugino della Rappresentante, un
      uomo robusto con la barba curata che alle dieci del mattino ha già
      l'alito dolce dell'idromele.

      Accanto a lui Marella Castaldi, vestita con sobrietà, detta una lettera
      a Tullio. «Mastro Fenzi ne dipinge uno nuovo in tre sedute. Il
      Municipio non può restare senza la faccia della sua Rappresentante.
      Tullio, scriva che bastano tre sedute, e che il quadro vecchio
      l'abbiamo tenuto anche troppo.»

      {origine rampollo-dei-quartieri-alti} Marella l'hai vista a più pranzi
      del Consiglio di quanti ne ricordi, sempre a correggere qualcuno con
      grande cortesia, e quando si volta il tuo cognome lo sa già.

      Dalla porta chiusa dell'ufficio arriva la voce roca di Julia. «Ho le
      udienze, Marella. Quello che c'era andava benissimo.»

      Nel quadro Julia ha i capelli lunghi fino alle spalle e una collana di
      perle, e sorride a qualcuno fuori dalla tela. Marella si volta verso di
      te e ti domanda se, visto che ci sei, hai un'idea migliore.
    opzioni:
      - testo: "Convincere Julia a posare"
        descrizione: "Tre sedute davanti a un pittore. Per farla sedere serve un argomento che lei rispetti."
        immagine: personaggi/julia-castaldi
        prova: { attributo: sociale, abilita: [persuasione, politica-ed-economia], difficolta: Media }
        successo:
          titolo: Un argomento
          testo: |
            Entri nell'ufficio e le dici che chi aspetta sulla panca passa ore a
            guardare quel quadro, e ha il diritto di sapere a chi chiede udienza.
            Julia posa la penna. «Questo è un argomento» dice, come se le costasse
            ammetterlo, ed esce in anticamera a guardare il ritratto da vicino,
            per la prima volta da anni.
          pe: { persuasione: 5 }
          segue: la-faccia-della-rappresentante
        fallimento:
          titolo: Gli argomenti di Marella
          testo: |
            Le dici che Marella ha ragione, e lei ti chiede in che cosa. Provi con
            la dignità del Municipio e poi con il buon nome della città, e a ogni
            frase la voce di Julia si fa più secca. «Sono argomenti di Marella, e
            lei li dice meglio» risponde alla fine, e chiama il nome seguente.
          effetti: { scandalo: 0.5 }

      - testo: "Rimettere in sesto la cornice con Ettore"
        descrizione: "Ettore un tempo reggeva uno scudo, e la colla fa presa in un'ora se qualcuno tiene gli angoli."
        immagine: personaggi/ettore-castaldi
        prova: { attributo: fisico, abilita: [resistenza, atletica], difficolta: Media }
        successo:
          titolo: Un'ora di colla
          testo: |
            Per un'ora tenete stretta la cornice in due, in ginocchio sul
            pavimento lucido, e le braccia tremano a te e non a Ettore, che da
            come la tiene non ha mai smesso di aspettarsi un colpo. A colla
            asciutta guarda il quadro con la testa inclinata. «Quando aveva
            vent'anni le somigliava. Poco anche allora» dice. Julia esce
            dall'ufficio a vedere perché in anticamera nessuno parla più.
          pe: { resistenza: 5 }
          segue: la-faccia-della-rappresentante
        fallimento:
          titolo: L'angolo che cede
          testo: |
            Verso la fine le braccia ti cedono, e l'angolo si riapre con uno
            schiocco che fa alzare mezza panca. Ettore riprende la cornice da solo
            senza fretta e ti dice a bassa voce che la prossima volta gli angoli
            li tiene lui, con tanta gentilezza che preferiresti uno schiaffo.

      - testo: "Chiedere a Ettore del quadro"
        descrizione: "Ettore parla poco e ascolta molto. Quando l'hanno dipinto c'era."
        immagine: personaggi/ettore-castaldi
        prova: { attributo: sociale, abilita: [empatia, galateo], difficolta: Media }
        successo:
          titolo: La miniatura
          testo: |
            Ettore ti fa sedere sulla panca accanto a lui, con il quadro fra le
            ginocchia. «Julia non ha mai posato. Il giorno che l'hanno eletta le
            mancava un'ora libera, e dopo le è mancata sempre. Marella ha dato al
            pittore una miniatura di quando lei aveva vent'anni, e il pittore ci
            ha messo del suo» dice, e indica le perle con un dito calloso. «Quelle
            sono di Marella.»
          pe: { empatia: 5 }
          segue: la-faccia-della-rappresentante
        fallimento:
          titolo: Di Stato, a tavola
          testo: |
            Ettore ti guarda con calma, come guarda un avventore che nella sua
            Birreria ha chiesto un bicchiere di troppo, e indica Marella con il
            mento. «Di Stato sì, dei Castaldi no. È la regola di casa» dice.
            Marella, che ha sentito, gli sorride con molta eleganza, ed Ettore
            torna a occuparsi della cornice.
          effetti: { scandalo: 0.5 }

      - testo: "Sederti sulla panca e aspettare"
        descrizione: "Prima o poi Julia deve uscire da quella stanza, se non altro per chiamare il nome seguente."
        costo: 2
        esito:
          titolo: L'ultimo nome
          testo: |
            Ti siedi sulla panca accanto al quadro e aspetti. Marella se ne va a
            metà mattina lasciando a Tullio una lista di pittori, ed Ettore poco
            dopo, verso la Città Bassa. A mezzogiorno Julia esce per chiamare
            l'ultimo nome, poi si ferma davanti al quadro, e capisci che anche lei
            ha aspettato che se ne andassero tutti.
          pe: { resilienza: 5 }
          segue: la-faccia-della-rappresentante

  - id: la-faccia-della-rappresentante
    immagine: personaggi/julia-castaldi
    titolo: La faccia della Rappresentante
    tipo: seguito
    luogo: Municipio, l'anticamera
    area: quartieri-alti
    requisiti: [fazione.consiglio == 2]
    testo: |
      Julia si ferma davanti al ritratto con le braccia conserte e lo guarda
      come guarda le pratiche, dall'alto in basso. Poi si accovaccia per
      vederlo meglio, e in anticamera nessuno gliel'aveva mai visto fare. «Le
      perle sono di Marella, i capelli lunghi invece li avevo davvero, fino al
      primo mese in Municipio» dice. «Una notte, mentre firmavo i conti dei
      dazi, una ciocca mi è finita nel calamaio, e la mattina dopo li ho
      tagliati con le forbici di Tullio.»

      {percezione Media} Sulla nuca c'è ancora un ciuffo che va per conto suo,
      perché le forbici di Tullio erano per la carta.

      «Da ragazza mi sedevo su questa panca ad aspettare mio padre, che veniva
      a chiedere le cose al Rappresentante di allora. Anche lui aveva un
      ritratto peggio di questo, e io lo guardavo per non contare le ore»
      dice, e passa un dito sulla crepa della cornice.

      {origine rampollo-dei-quartieri-alti} Nella tua famiglia nessuno ha mai
      aspettato su questa panca, perché il Rappresentante lo si invitava a
      cena.

      {empatia Media} Parla del quadro, e intanto parla di una bambina che
      contava le ore su questa panca e che adesso le fa contare agli altri.

      «Marella vuole un quadro nuovo, e Tullio vuole il muro pieno» dice Julia
      rialzandosi, «e tu che cosa ci metteresti?»
    opzioni:
      - testo: "Un ritratto nuovo, con le pratiche"
        descrizione: "Che la dipingano com'è adesso, con i capelli corti e una pila di pergamene sotto la mano."
        esito:
          titolo: Tre sedute
          testo: |
            Julia ci pensa il tempo di impilare due pergamene. «Le pratiche le
            porto io, così le leggo mentre lui dipinge» dice. Mastro Fenzi dipinge
            per tre mattine in un angolo dell'ufficio, e nel quadro nuovo Julia ha
            i capelli corti e la penna in mano, con una cifra sottolineata sul
            registro che il pittore ha copiato senza capirla. Marella lo trova
            severo, e Julia paga il pittore di tasca sua.
          pe: { espressivita: 5 }
          imposta: { municipio.ritratto: 1 }
          effetti: { rep.castaldi: 1 }
          segue: consiglio-scrivano-della-panca
      - testo: "Rimettere su quello vecchio"
        descrizione: "La gente della panca è abituata a quella faccia che sorride, e forse le serve più che a Julia."
        esito:
          titolo: Più ottimismo che somiglianza
          testo: |
            Le dici che chi aspetta sulla panca ha bisogno di una Rappresentante
            che sorride, almeno sul muro. «Allora resta lui» dice Julia, «e il
            sorriso lo lascio fare a lui, che gli riesce meglio.» Il giorno dopo
            il quadro torna al suo posto con la cornice incollata e un chiodo
            nuovo, e Tullio giura di aver visto Julia, una mattina presto,
            raddrizzarlo con un dito.
          pe: { empatia: 5 }
          imposta: { municipio.ritratto: 1 }
          effetti: { rep.castaldi: 1 }
          segue: consiglio-scrivano-della-panca
      - testo: "Niente ritratto"
        descrizione: "Il muro vuoto, e al posto del quadro qualcosa che serva a chi aspetta."
        esito:
          titolo: La lavagna
          testo: |
            «La lista delle udienze, scritta grande, che si legga dalla panca»
            dice Julia. «Così chi aspetta sa quanto gli manca, e guarda quella
            invece di me.» Il giorno dopo al posto del quadro c'è una lavagna
            nera, dove ogni mattina Tullio scrive i nomi con il gesso. Il ritratto
            va al Maniero, e sulla panca, da allora, qualcuno ha smesso di
            incidere tacche sullo schienale.
          pe: { politica-ed-economia: 5 }
          imposta: { municipio.ritratto: 1 }
          effetti: { rep.castaldi: 1 }
          segue: consiglio-scrivano-della-panca

  # ------------------------------------------------------------ storia a 6 · un incarico del Consiglio
  - id: un-incarico-del-consiglio
    presso: municipio
    immagine: personaggi/julia-castaldi
    titolo: Un incarico del Consiglio
    sommario: "Julia Castaldi ti riceve a porta chiusa e apre il registro del Consiglio a una pagina senza firme."
    luogo: Municipio, l'ufficio della Rappresentante
    area: quartieri-alti
    requisiti: [fazione.consiglio == 4]
    testo: |
      Julia ti riceve a porta chiusa. Sulla scrivania è aperto il registro
      del Consiglio, a una pagina dove ogni riga ha una data e nessuna ha una
      firma.

      «Sono le pratiche che il Consiglio rinvia» dice con la voce roca.
      «Basta che una scontenti un seggio, e gli altri la rimandano di mese in
      mese. Un pozzo conteso fra due cortili, una casa che un creditore vuole
      togliere a una vedova. Mi serve una persona che le sbrighi a nome mio,
      e che in Consiglio non abbia un seggio da difendere.»

      {origine mercante-dei-ponti} Sulla tua licenza c'è il sigillo della
      Gilda, che in Consiglio un seggio ce l'ha, e Julia ti ha fatto sedere
      lo stesso.

      Scrive il tuo nome a matita, piccolo, sul margine della pagina. «Prima
      di scriverlo a inchiostro ne voglio vedere sbrigata una. Scegli tu
      quale, e torna quando è chiusa.»
    opzioni:
      - testo: "La casa della vedova"
        descrizione: "La vedova di un miliziano morto nella razzia rischia la casa, e il creditore è un mercante della Gilda."
        requisiti: [pista.pelle < 7]
        prova: { attributo: sociale, abilita: [persuasione, politica-ed-economia], difficolta: Media }
        successo:
          titolo: Una dilazione
          testo: |
            Il creditore ha l'ufficio sui Ponti, sopra un magazzino di funi. Gli
            spieghi quanto costerebbe alla Gilda, in Consiglio, cacciare di casa
            la vedova di un miliziano caduto per la città, e lui fa i conti con te
            ad alta voce. Alla fine firma una dilazione di due anni senza
            interessi, e ti chiede di riferire alla Rappresentante che l'idea è
            stata sua.
          pe: { persuasione: 5 }
          segue: il-nome-sul-registro
        fallimento:
          titolo: Il magazzino di funi
          testo: |
            Il creditore ti lascia parlare quanto vuoi, poi tira fuori il
            contratto firmato dal miliziano due anni prima della razzia e ti
            mostra la clausola con l'unghia del mignolo, che tiene lunga apposta.
            Ha ragione lui, e lo sapete tutti e due. Julia rimette la pratica in
            fondo alla pila.
          effetti: { scandalo: 0.5 }

      - testo: "I taglialegna della cooperativa"
        descrizione: "I due capisquadra della cooperativa non si parlano, e il Comune non ha un soldo da metterci."
        requisiti: [pista.pelle >= 7]
        prova: { attributo: sociale, abilita: [empatia, intimidire], difficolta: Media }
        successo:
          titolo: Due turni
          testo: |
            Alla Segheria i due capisquadra stanno ai lati opposti del cortile,
            ognuno con la sua metà di uomini. Li fai sedere sullo stesso tronco
            finché non si accorgono di volere la stessa cosa, che nessuno dei due
            comandi l'altro, e finisce con un turno di mattina e uno di pomeriggio
            e la paga contata insieme il sabato. Si stringono la mano come se si
            scottassero.
          pe: { empatia: 5 }
          segue: il-nome-sul-registro
        fallimento:
          titolo: Il tronco
          testo: |
            Per un quarto d'ora va bene, poi uno dei capisquadra nomina un vecchio
            debito di birra e l'altro si alza di scatto, e in un momento mezzo
            cortile è in piedi con le asce in mano. Ne esci con la giubba piena di
            segatura e senza un accordo, e Julia rimette la pratica in fondo alla
            pila.
          effetti: { scandalo: 0.5 }

      - testo: "Il pozzo dei due cortili"
        descrizione: "Due cortili della Città Bassa si contendono un pozzo, e nell'archivio ci dev'essere scritto di chi è."
        prova: { attributo: mentale, abilita: [accademiche, percezione], difficolta: Media }
        successo:
          titolo: Il catasto vecchio
          testo: |
            Passi due giorni nell'archivio con Tullio che ti porta i registri del
            catasto, un anno alla volta, e alla fine lo trovi in un volume di
            quarant'anni fa, con un ragno secco fra le righe. Il pozzo l'hanno
            scavato insieme i nonni dei due cortili, e quando lo leggi in Città
            Bassa i cortili ascoltano in silenzio e poi si spartiscono i turni
            dell'acqua.
          pe: { accademiche: 5 }
          segue: il-nome-sul-registro
        fallimento:
          titolo: La polvere del catasto
          testo: |
            Nei registri del catasto trovi tre pozzi con quel nome in tre strade
            diverse, e scegli quello sbagliato. In Città Bassa i due cortili ti
            ascoltano leggere l'atto fino in fondo, poi ti fanno notare che quel
            pozzo sta due vicoli più in là. Julia rimette la pratica in fondo alla
            pila.
          effetti: { scandalo: 0.5 }

      - testo: "Raccogliere le firme del Consiglio in un giorno"
        descrizione: "Una pratica che tutti i seggi firmano entro sera passa senza seduta, se trovi i consiglieri in tempo."
        prova: { attributo: fisico, abilita: [resistenza, atletica], difficolta: Media }
        successo:
          titolo: Dall'alba al tramonto
          testo: |
            Esci all'alba con la pratica in una cartella di cuoio e attraversi
            tutta la città, dalla Cattedrale ai Ponti e giù fino ai sottoponti dei
            Raschiatori, raccogliendo le firme una alla volta sulle ginocchia di
            chi te le dà. Rientri in Municipio al tramonto con le gambe di legno,
            e Julia conta le firme col dito prima di tirare una riga sulla
            pratica.
          pe: { resistenza: 5 }
          segue: il-nome-sul-registro
        fallimento:
          titolo: L'ultima firma
          testo: |
            Corri da un seggio all'altro per tutta la città, e l'ultimo consigliere lo trovi quando ha appena
            chiuso la porta e non la riapre per nessuno, nemmeno quando bussi con il pugno. Rientri con una
            firma in meno e i piedi gonfi, e Julia ti ringrazia e rimette la pratica in fondo alla pila.

      - testo: "Leggere tutta la pila con lei"
        descrizione: "A leggerle tutte con calma, ogni tanto salta fuori una pratica che si chiude da sola."
        costo: 2
        esito:
          titolo: Fino a notte
          testo: |
            Leggi con lei una pratica dopo l'altra, mentre fuori le campane
            suonano le ore. Verso mezzanotte ne trovi una di due anni fa che
            chiede una cosa già fatta da mesi, e Julia ci tira sopra una riga
            sorridendo appena. Dopo quella ne saltano fuori altre uguali, e a
            notte fonda la pagina è più corta di un terzo e tu hai gli occhi che
            bruciano.
          pe: { politica-ed-economia: 5 }
          segue: il-nome-sul-registro

      - testo: "Dirle che non è il momento"
        descrizione: "Un incarico del Consiglio è un impegno. Julia detesta le perifrasi, e un no detto chiaro lo rispetta."
        costo: 0
        esito:
          titolo: A matita
          testo: |
            Le dici che per adesso non potresti garantirle il tempo che serve.
            Julia annuisce una volta sola e lascia il tuo nome a matita sul
            margine. «Detto chiaro» dice chiudendo il registro, «e a matita
            tenerlo costa poco. Resta lì finché non torni.» Poi chiama il nome
            seguente, e tu esci con la sensazione di aver lasciato qualcosa sulla
            sedia.

  - id: il-nome-sul-registro
    immagine: fazioni/consiglio-di-qir-azel
    titolo: Il nome sul registro
    tipo: seguito
    luogo: Municipio, l'ufficio della Rappresentante
    area: quartieri-alti
    requisiti: [fazione.consiglio == 4]
    testo: |
      Julia riapre il registro alla pagina del margine e intinge la penna, ma
      prima di scrivere ti guarda, e una goccia d'inchiostro le cade sul
      polsino senza che se ne accorga. «Chi è scritto qui a inchiostro parla
      a nome mio quando io non posso» dice. «Quello che fa lo firmo io, e se
      sbaglia ho sbagliato io. In Consiglio c'è chi aspetta soltanto questo,
      e io prima voglio sapere se sai guardare una seduta.»

      Dal cassetto tira fuori una lettera già scritta e piegata in tre, con
      il sigillo del Consiglio colato un po' di traverso, come lo mette
      sempre Tullio, e te la fa vedere senza dartela. Poi la rimette nel
      cassetto e lo lascia aperto di un dito.

      {politica-ed-economia Difficile} La lettera era sigillata prima ancora
      che tu chiudessi la pratica. Aveva deciso da un pezzo, e ha aspettato
      soltanto che lo decidessi anche tu.
    opzioni:
      - testo: "Accettare l'incarico"
        descrizione: "Il tuo nome sul registro, a matita per ora, e la lettera nel cassetto fino a giovedì."
        requisiti: [pista.pelle < 7]
        esito:
          titolo: A matita
          testo: |
            Le dici di sì, e Julia ripassa il tuo nome a matita perché si legga meglio.
            «La paga è a incarico, e le pratiche te le do io, una alla volta» dice.
            «Giovedì c'è seduta, e tu ti siedi in tribuna a guardare chi vota cosa.
            Dopo vieni a dirmelo.» Mentre esci Tullio ti saluta inforcando gli
            occhiali, come per vedere meglio chi sei diventato.
          imposta: { municipio.incarico: 1 }
          effetti: { rep.castaldi: 1, fazione.consiglio: 1 }
      - testo: "Accettare l'incarico"
        descrizione: "Il tuo nome sul registro, a matita per ora, e le casse del Comune vuote."
        requisiti: [pista.pelle >= 7]
        esito:
          titolo: Quando le casse si riempiono
          testo: |
            Le dici di sì, e Julia ripassa il tuo nome a matita perché si legga
            meglio. «Le casse sono vuote, e te lo dico adesso perché dopo mi
            piacerebbe meno» dice. «Gli incarichi te li pago quando posso, e le
            altre volte con quello che so. Giovedì c'è seduta, e tu siediti in
            tribuna a guardare chi vota cosa.» Tullio, dal bancone, ti saluta
            inforcando gli occhiali.
          imposta: { municipio.incarico: 1 }
          effetti: { rep.castaldi: 1, fazione.consiglio: 1 }
      - testo: "Rifiutare con garbo"
        descrizione: "Hai visto che cosa c'è su quella pagina. Per adesso preferisci restarne fuori."
        esito:
          titolo: La lettera nel cassetto
          testo: |
            Le dici che per adesso preferisci salire quelle scale soltanto per
            chiedere. Julia rimette la lettera nel cassetto, e il tuo nome a
            matita resta sul margine. «Se torni, la prova la rifai, perché le
            regole del Consiglio le hanno scritte prima di me e io le rispetto lo
            stesso» dice, riaprendo la prima pratica. Non sembra delusa, e la cosa
            ti brucia più di quanto avresti voluto.

  # ------------------------------------------------------------ la carta
  - id: carta-un-bando-del-consiglio
    immagine: fazioni/consiglio-di-qir-azel
    titolo: Un bando del Consiglio
    sommario: "Un garzone del Comune inchioda un bando al pilastro di Via del Velo, e qualcuno vorrebbe sapere cosa dice."
    luogo: Quartieri Alti, il pilastro dei bandi in Via del Velo
    tipo: carta
    area: quartieri-alti
    requisiti: [rep.castaldi < 2]
    testo: |
      Sul pilastro di pietra dei bandi, in fondo a Via del Velo, un ragazzo
      con la livrea del Comune sta inchiodando un foglio nuovo, con i chiodi
      in bocca e un martello troppo grande per lui.

      Una serva gli chiede che cosa dice il bando, e lui si toglie i chiodi
      di bocca per rispondere che il suo lavoro è attaccarli. Poi guarda te,
      e capisci che non sa leggere e si vergogna di chiedertelo.

      {origine figlio-della-citta-bassa} Nei vicoli chi non sapeva leggere
      annuiva per non farlo vedere, e il ragazzo annuisce nello stesso modo.
    opzioni:
      - testo: "Leggere il bando ad alta voce"
        descrizione: "Il ragazzo ti sarà grato, e la serva anche."
        requisiti: [pista.pelle < 7]
        esito:
          titolo: Dalla seconda campana
          testo: |
            Sali sul primo gradino e leggi. Il Municipio riceve ogni mattina dalla
            seconda campana, e la Rappresentante ascolta di persona le suppliche dei
            cittadini. In fondo gli impiegati cercano qualcuno che li aiuti con la
            coda, per una paga a mattina, e la serva dice che è poca, perché le paghe
            le conosce tutte. Il ragazzo si chiama Nino, e ti dice che al Municipio
            chiedono sempre di Tullio.
          effetti: { rep.castaldi: 0.5 }
      - testo: "Leggere il bando ad alta voce"
        descrizione: "Il ragazzo ti sarà grato, e la serva anche. Il foglio è pieno di parole nuove."
        requisiti: [pista.pelle >= 7]
        esito:
          titolo: Le licenze
          testo: |
            Leggi dal primo gradino. Chi macina o commercia grano deve presentarsi
            in Municipio per la licenza entro la fine del mese, e le cooperative
            del grano e dei taglialegna cercano soci. Gli impiegati cercano aiuto
            per la coda, con una paga che il Comune verserà appena potrà, e la
            serva ride tanto che le cade una cipolla. Il ragazzo si chiama Nino, e
            ti dice di chiedere di Tullio.
          effetti: { rep.castaldi: 0.5 }
      - testo: "Tenergli fermo il foglio"
        descrizione: "Con due mani in più il bando sta dritto. Quello che c'è scritto lo leggerai un'altra volta."
        esito:
          titolo: Quattro chiodi
          testo: |
            Tieni il foglio fermo con i palmi aperti mentre il ragazzo pianta un
            chiodo per angolo a colpi brevi e storti, e al terzo si schiaccia un
            dito e stringe i denti per orgoglio. Quando ha finito guarda il bando
            con le mani sui fianchi e ti spiega che Tullio i bandi li vuole
            dritti, poi corre verso la scalinata con il dito schiacciato in bocca.
          pe: { empatia: 2 }
      - testo: "Tirare dritto"
        descrizione: "I bandi del Consiglio dicono sempre le stesse cose, e oggi hai fretta."
        costo: 0
        esito:
          titolo: Il bando nel fango
          testo: |
            Alle tue spalle senti un colpo di martello e un'imprecazione
            soffocata, e quando ti volti il foglio è a terra in una pozzanghera.
            La serva lo raccoglie con due dita e lo riappende al chiodo a
            rovescio. Nessuno dei presenti sa leggere abbastanza da accorgersene.
