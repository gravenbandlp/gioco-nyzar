# La città viva, luogo 7: il Municipio (presso: municipio, area quartieri-alti).
# L'attività delle udienze del mattino, le tre storie della casata e la carta del bando.
# Le tre storie sono i passi 1, 3 e 5 della quest del Consiglio (contenuti/fazioni/consiglio/, pista
# fazione.consiglio): 1 le petizioni, con il seguito nel seminterrato (rep.castaldi >= 2, fazione.consiglio == 0);
# 3 il ritratto della Rappresentante, con il seguito davanti al quadro (fazione.consiglio == 2), che porta al
# seguito del grado in passi-1.yaml; 5 un incarico del Consiglio, con il seguito del nome sul registro
# (fazione.consiglio == 4), dove il nome resta a matita: l'inchiostro arriva al passo 6, dopo la tribuna. I flag
# municipio.petizioni, municipio.ritratto e municipio.incarico restano, perché altre scene li leggono.
# Reputazione: è quella della casata di Julia (rep.castaldi). Gli impiegati, le suppliche e i dazi la fanno
# salire fino a 4; le udienze piccole, le carte della seduta e la scorta di Quintus fino a 6 (sociale,
# mentale e fisico). Il Municipio non ha un servizio a pagamento: i servizi della casata si aprono con i gradi
# della quest (contenuti/fazioni/consiglio/servizi.yaml).
# Dopo pista.pelle >= 7 Julia fa le riforme (licenze, cooperative del grano e dei taglialegna) e le casse
# sono vuote: varianti nella supplica, nella panca, negli incarichi, nella prova della storia a 6 e nel bando.
# Nomi nuovi: Tullio Merga (il primo impiegato), Ada Rusca (lavandaia della Città Bassa), Mastro Fenzi (il
# pittore, solo nominato), Nino (il garzone che affigge i bandi).
storylet:
  # ------------------------------------------------------------ l'attività ripetibile
  - id: le-udienze-del-mattino
    presso: municipio
    immagine: ambientazione/quartieri-alti
    titolo: Le udienze del mattino
    sommario: "Il Municipio riceve dalla seconda campana, un nome alla volta, e sulla panca dell'anticamera c'è sempre più gente di quanta la mattina ne possa smaltire."
    luogo: Municipio, l'anticamera
    area: quartieri-alti
    ripetibile: true
    testo: |
      Il Municipio apre le porte alla seconda campana del mattino, e a
      quell'ora sulla scalinata c'è già la coda. Al piano di sopra
      l'anticamera è una sala lunga con il soffitto a cassettoni, e nel mezzo
      c'è la panca di legno, consumata dalle attese fino a diventare lucida
      come un corrimano. Sullo schienale qualcuno ha inciso con la punta di un
      coltello una tacca per ogni ora passata ad aspettare, e si è fermato a
      ventitré.

      {resistenza Media fallita} La schiena ha già capito che cosa l'aspetta
      e comincia a protestare in anticipo, prima ancora che tu ti sia
      seduto.

      In fondo alla sala gli impiegati siedono dietro un bancone lungo, con i
      registri aperti davanti e un calamaio in comune. Chiamano un nome alla
      volta da una lista. Il primo impiegato si chiama Tullio Merga, porta gli
      occhiali appesi a una cordicella intorno al collo e li inforca soltanto
      per leggere i nomi difficili. Sotto di lui c'è un cuscino ricamato, e
      sulla panca nessuno ne ha uno.

      {politica-ed-economia Media} Un calamaio in comune e un cuscino solo.
      In questa sala il potere si misura in comodità, e Tullio ne ha
      esattamente un cuscino più degli altri.

      La porta dell'ufficio della Rappresentante resta chiusa per quasi tutta
      la mattina. Ogni tanto si apre, e Julia Castaldi in persona chiama il
      nome seguente con la sua voce roca, senza alzarla, perché tanto la
      sentono tutti. Ti siedi sul bordo della panca, e il legno è ancora
      tiepido di chi c'era prima. *Chissà se alla ventiquattresima tacca
      l'hanno ricevuto.* Accanto a te un uomo si toglie il cappello e se lo
      rimette, a ogni nome che non è il suo.
    opzioni:
      - testo: "Dare una mano agli impiegati"
        descrizione: "Tullio Merga ha più nomi sulla lista che ore nella mattina, e chi sa smistare la gente gli fa comodo."
        requisiti: [rep.castaldi < 2]
        prova: { attributo: sociale, abilita: [galateo, politica-ed-economia], difficolta: Media }
        successo:
          titolo: La lista di Tullio
          testo: |
            Tullio ti mette in mano la lista e ti chiede di dividere la coda
            per faccende, da una parte i dazi e dall'altra le liti fra vicini.
            Passi lungo la panca a chiedere sottovoce a ciascuno che cosa lo
            porta qui. Chi si è già lamentato due volte lo metti in cima alla
            lista, perché non arrivi alla terza. A mezzogiorno la panca è vuota
            per la prima volta da settimane, e si vede che al centro il legno è
            più chiaro, dove si siedono tutti. Tullio inforca gli occhiali per guardarti meglio e ti
            allunga uno spicciolo.
          effetti: { monete: 1, rep.castaldi: 0.5 }
        fallimento:
          titolo: Il mugnaio e la vedova
          testo: |
            Smisti la coda per faccende, e metti un mugnaio con una lite di
            confine davanti a una vedova che aspetta dall'alba. La vedova se ne
            accorge e lo fa sapere a tutta la sala, con una voce che arriva
            fino all'ufficio della Rappresentante. Tullio deve uscire da dietro
            il bancone a calmarla, e quando torna si riprende la lista senza
            una parola. Ti lascia il posto in fondo alla panca, quello vicino
            allo spiffero.

            {galateo Facile fallita} Una vedova che aspetta dall'alba viene
            prima di un mugnaio. Lo sapevi, lo sa chiunque abbia avuto una
            nonna, e te ne sei ricordato troppo tardi.

      - testo: "Tenere la lista al posto di Tullio"
        descrizione: "Ormai Tullio ti lascia la lista e la penna, e va a prendersi il caffè che di solito non ha il tempo di bere."
        requisiti: [rep.castaldi >= 2, rep.castaldi < 4]
        prova: { attributo: sociale, abilita: [galateo, politica-ed-economia], difficolta: Media }
        successo:
          titolo: I nomi difficili
          testo: |
            Tieni la lista per tutta la mattina e chiami i nomi dal bancone,
            anche quelli per cui Tullio inforca gli occhiali. A un mercante di
            Laresh che vuole passare avanti spieghi con garbo che la
            Rappresentante riceve per ordine di arrivo, e lui torna a sedersi.
            Quando Julia apre la porta, il nome seguente è già pronto. Tullio
            rientra con il caffè freddo e ti dà la paga del turno. «In ordine»
            dice, e lo ripete guardando la panca, con la soddisfazione di un
            uomo che vede il proprio giardino potato da un altro.
          effetti: { monete: 2, rep.castaldi: 0.5 }
        fallimento:
          titolo: Un nome storpiato
          testo: |
            Chiami i nomi dal bancone per tutta la mattina, e verso mezzogiorno
            ne storpi uno, quello di un consigliere della Gilda venuto per una
            faccenda privata. Lui si alza con molta calma e ti corregge davanti
            a tutta la panca sillaba per sillaba, e a ogni sillaba ti senti il
            collo più caldo. Tullio torna con il caffè, capisce dal silenzio
            della sala che cosa è successo e si riprende la penna con due dita.

      - testo: "Portare la supplica di una fornaia"
        descrizione: "Una fornaia della Città Bassa ha il pane nel forno e non può aspettare il suo turno. La supplica te la lascia in mano."
        requisiti: [rep.castaldi < 4, pista.pelle < 7]
        prova: { attributo: sociale, abilita: [persuasione, empatia], difficolta: Media }
        successo:
          titolo: Il prezzo della farina
          testo: |
            La supplica è scritta male e dice una cosa sola, che un sacco di
            farina costa un terzo più dell'anno scorso e che la fornaia non sa
            più a quanto vendere il pane. Quando Julia apre la porta le chiedi
            un minuto e glielo spieghi tu, con le cifre che la donna ti ha
            ripetuto tre volte sulla scalinata. Julia scrive la cifra sul
            registro del Consiglio e la sottolinea. «La porto in seduta» dice,
            «però dille che non le prometto niente, perché i mulini sono tutti
            dello stesso padrone.»

            {politica-ed-economia Media} Un padrone solo per tutti i mulini, e
            la farina sale di un terzo in un anno. Julia lo sa da prima che tu
            entrassi, e adesso ha una cifra da mettergli davanti.
          effetti: { rep.castaldi: 0.5 }
        fallimento:
          titolo: Il forno e la farina
          testo: |
            Quando Julia apre la porta le chiedi un minuto, e cominci dal forno
            della fornaia invece che dalla farina. Julia ti lascia parlare fino
            in fondo, poi ti chiede quanto costa un sacco adesso e quanto
            costava un anno fa, e tu non lo sai. «Torna quando hai le cifre»
            dice, e chiama il nome seguente. Sulla scalinata la fornaia si
            riprende la supplica senza guardarti, e corre giù verso il pane con
            il grembiule che le sbatte sulle ginocchia.

      - testo: "Portare la supplica di una madre"
        descrizione: "Una donna della Città Bassa sale per la terza volta a chiedere delle sue finestre. Ha un bambino in braccio e la supplica in tasca."
        requisiti: [rep.castaldi < 4, pista.pelle >= 7]
        prova: { attributo: sociale, abilita: [persuasione, empatia], difficolta: Media }
        successo:
          titolo: Le assi alle finestre
          testo: |
            La supplica gliel'ha scritta uno scrivano pubblico, e racconta che
            la notte della Pignatta le hanno sfondato le finestre e che da
            allora ci tiene inchiodate delle assi. Quando Julia apre la porta
            glielo racconti tu, con il bambino che intanto ti tira la manica e
            ti sbava sul polsino con grande impegno.
            Julia ti dice che le casse sono vuote, e mentre lo dice scrive il
            nome della donna su un foglio a parte. «Le assi buone gliele manda
            la cooperativa dei taglialegna» dice, «e il vetro quando le casse si
            riempiono.»
          effetti: { rep.castaldi: 0.5 }
        fallimento:
          titolo: La strada sbagliata
          testo: |
            Racconti a Julia la storia delle finestre, e lei ti chiede in quale
            strada abita la donna. Tu non lo sai, e la donna è scesa nell'atrio
            a cambiare il bambino. Julia ti risponde che le casse sono vuote, e
            che senza una strada non saprebbe nemmeno dove mandare a dire di
            no. Sulla scalinata trovi la madre seduta su un gradino, con la
            supplica ancora in tasca e il bambino addormentato.

            {empatia Media} Com'è andata non te lo chiede. Te lo legge in faccia e
            sposta il bambino sull'altra spalla, come si fa con un peso che si
            porta da tanto.

      - testo: "Controllare i conti di un dazio"
        descrizione: "Ogni mese la Gilda manda al Consiglio il conto dei dazi dei Ponti, e qualcuno deve rifare le somme prima che le legga Julia."
        requisiti: [rep.castaldi < 4]
        prova: { attributo: mentale, abilita: [accademiche, politica-ed-economia], difficolta: Media }
        successo:
          titolo: La colonna di destra
          testo: |
            Ti danno un tavolino sotto la finestra e il conto dei dazi del
            Ponte delle Mille Corde, tre fogli fitti con la firma di un
            esattore della Gilda in fondo. Rifai le somme colonna per colonna.
            Al secondo foglio ne trovi una che torna con qualche moneta in meno,
            a favore della Gilda. Julia guarda la riga che hai segnato e ci
            scrive accanto la cifra giusta, sottolineata due volte. Tullio ti
            paga la mattinata e sospira, perché adesso alla Gilda dovrà
            scrivere lui.

            {accademiche Facile} Qualche moneta in meno, ogni mese, su ogni
            ponte. Gli esattori bravi sbagliano sempre di poco e sempre dalla
            stessa parte.
          effetti: { monete: 3, rep.castaldi: 0.5 }
        fallimento:
          titolo: Il riporto
          testo: |
            Rifai le somme del conto dei dazi colonna per colonna, e alla terza
            trovi un ammanco nel totale. Lo segni con un certo orgoglio e
            porti il foglio a Tullio. Lui lo rifà a mente con gli occhiali sul
            naso, e ti mostra che l'errore l'hai fatto tu sbagliando un
            riporto. L'orgoglio ti scende dalle guance un po' alla volta. Ti
            paga uno spicciolo per il tempo, e il foglio lo ricopia da capo con
            la sua grafia minuta.
          effetti: { monete: 1 }

      - testo: "Ricevere le udienze piccole"
        descrizione: "Julia è chiusa in seduta fino a sera, e le faccende minute le può sbrigare qualcuno di cui si fida."
        requisiti: [rep.castaldi >= 4, rep.castaldi < 6]
        prova: { attributo: sociale, abilita: [galateo, persuasione], difficolta: Media }
        successo:
          titolo: Le udienze piccole
          testo: |
            Ti siedi al tavolino dell'anticamera con il registro delle udienze
            aperto, e la panca ti passa davanti un nome alla volta. Un
            carrettiere è stato multato due volte per la stessa ruota, e due
            vicini litigano per un muro che nessuno dei due ha costruito. A
            ciascuno dai una risposta oppure una data, e scrivi tutto nel
            registro. A metà pomeriggio ti accorgi che stai anche tu inforcando
            occhiali che non hai. La sera Julia sfoglia il registro in piedi, ne
            corregge una riga sola e ti paga la giornata.
          effetti: { monete: 4, rep.castaldi: 0.5 }
        fallimento:
          titolo: Il muro di nessuno
          testo: |
            Ti siedi al tavolino con il registro delle udienze aperto. Al terzo
            nome ti arrivano davanti due vicini che litigano per un muro, e tu
            dai ragione al primo che parla. Il secondo si mette a gridare, e
            Tullio deve chiamare le sentinelle della scalinata per separarli.
            La sera Julia legge il registro e ti dice che quel muro andrà a
            vederlo lei, di persona. Ti paga metà della giornata e richiude il
            registro.

            {rissa Facile} Il secondo vicino alzava la voce, ma teneva le mani
            dietro la schiena. Al massimo si sarebbero spinti un poco, e le
            sentinelle lo sapevano anche loro.
          effetti: { monete: 2 }

      - testo: "Preparare le carte per la seduta"
        descrizione: "Prima di ogni seduta Julia legge tutte le pratiche. Da un po' chiede a te di leggerle per primo e di scrivere in fondo che cosa ne pensi."
        requisiti: [rep.castaldi >= 4, rep.castaldi < 6]
        prova: { attributo: mentale, abilita: [politica-ed-economia, accademiche], difficolta: Difficile }
        successo:
          titolo: In fondo alla pratica
          testo: |
            Passi il pomeriggio nell'ufficio di Julia con le pratiche della
            seduta, e in fondo a ciascuna scrivi in tre righe che cosa chiede e
            chi ci guadagna. Lei lavora dall'altra parte della scrivania e non
            ti interrompe mai. La sera impila le pratiche con gli angoli pari e
            ne rilegge una sola, quella dove hai scritto che i conti non
            tornano, e ti accorgi di avere le dita intrecciate sotto la scrivania finché
            non posa il foglio. «Hai ragione, e domani lo dico in Consiglio» dice. Prima di
            pagarti conta le monete dalla cassetta di ferro e le impila sulla
            scrivania, con i bordi pari come le pratiche.
          effetti: { monete: 5, rep.castaldi: 0.5 }
        fallimento:
          titolo: La colonna sbagliata
          testo: |
            In fondo a una pratica sui ponti scrivi che il conto non torna, e la
            seduta di Julia comincia da lì. Il consigliere della Gilda impiega
            un quarto d'ora a dimostrare che il conto tornava benissimo e che
            avevi letto la colonna sbagliata. Julia te lo racconta la sera,
            senza alzare la voce, mentre impila le pratiche. Ti paga lo stesso
            perché il lavoro l'hai fatto, e la prossima volta le rilegge lei.

            {politica-ed-economia Difficile fallita} Ti eri convinto che la
            Gilda sbagliasse i conti per abitudine. Invece li sbaglia soltanto
            quando ha deciso di farlo, e quella volta non l'aveva deciso.
          effetti: { monete: 2 }

      - testo: "Camminare con la scorta di Quintus Vael"
        descrizione: "Quando Julia scende dal Maniero al Municipio, il percorso lo decide Quintus Vael. Stamattina gli manca un uomo."
        immagine: personaggi/quintus-vael
        requisiti: [rep.castaldi >= 4, rep.castaldi < 6]
        prova: { attributo: fisico, abilita: [resistenza, atletica], difficolta: Media }
        successo:
          titolo: Ogni giorno un'altra strada
          testo: |
            Quintus Vael ti mette due passi dietro la Rappresentante e ti dice
            di tenere gli occhi sulle finestre. Prendete la via lunga, quella
            che gira dietro la Casa dei Nodi, e a ogni incrocio Quintus si ferma
            mezzo passo prima di Julia. Lei cammina leggendo una pratica e non
            alza mai la testa. A te dopo la terza strada tirano i polpacci e ti
            bruciano gli occhi a forza di contare finestre. Sulla scalinata del
            Municipio Quintus ti fa un cenno con il mento, e la cicatrice gli si
            tende. «Domani si cambia
            strada» dice, «perché qui si cambia strada ogni giorno.»
          effetti: { monete: 3, rep.castaldi: 0.5 }
        fallimento:
          titolo: Il carro di fieno
          testo: |
            Quintus ti mette dietro la Rappresentante e ti dice di tenere gli
            occhi sulle finestre. A metà strada un carro di fieno sbuca da un
            vicolo, e tu resti a guardarlo invece di metterti in mezzo. Quintus
            lo fa al posto tuo, con il braccio teso e la mano sull'elsa. Julia
            non alza nemmeno la testa dalla pratica. In cima alla scalinata
            Quintus ti spiega che un carro di fieno nasconde bene un uomo
            armato, e che domattina gli uomini li sceglie lui.

            {armi-da-mischia Media} La mano di Quintus non ha estratto. È rimasta
            sull'elsa senza muoversi, e bastava quella per dire al carrettiere
            quanto vicino era arrivato.
          effetti: { monete: 1 }

      - testo: "Sbrigare un incarico del Consiglio"
        descrizione: "Nel registro c'è il tuo nome, e accanto le faccende che il Consiglio rinvia da mesi. Julia te ne affida una alla volta."
        immagine: fazioni/consiglio-di-qir-azel
        requisiti: [municipio.incarico >= 1, pista.pelle < 7]
        prova: { attributo: sociale, abilita: [persuasione, politica-ed-economia], difficolta: Media }
        successo:
          titolo: Una riga in meno
          testo: |
            L'incarico di oggi è un forno comune della Città Bassa che due
            vicoli si contendono da un anno. Ci scendi con la lettera del
            Consiglio in tasca e metti le due famiglie davanti alla bocca del
            forno finché non si accordano sui turni del pane, la mattina ai
            primi e il pomeriggio agli altri. La più vecchia dei due vicoli
            scrive l'accordo con il carbone sul muro, e ci disegna sotto una
            pagnotta perché i nipoti che non sanno leggere capiscano lo stesso.
            Julia tira una riga dritta sulla pratica e ti paga l'incarico.
          effetti: { monete: 8 }
        fallimento:
          titolo: Le pagnotte bruciate
          testo: |
            Ci scendi con la lettera del Consiglio in tasca e metti le due
            famiglie davanti alla bocca del forno comune. Mezz'ora dopo stanno
            ancora discutendo di chi ha bruciato le pagnotte dell'altro tre
            inverni fa, e alla fine se ne vanno ognuno dalla sua parte. Julia
            rimette la pratica in fondo alla pila e ti paga la giornata lo
            stesso, perché la giornata, dice, l'hai persa per il Consiglio.

            {persuasione Media fallita} Avevi un argomento per i turni del pane.
            Per le pagnotte di tre inverni fa ti mancava un argomento, e quelle
            bruciano ancora.
          effetti: { monete: 4 }

      - testo: "Sbrigare un incarico del Consiglio"
        descrizione: "Con le casse vuote Julia paga gli incarichi tardi, e qualche volta in notizie."
        immagine: fazioni/consiglio-di-qir-azel
        requisiti: [municipio.incarico >= 1, pista.pelle >= 7]
        prova: { attributo: mentale, abilita: [politica-ed-economia, accademiche], difficolta: Media }
        successo:
          titolo: Il registro del mulino
          testo: |
            L'incarico di oggi è la cooperativa del grano, che ha rilevato il
            Mulino Malgrani e non ha ancora imparato a tenere un registro.
            Passi la giornata al mulino a insegnare a un mugnaio con le mani
            infarinate come si scrive un'uscita e come si chiude una pagina, e
            alla fine la farina ce l'hai anche tu fin dentro le ciglia. A sera i
            conti tornano. Julia ti paga una parte della giornata, e al posto
            del resto ti racconta chi in Consiglio sta già trattando per i
            seggi vuoti.
          effetti: { monete: 4, informazioni.pettegolezzo: 1 }
        fallimento:
          titolo: La farina sul registro
          testo: |
            Passi la giornata al mulino della cooperativa a insegnare a un
            mugnaio come si tiene un registro. Lui annuisce a tutto, e la sera
            scopri che ha scritto le uscite nella colonna delle entrate per
            tutto il mese. Rifate i conti insieme fino al buio, con la farina
            che si posa sulla pagina e si impasta con l'inchiostro. Julia ti
            paga qualcosa e ti chiede di tornarci la settimana prossima.
          effetti: { monete: 2 }

      - testo: "Aspettare sulla panca e ascoltare"
        descrizione: "Sulla panca si aspetta a lungo, e chi aspetta parla."
        requisiti: [pista.pelle < 7]
        esito:
          titolo: Le voci della panca
          testo: |
            Ti siedi fra un carrettiere e una signora dei Quartieri Alti con un
            cane piccolo in grembo, e aspetti un turno che non hai chiesto. Il
            carrettiere racconta che la farina è salita ancora. La signora gli
            risponde che ai Malgrani la farina non manca mai, e lo dice a voce
            così bassa che il cane alza le orecchie. Poi Tullio chiama un nome,
            e il carrettiere si alza sistemandosi il cappello.

            {conoscenze-della-strada Media} Quando la farina sale e a una sola
            famiglia non manca mai, di solito è quella famiglia a decidere
            quanto sale. La signora lo sa, e ha abbassato la voce per non
            doverlo dire.
          pe: { politica-ed-economia: 2 }

      - testo: "Aspettare sulla panca e ascoltare"
        descrizione: "Adesso sulla panca ci sono soprattutto mugnai e taglialegna, venuti per le licenze nuove."
        requisiti: [pista.pelle >= 7]
        esito:
          titolo: Le licenze nuove
          testo: |
            Ti siedi fra due taglialegna con il cappello in mano e un mugnaio
            che ripassa a mezza voce le domande della licenza. I taglialegna
            discutono di chi deve fare il caposquadra alla Segheria, adesso che
            è della cooperativa, e non si mettono d'accordo nemmeno sul modo di
            votare. Il mugnaio ti chiede se sai quanto si paga di tassa sulla
            macinatura, e quando gli dici di no si tranquillizza, contento di
            non essere l'unico a non saperlo.
          pe: { politica-ed-economia: 2 }

      - testo: "Farti chiamare per primo"
        descrizione: "Tullio Merga conosce il tuo cognome, e alla tua famiglia la panca non l'ha mai fatta fare nessuno."
        quando: [origine.rampollo-dei-quartieri-alti >= 1]
        esito:
          titolo: Il cognome
          testo: |
            Tullio inforca gli occhiali per leggere il tuo nome sulla lista, che pure
            è un nome facile, e lo chiama per primo. L'uomo con il cappello accanto a
            te se lo toglie e non se lo rimette. Al bancone Tullio ti chiede notizie
            di tua madre, e mentre gli rispondi un consigliere che ti ha visto
            crescere si ferma a salutarti e ti racconta, a voce bassa, quello che il
            Consiglio deciderà la settimana prossima. Quando torni verso le scale,
            dalla panca ti guardano passare tutti, e ti accorgi di camminare più in
            fretta del solito.

            {galateo Facile} Nessuno ti ha chiesto niente, perché a questo
            serve un cognome. Le ventitré tacche sullo schienale, intanto, sono
            rimaste ventitré.
          effetti: { informazioni.voce: 1 }

  # ------------------------------------------------------------ storia a 2 · le petizioni
  - id: le-petizioni
    presso: municipio
    immagine: ambientazione/quartieri-alti
    titolo: Le petizioni
    sommario: "Una lavandaia della Città Bassa sale in Municipio per la terza volta con la stessa petizione. Tullio le risponde che è in esame, come le altre due volte."
    luogo: Municipio, il bancone degli impiegati
    area: quartieri-alti
    requisiti: [rep.castaldi >= 2, fazione.consiglio == 0, pista.capomozzo >= 10]
    testo: |
      La donna in fondo alla panca l'hai già vista due volte, sempre nello
      stesso posto, sotto lo spiffero. È una lavandaia della Città Bassa,
      Ada Rusca, con le maniche rimboccate sopra i gomiti e le mani arrossate
      dall'acqua del lavatoio, e tiene sulle ginocchia un foglio piegato in
      quattro. Quando Tullio Merga chiama l'ultimo nome della mattina, che è
      di un altro, Ada si alza lo stesso per andare al bancone.

      {origine figlio-della-citta-bassa} Il foglio piegato in quattro lo
      conosci. Nei vicoli le carte per il Comune si tengono in tasca piegate
      così, e si riaprono soltanto davanti a chi deve leggerle, finché non si
      consumano sulle pieghe.

      «Sono tre mesi» dice. «Davanti al lavatoio c'è un ponticello di assi
      sopra il canale di scolo, e le assi sono marce. Ci è caduta dentro una
      bambina, e l'abbiamo tirata fuori per i capelli.» Tullio inforca gli
      occhiali e cerca nel registro, poi le risponde che la sua petizione è
      in esame. Lo dice gentilmente, come le altre due volte.

      {empatia Media} Ada non si arrabbia perché la rabbia l'ha finita alla
      seconda volta. Adesso torna per la bambina, e un po' per non darla
      vinta alla panca.

      Ada se ne va senza discutere, e il foglio piegato in quattro resta sul
      bancone. Tullio prende i fogli arrivati in
      mattinata e li divide in due mucchi. Quelli scritti bene, che hanno il
      sigillo e i margini dritti, vanno nel cesto di vimini che il garzone
      porta nell'ufficio della Rappresentante. Gli altri, con le macchie
      d'inchiostro e le croci al posto delle firme, finiscono in una cassa
      sotto il bancone. Ti ritrovi a guardare la cassa più a lungo del cesto. *Il cesto sale al piano di
      sopra, e la cassa invece scende.* A fine mattina il garzone si carica
      la cassa in spalla e prende le scale verso il seminterrato.

      {percezione Facile} Il foglio di Ada aveva i margini storti e
      un'impronta di pollice bagnato nell'angolo. Lo hai visto finire nella
      cassa senza che Tullio lo riaprisse.
    opzioni:
      - testo: "Chiedere a Tullio dove va la cassa"
        descrizione: "Tullio è un uomo gentile e ordinato, e gli uomini ordinati rispondono volentieri a chi chiede con garbo."
        prova: { attributo: sociale, abilita: [galateo, persuasione], difficolta: Media }
        successo:
          titolo: In archivio
          testo: |
            Aspetti che la panca si svuoti e gli chiedi della cassa con il tono
            che useresti per il tempo. Tullio si toglie gli occhiali e li
            pulisce sulla manica. «In archivio» dice, «in ordine, per anno.» Gli
            chiedi se la Rappresentante le legge, e lui resta con gli occhiali
            in mano, come se nessuno gliel'avesse mai domandato. Poi prende una
            candela dal cassetto e ti fa segno di seguirlo giù per le scale.

            {empatia Media} Non ha mai pensato di fare qualcosa di male. Lo
            sta pensando adesso, per la prima volta, e gli costa più fatica
            delle scale.
          pe: { galateo: 5 }
          segue: la-cassa-dei-respinti
        fallimento:
          titolo: Davanti al pubblico
          testo: |
            Gli chiedi della cassa mentre la panca è ancora mezza piena, e
            Tullio arrossisce fino alle orecchie. Ti risponde a voce alta che le
            petizioni del Municipio seguono la procedura, e che la procedura
            non si discute davanti al pubblico. Da quel momento ti chiama per
            cognome e ti fa aspettare in fondo alla panca, sotto lo spiffero,
            accanto al posto di Ada, dove l'aria fredda ti entra nel colletto.
          effetti: { scandalo: 0.5 }

      - testo: "Seguire il garzone con la cassa"
        descrizione: "Il garzone scende le scale con la cassa in spalla. Sotto c'è la banca cittadina, e il seminterrato ha le sue sentinelle."
        prova: { attributo: fisico, abilita: [furtivita, atletica], difficolta: Media }
        successo:
          titolo: La porta bassa
          testo: |
            Lasci che il garzone prenda un po' di vantaggio e scendi dietro di
            lui rasente al muro. In fondo alle scale le sentinelle guardano
            soltanto la grata della banca. Il garzone gira dall'altra parte,
            verso una porta bassa senza guardia, e ne esce a mani vuote
            fischiettando. Dentro ci sono casse impilate fino al soffitto, con
            l'anno scritto col gesso sul coperchio. Ti infili dentro anche tu, e
            stai ancora leggendo le date quando alle tue spalle si accende una
            candela, e a tenerla in mano c'è Tullio.

            {furtivita Media} Le sentinelle guardano la grata e basta. Quello
            che sta dall'altra parte del corridoio, per loro, non vale niente.
          pe: { furtivita: 5 }
          segue: la-cassa-dei-respinti
        fallimento:
          titolo: La grata della banca
          testo: |
            Scendi dietro il garzone tenendoti al muro, e in fondo alle scale
            sbagli corridoio. Ti ritrovi davanti alla grata della banca
            cittadina, con due sentinelle che ti chiedono che cosa ci fai lì
            senza nessuna voglia di scherzare. La spiegazione che dai non convince
            nemmeno te. Ti riaccompagnano su
            per le scale fino alla panca, e Tullio annota qualcosa nel registro
            senza alzare gli occhi.
          effetti: { sospetto: 1 }

      - testo: "Leggere il registro delle petizioni"
        descrizione: "Tullio annota tutto, anche quello che poi non legge nessuno. Quando va a pranzo il registro resta aperto sul bancone."
        prova: { attributo: mentale, abilita: [accademiche, percezione], difficolta: Media }
        successo:
          titolo: La erre a margine
          testo: |
            Quando Tullio va a pranzo ti chini sul registro. Ogni petizione ha
            la sua riga con la data e il nome, e in fondo l'esito, che di
            solito è *accolta* oppure *rinviata*. Quella di Ada ha soltanto una
            erre piccola a margine. Ce ne sono centinaia come la sua, quasi
            sempre di gente della Città Bassa e mai con un esito, e sfogliando
            all'indietro le erre continuano per tre anni. Tullio ti trova lì
            quando torna, con il pane ancora in mano, e invece di arrabbiarsi
            va a prendere una candela.

            {accademiche Media} Erre come respinta oppure come rimandata a
            mai. Una lettera sola per tre anni di gente, e nessuno
            ha mai chiesto quale delle due.
          pe: { accademiche: 5 }
          segue: la-cassa-dei-respinti
        fallimento:
          titolo: Su richiesta scritta
          testo: |
            Ti chini sul registro mentre Tullio è a pranzo e trovi la riga di
            Ada. Stai ancora cercando di capire che cosa voglia dire la lettera
            piccola a margine quando Tullio rientra, con il pane avvolto nel
            fazzoletto. Chiude piano il registro con due dita e ti ricorda che
            i registri del Municipio si consultano su richiesta scritta, con i
            margini dritti e la firma in fondo. Lo dice senza ironia, e questo è
            quasi peggio.
          effetti: { sospetto: 0.5 }

      - testo: "Aspettare la chiusura con Ada"
        descrizione: "Ada torna domani, e anche il giorno dopo. Puoi aspettare con lei sulla panca finché succede qualcosa."
        costo: 2
        esito:
          titolo: Fino alla chiusura
          testo: |
            Il giorno dopo ti siedi accanto ad Ada e aspetti con lei. Ti
            racconta della bambina caduta nel canale, e poi di sua figlia, che
            è a servizio nei Quartieri Alti e la domenica le scrive le
            petizioni. Il pomeriggio passa lento, e la panca ti lascia sulle
            cosce il segno delle sue venature. All'ora di chiusura Tullio
            spegne le lampade una alla volta, si accorge che sei ancora lì e
            guarda la cassa sotto il bancone. Sospira a lungo, poi prende una
            candela e ti fa segno di seguirlo.
          pe: { empatia: 5 }
          segue: la-cassa-dei-respinti

  - id: la-cassa-dei-respinti
    immagine: ambientazione/quartieri-alti
    titolo: La cassa dei respinti
    tipo: seguito
    luogo: Municipio, il seminterrato
    area: quartieri-alti
    requisiti: [fazione.consiglio == 0]
    testo: |
      Il seminterrato del Municipio odora di carta umida e di sego. Oltre la
      grata della banca cittadina, in fondo al corridoio, c'è una stanza
      bassa senza finestre, e Tullio ci fa luce tenendo la candela sopra la
      testa. Le casse sono impilate contro il muro fino al soffitto, una per
      ogni anno, e la chiave della stanza lui la tiene legata alla cintura.
      Quella di quest'anno è aperta, e il foglio di Ada sta in cima.

      {resistenza Facile} L'umido ti si attacca ai polmoni appena entri, e
      tossisci una volta. Tullio non tossisce, e la cosa dice quante volte è
      sceso qui da solo.

      «Le petizioni vanno presentate in ordine» dice Tullio, e la fiamma
      trema un poco. «Lo diceva il Rappresentante di prima. La Rappresentante
      Castaldi legge tutto, e io non volevo farle perdere tempo con le
      macchie e con le croci.» Si toglie gli occhiali e se li rigira fra le
      dita. «Le tenevo da parte, in ordine, per anno. Pensavo che prima o poi
      qualcuno le avrebbe ricopiate bene.»

      Prendi il foglio di Ada e lo apri alla luce della candela. La grafia è
      quella di una ragazza che ha imparato a scrivere tardi, e in fondo alla
      pagina c'è il ponticello disegnato a penna, con una crocetta nel punto
      in cui è caduta la bambina.

      {ingannare Difficile} Tullio dice la verità, anche a se stesso. Tenere
      quei fogli in ordine, per lui, è una forma di rispetto, ed è la cosa
      più triste che hai sentito oggi.
    opzioni:
      - testo: "Portare la cassa a Julia"
        descrizione: "La Rappresentante legge tutto, dice Tullio. Allora che legga anche questo."
        immagine: personaggi/julia-castaldi
        esito:
          titolo: Una notte di petizioni
          testo: |
            Porti la cassa di quest'anno su per le scale fino all'ufficio di
            Julia, con Tullio che ti viene dietro reggendo la candela e la
            cassa che a ogni gradino ti scava la spalla. Julia
            ascolta senza interromperti. Poi apre la cassa e comincia a
            leggere, e alla seconda petizione dice a Tullio che domattina vuole
            sulla scrivania anche quelle degli anni prima. Il giorno dopo la
            panca è piena di gente della Città Bassa che lei ha mandato a
            chiamare per nome, e la prima è Ada. Tullio smista ancora i fogli
            in due mucchi, però adesso li porta su tutti e due.

            {politica-ed-economia Media} Una sala piena di Città Bassa chiamata
            per nome dalla Rappresentante. In Consiglio se ne parlerà entro
            sera, e non tutti ne parleranno bene.

            Julia firma l'ordine per il ponticello di Ada quella stessa
            mattina. Una settimana dopo, al lavatoio, le assi marce sono
            ancora lì, e dei falegnami del Comune non si è visto nessuno.
          pe: { politica-ed-economia: 3 }
          imposta: { municipio.petizioni: 1 }
          effetti: { rep.castaldi: 1, fazione.consiglio: 1 }
      - testo: "Lasciare che sia Tullio a portarla su"
        descrizione: "L'errore è suo, e tocca a lui rimediare. Puoi stargli accanto mentre lo fa."
        esito:
          titolo: In ordine, per anno
          testo: |
            Dici a Tullio che la cassa deve portarla su lui, e che tu lo
            accompagni. Lui resta zitto per un pezzo, con gli occhiali in mano.
            Poi se la carica in spalla e sale le scale fermandosi a ogni
            pianerottolo, e tu gli stai dietro con le mani pronte, senza
            toccarlo.
            Davanti alla porta di Julia bussa due volte e ti fa cenno di
            aspettare fuori. Esce mezz'ora dopo senza la cassa e con le
            orecchie rosse. Ti racconta che la Rappresentante l'ha ringraziato
            di avergliele tenute in ordine, e lo racconta come se non ci
            credesse nemmeno lui. Il ponticello di Ada è il primo ordine che
            Julia firma, e una settimana dopo al lavatoio si aspettano ancora
            i falegnami del Comune.
          pe: { empatia: 3 }
          imposta: { municipio.petizioni: 1 }
          effetti: { rep.castaldi: 1, fazione.consiglio: 1 }
      - testo: "Ricopiare in bella la petizione di Ada"
        descrizione: "La cassa può aspettare, il ponticello no. Scritta bene, a Julia la petizione arriva lo stesso."
        esito:
          titolo: La bella copia
          testo: |
            Ti porti via il foglio di Ada e un foglio di carta buona del
            Municipio, che Tullio ti allunga senza farsi vedere. Ricopi la
            petizione con i margini dritti e lo spazio per il sigillo, e in
            fondo ridisegni il ponticello con la crocetta al suo posto. La
            mattina dopo la petizione sale nel cesto di vimini. Tre giorni più
            tardi al lavatoio arrivano due falegnami del Comune a mani vuote,
            perché le assi non sono arrivate nemmeno a loro, e Ada ti manda a
            dire che il bucato, da lei, non lo paghi più lo stesso. Nel
            seminterrato la cassa di quest'anno resta dov'era, sotto le altre.

            {empatia Media fallita} Ti senti a posto per un giorno intero. Ci
            metti un po' a ricordarti delle altre croci in quella cassa, e di
            chi le ha tracciate.
          pe: { accademiche: 3 }
          imposta: { municipio.petizioni: 1 }
          effetti: { rep.castaldi: 1, fazione.consiglio: 1 }

      - testo: "Parlarne a Julia a cena"
        descrizione: "La tua famiglia siede due sedie più in là dei Castaldi. Una cassa di petizioni respinte, raccontata a tavola fra il pesce e la frutta, arriva più in alto di qualunque registro."
        quando: [origine.rampollo-dei-quartieri-alti >= 1]
        esito:
          titolo: Fra il pesce e la frutta
          testo: |
            A una cena in un palazzo di Via del Velo Julia Castaldi siede di fronte a
            te, e aspetti che i camerieri portino via il pesce. Poi le racconti delle
            casse in ordine per anno e del ponticello disegnato a penna, a voce
            abbastanza bassa perché ti sentano soltanto i vicini, mentre
            all'altro capo del tavolo qualcuno chiede a gran voce la saliera. Julia
            posa la forchetta e non la riprende più. Il mattino dopo scende lei stessa nel
            seminterrato, con Tullio che le fa luce, e si siede su una cassa a leggere
            le croci al posto delle firme. Prima di mezzogiorno firma l'ordine per
            il ponticello di Ada, e una settimana dopo al lavatoio i falegnami del
            Comune non si sono ancora visti.
          pe: { galateo: 3 }
          imposta: { municipio.petizioni: 1 }
          effetti: { rep.castaldi: 1, fazione.consiglio: 1 }

  # ------------------------------------------------------------ storia a 4 · il ritratto
  - id: il-ritratto-della-rappresentante
    presso: municipio
    immagine: personaggi/marella-castaldi
    titolo: Il ritratto della Rappresentante
    sommario: "Stanotte il chiodo ha ceduto, e il ritratto che sta sopra la panca è finito a terra. Marella Castaldi vuole un quadro nuovo, e la Rappresentante non ha tempo di posare."
    luogo: Municipio, l'anticamera
    area: quartieri-alti
    requisiti: [fazione.consiglio == 2]
    testo: |
      Stamattina la parete sopra la panca è vuota, con un rettangolo più
      chiaro dove stava il ritratto e un chiodo piegato in mezzo. Il quadro è
      appoggiato alla panca, con la cornice spaccata in un angolo, e chi
      arriva per le udienze ci gira intorno come intorno a un ferito.

      A reggerlo dritto c'è un uomo alto e robusto, con la barba curata e un
      panciotto scuro. È Ettore Castaldi, il cugino della Rappresentante, che
      passava di qui per caso, e alle dieci del mattino ha già l'alito dolce
      dell'idromele.

      {medicina Facile} Idromele alle dieci, eppure le mani che reggono la
      cornice non tremano per niente. È un uomo che beve da molto tempo, o
      che regge molto bene.

      Accanto a lui una donna vestita con sobrietà detta a Tullio una
      lettera. «Mastro Fenzi ne dipinge uno nuovo in tre sedute»
      dice Marella Castaldi. «Il Municipio non può restare senza la faccia
      della sua Rappresentante. Tullio, scriva che bastano tre sedute, e che
      il quadro vecchio l'abbiamo tenuto anche troppo.»

      {origine rampollo-dei-quartieri-alti} Marella Castaldi l'hai vista a
      più pranzi del Consiglio di quanti ne ricordi, sempre intenta a
      correggere qualcuno con grande cortesia. A te non ha mai rivolto la
      parola, e adesso, quando si volta, il tuo cognome lo sa già.

      Dalla porta chiusa dell'ufficio arriva la voce roca di Julia. «Ho le
      udienze, Marella. Quello che c'era andava benissimo.»

      {galateo Media} Marella dà del lei a Tullio e intanto gli detta come a
      un cameriere. È la cortesia dei Quartieri Alti, che tiene ognuno al
      suo posto con grande gentilezza.

      Ettore ti guarda da sopra la cornice e alza un sopracciglio. Nel quadro
      Julia ha i capelli lunghi fino alle spalle e una collana di perle, e
      sorride a qualcuno fuori dalla tela. *Non l'ho mai vista sorridere così
      a nessuno.* Marella si volta verso di te e ti domanda se, visto che ci
      sei, hai un'idea migliore.
    opzioni:
      - testo: "Convincere Julia a posare"
        descrizione: "Tre sedute davanti a un pittore. Per farla sedere serve un argomento che lei rispetti."
        immagine: personaggi/julia-castaldi
        prova: { attributo: sociale, abilita: [persuasione, politica-ed-economia], difficolta: Media }
        successo:
          titolo: Un argomento
          testo: |
            Entri nell'ufficio e le dici che chi aspetta sulla panca passa ore
            a guardare quel quadro, e che ha il diritto di sapere a chi sta
            chiedendo udienza. Julia posa la penna. «Questo è un argomento»
            dice, e lo dice come se le costasse ammetterlo. Si alza ed esce in
            anticamera a guardare il ritratto da vicino, per la prima volta da
            anni, e tu ti accorgi di avere i palmi sudati solo adesso che è
            fatta.
          pe: { persuasione: 5 }
          segue: la-faccia-della-rappresentante
        fallimento:
          titolo: Gli argomenti di Marella
          testo: |
            Le dici che Marella ha ragione, e lei ti chiede in che cosa, con la
            penna ancora in mano. Provi con la dignità del Municipio e poi con
            il buon nome della città, e a ogni frase la voce di Julia si fa più
            secca. «Sono argomenti di Marella, e lei li dice meglio» risponde
            alla fine. Ti accompagna alla porta e chiama il nome seguente.

            {persuasione Media fallita} La dignità del Municipio ti era sembrata
            un'ottima idea, finché non l'hai sentita uscire dalla tua bocca con
            la voce di Marella.
          effetti: { scandalo: 0.5 }

      - testo: "Rimettere in sesto la cornice con Ettore"
        descrizione: "Ettore ha le mani grandi e un tempo reggeva uno scudo. La colla da falegname fa presa in un'ora, se qualcuno tiene stretti gli angoli."
        immagine: personaggi/ettore-castaldi
        prova: { attributo: fisico, abilita: [resistenza, atletica], difficolta: Media }
        successo:
          titolo: Un'ora di colla
          testo: |
            Ettore manda il garzone a prendere la colla dal falegname di Via
            del Velo, e per un'ora tenete stretta la cornice in due, lui da una
            parte e tu dall'altra, in ginocchio sul pavimento lucido. Ti
            tremano le braccia, e a lui no, e le ginocchia ti diventano due
            sassi.

            {rissa Media} Nocche rovinate e una spalla più bassa dell'altra.
            Ettore ha retto uno scudo per anni, e da come tiene la cornice si
            vede che non ha mai smesso di aspettarsi un colpo.

            Quando la colla ha fatto presa Ettore guarda il quadro con la testa
            inclinata. «Le somigliava, quando aveva vent'anni» dice. «Poco anche
            allora.» La porta dell'ufficio si apre, e Julia esce a vedere perché
            in anticamera nessuno parla più.
          pe: { resistenza: 5 }
          segue: la-faccia-della-rappresentante
        fallimento:
          titolo: L'angolo che cede
          testo: |
            Ettore manda il garzone a prendere la colla, e per un'ora tenete
            stretta la cornice in due. Verso la fine le braccia ti cedono, e
            l'angolo si riapre con uno schiocco che fa alzare mezza panca.
            Marella chiude gli occhi. Ettore riprende la cornice da solo
            senza fretta e ti dice a bassa voce che la prossima volta gli angoli
            li tiene lui, e lo dice con tanta gentilezza che preferiresti uno
            schiaffo.

      - testo: "Chiedere a Ettore del quadro"
        descrizione: "Ettore parla poco e ascolta molto. Quando l'hanno dipinto c'era."
        immagine: personaggi/ettore-castaldi
        prova: { attributo: sociale, abilita: [empatia, galateo], difficolta: Media }
        successo:
          titolo: La miniatura
          testo: |
            Ettore ti fa sedere sulla panca accanto a lui, con il quadro fra le
            ginocchia. «Julia non ha mai posato» dice. «Il giorno che l'hanno
            eletta non aveva un'ora libera, e non l'ha avuta nemmeno dopo.
            Marella ha dato al pittore una miniatura di quando lei aveva
            vent'anni, e il pittore ci ha messo del suo.» Indica le perle con
            un dito calloso. «Quelle sono di Marella. Julia non ne ha mai
            avute.» Poi si alza, perché la porta dell'ufficio si è aperta, e
            nell'alzarsi rimette il quadro dritto con un gesto solo.
          pe: { empatia: 5 }
          segue: la-faccia-della-rappresentante
        fallimento:
          titolo: Di Stato, a tavola
          testo: |
            Chiedi a Ettore del quadro, e lui ti guarda con calma, come guarda
            un avventore che nella sua Birreria ha chiesto un bicchiere di troppo.
            Poi indica Marella con il mento. «Di Stato sì, dei Castaldi no»
            dice. «È la regola di casa.» Marella, che ha sentito, gli sorride
            con molta eleganza, ed Ettore torna a occuparsi della cornice.

            {galateo Media fallita} Hai chiesto del quadro a un Castaldi davanti
            a un'altra Castaldi, che è proprio la cosa che nei Quartieri Alti si
            impara da bambini a non fare.
          effetti: { scandalo: 0.5 }

      - testo: "Sederti sulla panca e aspettare"
        descrizione: "Prima o poi Julia deve uscire da quella stanza, se non altro per chiamare il nome seguente."
        costo: 2
        esito:
          titolo: L'ultimo nome
          testo: |
            Ti siedi sulla panca accanto al quadro e aspetti. Marella se ne va
            a metà mattina lasciando a Tullio una lista di pittori, ed Ettore
            poco dopo, verso la Città Bassa. Il ritratto resta appoggiato lì, e
            chi si siede sulla panca lo guarda di sbieco. A mezzogiorno la
            porta si apre e Julia esce per chiamare l'ultimo nome. Lo chiama,
            poi si ferma davanti al quadro, e capisci che anche lei ha aspettato
            che se ne andassero tutti. Hai il sedere indolenzito e una certa
            fierezza che non sapresti spiegare.
          pe: { resilienza: 5 }
          segue: la-faccia-della-rappresentante

  - id: la-faccia-della-rappresentante
    immagine: personaggi/julia-castaldi
    titolo: La faccia della Rappresentante
    tipo: seguito
    luogo: Municipio, l'anticamera
    area: quartieri-alti
    requisiti: [fazione.consiglio == 2]
    testo: |
      Julia si ferma davanti al ritratto con le braccia conserte e lo guarda
      come guarda le pratiche, dall'alto in basso. Poi si accovaccia per
      vederlo meglio, e in anticamera nessuno gliel'aveva mai visto fare.
      «Le perle sono di Marella» dice senza staccare gli occhi dalla tela,
      «i capelli lunghi invece li avevo davvero, fino al primo mese in
      Municipio. Una notte, mentre firmavo i conti dei dazi, una ciocca mi è
      finita nel calamaio, e la mattina dopo li ho tagliati con le forbici di
      Tullio.»

      {percezione Media} Sulla nuca, dove il taglio è più corto, c'è ancora
      un ciuffo che va per conto suo. Le forbici di Tullio erano per la
      carta, e si vede.

      «Da ragazza mi sedevo su questa panca ad aspettare mio padre, che
      veniva a chiedere le cose al Rappresentante di allora. Si aspettava per
      ore. Anche lui aveva un ritratto, ed era peggio di questo, e io lo
      guardavo per non contare le ore» dice, e intanto passa un dito sul
      bordo spaccato della cornice per sentire quanto è profonda la crepa.
      *In tutte le udienze che hai visto non le hai mai sentito dire tante
      parole su di sé.* Ti scopri seduto sul bordo della panca come lei da
      ragazza, con le mani fra le ginocchia.

      {origine rampollo-dei-quartieri-alti} Nella tua famiglia nessuno ha
      mai aspettato su questa panca. Quando c'era da chiedere qualcosa al
      Rappresentante lo si invitava a cena, e tu, da bambino, a quelle cene
      dovevi stare zitto e tenere i gomiti giù dal tavolo.

      {empatia Media} Parla del quadro, e intanto parla di una bambina che
      contava le ore su questa panca e che adesso le fa contare agli altri.

      «Marella vuole un quadro nuovo, e Tullio vuole il muro pieno» dice Julia
      mentre si rialza spolverandosi la toga, «e tu che cosa ci metteresti?»
    opzioni:
      - testo: "Un ritratto nuovo, con le pratiche"
        descrizione: "Che la dipingano com'è adesso, con i capelli corti e una pila di pergamene sotto la mano."
        esito:
          titolo: Tre sedute
          testo: |
            Julia ci pensa il tempo di impilare due pergamene con gli angoli
            pari. «Le pratiche le porto io, così le leggo mentre lui dipinge»
            dice, e ne aggiunge una terza alla pila. Mastro Fenzi arriva la
            settimana dopo e per tre mattine dipinge in un angolo dell'ufficio
            mentre lei riceve. Nel quadro nuovo Julia ha i capelli corti e la
            penna in mano, e sul registro aperto davanti a lei c'è una cifra
            sottolineata che il pittore ha copiato senza capirla. Marella lo
            trova severo, e Julia paga il pittore di tasca sua senza dirlo a
            nessuno.

            {espressivita Media} Il pittore ha messo tutta la luce sulla penna,
            e la faccia è rimasta un po' in ombra. Forse non l'ha fatto apposta,
            e forse è per questo che il quadro le somiglia.
          pe: { espressivita: 5 }
          imposta: { municipio.ritratto: 1 }
          effetti: { rep.castaldi: 1 }
          segue: consiglio-scrivano-della-panca
      - testo: "Rimettere su quello vecchio"
        descrizione: "La gente della panca è abituata a quella faccia che sorride. Forse le serve più di quanto serva a Julia."
        esito:
          titolo: Più ottimismo che somiglianza
          testo: |
            Le dici che chi aspetta sulla panca ha bisogno di una
            Rappresentante che sorride, almeno sul muro. Julia guarda il
            ritratto e poi la panca. «Allora resta lui» dice, «e il sorriso lo
            lascio fare a lui, che gli riesce meglio.» Il giorno dopo il quadro
            torna al suo posto con la cornice incollata e un chiodo nuovo.
            Marella è contenta a metà, perché le sue perle si vedono ancora.
            Tullio giura di aver visto Julia, una mattina presto, raddrizzarlo
            con un dito, e lo racconta abbassando la voce come per un segreto
            di Stato.
          pe: { empatia: 5 }
          imposta: { municipio.ritratto: 1 }
          effetti: { rep.castaldi: 1 }
          segue: consiglio-scrivano-della-panca
      - testo: "Niente ritratto"
        descrizione: "Il muro vuoto, e al posto del quadro qualcosa che serva a chi aspetta."
        esito:
          titolo: La lavagna
          testo: |
            Julia ci pensa un momento solo. «La lista delle udienze, scritta
            grande, che si legga dalla panca» dice. «Così chi aspetta sa quanto
            gli manca, e guarda quella invece di me.» Il giorno dopo al posto
            del quadro c'è una lavagna nera, e ogni mattina Tullio ci scrive i
            nomi con il gesso e li cancella uno alla volta. Il ritratto va al
            Maniero, e Marella lo appende nella sala da pranzo, dove si parla
            di Stato. Sulla panca, da allora, si litiga un po' meno, e qualcuno
            ha smesso di incidere tacche sullo schienale.
          pe: { politica-ed-economia: 5 }
          imposta: { municipio.ritratto: 1 }
          effetti: { rep.castaldi: 1 }
          segue: consiglio-scrivano-della-panca

  # ------------------------------------------------------------ storia a 6 · un incarico del Consiglio
  - id: un-incarico-del-consiglio
    presso: municipio
    immagine: personaggi/julia-castaldi
    titolo: Un incarico del Consiglio
    sommario: "Julia Castaldi ti riceve a porta chiusa e apre il registro del Consiglio a una pagina dove nessuna riga ha una firma."
    luogo: Municipio, l'ufficio della Rappresentante
    area: quartieri-alti
    requisiti: [fazione.consiglio == 4]
    testo: |
      Julia ti riceve a porta chiusa, che per lei è un privilegio raro, e ti
      fa sedere davanti alla scrivania. Le pratiche sono impilate con gli
      angoli pari in tre colonne, e in mezzo è aperto il registro del
      Consiglio, a una pagina dove ogni riga ha una data e nessuna ha una
      firma. Accanto c'è una tazza di tè con il piattino sopra per tenerlo
      caldo, e il tè si è freddato lo stesso.

      {politica-ed-economia Media} Una pagina di date senza firme è una
      pagina di favori non fatti. Ogni riga rinviata è un seggio che ha
      vinto senza dover votare contro.

      «Sono le pratiche che il Consiglio rinvia» dice con la voce roca. «Ogni
      volta che una scontenta un seggio, gli altri la rimandano di un mese, e
      il mese dopo la rimandano ancora. Sono faccende piccole. Un pozzo
      conteso fra due cortili, una casa che un creditore vuole togliere a
      una vedova.» Si sfila la penna da dietro l'orecchio. «Mi serve una
      persona che le sbrighi a nome mio, e che in Consiglio non abbia un
      seggio da difendere.»

      {origine mercante-dei-ponti} Sulla tua licenza c'è il sigillo della
      Gilda, e la Gilda in Consiglio un seggio ce l'ha. Julia lo sa meglio
      di te, e ti ha fatto sedere lo stesso davanti alla sua scrivania.

      {resistenza Facile fallita} La sedia davanti alla scrivania è dura e
      un po' più bassa di quella di Julia. Dopo un quarto d'ora la schiena
      te lo fa notare, e non smette più.

      Scrive il tuo nome a matita, piccolo, sul margine della pagina, senza
      sottolinearlo. *Mi offre un lavoro con lo stesso tono di una multa.*
      «Prima di scriverlo a inchiostro ne voglio vedere sbrigata una» dice.
      «Scegli tu quale, e torna quando è chiusa.»
    opzioni:
      - testo: "La casa della vedova"
        descrizione: "La vedova di un miliziano morto nella razzia rischia di perdere la casa. Il creditore è un mercante della Gilda, e la Gilda in Consiglio ha un seggio."
        requisiti: [pista.pelle < 7]
        prova: { attributo: sociale, abilita: [persuasione, politica-ed-economia], difficolta: Media }
        successo:
          titolo: Una dilazione
          testo: |
            Il creditore ha l'ufficio sui Ponti, sopra un magazzino di funi, e
            ti riceve senza alzarsi. Gli spieghi quanto costerebbe alla Gilda,
            in Consiglio, cacciare di casa la vedova di un miliziano caduto per
            la città, e lui fa i conti con te, ad alta voce. Alla fine firma una
            dilazione di due anni senza interessi, e ti chiede di riferire alla
            Rappresentante che l'idea è stata sua. Julia legge la dilazione e
            ci tira sopra una riga.

            {persuasione Facile} Lascia che lo creda. Un uomo convinto di essere
            stato generoso, la volta dopo, ha voglia di esserlo ancora.
          pe: { persuasione: 5 }
          segue: il-nome-sul-registro
        fallimento:
          titolo: Il magazzino di funi
          testo: |
            Il creditore ti riceve sopra il suo magazzino di funi e ti lascia
            parlare per tutto il tempo che vuoi. Poi tira fuori il contratto,
            firmato dal miliziano in persona due anni prima della razzia, e ti
            mostra la clausola con l'unghia del mignolo, che tiene lunga apposta.
            Ha ragione lui, e lo sapete tutti e due. Julia
            ascolta il tuo resoconto e rimette la pratica in fondo alla pila,
            dove l'aveva trovata.
          effetti: { scandalo: 0.5 }

      - testo: "I taglialegna della cooperativa"
        descrizione: "La Segheria Malgrani adesso è della cooperativa dei taglialegna, e i due capisquadra non si parlano. Il Comune non ha un soldo da metterci."
        requisiti: [pista.pelle >= 7]
        prova: { attributo: sociale, abilita: [empatia, intimidire], difficolta: Media }
        successo:
          titolo: Due turni
          testo: |
            Alla Segheria trovi i due capisquadra ai lati opposti del cortile,
            ognuno con la sua metà di uomini. Li fai sedere sullo stesso tronco
            e li lasci parlare finché non si accorgono di volere la stessa cosa,
            cioè che nessuno dei due comandi l'altro. Finisce con due turni, il
            primo di mattina e il secondo di pomeriggio, e con la paga contata
            insieme il sabato. Si stringono la mano come se si scottassero.
            Julia legge l'accordo, scritto da te su un foglio pieno di
            segatura, e ci tira sopra una riga.
          pe: { empatia: 5 }
          segue: il-nome-sul-registro
        fallimento:
          titolo: Il tronco
          testo: |
            Fai sedere i due capisquadra sullo stesso tronco, e per un quarto
            d'ora va bene. Poi uno nomina un vecchio debito di birra e l'altro
            si alza di scatto. In un momento mezzo cortile è in piedi con le
            asce in mano. Ne esci con la giubba piena di segatura e senza un
            accordo.

            {armi-da-mischia Facile} Asce da taglio, lente perché pesano in
            testa. Se qualcuno le avesse alzate davvero avresti avuto il tempo
            di scappare, e l'hai usato bene.

            Julia ascolta il tuo resoconto e rimette la pratica in fondo alla
            pila.
          effetti: { scandalo: 0.5 }

      - testo: "Il pozzo dei due cortili"
        descrizione: "Due cortili della Città Bassa si contendono un pozzo. Da qualche parte nell'archivio del Municipio ci dev'essere scritto di chi è."
        prova: { attributo: mentale, abilita: [accademiche, percezione], difficolta: Media }
        successo:
          titolo: Il catasto vecchio
          testo: |
            Passi due giorni nell'archivio del seminterrato con Tullio che ti
            porta i registri del catasto, un anno alla volta. Alla fine lo
            trovi in un volume di quarant'anni fa, con le pagine incollate
            dall'umido e un ragno secco fra le righe. Il pozzo l'hanno scavato
            insieme i nonni dei due cortili, e l'atto lo dice in una riga
            sbiadita che nessuno aveva più letto. Lo ricopi parola per parola e
            lo porti in Città Bassa, dove i due cortili lo ascoltano in silenzio
            e poi si spartiscono i turni dell'acqua. Julia ci tira sopra una
            riga.
          pe: { accademiche: 5 }
          segue: il-nome-sul-registro
        fallimento:
          titolo: La polvere del catasto
          testo: |
            Passi due giorni nell'archivio del seminterrato a sfogliare i
            registri del catasto, e trovi tre pozzi con quel nome in tre strade
            diverse. Scegli quello sbagliato. In Città Bassa i due cortili ti
            ascoltano leggere l'atto fino in fondo, poi ti fanno notare che quel
            pozzo sta due vicoli più in là. Julia rimette la pratica in fondo
            alla pila.

            {accademiche Media fallita} Tre pozzi con lo stesso nome, e tu hai
            scelto quello con l'atto più bello. Il criterio, a pensarci adesso,
            era discutibile.
          effetti: { scandalo: 0.5 }

      - testo: "Raccogliere le firme del Consiglio in un giorno"
        descrizione: "Una pratica che tutti i seggi firmano entro sera passa anche senza seduta. Bisogna soltanto trovare i consiglieri, dalla Cattedrale ai sottoponti dei Raschiatori."
        prova: { attributo: fisico, abilita: [resistenza, atletica], difficolta: Media }
        successo:
          titolo: Dall'alba al tramonto
          testo: |
            Esci all'alba con la pratica in una cartella di cuoio e la
            attraversi tutta, la città, dalla Cattedrale ai Ponti e giù fino
            ai sottoponti dei Raschiatori. Le firme le raccogli una alla volta,
            sulle ginocchia di chi te le dà. Qualcuno firma senza leggere, un
            altro legge due volte prima di firmare. Rientri in Municipio al
            tramonto con le gambe di legno e i piedi gonfi, e Julia conta le
            firme col dito prima di tirare una riga sulla pratica.

            {atletica Media} Hai fatto la città da un capo all'altro e ritorno,
            con le scale dei Ponti in mezzo. Stanotte i polpacci ti
            sveglieranno per ricordartelo.
          pe: { resistenza: 5 }
          segue: il-nome-sul-registro
        fallimento:
          titolo: L'ultima firma
          testo: |
            Esci all'alba con la pratica in una cartella di cuoio e corri da un
            seggio all'altro per tutta la città. Alla penultima firma il sole è
            già basso, e l'ultimo consigliere lo trovi quando ha appena chiuso
            la porta e non la riapre per nessuno, nemmeno quando bussi con il
            pugno. Rientri in Municipio con una firma in meno e i piedi gonfi. Julia ti ringrazia e rimette la
            pratica in fondo alla pila, con le altre firme dentro.

      - testo: "Leggere tutta la pila con lei"
        descrizione: "Non c'è bisogno di correre. Le pratiche rinviate si sbrigano anche leggendole una per una, finché se ne trova una che si chiude da sola."
        costo: 2
        esito:
          titolo: Fino a notte
          testo: |
            Ti siedi dall'altra parte della scrivania e leggi con lei, una
            pratica dopo l'altra, mentre fuori la coda si scioglie e le campane
            suonano le ore. Verso mezzanotte ne trovi una di due anni fa che
            chiede una cosa già fatta da mesi, e che nessuno ha mai tolto dal
            registro. Julia la legge sorridendo appena e ci tira sopra una
            riga. Dopo quella ne saltano fuori altre uguali, e a notte fonda la
            pagina è più corta di un terzo e tu hai gli occhi che bruciano come
            dopo un fuoco di legna verde.
          pe: { politica-ed-economia: 5 }
          segue: il-nome-sul-registro

      - testo: "Dirle che non è il momento"
        descrizione: "Un incarico del Consiglio è un impegno. Julia detesta le perifrasi, e un no detto chiaro lo rispetta."
        costo: 0
        esito:
          titolo: A matita
          testo: |
            Le dici che per adesso non potresti garantirle il tempo che serve.
            Julia annuisce una volta sola, come per la data di una seduta, e
            lascia il tuo nome a matita sul margine. «Detto chiaro» dice
            chiudendo il registro con la pagina dentro, «e a matita tenerlo
            costa poco. Resta lì finché non torni.» Poi chiama il nome
            seguente, e tu esci con la sensazione di aver lasciato qualcosa
            sulla sedia.

  - id: il-nome-sul-registro
    immagine: fazioni/consiglio-di-qir-azel
    titolo: Il nome sul registro
    tipo: seguito
    luogo: Municipio, l'ufficio della Rappresentante
    area: quartieri-alti
    requisiti: [fazione.consiglio == 4]
    testo: |
      Julia riapre il registro alla pagina del margine e intinge la penna.
      Prima di scrivere ti guarda, con la penna sospesa sulla carta, e una
      goccia d'inchiostro le cade sul polsino senza che se ne accorga. Poi
      posa la penna accanto al calamaio, senza scrivere. «Chi è scritto qui a
      inchiostro parla a nome mio quando io non posso» dice. «Quello che fa
      lo firmo io, e se sbaglia ho sbagliato io. In Consiglio c'è chi aspetta
      soltanto questo, e io prima voglio sapere se sai guardare una seduta.»

      Dal cassetto tira fuori una lettera già scritta e piegata in tre, con
      il sigillo del Consiglio in ceralacca, e te la fa vedere senza
      dartela. La ceralacca è colata un po' di traverso, perché il sigillo lo
      mette Tullio, e Tullio lo fa sempre di fretta per paura che si
      raffreddi. Julia la rimette nel cassetto e lo lascia aperto di un dito.
      Hai le mani strette sulle ginocchia, e le apri piano.

      {intimidire Media} Julia la voce la tiene bassa perché le basta. Chi in
      Consiglio aspetta un suo errore ha paura di lei, ed è per questo che
      aspetta invece di attaccare.

      Fuori dalla finestra la coda sulla scalinata si allunga, e qualcuno in
      fondo comincia a battere i piedi per il freddo. Julia aspetta la tua
      risposta senza aggiungere altro, perché quello che c'era da dire l'ha
      detto.

      {politica-ed-economia Difficile} Una lettera già scritta e già
      sigillata prima ancora che tu chiudessi la pratica. Aveva deciso da
      un pezzo, e ha aspettato soltanto che lo decidessi anche tu.
    opzioni:
      - testo: "Accettare l'incarico"
        descrizione: "Il tuo nome sul registro, a matita per ora, e le faccende che gli altri rinviano. La lettera resta nel cassetto fino a giovedì."
        requisiti: [pista.pelle < 7]
        esito:
          titolo: A matita
          testo: |
            Le dici di sì, e Julia ripassa il tuo nome a matita, una volta
            sola, perché si legga meglio, poi chiude il registro con la penna
            ancora asciutta. «La paga è a incarico, e le pratiche te le do io,
            una alla volta» dice. «Giovedì c'è seduta, e tu ti siedi in tribuna
            a guardare chi vota cosa. Dopo vieni a dirmelo.» Mentre esci chiama il nome
            seguente, e Tullio dal bancone ti saluta inforcando gli occhiali,
            come per vedere meglio chi sei diventato. Il cassetto, alle tue
            spalle, è rimasto aperto di un dito.
          imposta: { municipio.incarico: 1 }
          effetti: { rep.castaldi: 1, fazione.consiglio: 1 }
      - testo: "Accettare l'incarico"
        descrizione: "Il tuo nome sul registro, a matita per ora, e le faccende che gli altri rinviano. Le casse del Comune sono vuote."
        requisiti: [pista.pelle >= 7]
        esito:
          titolo: Quando le casse si riempiono
          testo: |
            Le dici di sì, e Julia ripassa il tuo nome a matita, una volta
            sola, perché si legga meglio, poi chiude il registro con la penna
            ancora asciutta. «Le casse sono vuote, e te lo dico adesso perché dopo mi
            piacerebbe meno» dice, «quindi gli incarichi te li pago quando
            posso. Le altre volte ti pago con quello che so. Giovedì c'è
            seduta. Siediti in tribuna e guarda chi vota cosa.» Mentre esci
            chiama il nome seguente, e Tullio dal bancone ti saluta inforcando
            gli occhiali, come per vedere meglio chi sei diventato.

            {conoscenze-della-strada Media} Pagato in notizie da una che siede
            in cima al Consiglio. In Città Bassa c'è gente che darebbe un mese
            di paga per un debito così.
          imposta: { municipio.incarico: 1 }
          effetti: { rep.castaldi: 1, fazione.consiglio: 1 }
      - testo: "Rifiutare con garbo"
        descrizione: "Hai visto che cosa c'è su quella pagina. Per adesso preferisci restarne fuori."
        esito:
          titolo: La lettera nel cassetto
          testo: |
            Le dici che per adesso preferisci salire quelle scale soltanto per
            chiedere. Julia rimette la lettera nel cassetto senza chiuderlo a
            chiave, e il tuo nome a matita resta sul margine. «Se torni, la
            prova la rifai» dice riaprendo la prima pratica della pila, «perché
            le regole del Consiglio le hanno scritte prima di me, e io le
            rispetto lo stesso.» Non sembra delusa, e la cosa ti brucia un po'
            più di quanto avresti voluto.

  # ------------------------------------------------------------ la carta
  - id: carta-un-bando-del-consiglio
    immagine: fazioni/consiglio-di-qir-azel
    titolo: Un bando del Consiglio
    sommario: "Un garzone del Comune inchioda un bando al pilastro di Via del Velo, e intorno si ferma un po' di gente che vorrebbe sapere che cosa c'è scritto."
    luogo: Quartieri Alti, il pilastro dei bandi in Via del Velo
    tipo: carta
    area: quartieri-alti
    requisiti: [rep.castaldi < 2]
    testo: |
      In fondo a Via del Velo c'è un pilastro di pietra dove il Municipio
      affigge i bandi, uno sopra l'altro, finché quelli vecchi si staccano da
      soli con la pioggia. Stamattina un ragazzo con la livrea del Comune ci
      sta inchiodando un foglio nuovo. Ha i chiodi in bocca e un martello
      troppo grande per lui, e ogni volta che lo alza il foglio gli scivola
      di lato.

      Intorno si è fermata un po' di gente a guardare il martello, che
      entro mezzogiorno finirà su un dito.

      {tecnologia Facile} Chiodi da cassetta, troppo corti per la pietra.
      Vanno piantati nelle fughe della malta, e il ragazzo li sta piantando
      dappertutto tranne lì.

      Una serva con la cesta della spesa chiede al ragazzo che cosa dice il
      bando, e lui si toglie i chiodi di bocca per rispondere che il suo
      lavoro è attaccarli. Poi guarda te,
      e dalla faccia capisci che non sa leggere e che si vergogna di
      chiedertelo. *Il Comune manda ad affiggere i bandi chi non li sa
      leggere.* Il foglio, intanto, pende da un chiodo solo e sbatte contro
      la pietra.

      {origine figlio-della-citta-bassa} Nei vicoli dove sei cresciuto i
      bandi li leggeva ad alta voce chi sapeva, un po' a modo suo, e chi non
      sapeva annuiva per non farlo vedere. Sulla faccia del ragazzo
      riconosci lo stesso modo di annuire.

      {empatia Facile} Si vergogna, ed è per questo che fa tanto rumore con
      il martello. Finché nessuno gli chiede niente, il suo segreto resta al
      sicuro.
    opzioni:
      - testo: "Leggere il bando ad alta voce"
        descrizione: "Il ragazzo ti sarà grato, e la serva anche."
        requisiti: [pista.pelle < 7]
        esito:
          titolo: Dalla seconda campana
          testo: |
            Sali sul primo gradino e leggi. Il Municipio riceve ogni mattina
            dalla seconda campana, per ordine di arrivo, e la Rappresentante
            Julia Castaldi ascolta di persona le suppliche dei cittadini. In
            fondo c'è una riga più piccola, dove gli impiegati cercano qualcuno
            che li aiuti a smaltire la coda, per una paga a mattina. La serva
            dice che è poca, e lo dice con grande autorità, perché le paghe le
            conosce tutte. Il ragazzo ti ringrazia con un cenno e ti dice che si chiama
            Nino, e che al Municipio chiedono sempre di Tullio.
          effetti: { rep.castaldi: 0.5 }
      - testo: "Leggere il bando ad alta voce"
        descrizione: "Il ragazzo ti sarà grato, e la serva anche. Il foglio è pieno di parole nuove."
        requisiti: [pista.pelle >= 7]
        esito:
          titolo: Le licenze
          testo: |
            Sali sul primo gradino e leggi. Chi macina o commercia grano deve
            presentarsi in Municipio per la licenza entro la fine del mese, e
            le cooperative del grano e dei taglialegna cercano soci. In fondo
            c'è una riga più piccola, dove gli impiegati cercano qualcuno che
            li aiuti con la coda, per una paga a mattina che il Comune pagherà
            appena potrà. La serva ride così forte che le cade una cipolla dalla
            cesta. Il ragazzo ti ringrazia, ti dice che si chiama Nino e che al
            Municipio chiedono sempre di Tullio.
          effetti: { rep.castaldi: 0.5 }
      - testo: "Tenergli fermo il foglio"
        descrizione: "Con due mani in più il bando sta dritto. Quello che c'è scritto lo leggerai un'altra volta."
        esito:
          titolo: Quattro chiodi
          testo: |
            Tieni il foglio fermo con i palmi aperti mentre il ragazzo pianta
            un chiodo per angolo a colpi brevi e storti. Al terzo si schiaccia
            un dito e stringe i denti per orgoglio. Quando ha finito fa un
            passo indietro e guarda il bando con le mani sui fianchi. Ti
            spiega che Tullio, al Municipio, i bandi li vuole dritti, e che
            questo finalmente lo è. Poi se ne va di corsa verso la scalinata,
            con il martello sotto il braccio e il dito schiacciato in bocca.
          pe: { empatia: 2 }
      - testo: "Tirare dritto"
        descrizione: "I bandi del Consiglio dicono sempre le stesse cose, e oggi hai fretta."
        costo: 0
        esito:
          titolo: Il bando nel fango
          testo: |
            Tiri dritto. Alle tue spalle senti un colpo di martello seguito da
            un'imprecazione soffocata, e quando ti volti il foglio è a terra in
            una pozzanghera. Il ragazzo lo guarda senza muoversi, con il
            martello ancora alzato. La serva lo raccoglie con due dita e lo
            appende al chiodo, al rovescio. Nessuno dei presenti sa leggere
            abbastanza da accorgersene, e tu sei già troppo lontano per tornare
            indietro senza sentirti ridicolo.
