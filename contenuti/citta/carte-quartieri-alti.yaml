# Il mazzo dei Quartieri Alti, seconda parte (ottobre 2026): quindici carte nuove per la mano da tre.
# Le dieci carte che c'erano già stanno in carte.yaml, accademia.yaml, biblioteca.yaml, cattedrale.yaml,
# municipio.yaml, teatro.yaml, piste/teatro.yaml e piste/sepolcro-2.yaml.
#
# NOVE CARTE SINGOLE, ripetibili tranne la carrozza (visto.carta-qa-carrozza-dei-tarvelin):
#   salotto-oresca (espressività, percezione; con rep.velo >= 2 i saluti di Nadja), levriero-dei-cordani
#   (addestrare animali, atletica), formule-in-cortile (intimidire, magia), gradini-della-cattedrale (medicina,
#   natura), debito-d-onore (persuasione, ingannare con la posta), lavatoio-alto (acrobazia, conoscenze della
#   strada), carrozza-dei-tarvelin (cavalcare, tecnologia), albero-degli-antenati (accademiche),
#   giorno-di-consiglio (galateo, furtività). Le reputazioni con una catena di storie (velo, accademia,
#   castaldi, teatro, biblioteca) qui non salgono: le carte ripetibili danno monete, merci, PE e piccole
#   negative; la carrozza, che si gioca una volta, dà rep.tarvelin.
#
# LA CATENA DI BERENGARIO LUSARDI, l'ultimo dei Lusardi del Patto (lusardi.passo):
#   0  carta-qa-lusardi-candelabro    aiutarlo a vendere il candelabro (politica ed economia), comprarlo tu
#                                     (lusardi.candelabro 1), stare al gioco della riparazione → passo 1.
#   1  carta-qa-lusardi-cena          la cena con l'uomo dell'ipoteca: fare l'amico di famiglia (ingannare o
#                                     galateo, rep.gilda), aiutare Gemma in cucina → passo 2.
#   2  carta-qa-lusardi-ultima-stanza il palazzo è venduto: l'anello (oggetto.sigillo-dei-lusardi, accessorio
#                                     +1 Galateo), il Patto alla Biblioteca (empatia: monete e un segreto; se
#                                     fallisce l'anello), con lusardi.candelabro 1 restituire il candelabro
#                                     (monete, anello, tormento -0.5) → passo 3, chiusa.
#
# TRE CARTE DA PIÙ AVANTI:
#   asta-dei-malgrani (pista.pelle >= 7, una volta sola), programma-della-promessa (pista.teatro >= 2),
#   predicatore-della-stella (pista.dama-argento >= 11).
#
# Nomi nuovi, che il Codex non dà: Berengario Lusardi e la sua serva Gemma, Madame Oresca (la madre di Nadja,
# citata nel glossario), Decoro (il levriero dei Cordani), Ermes (il pellegrino di Laresh).
# I prezzi stanno negli effetti, mai nella prosa (docs/stile-dei-testi.md, regola 11).

quality:
  - { id: lusardi.passo, nome: "Berengario Lusardi", categoria: stato, nascosta: true, descrizione: "A che punto sei con Berengario Lusardi. Vale 0 prima di incontrarlo, 1 dopo il candelabro, 2 dopo la cena e 3 dopo l'ultima stanza." }
  - { id: lusardi.candelabro, nome: "Il candelabro dei Lusardi", categoria: stato, nascosta: true, descrizione: "1 se hai comprato tu il candelabro di Berengario Lusardi, con la ricevuta in deposito." }
  - { id: visto.carta-qa-carrozza-dei-tarvelin, nome: "La carrozza dei Tarvelin", categoria: stato, nascosta: true }
  - { id: visto.carta-qa-asta-dei-malgrani, nome: "L'asta del Maniero Malgrani", categoria: stato, nascosta: true }

oggetti:
  - id: sigillo-dei-lusardi
    nome: Sigillo dei Lusardi
    immagine: icone/ring
    descrizione: "Un anello d'argento consumato, con una carrucola sopra due corde incrociate. Nei salotti dei Quartieri Alti c'è ancora chi lo riconosce, e ti offre la sedia buona."
    slot: accessorio
    grado: 1
    proprieta: { talento: { galateo: 1 } }

storylet:
  # ================================================================ carte singole
  - id: carta-qa-salotto-oresca
    immagine: icone/teapot
    titolo: Il giovedì di Madame Oresca
    sommario: "Il giovedì Madame Oresca riceve con le finestre aperte, e oggi le manca un ospite."
    luogo: Quartieri Alti, il primo piano di un palazzo in Via del Velo
    tipo: carta
    area: quartieri-alti
    testo: |
      Il giovedì Madame Oresca riceve al primo piano del suo palazzo in Via del
      Velo, con le finestre aperte perché dalla strada si veda chi sale. Oggi le
      manca qualcuno di un altro quartiere, e la cameriera, guardandoti le
      scarpe, sceglie te.

      Nel salotto di velluto verde Madame, con l'occhialino d'oro, siede fra un
      magistrato che dorme a occhi aperti e due dame che si contendono l'ultimo
      pasticcino. Sopra il camino c'è il ritratto di una ragazza con il velo,
      girato verso il muro.

      {empatia Media} Nessuno guarda il ritratto, e Madame meno di tutti.
    opzioni:
      - testo: "Raccontare una storia di laggiù"
        descrizione: "Madame vuole sapere com'è la vita sotto la terrazza. La storia deve essere vera, purché diverta."
        prova: { attributo: sociale, abilita: espressivita, difficolta: Media }
        successo:
          titolo: Il pasticcino
          testo: |
            Racconti di due vedove che al mercato del pesce si sono contese la
            stessa sogliola fino a sera, e Madame batte due volte l'occhialino sul
            bracciolo, che per lei vale un applauso. Sulle scale le due dame ti
            dicono a bassa voce quale dei loro mariti gioca a carte al Daino
            Zoppo, e quale perde.
          pe: { espressivita: 3 }
          effetti: { informazioni.pettegolezzo: 1 }
        fallimento:
          titolo: Troppo vera
          testo: |
            La storia ti esce troppo vera, con l'odore del pesce e una parola di
            troppo sulla vedova più grassa. Madame ti guarda attraverso
            l'occhialino fino alla fine senza dire niente, e la cameriera ti
            riaccompagna alle scale prima del tè. Scendendo, dalla finestra aperta
            senti qualcuno ripetere la tua parola di troppo, e ridere.
          effetti: { scandalo: 1 }
      - testo: "Guardare chi evita chi"
        descrizione: "In un salotto le cose importanti succedono fra le sedie, mentre tutti guardano la padrona di casa."
        prova: { attributo: mentale, abilita: percezione, difficolta: Facile }
        successo:
          titolo: Le sedie
          testo: |
            Una dama si è seduta il più lontano possibile dal magistrato, che a
            ogni sua risata si tocca il colletto. Un giovane con il panciotto
            nuovo non toglie gli occhi dal ritratto girato, e Madame gli chiede
            del raccolto di suo padre con una voce dolcissima. Esci con la testa
            piena di cose che non sai ancora a chi vendere.
          effetti: { informazioni.voce: 2 }
        fallimento:
          titolo: Il tè
          testo: |
            Guardi così tanto gli altri che non vedi arrivare la cameriera con il
            vassoio, e il tè bollente ti finisce sul ginocchio. Sorridi lo stesso,
            perché Madame ti sta guardando, e per il resto della visita senti la
            stoffa bagnata incollata alla pelle.
          pe: { percezione: 1 }
          effetti: { scandalo: 0.5 }
      - testo: "Portarle i saluti di Nadja"
        descrizione: "In Cattedrale Nadja Oresca cambia le bende. Madame vorrà sapere come sta, anche se non lo chiederà."
        requisiti: [rep.velo >= 2]
        esito:
          titolo: Il ritratto
          testo: |
            Al nome di Nadja il salotto si zittisce, e Madame posa l'occhialino in
            grembo e ti chiede se mangia. Quando le dici che mangia in piedi fra
            una branda e l'altra, pulisce due volte l'occhialino pulito e cambia
            discorso. Sulle scale la cameriera ti mette in mano un sacchetto di
            mandorle da portare in Cattedrale, «senza dire da parte di chi».
          pe: { empatia: 3 }
          effetti: { tormento: -0.5 }
      - testo: "Declinare con un inchino"
        costo: 0
        esito:
          testo: |
            Dici alla cameriera che oggi non puoi. Poco dopo vedi il garzone del
            fornaio, con le mani bianche di farina e la faccia di un condannato,
            spinto su per le scale del palazzo.

  - id: carta-qa-levriero-dei-cordani
    immagine: icone/sitting-dog
    titolo: Il levriero dei Cordani
    sommario: "Un levriero grigio scende la scalinata con un guanto da signora in bocca, inseguito da un valletto disperato."
    luogo: Quartieri Alti, la scalinata della Casa dei Nodi
    tipo: carta
    area: quartieri-alti
    testo: |
      Dalla scalinata della Casa dei Nodi scende di corsa un levriero grigio con
      un guanto da signora fra i denti, e dietro di lui un valletto in livrea
      dei Cordani che ha perso una scarpa. «È il guanto della signora Isotta!»
      grida. Il levriero si ferma a un passo da te, con la coda che va piano a
      destra e a sinistra.

      {origine figlio-del-circolo} Al Circolo i cani tengono la coda così quando
      vogliono essere inseguiti, e i bambini imparano presto a voltarsi
      dall'altra parte.
    opzioni:
      - testo: "Chiamarlo a te"
        descrizione: "Un fischio basso, la mano sul ginocchio. I levrieri da caccia rispondono a chi sa chiamarli."
        prova: { attributo: sociale, abilita: addestrare-animali, difficolta: Facile }
        successo:
          titolo: La placca d'argento
          testo: |
            Ti accucci e lo chiami con un fischio basso. Il levriero ci pensa
            sopra, poi viene a lasciarti il guanto nel palmo, appena umido, come
            se ti facesse una concessione. Il valletto ti mette in mano la mancia
            che il Sovrintendente Cordani lascia per queste occasioni, «che sono
            frequenti». Sulla placca del collare il cane si chiama *Decoro*.
          pe: { addestrare-animali: 3 }
          effetti: { monete: 5 }
        fallimento:
          titolo: La fontana
          testo: |
            Il levriero ti lascia avvicinare fino a un palmo, poi scarta verso la
            fontana. Quando lo raggiungi il guanto galleggia nella vasca, gonfio
            come un pesce morto, e il valletto arriva zoppicando e si siede sul
            bordo con la testa fra le mani.
          pe: { addestrare-animali: 1 }
      - testo: "Tagliargli la strada"
        descrizione: "In fondo alla scalinata la via si stringe fra due portoni, e anche un levriero deve passare di lì."
        prova: { attributo: fisico, abilita: atletica, difficolta: Media }
        successo:
          titolo: Fra i due portoni
          testo: |
            Il levriero scarta a sinistra e tu sei già lì, con le braccia larghe
            fra i due portoni. Lui frena scivolando sul selciato con un rumore di
            unghie, poi lascia cadere il guanto con dignità offesa. Il valletto,
            ancora paonazzo, ti mette in mano la mancia del Sovrintendente
            Cordani.
          pe: { atletica: 3 }
          effetti: { monete: 5 }
        fallimento:
          titolo: I gradini
          testo: |
            Il levriero scatta più forte di te, e sui gradini della Casa dei Nodi,
            consumati da cent'anni di mercanti, il piede ti va via e atterri sul
            fianco. Quando rialzi la testa il cane è già in fondo alla via, e il
            fianco ti fa male fino a sera, ogni volta che ridi.
          effetti: { ferite: 0.5 }
      - testo: "Lasciarlo correre"
        costo: 0
        esito:
          testo: |
            Ti fai da parte, e il levriero riparte deluso verso il basso, con il
            valletto dietro. Più tardi, in un'altra strada, lo rivedi seduto
            davanti a una macelleria, senza più il guanto in bocca.

  - id: carta-qa-formule-in-cortile
    immagine: ambientazione/accademia-di-torvessa
    titolo: Formule in cortile
    sommario: "Nel cortiletto dietro l'Accademia due allievi si sfidano a colpi di formule, e intorno gli altri scommettono caramelle."
    luogo: Quartieri Alti, un cortile dietro l'Accademia di Torvessa
    tipo: carta
    area: quartieri-alti
    testo: |
      Nel cortiletto dietro l'Accademia di Torvessa, sotto un fico che nessuno
      pota, un cerchio di ragazzi scommette caramelle di miele su un duello. In
      mezzo due allievi si fronteggiano con un cristallo nel pugno, il più
      grande con le sopracciglia bruciacchiate e un cognome importante, il più
      piccolo con le mani che tremano.

      {magia Media} Il cristallo del più piccolo è caricato oltre quello che le
      sue mani sanno tenere, e ha cominciato a fischiare.

      {origine allievo-di-torvessa} Il più piccolo tiene il pollice sopra le
      dita, l'errore per cui al primo anno ti facevano ricopiare le formule.
    opzioni:
      - testo: "Farli smettere con la voce grossa"
        descrizione: "La voce dei sergenti in Caserma, quella che arriva prima delle parole. Bisogna crederci abbastanza."
        prova: { attributo: sociale, abilita: intimidire, difficolta: Media }
        successo:
          titolo: Le caramelle
          testo: |
            Entri nel cerchio con la voce dei sergenti, e il cerchio si scioglie
            in un momento. I due duellanti se ne vanno ciascuno dalla sua parte
            senza salutarsi, e per terra restano le caramelle delle scommesse e
            due cristalli incrinati, ancora tiepidi, che raccogli con due dita.
            Una caramella te la metti in bocca, per principio.
          pe: { intimidire: 3 }
          effetti: { cristalli.frammento-esausto: 2 }
        fallimento:
          titolo: Il terzo duellante
          testo: |
            Il più grande ti dice che se vuoi puoi scommettere anche tu, e il
            cerchio ride. Mentre cerchi una risposta il più piccolo tira il suo
            colpo, che ti sfiora la mano e ti lascia sul dorso una striscia rossa.
            A quel punto si spaventano davvero e scappano tutti dal portone.
          effetti: { ferite: 0.5 }
      - testo: "Spegnere la formula a metà strada"
        descrizione: "Un dardo lanciato male si scioglie prima che arrivi, se sai dove mettere le mani."
        prova: { attributo: mentale, abilita: magia, difficolta: Media }
        successo:
          titolo: La luce fra le dita
          testo: |
            Alzi la mano mentre il più piccolo lancia, e il dardo ti arriva nel
            palmo come una palla di neve senza peso. Lo tieni chiuso finché si
            spegne. Nel cortile non vola una mosca, e il ragazzo ti porta con
            tutte e due le mani il suo cristallo opaco, chiedendoti di tenerlo tu
            finché non avrà imparato.
          pe: { magia: 4 }
          effetti: { cristalli.cristallo-sterile: 1 }
        fallimento:
          titolo: Il rimbalzo
          testo: |
            Metti la mano in mezzo un attimo troppo tardi, e il dardo ti rimbalza
            sul polso e lascia nel tronco del fico un buco nero che fuma. Per un
            po' non riesci a chiudere le dita, e quando alzi gli occhi i ragazzi
            si sono dileguati con la tavoletta delle scommesse.
          effetti: { ferite: 0.5 }
      - testo: "Andare a chiamare Orvald"
        descrizione: "Lo studio del preside è a due rampe di scale. Pett, sullo stipite, probabilmente sa già tutto."
        esito:
          titolo: Il corvo arriva prima
          testo: |
            Quando arrivi in fondo al corridoio Pett è già volato giù dalla
            finestra. Orvald Temmerin ti segue senza fretta, e nel cortile gli
            basta tossire una volta perché i ragazzi si mettano in fila da soli.
            Confisca i cristalli e ti dice grazie senza guardarti, facendoti
            sapere di chi è figlio il più grande con un tono che spiega molte
            cose.
          pe: { accademiche: 2 }
          effetti: { informazioni.voce: 1 }
      - testo: "Lasciarli fare"
        costo: 0
        esito:
          testo: |
            Tiri dritto, con le mani in tasca. Prima di girare l'angolo senti un
            colpo secco e un coro di «oooh», poi qualcuno che chiama la madre e
            qualcun altro che reclama le sue caramelle.

  - id: carta-qa-gradini-della-cattedrale
    immagine: ambientazione/cattedrale-del-velo
    titolo: Sui gradini della Cattedrale
    sommario: "In coda per la Cripta un pellegrino di Laresh si è accasciato sui gradini."
    luogo: Quartieri Alti, la scalinata della Cattedrale del Velo
    tipo: carta
    area: quartieri-alti
    testo: |
      La coda per la Cripta scende dalla scalinata della Cattedrale fino alla
      strada. A tre gradini dal portale un contadino di Laresh si è sdraiato con
      la guancia sulla pietra, e la moglie gli fa vento con il cappello
      ripetendo il suo nome, Ermes, mentre una signora con il ventaglio dice che
      sarà la Marea.

      {origine accolito-del-velo} Questa coda l'hai vista tante volte dall'altra
      parte del portale.

      Il contadino porta la cintura stretta a un buco nuovo, fatto col coltello.
      *Ha digiunato per presentarsi pulito, e ha esagerato.* Ti accucci accanto
      a lui prima di averlo deciso.
    opzioni:
      - testo: "Visitarlo"
        descrizione: "Prima di pensare alla Marea conviene guardargli il polso e le unghie."
        prova: { attributo: mentale, abilita: medicina, difficolta: Facile }
        successo:
          titolo: Pane e miele
          testo: |
            Il polso è debole ma regolare e le unghie sono rosa, quindi la Marea
            non c'entra. La moglie confessa che Ermes non mangia da tre giorni.
            Gli fai mangiare il pane con il miele che lei teneva per il ritorno, e
            quando si rimette seduto ti preme in mano un vasetto di unguento
            d'arnica fatto da sua sorella.
          pe: { medicina: 3 }
          effetti: { unguento: 1 }
        fallimento:
          titolo: Gli stivali
          testo: |
            Lo giri sulla schiena e gli sollevi le gambe, e lui ti vomita sugli
            stivali un sorso d'acqua. La signora del ventaglio grida alla Marea, e
            la coda arretra di due gradini. Dal portale esce Nadja Oresca, che gli
            guarda per prima cosa le unghie e poi ti dice con gentilezza di
            pulirti gli stivali prima di entrare.
          pe: { medicina: 1 }
          effetti: { scandalo: 0.5 }
      - testo: "Cercare una foglia nei Giardini"
        descrizione: "Nei Giardini della Linfa una pianta rimette in piedi chi sviene, e quelle che le somigliano fanno peggio."
        prova: { attributo: mentale, abilita: natura, difficolta: Media }
        successo:
          titolo: Le mani in tasca
          testo: |
            Nei Giardini della Linfa trovi la foglia dal bordo seghettato che
            odora di menta, e Sorella Giulia, con le mani in tasca come vuole la
            regola, ti lascia fare. Il contadino la annusa e si tira su con le
            guance di nuovo rosse, e la moglie ti racconta tutte le notizie di
            Laresh che conosce.
          pe: { natura: 4 }
          effetti: { informazioni.voce: 2 }
        fallimento:
          titolo: La foglia sbagliata
          testo: |
            Stacchi una foglia che le somiglia, e te ne accorgi quando ti
            cominciano a prudere le dita. Sorella Giulia ti raggiunge fra le
            aiuole e ti ricorda la regola dei Giardini, quella delle mani in
            tasca. Quando torni sulla scalinata il contadino si è ripreso da solo,
            e un accolito ha scritto il tuo nome sul registro della Confraternita.
          effetti: { scandalo: 1 }
      - testo: "Chiamare un accolito"
        costo: 0
        esito:
          testo: |
            Entri nella navata e avvisi il primo accolito che trovi. Lui finisce
            la riga che stava scrivendo, ci soffia sopra, poi esce con calma.
            Quando ti volti il contadino è di nuovo seduto, con il cappello
            della moglie in testa, e qualcuno in coda ha preso il tuo posto.

  - id: carta-qa-debito-d-onore
    immagine: icone/card-random
    titolo: Un debito d'onore
    sommario: "Sotto il portico del Daino Zoppo un ragazzo di buona famiglia deve saldare un debito di gioco prima dei vespri."
    luogo: Quartieri Alti, il portico della Locanda del Daino Zoppo
    tipo: carta
    area: quartieri-alti
    testo: |
      Sotto il portico del Daino Zoppo l'oste scrive su una lavagna i nomi di
      chi ha perso e non ha pagato. Oggi il gesso è in mano a un mercante di
      lana di Laresh che aspetta i vespri.

      Un ragazzo con il panciotto ricamato e gli occhi rossi di una notte al
      tavolo ti prende la mano con dita fredde. «Il mio nome sulla lavagna lo
      legge mia madre, e dopo mia madre mio padre.»

      {origine mercante-dei-ponti} Il mercante tiene il pollice sulla riga del
      ragazzo come fai tu al banco con chi non può pagare.
    opzioni:
      - testo: "Convincere il mercante ad aspettare"
        descrizione: "Una settimana di tempo sulla parola del ragazzo. Il mercante deve credere che gli convenga."
        prova: { attributo: sociale, abilita: persuasione, difficolta: Media }
        successo:
          titolo: Una settimana
          testo: |
            Parli al mercante di lana, poi della famiglia del ragazzo, che di lana
            ne compra molta, finché lui comincia a contare quanta ne venderebbe e
            scrive sul registro la data di una settimana più in là. Il ragazzo,
            per sdebitarsi, ti racconta con chi giocava stanotte e quanto ha perso
            uno di loro senza che la lavagna lo sapesse.
          pe: { persuasione: 3 }
          effetti: { informazioni.pettegolezzo: 1 }
        fallimento:
          titolo: Il garante
          testo: |
            Il mercante ti ascolta fino in fondo, poi scrive il nome del ragazzo
            sulla lavagna in stampatello, e sotto, visto che ci hai messo la
            faccia, il tuo con la parola *garante*. Fino a sera chi entra al Daino
            Zoppo si ferma a leggere, e poi cerca te con gli occhi.
          effetti: { scandalo: 1 }
      - testo: "Saldare tu il debito"
        descrizione: "Il ragazzo giura che ti ripagherà, e intanto ti offre in pegno l'unica cosa che ha."
        requisiti: [monete >= 20]
        esito:
          titolo: Il pegno
          testo: |
            Conti le monete nel palmo del mercante, che cancella il gesso con la
            manica. Il ragazzo non ha niente da darti, e in un angolo del portico
            ti racconta sottovoce un segreto della sua famiglia, sollevato di non
            doverlo più tenere da solo. Dice che è un pegno, e che tornerà a
            riprenderselo con gli interessi.
          effetti: { monete: -20, informazioni.segreto: 1 }
      - testo: "Giocarti il debito a carte"
        descrizione: "Il mercante è di Laresh, dove si gioca a Zekar. Una mano sola, il debito del ragazzo contro la tua posta."
        requisiti: [monete >= 10]
        prova: { attributo: sociale, abilita: ingannare, difficolta: Media }
        successo:
          titolo: La faccia ferma
          testo: |
            Il mercante accetta perché si annoia. Tieni la faccia ferma anche
            quando la tua mano è pessima, e lui butta la sua sul tavolo al terzo
            giro, convinto di aver perso. Il nome del ragazzo sparisce dalla
            lavagna con un colpo di manica, e il ragazzo ti guarda come si guarda
            un santo di pietra al primo miracolo.
          pe: { ingannare: 3 }
          effetti: { monete: 10 }
        fallimento:
          titolo: La crocetta
          testo: |
            Il mercante gioca lento, come si gioca in campagna, guardandoti le
            mani più delle carte, e perdi la posta al secondo giro. Poi scrive lo
            stesso il nome del ragazzo sulla lavagna, e sotto il tuo, con una
            crocetta che al Daino Zoppo vuol dire *ha perso anche lui*.
          effetti: { monete: -10, scandalo: 1 }
      - testo: "Non immischiarti"
        costo: 0
        esito:
          testo: |
            Gli dici che i debiti di gioco sono affari di chi gioca, e lui torna a
            rigirarsi l'anello. La sera dopo, sulla lavagna, il suo nome è in
            alto, più grande di tutti gli altri.

  - id: carta-qa-lavatoio-alto
    immagine: icone/fountain
    titolo: Il lavatoio alto
    sommario: "Al lavatoio dietro Via del Velo una tovaglia ricamata sta scappando verso la Cicatrice."
    luogo: Quartieri Alti, il lavatoio dietro Via del Velo
    tipo: carta
    area: quartieri-alti
    testo: |
      Dietro Via del Velo c'è il lavatoio delle grandi case, una vasca di pietra
      chiara il cui canale finisce oltre il parapetto, nel vuoto della
      Cicatrice. Le cameriere dei palazzi lavano qui ognuna al suo posto,
      ereditato come i titoli dei padroni.

      {origine apprendista-raschiatore} Sulle piattaforme della Cicatrice ogni
      tanto arriva quello che cade dai Quartieri Alti.

      Stamattina una tovaglia con uno stemma ricamato in oro è sfuggita a una
      ragazza e scivola lungo il canale verso il parapetto, e le altre cameriere
      guardano te, che sei l'unico vicino al canale.
    opzioni:
      - testo: "Ripescare la tovaglia"
        descrizione: "Il bordo del canale è largo un palmo e coperto di sapone. Bisogna arrivarci prima del parapetto."
        prova: { attributo: fisico, abilita: acrobazia, difficolta: Facile }
        successo:
          titolo: Il posto in fondo
          testo: |
            Corri lungo il bordo del canale con le braccia larghe e afferri la
            tovaglia a un braccio dal parapetto. La ragazza se la stringe al petto
            bagnata com'è, e per il resto della mattina le cameriere ti fanno
            posto in fondo alla vasca e ti raccontano due o tre cose dei loro
            padroni.
          pe: { acrobazia: 3 }
          effetti: { informazioni.voce: 2 }
        fallimento:
          titolo: Il bagno
          testo: |
            Al secondo passo il sapone ti porta via un piede, e finisci nel canale
            fino alla cintura. La tovaglia la prendi lo stesso, ma prima di sera
            la storia di chi è caduto nel lavatoio alto ha già fatto il giro delle
            cucine, con un dettaglio in più a ogni cucina.
          effetti: { scandalo: 1, informazioni.voce: 1 }
      - testo: "Entrare nelle chiacchiere"
        descrizione: "Una cameriera arrabbiata parla volentieri. Bisogna dire la cosa giusta sul padrone giusto."
        prova: { attributo: sociale, abilita: conoscenze-della-strada, difficolta: Media }
        successo:
          titolo: Il filo d'oro
          testo: |
            Ti appoggi alla vasca accanto alla più anziana e dici una cosa
            qualunque sui padroni che si fanno ricamare lo stemma sulle tovaglie.
            Lei sbuffa e ti risponde, e dopo di lei le altre. Quando la tovaglia è
            al sicuro sai di chi è lo stemma, e quale casa ha cambiato cuoca due
            volte in un mese.
          pe: { conoscenze-della-strada: 3 }
          effetti: { informazioni.pettegolezzo: 1 }
        fallimento:
          titolo: Una domanda di troppo
          testo: |
            Fai una domanda di troppo sullo stemma, e le cameriere si chiudono
            come porte e riprendono a sbattere i panni così forte che l'acqua ti
            schizza fino agli stivali. Mentre te ne vai, una ragazza corre verso
            due guardie del Velo e ti indica con il mento.
          effetti: { sospetto: 1 }
      - testo: "Andartene prima che ti chiedano aiuto"
        costo: 0
        esito:
          testo: |
            Ti allontani a passo svelto. Alle tue spalle qualcuno strilla, poi
            le cameriere si mettono a ridere tutte insieme, così forte che una
            guardia del Velo in fondo alla strada si volta a guardare.

  - id: carta-qa-carrozza-dei-tarvelin
    immagine: ambientazione/maniero-tarvelin
    titolo: La carrozza dei Tarvelin
    sommario: "Alle campane di mezzogiorno due cavalli spaventati trascinano giù per la discesa una carrozza dei Tarvelin."
    luogo: Quartieri Alti, la discesa che porta alla fontana
    tipo: carta
    area: quartieri-alti
    requisiti: [visto.carta-qa-carrozza-dei-tarvelin == 0]
    testo: |
      A mezzogiorno le campane della Cattedrale battono tutte insieme, e a metà
      della discesa due cavalli neri si impennano e partono con la carrozza dei
      Tarvelin, mentre il cocchiere, sceso a sistemare un finimento, perde le
      redini. Dal finestrino si affaccia una governante anziana con la cuffia
      nera, aggrappata al montante.

      {cavalcare Media} Hanno le orecchie piatte e scappano dalle campane per la
      via più corta, che è in discesa.

      In fondo alla discesa c'è la fontana, e dopo la fontana il parapetto sulla
      Cicatrice.
    opzioni:
      - testo: "Saltare a cassetta"
        descrizione: "Afferrare il montante e salire a cassetta, poi riprendere le redini. Da lì in poi si tratta di cavalli."
        prova: { attributo: fisico, abilita: cavalcare, difficolta: Media }
        successo:
          titolo: Le redini
          testo: |
            Ti issi a cassetta e ti sporgi fino alle redini che pendono fra le
            zampe dei cavalli. Le tiri piano, parlando con una voce bassa che non
            sapevi di avere, e la carrozza si ferma a un passo dalla fontana. La
            governante ti mette in mano la borsa della spesa del giorno e ti dice
            che al Maniero Tarvelin si ricorderanno del tuo nome.
          pe: { cavalcare: 4 }
          effetti: { rep.tarvelin: 0.5, monete: 8 }
          imposta: { visto.carta-qa-carrozza-dei-tarvelin: 1 }
        fallimento:
          titolo: Il selciato
          testo: |
            Afferri il montante, e la carrozza prende una buca e ti scrolla via
            come una mosca. Rotoli sul selciato con i gomiti scorticati, in tempo
            per vedere i cavalli fermarsi da soli davanti alla fontana. La
            governante scende tremando e chiede chi era il pazzo che si è buttato
            sotto le ruote.
          effetti: { ferite: 1 }
          imposta: { visto.carta-qa-carrozza-dei-tarvelin: 1 }
      - testo: "Tirare la leva del freno"
        descrizione: "Dietro, fra le ruote, c'è un pattino di ferro che si abbassa con una leva, e le leve sono due."
        prova: { attributo: mentale, abilita: tecnologia, difficolta: Media }
        successo:
          titolo: Il pattino
          testo: |
            Ti aggrappi alla pedana posteriore. La prima leva apre il bagagliaio e
            la lasci stare, mentre la seconda abbassa un pattino di ferro che
            stride sulla ruota mandando scintille, finché la carrozza si ferma di
            traverso davanti alla fontana. La governante ti ringrazia con qualche
            moneta e ti fa ripetere due volte il nome, per riferirlo al Maniero
            Tarvelin.
          pe: { tecnologia: 4 }
          effetti: { rep.tarvelin: 0.5, monete: 5 }
          imposta: { visto.carta-qa-carrozza-dei-tarvelin: 1 }
        fallimento:
          titolo: Le cappelliere
          testo: |
            Ti aggrappi alla pedana e tiri la leva del bagagliaio, così una
            pioggia di cappelliere rotola giù per la discesa. Ti lasci cadere
            prima della fontana, contro la quale i cavalli si fermano da soli, e
            passi il resto dell'ora a raccogliere cappelliere.
          effetti: { ferite: 0.5 }
          imposta: { visto.carta-qa-carrozza-dei-tarvelin: 1 }
      - testo: "Schiacciarti contro un portone"
        descrizione: "I cavalli sanno dov'è la fontana. Forse."
        esito:
          testo: |
            Ti schiacci contro un portone insieme a un garzone del fornaio, che ti
            pesta un piede. La carrozza va a fermarsi da sola contro la fontana
            con una ruota piegata, e quando il cocchiere arriva di corsa la
            governante gli dice cose che una governante dei Tarvelin non dovrebbe
            sapere.
          imposta: { visto.carta-qa-carrozza-dei-tarvelin: 1 }

  - id: carta-qa-albero-degli-antenati
    immagine: icone/family-tree
    titolo: L'albero degli antenati
    sommario: "Sotto il portico della Casa dei Nodi un uomo vende alberi genealogici che risalgono sempre al Patto delle Corde."
    luogo: Quartieri Alti, il portico della Casa dei Nodi
    tipo: carta
    area: quartieri-alti
    testo: |
      Sotto il portico della Casa dei Nodi un uomo con la parrucca incipriata
      vende *Alberi genealogici e discendenze dal Patto delle Corde*, come dice
      il cartello sul suo tavolino. Mentre un mercante di tessuti aspetta il suo
      albero con le mani giunte, l'uomo intinge una pergamena nuova nel tè e la
      mette ad asciugare al sole.

      {ingannare Facile} Una pergamena invecchiata nel tè ha l'odore della
      colazione, e chi la compra di solito non la annusa.

      {origine fuggiasco-di-ghoran} A Ghoran nessuno ti ha mai chiesto il nome
      di tua nonna, perché contava soltanto il numero che dava la bilancia.
    opzioni:
      - testo: "Controllare i suoi alberi"
        descrizione: "I nomi dei firmatari e le loro date sono nei libri della Biblioteca. Basta ricordarli meglio di lui."
        prova: { attributo: mentale, abilita: accademiche, difficolta: Media }
        successo:
          titolo: La data sbagliata
          testo: |
            Nell'albero di esempio un firmatario risulta morto prima del Patto, e
            un altro ha una figlia nata quando lui aveva novant'anni. Lo dici a
            voce bassa, e l'uomo smette di sorridere. Ti offre qualche moneta per
            l'incomodo, e mentre le conta ti lascia vedere, forse apposta, il
            quaderno con i nomi dei suoi clienti, alcuni dei quali siedono nei
            salotti buoni.
          pe: { accademiche: 3 }
          effetti: { monete: 5, informazioni.pettegolezzo: 1 }
        fallimento:
          titolo: La lezione di storia
          testo: |
            Gli fai notare una data, e lui ti risponde con altre tre e cita
            perfino il colore della ceralacca dei notai. Il mercante di tessuti
            alla fine guarda te come si guarda un ignorante, e te ne vai con il
            sospetto che avesse ragione lui.
          effetti: { scandalo: 1 }
      - testo: "Farti fare un albero"
        descrizione: "Il prezzo è quello del cartello, e l'antenato lo sceglie lui."
        requisiti: [monete >= 10]
        esito:
          titolo: Un ramo laterale
          testo: |
            L'uomo ti chiede il nome di tua madre e di tua nonna, e quando non li
            sai li inventa lui. Dopo un'ora hai in mano una pergamena color tè
            dove discendi, per un ramo piuttosto storto, dalla sorella di un
            firmatario del Patto, e lui ti racconta a chi altro ha venduto quella
            sorella nell'ultimo mese.
          effetti: { monete: -10, informazioni.voce: 2, tormento: -0.5 }
      - testo: "Tirare dritto"
        costo: 0
        esito:
          testo: |
            Passi oltre. L'uomo ti augura buona giornata e aggiunge, a voce un
            po' più alta, che il naso dei fondatori si eredita. Il mercante di
            tessuti si tocca il suo con due dita, e sembra sollevato di trovarlo
            all'altezza.

  - id: carta-qa-giorno-di-consiglio
    immagine: fazioni/famiglia-castaldi
    titolo: Giorno di consiglio
    sommario: "Al Maniero Castaldi è giorno di consiglio, e alla porta di servizio la cuoca cerca braccia per la cena."
    luogo: Quartieri Alti, la porta di servizio del Maniero Castaldi
    tipo: carta
    area: quartieri-alti
    testo: |
      Il Maniero Castaldi apre le porte solo nei giorni di consiglio, e alla
      porta di servizio la cuoca, con gli avambracci di un fabbro, sceglie te
      fra quelli che passano. «Due braccia e niente domande» dice, tirandoti
      dentro per la manica. «Stasera Marella Castaldi ha a tavola mezzo
      Consiglio, e quello che si sente in sala in cucina non si ripete.»

      Nel corridoio Quintus Vael, con l'armatura di cuoio anche oggi, passa in
      rassegna i servitori e si ferma un momento in più davanti ai nuovi.

      {origine rampollo-dei-quartieri-alti} A cene come questa da ragazzo
      entravi dalla porta principale.
    opzioni:
      - testo: "Servire a tavola"
        descrizione: "Una livrea prestata e un vassoio. Marella guarda come servi più di quello che servi."
        prova: { attributo: sociale, abilita: galateo, difficolta: Media }
        successo:
          titolo: Di Stato
          testo: |
            Con una livrea che ti tira sulle spalle porti il pesce in tavola da
            sinistra, e siccome nessuno ti guarda senti tutto. Un consigliere si
            lamenta della Gilda e un altro del Velo, mentre Marella Castaldi
            riporta il discorso sul vino ogni volta che si avvicina troppo a un
            nome. A fine serata la cuoca ti paga e ti dà un pezzo di torta.
          pe: { galateo: 3 }
          effetti: { monete: 6, informazioni.pettegolezzo: 1 }
        fallimento:
          titolo: La salsa
          testo: |
            Al terzo giro la salsa ti scivola dal cucchiaio sulla manica di un
            consigliere. Marella Castaldi ride per prima e dice che a casa sua le
            maniche si macchiano solo per le buone cause, e la tavola ride con
            lei, tranne il consigliere. In cucina la cuoca ti paga metà serata.
          effetti: { monete: 3, scandalo: 1 }
      - testo: "Ascoltare dalla porta di servizio"
        descrizione: "Accanto alla porta a vento fra cucina e sala si sente tutto, se Quintus Vael non ti vede."
        prova: { attributo: fisico, abilita: furtivita, difficolta: Media }
        successo:
          titolo: La porta a vento
          testo: |
            Con un cesto di piatti in mano sembri sempre occupato, e accanto alla
            porta a vento senti quello che i consiglieri dicono quando credono che
            stia parlando qualcun altro. Quintus Vael ti passa accanto due volte,
            e la seconda guarda il tuo cesto, ancora pieno degli stessi piatti,
            così te ne vai prima della terza.
          pe: { furtivita: 3 }
          effetti: { informazioni.pettegolezzo: 1, informazioni.voce: 1 }
        fallimento:
          titolo: Gli stessi piatti
          testo: |
            Quintus Vael ti trova accanto alla porta a vento con un cesto pieno
            degli stessi piatti di un'ora prima. Senza alzare la voce ti
            accompagna per il gomito fino alla porta di servizio, dove ti chiede
            il nome e lo ripete a mezza voce per ricordarselo.
          effetti: { sospetto: 1 }
      - testo: "Lavare i piatti fino a notte"
        descrizione: "Il lavoro più ingrato della serata, pagato quanto gli altri."
        esito:
          titolo: Il lavello
          testo: |
            Passi la sera al lavello accanto a una sguattera che non dice una
            parola, e quando la cuoca non guarda assaggi con un dito le salse che
            tornano dalla sala, una all'arancia che ti resta in bocca fino a casa.
            A mezzanotte hai le mani raggrinzite e qualche moneta in tasca, e la
            sguattera, uscendo, ti saluta per prima.
          pe: { resistenza: 2 }
          effetti: { monete: 4 }
      - testo: "Dire che hai già da fare"
        costo: 0
        esito:
          testo: |
            La cuoca ti guarda come un'aringa andata a male e sceglie il
            passante dopo di te, un ragazzo con le orecchie a sventola che
            sembra contento e ha l'aria di non aver pranzato.

  # ================================================================ la catena di Berengario Lusardi
  - id: carta-qa-lusardi-candelabro
    immagine: icone/candle-holder
    titolo: L'argento dei Lusardi
    sommario: "Davanti alla bottega di un argentiere un vecchio signore cerca di vendere un candelabro, giurando che lo porta a riparare."
    luogo: Quartieri Alti, una bottega d'argentiere dietro la Casa dei Nodi
    tipo: carta
    area: quartieri-alti
    requisiti: [lusardi.passo == 0]
    testo: |
      Sul gradino di una bottega d'argentiere un vecchio signore alto, in un
      soprabito rammendato ai gomiti, tiene fra le mani un candelabro d'argento
      a cinque bracci, uno piegato. «È per la riparazione» ripete, ma il garzone
      compra soltanto a peso. Un passo indietro aspetta una donna anziana con un
      cesto vuoto al braccio.

      Quando si accorge di te fa un mezzo inchino, quello antico. «Berengario
      Lusardi, dei Lusardi del Patto.» Le dita sul candelabro gli sono diventate
      bianche.

      {origine rampollo-dei-quartieri-alti} Il cognome a casa tua si diceva a
      bassa voce, come quello di un parente caduto in disgrazia.
    opzioni:
      - testo: "Aiutarlo a spuntare un prezzo giusto"
        descrizione: "Un candelabro dei tempi del Patto vale più del suo argento, se qualcuno lo sa dire al garzone."
        prova: { attributo: mentale, abilita: politica-ed-economia, difficolta: Media }
        successo:
          titolo: Il prezzo del pezzo
          testo: |
            Chiedi al garzone se il suo padrone compra a peso anche i punzoni
            della prima Gilda. Il padrone guarda il punzone con la lente e paga il
            pezzo come pezzo, e Berengario intasca le monete senza contarle. Poi
            l'argentiere ti confida che quest'anno ha comprato argento di casa da
            molte famiglie, e abbassa la voce soltanto sui cognomi.
          pe: { politica-ed-economia: 4 }
          effetti: { informazioni.voce: 1 }
          imposta: { lusardi.passo: 1 }
        fallimento:
          titolo: A peso
          testo: |
            Provi a spiegare al garzone che cosa ha in mano, e i tuoi conti
            s'inceppano sul titolo dell'argento, così il candelabro va a peso.
            Berengario Lusardi ti ringrazia lo stesso per la buona volontà, con
            una dignità che ti fa più male del garzone.
          imposta: { lusardi.passo: 1 }
          effetti: { scandalo: 0.5 }
      - testo: "Comprarlo tu"
        descrizione: "Pagarlo quello che vale, senza fargli sentire che lo stai comprando."
        requisiti: [monete >= 30]
        esito:
          titolo: In deposito
          testo: |
            Conti le monete nella sua mano prima che il garzone possa dire un
            prezzo. Berengario Lusardi le guarda a lungo, poi si fa dare carta e
            penna per scriverti una ricevuta, *ricevuto in deposito dai Lusardi*.
            «Così non è venduto» dice, e la donna con il cesto si asciuga gli
            occhi con il dorso della mano, molto in fretta.
          effetti: { monete: -30 }
          imposta: { lusardi.passo: 1, lusardi.candelabro: 1 }
      - testo: "Stare al gioco della riparazione"
        descrizione: "Se è una riparazione, è una riparazione. Basta dirlo davanti al garzone come se fosse vero."
        esito:
          titolo: La riparazione
          testo: |
            Dici al garzone, abbastanza forte da farti sentire dal padrone, che il
            braccio piegato si raddrizza in un giorno e che il signore ripasserà a
            ritirarlo. Il garzone capisce, e scrive una ricevuta di riparazione
            con sotto, in piccolo, il prezzo di vendita. «Lei ha il senso delle
            cose» dice Berengario, e ti stringe la mano con due dita, come si
            faceva una volta.
          pe: { galateo: 3 }
          imposta: { lusardi.passo: 1 }
      - testo: "Tirare dritto"
        costo: 0
        esito:
          testo: |
            Lo lasci al suo garzone e al suo candelabro. Girato l'angolo ti
            volti, e il vecchio signore è ancora sul gradino con il candelabro
            stretto al petto, mentre la donna anziana gli tiene una mano sulla
            schiena. Da lontano sembrano una statua sola.

  - id: carta-qa-lusardi-cena
    immagine: icone/meal
    titolo: Una cena in casa Lusardi
    sommario: "Gemma, la serva dei Lusardi, ti porta un invito a cena con un uomo della Casa dei Nodi."
    luogo: Quartieri Alti, Palazzo Lusardi
    tipo: carta
    area: quartieri-alti
    requisiti: [lusardi.passo == 1]
    testo: |
      Gemma, la donna anziana del candelabro, ti porta un invito a cena con lo
      stemma dei Lusardi, una carrucola sopra due corde incrociate. Palazzo
      Lusardi ha dodici finestre sulla facciata e una sedia per stanza, e sui
      muri restano i rettangoli chiari dei quadri venduti.

      Berengario ti prende in disparte. Stasera viene a cena l'uomo della Casa
      dei Nodi che tiene l'ipoteca sul palazzo, e se crederà che i Lusardi
      abbiano ancora amici gliela rinnoverà. «Mi basta un amico di famiglia,
      anche uno conosciuto da poco.»

      {empatia Media} Lo chiede guardando la lanterna appesa al posto del
      lampadario.
    opzioni:
      - testo: "Fare l'amico di famiglia"
        descrizione: "Raccontare all'ospite vent'anni di cene in questa casa, senza sapere dove stanno le posate."
        prova: { attributo: sociale, abilita: [ingannare, galateo], difficolta: Media }
        successo:
          titolo: L'ipoteca
          testo: |
            Ti inventi le estati in campagna dai Lusardi e un cane di nome Ardito
            che rubava le pere, e Berengario ti viene dietro senza sbagliare un
            nome. L'uomo della Casa dei Nodi ascolta mangiando la minestra, e al
            dolce firma il rinnovo sul tavolo. Quando se ne va Berengario resta
            seduto a lungo, con le mani piatte sulla tovaglia perché non tremino.
          pe: { ingannare: 4 }
          effetti: { rep.gilda: 0.5 }
          imposta: { lusardi.passo: 2 }
        fallimento:
          titolo: Il cane
          testo: |
            Ti inventi un cane di nome Ardito proprio mentre Berengario dice che
            era una cagna, e Gemma, sulla porta, chiude gli occhi. L'uomo della
            Casa dei Nodi firma lo stesso, per sei mesi invece che per un anno.
            Berengario lo accompagna alla porta e poi ride, per la prima volta da
            quando lo conosci.
          effetti: { scandalo: 1 }
          imposta: { lusardi.passo: 2 }
      - testo: "Aiutare Gemma in cucina"
        descrizione: "Fra la cucina e la sala c'è un piano di scale, e Gemma ha le ginocchia di quarantun anni."
        esito:
          titolo: Quarantun anni
          testo: |
            Porti su i piatti al posto suo, e lei dai fornelli ti racconta dei
            Lusardi che fecero le prime carrucole dei Ponti, e del padre di
            Berengario, che perse tutto al Daino Zoppo pagando ogni debito
            d'onore. Della cena senti soltanto l'ospite che a un certo punto ride
            a una battuta di Berengario, e Gemma, a quel suono, si fa il segno del
            Velo.
          pe: { empatia: 3 }
          effetti: { informazioni.voce: 1 }
          imposta: { lusardi.passo: 2 }
      - testo: "Declinare l'invito"
        costo: 0
        esito:
          testo: |
            Restituisci il biglietto a Gemma, e lei lo rimette nella tasca del
            grembiule senza piegarlo, per non rovinarlo. Dice che il signore
            capirà, e che un'altra sera la minestra ci sarà ancora, e lo dice
            guardando altrove.

  - id: carta-qa-lusardi-ultima-stanza
    immagine: icone/ring
    titolo: L'ultima stanza
    sommario: "Palazzo Lusardi è venduto. Berengario sta svuotando lo studio, che è l'ultima stanza rimasta, e ti ha fatto chiamare."
    luogo: Quartieri Alti, lo studio di Palazzo Lusardi
    tipo: carta
    area: quartieri-alti
    requisiti: [lusardi.passo == 2]
    testo: |
      Gemma, venuta a chiamarti, ti spiega che il rinnovo dell'ipoteca è
      servito a vendere il palazzo con calma a mercanti di Laresh, e Berengario
      si trasferisce in due stanze al Daino Zoppo. Oggi svuota lo studio,
      l'ultima stanza con qualcosa dentro.

      Sulla scrivania, in una cassetta di legno scuro, c'è la copia dei Lusardi
      del Patto delle Corde avvolta nel lino, con la firma del trisavolo ormai
      marrone, e accanto un anello d'argento con la carrucola dello stemma.

      «Vorrei che qualcosa di questa casa restasse a chi l'ha vista vuota, così
      qualcuno se la ricorda piena» dice Berengario.
    opzioni:
      - testo: "Accettare l'anello"
        descrizione: "Il sigillo dei Lusardi. Nei Quartieri Alti c'è ancora chi lo riconosce."
        esito:
          titolo: La carrucola
          testo: |
            Berengario ti infila l'anello al dito come si fa con i nipoti, e ci
            batte sopra due volte con l'unghia. Ti è largo di mezzo dito. «Con
            questo, nei salotti, ti offriranno la sedia buona. Non lo vendere
            finché sono vivo.» Poi si mette sotto il braccio la cassetta con il
            Patto, e Gemma spegne la lanterna dello studio.
          effetti: { oggetto.sigillo-dei-lusardi: 1 }
          imposta: { lusardi.passo: 3 }
      - testo: "Convincerlo a dare il Patto alla Biblioteca"
        descrizione: "In una stanza del Daino Zoppo il Patto prenderà l'umido. Alla Biblioteca lo leggerebbero, e Ulric Stanne lo pagherebbe."
        prova: { attributo: sociale, abilita: empatia, difficolta: Media }
        successo:
          titolo: Il monocolo
          testo: |
            Alla fine a decidere è Gemma, che dice che alla locanda c'è umido. In
            Biblioteca Ulric Stanne si mette il monocolo e legge ad alta voce la
            firma del trisavolo, mentre Berengario ascolta a occhi chiusi, e paga
            senza discutere. Fuori, sui gradini, Berengario divide la borsa con te
            e ti dice sottovoce chi tiene le ipoteche di mezzo quartiere.
          pe: { empatia: 4 }
          effetti: { monete: 15, informazioni.segreto: 1 }
          imposta: { lusardi.passo: 3 }
        fallimento:
          titolo: Finché ce n'è uno
          testo: |
            Gli parli della Biblioteca e dei suoi scaffali sigillati, e lui ti
            ascolta con educazione fino in fondo. «Il Patto resta con i Lusardi
            finché ce n'è uno» dice, e chiude la cassetta. Poi, per non lasciarti
            andare a mani vuote, ti mette in mano l'anello con la carrucola, come
            se fosse la cosa meno importante della stanza.
          effetti: { oggetto.sigillo-dei-lusardi: 1, tormento: 0.5 }
          imposta: { lusardi.passo: 3 }
      - testo: "Restituirgli il candelabro"
        descrizione: "La ricevuta dice *in deposito*, e il deposito finisce oggi."
        quando: [lusardi.candelabro == 1]
        esito:
          titolo: Cinque candele
          testo: |
            Gli rimetti il candelabro sulla scrivania vuota, insieme alla
            ricevuta. Berengario straccia la ricevuta in quattro e ti rende il
            prezzo e qualcosa di più, perché un deposito, dice, si paga. Gemma
            accende cinque mozziconi di candela trovati in un cassetto, e prima
            che tu esca Berengario ti infila al dito l'anello con la carrucola.
          effetti: { monete: 40, oggetto.sigillo-dei-lusardi: 1, tormento: -0.5 }
          imposta: { lusardi.passo: 3, lusardi.candelabro: 0 }
      - testo: "Tornare un'altra volta"
        costo: 0
        esito:
          testo: |
            Dici a Gemma che oggi non puoi. Lei annuisce e ti avverte che il
            signore resta nello studio fino a domenica, e dopo va alla locanda,
            con quello che entra in una cassetta.

  # ================================================================ carte da più avanti
  - id: carta-qa-asta-dei-malgrani
    immagine: ambientazione/maniero-malgrani
    titolo: L'asta del Maniero
    sommario: "Nel cortile del Maniero Malgrani un banditore del Comune vende all'asta quello che resta della casata, un lotto alla volta."
    luogo: Quartieri Alti, il cortile del Maniero Malgrani
    tipo: carta
    area: quartieri-alti
    requisiti: [pista.pelle >= 7, visto.carta-qa-asta-dei-malgrani == 0]
    testo: |
      Nel cortile del Maniero Malgrani, fra le statue degli antenati consumate
      dalla pioggia, un banditore del Comune vende quello che resta della
      casata. Sotto il portico il busto di Brandano Malgrani ha un diciassette
      scritto col gesso sulla fronte, e in prima fila Isotta Cordani alza il
      ventaglio per ogni specchio.

      In fondo al portico ci sono le casse dei lotti chiusi, che si vendono
      inchiodate. *In una di quelle c'è il museo di Ottone, o quello che ne
      hanno lasciato le guardie.*

      {percezione Media} Quella che due facchini portano in due ha i chiodi
      nuovi.
    opzioni:
      - testo: "Fare un'offerta per una cassa chiusa"
        descrizione: "Le casse si vendono inchiodate, e del contenuto parlano solo il peso e le occhiate del banditore."
        requisiti: [monete >= 40]
        prova: { attributo: mentale, abilita: [percezione, politica-ed-economia], difficolta: Media }
        successo:
          titolo: Il lotto ventitré
          testo: |
            Scegli la cassa con i chiodi nuovi e alzi la mano una volta sola,
            tardi, quando Isotta Cordani ha già voltato la testa. Dentro, nella
            paglia, c'è un congegno dei Precursori con un'etichetta scritta a mano
            da Ottone. Sotto trovi un cristallo che pulsa ancora e alcune scaglie
            incise, avvolte in una pagina del catalogo dove Ottone ha scritto *non
            esporre* e l'ha sottolineato due volte.
          effetti: { monete: -40, reliquie.meccanismo-spento: 1, cristalli.cristallo-carico: 1, reliquie.frammento-inciso: 2 }
          imposta: { visto.carta-qa-asta-dei-malgrani: 1 }
        fallimento:
          titolo: Probabilmente niente
          testo: |
            La cassa che scegli è leggera, e dovevi capirlo dai chiodi vecchi.
            Dentro ci sono cocci di cristallo spento avvolti in una livrea verde e
            due scaglie di metallo che il catalogo di Ottone chiama *probabilmente
            niente*, mentre Isotta Cordani sorride dietro il ventaglio.
          effetti: { monete: -40, cristalli.frammento-esausto: 4, reliquie.scheggia: 2, scandalo: 0.5 }
          imposta: { visto.carta-qa-asta-dei-malgrani: 1 }
      - testo: "Guardare chi compra che cosa"
        descrizione: "A un'asta si capisce chi ha soldi da spendere e chi fa finta di averli."
        esito:
          titolo: Il ventaglio
          testo: |
            Ti appoggi a una colonna e guardi i ventagli più dei lotti. Isotta
            Cordani compra gli specchi, e un uomo della Casa dei Nodi compra in
            blocco le carte di Ottone senza guardarle, perché sa già che cosa c'è
            scritto o vuole che nessuno lo legga. I busti degli antenati restano
            invenduti, e il banditore li cede a un muratore per riempire un muro.
          effetti: { informazioni.pettegolezzo: 1 }
          imposta: { visto.carta-qa-asta-dei-malgrani: 1 }
      - testo: "Tirare dritto"
        costo: 0
        esito:
          testo: |
            Dal cancello senti il martello del banditore battere tre volte. Un
            ragazzo esce di corsa dal cortile con in braccio un cavallo a
            dondolo dipinto di verde, e se lo porta via ridendo, con la vernice
            che gli resta sulle mani.

  - id: carta-qa-programma-della-promessa
    immagine: icone/drama-masks
    titolo: Il programma della Promessa
    sommario: "In una pasticceria una ragazza ha in mano il programma della *Promessa dell'Arpia*, dove c'è il tuo nome."
    luogo: Quartieri Alti, una pasticceria sotto i portici
    tipo: carta
    area: quartieri-alti
    requisiti: [pista.teatro >= 2]
    testo: |
      In una pasticceria sotto i portici una ragazza con i guanti bianchi ti
      fissa tenendo in mano il programma sgualcito della *Promessa dell'Arpia*.
      Sua madre sfoglia un libro di preghiere senza leggerlo.

      Orazio Belcanto fa stampare in fondo al programma anche i nomi di chi
      lavora dietro le quinte, e la ragazza li ha letti tutti. Ti viene vicino,
      rossa fino alle orecchie, e con la punta del guanto indica una riga e ti
      chiede se sei tu.

      {galateo Media} La madre tiene gli occhi sul libro, e in questo quartiere
      vuol dire che ascolta ogni parola.
    opzioni:
      - testo: "Firmarle il programma"
        descrizione: "Una firma sul margine, accanto al tuo nome stampato piccolo."
        esito:
          titolo: La firma
          testo: |
            Le firmi il programma sul margine, accanto al tuo nome stampato in
            piccolo. Per ringraziarti lei ti racconta che cosa succede nei palchi
            durante il terzo atto, quando le luci della sala sono basse e i
            signori credono che nessuno li veda. La madre volta pagina senza
            alzare gli occhi, e sorride.
          pe: { espressivita: 2 }
          effetti: { informazioni.voce: 2 }
      - testo: "Accettare l'invito della madre"
        descrizione: "Giovedì la madre riceve, e un uomo di teatro fa sempre figura, se racconta le quinte nel tono giusto."
        prova: { attributo: sociale, abilita: [galateo, espressivita], difficolta: Media }
        successo:
          titolo: Il ricevimento
          testo: |
            Il giovedì dopo racconti a un salotto pieno la sera della prima vista
            dalle quinte, mentre la ragazza ti suggerisce i dettagli dal fondo
            della sala muovendo le labbra. Alla fine la madre ti fa scivolare in
            mano una busta, con la discrezione che si usa per i musicisti, e in
            testa ti restano i nomi di tre famiglie che vorrebbero un palco
            migliore.
          pe: { galateo: 3 }
          effetti: { monete: 8, informazioni.pettegolezzo: 1 }
        fallimento:
          titolo: Il tono sbagliato
          testo: |
            Al ricevimento ti fanno parlare fra il violinista e il dolce, e
            racconti le quinte come si raccontano in taverna, con le parolacce dei
            macchinisti. La padrona di casa ti ringrazia prima che tu abbia
            finito, e il violinista, per carità, attacca subito.
          effetti: { scandalo: 1 }
      - testo: "Dirle che si sbaglia"
        costo: 0
        esito:
          testo: |
            Le dici che ti scambia per un altro. Lei arrossisce ancora di più e
            torna al suo tavolino, dove la cioccolata ormai è fredda. Mentre
            esci la vedi rileggere il programma riga per riga, e poi cercarti
            con gli occhi attraverso la vetrina.

  - id: carta-qa-predicatore-della-stella
    immagine: icone/star-formation
    titolo: Il predicatore della stella
    sommario: "In piazza un uomo su un barile annuncia che la Dama d'Argento scenderà dalla stella color lavanda."
    luogo: Quartieri Alti, la piazza davanti alla Casa dei Nodi
    tipo: carta
    area: quartieri-alti
    requisiti: [pista.dama-argento >= 11]
    testo: |
      In piazza un uomo con la barba lunga, in piedi su un barile, porta al
      collo una tavola con una stella viola chiaro e la scritta *Mawrak'Thur*.
      Dice che la Dama d'Argento gridata dagli orchi durante la razzia scenderà
      dalla stella color lavanda a pesare le case dei Quartieri Alti con una
      bilancia d'argento.

      All'angolo due guardie del Velo aspettano. Quel nome tu l'hai sentito in
      posti peggiori, e la mascella ti si serra ogni volta che lui lo grida.

      {origine fuggiasco-di-ghoran} A Ghoran i sorveglianti usavano quella
      parola per la Marea Grigia, e la dicevano piano.
    opzioni:
      - testo: "Ascoltarlo fino in fondo"
        descrizione: "Dice cose sbagliate con troppa convinzione, e per capire cosa sa davvero bisogna lasciarlo finire."
        prova: { attributo: mentale, abilita: resilienza, difficolta: Media }
        successo:
          titolo: La bilancia d'argento
          testo: |
            Lo ascolti finché la voce gli si arrochisce. Sotto le stelle e le
            bilance c'è poco di vero, perché l'uomo era in Città Bassa la notte
            della razzia e ha sentito gli orchi gridare, e il resto ce l'ha messo
            di suo. Te ne vai con due o tre cose che in piazza nessun altro ha
            notato.
          pe: { resilienza: 3 }
          effetti: { informazioni.voce: 2 }
        fallimento:
          titolo: La notte dopo
          testo: |
            Lo ascolti troppo, e la sera la stella sopra i tetti ti sembra più
            vicina di quanto dovrebbe. Quella notte sogni una bilancia d'argento
            sospesa sopra il Ponte del Pesce, e ti svegli con le mani strette sul
            bordo del letto.
          effetti: { tormento: 1 }
      - testo: "Chiedergli dove ha sentito quel nome"
        descrizione: "Chi grida in piazza di solito ha paura di qualcosa. Bisogna aspettare che scenda e offrirgli da bere."
        prova: { attributo: sociale, abilita: empatia, difficolta: Facile }
        successo:
          titolo: Il fornaio
          testo: |
            Senza la tavola al collo, davanti a un bicchiere, è un fornaio di Via
            del Salmone che la notte della razzia ha visto bruciare il forno del
            cognato, e predicare quel nome gli serve a toglierselo dalla testa.
            Prima di salutarti ti dice in quale taverna l'ha sentito ripetere
            anche dopo la razzia, e da chi.
          pe: { empatia: 3 }
          effetti: { informazioni.pettegolezzo: 1 }
        fallimento:
          titolo: Il sermone
          testo: |
            Gli tocchi il braccio quando scende, e lui risale sul barile e ti
            indica alla piazza, gridando che anche tu sai di che cosa parla. Venti
            teste si girano verso di te, e all'angolo le due guardie del Velo
            adesso guardano te.
          effetti: { scandalo: 1 }
      - testo: "Avvisare le guardie del Velo"
        descrizione: "Le guardie aspettano soltanto che qualcuno si lamenti."
        esito:
          titolo: Due dita sotto il gomito
          testo: |
            Dici alle guardie che l'uomo spaventa la serva con la cesta. Loro
            attraversano la piazza senza fretta e lo aiutano a scendere dal barile
            con due dita sotto il gomito, e lui si lascia portare via senza
            smettere di parlare. Una delle guardie, tornando, scrive il tuo nome
            accanto a una crocetta che, a giudicare dal suo cenno, è una crocetta
            buona.
          effetti: { sospetto: -0.5 }
      - testo: "Tirare dritto"
        costo: 0
        esito:
          testo: |
            Attraversi la piazza senza fermarti e senza voltarti. Il predicatore
            ti segue con gli occhi per un tratto, poi trova un altro passante da
            guardare.
