# Le occasioni "ovunque" (ottobre 2026): nove carte che arrivano in tutti e tre i quartieri della città, ma non
# fuori città né nelle spedizioni (area `ovunque`). Le scene stanno in strade, mercati e piazze qualunque, e non
# nominano un quartiere. Le altre dieci carte "ovunque" sono quelle delle negative, in crisi/*.yaml.
#
# RISTORO (insolite, ripetibili, con rintocchi <= 30; l'effetto è il netto più il rintocco dell'opzione)
#   carta-ov-caffe-dei-vaporieri       ferite < 6. L'intruglio dei vaporieri (+8 netti e ½ Ferite), la tazza
#                                      allungata dei vecchi (+4 netti), lasciarla sul banco.
#   (La campana in ritardo è stata tolta il 24 ottobre 2026: Luca ha tenuto un solo ristoro per zona.)
#
# TESORI (rari; spariscono quando hai l'oggetto)
#   carta-ov-collezionista-forestiero  pista.capomozzo >= 10. Gli indovinelli (Mentale Difficile: accademiche,
#                                      percezione o politica-ed-economia) oppure un meccanismo spento in baratto:
#                                      astrolabio-del-forestiero (accessorio +2). Ascoltarlo (PE), lasciarlo.
#   carta-ov-braccio-di-ferro          pista.dama-argento >= 6. Fisico + Resistenza Difficile con una posta:
#                                      bracciale-del-lottatore (accessorio +1, riconoscibile). Scommettere su di
#                                      lui, guardare gli incontri (PE), tirare dritto.
#
# AGGUATI (inevitabili, insoliti, ripetibili)
#   carta-ov-lama-nella-calca          ferite < 6. Percezione o Rissa (fallendo, Ferite), oppure la borsa tagliata;
#                                      poi il seguito carta-ov-lama-nella-calca-dopo: inseguirlo (scontro nuovo
#                                      ov-la-lama-nella-calca) o lasciarlo andare (una voce).
#   carta-ov-porta-di-casa             casa >= 1 e scandalo < 6. Un ricattatore sul gradino della casa nel Vicolo
#                                      dei Cardatori: pagarlo, dargli un segreto, minacciarlo (intimidire),
#                                      lasciare che parli (Scandalo). Senza combattimento.
#
# LE LETTERE SENZA MITTENTE (mini-Cronaca di quattro passi, comune; lettere.passo da 0 a 4, lettere.fine)
#   0  carta-ov-lettere-il-pacco       ritirare il pacco, aprirlo (Mentale), seguire chi lo prende (Furtività) → 1.
#   1  carta-ov-lettere-la-seconda     la lettera sa una cosa della tua origine (un paragrafo per origine, con i
#                                      fatti dei prologhi): rispondere, confrontare la grafia (Mentale), chiedere
#                                      chi vende segreti (Sociale) → 2.
#   2  carta-ov-lettere-il-favore      riprendere una lettera dal cassetto di un prestatore su pegno: la finestra
#                                      (Fisico), una scusa sulla porta (Sociale), un ragazzino dei tetti (monete) → 3.
#   3  carta-ov-lettere-lo-scrivano    chi scrive è uno scrivano pubblico dei portici, che scrive le lettere di chi
#                                      non sa scrivere e rivende quello che ci legge. Chiude con il premio intero:
#                                      pagarlo con un segreto (fine 1), ringraziarlo (fine 2), consegnarlo alla
#                                      Caserma (fine 3) → 4.
#   I fallimenti dei passi intermedi non fanno avanzare e costano ½ di una negativa.
#
# Nomi nuovi: nessuno. Lo scrivano, il collezionista, il lottatore e il ricattatore restano senza nome. Edda,
# Tecla e Arrigo vengono da economia/casa.yaml.
# I prezzi stanno negli effetti e nei requisiti, mai nella prosa (docs/stile-dei-testi.md, regola 11).

quality:
  - { id: lettere.passo, nome: "Le lettere senza mittente", categoria: stato, nascosta: true, descrizione: "A che punto sei con le lettere senza firma. 0 prima della prima lettera, 1 dopo il pacco, 2 dopo la seconda lettera, 3 dopo il favore, 4 quando sai chi scrive." }
  - { id: lettere.fine, nome: "Lo scrivano dei portici", categoria: stato, nascosta: true, descrizione: "Come è finita con lo scrivano che ti mandava le lettere senza firma.", scelte: { 1: "l'hai pagato con un segreto perché bruciasse il tuo foglio", 2: "l'hai ringraziato, e adesso è un amico", 3: "l'hai consegnato alla Caserma" } }

oggetti:
  - id: astrolabio-del-forestiero
    nome: Astrolabio del forestiero
    immagine: icone/astrolabe
    descrizione: "Un astrolabio d'ottone da taschino, con i dischi incisi fitti per un cielo che non è questo. Il collezionista che te l'ha dato diceva che l'ottone si scalda in tasca e lavora meglio, e aveva ragione."
    slot: accessorio
    grado: 2
    proprieta: { talento: { accademiche: 1, percezione: 1 } }

  - id: bracciale-del-lottatore
    nome: Bracciale del lottatore
    immagine: icone/bracer
    descrizione: "Un bracciale di cuoio con le borchie di rame, consumato all'interno dal polso di chi l'ha portato per anni. Il lottatore che l'ha perso racconta in giro a chi l'ha lasciato, e mezza città lo riconosce."
    slot: accessorio
    grado: 1
    proprieta: { talento: { rissa: 1, resistenza: 1 } }
    difetti: [riconoscibile]

nemici:
  - id: ov-lama-della-calca
    nome: Accoltellatore della calca
    immagine: icone/knife-thrust
    descrizione: "Un uomo magro con il cappuccio tirato e una lama corta nella manica. Lavora nella calca dei mercati, e quando la borsa non basta usa la lama."
    attacco: 3
    difesa: 3
    difesaMentale: 2
    pf: 6
    danno: 1
    iniziativa: 3
    puoFuggire: true

scontri:
  - { id: ov-la-lama-nella-calca, nome: "La lama nella calca", nemici: [ov-lama-della-calca], feriteSconfitta: 2 }

storylet:
  # ================================================================ ristoro
  - id: carta-ov-caffe-dei-vaporieri
    immagine: icone/coffee-cup
    titolo: Il caffè dei vaporieri
    sommario: "Al banco dei vaporieri si beve un intruglio nero che tiene in piedi per due turni di fila. Il conto lo paga il corpo."
    luogo: In città, un banco all'angolo del mercato
    tipo: carta
    area: ovunque
    rarita: insolita
    requisiti: [rintocchi <= 30, ferite < 6]
    testo: |
      All'angolo del mercato c'è un banco di assi dove i vaporieri fanno colazione prima del turno. Sono quelli
      che badano alle caldaie delle pompe e alle valvole delle fenditure, e hanno il dorso delle mani lucido di
      vecchie scottature. La padrona del banco versa da una cuccuma annerita un intruglio denso che odora di
      pane bruciato.

      Un vaporiere con i baffi bruciacchiati ti allunga una tazza. «Tieni, questo ti regge due turni» dice. «Poi
      però il cuore va per conto suo fino a sera, e domani ti fa male la testa.»

      {resistenza Media} Le mani dei vaporieri tremano appena intorno alle tazze. È il tremito di chi ne beve tre
      al giorno da vent'anni.
    opzioni:
      - testo: "Bere il caffè dei vaporieri"
        descrizione: "Ti tiene in piedi a lungo, e il corpo te lo fa pagare."
        esito:
          titolo: Due turni
          testo: |
            Lo bevi in tre sorsi, perché i vaporieri ti guardano. È amaro e lascia
            sulla lingua un sapore di ruggine. Poco dopo hai gli occhi spalancati e
            le dita che tamburellano da sole sul banco. Per ore cammini più svelt{o|a}
            di tutti, e verso sera arriva il mal di testa, puntuale come aveva detto
            il vaporiere.
          effetti: { rintocchi: 9, ferite: 0.5 }
      - testo: "Farlo allungare con latte e miele"
        descrizione: "La tazza dei vaporieri anziani. Regge meno, e non presenta il conto."
        esito:
          titolo: La tazza dei vecchi
          testo: |
            La padrona sbuffa e ci versa dentro latte e un cucchiaio di miele, come
            fa per i vaporieri che hanno già i capelli bianchi. Il vaporiere con i
            baffi ride e ti chiama apprendista. Così il caffè è dolce e tiepido, e
            ti sveglia senza strattoni.
          effetti: { rintocchi: 5 }
      - testo: "Lasciare la tazza sul banco"
        descrizione: "Il cuore ti va bene com'è."
        costo: 0
        esito:
          testo: |
            Ringrazi e rimetti la tazza sul banco. Il vaporiere con i baffi alza le
            spalle e se la beve lui in un sorso solo, prima di avviarsi verso le
            caldaie.

  # ================================================================ tesori
  - id: carta-ov-collezionista-forestiero
    immagine: icone/open-treasure-chest
    titolo: Il collezionista forestiero
    sommario: "Un collezionista di fuori città baratta i suoi pezzi soltanto con chi risponde ai suoi indovinelli."
    luogo: In città, un tavolino in un angolo della piazza
    tipo: carta
    area: ovunque
    rarita: rara
    requisiti: [avuto.astrolabio-del-forestiero == 0, pista.capomozzo >= 10]
    testo: |
      In un angolo della piazza un uomo anziano ha aperto un tavolino pieghevole davanti a un baule di cuoio. È
      arrivato con l'ultima carovana e porta un cappotto da viaggio con più tasche di quante ne servano. Sul
      tavolino ci sono pochi pezzi, ognuno con il suo cartellino scritto a mano. Al centro c'è un astrolabio
      d'ottone da taschino con i dischi incisi fitti.

      «Io non vendo, scambio» dice a chi si ferma. «Tre indovinelli per l'astrolabio, e chi li scioglie tutti se
      lo porta via. Oppure mi porta un congegno dei Precursori di quelli interi, e facciamo l'affare senza
      indovinelli.»

      {accademiche Difficile} I dischi non segnano le stelle di questo cielo. Chi li ha incisi li ha copiati con
      pazienza da uno strumento molto più vecchio, e ha rispettato anche gli errori.
    opzioni:
      - testo: "Rispondere agli indovinelli"
        descrizione: "Tre indovinelli di fila, davanti a chi si è fermato a guardare. Lui li sceglie difficili."
        prova: { attributo: mentale, abilita: [accademiche, percezione, politica-ed-economia], difficolta: Difficile }
        successo:
          titolo: Il terzo indovinello
          testo: |
            Il primo parla di una torre che cammina, e la risposta è un'ombra. Il
            secondo è un conto di mercanti e di pesi, e lo sciogli con le dita sotto
            il tavolino. Prima del terzo il collezionista ti guarda a lungo, e tu
            rispondi prima che abbia finito di chiederlo. Ride e ti mette in mano
            l'astrolabio. «Lo tenga nel taschino, che l'ottone si scalda e lavora
            meglio» dice.
          pe: { accademiche: 4 }
          effetti: { oggetto.astrolabio-del-forestiero: 1 }
        fallimento:
          titolo: Davanti a mezza piazza
          testo: |
            Il primo lo sciogli, e il secondo anche. Al terzo resti a bocca aperta
            davanti ai curiosi, e la risposta ti arriva quando il collezionista l'ha
            già detta ad alta voce. Qualcuno fra la gente applaude lui. Lui ti batte
            una mano sul braccio e ti dice di riprovare la prossima volta che passa
            in città.
          effetti: { scandalo: 0.5 }
      - testo: "Offrirgli un meccanismo spento"
        requisiti: [reliquie.meccanismo-spento >= 1]
        descrizione: "Un congegno dei Precursori rimontato e intero. Per lui vale più di qualunque risposta."
        esito:
          titolo: Uno scambio onesto
          testo: |
            Posi il meccanismo sul tavolino e il collezionista inforca gli occhiali.
            Lo gira fra le dita a lungo e ascolta i giunti, poi lo avvolge in un
            panno come si fa con un neonato. Ti spinge davanti l'astrolabio senza
            contrattare. «Questo lo cercavo da vent'anni. L'astrolabio è suo, e il
            grazie lo dico io» dice.
          effetti: { reliquie.meccanismo-spento: -1, oggetto.astrolabio-del-forestiero: 1 }
      - testo: "Ascoltarlo parlare dei suoi pezzi"
        descrizione: "Non costa niente, e uno che ha girato tanto sa molte cose."
        esito:
          titolo: I cartellini
          testo: |
            Per ogni pezzo sul tavolino il collezionista ha una storia, e te le
            racconta tutte. Il pugnale col manico d'osso viene da un mercato di
            Ghoran, e la conchiglia di pietra da un fondale che adesso è una
            montagna. Su qualche storia esagera e lo sa. Quando la carovana riparte
            hai la testa piena di posti lontani.
          pe: { accademiche: 3 }
      - testo: "Lasciarlo ai suoi curiosi"
        costo: 0
        esito:
          testo: |
            Lasci il collezionista al suo tavolino. Dietro di te sta già facendo il
            primo indovinello a un garzone, che si gratta la testa con il manico
            della scopa.

  - id: carta-ov-braccio-di-ferro
    immagine: icone/biceps
    titolo: Il braccio di ferro
    sommario: "Un lottatore forestiero gira i quartieri sfidando chiunque a braccio di ferro, con il suo bracciale in palio."
    luogo: In città, davanti a una taverna
    tipo: carta
    area: ovunque
    rarita: rara
    requisiti: [avuto.bracciale-del-lottatore == 0, pista.dama-argento >= 6]
    testo: |
      Davanti a una taverna hanno rovesciato una botte per farne un tavolo, e intorno si è radunata una piccola
      folla. Dietro la botte siede un lottatore forestiero con le spalle larghe come una porta e un bracciale di
      cuoio e rame al polso destro. Gira per i quartieri da una settimana e non ha ancora perso.

      «Chi vince prende il bracciale, e chi perde mi lascia la sua posta» dice con l'accento dei clan di Ghoran.
      Un facchino si allontana massaggiandosi il polso.

      {rissa Media} Tiene il gomito più avanti del dovuto, e così il polso lavora meno della spalla. Se reggi la
      prima spinta si stanca prima di te.

      {origine fuggiasco-di-ghoran} Quell'accento lo riconosceresti anche al buio. Lui però ha le mani libere e
      un bracciale che si è guadagnato, e ti guarda come guarda tutti gli altri.
    opzioni:
      - testo: "Sfidarlo"
        requisiti: [monete >= 15]
        descrizione: "La tua posta contro il suo bracciale. Bisogna reggere la sua spinta più a lungo di quanto lui regga la tua."
        prova: { attributo: fisico, abilita: resistenza, difficolta: Difficile }
        successo:
          titolo: Il dorso della mano
          testo: |
            Lui spinge subito con tutta la spalla, e tu tieni il polso dritto mentre
            il braccio ti brucia fino al collo. La folla smette di gridare. Poi la
            sua mano comincia a scendere piano, e quando il dorso tocca il legno la
            botte rimbomba. Il lottatore si sfila il bracciale e te lo allaccia lui.
            «È tuo. Domani giro un altro quartiere e racconto chi me l'ha tolto»
            dice.
          pe: { resistenza: 4 }
          effetti: { oggetto.bracciale-del-lottatore: 1 }
        fallimento:
          titolo: La posta sulla botte
          testo: |
            Reggi la prima spinta e anche la seconda. Alla terza ti cede il polso
            prima della spalla, e la tua mano finisce sul legno con un colpo che
            senti fino al gomito. Metti la posta sulla botte mentre la folla ride, e
            per due giorni non riesci a chiudere bene le dita.
          effetti: { monete: -15, ferite: 0.5 }
      - testo: "Scommettere su di lui"
        requisiti: [monete >= 3]
        descrizione: "Contro un facchino di passaggio è una scommessa sicura, e paga poco."
        esito:
          titolo: Il facchino
          testo: |
            Punti qualche moneta sul lottatore quando si siede un facchino con le
            braccia da scaricatore. L'incontro dura meno di quanto ci metti a contare
            la posta. Ritiri la vincita da un ragazzo che tiene il banco e sbuffa
            perché hai puntato sul favorito.
          effetti: { monete: 3 }
      - testo: "Guardare un paio di incontri"
        descrizione: "Si impara anche dal bordo della folla."
        esito:
          titolo: Il gomito
          testo: |
            Ti metti in prima fila e guardi tre incontri di seguito. Il lottatore
            vince sempre allo stesso modo, e lascia che l'altro spinga finché non
            sente il gomito tremare. Ti accorgi che il tuo polso si muove con il
            suo, e il ragazzo accanto a te ti guarda storto.
          pe: { rissa: 3 }
      - testo: "Tirare dritto"
        costo: 0
        esito:
          testo: |
            Lasci la folla intorno alla botte. Dietro di te un altro sfidante si
            sputa sulle mani, e la gente ricomincia a contare.

  # ================================================================ agguati
  - id: carta-ov-lama-nella-calca
    immagine: icone/knife-thrust
    titolo: La lama nella calca
    sommario: "Nella folla del mercato una lama cerca il tuo fianco."
    luogo: In città, nella calca del mercato
    tipo: carta
    area: ovunque
    rarita: insolita
    inevitabile: true
    requisiti: [ferite < 6]
    testo: |
      A quest'ora il mercato è così pieno che si cammina di fianco. Una donna ti spinge con un cesto di cavoli, e
      un garzone ti pesta un piede senza scusarsi. Davanti a te un uomo magro con il cappuccio tirato si gira di
      colpo e ti viene incontro controcorrente.

      Tiene la mano destra nella manica, e dalla manica spunta la punta di una lama corta.

      {conoscenze-della-strada Facile} È il vecchio giro della calca. Ti urtano due volte perché guardi
      dall'altra parte, e intanto il terzo colpisce.
    opzioni:
      - testo: "Guardare la mano invece della faccia"
        descrizione: "Se vedi arrivare la lama in tempo, ti scansi."
        costo: 0
        prova: { attributo: mentale, abilita: percezione, difficolta: Media }
        successo:
          titolo: Di un palmo
          testo: |
            Vedi la lama uscire dalla manica e ti giri di fianco. La punta ti strappa
            la giubba senza trovare la carne. L'uomo ti finisce addosso con tutto il
            peso, e gli vedi da vicino la faccia butterata. Poi si divincola e si
            butta nella calca.
          pe: { percezione: 3 }
          segue: carta-ov-lama-nella-calca-dopo
        fallimento:
          titolo: Il fianco
          testo: |
            Guardi il cappuccio invece della mano, e la lama ti entra nel fianco
            sopra la cintura. Lì per lì sembra un pugno. Poi senti il caldo che ti
            bagna la camicia, e l'uomo si è già girato verso la calca.
          effetti: { ferite: 1 }
          segue: carta-ov-lama-nella-calca-dopo
      - testo: "Afferrargli il polso"
        descrizione: "Da così vicino la lama si ferma con le mani, se sei svelt{o|a} abbastanza."
        costo: 0
        prova: { attributo: fisico, abilita: rissa, difficolta: Media }
        successo:
          titolo: Il polso storto
          testo: |
            Gli prendi il polso mentre la lama esce dalla manica e glielo giri verso
            l'esterno finché senti il gomito cedere. Lui lancia un grido acuto che
            nella calca nessuno nota. La lama gli resta in mano, ma lui adesso ha
            fretta di andarsene. Ti dà una testata sulla spalla e scappa fra la
            gente.
          pe: { rissa: 3 }
          segue: carta-ov-lama-nella-calca-dopo
        fallimento:
          titolo: La mano sbagliata
          testo: |
            Afferri la manica invece del polso, e la stoffa ti scivola fra le dita.
            La lama ti apre il dorso della mano e poi il fianco, con due colpi
            rapidi. L'uomo si è già girato verso la calca quando ti accorgi del
            sangue.
          effetti: { ferite: 1 }
          segue: carta-ov-lama-nella-calca-dopo
      - testo: "Parare con la borsa"
        requisiti: [monete >= 5]
        descrizione: "La borsa delle monete fra te e la lama. Perdi qualche moneta e nemmeno una goccia di sangue."
        costo: 0
        esito:
          titolo: La borsa tagliata
          testo: |
            Ti porti la borsa davanti al fianco, e la lama apre lei invece di te.
            Una manciata di monete rotola fra i piedi della gente e metà sparisce
            prima che tu possa chinarti. L'uomo ne raccoglie una manciata e scappa
            nella calca.
          effetti: { monete: -5 }
          segue: carta-ov-lama-nella-calca-dopo

  - id: carta-ov-lama-nella-calca-dopo
    immagine: icone/knife-thrust
    titolo: Il cappuccio nella folla
    sommario: "L'uomo con la lama scappa fra i banchi del mercato. Si può ancora inseguirlo."
    tipo: seguito
    area: citta-bassa
    ripetibile: true
    testo: |
      Il cappuccio dell'uomo va su e giù fra le teste a una ventina di passi da te, verso il fondo del mercato.
      Corre curvo e spinge la gente di lato, e la folla si apre e si richiude dietro di lui. Fra poco arriverà ai
      vicoli dietro i banchi.

      Intorno a te nessuno ha visto niente, o fa finta. Una fruttivendola raccoglie da terra le sue mele senza
      guardarti.
    opzioni:
      - testo: "Inseguirlo"
        descrizione: "Fra i banchi e poi nei vicoli. Ha ancora la lama in mano."
        costo: 0
        combattimento: ov-la-lama-nella-calca
        vittoria:
          titolo: Il vicolo del pesce
          testo: |
            Lo raggiungi in un vicolo che puzza di pesce, dove ha sbagliato strada.
            Si difende con la lama e con le ginocchia finché lo metti giù contro una
            catasta di casse. Nella giubba ha altre borse tagliate oltre alla tua.
            Le guardie arrivano quando hai già finito, e una ti chiede se ti serve
            un medico.
          effetti: { monete: 20 }
        sconfitta:
          titolo: Fra le casse
          testo: |
            Nel vicolo ti aspetta. Ti sbatte contro una catasta di casse e ti lascia
            un taglio sul braccio, e mentre sei a terra ti sfila la borsa dalla
            cintura con due dita. Lo senti ridere fino in fondo al vicolo.
          effetti: { monete: -10 }
      - testo: "Lasciarlo andare"
        descrizione: "Non vale la pena di inseguire una lama in un vicolo."
        costo: 0
        esito:
          titolo: Le mele
          testo: |
            Lo guardi sparire fra i banchi e ti sistemi la giubba. La fruttivendola
            finisce di raccogliere le mele e ti dice a mezza voce che è il terzo
            questa settimana. Secondo lei lavora per uno che compra le borse tagliate
            dietro il mercato del pesce, la sera, a metà del loro valore.
          effetti: { informazioni.voce: 1 }

  - id: carta-ov-porta-di-casa
    immagine: icone/door-watcher
    titolo: Qualcuno sulla porta di casa
    sommario: "Sul gradino della tua casa nel Vicolo dei Cardatori ti aspetta un uomo con un foglio piegato in quattro."
    luogo: Il Vicolo dei Cardatori, davanti alla tua porta
    tipo: carta
    area: ovunque
    rarita: insolita
    inevitabile: true
    requisiti: [casa >= 1, scandalo < 6]
    testo: |
      Quando torni a casa trovi un uomo seduto sul tuo gradino nel Vicolo dei Cardatori. Ha un cappello unto e si
      batte sul ginocchio un foglio piegato in quattro. Si alza senza fretta e ti saluta per nome.

      «Ah, eccoti. Ti aspettavo, {amico mio|amica mia}» dice. «Qui c'è scritto quello che hai fatto giorno per
      giorno, e in fondo ci sono le firme di due testimoni. Se non lo compri tu, domani sera lo leggo ad alta voce alla fontana e il
      vicolo viene a sentire.»

      Alla finestra di fronte Tecla ha smesso di girare le sue candele.

      {intimidire Media} Tiene il foglio con due dita e il peso sulla gamba che porta via. Ha già preso qualche
      pugno nella vita, e non gli è piaciuto.
    opzioni:
      - testo: "Pagarlo"
        requisiti: [monete >= 20]
        descrizione: "Compri il foglio e il suo silenzio. Lui sa dove abiti."
        costo: 0
        esito:
          titolo: Il foglio nel camino
          testo: |
            Conti le monete sul gradino e lui le fa sparire nel cappello. Ti dà il
            foglio e se ne va fischiettando verso la fontana. Lo bruci nel camino
            senza leggerlo tutto. Le firme in fondo non le conosci, e questo ti
            tiene svegli{o|a} più a lungo di quello che c'era scritto sopra.
          effetti: { monete: -20 }
      - testo: "Dargli un segreto in cambio"
        requisiti: [informazioni.segreto >= 1]
        descrizione: "Lui vive di fogli come questo. Il segreto di qualcun altro gli frutta più del tuo."
        costo: 0
        esito:
          titolo: Fra colleghi
          testo: |
            Gli racconti all'orecchio un segreto che non è tuo. Lui ascolta con gli
            occhi chiusi, e alla fine sorride con tutti i denti che gli restano. Ti
            lascia il foglio sul gradino e se ne va chiamandoti collega, abbastanza
            forte perché Tecla lo senta.
          effetti: { informazioni.segreto: -1 }
      - testo: "Minacciarlo"
        descrizione: "Uno così si spaventa in fretta, se gli parli nel modo giusto."
        costo: 0
        prova: { attributo: sociale, abilita: intimidire, difficolta: Media }
        successo:
          titolo: Il gradino
          testo: |
            Scendi un gradino verso di lui e gli spieghi a voce bassa che cosa
            succede a chi si siede davanti alla tua porta. Lui ti guarda le mani e
            poi il vicolo vuoto alle tue spalle. Lascia cadere il foglio e se ne va
            prima camminando e poi di corsa. Sotto il tuo nome, sul foglio, ce ne
            sono altri del vicolo.
          pe: { intimidire: 3 }
          effetti: { informazioni.pettegolezzo: 1 }
        fallimento:
          titolo: Alla fontana
          testo: |
            Alzi la voce, e lui alza la sua più di te. In un momento mezzo vicolo è
            alle finestre, e lui legge il foglio dal primo rigo all'ultimo scandendo
            le date. Poi se ne va dicendo a tutti che l'hai minacciato. Il giorno
            dopo un vicesceriffo passa a chiedere di te.
          effetti: { scandalo: 1, sospetto: 0.5 }
      - testo: "Lasciare che parli"
        descrizione: "Che lo legga pure alla fontana. Nel vicolo ognuno ha i suoi guai."
        costo: 0
        esito:
          titolo: Ognuno ha i suoi
          testo: |
            Gli dici di fare come vuole e apri la porta. La sera dopo lo senti
            leggere alla fontana con una voce da banditore, e per qualche giorno
            le comari smettono di parlare quando passi. Arrigo invece ti saluta come
            sempre dalla sua bottega. «Mah. Qui ognuno ha i suoi guai» dice.
          effetti: { scandalo: 1 }

  # ================================================================ le lettere senza mittente
  - id: carta-ov-lettere-il-pacco
    immagine: icone/envelope
    titolo: Una lettera senza firma
    sommario: "Una lettera senza mittente ti chiede di ritirare un pacco dall'altra parte della città."
    luogo: In città, per strada
    tipo: carta
    area: ovunque
    requisiti: [lettere.passo == 0, lettere.fine == 0]
    testo: |
      La lettera te la mette in mano un ragazzino, che sparisce prima che tu possa chiedergli chi la manda. La
      carta è buona e la grafia minuta e regolare è di qualcuno che scrive per mestiere, ma in fondo manca la
      firma.

      Ti chiede di ritirare un pacco da una merciaia, in una strada dall'altra parte della città dove non metti
      mai piede. Il pacco va lasciato chiuso nella nicchia di un muro dietro un lavatoio. In fondo alla lettera
      chi scrive avverte che saprà se l'hai aperto.

      {percezione Facile} Le lettere sono tutte uguali, come stampate. Solo la erre ha un ricciolo in più, di
      quelli che si insegnano agli scrivani.
    opzioni:
      - testo: "Ritirare il pacco e lasciarlo nella nicchia"
        descrizione: "Una passeggiata dall'altra parte della città, senza domande."
        esito:
          titolo: La merciaia
          testo: |
            La merciaia ti consegna il pacco senza chiederti niente, come se ti
            aspettasse da giorni. È leggero e legato con lo spago degli scrivani. Lo
            lasci nella nicchia dietro il lavatoio e te ne vai senza voltarti. La
            mattina dopo il ragazzino ti trova di nuovo e ti mette in mano qualche
            moneta avvolta in un foglio bianco.
          effetti: { monete: 5 }
          imposta: { lettere.passo: 1 }
      - testo: "Aprire il pacco senza lasciare segni"
        descrizione: "Lo spago degli scrivani ha un nodo suo. Se lo riconosci, lo sai anche rifare."
        prova: { attributo: mentale, abilita: [percezione, accademiche], difficolta: Media }
        successo:
          titolo: Il nodo degli scrivani
          testo: |
            Dentro ci sono lettere con la stessa grafia minuta, tutte senza firma.
            Le leggi in fretta sotto un portico. Parlano di debiti e di matrimoni
            combinati fra gente che non conosci. Qualche nome però ti resta in
            mente. Rifai il
            nodo come l'hai trovato e lasci il pacco nella nicchia dietro il lavatoio.
          pe: { percezione: 3 }
          effetti: { informazioni.voce: 2 }
          imposta: { lettere.passo: 1 }
        fallimento:
          titolo: Lo spago spezzato
          testo: |
            Lo spago si spezza al primo nodo, e quello che rifai si vede da lontano.
            Lasci il pacco nella nicchia lo stesso. Il giorno dopo il ragazzino te lo
            riporta con un biglietto sotto lo spago che dice *riportalo chiuso*.
            Quella notte ti svegli due volte a controllare la porta.
          effetti: { tormento: 0.5 }
      - testo: "Seguire chi viene a prenderlo"
        descrizione: "Lasciare il pacco e aspettare sotto un portico. Chi scrive manderà qualcuno."
        prova: { attributo: fisico, abilita: furtivita, difficolta: Media }
        successo:
          titolo: Verso i portici
          testo: |
            Aspetti sotto un portico fino a sera. Il pacco lo prende lo stesso
            ragazzino della lettera, che si guarda intorno due volte e poi corre
            verso un mercato. Lo perdi fra i banchi, vicino ai portici dove gli
            scrivani pubblici tengono i loro tavolini.
          pe: { furtivita: 3 }
          imposta: { lettere.passo: 1 }
        fallimento:
          titolo: Non così
          testo: |
            Il ragazzino arriva, ti vede sotto il portico e tira dritto fischiando.
            Il pacco resta nella nicchia tutta la notte, e la mattina dopo non c'è
            più. Più tardi ti ritrovi in tasca un biglietto che dice *non così*.
            Eppure tutto il giorno nessuno ti si è avvicinato.
          effetti: { tormento: 0.5 }
      - testo: "Mettere la lettera in tasca"
        descrizione: "La merciaia può tenersi il pacco ancora un po'."
        costo: 0
        esito:
          testo: |
            Pieghi la lettera in quattro e la metti in tasca. Per oggi dall'altra
            parte della città non ci vai.

  - id: carta-ov-lettere-la-seconda
    immagine: icone/wax-seal
    titolo: La seconda lettera
    sommario: "La seconda lettera senza firma sa una cosa del tuo passato che in città non hai detto a nessuno."
    luogo: In città, per strada
    tipo: carta
    area: ovunque
    requisiti: [lettere.passo == 1]
    testo: |
      La seconda lettera te la ritrovi infilata nella cintura mentre paghi un venditore di frittelle, e non hai
      sentito nessuna mano. La grafia minuta e regolare è la stessa, con il ricciolo sulla erre.

      Comincia con un ringraziamento per il pacco. Poi chi scrive parla di te con lo stesso tono, e racconta una
      cosa che in città non hai mai detto a nessuno.

      {origine figlio-della-citta-bassa} Racconta del carro del falò. Sa che quel pomeriggio ti avevano pagato
      mezza giornata per scaricarne la pece, e che il carrettiere ti chiamava {ragazzo mio|ragazza mia}. Nessuno
      sa che avevi in mano quella pece poche ore prima che prendesse fuoco.

      {origine apprendista-raschiatore} Racconta della porta nord. Sa che quando sono scese le macchine ti sei
      alzat{o|a} con il boccale in mano a cercare una scala che in superficie non c'è, e ai Raschiatori non l'hai
      mai detto.

      {origine accolito-del-velo} Racconta della tenda sotto il palco. Sa che hai visto Padre Vantes diventare più
      grigio a ogni ferita che chiudeva, e che in Cattedrale non ne hai parlato con nessuno, nemmeno con Ottilia
      Sanvel.

      {origine rampollo-dei-quartieri-alti} Racconta della tavola di casa tua. Sa che dopo la razzia, a cena, ti
      capita di posare la forchetta accanto al piatto e di restare a guardarla. Una cosa così la vede soltanto
      chi serve a quella tavola.

      {origine mercante-dei-ponti} Racconta del tuo banco il giorno del Festival. Sa che quando l'uomo è caduto
      davanti a te hai guardato la fibbia d'argento del suo mantello prima della faccia, e sa dove tieni la
      cassa dell'incasso.

      {origine figlio-del-circolo} Racconta del Festival. Sa che a mezzogiorno sei rimast{o|a} un'ora in piazza a
      guardare le farfalle foglia-rossa con il naso all'insù, e che sei sces{o|a} in città soltanto per quelle.
      In città questa ragione te la sei sempre tenuta per te.

      {origine fuggiasco-di-ghoran} Racconta di Ghoran. Sa della bilancia su cui gli schiavi si vendono a peso, e
      sa che ci sei salit{o|a} anche tu prima di scappare. In città nessuno lo sa, e hai fatto di tutto perché
      restasse così.

      {origine allievo-di-torvessa} Racconta del banco dell'Accademia il giorno del Festival. Sa che i sei
      cristalli hanno vibrato tutti insieme poco prima che le macchine scendessero dai tetti. Orvald
      Temmerin non ne ha mai parlato a lezione, e tu non l'hai raccontato a nessuno.

      In fondo chi scrive ti assicura che vuole soltanto farti sapere con chi parli. La nicchia dietro il
      lavatoio è ancora lì.
    opzioni:
      - testo: "Lasciare una risposta nella nicchia"
        descrizione: "Due righe per chiedere che cosa vuole. Magari chi scrive risponde."
        esito:
          titolo: Due righe
          testo: |
            Scrivi due righe su un pezzo di carta da pacchi e le lasci nella nicchia
            dietro il lavatoio. Chiedi soltanto che cosa vuole. Il giorno dopo la
            carta non c'è più, e al suo posto c'è un sasso liscio, messo lì perché
            tu sappia che l'ha letta.
          imposta: { lettere.passo: 2 }
      - testo: "Confrontare la grafia con quella degli scrivani"
        descrizione: "Quel ricciolo sulla erre lo insegnano in poche scuole. Bisogna girare i tavolini degli scrivani pubblici."
        prova: { attributo: mentale, abilita: [percezione, accademiche], difficolta: Media }
        successo:
          titolo: Il ricciolo
          testo: |
            Passi una mattina a farti scrivere biglietti inutili dagli scrivani
            pubblici, uno per mercato. Al quarto tavolino il ricciolo sulla erre è
            identico, e lo scrivano ha le maniche sporche dello stesso inchiostro.
            Paghi il biglietto senza alzare gli occhi, e te ne vai sapendo dove
            cercare.
          pe: { percezione: 3 }
          imposta: { lettere.passo: 2 }
        fallimento:
          titolo: Tutte uguali
          testo: |
            Ti fai scrivere biglietti da mezza città, e dopo il terzo mercato tutte
            le erre ti sembrano uguali. Alla fine hai le tasche piene di carta
            inutile e le dita che sanno d'inchiostro. Quella notte sogni righe
            minute scritte sul soffitto della stanza.
          effetti: { tormento: 0.5 }
      - testo: "Chiedere in giro chi vende segreti"
        descrizione: "Chi sa queste cose le ha comprate da qualcuno. Le taverne sanno da chi."
        prova: { attributo: sociale, abilita: conoscenze-della-strada, difficolta: Media }
        successo:
          titolo: Chi vende carta
          testo: |
            Offri da bere in due taverne e ascolti molto. Alla fine un facchino ti
            dice che in città i segreti li vende chi scrive le lettere degli altri,
            perché la gente detta allo scrivano cose che non direbbe al prete. Già
            che c'è, ti racconta anche chi ha comprato qualcosa di recente.
          effetti: { informazioni.voce: 2 }
          imposta: { lettere.passo: 2 }
        fallimento:
          titolo: Troppe domande
          testo: |
            Fai troppe domande nella taverna sbagliata, e un uomo al bancone comincia
            a farne a te. Te ne vai presto. Per due giorni ti sembra di vedere lo
            stesso cappello dietro di te in tutti i mercati.
          effetti: { sospetto: 0.5 }
      - testo: "Rimettere la lettera in tasca"
        descrizione: "Ci penserai quando avrai la testa per farlo."
        costo: 0
        esito:
          testo: |
            Pieghi la lettera e la spingi in fondo alla tasca, sotto il fazzoletto.
            La nicchia può aspettare.

  - id: carta-ov-lettere-il-favore
    immagine: icone/quill-ink
    titolo: La terza lettera
    sommario: "Chi ti scrive senza firma adesso ti chiede un favore, e il favore è pericoloso."
    luogo: In città, per strada
    tipo: carta
    area: ovunque
    requisiti: [lettere.passo == 2]
    testo: |
      La terza lettera arriva con un ragazzino diverso, che aspetta finché non l'hai letta tutta. Stavolta chi
      scrive va dritto al punto.

      Una sua lettera è finita nelle mani sbagliate. Ce l'ha un prestatore su pegno che tiene bottega sotto i
      portici di un mercato e dorme nella stanza di sopra. La lettera è nel cassetto della scrivania, e presto il
      prestatore la venderà a chi paga di più. Chi scrive ti chiede di riprenderla di notte e promette di pagarti
      come si deve. Ti avverte anche che il prestatore tiene un bastone ferrato accanto al letto, e che lo usa.

      {furtivita Media} La stanza di sopra avrà una finestra sul cortile, e i cortili dei mercati di notte sono
      pieni di casse vuote da cui salire.

      Il ragazzino aspetta la risposta con le mani in tasca.
    opzioni:
      - testo: "Entrare dalla finestra del cortile"
        descrizione: "Di notte, dalle casse vuote alla finestra e poi al cassetto. Il prestatore ha il sonno leggero."
        prova: { attributo: fisico, abilita: [furtivita, acrobazia], difficolta: Media }
        successo:
          titolo: Il cassetto
          testo: |
            Sali sulle casse e la finestra si apre con una spinta del coltello. Il
            prestatore russa con la bocca aperta e il bastone appoggiato al
            comodino. Il cassetto cigola a metà, e tu aspetti che il russare riprenda
            prima di tirarlo ancora. La lettera è sopra le altre, legata con lo spago
            degli scrivani.
          pe: { furtivita: 4 }
          imposta: { lettere.passo: 3 }
        fallimento:
          titolo: Il bastone ferrato
          testo: |
            Una cassa si sfonda sotto il tuo piede quando hai già la mano sul
            davanzale. Il prestatore si sveglia e arriva alla finestra con il bastone
            prima che tu sia a terra, e ti prende sulla spalla. Scappi per il cortile
            mentre lui grida al ladro a tutto il mercato.
          effetti: { ferite: 0.5, sospetto: 0.5 }
      - testo: "Farti aprire con una scusa"
        descrizione: "Un pegno urgente da trattare a tarda sera. Bisogna tenerlo occupato mentre la tua mano trova il cassetto."
        prova: { attributo: sociale, abilita: [ingannare, persuasione], difficolta: Media }
        successo:
          titolo: Il pegno urgente
          testo: |
            Bussi a tarda sera con un anello che non vale niente e una storia di
            debiti e di una sposa che aspetta. Il prestatore ti fa entrare in camicia
            da notte e va a prendere la bilancia nel retro. Il cassetto della
            scrivania si apre senza rumore. Quando torna hai la lettera sotto la
            giubba, e sull'anello hai cambiato idea.
          pe: { ingannare: 4 }
          imposta: { lettere.passo: 3 }
        fallimento:
          titolo: Al ladro
          testo: |
            La storia regge finché lui non ti vede la mano sul cassetto. Grida al
            ladro con una voce che sveglia tutti i portici, e devi uscire di corsa
            mentre si accendono le finestre. Domani qualcuno descriverà la tua
            faccia alle guardie.
          effetti: { scandalo: 0.5, sospetto: 0.5 }
      - testo: "Pagare un ragazzino dei tetti"
        requisiti: [monete >= 15]
        descrizione: "Ci sono ragazzini che entrano dalle finestre per mestiere. Costano, e non fanno domande."
        esito:
          titolo: Il ragazzino dei tetti
          testo: |
            Il ragazzino della lettera conosce uno che lo fa per mestiere, e lo
            trovate seduto su un tetto a mangiare castagne. Contratta come un
            mercante e vuole essere pagato prima. All'alba ti porta la lettera
            sporca di fuliggine, e si offre già per il prossimo lavoro.
          effetti: { monete: -15 }
          imposta: { lettere.passo: 3 }
      - testo: "Dire al ragazzino di tornare un'altra sera"
        descrizione: "Stanotte no."
        costo: 0
        esito:
          testo: |
            Dici al ragazzino che stanotte non puoi. Lui alza le spalle e ti dice che
            allora torna un'altra sera, perché il prestatore la lettera non l'ha
            ancora venduta.

  - id: carta-ov-lettere-lo-scrivano
    immagine: icone/quill
    titolo: Lo scrivano
    sommario: "La quarta lettera ti porta al tavolino di uno scrivano pubblico. Adesso sai chi ti scrive, e devi decidere che farne."
    luogo: In città, sotto i portici di un mercato
    tipo: carta
    area: ovunque
    requisiti: [lettere.passo == 3]
    testo: |
      La quarta lettera ti dà un posto e un'ora. È il tavolino di uno scrivano pubblico sotto i portici di un
      mercato, con le pile di fogli sotto una tettoia di tela. Lo scrivano è un uomo grigio e minuto con le
      maniche nere d'inchiostro. Quando la vecchia che gli stava dettando una lettera se ne va, ti fa segno di
      sederti.

      «Siediti, siediti. Prima gli affari» dice, e posa la penna. «Chi non sa scrivere viene da me, e nelle
      lettere la gente parla degli altri. Di te hanno parlato in parecchi. Io compro e vendo quello che leggo, e
      mi serviva qualcuno che non avesse paura delle finestre.»

      Prende la lettera del prestatore e la fa sparire nel tavolino. Poi spinge verso di te una borsa pesante e
      tira fuori un foglio scritto fitto, con il tuo nome in cima.

      {empatia Media} Ha le mani ferme, ma sotto il tavolino il piede non smette di battere. Ha messo la borsa
      fra voi due apposta, perché non sa come andrà a finire.
    opzioni:
      - testo: "Pagarlo con un segreto perché bruci il tuo foglio"
        requisiti: [informazioni.segreto >= 1]
        descrizione: "Lui compra quello che sa. Il segreto di qualcun altro in cambio del foglio con il tuo nome."
        esito:
          titolo: La carta che brucia
          testo: |
            Gli dici all'orecchio quello che sai, e lui lo annota su un foglietto con
            la sua grafia minuta. Poi avvicina il tuo foglio alla candela del
            tavolino e lo tiene finché la fiamma non gli arriva alle dita. Ti mette
            in mano la borsa. «Siamo pari, e a te non scrivo più» dice.
          effetti: { monete: 200, informazioni.segreto: -1 }
          imposta: { lettere.passo: 4, lettere.fine: 1 }
      - testo: "Ringraziarlo e tenerlo come amico"
        descrizione: "Uno che sa tante cose è meglio averlo dalla propria parte. Il foglio resta a lui."
        esito:
          titolo: Un amico sotto i portici
          testo: |
            Lo ringrazi per la paga e per l'avvertimento, e gli lasci il foglio. Lui
            sorride per la prima volta e ti versa un dito di vino in un bicchiere
            sbeccato. Prima che tu te ne vada ti racconta gratis per chi ha scritto
            lettere questa settimana, come si fa con gli amici. Da quel giorno alza
            la penna per salutarti quando passi sotto i portici.
          effetti: { monete: 200, informazioni.pettegolezzo: 1 }
          imposta: { lettere.passo: 4, lettere.fine: 2 }
      - testo: "Consegnarlo alla Caserma"
        descrizione: "Chi vende i segreti degli altri ha una taglia sulla testa, e la Caserma la paga."
        esito:
          titolo: La taglia
          testo: |
            La sera stessa torni con due guardie. Lo scrivano non scappa e raccoglie
            con cura i suoi fogli in una cassetta. Lasci la sua borsa sul tavolino
            come prova, e il sergente ti paga una taglia che vale altrettanto. Nei
            giorni dopo lo scrivano racconta alle guardie quello che sa di mezza
            città, e anche di te.
          effetti: { monete: 200, rep.caserma: 0.5, scandalo: 0.5 }
          imposta: { lettere.passo: 4, lettere.fine: 3 }
      - testo: "Dirgli che ci devi pensare"
        costo: 0
        esito:
          testo: |
            Gli dici che ci devi pensare. Lui annuisce e rimette nel tavolino il
            foglio e la borsa. «Sono qui tutti i giorni, tranne quando piove» dice.
