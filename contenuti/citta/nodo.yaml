# La città viva, luogo 3: il Mercato dei Nodi e il Nodo d'Ossidiana (presso: mercato-dei-nodi, area
# ponti-sospesi). Le commissioni di Ambrin, il servizio nuovo (le Formule precuriane, che in città non insegna
# nessuno), le tre storie di rep.nodo (2 il corvo del bancone, 4 il cassetto chiuso, 6 socio del Nodo, ognuna
# con il suo flag) e la carta dell'acquirente. Le botteghe, `il-nodo-d-ossidiana`, `il-banco-di-ambrin`,
# `il-banco-dei-conti` e `ricucire-gramm` ci sono già.
# Reputazione: le storie la portano a 3, 5 e 7; la stima e il pacco la fanno salire fino a 4, il banco tenuto da
# solo e la stima dei reperti fino a 6, così la catena è percorribile. Con nodo.socio le commissioni rendono di più.
storylet:
  # ------------------------------------------------------------ l'attività ripetibile
  - id: le-commissioni-di-ambrin
    presso: mercato-dei-nodi
    immagine: ambientazione/nodo-d-ossidiana
    titolo: Le commissioni di Ambrin
    sommario: "Ambrin Qell non lascia il bancone, e al Mercato dei Nodi c'è sempre qualcosa da andare a prendere o da stimare."
    luogo: Il Nodo d'Ossidiana, il bancone
    area: ponti-sospesi
    ripetibile: true
    testo: |
      Chiusa la porta del Nodo d'Ossidiana, il vocio del Mercato resta fuori
      tutto in una volta. Due lanterne a cristallo pendono dalle travi fra i
      talismani, e sul bancone, un unico tronco scavato, qualcuno ha inciso a
      punta di coltello una tacca per ogni cliente che ha provato a rubare.

      Ambrin Qell, con un foglio di commissioni e una penna che perde, si scosta
      una ciocca rossa dalla fronte e ci lascia una riga d'inchiostro. «Eccoti.
      Ho tre cose da fare fuori e un paio di mani sole» dice. Il corvo, chino
      sulla lista, sembra leggerla anche lui.
    opzioni:
      - testo: "Stimare un oggetto"
        descrizione: "Un Raschiatore ha portato una scatola di roba dalle rovine, e Ambrin vuole sapere quanto vale."
        requisiti: [rep.nodo < 2]
        prova: { attributo: mentale, abilita: [percezione, politica-ed-economia], difficolta: Media }
        successo:
          titolo: La scatola del Raschiatore
          testo: |
            Rovesci la scatola. Quasi tutto è ferraglia da vendere a peso, ma in
            fondo c'è un anello di metallo verdastro inciso così fitto che le
            linee si vedono solo con la lente, e dici che da solo vale più del
            resto. Ambrin paga al Raschiatore il prezzo giusto e a te allunga
            qualche moneta, mentre il corvo gracchia una volta, che da queste
            parti è un complimento.
          effetti: { monete: 2, rep.nodo: 0.5 }
        fallimento:
          titolo: Ferro a peso
          testo: |
            Stimi tutta la scatola al prezzo della ferraglia, con una sicurezza
            che non sai da dove ti venga. Ambrin infila due dita nel mucchio e ne
            tira fuori un ingranaggio grande come un'unghia, che chiude in un
            cassetto sorridendo fra sé. Ti dà lo stesso qualche spicciolo, e tu lo
            prendi guardando altrove.
          effetti: { monete: 1 }

      - testo: "Stimare un oggetto"
        descrizione: "Ormai Ambrin ti lascia fare il prezzo davanti al cliente, e poi controlla senza dire niente."
        requisiti: [rep.nodo >= 2, rep.nodo < 4]
        prova: { attributo: mentale, abilita: [percezione, politica-ed-economia], difficolta: Media }
        successo:
          titolo: La bussola del padre
          testo: |
            Il cliente è un fabbro in pensione che vuole vendere la bussola di suo
            padre e intanto non la molla. Il vetro è graffiato, ma la cassa è
            d'argento vero, con il punzone di un orefice dei Quartieri Alti. Fai
            il prezzo ad alta voce e il fabbro accetta con un sospiro. Ambrin non
            corregge niente, e a sera ti dà la paga con un extra.
          effetti: { monete: 3, rep.nodo: 0.5 }
        fallimento:
          titolo: L'argento falso
          testo: |
            Il cliente è un fabbro in pensione che vuole vendere la bussola di suo
            padre. Dici che la cassa è d'argento, e Ambrin ci passa sopra l'unghia
            e ti mostra l'ottone sotto la doratura, mentre il fabbro se la
            riprende un po' offeso. Ambrin ti spiega con gentilezza che l'argento
            vero è più freddo sotto le dita, e che la prossima volta lo tocchi
            prima di parlare.

      - testo: "Andare a prendere un pacco"
        descrizione: "Alla Dispensa di Gramm c'è un pacco di reagenti per Ambrin, da ritirare dal vicolo e portare chiuso."
        immagine: personaggi/nestor-gramm
        requisiti: [rep.nodo < 4]
        quando: [pista.pelle < 4, colpo.dispensa == 0]
        prova: { attributo: fisico, abilita: [furtivita, conoscenze-della-strada], difficolta: Media }
        successo:
          titolo: Il vicolo
          testo: |
            Nestor Gramm ti passa il pacco dalla porta socchiusa senza una parola,
            e con il pacco esce un odore di zolfo. Nel punto più stretto del Ponte
            delle Mille Corde un ragazzino ti striscia contro la giubba, ma il
            pacco l'avevi già spostato sul braccio lontano dalla folla. Ambrin lo
            mette sotto il bancone senza aprirlo e ti allunga qualche moneta.
          effetti: { monete: 2, rep.nodo: 0.5 }
        fallimento:
          titolo: Lo spago tagliato
          testo: |
            Nestor ti passa il pacco dalla porta socchiusa. Sul Ponte delle Mille
            Corde senti appena uno strattone, e quando abbassi gli occhi lo spago
            è tagliato e metà delle erbe sono già nel vuoto sopra la Cicatrice.
            Ambrin pesa quello che resta e scrive la differenza sul registro alla
            voce *ponte*, che a quanto pare aveva già messo in conto.

      - testo: "Andare a prendere un pacco"
        descrizione: "Alla Dispensa di Gramm adesso il pacco di reagenti lo consegna un garzone, e va portato chiuso come sempre."
        immagine: ambientazione/dispensa-di-gramm
        requisiti: [rep.nodo < 4]
        quando: [pista.pelle >= 4]
        prova: { attributo: fisico, abilita: [furtivita, conoscenze-della-strada], difficolta: Media }
        successo:
          titolo: La ricevuta
          testo: |
            Alla porta del vicolo ti apre un ragazzo con il grembiule di Nestor,
            che gli arriva alle caviglie. Dice che il padrone non torna e ti fa
            firmare una ricevuta che lui non sa leggere. Torni al Nodo per i
            passaggi più affollati, con il pacco sotto il braccio, e Ambrin conta
            le boccette e ti dà la paga, più qualcosa da portare al ragazzo.
          effetti: { monete: 2, rep.nodo: 0.5 }
        fallimento:
          titolo: Le boccette sbagliate
          testo: |
            Il garzone di Nestor ti consegna un pacco, e solo al Nodo, quando
            Ambrin lo apre, scoprite che dentro c'è un unguento per i calli. Torni
            indietro a cambiarlo, e sul Ponte delle Mille Corde qualcuno ti sfila
            il fazzoletto con una delicatezza quasi affettuosa. Ambrin dice che
            con il garzone va così tutte le settimane, e intanto si spalma un po'
            d'unguento sul pollice.

      - testo: "Andare a prendere un pacco"
        descrizione: "Alla Dispensa di Gramm adesso il pacco di reagenti lo consegna un garzone, e va portato chiuso come sempre."
        immagine: ambientazione/dispensa-di-gramm
        requisiti: [rep.nodo < 4]
        quando: [pista.pelle < 4, colpo.dispensa >= 1]
        prova: { attributo: fisico, abilita: [furtivita, conoscenze-della-strada], difficolta: Media }
        successo:
          titolo: La ricevuta
          testo: |
            Alla porta del vicolo ti apre un ragazzo con il grembiule di Nestor,
            che gli arriva alle caviglie. Dice che il padrone non torna e ti fa
            firmare una ricevuta che lui non sa leggere. Torni al Nodo per i
            passaggi più affollati, con il pacco sotto il braccio, e Ambrin conta
            le boccette e ti dà la paga, più qualcosa da portare al ragazzo.
          effetti: { monete: 2, rep.nodo: 0.5 }
        fallimento:
          titolo: Le boccette sbagliate
          testo: |
            Il garzone di Nestor ti consegna un pacco, e solo al Nodo, quando
            Ambrin lo apre, scoprite che dentro c'è un unguento per i calli. Torni
            indietro a cambiarlo, e sul Ponte delle Mille Corde qualcuno ti sfila
            il fazzoletto con una delicatezza quasi affettuosa. Ambrin dice che
            con il garzone va così tutte le settimane, e intanto si spalma un po'
            d'unguento sul pollice.

      - testo: "Trattare con un cliente difficile"
        descrizione: "Un cliente rivuole indietro i soldi di un anello, e parla abbastanza forte da farsi sentire dal Mercato."
        prova: { attributo: sociale, abilita: [persuasione, ingannare], difficolta: Media }
        successo:
          titolo: L'anello che stringe
          testo: |
            Il mercante della Gilda ha le dita grosse ed è convinto che l'anello
            comprato al Nodo lo faccia sognare male. Lo lasci sfogare, poi gli fai
            notare che l'anello gli stringe il dito fino a farlo diventare viola,
            e che con un dito così sogneresti male anche tu. Se ne va dal
            gioielliere a farlo allargare, senza i soldi indietro, e Ambrin ti
            paga bene.
          effetti: { monete: 3 }
        fallimento:
          titolo: Il rimborso
          testo: |
            Il mercante della Gilda sostiene che l'anello comprato al Nodo lo fa
            sognare male. Alzi la voce per primo e lui la alza più di te, finché
            fuori dalla porta si ferma un capannello di curiosi. Alla fine Ambrin
            gli rende i soldi sorridendo e rimette l'anello sotto il vetro, sicuro
            che entro un mese tornerà a ricomprarlo.

      - testo: "Dare da mangiare al corvo"
        descrizione: "Nel cassetto sotto il bancone c'è un sacchetto di semi e di bacche secche. La carne no, dice Ambrin."
        immagine: personaggi/ambrin-qell
        requisiti: [nodo.corvo == 0]
        esito:
          titolo: I semi
          testo: |
            Versi i semi in un piattino di peltro e lo spingi verso il corvo, che
            guarda a lungo il piattino e poi te. Mangia solo quando ti volti a
            sistemare uno scaffale, e quando ti giri è già tornato al suo posto.
            Ambrin dice che è già molto, e che a lui ci sono voluti mesi prima di
            vederlo mangiare.
          pe: { addestrare-animali: 2 }
      - testo: "Dare da mangiare al corvo"
        descrizione: "Il corvo ti conosce, ormai. I semi e le bacche secche sono nel solito cassetto."
        immagine: personaggi/ambrin-qell
        requisiti: [nodo.corvo >= 1]
        esito:
          titolo: Dalla mano
          testo: |
            Il corvo scende dal bancone appena apri il cassetto, e i semi li
            prende dal tuo palmo uno alla volta, con un colpo di becco preciso che
            non fa mai male. Le bacche invece le mette in fila sul bancone in
            ordine di grandezza. Ambrin dice che le tiene per i clienti che gli
            piacciono, e che non ha mai capito che cosa ci faccia.
          pe: { addestrare-animali: 2 }

      - testo: "Stare al banco da solo"
        descrizione: "Ambrin è alla Casa dei Nodi, e per un pomeriggio il bancone è tuo, sotto gli occhi del corvo."
        requisiti: [rep.nodo >= 4, rep.nodo < 6, nodo.socio == 0]
        prova: { attributo: sociale, abilita: [persuasione, empatia], difficolta: Media }
        successo:
          titolo: Il pomeriggio al banco
          testo: |
            Vendi uno specchietto da viaggio a una ragazza che voleva solo
            guardare, e convinci un Raschiatore a non vendere il coltello di suo
            fratello per il prezzo di una cena. Quando Ambrin torna legge il
            registro dall'inizio, ti dà una manciata di monete e ti chiede del
            coltello. Gli dici che non c'è nel registro perché non l'hai comprato,
            e lui ride così forte che deve sedersi.
          effetti: { monete: 4, rep.nodo: 0.5 }
        fallimento:
          titolo: Il registro vuoto
          testo: |
            Il pomeriggio passa senza clienti, a parte una donna che chiede la
            strada per il Grifone e un uomo che vuole sapere se compri gatti. Solo
            all'ultima ora ti accorgi che il cartello era girato su *chiuso*, e il
            corvo, che lo sapeva, si è guardato bene dal dirtelo. Ambrin ti dà
            qualche spicciolo per la compagnia che gli hai fatto.
          effetti: { monete: 1 }

      - testo: "Stimare un pezzo dei Precursori"
        descrizione: "Quando un Raschiatore porta un reperto vero, adesso Ambrin chiama prima te e resta ad ascoltare dal retrobottega."
        immagine: ambientazione/rovine-dei-precursori
        requisiti: [rep.nodo >= 4, rep.nodo < 6, nodo.socio == 0]
        prova: { attributo: mentale, abilita: [percezione, accademiche], difficolta: Difficile }
        successo:
          titolo: Il cilindro d'ottone
          testo: |
            Il Raschiatore posa sul bancone un cilindro d'ottone con una fessura
            tutto intorno, e dentro senti un fruscio come di sabbia.

            {accademiche Difficile} Una nota a margine sui cilindri dei Precursori
            diceva di lasciarli chiusi, e lo diceva due volte.

            Dici che è vero e che vale il doppio di quanto chiede, purché nessuno
            lo apra. Ambrin lo paga quanto hai detto e ti allunga una borsa ben
            fornita.
          effetti: { monete: 4, rep.nodo: 0.5 }
        fallimento:
          titolo: La fessura
          testo: |
            Il Raschiatore posa sul bancone un cilindro d'ottone con una fessura
            tutto intorno, e tu ci infili l'unghia per vedere se si apre. Si apre,
            e ne cola un filo di sabbia grigia finché il cilindro resta vuoto e
            leggero. Ambrin lo compra lo stesso a metà prezzo, ti ricorda che i
            Precursori le cose non le chiudevano per caso e ti dà una paga magra.
          effetti: { monete: 1 }

      - testo: "Comprare per il Nodo"
        descrizione: "Da socio, compri dai Raschiatori per conto della bottega. Una parte di quello che porti è tua."
        immagine: ambientazione/mercato-dei-nodi
        requisiti: [nodo.socio >= 1]
        prova: { attributo: mentale, abilita: [politica-ed-economia, percezione], difficolta: Media }
        successo:
          titolo: La tua parte
          testo: |
            Al Grifone una squadra appena risalita svuota i sacchi su un tavolo, e
            prima degli altri compratori della Gilda ti prendi due cristalli
            sterili e una lente precuriana incrinata, pagandoli meno del previsto.
            Ambrin rivende la lente prima di sera e dalla cassa ti conta la tua
            parte senza che tu la chieda.
          effetti: { monete: 10 }
        fallimento:
          titolo: Il prezzo della Gilda
          testo: |
            Al Grifone arrivi dopo un compratore della Gilda che ha già scelto il
            meglio, e ti restano gli ingranaggi. Li paghi troppo, perché la
            squadra ha capito che hai fretta. Ambrin li rivende un po' per volta,
            e a fine settimana, insieme alla tua parte magra, ti dà un consiglio
            sull'ora a cui risalgono le squadre.
          effetti: { monete: 3 }

      - testo: "Mandare ad Ambrin un cliente del tuo banco"
        descrizione: "Dal tuo banco sui Ponti passa gente che cerca cose che vende Ambrin, e lui la segnalazione la paga."
        quando: [origine.mercante-dei-ponti >= 1]
        prova: { attributo: sociale, abilita: [persuasione, politica-ed-economia], difficolta: Media }
        successo:
          titolo: Il cliente giusto
          testo: |
            Al tuo banco si ferma una donna di Laresh che cerca un amuleto contro
            il mal di mare. La accompagni al Nodo d'Ossidiana parlando dei noli
            per tutta la strada, perché non cambi idea. Ambrin le mostra tre
            amuleti e lei ne compra due, e quando se ne va ti fa scivolare sul
            bancone qualche moneta, come si fa con quello che non va sul registro.
          effetti: { monete: 2 }
        fallimento:
          titolo: La gratitudine
          testo: |
            Mandi al Nodo un mercante di stoffe che cerca un regalo per la moglie,
            e gli spieghi la strada con tanta cura che lui, per gratitudine,
            compra un fazzoletto ricamato al banco accanto al tuo e al Nodo non
            arriva mai. Quando la sera glielo racconti Ambrin ride e ti versa un
            dito del tè che tiene sotto il bancone per i giorni storti.

      - testo: "Fare il prezzo a una squadra che conosci"
        descrizione: "Una squadra con cui hai fatto qualche turno porta al Nodo il carico della settimana, e con te contratta meno."
        quando: [origine.apprendista-raschiatore >= 1]
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Media }
        successo:
          titolo: Il carico della settimana
          testo: |
            La squadra rovescia il sacco sul bancone e i quattro guardano te
            invece di Ambrin. Dividi la roba, quello che si accende da una parte e
            quello che vale a peso dall'altra, e fai il prezzo guardando il più
            giovane, che il sacco l'ha portato su. Il caposquadra accetta, e
            Ambrin, dandoti la tua parte, dice che con i Raschiatori gli costi
            meno di una lite.
          effetti: { monete: 2 }
        fallimento:
          titolo: Un pezzo di troppo
          testo: |
            Dividi la roba come si fa sulle piattaforme, e un cilindro che non hai
            mai visto lo metti fra quelli buoni per farti bello con la squadra.
            Ambrin lo batte piano contro il bancone, e suona come ferro vuoto. La
            squadra se ne va con meno di quanto sperava, il caposquadra ti saluta
            con un cenno corto, e Ambrin ti dà qualche spicciolo senza parlare del
            cilindro.
          effetti: { monete: 1 }

  # ------------------------------------------------------------ il servizio · le Formule precuriane
  - id: le-formule-di-ambrin
    presso: mercato-dei-nodi
    immagine: personaggi/ambrin-qell
    titolo: Le formule di Ambrin
    sommario: "Le Formule precuriane non le insegna nessuno in città. Dopo la chiusura, nel retrobottega del Nodo, Ambrin Qell fa un'eccezione."
    luogo: Il Nodo d'Ossidiana, il retrobottega, dopo la chiusura
    area: ponti-sospesi
    ripetibile: true
    requisiti: [rep.nodo >= 2, magia >= 3]
    testo: |
      Dopo la chiusura Ambrin abbassa le lanterne e ti fa passare nel
      retrobottega, fra il mobile a cento cassetti e un tavolo coperto di
      pergamene. Qui insegna le Formule precuriane, che non hanno un maestro
      all'Accademia né un altare in Cattedrale.

      {origine allievo-di-torvessa} All'Accademia di queste formule si parla
      soltanto nelle note a margine, e adesso le vedi scritte per intero.

      «Ogni volta che le usi ti lasciano un segno in testa, e il segno resta. Io
      ho smesso di contare i miei» dice Ambrin, e intinge la penna. Il corvo,
      sulla spalliera della tua sedia, ti guarda le mani.
    opzioni:
      - testo: "Maledizione"
        immagine: ambientazione/rovine-dei-precursori
        requisiti: [magia >= 3, rep.nodo >= 2, incantesimo.maledizione == 0, monete >= 150]
        costo: 2
        descrizione: "Chi la subisce se la sente sul petto e sbaglia tutto; ogni lancio costa mezza tacca di Tormento."
        prova: { attributo: mentale, abilita: magia, difficolta: Difficile }
        successo:
          titolo: La candela storta
          testo: |
            Ambrin accende una candela e ti fa dire la formula guardando la
            fiamma. Alla terza ripetizione la fiamma si piega di lato nell'aria
            ferma e resta così, mentre senti una pressione leggera dietro gli
            occhi. Ambrin la spegne con due dita bagnate e ti dice di non usarla
            su chi non se la merita, perché il segno in testa resta tuo comunque.
          effetti: { monete: -150, incantesimo.maledizione: 1 }
        fallimento:
          titolo: Non ancora
          testo: |
            La formula ti si ingarbuglia a metà, e la fiamma trema senza piegarsi.
            Ambrin ti ferma alzando la mano, con un gesto rapido che non gli avevi
            mai visto, e ti dice che una Formula precuriana sbagliata il segno in
            testa lo lascia lo stesso. Le monete le tieni finché non ti viene
            intera.

      - testo: "Correzione"
        immagine: ambientazione/rovine-dei-precursori
        requisiti: [magia >= 3, rep.nodo >= 2, incantesimo.correzione == 0, monete >= 180]
        costo: 2
        descrizione: "Con la formula dei Profeti delle Geometrie rimedi a una prova fallita; ogni lancio costa mezza tacca di Tormento."
        prova: { attributo: mentale, abilita: magia, difficolta: Difficile }
        successo:
          titolo: Il cerchio sul tavolo
          testo: |
            Ambrin rovescia un bicchiere d'acqua sul tavolo e ti fa disegnare con
            il gesso un cerchio intorno alla pozza, dicendo la formula mentre
            chiudi il segno. Quando alzi il gesso l'acqua è di nuovo nel
            bicchiere. Ambrin lo fissa a lungo prima di guardare te, poi ti scrive
            la formula intera su un foglio, da ripassare a casa.
          effetti: { monete: -180, incantesimo.correzione: 1 }
        fallimento:
          titolo: Non ancora
          testo: |
            Disegni il cerchio intorno all'acqua rovesciata e dici la formula, ma
            l'acqua resta dov'è e comincia a gocciolare sul pavimento. Il corvo
            scende a bere dalla pozza prima che Ambrin ci passi lo straccio. Ti
            dice di ripassare il cerchio sul tavolo di cucina finché non riesci a
            chiuderlo senza staccare il gesso.

      - testo: "Paralisi"
        immagine: ambientazione/rovine-dei-precursori
        requisiti: [magia >= 4, rep.nodo >= 4, incantesimo.paralisi == 0, monete >= 250]
        costo: 2
        descrizione: "Il corpo del bersaglio smette di obbedirgli per un momento; ogni lancio costa mezza tacca di Tormento."
        prova: { attributo: mentale, abilita: magia, difficolta: Molto difficile }
        successo:
          titolo: La falena
          testo: |
            Ambrin si offre di farti da bersaglio, poi ci ripensa piuttosto in
            fretta e ti indica una falena intorno alla lanterna. Dici la formula,
            e la falena cade sul tavolo con le ali aperte e resta lì, viva, finché
            non riprende a volare. Il corvo, che di solito le falene le mangia,
            questa la lascia andare.
          effetti: { monete: -250, incantesimo.paralisi: 1 }
        fallimento:
          titolo: Non ancora
          testo: |
            Dici la formula alla falena, che continua a girare intorno alla
            lanterna e anzi ti passa davanti alla faccia, mentre a te si
            addormenta la mano destra fino al gomito. Ambrin te la massaggia e ti
            dice che la formula ha trovato prima te, e che per oggi basta così.

      - testo: "Eco"
        immagine: ambientazione/rovine-dei-precursori
        requisiti: [magia >= 4, rep.nodo >= 4, incantesimo.eco == 0, monete >= 250]
        costo: 2
        descrizione: "Leggi la memoria di un luogo o parli con un Eco di Mana; ogni lancio costa mezza tacca di Tormento."
        prova: { attributo: mentale, abilita: magia, difficolta: Molto difficile }
        successo:
          titolo: Il bancone ricorda
          testo: |
            Ambrin ti fa posare il palmo sul tronco del bancone e dire la formula
            a occhi chiusi. Per un momento senti il legno sotto mille gomiti
            diversi, e una donna dalla risata bassa che contratta in una lingua
            che non conosci. Quando apri gli occhi Ambrin ti chiede che cosa hai
            sentito, e dalla risposta capisci che a lui il bancone racconta
            un'altra cosa.
          effetti: { monete: -250, incantesimo.eco: 1 }
        fallimento:
          titolo: Non ancora
          testo: |
            Posi il palmo sul bancone e dici la formula, e senti soltanto il legno
            freddo e il ronzio delle lanterne. Ambrin ti dice che i luoghi parlano
            a chi sa stare zitto, mentre tu pensavi già a cosa avresti sentito. Ha
            ragione, e ti secca parecchio che l'abbia capito così in fretta.

      - testo: "Comando"
        immagine: ambientazione/mito-salvaguardia-precursori
        requisiti: [magia >= 5, rep.nodo >= 6, pista.capomozzo >= 5, incantesimo.comando == 0, monete >= 400]
        costo: 2
        descrizione: "La lingua delle macchine della Salvaguardia, quelle delle rovine sotto Capomozzo; ogni lancio costa mezza tacca di Contaminazione."
        prova: { attributo: mentale, abilita: magia, difficolta: Molto difficile }
        successo:
          titolo: Il congegno di ottone
          testo: |
            Ambrin posa davanti a te un congegno di ottone grande come una noce,
            uno di quelli che ticchettano senza che si sappia a cosa servano. Dici
            la formula, che non somiglia a nessuna lingua, e il congegno smette di
            ticchettare; la ripeti al contrario, e riparte. Ambrin lo rimette nel
            cassetto con molta cura e per il resto della sera parla poco.
          effetti: { monete: -400, incantesimo.comando: 1 }
        fallimento:
          titolo: Non ancora
          testo: |
            Dici la formula al congegno di ottone, e quello accelera fino a
            ronzare. Ambrin lo chiude in pugno finché si ferma e ti dice che le
            macchine sentono l'esitazione meglio delle persone. Quando riapre la
            mano ha sul palmo un segno rosso a forma di ruota dentata, e se lo
            guarda con un certo interesse professionale.

  # ------------------------------------------------------------ storia a 2 · il corvo del bancone
  - id: il-corvo-del-bancone
    presso: mercato-dei-nodi
    immagine: ambientazione/nodo-d-ossidiana
    titolo: Il corvo del bancone
    sommario: "Ambrin ti ha lasciato la bottega per un'ora. Entra una signora con una gabbia dorata, e vuole comprare il corvo."
    luogo: Il Nodo d'Ossidiana, a metà mattina
    area: ponti-sospesi
    requisiti: [rep.nodo >= 2, nodo.corvo == 0]
    testo: |
      Un biglietto di Ambrin sul bancone del Nodo d'Ossidiana ti chiede di
      badare alla bottega per un'ora, mentre lui è alla Casa dei Nodi; in fondo
      ha scritto *se entra qualcuno, decide lui*. Il corvo non ti degna di uno
      sguardo.

      Suona la campanella ed entra una signora anziana con una gabbia dorata,
      vuota a parte un biscotto di semi, che guarda a lungo il corvo senza
      badare a te.

      {origine rampollo-dei-quartieri-alti} Signore così ne hai salutate a
      decine nei salotti, e sai che si cede loro la sedia prima che la chiedano.

      «Pago bene» dice, posando la gabbia. «Mi chiamo Clelia Varrone. Questo
      corvo era di mia nonna, e sono venuta a riportarlo a casa.»

      *Ambrin, questa me la paghi.* Il corvo gira la testa verso la gabbia e poi
      verso di te, e le tue dita cominciano a tamburellare sul legno.
    opzioni:
      - testo: "Chiederle di sua nonna"
        descrizione: "Una signora che porta una gabbia dorata attraverso tutto il Mercato ha una storia da raccontare. Basta lasciarla parlare."
        prova: { attributo: sociale, abilita: [empatia, galateo], difficolta: Media }
        successo:
          titolo: La pergola
          testo: |
            Le cedi lo sgabello, e lei racconta che il corvo era di sua nonna e
            aveva una penna bianca sotto l'ala sinistra; volò via dalla finestra
            il giorno in cui la nonna morì, quarant'anni fa. Il corvo apre l'ala,
            e la penna bianca c'è. Clelia riprende la gabbia vuota e ti lascia il
            biscotto. «Se n'è andato da solo, e non posso comprarlo come un
            cappello» dice.
          pe: { empatia: 5 }
          imposta: { nodo.corvo: 1 }
          effetti: { rep.nodo: 1 }
          segue: prima-di-ambrin
        fallimento:
          titolo: Il commesso
          testo: |
            Le chiedi della nonna con troppa fretta, e lei ti guarda come si
            guarda un commesso che ha toccato la merce con le mani sporche. Non è
            venuta fin qui, dice, a raccontare la sua famiglia a chi sta dietro un
            bancone in prestito. Lascia la gabbia sul legno, con il biscotto
            dentro, e ti avverte che tornerà quando ci sarà il padrone.
          effetti: { scandalo: 0.5 }

      - testo: "Guardare sotto l'ala del corvo"
        descrizione: "Se era di sua nonna avrà un segno, ma il corvo si fa toccare da pochi."
        prova: { attributo: sociale, abilita: addestrare-animali, difficolta: Media }
        successo:
          titolo: La penna bianca
          testo: |
            Posi le briciole del biscotto sempre più vicino alla tua mano, e il
            corvo le mangia fingendo di passare per caso. All'ultima ti lascia
            sollevare l'ala sinistra, e fra le penne nere ce n'è una bianca.
            Clelia Varrone racconta della nonna, morta quarant'anni fa il giorno
            in cui il corvo volò via. «Se n'è andato da solo, allora resta dove ha
            scelto» dice, e riprende la gabbia vuota.
          pe: { addestrare-animali: 5 }
          imposta: { nodo.corvo: 1 }
          effetti: { rep.nodo: 1 }
          segue: prima-di-ambrin
        fallimento:
          titolo: Il dito
          testo: |
            Allunghi la mano verso l'ala, e il corvo ti pizzica il dito una volta
            sola, senza fare sangue, poi ti volta la schiena. Clelia Varrone dice
            che anche con sua nonna faceva così con gli estranei, e che la cosa la
            convince ancora di più. Lascia la gabbia sul bancone e se ne va,
            promettendo di tornare quando ci sarà Ambrin.

      - testo: "Lasciare che scelga lui"
        descrizione: "Il biglietto di Ambrin dice che decide il corvo. Basta aprire la gabbia."
        esito:
          titolo: Il biscotto
          testo: |
            Apri la gabbia, e il corvo ci entra a piccoli salti, prende il
            biscotto, te lo lascia nel palmo e torna sul suo tronco. Clelia
            Varrone ride e racconta che era di sua nonna, volato via il giorno in
            cui lei morì. Quando nomina la penna bianca sotto l'ala sinistra, il
            corvo apre l'ala e te la mostra. Clelia riprende la gabbia vuota e ti
            lascia il biscotto.
          pe: { addestrare-animali: 5 }
          imposta: { nodo.corvo: 1 }
          effetti: { rep.nodo: 1 }
          segue: prima-di-ambrin

      - testo: "Inventarti una ragione per non venderlo"
        descrizione: "Una signora così non accetta un no. Accetta un regolamento, se ha l'aria abbastanza ufficiale."
        prova: { attributo: sociale, abilita: [ingannare, persuasione], difficolta: Media }
        successo:
          titolo: Il registro della Gilda
          testo: |
            Le spieghi che il corvo è registrato alla Gilda come arredo della
            bottega e che per venderlo serve la firma dell'ispettore Varn Kett,
            che per i volatili chiede sei settimane. Clelia Varrone ti squadra e
            racconta della nonna e della penna bianca sotto l'ala sinistra del
            corvo. Riprende la gabbia e lascia il biscotto, dicendo che di
            regolamenti ne ha visti tanti e il tuo è il più gentile.
          pe: { ingannare: 5 }
          imposta: { nodo.corvo: 1 }
          effetti: { rep.nodo: 1 }
          segue: prima-di-ambrin
        fallimento:
          titolo: Varn Kett
          testo: |
            Le spieghi che per vendere il corvo serve la firma dell'ispettore dei
            dazi. Clelia Varrone risponde che Varn Kett cena a casa sua ogni primo
            del mese, e che glielo chiederà stasera stessa. Lascia la gabbia sul
            bancone come pegno, e quando se ne va il corvo infila il becco fra le
            sbarre e si prende il biscotto, come un esattore che riscuote gli
            interessi.
          effetti: { sospetto: 0.5 }

      - testo: "Salutare il corvo come si fa nel Bosco"
        descrizione: "Nel Bosco di Velthar ai corvi si porta il saluto prima di chiedere qualcosa, e un corvo salutato bene risponde."
        quando: [origine.figlio-del-circolo >= 1]
        esito:
          titolo: Il saluto
          testo: |
            Fai al corvo il saluto del Circolo, due schiocchi di lingua e la testa
            piegata di lato. Il corvo risponde allo stesso modo, e Clelia Varrone
            si porta una mano alla bocca. «Lo faceva con mia nonna» dice. Il corvo
            apre l'ala sinistra e mostra una penna bianca; Clelia riprende la
            gabbia e ti lascia il biscotto, perché un corvo che saluta così una
            casa ce l'ha già.
          pe: { addestrare-animali: 5 }
          imposta: { nodo.corvo: 1 }
          effetti: { rep.nodo: 1 }
          segue: prima-di-ambrin

  - id: prima-di-ambrin
    immagine: personaggi/ambrin-qell
    titolo: Prima di Ambrin
    tipo: seguito
    luogo: Il Nodo d'Ossidiana, al tramonto
    area: ponti-sospesi
    requisiti: [nodo.corvo >= 1]
    testo: |
      Ambrin torna dalla Casa dei Nodi al tramonto. Gli racconti di Clelia
      Varrone mentre accende le lanterne, e a metà racconto si ferma con la
      candela in mano finché la cera non gli cola sulle dita. Quando arrivi alla
      penna bianca va a sedersi sulla scaletta del retrobottega.

      «Il vecchio che teneva la bottega prima di me mi ha venduto i muri insieme
      agli scaffali, e con gli scaffali c'era lui» dice. «Il corvo era compreso
      nel prezzo, con due regole. Niente carne, e niente domande davanti ai
      clienti.» Guarda il corvo, ritto sul tronco con gli occhi semichiusi. «Da
      dove venisse il vecchio non me l'ha mai detto. Adesso so almeno dov'era
      quarant'anni fa.»

      {empatia Media} Lo dice con sollievo e con un poco di gelosia. Per anni il
      corvo è stato soltanto suo, e adesso ha una storia in cui lui non c'è.
    opzioni:
      - testo: "Chiedergli quando ha preso la bottega"
        descrizione: "I conti degli anni, con Ambrin, non tornano mai. Magari stasera sì."
        esito:
          titolo: Un'altra lanterna
          testo: |
            Ambrin sorride, come ogni volta che qualcuno gli chiede degli anni, e
            si alza ad accendere l'ultima lanterna. Ti racconta che il vecchio era
            un nano che vendeva chiavi e serrature, e che sul retro del bancone
            c'è ancora la sua tacca per i ladri, la prima. Poi ti chiede quanto
            avresti chiesto a Clelia per il corvo, e della bottega non parla più.
          pe: { empatia: 3 }
      - testo: "Chiedergli che cosa vuol dire niente domande davanti ai clienti"
        descrizione: "Una regola così si dà per un motivo. Adesso i clienti sono andati tutti."
        esito:
          titolo: La regola
          testo: |
            «Vuol dire quello che dice» risponde Ambrin, e guarda la porta, che è
            chiusa. Il corvo apre un occhio e lo richiude. Ambrin dice che la
            regola l'ha sempre rispettata e non ha intenzione di scoprire che cosa
            succede a non farlo; poi ti versa un bicchiere di vino di more e per
            il resto della sera ti parla con molto entusiasmo e poca attenzione
            dei dazi della Gilda.
          pe: { percezione: 3 }
      - testo: "Dargli il biscotto di semi"
        descrizione: "Clelia l'ha lasciato qui, e il corvo non l'ha mai perso d'occhio. Forse ha in mente qualcuno."
        esito:
          titolo: Il regalo
          testo: |
            Posi il biscotto di semi sul bancone davanti al corvo, e lui lo spinge
            con il becco verso di te finché non lo riprendi. Ambrin ride piano e
            ti dice di tenerlo, perché un corvo che si vede rendere un regalo se
            la lega al dito. Lo metti in tasca, e fra una settimana lo ritroverai
            sbriciolato senza avere il coraggio di buttarlo.
          pe: { addestrare-animali: 3 }

  # ------------------------------------------------------------ storia a 4 · il cassetto chiuso
  - id: il-cassetto-chiuso
    presso: mercato-dei-nodi
    immagine: ambientazione/nodo-d-ossidiana
    titolo: Il cassetto chiuso
    sommario: "Uno dei cento cassetti non si è mai aperto, e da qualche giorno il corvo ci batte sopra il becco."
    luogo: Il Nodo d'Ossidiana, il retrobottega
    area: ponti-sospesi
    requisiti: [rep.nodo >= 4, nodo.cassetto == 0]
    testo: |
      Nel mobile a cento cassetti uno solo non ha il pomello, e sull'etichetta
      c'è scritto *da lasciare chiuso, anche per me*.

      Ambrin, seduto sulla scaletta, rigira fra le dita una chiave annerita. «Lì
      dentro c'è una cosa che ho rubato quando facevo un altro mestiere» dice.
      «Era di un Raschiatore, Tam Orrin, che l'aveva portata su dal Labirinto, e
      da lei ho imparato le formule che ti insegno. Tam denunciò il furto alla
      Gilda e nessuno gli credette, allora scese a cercarne un'altra e non
      tornò. Sua figlia Sefa vende lanterne sul ponte, tre banchi più in là.»

      {origine apprendista-raschiatore} Sulle piattaforme i vecchi raccontano di
      uomini scesi da soli a ripagare un debito e mai risaliti, e adesso una di
      quelle storie ha un nome.

      {origine mercante-dei-ponti} Sai come finisce alla Gilda la denuncia di un
      Raschiatore senza ricevute, sotto la pila dei dazi.

      Ti mette la chiave nel palmo. «Il corvo dice che è ora. Se lo apro io mi
      rimetto a leggere, quindi aprilo tu.»

      Nel cassetto c'è una tavoletta di metallo opaco grande come una mano,
      incisa di cerchi fittissimi che si spostano appena quando sposti gli
      occhi.

      {magia Media} Il Mana ti arriva ai denti prima che agli occhi, e ti scopri
      già a cercare l'inizio del primo cerchio.
    opzioni:
      - testo: "Leggere la tavoletta"
        descrizione: "Ambrin ci ha imparato le Formule precuriane, e ci ha lasciato un pezzo della testa. Una riga sola."
        immagine: ambientazione/rovine-dei-precursori
        prova: { attributo: mentale, abilita: [magia, accademiche], difficolta: Difficile }
        successo:
          titolo: Il terzo cerchio
          testo: |
            I cerchi te li traduce la testa da sola. In uno c'è la Maledizione che
            insegna Ambrin, scritta più lunga di come la dice lui; in un altro un
            pezzo di formula mai sentito, che ti resta addosso come una cantilena.
            Ambrin richiude il cassetto e ti lascia la chiave. «Adesso ce l'hai
            tu, io ho smesso. Quando vorrai smettere anche tu, sai dov'è il Ponte
            dei Morti» dice.
          pe: { magia: 5 }
          imposta: { nodo.cassetto: 1 }
          effetti: { rep.nodo: 1, tormento: 1, informazioni.segreto: 1 }
        fallimento:
          titolo: Le linee
          testo: |
            Provi a leggere il cerchio più esterno, e le linee ti scivolano sotto
            gli occhi fino a farti girare la testa. Ti ritrovi seduto sul
            pavimento con il sapore del ferro in bocca. Ambrin richiude il
            cassetto, si riprende la chiave e ti porta un bicchiere d'acqua, e ti
            dice che a lui la prima volta è andata uguale e avrebbe fatto meglio a
            fermarsi lì.
          effetti: { tormento: 1 }

      - testo: "Portarla a Sefa Orrin"
        descrizione: "Era di suo padre. Qualcuno deve dirglielo, e Ambrin non ha mai trovato le parole da solo."
        immagine: ambientazione/mercato-dei-nodi
        prova: { attributo: sociale, abilita: [empatia, persuasione], difficolta: Media }
        successo:
          titolo: Le lanterne di Sefa
          testo: |
            Sefa Orrin ha le mani nere di fuliggine. Ambrin comincia e si perde
            dopo due frasi, e finisci tu, con le parole più semplici che trovi.
            Sefa pulisce la tavoletta con il grembiule, anche dove è già pulita;
            l'ultimo inverno suo padre ne parlava tutte le sere, e lei pensava
            fosse il vino. La venderà alla Gilda, che paga bene i pezzi dei
            Precursori, e Ambrin non chiede di riaverla.
          pe: { empatia: 5 }
          imposta: { nodo.cassetto: 1 }
          effetti: { rep.nodo: 1 }
        fallimento:
          titolo: Il banco delle lanterne
          testo: |
            Al banco delle lanterne cominci dal furto, e Sefa Orrin smette di
            ascoltarti alla parola *rubato*. Ambrin prova a spiegare e peggiora le
            cose. Sefa vi dice di andarvene prima che chiami i Custodi di
            Passaggio, perché suo padre è morto per colpa di quella roba. Tornate
            al Nodo con la tavoletta avvolta in uno straccio, e Ambrin la rimette
            nel cassetto senza dire niente.
          effetti: { sospetto: 0.5 }

      - testo: "Gettarla dal Ponte dei Morti"
        descrizione: "Sotto la lanterna di Tam Orrin, nel vuoto della Cicatrice. Così non la legge più nessuno."
        immagine: ambientazione/ponte-dei-morti
        esito:
          titolo: La terza lanterna
          testo: |
            Ambrin ti accompagna al Ponte dei Morti e si ferma alla lanterna di
            Tam Orrin, la terza dopo il gabbiotto dei Custodi; il cristallo è
            nuovo, lo cambia lui ogni anno. Butti la tavoletta nella nebbia oltre
            il parapetto. Ambrin dice che le formule ce le ha in testa comunque,
            però almeno nessuno le impara più da lì, e tornando ti offre da bere
            al Grifone.
          pe: { resilienza: 5 }
          imposta: { nodo.cassetto: 1 }
          effetti: { rep.nodo: 1 }

      - testo: "Richiudere il cassetto"
        descrizione: "Forse il corvo ha fretta e Ambrin no, e una cosa chiusa da tanti anni può aspettare ancora."
        costo: 0
        esito:
          titolo: La chiave al collo
          testo: |
            Richiudi il cassetto e gli rendi la chiave. Ambrin se la rimette al
            collo su un cordino nuovo, con un sospiro in cui c'è sollievo e un
            poco di vergogna. Il corvo vola sul mobile a battere il becco sul
            cassetto e poi torna al bancone. «Lui ha pazienza, più di me di
            sicuro» dice Ambrin, e ti versa un tè già freddo.

  # ------------------------------------------------------------ storia a 6 · socio del Nodo
  - id: socio-del-nodo
    presso: mercato-dei-nodi
    immagine: personaggi/ambrin-qell
    titolo: Socio del Nodo
    sommario: "Ambrin Qell chiude la bottega a metà pomeriggio e ti fa sedere nel retrobottega. Sul tavolo c'è una chiave d'ottone."
    luogo: Il Nodo d'Ossidiana, il retrobottega
    area: ponti-sospesi
    requisiti: [rep.nodo >= 6, nodo.socio == 0]
    testo: |
      A metà pomeriggio Ambrin gira il cartello sulla porta e ti fa sedere nel
      retrobottega. Sul tavolo ci sono due tazze di tè di fiori e una chiave
      d'ottone con il serpente alato dell'insegna sull'impugnatura, e il corvo,
      in cima al mobile, per una volta tiene gli occhi fissi sulla chiave.

      «Mi serve un socio» dice Ambrin. «Uno che compri dai Raschiatori quando io
      sono al bancone, e che abbia la chiave di questa stanza. Su quello che
      porti ti tieni la tua parte. Quanto, lo decide il corvo, però i conti li
      tengo io. Prima lui deve vederti lavorare da solo una giornata intera,
      mentre io sono alla Casa dei Nodi. Come la passi, lo scegli tu.»

      {galateo Facile} Ti ha messo davanti la tazza col manico sbeccato e ha
      tenuto per sé quella buona. Fra soci, a quanto pare, si comincia così.
    opzioni:
      - testo: "Vendere a chi non sa cosa vuole"
        descrizione: "Al Nodo entra gente che cerca un regalo e non sa per chi. Ambrin dice che sono i clienti migliori."
        prova: { attributo: sociale, abilita: [persuasione, galateo], difficolta: Difficile }
        successo:
          titolo: Il regalo giusto
          testo: |
            A metà mattina entra un ragazzo della Caserma che cerca un regalo per
            la madre, con poche monete in tasca. Gli fai raccontare di lei finché
            salta fuori che non dorme da quando è finita la razzia, e gli vendi un
            sacchetto di lavanda legato con un nastro, al prezzo che può
            permettersi. Il corvo lo segue con gli occhi fino alla porta, poi si
            gira verso di te.
          pe: { persuasione: 5 }
          segue: la-chiave-del-retrobottega
        fallimento:
          titolo: L'anello sbagliato
          testo: |
            Al ragazzo della Caserma che cerca un regalo per la madre vendi un
            anello che costa tutto quello che ha in tasca, e lui conta le monete
            due volte prima di posarle. Due ore dopo torna con la madre, che te lo
            restituisce con molta educazione. Quando Ambrin rientra il corvo non
            lo saluta, e Ambrin ti dice che per la chiave ci sarà un'altra
            giornata.
          effetti: { scandalo: 0.5 }

      - testo: "Riconoscere un falso"
        descrizione: "Un pezzo dei Precursori che vale una fortuna, se è vero; al Mercato dei Nodi lo è uno su tre."
        immagine: ambientazione/rovine-dei-precursori
        prova: { attributo: mentale, abilita: [percezione, accademiche], difficolta: Difficile }
        successo:
          titolo: La vernice verde
          testo: |
            Il Raschiatore posa sul bancone una piastra di metallo con un cerchio
            inciso e un prezzo già deciso. Con la lente di Ambrin vedi nel solco
            del cerchio un residuo di vernice verde, quella che in Città Bassa si
            usa per invecchiare il ferro. Glielo fai vedere, e il Raschiatore si
            riprende la piastra senza discutere. Il corvo, che l'aveva guardata
            tutto il tempo con il becco aperto, lo chiude.
          pe: { percezione: 5 }
          segue: la-chiave-del-retrobottega
        fallimento:
          titolo: La piastra
          testo: |
            Compri la piastra con il cerchio inciso per metà di quanto chiedeva il
            Raschiatore, e per un'ora ti senti molto furbo. Quando Ambrin torna ci
            passa sopra un dito bagnato, e il dito diventa verde. Ti dice che anni
            fa l'ha comprata anche lui dallo stesso Raschiatore, e che adesso ne
            hanno due. Per la chiave il corvo vuole un'altra giornata.
          effetti: { tormento: 0.5 }

      - testo: "Tenere lontani i borseggiatori"
        descrizione: "Il giorno di mercato davanti al Nodo passano mezza Qir-Azel e i suoi ladri, e nessuno deve entrare a lavorare."
        immagine: ambientazione/mercato-dei-nodi
        prova: { attributo: sociale, abilita: [conoscenze-della-strada, intimidire], difficolta: Media }
        successo:
          titolo: La soglia
          testo: |
            Passi la giornata appoggiato allo stipite, con le spalle bene in
            vista, e ogni volta che una mano si allunga verso il cesto degli
            amuleti in vetrina guardi il proprietario finché la ritira. A un
            ragazzino che ci riprova tre volte offri un biscotto di semi perché
            vada a provarci altrove. Quando Ambrin torna non manca niente, e
            nell'angolo del bancone non c'è da incidere nessuna tacca.
          pe: { conoscenze-della-strada: 5 }
          segue: la-chiave-del-retrobottega
        fallimento:
          titolo: La tacca
          testo: |
            Passi la giornata sulla soglia, e a metà pomeriggio ti accorgi che dal
            cesto in vetrina manca un amuleto, senza che tu abbia visto passare
            nessuna mano. Ambrin incide una tacca nuova nell'angolo del bancone e
            ti presta il coltello per incidere la tua accanto. Il corvo ti volta
            la schiena, e la chiave resta sul tavolo.
          effetti: { tormento: 0.5 }

      - testo: "Fare come dice il corvo"
        descrizione: "Se il giudice è lui, tanto vale lasciargli la bottega e fare quello che ti indica."
        costo: 2
        esito:
          titolo: Il giorno del corvo
          testo: |
            Quando entra un cliente guardi il corvo, il corvo guarda uno scaffale,
            e tu porti al cliente quello che c'è sopra. Due volte su tre è la cosa
            giusta, e la terza il cliente compra lo stesso per non contraddire un
            uccello. A sera hai venduto più di Ambrin in un giorno buono, e lui,
            letto il registro, guarda il corvo, che si liscia le penne con aria di
            sufficienza.
          pe: { addestrare-animali: 5 }
          segue: la-chiave-del-retrobottega

      - testo: "Dirgli che non è il momento"
        descrizione: "Una chiave è un impegno, e un socio non sparisce per settimane. Ambrin sa aspettare."
        costo: 0
        esito:
          titolo: La tazza vuota
          testo: |
            Gli dici che gli fa onore, ma per adesso non puoi promettergli le tue
            giornate. Ambrin finisce il tè fino all'ultimo sorso con i fiori
            compresi e mette la chiave in un cassetto senza etichetta. Dice che
            saprai trovarla quando ti servirà. Il corvo scende dal mobile e torna
            al bancone, dove c'è più luce.

  - id: la-chiave-del-retrobottega
    immagine: personaggi/ambrin-qell
    titolo: La chiave del retrobottega
    tipo: seguito
    luogo: Il Nodo d'Ossidiana, la sera
    area: ponti-sospesi
    requisiti: [nodo.socio == 0]
    testo: |
      Ambrin rientra dalla Casa dei Nodi a lanterne accese e ascolta il racconto
      della tua giornata appoggiato al bancone. Poi il corvo scende dal tronco,
      attraversa il bancone a piccoli salti fino alla chiave d'ottone e ci mette
      sopra una zampa.

      «Bene» dice Ambrin, più sollevato che contento. «Allora le regole sono
      queste. Quello che sta sotto il bancone non si vende senza chiedere a me.
      Il mobile dei cassetti lo puoi aprire tutto, tranne quando il corvo ci sta
      seduto sopra. E la carne non gliela dai mai, anche quando ti fissa il
      piatto con tutti e due gli occhi.»

      {rissa Media fallita} Fai un rapido calcolo di chi la spunterebbe fra te e
      il corvo per una fetta di prosciutto, e il risultato non ti piace.

      Il corvo toglie la zampa dalla chiave e la spinge di un dito verso di te.
    opzioni:
      - testo: "Prendere la chiave"
        descrizione: "La chiave del retrobottega e la tua parte su quello che porti, sotto l'occhio del corvo."
        esito:
          titolo: Socio del Nodo
          testo: |
            Prendi la chiave, con l'ottone consumato nel punto dove il pollice la
            tiene per girarla. Ambrin ti stringe la mano e scrive il tuo nome sul
            registro sotto il suo, con una riga a parte per la percentuale che
            lascia vuota. «Domani all'alba risale una squadra dal Labirinto, e ci
            vai tu. Non pagare la prima cifra che ti dicono» dice, già chino sul
            registro.
          imposta: { nodo.socio: 1 }
          effetti: { rep.nodo: 1 }
      - testo: "Rifiutare con garbo"
        descrizione: "Per adesso preferisci restare uno di passaggio. Ambrin lo capirà, il corvo chissà."
        esito:
          titolo: Il gancio
          testo: |
            Gli dici che per adesso preferisci restare uno di passaggio, e gli
            rendi la chiave. Ambrin la appende a un gancio dietro il bancone,
            accanto al mantello color petrolio, e ti dice che quando la vorrai
            dovrai rifare la giornata, perché le regole del corvo valgono anche
            per lui. Il corvo ti volta la schiena finché non sei uscito.

  # ------------------------------------------------------------ la carta
  - id: carta-un-acquirente-al-mercato
    immagine: ambientazione/mercato-dei-nodi
    titolo: Un acquirente al Mercato
    sommario: "Un forestiero sta per pagare una fortuna un pezzo dei Precursori a una bancarella che quei pezzi li fabbrica."
    luogo: Ponte delle Mille Corde, il Mercato dei Nodi
    tipo: carta
    area: ponti-sospesi
    requisiti: [rep.nodo < 2]
    testo: |
      Al Mercato dei Nodi un venditore con le unghie verdi tratta con un
      forestiero in cappotto di pelliccia, che gira verso la luce un
      ingranaggio grande come un piatto. «Viene dal Labirinto, l'ha portato su
      mio cugino» dice il venditore.

      {origine figlio-della-citta-bassa} Unghie così le hai viste in Città
      Bassa, su chi invecchia il ferro per i forestieri.

      Il forestiero ti vede fra i curiosi. «Mi hanno detto di cercare una
      bottega con un corvo sul bancone, ma questo signore dice che ha chiuso.»
      Il venditore ti sorride con tutti i denti e scuote appena la testa.
    opzioni:
      - testo: "Accompagnarlo al Nodo d'Ossidiana"
        descrizione: "La bottega con il corvo è aperta, ed è a due piattaforme da qui."
        esito:
          titolo: Il corvo sul bancone
          testo: |
            Lo accompagni attraverso il Mercato fino alla facciata stretta di
            pietra chiara con il serpente alato sull'insegna. Ambrin Qell vi
            accoglie con un sorriso largo, e dopo dieci minuti il forestiero esce
            con un amuleto vero e un prezzo onesto. Sulla porta Ambrin ti chiede
            il nome e lo ripete due volte per ricordarlo, mentre il corvo, dal
            bancone, ti guarda finché non sparisci fra la folla.
          effetti: { rep.nodo: 0.5 }
      - testo: "Dirgli che è un falso"
        descrizione: "Quelle unghie verdi vengono da qualche parte. Il ferro vecchio non tinge le dita."
        prova: { attributo: mentale, abilita: percezione, difficolta: Facile }
        successo:
          titolo: Le unghie verdi
          testo: |
            Prendi l'ingranaggio dalle mani del forestiero e ci passi sopra il
            pollice, che diventa verde come le unghie del venditore, poi lo alzi
            bene perché lo vedano anche i curiosi in fondo. Il venditore smonta la
            bancarella in un attimo, e il forestiero ti regala qualche moneta per
            il disturbo.
          effetti: { monete: 2 }
        fallimento:
          titolo: Il cugino
          testo: |
            Dici che l'ingranaggio è falso, ma quando il forestiero ti chiede come
            lo sai non hai niente da mostrargli. Il venditore ti dà del geloso e
            giura sul cugino. Il forestiero paga e se ne va contento, mentre il
            venditore ti strizza l'occhio contando i soldi.
          effetti: { scandalo: 0.5 }
      - testo: "Lasciar perdere"
        descrizione: "Al Mercato dei Nodi il prezzo dipende da chi ti guarda mentre paghi. Oggi non guardi tu."
        costo: 0
        esito:
          titolo: Tra la folla
          testo: |
            Scrolli le spalle e ti allontani tra la folla, mentre dietro di te il
            forestiero conta le monete ad alta voce e il venditore lo ringrazia
            con qualche benedizione di troppo. Sulla piattaforma accanto un
            vecchio mercante della Gilda scuote la testa e torna a piegare le sue
            stoffe prima che il vento gliele porti via.
