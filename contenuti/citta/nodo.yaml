# La città viva, luogo 3: il Mercato dei Nodi e il Nodo d'Ossidiana (presso: mercato-dei-nodi, area
# ponti-sospesi). Le commissioni di Ambrin, il servizio nuovo (le Formule precuriane, che in città non insegna
# nessuno), le tre storie di rep.nodo (2 il corvo del bancone, 4 il cassetto chiuso, 6 socio del Nodo, ognuna
# con il suo flag) e la carta dell'acquirente. Le botteghe, `il-nodo-d-ossidiana`, `il-banco-di-ambrin`,
# `il-banco-dei-conti` e `ricucire-gramm` ci sono già.
# Reputazione: le storie la portano a 3, 5 e 7; la stima e il pacco la fanno salire fino a 4, il banco tenuto da
# solo e la stima dei reperti fino a 6, così la catena è percorribile. Con nodo.socio le commissioni rendono di più.
storylet:
  # ------------------------------------------------------------ l'attività ripetibile
  - id: le-commissioni-di-ambrin
    presso: mercato-dei-nodi
    immagine: ambientazione/nodo-d-ossidiana
    titolo: Le commissioni di Ambrin
    sommario: "Ambrin Qell non può lasciare il bancone, e il Mercato dei Nodi è pieno di cose da andare a prendere o da mettere sulla bilancia."
    luogo: Il Nodo d'Ossidiana, il bancone
    area: ponti-sospesi
    ripetibile: true
    testo: |
      Quando chiudi la porta del Nodo d'Ossidiana il vocio del Mercato resta
      fuori tutto in una volta, e per un momento ti senti le orecchie piene
      d'ovatta. Dentro la luce viene da due lanterne a cristallo appese alle
      travi, fra i talismani che ondeggiano appena. Il bancone è ricavato da un
      unico tronco scavato, lucido dove ci si appoggiano i gomiti, e in un
      angolo qualcuno ha inciso a punta di coltello una tacca per ogni cliente
      che ha provato a rubare. Le tacche sono parecchie, e la più recente ha
      già il bordo annerito dalle dita.

      Ambrin Qell sta dietro il bancone con un foglio di commissioni e una penna
      che perde, e ti saluta con un sorriso largo prima ancora che tu apra
      bocca. «Eccoti. Ho tre cose da fare fuori e un paio di mani sole, e i
      clienti non aspettano» dice, scostandosi una ciocca rossa dalla fronte.
      «Una la sai fare di sicuro. Le altre le scopriamo strada facendo.»

      Sul bancone il corvo ti guarda con un occhio solo, poi si volta verso il
      foglio e ci resta chino sopra a lungo, come se anche lui stesse leggendo
      la lista.
    opzioni:
      - testo: "Stimare un oggetto"
        descrizione: "Un Raschiatore ha portato una scatola di roba dalle rovine. Ambrin vuole sapere quanto vale prima di fare un prezzo."
        requisiti: [rep.nodo < 2]
        prova: { attributo: mentale, abilita: [percezione, politica-ed-economia], difficolta: Media }
        successo:
          titolo: La scatola del Raschiatore
          testo: |
            Rovesci la scatola su un panno e dividi la roba in due mucchi.
            Quasi tutto è ferraglia da vendere a peso, ma in fondo c'è un anello
            di metallo verdastro inciso così fitto che le linee si vedono solo
            con la lente. Lo metti da parte e dici che da solo vale più di tutto
            il resto. Ambrin paga al Raschiatore il prezzo giusto senza
            contrattare, e a te allunga qualche moneta. Il corvo gracchia una volta,
            e Ambrin ti spiega che da queste parti è un complimento.
          effetti: { monete: 2, rep.nodo: 0.5 }
        fallimento:
          titolo: Ferro a peso
          testo: |
            Rovesci la scatola su un panno e la stimi tutta al prezzo della
            ferraglia. Ambrin annuisce, poi infila due dita nel mucchio e ne tira
            fuori un ingranaggio grande come un'unghia che avevi buttato con il
            resto. Lo tiene controluce per un pezzo e poi lo chiude in un
            cassetto, sorridendo fra sé. Ti dà lo stesso qualche spicciolo, per il disturbo.
          effetti: { monete: 1 }

      - testo: "Stimare un oggetto"
        descrizione: "Ormai Ambrin ti lascia fare il prezzo davanti al cliente, e poi controlla senza dire niente."
        requisiti: [rep.nodo >= 2, rep.nodo < 4]
        prova: { attributo: mentale, abilita: [percezione, politica-ed-economia], difficolta: Media }
        successo:
          titolo: La bussola del padre
          testo: |
            Il cliente è un fabbro in pensione con le mani piene di cicatrici,
            che vuole vendere la bussola di suo padre. Il vetro è graffiato e
            l'ago gira piano, ma la cassa è d'argento vero e dentro il coperchio
            c'è il punzone di un orefice dei Quartieri Alti. Fai il prezzo ad
            alta voce, e il fabbro lo accetta subito. Ambrin non corregge una
            cifra e a sera ti dà la paga, con un extra perché il
            cliente è uscito contento.
          effetti: { monete: 3, rep.nodo: 0.5 }
        fallimento:
          titolo: L'argento falso
          testo: |
            Il cliente è un fabbro in pensione che vuole vendere la bussola di
            suo padre. Dici che la cassa è d'argento, e Ambrin, alle tue spalle,
            ci passa sopra l'unghia e ti fa vedere l'ottone sotto la doratura. Il
            fabbro si riprende la bussola un po' offeso, anche se l'aveva portata
            lui. Ambrin ti dice con gentilezza che l'argento vero è più freddo
            sotto le dita, e che la prossima volta lo tocchi prima di parlare.

      - testo: "Andare a prendere un pacco"
        descrizione: "Alla Dispensa di Gramm c'è un pacco di reagenti per Ambrin. Si ritira dal vicolo, si porta in braccio e non si apre."
        immagine: personaggi/nestor-gramm
        requisiti: [rep.nodo < 4, pista.pelle < 4]
        prova: { attributo: fisico, abilita: [furtivita, conoscenze-della-strada], difficolta: Media }
        successo:
          titolo: Il vicolo
          testo: |
            Nestor Gramm ti passa il pacco dalla porta socchiusa senza dire una
            parola, e insieme al pacco esce un odore di zolfo. Sulla via del
            ritorno, nel punto più stretto del Ponte delle Mille Corde, un
            ragazzino ti striscia contro la giubba, ma il pacco l'hai già
            spostato sull'altro braccio. Ambrin lo soppesa con la mano e lo mette
            sotto il bancone senza aprirlo davanti a te, poi ti allunga qualche moneta con l'aria soddisfatta.
          effetti: { monete: 2, rep.nodo: 0.5 }
        fallimento:
          titolo: Lo spago tagliato
          testo: |
            Nestor ti passa il pacco dalla porta socchiusa. Sul Ponte delle Mille
            Corde senti uno strattone appena, e quando abbassi gli occhi lo spago
            è tagliato e metà delle erbe sono già nel vuoto, sopra la Cicatrice.
            Ambrin guarda quello che resta e ti dice che i borseggi li aveva già
            messi nella perdita prevista del mese. Poi pesa le erbe rimaste sulla
            bilancina e scrive la differenza sul registro, alla voce *ponte*.

      - testo: "Andare a prendere un pacco"
        descrizione: "Alla Dispensa di Gramm adesso c'è un garzone, e il pacco di reagenti per Ambrin lo consegna lui. Come sempre, va portato chiuso."
        immagine: ambientazione/dispensa-di-gramm
        requisiti: [rep.nodo < 4, pista.pelle >= 4]
        prova: { attributo: fisico, abilita: [furtivita, conoscenze-della-strada], difficolta: Media }
        successo:
          titolo: La ricevuta
          testo: |
            Alla porta del vicolo ti apre un ragazzo con il grembiule di Nestor,
            che gli arriva alle caviglie. Dice che il padrone non torna, e prima
            che tu chieda altro ti fa firmare una ricevuta che lui non sa leggere.
            Torni al Nodo per i passaggi più affollati, con il pacco stretto sotto
            il braccio, e nessuno ti si avvicina. Ambrin conta le boccette, poi ti
            dà la paga e qualcosa in più da portare al ragazzo.
          effetti: { monete: 2, rep.nodo: 0.5 }
        fallimento:
          titolo: Le boccette sbagliate
          testo: |
            Il ragazzo con il grembiule di Nestor ti consegna un pacco, e solo al
            Nodo, quando Ambrin lo apre, scoprite che dentro c'è un unguento per i
            calli. Il garzone ha sbagliato scaffale. Torni indietro a cambiarlo, e
            sul Ponte delle Mille Corde qualcuno ti sfila il fazzoletto dalla
            tasca. Ambrin dice che con il garzone va così tutte le settimane.

      - testo: "Trattare con un cliente difficile"
        descrizione: "C'è un cliente che rivuole indietro i soldi di un anello, e parla abbastanza forte da farsi sentire dal Mercato."
        prova: { attributo: sociale, abilita: [persuasione, ingannare], difficolta: Media }
        successo:
          titolo: L'anello che stringe
          testo: |
            Il cliente è un mercante della Gilda con le dita grosse, e sostiene
            che l'anello comprato al Nodo lo fa sognare male. Lo lasci parlare
            finché si stanca, poi gli fai notare che l'anello gli stringe il dito
            fino a farlo diventare viola, e che anche tu, con quel dito, faresti
            brutti sogni. Se ne va con l'anello allargato dal gioielliere e senza
            i soldi indietro. Ambrin ti dà una bella paga, e sul registro scrive il
            nome del mercante con una crocetta accanto.
          effetti: { monete: 3 }
        fallimento:
          titolo: Il rimborso
          testo: |
            Il cliente è un mercante della Gilda che sostiene che l'anello
            comprato al Nodo lo fa sognare male. Alzi la voce per primo, e lui la
            alza più di te, finché fuori dalla porta si ferma un capannello di
            curiosi. Alla fine Ambrin gli rende i soldi sorridendo e rimette
            l'anello sotto il vetro. Ti dice che tornerà a ricomprarlo entro un
            mese, perché è sempre così.

      - testo: "Dare da mangiare al corvo"
        descrizione: "Nel cassetto sotto il bancone c'è un sacchetto di semi e di bacche secche. La carne no, dice Ambrin."
        immagine: personaggi/ambrin-qell
        requisiti: [nodo.corvo == 0]
        esito:
          titolo: I semi
          testo: |
            Versi i semi in un piattino di peltro e lo spingi verso il corvo, che
            lo guarda a lungo senza muoversi. Mangia soltanto quando ti volti a
            sistemare uno scaffale, e quando ti giri di nuovo il piattino è vuoto
            e lui è tornato al suo posto. Ambrin dice che è già molto, e che a lui
            ci sono voluti mesi prima di vederlo mangiare.
          pe: { addestrare-animali: 2 }
      - testo: "Dare da mangiare al corvo"
        descrizione: "Il corvo ti conosce, ormai. I semi e le bacche secche sono nel solito cassetto."
        immagine: personaggi/ambrin-qell
        requisiti: [nodo.corvo >= 1]
        esito:
          titolo: Dalla mano
          testo: |
            Il corvo scende dal bancone appena apri il cassetto e ti aspetta
            vicino al piattino, ma i semi li prende dal tuo palmo, uno alla volta,
            con un colpo di becco preciso che non ti fa mai male. Le bacche le
            mette da parte in fila sul bancone. Ambrin dice che quelle le tiene
            per i clienti che gli piacciono, e che non ha mai capito che cosa ci
            faccia.
          pe: { addestrare-animali: 2 }

      - testo: "Stare al banco da solo"
        descrizione: "Ambrin ha da fare alla Casa dei Nodi. Per un pomeriggio il bancone è tuo, e il corvo ti guarda lavorare."
        requisiti: [rep.nodo >= 4, rep.nodo < 6, nodo.socio == 0]
        prova: { attributo: sociale, abilita: [persuasione, empatia], difficolta: Media }
        successo:
          titolo: Il pomeriggio al banco
          testo: |
            Vendi uno specchietto da viaggio a una ragazza che voleva solo
            guardare, e convinci un Raschiatore a non vendere il coltello di suo
            fratello per il prezzo di una cena. Quando Ambrin torna, il corvo
            gracchia due volte, e lui legge il registro dall'inizio. Ti dà una manciata di monete e ti chiede del coltello. Gli dici che non c'è nel registro
            perché non l'hai comprato, e lui ride così forte che deve sedersi.
          effetti: { monete: 4, rep.nodo: 0.5 }
        fallimento:
          titolo: Il registro vuoto
          testo: |
            Il pomeriggio passa senza clienti, a parte una donna che chiede la
            strada per il Grifone e un uomo che vuole sapere se compri gatti. Ti
            accorgi soltanto all'ultima ora di aver lasciato il cartello girato
            sulla parte di *chiuso*. Ambrin rientra e lo rigira, poi ti allunga
            qualche spicciolo per la compagnia che hai fatto al corvo.
          effetti: { monete: 1 }

      - testo: "Stimare un pezzo dei Precursori"
        descrizione: "Quando un Raschiatore porta un reperto vero, adesso Ambrin chiama prima te e resta ad ascoltare dal retrobottega."
        immagine: ambientazione/rovine-dei-precursori
        requisiti: [rep.nodo >= 4, rep.nodo < 6, nodo.socio == 0]
        prova: { attributo: mentale, abilita: [percezione, accademiche], difficolta: Difficile }
        successo:
          titolo: Il cilindro d'ottone
          testo: |
            Il Raschiatore posa sul bancone un cilindro d'ottone lungo un
            palmo, con una fessura sottile che gli gira tutto intorno. Lo pesi
            in mano e lo avvicini all'orecchio, e dentro senti un fruscio
            leggero, come di sabbia. Dici che è un pezzo
            vero e che vale il doppio di quanto chiede, a patto che nessuno
            provi ad aprirlo. Ambrin esce dal retrobottega e paga il prezzo che
            hai detto tu, poi ti allunga una borsa ben fornita. Il cilindro finisce in
            un cassetto alto, dove il corvo non arriva.
          effetti: { monete: 4, rep.nodo: 0.5 }
        fallimento:
          titolo: La fessura
          testo: |
            Il Raschiatore posa sul bancone un cilindro d'ottone con una
            fessura che gli gira tutto intorno, e tu ci infili l'unghia per
            vedere se si apre. Si apre, e ne esce un filo di sabbia grigia che
            continua a colare finché il cilindro resta vuoto e leggero. Ambrin
            lo compra lo stesso a metà prezzo, per non mandare via il
            Raschiatore a mani vuote, e ti ricorda che i Precursori le cose non
            le chiudevano per caso. Ti dà una paga magra per la mattinata.
          effetti: { monete: 1 }

      - testo: "Comprare per il Nodo"
        descrizione: "Da socio, compri dai Raschiatori per conto della bottega. Una parte di quello che porti è tua."
        immagine: ambientazione/mercato-dei-nodi
        requisiti: [nodo.socio >= 1]
        prova: { attributo: mentale, abilita: [politica-ed-economia, percezione], difficolta: Media }
        successo:
          titolo: La tua parte
          testo: |
            Al Grifone una squadra appena risalita svuota i sacchi su un tavolo, e
            tu scegli prima che arrivino gli altri compratori della Gilda. Prendi
            due cristalli sterili, una lente precuriana incrinata e una scatola di
            ingranaggi ancora unti, e paghi meno di quanto avevi messo in conto.
            Ambrin rivende la lente prima di sera. Dal cassetto della cassa ti
            conta la tua parte senza che tu la chieda.
          effetti: { monete: 10 }
        fallimento:
          titolo: Il prezzo della Gilda
          testo: |
            Al Grifone arrivi dopo un compratore della Gilda che ha già scelto il
            meglio, e ti restano gli ingranaggi. Li paghi troppo, perché la
            squadra ha capito che hai fretta. Ambrin li rivende comunque, un po'
            per volta, e alla fine della settimana ti dà la tua parte, che sono
            poche monete e un consiglio sull'ora a cui risalgono le squadre.
          effetti: { monete: 3 }

  # ------------------------------------------------------------ il servizio · le Formule precuriane
  - id: le-formule-di-ambrin
    presso: mercato-dei-nodi
    immagine: personaggi/ambrin-qell
    titolo: Le formule di Ambrin
    sommario: "Le Formule precuriane non le insegna nessuno in città. Dopo la chiusura, nel retrobottega del Nodo, Ambrin Qell fa un'eccezione."
    luogo: Il Nodo d'Ossidiana, il retrobottega, dopo la chiusura
    area: ponti-sospesi
    ripetibile: true
    requisiti: [rep.nodo >= 2, magia >= 3]
    testo: |
      Dopo la chiusura Ambrin abbassa le lanterne, gira il cartello sulla porta
      e ti fa passare nel retrobottega, fra il mobile a cento cassetti e un
      tavolo coperto di pergamene. Qui scrive le pergamene su commissione, e qui
      insegna quello che in città non insegna nessuno. Le Formule precuriane
      non hanno un maestro all'Accademia né un altare in Cattedrale, e chi le
      conosce di solito se lo tiene per sé.

      «Te le insegno perché me le chiedi, e perché il corvo non ha niente in
      contrario» dice, e intinge la penna. «Ogni volta che le usi ti lasciano
      un segno in testa, e il segno resta. Io ho smesso di contare i miei.»
      Mentre parla tiene gli occhi sul foglio. Le formule le scrive a memoria,
      senza libro, in una grafia molto più stretta di quella delle etichette
      e tutta inclinata da una parte.

      Il corvo è sceso dal bancone e si è appollaiato sulla spalliera della tua
      sedia. *Mi guarda le mani mentre scrivo.* Ogni tanto sposta il peso da
      una zampa all'altra, e senti la spalliera scricchiolare.
    opzioni:
      - testo: "Maledizione"
        immagine: ambientazione/rovine-dei-precursori
        requisiti: [magia >= 3, rep.nodo >= 2, incantesimo.maledizione == 0, monete >= 150]
        costo: 2
        descrizione: "Chi la subisce la sente sul petto e sbaglia tutto quello che fa. Si paga cara, e ogni lancio costa mezza tacca di Tormento."
        prova: { attributo: mentale, abilita: magia, difficolta: Difficile }
        successo:
          titolo: La candela storta
          testo: |
            Ambrin accende una candela e ti fa dire la formula guardando la
            fiamma. Alla terza ripetizione la fiamma si piega di lato e resta
            così, anche se nella stanza l'aria è ferma. Ambrin la spegne con due
            dita bagnate e ti dice di non usarla su chi non se la merita, perché
            il segno in testa resta tuo comunque.
          effetti: { monete: -150, incantesimo.maledizione: 1 }
        fallimento:
          titolo: Non ancora
          testo: |
            La formula ti si ingarbuglia a metà, e la fiamma della candela trema
            senza piegarsi. Ambrin alza la mano per fermarti prima della fine. Ti
            dice che una Formula precuriana sbagliata è peggio di una giusta,
            perché il segno in testa lo lascia lo stesso, e che le monete le
            tieni finché non ti viene intera.

      - testo: "Correzione"
        immagine: ambientazione/rovine-dei-precursori
        requisiti: [magia >= 3, rep.nodo >= 2, incantesimo.correzione == 0, monete >= 180]
        costo: 2
        descrizione: "La formula dei Profeti delle Geometrie, per cui ciò che si disegna accade. Rimedia a una prova fallita. Il prezzo della lezione è alto, e ogni lancio costa mezza tacca di Tormento."
        prova: { attributo: mentale, abilita: magia, difficolta: Difficile }
        successo:
          titolo: Il cerchio sul tavolo
          testo: |
            Ambrin rovescia un bicchiere d'acqua sul tavolo e ti fa disegnare con
            il gesso un cerchio intorno alla pozza, dicendo la formula mentre
            chiudi il segno. Quando alzi il gesso l'acqua è di nuovo nel
            bicchiere. Ambrin lo fissa a lungo prima di guardare te. Poi pulisce
            il gesso dal tavolo con la manica e ti scrive la formula intera su un
            foglio, da ripassare a casa.
          effetti: { monete: -180, incantesimo.correzione: 1 }
        fallimento:
          titolo: Non ancora
          testo: |
            Disegni il cerchio intorno all'acqua rovesciata e dici la formula, e
            l'acqua resta sul tavolo e comincia a gocciolare sul pavimento.
            Il corvo scende dal mobile a bere dalla pozza prima che Ambrin ci
            passi sopra lo straccio. Ti dice di ripassare il cerchio a casa, sul
            tavolo della cucina, finché non riesci a chiuderlo senza staccare il
            gesso.

      - testo: "Paralisi"
        immagine: ambientazione/rovine-dei-precursori
        requisiti: [magia >= 4, rep.nodo >= 4, incantesimo.paralisi == 0, monete >= 250]
        costo: 2
        descrizione: "Il corpo del bersaglio smette di obbedirgli per un momento. La lezione costa parecchio, e ogni lancio costa mezza tacca di Tormento."
        prova: { attributo: mentale, abilita: magia, difficolta: Molto difficile }
        successo:
          titolo: La falena
          testo: |
            Ambrin si offre di farti da bersaglio. Poi ci ripensa e ti indica
            una falena che gira intorno alla lanterna. Dici la formula, e la
            falena cade sul tavolo con le ali aperte e resta lì, viva, finché
            non riprende a volare. Il corvo, che di solito le falene le mangia,
            questa la lascia andare.
          effetti: { monete: -250, incantesimo.paralisi: 1 }
        fallimento:
          titolo: Non ancora
          testo: |
            Dici la formula alla falena che gira intorno alla lanterna, e la
            falena continua a girare. A te invece si addormenta la mano destra
            fino al gomito. Ambrin te la massaggia e ti dice che è la formula che
            ti ha trovato per prima, e che per oggi basta così.

      - testo: "Eco"
        immagine: ambientazione/rovine-dei-precursori
        requisiti: [magia >= 4, rep.nodo >= 4, incantesimo.eco == 0, monete >= 250]
        costo: 2
        descrizione: "Leggi la memoria di un luogo o parli con un Eco di Mana. Ambrin la vende a prezzo pieno, e ogni lancio costa mezza tacca di Tormento."
        prova: { attributo: mentale, abilita: magia, difficolta: Molto difficile }
        successo:
          titolo: Il bancone ricorda
          testo: |
            Ambrin ti fa posare il palmo sul tronco del bancone e dire la formula
            a occhi chiusi. Senti per un momento il legno sotto mille gomiti
            diversi, e una voce di donna che contratta su un prezzo in una lingua
            che non conosci. Quando apri gli occhi Ambrin ti chiede che cosa hai
            sentito, e dalla risposta capisci che a lui il bancone racconta
            un'altra cosa.
          effetti: { monete: -250, incantesimo.eco: 1 }
        fallimento:
          titolo: Non ancora
          testo: |
            Posi il palmo sul bancone e dici la formula, e senti soltanto il
            legno freddo e il ronzio delle lanterne. Ambrin ti dice che i luoghi
            parlano a chi sa stare zitto, e che tu, mentre dicevi la formula,
            pensavi già a cosa avresti sentito. Il corvo, dal bancone, si gratta
            la testa con una zampa.

      - testo: "Comando"
        immagine: ambientazione/mito-salvaguardia-precursori
        requisiti: [magia >= 5, rep.nodo >= 6, pista.capomozzo >= 5, incantesimo.comando == 0, monete >= 400]
        costo: 2
        descrizione: "Hai visto le rovine sotto Capomozzo. Questa è la lingua delle macchine della Salvaguardia. È la formula più cara del banco, e ogni lancio costa mezza tacca di Contaminazione."
        prova: { attributo: mentale, abilita: magia, difficolta: Molto difficile }
        successo:
          titolo: Il congegno di ottone
          testo: |
            Ambrin prende dal mobile un congegno di ottone grande come una noce,
            uno di quelli che ticchettano senza che si sappia a cosa servano, e
            lo posa davanti a te. Dici la formula, che non somiglia a nessuna
            lingua, e il congegno smette di ticchettare. Lo ripeti al contrario,
            e riparte. Ambrin lo rimette nel cassetto con molta cura e per il
            resto della sera parla poco.
          effetti: { monete: -400, incantesimo.comando: 1 }
        fallimento:
          titolo: Non ancora
          testo: |
            Dici la formula al congegno di ottone, e il congegno accelera fino a
            ronzare. Ambrin lo chiude in pugno finché si ferma, poi ti dice che
            le macchine sentono l'esitazione meglio delle persone, e che con
            questa formula prima di dirla bisogna già averla detta cento volte.
            Quando riapre la mano, sul palmo ha un segno rosso a forma di ruota
            dentata.

  # ------------------------------------------------------------ storia a 2 · il corvo del bancone
  - id: il-corvo-del-bancone
    presso: mercato-dei-nodi
    immagine: ambientazione/nodo-d-ossidiana
    titolo: Il corvo del bancone
    sommario: "Ambrin ti ha lasciato la bottega per un'ora. Entra una signora con una gabbia dorata, e vuole comprare il corvo."
    luogo: Il Nodo d'Ossidiana, a metà mattina
    area: ponti-sospesi
    requisiti: [rep.nodo >= 2, nodo.corvo == 0]
    testo: |
      Il cartello appeso alla porta del Nodo d'Ossidiana dice *torno subito*, e
      sotto, con un'altra penna, Ambrin ha aggiunto *il corvo resta*. La porta
      è aperta. Sul bancone trovi un biglietto con il tuo nome, fermato da una
      moneta. Ambrin è alla Casa dei Nodi per i dazi del mese e ti chiede di
      tenere d'occhio la bottega per un'ora. In fondo ha scritto *se entra
      qualcuno, decide lui*.

      Il corvo è al suo posto sul tronco del bancone e non ti degna di uno
      sguardo. Ti siedi sullo sgabello di Ambrin, che è più alto di quanto
      pensassi, e aspetti con i piedi a penzoloni.

      Dopo poco la campanella suona, ed entra una signora anziana con un
      cappello a tesa larga e in mano una gabbia dorata, vuota a parte un
      biscotto di semi appoggiato sul fondo. Si ferma davanti al bancone e
      guarda il corvo a lungo, senza badare a te.

      «Pago bene» dice alla fine, e posa la gabbia sul legno. «Mi chiamo
      Clelia Varrone. Questo corvo era di mia nonna, e io sono venuta a
      riportarlo a casa.»

      Il corvo gira la testa verso la gabbia e poi verso di te. *Ambrin, questa
      me la paghi.* Le tue dita intanto hanno trovato la moneta del biglietto,
      e la girano senza sosta.
    opzioni:
      - testo: "Chiederle di sua nonna"
        descrizione: "Una signora che porta una gabbia dorata attraverso tutto il Mercato ha una storia da raccontare. Basta lasciarla parlare."
        prova: { attributo: sociale, abilita: [empatia, galateo], difficolta: Media }
        successo:
          titolo: La pergola
          testo: |
            Le cedi lo sgabello, e lei ci sale con un certo sforzo. Sua nonna
            abitava nei Quartieri Alti in una casa con la pergola, dove il corvo
            passava le giornate prima di rientrare la sera dalla finestra, e
            sotto l'ala sinistra aveva una penna bianca. Quarant'anni fa, il
            giorno in cui la nonna morì, uscì da quella finestra e non tornò più.
            Mentre lei racconta il corvo apre piano l'ala sinistra, e fra le
            penne nere ce n'è una bianca. Clelia smette di parlare e resta a
            guardarla. Poi riprende la gabbia, ma il biscotto lo lascia
            sul bancone. «Da casa nostra se n'è andato da solo, e non posso
            comprarlo come un cappello» dice.
          pe: { empatia: 5 }
          imposta: { nodo.corvo: 1 }
          effetti: { rep.nodo: 1 }
          segue: prima-di-ambrin
        fallimento:
          titolo: Il commesso
          testo: |
            Le chiedi della nonna con troppa fretta, e lei ti guarda come si
            guarda un commesso che ha toccato la merce con le mani sporche. Dice
            che non è venuta fin qui a raccontare la sua famiglia a chi sta
            dietro un bancone in prestito. Lascia la gabbia sul legno e ti avverte
            che tornerà quando ci sarà il padrone. Il corvo tiene gli occhi
            socchiusi per tutto il tempo, e il biscotto resta nella gabbia.

      - testo: "Guardare sotto l'ala del corvo"
        descrizione: "Se era di sua nonna, ci sarà un segno. Il corvo però si fa toccare da pochi, e tu non sei ancora fra quelli."
        prova: { attributo: sociale, abilita: addestrare-animali, difficolta: Media }
        successo:
          titolo: La penna bianca
          testo: |
            Prendi il biscotto dalla gabbia e ne posi una briciola sul bancone,
            poi un'altra un po' più vicino alla tua mano. Il corvo le
            mangia tutte senza fretta. All'ultima ti lascia sollevare l'ala
            sinistra con un dito, e sotto, fra le penne nere, ce n'è una bianca.
            Clelia Varrone si porta una mano alla bocca. Ti racconta della casa
            della nonna con la pergola, e del giorno in cui il corvo è volato via
            dalla finestra, quarant'anni fa, mentre la nonna moriva. Poi riprende
            la gabbia vuota. «Se n'è andato da solo» dice. «Allora resta dove ha
            scelto.»
          pe: { addestrare-animali: 5 }
          imposta: { nodo.corvo: 1 }
          effetti: { rep.nodo: 1 }
          segue: prima-di-ambrin
        fallimento:
          titolo: Il dito
          testo: |
            Allunghi la mano verso l'ala, e il corvo ti pizzica il dito con il
            becco una volta sola e senza fare sangue, con molta precisione. Poi ti
            volta la schiena. Clelia Varrone dice che anche con sua nonna faceva
            così con gli estranei, e che la cosa la convince ancora di più. Lascia
            la gabbia sul bancone e se ne va, promettendo di tornare con Ambrin
            presente.

      - testo: "Lasciare che scelga lui"
        descrizione: "Il biglietto di Ambrin dice che decide il corvo. Basta aprire la gabbia."
        esito:
          titolo: Il biscotto
          testo: |
            Apri lo sportello della gabbia e ti metti da parte. Il corvo scende
            dal suo posto e va alla gabbia a piccoli salti, ci entra, prende il
            biscotto di semi e riesce. Poi lo lascia cadere nel tuo palmo e torna
            sul tronco del bancone come se non si fosse mai mosso. Clelia Varrone
            guarda il biscotto nel tuo palmo, e alla fine ride piano. Dice
            che anche con sua nonna faceva così, portava i regali a chi gli
            pareva, e che quarant'anni fa, il giorno in cui la nonna morì, è
            volato via dalla finestra per non tornare più. Quando aggiunge che
            aveva una penna bianca sotto l'ala sinistra, il corvo apre l'ala quel
            tanto che basta a fartela vedere. Clelia si riprende la gabbia vuota
            e ti lascia il biscotto.
          pe: { addestrare-animali: 5 }
          imposta: { nodo.corvo: 1 }
          effetti: { rep.nodo: 1 }
          segue: prima-di-ambrin

      - testo: "Inventarti una ragione per non venderlo"
        descrizione: "Una signora così non accetta un no. Accetta un regolamento, se ha l'aria abbastanza ufficiale."
        prova: { attributo: sociale, abilita: [ingannare, persuasione], difficolta: Media }
        successo:
          titolo: Il registro della Gilda
          testo: |
            Le spieghi con molta serietà che il corvo è iscritto nei registri
            della Gilda come arredo della bottega, e che per venderlo serve la
            firma dell'ispettore dei dazi Varn Kett, che per i volatili chiede
            sei settimane. Clelia Varrone ti squadra da sotto il cappello.
            Poi dice che sua nonna aveva lo stesso corvo, con una penna bianca
            sotto l'ala sinistra, e che quarant'anni fa se n'è andato da solo. Si
            riprende la gabbia, ma prima ti dice che di regolamenti ne ha visti
            tanti, e che il tuo è il più gentile.
          pe: { ingannare: 5 }
          imposta: { nodo.corvo: 1 }
          effetti: { rep.nodo: 1 }
          segue: prima-di-ambrin
        fallimento:
          titolo: Varn Kett
          testo: |
            Le spieghi che per vendere il corvo serve la firma dell'ispettore dei
            dazi. Clelia Varrone ti risponde che Varn Kett cena a casa sua ogni
            primo del mese, e che glielo chiederà stasera stessa. Lascia la gabbia
            sul bancone come pegno. Quando se ne va il corvo infila il becco fra
            le sbarre e si prende il biscotto.

  - id: prima-di-ambrin
    immagine: personaggi/ambrin-qell
    titolo: Prima di Ambrin
    tipo: seguito
    luogo: Il Nodo d'Ossidiana, al tramonto
    area: ponti-sospesi
    requisiti: [nodo.corvo >= 1]
    testo: |
      Ambrin torna dalla Casa dei Nodi al tramonto, con la borsa dei dazi più
      leggera e una macchia d'inchiostro sul polsino. Gli racconti di Clelia
      Varrone mentre lui accende le lanterne una alla volta, e a metà racconto
      smette di accenderle e resta con la candela di servizio in mano.
      Quando arrivi alla penna bianca va a sedersi sulla scaletta del
      retrobottega.

      «Il vecchio che teneva la bottega prima di me mi ha venduto i muri
      insieme agli scaffali, e con gli scaffali c'era lui» dice. «Me l'ha
      detto solo alla fine, quando avevo già firmato. Il corvo era compreso nel prezzo, e c'erano due
      regole. Niente carne, e niente domande davanti ai clienti.» Si gira verso
      il bancone, dove il corvo sta ritto sul tronco con gli occhi semichiusi.
      «Il vecchio non mi ha mai detto da dove venisse. Adesso so almeno dov'era
      quarant'anni fa.»

      Fuori il Mercato sta chiudendo, e qualcuno trascina una cassa sulle assi
      del ponte, che rimbombano sotto i tuoi piedi.
    opzioni:
      - testo: "Chiedergli quando ha preso la bottega"
        descrizione: "I conti degli anni, con Ambrin, non tornano mai. Magari stasera sì."
        esito:
          titolo: Un'altra lanterna
          testo: |
            Ambrin sorride, come ogni volta che qualcuno gli chiede degli anni,
            e si alza ad accendere la lanterna che aveva lasciato spenta. Ti dice
            che il vecchio era un nano che vendeva chiavi e serrature, e che sul
            retro del bancone c'è ancora la sua tacca per i ladri, la prima. Poi
            ti chiede quanto avresti chiesto a Clelia Varrone per il corvo, se
            fossi stato tu il padrone, e della bottega non parla più.
          pe: { empatia: 3 }
      - testo: "Chiedergli che cosa vuol dire niente domande davanti ai clienti"
        descrizione: "Una regola così si dà per un motivo. Adesso i clienti sono andati tutti."
        esito:
          titolo: La regola
          testo: |
            «Vuol dire quello che dice» risponde Ambrin, e guarda la porta, che è
            chiusa. Il corvo apre un occhio e lo richiude. Ambrin ti dice che in
            tanti anni la regola l'ha sempre rispettata, e che non ha nessuna
            intenzione di scoprire che cosa succede a non rispettarla. Poi ti
            versa un bicchiere di vino di more e cambia discorso, e per il
            resto della sera ti racconta dei dazi della Gilda con molto
            entusiasmo.
          pe: { percezione: 3 }
      - testo: "Dargli il biscotto di semi"
        descrizione: "Ce l'hai ancora in tasca, o sul bancone. Il corvo lo ha scelto per qualcuno."
        esito:
          titolo: Il regalo
          testo: |
            Posi il biscotto di semi sul bancone, davanti al corvo. Lui lo guarda,
            poi lo spinge con il becco verso di te, finché non lo riprendi.
            Ambrin ride piano e ti dice di tenerlo, perché un corvo che fa un
            regalo e se lo vede tornare indietro se la lega al dito. Lo metti in
            tasca. Lo ritroverai sbriciolato fra una settimana, e non avrai il
            coraggio di buttarlo.
          pe: { addestrare-animali: 3 }

  # ------------------------------------------------------------ storia a 4 · il cassetto chiuso
  - id: il-cassetto-chiuso
    presso: mercato-dei-nodi
    immagine: ambientazione/nodo-d-ossidiana
    titolo: Il cassetto chiuso
    sommario: "Nel mobile a cento cassetti uno non si è mai aperto. Da qualche giorno il corvo ci batte sopra il becco, e Ambrin ha deciso di dargli retta."
    luogo: Il Nodo d'Ossidiana, il retrobottega
    area: ponti-sospesi
    requisiti: [rep.nodo >= 4, nodo.cassetto == 0]
    testo: |
      Nel retrobottega il mobile a cento cassetti è quasi tutto in ordine, con
      le etichette nuove accanto a quelle sbiadite di Ambrin. Uno solo, alla
      settima fila, non ha il pomello. Ha una serratura senza chiave e
      un'etichetta così vecchia che la carta ha preso il colore del legno, con
      scritto *da lasciare chiuso, anche per me*. Da qualche giorno il corvo
      ci passa davanti, ci batte sopra il becco piano e poi torna al bancone.

      Oggi Ambrin è seduto sulla scaletta con una chiave annerita fra le dita,
      e non sorride. «Lì dentro c'è una cosa che ho rubato quando facevo un
      altro mestiere, e lo facevo bene» dice. «Era di un Raschiatore, Tam
      Orrin, che l'aveva portata su dal Labirinto e la teneva sotto il letto.
      Da lei ho imparato le formule che ti insegno. Tam andò alla Gilda a
      denunciare il furto e nessuno gli credette, allora scese a cercarne
      un'altra e non tornò. Sua figlia Sefa vende lanterne sul ponte, tre banchi
      più in là.»

      Ti mette la chiave nel palmo, ancora calda della sua mano. «Il corvo dice
      che è ora. Se lo apro io mi rimetto a leggere, quindi lo apri tu.»

      Nel cassetto c'è una tavoletta di metallo opaco grande come una mano,
      incisa di cerchi fittissimi. *Non guardarla di sbieco.* Le linee si
      spostano appena, ogni volta che sposti gli occhi.
    opzioni:
      - testo: "Leggere la tavoletta"
        descrizione: "Ambrin ci ha imparato le Formule precuriane, e ci ha lasciato un pezzo della testa. Una riga sola."
        immagine: ambientazione/rovine-dei-precursori
        prova: { attributo: mentale, abilita: [magia, accademiche], difficolta: Difficile }
        successo:
          titolo: Il terzo cerchio
          testo: |
            Leggi il cerchio più esterno, e la testa te lo traduce da sola, una
            parola dopo l'altra. Nel secondo c'è la Maledizione che insegna
            Ambrin, scritta più lunga di come la dice lui, mentre il terzo
            contiene un pezzo di formula che non hai mai sentito e che ti
            resta in testa per tutto il giorno, come una cantilena. Quando alzi gli occhi Ambrin ha già
            richiuso il cassetto, e ti lascia la chiave sul palmo. «Adesso ce
            l'hai tu, perché io ho smesso. Quando vorrai smettere anche tu, sai
            dov'è il Ponte dei Morti» dice.
          pe: { magia: 5 }
          imposta: { nodo.cassetto: 1 }
          effetti: { rep.nodo: 1, tormento: 0.5, informazioni.segreto: 1 }
        fallimento:
          titolo: Le linee
          testo: |
            Provi a leggere il cerchio più esterno, e le linee ti scivolano sotto
            gli occhi fino a farti girare la testa. Ti siedi sul pavimento del
            retrobottega con un dolore sordo dietro la fronte. Ambrin richiude il
            cassetto, si riprende la chiave e ti porta un bicchiere d'acqua. Ti
            dice che a lui la prima volta è andata uguale, e che avrebbe fatto
            meglio a fermarsi lì.
          effetti: { tormento: 0.5 }

      - testo: "Portarla a Sefa Orrin"
        descrizione: "Era di suo padre. Qualcuno deve dirglielo, e Ambrin non ha mai trovato le parole da solo."
        immagine: ambientazione/mercato-dei-nodi
        prova: { attributo: sociale, abilita: [empatia, persuasione], difficolta: Media }
        successo:
          titolo: Le lanterne di Sefa
          testo: |
            Sefa Orrin ha le mani nere di fuliggine e una lanterna mezza smontata
            sul banco. Ambrin parla per primo e si perde dopo due frasi, e allora
            finisci tu, con le parole più semplici che trovi. Sefa prende la
            tavoletta e la pulisce con il grembiule. Dice che l'ultimo inverno suo
            padre ne parlava tutte le sere, e lei pensava fosse il vino. La
            venderà alla Gilda, perché la Gilda paga bene i pezzi dei Precursori,
            e per una volta i soldi di suo padre li prenderà lei. Ambrin annuisce
            e non chiede di riaverla.
          pe: { empatia: 5 }
          imposta: { nodo.cassetto: 1 }
          effetti: { rep.nodo: 1 }
        fallimento:
          titolo: Il banco delle lanterne
          testo: |
            Al banco delle lanterne cominci dal furto, e Sefa Orrin smette di
            ascoltarti alla parola *rubato*. Ambrin prova a spiegare e peggiora le
            cose. Sefa vi dice di andarvene prima che chiami i Custodi di
            Passaggio, e di riportare indietro quella roba, perché suo padre è
            morto per colpa sua. Tornate al Nodo con la tavoletta avvolta in uno
            straccio, e Ambrin la rimette nel cassetto senza dire niente.

      - testo: "Gettarla dal Ponte dei Morti"
        descrizione: "Sotto la lanterna di Tam Orrin, nel vuoto della Cicatrice. Così non la legge più nessuno."
        immagine: ambientazione/ponte-dei-morti
        esito:
          titolo: La terza lanterna
          testo: |
            Ambrin ti accompagna al Ponte dei Morti e si ferma alla terza lanterna
            dopo il gabbiotto dei Custodi. Il cristallo è nuovo, e capisci che lo
            cambia lui, ogni anno. Butti la tavoletta oltre il parapetto e la
            guardi sparire nella nebbia, senza sentirla toccare il fondo. Ambrin
            resta appoggiato al metallo freddo per un pezzo. Poi ti dice che le
            formule ce le ha in testa comunque, e che almeno adesso nessuno le
            impara più da lì. Sulla via del ritorno ti offre da bere al Grifone e
            paga lui.
          pe: { resilienza: 5 }
          imposta: { nodo.cassetto: 1 }
          effetti: { rep.nodo: 1 }

      - testo: "Richiudere il cassetto"
        descrizione: "Forse il corvo ha fretta, e Ambrin no. Una cosa chiusa da tanti anni può restare chiusa ancora un po'."
        costo: 0
        esito:
          titolo: La chiave al collo
          testo: |
            Richiudi il cassetto e gli rendi la chiave. Ambrin se la rimette al
            collo su un cordino nuovo, e tira un sospiro lungo. Il corvo vola sul
            mobile a battere il becco sul cassetto, come faceva prima, poi torna
            al bancone a lisciarsi le penne. «Lui ha pazienza, più di me di
            sicuro» dice Ambrin, e ti versa un tè che si è già raffreddato.

  # ------------------------------------------------------------ storia a 6 · socio del Nodo
  - id: socio-del-nodo
    presso: mercato-dei-nodi
    immagine: personaggi/ambrin-qell
    titolo: Socio del Nodo
    sommario: "Ambrin Qell chiude la bottega a metà pomeriggio e ti fa sedere nel retrobottega. Sul tavolo c'è una chiave d'ottone."
    luogo: Il Nodo d'Ossidiana, il retrobottega
    area: ponti-sospesi
    requisiti: [rep.nodo >= 6, nodo.socio == 0]
    testo: |
      A metà pomeriggio Ambrin gira il cartello sulla porta e ti fa sedere
      nel retrobottega, davanti al mobile a cento cassetti. Sul tavolo ci
      sono due tazze di tè di fiori, che lui beve bollente, e una chiave
      d'ottone brunito con il serpente alato dell'insegna inciso
      sull'impugnatura. Il corvo sta in cima al mobile, e per una volta tiene
      gli occhi fissi sulla chiave.

      «Mi serve un socio» dice Ambrin, e ti spinge la tazza più vicino. «Uno
      che compri dai Raschiatori quando io sono al bancone, e che abbia la
      chiave di questa stanza. Su quello che porti ti tieni la tua parte.
      Il corvo dice dodici, però i conti li tengo io.» Si scosta la ciocca
      dalla fronte, e per la prima volta da quando lo conosci ci mette un po' a
      trovare le parole. «Prima lui deve vederti lavorare da solo, una giornata
      intera, mentre io sono alla Casa dei Nodi. Ha le sue regole e io le
      rispetto. Come la passi, la giornata, lo scegli tu.»

      *Ho visto fare un socio per molto meno, e senza chiedere il parere di un
      uccello.* Il tè è troppo caldo, e lo bevi lo stesso.
    opzioni:
      - testo: "Vendere a chi non sa cosa vuole"
        descrizione: "Al Nodo entra gente che cerca un regalo e non sa per chi. Ambrin dice che sono i clienti migliori."
        prova: { attributo: sociale, abilita: [persuasione, galateo], difficolta: Difficile }
        successo:
          titolo: Il regalo giusto
          testo: |
            A metà mattina entra un ragazzo della Caserma che cerca un regalo per
            la madre e ha in tasca poche monete. Gli fai raccontare della madre
            finché salta fuori che non dorme da quando è finita la razzia, e gli
            vendi un sacchetto di lavanda legato con un nastro, che costa
            quanto può permettersi. Il ragazzo esce contento. Il corvo lo segue con gli occhi
            fino alla porta e poi si gira verso di te, e lì resta.
          pe: { persuasione: 5 }
          segue: la-chiave-del-retrobottega
        fallimento:
          titolo: L'anello sbagliato
          testo: |
            A metà mattina entra un ragazzo della Caserma che cerca un regalo per
            la madre, e tu gli vendi un anello che costa tutto quello che ha in
            tasca. Due ore dopo torna con la madre, che te lo restituisce con
            molta educazione. Il corvo osserva tutta la scena dal bancone.
            Quando Ambrin rientra il corvo non lo saluta, e Ambrin ti dice che
            per la chiave ci sarà un'altra giornata.

      - testo: "Riconoscere un falso"
        descrizione: "Un Raschiatore porta un pezzo dei Precursori che vale una fortuna, se è vero. Al Mercato dei Nodi lo è uno su tre."
        immagine: ambientazione/rovine-dei-precursori
        prova: { attributo: mentale, abilita: [percezione, accademiche], difficolta: Difficile }
        successo:
          titolo: La vernice verde
          testo: |
            Il Raschiatore posa sul bancone una piastra di metallo con un cerchio
            inciso e un prezzo già deciso. La esamini con la lente di
            Ambrin. L'incisione è precisa, però nel solco del cerchio c'è un
            residuo di vernice verde, la stessa che usano in Città Bassa per
            invecchiare il ferro. Glielo fai vedere, e il Raschiatore si riprende
            la piastra senza discutere. Il corvo, che per tutto il tempo l'aveva
            guardata con il becco aperto, lo chiude.
          pe: { percezione: 5 }
          segue: la-chiave-del-retrobottega
        fallimento:
          titolo: La piastra
          testo: |
            Compri la piastra con il cerchio inciso per la metà di quanto chiedeva
            il Raschiatore, convinto di aver fatto un affare. Quando Ambrin torna
            ci passa sopra un dito bagnato, e il dito diventa verde. Ti dice che
            l'ha comprata anche lui anni fa dallo stesso Raschiatore, e che
            adesso ne hanno due. Per la chiave il corvo vuole un'altra giornata.

      - testo: "Tenere lontani i borseggiatori"
        descrizione: "Il giorno di mercato davanti al Nodo passano mezza Qir-Azel e i suoi ladri. Basta che nessuno entri a lavorare."
        immagine: ambientazione/mercato-dei-nodi
        prova: { attributo: sociale, abilita: [conoscenze-della-strada, intimidire], difficolta: Media }
        successo:
          titolo: La soglia
          testo: |
            Passi la giornata appoggiato allo stipite della porta, e ogni volta
            che una mano si allunga verso il cesto degli amuleti in vetrina guardi
            il proprietario della mano finché la ritira. A un ragazzino che ci
            riprova tre volte offri un biscotto di semi purché vada a provarci
            altrove. Quando Ambrin torna non manca niente, e nell'angolo del
            bancone non c'è da incidere nessuna tacca nuova.
          pe: { conoscenze-della-strada: 5 }
          segue: la-chiave-del-retrobottega
        fallimento:
          titolo: La tacca
          testo: |
            Passi la giornata sulla soglia, e a metà pomeriggio ti accorgi che dal
            cesto in vetrina manca un amuleto, senza che tu abbia visto passare
            nessuna mano. Quando Ambrin torna incide una tacca nuova nell'angolo
            del bancone e ti presta il coltello per incidere la tua accanto. Il
            corvo ti volta la schiena, che è il suo modo di dire di no, e la
            chiave resta sul tavolo.

      - testo: "Fare come dice il corvo"
        descrizione: "Se il giudice è lui, tanto vale lasciargli la bottega. Tu stai a guardare e fai quello che ti indica."
        costo: 2
        esito:
          titolo: Il giorno del corvo
          testo: |
            Per tutta la giornata non decidi niente. Quando entra un cliente
            guardi il corvo, e il corvo guarda uno scaffale, e tu porti al
            cliente quello che c'è su quello scaffale. Due volte su tre è la cosa
            giusta, e la terza il cliente la compra lo stesso per non
            contraddire un uccello. A sera hai venduto più di quanto vende Ambrin
            in un giorno buono. Quando lui rientra legge il registro, poi guarda
            il corvo, che si sta lisciando le penne e non lo degna di uno sguardo.
          pe: { addestrare-animali: 5 }
          segue: la-chiave-del-retrobottega

      - testo: "Dirgli che non è il momento"
        descrizione: "Una chiave è un impegno, e un socio non sparisce per settimane. Ambrin sa aspettare."
        costo: 0
        esito:
          titolo: La tazza vuota
          testo: |
            Gli dici che gli fa onore, e che per adesso non puoi promettergli le
            tue giornate. Ambrin annuisce e finisce il suo tè. Mette la chiave in
            un cassetto qualunque senza etichetta, e ti dice che saprai trovarla
            quando ti servirà. Il corvo scende dal mobile e torna al bancone,
            dove c'è più luce.

  - id: la-chiave-del-retrobottega
    immagine: personaggi/ambrin-qell
    titolo: La chiave del retrobottega
    tipo: seguito
    luogo: Il Nodo d'Ossidiana, la sera
    area: ponti-sospesi
    requisiti: [nodo.socio == 0]
    testo: |
      Ambrin rientra dalla Casa dei Nodi quando le lanterne del Mercato sono
      già accese, e ascolta il racconto della tua giornata appoggiato al
      bancone, con il cappotto ancora addosso. Il corvo lo lascia parlare. Poi
      scende dal tronco, attraversa il bancone a piccoli salti fino alla chiave
      d'ottone che Ambrin ha posato accanto al registro, e ci mette sopra una
      zampa.

      «Bene» dice Ambrin, e per un momento sembra più sollevato che contento.
      «Allora le regole sono queste. Quello che sta sotto il bancone non si
      vende senza chiedere a me. Il mobile dei cassetti lo puoi aprire tutto,
      tranne quando il corvo ci sta seduto sopra. E la carne non gliela dai
      mai, anche quando ti fissa il piatto con tutti e due gli occhi.»

      Il corvo toglie la zampa dalla chiave e la spinge di un dito verso di te.
      Fuori il Mercato si svuota, e il ponte sotto la bottega vibra al
      passaggio dell'ultimo carro.
    opzioni:
      - testo: "Prendere la chiave"
        descrizione: "La chiave del retrobottega, la tua parte su quello che porti e un corvo che ti tiene d'occhio per conto del socio."
        esito:
          titolo: Socio del Nodo
          testo: |
            Prendi la chiave, che è più leggera di quanto sembrava, con l'ottone
            consumato nel punto dove il pollice la tiene per girarla. Ambrin ti
            stringe la mano, poi apre il registro e scrive il tuo nome sotto il
            suo, con una riga a parte per la percentuale. Il corvo ti guarda
            infilare la chiave in tasca e torna al suo posto sul tronco. «Domani
            all'alba risale una squadra dal Labirinto, e ci vai tu. Non pagare la
            prima cifra che ti dicono» dice Ambrin, già chino sul registro.
          imposta: { nodo.socio: 1 }
          effetti: { rep.nodo: 1 }
      - testo: "Rifiutare con garbo"
        descrizione: "Per adesso preferisci restare uno di passaggio. Ambrin lo capirà, il corvo chissà."
        esito:
          titolo: Il gancio
          testo: |
            Gli dici che per adesso preferisci restare uno di passaggio, e gli
            rendi la chiave. Ambrin la soppesa, poi la appende a un gancio dietro
            il bancone, accanto al mantello color petrolio. Ti dice che resta lì,
            e che quando la vorrai dovrai rifare la giornata, perché le regole
            del corvo valgono anche per lui. Il corvo ti volta la schiena fino a
            quando non esci.

  # ------------------------------------------------------------ la carta
  - id: carta-un-acquirente-al-mercato
    immagine: ambientazione/mercato-dei-nodi
    titolo: Un acquirente al Mercato
    sommario: "Un forestiero sta per pagare una fortuna per un pezzo dei Precursori, a una bancarella che i pezzi dei Precursori li fabbrica."
    luogo: Ponte delle Mille Corde, il Mercato dei Nodi
    tipo: carta
    area: ponti-sospesi
    requisiti: [rep.nodo < 2]
    testo: |
      Sulla piattaforma più larga del Mercato dei Nodi la gente si ferma a
      guardare una trattativa. Dietro la bancarella c'è un uomo magro con un
      grembiule di cuoio e le unghie verdi fino alla radice. Davanti, c'è un
      forestiero con un cappotto foderato di pelliccia, troppo pesante per i
      Ponti, che tiene in mano un ingranaggio grande come un piatto e lo gira
      verso la luce delle lanterne. Sul cartello della bancarella qualcuno ha
      scritto *autentici*, e poi, per sicurezza, l'ha sottolineato due volte.

      «Ti faccio un prezzo da amico, è un regalo» dice il venditore. «Viene dal
      Labirinto, l'ha portato su mio cugino.»

      Il forestiero ti vede fra i curiosi e ti fa un cenno, come si fa con
      l'unica faccia che sembra del posto. «Lei è di qui? Un amico mi ha detto
      di cercare una bottega con un corvo sul bancone, ma questo signore dice
      che la bottega con il corvo ha chiuso.» Il venditore ti guarda,
      sorridendo con tutti i denti, e muove appena la testa da una parte
      all'altra.
    opzioni:
      - testo: "Accompagnarlo al Nodo d'Ossidiana"
        descrizione: "La bottega con il corvo è aperta, ed è a due piattaforme da qui."
        esito:
          titolo: Il corvo sul bancone
          testo: |
            Lo accompagni attraverso il Mercato fino alla facciata stretta di
            pietra chiara, con il serpente alato sull'insegna. Ambrin Qell vi
            accoglie con un sorriso largo, e dopo dieci minuti il forestiero
            esce con un amuleto vero e un prezzo onesto. Sulla porta Ambrin ti
            ferma per chiederti il nome, e lo ripete due volte per ricordarlo.
            Il corvo, dal bancone, ti guarda finché non sei sparito fra la folla.
          effetti: { rep.nodo: 0.5 }
      - testo: "Dirgli che è un falso"
        descrizione: "Quelle unghie verdi vengono da qualche parte. Il ferro vecchio non tinge le dita."
        prova: { attributo: mentale, abilita: percezione, difficolta: Facile }
        successo:
          titolo: Le unghie verdi
          testo: |
            Prendi l'ingranaggio dalle mani del forestiero e ci passi sopra il
            pollice, che diventa verde come le unghie del venditore. Lo fai
            vedere a tutti i curiosi. Il venditore smonta la bancarella in un
            attimo, e il forestiero ti regala qualche moneta per il disturbo. Ti
            chiede anche della bottega con il corvo, ma ormai sei di fretta e gli
            indichi la direzione con la mano.
          effetti: { monete: 2 }
        fallimento:
          titolo: Il cugino
          testo: |
            Dici che l'ingranaggio è falso, ma quando il forestiero ti chiede come
            lo sai non trovi una ragione da mostrargli. Il venditore ti dà del
            geloso e giura sul cugino. Il forestiero paga quanto gli chiede e se
            ne va contento con l'ingranaggio sotto il braccio. Il venditore,
            mentre conta i soldi, ti strizza l'occhio.
      - testo: "Lasciar perdere"
        descrizione: "Al Mercato dei Nodi il prezzo dipende da chi ti guarda mentre paghi. Oggi non guardi tu."
        costo: 0
        esito:
          titolo: Tra la folla
          testo: |
            Scrolli le spalle e ti allontani tra la folla. Dietro di te senti il
            forestiero contare le monete ad alta voce, e il venditore ringraziarlo
            con molto calore. Sulla piattaforma accanto un vecchio mercante della
            Gilda scuote la testa, poi torna a piegare le sue stoffe prima che il
            vento gliele porti via.
