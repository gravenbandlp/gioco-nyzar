# La città viva, luogo 14: i luoghi minori della Città Bassa (area citta-bassa). Niente reputazione
# nuova: una storia per luogo, chiusa dal suo flag, e il turno alla Segheria, l'unica attività che mancava.
# - Scuderie della Zanna Rotta: `dolovan-e-gli-orchi` (pista.tribu >= 1). scuderie.stroud: 1 l'orco resta
#   a lavorare da Stroud, 2 va all'Orlo da Grusk, 3 lo mandi via. Con cuccioli == 1 c'è una via in più.
#   L'attività è `strigliare-alla-zanna-rotta` (allenamento.yaml).
# - Orlo dei Rottami: `la-bilancia-di-grusk`. orlo.grusk: 1 la bilancia storta sfugge al pesatore,
#   2 raddrizzata e il quarto in più dichiarato sul cartello, 3 il pesatore chiude un occhio fino a sera,
#   4 multa e sigillo. Le attività sono `orlo-rottami` e `i-ragazzi-dell-orlo`.
# - Segheria e Mulino Malgrani: `un-turno-alla-segheria` (ripetibile, varianti prima e dopo pista.pelle 7)
#   e `la-segheria-dopo-i-malgrani` (pista.pelle >= 7). segheria.cooperativa: 1 Marko resta con la
#   cooperativa, 2 parte per Laresh, 3 resta dopo aver confessato la bugia su Rennick.
# - Acciaieria dei Tarvelin: `l-acciaieria-senza-padrone` (pista.acciaio >= 8). acciaieria.futuro: 1 la
#   Gilda, 2 gli operai in società, 3 Liaren con Irsa Valbrun come socia. Il protagonista ha ancora il
#   mazzo di chiavi di Ondrel (acciaio-segrete.yaml). L'attività è `turno-acciaieria` (citta-bassa.yaml).
# Nomi nuovi: Kharb (orco del Gradone Rosso), Tonio (il garzone di Stroud morto nella razzia), Fabrizio
# Lodde (pesatore della Gilda), Abele Torsi (capoturno del turno di giorno all'Acciaieria).
storylet:
  # ------------------------------------------------------------ Scuderie della Zanna Rotta
  - id: dolovan-e-gli-orchi
    presso: scuderie-della-zanna-rotta
    immagine: personaggi/dolovan-stroud
    titolo: L'orco al cancello
    sommario: "Stanotte un cavallo di Dolovan Stroud ha saltato la staccionata. Stamattina al cancello delle Scuderie c'è un orco che lo tiene per la cavezza."
    luogo: Scuderie della Zanna Rotta, all'alba
    area: citta-bassa
    requisiti: [scuderie.stroud == 0, pista.tribu >= 1]
    testo: |
      Arrivi alle Scuderie della Zanna Rotta che il cielo è ancora grigio, e
      trovi Dolovan Stroud piantato a gambe larghe in mezzo al cortile, con la
      forca del fieno stretta in mano. Squash gli sta alle spalle e allunga il
      collo sopra di lui per vedere meglio. Al cancello, accucciato sui talloni,
      c'è un orco giovane e magro, con piume di uccello intrecciate nei capelli
      e un sacco di tela fra i piedi. Tiene per la cavezza il grigio vecchio del
      recinto, quello che al trotto si ricorda di essere stato giovane.

      «Stanotte il grigio ha saltato la staccionata, e lui me l'ha riportato dal
      fosso» dice Stroud senza voltarsi. «Dice che sa ferrare e che cerca
      lavoro. Io gli ho detto che so scuoiare.» Sputa nella paglia, e gli viene
      uno sputo corto, da uomo che non ha dormito. «Il mio garzone è morto la
      notte delle Foglie Alate, e da allora i box li pulisco da solo. Lo so
      anch'io che mi serve qualcuno, e adesso lo sa pure lui.»

      {armi-da-mischia Facile} Stroud tiene la forca con le punte verso terra.
      Chi ha davvero intenzione di infilzare qualcuno le punte le alza.

      L'orco non si muove e non abbassa gli occhi. Il grigio gli annusa le piume
      a lungo, poi gli appoggia il muso sulla spalla e lo lascia lì. *Il cavallo
      ha già deciso, e Stroud se n'è accorto.* Senti le dita che si chiudono da
      sole intorno alla cinghia della bisaccia, mentre dietro la staccionata una
      cavalla batte lo zoccolo per avere la biada.

      {cavalcare Media} Il grigio tiene il peso su tre zampe e risparmia lo
      stinco davanti. Il salto della staccionata gli è costato qualcosa.
    opzioni:
      - testo: "Parlare con l'orco"
        descrizione: "Ha fatto mezza notte di strada dietro un cavallo che non era suo. Prima che Stroud decida, qualcuno dovrebbe chiedergli come si chiama."
        immagine: bestiario/orco
        prova: { attributo: sociale, abilita: [empatia, persuasione], difficolta: Media }
        successo:
          titolo: Le capre del Gradone
          testo: |
            Ti accucci accanto a lui sui talloni, alla sua altezza. Si chiama
            Kharb e parla un comune storto, con le parole messe in fila una alla
            volta. Al Gradone Rosso badava alle capre della tribù, e la notte
            della razzia l'hanno lasciato indietro con le bestie. Dopo, quando i
            suoi sono andati a chiedere asilo a Balthog, lui non li ha seguiti.

            {empatia Media} Quando dice capre gli si ammorbidisce la bocca.
            Degli orchi che l'hanno lasciato indietro invece parla come del
            tempo che fa.

            Lo riferisci a Stroud parola per parola. Stroud pianta la forca
            nella paglia e indica il box in fondo, il più lontano dalla strada.
            «A giornata, pagato in pane come tutti» dice. «E i clienti non ti
            devono vedere.»
          pe: { empatia: 5 }
          imposta: { scuderie.stroud: 1 }
          effetti: { informazioni.voce: 1 }
        fallimento:
          titolo: Troppe domande
          testo: |
            Gli fai troppe domande in fila sulla strada che ha fatto e su chi lo
            manda, e a ogni domanda l'orco si chiude un poco di più, finché
            smette di rispondere e guarda il grigio. Stroud ti guarda come
            guarderebbe un cavallo che scalcia nel box. Poi dice all'orco di
            lasciare la cavezza sul palo e di tornare domani, se gli resta la
            voglia. L'orco obbedisce senza fretta e si siede dall'altra parte
            della strada, sul suo sacco, con la schiena al muro.

      - testo: "Guardare la zampa del grigio"
        descrizione: "Il grigio ha un taglio fresco sullo stinco, e qualcuno ci ha già messo sopra qualcosa. Stroud non è ancora andato a vedere."
        immagine: ambientazione/scuderie-della-zanna-rotta
        prova: { attributo: mentale, abilita: [natura, percezione], difficolta: Media }
        successo:
          titolo: L'erba del fosso
          testo: |
            Ti chini sullo stinco del grigio. Il taglio è pulito, e sopra c'è un
            impiastro di foglie masticate tenuto fermo con un filo d'erba.
            Riconosci l'odore amaro della piantaggine, la stessa che Stroud fa
            seccare alla trave della selleria.

            {natura Facile} Masticata, perché la saliva la fa attaccare alla
            ferita. È un rimedio da pastori, di quelli che si imparano prima di
            imparare a contare.

            Glielo dici, e Stroud si accovaccia accanto al cavallo e annusa
            l'impiastro a lungo. «Chi te l'ha insegnata?» chiede all'orco senza
            guardarlo. «Mia madre» risponde lui. Stroud si rialza e gli butta
            una striglia, che l'orco prende al volo. «Una settimana. Poi
            vediamo.»
          pe: { natura: 5 }
          imposta: { scuderie.stroud: 1 }
        fallimento:
          titolo: La zampa sbagliata
          testo: |
            Ti chini sul grigio e gli alzi la zampa sbagliata, quella sana, che
            studi a lungo con grande serietà. Mentre la giri e la rigiri il
            cavallo si innervosisce e tira la cavezza, e l'orco lo calma con un
            suono basso della gola, che al grigio sembra bastare. Stroud vede la
            scena e diventa ancora più scuro in faccia. Dice all'orco di
            lasciare il cavallo sul palo e di tornare domani, e a te di tornare
            quando avrai imparato a contare le zampe.

      - testo: "Mandarlo all'Orlo da Grusk"
        descrizione: "All'Orlo dei Rottami lo spazzino è mezzo orco, e nessuno chiede da dove vieni. Le stalle di Stroud non sono l'unico lavoro della Città Bassa."
        immagine: personaggi/grusk
        esito:
          titolo: La carriola rossa
          testo: |
            Accompagni l'orco giù fino all'Orlo dei Rottami, e Stroud vi guarda
            andare via con la forca ancora in mano. Per tutta la discesa l'orco
            tiene il sacco stretto al petto, perché all'Orlo i rumori arrivano
            da ogni parte. Seduto sulla carriola rossa, Grusk osserva le piume a
            lungo con la testa inclinata. «Grusk una volta aveva i capelli» dice
            alla fine, e gli mette in mano un sacco di rottami da dividere, il
            ferro da una parte e il rame dall'altra.

            Quando ripassi dalle Scuderie, Stroud ha rimesso la forca al suo
            chiodo. Accanto al cancello, su un palo, ha lasciato mezza pagnotta,
            e non ti dice per chi.
          pe: { conoscenze-della-strada: 5 }
          imposta: { scuderie.stroud: 2 }

      - testo: "Dare ragione a Stroud"
        descrizione: "Stroud ha perso il suo garzone nella razzia. Tocca a lui decidere chi dorme nella sua paglia."
        esito:
          titolo: Tonio
          testo: |
            Dici all'orco che qui non c'è lavoro. Lui consegna la cavezza a
            Stroud e si incammina verso i boschi, con il sacco in spalla. Stroud
            manda un ragazzino alla Caserma ad avvisare, come fa ogni volta che
            vede un orco. Poi ti versa un dito di grappa nella selleria e
            racconta che il garzone si chiamava Tonio e aveva quattordici anni,
            e che la sera del Festival era salito in piazza a vedere le
            lanterne.

            {empatia Facile} Ha bisogno che qualcuno stia seduto lì mentre lo
            racconta, e la grappa è la scusa per tenerti.

            Mentre parla gira il bicchiere fra le dita, e la grappa non la beve.
          pe: { resilienza: 5 }
          imposta: { scuderie.stroud: 3 }
          effetti: { rep.caserma: 0.5 }

      - testo: "Raccontargli dei cuccioli di Capomozzo"
        descrizione: "Sotto Capomozzo hai aperto tre gabbie, e tre cuccioli d'orco sono corsi verso il mare. Stroud non lo sa."
        requisiti: [cuccioli == 1]
        esito:
          titolo: Fra dieci anni
          testo: |
            Gli racconti della stanza calda sotto Capomozzo, delle gabbie di
            assi e della ciotola sola che si contendevano in tre. Stroud ascolta
            fino in fondo appoggiato alla forca, e a un certo punto smette di
            masticare il filo di paglia che aveva in bocca. «Allora fra dieci
            anni quei tre li caccerò io» dice, e ride senza allegria. Poi si
            gira verso l'orco e gli chiede se anche lui ha cominciato in una
            gabbia.

            L'orco annuisce una volta sola. Stroud resta zitto per un pezzo, poi
            gli indica il box in fondo fino a domani sera, e si allontana con
            Squash dietro.
          pe: { empatia: 5 }
          imposta: { scuderie.stroud: 1 }

      - testo: "Guardare le orecchie del grigio"
        descrizione: "Il Circolo ti ha insegnato a guardare dove un cavallo tiene le orecchie. Il grigio le tiene sull'orco da quando sei arrivato."
        quando: [origine.figlio-del-circolo >= 1]
        prova: { attributo: sociale, abilita: addestrare-animali, difficolta: Facile }
        successo:
          titolo: Le orecchie del grigio
          testo: |
            Ti avvicini al grigio dal lato della spalla, con la mano bassa, e lo
            lasci annusare. Quando l'orco si sposta di un passo le orecchie del
            cavallo lo seguono, e quando Stroud alza la forca il grigio mette il
            muso fra loro due.

            {addestrare-animali Facile} Un cavallo che si mette in mezzo ha già
            scelto da che parte stare. Al Circolo dicevano che è l'unico voto
            onesto che si vede in una stalla.

            Lo fai notare a Stroud a voce bassa, nel modo in cui al Circolo si
            parla dei cavalli degli altri. Stroud guarda le orecchie del suo
            cavallo per un pezzo. Poi pianta la forca nella paglia e indica
            all'orco il box in fondo, il più lontano dalla strada. «Una
            settimana, poi vediamo» dice, e se ne va verso la selleria.
          pe: { addestrare-animali: 5 }
          imposta: { scuderie.stroud: 1 }
        fallimento:
          titolo: Troppo in fretta
          testo: |
            Ti avvicini al grigio troppo in fretta, con la voglia di far bella
            figura davanti a Stroud, e il cavallo scarta e tira la cavezza.
            L'orco lo calma con un suono basso della gola, che nel Bosco non ti
            hanno mai insegnato. Stroud guarda la scena e ci vede quello che
            vuole vederci. Dice all'orco di lasciare il cavallo sul palo e di
            tornare domani, se gli resta la voglia.

      - testo: "Parlargli nell'orchesco dei recinti"
        descrizione: "A Ghoran hai imparato l'orchesco dei sorveglianti. Detto da te, per una volta, può servire a chiedere un nome."
        quando: [origine.fuggiasco-di-ghoran >= 1]
        prova: { attributo: sociale, abilita: [empatia, intimidire], difficolta: Media }
        successo:
          titolo: Kharb
          testo: |
            Gli parli nell'orchesco storto dei recinti, piano, senza il tono dei
            sorveglianti, e ti accorgi che è la prima volta che lo usi per
            chiedere qualcosa. L'orco alza la testa di scatto e ti risponde
            nella stessa lingua, una parola alla volta. Si chiama Kharb, e al
            Gradone Rosso badava alle capre della tribù finché la notte della
            razzia l'hanno lasciato indietro con le bestie. Quando i suoi sono
            andati a chiedere asilo a Balthog lui non li ha seguiti.

            Traduci tutto a Stroud, che pianta la forca nella paglia e indica il
            box in fondo. «A giornata, pagato in pane come tutti, e i clienti
            non ti devono vedere» dice a Kharb, che lo capisce anche senza la
            tua traduzione.
          pe: { empatia: 5 }
          imposta: { scuderie.stroud: 1 }
          effetti: { informazioni.voce: 1 }
        fallimento:
          titolo: La voce dei sorveglianti
          testo: |
            Gli parli nell'orchesco dei recinti, e ti esce la voce che usavano i
            sorveglianti, quella corta che arrivava prima delle punizioni.
            L'orco abbassa gli occhi e smette di rispondere, e a te si chiude lo
            stomaco.

            {resilienza Media fallita} Quella voce ce l'avevi ancora in gola
            pronta all'uso, e fino a un momento fa non lo sapevi.

            Stroud guarda la scena senza capirla. Dice all'orco di lasciare la
            cavezza sul palo e di tornare domani, e l'orco obbedisce senza
            fretta e si siede dall'altra parte della strada, con la schiena al
            muro.

  # ------------------------------------------------------------ Orlo dei Rottami
  - id: la-bilancia-di-grusk
    presso: orlo-dei-rottami
    immagine: personaggi/grusk
    titolo: La bilancia di Grusk
    sommario: "Una volta all'anno il pesatore della Gilda scende all'Orlo a controllare le bilance degli spazzini. Quella di Grusk pende, e lui lo sa benissimo."
    luogo: Orlo dei Rottami, la baracca di Grusk
    area: citta-bassa
    requisiti: [orlo.grusk == 0]
    testo: |
      La baracca di Grusk sta in cima alla discesa dell'Orlo, fatta di lamiere
      inchiodate su un telaio di travi precuriane, e davanti alla porta, sotto
      una tettoia, c'è la bilancia. È una bilancia a due piatti alta quanto un
      uomo, con il giogo d'ottone annerito e i piatti ricavati da due scudi
      ammaccati, e anche da ferma pende un poco a sinistra. Sulla trave qualcuno
      ha scritto a gesso *peso giusto*, e qualcun altro ci ha aggiunto un punto
      interrogativo.

      {percezione Media} Il piatto di sinistra sta più basso anche vuoto, e
      sotto ha un rigonfiamento che uno scudo, di solito, non ha.

      Stamattina Grusk non canta. Ti viene incontro con gli occhi cerchiati, e i
      tatuaggi sulle palpebre gli tremano. Giù dalla strada scende un uomo magro
      in giubba verde, con una cassetta di pesi campione sotto il braccio e un
      garzone dietro che gli porta il registro. «Il pesatore della Gilda» dice
      Grusk. «Viene una volta all'anno, e Grusk se lo dimentica sempre.» Ti si
      abbassa all'orecchio, con un fiato da cantina. «La bilancia pende dalla
      parte dei ragazzi. Loro portano un sacco e Grusk gli paga un sacco e un
      quarto, e il quarto lo ritrova sui Raschiatori quando scaricano dall'altra
      parte. Se la trovano storta, a Grusk la licenza la tolgono.»

      {conoscenze-della-strada Media} Il pesatore scende sulla ghiaia senza
      guardarsi i piedi. All'Orlo così ci cammina soltanto chi ci è cresciuto.

      Il capo dei ragazzi dell'Orlo, un bambino di otto o nove anni con un
      ingranaggio precuriano appeso al collo, vi guarda da sopra un mucchio di
      lamiere. *Grusk ruba ai Raschiatori per pagare i bambini, e adesso vuole
      che lo copra io.* Il ragazzino si stringe l'ingranaggio nel pugno e
      aspetta, con i piedi nudi piantati sulla lamiera fredda.
    opzioni:
      - testo: "Trattenere il pesatore lungo la discesa"
        descrizione: "Un uomo che pesa le cose per la Gilda ha sempre qualcosa da ridire sulla Gilda. Basta farlo parlare mentre i ragazzi fanno sparire la bilancia."
        prova: { attributo: sociale, abilita: [ingannare, conoscenze-della-strada], difficolta: Media }
        successo:
          titolo: Il sigillo sbagliato
          testo: |
            Fermi il pesatore a metà discesa e gli chiedi dei suoi pesi
            campione, e lui ti spiega per filo e per segno quanto poco lo paga
            la Casa dei Nodi. Alle sue spalle i ragazzi fanno rotolare la
            bilancia di Grusk dietro la baracca e al suo posto montano quella
            del vecchio spazzino della baracca accanto, dritta come un fuso.

            {furtivita Facile} La spostano sul lato in ombra e la fanno rotolare
            sulle lamiere senza un rumore. Non è la prima volta che fanno
            sparire qualcosa sotto il naso di un adulto.

            Il pesatore la controlla, ci batte sopra il sigillo di piombo e se
            ne va soddisfatto. Il capo dei ragazzi ti mette in mano una scheggia
            incisa, senza dire niente.
          pe: { ingannare: 5 }
          imposta: { orlo.grusk: 1 }
          effetti: { reliquie.scheggia: 1 }
        fallimento:
          titolo: La multa
          testo: |
            Fermi il pesatore a metà discesa, ma è un uomo che non ama parlare,
            e ti risponde a monosillabi senza rallentare, con la cassetta dei
            pesi che gli batte sul fianco a ogni passo. Arriva alla tettoia
            mentre i ragazzi stanno ancora spingendo la bilancia, e li guarda
            finché la rimettono al suo posto. Prova i pesi campione due volte.
            Poi scrive una riga sul registro, chiude il giogo con un sigillo di
            piombo e lascia a Grusk una multa salata. Quella sera i ragazzi
            vengono pagati un sacco per un sacco.
          imposta: { orlo.grusk: 4 }

      - testo: "Raddrizzare la bilancia prima che arrivi"
        descrizione: "Il giogo pende per colpa di qualcosa. Se lo trovi in tempo, il pesatore trova una bilancia giusta."
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Media }
        successo:
          titolo: Il cartello
          testo: |
            Ti infili sotto la tettoia e trovi il trucco sotto il piatto di
            sinistra, un grosso dado precuriano saldato con il piombo. Lo
            stacchi con lo scalpello di Grusk, e il giogo torna in squadra
            proprio mentre il pesatore entra sotto la tettoia. Prova i pesi
            campione e batte il sigillo.

            {tecnologia Media} Il dado è più vecchio della bilancia di qualche
            secolo, e finire a truccare una tara all'Orlo non se lo meritava.

            Quando se ne va, Grusk dipinge un cartello da appendere alla trave,
            *un quarto in più a chi è più basso della cariola*, con una erre
            sola. I Raschiatori leggono il cartello e per una volta non
            protestano.
          pe: { tecnologia: 5 }
          imposta: { orlo.grusk: 2 }
          effetti: { rep.raschiatori: 0.5 }
        fallimento:
          titolo: Sotto la tettoia
          testo: |
            Ti infili sotto la tettoia e cerchi il difetto nel giogo e nei
            ganci, poi nelle catene dei piatti. Quando il pesatore arriva sei
            ancora lì sotto, a quattro zampe, con lo scalpello in mano, e la
            scena non ha bisogno di spiegazioni. Prova i pesi campione e scrive
            una riga sul registro. Poi lascia a Grusk una multa e un sigillo di
            piombo sul giogo, e a te un'occhiata lunga dalla testa ai piedi.

            {acrobazia Media fallita} Sotto quella tettoia c'è posto per un
            gatto, e tu ti ci sei infilato convinto di esserlo. Per uscire ti
            serve la mano del garzone.
          imposta: { orlo.grusk: 4 }

      - testo: "Dire la verità al pesatore"
        descrizione: "Il pesatore è nato in Città Bassa, si vede da come cammina sulla ghiaia. Forse un sacco e un quarto per i ragazzi lo capisce."
        prova: { attributo: sociale, abilita: [empatia, persuasione], difficolta: Media }
        successo:
          titolo: Fino a sera
          testo: |
            Gli racconti tutto, del quarto in più ai ragazzi e del quarto in
            meno ai Raschiatori. Il pesatore si chiama Fabrizio Lodde, e da
            ragazzo frugava fra i rottami due baracche più in là.

            {empatia Media} Mentre lo dice guarda il bambino con l'ingranaggio
            al collo, e ci rivede se stesso con qualche chilo in meno.

            Prova i pesi campione e scrive sul registro *pende a sinistra*. Poi
            richiude il libro con il dito in mezzo. «Torno stasera» dice a
            Grusk, «e voglio trovarla dritta. Il quarto ai ragazzi glielo paghi
            di tasca tua.» La sera la bilancia è dritta, e Grusk conta le monete
            del quarto bestemmiando a ogni moneta.
          pe: { persuasione: 5 }
          imposta: { orlo.grusk: 3 }
          effetti: { rep.gilda: 0.5 }
        fallimento:
          titolo: Tutto sul registro
          testo: |
            Gli racconti tutto, del quarto in più ai ragazzi e del quarto in
            meno ai Raschiatori, e il pesatore ti ascolta con attenzione,
            annuendo nei punti giusti. Poi riapre il registro e scrive tutto,
            compreso il tuo nome, con una grafia piccola e ordinata. Lascia a
            Grusk una multa da pagare subito e un sigillo di piombo sul giogo.
            Grusk paga, e per il resto della giornata, quando ti incrocia,
            guarda la carriola. La cosa ti brucia più della multa, che nemmeno
            era tua.
          imposta: { orlo.grusk: 4 }

      - testo: "Lasciare che il pesatore faccia il suo lavoro"
        descrizione: "I Raschiatori scaricano qui la fatica dei loro turni, e da anni Grusk ne trattiene un quarto. Il pesatore è pagato per accorgersene."
        esito:
          titolo: Un sacco e un quarto
          testo: |
            Ti fai da parte. Grusk ti guarda e ti promette che Grusk se lo
            ricorderà. Il pesatore trova la bilancia storta al primo peso,
            scrive una riga sul registro e chiude il giogo con un sigillo di
            piombo. Poi lascia a Grusk la multa. Al prossimo carico i
            Raschiatori avranno il peso giusto.

            {politica-ed-economia Facile} Adesso il conto torna per i
            Raschiatori e per la Gilda. L'unico a rimetterci è Grusk, che era
            anche l'unico a pagare i bambini.

            Quella sera ripassi dall'Orlo e vedi Grusk seduto sulla carriola
            rossa, che paga i ragazzi un sacco e un quarto con le monete del suo
            borsello, e intanto canta la sua strofa.
          pe: { politica-ed-economia: 5 }
          imposta: { orlo.grusk: 4 }
          effetti: { rep.gilda: 0.5, rep.raschiatori: 0.5 }

      - testo: "Parlare al pesatore da collega"
        descrizione: "Anche tu paghi ogni mese la commissione alla Gilda, e il pesatore l'hai visto in coda alla Casa dei Nodi con la sua cassetta. Fra licenze ci si capisce prima."
        quando: [origine.mercante-dei-ponti >= 1]
        prova: { attributo: sociale, abilita: [persuasione, politica-ed-economia], difficolta: Facile }
        successo:
          titolo: Fra licenze
          testo: |
            Gli vai incontro a metà discesa con la licenza in mano, e lui la
            riconosce prima della tua faccia. Si chiama Fabrizio Lodde, e da
            ragazzo frugava fra i rottami due baracche più in là. Gli racconti
            del quarto in più ai ragazzi nella lingua di pesi e di commissioni
            che alla Casa dei Nodi si parla in coda.

            {galateo Facile} Fra due che pagano la stessa commissione ci si dà
            del lei per un minuto e poi si smette, e lui smette dopo mezzo.

            Lui prova la bilancia, scrive *pende a sinistra* sul registro e lo
            richiude con il dito in mezzo. «Torno stasera e la voglio dritta, e
            il quarto ai ragazzi lo paghi di tasca tua» dice a Grusk, e riprende
            la discesa.
          pe: { persuasione: 5 }
          imposta: { orlo.grusk: 3 }
          effetti: { rep.gilda: 0.5 }
        fallimento:
          titolo: La licenza sul registro
          testo: |
            Gli vai incontro con la licenza in mano, e il pesatore la legge con
            attenzione, numero compreso, tenendola un poco lontana dagli occhi.
            Poi apre il registro e ce lo ricopia accanto alla bilancia di Grusk,
            perché un collega che garantisce per uno spazzino va annotato. Prova
            i pesi campione e trova il giogo storto. Lascia a Grusk una multa e
            un sigillo di piombo, e a te un cenno educato, da collega. Quella
            sera i ragazzi vengono pagati un sacco per un sacco.
          imposta: { orlo.grusk: 4 }

      - testo: "Trovare il peso sotto il piatto"
        descrizione: "A Ghoran le bilance del mercato pendevano sempre dalla parte di chi comprava, e sai dove si nasconde il trucco. Guardarla da vicino ti costa qualcosa."
        quando: [origine.fuggiasco-di-ghoran >= 1]
        esito:
          titolo: Il piatto di sinistra
          testo: |
            Ti infili sotto la tettoia senza cercare, perché a Ghoran il peso lo
            saldavano sempre nello stesso punto. Il dado precuriano è sotto il
            piatto di sinistra, fissato con il piombo, e lo stacchi con lo
            scalpello di Grusk mentre le mani ti tremano. Il giogo torna in
            squadra prima che il pesatore entri sotto la tettoia. Prova i pesi
            campione e batte il sigillo di piombo, soddisfatto.

            {resilienza Difficile fallita} Ti ripeti che è soltanto un dado su
            una bilancia. Lo stomaco la pensa diversamente, e ha più memoria di
            te.

            Grusk dipinge sulla trave un cartello con il quarto in più
            dichiarato, e per una volta i Raschiatori non protestano. Per tutto
            il giorno ti torna in mente il freddo del piatto sotto i piedi nudi.
          pe: { resilienza: 5 }
          imposta: { orlo.grusk: 2 }
          effetti: { rep.raschiatori: 0.5, tormento: 0.5 }

  # ------------------------------------------------------------ Segheria e Mulino Malgrani
  - id: un-turno-alla-segheria
    presso: segheria-e-mulino-malgrani
    immagine: ambientazione/segheria-di-qir-azel
    titolo: Un turno alla Segheria
    sommario: "Al cancello della Segheria si prendono braccia a giornata, e il caposquadra non chiede da dove vieni."
    luogo: Segheria sul canale del cristallo
    area: citta-bassa
    ripetibile: true
    requisiti: [pista.dama-argento != 2]
    testo: |
      La Segheria sta sul canale del cristallo, e il ronzio del cristallo
      romboidale ti entra nei denti già dal ponte. Nel cortile i trucioli
      arrivano alla caviglia, e sui davanzali delle case vicine la polvere
      chiara si posa ogni mattina sopra i gerani, che qualcuno si ostina lo
      stesso a innaffiare. Al cancello si prendono braccia a giornata per
      spingere i tronchi sulla rampa e per contare le assi, e accanto alla sega
      ad acqua serve sempre qualcuno che la guardi anche quando gira da sola.

      {resistenza Facile fallita} Le spalle si ricordano dell'ultima volta prima
      di te, e fanno sapere che preferirebbero contare le assi.

      Il caposquadra di turno ti guarda le mani e ti segna con il gesso su una
      lavagnetta, in fondo a una fila di nomi scritti male. Il tuo lo scrive
      peggio degli altri.
    opzioni:
      - testo: "Spingere i tronchi sulla rampa"
        descrizione: "I tronchi arrivano dal canale bagnati e pesanti, e la rampa è viscida di resina."
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Facile }
        successo:
          titolo: La rampa
          testo: |
            Spingi i tronchi su per la rampa con la spalla e con la leva, in
            coppia con un taglialegna che conta i colpi a voce alta e sbaglia
            sempre dopo il sette. A metà mattina hai la resina fino ai gomiti e
            le mani che non si aprono più del tutto. A fine turno il caposquadra
            ti cancella dalla lavagnetta con il pollice e ti paga il turno.
          pe: { atletica: 2 }
          effetti: { monete: 3 }
        fallimento:
          titolo: Il tronco che torna giù
          testo: |
            A metà rampa il tronco ti scivola sulla resina e torna giù
            rotolando, con un rumore di tuono basso. Fai appena in tempo a
            saltare di lato, e ti resta una caviglia che pulsa. Il caposquadra
            ti paga mezza giornata e ti dice di guardare dove metti i piedi,
            perché la rampa non perdona i distratti e il caposquadra nemmeno.
          effetti: { monete: 1, ferite: 0.5 }

      - testo: "Contare le assi per il caposquadra dei Malgrani"
        descrizione: "Il registro delle partite lo tiene un uomo in livrea che sa contare fino a cento e poi ricomincia."
        requisiti: [pista.pelle < 7]
        prova: { attributo: mentale, abilita: [politica-ed-economia, accademiche], difficolta: Media }
        successo:
          titolo: Due colonne
          testo: |
            Conti le assi pila per pila e le segni sul registro con la matita da
            carpentiere. Le cifre tornano, eppure accanto alla colonna delle
            assi vendute ce n'è un'altra, più corta, con scritto in cima
            *trattenute*. Dalla sega esce più legname di quanto la Segheria ne
            venda, e in città il prezzo sale.

            {politica-ed-economia Media} Qualcuno tiene il legname in magazzino
            apposta, e aspetta che il prezzo salga ancora.

            Il caposquadra ti paga in fretta e chiude il registro prima che tu
            possa ricopiare una riga.
          effetti: { monete: 3, informazioni.voce: 1 }
        fallimento:
          titolo: Una pila contata due volte
          testo: |
            Conti una pila due volte e la segni due volte, e il caposquadra se
            ne accorge alla prima occhiata al registro. Ti fa ricominciare da
            capo sotto il porticato, con la polvere che ti cola negli occhi e il
            ronzio del cristallo che ti tiene il tempo. A fine turno ti paga una
            miseria e ti chiede se a casa tua i numeri li contate con le dita
            dei piedi.
          effetti: { monete: 1 }

      - testo: "Contare le assi per la cooperativa"
        descrizione: "I due capisquadra della cooperativa tengono due registri, e non tornano mai uguali."
        requisiti: [pista.pelle >= 7]
        prova: { attributo: mentale, abilita: [politica-ed-economia, accademiche], difficolta: Media }
        successo:
          titolo: Un registro solo
          testo: |
            Ti siedi su un tronco con i due registri aperti sulle ginocchia e li
            confronti riga per riga, finché trovi la differenza. Una partita di
            travi per il Municipio l'hanno segnata tutti e due, ciascuno nel
            suo. Lo fai vedere ai capisquadra, che per un po' guardano da
            un'altra parte.

            {empatia Facile} Nessuno dei due ha rubato niente. Si vergognano di
            aver pensato che l'altro lo facesse.

            A fine turno ti pagano la giornata facendo a metà, e lasciano i
            registri uno sopra l'altro.
          effetti: { monete: 3, rep.castaldi: 0.5 }
        fallimento:
          titolo: Da che parte
          testo: |
            Confronti i due registri riga per riga e non trovi la differenza, e
            alla fine uno dei capisquadra ti chiede da che parte stai. Gli
            rispondi che stai dalla parte dei numeri, e lui ti fa notare che i
            numeri li hai sbagliati. L'altro annuisce, ed è la prima cosa su cui
            sono d'accordo da settimane. Ti pagano in due, e a stento, dopo una
            discussione su chi deve tirare fuori i soldi.
          effetti: { monete: 1 }

      - testo: "Badare alla sega ad acqua"
        descrizione: "La lama gira da sola, mossa dal canale. Qualcuno deve accorgersi quando un nodo del legno la fa cantare storto."
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Media }
        successo:
          titolo: La nota storta
          testo: |
            Passi il turno accanto alla sega, con la mano sulla leva che chiude
            la paratoia.

            {tecnologia Facile} Finché il legno è sano la lama tiene sempre la
            stessa nota, e tu tieni l'orecchio su quella.

            Verso mezzogiorno la nota della lama si abbassa appena, e tu tiri la
            leva prima che il nodo nel tronco la spezzi. Il caposquadra viene a
            controllare il nodo e la lama ancora intera, poi ti paga più di
            quanto avevate pattuito.
          pe: { tecnologia: 2 }
          effetti: { monete: 4 }
        fallimento:
          titolo: La scheggia
          testo: |
            Il rumore della sega è sempre uguale, e dopo un'ora non lo senti
            più. Quando la lama prende il nodo fa un salto, e una scheggia lunga
            quanto un dito ti si pianta nell'avambraccio. Per fortuna la
            paratoia si chiude da sola quando la lama salta. Il caposquadra ti
            paga in fretta e ti tira fuori la scheggia con le pinze e con la
            delicatezza di un maniscalco.
          effetti: { monete: 1, ferite: 0.5 }

      - testo: "Spazzare i trucioli"
        descrizione: "La portinaia con la scopa di saggina accetta volentieri una mano, e in cambio parla."
        esito:
          titolo: La scopa di saggina
          testo: |
            Spazzi i trucioli dal cortile verso il canale insieme alla
            portinaia. È una donna larga e stanca, e ha un'opinione su ogni
            taglialegna e su ogni tronco. Mentre spazzate ti racconta quale
            taglialegna beve troppo e quale non paga i debiti, e abbassa la voce
            soltanto per quelli che le stanno simpatici. A fine turno ti mette
            in mano qualche moneta del suo grembiule e ti dice di tornare.
          effetti: { monete: 1 }

      - testo: "Lavorare in coppia con un forestiero"
        descrizione: "Ogni settimana al cancello c'è qualcuno che dà un nome falso e trasale quando il caposquadra alza il gesso. Sai bene come ci si sente."
        quando: [origine.fuggiasco-di-ghoran >= 1]
        prova: { attributo: fisico, abilita: [resistenza, empatia], difficolta: Facile }
        successo:
          titolo: L'estremità pesante
          testo: |
            Ti metti in coppia con lui alla rampa e prendi l'estremità pesante
            del tronco senza dire niente. Lui spinge con le spalle curve e
            guarda il cancello ogni volta che si apre, e tu quel modo di
            guardare lo riconosci, perché è stato anche il tuo. A metà turno gli
            passi il pane che tenevi in tasca per dopo. Alla fine il caposquadra
            vi paga uno dopo l'altro, e il forestiero ti dice il suo nome vero,
            piano, come una moneta che si presta.
          pe: { empatia: 2 }
          effetti: { monete: 2 }
        fallimento:
          titolo: La voce del caposquadra
          testo: |
            Prendi l'estremità pesante del tronco, e alla prima voce del
            caposquadra il forestiero lascia la presa e si gira di scatto. Il
            peso ti arriva tutto sulla spalla, e il tronco torna giù per la
            rampa trascinandoti per un tratto. Il forestiero ti aiuta a
            rialzarti e ti chiede scusa nella lingua dei recinti, senza
            accorgersene.

            {resistenza Media fallita} La spalla ti fa sapere che per qualche
            giorno potrai alzarla al massimo fino al mento, e ha ragione lei.

            Il caposquadra vi paga mezza giornata a testa.
          effetti: { monete: 1, ferite: 0.5 }

  - id: la-segheria-dopo-i-malgrani
    presso: segheria-e-mulino-malgrani
    immagine: personaggi/marko-thessel
    titolo: La Segheria dopo i Malgrani
    sommario: "La Segheria adesso è della cooperativa dei taglialegna. Stasera votano se tenere Marko Thessel, e Marko ha già fatto il baule."
    luogo: Segheria di Qir-Azel, il cortile a fine turno
    area: citta-bassa
    requisiti: [segheria.cooperativa == 0, pista.pelle >= 7]
    testo: |
      Sul cancello della Segheria lo stemma dei Malgrani, l'albero trafitto
      dalla lama, l'hanno coperto con una mano di calce, e da sotto spunta
      ancora la punta della lama. Sopra qualcuno ha inchiodato una tavola con
      scritto a carbone *Cooperativa dei taglialegna*, e la *g* è venuta più
      grande delle altre lettere. Nel cortile i taglialegna stanno in due
      gruppi, ai due lati del mucchio di trucioli, ognuno con il suo
      caposquadra, e in mezzo passa soltanto la portinaia con la scopa di
      saggina.

      {politica-ed-economia Media fallita} Provi a capire chi dei due
      capisquadra conta di più, e ti viene in mente soltanto che i trucioli in
      mezzo sono di tutti e due.

      Sotto il porticato Marko Thessel aspetta in camicia di lino pulita, con un
      baule chiuso ai piedi e in mano una lettera con il sigillo di un grossista
      di Laresh. «Stasera votano se tenermi, a paga di operaio» dice, e ti
      sorride come si sorride a un cliente che non ha ancora deciso. «Leggo una
      venatura meglio di tutti loro messi insieme, e a Laresh trattano soltanto
      con me. Però in tutti questi anni i loro nomi non li ho mai imparati.»
      Picchietta la lettera contro il baule. «A Laresh mi offrono il doppio, e
      là nessuno pretende che mi ricordi come si chiama.»

      {empatia Media} Il baule è chiuso, ma le cinghie non le ha tirate. Uno che
      parte davvero le tira la sera prima.

      La portinaia si ferma accanto a te e si appoggia alla scopa. *Vuole
      restare, e non lo dirà mai per primo.* Il ronzio del cristallo ti sale su
      per le suole fino alle ginocchia.
    opzioni:
      - testo: "Portarlo giù nel cortile a chiedere i nomi"
        descrizione: "Un uomo che legge il legno può imparare venti nomi in un pomeriggio, se qualcuno lo accompagna giù dai tre gradini."
        prova: { attributo: sociale, abilita: [empatia, persuasione], difficolta: Media }
        successo:
          titolo: Venti nomi
          testo: |
            Scendi i tre gradini con lui e lo porti davanti al primo
            taglialegna. Marko gli chiede come si chiama, e il taglialegna
            glielo dice dopo un momento di sospetto. Lui lo ripete e lo scrive
            su un tronco con la matita da carpentiere, e così per tutti e venti,
            dalla prima squadra alla seconda. Al voto i due capisquadra alzano
            la mano insieme, e per la prima volta da settimane sono d'accordo su
            qualcosa. Quella sera Marko offre da bere a tutto il cortile, e il
            giro lo paga lui.

            {percezione Media} Il tronco con i venti nomi non finisce sulla
            rampa. Qualcuno lo trascina sotto il porticato e ci appoggia sopra
            una tazza.
          pe: { empatia: 5 }
          imposta: { segheria.cooperativa: 1 }
          effetti: { rep.castaldi: 0.5 }
        fallimento:
          titolo: Il terzo nome
          testo: |
            Scendi i tre gradini con lui. Marko sbaglia i primi due nomi, e al
            terzo un taglialegna sputa nei trucioli e se ne torna al suo gruppo.
            Lui risale sotto il porticato con il sorriso intatto e le orecchie
            rosse, che sono la sola parte di lui che non ha mai imparato a
            trattare. Il voto lo rimandano a un'altra sera, e il baule resta
            dov'è, ancora chiuso. La portinaia ricomincia a spazzare intorno ai
            tuoi piedi, e ti fa capire con la scopa che sei d'intralcio.

      - testo: "Mostrare ai taglialegna quanto vale a Laresh"
        descrizione: "Nei registri di Marko c'è scritto quanto pagano i grossisti di Laresh per il suo nome. La cooperativa quel conto non l'ha mai fatto."
        prova: { attributo: mentale, abilita: [politica-ed-economia, accademiche], difficolta: Media }
        successo:
          titolo: Un terzo in meno
          testo: |
            Ti fai dare i registri e passi un'ora nell'ufficio con i contratti
            di Laresh. Il conto è semplice da fare e brutto da sentire, perché
            senza Marko i grossisti pagherebbero il legname un terzo in meno,
            oppure andrebbero a comprarlo altrove. Lo spieghi ai due capisquadra
            seduti sullo stesso tronco, con le cifre scritte grandi su un'asse.

            {persuasione Facile} Li hai fatti sedere vicini apposta. È difficile
            litigare con uno che ti preme il ginocchio contro il tuo.

            Al voto lo tengono, e a paga di maestro. Marko rilegge le tue cifre
            e ti chiede, offeso, dove hai imparato a contare meglio di lui.
          pe: { politica-ed-economia: 5 }
          imposta: { segheria.cooperativa: 1 }
          effetti: { rep.castaldi: 0.5 }
        fallimento:
          titolo: Le cifre sull'asse
          testo: |
            Scrivi le cifre grandi su un'asse e le spieghi ai due capisquadra, e
            a metà spiegazione ti accorgi di aver sommato le partite di due anni
            diversi. Ti si scalda la faccia prima ancora di finire il pensiero.
            Uno dei capisquadra se ne accorge un attimo dopo di te. Da quel
            momento discutono dell'asse e non di Marko, e il voto slitta a
            un'altra sera. Marko, dal porticato, ha seguito tutto senza smettere
            di sorridere.

      - testo: "Aiutarlo a caricare il baule"
        descrizione: "A Laresh lo aspettano, e nessuno lo obbliga a restare dove non lo vogliono."
        esito:
          titolo: Il carro di Laresh
          testo: |
            Prendi una maniglia del baule e Marko l'altra, e lo portate fino al
            carro del grossista fermo sul ponte. Prima di salire, da sobrio,
            Marko ti racconta a voce bassa come i Malgrani trattenevano le
            partite di legname perché in città il prezzo salisse. Adesso che
            Ottone è finito, dice, non gli costa più niente.

            {ingannare Media fallita} Non riesci a capire se te lo dice per
            onestà o per partire senza debiti.

            Parte senza salutare il cortile. La portinaia guarda il carro
            allontanarsi e dice il suo nome per intero, Marko Thessel, come si
            legge una lapide.
          pe: { politica-ed-economia: 5 }
          imposta: { segheria.cooperativa: 2 }
          effetti: { informazioni.pettegolezzo: 1 }

      - testo: "Fargli dire la verità su Rennick"
        descrizione: "Quando cercavi Rennick Dole, Marko ti ha detto che era a Laresh, e sapeva di mentire. I taglialegna c'erano, e se lo ricordano."
        immagine: personaggi/rennick-dole
        requisiti: [pista.dama-argento >= 3]
        prova: { attributo: sociale, abilita: [intimidire, persuasione], difficolta: Media }
        successo:
          titolo: A Laresh, diceva
          testo: |
            Glielo chiedi davanti a tutto il cortile, a voce abbastanza alta
            perché arrivi anche al secondo gruppo. Per un po' Marko sorride, poi
            smette. Ammette che Rennick non è mai andato a Laresh e che a dirlo
            glielo aveva ordinato Ottone, con quattro uomini in livrea al
            cancello per ricordarglielo.

            {intimidire Facile} Venti taglialegna che ascoltano zitti fanno più
            paura di qualsiasi minaccia, e Marko li sente tutti sulla nuca.

            I taglialegna lo ascoltano fino in fondo. Poi votano di tenerlo a
            paga di operaio, a spingere tronchi sulla rampa per sei mesi. Marko
            piega in quattro la lettera di Laresh e se la mette in tasca, poi si
            toglie la camicia buona e la appende a un chiodo del porticato.
          pe: { intimidire: 5 }
          imposta: { segheria.cooperativa: 3 }
          effetti: { rep.castaldi: 0.5 }
        fallimento:
          titolo: Il sorriso
          testo: |
            Glielo chiedi davanti a tutto il cortile, e Marko ti risponde con il
            sorriso che riserva ai mercanti quando il prezzo non gli piace. Dice
            che Rennick a Laresh ci doveva andare davvero, e che poi le cose
            sono cambiate per tutti, e allarga le mani per mostrare quanto. Metà
            del cortile gli crede e l'altra metà no, e il voto lo rimandano. Tu
            resti con la sensazione di aver perso una trattativa che non sapevi
            di fare.

  # ------------------------------------------------------------ Acciaieria dei Tarvelin
  - id: l-acciaieria-senza-padrone
    presso: acciaieria-tarvelin
    immagine: ambientazione/acciaieria-di-qir-azel
    titolo: L'Acciaieria senza padrone
    sommario: "La ciminiera dei Tarvelin non fuma più. Ogni mattina gli operai del turno di giorno aspettano davanti al cancello, e il mazzo di chiavi di Ondrel ce l'hai tu."
    luogo: Acciaieria dei Tarvelin, davanti al cancello
    area: citta-bassa
    requisiti: [acciaieria.futuro == 0, pista.acciaio >= 8]
    testo: |
      Dalla ciminiera dei Tarvelin non esce fumo, e la Città Bassa, che se l'è
      vista fumare sopra i tetti per tutta la vita, ogni tanto alza gli occhi a
      controllarla. Sulla porta delle consegne la corona di foglie rosse per gli
      otto operai morti è diventata marrone, e qualcuno ci ha infilato un fiore
      di carta. Davanti al cancello, seduti sul muretto, ci sono quelli del
      turno di giorno, una ventina, con le maschere di cuoio appese alla
      cintura. Vengono tutte le mattine all'ora del cambio, perché non sanno
      dove altro andare.

      {resistenza Facile} Senza la fornace qui l'aria è fredda come in qualsiasi
      altra strada. Gli operai tengono le mani sotto le ascelle, abituati a un
      caldo che non c'è più.

      Il capoturno del giorno ti viene incontro con le maniche arrotolate e gli
      avambracci punteggiati di vecchie scottature. Si chiama Abele Torsi, e
      senza la maschera ha una faccia più giovane della voce. «Il mazzo di
      chiavi del vecchio ce l'hai tu, in Città Bassa lo sanno tutti» dice. «Alla
      Casa dei Nodi vogliono riaccendere con gente nuova e un amministratore, e
      la padrona non ne vuole sentir parlare. Intanto le famiglie degli otto non
      prendono un soldo.»

      Dal fondo della strada arriva Irsa Valbrun con il grembiule da bottega e
      una cartella della Gilda sotto il braccio. Si ferma davanti al cancello e
      guarda gli operai, poi te.

      {politica-ed-economia Media} Alla Casa dei Nodi hanno mandato la persona
      più onesta che hanno. Qualcuno là dentro spera ancora di convincerti con
      le buone.

      *Aspettano tutti che tiri fuori le chiavi.* Il mazzo ti tira giù la tasca
      della giubba, e la mano ci è già andata sopra.
    opzioni:
      - testo: "Dare le chiavi a Irsa per la Gilda"
        descrizione: "La Gilda ha i soldi per riaccendere la fornace e un amministratore già pronto. Alla Casa dei Nodi, Irsa è la voce più onesta che ci sia."
        immagine: personaggi/irsa-valbrun
        esito:
          titolo: La cartella della Gilda
          testo: |
            Tiri fuori il mazzo. Irsa prima ti guarda e poi lo prende, e prima
            di infilarselo in tasca apre la cartella sul muretto. Con la sua
            calligrafia da notaio scrive che il turno di giorno sarà riassunto
            per primo, e che dalla prima colata una parte andrà alle famiglie
            degli otto. Lo fa firmare ad Abele e poi lo firma lei. Abele firma
            piano, con la punta della lingua fra i denti.

            Una settimana dopo la ciminiera fuma di nuovo, e l'amministratore
            della Gilda gira per i reparti con i guanti bianchi, che a sera sono
            già grigi.
          pe: { politica-ed-economia: 5 }
          imposta: { acciaieria.futuro: 1 }
          effetti: { rep.gilda: 1 }

      - testo: "Proporre che la mandino avanti gli operai"
        descrizione: "I mulini e le segherie dei Malgrani adesso sono delle cooperative di Julia Castaldi. La fornace dei Tarvelin la sanno accendere soltanto questi venti."
        requisiti: [pista.pelle >= 7]
        prova: { attributo: mentale, abilita: [politica-ed-economia, accademiche], difficolta: Media }
        successo:
          titolo: Come i mulini
          testo: |
            Ti siedi sul muretto con Abele e fate i conti sul retro di una bolla
            di consegna. Da una parte mettete il carbone e i cristalli delle
            fondamenta, dall'altra il prezzo che Irsa paga per il lyssan.
            Tornano, se la paga si divide e una quota va alle famiglie degli
            otto.

            Porti il foglio al Grifone, e Liaren lo legge due volte. Firma la
            concessione agli operai per un affitto simbolico. «Purché il lyssan
            esca senza il nome di mio padre» dice, e ti rende il foglio con la
            firma ancora bagnata.

            {empatia Media} Sul nome di suo padre la voce le cala di un tono,
            poi torna dov'era.
          pe: { politica-ed-economia: 5 }
          imposta: { acciaieria.futuro: 2 }
          effetti: { rep.tarvelin: 0.5, rep.castaldi: 0.5 }
        fallimento:
          titolo: Chi prende di più
          testo: |
            Ti siedi sul muretto con Abele a fare i conti, e prima che il foglio
            sia pieno gli operai cominciano a discutere se debbano prendere di
            più quelli della colata o quelli dei carrelli. Abele prova a farli
            tacere e alza la voce anche lui, e alla fine grida più di tutti.
            Irsa aspetta un poco, guardandosi le scarpe, poi richiude la
            cartella e se ne va. Il foglio resta sul muretto, con le cifre a
            metà.

      - testo: "Proporre che la mandino avanti gli operai"
        descrizione: "La fornace dei Tarvelin la sanno accendere soltanto questi venti. Se si mettessero in società, l'amministratore non servirebbe a nessuno."
        requisiti: [pista.pelle < 7]
        prova: { attributo: mentale, abilita: [politica-ed-economia, accademiche], difficolta: Media }
        successo:
          titolo: In società
          testo: |
            Ti siedi sul muretto con Abele e fate i conti sul retro di una bolla
            di consegna. Da una parte mettete il carbone e i cristalli delle
            fondamenta, dall'altra il prezzo che Irsa paga per il lyssan.
            Tornano, se la paga si divide e una quota va alle famiglie degli
            otto. Abele rifà la somma sulle dita per due volte, e alla seconda
            sorride.

            Porti il foglio al Grifone, e Liaren lo legge due volte. Firma la
            concessione agli operai in società, per un affitto da niente.
            «Purché il lyssan esca senza il nome di mio padre» dice.
          pe: { politica-ed-economia: 5 }
          imposta: { acciaieria.futuro: 2 }
          effetti: { rep.tarvelin: 1 }
        fallimento:
          titolo: Chi prende di più
          testo: |
            Ti siedi sul muretto con Abele a fare i conti, e prima che il foglio
            sia pieno gli operai cominciano a discutere se debbano prendere di
            più quelli della colata o quelli dei carrelli. Abele prova a farli
            tacere e alza la voce anche lui, e alla fine grida più di tutti.
            Irsa aspetta un poco, guardandosi le scarpe, poi richiude la
            cartella e se ne va. Il foglio resta sul muretto, con le cifre a
            metà.

      - testo: "Portare Irsa da Liaren"
        descrizione: "Liaren non vuole un amministratore della Gilda. Una socia che il lyssan lo compra e lo lavora da anni, forse, la ascolterebbe."
        immagine: personaggi/liaren-tarvelin
        prova: { attributo: sociale, abilita: [empatia, persuasione], difficolta: Media }
        successo:
          titolo: Al tavolo d'angolo
          testo: |
            Al Grifone Liaren vi fa sedere al tavolo d'angolo, e Brunella resta
            in piedi accanto alla cucina con il mestolo in mano, pronta a usarlo
            per qualsiasi cosa. Liaren dice di no prima ancora che Irsa apra la
            cartella. Allora le parli delle famiglie degli otto e di Abele sul
            muretto con le mani in mano.

            {empatia Media} Il suo no è per la Gilda. Quando nomini gli otto
            guarda il tavolo invece di guardare te.

            Alla fine si accordano. L'Acciaieria resta dei Tarvelin, la manda
            avanti Irsa con Abele alla fornace, e la parte di Liaren va alle
            famiglie degli otto, tutta. Irsa ti chiede le chiavi, e Liaren fa
            segno di sì.
          pe: { empatia: 5 }
          imposta: { acciaieria.futuro: 3 }
          effetti: { rep.tarvelin: 1, rep.gilda: 0.5 }
        fallimento:
          titolo: Il mestolo
          testo: |
            Al Grifone Liaren vi fa sedere al tavolo d'angolo, e alla parola
            Gilda si alza in piedi così in fretta che la sedia resta a
            dondolare. Irsa prova a spiegarsi e Liaren le indica la porta.
            Brunella si avvicina con il mestolo per accompagnarvi fuori, e Irsa
            esce per prima con la cartella sotto il braccio, a testa alta. Sulla
            strada ti dice che ci riproverà quando la padrona avrà dormito.

      - testo: "Tenerti le chiavi ancora un po'"
        descrizione: "Chi manderà avanti l'Acciaieria lo decide la città, e la città oggi non ha fretta. Il mazzo può restare in tasca tua."
        costo: 0
        esito:
          titolo: Il muretto
          testo: |
            Dici ad Abele che le chiavi restano con te finché qualcuno non avrà
            un'idea migliore. Abele annuisce e torna a sedersi sul muretto con
            gli altri. Irsa ti guarda a lungo, poi ti saluta con un cenno del
            mento e riprende la strada della Casa dei Nodi.

            {resilienza Media fallita} Ti dici che è una decisione prudente. Le
            chiavi in tasca la pensano diversamente, e a ogni passo te lo
            ricordano.

            Quando giri l'angolo gli operai sono ancora lì sul muretto, e
            qualcuno ha tirato fuori un pezzo di pane da dividere. Sopra di loro
            la ciminiera è ancora spenta.
