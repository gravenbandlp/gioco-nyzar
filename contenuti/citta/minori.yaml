# La città viva, luogo 14: i luoghi minori della Città Bassa (area citta-bassa). Niente reputazione
# nuova: una storia per luogo, chiusa dal suo flag, e il turno alla Segheria, l'unica attività che mancava.
# - Scuderie della Zanna Rotta: `dolovan-e-gli-orchi` (pista.tribu >= 1). scuderie.stroud: 1 l'orco resta
#   a lavorare da Stroud, 2 va all'Orlo da Grusk, 3 lo mandi via. Con cuccioli == 1 c'è una via in più.
#   L'attività è `strigliare-alla-zanna-rotta` (allenamento.yaml).
# - Orlo dei Rottami: `la-bilancia-di-grusk`. orlo.grusk: 1 la bilancia storta sfugge al pesatore,
#   2 raddrizzata e il quarto in più dichiarato sul cartello, 3 il pesatore chiude un occhio fino a sera,
#   4 multa e sigillo. Le attività sono `orlo-rottami` e `i-ragazzi-dell-orlo`.
# - Segheria e Mulino Malgrani: `un-turno-alla-segheria` (ripetibile, varianti prima e dopo pista.pelle 7)
#   e `la-segheria-dopo-i-malgrani` (pista.pelle >= 7). segheria.cooperativa: 1 Marko resta con la
#   cooperativa, 2 parte per Laresh, 3 resta dopo aver confessato la bugia su Rennick.
# - Acciaieria dei Tarvelin: `l-acciaieria-senza-padrone` (pista.acciaio >= 8). acciaieria.futuro: 1 la
#   Gilda, 2 gli operai in società, 3 Liaren con Irsa Valbrun come socia. Il protagonista ha ancora il
#   mazzo di chiavi di Ondrel (acciaio-segrete.yaml). L'attività è `turno-acciaieria` (citta-bassa.yaml).
# Nomi nuovi: Kharb (orco del Gradone Rosso), Tonio (il garzone di Stroud morto nella razzia), Fabrizio
# Lodde (pesatore della Gilda), Abele Torsi (capoturno del turno di giorno all'Acciaieria).
storylet:
  # ------------------------------------------------------------ Scuderie della Zanna Rotta
  - id: dolovan-e-gli-orchi
    presso: scuderie-della-zanna-rotta
    immagine: personaggi/dolovan-stroud
    titolo: L'orco al cancello
    sommario: "Stanotte un cavallo di Dolovan Stroud ha saltato la staccionata, e stamattina un orco lo riporta al cancello."
    luogo: Scuderie della Zanna Rotta, all'alba
    area: citta-bassa
    requisiti: [scuderie.stroud == 0, pista.tribu >= 1]
    testo: |
      All'alba trovi Dolovan Stroud piantato in mezzo al cortile delle Scuderie
      della Zanna Rotta con la forca del fieno in mano. Al cancello un orco
      giovane e magro, con piume intrecciate nei capelli e un sacco di tela fra
      i piedi, tiene per la cavezza il grigio vecchio del recinto.

      «Stanotte il grigio ha saltato la staccionata, e lui me l'ha riportato dal
      fosso» dice Stroud senza voltarsi. «Dice che sa ferrare e cerca lavoro. Io
      gli ho detto che so scuoiare.» Sputa nella paglia. «Il mio garzone è morto
      la notte delle Foglie Alate, e mi serve qualcuno. Adesso lo sa pure lui.»

      {armi-da-mischia Facile} Stroud tiene la forca con le punte verso terra, e
      chi vuole davvero infilzare qualcuno le punte le alza.

      L'orco non abbassa gli occhi, e il grigio gli appoggia il muso sulla
      spalla.
    opzioni:
      - testo: "Parlare con l'orco"
        descrizione: "Ha fatto mezza notte di strada dietro un cavallo non suo, e nessuno gli ha ancora chiesto il nome."
        immagine: bestiario/orco
        prova: { attributo: sociale, abilita: [empatia, persuasione], difficolta: Media }
        successo:
          titolo: Le capre del Gradone
          testo: |
            Ti accucci accanto a lui. Si chiama Kharb, parla un comune storto e al
            Gradone Rosso badava alle capre, finché la notte della razzia l'hanno
            lasciato indietro, e quando i suoi sono andati a chiedere asilo a
            Balthog non li ha seguiti. Stroud pianta la forca nella paglia e
            indica il box in fondo. «A giornata, pagato in pane come tutti, e i
            clienti non ti devono vedere» dice.
          pe: { empatia: 5 }
          imposta: { scuderie.stroud: 1 }
          effetti: { informazioni.voce: 1 }
        fallimento:
          titolo: Troppe domande
          testo: |
            Gli fai troppe domande in fila, sulla strada che ha fatto e su chi lo
            manda, e l'orco si chiude un poco di più a ognuna finché smette di
            rispondere. Stroud gli dice di lasciare la cavezza sul palo e di
            tornare domani, se gli resta la voglia. L'orco obbedisce senza fretta
            e si siede dall'altra parte della strada, sul suo sacco, con la
            schiena al muro.
          effetti: { scandalo: 0.5 }

      - testo: "Guardare la zampa del grigio"
        descrizione: "Il grigio ha un taglio fresco sullo stinco, e qualcuno ci ha già messo sopra qualcosa."
        immagine: ambientazione/scuderie-della-zanna-rotta
        prova: { attributo: mentale, abilita: [natura, percezione], difficolta: Media }
        successo:
          titolo: L'erba del fosso
          testo: |
            Sullo stinco del grigio il taglio è coperto da un impiastro di foglie
            masticate, e riconosci l'odore amaro della piantaggine, la stessa che
            Stroud fa seccare alla trave della selleria. Stroud annusa l'impiastro
            a lungo. «Chi te l'ha insegnata?» chiede all'orco senza guardarlo.
            «Mia madre» risponde l'orco, e Stroud gli butta una striglia, che lui
            prende al volo. «Una settimana, poi vediamo.»
          pe: { natura: 5 }
          imposta: { scuderie.stroud: 1 }
        fallimento:
          titolo: La zampa sbagliata
          testo: |
            Ti chini sul grigio e gli alzi la zampa sbagliata, quella sana, che
            studi a lungo con grande serietà finché il cavallo si innervosisce e
            tira la cavezza. L'orco lo calma con un suono basso della gola. Stroud
            dice all'orco di lasciare il cavallo sul palo e di tornare domani, e a
            te di tornare quando avrai imparato a contare le zampe.
          effetti: { scandalo: 0.5 }

      - testo: "Mandarlo all'Orlo da Grusk"
        descrizione: "All'Orlo dei Rottami lo spazzino è mezzo orco, e nessuno chiede da dove vieni."
        immagine: personaggi/grusk
        esito:
          titolo: La carriola rossa
          testo: |
            Accompagni l'orco giù fino all'Orlo dei Rottami. Seduto sulla carriola
            rossa, Grusk osserva le piume a lungo con la testa inclinata. «Grusk
            una volta aveva i capelli» dice, e gli mette in mano un sacco di
            rottami da dividere, il ferro da una parte e il rame dall'altra.
            Quando ripassi dalle Scuderie, su un palo accanto al cancello c'è
            mezza pagnotta, e Stroud non ti dice per chi.
          pe: { conoscenze-della-strada: 5 }
          imposta: { scuderie.stroud: 2 }

      - testo: "Dare ragione a Stroud"
        descrizione: "Stroud ha perso il suo garzone nella razzia. Tocca a lui decidere chi dorme nella sua paglia."
        esito:
          titolo: Tonio
          testo: |
            Dici all'orco che qui non c'è lavoro, e lui consegna la cavezza e si
            incammina verso i boschi con il sacco in spalla. Nella selleria Stroud
            ti versa un dito di grappa e racconta del garzone, Tonio, che aveva
            quattordici anni e la sera del Festival era salito in piazza a vedere
            le lanterne. Mentre parla gira il bicchiere fra le dita, e la grappa
            non la beve.
          pe: { resilienza: 5 }
          imposta: { scuderie.stroud: 3 }
          effetti: { rep.caserma: 0.5 }

      - testo: "Raccontargli dei cuccioli di Capomozzo"
        descrizione: "Sotto Capomozzo hai aperto tre gabbie, e tre cuccioli d'orco sono corsi verso il mare. Stroud non lo sa."
        requisiti: [cuccioli == 1]
        esito:
          titolo: Fra dieci anni
          testo: |
            Gli racconti delle gabbie sotto Capomozzo e della ciotola sola che i
            cuccioli si contendevano in tre. Stroud ascolta appoggiato alla forca,
            e a un certo punto smette di masticare il filo di paglia. «Allora fra
            dieci anni quei tre li caccerò io» dice, e ride senza allegria. Poi
            chiede all'orco se anche lui ha cominciato in una gabbia, e quando
            l'orco annuisce gli indica il box in fondo.
          pe: { empatia: 5 }
          imposta: { scuderie.stroud: 1 }

      - testo: "Guardare le orecchie del grigio"
        descrizione: "Il Circolo ti ha insegnato a guardare le orecchie di un cavallo, e il grigio le tiene sull'orco."
        quando: [origine.figlio-del-circolo >= 1]
        prova: { attributo: sociale, abilita: addestrare-animali, difficolta: Facile }
        successo:
          titolo: Le orecchie del grigio
          testo: |
            Quando l'orco si sposta di un passo le orecchie del grigio lo seguono,
            e quando Stroud alza la forca il cavallo mette il muso fra loro due.
            Lo fai notare a Stroud a voce bassa, come al Circolo si parla dei
            cavalli degli altri, e lui ci pensa un pezzo, poi indica all'orco il
            box in fondo. «Una settimana, poi vediamo» dice, e se ne va verso la
            selleria.
          pe: { addestrare-animali: 5 }
          imposta: { scuderie.stroud: 1 }
        fallimento:
          titolo: Troppo in fretta
          testo: |
            Ti avvicini al grigio troppo in fretta, per far bella figura davanti a
            Stroud, e il cavallo scarta e tira la cavezza. L'orco lo calma con un
            suono basso della gola che nel Bosco non ti hanno mai insegnato.
            Stroud ci vede quello che vuole vederci, e dice all'orco di tornare
            domani, se gli resta la voglia.

      - testo: "Parlargli nell'orchesco dei recinti"
        descrizione: "A Ghoran hai imparato l'orchesco dei sorveglianti. Detto da te, per una volta, può servire a chiedere un nome."
        quando: [origine.fuggiasco-di-ghoran >= 1]
        prova: { attributo: sociale, abilita: [empatia, intimidire], difficolta: Media }
        successo:
          titolo: Kharb
          testo: |
            Gli parli nell'orchesco dei recinti, e per la prima volta lo usi per
            chiedere qualcosa. L'orco risponde nella stessa lingua che si chiama
            Kharb, e che la notte della razzia l'hanno lasciato indietro con le
            capre. Stroud pianta la forca nella paglia e indica il box in fondo.
            «A giornata, pagato in pane come tutti, e i clienti non ti devono
            vedere» dice, e Kharb capisce anche senza traduzione.
          pe: { empatia: 5 }
          imposta: { scuderie.stroud: 1 }
          effetti: { informazioni.voce: 1 }
        fallimento:
          titolo: La voce dei sorveglianti
          testo: |
            Ti esce la voce che usavano i sorveglianti, quella corta che arrivava
            prima delle punizioni, e l'orco abbassa gli occhi e smette di
            rispondere. A te viene voglia di sciacquarti la bocca. Stroud guarda
            la scena senza capirla e dice all'orco di tornare domani, e l'orco si
            siede dall'altra parte della strada con la schiena al muro.
          effetti: { tormento: 0.5 }

  # ------------------------------------------------------------ Orlo dei Rottami
  - id: la-bilancia-di-grusk
    presso: orlo-dei-rottami
    immagine: personaggi/grusk
    titolo: La bilancia di Grusk
    sommario: "Il pesatore della Gilda scende all'Orlo a controllare le bilance, e quella di Grusk pende."
    luogo: Orlo dei Rottami, la baracca di Grusk
    area: citta-bassa
    requisiti: [orlo.grusk == 0]
    testo: |
      La baracca di Grusk sta in cima alla discesa dell'Orlo, e sotto la tettoia
      c'è la bilancia, alta quanto un uomo, con i piatti ricavati da due scudi
      ammaccati, che anche da ferma pende un poco a sinistra.

      Giù dalla strada scende un uomo magro in giubba verde con una cassetta di
      pesi campione. «Il pesatore della Gilda» dice Grusk, abbassandosi al tuo
      orecchio. «La bilancia pende dalla parte dei ragazzi. Loro portano un
      sacco e Grusk gli paga un sacco e un quarto, e il quarto lo ritrova sui
      Raschiatori. Se la trovano storta, a Grusk la licenza la tolgono.»

      {origine apprendista-raschiatore} Sulle piattaforme si bestemmia contro
      l'Orlo ogni volta che un carico pesa meno in bilancia che sulla schiena.

      Da sopra un mucchio di lamiere vi guarda il capo dei ragazzi dell'Orlo, un
      bambino di otto o nove anni con un ingranaggio precuriano appeso al collo.
    opzioni:
      - testo: "Trattenere il pesatore lungo la discesa"
        descrizione: "Un pesatore della Gilda ha sempre qualcosa da ridire sulla Gilda, e intanto i ragazzi spostano la bilancia."
        prova: { attributo: sociale, abilita: [ingannare, conoscenze-della-strada], difficolta: Media }
        successo:
          titolo: Il sigillo sbagliato
          testo: |
            Fermi il pesatore a metà discesa e gli chiedi dei suoi pesi campione,
            e lui ti spiega quanto poco lo paga la Casa dei Nodi. Alle sue spalle
            i ragazzi fanno sparire la bilancia di Grusk e montano al suo posto
            quella dello spazzino accanto, dritta come un fuso. Il pesatore ci
            batte sopra il sigillo, e il capo dei ragazzi ti mette in mano una
            scheggia incisa.
          pe: { ingannare: 5 }
          imposta: { orlo.grusk: 1 }
          effetti: { reliquie.scheggia: 1 }
        fallimento:
          titolo: La multa
          testo: |
            Il pesatore non ama parlare e ti risponde a monosillabi senza
            rallentare. Arriva alla tettoia mentre i ragazzi stanno ancora
            spingendo la bilancia, e li guarda finché la rimettono al suo posto.
            Prova i pesi campione due volte, chiude il giogo con un sigillo di
            piombo e lascia a Grusk una multa salata. Quella sera i ragazzi
            vengono pagati un sacco per un sacco.
          imposta: { orlo.grusk: 4 }
          effetti: { sospetto: 0.5 }

      - testo: "Raddrizzare la bilancia prima che arrivi"
        descrizione: "Il giogo pende per colpa di qualcosa. Se lo trovi in tempo, il pesatore trova una bilancia giusta."
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Media }
        successo:
          titolo: Il cartello
          testo: |
            Sotto il piatto di sinistra trovi un grosso dado precuriano saldato
            con il piombo, e lo stacchi con lo scalpello di Grusk proprio mentre
            il pesatore entra sotto la tettoia a battere il sigillo. Quando se ne
            va, Grusk appende alla trave un cartello, *un quarto in più a chi è
            più basso della cariola*, con una erre sola, e per una volta i
            Raschiatori non protestano.
          pe: { tecnologia: 5 }
          imposta: { orlo.grusk: 2 }
          effetti: { rep.raschiatori: 0.5 }
        fallimento:
          titolo: Sotto la tettoia
          testo: |
            Cerchi il difetto nel giogo e nelle catene dei piatti, e quando il
            pesatore arriva sei ancora lì sotto a quattro zampe con lo scalpello
            in mano, una scena che non ha bisogno di spiegazioni. Lui prova i pesi
            campione e lascia a Grusk una multa e un sigillo di piombo sul giogo,
            e a te un'occhiata lunga dalla testa ai piedi.
          imposta: { orlo.grusk: 4 }
          effetti: { sospetto: 0.5 }

      - testo: "Dire la verità al pesatore"
        descrizione: "Il pesatore cammina sulla ghiaia come uno nato in Città Bassa, e forse il quarto ai ragazzi lo capisce."
        prova: { attributo: sociale, abilita: [empatia, persuasione], difficolta: Media }
        successo:
          titolo: Fino a sera
          testo: |
            Gli racconti del quarto in più ai ragazzi e del quarto in meno ai
            Raschiatori. Il pesatore, Fabrizio Lodde, da ragazzo frugava fra i
            rottami due baracche più in là. Scrive sul registro *pende a sinistra*
            e lo richiude con il dito in mezzo. «Torno stasera e la voglio dritta,
            e il quarto ai ragazzi lo paghi di tasca tua» dice a Grusk, che la
            sera paga bestemmiando.
          pe: { persuasione: 5 }
          imposta: { orlo.grusk: 3 }
          effetti: { rep.gilda: 0.5 }
        fallimento:
          titolo: Tutto sul registro
          testo: |
            Il pesatore ti ascolta annuendo nei punti giusti, poi riapre il
            registro e scrive tutto, compreso il tuo nome, con una grafia piccola
            e ordinata. Lascia a Grusk una multa da pagare subito e un sigillo di
            piombo sul giogo. Per il resto della giornata Grusk guarda la carriola
            quando ti incrocia, e la cosa ti brucia più della multa, che nemmeno
            era tua.
          imposta: { orlo.grusk: 4 }
          effetti: { sospetto: 0.5 }

      - testo: "Lasciare che il pesatore faccia il suo lavoro"
        descrizione: "Da anni Grusk trattiene un quarto della fatica dei Raschiatori, e il pesatore è pagato per accorgersene."
        esito:
          titolo: Un sacco e un quarto
          testo: |
            Ti fai da parte, e Grusk ti promette che Grusk se lo ricorderà. Il
            pesatore trova la bilancia storta al primo peso, chiude il giogo con
            un sigillo di piombo e lascia a Grusk la multa. Quella sera, all'Orlo,
            Grusk paga i ragazzi un sacco e un quarto con le monete del suo
            borsello, seduto sulla carriola rossa a cantare la sua strofa.
          pe: { politica-ed-economia: 5 }
          imposta: { orlo.grusk: 4 }
          effetti: { rep.gilda: 0.5, rep.raschiatori: 0.5 }

      - testo: "Parlare al pesatore da collega"
        descrizione: "Anche tu paghi la commissione alla Gilda, e il pesatore l'hai visto in coda alla Casa dei Nodi."
        quando: [origine.mercante-dei-ponti >= 1]
        prova: { attributo: sociale, abilita: [persuasione, politica-ed-economia], difficolta: Facile }
        successo:
          titolo: Fra licenze
          testo: |
            Gli vai incontro con la licenza in mano, e lui la riconosce prima
            della tua faccia. Si chiama Fabrizio Lodde, e gli racconti del quarto
            ai ragazzi nella lingua di pesi e commissioni che alla Casa dei Nodi
            si parla in coda. Lui scrive *pende a sinistra* sul registro. «Torno
            stasera e la voglio dritta, e il quarto ai ragazzi lo paghi di tasca
            tua» dice a Grusk.
          pe: { persuasione: 5 }
          imposta: { orlo.grusk: 3 }
          effetti: { rep.gilda: 0.5 }
        fallimento:
          titolo: La licenza sul registro
          testo: |
            Il pesatore legge con attenzione la licenza e il suo numero, e lo
            ricopia sul registro accanto alla bilancia di Grusk, perché un collega
            che garantisce per uno spazzino va annotato. Prova i pesi campione e
            trova il giogo storto. Lascia a Grusk una multa e un sigillo di
            piombo, e a te un cenno educato, da collega.
          imposta: { orlo.grusk: 4 }
          effetti: { sospetto: 0.5 }

      - testo: "Trovare il peso sotto il piatto"
        descrizione: "A Ghoran le bilance del mercato pendevano sempre, e sai dove si nasconde il trucco."
        quando: [origine.fuggiasco-di-ghoran >= 1]
        esito:
          titolo: Il piatto di sinistra
          testo: |
            Sai dove cercare, perché a Ghoran il peso lo saldavano sempre nello
            stesso punto. Il dado precuriano è sotto il piatto di sinistra, e le
            mani ti tremano mentre lo stacchi con lo scalpello di Grusk, prima che
            arrivi il pesatore. Grusk dipinge sulla trave il quarto in più
            dichiarato, e per tutto il giorno ti torna in mente il freddo del
            piatto sotto i piedi nudi.
          pe: { resilienza: 5 }
          imposta: { orlo.grusk: 2 }
          effetti: { rep.raschiatori: 0.5, tormento: 1 }

  # ------------------------------------------------------------ Segheria e Mulino Malgrani
  - id: un-turno-alla-segheria
    presso: segheria-e-mulino-malgrani
    immagine: ambientazione/segheria-di-qir-azel
    titolo: Un turno alla Segheria
    sommario: "Al cancello della Segheria si prendono braccia a giornata, e il caposquadra non chiede da dove vieni."
    luogo: Segheria sul canale del cristallo
    area: citta-bassa
    ripetibile: true
    requisiti: [pista.dama-argento != 2]
    testo: |
      La Segheria sta sul canale del cristallo, e il ronzio del cristallo ti
      entra nei denti già dal ponte. La polvere chiara si posa sui gerani delle
      case vicine, che qualcuno si ostina a innaffiare. Al cancello si prendono
      braccia a giornata per i tronchi della rampa e per contare le assi, e
      accanto alla sega ad acqua serve sempre qualcuno che la guardi.

      {resistenza Facile fallita} Le spalle si ricordano dell'ultima volta prima
      di te, e preferirebbero contare le assi.

      Il caposquadra ti guarda le mani e scrive il tuo nome col gesso in fondo
      alla lavagnetta.
    opzioni:
      - testo: "Spingere i tronchi sulla rampa"
        descrizione: "I tronchi arrivano dal canale bagnati e pesanti, e la rampa è viscida di resina."
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Facile }
        successo:
          titolo: La rampa
          testo: |
            Spingi i tronchi su per la rampa con la spalla e con la leva, in
            coppia con un taglialegna che conta i colpi a voce alta e sbaglia
            sempre dopo il sette. A fine turno hai la resina fino ai gomiti, e il
            caposquadra ti cancella dalla lavagnetta con il pollice e ti paga.
          pe: { atletica: 2 }
          effetti: { monete: 3 }
        fallimento:
          titolo: Il tronco che torna giù
          testo: |
            A metà rampa il tronco ti scivola sulla resina e torna giù rotolando,
            e fai appena in tempo a saltare di lato. Con una caviglia che pulsa ti
            prendi mezza giornata di paga e il consiglio di guardare dove metti i
            piedi.
          effetti: { monete: 1, ferite: 0.5 }

      - testo: "Contare le assi per il caposquadra dei Malgrani"
        descrizione: "Il registro delle partite lo tiene un uomo in livrea che sa contare fino a cento e poi ricomincia."
        requisiti: [pista.pelle < 7]
        prova: { attributo: mentale, abilita: [politica-ed-economia, accademiche], difficolta: Media }
        successo:
          titolo: Due colonne
          testo: |
            Conti le assi pila per pila e le segni sul registro con la matita da
            carpentiere. Le cifre tornano, eppure accanto alla colonna delle assi
            vendute ce n'è un'altra, più corta, intitolata *trattenute*, e intanto
            in città il prezzo del legname sale. Il caposquadra ti paga in fretta
            e chiude il registro prima che tu possa ricopiare una riga.
          effetti: { monete: 3, informazioni.voce: 1 }
        fallimento:
          titolo: Una pila contata due volte
          testo: |
            Conti una pila due volte e la segni due volte, e il caposquadra se ne
            accorge alla prima occhiata. Ti fa ricominciare da capo sotto il
            porticato, e a fine turno ti paga una miseria e ti chiede se a casa
            tua i numeri li contate con le dita dei piedi.
          effetti: { monete: 1 }

      - testo: "Contare le assi per la cooperativa"
        descrizione: "I due capisquadra della cooperativa tengono due registri, e non tornano mai uguali."
        requisiti: [pista.pelle >= 7]
        prova: { attributo: mentale, abilita: [politica-ed-economia, accademiche], difficolta: Media }
        successo:
          titolo: Un registro solo
          testo: |
            Ti siedi su un tronco con i due registri sulle ginocchia e li
            confronti riga per riga, finché trovi la differenza, una partita di
            travi per il Municipio che hanno segnato tutti e due, ciascuno nel
            suo. I capisquadra per un po' guardano da un'altra parte,
            vergognandosi di aver sospettato l'uno dell'altro. Ti pagano la
            giornata facendo a metà, e lasciano i registri uno sopra l'altro.
          effetti: { monete: 3, rep.castaldi: 0.5 }
        fallimento:
          titolo: Da che parte
          testo: |
            Non trovi la differenza, e alla fine uno dei capisquadra ti chiede da
            che parte stai. Gli rispondi che stai dalla parte dei numeri, e lui ti
            fa notare che i numeri li hai sbagliati. L'altro annuisce, ed è la
            prima cosa su cui sono d'accordo da settimane. Ti pagano a stento,
            dopo una discussione su chi deve tirare fuori i soldi.
          effetti: { monete: 1 }

      - testo: "Badare alla sega ad acqua"
        descrizione: "La lama gira da sola con l'acqua del canale, e bisogna sentire quando un nodo la fa cantare storto."
        prova: { attributo: mentale, abilita: [tecnologia, percezione], difficolta: Media }
        successo:
          titolo: La nota storta
          testo: |
            Passi il turno accanto alla sega con la mano sulla leva della paratoia
            e l'orecchio sulla nota della lama, che finché il legno è sano resta
            sempre la stessa. Verso mezzogiorno la nota si abbassa appena, e tiri
            la leva prima che il nodo nel tronco spezzi la lama. Il caposquadra ti
            paga più di quanto avevate pattuito.
          pe: { tecnologia: 2 }
          effetti: { monete: 4 }
        fallimento:
          titolo: La scheggia
          testo: |
            Il rumore della sega è sempre uguale, e dopo un'ora non lo senti più.
            Quando la lama prende il nodo fa un salto, la paratoia si chiude da
            sola, e una scheggia lunga quanto un dito ti si pianta
            nell'avambraccio. Il caposquadra te la tira fuori con le pinze e con
            la delicatezza di un maniscalco.
          effetti: { monete: 1, ferite: 0.5 }

      - testo: "Spazzare i trucioli"
        descrizione: "La portinaia con la scopa di saggina accetta volentieri una mano, e in cambio parla."
        esito:
          titolo: La scopa di saggina
          testo: |
            Spazzi i trucioli verso il canale con la portinaia, una donna stanca
            che ha un'opinione su ogni taglialegna. Ti racconta chi beve troppo e
            chi non paga i debiti, e abbassa la voce soltanto per quelli che le
            stanno simpatici. A fine turno ti mette in mano qualche moneta del suo
            grembiule.
          effetti: { monete: 1 }

      - testo: "Lavorare in coppia con un forestiero"
        descrizione: "Al cancello c'è sempre qualcuno che dà un nome falso e trasale quando il caposquadra alza il gesso."
        quando: [origine.fuggiasco-di-ghoran >= 1]
        prova: { attributo: fisico, abilita: [resistenza, empatia], difficolta: Facile }
        successo:
          titolo: L'estremità pesante
          testo: |
            Ti metti in coppia con lui alla rampa e prendi l'estremità pesante del
            tronco senza dire niente. Lui guarda il cancello ogni volta che si
            apre, e quel modo di guardare lo riconosci, perché è stato anche il
            tuo. A metà turno gli passi il pane che tenevi in tasca per dopo, e
            alla fine il forestiero ti dice il suo nome vero, piano, come una
            moneta che si presta.
          pe: { empatia: 2 }
          effetti: { monete: 2 }
        fallimento:
          titolo: La voce del caposquadra
          testo: |
            Alla prima voce del caposquadra il forestiero lascia la presa e si
            gira di scatto, e il tronco torna giù per la rampa trascinandoti per
            un tratto. Lui ti aiuta a rialzarti e ti chiede scusa nella lingua dei
            recinti, senza accorgersene. Il caposquadra vi paga mezza giornata a
            testa, e la spalla per qualche giorno non sale oltre il mento.
          effetti: { monete: 1, ferite: 0.5 }

  - id: la-segheria-dopo-i-malgrani
    presso: segheria-e-mulino-malgrani
    immagine: personaggi/marko-thessel
    titolo: La Segheria dopo i Malgrani
    sommario: "La Segheria adesso è della cooperativa, e stasera votano se tenere Marko Thessel, che ha già fatto il baule."
    luogo: Segheria di Qir-Azel, il cortile a fine turno
    area: citta-bassa
    requisiti: [segheria.cooperativa == 0, pista.pelle >= 7]
    testo: |
      Sul cancello della Segheria lo stemma dei Malgrani, l'albero trafitto
      dalla lama, è coperto da una mano di calce, e sopra c'è una tavola con
      scritto a carbone *Cooperativa dei taglialegna*. Nel cortile i taglialegna
      stanno in due gruppi ai lati del mucchio di trucioli.

      {origine rampollo-dei-quartieri-alti} L'albero trafitto l'hai visto per
      anni sulle carrozze e sulle tovaglie dei pranzi.

      Sotto il porticato Marko Thessel aspetta in camicia di lino pulita, con un
      baule chiuso ai piedi e in mano una lettera da Laresh. «Stasera votano se
      tenermi, a paga di operaio» dice. «Leggo una venatura meglio di tutti
      loro, e a Laresh trattano soltanto con me. Però i loro nomi non li ho mai
      imparati.» Picchietta la lettera contro il baule. «A Laresh mi offrono il
      doppio.»

      {empatia Media} Le cinghie del baule non le ha tirate, e uno che parte
      davvero le tira la sera prima.
    opzioni:
      - testo: "Portarlo giù nel cortile a chiedere i nomi"
        descrizione: "Un uomo che legge il legno può imparare venti nomi in un pomeriggio, se qualcuno lo accompagna giù."
        prova: { attributo: sociale, abilita: [empatia, persuasione], difficolta: Media }
        successo:
          titolo: Venti nomi
          testo: |
            Scendi i tre gradini con lui. Marko chiede a tutti e venti i
            taglialegna come si chiamano e scrive ogni nome su un tronco,
            ripetendolo a voce alta. Al voto i due capisquadra alzano la mano
            insieme, d'accordo per la prima volta da settimane, e la sera Marko
            offre da bere a tutto il cortile. Il tronco con i nomi finisce sotto
            il porticato, con sopra una tazza.
          pe: { empatia: 5 }
          imposta: { segheria.cooperativa: 1 }
          effetti: { rep.castaldi: 0.5 }
        fallimento:
          titolo: Il terzo nome
          testo: |
            Marko sbaglia i primi due nomi, e al terzo un taglialegna sputa nei
            trucioli e se ne torna al suo gruppo. Lui risale sotto il porticato
            con il sorriso intatto e le orecchie rosse, la sola parte di lui che
            non ha mai imparato a trattare. Il voto lo rimandano a un'altra sera,
            e il baule resta dov'è, ancora chiuso.
          effetti: { scandalo: 0.5 }

      - testo: "Mostrare ai taglialegna quanto vale a Laresh"
        descrizione: "I registri dicono quanto vale a Laresh il nome di Marko, e la cooperativa non lo sa."
        prova: { attributo: mentale, abilita: [politica-ed-economia, accademiche], difficolta: Media }
        successo:
          titolo: Un terzo in meno
          testo: |
            Passi un'ora con i contratti di Laresh, e il conto è semplice da fare
            e brutto da sentire, perché senza Marko i grossisti pagherebbero il
            legname un terzo in meno. Lo spieghi ai due capisquadra, seduti
            apposta sullo stesso tronco, con le cifre scritte grandi su un'asse.
            Al voto lo tengono a paga di maestro, e Marko ti chiede, offeso, dove
            hai imparato a contare meglio di lui.
          pe: { politica-ed-economia: 5 }
          imposta: { segheria.cooperativa: 1 }
          effetti: { rep.castaldi: 0.5 }
        fallimento:
          titolo: Le cifre sull'asse
          testo: |
            A metà spiegazione ti accorgi di aver sommato le partite di due anni
            diversi, e uno dei capisquadra se ne accorge un attimo dopo di te. Da
            quel momento discutono dell'asse e non di Marko, e il voto slitta a
            un'altra sera. Marko, dal porticato, ha seguito tutto senza smettere
            di sorridere.
          effetti: { scandalo: 0.5 }

      - testo: "Aiutarlo a caricare il baule"
        descrizione: "A Laresh lo aspettano, e nessuno lo obbliga a restare dove non lo vogliono."
        esito:
          titolo: Il carro di Laresh
          testo: |
            Prendi una maniglia del baule e Marko l'altra, e lo portate fino al
            carro del grossista sul ponte. Prima di salire Marko ti racconta a
            voce bassa come i Malgrani trattenevano le partite di legname per far
            salire il prezzo. Parte senza salutare il cortile, e la portinaia dice
            il suo nome per intero, Marko Thessel, come si legge una lapide.
          pe: { politica-ed-economia: 5 }
          imposta: { segheria.cooperativa: 2 }
          effetti: { informazioni.pettegolezzo: 1 }

      - testo: "Fargli dire la verità su Rennick"
        descrizione: "Quando cercavi Rennick Dole, Marko ti ha mentito dicendo che era a Laresh, e i taglialegna se lo ricordano."
        immagine: personaggi/rennick-dole
        requisiti: [pista.dama-argento >= 3]
        prova: { attributo: sociale, abilita: [intimidire, persuasione], difficolta: Media }
        successo:
          titolo: A Laresh, diceva
          testo: |
            Glielo chiedi davanti a tutto il cortile. Marko smette di sorridere e
            ammette che Rennick non è mai andato a Laresh, e che a dirlo glielo
            aveva ordinato Ottone, con quattro uomini in livrea al cancello. I
            taglialegna votano di tenerlo a paga di operaio, a spingere tronchi
            sulla rampa per sei mesi, e Marko appende la camicia buona a un chiodo
            del porticato.
          pe: { intimidire: 5 }
          imposta: { segheria.cooperativa: 3 }
          effetti: { rep.castaldi: 0.5 }
        fallimento:
          titolo: Il sorriso
          testo: |
            Marko ti risponde con il sorriso che riserva ai mercanti quando il
            prezzo non gli piace, e dice che Rennick a Laresh ci doveva andare
            davvero, e che poi le cose sono cambiate per tutti. Metà del cortile
            gli crede e l'altra metà no, e il voto lo rimandano. Tu resti con la
            sensazione di aver perso una trattativa che non sapevi di fare.
          effetti: { sospetto: 0.5 }

  # ------------------------------------------------------------ Acciaieria dei Tarvelin
  - id: l-acciaieria-senza-padrone
    presso: acciaieria-tarvelin
    immagine: ambientazione/acciaieria-di-qir-azel
    titolo: L'Acciaieria senza padrone
    sommario: "La ciminiera dei Tarvelin è spenta, gli operai aspettano al cancello e le chiavi di Ondrel le hai tu."
    luogo: Acciaieria dei Tarvelin, davanti al cancello
    area: citta-bassa
    requisiti: [acciaieria.futuro == 0, pista.acciaio >= 8]
    testo: |
      Dalla ciminiera dei Tarvelin non esce fumo, e sulla porta delle consegne
      la corona di foglie rosse per gli otto operai morti è diventata marrone.
      Davanti al cancello, seduti sul muretto, ci sono quelli del turno di
      giorno, con le maschere di cuoio alla cintura, che vengono ogni mattina
      all'ora del cambio perché non sanno dove altro andare.

      {origine figlio-della-citta-bassa} Da bambino quel fumo ti diceva da che
      parte tirava il vento.

      Il capoturno, Abele Torsi, ha gli avambracci punteggiati di vecchie
      scottature. «Il mazzo di chiavi del vecchio ce l'hai tu, in Città Bassa lo
      sanno tutti» dice. «Alla Casa dei Nodi vogliono riaccendere con gente
      nuova e un amministratore, e la padrona non ne vuole sentir parlare.
      Intanto le famiglie degli otto non prendono un soldo.»

      Dal fondo della strada arriva Irsa Valbrun con il grembiule da bottega e
      una cartella della Gilda sotto il braccio.
    opzioni:
      - testo: "Dare le chiavi a Irsa per la Gilda"
        descrizione: "La Gilda ha i soldi e un amministratore pronto, e Irsa è la sua voce più onesta."
        immagine: personaggi/irsa-valbrun
        esito:
          titolo: La cartella della Gilda
          testo: |
            Irsa prende il mazzo e, prima di infilarselo in tasca, scrive sul
            muretto che il turno di giorno sarà riassunto per primo e che dalla
            prima colata una parte andrà alle famiglie degli otto. Abele firma con
            la punta della lingua fra i denti. Una settimana dopo la ciminiera
            fuma di nuovo, e l'amministratore della Gilda gira per i reparti con i
            guanti bianchi, che a sera sono già grigi.
          pe: { politica-ed-economia: 5 }
          imposta: { acciaieria.futuro: 1 }
          effetti: { rep.gilda: 1 }

      - testo: "Proporre che la mandino avanti gli operai"
        descrizione: "I mulini dei Malgrani adesso sono cooperative, e la fornace dei Tarvelin la sanno accendere soltanto questi venti."
        requisiti: [pista.pelle >= 7]
        prova: { attributo: mentale, abilita: [politica-ed-economia, accademiche], difficolta: Media }
        successo:
          titolo: Come i mulini
          testo: |
            Sul muretto fai i conti con Abele sul retro di una bolla di consegna,
            e tornano se la paga si divide e una quota va alle famiglie degli
            otto. Al Grifone Liaren legge il foglio due volte e firma la
            concessione agli operai per un affitto simbolico. «Purché il lyssan
            esca senza il nome di mio padre» dice, e sul nome la voce le cala di
            un tono.
          pe: { politica-ed-economia: 5 }
          imposta: { acciaieria.futuro: 2 }
          effetti: { rep.tarvelin: 0.5, rep.castaldi: 0.5 }
        fallimento:
          titolo: Chi prende di più
          testo: |
            Prima che il foglio sia pieno gli operai cominciano a discutere se
            debbano prendere di più quelli della colata o quelli dei carrelli, e
            Abele, che prova a farli tacere, alla fine grida più di tutti. Irsa
            aspetta un poco guardandosi le scarpe, poi richiude la cartella e se
            ne va, e il foglio resta sul muretto con le cifre a metà.
          effetti: { scandalo: 0.5 }

      - testo: "Proporre che la mandino avanti gli operai"
        descrizione: "La fornace la sanno accendere soltanto questi venti, e in società l'amministratore non servirebbe a nessuno."
        requisiti: [pista.pelle < 7]
        prova: { attributo: mentale, abilita: [politica-ed-economia, accademiche], difficolta: Media }
        successo:
          titolo: In società
          testo: |
            Sul muretto fai i conti con Abele sul retro di una bolla di consegna,
            e tornano se la paga si divide e una quota va alle famiglie degli
            otto. Abele rifà la somma sulle dita, e alla seconda volta sorride. Al
            Grifone Liaren legge il foglio e firma la concessione agli operai in
            società, per un affitto da niente. «Purché il lyssan esca senza il
            nome di mio padre» dice.
          pe: { politica-ed-economia: 5 }
          imposta: { acciaieria.futuro: 2 }
          effetti: { rep.tarvelin: 1 }
        fallimento:
          titolo: Chi prende di più
          testo: |
            Prima che il foglio sia pieno gli operai cominciano a discutere se
            debbano prendere di più quelli della colata o quelli dei carrelli, e
            Abele, che prova a farli tacere, alla fine grida più di tutti. Irsa
            aspetta un poco guardandosi le scarpe, poi richiude la cartella e se
            ne va, e il foglio resta sul muretto con le cifre a metà.
          effetti: { scandalo: 0.5 }

      - testo: "Portare Irsa da Liaren"
        descrizione: "Liaren rifiuta un amministratore della Gilda, e forse ascolterebbe una socia che il lyssan lo lavora da anni."
        immagine: personaggi/liaren-tarvelin
        prova: { attributo: sociale, abilita: [empatia, persuasione], difficolta: Media }
        successo:
          titolo: Al tavolo d'angolo
          testo: |
            Al Grifone Liaren dice di no prima ancora che Irsa apra la cartella.
            Quando le parli delle famiglie degli otto, però, guarda il tavolo
            invece di guardare te. Alla fine l'Acciaieria resta dei Tarvelin e la
            manda avanti Irsa, con Abele alla fornace, e la parte di Liaren va
            tutta alle famiglie degli otto. Irsa ti chiede le chiavi, e Liaren fa
            segno di sì.
          pe: { empatia: 5 }
          imposta: { acciaieria.futuro: 3 }
          effetti: { rep.tarvelin: 1, rep.gilda: 0.5 }
        fallimento:
          titolo: Il mestolo
          testo: |
            Alla parola Gilda Liaren si alza così in fretta che la sedia resta a
            dondolare, e indica la porta a Irsa. Brunella si avvicina con il
            mestolo per accompagnarvi fuori, e Irsa esce per prima con la cartella
            sotto il braccio, a testa alta. Sulla strada ti dice che ci riproverà
            quando la padrona avrà dormito.
          effetti: { scandalo: 0.5 }

      - testo: "Tenerti le chiavi ancora un po'"
        descrizione: "Chi manderà avanti l'Acciaieria lo decide la città, e oggi la città non ha fretta."
        costo: 0
        esito:
          titolo: Il muretto
          testo: |
            Dici ad Abele che le chiavi restano con te finché qualcuno non avrà
            un'idea migliore. Lui annuisce e torna a sedersi sul muretto. Irsa ti
            guarda a lungo, poi ti saluta con un cenno del mento e riprende la
            strada della Casa dei Nodi. Quando giri l'angolo gli operai sono
            ancora sul muretto, a dividersi un pezzo di pane sotto la ciminiera
            spenta.
