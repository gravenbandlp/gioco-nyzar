# La città viva, luogo 11: il Cimitero di Qir-Azel (presso: cimitero-di-qir-azel, area citta-bassa).
# L'attività delle fosse, le tre storie di rep.cimitero (2 la lapide senza nome, con il seguito dell'incontro
# con Gundo; 4 i registri di Gundo, con il seguito della fossa grande; 6 le chiavi del cimitero, con il seguito
# del mazzo di chiavi) e la carta del funerale povero. Il servizio del luogo è il lavoro stesso: le fosse, i
# registri, i funerali, e con le chiavi (cimitero.custode) il cancello da aprire all'alba.
# Gundo Marl è sparito la notte della razzia (sepolcro-1.yaml, sepolcro-2.yaml, dama-argento-2.yaml), e per la
# città resta sparito per tutto il Capitolo I. In questo file è vivo e si nasconde: di notte lavora nella
# cappella dei Vardesi e tiene il registro degli accessi (Codex, Cimitero 2.2), di giorno il cimitero lo tiene il
# garzone delle fosse. Il giocatore lo scopre con la storia a 2; dove sia stato quella notte non lo dice.
# Reputazione: le storie la portano a 3, 5 e 7. Fosse, registri e famiglie povere (fisico, mentale, sociale) la
# fanno salire fino a 4; i morti da lavare, i funerali dei Quartieri Alti e le bare nelle cappelle (mentale,
# sociale, fisico, tutte Media) fino a 6.
# Stato del mondo: le fosse della notte della Pignatta e la tavoletta di Mirko Vesh (pagata da Galdrick) dopo
# pista.pelle >= 6; Ondrel nella cappella dei Tarvelin dopo pista.acciaio >= 8; Isvaro sepolto fuori dalla
# cappella con isvaro == 3 (anche lui da pista.acciaio >= 8, a funerali fatti). Le varianti di stato del mondo
# e quelle che svelano Gundo vivo stanno in `quando`, così non compaiono chiuse prima del tempo.
# Nomi nuovi, che il Codex non dà: la cappella dei Vardesi (mercanti di sale estinti), Teodo Sarne (conciatore,
# morto nella razzia) e sua figlia Tilde.
storylet:
  # ------------------------------------------------------------ l'attività ripetibile
  - id: le-fosse-di-gundo
    presso: cimitero-di-qir-azel
    immagine: ambientazione/cimitero-di-qir-azel
    titolo: Le fosse di Gundo
    sommario: "Da quando il becchino è sparito, il cimitero lo tiene un garzone con la tosse, e il lavoro non manca."
    luogo: Cimitero di Qir-Azel, il capanno degli attrezzi
    area: citta-bassa
    ripetibile: true
    testo: |
      Il capanno degli attrezzi sta contro il muro di pietra blu. Sulla porta,
      la tavoletta dei turni è scritta in una grafia minuta fino al giorno del
      Festival e da lì in avanti grossa e storta, con una croce per ogni
      fossa.

      Da quando Gundo Marl è sparito, la notte della razzia, il cimitero lo
      tiene il garzone delle fosse, un ragazzo con un berretto troppo grande e
      una tosse che lo piega in due. Passa davanti alla casetta chiusa del
      becchino senza guardarla, e quando ti vede ti indica le pale con il
      mento.
    opzioni:
      - testo: "Scavare una fossa"
        descrizione: "Domattina c'è un funerale, e il garzone, con quella tosse, non ha le braccia per scavare."
        requisiti: [rep.cimitero < 2]
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Facile }
        successo:
          titolo: Lo spago
          testo: |
            Il garzone segna il rettangolo con quattro paletti e uno spago, e tu
            scavi finché lo spago non ti passa sopra la testa, fra sassi che
            suonano contro la pala. A metà mattina hai le mani piene di vesciche.
            Alla fine lui sonda il fondo con il manico e ti conta qualche moneta
            nel palmo, tenendosi il berretto con l'altra mano.
          effetti: { monete: 2, rep.cimitero: 0.5 }
        fallimento:
          titolo: La parete che frana
          testo: |
            Scavi con troppa foga, e a metà la parete del vialetto ti frana
            addosso fino alle ginocchia. Il garzone ti tira fuori tossendo e
            passate un'ora a puntellarla con le assi. Alla fine ti allunga uno
            spicciolo e dice che il morto non si lamenterà, come diceva il vecchio
            di tutte le fosse storte.
          effetti: { monete: 1 }

      - testo: "Scavare una fossa"
        descrizione: "Il garzone ti lascia le fosse delle famiglie che pagano, con la cassa di quercia e il prete giusto."
        requisiti: [rep.cimitero >= 2, rep.cimitero < 4]
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Media }
        successo:
          titolo: Il filo a piombo
          testo: |
            La fossa è per una vedova dei Quartieri Alti, e la famiglia vuole le
            pareti dritte come quelle di una stanza. Lavori con la squadra e il
            filo a piombo di Gundo, ancora avvolti nella sua carta oleata. A
            mezzogiorno il maggiordomo misura con un bastone, trova tutto in
            ordine e ti lascia una buona mancia senza guardarti in faccia.
          effetti: { monete: 3, rep.cimitero: 0.5 }
        fallimento:
          titolo: La radice
          testo: |
            A due braccia di profondità la pala sbatte contro una radice di cipresso grossa come una coscia, e ci perdi il
            pomeriggio con l'accetta. Il maggiordomo arriva a misurare quando sei ancora dentro fino alla vita e se ne va
            scuotendo la testa. Finite la fossa alla luce della lanterna, e la paga la tiene il garzone, perché la fossa era
            sua.

      - testo: "Copiare i registri funebri"
        descrizione: "Dopo la razzia il garzone ha scritto i morti dove capitava, e le pagine vanno rifatte in bella copia."
        requisiti: [rep.cimitero < 4]
        quando: [cimitero.lapide == 0]
        prova: { attributo: mentale, abilita: accademiche, difficolta: Media }
        successo:
          titolo: In bella copia
          testo: |
            Ti siedi sulla soglia del capanno con il registro sulle ginocchia e un
            quaderno nuovo pagato dal Velo, e rimetti ogni morto nella sua riga
            con il giorno e la fossa, anche quelli che il garzone ha scritto due
            volte con due cognomi diversi. Lui legge la copia muovendo le labbra,
            e quando ti paga ti stringe la mano con tutte e due le sue, bianche di
            calce.
          effetti: { monete: 2, rep.cimitero: 0.5 }
        fallimento:
          titolo: Due fratelli
          testo: |
            A metà della quarta pagina ti accorgi di aver messo nella stessa fossa
            due fratelli che il garzone aveva scritto in due fosse diverse, e non
            sai chi dei due aveva ragione. Il garzone si gratta la testa sotto il
            berretto e ti dice di lasciare la riga in bianco, così almeno non è
            sbagliata. Ti paga uno spicciolo per la carta.
          effetti: { monete: 1 }

      - testo: "Copiare i registri con Gundo"
        descrizione: "Di notte, nella cappella dei Vardesi, Gundo rifà le pagine del garzone, e una seconda penna gli fa comodo."
        immagine: personaggi/gundo-marl
        requisiti: [rep.cimitero < 4]
        quando: [cimitero.lapide >= 1]
        prova: { attributo: mentale, abilita: accademiche, difficolta: Media }
        successo:
          titolo: Due penne
          testo: |
            Gundo ti fa sedere dall'altra parte del sarcofago, con una candela in
            mezzo, e ti detta dal registro del garzone; lui ricopia i nomi e tu i
            giorni e le fosse. Quando sbagli una data te lo dice prima che
            l'inchiostro si asciughi, senza alzare la testa. Verso l'alba ti conta
            le monete in mano una alla volta. «Puntuale» dice, e capisci che parla
            di te.
          effetti: { monete: 3, rep.cimitero: 0.5 }
        fallimento:
          titolo: La riga saltata
          testo: |
            Gundo ti detta i giorni e le fosse finché la candela si consuma fino al piattino. A un certo punto
            salti una riga intera, e con lei una donna morta il terzo giorno dopo la razzia. Gundo rifà la
            pagina senza commentare, con le dita lunghe che non tremano, e prima dell'alba ti dà uno spicciolo e
            ti manda a dormire.
          effetti: { monete: 1 }

      - testo: "Accompagnare una famiglia povera"
        descrizione: "Una famiglia della Città Bassa seppellisce un vecchio senza prete e senza soldi, e qualcuno deve stare con loro."
        requisiti: [rep.cimitero < 4]
        quando: [pista.pelle < 6]
        prova: { attributo: sociale, abilita: [empatia, galateo], difficolta: Media }
        successo:
          titolo: La lettera sbagliata
          testo: |
            Sono una donna con due figli e un cane, e il morto è suo padre, un
            facchino dei Ponti. Lo calate insieme, e quando lei non riesce a
            parlare leggi tu le due righe della Liturgia che il garzone tiene nel
            capanno. Il figlio più grande incide il nome sulla tavoletta con il
            tuo coltello e sbaglia una lettera, che lascia com'è.
          effetti: { rep.cimitero: 0.5 }
        fallimento:
          titolo: Il riposo meritato
          testo: |
            Davanti alla fossa ti escono le parole dei funerali dei ricchi, quelle sul giardino dell'Albero e sul riposo
            meritato. La donna ti guarda con gli occhi asciutti e dice che suo padre del riposo non ne voleva sapere. I
            figli calano la cassa da soli, e a te lasciano soltanto il cane da tenere per il collare.

      - testo: "Accompagnare una famiglia povera"
        descrizione: "Dopo la notte della Pignatta ci sono morti che in Città Bassa nessuno vuole portare a spalla."
        requisiti: [rep.cimitero < 4]
        quando: [pista.pelle >= 6]
        prova: { attributo: sociale, abilita: [empatia, galateo], difficolta: Media }
        successo:
          titolo: Uno di quelli di Vesh
          testo: |
            Il morto era uno di quelli di Vesh, e al cancello tre vicini guardano
            senza entrare. Tu e la sorella prendete la cassa ai due capi e la
            portate fino alla fila nuova lungo il muro. La madre non piange finché
            i vicini non se ne vanno, poi ti chiede se lo conoscevi. Le dici di
            no, e lei resta davanti alla tavoletta finché il garzone non chiude la
            terra.
          effetti: { rep.cimitero: 0.5 }
        fallimento:
          titolo: I vicini
          testo: |
            Il morto era uno di quelli di Vesh, e al cancello tre vicini aspettano
            la cassa per sputare per terra. Ti metti in mezzo con le parole
            sbagliate, e la lite va avanti finché la madre del morto ti prende per
            la manica e ti chiede di smettere. La cassa la portano lei e il
            garzone, e tu resti al cancello con i vicini.

      - testo: "Fare la veglia contro i ladri di tombe"
        descrizione: "Dopo la razzia c'è chi scavalca il muro di notte per prendere gli anelli ai morti freschi."
        quando: [cimitero.lapide == 0]
        prova: { attributo: fisico, abilita: furtivita, difficolta: Media }
        successo:
          titolo: La zappetta
          testo: |
            Ti apposti dietro una cappella, e verso mezzanotte un ragazzo magro
            con una zappetta scavalca dal punto del bosso spezzato e va dritto
            alle fosse nuove. Lo prendi per il colletto senza un rumore. Ha
            quattordici anni al massimo, e prima ancora di piangere ti dice a chi
            vende gli anelli. Il garzone lo conosce e lo rimanda a casa con un
            calcio nel sedere.
          effetti: { monete: 2, informazioni.voce: 1 }
        fallimento:
          titolo: Il gatto senza coda
          testo: |
            Per ore senti soltanto il vento fra i cipressi. Quando qualcosa si
            muove fra le tombe scatti in piedi, inciampi in una tavoletta e
            finisci lungo disteso sulla ghiaia. È il gatto senza coda della
            vecchia che abita accanto al muro, e ti guarda dall'alto di una croce;
            se c'era un ladro ormai è lontano, e il garzone ti paga la notte a
            metà.
          effetti: { monete: 1 }

      - testo: "Fare la veglia con Gundo"
        descrizione: "Gundo veglia dalla grata della cappella dei Vardesi, ma un tratto di muro da lì non lo vede."
        immagine: personaggi/gundo-marl
        quando: [cimitero.lapide >= 1]
        prova: { attributo: mentale, abilita: percezione, difficolta: Media }
        successo:
          titolo: Il quaderno nero
          testo: |
            Al buio, dietro la grata, guardi con Gundo il muro dal bosso spezzato
            fino al cancello. Verso le due indichi un'ombra sulla cresta, e sono
            due monaci del Velo che fanno il giro e se ne vanno. Gundo li scrive
            nel quaderno nero con l'ora esatta e una frase che uno ha detto
            all'altro, e all'alba ti paga il turno e ti lascia leggere la riga.
          effetti: { monete: 2, informazioni.voce: 1 }
        fallimento:
          titolo: La testa contro la pietra
          testo: |
            Verso le tre ti svegli con la testa contro la pietra, e Gundo è nella
            posizione di prima, con il quaderno aperto sulle ginocchia. Nel
            frattempo sono passati una volpe e due monaci del Velo, e lui li ha
            scritti tutti, la volpe compresa. Quella notte non ti paga, però ti
            lascia restare con lui fino all'alba.

      - testo: "Rastrellare i vialetti"
        descrizione: "Il garzone passa il rastrello ogni mattina, anche dove non va più nessuno."
        quando: [pista.acciaio < 8]
        esito:
          titolo: La tazza sbeccata
          testo: |
            Rastrelli i vialetti dal cancello fino alle fosse comuni della razzia,
            dove la terra è ancora scura e le famiglie hanno lasciato quello che
            avevano, un fiore di carta in una tazza sbeccata o un berretto da
            guardia. La ghiaia fa un rumore troppo allegro per il posto. Quando
            hai finito il garzone passa a controllare e raddrizza il berretto, che
            il vento aveva girato di traverso.
          pe: { resilienza: 2 }

      - testo: "Rastrellare i vialetti"
        descrizione: "Dopo la notte della Pignatta il garzone ha aperto una fila nuova lungo il muro, da tenere in ordine."
        quando: [pista.pelle >= 6]
        esito:
          titolo: La fila nuova
          testo: |
            Lungo il muro di levante c'è la fila nuova per i morti della notte
            della Pignatta che nessuno ha reclamato. In fondo una tavoletta porta
            il nome di Mirko Vesh inciso a coltello, senza date. Il garzone ti
            dice che l'hanno sepolto con l'anello d'argento al mignolo e che la
            tavoletta l'ha pagata lo sceriffo, chiedendo di non scriverlo sul
            registro, e tu rastrelli anche intorno a quella.
          pe: { resilienza: 2 }

      - testo: "Rastrellare i vialetti"
        descrizione: "Al funerale dei Tarvelin c'era più gente che a una seduta del Consiglio, e la ghiaia è tutta smossa."
        quando: [pista.acciaio >= 8, pista.pelle < 6, isvaro != 3]
        esito:
          titolo: La cappella dei Tarvelin
          testo: |
            La cappella dei Tarvelin ha un'incudine scolpita sopra l'architrave, e
            da qualche settimana dentro c'è anche Ondrel, accanto alla moglie. Il
            garzone ti racconta che al funerale c'erano più uomini della Gilda che
            parenti, e che Liaren è arrivata per ultima ed è andata via per prima.
            Rastrelli via i solchi dei tacchi, tutti rivolti verso l'uscita.
          pe: { resilienza: 2 }

      - testo: "Rastrellare i vialetti"
        descrizione: "Accanto alla cappella dei Tarvelin c'è una pietra nuova, fuori dal portale."
        quando: [pista.acciaio >= 8, pista.pelle < 6, isvaro == 3]
        esito:
          titolo: Fuori dal portale
          testo: |
            Dentro la cappella dei Tarvelin c'è Ondrel accanto alla moglie, mentre
            Isvaro è sepolto fuori, a destra del portale, sotto una pietra con il
            solo nome. Il garzone dice che al suo funerale c'erano lui e il prete,
            e che il prete ha letto in fretta. Intorno alla pietra passi il
            rastrello due volte, e non sapresti dire per chi lo fai.
          pe: { resilienza: 2 }

      - testo: "Lavare e vestire i morti"
        descrizione: "Nella cella di pietra i morti che nessuno reclama aspettano di essere lavati e vestiti come faceva il vecchio."
        requisiti: [rep.cimitero >= 4, rep.cimitero < 6]
        prova: { attributo: mentale, abilita: medicina, difficolta: Media }
        successo:
          titolo: La segatura
          testo: |
            Nella cella c'è un annegato senza nome, ripescato nel canale del
            cristallo. Lo lavi con acqua e aceto e gli cerchi addosso qualcosa che
            dica chi era, e trovi segatura sotto l'unghia del pollice e il callo
            della sega a due mani sul palmo. Il garzone porta la notizia alla
            Segheria, e prima di sera un uomo viene a riconoscerlo e paga il
            funerale, e la paga la dividete.
          effetti: { monete: 3, rep.cimitero: 0.5 }
        fallimento:
          titolo: L'aceto
          testo: |
            L'annegato del canale ti manda addosso il suo odore alla prima
            secchiata, e devi uscire due volte fra i cipressi. Lo lavi lo stesso
            come puoi, ma addosso non ha niente che dica chi era, e il garzone lo
            registra fra gli ignoti. A te dà uno spicciolo e un sorso d'acquavite
            che ti toglie l'odore dal naso.
          effetti: { monete: 1 }

      - testo: "Fare da cerimoniere a un funerale ricco"
        descrizione: "Le famiglie dei Quartieri Alti vogliono qualcuno che sappia dove mettere i parenti, e il garzone non è adatto."
        requisiti: [rep.cimitero >= 4, rep.cimitero < 6]
        prova: { attributo: sociale, abilita: [galateo, espressivita], difficolta: Media }
        successo:
          titolo: L'ordine dei parenti
          testo: |
            Il morto è un mercante della Gilda, e alla cappella arrivano tre
            generazioni di parenti che non si parlano. Metti i figli davanti e la
            seconda moglie accanto al prete, dove nessuno dei figli può dirle
            niente, e annunci le corone senza sbagliare un titolo. Alla fine il
            figlio maggiore ti paga bene e ti chiede se fai anche i matrimoni.
          effetti: { monete: 5, rep.cimitero: 0.5 }
        fallimento:
          titolo: La seconda moglie
          testo: |
            Alla cappella arrivano tre generazioni di parenti di un mercante della
            Gilda, e tu metti la seconda moglie in prima fila accanto ai figli
            della prima. Prima che il prete apra il libro la cappella è divisa in
            due, e passi la cerimonia a tenere separati due cugini, uno dei quali
            ti pesta un piede con metodo. Il figlio maggiore ti paga meno del
            previsto.
          effetti: { monete: 2 }

      - testo: "Calare una bara in una cappella"
        descrizione: "Le cappelle ricche hanno scale strette e bare di pietra, e qualcuno deve tenere il conto dei gradini."
        requisiti: [rep.cimitero >= 4, rep.cimitero < 6]
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Media }
        successo:
          titolo: Sedici gradini
          testo: |
            La bara di pietra chiara scende per sedici gradini consumati, calata
            in quattro con due corde, e tu in testa conti a voce alta camminando
            all'indietro, come faceva Gundo. Al dodicesimo un facchino scivola e
            la bara ti pesa tutta sulle spalle, ma tieni duro fino in fondo e la
            posate sul ripiano senza un graffio.
          effetti: { monete: 3, rep.cimitero: 0.5 }
        fallimento:
          titolo: Lo spigolo
          testo: |
            La scala della cappella ha sedici gradini consumati. Al decimo perdi
            il conto e il passo, e lo spigolo della bara picchia contro la parete
            e si scheggia. La famiglia dà la colpa al garzone, che non fa il tuo
            nome, e la paga ve la tagliano a metà a tutti e due.
          effetti: { monete: 1 }

      - testo: "Aprire il cancello all'alba"
        descrizione: "Di giorno il cimitero risponde a te, e di notte Gundo vuole sapere com'è andata."
        immagine: personaggi/gundo-marl
        quando: [cimitero.custode >= 1]
        prova: { attributo: mentale, abilita: [accademiche, percezione], difficolta: Media }
        successo:
          titolo: Le iniziali
          testo: |
            Apri il cancello alla prima campana e ricevi le famiglie una alla
            volta con il registro sul braccio, firmando ogni riga con le iniziali
            piccole che ti ha insegnato lui. A mezzogiorno un monaco del Velo
            chiede del becchino, e gli rispondi senza mentire che il registro è in
            ordine. La sera, nella cappella dei Vardesi, Gundo controlla le tue
            righe e ti conta la paga sul sarcofago.
          effetti: { monete: 7, informazioni.voce: 1 }
        fallimento:
          titolo: La riga storta
          testo: |
            A metà mattina due famiglie si presentano per la stessa fossa con due
            ricevute diverse, e ci perdi il pranzo. Alla fine scrivi una riga
            storta che non ti piace. La sera Gundo la guarda a lungo, si soffia
            sulle dita e ti conta la paga lo stesso fino all'ultima moneta.
          effetti: { monete: 5 }

      - testo: "Dire la preghiera sulle fosse senza nome"
        descrizione: "I morti che nessuno reclama il garzone li seppellisce senza prete, e tu le parole del Velo le sai."
        quando: [origine.accolito-del-velo >= 1]
        requisiti: [rep.cimitero < 4]
        prova: { attributo: mentale, abilita: [accademiche, resilienza], difficolta: Media }
        successo:
          titolo: Le parole del Velo
          testo: |
            Il garzone ti aspetta alla fila lungo il muro con il berretto in mano, e
            per tutta la preghiera riesce a non tossire. Dici le parole del Velo su
            ogni fossa, e dove la tavoletta non ha un nome la voce ti viene più bassa.
            Alla fine ti dà qualche moneta della cassetta dei poveri, scusandosi che
            siano poche, e nel registro scrive *benedetta* accanto a ogni croce della
            settimana.
          effetti: { monete: 2, rep.cimitero: 0.5 }
        fallimento:
          titolo: La voce che si spezza
          testo: |
            Alla terza fossa la voce ti si spezza su una parola che in Cattedrale hai
            detto cento volte, e resti con la bocca aperta mentre il garzone guarda
            per terra. Finisci in un sussurro, saltando un verso. Lui ti ringrazia
            con tanta gentilezza che la faccia ti brucia per tutta la strada del
            ritorno.

  # ------------------------------------------------------------ storia a 2 · la lapide senza nome
  - id: la-lapide-senza-nome
    presso: cimitero-di-qir-azel
    immagine: ambientazione/cimitero-di-qir-azel
    titolo: La lapide senza nome
    sommario: "In fondo al cimitero una vecchia lapide senza nome viene pulita di notte, e il garzone non ci dorme più."
    luogo: Cimitero di Qir-Azel, la fila vecchia
    area: citta-bassa
    requisiti: [rep.cimitero >= 2, cimitero.lapide == 0]
    testo: |
      Il garzone ti aspetta al cancello rigirando il berretto fra le dita, e ti
      porta in fondo al cimitero, nella fila più vecchia, dove il vento ha
      lisciato i nomi sull'arenaria fino a lasciarne l'ombra. Una pietra bassa
      senza date e senza l'Albero un nome non l'ha mai avuto, e qualcuno le ha
      grattato via a metà i licheni gialli. Nel registro di Gundo la sua riga è
      vuota.

      Da tre notti qualcuno se ne occupa. Stamattina la ghiaia intorno era
      rastrellata a spina di pesce, e ai piedi della pietra c'era un mozzicone
      di candela di sego ancora molle.

      «La spina di pesce io non la so fare» dice il garzone, e tossisce dentro
      il gomito. «La faceva il vecchio. E di notte qualcuno mi corregge anche
      le pagine del registro, con una grafia piccola piccola.» Guarda la
      casetta chiusa di Gundo, poi te. «Al Velo non lo dico, sennò al posto
      della paga mi mandano un prete.»

      {origine accolito-del-velo} Lo dice a te, che dalla Cattedrale vieni, e
      non abbassa nemmeno la voce.

      {empatia Media} Sotto la paura c'è una speranza che non osa guardare in
      faccia, e per questo non dice il nome del vecchio.

      *Un morto che corregge l'ortografia sarebbe un morto molto paziente.* Ti
      volti anche tu verso la casetta.
    opzioni:
      - testo: "Fare la posta alla lapide"
        descrizione: "Chi viene di notte viene da qualche parte. Basta stare fermi abbastanza a lungo dietro il cipresso giusto."
        prova: { attributo: fisico, abilita: furtivita, difficolta: Media }
        successo:
          titolo: La lanterna schermata
          testo: |
            Ti apposti dietro un cipresso storto, e dopo la seconda campana la
            grata di una cappella si apre senza cigolare e ne esce una figura
            curva e zoppa, che si inginocchia davanti alla lapide e gratta i
            licheni con l'unghia. Non si volta quando la ghiaia ti scricchiola
            sotto i piedi, e parla alla pietra: «Sei quello che dà una mano al
            ragazzo, e qui fuori ci vedono. Vieni dentro.»
          pe: { furtivita: 5 }
          segue: il-becchino-di-notte
        fallimento:
          titolo: Il ramo secco
          testo: |
            Aspetti dietro un cipresso fino alla seconda campana, e quando senti
            un passo strascicato sulla ghiaia ti sporgi troppo e ti si spezza un
            ramo sotto lo stivale. La lanterna in fondo alla fila si spegne, e fra
            le tombe non trovi nessuno. La mattina dopo la ghiaia intorno alla
            lapide è rastrellata di nuovo a spina di pesce, più ordinata del
            solito.
          effetti: { sospetto: 0.5 }

      - testo: "Confrontare le correzioni nel registro"
        descrizione: "Le pagine vecchie del registro sono di Gundo, quelle nuove del garzone, e di notte qualcuno ci mette le mani."
        prova: { attributo: mentale, abilita: [accademiche, percezione], difficolta: Media }
        successo:
          titolo: Il sette barrato
          testo: |
            Metti una pagina vecchia accanto a una nuova. Chi corregge di notte
            scrive il sette con una barretta a metà e chiude le righe con un punto
            tondo, come Gundo dieci anni fa, e a margine c'è una nota, *fossa
            diciannove, il nome si scrive con due elle*. Sotto scrivi a matita che
            stanotte sarai alla lapide, e dopo la seconda campana la grata di una
            cappella si apre.
          pe: { accademiche: 5 }
          segue: il-becchino-di-notte
        fallimento:
          titolo: Le due grafie
          testo: |
            Confronti le pagine fino a sera, e alla fine ti sembrano tutte della
            stessa mano minuta. Il garzone ti riprende il registro, dice che se lo
            tocchi troppo il Velo se ne accorge e lo rimette nel capanno, sotto il
            barile della calce.
          effetti: { tormento: 0.5 }

      - testo: "Chiedere alla vecchia del gatto"
        descrizione: "Dalla finestra della vecchia del gatto senza coda, nella casa che dà sul muro, il cimitero si vede tutto."
        prova: { attributo: sociale, abilita: [empatia, conoscenze-della-strada], difficolta: Media }
        successo:
          titolo: La luce dei Vardesi
          testo: |
            La vecchia ti fa entrare per il gatto, che ti strofina il moncherino
            di coda sugli stivali. Certe notti, dice, nella cappella dei Vardesi
            c'è una luce, e i Vardesi sono tutti lì dentro da prima che lei si
            sposasse. «Una luce piccola, da candela di sego, dopo la seconda
            campana. I morti la candela non se la portano.» La notte dopo, alla
            seconda campana, bussi alla grata.
          pe: { empatia: 5 }
          segue: il-becchino-di-notte
        fallimento:
          titolo: Il gatto
          testo: |
            La vecchia ti parla del gatto, di come ha perso la coda e di quanto
            mangia, e ogni volta che porti il discorso sul cimitero cambia
            argomento. Alla fine ti accompagna alla porta con una fetta di torta
            in un tovagliolo e ti chiede di tornare a trovare il gatto.
          effetti: { sospetto: 0.5 }

      - testo: "Lasciare un biglietto sulla lapide"
        descrizione: "Chi pulisce la lapide di notte leggerà un biglietto, se hai qualche giorno di pazienza."
        costo: 2
        esito:
          titolo: La risposta
          testo: |
            Scrivi su un foglio piegato che il ragazzo delle fosse ha la tosse e
            ha paura, e lo fermi sotto un sasso ai piedi della lapide. Per due
            notti il foglio resta dov'è. La terza mattina c'è una riga in più, in
            una grafia minuta, *dopo la seconda campana, cappella dei Vardesi,
            vieni solo*, e il sasso è stato rimesso nell'impronta esatta che aveva
            lasciato nella ghiaia.
          pe: { resilienza: 5 }
          segue: il-becchino-di-notte

  - id: il-becchino-di-notte
    immagine: personaggi/gundo-marl
    titolo: Il becchino di notte
    tipo: seguito
    luogo: Cimitero di Qir-Azel, la cappella dei Vardesi
    area: citta-bassa
    requisiti: [cimitero.lapide == 0]
    testo: |
      La cappella dei Vardesi, mercanti di sale estinti da prima che il garzone
      nascesse, è addossata al muro di levante. Sul coperchio del sarcofago
      brucia una candela di sego accanto a un registro aperto.

      Gundo Marl è seduto su uno sgabello basso, curvo sulle pagine, con la
      tunica grigia da becchino e un amuleto dell'Albero Rosso al collo. Non
      smette di scrivere quando entri, e ti parla senza alzare la testa. «Ti ho
      visto dalla grata, con il ragazzo. Quello che fai lo fai con cura.»

      {origine figlio-della-citta-bassa} Nei vicoli il becchino serviva a far
      rientrare i bambini prima del buio, e te lo immaginavi alto fino alle
      grondaie.

      Gli chiedi dov'è stato, e lui finisce la riga prima di alzare gli occhi,
      che sono chiari in una faccia vecchia. «Dove sono stato quella notte
      resta fra me e l'Albero. Di giorno per adesso non ci sono. Chi è sceso
      nella cripta sapeva a che ora spengo la candela, e mi va bene che adesso
      mi creda sparito.»

      {ingannare Media} Ti ha detto tutto quello che voleva e niente di quello
      che gli hai chiesto, senza una sola bugia.

      Poi si tocca l'amuleto e indica con il mento la fila vecchia, dalla parte
      della lapide senza nome.
    opzioni:
      - testo: "Chiedergli della lapide"
        descrizione: "Una pietra senza nome e senza date, pulita di notte da un uomo che di giorno non esiste."
        costo: 0
        esito:
          titolo: Un altro mestiere
          testo: |
            Gundo chiude il registro prima di rispondere. «Quando facevo un altro
            mestiere lui e io portavamo la roba per strade dove la Gilda non mette
            dazi» dice al sarcofago. «Una notte è caduto, e il suo nome lo
            cercavano in tre città. Gliel'ho tolto perché nessuno andasse a
            chiedere alla sua famiglia, e il giorno dopo ho chiesto al becchino di
            allora se gli serviva un garzone.»
          segue: il-becchino-di-notte

      - testo: "Promettergli di tacere"
        descrizione: "Per il Velo e per la città Gundo Marl è sparito. Può restarlo ancora un po'."
        esito:
          titolo: La riga a margine
          testo: |
            Gli dici che di te può fidarsi. Gundo ti guarda il tempo di una riga.
            Poi annuisce e in margine alla pagina della fila vecchia scrive il tuo
            nome con la sua grafia minuta, e accanto una data. «Al ragazzo dai una
            mano di giorno» dice, senza smettere di scrivere. «Di notte, se serve,
            la grata è aperta.»
          pe: { galateo: 5 }
          imposta: { cimitero.lapide: 1 }
          effetti: { rep.cimitero: 1 }

      - testo: "Chiedergli di dirlo almeno al garzone"
        descrizione: "Il ragazzo tiene il cimitero da solo con quella tosse, e crede che il vecchio sia morto."
        prova: { attributo: sociale, abilita: [empatia, persuasione], difficolta: Media }
        successo:
          titolo: La paga del venerdì
          testo: |
            Gli racconti del berretto che il ragazzo rigira fra le dita e della
            tosse che lo piega sulle fosse. Gundo ascolta guardando la candela.
            «Il ragazzo parla con tutti» dice. «Però è puntuale.» Il venerdì dopo
            il garzone trova la paga sotto il sasso della soglia, contata giusta,
            con un biglietto nella grafia minuta, e da quel giorno ti saluta
            togliendosi il berretto due volte.
          pe: { empatia: 5 }
          imposta: { cimitero.lapide: 1 }
          effetti: { rep.cimitero: 1 }
        fallimento:
          titolo: Non ancora
          testo: |
            Gundo scuote la testa prima che tu abbia finito. «Il ragazzo parla con
            tutti, e con la tosse parla anche più forte» dice. «Lo saprà quando lo
            decido io.» Ti fa promettere di tacere anche con lui, e prima che tu
            esca ti mette in mano qualche moneta per il ragazzo, da dargli come se
            fossero tue.
          imposta: { cimitero.lapide: 1 }
          effetti: { rep.cimitero: 1, tormento: 0.5 }

      - testo: "Offrirti di portargli quello che gli serve"
        descrizione: "Un uomo che di giorno non esiste non può andare al mercato a comprarsi le candele."
        requisiti: [monete >= 3]
        esito:
          titolo: Candele di sego
          testo: |
            Gundo ci pensa sul serio, contando sulle dita lunghe, e alla fine gli servono soltanto candele
            di sego e inchiostro nero, perché il pane se lo procura da sé. Il giorno dopo li lasci dietro
            la grata in una cesta coperta da un panno, e la sera nella cesta vuota trovi il resto delle tue
            monete contato giusto, con una ricevuta firmata da due iniziali minute.
          pe: { conoscenze-della-strada: 5 }
          imposta: { cimitero.lapide: 1 }
          effetti: { rep.cimitero: 1, monete: -3 }

  # ------------------------------------------------------------ storia a 4 · i registri di Gundo
  - id: i-registri-di-gundo
    presso: cimitero-di-qir-azel
    immagine: personaggi/gundo-marl
    titolo: I registri di Gundo
    sommario: "Gundo Marl ha messo i conti della razzia accanto alla lista del Velo, e non tornano."
    luogo: Cimitero di Qir-Azel, la cappella dei Vardesi
    area: citta-bassa
    requisiti: [rep.cimitero >= 4, cimitero.registri == 0, cimitero.lapide >= 1]
    testo: |
      Stanotte sul sarcofago dei Vardesi ci sono tre registri, quello del
      garzone, la lista dei morti benedetti nelle fosse comuni, con il sigillo
      della Cattedrale, e sotto la mano di Gundo un quaderno piccolo rilegato
      in tela nera.

      «Il Velo ne ha benedetti cinquantuno» dice Gundo al foglio, «il ragazzo
      ne ha scritti cinquanta, e la terra della fossa grande ne ha uno in più
      di quelli che dice lui.»

      {origine accolito-del-velo} Il sigillo l'hai riconosciuto prima di
      leggere una riga.

      Poi apre il quaderno nero. Ogni tre notti dopo la razzia qualcuno
      scavalca dal bosso spezzato, va alla fossa grande e ci resta fino alla
      prima campana. «Non tocca la cripta, va dai morti nuovi» dice Gundo, «e
      io con questa gamba non lo prendo.»

      Sullo scaffale c'è un registro più vecchio con *centoquarantacinque* sul
      dorso, e Gundo vede dove guardi ma non lo sposta.
    opzioni:
      - testo: "Sfogliare il registro del centoquarantacinque"
        descrizione: "L'anno dell'incendio e delle Notti Cucite, quando Gundo mise in terra i morti uno per uno."
        immagine: ambientazione/cripta-di-idrian-sollen
        costo: 0
        esito:
          titolo: Scuciti
          testo: |
            Le pagine di quel mese hanno venticinque nomi, e accanto a ognuno
            Gundo ha segnato la fossa e una parola sola, *scucito*. «Il Cucitore
            li lasciava cuciti insieme, come offerte» dice, senza alzare la voce.
            «Io li ho scuciti, uno alla volta, perché nessuno finisse sotto terra
            attaccato a un altro, e ci ho messo nove notti.»
          effetti: { tormento: 1.5 }
          segue: i-registri-di-gundo

      - testo: "Rifare i conti sulle pagine del ragazzo"
        descrizione: "La lista del Velo da una parte, il registro del garzone dall'altra, e in mezzo un morto che manca."
        prova: { attributo: mentale, abilita: [accademiche, percezione], difficolta: Media }
        successo:
          titolo: Il quarto giorno
          testo: |
            Scorri la lista del Velo e le pagine del garzone con due dita. Al
            quarto giorno dopo la razzia la lista ha un nome che nel registro
            manca, *Teodo Sarne, conciatore*, e nel registro c'è soltanto una
            croce senza nome accanto alla fossa grande. «Lo ha messo giù senza
            sapere chi era» dice Gundo. «Chi viene di notte invece lo sa.» La
            notte dopo vi appostate vicino al bosso.
          pe: { accademiche: 5 }
          segue: la-fossa-grande
        fallimento:
          titolo: I conti sbagliati
          testo: |
            Conti e ricominci, e ogni volta ti viene un numero diverso, perché il
            garzone certi morti li ha scritti per nome e certi per mestiere. A
            mezzanotte Gundo ti toglie i fogli di mano, ti dice di tornare quando
            hai dormito e ricomincia da capo con il suo dito lungo, muovendo le
            labbra.
          effetti: { tormento: 0.5 }

      - testo: "Fare la posta al bosso spezzato"
        descrizione: "Ogni tre notti, dice il quaderno nero, e stanotte è la terza."
        prova: { attributo: fisico, abilita: [furtivita, atletica], difficolta: Media }
        successo:
          titolo: Lo scialle
          testo: |
            Ti accucci dietro il bosso con le ginocchia nella terra umida. Dopo la
            seconda campana una figura avvolta in uno scialle scuro scavalca il
            muro a fatica e cade in piedi a un passo da te, con una lanterna
            spenta e un fagotto. La lasci passare e la segui nell'ombra dei
            cipressi fino alla fossa grande, e in tutto il tragitto non si volta
            una volta sola.
          pe: { furtivita: 5 }
          segue: la-fossa-grande
        fallimento:
          titolo: Il vicolo
          testo: |
            Dopo la seconda campana senti qualcuno arrampicarsi dall'altra parte
            del muro. Ti sporgi troppo, e una testa avvolta in uno scialle si
            affaccia sulla cresta proprio sopra di te. Vi guardate un momento, poi
            la testa sparisce e senti dei passi che corrono via nel vicolo. La
            mattina Gundo scrive nel quaderno nero una riga con il tuo nome.
          effetti: { sospetto: 0.5 }

      - testo: "Parlare con il garzone"
        descrizione: "Le pagine sono del garzone, e se nella fossa grande c'è un morto senza nome lui sa perché."
        prova: { attributo: sociale, abilita: [empatia, persuasione], difficolta: Media }
        successo:
          titolo: Bruciato
          testo: |
            Lo trovi seduto sulla carriola a mangiare pane e cipolla, e gli parli della fossa grande
            senza nominare Gundo. Il quarto giorno, racconta, è arrivato un carro con un uomo
            bruciato e senza nome, e la fossa grande era ancora aperta. «L'ho messo giù la sera e la
            riga l'ho lasciata per dopo. Poi la riga non l'ho più trovata.» Quella notte ti apposti
            alla fossa con Gundo.
          pe: { empatia: 5 }
          segue: la-fossa-grande
        fallimento:
          titolo: Il berretto calcato
          testo: |
            Gli chiedi del registro della razzia in un modo che suona come
            un'accusa. Il garzone si calca il berretto fino alle orecchie e dice
            che i morti li ha messi giù tutti, e che chi vuole contarli se li
            conti da solo. Per il resto del giorno, quando lo incroci fra le
            tombe, cambia vialetto.
          effetti: { scandalo: 0.5 }

      - testo: "Aspettare con Gundo alla fossa grande"
        descrizione: "Due persone sedute al buio, e una delle due sa aspettare da venticinque anni."
        costo: 2
        esito:
          titolo: Al buio
          testo: |
            Vi sedete su una lapide bassa a qualche passo dalla fossa grande, con
            la lanterna spenta fra i piedi. Gundo non parla, e dopo un'ora smetti
            anche tu di averne voglia. La prima notte non viene nessuno, la
            seconda passa soltanto la ronda del Velo, e la terza, dopo la seconda
            campana, qualcuno scavalca dal bosso e cammina dritto fino alla fossa.
          pe: { resilienza: 5 }
          segue: la-fossa-grande

  - id: la-fossa-grande
    immagine: ambientazione/cimitero-di-qir-azel
    titolo: La fossa grande
    tipo: seguito
    luogo: Cimitero di Qir-Azel, le fosse comuni della razzia, di notte
    area: citta-bassa
    requisiti: [cimitero.registri == 0]
    testo: |
      È una ragazza sui vent'anni, con uno scialle scuro sopra il grembiule e
      le mani rosse delle lavandaie. Si siede sulla terra della fossa grande
      con la lanterna accesa e una pipa di gesso davanti, e racconta alla
      terra dei prezzi del sapone con il tono che si usa a cena quando l'altro
      è stanco. Quando ti avvicini salta in piedi e afferra la lanterna come
      se volesse tirartela.

      Si chiama Tilde Sarne. Suo padre conciava pelli per la Conceria Kasselt
      ed è morto in piazza la sera del Festival, e il Velo le ha detto che è
      qui, ma il garzone il suo nome non l'ha trovato. Sua madre è sepolta
      dall'altra parte del cimitero, sotto una tavoletta che il padre aveva
      inciso da sé, e Tilde voleva metterli vicini.

      Alle tue spalle, al buio, scricchiola il manico della pala di Gundo.
    opzioni:
      - testo: "Portarle il registro con il nome"
        descrizione: "Nella cappella dei Vardesi Gundo ha la penna pronta, e un nome scritto è un posto."
        esito:
          titolo: Fossa grande, lato muro
          testo: |
            Torni dalla cappella con il registro aperto, dove Gundo ha scritto con
            la sua grafia minuta *Teodo Sarne, conciatore, fossa grande, lato
            muro, il quarto*. Tilde legge la riga con l'indice, muovendo le labbra
            sul nome del padre, e quando chiede se può tornare di giorno le
            rispondi di sì. La notte dopo nessuno scavalca dal bosso, e la pipa di
            gesso è piantata nella terra dal lato del muro.
          pe: { empatia: 5 }
          imposta: { cimitero.registri: 1 }
          effetti: { rep.cimitero: 1 }

      - testo: "Aiutarla a riportarlo accanto alla moglie"
        descrizione: "Cercare di notte un uomo fra cinquanta in una fossa comune si può fare, dice Gundo, ma costa."
        prova: { attributo: mentale, abilita: [medicina, percezione], difficolta: Media }
        successo:
          titolo: Il grembiule di cuoio
          testo: |
            Gundo segna il punto con la pala, e scavate in tre fino alle prime luci
            con un fazzoletto bagnato d'aceto sulla bocca. Riconosci Teodo dal
            grembiule di cuoio indurito dal fuoco e dalle mani macchiate di
            tannino. Lo portate su una barella fino alla tavoletta della moglie,
            dove Gundo apre la fossa accanto, e all'alba Tilde ci rimette sopra la
            pipa. Ti lavi le mani tre volte, e l'odore resta.
          pe: { medicina: 5 }
          imposta: { cimitero.registri: 1 }
          effetti: { rep.cimitero: 1, tormento: 1.5 }
        fallimento:
          titolo: Fra cinquanta
          testo: |
            Scavate fino alle prime luci con l'aceto sulla bocca, ma sotto la
            terra i morti della razzia sono stretti l'uno all'altro e quelli
            bruciati si somigliano tutti. Né tu né Tilde riuscite a dire quale sia
            Teodo. Richiudete la terra, e Tilde scrive il nome del padre su un
            sasso e lo lascia lì.
          imposta: { cimitero.registri: 1 }
          effetti: { rep.cimitero: 1, tormento: 1.5 }

      - testo: "Convincerla a lasciarlo con gli altri"
        descrizione: "Nella fossa grande ci sono cinquanta vicini della sua piazza, e forse a suo padre la compagnia non dispiace."
        prova: { attributo: sociale, abilita: [empatia, persuasione], difficolta: Media }
        successo:
          titolo: La prima tavoletta
          testo: |
            Le dici che suo padre è morto con la sua piazza, e che nella fossa grande ci sono i vicini con cui
            beveva la sera. Tilde ci pensa girando la pipa fra le mani, poi chiede se può mettere una tavoletta con
            il nome anche sopra una fossa comune, e Gundo, dal buio, dice di sì. La settimana dopo sulla fossa
            grande le tavolette sono quattro.
          pe: { persuasione: 5 }
          imposta: { cimitero.registri: 1 }
          effetti: { rep.cimitero: 1 }
        fallimento:
          titolo: Lo scialle stretto
          testo: |
            Le dici che suo padre sta bene dov'è, con la sua piazza, e lei si
            stringe lo scialle e ti risponde che i vicini non l'hanno mai chiamato
            per nome. Raccoglie la pipa e se ne va dal cancello, che Gundo le apre
            senza farsi vedere, e nel quaderno nero le notti dopo il bosso resta
            vuoto. Gundo scrive il nome di Teodo nel registro lo stesso.
          imposta: { cimitero.registri: 1 }
          effetti: { rep.cimitero: 1, scandalo: 0.5 }

  # ------------------------------------------------------------ storia a 6 · le chiavi del cimitero
  - id: le-chiavi-del-cimitero
    presso: cimitero-di-qir-azel
    immagine: personaggi/gundo-marl
    titolo: Le chiavi del cimitero
    sommario: "Gundo Marl ha un anello con due chiavi, e prima di dartele vuole insegnarti dove non si scava."
    luogo: Cimitero di Qir-Azel, di notte
    area: citta-bassa
    requisiti: [rep.cimitero >= 6, cimitero.custode == 0, cimitero.lapide >= 1]
    testo: |
      Gundo ti aspetta fuori dalla cappella dei Vardesi, in mezzo al vialetto sotto la luna, appoggiato alla pala come a un
      bastone. Dall'altra mano gli pende un anello di ferro con due chiavi, una grande per il cancello nord e una piccola, unta
      d'olio, per il capanno degli attrezzi.

      «Di giorno qui serve qualcuno che apra il cancello e sappia rispondere a un prete, e il ragazzo con quella tosse non ce la
      fa» dice, facendo tintinnare l'anello. «Le chiavi però le do a chi sa dove non scavare. In questo cimitero ci sono più
      morti che lapidi, e alcuni li ho messi giù io dove il Velo non guarda. Domattina c'è da aprire una fossa per una lavandaia
      dei Ponti, e il posto stanotte lo scegli tu. Se scegli male, la pala tocca uno che non va toccato.»

      {intimidire Media} Un vecchio con la pala che ti dice dove sono i morti non ha bisogno di alzare la voce.

      Si avvia zoppicando per il vialetto, e la pala batte sulla ghiaia a ogni passo. *Venticinque anni di fosse, e la mappa ce
      l'ha soltanto in testa.* Senza volerlo cominci a contare i passi dal cancello.
    opzioni:
      - testo: "Leggere il terreno"
        descrizione: "Dove la terra è stata mossa l'erba cresce in un altro modo, anche dopo vent'anni."
        prova: { attributo: mentale, abilita: [percezione, natura], difficolta: Media }
        successo:
          titolo: L'erba
          testo: |
            Cammini chino fra le tombe con la lanterna bassa. Dove qualcuno ha
            scavato l'erba è più verde e la terra appena più bassa, e in certi
            punti il trifoglio disegna un rettangolo. Ne trovi sei fra le lapidi
            della fila nuova, e il settimo posto, vicino al cipresso più storto,
            ha la terra dura e l'erba uguale a quella intorno. Gundo ci pianta la
            pala e annuisce.
          pe: { percezione: 5 }
          segue: il-mazzo-di-chiavi
        fallimento:
          titolo: Il trifoglio
          testo: |
            Cerchi le differenze nell'erba e alla fine scegli un posto vicino al
            cipresso più storto. Gundo ci pianta la pala, poi la ritira. «Qui
            sotto c'è una donna dei Ponti, dal centotrenta» dice. «Non l'ha mai
            cercata nessuno, e non comincio io a disturbarla.» Le chiavi tornano
            nella tasca della sua tunica.
          effetti: { tormento: 0.5 }

      - testo: "Studiare il registro di Gundo"
        descrizione: "In venticinque anni di righe minute, chi mette i morti dove il Velo non guarda lascia qualcosa sulla carta."
        prova: { attributo: mentale, abilita: accademiche, difficolta: Media }
        successo:
          titolo: I cerchietti
          testo: |
            Alla luce della candela trovi, in margine a certe pagine, un
            cerchietto minuscolo senza nome accanto, ventitré in venticinque anni,
            ognuno vicino alla riga di una fossa vera. Li riporti fila per fila su
            un foglio e scegli un posto lontano da tutti. Gundo guarda il foglio,
            poi lo brucia sulla candela e ti dice che il posto va bene.
          pe: { accademiche: 5 }
          segue: il-mazzo-di-chiavi
        fallimento:
          titolo: Le righe minute
          testo: |
            Sfogli il registro finché le righe minute ti ballano davanti agli
            occhi, e scegli un posto di cui il registro non parla. Gundo scuote la
            testa. «Dove il registro non dice niente è proprio dove guardare»
            dice, e ti riprende il libro dalle mani come si toglie un coltello a
            un bambino, e le chiavi restano a lui.
          effetti: { tormento: 0.5 }

      - testo: "Chiedere al garzone dove il vecchio non lo faceva scavare"
        descrizione: "Qualche volta Gundo avrà fermato il ragazzo, e certe tirate d'orecchie uno se le ricorda."
        prova: { attributo: sociale, abilita: [empatia, conoscenze-della-strada], difficolta: Media }
        successo:
          titolo: Le tirate d'orecchie
          testo: |
            Il garzone si gratta la testa sotto il berretto, poi ti porta in giro
            per il cimitero e ti mostra i posti dove il vecchio lo prendeva per
            l'orecchio e lo tirava via, molti più di quanti ne avresti trovati da
            solo, e a ogni posto si tocca l'orecchio senza accorgersene. Gundo
            ascolta l'elenco e corregge un posto solo. «Il ragazzo ha buona
            memoria, quando gli fa comodo» dice.
          pe: { empatia: 5 }
          segue: il-mazzo-di-chiavi
        fallimento:
          titolo: Il berretto
          testo: |
            Il garzone dice che il vecchio lo tirava per l'orecchio dappertutto, e che quindi dappertutto
            è un posto dove non si scava, e ci ride sopra fino a tossire. Torni da Gundo con le mani
            vuote, e per stanotte il posto lo sceglie lui, e le chiavi restano nella sua tasca.
          effetti: { sospetto: 0.5 }

      - testo: "Sondare il terreno con il ferro"
        descrizione: "Dove la sbarra di ferro affonda senza fatica, qualcuno ha già scavato."
        prova: { attributo: fisico, abilita: [resistenza, atletica], difficolta: Media }
        successo:
          titolo: Cento colpi
          testo: |
            Pianti la sbarra per tutta la fila nuova. Dove la terra è vergine si
            ferma a un palmo, dove è già stata scavata scende fino al pugno, e
            segni ogni punto con un sasso. All'alba la fila è piena di sassi
            tranne un rettangolo vicino al cipresso storto, e Gundo ti dice che ci
            hai messo una notte a fare quello che lui fa con gli occhi.
          pe: { resistenza: 5 }
          segue: il-mazzo-di-chiavi
        fallimento:
          titolo: Le spalle
          testo: |
            A metà notte le spalle non ti rispondono più, e la sbarra si incastra
            fra due radici. All'alba hai segnato mezza fila, e Gundo sceglie il
            posto da solo in un momento, senza guardare i tuoi sassi, mentre le
            chiavi restano nella sua tasca.
          effetti: { ferite: 0.5 }

      - testo: "Farti accompagnare da Gundo per tutta la notte"
        descrizione: "Lui sa dove sono tutti, e basta camminargli accanto e ascoltare."
        quando: [pista.pelle < 6]
        costo: 2
        esito:
          titolo: La pala in terra
          testo: |
            Gundo cammina piano davanti a te fra le tombe e ogni tanto batte la
            pala in terra. «Qui no» dice, e qualche passo più in là: «Qui sì.» Chi
            c'è sotto non lo dice, e tu per tutta la notte non lo chiedi. All'alba
            ti fermi tu, vicino al cipresso più storto, e batti in terra con il
            tacco. Gundo guarda prima il punto e poi te, e annuisce.
          pe: { resilienza: 5 }
          segue: il-mazzo-di-chiavi

      - testo: "Farti accompagnare da Gundo per tutta la notte"
        descrizione: "Lui sa dove sono tutti, anche i morti della notte della Pignatta."
        quando: [pista.pelle >= 6]
        costo: 2
        esito:
          titolo: Puntuale
          testo: |
            Gundo cammina davanti a te fra le tombe battendo la pala in terra per
            dire qui sì o qui no. Lungo il muro di levante si ferma davanti alla
            tavoletta di Mirko Vesh e la raddrizza con due dita. «I funerali dei
            suoi uomini li ha sempre pagati in anticipo» dice. All'alba ti fermi
            tu vicino al cipresso storto e batti in terra con il tacco, e Gundo
            annuisce.
          pe: { resilienza: 5 }
          segue: il-mazzo-di-chiavi

      - testo: "Dirgli che non è il momento"
        descrizione: "Le chiavi di un cimitero sono un impegno lungo. Gundo sa aspettare meglio di chiunque."
        costo: 0
        esito:
          titolo: Nella tasca della tunica
          testo: |
            Gli dici che per adesso preferisci aiutare il ragazzo senza le chiavi
            in tasca. Gundo si rimette l'anello in tasca e torna zoppicando verso
            la cappella, ma sulla soglia si volta a dirti che la lavandaia la
            seppellisce lui. «La prossima la scegli tu, quando vuoi.»

  - id: il-mazzo-di-chiavi
    immagine: personaggi/gundo-marl
    titolo: Il mazzo di chiavi
    tipo: seguito
    luogo: Cimitero di Qir-Azel, il capanno degli attrezzi, all'alba
    area: citta-bassa
    requisiti: [cimitero.custode == 0]
    testo: |
      Il cielo sopra il muro di levante comincia a schiarire quando Gundo ti
      porta al capanno degli attrezzi. Il garzone sta già scavando nel posto
      che hai scelto, e la terra che viene su è gialla e pulita. Gundo resta
      dietro la porta socchiusa, dove non lo vedono né il ragazzo né chi passa
      per la strada.

      Ti mette l'anello di ferro nel palmo e te lo chiude dentro la mano con le
      sue dita lunghe e fredde. «Il cancello si apre alla prima campana e si
      chiude al tramonto» dice alle chiavi. «Le righe del registro le firmi con
      le tue iniziali scritte piccole, e di notte io ci ripasso sopra. Se un
      prete chiede del becchino gli dici che il registro è in ordine, ed è la
      verità.» Si tocca l'amuleto dell'Albero. «Se le chiavi non le vuoi, le
      appendo al chiodo nella cappella, e la prova te la faccio rifare quando
      le vorrai.»

      {empatia Difficile} Ti sta consegnando venticinque anni parlando di
      orari, il solo modo che ha di farlo senza che gli si incrini la voce.

      Dalla fossa il garzone si toglie il berretto e ti saluta, con la terra
      gialla fino ai gomiti.
    opzioni:
      - testo: "Prendere le chiavi"
        descrizione: "Il cancello nord e il capanno degli attrezzi. Di giorno il cimitero risponde a te."
        esito:
          titolo: L'olio sulle dita
          testo: |
            Chiudi la mano sulle chiavi, e quella del capanno ti lascia l'olio
            sulle dita. Gundo apre il registro sul barile della calce e scrive in
            fondo alla pagina il tuo nome, e accanto *custode di giorno*. Poi ti
            stringe la mano una volta sola senza guardarti, e quando ti volti per
            ringraziarlo lo vedi già sparire fra i cipressi verso la cappella dei
            Vardesi.
          imposta: { cimitero.custode: 1 }
          effetti: { rep.cimitero: 1 }
      - testo: "Rendergli le chiavi"
        descrizione: "Per adesso preferisci restare uno che dà una mano, e Gundo capirà, il ragazzo forse no."
        esito:
          titolo: Il chiodo nella cappella
          testo: |
            Gli rendi l'anello, e Gundo lo soppesa sul palmo come se contasse le
            chiavi prima di metterselo nella tasca della tunica. «Al chiodo nella
            cappella» dice. «Quando le vuoi, la prova la rifacciamo.» Dalla fossa
            il garzone ti guarda, e si rimette il berretto più lentamente del
            solito.

  # ------------------------------------------------------------ la carta
  - id: carta-un-funerale-povero
    immagine: ambientazione/citta-bassa
    titolo: Un funerale povero
    sommario: "Sulla strada del cimitero un carretto con una cassa di assi si è piantato nel canaletto."
    luogo: Città Bassa, la strada del cimitero
    tipo: carta
    area: citta-bassa
    requisiti: [rep.cimitero < 2]
    testo: |
      Sulla strada che scende al cimitero la ruota di un carretto è finita nel canaletto
      di scolo, e la cassa d'abete è scivolata di traverso. Alle stanghe tirano una donna
      e un ragazzino con una tavoletta incisa a coltello sotto il braccio. La gente passa
      rasente al muro, e un ciabattino sulla soglia batte la suola più forte, come per
      coprire il rumore della ruota.

      {origine rampollo-dei-quartieri-alti} Ai funerali della tua famiglia la cassa la
      portano sei uomini in livrea, e nessuno l'ha mai vista inclinarsi.

      La donna si asciuga la fronte e ti guarda senza chiederti niente.
    opzioni:
      - testo: "Spingere il carretto fino al cimitero"
        descrizione: "Una ruota nel canaletto e una cassa di traverso, e ci vogliono due braccia in più."
        esito:
          titolo: Fino al cancello
          testo: |
            Sollevi la ruota dal canaletto con la spalla mentre la donna tiene
            ferma la cassa, e spingi il carretto fino in fondo alla strada. Al
            cancello vi aspetta un garzone con un berretto troppo grande, che
            prende le stanghe tossendo, ti guarda bene in faccia e ti dice che al
            capanno degli attrezzi due braccia in più servono sempre.
          pe: { atletica: 2 }
          effetti: { rep.cimitero: 0.5 }
      - testo: "Lasciare i soldi per la tavoletta"
        descrizione: "Una tavoletta incisa a coltello marcisce in tre inverni, e con poche monete se ne mette una di quercia."
        requisiti: [monete >= 2]
        esito:
          titolo: Quercia
          testo: |
            Metti qualche moneta nella mano della donna e le dici che al cimitero
            con quei soldi le danno una tavoletta di quercia, che dura di più. Lei
            ti ringrazia e le tiene, ma mentre la aiuti a tirare fuori la ruota il
            ragazzo ti dice che il nome l'ha inciso lui, e che la tavoletta resta
            quella.
          pe: { empatia: 2 }
          effetti: { monete: -2 }
      - testo: "Tirare dritto"
        descrizione: "Hai i tuoi morti a cui pensare, e la strada è lunga."
        costo: 0
        esito:
          titolo: Rasente al muro
          testo: |
            Passi rasente al muro come gli altri, e alle tue spalle senti la ruota
            che esce dal canaletto con un tonfo. Quando ti volti all'angolo il
            ciabattino ha lasciato la soglia e spinge il carretto insieme alla
            donna, e tu ti senti le orecchie calde per un bel pezzo di strada.

      - testo: "Dire la preghiera dei morti sulla strada"
        descrizione: "Una preghiera del Velo detta a voce alta arriva fino in fondo alla via, e chi passa la conosce."
        quando: [origine.accolito-del-velo >= 1]
        esito:
          titolo: Il ciabattino
          testo: |
            Cominci a voce alta la preghiera dei morti come la diresti in Cattedrale,
            e la voce rimbalza sul muro di fronte più forte di quanto volevi. La donna
            china la testa, e al secondo verso il ciabattino si alza dalla soglia e
            viene a mettere la spalla contro la cassa, e dietro di lui due facchini.
            Il carretto arriva al cimitero con la preghiera ancora a metà.
          pe: { resilienza: 2 }
          effetti: { rep.cimitero: 0.5 }
