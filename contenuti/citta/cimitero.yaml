# La città viva, luogo 11: il Cimitero di Qir-Azel (presso: cimitero-di-qir-azel, area citta-bassa).
# L'attività delle fosse, le tre storie di rep.cimitero (2 la lapide senza nome, con il seguito dell'incontro
# con Gundo; 4 i registri di Gundo, con il seguito della fossa grande; 6 le chiavi del cimitero, con il seguito
# del mazzo di chiavi) e la carta del funerale povero. Il servizio del luogo è il lavoro stesso: le fosse, i
# registri, i funerali, e con le chiavi (cimitero.custode) il cancello da aprire all'alba.
# Gundo Marl è sparito la notte della razzia (sepolcro-1.yaml, sepolcro-2.yaml, dama-argento-2.yaml), e per la
# città resta sparito per tutto il Capitolo I. In questo file è vivo e si nasconde: di notte lavora nella
# cappella dei Vardesi e tiene il registro degli accessi (Codex, Cimitero 2.2), di giorno il cimitero lo tiene il
# garzone delle fosse. Il giocatore lo scopre con la storia a 2; dove sia stato quella notte non lo dice.
# Reputazione: le storie la portano a 3, 5 e 7. Fosse, registri e famiglie povere (fisico, mentale, sociale) la
# fanno salire fino a 4; i morti da lavare, i funerali dei Quartieri Alti e le bare nelle cappelle (mentale,
# sociale, fisico, tutte Media) fino a 6.
# Stato del mondo: le fosse della notte della Pignatta e la tavoletta di Mirko Vesh (pagata da Galdrick) dopo
# pista.pelle >= 6; Ondrel nella cappella dei Tarvelin dopo pista.acciaio >= 8; Isvaro sepolto fuori dalla
# cappella con isvaro == 3 (anche lui da pista.acciaio >= 8, a funerali fatti). Le varianti di stato del mondo
# e quelle che svelano Gundo vivo stanno in `quando`, così non compaiono chiuse prima del tempo.
# Nomi nuovi, che il Codex non dà: la cappella dei Vardesi (mercanti di sale estinti), Teodo Sarne (conciatore,
# morto nella razzia) e sua figlia Tilde.
storylet:
  # ------------------------------------------------------------ l'attività ripetibile
  - id: le-fosse-di-gundo
    presso: cimitero-di-qir-azel
    immagine: ambientazione/cimitero-di-qir-azel
    titolo: Le fosse di Gundo
    sommario: "Da quando il becchino è sparito il cimitero lo tiene un garzone con la tosse, e il lavoro non manca a nessuno."
    luogo: Cimitero di Qir-Azel, il capanno degli attrezzi
    area: citta-bassa
    ripetibile: true
    testo: |
      Il capanno degli attrezzi sta accanto al cancello nord, contro il muro
      di pietra blu. Dentro ci sono due carriole e le pale appese al muro in
      ordine di lunghezza, e in un angolo un
      barile di calce viva con il coperchio legato. Sulla porta qualcuno ha
      inchiodato una tavoletta con i turni della settimana, scritti in una
      grafia minuta e ordinata fino al giorno del Festival. Da lì in avanti la
      grafia diventa grossa e storta, e i giorni sono segnati con una croce per
      ogni fossa.

      Da quando Gundo Marl è sparito, la notte della razzia, il cimitero lo
      tiene il garzone delle fosse. Ha un berretto troppo grande e una tosse
      che lo piega in due, e di Gundo parla come del vecchio, quello che lo
      pagava il venerdì. La casetta del becchino, accanto al cancello, ha le
      imposte chiuse. Il garzone ci passa davanti ogni mattina con il rastrello
      in spalla e non la guarda mai.

      L'odore della terra smossa ti riporta a un orto, a una vanga più alta di
      te e a qualcuno che ti gridava di piegare le ginocchia. Il garzone ti
      vede sulla porta del capanno, si toglie il berretto e se lo rimette, e ti
      indica le pale con il mento.
    opzioni:
      - testo: "Scavare una fossa"
        descrizione: "Domattina c'è un funerale, e la fossa la scava chi ha le braccia buone. Il garzone, con quella tosse, non le ha."
        requisiti: [rep.cimitero < 2]
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Facile }
        successo:
          titolo: Lo spago
          testo: |
            Il garzone ti segna il rettangolo con quattro paletti e uno spago,
            e lo misura due volte. Scavi finché lo spago non ti passa sopra la
            testa, e la terra della Città Bassa viene su prima scura e poi
            gialla, piena di sassi che suonano contro la pala. A metà mattina
            hai le mani coperte di vesciche, e lui ti passa uno straccio
            bagnato. Alla fine scende a sondare il fondo con il manico della
            pala e ti conta qualche moneta nel palmo, tenendosi il berretto con l'altra mano.
          effetti: { monete: 2, rep.cimitero: 0.5 }
        fallimento:
          titolo: La parete che frana
          testo: |
            Scavi con troppa foga, e a metà la parete dal lato del vialetto ti
            frana addosso fino alle ginocchia. Il garzone ti tira fuori per un
            braccio tossendo, e poi passate un'ora a puntellare il lato con le
            assi. Alla fine la fossa è pronta, solo un poco più larga del
            necessario. Lui ti allunga uno spicciolo e dice che il morto non si
            lamenterà, perché il vecchio lo diceva di tutte le fosse storte.
          effetti: { monete: 1 }

      - testo: "Scavare una fossa"
        descrizione: "Il garzone ormai ti lascia le fosse delle famiglie che pagano, quelle con la cassa di quercia e il prete giusto."
        requisiti: [rep.cimitero >= 2, rep.cimitero < 4]
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Media }
        successo:
          titolo: Il filo a piombo
          testo: |
            La fossa è per una vedova dei Quartieri Alti, e la famiglia ha
            pagato perché le pareti vengano dritte come quelle di una stanza.
            Lavori con la squadra e il filo a piombo che il garzone ha trovato
            nel capanno, ancora avvolti nella carta oleata di Gundo. A
            mezzogiorno arriva il maggiordomo della famiglia a misurare con un
            bastone, e trova tutto in ordine. Ti lascia una buona mancia e
            se ne va pulendosi le scarpe sull'erba.
          effetti: { monete: 3, rep.cimitero: 0.5 }
        fallimento:
          titolo: La radice
          testo: |
            A due braccia di profondità la pala sbatte contro una radice di
            cipresso grossa come una coscia, e ci perdi il pomeriggio con
            l'accetta. Il maggiordomo della famiglia arriva a misurare quando
            sei ancora dentro fino alla vita, e se ne va scuotendo la testa. Il
            garzone finisce la fossa con te alla luce della lanterna. La paga
            della famiglia la tiene lui, perché la fossa era sua.

      - testo: "Copiare i registri funebri"
        descrizione: "Il garzone scrive grosso e storto, e nelle pagine dopo la razzia ha messo i morti dove capitava. Qualcuno deve rifarle in bella copia."
        requisiti: [rep.cimitero < 4]
        quando: [cimitero.lapide == 0]
        prova: { attributo: mentale, abilita: accademiche, difficolta: Media }
        successo:
          titolo: In bella copia
          testo: |
            Ti siedi sulla soglia del capanno con il registro sulle ginocchia e
            un quaderno nuovo, pagato dal Velo. Le pagine del garzone sono un
            elenco di nomi con una croce accanto, e a volte la stessa persona
            compare due volte con il cognome scritto in due modi. Rimetti ogni
            morto nella sua riga con accanto il giorno e la fossa. Il garzone
            legge la copia muovendo le labbra, poi ti paga la copia e
            sottolinea due volte il tuo nome in fondo alla pagina.
          effetti: { monete: 2, rep.cimitero: 0.5 }
        fallimento:
          titolo: Due fratelli
          testo: |
            Ricopi tre pagine con la grafia più chiara che hai, e a metà della
            quarta ti accorgi di aver messo nella stessa fossa due fratelli che
            il garzone aveva scritto in due fosse diverse. Uno dei due aveva
            ragione, e non sai quale. Il garzone si gratta la testa sotto il
            berretto e ti dice di lasciare la riga in bianco, così almeno non è
            sbagliata. Ti paga uno spicciolo per la carta.
          effetti: { monete: 1 }

      - testo: "Copiare i registri con Gundo"
        descrizione: "Di notte, nella cappella dei Vardesi, Gundo rifà le pagine del garzone con la sua grafia minuta. Una seconda penna gli fa comodo."
        immagine: personaggi/gundo-marl
        requisiti: [rep.cimitero < 4]
        quando: [cimitero.lapide >= 1]
        prova: { attributo: mentale, abilita: accademiche, difficolta: Media }
        successo:
          titolo: Due penne
          testo: |
            Gundo ti fa sedere dall'altra parte del sarcofago, con una candela
            in mezzo, e ti detta dal registro del garzone senza guardarti. Lui
            ricopia i nomi e tu i giorni e le fosse. Quando sbagli una data te
            lo dice senza alzare la testa, prima ancora che l'inchiostro si sia
            asciugato. Verso l'alba chiude il registro e ti mette in mano le
            monete, contate una alla volta. «Puntuale» dice, senza alzare la
            testa, e capisci che parla di te.
          effetti: { monete: 3, rep.cimitero: 0.5 }
        fallimento:
          titolo: La riga saltata
          testo: |
            Gundo ti detta i giorni e le fosse, e tu scrivi finché la candela
            si consuma fino al piattino. A un certo punto salti una riga
            intera senza accorgertene, e con lei una donna morta il terzo giorno
            dopo la razzia. Gundo rifà la pagina da capo senza commentare, con
            le dita lunghe che non tremano. Prima dell'alba ti dà uno spicciolo e
            ti manda a dormire.
          effetti: { monete: 1 }

      - testo: "Accompagnare una famiglia povera"
        descrizione: "Una famiglia della Città Bassa seppellisce un vecchio senza prete e senza soldi. Qualcuno deve stare con loro finché la terra è chiusa."
        requisiti: [rep.cimitero < 4]
        quando: [pista.pelle < 6]
        prova: { attributo: sociale, abilita: [empatia, galateo], difficolta: Media }
        successo:
          titolo: La lettera sbagliata
          testo: |
            Sono una donna con due figli e un cane che nessuno ha pensato di
            lasciare a casa. Il morto è il padre di lei, un facchino dei Ponti,
            dentro una cassa di assi d'abete. Lo calate insieme, e quando la
            donna non riesce a dire niente leggi tu le due righe della Liturgia
            che il garzone tiene scritte su un foglio nel capanno. Il figlio più
            grande incide il nome sulla tavoletta con il tuo coltello. Sbaglia
            una lettera e la lascia com'è, e la madre gli passa una mano sulla
            testa.
          effetti: { rep.cimitero: 0.5 }
        fallimento:
          titolo: Il riposo meritato
          testo: |
            Davanti alla fossa provi a dire qualcosa, e ti escono le parole che
            si dicono ai funerali dei ricchi, quelle sul giardino dell'Albero e
            sul riposo meritato. La donna ti guarda con gli occhi asciutti e
            dice che suo padre del riposo non ne voleva sapere. I figli calano
            la cassa da soli. A te resta da tenere il cane per il collare, ed è
            l'unica cosa che ti lasciano fare.

      - testo: "Accompagnare una famiglia povera"
        descrizione: "Dopo la notte della Pignatta ci sono morti che in Città Bassa nessuno vuole portare a spalla. Le famiglie li seppelliscono lo stesso."
        requisiti: [rep.cimitero < 4]
        quando: [pista.pelle >= 6]
        prova: { attributo: sociale, abilita: [empatia, galateo], difficolta: Media }
        successo:
          titolo: Uno di quelli di Vesh
          testo: |
            Il morto era uno di quelli di Vesh, e lo sanno tutti. Al funerale ci
            sono la madre e una sorella, e al cancello tre vicini si sono
            fermati a guardare senza entrare. Prendi un capo della cassa, la
            sorella prende l'altro, e la portate fino alla fila nuova in fondo
            al muro. La madre non piange finché i vicini non se ne vanno. Poi ti
            chiede se lo conoscevi. Le dici di no. Lei annuisce e resta in
            piedi davanti alla tavoletta con il nome finché il garzone non
            comincia a chiudere la terra.
          effetti: { rep.cimitero: 0.5 }
        fallimento:
          titolo: I vicini
          testo: |
            Il morto era uno di quelli di Vesh. Al cancello tre vicini aspettano
            che la cassa passi per sputare per terra, e tu ti metti in mezzo con
            le parole sbagliate. Uno dei tre ti risponde, e la lite va avanti
            finché la madre del morto ti prende per la manica e ti chiede per
            favore di smettere. La cassa la portano piano lei e il garzone,
            mentre tu resti al cancello insieme ai vicini.

      - testo: "Fare la veglia contro i ladri di tombe"
        descrizione: "Dopo la razzia c'è chi scavalca il muro di notte per prendere gli anelli ai morti freschi. Il garzone, al buio, ha paura."
        quando: [cimitero.lapide == 0]
        prova: { attributo: fisico, abilita: furtivita, difficolta: Media }
        successo:
          titolo: La zappetta
          testo: |
            Ti apposti dietro una cappella con il mantello sulla testa e
            aspetti. Verso mezzanotte un ragazzo magro scavalca dal punto del
            bosso spezzato, con una zappetta in mano, e va dritto alle fosse
            nuove. Gli arrivi alle spalle senza un rumore e lo prendi per il
            colletto. Ha quattordici anni al massimo, e prima ancora di piangere
            ti dice a chi vende gli anelli. Il garzone lo conosce e lo rimanda a
            casa con un calcio nel sedere.
          effetti: { monete: 2, informazioni.voce: 1 }
        fallimento:
          titolo: Il gatto senza coda
          testo: |
            Ti apposti dietro una cappella e per ore senti soltanto il vento fra
            i cipressi. Quando qualcosa si muove fra le tombe ti alzi di scatto,
            inciampi in una tavoletta di legno e finisci lungo disteso sulla
            ghiaia. È il gatto senza coda della vecchia che abita accanto al
            muro. Se c'era un ladro, a quel punto è già lontano, e la mattina
            dopo il garzone ti paga la notte a metà.
          effetti: { monete: 1 }

      - testo: "Fare la veglia con Gundo"
        descrizione: "Gundo veglia dalla grata della cappella dei Vardesi e scrive chi entra. Due occhi in più vedono anche il tratto di muro che lui non vede."
        immagine: personaggi/gundo-marl
        quando: [cimitero.lapide >= 1]
        prova: { attributo: mentale, abilita: percezione, difficolta: Media }
        successo:
          titolo: Il quaderno nero
          testo: |
            Ti siedi al buio con Gundo dietro la grata della cappella e guardi
            il muro dal bosso spezzato fino al cancello. Verso le due vedi
            un'ombra sulla cresta del muro e la indichi senza parlare. È una
            ronda del Velo, due monaci con una lanterna schermata, che fanno il
            giro e se ne vanno. Gundo li scrive nel quaderno nero con l'ora
            esatta, e sotto scrive una cosa che uno dei due ha detto all'altro.
            All'alba ti paga il turno e ti lascia leggere la riga.
          effetti: { monete: 2, informazioni.voce: 1 }
        fallimento:
          titolo: La testa contro la pietra
          testo: |
            Ti siedi con Gundo dietro la grata della cappella, e verso le tre ti
            svegli con la testa contro la pietra. Gundo è nella posizione di
            prima, con il quaderno aperto sulle ginocchia. Ti dice che nel
            frattempo sono passati una volpe e due monaci del Velo, e che li ha
            scritti tutti. Quella notte non ti paga, però ti lascia restare fino
            all'alba accanto a lui.

      - testo: "Rastrellare i vialetti"
        descrizione: "Il garzone passa il rastrello ogni mattina, anche dove non va più nessuno. Oggi il rastrello lo prendi tu."
        quando: [pista.acciaio < 8]
        esito:
          titolo: La tazza sbeccata
          testo: |
            Il garzone ti dà il rastrello e ti indica i vialetti, dal cancello
            fino alle fosse comuni della razzia. Lì la terra è ancora scura, e
            sopra le famiglie hanno lasciato quello che avevano, un fiore di
            carta dentro una tazza sbeccata e, su una delle fosse, un berretto
            da guardia. Rastrelli intorno senza toccare niente. Quando hai
            finito il garzone passa a controllare e raddrizza il berretto, che
            il vento aveva girato di traverso.
          pe: { resilienza: 2 }

      - testo: "Rastrellare i vialetti"
        descrizione: "Dopo la notte della Pignatta il garzone ha aperto una fila nuova lungo il muro. Anche lì la ghiaia va tenuta in ordine."
        quando: [pista.pelle >= 6]
        esito:
          titolo: La fila nuova
          testo: |
            Lungo il muro di levante il garzone ha aperto una fila nuova per i
            morti della notte della Pignatta che nessuno è venuto a reclamare.
            In fondo c'è una tavoletta di legno con il nome di Mirko Vesh inciso
            a coltello, senza date. Il garzone ti dice a voce bassa che l'hanno
            sepolto con l'anello d'argento al mignolo, l'unico che era suo, e
            che la tavoletta l'ha pagata lo sceriffo una mattina presto,
            chiedendo di non scriverlo sul registro. Rastrelli anche intorno a
            quella tavoletta, come dappertutto.
          pe: { resilienza: 2 }

      - testo: "Rastrellare i vialetti"
        descrizione: "Davanti alla cappella dei Tarvelin la ghiaia è tutta smossa. Al funerale c'era più gente che a una seduta del Consiglio."
        quando: [pista.acciaio >= 8, pista.pelle < 6, isvaro != 3]
        esito:
          titolo: La cappella dei Tarvelin
          testo: |
            La cappella dei Tarvelin è addossata al muro, con il portale di
            ferro battuto e un'incudine scolpita sopra l'architrave. Da qualche
            settimana dentro c'è anche Ondrel, accanto alla moglie. Il garzone
            ti racconta che al funerale c'erano più uomini della Gilda che
            parenti, e che Liaren è arrivata per ultima ed è andata via per
            prima. Rastrelli la ghiaia davanti al portale, dove gli stivali
            della Gilda hanno lasciato i solchi dei tacchi.
          pe: { resilienza: 2 }

      - testo: "Rastrellare i vialetti"
        descrizione: "Accanto alla cappella dei Tarvelin c'è una pietra nuova, fuori dal portale. Il garzone ci passa con il rastrello più piano che altrove."
        quando: [pista.acciaio >= 8, pista.pelle < 6, isvaro == 3]
        esito:
          titolo: Fuori dal portale
          testo: |
            La cappella dei Tarvelin è addossata al muro, con un'incudine
            scolpita sopra l'architrave, e dentro c'è Ondrel accanto alla
            moglie. Isvaro invece è sepolto fuori, nella terra a destra del
            portale, sotto una pietra che porta soltanto il nome. Il garzone
            dice che al suo funerale c'erano lui e il prete, e che il prete ha
            letto in fretta. Intorno alla pietra passi il rastrello due volte,
            con più cura che davanti al portale.
          pe: { resilienza: 2 }

      - testo: "Lavare e vestire i morti"
        descrizione: "Nella cella di pietra i morti aspettano di essere lavati e vestiti. Il garzone vuole che si faccia come faceva il vecchio, anche per quelli che nessuno reclama."
        requisiti: [rep.cimitero >= 4, rep.cimitero < 6]
        prova: { attributo: mentale, abilita: medicina, difficolta: Media }
        successo:
          titolo: La segatura
          testo: |
            Nella cella di pietra c'è un uomo gonfio e senza nome, trovato
            annegato nel canale del cristallo. Lo lavi con l'acqua e l'aceto, gli
            leghi la mascella con una benda sotto il mento e gli cerchi addosso
            qualcosa che dica chi era. Sotto l'unghia del pollice c'è segatura
            chiara, e sul palmo il callo della sega a due mani. Il garzone porta
            la notizia alla Segheria, e prima di sera un uomo viene a
            riconoscerlo e paga il funerale. Il garzone divide la paga con te.
          effetti: { monete: 3, rep.cimitero: 0.5 }
        fallimento:
          titolo: L'aceto
          testo: |
            Nella cella di pietra c'è un annegato del canale che nessuno ha
            ancora reclamato. L'odore ti prende allo stomaco alla prima secchiata, e
            devi uscire due volte a respirare fra i cipressi. Lo lavi lo stesso
            come puoi. Addosso non gli trovi niente che dica chi era, e il
            garzone lo registra fra gli ignoti con la sua grafia grossa. A te dà
            uno spicciolo e un sorso d'acquavite.
          effetti: { monete: 1 }

      - testo: "Fare da cerimoniere a un funerale ricco"
        descrizione: "Le famiglie dei Quartieri Alti vogliono qualcuno che sappia dove mettere i parenti e quando far tacere i becchini. Il garzone non è adatto."
        requisiti: [rep.cimitero >= 4, rep.cimitero < 6]
        prova: { attributo: sociale, abilita: [galateo, espressivita], difficolta: Media }
        successo:
          titolo: L'ordine dei parenti
          testo: |
            Il morto è un mercante della Gilda, e alla cappella arrivano tre
            generazioni di parenti che non si parlano. Li metti in fila secondo
            un ordine che inventi lì per lì. I figli vanno davanti e la
            seconda moglie accanto al prete, dove nessuno dei figli può dirle
            niente. Annunci tu le corone una per una senza sbagliare un titolo. Alla fine il
            figlio maggiore ti paga bene e ti chiede se fai anche i
            matrimoni.
          effetti: { monete: 5, rep.cimitero: 0.5 }
        fallimento:
          titolo: La seconda moglie
          testo: |
            Il morto è un mercante della Gilda, e alla cappella arrivano tre
            generazioni di parenti che non si parlano. Metti la seconda moglie
            in prima fila, accanto ai figli della prima, e prima che il prete
            apra il libro la cappella si è già divisa in due. Passi il resto
            della cerimonia a tenere separati due cugini. Il figlio maggiore ti
            paga meno del previsto e dice che a suo padre sarebbe piaciuto.
          effetti: { monete: 2 }

      - testo: "Calare una bara in una cappella"
        descrizione: "Le cappelle delle famiglie ricche hanno scale strette e bare di pietra. Per calarle servono due corde e qualcuno che tenga il conto dei gradini."
        requisiti: [rep.cimitero >= 4, rep.cimitero < 6]
        prova: { attributo: fisico, abilita: [atletica, resistenza], difficolta: Media }
        successo:
          titolo: Sedici gradini
          testo: |
            La bara è di pietra chiara, e la scala della cappella ha sedici
            gradini consumati nel mezzo. La calate in quattro con due corde, tu
            in testa che cammini all'indietro e conti i gradini a voce alta,
            perché il garzone ti ha detto che Gundo faceva così. Al dodicesimo
            un facchino scivola, e per un momento la bara ti pesa tutta sulle
            spalle. Tieni duro, e in fondo la posate sul ripiano senza un
            graffio.
          effetti: { monete: 3, rep.cimitero: 0.5 }
        fallimento:
          titolo: Lo spigolo
          testo: |
            La bara è di pietra chiara, e la scala della cappella ha sedici
            gradini consumati nel mezzo. Al decimo perdi il conto, e con il
            conto il passo, e lo spigolo della bara picchia contro la parete e
            si scheggia. La famiglia vede la scheggia e decide che la colpa è
            del garzone. Lui non fa il tuo nome, e la paga ve la tagliano a
            metà a tutti e due.
          effetti: { monete: 1 }

      - testo: "Aprire il cancello all'alba"
        descrizione: "Le chiavi le hai tu. Di giorno il cimitero risponde a te, e di notte Gundo vuole sapere com'è andata."
        immagine: personaggi/gundo-marl
        quando: [cimitero.custode >= 1]
        prova: { attributo: mentale, abilita: [accademiche, percezione], difficolta: Media }
        successo:
          titolo: Le iniziali
          testo: |
            Apri il cancello alla prima campana e ricevi le famiglie una alla
            volta, con il registro sul braccio. Segni le fosse e chi le ha
            pagate, e firmi ogni riga con le tue iniziali, piccole, come ti ha
            insegnato lui. A mezzogiorno un monaco del Velo chiede del becchino,
            e gli rispondi senza mentire che il registro è in ordine. La sera,
            nella cappella dei Vardesi, Gundo controlla le tue righe e ti conta
            la paga sul coperchio del sarcofago.
          effetti: { monete: 7, informazioni.voce: 1 }
        fallimento:
          titolo: La riga storta
          testo: |
            Apri il cancello alla prima campana, e a metà mattina due famiglie
            si presentano per la stessa fossa con due ricevute diverse. Ci
            perdi il pranzo a capire chi ha ragione, e alla fine scrivi una
            riga storta che non ti piace. La sera Gundo la corregge con la sua
            grafia minuta e ti conta la paga lo stesso, fino all'ultima
            moneta.
          effetti: { monete: 5 }

      - testo: "Dire la preghiera sulle fosse senza nome"
        descrizione: "I morti che nessuno reclama il garzone li seppellisce da solo, senza prete. Il Velo ti ha insegnato le parole, e qui non le dice nessuno."
        quando: [origine.accolito-del-velo >= 1]
        requisiti: [rep.cimitero < 4]
        prova: { attributo: mentale, abilita: [accademiche, resilienza], difficolta: Media }
        successo:
          titolo: Le parole del Velo
          testo: |
            Il garzone ti aspetta alla fila lungo il muro con il berretto in mano, e
            per tutta la preghiera riesce a non tossire. Dici le parole del Velo su
            ogni fossa una alla volta. Dove la tavoletta non ha un nome dici quello
            che direbbe un fratello. Alla fine il garzone ti mette in mano qualche
            moneta della cassetta dei poveri e si scusa che siano poche. Nel registro,
            con la sua grafia storta, scrive *benedetta* accanto a ogni croce della
            settimana.
          effetti: { monete: 2, rep.cimitero: 0.5 }
        fallimento:
          titolo: La voce che si spezza
          testo: |
            Cominci la preghiera alla prima fossa, e alla terza la voce ti si spezza
            su una parola che in Cattedrale hai detto cento volte. Resti lì con la
            bocca aperta, mentre il garzone guarda per terra e aspetta. Finisci in un
            sussurro saltando un verso. Il garzone ti ringrazia lo stesso con tanta
            gentilezza che la faccia ti brucia per tutta la strada del ritorno.

  # ------------------------------------------------------------ storia a 2 · la lapide senza nome
  - id: la-lapide-senza-nome
    presso: cimitero-di-qir-azel
    immagine: ambientazione/cimitero-di-qir-azel
    titolo: La lapide senza nome
    sommario: "In fondo al cimitero c'è una lapide vecchia senza nome, e da qualche notte qualcuno la pulisce. Il garzone delle fosse non ci dorme più."
    luogo: Cimitero di Qir-Azel, la fila vecchia
    area: citta-bassa
    requisiti: [rep.cimitero >= 2, cimitero.lapide == 0]
    testo: |
      Il garzone ti aspetta al cancello con il berretto in mano, e invece di
      rimetterselo continua a rigirarlo fra le dita. Ti porta in fondo al
      cimitero, nella fila più vecchia, dove le lapidi sono di arenaria e il
      vento ha lisciato i nomi fino a lasciarne soltanto l'ombra. Una di queste
      un nome non l'ha mai avuto. È una pietra bassa senza date e senza
      l'Albero, con i licheni gialli grattati via a metà. Nel registro di
      Gundo la riga che le corrisponde è vuota.

      Da tre notti qualcuno se ne occupa. Stamattina la ghiaia intorno era
      rastrellata a spina di pesce, e ai piedi della pietra c'era un mozzicone
      di candela di sego ancora molle.

      «La spina di pesce io non la so fare» dice il garzone, e tossisce dentro
      il gomito. «La faceva il vecchio. E di notte qualcuno mi corregge anche
      le pagine del registro, con una grafia piccola piccola.» Guarda la
      casetta di Gundo con le imposte chiuse, poi guarda te. «Al Velo non lo
      dico. Mi rispondono che sono i morti, e poi al posto della paga mi
      mandano un prete.»

      *Un morto che corregge l'ortografia sarebbe un morto molto paziente.*
      Ti volti anche tu verso la casetta, e la nuca ti si raffredda.
    opzioni:
      - testo: "Fare la posta alla lapide"
        descrizione: "Chi viene di notte viene da qualche parte. Basta stare fermi abbastanza a lungo dietro il cipresso giusto."
        prova: { attributo: fisico, abilita: furtivita, difficolta: Media }
        successo:
          titolo: La lanterna schermata
          testo: |
            Ti sistemi dietro un cipresso storto con il mantello sulle spalle e
            aspetti. Dopo la seconda campana la grata di una cappella si apre
            senza cigolare, e ne esce una figura curva che zoppica, con una
            lanterna schermata e un rastrello. Si inginocchia davanti alla
            lapide senza nome e comincia a grattare i licheni con l'unghia. Ti
            avvicini piano, e lui non si volta nemmeno quando la ghiaia ti
            scricchiola sotto i piedi. «Sei quello che dà una mano al
            ragazzo» dice alla pietra, continuando a grattare, «e qui fuori ci
            vedono. Vieni dentro.»
          pe: { furtivita: 5 }
          segue: il-becchino-di-notte
        fallimento:
          titolo: Il ramo secco
          testo: |
            Ti sistemi dietro un cipresso e aspetti fino alla seconda campana,
            e quando senti un passo strascicato sulla ghiaia ti sporgi troppo.
            Sotto lo stivale ti si spezza un ramo secco. La lanterna in fondo
            alla fila si spegne subito, e per quanto cerchi fra le tombe non
            trovi nessuno. La mattina dopo la ghiaia intorno alla lapide è
            rastrellata di nuovo a spina di pesce, e il garzone ti guarda storto.

      - testo: "Confrontare le correzioni nel registro"
        descrizione: "Il garzone tiene il registro nel capanno. Le pagine vecchie sono di Gundo e quelle nuove sono sue, ma di notte qualcuno ci mette le mani."
        prova: { attributo: mentale, abilita: [accademiche, percezione], difficolta: Media }
        successo:
          titolo: Il sette barrato
          testo: |
            Metti una pagina vecchia accanto a una nuova. Chi corregge di notte
            scrive il sette con una barretta a metà e chiude le righe con un
            punto tondo, come nelle pagine di Gundo di dieci anni fa. A margine
            dell'ultima pagina c'è una nota fresca, *fossa diciannove, il nome
            si scrive con due elle*. Sotto la nota scrivi a matita che stanotte
            sarai alla lapide. Ci vai, e dopo la seconda campana la grata di una
            cappella poco lontana si apre senza cigolare.
          pe: { accademiche: 5 }
          segue: il-becchino-di-notte
        fallimento:
          titolo: Le due grafie
          testo: |
            Metti le pagine vecchie accanto alle nuove e le confronti fino a
            sera, e alla fine ti sembrano tutte della stessa mano minuta e
            ordinata. Il garzone ti guarda sfogliare con il berretto in mano e
            a un certo punto ti riprende il registro. Dice che se lo tocchi
            troppo il Velo se ne accorge, e lo rimette nel capanno sotto il
            barile della calce.

      - testo: "Chiedere alla vecchia del gatto"
        descrizione: "Nella casa che dà sul muro abita una donna anziana con un gatto senza coda. Dalla sua finestra il cimitero si vede tutto."
        prova: { attributo: sociale, abilita: [empatia, conoscenze-della-strada], difficolta: Media }
        successo:
          titolo: La luce dei Vardesi
          testo: |
            La vecchia ti fa entrare per il gatto, che ti ha preso in simpatia,
            e per un po' parla soltanto di lui. Poi ti porta alla finestra.
            Alcune notti, dice, dentro la cappella dei Vardesi c'è una luce, e
            i Vardesi sono finiti tutti dentro quella cappella da prima che lei
            si sposasse. «Una luce piccola, da candela di sego, e dopo la
            seconda campana» dice. «I morti la candela non se la portano.» La
            notte dopo, alla seconda campana, bussi alla grata.
          pe: { empatia: 5 }
          segue: il-becchino-di-notte
        fallimento:
          titolo: Il gatto
          testo: |
            La vecchia ti fa entrare e ti parla del gatto, di come ha perso la
            coda e di quanto mangia. Quando porti il discorso sul cimitero
            cambia argomento, e quando ci riprovi lo cambia ancora. Alla fine
            ti accompagna alla porta con una fetta di torta avvolta in un
            tovagliolo, e ti chiede di tornare a trovare il gatto.

      - testo: "Lasciare un biglietto sulla lapide"
        descrizione: "Se qualcuno viene di notte a pulirla, la leggerà. Ci vogliono un mozzicone di matita e qualche giorno di pazienza."
        costo: 2
        esito:
          titolo: La risposta
          testo: |
            Scrivi su un foglio piegato che il ragazzo delle fosse ha la tosse e
            ha paura, e che chi pulisce questa pietra forse lo sa. Lo fermi sotto
            un sasso, ai piedi della lapide. Per due notti il foglio resta dov'è.
            La terza mattina c'è una riga in più, in una grafia minuta, *dopo la
            seconda campana, cappella dei Vardesi, vieni solo*. Il sasso è stato
            rimesso esattamente al suo posto, nell'impronta che aveva lasciato
            nella ghiaia.
          pe: { resilienza: 5 }
          segue: il-becchino-di-notte

  - id: il-becchino-di-notte
    immagine: personaggi/gundo-marl
    titolo: Il becchino di notte
    tipo: seguito
    luogo: Cimitero di Qir-Azel, la cappella dei Vardesi
    area: citta-bassa
    requisiti: [cimitero.lapide == 0]
    testo: |
      La cappella dei Vardesi è addossata al muro di levante, e dentro brucia
      una candela di sego sul coperchio di un sarcofago. I Vardesi erano
      mercanti di sale. L'ultimo è morto senza figli prima che il garzone
      nascesse, e sul muro di fondo i loro nomi occupano tre file, con la terza
      che si ferma a metà. Sul sarcofago, accanto alla candela, ci sono un
      registro aperto e una penna da scrivano.

      Gundo Marl è seduto su uno sgabello basso, curvo sulle pagine, con la
      tunica grigia da becchino e un amuleto dell'Albero Rosso che dal collo
      gli pende fino al registro. Ha le mani lunghe e sottili, e non smette di
      scrivere quando entri. «Ti ho visto dalla grata, con il ragazzo» dice
      alla pagina. «Quello che fai lo fai con cura.»

      Gli chiedi dov'è stato. Lui finisce la riga, asciuga la penna su uno
      straccio e solo allora alza gli occhi. Sono chiari e svegli, in una
      faccia vecchia. «Dove sono stato quella notte resta fra me e
      l'Albero» dice. «Di giorno per adesso non ci sono. Chi è sceso nella cripta sapeva a che
      ora spengo la candela, e mi va bene che adesso mi creda sparito.»

      Si tocca l'amuleto con due dita. Poi indica con il mento la fila vecchia,
      dalla parte della lapide senza nome, e aspetta che sia tu a chiedere.
    opzioni:
      - testo: "Chiedergli della lapide"
        descrizione: "Una pietra senza nome e senza date, pulita di notte da un uomo che di giorno non esiste."
        costo: 0
        esito:
          titolo: Un altro mestiere
          testo: |
            Gundo ci mette un po' a rispondere, e intanto chiude il registro.
            «Quando facevo un altro mestiere lui e io portavamo la roba per
            strade dove la Gilda non mette dazi» dice, con gli occhi sul
            coperchio del sarcofago. «Una notte è caduto, e il suo nome lo cercavano in tre
            città. L'ho portato fin qui sulle spalle e gliel'ho tolto, il nome,
            così nessuno veniva a chiedere niente alla sua famiglia.» Riapre il
            registro alla pagina della fila vecchia. «Il giorno dopo ho chiesto
            al becchino di allora se gli serviva un garzone.»
          segue: il-becchino-di-notte

      - testo: "Promettergli di tacere"
        descrizione: "Per il Velo e per la città Gundo Marl è sparito. Può restarlo ancora un po'."
        esito:
          titolo: La riga a margine
          testo: |
            Gli dici che di te può fidarsi e che non lo saprà nessuno. Gundo ti
            guarda il tempo di una riga, poi annuisce una volta e intinge la
            penna. In margine alla pagina della fila vecchia scrive il tuo nome
            con la sua grafia minuta, e accanto una data. «Al ragazzo dai una
            mano di giorno» dice, senza smettere di scrivere. «Di notte, se serve, la grata è
            aperta.» Quando esci la candela è ancora accesa, e lui ha ripreso a
            scrivere.
          pe: { galateo: 5 }
          imposta: { cimitero.lapide: 1 }
          effetti: { rep.cimitero: 1 }

      - testo: "Chiedergli di dirlo almeno al garzone"
        descrizione: "Il ragazzo tiene il cimitero da solo con quella tosse, e crede che il vecchio sia morto. Merita di saperlo."
        prova: { attributo: sociale, abilita: [empatia, persuasione], difficolta: Media }
        successo:
          titolo: La paga del venerdì
          testo: |
            Gli racconti del berretto che il ragazzo rigira fra le dita e della
            tosse che lo piega in due sulle fosse. Gundo ascolta fino in fondo
            guardando la candela. «Il ragazzo parla con tutti» dice. «Però è
            puntuale.» Il venerdì dopo il garzone trova la paga sotto il sasso
            della soglia del capanno, contata giusta, con un biglietto nella
            grafia minuta. Lo legge, se lo mette nel berretto e da quel giorno
            ti saluta togliendoselo due volte.
          pe: { empatia: 5 }
          imposta: { cimitero.lapide: 1 }
          effetti: { rep.cimitero: 1 }
        fallimento:
          titolo: Non ancora
          testo: |
            Gli racconti della tosse del ragazzo, e Gundo scuote la testa prima
            che tu abbia finito. «Il ragazzo parla con tutti, e con la tosse
            parla anche più forte» dice. «Lo saprà quando lo decido io.» Ti fa
            promettere di tacere anche con lui, e tu prometti. Prima che tu
            esca ti mette in mano qualche moneta per il ragazzo, da dargli come se
            fossero tue.
          imposta: { cimitero.lapide: 1 }
          effetti: { rep.cimitero: 1 }

      - testo: "Offrirti di portargli quello che gli serve"
        descrizione: "Un uomo che di giorno non esiste non può andare al mercato a comprarsi le candele."
        requisiti: [monete >= 3]
        esito:
          titolo: Candele di sego
          testo: |
            Gli chiedi che cosa gli manca. Gundo ci pensa sul serio, contando
            sulle dita lunghe. Gli servono candele di sego e inchiostro nero, e
            del pane dice che se lo procura da sé. Il giorno dopo glieli porti in
            una cesta coperta da un panno, e li lasci dietro la grata come ti ha
            detto. La sera nella cesta vuota trovi il resto delle tue monete
            contato giusto, con una ricevuta firmata da due iniziali minute.
          pe: { conoscenze-della-strada: 5 }
          imposta: { cimitero.lapide: 1 }
          effetti: { rep.cimitero: 1, monete: -3 }

  # ------------------------------------------------------------ storia a 4 · i registri di Gundo
  - id: i-registri-di-gundo
    presso: cimitero-di-qir-azel
    immagine: personaggi/gundo-marl
    titolo: I registri di Gundo
    sommario: "Gundo Marl ha messo i conti della razzia accanto alla lista del Velo, e i conti non tornano. Ti aspetta stanotte nella cappella dei Vardesi."
    luogo: Cimitero di Qir-Azel, la cappella dei Vardesi
    area: citta-bassa
    requisiti: [rep.cimitero >= 4, cimitero.registri == 0, cimitero.lapide >= 1]
    testo: |
      Stanotte sul sarcofago dei Vardesi i registri sono tre. A sinistra c'è
      quello del garzone, con le pagine della razzia scritte grosse. In mezzo
      c'è un foglio con il sigillo della Cattedrale, la lista dei morti che il
      Velo ha benedetto nelle fosse comuni. Il terzo è un quaderno piccolo
      rilegato in tela nera, e Gundo lo tiene chiuso sotto la mano.

      «Il Velo ne ha benedetti cinquantuno» dice al foglio. «Il ragazzo ne ha
      scritti cinquanta, e non sempre dove. Io la terra della fossa grande
      l'ho guardata, e ha un morto in più di quelli che dice lui.» Con un dito
      gira verso di te il registro del garzone.

      Poi apre il quaderno nero. Dentro, a colonne, ci sono le notti dopo la
      razzia, ognuna con l'ora accanto al punto del muro. Ogni tre notti
      qualcuno scavalca dal bosso spezzato e va alla fossa grande, ci resta fino alla prima
      campana e se ne va da dove è venuto. «Non tocca la cripta» dice Gundo.
      «Va dai morti nuovi, e io con questa gamba non lo prendo.»

      Sullo scaffale dei Vardesi, più in là, c'è un registro più vecchio con
      *centoquarantacinque* sul dorso. Gundo vede dove guardi e non lo sposta.

      *Cinquantuno da una parte e cinquanta dall'altra, e in mezzo uno che
      viene a trovarli.* Le dita ti si muovono da sole sul bordo del
      sarcofago, a rifare il conto.
    opzioni:
      - testo: "Sfogliare il registro del centoquarantacinque"
        descrizione: "L'anno dell'incendio e delle Notti Cucite. Gundo i morti di quel mese li ha messi in terra uno per uno."
        immagine: ambientazione/cripta-di-idrian-sollen
        costo: 0
        esito:
          titolo: Scuciti
          testo: |
            Le pagine di quel mese hanno venticinque nomi scritti uno per riga.
            Accanto a ognuno Gundo ha segnato la fossa e una parola sola,
            *scucito*. Gli chiedi che cosa vuol dire. «Il Cucitore li lasciava
            cuciti insieme, come offerte» dice, senza alzare la voce. «Io li ho scuciti, uno alla volta, perché nessuno finisse
            sotto terra attaccato a un altro. Ci ho messo nove notti.» Richiudi
            il registro, e per il resto della notte ti sembra di sentire sotto
            le dita il filo tirato.
          effetti: { tormento: 1 }
          segue: i-registri-di-gundo

      - testo: "Rifare i conti sulle pagine del ragazzo"
        descrizione: "La lista del Velo da una parte e il registro del garzone dall'altra. Il morto che manca deve stare da qualche parte."
        prova: { attributo: mentale, abilita: [accademiche, percezione], difficolta: Media }
        successo:
          titolo: Il quarto giorno
          testo: |
            Metti la lista del Velo accanto alle pagine del garzone e scorri i
            nomi con due dita, uno per mano. Al quarto giorno dopo la razzia la
            lista del Velo ha un nome che nel registro manca, *Teodo Sarne,
            conciatore*. Nel registro, quel giorno, c'è soltanto una croce senza
            nome accanto alla fossa grande. Gundo ci tiene sopra il dito. «Lo
            ha messo giù senza sapere chi era» dice. «Chi viene di notte invece
            lo sa.» La notte dopo vi appostate tutti e due vicino al bosso.
          pe: { accademiche: 5 }
          segue: la-fossa-grande
        fallimento:
          titolo: I conti sbagliati
          testo: |
            Metti la lista del Velo accanto alle pagine del garzone e conti, e
            ogni volta ti viene un numero diverso, perché il garzone certi morti
            li ha scritti per nome e certi per mestiere. A mezzanotte Gundo ti
            toglie i fogli di mano e ricomincia da capo con il suo dito lungo.
            Ti dice di tornare quando hai dormito, e intanto continua a contare
            muovendo le labbra.

      - testo: "Fare la posta al bosso spezzato"
        descrizione: "Ogni tre notti, dice il quaderno nero, e stanotte è la terza. Il muro dal lato del vicolo non ha ripari."
        prova: { attributo: fisico, abilita: [furtivita, atletica], difficolta: Media }
        successo:
          titolo: Lo scialle
          testo: |
            Ti accucci dietro il bosso con il mantello sulla testa e le
            ginocchia nella terra umida. Dopo la seconda campana una figura
            avvolta in uno scialle scuro scavalca il muro a fatica, e cade in
            piedi a un passo da te senza vederti. Ha in mano una lanterna
            spenta e un fagotto. La lasci passare e la segui fra le tombe, tenendoti nell'ombra dei cipressi,
            fino alla fossa grande.
          pe: { furtivita: 5 }
          segue: la-fossa-grande
        fallimento:
          titolo: Il vicolo
          testo: |
            Ti accucci dietro il bosso e aspetti, e dopo la seconda campana
            senti qualcuno arrampicarsi dall'altra parte del muro. Ti sporgi per
            vedere meglio, e una testa avvolta in uno scialle si affaccia sulla
            cresta proprio sopra di te. Per un momento vi guardate. Poi la testa
            sparisce, e senti dei passi che corrono nel vicolo cieco e poi
            fuori. Gundo, la mattina, scrive nel quaderno nero una riga con il
            tuo nome.

      - testo: "Parlare con il garzone"
        descrizione: "Le pagine sono sue. Se c'è un morto senza nome nella fossa grande, il ragazzo sa perché."
        prova: { attributo: sociale, abilita: [empatia, persuasione], difficolta: Media }
        successo:
          titolo: Bruciato
          testo: |
            Lo trovi seduto sulla carriola a mangiare pane e cipolla, e gli
            parli della fossa grande senza nominare Gundo. Il garzone smette di
            masticare. Racconta che il quarto giorno è arrivato un carro con un
            uomo bruciato e senza nome, e che la fossa grande
            era ancora aperta. «L'ho messo giù la sera e la riga l'ho lasciata
            per dopo» dice, girandosi il berretto fra le mani. «Poi la riga non
            l'ho più trovata.» Gli dici di stare tranquillo, e quella notte ti
            apposti alla fossa con Gundo.
          pe: { empatia: 5 }
          segue: la-fossa-grande
        fallimento:
          titolo: Il berretto calcato
          testo: |
            Lo trovi seduto sulla carriola a mangiare pane e cipolla, e gli
            chiedi del registro della razzia in un modo che suona come
            un'accusa. Il garzone si calca il berretto fino alle orecchie e
            dice che i morti li ha messi giù tutti quanti, e che chi vuole
            contarli se li conti da solo. Per il resto del giorno, quando lo
            incroci fra le tombe, cambia vialetto.

      - testo: "Aspettare con Gundo alla fossa grande"
        descrizione: "Senza appostamenti e senza domande. Due persone sedute al buio, una delle quali sa aspettare da venticinque anni."
        costo: 2
        esito:
          titolo: Al buio
          testo: |
            Vi sedete su una lapide bassa a qualche passo dalla fossa grande,
            con la lanterna spenta fra i piedi. Gundo non parla, e dopo un'ora
            smetti anche tu di avere voglia di farlo. La prima notte non viene
            nessuno, e la seconda passa soltanto la ronda del Velo. La terza,
            dopo la seconda campana, qualcuno scavalca dal bosso e cammina
            dritto fino alla fossa senza guardarsi intorno.
          pe: { resilienza: 5 }
          segue: la-fossa-grande

  - id: la-fossa-grande
    immagine: ambientazione/cimitero-di-qir-azel
    titolo: La fossa grande
    tipo: seguito
    luogo: Cimitero di Qir-Azel, le fosse comuni della razzia, di notte
    area: citta-bassa
    requisiti: [cimitero.registri == 0]
    testo: |
      È una ragazza sui vent'anni, con uno scialle scuro sopra il grembiule e
      le mani rosse delle lavandaie. Si siede sulla terra della fossa grande e
      accende la lanterna. Dal fagotto tira fuori una pipa di gesso con il
      fornello annerito, e la posa sulla terra davanti a sé. Poi comincia a
      raccontare alla terra, a bassa voce, dei prezzi del sapone e di un
      gatto del vicinato. Quando ti avvicini salta in piedi
      e afferra la lanterna come se volesse tirartela.

      Si chiama Tilde Sarne. Suo padre conciava pelli per la Conceria Kasselt,
      ed è morto in piazza la sera del Festival. Il Velo le ha detto che sta
      qui nella fossa grande, benedetto insieme agli altri, però il garzone,
      quando gliel'ha chiesto, nel registro il suo nome non l'ha trovato.
      «Vengo di notte perché di giorno lavo» dice, «e perché qui di giorno c'è
      gente che mi guarda.» Sua madre è sepolta dall'altra parte del
      cimitero, sotto una tavoletta che il padre aveva inciso da sé. Lei
      voleva metterli vicini, sotto la stessa tavoletta.

      Alle tue spalle, al buio, senti Gundo che si appoggia alla pala e non si
      fa vedere.
    opzioni:
      - testo: "Portarle il registro con il nome"
        descrizione: "Nella cappella dei Vardesi Gundo ha la penna pronta. Un nome scritto è un posto, per chi lo cerca."
        esito:
          titolo: Fossa grande, lato muro
          testo: |
            Vai alla cappella e torni con il registro aperto. Gundo ha scritto
            il nome con la sua grafia minuta, *Teodo Sarne, conciatore, fossa
            grande, lato muro, il quarto*, perché la terra gliel'ha detto. Tilde
            legge la riga con l'indice e la rilegge. Poi chiede se può tornare
            di giorno, e le rispondi di sì. La notte dopo nel quaderno nero non
            c'è nessuno al bosso, e la pipa di gesso è piantata nella terra al
            lato del muro.
          pe: { empatia: 5 }
          imposta: { cimitero.registri: 1 }
          effetti: { rep.cimitero: 1 }

      - testo: "Aiutarla a riportarlo accanto alla moglie"
        descrizione: "Aprire di notte il lato di una fossa comune e cercare un uomo fra cinquanta. Gundo dice che si può fare, e che costa."
        prova: { attributo: mentale, abilita: [medicina, percezione], difficolta: Media }
        successo:
          titolo: Il grembiule di cuoio
          testo: |
            Gundo segna con la pala il punto, e scavate in tre fino alle prime
            luci con un fazzoletto bagnato d'aceto sulla bocca. Teodo lo
            riconosci dal grembiule di cuoio, che il fuoco ha
            indurito senza bruciarlo, e dalle mani macchiate di tannino. Lo
            portate su una barella di assi fino alla tavoletta della moglie, e
            Gundo apre la fossa accanto con una cura che non gli avevi mai
            visto. All'alba Tilde ci rimette sopra la pipa. Tu ti lavi le mani
            nel secchio tre volte, e l'odore resta.
          pe: { medicina: 5 }
          imposta: { cimitero.registri: 1 }
          effetti: { rep.cimitero: 1, tormento: 1 }
        fallimento:
          titolo: Fra cinquanta
          testo: |
            Gundo segna con la pala il punto, e scavate fino alle prime luci
            con l'aceto sulla bocca. Sotto la terra i morti della razzia
            sono stretti l'uno all'altro, e quelli bruciati si somigliano
            tutti. Né tu né Tilde riuscite a dire quale sia Teodo. Richiudete
            la terra con cura e Gundo la batte con il dorso della pala. Tilde scrive il nome
            del padre su un sasso e lo lascia lì, e tu per il resto della notte
            non riesci a smettere di vedere le mani dei morti.
          imposta: { cimitero.registri: 1 }
          effetti: { rep.cimitero: 1, tormento: 1.5 }

      - testo: "Convincerla a lasciarlo con gli altri"
        descrizione: "Nella fossa grande ci sono cinquanta uomini e donne della sua piazza. Forse a suo padre la compagnia non dispiace."
        prova: { attributo: sociale, abilita: [empatia, persuasione], difficolta: Media }
        successo:
          titolo: La prima tavoletta
          testo: |
            Le dici che suo padre è morto con la sua piazza, e che nella fossa
            grande ci sono i vicini con cui beveva la sera. Tilde ci pensa con
            la pipa fra le mani. Alla fine chiede se può mettere una tavoletta
            con il nome anche sopra una fossa comune. Gundo, dal buio, dice di
            sì. La settimana dopo sulla fossa grande le tavolette sono quattro,
            e il garzone deve imparare a rastrellarci intorno.
          pe: { persuasione: 5 }
          imposta: { cimitero.registri: 1 }
          effetti: { rep.cimitero: 1 }
        fallimento:
          titolo: Lo scialle stretto
          testo: |
            Le dici che suo padre sta bene dov'è, con la sua piazza, e lei si
            stringe lo scialle sulle spalle e ti risponde che i vicini non
            l'hanno mai chiamato per nome. Raccoglie la pipa e se ne va dal
            cancello, che Gundo le apre senza farsi vedere. Nel quaderno nero
            le notti dopo il bosso resta vuoto. Gundo scrive il nome di Teodo
            nel registro lo stesso, con la grafia minuta.
          imposta: { cimitero.registri: 1 }
          effetti: { rep.cimitero: 1 }

  # ------------------------------------------------------------ storia a 6 · le chiavi del cimitero
  - id: le-chiavi-del-cimitero
    presso: cimitero-di-qir-azel
    immagine: personaggi/gundo-marl
    titolo: Le chiavi del cimitero
    sommario: "Gundo Marl ha in mano un anello di ferro con due chiavi. Prima di dartele vuole insegnarti dove non si scava."
    luogo: Cimitero di Qir-Azel, di notte
    area: citta-bassa
    requisiti: [rep.cimitero >= 6, cimitero.custode == 0, cimitero.lapide >= 1]
    testo: |
      Gundo ti aspetta fuori dalla cappella dei Vardesi, in piedi in mezzo al
      vialetto sotto la luna. Curvo com'è ti arriva alla spalla, e si
      appoggia alla pala come a un bastone. Dall'altra mano gli pende un anello
      di ferro con due chiavi, una grande per il cancello nord e una piccola,
      unta d'olio, per il capanno degli attrezzi.

      «Di giorno qui serve qualcuno che apra il cancello e sappia rispondere a
      un prete, e il ragazzo con quella tosse non ce la fa» dice. «Le chiavi però le do a chi sa dove non scavare. In questo
      cimitero ci sono più morti che lapidi, e alcuni li ho messi giù io dove il
      Velo non guarda.» Fa tintinnare l'anello. «Domattina c'è da aprire una
      fossa per una lavandaia dei Ponti, e il posto stanotte lo scegli tu. Se
      scegli male, la pala tocca uno che non va toccato.»

      Si avvia per il vialetto zoppicando, e la pala batte sulla ghiaia a ogni
      passo, sempre con lo stesso suono. Sotto la luna i cipressi storti fanno
      ombre lunghe fino al muro.

      *Venticinque anni di fosse, e la mappa ce l'ha soltanto in testa.* Senza
      volerlo hai già cominciato a contare i passi dal cancello.
    opzioni:
      - testo: "Leggere il terreno"
        descrizione: "Dove la terra è stata mossa l'erba cresce in un altro modo, anche dopo vent'anni. Bisogna saperla guardare."
        prova: { attributo: mentale, abilita: [percezione, natura], difficolta: Media }
        successo:
          titolo: L'erba
          testo: |
            Ti chini con la lanterna bassa e cammini piano fra le tombe. Dove
            qualcuno ha scavato l'erba è più verde e la terra è appena più
            bassa, e in certi punti il trifoglio disegna un rettangolo che a
            guardarlo dall'alto non vedresti. Ne trovi sei fra le lapidi della
            fila nuova. Il settimo posto, vicino al cipresso più storto, ha la
            terra dura e l'erba uguale a quella intorno. Gundo ci pianta la pala
            e annuisce.
          pe: { percezione: 5 }
          segue: il-mazzo-di-chiavi
        fallimento:
          titolo: Il trifoglio
          testo: |
            Ti chini con la lanterna e cerchi le differenze nell'erba, e alla
            fine scegli un posto vicino al cipresso più storto. Gundo ci pianta
            la pala, poi la ritira. «Qui sotto c'è una donna dei Ponti, dal
            centotrenta» dice. «Non l'ha mai cercata nessuno, e non
            comincio io a disturbarla.» Ti riporta alla cappella senza
            fretta, e le chiavi tornano nella tasca della tunica.

      - testo: "Studiare il registro di Gundo"
        descrizione: "Venticinque anni di righe minute. Se Gundo ha messo qualcuno dove il Velo non guarda, qualcosa sulla carta deve averlo lasciato."
        prova: { attributo: mentale, abilita: accademiche, difficolta: Media }
        successo:
          titolo: I cerchietti
          testo: |
            Sfogli il registro alla luce della candela e trovi, in margine a
            certe pagine, un cerchietto minuscolo tracciato con la punta della
            penna, senza nome accanto. Sono ventitré in venticinque anni.
            Ognuno sta vicino alla riga di una fossa vera, come se Gundo avesse
            segnato il vicino di casa. Li riporti fila per fila su un foglio e
            scegli un posto lontano da tutti. Gundo guarda il foglio, poi lo
            brucia sulla candela e ti dice che il posto va bene.
          pe: { accademiche: 5 }
          segue: il-mazzo-di-chiavi
        fallimento:
          titolo: Le righe minute
          testo: |
            Sfogli il registro alla luce della candela finché le righe minute ti
            ballano davanti agli occhi. Scegli un posto di cui il registro non
            parla. Gundo guarda il posto e scuote la testa. «Dove il registro
            non dice niente è proprio dove guardare» dice, e ti riprende il
            libro dalle mani. Ti riaccompagna al cancello e le chiavi restano a lui.

      - testo: "Chiedere al garzone dove il vecchio non lo faceva scavare"
        descrizione: "Il ragazzo scava qui da anni. Qualche volta Gundo l'avrà fermato, e uno se le ricorda, certe tirate d'orecchie."
        prova: { attributo: sociale, abilita: [empatia, conoscenze-della-strada], difficolta: Media }
        successo:
          titolo: Le tirate d'orecchie
          testo: |
            Il garzone si gratta la testa sotto il berretto e poi si mette a
            contare sulle dita. Ti porta in giro per il cimitero e ti fa vedere
            i posti dove il vecchio lo prendeva per l'orecchio e lo tirava via,
            senza mai spiegargli niente, e sono molti più di quanti ne avresti
            trovati da solo. Quando torni da Gundo con l'elenco lui lo ascolta
            tutto e corregge un posto solo. «Il ragazzo ha buona memoria,
            quando gli fa comodo» dice.
          pe: { empatia: 5 }
          segue: il-mazzo-di-chiavi
        fallimento:
          titolo: Il berretto
          testo: |
            Il garzone si gratta la testa sotto il berretto e dice che il
            vecchio lo tirava per l'orecchio dappertutto, e che quindi
            dappertutto è un posto dove non si scava. Ci ride sopra, poi
            tossisce. Torni da Gundo con le mani vuote, e lui ti dice che per
            stanotte il posto lo sceglie lui, e le chiavi restano nella sua
            tasca.

      - testo: "Sondare il terreno con il ferro"
        descrizione: "Una sbarra di ferro lunga quanto un uomo, da piantare in terra cento volte. Dove la terra cede, qualcuno ha già scavato."
        prova: { attributo: fisico, abilita: [resistenza, atletica], difficolta: Media }
        successo:
          titolo: Cento colpi
          testo: |
            Pianti la sbarra in terra e la tiri fuori, e poi la pianti un passo
            più in là, per tutta la fila nuova, finché le spalle ti bruciano.
            Dove la terra è vergine la sbarra si ferma a un palmo, mentre nei
            punti già scavati scende fino al pugno. Segni ogni punto con un
            sasso, e all'alba la fila è piena di sassi tranne in un rettangolo vicino al
            cipresso storto. Gundo guarda i sassi e ti dice che ci hai messo
            una notte a fare quello che lui fa con gli occhi.
          pe: { resistenza: 5 }
          segue: il-mazzo-di-chiavi
        fallimento:
          titolo: Le spalle
          testo: |
            Pianti la sbarra in terra e la tiri fuori per metà della notte, e
            poi le spalle non ti rispondono più. La sbarra si incastra fra due
            radici e ci perdi un'ora a liberarla. All'alba hai segnato mezza
            fila, e la lavandaia arriva fra poche ore. Gundo sceglie il posto
            da solo in un momento, e le chiavi restano nella sua tasca.
          effetti: { ferite: 0.5 }

      - testo: "Farti accompagnare da Gundo per tutta la notte"
        descrizione: "Lui sa dove sono tutti. Basta camminargli accanto e ascoltare, anche quello che non dice."
        quando: [pista.pelle < 6]
        costo: 2
        esito:
          titolo: La pala in terra
          testo: |
            Gundo cammina piano davanti a te fra le tombe, e ogni tanto si ferma
            a battere la pala in terra. «Qui no» dice, e qualche passo più in là
            batte di nuovo e dice «qui sì». Non ti dice chi c'è sotto, e tu non
            lo chiedi per tutta la notte. All'alba ti fermi tu, vicino al
            cipresso più storto, e batti in terra con il tacco. Gundo guarda
            prima il punto e poi te, e annuisce.
          pe: { resilienza: 5 }
          segue: il-mazzo-di-chiavi

      - testo: "Farti accompagnare da Gundo per tutta la notte"
        descrizione: "Lui sa dove sono tutti, anche i morti della notte della Pignatta. Basta camminargli accanto e ascoltare."
        quando: [pista.pelle >= 6]
        costo: 2
        esito:
          titolo: Puntuale
          testo: |
            Gundo cammina davanti a te fra le tombe e ogni tanto batte la pala in
            terra, e dice qui sì o qui no. Lungo il muro di levante si ferma
            davanti alla tavoletta di Mirko Vesh e la raddrizza con due dita.
            «I funerali dei suoi uomini li ha sempre pagati in contanti e in
            anticipo» dice. «Puntuale.» All'alba ti fermi tu,
            vicino al cipresso più storto, e batti in terra con il tacco. Gundo
            guarda prima il punto e poi te, e annuisce.
          pe: { resilienza: 5 }
          segue: il-mazzo-di-chiavi

      - testo: "Dirgli che non è il momento"
        descrizione: "Le chiavi di un cimitero sono un impegno lungo. Gundo sa aspettare meglio di chiunque."
        costo: 0
        esito:
          titolo: Nella tasca della tunica
          testo: |
            Gli dici che per adesso preferisci aiutare il ragazzo senza le
            chiavi in tasca. Gundo si rimette l'anello nella tasca della tunica
            e torna verso la cappella, zoppicando. Sulla soglia si ferma e si
            volta. «La lavandaia la seppellisco io» dice. «La prossima la
            scegli tu, quando vuoi.» La grata si richiude piano.

  - id: il-mazzo-di-chiavi
    immagine: personaggi/gundo-marl
    titolo: Il mazzo di chiavi
    tipo: seguito
    luogo: Cimitero di Qir-Azel, il capanno degli attrezzi, all'alba
    area: citta-bassa
    requisiti: [cimitero.custode == 0]
    testo: |
      Il cielo sopra il muro di levante comincia a schiarire quando Gundo ti
      porta alla porta del capanno degli attrezzi. Il garzone ha già cominciato
      a scavare nel posto che hai scelto, e la terra che viene su è gialla e
      pulita, senza niente dentro. Gundo resta nel capanno dietro la porta
      socchiusa, dove non lo vedono né il ragazzo né chi passa per la
      strada.

      Ti mette l'anello di ferro nel palmo e te lo chiude dentro la mano con
      le sue dita lunghe e fredde. «Il cancello si apre alla prima campana e
      si chiude al tramonto» dice alle chiavi. «Le righe del registro le firmi
      con le tue iniziali scritte piccole, e di notte io ci ripasso sopra. Se un prete
      chiede del becchino gli dici che il registro è in ordine, ed è la
      verità. Dove non si scava adesso lo sai.» Si tocca l'amuleto
      dell'Albero. «Se le chiavi non le vuoi, le appendo al chiodo
      nella cappella, e la prova te la faccio rifare da capo quando le
      vorrai.»

      Fuori, dalla fossa, il garzone si toglie il berretto e ti saluta.
    opzioni:
      - testo: "Prendere le chiavi"
        descrizione: "Il cancello nord e il capanno degli attrezzi. Di giorno il cimitero risponde a te."
        esito:
          titolo: L'olio sulle dita
          testo: |
            Chiudi la mano sulle chiavi. Quella del cancello è lunga quanto il
            palmo, e quella del capanno ti lascia l'olio sulle dita. Gundo
            apre il registro sul barile della calce e scrive in fondo alla
            pagina il tuo nome con la sua grafia minuta, e accanto *custode di
            giorno*. Poi ti stringe la mano una volta, sempre senza guardarti.
            Quando ti volti per ringraziarlo è già uscito dal retro del
            capanno, e lo vedi sparire fra i cipressi, curvo sulla pala, verso
            la cappella dei Vardesi.
          imposta: { cimitero.custode: 1 }
          effetti: { rep.cimitero: 1 }
      - testo: "Rendergli le chiavi"
        descrizione: "Per adesso preferisci restare uno che dà una mano. Gundo capirà, e il ragazzo forse no."
        esito:
          titolo: Il chiodo nella cappella
          testo: |
            Gli dici che per adesso preferisci restare uno che dà una mano, e
            gli rendi l'anello. Gundo lo soppesa sul palmo come se contasse le
            chiavi, poi se lo mette nella tasca della tunica. «Al chiodo nella
            cappella» dice. «Quando le vuoi, la prova la rifacciamo.» Dalla
            fossa il garzone ti guarda, e si rimette il berretto più lentamente
            del solito.

  # ------------------------------------------------------------ la carta
  - id: carta-un-funerale-povero
    immagine: ambientazione/citta-bassa
    titolo: Un funerale povero
    sommario: "In mezzo alla strada si è fermato un carretto con una cassa di assi, e la famiglia che lo spinge non sa più come andare avanti."
    luogo: Città Bassa, la strada del cimitero
    tipo: carta
    area: citta-bassa
    requisiti: [rep.cimitero < 2]
    testo: |
      La strada che scende verso il cimitero è di terra battuta, con un
      canaletto di scolo nel mezzo, e la ruota di un carretto ci è finita
      dentro fino al mozzo. Sul carretto c'è una cassa di assi d'abete legata
      con due corde, ed è scivolata di traverso. Dalle stanghe tirano una
      donna con le maniche rimboccate e un ragazzo di dieci o undici anni, e
      ogni volta che tirano la cassa scivola ancora un po'.

      Il ragazzo tiene sotto il braccio una tavoletta di legno con un nome
      inciso a coltello, e la stringe anche mentre tira. La gente passa
      rasente al muro e guarda da un'altra parte. Un ciabattino seduto sulla
      soglia della bottega smette di battere la suola per un momento, poi
      ricomincia più forte. In fondo alla strada si vede il muro di pietra blu
      del cimitero, e sopra il muro le punte dei cipressi storti.

      La donna si asciuga la fronte con il polso e ti guarda, senza chiederti
      niente.
    opzioni:
      - testo: "Spingere il carretto fino al cimitero"
        descrizione: "Una ruota nel canaletto e una cassa di traverso. Ci vogliono due braccia in più e un po' di fiato."
        esito:
          titolo: Fino al cancello
          testo: |
            Sollevi la ruota dal canaletto con la spalla, mentre la donna tiene
            ferma la cassa e il ragazzo tira. Poi spingi il carretto fino in
            fondo alla strada. Al cancello del cimitero vi aspetta un garzone
            con un berretto troppo grande, che prende le stanghe e si mette a
            tossire. La donna ti ringrazia con un cenno. Il garzone invece ti
            guarda bene in faccia, come se volesse ricordarsela, e ti dice che
            al capanno degli attrezzi due braccia in più servono sempre.
          pe: { atletica: 2 }
          effetti: { rep.cimitero: 0.5 }
      - testo: "Lasciare i soldi per la tavoletta"
        descrizione: "Una tavoletta incisa a coltello marcisce in tre inverni. Con poche monete il garzone del cimitero ne mette una di quercia."
        requisiti: [monete >= 2]
        esito:
          titolo: Quercia
          testo: |
            Metti qualche moneta nella mano della donna e le dici che al cimitero
            con quei soldi le danno una tavoletta di quercia, che dura di più.
            Lei guarda le monete e poi il figlio, che stringe la sua tavoletta
            d'abete ancora più forte. Ti ringrazia e le monete le tiene. Mentre
            la aiuti a tirare fuori la ruota dal canaletto, il ragazzo ti dice
            che il nome l'ha inciso lui, e che la tavoletta resta quella.
          pe: { empatia: 2 }
          effetti: { monete: -2 }
      - testo: "Tirare dritto"
        descrizione: "Hai i tuoi morti a cui pensare, e la strada è lunga."
        costo: 0
        esito:
          titolo: Rasente al muro
          testo: |
            Passi rasente al muro come gli altri, con gli occhi sulle punte dei
            cipressi. Alle tue spalle senti la ruota che esce dal canaletto con
            un tonfo, e qualcuno che ha deciso di aiutare al posto tuo. Quando
            ti volti all'angolo il ciabattino ha lasciato la soglia e spinge il
            carretto insieme alla donna.

      - testo: "Dire la preghiera dei morti sulla strada"
        descrizione: "Una preghiera del Velo detta a voce alta arriva fino in fondo alla via. Chi passa rasente al muro la conosce."
        quando: [origine.accolito-del-velo >= 1]
        esito:
          titolo: Il ciabattino
          testo: |
            Ti fermi accanto al carretto e cominci la preghiera dei morti a voce alta,
            come la diresti in Cattedrale. La donna lascia le stanghe e china la
            testa, e il ragazzo stringe la tavoletta contro il petto. Al secondo verso
            il ciabattino si alza dalla soglia e si toglie il grembiule. Viene a
            mettere la spalla contro la cassa senza una parola, e dietro di lui si
            fermano due facchini che fino a un momento prima guardavano il muro. Il
